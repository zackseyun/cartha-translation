base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/004/024.yaml
  text: For just as the neighbors of Zion have now seen your captivity[b][a], so they will soon see the salvation from your God that will come upon you with great glory and the splendor of the Eternal.
  footnotes:
  - marker: a
    text: Or 'deliverance' for 'salvation.' The Greek σωτηρία can denote rescue or deliverance as well as salvation.
    reason: lexical_alternative
  - marker: b
    text: Or 'the everlasting One' for 'the Eternal.' The Greek has the substantive adjective τοῦ αἰωνίου.
    reason: lexical_alternative
translation:
  language: ko
  text: 시온의 이웃들이 지금 너희가 포로가 된 것을 보았듯이, 그들도 곧 너희 하나님에게서 오는 구원[a]을 보게 될 것입니다. 그 구원은 큰 영광과 영원하신 분[b]의 찬란함과 함께 너희에게 임할 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘구출’ 또는 ‘해방’. 그리스어 σωτηρία는 ‘구원’뿐 아니라 ‘구출’이나 ‘해방’을 뜻할 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘영원하신 이’. 그리스어는 실질형용사 τοῦ αἰωνίου를 사용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ πάροικοι Σειὼν
  english_pob_choice: the neighbors of Zion
  chosen_korean: 시온의 이웃 민족들
  alternatives_korean:
  - 시온의 이웃들
  - 시온 주변에 사는 사람들
  - 시온 곁의 거류민들
  lexicon: LSJ
  rationale: πάροικοι는 단순한 ‘주변 사람들’보다 시온을 둘러싼 외부 집단을 가리키는 맥락이어서, 현대 한국어에서는 ‘이웃 민족들’이 관찰자 집단의 의미를 자연스럽게 드러냅니다.
- source_word: αἰχμαλωσίαν
  english_pob_choice: captivity
  chosen_korean: 포로됨
  alternatives_korean:
  - 포로 생활
  - 포로 상태
  - 사로잡힘
  lexicon: LSJ
  rationale: 명사 αἰχμαλωσία는 적에게 붙잡힌 상태를 가리키므로, ‘포로됨’이 결과 상태를 간명하게 살리고 ‘포로 생활’보다 덜 해석적입니다.
- source_word: σωτηρίαν
  english_pob_choice: salvation
  chosen_korean: 구원
  alternatives_korean:
  - 구출
  - 구해 주심
  - 구제
  lexicon: LSJ
  rationale: 문맥은 바벨론 포로에서의 회복이지만, 본문은 하나님의 구원 행위를 말하므로 한국어 성서 어휘로는 ‘구원’이 적절합니다.
- source_word: παρὰ τοῦ θεοῦ ὑμῶν
  english_pob_choice: from your God
  chosen_korean: 너희 하나님에게서 오는
  alternatives_korean:
  - 너희 하나님으로부터 오는
  - 너희 하나님께로부터 오는
  - 너희 하나님에게서
  lexicon: LSJ
  rationale: παρά + 속격은 출처를 나타내므로 ‘~에게서 오는’으로 옮겨 원문의 출처 감각을 살렸습니다.
- source_word: τοῦ αἰωνίου
  english_pob_choice: the Eternal
  chosen_korean: 영원하신 분
  alternatives_korean:
  - 영원하신 이
  - 영원한 분
  - 영원하신 하나님
  lexicon: LSJ
  rationale: 관사 있는 형용사로 하나님을 지칭하는 서술적 호칭이므로, 명시적 ‘하나님’을 덧붙이지 않고도 인격적 호칭이 드러나는 ‘영원하신 분’을 택했습니다.
theological_decisions:
- issue: σωτηρία의 종교적·역사적 의미 중 무엇을 우선할 것인가
  chosen_reading: 구원
  alternative_readings:
  - 구출
  - 해방
  rationale: 즉각적 맥락은 포로 회복이지만, 본문은 하나님의 구원 행위를 예언적으로 선포하므로 ‘구원’이 역사적 회복과 신학적 무게를 함께 담습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 6
- issue: τοῦ αἰωνίου를 하나님의 칭호로 어떻게 처리할 것인가
  chosen_reading: 영원하신 분
  alternative_readings:
  - 영원하신 이
  - 영원하신 하나님
  rationale: 그리스어는 실질형용사로 신적 칭호를 형성하므로, ‘영원하신 분’이 칭호성을 유지하면서 원문에 없는 명사 ‘하나님’을 과잉 보충하지 않습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 6
