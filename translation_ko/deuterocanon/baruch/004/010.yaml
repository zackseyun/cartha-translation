  text: For behold[a], the captivity of my sons and daughters[b], which the Everlasting One brought upon them.
  footnotes:
  - marker: a
    text: Or 'the exile of my sons and daughters.' The Greek αἰχμαλωσία can denote captivity more broadly, including deportation into exile.
    reason: lexical_alternative
  - marker: b
    text: Or 'the Eternal One.' The Greek reads a divine title, ὁ αἰώνιος, literally 'the everlasting/eternal one.'
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오[a]. 내 아들들과 딸들의 포로 상태[b], 곧 영원하신 분께서 그들에게 내리신 그것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘보십시오’보다 더 직설적으로 ‘보라’로 옮길 수 있습니다. ἰδοὺ는 주의를 끄는 감탄사/지시사입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘유배’로 옮길 수 있습니다. αἰχμαλωσία는 포로로 잡힌 상태와 그로 인한 이주를 함께 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
