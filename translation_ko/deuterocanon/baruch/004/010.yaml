    text: 또는 더 직설적으로 ‘보라’로 옮길 수 있습니다. ἰδοὺ는 주의를 끄는 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘유배’로 옮길 수 있습니다. αἰχμαλωσία는 포로로 잡힌 상태와 그에 따른 강제 이주를 함께 가리킬 수 있습니다.
    reason: lexical_alternative
