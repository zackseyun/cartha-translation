  rationale: 그리스어는 ‘율법’이라고 특정하지 않고 τὰ ἀρεστά τοῦ θεοῦ라는 더 넓은 표현을 쓰므로, 번역도 그 긴장을 유지했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
