- from: 우리는 복됩니다, 이스라엘아, 하나님께서 기뻐하시는 것이 우리에게 알려졌기 때문입니다.[a]
  to: 이스라엘아, 우리는 복이 있습니다. 하나님께서 기뻐하시는 것들이 우리에게 알려져 있기 때문입니다.
  rationale: 현대 합쇼체에 맞게 μακάριοι를 ‘복이 있습니다’로 고치고, τὰ ἀρεστά의 복수성과 γνωστά의 상태 의미를 각각 ‘것들이’와 ‘알려져 있기’로 반영했습니다. ‘율법’ 등으로 의미를 좁히지 않았으며, 불필요하고 부정확한 어휘 각주는 삭제했습니다.
