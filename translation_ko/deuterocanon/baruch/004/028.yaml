  - …로 기울었습니다
  - …로 가게 되었습니다
  lexicon: BDAG
  rationale: ‘생겨나서 ~하게 되다’의 결과 상태를 직역하기보다, 마음이 بالفعل 그 방향으로 향했다는 점을 살려 ‘…하려고 하였던’으로 옮겼습니다.
- source_word: πλανηθῆναι ἀπὸ τοῦ θεοῦ
  english_pob_choice: going astray from God
  chosen_korean: 하나님에게서 떠나 길을 잃다
  alternatives_korean:
  - 하나님에게서 벗어나다
