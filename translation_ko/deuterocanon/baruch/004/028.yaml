base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/004/028.yaml
  text: For just as your mind was set on going astray from God[a], so, as you return, seek him ten times more.
  footnotes:
  - marker: a
    text: Or 'seek him tenfold as you return.' The Greek literally says 'make [it] tenfold, returning to seek him,' with the intensified object implied by context.
    reason: lexical_alternative
translation:
  language: ko
  text: 너희 마음이 하나님에게서 떠나 길을 잃는 쪽으로 기울었던 것처럼, 돌아오면서 그분을 열 배로 찾으십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 직역하면 ‘돌아오면서 그분을 찾는 일을 열 배로 하라’에 가깝습니다. ‘열 배로 하라’의 목적어는 문맥상 암시되어 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: διάνοια
