  text: For just as your mind was set on going astray from God[a], so, as you return, seek him ten times more.
  footnotes:
  - marker: a
    text: Or 'seek him tenfold as you return.' The Greek literally says 'make [it] tenfold, returning to seek him,' with the intensified object implied by context.
    reason: lexical_alternative
translation:
  language: ko
  text: 너희 마음이 하나님에게서 떠나 길을 잃으려고 하였던 것과 같이, 이제 돌아오면서 그분을 열 배나 더 찾으십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘돌아오면서 그를 열 배로 찾으라’에 가깝습니다. 그리스어는 강도를 압축적으로 말하며, 한국어에서는 이를 자연스럽게 풀어 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: διάνοια
