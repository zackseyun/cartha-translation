  - 하나님에게서 떠나게 되다
  lexicon: BDAG
  rationale: πλανηθῆναι는 단순 이동이 아니라 종교적 이탈과 방황을 뜻하므로, ‘떠나 길을 잃다’로 그 이탈의 방향성과 상실감을 함께 살렸습니다.
- source_word: δεκαπλασιάσατε
  english_pob_choice: seek him ten times more
  chosen_korean: 열 배나 더 찾으십시오
  alternatives_korean:
