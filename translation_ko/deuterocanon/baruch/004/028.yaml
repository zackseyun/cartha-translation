  lexicon: BDAG
  rationale: 현재분사로서 동시적·상황적 성격을 나타내므로, 회개의 동작을 자연스럽게 이어 주는 ‘돌아오면서’로 처리했습니다.
theological_decisions:
- issue: 하나님을 다시 찾으라는 권면의 강도 표현
  chosen_reading: ‘열 배나 더 찾으십시오’로 번역해 단순한 재탐색이 아니라 크게 증대된 추구를 나타냈습니다.
  alternative_readings:
  - ‘열 배로 찾으십시오’
  - ‘열 배나 더 구하십시오’
