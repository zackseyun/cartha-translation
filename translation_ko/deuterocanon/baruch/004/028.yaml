  - 이해
  - 사고방식
  lexicon: BDAG
  rationale: διάνοια는 내적 지향과 생각의 자리를 가리키므로, 여기서는 한글 성경에서 자연스러운 ‘마음’이 사람의 내적 방향성을 잘 드러냅니다.
- source_word: ἐγένετο ... εἰς τὸ πλανηθῆναι
