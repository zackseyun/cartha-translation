  - 열 배나 더 구하십시오
  - 열 배로 더욱 찾으십시오
  lexicon: LSJ
  rationale: 직역하면 ‘열 배로 하라’는 압축된 표현이지만, 문맥상 하나님을 향한 재탐색의 강도를 말하므로 한국어에서는 ‘열 배나 더 찾으십시오’가 가장 자연스럽고 의미를 보존합니다.
- source_word: ἐπιστρέφοντες
  english_pob_choice: as you return
  chosen_korean: 돌아오면서
  alternatives_korean:
  - 돌아오며
  - 돌아올 때
  - 돌이키면서
  lexicon: BDAG
  rationale: 현재분사로서 동시적·상황적 성격을 나타내므로, 회개의 동작을 자연스럽게 이어 주는 ‘돌아오면서’로 처리했습니다.
