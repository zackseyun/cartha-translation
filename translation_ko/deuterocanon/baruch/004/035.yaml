translation:
  language: ko
  text: 이는 영원하신 분에게서 불이 그 도성에 임하여 오랜 날 동안 계속될 것이며, 그 도성은 아주 오랜 기간 악귀들이 사는 곳이 될 것이기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘영원자에게서.’ 그리스어는 ‘영원한 이’라는 뜻의 형용사를 명사처럼 사용하여 하나님을 가리키는 칭호로 씁니다.
    reason: lexical_alternative
