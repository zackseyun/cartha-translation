  text: You forgot the eternal God who nourished you; you also grieved Jerusalem, who reared you.
translation:
  language: ko
  text: 그분은 여러분을 먹여 기르신 영원하신 하나님을 잊어버리셨습니다. 또한 여러분을 길러 주신 예루살렘도 근심하게 하셨습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπελάθεσθε
  english_pob_choice: You forgot
  chosen_korean: 잊어버리셨습니다
  alternatives_korean:
  - 잊으셨습니다
  - 잊었습니다
  - 망각하셨습니다
  lexicon: BDAG
  rationale: 단순한 ‘잊다’보다 ‘잊어버리다’가 책망의 뉘앙스를 더 분명히 살리고, 합쇼체 문맥에서도 자연스럽습니다.
- source_word: τὸν τροφεύσαντα
  english_pob_choice: who nourished
  chosen_korean: 먹여 기르신
  alternatives_korean:
  - 기르신
  - 양육하신
  - 먹이신
  lexicon: LSJ
  rationale: τροφεύω의 ‘길러 주다/양육하다’ 의미를 살리되, 한국어에서는 ‘먹여 기르다’가 돌봄과 양육의 포괄적 이미지를 가장 자연스럽게 전달합니다.
- source_word: θεὸν αἰώνιον
  english_pob_choice: the eternal God
  chosen_korean: 영원하신 하나님
  alternatives_korean:
  - 영원한 하나님
  - 영세하신 하나님
  lexicon: LSJ
  rationale: αἰώνιος의 지속성과 신적 속성을 합쇼체 한국어에 가장 자연스럽게 옮기기 위해 ‘영원하신’으로 처리했습니다.
- source_word: τὴν ἐκθρέψασαν
  english_pob_choice: who reared
  chosen_korean: 길러 주신
  alternatives_korean:
  - 키워 주신
  - 양육하신
  - 기르신
  lexicon: LSJ
  rationale: 앞의 ‘먹여 기르신’과 어감을 구분하면서도, 예루살렘을 모성적 보호자로 그리는 이미지를 유지하기 위해 ‘길러 주신’으로 옮겼습니다.
theological_decisions:
- issue: 예루살렘의 의인화와 모성적 이미지
  chosen_reading: 예루살렘을 분명한 돌봄의 주체로 살려 두되, 본문에 없는 ‘어머니’를 덧붙이지 않았습니다.
  alternative_readings:
  - 어머니 예루살렘
  - 길러 준 예루살렘
  rationale: 그리스어 분사 ἐκθρέψασαν은 예루살렘을 실제 인격적 보호자로 제시하지만, 본문은 ‘어머니’라는 명칭을 직접 쓰지 않으므로 그 이상의 확장은 피했습니다.
  doctrine_reference: Translation philosophy §§1, 6
