  lexicon: BDAG
  rationale: ἐγώ의 강조와 δέ의 완만한 전환을 합쳐, 문두 대조를 자연스럽게 드러내는 ‘저로서는’으로 옮겼습니다.
- source_word: τί δυνατὴ
  english_pob_choice: how am I able
  chosen_korean: 어떻게 … 수 있겠습니까
  alternatives_korean:
  - 무엇을 … 수 있겠습니까
  - 어떻게 … 할 수 있습니까
  lexicon: BDAG
  rationale: τί δυνατή의 관용적 의미를 따라 문자적인 ‘무엇’보다 가능성·어려움을 드러내는 ‘어떻게’로 처리했습니다.
- source_word: βοηθῆσαι
  english_pob_choice: to help
  chosen_korean: 도울
  alternatives_korean:
  - 도와드릴
  - 구해줄
  lexicon: BDAG
  rationale: βοηθέω는 기본적으로 도움을 주는 뜻이므로, 의미를 과장하지 않는 표준적인 ‘돕다’를 사용했습니다.
- source_word: ὑμῖν
  english_pob_choice: you
  chosen_korean: 여러분을
  alternatives_korean:
  - 너희를
  - 당신들을
  lexicon: BDAG
  rationale: 복수 대상을 한국어에서 분명히 보이게 하되, 현대 공적 문체에 맞춰 ‘여러분’을 선택했습니다.
