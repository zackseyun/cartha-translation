base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/004/012.yaml
  text: Let no one gloat over me[a], a widow and abandoned by many; I have been left desolate because of the sins of my children, because they turned aside from the law of God.
  footnotes:
  - marker: a
    text: Or 'rejoice over me.' The Greek verb carries the sense of taking joy in another's distress, hence 'gloat over.'
    reason: lexical_alternative
translation:
  language: ko
  text: 과부이며 많은 사람에게 버림받은 나를 두고, 아무도 고소해하지 마십시오[a]. 나는 내 자녀들의 죄 때문에 황폐해졌습니다. 그들이 하나님의 율법에서 벗어났기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘나를 두고 기뻐하지 마십시오.’ 그리스어 동사는 특히 다른 이의 불행이나 곤경을 두고 기뻐하는 뜻을 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδεὶς ἐπιχαιρέτω μοι
  english_pob_choice: Let no one gloat over me
  chosen_korean: 아무도 나를 두고 즐거워하지 못하게 하십시오
  alternatives_korean:
  - 아무도 나를 보고 기뻐하지 못하게 하십시오
  - 아무도 나를 두고 조롱하며 기뻐하지 못하게 하십시오
  lexicon: LSJ
  rationale: ἐπιχαίρω는 단순한 ‘기뻐하다’보다 타인의 불행을 두고 기뻐하는 뉘앙스가 있어, 한국어에서는 ‘즐거워하지 못하게 하십시오’로 기본 의미를 살리고, hostile nuance는 문맥 전체에서 드러나게 했습니다.
- source_word: τῇ χήρᾳ καὶ καταλειφθείσῃ ὑπὸ πολλῶν
  english_pob_choice: a widow and abandoned by many
  chosen_korean: 나는 과부이며 많은 사람에게 버림받았습니다
  alternatives_korean:
  - 나는 과부이며 많은 사람에게 남겨졌습니다
  - 나는 과부이며 많은 이들에게 떠나버림을 당했습니다
  lexicon: LSJ
  rationale: χήρα는 ‘과부’가 자연스럽고, καταλειφθείσῃ ὑπὸ πολλῶν은 수동적 버림의 상태를 나타내므로 ‘많은 사람에게 버림받았습니다’가 가장 직접적입니다.
- source_word: ἠρημώθην
  english_pob_choice: I have been left desolate
  chosen_korean: 나는 황폐해졌습니다
  alternatives_korean:
  - 나는 버려져 황폐해졌습니다
  - 나는 황무지가 되었습니다
  lexicon: LSJ
  rationale: 동사는 황폐·파괴된 상태를 가리키므로 ‘황폐해졌습니다’가 핵심 상태를 간결하게 담습니다. 영어 POB의 ‘left desolate’는 상태를 풀어 설명한 것으로 보아, 한국어도 상태 중심으로 옮겼습니다.
- source_word: ἐξέκλιναν ἐκ νόμου θεοῦ
  english_pob_choice: they turned aside from the law of God
  chosen_korean: 그들이 하나님의 율법에서 벗어났기 때문입니다
  alternatives_korean:
  - 그들이 하나님의 율법에서 떠났기 때문입니다
  - 그들이 하나님의 법에서 벗어났기 때문입니다
  lexicon: LSJ
  rationale: ἐκκλίνω는 길/규범에서 ‘벗어나다, 빗나가다’의 뜻이므로 ‘벗어났기’가 메타포와 책임을 함께 살립니다. νόμος θεοῦ는 여기서 일반 ‘법’보다 언약적·토라적 의미의 ‘율법’이 더 분명합니다.
theological_decisions:
- issue: 화자와 은유의 명시 여부
  chosen_reading: 본문의 1인칭 여성 화자를 그대로 두고, 예루살렘/시온을 본문 안에서 명시하지 않았습니다.
  alternative_readings:
  - 예루살렘이 말하고 있다고 명시하기
  - 시온의 탄식으로 풀어 쓰기
  rationale: 그리스어 본문은 화자를 직접 1인칭으로 제시할 뿐, 이 절 안에서는 이름을 붙이지 않습니다. 배경 해석은 유지하되 본문을 확장하지 않는 것이 원문 우선 원칙에 맞습니다.
  doctrine_reference: 원문 우선과 은유 보존
- issue: ‘ἐπιχαιρέτω’의 정서 강도
  chosen_reading: ‘즐거워하지 못하게 하십시오’로 옮기되, 고통을 즐기는 뉘앙스는 문맥에서 읽히도록 두었습니다.
  alternative_readings:
  - ‘기뻐하지 못하게 하십시오’
  - ‘조롱하며 기뻐하지 못하게 하십시오’
  rationale: 이 동사는 단순 기쁨보다 남의 불행을 두고 기뻐하는 의미가 있지만, 한국어 본문에서 과도한 설명을 넣으면 문장이 과장될 수 있습니다. 따라서 핵심 의미를 본문에 두고, 강한 적대성은 어휘 선택으로만 반영했습니다.
  doctrine_reference: 어휘의 윤리적 뉘앙스 보존
