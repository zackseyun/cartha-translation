  lexicon: LSJ
  rationale: πτῶσις의 문자적 ‘넘어짐/추락’ 이미지를 ‘몰락’으로 옮겨 예루살렘의 패망을 자연스럽게 드러냈고, ‘보고’는 ἐπιχαρέντες의 대상 상황을 한국어로 매끄럽게 연결합니다.
theological_decisions:
- issue: 저주의 선언의 어조
  chosen_reading: 예언적 탄식과 심판 선언의 어조를 살려 ‘불행합니다’로 옮겼습니다.
  alternative_readings:
