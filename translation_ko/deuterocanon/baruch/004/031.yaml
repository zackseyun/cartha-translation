  - ‘비참합니다’처럼 단순 서술로 약화시킬 수 있음
  rationale: δώ/δείλαιοι는 단순 감상적 슬픔보다 화가 섞인 예언적 애도에 가깝습니다. 한국어에서는 ‘불행합니다’가 탄식과 심판의 긴장을 비교적 잘 유지합니다.
  doctrine_reference: 예언서의 애가/화 선언 관용
- issue: ‘기뻐하다’의 윤리적 색채
  chosen_reading: ‘기뻐한’으로 직역하되, 전체 구문으로 그 기쁨이 남의 몰락에 대한 것임을 분명히 했습니다.
  alternative_readings:
  - ‘조롱하며 기뻐한’처럼 해석을 덧붙일 수 있음
  - ‘희희낙락한’처럼 도덕적 비난을 강화할 수 있음
  rationale: 원문은 악의적 기쁨을 드러내지만, 그 방식은 문맥이 담당합니다. 본문에 없는 평가어를 본문에 앞세우지 않는 것이 source-direct합니다.
  doctrine_reference: 문맥에 의한 윤리적 평가의 보존
