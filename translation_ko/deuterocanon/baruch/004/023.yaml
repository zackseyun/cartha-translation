  rationale: ἀποδίδωμι는 '되돌려 주다/돌려주다'의 의미가 가능하며, μοι('내게')를 살려 관계적 반환을 분명히 하기 위해 '내게 돌려주실 것입니다'로 번역했습니다.
- source_word: χαρμοσύνης καὶ εὐφροσύνης
  english_pob_choice: with joy and gladness
