  lexicon: BDAG
  rationale: μετά + 속격은 동반 상태를 나타내므로 '—으로'를 사용했고, πένθος/κλαυθμός의 정서를 현대 한국어에서 자연스럽게 드러내기 위해 '슬픔과 울음'으로 옮겼습니다.
