  text: And they carried away the widow’s beloved ones[a], and from among her daughters they left her desolate and alone.
  footnotes:
  - marker: a
    text: Or, 'they made the widow desolate as the only one left from among her daughters.' The Greek τὴν μόνην may be taken more literally as 'the only one,' though the sense is that she was left alone.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 과부가 사랑하는 이들을 끌고 갔고, 그 딸들 가운데서 과부만 홀로 남게 하여 그녀를 황폐하게 했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘그들은 그 딸들 가운데서 유일하게 남은 이를 황폐하게 했습니다.’ 그리스어 τὴν μόνην은 문자적으로 ‘유일한 이’를 뜻하며, 여기서는 과부가 홀로 남게 된 상태를 가리킬 수 있습니다.
    reason: lexical_alternative
