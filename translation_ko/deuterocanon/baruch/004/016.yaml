  naturalness: 수정문은 시적 인격화와 합쇼체를 유지하면서, 한국어에서 자연스럽게 과부가 딸들 가운데 홀로 남았다는 결과를 드러냅니다. ‘황폐하게 하다’는 인격화된 도시/여인 이미지에도 적절합니다.
