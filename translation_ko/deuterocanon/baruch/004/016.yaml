  text: And they carried away the widow’s beloved ones[a], and from among her daughters they left her desolate and alone.
  footnotes:
  - marker: a
    text: Or, 'they made the widow desolate as the only one left from among her daughters.' The Greek τὴν μόνην may be taken more literally as 'the only one,' though the sense is that she was left alone.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 과부의 사랑하는 이들을 끌고 갔고, 그 딸들 가운데서 오직 한 사람만 남겨 그녀를 황폐하고 외롭게 했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘그들은 과부를 그녀의 딸들 가운데서 남은 유일한 하나로 황폐하게 했습니다.’ 그리스어 τὴν μόνην은 더 문자적으로 ‘유일한 하나’로도 읽을 수 있지만, 뜻은 과부가 홀로 남겨졌다는 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπήγαγον
  english_pob_choice: carried away
  chosen_korean: 끌고 갔고
  alternatives_korean:
  - 데려갔고
  - 끌어갔고
  lexicon: BDAG
  rationale: 사람을 강제로 이동시키는 뉘앙스를 살리면서도, 포로화의 구체성을 과도하게 덧씌우지 않기 위해 ‘끌고 갔고’로 옮겼습니다.
- source_word: τοὺς ἀγαπητοὺς
  english_pob_choice: the beloved ones
  chosen_korean: 사랑하는 이들을
  alternatives_korean:
  - 사랑받는 이들을
  - 사랑스러운 이들을
  lexicon: LSJ
  rationale: 서로 사랑의 관계를 나타내는 표현으로 이해되어, 한국어에서는 자연스럽고 정서적 힘을 보존하는 ‘사랑하는 이들’이 적절합니다.
- source_word: τῆς χήρας
  english_pob_choice: the widow’s
  chosen_korean: 과부의
  alternatives_korean:
  - 과부의 여인의
  - 미망인의
  lexicon: BDAG
  rationale: 소유격을 자연스럽게 처리하되, 본문의 비유적 인물화는 본문 안에 그대로 두기 위해 ‘과부의’로 직역했습니다.
- source_word: τὴν μόνην
  english_pob_choice: alone / the only one
  chosen_korean: 오직 한 사람만
  alternatives_korean:
  - 외롭게
  - 홀로 남은 하나를
  lexicon: BDAG
  rationale: POb의 각주가 지적하듯 여기서 μόνην은 ‘유일한 사람’이라는 문자적 가능성과 ‘홀로’라는 상태를 함께 지니므로, 본문에는 ‘오직 한 사람만’으로 두어 문자성과 결과 상태를 함께 보존했습니다.
- source_word: ἠρήμωσαν
  english_pob_choice: they left her desolate
  chosen_korean: 그녀를 황폐하고 외롭게 했습니다
  alternatives_korean:
  - 그녀를 황폐하게 했습니다
  - 그녀를 버려 황무지처럼 만들었습니다
  lexicon: LSJ
  rationale: 동사는 ‘황폐하게 하다, 황무하게 하다’의 뜻이므로, 결과 상태를 분명히 하면서도 문맥의 상실감까지 드러내는 ‘황폐하고 외롭게 했습니다’로 옮겼습니다.
