  lexicon: BDAG
  rationale: POb의 각주가 지적하듯 여기서 μόνην은 ‘유일한 사람’이라는 문자적 가능성과 ‘홀로’라는 상태를 함께 지니므로, 본문에는 ‘오직 한 사람만’으로 두어 문자성과 결과 상태를 함께 보존했습니다.
- source_word: ἠρήμωσαν
  english_pob_choice: they left her desolate
  chosen_korean: 그녀를 황폐하고 외롭게 했습니다
  alternatives_korean:
  - 그녀를 황폐하게 했습니다
  - 그녀를 버려 황무지처럼 만들었습니다
  lexicon: LSJ
  rationale: 동사는 ‘황폐하게 하다, 황무하게 하다’의 뜻이므로, 결과 상태를 분명히 하면서도 문맥의 상실감까지 드러내는 ‘황폐하고 외롭게 했습니다’로 옮겼습니다.
