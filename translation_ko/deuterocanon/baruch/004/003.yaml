  text: Do not give your glory to another[b][a], nor what benefits you to a foreign nation.
  footnotes:
  - marker: a
    text: Or 'your honor' for 'your glory.' The Greek δόξα can carry either sense here.
    reason: lexical_alternative
  - marker: b
    text: Or 'your welfare' or 'your advantages' for 'what benefits you.'
    reason: lexical_alternative
translation:
  language: ko
  text: 다른 이에게 너의 영광을 주지 말고, 너에게 유익한 것을 이방 민족에게 주지 마십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὴ δῷς
  english_pob_choice: Do not give
  chosen_korean: 주지 마십시오
  alternatives_korean:
  - 주지 말라
  - 넘겨주지 마십시오
  - 내주지 마십시오
  lexicon: SBLGNT Greek
  rationale: μή + aorist subjunctive의 금지 명령을 자연스러운 현대 한국어 금지 표현으로 옮겼습니다. '주다'는 기본 의미를 유지하면서도 문맥상 소유권을 넘기는 뉘앙스를 과장하지 않습니다.
- source_word: τὴν δόξαν σου
  english_pob_choice: your glory
  chosen_korean: 너의 영광
  alternatives_korean:
  - 너의 명예
  - 너의 영예
  - 너의 존귀
  lexicon: BDAG
  rationale: δόξα의 핵심 범위를 보존하기 위해 '영광'을 택했습니다. '명예'는 윤리적 명성 쪽으로 좁아질 수 있어, POB의 'glory'처럼 더 넓고 신학적인 울림을 살렸습니다.
- source_word: τὰ συμφέροντά σοι
  english_pob_choice: what benefits you
  chosen_korean: 너에게 유익한 것
  alternatives_korean:
  - 너의 이익
  - 너에게 이로운 것
  - 너의 유익
  lexicon: BDAG
  rationale: 이 표현은 구체적 재물이나 정치적 이익으로 한정되지 않으므로, POB의 일반적 의미를 따라 '유익한 것'으로 넓게 옮겼습니다. 복수형의 감각도 한국어에서 포괄적으로 담을 수 있습니다.
- source_word: ἔθνει ἀλλοτρίῳ
  english_pob_choice: to a foreign nation
  chosen_korean: 이방 민족에게
  alternatives_korean:
  - 외국 민족에게
  - 낯선 민족에게
  - 타국 민족에게
  lexicon: BDAG
  rationale: ἔθνος는 여기서 이스라엘 밖의 민족을 가리키므로 '민족'으로 옮기고, ἀλλότριος의 외부성은 성서적 관용을 살려 '이방'으로 표현했습니다. 전통 교회어를 따르되, 원문의 대조를 분명히 드러냅니다.
theological_decisions:
- issue: δόξα의 의미 범위
  chosen_reading: '''영광''을 유지하여 명예나 존귀로 좁히지 않았습니다.'
  alternative_readings:
  - 명예
  - 존귀
  - 하나님이 주신 영광
  rationale: 본문은 참조 대상을 구체화하지 않으므로, 원문의 폭을 유지하는 것이 더 충실합니다. 이는 독자가 문맥 속에서 공동체의 영광/존귀를 넓게 이해하게 합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 3
