translation:
  language: ko
  text: 또한 그들은 그의 의로운 규례들을 알지 못하였으며, 하나님의 계명들의 길로도 걷지 않았으며, 그의 의 안에 있는 훈육[a]의 길들에는 발도 들여놓지 않았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘교육’으로도 옮길 수 있습니다. 여기서는 παιδεία의 형성적·교정적 뉘앙스를 살려 ‘훈육’을 택했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: δικαιώματα
  english_pob_choice: righteous decrees
  chosen_korean: 의로운 규례들
  alternatives_korean:
  - 의로운 법령들
  - 의로운 조례들
  - 의로운 명령들
  lexicon: LSJ
  rationale: δικαιώματα는 규정·법령의 뜻을 가지므로 ‘규례들’이 자연스럽고, POB의 ‘righteous decrees’에 맞춰 δικαι-의 도덕적 색채를 살렸습니다.
- source_word: ἐντολῶν θεοῦ
  english_pob_choice: the ways of God's commandments
  chosen_korean: 하나님의 계명들의 길
  alternatives_korean:
  - 하나님의 명령들의 길
  - 하나님의 계명의 길
  - 하나님의 계명들을 따르는 길
  lexicon: LSJ
  rationale: 속격 관계를 드러내면서도 한국어로 읽기 자연스럽게 ‘계명들의 길’로 옮겼고, θεοῦ는 관용적으로 ‘하나님의’로 번역했습니다.
- source_word: παιδίας
  english_pob_choice: discipline
  chosen_korean: 훈육
  alternatives_korean:
  - 징계
  - 교육
  - 훈련
  lexicon: LSJ
  rationale: 여기서 παιδεία는 단순 처벌보다 형성적 가르침과 교정을 함께 뜻하므로, ‘훈육’이 문맥상 가장 균형 잡힌 대응입니다.
- source_word: ἐπέβησαν
  english_pob_choice: did ... step onto
  chosen_korean: 발을 들여놓지도 않았습니다
  alternatives_korean:
  - 발을 디디지도 않았습니다
  - 들어서지도 않았습니다
  - 그 길에 오르지도 않았습니다
  lexicon: LSJ
  rationale: 직역의 이미지인 ‘step onto’를 한국어 관용으로 살려, 실제로 그 길에 진입하지 않았다는 동작성을 유지했습니다.
theological_decisions:
- issue: δικαιοσύνη의 번역
  chosen_reading: 의
  alternative_readings:
