translation:
  language: ko
  text: 그리고 그들은 그의 의로운 규례들을 알지 못하였으며, 하나님의 계명들의 길로도 걷지 않았으며, 그의 의 안에 있는 훈육의 길들에[ [a] ] 발을 들여놓지도 않았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘교육’으로도 옮길 수 있습니다. 여기서는 παιδεία의 형성적·교정적 뉘앙스를 살려 ‘훈육’을 택했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: δικαιώματα
  english_pob_choice: righteous decrees
  chosen_korean: 의로운 규례들
  alternatives_korean:
  - 의로운 법령들
  - 의로운 조례들
  - 의로운 명령들
  lexicon: LSJ
  rationale: δικαιώματα는 규정·법령의 뜻을 가지므로 ‘규례들’이 자연스럽고, POB의 ‘righteous decrees’에 맞춰 δικαι-의 도덕적 색채를 살렸습니다.
- source_word: ἐντολῶν θεοῦ
  english_pob_choice: the ways of God's commandments
  chosen_korean: 하나님의 계명들의 길
  alternatives_korean:
