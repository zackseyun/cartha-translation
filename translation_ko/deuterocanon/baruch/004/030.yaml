  lexicon: BDAG
  rationale: 두려움에 맞서 마음을 굳게 하라는 권면을 현대 한국어 합쇼체로 자연스럽게 옮겼습니다. '용기를 내십시오'는 명령의 격려성을 살리면서도 직역투를 피합니다.
