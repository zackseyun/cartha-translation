  alternatives_korean:
  - 예루살렘아
  lexicon: 현대 외래어 표기 관례
  rationale: 지명은 통용되는 성서형 고유명사인 '예루살렘'을 사용했습니다. 호격은 한국어 종결부에 의해 자연스럽게 드러나며, 본문에서는 친근한 호격 어미로 처리했습니다.
- source_word: παρακαλέσει
  english_pob_choice: will comfort
  chosen_korean: 위로하실 것입니다
  alternatives_korean:
  - 위로해 주실 것입니다
  - 격려하실 것입니다
  - 권면하실 것입니다
  lexicon: BDAG
  rationale: 유배와 회복의 문맥에서 παρακαλέω의 핵심은 단순한 격려보다 위로에 가깝습니다. '위로하실 것입니다'가 미래의 회복적 돌봄을 가장 잘 드러냅니다.
- source_word: ὁ ὀνομάσας σε
  english_pob_choice: the one who named you
  chosen_korean: 너를 이름 붙이신 분
  alternatives_korean:
  - 너를 이름 붙이신 이
  - 너를 이름하신 분
  - 너의 이름을 지어 주신 분
  lexicon: BDAG
  rationale: 분사구를 서술적으로 풀어 '이름 붙이신 분'으로 옮겨, 주체의 인격성과 행위를 드러내되 본문이 명시하지 않는 호칭을 덧붙이지 않았습니다. 한국어에서는 '이름하신'보다 '이름 붙이신'이 의미를 더 분명히 전달합니다.
theological_decisions:
- issue: ‘너를 이름 붙이신 분’의 신원
  chosen_reading: 본문에 없는 '하나님' 또는 '주님'을 본문에 삽입하지 않고, 묘사적 표현을 유지했습니다.
  alternative_readings:
  - 하나님이 너를 이름 붙이신 분
  - 주님이 너를 이름 붙이신 분
  rationale: 영어 POB의 주석처럼 문맥상 하나님을 가리키지만, 헬라어 본문 자체는 신적 호칭 대신 분사구를 사용합니다. 따라서 본문은 절제해 옮기고, 독자가 문맥에서 식별하도록 두는 편이 원문에 충실합니다.
  doctrine_reference: 번역 철학 §1, §3, §6
