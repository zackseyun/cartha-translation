  source_fidelity: 그리스어 Θάρσει의 권면과 미래형 παρακαλέσει, 그리고 관사화된 분사구 ὁ ὀνομάσας σε를 대체로 충실히 옮겼습니다. 다만 ‘너를 이름 붙이신 분’은 한국어에서 목적어와 결합이 다소 어색하므로, ‘너에게 이름을 붙이신 분’이 원문의 ‘너를 이름 지은/명명한 이’라는 뜻을 더 자연스럽고 정확하게 전달합니다.
