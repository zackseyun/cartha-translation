  text: You were sold to the nations, not for destruction; but because you provoked God to anger, you were handed over to your adversaries.
translation:
  language: ko
  text: 너희는 멸망시키려는 것이 아니라 민족들에게 팔려 갔습니다. 그러나 너희가 하나님을 노엽게 하였으므로, 너희는 반대자들에게 넘겨졌습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπράθητε
  english_pob_choice: you were sold
  chosen_korean: 팔려 갔습니다
  alternatives_korean:
  - 팔렸습니다
  - 팔려 넘겨졌습니다
  lexicon: BDAG
  rationale: 수동형의 ‘팔리다’ 의미를 자연스럽게 살리면서, 포로·유배의 처지를 드러내기 위해 ‘팔려 갔습니다’로 옮겼습니다.
- source_word: τοῖς ἔθνεσιν
  english_pob_choice: to the nations
  chosen_korean: 민족들에게
  alternatives_korean:
  - 나라들에게
  - 이방인들에게
  lexicon: BDAG
  rationale: 이 문맥의 ἔθνη는 민족/나라를 가리키므로, 후대 신학적 용례가 강한 ‘이방인들’보다 ‘민족들’이 더 직접적입니다.
- source_word: οὐκ εἰς ἀπώλειαν
  english_pob_choice: not for destruction
  chosen_korean: 멸망시키려는 것이 아니라
  alternatives_korean:
  - 파멸시키려는 것이 아니라
  - 없애 버리려는 것이 아니라
  lexicon: BDAG
  rationale: εἰς + ἀπώλεια의 목적·결과를 살려, 단순 상태 진술보다 ‘~하려는 것이 아니라’로 옮겨 목적성을 분명히 했습니다.
- source_word: παροργίσαι
  english_pob_choice: you provoked ... to anger
  chosen_korean: 하나님을 노엽게 하였으므로
  alternatives_korean:
  - 하나님을 진노하게 하였으므로
  - 하나님을 화나게 하였으므로
  lexicon: BDAG
  rationale: 동사 παροργίζω의 ‘노엽게 하다/분노를 일으키다’의 강한 뉘앙스를 반영하되, 한국어에서 가장 자연스러운 ‘노엽게 하다’를 택했습니다.
- source_word: παρεδόθητε
  english_pob_choice: you were handed over
  chosen_korean: 넘겨졌습니다
  alternatives_korean:
  - 인도되었습니다
  - 인계되었습니다
  lexicon: BDAG
  rationale: ἔθνεσιν에게 ‘팔려 감’과 병행되는 심판적 수동을 살리기 위해, 법정적·권력적 뉘앙스가 있는 ‘넘겨졌습니다’를 사용했습니다.
- source_word: τοῖς ὑπεναντίοις
  english_pob_choice: to your adversaries
  chosen_korean: 반대자들에게
  alternatives_korean:
  - 적들에게
  - 대적들에게
  lexicon: LSJ
  rationale: ὑπεναντίος의 핵심은 ‘맞서는/반대하는’ 의미이므로, 전통적 종교어휘보다 직접적인 ‘반대자들’이 원문의 대립성을 잘 드러냅니다.
theological_decisions:
- issue: 포로의 의미와 최종 멸망의 구분
  chosen_reading: 이 절은 민족들에게 팔려 간 일이 최종 멸망을 뜻한 것이 아니라, 하나님을 노엽게 한 결과로 반대자들에게 넘겨진 심판임을 말합니다.
  alternative_readings:
  - 포로는 단순한 처벌이 아니라 교정적 징계로 읽을 수 있습니다.
  - 문장은 수사적으로 읽어야 하며 교리화는 피해야 합니다.
  rationale: 그리스어는 ‘멸망시키려는 것이 아니라’와 ‘하나님을 노엽게 하였으므로’의 대비를 분명히 하므로, 그 긴장을 풀어 설명하지 않고 그대로 보존했습니다.
  doctrine_reference: 심판과 보존의 긴장을 본문 수준에서 유지
