translation:
  language: ko
  text: 시온의 이웃 여자들이 오게 하십시오. 이웃 여자들이 오게 하십시오. 그리고 내 아들들과 딸들의 포로 됨을 기억하십시오. 그것을 영원하신 분께서 그들에게 가져오셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘시온의 거주하는 여자들/이웃 여자들’ 또는 ‘시온의 이웃들’입니다. 그리스어 πάροικοι는 가까이 사는 사람이나 거주 외국인을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어 본문은 강조를 위해 ‘오게 하십시오’에 해당하는 표현을 두 번 반복합니다.
    reason: textual_variant
