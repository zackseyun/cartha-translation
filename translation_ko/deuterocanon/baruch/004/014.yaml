translation:
  language: ko
  text: 시온의 이웃 여자들이 오게 하십시오.[a] 이웃 여자들이 오게 하십시오.[b] 영원하신 분께서 그들에게 내리신 내 아들들과 딸들의 포로 된 처지를 기억하십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘시온에 사는 여자들’ 또는 ‘시온의 이웃 여자들’입니다. 그리스어 πάροικοι는 가까이 사는 사람, 거주민, 또는 거주 외국인을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어 본문은 강조를 위해 ‘이웃 여자들이 오게 하십시오’에 해당하는 표현을 두 번 반복합니다.
    reason: textual_variant
