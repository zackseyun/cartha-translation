translation:
  language: ko
  text: 여러분에게 재앙을 가져오신 그분께서 여러분의 구원과 함께 영원한 기쁨을 가져오실 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘영원한 기쁨’은 그리스어 εὐφροσύνη를 옮긴 것이며, ‘영원한 즐거움’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘구원’은 그리스어 σωτηρία를 옮긴 것이며, 문맥에 따라 ‘구출’ 또는 ‘해방’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπαγαγὼν
  english_pob_choice: brought ... upon
  chosen_korean: 재앙을 가져오신
  alternatives_korean:
  - 재앙을 불러오신
  - 악을 가져오신
  - 환난을 가져오신
  lexicon: BDAG
  rationale: 과거 분사의 원인적 의미를 살려, 앞선 재앙의 도래를 직접 ‘가져오신’으로 옮겼습니다. 뒤의 ἐπάξει와도 ‘가져오실’로 대응시켜 반복을 보존합니다.
- source_word: τὰ κακὰ
  english_pob_choice: these evils
  chosen_korean: 재앙
  alternatives_korean:
  - 악들
  - 이 악들
  - 환난들
  lexicon: BDAG
  rationale: 문맥상 개인적 악행보다 공동체 위에 임한 심판적 재난을 가리키므로, 한국어에서는 자연스럽고 의미가 분명한 ‘재앙’을 택했습니다.
- source_word: ἐπάξει
  english_pob_choice: will bring
  chosen_korean: 가져오실 것입니다
  alternatives_korean:
  - 가져오실
  - 불러오실 것입니다
  - 임하게 하실 것입니다
  lexicon: BDAG
  rationale: 앞절의 ‘가져오신’과 같은 동사를 반복해, 재앙과 회복을 동일 주체의 행위로 병치하는 원문의 수사 구조를 살렸습니다.
- source_word: τὴν αἰώνιον εὐφροσύνην
  english_pob_choice: everlasting gladness
  chosen_korean: 영원한 기쁨
  alternatives_korean:
  - 영원한 즐거움
  - 영속하는 기쁨
  - 영원한 환희
  lexicon: BDAG
  rationale: εὐφροσύνη의 기쁨/즐거움 의미를 자연스러운 한국어로 옮기되, αἰώνιον의 지속성을 ‘영원한’으로 분명히 했습니다.
- source_word: μετὰ τῆς σωτηρίας ὑμῶν
  english_pob_choice: with your salvation
  chosen_korean: 여러분의 구원과 함께
  alternatives_korean:
  - 여러분의 구원과 더불어
  - 여러분의 구원과 함께하여
  - 여러분의 구원과 더불어서
  lexicon: BDAG
  rationale: σωτηρία의 구원/구출 가능성을 한국어에서 모두 포괄할 수 있는 ‘구원’으로 옮기고, μετὰ를 자연스럽게 ‘~와 함께’로 처리했습니다.
theological_decisions:
- issue: 재앙과 회복의 동일한 주체
  chosen_reading: 재앙을 가져오신 그분이 곧 영원한 기쁨과 구원도 가져오시는 분으로 그대로 제시했습니다.
  alternative_readings:
  - 재앙의 주체를 완화하여 수동적으로 표현할 수 있습니다.
  - 회복의 주체만 강조하고 재앙의 직접 주체성은 약화시킬 수 있습니다.
  rationale: 그리스어는 한 분이 재앙을 ‘가져오셨고’ 또한 기쁨을 ‘가져오실 것’이라고 분명히 말합니다. 이 긴장을 약화하지 않고 그대로 보존했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 3
