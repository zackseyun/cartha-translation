  rationale: 그리스어는 정서적 대비를 직접 말할 뿐, 이 절 안에서 망명 상황을 풀어 설명하지 않으므로, 해석을 과도하게 앞당기지 않는 것이 본문 충실성에 맞습니다.
  doctrine_reference: 본문의 긴장을 보존하고, 사전 설명 없이 감정적 대비를 유지합니다.
