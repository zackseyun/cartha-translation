  lexicon: BDAG
  rationale: τρέφω는 단순한 먹임보다 돌봄과 양육의 뉘앙스를 함께 가질 수 있으므로, 한국어에서는 ‘기르다’가 공급과 돌봄을 함께 살리면서도 문맥의 애틋함을 유지합니다.
- source_word: μετʼ εὐφροσύνης
  english_pob_choice: with gladness
  chosen_korean: 기쁨으로
  alternatives_korean:
  - 즐거움으로
  - 환희로
  - 기쁜 마음으로
  lexicon: BDAG
  rationale: εὐφροσύνη는 기쁨, 즐거움, 축제적 আনন্দ을 가리키므로, ‘기쁨으로’가 자연스럽고 앞뒤의 대조를 가장 간결하게 살립니다.
- source_word: ἐξαπέστειλα
  english_pob_choice: I sent them away
  chosen_korean: 내보냈습니다
  alternatives_korean:
  - 보냈습니다
  - 떠나보냈습니다
  - 내쫓았습니다
  lexicon: BDAG
  rationale: 복합동사 ἐξαποστέλλω는 단순한 발송보다 분리와 떠남을 더 강하게 시사하므로, ‘내보냈습니다’가 과도한 해석 없이 그 분리감을 담습니다.
- source_word: μετὰ κλαυθμοῦ καὶ πένθους
  english_pob_choice: with weeping and mourning
  chosen_korean: 울음과 애통함으로
  alternatives_korean:
  - 통곡과 슬픔으로
  - 우는 것과 애도로
  - 눈물과 애도로
  lexicon: BDAG
  rationale: κλαυθμός와 πένθος은 각각 우는 행위와 상실에 대한 애도를 가리키므로, ‘울음과 애통함으로’가 병렬 구조를 유지하면서 정서적 무게를 살립니다.
