translation:
  language: ko
  text: 그가 그들을 치려고 먼 곳에서 한 민족, 곧 뻔뻔하고 다른 언어를 쓰는 민족을 데려오셨으니,[a] 그 민족은 노인을 존중하지도 않았고 아이에게 자비를 베풀지도 않았습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘다른 말을 하는 민족’ 또는 ‘외국말을 쓰는 민족’으로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어는 문자적으로 ‘노인’과 ‘아이’라고 하며, 취약한 이들을 대표하는 단수형을 사용합니다.
    reason: lexical_alternative
