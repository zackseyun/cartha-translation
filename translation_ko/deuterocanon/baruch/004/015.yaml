  text: 그가 그들 위에 먼 곳에서 온 한 민족, 곧 뻔뻔하고 다른 언어를 쓰는 민족을 보내셨으니, 그들은 노인을 존중하지도 않았고 아이에게도 자비를 베풀지 않았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘다른 언어를 쓰는 민족’, 혹은 ‘외국말을 쓰는 민족’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어는 문자적으로 ‘노인’과 ‘아이’라고 하며, 취약한 사람들을 대표하는 단수형입니다.
    reason: lexical_alternative
