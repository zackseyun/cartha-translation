  text: 나는 그녀에게서 그 많은 사람들의 기쁨[a]을 거두고, 그녀의 자랑[b]을 애도로 바꾸겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그녀의 큰 무리로 인한 기쁨’. 그리스어 표현은 그녀의 인구 많음 자체를 가리킬 수도 있고, 그로 말미암아 생기는 기쁨을 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그녀의 오만을 애도로 바꾸겠습니다’ 또는 ‘그녀의 화려함을 애도로 바꾸겠습니다’. 이 그리스어 단어는 교만한 과시나 자긍을 뜻할 수도 있고, 찬란한 외적 위세를 뜻할 수도 있습니다.
