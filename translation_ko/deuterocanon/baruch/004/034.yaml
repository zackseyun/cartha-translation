  text: And I will take away from her the rejoicing of her many people[b][a], and turn her pride into mourning.
  footnotes:
  - marker: a
    text: Or 'the rejoicing of her great multitude.' The Greek phrase can point either to her populousness itself or to the joy arising from it.
    reason: lexical_alternative
  - marker: b
    text: Or 'her haughtiness into mourning' or 'her splendor into mourning.' The Greek term can carry the sense of proud display as well as pride.
    reason: lexical_alternative
