translation:
  language: ko
  text: 힘을 내십시오, 자녀들아. 하나님께 부르짖으십시오. 너희에게 이 일을 가져오신 분께서 너희를 기억하실 것이기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
