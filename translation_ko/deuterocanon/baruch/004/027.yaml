  rationale: 공동체를 부르는 호격 복수로서 '자녀들'이 가장 포괄적이며, 호격 뉘앙스를 살리기 위해 '-아'를 붙였습니다.
- source_word: βοήσατε πρὸς τὸν θεόν
  english_pob_choice: cry out to God
  chosen_korean: 하나님께 부르짖으십시오
  alternatives_korean:
  - 하나님께 외치십시오
