    reason: lexical_alternative
lexical_decisions:
- source_word: Θαρρήσατε
  english_pob_choice: Take courage
  chosen_korean: 힘을 내십시오
  alternatives_korean:
  - 용기를 내십시오
  - 담대해지십시오
  - 마음을 굳게 먹으십시오
  lexicon: LSJ
  rationale: aorist imperative plural의 격려·촉구를 자연스러운 현대 한국어로 옮기되, 단순한 감정보다 행동을 북돋는 힘을 드러내기 위해 '힘을 내십시오'를 택했습니다.
- source_word: τέκνα
  english_pob_choice: children
  chosen_korean: 자녀들아
  alternatives_korean:
  - 아이들아
  - 자식들아
  - 자녀들
  lexicon: LSJ
  rationale: 공동체를 부르는 호격 복수로서 '자녀들'이 가장 포괄적이며, 호격 뉘앙스를 살리기 위해 '-아'를 붙였습니다.
- source_word: βοήσατε πρὸς τὸν θεόν
  english_pob_choice: cry out to God
  chosen_korean: 하나님께 부르짖으십시오
  alternatives_korean:
  - 하나님께 외치십시오
  - 하나님을 향해 부르짖으십시오
  - 하나님께 소리 높여 부르십시오
  lexicon: LSJ
  rationale: βοάω의 강한 외침과 간청의 성격을 함께 살리기 위해 '부르짖다'를 사용했고, πρὸς τὸν θεόν은 한국어 관용에 맞게 여격 '하나님께'로 옮겼습니다.
- source_word: ἔσται ... μνεία
  english_pob_choice: you will be remembered
  chosen_korean: 너희를 ... 기억하실 것이기 때문입니다
  alternatives_korean:
  - 너희에 대한 기억이 있을 것이기 때문입니다
  - 너희가 기억될 것이기 때문입니다
  - 너희에 대한 언급이 있을 것이기 때문입니다
  lexicon: LSJ
  rationale: 직역적 '기억이 있을 것입니다'는 한국어에서 다소 경직되므로, 문맥상 주체를 행위자와 연결하는 '기억하실 것입니다'로 자연스럽게 옮기되 수동적 확정을 유지했습니다.
- source_word: ὑπὸ τοῦ ἐπάγοντος
  english_pob_choice: by the one who brought this upon you
  chosen_korean: 너희를 이 일을 가져오신 분께서
  alternatives_korean:
  - 너희에게 이것을 가져오신 분께서
  - 너희에게 이 재앙을 가져오신 분께서
  - 너희에게 이것을 내리신 분께서
  lexicon: LSJ
  rationale: ἐπάγω의 '가져오다/불러오다' 감각을 살려 '이 일을 가져오신'으로 옮겼고, 본문이 재앙의 내용을 직접 명시하지 않으므로 '이 재앙'처럼 내용을 좁히지 않았습니다.
theological_decisions:
- issue: 하나님을 명시적으로 밝히지 않는 후반 절 구조
  chosen_reading: 본문의 종결 절은 행위자를 '너희를 이 일을 가져오신 분'으로 돌려 말해, 하나님께서 심판을 가져오셨다는 사실과 그분이 다시 기억하신다는 점을 함께 유지합니다.
  alternative_readings:
  - '''하나님께서 너희를 기억하실 것입니다''라고 명시적으로 옮길 수 있습니다.'
  - '''너희에게 재앙을 내리신 분께서 기억하실 것입니다''라고 더 풀어 쓸 수 있습니다.'
  rationale: 그리스어가 신원을 반복하지 않고 참여분사로 간접 지칭하므로, 한국어도 이를 평탄화하지 않고 간접성을 유지했습니다.
  doctrine_reference: 원문 간접지칭 보존; 심판과 기억의 긴장을 함께 유지
