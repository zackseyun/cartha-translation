theological_decisions:
- issue: 구출/해방 약속의 뉘앙스
  chosen_reading: 하나님께서 부르짖는 자들을 실제로 건져 주시는 구출 약속으로 읽었습니다.
  alternative_readings:
  - ‘deliver’의 전통적 교회어인 ‘구원하다’로 좁혀 읽는 것
  - 일반적 보호 약속으로 완화해 읽는 것
  rationale: 동사 ἐξελεῖται는 단지 위로가 아니라 위협적 상황에서의 실제적 구출을 말하므로, 본문의 긴박한 약속성을 유지했습니다.
  doctrine_reference: 시편·예언서의 구출 약속 전통
- issue: ‘자녀들아’ 호칭
  chosen_reading: 직접 호소를 살려 호격형으로 ‘자녀들아’를 유지했습니다.
  alternative_readings:
  - ‘아이들아’로 완화하는 것
  - ‘아들들아’로 성별화하는 것
  rationale: τέκνα는 성별 포괄적 호칭이므로 ‘자녀들아’가 본문의 가족적 권면을 가장 잘 보존합니다.
