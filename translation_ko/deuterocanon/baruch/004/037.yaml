  rationale: 본문은 하나님을 가리키는 존칭적 명칭이므로, ‘거룩하신 분’으로 인격성과 경외를 살리면서도 문맥을 과도하게 해석하지 않았습니다.
  doctrine_reference: 하나님의 호칭은 문맥상 드러나는 함의를 보존하되, 전통적 관용어로만 고정하지 않습니다.
