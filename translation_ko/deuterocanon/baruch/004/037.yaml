  rationale: 여격은 ‘~로/가운데’처럼 여러 자연스러운 읽기가 가능하므로, 즐거움의 매개와 방향을 동시에 살리는 표현을 채택했습니다.
  doctrine_reference: 문법적 여격의 다의성을 해소하지 않고, 본문이 허용하는 의미 범위를 유지합니다.
