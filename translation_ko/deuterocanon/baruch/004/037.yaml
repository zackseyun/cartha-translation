translation:
  language: ko
  text: 보십시오, 당신이 내보냈던 당신의 아들들이 오고 있습니다. 그들은 동쪽에서 서쪽에 이르기까지 거룩하신 분의 말씀에 따라[a] 함께 모여, 하나님의 영광으로[b] 기뻐하며 오고 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘거룩하신 분의 말씀으로.’ τῷ ῥήματι는 수단을 나타내는 ‘~으로’ 또는 말씀·명령에 응답함을 나타내는 ‘~에 따라’로 이해할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘하나님의 영광을 기뻐하며.’ χαίροντες와 여격의 관계는 한국어에서 여러 자연스러운 방식으로 옮길 수 있습니다.
    reason: lexical_alternative
