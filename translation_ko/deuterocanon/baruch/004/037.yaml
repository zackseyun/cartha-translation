translation:
  language: ko
  text: 보십시오, 당신의 아들들이, 당신이 보내어 떠나게 한 그들이 오고 있습니다. 그들은 동쪽에서 서쪽까지 거룩하신 분의 말씀으로 모여들어, 하나님의 영광 가운데 기뻐하고 있습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘거룩하신 분의 말씀에 따라.’ τῷ ῥήματι는 ‘~으로’의 수단적 의미나 ‘~에 따라’의 응답적 의미로 읽을 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘하나님의 영광에 기뻐하며.’ χαίροντες와 여격의 관계는 한국어에서 여러 자연스러운 방식으로 옮길 수 있습니다.
    reason: lexical_alternative
