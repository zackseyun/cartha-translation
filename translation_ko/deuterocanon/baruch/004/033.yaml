base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/004/033.yaml
  text: For just as she rejoiced over your fall and was glad over your downfall[b][a], so she will grieve over her own desolation.
  footnotes:
  - marker: a
    text: The feminine 'she' likely refers to the hostile city or nation addressed in the surrounding context, traditionally understood as Babylon.
    reason: cross_reference
  - marker: b
    text: Or 'ruin' for 'downfall' (Greek πτῶματί); the term here refers to calamity, not a literal corpse.
    reason: lexical_alternative
translation:
  language: ko
  text: 그녀가 네 멸망을 보고 기뻐하고 네 몰락을 보고 즐거워한 것처럼, 그녀도 자기의 황폐함 때문에 슬퍼할 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 여기서 여성 단수 주어는 문맥상 적대적 도성 또는 민족을 가리키며, 전통적으로는 바빌론으로 이해됩니다.
    reason: cross_reference
  - marker: b
    text: 또는 ‘멸망’으로 옮길 수 있습니다. 헬라어 πτῶμα는 여기서 문자 그대로의 ‘시체’가 아니라 재난과 붕괴를 가리킵니다.
    reason: lexical_alternative
