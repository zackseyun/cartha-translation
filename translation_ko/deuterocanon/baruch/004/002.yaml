  text: 돌아오십시오, 야곱아, 그리고 그녀를 붙잡으십시오. 그녀의 빛을 마주한 광채를 향해 걸어가십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘돌아오십시오, 야곱아, 그리고 그것을 붙잡으십시오’라고 옮길 수 있습니다. 그리스어의 여성형 대명사는 문맥상 율법을 가리키는 것으로 이해하면 비인칭적으로 번역할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그녀의 빛을 마주한 광채’는 그리스어에 비교적 가깝게 옮긴 표현입니다. 더 자연스럽게는 ‘그녀의 빛의 광채를 향해 가십시오’처럼 이해할 수도 있습니다.
    reason: alternative_reading
