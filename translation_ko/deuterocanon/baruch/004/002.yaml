  text: Turn[a], O Jacob, and take hold of her; walk toward the radiance[b], opposite her light.
  footnotes:
  - marker: a
    text: Or 'Return, O Jacob, and grasp it'; the Greek feminine pronoun can be rendered more impersonally if understood as referring to the law rather than to wisdom personified.
    reason: lexical_alternative
  - marker: b
    text: The phrase 'walk toward the radiance, opposite her light' is formally close to the Greek. It may also be understood more idiomatically as 'make your way toward the radiance of her light.'
    reason: alternative_reading
translation:
  language: ko
  text: 돌아오십시오, 야곱아, 그리고 그것을 붙잡으십시오. 빛에 맞선 그 광채를 향해 걸어가십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘돌아오십시오, 야곱아, 그리고 그것을 붙잡으십시오’처럼 옮길 수 있습니다. 그리스어 여성형 대명사는 문맥상 율법을 가리키는 것으로 이해하면 더 비인칭적으로 번역할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘빛에 맞선 그 광채’는 그리스어에 형식적으로 매우 가깝습니다. 더 자연스럽게는 ‘그 빛의 광채를 향해 가십시오’처럼 이해할 수도 있습니다.
    reason: alternative_reading
