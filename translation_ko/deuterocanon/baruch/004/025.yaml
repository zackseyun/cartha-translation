  text: Children[a], endure patiently the wrath that has come upon you from God. The enemy pursued you, but you will soon see his destruction, and you will step upon their necks.
  footnotes:
  - marker: a
    text: 'Greek: ''his destruction ... their necks.'' The verse shifts from singular to plural in reference to the enemy, likely treating the enemy as both a single foe and a collective force.'
    reason: lexical_alternative
translation:
  language: ko
  text: 자녀들아, 하나님께로부터 너희에게 닥쳐온 진노를 오래 참으십시오. 원수는 너를 추격하였지만, 너희는 그의 멸망을 곧 보게 될 것이며, 그들의 목을 밟게 될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 헬라어는 앞부분에서 단수(그의)였다가 뒷부분에서 복수(그들의)로 바뀝니다. 이는 원수를 한 원수인 동시에 집합적 세력으로 가리키는 것으로 보입니다.
    reason: lexical_alternative
