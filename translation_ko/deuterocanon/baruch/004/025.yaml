theological_decisions:
- issue: 원수의 지시 대상이 단수에서 복수로 바뀌는 현상
  chosen_reading: '''원수는 너를 추격하였지만, 너희는 그의 멸망을 곧 보게 될 것이며, 그들의 목 위를 밟게 될 것입니다''로 단수·복수 전환을 그대로 반영합니다.'
  alternative_readings:
  - 원수는 너희를 추격하였지만, 너희는 그들의 멸망을 곧 보게 될 것입니다
  - 원수는 너를 추격하였지만, 너는 그의 멸망을 곧 보게 될 것입니다
  rationale: 헬라어가 αὐτοῦ에서 αὐτῶν으로 전환하는 긴장을 평탄화하지 않고, 본문이 의도한 집합적 원수 이미지를 보존합니다.
  doctrine_reference: 'DOCTRINE.md: Preserve theological tension rather than resolve it'
- issue: 하나님에게서 오는 진노의 직설성
  chosen_reading: '''하나님에게서 너희에게 닥쳐온 진노''로 하나님의 직접적 주권을 분명히 말합니다.'
  alternative_readings:
  - 너희에게 임한 징계
  - 너희에게 닥친 재앙
  rationale: 본문은 고난의 출처를 하나님께 연결하므로, 이를 완화하지 않고 직접적으로 번역해야 합니다.
  doctrine_reference: 'DOCTRINE.md: Original-language primacy over translation tradition'
