  source_fidelity: 수정이 필요합니다. 소유격 σου는 단수인데 초안은 두 절 모두 ‘너희’로 복수화했습니다. 또한 여성 단수 분사는 성읍을 여성으로 의인화한 것이므로, ‘그 여인’이라고 하면 실제 여성 인물로 오해될 수 있습니다. 앞 절의 ‘도시들’과 연결되는 성읍임을 밝혀야 합니다.
  naturalness: ‘네 자녀’와 ‘네 아들들’은 성읍으로 의인화된 시온을 향한 직접 호칭으로 자연스럽습니다. ‘그 성읍’은 한국어에서 선행 대상을 분명히 하면서도 간결합니다. ‘비참합니다’는 δείλαιαι의 탄식과 비참함의 뉘앙스를 ‘불행합니다’보다 더 직접적으로 나타냅니다.
