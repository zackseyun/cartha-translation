translation:
  language: ko
  text: 너희에게 이 악들을 가져오신 분께서 너희를 너희 원수들의 손에서 구해 주실 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이 재앙들’ 또는 ‘이 고난들’. 그리스어 τὰ κακὰ는 ‘악들’뿐 아니라 심각한 고난이나 재난을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπαγαγὼν
  english_pob_choice: brought ... upon
  chosen_korean: 가져오신
  alternatives_korean:
  - 불러오신
  - 가져다가 닥치게 하신
  - 불러 닥치게 하신
  lexicon: BDAG
  rationale: 부정적 사건을 백성에게 ‘가져오다’라는 방향성을 살리면서도, 한국어에서 자연스럽게 읽히도록 옮겼습니다.
- source_word: τὰ κακὰ
  english_pob_choice: these evils
  chosen_korean: 이 악들
  alternatives_korean:
  - 이 재앙들
  - 이 고난들
  - 이 불행들
  lexicon: BDAG
  rationale: 본문의 κακά는 단순한 불운보다 백성에게 닥친 심각한 악/재난을 가리킬 수 있어, POB의 ‘these evils’를 따라 ‘이 악들’로 옮겼습니다.
- source_word: ἐξελεῖται
  english_pob_choice: will rescue
  chosen_korean: 구해 주실 것입니다
  alternatives_korean:
  - 건져 주실 것입니다
  - 구원해 주실 것입니다
  - 빼내 주실 것입니다
  lexicon: BDAG
  rationale: ἐξαιρέω의 미래는 위험에서 건져 내는 능동적 구출을 뜻하므로, 현대 한국어에서 분명한 ‘구해 주실 것입니다’로 옮겼습니다.
- source_word: ἐκ χειρὸς ἐχθρῶν ὑμῶν
  english_pob_choice: from the hand of your enemies
  chosen_korean: 너희 원수들의 손에서
  alternatives_korean:
  - 너희 원수들의 권세에서
  - 너희 원수들의 손아귀에서
  - 너희 적들의 손에서
  lexicon: BDAG
  rationale: ‘손’은 성경적 권세/지배의 관용구이므로, 이를 유지해 심판과 구출의 긴장을 드러냈습니다.
theological_decisions:
- issue: 하나님이 재앙을 가져오신 분과 구원하시는 분으로 함께 제시되는 긴장
  chosen_reading: 본문의 단일 주체를 완화하지 않고, 같은 분이 재앙을 가져오시고 또 구해 주시는 것으로 옮겼습니다.
  alternative_readings:
  - 재앙의 직접 원인을 흐리게 하는 비인격적 표현
  - 구원만 강조하여 심판 행위를 약화하는 표현
  rationale: 그리스어는 한 주체를 전제로 심판과 구원을 함께 말하므로, 번역에서도 이 신학적 긴장을 보존해야 합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 3
