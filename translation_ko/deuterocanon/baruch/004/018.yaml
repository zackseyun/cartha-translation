  source_fidelity: 그리스어는 ‘너희에게 이 악한 일들/재난들을 가져오신 분’이 장차 같은 대상들을 원수들의 손에서 구출하실 것이라고 말합니다. 초안은 단일 행위자와 심판 및 구출의 관계, 미래 시제, ‘손에서’ 관용구를 대체로 보존합니다. 다만 τὰ κακὰ를 본문에서 ‘이 악들’로 옮기면 현대 한국어에서는 부자연스럽고 도덕적 악으로 읽히기 쉬워, 여기서의 고난·재난이라는 의미가 흐려집니다.
  naturalness: ‘너희에게 이 악들을 가져오신’은 직역투이며, ‘악들’도 현대 한국어 성경 문맥에서 매끄럽지 않습니다. ‘너희에게 이 재앙들을 내리신’은 부정적 사건을 당하게 한 원인성을 유지하면서 자연스럽습니다.
  terminology: ‘재앙들’은 이 문맥의 τὰ κακὰ에 적절하며, 각주에서 ‘악들’과 ‘고난들’이라는 가능한 범위를 밝혀 원문의 어휘적 폭을 보존할 수 있습니다. ‘원수들의 손에서’와 ‘구해 주실 것입니다’는 표준어 합쇼체 및 성경적 관용에 적절합니다.
