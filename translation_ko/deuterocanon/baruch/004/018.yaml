  text: For the one who brought these evils upon you will rescue you from the hand of your enemies[a].
  footnotes:
  - marker: a
    text: Or 'these calamities' or 'these troubles.' The Greek τὰ κακὰ can refer to grievous afflictions as well as 'evils.'
