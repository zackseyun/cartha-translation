    reason: lexical_alternative
  - marker: b
    text: ‘황량한 채로 남겨졌습니다’는 ‘혼자 남겨졌습니다’, ‘쓸쓸이 남겨졌습니다’ 또는 ‘버려진 채 남겨졌습니다’로도 옮길 수 있습니다.
    reason: lexical_alternative
