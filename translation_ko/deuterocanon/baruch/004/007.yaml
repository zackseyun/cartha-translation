  rationale: 그리스어 분사구의 인격적 호칭을 자연스럽게 옮기면서도, ποιέω의 폭넓은 의미를 무리 없이 반영합니다.
- source_word: θύσαντες δαιμονίοις καὶ οὐ θεῷ
  english_pob_choice: by sacrificing to demons and not to God
  chosen_korean: 우상들에게 제사하며 하나님이 아니라
  alternatives_korean:
  - 귀신들에게 제사하며 하나님이 아니라
  - 악한 영들에게 제사하며 하나님이 아니라
  lexicon: BDAG
  rationale: θύσαντες의 제사 행위를 살리고, δαιμόνιοις는 이 유대-헬라어 문맥에서 단순한 ‘우상’보다 제사 대상이 된 영적 존재를 가리키므로 본문 주해를 반영해 옮겼습니다.
theological_decisions:
- issue: δαιμονίοις의 한국어 대응과 우상 제사의 관계
  chosen_reading: ‘우상들에게 제사하다’라는 표현으로, 우상 숭배가 실제로 하나님을 대적하는 영적 존재들에게 드리는 제사라는 점을 드러냈습니다.
  alternative_readings:
  - ‘귀신들에게 제사하다’
  - ‘악한 영들에게 제사하다’
  rationale: 본문의 논지는 단순한 종교적 오차가 아니라 하나님을 격노하게 하는 실제적 배신입니다. 한국어에서는 의미를 분명히 하되, 독자가 본문이 말하는 우상 제사의 신학적 무게를 느끼도록 했습니다.
  doctrine_reference: 바룩 4:7의 우상 숭배 비판; 신명기적 언약 배반의 언어
