  source_fidelity: 수정이 필요합니다. δαιμονίοις는 이 제사 문맥에서 ‘귀신들’(demons)을 가리키는데, 초안의 ‘우상들에게’는 제사의 대상에 관한 원문의 표현을 바꾸었습니다. 또한 ‘하나님이 아니라 그분을’은 문장상 대조의 대상과 대명사 지시가 불명확합니다.
  naturalness: 수정문은 현대 표준 한국어의 합쇼체로 자연스럽고, 분사 θύσαντες의 수단적 기능을 ‘…드리지 않음으로써’로 매끄럽게 반영합니다.
  terminology: ‘귀신들’은 δαιμονίοις의 유대-헬라어적 논쟁 문맥과 영어 POB의 ‘demons’를 충실히 반영합니다. τὸν ποιήσαντα ὑμᾶς는 ‘너희를 지으신 분’으로 유지할 수 있습니다.
  issues:
  - severity: high
    issue: δαιμονίοις를 ‘우상들에게’로 번역함
    rationale: '원문은 우상 자체(예: εἴδωλα)가 아니라 ‘귀신들’에게 제사했다고 말합니다. 우상 숭배와 연관된 의미를 설명으로 보충할 수는 있어도 본문 제사 대상을 대체해서는 안 됩니다.'
  - severity: medium
    issue: ‘하나님이 아니라 그분을’의 대조 및 지시 대상이 불명확함
    rationale: καὶ οὐ θεῷ는 ‘귀신들에게’와 병렬된 여격으로, ‘하나님께는 [제사드리지 않고]’라는 뜻입니다. 초안의 ‘그분’은 문법적으로 누구를 가리키는지 혼동을 일으킵니다.
  - severity: low
