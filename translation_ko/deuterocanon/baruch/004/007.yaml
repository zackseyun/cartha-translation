  alternative_readings:
  - ‘귀신들에게 제사하다’
  - ‘악한 영들에게 제사하다’
  rationale: 본문의 논지는 단순한 종교적 오차가 아니라 하나님을 격노하게 하는 실제적 배신입니다. 한국어에서는 의미를 분명히 하되, 독자가 본문이 말하는 우상 제사의 신학적 무게를 느끼도록 했습니다.
