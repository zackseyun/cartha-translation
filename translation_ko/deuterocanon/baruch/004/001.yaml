  source_fidelity: ‘생명을 얻고’는 εἰς ζωὴν의 압축된 표현을 한 단계 해석하여 확정합니다. ‘생명에 이르지만’은 한국어로 자연스러운 문장을 이루면서도 생명과의 관계라는 원문의 표현을 더 가깝게 보존합니다. κρατοῦντες에는 ‘굳게 붙드는’이 ‘지키는’보다 ‘붙들다/굳게 지니다’라는 어휘상을 더 직접적으로 반영합니다.
  naturalness: 원문의 ‘... 얻고, 그러나 ...’는 한국어 접속 구조로 어색합니다. ‘... 이르지만, ... 죽을 것입니다’로 고치면 현대 표준어 합쇼체에서 매끄럽고 대조도 선명합니다. ‘하나님의 계명들이 담긴 책’은 ‘하나님의 계명들의 책’보다 자연스럽습니다.
  terminology: ‘하나님’, ‘계명’, ‘율법’, ‘생명’, ‘죽다’는 문맥과 현대 성서 한국어에 적절합니다. ‘율법’은 νόμος의 규범적 의미를 보존합니다.
  issues:
