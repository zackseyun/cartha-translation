base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/004/001.yaml
  text: This is the book of the commandments of God[a], and the law that endures forever; all who hold fast to it are for life, but those who forsake it will die.
  footnotes:
  - marker: a
    text: Or 'all who hold fast to it will live.' The Greek reads literally 'all who hold fast to it, for life,' an elliptical expression contrasting with 'those who forsake it will die.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이것은 하나님의 계명들이 담긴 책이며, 영원히 남아 있는 율법입니다. 그것을 굳게 붙드는 사람은 생명에 이르지만[a], 그것을 버리는 사람은 죽을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 문자적으로 ‘그것을 굳게 붙드는 모든 사람은 생명에’라고 하며, ‘생명에 이른다’라는 뜻이 압축되어 표현되어 있습니다. 또는 ‘그것을 굳게 붙드는 모든 사람은 살 것이다’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: βίβλος
  english_pob_choice: book
  chosen_korean: 책
  alternatives_korean:
  - 두루마리
  - 서책
  lexicon: LSJ
  rationale: βίβλος의 기본 뜻은 기록된 책이며, 현대 한국어에서는 ‘책’이 가장 자연스럽고 바로 이해되는 대응입니다.
- source_word: προσταγμάτων
  english_pob_choice: commandments
  chosen_korean: 계명들
  alternatives_korean:
  - 명령들
  - 법령들
  - 훈령들
  lexicon: LSJ
  rationale: πρόσταγμα은 권위 있는 명령을 가리키므로, 하나님의 권위가 드러나는 ‘계명들’이 가장 적절합니다.
- source_word: νόμος
  english_pob_choice: law
  chosen_korean: 율법
  alternatives_korean:
  - 법
  - 가르침
  lexicon: LSJ
  rationale: 문맥상 하나님의 규범적이고 언약적인 법을 가리키므로, 일반적인 ‘법’보다 성서적 용례가 분명한 ‘율법’이 더 정확합니다.
- source_word: ὁ ὑπάρχων εἰς τὸν αἰῶνα
  english_pob_choice: that endures forever
  chosen_korean: 영원히 남아 있는
  alternatives_korean:
  - 영원히 존재하는
  - 영원히 지속되는
  lexicon: LSJ
  rationale: 현재 분사와 ‘영원에 이르도록’의 결합은 지속성과 존속을 나타내므로, 한국어에서는 자연스럽게 ‘영원히 남아 있는’으로 옮겼습니다.
- source_word: κρατοῦντες
  english_pob_choice: hold fast to
  chosen_korean: 굳게 지키는
  alternatives_korean:
  - 굳게 붙드는
  - 굳게 붙잡는
  - 꽉 붙드는
  lexicon: LSJ
  rationale: κρατέω의 단순한 ‘붙잡다’보다, 율법에 대한 충실한 준수를 드러내는 ‘굳게 지키다’가 문맥상 더 적합합니다.
- source_word: εἰς ζωὴν
  english_pob_choice: are for life
  chosen_korean: 생명을 얻고
  alternatives_korean:
  - 생명을 위한 것입니다
  - 생명을 향합니다
  - 생명에 속합니다
  lexicon: LSJ
  rationale: 그리스어는 ‘생명을 향하여/생명을 위해’라는 생략적 표현이므로, 뒤의 ‘죽을 것입니다’와 분명한 대조를 이루도록 자연스러운 한국어로 풀었습니다.
- source_word: καταλείποντες
  english_pob_choice: forsake
  chosen_korean: 버리는
  alternatives_korean:
  - 저버리는
  - 떠나는
  - 포기하는
  lexicon: LSJ
  rationale: 의도적으로 남겨 두고 떠나는 뉘앙스를 살리면서도 문맥의 직설성을 유지하기 위해 ‘버리는’이 가장 간결합니다.
theological_decisions:
- issue: 생명/죽음의 대조를 완화하지 않을지 여부
  chosen_reading: ‘생명을 얻고 ... 죽을 것입니다’로 생명과 죽음의 직접 대조를 유지했습니다.
  alternative_readings:
  - 살게 될 것입니다 ... 멸망할 것입니다
  - 생명에 이를 것입니다 ... 죽게 될 것입니다
  rationale: 본문은 ζωή와 ἀποθανοῦνται를 직접 대조하므로, 의미를 부드럽게 완화하지 않고 경고의 강도를 그대로 살렸습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
- issue: εἰς ζωὴν을 해석적으로 확장할지 여부
  chosen_reading: ‘생명을 얻고’로 옮겨, 본문의 생략적 표현을 한국어에서 이해 가능하게 만들었습니다.
  alternative_readings:
  - 생명을 위해
  - 생명에 속하여
  - 생명으로
  rationale: 그리스어는 문법적으로 압축된 표현이므로, 한국어에서는 독자가 곧바로 뜻을 파악할 수 있게 하되 ‘죽을 것입니다’와의 대조 구조를 유지했습니다.
  doctrine_reference: Translation philosophy §§1, 5
