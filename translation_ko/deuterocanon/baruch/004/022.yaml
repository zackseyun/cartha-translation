  text: For I have hoped in the Eternal One for your salvation, and joy has come to me from the Holy One because of the mercy that will quickly come to you from your eternal Savior.
translation:
  language: ko
  text: 내가 너희의 구원을 위하여 영원하신 분께 바랐기 때문에, 거룩하신 분에게서 기쁨이 내게 왔습니다. 이는 너희에게 그 영원하신 구원자에게서 속히 올 자비 때문입니다.
  philosophy: formal
lexical_decisions:
- source_word: ἐπὶ τῷ αἰωνίῳ
  english_pob_choice: in the Eternal One
  chosen_korean: 영원하신 분께
  alternatives_korean:
  - 영원하신 이에게
  - 영원하신 분을 의지하여
  lexicon: αἰώνιος
  rationale: 영원하신 분을 인격적 호칭으로 살리면서도, 이어지는 구원과 자비의 문맥에 맞게 신뢰의 대상을 분명히 드러냅니다.
- source_word: τὴν σωτηρίαν ὑμῶν
  english_pob_choice: your salvation
  chosen_korean: 너희의 구원을
  alternatives_korean:
  - 너희의 구원을 위하여
  - 너희의 구원
  lexicon: σωτηρία
  rationale: 구원을 추상명사로만 두지 않고 앞뒤 문맥이 요구하는 목적성을 살려 자연스럽게 옮겼습니다.
- source_word: παρὰ τοῦ ἁγίου
  english_pob_choice: from the Holy One
  chosen_korean: 거룩하신 분에게서
  alternatives_korean:
  - 거룩하신 분으로부터
  - 성스러운 분에게서
  lexicon: ἅγιος
  rationale: 하나님을 가리키는 칭호로서 ‘거룩하신 분’을 택해, 인격적 출처를 유지하면서도 공경의 뉘앙스를 살렸습니다.
- source_word: ἐν τάχει
  english_pob_choice: quickly
  chosen_korean: 속히
  alternatives_korean:
  - 곧
  - 빠르게
  lexicon: τάχος
  rationale: English POB의 ‘quickly’를 따라 시간적 긴급성과 임박성을 함께 담는 가장 간결한 한국어로 옮겼습니다.
theological_decisions:
- issue: παρὰ τοῦ αἰωνίου σωτῆρος ὑμῶν의 호칭 처리
  chosen_reading: ‘너희의 영원하신 구원자’로 옮겨, 구원자라는 직함과 영원성의 수식을 함께 보존했습니다.
  alternative_readings:
  - ‘너희의 영원한 구원자’
  - ‘너희를 구원하시는 영원하신 분’
  rationale: 본문은 구원의 주체를 추상적 개념이 아니라 인격적 구원자로 제시하므로, 직함을 유지하는 번역이 더 직접적입니다.
  doctrine_reference: 구원론, 하나님의 인격적 구원 행위
