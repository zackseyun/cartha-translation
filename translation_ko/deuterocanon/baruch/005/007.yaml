base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/005/007.yaml
  text: For God has ordered that every high mountain and the everlasting hills be made low[a], and the valleys be filled for the leveling of the ground, so that Israel may walk safely in the glory of God.
  footnotes:
  - marker: a
    text: Or 'by the glory of God' or 'through the glory of God.' The Greek dative allows either an instrumental or a more associative/spherical sense.
    reason: alternative_reading
translation:
  language: ko
  text: 이는 하나님께서 이스라엘이 하나님의 영광 가운데 안전하게 걸어가도록, 모든 높은 산과 영원한 언덕은 낮아지고 골짜기들은 채워져 땅이 평탄해지도록 정하셨기 때문입니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하나님의 영광에 의해’ 또는 ‘하나님의 영광을 통해’. 그리스어 여격은 수단적 의미일 수도 있고, 더 넓게 관련성이나 영역을 나타낼 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: συνέταξεν
  english_pob_choice: has ordered
  chosen_korean: 하시어
  alternatives_korean:
  - 명하셨기 때문입니다
  - 질서 있게 정하셨기 때문입니다
  - 명령하셨기 때문입니다
  lexicon: LSJ
  rationale: 하나님의 주권적 명령과 배열의 의미를 살리되, 한국어 문맥에서는 뒤의 결과절을 자연스럽게 이끄는 ‘하시어’가 가장 간결합니다.
- source_word: ταπεινοῦσθαι πᾶν ὄρος ὑψηλὸν καὶ θῖνας αἰωνίους
  english_pob_choice: every high mountain and the everlasting hills be made low
  chosen_korean: 모든 높은 산과 영원한 언덕을 낮아지게
  alternatives_korean:
  - 모든 높은 산과 영원한 언덕이 낮아지게
  - 모든 높은 산과 영원한 언덕을 낮추게
  - 모든 높은 산과 영원한 언덕이 낮게 되게
  lexicon: LSJ
  rationale: 산과 언덕에 대한 물리적 낮아짐의 이미지를 살려 ‘낮아지게’로 옮겼고, ‘영원한’은 오래 지속된 산지의 장중한 표현을 보존합니다.
- source_word: φάραγγας πληροῦσθαι εἰς ὁμαλισμὸν τῆς γῆς
  english_pob_choice: the valleys be filled for the leveling of the ground
  chosen_korean: 골짜기들을 채워 땅을 평탄하게
  alternatives_korean:
  - 골짜기들을 채워 땅을 고르게
  - 골짜기들을 메워 땅을 평평하게
  - 골짜기들을 채워 땅의 평탄함을 이루게
  lexicon: LSJ
  rationale: ‘채워’는 πληροῦσθαι의 수동적 채움과 지형 변화 이미지를 살리고, ‘평탄하게’는 ὁμαλισμὸς의 결과를 자연스러운 한국어로 옮깁니다.
- source_word: τῇ τοῦ θεοῦ δόξῃ
  english_pob_choice: in the glory of God
  chosen_korean: 하나님의 영광 가운데
  alternatives_korean:
  - 하나님의 영광 안에서
  - 하나님의 영광으로
  - 하나님의 영광에 의해
  lexicon: LSJ
  rationale: 여격의 의미가 도구적일 수도, 영역적일 수도 있으므로, 의미를 과도하게 한정하지 않는 ‘가운데’로 옮겨 POB의 열린 독법을 반영합니다.
theological_decisions:
- issue: 이스라엘이 ‘하나님의 영광 가운데’ 안전하게 걷는다는 표현의 여격 의미
  chosen_reading: 영광은 이스라엘의 길을 둘러싼 영역이자, 그 안전을 가능하게 하는 하나님의 현현으로 표현했습니다.
  alternative_readings:
  - 하나님의 영광에 의해 안전하게
  - 하나님의 영광으로 말미암아 안전하게
  rationale: 본문의 여격은 수단과 영역의 두 가능성을 모두 열어 두므로, 단정적 인과보다 장엄한 현현의 분위기를 살리는 쪽이 원문 긴장을 보존합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 3
