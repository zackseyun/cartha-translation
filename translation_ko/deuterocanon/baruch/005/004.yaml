lexical_decisions:
- source_word: κληθήσεται
  english_pob_choice: will be called
  chosen_korean: 부르실 것입니다
  alternatives_korean:
  - 불릴 것입니다
  - 불리게 될 것입니다
  lexicon: BDAG
  rationale: 이 수동 미래형은 이름이 주어지는 의미이므로, 한국어에서는 자연스러운 피동 표현인 ‘부르실 것입니다’로 옮겨 이름의 부여를 살렸습니다.
- source_word: παρὰ τοῦ θεοῦ
  english_pob_choice: by God
  chosen_korean: 하나님께서
  alternatives_korean:
  - 하나님으로부터
  - 하나님에 의해
  lexicon: BDAG
  rationale: 이름을 정해 주는 주체를 드러내기 위해 행위 주체형으로 옮겼고, 한국어에서는 ‘하나님께서’가 가장 자연스럽고 명확합니다.
- source_word: εἰρήνη δικαιοσύνης
  english_pob_choice: Peace of righteousness
  chosen_korean: 의의 평강
  alternatives_korean:
  - 의의 평화
  - 정의의 평강
  lexicon: BDAG
  rationale: δικαιοσύνη는 이 프로젝트 기본값에 따라 ‘의’로 옮기되, 명칭의 구성요소로서 앞뒤를 뒤집지 않고 간결한 명사구 ‘의의 평강’으로 재현했습니다.
- source_word: θεοσεβείας
  english_pob_choice: godliness
  chosen_korean: 경건
  alternatives_korean:
  - 하나님 경외
  - 하나님을 경외함
  lexicon: BDAG
  rationale: θεοσέβεια는 하나님을 향한 경외와 경건을 뜻하므로, 제목형 명사구 안에서는 현대 한국어에서 가장 간결한 ‘경건’이 적절합니다.
theological_decisions:
- issue: εἰρήνη δικαιοσύνης를 '평강'으로 둘지 '평화'로 둘지
  chosen_reading: 의의 평강
  alternative_readings:
  - 의의 평화
  - 의와 평강
  rationale: 프로젝트 기본값에 따라 εἰρήνη는 ‘평강’으로 유지해 성경적 어감을 살렸고, δικαιοσύνη는 일반적 윤리보다 언약적·신학적 넓이를 지닌 ‘의’로 남겼습니다.
  doctrine_reference: 'DOCTRINE.md defaults: εἰρήνη → 평강, δικαιοσύνη → 의'
- issue: 끝부분을 새로 주어진 이름의 내용으로 이해할지 여부
  chosen_reading: 따옴표로 표시된 명명(命名) 구문
  alternative_readings:
  - 서술적 동격으로 무인용 처리
  - 해설적 문장으로 풀어쓰기
  rationale: 헬라어는 ‘너의 이름은… 불릴 것이다’ 뒤에 두 명사구가 이어지는 명명 공식이므로, 따옴표로 묶어 새 이름의 내용임을 드러내되 추가 해석은 억제했습니다.
  doctrine_reference: 'English POB audit trail: quoted appositional title'
