lexical_decisions:
- source_word: ἡγήσεται
  english_pob_choice: will lead
  chosen_korean: 인도하시고
  alternatives_korean:
  - 이끄시고
  - 안내하시고
  lexicon: BDAG
  rationale: ἡγέομαι의 미래형은 여기서 백성을 앞서 이끄는 의미이므로, 출애굽·회복의 뉘앙스를 살려 '인도하다'를 택했습니다.
- source_word: μετʼ εὐφροσύνης
  english_pob_choice: with gladness
  chosen_korean: 기쁨 가운데
  alternatives_korean:
  - 즐거움 가운데
  - 환희 가운데
  lexicon: LSJ
  rationale: εὐφροσύνη는 단순 감정어보다 기쁨과 즐거움의 상태를 가리키므로, 문맥상 자연스러운 '기쁨 가운데'로 옮겼습니다.
- source_word: τῷ φωτὶ τῆς δόξης αὐτοῦ
  english_pob_choice: by the light of his glory
  chosen_korean: 그의 영광의 빛으로
  alternatives_korean:
  - 그의 영광의 빛을 따라
  - 그의 영광의 빛 안에서
  lexicon: LSJ
  rationale: 여기서는 수단/동반의 여격을 살려 하나님이 '영광의 빛'을 매개로 인도하신다는 뜻이므로, '...빛으로'가 가장 간결하고 직접적입니다.
- source_word: ἐλεημοσύνῃ
  english_pob_choice: mercy
  chosen_korean: 자비
  alternatives_korean:
  - 긍휼
  - 인자
  lexicon: LSJ
  rationale: 이 단어는 여기서 구제 행위가 아니라 하나님께 속한 자비로운 성품을 가리키므로, 문맥에 맞는 '자비'를 택했습니다.
- source_word: δικαιοσύνῃ
  english_pob_choice: righteousness
  chosen_korean: 의
  alternatives_korean:
  - 정의
  - 올바름
  lexicon: BDAG
  rationale: 프로젝트 기본값에 따라 δικαιοσύνη는 '의'로 옮겼고, 자비와 나란히 놓인 하나님의 속성으로서의 의미를 유지했습니다.
- source_word: τῇ παρʼ αὐτοῦ
  english_pob_choice: from him
  chosen_korean: 그에게서 나오는
  alternatives_korean:
  - 그로부터 오는
  - 그분에게서
  lexicon: LSJ
  rationale: 전치사 구문이 자비와 의 모두에 걸려 하나님에게서 유래함을 나타내므로, 한국어에서는 분명하게 '그에게서 나오는'으로 풀었습니다.
theological_decisions:
- issue: ἐλεημοσύνη의 의미를 '구제'로 좁힐지 여부
  chosen_reading: 하나님의 속성으로서의 자비
  alternative_readings:
