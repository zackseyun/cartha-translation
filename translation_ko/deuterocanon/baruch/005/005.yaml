base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/005/005.yaml
  text: Rise up[a], Jerusalem, and stand on the height, and look toward the east, and see your children gathered from the setting of the sun to its rising, at the word of the Holy One[b], rejoicing in the remembrance of God.
  footnotes:
  - marker: a
    text: Or 'by the word of the Holy One.' The dative τῷ ῥήματι may be understood instrumentally.
    reason: lexical_alternative
  - marker: b
    text: Or 'because God remembered them' or 'in remembrance of God.' The Greek phrase is compact and may point either to God's remembering his people or to their remembering God.
    reason: alternative_reading
translation:
  language: ko
  text: 예루살렘아, 일어나십시오. 높은 곳에 서서 동쪽을 바라보십시오. 해 지는 곳에서 해 뜨는 곳까지 거룩하신 분의 말씀에 따라[a] 모여 하나님의 기억 가운데[b] 기뻐하는 당신의 자녀들을 보십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘거룩하신 분의 말씀으로.’ 여격 τῷ ῥήματι는 수단의 뜻으로도 이해할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘하나님이 그들을 기억하심으로’ 또는 ‘하나님을 기억하며.’ 그리스어 표현은 하나님이 그들을 기억하시는 뜻일 수도 있고, 그들이 하나님을 기억하는 뜻일 수도 있습니다.
    reason: alternative_reading
