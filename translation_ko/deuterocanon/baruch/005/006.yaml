base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/005/006.yaml
  text: For they went out from you on foot[a], being led away by enemies, but God brings them to you[b], carried with glory as on a royal throne.
  footnotes:
  - marker: a
    text: Or 'God leads them in to you'; the Greek verb is literally 'brings in' or 'leads in,' here in the context of return from exile.
    reason: lexical_alternative
  - marker: b
    text: Or 'borne' or 'lifted up'; the image contrasts their going out on foot with an honored, exalted return.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 적들에게 끌려가며 걸어서 당신에게서 떠났지만, 하나님께서는 그들을 왕의 보좌처럼 영광 가운데 높이 들어[b] 당신께로 데려오십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신께로 인도해 들어오십니다’. 그리스어 동사는 문자적으로 ‘데려오다’ 또는 ‘인도해 들어오다’라는 뜻입니다.
    reason: εἰσάγει의 직역적 대안을 제시하며, 귀환 문맥을 본문에 과도하게 덧붙이지 않습니다.
  - marker: b
    text: 또는 ‘실어’ 또는 ‘들어 올려’. 이는 앞의 ‘걸어서’와 대조되는, 존귀하게 높여진 귀환의 이미지를 나타냅니다.
    reason: αἰρομένους의 ‘운반되다/들려 가다’라는 의미와 시적 이미지의 여지를 보존합니다.
