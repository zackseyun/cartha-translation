base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/005/006.yaml
  text: For they went out from you on foot[a], being led away by enemies, but God brings them to you[b], carried with glory as on a royal throne.
  footnotes:
  - marker: a
    text: Or 'God leads them in to you'; the Greek verb is literally 'brings in' or 'leads in,' here in the context of return from exile.
    reason: lexical_alternative
  - marker: b
    text: Or 'borne' or 'lifted up'; the image contrasts their going out on foot with an honored, exalted return.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 적들에게 끌려가며 발로 당신에게서 나갔으나, 하나님께서는 그들을 영광과 함께, 마치 왕의 보좌에나 실린 것처럼 당신께로 데려오십니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하나님께서 그들을 당신께로 데려오십니다’. 그리스어 동사는 문자적으로는 ‘데려오다/인도해 들어오다’의 뜻입니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘실려’ 또는 ‘들려’. 앞의 ‘발로’와 대조되는, 존귀하게 높여진 귀환의 이미지를 드러냅니다.
    reason: alternative_reading
