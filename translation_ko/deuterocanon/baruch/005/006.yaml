theological_decisions:
- issue: 포로 귀환의 전복적 이미지
  chosen_reading: 출발은 굴욕적인 포로 이동으로, 귀환은 하나님이 주도하는 영광스러운 회복으로 대비했습니다.
  alternative_readings:
  - ‘데려오십니다’보다 ‘인도하십니다’로 중립화할 수 있습니다.
  - ‘영광과 함께’를 ‘영광 가운데’로 옮겨 더 시적인 톤을 만들 수 있습니다.
  rationale: 시편적·예언적 회복 상징을 약화시키지 않으면서, 포로 상태와 영화로운 귀환의 대조를 그대로 드러내는 것이 본문의 핵심이라고 보았습니다.
  doctrine_reference: Translation philosophy §1, §3, §6
