lexical_decisions:
- source_word: ὁ γὰρ θεός
  english_pob_choice: For God
  chosen_korean: 그러므로 하나님께서는
  alternatives_korean:
  - 이는 하나님께서
  - 왜냐하면 하나님께서
  lexicon: BDAG
  rationale: γάρ는 앞 문맥의 근거를 잇는 연결사이므로, 한국어에서는 자연스럽게 원인·근거를 잇는 ‘그러므로’로 옮겨 문맥 흐름을 살렸습니다.
- source_word: δείξει
  english_pob_choice: will show
  chosen_korean: 보여 주실 것입니다
  alternatives_korean:
  - 드러내실 것입니다
  - 나타내실 것입니다
  - 보이실 것입니다
  lexicon: BDAG
  rationale: 미래 능동형 δείκνυμι는 ‘보여 주다’가 가장 직접적이며, 하나님이 그 대상의 가시적 인지 가능성을 열어 주신다는 뜻을 자연스럽게 살렸습니다.
- source_word: τῇ ὑπʼ οὐρανὸν πάσῃ
  english_pob_choice: to all under heaven
  chosen_korean: 하늘 아래의 모든 이에게
  alternatives_korean:
  - 온 세상에
  - 하늘 아래 있는 모든 사람에게
  - 천하의 모든 이에게
  lexicon: BDAG
  rationale: 관용적 범위를 지닌 표현이므로 의미를 풀되 과도하게 확대하지 않고, ‘하늘 아래의 모든 이’로 이미지와 보편성을 함께 유지했습니다.
- source_word: λαμπρότητα
  english_pob_choice: splendor
  chosen_korean: 찬란함
  alternatives_korean:
  - 광휘
  - 영광
  - 화려함
  lexicon: BDAG
  rationale: λαμπρότης는 빛남과 위엄을 함께 담는 말이어서, 교회적 관용어인 ‘영광’보다 시각적·존귀적 뉘앙스를 함께 살리는 ‘찬란함’을 선택했습니다.
