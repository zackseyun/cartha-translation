  rationale: 본문은 하나님이 예루살렘의 회복된 아름다움과 위엄을 만천하에 드러내시는 장면이므로, δόξα가 아닌 λαμπρότητα의 빛나는 성격을 보존하는 것이 적절합니다.
  doctrine_reference: 번역 원칙 §1, §5
