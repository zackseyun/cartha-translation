lexical_decisions:
- source_word: Ἔκδυσαι
  english_pob_choice: Take off
  chosen_korean: 벗어 버리고
  alternatives_korean:
  - 벗으십시오
  - 벗어 내고
  - 벗어 던지고
  lexicon: LSJ
  rationale: 옷을 벗는 동작을 자연스럽게 살리면서, 뒤따르는 ‘입으라’와 짝을 이루는 명령의 힘을 유지했습니다.
- source_word: στολὴν τοῦ πένθους καὶ τῆς κακώσεώς σου
  english_pob_choice: the garment of your mourning and affliction
  chosen_korean: 애도와 고통의 옷
  alternatives_korean:
  - 애도와 괴로움의 옷
  - 상중과 고난의 옷
  - 애도와 비참함의 옷
  lexicon: LSJ
  rationale: στολή의 의복 이미지를 살리되, πένθος과 κάκωσις를 현대 한국어로 과도하게 설명하지 않고 병렬 구조로 압축해 원문의 비유를 보존했습니다.
- source_word: ἔνδυσαι
  english_pob_choice: put on
  chosen_korean: 입으십시오
  alternatives_korean:
  - 입어라
  - 둘러입으십시오
  - 걸치십시오
  lexicon: LSJ
  rationale: ἀorist middle imperative의 대칭성을 살려 ‘벗다/입다’의 직접 대응을 유지했습니다.
- source_word: τὴν εὐπρέπειαν τῆς παρὰ τοῦ θεοῦ δόξης
  english_pob_choice: the splendor of the glory from God
  chosen_korean: 하나님의 영광에서 오는 아름다움
  alternatives_korean:
  - 하나님에게서 오는 영광의 아름다움
  - 하나님으로부터 오는 영광의 광휘
  - 하나님의 영광의 아름다움
  lexicon: LSJ
  rationale: εὐπρέπεια의 ‘아름다움/단정함/아름다움의 품격’과 δόξα의 ‘영광’을 함께 살리되, παρά의 출처 의미를 ‘에서 오는’으로 드러냈습니다.
- source_word: εἰς τὸν αἰῶνα
  english_pob_choice: forever
  chosen_korean: 영원히
  alternatives_korean:
  - 영원토록
  - 세세토록
  - 끝없이
  lexicon: LSJ
  rationale: 지속성과 종결 없음의 의미를 가장 간결하게 전달하는 한국어로 옮겼습니다.
theological_decisions:
- issue: 예루살렘의 인격화와 명령형 어조
  chosen_reading: 예루살렘을 직접 부르며 옷을 갈아입는 상징적 복원 장면을 그대로 살렸습니다.
  alternative_readings:
  - 공동체 전체에 대한 일반 진술로 완화함
  - 의복 비유를 약화하고 추상적으로 재진술함
  rationale: 원문이 도시를 여성/인격체처럼 직접 호명하며 명령하므로, 예언적 회복의 힘을 보존하기 위해 그 수사적 장치를 유지했습니다.
  doctrine_reference: Translation philosophy §§1, 6
- issue: 하나님의 기원이 드러나는 표현
  chosen_reading: ‘하나님의 영광에서 오는’으로 번역해 출처/근원을 분명히 했습니다.
  alternative_readings:
  - ‘하나님의 영광’
  - ‘하나님께서 주시는 영광’
  rationale: παρά τοῦ θεοῦ는 단순 소유보다 기원과 출처를 가리키므로, 회복의 아름다움이 하나님에게서 주어지는 것임을 분명히 했습니다.
  doctrine_reference: Translation philosophy §§1, 5
