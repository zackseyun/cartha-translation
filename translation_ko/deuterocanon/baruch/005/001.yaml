    rationale: ἐκδύω는 옷을 벗는다는 뜻이며, ‘버리다’는 원문에 없는 폐기의 뉘앙스를 더할 수 있습니다. ‘벗고’가 양 imperatives의 병렬성과 의복 은유를 더 직접적으로 보존합니다.
