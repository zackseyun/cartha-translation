    rationale: 원문은 ‘하나님에게서 오는 영광의 아름다움’(εὐπρέπεια [τῆς ... δόξης])이지, ‘하나님의 영광에서 오는 아름다움’으로 아름다움이 영광에서 파생된다고 명시하는 표현은 아닙니다. 또한 ‘하나님에게서’가 δόξα를 수식한다는 점을 드러내는 편이 충실합니다.
