  - 삼림들
  lexicon: δρυμός
  rationale: 복수형을 살려 ‘숲들’로 옮겼고, 문맥상 집합적 의미는 유지했습니다.
- source_word: πᾶν ξύλον εὐωδίας
  english_pob_choice: every fragrant tree
  chosen_korean: 향기로운 나무마다
  alternatives_korean:
  - 향기로운 모든 나무
  - 향내 나는 나무마다
  lexicon: ξύλον + εὐωδία
  rationale: ‘마다’로 πᾶν의 분배적 의미를 살리고, εὐωδία는 문맥상 ‘향기로운’으로 자연스럽게 표현했습니다.
- source_word: τῷ Ἰσραὴλ
  english_pob_choice: to Israel
  chosen_korean: 이스라엘에게
  alternatives_korean:
  - 이스라엘을 위해
  - 이스라엘을 향하여
  lexicon: dative of advantage/direction
  rationale: 여격의 수혜/방향 관계를 한국어 조사 ‘에게’로 간명하게 반영했습니다.
- source_word: προστάγματι τοῦ θεοῦ
  english_pob_choice: by the command of God
  chosen_korean: 하나님의 명령으로
  alternatives_korean:
  - 하나님의 명령에 따라
  - 하나님의 명령에 의하여
  lexicon: πρόσταγμα
  rationale: 영 POB의 ‘by the command of God’를 그대로 반영하면서, 원문의 수단/근거 관계를 한국어 부사격 ‘-으로’로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 하나님의 명령이 그늘을 주는 원인/매개로 제시되는 표현
  chosen_reading: 자연 현상 전체가 하나님의 명령 아래 있다는 점을 그대로 살려, ‘하나님의 명령으로’로 번역했습니다.
  alternative_readings:
  - 하나님의 명령에 따라
  - 하나님의 명령에 의하여
  rationale: 원문은 생성적 은유를 통해 피조 세계가 하나님의 통치에 복종함을 드러내므로, 원인과 통치의 뉘앙스를 약화하지 않는 표현이 적절합니다.
  doctrine_reference: 하나님의 섭리와 창조 통치
