lexical_decisions:
- source_word: ἐσκίασαν
  english_pob_choice: gave shade
  chosen_korean: 그늘을 드리리라
  alternatives_korean:
  - 그늘을 주었습니다
  - 그늘이 되었습니다
  lexicon: σκιάζω
  rationale: 미래적 약속의 뉘앙스를 살리면서, ‘그늘을 드리다’로 자연스럽고 직역에 가깝게 옮겼습니다.
- source_word: οἱ δρυμοί
  english_pob_choice: the forests
  chosen_korean: 숲들
  alternatives_korean:
