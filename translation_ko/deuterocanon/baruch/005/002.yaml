  lexicon: LSJ
  rationale: διπλοΐς는 외투성 겉옷을 가리키므로, 자연스러운 현대 한국어로는 '겉옷'이 가장 직접적이며 문맥의 장엄한 복장 이미지를 살립니다.
- source_word: τῆς παρὰ τοῦ θεοῦ δικαιοσύνης
  english_pob_choice: the righteousness that comes from God
  chosen_korean: 하나님에게서 오는 의
  alternatives_korean:
  - 하나님에게서 오는 정의
  - 하나님의 의
  - 하나님으로부터 오는 의
  lexicon: BDAG
  rationale: παρά + genitive는 출처를 나타내므로 '하나님에게서 오는'으로 옮겼고, δικαιοσύνη는 기본적으로 '의'로 번역해 POB의 신학적 일관성을 따랐습니다.
- source_word: μίτραν
  english_pob_choice: turban
  chosen_korean: 관
  alternatives_korean:
  - 터번
  - 머리쓰개
  - 미트라
  lexicon: LSJ
  rationale: μίτρα는 머리에 두르는 쓰개이지만, 본문 전체가 예식적·왕실적 상징을 띠므로 한국어로는 '관'이 문맥상 가장 자연스럽고 응집력 있습니다. 다만 원어의 머리쓰개 이미지는 본문 밖에서 보존됩니다.
- source_word: τῆς δόξης τοῦ αἰωνίου
  english_pob_choice: of the glory of the Eternal
  chosen_korean: 영원하신 분의 영광
  alternatives_korean:
  - 영원한 분의 영광
  - 영원한 영광
  - 영광의 영원하신 분
  lexicon: LSJ
  rationale: αἰώνιος가 실질적으로 하나님을 가리키는 표현으로 읽히므로, '영원하신 분'으로 옮겨 '영광'의 소유 주체를 분명히 했습니다.
