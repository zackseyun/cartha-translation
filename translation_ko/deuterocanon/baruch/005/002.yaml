base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/005/002.yaml
  text: Put on the robe of the righteousness that comes from God[d][c][b][a], and place on your head the turban of the glory of the Eternal.
  footnotes:
  - marker: a
    text: Or 'cloak' or 'mantle' for the garment term; the Greek word refers to an outer wrap or robe.
    reason: lexical_alternative
  - marker: b
    text: Or 'justice that comes from God' for 'righteousness that comes from God.'
    reason: lexical_alternative
  - marker: c
    text: Or 'headdress' or traditional 'mitre' for 'turban.'
    reason: lexical_alternative
  - marker: d
    text: The phrase may also be understood more loosely as 'the eternal glory,' but the Greek likely points to 'the glory of the Eternal'—that is, God's glory.
    reason: alternative_reading
translation:
  language: ko
  text: 하나님에게서 오는 의의 겉옷을 입고, 영원하신 분의 영광의 관을 네 머리에 씌우십시오.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '외투', '망토'로도 옮길 수 있습니다. 그리스어는 몸을 감싸는 겉옷을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '하나님에게서 오는 정의'로도 이해할 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 '머리쓰개', 전통적으로는 '미트라'로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: d
    text: 또는 더 느슨하게 '영원한 영광'으로도 볼 수 있지만, 그리스어는 아마도 '영원하신 분의 영광'—곧 하나님의 영광—을 가리킵니다.
    reason: alternative_reading
lexical_decisions:
- source_word: περιβαλοῦ τὴν διπλοΐδα
  english_pob_choice: Put on the robe
  chosen_korean: 의의 겉옷을 입고
  alternatives_korean:
