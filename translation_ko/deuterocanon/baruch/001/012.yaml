theological_decisions:
- issue: 강화와 예속이 함께 드러나는 표현의 긴장 유지
  chosen_reading: ‘힘을 주시고 눈을 밝히실 것’과 ‘그늘 아래서 살며 섬길 것’을 함께 살려, 회복과 외적 종속이 동시에 있는 현실을 드러냈습니다.
  alternative_readings:
