translation:
  language: ko
  text: 그들은 예루살렘으로, 곧 살룸의 손자요 힐기야의 아들인 제사장 여호야킴과 제사장들, 그리고 그와 함께 예루살렘에서 발견된 온 백성에게 보냈습니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 ‘그와 함께’라고 단수형으로 말합니다. 이 절에서는 ‘그’가 누구를 가리키는지 분명하지 않습니다.
    reason: alternative_reading
