  source_fidelity: 초안은 청중의 범위를 대체로 반영하지만, 원문의 반복되는 "~의 귀에" 구조를 한 번만 유지했고, 원문에 없는 수동 사건 "전해졌습니다"를 도입했습니다. 또한 "수드 강가에서"가 ‘전해진’ 장소처럼 연결되어 κατοικούντων을 수식하는 원문의 구조를 흐립니다.
  naturalness: ‘왕들의 아들들’은 직역으로 가능하나, ‘귀족들과 왕들의 아들들, 장로들의 귀에’는 병렬 구조가 어색합니다. 반복 구조를 자연스러운 한국어로 정리하고, 앞 절에서 이어지는 낭독 행위를 암시하는 ‘읽었습니다’를 사용하면 독립 절로도 자연스럽습니다.
  terminology: δυνατῶν은 이 문맥에서 ‘귀족들’로 옮길 수 있고, πρεσβυτέρων의 ‘장로들’ 및 ‘왕들의 아들들’도 원문의 관계적 표현을 보존합니다. ‘작은 이부터 큰 이까지’는 연령이나 사회적 위계를 특정하지 않아 원문의 포괄적 대구를 보존합니다. 수드는 불확실한 지명이므로 음역을 유지합니다.
  issues:
