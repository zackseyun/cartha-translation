  chosen_reading: 이 구절은 고위층에서 일반 백성에 이르는 청중 범위를 나열하는 공적 낭독 장면으로 이해하고, 한국어에서도 서술형으로 그 범위를 또렷하게 드러냈습니다.
  alternative_readings:
  - 단순 목록형으로 평면적으로 옮김
  - 더 문어적으로 압축하여 번역함
