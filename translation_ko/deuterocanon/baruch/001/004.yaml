base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/001/004.yaml
  text: and in the hearing of the nobles and the sons of kings[a], and in the hearing of the elders, and in the hearing of all the people, from the least to the greatest[d][c][b], all who were dwelling in Babylon by the river Sud.
  footnotes:
  - marker: a
    text: Greek literally, 'in the ears of,' an idiom meaning 'in the hearing of.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the mighty.' The Greek term can denote powerful or prominent persons; 'nobles' was chosen for the social setting.
    reason: lexical_alternative
  - marker: c
    text: Or 'the princes.' The Greek more literally reads 'the sons of the kings.'
    reason: lexical_alternative
  - marker: d
    text: The river name 'Sud' is transliterated from the Greek; its exact identification is uncertain.
    reason: cultural_note
translation:
  language: ko
  text: 또 귀족들과 왕들의 아들들[a], 장로들의 귀에, 그리고 모든 백성, 곧 가장 작은 자부터 가장 큰 자까지[b][c][d], 바빌론에 있는 사람들 모두에게, 수드 강가에서 전해졌습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 관용적으로 ‘귀에’라고 직역되며, 뜻은 ‘듣는 자리에서’입니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어는 직역하면 ‘가장 작은 자부터 가장 큰 자까지’이며, 사회적 범위를 나타내는 관용구입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘왕들의 아들들’이라는 보다 직역적인 표현도 가능합니다.
    reason: lexical_alternative
  - marker: d
    text: ‘수드’는 그리스어 음역을 따른 지명이며, 정확한 위치는 확실하지 않습니다.
    reason: cultural_note
