base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/001/010.yaml
  text: And they said[a], ‘Behold, we have sent you money; and with the money buy burnt offerings and sin offerings and frankincense, and prepare a grain offering and offer them on the altar of the Lord our God,’
  footnotes:
  - marker: a
    text: Greek μάννα here is understood in its sacrificial sense, that is, a grain offering, not the wilderness food called manna.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그들이 말하였습니다. 「보십시오, 우리가 여러분에게 돈을 보냈으니, 그 돈으로 번제물과 속죄제물과 유향을 사서, 곡식 제물을 마련하여 우리 하나님이신 주님의 제단 위에 바치십시오.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 여기서 μάννα는 광야의 음식 ‘만나’가 아니라 제의적 ‘곡식 제물’을 뜻합니다.
    reason: lexical_alternative
