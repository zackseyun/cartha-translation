  lexicon: LSJ
  rationale: 여기서는 광야의 음식 ‘만나’가 아니라 제의적 곡식 제물을 뜻하므로, 문맥에 맞게 ‘곡식 제물’로 옮기고 ‘마련하다’로 동사를 풀어 제사 준비의 뜻을 살렸습니다.
