  - 올리십시오
  - 제단에 올리십시오
  lexicon: LSJ
  rationale: 제단 위에 제물을 ‘올려 드리다’는 의미가 있으나, 한국어에서는 제의적 행위를 자연스럽게 드러내는 ‘바치십시오’가 문맥상 가장 적절합니다.
theological_decisions:
- issue: Κυρίου θεοῦ ἡμῶν의 처리
  chosen_reading: 우리 하나님 주님
  alternative_readings:
  - 우리 주 하나님
  - 주 우리 하나님
  - 우리 하나님 야훼
  rationale: 그리스어 본문이 Κυρίου를 사용하므로 기본적으로 ‘주님’을 유지하되, יהוה 직접 표지가 아닌 이상 본문 차원에서 ‘야훼’로 단정하지 않았습니다. ‘우리 하나님 주님’은 소유 관계와 호칭을 모두 살리면서도 한국어 어순을 크게 해치지 않습니다.
  doctrine_reference: 'POB guideline: κύριος → 주님; YHWH는 히브리어 직접 표지 또는 LXX 인용-대응 맥락에서만 야훼로 표기'
- issue: 제물 목록의 제의적 등록어 선택
  chosen_reading: 번제물, 속죄제물, 곡식 제물
  alternative_readings:
  - 번제, 속죄제, 소제
  rationale: 전통 교회어 중 ‘소제’는 현대 한국어에서 의미가 불분명할 수 있어, 원문의 제의 범주를 더 투명하게 드러내는 ‘곡식 제물’을 택했습니다.
  doctrine_reference: 'POB terminology policy: source-direct, auditable cultic terminology'
