  text: And you shall say[a], ‘To the Lord our God belongs righteousness, but to us shame of face, as it is this day—to the people of Judah and to the inhabitants of Jerusalem,’
  footnotes:
  - marker: a
    text: 'Or ''justice'': ''To the Lord our God belongs justice.'' The Greek δικαιοσύνη can denote either righteousness or justice; here ''righteousness'' was chosen for the penitential contrast.'
