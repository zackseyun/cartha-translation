translation:
  language: ko
  text: 그리고 여러분은 주 하나님께 이렇게 말씀하십시오[a], 「우리 하나님 야훼께는 의가 있고, 우리에게는 얼굴의 수치가 있습니다. 오늘과 같이 말입니다. 유다 사람들과 예루살렘에 사는 이들에게도 그렇습니다」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '또는 “정의”: “우리 하나님 야훼께는 정의가 있습니다.” Greek δικαιοσύνη는 ‘의’와 ‘정의’ 모두를 뜻할 수 있으며, 여기서는 회개적 대조를 살려 ‘의’를 택했습니다.'
    reason: lexical_alternative
