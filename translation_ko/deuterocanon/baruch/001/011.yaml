base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/001/011.yaml
  text: And pray for the life of Nebuchodonosor king of Babylon[a], and for the life of Baltasar his son[b], so that their days may be like the days of heaven upon the earth.
  footnotes:
  - marker: a
    text: Or, more idiomatically, 'so that their days may be long, like the heavens over the earth.' The Greek preserves a vivid metaphor for enduring life.
    reason: lexical_alternative
  - marker: b
    text: The Greek names are transliterated directly here as 'Nebuchodonosor' and 'Baltasar'; more familiar English forms are 'Nebuchadnezzar' and 'Belshazzar.'
    reason: alternative_reading
translation:
  language: ko
  text: 바빌론 왕 나부코도노소르의 생명을 위하여, 또 그의 아들 발타사르의 생명을 위하여 기도하십시오.[a] 그들의 날들이 땅 위의 하늘의 날들처럼 되도록 기도하십시오.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 나부코도노소르와 발타사르는 각각 그리스어 Ναβουχοδονοσόρ와 Βαλτασάρ를 따른 음역입니다. 더 익숙한 ‘느부갓네살’과 ‘벨사살’은 다른 전통적 표기입니다.
    reason: alternative_reading
  - marker: b
    text: 그리스어의 비유를 살리면 ‘땅 위의 하늘의 날들처럼’입니다. 이는 오래 지속되는 생명을 가리킬 수 있으나, 본문은 그 비유적 표현을 그대로 둡니다.
    reason: lexical_alternative
