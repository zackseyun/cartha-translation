translation:
  language: ko
  text: 그가 주님의 집의 기물들, 곧 성전에서 꺼내 온 것들을 유다 땅으로 돌려보내려고 받은 때는 시완월 10일이었습니다. 그것들은 유다 왕 요시야의 아들 시드기야가 만든 은 기물들이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
