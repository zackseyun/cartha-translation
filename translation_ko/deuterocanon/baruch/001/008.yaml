lexical_decisions:
- source_word: ἐν τῷ λαβεῖν αὐτόν
  english_pob_choice: when he received
  chosen_korean: 그가 … 받았을 때
  alternatives_korean:
  - 그가 … 받을 때
  - 그가 … 받는 중에
  lexicon: BDAG
  rationale: 부정관사적 부정사구의 동시성을 자연스럽게 살려, 행위의 시점을 한국어 과거 회상형으로 분명하게 표현했습니다.
- source_word: τὰ σκεύη οἴκου Κυρίου
  english_pob_choice: the vessels of the house of the Lord
  chosen_korean: 주님의 집에서 … 기물들
  alternatives_korean:
  - 주님의 집의 그릇들
  - 주님의 집의 기구들
  lexicon: BDAG
  rationale: 성전 문맥의 σκεύη는 단순한 식기가 아니라 성전용 기물/기구이므로, 한국어에서는 의미를 넓게 살린 ‘기물들’로 옮겼습니다.
- source_word: τὰ ἐξενεχθέντα ἐκ τοῦ ναοῦ
  english_pob_choice: that had been carried out from the temple
  chosen_korean: 성전에서 꺼내 온
  alternatives_korean:
  - 성전에서 옮겨 나온
  - 성전에서 가져 나온
  lexicon: BDAG
  rationale: 나오스에서의 이전 동작을 드러내면서도, 한국어에서 자연스럽고 물리적 이동의 뉘앙스를 유지하는 표현을 택했습니다.
- source_word: ἀποστρέψαι εἰς γῆν Ἰούδα
  english_pob_choice: to return them to the land of Judah
  chosen_korean: 유다 땅으로 되돌려 보내려고
  alternatives_korean:
  - 유다 땅으로 돌려보내려고
  - 유다 땅으로 반환하려고
  lexicon: BDAG
  rationale: ἀποστρέψαι의 목적 의미를 살려 ‘되돌려 보내다’로 옮겼고, γῆ를 지리적 영역으로 보아 ‘유다 땅’으로 표현했습니다.
- source_word: τῇ δεκάτῃ τοῦ Σειουάν
  english_pob_choice: on the tenth of Sivan
  chosen_korean: 시완월 열흘에
  alternatives_korean:
  - 시완월 10일에
  - 시완월 열째 날에
  lexicon: BDAG
  rationale: 달명은 음역하고 날짜는 고전적 달력 표현에 맞춰 간결하게 처리했습니다.
- source_word: σκεύη ἀργυρᾶ
  english_pob_choice: silver vessels
  chosen_korean: 은 기물들
  alternatives_korean:
  - 은그릇들
  - 은 제기들
  lexicon: BDAG
  rationale: ἀργυρᾶ는 재질을 나타내므로 ‘은’으로 살리고, 성전 맥락의 물건임을 유지하기 위해 ‘기물들’을 사용했습니다.
- source_word: ἐποίησεν
  english_pob_choice: had made
  chosen_korean: 만든
  alternatives_korean:
  - 제작한
  - 만들었던
  lexicon: BDAG
  rationale: 열거 속 삽입적 수식으로서 한국어에서는 간명하게 과거분사형 ‘만든’이 가장 자연스럽습니다.
