  text: 그리고 이것들은 힐기야의 아들 아사디야의 아들 시드기야의 아들 마아세야의 아들 느리야의 아들 바룩이 바빌론에서 쓴 책의 말씀입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어에는 ‘아사디야’로 되어 있습니다. 일부 번역은 셈어식 이름 표기에 따라 ‘하사디야’로 옮깁니다.
    reason: lexical_alternative
