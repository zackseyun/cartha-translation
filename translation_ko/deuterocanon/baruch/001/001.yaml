translation:
  language: ko
  text: 그리고 이것들은 바룩이 바빌론에서 쓴 책의 말씀들입니다. 그는 느리야의 아들, 마아세야의 아들, 시드기야의 아들, 하사디야의 아들, 힐기야의 아들입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 사본들은 여기서 이름을 아사디야로 전하지만, 한국어 본문은 영어 POB와 같이 셈어식 표기인 하사디야를 따랐습니다.
    reason: lexical_alternative
