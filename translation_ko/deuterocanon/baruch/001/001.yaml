  text: And these are the words of the book that Baruch son of Neriah[a], son of Maaseiah, son of Zedekiah, son of Hasadiah, son of Hilkiah, wrote in Babylon,
  footnotes:
  - marker: a
    text: Greek manuscripts here give the name as Asadiah; the English form Hasadiah reflects the standard Semitic-style biblical transliteration of the name.
