translation:
  language: ko
  text: 그리고 우리는 그에게 불순종했고, 우리 하나님이신 주님의 음성을 듣지 않았으며[a], 주님께서 우리 앞에 두신 주님의 명령들[b]을 따라 행하지 않았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘우리 하나님이신 주님의 음성에 순종하지 않았습니다.’ 그리스어는 문자적으로 ‘음성을 듣지 않았다’고 말하지만, 불순종의 뜻을 포함할 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘규례들’ 또는 ‘법도들’로 옮길 수 있습니다. 그리스어 πρόσταγμα은 명령되거나 규정된 것을 가리킵니다.
    reason: lexical_alternative
