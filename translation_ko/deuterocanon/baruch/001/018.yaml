    text: 또는 ‘우리 하나님 주님의 음성에 순종하지 않았습니다.’ 그리스어는 문자적으로 ‘음성을 듣지 않았다’고 말하지만, 불순종의 뜻을 포함할 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘규례들’ 또는 ‘법도들’로 옮길 수 있습니다. 그리스어 πρόσταγμα은 명령되거나 규정된 것을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠπειθήσαμεν
  english_pob_choice: we disobeyed
  chosen_korean: 우리는 불순종했습니다
  alternatives_korean:
  - 우리는 거역했습니다
  - 우리는 순종하지 않았습니다
  lexicon: BDAG
  rationale: ἀπειθέω의 핵심은 권위에 대한 불순종 또는 거부이므로, 합쇼체에서 자연스럽고 직접적인 ‘불순종했습니다’가 가장 잘 맞습니다.
- source_word: ἠκούσαμεν τῆς φωνῆς
  english_pob_choice: did not listen to the voice
  chosen_korean: 음성을 듣지 않았습니다
  alternatives_korean:
  - 말씀을 듣지 않았습니다
  - 음성에 귀 기울이지 않았습니다
  lexicon: BDAG
  rationale: 그리스어는 ‘음성’을 직접 말하므로 이를 보존하되, 성경적 관용구의 불순종 뉘앙스를 살려 ‘듣지 않았습니다’로 옮겼습니다.
- source_word: τοῖς προστάγμασιν
  english_pob_choice: the ordinances
  chosen_korean: 명령들
  alternatives_korean:
  - 규례들
  - 법도들
  - 조례들
  lexicon: LEH
  rationale: πρόσταγμα은 ‘명령된 것, 규정된 것’의 의미가 강해, 한국어에서는 법률적 색채의 ‘명령들’이 가장 직접적입니다.
- source_word: ἔδωκεν κατὰ πρόσωπον ἡμῶν
  english_pob_choice: he set before us
  chosen_korean: 우리 앞에 두신
  alternatives_korean:
  - 우리 앞에 놓으신
  - 우리 앞에 제시하신
  lexicon: LEH
  rationale: κατὰ πρόσωπον ἡμῶν의 관용을 자연스러운 한국어로 살리되, 순종의 대상으로 앞에 제시된 것을 뜻하는 표현을 유지했습니다.
theological_decisions:
- issue: ἠκούσαμεν τῆς φωνῆς의 불순종 함의 표현 여부
  chosen_reading: ‘음성을 듣지 않았습니다’로 직역하면서, 전체 문맥에서 불순종의 의미를 유지했습니다.
  alternative_readings:
  - ‘음성에 순종하지 않았습니다’로 명시화
  - ‘말씀을 듣지 않았습니다’로 의미화
  rationale: 본문은 ‘순종하지 않았다’가 아니라 ‘음성을 듣지 않았다’고 말하므로, 관용적 함의를 보존해 원문의 긴장을 유지했습니다.
