translation:
  language: ko
  text: 그리고 우리는 그에게 불순종했습니다[a], 그리고 우리 하나님 주님의 음성을 듣지 않았습니다. 주님께서 우리 앞에 두신 주님의 명령들을 따라 걷지 않기 위해서였습니다[b].
  philosophy: optimal-equivalence
  footnotes:
