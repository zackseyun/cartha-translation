  lexicon: LEH
  rationale: κατὰ πρόσωπον ἡμῶν의 관용을 자연스러운 한국어로 살리되, 순종의 대상으로 앞에 제시된 것을 뜻하는 표현을 유지했습니다.
theological_decisions:
- issue: ἠκούσαμεν τῆς φωνῆς의 불순종 함의 표현 여부
  chosen_reading: ‘음성을 듣지 않았습니다’로 직역하면서, 전체 문맥에서 불순종의 의미를 유지했습니다.
  alternative_readings:
  - ‘음성에 순종하지 않았습니다’로 명시화
  - ‘말씀을 듣지 않았습니다’로 의미화
  rationale: 본문은 ‘순종하지 않았다’가 아니라 ‘음성을 듣지 않았다’고 말하므로, 관용적 함의를 보존해 원문의 긴장을 유지했습니다.
