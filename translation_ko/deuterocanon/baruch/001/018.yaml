  source_fidelity: 수정이 필요합니다. 초안의 마지막 문장인 ‘...따라 걷지 않기 위해서였습니다’는 πορεύεσθαι를 목적·이유의 ‘~하기 위해서’로 처리하여 원문의 부정과 통사 관계를 바꿉니다. 본문은 주께서 제시하신 명령들을 따라 행하지 않았다는 고백입니다. 또한 각주 a는 ‘음성을 듣지 않았다’에 관한 대안인데 현재 ‘불순종했습니다’에 붙어 있어 앵커가 맞지 않습니다.
  naturalness: ‘우리 하나님 주님의’보다 ‘우리 하나님이신 주님의’가 현대 표준 한국어에서 관계가 더 분명합니다. ‘명령들을 따라 행하지 않았습니다’는 성경적 법·윤리 문맥에서 자연스럽고, 원문의 ‘walk’ 은유를 과도하게 해석하지 않으면서 한국어 문장으로도 매끄럽습니다.
  terminology: κύριος는 ‘주님’, θεὸς ἡμῶν은 ‘우리 하나님이신’으로 유지했습니다. προστάγματα는 ‘명령들’로 옮길 수 있으며, ‘규례들’과 ‘법도들’은 각주에 보존했습니다. ‘음성’을 유지하여 ἀκούειν τῆς φωνῆς의 표현을 보존했습니다.
