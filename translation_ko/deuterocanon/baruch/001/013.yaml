  text: And pray for us to the Lord our God, because we have sinned against the Lord our God, and the anger of the Lord and his wrath has not turned away from us to this day.
translation:
  language: ko
  text: 그리고 우리를 위해 주 우리 하나님께 기도하십시오. 우리는 주 우리 하나님께 죄를 지었기 때문입니다. 주님의 분노와 그 진노는 오늘날까지 우리에게서 돌아서지 않았습니다.
  philosophy: formal
lexical_decisions:
- source_word: προσεύξασθε περὶ ἡμῶν πρὸς Κύριον τὸν θεὸν ἡμῶν
  english_pob_choice: pray for us to the Lord our God
  chosen_korean: 우리를 위해 주 우리 하나님께 기도하십시오
  alternatives_korean:
  - 우리에게 대신 기도하십시오
  - 우리의 일로 주 우리 하나님께 기도하십시오
  lexicon: προσεύχομαι / πρός + dat.
  rationale: προσεύξασθε는 단순한 일반적 요청보다 ‘~을 위해 기도하다’의 청원적 의미가 분명하므로 ‘우리를 위해’로 옮기고, προς를 목적지보다 청원 대상의 방향으로 살려 ‘주 우리 하나님께’로 표현했습니다.
- source_word: ἡμάρτομεν τῷ κυρίῳ θεῷ ἡμῶν
  english_pob_choice: we have sinned against the Lord our God
  chosen_korean: 우리는 주 우리 하나님께 죄를 지었기 때문입니다
  alternatives_korean:
  - 우리는 주 우리 하나님을 거슬러 죄를 지었기 때문입니다
  - 우리는 주 우리 하나님께 범죄했기 때문입니다
  lexicon: ἁμαρτάνω + dative
  rationale: 여기서 여격은 단순 목적격보다 ‘~께 죄를 짓다/범죄하다’의 관계를 드러내므로, 문맥상 자연스럽고 직접적인 ‘죄를 지었습니다’를 택했습니다.
- source_word: ὁ θυμὸς Κυρίου καὶ ἡ ὀργὴ αὐτοῦ
  english_pob_choice: the anger of the Lord and his wrath
  chosen_korean: 주님의 분노와 그 진노
  alternatives_korean:
  - 주님의 노여움과 그 진노
  - 주님의 분노와 그의 격분
  lexicon: θυμός / ὀργή
  rationale: 두 명사는 겹치지만 강도가 다른 감정어이므로 둘을 모두 살려, 첫 항목은 비교적 자연스러운 ‘분노’, 둘째는 더 강한 ‘진노’로 구분했습니다.
- source_word: οὐκ ἀπέστρεψεν ... ἀφʼ ἡμῶν ἕως τῆς ἡμέρας ταύτης
  english_pob_choice: has not turned away from us to this day
  chosen_korean: 오늘날까지 우리에게서 돌아서지 않았습니다
  alternatives_korean:
  - 오늘 이 날까지 우리에게서 떠나지 않았습니다
  - 지금까지 우리에게서 물러나지 않았습니다
  lexicon: ἀποστρέφω
  rationale: PB의 ‘has not turned away’를 따라, 심판/진노가 아직 철회되지 않았다는 상태를 한국어로 자연스럽게 ‘돌아서지 않았다’로 옮겼습니다.
theological_decisions:
- issue: 야훼 신명 재현 여부와 κύριος 번역
  chosen_reading: 본문의 κύριος는 문맥상 야훼를 가리키므로 ‘주’로 유지하되, 인용 관습을 과도하게 확장하지 않고 한국어 본문에서는 ‘주 우리 하나님’으로 처리했습니다.
  alternative_readings:
  - 야훼 우리 하나님
  - 주님 우리 하나님
  rationale: 이 절은 직접적인 LXX 관용구이며, POB의 기본 원칙상 신명 재현은 문맥과 문서화된 인용 관행에 따르지만, 여기서는 본문 자체의 예배적 청원 흐름을 우선해 ‘주’로 남겼습니다.
  doctrine_reference: LXX divine-name citation practice / Baruch petitionary prayer context
