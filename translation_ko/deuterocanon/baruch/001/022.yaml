  - severity: low
    issue: ‘자기의 악한 마음의 생각대로’의 표현
    rationale: 의미는 전달되나 ‘자기’와 ‘각자’의 분배 의미가 겹치고 문장이 다소 무겁습니다. ‘각자 악한 마음의 생각을 따라’가 자연스럽고 원문의 분배적 의미도 유지합니다.
