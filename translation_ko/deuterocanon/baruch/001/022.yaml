  source_fidelity: ‘나아가’는 ᾠχόμεθα(‘떠나가다, 가버리다’)의 이탈·떠남의 뉘앙스를 충분히 나타내지 못합니다. ‘떠나가’로 고치면 원문의 이동 및 이탈 의미를 더 정확히 살립니다. 나머지 핵심 요소, 곧 각자의 악한 내적 생각, 다른 신들을 섬김, 주 우리 하나님의 눈앞에서 행한 악은 잘 보존되어 있습니다.
  naturalness: ‘자기의 악한 마음의 생각대로’는 이해 가능하지만 ‘각자 악한 마음의 생각을 따라’가 반복을 줄이고 현대 표준 한국어로 더 자연스럽습니다. ‘떠나가, 다른 신들을 섬기고 … 하였습니다’는 합쇼체 문체에도 자연스럽습니다.
  terminology: ‘다른 신들을 섬기고’, ‘주 우리 하나님의 눈앞에서’, ‘악한 일을 하였습니다’는 우상숭배 문맥과 κύριος θεὸς ἡμῶν 및 τὰ κακά의 의미를 적절히 반영합니다. ‘주’는 여기서 하나님을 가리키는 κύριος의 통상적 번역으로 유지합니다.
