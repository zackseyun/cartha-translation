translation:
  language: ko
  text: 그리고 우리는 각자 악한 마음의 생각을 따라 떠나가, 다른 신들을 섬기고 주 우리 하나님의 눈앞에서 악한 일을 하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
