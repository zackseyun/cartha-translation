  source_fidelity: 그리스어의 마지막 목적어 αὐτόν은 단수인데, 초안은 ‘데려간’으로 처리하여 그 단수 지시를 본문에서 드러내지 않았습니다. 또한 δυνατούς는 반드시 군사적 ‘용사들’로 한정되지 않으므로 더 넓은 표현이 적절합니다.
