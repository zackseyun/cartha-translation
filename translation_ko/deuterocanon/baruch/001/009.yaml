  terminology: 여고냐와 느부갓네살은 원문 및 한국어 성서 고유명사 관습에 부합합니다. δεσμώτας는 ‘갇힌 이들’, δυνατούς는 ‘유력한 이들’로 옮겨 각각의 넓은 의미를 보존했습니다.
