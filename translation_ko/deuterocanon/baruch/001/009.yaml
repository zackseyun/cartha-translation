  text: 바빌론 왕 느부갓네살이 예루살렘에서 여고냐와 고관들과 죄수들과 용사들과 그 땅의 백성을 포로로 잡아 바빌론으로 데려간 뒤였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
