    text: 그리스어는 단수 ‘그를’로 되어 있어, 엄밀히는 여고냐를 가리키는 듯합니다. 다만 문맥상으로는 포로로 잡혀간 집단 전체를 함께 가리키는 뜻으로 읽는 이들도 있습니다.
    reason: alternative_reading
