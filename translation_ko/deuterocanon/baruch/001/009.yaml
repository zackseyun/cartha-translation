  lexicon: LSJ
  rationale: μετά + 부정과거 부정사 구문은 시간 순서를 나타내므로, 한국어에서는 자연스러운 과거 회상 표현인 ‘~한 뒤였습니다’로 옮겼습니다. ἀποικίζω의 강한 추방·유배 의미는 뒤의 ‘포로로 잡아’로 드러냈습니다.
