translation:
  language: ko
  text: 바빌론 왕 느부갓네살이 예루살렘에서 여고냐와 고관들과 갇힌 이들과 유력한 이들과 그 땅의 백성을 포로로 끌고 가고, 그를 바빌론으로 데려간 뒤였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 단수 ‘그를’로 되어 있어, 가장 자연스럽게는 여고냐를 가리킵니다. 그러나 일부 독자는 문맥상 포로로 끌려간 집단 전체를 가리키는 뜻으로 이해합니다.
    reason: alternative_reading
