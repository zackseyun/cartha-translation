theological_decisions:
- issue: ἔναντι Κυρίου의 의미를 ‘against’가 아니라 ‘before’로 유지할지 여부
  chosen_reading: 하나님을 대적했다기보다 그분 앞에서 죄를 범했다는 책임·현시의 의미로 ‘주 앞에서’라고 옮겼습니다.
  alternative_readings:
  - 주님을 거슬러
  - 주님께 대하여
  rationale: English POB의 확정된 독법 ‘before’를 따르며, 헬라어 ἔναντι의 기본적인 ‘~의 앞에서’라는 관계를 보존합니다.
  doctrine_reference: 회개 고백과 하나님의 임재 앞에서의 책임성
- issue: 고백문의 한국어 문체
  chosen_reading: 공적인 회개 고백에 맞게 완전한 평서형 합쇼체로 옮겼습니다.
  alternative_readings:
  - 우리가 주 앞에서 죄를 지었습니다.
  - 주 앞에서 우리가 죄를 지었습니다.
  rationale: 예언/회개 문맥의 고백을 현대 한국어로 또렷하게 전달하면서도 과장 없이 간결하게 유지합니다.
