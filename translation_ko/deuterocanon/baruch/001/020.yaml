base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/001/020.yaml
  text: And the calamities and the curse that the Lord appointed for Moses his servant clung to us[a], on the day when he brought our fathers out to give us a land flowing with milk and honey[c][b], as it is this day.
  footnotes:
  - marker: a
    text: Or 'the evils'; here the Greek likely refers to disastrous judgments rather than moral evils.
    reason: lexical_alternative
  - marker: b
    text: Or 'ordained,' 'decreed,' or 'prescribed' for 'appointed.'
    reason: lexical_alternative
  - marker: c
    text: '''His servant'' translates Greek ''his païs''; the word can also mean ''child,'' but with Moses here it means servant.'
    reason: lexical_alternative
translation:
  language: ko
  text: 주께서 우리 조상들을 이끌어 내셔서 젖과 꿀이 흐르는 땅을 우리에게 주시려고 하신 날에 자기 종 모세에게 정하여 주신[b] 그 재앙들[a]과 저주가 오늘날까지 우리에게 들러붙어 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘악들’; 여기서는 헬라어가 도덕적 악보다 재앙적 심판을 가리킬 가능성이 큽니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘명하신’, ‘제정하신’, ‘규정하신’.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ κακὰ
  english_pob_choice: the calamities
  chosen_korean: 그 재앙들
  alternatives_korean:
  - 그 악들
  - 그 재난들
  - 그 재해들
  lexicon: BDAG
  rationale: 이 문맥의 κακά는 도덕적 악이 아니라 언약 심판으로 닥친 불행이므로, 한국어로는 재앙들이 가장 자연스럽게 그 뉘앙스를 살립니다.
- source_word: ἡ ἀρὰ
  english_pob_choice: the curse
  chosen_korean: 저주
  alternatives_korean:
  - 그 저주
  - 그 저주의 말
  - 그 언약 저주
  lexicon: BDAG
  rationale: ἀρά는 언약적 저주를 가리키지만, 본문 자체는 기술적 용어보다 일반적 표현을 쓰므로 간결하게 저주로 옮겼습니다.
- source_word: συνέταξεν
  english_pob_choice: appointed
  chosen_korean: 정하신 것
  alternatives_korean:
  - 명령하신 것
  - 제정하신 것
  - 규정하신 것
  lexicon: BDAG
  rationale: 하나님이 모세를 통해 재앙과 저주를 '정해 두신' 뉘앙스를 살리되, 현대 한국어에서 지나치게 법률적이지 않게 표현했습니다.
- source_word: παιδὶ αὐτοῦ
  english_pob_choice: his servant
  chosen_korean: 주의 종
  alternatives_korean:
  - 주의 아들
  - 주의 시종
  - 그의 종
  lexicon: BDAG
  rationale: 모세를 가리키는 παῖς는 여기서 '종'의 의미이므로, POB의 의미를 따라 주의 종으로 옮겨 아동 의미를 배제했습니다.
- source_word: γῆν ῥέουσαν γάλα καὶ μέλι
  english_pob_choice: a land flowing with milk and honey
  chosen_korean: 젖과 꿀이 흐르는 땅
  alternatives_korean:
  - 우유와 꿀이 흐르는 땅
  - 젖과 꿀이 넘치는 땅
  lexicon: BDAG
  rationale: 이 표현은 성경에서 굳어진 관용구이므로, 한국어 성경 전통과 본문의 상징성을 함께 살리는 고정 표현을 유지했습니다.
theological_decisions:
- issue: 모세의 παῖς를 어떻게 읽을 것인가
  chosen_reading: 여기서는 모세를 하나님의 '종'으로 이해해 주의 종으로 번역했습니다.
  alternative_readings:
  - 주의 아들
  - 주의 아이
  rationale: 문맥상 모세는 언약을 매개한 하나님의 종이며, 한국어 독자에게도 그 신학적 관계가 분명히 전달됩니다.
  doctrine_reference: 성경 본문 내 인물 호칭의 문맥적 의미 보존
- issue: 재앙들과 저주의 성격
  chosen_reading: 본문은 도덕적 악의 일반론이 아니라, 불순종에 대한 언약적 심판을 말합니다.
  alternative_readings:
  - 그냥 불행과 저주에 대한 일반 진술
  - 사건적 재난의 서술
  rationale: 출애굽과 가나안 약속, 모세 언급이 함께 나오므로 신명기적 언약 제재의 배경을 드러내되 본문을 과도하게 해설하지 않았습니다.
  doctrine_reference: 언약적 심판과 축복의 구조
