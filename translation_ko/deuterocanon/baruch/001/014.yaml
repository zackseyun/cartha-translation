translation:
  language: ko
  text: 그리고 여러분은 이 책을 읽어야 합니다[a]. 곧 우리가 여러분에게 보낸 이 책을, 주님의 집에서 축제일과 정해진 때의 날들에 선포해야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 자연스럽게는 ‘축제일과 정해진 때에’라고 옮길 수 있습니다. 전승된 그리스어의 ‘정해진 때의 날들’은 다소 어색하므로, 본문은 원문에 가깝게 두되 더 자연스러운 대안도 함께 남깁니다.
    reason: lexical_alternative
