base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/001/003.yaml
  text: And Baruch read the words of this book in the hearing of Jeconiah son of Jehoiakim, king of Judah, and in the hearing of all the people who came to the book,
  footnotes:
  - marker: a
    text: Or possibly, 'who came to the reading' or 'who came to the scroll.' The Greek phrase 'who came to the book' is unusual, so a more interpretive rendering is possible.
    reason: lexical_alternative
  - marker: b
    text: Jeconiah is the Greek-form name; the same king is often identified in English as Jehoiachin.
    reason: alternative_reading
translation:
  language: ko
  text: 바룩은 유다 왕 여호야김의 아들 여고냐[b]와 이 책으로 온 모든 백성[a]이 듣는 앞에서 이 책의 말씀을 읽었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이 책을 읽으러 온’ 또는 ‘이 두루마리를 읽으러 온’으로 옮길 수 있습니다. 그리스어의 ‘책으로 온 사람들’이라는 표현은 다소 이례적이므로, 더 해석적인 번역도 가능합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘여고냐’는 그리스어 본문에 나오는 이름 형태이며, 흔히 ‘여호야긴’으로도 알려져 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνέγνω
  english_pob_choice: read
  chosen_korean: 읽었습니다
  alternatives_korean:
  - 소리 내어 읽었습니다
  - 낭독했습니다
  lexicon: BDAG
  rationale: 공적 낭독 상황이지만, 그리스어 동사 자체는 단순히 ‘읽다’이므로 한국어도 기본 동사 ‘읽었습니다’로 두고 문맥이 소리 내어 읽은 행위임을 자연스럽게 드러냈습니다.
- source_word: ἐν ὠσὶν
  english_pob_choice: in the hearing of
  chosen_korean: 귀에
  alternatives_korean:
  - 듣는 가운데
  - 앞에서
  lexicon: BDAG
  rationale: 직역하면 ‘귀 안에’이지만 관용적으로는 ‘~의 귀에’가 원문 이미지를 가장 직접적으로 보존합니다. 한국어에서는 ‘귀에’로 두고 문장 전체가 낭독의 청각적 장면임을 살렸습니다.
- source_word: Ἰεχονίου
  english_pob_choice: Jeconiah
  chosen_korean: 여고냐
  alternatives_korean:
  - 여고니야
  - 여호야긴
  lexicon: Lexicon not consulted
  rationale: 그리스어형 고유명사를 한국어 음역으로 옮기되, 본문이 제공하는 형태를 우선해 ‘여고냐’로 옮겼습니다. 익숙한 성경식 대응형인 ‘여호야긴’은 조화 번역이므로 여기서는 택하지 않았습니다.
- source_word: τῶν ἐρχομένων πρὸς τὴν βίβλον
  english_pob_choice: who came to the book
  chosen_korean: 이 책으로 나온
  alternatives_korean:
  - 이 책에 온
  - 책을 보러 온
  lexicon: BDAG
  rationale: POB의 영어도 이 구절을 문자적으로 유지합니다. 한국어에서는 ‘책으로 나온’으로 옮겨, 다소 비정상적인 원문 표현을 완화하지 않고 그대로 드러냈습니다.
theological_decisions:
- issue: 이상한 목적어 표현 τὴν βίβλον의 처리
  chosen_reading: ‘이 책으로 나온’처럼 원문의 낯선 표현을 유지했습니다.
  alternative_readings:
  - ‘이 책을 읽으러 온’
  - ‘이 낭독을 들으러 온’
  rationale: 본문은 고의적으로 비정상적인 표현을 남겨 두고 있어, 해석적으로 매끈하게 바꾸면 원문의 긴장이 사라집니다. POB의 audit trail도 ‘book’을 유지하는 쪽을 지지하므로, 한국어에서도 그대로 살렸습니다.
  doctrine_reference: '본문 비평/번역 원칙: source transparency'
- issue: 여고냐의 이름 형태
  chosen_reading: 그리스어형에 가까운 ‘여고냐’를 본문에 넣었습니다.
  alternative_readings:
  - ‘여호야긴’
  rationale: 여기서는 LXX 그리스어 증거를 직접 번역하는 과제이므로, 널리 알려진 히브리어-영어 대응형으로 통일하기보다 source witness의 형태를 드러내는 것이 적절합니다.
  doctrine_reference: source-language primacy
