  source_fidelity: 첫 절의 시간 범위와 지속적 불순종은 충실하게 옮겼습니다. 그러나 πρὸς τὸ μὴ ἀκούειν은 ‘듣지 않으려고’처럼 의도·목적을 나타내는 표현으로 번역하면, 원문의 부주의·소홀함보다 고의적 거부의 뜻이 강해집니다. 이를 ‘음성을 듣는 일을 소홀히 하다’로 옮겨 태만의 실제 대상과 의미를 자연스럽게 드러내는 것이 안전합니다.
  naturalness: ‘우리 하나님 주님께’는 현대 표준 한국어 성경 문체에서 호칭어가 중복되어 다소 부자연스럽습니다. ‘주 우리 하나님께’가 자연스럽고 원문의 Κύριον θεὸν ἡμῶν도 충실히 반영합니다. 또한 ‘듣지 않으려고 태만했습니다’는 결합이 어색하므로 수정이 필요합니다.
