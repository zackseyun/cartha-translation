  rationale: 이 절은 그리스어 본문에 Κύριος가 나오며, 본문 차원에서는 주석 없이 ‘주님’이 가장 자연스럽고, 두 번 반복되는 호칭의 경건한 호소도 살립니다.
  doctrine_reference: 'DOCTRINE.md: κύριος → Lord/주님; deuterocanonical Greek context'
- issue: ἐσχεδιάζομεν의 성격
  chosen_reading: 태만했습니다
  alternative_readings:
  - 반항했습니다
