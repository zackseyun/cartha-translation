base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/001/019.yaml
  text: From the day when the Lord brought our fathers out from the land of Egypt until this day[a], we have been disobedient to the Lord our God, and we have been negligent in not listening to his voice.
  footnotes:
  - marker: a
    text: Or, 'we acted carelessly in not listening to his voice.' The Greek verb ἐσχεδιάζομεν is uncommon and may suggest heedlessness or negligence rather than a more specific form of rebellion.
    reason: lexical_alternative
translation:
  language: ko
  text: 주께서 우리 조상들을 이집트 땅에서 끌어내신 날부터 오늘까지 우리는 우리 하나님 주님께 불순종해 왔고, 그분의 음성을 듣지 않으려고 태만했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그분의 음성을 듣는 데 소홀했습니다.” ἐσχεδιάζομεν은 드문 동사로, 더 구체적인 반역보다 경솔함이나 태만을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ τῆς ἡμέρας ἧς
  english_pob_choice: From the day when
  chosen_korean: …하신 날부터
