  rationale: 출애굽의 울림을 살리면서도 현대 한국어에서 자연스럽게 읽히는 동사로 옮겼습니다.
- source_word: τοὺς πατέρας ἡμῶν
  english_pob_choice: our fathers
  chosen_korean: 우리 조상들을
  alternatives_korean:
