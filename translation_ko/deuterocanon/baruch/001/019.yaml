  - 소홀히 했습니다
  lexicon: LSJ
  rationale: 이 드문 동사는 단순한 반역보다 말씀을 듣지 않는 데 대한 경솔함·소홀함을 가리키므로, ‘태만했습니다’가 그 뉘앙스를 가장 압축적으로 전합니다.
- source_word: πρὸς τὸ μὴ ἀκούειν τῆς φωνῆς αὐτοῦ
  english_pob_choice: in not listening to his voice
  chosen_korean: 그분의 음성을 듣지 않으려고
  alternatives_korean:
  - 그분의 음성을 듣지 않는 데서
  - 그분의 음성에 귀 기울이지 않으면서
  lexicon: LSJ
  rationale: ‘φωνή’를 ‘말씀’으로 풀지 않고 ‘음성’으로 유지해, 하나님의 직접적 발화를 듣지 않은 책임을 드러냈습니다.
theological_decisions:
- issue: Κύριος의 번역과 야훼 표기 여부
  chosen_reading: 주님
  alternative_readings:
  - 야훼
  - 주
  rationale: 이 절은 그리스어 본문에 Κύριος가 나오며, 본문 차원에서는 주석 없이 ‘주님’이 가장 자연스럽고, 두 번 반복되는 호칭의 경건한 호소도 살립니다.
  doctrine_reference: 'DOCTRINE.md: κύριος → Lord/주님; deuterocanonical Greek context'
- issue: ἐσχεδιάζομεν의 성격
  chosen_reading: 태만했습니다
  alternative_readings:
  - 반항했습니다
  - 고의로 거역했습니다
  rationale: 본문과 영어 POB의 재조정 내역은 이 동사를 노골적 반역보다 ‘부주의/소홀’의 범주로 읽도록 안내하므로, 고의적 반항으로 강화하지 않았습니다.
  doctrine_reference: 'DOCTRINE.md: source-sense preservation; avoid overtranslation'
