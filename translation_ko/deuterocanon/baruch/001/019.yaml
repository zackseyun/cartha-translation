  lexicon: LSJ
  rationale: 직역의 남성 복수 의미는 유지되지만, 한국어 성경 문맥에서는 ‘조상들’이 혈통적 선조를 가장 자연스럽게 드러냅니다.
- source_word: ἐσχεδιάζομεν
  english_pob_choice: we have been negligent
  chosen_korean: 태만했습니다
