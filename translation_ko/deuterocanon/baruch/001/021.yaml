translation:
  language: ko
  text: 우리는 야훼 우리 하나님[a]의 음성을 듣지 않았고, 그분이 우리에게 보내신 예언자들의 모든 말을 따르지 않았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야훼 우리 하나님께 순종하지 않았습니다.’ 이 동사는 단순히 듣지 않았다는 뜻을 넘어, 귀 기울여 따르지 않았다는 의미를 지닐 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠκούσαμεν
  english_pob_choice: did not listen
  chosen_korean: 듣지 않았고
  alternatives_korean:
  - 듣지 않았습니다
  - 귀를 기울이지 않았고
  - 순종하지 않았고
  lexicon: BDAG
  rationale: ἀκούω는 여기서 단순 청각보다 ‘귀를 기울여 따름’의 의미가 강하므로, 한국어에서도 ‘듣지 않았고’로 옮겨 원문의 경고성을 살렸습니다.
- source_word: τῆς φωνῆς
  english_pob_choice: the voice
  chosen_korean: 음성
  alternatives_korean:
  - 목소리
  - 소리
  - 말씀
  lexicon: LSJ
  rationale: ‘voice’의 기본 의미를 살리면서도 한국어에서 하나님에게 자연스러운 표현인 ‘음성’을 택해, 뒤의 ‘예언자들의 모든 말’과 구분을 유지했습니다.
- source_word: Κυρίου τοῦ θεοῦ ἡμῶν
  english_pob_choice: the Lord our God
  chosen_korean: 야훼 우리 하나님
  alternatives_korean:
  - 주 우리 하나님
  - 주님 우리 하나님
  - 여호와 우리 하나님
  lexicon: 프로젝트 기본 용례
  rationale: 그리스어 κύριος라도 구약적 인용/호칭 맥락에서 야훼를 가리키는 신명 사용으로 읽히므로, 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
- source_word: κατὰ πάντας τοὺς λόγους τῶν προφητῶν
  english_pob_choice: according to all the words of the prophets
  chosen_korean: 예언자들의 모든 말을
  alternatives_korean:
  - 예언자들의 모든 말씀을 따라
  - 예언자들의 모든 말에 따라
  - 예언자들의 모든 말을 따라서
  lexicon: BDAG
  rationale: κατά + 대격은 여기서 기준/부합의 뜻이므로 ‘따르지 않았습니다’로 자연스럽게 옮겨, 예언자들의 말 전체에 대한 불순종을 드러냈습니다.
- source_word: προφητῶν
  english_pob_choice: the prophets
  chosen_korean: 예언자들
  alternatives_korean:
  - 선지자들
  - 예언자들
  lexicon: 표준 한국어 성경 용례
  rationale: 현대 표준어와 프로젝트 기본 스타일에 맞추어 ‘예언자들’을 택해, 전통적 교회어인 ‘선지자들’보다 직접적인 의미를 살렸습니다.
theological_decisions:
- issue: ‘듣다’와 ‘순종하다’ 사이의 신학적 긴장
  chosen_reading: 본문은 ‘듣지 않았다’로 옮기되, 그 불순종의 책임은 문맥이 드러내도록 두었습니다.
  alternative_readings:
  - 순종하지 않았습니다
  - 귀를 기울이지 않았습니다
  rationale: 영어 POB도 ‘did not listen’을 유지하며 ‘obey’는 각주로만 열어 두므로, 한국어 본문에서도 청각적-언약적 불복종의 긴장을 한 단계 해석하지 않고 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: 문맥이 허용하는 긴장은 본문에서 보존하고, 과도한 해석은 각주나 해설로 둡니다.'
