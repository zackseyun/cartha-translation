  lexicon: BDAG
  rationale: 완료형의 현재적 울림은 한국어에서 자연스럽게 과거 완료적 뉘앙스를 지닌 서술로 담기 어려워, 기도 언어에 맞는 '부르짖었습니다'로 옮겼습니다.
