  rationale: φρόνησις는 단순 지적 이해보다 실제적 판단 능력을 가리키므로, 본문의 권면 맥락에서 가장 넓게 통하는 ‘지혜’를 선택했습니다.
theological_decisions:
- issue: ἐντολὰς ζωῆς의 의미 보존
