  alternative_readings:
  - ‘생명을 주는 계명들’
  - ‘삶을 위한 계명들’
  rationale: 그리스어는 생명의 근원, 결과, 성격을 단정하지 않고 간결하게 말하므로, 본문이 허용하는 신학적 긴장을 보존하는 쪽이 더 충실합니다.
