lexical_decisions:
- source_word: οὗτος ὁ θεὸς ἡμῶν
  english_pob_choice: This is our God
  chosen_korean: 이분이 바로 우리의 하나님이십니다
  alternatives_korean:
  - 이분이 우리의 하나님이십니다
  - 이분이 바로 우리 하나님이십니다
  lexicon: LSJ
  rationale: 지시대명사 οὗτος는 문맥상 단순 지시가 아니라 선언문을 이루므로, 한국어에서는 ‘이분이 바로’로 자연스럽게 옮겨 선언성을 살렸습니다.
- source_word: οὐ λογισθήσεται
  english_pob_choice: will be reckoned
  chosen_korean: reckoned 되지 않을 것입니다
  alternatives_korean:
  - 헤아려지지 않을 것입니다
  - 간주되지 않을 것입니다
  - 여겨지지 않을 것입니다
  lexicon: LSJ
  rationale: λογίζομαι의 수동 미래는 ‘계산/판정하여 셈하다’의 의미를 유지하는 것이 중요하므로, ‘reckoned’의 의미를 살린 표현으로 옮겼습니다.
- source_word: ἕτερος πρὸς αὐτόν
  english_pob_choice: no other will be reckoned beside him
  chosen_korean: 그분 곁에 다른 이는 하나도
  alternatives_korean:
  - 그분과 견줄 다른 이는 하나도
  - 그분 곁에 또 다른 이는 하나도
  lexicon: LSJ
  rationale: ἕτερος는 단순히 ‘또 하나’가 아니라 그분과 구별되는 ‘다른 존재’를 뜻하므로 ‘다른 이는 하나도’로 exclusivity를 살렸고, πρὸς αὐτόν의 비교·동반 관계는 ‘곁에’로 간결하게 처리했습니다.
theological_decisions:
- issue: 하나님의 유일성을 평행 비교문으로 보존할지 여부
  chosen_reading: 직역적 비교 구조를 유지해 ‘다른 이는 하나도’라고 했습니다.
  alternative_readings:
  - ‘그분과 견줄 이가 아무도 없습니다’로 풀어쓰기
  - ‘다른 신은 없습니다’로 신학적으로 명시하기
  rationale: 헬라어는 직접적인 신명 선언보다 비교·판정 구조를 사용하므로, 본문이 가진 형식을 보존해 유일신 신앙을 암시가 아닌 문장 구조로 드러냈습니다.
  doctrine_reference: 원문 형식 보존; 문맥의 단정적 유일신 진술을 과도하게 확대하지 않음
