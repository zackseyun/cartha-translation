  text: The younger men saw the light and lived on the earth[b][a], but they did not know the way of knowledge.
  footnotes:
  - marker: a
    text: Or 'the young' or 'younger ones.' The Greek is masculine plural.
    reason: lexical_alternative
  - marker: b
    text: Literally 'saw light.' This may idiomatically imply being alive or enjoying life.
    reason: lexical_alternative
translation:
  language: ko
  text: 젊은이들은 빛을 보았고 땅에서 살았지만, 지식의 길은 알지 못했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘젊은 사람들’, ‘젊은 자들’로 옮길 수 있습니다. 그리스어는 남성 복수형입니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘빛을 보았다’입니다. 이는 관용적으로 살아 있음을 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: νεώτεροι
  english_pob_choice: the younger men
  chosen_korean: 젊은이들
  alternatives_korean:
  - 젊은 남자들
  - 젊은 사람들
  - 젊은 세대
  lexicon: LSJ
  rationale: 그리스어 남성 복수의 인칭적 용법을 살리되, 한국어에서는 자연스러운 합쇼체 문맥을 위해 성별을 과도하게 드러내지 않는 ‘젊은이들’로 옮겼습니다.
- source_word: εἶδον φῶς
  english_pob_choice: saw the light
  chosen_korean: 빛을 보았고
  alternatives_korean:
  - 빛을 보았으며
  - 빛을 보았고 살아 있었습니다
  - 생명의 빛을 보았고
  lexicon: LSJ
  rationale: 직역 이미지인 ‘빛을 보았다’를 유지해 원문의 시적 표현을 살렸고, 영어 POB가 보존한 관용적 여지도 한국어 본문에서 해석으로 고정하지 않았습니다.
- source_word: κατῴκησαν ἐπὶ τῆς γῆς
  english_pob_choice: lived on the earth
  chosen_korean: 땅에서 살았지만
  alternatives_korean:
  - 땅에 거주했지만
  - 땅에 살았지만
  - 이 땅에서 살았지만
  lexicon: LSJ
  rationale: κατοικέω의 ‘거주하다/살다’ 의미를 따라 ‘살다’로 옮기고, γῆ는 문맥상 넓은 ‘땅’으로 처리해 자연스러운 한국어를 택했습니다.
- source_word: ὁδὸν δὲ ἐπιστήμης
  english_pob_choice: the way of knowledge
  chosen_korean: 지식의 길
  alternatives_korean:
  - 지식의 길을
  - 앎의 길
  - 지혜의 길
  lexicon: LSJ
  rationale: ‘ὁδός’를 ‘길’로, ‘ἐπιστήμη’를 가장 직접적인 ‘지식’으로 옮겨 원문의 지혜 문맥을 유지했습니다. ‘지혜’는 의미를 좁혀 바꾸므로 피했습니다.
theological_decisions:
- issue: ‘빛을 보았다’의 관용적 함의
  chosen_reading: 원문의 구체적 이미지를 살려 ‘빛을 보았다’로 두고, 이를 생명의 시작이나 삶의 향유로 풀어쓰지 않았습니다.
  alternative_readings:
  - 살아 있었습니다
  - 삶을 누렸습니다
  rationale: 그리스어는 문자 그대로 ‘빛을 보았다’고 말하며, POB도 해석을 과잉하지 않고 이미지를 보존합니다. 시적 표현을 유지하는 것이 본문의 힘을 더 정확히 드러냅니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
- issue: νεώτεροι의 성별 표지
  chosen_reading: 남성 복수의 형식은 인칭적 표지를 반영하되, 한국어에서는 ‘젊은이들’로 자연스럽게 옮겼습니다.
  alternative_readings:
  - 젊은 남자들
  - 젊은 사람들
  rationale: 한국어에서 이 구절은 특정 남성 집단보다 ‘젊은 사람들’을 가리키는 일반적 표현으로 읽히며, 본문 의미를 해치지 않는 범위에서 자연성을 우선했습니다.
  doctrine_reference: Translation philosophy §4
