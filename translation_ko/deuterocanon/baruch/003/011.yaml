lexical_decisions:
- source_word: προσελογίσθης
  english_pob_choice: you were counted
  chosen_korean: (수동) ‘계수되어/간주되어’의 뜻을 살려 “...로 شمار되었습니다”
  alternatives_korean:
  - '...로 간주되었습니다'
  - '...로 셈해졌습니다'
  - '...와 함께 شمار되었습니다'
  lexicon: BDAG
  rationale: 부정확한 일반화보다, ‘계수하다/간주하다’의 수동 의미를 살려 공동체적 분류에 들어감을 드러내야 합니다. 다만 현대 한국어에서는 자연스러운 문장성을 위해 합쇼체로 정리했습니다.
- source_word: μετὰ τῶν
  english_pob_choice: among those
  chosen_korean: “...자들 가운데로”
  alternatives_korean:
  - '...자들과 함께'
  - '...자들 중에'
  - '...자들 가운데'
  lexicon: BDAG
  rationale: μετά + 속격은 단순 동반보다 포함·동류의 뉘앙스가 강하므로, ‘함께’보다 ‘가운데로/중에’가 POB의 ‘counted among’을 더 잘 반영합니다.
- source_word: τῶν εἰς ᾅδου
  english_pob_choice: those in Hades
  chosen_korean: “하데스에 있는 자들”
  alternatives_korean:
  - 죽은 자들
  - 음부에 있는 자들
  - 스올에 있는 자들
  lexicon: BDAG
  rationale: 그리스어 본문이 명시적으로 ᾅδης를 쓰므로, 전통적 교회어인 ‘음부’로 완화하지 않고 고유명 ‘하데스’를 보존했습니다. 이는 영어 POB의 lexical note와도 일치합니다.
theological_decisions:
- issue: ᾅδης의 종말론적 범주
  chosen_reading: ‘하데스’로 유지해 최종 심판의 ‘지옥’과 구별했습니다.
  alternative_readings:
