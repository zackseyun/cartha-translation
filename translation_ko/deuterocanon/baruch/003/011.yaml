  - 죽은 자들의 세계
  rationale: 본문은 최종 형벌의 장소가 아니라 죽은 자들의 영역을 가리키는 그리스어 용어를 사용합니다. 따라서 의미를 평탄화하지 않고 원어의 구분을 살리는 것이 적절합니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
