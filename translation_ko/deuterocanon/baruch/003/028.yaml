lexical_decisions:
- source_word: ἀπώλοντο
  english_pob_choice: they perished
  chosen_korean: 망하였고 / 망하였습니다
  alternatives_korean:
  - 멸망하였고
  - 죽었습니다
  - 파멸하였습니다
  lexicon: BDAG
  rationale: ἀπόλλυμι의 결과 상태를 한국어에서 가장 자연스럽게 살리면서도, 단순한 육체적 죽음보다 더 넓은 파멸·상실의 의미를 보존하기 위해 ‘망하다’를 택했습니다.
- source_word: παρὰ τὸ μὴ ἔχειν φρόνησιν
  english_pob_choice: for lack of understanding
  chosen_korean: 이해가 없어서
  alternatives_korean:
  - 분별이 없어서
  - 지혜가 없어서
  - 신중함이 없어서
  lexicon: BDAG
  rationale: φρόνησις를 단순 지식이 아니라 상황을 분별하는 이해로 받아, 가장 무난하면서도 본문 흐름에 맞는 ‘이해’로 옮겼습니다.
- source_word: διὰ τὴν ἀβουλίαν αὐτῶν
  english_pob_choice: because of their own lack of counsel
  chosen_korean: 스스로의 무모한 결정 없음 때문에
  alternatives_korean:
  - 그들의 판단 부족 때문에
  - 그들의 무분별함 때문에
  - 그들의 자문 없음 때문에
  lexicon: LSJ
  rationale: ἀβουλία는 문자적으로 ‘숙고/의논의 결여’이므로, 단순한 ‘어리석음’보다 결정과 판단의 부재를 드러내는 표현으로 옮겼습니다. 한국어에서는 어색한 직역을 피하면서도 책임 귀속을 분명히 하기 위해 ‘스스로의’로 αὐτῶν의 강조를 반영했습니다.
theological_decisions:
