  rationale: 원문은 같은 동사를 반복하여 원인과 결과를 강하게 각인합니다. 이를 다르게 풀면 수사적 압박이 약해지므로 반복을 보존했습니다.
  doctrine_reference: Translation philosophy §§1, 3
