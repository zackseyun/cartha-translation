translation:
  language: ko
  text: 하나님께서는 이들을[a] 선택하지 않으셨고, 지식의 길[b]도 그들에게 주지 않으셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '그들을'. 그리스어는 지시대명사를 사용하여 앞문맥의 특정 집단을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '지식으로 가는 길' 혹은 '이해의 길'. 그리스어는 더 문자적으로는 '지식의 길'이라고 읽힙니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ τούτους
  english_pob_choice: did not choose these
  chosen_korean: 이들을 선택하지 않으셨고
  alternatives_korean:
  - 그들을 선택하지 않으셨고
  - 이 사람들을 선택하지 않으셨고
  lexicon: BDAG
  rationale: τούτους의 지시적 뉘앙스를 살려 '이들'로 옮겼습니다. 앞문맥에서 언급된 특정 집단을 가리키는 느낌을 유지하면서도 한국어 문장으로 자연스럽습니다.
- source_word: ἐξελέξατο
  english_pob_choice: did not choose
  chosen_korean: 선택하지 않으셨고
  alternatives_korean:
  - 뽑지 않으셨고
  - 고르지 않으셨고
  lexicon: BDAG
  rationale: ἐκλέγομαι는 여기서 '선택하다'가 가장 직접적입니다. 신학적 색채를 과도하게 덧붙이지 않으면서도 본문 의미를 분명히 드러냅니다.
- source_word: ὁδὸν ἐπιστήμης
  english_pob_choice: the way of knowledge
  chosen_korean: 지식의 길
  alternatives_korean:
  - 지식으로 가는 길
  - 지혜의 길
  lexicon: BDAG
  rationale: 그리스어의 직설적인 소유/특성 구조를 살려 '지식의 길'로 옮겼습니다. '지혜의 길'은 바룩 3장의 문맥상 그럴듯하지만, 여기서는 ἐπιστήμης의 직접 의미를 보존하는 쪽이 더 정확합니다.
- source_word: ἔδωκεν αὐτοῖς
  english_pob_choice: did he give them
  chosen_korean: 그들에게 주지 않으셨습니다
  alternatives_korean:
  - 그들에게 주시지 않으셨습니다
  - 그들에게 허락하지 않으셨습니다
  lexicon: BDAG
  rationale: ἔδωκεν은 가장 기본적으로 '주다'이므로 '주지 않으셨습니다'가 적절합니다. '허락하다'는 원문에 없는 완화된 의미를 더합니다.
theological_decisions:
- issue: 지시대명사 τούτους를 '그들'로 완화할지, '이들'로 유지할지
  chosen_reading: 이들
  alternative_readings:
  - 그들
  - 그 사람들
  rationale: 본문은 앞뒤 문맥에서 특정 대상을 가리키는 수사적 대비를 만들므로, 지시성을 살린 '이들'이 원문의 긴장을 더 잘 보존합니다.
  doctrine_reference: original-language primacy over domestication
