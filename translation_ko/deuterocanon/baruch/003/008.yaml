  text: 보십시오[a], 오늘 우리가 있는 것은 우리 포로됨 가운데입니다. 주께서 우리를 그곳에 흩으신 것은 수치와 저주와 청구됨을 위한 것이며, 우리 조상들의 모든 불의에 따른 것입니다. 그들은 우리 하나님 여호와에게서 돌아섰습니다.
