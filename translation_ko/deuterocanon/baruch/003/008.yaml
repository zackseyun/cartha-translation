revisions:
- from: 보십시오[a], 오늘 우리가 있는 것은 우리 포로됨 가운데입니다. 주께서 우리를 그곳에 흩으신 것은 수치와 저주와 청구됨을 위한 것이며, 우리 조상들의 모든 불의에 따른 것입니다. 그들은 우리 하나님 여호와에게서 돌아섰습니다.
  to: 보십시오, 오늘 우리는 유배 생활을 하고 있습니다. 주께서 우리를 그곳에 흩으시어, 우리 조상들의 모든 불의에 따라 우리가 수치와 저주와 배상의 책임[a]을 지게 하셨습니다. 그들은 우리 하나님이신 주님에게서 돌아섰습니다.
  rationale: The revision supplies idiomatic Korean syntax, preserves the source’s causal and judicial sequence, corrects the divine title to reflect κύριος θεὸς ἡμῶν, and anchors a footnote at the genuinely ambiguous term ὄφλησιν. ‘배상의 책임’ retains the liability/obligation dimension without reducing it simply to punishment.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T19:26:46Z'
