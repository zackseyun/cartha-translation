translation:
  language: ko
  text: 보십시오, 오늘 우리는 유배 생활을 하고 있습니다. 주께서 우리를 그곳에 흩으시어, 우리 조상들의 모든 불의에 따라 우리가 수치와 저주와 배상의 책임[a]을 지게 하셨습니다. 그들은 우리 하나님이신 주님에게서 돌아섰습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘형벌’ 또는 ‘채무’. 그리스어는 여기서 심판 아래 incurred된 책임이나 의무의 뜻을 지닙니다.
    reason: lexical_alternative
