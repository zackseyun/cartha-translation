base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/003/032.yaml
  text: But he who knows all things knows her[a]; he found her out by his understanding. He who prepared the earth for everlasting time filled it with four-footed animals[c][b];
  footnotes:
  - marker: a
    text: Or 'he discovered her' for 'he found her out.'
    reason: lexical_alternative
  - marker: b
    text: The Greek refers to wisdom with feminine pronouns ('her'), preserving the passage's personification of wisdom.
    reason: cultural_note
  - marker: c
    text: Or 'for all time' or 'forever' for 'for everlasting time.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 모든 것을 아시는 분은 그녀를 아십니다[a]. 그는 자신의 깨달음으로 그녀를 찾아내셨습니다. 땅을 영원한 때를 위해 마련하신 분은 그 땅을 네발짐승들로 가득 채우셨습니다[c][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그녀를 발견하셨습니다’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어는 지혜를 여성 대명사로 가리켜, 이 구절의 인격화를 보존합니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘영원히’나 ‘모든 시대를 위해’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ εἰδὼς τὰ πάντα / γινώσκει αὐτήν
  english_pob_choice: he who knows all things knows her
  chosen_korean: 모든 것을 아시는 분은 그녀를 아십니다
  alternatives_korean:
  - 모든 것을 아는 분은 그녀를 압니다
  - 만물을 아시는 분은 그녀를 아십니다
  lexicon: BDAG
  rationale: 완전한 지식을 나타내는 분사구를 자연스러운 존칭 표현으로 살리되, 지혜를 가리키는 여성 대명사 ‘그녀’를 유지해 인격화된 지시를 보존했습니다.
- source_word: ἐξεῦρεν αὐτὴν
  english_pob_choice: he found her out
  chosen_korean: 그녀를 찾아내셨습니다
  alternatives_korean:
  - 그녀를 발견하셨습니다
  - 그녀를 알아내셨습니다
  lexicon: BDAG
  rationale: ἐξευρίσκω의 ‘찾아내다/발견해 내다’는 뜻을 반영해, 단순한 ‘발견’보다 능동적 탐색의 뉘앙스를 살렸습니다.
- source_word: τῇ συνέσει αὐτοῦ
  english_pob_choice: by his understanding
  chosen_korean: 자신의 깨달음으로
  alternatives_korean:
  - 자신의 이해로
  - 자신의 통찰로
  lexicon: BDAG
  rationale: σύνεσις를 단순 지성보다 사물의 뜻을 꿰뚫는 이해로 보아 ‘깨달음’으로 옮기면 문맥상 지혜 탐지의 뉘앙스가 잘 살아납니다.
- source_word: ὁ κατασκευάσας τὴν γῆν εἰς τὸν αἰῶνα χρόνον
  english_pob_choice: He who prepared the earth for everlasting time
  chosen_korean: 땅을 영원한 때를 위해 마련하신 분
  alternatives_korean:
  - 땅을 영원한 시간 동안 준비하신 분
  - 땅을 영원한 때에 맞추어 세우신 분
  lexicon: LSJ
  rationale: κατασκευάζω의 ‘마련하다/준비하다’라는 기본 뜻을 살려, 이어지는 ‘가득 채우셨습니다’와의 연결을 자연스럽게 했습니다. εἰς τὸν αἰῶνα χρόνον은 ‘영원한 때’로 옮겨 반복적·중첩적 지속성을 보존했습니다.
- source_word: κτηνῶν τετραπόδων
  english_pob_choice: with four-footed animals
  chosen_korean: 네발짐승들로 가득 채우셨습니다
  alternatives_korean:
  - 네발짐승들로 채우셨습니다
  - 사족짐승들로 가득 채우셨습니다
  lexicon: LSJ
  rationale: τετράποδα의 직역 성격을 살리면서도 현대 한국어에서 이해되는 ‘네발짐승들’로 옮겨 의미를 선명하게 했습니다. ‘가득 채우다’는 ἐνέπλησεν의 충만한 채움을 반영합니다.
theological_decisions:
- issue: 지혜의 여성 인칭 유지
  chosen_reading: 지혜를 가리키는 여성 대명사를 ‘그녀’로 유지했습니다.
  alternative_readings:
  - 무성적 ‘그것’으로 처리
  - 명시하지 않고 반복을 약화
  rationale: 본문은 지혜를 여성형 대명사로 가리키므로, 이를 평탄화하지 않고 인격화된 표현을 보존하는 것이 문학적·신학적 긴장을 가장 잘 드러냅니다.
  doctrine_reference: Translation philosophy §3, §6
- issue: κατασκευάσας의 동사 강도
  chosen_reading: ‘창조하신’보다 ‘마련하신’으로 옮겼습니다.
  alternative_readings:
  - 창조하신
  - 세우신
  rationale: 이 동사는 직접적인 창조 동사라기보다 준비·구비의 의미가 있어, 문장 자체가 말하는 바를 넘어서는 신학적 확대를 피했습니다.
  doctrine_reference: Translation philosophy §1
