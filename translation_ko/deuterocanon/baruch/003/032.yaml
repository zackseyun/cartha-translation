    text: 그리스어는 지혜를 여성 대명사로 가리켜, 이 구절의 인격화를 보존합니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘영원히’나 ‘모든 시대에 걸쳐’로도 옮길 수 있습니다.
    reason: lexical_alternative
