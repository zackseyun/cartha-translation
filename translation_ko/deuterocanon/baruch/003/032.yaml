translation:
  language: ko
  text: 그러나 모든 것을 아시는 분은 그녀를 아십니다[a]. 그분은 자신의 통찰로 그녀를 찾아내셨습니다. 땅을 영원토록 마련하신 분은 그 땅을 네발짐승들로 가득 채우셨습니다[c][b].
  philosophy: optimal-equivalence
  footnotes:
