lexical_decisions:
- source_word: τίς
  english_pob_choice: Who
  chosen_korean: 누가
  alternatives_korean:
  - 누구가
  - 어느 사람이
  lexicon: LSJ
  rationale: 수사적 질문의 주어로 가장 자연스럽고 간결한 표준어 표현입니다.
- source_word: διέβη πέραν τῆς θαλάσσης
  english_pob_choice: has crossed beyond the sea
  chosen_korean: 바다를 건너 저편까지 가서
  alternatives_korean:
