- source_word: εὗρεν αὐτήν
  english_pob_choice: found her
  chosen_korean: 그것을 찾아내고
  alternatives_korean:
  - 그녀를 찾아내고
  - 그것을 찾고
  lexicon: LSJ
  rationale: 지혜의 여성형 인칭을 한국어에서 그대로 ‘그녀’로 두면 어색하므로, 한국어 문맥에서는 지시대명사 ‘그것’을 쓰되 personification은 앞뒤 맥락으로 유지했습니다.
- source_word: χρυσίου ἐκλεκτοῦ
  english_pob_choice: for choice gold
  chosen_korean: 좋은 금과 바꾸어
  alternatives_korean:
  - 선별한 금으로
  - 최상품의 금으로
  - 좋은 금을 주고
  lexicon: LSJ
  rationale: 목적/대가의 뜻을 자연스럽게 드러내기 위해 ‘~과 바꾸어’로 옮겼고, ἐκλεκτοῦ는 ‘좋은’으로 과도한 해석 없이 가치를 표현했습니다.
theological_decisions:
- issue: 지혜의 인칭 여성형을 한국어에서 어떻게 처리할지
  chosen_reading: 본문의 personification은 유지하되, 한국어 본문에서는 자연성을 위해 지시대명사 ‘그것’을 사용했습니다.
  alternative_readings:
  - ‘그녀’를 일관되게 사용
  - 비인칭 ‘그것’으로만 처리
  rationale: 그리스어는 문법적 여성형을 사용하지만, 한국어에서 ‘그녀’를 지혜에 적용하면 독자가 문자적 인물로 오해할 수 있습니다. 수사적·문학적 인격화는 문맥 전체가 유지합니다.
  doctrine_reference: Baruch 3의 지혜 인격화; 번역 철학 §1, §3
