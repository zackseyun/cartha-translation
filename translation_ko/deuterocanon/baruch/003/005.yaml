    text: 또는 ‘우리 조상들의 불의’.
    reason: lexical_alternative
  - marker: b
    text: ‘주님의 손’은 성서에서 주님의 능력이나 강한 행위를 가리킬 수 있는 관용구입니다.
    reason: cultural_note
lexical_decisions:
- source_word: μὴ μνησθῇς
  english_pob_choice: Do not remember
  chosen_korean: 기억하지 마시고
  alternatives_korean:
  - 기억하지 마십시오
  - 마음에 두지 마시고
  lexicon: BDAG
  rationale: 하나님께 드리는 간청으로서 금지형을 공손한 청원체로 옮기되, 뒤의 μνήσθητι와 대비되는 ‘기억하다’의 반복을 살렸습니다.
- source_word: ἀδικιῶν
  english_pob_choice: the unrighteous acts
  chosen_korean: 불의
  alternatives_korean:
  - 불의한 행위
  - 잘못
  - 죄악
  lexicon: BDAG
  rationale: ἀδικία의 도덕적·언약적 어감을 살리면서도, 한국어에서 자연스럽고 포괄적인 표현으로 ‘불의’를 택했습니다.
- source_word: πατέρων ἡμῶν
  english_pob_choice: of our fathers
  chosen_korean: 우리 조상들의
  alternatives_korean:
  - 우리 아버지들의
  - 우리 선조들의
  lexicon: BDAG
  rationale: 헬라어는 문자적으로 ‘우리의 아버지들’이지만, 문맥상 이전 세대 전체를 가리키므로 한국어에서 오해를 줄이는 범위 안에서 ‘조상들’로 옮겼습니다.
- source_word: χειρός σου
  english_pob_choice: your hand
  chosen_korean: 주의 손
  alternatives_korean:
  - 주의 능력
  - 주의 권능
  - 주의 손길
  lexicon: LSJ
  rationale: 직역을 유지해 성서적 비유를 보존했습니다. 여기서 ‘손’은 본문처럼 능력과 행위를 암시할 수 있으므로 풀이어로 바꾸지 않았습니다.
theological_decisions:
- issue: 하나님의 손과 이름을 어떻게 옮길지
  chosen_reading: ‘주의 손’과 ‘주의 이름’을 그대로 유지해, 하나님의 능력과 언약적 명예를 본문이 암시하는 방식으로 남겼습니다.
  alternative_readings:
  - ‘주의 능력’과 ‘주의 이름’
  - ‘주의 역사’와 ‘주의 이름’
  rationale: 본문은 손과 이름을 병렬로 두어 기도자가 하나님의 알려진 행위와 존재를 근거로 간구하게 합니다. 해석을 본문 안에서 과도하게 풀기보다, 비유를 유지하는 편이 원문의 긴장을 더 잘 보존합니다.
  doctrine_reference: 성서적 비유와 기도문체의 긴장 보존
