translation:
  language: ko
  text: 우리 조상들이 저지른 불의한 행위들[a]은 기억하지 마시고, 이때에 주님의 손[b]과 주님의 이름을 기억해 주십시오.
  philosophy: optimal-equivalence
  footnotes:
