base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/003/007.yaml
  text: For because of this you have put your fear in our hearts[a], that we may call on your name; and we will praise you in our exile[d][c][b], because we have turned away from our hearts every unrighteousness of our fathers who sinned before you.
  footnotes:
  - marker: a
    text: Or 'fear of you.' The Greek literally reads 'your fear,' a biblical expression for the fear directed toward God.
    reason: lexical_alternative
  - marker: b
    text: Or 'in our captivity.' The Greek term can denote the state of deportation or exile.
    reason: lexical_alternative
  - marker: c
    text: Or 'every wrongdoing' or 'all injustice.'
    reason: lexical_alternative
  - marker: d
    text: Or 'who sinned against you.' The Greek more literally says 'who sinned before you.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이런 까닭에 주님께서 우리의 마음에 주님의 두려움을 두셔서, 우리가 주님의 이름을 부르게 하셨습니다. 또 우리가 포로생활 가운데서 주님을 찬양할 것입니다[a][b][c], 이는 우리가 우리 조상들의 온갖 불의를, 주님 앞에서 죄를 지은 그 조상들의 불의를 우리 마음에서 돌이켰기 때문입니다[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주님에 대한 두려움’입니다. 헬라어는 문자적으로 ‘주님의 두려움’이라고 읽으며, 하나님께 향한 두려움의 성경적 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘포로생활’입니다. 헬라어는 유배나 추방 상태를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘모든 불의’ 혹은 ‘모든 부정의’입니다.
    reason: lexical_alternative
  - marker: d
    text: 또는 ‘주님께 죄를 지은’입니다. 헬라어는 더 문자적으로 ‘주님 앞에서 죄를 지은’이라고 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸν φόβον σου
  english_pob_choice: your fear
  chosen_korean: 주님의 두려움
  alternatives_korean:
  - 주님의 경외
  - 주님에 대한 두려움
  lexicon: BDAG
  rationale: 본문의 소유격 표현을 지나치게 풀지 않고, 하나님께서 주시는 경외와 두려움의 긴장을 함께 살리기 위해 ‘주님의 두려움’으로 옮겼습니다.
- source_word: ἐπὶ καρδίαν ἡμῶν
  english_pob_choice: upon our hearts
  chosen_korean: 우리의 마음에
  alternatives_korean:
  - 우리 마음 위에
  - 우리 마음에
  lexicon: BDAG
  rationale: 한국어에서는 ‘마음에 두다’가 가장 자연스럽게 ‘두셨다’와 결합하여, 원문의 위치 이미지를 무리 없이 전달합니다.
- source_word: ἐπικαλεῖσθαι τὸ ὄνομά σου
  english_pob_choice: we may call on your name
  chosen_korean: 주님의 이름을 부르게 하셨습니다
  alternatives_korean:
  - 주님의 이름을 부르게 하셨습니다
  - 주님의 이름을 부르도록 하셨습니다
  lexicon: BDAG
  rationale: 호소와 예배를 함께 담는 성경적 관용구를 살려 ‘이름을 부르다’로 옮겼고, 목적/결과의 의미는 ‘부르게 하셨습니다’로 표현했습니다.
- source_word: ἐν τῇ ἀποικίᾳ ἡμῶν
  english_pob_choice: in our exile
  chosen_korean: 포로생활 가운데서
  alternatives_korean:
  - 우리의 포로됨 가운데서
  - 우리의 유배 가운데서
  - 우리의 포로생활 속에서
  lexicon: LSJ
  rationale: 문맥상 단순한 지리적 유배가 아니라 포로로 끌려간 상태를 가리키므로, 현대 한국어에서 자연스럽고 의미를 분명히 드러내는 ‘포로생활’로 옮겼습니다.
- source_word: πᾶσαν ἀδικίαν
  english_pob_choice: every unrighteousness
  chosen_korean: 온갖 불의
  alternatives_korean:
  - 모든 불의
  - 모든 불법
  - 모든 부정의
  lexicon: BDAG
  rationale: 윤리적·종교적 비난의 뉘앙스를 살리되 한국어에서 무겁고 분명하게 들리는 ‘불의’를 사용했고, ‘온갖’으로 총괄성을 표현했습니다.
- source_word: πατέρων ἡμῶν
  english_pob_choice: of our fathers
  chosen_korean: 우리 조상들의
  alternatives_korean:
  - 우리 아버지들의
  - 우리 선조들의
  lexicon: BDAG
  rationale: 원문은 문자적으로 ‘아버지들’이지만, 한국어에서는 혈통적·언약적 선대 전체를 가리키는 ‘조상들’이 가장 자연스럽게 기능합니다.
theological_decisions:
- issue: ‘fear of God’의 의미를 경외로 완화할지 여부
  chosen_reading: ‘주님의 두려움’으로 유지하여 경외와 두려움의 긴장을 남겼습니다.
  alternative_readings:
  - 주님의 경외
  - 주님에 대한 두려움
  rationale: 회개 기도 문맥에서 하나님이 주시는 두려움은 단순한 존경심보다 강합니다. 원문의 신학적 긴장을 약화시키지 않기 위해 직접적인 표현을 택했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 3
- issue: ‘before you’의 책임성 표지
  chosen_reading: ‘주님 앞에서 죄를 지은’으로 옮겼습니다.
  alternative_readings:
  - 주님 앞에서
  - 주님 앞에서 범죄한
  rationale: ἐναντίον σου의 공간적·관계적 의미를 한국어에서 가장 자연스럽게 살리면서, 하나님 앞에서의 책임과 심판 가능성을 분명히 드러냅니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 3
