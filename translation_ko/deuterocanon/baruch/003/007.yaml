base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/003/007.yaml
  text: For because of this you have put your fear in our hearts[a], that we may call on your name; and we will praise you in our exile[d][c][b], because we have turned away from our hearts every unrighteousness of our fathers who sinned before you.
  footnotes:
  - marker: a
    text: Or 'fear of you.' The Greek literally reads 'your fear,' a biblical expression for the fear directed toward God.
    reason: lexical_alternative
  - marker: b
    text: Or 'in our captivity.' The Greek term can denote the state of deportation or exile.
    reason: lexical_alternative
  - marker: c
    text: Or 'every wrongdoing' or 'all injustice.'
    reason: lexical_alternative
  - marker: d
    text: Or 'who sinned against you.' The Greek more literally says 'who sinned before you.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이런 까닭에 주님께서 우리의 마음에 주님의 두려움[a]을 두셔서, 우리가 주님의 이름을 부르도록 하셨습니다. 또 우리는 우리의 유배 생활[b] 가운데서 주님을 찬양할 것입니다. 이는 우리가 주님 앞에서 죄를 지은[d] 우리 조상들의 모든 불의[c]를 우리 마음에서 버렸기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주님에 대한 두려움’입니다. 헬라어는 문자적으로 ‘주님의 두려움’이라고 읽으며, 하나님께 향한 두려움의 성경적 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘포로생활’입니다. 헬라어는 유배나 추방의 상태를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘온갖 불의’ 혹은 ‘모든 부정의’입니다.
    reason: lexical_alternative
  - marker: d
    text: 또는 ‘주님께 죄를 지은’입니다. 헬라어는 더 문자적으로 ‘주님 앞에서 죄를 지은’이라고 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸν φόβον σου
  english_pob_choice: your fear
  chosen_korean: 주님의 두려움
  alternatives_korean:
