translation:
  language: ko
  text: 이는 은을 세공하고 염려하는 이들이 한 일을 찾아낼 수 없기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘은을 세공하고 근심하는 이들이 한 일은 밝혀낼 수 없기 때문이다.’ 그리스어는 매우 간결하고 구문이 다소 어렵습니다. ‘그들이 한 일’은 그들의 작품, 행위, 또는 업적을 가리킬 수 있습니다.
    reason: lexical_alternative
