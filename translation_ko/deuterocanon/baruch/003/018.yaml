  text: because those who work in silver and are concerned[a], and there is no finding out their works.
  footnotes:
  - marker: a
    text: Or 'for those who fashion silver and are full of care, and there is no discovering their works.' The Greek is terse and somewhat difficult; the line may describe skilled artisans whose achievements cannot finally uncover wisdom.
