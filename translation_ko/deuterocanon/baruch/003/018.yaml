  naturalness: 현 번역의 ‘그것은 … 이들이며 … 자들이지만’은 지시 대상과 문장 구조가 부자연스럽고, ‘하지만’이 원문에 없는 대조를 만듭니다. 개정문은 한국어 합쇼체 문장으로 자연스럽게 읽히면서도 원문의 다소 압축적이고 난해한 진술을 유지합니다.
