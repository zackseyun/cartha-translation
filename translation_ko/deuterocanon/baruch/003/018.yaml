  rationale: 여기서는 수공예적 문맥이 강하므로 일반적인 ‘행위’보다 산출물을 가리키는 ‘작품’이 더 적절합니다.
theological_decisions:
- issue: 이 구절의 어조가 지닌 평가적 뉘앙스
  chosen_reading: 기술과 염려가 있어도 그 결과를 끝내 헤아릴 수 없다는 진술로 옮겼습니다.
  alternative_readings:
  - 인간의 기술을 비판하는 말로 더 강하게 옮길 수 있음
  - 지혜의 한계를 강조하는 문맥으로 완곡하게 옮길 수 있음
  rationale: 본문은 단순한 기술 묘사 이상으로, 인간의 공예적 성취가 궁극적 통찰에 이르지 못함을 암시하므로 그 긴장을 과도하게 약화하지 않도록 했습니다.
  doctrine_reference: 인간의 지혜와 기술의 한계에 대한 성경적 주제
