base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/003/021.yaml
  text: Nor did they understand its paths[a], nor did they take hold of it; their sons became far from their way,
  footnotes:
  - marker: a
    text: Or, more idiomatically, 'their sons went far from the way.' The Greek wording in the final clause is somewhat awkward, so this draft stays close to the attested text while preserving the smoother sense here.
