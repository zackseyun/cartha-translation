translation:
  language: ko
  text: 그들은 그 길들을 이해하지 못했고, 그것을 붙잡지도 못했습니다. 그들의 아들들은 자기들의 길에서 멀어졌습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 자연스럽게는 ‘그들의 아들들이 그 길에서 멀어졌습니다.’ 그리스어의 마지막 절은 다소 어색하므로, 본문은 원문에 가깝게 두었습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: οὐδὲ συνῆκαν τρίβους αὐτῆς
  english_pob_choice: Nor did they understand its paths
  chosen_korean: 그들은 그 길들을 이해하지 못했고
  alternatives_korean:
  - 그 길들을 깨닫지 못했고
  - 그 길들을 알지 못했고
  lexicon: BDAG; LSJ
  rationale: συνίημι는 단순한 지식보다 ‘이해하다/깨닫다’의 뜻을 가지므로, 문맥상 지혜의 길을 ‘이해하지 못했다’로 옮기는 것이 자연스럽습니다. τρίβους는 구체적 ‘자취’보다 비유적 ‘길들’이 적절합니다.
- source_word: οὐδὲ ἀντελάβοντο αὐτῆς
  english_pob_choice: nor did they take hold of it
  chosen_korean: 그것을 붙잡지도 못했습니다
  alternatives_korean:
  - 그것을 취하지도 못했습니다
  - 그것을 붙들지도 못했습니다
  lexicon: BDAG
  rationale: ἀντιλαμβάνομαι의 여기서의 의미는 비유적으로 ‘붙잡다, 손에 넣다’에 가깝기 때문에, ‘붙잡다’가 원문의 동작상을 잘 드러냅니다. ‘못했습니다’는 앞절과 맞춰 부정의 평서형을 유지합니다.
- source_word: οἱ υἱοὶ αὐτῶν
  english_pob_choice: their sons
  chosen_korean: 그들의 아들들
  alternatives_korean:
  - 그들의 자녀들
  lexicon: BDAG
  rationale: 원문은 분명히 남성 복수인 υἱοί를 사용하므로, 성중립화하지 않고 ‘아들들’로 옮깁니다.
- source_word: ἀπὸ τῆς ὁδοῦ αὐτῶν πόρρω ἐγενήθησαν
  english_pob_choice: became far from their way
  chosen_korean: 자기들의 길에서 멀어졌습니다
  alternatives_korean:
  - 자기들의 길로부터 멀어졌습니다
  - 그들의 길에서 멀리 떨어졌습니다
  lexicon: LSJ; BDAG
  rationale: ἀπὸ τῆς ὁδοῦ αὐτῶν πόρρω ἐγενήθησαν는 직역하면 ‘자기들의 길에서 멀어졌다’이므로, 한국어에서는 어색한 소유구문보다 ‘자기들의 길에서’가 더 자연스럽고 원문의 거리감 이미지를 보존합니다.
theological_decisions:
- issue: 마지막 절의 어색한 그리스어 구문을 한국어에서 어떻게 처리할지
  chosen_reading: ‘자기들의 길에서 멀어졌습니다’로 옮기되, 원문의 거리감과 이탈 이미지를 그대로 살렸습니다.
  alternative_readings:
  - ‘자기들의 길로부터 멀어졌습니다’
  - ‘그 길에서 멀리 떨어졌습니다’
  rationale: 이 절은 어순과 소유 표현이 다소 거칠지만, 본문을 매끈한 재구성으로 바꾸기보다 수용된 형태를 따라 의미를 보존하는 것이 더 중요합니다. 따라서 해석을 과도하게 보태지 않고 이탈의 이미지만 유지했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 3
