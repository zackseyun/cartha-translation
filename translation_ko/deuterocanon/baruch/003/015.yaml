base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/003/015.yaml
  text: Who found her place[a], and who entered into her treasuries?
  footnotes:
  - marker: a
    text: Or 'her treasures.' The Greek term can mean either the treasures themselves or the treasury/storehouse containing them; 'treasuries' is chosen because the verb says one 'entered into' them.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 누가 그분의 자리를 찾아냈으며, 그 누가 그분의 곳간들 안으로 들어갔습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 보물들’. 그리스어 용어는 보물 자체를 뜻할 수도 있고, 그것을 담는 곳간/창고를 뜻할 수도 있습니다. ‘곳간들’은 ‘안으로 들어갔다’는 동사와 더 잘 맞기 때문에 택했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τίς
  english_pob_choice: Who
  chosen_korean: 그 누가
  alternatives_korean:
  - 누가
  - 누구입니까
  lexicon: LSJ
  rationale: 수사적 질문의 어조를 살리면서도 문장 서두를 자연스럽고 격조 있게 만들기 위해 ‘그 누가’를 택했습니다.
- source_word: τὸν τόπον
