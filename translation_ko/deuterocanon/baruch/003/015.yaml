  rationale: 지혜를 의인화한 문맥에서 ‘place’를 직역한 ‘장소’보다, 찾을 수 있는 위치를 가리키는 ‘자리’가 더 자연스럽고 원문의 비유를 해치지 않습니다.
- source_word: αὐτῆς
  english_pob_choice: her
  chosen_korean: 그분의
  alternatives_korean:
  - 그녀의
  - 그것의
  lexicon: LSJ
  rationale: 그리스어의 여성형 대명사가 지혜의 의인화를 드러내므로, 한국어에서도 비인격적 ‘그것’이 아니라 인격적 지시를 살렸습니다.
- source_word: τοὺς θησαυρούς
  english_pob_choice: treasuries
  chosen_korean: 곳간들
  alternatives_korean:
  - 보물들
  - 보물 창고들
  - 창고들
  lexicon: LSJ
  rationale: ‘들어갔다’와 결합하는 점을 반영하여 추상적 ‘보물’보다 저장 공간의 뜻을 살린 ‘곳간들’을 택했습니다. 복수형도 유지했습니다.
theological_decisions:
- issue: 지혜의 의인화 보존
  chosen_reading: 여성형 인칭을 유지하지 않고도, 문맥상 지혜를 인격적으로 가리키는 표현인 ‘그분의’로 번역했습니다.
  alternative_readings:
  - 중성적으로 ‘그것의’로 번역
  - 명시적으로 ‘그녀의’로 번역
  rationale: 본문은 지혜를 여성형으로 의인화하지만, 한국어에서는 ‘그녀’가 다소 부자연스러울 수 있어 인격적 지시를 유지하면서도 문체를 매끄럽게 했습니다. 원문의 신학적 의인화는 여전히 보존됩니다.
  doctrine_reference: 번역 철학 §1, §3, §5
