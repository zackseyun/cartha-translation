translation:
  language: ko
  text: 누가 그녀의 자리를 찾아냈으며, 누가 그녀의 보물 창고들에 들어갔습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그녀의 보물들’. 그리스어 θησαυροί는 보물 자체를 뜻할 수도 있고 그것을 보관하는 창고를 뜻할 수도 있습니다. 여기서는 ‘들어갔다’는 표현에 맞추어 ‘보물 창고들’로 옮겼습니다.
    reason: lexical_alternative
