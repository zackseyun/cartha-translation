translation:
  language: ko
  text: 이스라엘아, 하나님의 집이 얼마나 크며 하나님의 소유지가 얼마나 광대한지! [a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하나님의 창조 세계’로도 옮길 수 있습니다. 그리스어 κτῆσις는 소유물이나 재산을 뜻할 수 있으며, 문맥에 따라 창조 또는 획득한 것을 뜻할 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὦ Ἰσραήλ
  english_pob_choice: O Israel
  chosen_korean: 이스라엘아
  alternatives_korean:
  - 오 이스라엘이여
  - 이스라엘
  lexicon: LSJ
  rationale: Ὦ는 직접 부르는 감탄형 호격이므로 한국어 호격 조사로 살려, 예언적 탄식과 찬탄의 뉘앙스를 유지했습니다.
- source_word: ὁ οἶκος τοῦ θεοῦ
  english_pob_choice: the house of God
  chosen_korean: 하나님의 집
  alternatives_korean:
  - 하나님의 집안
  - 하나님의 성전
  lexicon: LSJ
  rationale: οἶκος는 여기서 하나님의 거처/영역을 가리키는 직설적 표현이므로, 본문의 공간적 이미지를 보존하는 '하나님의 집'으로 옮겼습니다.
- source_word: ἐπιμήκης
  english_pob_choice: vast
  chosen_korean: 얼마나 넓은지
  alternatives_korean:
  - 얼마나 긴지
  - 얼마나 광대한지
  - 얼마나 드넓은지
  lexicon: LSJ
  rationale: 직역하면 '긴'이지만 한국어에서는 공간의 광대함을 말할 때 '넓다'가 더 자연스러워, 원문의 길이/확장 이미지를 현대적 문맥으로 살렸습니다.
- source_word: τῆς κτήσεως αὐτοῦ
  english_pob_choice: of his possession
  chosen_korean: 그의 소유의 자리
  alternatives_korean:
  - 그의 소유
  - 그의 창조의 자리
  - 그가 차지한 자리
  lexicon: LSJ
  rationale: κτῆσις는 '소유/획득한 것'과 경우에 따라 '창조'도 가능하므로, 본문 문맥의 공간성에 맞춰 '소유의 자리'로 옮기되 대안 의미는 각주로 남겼습니다.
theological_decisions:
- issue: κτήσεως의 의미 범위
  chosen_reading: 본문에는 '소유'를 택하고, '창조' 가능성은 각주로 보존했습니다.
  alternative_readings:
  - 창조
  - 획득한 것
  rationale: 바룩 3:24의 문맥은 하나님의 집과 자리의 크기를 강조하므로, 공간·영역의 의미를 살리는 '소유'가 가장 직접적입니다. 동시에 κτῆσις의 어휘적 긴장을 지우지 않도록 대안 번역을 각주에 남겼습니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
