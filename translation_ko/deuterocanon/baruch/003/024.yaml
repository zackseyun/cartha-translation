translation:
  language: ko
  text: 이스라엘아, 하나님의 집이 얼마나 크며 그의 소유의 자리가 얼마나 넓은지![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '그의 창조의 자리'로도 옮길 수 있습니다. 그리스어 κτῆσις는 소유물/재산을 뜻할 수 있으며, 문맥에 따라 창조나 획득한 것이라는 뜻도 가능합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὦ Ἰσραήλ
  english_pob_choice: O Israel
  chosen_korean: 이스라엘아
  alternatives_korean:
  - 오 이스라엘이여
