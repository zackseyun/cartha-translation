translation:
  language: ko
  text: 이스라엘이여, 어찌하여 당신이 원수들의 땅에 있습니까? 당신은 이방 땅에서 늙어 버렸고, 죽은 자들과 함께 더러워졌습니다.[a][b]
  philosophy: formal
  footnotes:
  - marker: a
    text: ‘이스라엘이여, 어찌하여’는 원문의 첫 번째 탄식형 질문을 호격으로 옮긴 것입니다.
    reason: korean_style_note
  - marker: b
    text: ‘죽은 자들과 함께 더러워졌습니다’는 의례적 부정의 뉘앙스를 살린 번역입니다.
    reason: theological_note
lexical_decisions:
- source_word: τί ἐστιν Ἰσραήλ;
  english_pob_choice: What is Israel?
  chosen_korean: 이스라엘이여
  alternatives_korean:
  - 이스라엘은 무엇입니까?
  - 이스라엘이여, 무슨 일이 있습니까?
  lexicon: 이스라엘
  rationale: 이 문맥은 정의 질문보다 탄식의 직접 호소에 가깝기 때문에, 한국어에서는 대상 호격을 살려 탄식의 정조를 보존했습니다.
- source_word: ἐν γῇ τῶν ἐχθρῶν
  english_pob_choice: in the land of the enemies
  chosen_korean: 원수들의 땅
  alternatives_korean:
  - 적들의 땅
  - 원수의 땅
  lexicon: 땅, 원수
  rationale: 복수 소유격을 반영해 ‘원수들’로 옮기고, 탄식조에 맞게 간결하게 표현했습니다.
- source_word: ἐπαλαιώθης
  english_pob_choice: you have grown old
  chosen_korean: 늙어 버렸고
  alternatives_korean:
  - 늙었습니다
  - 노쇠하였고
  lexicon: 늙다
  rationale: 문맥상 단순한 연령 정보가 아니라 쇠잔과 소진의 느낌이 있어 ‘늙어 버렸고’로 처리했습니다.
- source_word: συνεμιάνθης τοῖς νεκροῖς
  english_pob_choice: you were defiled with the dead
  chosen_korean: 죽은 자들과 함께 더러워졌습니다
  alternatives_korean:
  - 죽은 자들과 함께 부정하게 되었습니다
  - 시체들과 섞여 더러워졌습니다
  lexicon: 더럽히다, 죽은 자
  rationale: τοῖς νεκροῖς의 대상성을 살리면서도, 의식적 부정의 강한 함의를 한국어 ‘더러워지다’로 전달했습니다.
theological_decisions:
- issue: 탄식문과 수사 의문문의 보존
  chosen_reading: 본문의 연속된 질문을 설명문으로 풀지 않고 탄식하는 호소로 보존했습니다.
  alternative_readings:
  - 이스라엘의 처지를 해설하는 진술문으로 완화
  - 정서적 요소를 줄인 직설 번역
  rationale: 히브리/헬라 탄식 전통의 수사 질문은 단순 정보 요청이 아니라 상태의 비참함을 드러내므로, 그 기능을 유지했습니다.
  doctrine_reference: 예언서적 탄식과 언약 위기 진술
- issue: 죽은 자와의 접촉으로 인한 부정성
  chosen_reading: ‘죽은 자들과 함께 더러워졌습니다’로 의식적 부정의 뉘앙스를 유지했습니다.
  alternative_readings:
  - ‘죽은 자들로 인해 부정해졌습니다’
  - ‘시체와 접촉하여 부정하게 되었습니다’
  rationale: 원문의 μι-오염 어근과 전치사구의 결합이 단순 오염이 아니라 의례적 부정을 암시하므로, 그 긴장을 약화시키지 않았습니다.
  doctrine_reference: 정결/부정 개념
