translation:
  language: ko
  text: 그런데 별들은 정해진 자리에서 빛나고 기뻐하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 자리에서’, ‘그들의 궤도에서’, 또는 ‘그들이 맡은 보초 자리에서’로 옮길 수 있습니다. 그리스어 φυλακαί는 문자적으로 ‘파수’ 또는 ‘보초 자리’를 뜻하며, 이 시적 문맥에서는 별들에게 정해진 자리나 때를 가리킵니다.
    reason: lexical_alternative
