  language: ko
  text: 그런데 별들은 제자리에서 빛나며 기뻐하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 자리에서’, ‘그들의 궤도에서’, ‘그들의 직무에서’로도 옮길 수 있습니다. 그리스어 φυλακαί는 문자적으로 ‘경계’ 또는 ‘보초’이지만, 이 시적 문맥에서는 별들의 정해진 자리나 때를 가리킵니다.
    reason: lexical_alternative
