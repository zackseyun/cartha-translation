  lexicon: BDAG
  rationale: 단순 보관보다 축적의 의미가 살아 있으면서도 현대 한국어에서 자연스러운 표현으로 옮겼습니다.
- source_word: ᾧ ἐπεποίθεισαν ἄνθρωποι
  english_pob_choice: in which men have trusted
  chosen_korean: 그 은과 금은 사람들이 신뢰하였지만
  alternatives_korean:
