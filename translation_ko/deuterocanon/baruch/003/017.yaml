  lexicon: BDAG
  rationale: 대명사 관계를 분명히 하여, 은과 금 자체를 신뢰의 대상로 보는 원문 의미를 드러냈습니다. ‘신뢰하다’는 ἐπεποίθεισαν의 지속된 의탁을 잘 반영합니다.
- source_word: κτήσεως
  english_pob_choice: possessions
  chosen_korean: 소유
  alternatives_korean:
  - 재산
  - 재물
  - 소유물
  lexicon: LSJ
  rationale: 문맥상 축적된 재산·소유 전체를 포괄해야 하므로, 간결하고 넓은 의미의 ‘소유’로 옮겼습니다.
theological_decisions:
- issue: ἄνθρωποι의 성중립화 여부
  chosen_reading: ‘사람들’로 옮겨 대표적 인간 일반을 살리되, 성별을 불필요하게 한정하지 않았습니다.
  alternative_readings:
  - 남자들
  - 인간들
  rationale: 여기서 ἄνθρωποι는 대표적 인간 일반을 가리키므로, 한국어에서는 자연스러운 일반어 ‘사람들’을 택해 성별 표지를 과도하게 부각하지 않았습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
- issue: ἐμπαίζοντες의 의미 범위
  chosen_reading: 놀이·유희적 활동의 뉘앙스를 살려 ‘어울려 노는’으로 처리했습니다.
  alternative_readings:
  - 조롱하는
  - 희롱하는
  rationale: 문맥은 새들을 향한 말의 조롱이 아니라 활동적 유희를 가리킬 수 있으므로, POB의 ‘make sport with’ 취지를 따라 의미 범위를 보존했습니다.
  doctrine_reference: POB lexical note on ἐμπαίζω
