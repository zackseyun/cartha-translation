  lexicon: LSJ
  rationale: 직역에 가깝게 유지하되, 현대 한국어에서 자연스러운 ‘하늘의 새들’로 옮겨 LXX적 표현감을 살렸습니다.
- source_word: θησαυρίζοντες
  english_pob_choice: store up
  chosen_korean: 쌓아 두는
  alternatives_korean:
