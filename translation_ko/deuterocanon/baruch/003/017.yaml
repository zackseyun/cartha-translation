  source_fidelity: 초안의 ‘그 은과 금은 사람들이 신뢰하였지만’은 그리스어 관계절(ᾧ ἐπεποίθεισαν ἄνθρωποι)을 독립절과 역접으로 바꾸어 버립니다. 원문에는 ‘하지만’에 해당하는 역접이 없으며, 신뢰의 대상은 앞의 축적된 은과 금과 연결되어야 합니다. 개정문은 이를 관계 관형절로 복원하고, 소유의 주체도 자연스럽게 밝혔습니다. ‘하늘의 새들과 어울려 노는’은 ἐμπαίζοντες의 유희·희롱 범위를 비교적 넓게 보존합니다.
  naturalness: 개정문은 병렬 분사구와 마지막 서술을 한국어에서 자연스럽게 연결합니다. ‘그 은과 금은 사람들이 신뢰하였지만’의 비문에 가까운 주제 전환과 부당한 역접을 제거했습니다. 각주 표지도 의미 선택이 걸린 ‘어울려 노는’ 바로 뒤에 배치했습니다.
  terminology: ‘하늘의 새들’, ‘은과 금’, ‘쌓아 두는’, ‘소유’는 적절합니다. ἄνθρωποι는 문맥상 인간 일반이므로 ‘사람들’이 자연스럽습니다. ‘의지하던’은 ἐπεποίθεισαν의 신뢰·의탁 의미를 ‘신뢰하다’보다 문맥상 더 잘 드러내며, 은과 금을 집합적으로 받는 한국어 표현입니다.
