base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/003/023.yaml
  text: And the sons of Hagar also[a], who seek understanding on the earth—the merchants of Merran and Teman, and the myth-makers and seekers of understanding—did not know the way of wisdom[b], nor did they remember her paths.
  footnotes:
  - marker: a
    text: Greek reads 'Merran,' an unusual place name in this witness; some traditions identify or normalize it differently. The translation preserves the extant Greek form rather than silently emending it.
    reason: textual_variant
  - marker: b
    text: Or 'myth-makers' for 'storytellers'; the Greek refers to people occupied with tales or myths.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 하갈의 아들들도—땅에서 이해를 구하는 자들, 메란과 테만의 상인들, 신화를 지어내는 자들과 이해를 구하는 자들—지혜의 길을 알지 못했고, 그녀의 길들을 기억하지도 못했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 본문은 ‘메란’(Μερρὰν)이라고 읽습니다. 이 전승에서는 드문 지명형이며, 일부 전통은 이를 다르게 식별하거나 정규화합니다. 번역은 현존하는 그리스어 형태를 그대로 보존합니다.
    reason: textual_variant
  - marker: b
    text: ‘신화를 지어내는 자들’로도 옮길 수 있습니다. 그리스어는 이야기나 신화에 관여하는 사람들을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἵ τε υἱοὶ Ἁγὰρ
  english_pob_choice: And the sons of Hagar also
  chosen_korean: 그리고 하갈의 아들들도
  alternatives_korean:
  - 하갈의 아들들도
  - 하갈의 자손들도
  lexicon: LSJ
  rationale: υἱοί의 직역인 ‘아들들’을 유지하되 한국어에서는 소유격으로 자연스럽게 처리했습니다. τε의 덧붙는 느낌은 ‘그리고’와 ‘도’로 살렸습니다.
- source_word: οἱ ἐκζητοῦντες τὴν σύνεσιν
  english_pob_choice: who seek understanding
  chosen_korean: 이해를 구하는 자들
  alternatives_korean:
  - 이해를 찾는 자들
  - 통찰을 찾는 자들
  lexicon: LSJ
  rationale: ἐκζητέω의 강한 ‘구하다/찾아 구하다’의 뉘앙스를 살려 ‘구하는’으로 옮겼고, σύνεσις는 문맥상 ‘이해’가 가장 مستقیم하고 자연스럽습니다.
- source_word: οἱ μυθολόγοι
  english_pob_choice: the myth-makers
  chosen_korean: 신화를 지어내는 자들
  alternatives_korean:
  - 이야기꾼들
  - 신화제작자들
  lexicon: LSJ
  rationale: μυθολόγοι의 ‘신화/이야기를 만들어내는 사람들’이라는 뜻을 드러내기 위해 직역적이되 한국어로 읽히는 표현을 택했습니다. 단순한 ‘이야기꾼들’보다 원문의 다소 폄하적·분류적 뉘앙스가 보존됩니다.
- source_word: ὁδὸν δὲ σοφίας ... τὰς τρίβους αὐτῆς
  english_pob_choice: the way of wisdom ... her paths
  chosen_korean: 지혜의 길 ... 그녀의 길들을
  alternatives_korean:
  - 지혜의 길 ... 그 길들
  - 지혜의 길 ... 그 발자취
  lexicon: LSJ
  rationale: ὁδός와 τρίβους의 길-이미지 반복을 한국어에서도 유지했습니다. σοφία가 여성형으로 의인화되어 있으므로 ‘그녀의’로 보존했습니다.
theological_decisions:
- issue: 지혜의 의인화와 여성 대명사
  chosen_reading: ‘그녀의 길들을’로 옮겨 σοφία의 여성형 의인화를 유지했습니다.
  alternative_readings:
  - 그 길들을
  - 그의 길들을
  rationale: 본문은 지혜를 단순 개념이 아니라 인격화된 존재로 말하므로, 여성 대명사를 지워 버리면 문학적·신학적 표현이 약해집니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 3, 6
- issue: 불확정 지명 Μερρὰν
  chosen_reading: 메란으로 음역해 그리스어 전승의 현존 형태를 드러냈습니다.
  alternative_readings:
  - 더 익숙한 지명으로 정상화함
  - 주석 없이 의역함
  rationale: 비정상적이거나 불확실한 지명형을 조용히 고쳐 쓰지 않고, 본문 전승을 있는 그대로 드러내는 것이 감사 가능성과 출처 정직성에 부합합니다.
  doctrine_reference: PHILOSOPHY.md §What we are translating; §transparent
