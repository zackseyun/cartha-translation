- from: 그리고 하갈의 아들들도—땅에서 이해를 구하는 자들, 메란과 테만의 상인들, 신화를 지어내는 자들과 이해를 구하는 자들—지혜의 길을 알지 못했고, 그녀의 길들을 기억하지도 못했습니다.[a][b]
  to: 그리고 땅에서 슬기를 찾는 하갈의 아들들도, 메란[a]과 테만의 상인들과 이야기를 하는 사람들[b]과 슬기를 찾는 사람들도 지혜의 길을 알지 못하였고, 그녀의 길들을 기억하지도 못하였습니다.
  rationale: 수정은 μυθολόγοι의 의미 범위를 보존하고, σύνεσις의 반복을 자연스러운 한국어로 드러내며, 두 주석 표지를 각각의 해당 단어에 붙이기 위한 것입니다. 지혜의 여성 의인화는 ‘그녀의 길들’로 유지했고, 불확실한 지명 Μερρὰν은 ‘메란’으로 음역했습니다.
