translation:
  language: ko
  text: 그는 빛을 보내시고, 빛은 가며, 그것을 부르시니 그것은 떨며 그분께 순종했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ἀποστέλλων
  english_pob_choice: He sends out
  chosen_korean: 그는 … 보내시고
  alternatives_korean:
  - 빛을 보내는 분은
  - 그는 보내십니다
  lexicon: BDAG
  rationale: 정관사 붙은 현재분사 ὁ ἀποστέλλων은 문맥상 하나님을 가리키는 서술적 호칭이므로, 한국어에서는 주어를 드러내어 자연스럽게 옮기되 현재적·지속적 행위를 살려 «보내시고»로 처리했습니다.
- source_word: τὸ φῶς
  english_pob_choice: the light
  chosen_korean: 빛
  alternatives_korean:
  - 그 빛
  - 광명
  lexicon: BDAG
  rationale: 문맥의 창조적·우주적 빛을 가리키므로 특별한 비유를 덧붙이지 않고 단순히 «빛»으로 옮겼습니다.
- source_word: πορεύεται
  english_pob_choice: it goes
  chosen_korean: 가며
  alternatives_korean:
  - 가고
  - 나아가며
  lexicon: BDAG
  rationale: 빛이 하나님의 부르심에 응답해 나아가는 동작을 간결하게 살리기 위해 «가며»로 옮겼습니다.
- source_word: ὑπήκουσεν αὐτῷ τρόμῳ
  english_pob_choice: it obeyed him with trembling
  chosen_korean: 떨며 그분께 순종했습니다
  alternatives_korean:
  - 떨며 그에게 순종했습니다
  - 두려움으로 그분께 복종했습니다
  lexicon: BDAG
  rationale: ὑπακούω의 핵심은 단순한 청취가 아니라 순종이므로 «순종했습니다»를 택했고, τρόμῳ는 부사적으로 작동하는 떨림의 뉘앙스를 «떨며»로 반영했습니다.
theological_decisions:
- issue: 빛의 의인화와 하나님의 창조 주권
  chosen_reading: 빛이 부름을 듣고 떨며 순종하는 의인화를 그대로 유지했습니다.
  alternative_readings:
  - 자연 질서에 대한 비인격적 진술로 완화하기
  - 의인화를 약화해 해설적으로 옮기기
  rationale: 원문은 빛을 실제로 부르고 순종하는 존재처럼 묘사하여 하나님의 주권적 명령 아래 있는 창조를 강조하므로, 시적 이미지를 약화하지 않고 그대로 살렸습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 3
- issue: 현재분사 ὁ ἀποστέλλων의 주어 처리
  chosen_reading: 문맥상 하나님을 가리키는 서술적 표현으로 보고 한국어에서는 명시적 주어를 사용했습니다.
  alternative_readings:
  - «빛을 보내시는 분»이라는 명사구로만 처리하기
  - 주어를 생략한 문체로 옮기기
  rationale: 한국어 합쇼체에서는 문장의 주체를 분명히 드러내는 것이 자연스럽고, 문맥상 동일 인물이 계속 이어지므로 «그는»으로 연결해도 신학적 긴장은 생기지 않습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 6
