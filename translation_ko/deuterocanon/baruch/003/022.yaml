  alternative_readings:
  - ‘그것은 가나안에서도…’처럼 주어를 명시함
  - ‘지혜는 가나안에서도…’처럼 해설적으로 보충함
  rationale: 헬라어 본문이 주어를 반복하지 않는 구조를 유지해, 절 자체의 간결함과 문맥 의존성을 살렸습니다.
  doctrine_reference: '번역 원칙: 본문이 말하는 바를 넘어서지 않고, 문맥이 제공하는 의미는 보존한다.'
