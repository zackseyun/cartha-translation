base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/003/035.yaml
  text: He called them[a], and they said, ‘Here we are’[c][b]; they shone with gladness for the one who made them.
  footnotes:
  - marker: a
    text: Or, 'they answered, “We are here,”' preserving the responsive force of the Greek after 'He called them.'
    reason: lexical_alternative
  - marker: b
    text: The referent is the heavenly lights/stars from the preceding context, poetically portrayed as answering their Creator.
    reason: cross_reference
  - marker: c
    text: Or, 'before the one who made them' or 'to the one who made them'; the Greek dative allows more than one nuance of relation.
    reason: alternative_reading
translation:
  language: ko
  text: 그가 그들을 부르시자, 그들이 말했습니다. “여기 있습니다.” 그들은 자신들을 지으신 분을 향해 기쁨으로 빛났습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘불렀다’는 ‘소집하다’보다 넓고 자연스러운 번역이지만, 여기서는 부르심에 대한 응답이 이어진다는 점이 중요합니다.
    reason: lexical_alternative
  - marker: b
    text: 문맥상 대상은 앞선 맥락의 하늘의 빛들/별들입니다.
    reason: cross_reference
  - marker: c
    text: 그리스어 여격은 ‘그들을 지으신 분에게’ 또는 ‘그들을 지으신 분 앞에서’라는 뉘앙스도 가질 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκάλεσεν
  english_pob_choice: He called
  chosen_korean: 부르시자
  alternatives_korean:
  - 부르셨습니다
  - 불렀습니다
  - 소집하셨습니다
  lexicon: BDAG
  rationale: 호출의 동작을 자연스럽게 살리면서, 이어지는 응답과의 시간적 연결을 한국어 종속절로 드러내기 위해 ‘부르시자’를 택했습니다.
- source_word: εἶπον Πάρεσμεν
  english_pob_choice: they said, ‘Here we are’
  chosen_korean: 그들이 말했습니다. “여기 있습니다.”
  alternatives_korean:
  - 그들이 대답했습니다. “여기 있습니다.”
  - “여기 있습니다”라고 그들이 말했습니다.
  - “우리가 여기 있습니다.”
  lexicon: BDAG / LSJ
  rationale: 응답의 성격은 유지하되, 한국어에서는 ‘말했습니다’가 원문 구조를 가장 무리 없이 반영합니다. ‘여기 있습니다’는 존재·대기의 응답을 현대적이고 공손한 표현으로 살립니다.
- source_word: ἔλαμψαν
  english_pob_choice: they shone
  chosen_korean: 빛났습니다
  alternatives_korean:
  - 비쳤습니다
  - 반짝였습니다
  - 빛을 발했습니다
  lexicon: BDAG
  rationale: 별들의 응답을 단순한 광학 현상으로 낮추지 않으면서도, λάμπω의 핵심 의미인 발광을 가장 자연스럽게 옮겼습니다.
- source_word: μετʼ εὐφροσύνης
  english_pob_choice: with gladness
  chosen_korean: 기쁨으로
  alternatives_korean:
  - 즐거움으로
  - 환희로
  - 기쁜 마음으로
  lexicon: BDAG
  rationale: 전치사구의 기조를 유지하면서도 한국어에서 가장 간결하고 서정적으로 들리는 부사어로 옮겼습니다. ‘기쁨으로’는 감정 상태와 행위의 결합을 잘 드러냅니다.
- source_word: τῷ ποιήσαντι αὐτούς
  english_pob_choice: for the one who made them
  chosen_korean: 자신들을 지으신 분을 향해
  alternatives_korean:
  - 자신들을 만드신 분을 위하여
  - 자신들을 지으신 분에게
  - 자신들을 지으신 분 앞에서
  lexicon: BDAG
  rationale: 여격의 관계성은 단일한 영어식 전치사로 과도하게 고정하지 않고, 원문의 방향성과 응답성을 살려 ‘을 향해’로 처리했습니다. ‘지으신 분’은 δημιουργέω 계열의 창조 행위를 자연스럽게 반영합니다.
theological_decisions:
- issue: 의인화된 하늘의 빛들이 창조주께 응답하는 표현
  chosen_reading: 천체의 인격화된 응답을 그대로 보존해, 부르심에 대한 순종과 기쁨의 반응을 드러냈습니다.
  alternative_readings:
  - 비인격적인 천문 묘사로 완화하기
  - 은유로만 처리해 응답성을 약화하기
  rationale: 본문은 별들을 단순히 ‘빛나는 물체’가 아니라 부르심에 응답하는 존재로 그립니다. 이 신학적·시적 긴장을 유지하는 것이 원문 의미에 더 충실합니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
