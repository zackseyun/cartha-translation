  text: 그가 그들을 부르시자[a], 그들이[b] 말했습니다. “여기 있습니다.” 그들은 자신들을 지으신 분께[c] 기쁨으로 빛났습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘부르시자’ 뒤에 응답이 이어지므로, ‘그들이 대답했습니다’라고 옮길 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 문맥상 ‘그들’은 앞선 맥락의 하늘의 빛들, 곧 별들을 가리킵니다. 본문은 이들을 시적으로 의인화하여 말합니다.
    reason: cross_reference
  - marker: c
    text: 그리스어 여격은 ‘그들을 지으신 분께’라는 관계를 나타냅니다. 문맥상 ‘그들을 지으신 분을 위하여’ 또는 ‘그들을 지으신 분 앞에서’라는 뉘앙스로도 이해될 수 있습니다.
    reason: alternative_reading
