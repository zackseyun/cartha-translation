theological_decisions:
- issue: κύριος의 번역을 ‘주님’으로 유지할지, ‘주’와 분리할지
  chosen_reading: 문장 앞에서는 ‘주’, 직접 호칭과 찬양의 대상에는 ‘주님’을 써서 두 용법을 구분했습니다.
  alternative_readings:
  - 주님 우리의 하나님
  - 주 우리의 하나님
  rationale: 본문은 선언과 호칭을 함께 포함하므로, 한국어에서도 서술적 칭호와 직접 호칭의 어감을 구분하는 편이 source-driven입니다. 동시에 ‘여호와’로 바꾸지 않고 일반적인 성경적 호칭을 유지했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: κύριος → 주/주님'
