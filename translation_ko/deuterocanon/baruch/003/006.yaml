  rationale: 미래 능동 직설법 1인칭 복수의 약속을 그대로 살려, 결의와 서약의 뉘앙스를 담는 ‘찬양할 것입니다’로 옮겼습니다.
- source_word: Κύριε
  english_pob_choice: O Lord
  chosen_korean: 주님을
  alternatives_korean:
  - 오 주님을
  - 주여
  lexicon: BDAG
