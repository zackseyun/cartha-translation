- source_word: σὺ Κύριος ὁ θεὸς ἡμῶν
  english_pob_choice: you are the Lord our God
  chosen_korean: 주 우리의 하나님이시므로
  alternatives_korean:
  - 주님은 우리의 하나님이시므로
  - 당신은 우리의 주 하나님이시므로
  lexicon: BDAG
  rationale: Κύριος와 θεός의 결합을 분리하기보다, 하나님을 지칭하는 고백으로 자연스럽게 묶어 ‘주 우리의 하나님’으로 옮겼습니다. 합쇼체 서술을 위해 ‘-이시므로’를 사용했습니다.
- source_word: αἰνέσομέν
