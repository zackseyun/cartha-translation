translation:
  language: ko
  text: 그는 지식의 온갖 길을 찾아내셨고, 그것을 그의 종[a] 야곱과 그에게 사랑받는 이스라엘에게 주셨습니다.
  philosophy: optimal-equivalence
  footnotes:
