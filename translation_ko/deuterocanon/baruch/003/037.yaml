translation:
  language: ko
  text: 그는 지식의 온갖 길을 찾아내셨고, 그것을 자기 종 야곱과 자기 사랑받는 이스라엘에게 주셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
