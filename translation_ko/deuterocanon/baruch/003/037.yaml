lexical_decisions:
- source_word: ἐξεῦρεν
  english_pob_choice: found out
  chosen_korean: 찾아내셨고
  alternatives_korean:
  - 발견하셨고
  - 찾으셨고
  lexicon: LSJ
  rationale: 복합동사 ἐξεῦρεν의 ‘알아내다/찾아내다’라는 능동적 뉘앙스를 살리되, 합쇼체 서술에 자연스럽게 맞췄습니다.
- source_word: πᾶσαν ὁδὸν ἐπιστήμης
  english_pob_choice: every way of knowledge
  chosen_korean: 지식의 온갖 길
  alternatives_korean:
  - 지식의 모든 길
  - 지식의 모든 길목
  lexicon: LSJ
  rationale: ὁδός의 문자적 ‘길’ 이미지를 유지하면서, 지식에 이르는 다양한 경로라는 비유를 과도하게 풀지 않고 보존했습니다.
- source_word: τῷ παιδὶ αὐτοῦ
  english_pob_choice: his servant
  chosen_korean: 자기 종
  alternatives_korean:
  - 자기 아이
  - 자기 아들
  lexicon: LSJ
  rationale: παῖς는 ‘아이/아들/종’이 가능하지만, 이 문맥에서는 하나님과의 언약적 관계를 드러내는 ‘종’이 가장 직접적이며, 영어 POB의 선택과도 일치합니다.
- source_word: τῷ ἠγαπημένῳ ὑπʼ αὐτοῦ
  english_pob_choice: his beloved
  chosen_korean: 자기 사랑받는 이스라엘
  alternatives_korean:
  - 자기에게 사랑받는 이스라엘
  - 그가 사랑하는 이스라엘
  lexicon: LSJ
  rationale: 완료 수동 분사 구조의 ‘그에게 사랑받는’ 의미를 그대로 살리면서, 히브리적 평행법 속에서 이름 ‘이스라엘’과 자연스럽게 결합했습니다.
theological_decisions:
- issue: παῖς를 ‘종’으로 둘지 ‘자녀/아들’로 둘지
  chosen_reading: 종
  alternative_readings:
  - 자녀
  - 아들
  rationale: 본문은 야곱의 신분을 친자 관계보다 소명과 섬김의 관계로 묘사하므로, ‘종’이 언약적 긴장과 원문 의미를 더 정확히 반영합니다.
  doctrine_reference: original-language primacy; preserve theological tension
- issue: 야곱과 이스라엘을 하나로 합쳐 번역할지
  chosen_reading: 둘 다 유지
  alternative_readings:
  - 야곱/이스라엘로 합침
  - 이스라엘만으로 정리
  rationale: 헬라어는 평행 구조로 두 이름을 나란히 제시하므로, 서술의 운율과 선출 언어의 층위를 보존하기 위해 둘 다 유지했습니다.
  doctrine_reference: preserve literary parallelism and theological texture
