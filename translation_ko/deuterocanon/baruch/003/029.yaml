lexical_decisions:
- source_word: τίς
  english_pob_choice: Who
  chosen_korean: 누가
  alternatives_korean:
  - 누구가
  - 누가 그
  lexicon: LSJ
  rationale: 수사적 질문을 자연스러운 한국어로 옮기되, 원문의 직접적인 물음 구조를 그대로 살렸습니다.
- source_word: ἀνέβη εἰς τὸν οὐρανόν
  english_pob_choice: has gone up into heaven
  chosen_korean: 하늘로 올라가서
  alternatives_korean:
  - 하늘에 올라가서
  - 하늘로 올라갔으며
  lexicon: LSJ
  rationale: οὐρανόν을 여기서는 물리적 하늘이 아니라 하늘/천상으로 이해할 수 있으나, 한국어에서는 문맥을 해치지 않는 범위에서 간결한 ‘하늘로’로 옮겼습니다.
- source_word: ἔλαβεν αὐτήν
  english_pob_choice: took her
  chosen_korean: 그것을 가져왔으며
  alternatives_korean:
  - 그것을 취했으며
  - 그녀를 데려왔으며
  lexicon: LSJ
  rationale: 문맥의 지혜(Sophia)를 가리키는 여성형 대명사를 한국어에서는 사물화된 ‘그것’으로 처리할 수도 있지만, 직접적이고 자연스러운 동작을 살리기 위해 ‘가져왔으며’로 옮겼습니다.
- source_word: κατεβίβασεν αὐτὴν ἐκ τῶν νεφελῶν
  english_pob_choice: brought her down from the clouds
  chosen_korean: 구름들에서 그것을 내려왔습니까
  alternatives_korean:
  - 구름에서 그것을 내려보냈습니까
  - 구름들로부터 그것을 끌어내렸습니까
  lexicon: LSJ
  rationale: κατεβίβασεν의 하향 이동·인도 의미를 살려 ‘내려왔습니까’로 옮겼고, 복수형 νεφελῶν은 원문의 이미지를 유지해 ‘구름들에서’로 반영했습니다.
theological_decisions:
- issue: 지혜의 여성화된 지시 대명사 처리
  chosen_reading: 한국어 본문에서는 ‘그것’을 사용해 문맥상의 지혜를 직접 지시하되, 주석 없이 본문만으로도 수사적 물음이 유지되도록 했습니다.
  alternative_readings:
  - 그녀를
  - 그를
  rationale: 그리스어 αὐτήν은 주변 문맥의 지혜를 가리키는 여성형이지만, 한국어에서 인격화된 지혜를 ‘그녀’로 고정하면 어색할 수 있어 본문 가독성을 우선하되 원문의 인격화는 수사 구조로 보존했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
