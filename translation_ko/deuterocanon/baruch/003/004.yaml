base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/003/004.yaml
  text: Lord Almighty[a], God of Israel, please hear the prayer of the dead of Israel and of the sons who sinned before you, who did not listen to the voice of you, their God, and the evils have clung to us.
  footnotes:
  - marker: a
    text: Or 'the calamities have clung to us' or 'the disasters have stuck to us.' The Greek literally says 'the evils have clung to us.'
    reason: lexical_alternative
translation:
  language: ko
  text: 만군의 주님[a], 이스라엘의 하나님이시여, 부디 이스라엘의 죽은 이들과 주님 앞에서 죄를 지은 아들들의 기도를 들으소서. 그들은 자기들의 하나님이신 주님의 음성을 듣지 않았고, 악들이 우리에게 달라붙었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘재앙들이 우리에게 달라붙었습니다’, 혹은 ‘재난들이 우리에게 들러붙었습니다’. 그리스어는 문자적으로 ‘악들이 우리에게 달라붙었습니다’라고 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Κύριε Παντοκράτωρ
  english_pob_choice: Lord Almighty
  chosen_korean: 만군의 주님
  alternatives_korean:
  - 전능하신 주님
  - 전능자 주님
  lexicon: LSJ
  rationale: παντοκράτωρ는 하나님의 보편적 주권을 나타내는 호칭이므로, 한국어에서는 자연스럽고 예배적 문체인 ‘만군의 주님’으로 옮겨 호칭의 장엄함을 살렸습니다.
- source_word: ἄκουσον δὴ
  english_pob_choice: please hear
  chosen_korean: 부디 … 들으소서
  alternatives_korean:
  - 이제 들으소서
  - 들어주십시오
  lexicon: LSJ
  rationale: δή가 더하는 간청의 뉘앙스를 ‘부디’로 살리고, 하나님께 드리는 직접 호소이므로 높임말 명령형 ‘들으소서’를 사용했습니다.
- source_word: τῶν τεθνηκότων Ἰσραήλ
  english_pob_choice: the dead of Israel
  chosen_korean: 이스라엘의 죽은 이들
  alternatives_korean:
  - 죽은 이스라엘 사람들
  - 이스라엘의 사망한 자들
  lexicon: LSJ
  rationale: 직역에 가깝게 ‘죽은 이들’을 유지해, 단순히 영적 상태가 아니라 실제로 죽은 사람들을 가리키는 표현을 보존했습니다.
- source_word: ἐναντίον σου
  english_pob_choice: before you
  chosen_korean: 주님 앞에서
  alternatives_korean:
  - 주님께 대항하여
  - 주님 앞에
  lexicon: LSJ
  rationale: ἐναντίον은 여기서 ‘대항하여’보다 ‘…앞에서’가 원문 관계를 더 정확히 반영하므로, 죄의 발생 위치를 드러내는 ‘주님 앞에서’로 옮겼습니다.
- source_word: τῆς φωνῆς σου θεοῦ αὐτῶν
  english_pob_choice: your voice, their God
  chosen_korean: 자기들의 하나님이신 주님의 음성
  alternatives_korean:
  - 주님, 그들의 하나님의 음성
  - 그들의 하나님이신 주님의 목소리
  lexicon: LSJ
  rationale: θεοῦ αὐτῶν은 앞선 δεύτε人칭 호칭에 붙는 동격이므로, 한국어에서는 ‘자기들의 하나님이신 주님’으로 풀어 apposition을 자연스럽게 드러냈습니다.
- source_word: ἐκολλήθη ἡμῖν τὰ κακά
  english_pob_choice: the evils have clung to us
  chosen_korean: 악들이 우리에게 달라붙었습니다
  alternatives_korean:
  - 재앙들이 우리에게 들러붙었습니다
  - 악이 우리에게 달라붙었습니다
  lexicon: LSJ
  rationale: κολλάω의 ‘붙다/달라붙다’ 이미지를 살리되, τὰ κακά의 넓은 의미를 보존하기 위해 단수화하지 않고 복수형 ‘악들’로 번역했습니다.
theological_decisions:
- issue: τὰ κακά의 의미 범위
  chosen_reading: 본문에는 ‘악들’로 두고, 재난/재앙의 뉘앙스는 다른 번역 가능성으로 열어 둡니다.
  alternative_readings:
  - 재앙들이 우리에게 달라붙었습니다
  - 재난들이 우리에게 들러붙었습니다
  rationale: τὰ κακά는 문맥상 징계로서의 재앙을 가리킬 수 있지만, 원문 자체는 도덕적 악과 재난의 범위를 모두 열어 두므로 본문에서는 너무 좁히지 않았습니다.
  doctrine_reference: 다의어 보존과 문맥적 해석의 긴장 유지
- issue: ‘죽은 이스라엘’의 해석
  chosen_reading: 실제로 죽은 이스라엘 사람들을 가리키는 문자적 표현으로 유지했습니다.
  alternative_readings:
  - 사실상 죽은 상태의 이스라엘
  - 영적으로 죽은 이스라엘
  rationale: 그리스어 표현은 문자적으로 ‘죽은 자들’을 뜻하므로, 본문이 말하는 충격적인 호소를 해석으로 대체하지 않았습니다.
  doctrine_reference: 본문 우선, 해석 과잉 지양
