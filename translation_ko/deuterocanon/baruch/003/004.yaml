  source_fidelity: 핵심 호칭인 Παντοκράτωρ는 ‘전능하신 분/전능자’이지 ‘만군의 주님’(통상 יהוה צבאות에 대응)이 아닙니다. 또한 ἁμαρτανόντων은 현재분사이므로, 문맥상 과거의 불순종을 회고하는 관계절과 구별하여 ‘죄를 짓는’으로 옮기는 것이 원문에 더 가깝습니다.
  naturalness: ‘이스라엘의 죽은 이들’과 ‘악들이 … 달라붙었습니다’는 이해 가능하나 다소 직역투입니다. ‘이스라엘 가운데 죽은 이들’ 및 ‘악한 일들이 우리에게 달라붙었습니다’는 원문의 이미지를 보존하면서 더 자연스럽습니다.
  terminology: Παντοκράτωρ는 ‘전능하신 주님’으로 바로잡아야 합니다. ‘만군의 주님’은 별개의 신명 칭호이므로 여기서 사용할 수 없습니다. τὰ κακά는 문맥상 재앙을 가리킬 수 있으나 본문에서는 넓은 표현을 유지하고 각주에서 ‘재앙/재난’을 제시합니다.
  issues:
  - severity: high
    issue: ‘만군의 주님’은 Παντοκράτωρ의 정확한 번역이 아닙니다.
    rationale: ‘만군’은 일반적으로 ‘만군의 여호와’에 해당하는 셈어계 칭호의 번역이며, Παντοκράτωρ는 ‘전능하신 분’, ‘만물을 다스리시는 분’을 뜻합니다.
  - severity: medium
    issue: ‘죄를 지은 아들들’은 현재분사 ἁμαρτανόντων의 상을 충분히 반영하지 못합니다.
    rationale: 현재분사는 죄를 짓고 있는/죄를 범하는 자들을 가리킵니다. 뒤의 ‘듣지 않았다’는 부정과거와는 구별됩니다.
  - severity: low
    issue: ‘악들이’는 한국어에서 다소 부자연스럽습니다.
    rationale: τὰ κακά의 넓은 의미를 유지하면서 ‘악한 일들’로 표현하면 문맥과 한국어 관용을 함께 살릴 수 있습니다.
