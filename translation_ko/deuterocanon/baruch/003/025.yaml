  rationale: 직역상 ‘끝을 가지지 않는다’는 뜻을 자연스러운 합쇼체로 풀어 ‘끝이 없으며’로 옮겼습니다. POB의 ‘without end’와 같은 의미를 유지합니다.
- source_word: ὑψηλός
  english_pob_choice: lofty
  chosen_korean: 높고
  alternatives_korean:
  - 고상하고
  - 높으며
  - 드높고
  lexicon: BDAG
  rationale: ‘lofty’의 고양된 높이를 직접 반영하되, 본문의 병렬성을 살리기 위해 평이한 ‘높고’를 택했습니다.
- source_word: ἀμέτρητος
  english_pob_choice: immeasurable
  chosen_korean: 헤아릴 수 없습니다
  alternatives_korean:
  - 측량할 수 없습니다
  - 헤아릴 수 없고
  - 셀 수 없습니다
  lexicon: BDAG
  rationale: ‘측량할 수 없음’보다 한국어에서 더 자연스러운 무한성 표현인 ‘헤아릴 수 없습니다’로 옮겼습니다. 수량만이 아니라 범위와 정도를 함께 포괄합니다.
