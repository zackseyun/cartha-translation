translation:
  language: ko
  text: 하나님의 길로 걸었더라면, 평안 가운데 영원히 살았을 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τῇ ὁδῷ τοῦ θεοῦ
  english_pob_choice: the way of God
  chosen_korean: 하나님의 길
  alternatives_korean:
  - 하나님의 도
  - 하나님의 방식
  - 하나님의 길 위
  lexicon: ὁδός / θεός
  rationale: ὁδός는 단순한 이동 경로가 아니라 삶의 방식과 행위를 가리킬 수 있으므로, 소스의 비유를 살려 ‘하나님의 길’로 옮겼습니다. '도'나 '방식'은 의미를 옮기지만 본문의 이미지가 약해집니다.
- source_word: εἰ ἐπορεύθης
  english_pob_choice: if you had walked
  chosen_korean: 걸었더라면
  alternatives_korean:
  - 가셨더라면
  - 가보셨더라면
  - 걸어가셨더라면
  lexicon: πορεύομαι
  rationale: aorist 조건문은 과거에 성립하지 않았던 가정의 뉘앙스를 가지므로, 한국어에서는 ‘-었더라면’으로 그 반사실적 의미를 살렸습니다. ‘걸다’는 행위의 방향성과 삶의 행로 이미지를 유지합니다.
- source_word: κατῴκεις ἂν
  english_pob_choice: you would have lived
  chosen_korean: 살았을 것입니다
  alternatives_korean:
  - 거하셨을 것입니다
  - 거주하셨을 것입니다
  - 살아 계셨을 것입니다
  lexicon: κατοικέω
  rationale: κατοικέω의 기본 의미는 ‘거주하다’이지만, 이 문맥에서는 ‘평안 가운데’와 결합해 지속적인 삶의 상태를 말하므로 자연스러운 현대 한국어인 ‘살다’를 택했습니다. ‘거하다’는 소스의 지속성은 살리지만 한국어로는 경직됩니다.
- source_word: ἐν εἰρήνῃ
  english_pob_choice: in peace
  chosen_korean: 평안 가운데
  alternatives_korean:
  - 평안히
  - 평화 속에
  - 평강 가운데
  lexicon: εἰρήνη
  rationale: εἰρήνη의 명사성을 살려 상태를 나타내는 ‘평안 가운데’로 옮겼습니다. ‘평안히’는 부사화되어 본문의 조건적 상태감을 약화시킬 수 있습니다.
- source_word: τὸν αἰῶνα
  english_pob_choice: forever
  chosen_korean: 영원히
  alternatives_korean:
  - 영원토록
  - 세세토록
  - 이 시대 동안
  lexicon: αἰών
  rationale: 문맥상 지속 기간을 나타내는 관용적 표현이므로 현대 한국어의 자연스러운 ‘영원히’로 번역했습니다. ‘세세토록’은 전통적이지만 오늘날 문체와 어긋납니다.
theological_decisions:
- issue: 반사실적 과거 조건문의 처리
  chosen_reading: ‘걸었더라면 … 살았을 것입니다’로 옮겨, 과거에 성립하지 않은 가정과 그 결과의 상실을 드러냈습니다.
  alternative_readings:
  - 걸으시면 … 살 것입니다
  - 걸었다면 … 살 것입니다
  - 걸었더라면 … 거하셨을 것입니다
  rationale: εἰ + aorist indicative와 ἄν은 문맥상 반사실적 조건문을 이루므로, 이를 일반적 교훈이나 현재 미래 조건으로 약화시키지 않았습니다.
  doctrine_reference: Translation philosophy §1, §3, §6
- issue: ‘하나님의 길’의 비유성 유지
  chosen_reading: ‘하나님의 길’로 직역에 가깝게 유지하고, ‘율법’이나 ‘계명들’로 좁히지 않았습니다.
  alternative_readings:
  - 하나님의 율법
  - 하나님의 계명들을 따라
  - 하나님께 순종하는 길
  rationale: 본문은 분명히 ‘길’이라는 메타포를 쓰므로, 이를 규범 조항으로 환원하면 소스가 가진 넓은 행로 이미지가 사라집니다.
  doctrine_reference: Translation philosophy §1, §6
