- source_word: μακροβίωσις
  english_pob_choice: length of days
  chosen_korean: 장수
  alternatives_korean:
  - 긴 세월
  - 오랜 삶
  - 날수
  lexicon: LSJ
  rationale: 마κροβίωσις는 장수, 곧 오래 사는 상태를 가리키므로 한국어 성경 문맥에서 자연스럽고 간결한 ‘장수’로 옮겼습니다. 영어 본문이 유지한 관용구의 의미를 보존합니다.
- source_word: φῶς ὀφθαλμῶν
  english_pob_choice: light for the eyes
  chosen_korean: 눈의 빛
  alternatives_korean:
  - 눈을 위한 빛
  - 눈에 비치는 빛
  - 눈의 광명
  lexicon: BDAG
  rationale: 직역적 은유를 살려 ‘눈의 빛’으로 옮겼습니다. 이는 단순한 시력만이 아니라 생기, 기쁨, 또렷함까지 열어 두는 표현입니다.
