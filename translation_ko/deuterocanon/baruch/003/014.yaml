base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/003/014.yaml
  text: Learn where prudence is[a], where strength is, where understanding is, so that you may know at the same time where length of days and life are[b], where light for the eyes and peace are.
  footnotes:
  - marker: a
    text: Or 'long life' for 'length of days.' The Greek μακροβίωσις denotes longevity; the main text preserves the biblical idiom.
    reason: lexical_alternative
  - marker: b
    text: '''Light for the eyes'' is a literal metaphor that can suggest vitality, joy, or clarity.'
    reason: lexical_alternative
translation:
  language: ko
  text: 지혜가 어디에 있는지 배우십시오[a], 힘이 어디에 있는지, 분별력이 어디에 있는지, 또한 동시에 장수와 생명이 어디에 있는지[b], 눈의 빛과 평강이 어디에 있는지 알게 하려는 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘슬기’로 옮길 수 있습니다. 여기의 φρόνησις는 실천적 분별을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: ‘눈의 빛’은 문자적인 은유로, 생기, 기쁨, 또는 선명함을 암시할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: μάθε
  english_pob_choice: Learn
  chosen_korean: 배우십시오
  alternatives_korean:
  - 아십시오
  - 알아내십시오
  lexicon: 표준국어대사전
  rationale: 아오리스트 명령형의 권고를 자연스러운 합쇼체 명령으로 옮기되, 단순 인지가 아니라 지혜를 익혀 알아가라는 뜻을 살려 ‘배우십시오’로 렌더링했습니다.
- source_word: φρόνησις
  english_pob_choice: prudence
  chosen_korean: 지혜
  alternatives_korean:
  - 신중함
  - 분별력
  - 슬기
  lexicon: BDAG
  rationale: 이 문맥의 φρόνησις는 실천적 분별을 가리키므로 ‘지혜’로 옮길 수 있으나, 뒤의 σύνεσις와 겹침을 줄이기 위해 본문에는 더 일반적인 ‘지혜’를 두고, ἰσχύς와 σύνεσις의 구별을 살렸습니다.
- source_word: σύνεσις
  english_pob_choice: understanding
  chosen_korean: 분별력
  alternatives_korean:
  - 이해
  - 통찰
  - 깨달음
  lexicon: BDAG
  rationale: σύνεσις는 단순 지식보다 사안을 구별해 파악하는 능력을 뜻하므로, 현대 한국어에서 기능적 의미가 가장 분명한 ‘분별력’을 선택했습니다.
- source_word: μακροβίωσις
  english_pob_choice: length of days
  chosen_korean: 장수
  alternatives_korean:
  - 긴 세월
  - 오랜 삶
  - 날수
  lexicon: LSJ
  rationale: 마κροβίωσις는 장수, 곧 오래 사는 상태를 가리키므로 한국어 성경 문맥에서 자연스럽고 간결한 ‘장수’로 옮겼습니다. 영어 본문이 유지한 관용구의 의미를 보존합니다.
- source_word: φῶς ὀφθαλμῶν
  english_pob_choice: light for the eyes
  chosen_korean: 눈의 빛
  alternatives_korean:
  - 눈을 위한 빛
  - 눈에 비치는 빛
  - 눈의 광명
  lexicon: BDAG
  rationale: 직역적 은유를 살려 ‘눈의 빛’으로 옮겼습니다. 이는 단순한 시력만이 아니라 생기, 기쁨, 또렷함까지 열어 두는 표현입니다.
