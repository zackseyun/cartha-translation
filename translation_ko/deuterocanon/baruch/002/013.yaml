lexical_decisions:
- source_word: ἀποστραφήτω ὁ θυμός σου ἀφ᾽ ἡμῶν
  english_pob_choice: Let your wrath turn away from us
  chosen_korean: 당신의 분노가 우리에게서 돌아서게 하십시오
  alternatives_korean:
  - 당신의 진노가 우리에게서 돌아가게 하십시오
  - 당신의 노여움이 우리에게서 물러나게 하십시오
  lexicon: ἀποστρέφω / θυμός
  rationale: 원문의 명령형과 ‘분노’의 직접 대상을 살려, 완곡한 표현보다 하나님의 감정적 진노가 우리에게서 떠나가도록 구하는 문장을 유지했습니다.
- source_word: κατελείφθημεν ὀλίγοι
  english_pob_choice: we have been left few
  chosen_korean: 적은 수만 남았기 때문입니다
  alternatives_korean:
  - 우리가 소수만 남았기 때문입니다
  - 우리는 얼마 남지 않았기 때문입니다
  lexicon: καταλείπω / ὀλίγοι
  rationale: ‘남겨지다’의 수동성과 ‘적은 수’를 함께 살리되, 한국어에서는 자연스럽게 ‘적은 수만 남다’로 옮기는 편이 원문의 상태를 잘 드러냅니다.
- source_word: ἐν τοῖς ἔθνεσιν
  english_pob_choice: among the nations
  chosen_korean: 이방 민족들 가운데서
  alternatives_korean:
  - 민족들 가운데서
  - 열국 가운데서
  lexicon: ἔθνη
  rationale: 바룩서 문맥에서 ἔθνη는 단순한 지리적 ‘나라들’보다 언약 공동체 바깥의 ‘이방 민족들’이라는 뉘앙스가 강해 이를 반영했습니다.
- source_word: οὗ διέσπειρας ἡμᾶς ἐκεῖ
  english_pob_choice: where you scattered us there
  chosen_korean: 우리가 흩으신 그곳
  alternatives_korean:
  - 우리를 그곳에 흩으신 곳
  - 우리를 그곳에 흩어 놓으신 곳
  lexicon: διασπείρω
  rationale: ‘흩으시다’는 하나님의 주도적 흩으심을 살리고, 반복되는 ‘there’는 한국어에서는 ‘그곳’으로 압축해 중복을 줄였습니다.
theological_decisions:
- issue: 하나님의 심판과 자비를 구하는 탄원문에서 θυμός의 한국어 강도
  chosen_reading: ‘분노’로 옮겨 심판적 긴장을 분명히 드러냈습니다.
  alternative_readings:
  - 진노
  - 노여움
  rationale: 문맥상 단순 감정이 아니라 언약 위반에 대한 심판적 분노를 구체적으로 가리키므로, 현대어로도 신학적 무게를 유지하는 표현을 택했습니다.
  doctrine_reference: 구약 탄원과 심판 언어의 직역 원리
- issue: ‘흩으신’의 주어를 하나님으로 분명히 드러낼지 여부
  chosen_reading: ‘우리가 흩으신 그곳’으로 두어, 원문의 주어가 이어지는 문맥상 하나님임을 문장 흐름 안에서 읽히게 했습니다.
  alternative_readings:
  - 우리를 흩으신 그곳
  - 우리를 거기 흩으신 곳
  rationale: 원문은 관계대명사절로 흩으심의 주체를 하나님께 돌리며, 이를 한국어에서도 유지해야 바룩서의 포로 신학이 흐려지지 않습니다.
  doctrine_reference: 포로와 흩으심에 대한 하나님의 주권
