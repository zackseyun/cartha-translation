  yaml_path: translation/deuterocanon/baruch/002/022.yaml
  text: And if you do not listen to the voice of the Lord[a], to serve the king of Babylon[b],
  footnotes:
  - marker: a
    text: Or 'heed the voice of the Lord'; the Greek idiom can carry the sense of obedience, not mere hearing.
    reason: lexical_alternative
  - marker: b
    text: Literally 'to work for the king of Babylon'; here the sense is 'to serve' him.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 만일 여러분이 바빌론 왕을 섬기라는 주님의 음성[a]에 귀를 기울이지 않으면,[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주님의 음성을 듣다’로 옮길 수 있습니다. 이 그리스어 관용구는 단순히 듣는 것보다 순종의 뜻을 포함할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘바빌론 왕을 위해 일하다’입니다. 여기서는 그 뜻이 ‘섬기다’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν μὴ ἀκούσητε
  english_pob_choice: if you do not listen
  chosen_korean: 만일 여러분이 ... 귀를 기울이지 않으면
  alternatives_korean:
  - 만일 여러분이 ... 듣지 않으면
  - 만일 여러분이 ... 순종하지 않으면
  lexicon: BDAG
  rationale: ἀκούω는 여기서 단순 청취보다 ‘귀를 기울여 듣다’의 의미가 자연스럽고, 문맥상 함의된 순종을 너무 앞서서 풀지 않도록 했습니다.
- source_word: τῆς φωνῆς
  english_pob_choice: the voice
  chosen_korean: 음성
  alternatives_korean:
  - 목소리
  - 소리
  - 명령
  lexicon: BDAG
  rationale: φωνή는 문자적으로 ‘소리/음성’이므로, ‘주님의 음성’으로 옮겨 성경적 표현을 살리되 ‘명령’으로 평탄화하지 않았습니다.
- source_word: Κυρίου
  english_pob_choice: the Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주
  - 하나님
  lexicon: BDAG
  rationale: κύριος는 본문에서 하나님을 가리키므로 POB의 기본 대응인 ‘주님’을 사용해 한국어 성경 문체에 자연스럽게 맞췄습니다.
- source_word: ἐργάσασθαι
  english_pob_choice: to serve
  chosen_korean: 섬기기 위해
  alternatives_korean:
  - 일하기 위해
  - 일하도록
  - 봉사하기 위해
  lexicon: LSJ
  rationale: 직역하면 ‘일하다’이지만, 여기서는 바빌론 왕에게 대한 종속적 행위를 가리키므로 영어 POB의 ‘to serve’에 맞춰 ‘섬기다’로 옮겼습니다.
theological_decisions:
- issue: ἀκούω의 내포된 순종을 본문에 얼마나 드러낼지
  chosen_reading: 본문은 ‘주님의 음성에 귀를 기울이지 않으면’으로 유지하고, 순종의 함의는 독자가 읽도록 남겨 둡니다.
  alternative_readings:
  - ‘주님께 순종하지 않으면’
  - ‘주님의 음성을 듣지 않으면’
  rationale: 본문의 언어는 청취의 관용구이면서 동시에 순종을 함의하지만, 그 긴장을 본문에서 과도하게 해소하지 않는 것이 원문에 더 가깝습니다.
  doctrine_reference: 'DOCTRINE.md: Preserve theological tension rather than resolve it; optimal equivalence'
