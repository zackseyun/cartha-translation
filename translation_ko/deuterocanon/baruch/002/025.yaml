  language: ko
  text: 보십시오. 그들은 낮의 더위와 밤의 서리에 내버려져 있으며, 혹독한 고통 가운데, 기근과 칼날과 유배[a] 가운데 죽었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
