  text: And behold[a], they have been exposed to the heat of the day and to the frost of the night; and they died in grievous sufferings, in famine and by the sword and in exile.
  footnotes:
  - marker: a
    text: Or 'in deportation' or 'in banishment'; the Greek literally refers to a sending away.
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오[a]. 그들은 낮의 더위와 밤의 서리 아래 내던져졌고, 혹독한 고통 가운데, 기근과 칼과 유배 가운데 죽었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘유배에’ ‘추방에’로도 옮길 수 있습니다. 그리스어는 문자적으로는 ‘보냄/내보냄’을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδού
  english_pob_choice: behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보아라
  - 보십시오
  lexicon: BDAG
  rationale: 청중의 주의를 끄는 감탄사이므로, 현대 문어체에서 자연스럽고 공손한 직접 호소인 ‘보십시오’로 옮겼습니다.
- source_word: ἐξεριμμένα
  english_pob_choice: have been exposed / have been cast out
  chosen_korean: 내던져졌고
  alternatives_korean:
  - 드러나 있었고
  - 버려졌고
  - 내쳐졌고
  lexicon: LSJ
  rationale: 시신이 바깥에 내던져져 날씨에 노출된 상태를 반영하려면 단순한 ‘노출되다’보다 수동적이고 거친 이미지를 살리는 ‘내던져졌고’가 적절합니다.
- source_word: τῷ καύματι τῆς ἡμέρας καὶ τῷ παγετῷ τῆς νυκτός
  english_pob_choice: to the heat of the day and to the frost of the night
  chosen_korean: 낮의 더위와 밤의 서리
  alternatives_korean:
  - 낮의 열기와 밤의 추위
  - 한낮의 뜨거움과 밤의 얼음서리
  lexicon: LSJ
  rationale: 평행 구조를 살리면서도 한국어에서 자연스러운 대조쌍으로 옮겼습니다. ‘서리’는 παγετός의 구체성을 유지합니다.
- source_word: ἐν πόνοις πονηροῖς
  english_pob_choice: in grievous sufferings
  chosen_korean: 혹독한 고통 가운데
  alternatives_korean:
  - 심한 고난 가운데
  - 비참한 고통 가운데
  - 괴로운 고통 가운데
  lexicon: BDAG
  rationale: πόνοις πονηροῖς의 중첩된 강도를 살리되, 한국어에서 중복감이 덜한 ‘혹독한 고통 가운데’로 압축했습니다.
- source_word: ἐν ἀποστολῇ
  english_pob_choice: in exile
  chosen_korean: 유배 가운데
  alternatives_korean:
  - 추방 가운데
  - 포로로 끌려간 가운데
  - 내쫓김 가운데
  lexicon: LSJ
  rationale: 문자적으로는 ‘보냄/내보냄’의 의미가 있으나, 문맥상 언약 저주의 결과로서의 강제 이주를 가리키므로 ‘유배’가 가장 정확합니다. English POB의 ‘exile’과도 대응됩니다.
theological_decisions:
- issue: ἐν ἀποστολῇ의 번역이 단순 이동인지, 심판으로 인한 추방인지
  chosen_reading: 유배
  alternative_readings:
  - 추방
  - 강제 이주
  - 보냄
  rationale: 이 구절은 전쟁·기근과 함께 공동체적 심판의 결과를 나열하므로, 단순한 ‘보냄’보다 역사적·신학적 현실을 드러내는 ‘유배’가 본문 의도를 잘 전달합니다.
  doctrine_reference: 언약 저주와 공동체적 심판의 현실을 흐리지 않도록, 문자적 뉘앙스보다 문맥적 의미를 보존합니다.
