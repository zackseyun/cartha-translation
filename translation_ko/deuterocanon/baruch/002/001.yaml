  source_fidelity: 현 초안은 문장의 핵심 관계를 잘못 연결합니다. 그리스어에서 ‘말씀하신’(ἐλάλησεν)은 ‘그 말씀’을 수식하며, ‘우리와 … 재판관들 … 왕들 … 통치자들 … 사람들을 거슬러’라는 모든 대상을 함께 받습니다. 초안은 이를 ‘우리에게 말씀하신’으로 옮기고, 끝에서 ‘말씀하신 그 말씀’을 반복하여, 각 집단에게 말씀하셨다는 구조처럼 보이게 합니다.
  naturalness: ‘우리에게 말씀하신 그 말씀을 … 사람들에게 말씀하신 그 말씀을’은 불필요한 반복과 병렬 관계의 혼선을 낳습니다. 수식절을 한 번만 두고 ‘거슬러’를 공통으로 적용하면 현대 한국어로도 명료하고 자연스럽습니다.
  terminology: ‘주님’, ‘재판관들’, ‘왕들’, ‘통치자들’, ‘이스라엘과 유다의 사람들’은 적절합니다. ‘이루셨습니다’는 심판의 말씀이 실행되었다는 문맥을 자연스럽게 전달합니다. 각주에서는 선택된 표현을 대안으로 다시 제시하지 않고, ‘확증/확립’ 계열의 대안을 제시하는 편이 정확합니다.
