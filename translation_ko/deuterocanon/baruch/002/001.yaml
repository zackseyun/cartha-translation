    rationale: 문맥상 주님께서 여러 집단을 거슬러 하신 심판의 말씀을 이루셨다는 뜻입니다. ‘에게’는 수혜자·수신자 방향으로 읽혀 원문의 심판 대상을 보존하지 못합니다.
