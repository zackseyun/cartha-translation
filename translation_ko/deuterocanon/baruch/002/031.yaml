    text: 또는 ‘듣는 귀들’입니다. 그리스어 구문은 문자적으로 ‘듣는 귀들’이며, 귀가 응답하도록 만들어졌다는 뜻을 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: γνώσονται
  english_pob_choice: they will know
  chosen_korean: 알게 될 것입니다
  alternatives_korean:
