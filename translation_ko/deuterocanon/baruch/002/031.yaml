theological_decisions:
- issue: 여호와/κύριος의 번역
  chosen_reading: κύριος를 이 본문에서 야훼로 옮겨, ‘내가 자기들의 하나님’이라는 관계 진술과 결합된 신적 호칭을 드러냈습니다.
  alternative_readings:
  - 주님
  - 주
  rationale: 여기서 κύριος는 단순한 ‘주인’보다 히브리 성호에 대응하는 언약적 호칭으로 기능하므로, 프로젝트 기본값에 따라 야훼를 사용했습니다.
  doctrine_reference: POB glossary default for יהוה / YHWH
