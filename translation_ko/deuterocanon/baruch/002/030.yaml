translation:
  language: ko
  text: 내가 알았기 때문입니다. 그들이 나에게 결코 듣지 않을 것을 알았기 때문입니다. 그들은 목이 뻣뻣한 백성이기 때문입니다. 그러나 그들의 포로 생활의 땅에서 그들은 자기 마음으로 돌아올 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그들은 자기 마음으로 돌아올 것입니다’입니다. 한국어에서는 내적 전환과 반성을 자연스럽게 드러내기 위해 ‘자기 마음으로 돌아오다’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔγνων
  english_pob_choice: I knew
  chosen_korean: 내가 알았습니다
  alternatives_korean:
  - 내가 알게 되었습니다
  - 내가 인식했습니다
  lexicon: BDAG
  rationale: 과거 인식의 완료를 자연스러운 서술체로 옮겼습니다. 화자의 선행 지식을 분명히 드러내되, 과도한 해석은 피했습니다.
- source_word: οὐ μὴ ἀκούσωσίν μου
  english_pob_choice: would certainly not listen to me
  chosen_korean: 나에게 결코 듣지 않을 것을
  alternatives_korean:
  - 나에게 전혀 듣지 않을 것을
  - 나의 말을 반드시 듣지 않을 것을
  lexicon: BDAG
  rationale: οὐ μή의 강한 부정을 ‘결코’로 살리고, ἀκούω의 청종 의미를 ‘듣다’로 보존했습니다.
- source_word: σκληροτράχηλός
  english_pob_choice: stiff-necked
  chosen_korean: 목이 뻣뻣한
  alternatives_korean:
  - 완고한
  - 목이 굳은
  lexicon: LEH
  rationale: 성경적 비유를 그대로 살리기 위해 직역에 가까운 ‘목이 뻣뻣한’을 택했습니다. ‘완고한’보다 형상성이 더 분명합니다.
- source_word: ἐπιστρέψουσιν ἐπὶ καρδίαν αὐτῶν
  english_pob_choice: they will return to their heart
  chosen_korean: 자기 마음으로 돌아올 것입니다
  alternatives_korean:
  - 자기 마음에로 돌아올 것입니다
  - 마음에 두게 될 것입니다
  - 자기 마음에 돌아설 것입니다
  lexicon: LEH
  rationale: 문자적으로는 ‘마음으로 돌아오다’이지만, 한국어에서는 ‘자기 마음으로 돌아오다’가 가장 자연스럽게 내적 회심/반성을 드러냅니다. 영어 주석이 지적한 관용어의 긴장을 과도하게 해석하지 않도록 했습니다.
- source_word: ἐν γῇ ἀποικισμοῦ αὐτῶν
  english_pob_choice: in the land of their exile
  chosen_korean: 그들의 포로 생활의 땅에서
  alternatives_korean:
  - 그들의 유배지에서
  - 그들의 포로지에서
  - 그들의 포로 된 땅에서
  lexicon: LEH
  rationale: ἀποικισμός의 맥락상 추방·이주가 포함된 포로 상태를 가리키므로, 바빌론 포로를 떠올리게 하는 한국어로 옮겼습니다. ‘유배’보다 공동체적 포로성을 더 분명히 드러냅니다.
theological_decisions:
- issue: ‘마음으로 돌아오다’의 해석 강도
  chosen_reading: 주된 본문에서는 내적 전환을 보존하되, 명시적으로 ‘회개하다’라고 풀지는 않았습니다.
  alternative_readings:
  - 그들은 회개할 것입니다
  - 그들은 마음에 새길 것입니다
  rationale: 그리스어는 ‘돌아오다/되돌아오다’와 ‘마음’의 결합을 사용하며, 직접적인 회개 동사를 쓰지 않습니다. 따라서 은유를 유지하면서도 회개적 함의를 읽을 수 있게 했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 3, 5
