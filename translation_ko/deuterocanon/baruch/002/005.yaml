  lexicon: BDAG
  rationale: κύριος는 본 번역의 기본 용례에 따라 '주님'으로 옮기되, 하나님과의 병렬을 자연스럽게 유지했습니다.
- source_word: πρὸς τὸ μὴ ἀκούειν τῆς φωνῆς αὐτοῦ
  english_pob_choice: by not listening to his voice
  chosen_korean: 그의 음성에 귀 기울이지 않았기 때문입니다
  alternatives_korean:
  - 그의 음성을 듣지 않았기 때문입니다
  - 그의 음성에 순종하지 않았기 때문입니다
  lexicon: BDAG
  rationale: '''듣다''의 관용적 의미인 순종을 놓치지 않되, 본문이 말하는 ''음성'' 이미지를 유지하기 위해 ''귀 기울이다''를 선택했습니다.'
theological_decisions:
- issue: ‘위/아래’의 공간 대비가 갖는 낮아짐의 의미
  chosen_reading: ‘아래가 되고 위가 되지 않았다’로 옮겨 공간 대비와 수치/낮아짐의 함의를 함께 살렸습니다.
  alternative_readings:
  - ‘낮아지고 높아지지 않았다’
  - ‘아래에 있고 위에 있지 않았다’
  rationale: 본문의 표현은 단순 위치가 아니라 언약적 저주와 연결되는 상태 전환을 시사하므로, 은유를 약화하지 않고 보존했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
- issue: ‘듣다’와 ‘순종하다’의 긴장
  chosen_reading: ‘귀 기울이지 않았다’로 직역성과 의미를 함께 유지했습니다.
  alternative_readings:
  - ‘순종하지 않았다’
  - ‘듣지 않았다’
  rationale: 히브리적 성경 언어에서 '음성에 듣다'는 순종을 포함하지만, 본문이 직접 말하는 동사는 '듣다'이므로 관용을 너무 빨리 해소하지 않았습니다.
  doctrine_reference: Translation philosophy §§1, 6
