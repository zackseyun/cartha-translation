base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/002/005.yaml
  text: and they became beneath and not above[b][a], because we sinned against the Lord our God by not listening to his voice.
  footnotes:
  - marker: a
    text: Or 'below and not above'; the Greek uses a spatial contrast that also conveys lowered status or humiliation.
    reason: lexical_alternative
  - marker: b
    text: '''Listening to his voice'' is a biblical idiom that includes the sense of obeying him.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 아래에 있게 되었고 위에 있지 않게 되었습니다.[a] 이는 우리가 주 우리 하나님께 죄를 지어 그의 음성에 귀 기울이지 않았기 때문입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘아래가 되었고 위가 되지 않았다’. 그리스어는 공간적 대비를 사용하면서도 낮아진 지위와 굴욕을 함께 드러냅니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그의 음성에 귀 기울이다’는 성경적 관용구로, 그의 말씀을 듣고 따르는 순종의 의미를 포함합니다.
    reason: lexical_alternative
