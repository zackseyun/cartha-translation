base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/002/018.yaml
  text: But the soul that is grieved over its great misery[a], that goes about bent over and weak, and the eyes that are failing and the soul that is hungry—these will give you glory and righteousness[b], O Lord.
  footnotes:
  - marker: a
    text: Or 'over the greatness of its misery.' The Greek phrase is compressed and may refer more literally to 'the greatness' of the affliction.
    reason: lexical_alternative
  - marker: b
    text: Or 'will give you glory and justice.'
    reason: alternative_reading
translation:
  language: ko
  text: 그러나 그 큰 고난으로 슬퍼하는 영혼[a], 구부정하게 다니며 힘이 빠진 자, 눈이 침침해지고 배고픈 영혼은 주님, 주님께 영광과 의[b]를 드릴 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 비참함의 크기로’. 그리스어 표현은 압축되어 있으며, 더 문자적으로는 ‘그 재앙의 크기’에 가깝게 읽힐 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘정의’.
    reason: alternative_reading
lexical_decisions:
- source_word: ψυχή
  english_pob_choice: soul
  chosen_korean: 영혼
  alternatives_korean:
  - 마음
  - 생명
  - 자기
  lexicon: BDAG
  rationale: 반복되는 ψυχή를 인격의 내적 중심을 가리키는 말로 보아 ‘영혼’으로 옮겼습니다. 시적·탄원적 어조를 살리면서도 현대 한국어에서 자연스럽습니다.
- source_word: λυπουμένη
  english_pob_choice: is grieved
  chosen_korean: 슬퍼하는
  alternatives_korean:
  - 근심하는
  - 비통해하는
  - 괴로워하는
  lexicon: BDAG
  rationale: 지속적인 슬픔과 고통의 상태를 나타내므로 현재분사 느낌을 살려 ‘슬퍼하는’으로 옮겼습니다.
- source_word: ἐπὶ τὸ μέγεθος
  english_pob_choice: over its great misery
  chosen_korean: 그 큰 고난으로
  alternatives_korean:
  - 그 고난의 크기로
  - 그 엄청난 재앙 때문에
  - 그 비참함의 크기로
  lexicon: BDAG
  rationale: 그리스어가 압축되어 있어 앞뒤 문맥의 쇠약, 굶주림, 눈의 쇠약과 함께 ‘큰 고난/비참’에 대한 슬픔으로 풀었습니다. 과도한 해석을 피하면서도 의미를 드러냅니다.
- source_word: κύπτον καὶ ἀσθενοῦν
  english_pob_choice: bent over and weak
  chosen_korean: 구부정하게 다니며 힘이 빠진
  alternatives_korean:
  - 구부러져 있으며 약한
  - 몸을 굽힌 채 힘없는
  - 굽어지고 연약한
  lexicon: LSJ
  rationale: 몸의 쇠약과 비틀린 걸음을 함께 보여 주므로 ‘구부정하게 다니며 힘이 빠진’으로 옮겨 상태와 동작을 모두 살렸습니다.
- source_word: οἱ ὀφθαλμοὶ οἱ ἐκλείποντες
  english_pob_choice: the eyes that are failing
  chosen_korean: 눈이 침침해지고
  alternatives_korean:
  - 눈이 감겨 가고
  - 눈이 쇠하여지고
  - 눈이 사그라지고
  lexicon: LSJ
  rationale: ἐκλείπω의 ‘기운이 빠지다, 꺼져 가다’는 뜻을 눈의 시력 쇠퇴로 자연스럽게 풀어 한국어 관용에 맞게 옮겼습니다.
- source_word: δικαιοσύνην
  english_pob_choice: righteousness
  chosen_korean: 의
  alternatives_korean:
  - 정의
  - 공의
  - 의로움
  lexicon: BDAG
  rationale: 프로젝트 기본값에 따라 δικαιοσύνη를 ‘의’로 옮겼습니다. 여기서는 하나님께 돌려 드리는 올바름/의로움을 가리키므로 짧고 직설적인 표현이 가장 적절합니다.
theological_decisions:
- issue: 하나님께 드리는 응답으로서 δόξαν καὶ δικαιοσύνην의 의미
  chosen_reading: ‘영광과 의’를 하나님께 드리는 것으로 옮겼습니다.
  alternative_readings:
  - ‘영광과 정의’
  - ‘영광과 의로움’
  rationale: 문맥은 낮아진 자들의 입을 통해 하나님께 찬양과 올바름을 돌려 드리는 장면입니다. δικαιοσύνη는 원문과 프로젝트 기준을 따라 ‘의’로 유지하되, 필요하면 각주에서 ‘정의’ 가능성을 열어 둘 수 있습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: δικαιοσύνη → 의; 대안 ‘정의’는 주석으로 보존'
