theological_decisions:
- issue: 하나님께 드리는 응답으로서 δόξαν καὶ δικαιοσύνην의 의미
  chosen_reading: ‘영광과 의’를 하나님께 드리는 것으로 옮겼습니다.
  alternative_readings:
  - ‘영광과 정의’
  - ‘영광과 의로움’
  rationale: 문맥은 낮아진 자들의 입을 통해 하나님께 찬양과 올바름을 돌려 드리는 장면입니다. δικαιοσύνη는 원문과 프로젝트 기준을 따라 ‘의’로 유지하되, 필요하면 각주에서 ‘정의’ 가능성을 열어 둘 수 있습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: δικαιοσύνη → 의; 대안 ‘정의’는 주석으로 보존'
