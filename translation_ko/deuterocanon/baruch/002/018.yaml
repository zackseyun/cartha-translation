base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/002/018.yaml
  text: But the soul that is grieved over its great misery[a], that goes about bent over and weak, and the eyes that are failing and the soul that is hungry—these will give you glory and righteousness[b], O Lord.
  footnotes:
  - marker: a
    text: Or 'over the greatness of its misery.' The Greek phrase is compressed and may refer more literally to 'the greatness' of the affliction.
    reason: lexical_alternative
  - marker: b
    text: Or 'will give you glory and justice.'
    reason: alternative_reading
translation:
  language: ko
  text: 그러나 큰 고난으로 슬퍼하며 몸을 굽히고 쇠약한 채 걷는 영혼[a]과 기력이 다해 가는 눈과 굶주린 영혼이 주님께 영광과 의[b]를 돌릴 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 고난의 크기 때문에’. 그리스어 표현은 압축되어 있으며, 문자적으로는 ‘그 크기 때문에’라고 할 수 있습니다. 무엇의 크기인지는 문맥에서 보충됩니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘정의’.
    reason: alternative_reading
