base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/002/006.yaml
  text: To the Lord our God belongs righteousness[a], but to us and to our fathers belongs shame of face[b], as it is this day.
  footnotes:
  - marker: a
    text: Or 'justice.' The Greek δικαιοσύνη can denote both righteousness and justice; here the main text keeps 'righteousness' per project default.
    reason: lexical_alternative
  - marker: b
    text: Literally 'shame of face,' an idiom for public disgrace or humiliation.
    reason: cultural_note
translation:
  language: ko
  text: 우리 하나님 주님께는 의가 있고, 우리와 우리 조상들에게는 오늘날과 같이 얼굴의 수치가 있습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘정의’. 그리스어 δικαιοσύνη는 ‘의’와 ‘정의’ 둘 다를 뜻할 수 있으나, 본문은 프로젝트 기본값에 따라 ‘의’로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘얼굴의 수치’입니다. 이는 공개적 굴욕이나 수치를 가리키는 관용구입니다.
    reason: cultural_note
