translation:
  language: ko
  text: 주님, 우리 하나님이시여, 주님의 모든 관대함과 주님의 큰 긍휼에 따라 우리에게 행하셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘관용’. 그리스어 ἐπιεικία는 너그러움, 관대함, leniency의 뜻을 지닐 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘자비’. 그리스어 οἰκτειρμός는 긍휼, 자비, 연민의 뜻을 지닐 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐποίησας εἰς ἡμᾶς
  english_pob_choice: you have dealt with us
  chosen_korean: 우리에게 행하셨습니다
  alternatives_korean:
  - 우리에게 하셨습니다
  - 우리에게 대하셨습니다
  lexicon: BDAG
  rationale: 구문상 ‘~에게 행하다/대하다’의 뜻을 자연스럽게 살려, 완료된 하나님의 처우를 한국어로 간결하게 옮겼습니다.
- source_word: Κύριε ὁ θεὸς ἡμῶν
  english_pob_choice: Lord our God
  chosen_korean: 주님, 우리 하나님이시여
  alternatives_korean:
  - 주님, 우리 하나님
  - 주여, 우리 하나님이시여
  lexicon: BDAG
  rationale: 하나님께 직접 호칭하는 κύριε를 ‘주님’으로 옮기고, 기도문 호격을 살리기 위해 ‘우리 하나님이시여’로 정리했습니다.
- source_word: ἐπιεικίαν
  english_pob_choice: forbearance / gentleness
  chosen_korean: 관대함
  alternatives_korean:
  - 너그러움
  - 관용
  - 인자함
  lexicon: BDAG
  rationale: ἐπιείκεια의 leniency/clemency 성격을 살리되, 문맥상 하나님의 너그러이 용납하심을 현대 한국어에서 가장 자연스럽게 드러내는 표현으로 ‘관대함’을 택했습니다.
- source_word: οἰκτειρμόν τὸν μέγαν
  english_pob_choice: your great compassion
  chosen_korean: 주님의 큰 긍휼
  alternatives_korean:
  - 주님의 큰 자비
  - 주님의 큰 연민
  - 주님의 큰 불쌍히 여김
  lexicon: BDAG
  rationale: οἰκτειρμός의 자비/긍휼 의미를 보존하면서, 뒤의 μέγαν을 직설적으로 ‘큰’으로 살려 병렬 구조를 유지했습니다.
theological_decisions:
- issue: ἐπιεικία와 οἰκτειρμός의 이중 표현을 어떻게 구분할지
  chosen_reading: ‘관대함’과 ‘큰 긍휼’로 구분해 번역했습니다.
  alternative_readings:
  - 둘 다 ‘자비’로 통합
  - ‘관용’과 ‘긍휼’로 구분
  rationale: 그리스어 원문은 유사하지만 동일하지 않은 두 용어를 병렬로 사용하므로, 한국어에서도 의미를 겹치지 않게 구분해 원문의 수사적 풍성함을 보존했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 5
