base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/002/029.yaml
  text: If you do not listen to my voice[b][a], surely this great and vast multitude will be reduced to a few among the nations where I will scatter them there.
  footnotes:
  - marker: a
    text: Greek ἡ βόμβησις literally can denote a buzzing, roar, or tumult. Here it is rendered 'multitude' because the following phrase 'to a few among the nations' points to the people as a large population being diminished.
    reason: lexical_alternative
  - marker: b
    text: The Greek ends with a redundant locative expression, literally 'where I will scatter them there.' This translation preserves the emphasis with 'there,' though English would normally omit it.
    reason: lexical_alternative
translation:
  language: ko
  text: 만일 너희가 내 목소리를 듣지 않으면, 참으로 이 크고 수많은 무리는 내가 그들을 그곳에 흩어 놓을 그 민족들 가운데서 적은 수가 될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 ἡ βόμβησις는 문자적으로 ‘웅성거림, 소리, 소란’ 같은 뜻을 가질 수 있습니다. 여기서는 뒤의 ‘적은 수가 될 것입니다’라는 표현 때문에 사람들의 큰 집단을 가리키는 말로 옮겼습니다.
    reason: lexical_alternative
