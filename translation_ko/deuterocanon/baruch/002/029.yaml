  - 이방 민족들 가운데서
  lexicon: LEH
  rationale: 바룩의 포로·흩어짐 문맥에서 ἔθνη는 이스라엘을 둘러싼 열국을 가리키므로, 신학적으로 더 두드러진 ‘이방’보다 중립적인 ‘민족들’이 적절합니다.
theological_decisions:
- issue: βόμβησις의 문자적 소리 의미와 문맥상 집단 의미
  chosen_reading: 소리 어휘를 그대로 살리기보다, 문맥이 요구하는 ‘큰 무리’로 이해해 인구의 대폭 감소를 말하는 경고로 읽었습니다.
  alternative_readings:
  - ‘큰 소란’ 또는 ‘웅성거림’으로 읽어 음향 이미지를 전면화하기
  rationale: 뒤이어 ‘얼마 되지 못할’과 ‘민족들 가운데서’가 이어지므로, 본문은 소리보다 사람들의 수적 축소를 뜻하는 것으로 보는 것이 가장 자연스럽습니다.
  doctrine_reference: 문맥 우선의 의미 결정을 유지하되, 원문이 가진 긴장(문자적 소리 어휘와 집단 의미)을 해소해 버리지 않습니다.
