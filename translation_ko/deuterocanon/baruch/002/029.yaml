  english_pob_choice: to my voice
  chosen_korean: 내 목소리를
  alternatives_korean:
  - 내 음성을
  - 내가 말하는 것을
  lexicon: LEH
  rationale: 히브리적 관용구를 살려 하나님의 직접 발화를 자연스러운 한국어로 유지하되, ‘목소리’로 번역해 직설성을 보존했습니다.
- source_word: ἡ βόμβησις ἡ μεγάλη ἡ πολλὴ αὕτη
  english_pob_choice: this great and vast multitude
  chosen_korean: 이 크고 많은 무리
  alternatives_korean:
  - 이 크고 광대한 무리
  - 이 크고 수많은 무리
  - 이 큰 소란
  lexicon: LSJ
  rationale: βόμβησις는 문자적으로는 소리·웅성거림 계열이지만, 뒤의 ‘민족들 가운데서 얼마 되지 못할’과 연결되므로 사람들의 큰 집단을 가리키는 다수 의미로 이해해 ‘무리’로 옮겼습니다.
- source_word: ἀποστρέψει εἰς μικρὰν
  english_pob_choice: will be reduced to a few
  chosen_korean: 얼마 되지 못할 것입니다
  alternatives_korean:
  - 적은 수가 될 것입니다
  - 몇 사람밖에 남지 못할 것입니다
  lexicon: LEH
  rationale: 작아짐의 결과를 한국어 관용으로 풀어, 양적 감소를 분명히 하면서도 원문의 압축된 표현을 과도하게 해설하지 않았습니다.
- source_word: ἐν τοῖς ἔθνεσιν
  english_pob_choice: among the nations
  chosen_korean: 그 민족들 가운데서
  alternatives_korean:
