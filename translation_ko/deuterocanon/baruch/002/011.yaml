- from: 그리고 이제, 이스라엘의 주 하나님이시여, 주께서는 강한 손과 표징들과 놀라운 일들과 큰 능력과 높이 든 팔로 주의 백성을 이집트 땅에서 이끌어 내시고, 오늘날과 같이 주 자신을 위해 이름을 지으셨습니다.[a]
  to: 그리고 이제[a], 이스라엘의 하나님이신 주님이시여, 주께서는 강한 손과 표징들과 놀라운 일들과 큰 능력과 높이 든 팔로 주의 백성을 이집트 땅에서 이끌어 내시고, 오늘날까지 그러하듯이 주 자신의 명성을 드높이셨습니다.
  rationale: The revision corrects the Korean rendering of the Greek idiom ‘made for yourself a name’ while retaining its reflexive sense and the continuing-present force of ‘as at this day.’ It also makes the vocative title’s syntax clear and moves the existing lexical footnote anchor to the relevant expression at the start of the verse.
