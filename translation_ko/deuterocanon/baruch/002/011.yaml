base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/002/011.yaml
  text: And now[a], O Lord, God of Israel, who brought your people out of the land of Egypt with a mighty hand, with signs and wonders and with great power and with an uplifted arm, and made for yourself a name, as at this day,
  footnotes:
  - marker: a
    text: Or 'an outstretched arm.' The Greek here reads 'uplifted/high arm' (βραχίονι ὑψηλῷ), differing from the more familiar exodus wording in some passages.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 이제[a], 이스라엘의 하나님이신 주님이시여, 주께서는 강한 손과 표징들과 놀라운 일들과 큰 능력과 높이 든 팔로 주의 백성을 이집트 땅에서 이끌어 내시고, 오늘날까지 그러하듯이 주 자신의 명성을 드높이셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘뻗은 팔’. 이곳의 그리스어는 더 익숙한 출애굽 표현과 달리 ‘높이 든/높은 팔’(βραχίονι ὑψηλῷ)이라고 되어 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Κύριε ὁ θεὸς Ἰσραήλ
  english_pob_choice: Lord, God of Israel
  chosen_korean: 이스라엘의 주 하나님이시여
  alternatives_korean:
  - 이스라엘의 주님, 하나님이시여
  - 이스라엘의 하나님이시여
  lexicon: BDAG
  rationale: 직접 호칭이므로 ‘-이시여’로 살리고, κύριος를 ‘주’로, ὁ θεὸς Ἰσραήλ을 ‘이스라엘의 하나님’으로 옮겨 호칭 구조를 자연스럽게 유지했습니다.
- source_word: ἐν χειρὶ κραταιῷ
  english_pob_choice: with a mighty hand
  chosen_korean: 강한 손으로
  alternatives_korean:
  - 능력 있는 손으로
  - 힘센 손으로
  lexicon: BDAG
  rationale: 출애굽 구문을 따라 ‘손’의 은유를 유지하되, κραταιῷ의 힘찬/강력한 뉘앙스를 ‘강한’으로 간결하게 살렸습니다.
- source_word: σημείοις καὶ ἐν τέρασιν καὶ ἐν δυνάμει μεγάλῃ καὶ ἐν βραχίονι ὑψηλῷ
  english_pob_choice: with signs and wonders and with great power and with an uplifted arm
  chosen_korean: 표징들과 놀라운 일들과 큰 능력과 높이 든 팔로
  alternatives_korean:
  - 기적들과 이적들과 큰 능력과 높이 든 팔로
  - 표징들과 기이한 일들과 큰 힘과 높이 든 팔로
  lexicon: BDAG
  rationale: σημεῖα/τέρατα의 표준적 대비를 ‘표징’과 ‘놀라운 일’로 구분해 중첩된 수사 효과를 보존했고, βραχίων ὑψηλός는 영어 POB의 주석 취지를 따라 ‘높이 든 팔’로 직역 쪽을 택했습니다.
- source_word: ἐποίησας σεαυτῷ ὄνομα
  english_pob_choice: made for yourself a name
  chosen_korean: 주 자신을 위해 이름을 지으셨습니다
  alternatives_korean:
  - 주를 위해 이름을 만드셨습니다
  - 주께서 자기 이름을 세우셨습니다
  lexicon: BDAG
  rationale: 히브리어적 관용구를 한국어로 자연스럽게 옮기되, 자기 이름/명성을 세우는 의미를 보존하기 위해 ‘이름을 지으셨습니다’로 다소 직역성 있게 처리했습니다.
- source_word: ὡς ἡ ἡμέρα αὕτη
  english_pob_choice: as at this day
  chosen_korean: 오늘날과 같이
  alternatives_korean:
  - 이날까지
  - 이 날과 같이
  lexicon: BDAG
  rationale: 현재까지 지속되는 상태를 가리키는 관용 표현이므로, 현대 한국어로는 ‘오늘날과 같이’가 가장 자연스럽고 문맥에 맞습니다.
theological_decisions:
- issue: 출애굽 기억을 둘러싼 누적적 표현의 보존
  chosen_reading: 강한 손, 표징들, 놀라운 일들, 큰 능력, 높이 든 팔을 한 번에 쌓아 올려 하나님의 구원 행위를 강조하는 구조를 그대로 살렸습니다.
  alternative_readings:
  - ‘강한 손과 놀라운 표적들’처럼 묶어 부드럽게 정리할 수 있습니다.
  - 몇 개의 수식을 압축해 한국어 흐름을 매끈하게 할 수 있습니다.
  rationale: 본문은 출애굽 전승의 누적적 수사를 의도적으로 재현하므로, 매끈하게 압축하기보다 반복과 병렬을 유지하는 것이 원문의 신학적 무게를 더 잘 전달합니다.
  doctrine_reference: 'Translation philosophy: preserve source meaning and theological weight without paraphrase.'
