base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/002/016.yaml
  text: Lord[a], look down from your holy house and take notice of us; incline your ear, Lord, and hear.
  footnotes:
  - marker: a
    text: Or 'from your holy temple.' The Greek literally says 'from your holy house.'
    reason: lexical_alternative
translation:
  language: ko
  text: 주님[a], 주님의 거룩한 집에서 굽어보시고 우리를 살펴 주십시오. 주님, 귀를 기울이시고 들어 주십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주님의 거룩한 성전에서’. 그리스어는 문자적으로 ‘주님의 거룩한 집’이라고 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Κύριε
  english_pob_choice: Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주여
  - 오 주님
  lexicon: BDAG
  rationale: 호격의 κύριε를 한국어 기도문에서 자연스러운 직접 호칭인 ‘주님’으로 옮겼습니다. ‘주여’는 더 전통적이지만 현대 합쇼체 문맥에서는 덜 자연스럽습니다.
- source_word: κάτιδε
  english_pob_choice: look down
  chosen_korean: 굽어보시고
  alternatives_korean:
  - 내려다보시고
  - 살펴보시고
  lexicon: LSJ
  rationale: κατά가 더해진 ‘위에서 아래로 바라봄’의 뉘앙스를 살려, 단순한 시선보다 기도문에 어울리는 ‘굽어보시고’로 옮겼습니다.
- source_word: ἐκ τοῦ οἴκου τοῦ ἁγίου σου
  english_pob_choice: from your holy house
  chosen_korean: 주님의 거룩한 집에서
  alternatives_korean:
  - 주님의 거룩한 성전에서
  - 주님의 거룩한 집으로부터
  lexicon: LSJ
  rationale: οἶκος의 문자적 의미를 따라 ‘집’을 유지했고, ‘거룩한’으로 수식해 신적 거처라는 점을 드러냈습니다. 영어 POB의 ‘house’ 선택도 반영했습니다.
- source_word: ἐννόησον εἰς ἡμᾶς
  english_pob_choice: take notice of us
  chosen_korean: 우리를 살펴 주십시오
  alternatives_korean:
  - 우리에게 주의를 기울여 주십시오
  - 우리를 눈여겨보아 주십시오
  lexicon: BDAG
  rationale: ἐννόησον의 적극적 관심·유의의 의미를 살려, 단순 인지보다 청원에 응답하는 태도를 드러내는 ‘살펴 주십시오’로 옮겼습니다.
- source_word: κλῖνον… τὸ οὖς σου
  english_pob_choice: incline your ear
  chosen_korean: 귀를 기울이시고
  alternatives_korean:
  - 귀를 굽히시고
  - 귀를 돌리시고
  lexicon: BDAG
  rationale: 관용적 기도 표현을 한국어에서도 자연스럽게 재현하기 위해 ‘귀를 기울이시고’를 선택했습니다. 직역보다 수용성이 높으면서도 비유는 보존합니다.
theological_decisions:
- issue: οἶκος를 ‘집’으로 유지할지 ‘성전’으로 해석할지
  chosen_reading: ‘거룩한 집’으로 유지했습니다.
  alternative_readings:
  - ‘거룩한 성전’으로 해석
  - ‘거룩한 처소’로 완화
  rationale: 본문은 ναός가 아니라 οἶκος를 쓰므로, 해석어를 앞세우기보다 원문 어휘를 살려 하나님의 거처를 보다 직접적으로 표현했습니다. 이는 영어 POB의 ‘holy house’ 판단과도 일치합니다.
  doctrine_reference: Translation philosophy §§1, 5
- issue: 기도 청원의 문체를 얼마나 높일지
  chosen_reading: 합쇼체의 직접 청원형으로 정리했습니다.
  alternative_readings:
  - 더 고어적인 ‘굽어보옵소서’
  - 평서형 완화
  rationale: 본문은 간청의 기도이므로 높임을 유지하되, 현대 독자가 바로 읽을 수 있는 합쇼체로 조정했습니다. 다만 ‘굽어보시고 / 들어 주십시오’로 청원의 긴박함은 보존했습니다.
  doctrine_reference: Korean target style guidelines
