    rationale: κυριεύσουσιν αὐτῆς는 ‘그 땅을 다스릴 것이다’라는 뜻입니다. ‘거기서 그것을’은 불필요한 위치 정보를 보태고 ‘그것’의 지시 대상도 어색하게 만듭니다.
