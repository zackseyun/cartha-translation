base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/002/034.yaml
  text: and I will bring them back to the land that I swore to their fathers—to Abraham and Isaac and Jacob—and they will rule over it; and I will multiply them[a], and they will certainly not be diminished.
  footnotes:
  - marker: a
    text: Or 'they will possess it.' The Greek verb can denote exercising dominion or possessing by mastery; 'rule over it' was chosen as the more direct rendering of the verb.
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 그들을 내가 그들의 조상들, 곧 아브라함과 이삭과 야곱에게 맹세한 땅으로 돌아오게 하겠습니다. 그들은 그 땅을 다스릴 것이며, 나는 그들을 많게 하겠습니다. 그들은 결코 줄어들지 않을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 땅을 소유할 것이다.’ 이 동사는 ‘다스리다’ 또는 소유하여 지배한다는 뜻을 가질 수 있으므로, 여기서는 더 직접적인 ‘다스리다’를 택했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποστρέψω
  english_pob_choice: I will bring ... back
  chosen_korean: 돌아오게 하겠습니다
  alternatives_korean:
  - 되돌리겠습니다
  - 돌아오게 만들겠습니다
  lexicon: BDAG
  rationale: 목적지인 ‘땅으로’(εἰς τὴν γῆν)와 함께 이동의 결과를 자연스럽게 살리면서, 단순한 방향 전환보다 귀환의 의미를 분명히 나타냅니다.
- source_word: γῆν
  english_pob_choice: land
  chosen_korean: 땅
  alternatives_korean:
  - 나라
  - 땅(약속의 땅)
  lexicon: BDAG
  rationale: 족장들에게 맹세한 언약 문맥이므로 일반적인 ‘땅’이 가장 직접적이며, 필요 이상으로 해석을 덧붙이지 않습니다.
- source_word: κυριεύσουσιν
  english_pob_choice: they will rule over it
  chosen_korean: 그것을 다스릴 것이며
  alternatives_korean:
  - 그것을 지배할 것이며
  - 그것을 소유할 것이며
  lexicon: BDAG
  rationale: 주권적 통치의 동사를 한국어에서 가장 सीधे하게 옮기면 ‘다스리다’입니다. ‘소유하다’는 의미를 약화시킬 수 있어 본문의 강한 동사를 살렸습니다.
- source_word: πληθυνῶ
  english_pob_choice: I will multiply them
  chosen_korean: 그들을 번성하게 하겠고
  alternatives_korean:
  - 그들을 많게 하겠고
  - 그 수를 늘리겠고
  lexicon: BDAG
  rationale: 언약적 증식의 뉘앙스를 한국어 성경에서 자연스럽게 드러내는 표현으로, 단순 수적 증가보다 공동체의 번성을 함께 담습니다.
- source_word: οὐ μὴ σμικρυνθῶσιν
  english_pob_choice: they will certainly not be diminished
  chosen_korean: 결코 줄어들지 않게 하겠습니다
  alternatives_korean:
  - 결코 작아지지 않게 하겠습니다
  - 절대로 감소하지 않게 하겠습니다
  lexicon: BDAG
  rationale: οὐ μὴ의 강한 부정을 ‘결코’로, 수적 축소를 ‘줄어들다’로 옮겨 약속의 확실성을 한국어에서 자연스럽게 재현합니다.
theological_decisions:
- issue: 족장 언약의 맹세 표현 보존
  chosen_reading: ‘아브라함과 이삭과 야곱에게 맹세한 땅’으로 직역해 언약의 근거를 분명히 했습니다.
  alternative_readings:
  - ‘조상들에게 약속한 땅’으로 완화
  - ‘선조들에게 서약한 땅’으로 의역
  rationale: 본문은 회복의 근거를 하나님이 족장들에게 하신 맹세에 둡니다. ‘맹세한’은 이 언약적·서약적 무게를 가장 직접적으로 드러냅니다.
  doctrine_reference: DOCTRINE.md §§1, 4, 5
