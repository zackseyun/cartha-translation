translation:
  language: ko
  text: 온 땅이 주님께서 우리 하나님이심을 알도록, 이스라엘과 그 자손이 당신의 이름으로 일컬음을 받았기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면, ‘당신의 이름이 이스라엘과 그 자손 위에 불렸기 때문입니다.’ 또는 ‘이스라엘과 그 자손이 당신의 이름으로 불립니다.’ 그리스어 관용구는 하나님께 속함과 그분의 이름으로 불리는 정체성을 나타냅니다.
    reason: lexical_alternative
