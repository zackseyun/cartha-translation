  text: so that all the earth may know that you[a], Lord, are our God, because your name has been called upon Israel and upon his offspring.
  footnotes:
  - marker: a
    text: Or, 'your name has been invoked over Israel,' or more interpretively, 'Israel is called by your name.' The Greek idiom expresses belonging to and identification with God.
