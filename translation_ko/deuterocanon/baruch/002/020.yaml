lexical_decisions:
- source_word: ἐνῆκας
  english_pob_choice: you have brought ... upon
  chosen_korean: 내리셨습니다
  alternatives_korean:
  - 가져오셨습니다
  - 퍼부으셨습니다
  - 가해 주셨습니다
  lexicon: LSJ
  rationale: 문맥상 하나님의 심판이 우리에게 ‘임하게 하다’는 뜻이므로, 현대 한국어에서 자연스럽고 원인적 뉘앙스를 살리는 ‘내리셨습니다’를 택했습니다.
- source_word: θυμόν / ὀργήν
  english_pob_choice: wrath and your anger
  chosen_korean: 진노와 분노
  alternatives_korean:
  - 진노와 노여움
  - 분노와 진노
  - 노여움과 격노
  lexicon: BDAG
  rationale: 두 동의어를 하나로 평준화하지 않고, ‘진노’와 ‘분노’로 나누어 반복과 강도를 보존했습니다.
- source_word: ἐν χειρί
  english_pob_choice: by the hand of
  chosen_korean: 통해
  alternatives_korean:
  - 손으로
  - 손을 통해
  - 의 손으로
  lexicon: LSJ
  rationale: 직역형 ‘손으로’는 한국어에서 어색하므로, 예언자적 매개를 드러내는 관용적 표현 ‘통해’로 옮기되 원문의 중개 의미는 유지했습니다.
- source_word: παίδων ... τῶν προφητῶν
  english_pob_choice: your servants the prophets
  chosen_korean: 종들인 예언자들
  alternatives_korean:
  - 종들인 선지자들
  - 섬기는 자들인 예언자들
  - 종이신 예언자들
  lexicon: BDAG
  rationale: παῖς의 여기서는 ‘종/종사자’ 의미가 분명하므로 ‘종들인’으로 옮겼고, προφητῶν은 교회 전통어 ‘선지자’보다 현대 문어에 맞는 ‘예언자들’로 번역했습니다.
