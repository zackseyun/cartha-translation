  source_fidelity: 그리스어는 하나님께 직접 말하는 2인칭 단수(‘주님께서/주님이 … 하셨습니다’)이며, 심판의 두 표현과 예언자들을 통한 말씀의 매개를 병치합니다. 초안의 ‘그분께서 주님의’는 3인칭과 2인칭 호칭을 부자연스럽게 혼합하여 원문의 발화 대상을 흐립니다. 또한 ‘이는’은 원문의 인과 접속사 ὅτι를 충분히 반영하지 못합니다.
  naturalness: ‘주님께서 주님의 진노와 분노를’은 합쇼체 성경 문체에서 자연스럽고, ‘말씀하신 그대로’는 καθάπερ ἐλάλησας의 비교·일치 관계를 적절히 살립니다. ‘통하여’는 자연스러운 매개 표현입니다.
