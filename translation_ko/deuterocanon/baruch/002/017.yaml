  source_fidelity: 개정이 필요합니다. οὐχ οἱ ... δώσουσιν은 죽은 자들이 주님께 영광과 δικαίωμα를 ‘드리지 않을 것’이라는 미래 진술인데, 초안의 ‘드리지 못합니다’는 능력·불가능의 뜻을 더합니다. 또한 ᾅδης를 ‘스올’로 옮기면 히브리어 어휘와 혼동될 수 있으므로, 그리스어 원문의 지시 대상을 보존하는 ‘하데스’가 적절합니다.
  naturalness: ‘그들의 숨이 그들의 속에서 거두어진 자들’은 ‘그들의’의 반복과 ‘속에서 거두어지다’가 다소 부자연스럽습니다. ‘그들 속에서 숨을 빼앗긴 자들’로 다듬을 수 있습니다. δικαίωμα는 여기서 주님의 의로우심/정당함을 인정하는 뜻으로 이해되며, ‘의를 드리다’보다 ‘그분이 의로우심을 인정하다’가 현대 한국어에서 자연스럽습니다.
  terminology: ᾅδης는 ‘하데스’로 옮기고, πνεῦμα의 ‘숨’과 대안 ‘영’을 유지합니다. δικαίωμα의 가능한 ‘정의’는 각주로 보존하되, 본문에서는 문맥에 맞게 ‘그분이 의로우심을 인정하다’로 표현합니다.
  issues:
