  - severity: low
    issue: ‘의를 드리다’가 현대 한국어에서 의미 관계가 불분명합니다.
    rationale: δικαίωμα의 문맥상 의미인 주님의 의로우심 또는 정당함의 인정이 자연스럽게 전달되도록 표현할 필요가 있습니다.
