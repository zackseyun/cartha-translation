translation:
  language: ko
  text: “눈을 뜨고 보십시오. 스올에 있는 죽은 자들—그들의 숨이 그들의 속에서 거두어진 자들—은 주님께 영광과 의를 드리지 못합니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 영이 그들 안에서 거두어진 자들’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘주님께 영광과 정의를 드리지 못합니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄνοιξον ὀφθαλμούς σου καὶ ἴδε
  english_pob_choice: Open your eyes and see
  chosen_korean: “눈을 뜨고 보십시오”
  alternatives_korean:
  - “눈을 열고 보십시오”
  - “당신의 눈을 열고 보십시오”
  lexicon: LSJ
  rationale: 두 개의 명령형을 자연스러운 한국어로 압축하되, ἄνοιξον과 ἴδε의 직접적 촉구를 살렸습니다.
- source_word: ἐν τῷ ᾅδῃ
  english_pob_choice: in Hades
  chosen_korean: “스올에 있는”
  alternatives_korean:
  - “하데스에 있는”
  - “음부에 있는”
  lexicon: LSJ
  rationale: ᾅδης는 죽은 자들의 영역을 가리키므로, 본문 의미를 해치지 않으면서도 한국어 성경 번역에서 비교적 직접적인 ‘스올’을 택했습니다.
- source_word: ὧν ἐλήμφθη τὸ πνεῦμα αὐτῶν
  english_pob_choice: whose breath has been taken
  chosen_korean: “그들의 숨이 그들의 속에서 거두어진 자들”
  alternatives_korean:
  - “그들의 영이 그들 안에서 거두어진 자들”
  - “그들의 생기(숨)가 그들 속에서 빼앗긴 자들”
  lexicon: LSJ
  rationale: πνεῦμα는 이 죽음 문맥에서 ‘숨/생기’의 의미가 강하므로, 영어 POB의 선택을 따라 ‘숨’으로 옮기고, ἀπό τῶν σπλάγχνων αὐτῶν은 ‘그들의 속에서’로 구체화했습니다.
- source_word: δόξαν καὶ δικαίωμα
  english_pob_choice: glory and righteousness
  chosen_korean: “영광과 의를”
  alternatives_korean:
  - “영광과 정의를”
  - “영광과 의로움을”
  lexicon: LSJ
  rationale: δόξα는 ‘영광’이 가장 직접적이고, δικαίωμα는 여기서 하나님께 마땅히 돌려야 할 올바름/의의 인정이므로 ‘의’로 간결하게 살렸습니다.
theological_decisions:
- issue: πνεῦμα의 번역 범위
  chosen_reading: 이 구절에서는 인간의 생명-호흡으로 이해되는 ‘숨’으로 옮겼습니다.
  alternative_readings:
  - ‘영’
  - ‘생기’
  rationale: 죽은 자들이 더 이상 하나님께 응답하지 못한다는 대조가 중심이므로, πνεῦμα를 여기서는 영적 실체보다 생명 호흡으로 읽는 편이 문맥에 더 적합합니다. 다만 ‘영’ 해석 가능성은 남겨 두었습니다.
  doctrine_reference: 의미 범위를 문맥에 따라 보존
- issue: δικαίωμα의 신학적 뉘앙스
  chosen_reading: ‘의’
  alternative_readings:
  - ‘정의’
  - ‘의로움’
  rationale: 문맥상 하나님께 돌려야 할 마땅한 찬양과 올바름을 가리키므로, ‘의’가 가장 응축된 표현입니다. ‘정의’도 가능하지만 한국어에서 사회적 의미로 좁아질 우려가 있습니다.
  doctrine_reference: 핵심 용어의 일관성
