  text: And the Lord kept watch over the calamities and brought them upon us[b][a], because the Lord is righteous in all his works that he commanded us.
  footnotes:
  - marker: a
    text: Or 'the evils' or 'the disasters.' The Greek κακά here likely refers to calamities of judgment, not moral evil in the abstract.
    reason: lexical_alternative
  - marker: b
    text: Or 'just' instead of 'righteous.'
    reason: lexical_alternative
translation:
  language: ko
  text: 주님께서는 재앙들[a]을 주의 깊게 살피시고 그것들을 우리에게 내리셨습니다. 이는 주님께서 우리에게 명령하신 그분의 모든 일에 대하여 의로우시기[b] 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘악들’ 혹은 ‘재난들.’ 여기서 헬라어 κακά는 추상적인 도덕악이 아니라 심판의 재앙들을 가리킬 가능성이 큽니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘정의로우시다.’
    reason: lexical_alternative
