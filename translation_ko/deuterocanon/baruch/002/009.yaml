  language: en
  yaml_path: translation/deuterocanon/baruch/002/009.yaml
  text: And the Lord kept watch over the calamities and brought them upon us[b][a], because the Lord is righteous in all his works that he commanded us.
  footnotes:
  - marker: a
    text: Or 'the evils' or 'the disasters.' The Greek κακά here likely refers to calamities of judgment, not moral evil in the abstract.
    reason: lexical_alternative
  - marker: b
    text: Or 'just' instead of 'righteous.'
    reason: lexical_alternative
translation:
  language: ko
  text: 주님께서는 재앙들을 주의 깊게 살피시고 그것들을 우리에게 내리셨습니다[b][a]. 이는 주님께서 그분의 모든 일에 대하여, 곧 우리에게 명령하신 모든 일에 대하여 의로우시기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘악들’ 혹은 ‘재난들.’ 여기서 헬라어 κακά는 추상적 도덕악이 아니라 심판의 재앙들을 가리킬 가능성이 큽니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘의로우시다’ 대신 ‘공정하시다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγρηγόρησεν
  english_pob_choice: kept watch over
  chosen_korean: 주의 깊게 살피시고
  alternatives_korean:
  - 지켜보시고
  - 감시하셨고
  - 깨어 살피시고
  lexicon: LSJ
  rationale: 깨어 지켜본다는 능동적 의미를 살리되, 심판을 향한 하나님의 태도를 한국어로 자연스럽게 드러내기 위해 ‘주의 깊게 살피시고’로 옮겼습니다.
- source_word: ἐπὶ τοῖς κακοῖς
  english_pob_choice: over the calamities
  chosen_korean: 재앙들을
  alternatives_korean:
  - 악들을
  - 불행들을
  - 재난들을
  lexicon: LSJ
  rationale: 문맥상 도덕적 악이 아니라 심판으로 내리시는 재앙의 뜻이므로, 한국어에서도 의미를 분명히 하는 ‘재앙들’을 선택했습니다.
- source_word: δίκαιος
  english_pob_choice: righteous
  chosen_korean: 의로우시기
  alternatives_korean:
  - 의로우시기
  - 옳으시기
  - 정의로우시기
  lexicon: LSJ
  rationale: δικ- 계열의 표준 대응을 따라 하나님의 성품을 ‘의롭다’로 옮겼고, 심판 문맥에서도 신학적 울림을 유지했습니다.
- source_word: ἃ ἐνετείλατο ἡμῖν
  english_pob_choice: that he commanded us
  chosen_korean: 우리에게 명령하신
  alternatives_korean:
  - 우리에게 명령하신
  - 우리에게 명하신
  - 우리에게 분부하신
  lexicon: LSJ
  rationale: 상대절의 압축된 구조를 자연스럽게 풀어, 하나님이 이스라엘에게 명령하신 일들을 가리킨다는 점이 드러나도록 했습니다.
theological_decisions:
- issue: 재앙(κακά)을 하나님이 내리시는 것으로 말할 때의 표현 선택
  chosen_reading: ‘재앙들’로 옮겨 심판의 성격을 드러냈습니다.
  alternative_readings:
  - ‘악들’
  - ‘불행들’
  - ‘재난들’
  rationale: 본문은 하나님이 도덕적 악을 조장하신다는 뜻이 아니라, 언약적 심판으로 재앙을 내리신다는 뜻이므로, 그 긴장을 흐리지 않는 표현을 택했습니다.
  doctrine_reference: 언약 심판과 하나님의 의로우심을 함께 보존하는 번역 원칙
- issue: δίκαιος의 번역
  chosen_reading: ‘의로우시기’로 번역했습니다.
  alternative_readings:
  - ‘공의로우시기’
  - ‘옳으시기’
  rationale: 문맥이 하나님의 판결의 정당성을 말하므로, 전통적이면서도 본문 흐름에 맞는 ‘의롭다’를 사용했습니다.
  doctrine_reference: δικ- 계열은 기본적으로 ‘의/의롭다’로 대응
