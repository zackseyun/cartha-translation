  - 우리에게 명하신
  - 우리에게 분부하신
  lexicon: LSJ
  rationale: 상대절의 압축된 구조를 자연스럽게 풀어, 하나님이 이스라엘에게 명령하신 일들을 가리킨다는 점이 드러나도록 했습니다.
theological_decisions:
- issue: 재앙(κακά)을 하나님이 내리시는 것으로 말할 때의 표현 선택
  chosen_reading: ‘재앙들’로 옮겨 심판의 성격을 드러냈습니다.
  alternative_readings:
  - ‘악들’
  - ‘불행들’
  - ‘재난들’
  rationale: 본문은 하나님이 도덕적 악을 조장하신다는 뜻이 아니라, 언약적 심판으로 재앙을 내리신다는 뜻이므로, 그 긴장을 흐리지 않는 표현을 택했습니다.
  doctrine_reference: 언약 심판과 하나님의 의로우심을 함께 보존하는 번역 원칙
- issue: δίκαιος의 번역
  chosen_reading: ‘의로우시기’로 번역했습니다.
  alternative_readings:
  - ‘공의로우시기’
  - ‘옳으시기’
  rationale: 문맥이 하나님의 판결의 정당성을 말하므로, 전통적이면서도 본문 흐름에 맞는 ‘의롭다’를 사용했습니다.
  doctrine_reference: δικ- 계열은 기본적으로 ‘의/의롭다’로 대응
