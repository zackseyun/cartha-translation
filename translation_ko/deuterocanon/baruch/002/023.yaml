base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/002/023.yaml
  text: I will cause the sound of gladness and the sound of rejoicing to cease from the cities of Judah and from the outskirts of Jerusalem[a], the sound of bridegroom and the sound of bride[b], and all the land will become impassable because of its inhabitants.
  footnotes:
  - marker: a
    text: 'Greek: ''from outside Jerusalem.'' Some translations smooth this to ''from the streets of Jerusalem'' under the influence of parallel prophetic formulas, but the extant Greek here reads ''outside.'''
    reason: alternative_reading
  - marker: b
    text: The final phrase is difficult in Greek. It may also be understood as 'all the land will become impassable, without inhabitants' or 'devoid of inhabitants.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 유다의 도시들과 예루살렘 바깥에서 기쁨의 소리와 즐거움의 소리를 그치게 하며, 신랑의 소리와 신부의 소리를 그치게 하리니, 온 땅은 그 주민들 때문에 지나갈 수 없는 곳이 될 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 ‘예루살렘 바깥에서’라고 읽습니다. 일부 번역은 평행 예언문구의 영향으로 ‘예루살렘의 거리에서’처럼 매끄럽게 옮기지만, 현존 그리스어는 ‘바깥’입니다.
    reason: alternative_reading
  - marker: b
    text: 마지막 구절은 그리스어가 난해합니다. ‘그 주민들이 없어’ 또는 ‘거주민들 없이’로도 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκλείψειν ποιήσω
  english_pob_choice: I will cause ... to cease
  chosen_korean: 그치게 하며
  alternatives_korean:
  - 사라지게 하며
  - 멸하게 하며
  - 그치게 하리라
  lexicon: LSJ
  rationale: ποιέω + 부정사 구조의 강한 사역성을 살려, 소리가 스스로 멎는 것이 아니라 하나님이 멎게 하신다는 뜻을 한국어 동사구로 표현했습니다.
- source_word: ἔξωθεν Ἰερουσαλήμ
  english_pob_choice: from outside Jerusalem
  chosen_korean: 예루살렘 바깥에서
  alternatives_korean:
  - 예루살렘 밖에서
  - 예루살렘의 바깥에서
  - 예루살렘 주변에서
  lexicon: LSJ
  rationale: ἔξωθεν의 기본 의미인 ‘바깥에서’를 그대로 살려, 전승적 평행문구로 부드럽게 바꾸지 않았습니다.
- source_word: φωνὴν εὐφροσύνης καὶ φωνὴν χαρμοσύνης
  english_pob_choice: the sound of gladness and the sound of rejoicing
  chosen_korean: 기쁨의 소리와 즐거움의 소리
  alternatives_korean:
  - 환락의 소리와 환희의 소리
  - 기쁜 소리와 즐거운 소리
  lexicon: LSJ
  rationale: φωνή는 여기서 ‘소리’가 자연스럽고, εὐφροσύνη/χαρμοσύνη의 병렬을 ‘기쁨/즐거움’으로 살려 반복 구조를 유지했습니다.
- source_word: ἄβατον
  english_pob_choice: impassable
  chosen_korean: 지나갈 수 없는 곳
  alternatives_korean:
  - 통행할 수 없는 곳
  - 사람이 지나다닐 수 없는 곳
  - 황무지
  lexicon: LSJ
  rationale: ἄβατος의 핵심인 ‘밟고 지나갈 수 없음’을 직역에 가깝게 풀어, 단순한 ‘황폐함’으로 약화시키지 않았습니다.
- source_word: ἀπὸ ἐνοικούντων
  english_pob_choice: because of its inhabitants
  chosen_korean: 그 주민들 때문에
  alternatives_korean:
  - 거주자들로 인해
  - 거주민들이 없어
  - 주민들 없이
  lexicon: LSJ
  rationale: 구문이 난해하므로, 원문의 전치사적 관계를 무리하게 정리하지 않고 결과를 유발하는 원인 관계로 옮겨 해석 여지를 남겼습니다.
theological_decisions:
- issue: 예루살렘 관련 표현을 전승적 평행구로 매끄럽게 정리할지 여부
  chosen_reading: ‘예루살렘 바깥에서’로 원문을 그대로 살렸습니다.
  alternative_readings:
  - ‘예루살렘의 거리에서’처럼 예레미야 평행구에 맞춰 조정
  - ‘예루살렘 주변에서’로 완화
  rationale: 현존 그리스어는 ἔξωθεν을 쓰므로, 익숙한 예언문 공식으로 맞추기보다 증거본문의 표현을 우선했습니다.
  doctrine_reference: Translation philosophy §1, §5
