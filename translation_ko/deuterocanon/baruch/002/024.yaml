base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/002/024.yaml
  text: And we did not listen to your voice to serve the king of Babylon[a], and you have fulfilled your words that you spoke by the hands of your servants the prophets[c][b], that the bones of our kings and the bones of our fathers would be brought out from their place.
  footnotes:
  - marker: a
    text: Or, 'did not obey your voice.' The Greek idiom literally speaks of not hearing/listening to God's voice, with obedience implied by context.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'by the hands of your servants the prophets,' an idiom meaning 'through your servants the prophets.'
    reason: lexical_alternative
  - marker: c
    text: That is, from their burial place; the Greek says only 'from their place.'
    reason: cultural_note
translation:
  language: ko
  text: 우리가 주님의 목소리를 듣지 않고 바빌론 왕을 섬기지 않았으며, 주님께서는 당신의 종 예언자들의 손을 통해 말씀하신 주님의 말씀을 이루셔서, 우리 왕들의 뼈와 우리 조상들의 뼈가 그 있던 자리에서 나오게 하셨습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘주님의 목소리를 듣지 않다’입니다. 여기서는 곧 불순종의 의미를 담습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘당신의 종 예언자들의 손으로’입니다. 헬라어의 관용적 매개 표현입니다.
    reason: lexical_alternative
  - marker: c
    text: 헬라어는 단지 ‘그들의 자리에서’라고만 하며, 구체적으로는 묘지를 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: ἠκούσαμεν τῆς φωνῆς σου
  english_pob_choice: did not listen to your voice
  chosen_korean: 주님의 목소리를 듣지 않고
  alternatives_korean:
  - 주님의 목소리에 귀 기울이지 않고
  - 주님의 목소리를 듣지 않았고
  - 주님의 목소리에 순종하지 않고
  lexicon: BDAG
  rationale: ἀκούω + 목적격/속격 계열의 관용구를 한국어에서도 ‘듣지 않다’로 살리면 청취와 불복종의 긴장을 함께 보존할 수 있습니다.
- source_word: ἐργάσασθαι τῷ βασιλεῖ Βαβυλῶνος
  english_pob_choice: to serve the king of Babylon
  chosen_korean: 바빌론 왕을 섬기지 않았으며
  alternatives_korean:
  - 바빌론 왕에게 봉사하지 않았으며
  - 바빌론 왕을 위해 일하지 않았으며
  - 바빌론 왕을 섬기지 않고
  lexicon: LSJ
  rationale: 여기서는 단순한 노동이 아니라 지배 아래서의 복종적 봉사를 가리키므로 ‘섬기다’가 가장 자연스럽고 소스-직결적입니다.
- source_word: ἐν χερσὶν τῶν παίδων σου τῶν προφητῶν
  english_pob_choice: by the hands of your servants the prophets
  chosen_korean: 당신의 종 예언자들의 손을 통해
  alternatives_korean:
  - 당신의 종 예언자들을 통해
  - 당신의 종인 예언자들의 손으로
  - 당신의 종 예언자들의 손으로
  lexicon: LSJ
  rationale: ‘손을 통해’는 헬라어의 도구/매개 관용을 한국어에서 덜 어색하게 풀어 주면서, 예언자들을 통한 매개성을 유지합니다.
- source_word: τοῦ ἐξενεχθῆναι τὰ ὀστᾶ ... ἐκ τοῦ τόπου αὐτῶν
  english_pob_choice: that the bones ... would be brought out from their place
  chosen_korean: 뼈가 그 있던 자리에서 나오게 하셨습니다
  alternatives_korean:
  - 뼈가 그 자리에서 끌려 나오게 하셨습니다
  - 뼈가 그곳에서 옮겨지게 하셨습니다
  - 뼈가 그 묘자리에서 나오게 하셨습니다
  lexicon: LSJ
  rationale: 원문은 단순히 ‘place’라고만 하므로 burial-specific 표현은 피하고, 뼈가 이동되는 결과를 분명히 하는 방향으로 옮겼습니다.
theological_decisions:
- issue: ‘주님의 목소리’와 ‘듣지 않다’의 결합을 어떻게 이해시킬지
  chosen_reading: 직역에 가까운 ‘주님의 목소리를 듣지 않다’로 유지해, 불순종을 직접 설명하지 않고 문맥이 그것을 드러내게 했습니다.
  alternative_readings:
  - 주님의 목소리에 순종하지 않다
  - 주님의 말씀을 듣지 않다
  rationale: 본문은 불순종을 의미하지만, 히브리/헬라적 관용구의 청각적 이미지를 유지하는 편이 죄의 고발을 더 날카롭게 전달합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 3, 6
- issue: 예언자 매개의 표현을 어떻게 처리할지
  chosen_reading: ‘당신의 종 예언자들의 손을 통해’로 옮겨, 하나님의 말씀이 예언자들을 매개로 주어졌다는 점을 드러냈습니다.
  alternative_readings:
  - 예언자들을 통해
  - 예언자들의 손으로
  rationale: ‘손’은 단순 장식이 아니라 매개성과 도구성을 나타내는 관용이므로, 이를 살리되 한국어 문장 흐름은 자연스럽게 조정했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 5, 6
