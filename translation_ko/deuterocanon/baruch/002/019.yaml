translation:
  language: ko
  text: 이는 우리가 우리 조상들과 우리 왕들의 의로운 행위에 근거하여 자비를 구하는 우리의 간구를 주님, 우리 하나님 앞에 드리는 것이 아니기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘자비’입니다. 여기서는 하나님께 자비를 구하는 간구를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘당신의 얼굴 앞에’라는 관용구로, ‘당신 앞에’ 또는 ‘당신의 면전에서’라는 뜻입니다.
    reason: lexical_alternative
