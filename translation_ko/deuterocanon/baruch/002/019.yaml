translation:
  language: ko
  text: 이는 우리 조상들과 우리 왕들의 의로운 행위에 근거한 것이 아니라, 주 우리 하나님, 당신의 얼굴 앞에 우리 구원의 간구를 드리는 것이기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘구원의 간구’는 문자적으로 ‘자비’를 드러내는 표현을 한국어에서 자연스럽게 풀어쓴 것입니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘당신의 얼굴 앞에’라는 관용구로, ‘당신 앞에서/당신의 면전에서’라는 뜻입니다.
    reason: lexical_alternative
