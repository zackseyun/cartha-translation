translation:
  language: ko
  text: 그들은 그들의 뻣뻣한 등에서[a] 돌아서고 그들의 악한 행위에서 돌이킬 것입니다. 이는 그들이 주님 앞에서 죄를 지은 그들의 조상들의 길을 기억할 것이기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그들의 뻣뻣한 등으로부터’입니다. 더 관용적으로는 ‘그들의 완고함에서’ 또는 ‘그들의 완고한 목에서’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποστρέψουσιν
  english_pob_choice: they will turn away
  chosen_korean: 돌아서게 될 것입니다
  alternatives_korean:
  - 돌이키게 될 것입니다
  - 돌아가게 될 것입니다
  lexicon: BDAG
  rationale: 미래형의 방향 전환과 회개의 뉘앙스를 자연스러운 한국어로 옮기되, 단순한 ‘전환’이 아니라 이전 행실에서 물러나는 뜻을 살렸습니다.
- source_word: ἀπὸ τοῦ νώτου αὐτῶν τοῦ σκληροῦ
  english_pob_choice: from their stubborn back
  chosen_korean: 자기들의 뻣뻣한 등
  alternatives_korean:
  - 자기들의 완고한 목
  - 자기들의 완고함
  lexicon: LSJ
  rationale: 본문이 ‘목’이 아니라 ‘등’(νώτου)을 쓰므로 그 이미지를 유지했고, σκληροῦ는 한국어에서 몸의 긴장과 고집을 함께 떠올리게 하는 ‘뻣뻣한’으로 옮겼습니다.
- source_word: πονηρῶν πραγμάτων
  english_pob_choice: evil deeds
  chosen_korean: 악한 행위
  alternatives_korean:
  - 악한 일들
  - 악한 일
  lexicon: BDAG
  rationale: πράγματα는 단순한 ‘것들’보다 실제 행위와 실천을 가리키는 문맥이므로, POB의 의미를 살려 ‘행위’로 옮겼습니다.
- source_word: ἔναντι Κυρίου
  english_pob_choice: before the Lord
  chosen_korean: 주님 앞에서
  alternatives_korean:
  - 주님 앞에
  - 주 앞에서
  lexicon: BDAG
  rationale: ἔναντι는 ‘~앞에/앞에서’의 공개적·직면적 의미가 있어, 심판과 책망의 문맥에 맞게 ‘앞에서’로 옮겼습니다.
theological_decisions:
- issue: ‘stubborn back’의 이미지 유지
  chosen_reading: 추상화하지 않고 몸의 이미지를 그대로 살렸습니다.
  alternative_readings:
  - 자기들의 완고함
  - 자기들의 완고한 목
  rationale: 그리스어 본문은 관용구를 흔한 ‘목’ 표현으로 바꾸지 않고 ‘등’이라는 구체적 신체 이미지를 사용하므로, 소스의 투명성을 위해 그 이미지를 보존했습니다.
  doctrine_reference: Translation philosophy §§1, 5
- issue: ἔναντι Κυρίου의 방향성
  chosen_reading: ‘주님 앞에서’로 옮겼습니다.
  alternative_readings:
  - 주님을 대적하여
  - 주님 앞에
  rationale: 전치사 자체는 ‘~앞에서’의 의미를 가지며, 죄의 방향성을 과도하게 해석한 ‘대적하여’는 피했습니다.
  doctrine_reference: 'DOCTRINE.md contested terms: preposition handling'
