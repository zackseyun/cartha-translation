  naturalness: ‘주님께서 … 말씀하신 대로’와 ‘주님의 종 모세의 손을 통하여’는 현대 한국어의 격식 있는 성경 문체에 자연스럽습니다. 끝의 ‘말씀하시기를,’은 다음 절의 직접 인용이 계속됨을 문법적으로 분명히 드러냅니다. 원안의 각주 a는 그리스어 관용구를 설명하면서 영어 표현을 직접 인용하므로 한국어 독자에게 다소 부자연스러워 이를 바로잡았습니다.
