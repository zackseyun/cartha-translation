translation:
  language: ko
  text: 주님께서 주님의 종 모세[a]의 손을 통하여 말씀하신 대로, 주님께서 그에게 이스라엘 자손[b] 앞에서 주님의 율법을 기록하라고 명하신 날에 말씀하시기를,
