translation:
  language: ko
  text: 당신께서 당신의 종 모세[a]의 손을 통해 말씀하신 것처럼, 당신이 그에게 이스라엘 자손[b] 앞에서 당신의 율법을 기록하라고 명하신 날에 말씀하시기를…
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어의 ‘by the hand of’는 ‘~을 통해’라는 의미의 성경적 관용구입니다.
    reason: cultural_note
  - marker: b
    text: 그리스어는 ‘이스라엘의 아들들’이라는 남성 복수형입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν χειρὶ
  english_pob_choice: by the hand of
  chosen_korean: 손을 통해
  alternatives_korean:
  - 손으로
  - 통하여
  - 손을 빌려
  lexicon: LSJ
  rationale: 그리스어 관용구의 중개적 행위를 살리면서도 한국어로는 자연스럽게 풀어, 매개된 발화라는 स्रोत의 질감을 보존했습니다.
- source_word: παιδός σου Μωυσῆ
  english_pob_choice: your servant Moses
  chosen_korean: 당신의 종 모세
  alternatives_korean:
  - 당신의 시종 모세
  - 당신의 노예 모세
  lexicon: LSJ
  rationale: 모세를 하나님의 위임받은 인물로 가리키는 문맥이므로 ‘종’이 가장 적절하며, ‘노예’는 이 경우 지나치게 강합니다.
- source_word: τὸν νόμον σου
  english_pob_choice: your law
  chosen_korean: 당신의 율법
  alternatives_korean:
  - 당신의 법
  - 당신의 가르침
  lexicon: LSJ
  rationale: 모세 언약의 맥락에서는 νόμος를 ‘율법’으로 옮기는 것이 본문이 전제하는 토라적 의미를 가장 분명하게 전달합니다.
- source_word: υἱῶν Ἰσραήλ
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘의 아들들
  - 이스라엘 사람들
  lexicon: LSJ
  rationale: 그리스어의 남성 복수 표현을 한국어 성경 전통에 익숙하면서도 충분히 직역에 가까운 ‘이스라엘 자손’으로 유지했습니다.
theological_decisions:
- issue: Mosaic mediation expressed by 'by the hand of'
  chosen_reading: ‘손을 통해’로 옮겨, 모세가 직접 발화자가 아니라 매개자임을 드러냈습니다.
  alternative_readings:
  - ‘통하여’
  - ‘~을 통해’만의 평이한 처리
  rationale: 본문은 야훼의 말씀 전달이 모세를 매개로 이루어졌음을 강조하므로, 중개 행위를 약화하지 않는 표현이 필요합니다.
  doctrine_reference: 도서적/언약적 계시 전달의 매개성
- issue: End of verse with λέγων
  chosen_reading: ‘말씀하시기를…’로 끝내어 다음 절의 인용이 이어짐을 표시했습니다.
  alternative_readings:
  - ‘말하며’
  - 문장 종결
  rationale: λέγων은 뒤따르는 직접 인용을 여는 표지이므로, 문장 미완결성을 한국어에서도 드러내는 것이 본문 구조에 충실합니다.
  doctrine_reference: 인용 도입 표지 보존
