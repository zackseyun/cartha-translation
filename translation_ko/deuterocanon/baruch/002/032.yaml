base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/002/032.yaml
  text: and they will praise me in the land of their exile[a], and they will remember my name[b];
  footnotes:
  - marker: a
    text: Or 'the land of their deportation.' The Greek term can refer to removal and settlement away from one's homeland; 'exile' best fits the context here.
    reason: lexical_alternative
  - marker: b
    text: '''My name'' preserves the biblical idiom for God''s revealed identity and honor; compare the covenantal use of ''name'' elsewhere in Scripture.'
    reason: cross_reference
translation:
  language: ko
  text: 그들은 자기들의 포로 생활의 땅에서 나를 찬양하고, 내 이름을 기억할 것입니다[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 추방의 땅’. 그리스어는 본래의 땅에서 떨어져 나가 정착하게 되는 이동을 가리킬 수 있으며, 여기서는 ‘포로 생활’이 문맥에 가장 잘 맞습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘내 이름’은 하나님의 드러난 정체성과 존귀를 가리키는 성경적 관용구를 보존합니다.
    reason: cross_reference
lexical_decisions:
- source_word: αἰνέσουσίν
  english_pob_choice: they will praise
  chosen_korean: 나를 찬양하고
  alternatives_korean:
  - 나를 칭송하고
  - 나를 찬미하고
  - 나를 찬양할 것입니다
  lexicon: BDAG
  rationale: αἰνέω의 미래형으로, 예배적 칭송을 뜻하므로 ‘찬양하다’가 가장 자연스럽고 source-direct합니다.
- source_word: ἐν γῇ ἀποικισμοῦ αὐτῶν
  english_pob_choice: in the land of their exile
  chosen_korean: 자기들의 포로 생활의 땅에서
  alternatives_korean:
  - 그들의 유배지에서
  - 그들의 이주의 땅에서
  - 그들의 추방의 땅에서
  lexicon: LSJ
  rationale: ἀποικισμός는 단순한 이주보다 강제적 이탈과 정착을 포함할 수 있어, 문맥상 ‘포로 생활’이 강제된 이주의 성격을 한국어로 가장 잘 드러냅니다.
- source_word: μνησθήσονται
  english_pob_choice: they will remember
  chosen_korean: 기억할 것입니다
  alternatives_korean:
  - 기억해 둘 것입니다
  - 떠올릴 것입니다
  - 마음에 간직할 것입니다
  lexicon: BDAG
  rationale: 미래형 μιμνῄσκομαι의 기본 의미를 가장 सीधे하게 살려, 별도의 해설 없이 ‘기억하다’로 옮겼습니다.
- source_word: τοῦ ὀνόματός μου
  english_pob_choice: my name
  chosen_korean: 내 이름을
  alternatives_korean:
  - 나의 이름을
  - 내 명을
  - 내 이름
  lexicon: BDAG
  rationale: 성경적 관용구로서 하나님의 계시된 이름을 뜻하므로, 본문에서는 직역을 유지하되 한국어 자연성에 맞게 ‘내 이름’을 택했습니다.
theological_decisions:
- issue: ‘이름’의 신학적 함의 보존
  chosen_reading: ‘내 이름’을 그대로 유지했습니다.
  alternative_readings:
  - 내 명성
  - 내 정체성
  - 내 권위
  rationale: 본문은 하나님의 이름이라는 성경적 관용구를 사용하므로, 의미를 풀어쓰기보다 직역을 유지해야 언약적·계시적 함의를 보존할 수 있습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
- issue: ἀποικισμός의 강제 이주 뉘앙스
  chosen_reading: ‘포로 생활의 땅’으로 옮겼습니다.
  alternative_readings:
  - 유배의 땅
  - 추방의 땅
  - 이주의 땅
  rationale: 문맥은 단순한 거주 이동이 아니라 심판 아래 놓인 강제 이주 상태를 가리키므로, 한국어에서도 그 고통스러운 상태를 분명히 드러내는 표현이 적절합니다.
  doctrine_reference: Translation philosophy §§1, 5, 6
