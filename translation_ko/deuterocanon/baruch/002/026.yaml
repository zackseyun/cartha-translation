translation:
  language: ko
  text: 그리고 주께서는 오늘날과 같이, 이스라엘의 집과 유다의 집의 악함 때문에, 당신의 이름이 그 위에 불린 그 집을 그렇게 만드셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘당신의 이름이 그 위에 불린 집’입니다. 이는 소유와 봉헌을 나타내는 셈어식 관용구입니다.
    reason: lexical_alternative
