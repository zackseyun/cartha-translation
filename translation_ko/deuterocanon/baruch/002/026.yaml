  text: And you made the house over which your name was called as it is this day[a], because of the wickedness of the house of Israel and the house of Judah.
  footnotes:
  - marker: a
    text: Or more idiomatically, 'the house that bears your name.' The Greek uses a Semitic formula, literally 'the house over which your name was called.'
