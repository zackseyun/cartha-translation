revisions:
- from: 그분은 우리 주변의 모든 왕국들에 그들을 종속시키셔서, 그들이 그곳에서 만민 가운데서 모욕과 황무지가 되게 하셨습니다. 이는 주님께서 그들을 흩으신 모든 백성들 사이에서 그렇게 되게 하신 것입니다.[a]
  to: 그분께서는 그들을 우리 주변의 모든 왕국에 넘겨 그들의 지배 아래 두셨으며, 주님께서 그들을 그곳에 흩으신 모든 주변 민족 가운데서 수치와 황폐함이 되게 하셨습니다.[a]
  rationale: 원문의 두 결과 표현(‘수치와 황폐함’)과 마지막 관계절(‘주님께서 그들을 그곳에 흩으신 모든 주변 민족 가운데서’)을 한 문장 안에서 직접 재현했습니다. ‘넘겨 … 지배 아래 두셨으며’는 ἔδωκεν과 ὑποχειρίους의 인도·예속 의미를 모두 살리되, 원문의 심판적 의미를 과도하게 해설하지 않습니다.
