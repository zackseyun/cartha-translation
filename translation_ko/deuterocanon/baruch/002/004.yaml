translation:
  language: ko
  text: 그분께서는 그들을 우리 주변의 모든 왕국에 넘겨 그들의 지배 아래 두셨으며, 주님께서 그들을 그곳에 흩으신 모든 주변 민족 가운데서 수치와 황폐함이 되게 하셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘사람이 다닐 수 없는 곳’. 여기서 ‘황폐함’으로 옮긴 그리스어는 문자적으로 사람이 밟지 못하거나 접근할 수 없는 것을 뜻할 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδωκεν
  english_pob_choice: gave ... over
  chosen_korean: 종속시키셔서
  alternatives_korean:
