  source_fidelity: 현 초안은 마지막 절의 관계를 크게 바꾸었습니다. 그리스어는 주님께서 그들을 ‘그곳에’ 흩으신 모든 주변 민족 가운데서 그들이 수치와 황폐함이 되게 하셨다는 구조입니다. 초안의 ‘이는 … 그렇게 되게 하신 것입니다’는 원문에 없는 설명절을 추가하고, 흩으심과 결과의 관계를 불명확하게 합니다.
  naturalness: ‘그들이 그곳에서 만민 가운데서’는 조사와 부사가 겹쳐 어색하며, ‘모욕과 황무지가 되게’도 사람들에게 적용될 때 다소 부자연스럽습니다. ‘모든 민족 가운데서 수치와 황폐함이 되게’가 현대 표준어 성경 문체로 더 자연스럽습니다.
  terminology: ὑποχειρίους의 정치적 종속은 ‘넘겨 … 지배 아래 두셨으며’로 명확히 나타냈습니다. ὀνειδισμός은 ‘수치’, ἄβατον은 문맥상 ‘황폐함’으로 옮기고, 주석에서 ‘사람이 다닐 수 없는 곳’이라는 가능한 문자적 의미를 보존했습니다. κύριος는 ‘주님’으로 유지했습니다.
