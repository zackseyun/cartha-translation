  - 내주셔서
  lexicon: BDAG
  rationale: 단순한 ‘주다’보다, 심판 아래 다른 권세에 내주는 뜻을 살려 정치적·판결적 강제를 드러내기 위해 ‘종속시키다’를 선택했습니다.
- source_word: ὑποχειρίους
  english_pob_choice: as subjects
  chosen_korean: 종속시키셔서
  alternatives_korean:
  - 부하로
  - 예속된 자로
  lexicon: LSJ
  rationale: ‘손 아래에 둔’ 상태를 한국어로 자연스럽게 풀면 ‘종속’이 가장 직접적으로 권력 아래 놓인 상태를 보여 줍니다.
- source_word: εἰς ὀνειδισμόν καὶ ἄβατον
  english_pob_choice: for reproach and desolation
  chosen_korean: 모욕과 황무지가 되게 하셨습니다
  alternatives_korean:
  - 수치와 황무지가 되게 하셨습니다
  - 치욕과 황폐함이 되게 하셨습니다
  lexicon: BDAG/LSJ
  rationale: ‘ὀνειδισμός’의 공개적 수치와 ‘ἄβατον’의 황폐·사람이 드나들지 못하는 상태를 함께 살리기 위해, 결과 상태를 드러내는 표현으로 옮겼습니다.
- source_word: διέσπειρεν
  english_pob_choice: scattered
  chosen_korean: 흩으신
  alternatives_korean:
  - 흩어 버리신
  - 분산시키신
  lexicon: BDAG
  rationale: 포로·추방 문맥의 표준적 동사로서 ‘흩으시다’가 가장 자연스럽고 성경적입니다.
theological_decisions:
- issue: Κύριος의 한국어 처리
  chosen_reading: 주님
  alternative_readings:
  - 주
  - 야훼
  rationale: 이 절의 서술적 문맥에서는 POB 영어의 ‘the Lord’를 따라 ‘주님’이 가장 자연스럽고, 본문 내부의 직접 인용이나 야훼 대체가 요구되는 LXX 인용 상황은 아닙니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: κύριος → Lord'
- issue: ἄβατον의 의미 범위
  chosen_reading: 황무지
  alternative_readings:
  - 사람이 다닐 수 없는 곳
  - 폐허
  rationale: 여기서는 ‘통행 불가’의 문자적 뜻보다 징벌의 결과 상태가 핵심이므로, ‘reproach and desolation’의 병렬을 살리는 ‘황무지’가 적절합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §5
