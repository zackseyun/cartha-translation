translation:
  language: ko
  text: 우리는 주님의 얼굴을 구하지 않았습니다[a], 곧 각 사람이 자기 악한 마음의 생각에서 돌아서도록 말입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘주님의 얼굴을 간구하지 않았다’입니다. 여기서 ‘얼굴’은 주님의 임재와 호의를 가리키는 셈어적 관용구입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들의 악한 마음의 계획/의도에서’라고 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδεήθημεν
  english_pob_choice: entreat the favor
  chosen_korean: 주님의 얼굴을 구하지 않았습니다
  alternatives_korean:
  - 주님께 간구하지 않았습니다
  - 주님의 호의를 구하지 않았습니다
  - 주님의 은총을 구하지 않았습니다
  lexicon: LEH
  rationale: δέομαι의 청원 의미를 살리되, τοῦ προσώπου와 결합한 관용구를 직역 쪽으로 유지해 ‘얼굴’을 보존했습니다. 한국어에서는 ‘얼굴을 구하다’가 다소 낯설지만, 본문 각주로 관용구임을 밝혀 의미를 확보했습니다.
- source_word: τοῦ προσώπου Κυρίου
  english_pob_choice: the favor of the Lord
  chosen_korean: 주님의 얼굴
  alternatives_korean:
  - 주님의 호의
  - 주님의 임재
  - 주님의 낯
  lexicon: LEH
  rationale: 히브리식 관용구를 그대로 드러내어, 단순한 기도 일반이 아니라 주님의 긍휼한 접근/호의를 구하는 표현임을 유지했습니다. POB의 영어 주석처럼 한국어도 문맥상 ‘호의’ 의미를 각주로 설명합니다.
- source_word: ἀποστρέψαι
  english_pob_choice: that ... might turn
  chosen_korean: 돌아서도록
  alternatives_korean:
  - 돌이키도록
  - 돌아가도록
  - 되돌아서도록
  lexicon: BDAG
  rationale: 부정사 목적 의미를 자연스러운 한국어 목적절로 풀어, 회개의 방향 전환을 분명히 했습니다.
- source_word: νοημάτων τῆς καρδίας αὐτῶν τῆς πονηρᾶς
  english_pob_choice: the thoughts of their evil heart
  chosen_korean: 자기 악한 마음의 생각
  alternatives_korean:
  - 그들의 악한 마음의 생각
  - 악한 마음에 품은 생각
  - 악한 마음의 꾀
  lexicon: LEH
  rationale: νοήματα를 단순한 ‘계획’보다 넓은 ‘생각’으로 두고, καρδία를 성서적 인류학의 ‘마음’으로 보존했습니다. αὐτῶν은 분배적 의미를 살려 ‘자기’로 옮겼습니다.
theological_decisions:
- issue: ‘주님의 얼굴’ 관용구의 처리
  chosen_reading: 직역 이미지를 살리되, 의미는 ‘주님의 호의/은총을 구함’으로 읽히도록 각주로 보완했습니다.
  alternative_readings:
  - 주님의 호의를 구하지 않았습니다
  - 주님의 임재를 구하지 않았습니다
  rationale: 본문은 회개와 간구의 관계를 말하므로, 관용구를 평준화해 버리기보다 원문 이미지를 유지하는 편이 출처 충실성과 신학적 긴장을 더 잘 보존합니다.
  doctrine_reference: 'POB 원칙: source-direct translation, idiom preserved with note'
- issue: ‘마음’과 죄의 내적 근원
  chosen_reading: 악한 생각의 근원을 ‘마음’에 둔 표현을 유지했습니다.
  alternative_readings:
  - 악한 ذهن(생각)
  - 악한 정신
  - 악한 의도
  rationale: 이 구절은 죄를 외적 행위보다 내적 중심에 연결합니다. ‘마음’은 성서적 인간 이해를 보존하며, 단순한 심리적 ‘생각’으로만 축소하지 않습니다.
  doctrine_reference: 'POB 원칙: preserve anthropological source imagery'
