  naturalness: The revised sentence is natural in modern formal-polite Korean. ‘계명들을 따라 걷도록’ expresses the biblical ethical metaphor intelligibly, and placing the explanatory relative phrase with ‘계명들’ avoids the draft’s fragment-like second sentence.
  terminology: ‘주님,’ ‘음성,’ and ‘계명들’ are appropriate and consistent with the source and the stated Korean register. ‘그분’ is used only to make the referent clear in Korean.
  issues:
