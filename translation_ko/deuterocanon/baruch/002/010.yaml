    issue: The phrase ‘곧 주님의 계명들 안에서 걷지 않기 위해서였습니다’ incorrectly renders the infinitive as a negative purpose clause.
    rationale: πορεύεσθαι is positive (‘to walk’), dependent on the failure to listen; it must not be translated as ‘in order not to walk.’
  - severity: medium
    issue: The source phrase qualifying the commandments is supplied only in a footnote rather than represented in the main text.
    rationale: οἷς ἔδωκεν κατὰ πρόσωπον ἡμῶν is part of the verse’s assertion and should be translated in the text; a footnote may explain its literal idiom.
