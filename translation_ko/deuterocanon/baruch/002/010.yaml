base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/002/010.yaml
  text: And we did not listen to his voice[b][a], to walk in the commandments of the Lord that he set before us.
  footnotes:
  - marker: a
    text: Or 'we did not obey his voice.' The Greek literally says 'we did not listen to his voice,' a biblical idiom for refusing to heed God's command.
    reason: lexical_alternative
  - marker: b
    text: Literally 'which he gave before our face'; that is, commandments set before us.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 우리는 그의 음성[a]을 듣지 않았습니다. 곧 주님의 계명들[b] 안에서 걷지 않기 위해서였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 음성에 순종하지 않았습니다.’ 그리스어는 문자적으로 ‘그의 음성을 듣지 않았다’고 하며, 하나님의 명령을 거절하는 성경적 관용구입니다.
    reason: lexical_alternative
  - marker: b
    text: 문자적으로는 ‘우리의 얼굴 앞에 그가 주신’; 곧 우리 앞에 두신 계명들입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠκούσαμεν τῆς φωνῆς αὐτοῦ
  english_pob_choice: we did not listen to his voice
  chosen_korean: 우리는 그의 음성을 듣지 않았습니다
  alternatives_korean:
  - 우리는 그의 음성에 귀를 기울이지 않았습니다
  - 우리는 그의 말을 듣지 않았습니다
  - 우리는 그에게 순종하지 않았습니다
  lexicon: BDAG
  rationale: ἀκούω의 핵심 이미지를 살려 ‘듣다/음성’으로 옮기고, 단순 청각보다 ‘heed하지 않음’의 뉘앙스는 문맥으로 드러나게 했습니다.
- source_word: πορεύεσθαι
  english_pob_choice: to walk
  chosen_korean: 걷지 않기 위해서였습니다
  alternatives_korean:
  - 살지 않기 위해서였습니다
  - 행하지 않기 위해서였습니다
  - 그 길을 따르지 않기 위해서였습니다
  lexicon: BDAG
  rationale: 성경적 윤리 문맥의 관용구인 ‘walk’를 직역에 가깝게 살리되, 한국어에서는 자연스럽게 부정 목적절로 구성했습니다.
- source_word: τοῖς προστάγμασιν Κυρίου
  english_pob_choice: the commandments of the Lord
  chosen_korean: 주님의 계명들
  alternatives_korean:
  - 주님의 명령들
  - 주님의 규례들
  - 주님의 법령들
  lexicon: BDAG
  rationale: πρόσταγμα의 명령/계명 뜻을 따르되, 언약적 문맥에 맞는 ‘계명들’이 가장 안정적이어서 선택했습니다.
- source_word: οἷς ἔδωκεν κατὰ πρόσωπον ἡμῶν
  english_pob_choice: that he set before us
  chosen_korean: 곧 … 앞에 두신
  alternatives_korean:
  - 우리 앞에 주신
  - 우리 앞에 세우신
  - 우리 앞에 보여 주신
  lexicon: BDAG
  rationale: 직역하면 ‘우리의 얼굴 앞에’이므로, 한국어에서는 공간적 비유를 살려 ‘앞에 두다’로 옮기는 것이 가장 자연스럽습니다.
theological_decisions:
- issue: ‘듣다’가 단순 청각인지, 순종의 거부까지 포함하는지
  chosen_reading: ‘그의 음성을 듣지 않았습니다’로 유지하되, 순종의 실패는 문맥 전체가 드러내게 했습니다.
  alternative_readings:
  - 그의 음성에 순종하지 않았습니다
  - 그의 말을 듣지 않았습니다
  rationale: 본문의 동사 자체는 ‘듣다’이며, 이를 곧바로 ‘순종하다’로 바꾸면 본문의 관용적 표현이 약화됩니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 3, 6
