  rationale: 한국어 본문에서는 시제보다 인용 시작의 권위를 분명히 하는 것이 중요하므로, 서술은 과거로 두되 인용문 자체의 명령형 긴장은 유지했습니다.
  doctrine_reference: 'POB translation principle: preserve source force and speech-act authority'
- issue: ‘섬기다’의 복종 뉘앙스
  chosen_reading: 바빌론 왕을 섬기며
  alternative_readings:
  - 바빌론 왕을 위하여 일하며
  - 바빌론 왕에게 봉사하며
  rationale: 단순 노동보다 정치적·사회적 종속을 내포하는 문맥이므로, 원문의 복종 구조를 드러내는 표현을 택했습니다.
  doctrine_reference: 'POB lexical policy: do not domesticate imposed-service imagery'
