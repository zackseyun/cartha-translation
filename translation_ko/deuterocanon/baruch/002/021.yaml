base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/002/021.yaml
  text: 'Thus says the Lord: Bow your shoulder and serve the king of Babylon[c][b][a], and dwell on the land that I gave to your fathers.'
  footnotes:
  - marker: a
    text: Or 'Bend your shoulder.' The image is one of submitting oneself to imposed service.
    reason: lexical_alternative
  - marker: b
    text: Or 'settle on the land' / 'remain on the land.' Greek 'sit' here functions idiomatically for residing.
    reason: lexical_alternative
  - marker: c
    text: 'Or ''your ancestors.'' Greek: ''your fathers.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 주께서 이렇게 말씀하셨습니다. "너희 어깨를 굽히고 바빌론 왕을 섬기며, 내가 너희 조상들에게 준 땅에 거하십시오."[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘어깨를 굽히라’. 이 이미지는 강제된 봉사 아래 자신을 굴복시키는 모습을 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘땅에 정착하라’ / ‘땅에 머물러라’. 여기서 그리스어 ‘앉다’는 관용적으로 거주를 뜻합니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘너희 조상들’. 그리스어는 ‘너희 아버지들’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὕτως εἶπεν Κύριος
  english_pob_choice: Thus says the Lord
  chosen_korean: 그때 주께서 이렇게 말씀하셨습니다
  alternatives_korean:
  - 주께서 이렇게 말씀하십니다
  - 이렇게 주께서 말씀하셨습니다
  lexicon: LSJ
  rationale: 예언적 발화 공식을 한국어에서 자연스러운 선포문으로 옮기되, 완료형의 서술을 살려 과거 발화 사실을 분명히 했습니다.
- source_word: Κλίνατε τὸν ὦμον ὑμῶν
  english_pob_choice: Bow your shoulder
  chosen_korean: 너희 어깨를 굽히고
  alternatives_korean:
  - 어깨를 숙이고
  - 어깨를 굽혀
  lexicon: LSJ
  rationale: ὦμον을 문자 그대로 '어깨'로 유지하고, κλίνω의 비유적 복종 이미지를 '굽히다'로 살려 원문의 신체적 상징을 보존했습니다.
- source_word: ἐργάσασθε τῷ βασιλεῖ Βαβυλῶνος
  english_pob_choice: serve the king of Babylon
  chosen_korean: 바빌론 왕을 섬기며
  alternatives_korean:
  - 바빌론 왕을 위하여 일하며
  - 바빌론 왕에게 봉사하며
  lexicon: LSJ
  rationale: 동사 ἐργάζομαι 계열의 ‘일하다’ 의미를 이 문맥에서는 지배자 아래에서 수행하는 복종 행위로 이해해 '섬기다'로 옮겼습니다.
- source_word: καθίσατε ἐπὶ τὴν γῆν
  english_pob_choice: dwell on the land
  chosen_korean: 땅에 거하십시오
  alternatives_korean:
  - 땅에 머무르십시오
  - 땅에 살십시오
  lexicon: LSJ
  rationale: 직역하면 '앉다'이지만 여기서는 거주를 뜻하는 관용 표현이므로, 장소성을 유지하면서 자연스러운 한국어로 '거하다'를 택했습니다.
- source_word: τοῖς πατράσιν ὑμῶν
  english_pob_choice: your fathers
  chosen_korean: 너희 조상들에게
  alternatives_korean:
  - 너희 아버지들에게
  - 너희 선조들에게
  lexicon: LSJ
  rationale: 그리스어는 남성 복수형 '아버지들'이지만, 한국어에서는 혈통적 조상 의미를 분명히 하기 위해 '조상들'로 옮겼습니다.
theological_decisions:
- issue: 예언 발화문의 현재성
  chosen_reading: 주께서 이렇게 말씀하셨습니다
