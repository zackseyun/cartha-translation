  source_fidelity: 첫 번째 ἐφ᾽ ἡμᾶς는 주님이 우리를 대상으로, 곧 우리를 거슬러 말씀하신다는 판단의 방향을 나타냅니다. 초안의 ‘우리에게 말씀하신 것’은 수신자를 향한 일반적인 말씀으로 이해될 수 있어 adversative 의미를 충분히 반영하지 못합니다. ‘이 모든 악이 우리에게 닥쳤습니다’는 πάντα τὰ κακὰ ταῦτα ἃ ἦλθεν ἐφ᾽ ἡμᾶς를 충실히 옮깁니다.
