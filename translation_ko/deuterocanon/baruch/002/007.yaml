lexical_decisions:
- source_word: ἃ ἐλάλησεν
  english_pob_choice: which the Lord spoke
  chosen_korean: 주님께서 우리에게 말씀하신 것
  alternatives_korean:
  - 주님께서 우리를 향해 말씀하신 것
  - 주님께서 우리에게 선포하신 것
  lexicon: BDAG
  rationale: 관계대명사 ἃ는 앞절 내용을 받는 구조로 보고 ‘것’으로 자연스럽게 풀었고, ἐλάλησεν은 단순한 ‘말하다’보다 문맥상 ‘말씀하다’가 적절합니다.
- source_word: Κύριος
  english_pob_choice: Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주
  - 주인
  lexicon: BDAG
  rationale: 한국어 합쇼체 본문에서는 Κύριος의 일반적인 경외적 호칭을 ‘주님’으로 옮기는 것이 자연스럽고, 이 구절은 신명 직접표기 전승이 아니라 그리스어 본문 자체입니다.
- source_word: ἐφ᾽ ἡμᾶς
  english_pob_choice: against us / upon us
  chosen_korean: 우리에게 닥쳤습니다
  alternatives_korean:
  - 우리에게 임했습니다
  - 우리 위에 임했습니다
  - 우리를 향해 닥쳤습니다
  lexicon: BDAG
  rationale: 첫 번째 ἐφ᾽ ἡμᾶς는 ‘말씀하신 것’에 붙어 원인·대상 관계를 드러내므로 ‘우리에게’로, 뒤의 ἦλθεν ἐφ᾽ ἡμᾶς는 재앙의 도래를 살려 ‘닥쳤습니다’로 옮겼습니다.
- source_word: πάντα τὰ κακὰ ταῦτα
  english_pob_choice: all these evils
  chosen_korean: 이 모든 악
  alternatives_korean:
  - 이 모든 재앙
  - 이 모든 불행
  - 이 모든 재난
  lexicon: BDAG
  rationale: POB의 ‘evils’를 따라 κακά의 어휘적 긴장을 유지했고, 결과적 의미인 재앙/불행으로 너무 빨리 풀지 않았습니다.
theological_decisions:
- issue: τὰ κακά의 의미를 도덕적 ‘악’으로 둘지, 심판의 ‘재앙/불행’으로 풀지
  chosen_reading: 본문은 ‘악’을 유지하되, 문맥상 이것이 백성에게 임한 심판이라는 점은 번역어 선택만으로 과도하게 해소하지 않았습니다.
  alternative_readings:
  - 이 모든 재앙
  - 이 모든 불행
  - 이 모든 재난
  rationale: 그리스어 κακά는 이 문맥에서 심판적 재앙을 가리킬 수 있지만, 본문은 실제로 ‘악/재앙’의 긴장을 함께 지니므로 원문 어휘를 더 가까이 보존했습니다.
