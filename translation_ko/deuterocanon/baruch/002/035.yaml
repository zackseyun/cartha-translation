base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/002/035.yaml
  text: And I will establish for them an everlasting covenant[a], that I may be their God and they may be my people; and I will no longer remove my people Israel from the land that I gave to them.
  footnotes:
  - marker: a
    text: Or 'that I will be their God and they will be my people.' The Greek expresses the covenant's purpose/content with an infinitive construction.
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 그들의 하나님이 되고 그들이 내 백성이 되게 하려고, 그들을 위하여 영원한 언약을 세우겠습니다. 또 나는 다시는 내 백성인 이스라엘을 내가 그들에게 준 땅에서 옮기지 않겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내가 그들의 하나님이 되고 그들이 내 백성이 될 영원한 언약을 세우겠습니다.’ 그리스어는 부정사 구문으로 언약의 목적 또는 내용을 표현합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: στήσω
  english_pob_choice: I will establish
  chosen_korean: 세우셔서
  alternatives_korean:
  - 맺으셔서
  - 정하셔서
  - 세우겠습니다
  lexicon: BDAG
  rationale: 언약을 ‘세우다’는 한국어가 히브리어·그리스어의 언약 성립을 자연스럽게 옮기면서도, 단순한 물리적 ‘세우기’보다 제정·확립의 뜻을 살릴 수 있습니다.
- source_word: διαθήκην αἰώνιον
  english_pob_choice: an everlasting covenant
  chosen_korean: 영원한 언약
  alternatives_korean:
  - 영속하는 언약
  - 끝없는 언약
  - 영세한 언약
  lexicon: BDAG
  rationale: αἰώνιον의 지속성은 ‘영원한’이 가장 सीधे하고 성경적입니다. 한국어 교회 용어인 ‘언약’도 그대로 유지했습니다.
- source_word: τοῦ εἶναί με αὐτοῖς εἰς θεόν ... εἰς λαόν
  english_pob_choice: that I may be their God and they may be my people
  chosen_korean: 내가 그들의 하나님이 되고 그들은 내 백성이 되게 하시며
  alternatives_korean:
  - 그들의 하나님이 되도록 하시며 그들이 내 백성이 되도록 하시며
  - 내가 그들에게 하나님이 되며 그들이 내 백성이 되게 하시며
  lexicon: BDAG
  rationale: 부정사 목적절의 언약 공식을 한국어에서 자연스럽게 풀어, 관계의 결과와 목적을 동시에 드러냈습니다. ‘백성’은 λαός의 집합적 언약 표현을 살립니다.
- source_word: οὐ κινήσω ἔτι
  english_pob_choice: I will no longer remove
  chosen_korean: 다시는 ... 옮기지 않겠습니다
  alternatives_korean:
  - 더 이상 ... 옮기지 않겠습니다
  - 다시는 ... 제거하지 않겠습니다
  - 더는 ... 옮기지 않겠습니다
  lexicon: BDAG
  rationale: 여기서 κινέω는 땅에서 백성을 ‘이동시키다/내쫓다’는 뜻이므로, ‘옮기다’가 자연스러우면서도 추방·이주 해제의 의미를 보존합니다.
- source_word: τὸν λαόν μου Ἰσραὴλ
  english_pob_choice: my people Israel
  chosen_korean: 내 백성 이스라엘
  alternatives_korean:
  - 이스라엘 내 백성
  - 내 백성인 이스라엘
  - 이스라엘 나의 백성
  lexicon: BDAG
  rationale: 소유격과 동격 관계를 한국어에서 가장 읽기 자연스럽게 옮겼습니다. ‘내 백성 이스라엘’은 언약적 소속을 강조합니다.
- source_word: ἀπὸ τῆς γῆς ἧς ἔδωκα αὐτοῖς
  english_pob_choice: from the land that I gave to them
  chosen_korean: 내가 그들에게 준 땅에서
  alternatives_korean:
  - 내가 그들에게 준 그 땅에서
  - 그들에게 준 땅에서
  - 내가 준 그 땅에서
  lexicon: BDAG
  rationale: γῆ는 이 문맥에서 일반적 ‘땅’이 아니라 이스라엘에게 주어진 지정된 땅을 가리킵니다. 관계절을 앞에서 풀어 자연스러운 한국어로 정리했습니다.
theological_decisions:
- issue: 언약 공식의 목적·내용 관계
  chosen_reading: ‘내가 그들의 하나님이 되고 그들은 내 백성이 되게 하시며’로 목적과 성격을 함께 드러냄
  alternative_readings:
  - ‘내가 그들의 하나님이 되도록, 그들이 내 백성이 되도록’
  - ‘내가 그들의 하나님이 되며 그들이 내 백성이 되리라’
  rationale: 그리스어는 단순 미래 진술보다 언약의 목적/내용을 나타내는 부정사 구문입니다. 한국어에서는 성경적 공식성을 유지하면서도 의미를 분명히 하기 위해 연결형으로 옮겼습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 3, 6
- issue: ‘옮기지 않겠습니다’의 뉘앙스
  chosen_reading: 백성을 땅에서 다시 ‘옮기지 않겠다’는 언약적 보호 약속으로 읽음
  alternative_readings:
  - 다시는 내쫓지 않겠습니다
  - 다시는 몰아내지 않겠습니다
  - 다시는 흔들지 않겠습니다
  rationale: 문맥은 토지에서의 축출 금지입니다. ‘옮기다’는 문자적 이동을 넘어서 추방·유배의 중단을 담으면서도, 후기 교리적 표현을 과도하게 덧씌우지 않습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 3
