  - marker: a
    text: Or 'tempting the Lord.' The Greek verb can mean either 'test' or 'tempt,' but here likely means putting the Lord to the test.
    reason: lexical_alternative
translation:
  language: ko
  text: 기도하기 전에 자신을 준비하십시오. 그리고 주님을 시험하는 사람처럼 되지 마십시오.[a]
  philosophy: formal
  footnotes:
  - marker: a
    text: 또는 ‘유혹하는’. 이 동사는 여기서 ‘시험하다’와 ‘유혹하다’의 뜻을 둘 다 가질 수 있지만, 문맥상 주님을 시험에 드는 쪽이 더 가깝습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὶν εὔξασθαι
  english_pob_choice: Before you pray
  chosen_korean: 기도하기 전에
  alternatives_korean:
  - 기도하기 앞서
  - 기도하기 전에 기도를 드리기 전에
  lexicon: LSJ/BDAG
  rationale: ἐὔχομαι는 여기서 하나님께 드리는 기도의 의미가 자연스럽기 때문에, 한국어도 간결하게 ‘기도하다’로 옮겨 예문의 시제 관계를 분명히 했습니다.
- source_word: ἑτοίμασον σεαυτόν
  english_pob_choice: prepare yourself
  chosen_korean: 자신을 준비하십시오
  alternatives_korean:
  - 스스로를 준비하십시오
  - 몸과 마음을 갖추십시오
  lexicon: LSJ
  rationale: 직접목적어가 자기 자신이므로 내부적·개인적 준비를 드러내는 ‘자신을 준비하다’를 택했습니다.
- source_word: μὴ γίνου
  english_pob_choice: do not become
  chosen_korean: 되지 마십시오
  alternatives_korean:
  - 되지 말라
  - 되지 않도록 하십시오
  lexicon: BDAG
  rationale: γίνομαι의 ‘되다/되어 가다’의 동사 힘을 살리기 위해 단순한 상태 부정보다 ‘되다’ 계열로 옮겼습니다.
- source_word: πειράζων τὸν κύριον
  english_pob_choice: testing the Lord
  chosen_korean: 주님을 시험하는
  alternatives_korean:
  - 주님을 시험하는
  - 주님을 떠보는
  lexicon: BDAG
  rationale: πειράζω는 여기서 하나님을 악으로 유혹한다기보다 ‘시험에 들게 하다, 시험하다’의 의미가 적절하므로, POB의 경고적 뉘앙스를 살려 ‘시험하는’으로 옮겼습니다.
theological_decisions:
- issue: τὸν κύριον의 지시 대상
  chosen_reading: 주님
  alternative_readings:
  - 주
  - 주인
  rationale: 지혜문맥에서 κύριος는 하나님을 가리키므로 한국어 관례상 ‘주님’으로 옮겨 경외적 호칭을 유지했습니다.
  doctrine_reference: 'POB glossary: κύριος (of Jesus) 주(主)/주님; in Jewish wisdom context refers to God.'
- issue: πειράζω의 의미 긴장
  chosen_reading: 시험하는
  alternative_readings:
  - 유혹하는
  - 떠보는
  rationale: 본문은 하나님을 ‘유혹’하는 것이 아니라 ‘시험하는’ 행위를 경고하므로, 의미를 좁히지 않고 경고의 성격을 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md: preserve theological tension rather than resolve it.'
