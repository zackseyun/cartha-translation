  text: My child[a], in good things do not add reproach, nor in any gift grief of words.
  footnotes:
  - marker: a
    text: Or 'with every gift, do not add hurtful words.' The Greek literally says 'nor in any gift grief of words,' a compressed expression warning against spoiling generosity with speech that causes sorrow.
    reason: lexical_alternative
translation:
  language: ko
  text: 내 아들아, 선한 일에서는 책망을 더하지 말고, 어떤 선물에도 말로 인한 슬픔을 더하지 마십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘어떤 선물에도 말의 슬픔’을 뜻하는 압축 표현으로, 선행을 상하게 하는 해로운 말이나 상처 주는 말을 경계하는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τέκνον
  english_pob_choice: My child
  chosen_korean: 내 아들아
  alternatives_korean:
  - 내 자녀야
  - 내 아이야
  lexicon: LSJ
  rationale: 지혜 문학의 친밀한 훈계체를 살리되, 한국어에서 자연스러운 호격으로 옮겼습니다. 남성 특정 호칭으로 고정하지 않기 위해 가족적 친밀감이 드러나는 표현을 택했습니다.
- source_word: ἐν ἀγαθοῖς
  english_pob_choice: in good things
  chosen_korean: 선한 일에서는
  alternatives_korean:
  - 좋은 것들 안에서
  - 선한 것들에서
  - 좋은 일들 가운데서
  lexicon: LSJ
  rationale: 문맥상 단순한 물건보다 베풂과 행위의 선함을 가리키므로, 한국어에서는 자연스럽게 ‘선한 일’로 풀었습니다.
- source_word: μὴ δῷς μῶμον
  english_pob_choice: do not add reproach
  chosen_korean: 책망을 더하지 말고
  alternatives_korean:
  - 비난을 더하지 말고
  - 수치를 더하지 말고
  - 흠을 더하지 말고
  lexicon: LSJ
  rationale: μῶμον은 여기서 선행에 덧붙는 비난·흠잡음을 뜻하므로, POB의 ‘reproach’에 맞춰 ‘책망’으로 옮겼습니다. ‘더하지 말고’는 금지의 동작성을 살리면서 한국어 어순에 맞춥니다.
- source_word: λύπην λόγων
  english_pob_choice: grief of words
  chosen_korean: 말로 인한 슬픔
  alternatives_korean:
  - 슬픔을 주는 말
  - 상처를 주는 말
  - 말의 슬픔
  lexicon: LSJ
  rationale: 그리스어의 압축된 표현을 한국어에서 과도하게 낯설지 않게 풀되, 말이 슬픔을 낳는다는 의미를 유지했습니다. POB의 직역적 긴장도 ‘말로 인한 슬픔’으로 어느 정도 보존했습니다.
theological_decisions:
- issue: 훈계의 직접 호칭과 명령문 톤
  chosen_reading: ‘내 아들아’로 친밀한 지혜 훈계의 호칭을 살리고, 뒤의 금지형은 공손한 명령체로 처리했습니다.
  alternative_readings:
  - ‘내 자녀야’로 더 중립적으로 처리
  - 전체를 서술형으로 완화
  rationale: 본문은 지혜서 특유의 교훈적 직접 호칭과 금지 명령을 가지므로, 이를 희석하지 않는 것이 원문의 수사 효과에 더 충실합니다.
  doctrine_reference: 지혜문학의 수사 구조 보존
- issue: ‘말로 인한 슬픔’의 해석
  chosen_reading: 그리스어의 압축된 구조를 해치지 않으면서도, 선물을 훼손하는 해로운 말이라는 의미를 드러내는 방향으로 옮겼습니다.
  alternative_readings:
  - ‘상처를 주는 말’로 의역
  - ‘슬픔의 말’로 더 직역
  rationale: 본문은 단순히 감정을 묘사하는 것이 아니라 베풂에 언어적 손상을 덧붙이지 말라는 경고이므로, 의미와 형식을 함께 반영하는 번역이 필요합니다.
  doctrine_reference: 지혜문학의 실천적 교훈
