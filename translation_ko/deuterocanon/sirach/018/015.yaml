  source_fidelity: 원문의 두 병렬 금지, 즉 선행에 μῶμος(비난·흠잡음)를 덧붙이지 말 것과 베풂에 말로 말미암은 슬픔을 덧붙이지 말 것을 대체로 반영합니다. 다만 ‘어떤 선물에도 말로 인한 슬픔’은 한국어에서 수식 관계가 다소 불분명하며, δόσις가 ‘선물’뿐 아니라 ‘주는 행위’를 가리킬 수 있다는 점을 살려 자연스럽게 옮기는 편이 좋습니다.
  naturalness: 현 번역은 ‘내 아들아’와 공손한 ‘마십시오’의 결합, 그리고 ‘말로 인한 슬픔을 더하다’라는 표현이 다소 경직됩니다. 직접 호칭의 친밀함은 유지하되 성별을 특정하지 않는 ‘내 아이야’를 사용하고, 압축된 그리스어 표현은 ‘사람을 슬프게 하는 말’로 풀면 현대 표준 한국어의 합쇼체로 자연스럽습니다.
