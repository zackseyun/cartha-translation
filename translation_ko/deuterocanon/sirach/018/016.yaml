  yaml_path: translation/deuterocanon/sirach/018/016.yaml
  text: Before you make a vow[a], prepare your vow[b], and do not be like one who tests Yahweh.
  footnotes:
  - marker: a
    text: The Hebrew phrase rendered “what is vowed” is difficult and may also be understood more simply as “your vow.” The sense is that one should be ready to fulfill a vow before making it.
    reason: lexical_alternative
  - marker: b
    text: The Greek parallel differs substantially here, reading, “Will not dew cool the heat? So a word is better than a gift.” This suggests a different textual form behind the Greek tradition.
    reason: textual_variant
translation:
  language: ko
  text: 서원하기 전에 서원할 것[a]을 준비하십시오. 야훼를 시험하는 사람처럼 되지 마십시오.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 נִדְרֶךָ의 형태와 정확한 뜻은 다소 불확실합니다. 문맥상 ‘당신의 서원’ 또는 ‘서원할 것’으로 이해할 수 있으며, 서원하기 전에 그것을 이행할 준비를 갖추라는 뜻으로 볼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어 평행 본문은 여기서 크게 다르게 읽습니다. “이슬이 더위를 식히지 않겠는가? 이와 같이 말이 선물보다 낫다.” 이는 그리스어 전승의 배후에 다른 본문 형태가 있었음을 시사합니다.
    reason: textual_variant
