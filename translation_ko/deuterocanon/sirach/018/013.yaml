base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/018/013.yaml
  text: A man's mercy is for his neighbor[a], but the Lord's mercy is for all flesh[b]; he rebukes and disciplines and teaches and turns back his flock like a shepherd.
  footnotes:
  - marker: a
    text: Or 'all humanity' or 'every living being'; Greek 'all flesh' is a broad biblical expression for creaturely life.
    reason: lexical_alternative
  - marker: b
    text: Or 'brings back' or 'restores'; the Greek literally means 'turning back,' fitting the image of a shepherd recovering strays.
    reason: lexical_alternative
translation:
  language: ko
  text: 사람의 긍휼은 자기 이웃에게 미치지만, 주님의 긍휼은 모든 육체를 향합니다[a]. 주님께서는 책망하시고 징계하시고 가르치시며, 목자처럼 자기 양 떼를 되돌아오게 하십니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘모든 인류’나 ‘모든 생명체’로 옮길 수 있습니다. 그리스어 ‘모든 육체’는 피조된 생명 전체를 아우를 수 있는 성서적 관용구입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘되돌리시며’, ‘다시 데려오시며’, 또는 ‘회복하시며’로 옮길 수 있습니다. 그리스어는 문자적으로 ‘돌이키다’라는 뜻이며, 길 잃은 양을 되찾는 목자의 모습과 잘 어울립니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεος
  english_pob_choice: mercy
  chosen_korean: 긍휼
  alternatives_korean:
  - 자비
  - 은혜
  lexicon: BDAG
  rationale: ἔλεος의 핵심은 불쌍히 여기고 선을 베푸는 자비로운 태도입니다. 한국어에서는 긍휼이 이 윤리적·신학적 무게를 비교적 직접적으로 살립니다.
- source_word: πλησίον
  english_pob_choice: neighbor
  chosen_korean: 이웃
  alternatives_korean:
  - 가까운 사람
  - 동료
  lexicon: BDAG
  rationale: 윤리적 문맥에서 πλησίον은 일반적으로 ‘이웃’이 가장 자연스럽고, 인간 사이의 관계적 범위를 분명히 드러냅니다.
- source_word: πᾶσαν σάρκα
  english_pob_choice: all flesh
  chosen_korean: 모든 육체
  alternatives_korean:
  - 모든 인간
  - 모든 생명체
  lexicon: BDAG
  rationale: σάρξ를 여기서 ‘타락한 육신’으로 읽지 않고 창조된 생명 전체를 가리키는 성서적 관용구로 보아, 직역성을 살린 ‘모든 육체’를 택했습니다.
- source_word: ἐπιστρέφων
  english_pob_choice: turns back
  chosen_korean: 다시 돌이키십니다
  alternatives_korean:
  - 되돌리십니다
  - 다시 돌아오게 하십니다
  - 회복하십니다
  lexicon: BDAG
  rationale: 동사는 문자적으로 ‘돌이키다/되돌아오게 하다’의 의미가 강하므로, 목자 이미지와 함께 길 잃은 양을 다시 데려오는 동작을 살렸습니다.
theological_decisions:
- issue: 주님의 자비의 범위
  chosen_reading: 주님의 긍휼은 ‘모든 육체’를 향한다는 넓은 범위를 그대로 살렸습니다.
  alternative_readings:
  - 모든 인간을 향함
  - 모든 생명체를 향함
  rationale: 본문은 인간의 이웃 사랑과 대비하여 하나님의 자비의 보편성과 성서적 관용구를 강조하므로, 범위를 좁히지 않고 그대로 옮기는 것이 적절합니다.
  doctrine_reference: 시락 18:13의 보편적 자비 표현
