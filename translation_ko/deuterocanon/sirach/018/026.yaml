  text: 아침부터 저녁까지 때가 바뀌고, 모든 것은 주님 앞에서 빠릅니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘때가 바뀝니다’, ‘시기가 바뀝니다’. 그리스어 καιρός는 문맥에 따라 시간, 시기, 기회를 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘주님의 시야에서는 모든 것이 빠릅니다’. 이 구절은 하나님 앞에서 만사가 얼마나 신속하게 달라지는지를 강조할 수 있습니다.
    reason: alternative_reading
