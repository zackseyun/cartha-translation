  - marker: b
    text: Or, 'everything is quick in the Lord's sight.' The phrase may emphasize how rapidly things change before God.
    reason: alternative_reading
translation:
  language: ko
  text: 아침부터 저녁까지 때가 바뀌며, 주님 앞에서는 모든 것이 신속합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘시간이 바뀝니다’, ‘시기가 바뀝니다’. 그리스어 καιρός는 문맥에 따라 시간, 시기, 기회를 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘주님의 보시기에는 모든 것이 빠릅니다’. ‘주님 앞에서’는 주님이 보시는 관점을 나타낼 수 있으며, 만사가 신속하게 달라진다는 뜻을 강조할 수 있습니다.
    reason: alternative_reading
