base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/018/008.yaml
  text: What is a man[a], and what is his use? What is his good[c][b], and what is his evil?
  footnotes:
  - marker: a
    text: 'Or ''human being'': the Greek has singular ἄνθρωπος, a generic term for a person or humanity represented in one man.'
    reason: lexical_alternative
  - marker: b
    text: Or 'purpose' or 'benefit' for 'use' (χρῆσις). The Greek asks about a human being's practical value or function.
    reason: lexical_alternative
  - marker: c
    text: '''Evil'' may also be understood more broadly as ''bad'' or ''harm''; the Greek κακόν can cover moral evil as well as what is adverse or harmful.'
    reason: lexical_alternative
translation:
  language: ko
  text: 사람이란 무엇이며, 그의 쓰임은 무엇입니까? 그의 선은 무엇이며, 그의 악은 무엇입니까?[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘인간’입니다. 그리스어 ἄνθρωπος는 단수이지만 보편적 인간을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘목적’, ‘유익’입니다. χρῆσις는 실용적 가치나 기능을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘선’은 ‘좋음’ 또는 ‘유익’으로도 이해될 수 있습니다. ἀγαθόν은 폭넓은 긍정적 가치를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τί ἄνθρωπος
  english_pob_choice: What is a man[a]
  chosen_korean: 사람이란 무엇이며
  alternatives_korean:
  - 한 사람은 무엇이며
  - 인간이란 무엇이며
  lexicon: LSJ
  rationale: ἄνθρωπος는 여기서 단수이지만 일반적인 인간을 가리키므로, 한국어에서는 성별 고정어보다 포괄적인 ‘사람’이 본문의 보편성을 더 자연스럽게 살립니다.
- source_word: χρῆσις
  english_pob_choice: use[b]
  chosen_korean: 쓰임
  alternatives_korean:
  - 용도
  - 사용
  - 기능
  lexicon: LSJ
  rationale: χρῆσις는 사용됨, 실용적 가치, 유용성의 뜻을 가지므로, ‘쓰임’이 ‘use’의 직접성이 있으면서도 사람의 실용적 가치라는 뉘앙스를 잘 드러냅니다.
- source_word: τὸ ἀγαθὸν αὐτοῦ
  english_pob_choice: his good[c][b]
  chosen_korean: 그의 선은 무엇이며
  alternatives_korean:
  - 그의 좋은 것은 무엇이며
  - 그의 유익은 무엇이며
  lexicon: LSJ
  rationale: 중성 명사 ἀγαθόν은 여기서 사람의 ‘좋음/선한 것’을 묻는 말이므로, 한국어에서는 도덕적·존재론적 폭을 유지하는 ‘선’이 가장 압축적입니다.
- source_word: τὸ κακὸν αὐτοῦ
  english_pob_choice: his evil
  chosen_korean: 그의 악은 무엇입니까?
  alternatives_korean:
  - 그의 나쁜 것은 무엇입니까?
  - 그의 해악은 무엇입니까?
  lexicon: LSJ
  rationale: κακόν은 도덕적 악과 불리함/해로움의 뜻을 함께 가질 수 있지만, 선과의 대구를 살리기 위해 기본값으로 ‘악’을 택했습니다.
theological_decisions:
- issue: ἄνθρωπος의 일반적 인간 지칭을 한국어에서 어떻게 드러낼지
  chosen_reading: ‘사람’으로 보편적 인간을 가리키되, 단수 수사를 유지했습니다.
  alternative_readings:
  - ‘한 사람’
  - ‘인간’
  rationale: 본문은 단수형 수사로 인간 일반에 대한 숙고를 제시하므로, 한국어에서도 단수성을 유지하면서 성별 고정의 부담을 줄이는 표현이 적절합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
- issue: ἀγαθόν/κακόν의 대조를 윤리적 의미로 유지할지 여부
  chosen_reading: ‘선’과 ‘악’으로 번역했습니다.
  alternative_readings:
  - ‘좋음’과 ‘나쁨’
  - ‘유익’과 ‘해악’
  rationale: 지혜문학의 대구법에서 이 어휘들은 단순한 실용성보다 인간 존재의 도덕적 성격을 묻는 울림이 강하므로, 그 무게를 살렸습니다.
  doctrine_reference: DOCTRINE.md §Lexical/theological fidelity
