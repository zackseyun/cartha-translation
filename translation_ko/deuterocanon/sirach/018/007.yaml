    text: 또는 ‘사람이 완수할 때에는’, ‘사람이 완성할 때에는’으로 옮길 수 있습니다. 헬라어 동사는 어떤 것을 끝까지 이루어 완결한다는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘곤혹에 빠지게 될 것입니다’, ‘막막해질 것입니다’로 옮길 수 있습니다. 헬라어는 답이나 방도를 찾지 못해 난처해지는 상태를 가리킵니다.
    reason: lexical_alternative
