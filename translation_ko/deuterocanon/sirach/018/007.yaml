  naturalness: ‘사람이 끝마칠 때에는 비로소 시작하며’와 ‘멈출 때에는 어찌할 바를 모르게 될 것입니다’는 현대 표준 한국어의 격식 있는 잠언체로 자연스럽습니다. 각 주석 표지도 해당 어구 바로 뒤에 배치했습니다.
