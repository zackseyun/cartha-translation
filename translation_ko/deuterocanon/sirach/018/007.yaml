  yaml_path: translation/deuterocanon/sirach/018/007.yaml
  text: When a man has finished[a], then he is just beginning; and when he stops[b], then he will be at a loss.
  footnotes:
  - marker: a
    text: Or 'When a man completes, then he begins.' The Greek verb can be rendered more formally as 'completes' or 'brings to completion.'
    reason: lexical_alternative
  - marker: b
    text: Or 'he will be perplexed' or 'he will be baffled.' The Greek suggests being left without a way forward or without an answer.
    reason: lexical_alternative
translation:
  language: ko
  text: 사람이 일을 마치면, 그때 비로소 시작하는 것이며, 그가 멈추면 그때는 갈 길을 알지 못하게 됩니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '완수하면', '완성하면'으로 옮길 수 있습니다. 헬라어 동사는 무엇인가를 끝까지 이루어 내는 뜻을 담을 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '갈 길을 알지 못하게 됩니다', '어찌할 바를 모르게 됩니다', '당황하게 됩니다'로 옮길 수 있습니다. 헬라어는 앞으로 나아갈 길이나 답을 잃은 상태를 시사합니다.
    reason: lexical_alternative
