  text: 영원히 사시는 분은 모든 것을 한꺼번에 창조하셨습니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “모든 것을 집합적으로 창조하셨다”, “모든 것을 공동으로 창조하셨다”로도 옮길 수 있습니다. κοινῇ는 압축된 부사로, 창조의 전체성을 강조할 수 있습니다.
    reason: lexical_alternative
