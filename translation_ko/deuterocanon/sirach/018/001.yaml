  source_fidelity: 본문의 ‘영원히 사시는 분’과 ‘창조하셨습니다’는 Ὁ ζῶν εἰς τὸν αἰῶνα 및 ἔκτισεν을 충실히 옮깁니다. ‘한꺼번에’는 κοινῇ의 집합적 범위를 자연스럽게 표현할 수 있으나 시간적 동시성으로도 읽힐 수 있으므로 각주에서 그 대안을 더 정확히 밝혀야 합니다.
