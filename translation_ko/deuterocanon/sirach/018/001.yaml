translation:
  language: ko
  text: 영원히 사시는 분은 모든 것을 한꺼번에 창조하셨습니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “모든 것을 함께 창조하셨다” 또는 “모든 것을 전체로서 창조하셨다”로도 옮길 수 있습니다. 그리스어 부사 κοινῇ는 간결한 표현으로, 창조된 모든 것을 하나의 전체로 보는 뜻을 강조할 수 있습니다.
    reason: lexical_alternative
