theological_decisions:
- issue: 주어를 하나님으로 명시하지 않는 표현 유지
  chosen_reading: 주어를 '영원히 사시는 분'으로 두고, 본문에 없는 '하나님'이나 '주'를 덧붙이지 않았습니다.
  alternative_readings:
  - 하나님께서는 영원히 사시며 모든 것을 한꺼번에 창조하셨습니다
  - 주님은 영원히 사시며 모든 것을 한꺼번에 창조하셨습니다
  rationale: 그리스어 본문은 θεός/κύριος가 아니라 서술적 분사구로 주어를 지시하므로, 원문이 말하는 방식 자체를 보존했습니다.
  doctrine_reference: 원문 우선 원칙; 본문에 없는 신칭을 보강하지 않음.
