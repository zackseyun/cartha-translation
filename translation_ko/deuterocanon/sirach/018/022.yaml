  verdict: revise
  source_fidelity: 첫 절은 εὐχὴν ἀποδοῦναι와 εὐκαίρως를 정확히 반영합니다. 그러나 초안의 ‘죽을 때까지 미루어 의롭다 함을 받으려 하지 마십시오’는 ‘미룸으로써 의롭다 함을 받으려 한다’는 수단·의도 관계를 암시할 수 있습니다. 그리스어는 죽음에 이를 때까지 δικαιωθῆναι를 지체하지 말라는 뜻이므로, 지연의 대상을 명시하는 편이 안전합니다.
  naturalness: ‘서원을 제때에 갚는 데 방해를 받지 말고’는 현대 표준어 합쇼체로 자연스럽습니다. ‘의롭다 하심을 받는 일을 미루지 마십시오’는 원문의 시간적 관계를 분명히 하면서 한국어 문장도 매끄럽습니다.
  terminology: ‘서원’과 ‘갚다’는 이 문맥의 관용적 결합에 적절합니다. δικαιωθῆναι는 본문에서 ‘의롭다 하심을 받다’로 유지하되, 각주에서 ‘옳다고 인정받다/의롭다고 드러나다’라는 넓은 가능성을 밝혀 후대의 전문적 칭의 개념으로 한정하지 않습니다.
  issues:
  - severity: medium
    issue: 둘째 절의 ‘미루어 … 받으려 하지 마십시오’가 원문의 수식 관계를 흐립니다.
    rationale: μὴ μείνῃς ἕως θανάτου δικαιωθῆναι는 ‘의롭다 하심을 받는 것을 죽을 때까지 미루지 말라’는 경고입니다. 초안은 미룸이 의롭다 함을 받기 위한 방법인 듯 읽힐 여지가 있습니다.
  - severity: low
    issue: 각주의 ‘후대의 기술적 칭의보다’는 비교 구문이 다소 부자연스럽고 의미를 지나치게 대립시킵니다.
    rationale: 그리스어의 의미 범위가 후대의 기술적 용법과 반드시 대립하는 것은 아닙니다. ‘후대의 기술적 의미의 칭의에만 한정되지 않고’라고 하면 범위의 개방성을 더 정확히 표현합니다.
  revised_text: 서원을 제때에 갚는 데 방해를 받지 말고, 죽을 때까지 의롭다 하심을 받는 일을 미루지 마십시오.[a]
