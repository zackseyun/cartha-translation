  yaml_path: translation/deuterocanon/sirach/018/022.yaml
  text: Do not be hindered from paying a vow in due time[a], and do not wait until death to be justified.
  footnotes:
  - marker: a
    text: Or 'to be vindicated' or 'to be shown righteous.' The Greek can refer more broadly to being found in the right, not necessarily to later technical uses of 'justification.'
    reason: lexical_alternative
translation:
  language: ko
  text: 서원을 제때에 갚는 데 방해를 받지 말고, 죽을 때까지 미루어 의롭다 함을 받으려 하지 마십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '옳다고 인정받다', '의롭다고 드러나다'. 그리스어는 후대의 기술적 '칭의'보다 더 넓게, 올바른 편에 서 있는 것으로 판명되는 뜻을 가질 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐμποδισθῇς
  english_pob_choice: be hindered
  chosen_korean: 방해를 받지 말고
  alternatives_korean:
  - 가로막히지 말고
  - 지장을 받지 말고
  - 방해되지 말고
  lexicon: LSJ
  rationale: 수동적 억제 의미를 살리면서도 한국어에서 자연스러운 권고 표현으로 옮겼습니다. '방해를 받다'는 외적 장애로 인해 실행이 막히는 뜻을 분명히 드러냅니다.
- source_word: ἀποδοῦναι εὐχήν
  english_pob_choice: paying a vow
  chosen_korean: 서원을 제때에 갚는
  alternatives_korean:
  - 서원을 이루는
  - 서원을 이행하는
  - 서원을 갚는
  lexicon: LSJ
  rationale: εὐχήν은 이 문맥에서 '기도'보다 '서원'이 자연스럽고, ἀποδοῦναι와 결합한 관용적 뜻을 살려 '갚다'를 썼습니다. '제때에'는 εὐκαίρως의 적절성과 시의성을 함께 담습니다.
- source_word: μὴ μείνῃς ἕως θανάτου
  english_pob_choice: do not wait until death
  chosen_korean: 죽을 때까지 미루어
  alternatives_korean:
  - 죽을 때까지 기다려
  - 죽음에 이를 때까지 지체하여
  - 죽을 때까지 미뤄
  lexicon: LSJ
  rationale: 여기서 μείνῃς는 단순한 '머무르다'보다 행동을 늦추는 뜻이므로, 현대 한국어의 경고로는 '미루다'가 가장 분명합니다. '죽을 때까지'는 지연의 극한을 그대로 살립니다.
- source_word: δικαιωθῆναι
  english_pob_choice: to be justified
  chosen_korean: 의롭다 함을 받으려 하지 마십시오
  alternatives_korean:
  - 의롭다 인정받으려 하지 마십시오
  - 옳다 함을 받으려 하지 마십시오
  - 변호받으려 하지 마십시오
  lexicon: LSJ
  rationale: 직접적인 μορφή와 연관성을 보존하기 위해 '의롭다 함을 받다'를 선택했습니다. 본문의 지혜문맥을 흐리지 않으면서도, 영어 POB가 보존한 δικαιόω 계열의 신학적 긴장을 한국어로 드러냅니다.
theological_decisions:
- issue: δικαιωθῆναι의 의미 범위
  chosen_reading: '''의롭다 함을 받다''로 옮기되, 여기서는 종말론적·법정적 선언보다 하나님 앞에서 ''옳다고 인정됨/의롭다 인정됨''의 넓은 뜻을 열어 둡니다.'
  alternative_readings:
  - '''변호받다'''
  - '''옳다고 인정받다'''
  - '''의롭다 함을 받다''를 신학적으로 좁게 이해'
  rationale: 집회서의 권고는 회개와 순종을 미루지 말라는 지혜적 권면입니다. 따라서 후대 바울서신의 기술적 칭의 교리로 좁히지 않되, ελλην어 어근과 영어 POB의 긴장을 보존하도록 번역했습니다.
  doctrine_reference: Contested terms table for δικαιοσύνη-related language; Translation philosophy §§1, 3, 5
