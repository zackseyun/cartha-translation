  text: Every prudent man has recognized wisdom[a], and to the one who found her he will give praise.
  footnotes:
  - marker: a
    text: Or 'Every prudent person has recognized wisdom, and will give praise to the one who found it.' The Greek uses a masculine singular term for the discerning person and a feminine pronoun for wisdom.
    reason: lexical_alternative
translation:
  language: ko
  text: 모든 분별 있는 사람은 지혜를 알아보았고, 그 지혜를 찾아낸 이에게 그는 찬양을 드립니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 분별 있는 사람을 가리키는 남성 단수 형용사와 지혜를 가리키는 여성 대명사를 사용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς συνετὸς
  english_pob_choice: Every prudent man
  chosen_korean: 모든 분별 있는 사람
  alternatives_korean:
  - 모든 신중한 사람
  - 모든 지혜로운 사람
  lexicon: LSJ
  rationale: πᾶς συνετὸς는 보편적 진술로서 ‘분별 있는’이 πρακτική한 판단력을 살리면서도 자연스러운 표준어 문맥을 만듭니다. 영어 POB의 ‘man’은 그리스어 남성형을 반영하지만, 한국어에서는 문맥상 대표성 있는 인간 일반으로 풀어도 원문의 성별 표지가 지나치게 강조되지 않습니다.
- source_word: ἔγνω σοφίαν
  english_pob_choice: has recognized wisdom
  chosen_korean: 지혜를 알아보았고
  alternatives_korean:
  - 지혜를 알았고
  - 지혜를 인식했고
  lexicon: LSJ
  rationale: ἔγνω는 단순 보유 지식보다 ‘알아차려 확증하다’는 완료된 인식의 뉘앙스가 있어 ‘알아보았고’로 옮겼습니다. ‘지혜’를 목적어로 두어 원문의 인식 대상을 분명히 했습니다.
- source_word: τῷ εὑρόντι αὐτὴν
  english_pob_choice: to the one who found her
  chosen_korean: 그 지혜를 찾아낸 이에게
  alternatives_korean:
  - 그것을 찾아낸 이에게
  - 지혜를 발견한 이에게
  lexicon: LSJ
  rationale: τῷ εὑρόντι는 관사+분사 구조이므로 서술적 명사구로 처리했습니다. αὐτὴν은 σοφίαν을 가리키는 여성 대명사이므로 ‘그 지혜’를 유지해 인칭화된 지혜의 문학적 성격을 보존했습니다.
- source_word: δώσει ἐξομολόγησιν
  english_pob_choice: he will give praise
  chosen_korean: 그는 찬양을 드립니다
  alternatives_korean:
  - 그는 찬양을 줄 것입니다
  - 그는 감사의 찬양을 드립니다
  lexicon: LSJ
  rationale: ἐξομολόγησις는 이 문맥에서 죄 고백보다 공개적 찬양·감사의 뜻이 강합니다. 한국어에서는 ‘드리다’가 예를 갖춘 헌정·찬양 표현으로 자연스럽고, 미래형은 문장 흐름상 현재시제 종결로도 예언적 진술을 전달할 수 있습니다.
theological_decisions:
- issue: 지혜의 여성 지시와 인칭화 유지
  chosen_reading: ‘지혜’를 여성적으로 지시하는 원문의 문학적 특징을 살려 ‘그 지혜’를 유지했습니다.
  alternative_readings:
  - 중성적으로 ‘그것을 찾아낸 이에게’로 완화
  rationale: 원문은 σοφία를 여성 대명사 αὐτή로 받습니다. 이를 중성화하면 지혜문학의 인격화된 표현이 약해지므로, 한국어에서도 ‘그 지혜’를 유지해 문학적·신학적 결을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md §Translation philosophy #4'
