base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/018/021.yaml
  text: Before you become sick[a], humble yourself, and in the time of sins show repentance.
  footnotes:
  - marker: a
    text: Or 'show a turning back' / 'show your return.' The Greek ἐπιστροφή can denote a turning back; here it is rendered 'repentance' because of the immediate reference to sins.
    reason: lexical_alternative
translation:
  language: ko
  text: 병들기 전에 스스로 낮추십시오. 죄를 지을 때에 회개를 나타내십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘회개’로 옮긴 그리스어 ἐπιστροφή는 문자적으로 ‘돌아섬’, ‘돌아옴’, 또는 ‘전환’을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὶν ἀρρωστῆσαί σε
  english_pob_choice: Before you become sick
  chosen_korean: 병들기 전에
  alternatives_korean:
  - 아프기 전에
  - 병이 들기 전에
  lexicon: LSJ
  rationale: πρὶν + 부정사 구조의 선행성을 자연스러운 한국어로 옮기기 위해 ‘-기 전에’를 사용하고, ἀρρωστῆσαί의 발병/쇠약 시작을 반영해 ‘병들다’를 택했습니다.
- source_word: ταπεινώθητι
  english_pob_choice: humble yourself
  chosen_korean: 스스로 낮추십시오
  alternatives_korean:
  - 겸손하십시오
  - 자신을 낮추십시오
  lexicon: LSJ
  rationale: 형식상 수동 명령이지만 권고문맥에서 자발적 자기 낮춤의 뜻이므로, 직접적이고 현대적인 합쇼체로 옮겼습니다.
- source_word: ἐν καιρῷ ἁμαρτημάτων
  english_pob_choice: in the time of sins
  chosen_korean: 죄악의 때에
  alternatives_korean:
  - 죄의 때에
  - 죄를 범할 때에
  lexicon: LSJ
  rationale: ἁμαρτημάτων의 복수성을 살려 죄의 행위들이 일어나는 때를 가리키는 표현으로 압축해 옮겼습니다.
- source_word: ἐπιστροφήν
  english_pob_choice: repentance
  chosen_korean: 회심
  alternatives_korean:
  - 돌아섬
  - 돌아옴
  - 회개
  lexicon: LSJ
  rationale: 직역하면 ‘돌아섬/돌아옴’이 가능하지만, 바로 앞의 ‘죄악’과 결합된 도덕적 촉구이므로 방향 전환의 종교윤리적 의미를 드러내는 ‘회심’을 선택했습니다.
theological_decisions:
- issue: ἐπιστροφήν의 의미 범위
  chosen_reading: 회심
  alternative_readings:
  - 돌아섬
  - 회개
  rationale: 본문은 단순한 위치 이동이 아니라 죄와 관련된 삶의 방향 전환을 촉구하므로, 한국어 독자가 즉시 윤리적 전환으로 이해할 수 있는 ‘회심’이 가장 적절합니다.
  doctrine_reference: translation philosophy §§1, 3, 6
- issue: ταπεινώθητι의 화자 태도
  chosen_reading: 스스로 낮추십시오
  alternative_readings:
  - 겸손하십시오
  - 자신을 낮추십시오
  rationale: 지혜문학의 권면으로서 자발적 자기 낮춤을 요구하는 뉘앙스를 살리되, 수동의 ‘낮아지다’로만 읽히지 않도록 능동적 자기행위를 분명히 했습니다.
  doctrine_reference: translation philosophy §§1, 6
