base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/018/032.yaml
  text: Do not delight in a mere scrap of pleasure[b][a], for its end is poverty.
  footnotes:
  - marker: a
    text: Hebrew final clause uncertain. The Cairo Geniza Hebrew reads literally something like 'whose פי of two is its poverty,' which is difficult to construe. The Greek parallel reads, 'Do not rejoice in much luxury, nor be bound to its expense,' supporting the sense that indulgence ends in financial loss.
    reason: textual_variant
  - marker: b
    text: Or 'Do not delight in even a little pleasure.' The Hebrew שֶׁמֶץ can mean a small fragment or trace.
    reason: lexical_alternative
translation:
  language: ko
  text: 작은 쾌락에라도 기뻐하지 마십시오. 그 끝은 가난입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 말미는 전승상 난해합니다. 카이로 겐자 히브리어는 직역하면 ‘그것의 두 배/몫의 가난’에 가까운 표현을 보이지만, 문맥상 사치의 결과가 빈곤이라는 뜻으로 이해하는 것이 자연스럽습니다.
    reason: textual_variant
  - marker: b
    text: ‘작은’은 히브리어 שֶׁמֶץ가 뜻할 수 있는 ‘아주 조금, 작은 조각, 흔적’의 뉘앙스를 반영한 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּשְׂמַח
  english_pob_choice: Do not delight
  chosen_korean: 기뻐하지 마십시오
  alternatives_korean:
  - 즐기지 마십시오
  - 흥분하지 마십시오
  - 마음 두지 마십시오
  lexicon: HALOT
  rationale: שמַח의 금지형은 단순한 감정 표출보다 어떤 것에 즐거움을 두는 태도를 가리키므로, 합쇼체의 직접 금지 표현으로 자연스럽게 옮겼습니다.
- source_word: שֶׁמֶץ
  english_pob_choice: a mere scrap
  chosen_korean: 작은
  alternatives_korean:
  - 조그만
  - 하찮은
  - 한 조각의
  lexicon: HALOT
  rationale: שֶׁמֶץ는 작은 조각·흔적을 뜻하므로, ‘작은’으로 그 축소 의미를 살리되 한국어 문맥에서 과도한 장식 없이 읽히게 했습니다.
- source_word: תַּעֲנוּג
  english_pob_choice: pleasure
  chosen_korean: 쾌락
  alternatives_korean:
  - 즐거움
  - 기쁨
  - 향락
  lexicon: HALOT
  rationale: 지혜문맥의 תַּעֲנוּג는 단순한 기쁨보다 감각적·세속적 즐김의 뉘앙스가 있어, 문맥상 경고의 힘을 살리는 ‘쾌락’을 택했습니다.
- source_word: רֵישׁוֹ
  english_pob_choice: poverty
  chosen_korean: 가난
  alternatives_korean:
  - 빈곤
  - 궁핍
  - 결핍
  lexicon: HALOT
  rationale: רֵישׁ는 가난·궁핍의 뜻이므로, 한국어 성경 문맥에서 가장 직접적이고 평이한 ‘가난’으로 옮겼습니다.
theological_decisions:
- issue: 히브리어 말미의 난해한 구절 처리
  chosen_reading: 그 끝은 가난입니다로 옮겨, 본문이 경고하는 결과를 분명하게 드러냈습니다.
  alternative_readings:
  - 그것의 두 배는 가난입니다
  - 그것의 몫은 가난입니다
  - 문자적으로 불분명한 어구를 그대로 살리는 방식
  rationale: 현존 히브리어는 해석이 어려우며, 평행하는 그리스어가 사치/지출의 결과를 경고하므로, 지혜문맥에 맞게 ‘끝’과 ‘가난’을 통해 의미를 투명하게 제시했습니다.
  doctrine_reference: 본문 비평 및 지혜문학 해석
- issue: 그리스어 평행문의 ‘많은 사치/과다한 향락’과 히브리어 ‘작은 쾌락’의 긴장
  chosen_reading: 히브리어의 ‘작은’과 POB의 ‘mere scrap’ 뉘앙스를 반영해 ‘작은 쾌락’으로 번역했습니다.
  alternative_readings:
  - 사치
  - 많은 쾌락
  - 한 줌의 쾌락
  rationale: 히브리어 전승은 ‘작음’을, 그리스어는 ‘많음/사치’를 시사해 긴장이 있으므로, 본문 표면의 히브리어를 기본으로 하되 경고의 요지를 해치지 않는 범위에서 자연스럽게 정리했습니다.
  doctrine_reference: 본문 전승의 이중 증거
