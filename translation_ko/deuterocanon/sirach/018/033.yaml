  text: Do not be a glutton and a drunkard[b][a], when there is nothing in your purse.
  footnotes:
  - marker: a
    text: Hebrew בַּכִּים is difficult; the Greek parallel reads 'in your purse' (ἐν μαρσιππίῳ), which supports the economic sense adopted here.
    reason: textual_variant
  - marker: b
    text: 'The Greek witness expands the warning: ''Do not become poor by feasting on borrowed money, when you have nothing in your purse.'''
    reason: alternative_reading
translation:
  language: ko
  text: 술꾼과 주정뱅이가 되지 마십시오. 아무것도 없을 때에는 더더욱 그러합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 마지막 어휘는 불확실하며, 그리스어 평행본문은 ‘돈주머니 안’이라는 경제적 의미를 지지합니다.
    reason: textual_variant
  - marker: b
    text: 그리스어 증언은 경고를 더 확장해, ‘빌린 돈으로 잔치를 벌여 가난해지지 말라’는 뜻을 드러냅니다.
    reason: alternative_reading
lexical_decisions:
- source_word: זוֹלֵל
  english_pob_choice: glutton
  chosen_korean: 술꾼
  alternatives_korean:
  - 탐식하는 사람
  - 대식가
  lexicon: HALOT
  rationale: 히브리어는 본래 ‘탐식하는 자’의 뜻이지만, 본절에서는 곧바로 이어지는 ‘주정뱅이’와 한 쌍을 이루는 경계 표현이므로 한국어에서는 식탐보다 과음·방탕의 생활상을 포괄하는 ‘술꾼’으로 옮겨 부자연스러운 중복을 피했습니다.
- source_word: וְסוֹבֵא
  english_pob_choice: drunkard
  chosen_korean: 주정뱅이
  alternatives_korean:
  - 술꾼
  - 과음하는 사람
  lexicon: HALOT
  rationale: 과도한 음주 습관을 가리키는 표현으로, 경고의 도덕적 뉘앙스를 살리는 ‘주정뱅이’가 가장 직접적입니다.
- source_word: וּמְאוּמָה אֵין
  english_pob_choice: when there is nothing
  chosen_korean: 아무것도 없을 때에는
  alternatives_korean:
  - 아무것도 없는데
  - 무엇 하나 없을 때에는
  lexicon: HALOT
  rationale: 히브리어의 부정적 조건절을 자연스러운 한국어 경고문으로 풀어, 소유의 결핍 상태를 분명히 드러냈습니다.
- source_word: בַּכִּים
  english_pob_choice: in your purse
  chosen_korean: 더더욱 그러합니다
  alternatives_korean:
  - 지갑 속에
  - 주머니에
  lexicon: HALOT
  rationale: 이 절의 마지막 어휘는 히브리어 본문만으로는 불확실하고, 영어 POB가 주석에서 지적하듯 그리스어 평행본문이 경제적 결핍의 의미를 지지합니다. 따라서 본문에는 과도한 보충을 넣지 않고, 앞절 전체의 절박한 금지 의미를 한국어로 매끄럽게 유지했습니다.
theological_decisions:
- issue: 히브리어 본문이 불분명한 마지막 구절을 본문에서 어떻게 처리할지
  chosen_reading: 히브리어의 핵심 경고인 ‘술꾼과 주정뱅이’ 금지를 본문에 두고, 결말은 경제적 결핍을 암시하는 방식으로 과도한 해석 없이 처리했습니다.
  alternative_readings:
  - ‘지갑 속에 아무것도 없을 때에는’
  - ‘돈주머니에 아무것도 없을 때에는’
  rationale: 이 절은 보이는 히브리어와 그리스어 평행본문 사이에 긴장이 있으므로, 그 긴장을 평평하게 만들지 않고 본문 차원에서는 히브리어의 경고를 우선하면서도 결핍 상황이라는 방향만 보존했습니다.
  doctrine_reference: 'PHILOSOPHY.md: extant Hebrew first, Greek parallel as consistency check; avoid over-expanding uncertain wording.'
