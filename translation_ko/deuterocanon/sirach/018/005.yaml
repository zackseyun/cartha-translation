  text: Who can number the might of his majesty? And who can add to recounting his mercies?[a]
  footnotes:
  - marker: a
    text: Or 'Who can continue fully recounting his mercies?' The Greek literally says 'who will add to recounting,' an idiom for extending the narration further.
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 위엄의 권능을 누가 헤아릴 수 있겠습니까? 또 누가 그의 자비를 더 이어서 자세히 이야기할 수 있겠습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘누가 그의 자비를 자세히 이야기하는 일에 더 보탤 수 있겠습니까?’ 그리스어는 문자적으로 ‘자세히 이야기하는 데 더하다’라고 말하며, 관용적으로는 그 서술을 더 이어 가거나 완결한다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: κράτος
  english_pob_choice: might
  chosen_korean: 능력
  alternatives_korean:
  - 권능
  - 힘
  - 위력
  lexicon: BDAG
  rationale: κράτος는 드러난 힘과 강력함을 가리키므로, 한국어에서는 문맥상 자연스러운 ‘능력’으로 옮기되, 하나님의 위엄과 결합된 강한 힘의 뉘앙스를 살렸습니다.
- source_word: μεγαλωσύνης
  english_pob_choice: majesty
  chosen_korean: 위엄
  alternatives_korean:
  - 장엄함
  - 위대함
  - 엄위
  lexicon: LSJ
  rationale: κράτος와 결합된 하나님의 고양된 상태를 가리키므로, 평이한 ‘위대함’보다 경외감을 살리는 ‘위엄’이 더 적절합니다.
- source_word: ἐξαριθμήσεται
  english_pob_choice: can number
  chosen_korean: 헤아릴 수 있겠습니까
  alternatives_korean:
  - 셀 수 있겠습니까
  - 계산할 수 있겠습니까
  - 열거할 수 있겠습니까
  lexicon: BDAG
  rationale: 수량을 끝까지 산정할 수 있는지를 묻는 수사 의문이므로, 자연스러운 한국어 관용 표현인 ‘헤아릴 수 있겠습니까’로 옮겼습니다.
- source_word: τὰ ἐλέη αὐτοῦ
  english_pob_choice: his mercies
  chosen_korean: 그의 자비들을
  alternatives_korean:
  - 그의 긍휼들을
  - 그의 자비의 행위들을
  - 그의 자비
  lexicon: BDAG
  rationale: 복수형 ἐλέη를 살려 하나님이 베푸신 여러 자비의 행동들을 가리키는 뜻을 드러내기 위해 복수형 ‘자비들을’로 옮겼습니다.
theological_decisions:
- issue: ἐκδιηγήσασθαι의 관용적 의미를 한국어로 어떻게 살릴지
  chosen_reading: ‘자세히 이야기하는 데 더할 수 있겠습니까’로 옮겨, 단순한 덧붙임이 아니라 계속해서 완전히 서술하는 관용 표현임을 드러냈습니다.
  alternative_readings:
  - ‘계속해서 이야기할 수 있겠습니까’
  - ‘끝까지 말해 나갈 수 있겠습니까’
  - ‘완전히 설명할 수 있겠습니까’
  rationale: 그리스어는 ‘덧붙이다’와 ‘자세히 설명하다’의 관용적 결합으로, 하나님 자비의 이야기를 더 이어 가거나 완결할 수 없다는 뜻을 담습니다. 한국어에서도 같은 수사성을 보존하는 것이 중요합니다.
  doctrine_reference: Sirach 18:5의 수사 의문은 하나님의 무한한 자비를 강조하는 문학적 장치입니다.
