translation:
  language: ko
  text: 말에 통달한 이들은 그들도 지혜로워졌고, 정확한 잠언들을 쏟아냈습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνετοὶ ἐν λόγοις
  english_pob_choice: prudent in words
  chosen_korean: 말에 통달한 이들
  alternatives_korean:
  - 말에 신중한 이들
  - 말에 분별 있는 이들
  - 말에 현명한 이들
  lexicon: συνετός, λόγος
  rationale: συνετός는 단순히 ‘신중한’보다 판단과 이해가 갖추어진 상태를 가리키므로, λόγοις를 ‘말’로 살려서 ‘말에 통달한 이들’로 옮겼습니다.
- source_word: ἐσοφίσαντο
  english_pob_choice: became wise
  chosen_korean: 지혜로워졌고
  alternatives_korean:
  - 지혜를 얻었고
  - 지혜롭게 되었고
  - 현명해졌고
  lexicon: σοφίζω
  rationale: 동사의 중간태가 그들 자신이 지혜로운 상태에 이르렀음을 나타내므로, 결과 상태를 자연스럽게 드러내는 ‘지혜로워졌고’를 택했습니다.
- source_word: ἀνώμβρησαν παροιμίας ἀκριβεῖς
  english_pob_choice: poured forth precise proverbs
  chosen_korean: 정확한 잠언들을 쏟아냈습니다
  alternatives_korean:
  - 정밀한 잠언들을 쏟아냈습니다
  - 정확한 격언들을 쏟아냈습니다
  - 빈틈없는 잠언들을 내뿜었습니다
  lexicon: ἀνώμβρησαν, παροιμία, ἀκριβής
  rationale: ἀνώμβρησαν은 풍성하게 쏟아 붓는 이미지를 살리고, παροιμία는 문학적 격언/잠언의 뜻이 있으므로 ‘잠언들’로, ἀκριβής는 내용의 정밀함을 드러내는 ‘정확한’으로 옮겼습니다.
