  text: And who can search out his mighty deeds?
translation:
  language: ko
  text: 그리고 누가 그의 놀라운 일들을 찾아낼 수 있겠습니까?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ τίς
  english_pob_choice: And who
  chosen_korean: 그리고 누가
  alternatives_korean:
  - 그리고 어떤 사람이
  - 그런데 누가
  lexicon: BDAG
  rationale: 반문을 자연스럽게 살리기 위해 τίς를 ‘누가’로 옮기고, 접속사 καὶ는 앞 문맥과 이어지는 ‘그리고’로 처리했습니다.
- source_word: ἐξιχνιάσει
  english_pob_choice: can search out
  chosen_korean: 찾아낼 수 있겠습니까
  alternatives_korean:
  - 샅샅이 더듬어 알아낼 수 있겠습니까
  - 추적하여 알아낼 수 있겠습니까
  - 완전히 헤아릴 수 있겠습니까
  lexicon: BDAG
  rationale: ‘깊이 추적하여 알아내다’는 뜻을 살리되, 한국어에서는 과도하게 장황한 표현보다 ‘찾아내다’가 본문의 반문적 무능력을 자연스럽게 전달합니다.
- source_word: τὰ μεγαλεῖα
  english_pob_choice: his mighty deeds
  chosen_korean: 그의 놀라운 일들
  alternatives_korean:
  - 그의 큰 일들
  - 그의 위대한 일들
  - 그의 능하신 일들
  lexicon: LSJ
  rationale: μεγαλεῖα는 단순한 ‘크다’보다 하나님이 행하신 위엄 있고 경이로운 행위들을 가리키므로, ‘놀라운 일들’이 의미와 문맥을 함께 반영합니다.
- source_word: αὐτοῦ
  english_pob_choice: his
  chosen_korean: 그의
  alternatives_korean:
  - 그분의
  - 하나님의
  lexicon: BDAG
  rationale: 대명사는 문맥상 하나님을 가리키므로, 직설적이면서도 자연스러운 소유격 ‘그의’로 옮겼습니다.
theological_decisions:
- issue: 반문이 드러내는 인간의 한계
  chosen_reading: 질문은 정보 요청이 아니라 하나님의 행위를 다 헤아릴 수 없다는 수사적 반문으로 읽었습니다.
  alternative_readings:
  - 단순한 가능성 질문으로 읽기
  - 지식의 부족만을 말하는 것으로 축소하기
  rationale: 문맥상 ‘누가…할 수 있겠습니까?’는 인간이 하나님의 위대한 행위를 완전히 탐지할 수 없다는 신학적 한계를 강조합니다.
  doctrine_reference: 하나님의 초월성과 인간 인식의 제한을 보존합니다.
