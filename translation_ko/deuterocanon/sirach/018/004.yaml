  terminology: 문맥상 αὐτοῦ는 하나님을 가리키며 ‘그의’는 원문의 대명사 표현을 보존합니다. τὰ μεγαλεῖα는 ‘그의 위대한 일들’로 옮겨 복수형과 행위성을 유지하는 것이 더 정확합니다.
