  terminology: λόγος는 ‘말’로 유지할 수 있습니다. κεχαριτωμένῳ는 여기서 ‘은혜로운’보다 현대 한국어에서 의미가 명료한 ‘친절한’으로 옮기고, 각주에서 ‘은혜가 있는’ 및 ‘호의로운’의 가능성을 밝혀 원문의 폭을 보존합니다.
