  source_fidelity: 본문의 ‘말’과 ‘좋은 선물’의 대비 및 수사 의문문은 그리스어 원문에 충실합니다. 다만 κεχαριτωμένῳ는 하나님에게서 은총을 받은 상태를 직접 진술한다기보다, 은혜롭고 호의적인 태도를 지닌 사람을 가리키므로 한국어에서는 신학적 함의가 과도하지 않은 표현이 더 적절합니다.
