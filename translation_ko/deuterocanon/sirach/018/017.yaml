base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/018/017.yaml
  text: Is not a word better than a good gift? And both are with a gracious man[a][b].
  footnotes:
  - marker: a
    text: Or 'speech' or 'a saying'; the Greek contrasts a spoken word with a material gift.
    reason: lexical_alternative
  - marker: b
    text: Or 'both are found in a gracious person.' The Greek phrase can indicate that both qualities belong to such a man.
    reason: lexical_alternative
translation:
  language: ko
  text: 말이 좋은 선물보다 낫지 않습니까? 그리고 그 둘은 은혜로운 사람에게 있습니다[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘말’의 의미를 더 강하게, ‘말씀’ 또는 ‘한마디’로도 옮길 수 있습니다. 그리스어 λόγος는 말해진 응답을 가리키며 물질적 선물과 대비됩니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘은혜로운 사람 안에 있다’가 아니라 ‘은혜로운 사람에게 속해 있다/발견된다’는 뜻으로도 이해될 수 있습니다. 그리스어 παρά + 여격은 그런 소속·존재를 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἰδοὺ
  english_pob_choice: Is not
  chosen_korean: …않습니까?
  alternatives_korean:
  - 보십시오, …아닙니까?
  - 과연 …아닙니까?
  lexicon: LSJ
  rationale: 수사적 질문을 여는 표현으로, 한국어에서는 ‘보십시오’를 직역하기보다 질문형 종결로 자연스럽게 옮기는 것이 문맥상 더 적절합니다.
- source_word: λόγος
  english_pob_choice: a word
  chosen_korean: 말
  alternatives_korean:
  - 한마디
  - 말씀
  - 발언
  lexicon: LSJ
  rationale: 여기서는 물질적 선물과 대비되는 짧은 언어 행위를 가리키므로, 간결한 ‘말’이 가장 직접적으로 대응합니다.
- source_word: δόμα ἀγαθόν
  english_pob_choice: a good gift
  chosen_korean: 좋은 선물
  alternatives_korean:
  - 훌륭한 선물
  - 좋은 증정물
  lexicon: LSJ
  rationale: δόμα는 ‘선물/증정물’의 뜻이므로, 현대 한국어에서 자연스럽고 대비가 분명한 ‘좋은 선물’로 옮겼습니다.
- source_word: κεχαριτωμένῳ
  english_pob_choice: gracious
  chosen_korean: 은혜로운
  alternatives_korean:
  - 호의로운
  - 너그러운
  - 은총을 입은
  lexicon: LSJ
  rationale: χαριτόω 계열은 단순한 친절함보다 은혜를 받은/은혜가 드러나는 성격을 띠므로, 성경적 어감을 살리는 ‘은혜로운’이 적절합니다.
theological_decisions:
- issue: ἀνδρὶ의 성별 표지와 잠언적 대표성
  chosen_reading: ‘사람’으로 완전 중립화하지 않고, 품사상 자연스러운 ‘사람’/‘은혜로운 사람’ 구조를 유지하되 대표적 남성형 표지를 한국어에서는 과도하게 드러내지 않았습니다.
  alternative_readings:
  - 남자에게
  - 한 사람에게
  rationale: 한국어에서는 ἀνδρὶ의 남성형이 잠언적 일반성을 약화시킬 수 있어, 원문의 대표성은 유지하되 문장 흐름상 가장 자연스러운 표현을 택했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
