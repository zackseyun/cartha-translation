  lexicon: LSJ
  rationale: 문맥이 ‘주는 행위’와 연결되므로, POB의 주석이 말하는 ‘악한 눈/인색함’의 뉘앙스를 포함하는 핵심 의미를 한국어로 가장 직접적으로 드러냈습니다.
- source_word: ἐκτήκει
