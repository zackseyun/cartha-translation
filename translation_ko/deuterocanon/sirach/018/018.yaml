  naturalness: 초안은 첫 절의 연결형 종결 ‘꾸짖고’와 둘째 절의 합쇼체 종결 ‘합니다’가 섞여 있어 문체가 고르지 않습니다. ‘비난하며’로 병렬 연결하면 현대 한국어의 격언체와 합쇼체가 자연스럽게 유지됩니다. ‘눈을 쇠하게 합니다’는 원문의 점진적 소모 비유를 자연스럽고 충분히 직역적으로 보존합니다.
  terminology: ‘감사할 줄 모르는 자’는 ἀχάριστος의 핵심을 과장 없이 옮깁니다. 본문에서는 βασκάνου를 ‘시기하는 자’로 유지하고, 각주에서 ‘악한 눈’ 및 인색하고 마지못해 주는 사람이라는 관용적 문맥 의미를 밝혀 모호성을 보존합니다.
