  text: A foolish ingrate reproaches[a], and the gift of an envious man wears out the eyes.
  footnotes:
  - marker: a
    text: Or 'the gift of one with an evil eye'—that is, a grudging or stingy giver. The Greek βασκάνος can evoke envy and the idiom of the 'evil eye.'
    reason: lexical_alternative
translation:
  language: ko
  text: 어리석은 배은망덕한 자는 꾸짖고, 시기하는 자의 선물은 눈을 시들게 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 βασκάνος는 ‘악한 눈’의 관용적 표현을 불러일으킬 수 있으며, 여기서는 시기와 인색함이 섞인 주는 태도를 가리킬 수 있습니다.
    reason: lexical_alternative
