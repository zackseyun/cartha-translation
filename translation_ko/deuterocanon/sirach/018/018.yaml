  yaml_path: translation/deuterocanon/sirach/018/018.yaml
  text: A foolish ingrate reproaches[a], and the gift of an envious man wears out the eyes.
  footnotes:
  - marker: a
    text: Or 'the gift of one with an evil eye'—that is, a grudging or stingy giver. The Greek βασκάνος can evoke envy and the idiom of the 'evil eye.'
    reason: lexical_alternative
translation:
  language: ko
  text: 어리석고 감사할 줄 모르는 자는 비난하며, 시기하는 자의 선물은 눈을 쇠하게 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 βασκάνου는 ‘악한 눈을 가진 사람’이라는 관용을 암시할 수 있습니다. 선물을 주는 문맥에서는 시기하거나 인색하여 마지못해 주는 사람을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
