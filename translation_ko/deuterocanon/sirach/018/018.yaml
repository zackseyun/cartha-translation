  - 마르게 합니다
  - 녹여 버립니다
  lexicon: LSJ
  rationale: ‘눈’을 대상으로 한 비유를 한국어에서 자연스럽게 살리면서도, 점진적으로 쇠하게 만드는 원뜻을 유지했습니다.
theological_decisions:
- issue: βασκάνου의 의미 범위
  chosen_reading: 단순한 ‘시기’뿐 아니라 주는 것을 아까워하는 ‘악한 눈/인색한 마음’의 뉘앙스를 함께 살리는 것으로 이해했습니다.
  alternative_readings:
  - 악한 눈을 가진 자의
  - 인색한 자의
  - 질투하는 자의
  rationale: POB 주석이 이 단어의 관용적 의미와 정서적 뉘앙스를 함께 제시하므로, 한국어 본문은 한 가지 좁은 뜻으로만 환원하지 않고 포괄적으로 읽히도록 했습니다.
  doctrine_reference: 지혜문학의 도덕적 경계와 탐욕/시기 경계
- issue: ὀνειδιεῖ의 시제·양태
  chosen_reading: 경구적 일반 진술로서 현재적 효력을 갖는 말로 옮겼습니다.
  alternative_readings:
  - 꾸짖을 것입니다
  - 꾸짖습니다
  rationale: 그리스어 미래형이지만 잠언형 진술에서는 일반적 사실을 나타내는 경우가 많아, 한국어에서도 단정적 현재로 자연스럽게 표현했습니다.
  doctrine_reference: 히브리/헬라 지혜문학의 격언체
