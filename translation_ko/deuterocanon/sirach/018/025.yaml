  text: Remember the time of famine in the time of plenty[a], and poverty and need in the days of wealth.
  footnotes:
  - marker: a
    text: Or 'season of hunger ... season of abundance.' The Greek contrasts appointed times of scarcity and fullness.
    reason: lexical_alternative
translation:
  language: ko
  text: 기근의 때를 풍족한 때에 기억하고, 가난과 궁핍을 부의 날들에 기억하십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘기근의 계절 … 풍요의 계절.’ 그리스어는 정해진 시기들 사이의 결핍과 충만의 대비를 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: μνήσθητι
  english_pob_choice: Remember
  chosen_korean: 기억하십시오
  alternatives_korean:
  - 기억하라
  - 떠올리십시오
  lexicon: BDAG
  rationale: 아오리스트 명령형의 직접적인 권면을 살리면서, 현대 합쇼체로 자연스럽고 분명하게 옮겼습니다.
- source_word: καιρὸν λιμοῦ / ἐν καιρῷ πλησμονῆς
  english_pob_choice: the time of famine / in the time of plenty
  chosen_korean: 기근의 때를 풍족한 때에
  alternatives_korean:
  - 기근의 시기를 풍족의 시기에
  - 굶주림의 때를 풍요의 때에
  lexicon: LSJ
  rationale: καιρός의 ‘때/시기’와 λιμός의 ‘기근’을 함께 반영했고, πλησμονή는 단순한 많음보다 ‘풍족함’이 대조를 더 분명히 드러냅니다.
- source_word: πτωχείαν καὶ ἔνδειαν
  english_pob_choice: poverty and need
  chosen_korean: 가난과 궁핍
  alternatives_korean:
  - 빈곤과 결핍
  - 가난과 부족
  lexicon: LSJ
  rationale: πτωχεία와 ἔνδεια는 서로 겹치지만 완전히 같지는 않으므로, 한국어에서도 병렬성을 살리되 ‘궁핍’으로 결핍의 뉘앙스를 보완했습니다.
- source_word: ἐν ἡμέραις πλούτου
  english_pob_choice: in the days of wealth
  chosen_korean: 부의 날들에
  alternatives_korean:
  - 풍요의 날들에
  - 부유한 날들에
  lexicon: LSJ
  rationale: πλοῦτος의 직접 의미인 ‘부/wealth’를 유지해 헬라어의 이미지와 대구를 보존했습니다.
theological_decisions:
