  text: Remember the time of famine in the time of plenty[a], and poverty and need in the days of wealth.
  footnotes:
  - marker: a
    text: Or 'season of hunger ... season of abundance.' The Greek contrasts appointed times of scarcity and fullness.
    reason: lexical_alternative
