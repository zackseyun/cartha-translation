  lexicon: LSJ
  rationale: πτωχεία와 ἔνδεια는 서로 겹치지만 완전히 같지는 않으므로, 한국어에서도 병렬성을 살리되 ‘궁핍’으로 결핍의 뉘앙스를 보완했습니다.
- source_word: ἐν ἡμέραις πλούτου
