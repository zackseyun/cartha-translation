  text: 풍족할 때에는 기근의 때를 기억하고, 부유한 날들에는 가난과 궁핍을 기억하십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘기근의 시기 … 풍요의 시기.’ 그리스어는 기근과 풍족함을 정해진 때 또는 시기의 대비로 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: μνήσθητι
  english_pob_choice: Remember
