  rationale: 본문은 기근/풍족, 가난/궁핍, 부/날들의 평행 대구로 구성되어 있어, 이를 일반적 교훈으로 축소하면 원문의 직설성과 문학적 힘이 약해집니다.
  doctrine_reference: '번역 원칙: 원문이 제시하는 구체적 의미와 평행구조를 우선 보존한다.'
