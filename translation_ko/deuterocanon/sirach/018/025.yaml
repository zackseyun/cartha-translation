  rationale: καιρός의 ‘때/시기’와 λιμός의 ‘기근’을 함께 반영했고, πλησμονή는 단순한 많음보다 ‘풍족함’이 대조를 더 분명히 드러냅니다.
- source_word: πτωχείαν καὶ ἔνδειαν
