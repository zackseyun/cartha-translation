- source_word: διὰ τοῦτο
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 이 때문에
  - 그리하여
  lexicon: LSJ
  rationale: 앞 문맥의 결론을 잇는 추론 표지로 자연스럽고, 원문의 논리 관계를 그대로 드러냅니다.
- source_word: ἐμακροθύμησεν
  english_pob_choice: was patient
  chosen_korean: 오래 참으셨고
  alternatives_korean:
  - 인내하셨고
  - 오랫동안 참으셨고
  - 오래 참으셨습니다
  lexicon: BDAG/LSJ
  rationale: μακροθυμέω의 ‘오래 참다/인내하다’ 의미를 살리되, 한국어에서 자연스러운 서술로 옮겼습니다.
- source_word: τὸ ἔλεος αὐτοῦ
  english_pob_choice: his mercy
  chosen_korean: 자신의 자비
  alternatives_korean:
  - 그의 자비
  - 그의 긍휼
  - 자비
  lexicon: BDAG/LSJ
  rationale: ἔλεος는 여기서 긍휼·자비의 뜻이지만, 문맥상 하나님의 호의가 능동적으로 부어지는 이미지를 살려 ‘자비’로 옮겼습니다.
- source_word: ἐξέχεεν ἐπʼ αὐτοὺς
  english_pob_choice: poured out upon them
  chosen_korean: 그들에게 쏟아 부으셨습니다
  alternatives_korean:
  - 그들에게 부어 주셨습니다
  - 그들 위에 쏟으셨습니다
  lexicon: LSJ
  rationale: ‘쏟아 붓다’의 구체적 이미지를 보존해 원문의 동사적 비유를 한국어에서도 분명하게 전달합니다.
theological_decisions:
