lexical_decisions:
- source_word: Ὀπίσω τῶν ἐπιθυμιῶν σου μὴ πορεύου
  english_pob_choice: Do not go after your desires
  chosen_korean: 욕망들을 따라가지 마십시오
  alternatives_korean:
  - 당신의 욕망들을 뒤따르지 마십시오
  - 당신의 욕구를 따라가지 마십시오
  - 욕망을 좇지 마십시오
  lexicon: LSJ / BDAG
  rationale: ὀπίσω + πορεύου는 ‘뒤를 따라가다/추종하다’의 관용적 의미이므로, 한국어에서는 ‘따라가지 마십시오’가 가장 자연스럽고 원문의 추종 이미지를 살립니다.
- source_word: τῶν ἐπιθυμιῶν σου
  english_pob_choice: your desires
  chosen_korean: 욕망들을
  alternatives_korean:
  - 당신의 욕구들
  - 당신의 소망들
  - 당신의 정욕들
  lexicon: BDAG / LSJ
  rationale: ἐπιθυμία는 문맥상 절제해야 할 바람직하지 않은 욕구를 가리키지만, 성적 의미로 좁히지 않기 위해 ‘욕망들’로 넓게 옮겼습니다.
- source_word: ἀπὸ τῶν ὀρέξεών σου κωλύου
  english_pob_choice: restrain yourself from your cravings
  chosen_korean: 자신의 욕구에서 자신을 억제하십시오
  alternatives_korean:
  - 자신의 갈망에서 자신을 막으십시오
  - 자신의 욕구를 삼가십시오
  - 자신의 탐욕에서 자신을 제어하십시오
  lexicon: LSJ / BDAG
  rationale: ὄρεξις는 강한 욕구나 충동, 갈망을 뜻하므로 ‘욕구’로 옮기되, κωλύου의 억제·제지 의미를 살려 ‘억제하십시오’로 대응했습니다.
theological_decisions:
- issue: 두 욕망 어휘의 범위와 강도
  chosen_reading: 첫 절은 일반적인 ‘욕망’, 둘째 절은 더 즉각적이고 강한 ‘욕구’로 구분했습니다.
  alternative_readings:
  - 둘 다 ‘욕망’으로 통일
  - 둘 다 ‘정욕’으로 통일
  - 둘 다 ‘갈망’으로 통일
  rationale: 원문은 ἐπιθυμίαι와 ὀρέξεις를 병렬하면서 약간 다른 결을 유지하므로, 한국어에서도 의미 중복을 피하면서 경고의 강도를 살리는 구분이 필요합니다.
  doctrine_reference: 원문 우선 번역; 어휘 범위 보존; 윤리적 권면의 수위 유지
