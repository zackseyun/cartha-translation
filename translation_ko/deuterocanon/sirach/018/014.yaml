  yaml_path: translation/deuterocanon/sirach/018/014.yaml
  text: He has mercy on those who accept discipline[b][a], and on those who eagerly hasten to his judgments.
  footnotes:
  - marker: a
    text: Or 'those who receive instruction' for 'those who accept discipline.' The Greek παιδεία can mean instruction, training, or corrective discipline.
    reason: lexical_alternative
  - marker: b
    text: Or 'his ordinances' for 'his judgments.' The Greek κρίματα can refer to judgments, decisions, or ordinances.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 징계[a]를 받아들이는 이들에게 자비를 베푸시고, 그의 심판[b]을 향해 힘써 서둘러 나아가는 이들에게도 자비를 베푸십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘가르침을 받아들이는 이들’로 옮길 수 있습니다. 헬라어 παιδεία는 가르침, 훈련, 교정적 징계를 모두 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그의 규례들’로 옮길 수 있습니다. 헬라어 κρίματα는 심판, 판단, 결정, 규례를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλεᾷ
  english_pob_choice: has mercy on
  chosen_korean: 불쌍히 여기시며
  alternatives_korean:
  - 자비를 베푸시며
  - 긍휼을 베푸시며
  lexicon: LSJ
  rationale: ἐλεέω는 불쌍히 여기다, 자비를 베풀다의 뜻이므로, 현대 문어에서 자연스럽고 정서적·종교적 강도를 살리는 표현으로 옮겼습니다.
- source_word: τοὺς ἐκδεχομένους
  english_pob_choice: those who accept
  chosen_korean: 받아들이는 사람들을
  alternatives_korean:
  - 기다리는 사람들을
  - 받아들이는 이들을
  lexicon: LSJ
  rationale: ἐκδέχομαι는 문맥상 단순히 기다리다보다 ‘기꺼이 받아들이다’의 뉘앙스가 강하므로, παιδεία와 결합된 수용성을 살려 번역했습니다.
- source_word: παιδείαν
  english_pob_choice: discipline
  chosen_korean: 징계
  alternatives_korean:
  - 훈련
  - 가르침
  - 교정
  lexicon: LSJ
  rationale: 이 지혜문맥에서 παιδεία는 단순 지식 전달보다 형성적·교정적 차원을 포함하므로, ‘징계’가 그 엄중함과 교육적 목적을 함께 드러냅니다.
- source_word: κατασπεύδοντας
  english_pob_choice: eagerly hasten
  chosen_korean: 애타게 서두르는
  alternatives_korean:
  - 열심히 서두르는
  - 간절히 서두르는
  - 부지런히 서두르는
  lexicon: LSJ
  rationale: 복합동사 κατασπεύδω의 강한 서두름과 적극적 지향을 살리기 위해, 단순한 ‘서두르는’보다 감정과 태도를 함께 드러내는 표현을 택했습니다.
- source_word: ἐπὶ τὰ κρίματα αὐτοῦ
  english_pob_choice: to his judgments
  chosen_korean: 그의 심판을
  alternatives_korean:
  - 그의 판단을
  - 그의 규례를
  - 그의 결정들을
  lexicon: LSJ
  rationale: κρίματα는 심판, 판단, 결정, 규례까지 포괄할 수 있으나, 여기서는 하나님의 행위에 대한 응답이라는 점을 살려 가장 직접적인 ‘심판’을 기본으로 삼았습니다.
theological_decisions:
- issue: παιδεία의 신학적 범위
  chosen_reading: 징계
  alternative_readings:
  - 훈련
  - 가르침
  - 교정
  rationale: 이 구절은 하나님이 받아들이는 이들에게 베푸는 형성적·교정적 처분을 말하므로, ‘징계’가 수동적 정보 수용이 아닌 하나님 앞의 도덕적 수용을 분명히 드러냅니다.
  doctrine_reference: Translation philosophy §1, §5
- issue: κρίματα αὐτοῦ의 의미 범위
  chosen_reading: 그의 심판
  alternative_readings:
  - 그의 규례
  - 그의 결정들
  rationale: 본문은 하나님의 통치적 판단을 향해 재촉하는 태도를 말하므로, ‘심판’으로 옮겨 하나님의 권위와 공의의 긴장을 보존했습니다.
  doctrine_reference: Translation philosophy §3, §5
