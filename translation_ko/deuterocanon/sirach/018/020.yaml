  text: Before judgment[a], examine yourself[b], and in the hour of visitation you will find atonement.
  footnotes:
  - marker: a
    text: Or 'in the hour of inspection' or 'in the time of reckoning'; the Greek visitation language can suggest a moment of divine review or intervention.
    reason: lexical_alternative
  - marker: b
    text: Or 'expiation' or 'propitiation'; the Greek denotes the removal of guilt and restoration of favor.
    reason: lexical_alternative
translation:
  language: ko
  text: 심판 전에 너 자신을 살피고, 방문의 때에 너는 속죄를 찾게 될 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘점검의 때에’, ‘감찰의 때에’, ‘회계의 때에’로도 옮길 수 있으며, ἐπισκοπή는 하나님의 방문과 판정의 뉘앙스를 함께 지닙니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘화목(제물)’, ‘속죄 제물’로도 옮길 수 있으며, ἐξιλασμός는 죄책의 제거와 관계 회복을 가리킵니다.
    reason: alternative_reading
lexical_decisions:
- source_word: πρὸ κρίσεως
  english_pob_choice: Before judgment
  chosen_korean: 심판 전에
  alternatives_korean:
  - 판결 전에
  - 재판 전에
  lexicon: LSJ
  rationale: κρίσις는 단순한 정죄보다 폭넓은 심판·판정의 뜻을 지니므로, 현대 한국어에서 가장 자연스럽고 넓은 의미를 보존하는 ‘심판’으로 옮겼습니다.
- source_word: ἐξέταζε σεαυτόν
  english_pob_choice: examine yourself
  chosen_korean: 너 자신을 살피고
  alternatives_korean:
  - 자신을 점검하고
  - 자기 자신을 검토하고
  - 너를 시험하고
  lexicon: LSJ
  rationale: 반복적 명령형의 자기 성찰 요청을 살리는 방향으로, 너무 기술적이지 않으면서도 내면 성찰을 드러내는 ‘살피다’를 택했습니다.
- source_word: ἐν ὥρᾳ ἐπισκοπῆς
  english_pob_choice: in the hour of visitation
  chosen_korean: 방문의 때에
  alternatives_korean:
  - 살핌의 때에
  - 점검의 때에
  - 감찰의 때에
  lexicon: LSJ
  rationale: ἐπισκοπή는 방문·점검·감찰의 여지를 지니지만, 본문이 지닌 신적 개입과 심판의 긴장을 유지하기 위해 전통적 성경어인 ‘방문’ 계열을 사용했습니다.
- source_word: ἐξιλασμόν
  english_pob_choice: atonement
  chosen_korean: 속죄를 찾게 될 것입니다
  alternatives_korean:
  - 화목을 찾게 될 것입니다
  - 속죄 제물을 찾게 될 것입니다
  - 속죄를 얻을 것입니다
  lexicon: LSJ
  rationale: ἐξιλασμός의 희생적·화해적 의미를 한국어에서 가장 간결하게 담는 표현으로 ‘속죄’를 택했고, 동사구 ‘찾게 될 것입니다’로 εὑρήσεις의 결과 발견 뉘앙스를 살렸습니다.
theological_decisions:
- issue: ἐπισκοπή의 신학적 긴장
  chosen_reading: 하나님의 방문과 점검이 함께 느껴지는 표현으로 유지했습니다.
  alternative_readings:
  - 단순한 검사
  - 행정적 감찰
  - 징계의 때
  rationale: 지혜문학 맥락에서 이 단어는 단순 행정 점검이 아니라 하나님 앞에 드러나는 결정적 순간을 암시할 수 있으므로, 의미를 하나로 좁히지 않았습니다.
  doctrine_reference: 의도적 다의성 보존
- issue: ἐξιλασμόν의 구원론적 뉘앙스
  chosen_reading: 속죄로 옮겨, 죄책의 제거와 관계 회복을 함께 보이게 했습니다.
  alternative_readings:
  - 속죄 제물
  - 화목제물
  - 용서
  rationale: 본문은 단순 용서보다 더 깊은 희생-화해의 언어를 사용하므로, 현대어로 읽히면서도 신학적 무게를 유지하는 ‘속죄’가 가장 적절합니다.
  doctrine_reference: 죄의 제거와 관계 회복
