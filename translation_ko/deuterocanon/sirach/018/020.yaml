    text: 또는 ‘방문의 때에’, ‘점검의 때에’, ‘결산의 때에’로 옮길 수 있습니다. 그리스어 ἐπισκοπή는 방문, 점검, 감찰을 뜻할 수 있으며, 이 문맥에서는 심판과 관련된 하나님의 살피심을 암시할 수도 있습니다.
    reason: lexical_alternative
