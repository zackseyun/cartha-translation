  text: Remember wrath in the days of your end[b][a], and the time of vengeance at the turning away of the face.
  footnotes:
  - marker: a
    text: Or 'anger' for 'wrath.' The Greek can denote strong anger generally, though here it likely refers to divine wrath in judgment.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'in the turning away of a face.' This likely refers to the withdrawal of favor, probably God's, but the Greek does not explicitly name the subject.
    reason: lexical_alternative
translation:
  language: ko
  text: 분노를 너의 마지막 날들에 기억하라[b][a], 그리고 얼굴이 돌아설 때의 보복의 때를.
  philosophy: formal
  footnotes:
  - marker: a
    text: '''분노''는 ''진노''로도 옮길 수 있습니다. 헬라어 θυμός는 일반적 격분을 뜻할 수 있지만, 여기서는 심판 맥락상 더 강한 어감을 가진 표현이 가능합니다.'
    reason: lexical_alternative
  - marker: b
    text: 직역하면 '얼굴이 돌아설 때'입니다. 이는 호의의 철회, 아마도 하나님의 호의를 가리킬 수 있으나, 헬라어는 그 주체를 명시하지 않습니다.
    reason: lexical_alternative
