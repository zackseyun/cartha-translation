  text: Like a drop of water from the sea and a grain of sand[b][a], so are a few years in the day of eternity.
  footnotes:
  - marker: a
    text: Or 'a pebble of sand'; the Greek word often means 'pebble,' but here likely refers to a single grain because it is paired with 'sand.'
    reason: lexical_alternative
  - marker: b
    text: Or 'in the day of the age.' The Greek phrase is compact and may be rendered more literally, but here it refers to the vast span of eternity in contrast with human years.
    reason: alternative_reading
translation:
  language: ko
  text: 바다에서 떨어지는 물방울과 모래 한 알처럼, 몇 해는 영원의 날에 불과합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘모래 한 조각’으로 옮길 수 있습니다. 그러나 여기서는 ‘모래’와 나란히 놓여 있어 단일한 모래알을 가리키는 것으로 보는 편이 자연스럽습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘영원의 날’보다 더 문자적으로 ‘그 시대의 날’로 옮길 수 있습니다. 다만 여기서는 인간의 짧은 해와 대비되는 무한한 지속을 가리킵니다.
    reason: alternative_reading
lexical_decisions:
- source_word: σταγὼν ὕδατος ἀπὸ θαλάσσης
  english_pob_choice: a drop of water from the sea
  chosen_korean: “바다에서 떨어지는 물방울”
  alternatives_korean:
