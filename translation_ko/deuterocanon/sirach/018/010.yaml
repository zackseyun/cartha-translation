  text: Like a drop of water from the sea and a grain of sand[b][a], so are a few years in the day of eternity.
  footnotes:
  - marker: a
    text: Or 'a pebble of sand'; the Greek word often means 'pebble,' but here likely refers to a single grain because it is paired with 'sand.'
    reason: lexical_alternative
  - marker: b
    text: Or 'in the day of the age.' The Greek phrase is compact and may be rendered more literally, but here it refers to the vast span of eternity in contrast with human years.
    reason: alternative_reading
translation:
  language: ko
  text: 바다의 물 한 방울과 모래 한 알[a]처럼, 영원의 날[b]에 비하면 몇 해는 그와 같습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘모래 한 조각’으로 옮길 수 있습니다. 그리스어 ψῆφος는 흔히 ‘조약돌’을 뜻하지만, 여기서는 ‘모래’와 결합되어 있어 모래 한 알을 가리키는 것으로 보는 편이 자연스럽습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 더 문자적으로 ‘시대의 날’로 옮길 수 있습니다. 여기서는 인간의 짧은 햇수와 대비되는 매우 긴 지속을 가리키는 것으로 이해할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: σταγὼν ὕδατος ἀπὸ θαλάσσης
  english_pob_choice: a drop of water from the sea
  chosen_korean: “바다에서 떨어지는 물방울”
  alternatives_korean:
  - 바다의 물 한 방울
  - 바다에서 난 물방울
  lexicon: LSJ
  rationale: σταγὼν은 작은 ‘물방울’의 이미지를 살리며, ἀπὸ θαλάσσης는 출처를 나타내므로 “바다에서”로 자연스럽게 옮겼습니다.
- source_word: ψῆφος ἄμμου
  english_pob_choice: a grain of sand
  chosen_korean: “모래 한 알”
  alternatives_korean:
  - 모래 한 알갱이
  - 모래 한 티
  lexicon: LSJ
  rationale: ψῆφος는 보통 ‘자갈/조약돌’이지만 여기서는 ἄμμου와 결합해 모래의 극소성을 강조하므로, 영어 POB의 판단을 따라 “모래 한 알”로 옮겼습니다.
- source_word: ὀλίγα ἔτη
  english_pob_choice: a few years
  chosen_korean: “몇 해”
  alternatives_korean:
  - 몇 년
  - 얼마 안 되는 해
  lexicon: LSJ
  rationale: 짧은 기간의 대비를 간결하게 살리기 위해 “몇 해”를 택했습니다. 한국어에서 다소 문어적이지만 자연스럽고 압축적입니다.
- source_word: ἡμέρᾳ αἰῶνος
  english_pob_choice: the day of eternity
  chosen_korean: “영원의 날”
  alternatives_korean:
  - 영겁의 날
  - 세월의 날
  lexicon: LSJ
  rationale: αἰών을 여기서는 단순히 ‘시대’보다 무한한 지속으로 이해해야 하므로, 영어 POB의 해석을 따라 “영원” 계열로 옮겼습니다.
theological_decisions:
- issue: αἰών의 의미를 시간적 ‘시대’로 둘지 무한한 ‘영원’으로 둘지
  chosen_reading: 무한한 지속을 가리키는 ‘영원’으로 번역했습니다.
  alternative_readings:
  - ‘시대의 날’
  - ‘세대의 날’
  rationale: 문맥은 바닷물 한 방울과 모래 한 알에 비유하여 인간의 짧은 생애를 압도적으로 대비하므로, ‘영원’이 본문 의도를 가장 분명히 드러냅니다.
  doctrine_reference: '번역 원칙: 원문의 수사적 대비를 훼손하지 않고 의미를 최대한 직접적으로 전달합니다.'
