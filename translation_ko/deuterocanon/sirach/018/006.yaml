  yaml_path: translation/deuterocanon/sirach/018/006.yaml
  text: It is not possible to diminish or to add[a], and it is not possible to trace out the wonders of the Lord.
  footnotes:
  - marker: a
    text: Or 'search out' or 'fathom' the wonders of the Lord.
    reason: lexical_alternative
translation:
  language: ko
  text: 줄이거나 더할 수 없으며, 주님의 놀라운 일들을 끝까지 찾아낼 수도 없습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘찾아내다’, ‘헤아려 밝히다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἔστιν
  english_pob_choice: it is not possible
  chosen_korean: ~할 수 없습니다
  alternatives_korean:
  - ~할 수 없습니다
  - ~하는 것은 불가능합니다
  - ~할 수 없게 되어 있습니다
  lexicon: BDAG
  rationale: 비인칭 불가능 표현으로 이해하여, 단순한 존재 부정이 아니라 행위 불가능을 자연스러운 한국어로 옮겼습니다.
- source_word: ἐλαττῶσαι
  english_pob_choice: to diminish
  chosen_korean: 줄이다
  alternatives_korean:
  - 감소시키다
  - 덜다
  - 줄이다
  lexicon: LSJ
  rationale: 무언가를 더 작게 하거나 적게 만드는 뜻을 간결하게 살리되, 뒤의 ‘더하다’와 대구를 이루도록 했습니다.
- source_word: προσθεῖναι
  english_pob_choice: to add
  chosen_korean: 더하다
  alternatives_korean:
  - 추가하다
  - 보태다
  - 더하다
  lexicon: LSJ
  rationale: 기본 의미가 분명한 동사로, 앞의 ‘줄이다’와 직접적인 대조를 이루는 가장 자연스러운 표현을 택했습니다.
- source_word: ἐξιχνιάσαι
  english_pob_choice: to trace out
  chosen_korean: 끝까지 찾아내다
  alternatives_korean:
  - 찾아내다
  - 더듬어 찾다
  - 헤아려 밝히다
  lexicon: LSJ
  rationale: 단순 탐색이 아니라 자취를 끝까지 추적해 완전히 파악하는 뉘앙스를 살렸습니다. POB의 ‘search out / fathom’ 선택과도 맞닿습니다.
- source_word: τὰ θαυμάσια
  english_pob_choice: the wonders
  chosen_korean: 놀라운 일들
  alternatives_korean:
  - 경이로운 일들
  - 기이한 일들
  - 놀라운 일들
  lexicon: LSJ
  rationale: 대상 범위가 ‘일/행위/경이’ 모두를 포괄할 수 있어, 의미를 좁히지 않는 한국어 표현으로 옮겼습니다.
- source_word: τοῦ κυρίου
  english_pob_choice: of the Lord
  chosen_korean: 주님의
  alternatives_korean:
  - 주님의
  - 주님의 것
  - 주님의 일들
  lexicon: BDAG
  rationale: 지혜문학 문맥에서 κύριος는 하나님을 가리키므로, 한국어 관례와 경외적 호칭을 반영해 ‘주님’으로 옮겼습니다.
theological_decisions:
- issue: μ의 대상이 생략된 ‘줄이거나 더하다’의 처리
  chosen_reading: 대상을 보충하지 않고 문장에 남겨 두었습니다.
  alternative_readings:
  - 그것들을 줄이거나 더하다
  - 그분의 일들을 줄이거나 더하다
  rationale: 원문은 대상을 생략한 채 격언적으로 말하므로, 보충 번역은 의미를 좁힐 수 있습니다. 생략을 유지해야 인간의 한계와 말할 수 없는 경이의 대비가 선명합니다.
  doctrine_reference: Translation philosophy §§1, 3
