  text: Before you speak[a], learn; and before sickness, seek treatment.
  footnotes:
  - marker: a
    text: Or 'care for yourself' / 'take remedies.' The Greek verb can mean to attend to, care for, or treat medically.
    reason: lexical_alternative
translation:
  language: ko
  text: 말하기 전에 먼저 배우십시오. 그리고 병들기 전에 치료하십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: θεραπεύω는 ‘돌보다’, ‘간호하다’, ‘치료하다’의 뜻을 가질 수 있습니다. 이 절에서는 병이 오기 전에 미리 대처하라는 뜻으로 읽힙니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὶν ἢ λαλῆσαι
  english_pob_choice: Before you speak
  chosen_korean: 말하기 전에
  alternatives_korean:
  - 말을 하기 전에
  - 말하기에 앞서
  lexicon: LSJ
  rationale: πρὶν ἢ + 부정사 구조의 시간 우선성을 자연스러운 한국어로 옮겼습니다. 직역보다 합쇼체 격언문에 맞는 간결한 표현이 적절합니다.
- source_word: μάνθανε
  english_pob_choice: learn
  chosen_korean: 먼저 배우십시오
  alternatives_korean:
  - 배우십시오
  - 익히십시오
  - 가르침을 받으십시오
  lexicon: LSJ
  rationale: μάνθανω의 핵심은 지식이나 판단을 갖추는 것이므로, 단순한 ‘알다’보다 ‘배우다’가 권고의 힘을 잘 드러냅니다. ‘먼저’를 덧붙여 선행 조건을 분명히 했습니다.
- source_word: πρὸ ἀρρωστίας
  english_pob_choice: before sickness
  chosen_korean: 병들기 전에
  alternatives_korean:
  - 아프기 전에
  - 질병이 오기 전에
  lexicon: LSJ
  rationale: ἀρρωστία는 일반적인 병약함/질병을 가리키므로, 한국어에서는 관용적이고 직관적인 ‘병들다’로 옮기는 것이 문맥에 맞습니다.
- source_word: θεραπεύου
  english_pob_choice: seek treatment
  chosen_korean: 치료하십시오
  alternatives_korean:
  - 돌보십시오
  - 치료를 받으십시오
  - 몸을 돌보십시오
  lexicon: LSJ
  rationale: θεραπεύω는 문맥상 병이 오기 전의 예방적 돌봄을 뜻하므로, 영어 POB의 ‘seek treatment’에 맞춰 ‘치료하십시오’로 옮겼습니다. 다만 한국어에서는 자칫 수동적으로 들릴 수 있어, 조언의 실천성을 살리는 표현입니다.
