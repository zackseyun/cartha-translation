  text: A wise man will be cautious in everything[b][a], and in days of sins he will beware of wrongdoing.
  footnotes:
  - marker: a
    text: Or 'will be reverent in everything'; the Greek verb can denote reverence as well as cautious wariness, but the context here favors practical moral caution.
    reason: lexical_alternative
  - marker: b
    text: Literally 'in days of sins,' likely meaning times marked by sin or temptation.
    reason: lexical_alternative
translation:
  language: ko
  text: 지혜로운 사람은 모든 일에 조심할 것이며, 죄의 날들에는 악행을 경계할 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘죄의 날들’입니다. 이는 죄가 두드러지거나 유혹이 강한 때를 가리키는 표현으로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄνθρωπος σοφός
  english_pob_choice: A wise man
  chosen_korean: 지혜로운 사람
  alternatives_korean:
  - 지혜로운 남자
  - 지혜로운 인간
  lexicon: LSJ
  rationale: 그리스어는 관용적 속담 문맥의 단수 일반명사이므로, 한국어에서는 성별을 과도하게 드러내지 않는 자연스러운 ‘사람’으로 옮기되 지혜의 주체라는 점을 살렸습니다.
- source_word: εὐλαβηθήσεται
  english_pob_choice: will be cautious
  chosen_korean: 조심할 것입니다
  alternatives_korean:
  - 경건할 것입니다
  - 경외할 것입니다
  - 삼갈 것입니다
  lexicon: LSJ
  rationale: 본문의 병행구가 죄와 악행을 피하는 실제적 태도를 가리키므로, 예배적 ‘경외’보다 도덕적·실천적 주의인 ‘조심하다’가 문맥에 더 맞습니다.
- source_word: ἐν παντὶ
  english_pob_choice: in everything
  chosen_korean: 모든 일에
  alternatives_korean:
  - 모든 것에서
  - 모든 일마다
  - 모든 면에서
  lexicon: LSJ
  rationale: 범위를 넓게 포괄하는 표현이므로, 한국어에서는 자연스럽고 일상적인 ‘모든 일에’로 옮겨 전반적 상황을 포괄하게 했습니다.
- source_word: πλημμελίας
  english_pob_choice: wrongdoing
  chosen_korean: 악행
  alternatives_korean:
  - 잘못
  - 허물
  - 죄과
  lexicon: LSJ
  rationale: πλημμέλεια는 잘못·허물·오류보다도 실제적인 비행을 가리킬 수 있어, 지혜문학의 윤리적 대비를 살리는 ‘악행’이 가장 적절합니다.
theological_decisions:
- issue: εὐλαβηθήσεται의 의미 범위
  chosen_reading: 예배적 경건보다 실천적 경계로 이해
  alternative_readings:
