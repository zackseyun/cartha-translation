  rationale: 뒤이어 ‘악행을 경계하다’가 나오므로, 본절은 종교적 정서보다 삶의 자리에서의 신중함과 도덕적 경계를 강조하는 잠언적 진술로 읽는 것이 자연스럽습니다.
