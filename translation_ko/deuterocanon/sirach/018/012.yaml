  text: He saw and recognized that their destruction was evil[b][a]; therefore he multiplied his atonement for them.
  footnotes:
  - marker: a
    text: Or 'their destruction' or 'their ruin' for 'their end.'
    reason: lexical_alternative
  - marker: b
    text: Or 'he increased his expiation for them.' The Greek uses an atonement word (ἐξιλασμός) that can also be rendered 'expiation.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 그들의 파멸이 악하다는 것을 보시고 알아차리셨습니다. 그러므로 그들의 속죄를 더욱 많게 하셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 파멸’은 ‘그들의 끝’ 또는 ‘그들의 멸망’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그는 그들을 위해 속죄를 더하셨습니다.’ 그리스어 ἐξιλασμός는 ‘속죄’ 또는 ‘속죄 제의’를 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἶδεν καὶ ἐπέγνω
  english_pob_choice: He saw and recognized
  chosen_korean: 보시고 알아차리셨습니다
  alternatives_korean:
  - 보시고 인식하셨습니다
  - 보시고 알아보셨습니다
  lexicon: LSJ
  rationale: ὁράω와 ἐπιγινώσκω의 순차적 동작을 살려, 단순한 시각과 더 깊은 인식의 진행을 한국어로 자연스럽게 구분했습니다.
- source_word: τὴν καταστροφὴν αὐτῶν
  english_pob_choice: their destruction
  chosen_korean: 그들의 파멸
  alternatives_korean:
  - 그들의 멸망
  - 그들의 파괴
  - 그들의 파멸과 멸망
  lexicon: LSJ
  rationale: καταστροφή는 전복·파멸·파괴를 아우르므로, 문맥상 인간의 비참한 종국을 드러내는 ‘파멸’이 가장 간결하게 맞습니다.
- source_word: ὅτι πονηρά
  english_pob_choice: that their destruction was evil
  chosen_korean: 악하다는 것을
  alternatives_korean:
  - 비참하다는 것을
  - 사악하다는 것을
  - 해롭다는 것을
  lexicon: LSJ
  rationale: πονηρός는 여기서 도덕적 악과 비참함을 함께 띠므로, 본문이 그들의 종국을 부정적으로 평가한다는 점을 보존하기 위해 ‘악하다’로 옮겼습니다.
- source_word: τὸν ἐξιλασμὸν αὐτοῦ
  english_pob_choice: his atonement
  chosen_korean: 그들의 속죄를
  alternatives_korean:
  - 그들의 화목제물을
  - 그의 속죄를
  - 그들을 위한 속죄를
  lexicon: LSJ
  rationale: ἐξιλασμός은 속죄/속죄행위를 가리키므로 ‘속죄’로 옮기되, 한국어에서 자연스러운 대상을 드러내기 위해 문맥상 목적어를 살렸습니다.
theological_decisions:
