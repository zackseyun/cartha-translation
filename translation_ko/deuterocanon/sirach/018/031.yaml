translation:
  language: ko
  text: 네 마음이 바라는 즐거움을 네 영혼에 허락하면, 그것이 너를 네 원수들의 기쁨거리로 만들 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐὰν
  english_pob_choice: If
  chosen_korean: …하면
  alternatives_korean:
  - 만일 …하면
  - …할 경우
  lexicon: BDAG
  rationale: 지혜문학의 경고형 조건문이므로 한국어도 자연스러운 조건 연결로 옮겼습니다.
- source_word: τῇ ψυχῇ σου
  english_pob_choice: your soul
  chosen_korean: 네 영혼
  alternatives_korean:
  - 너 자신
  - 네 마음
  lexicon: BDAG
  rationale: ψυχή를 본문이 드러내는 내적 실재로 살려서 ‘영혼’으로 옮기되, 너무 평면적인 ‘너 자신’은 피했습니다.
- source_word: εὐδοκίαν ἐπιθυμίας
  english_pob_choice: the pleasure it desires
  chosen_korean: 마음이 바라는 즐거움
  alternatives_korean:
  - 갈망하는 기쁨
  - 욕망의 즐거움
  - 원하는 쾌락
  lexicon: BDAG
  rationale: 직역만 하면 다소 어색하므로, εὐδοκία와 ἐπιθυμία의 결합을 ‘바라는 즐거움’으로 풀어 원문의 자기만족·자기방임 경고를 살렸습니다.
- source_word: ἐπίχαρμα
  english_pob_choice: a joy
  chosen_korean: 기쁨거리
  alternatives_korean:
  - 웃음거리
  - 조롱거리
  - 기쁨
  lexicon: LSJ
  rationale: 단순히 ‘기쁨’이라 하면 대적들이 즐거워한다는 관계가 약해지므로, ‘…거리’로 옮겨 원문이 가진 ‘남들이 기뻐하는 대상’의 뉘앙스를 드러냈습니다.
theological_decisions:
- issue: ἐπίχαρμα τῶν ἐχθρῶν σου의 적대적 함의
  chosen_reading: ‘네 원수들의 기쁨거리’로 옮겨, 적들이 너의 자기방종을 보며 기뻐하는 경고를 유지했습니다.
  alternative_readings:
  - ‘네 원수들의 웃음거리’
  - ‘네 원수들이 기뻐할 대상’
  rationale: 본문은 단순한 모욕이 아니라 원수들이 너의 상태를 보고 쾌재를 부르는 결과를 경고하므로, 그 긴장을 너무 약화시키지 않는 표현을 택했습니다.
  doctrine_reference: 'DOCTRINE.md §Translation philosophy: original-language primacy; preserve ambiguity where present'
