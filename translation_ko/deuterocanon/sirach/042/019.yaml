  text: He declares the changes that are coming[b][a], and reveals the search of hidden things.
  footnotes:
  - marker: a
    text: 'Greek parallel: ''He declares what has passed and what is to come, and reveals the traces of hidden things.'' This reflects a fuller temporal expansion than the extant Hebrew.'
    reason: alternative_reading
  - marker: b
    text: The Masada scroll for this section is fragmentary and does not preserve this verse in a form sufficient to replace the Cairo Geniza wording here.
    reason: textual_variant
translation:
  language: ko
  text: 그는 다가올 변화를 알리고, 숨겨진 것들의 탐구를 드러냅니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 병행문은 “지나간 것들과 올 것들”을 알리고 “숨겨진 것들의 흔적”을 드러낸다고 말합니다. 이는 현존 히브리어보다 더 넓은 시간 범위를 반영합니다.
    reason: alternative_reading
  - marker: b
    text: 이 구간의 마사다 두루마리 본문은 단편적이어서, 이 절을 대체할 만큼 충분한 형태로 보존되지 않았습니다.
    reason: textual_variant
lexical_decisions:
- source_word: מחוה
  english_pob_choice: declares
  chosen_korean: 알리고
  alternatives_korean:
  - 선언하고
  - 선포하고
  - 알려 주고
  lexicon: HALOT
  rationale: 지혜문맥에서 מחוה는 단순한 설명보다 어떤 사실을 드러내어 알리는 뜻이므로, 현대 한국어에서는 ‘알리고’가 자연스럽고 과도하게 종교화되지 않습니다.
- source_word: חליפות נהיות
  english_pob_choice: the changes that are coming
  chosen_korean: 다가올 변화
  alternatives_korean:
  - 오는 변화들
  - 일어날 변화들
  - 변전(變轉)
  lexicon: HALOT
  rationale: 복수적·연속적 변화를 가리키는 표현이므로, ‘다가올 변화’로 간결하게 옮기되 시간적 전개라는 뉘앙스를 살렸습니다.
- source_word: חקר
  english_pob_choice: the investigation
  chosen_korean: 탐구
  alternatives_korean:
  - 조사
  - 찾아냄
  - 살핌
  lexicon: HALOT
  rationale: חקר는 ‘숨은 것을 파헤쳐 알아봄’이라는 탐구/조사의 의미가 강하므로, ‘탐구’가 가장 문맥에 맞고 ‘깊은 곳’처럼 의미를 바꾸지 않습니다.
- source_word: נסתרות
  english_pob_choice: hidden things
  chosen_korean: 숨겨진 것들
  alternatives_korean:
  - 감추어진 것들
  - 비밀한 것들
  - 은밀한 것들
  lexicon: HALOT
  rationale: 형용사적·명사적 복수로서 무엇인가가 감추어져 있음을 가리키므로, 가장 პირდაპირ적이고 넓은 의미를 유지하는 ‘숨겨진 것들’을 택했습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행문의 범위 차이
  chosen_reading: 본문은 현존 히브리어를 우선해 ‘다가올 변화’로 옮기고, 그리스어의 과거·미래 확장은 본문에 합치지 않고 의미 배경으로만 존중합니다.
  alternative_readings:
  - 과거와 다가올 일을 알리고
  - 지나간 것과 올 것을 선포하고
  rationale: 이 절의 히브리어는 명시적으로 ‘과거와 미래’를 말하지 않으므로, 그리스어 병행문의 더 넓은 시간 범위를 본문에 직접 넣으면 히브리어 증거를 넘어섭니다.
  doctrine_reference: 'Sirach 번역 원칙: 현존 히브리어를 본문으로 삼고, 그리스어 병행문은 대조 증거로 사용합니다.'
