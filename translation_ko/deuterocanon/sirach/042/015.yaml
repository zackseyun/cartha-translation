  text: Now I will remember the works of God[a], and what I have seen I will recount. At the word of God is his will, and his work accomplishes his pleasure.
  footnotes:
  - marker: a
    text: 'Greek parallel: ''I will remember the works of the Lord, and what I have seen I will recount; in the words of the Lord are his works.'' The Hebrew final line is difficult, so the English main text reflects the probable sense rather than a strictly literal rendering.'
