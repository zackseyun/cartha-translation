  - severity: medium
    issue: 난해한 후반부에 관한 각주 누락
    rationale: 영어 POB 감사 기록은 히브리어 마지막 행의 난해함과 그리스어 병행 읽기를 명시합니다. 현 한국어 각주는 신명 차이만 다루므로, 불확실성을 독자에게 알리는 별도 각주가 필요합니다.
