  source_fidelity: 첫머리의 נא는 시간 부사 ‘이제’를 명시하지 않으므로 이를 삭제해야 합니다. 또한 난해한 히브리어 후반부를 번역한 본문은 가능한 의미를 제시할 수 있으나, 그 난해성과 그리스어 병행 읽기를 각주로 밝혀야 합니다. 반복되는 רצונו는 한국어에서도 ‘뜻’으로 통일하여 원문의 반복과 병행을 보존하는 편이 낫습니다.
  naturalness: ‘하나님[a]의 하신 일들’은 소유격과 관형절이 겹쳐 다소 부자연스럽습니다. ‘하나님의 일들’이 간결하고 자연스럽습니다. ‘하나님의 말씀에는 그의 뜻이 있고’는 한국어 문장으로도 자연스럽게 다듬었습니다.
  terminology: אל은 히브리어 우선 원칙에 따라 ‘하나님’으로 유지합니다. Κυρίου의 ‘주님’ 읽기는 각주에 남깁니다. רצון은 두 차례 모두 ‘뜻’으로 옮겨, 첫 절의 ‘뜻’과 마지막 절의 ‘기쁨’을 달리 번역하여 생기는 불필요한 의미 차이를 피했습니다.
