translation:
  language: ko
  text: 나는 하나님[a]의 일들을 기억하고, 내가 본 것을 말하겠습니다. 하나님의 말씀에는 그의 뜻이 있고, 그의 일은 그의 뜻을 이룹니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 ‘하나님’(אל)이라 하고, 그리스어 병행 본문은 ‘주님’(Κυρίου)이라 합니다.
    reason: textual_variant
  - marker: b
    text: 히브리어 마지막 행은 난해합니다. 그리스어 병행 본문은 “주님의 말씀 안에 그의 일들이 있다”라고 읽습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: מעשי אל
  english_pob_choice: the works of God
  chosen_korean: 하나님[a]의 하신 일들
  alternatives_korean:
  - 하나님의 일들
  - 하나님의 행하신 일들
  lexicon: HALOT
  rationale: מעשים는 ‘일들/행하신 일들’의 뜻이 자연스럽고, 시가적 문맥에서 하나님의 활동을 드러내기 위해 ‘하신 일들’로 옮겼습니다.
- source_word: וזה חזיתי ואספרה
  english_pob_choice: and what I have seen I will recount
  chosen_korean: 내가 본 것을 말하겠습니다
  alternatives_korean:
  - 내가 본 것을 전하겠습니다
  - 내가 본 바를 말하겠습니다
  lexicon: HALOT
  rationale: 히브리어의 압축된 병렬을 한국어에서 자연스럽게 풀어, ‘본 것’과 ‘말하겠습니다’의 대조를 살렸습니다.
- source_word: באומר אלהים
  english_pob_choice: By the word of God
  chosen_korean: 하나님의 말씀에
  alternatives_korean:
  - 하나님의 말씀으로
  - 하나님이 말씀하실 때
  lexicon: HALOT
  rationale: ב־는 여기서 원인·수단의 의미를 띨 수 있어, POB의 ‘By the word of God’를 한국어에서 ‘…말씀에’로 옮겨 문맥상의 수단성을 반영했습니다.
- source_word: רצונו
  english_pob_choice: his will
  chosen_korean: 그의 뜻
  alternatives_korean:
  - 그의 원하심
  - 그의 뜻하심
  lexicon: HALOT
  rationale: רצון은 ‘뜻/원함/기쁨’의 범위를 가지며, 앞뒤 병행을 고려할 때 한국어에서는 ‘뜻’이 가장 간결하고 문맥에 맞습니다.
- source_word: ופועל רצונו לקחו
  english_pob_choice: and his work accomplishes his pleasure
  chosen_korean: 그의 일은 그의 기쁨을 이루어 냅니다
  alternatives_korean:
  - 그의 일은 그의 뜻을 성취합니다
  - 그의 행하심은 그의 기쁨을 완성합니다
  lexicon: HALOT
  rationale: 마지막 절은 전승상 난해하므로, 동사적 뉘앙스를 살려 ‘이루어 냅니다’로 옮겨 하나님의 행위가 그의 רצון을 실현한다는 의미를 드러냈습니다.
theological_decisions:
- issue: 하나님/주님의 명칭 차이(히브리어 אל vs. 그리스어 Κυρίου)
  chosen_reading: 본문은 히브리어 증거를 따라 ‘하나님’으로 옮기고, 그리스어의 ‘주’ 읽기는 각주로 처리합니다.
  alternative_readings:
  - 주
  - 주님
  rationale: 시락서는 히브리어가 보존된 곳에서는 히브리어 본문을 우선하므로, 본문은 ‘하나님’을 유지하되 그리스어 병행전승의 차이는 각주로 남깁니다.
  doctrine_reference: 'PHILOSOPHY.md: translate Sirach from Hebrew where it survives; contested divine titles handling'
- issue: 난해한 마지막 절의 처리
  chosen_reading: 하나님의 말씀과 뜻, 그리고 그의 일의 성취라는 뜻을 분명하게 드러내는 최적일치 번역을 택합니다.
  alternative_readings:
  - 히브리어를 더 직역해 모호성을 남기는 번역
  - 그리스어 병행을 따라 ‘주님의 말씀 안에 그의 일들이 있다’는 식의 번역
  rationale: 히브리어 전승이 압축적이고 불확실하므로, 의미를 과도하게 단정하지 않으면서도 본문이 말하는 신적 행위의 상호성을 한국어로 분명히 전달했습니다.
  doctrine_reference: 'DOCTRINE.md: preserve theological tension rather than resolve it; PHILOSOPHY.md: preserve source uncertainty honestly'
