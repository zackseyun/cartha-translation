base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/042/010.yaml
  text: In her virginity[a], lest she be seduced, and in her husband’s house, lest she go astray; in her father’s house, lest she become pregnant, and in her husband’s house[b], lest she be barren.
  footnotes:
  - marker: a
    text: Greek reads 'lest she be defiled' where the Hebrew has 'lest she be seduced,' making the sexual sense explicit.
    reason: alternative_reading
  - marker: b
    text: The final clause could be rendered more literally 'lest she be restrained,' but the Greek parallel supports the sense 'lest she be barren.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그녀가 처녀일 때에는 유혹당하지 않도록[a] 하고, 남편의 집에서는 그릇된 길로 가지 않도록 하십시오. 아버지의 집에서는 임신하지 않도록 하고, 남편의 집에서는 불임이 되지 않도록[b] 하십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘유혹당하다’에 가깝고, 그리스어는 ‘더럽혀지다’로 옮겨 성적인 뜻을 더 분명히 합니다.
    reason: alternative_reading
  - marker: b
    text: 마지막 절의 히브리어는 문자적으로 ‘억제되다’ 또는 ‘막히다’에 가깝지만, 그리스어 평행본문은 ‘불임이 되다’라는 뜻을 지지합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בבתוליה
  english_pob_choice: in her virginity
  chosen_korean: 그녀가 처녀일 때에는
  alternatives_korean:
  - 처녀의 상태에서
  - 처녀 시절에
  lexicon: HALOT
  rationale: 히브리어는 처녀라는 상태를 가리키므로, 한국어에서는 자연스럽게 ‘처녀일 때’로 옮겨 상태성을 살렸습니다.
- source_word: פן תפתה
  english_pob_choice: lest she be seduced
  chosen_korean: 유혹되지 않도록
  alternatives_korean:
  - 유혹당하지 않도록
  - 꾀임에 빠지지 않도록
  lexicon: HALOT
  rationale: 이 동사는 단순한 ‘속이다’보다 성적·도덕적 유혹의 뉘앙스를 포함하므로, POB의 성적 취지를 살려 ‘유혹되지 않도록’으로 옮겼습니다.
- source_word: לא תשטה
  english_pob_choice: lest she go astray
  chosen_korean: 방황하지 않도록
  alternatives_korean:
  - 길을 벗어나지 않도록
  - 타락하지 않도록
  - 삐뚤어지지 않도록
  lexicon: HALOT
  rationale: 히브리어는 넓게는 ‘빗나가다/그릇되다’의 뜻이 있어, 도덕적·성적 일탈을 포괄하면서도 과도하게 특정하지 않는 ‘방황하다’를 택했습니다.
- source_word: פן תהרה
  english_pob_choice: lest she become pregnant
  chosen_korean: 임신하지 않도록
  alternatives_korean:
  - 잉태하지 않도록
  - 임신하게 되지 않도록
  lexicon: HALOT
  rationale: 어근은 임신/잉태를 뜻하므로, 현대 한국어에서 즉시 이해되는 ‘임신하다’로 직설적으로 옮겼습니다.
- source_word: פן תעצר
  english_pob_choice: lest she be barren
  chosen_korean: 불임이 되지 않도록
  alternatives_korean:
  - 아이를 못 갖게 되지 않도록
  - 수태하지 못하게 되지 않도록
  lexicon: HALOT
  rationale: 히브리어의 더 직역적 의미는 ‘막히다/제지되다’ 쪽이지만, 그리스어 평행본문이 ‘불모/불임’을 지지하므로 POB의 의미 선택을 따라 ‘불임’으로 옮겼습니다.
theological_decisions:
- issue: 시어적 경고문에서의 명령형 등록
  chosen_reading: 직접적인 훈계·권고문으로 읽히도록 ‘-지 않도록 하십시오’ 형식을 사용했습니다.
  alternative_readings:
  - 서술형으로 완화하여 번역
