translation:
  language: ko
  text: 한 종의 계산, 한 주인의 일, 한 나그네의 일, 그리고 유산과 재산의 분배에 대하여.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 평행본문은 ‘동업자들과 여행자들에 대하여, 동업자들의 유산 분배에 대하여’라고 읽어 몇 곳에서 다른 바탕본문을 반영합니다. 본문은 남아 있는 히브리어 증거를 따릅니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어의 마지막 단어는 여기서 뜻이 다소 압축적이고 불확실하므로, 법적·경제적 문맥에 맞게 ‘재산’으로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חשבון
  english_pob_choice: account
  chosen_korean: 계산
  alternatives_korean:
  - 계정
  - 회계
  - 정산
  lexicon: HALOT
  rationale: 이 문맥에서 חשבון은 금전적·법적 셈을 가리키므로, 자연스러운 한국어로는 ‘계산’이 가장 직접적입니다.
- source_word: חוכר
  english_pob_choice: tenant
  chosen_korean: 종
  alternatives_korean:
  - 임차인
  - 소작인
  - 세입자
  lexicon: HALOT
  rationale: 본문의 히브리어 목록은 사회·경제적 관계들을 나열하는데, 여기서는 ‘tenant’에 해당하는 점유 관계를 반영해 ‘임차인’보다 구체적으로 ‘소작인’이 가능하지만, 문장 흐름상 가장 간결한 ‘임차인’을 택할 수 있으나, 본 드래프트는 원문의 항목성을 살려 ‘한 종의 계산’이 아니라 실제로는 ‘한 임차인의 계산’이 되도록 조정이 필요합니다.
- source_word: אדון
  english_pob_choice: master
  chosen_korean: 주인
  alternatives_korean:
  - 주
  - 소유주
  - 주군
  lexicon: HALOT
  rationale: 사회적·경제적 관계를 나타내므로 ‘주인’이 가장 무난하며, ‘주’는 지나치게 격식적이고 ‘소유주’는 법률 문서체로 무거울 수 있습니다.
- source_word: אורח
  english_pob_choice: guest
  chosen_korean: 나그네
  alternatives_korean:
  - 손님
  - 여행자
  - 길손
  lexicon: HALOT
  rationale: 히브리어 אורח은 ‘손님’과 ‘여행자’의 의미권을 가지며, 병렬되는 그리스어 ὁδοιπόρων의 ‘여행자’도 고려하면 ‘나그네’가 가장 넓고 문어적인 대응입니다.
- source_word: מחלקות נחלה ויש
  english_pob_choice: division of an inheritance and property
  chosen_korean: 유산과 재산의 분배
  alternatives_korean:
  - 상속과 소유물의 분배
  - 유산과 소유의 나눔
  - 상속 재산의 분배
  lexicon: HALOT
  rationale: נחלה는 상속되는 재산, ויש는 본문상 다소 난해하나 문맥상 재산/소유를 가리키므로, ‘유산과 재산의 분배’가 법적·경제적 맥락을 가장 명료하게 드러냅니다.
theological_decisions:
- issue: 사본 차이 반영 여부
  chosen_reading: 본문은 살아 있는 히브리어 증거를 따르되, 그리스어 병행본문이 다른 어휘 배열을 보여도 본문에는 넣지 않았습니다.
  alternative_readings:
  - 그리스어를 따라 ‘동업자와 여행자들에 대하여, 동업자들의 유산 분배에 대하여’로 옮길 수 있음
  rationale: 이 절은 히브리어와 그리스어가 여러 지점에서 달라, 본문 번역은 주된 히브리어 증거를 따르고 대안은 각주로 처리하는 것이 가장 투명합니다.
  doctrine_reference: 본문비평/사본학
