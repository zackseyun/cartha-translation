  - 저울대
  lexicon: HALOT
  rationale: 상거래 용례에서 자연스러운 현대 한국어는 ‘저울’이며, 다음 항목의 ‘천칭’과 짝을 이루어 재량 없이 물건을 달아보는 기구를 나타냅니다.
- source_word: פלס
  english_pob_choice: balances
  chosen_korean: 천칭
  alternatives_korean:
  - 받침저울
  - 평형추
  lexicon: HALOT
  rationale: 저울과 병렬을 이루는 계량 기구로 이해되어, 한국어에서는 보다 구체적인 ‘천칭’이 문맥상 자연스럽습니다.
- source_word: איפה
  english_pob_choice: ephah
  chosen_korean: 에바
  alternatives_korean:
  - 고량
  - 곡물되
  lexicon: HALOT
  rationale: 히브리어의 고유 계량단위를 음역해 유지함으로써, 본문이 구체적 상거래 규격을 말한다는 점을 살렸습니다.
- source_word: אבן
  english_pob_choice: stone weight
  chosen_korean: 돌추
  alternatives_korean:
  - 돌무게
  - 돌저울추
  lexicon: HALOT
  rationale: 상거래에서 표준추로 쓰는 돌을 뜻하므로, ‘돌추’로 옮겨 기능을 분명히 했습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행문의 차이 반영
  chosen_reading: 본문은 히브리어 전승을 따라 ‘속이는 일’과 ‘에바와 돌추’를 두어 상거래 부정을 말하게 했습니다.
  alternative_readings:
  - 그리스어 병행문의 ‘저울과 무게의 정확함’
  - 그리스어의 ‘크고 작은 것의 취득’
  rationale: 시라크는 이 절에서 전승 차이가 크므로, 주어진 히브리어 본문을 본문으로 삼되 그리스어가 가리키는 계량의 정확성도 배경에 남겨 두는 것이 가장 투명합니다.
  doctrine_reference: textual criticism / source priority
