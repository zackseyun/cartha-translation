  source_fidelity: 첫 구절의 שחק은 전승상 난해하지만 저울을 이용한 속임으로 이해하는 번역은 가능하며, 그리스어의 ‘정확성’은 각주로 보존해야 합니다. 그러나 두 번째 구절의 תמחות איפה ואבן은 에바와 돌추에 관련된 계량·측정을 가리키는 것으로 옮기는 편이 안전합니다. 초안의 ‘그릇됨’은 히브리어에 명시되지 않은 부정행위를 부가합니다.
  naturalness: ‘에바와 돌추로의 그릇됨’은 현대 한국어로 부자연스럽고 뜻도 불명확합니다. ‘에바와 돌추의 계량’은 간결하고 자연스럽게 해당 상거래·측량 문맥을 전달합니다.
