base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/042/004.yaml
  text: about cheating with scales and balances[c][b][a], and about measures of ephah and stone weight.
  footnotes:
  - marker: a
    text: The Greek parallel reads more like 'about accuracy of scale and weights,' rather than 'about cheating with scales and balances.' The Hebrew witness here is difficult and does not align neatly with the Greek.
    reason: alternative_reading
  - marker: b
    text: The Greek second line differs substantially, reading 'about acquiring much and little' or 'about quantities great and small,' where the Hebrew mentions an ephah and a stone weight.
    reason: textual_variant
  - marker: c
    text: An ephah was an ancient dry measure; a 'stone weight' was a stone used as a standard weight in trade.
    reason: cultural_note
translation:
  language: ko
  text: 저울과 천칭으로 속이는 일과 에바와 돌추로의 그릇됨에 관하여.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 병행문은 이 대목을 ‘저울과 무게의 정확함’으로 읽어, 히브리어의 ‘속임’과는 방향이 다릅니다.
    reason: textual_variant
  - marker: b
    text: 그리스어 두 번째 행은 히브리어의 ‘에바와 돌추’ 대신 ‘많고 적음의 취득’으로 크게 달라집니다.
    reason: textual_variant
  - marker: c
    text: 에바는 고대의 곡물 측량 단위이고, 돌추는 거래에서 표준 무게추로 쓰인 돌입니다.
    reason: cultural_note
lexical_decisions:
- source_word: שחק
  english_pob_choice: cheating
  chosen_korean: 속이는 일
  alternatives_korean:
  - 부정
  - 사기
  - 속임
  lexicon: HALOT
  rationale: 히브리어 전승은 저울·천칭과 함께 상거래의 부정행위를 가리키는 방향이므로, 단순한 ‘정확함’보다 행위를 드러내는 ‘속이는 일’이 본문 맥락을 더 잘 살립니다.
- source_word: מאזנים
  english_pob_choice: scales
  chosen_korean: 저울
  alternatives_korean:
  - 천평
  - 저울대
  lexicon: HALOT
  rationale: 상거래 용례에서 자연스러운 현대 한국어는 ‘저울’이며, 다음 항목의 ‘천칭’과 짝을 이루어 재량 없이 물건을 달아보는 기구를 나타냅니다.
- source_word: פלס
  english_pob_choice: balances
  chosen_korean: 천칭
  alternatives_korean:
  - 받침저울
  - 평형추
  lexicon: HALOT
  rationale: 저울과 병렬을 이루는 계량 기구로 이해되어, 한국어에서는 보다 구체적인 ‘천칭’이 문맥상 자연스럽습니다.
- source_word: איפה
  english_pob_choice: ephah
  chosen_korean: 에바
  alternatives_korean:
  - 고량
  - 곡물되
  lexicon: HALOT
  rationale: 히브리어의 고유 계량단위를 음역해 유지함으로써, 본문이 구체적 상거래 규격을 말한다는 점을 살렸습니다.
- source_word: אבן
  english_pob_choice: stone weight
  chosen_korean: 돌추
  alternatives_korean:
  - 돌무게
  - 돌저울추
  lexicon: HALOT
  rationale: 상거래에서 표준추로 쓰는 돌을 뜻하므로, ‘돌추’로 옮겨 기능을 분명히 했습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행문의 차이 반영
  chosen_reading: 본문은 히브리어 전승을 따라 ‘속이는 일’과 ‘에바와 돌추’를 두어 상거래 부정을 말하게 했습니다.
  alternative_readings:
  - 그리스어 병행문의 ‘저울과 무게의 정확함’
  - 그리스어의 ‘크고 작은 것의 취득’
  rationale: 시라크는 이 절에서 전승 차이가 크므로, 주어진 히브리어 본문을 본문으로 삼되 그리스어가 가리키는 계량의 정확성도 배경에 남겨 두는 것이 가장 투명합니다.
  doctrine_reference: textual criticism / source priority
