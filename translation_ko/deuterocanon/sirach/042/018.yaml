  source_fidelity: 히브리어 תהום, לב, חקר, מערומיהם, יתבונן의 핵심 의미는 대체로 반영되어 있습니다. 다만 ‘찾아내시며’는 חקר의 지속적이고 철저한 탐구·살핌의 뜻보다 결과적 발견을 더 강하게 나타내며, ‘이해하십니다’는 יתבונן의 주의 깊은 고찰·분별의 뉘앙스를 다소 약화합니다.
  naturalness: ‘그들의 모든 드러난 것들을 이해하십니다’는 한국어로 다소 부자연스럽고, ‘드러난 것들’과 ‘이해하다’의 결합도 매끄럽지 않습니다. ‘샅샅이 살피시며’와 ‘헤아리십니다’가 현대적인 합쇼체 문체에서 자연스럽습니다.
  terminology: ‘깊은 곳’과 ‘마음’은 적절합니다. מערומיהם는 문자적으로 벌거벗음/드러남을 가리키는 난해한 표현이므로, 본문에서는 ‘모든 드러난 것’으로 옮기고 문자적 표현 및 그리스어의 상이한 독법은 각주에서 밝혀야 합니다. 마사다 전승을 단순히 ‘사해문서 계열’이라고 일반화하지 말고 마사다 사본으로 특정하는 것이 정확합니다.
