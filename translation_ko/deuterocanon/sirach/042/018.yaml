base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/042/018.yaml
  text: He searches out the deep and the heart[b][a], and he understands all their secrets.
  footnotes:
  - marker: a
    text: 'Greek: ''and he considered their every scheme/cunning act.'' The Hebrew reads ''all their nakednesses,'' likely referring to all that is laid bare before him.'
    reason: alternative_reading
  - marker: b
    text: Masada preserves the shorter Hebrew opening 'Deep and heart he searched out,' while the Cairo Geniza text continues with the clause about 'all their nakednesses.'
    reason: textual_variant
translation:
  language: ko
  text: 깊은 곳과 마음을 샅샅이 살피시며, 그들의 모든 드러난 것을 헤아리십니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘그들의 모든 벌거벗음들/드러남들’이라고 합니다. 이는 그분 앞에 드러난 모든 것을 가리키는 듯합니다. 그리스어는 ‘그들의 모든 계략’을 살피셨다고 읽습니다.
    reason: alternative_reading
  - marker: b
    text: 마사다 히브리어 사본은 ‘깊은 곳과 마음을 살피셨다’라는 더 짧은 앞부분만 보존합니다. 카이로 게니자 전승은 이어지는 ‘그들의 모든 드러난 것’에 해당하는 구절도 보존합니다.
    reason: textual_variant
lexical_decisions:
- source_word: תהום
  english_pob_choice: the deep
  chosen_korean: 깊은 곳
  alternatives_korean:
  - 깊음
  - 심연
  - 바다 깊은 곳
  lexicon: HALOT
  rationale: 히브리어 תהום은 우주적 ‘깊은 곳/심연’을 가리키므로, 한국어에서는 자연스럽고 현대적인 ‘깊은 곳’으로 옮겨 원뜻을 유지했습니다.
- source_word: לב
  english_pob_choice: the heart
  chosen_korean: 마음
  alternatives_korean:
  - 심장
  - 생각
  - 속사람
  lexicon: HALOT
  rationale: 히브리어 לב은 사고와 의지를 포함하는 내면 전체를 가리키므로, 한국어 성경 문맥에서 자연스럽고 폭넓은 ‘마음’이 적절합니다.
- source_word: חקר
  english_pob_choice: searches out
  chosen_korean: 찾아내시며
  alternatives_korean:
  - 샅샅이 살피시며
  - 탐구하시며
  - 뒤져내시며
  lexicon: HALOT
  rationale: 지속적이고 철저한 탐색의 뉘앙스를 살리기 위해 ‘찾아내시며’를 택했습니다. 현재형 서술로 하나님의 지속적 아심을 나타냅니다.
- source_word: מערומיהם
  english_pob_choice: their nakednesses / their secrets
  chosen_korean: 그들의 모든 드러난 것들
  alternatives_korean:
  - 그들의 모든 비밀
  - 그들의 벌거벗음들
  - 그들의 숨은 것들
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘벌거벗음/드러남’의 뜻을 가지며, 본문은 하나님 앞에 숨김없이 드러난 모든 것을 가리킵니다. 영어 주석의 긴장을 살려 직역과 의미를 함께 반영했습니다.
- source_word: יתבונן
  english_pob_choice: he understands
  chosen_korean: 이해하십니다
  alternatives_korean:
  - 분별하십니다
  - 숙고하십니다
  - 살피십니다
  lexicon: HALOT
  rationale: 단순 관찰이 아니라 깊이 파악하는 인지적 의미이므로, 현대 한국어에서 자연스러운 ‘이해하십니다’가 적절합니다.
theological_decisions:
- issue: 본문의 주어가 히브리어에서는 암시적이지만 문맥상 하나님으로 이해됨
  chosen_reading: 주어를 드러내지 않고 동사 어미로만 존대하여, 본문이 말하는 암시적 주어를 유지했습니다.
  alternative_readings:
  - ‘주님께서’ 또는 ‘하나님께서’로 주어를 명시함
  rationale: 히브리어 본문은 주어를 직접 말하지 않지만, 지혜문맥과 영어 POB의 이해를 따라 하나님을 가리키는 것으로 읽힙니다. 한국어에서는 과잉 보충을 피하고 문맥적 암시를 보존했습니다.
  doctrine_reference: 원문 우선 원칙; 본문에 없는 명시어를 추가하지 않음
