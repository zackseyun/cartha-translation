  lexicon: HALOT
  rationale: 문맥상 지혜문학적 교정과 교육의 뜻을 살리되, 한국어에서 자연스럽고 경고문처럼 들리는 ‘훈계’가 가장 잘 맞습니다.
- source_word: פותה וכסיל
  english_pob_choice: simpleton and a fool
  chosen_korean: 어리석은 자와 우매한 자
  alternatives_korean:
  - 순진한 사람과 어리석은 사람
  - 미련한 자와 바보
  lexicon: HALOT
  rationale: 히브리어와 그리스어가 모두 인지적·도덕적 결핍을 가리키므로, ‘어리석은 자/우매한 자’로 나누어 두 어휘의 강도를 유지했습니다.
- source_word: ושב וישיש ונוטל עצה בזנות
  english_pob_choice: an old man who turns back and takes counsel in sexual immorality
  chosen_korean: 돌이켜 음란한 일에 대해 조언을 구하는 노인
  alternatives_korean:
  - 되돌아가 음행에 대해 상의하는 노인
  - 퇴행하여 음란한 일에 가담하는 노인
  lexicon: HALOT
  rationale: 히브리어의 ‘돌이켜’와 ‘조언을 구하다’의 동작을 살리면서, ‘זנות’를 전통교회어보다 넓게 ‘음란한 일’로 옮겨 도덕적 일탈의 범위를 드러냈습니다.
- source_word: צנוע
  english_pob_choice: modest
  chosen_korean: 단정한
  alternatives_korean:
  - 절제된
  - 겸손한
  - 수수한
  lexicon: HALOT
  rationale: 사람의 태도와 품위를 가리키는 문맥이므로, 외적·윤리적 단속을 함께 담는 ‘단정한’이 가장 자연스럽습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행본문의 차이 반영
  chosen_reading: 본문은 현존 히브리어를 따르고, 하단 주석으로 그리스어의 다른 독법을 밝혔습니다.
  alternative_readings:
  - 그리스어를 따라 ‘젊은이들과 함께 판단을 받는 늙은이’로 옮김
  rationale: 이 절은 핵심 중간 구가 크게 다르므로, 살아 있는 히브리어 증거를 본문으로 삼되 그리스어의 상당한 차이를 숨기지 않는 것이 정확합니다.
  doctrine_reference: 'Sirach 번역 원칙: 보존된 히브리어를 우선하고, 병행 그리스어는 대조 증거로 투명하게 반영합니다.'
