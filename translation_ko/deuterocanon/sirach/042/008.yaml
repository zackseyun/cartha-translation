base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/042/008.yaml
  text: 'Concerning the discipline of a simpleton and a fool[a], and an old man who turns back and takes counsel in sexual immorality: be truly careful[b], and a modest man before every living being.'
  footnotes:
  - marker: a
    text: 'Greek parallel: ''and an extreme old man being judged with young men,'' instead of ''and an old man who turns back to take counsel in sexual immorality.'' The Hebrew and Greek differ substantially in this clause.'
