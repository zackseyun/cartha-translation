  - marker: b
    text: Or 'be truly instructed ... and approved before every living person,' following the Greek parallel more closely in the closing exhortation.
    reason: lexical_alternative
translation:
  language: ko
  text: '어수룩한 자와 우매한 자를 훈계하는 일에 대하여, 또 돌이켜 음행에 관해 조언을 구하는 노인에 대하여[a]: 참으로 조심하고, 모든 살아 있는 이 앞에서 단정한 사람이 되십시오.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 병행본문은 ‘돌이켜 음행에 관해 조언을 구하는 노인’ 대신 ‘젊은이들과 함께 심판받는 매우 늙은 사람’으로 읽습니다. 이 절의 히브리어와 그리스어는 이 구절에서 상당히 다릅니다.
    reason: textual_variant
  - marker: b
    text: 그리스어 병행본문을 더 가깝게 따르면, ‘참으로 교훈을 받고 모든 살아 있는 사람 앞에서 인정받을 것입니다’로도 옮길 수 있습니다.
    reason: lexical_alternative
