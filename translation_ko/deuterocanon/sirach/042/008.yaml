base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/042/008.yaml
  text: 'Concerning the discipline of a simpleton and a fool[a], and an old man who turns back and takes counsel in sexual immorality: be truly careful[b], and a modest man before every living being.'
  footnotes:
  - marker: a
    text: 'Greek parallel: ''and an extreme old man being judged with young men,'' instead of ''and an old man who turns back to take counsel in sexual immorality.'' The Hebrew and Greek differ substantially in this clause.'
    reason: alternative_reading
  - marker: b
    text: Or 'be truly instructed ... and approved before every living person,' following the Greek parallel more closely in the closing exhortation.
    reason: lexical_alternative
translation:
  language: ko
  text: '어리석은 자와 우매한 자의 훈계에 대하여, 그리고 돌이켜 음란한 일에 대해 조언을 구하는 노인에 대하여: 참으로 조심하고, 모든 살아 있는 존재 앞에서 단정한 사람이 되십시오.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 병행본문은 ‘음란한 일에 대해 조언을 구하는 노인’ 대신 ‘젊은이들과 함께 판단을 받는 극히 늙은이’로 읽습니다. 이 절의 히브리어와 그리스어는 상당히 다릅니다.
    reason: textual_variant
  - marker: b
    text: 그리스어 병행본문을 더 따르면 ‘참으로 훈련받고… 모든 살아 있는 사람 앞에서 인정받는다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מוסר
  english_pob_choice: discipline
  chosen_korean: 훈계
  alternatives_korean:
