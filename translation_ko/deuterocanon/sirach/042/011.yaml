base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/042/011.yaml
  text: Keep a strict watch over your virgin daughter[a], lest she make you a byword of disgrace, a gossip of the city and a curse of the people[c][b], and seat you in the assembly at the gate.
  footnotes:
  - marker: a
    text: Hebrew 'a name of disgrace' may also be rendered 'an evil name' or 'shameful repute.' The Greek parallel expands the idea toward becoming an object of public mockery.
    reason: lexical_alternative
  - marker: b
    text: The final clause is difficult in Hebrew. Literally, it speaks of causing you to sit 'in the gathering/crowd at the gate.' The gate was the public place of civic assembly and judgment. The Greek parallel similarly points to public shame before a crowd.
    reason: cultural_note
  - marker: c
    text: Masada preserves the shorter wording 'Over a daughter keep watch; gossip in the city and an assembly of people ...' where the Cairo Geniza text here is fuller.
    reason: textual_variant
translation:
  language: ko
  text: 딸의 처녀성을 두고는 엄중히 지키십시오. 그가 당신을 수치스러운 이름의 사람이 되게 하여, 성읍의 입방아와 백성의 저주가 되게 하고, 성문 회중 가운데 앉게 할까 두렵습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘수치의 이름’ 또는 ‘악한 이름’에 가깝습니다. 그리스어 평행본문은 이것을 공적 조롱의 대상으로 확장합니다.
    reason: lexical_alternative
  - marker: b
    text: 마지막 구절은 히브리어에서 난해합니다. 문자적으로는 ‘성문에서의 모임/무리 가운데 앉게 함’을 말하며, 성문은 공적 집회와 재판의 장소였습니다.
    reason: cultural_note
  - marker: c
    text: 마사다 사본은 더 짧은 형태를 보존합니다. 여기의 카이로 게니자 본문은 그보다 더 길어, 공개적 수치의 묘사를 더 분명히 합니다.
    reason: textual_variant
lexical_decisions:
- source_word: בני על בתולתך החזק משמר
  english_pob_choice: Keep a strict watch over your virgin daughter
  chosen_korean: 딸의 처녀성을 두고는 엄중히 지키십시오
  alternatives_korean:
  - 처녀 딸을 엄중히 지키십시오
  - 딸을 엄중히 감시하십시오
  lexicon: HALOT
  rationale: 히브리어는 딸 자체보다 그녀의 처녀성/순결을 둘러싼 보호를 강조하므로, ‘처녀성’을 분명히 드러내어 POB의 성적·사회적 뉘앙스를 살렸습니다.
- source_word: שם סרה
  english_pob_choice: byword of disgrace
  chosen_korean: 수치스러운 이름의 사람
  alternatives_korean:
  - 수치의 이름
  - 악명
  lexicon: HALOT
  rationale: שם과 סרה는 단순한 평판이 아니라 공개적 수치와 불명예를 가리키므로, 한국어에서도 ‘이름’과 ‘수치’의 결합으로 그 불명예의 성격을 보존했습니다.
- source_word: דבת עיר וקללת עם
  english_pob_choice: a gossip of the city and a curse of the people
  chosen_korean: 성읍의 입방아와 백성의 저주
  alternatives_korean:
  - 도시의 소문거리와 백성의 저주
  - 성읍의 비방과 백성의 저주
  lexicon: HALOT
  rationale: דבה는 단순한 ‘소문’보다 비난과 험담을 포함한 공개적 gossip에 가깝고, קללת는 공동체적 저주를 뜻하므로 각각 자연스럽고 공개 수치를 드러내는 표현으로 옮겼습니다.
- source_word: והושיבתך בעדר שער
  english_pob_choice: and seat you in the assembly at the gate
  chosen_korean: 성문 회중 가운데 앉게 할까 두렵습니다
  alternatives_korean:
  - 성문에서 열린 회중 가운데 앉게 할까 두렵습니다
  - 성문의 모임 가운데 앉게 할까 두렵습니다
  lexicon: HALOT
  rationale: 히브리어는 성문이라는 공적 장소에서의 공개적 망신을 가리키며, POB의 audit trail도 이를 시민적 집회로 이해하므로 ‘성문 회중’으로 간결하게 살렸습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행본문의 관계
  chosen_reading: 히브리어 본문을 기본으로 옮기되, 마지막 절의 공적 수치의 흐름은 그리스어 병행본문이 확인해 주는 방향으로 이해했습니다.
  alternative_readings:
  - 그리스어를 따라 ‘원수들의 웃음거리’와 ‘많은 사람들 앞의 수치’로 더 확장해 옮김
  - 히브리어의 난해한 성문 구절을 직역하여 더 अस्प명하게 유지함
  rationale: 시락서는 살아 있는 히브리어를 우선하되, 난해한 구절에서는 그리스어가 의미 범위를 확인해 줍니다. 이 절은 공개적 수치라는 핵심은 분명하나 문구가 다소 압축되어 있어, 히브리어의 순서를 유지하면서도 그 공개성은 분명히 드러냈습니다.
  doctrine_reference: 'PHILOSOPHY.md: translate Sirach from Hebrew where it survives; use Greek parallel as actual input'
