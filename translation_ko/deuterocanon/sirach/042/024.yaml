  text: All things are in pairs[a], one opposite the other, and he has made nothing lacking.
  footnotes:
  - marker: a
    text: Hebrew Masada witness for this section also supports the sense that nothing was made deficient or lacking, though the Hebrew textual transmission around these lines is fragmentary and differently arranged.
    reason: textual_variant
translation:
  language: ko
  text: 모든 것은 서로 짝을 이루고[a], 하나는 다른 하나의 맞은편에 있으며, 하나님께서는 아무것도 부족하게 만들지 않으셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 마사다 증인도 이 대목에서 ‘무엇도 결핍되거나 부족하게 만들어지지 않았다’는 뜻을 뒷받침합니다. 다만 이 대목의 히브리어 전승은 단편적이고 배열도 다릅니다.
    reason: textual_variant
lexical_decisions:
- source_word: πάντα
  english_pob_choice: All things
  chosen_korean: 모든 것은
  alternatives_korean:
  - 모두는
  - 만물은
  lexicon: LSJ
  rationale: 중성 복수의 포괄성을 살리기 위해 ‘모든 것’ 계열로 옮기되, 한국어 문장 흐름에 맞게 주어 자리에 자연스럽게 배치했습니다.
- source_word: δισσὰ
  english_pob_choice: are in pairs
  chosen_korean: 서로 짝을 이루어 있습니다
  alternatives_korean:
  - 둘씩 있습니다
  - 두 갈래로 있습니다
  - 쌍을 이룹니다
  lexicon: LSJ
  rationale: 단순한 ‘둘’이 아니라 상호 대응하는 짝맞춤의 의미가 있어, “짝을 이루다”로 관계성을 드러냈습니다.
- source_word: ἐν κατέναντι τοῦ ἑνός
  english_pob_choice: one opposite the other
  chosen_korean: 하나는 다른 하나의 맞은편에
  alternatives_korean:
  - 서로 마주 보고
  - 한쪽이 다른 쪽의 반대편에
  - 서로 대조되며
  lexicon: LSJ
  rationale: κατέναντι의 ‘마주함/맞은편’ 의미를 보존하되, 한국어에서는 “맞은편에”가 가장 직관적이고 원문의 대조 관계를 잘 드러냅니다.
- source_word: οὐδὲν ἐκλιπόν
  english_pob_choice: nothing lacking
  chosen_korean: 아무것도 빠진 것 없이
  alternatives_korean:
  - 무엇 하나 빠짐없이
  - 결핍된 것이 없이
  - 부족한 것 없이
  lexicon: LSJ
  rationale: ἐκλιπόν의 ‘빠지다, 결핍되다’ 범위를 반영해, 완전성과 누락 없음이라는 뜻을 간결하게 살렸습니다.
theological_decisions:
- issue: 창조의 완전성 진술
  chosen_reading: “하나님은 아무것도 빠진 것 없이 만드셨습니다”로 옮겨, 원문의 완결성과 부족 없음의 진술을 직접 유지했습니다.
  alternative_readings:
  - “아무것도 부족하지 않게 하셨습니다”
  - “결함 없이 만드셨습니다”
  rationale: 본문은 지혜 전통의 관찰로서 피조 세계의 질서와 충만함을 진술하므로, 완전성을 약화시키지 않는 직역-의역 균형이 적절합니다.
  doctrine_reference: 창조의 선함과 질서에 대한 지혜문학적 진술
- issue: 주어의 명시
  chosen_reading: 암시된 주어를 ‘하나님’으로 명시했습니다.
  alternative_readings:
  - 주어를 생략한 무인칭 표현
  - ‘그분’으로 완곡하게 표현
  rationale: 그리스어 동사는 문맥상 하나님을 가리키는 암시된 주어를 가지며, 한국어에서는 이를 분명히 밝혀 문맥의 일관성과 가독성을 높였습니다.
  doctrine_reference: 원문 맥락 우선과 문장 명시화
