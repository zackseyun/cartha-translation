  source_fidelity: 히브리어 כי מבגד יצא עש, ומאשה רעת אשה 및 그리스어 병행문은 ‘옷/의복’에서 나오는 ‘좀’과 ‘여자’에게서 나오는 ‘여자의 악’을 병치합니다. 초안은 이 의미와 불편함을 일으킬 수 있는 성별 표상을 임의로 완화하지 않은 점에서 대체로 충실합니다. 다만 עש/σής에는 ‘좀벌레’보다 옷을 해치는 해충을 가리키는 간결한 ‘좀’이 더 정확하며, 한국어에서는 둘째 절에 서술어를 보충하는 것이 원문의 생략된 병렬 술어를 자연스럽게 재현합니다.
  naturalness: ‘여자의 악함’은 현대 한국어에서 다소 어색하고 추상명사로서 무겁습니다. ‘여자의 악’이 더 자연스럽고, 원문의 רעת 및 πονηρία의 간결하고 날카로운 명사 표현에도 가깝습니다. ‘옷에서는 … 여자에게서는 …’과 각 절의 ‘나오다’는 합쇼체 문장 안에서 매끄럽고 병렬을 분명히 합니다.
  terminology: ‘옷’은 בגד/ἱμάτιον에 적절합니다. ‘좀’은 의복을 해치는 עש/σής의 통상적이고 간결한 한국어 대응어입니다. רעת אשה는 소유·속격 관계를 보존하여 ‘여자의 악’으로 옮깁니다. 이는 여성을 일반화하여 평가하는 고대 속담의 표현을 그대로 전달할 뿐, 그 범위를 확대하거나 교리적으로 해석하지 않습니다.
