translation:
  language: ko
  text: 왜냐하면 옷에서 좀벌레가 나오고, 여자에게서 여자의 악함이 나오기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 문자적으로, ‘여자에게서 여자의 악이 나온다.’ 히브리어는 매우 간결한 속담체이며, 그리스어도 ‘여자에게서 여자의 사악함’이라고 읽습니다.
    reason: lexical_alternative
