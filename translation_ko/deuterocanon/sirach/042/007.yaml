  text: For whatever place you appoint[a], keep count by your hand; and every giving and receiving should be in writing.
  footnotes:
  - marker: a
    text: The Hebrew wording is somewhat compressed here. The Greek parallel reads, 'Whatever you hand over, do it by number and weight, and let every giving and receiving be in writing,' which supports the verse's sense of careful, documented accounting.
    reason: alternative_reading
translation:
  language: ko
  text: 무엇이든 맡기시는 것은 손으로 수를 세고, 주고받는 모든 것은 기록으로 남기십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 압축되어 있어 문자 그대로는 다소 간결합니다. 그리스어 병행문은 ‘무엇이든 넘겨줄 때는 수와 무게로 하며, 모든 주고받음을 기록으로 하라’는 뜻을 보여 주어, 문맥상 신중한 회계와 문서화를 뒷받침합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: על מקום / ὃ ἐὰν παραδιδῷς
  english_pob_choice: For whatever place you appoint
  chosen_korean: 무엇이든 맡기시는 것은
  alternatives_korean:
  - 어떤 곳이든 당신이 정하시는 것은
  - 무엇이든 당신이 맡기시는 것은
  - 어떤 것을 맡기시든
  lexicon: HALOT / LXX παραδίδωμι
  rationale: 히브리어의 מקום과 תפקד를 기계적으로 한 단어로 합치지 않고, 영어 POB가 복원한 ‘맡기다/위탁하다’의 뜻을 따라 한국어에서는 대상 일반을 나타내는 ‘무엇이든’과 ‘맡기시는 것’을 써서 문맥의 관리·위탁 의미를 살렸습니다.
- source_word: תפקד
  english_pob_choice: you appoint
  chosen_korean: 맡기시는
  alternatives_korean:
  - 지정하시는
  - 임명하시는
  - 정하시는
  lexicon: HALOT
  rationale: פקד는 ‘임명하다’보다 여기서는 맡기다, 위탁하다의 뉘앙스가 더 자연스럽기 때문에, 앞뒤 문맥의 회계·기록 지시와 맞게 ‘맡기시는’으로 옮겼습니다.
- source_word: יד תספור
  english_pob_choice: keep count by your hand
  chosen_korean: 손으로 수를 세고
  alternatives_korean:
  - 손으로 계산하고
  - 직접 세고
  - 손수 세고
  lexicon: HALOT
  rationale: 직역의 ‘손이 센다’는 한국어에서 어색하므로, 손을 도구로 삼아 세는 행위를 자연스럽게 풀어 ‘손으로 수를 세고’라고 옮겼습니다. 이로써 개인적이고 신중한 계산이라는 이미지도 유지됩니다.
- source_word: ומתת ולקח הכל בכתב
  english_pob_choice: every giving and receiving should be in writing
  chosen_korean: 주고받는 모든 것은 기록으로 남기십시오
  alternatives_korean:
  - 모든 주고받음은 글로 남기십시오
  - 모든 주고받는 것은 문서로 하십시오
  - 모든 지급과 수령은 기록으로 남기십시오
  lexicon: HALOT / LXX δόσις καὶ λῆψις
  rationale: ‘주고받음’은 히브리어의 대구를 자연스럽게 풀어 주는 표현이고, ‘기록으로 남기십시오’는 בכתב의 문자 기록성을 현대 한국어로 분명히 드러냅니다.
theological_decisions:
- issue: 지혜문학의 실무적 명령을 현대 한국어 명령형으로 옮기는 방식
  chosen_reading: 청자에게 직접 주는 지침으로 보고, 공손한 명령형 ‘-십시오’를 사용했습니다.
  alternative_readings:
  - 서술형으로 완화해 ‘…해야 합니다’로 옮김
  - 전통적인 경어체 ‘-하소서’를 사용
  rationale: 본문은 회계와 관리에 관한 실천 지침이므로, 합쇼체 명령형이 원문의 직접성과 실용성을 가장 잘 전달합니다.
  doctrine_reference: Sirach 42:7의 지혜 교훈적 문맥
