  naturalness: 초안의 ‘무엇이든 맡기시는 것은’은 문법적으로 어색하며, 청자를 높이는 ‘-시-’가 불필요하게 들어가 있습니다. ‘무엇이든 맡기실 때에는’은 합쇼체 권면으로 자연스럽고, 조건적/상황적 의미도 분명히 합니다. ‘모든 주고받음은’도 현대 한국어에서 자연스럽고 간결합니다.
  terminology: ‘기록으로 남기십시오’는 בכתב(글로, 서면으로)를 현대적이고 정확하게 전달합니다. ‘손수’는 יד(손)의 구체적 이미지를 자연스럽게 살립니다. ‘맡기다’는 논쟁 여지가 있는 첫 구절에 대한 그리스어 병행문의 이해를 반영하되, 각주로 그 근거와 한계를 밝혀야 합니다.
