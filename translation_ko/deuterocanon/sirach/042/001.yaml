base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/042/001.yaml
  text: Do not be ashamed of these things, and do not show partiality and sin.
  footnotes:
  - marker: a
    text: The Greek parallel preserved in the Septuagint has a substantially different wording here, expanding the instruction into several specific matters of shame and discretion. The Hebrew Cairo Geniza text is followed for the main translation.
    reason: textual_variant
  - marker: b
    text: Or 'do not show favoritism.' The Hebrew idiom literally says 'do not lift up a face.'
    reason: lexical_alternative
  - marker: c
    text: The final phrase could also be understood more explicitly as 'and so sin' or 'lest you sin.'
    reason: alternative_reading
translation:
  language: ko
  text: 그러나 이런 것들에 대해서는[a] 부끄러워하지 마십시오. 편파적으로 대하여[b] 죄를 짓지 마십시오.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 칠십인역(LXX)은 여기서 ‘부끄러워하지 말라’는 권면을 여러 구체적 항목으로 크게 확장하여, 히브리어 본문과 상당히 다르게 전합니다. 본문은 히브리어 카이로 게니자 전승을 따릅니다.
    reason: textual_variant
  - marker: b
    text: 히브리어 관용구는 문자적으로 ‘얼굴을 들다’입니다. 문맥에서는 사람을 편들거나 특혜를 베푸는 것, 곧 편파적으로 대하는 것을 뜻합니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 마지막 말은 문자적으로 ‘그리고 죄를 짓다’라고 매우 압축되어 있습니다. ‘그리하여 죄를 짓지 않도록’ 또는 ‘죄를 짓지 마십시오’라는 경고로 이해할 수 있으며, 편파적 대우와 죄의 정확한 통사 관계는 분명하지 않습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אך על אלה
