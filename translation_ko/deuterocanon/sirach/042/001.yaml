  rationale: אך의 제한·강조와 על אלה의 ‘대상/주제’ 의미를 자연스럽게 살려, 부끄러움의 대상이 되는 ‘이런 것들에 대해’로 옮겼습니다.
- source_word: אל תבוש
  english_pob_choice: do not be ashamed
  chosen_korean: 부끄러워하지 마십시오
  alternatives_korean:
  - 부끄러워하지 말십시오
  - 수치를 당하지 마십시오
  - 부끄럼을 느끼지 마십시오
  lexicon: HALOT
  rationale: בוש의 핵심 의미는 단순한 민망함보다 수치·부끄러움이므로, 현대 합쇼체에서 가장 직접적인 대응인 ‘부끄러워하지 마십시오’를 택했습니다.
- source_word: אל תשא פנים
  english_pob_choice: do not show partiality
  chosen_korean: 편파적으로 대하지 말고
  alternatives_korean:
  - 얼굴을 들어 주지 말고
  - 편애하지 말고
  - 사람을 차별하지 말고
  lexicon: HALOT
  rationale: נשא פנים의 관용구적 뜻을 살려, 직역보다 윤리적 의미가 분명한 ‘편파적으로 대하다’로 옮겼습니다.
- source_word: וחטא
  english_pob_choice: and sin
  chosen_korean: 죄를 짓지 마십시오
  alternatives_korean:
  - 그리고 죄를 짓고
  - 그래서 죄를 짓지 마십시오
  - 그리하여 죄를 짓게 됩니다
  lexicon: HALOT
  rationale: 히브리어는 매우 압축되어 있지만 한국어에서는 종결형으로 풀어야 하므로, 문맥상 경고의 뜻을 살려 ‘죄를 짓지 마십시오’로 자연스럽게 제시했습니다.
theological_decisions:
- issue: 마지막 절의 קצר한 히브리어 구조를 어떻게 처리할지
  chosen_reading: ‘편파적으로 대하지 말고 죄를 짓지 마십시오’로 읽어, 편파가 곧 죄로 이어지는 경고를 유지했습니다.
  alternative_readings:
  - ‘편파적으로 대하고 죄를 지으십시오’로 오해될 수 있는 분절
  - ‘편파적으로 대하지 말고, 그렇게 하여 죄를 짓지 마십시오’처럼 결과를 명시
  rationale: 원문은 접속과 생략이 매우 압축되어 있어, 한국어에서는 의미를 분명히 하되 관계를 과도하게 재구성하지 않는 번역이 필요합니다. 따라서 경고의 방향을 유지하면서도 문장 흐름은 자연스럽게 정리했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 3 (원문의 긴장과 압축을 보존)
