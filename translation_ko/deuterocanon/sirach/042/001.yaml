base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/042/001.yaml
  text: Do not be ashamed of these things, and do not show partiality and sin.
  footnotes:
  - marker: a
    text: The Greek parallel preserved in the Septuagint has a substantially different wording here, expanding the instruction into several specific matters of shame and discretion. The Hebrew Cairo Geniza text is followed for the main translation.
    reason: textual_variant
  - marker: b
    text: Or 'do not show favoritism.' The Hebrew idiom literally says 'do not lift up a face.'
    reason: lexical_alternative
  - marker: c
    text: The final phrase could also be understood more explicitly as 'and so sin' or 'lest you sin.'
    reason: alternative_reading
translation:
  language: ko
  text: 이런 것들에 대해 부끄러워하지 마십시오. 또한 편파적으로 대하지 말고 죄를 짓지 마십시오.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: LXX는 여기서 ‘부끄러워하지 말라’는 권면을 더 구체적인 여러 항목으로 확장합니다. 본문은 히브리어 카이로 게니자 전승을 따릅니다.
    reason: textual_variant
  - marker: b
    text: 히브리어 관용구는 문자적으로는 ‘얼굴을 들지 말라’는 뜻입니다.
    reason: lexical_alternative
  - marker: c
    text: 마지막 표현은 ‘그리고 죄를 지으라’가 아니라, ‘죄를 짓지 마십시오’처럼 경고적으로 이해할 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אך על אלה
  english_pob_choice: of these things
  chosen_korean: 이런 것들에 대해
  alternatives_korean:
  - 이것들에 대해
  - 이런 일들에 대해
  - 이런 것들 때문에
  lexicon: HALOT
  rationale: אך의 제한·강조와 על אלה의 ‘대상/주제’ 의미를 자연스럽게 살려, 부끄러움의 대상이 되는 ‘이런 것들에 대해’로 옮겼습니다.
- source_word: אל תבוש
  english_pob_choice: do not be ashamed
  chosen_korean: 부끄러워하지 마십시오
  alternatives_korean:
  - 부끄러워하지 말십시오
  - 수치를 당하지 마십시오
  - 부끄럼을 느끼지 마십시오
  lexicon: HALOT
  rationale: בוש의 핵심 의미는 단순한 민망함보다 수치·부끄러움이므로, 현대 합쇼체에서 가장 직접적인 대응인 ‘부끄러워하지 마십시오’를 택했습니다.
- source_word: אל תשא פנים
  english_pob_choice: do not show partiality
  chosen_korean: 편파적으로 대하지 말고
  alternatives_korean:
  - 얼굴을 들어 주지 말고
  - 편애하지 말고
  - 사람을 차별하지 말고
  lexicon: HALOT
  rationale: נשא פנים의 관용구적 뜻을 살려, 직역보다 윤리적 의미가 분명한 ‘편파적으로 대하다’로 옮겼습니다.
- source_word: וחטא
  english_pob_choice: and sin
  chosen_korean: 죄를 짓지 마십시오
  alternatives_korean:
  - 그리고 죄를 짓고
  - 그래서 죄를 짓지 마십시오
  - 그리하여 죄를 짓게 됩니다
  lexicon: HALOT
  rationale: 히브리어는 매우 압축되어 있지만 한국어에서는 종결형으로 풀어야 하므로, 문맥상 경고의 뜻을 살려 ‘죄를 짓지 마십시오’로 자연스럽게 제시했습니다.
theological_decisions:
- issue: 마지막 절의 קצר한 히브리어 구조를 어떻게 처리할지
  chosen_reading: ‘편파적으로 대하지 말고 죄를 짓지 마십시오’로 읽어, 편파가 곧 죄로 이어지는 경고를 유지했습니다.
  alternative_readings:
  - ‘편파적으로 대하고 죄를 지으십시오’로 오해될 수 있는 분절
  - ‘편파적으로 대하지 말고, 그렇게 하여 죄를 짓지 마십시오’처럼 결과를 명시
  rationale: 원문은 접속과 생략이 매우 압축되어 있어, 한국어에서는 의미를 분명히 하되 관계를 과도하게 재구성하지 않는 번역이 필요합니다. 따라서 경고의 방향을 유지하면서도 문장 흐름은 자연스럽게 정리했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 3 (원문의 긴장과 압축을 보존)
