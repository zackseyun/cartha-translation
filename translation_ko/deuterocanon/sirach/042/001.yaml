- from: 이런 것들에 대해 부끄러워하지 마십시오. 또한 편파적으로 대하지 말고 죄를 짓지 마십시오.[a][b][c]
  to: 그러나 이런 것들에 대해서는[a] 부끄러워하지 마십시오. 편파적으로 대하여[b] 죄를 짓지 마십시오.[c]
