base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/042/012.yaml
  text: Do not display your beauty to any man[b][a], and do not sit among women in the house.
  footnotes:
  - marker: a
    text: 'Hebrew: ''to every male do not give beauty/appearance.'' The Greek parallel reads, ''Do not look upon every person/man in beauty,'' reflecting a different understanding of the line.'
    reason: alternative_reading
  - marker: b
    text: The final Hebrew verb is uncertain in the Geniza text. The Greek parallel supports the sense 'do not sit/keep company among women.' A Masada witness is reported to reflect a related social-interaction reading rather than the exact Geniza wording.
    reason: textual_variant
translation:
  language: ko
  text: 아무 남자에게도 당신의 아름다움을 보이지 마십시오[b][a]. 그리고 여자들 가운데서 집에 앉아 있지 마십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 '모든 남자에게 아름다움을 주지 말라'에 가깝고, 그리스어 평행본문은 '모든 사람/남자를 아름다움 안에서 보지 말라'는 다른 이해를 보입니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어 본문의 마지막 동사는 게나자 본문에서 불확실합니다. 그리스어 평행본문은 '여자들 가운데서 함께 앉지 말라'는 뜻을 지지합니다.
    reason: textual_variant
lexical_decisions:
- source_word: לכל זכר
  english_pob_choice: to any man
  chosen_korean: 아무 남자에게도
  alternatives_korean:
  - 어떤 남자에게도
  - 어떤 남성에게도
  - 모든 남자에게
  lexicon: HALOT
  rationale: 히브리어 זכר는 성별이 분명한 '남자/남성'을 가리키므로, 합쇼체에서도 그 구분을 살려 '아무 남자에게도'로 옮겼습니다.
- source_word: אל תתן תאר
  english_pob_choice: do not display your beauty
  chosen_korean: 당신의 아름다움을 보이지 마십시오
  alternatives_korean:
  - 당신의 모습을 드러내지 마십시오
  - 당신의 용모를 드러내지 마십시오
  - 당신의 아름다움을 드러내지 마십시오
  lexicon: HALOT
  rationale: תאר는 문맥상 외모/아름다움의 노출을 뜻하므로, POB의 'display your beauty'에 맞춰 자연스러운 한국어로 '아름다움을 보이지 마십시오'를 택했습니다.
- source_word: ובית נשים
  english_pob_choice: in the house
  chosen_korean: 집에
  alternatives_korean:
  - 여자들의 집에
  - 여인들의 집에
  - 여자들 가운데서
  lexicon: HALOT
  rationale: 본문의 히브리어는 '여자의 집/여자들의 집'처럼 읽히지만, 전승상 어색하고 뒤의 동사가 사회적 동석을 가리키므로, 장소성은 '집에'로 두고 다음 절의 '여자들 가운데서'와 함께 뜻을 드러냈습니다.
- source_word: אל תסתויד
  english_pob_choice: do not sit among women in the house
  chosen_korean: 여자들 가운데서 집에 앉아 있지 마십시오
  alternatives_korean:
  - 여자들 가운데서 어울리지 마십시오
  - 여자들 가운데서 머물지 마십시오
  - 여자들 가운데서 함께 앉지 마십시오
  lexicon: HALOT
  rationale: 마소라 본문의 동사는 불확실하지만, 그리스어 συνέδρευε가 '함께 앉다/어울리다'의 뜻을 분명히 보여 주므로, 가장 보수적으로 '앉아 있지 마십시오'로 옮겼습니다.
theological_decisions:
- issue: 히브리어와 그리스어 병행본이 갈라지는 난구를 어떻게 반영할지
  chosen_reading: 본문은 히브리어를 기본으로 하되, 마지막 동사는 그리스어 병행본이 제시하는 '함께 앉다'의 의미를 반영했습니다.
  alternative_readings:
  - 히브리어를 직역해 अस्प명한 동사를 그대로 살린다
  - 그리스어만 따라 '여자들 가운데서 앉지 마십시오'로 정리한다
  rationale: 시락서는 현존 히브리어가 우선이지만, 이 절은 히브리어 말단 동사가 불확실하므로 그리스어가 의미를 확정하는 보조 증거로 기능합니다. 그래서 본문 의미를 보존하면서도 사본 차이를 지우지 않도록 처리했습니다.
  doctrine_reference: Sirach source policy / original-language primacy
- issue: 성별 표지를 유지할지 여부
  chosen_reading: '''남자''와 ''여자들''의 성별 구분을 그대로 유지했습니다.'
  alternative_readings:
  - 성중립적으로 '사람들'로 바꾼다
  - '''남성''과 ''여성들''처럼 더 형식적으로 바꾼다'
  rationale: 히브리어가 זכר와 נשים로 분명히 구분하므로, 현대 한국어에서도 그 대립을 흐리지 않는 번역이 원문 충실성에 더 적합합니다.
  doctrine_reference: Translation philosophy / gender accuracy
