  yaml_path: translation/deuterocanon/sirach/042/025.yaml
  text: One thing complements another's good things[b][a], and who can have enough of seeing his glory?
  footnotes:
  - marker: a
    text: Or, more formally, 'One strengthens the good things of another.' The Greek verb can mean 'make firm' or 'strengthen,' and the line expresses the mutual fittingness of created things.
    reason: lexical_alternative
  - marker: b
    text: The pronoun 'his' most likely refers to God; alternatively, it could be understood more impersonally as the splendor displayed in creation.
    reason: alternative_reading
translation:
  language: ko
  text: 한 것은 다른 것의 좋은 것들을 보완하며, 누가 그 영광을 보는 데 만족하겠습니까?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 더 직역하면 ‘한 것은 다른 것의 좋은 것들을 굳게 합니다’에 가깝습니다. 이 동사는 ‘굳게 하다’ 또는 ‘강화하다’의 뜻을 가지며, 여기서는 피조물들 사이의 상호 적합성을 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그 영광’에서 ‘그’는 문맥상 하나님을 가리킬 가능성이 가장 높지만, 창조 가운데 드러나는 광채를 가리키는 비인칭적 이해도 가능합니다.
    reason: alternative_reading
