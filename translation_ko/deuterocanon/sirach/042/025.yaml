  yaml_path: translation/deuterocanon/sirach/042/025.yaml
  text: One thing complements another's good things[b][a], and who can have enough of seeing his glory?
  footnotes:
  - marker: a
    text: Or, more formally, 'One strengthens the good things of another.' The Greek verb can mean 'make firm' or 'strengthen,' and the line expresses the mutual fittingness of created things.
    reason: lexical_alternative
  - marker: b
    text: The pronoun 'his' most likely refers to God; alternatively, it could be understood more impersonally as the splendor displayed in creation.
    reason: alternative_reading
translation:
  language: ko
  text: 한 좋은 것은 다른 좋은 것을 보완하며, 누가 그 영광을 보는 데 만족하겠습니까?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 더 직역하면 ‘한 것은 다른 것의 좋은 것들을 굳게 합니다’에 가깝습니다. 이 동사는 ‘굳게 하다’ 또는 ‘강화하다’의 뜻을 가지며, 여기서는 피조물들 사이의 상호 적합성을 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그 영광’의 주체는 문맥상 하나님일 가능성이 가장 높지만, 창조가 드러내는 광채를 가리키는 비인칭적 이해도 가능합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἓν τοῦ ἑνός
  english_pob_choice: One thing ... another's good things
  chosen_korean: 한 좋은 것은 다른 좋은 것을 보완하며
  alternatives_korean:
  - 한 것이 다른 것의 좋은 것을 보태며
  - 서로 하나가 다른 하나를 이루며
  - 한 것 하나가 다른 것 하나를 완성하며
  lexicon: LSJ
  rationale: 헬라어의 생략된 관용 표현은 단순한 수량이 아니라 사물들 사이의 상호 관계를 가리키므로, 한국어에서도 ‘한 ... 다른 ...’의 대응 구조로 옮겨 상호 보완성을 살렸습니다.
- source_word: ἐστερέωσεν
  english_pob_choice: complements
  chosen_korean: 보완하며
  alternatives_korean:
  - 강하게 하며
  - 견고하게 하며
  - 굳게 하며
  - 완성하며
  lexicon: LSJ
  rationale: 기본 의미는 ‘굳게 하다/견고하게 하다’이지만, 문맥상 창조물들 사이의 상호 적합성과 채움을 드러내므로 ‘보완하다’가 POB의 관계적 뉘앙스를 가장 잘 살립니다.
- source_word: τίς πλησθήσεται
  english_pob_choice: who can have enough
  chosen_korean: 누가 ... 만족하겠습니까?
  alternatives_korean:
  - 누가 ... 다 채울 수 있겠습니까?
  - 누가 ... 충분히 보겠습니까?
  - 누가 ... 배부르겠습니까?
  lexicon: LSJ
  rationale: 반문형으로서 ‘더 이상 충분히 가지다/만족하다’의 뜻이므로, 한국어에서는 ‘만족하겠습니까?’로 자연스럽게 옮겼습니다.
- source_word: δόξαν αὐτοῦ
  english_pob_choice: his glory
  chosen_korean: 그 영광
  alternatives_korean:
  - 그분의 영광
  - 그의 영광
  - 그 광채
  lexicon: LSJ
  rationale: 문맥상 그 영광의 주체는 하나님으로 읽는 것이 가장 자연스럽지만, 한국어에서는 인칭대명사를 과하게 드러내지 않고도 신적 지시를 유지할 수 있어 ‘그 영광’으로 처리했습니다.
theological_decisions:
- issue: αὐτοῦ의 지시 대상
  chosen_reading: ‘그 영광’은 하나님이 창조 가운데 드러내시는 영광을 가리키는 것으로 읽었습니다.
  alternative_readings:
  - 창조 자체의 광채를 가리키는 비인칭적 표현으로 읽을 수 있습니다.
  rationale: 창조 질서와 아름다움을 찬양하는 문맥에서 영광의 근원은 하나님으로 이해하는 것이 가장 자연스럽습니다. 다만 헬라어 자체가 비인칭적 해석도 허용하므로, 한국어 본문은 해석을 과도하게 고정하지 않도록 했습니다.
  doctrine_reference: 문맥 우선 해석과 번역상의 신학적 긴장 보존
- issue: ‘보완하다’의 선택
  chosen_reading: 사물들이 서로를 더 온전하게 드러내고 채운다는 관계적 의미를 살려 ‘보완하다’를 택했습니다.
  alternative_readings:
  - ‘강하게 하다’나 ‘굳게 하다’로 더 문자적으로 옮길 수 있습니다.
  rationale: 본문은 단순한 힘의 증가보다 창조 세계의 상호 적합성과 질서를 말하므로, 의미 기능을 살리는 쪽이 POB의 의도에 맞습니다.
  doctrine_reference: 창조의 상호성에 대한 문맥적 번역
