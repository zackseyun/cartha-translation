  terminology: ‘그분만이 영원부터 계십니다’는 אחד הוא와 מעולם의 유일성 및 영원성 표현을 자연스럽게 반영합니다. ‘감해지지 않으며’는 하나님에게 무언가가 보태지거나 덜어질 수 없다는 문맥을 나타내되, 난해한 히브리어를 과도하게 특정하지 않습니다.
