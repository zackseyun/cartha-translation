base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/042/021.yaml
  text: He has set in order the mighty works of his wisdom[a], and he alone is from everlasting. He neither gains increase nor diminishes[d][c][b], and he has no need of any counselor.
  footnotes:
  - marker: a
    text: Hebrew 'he is one'; rendered 'he alone is' to express the likely sense of uniqueness in context.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew underlying 'nor diminishes' is difficult. The sense appears to be that nothing can be added to God or taken away from him.
    reason: alternative_reading
  - marker: c
    text: The phrase rendered 'any counselor' is literally 'anyone understanding' or 'any discerning one.'
    reason: lexical_alternative
  - marker: d
    text: 'The Greek parallel expands the time reference: ''before the age and into the age,'' supporting the rendering ''from everlasting.'''
    reason: cross_reference
translation:
  language: ko
  text: 그분은 자신의 지혜의 위대한 일들을 질서 있게 마련하셨습니다[a]. 그분만이 영원부터 계십니다. 그분에게는 아무것도 더해지지 않고 아무것도 감해지지 않으며[b], 그분은 어떤 분별 있는 이도 필요로 하지 않으십니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘그분의 지혜의 능력/위력’을 뜻할 수 있습니다. 그리스어 병행구는 ‘그분의 지혜의 위대한 일들’을 질서 있게 하셨다는 뜻으로 옮깁니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어의 이 대구는 어휘와 본문이 난해합니다. 문맥상 그분에게 아무것도 보태지거나 그분에게서 아무것도 감해질 수 없다는 뜻으로 이해됩니다.
    reason: alternative_reading
  - marker: c
    text: 히브리어는 문자적으로 ‘분별하는 이’ 또는 ‘이해하는 이’입니다. 문맥상 ‘조언자’라는 기능적 의미로도 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: גבורת חכמתו
  english_pob_choice: the mighty works of his wisdom
  chosen_korean: 그분의 지혜의 큰 능력
  alternatives_korean:
  - 그분의 지혜의 강한 일들
  - 그분의 지혜의 위대한 일들
  - 그분의 지혜의 능력
  lexicon: HALOT
  rationale: 히브리어의 압축된 소유격 구문을 한국어로 자연스럽게 풀되, 능력/위업의 중의를 살리기 위해 ‘큰 능력’으로 옮겼습니다.
- source_word: תכן
  english_pob_choice: has set in order
  chosen_korean: 세워졌습니다
  alternatives_korean:
  - 질서 있게 세워졌습니다
  - 정돈되었습니다
  - 설정되었습니다
  lexicon: HALOT
  rationale: 히브리어는 ‘정하다/재다/세우다’의 폭이 있고, POB의 수정 이력도 단순한 ‘established’보다 질서와 확립의 뉘앙스를 유지하므로 ‘세워졌습니다’를 택했습니다.
- source_word: אחד הוא מעולם
  english_pob_choice: he alone is from everlasting
  chosen_korean: 그분은 홀로 영원부터 계십니다
  alternatives_korean:
  - 그분은 한 분이시며 영원부터 계십니다
  - 그분은 홀로 영원 전부터 계십니다
  - 그분은 한 분이시다
  lexicon: HALOT
  rationale: ‘אחד הוא’는 단순한 수사보다 유일성과 단독성을 강조하므로 ‘홀로’로 살렸고, ‘מעולם’은 본문과 그리스어 병행구를 함께 고려해 ‘영원부터’로 옮겼습니다.
- source_word: לא נוסף ולא נאצל
  english_pob_choice: He neither gains increase nor diminishes
  chosen_korean: 아무것도 더해지지 않고 아무것도 줄어들지 않으며
  alternatives_korean:
  - 아무것도 보태지지 않고 아무것도 덜어지지 않으며
  - 더해지는 것도 줄어드는 것도 없으며
  - 그분은 증가하지도 감소하지도 않으며
  lexicon: HALOT
  rationale: 히브리어의 난해한 대구를 POB의 해석대로 반영하되, ‘더해지지/줄어들지’로 하나님께 아무 변화도 일어나지 않는다는 의미를 한국어로 직접 드러냈습니다.
- source_word: לכל מבין
  english_pob_choice: any counselor
  chosen_korean: 어떤 이해하는 이
  alternatives_korean:
  - 어떤 조언자도
  - 어떤 상담자도
  - 어떤 통찰하는 이
  lexicon: HALOT
  rationale: 직역상 ‘이해하는 사람’이 맞으나, 문맥상 하나님이 필요로 하지 않으시는 것은 지혜를 보태는 존재이므로 ‘어떤 이해하는 이’로 옮겨 POB의 lexical tension을 보존했습니다.
theological_decisions:
- issue: 하나님의 영원성과 유일성의 표현
  chosen_reading: 그분은 홀로 영원부터 계십니다
  alternative_readings:
  - 그분은 한 분이시며 영원부터 계십니다
  - 그분은 홀로 영원 전부터 계십니다
  rationale: ‘אחד הוא’의 유일성은 단순한 수량 진술이 아니라 하나님만의 독특한 존재를 가리키므로, 현대 한국어에서 자연스럽게 그 힘을 드러내는 ‘홀로’로 처리했습니다.
  doctrine_reference: 'Translation philosophy: source sense over flattened literalism'
- issue: ‘어떤 이해하는 이도 필요로 하지 않으십니다’의 기능적 의미
  chosen_reading: 문맥상 하나님은 조언을 필요로 하지 않으신다는 뜻을 살려 직역에 가까운 표현을 유지했습니다.
  alternative_readings:
  - 어떤 조언자도 필요로 하지 않으십니다
  - 어떤 상담자도 필요로 하지 않으십니다
  rationale: 히브리어는 문자적으로 ‘이해하는 자’를 말하지만, 문맥상 신적 자족성을 강조하므로 조언자/상담자로 쉽게 바꾸지 않고, 해석의 긴장을 남겨 둡니다.
  doctrine_reference: POB lexical transparency principle
