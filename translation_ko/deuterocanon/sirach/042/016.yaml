  source_fidelity: 히브리어 שמש זורחת은 태양이 떠오르며 빛나는 이미지를 담습니다. 현행 ‘비치고’는 빛의 의미는 살리지만 ‘떠오름’의 이미지를 평준화합니다. ‘드러난 모든 것 위에’ 및 두 번째 행의 ‘영광 … 모든 일 위에’는 히브리어의 포괄적 범위와 병행을 적절히 반영합니다.
  naturalness: ‘해는 떠올라 드러난 모든 것 위에 비치고’는 현대 표준어의 자연스러운 시적 문장입니다. 하나님을 가리키는 대명사는 ‘그분’이 현대 한국어 성서 문체에서 더 공손하고 분명합니다.
  terminology: ה'의 ‘야훼’와 כבוד의 ‘영광’은 제시된 프로젝트 방침 및 원문에 부합합니다. מעשיו는 ‘그분의 모든 일’로 유지할 수 있으며, 창조된 것과 행하신 일을 포괄하는 원문의 폭을 과도하게 제한하지 않습니다.
