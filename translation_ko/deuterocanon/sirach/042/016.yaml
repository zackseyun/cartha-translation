    reason: textual_variant
translation:
  language: ko
  text: 해는 떠올라 드러난 모든 것 위에 비치고, 야훼의 영광은 그분의 모든 일 위에 있습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘드러난/보이는 모든 것 위에’에 가깝고, 헬라어 병행본문은 ‘비추며 모든 것을 바라본다’는 뜻에 더 가깝습니다.
    reason: alternative_reading
  - marker: b
    text: 이 절의 히브리어 전승은 마사다 사본과 카이로 게니자 본문 사이에 세부 표현 차이가 있는 것으로 보입니다.
    reason: textual_variant
lexical_decisions:
- source_word: שמש זורחת
  english_pob_choice: The sun rises and shines
  chosen_korean: 해는 비치고
  alternatives_korean:
  - 해는 솟아오르고 빛납니다
  - 해는 떠오르고 비칩니다
  lexicon: HALOT
  rationale: 히브리어 זרח는 ‘떠오르다’와 ‘빛나다’의 감각을 함께 지니므로, 한국어에서는 중복을 줄이되 태양의 발광 이미지를 살려 ‘비치고’로 옮겼습니다.
- source_word: על כל נגלתה
  english_pob_choice: on everything revealed
  chosen_korean: 드러난 모든 것 위에
  alternatives_korean:
  - 모든 드러난 것 위에
  - 보이는 모든 것 위에
  - 나타난 모든 것 위에
  lexicon: HALOT
  rationale: נגלתה의 결과적·수동적 뉘앙스를 살려 ‘드러난’으로 옮겼고, 포괄 범위를 자연스럽게 드러내기 위해 ‘모든 것 위에’를 사용했습니다.
- source_word: כבוד ה'
  english_pob_choice: the glory of the Lord
  chosen_korean: 야훼의 영광
  alternatives_korean:
  - 주님의 영광
  - 주님의 영예
  lexicon: HALOT
  rationale: 히브리어 본문의 ה'는 본 프로젝트 기본값에 따라 야훼로 옮기고, כבוד는 하나님과 관련된 경우 ‘영광’이 가장 직접적이고 신학적으로도 무게가 있습니다.
- source_word: מעשיו
  english_pob_choice: his works
  chosen_korean: 그의 모든 일
  alternatives_korean:
  - 그의 모든 작품
  - 그의 모든 행위
  lexicon: HALOT
  rationale: מעשיו는 창조와 행위를 아우르는 넓은 표현이므로, 시적 병행을 살리면서도 현대 한국어에서 자연스러운 ‘그의 모든 일’로 옮겼습니다.
theological_decisions:
- issue: 야훼 이름 표기
  chosen_reading: 본문에서는 ‘야훼’로 직역했습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 히브리어 ה'를 가리키는 하나님의 이름 표기이므로, 프로젝트 기본값에 따라 ‘야훼’를 유지했습니다. 시락서의 헬라어 병행본문은 명시적 κύριος를 반복하지 않지만, 본문 신학상 신적 영광의 주체를 분명히 드러내는 것이 중요합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms table (YHWH → 야훼); Translation philosophy §2'
- issue: 서술적 병행의 보존
  chosen_reading: ‘비치고’와 ‘드러난 모든 것 위에’로 두 절의 시적 병행을 살렸습니다.
  alternative_readings:
  - ‘떠오르고 빛나며’
  - ‘비추며 모든 것을 살핀다’
  rationale: 히브리어와 헬라어 병행이 태양의 광휘와 포괄성을 함께 강조하므로, 한쪽 의미로만 평준화하지 않고 짧은 합쇼체 문장으로 긴장감을 유지했습니다.
  doctrine_reference: 'PHILOSOPHY.md: Original-language primacy and transparency principles'
