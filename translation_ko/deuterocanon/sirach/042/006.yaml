base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/042/006.yaml
  text: For a bad wife[a], a seal is good; and where hands are slack[c][b], open it.
  footnotes:
  - marker: a
    text: Hebrew literally reads something like 'slack/loose hands' where the Greek parallel has 'many hands.' The Greek-supported sense fits the proverb's warning about shared access and security.
    reason: textual_variant
  - marker: b
    text: The final Hebrew verb appears as 'open,' but the Greek parallel reads 'shut/lock.' The main text follows the clearer sense supported by the parallel source.
    reason: textual_variant
  - marker: c
    text: Or 'a bad woman' in both clauses using the broader sense of the Hebrew and Greek term for 'woman/wife.'
    reason: alternative_reading
translation:
  language: ko
  text: 악한 아내[a]에게는 봉인이 좋습니다. 그리고 손이 많은 곳[b]에서는 잠가야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어와 헬라어 모두 ‘여자/아내’가 가능하지만, 문맥상 ‘아내’가 더 자연스럽습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어의 표면형은 ‘느슨한 손’ 쪽으로도 읽히지만, 영어 POB가 반영한 헬라어 병행문은 ‘많은 손’입니다.
    reason: textual_variant
lexical_decisions:
- source_word: אשה רעה
  english_pob_choice: a bad wife
  chosen_korean: 악한 아내
  alternatives_korean:
  - 나쁜 여자
  - 악한 여자
  - 나쁜 아내
  lexicon: HALOT
  rationale: 아שה는 문맥상 아내로 읽는 것이 자연스럽고, רעה는 현대 한국어에서 ‘나쁜’보다 ‘악한’이 지혜문학의 윤리적 뉘앙스를 더 분명히 살립니다.
- source_word: חותם חסם
  english_pob_choice: a seal is good
  chosen_korean: 봉인이 좋습니다
  alternatives_korean:
  - 봉인하는 것이 좋습니다
  - 봉인이 적절합니다
  - 봉인하라
  lexicon: HALOT
  rationale: 히브리어는 매우 압축적이어서 영어 POB처럼 경구체 판단문으로 풀었고, ‘봉인’은 Greek parallel의 σφραγίς와 대응하는 기본 의미를 살렸습니다.
- source_word: ידים רפות
  english_pob_choice: many hands
  chosen_korean: 손이 많은 곳
  alternatives_korean:
  - 나태한 손
  - 느슨한 손
  - 약한 손
  lexicon: HALOT
  rationale: 히브리어 표면형은 ‘느슨한/힘없는 손’처럼 보이지만, POB가 채택한 Greek 병행의 ‘많은 손’이 더 일관된 속담의 뜻을 주므로 본문에서는 그 의미를 반영했습니다.
- source_word: תפתח
  english_pob_choice: lock it up
  chosen_korean: 잠가야 합니다
  alternatives_korean:
  - 열어야 합니다
  - 닫아야 합니다
  - 잠그십시오
  lexicon: HALOT
  rationale: 히브리어 자형은 문자적으로 ‘열다’처럼 보이지만 문맥과 Greek κλεῖσον에 따라 ‘잠그다/닫다’가 되어야 하므로, 한국어에서는 실용적이고 명령적인 뉘앙스를 살려 ‘잠가야 합니다’로 옮겼습니다.
theological_decisions:
- issue: 아내/여자 선택과 성별 일반화 방지
  chosen_reading: ‘아내’로 옮겨 가정적·소유 관리의 잠언적 문맥을 유지하고, 모든 여성을 일반화하는 표현으로 확대하지 않았습니다.
  alternative_readings:
  - 여자
  - 여인
  rationale: 히브리어 אשה와 헬라어 γυνή는 둘 다 ‘여자/아내’가 가능하지만, 문맥상 가정 관리와 재산 보호의 격언이므로 ‘아내’가 더 정확합니다. 원문의 거친 톤은 유지하되 현대 독자가 전체 여성에 대한 평가로 오해하지 않도록 했습니다.
  doctrine_reference: 'DOCTRINE.md: gender-accurate over gender-neutral; preserve source intent without importing claims not present in the text.'
