  text: For a bad wife[a], a seal is good; and where hands are slack[c][b], open it.
  footnotes:
  - marker: a
    text: Hebrew literally reads something like 'slack/loose hands' where the Greek parallel has 'many hands.' The Greek-supported sense fits the proverb's warning about shared access and security.
    reason: textual_variant
  - marker: b
    text: The final Hebrew verb appears as 'open,' but the Greek parallel reads 'shut/lock.' The main text follows the clearer sense supported by the parallel source.
    reason: textual_variant
  - marker: c
    text: Or 'a bad woman' in both clauses using the broader sense of the Hebrew and Greek term for 'woman/wife.'
    reason: alternative_reading
translation:
  language: ko
  text: 나쁜 아내[a]에게는 봉인이 좋습니다. 여러 사람의 손이 닿는 곳에서는 잠가 두어야 합니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어와 헬라어의 이 말은 ‘여자/여인’ 또는 ‘아내’로 옮길 수 있습니다. 여기서는 문맥에 따라 ‘아내’로 옮겼습니다.
    reason: alternative_reading
  - marker: b
    text: 현존 히브리어 본문은 ‘느슨한/힘없는 손’과 표면상 ‘열다’로 읽힙니다. 본문은 더 일관된 뜻을 보이는 헬라어 병행문, 곧 ‘많은 손’과 ‘잠그라’를 따릅니다.
    reason: textual_variant
lexical_decisions:
- source_word: אשה רעה
  english_pob_choice: a bad wife
  chosen_korean: 악한 아내
  alternatives_korean:
  - 나쁜 여자
  - 악한 여자
  - 나쁜 아내
  lexicon: HALOT
  rationale: 아שה는 문맥상 아내로 읽는 것이 자연스럽고, רעה는 현대 한국어에서 ‘나쁜’보다 ‘악한’이 지혜문학의 윤리적 뉘앙스를 더 분명히 살립니다.
- source_word: חותם חסם
  english_pob_choice: a seal is good
  chosen_korean: 봉인이 좋습니다
  alternatives_korean:
  - 봉인하는 것이 좋습니다
  - 봉인이 적절합니다
