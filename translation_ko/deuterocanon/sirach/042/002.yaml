  text: about the law of the Most High and the statute[b][a], and about a judgment that vindicates the wicked.
  footnotes:
  - marker: a
    text: Or 'a judgment to justify the wicked' or 'a judgment that declares the wicked righteous.' The Hebrew להצדיק and the Greek parallel δικαιῶσαι are forensic terms.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew witness is slightly terse here; the Greek parallel reads 'about the law of the Most High and the covenant, and about a judgment to justify the ungodly.' The Hebrew has 'statute' where the Greek has 'covenant.'
    reason: alternative_reading
translation:
  language: ko
  text: 지존자의 율법과 규례에 대하여, 그리고 악인을 의롭다 하게 하는 판결에 대하여 말하지 마십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘악인을 의롭다 하게 하는 판결’은 히브리어 להצדיק와 그리스어 δικαιῶσαι의 법정적 의미를 반영한 번역입니다. 다른 가능한 번역으로는 ‘악인을 의롭다 선언하는 판결’이 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 본문은 간결하게 ‘지존자의 율법과 규례’라고 하며, 그리스어 평행본은 여기에 ‘언약’을 덧붙입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: תורת עליון
  english_pob_choice: the law of the Most High
  chosen_korean: 지존자의 율법
  alternatives_korean:
  - 지존자의 가르침
  - 지존자의 법
  lexicon: HALOT
  rationale: תורה는 여기에서 חוק와 짝을 이루며 법적·규범적 의미가 강하므로, 한국어에서도 ‘율법’이 가장 자연스럽게 그 제도적 성격을 살립니다.
- source_word: חוק
  english_pob_choice: the statute
  chosen_korean: 규례
  alternatives_korean:
  - 법령
  - 규정
  - 법도
  lexicon: HALOT
  rationale: חוק은 고정된 규정이나 제정된 조항을 가리키므로, ‘규례’가 짧고 법률적 뉘앙스를 유지하면서 תורה와도 구별됩니다.
- source_word: מצדיק
  english_pob_choice: vindicates
  chosen_korean: 의롭다 하게 하는
  alternatives_korean:
  - 의롭다 인정하는
  - 정당하다고 판정하는
  - 의롭다 선언하는
  lexicon: HALOT
  rationale: 히필 צדק의 법정적 기능을 살리되, 한국어에서는 ‘의롭다 하다’가 가장 직접적으로 판결 행위를 드러냅니다.
- source_word: להצדיק רשע
  english_pob_choice: a judgment that vindicates the wicked
  chosen_korean: 악인을 의롭다 하게 하는 판결
  alternatives_korean:
  - 악인을 의롭다 선언하는 판결
  - 악인을 정당하다고 판정하는 판결
  lexicon: HALOT
  rationale: 열린 법정 문맥을 따라 ‘판결’로 처리하고, רשע는 중립화하지 않고 ‘악인’으로 옮겨 도덕적 긴장을 보존했습니다.
- source_word: ועל
  english_pob_choice: about
  chosen_korean: …에 대하여
  alternatives_korean:
  - …에 관하여
  - …을 두고
  lexicon: HALOT
  rationale: 반복되는 전치사는 목록을 이루는 항목 표지이므로, 현대 한국어에서 가장 무난한 ‘…에 대하여’를 사용했습니다.
theological_decisions:
- issue: מצדיק의 법정적 의미와 신학적 중량
  chosen_reading: ‘의롭다 하게 하는 판결’로 옮겨, 지혜문맥의 법정적 의미를 유지했습니다.
  alternative_readings:
  - ‘의롭게 하는’
  - ‘칭의하는’
  - ‘의롭다 선언하는’
  rationale: 이 구절은 바울서신식 교리 용어를 직접 전개하기보다, 부당한 판결의 문제를 경고하는 지혜문학적 진술입니다. 그래서 ‘칭의’ 같은 교회용어를 피하고, 원문의 법정적 긴장을 그대로 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md: theological tension should be preserved rather than prematurely harmonized.'
