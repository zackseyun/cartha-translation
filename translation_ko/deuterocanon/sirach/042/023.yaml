base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/042/023.yaml
  text: All these live and endure forever; in every need, all obey.[a][b]
  footnotes:
  - marker: a
    text: The Cairo Geniza Hebrew printed here reads a different line, roughly, 'And who can be satisfied to behold? The splendor of the height of the sky in purity.' Older evidence from Masada and the Greek tradition support the sense reflected in the main text; the Hebrew line appears to be displaced from nearby context.
    reason: textual_variant
  - marker: b
    text: Or 'for every purpose' / 'in all necessities' for 'in every need.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이 모든 것은 살아 있으며 영원히 지속되고, 모든 필요에 모든 것이 순종합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 카이로 게니자 히브리어 본문은 이 절과 다른 줄을 보이며, 대략 ‘누가 만족할 만큼 바라볼 수 있겠습니까? 하늘 높이의 광채, 그 순수함을’로 읽힙니다. 더 오래된 증거와 그리스어 전통은 본문에 반영한 의미를 지지하며, 히브리어 줄은 주변 문맥에서 전위된 것으로 보입니다.
    reason: textual_variant
  - marker: b
    text: 또는 ‘모든 목적을 위해’ / ‘모든 필요 가운데’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα ταῦτα / הכל
  english_pob_choice: All these
  chosen_korean: 이 모든 것은
  alternatives_korean:
  - 모든 것들은
  - 이것들은 모두
  lexicon: BDAG
  rationale: 지시적 뉘앙스를 살리기 위해 단순한 '모든 것'보다 '이 모든 것'을 택했습니다.
- source_word: ζῇ
  english_pob_choice: live
  chosen_korean: 살아 있으며
  alternatives_korean:
  - 삽니다
  - 살아 있습니다
  lexicon: BDAG
  rationale: 생명성을 자연스럽게 드러내면서도 뒤의 '영원히 지속되고'와 병렬이 되도록 했습니다.
- source_word: μένει εἰς τὸν αἰῶνα
  english_pob_choice: endure forever
  chosen_korean: 영원히 지속되고
  alternatives_korean:
  - 영원히 머물고
  - 영원히 남아 있고
  lexicon: BDAG
  rationale: 단순한 정적 존재보다 지속성을 강조하는 표현으로, 원문의 지속적 존속을 살렸습니다.
- source_word: ἐν πάσαις χρείαις
  english_pob_choice: in every need / for every purpose
  chosen_korean: 모든 필요에
  alternatives_korean:
  - 모든 용도에
  - 모든 필요 속에서
  lexicon: BDAG
  rationale: χρεία의 넓은 의미를 살리되 한국어에서는 '필요'가 가장 무난하게 필요/용도 양쪽을 포괄합니다.
- source_word: ὑπακούει
  english_pob_choice: obey
  chosen_korean: 순종합니다
  alternatives_korean:
  - 복종합니다
  - 응답합니다
  lexicon: BDAG
  rationale: 피조물이 질서에 응답하는 의미를 한국어 성경 문맥에서 가장 직접적으로 드러내는 말입니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행본문의 불일치
  chosen_reading: 그리스어 병행본문이 제시하는 흐름을 본문으로 채택하되, 각주로 히브리어의 이탈/전위 가능성을 밝혔습니다.
  alternative_readings:
  - 히브리어를 직역해 '누가 충분히 바라볼 수 있겠습니까? 하늘 높이의 광채, 그 순수함을'으로 옮김
  rationale: 이 절의 히브리어는 문맥상 이질적이고, 병행 그리스어는 완결된 의미를 제공하므로, 독자에게 본문 상태를 투명하게 알리는 방식이 가장 충실합니다.
  doctrine_reference: 'PHILOSOPHY.md: 원문에 충실하되 본문 전승의 불확실성은 숨기지 않습니다.'
