base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/042/017.yaml
  text: The holy ones of God have not been sufficient to recount the wonders of the Lord[b][a]. God has strengthened his hosts to be strong before his glory.
  footnotes:
  - marker: a
    text: Masada appears to read 'has not comprehended' where the Cairo Geniza text reads 'have not been able/sufficed'; the Greek supports the sense 'have not been able to recount fully.'
    reason: textual_variant
  - marker: b
    text: 'The second clause varies in the Hebrew witnesses: Cairo Geniza reads ''God has strengthened his hosts,'' while Masada appears to read ''the Lord has strengthened in his lights/luminaries''; the Greek reads ''what the Lord Almighty established, for the whole to be made firm in his glory.'''
    reason: textual_variant
translation:
  language: ko
  text: 하나님의 거룩한 이들은 주님의 놀라운 일들을 다 이야기해 내기에 충분하지 않았습니다. 하나님은 그의 군대를 굳게 하셔서, 그의 영광 앞에 굳게 서게 하셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 전승들 가운데 한 본문은 ‘이해하지 못했다’는 뜻을 보이며, 다른 전승은 ‘충분하지 않았다/할 수 없었다’는 뜻을 보입니다. 여기서는 히브리어 주본문과 그리스어 병행본문이 지지하는 ‘충분하지 않았다’의 뜻을 따랐습니다.
    reason: textual_variant
  - marker: b
    text: 둘째 절의 히브리어 전승은 ‘그의 군대’를, 다른 전승은 ‘그의 빛들/광명들’을, 그리스어는 ‘전능자 주님께서 확고하게 하신 것’을 가리킵니다. 본문은 주요 히브리어 전승을 따라 옮겼습니다.
    reason: textual_variant
lexical_decisions:
- source_word: קדושי אל
  english_pob_choice: the holy ones of God
  chosen_korean: 하나님의 거룩한 이들
  alternatives_korean:
  - 하나님의 성도들
  - 하나님의 거룩한 자들
  lexicon: HALOT
  rationale: קדושי אל은 신적 소속을 지닌 거룩한 존재들을 가리키므로, 교회론적 뉘앙스가 강한 ‘성도’보다 중립적인 ‘거룩한 이들’이 원문의 범위를 더 잘 보존합니다.
- source_word: לא הספיקו
  english_pob_choice: have not been able
  chosen_korean: 다 이야기해 내기에 충분하지 않았습니다
  alternatives_korean:
  - 이야기할 수 없었습니다
  - 다 말해 내기에 부족했습니다
  lexicon: HALOT
  rationale: 히브리어 הספיק의 충분/불충분 의미를 살려, 단순 능력 부재와 완전한 열거 불가능성을 함께 드러내는 표현으로 옮겼습니다.
- source_word: לספר נפלאות ה׳
  english_pob_choice: to recount the wonders of the Lord
  chosen_korean: 주님의 놀라운 일들을
  alternatives_korean:
  - 주님의 기이한 일들을
  - 주님의 경이로운 일들을
  lexicon: HALOT
  rationale: נפלאות는 ‘놀라운/기이한 일들’의 뜻이므로, 문맥에 맞는 고전적이면서도 현대적인 ‘놀라운 일들’로 옮겼습니다.
- source_word: צבאיו
  english_pob_choice: his hosts
  chosen_korean: 그의 군대
  alternatives_korean:
  - 그의 군대들
  - 그의 하늘 군대
  lexicon: HALOT
  rationale: צבא의 핵심 의미는 군대/군세이며, 여기서는 하나님이 세우신 존재들의 집합을 가리키므로 ‘군대’가 가장 직접적입니다. ‘hosts’의 포괄성은 본문 주해에서 유지되고, 한국어에서는 자연스러운 명사로 정리했습니다.
- source_word: להתחזק לפני כבודו
  english_pob_choice: to stand firm before his glory
  chosen_korean: 그의 영광 앞에 굳게 서게 하셨습니다
  alternatives_korean:
  - 그의 영광 앞에서 강하게 서게 하셨습니다
  - 그의 영광 앞에 서도록 견고하게 하셨습니다
  lexicon: HALOT
  rationale: 히브리어 התחזק는 ‘굳세어지다/굳게 서다’의 방향을 가지며, ‘영광 앞에’는 단순한 장소가 아니라 하나님의 현현 앞의 자세를 나타냅니다. 그래서 결과절로 풀어 ‘굳게 서게 하셨습니다’라고 옮겼습니다.
theological_decisions:
- issue: 첫 절과 둘째 절의 주어 표지(ה׳ / אלהים) 차이
  chosen_reading: 첫 절은 ‘주님’, 둘째 절은 ‘하나님’으로 구분해 번역했습니다.
  alternative_readings:
  - 두 절 모두 ‘주님’
  - 두 절 모두 ‘하나님’
  rationale: 히브리어 본문은 첫 절에 ה׳, 둘째 절에 אלהים을 두며, 영어 POB도 이 구분을 반영합니다. 한국어에서도 동일한 신명 구분을 유지해 본문 전승의 차이를 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md: divine names; preserve source distinctions'
