translation:
  language: ko
  text: 남자의 악함이 여자의 선함보다 낫고[a], 수치를 일으키는 여자는 비난거리가 됩니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 마지막 절은 난해합니다. 그리스어 평행본문은 더 직접적으로 “수치를 일으키는 여자는 비난거리가 된다”는 뜻을 보여 주므로, 본문은 그 의미를 반영했습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: מטוב רוע איש מטוב אשה
  english_pob_choice: Better a man's wickedness than a woman's goodness
  chosen_korean: 남자의 악함이 여자의 선함보다 낫고
  alternatives_korean:
  - 남자의 악이 여자의 선함보다 낫고
  - 남자의 악함이 여자의 선행보다 낫고
  lexicon: HALOT
  rationale: מן־טוב의 비교 구조를 한국어의 '...보다 낫고'로 자연스럽게 살렸고, רוע는 도덕적 악함이라는 뜻을 따라 '악함'으로 옮겼습니다. אשה의 대응어는 문맥상 일반적인 '여자'로 유지했습니다.
- source_word: מחרפת
  english_pob_choice: who brings shame
  chosen_korean: 수치스러운
  alternatives_korean:
  - 수치를 가져오는
  - 수치를 끼치는
  - 수치를 주는
  lexicon: HALOT
  rationale: 히브리어 분사형은 수치를 일으키는 여성을 성격적으로 묘사하므로, 한국어에서는 형용사적으로 압축한 '수치스러운'이 가장 자연스럽습니다.
- source_word: תביע
  english_pob_choice: becomes
  chosen_korean: 가져옵니다
  alternatives_korean:
  - 되게 합니다
  - 이르게 합니다
  - 낳습니다
  lexicon: HALOT
  rationale: 어려운 히브리어 동사를 과도하게 특정하지 않고, 결과를 나타내는 서술로 처리했습니다. 영어 POB가 결과적 의미를 취한 점과 평행본문의 'reproach'를 반영해 '수치를 가져옵니다'로 옮겼습니다.
- source_word: חרפת / ὀνειδισμόν
  english_pob_choice: a reproach
  chosen_korean: 수치
  alternatives_korean:
  - 모욕
  - 비난
  - 치욕
  lexicon: HALOT
  rationale: חרפה와 그리스어 ὀνειδισμός는 모두 공개적 수치와 책망을 뜻하므로, 한국어에서는 간결하게 '수치'로 처리했습니다.
theological_decisions:
- issue: 성별 대조를 유지할 것인가
  chosen_reading: 남자/여자라는 성별 대조를 그대로 유지했습니다.
  alternative_readings:
  - 사람의 악함이 여자의 선함보다 낫고
  - 한 사람의 악함이 한 여자의 선함보다 낫고
  rationale: 본문은 איש와 אשה를 직접 대조하므로, 성별을 중화하면 히브리어 수사와 직설성이 약해집니다. 본문의 불편함까지 포함해 투명하게 드러내는 것이 적절합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4 (Gender-accurate over gender-neutral)
- issue: 히브리어 난구와 그리스어 평행본문의 관계
  chosen_reading: 주본문은 히브리어를 따르되, 난해한 마지막 구는 결과적 의미로 자연스럽게 풀었습니다.
  alternative_readings:
  - 수치스러운 여자는 책망이 되느니라
  - 수치를 주는 여자는 비난을 받습니다
  rationale: 히브리어 최종절은 문법적으로 난해하므로, 그리스어 평행본문이 지시하는 '수치/수치심/비난'의 방향을 참고해 의미를 보존했습니다. 다만 주본문의 어휘 구조를 과도하게 재구성하지는 않았습니다.
  doctrine_reference: 'PHILOSOPHY.md: translate from Hebrew where it survives; use Greek parallel as actual translation input'
