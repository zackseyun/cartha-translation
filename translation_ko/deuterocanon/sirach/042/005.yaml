  naturalness: ‘…관해서입니다’는 독립된 절로는 부자연스럽고, 앞 문맥의 권면을 받아야 하는 열거형 구절에 맞지 않습니다. ‘…관해서도 그러합니다’는 문맥상 생략된 술어를 자연스럽게 보완하면서 합쇼체를 유지합니다.
  terminology: ‘가축’과 ‘많든 적든’은 적절합니다. תגר는 ‘상인’으로 명시하고, ממחיר ממכר는 ‘상인이 파는 물건의 가격’으로 옮기는 것이 자연스럽고 의미 손실이 없습니다.
