translation:
  language: ko
  text: 가축이 많든 적든, 또 상인이 파는 물건의 가격에 관해서도 그러합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 병행본문은 여기서 거래와 상인들에 관하여 더 폭넓게 말합니다. 히브리어 사본을 주본문으로 따르고, 그리스어는 상업적 의미를 확인하는 데 보조적으로 사용했습니다.
    reason: textual_variant
lexical_decisions:
- source_word: מקנה
  english_pob_choice: livestock
  chosen_korean: 가축
  alternatives_korean:
  - 가축 무리
  - 가축 떼
  - 가축과 재산
  lexicon: HALOT
  rationale: 문맥상 소유 재산 일반보다 가축을 가리키는 말로 이해하는 것이 자연스럽고, 한국어에서도 ‘가축’이 가장 간결하게 대응합니다.
- source_word: בין רב למעט
  english_pob_choice: whether much or little
  chosen_korean: 많든 적든
  alternatives_korean:
  - 많거나 적거나
  - 많고 적음을 불문하고
  - 크든 작든
  lexicon: HALOT
  rationale: 양의 대조를 압축적으로 나타내는 관용구이므로, 한국어에서는 대구를 살린 ‘많든 적든’이 가장 자연스럽습니다.
- source_word: ממחיר ממכר
  english_pob_choice: the price of merchandise for sale
  chosen_korean: 매매품의 가격
  alternatives_korean:
  - 판매물의 값
  - 팔 물건의 가격
  - 거래품의 가격
  lexicon: HALOT
  rationale: ‘판매’와 연관된 상업적 의미를 살리면서도 ‘가격’과의 결합이 자연스러운 표현으로 옮겼습니다.
- source_word: תגר
  english_pob_choice: merchant
  chosen_korean: 매매상
  alternatives_korean:
  - 상인
  - 장사꾼
  - 거래상
  lexicon: HALOT
  rationale: 히브리어의 상업적 인물을 가리키는 말로서, 본문의 거래 맥락을 드러내는 표현이 필요합니다. 다만 본문 전체는 물건의 종류보다 상거래 항목을 나열하는 방식이므로 ‘매매품’으로 처리해 중복을 줄였습니다.
