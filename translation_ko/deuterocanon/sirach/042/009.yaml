  naturalness: 현 초안의 마지막 두 절은 ‘…하여’로 끝나는 미완성 병렬구라 현대 한국어 문장으로 자연스럽지 않습니다. 앞 절의 잠을 빼앗는 염려를 이어 받아, 아버지가 염려하는 내용을 완결된 병렬문으로 표현하는 것이 합쇼체 문체와 문장 구조에 맞습니다.
