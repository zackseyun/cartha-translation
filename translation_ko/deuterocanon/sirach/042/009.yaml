base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/042/009.yaml
  text: 'A daughter is a hidden cause of deceit to her father[a], and anxiety over her drives away his sleep: in her youth, lest she remain unmarried, and in her virginity[b], lest she not be married.'
  footnotes:
  - marker: a
    text: Hebrew 'a hidden falsehood'; the Greek parallel reads 'hidden sleeplessness,' suggesting the line refers to concealed anxiety a daughter causes her father.
    reason: alternative_reading
  - marker: b
    text: The Hebrew behind 'lest she pass her prime' is uncertain in sense; the Greek parallel supports the idea of fading from youth or passing marriageable age.
    reason: textual_variant
translation:
  language: ko
  text: 딸은 아버지에게 숨은 거짓이며[a], 딸에 대한 염려는 그의 잠을 쫓아냅니다. 딸이 젊을 때에는 혹시 한창때를 지나칠까[b] 염려하고, 처녀일 때에는 혹시 시집가지 못할까 염려합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘숨은 거짓’에 가깝습니다. 그리스어 평행본문은 ‘숨은 불면’이라고 읽으며, 이 표현이 딸 때문에 아버지가 품는 감춰진 불안 또는 근심을 가리킬 가능성을 시사합니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어의 이 표현은 의미가 확실하지 않습니다. 그리스어 평행본문은 젊음이 쇠하거나 한창때가 지나는 뜻을 시사합니다.
    reason: textual_variant
lexical_decisions:
- source_word: בת לאב
  english_pob_choice: A daughter ... to her father
  chosen_korean: 딸은 아버지에게
  alternatives_korean:
  - 딸은 아버지의
  - 딸은 아버지를 위한
  lexicon: HALOT
  rationale: 히브리어의 관계표현을 한국어에서는 ‘아버지에게’로 자연스럽게 살려, 딸과 아버지의 직접적 관계를 간명하게 드러냈습니다.
- source_word: מטמנת שקר
  english_pob_choice: a hidden falsehood
  chosen_korean: 숨은 거짓
  alternatives_korean:
  - 숨은 허위
  - 감춰진 거짓
  - 숨은 속임수
  lexicon: HALOT
  rationale: 히브리어의 난해한 표현을 POB의 ‘hidden falsehood’에 맞춰 직역 쪽으로 유지했습니다. 해석을 지나치게 풀지 않고, 감춰진 불안/혼란이라는 함의를 남겼습니다.
- source_word: דאגה תפריע שנתו
  english_pob_choice: anxiety ... drives away his sleep
  chosen_korean: 그에 대한 염려는 그의 잠을 쫓아냅니다
  alternatives_korean:
  - 그에 대한 걱정은 그의 잠을 방해합니다
  - 그에 대한 근심은 그의 잠을 빼앗습니다
  lexicon: HALOT
  rationale: ‘דאגה’를 현대 한국어의 ‘염려’로 옮기고, 수면을 몰아낸다는 동작은 ‘쫓아냅니다’로 자연스럽게 표현했습니다.
- source_word: בנעוריה ... ובבתוליה
  english_pob_choice: in her youth ... and in her virginity
  chosen_korean: 그녀가 젊을 때는 ... 그리고 그녀가 처녀일 때는
  alternatives_korean:
  - 그녀의 젊은 시절에는 ... 그리고 그녀의 동정 때에는
  - 젊은 나이에는 ... 그리고 아직 처녀일 때는
  lexicon: HALOT
  rationale: 두 평행구를 한국어에서도 대칭적으로 살려, 연령과 성적 상태를 모두 유지했습니다.
- source_word: פן תגור
  english_pob_choice: lest she pass her prime
  chosen_korean: 혹시 때를 놓칠까 하여
  alternatives_korean:
  - 혹시 한창때를 지나칠까 하여
  - 혹시 제때를 놓칠까 하여
  - 혹시 쇠할까 하여
  lexicon: HALOT
  rationale: 히브리어의 의미가 불확실하므로, POB의 주해를 반영해 ‘시집갈 때/혼인 적기’를 암시하는 방향으로 너무 단정하지 않게 옮겼습니다.
- source_word: פן לא תנשא
  english_pob_choice: lest she not be married
  chosen_korean: 혹시 시집가지 못할까 하여
  alternatives_korean:
  - 혹시 결혼하지 못할까 하여
  - 혹시 혼인하지 못할까 하여
  lexicon: HALOT
  rationale: 수동적 혼인 표현을 현대 한국어에서 자연스럽게 ‘시집가지 못하다’로 옮겨, 사회적 혼인 기대를 그대로 반영했습니다.
theological_decisions:
- issue: 난해한 히브리어 מטמנת שקר를 어떻게 처리할지
  chosen_reading: 주본문은 ‘숨은 거짓’으로 두어 히브리어의 거친 표현을 보존하고, 주해 없이 매끈하게 풀지 않았습니다.
  alternative_readings:
  - 숨은 불안
  - 숨은 근심
  - 숨은 속임수
  rationale: 본 구절은 히브리어 자체가 난해하므로, 평이하게 의미를 정리하기보다 본문이 지닌 긴장과 불확실성을 드러내는 편이 원문에 더 충실합니다.
  doctrine_reference: 'PHILOSOPHY.md: 의미를 과도하게 해소하지 말고, 남아 있는 원문 증거의 난해함을 보존한다.'
- issue: 젊음/처녀성/혼인 가능성을 둘러싼 사회적 경고의 어조
  chosen_reading: 직설적 훈계 어조를 유지하고, 완곡하게 윤색하지 않았습니다.
  alternative_readings:
  - 더 중립적인 가족 조언으로 완화
  - 현대적 자기결정 언어로 재구성
  rationale: 집안의 명예와 혼인 가능성을 염려하는 고대 지혜문학의 어조를 그대로 드러내는 것이 본문의 역사적 의미를 보존합니다.
  doctrine_reference: 집안-혼인-명예를 다루는 지혜문학의 사회적 맥락
