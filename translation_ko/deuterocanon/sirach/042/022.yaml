- source_word: חלף טובו
  english_pob_choice: his goodness passes
  chosen_korean: 그의 선하심은 … 지나갑니다
  alternatives_korean:
  - 그의 선하심은 … 흐릅니다
  - 그의 선하심은 … 옮겨 갑니다
  lexicon: HALOT
  rationale: 동사의 이동 이미지를 살리면서, טוב를 ‘선하심’으로 옮겨 하나님의 선한 작용을 직접적으로 드러냈습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 평행문의 관계
  chosen_reading: 본문으로는 현존하는 히브리어를 따르되, 그리스어의 더 긴 평행문은 본문에 흡수하지 않았습니다.
  alternative_readings:
  - 그리스어의 ‘아무것도 더해지거나 줄어들지 않았다’는 내용을 본문에 반영하기
  - 그리스어 본문을 이 절의 번역문으로 채택하기
  rationale: 시락서는 히브리어가 남아 있는 곳에서는 히브리어를 우선하는 것이 원칙이므로, 평행문의 증거는 해석 보조로만 두었습니다.
  doctrine_reference: 'PHILOSOPHY.md: translate Sirach from Hebrew where it survives; use Greek parallel as actual input without displacing Hebrew primacy.'
