base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/042/022.yaml
  text: He lives and stands forever[b][a]; his goodness passes from one thing to another.
  footnotes:
  - marker: a
    text: 'The Hebrew wording is terse and somewhat uncertain here. The Greek parallel preserves a different, fuller text: ''Neither was anything added nor diminished, and he had no need of any counselor. How desirable are all his works, and like a spark they are to behold.'''
    reason: textual_variant
  - marker: b
    text: Or 'his goodness passes over each thing' / 'his goodness goes from one to another.' The Hebrew phrase is compressed, and the exact force of 'this upon this' is uncertain.
    reason: lexical_alternative
translation:
  language: ko
  text: 그분은 살아 계시며 영원히 서 계십니다. 그의 선하심은 이 일에서 저 일로 지나갑니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 여기서 매우 압축적이어서, ‘이 일에서 저 일로’의 정확한 관계는 다소 불확실합니다.
    reason: lexical_alternative
  - marker: b
    text: '그리스어 평행문은 다른 더 긴 형태를 보존합니다: ‘아무것도 더해지지 않았고 줄어들지도 않았으며, 그분은 어떤 조언자도 필요로 하지 않으셨습니다. 그분의 모든 일은 얼마나 바람직한지, 또한 그것들은 불꽃처럼 보기에 아름답습니다.’'
    reason: textual_variant
