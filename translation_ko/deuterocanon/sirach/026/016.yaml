  text: Grace upon grace is a modest woman[a], and no scale is worthy of a self-controlled soul.
  footnotes:
  - marker: a
    text: Or 'grace upon grace is a shamefaced woman'; the Greek wording is compressed, and αἰσχυντηρά can be rendered more literally as 'shamefaced' or 'bashful.'
    reason: lexical_alternative
translation:
  language: ko
  text: 품위가 품위 위에 더해진 여인은 수치스러워하는 여자이고, 절제하는 영혼의 가치는 아무 저울도 감당할 수 없습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘수치스러워하는 여자’; 그리스어 표현은 압축되어 있으며, αἰσχυντηρά는 더 문자적으로 ‘수치스러운’ 또는 ‘수줍은’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρις ἐπὶ χάριτι
  english_pob_choice: Charm upon charm
  chosen_korean: 품위가 품위 위에 더해진
  alternatives_korean:
  - 은총 위에 은총이 더해진
  - 아름다움 위에 아름다움이 더해진
  - 매력 위에 매력이 더해진
  lexicon: LSJ
  rationale: 이 구절의 χάρις는 신학적 ‘은혜’보다 지혜문학적 ‘품위/매력’의 뜻이 자연스럽고, 반복 구조도 ‘품위가 품위 위에 더해진’으로 압축해 중첩 강조를 살렸습니다.
- source_word: γυνὴ αἰσχυντηρά
  english_pob_choice: a modest woman
  chosen_korean: 수치스러워하는 여자
  alternatives_korean:
  - 수줍은 여자
  - 단정한 여자
  - 겸손한 여자
  lexicon: LSJ
  rationale: αἰσχυντηρά는 단순한 성격 묘사보다 ‘수치/부끄러움’을 의식하며 절도 있게 처신하는 태도를 가리키므로, 현대 한국어에서 그 긴장을 가장 직접적으로 드러내는 표현을 택했습니다.
- source_word: σταθμός
  english_pob_choice: scale
  chosen_korean: 저울
  alternatives_korean:
  - 천칭
  - 기준
  - 도량
  lexicon: LSJ
  rationale: σταθμός는 무게를 재는 도구/기준을 뜻하므로, 문맥상 추상적 ‘기준’보다 비유를 살리는 ‘저울’이 적절합니다.
- source_word: πᾶς ἄξιος ἐγκρατοῦς ψυχῆς
  english_pob_choice: worthy of a self-controlled soul
  chosen_korean: 절제하는 영혼의 가치는 아무 저울도 감당할 수 없습니다
  alternatives_korean:
  - 절제하는 영혼을 재기에 합당한 저울은 없습니다
  - 절제하는 영혼에 합당한 저울은 없습니다
  - 절제하는 영혼의 가치를 잴 저울은 없습니다
  lexicon: LSJ
  rationale: 그리스어는 ‘그 영혼에 합당한 저울이 없다’는 압축 표현이므로, 한국어에서는 측정 불가능한 가치를 드러내기 위해 ‘감당할 수 없습니다’로 풀어 자연스럽게 옮겼습니다.
theological_decisions:
- issue: αἰσχυντηρά의 덕목성
  chosen_reading: ‘수치스러워하는’으로 옮겨, 부끄러움을 아는 절제와 단정함의 덕을 긍정적으로 드러냈습니다.
  alternative_readings:
  - 수줍은
  - 단정한
  - 겸손한
  rationale: 이 형용사는 모욕이나 비난이 아니라 지혜문학적 미덕을 가리키므로, 과도하게 미화하지 않으면서도 수치/부끄러움의 윤리적 긴장을 보존해야 합니다.
  doctrine_reference: Translation philosophy §6 (readable modern Korean, not archaic or euphemistic)
- issue: 가치 비유의 재구성
  chosen_reading: ‘아무 저울도 감당할 수 없습니다’로 옮겨, 본문의 측정 불가능한 가치를 현대 한국어로 살렸습니다.
  alternative_readings:
  - 아무 저울도 합당하지 않습니다
  - 아무 저울도 그 값을 잴 수 없습니다
  - 아무 저울도 그에 맞지 않습니다
  rationale: 원문은 저울의 적합성/합당성을 말하지만, 한국어에서는 ‘감당하다’가 가치의 과잉과 비견 불가함을 더 강하게 전달합니다.
  doctrine_reference: Translation philosophy §1 and §6
