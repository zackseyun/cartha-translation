  text: Grace upon grace is a modest woman[a], and no scale is worthy of a self-controlled soul.
  footnotes:
  - marker: a
    text: Or 'grace upon grace is a shamefaced woman'; the Greek wording is compressed, and αἰσχυντηρά can be rendered more literally as 'shamefaced' or 'bashful.'
