  source_fidelity: 첫 이미지인 στύλοι χρύσεοι ἐπὶ βάσεως ἀργυρᾶς는 대체로 충실합니다. 그러나 εὐσταθοῦς는 ‘든든히 서다’라는 동작을 직접 나타내는 말이 아니라 ‘굳건한/안정된’이라는 형용사이며, 원문상 성별도 명시되지 않습니다. ‘든든히 선 사람’은 원문의 형용사를 과도하게 동작으로 풀고, 문맥상 가능한 여성적 함의를 일반적인 ‘사람’으로 확정합니다.
  naturalness: ‘금으로 된 기둥들은 은으로 된 받침 위에 있고’는 자연스럽습니다. 뒤의 몸 이미지가 의도적으로 압축되고 낯설므로, 한국어에서도 이를 지나치게 해설하지 않고 ‘굳건한 이의 가슴 위에 있는 아름다운 발’로 옮기는 편이 시적 압축을 보존하면서도 문장 구조는 분명합니다.
  terminology: ‘기둥’, ‘은으로 된 받침’, ‘아름다운 발’은 적절합니다. εὐσταθοῦς는 ‘굳건한 이’로 옮겨 형용사적 의미와 원문의 성별 비특정을 유지합니다. στέρνοις의 복수는 한국어의 집합적 신체 명사 ‘가슴’으로 자연스럽게 처리할 수 있습니다.
