    text: 헬라어는 매우 압축된 표현입니다. 직역하면 ‘굳건한 이의 가슴들 위에 있는 아름다운 발’에 가깝습니다. εὐσταθοῦς는 ‘굳건한, 안정된’이라는 뜻이며, 이 형태만으로는 성별이 명시되지 않습니다.
