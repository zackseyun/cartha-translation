  yaml_path: translation/deuterocanon/sirach/026/022.yaml
  text: One who turns back from righteousness to sin—the Lord will prepare him for the sword[a].
  footnotes:
  - marker: a
    text: Or 'One who brings himself back from righteousness to sin.' The Greek participle can more literally suggest being brought or led back, but here it denotes reverting from a righteous path.
    reason: lexical_alternative
translation:
  language: ko
  text: 의로움에서 죄로 되돌아가는 사람은—주께서 그를 칼을 맞도록 준비하실 것입니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘의로움에서 죄로 (누군가를) 되돌아가게 하는 사람.’ 그리스어 능동 분사 ἐπανάγων은 문자적으로 ‘되돌아가게 하다/다시 이끌다’라는 뜻도 낼 수 있습니다. 그러나 여기서는 의로운 길을 떠나 죄로 돌아가는 사람을 가리키는 것으로 이해됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπανάγων
  english_pob_choice: turns back
  chosen_korean: 되돌아가는
  alternatives_korean:
  - 돌이키는
  - 다시 끌려가는
  - 되돌려지는
  lexicon: LSJ
  rationale: 문맥이 '의로움에서 죄로'라는 도덕적 방향 전환이므로, 단순한 이동보다 삶의 경로를 되돌아가는 의미를 살려 '되돌아가는'으로 옮겼습니다.
- source_word: ἀπὸ δικαιοσύνης ἐπὶ ἁμαρτίαν
  english_pob_choice: from righteousness to sin
  chosen_korean: 의로움에서 죄로
  alternatives_korean:
  - 의에서 죄로
  - 의로움에서 악으로
  lexicon: LSJ
  rationale: δικαιοσύνη와 ἁμαρτία의 대조를 직접 드러내기 위해 '의로움'과 '죄'를 사용했습니다. '의'도 가능하지만 문장 흐름상 '의로움'이 더 자연스럽습니다.
- source_word: ὁ κύριος
  english_pob_choice: the Lord
  chosen_korean: 주께서
  alternatives_korean:
  - 주님께서
  - 주가
  lexicon: LSJ
  rationale: 지혜문헌의 하나님의 주권적 행위를 가리키므로 '주'를 유지하고, 한국어 서술문에서는 주격 조사와 함께 '주께서'가 가장 자연스럽습니다.
- source_word: εἰς ῥομφαίαν
  english_pob_choice: for the sword
  chosen_korean: 칼에 넘기실
  alternatives_korean:
  - 칼을 위해 준비하실
  - 칼을 향해 마련하실
  - 칼로 넘기실
  lexicon: LSJ
  rationale: ῥομφαία는 단순한 무기 명칭을 넘어 심판의 도구를 가리키므로, 한국어에서는 결과를 드러내는 동작으로 풀어 '칼에 넘기실'을 택해 심판의 뉘앙스를 살렸습니다.
theological_decisions:
- issue: 주께서 행하시는 심판의 직접성
  chosen_reading: 본문은 의에서 죄로 되돌아간 사람에 대한 주의 직접적 심판을 말합니다.
  alternative_readings:
  - 일반적인 도덕적 결과만을 말하는 것으로 완화하는 읽기
  rationale: 주어가 분명히 ὁ κύριος이고 미래형 ἑτοιμάσει가 사용되므로, 직접적 행위성을 약화하지 않고 그대로 유지했습니다.
  doctrine_reference: 본문의 심판 진술을 약화하지 말고 있는 그대로 보존
