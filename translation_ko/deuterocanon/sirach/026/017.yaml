  source_fidelity: 수정이 필요합니다. 현행 ‘그의 집의 질서 있는 아름다움’은 κόσμῳ의 ‘장식/단장’ 또는 ‘질서 있는 정돈’이라는 의미를 ‘아름다움’과 중복시키며, ‘ἐν κόσμῳ οἰκίας αὐτοῦ’의 집과 관련된 단장이라는 관계도 다소 불분명하게 만듭니다. αὐτοῦ의 남성 단수는 ‘그의 집’으로 유지하는 것이 적절합니다.
