  text: Like the sun rising in the heights of the Lord[b][a], so is the beauty of a good wife in the adornment of his house.
  footnotes:
  - marker: a
    text: Or 'in the adornment of his house.' The Greek word can refer both to orderly arrangement and to adornment.
    reason: lexical_alternative
  - marker: b
    text: Some translators render 'good woman' instead of 'good wife,' but the household context favors 'wife' here.
    reason: lexical_alternative
translation:
  language: ko
  text: 주님의 높은 곳에 떠오르는 해와 같으니, 좋은 아내[b]의 아름다움은 그의 집의 단장[a]과 같습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 집의 질서’ 또는 ‘그의 집의 정돈.’ 그리스어 κόσμος는 질서 있는 배열과 장식을 모두 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘좋은 여자.’ 그리스어 γυνή는 ‘여자’ 또는 ‘아내’를 뜻할 수 있으나, 이 구절의 가정 문맥에서는 ‘아내’가 더 적절합니다.
    reason: lexical_alternative
