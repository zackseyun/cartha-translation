  text: A woman's sexual immorality is known by the lifting of her eyes[b][a], and by her eyelids.
  footnotes:
  - marker: a
    text: Or 'by the restlessness / haughtiness / wandering of her eyes.' The Greek expression is difficult and may refer to an uplifted, roving, or suggestive look.
    reason: lexical_alternative
  - marker: b
    text: Literally 'in her eyelids'; the phrase likely refers to what is revealed by her eye expression or glance.
    reason: lexical_alternative
translation:
  language: ko
  text: 한 여자의 음행은 눈을 치켜뜬 모습에서, 또 눈꺼풀에서 드러납니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그녀의 눈의 치켜뜸들/들뜸들/방황함들’입니다. 그리스어 표현은 어려우며, 눈을 높이 뜨는 모습, 이리저리 움직이는 시선, 또는 유혹적인 눈길을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그녀의 눈꺼풀들 안에서’입니다. 이 표현은 아마도 눈의 표정이나 시선에서 드러나는 것을 가리킵니다.
    reason: lexical_alternative
