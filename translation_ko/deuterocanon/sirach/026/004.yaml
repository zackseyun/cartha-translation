  text: Whether rich or poor[a], a good heart has a cheerful face at all times.
  footnotes:
  - marker: a
    text: Or, more literally, 'the heart of rich and poor is good; the face is cheerful at every time.' The Greek is compressed, and the English supplies 'keeps' to make the relation between inner disposition and outward expression clear.
    reason: lexical_alternative
translation:
  language: ko
  text: 부자와 가난한 사람 모두의 마음은 선하며, 언제나 얼굴은 밝습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 헬라어는 압축된 병렬 구조로, 문자적으로는 ‘부자와 가난한 사람의 마음은 선하고, 얼굴은 언제나 밝다’에 가깝습니다. 한국어에서는 관계를 분명히 하기 위해 자연스럽게 풀어 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: πλουσίου δὲ καὶ πτωχοῦ
  english_pob_choice: Whether rich or poor
  chosen_korean: 부자와 가난한 사람 모두
  alternatives_korean:
  - 부자든 가난한 사람이든
  - 부자와 빈자
  lexicon: LSJ
  rationale: 그리스어는 부자와 가난한 사람을 대조적으로 묶어 일반적인 범주를 말하므로, 한국어에서도 사회경제적 대비를 자연스럽게 살렸습니다.
- source_word: καρδία ἀγαθή
  english_pob_choice: a good heart
  chosen_korean: 마음은 선하며
  alternatives_korean:
  - 좋은 마음을 가집니다
  - 좋은 마음이
  lexicon: LSJ
  rationale: καρδία는 문자적으로 ‘마음’이며, ἀγαθή는 도덕적·정서적으로 ‘선한’ 상태를 가리키므로 ‘마음은 선하다’로 옮겨 내부 성품을 드러냈습니다.
- source_word: πρόσωπον ἱλαρόν
  english_pob_choice: a cheerful face
  chosen_korean: 얼굴은 밝습니다
  alternatives_korean:
  - 얼굴은 쾌활합니다
  - 얼굴은 환합니다
  lexicon: LSJ
  rationale: πρόσωπον은 ‘얼굴’이고 ἱλαρόν은 밝고 기쁜 표정을 뜻하므로, 현대 한국어에서 자연스럽고 이미지가 살아 있는 ‘밝다’를 택했습니다.
- source_word: ἐν παντὶ καιρῷ
  english_pob_choice: at all times
  chosen_korean: 언제나
  alternatives_korean:
  - 항상
  - 모든 때에
  lexicon: LSJ
  rationale: 시간을 가리키는 관용구로서 지속성을 강조하므로, 한국어의 자연스러운 부사 ‘언제나’로 압축해 표현했습니다.
theological_decisions:
- issue: 병렬 구조의 압축 표현
  chosen_reading: 내면의 선함과 외면의 밝은 표정이 일반적으로 연결된다는 지혜 문장의 진술로 옮겼습니다.
  alternative_readings:
  - ‘마음이 좋으면 얼굴도 밝다’처럼 인과를 더 분명히 드러내는 읽기
  - 두 절을 독립 명제처럼 옮기는 읽기
  rationale: 헬라어는 동사 없이 압축되어 있어, 한국어에서는 의미를 해치지 않는 범위에서 관계를 자연스럽게 풀어 주는 것이 본문의 지혜 문장 성격에 가장 적합합니다.
  doctrine_reference: 지혜문학의 관찰적 진술
