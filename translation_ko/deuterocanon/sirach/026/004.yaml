- source_word: καρδία ἀγαθή
  english_pob_choice: a good heart
  chosen_korean: 마음은 선하며
  alternatives_korean:
  - 좋은 마음을 가집니다
  - 좋은 마음이
  lexicon: LSJ
  rationale: καρδία는 문자적으로 ‘마음’이며, ἀγαθή는 도덕적·정서적으로 ‘선한’ 상태를 가리키므로 ‘마음은 선하다’로 옮겨 내부 성품을 드러냈습니다.
- source_word: πρόσωπον ἱλαρόν
  english_pob_choice: a cheerful face
  chosen_korean: 얼굴은 밝습니다
  alternatives_korean:
  - 얼굴은 쾌활합니다
  - 얼굴은 환합니다
  lexicon: LSJ
  rationale: πρόσωπον은 ‘얼굴’이고 ἱλαρόν은 밝고 기쁜 표정을 뜻하므로, 현대 한국어에서 자연스럽고 이미지가 살아 있는 ‘밝다’를 택했습니다.
- source_word: ἐν παντὶ καιρῷ
  english_pob_choice: at all times
  chosen_korean: 언제나
  alternatives_korean:
  - 항상
  - 모든 때에
  lexicon: LSJ
  rationale: 시간을 가리키는 관용구로서 지속성을 강조하므로, 한국어의 자연스러운 부사 ‘언제나’로 압축해 표현했습니다.
