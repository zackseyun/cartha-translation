  yaml_path: translation/deuterocanon/sirach/026/013.yaml
  text: Like a thirsty traveler she opens her mouth[a], and from every nearby water she will drink; opposite every stake she will sit down[c][b], and before every arrow she will open her quiver.
  footnotes:
  - marker: a
    text: 'The imagery is metaphorical and likely refers to sexual indiscrimination: she takes whatever opportunity is near at hand.'
    reason: cultural_note
  - marker: b
    text: Greek 'stake' and 'arrow ... quiver' are retained literally. The exact force of the final image is debated, but it continues the verse’s sexual metaphor.
    reason: lexical_alternative
  - marker: c
    text: The Greek text of this verse is vivid but somewhat difficult, especially in the final clause; the translation stays close to the wording rather than resolving the metaphor more explicitly.
    reason: textual_variant
translation:
  language: ko
  text: 목마른 나그네가 입을 벌려 가까이에 있는 모든 물을 마시듯이[a], 그녀는 모든 말뚝 맞은편에 앉고 모든 화살 앞에서 화살집을 열 것입니다[c][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 이미지는 은유적으로, 가까이에 있는 기회를 무엇이든 받아들이는 성적 무분별을 암시합니다.
    reason: cultural_note
  - marker: b
    text: 그리스어의 ‘말뚝’과 ‘화살…화살집’은 문자적으로 유지했습니다. 마지막 이미지의 정확한 힘은 논쟁적이지만, 본절의 성적 은유를 이어 갑니다.
    reason: lexical_alternative
  - marker: c
    text: 이 절의 그리스어는 생생하지만 다소 난해하며, 특히 마지막 절구는 해석이 갈립니다. 번역은 해석을 과도하게 확정하지 않고 표현에 가깝게 유지합니다.
    reason: textual_variant
lexical_decisions:
- source_word: διψῶν ὁδοιπόρος
  english_pob_choice: thirsty traveler
  chosen_korean: 목마른 나그네
  alternatives_korean:
  - 목마른 여행자
  - 목마른 길손
  lexicon: LSJ
  rationale: ὁδοιπόρος는 길 위의 사람을 가리키므로, 현대적이면서도 비유적 뉘앙스를 살리는 ‘나그네’가 적절합니다. ‘목마른’은 수식어의 긴급함을 자연스럽게 전달합니다.
- source_word: ἀνοίγει τὸ στόμα
  english_pob_choice: opens her mouth
  chosen_korean: 입을 벌리고
  alternatives_korean:
  - 입을 엽니다
  - 입을 크게 벌리고
  lexicon: LSJ
  rationale: στόμα는 문자적으로 ‘입’이며, 문맥상 노골적 해석보다 동작 자체를 간결하게 살리는 것이 원문에 가깝습니다. 한국어에서는 ‘입을 벌리다’가 가장 자연스럽습니다.
- source_word: κατέναντι παντὸς πασσάλου / ἔναντι βέλους ... φαρέτραν
  english_pob_choice: opposite every stake ... before every arrow ... quiver
  chosen_korean: 모든 말뚝 맞은편에 앉고 ... 모든 화살 앞에서 화살집을 열 것입니다
  alternatives_korean:
  - 모든 말뚝 앞에 앉고 ... 모든 화살 앞에서 화살통을 열 것입니다
  - 모든 말뚝 맞은편에 앉고 ... 모든 화살 앞에서 화살주머니를 열 것입니다
  lexicon: LSJ
  rationale: πάσσαλος는 기본적으로 ‘말뚝’이며, φαρέτρα는 ‘화살집’이 가장 직접적입니다. 마지막 동작은 문자적으로 유지하되, 한국어에서 ‘열다’가 화살집의 덮개를 여는 장면을 자연스럽게 전달합니다.
theological_decisions:
- issue: 구체적 이미지의 성적 은유 유지
  chosen_reading: 말뚝, 화살, 화살집 같은 구체적 이미지를 그대로 살리고, 노골적인 풀이로 바꾸지 않았습니다.
  alternative_readings:
  - 그녀의 성적 방종을 직접적으로 풀어 쓰기
  - 은유를 완화해 도덕적 경고로만 번역하기
  rationale: 본절은 지혜문학의 충격적인 비유를 통해 의미를 드러내므로, 원문의 감각적 이미지를 보존해야 독자가 본문이 의도한 긴장을 읽을 수 있습니다.
  doctrine_reference: Translation philosophy §§1, 6
- issue: 생략된 여성 주어 보충
  chosen_reading: 문맥상 여성을 가리키므로 한국어에서 ‘그녀는’으로 주어를 드러냈습니다.
  alternative_readings:
  - 주어를 생략하기
  - ‘사람은’처럼 일반화하기
  rationale: 한국어에서는 반복되는 분사 구조가 불명확해질 수 있어, 문맥에 따라 명시된 여성 주어를 넣는 것이 가독성과 의미 전달에 유익합니다.
  doctrine_reference: Translation philosophy §6
