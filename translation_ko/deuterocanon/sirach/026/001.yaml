translation:
  language: ko
  text: 좋은 아내를 둔 남편은 복되며, 그의 날수도 갑절이 됩니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘행복하다’, ‘복되다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִשָּׁה טוֹבָה
  english_pob_choice: a good wife
  chosen_korean: 좋은 아내
  alternatives_korean:
  - 선한 아내
  - 덕스러운 아내
  lexicon: HALOT
  rationale: 히브리어의 기본 의미를 살려 ‘좋은’으로 옮기고, 관계적 의미는 문맥상 ‘아내’로 분명히 했습니다. ‘덕스러운’은 해석이 더 많이 들어가므로 피했습니다.
- source_word: אַשְׁרֵי
  english_pob_choice: Happy is
  chosen_korean: 복되며
  alternatives_korean:
  - 행복하며
  - 행운이 있으며
  lexicon: HALOT
  rationale: 지혜문학의 아쉬레י는 단순 감정의 ‘행복’보다 복 있는 상태의 선언에 가깝기 때문에, 한국어에서는 간결한 형용사적 술어인 ‘복되며’로 처리했습니다.
- source_word: בַעֲלָהּ
  english_pob_choice: the husband of
  chosen_korean: 남편은
  alternatives_korean:
  - 그의 남편은
  - 아내의 남편은
  lexicon: HALOT
  rationale: 히브리어의 소유·관계 표현을 한국어 자연문으로 재구성해 ‘남편은’으로 옮겼습니다. ‘주인’의 뉘앙스는 현대 한국어에서 오해를 불러올 수 있어 피했습니다.
- source_word: כִּפְלַיִם
  english_pob_choice: is doubled
  chosen_korean: 갑절이 됩니다
  alternatives_korean:
  - 두 배가 됩니다
  - 두 배입니다
  lexicon: HALOT
  rationale: 히브리어의 ‘두 배, 갑절’을 한국어 관용으로 살렸습니다. ‘갑절’은 고전적이지만 표준어이며, 본문의 지혜문학적 압축성을 잘 보존합니다.
theological_decisions:
- issue: אַשְׁרֵי / μακάριος의 축복 선언 강도
  chosen_reading: 복되며
  alternative_readings:
  - 행복하며
  - 복이 있습니다
  rationale: 이 절은 직접적인 신적 축복 선포라기보다 지혜문학적 찬탄이므로, 교리적 과잉을 피하면서도 축복의 뉘앙스를 살리는 ‘복되며’를 택했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 6
