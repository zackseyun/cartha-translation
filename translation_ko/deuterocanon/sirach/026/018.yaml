  - 성소의 등잔대 위에서
  - 거룩한 등대 위에서
  lexicon: LSJ
  rationale: ἐπὶ + 여격/속격 구문은 위치를 나타내므로 ‘위에서’로 처리했고, ἁγίας는 예배적·구별된 뉘앙스를 살려 ‘성스러운’으로 옮겼습니다.
- source_word: ἐπὶ ἡλικίᾳ στασίμῃ
  english_pob_choice: at a steadfast age
  chosen_korean: 굳건한 나이에 이른
  alternatives_korean:
  - 정착된 성숙에 이른
