  chosen_reading: 두 절반을 ‘등불’과 ‘얼굴의 아름다움’으로 나란히 배치하여, 밝음과 성숙의 비유적 병행을 살렸습니다.
  alternative_readings:
  - 의미를 풀어 ‘성숙한 사람의 아름다움’으로 의역
  - 두 이미지를 합쳐 설명적 문장으로 재구성
  rationale: 본문은 수사적 병렬이 핵심이므로, 해석을 과도하게 풀기보다 이미지 자체를 유지하는 편이 독자에게 원문의 힘을 더 잘 전달합니다.
