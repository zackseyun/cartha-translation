translation:
  language: ko
  text: 성스러운 등잔대 위에서 빛나고 있는 등불이며, 굳건한 나이에 이른 얼굴의 아름다움입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘안정된 성숙에서’. 그리스어 ἐπὶ ἡλικίᾳ στασίμῃ는 관용적으로 ‘나이’와 ‘안정됨/굳건함’의 뜻을 함께 담습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: λύχνος
  english_pob_choice: lamp
  chosen_korean: 등불
  alternatives_korean:
