  - 정숙한 나이에 이른
  lexicon: LSJ
  rationale: ἡλικία는 나이/삶의 단계이며, στασίμῃ는 ‘서 있는, 안정된, 굳은’ 뜻을 가지므로 ‘굳건한’으로 옮겨 settledness를 드러냈습니다.
theological_decisions:
