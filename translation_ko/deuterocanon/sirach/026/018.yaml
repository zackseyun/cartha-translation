  text: 성스러운 등잔대 위에 환히 빛나는 등불, 굳건하고 반듯한 자태 위의 얼굴의 아름다움입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘안정된 성숙기의 얼굴 아름다움’. 그리스어 ἐπὶ ἡλικίᾳ στασίμῃ에서 ἡλικία는 ‘나이’ 또는 ‘성숙한 자태’를, στασίμῃ는 ‘굳건한, 안정된’을 뜻할 수 있습니다.
