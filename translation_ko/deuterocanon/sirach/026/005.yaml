    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ τριῶν
  english_pob_choice: From three things
  chosen_korean: 세 가지 일로
  alternatives_korean:
  - 세 가지로부터
  - 세 가지 때문에
  - 세 가지 일에서
  lexicon: LSJ
  rationale: ἀπό와 수사가 결합한 표현을 한국어에서는 원인·대상 관계가 드러나도록 풀어 옮겼습니다. 뒤 절에서 구체적 내용이 이어지므로 ‘일’로 일반화해 과도한 해석을 피했습니다.
- source_word: εὐλαβήθη
  english_pob_choice: was afraid
  chosen_korean: 두려워했으며
  alternatives_korean:
  - 무서워했으며
  - 염려했으며
  - 경외하여 조심했으며
  lexicon: BDAG
  rationale: 문맥상 경외보다 불안·공포의 반응이므로 ‘두려워하다’를 택했습니다. 한국어에서는 현재적 서술감이 자연스러운 ‘두려워했습니다’보다, 병렬 구조를 살린 ‘두려워했으며’가 본문 흐름에 맞습니다.
- source_word: ἐπὶ τῷ τετάρτῳ προσώπῳ
  english_pob_choice: before a fourth / at the fourth face
  chosen_korean: 네 번째 얼굴 앞에서는
  alternatives_korean:
  - 네 번째 사람 앞에서는
  - 네 번째 일 앞에서는
  - 네 번째 면 앞에서는
  lexicon: LSJ
  rationale: πρόσωπον의 직역 의미인 ‘얼굴’을 살려 원문의 낯선 이미지를 보존했습니다. POB의 주석처럼 ‘사람’ 또는 ‘일’로도 읽힐 수 있지만, 본문은 의도적으로 그 어색함을 유지하는 쪽이 원문에 가깝습니다.
- source_word: ἐδεήθην
  english_pob_choice: I prayed
  chosen_korean: 제가 간청하였습니다
  alternatives_korean:
  - 제가 기도하였습니다
  - 제가 청하였습니다
  - 제가 간구하였습니다
  lexicon: BDAG
  rationale: δέομαι는 단순한 일반 기도보다 간절한 청원을 가리킬 수 있어, 이 문맥에서는 ‘간청하다’가 긴박한 반응을 더 잘 드러냅니다.
theological_decisions:
- issue: ἐπὶ τῷ τετάρτῳ προσώπῳ의 해석을 본문에 얼마나 보존할지
  chosen_reading: 원문의 비정상적 표현을 ‘네 번째 얼굴 앞에서는’으로 유지했습니다.
  alternative_readings:
  - 네 번째 사람 앞에서는
  - 네 번째 일 앞에서는
  rationale: 이 구절은 교리 쟁점이 아니라 번역상의 난점이지만, 원문의 생경한 이미지를 평탄화하지 않는 것이 독자가 다음 절과 함께 의미를 추적하는 데 도움이 됩니다. 따라서 주석 없이 매끈하게 풀지 않았습니다.
  doctrine_reference: Translation philosophy §1, §3, §5
