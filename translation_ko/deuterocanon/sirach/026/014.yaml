  yaml_path: translation/deuterocanon/sirach/026/014.yaml
  text: A wife's grace delights her husband[a], and her understanding puts flesh on his bones.
  footnotes:
  - marker: a
    text: Or 'her knowledge fattens his bones.' The Greek keeps a bodily metaphor for the strengthening effect of a wise wife.
    reason: lexical_alternative
translation:
  language: ko
  text: 아내의 은혜로움은 남편을 기쁘게 하며, 아내의 슬기는 남편의 뼈에 살이 오르게 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그녀의 지식이 그의 뼈를 살찌게 합니다.” 원문은 아내의 슬기가 남편에게 주는 유익을 뼈와 살의 신체적 은유로 표현합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρις
  english_pob_choice: grace
  chosen_korean: 은혜
  alternatives_korean:
  - 호감
  - 매력
  - 은총
  lexicon: BDAG
  rationale: 여기서는 구원론적 전문용어가 아니라 아내의 호감 가는 온화함과 호의를 가리키므로, POB의 'grace'를 따라 '은혜'로 옮기되 문맥상 자연스럽게 이해되도록 했습니다.
- source_word: γυναικὸς
  english_pob_choice: wife's
  chosen_korean: 여인의
  alternatives_korean:
  - 아내의
  - 여자의
  lexicon: BDAG
  rationale: 문맥상 '남편'과 짝을 이루는 결혼 관계를 뜻하지만, 한국어에서 '아내의 은혜'보다 '여인의 은혜'가 원문의 일반명사성을 더 가깝게 살리므로 이 표현을 택했습니다.
- source_word: ἐπιστήμη
  english_pob_choice: understanding
  chosen_korean: 지식
  alternatives_korean:
  - 이해
  - 분별
  - 슬기
  lexicon: BDAG
  rationale: 이 단어는 지식과 이해 모두 가능하지만, 뒤의 신체 은유('뼈에 살을 붙입니다')와 결합될 때 지혜의 실제적 능력을 드러내므로 한국어에서는 간결하게 '지식'으로 두고 의미는 문맥으로 받게 했습니다.
- source_word: πιανεῖ τὰ ὀστᾶ αὐτοῦ
  english_pob_choice: puts flesh on his bones
  chosen_korean: 그의 뼈에 살을 붙입니다
  alternatives_korean:
  - 그의 뼈를 살찌웁니다
  - 그의 뼈를 튼튼하게 합니다
  lexicon: LSJ
  rationale: 원문은 뼈에 살이 붙는 신체적 은유를 유지하므로, 추상화하지 않고 한국어에서도 직역에 가까운 표현으로 강하게 살렸습니다.
theological_decisions:
- issue: 지혜로운 아내의 언어가 단순한 외모 묘사인지, 관계적·실질적 유익을 말하는지
  chosen_reading: 본문은 아내의 '은혜'와 '지식'이 남편에게 정서적 기쁨과 신체적 충만을 준다는 지혜문학의 복합적 칭찬으로 읽었습니다.
  alternative_readings:
  - 외모의 매력만을 말하는 미학적 진술
  - 가정 경제적 번영을 말하는 은유
  rationale: χάρις와 ἐπιστήμη, 그리고 뼈/살의 신체 은유가 함께 작동하므로 단순한 외모 칭찬이나 물질 번영으로 축소하지 않는 것이 본문에 더 충실합니다.
  doctrine_reference: 지혜문학의 창조질서와 가정의 유익에 대한 일반적 교훈
