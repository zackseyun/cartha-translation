review_pass:
  verdict: revise
  source_fidelity: 첫 절의 γυνή는 뒤의 ‘그녀의 남편’과의 관계상 ‘아내’로 분명히 옮기는 것이 적절합니다. δεύτε 절의 ἐπιστήμη는 단순 정보로서의 ‘지식’보다 실제적 분별과 지혜를 포함하며, πιανεῖ와 ‘뼈’의 신체 은유는 유지되어야 합니다. 초안의 ‘그의 지식’은 한국어에서 남편의 지식으로 읽힐 수 있어 원문의 주어를 흐립니다.
  naturalness: ‘여인의 은혜’는 결혼 관계가 명시된 문맥에서 다소 일반적이고, ‘그의 지식’은 소유 관계가 모호합니다. ‘아내의 은혜로움’, ‘아내의 슬기’, ‘남편의 뼈에 살이 오르게 합니다’는 현대 표준어 합쇼체에서 자연스럽고 원문의 비유도 보존합니다.
  terminology: χάρις는 구원론적 ‘은혜’로 오해될 여지가 있으므로 이 문맥에서는 인격적 매력과 호의의 뜻을 드러내는 ‘은혜로움’이 적절합니다. ἐπιστήμη는 ‘슬기’로 옮겨 실천적 이해와 분별의 뉘앙스를 반영합니다.
  issues:
  - severity: medium
    issue: ‘여인의’와 ‘그의 남편’의 결혼 관계가 한국어 번역에서 불필요하게 약화됨
    rationale: γυνή 자체는 여성/아내 양쪽이 가능하지만, αὐτῆς와 ἄνδρα의 결합이 여기서는 아내와 남편의 관계를 명시합니다.
  - severity: high
    issue: ‘그의 지식’의 지시 대상이 모호함
    rationale: 원문의 αὐτῆς는 아내를 가리키지만, 한국어의 ‘그의’는 직전의 ‘남편’에 붙어 남편의 지식으로 오독될 수 있습니다.
  - severity: low
    issue: 각주의 ‘지혜로운 아내’ 및 ‘실제로 강건하게’는 본문에 없는 해석을 더함
    rationale: 그리스어는 아내를 ‘지혜로운’이라고 직접 규정하지 않으며, 신체 은유의 효과를 설명할 수는 있어도 ‘실제로’라는 표현은 은유를 지나치게 확정합니다.
