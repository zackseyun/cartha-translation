revisions:
- from: 여인의 은혜는 그의 남편을 즐겁게 하고, 그의 지식은 그의 뼈에 살을 붙입니다.[a]
  to: 아내의 은혜로움은 남편을 기쁘게 하며, 아내의 슬기는 남편의 뼈에 살이 오르게 합니다.[a]
  rationale: ‘아내’로 결혼 관계를 명확히 하고, 둘째 절에서 ‘아내’와 ‘남편’을 반복하여 소유격의 오독을 제거했습니다. ‘은혜로움’은 χάρις의 인격적·호의적 의미를, ‘슬기’는 ἐπιστήμη의 실천적 이해를 반영합니다. ‘뼈에 살이 오르게 합니다’는 πιανεῖ의 살찌게 함과 원문의 육체적 비유를 자연스러운 한국어로 유지합니다. 각주는 가능한 직역 대안만 제시하고 본문에 없는 ‘지혜로운’이라는 수식과 과도한 해석을 제거했습니다.
