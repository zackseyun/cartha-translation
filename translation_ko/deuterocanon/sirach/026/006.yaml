translation:
  language: ko
  text: 도시에서의 비방과 군중의 집회와 거짓 고발은, 이 모든 것은 죽음보다 더 나쁩니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 ‘도시의/도시에서의 비방’과 ‘군중의 집회’처럼 속격을 압축하여 나열합니다. ‘도시에서의’는 첫 표현의 사회적 배경을 한국어로 자연스럽게 드러낸 번역입니다.
    reason: lexical_alternative
