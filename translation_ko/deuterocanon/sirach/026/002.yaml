translation:
  language: ko
  text: 유능한 아내는 남편을 기쁘게 하며, 그는 평생을 즐거움 가운데 보낼 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '그리스어: “그리고 그는 자기 생애의 해들을 평안 가운데 채울 것입니다.”'
    reason: alternative_reading
lexical_decisions:
- source_word: אֵשֶׁת חַיִל
  english_pob_choice: a capable wife
  chosen_korean: 덕이 있는 아내
  alternatives_korean:
  - 유능한 아내
  - 능력 있는 아내
  - 용맹한 아내
  lexicon: HALOT
  rationale: חַיִל은 힘, 능력, 덕, 탁월함까지 아우를 수 있으므로, 지혜문학 문맥에서 아내에게는 인격적 탁월성과 실질적 능력을 함께 살리는 표현이 적절합니다. '덕이 있는'은 지나치게 군사적이지 않으면서도 가치와 역량을 함께 전달합니다.
- source_word: תְּדַּשֵּׁן
  english_pob_choice: gladdens
  chosen_korean: 기쁘게 하고
  alternatives_korean:
  - 풍성하게 하고
  - 살찌게 하고
  - 즐겁게 하고
  lexicon: HALOT
  rationale: 동사는 문자적으로는 '살찌게 하다/윤택하게 하다'의 이미지를 가지지만, 문맥상 남편에게 미치는 결과는 즐거움과 번영입니다. 한국어에서는 '기쁘게 하다'가 이 결과를 가장 자연스럽게 드러냅니다.
- source_word: בַנְעִימִים
  english_pob_choice: in pleasantness
  chosen_korean: 평안 가운데
  alternatives_korean:
  - 즐거움 가운데
  - 기쁨 가운데
  - 유쾌함 가운데
  lexicon: HALOT
  rationale: 히브리어는 '기분 좋음, 즐거움, 유쾌함'의 범위를 가지며, 병행하는 그리스어는 '평안'입니다. 본문은 히브리어를 따르되, 두 전승이 모두 가리키는 삶의 온전한 안정을 살려 '평안 가운데'로 옮겼습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행문의 마지막 절 표현 차이
  chosen_reading: 본문에는 히브리어의 의미 범위를 살려 '평안 가운데'를 두되, 그리스어의 '평안'과도 자연스럽게 연결되도록 처리했습니다.
  alternative_readings:
  - 즐거움 가운데
  - 유쾌함 가운데
  - 평안 속에서
  rationale: 이 절은 히브리어의 'pleasantness'와 그리스어의 'in peace'가 서로 가깝지만 동일하지 않으므로, 한쪽만 기계적으로 따르지 않고 둘의 공통 의미를 반영하는 번역이 적절합니다. 이는 전승 간 긴장을 지우지 않으면서도 한국어 문장으로 매끄럽게 읽히게 합니다.
  doctrine_reference: 'POB 번역 원칙: 생존하는 히브리어를 우선하되, 병행 전승의 의미 차이는 투명하게 반영한다.'
