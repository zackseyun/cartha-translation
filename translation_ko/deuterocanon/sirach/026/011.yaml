  source_fidelity: 현 번역의 ‘무뚝뚝한’은 ἀδιατρέπτως가 나타내는 완고함·고집스러움·쉽게 꺾이지 않음을 옮기지 못합니다. 또한 ἵνα μὴ 목적절은 딸이 자유를 얻어 그것을 이용하는 일을 막기 위한 경계의 목적을 나타내는데, 초안의 ‘그래야 ... 사용하지 못합니다’는 결과 진술로 바꾸어 원문의 구문과 의미를 흐립니다.
  naturalness: ‘딸 위에는 경계를 세워 두십시오’는 한국어에서 감독 대상을 표현하는 방식으로 부자연스럽습니다. ‘딸을 엄중히 지켜보십시오’가 현대 표준어 합쇼체에서 자연스럽고, 원문의 감시·경계 명령을 분명히 전달합니다.
  terminology: ἀδιατρέπτως는 ‘고집 센’으로, φυλακή는 문맥상 ‘엄중히 지켜보다’로 옮깁니다. ἄνεσις의 다의성은 본문에서 ‘자유’로 유지하고, χρήσηται의 목적어는 앞선 자유를 받는 ‘그것을 이용하다’로 명시합니다.
  issues:
  - severity: high
    issue: ἀδιατρέπτως를 ‘무뚝뚝한’으로 번역함
    rationale: ‘무뚝뚝한’은 말수나 태도의 쌀쌀함을 뜻하며, 원어와 영어 감사본이 가리키는 완고함 또는 불복종적 성향을 전달하지 못합니다.
  - severity: high
    issue: 목적절을 ‘그래야 ... 사용하지 못합니다’라는 결과문으로 처리함
    rationale: ἵνα μὴ는 ‘…하지 못하게 하도록/…하지 않도록’이라는 목적을 나타냅니다. 현 번역은 딸의 행동을 단순한 미래 결과처럼 표현합니다.
  - severity: medium
    issue: ‘딸 위에는 단단히 경계를 세워 두십시오’의 비자연스러운 결합
    rationale: 한국어에서는 사람 ‘위에’ 경계를 세운다고 하지 않습니다. 감독·감시의 뜻을 자연스럽게 표현할 필요가 있습니다.
  revised_text: 고집 센 딸을 엄중히 지켜보십시오. 그 딸이 스스로 자유를 얻어 그것을 이용하지 못하게 하십시오.
  revised_footnotes:
