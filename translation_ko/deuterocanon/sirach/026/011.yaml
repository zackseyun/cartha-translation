translation:
  language: ko
  text: 무뚝뚝한 딸[a] 위에는 단단히 경계를 세워 두십시오. 그래야 그 딸이 자기에게 자유를 찾아내더라도 그것을 사용하지 못합니다.
  philosophy: optimal-equivalence
  footnotes:
