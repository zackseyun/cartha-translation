    text: 그리스어는 문자적으로 ‘고집 센/꺾이지 않는 딸 위에 경계를 굳게 세우라, 그래야 자유를 찾아낸 뒤 그것을 사용하지 못한다’는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπὶ ... θυγατρί
  english_pob_choice: over a ... daughter
  chosen_korean: … 위에는
  alternatives_korean:
  - …에 관해
  - …을 두고
  lexicon: LSJ
  rationale: ἐπί + 여격은 여기서 감시·감독의 대상을 가리키므로, 한국어에서는 자연스럽게 ‘… 위에는’으로 옮겨 경계의 대상임을 드러냈습니다.
