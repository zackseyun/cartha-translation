    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπὶ ... θυγατρί
  english_pob_choice: over a ... daughter
  chosen_korean: … 위에는
  alternatives_korean:
  - …에 관해
  - …을 두고
  lexicon: LSJ
  rationale: ἐπί + 여격은 여기서 감시·감독의 대상을 가리키므로, 한국어에서는 자연스럽게 ‘… 위에는’으로 옮겨 경계의 대상임을 드러냈습니다.
- source_word: ἀδιατρέπτως
  english_pob_choice: headstrong
  chosen_korean: 무뚝뚝한
  alternatives_korean:
  - 고집 센
  - 말을 듣지 않는
  - 쉽게 꺾이지 않는
  lexicon: LSJ
  rationale: 직역형보다 문맥상 부모의 통제를 잘 따르지 않는 태도를 드러내는 표현을 택했습니다. 다만 ‘무뚝뚝한’은 감정적 반응성보다 완고함의 인상을 주기 위한 선택입니다.
- source_word: στερέωσον φυλακήν
  english_pob_choice: keep strict watch
  chosen_korean: 단단히 경계를 세워 두십시오
  alternatives_korean:
  - 엄중히 지키십시오
  - 굳게 감시하십시오
  - 견고한 경계를 두십시오
  lexicon: LSJ
  rationale: ‘경계를 세우다’는 φυλακήν의 감시·보호 의미를 살리고, στερέωσον의 강화 뉘앙스를 ‘단단히’로 반영했습니다.
- source_word: ἵνα μὴ εὑροῦσα ἄνεσιν ἑαυτῇ χρήσηται
  english_pob_choice: lest, finding freedom for herself, she make use of it
  chosen_korean: 그래야 그 딸이 자기에게 자유를 찾아내더라도 그것을 사용하지 못합니다
  alternatives_korean:
  - 자기 몫의 자유를 찾아내더라도 그것을 쓰지 못하게 하십시오
  - 스스로의 여유를 얻더라도 그것을 사용하지 못합니다
  lexicon: Greek grammar
  rationale: ἄνεσις는 ‘자유/완화/여유’의 폭이 있으나, 여기서는 억제에서 벗어나는 뜻이 핵심이므로 ‘자유를 찾아내다’로 옮겼고, χράομαι는 ‘사용하다’로 직역해 지시대명사 ‘그것’을 보완했습니다.
