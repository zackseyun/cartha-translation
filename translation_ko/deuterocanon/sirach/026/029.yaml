base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/026/029.yaml
  text: A merchant will scarcely be kept from wrongdoing[b][a], and a shopkeeper will not be declared righteous from sin.
  footnotes:
  - marker: a
    text: Or 'will hardly escape wrongdoing.' The Greek verb can mean 'escape' or 'extricate oneself from.'
    reason: lexical_alternative
  - marker: b
    text: '''Shopkeeper'' renders a Greek term for a small-scale retailer, sometimes with a negative social connotation.'
    reason: cultural_note
translation:
  language: ko
  text: 상인은 겨우 잘못에서 벗어날 수 있고, 가게 주인은 죄에서 의롭다 함을 받지 못합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문의 ἐξελεῖται는 ‘빠져나가다/벗어나다’와 ‘~에서 구출되다’의 뜻을 모두 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: κάπηλος는 단순한 ‘상인’보다 작은 규모의 소매업자나 잡화상을 가리키며, 때로는 부정적 사회적 뉘앙스를 띱니다.
    reason: cultural_note
lexical_decisions:
- source_word: Μόλις
  english_pob_choice: scarcely
  chosen_korean: 겨우
  alternatives_korean:
