  lexicon: LSJ
  rationale: 법정적·선언적 의미를 유지하되, 한국어에서 자연스러운 피동 표현으로 옮겨 도덕적 판정의 뉘앙스를 보존했습니다.
theological_decisions:
- issue: δικαιωθήσεται의 법정적 의미를 한국어에서 어떻게 드러낼지
  chosen_reading: ‘의롭다 함을 받지 못합니다’로 옮겨, 단순한 도덕적 칭찬이 아니라 판정/선언의 의미를 남겼습니다.
  alternative_readings:
  - ‘의롭다 인정받지 못합니다’
  - ‘의롭다고 선언되지 못합니다’
  rationale: 이 경구는 바울서신의 교리 논쟁이 아니라 지혜문학적 진술이므로, 구원론적 확장을 피하면서도 선언적 어감을 유지하는 번역이 적절합니다.
  doctrine_reference: 'DOCTRINE.md: source meaning 보존, 문맥 밖의 교리 체계 이입 금지'
