base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/026/029.yaml
  text: A merchant will scarcely be kept from wrongdoing[b][a], and a shopkeeper will not be declared righteous from sin.
  footnotes:
  - marker: a
    text: Or 'will hardly escape wrongdoing.' The Greek verb can mean 'escape' or 'extricate oneself from.'
    reason: lexical_alternative
  - marker: b
    text: '''Shopkeeper'' renders a Greek term for a small-scale retailer, sometimes with a negative social connotation.'
    reason: cultural_note
translation:
  language: ko
  text: 상인은 잘못에서 좀처럼 벗어나지 못하며,[a] 소매상은[b] 죄에서 의롭다 함을 받지 못합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문의 ἐξελεῖται는 ‘벗어나다’ 또는 ‘빠져나가다’라는 뜻이며, 문맥에 따라 ‘구출되다’로도 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: κάπηλος는 일반 상인보다 작은 규모의 소매업자나 잡화상을 가리키며, 때로는 부정적인 사회적 뉘앙스를 띱니다.
    reason: cultural_note
