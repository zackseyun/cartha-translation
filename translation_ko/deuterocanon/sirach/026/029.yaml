  - 피할 수 있고
  lexicon: LSJ
  rationale: ἀπό와 함께 ‘무엇으로부터 벗어나다/빠져나오다’의 뜻을 살려, 단순한 내적 의지보다 실제적 이탈 가능성을 반영했습니다.
- source_word: ἔμπορος
  english_pob_choice: merchant
  chosen_korean: 상인
