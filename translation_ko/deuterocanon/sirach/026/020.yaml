lexical_decisions:
- source_word: Ἐπὶ δυτὶ
  english_pob_choice: Over two things
  chosen_korean: 두 가지를 두고
  alternatives_korean:
  - 두 가지 때문에
  - 두 가지에 대하여
  - 두 가지로 인해
  lexicon: LSJ
  rationale: ἐπί + 여격은 여기서 근거/계기의 뜻이므로, 열거를 여는 표현인 ‘두 가지를 두고’로 옮겨 원문의 구조와 한국어 자연성을 함께 살렸습니다.
- source_word: λελύπηται
  english_pob_choice: is grieved
  chosen_korean: 마음이 괴롭고
  alternatives_korean:
  - 마음이 슬프고
  - 마음이 근심하고
  - 마음이 상하고
  lexicon: LSJ
  rationale: 완료형이 나타내는 현재 지속 상태를 살리되, ‘괴롭다’로 감정의 지속적 눌림을 자연스럽게 표현했습니다.
- source_word: ἐπὶ τῷ τρίτῳ θυμός μοι ἐπῆλθεν
  english_pob_choice: over the third anger came upon me
  chosen_korean: 셋째를 두고는 분노가 내게 이릅니다
  alternatives_korean:
  - 셋째를 두고는 분노가 내게 닥칩니다
  - 셋째 때문에 분노가 내게 일어납니다
  - 셋째를 두고는 분노가 내게 찾아옵니다
  lexicon: LSJ
  rationale: ἐπέρχομαι + 여격의 ‘덮쳐 오다/닥치다’ 의미를 살리면서, 열거의 절정인 ‘셋째’와 대응되도록 직역을 약간 다듬었습니다.
- source_word: θυμός
  english_pob_choice: anger
  chosen_korean: 분노
  alternatives_korean:
  - 노여움
  - 격분
  - 화
  lexicon: LSJ
  rationale: θυμός의 강한 감정적 격발을 ‘분노’로 옮겨, 단순한 ‘화’보다 더 강하고 문어적인 뉘앙스를 유지했습니다.
theological_decisions:
- issue: 이 절이 완결된 문장이 아니라 뒤이어 오는 목록을 여는 도입이라는 점
  chosen_reading: 문장 끝에 콜론을 두어 다음 열거로 이어지는 미완결성을 드러냈습니다.
  alternative_readings:
  - 마침표로 완결된 문장처럼 처리
  - 쉼표로만 남겨 여운을 주는 방식
  rationale: 그리스어 원문과 영어 POB 주석이 모두 이 구절을 다음 목록의 도입으로 보므로, 한국어에서도 미완결 구조를 명시하는 것이 해석을 돕습니다.
  doctrine_reference: 해석학적 문장 구조 보존
- issue: θυμός를 감정의 단순한 ‘화’보다 ‘분노’로 옮긴 점
  chosen_reading: 원문의 강한 정서를 반영해 ‘분노’로 번역했습니다.
  alternative_readings:
  - 화
  - 노여움
  - 격분
  rationale: 문맥상 단순 불쾌감이 아니라 강하게 솟구치는 정서이므로, 본문의 강도를 약화하지 않는 표현을 선택했습니다.
  doctrine_reference: 어휘 강도 보존
