base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/026/003.yaml
  text: A good wife is a good gift[a]; she will be given into the bosom of one who fears God.
  footnotes:
  - marker: a
    text: 'Greek parallel: ''in the portion of those who fear the Lord she will be given.'' The Hebrew reads ''into the bosom of one who fears God,'' using a more intimate image.'
    reason: alternative_reading
translation:
  language: ko
  text: 좋은 아내는 좋은 선물입니다[a]. 하나님을 경외하는 이의 품에 주어질 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 병행본문은 “주님을 경외하는 이들의 몫으로 그녀는 주어질 것입니다”라고 읽습니다. 히브리어는 더 친밀한 이미지인 “하나님을 경외하는 이의 품에”라고 말합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אִשָּׁה טוֹבָה
  english_pob_choice: a good wife
  chosen_korean: 좋은 아내
  alternatives_korean:
  - 좋은 여자
  lexicon: HALOT
  rationale: 문맥상 지혜문학의 혼인 관계를 가리키므로, 넓은 뜻의 ‘여자’보다 ‘아내’가 영어 POB의 결정을 더 자연스럽게 반영합니다.
- source_word: מַתָּנָה טוֹבָה
  english_pob_choice: a good gift
  chosen_korean: 좋은 선물
  alternatives_korean:
  - 훌륭한 선물
  lexicon: HALOT
  rationale: טוֹבָה의 반복을 살려 ‘좋은 선물’로 옮기면 간결한 격언체와 의미의 중첩이 유지됩니다.
- source_word: בְּחֵיק
  english_pob_choice: into the bosom of
  chosen_korean: 품에
  alternatives_korean:
  - 가슴에
  - 무릎에
  lexicon: HALOT
  rationale: 직역인 ‘bosom’의 신체 이미지를 한국어에서 가장 자연스럽게 살리면서도, 친밀한 소유·품김의 뉘앙스를 유지하는 표현입니다.
- source_word: יֵרֵא אֱלֹהִים
  english_pob_choice: one who fears God
  chosen_korean: 하나님을 경외하는 이
  alternatives_korean:
  - 하나님을 두려워하는 사람
  - 하나님을 경외하는 사람
  lexicon: HALOT
  rationale: ‘fear’의 지혜문학적 경외 의미를 반영해 ‘경외하는’으로 옮기고, 영어 POB의 단수·인칭성을 살려 ‘이’로 간명하게 처리했습니다.
theological_decisions:
- issue: 본문의 최종 신적 호칭
  chosen_reading: 하나님
  alternative_readings:
  - 주님
  rationale: 히브리어 본문은 אֱלֹהִים(하나님)을 읽으므로, 그리스어 병행본문의 Κύριον(주님)보다 원문 우선 원칙에 따라 본문은 ‘하나님’으로 유지합니다.
  doctrine_reference: 원문 우선 원칙; κύριος / אֱלֹהִים 대조
