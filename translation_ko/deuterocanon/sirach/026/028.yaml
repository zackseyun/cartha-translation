base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/026/028.yaml
  text: 'Over two things my heart is grieved[a], and over a third anger has come upon me: a warrior brought low by poverty, and men of understanding if they are treated like refuse[b], and one who turns back from righteousness to sin—the Lord will prepare him for the sword.'
  footnotes:
  - marker: a
    text: Or 'if they are treated as rubbish' or 'if they are cast aside as dung'; the Greek verb is built on a word for refuse and expresses contemptuous degradation.
    reason: lexical_alternative
  - marker: b
    text: The final singular 'him' most naturally refers to the one who turns back from righteousness to sin, though the Greek list is syntactically compressed and some readers may hear the judgment clause as summing up the whole saying.
    reason: alternative_reading
translation:
  language: ko
  text: 두 가지 때문에 내 마음이 괴롭고, 세 번째 때문에 분노가 일어납니다. 가난으로 낮아진 전사, 그리고 쓰레기처럼 취급당하는 분별 있는 사람들, 그리고 의에서 죄로 돌아서는 사람—주님께서 그를 칼에 넘기실 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘쓰레기처럼 취급당하는’은 σκύβαλον 계열의 경멸적 뉘앙스를 살린 번역입니다. 더 직설적으로는 ‘재처럼 버려지는’ 또는 ‘배설물처럼 여겨지는’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐπὶ δυτὶ
  english_pob_choice: Over two things
  chosen_korean: 두 가지 때문에
  alternatives_korean:
  - 두 가지 위에
  - 두 가지에 대하여
  lexicon: LSJ
  rationale: ἐπί + 여격의 감탄/탄식 용법을 한국어에서는 원인·대상 연결이 자연스러운 ‘때문에’로 풀어, 첫머리의 비애감을 살렸습니다.
- source_word: λελύπηται ἡ καρδία μου
  english_pob_choice: my heart is grieved
  chosen_korean: 내 마음이 괴롭고
  alternatives_korean:
  - 내 마음이 슬프고
  - 내 마음이 근심하고
  lexicon: LSJ
  rationale: 완료형의 현재 지속 상태를 한국어 현재 서술로 옮기되, 단순한 슬픔보다 내적 고통이 드러나는 ‘괴롭다’를 택했습니다.
- source_word: ἐὰν σκυβαλωθῶσιν
  english_pob_choice: if they are treated like refuse
  chosen_korean: 쓰레기처럼 취급당하는
  alternatives_korean:
  - 쓰레기처럼 버려지는
  - 폐물처럼 여겨지는
  - 배설물처럼 취급당하는
  lexicon: LSJ
  rationale: σκύβαλον 계열의 경멸적 ‘버림/오물’ 감각을 살리면서도, 본문 흐름에서 과도하게 거칠지 않게 ‘쓰레기처럼 취급당하는’으로 옮겼습니다.
- source_word: ἐπανάγων ἀπὸ δικαιοσύνης ἐπὶ ἁμαρτίαν
  english_pob_choice: one who turns back from righteousness to sin
  chosen_korean: 의에서 죄로 돌아서는 사람
  alternatives_korean:
  - 의로움에서 죄로 되돌아가는 사람
  - 의로운 길에서 죄로 돌아가는 사람
  lexicon: LSJ
  rationale: ἀπὸ…ἐπὶ…의 이동을 ‘에서…로’로 자연스럽게 재현했고, δικαιοσύνη는 이 지혜문맥에서 ‘의’가 기본값이므로 그대로 유지했습니다.
- source_word: ὁ κύριος
  english_pob_choice: the Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주
  - 주 하나님
  lexicon: LSJ
  rationale: 이 본문에서 κύριος는 하나님을 가리키는 주권적 호칭이므로, 한국어 합쇼체 문맥에 맞는 ‘주님’을 택했습니다.
- source_word: ἑτοιμάσει εἰς ῥομφαίαν αὐτόν
  english_pob_choice: will prepare him for the sword
  chosen_korean: 그를 칼에 넘기실 것입니다
  alternatives_korean:
  - 그를 칼을 위해 준비하실 것입니다
  - 그를 칼에 맞도록 준비하실 것입니다
  lexicon: LSJ
  rationale: ἑτοιμάσει εἰς ῥομφαίαν은 단순 준비가 아니라 심판적 배정의 뜻을 띠므로, 한국어에서는 결과를 드러내는 ‘칼에 넘기다’로 옮겨 더 직접적으로 재현했습니다.
theological_decisions:
- issue: 세 번째 항목의 분노와 뒤이은 심판 선언의 연결
  chosen_reading: 세 번째 항목 뒤에 곧바로 ‘주님께서 그를 칼에 넘기실 것입니다’로 이어지게 하여, 경고의 급전개를 그대로 살렸습니다.
  alternative_readings:
  - 쉼표나 설명구를 더 넣어 완만하게 연결할 수 있음
  - 심판 대상을 목록 전체로 넓게 읽을 수 있음
  rationale: 그리스어 문장이 압축적이므로, 한국어에서도 해설을 덧붙여 완충하기보다 단문 연결로 긴박한 판단의 어조를 보존하는 편이 원문에 가깝습니다.
  doctrine_reference: Preserve theological tension rather than resolve it
