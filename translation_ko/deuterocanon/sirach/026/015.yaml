  text: A quiet wife is a gift from the Lord[a], and there is no equivalent for a disciplined soul.
  footnotes:
  - marker: a
    text: Or 'there is no exchange for a well-instructed soul.' The Greek πεπαιδευμένης ψυχῆς can emphasize instruction as well as discipline.
    reason: lexical_alternative
translation:
  language: ko
  text: 조용한 아내는 주님의 선물이며, 훈련된 영혼[a]과 견줄 것이 없습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘잘 가르침을 받은 영혼’. 그리스어 πεπαιδευμένης ψυχῆς는 훈련뿐 아니라 가르침의 뜻도 강조할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: δόσις
  english_pob_choice: gift
  chosen_korean: 선물
  alternatives_korean:
  - 기증
  - 주는 것
  - 증여
  lexicon: LSJ
  rationale: δώσις는 여기서 주는 행위보다 ‘주어진 것’의 뜻이므로, 문맥상 자연스럽고 공감되는 ‘선물’이 가장 적절합니다.
- source_word: σιγηρά
  english_pob_choice: quiet
  chosen_korean: 고요한
  alternatives_korean:
  - 조용한
  - 잠잠한
  - 침묵하는
  lexicon: LSJ
  rationale: σίγηρος는 침묵의 절대성보다 말과 태도가 절제된 온건함을 가리키므로, ‘조용한’보다도 품위 있고 긍정적인 짝을 이루는 ‘고요한’으로 옮겼습니다.
- source_word: ἀντάλλαγμα
  english_pob_choice: equivalent
  chosen_korean: 견줄 것
  alternatives_korean:
  - 맞바꿀 것
  - 교환할 것
  - 동등한 값
  lexicon: LSJ
  rationale: 이 표현은 값을 매길 수 없고 대체할 수 없다는 뜻이므로, 영어의 ‘equivalent’에 맞춰 한국어로는 ‘견줄 것’이 가장 자연스럽습니다.
- source_word: πεπαιδευμένης ψυχῆς
  english_pob_choice: disciplined soul
  chosen_korean: 훈련된 영혼
  alternatives_korean:
  - 잘 가르침을 받은 영혼
  - 단련된 영혼
  - 교육받은 영혼
  lexicon: LSJ
  rationale: πεπαιδευμένης는 지식 교육뿐 아니라 훈련·형성을 포함하므로, POB의 ‘disciplined’에 맞춰 도덕적으로 빚어진 내면을 드러내는 ‘훈련된 영혼’으로 옮겼습니다.
theological_decisions:
- issue: γυνὴ와 πεπαιδευμένης ψυχῆς의 관계
  chosen_reading: 둘째 절은 첫째 절의 아내에 대한 평가를 이어가며, 그 가치가 내면의 형성된 인격에 있다는 뜻으로 읽었습니다.
  alternative_readings:
  - ‘훈련된 사람’
  - ‘잘 교육받은 영혼’
  rationale: 그리스어는 둘째 절에서 ‘아내’를 다시 반복하지 않지만, 평행법상 같은 대상을 계속 가리키는 것으로 보는 것이 가장 자연스럽습니다. 따라서 ‘영혼’을 유지하되, 단순한 학문 교육보다 지혜 전통의 인격 형성을 살렸습니다.
  doctrine_reference: 시락 26:15의 지혜적 인간 이해
