  text: 뻔뻔한 눈을 조심하십시오.[a] 당신에게 죄를 짓더라도 놀라지 마십시오.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 직역하면 ‘뻔뻔한 눈 뒤로/에서’에 가깝습니다. 이 전치사구는 관용적이고 해석이 까다로워, 여기서는 문맥상 보호하고 경계하라는 뜻으로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어 둘째 절에는 ‘그녀’라는 주어가 직접 나오지 않습니다. 앞뒤 문맥에서는 도덕적으로 그릇된 여인을 가리키는 것으로 이해될 수 있으나, 번역에서는 그 주어를 명시하지 않았습니다.
    reason: alternative_reading
