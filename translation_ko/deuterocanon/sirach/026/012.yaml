  rationale: 시락 26장의 연속 문맥에서 대상은 불미한 여성에 대한 경고로 읽히지만, 본 절 자체에는 성별 표지가 없습니다. 주어를 완전히 삭제하면 한국어가 부자연스럽고, '그녀'로 고정하면 해석을 과도하게 전면화할 수 있어, 문맥 지시를 유지하되 절 자체의 비명시성을 최소한으로 반영했습니다.
