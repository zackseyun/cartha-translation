  text: Guard yourself against an impudent eye[b][a], and do not be surprised if she sins against you.
  footnotes:
  - marker: a
    text: Greek literally, 'Guard yourself from/behind an impudent eye.' The prepositional phrase is idiomatic and difficult; the translation gives the likely sense.
    reason: lexical_alternative
  - marker: b
    text: The Greek does not explicitly state 'she' here; the feminine subject is inferred from the surrounding context about a morally wayward woman.
    reason: alternative_reading
translation:
  language: ko
  text: 뻔뻔한 눈을 조심하십시오. 그리고 그가 당신에게 죄를 지어도 놀라지 마십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 직역하면 ‘뻔뻔한 눈 뒤로/에서’에 가깝습니다. 전치사구는 관용적이고 해석이 까다로워, 여기서는 문맥상 보호 경고의 뜻을 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 두 번째 절에는 그리스어에 ‘그녀’가 직접 나오지 않습니다. 다만 앞뒤 문맥상 도덕적으로 그릇된 여인을 가리키는 것으로 이해됩니다.
    reason: alternative_reading
