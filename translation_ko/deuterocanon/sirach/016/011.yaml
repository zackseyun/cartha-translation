revisions:
- from: 한 사람이 목이 굳어 있어도[a], 그가 정죄를 면할 수 있을지 참으로 놀랍습니다. 자비와 분노가 그와 함께 있으며, 그는 참아 주고 용서하지만[b], 악한 자들 위에는 그의 진노를 머물게 하십니다.
  to: 목이 뻣뻣한 사람이 단 한 명이라도, 그가 무죄로 판정받는다면 놀라운 일입니다. 하나님께는 자비와 진노가 함께 있으며, 그분은 참으시고 용서하시지만, 악인들 위에는 자신의 진노를 머물게 하십니다.[a]
  rationale: 하나님을 가리키는 원문의 문맥상 주체를 한국어에서 명확히 하여 앞선 ‘한 사람’과의 지시어 혼동을 막았습니다. 법정적 의미를 ‘무죄로 판정받다’로 보존하고, 하나님의 행위에 대한 높임말을 일관되게 적용했습니다. 기존 각주 b는 실제로 마지막 절의 ‘진노를 머물게 하다’를 설명하지만 본문에서는 ‘용서하지만’ 뒤에 붙어 있어 구조상 부정확하므로, 관련 설명을 법정적 대안과 함께 문장 끝의 단일 각주로 배치했습니다.
