base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/016/011.yaml
  text: Even if one person is stiff-necked[a], it is astonishing if he will be cleared; for mercy and anger are with him, and he bears and forgives[b], but upon the wicked he lets his wrath rest.
  footnotes:
  - marker: a
    text: Or 'will be acquitted' or 'will go unpunished.' The Hebrew יִנָּקֶה and Greek ἀθῳωθήσεται both carry a forensic sense of being cleared from guilt or penalty.
    reason: lexical_alternative
  - marker: b
    text: Hebrew literally, 'he lets his wrath rest upon the wicked,' an image of wrath settling on them rather than merely flaring up.
    reason: lexical_alternative
translation:
  language: ko
  text: 목이 뻣뻣한 사람이 단 한 명이라도, 그가 무죄로 판정받는다면 놀라운 일입니다. 하나님께는 자비와 진노가 함께 있으며, 그분은 참으시고 용서하시지만, 악인들 위에는 자신의 진노를 머물게 하십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘벌을 면한다면’. 히브리어 יִנָּקֶה와 그리스어 ἀθῳωθήσεται는 죄책이나 형벌에서 벗어나는 법정적 의미를 지닙니다. 히브리어의 마지막 표현은 문자적으로 ‘그의 진노를 악인들 위에 머물게 한다’는 뜻으로, 진노가 일시적으로 폭발하는 것이 아니라 그들 위에 내려와 머무는 이미지를 담고 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַקְשֶׁה עֹרֶף / σκληροτράχηλος
  english_pob_choice: stiff-necked
  chosen_korean: 목이 굳어 있는
  alternatives_korean:
  - 고집 센
  - 완고한
  lexicon: HALOT; LSJ
  rationale: 히브리어 관용구를 직접 살리되, 한국어에서 자연스럽게 읽히도록 ‘목이 굳어 있는’으로 옮겼습니다. ‘고집 센’은 의미는 쉽지만 비유가 약해집니다.
- source_word: יִנָּקֶה / ἀθῳωθήσεται
  english_pob_choice: will be cleared
  chosen_korean: 정죄를 면할 수 있을지
  alternatives_korean:
  - 무죄를 선고받을지
  - 벌을 면할지
  lexicon: HALOT; LSJ
  rationale: 법정적 의미의 ‘cleared’를 한국어로 풀어, 죄책이나 벌에서 벗어나는 뜻을 살렸습니다. 문맥상 가능성의 수사이므로 ‘-할 수 있을지’로 처리했습니다.
- source_word: רַחֲמִים / וְסוֹלֵחַ
  english_pob_choice: mercy / forgives
  chosen_korean: 자비 / 용서하다
  alternatives_korean:
  - 긍휼 / 사면하다
  - 동정 / 용서하다
  lexicon: HALOT
  rationale: ‘자비’와 ‘용서하다’는 본문의 짝을 가장 자연스럽게 재현합니다. ‘사면하다’는 지나치게 법률적 뉘앙스를 강하게 만들 수 있습니다.
- source_word: יַנִּיחַ רָגְזוֹ
  english_pob_choice: he lets his wrath rest
  chosen_korean: 그의 진노를 머물게 하십니다
  alternatives_korean:
  - 그의 분노를 쉬게 하십니다
  - 그의 진노를 내려놓게 하십니다
  lexicon: HALOT
  rationale: 히브리어의 ‘머물다/쉬다’ 이미지를 살려, 진노가 악인 위에 내려와 머무는 장면을 유지했습니다. ‘쉬게 하다’는 이미지가 다소 약해집니다.
theological_decisions:
- issue: 하나님의 자비와 분노의 긴장 보존
  chosen_reading: 자비와 분노를 함께 두고, 이어서 용서와 진노를 병렬로 제시해 본문의 긴장을 그대로 유지했습니다.
  alternative_readings:
  - 자비를 강조해 분노를 약화시키는 번역
  - 분노를 단순한 감정적 폭발로 순화하는 번역
  rationale: 히브리어와 그리스어 모두 하나님에게 자비와 진노가 함께 있음을 대조적으로 말하므로, 이를 조화시켜 지우지 않고 드러내야 합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 3
