base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/016/025.yaml
  text: I will declare my spirit with measure[c][b][a], and with care I will make my knowledge known.
  footnotes:
  - marker: a
    text: Hebrew reads 'my spirit'; the Greek parallel reads 'instruction.' The translation reflects both witnesses by bringing out the sense of inwardly formed teaching.
    reason: alternative_reading
  - marker: b
    text: '''With measure'' is literally ''with weight,'' an image for speech that is weighed out carefully.'
    reason: lexical_alternative
  - marker: c
    text: The Hebrew phrase rendered 'with care' can also suggest discreetly or modestly; the Greek parallel emphasizes precision.
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 내 영을 저울질하여 선포하고, 조심스럽게 내 지식을 알리겠습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘내 영’을 읽고, 그리스어 평행문은 ‘가르침/훈련’을 읽습니다. 번역은 히브리어를 따르되, 두 전승의 차이는 그대로 남겨 둡니다.
    reason: textual_variant
  - marker: b
    text: ‘저울질하여’는 직역하면 ‘무게로/저울로’라는 이미지입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘조심스럽게’는 ‘은밀하게, 절제하여, 신중하게’라는 뜻을 함께 품을 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַבִּיעָה
  english_pob_choice: I will declare / make ... clear
  chosen_korean: 선포하고
  alternatives_korean:
  - 말하고
  - 드러내고
  - 알리고
  lexicon: HALOT
  rationale: 히브리어는 단순 발화보다 밖으로 내어놓아 알리는 동작을 가리키며, POB의 ‘declare/make clear’ 취지를 살려 공적으로 드러내는 느낌의 ‘선포하다’를 택했습니다.
- source_word: בְמִשְׁקָל
  english_pob_choice: with measure
  chosen_korean: 저울질하여
  alternatives_korean:
  - 분량으로
  - 무게로
  - 신중하게
  lexicon: HALOT
  rationale: 직역하면 ‘무게/저울로’이므로, 말의 분량을 재듯 조심히 내놓는 이미지를 살려 한국어에서도 비유를 살린 ‘저울질하여’로 옮겼습니다.
- source_word: רוּחִי
  english_pob_choice: my spirit
  chosen_korean: 내 영을
  alternatives_korean:
  - 내 마음을
  - 내 정신을
  - 내 속을
  lexicon: HALOT
  rationale: 본문의 히브리어는 분명히 ‘내 영’이며, 그리스어 평행문의 ‘instruction’은 직접 번역어가 아니라 해석적 평행입니다. 따라서 원문을 따라 ‘영’을 유지했습니다.
- source_word: וּבְהַצְנֵעַ
  english_pob_choice: with care
  chosen_korean: 조심스럽게
  alternatives_korean:
  - 은밀하게
  - 겸손하게
  - 정확하게
  lexicon: HALOT
  rationale: 이 동사는 절제·신중함·조심스러움을 모두 띨 수 있으며, POB가 잡은 ‘with care’와 그리스어의 ‘정확성’ 뉘앙스를 함께 살리기 위해 ‘조심스럽게’로 번역했습니다.
- source_word: דֵעִי
  english_pob_choice: my knowledge
  chosen_korean: 내 지식을
  alternatives_korean:
  - 내 이해를
  - 내 앎을
  - 내 깨달음을
  lexicon: HALOT
  rationale: 히브리어 명사 דֵעַ는 ‘지식/앎’을 뜻하므로, 평이하면서도 직접적인 ‘지식’을 택해 문장의 대상을 분명히 했습니다.
theological_decisions:
- issue: 히브리어 ‘내 영’과 그리스어 평행문의 ‘instruction’ 사이의 긴장
  chosen_reading: 본문에는 ‘내 영’을 유지하되, 한국어에서 해석을 덧붙이지 않고 시적·내면적 발화를 드러내는 표현으로 옮겼습니다.
  alternative_readings:
  - ‘내 영의 가르침’처럼 해석을 앞세우는 번역
  - 그리스어를 따라 ‘내 가르침’으로 평준화하는 번역
  rationale: 이 절은 지혜문학 특유의 자기 발화이며, 두 전승 사이의 차이를 지워 버리면 본문의 긴장이 사라집니다. 그래서 히브리어의 직접성을 우선하고, 그리스어는 번역의 배경으로만 반영했습니다.
  doctrine_reference: 본문 비평/평행본문 해석 원칙
- issue: ‘저울질하여’의 은유 보존
  chosen_reading: 말을 저울로 달 듯 신중히 내놓는 은유를 살렸습니다.
  alternative_readings:
  - 은유를 풀어 ‘신중하게’로만 번역
  - ‘정확히’로만 번역
  rationale: 원문은 단순한 태도 묘사보다 ‘무게를 재어 말함’이라는 시적 이미지를 포함하므로, 그 힘을 약화시키지 않기 위해 은유를 유지했습니다.
  doctrine_reference: 시적 언어 보존 원칙
