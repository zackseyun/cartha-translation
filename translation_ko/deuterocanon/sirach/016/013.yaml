base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/016/013.yaml
  text: An unjust one will not escape with plunder[a], and the desire of the righteous will never fail.
  footnotes:
  - marker: a
    text: 'Greek: ''and the endurance of the godly will certainly not be delayed.'' The Hebrew reads ''the longing of the righteous will never be frustrated.'''
    reason: alternative_reading
translation:
  language: ko
  text: 불의한 자는 약탈물로는 벗어나지 못하며, 의인의 갈망은 영원히 좌절되지 않습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 “경건한 자의 인내는 결코 지체되지 않는다”로 읽습니다. 히브리어는 “의인의 갈망은 결코 좌절되지 않는다”로 읽습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: לֹא יִמָּלֵט
  english_pob_choice: will not escape
  chosen_korean: 결코 벗어나지 못하고
  alternatives_korean:
  - 도망치지 못하고
  - 빠져나가지 못하고
  - 구출되지 못하고
  lexicon: HALOT
  rationale: נמלט의 기본 의미는 ‘벗어나다/탈출하다’이므로, 심판의 문맥을 살려 ‘결코 벗어나지 못하고’로 옮겼습니다.
- source_word: בְּגָזֵל
  english_pob_choice: with plunder
  chosen_korean: 약탈물과 함께
  alternatives_korean:
  - 약탈로
  - 도둑질한 것으로
  - 탈취한 것과 함께
  lexicon: HALOT
  rationale: ב 전치사는 수단·동반 상황을 나타낼 수 있어, 불의한 이가 약탈물을 지녀도 벗어나지 못한다는 뜻을 살려 ‘약탈물과 함께’로 옮겼습니다.
- source_word: עַוָּל
  english_pob_choice: a sinner
  chosen_korean: 불의한 자
  alternatives_korean:
  - 죄인
  - 악인
  - 불의한 사람
  lexicon: HALOT
  rationale: 히브리어 עַוָּל은 ‘불의한 자/불의한 사람’의 성격을 강하게 가지므로, 한국어에서 도덕적·법정적 대비를 살리는 ‘불의한 자’를 택했습니다.
- source_word: תַּאֲוַת צַדִּיק
  english_pob_choice: the longing of the righteous
  chosen_korean: 의인의 갈망
  alternatives_korean:
  - 의인의 소망
  - 의인의 욕망
  - 의인들의 갈망
  lexicon: HALOT
  rationale: תַּאֲוָה는 긍정적 맥락에서 ‘갈망/소망’이 자연스럽고, 단수 צַדִּיק은 대표적·총칭적 의미로 보아 ‘의인’으로 옮겼습니다.
- source_word: וְלֹא יַשְׁבִּית
  english_pob_choice: will never be frustrated
  chosen_korean: 영원히 좌절되지 않습니다
  alternatives_korean:
  - 결코 그치지 않습니다
  - 멈추지 않습니다
  - 좌절되지 않습니다
  lexicon: HALOT
  rationale: 히브리어의 사역형은 ‘그치게 하다/중단시키다’의 뜻을 가지므로, 의인의 갈망이 끝내 꺾이거나 무산되지 않는다는 결과를 드러내는 ‘좌절되지 않습니다’가 적절합니다.
theological_decisions:
- issue: 히브리어 ‘불의한 자’와 영어 POB의 ‘a sinner’ 사이의 뉘앙스
  chosen_reading: 본문에는 도덕적 범주를 살리는 ‘불의한 자’를 사용했습니다.
  alternative_readings:
  - 죄인
  - 악인
  rationale: 히브리어 עַוָּל은 ‘불의하게 행하는 자’의 성격을 드러내므로, 한국어 본문에서는 원문 의미를 더 직접적으로 반영했습니다. 영어 POB의 ‘sinner’는 포괄적 해석으로 보조 주석에 맡길 수 있습니다.
  doctrine_reference: 원문 우선 원칙; 어휘적 긴장 보존
- issue: '두 번째 절의 강도: ‘좌절되지 않습니다’와 영어 POB의 ‘will never fail’/주석의 다른 읽기'
  chosen_reading: 의인의 갈망은 영원히 좌절되지 않습니다.
  alternative_readings:
  - 의인의 갈망은 결코 그치지 않습니다
  - 경건한 자의 인내는 지체되지 않습니다
  rationale: 히브리어 본문은 ‘의인의 갈망/소망’이 무산되지 않는다는 뜻을 직접적으로 지지하므로, 주요 본문은 히브리어를 따르고 그리스어 전통의 ‘인내’ 읽기는 주석으로 보존하는 편이 좋습니다.
  doctrine_reference: 원문 우선 원칙; 번역 전통 간 차이 보존
