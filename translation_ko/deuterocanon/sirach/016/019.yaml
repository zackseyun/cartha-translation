lexical_decisions:
- source_word: קִצְבֵי הָרִים
  english_pob_choice: the peaks of the mountains
  chosen_korean: 산의 꼭대기
  alternatives_korean:
  - 산들의 끝자락
  - 산의 정상들
  - 산의 끝
  lexicon: HALOT
  rationale: 산과 함께 쓰인 קִצְבֵי는 산의 가장 높은 끝부분을 가리키므로, 자연스럽고 이미지가 선명한 ‘산의 꼭대기’로 옮겼습니다.
- source_word: וִיסוֹדֵי תֵבֵל
  english_pob_choice: the foundations of the world
  chosen_korean: 세상의 기초
  alternatives_korean:
  - 세상의 토대
  - 땅의 기초
  - 세상의 주춧돌
  lexicon: HALOT
  rationale: יסוד의 기본 뜻인 ‘기초/토대’를 살리면서, תֵבֵל의 우주적·질서정연한 세계를 한국어로 간명하게 드러내기 위해 ‘세상의 기초’로 번역했습니다.
- source_word: בְּהַבִּיטוֹ אֲלֵיהֶם
  english_pob_choice: when he looks at them
  chosen_korean: 그가 그것들을 바라보시면
  alternatives_korean:
  - 그가 그것들을 보시면
  - 그가 그것들 위로 눈을 돌리시면
  lexicon: HALOT
  rationale: 문맥상 주어는 하나님이며, 히브리어의 분사적 시간절을 한국어의 조건·시간 종결형으로 자연스럽게 풀어 ‘바라보시면’으로 옮겼습니다.
- source_word: רַעַשׁ יִרְעָשׁוּ
  english_pob_choice: they quake
  chosen_korean: 떨며 흔들립니다
  alternatives_korean:
  - 떨고 흔들립니다
  - 진동합니다
  - 무너질 듯 떨립니다
  lexicon: HALOT
  rationale: רַעַשׁ과 יִרְעָשׁוּ의 중첩된 떨림·진동을 한국어에서도 중첩감 있게 살리기 위해 ‘떨며 흔들립니다’로 옮겼습니다.
theological_decisions:
- issue: 암시된 하나님의 주어
  chosen_reading: ‘그가’로 두어, 본문이 직접 이름을 밝히지 않더라도 문맥상 하나님을 가리키는 암시를 유지했습니다.
  alternative_readings:
  - 하나님이 그것들을 바라보시면
  - 주님이 그것들을 바라보시면
  rationale: 히브리어는 대명사적/암시적 주어로 말하고 있으므로, 명시화보다 원문의 간결성을 보존하는 쪽이 더 충실합니다.
  doctrine_reference: 원문 우선 원칙; 암시된 신적 주어를 과잉 해석하지 않음
