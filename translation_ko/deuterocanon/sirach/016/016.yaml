base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/016/016.yaml
  text: His mercies are seen by all his creatures[b][a], and he has apportioned his light and his praise to the sons of man.
  footnotes:
  - marker: a
    text: Or 'to humankind' / 'to human beings'; Hebrew 'to the sons of man,' an idiom for humanity.
    reason: lexical_alternative
  - marker: b
    text: 'The Greek parallel in Swete reads very differently here: ''Who will remember me from on high?'' The main text follows the extant Hebrew witness, which is the primary source for this verse where available.'
    reason: textual_variant
translation:
  language: ko
  text: 그의 긍휼은 그의 모든 피조물에게 보이며, 그는 자신의 빛과 찬양을 사람들에게 나누어 주셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘사람의 아들들에게’라고 하며, 인류 전체를 가리키는 관용구입니다.
    reason: lexical_alternative
  - marker: b
    text: Swete의 그리스어 본문은 여기서 매우 다르게 ‘높은 곳에서 누가 나를 기억하겠는가?’라고 읽습니다. 본문은 이 절에 현존하는 히브리어 본문 증거를 따릅니다.
    reason: textual_variant
lexical_decisions:
- source_word: רַחֲמָיו
  english_pob_choice: his mercies
  chosen_korean: 그의 긍휼
  alternatives_korean:
  - 그의 자비
  - 그의 긍휼하심
  lexicon: HALOT
  rationale: 복수형 רחמים의 구체적인 자비 행위를 살리되, 한국어에서는 ‘긍휼’이 성경적 어감과 함축을 가장 안정적으로 전합니다.
- source_word: יֵרָאוּ
  english_pob_choice: are seen
  chosen_korean: 드러나며
  alternatives_korean:
  - 보이며
  - 드러납니다
  - 보입니다
  lexicon: HALOT
  rationale: 단순 수동 ‘보인다’보다, 하나님의 긍휼이 피조물 가운데서 실제로 나타난다는 뉘앙스를 살려 ‘드러나며’로 옮겼습니다.
- source_word: לְכָל בִּרְיוֹתָיו
  english_pob_choice: by all his creatures
  chosen_korean: 그의 모든 피조물에게서
  alternatives_korean:
  - 그의 모든 피조물에 의해
  - 그의 모든 피조물 가운데서
  lexicon: HALOT
  rationale: ‘creatures’의 피조된 존재라는 뜻을 살리면서, 수동문과 자연스럽게 연결되는 한국어로 정리했습니다.
- source_word: לִבְנֵי אָדָם
  english_pob_choice: to the sons of man
  chosen_korean: 사람의 아들들에게
  alternatives_korean:
  - 인류에게
  - 사람들에게
  - 인간의 아들들에게
  lexicon: HALOT
  rationale: 히브리어 בני אדם의 남성형 관용구를 본문에서 유지해 원문 감각을 살렸고, 일반화된 의미는 각주로 설명할 수 있게 했습니다.
theological_decisions:
- issue: ‘his light and his praise’의 의미 범위
  chosen_reading: 자신의 빛과 찬양을 나누어 주셨습니다
  alternative_readings:
  - 자신의 빛과 영광을 나누어 주셨습니다
  - 자신의 빛과 칭송을 나누어 주셨습니다
  rationale: 원문은 빛과 찬양을 인간에게 분배한다는 진술이지 그 내용을 해석해 확정하지 않으므로, ‘찬양’을 택해 본문의 개방성을 유지했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 3
- issue: 남성형 관용구 בני אדם의 처리
  chosen_reading: 사람의 아들들에게
  alternative_readings:
  - 인류에게
  - 사람들에게
  rationale: 원문의 남성형 표현과 관용성을 보존하되, 현대 독자가 대표적 인간성으로 이해할 수 있도록 본문은 직역에 가깝게 두고 해석 여지는 열어 둡니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4; Contested terms אָדָם
