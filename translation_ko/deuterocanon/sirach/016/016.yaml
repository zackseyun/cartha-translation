- from: 그의 긍휼은 그의 모든 피조물에게서 드러나며, 그는 자신의 빛과 찬양을 사람의 아들들에게 나누어 주셨습니다.[a][b]
  to: 그의 긍휼은 그의 모든 피조물에게 보이며, 그는 자신의 빛과 찬양을 사람들에게 나누어 주셨습니다.[a][b]
