  text: Those lacking sense will understand these things[a], and a foolish man will consider this.
  footnotes:
  - marker: a
    text: Hebrew reads 'this' in the second line, while the Greek parallel has 'foolish things.' The main text follows the Hebrew witness, with the Greek informing the sense of פּוֹתֶה as more than merely naive.
    reason: alternative_reading
translation:
  language: ko
  text: 지혜가 부족한 자들은 이 일을 이해할 것이고, 어리석은 사람은 이것을 생각할 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 둘째 행에서 단수 '이것'을 사용하지만, 그리스어 병행구는 '어리석은 것들'로 넓혀 표현합니다. 본문은 히브리어를 따르되, פּוֹתֶה의 의미는 단순한 순진함보다 더 강한 어리석음으로 반영합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: חַסְרֵי לֵב
  english_pob_choice: those lacking sense
  chosen_korean: 지혜가 부족한 자들
  alternatives_korean:
  - 분별이 없는 자들
  - 마음이 부족한 자들
  - 무지한 자들
  lexicon: HALOT
  rationale: 직역하면 '마음이 부족한'이지만, 히브리어 관용구상 이해력과 분별의 결핍을 뜻하므로 한국어에서는 자연스럽고 본뜻을 드러내는 '지혜가 부족한 자들'로 옮겼습니다.
- source_word: יָבִינוּ
  english_pob_choice: will understand
  chosen_korean: 이해할 것이고
  alternatives_korean:
  - 알게 될 것이고
  - 분별할 것이고
  - 깨달을 것이고
  lexicon: HALOT
  rationale: 지혜문학 문맥에서 단순 지식 습득보다 사물의 뜻을 알아차리는 의미가 강하므로 '이해하다'를 택했습니다.
- source_word: אֵלֶּה
  english_pob_choice: these things
  chosen_korean: 이 일
  alternatives_korean:
  - 이것들
  - 이것들에 대해
  - 이러한 것들
  lexicon: HALOT
  rationale: 히브리어 복수형이지만 한국어에서는 앞 절의 내용을 가리키는 총칭으로 자연스럽게 읽히는 '이 일'이 가장 간결합니다.
- source_word: פּוֹתֶה
  english_pob_choice: foolish
  chosen_korean: 어리석은
  alternatives_korean:
  - 미련한
  - 순진한
  - 쉽게 속는
  lexicon: HALOT
  rationale: 그리스어 병행구의 ἄφρων καὶ πλανώμενος가 단순한 순진함보다 판단력의 결핍을 보이므로, 전통적 교회어투를 피하면서도 의미를 분명히 하는 '어리석은'을 선택했습니다.
- source_word: זֹאת
  english_pob_choice: this
  chosen_korean: 이것을
  alternatives_korean:
  - 이 일
  - 그것을
  - 이것
  lexicon: HALOT
  rationale: 히브리어 단수 지시어를 그대로 살려, 앞 절의 복수 표현과 구분되는 단수 지시를 유지했습니다.
theological_decisions:
- issue: 지혜/어리석음의 대조를 어떻게 살릴 것인가
  chosen_reading: '''지혜가 부족한 자들''과 ''어리석은 사람''의 대조를 유지했습니다.'
  alternative_readings:
  - '''마음이 없는 자들''과 ''미련한 사람''으로 단순 직역'
  - 두 절을 모두 '알지 못하는 자들'로 완화
  rationale: 본문은 지적·도덕적 분별의 결핍과 어리석음의 대조를 강조하므로, 의미를 약화시키지 않도록 대조를 분명히 드러냈습니다.
  doctrine_reference: 지혜문학의 분별/어리석음 대비
