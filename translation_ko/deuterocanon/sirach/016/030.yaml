  lexicon: BDAG, LSJ
  rationale: 이 문맥에서는 모든 살아 있는 것의 생명/생기라는 뜻이므로, 비물질적 '영혼'보다 '생명'이 원문 의미를 가장 정확히 드러냅니다.
- source_word: παντὸς ζῴου
