  lexicon: LSJ
  rationale: ἀποστροφή는 여기서 '되돌아감/귀환'의 뜻이므로, 문맥상 땅으로 돌아감을 담아 '그리로 돌아감'으로 옮겼습니다.
theological_decisions:
