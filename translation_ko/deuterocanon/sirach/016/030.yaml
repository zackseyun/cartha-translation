  lexicon: LSJ
  rationale: 직역하면 '그녀의 얼굴'이지만, 여기서는 땅/지면을 가리키는 의인화된 표현이므로 한국어에서는 의미가 자연스럽게 드러나는 '표면'을 택했습니다.
- source_word: ἡ ἀποστροφὴ αὐτῶν
  english_pob_choice: is their return
  chosen_korean: 그리로 돌아감
  alternatives_korean:
  - 그들의 돌아감
  - 그들의 되돌아감
