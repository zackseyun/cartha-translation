base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/016/030.yaml
  text: The surface of it covered the life of every living thing[b][a], and to it is their return.
  footnotes:
  - marker: a
    text: Literally, 'her face.' The Greek likely refers to the face or surface of the earth.
    reason: lexical_alternative
  - marker: b
    text: Or 'into her is their return.' The phrase points to living things returning to the earth.
    reason: alternative_reading
translation:
  language: ko
  text: 모든 살아 있는 것의 생명은 그 표면을 덮었고, 그들에게는 그리로 돌아감이 있습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 '그녀의 얼굴'입니다. 여기서는 문맥상 땅 또는 지면의 표면을 가리키는 것으로 보입니다.
    reason: lexical_alternative
  - marker: b
    text: '''그리로 돌아감''은 ''그들에게는 그리로 돌아감이 있습니다''라는 뜻이며, 문맥상 살아 있는 것들이 땅으로 돌아감을 가리킵니다.'
    reason: alternative_reading
lexical_decisions:
- source_word: ψυχὴν
  english_pob_choice: the life
  chosen_korean: 생명
  alternatives_korean:
  - 영혼
  - 목숨
  - 생기
  lexicon: BDAG, LSJ
  rationale: 이 문맥에서는 모든 살아 있는 것의 생명/생기라는 뜻이므로, 비물질적 '영혼'보다 '생명'이 원문 의미를 가장 정확히 드러냅니다.
- source_word: παντὸς ζῴου
  english_pob_choice: of every living thing
  chosen_korean: 모든 살아 있는 것의
  alternatives_korean:
  - 모든 짐승의
  - 모든 동물의
  - 모든 피조물의
  lexicon: LSJ
  rationale: ζῷον의 범위를 지나치게 좁히지 않고, '모든 살아 있는 것'으로 넓게 살려 원문의 포괄성을 유지했습니다.
- source_word: τὸ πρόσωπον αὐτῆς
  english_pob_choice: her surface
  chosen_korean: 그 표면을
  alternatives_korean:
  - 그 얼굴을
  - 그 지면을
  - 그 겉면을
  lexicon: LSJ
  rationale: 직역하면 '그녀의 얼굴'이지만, 여기서는 땅/지면을 가리키는 의인화된 표현이므로 한국어에서는 의미가 자연스럽게 드러나는 '표면'을 택했습니다.
- source_word: ἡ ἀποστροφὴ αὐτῶν
  english_pob_choice: is their return
  chosen_korean: 그리로 돌아감
  alternatives_korean:
  - 그들의 돌아감
  - 그들의 되돌아감
  - 그들의 회귀
  lexicon: LSJ
  rationale: ἀποστροφή는 여기서 '되돌아감/귀환'의 뜻이므로, 문맥상 땅으로 돌아감을 담아 '그리로 돌아감'으로 옮겼습니다.
theological_decisions:
- issue: 여성형 대명사의 지시 대상
  chosen_reading: αὐτῆς/αὐτὴν의 여성형은 앞뒤 문맥의 땅/지면을 가리키는 의인화로 보고, 한국어에서도 이를 노출하는 방식으로 번역했습니다.
  alternative_readings:
  - 중성적으로 '그것의 표면 ... 그리로'로 옮기기
  - 명시적으로 '땅의 표면 ... 땅으로'라고 풀어쓰기
  rationale: 원문은 여성형을 유지해 땅을 의인화하고 있으므로, 한국어에서는 직접 '땅'을 덧붙이지 않되 '그 표면'과 '그리로'로 지시 관계를 드러내어 원문의 긴장을 보존했습니다.
  doctrine_reference: 원문 우선 원칙; 문맥적 의인화 보존
