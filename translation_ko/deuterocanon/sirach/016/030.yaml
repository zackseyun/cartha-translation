    text: 직역하면 ‘그녀의 얼굴’입니다. 여기서는 문맥상 땅 또는 지면의 표면을 가리키는 것으로 보입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그 안으로’. 이 표현은 살아 있는 것들이 땅으로 돌아감을 가리킵니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ψυχὴν
  english_pob_choice: the life
  chosen_korean: 생명
