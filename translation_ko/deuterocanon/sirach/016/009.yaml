  source_fidelity: 핵심 어휘 선택은 히브리어를 대체로 충실히 따릅니다. 다만 본문의 ‘자기 죄’는 집단 지시와 결합될 때 ‘그들의 죄악’이 더 분명하며, 각주에서 그리스어 표현을 다소 단정적으로 처리했습니다.
  naturalness: 현행 본문은 ‘한 백성을, 자기 죄 가운데 짓밟힌 자들을’이라는 동격 구성이 쉼표로 분리되어 다소 부자연스럽고, ‘자기’의 지시 대상도 순간적으로 불분명합니다. ‘곧’을 사용해 동격 관계를 명시하면 현대 한국어 문장으로 더 자연스럽습니다.
  terminology: ‘멸망에 바쳐진’은 חֵרֶם의 심판적·제의적 함의를 비교적 투명하게 보존합니다. חָמַל은 여기서 ‘불쌍히 여기지 않으셨습니다’로 옮길 수 있습니다. עָוֹן은 ‘죄악’으로 옮겨 죄책/불의의 무게를 살렸습니다.
  issues:
