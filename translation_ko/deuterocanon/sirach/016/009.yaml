translation:
  language: ko
  text: 그는 멸망에 바쳐진 한 백성을, 자기 죄 가운데 짓밟힌 자들을 불쌍히 여기지 않으셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 병행본문은 ‘멸망의 민족, 자기 죄들 가운데서 제거된 자들’로 옮길 수 있습니다. 히브리어는 짓밟힘의 이미지를 더 분명히 보여 줍니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְלֹא חָמַל
  english_pob_choice: and he did not spare
  chosen_korean: 불쌍히 여기지 않으셨습니다
  alternatives_korean:
  - 아끼지 않으셨습니다
  - 용서하지 않으셨습니다
  - 불쌍히 여기지 않으셨습니다
  lexicon: HALOT
  rationale: חמל은 단순한 ‘아끼다’보다 자비를 베풀지 않다는 뜻이 강하므로, 심판 문맥에서 ‘불쌍히 여기지 않다’가 가장 자연스럽고 의미를 잘 드러냅니다.
- source_word: גוֹי
  english_pob_choice: a people
  chosen_korean: 한 백성
  alternatives_korean:
  - 한 나라
  - 한 민족
  - 한 백성
  lexicon: HALOT
  rationale: גוֹי는 국가 개념보다 ‘백성/민족’에 가깝고, 여기서는 심판받는 집단을 가리키므로 ‘한 백성’이 가장 무난합니다.
- source_word: חֶרֶם
  english_pob_choice: devoted to destruction
  chosen_korean: 멸망에 바쳐진
  alternatives_korean:
  - 진멸에 바쳐진
  - 저주 아래 놓인
  - 멸망에 바쳐진
  lexicon: HALOT
  rationale: חרם의 제의적·심판적 강도를 살리기 위해, 익숙한 교회어 ‘진멸’보다 의미가 더 직접 드러나는 ‘멸망에 바쳐진’을 택했습니다.
- source_word: הַנּדוֹשִׁים
  english_pob_choice: those trampled down
  chosen_korean: 짓밟힌 자들
  alternatives_korean:
  - 짓밟힌 자들
  - 짚이 되게 눌린 자들
  - 눌려 꺾인 자들
  lexicon: HALOT
  rationale: 이 형태는 ‘밟다/타작하다’ 계열의 이미지로 읽히며, 문맥상 심판 아래 짓눌린 상태를 나타내므로 ‘짓밟힌 자들’이 가장 직접적입니다.
- source_word: בַּעֲוֹנָם
  english_pob_choice: in their iniquity
  chosen_korean: 자기 죄 가운데
  alternatives_korean:
  - 그들의 죄악 가운데
  - 그들의 죄책 가운데
  - 자기 죄 가운데
  lexicon: HALOT
  rationale: עון은 단순한 실수보다 죄책과 불의의 상태를 가리키므로, 한국어에서는 자연스럽게 읽히는 ‘자기 죄 가운데’로 옮기되, 그 상태 안에 있는 심판이라는 뉘앙스를 유지했습니다.
theological_decisions:
- issue: For a wisdom-text judgment statement, whether to soften חרם into a general punishment term
  chosen_reading: 멸망에 바쳐진
  alternative_readings:
  - 진멸된
  - 저주받은
  - 멸망에 바쳐진
  rationale: 본문은 단순한 패배가 아니라 하나님 심판 아래 ‘바쳐진’ 집단을 말하므로, 제의적·법정적 긴장을 남기는 표현이 필요합니다.
  doctrine_reference: Translation philosophy §1, §5
- issue: How to represent the difficult Hebrew phrase הַנּדוֹשִׁים while keeping the Hebrew witness primary
  chosen_reading: 짓밟힌 자들
  alternative_readings:
  - 그들의 죄에서 제거된 자들
  - 죄 가운데서 제거된 자들
  - 짓밟힌 자들
  rationale: 히브리어는 ‘밟다/짓밟다’ 이미지가 강하고, 병행하는 그리스어는 의미상 유사하지만 다른 표현이므로, 본문은 히브리어 이미지를 따르고 그리스어 차이는 주석적 여지로 남깁니다.
  doctrine_reference: Translation philosophy §3; original-language primacy
