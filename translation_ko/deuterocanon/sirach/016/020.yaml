translation:
  language: ko
  text: 또한 내게도 그분은 마음을 두지 않으시고, 내 길을 누가 살피겠습니까?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גַּם
  english_pob_choice: Even
  chosen_korean: 또한
  alternatives_korean:
  - 심지어
  - 게다가
  lexicon: HALOT
  rationale: גַּם은 앞뒤 문맥에 한 항목을 덧붙이는 말이므로, 한국어에서는 단순한 나열보다 누적·첨가의 뉘앙스를 살리는 ‘또한’이 가장 자연스럽습니다.
- source_word: לֹא יָשִׂים לֵב
  english_pob_choice: will not pay attention
  chosen_korean: 마음을 두지 않으시고
  alternatives_korean:
  - 주의하지 않으시고
  - 신경 쓰지 않으시고
  - 살피지 않으시고
  lexicon: HALOT
  rationale: 히브리어 관용구 שׂים לב는 단순한 인지보다 관심과 주의를 기울이는 뜻이므로, ‘마음을 두다’가 직역성과 관용적 의미를 함께 살립니다. 문맥상 주어가 암시된 하나님을 공손히 가리켜 종결을 정중하게 맞췄습니다.
- source_word: וּבִדְרָכַי
  english_pob_choice: and my ways
  chosen_korean: 내 길을
  alternatives_korean:
  - 내 행실을
  - 내가 가는 길을
  - 내 행위를
  lexicon: HALOT
  rationale: דְּרָכִים은 삶의 행로·행실을 가리키므로, 한국어에서는 비유를 유지하되 자연스러운 ‘내 길’로 옮기는 것이 가장 직접적입니다.
- source_word: מִי יִתְבּוֹנָן
  english_pob_choice: who will consider
  chosen_korean: 누가 살피겠습니까?
  alternatives_korean:
  - 누가 생각하겠습니까?
  - 누가 헤아리겠습니까?
  - 누가 관심을 두겠습니까?
  lexicon: HALOT
  rationale: התבונן은 주의 깊게 살피고 분별하는 뜻이어서, 수사적 질문의 긴장감을 살리는 ‘살피다’가 가장 적절합니다. ‘이해하다’보다 관찰·숙고의 뉘앙스가 잘 드러납니다.
theological_decisions:
- issue: 암시된 주어의 처리
  chosen_reading: 본문의 미표현 주어를 굳이 ‘하나님’으로 드러내지 않고, 전후 문맥이 암시하는 대상은 정중한 지시로만 남겼습니다.
  alternative_readings:
  - ‘하나님은 내게 마음을 두지 않으십니다’처럼 명시화
  - ‘사람들은 내 길을 살피지 않습니다’처럼 일반화
  rationale: 히브리어는 동사의 주어를 생략한 채 부정과 질문으로 말하고 있으므로, 문맥상 이해되더라도 본문이 열어 둔 간접성을 유지하는 편이 원문에 더 충실합니다.
  doctrine_reference: 원문의 암시를 보존하고, 해석적 명시화는 최소화합니다.
