  - 자기 벗을
  lexicon: LSJ
  rationale: πλησίον은 여기서 윤리적 관계의 상대를 가리키므로, 가장 자연스럽고 직접적인 '이웃'으로 옮겼습니다.
- source_word: οὐκ ἔθλιψεν
  english_pob_choice: did not oppress
  chosen_korean: 압제하지 않았으며
  alternatives_korean:
  - 억압하지 않았으며
  - 학대하지 않았으며
  - 괴롭히지 않았으며
  lexicon: LSJ
  rationale: θλίβω는 단순한 괴로움보다 사람을 짓누르는 행위를 뜻하므로, 관계적·사회적 해악을 드러내는 '압제하다'가 적절합니다.
- source_word: οὐκ ἀπειθήσουσι
  english_pob_choice: will not disobey
  chosen_korean: 거역하지 않을 것입니다
  alternatives_korean:
  - 불순종하지 않을 것입니다
  - 말을 듣지 않을 것입니다
  lexicon: LSJ
  rationale: ἀπειθέω는 순종의 거부를 가리키므로, '거역하다'가 단순한 청취 불량보다 더 강하게 원문을 반영합니다.
- source_word: τοῦ ῥήματος αὐτοῦ
  english_pob_choice: his word
  chosen_korean: 그의 말씀을
  alternatives_korean:
  - 그의 말을
  - 그의 명령을
  lexicon: LSJ
  rationale: ῥῆμα는 말씀·말·선언을 아우르므로, 좁은 '명령'보다 넓은 의미를 보존하는 '말씀'이 적절합니다.
theological_decisions:
- issue: ἕως αἰῶνος의 부정문에서의 지속성 표현
  chosen_reading: '''영원히''를 시간 지속의 강한 부정으로 자연스럽게 살렸습니다.'
  alternative_readings:
  - '''영원까지'''
  - '''끝없이'''
  rationale: 부정문에서 'never'에 해당하는 영어 처리와 맞물리는 지속 부정을 한국어로는 '영원히'가 가장 자연스럽고 강합니다.
  doctrine_reference: 문법적 지속성 표현은 의미를 약화시키지 않고 한국어 관용에 맞춰 전달해야 합니다.
