  text: Each one did not oppress his neighbor[a], and they will never disobey his word.
  footnotes:
  - marker: a
    text: Or 'they will not be disobedient to his word.' The Greek future verb can be rendered either with an active English verb ('disobey') or a more stative expression ('be disobedient').
    reason: lexical_alternative
translation:
  language: ko
  text: 각 사람은 자기 이웃을 압제하지 않았으며, 영원히 그의 말씀을 거역하지 않을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '그의 말씀에 불순종하지 않을 것입니다.' 그리스어 미래 동사는 능동적 표현('거역하다')이나 상태적 표현('불순종하다')로 모두 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕκαστος
  english_pob_choice: Each one
  chosen_korean: 각 사람은
  alternatives_korean:
  - 각자
  - 모든 사람은
  lexicon: LSJ
  rationale: 분배적 단수의 의미를 살려 개인을 하나씩 지칭하는 표현으로 옮겼습니다.
- source_word: τὸν πλησίον αὐτοῦ
  english_pob_choice: his neighbor
  chosen_korean: 자기 이웃을
