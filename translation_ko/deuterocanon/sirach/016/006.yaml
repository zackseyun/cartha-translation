  source_fidelity: 히브리어의 대조 구조와 불의 은유는 대체로 잘 반영했습니다. 그러나 חָנֵף는 여기서 ‘불경한/경건하지 않은’이라는 종교·도덕적 성격을 가리키며, ‘하나님을 거역하는’은 그리스어의 ‘불순종하는’ 쪽에 가까운 해석적 확장입니다. 히브리어의 완료형 נִצְּתָה는 ‘불붙었습니다’로 옮겨 불붙는 은유와 완료상을 함께 드러내는 편이 좋습니다.
  naturalness: ‘회중 가운데에는’과 ‘나라 가운데에는’도 이해되지만, 현대 표준 한국어에서는 ‘회중에서는’, ‘민족에서는’이 더 간결하고 자연스럽습니다. ‘불붙었습니다’는 진노가 점화되는 원문의 비유를 자연스럽게 보존합니다.
