lexical_decisions:
- source_word: בַּעֲדַת רְשָׁעִים
  english_pob_choice: In the assembly of the wicked
  chosen_korean: 악인들의 회중 가운데에는
  alternatives_korean:
  - 악인들의 집회 가운데에는
  - 악인들의 공동체 가운데에는
  lexicon: HALOT
  rationale: בַּעֲדַת은 장소·범위의 뜻으로 쓰여 ‘가운데에’로 자연스럽게 옮기고, רְשָׁעִים은 도덕적 범주인 ‘악인들’로 직역에 가깝게 옮겼습니다.
- source_word: יוֹקֶדֶת אֵשׁ
  english_pob_choice: fire burns
  chosen_korean: 불이 타오르고
  alternatives_korean:
  - 불이 탑니다
  - 불길이 일고
  lexicon: HALOT
  rationale: יוֹקֶדֶת은 ‘활활 타다/타오르다’의 감각을 살려, 단순한 상태보다 생생한 진행상을 드러내는 ‘타오르고’로 옮겼습니다.
- source_word: חָנֵף
  english_pob_choice: godless
  chosen_korean: 하나님을 거역하는
  alternatives_korean:
  - 경건하지 않은
  - 불경한
  - 하나님을 멀리한
  lexicon: HALOT
  rationale: חָנֵף의 핵심은 단순한 무신론보다 하나님 앞의 불경·불의·배반에 있으므로, 한국어에서는 그 성격을 분명히 하는 ‘하나님을 거역하는’으로 옮겼습니다.
- source_word: נִצְּתָה חֵמָה
  english_pob_choice: wrath is kindled
  chosen_korean: 진노가 타올랐습니다
  alternatives_korean:
  - 분노가 타올랐습니다
  - 진노가 점화되었습니다
  lexicon: HALOT
  rationale: חֵמָה는 감정의 ‘분노’보다 심판적 어조가 강한 ‘진노’가 더 적절하고, נִצְּתָה는 불의 이미지에 맞춰 ‘타올랐다’로 살렸습니다.
theological_decisions:
- issue: 히브리어 חָנֵף를 ‘godless’로 읽을지, 그리스어 평행본문의 ‘disobedient’(ἀπειθεῖ) 쪽으로 옮길지
  chosen_reading: 주본문은 히브리어의 ‘하나님을 거역하는’으로 두고, 그리스어의 ‘불순종하는’ 뉘앙스는 각주로 보존합니다.
  alternative_readings:
  - 불순종하는
  - 경건하지 않은
  rationale: 이 절은 히브리어가 남아 있는 시라서 히브리어를 주도본문으로 삼되, 그리스어 평행본문이 제시하는 해석 전통도 지워지지 않도록 각주에서 보완하는 것이 원문 충실성과 감사 가능성을 함께 지키는 방식입니다.
  doctrine_reference: 'PHILOSOPHY.md: Sirach는 히브리어가 현존할 때 히브리어를 우선하되, 의미 있는 대안은 각주로 보존'
