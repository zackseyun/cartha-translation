  text: Do not desire the appearance of worthless youths[a], and do not rejoice in sons of unrighteousness.
  footnotes:
  - marker: a
    text: 'Greek: ''Do not desire a multitude of useless children, and do not rejoice in ungodly sons.'' The Hebrew witness instead speaks of the outward appearance of worthless youths.'
