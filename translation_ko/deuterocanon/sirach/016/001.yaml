translation:
  language: ko
  text: 헛된 젊은이들의 외모를 탐내지 말고, 불의의 아들들을 기뻐하지 마십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 본문은 ‘무가치한 아이들의 무리’를 말합니다. 살아 있는 히브리어 본문은 여기서 ‘헛된 젊은이들의 외모’를 말합니다.
    reason: textual_variant
lexical_decisions:
- source_word: אַל תִּתְאַוֶּה
  english_pob_choice: Do not desire
  chosen_korean: 탐내지 말고
  alternatives_korean:
  - 원하지 말고
  - 갈망하지 말고
  lexicon: HALOT
  rationale: 히트파엘 금지형의 강한 욕구를 한국어의 자연스러운 금지 표현으로 옮기되, 단순 선호보다 더 적극적인 욕망을 드러내기 위해 ‘탐내다’를 택했습니다.
- source_word: תֹּאַר
  english_pob_choice: the appearance
  chosen_korean: 외모
  alternatives_korean:
  - 모습
  - 겉모양
  - 용모
  lexicon: HALOT
  rationale: 본문은 젊은이들의 겉으로 드러나는 형상/모양을 가리키므로, 의미를 분명히 하는 표준어 ‘외모’로 옮겼습니다.
- source_word: נַעֲרֵי שָׁוְא
  english_pob_choice: worthless youths
  chosen_korean: 헛된 젊은이들
  alternatives_korean:
  - 무가치한 젊은이들
  - 헛된 청년들
  - 허망한 젊은이들
  lexicon: HALOT
  rationale: שָׁוְא의 핵심은 공허함, 헛됨, 무가치함이며, 이를 한국어 관용에 맞게 ‘헛된’으로 압축해 도덕적 평가를 보존했습니다.
- source_word: בִּבְנֵי עַוְלָה
  english_pob_choice: in sons of unrighteousness
  chosen_korean: 불의의 아들들
  alternatives_korean:
  - 불의한 아들들
  - 불의의 자식들
  - 불의의 자녀들
  lexicon: HALOT
  rationale: 히브리어의 ‘sons of X’ 구조를 유지해 관계성을 살렸고, עַוְלָה를 ‘불의’로 옮겨 도덕적·법적 일탈의 뉘앙스를 보존했습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행본문의 분기
  chosen_reading: 히브리어 본문을 본문으로 따르되, 그리스어의 ‘무가치한 아이들의 무리’라는 읽기는 주석적 대안으로만 두었습니다.
  alternative_readings:
  - 그리스어를 따라 ‘무가치한 아이들의 무리를’로 옮김
  rationale: 시락의 살아 있는 히브리어 증거가 있을 때는 이를 본문으로 삼는 프로젝트 원칙을 따르되, 그리스어 차이는 삭제하지 않고 번역 선택의 근거로 보존하는 것이 정직합니다.
  doctrine_reference: 'PHILOSOPHY.md: 히브리어가 보존된 시락은 히브리어 본문 우선 + 그리스어 변이 보존'
