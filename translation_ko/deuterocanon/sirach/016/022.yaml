  terminology: δικαιοσύνη/צדק의 문맥상 ‘의로운 일’은 자연스럽고 신학적으로 과도한 해석을 더하지 않습니다. διαθήκη는 ‘언약’으로 유지합니다. 히브리어 חוֹק의 가능한 뜻은 ‘규례/명령’으로 각주에 보존합니다.
