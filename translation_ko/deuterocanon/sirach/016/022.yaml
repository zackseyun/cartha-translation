base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/016/022.yaml
  text: Who will declare a work of righteousness[c][b][a], and who will wait for it? For the covenant is far off.
  footnotes:
  - marker: a
    text: Hebrew has a difficult text here, roughly, 'What is a deed of righteousness—who will tell it? And the hope of what...?'; the Greek parallel reads more clearly, 'Who will declare works of righteousness, and who will wait/endure? For the covenant is far off.'
    reason: textual_variant
  - marker: b
    text: Or 'works of righteousness' or 'work of justice.'
    reason: lexical_alternative
  - marker: c
    text: 'Greek: ''the covenant''; Hebrew appears to read ''statute'' or ''decree'' in the final phrase.'
    reason: alternative_reading
translation:
  language: ko
  text: 누가 의로운 일을[b] 선포하겠습니까? 또 누가 그것을 기다리겠습니까? 언약이 멀리 있기 때문입니다.[a][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 이 대목이 난해하며, 대략 ‘의의 행위가 무엇이냐—누가 그것을 말하겠느냐? 그리고 무엇의 희망이냐…?’ 정도로 읽을 수 있습니다. 그리스어 병행문은 ‘의의 일들을 누가 선포하겠느냐, 또 누가 기다리거나 견디겠느냐? 왜냐하면 언약은 멀리 있기 때문이다’라고 더 분명합니다.
    reason: textual_variant
  - marker: b
    text: 또는 ‘의의 일들’ 혹은 ‘의의 행위’.
    reason: lexical_alternative
  - marker: c
    text: 그리스어는 ‘언약’이지만, 히브리어는 마지막 구절에 ‘규례’ 또는 ‘명령’에 해당하는 말을 읽는 듯합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: מַעֲשֶׂה צֶדֶק / ἔργα δικαιοσύνης
  english_pob_choice: a work of righteousness
  chosen_korean: 의의 일
  alternatives_korean:
  - 의로운 일
  - 의의 행위
  - 의의 일들
  lexicon: HALOT; BDAG
  rationale: 히브리어와 그리스어가 모두 ‘의/의로운 행위’의 핵심을 가리키므로, 단수 뉘앙스를 살리되 한국어에서는 자연스러운 명사구인 ‘의의 일’로 옮겼습니다.
- source_word: מִי יַגִּידֶנּוּ / τίς ἀναγγελεῖ
  english_pob_choice: Who will declare
  chosen_korean: 누가 선포하겠습니까
  alternatives_korean:
  - 누가 말하겠습니까
  - 누가 알리겠습니까
  - 누가 전하겠습니까
  lexicon: HALOT; BDAG
  rationale: הגיד/ἀναγγέλλω는 단순 발화보다 공적으로 알리거나 드러내는 뜻이 강하므로, 합쇼체에서 자연스러운 ‘선포하다’를 택했습니다.
- source_word: וְתִקְוַת מָּה כִי אָצוּק חוֹק / ἢ τίς ὑπομενεῖ
  english_pob_choice: and who will wait for it
  chosen_korean: 또 누가 그것을 기다리겠습니까
  alternatives_korean:
  - 또 누가 그것을 견디겠습니까
  - 또 누가 그것을 참아 내겠습니까
  - 또 누가 그것을 바라겠습니까
  lexicon: HALOT; BDAG
  rationale: 이 절은 히브리어가 불안정하지만, 영어 POB와 그리스어 병행문의 공통 핵심인 ‘기다리다/견디다’의 의미를 따라 한국어에서는 직관적인 ‘기다리다’로 옮겼습니다.
- source_word: ἡ διαθήκη / חוֹק
  english_pob_choice: the covenant is far off
  chosen_korean: 언약은 멀기 때문입니다
  alternatives_korean:
  - 언약은 멀리 있습니다
  - 언약은 오래 지체되기 때문입니다
  - 법령은 멀기 때문입니다
  lexicon: BDAG; HALOT
  rationale: 그리스어 διαθήκη는 ‘언약’이며, 히브리어 חוֹק은 본문상 불확실하지만 POB가 채택한 그리스어 독법을 본문에 반영했습니다. ‘멀다’는 그리스어 μακράν의 직접 대응입니다.
theological_decisions:
- issue: 본문 후반의 히브리어 불안정성에 대해 그리스어 병행문의 의미를 본문에 반영할지 여부
  chosen_reading: 주본문은 그리스어가 주는 더 분명한 흐름을 따르되, 히브리어의 불확실성은 과도하게 해소하지 않았습니다.
  alternative_readings:
  - 히브리어를 따라 ‘희망’과 ‘법/명령’ 쪽을 살린 번역
  - 그리스어를 더 좁게 따라 ‘견디다’로 옮기는 번역
  rationale: 시락에서는 히브리어가 원칙적으로 우선이지만, 이 구절은 히브리어가 난해하고 병행문이 뜻을 분명히 해 주므로, 원문군 전체의 가능한 의미를 대표하는 방향으로 옮기는 것이 더 충실합니다.
  doctrine_reference: 원문 우선 원칙과 본문 비평에 대한 투명성
