  source_fidelity: 주본문은 난해한 히브리어 본문을 투명하게 처리하면서, 더 명료한 그리스어 병행문의 흐름(의로운 행위의 선포, 기다림/인내, 멀리 있는 언약)을 충실히 반영합니다. 다만 히브리어의 난해성이 절 전체와 관련됨을 각주 위치와 문구에서 더 분명히 하는 것이 좋습니다. ‘기다리다’는 그리스어 ὑπομενεῖ의 가능한 번역이며, ‘견디다’라는 대안은 각주 a에서 제시한 그리스어 인용에 병기하는 편이 적절합니다.
