base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/016/021.yaml
  text: If I have sinned, no eye sees me; or if I lie, who knows it in every hiding place?
  footnotes:
  - marker: a
    text: The Greek parallel differs substantially here, reading in part that many of his works are in hidden places. The Hebrew witness is followed as the main text because it survives for this verse and is the primary source for Sirach where extant.
    reason: textual_variant
  - marker: b
    text: Or 'in every secret place.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 죄를 지었다면 눈이 나를 보지 못합니다. 또는 내가 거짓말한다면, 누가 모든 은밀한 곳에서 알겠습니까?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 병행본은 여기에서 크게 다르며, 일부는 ‘그의 많은 일들이 숨은 곳에 있다’는 뜻을 보입니다. 본문이 남아 있는 히브리어를 주본문으로 따랐습니다.
    reason: textual_variant
  - marker: b
    text: 또는 ‘모든 비밀한 곳에서’.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם חָטָאתִי
  english_pob_choice: If I have sinned
  chosen_korean: 내가 죄를 지었다면
  alternatives_korean:
  - 내가 죄를 지었으면
  - 내가 죄를 범했다면
  lexicon: HALOT
  rationale: 조건문으로서의 אִם과 완료형 חָטָאתִי를 살려 가정적 의미를 자연스러운 한국어로 옮겼습니다.
- source_word: לֹא תִרְאֵנִי עָיִן
  english_pob_choice: no eye sees me
  chosen_korean: 눈이 나를 보지 못합니다
  alternatives_korean:
  - 아무도 나를 보지 못합니다
  - 한 눈도 나를 보지 못합니다
  lexicon: HALOT
  rationale: 히브리어의 구체적 이미지인 ‘눈’을 유지하되, 한국어에서는 부정 가능성을 자연스럽게 풀어 ‘보지 못합니다’로 옮겼습니다.
- source_word: בְּכָל סֵתֶר
  english_pob_choice: in every hiding place
  chosen_korean: 모든 은밀한 곳에서
  alternatives_korean:
  - 모든 숨은 곳에서
  - 모든 비밀한 곳에서
  - 모든 숨은 자리에서
  lexicon: HALOT
  rationale: סֵתֶר의 ‘숨겨진/은밀한 장소’ 의미를 살리면서, 한국어에서 가장 자연스럽고 문어적인 표현으로 처리했습니다.
- source_word: מִי יוֹדֵעַ
  english_pob_choice: who knows it
  chosen_korean: 누가 ... 알겠습니까
  alternatives_korean:
  - 누가 알겠습니까
  - 누가 그것을 알겠습니까
  lexicon: HALOT
  rationale: 문맥상 숨은 거짓을 가리키는 대상을 한국어에서는 중복 지시어 없이 자연스럽게 처리해 질문의 수사성을 살렸습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행본이 크게 다른 Sirach 16:21의 본문 우선순위
  chosen_reading: 현존하는 히브리어 본문을 본문으로 따르고, 그리스어는 ‘숨겨짐’이라는 의미 범위만 확인하는 보조 자료로 사용했습니다.
  alternative_readings:
  - 그리스어에 따라 하나님의 숨은 행위를 강조하는 번역
  - 두 전승을 절충한 혼합 번역
  rationale: 이 절은 히브리어 증거가 남아 있고 본문이 분명하므로, 그리스어의 다른 문장을 본문으로 대체하지 않고 히브리어를 중심으로 번역하는 것이 소스-일치적입니다.
  doctrine_reference: 'PHILOSOPHY.md: Sirach는 현존 히브리어를 우선하고 그리스어는 보조적으로 참조'
