  rationale: 존재구조를 한국어에서 가장 자연스럽게 살리기 위해 '보상이 있습니다'로 옮겼고, שָׂכָר의 보상 의미를 유지했습니다.
- source_word: ἕκαστος κατὰ τὰ ἔργα αὐτοῦ εὑρήσει
  english_pob_choice: each person will find it according to his works
  chosen_korean: 누구나 자기 행위에 따라 그것을 찾게 될 것입니다
  alternatives_korean:
