base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/016/014.yaml
  text: For every act of righteousness there is a reward; each person will find it according to his works[a][b].
  footnotes:
  - marker: a
    text: 'Hebrew reads ''Everyone who does righteousness has a reward'' (or, more literally, ''Every doer of righteousness—there is for him a reward''). The Greek parallel is fuller: ''for every almsgiving/merciful deed ... each will find according to his works.'''
    reason: textual_variant
  - marker: b
    text: Greek ἐλεημοσύνη can mean 'almsgiving' or more broadly a merciful deed; the Hebrew witness has 'righteousness.'
    reason: lexical_alternative
translation:
  language: ko
  text: 누구든지 의를 행하는 사람은 보상이 있습니다. 누구나 자기 행위에 따라 그것을 찾게 될 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 “의를 행하는 모든 사람에게는 보상이 있다”는 더 짧은 형태로 읽을 수 있으며, 그리스어 병행문은 “자선/자비의 행위”와 “자기 행위에 따라”라는 더 긴 분절을 보입니다.
    reason: textual_variant
  - marker: b
    text: 그리스어 ἐλεημοσύνη는 ‘자선’ 또는 더 넓게 ‘자비로운 행위’를 뜻할 수 있습니다. 히브리어 본문은 צְדָקָה, 곧 ‘의’를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הָעֹשֶׁה
  english_pob_choice: every act / everyone who does
  chosen_korean: 누구든지 … 하는 사람은
  alternatives_korean:
  - 모든 … 하는 이는
  - 의를 행하는 모든 사람은
  lexicon: HALOT
  rationale: 히브리어의 분포적 표현을 한국어에서 자연스럽게 살리기 위해 '누구든지'를 사용해 행위자 중심으로 옮겼습니다.
- source_word: צְדָקָה
  english_pob_choice: righteousness
  chosen_korean: 의를 행하다
  alternatives_korean:
  - 자선을 베풀다
  - 공의를 행하다
  lexicon: HALOT
  rationale: 주본문은 히브리어의 צְדָקָה를 따르므로 '의'를 택했습니다. 그리스어 병행문의 '자선/자비의 행위' 뉘앙스는 본문이 아니라 주석으로만 반영합니다.
- source_word: יִשׁ לוֹ שָׂכָר
  english_pob_choice: there is a reward
  chosen_korean: 보상이 있습니다
  alternatives_korean:
  - 그에게 보상이 있습니다
  - 삯이 있습니다
  lexicon: HALOT
  rationale: 존재구조를 한국어에서 가장 자연스럽게 살리기 위해 '보상이 있습니다'로 옮겼고, שָׂכָר의 보상 의미를 유지했습니다.
- source_word: ἕκαστος κατὰ τὰ ἔργα αὐτοῦ εὑρήσει
  english_pob_choice: each person will find it according to his works
  chosen_korean: 누구나 자기 행위에 따라 그것을 찾게 될 것입니다
  alternatives_korean:
  - 각 사람은 자기 행위에 따라 찾게 될 것입니다
  - 각 사람은 자기 행위대로 받게 될 것입니다
  lexicon: BDAG
  rationale: 그리스어 병행문이 본문에 포함된다고 본 영어 POB의 판단을 따라, '자기 행위에 따라'라는 대응을 분명히 하되 한국어로는 과도한 직역을 피했습니다.
theological_decisions:
- issue: 히브리어 צְדָקָה를 '의'로 둘지, 그리스어 ἐλεημοσύνη의 '자선/자비의 행위'로 풀지 여부
  chosen_reading: 본문은 '의를 행하는 사람'으로 옮기고, 그리스어의 자비/자선 뉘앙스는 본문에 흡수하지 않았습니다.
  alternative_readings:
  - 자선을 베푸는 사람
  - 자비로운 일을 하는 사람
  rationale: 현존 히브리어가 주요 증거이므로 그 의미를 우선했습니다. 다만 병행 그리스어가 더 구체적인 행위 의미를 시사하므로, 본문을 흐리지 않도록 주석적 수준에서만 고려했습니다.
  doctrine_reference: 'DOCTRINE.md: Original-language primacy over translation tradition; Preserve theological tension rather than resolve it.'
- issue: 그리스어의 추가 분절 '각 사람은 자기 행위에 따라 찾을 것이다'를 본문에 포함할지 여부
  chosen_reading: 포함했습니다.
  alternative_readings:
  - 히브리어에 따라 첫 절만 번역
  - 그리스어 분절을 각주로만 처리
  rationale: 히브리어 전승에 결락/불일치가 표시되어 있고, 그리스어 병행문이 잠언체의 대구를 더 완전하게 보존하므로 본문에 반영하는 편이 자료의 전체 증거를 더 잘 드러냅니다.
  doctrine_reference: 'PHILOSOPHY.md: use parallel source as actual translation input; preserve source uncertainty honestly.'
