base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/016/014.yaml
  text: For every act of righteousness there is a reward; each person will find it according to his works[a][b].
  footnotes:
  - marker: a
    text: 'Hebrew reads ''Everyone who does righteousness has a reward'' (or, more literally, ''Every doer of righteousness—there is for him a reward''). The Greek parallel is fuller: ''for every almsgiving/merciful deed ... each will find according to his works.'''
    reason: textual_variant
  - marker: b
    text: Greek ἐλεημοσύνη can mean 'almsgiving' or more broadly a merciful deed; the Hebrew witness has 'righteousness.'
    reason: lexical_alternative
translation:
  language: ko
  text: 의를 행하는 모든 사람에게는 보상이 있습니다. 각 사람은 자기 행위에 따라 그것을 찾게 될 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 현존 히브리어 본문은 “의를 행하는 모든 사람에게는 보상이 있다”라는 더 짧은 한 절입니다. 그리스어 병행문은 “자선/자비로운 행위”와 “각 사람은 자기 행위에 따라 찾게 될 것이다”를 포함하는 더 긴 형태를 보입니다.
    reason: textual_variant
  - marker: b
    text: 그리스어 ἐλεημοσύνη는 ‘자선’ 또는 더 넓게 ‘자비로운 행위’를 뜻할 수 있습니다. 히브리어 본문은 צְדָקָה, 곧 ‘의’를 가리킵니다.
    reason: lexical_alternative
