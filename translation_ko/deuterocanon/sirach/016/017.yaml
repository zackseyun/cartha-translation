translation:
  language: ko
  text: “내가 하나님에게서 숨겨졌다고 말하지 마십시오. 높은 곳에서 누가 나를 기억하겠습니까? 많은 백성 가운데서 나는 알려지지 않을 것이며, 내 생명이 바람의 끝들과 모든 사람들 사이에서 무엇이겠습니까?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 여기서 ‘측량할 수 없는 창조 가운데서’로 읽으며, 이는 다른 저본이나 난해한 히브리어 구절에 대한 해석적 옮김일 가능성이 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תֹּאמַר
  english_pob_choice: Do not say
  chosen_korean: “말하지 마십시오”
  alternatives_korean:
  - “스스로 말하지 마십시오”
  - “결코 말하지 마십시오”
  lexicon: HALOT
  rationale: 직설적 금지 명령이므로 현대 합쇼체로 간단하고 분명하게 옮겼습니다.
- source_word: מֵאֵל נִסְתַּרְתִּי
  english_pob_choice: I am hidden from God
  chosen_korean: “하나님에게서 숨겨졌다고”
  alternatives_korean:
  - “하나님에게서 감추어졌다고”
  - “하나님에게서 숨었다고”
  lexicon: HALOT
  rationale: 화자가 하나님 앞에서 보이지 않게 되었다는 잘못된 인식을 그대로 살리기 위해 수동적 의미를 유지했습니다.
- source_word: בְּעַם כָּבֵד
  english_pob_choice: In a great people
  chosen_korean: “많은 백성 가운데서”
  alternatives_korean:
  - “큰 백성 가운데서”
  - “수많은 백성 가운데서”
  lexicon: HALOT
  rationale: כָּבֵד의 ‘무게 있음’이 여기서는 다수성/중대함으로 쓰인 것으로 보이므로, 한국어에서는 자연스럽게 ‘많은’으로 풀어 옮겼습니다.
- source_word: וּמַה נַפְשִׁי
  english_pob_choice: and what is my life
  chosen_korean: “내 생명이 무엇이겠습니까?”
  alternatives_korean:
  - “내 영혼이 무엇이겠습니까?”
  - “내 존재가 무엇이겠습니까?”
  lexicon: HALOT
  rationale: נֶפֶשׁ을 문맥상 ‘생명’으로 옮겨 인물의 미미함을 드러내는 질문 구조를 자연스럽게 살렸습니다.
- source_word: כְּקַצּוֹת רוּחוֹת
  english_pob_choice: among the ends of the winds
  chosen_korean: “바람의 끝들과”
  alternatives_korean:
  - “바람들의 끝에서”
  - “바람의 지경에서”
  lexicon: HALOT
  rationale: 히브리어의 난해한 우주적 이미지를 너무 평탄하게 풀지 않고, 원문의 낯선 비유를 한국어에서도 남겼습니다.
