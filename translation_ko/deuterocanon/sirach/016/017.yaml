  chosen_reading: 본문에는 히브리어의 ‘바람의 끝들’ 이미지를 유지했습니다.
  alternative_readings:
  - 그리스어처럼 ‘측량할 수 없는 창조 가운데서’
  - 의역하여 ‘광대한 피조 세계 속에서’
  rationale: 시라서는 히브리어 본문이 남아 있는 경우 그 증거를 우선하되, 어려운 표현을 임의로 해소하지 않는 것이 소스 투명성에 더 부합합니다.
  doctrine_reference: 'PHILOSOPHY.md: 히브리어가 존속하는 시라서는 히브리어 본문 우선; DOCTRINE.md: 해석상의 긴장을 은폐하지 말 것.'
