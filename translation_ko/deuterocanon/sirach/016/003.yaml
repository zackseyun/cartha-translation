base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/016/003.yaml
  text: Do not trust in their life[a], and do not rely on their future; for one who does what is pleasing is better than a thousand[c][b], and to die childless than to have many children in unrighteousness and a lawless end.
  footnotes:
  - marker: a
    text: 'Greek: ''do not fix on their place'' or ''do not rely on their position,'' where the Hebrew reads ''their future/outcome.'''
    reason: textual_variant
  - marker: b
    text: Or 'one who does the will'; the Hebrew likely implies doing what is pleasing to God, though 'to God' is not explicit.
    reason: lexical_alternative
  - marker: c
    text: The final phrase may also be understood as 'than from a presumptuous/wicked end.' The Hebrew wording is compressed and somewhat difficult, but it contrasts childless death with many children marked by wrongdoing and a bad end.
    reason: alternative_reading
translation:
  language: ko
  text: 그들의 생명을 믿지 말며, 그들의 미래를 의지하지 마십시오. 그들이 좋은 끝을 맞지 못할 것이기 때문입니다. 선을 행하는 한 사람은 천 사람보다 낫고, 불의 가운데 많은 자녀를 두고 법less한 끝을 맞는 것보다 자식 없이 죽는 것이 더 낫습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 ‘그들의 자리를 바라보지 말라’로 읽으며, 히브리어는 ‘그들의 미래/결과’로 읽힙니다.
    reason: textual_variant
  - marker: b
    text: ‘선을 행하는’은 ‘하나님의 뜻을 행하는’으로도 옮길 수 있으나, 원문은 목적어를 명시하지 않습니다.
    reason: lexical_alternative
  - marker: c
    text: 마지막 구는 ‘무법한 끝’ 또는 ‘교만하고 악한 끝’으로도 이해될 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תַּאֲמִין
  english_pob_choice: Do not trust
  chosen_korean: 믿지 말십시오
  alternatives_korean:
  - 신뢰하지 마십시오
  - 믿어 두지 마십시오
  lexicon: HALOT
  rationale: 히브리어 אמן의 히필은 여기서 인지적 동의보다 의지의 신뢰를 가리키므로, 한국어에서는 경계 명령으로 자연스러운 ‘믿지 말십시오’를 택했습니다.
- source_word: בְּחַיֵּיהֶם
  english_pob_choice: in their life
  chosen_korean: 그들의 생명
  alternatives_korean:
  - 그들의 삶
  - 그들의 목숨
  lexicon: HALOT
  rationale: 문맥상 악인/불의한 자의 번영 자체를 가리키는 관용이므로, 현대 한국어에서 가장 간결하게 ‘그들의 생명’으로 옮겼습니다.
- source_word: בְּעִקְבוֹתָם
  english_pob_choice: their future
  chosen_korean: 그들의 미래
  alternatives_korean:
  - 그들의 결과
  - 그들의 끝
  - 그들의 발자취
  lexicon: HALOT
  rationale: 직역상 ‘뒤에 오는 것/결과’의 의미가 있어 문맥의 뒤따르는 진술과 함께 ‘미래’가 가장 자연스럽고, POB의 선택도 이 방향을 따릅니다.
- source_word: עוֹשֶׂה רָצוֹן
  english_pob_choice: who does what is pleasing
  chosen_korean: 선을 행하는
  alternatives_korean:
  - 기쁘신 뜻을 행하는
  - 마땅한 일을 하는
  lexicon: HALOT
  rationale: רָצוֹן은 여기서 하나님께 기쁘신 것/받으실 만한 것을 뜻하지만 대상이 명시되지 않으므로, 본문에 없는 ‘하나님’을 덧붙이지 않고 도덕적·종교적 함의를 살린 표현을 택했습니다.
- source_word: עֲרִירִי
  english_pob_choice: childless
  chosen_korean: 자식 없이
  alternatives_korean:
  - 무자식으로
  - 자녀 없이
  lexicon: HALOT
  rationale: אין בנים의 상태를 가리키는 단어로, 현대 한국어에서는 자연스럽고 직접적인 ‘자식 없이’가 가장 분명합니다.
- source_word: זָדוֹן
  english_pob_choice: lawless
  chosen_korean: 법less한
  alternatives_korean:
  - 방자한
  - 거만한
  - 불법한
  lexicon: HALOT
  rationale: 의도는 교만한 불순종과 악을 가리키므로 ‘법less한’은 오타가 아닌 어색한 혼성어가 되어 부적절합니다. 따라서 한국어 출판문장으로는 ‘법 없는’보다 의미상 더 자연스러운 ‘불법한’ 계열이 필요합니다.
theological_decisions:
- issue: רָצוֹן의 대상이 명시되지 않음
  chosen_reading: ‘선을 행하는’으로 옮겨, ‘하나님께’ 같은 목적어를 본문에 삽입하지 않았습니다.
  alternative_readings:
  - 하나님의 뜻을 행하는
  - 하나님을 기쁘시게 하는
  rationale: 지혜문맥상 신적 함의가 강하지만, 원문은 대상을 생략하므로 한국어 본문에서도 그 긴장을 보존하는 편이 소스에 더 충실합니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
- issue: 불의한 자녀와 ‘lawless end’의 강한 가치판단
  chosen_reading: 자녀가 많더라도 불의와 무법의 끝을 맞는 것은 더 나쁘다는 날것의 비교를 그대로 유지했습니다.
  alternative_readings:
  - 불의한 자녀가 많은 것보다 자식 없이 죽는 것이 낫습니다
  - 불경건한 자녀를 두기보다 자식 없이 죽는 것이 낫습니다
  rationale: 이 구절은 현대적 완곡어법으로 약화하기보다, 지혜문학 특유의 급진적 가치판단을 그대로 드러내는 것이 중요합니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
