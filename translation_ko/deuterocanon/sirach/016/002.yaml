translation:
  language: ko
  text: 그들이 아무리 많아져도 그들로 인해 기뻐하지 마십시오. 야훼를 경외함이 그들과 함께하지 않으면 말입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 표현은 다소 불투명하지만, 그리스어 평행문은 ‘기뻐하다/즐거워하다’의 뜻을 분명히 뒷받침합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּרוּ / πληθύνωσιν
  english_pob_choice: they become many
  chosen_korean: 많아져도
  alternatives_korean:
  - 늘어나도
  - 번성해도
  lexicon: HALOT; LXX parallel
  rationale: 수적 증가를 자연스럽게 살리면서, 원문의 조건적 뉘앙스를 한국어로 간결하게 전달합니다.
- source_word: אַל תָּבֻעַ בָּם / μὴ εὐφραίνου ἐπʼ αὐτοῖς
  english_pob_choice: do not delight in them
  chosen_korean: 그들로 인해 기뻐하지 마십시오
  alternatives_korean:
  - 그들을 기뻐하지 마십시오
  - 그들 때문에 즐거워하지 마십시오
  lexicon: HALOT; BDAG
  rationale: 히브리어의 불분명한 표현을 그리스어 평행문의 ‘기뻐하다/즐거워하다’ 의미로 반영하고, 한국어에서는 관계를 드러내는 ‘그들로 인해’가 자연스럽습니다.
- source_word: יִרְאַת יְהֹוָה / φόβος Κυρίου
  english_pob_choice: the fear of Yahweh
  chosen_korean: 야훼를 경외함
  alternatives_korean:
  - 야훼에 대한 두려움
  - 야훼 경외
  lexicon: HALOT; BDAG
  rationale: 지혜문학의 관용구를 살리되, 한국어에서는 ‘두려움’보다 하나님을 향한 경외의 태도를 드러내는 ‘경외함’이 더 적절합니다.
- source_word: יְהֹוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 프로젝트의 표준을 따라 신명은 ‘야훼’로 옮겼습니다.
theological_decisions:
- issue: ‘fear of Yahweh’ idiom in wisdom literature
  chosen_reading: ‘야훼를 경외함’이라는 지혜문학적 관용구를 유지했습니다.
  alternative_readings:
  - ‘야훼에 대한 두려움’
  - ‘야훼를 공경함’
  rationale: 이 구절은 단순한 감정 상태가 아니라 지혜와 신실함의 표지로서의 경외를 말하므로, 관용구를 약화시키지 않았습니다.
  doctrine_reference: 'DOCTRINE.md: YHWH 표기 및 지혜문학 어휘 원칙'
