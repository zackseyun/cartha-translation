translation:
  language: ko
  text: 제 말을 들으십시오. 제 통찰을 받아들이십시오.[a] 제 말에 마음을 기울이십시오.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 평행본문은 “내 말을 들으라, 아이야, 그리고 지식을 배우라”로 읽습니다. 히브리어 전승에는 ‘아이야’가 없고 ‘나의 통찰을 받아들이라’고 되어 있습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어는 문자적으로 “내 말들에 마음을 두라”는 관용구를 사용합니다. 그리스어도 “마음으로 내 말에 주의를 기울이라”로 읽습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ אֵלַי
  english_pob_choice: Listen to me
  chosen_korean: 제 말을 들으십시오
  alternatives_korean:
  - 저에게 들으십시오
  - 제게 귀를 기울이십시오
  lexicon: HALOT
  rationale: שמע의 명령형 복수는 단순 청취보다 권면에 대한 응답을 포함하므로, 현대 합쇼체로 자연스럽고 직접적인 ‘제 말을 들으십시오’로 옮겼습니다.
- source_word: וּקְחוּ שִׂכְלִי
  english_pob_choice: receive understanding
  chosen_korean: 이해를 받으시고
  alternatives_korean:
  - 분별을 받으시고
  - 깨달음을 받으시고
  - 지혜를 얻으시고
  lexicon: HALOT
  rationale: שכל은 지적 통찰과 분별을 가리키므로, POB의 ‘understanding’을 따라 ‘이해’로 옮겼습니다. 문맥상 ‘받다’는 가르침을 수용하라는 뜻을 자연스럽게 드러냅니다.
- source_word: וְעַל דְבָרַי
  english_pob_choice: to my words
  chosen_korean: 제 말에
  alternatives_korean:
  - 제 말씀에
  - 제 말들을
  - 제 말 위에
  lexicon: HALOT
  rationale: דברים은 ‘말씀/말’의 일반적 의미이므로, 평행구 전체를 자연스럽게 살려 ‘제 말에’로 옮겼습니다.
- source_word: שִׂימוּ לֵב
  english_pob_choice: pay attention in your heart
  chosen_korean: 마음을 기울이십시오
  alternatives_korean:
  - 마음을 두십시오
  - 마음에 새기십시오
  - 마음을 다하십시오
  lexicon: HALOT
  rationale: 직역하면 ‘마음을 두다/놓다’의 관용구지만, 한국어에서 가장 자연스럽게 ‘내면의 주의를 기울이다’라는 의미를 살리는 표현은 ‘마음을 기울이다’입니다. ‘heart’를 명시적으로 반복하지는 않되, 히브리어의 내면 지향을 충분히 보존합니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 평행본문의 ‘child’ 유무
  chosen_reading: 본문은 히브리어에 따라 ‘제 말을 들으십시오…’로 두고, ‘child’는 본문에 넣지 않았습니다.
  alternative_readings:
  - 아들아, 제 말을 들으십시오…
  - 자녀여, 제 말을 들으십시오…
  rationale: 히브리어 증거에 명시적 호칭이 없으므로, POB 원칙에 따라 मुख्य 본문은 히브리어를 따랐습니다. 그리스어 τέκνον의 친자적/훈계적 뉘앙스는 본문에 덧붙이지 않고 보존 가능한 변이로 다루는 편이 더 투명합니다.
  doctrine_reference: 원어 우선 원칙과 본문 증거 간 긴장 보존
- issue: ‘heart’의 현시 여부
  chosen_reading: ‘마음을 기울이십시오’로 내면 기관을 직접 언급하지는 않지만, heart의 의미를 기능적으로 보존했습니다.
  alternative_readings:
  - 마음에 주의를 기울이십시오
  - 마음에 두십시오
  - 마음으로 살피십시오
  rationale: 히브리어 לֵב는 단순 감정이 아니라 사고와 판단의 중심을 가리키므로, 한국어에서 가장 자연스러운 기능 대응인 ‘마음을 기울이다’로 옮겨 내면적 주의의 요구를 살렸습니다.
  doctrine_reference: 성서적 인간 이해(마음/내면의 사고 중심)
