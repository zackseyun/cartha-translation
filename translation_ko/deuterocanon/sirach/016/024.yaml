- from: 제 말을 들으십시오. 이해를 받으시고, 제 말에 마음을 기울이십시오.[a][b]
  to: 제 말을 들으십시오. 제 통찰을 받아들이십시오.[a] 제 말에 마음을 기울이십시오.[b]
  rationale: 히브리어 본문을 우선하여, שִׂכְלִי의 1인칭 소유격을 ‘제 통찰’에 반영했습니다. ‘받아들이십시오’는 물리적으로 받는 뜻이 아니라 가르침을 수용하라는 권면을 자연스럽게 나타냅니다. 히브리어와 그리스어 모두에 명시된 ‘마음’을 본문에 유지했으며, 그리스어에만 있는 ‘아이야’와 ‘지식을 배우라’는 각주로만 제시했습니다. 각주 표지도 해당 어구 바로 뒤로 옮겼습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T19:15:14Z'
