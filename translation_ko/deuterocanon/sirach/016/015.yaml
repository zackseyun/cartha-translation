translation:
  language: ko
  text: 야훼께서 파라오의 마음을 굳게 하셨습니다[a]. 그는 그분을 알지 못했지만, 그의 행위는 하늘 아래에 드러나 있기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '그리스어 평행문: ‘나는 주님에게서 숨겨질 것이다’라고 말하지 마십시오. 이 그리스어 증언은 현존 히브리어 본문과 상당히 달라, 다른 본문형 또는 절 대응을 시사합니다.'
    reason: textual_variant
