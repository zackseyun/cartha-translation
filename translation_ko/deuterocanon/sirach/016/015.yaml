translation:
  language: ko
  text: 야훼께서 파라오의 마음을 완고하게 하셨습니다. 파라오는 그분을 알지 못했지만, 그의 행위는 하늘 아래에 드러나 있기 때문입니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '그리스어 평행문: ‘나는 주님에게서 숨겨질 것이다’라고 말하지 마십시오. 이 그리스어 증언은 현존 히브리어 본문과 상당히 달라, 다른 본문형 또는 절 대응을 시사합니다.'
    reason: textual_variant
lexical_decisions:
- source_word: יְהֹוָה
  english_pob_choice: the LORD
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: HALOT
  rationale: 이 프로젝트의 기본 용례에 따라 신명은 음역형 야훼로 옮겨, Hebrew 본문의 직접성을 유지했습니다.
- source_word: הִקְשָׁה
  english_pob_choice: hardened
  chosen_korean: 굳게 하셨습니다
  alternatives_korean:
  - 완고하게 하셨습니다
  - 강퍅하게 하셨습니다
  lexicon: HALOT
  rationale: 파라오 전승의 상호본문적 울림은 살리되, 현대 한국어에서 자연스러운 동사구로 ‘굳게 하다’를 택했습니다.
- source_word: לֵב
  english_pob_choice: heart
  chosen_korean: 마음
  alternatives_korean:
  - 심장
  - 가슴
  lexicon: HALOT
  rationale: 히브리어 ‘heart’는 사고와 의지의 중심을 뜻하므로, 한국어 성경 문맥에서 가장 자연스러운 ‘마음’으로 옮겼습니다.
- source_word: תַּחַת הַשָּׁמַיִם
  english_pob_choice: under heaven
  chosen_korean: 하늘 아래
  alternatives_korean:
  - 하늘 아래에서
  - 하늘 아래에
  lexicon: HALOT
  rationale: 히브리어 관용구를 직역에 가깝게 살리면서도 한국어 문장 흐름에 맞는 표현으로 다듬었습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 평행문의 차이
  chosen_reading: 본문은 현존 히브리어를 따라 번역하고, 그리스어가 보존하는 ‘주님에게서 숨겨질 것이다’라는 다른 전승은 각주로 처리했습니다.
  alternative_readings:
  - 그리스어에 따라 ‘나는 주님에게서 숨겨질 것이다’로 옮김
  rationale: 시락서는 히브리어가 남아 있을 때 이를 우선하되, 제공된 그리스어가 실질적으로 다른 문형을 보여 주므로 본문과 별도로 투명하게 기록해야 합니다.
  doctrine_reference: 'PHILOSOPHY.md: Translate Sirach from Hebrew where extant; note Greek parallel as divergent textual witness.'
