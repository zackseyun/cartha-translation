  chosen_reading: 본문은 현존 히브리어를 따라 번역하고, 그리스어가 보존하는 ‘주님에게서 숨겨질 것이다’라는 다른 전승은 각주로 처리했습니다.
  alternative_readings:
  - 그리스어에 따라 ‘나는 주님에게서 숨겨질 것이다’로 옮김
  rationale: 시락서는 히브리어가 남아 있을 때 이를 우선하되, 제공된 그리스어가 실질적으로 다른 문형을 보여 주므로 본문과 별도로 투명하게 기록해야 합니다.
