  text: He ordered his works forever[a], and their beginnings for their generations; they neither hungered nor grew weary, and they did not cease from their works.
  footnotes:
  - marker: a
    text: Or 'their beginnings for their generations.' The Greek word can mean 'beginnings' or 'ruling domains'; the context favors assigned spheres of rule or function within creation.
    reason: lexical_alternative
translation:
  language: ko
  text: 그분은 자신의 일들을 영원토록 질서 지으셨고, 그들의 권세를 그들의 세대에 이르기까지 정하셨습니다.[a] 그들은 굶주리지도 지치지도 않았고, 자기들의 일을 그만두지도 않았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 시작들을 그들의 세대에 이르기까지’. 그리스어 ἀρχάς는 ‘시작들’을 뜻할 수도 있고, 문맥상 ‘권세들’ 또는 ‘통치 영역들’을 뜻할 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκόσμησεν
  english_pob_choice: ordered
  chosen_korean: 질서 있게 하셨고
  alternatives_korean:
  - 정돈하셨고
  - 질서를 두셨고
  - 배열하셨고
  lexicon: LSJ
  rationale: 우주적 맥락에서 단순한 장식이 아니라 질서 부여를 뜻하므로, 하나님이 창조 질서를 세우신 의미를 살려 번역했습니다.
- source_word: τὰ ἔργα αὐτοῦ
  english_pob_choice: his works
  chosen_korean: 자신의 일들을
  alternatives_korean:
  - 그의 작품들을
  - 그의 일들을
  - 그가 만드신 것들을
  lexicon: LSJ
  rationale: 창조된 세계를 가리키는 넓은 표현이므로, 문맥의 창조 질서를 유지하면서도 자연스러운 한국어로 옮겼습니다.
- source_word: τὰς ἀρχὰς αὐτῶν
  english_pob_choice: their dominions
  chosen_korean: 그들의 지위들을
  alternatives_korean:
  - 그들의 시작들을
  - 그들의 영역들을
  - 그들의 통치권들을
  lexicon: LSJ
  rationale: ἀρχαί는 ‘시작’뿐 아니라 ‘통치권/지위/권한’도 뜻하므로, 이어지는 문맥의 지속적 기능을 반영해 ‘지위들’로 옮겼습니다.
- source_word: οὔτε ἐπείνασαν οὔτε ἐκοπίασαν
  english_pob_choice: they neither hungered nor grew weary
  chosen_korean: 그들은 굶주리지도 않았고, 지치지도 않았으며
  alternatives_korean:
  - 그들은 배고프지도 피곤하지도 않았으며
  - 그들은 굶주리지도 피곤하지도 않았으며
  - 그들은 허기지지도 지치지도 않았으며
  lexicon: LSJ
  rationale: 평행 구조를 살리면서도 현대 한국어에서 자연스럽고 강한 부정의 대조를 드러내기 위해 ‘굶주리다/지치다’를 사용했습니다.
- source_word: οὐκ ἐξέλιπον ἀπὸ τῶν ἔργων αὐτῶν
  english_pob_choice: did not cease from their works
  chosen_korean: 자신의 일에서 그치지도 않았습니다
  alternatives_korean:
  - 자신의 일에서 멈추지도 않았습니다
  - 자신의 일에서 물러서지도 않았습니다
  - 자신의 일들을 중단하지도 않았습니다
  lexicon: LSJ
  rationale: ἐκλείπω는 ‘그치다, 중단하다’의 뜻이 있으므로, ‘그치다’로 번역해 지속적 수행을 강조했습니다.
theological_decisions:
- issue: ἀρχαί의 의미를 ‘시작’으로만 볼지, 창조 질서 안의 위임된 자리로 볼지
  chosen_reading: 하나님이 창조된 존재들에게 그들의 역할과 자리를 부여해 두신 것으로 읽었습니다.
  alternative_readings:
  - 그들의 시작들이 세대마다 지속된다는 뜻으로 읽을 수 있습니다.
  rationale: 앞절의 창조 질서와 뒤절의 계속되는 활동이 연결되므로, 단순한 기원보다 위임된 기능과 위치를 가리키는 읽기가 문맥에 더 잘 맞습니다.
  doctrine_reference: 창조 질서와 섭리
