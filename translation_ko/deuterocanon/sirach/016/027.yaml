revisions:
- from: 그분은 자신의 일들을 영원히 질서 있게 하셨고, 그들의 지위들을 그들의 세대들을 위해 두셨습니다. 그들은 굶주리지도 않았고, 지치지도 않았으며, 자신의 일에서 그치지도 않았습니다.[a]
  to: 그분은 자신의 일들을 영원토록 질서 지으셨고, 그들의 권세를 그들의 세대에 이르기까지 정하셨습니다.[a] 그들은 굶주리지도 지치지도 않았고, 자기들의 일을 그만두지도 않았습니다.
  rationale: 시간 표현의 의미를 바로잡고, 활동 주체와 그들의 일을 가리키는 한국어 지시를 자연스럽게 했습니다. ἀρχάς의 문맥상 ‘권세’라는 본문 번역은 유지하되, 논쟁 가능한 ‘시작들’의 독해를 각주에 남겼습니다.
