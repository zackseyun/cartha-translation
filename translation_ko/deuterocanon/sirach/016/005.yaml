  text: My eye has seen many such things[a], and my ear has heard things as mighty as these.
  footnotes:
  - marker: a
    text: Or 'stronger than these' or 'greater than these'; the Hebrew עַצֻּמוֹת and Greek ἰσχυρότερα both point to things surpassing these in strength or impressiveness.
    reason: lexical_alternative
translation:
  language: ko
  text: 내 눈은 이런 많은 것들을 보았고, 내 귀는 이보다 더 강한 것들을 들었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이보다 더 강한 것들’ / ‘이보다 더 큰 것들’. 히브리어 עַצֻּמוֹת와 그리스어 ἰσχυρότερα는 강도나 위력의 비교를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַבּוֹת כָּאֵלֶּה
  english_pob_choice: many such things
  chosen_korean: 이런 많은 것들
  alternatives_korean:
  - 많은 이런 것들
  - 그런 많은 일들
  - 이와 같은 많은 것들
  lexicon: HALOT
  rationale: רַבּוֹת + כָּאֵלֶּה는 단순한 수량이 아니라 ‘이와 같은 것들’을 가리키는 표현이므로, 한국어에서는 자연스럽게 ‘이런 많은 것들’로 옮겨 반복적 경험의 뉘앙스를 살렸습니다.
- source_word: רַאֲתָה עֵינִי
  english_pob_choice: my eye has seen
  chosen_korean: 내 눈은 보았고
  alternatives_korean:
  - 내 눈이 보았고
  - 내 눈으로 보았고
  - 내가 보았고
  lexicon: HALOT
  rationale: 히브리어의 단수 신체기관 표현을 유지해 ‘내 눈’의 생생한 증언성을 살렸습니다. 한국어에서는 서술을 자연스럽게 하기 위해 주어-서술형으로 다듬었습니다.
- source_word: וְעַצֻּמוֹת
  english_pob_choice: things as mighty as these
  chosen_korean: 이보다 더 강한 것들
  alternatives_korean:
  - 이보다 더 힘센 것들
  - 이것들보다 더 큰 것들
  - 이보다 더 위력 있는 것들
  lexicon: HALOT
  rationale: עַצֻּמוֹת는 단순히 ‘더 많은’이 아니라 힘/강함의 정도를 가리키므로, POB의 audit trail에 맞춰 ‘강한 것들’로 옮겼습니다. 비교구문 כָּאֵלֶּה의 감각을 살려 ‘이보다 더’로 처리했습니다.
- source_word: שָׂמְעָה אָזְנִי
  english_pob_choice: my ear has heard
  chosen_korean: 내 귀는 들었습니다
  alternatives_korean:
  - 내 귀가 들었습니다
  - 내가 들었습니다
  - 내 귀로 들었습니다
  lexicon: HALOT
  rationale: 히브리어의 단수 신체기관 병행을 보존하되, 한국어 문장에서는 ‘내 귀는’으로 앞선 ‘내 눈은’과 평행을 이루게 했습니다.
theological_decisions:
- issue: 강도 비교의 의미(‘as mighty as these’ vs ‘stronger than these’)
  chosen_reading: ‘이보다 더 강한 것들’로 번역해, 비교의 기준을 분명히 하면서도 원문의 강도 감각을 유지했습니다.
  alternative_readings:
  - ‘이것들만큼 강한 것들’
  - ‘이것들보다 더 강한 것들’
  - ‘이보다 더 뛰어난 것들’
  rationale: 히브리어 עַצֻּמוֹת와 그리스어 ἰσχυρότερα는 힘의 우열을 가리키므로, 의미를 약화시키지 않는 방향으로 ‘더 강한’ 비교를 채택했습니다. 본문 병행의 대구도 함께 보존했습니다.
  doctrine_reference: 시락 16:5의 시적 병행과 비교 표현 해석
- issue: 직역형 신체기관 표현의 유지
  chosen_reading: ‘내 눈은… 내 귀는…’의 병행을 살려 증언의 생생함을 유지했습니다.
  alternative_readings:
  - ‘나는… 보았고 들었습니다’
  - ‘내가… 보았고 들었습니다’
  rationale: 히브리 시문의 특징인 신체기관 의인화를 평이하게 풀어버리면 원문의 수사적 힘이 약해집니다. 그래서 의미는 자연화하되 구조는 최대한 보존했습니다.
  doctrine_reference: 시가·지혜문학의 평행법 이해
