lexical_decisions:
- source_word: μετὰ ταῦτα
  english_pob_choice: after this
  chosen_korean: 그리고 이 일 후에
  alternatives_korean:
  - 그 후에
  - 이후에
  - 그 일 뒤에
  lexicon: LSJ
  rationale: 시간 순서를 자연스럽게 살리되, 지시어 ταῦτα의 연결감을 유지하기 위해 ‘이 일 후에’로 옮겼습니다.
- source_word: Κύριος
  english_pob_choice: the Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주
  - 주께서
  lexicon: LSJ
  rationale: 여기서는 신적 호칭으로 쓰였으므로 ‘주님’이 자연스럽고, 서술 동사와 결합할 때 존대 문형을 살릴 수 있습니다.
- source_word: εἰς τὴν γῆν ἐπέβλεψεν
  english_pob_choice: looked upon the earth
  chosen_korean: 땅을 바라보시고
  alternatives_korean:
  - 땅을 보시고
  - 땅을 굽어보시고
  - 땅을 주목하시고
  lexicon: LSJ
  rationale: ἐπιβλέπω의 ‘시선을 두다/바라보다’라는 뜻을 반영하면서, 이후의 은혜로운 채움과 어울리는 한국어로 다듬었습니다.
- source_word: τῶν ἀγαθῶν αὐτοῦ
  english_pob_choice: with his good things
  chosen_korean: 자기의 좋은 것들로
  alternatives_korean:
  - 자기의 좋은 것들로
  - 자기의 선한 것들로
  - 자기의 복된 것들로
  lexicon: LSJ
  rationale: ἀγαθά를 해석적으로 ‘축복’으로 좁히지 않고, 본문이 말하는 ‘좋은 것들’이라는 넓은 의미를 그대로 살렸습니다.
theological_decisions:
- issue: 하나님 주어의 한국어 존칭과 서술 방식
  chosen_reading: ‘주님께서 … 바라보시고 … 채우셨습니다’로 옮겨 신적 주어에 합쇼체 존대와 서술적 연속성을 유지했습니다.
  alternative_readings:
  - ‘주님이 … 보시고 … 채우셨습니다’
  - ‘주께서 … 굽어보시고 … 채우셨습니다’
  rationale: 본문은 창조주로서의 주님의 주권적 행위를 말하므로, 한국어에서도 직접적인 존칭과 능동적 행위를 분명히 드러내는 것이 적절합니다.
  doctrine_reference: Korean style and divine address convention
- issue: ἀγαθά의 의미 범위
  chosen_reading: ‘좋은 것들’로 직역에 가깝게 유지했습니다.
  alternative_readings:
  - ‘복들’
  - ‘은혜로운 선물들’
  - ‘좋은 선물들’
  rationale: 본문 자체는 ‘좋은 것들’ 이상으로 특정한 신학 용어를 요구하지 않으므로, 해석을 과도하게 좁히지 않는 것이 원문에 충실합니다.
  doctrine_reference: Lexical restraint / source transparency
