base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/016/010.yaml
  text: So also six hundred thousand foot soldiers[b][a], gathered together in the arrogance of their heart.
  footnotes:
  - marker: a
    text: The phrase 'six hundred thousand foot soldiers' likely alludes to the wilderness generation of Israel; compare the traditional census figure in Exodus 12:37 and Numbers 11:21.
    reason: cross_reference
  - marker: b
    text: Or 'in the insolence of their heart' or 'in the presumptuousness of their heart.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그렇게도 육십만의 보병, 마음의 오만함 가운데 함께 모인 자들이었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 수치는 출애굽기 12:37과 민수기 11:21의 전통적 계수와 연결되는 표현일 가능성이 있습니다.
    reason: cross_reference
  - marker: b
    text: ‘마음의 오만함’은 ‘마음의 불손함’ 또는 ‘마음의 주제넘음’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֵּן
  english_pob_choice: So also
  chosen_korean: 그렇게도
  alternatives_korean:
  - 이처럼
  - 그와 같이
  - 또 그렇게
  lexicon: HALOT
  rationale: 앞 절의 예시를 이어 주는 연결어로서 ‘그렇게도’는 전환과 병행을 자연스럽게 살리면서도 원문의 연결성을 유지합니다.
- source_word: שֵׁשׁ מֵאוֹת אֶלֶף
  english_pob_choice: six hundred thousand
  chosen_korean: 육십만
  alternatives_korean:
  - 60만
  - 육백천
  lexicon: HALOT
  rationale: 히브리어의 수를 한국어 관용 표현으로 옮기되, 원문의 정확한 수량을 그대로 보존합니다.
- source_word: רַגְלִי
  english_pob_choice: foot soldiers
  chosen_korean: 보병
  alternatives_korean:
  - 도보 병사
  - 걸어서 온 군대
  lexicon: HALOT
  rationale: 직역의 ‘발로 간 자들’보다 군사적 의미가 분명한 ‘보병’이 Greek πεζῶν과도 맞고, 현대 한국어에서 자연스럽습니다.
- source_word: בִּזְדוֹן לִבָּם
  english_pob_choice: in the arrogance of their heart
  chosen_korean: 마음의 오만함 가운데
  alternatives_korean:
  - 마음의 거만함 가운데
  - 마음의 불손함 가운데
  - 마음의 주제넘음 가운데
  lexicon: HALOT
  rationale: זדון은 단순한 자존감이 아니라 교만하고 무례한 태도를 가리키므로 ‘오만함’이 가장 균형 잡힌 대응입니다. ‘마음의’는 히브리어 단수-복수 결합의 집합적 관용을 살립니다.
theological_decisions:
- issue: 600,000명의 집단의 정체를 본문에서 명시할지 여부
  chosen_reading: 본문에는 정체를 덧붙이지 않고, 수치와 성품 묘사만 그대로 옮겼습니다.
  alternative_readings:
  - 이스라엘 광야 세대로 명시하기
  - 출애굽 인구조사를 암시한다고 주석에서만 처리하기
  rationale: 원문 자체는 대상을 명시하지 않으므로, 해석을 본문에 끼워 넣지 않고 독자가 문맥 속에서 판단하도록 두는 편이 소스 충실성에 맞습니다.
  doctrine_reference: 본문이 말하지 않는 역사적 식별을 번역으로 단정하지 않기
