    text: 이 수치는 광야 세대의 이스라엘을 암시하는 것일 수 있습니다. 출애굽기 12:37과 민수기 11:21의 전통적 계수와 비교하십시오.
    reason: cross_reference
  - marker: b
    text: 또는 ‘마음의 불손함’ 또는 ‘마음의 주제넘음’.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֵּן
