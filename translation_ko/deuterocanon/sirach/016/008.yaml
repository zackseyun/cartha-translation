  text: And he did not spare Lot’s neighbors[b][a], who became arrogant in their pride.
  footnotes:
  - marker: a
    text: Or, 'Lot’s neighbors' or 'the people among whom Lot sojourned.' The Hebrew phrase is unusual; the Greek parallel has 'the sojourning community of Lot.'
    reason: lexical_alternative
  - marker: b
    text: Or, 'who made themselves detestable because of their pride.' The Hebrew form is difficult, and the Greek parallel supports the sense of becoming abhorrent on account of pride.
    reason: alternative_reading
translation:
  language: ko
  text: 그는 롯이 머물던 곳의 주민들을 아끼지 않으셨습니다. 그들은 교만에 빠져 거만해졌습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘롯의 거류민들’ 또는 ‘롯이 머물던 곳의 사람들’입니다. 히브리어 표현은 드물며, 그리스어 병행 본문은 ‘롯의 체류 공동체’라는 뜻으로 이해합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들의 교만 때문에 가증스러워진 사람들’로 옮길 수 있습니다. 히브리어 형태는 어렵고, 그리스어 병행 본문은 하나님께서 그들을 그들의 교만 때문에 혐오하셨다는 뜻을 지지합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְלֹא חָמַל
  english_pob_choice: and he did not spare
  chosen_korean: 아끼지 않으셨습니다
  alternatives_korean:
  - 긍휼히 여기지 않으셨습니다
  - 불쌍히 여기지 않으셨습니다
  lexicon: HALOT
  rationale: חמל은 ‘아끼다/불쌍히 여기다/긍휼히 여기다’의 뜻이므로, 심판 문맥에서 간결하고 자연스러운 ‘아끼지 않으셨습니다’가 적합합니다.
- source_word: מְגוּרֵי לוֹט
  english_pob_choice: Lot’s sojourners
  chosen_korean: 롯의 거류민들
  alternatives_korean:
  - 롯의 나그네들
  - 롯이 거하던 곳의 사람들
  lexicon: HALOT
  rationale: מגורֵי는 גור에서 온 말로 ‘거류/거주’의 뜻이 있어, 단순한 ‘이웃’보다 거주 공동체를 드러내는 ‘거류민들’이 원문의 사회적 뉘앙스를 더 잘 보존합니다.
- source_word: הַמִּתְעַבְּרִים
  english_pob_choice: who became arrogant in their pride / who made themselves detestable because of their pride
  chosen_korean: 가증스러워졌습니다
  alternatives_korean:
  - 교만하여졌습니다
  - 스스로 혐오스러워졌습니다
  lexicon: HALOT
  rationale: 형태가 어렵지만 히브리어와 그리스어 병행 본문이 모두 교만을 이유로 한 도덕적 혐오를 가리키므로, 결과 상태를 드러내는 ‘가증스러워졌습니다’가 본문 긴장을 잘 반영합니다.
- source_word: בְּגַאֲוָתָם
  english_pob_choice: in their pride
  chosen_korean: 교만 속에서
  alternatives_korean:
  - 그들의 교만 때문에
  - 교만으로 인하여
  lexicon: HALOT
  rationale: ב 전치사의 원인·상태 용법을 살려, 행위의 배경과 상태를 함께 보여 주는 ‘교만 속에서’로 옮겼습니다.
theological_decisions:
- issue: 주어의 신적 행위 표현
  chosen_reading: 본문의 ‘그는’은 앞 문맥의 하나님을 가리키므로, 한국어에서는 신적 주어에 맞게 ‘아끼지 않으셨습니다’로 높임 종결을 사용했습니다.
  alternative_readings:
  - 아끼지 않았습니다
  - 불쌍히 여기지 않으셨습니다
  rationale: 지혜문학의 신적 서술에서 하나님을 직접 지시하는 주어는 합쇼체 높임을 유지하는 것이 한국어 문체와 문맥에 더 자연스럽습니다.
  doctrine_reference: 신적 주어에 대한 한국어 존대 관행
