translation:
  language: ko
  text: 그분께서는 옛적의 통치자들을 용서하지 않으셨습니다[b][a]. 그들은 자기들의 힘으로 반역한 자들입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '그리스어: ‘옛적의 거인들.’ 이는 ‘옛적의 통치자들’을 태고의 반역자들로 이해한 해석을 반영합니다.'
    reason: alternative_reading
  - marker: b
    text: 히브리어의 עוֹלָם은 이 구절에서 의미가 난해합니다. 병행 그리스어는 ‘그들의 힘으로’라는 번역을 뒷받침합니다.
    reason: textual_variant
lexical_decisions:
- source_word: לֹא נָשָׁא
  english_pob_choice: did not spare
  chosen_korean: 용서하지 않으셨습니다
  alternatives_korean:
  - 불쌍히 여기지 않으셨습니다
  - 봐주지 않으셨습니다
  - 용납하지 않으셨습니다
  lexicon: HALOT
  rationale: 부정문과 심판 문맥에서 נשא는 단순한 ‘들다’보다 관용적으로 ‘용서/관용을 베풀다’의 뜻이 강하므로, 한국어에서는 ‘용서하지 않으셨습니다’가 자연스럽고 문맥에 맞습니다.
- source_word: לֲנְסִיכֵי קֶדֶם
  english_pob_choice: the princes of old
  chosen_korean: 옛날의 통치자들
  alternatives_korean:
  - 옛날의 왕자들
  - 옛날의 군주들
  - 옛날의 귀족들
  lexicon: HALOT
  rationale: נסיכים는 본래 ‘통치자들/지도자들’에 가깝고, 시라 16:7의 병행 히브리어를 따라 본문은 그 표현을 우선 살렸습니다. 영어 POB의 ‘princes of old’에 대응하되 현대 한국어에서 오해를 줄이기 위해 ‘통치자들’로 옮겼습니다.
- source_word: הַמּוֹרִים
  english_pob_choice: who rebelled
  chosen_korean: 반역했기 때문입니다
  alternatives_korean:
  - 거역했기 때문입니다
  - 반항했기 때문입니다
  - 불순종했기 때문입니다
  lexicon: HALOT
  rationale: מרה의 분사형은 지속적인 성격을 드러내며, 여기서는 단순한 감정적 반항보다 하나님께 대한 반역의 의미가 강합니다. 따라서 ‘반역하다’가 가장 힘 있게 대응합니다.
- source_word: בִּגְבוּרָתָם
  english_pob_choice: in their might
  chosen_korean: 자기들의 힘으로
  alternatives_korean:
  - 자기들의 능력으로
  - 자기들의 강함으로
  - 자기들의 권세로
  lexicon: HALOT
  rationale: גבורה는 ‘힘, 강함, 능력’을 뜻하며, 한국어에서는 전치사 구를 자연스럽게 살려 ‘자기들의 힘으로’로 옮겼습니다. 이는 그들의 교만한 자기의존을 드러내는 표현입니다.
theological_decisions:
- issue: 히브리어 본문과 헬라어 병행본문의 차이
  chosen_reading: 본문은 히브리어의 ‘옛날의 통치자들’을 따르되, 헬라어가 이를 ‘옛날의 거인들’로 해석하는 전통을 각주로 보존했습니다.
  alternative_readings:
  - 그는 옛날의 거인들을 용서하지 않으셨습니다.
  rationale: 시라 16:7은 히브리어가 비교적 본문이지만 난해하며, 헬라어는 그 대상을 해석적으로 풀어 줍니다. 둘 중 하나로 완전히 평평하게 만들기보다, 본문과 해석 전통의 긴장을 보존하는 것이 소스 충실성에 맞습니다.
  doctrine_reference: 'Sirach translation policy: use Hebrew where extant as base text; preserve Greek interpretive witness in footnotes when it clarifies a difficult line.'
