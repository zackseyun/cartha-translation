base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/016/018.yaml
  text: 'Look—the heavens and the highest heavens[a], the deep and the earth: when he descends upon them, they stand still[b]; at his visitation they quake.'
  footnotes:
  - marker: a
    text: Hebrew 'the heavens and the heavens of heavens'; rendered idiomatically as 'the heavens and the highest heavens.'
    reason: lexical_alternative
  - marker: b
    text: The Hebrew line after 'the deep and the earth' is difficult in this composite Cairo Geniza text; the Greek parallel reads, in effect, 'the abyss and the earth will be shaken at his visitation.' The main translation follows that secure sense.
    reason: textual_variant
translation:
  language: ko
  text: 보십시오. 하늘들과 가장 높은 하늘들[a], 깊음과 땅이여 — 그가 그들 위로 내려오시면 그들은 가만히 섭니다[b]. 그가 살피시면, 그들은 떱니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 ‘하늘들과 하늘들의 하늘’이라는 관용적 최상급 표현을 자연스럽게 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 본문의 이 부분은 Kahana 합성본에서 난해하며, 그리스어 평행본문은 ‘그의 감찰/방문 때 흔들릴 것이다’라는 뜻을 뒷받침합니다.
    reason: textual_variant
lexical_decisions:
- source_word: הֵן
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보세요
  lexicon: HALOT
  rationale: 강한 주의 환기 표현을 현대 한국어 합쇼체로 살리면서도, 문맥상 선언적 분위기를 유지하기 위해 「보십시오」로 옮겼습니다.
- source_word: הַשָּׁמַיִם וּשְׁמֵי הַשָּׁמַיִם
  english_pob_choice: the heavens and the highest heavens
  chosen_korean: 하늘들과 가장 높은 하늘들
  alternatives_korean:
  - 하늘과 하늘의 하늘
  - 하늘들과 하늘들의 하늘
  lexicon: HALOT
  rationale: 히브리어의 초월적 최고층 표현을 직역보다 자연스러운 한국어로 옮겨, 겹쳐진 하늘의 최상위를 드러냈습니다.
- source_word: בְּפָקְדוֹ
  english_pob_choice: at his visitation
  chosen_korean: 그가 살피시면
  alternatives_korean:
  - 그의 방문 때
  - 그가 감찰하시면
  - 그가 찾아오시면
  lexicon: HALOT; BDAG
  rationale: 히브리어 פקד의 신적 개입/감찰 의미와 그리스어 ἐπισκοπή의 배경을 반영하되, 문장 흐름상 자연한 동사형으로 처리했습니다.
- source_word: יִרְגְּשׁוּ
  english_pob_choice: they quake
  chosen_korean: 그들은 떱니다
  alternatives_korean:
  - 그들은 떨립니다
  - 그들은 흔들립니다
  - 그들은 진동합니다
  lexicon: HALOT
  rationale: 우주적 대상의 격동을 과장 없이 생생하게 전달하기 위해 「떱니다」를 택했습니다.
theological_decisions:
- issue: ‘그가 내려오시면’의 신적 의인화와 텍스트 불확실성
  chosen_reading: 히브리어의 ‘내려오심’과 ‘감찰/방문’ 이미지를 함께 살려, 우주가 하나님의 접근 앞에서 정지하고 떤다는 뜻으로 읽었습니다.
  alternative_readings:
  - 그가 그들 위로 내리시면
  - 그의 방문 때 그들은 떨립니다
  rationale: Kahana 본문의 난해한 구문과 그리스어 평행본문을 함께 고려할 때, 신적 행동의 역동성과 심판적 임재를 모두 유지하는 번역이 가장 책임 있습니다.
  doctrine_reference: 원문 우선과 텍스트 변이의 긴장 보존
