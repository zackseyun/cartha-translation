translation:
  language: ko
  text: 보십시오. 하늘과 하늘들의 하늘[a], 깊음과 땅도 그분께서 그들 위로 내려오실 때에는 서 있고[b], 그분께서 찾아오실 때에는 진동할 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘하늘과 하늘들의 하늘’은 가장 높은 하늘을 가리키는 중첩된 최상급 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그분께서 그들 위로 내려오실 때에는 서 있고’에 해당하는 히브리어 구절은 Kahana의 카이로 게니자 합성본문에서 난해합니다. 그리스어 평행본문은 이 구절을 보존하지 않고, 대신 ‘그분의 방문 때 깊음과 땅이 흔들릴 것이다’라는 뜻을 전합니다. 따라서 본문은 히브리어의 표현을 그대로 옮기되, 그 난해함을 남깁니다.
    reason: textual_variant
lexical_decisions:
- source_word: הֵן
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
