  source_fidelity: 히브리어의 열거(‘하늘과 하늘들의 하늘, 깊음과 땅’)와 이어지는 두 신적 행동, 곧 ‘그들 위로 내려오심’ 및 ‘방문/돌보심’을 모두 번역에 남겼습니다. 다만 난해한 ‘내려오실 때 그들은 선다’는 원문의 긴장을 평탄화하지 않고 직역에 가깝게 보존했습니다. 그리스어 평행본문은 ‘방문 때 흔들림’을 지지하지만, 내려오심과 섬의 구절을 뒷받침하지 않으므로 각주에서 이를 구별했습니다.
  naturalness: 초안의 ‘땅이여’는 원문에 없는 호격으로서 열거를 부자연스럽게 만들므로 삭제했습니다. ‘하늘들과 가장 높은 하늘들’보다 ‘하늘과 하늘들의 하늘’이 한국어 성서 문체에서 자연스럽고, 원문의 중첩된 최상급 표현도 더 투명하게 보존합니다. ‘떱니다’는 우주적 대상에는 다소 약하고 구어적이어서 ‘진동할 것입니다’로 옮겼습니다.
