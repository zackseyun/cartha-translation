base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/016/012.yaml
  text: As great as his mercies are[a], so also is his reproof[c][b]; he will judge a man according to his deeds.
  footnotes:
  - marker: a
    text: Or 'his mercy' (Greek singular), though the Hebrew reads the plural 'his mercies.'
    reason: lexical_alternative
  - marker: b
    text: Or 'his correction' or 'his rebuke'; the Greek likewise has 'reproof.'
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'a man' uses a masculine singular form with representative force.
    reason: cultural_note
translation:
  language: ko
  text: 그의 자비가 크신 것만큼 그의 책망도 그러합니다. 그는 사람을 그의 행실에 따라 심판하십니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 자비’로도 옮길 수 있습니다. 히브리어는 복수형을 쓰지만, 그리스어는 단수형입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그의 교정’, ‘그의 꾸짖음’으로도 옮길 수 있습니다. 그리스어도 ‘책망’을 뜻합니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어의 ‘사람’은 대표성을 지닌 남성 단수형입니다.
    reason: cultural_note
lexical_decisions:
- source_word: כְּרָב רַחֲמָיו
  english_pob_choice: As great as his mercies are
  chosen_korean: 그의 자비가 크신 것만큼
  alternatives_korean:
  - 그의 긍휼이 큰 만큼
  - 그의 자비의 크기만큼
  lexicon: HALOT
  rationale: כְּ...כֵּן의 비례 구조를 자연스러운 한국어로 살려 ‘...만큼 ...합니다’로 옮겼습니다. רַחֲמָיו는 복수형으로 풍성한 자비의 행위들을 가리킬 수 있어 ‘자비’로 번역하되, 한국어에서는 복수성을 과하게 드러내지 않았습니다.
- source_word: תּוֹכַחְתּוֹ
  english_pob_choice: his reproof
  chosen_korean: 책망
  alternatives_korean:
  - 교정
  - 꾸짖음
  - 징계
  lexicon: HALOT
  rationale: 이 어근은 단순 처벌보다 도덕적·교정적 ‘책망/교정’을 뜻하므로, 하나님의 자비와 평행을 이루는 말로서 ‘책망’을 선택했습니다. 한국어 교회 용어로 익숙하면서도 punitive한 뉘앙스를 과도하게 강화하지 않습니다.
- source_word: כְּמִפְעָלָיו
  english_pob_choice: according to his deeds
  chosen_korean: 그의 행실에 따라
  alternatives_korean:
  - 그의 행위에 따라
  - 그의 일에 따라
  lexicon: HALOT
  rationale: מִפְעָל은 행한 일/행위의 뜻이므로, 심판 문맥에서 자연스럽고 도덕적 책임을 분명히 하는 ‘행실’로 옮겼습니다. 영어 POB의 ‘deeds’와도 의미상 대응합니다.
- source_word: יִשְׁפֹּט
  english_pob_choice: he will judge
  chosen_korean: 심판하십니다
  alternatives_korean:
  - 판단하십니다
  - 심판하실 것입니다
  lexicon: HALOT
  rationale: 미완료형의 미래적·격언적 의미를 한국어 현재 종결형으로 옮겨 단정적 진리를 드러냈습니다. 하나님 주어와 결합하므로 존대 종결을 사용했습니다.
theological_decisions:
- issue: 자비와 책망의 관계
  chosen_reading: 이 구절은 하나님의 큰 자비와 그에 상응하는 책망을 함께 제시한 뒤, 행실에 따른 심판을 말합니다.
  alternative_readings:
  - 두 번째 절을 ‘징벌’로 더 강하게 읽을 수 있습니다.
  rationale: 히브리어 תּוֹכַחַת과 그리스어 ἔλεγχος는 주로 교정적 책망을 가리키므로, 자비와 심판 사이의 긴장을 지우지 않으면서도 과도한 형벌 의미로 좁히지 않았습니다.
  doctrine_reference: 'DOCTRINE.md: theological tension을 보존하고, 본문이 허용하는 범위에서만 명료화할 것.'
