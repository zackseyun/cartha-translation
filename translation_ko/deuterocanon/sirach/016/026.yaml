revisions:
- from: 하나님께서 처음부터 자신의 작품들을 창조하실 때, 그들의 거처와 질서를 정해 주셨습니다.[a]
  to: 하나님께서 처음부터 자신이 지으신 것들을 창조하실 때, 그들의 살아 있는 것들에 대한 다스림을 배정하셨습니다.[a]
  rationale: 근거 없는 ‘거처’를 삭제하고, 난해한 히브리어의 통치·배정 의미를 ‘살아 있는 것들에 대한 다스림’으로 제한적으로 반영했습니다. ‘그들의 몫’이라는 그리스어 병행 읽기는 각주에 남겨 본문의 불확실성을 보존했습니다. ‘작품들’은 창조 문맥에 더 자연스러운 ‘지으신 것들’로 다듬었습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T19:15:14Z'
