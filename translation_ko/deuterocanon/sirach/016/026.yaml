    rationale: 히브리어의 어휘 범위와 그리스어의 ‘그들의 몫을 구별하셨다’는 병행은 창조 질서를 단순히 정립했다기보다 각 존재에게 다스림 또는 몫을 배정했다는 뜻을 뒷받침합니다.
  - severity: low
