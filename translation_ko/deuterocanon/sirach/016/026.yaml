translation:
  language: ko
  text: 하나님께서 처음부터 자신이 지으신 것들을 창조하실 때, 그들의 살아 있는 것들에 대한 다스림을 배정하셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문의 후반부는 난해합니다. 그리스어 병행구는 “주님의 판단에 따라 그의 일들이 처음부터 있었고, 그들을 만드신 때부터 그들의 몫을 구별하셨다”라고 하며, 각 존재에게 몫 또는 다스림을 배정하셨다는 뜻을 뒷받침합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּבְרֹא
  english_pob_choice: When [he] created
  chosen_korean: 창조하실 때
  alternatives_korean:
  - 창조하실 무렵
  - 만드실 때
  lexicon: HALOT
  rationale: כ + ברא의 시간적 용법을 자연스럽게 살려, 창조 행위의 시작점을 나타내는 ‘-하실 때’로 옮겼습니다.
- source_word: אֵל
  english_pob_choice: God
  chosen_korean: 하나님
  alternatives_korean:
  - 하느님
  - 전능하신 하나님
  lexicon: HALOT
  rationale: 문맥상 פשוט한 신적 호칭이므로 한국어 표준 개신교 용례에 맞춰 ‘하나님’으로 옮겼습니다.
- source_word: עַל חַיֵּיהֶם [חָלָק מִשְׁטָרָם]
  english_pob_choice: he assigned their dominion over their living things
  chosen_korean: 그들의 거처와 질서를 정해 주셨습니다
  alternatives_korean:
  - 그들의 생명 위에 그들의 지배를 나누어 주셨습니다
  - 그들의 삶에 그들의 통치를 배분하셨습니다
  lexicon: HALOT
  rationale: 히브리어 본문이 난해하고, 영어 POB도 ‘dominion’과 함께 질서 부여의 뜻을 취하고 있으므로, 창조 질서의 배정이라는 핵심을 드러내는 방향으로 옮겼습니다.
- source_word: מִשְׁטָרָם
  english_pob_choice: their domains
  chosen_korean: 질서
  alternatives_korean:
  - 통치
  - 지배
  - 영역
  lexicon: HALOT
  rationale: מִשְׁטָר는 ‘통치/질서/행정’의 범위를 가지며, 여기서는 우주적 배치를 가리키는 문맥이므로 ‘질서’가 가장 과도한 정치적 뉘앙스를 피하면서도 의미를 살립니다.
theological_decisions:
- issue: 난해한 히브리어 후반부를 어떻게 반영할 것인가
  chosen_reading: 본문의 핵심을 창조 때 하나님이 피조물의 배열과 질서를 정하신 것으로 옮기고, 본문의 난해함은 과도하게 특정하지 않았습니다.
  alternative_readings:
  - ‘그들의 생명 위에 그들의 통치를 나누어 주셨다’처럼 더 직역적으로 옮김
  - 그리스어 병행구를 따라 ‘그들의 몫을 나누셨다’고 재구성함
  rationale: 히브리어 전승 자체가 불확실하므로, 의미를 과도하게 확정하지 않고 창조 질서의 부여라는 넓은 뜻을 보존하는 것이 가장 안전합니다.
  doctrine_reference: 'PHILOSOPHY.md: preserve ambiguity rather than over-resolve; use Greek parallel as a check, not as a replacement'
