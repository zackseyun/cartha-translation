  source_fidelity: 히브리어의 עֲרִירִי(자녀 없는)와 יְרֵא יְהֹוָה(하나님을 경외하는)를 본문에 유지하고, 그리스어의 συνετοῦ(분별 있는) 이문을 각주에 보존해야 합니다. 초안의 핵심 어휘 선택은 대체로 적절하나, מֵאֶחַד을 '한 사람의 ... 사람으로부터'로 처리한 것은 문법적으로 성립하지 않으며, תֵּשֵׁב עִיר를 '성읍이 거주하게 되다'로 옮긴 것은 주어와 서술어의 결합이 부정확합니다.
  naturalness: 현대 표준 한국어 합쇼체에서는 '성읍에 사람들이 살게 되다' 또는 '성읍이 사람이 사는 곳이 되다'가 자연스럽습니다. '무자한'은 문어적이고 오늘날 일반 독자에게 낯설 수 있으므로, 원문의 구체적 의미를 명료하게 드러내는 '자녀 없는'이 더 적합합니다.
  terminology: '''하나님을 경외하는''은 יְרֵא יְהֹוָה의 경외 의미를 자연스럽게 전달합니다. ''배신자들''과 ''황폐해질 것입니다''도 각각 בֹּגְדִים과 תֶּחֱרָב에 적절합니다. מִשְׁפַּחַת은 여기서 ''가문''으로 옮기면 혈연 집단의 뉘앙스가 잘 살아납니다.'
