translation:
  language: ko
  text: 하나님을 경외하는 자녀 없는 한 사람[a]으로 말미암아 성읍에 사람들이 살게 되지만, 배신자들의 한 가문으로 말미암아 성읍은 황폐해질 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 “한 분별 있는 사람으로 말미암아 성읍에 사람이 살게 될 것이다”라고 읽습니다. 히브리어는 “하나님을 경외하는 자녀 없는 한 사람”이라고 읽습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: מֵאֶחַד
  english_pob_choice: From one
  chosen_korean: 한 사람의
  alternatives_korean:
  - 한 사람으로부터
  - 한 이로부터
  lexicon: HALOT
  rationale: מִן + אֶחָד의 출발점을 한국어 조사로 자연스럽게 살리되, 뒤의 수식어와 결합해 한 사람을 가리키는 구조로 옮겼습니다.
- source_word: עֲרִירִי
  english_pob_choice: childless man
  chosen_korean: 무자한 사람
  alternatives_korean:
  - 자식 없는 사람
  - 자녀 없는 사람
  - 홀로된 사람
  lexicon: HALOT
  rationale: עֲרִירִי는 자손이나 자녀가 없는 상태를 가리키므로, 보다 직역적인 '자식 없는'도 가능하지만 현대 한국어에서 다소 거칠 수 있어 '무자한'으로 옮겼습니다.
- source_word: יְרֵא יְהֹוָה
  english_pob_choice: God-fearing
  chosen_korean: 하나님을 경외하는
  alternatives_korean:
  - 야훼를 경외하는
  - 주님을 경외하는
  lexicon: HALOT
  rationale: 히브리어의 핵심은 '두려워하다'보다 경외하다에 가까우므로 '경외하는'을 택했고, 한국어 성경 용례에 맞춰 하나님을 주어로 밝혔습니다.
- source_word: תֵּשֵׁב עִיר
  english_pob_choice: a city will be inhabited
  chosen_korean: 성읍이 거주하게 되겠지만
  alternatives_korean:
  - 성읍이 사람이 살게 되겠지만
  - 성읍이 거민을 얻게 되겠지만
  lexicon: HALOT
  rationale: תֵּשֵׁב은 '거주하다/살다'의 수동적 결과를 나타내므로, 성읍 자체가 사람이 사는 상태가 된다는 뜻을 살려 옮겼습니다.
- source_word: בֹּגְדִים
  english_pob_choice: traitors
  chosen_korean: 배신자들의
  alternatives_korean:
  - 간사한 자들의
  - 배반하는 자들의
  - 불충한 자들의
  lexicon: HALOT
  rationale: בֹּגְדִים은 언약적·관계적 신의를 깨는 자들을 가리키므로, 한국어에서 가장 직접적이고 강한 대응인 '배신자들'을 택했습니다.
- source_word: תֶּחֱרָב
  english_pob_choice: it will be laid waste
  chosen_korean: 황폐하게 될 것입니다
  alternatives_korean:
  - 폐허가 될 것입니다
  - 파괴될 것입니다
  - 버려지게 될 것입니다
  lexicon: HALOT
  rationale: 히브리어 חרב의 결과 상태를 한국어의 '황폐하다'로 살려, 단순 파괴보다 더 강한 폐허·황폐의 뉘앙스를 반영했습니다.
theological_decisions:
- issue: 히브리어 עֲרִירִי와 그리스어 συνετοῦ('현명한/분별 있는')의 차이
  chosen_reading: 본문에는 히브리어 증거를 따라 '무자한 사람'을 두고, 그리스어 독법은 각주로 남기지 않았습니다.
  alternative_readings:
  - 분별 있는 사람
  - 신중한 사람
  - 지혜로운 사람
  rationale: 이 절은 히브리어가 고신뢰로 남아 있으므로 본문은 히브리어 의미를 따르는 것이 더 원문 지향적입니다. 다만 한국어 본문은 간결하게 유지하기 위해 이 이문의 대안은 본문에 병기하지 않았습니다.
  doctrine_reference: 'Sirach translation policy: surviving Hebrew governs the main text when high-confidence; Greek parallel is a secondary witness.'
