  - 죄 많은 사람
  lexicon: BDAG
  rationale: 단수의 일반적 인물을 가리키므로, 자연스러운 현대 한국어로도 moral characterization을 살려 '죄인'으로 옮겼습니다.
- source_word: ἐμπεσὼν εἰς ἐγγύην
  english_pob_choice: falls into surety
  chosen_korean: 보증에 빠지고
  alternatives_korean:
