  lexicon: LSJ
  rationale: ‘surety’는 타인의 채무나 의무에 대한 보증을 뜻하므로, 의무 관계에 들어가다라는 뜻을 살려 '보증에 빠지고'로 옮겼습니다.
- source_word: διώκων ἐργολαβίας
  english_pob_choice: pursues contracts
  chosen_korean: 계약을 좇다가
  alternatives_korean:
  - 계약을 추구하다가
