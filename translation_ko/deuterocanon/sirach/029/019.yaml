  - 법적 분쟁에 빠집니다
  lexicon: BDAG
  rationale: 재정적 보증과 계약의 문맥에서는 법정 다툼의 의미가 가장 자연스러우므로, 영어 POB의 해석을 따라 '소송'으로 구체화했습니다.
