  source_fidelity: 헬라어의 분사 구조(‘보증에 관여하고 계약을 추구하는’)와 미래의 결과(‘법적 판단/분쟁에 빠지게 될 것이다’)를 충실히 반영합니다. κρίσεις는 복수형이며, 재정적 의무의 문맥에서는 ‘법적 분쟁’이 ‘소송’보다 원문의 폭을 더 잘 보존합니다.
  naturalness: 기존의 ‘보증에 빠지고’와 ‘계약을 좇다가’는 현대 표준 한국어에서 다소 부자연스럽습니다. ‘보증을 서고’, ‘계약을 추구하는’, ‘법적 분쟁에 휘말리게 됩니다’가 합쇼체 문장으로 자연스럽습니다.
  terminology: ἐγγύη는 ‘보증을 서다’로, ἐργολαβία는 과도하게 특정하지 않고 ‘계약’으로 옮깁니다. κρίσεις는 ‘법적 분쟁’으로 번역하고 각주에서 ‘재판’ 및 ‘판결’ 가능성을 밝혀 의미 범위를 보존합니다.
