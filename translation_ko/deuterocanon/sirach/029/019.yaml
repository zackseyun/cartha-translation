  lexicon: LSJ
  rationale: διώκων의 적극적으로 뒤쫓는 동작을 살리면서, ἐργολαβίας를 이 문맥에 자연스러운 '계약'으로 옮겨 경고의 뉘앙스를 보존했습니다.
- source_word: κρίσεις
  english_pob_choice: lawsuits
  chosen_korean: 소송에 빠집니다
  alternatives_korean:
