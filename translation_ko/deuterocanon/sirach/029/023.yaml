lexical_decisions:
- source_word: ἐπὶ μικρῷ καὶ μεγάλῳ
  english_pob_choice: with little and with much
  chosen_korean: 적은 것과 많은 것 모두에
  alternatives_korean:
  - 적든 많든
  - 적은 것과 많은 것에
  - 적은 것과 많은 경우에
  lexicon: LSJ
  rationale: ἐπί + 여격의 관용적 용법으로 ‘적은 것과 많은 것’이라는 양극을 함께 가리키므로, 한국어에서는 자연스럽게 ‘...모두에’로 옮겨 양의 대조를 살렸습니다.
- source_word: εὐδοκίαν
  english_pob_choice: be content
  chosen_korean: 만족하십시오
  alternatives_korean:
  - 기뻐하십시오
  - 마음에 들어 하십시오
  - 좋게 여기십시오
  lexicon: LSJ
  rationale: εὐδοκία는 문자 그대로 ‘좋은 뜻/기쁨/만족’의 뜻이지만, 여기서는 ἔχε와 결합한 권면형 표현이므로 ‘만족하십시오’가 문맥상 가장 직접적이고 읽기 자연스럽습니다.
- source_word: ἔχε
  english_pob_choice: be
  chosen_korean: 만족하십시오
  alternatives_korean:
  - 가지십시오
  - 유지하십시오
  - 있으십시오
  lexicon: LSJ
  rationale: 직역하면 ‘가지라’이지만, 한국어에서는 ‘만족하십시오’가 관용적 명령의 힘을 가장 잘 살리며, 앞의 명사 εὐδοκίαν의 의미를 동사형 권면으로 풀어 줍니다.
theological_decisions:
- issue: 물질적 부족과 풍요에 대한 태도
  chosen_reading: 본문은 삶의 형편이 적을 때와 많을 때 모두 동일한 내적 만족을 유지하라는 지혜 권면으로 읽었습니다.
  alternative_readings:
  - 외적 소유의 많고 적음에 상관없이 하나님 안에서 평정하라는 권면
  - ‘좋은 뜻’을 지니라는 보다 중립적인 윤리적 권면
  rationale: 지혜문학의 간결한 격언 형식상, 이 절은 상황 변화에 좌우되지 않는 만족의 태도를 직접적으로 명령하는 것으로 이해하는 것이 가장 자연스럽습니다.
  doctrine_reference: 지혜문학의 권면적 문맥
- issue: 문장에 대한 명령형 재현
  chosen_reading: 한국어에서는 ‘...에 만족하십시오’로 옮겨 원문의 권면적 명령을 보존했습니다.
  alternative_readings:
  - ‘...에 기뻐하십시오’
  - ‘...를 좋게 여기십시오’
  rationale: 원문의 εὐδοκίαν ἔχε는 단순한 상태 진술이 아니라 실천적 권면이므로, 한국어에서도 명령형을 유지하는 것이 문장 기능을 가장 충실히 반영합니다.
  doctrine_reference: 명령법의 화용적 등가
