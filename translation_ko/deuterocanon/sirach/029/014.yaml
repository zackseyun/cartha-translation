  chosen_reading: 대표적 인간 유형을 가리키는 일반 진술로 옮기되, 원문의 남성 단수와 도덕적 대조를 유지했습니다.
  alternative_readings:
  - 모든 좋은 사람은 이웃을 위해 보증해 주지만…
  - 선한 이는 이웃을 위해 보증하지만…
  rationale: 지혜문학의 격언은 보편적 교훈을 주지만, 원문은 남성 단수와 대조 구조를 분명히 사용합니다. 한국어에서는 자연성을 위해 '선한 사람'으로 하되, 문장의 대조를 선명하게 유지했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
