  text: A good man will stand surety for his neighbor[a], but one who has lost shame will abandon him.
  footnotes:
  - marker: a
    text: Or 'the shameless man will abandon him.' The Greek literally says 'the one who has lost shame.'
    reason: lexical_alternative
translation:
  language: ko
  text: 선한 사람은 이웃을 위해 보증해 주지만, 부끄러움을 잃은 사람은 그를 저버립니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “부끄러움을 잃은 사람은 그를 저버립니다.” 그리스어는 문자적으로 “부끄러움을 잃은 사람”이라고 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνὴρ ἀγαθός
  english_pob_choice: a good man
  chosen_korean: 선한 사람
  alternatives_korean:
  - 좋은 남자
  - 좋은 사람
  - 의로운 사람
  lexicon: LSJ
  rationale: ἀνήρ의 성별 정보는 있지만, 이 속담형 문맥에서는 한국어에서 자연스러운 대표 표현인 '선한 사람'으로 옮겨 의미를 살리면서도 남성 전용처럼 들리지 않게 했습니다.
- source_word: ἐγγυήσεται
  english_pob_choice: will stand surety for
  chosen_korean: 보증해 주지만
  alternatives_korean:
  - 연대보증하겠지만
  - 보증인이 되겠지만
  - 보증 서 주지만
  lexicon: LSJ
  rationale: 동사는 타인을 위해 재정적·법적 책임을 지는 의미이므로, 현대 한국어에서 이해되는 '보증하다'를 택해 법적 뉘앙스를 보존했습니다.
- source_word: ὁ ἀπολωλεκὼς αἰσχύνην
  english_pob_choice: one who has lost shame
  chosen_korean: 부끄러움을 잃은 사람
  alternatives_korean:
  - 부끄러움을 잃어버린 사람
  - 수치를 잃은 사람
  - 뻔뻔한 사람
  lexicon: LSJ
  rationale: 분사구의 직역 이미지를 살리기 위해 '부끄러움을 잃은 사람'으로 옮겼습니다. '뻔뻔한 사람'은 의미는 가깝지만 원문의 '잃었다'는 과정을 약화시킵니다.
- source_word: καταλείψει αὐτόν
  english_pob_choice: will abandon him
  chosen_korean: 그를 저버립니다
  alternatives_korean:
  - 그를 버립니다
  - 그를 떠납니다
  - 그를 버려 둡니다
  lexicon: LSJ
  rationale: καταλείπω는 단순한 이탈보다 관계적 배신을 포함할 수 있으므로, 문맥상 더 강한 '저버리다'를 택했습니다.
theological_decisions:
- issue: 속담형 진술의 일반화 수준
  chosen_reading: 대표적 인간 유형을 가리키는 일반 진술로 옮기되, 원문의 남성 단수와 도덕적 대조를 유지했습니다.
  alternative_readings:
  - 모든 좋은 사람은 이웃을 위해 보증해 주지만…
  - 선한 이는 이웃을 위해 보증하지만…
  rationale: 지혜문학의 격언은 보편적 교훈을 주지만, 원문은 남성 단수와 대조 구조를 분명히 사용합니다. 한국어에서는 자연성을 위해 '선한 사람'으로 하되, 문장의 대조를 선명하게 유지했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
