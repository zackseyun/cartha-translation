  rationale: 이 절은 보증인이 타인을 위해 감수한 실제적 위험을 말하므로, ‘영혼’보다 ‘생명’이 본문의 의미를 더 정확하게 전달합니다.
  doctrine_reference: 번역 원칙 §1, §6
