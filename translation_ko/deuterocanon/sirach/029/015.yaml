  text: Do not forget the kindnesses of a guarantor[b][a], for he gave his life for you.
  footnotes:
  - marker: a
    text: Or 'the favors of one who stood surety for you.' The Greek term refers to a person who guarantees another's obligation.
    reason: lexical_alternative
  - marker: b
    text: Literally 'his soul'; here the sense is 'his life' or 'himself' given on your behalf.
    reason: lexical_alternative
translation:
  language: ko
  text: 보증인의 호의들을 잊지 마십시오. 그가 당신을 위해 자기 생명을 내주었기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘보증인의 호의들’입니다. 여기서 그리스어는 타인의 의무를 보증해 준 사람의 구체적 호의나 은혜로운 행위를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그의 영혼’입니다. 여기서는 신학적 ‘영혼’이 아니라, 자신을 내주며 감수한 ‘생명’의 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: χάριτας
  english_pob_choice: kindnesses
  chosen_korean: 호의들
  alternatives_korean:
  - 은혜들
  - 호의
  - 은덕들
  lexicon: BDAG
  rationale: χάριτας는 여기서 추상적 ‘은혜’보다 보증인이 베푼 구체적 호의와 호의적 행위를 가리키므로, 복수성을 살린 ‘호의들’이 자연스럽습니다.
- source_word: ἐγγύου
  english_pob_choice: of a guarantor
  chosen_korean: 보증인의
  alternatives_korean:
  - 연대보증인의
  - 보증을 선 사람의
  - 담보인의
  lexicon: BDAG
  rationale: ἐγγύος는 타인의 채무나 의무를 보증하는 사람을 뜻하므로, 현대 독자에게 분명한 ‘보증인’이 가장 직접적인 대응입니다.
- source_word: τὴν ψυχὴν αὐτοῦ
  english_pob_choice: his life
  chosen_korean: 자기 생명
  alternatives_korean:
  - 그의 영혼
  - 자기 목숨
  - 자기 자신
  lexicon: BDAG
  rationale: ψυχή는 여기서 헌신이나 위험을 무릅쓴 ‘생명’의 의미이므로, 문자적인 ‘영혼’보다 관용적 의미를 드러내는 ‘자기 생명’이 적절합니다.
- source_word: ὑπὲρ σοῦ
  english_pob_choice: for you
  chosen_korean: 당신을 위해
  alternatives_korean:
  - 당신을 위하여
  - 당신 대신
  - 당신의 이익을 위해
  lexicon: BDAG
  rationale: ὑπέρ는 여기서 수혜와 대리의 의미를 띠므로, 간결하고 자연스러운 ‘당신을 위해’로 옮겼습니다.
theological_decisions:
- issue: ψυχή의 번역이 영혼론으로 오해될 가능성
  chosen_reading: 자기 생명
  alternative_readings:
  - 그의 영혼
  - 자기 자신
  rationale: 이 절은 보증인이 타인을 위해 감수한 실제적 위험을 말하므로, ‘영혼’보다 ‘생명’이 본문의 의미를 더 정확하게 전달합니다.
  doctrine_reference: 번역 원칙 §1, §6
