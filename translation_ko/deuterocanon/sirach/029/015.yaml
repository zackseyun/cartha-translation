  source_fidelity: 대체로 충실합니다. ἐγγύος를 ‘보증인’으로, χάριτας를 그가 베푼 호의로, ψυχή를 이 문맥에서 ‘목숨’으로 옮긴 것은 적절합니다. 다만 ‘생명을 내주었다’는 한국어에서는 실제 죽음이 확정된 듯 들릴 수 있어, 보증 때문에 자기 목숨을 위험에 내맡긴 문맥을 포함하는 ‘목숨을 내놓았다’가 더 자연스럽고 충실합니다.
  naturalness: ‘호의들을’은 한국어에서 다소 번역투입니다. 복수형의 의미는 ‘보증인이 베푼 호의’라는 집합적 단수 표현으로 자연스럽게 전달됩니다. 각주 표지는 해당 어구 바로 뒤에 두는 편이 독자의 이해에 좋습니다.
