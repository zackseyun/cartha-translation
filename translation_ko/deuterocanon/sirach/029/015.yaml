  text: Do not forget the kindnesses of a guarantor[b][a], for he gave his life for you.
  footnotes:
  - marker: a
    text: Or 'the favors of one who stood surety for you.' The Greek term refers to a person who guarantees another's obligation.
    reason: lexical_alternative
  - marker: b
    text: Literally 'his soul'; here the sense is 'his life' or 'himself' given on your behalf.
    reason: lexical_alternative
translation:
  language: ko
  text: 보증인[a]이 베푼 호의를 잊지 마십시오. 그는 당신을 위해 자기 목숨[b]을 내놓았기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘보증인의 호의들’입니다. 여기서 그리스어는 다른 사람의 의무를 보증해 준 이가 베푼 구체적인 호의나 도움을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그의 영혼’ 또는 ‘그의 생명’입니다. 여기서는 영혼에 관한 진술이 아니라, 보증인이 당신을 위하여 자기 목숨을 내건 것을 뜻합니다.
    reason: lexical_alternative
