  yaml_path: translation/deuterocanon/sirach/029/001.yaml
  text: He who shows mercy lends to his neighbor[a], and he who strengthens him with his hand keeps the commandments.
  footnotes:
  - marker: a
    text: Or 'he who supports him with his hand.' The Greek expression pictures concrete, practical help.
    reason: lexical_alternative
translation:
  language: ko
  text: 자비를 베푸는 사람은 이웃에게 빌려 주고, 손으로 그를 도와주는 사람은 계명을 지킵니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그의 손으로 그를 지지하는 사람’입니다. 이 표현은 구체적이고 실제적인 도움을 그립니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὁ ποιῶν ἔλεος
  english_pob_choice: He who shows mercy
  chosen_korean: 자비를 베푸는 사람은
  alternatives_korean:
  - 자비를 행하는 사람은
  - 긍휼을 베푸는 사람은
  lexicon: BDAG
  rationale: ἔλεος는 단순한 감정이 아니라 실제로 베푸는 자비를 가리키므로, 한국어에서도 행위성을 살린 ‘자비를 베푸는 사람’이 가장 자연스럽습니다.
- source_word: δανιεῖ
  english_pob_choice: lends
  chosen_korean: 빌려 주고
  alternatives_korean:
  - 빌려 주며
  - 대출하고
  lexicon: LSJ
  rationale: 미래형이지만 문맥상 일반적 진술이므로 한국어에서는 관용적으로 현재적 진술로 옮겨 ‘빌려 주고’라고 했습니다.
- source_word: ὁ ἐπισχύων τῇ χειρὶ αὐτοῦ
  english_pob_choice: he who strengthens him with his hand
  chosen_korean: 손으로 그를 도와주는 사람은
  alternatives_korean:
  - 손으로 그를 붙들어 주는 사람은
  - 손으로 그를 강하게 해 주는 사람은
  lexicon: LSJ
  rationale: ‘손’은 구체적이고 실천적인 도움의 이미지를 드러내므로, POB의 주석 취지에 맞게 물질적·실제적 도움을 드러내는 ‘손으로 그를 도와주는’으로 옮겼습니다.
- source_word: τηρεῖ ἐντολάς
  english_pob_choice: keeps the commandments
  chosen_korean: 계명을 지킵니다
  alternatives_korean:
  - 계명들을 지킵니다
  - 명령을 지킵니다
  lexicon: BDAG
  rationale: ἐντολή는 지혜문맥에서 하나님의 계명을 가리키는 종교적 함의를 띠므로, 일반적 ‘명령’보다 ‘계명’이 더 적절합니다.
theological_decisions:
- issue: ἐντολάς의 신학적 뉘앙스
  chosen_reading: ‘계명’으로 번역하여 윤리적 조언이 아니라 하나님의 뜻에 대한 순종의 범주를 드러냈습니다.
  alternative_readings:
  - 명령
  - 훈계
  rationale: 집회서의 지혜 격언은 단순한 실용 조언을 넘어 하나님께 대한 언약적 순종을 전제하는 경우가 많으므로, ‘계명’이 본문의 신학적 무게를 가장 잘 살립니다.
  doctrine_reference: 지혜문학의 윤리와 율법 순종의 연결
