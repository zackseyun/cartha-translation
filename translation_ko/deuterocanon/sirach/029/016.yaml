lexical_decisions:
- source_word: ἀγαθὰ
  english_pob_choice: the good things
  chosen_korean: 좋은 것들
  alternatives_korean:
  - 재산
  - 재물
  - 유익
  - 좋은 일들
  lexicon: LSJ
  rationale: ἀγαθά는 넓게 ‘좋은 것들, 유익, 소유물’까지 가리킬 수 있으므로, 의미 범위를 너무 빨리 재산으로 좁히지 않는 ‘좋은 것들’로 옮겼습니다.
- source_word: ἐγγύου
  english_pob_choice: of a guarantor
  chosen_korean: 보증인의
