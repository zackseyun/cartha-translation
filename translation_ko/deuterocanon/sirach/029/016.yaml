  - 보증인의
  lexicon: LSJ
  rationale: ἐγγύος는 타인을 위해 보증을 서는 사람을 뜻하므로, 현대 한국어에서 의미가 분명한 ‘보증인’으로 옮겼습니다.
- source_word: ἀνατρέψει
  english_pob_choice: will overturn
  chosen_korean: 뒤엎습니다
  alternatives_korean:
  - 무너뜨립니다
  - 망하게 합니다
  - 뒤집어엎습니다
  lexicon: LSJ
  rationale: 동사의 기본 이미지는 ‘뒤엎다/전복하다’이므로, 원문의 구체적 힘을 살린 ‘뒤엎습니다’로 옮겼습니다.
- source_word: ἁμαρτωλός
  english_pob_choice: a sinner
  chosen_korean: 죄인
  alternatives_korean:
  - 죄 많은 사람
  - 죄를 지은 사람
  - 악인
  lexicon: LSJ
  rationale: 무관사 단수는 일반적 진술로 읽히므로, 남성 특정 없이 도덕적 규정 자체를 드러내는 ‘죄인’이 가장 자연스럽습니다.
theological_decisions:
- issue: 보증의 피해 범위
  chosen_reading: ‘좋은 것들’을 유지해 재산에만 한정하지 않았습니다.
  alternative_readings:
  - ‘재산’으로 좁혀 읽기
  - ‘재물’로 경제적 손실을 강조하기
  rationale: 본문은 보증인의 손실을 폭넓게 경고하므로, 물질 재산으로만 한정하면 그 범위를 줄일 수 있습니다. 따라서 의미의 여지를 남겼습니다.
  doctrine_reference: 표현의 범위를 원문에 맞게 보존하는 번역 원칙
