lexical_decisions:
- source_word: χάριν ἐντολῆς
  english_pob_choice: for the sake of the commandment
  chosen_korean: 계명의 뜻을 생각하여
  alternatives_korean:
  - 계명을 위하여
  - 계명 때문에
  - 계명의 까닭으로
  lexicon: LSJ
  rationale: χάριν + 속격은 ‘~을 위하여/위해서’라는 목적·동기 관계를 나타내므로, 한국어에서는 행위의 동기를 드러내는 ‘계명의 뜻을 생각하여’로 옮겨 원문의 윤리적 동기를 살렸습니다.
- source_word: ἀντιλαβοῦ
  english_pob_choice: help
  chosen_korean: 도우십시오
  alternatives_korean:
  - 붙들어 주십시오
  - 도와주십시오
  - 손을 내밀어 주십시오
  lexicon: BDAG
  rationale: ἀντιλαμβάνομαι는 ‘붙들어 주다, 도와주다’의 적극적 지원을 뜻하므로, 자연스러운 공손한 명령형 ‘도우십시오’가 가장 직접적입니다.
- source_word: πένητος
  english_pob_choice: the poor
  chosen_korean: 가난한 이
  alternatives_korean:
  - 가난한 사람
  - 빈곤한 사람
  - 가난한 자
  lexicon: LSJ
  rationale: πένης는 특정 남성보다 가난한 사람의 범주를 가리키므로, 현대 한국어에서는 비인칭적이고 포괄적인 ‘가난한 이’가 적절합니다.
- source_word: μὴ ἀποστρέψῃς αὐτὸν κενόν
  english_pob_choice: do not send him away empty
  chosen_korean: 그를 빈손으로 보내지 마십시오
  alternatives_korean:
  - 그를 빈손으로 돌려보내지 마십시오
  - 그를 빈 채로 보내지 마십시오
  - 그를 빈손으로 돌려보내지 마십시오
  lexicon: BDAG
  rationale: ἀποστρέφω + κενός는 도움 없이 떠나게 하는 거절의 의미를 가지므로, 한국어 관용구 ‘빈손으로 보내지 마십시오’가 동작의 구체성과 결과를 잘 전달합니다.
theological_decisions:
- issue: 계명의 범위와 지시 대상
  chosen_reading: 특정 조문으로 한정하지 않고, 가난한 이를 돌보라는 신적·도덕적 계명의 일반적 요구로 유지했습니다.
  alternative_readings:
  - 토라의 특정 계명으로 좁혀 이해함
  - 단순한 교훈이나 권고로 일반화함
  rationale: 그리스어 단수 ἐντολή는 분명하지만 특정 조문을 지시한다고 단정되지는 않으므로, 번역에서도 그 긴장을 보존했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
