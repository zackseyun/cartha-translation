base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/029/005.yaml
  text: Until he receives it[a], he will kiss his neighbor's hand, and for his neighbor’s money he will lower his voice; but at the time of repayment he will delay[b], and he will repay with words of indifference and blame the timing.
  footnotes:
  - marker: a
    text: Greek literally, 'he will humble [his] voice,' an idiom for speaking in a lowered, submissive tone.
    reason: lexical_alternative
  - marker: b
    text: 'The verb ''repay'' is used ironically here: instead of returning the money, he returns only excuses.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 그것을 받을 때까지는, 그의 이웃의 손에 입을 맞추고, 그의 이웃의 돈 때문에 목소리를 낮출 것이나, 갚을 때가 되면 시간을 질질 끌며, 무심함의 말로 갚고 때를 탓할 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 문자적으로 ‘그의 목소리를 낮출 것이다’라는 뜻으로, 공손하게 굽신거리는 말투를 가리키는 관용구입니다.
    reason: lexical_alternative
  - marker: b
    text: 여기서 ‘갚다’는 반어적으로 쓰여, 돈을 되돌려 주는 대신 변명만 돌려준다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕως οὗ λάβῃ
  english_pob_choice: Until he receives it
  chosen_korean: 그것을 받을 때까지는
  alternatives_korean:
  - 그것을 받기까지는
  - 그것을 수령할 때까지는
  lexicon: LSJ
  rationale: 수혜자가 돈을 ‘받는’ 상황을 자연스러운 현대 한국어로 옮기되, 단순히 ‘갖다’보다 수령의 의미를 분명히 했습니다.
- source_word: καταφιλήσει χεῖρα αὐτοῦ
  english_pob_choice: he will kiss his neighbor’s hand
  chosen_korean: 그의 이웃의 손에 입을 맞추고
  alternatives_korean:
  - 그의 이웃의 손에 계속 입을 맞추고
  - 그의 이웃의 손을 입맞춤하고
  lexicon: LSJ
  rationale: 과장된 아첨의 구체적 이미지를 살리기 위해 직역에 가깝게 옮겼고, 한국어에서는 ‘손에 입을 맞추다’가 자연스럽습니다.
- source_word: ταπεινώσει φωνήν
  english_pob_choice: he will lower his voice
  chosen_korean: 목소리를 낮출 것이나
  alternatives_korean:
  - 목소리를 낮출 것이며
  - 목소리를 굽힐 것이나
  lexicon: LSJ
  rationale: ‘목소리를 낮추다’가 타인의 환심을 사려는 아첨의 태도를 한국어 관용으로 잘 드러냅니다. POB의 각주처럼 ‘목소리를 겸손하게 하다’의 관용적 뜻을 유지했습니다.
- source_word: παρελκύσει χρόνον
  english_pob_choice: he will delay
  chosen_korean: 시간을 질질 끌며
  alternatives_korean:
  - 지체하며
  - 시간을 끌며
  lexicon: LSJ
  rationale: 지불을 미루는 행동의 지연성을 살리기 위해 동작성을 강하게 드러냈습니다. 한국어 ‘시간을 질질 끌다’는 원문의 생생한 지연 뉘앙스를 반영합니다.
- source_word: ἀποδώσει λόγους ἀκηδίας
  english_pob_choice: he will repay with words of indifference
  chosen_korean: 무심함의 말로 갚고
  alternatives_korean:
  - 무관심의 말로 갚고
  - 태만한 말로 갚고
  - 무심한 말로 되갚고
  lexicon: LSJ
  rationale: ‘돈 대신 말로 갚는다’는 반어를 유지하면서, ἀκηδία의 무관심·태만의 의미를 ‘무심함’으로 간결하게 옮겼습니다.
- source_word: τὸν καιρὸν αἰτιάσεται
  english_pob_choice: blame the timing
  chosen_korean: 때를 탓할 것입니다
  alternatives_korean:
  - 시기를 탓할 것입니다
  - 때문을 시기 탓으로 돌릴 것입니다
  lexicon: LSJ
  rationale: καιρός를 상황적 ‘때’로 보고, αἰτιάομαι의 비난/탓하기를 자연스러운 한국어로 옮겼습니다.
theological_decisions:
- issue: 잠언적 풍자 어조의 보존
  chosen_reading: 도덕적 교훈보다, 빚을 빌릴 때의 아첨과 갚을 때의 변명을 풍자하는 냉소적 어조를 그대로 드러냈습니다.
  alternative_readings:
  - 일반적 교훈문처럼 완화하여 옮김
  - 아첨과 무례를 부드럽게 표현함
  rationale: 본문은 죄의 성격을 훈계하는 방식으로 말하기보다, 인간의 이중성을 통렬하게 비웃는 풍자에 가깝기 때문에 그 톤을 약화하지 않았습니다.
  doctrine_reference: 지혜문학의 풍자적 경구 표현
- issue: ‘그의 이웃의 손’의 관계성 유지
  chosen_reading: 손을 일반적 대상화하지 않고 ‘그의 이웃의 손’으로 유지해, 사회적 의존 관계와 아첨의 대상으로서의 손짓을 살렸습니다.
  alternative_readings:
  - ‘그의 손’으로 단순화
  - ‘남의 손’으로 일반화
  rationale: 그리스어 대명사와 문맥상 ‘이웃’이 이미 관찰 대상이므로, 관계성을 약화시키는 일반화는 피했습니다.
  doctrine_reference: 문맥적 지시어 해석
