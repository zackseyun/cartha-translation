    issue: 대명사 지시 대상이 불명확합니다.
    rationale: 앞부분은 빌려 준 사람이 회수하는 경우를, 끝부분은 빌린 사람이 빌려 준 사람에게 적대적으로 되갚는 경우를 가리킵니다. 한국어의 연속된 ‘그는/그에게’는 주체 전환을 알아보기 어렵게 합니다.
  - severity: medium
    issue: ‘그것을 얻은 것처럼’이 εὕρεμα의 비유를 약화합니다.
    rationale: εὕρεμα는 단순히 얻은 물건이 아니라 발견물, 곧 뜻밖의 횡재처럼 여기는 것을 뜻합니다.
  - severity: low
    issue: b 각주의 앵커와 내용이 일치하지 않습니다.
    rationale: 각주는 적을 얻게 되는 역설을 설명하지만 앵커는 ‘욕’에 붙어 있습니다. 앵커를 ‘아무런 보람도 없이’로 옮기고, ‘모욕’의 대안은 별도 각주 없이 본문 어휘로 처리하는 것이 적절합니다.
