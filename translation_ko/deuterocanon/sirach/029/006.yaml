  source_fidelity: 수정이 필요합니다. 초안은 전반적으로 회수의 어려움, 금전 손실, 적대, 저주와 모욕이라는 본문의 흐름을 잘 반영합니다. 그러나 ‘그’의 지시 대상이 연속해서 바뀌는 본문 특성상, 마지막 두 절의 행위자가 빌린 사람이라는 점을 한국어 본문에서 밝혀야 합니다. 또한 εὕρεμα의 ‘뜻밖에 발견한 것/횡재’라는 비유를 ‘얻은 것’보다 분명히 드러내는 편이 충실합니다.
  naturalness: ‘반이나 겨우’, ‘공짜로 원수를 얻게 됩니다’, ‘저주와 욕을 갚아 줄 것입니다’는 현대의 격식 있는 성서 한국어로 다소 어색하거나 뜻이 흐립니다. ‘절반만 겨우’, ‘아무런 보람도 없이 원수로 얻게 됩니다’, ‘저주와 모욕을 되갚을 것입니다’가 더 자연스럽고 문맥상 명확합니다.
  terminology: δόξα/ἀτιμία는 이 사회적 문맥에서 ‘명예/불명예’가 ‘영광/치욕’보다 적절합니다. λοιδορία는 구어적인 ‘욕’보다 격식 있는 ‘모욕’으로 옮깁니다. 기존 b 각주는 실제로 ‘욕’의 대안을 설명하면서 내용은 ‘원수를 얻게 됨’의 역설을 설명하므로, 해당 앵커를 그 표현으로 옮겨야 합니다.
  issues:
