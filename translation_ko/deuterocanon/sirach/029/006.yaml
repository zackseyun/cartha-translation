base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/029/006.yaml
  text: If he is able[a], he will scarcely recover half, and will count it as a find; but if not, he has been deprived of his money, and has gained an enemy for nothing. He will repay him with curses and insults[b], and instead of honor he will repay him with dishonor.
  footnotes:
  - marker: a
    text: Or 'will count it as a windfall'; the Greek says literally 'as a find,' meaning that even recovering half is treated like unexpectedly found money.
    reason: lexical_alternative
  - marker: b
    text: Or 'has made an enemy of him for no benefit'; the Greek expression conveys the irony that the lender loses money and gains hostility in return.
    reason: lexical_alternative
translation:
  language: ko
  text: 빌려 준 사람이 힘이 있으면, 절반만 겨우 되찾고 그것을 뜻밖에 얻은 것[a]처럼 여길 것입니다. 그러나 그렇지 않으면, 그는 자기 돈을 빼앗기고 그 사람을 아무런 보람도 없이 원수로 얻게 됩니다[b]. 빌린 사람은 빌려 준 사람에게 저주와 모욕을 되갚을 것이며, 명예 대신 불명예를 돌려줄 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘발견한 것’ 또는 ‘횡재’로 옮길 수 있습니다. 헬라어는 문자적으로 ‘발견물’을 뜻하며, 회수한 절반조차 뜻밖에 얻은 것처럼 여긴다는 비유입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘아무 대가 없이’로 옮길 수 있습니다. 이 표현은 돈을 잃은 데 더하여 그 사람을 원수로 얻게 되는 역설을 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν ἰσχύσῃ
  english_pob_choice: If he is able
  chosen_korean: 그가 할 수 있으면
  alternatives_korean:
  - 그가 능하면
  - 그가 힘이 있으면
  - 그가 가능하면
  lexicon: BDAG
  rationale: ἰσχύω는 ‘힘이 있다, 할 수 있다’의 뜻이므로, 여기서는 회수할 수 있는 형편인지에 초점을 둔 ‘할 수 있으면’이 가장 자연스럽고 원문 범위를 넘지 않습니다.
- source_word: μόλις κομίσεται τὸ ἥμισυ
  english_pob_choice: he will scarcely recover half
  chosen_korean: 반이나 겨우 되찾고
  alternatives_korean:
  - 절반이나 겨우 회수하고
  - 반을 간신히 되찾고
  lexicon: BDAG
  rationale: κομίζομαι의 ‘되찾다/받아오다’와 μόλις의 ‘겨우, 간신히’를 살려, 회수의 어려움을 한국어로 압축해 표현했습니다.
- source_word: λογιεῖται αὐτὸ ὡς εὕρεμα
  english_pob_choice: will count it as a find
  chosen_korean: 그것을 얻은 것처럼 여길 것입니다
  alternatives_korean:
  - 그것을 발견한 것처럼 여길 것입니다
  - 그것을 횡재처럼 여길 것입니다
  lexicon: BDAG
  rationale: εὕρεμα의 직역인 ‘발견한 것’은 다소 어색할 수 있어, ‘뜻밖에 얻은 것’이라는 뉘앙스를 살리되 과도한 해석을 피하는 표현으로 옮겼습니다. 각주에서 ‘획득물/횡재’의 가능성을 밝힙니다.
- source_word: ἀπεστέρησεν αὐτὸν τῶν χρημάτων αὐτοῦ
  english_pob_choice: he has been deprived of his money
  chosen_korean: 그는 자기 돈을 빼앗기고
  alternatives_korean:
  - 그는 자기 돈을 잃고
  - 그는 자기 돈에서 박탈당하고
  lexicon: BDAG
  rationale: ἀποστερέω는 ‘빼앗다, 박탈하다, 속여 빼돌리다’의 폭이 있으나, 여기서는 결과를 강조하는 서술로서 ‘빼앗기고’가 가장 간결합니다.
- source_word: ἐκτήσατο αὐτὸν ἐχθρὸν οὐ δωρεάν
  english_pob_choice: has gained an enemy for nothing
  chosen_korean: 공짜로 원수를 얻게 됩니다
  alternatives_korean:
  - 아무 보람 없이 원수를 얻게 됩니다
  - 대가 없이 원수를 얻게 됩니다
  lexicon: BDAG
  rationale: οὐ δωρεάν은 ‘공짜로/헛되이/보람 없이’의 아이러니를 담으므로, 현대 한국어에서 의미가 분명한 ‘공짜로’로 옮겨 손실과 적대의 역설을 살렸습니다.
- source_word: κατάρας καὶ λοιδορίας
  english_pob_choice: curses and insults
  chosen_korean: 저주와 욕
  alternatives_korean:
  - 저주와 모욕
  - 저주와 악담
  lexicon: BDAG
  rationale: 두 항은 적대적 언어 행위를 병렬로 나타내므로, 일상적이면서도 강한 표현인 ‘저주와 욕’이 현대 문체에서 자연스럽습니다.
