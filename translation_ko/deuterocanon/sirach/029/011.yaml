  text: Store up your treasure according to the commandments of the Most High[a], and it will profit you more than gold.
  footnotes:
  - marker: a
    text: Greek 'according to the commandments of the Most High'; the singular 'the commandment' is used here as a collective English rendering.
    reason: lexical_alternative
translation:
  language: ko
  text: 지존자의 명령에 따라 당신의 재산을 쌓아 두십시오. 그러면 그것이 금보다 더 당신에게 유익할 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 ‘지존자의 계명들에 따라’라고 복수형을 사용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: θὲς
  english_pob_choice: Store up
  chosen_korean: 쌓아 두십시오
  alternatives_korean:
  - 저장하십시오
  - 간직하십시오
  - 쌓아 두어라
  lexicon: LSJ
  rationale: τίθημι의 명령형은 단순히 ‘두다’보다, 귀중한 것을 의도적으로 모아 보관하는 뜻을 드러내므로 ‘쌓아 두십시오’로 옮겼습니다.
- source_word: τὸν θησαυρόν σου
  english_pob_choice: your treasure
  chosen_korean: 당신의 재산
  alternatives_korean:
  - 당신의 보물
  - 당신의 보화
  - 당신의 재물
  lexicon: LSJ
  rationale: θησαυρός는 문자적으로 ‘보물’이지만, 시락 29장의 문맥에서는 실제 소유와 축적된 자산의 뉘앙스가 강하므로 현대 한국어에서는 ‘재산’이 자연스럽습니다.
- source_word: κατʼ ἐντολὰς
  english_pob_choice: according to the commandments
  chosen_korean: 명령에 따라
  alternatives_korean:
  - 계명들에 따라
  - 명령들에 따라
  - 계명을 따라
  lexicon: LSJ
  rationale: ἀνὰ/κατά + 복수 ἐντολάς는 지존자의 지시를 기준으로 삼으라는 뜻이므로, 한국어에서는 반복을 피하면서도 규범성을 살리는 ‘명령에 따라’가 적절합니다.
- source_word: Ὑψίστου
  english_pob_choice: the Most High
  chosen_korean: 지존자
  alternatives_korean:
  - 지극히 높으신 분
  - 가장 높으신 분
  - 가장 높으신 하나님
  lexicon: LSJ
  rationale: Ὕψιστος의 관용적 신칭을 한국어에서 간결하게 살리기 위해 ‘지존자’로 옮겼습니다. 이는 고유 종교어휘를 유지하면서도 과도한 설명을 피합니다.
- source_word: λυσιτελήσει
  english_pob_choice: will profit
  chosen_korean: 유익할 것입니다
  alternatives_korean:
  - 이득이 될 것입니다
  - 유리할 것입니다
  - 이익이 될 것입니다
  lexicon: LSJ
  rationale: 동사는 경제적 이익을 뜻하지만, 지혜문학의 문맥에서는 실질적 유익을 넓게 가리키므로 ‘유익할 것입니다’가 자연스럽고 의미를 과장하지 않습니다.
theological_decisions:
- issue: θησαυρός를 ‘보물’로 좁힐지, 문맥상 재산/재물을 포괄할지
  chosen_reading: 문맥상 축적된 소유 전체를 가리키는 넓은 의미로 ‘재산’을 채택했습니다.
  alternative_readings:
  - 보물로 번역하기
  - 재물로 번역하기
  rationale: 이 절은 구체적 헌금이나 자선 행위를 직접 말하지 않고, 지존자의 명령 아래 자산을 배치하라는 지혜 격언의 형식을 취합니다. 따라서 지나치게 경건화된 ‘보물’보다 넓은 포괄어가 원문 의도에 가깝습니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: κατʼ ἐντολὰς의 복수성을 한국어에 얼마나 드러낼지
  chosen_reading: 복수 어감을 직접 표지하기보다 자연스러운 단수 집합 표현으로 처리했습니다.
  alternative_readings:
  - 명령들에 따라
  - 계명들에 따라
  rationale: 그리스어는 복수형이지만, 한국어에서는 이런 지시적 관용구를 단수 집합명사로도 충분히 전달할 수 있습니다. 의미를 흐리지 않으면서 문장을 더 읽기 쉽게 하기 위한 선택입니다.
  doctrine_reference: Translation philosophy §3
