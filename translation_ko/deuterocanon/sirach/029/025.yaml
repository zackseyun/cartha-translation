  rationale: ἀκούσει의 목적어가 생략된 점을 반영하되, POB의 ‘bitter words’ 해석을 따라 한국어에서 자연스러운 ‘쓴소리’로 보완했습니다.
theological_decisions:
- issue: 마지막 구문의 생략된 목적어 처리
  chosen_reading: 본문의 ἀκούσει는 목적어가 생략되어 있으므로, 한국어에서는 자연스러운 ‘쓴소리’를 보충해 의미를 드러냈습니다.
  alternative_readings:
  - ‘쓴 것들을 들을 것입니다’처럼 더 직역할 수 있습니다.
  - ‘쓰디쓴 말을 들을 것입니다’처럼 조금 더 문자적으로 옮길 수 있습니다.
  rationale: 영어 POB도 natural English를 위해 ‘words’를 보충했으므로, 같은 방식으로 한국어에서도 암시된 대상을 명시했습니다.
  doctrine_reference: 번역학적 처리; 의미 보완
