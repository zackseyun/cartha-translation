  text: You will host and give drink to the ungrateful[a], and besides these things you will hear bitter words.
  footnotes:
  - marker: a
    text: Or 'you will hear bitter things'; the Greek leaves the object of 'hear' implicit, and 'words' is supplied for natural English.
    reason: lexical_alternative
translation:
  language: ko
  text: 네가 그들에게 숙식과 마실 것을 주더라도, 그들은 배은망덕한 자들이며, 그뿐만 아니라 쓴소리까지 들을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘쓴 것들’을 들을 것입니다. 그리스어는 ‘듣다’의 목적어를 생략하므로, 한국어에서는 자연스럽게 ‘말/소리’를 보충할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ξενιεῖς
  english_pob_choice: you will host
  chosen_korean: 숙식을 제공하다
  alternatives_korean:
  - 손님으로 맞이하다
  - 환대하다
  - 묵게 하다
  lexicon: LSJ
  rationale: ξενίζω의 손님 접대·숙박 제공 의미를 살려, 단순한 ‘환대하다’보다 구체적인 행위로 풀었습니다.
- source_word: ποτιεῖς
  english_pob_choice: give drink
  chosen_korean: 마실 것을 주다
  alternatives_korean:
  - 술을 주다
  - 마시게 하다
  - 음료를 제공하다
  lexicon: LSJ
  rationale: ‘주다’의 직접성을 유지하면서 φυσικά한 한국어로 ‘마실 것’을 보충해 병렬 구조를 살렸습니다.
- source_word: εἰς ἀχάριστα
  english_pob_choice: to the ungrateful
  chosen_korean: 배은망덕한 자들
  alternatives_korean:
  - 은혜를 모르는 자들
  - 감사할 줄 모르는 자들
  lexicon: LSJ
  rationale: ἀχάριστος의 도덕적 성격을 한국어 숙어 ‘배은망덕한’으로 자연스럽게 옮겼습니다.
- source_word: πικρὰ ἀκούσει
  english_pob_choice: you will hear bitter words
  chosen_korean: 쓴소리까지 들을 것입니다
  alternatives_korean:
  - 쓴말을 듣게 될 것입니다
  - 괴로운 말을 듣게 될 것입니다
  - 쓴 것들을 들을 것입니다
  lexicon: LSJ
  rationale: ἀκούσει의 목적어가 생략된 점을 반영하되, POB의 ‘bitter words’ 해석을 따라 한국어에서 자연스러운 ‘쓴소리’로 보완했습니다.
theological_decisions:
- issue: 마지막 구문의 생략된 목적어 처리
  chosen_reading: 본문의 ἀκούσει는 목적어가 생략되어 있으므로, 한국어에서는 자연스러운 ‘쓴소리’를 보충해 의미를 드러냈습니다.
  alternative_readings:
  - ‘쓴 것들을 들을 것입니다’처럼 더 직역할 수 있습니다.
  - ‘쓰디쓴 말을 들을 것입니다’처럼 조금 더 문자적으로 옮길 수 있습니다.
  rationale: 영어 POB도 natural English를 위해 ‘words’를 보충했으므로, 같은 방식으로 한국어에서도 암시된 대상을 명시했습니다.
  doctrine_reference: 번역학적 처리; 의미 보완
