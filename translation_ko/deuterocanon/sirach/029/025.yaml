  text: You will host and give drink to the ungrateful[a], and besides these things you will hear bitter words.
  footnotes:
  - marker: a
    text: Or 'you will hear bitter things'; the Greek leaves the object of 'hear' implicit, and 'words' is supplied for natural English.
