translation:
  language: ko
  text: 너는 은혜를 모르는 자들을 손님으로 맞이하고 마실 것을 주며, 그에 더하여 쓴소리도 듣게 될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 문자적으로 ‘쓴 것들’을 듣게 된다고 합니다. 여기의 ‘쓴소리’는 문맥에 따라 보충한 표현이며, ‘쓰디쓴 일을 듣게 될 것입니다’로도 옮길 수 있습니다.
    reason: lexical_alternative
