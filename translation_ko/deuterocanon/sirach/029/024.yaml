  yaml_path: translation/deuterocanon/sirach/029/024.yaml
  text: A miserable life is to go from house to house[a], and where one stays as a stranger[b], he will not open his mouth.
  footnotes:
  - marker: a
    text: Or 'A wretched life is from house to house'; the Greek can be read more literally, but the sense is of insecure wandering from one household to another.
    reason: lexical_alternative
  - marker: b
    text: '''Stays as a stranger'' translates a verb for residing as a sojourner or outsider, not as a settled member of the household.'
    reason: cultural_note
translation:
  language: ko
  text: 비참한 삶은 집에서 집으로 떠도는 것이며, 나그네로 머무는 곳에서는 입을 열지 않습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘비참한 삶’은 ζωὴ πονηρά를 도덕적 ‘악한 삶’보다 불안정하고 궁핍한 삶으로 읽은 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘나그네로’는 παροικήσει가 정주민이 아닌 외부인으로 잠시 머무는 상태를 가리킨다는 점을 반영합니다.
    reason: cultural_note
lexical_decisions:
- source_word: ζωὴ πονηρά
  english_pob_choice: a miserable life
  chosen_korean: 비참한 삶
  alternatives_korean:
  - 악한 삶
  - 고통스러운 삶
  - 불쌍한 삶
  lexicon: LSJ
  rationale: 여기서 πονηρά는 도덕적 악보다 삶의 곤궁함과 비참함을 가리키므로, 문맥에 맞게 ‘비참한 삶’으로 옮겼습니다.
- source_word: ἐξ οἰκίας εἰς οἰκίαν
  english_pob_choice: to go from house to house
  chosen_korean: 집에서 집으로 떠도는 것
  alternatives_korean:
  - 집에서 집으로 다니는 것
  - 한 집에서 다른 집으로 옮겨 다니는 것
  lexicon: LSJ
  rationale: 문구의 반복된 ‘집’ 이미지를 살리되, 불안정한 거처 이동이라는 뜻이 드러나도록 ‘떠도는 것’으로 자연스럽게 표현했습니다.
- source_word: παροικήσει
  english_pob_choice: stays as a stranger
  chosen_korean: 나그네로 머무는 곳에서는
  alternatives_korean:
  - 이방인으로 머무는 곳에서는
  - 손님처럼 머무는 곳에서는
  - 거류민으로 사는 곳에서는
  lexicon: LSJ
  rationale: παροικέω는 단순 거주가 아니라 정착하지 못한 채 외부인으로 머무는 뜻이므로, ‘나그네로’가 그 사회적 소외를 가장 잘 드러냅니다.
- source_word: οὐκ ἀνοίξει στόμα
  english_pob_choice: he will not open his mouth
  chosen_korean: 입을 열지 않습니다
  alternatives_korean:
  - 입을 열지 못합니다
  - 말을 하지 않습니다
  - 감히 입을 열지 않습니다
  lexicon: LSJ
  rationale: 그리스어의 관용적 표현을 한국어에서도 직역에 가깝게 살리면서, 발화의 위축을 자연스럽게 전달했습니다.
