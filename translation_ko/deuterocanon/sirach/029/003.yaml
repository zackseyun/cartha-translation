translation:
  language: ko
  text: 당신의 말을 굳게 지키고, 그에게 신실하십시오. 그러면 언제나 필요한 것을 얻을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그와의 관계에서 당신의 약속에 신실하십시오’로도 옮길 수 있습니다. 여기서 ‘그에게’는 더 추상적으로는 당신이 약속한 말이나 합의를 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: στερέωσον λόγον
  english_pob_choice: Keep your word
  chosen_korean: 당신의 말을 굳게 지키고
  alternatives_korean:
  - 당신의 말을 확고히 하고
  - 당신의 약속을 지키고
  - 당신의 말을 굳게 하십시오
  lexicon: LSJ
  rationale: στερέωσον은 ‘굳게 하다, 확고하게 하다’의 뜻이므로, 문맥상 약속이나 언약적 발언을 ‘굳게 지키다’로 옮기면 원문의 견고함을 살리면서 자연스러운 한국어가 됩니다.
- source_word: λόγον
  english_pob_choice: word
  chosen_korean: 말
  alternatives_korean:
  - 약속
  - 말씀
  - 합의
  lexicon: LSJ
  rationale: λόγος는 여기서 구두로 한 약속이나 책임 있는 말을 가리키므로, ‘말’이 가장 직접적이며 문맥이 이를 약속으로 이해하게 합니다.
- source_word: πιστώθητι
  english_pob_choice: be faithful
  chosen_korean: 신실하십시오
  alternatives_korean:
  - 믿음직하게 행동하십시오
  - 신뢰할 만하게 되십시오
  - 충실하십시오
  lexicon: LSJ
  rationale: πιστόω 계열의 명령은 신뢰할 만하게, 충실하게 행동하라는 뜻이므로 ‘신실하십시오’가 도덕적·관계적 충실성을 간결하게 드러냅니다.
- source_word: μετʼ αὐτοῦ
  english_pob_choice: with him
  chosen_korean: 그에게
  alternatives_korean:
  - 그와 함께
  - 그를 향해
  - 그와의 관계에서
  lexicon: LSJ
  rationale: 직역하면 ‘그와 함께’이지만, 한국어에서는 신의를 지키는 상대를 향한 관계를 ‘그에게’로 풀어 주는 것이 가장 자연스럽습니다.
theological_decisions:
- issue: 관계적 신의와 약속 준수의 강조
  chosen_reading: 본절은 금전 거래의 기술적 조언을 넘어서, 약속을 굳게 지키는 신실함을 지혜 교훈으로 제시합니다.
  alternative_readings:
  - 단순한 계약 이행 지침으로만 읽는 해석
  - 일반적인 성실성 권면으로만 약화시키는 해석
  rationale: 문맥상 ‘말을 굳게 지키고’와 ‘신실하십시오’는 상호 신뢰를 요구하는 윤리적 명령으로 함께 읽는 것이 원문과 영어 POB의 의도를 가장 잘 반영합니다.
  doctrine_reference: 잠언/집회서의 지혜 윤리
