  rationale: 앞절과의 대비를 살리면서도, 문맥상 예외적 권고를 여는 뉘앙스를 한국어에서 자연스럽게 드러냅니다.
- source_word: ἐπὶ ταπεινῷ
  english_pob_choice: with the humble
  chosen_korean: 겸손한 사람에게는
  alternatives_korean:
  - 낮은 사람에게는
  - 겸손한 이에게는
  - 비천한 자에게는
  lexicon: LSJ
  rationale: ταπεινός는 ‘낮은/겸손한/비천한’의 범위를 가지므로, 구제와의 연결 속에서도 한국어에서 지나치게 사회적 계층만으로 좁히지 않는 ‘겸손한 사람’이 본문을 무난하게 반영합니다.
- source_word: μακροθύμησον
  english_pob_choice: be patient
  chosen_korean: 오래 참으십시오
  alternatives_korean:
  - 인내하십시오
  - 참으십시오
  - 오래 참고 기다리십시오
  lexicon: BDAG
  rationale: 단순한 기다림보다 인내와 관용을 포함하는 명령형이므로, 현대 한국어에서 직접적이고 힘 있는 ‘오래 참으십시오’로 옮겼습니다.
- source_word: ἐλεημοσύνην
  english_pob_choice: almsgiving
  chosen_korean: 구제
  alternatives_korean:
  - 자선
  - 구호
  - 시혜
  lexicon: LSJ
  rationale: 유대-헬라어 문맥의 ἐλεημοσύνη는 추상적 ‘긍휼’보다 실제 나눔 행위인 알름스/자선에 가깝기 때문에, 한국어 성서어법에서 그 행위를 잘 드러내는 ‘구제’로 번역했습니다.
- source_word: μὴ παρελκύσῃς αὐτόν
  english_pob_choice: do not keep him waiting
  chosen_korean: 그를 기다리게 하지 마십시오
  alternatives_korean:
  - 그를 지체시키지 마십시오
  - 그 일을 미루지 마십시오
  - 그를 오래 끌지 마십시오
  lexicon: LSJ
  rationale: 동사는 ‘지연시키다/끌다’의 뜻이지만 목적어가 사람이며 구제 맥락에 있으므로, 행위의 대상이 되는 사람을 자연스럽게 살린 표현으로 옮겼습니다.
