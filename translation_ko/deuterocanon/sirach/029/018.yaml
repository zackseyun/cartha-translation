  yaml_path: translation/deuterocanon/sirach/029/018.yaml
  text: Surety has destroyed many who were upright[a], and has shaken them like a wave of the sea; it has driven mighty men from their homes, and they wandered among foreign nations.
  footnotes:
  - marker: a
    text: Or 'Guarantee' or 'standing surety.' The Greek term refers to becoming security for another person's debt.
    reason: lexical_alternative
translation:
  language: ko
  text: 보증은 바른 길을 가던 많은 이들을 망하게 했고[a], 바다의 파도처럼 그들을 뒤흔들었습니다. 또 힘 있는 남자들을 그들의 집에서 몰아냈고, 그들은 낯선 민족들 가운데서 떠돌았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘남의 빚에 대하여 보증을 서는 일’ 또는 ‘보증 채무’. 이 그리스어 단어는 다른 사람의 빚에 대하여 보증인이 되는 행위나 상태를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγγύη
  english_pob_choice: Surety
  chosen_korean: 보증
  alternatives_korean:
  - 연대보증
  - 보증을 서는 일
  - 담보 제공
  lexicon: LSJ
  rationale: 이 단어는 타인의 빚에 대해 보증인이 되는 법적·금융적 행위를 가리키므로, 한국어에서도 핵심 의미를 직접 드러내는 ‘보증’이 가장 간결합니다.
- source_word: κατευθύνοντας
  english_pob_choice: who were upright
  chosen_korean: 바르게 걸어가던
  alternatives_korean:
  - 곧게 가던
  - 정직하던
  - 번성하던
  lexicon: LSJ
  rationale: 직역상 ‘곧게 나아가다’의 뜻이어서, 도덕적·생활상의 곧음과 진행의 이미지를 함께 살리는 ‘바르게 걸어가던’이 적절합니다.
- source_word: ἀπῴκισεν
  english_pob_choice: has driven ... from their homes
  chosen_korean: 그들의 집에서 몰아냈고
  alternatives_korean:
  - 그들을 추방했고
  - 그들을 이주시켰고
  - 그들의 거처에서 내쫓았고
  lexicon: LSJ
  rationale: 이 동사는 거처나 고향에서 떼어내 보내는 뜻이므로, 결과적 유배감이 드러나도록 ‘몰아냈고’로 옮겼습니다.
- source_word: ἐπλανήθησαν ἐν ἔθνεσιν ἀλλοτρίοις
  english_pob_choice: they wandered among foreign nations
  chosen_korean: 낯선 민족들 가운데서 떠돌았습니다
  alternatives_korean:
  - 이방 민족들 가운데서 방황했습니다
  - 낯선 나라들 가운데서 떠돌았습니다
  - 외국 민족들 가운데서 헤맸습니다
  lexicon: LSJ
  rationale: 여기서는 도덕적 ‘미혹’보다 타지에서의 실제적 유랑이 핵심이므로, 유배 후의 방랑감을 살리는 ‘떠돌았습니다’가 자연스럽습니다.
theological_decisions:
- issue: κατευθύνοντας의 의미를 ‘upright’로 둘지 ‘prospering’로 둘지
  chosen_reading: ‘바르게 걸어가던’으로 처리해 도덕적 곧음과 진행의 이미지를 살렸습니다.
  alternative_readings:
  - 번성하던
  - 형통하던
  - 곧게 가던
  rationale: 그리스어 분사는 곧은 길로 나아가는 사람들을 가리키며, POB의 revised note도 ‘upright’ 쪽을 지지합니다. 따라서 단순한 번영보다 삶의 방향성과 의로움이 보이도록 옮기는 것이 본문에 더 가깝습니다.
  doctrine_reference: Sirach 29:18 source-language judgment
- issue: ἄνδρας δυνατούς의 남성 표지 유지
  chosen_reading: ‘힘센 사람들’로 옮겨 ἄνδρας의 남성 표지를 유지했습니다.
  alternative_readings:
  - 힘센 이들
  - 강한 사람들
  - 강한 자들
  rationale: 그리스어는 보편적 인간이 아니라 남성 복수형을 사용하므로, 성별 표지를 지우지 않으면서도 한국어에서 과도하게 어색하지 않은 표현을 택했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
