  lexicon: LSJ
  rationale: 지혜 문학의 비교 구문을 한국어에서 자연스러운 우선 비교 표현으로 옮겼습니다.
- source_word: βίος πτωχοῦ
  english_pob_choice: the life of a poor man
  chosen_korean: 가난한 사람이 사는 삶
  alternatives_korean:
  - 가난한 사람의 삶
  - 빈자의 삶
  lexicon: LSJ
  rationale: βίος는 단순한 생계가 아니라 삶 전체를 가리키므로, 한국어에서도 생활의 형편이 아니라 ‘사는 삶’의 의미를 살렸습니다.
- source_word: ὑπὸ σκέπην δοκῶν
  english_pob_choice: under shelter
  chosen_korean: 지붕 아래에서
  alternatives_korean:
  - 보호 아래에서
  - 거처 아래에서
  - 덮개 아래에서
  lexicon: LSJ
  rationale: 직역하면 표현이 어색해질 수 있어, 본문의 보호와 거처 이미지를 한국어 속담체에 맞게 ‘지붕 아래’로 풀었습니다. English POB가 지적한 δοκῶν의 난점은 본문 전체의 의미로 반영했습니다.
- source_word: ἐν ἀλλοτρίοις
  english_pob_choice: in another's house
  chosen_korean: 남의 집에서
  alternatives_korean:
  - 남의 집 안에서
  - 타인의 집에서
  - 남의 것 안에서
  lexicon: LSJ
  rationale: ἐν ἀλλοτρίοις는 ‘다른 사람에게 속한 곳/것들’의 뜻이므로, 식사와 거처 문맥에서 자연스럽게 ‘남의 집에서’로 옮겼습니다.
- source_word: ἐδέσματα λαμπρὰ
  english_pob_choice: splendid food
  chosen_korean: 화려한 음식
  alternatives_korean:
  - 호화로운 음식
  - 진수성찬
  - 성대한 음식
  lexicon: LSJ
  rationale: ἐδέσματα는 차린 음식이나 음식상 자체를 가리키고, λαμπρά는 빛남에서 나온 화려함·호화로움을 뜻하므로, 간결하게 ‘화려한 음식’으로 옮겼습니다.
theological_decisions:
- issue: 본문의 난해한 분사 δοκῶν 처리
  chosen_reading: 구절의 잠언적 의미를 해치지 않도록 ‘지붕 아래에서 사는 삶’으로 자연스럽게 풀어, 뜻은 살리되 난구는 과도하게 드러내지 않았습니다.
  alternative_readings:
  - ‘보이는 듯한’
  - ‘여겨지는’
  - ‘생각되는’
  rationale: 전승 본문은 통상적인 의미로 읽기 어렵지만, POB의 영어 주석처럼 속담의 요지를 우선해야 하므로 한국어 본문은 매끄러운 비교 구문으로 제시했습니다.
  doctrine_reference: 지혜문학 번역 원칙
- issue: ‘남의 집’의 사회적 거리감
  chosen_reading: ‘남의 집에서’로 옮겨, 타인의 호의나 의존 위에 놓인 식사의 긴장을 분명하게 했습니다.
  alternative_readings:
  - ‘남의 집 안에서’
  - ‘남의 집들에서’
  - ‘남의 것 가운데서’
  rationale: 본문의 대조는 소박한 자립과 타인 소유 공간에서의 호사스러운 의존을 대비하므로, 한국어에서도 그 긴장을 유지하는 것이 중요합니다.
  doctrine_reference: 잠언적 대조법
