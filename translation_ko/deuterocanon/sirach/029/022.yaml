  source_fidelity: 핵심 대조(가난한 이의 안전한 거처에서의 삶과 타인의 소유 공간에서 누리는 호화로운 음식)는 대체로 충실합니다. 다만 ‘화려한 음식과 함께하는 것’은 ἐδέσματα λαμπρά를 먹는 행위가 아니라 음식과 동행하는 듯한 뜻으로 바꾸므로 수정이 필요합니다. δοκῶν의 난점은 본문과 각주에서 적절히 보존할 수 있습니다.
  naturalness: ‘가난한 사람이 지붕 아래에서 사는 삶’은 다소 중복되지만 이해 가능하며, ‘가난한 사람이 지붕 아래에서 사는 삶이’로 유지할 수 있습니다. 그러나 ‘음식과 함께하는 것’은 현대 한국어에서 이 문맥에 자연스럽지 않고 뜻도 부정확합니다. ‘호화로운 음식을 먹는 것’이 자연스럽습니다.
  terminology: ‘지붕 아래’는 ὑπὸ σκέπην의 거처·보호 이미지를 무리 없이 살립니다. λαμπρά는 ‘호화로운’이 음식과 결합할 때 ‘화려한’보다 더 자연스럽습니다. ἐν ἀλλοτρίοις를 문맥상 ‘남의 집에서’로 옮기되, 타인의 소유물/공간이라는 더 넓은 가능성은 각주로 밝혀야 합니다.
