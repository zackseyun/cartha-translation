  text: Many have regarded a loan as a windfall[a], and have caused trouble for those who helped them.
  footnotes:
  - marker: a
    text: Literally, 'as a find' or 'as something found'—that is, as if the borrowed money were an unexpected gain rather than something to be repaid.
    reason: lexical_alternative
translation:
  language: ko
  text: 많은 이들이 융자를 횡재처럼 여겼고[a], 그것을 도와준 이들에게 고통을 안겼습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘찾은 것처럼’ 또는 ‘찾아낸 것처럼’이라는 뜻입니다. 곧 빌린 돈을 갚아야 할 대상이 아니라 예상치 못한 이득처럼 여겼다는 말입니다.
    reason: lexical_alternative
