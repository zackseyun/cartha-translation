  text: Many have regarded a loan as a windfall[a], and have caused trouble for those who helped them.
  footnotes:
  - marker: a
    text: Literally, 'as a find' or 'as something found'—that is, as if the borrowed money were an unexpected gain rather than something to be repaid.
    reason: lexical_alternative
translation:
  language: ko
  text: 많은 사람이 대출금을 횡재처럼 여겼고[a], 자신들을 도와준 이들에게 고통을 안겼습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘찾아낸 것처럼’ 또는 ‘찾은 것처럼’이라는 뜻입니다. 곧 빌린 돈을 갚아야 할 돈이 아니라 뜻밖에 얻은 이득처럼 여겼다는 말입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  english_pob_choice: Many
  chosen_korean: 많은 이들
  alternatives_korean:
  - 많은 사람들
  - 여러 사람들
  lexicon: LSJ
  rationale: 불특정 다수를 자연스럽게 가리키면서도 현대 한국어에서 읽기 쉬운 표현으로 옮겼습니다.
- source_word: ὡς εὕρεμα
  english_pob_choice: as a windfall
  chosen_korean: 횡재처럼
  alternatives_korean:
  - 찾은 것처럼
  - 뜻밖의 이득처럼
  - 주운 것처럼
  lexicon: LSJ
  rationale: εὕρεμα의 핵심은 ‘찾아 얻은 것/우연히 얻은 것’인데, 여기서는 빚진 돈을 돌려야 할 대상이 아니라 공짜 이익처럼 여기는 태도를 나타내므로 ‘횡재처럼’이 문맥상 가장 가깝습니다.
- source_word: δάνος
  english_pob_choice: a loan
  chosen_korean: 융자
  alternatives_korean:
  - 대출
  - 빌린 돈
  - 차용금
  lexicon: LSJ
  rationale: δάνος는 단순한 ‘빚’보다 ‘빌려 준 금전’ 자체를 가리키므로, 현대 한국어에서 문맥이 분명한 ‘융자’를 택했습니다.
- source_word: παρέσχον πόνον
  english_pob_choice: have caused trouble
  chosen_korean: 고통을 안겼습니다
  alternatives_korean:
  - 고통을 주었습니다
  - 괴로움을 끼쳤습니다
  - 번거롭게 했습니다
  lexicon: LSJ
  rationale: 직역하면 ‘고통을 제공했다’이지만 한국어에서는 ‘고통을 안기다’가 원문의 부정적 결과를 자연스럽게 살립니다.
- source_word: τοῖς βοηθήσασιν αὐτοῖς
  english_pob_choice: for those who helped them
  chosen_korean: 그것을 도와준 이들에게
  alternatives_korean:
  - 자신들을 도와준 이들에게
  - 그들을 도운 이들에게
  - 그들에게 도움을 준 이들에게
  lexicon: LSJ
  rationale: 분사구는 빌려준 사람들, 곧 도와준 이들을 가리키며, 관계를 과장하지 않으면서도 한국어로 간결하게 풀었습니다.
