  rationale: 직역하면 ‘고통을 제공했다’이지만 한국어에서는 ‘고통을 안기다’가 원문의 부정적 결과를 자연스럽게 살립니다.
- source_word: τοῖς βοηθήσασιν αὐτοῖς
