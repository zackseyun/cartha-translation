  text: 'These things are grievous to a man who has understanding: the reproach of a household and the insult of a lender.'
translation:
  language: ko
  text: 이것들은 분별이 있는 사람에게는 무거운 짐입니다. 곧 집안의 책망과 채권자의 모욕입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βαρέα ταῦτα
  english_pob_choice: These things are grievous
  chosen_korean: 이것들은 무거운 짐입니다
  alternatives_korean:
  - 이것들은 괴롭습니다
  - 이것들은 고통스럽습니다
  lexicon: βαρύς
  rationale: 사물 자체가 ‘무겁다’는 기본 뜻을 살리되, 문맥상 감정적 고통까지 함께 드러내기 위해 ‘무거운 짐’으로 옮겼습니다.
- source_word: ἀνθρώπῳ ἔχοντι φρόνησιν
  english_pob_choice: to a man who has understanding
  chosen_korean: 이해가 있는 사람에게는
  alternatives_korean:
  - 분별이 있는 사람에게는
  - 지혜가 있는 사람에게는
  lexicon: φρόνησις
  rationale: φρόνησις의 핵심을 ‘이해/분별’로 보되, 한국어에서 자연스럽고 과도하게 종교화되지 않는 표현으로 다듬었습니다.
- source_word: ἐπιτίμησις οἰκίας
  english_pob_choice: the reproach of a household
  chosen_korean: 집안의 책망
  alternatives_korean:
  - 가문의 책망
  - 집안의 수치
  lexicon: ἐπιτίμησις
  rationale: ἐπιτίμησις를 단순한 비난보다 더 직접적인 ‘책망’으로 살리고, οἰκία를 가정/가문이 아니라 문맥에 맞게 ‘집안’으로 옮겼습니다.
- source_word: ὀνειδισμὸς δανιστοῦ
  english_pob_choice: the insult of a lender
  chosen_korean: 채권자의 모욕
  alternatives_korean:
  - 빌려주는 이의 모욕
  - 대부업자의 조롱
  lexicon: ὀνειδισμός
  rationale: POB의 ‘insult’를 따라 ὀνειδισμός를 ‘모욕’으로 번역했고, δανιστής는 단순한 ‘빌려주는 사람’보다 채무 관계를 분명히 하는 ‘채권자’로 옮겼습니다.
theological_decisions:
- issue: 본문의 평가적 진술을 한국어에서 어떻게 강도를 유지할지
  chosen_reading: ‘무거운 짐’과 ‘모욕’으로 옮겨, 지혜로운 사람이 느끼는 수치와 압박의 강도를 약화하지 않았습니다.
  alternative_readings:
  - ‘괴로운 일들’로 완화하기
  - ‘수치’ 중심으로 옮기기
  rationale: 집안의 책망과 채권자의 모욕은 단순 불쾌감보다 사회적 압박과 체면 손상을 포함하므로, 원문의 무게를 유지하는 표현이 적절합니다.
  doctrine_reference: 지혜문학의 사회적·윤리적 경고를 보존하는 번역 원칙
