translation:
  language: ko
  text: 많은 이들이 악 때문에 돌아섰습니다. 그들은 헛되이 빼앗길까 두려워했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘많은 이들이 악 때문에 물러섰습니다. 그들은 아무 까닭 없이 빼앗길까 두려워했습니다.’
    reason: ἀπέστρεψαν은 ‘물러서다/외면하다’로도, δωρεάν은 ‘아무 까닭 없이’로도 옮길 수 있습니다.
lexical_decisions:
- source_word: πολλοὶ
  english_pob_choice: Many
  chosen_korean: 많은 사람
  alternatives_korean:
  - 많은 이들
  - 많은 이
  lexicon: LSJ
  rationale: 정관사 없는 복수 주어를 한국어에서 자연스럽게 풀어 주되, 의미를 과도하게 좁히지 않기 위해 ‘많은 사람’으로 옮겼습니다.
- source_word: χάριν πονηρίας
  english_pob_choice: because of wickedness
  chosen_korean: 악함 때문에
  alternatives_korean:
  - 악 때문에
  - 악행 때문에
  - 사악함 때문에
  lexicon: LSJ
  rationale: χάριν + 속격은 원인/이유를 나타내므로 ‘때문에’로 처리했고, πονηρία의 윤리적 악성을 살리되 문맥상 가장 직접적인 ‘악함’을 택했습니다.
- source_word: ἀπέστρεψαν
  english_pob_choice: turned away
  chosen_korean: 돌아섰습니다
  alternatives_korean:
  - 물러섰습니다
  - 돌이켰습니다
  - 외면했습니다
  lexicon: LSJ
  rationale: 여기서는 단순한 물리적 방향 전환보다 도움이나 관여를 거절하고 물러나는 뉘앙스가 있어 ‘돌아섰습니다’가 자연스럽습니다.
- source_word: ἀποστερηθῆναι δωρεὰν
  english_pob_choice: being defrauded gratuitously
  chosen_korean: 공짜로 속임을 당할까
  alternatives_korean:
  - 아무 대가 없이 속임을 당할까
  - 헛되이 빼앗길까
  - 아무 이유 없이 빼앗길까
  lexicon: LSJ
  rationale: ἀποστερέω는 ‘빼앗다/착복하다’의 피해를 가리키지만, 문맥상 금전 거래에서의 기만을 포함하므로 ‘속임을 당하다’로 옮겼고, δωρεάν은 ‘공짜로/아무 대가 없이’의 무상성을 살렸습니다.
- source_word: εὐλαβήθησαν
  english_pob_choice: were afraid
  chosen_korean: 두려워했습니다
  alternatives_korean:
  - 조심했습니다
  - 꺼려했습니다
  - 경계했습니다
  lexicon: LSJ
  rationale: 여기서는 경건한 신중함보다 실제적인 두려움이 핵심이므로, 감정을 직접 드러내는 ‘두려워했습니다’가 가장 분명합니다.
theological_decisions:
- issue: 공짜로에 해당하는 δωρεάν의 경제적·법적 뉘앙스
  chosen_reading: 공짜로
  alternative_readings:
  - 아무 대가 없이
  - 헛되이
  - 무상으로
  rationale: 이 절은 자선보다 대여/거래 상황에서의 손실 우려를 말하므로, ‘공짜로’가 무상성과 속임의 위험을 가장 직관적으로 드러냅니다.
  doctrine_reference: 지혜문학의 사회윤리적 경고를 현대 한국어로 직접 전달하는 번역 원칙
