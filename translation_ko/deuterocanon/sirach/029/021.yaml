  text: 삶의 시작은 물과 빵과 옷이며, 수치를 가리는 집입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘벌거벗음이나 수치스러움을 가리는 집’. 그리스어는 일반적인 수치뿐 아니라 가려져야 할 신체의 노출을 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀρχὴ
  english_pob_choice: The beginning
  chosen_korean: 시작
  alternatives_korean:
  - 기초
  - 근본
  - 첫째
  lexicon: LSJ
  rationale: ἀρχή는 시작, 근원, 첫 원리 등으로 넓게 쓰이지만, 이 격언문에서는 기본 생활의 출발점을 가리키므로 ‘시작’이 가장 직접적이고 자연스럽습니다.
- source_word: ζωῆς
  english_pob_choice: of life
  chosen_korean: 삶의
  alternatives_korean:
  - 생명의
  - 생활의
  lexicon: LSJ
  rationale: 생존의 필수 요소를 열거하는 문맥이므로 ‘삶의’가 가장 매끄럽게 ἀρχὴ ζωῆς의 결합을 살립니다.
- source_word: ἄρτος
  english_pob_choice: bread
  chosen_korean: 빵
  alternatives_korean:
  - 떡
  - 양식
  lexicon: LSJ
  rationale: ἄρτος는 문자적으로 빵이므로 기본 식량의 구체성을 살려 ‘빵’으로 옮겼습니다.
- source_word: οἶκος καλύπτων ἀσχημοσύνην
  english_pob_choice: a house covering shame
  chosen_korean: 수치를 가리는 집
  alternatives_korean:
  - 벌거벗음을 가리는 집
  - 치욕을 덮는 집
  - 부끄러움을 가리는 집
  lexicon: LSJ
  rationale: 칼뤼프톤(covering)은 현재분사로 집의 기능을 묘사하므로 ‘가리는’으로 살렸고, ἀσχημοσύνην은 수치/부끄러움의 사회·도덕적 뉘앙스를 함께 지니므로 ‘수치’가 가장 균형적입니다.
theological_decisions:
- issue: ἀσχημοσύνην의 의미 범위
  chosen_reading: 본문의 마지막 구절을 ‘수치를 가리는 집’으로 두어, 단순한 신체 노출만이 아니라 사회적·도덕적 수치까지 포괄하게 했습니다.
  alternative_readings:
  - 벌거벗음을 가리는 집
  - 부끄러움을 가리는 집
  rationale: 영어 POB가 관련 의미를 흔들지 않기 위해 footnote로 넓은 의미를 보존했듯, 한국어 본문도 한쪽으로 과도하게 좁히지 않고 다의성을 유지하는 것이 적절합니다.
  doctrine_reference: 지혜문학의 절제된 격언 표현
