  text: 이웃을 네 능력에 따라 도우십시오. 그리고 넘어지지 않도록 자신을 살피십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문은 위험의 대상을 특정하지 않으므로, ‘불행에 빠질까 봐’ 또는 ‘덫에 걸릴까 봐’로도 옮길 수 있습니다.
