  - 걸려들지 않도록
  - 넘어지게 되지 않도록
  lexicon: BDAG
  rationale: 그리스어가 위험의 대상을 특정하지 않으므로, POB의 열린 경고를 유지하면서도 한국어로는 ‘fall’의 기본 이미지를 자연스럽게 살렸습니다.
theological_decisions:
- issue: 경고의 대상이 불특정인 점
  chosen_reading: 도움을 베푸는 가운데 자신도 ‘넘어질’ 수 있다는 일반적 경고로 유지했습니다.
  alternative_readings:
  - 불행에 빠질까 봐
  - 덫에 걸릴까 봐
  rationale: 원문은 ἐμπέσῃς의 목적어를 제시하지 않으므로, 특정한 불행이나 도덕적 함정으로 좁히지 않고 POB의 불특정 경고를 보존했습니다.
  doctrine_reference: '번역 원칙: 본문이 실제로 열어 둔 모호성은 한국어에서도 유지'
