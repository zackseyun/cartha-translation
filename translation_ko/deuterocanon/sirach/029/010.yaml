    text: 또는 ‘돌 아래에서 녹슬거나 부식되어 쓸모없게 되게 하지 마십시오.’ 이 동사는 어렵고, 문맥상 감춰 둔 돈이 사용되지 못해 망가지는 뜻입니다.
    reason: lexical_alternative
