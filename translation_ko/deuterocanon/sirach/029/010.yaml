  text: Lose silver for a brother and a friend[a], and do not let it rust under a stone to destruction.
  footnotes:
  - marker: a
    text: Or 'Do not let it corrode under a stone into ruin.' The Greek verb in this clause is difficult, and the sense is that hoarded money deteriorates or is wasted when hidden away instead of used to help others.
