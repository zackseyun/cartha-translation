  - ‘낭비하지 마십시오’로 도덕화하기
  rationale: 문맥은 재물의 절제보다 타인을 위한 기꺼운 손실을 강조하므로, 원문의 역설과 경고를 약화하지 않는 번역이 필요합니다.
  doctrine_reference: 지혜문학의 자비와 나눔, 재물 사용에 대한 윤리
