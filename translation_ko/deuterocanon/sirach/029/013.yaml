  chosen_korean: 그것이
  alternatives_korean:
  - 그가
  - 그것
  - 그 일은
  lexicon: Greek grammar/context
  rationale: 그리스어는 주어를 반복하지 않으므로, 앞절의 칭송 대상이 의인화되어 싸우는 문맥을 살리면서도 특정 대상을 단정하지 않기 위해 중립적 ‘그것이’로 두었습니다.
