translation:
  language: ko
  text: 강한 방패보다도 힘센 창보다도 더, 적과 맞서 당신을 위하여 싸울 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 여기서 ‘싸울 것입니다’의 주어를 명시하지 않습니다. 앞절에서 칭송된 대상이 의인화되어 당신을 위하여 싸우는 뜻입니다.
    reason: source_note
lexical_decisions:
- source_word: ὑπὲρ
  english_pob_choice: more than
  chosen_korean: 보다 더
  alternatives_korean:
  - 넘어
  - 이상으로
  - 위해
  lexicon: BDAG
  rationale: 비교 구문에서 우월성을 나타내므로 목적격적 ‘위해’보다 비교 의미를 살린 ‘보다 더’가 원문에 가깝습니다.
- source_word: ἀσπίδα κράτους
  english_pob_choice: strong shield
  chosen_korean: 강한 방패
  alternatives_korean:
  - 힘센 방패
  - 튼튼한 방패
  lexicon: LSJ
  rationale: κράτους는 힘/강함의 성격을 더하는 속격으로 보이며, 자연스러운 현대 한국어에서는 ‘강한 방패’가 가장 간결하게 대응합니다.
- source_word: δόρυ ἀλκῆς
  english_pob_choice: mighty spear
  chosen_korean: 힘센 창
  alternatives_korean:
  - 강한 창
  - 용맹한 창
  lexicon: LSJ
  rationale: ἀλκή는 힘과 기백을 함께 띠는 말이지만, 군사적 병렬을 살리면서도 현대어로는 ‘힘센 창’이 가장 직접적입니다.
- source_word: κατέναντι ἐχθροῦ
  english_pob_choice: against an enemy
  chosen_korean: 적 앞에서
  alternatives_korean:
  - 원수 앞에서
  - 적에 맞서
  - 원수에 맞서
  lexicon: BDAG
  rationale: 전치사구는 적대적 대치 상황을 가리키므로 ‘적 앞에서’가 전투적 대립과 서술의 흐름을 함께 살립니다.
- source_word: πολεμήσει ὑπὲρ σοῦ
  english_pob_choice: it will fight for you
  chosen_korean: 당신을 위해 싸워 줄 것입니다
  alternatives_korean:
  - 당신 편에서 싸울 것입니다
  - 당신을 대신하여 싸울 것입니다
  lexicon: BDAG
  rationale: ὑπὲρ σοῦ는 수혜/대리의 뜻이므로 ‘당신을 위해’로 옮기되, 미래 동사 πολεμήσει는 직접적으로 ‘싸워 줄 것입니다’로 번역했습니다.
- source_word: implicit subject of πολεμήσει
  english_pob_choice: it
  chosen_korean: 그것이
  alternatives_korean:
  - 그가
  - 그것
  - 그 일은
  lexicon: Greek grammar/context
  rationale: 그리스어는 주어를 반복하지 않으므로, 앞절의 칭송 대상이 의인화되어 싸우는 문맥을 살리면서도 특정 대상을 단정하지 않기 위해 중립적 ‘그것이’로 두었습니다.
theological_decisions:
- issue: 의인화된 주어의 불확정성
  chosen_reading: 앞절에서 이어지는 칭송 대상이 의인화되어 싸우는 것으로 두고, 한국어 본문에서도 그 불확정성을 유지했습니다.
  alternative_readings:
  - 그것이 아니라 당신의 자비가 싸워 줄 것입니다
  - 그것이 아니라 당신의 보증이 싸워 줄 것입니다
  rationale: 원문은 주어를 다시 밝히지 않으므로, 문맥상 가능한 선행사를 본문에 확정적으로 넣지 않고 열린 상태로 두는 것이 원문 충실성과 해석의 긴장을 보존합니다.
  doctrine_reference: 원문 우선 원칙과 해석적 긴장 보존
