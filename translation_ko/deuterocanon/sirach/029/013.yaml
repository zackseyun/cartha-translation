translation:
  language: ko
  text: 강한 방패보다, 그리고 힘센 창보다 더, 그것이 적 앞에서 당신을 위해 싸워 줄 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 여기서 주어를 반복하지 않으므로, 앞절에서 칭송된 대상이 의인화되어 싸우는 뜻입니다. 문맥상 가능한 확대 표현으로는 ‘당신의 친절’이나 ‘당신의 보증’이 있습니다.
    reason: source_note
