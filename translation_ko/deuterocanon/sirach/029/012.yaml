lexical_decisions:
- source_word: σύγκλεισον
  english_pob_choice: Store up
  chosen_korean: 쌓아 두십시오
  alternatives_korean:
  - 간직하십시오
  - 저장해 두십시오
  - 봉해 두십시오
  lexicon: LSJ
  rationale: 직역하면 ‘안에 가두다/봉하다’이지만, 보관해 두는 이미지가 문맥상 자연스럽기 때문에 ‘쌓아 두다’로 옮겨 보존의 뉘앙스를 살렸습니다.
- source_word: ἐλεημοσύνην
  english_pob_choice: almsgiving
  chosen_korean: 구제
  alternatives_korean:
  - 자선
  - 자비
  - 구호
  lexicon: LSJ
  rationale: 헬레니즘 유대 문맥에서 빈자에게 베푸는 실제적 나눔을 가리키므로, 추상적인 ‘자비’보다 행위를 드러내는 ‘구제’가 가장 적절합니다.
- source_word: ἐν τοῖς ταμείοις σου
  english_pob_choice: in your treasuries
  chosen_korean: 네 곳간에
  alternatives_korean:
  - 네 창고에
  - 네 보물창고에
  - 네 방들에
  lexicon: LSJ
  rationale: ταμεῖον은 창고, 방, 보물창고 등을 뜻하지만, 귀중한 것을 보관하는 장소라는 비유를 살려 한국어로는 자연스러운 ‘곳간’이 잘 맞습니다.
- source_word: ἐξελεῖταί
  english_pob_choice: will rescue
  chosen_korean: 건져낼 것입니다
  alternatives_korean:
  - 구해낼 것입니다
  - 구출할 것입니다
  - 건져줄 것입니다
  lexicon: LSJ
  rationale: 위험이나 곤경에서 끌어내는 동작을 드러내기 위해 ‘건져내다’를 택했으며, ‘구원하다’보다 여기서는 더 구체적이고 문맥에 맞습니다.
theological_decisions:
- issue: 구제가 능동적으로 보호하는 것으로 진술되는 표현
  chosen_reading: 그러면 그것이 당신을 모든 고난에서 건져낼 것입니다
  alternative_readings:
  - 그러면 그것이 당신을 모든 악에서 건져낼 것입니다
  - 그러면 그것이 당신을 모든 고난에서 구해낼 것입니다
  rationale: 헬라어는 구제 행위에 보호 효력을 직접 돌리므로 그 긴장을 약화하지 않고 그대로 살렸습니다. κακώσεως는 도덕적 ‘악’보다 ‘고난/학대’의 의미가 더 자연스러워 ‘고난’을 택했습니다.
  doctrine_reference: 'DOCTRINE.md: Preserve theological tension rather than resolve it.'
