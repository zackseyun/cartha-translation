  text: Whoever touches pitch will have his hand stick to it[a], and whoever associates with a scoffer will learn his way.
  footnotes:
  - marker: a
    text: 'Greek parallel: ''He who touches pitch will be defiled, and he who has fellowship with a proud man will become like him.'' The Hebrew witness instead reads ''a scoffer'' and ''will learn his way.'''
    reason: alternative_reading
translation:
  language: ko
  text: 누구든지 역청을 만지는 사람은 손이 그것에 달라붙을 것이며, 조롱하는 자와 사귀는 사람은 그의 길을 배우게 될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 평행본문은 ‘역청을 만지는 자는 더럽혀질 것이며, 교만한 자와 교제하는 자는 그와 같아질 것이다’라고 읽습니다. 히브리어 본문 증인은 ‘조롱하는 자’와 ‘그의 길을 배운다’고 읽습니다.
    reason: textual_variant
lexical_decisions:
- source_word: נוֹגֵעַ בְּזֶפֶת
  english_pob_choice: Whoever touches pitch
  chosen_korean: 누구든지 역청을 만지는 자는
  alternatives_korean:
  - 누구든지 피치를 만지는 자는
  - 누구든지 타르를 만지는 자는
  lexicon: HALOT
  rationale: תִּדְבַּק와의 결합이 ‘달라붙다’라는 구체적 이미지를 강하게 만들므로, 한국어도 물질의 끈적임이 드러나는 ‘역청’으로 옮겼습니다. ‘누구든지 …하는 자는’은 히브리어 분사문의 일반적 격언성을 자연스럽게 살립니다.
- source_word: תִּדְבַּק יָדוֹ
  english_pob_choice: will have his hand stick to it
  chosen_korean: 손에 그것이 달라붙을 것이며
  alternatives_korean:
  - 손이 그것에 달라붙을 것이며
  - 그의 손이 달라붙을 것이며
  lexicon: HALOT
  rationale: 히브리어는 직역하면 ‘그의 손이 달라붙는다’이지만, 문맥상 대상은 앞의 역청이므로 ‘그것이 달라붙다’로 관계를 분명히 했습니다. POB의 영어처럼 ‘stick’의 구체적 감각을 유지했습니다.
- source_word: וְחוֹבֵר אֶל לֵץ
  english_pob_choice: whoever associates with a scoffer
  chosen_korean: 조롱하는 자와 사귀는 자는
  alternatives_korean:
  - 비웃는 자와 어울리는 자는
  - 조소하는 자와 교제하는 자는
  lexicon: HALOT
  rationale: לֵץ는 지혜문학에서 ‘조롱하는 자/비웃는 자’를 뜻하므로, 교회적 완곡어인 ‘오만한 자’보다 히브리어 어휘를 직접 반영한 ‘조롱하는 자’가 적절합니다. ‘사귀는’은 관계적 결합의 뉘앙스를 자연스럽게 전합니다.
- source_word: יִלְמַד דַּרְכּוֹ
  english_pob_choice: will learn his way
  chosen_korean: 그의 길을 배우게 됩니다
  alternatives_korean:
  - 그의 길을 배우게 될 것입니다
  - 그의 길을 익히게 됩니다
  lexicon: HALOT
  rationale: 히브리어는 단순히 닮는다는 뜻이 아니라 ‘그의 길’을 배운다고 말하므로, POB의 해석을 따르되 ‘배우다’로 직접 옮겨 도덕적 습관의 형성을 살렸습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 평행본문의 차이
  chosen_reading: 본문은 현존 히브리어를 따르되, 그리스어의 ‘더럽혀질 것이다/교만한 자’ 해석은 본문 주석 차원으로 남깁니다.
  alternative_readings:
  - 그리스어처럼 ‘만지는 자는 더럽혀질 것이며, 교만한 자와 교제하는 자는 그와 같아질 것이다’로 옮김
  rationale: 시락서에서는 히브리어가 남아 있을 때 이를 우선하는 원칙이 적용됩니다. 이 절은 히브리어와 그리스어가 같은 경구를 서로 다른 뉘앙스로 증언하므로, 본문은 히브리어를 따르고 차이는 주석으로 보존하는 것이 가장 투명합니다.
  doctrine_reference: 'PHILOSOPHY.md: Hebrew primacy where extant; DOCTRINE.md: preserve significant variants without flattening them.'
