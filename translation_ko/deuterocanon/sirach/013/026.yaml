  text: A man's heart changes his face, whether for good or for bad.
  footnotes:
  - marker: a
    text: The Greek parallel text differs notably here, reading along the lines of a cheerful face as the sign of a heart in good things, followed by a difficult clause about finding parables with labor. Because the Hebrew witness is extant and primary for this verse, the main text follows the Hebrew; the Greek confirms the general link between inner disposition and outward expression but not the exact wording.
    reason: textual_variant
translation:
  language: ko
  text: 사람의 마음은 좋든 나쁘든 그의 얼굴을 바꿉니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 병행 본문은 이 구절과 현저히 다릅니다. 대체로 ‘좋은 일들 가운데 있는 마음의 표지는 밝은 얼굴이다’라고 읽고, 이어 비유를 찾아내는 일과 수고를 수반하는 생각에 관한 난해한 구절을 덧붙입니다. 히브리어 전승이 남아 있으므로 본문은 히브리어를 따릅니다. 그리스어는 내면의 상태와 얼굴 표정의 연관이라는 일반적 주제는 보여 주지만, 정확한 문구는 뒷받침하지 않습니다.
    reason: textual_variant
lexical_decisions:
- source_word: לֵב
  english_pob_choice: heart
  chosen_korean: 마음
  alternatives_korean:
  - 심장
  - 중심
  - 내면
  lexicon: HALOT
  rationale: 히브리어 לֵב은 지혜문학에서 사고와 성향의 자리인 내적 인격을 가리키므로, 한국어로는 자연스럽고 의미 범위가 넓은 ‘마음’이 적절합니다.
- source_word: אֱנוֹשׁ
  english_pob_choice: man
  chosen_korean: 사람
  alternatives_korean:
  - 인간
  - 한 남자
  - 인자
  lexicon: HALOT
  rationale: אֱנוֹשׁ는 대표적 인간을 가리키는 일반 명사이므로, 성별을 과도하게 강조하지 않는 ‘사람’이 원문 기능을 잘 살립니다.
- source_word: יְשַׁנֵּא
  english_pob_choice: changes
  chosen_korean: 바꾸어 놓습니다
  alternatives_korean:
  - 변하게 합니다
  - 바꿉니다
  - 변모시킵니다
  lexicon: HALOT
  rationale: 원문의 동사는 내적 상태가 외적 얼굴에 미치는 변화를 나타내므로, 능동적이고 눈에 띄는 변화의 뉘앙스를 살려 ‘바꾸어 놓습니다’로 옮겼습니다.
- source_word: פָנָיו
  english_pob_choice: his face
  chosen_korean: 그 얼굴
  alternatives_korean:
  - 그의 얼굴
  - 얼굴
  - 용모
  lexicon: HALOT
  rationale: 직역하면 ‘그의 얼굴’이지만, 한국어 속담체에서는 소유격을 풀어 ‘그 얼굴’로 두어 자연스럽고 간결하게 표현했습니다.
- source_word: אִם לְטוֹב וְאִם לְרָע
  english_pob_choice: whether for good or for bad
  chosen_korean: 좋을 때든 나쁠 때든
  alternatives_korean:
  - 좋든 나쁘든
  - 선하든 악하든
  - 좋은 경우든 나쁜 경우든
  lexicon: HALOT
  rationale: 쌍대 대구를 한국어 관용으로 살리되, 도덕적 ‘악’보다 상황적 대비가 더 자연스러워 보이므로 ‘좋을 때든 나쁠 때든’으로 옮겼습니다.
theological_decisions:
- issue: 원문은 내면의 상태와 외적 표정의 상관을 말하는 속담형 진술입니다.
  chosen_reading: 교훈적 일반 진술로 유지하고, 과장된 심리 설명이나 도덕적 재해석은 덧붙이지 않았습니다.
  alternative_readings:
  - 도덕적 평가를 강화한 표현
  - 심리학적 설명으로 확장한 표현
  rationale: 히브리어와 영어 POB 모두 ‘마음’과 ‘얼굴’의 직접적 연관을 말할 뿐이므로, 원문의 관찰적 지혜를 보존하는 것이 가장 충실합니다.
  doctrine_reference: 지혜문학의 관찰 진술 보존
