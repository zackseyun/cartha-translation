  rationale: חמל은 ‘아끼다, 불쌍히 여기다, 긍휼을 베풀다’의 뜻이 있으므로, 문맥의 냉혹함을 살리면서도 한국어로 자연스러운 ‘긍휼을 베풀지 않다’로 옮겼습니다.
