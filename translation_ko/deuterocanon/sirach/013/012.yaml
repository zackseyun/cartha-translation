revisions:
- from: 잔인한 사람은 걸림돌을 주고도 긍휼을 베풀지 않으며, 많은 사람의 생명에 대하여 계책을 꾸밉니다.[a][b]
  to: 잔인한 사람은 걸림돌을 놓고 아끼지 않으며, 많은 사람의 생명을 노려 음모를 꾸밉니다.[a][b]
  rationale: 원문의 단순 접속을 양보로 바꾸지 않고, חמל을 문맥상 중립적인 ‘아끼다’로 옮겼습니다. 마지막 절은 많은 사람의 생명을 겨냥한 적대적 모의를 자연스러운 한국어로 명시하되, 본문에 없는 구체적 수단이나 신학적 해석은 더하지 않았습니다. 두 각주도 히브리어-그리스어 본문 차이와 동족어 반복을 정확히 설명하도록 다듬었습니다.
