    issue: ‘주고도’가 원문에 없는 양보 관계를 더합니다.
    rationale: 히브리어 וְ는 단순 접속이며, 잔인한 사람이 걸림돌을 두고 아끼지 않는다는 병렬 진술입니다.
  - severity: medium
    issue: ‘긍휼을 베풀지 않으며’는 חמל의 의미를 종교적 자비로 다소 한정합니다.
    rationale: 이 문맥에서는 ‘아끼지 않다’ 또는 ‘봐주지 않다’가 ‘spare’의 폭과 냉혹한 행위를 더 직접적으로 나타냅니다.
  - severity: medium
    issue: ‘많은 사람의 생명에 대하여 계책을 꾸밉니다’는 한국어로 어색하고 적대의 대상을 충분히 드러내지 못합니다.
    rationale: על은 이 문맥에서 적대적으로 겨냥함을 나타내므로 ‘많은 사람의 생명을 노려’가 자연스럽고 충실합니다.
