translation:
  language: ko
  text: 모든 육체는 자기 종류를 따르고, 사람은 자기 종류에 붙습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 병행문은 ‘모든 생물은 자기와 같은 것을 사랑하고, 모든 사람은 자기 이웃을 사랑한다’로 읽을 수 있습니다. 히브리어 본문은 ‘자기 종류에 붙는다’는 일반 진술을 강조합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: מִין
  english_pob_choice: kind
  chosen_korean: 종류
  alternatives_korean:
  - 종
  - 부류
  - 류
  lexicon: HALOT
  rationale: מִין은 이 지혜 격언에서 ‘같은 부류/종류’를 가리키므로, 한국어에서는 자연스럽고 범주적 뉘앙스를 살리는 ‘종류’로 옮겼습니다.
- source_word: כָּל בָּשָׂר
  english_pob_choice: every kind of flesh
  chosen_korean: 모든 육체
  alternatives_korean:
  - 모든 살
  - 모든 육신
  - 모든 생명체
  lexicon: HALOT
  rationale: 직역상 ‘모든 육체’이지만, 여기서는 인간과 동물을 포괄하는 일반 진술이므로 ‘육체’로 유지해 원문 어휘를 살렸습니다.
- source_word: יְחֻבַּר
  english_pob_choice: is joined
  chosen_korean: 붙습니다
  alternatives_korean:
  - 연결됩니다
  - 결합됩니다
  - 합쳐집니다
  lexicon: HALOT
  rationale: חבר의 수동형은 ‘붙다/결합되다’의 의미를 가지며, 한국어에서는 관계적 밀착을 간명하게 드러내는 ‘붙습니다’가 가장 자연스럽습니다.
- source_word: אָדָם
  english_pob_choice: a man
  chosen_korean: 사람
  alternatives_korean:
  - 한 사람
  - 인간
  - 남자
  lexicon: HALOT
  rationale: אָדָם은 여기서 대표적·일반적 인간을 뜻하므로, 성별을 과도하게 특정하지 않는 ‘사람’이 합쇼체 본문에서 가장 무난합니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행문의 긴장
  chosen_reading: 본문은 히브리어의 ‘종류/붙다’ 구조를 따르되, 그리스어의 ‘이웃’ 해석은 본문에 넣지 않았습니다.
  alternative_readings:
  - 사람은 자기 이웃에게 붙습니다
  - 사람은 자기와 비슷한 이에게 붙습니다
  rationale: 그리스어 병행문은 해석상 유익하지만, 현존 히브리어 본문이 ‘자기 종류’라는 일반 격언을 분명히 말하므로, 한국어 본문은 히브리어 쪽을 우선해 그 뉘앙스를 보존했습니다.
  doctrine_reference: 'PHILOSOPHY.md: 히브리어가 보존된 경우 히브리어를 우선하고, 병행 그리스어는 의미 확인에 사용합니다.'
