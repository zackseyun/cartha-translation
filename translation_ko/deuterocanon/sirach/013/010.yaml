base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/013/010.yaml
  text: Do not draw near[a], lest you be pushed away; and do not stay far off[b], lest you be hated.
  footnotes:
  - marker: a
    text: 'Greek: ''lest you be forgotten'' or ''neglected'' in the second clause, instead of Hebrew ''lest you be hated.'' The main text follows the surviving Hebrew witness; the Greek suggests a softer consequence that fits the social setting.'
    reason: alternative_reading
  - marker: b
    text: The first clause is difficult in the Hebrew as transmitted; the Greek parallel supports the sense of being repelled or pushed away if one comes too close.
    reason: textual_variant
translation:
  language: ko
  text: 가까이 다가가지 마십시오. 그러면 밀려날까 봅니다. 또 멀리 떨어져 있지 마십시오. 그러면 미움을 받을까 봅니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 병행본문은 둘째 절을 '잊히다/소홀히 여겨지다'로 읽을 수 있지만, 본문은 현존 히브리어의 '미움을 받다'를 따랐습니다.
    reason: alternative_reading
  - marker: b
    text: 첫째 절의 히브리어는 전승상 다소 난해하며, 그리스어는 '밀려나다/밀쳐지다'의 뜻을 뒷받침합니다.
    reason: textual_variant
lexical_decisions:
- source_word: אַל תִּתְקָרֵב
  english_pob_choice: Do not draw near
  chosen_korean: 가까이 다가가지 마십시오
  alternatives_korean:
  - 가까이 오지 마십시오
  - 다가서지 마십시오
  lexicon: HALOT
  rationale: 금지 표현 אַל과 관계적·공간적 뉘앙스를 살려, 단순한 '접근하다'보다 한국어에서 자연스러운 '가까이 다가가다'로 옮겼습니다.
- source_word: תִּתְרַחֵק
  english_pob_choice: you be pushed away
  chosen_korean: 밀려날까 봅니다
  alternatives_korean:
  - 밀쳐질까 봅니다
  - 멀어질까 봅니다
  lexicon: HALOT
  rationale: 히브리어 전승은 다소 난해하지만, 병행하는 그리스어의 '밀려나다' 뉘앙스를 반영해 수동적 배척을 살렸습니다.
- source_word: וְאַל תִּתְרַחֵק
  english_pob_choice: and do not stay far off
  chosen_korean: 또 멀리 떨어져 있지 마십시오
  alternatives_korean:
  - 또 멀리 서 있지 마십시오
  - 또 거리를 두지 마십시오
  lexicon: HALOT
  rationale: 같은 어근의 대조를 한국어에서도 분명히 드러내기 위해 '멀리 떨어져 있다'로 옮겼습니다.
- source_word: תִּשָּׂנֵא
  english_pob_choice: you be hated
  chosen_korean: 미움을 받을까 봅니다
  alternatives_korean:
  - 미움을 살까 봅니다
  - 미움을 받게 될까 봅니다
  lexicon: HALOT
  rationale: 히브리어의 직접적인 뜻은 '미움을 받다'이므로, 그 강도를 유지하되 잠언체 경고문에 맞게 '...까 봅니다'로 마무리했습니다.
theological_decisions:
- issue: 경구체 경고의 인칭과 높임말
  chosen_reading: 직접 화법이 아닌 일반 훈계문으로 처리해 합쇼체 명령·금지형을 사용했습니다.
  alternative_readings:
  - 반말체 훈계
  - 더 고전적인 성경체 표현
  rationale: 지혜문학의 짧은 경고를 현대 표준어의 공식 문체로 전달하면서도, 원문의 긴박한 금지와 경고를 약화하지 않기 위함입니다.
  doctrine_reference: 문체/화용 결정
