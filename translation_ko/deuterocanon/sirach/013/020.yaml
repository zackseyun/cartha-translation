base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/013/020.yaml
  text: When a rich man stumbles[a], he is supported by a friend; but when a poor man stumbles[b], he is driven away from friend to friend.
  footnotes:
  - marker: a
    text: Or, 'from one friend to another.' The Hebrew suggests that the poor man is passed along or driven off repeatedly rather than receiving real support.
    reason: lexical_alternative
  - marker: b
    text: The Greek parallel differs substantially here ('Lowliness is an abomination to the proud, and a poor man is an abomination to a rich man'), but the Hebrew witness is the primary source for this verse where it survives.
    reason: textual_variant
translation:
  language: ko
  text: 부유한 사람이 비틀거리면 친구가 그를 붙들어 줍니다. 그러나 가난한 사람이 비틀거리면 한 친구에게서 다른 친구에게로 내몰립니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘친구에게서 친구에게로’입니다. 이 표현은 가난한 사람이 실제 도움을 받지 못한 채 사람들에게 거듭 떠넘겨지거나 내쫓기는 모습을 암시합니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어 평행 본문은 이 절과 상당히 다릅니다. 곧 ‘비천함은 교만한 자에게 가증하고, 가난한 사람은 부자에게 가증하다’라고 읽습니다. 그러나 현존하는 히브리어 본문을 이 절의 주된 번역 근거로 삼았습니다.
    reason: textual_variant
lexical_decisions:
- source_word: עָשִׁיר
  english_pob_choice: a rich man
  chosen_korean: 부유한 사람
  alternatives_korean:
  - 한 부자
  - 부자
  lexicon: HALOT
  rationale: 히브리어 단수형을 속담적으로 유지하면서도 한국어에서 자연스러운 일반 명사로 옮겼습니다.
- source_word: מוּט / נָמוֹט
  english_pob_choice: stumbles
  chosen_korean: 비틀거리면
  alternatives_korean:
  - 넘어지면
  - 휘청이면
  - 흔들리면
  lexicon: HALOT
  rationale: 둘 다 흔들림과 불안정을 가리키므로, 사회적 곤경을 함축하는 한국어로 ‘비틀거리다’를 택해 반복 평행을 살렸습니다.
- source_word: נִסְמָךְ מֵרֵעַ
  english_pob_choice: is supported by a friend
  chosen_korean: 친구가 그를 붙들어 주지만
  alternatives_korean:
  - 친구에게서 지지를 받지만
  - 친구가 그를 떠받쳐 주지만
  - 벗이 그를 받쳐 주지만
  lexicon: HALOT
  rationale: סמך의 수동적 의미를 한국어의 자연스러운 동사구 ‘붙들어 주다’로 옮겨, 실제 도움의 행위를 분명하게 드러냈습니다.
- source_word: נִדְחָה מֵרֵעַ אֶל רֵעַ
  english_pob_choice: is driven away from friend to friend
  chosen_korean: 친구에게서 친구에게로 밀려납니다
  alternatives_korean:
  - 친구에게서 친구에게로 쫓겨납니다
  - 벗에서 벗으로 내몰립니다
  - 친구를 따라 여기저기 떠밀려 갑니다
  lexicon: HALOT
  rationale: נדח의 ‘밀려남/내몰림’의 강한 배척감을 살리면서, ‘from friend to friend’의 반복적 이동을 한국어로 간결하게 재현했습니다.
theological_decisions:
- issue: 부자의 지원과 가난한 자의 배척이라는 대조적 사회 윤리
  chosen_reading: 문장은 단순한 개별 사건이 아니라, 부자에게는 도움의 연결망이 작동하고 가난한 자에게는 그 연결망이 끊기는 현실을 속담적으로 드러냅니다.
  alternative_readings:
  - 개인의 성격 차이로만 읽는 해석
  - 경제적 처지를 넘어선 일반적 인간관계의 진술
  rationale: 히브리어 평행법과 문맥상 사회적 편향의 관찰로 읽는 것이 가장 직접적이며, 본문의 날카로운 대비를 약화시키지 않습니다.
  doctrine_reference: 지혜문학의 사회적 통찰
