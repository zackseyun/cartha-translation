  naturalness: 초안의 ‘친구에게서 친구에게로 밀려납니다’도 이해되지만, ‘한 친구에게서 다른 친구에게로 내몰립니다’가 현대 표준어에서 반복적으로 떠넘겨지고 배척되는 뜻을 더 자연스럽고 선명하게 전달합니다. 문장 전체는 현대적인 합쇼체입니다.
