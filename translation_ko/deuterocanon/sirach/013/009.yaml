base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/013/009.yaml
  text: When a noble draws near[a], keep your distance, and then he will bring you nearer still.
  footnotes:
  - marker: a
    text: 'Hebrew ''When a noble draws you near'' is somewhat terse and could be taken more literally as ''Draw near to a noble; be far off.'' The Greek parallel supports the sense adopted here: when a powerful person summons you, maintain reserve, and he will invite you closer.'
    reason: alternative_reading
translation:
  language: ko
  text: 귀인에게 가까이 가되, 거리를 두십시오.[a] 그러면 그가 여러분을 더욱 가까이 오게 할 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 첫 구절은 매우 압축되어 있어 직역하면 ‘귀인에게 가까이 가라. 멀리 있어라’가 됩니다. 이를 ‘귀인이 가까이 오거든, 거리를 두어라’로 읽을 수도 있습니다. 그리스어 병행문은 권세자가 여러분을 부를 때 물러서 있으라는 뜻으로 옮깁니다.
    reason: alternative_reading
lexical_decisions:
- source_word: קָרֵב / προσκαλεσαμένου σε
  english_pob_choice: draws near
  chosen_korean: 다가오거든
  alternatives_korean:
  - 가까이 오거든
  - 불러 다가오거든
  - 다가오면
  lexicon: HALOT; LSJ
  rationale: 히브리어는 직접적인 주어-동사 구조로 짧게 말하고, 그리스어 병행문은 ‘불러 가까이 오게 하는’ 뜻을 보강합니다. 한국어에서는 ‘다가오거든’이 귀인이 먼저 접근하는 상황과 그에 대한 대비를 자연스럽게 살립니다.
- source_word: נָדִיב / δυνάστης
  english_pob_choice: noble
  chosen_korean: 귀인
  alternatives_korean:
  - 유력자
  - 고관
  - 귀족
  lexicon: HALOT; LSJ
  rationale: 이 단어는 여기서 단순히 ‘선한 사람’이 아니라 사회적 지위와 권세가 있는 사람을 가리킵니다. ‘귀인’은 한국어에서 신분·권세의 뉘앙스를 비교적 압축적으로 담습니다.
- source_word: הֱיֶה רָחוֹק / ὑποχωρῶν γίνου
  english_pob_choice: keep your distance
  chosen_korean: 거리를 두십시오
  alternatives_korean:
  - 멀리 서십시오
  - 물러서십시오
  - 떨어져 있으십시오
  lexicon: HALOT; LSJ
  rationale: 명령형으로서 신중하게 물러서라는 조언입니다. ‘거리를 두십시오’는 현대 한국어로 자연스럽고, 권세자 앞에서의 절제와 조심성을 잘 드러냅니다.
- source_word: וּכְדֵי כֵן / τόσῳ μᾶλλον
  english_pob_choice: and then ... nearer still
  chosen_korean: 그러면 ... 오히려 ... 더욱 가까이 오게 할 것입니다
  alternatives_korean:
  - 그러면 ... 더 가까이 부를 것입니다
  - 그리하면 ... 더욱 가까이 오게 할 것입니다
  lexicon: HALOT; LSJ
  rationale: 히브리어의 결과 연결과 그리스어의 ‘그만큼 더’라는 비교 강화가 함께 있으므로, 단순한 순서 표시보다 강화된 결과를 살려 옮겼습니다. ‘오히려’와 ‘더욱’은 예절 있는 거리 유지가 더 큰 호의를 낳는다는 역설을 반영합니다.
theological_decisions:
- issue: 잠언형 교훈의 문체와 권면의 강도
  chosen_reading: 직설적 교훈문으로, 권세자 앞에서 지나친 친근함을 경계하라는 현실 지혜로 읽었습니다.
  alternative_readings:
  - 단순한 사회 예절 조언으로 약화해 읽는 것
  - ‘가까이 오게 할 것이다’를 단순한 친절 표현으로만 보는 것
  rationale: 문맥과 그리스어 병행문이 모두 권세자에게는 절제된 태도가 더 나은 결과를 낳는다는 지혜를 강조합니다. 따라서 도덕적 훈계보다 사회적 현실에 근거한 교훈으로 보존했습니다.
  doctrine_reference: 지혜문학의 교훈적·실천적 성격
- issue: 주체와 객체의 방향성
  chosen_reading: 히브리어의 압축된 표현과 그리스어의 설명적 표현을 함께 반영해, 귀인이 먼저 접근하고 그 결과 더 가까이 오게 하는 흐름으로 옮겼습니다.
  alternative_readings:
  - ‘네가 귀인에게 가까이 가거든’으로 읽는 것
  - 첫 절을 명령문으로만 처리하는 것
  rationale: 히브리어만 좇으면 주체가 모호해질 수 있으나, 그리스어 평행문이 그 의미를 분명히 합니다. 그래서 본문 의미를 손상하지 않으면서도 문장 흐름을 명료하게 했습니다.
  doctrine_reference: 본문 비평과 평행본문 해석의 조화
