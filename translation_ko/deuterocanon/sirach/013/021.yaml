  text: A rich man speaks[a], and many are his supporters; even his ugly words are made beautiful.
  footnotes:
  - marker: a
    text: 'The Greek parallel differs substantially: ''A rich man when shaken is supported by friends, but a humble man when fallen is pushed away even by friends.'' The Hebrew witness here instead emphasizes how a rich man''s speech is favorably received.'
