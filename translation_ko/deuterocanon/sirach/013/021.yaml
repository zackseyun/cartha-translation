  naturalness: 수정문은 잠언적 일반 진술을 자연스럽고 현대적인 합쇼체로 유지합니다. ‘말도’는 한국어에서 집합적 용법으로 자연스러우며, ‘아름답게 꾸며집니다’는 원문의 수동적·풍자적 효과를 드러냅니다.
  terminology: עוֹזְרָיו는 ‘그를 돕는 이들’로 직역에 가깝게 바로잡고, מְיוּפִּין은 ‘아름답게 꾸며집니다’로 옮겼습니다. 그리스어 평행본문의 ταπεινός는 ‘비천한 사람’으로 처리하여 ‘겸손한 사람’과 ‘낮은 처지의 사람’ 사이의 의미 범위를 보존했습니다.
