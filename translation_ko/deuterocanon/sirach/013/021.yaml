translation:
  language: ko
  text: 부자가 말하면 그를 돕는 이들이 많고, 그의 추한 말도 아름답게 꾸며집니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 평행본문은 상당히 다릅니다. “부자가 흔들릴 때에는 친구들에게 지지를 받지만, 비천한 사람이 넘어지면 친구들에게마저 밀려난다.” 히브리어 본문은 부자의 말이 호의적으로 받아들여지는 모습을 강조합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: עָשִׁיר
  english_pob_choice: a rich man
  chosen_korean: 부자는
  alternatives_korean:
  - 한 부자는
  - 부유한 사람은
  lexicon: HALOT
  rationale: 속담형 진술이므로 대표적 단수로 옮기되, 한국어에서는 주어를 자연스럽게 전면에 두는 ‘부자는’이 가장 간결하고 문맥에 맞습니다.
- source_word: מְדַבֵּר
  english_pob_choice: speaks
  chosen_korean: 말하고
  alternatives_korean:
  - 말합니다
  - 말을 하고
  lexicon: HALOT
  rationale: 현재형의 일반 진술을 살리면서 뒤의 병렬 절과 자연스럽게 이어지도록 ‘말하고’로 처리했습니다.
- source_word: וְעוֹזְרָיו רַבִּים
  english_pob_choice: and many are his supporters
  chosen_korean: 그에게는 많은 추종자가 있으며
  alternatives_korean:
  - 그를 돕는 이들이 많으며
  - 그를 지지하는 이들이 많으며
  lexicon: HALOT
  rationale: 히브리어의 ‘돕는 이들’은 사회적 지지의 뉘앙스를 포함하므로, 문맥상 부자의 말이 잘 받아들여지는 현실을 드러내는 ‘추종자’가 가장 적절합니다.
- source_word: מְכוֹעֲרִין מְיוּפִּין
  english_pob_choice: even his ugly words are made beautiful
  chosen_korean: 그의 추한 말들도 아름답게 여겨집니다
  alternatives_korean:
  - 그의 추한 말들도 아름답게 꾸며집니다
  - 그의 추한 말들도 미화됩니다
  lexicon: HALOT
  rationale: ‘미화된다’도 가능하지만, 한국어에서 더 직접적으로 인위적 호의를 드러내는 ‘아름답게 여겨집니다’가 원문의 아이러니를 잘 살립니다.
theological_decisions:
- issue: '본문의 강조점: 말의 내용보다 사회적 편향'
  chosen_reading: 이 절은 부자의 말이 본래 아름답기 때문이 아니라, 그의 신분 때문에 호의적으로 평가된다는 풍자를 전달합니다.
  alternative_readings:
  - 부자의 실제 말이 실제로 훌륭하다는 의미로 읽는 해석
  - 단순히 부자의 영향력을 묘사하는 중립적 진술
  rationale: 히브리어는 ‘추한 말들이 아름답게 된다’고 하여 평가의 왜곡을 강조하므로, 풍자적 의미를 흐리지 않게 옮겨야 합니다.
  doctrine_reference: 잠언적 지혜문학의 사회비판
