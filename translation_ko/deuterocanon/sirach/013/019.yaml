theological_decisions:
- issue: 히브리어 본문과 그리스어 병행전승의 큰 차이
  chosen_reading: 본문에는 현존 히브리어의 진술을 따라 ‘교만/겸손/부자/가난한 사람’ 구문을 번역했습니다.
  alternative_readings:
  - '그리스어 병행본: ‘사막에서 사자들의 먹이는 들나귀들이다. 그와 같이 부자들의 먹이는 가난한 사람들이다.’'
  rationale: 집회서에서는 히브리어가 보존된 경우 그 본문을 우선하는 것이 POB 원칙에 맞습니다. 이 절은 히브리어와 그리스어가 내용상 크게 다르므로, 본문은 히브리어를 따르고 그리스어는 별도 각주로 보존하는 것이 적절합니다.
  doctrine_reference: 'PHILOSOPHY.md: Hebrew primacy where extant; preserve significant Greek alternative in footnote'
- issue: 속담형 경구의 일반성
  chosen_reading: 단수 표현을 한국어 대표명사로 옮겨 ‘교만’, ‘부자’, ‘가난한 사람’을 일반적 유형으로 읽히게 했습니다.
  alternative_readings:
  - ‘교만한 자’, ‘부자들’, ‘가난한 자들’
  rationale: 원문은 특정 개인이 아니라 사회적 유형을 말하는 경구이므로, 한국어에서도 범주를 자연스럽게 드러내는 표현이 의미를 더 정확히 전달합니다.
  doctrine_reference: 시문학/지혜문학의 격언적 일반화
