    text: '그리스어 증인: ‘광야에서 들나귀들이 사자들의 사냥감인 것처럼, 가난한 사람들은 부자들의 먹잇감이다.’ 현존 히브리어는 대신 ‘교만은 겸손을 혐오하고, 부자는 가난한 사람을 혐오한다’고 읽습니다.'
    reason: alternative_reading
