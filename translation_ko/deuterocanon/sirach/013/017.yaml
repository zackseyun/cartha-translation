translation:
  language: ko
  text: 하이에나와 개 사이에 무슨 평화가 있겠습니까? 부자와 가난한 사람 사이에 무슨 평화가 있겠습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '그리스어 평행문: ‘늑대가 어린 양과 무엇을 함께하겠습니까? 이와 같이 죄인과 경건한 사람도 그러합니다.’ 히브리어 증거는 대신 ‘하이에나 … 개’와 ‘부자 … 가난한 사람’을 읽습니다.'
    reason: alternative_reading
lexical_decisions:
- source_word: מֵאַיִן שָׁלוֹם
  english_pob_choice: What peace can there be
  chosen_korean: 무슨 평화가 있겠습니까
  alternatives_korean:
  - 어디서 평화를 찾을 수 있겠습니까
  - 어떻게 평화가 있겠습니까
  lexicon: HALOT
  rationale: מֵאַיִן의 수사적 부정을 한국어에서 자연스럽게 살리기 위해 ‘무슨 … 있겠습니까’로 옮겼습니다.
- source_word: צָבוּעַ
  english_pob_choice: hyena
  chosen_korean: 하이에나
  alternatives_korean:
  - 담비개
  - 들개
  lexicon: HALOT
  rationale: 히브리어 증거가 가리키는 동물 이미지를 반영해 일반 독자가 알아볼 수 있는 현대어 ‘하이에나’를 선택했습니다.
- source_word: כָּלֶב
  english_pob_choice: dog
  chosen_korean: 개
  alternatives_korean:
  - 강아지
  - 개 짐승
  lexicon: HALOT
  rationale: כָּלֶב의 직접 대응어를 사용해 대조를 분명히 했습니다.
- source_word: עָשִׁיר / רָשׁ
  english_pob_choice: rich man / poor man
  chosen_korean: 부자 / 가난한 사람
  alternatives_korean:
  - 부유한 사람 / 가난한 사람
  - 부자 / 가난한 자
  lexicon: HALOT
  rationale: 히브리어의 남성 단수 대조를 한국어에서 무리 없이 살리면서도 성중립적으로 읽히도록 ‘부자 / 가난한 사람’으로 옮겼습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 평행문의 이미지 차이
  chosen_reading: 본문에는 히브리어의 ‘하이에나와 개 / 부자와 가난한 사람’ 이미지를 두고, 그리스어의 ‘늑대와 어린 양 / 죄인과 경건한 사람’은 각주로 남겼습니다.
  alternative_readings:
  - 그리스어를 따라 ‘늑대와 어린 양’으로 옮김
  - 두 전승을 절충해 일반적 불화의 비유로 완화함
  rationale: 시락서의 현존 히브리어 증거를 우선하되, 그리스어 전승이 다른 윤리적 대비를 보여 주므로 이를 삭제하지 않고 각주로 보존했습니다.
  doctrine_reference: 원문 우선 원칙과 전승 차이의 보존
