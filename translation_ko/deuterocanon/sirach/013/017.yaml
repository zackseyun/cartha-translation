    text: '그리스어 평행문: ‘늑대가 어린 양과 무엇을 나누겠습니까? 그러므로 죄인이 경건한 사람과 그렇습니다.’ 히브리어 증거는 대신 ‘하이에나 … 개’와 ‘부자 … 가난한 사람’을 읽습니다.'
    reason: alternative_reading
lexical_decisions:
- source_word: מֵאַיִן שָׁלוֹם
  english_pob_choice: What peace can there be
  chosen_korean: 무슨 평화가 있겠습니까
  alternatives_korean:
