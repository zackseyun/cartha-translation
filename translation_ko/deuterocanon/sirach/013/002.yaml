lexical_decisions:
- source_word: כָּבֵד מִמְּךָ מַה תִּשָּׂא
  english_pob_choice: Do not carry what is heavier than you
  chosen_korean: 당신보다 더 무거운 짐을 지지 마십시오
  alternatives_korean:
  - 당신보다 더 무거운 것은 들지 마십시오
  - 당신에게 과한 것을 지지 마십시오
  lexicon: נשא / carry, bear
  rationale: 히브리어 동사 נשא의 기본 뜻을 살려 ‘지다/들다’ 중 문맥상 ‘짐을 지다’로 자연스럽게 옮겼습니다. POB의 ‘what is heavier than you’는 비교 구문으로, 한국어에서는 의미를 분명히 하기 위해 ‘더 무거운 짐’으로 구체화했습니다.
- source_word: וְאֶל עָשִׁיר מִמְּךָ מַה תִּתְחַבָּר
  english_pob_choice: and do not associate with one richer than you
  chosen_korean: 당신보다 더 부유한 사람과는 어울리지 마십시오
  alternatives_korean:
  - 당신보다 더 부유한 사람과는 교제하지 마십시오
  - 당신보다 부유한 이와는 사귀지 마십시오
  lexicon: תחבר / be joined, associate
  rationale: 히브리어의 ‘붙다/연결되다’ 계열을 한국어의 ‘어울리다’로 옮겨 관계적 결합의 뉘앙스를 살렸습니다. ‘교제하다’는 교회적 색채가 강해, 잠언적 경고의 생활어로는 ‘어울리다’가 더 직접적입니다.
- source_word: כָּבֵד / עָשִׁיר
  english_pob_choice: heavier / richer
  chosen_korean: 더 무거운 / 더 부유한
  alternatives_korean:
  - 무거운 / 부유한
  - 힘센 / 부유한
  lexicon: כבד / heavy; עשיר / rich
  rationale: 두 비교 형용사의 대조를 그대로 유지하려고 ‘더’의 비교급을 반복했습니다. 이렇게 해야 원문의 경고 구조가 한국어에서도 선명하게 드러납니다.
theological_decisions:
- issue: 속담형 경고문의 직설성
  chosen_reading: 이 구절은 도덕 일반론보다 관계적·실천적 경고로 읽어, 명령형으로 간결하게 번역했습니다.
  alternative_readings:
  - 완곡한 권고문으로 처리
  - 사회적 조언으로 약화
  rationale: 히브리어 수사 구조가 지혜문학의 금지 명령을 분명히 하므로, 한국어에서도 직접적인 금지형을 유지하는 것이 원문 효과를 가장 잘 보존합니다.
  doctrine_reference: 지혜문학의 권면 형식 보존
