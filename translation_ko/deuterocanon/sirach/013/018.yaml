base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/013/018.yaml
  text: The wild beasts of the wilderness are food for the lion[b][a]; so the poor are the pasture of the rich.
  footnotes:
  - marker: a
    text: 'Greek: “What peace has a hyena with a dog? And what peace has a rich man with a poor man?” The Greek parallel preserves a different proverb with the same social point of hostility between rich and poor.'
    reason: alternative_reading
  - marker: b
    text: Or possibly “wild donkeys of the wilderness,” if the Hebrew term is taken more narrowly rather than as wild animals generally.
    reason: lexical_alternative
translation:
  language: ko
  text: 광야의 들짐승들이 사자의 먹이가 되듯이, 가난한 이들은 부자들의 목초지가 됩니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '그리스어: “하이에나와 개 사이에 무슨 평화가 있겠습니까? 부자와 가난한 이 사이에 무슨 평화가 있겠습니까?” 그리스어 병행문은 부자와 가난한 이 사이의 화해할 수 없는 관계를 말하는, 다른 속담을 보존합니다.'
    reason: alternative_reading
  - marker: b
    text: 또는 “광야의 들나귀들”로 옮길 수 있습니다. 히브리어 פרא를 더 좁게 이해하면 그렇게 볼 여지가 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַאֲכַל
  english_pob_choice: food for
  chosen_korean: 먹이가 되듯이
  alternatives_korean:
  - 먹을거리처럼
  - 사냥감이 되듯이
  lexicon: HALOT
  rationale: ‘먹이’가 먹혀 없어지는 관계를 자연스럽게 살리면서, 속담의 비유적 압박감을 유지합니다.
- source_word: פִּרְאֵי מִדְבָּר
  english_pob_choice: the wild beasts of the wilderness
  chosen_korean: 들판의 야생 짐승들
  alternatives_korean:
  - 광야의 들짐승들
  - 광야의 야생 동물들
  lexicon: HALOT
  rationale: Kahana 본문은 넓게 ‘야생 짐승들’을 가리키므로, 한국어에서는 자연스러운 집합 표현으로 옮기되 특정 동물로 좁히지 않았습니다.
- source_word: מַרְעִית
  english_pob_choice: the pasture of
  chosen_korean: 풀밭이 됩니다
  alternatives_korean:
  - 먹이가 됩니다
  - 방목지가 됩니다
  lexicon: HALOT
  rationale: 직역하면 ‘목초지/풀밭’이지만, 문맥상 부자가 가난한 자를 이용해먹는 뜻을 드러내기 위해 비유를 살린 표현으로 옮겼습니다.
- source_word: עָשִׁיר ... דַּלִּים
  english_pob_choice: the rich ... the poor
  chosen_korean: 부자 ... 가난한 자들
  alternatives_korean:
  - 부유한 사람 ... 가난한 사람들
  - 부자 ... 빈민
  lexicon: HALOT
  rationale: 속담적 대조를 살리기 위해 대표적 계층 명사로 옮겼고, 복수적 일반성을 한국어에서도 유지했습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행문의 차이
  chosen_reading: 본문은 히브리어의 ‘포식/먹이’ 비유를 따르고, 그리스어의 ‘하이에나와 개, 부자와 가난한 자’는 주석 각주로 보존했습니다.
  alternative_readings:
  - 하이에나와 개가 무슨 평화가 있겠으며, 부자와 가난한 자가 무슨 평화가 있겠습니까?
  rationale: 시라 13:18에서는 살아 있는 히브리어 본문을 우선하되, 그리스어 병행문의 의미 차이가 크므로 대조적 전승을 독자가 확인할 수 있게 해야 합니다.
  doctrine_reference: 'PHILOSOPHY.md: Hebrew primacy where extant; preserve Greek parallel as audited alternative.'
