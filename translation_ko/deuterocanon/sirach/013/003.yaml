  rationale: 이 절의 히브리어 증언은 의미가 분명하고, 본문 전승의 핵심 대조가 사회적 지위와 교만/간청의 태도에 있기 때문에 이를 주본문으로 반영했습니다. 그리스어의 다른 비유는 이 절의 중요한 이본이지만 본문 의미를 대체하지는 않습니다.
  doctrine_reference: Sirach 전승의 이본 공존을 본문과 주석에서 분리해 제시하는 POB 번역 원칙
