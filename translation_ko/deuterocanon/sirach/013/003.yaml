  lexicon: source Hebrew
  rationale: 히브리어 עָשִׁיר의 기본 의미는 ‘부유한 사람’이며, 문맥상 신분 대비를 살리되 현대 한국어에서 자연스럽게 읽히도록 옮겼습니다.
