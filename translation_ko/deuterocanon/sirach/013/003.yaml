translation:
  language: ko
  text: 부유한 사람이 잘못을 저지르면 거만하게 굽니다. 그러나 가난한 사람이 잘못을 저지르면 자비를 간청합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '그리스어: “항아리가 가마솥과 무엇을 함께 나누겠습니까? 한쪽이 다른 쪽에 부딪히면, 한쪽이 부서질 것입니다.” 히브리어와 그리스어 증언은 이 절에서 크게 다릅니다.'
    reason: textual_variant
lexical_decisions:
- source_word: עָשִׁיר
  english_pob_choice: rich man
  chosen_korean: 부유한 사람
