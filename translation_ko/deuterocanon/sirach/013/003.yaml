  lexicon: source Hebrew
  rationale: 이 동사는 단순한 ‘잘못을 저지르다’보다 그 행위에 뒤따르는 태도적 왜곡을 드러내므로, POB의 ‘acts arrogantly’를 따라 ‘거만해지다’로 옮겼습니다.
- source_word: דַּל
  english_pob_choice: poor man
  chosen_korean: 가난한 사람
  alternatives_korean:
  - 빈곤한 사람
  - 가난한 자
  lexicon: source Hebrew
  rationale: 대구를 이루는 עָשִׁיר와 짝을 맞추어 사회경제적 상태를 분명히 드러내는 표준적 표현으로 옮겼습니다.
- source_word: יִתְחַנָּן
  english_pob_choice: pleads for mercy
  chosen_korean: 자비를 구합니다
  alternatives_korean:
  - 애원을 합니다
  - 은혜를 구합니다
  lexicon: source Hebrew
  rationale: 히브리어는 단순한 부탁보다 간청·애원의 뉘앙스가 강하므로, POB의 ‘pleads for mercy’를 따라 자비를 구하는 태도로 살렸습니다.
theological_decisions:
- issue: 히브리어 대조 구문의 본문 채택
  chosen_reading: 히브리어의 부유한 사람/가난한 사람 대조를 본문으로 두었습니다.
  alternative_readings:
  - 그리스어의 항아리/가마솥 비유를 본문으로 채택
  rationale: 이 절의 히브리어 증언은 의미가 분명하고, 본문 전승의 핵심 대조가 사회적 지위와 교만/간청의 태도에 있기 때문에 이를 주본문으로 반영했습니다. 그리스어의 다른 비유는 이 절의 중요한 이본이지만 본문 의미를 대체하지는 않습니다.
  doctrine_reference: Sirach 전승의 이본 공존을 본문과 주석에서 분리해 제시하는 POB 번역 원칙
