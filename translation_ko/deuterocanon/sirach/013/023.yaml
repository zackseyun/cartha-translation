  text: When a rich man speaks[a], everyone falls silent, and they lift up his sense to the clouds.
  footnotes:
  - marker: a
    text: 'Greek: ''and they lifted up his word to the clouds.'' The Hebrew reads ''his sense/understanding,'' which is followed here as the primary witness.'
    reason: alternative_reading
translation:
  language: ko
  text: 부자가 말하면 모든 이가 잠잠해지고, 그의 지혜를 구름까지 높이 올립니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עָשִׁיר
  english_pob_choice: a rich man
  chosen_korean: 부자가
  alternatives_korean:
  - 한 부자가
  - 부유한 사람이
  lexicon: HALOT
  rationale: 잠언형 일반 진술로서 특정 인물보다 유형을 가리키므로, 한국어도 관용적으로 간결한 ‘부자가’로 옮겼습니다.
- source_word: דּוֹבֵר
  english_pob_choice: speaks
  chosen_korean: 말하면
  alternatives_korean:
  - 말합니다
  - 말할 때
  lexicon: HALOT
  rationale: 히브리어 분사형의 격언적 현재를 살려 조건적·반복적 뉘앙스가 드러나는 ‘말하면’으로 처리했습니다.
- source_word: הַכֹּל נִסְכָּתוּ
  english_pob_choice: everyone falls silent
  chosen_korean: 모든 이가 잠잠해지고
  alternatives_korean:
  - 모두가 침묵하고
  - 사람들이 모두 조용해지고
  lexicon: HALOT
  rationale: 그리스어 평행본문의 ἐσίγησαν(침묵하다)과 맞물리는 반응을 반영해, ‘잠잠해지다’로 소리 죽은 정황을 자연스럽게 살렸습니다.
- source_word: שִׂכְלוֹ
  english_pob_choice: his sense
  chosen_korean: 그의 지혜를
  alternatives_korean:
  - 그의 이해를
  - 그의 판단을
  - 그의 생각을
  lexicon: HALOT
  rationale: 히브리어 שׂכל은 단순한 ‘말’보다 분별/이해를 가리키므로, 한국어에서는 문맥상 가장 받아들이기 쉬운 ‘지혜’를 택하되 과도한 신학적 격상을 피했습니다.
- source_word: עַד עָב יַגִּיעוּ
  english_pob_choice: to the clouds
  chosen_korean: 구름까지 높이 올립니다
  alternatives_korean:
  - 구름까지 들어 올립니다
  - 구름 위까지 높입니다
  - 구름까지 치켜세웁니다
  lexicon: HALOT
  rationale: ‘구름까지’라는 상승 이미지와 함께, לשון의 과장된 칭송을 한국어 동사 ‘높이 올리다’로 자연스럽게 표현했습니다.
