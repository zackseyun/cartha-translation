translation:
  language: ko
  text: 모든 생물은 자기 종류를 사랑하고, 모든 사람은 자기와 같은 이를 사랑합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 둘째 행을 ‘모든 사람은 자기 이웃을 [사랑한다]’로 읽습니다. 히브리어는 ‘자기와 같은 이를’이라고 읽습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: כָּל הַבָּשָׂר
  english_pob_choice: All flesh
  chosen_korean: 모든 육체
  alternatives_korean:
  - 모든 살
  - 모든 생물
  lexicon: HALOT
  rationale: 히브리어의 직역적 이미지를 살리면서도 한국어에서 자연스러운 현대 문체로 옮기기 위해 ‘육체’를 택했습니다.
- source_word: יֶאֱהַב
  english_pob_choice: loves
  chosen_korean: 사랑합니다
  alternatives_korean:
  - 사랑할 것입니다
  - 좋아합니다
  lexicon: HALOT
  rationale: 잠언적 일반 진술이므로 현재형으로 옮겼고, 단순한 호감보다 원문의 강한 애정의 의미를 반영했습니다.
- source_word: מִינוֹ
  english_pob_choice: its own kind
  chosen_korean: 자기와 같은 것
  alternatives_korean:
  - 자기 종
  - 자기 종류
  lexicon: HALOT
  rationale: מין의 핵심 의미인 ‘같은 종류/부류’를 살리되, 한국어에서 ‘종’이 생물학적으로 지나치게 좁아질 수 있어 더 유연한 표현을 썼습니다.
- source_word: אֶת הַדּוֹמֶה לוֹ
  english_pob_choice: the one like himself
  chosen_korean: 자기와 같은 이를
  alternatives_korean:
  - 자기와 비슷한 사람을
  - 자기와 같은 사람을
  lexicon: HALOT
  rationale: 히브리어는 ‘그와 같은/닮은 자’를 뜻하므로, 영어 주석의 ‘neighbor’보다 본문 의미를 우선해 ‘자기와 같은 이’로 옮겼습니다.
theological_decisions:
- issue: 히브리어 본문의 ‘닮은 이’와 그리스어의 ‘이웃’ 차이
  chosen_reading: 본문은 히브리어를 따라 ‘자기와 같은 이’로 번역하고, 그리스어의 사회적 확장 의미는 본문에 넣지 않았습니다.
  alternative_readings:
  - 이웃
  - 자기에게 가까운 사람
  rationale: 이 구절은 남아 있는 히브리어가 더 직접적인 증거이므로, 유사성/동류성을 말하는 본뜻을 본문에 보존하는 것이 적절합니다. 그리스어는 해석적 확장으로 볼 수 있어 주석에서만 다루는 편이 좋습니다.
  doctrine_reference: 'PHILOSOPHY.md: Sirach는 보존된 히브리어가 있을 때 이를 우선하고, 그리스어 병행본은 대조 증거로 사용'
