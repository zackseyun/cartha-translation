base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/013/004.yaml
  text: If you are useful to him[a], he will make use of you; and if you bow down, he will not spare you.
  footnotes:
  - marker: a
    text: 'Greek tradition: ''The rich man does wrong, and he even blusters; the poor man is wronged, and he must even beg.'' The Hebrew witness preserved here gives a different warning about how a powerful person uses you when you are useful and shows no pity when you are brought low.'
    reason: alternative_reading
translation:
  language: ko
  text: 그에게 유용하면, 그가 당신을 부릴 것이며, 당신이 굽히면 그는 당신을 불쌍히 여기지 않을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 전통은 이 구절을 다르게 전합니다. 거기서는 “부자는 부당하게 행하고, 심지어 거만하게 굽니다. 가난한 자는 부당함을 당하고, 심지어 구걸해야 합니다.”라는 뜻입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אִם תִּכְשַׁר לוֹ
  english_pob_choice: If you are useful to him
  chosen_korean: 그에게 유용하면
  alternatives_korean:
  - 그에게 적합하면
  - 그에게 쓸모가 있으면
  - 그에게 유리하면
  lexicon: HALOT
  rationale: כשר는 여기서 도덕적 ‘옳음’이 아니라 실용적 적합성·유용성을 뜻하므로, 관계의 힘의 차이를 드러내는 ‘유용하면’이 가장 자연스럽습니다.
- source_word: יַעֲבֹד בָּךְ
  english_pob_choice: he will make use of you
  chosen_korean: 그가 당신을 부릴 것이며
  alternatives_korean:
  - 그가 당신을 사용할 것이며
  - 그가 당신을 일시키실 것이며
  - 그가 당신을 착취할 것이며
  lexicon: HALOT
  rationale: ‘일하다/사용하다’의 관용적 의미를 살리면서도, 권력자가 사람을 도구처럼 대하는 뉘앙스를 담기 위해 ‘부리다’를 택했습니다.
- source_word: וְאִם תִּכְרַע
  english_pob_choice: and if you bow down
  chosen_korean: 당신이 굽히면
  alternatives_korean:
  - 당신이 무너지면
  - 당신이 굴복하면
  - 당신이 엎드리면
  lexicon: HALOT
  rationale: כרע는 문자적으로 ‘구부리다/꿇다’의 뜻이 있어, 사회적으로 낮아짐과 몸의 동작을 함께 담는 ‘굽히면’이 적절합니다.
- source_word: לֹא יַחְמֹל עָלֶיךָ
  english_pob_choice: he will not spare you
  chosen_korean: 그는 당신을 불쌍히 여기지 않을 것입니다
  alternatives_korean:
  - 그는 당신을 용서하지 않을 것입니다
  - 그는 당신을 불쌍히 여기지 않을 것입니다
  - 그는 당신에게 자비를 베풀지 않을 것입니다
  lexicon: HALOT
  rationale: חמל은 ‘불쌍히 여기다/가엾게 여기다’와 더불어 ‘아끼다, 불쌍히 여겨 손대지 않다’의 뜻을 가지므로, 한국어에서는 직설적 경고를 살리기 위해 ‘불쌍히 여기지 않을 것입니다’로 옮겼습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 평행문의 큰 차이
  chosen_reading: 현존 히브리어 본문을 직접 번역하고, 그리스어 전통의 다른 읽기는 각주로만 보존했습니다.
  alternative_readings:
  - 그리스어 전통에 따라 ‘부자는 부당하게 행하고… 가난한 자는 부당함을 당한다…’로 옮김
  rationale: 이 절은 히브리어와 그리스어가 실질적으로 다른 경구를 전하므로, 사본이 살아 있는 히브리어를 본문으로 삼되 그리스어는 의미 범위를 점검하는 보조 증거로 처리하는 것이 적절합니다.
  doctrine_reference: 'Sirach 번역 원칙: 히브리어 현존 본문 우선, LXX는 대조 자료로 사용'
