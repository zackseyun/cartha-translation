review_pass:
  verdict: revise
  source_fidelity: 히브리어 본문의 조건절(‘네게 무엇인가/가진 것이 있으면’), 우호적인 말, 재산을 빼앗아 빈궁하게 함, 그리고 아무런 고통이나 거리낌을 느끼지 않음이라는 진행은 대체로 충실합니다. 다만 ‘털어 가면서도’는 행위의 완료와 그에 대한 무감각이라는 히브리어의 병렬을 다소 느슨하게 만들므로, 결과를 분명히 하는 표현이 더 적절합니다. 그리스어 평행문의 ‘너 안에서 일하고’는 한국어로 자연스럽지 않고 영어 감사 기록의 ‘work with you’에도 맞지 않습니다.
  naturalness: ‘네게 무엇인가 있으면’은 가능하나 ‘네게 가진 것이 있으면’이 현대 한국어에서 더 자연스럽습니다. ‘달콤하게 말하고’는 아첨의 뉘앙스를 줄 수 있으나 다소 구어적이므로, 격식 있는 잠언 문맥에는 ‘친절한 말을 하고’가 안정적입니다. ‘마음 아파하지 않습니다’는 행위에 대한 무감각을 자연스럽고 분명하게 전달합니다.
  terminology: 인칭대명사 ‘너/네게’와 합쇼체 서술을 유지했습니다. ‘빈털터리로 만들다’는 וִירֹשֶׁשְׁךָ의 박탈·빈궁화 의미를 현대적으로 명료하게 보존합니다. 각주는 그리스어의 조건 구조를 자연스러운 한국어로 옮기고, 히브리어와의 차이가 전승 형태의 실질적 차이임을 명시합니다.
  issues:
