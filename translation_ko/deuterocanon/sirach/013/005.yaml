translation:
  language: ko
  text: 네게 무엇인가 있으면, 그는 너에게 달콤하게 말하고, 너를 털어 가면서도 아파하지 않습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '그리스어 평행문: ''네가 쓸모가 있으면 그는 너 안에서 일하고, 네가 부족하면 너를 버릴 것이다.'' 이 절은 현존 히브리어와 의미가 다릅니다.'
    reason: alternative_reading
lexical_decisions:
- source_word: אִם שַלְּךָ
  english_pob_choice: If you have something
  chosen_korean: 네게 무엇인가 있으면
  alternatives_korean:
  - 네가 쓸모가 있으면
  - 네가 재물이 있으면
  - 네게 재산이 있으면
  lexicon: HALOT
  rationale: 히브리어 전승이 난해하고 그리스어 평행문도 '쓸모가 있으면'으로 갈라지므로, 한국어는 소유와 유용성의 여지를 함께 남기는 표현으로 옮겼습니다.
- source_word: יֵיטִיב דְּבָרָיו עִמָּךְ
  english_pob_choice: he will speak kindly with you
  chosen_korean: 그는 너에게 달콤하게 말하고
  alternatives_korean:
  - 그는 너에게 좋은 말을 하고
  - 그는 너를 부드러운 말로 대하고
  - 그는 너에게 친절하게 말하고
  lexicon: HALOT
  rationale: 직역하면 '그의 말을 너와 함께 좋게 하다'이지만, 문맥상 아첨하거나 친절한 말로 속이는 뉘앙스가 있어 '달콤하게 말하다'로 처리했습니다.
- source_word: וִירֹשֶׁשְׁךָ
  english_pob_choice: he will strip you bare
  chosen_korean: 너를 털어 가면서도
  alternatives_korean:
  - 너를 가난하게 만들면서도
  - 너를 약탈하면서도
  - 너를 빈털터리로 만들면서도
  lexicon: HALOT
  rationale: 동사는 상대를 빈궁하게 만들거나 빼앗는 뜻을 가지므로, 착취의 적극성을 드러내는 '털어 가다'를 선택했습니다.
- source_word: וְלֹא יִכְאַב לוֹ
  english_pob_choice: without feeling pain
  chosen_korean: 아파하지 않습니다
  alternatives_korean:
  - 그 일로 괴로워하지 않습니다
  - 그는 아파하지 않습니다
  - 그 일에 마음 아파하지 않습니다
  lexicon: HALOT
  rationale: 히브리어는 그가 그 행위로 인해 고통이나 양심의 아픔을 느끼지 않는다는 뜻이므로, 간결하게 무감각한 태도를 나타내도록 옮겼습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 평행문의 차이
  chosen_reading: 본문은 현존 히브리어를 따르되, 그리스어의 '쓸모가 있으면/부족하면 버린다'는 의미 차이는 각주로 보존했습니다.
  alternative_readings:
  - 그리스어를 따라 '네가 쓸모가 있으면 그는 너와 함께 일하고, 네가 부족하면 너를 버릴 것이다'로 번역
  rationale: 이 절은 전승 차이가 크므로 주 본문은 살아 있는 히브리어 증언에 붙이고, 의미가 다른 그리스어 전승은 삭제하지 않고 독자가 추적할 수 있게 남겨야 합니다.
  doctrine_reference: 'Sirach 번역 원칙: 히브리어가 남아 있으면 이를 본문으로 삼고, 그리스어 평행문은 대안 전승으로 주석 처리'
- issue: 직설적 착취 묘사의 보존
  chosen_reading: '''털어 가면서도''처럼 착취의 잔혹함을 약화시키지 않는 표현을 사용했습니다.'
  alternative_readings:
  - '''가난하게 만들면서도''처럼 완곡하게 번역'
  rationale: 문맥은 부자가 필요할 때는 달콤하게 말하고, 필요 없어지면 상대를 약탈해도 양심의 아픔이 없다는 비판입니다. 이를 완화하면 본문의 도덕적 날카로움이 흐려집니다.
  doctrine_reference: 잠언적 교훈의 직설성 보존
