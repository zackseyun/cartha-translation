    rationale: 원문은 그가 상대를 궁핍하게 만들고도 자신은 아픔을 느끼지 않는다는 두 동작을 나란히 둡니다. ‘-면서도’는 진행 중인 부수 행위처럼 들려 결과적 박탈과 도덕적 무감각의 대비가 약해집니다.
  - severity: medium
