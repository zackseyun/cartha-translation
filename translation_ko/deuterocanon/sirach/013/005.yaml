    rationale: 이는 한국어 관용에 맞지 않으며, 제공된 영어 감사 기록의 ‘he will work with you’와도 부합하지 않습니다. ‘너와 함께 일할 것이고’로 바로잡는 것이 안전합니다.
  - severity: low
