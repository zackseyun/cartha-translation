    reason: textual_variant
lexical_decisions:
- source_word: הִשָּׁמֵר
  english_pob_choice: Be on guard
  chosen_korean: 조심하고
  alternatives_korean:
  - 경계하십시오
  - 주의하십시오
  - 스스로를 지키십시오
  lexicon: HALOT
  rationale: נפעל 명령형은 자신을 지키며 경계하라는 경고이므로, 현대 한국어에서 자연스럽고 직접적인 「조심하고」로 옮겼습니다.
- source_word: וֶהְיֵה זָהִיר
  english_pob_choice: be very careful
  chosen_korean: 매우 주의하십시오
  alternatives_korean:
  - 몹시 조심하십시오
  - 매우 조심하십시오
  - 신중하십시오
  lexicon: HALOT
  rationale: זָהִיר는 주의 깊고 신중한 태도를 뜻하므로, 권고의 강도를 살려 「매우 주의하십시오」로 옮겼습니다.
- source_word: וְאַל תִּתְהַלֵּךְ עִם
  english_pob_choice: and do not walk with
  chosen_korean: 그리고 …와 함께 걷지 마십시오
  alternatives_korean:
  - 그리고 …와 어울리지 마십시오
  - 그리고 …와 함께 다니지 마십시오
  - 그리고 …와 동행하지 마십시오
  lexicon: HALOT
  rationale: 히트파엘 הלך는 문자적 ‘걷다’와 삶의 행실을 함께 시사하므로, 비유를 유지하는 「함께 걷지 마십시오」를 택했습니다.
- source_word: אַנְשֵׁי חָמָס
  english_pob_choice: violent men
  chosen_korean: 폭력적인 사람들
  alternatives_korean:
  - 폭력의 사람들
  - 폭력을 일삼는 사람들
  - 포악한 사람들
  lexicon: HALOT
  rationale: חָמָס는 폭력, 포악, 불의를 가리키므로, 문맥에 맞는 구체성을 살려 「폭력적인 사람들」로 옮겼습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행문의 차이
  chosen_reading: 본문은 살아 있는 히브리어 증거를 따라 ‘폭력적인 사람들’로 옮기되, 경고의 강도는 한국어의 ‘매우 주의하십시오’로 살렸습니다.
  alternative_readings:
  - 그리스어를 따라 ‘당신의 넘어짐과 함께 걷고 있다’
  - 그리스어를 반영해 ‘당신의 몰락과 함께 걷고 있다’
  rationale: 전승상 이 절의 히브리어가 더 직접적인 본문 근거이므로 이를 따르되, 그리스어의 강한 경고는 첫 절의 강조에만 보조적으로 반영했습니다.
  doctrine_reference: 'POB Sirach 원칙: 생존 히브리어를 주 본문으로 삼고, 그리스어 병행문은 보조 증거로 사용'
