translation:
  language: ko
  text: 그는 당신을 필요로 하고, 당신을 속일 것이며, 당신에게 미소를 지으면서 안심시킬 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 평행본문은 ‘그가 당신을 비워 버릴 것이다’라고 하여, 더 구체적으로는 착취하거나 소진시키는 뜻을 드러냅니다.
    reason: textual_variant
  - marker: b
    text: 히브리어 이 절은 어렵고, 그리스어 평행본문이 기만적 착취의 의미를 보강합니다.
    reason: textual_variant
lexical_decisions:
- source_word: צֹרֶךְ לוֹ עִמְּךָ
  english_pob_choice: He has need of you
  chosen_korean: 그는 당신을 필요로 하고
  alternatives_korean:
  - 그는 당신이 필요하고
  - 그는 당신에게 필요가 있고
  lexicon: HALOT
  rationale: 히브리어는 ‘그에게 당신과 함께 필요가 있다’는 식으로 상대의 유용성을 말하므로, ‘필요로 하고’가 가장 자연스럽게 그 의미를 살립니다.
- source_word: וְהָשִׁיעַ לָךְ
  english_pob_choice: he will deceive you
  chosen_korean: 당신을 속일 것이며
  alternatives_korean:
  - 당신을 기만할 것이며
  - 당신을 착취할 것이며
  lexicon: HALOT
  rationale: 히브리어 어형은 난해하지만, 그리스어 평행본문의 ‘비워 버리다’는 뉘앙스와 함께 보면 관계를 이용하는 기만의 의미가 적절하므로 ‘속이다’로 옮겼습니다.
- source_word: וְשׁוֹחֵק לְךָ
  english_pob_choice: he will smile at you
  chosen_korean: 당신에게 미소를 지으면서
  alternatives_korean:
  - 당신을 향해 웃으면서
  - 당신과 함께 웃으면서
  lexicon: HALOT
  rationale: 이 동사는 단순한 웃음보다 겉으로 친근하게 보이는 태도를 가리킬 수 있어, 여기서는 위장된 호의를 드러내는 ‘미소를 짓다’가 적절합니다.
- source_word: וְהִבְטִיחֶךָ
  english_pob_choice: reassure you
  chosen_korean: 안심시킬 것입니다
  alternatives_korean:
  - 당신을 안심하게 할 것입니다
  - 당신에게 확신을 줄 것입니다
  lexicon: HALOT
  rationale: 히필형의 בטח는 상대를 안전하다고 느끼게 하다의 뜻이므로, ‘안심시킬 것입니다’가 causative 뉘앙스를 잘 보존합니다.
theological_decisions:
- issue: 지혜문학의 경고 문맥에서 동사의 도덕적 함의
  chosen_reading: 겉으로는 호의적이지만 실제로는 상대를 이용하고 속이는 사람의 태도를 드러내는 경고로 읽었습니다.
  alternative_readings:
  - 단순한 사회적 호의로 읽는 것
  - 물질적 착취만을 강조하는 것
  rationale: 히브리어 본문과 그리스어 평행본문이 함께 제시하는 흐름은 친절한 말 뒤의 자기이익을 폭로하는 경고이므로, 서술의 도덕적 긴장을 약화시키지 않았습니다.
  doctrine_reference: 지혜문학의 분별과 경계 권면
