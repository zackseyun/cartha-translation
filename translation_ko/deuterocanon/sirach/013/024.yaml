  source_fidelity: 히브리어 본문은 ‘가난한 사람이 말할 때 사람들이 그를 업신여기고, 그가 비틀거리면 그를 더 밀어 넘어뜨린다’는 뜻입니다. 초안은 전체 뜻을 대체로 따르지만, ‘밀어넘깁니다’는 현대 한국어에서 비자연스럽고 동작 관계도 불명확합니다. 또한 גַּם הֵם(‘그들도’)에 관한 주석은 해당 표현이 있는 절에 닻을 두는 편이 정확합니다.
  naturalness: ‘그를 더욱 밀쳐 넘어뜨립니다’가 ‘밀어넘깁니다’보다 자연스럽고, 넘어지려는 이를 더욱 쓰러뜨리는 이미지를 명료하게 전달합니다. 인용문의 ‘누구냐?’는 원문의 경멸적 어조를 자연스럽게 보존합니다.
