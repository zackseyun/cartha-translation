base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/013/024.yaml
  text: When a poor man speaks[a], they say, “Who is this?” and if he stumbles[b], they push him down all the more.
  footnotes:
  - marker: a
    text: Hebrew 'they too push him'; the sense is that others add to his downfall rather than helping him when he stumbles.
    reason: lexical_alternative
  - marker: b
    text: 'The Greek parallel differs substantially here: ''Wealth is good when there is no sin in it, and poverty is evil in the mouth of the godly.'' The main translation follows the extant Hebrew witness, with the Greek kept in view as a parallel tradition.'
    reason: textual_variant
translation:
  language: ko
  text: 가난한 사람이 말하면, 사람들은 “이 사람이 누구냐?”라고 합니다. 그가 비틀거리면, 그들은[a] 그를 더욱 밀쳐 넘어뜨립니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘그들도 그를 밀쳐 넘어뜨린다’입니다. 앞서 그를 업신여긴 사람들이 그가 비틀거릴 때에는 도와주지 않고 그의 넘어짐을 더한다는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어 병행본문은 상당히 다릅니다. “죄가 없는 재물은 좋고, 경건한 이의 입에서는 가난이 나쁘다.” 본문 번역은 현존 히브리어 증언을 따르며, 그리스어는 병행 전승으로 참고합니다.
    reason: textual_variant
lexical_decisions:
- source_word: דַּל
  english_pob_choice: a poor man
  chosen_korean: 가난한 사람
  alternatives_korean:
  - 가난한 남자
  - 가난한 자
  lexicon: HALOT
  rationale: 히브리어 דַּל은 가난하고 사회적으로 낮은 처지를 가리키므로, 성별을 과도하게 부각하지 않는 현대 한국어로는 ‘가난한 사람’이 자연스럽고 문맥에도 맞습니다.
- source_word: דּוֹבֵר
  english_pob_choice: speaks
  chosen_korean: 말하면
  alternatives_korean:
  - 말합니다
  - 말할 때
  lexicon: HALOT
  rationale: 분사형은 일반적·반복적 상황을 나타내므로, 한국어에서는 조건절 안의 ‘말하면’이 가장 자연스럽게 그 상시적 의미를 살립니다.
- source_word: מִי זֶה
  english_pob_choice: Who is this?
  chosen_korean: 이 사람이 누구냐?
  alternatives_korean:
  - 누구냐?
  - 이 자가 누구냐?
  lexicon: HALOT
  rationale: 경멸적 반응을 보존하면서도 한국어에서 직접적이고 구어적인 조롱을 살리기 위해 ‘이 사람이 누구냐?’로 옮겼습니다.
- source_word: יֶהְדֳּפוּהוּ
  english_pob_choice: they push him down all the more
  chosen_korean: 그를 더욱 밀어넘깁니다
  alternatives_korean:
  - 그를 더 밀어냅니다
  - 그를 더 밀어뜨립니다
  - 그를 더욱 떠밉니다
  lexicon: HALOT
  rationale: הדף는 밀어내다/밀쳐 떨어뜨리다의 뜻이 있어, 단순 배척보다 넘어짐을 가중하는 폭력적 이미지를 살리기 위해 ‘밀어넘깁니다’를 택했습니다.
theological_decisions:
- issue: 그리스어 병행본문과 히브리어 본문의 관계
  chosen_reading: 본문은 현존 히브리어 증언을 따랐고, 그리스어 병행은 본문 대조용 전승으로만 참고했습니다.
  alternative_readings:
  - 그리스어를 따라 ‘부자와 가난’의 격언으로 옮기는 읽기
  - 히브리어 본문을 의심하여 그리스어를 본문으로 삼는 읽기
  rationale: POB 영어 주석이 밝히듯 그리스어는 상당히 다르지만, 현재 구절의 주요 번역은 히브리어 증언에 근거해야 하므로 그리스어는 본문 대신 병행 전승으로만 반영합니다.
  doctrine_reference: 본문비평 원칙
