base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/013/022.yaml
  text: A poor man totters[a]; he speaks, and they cry, “Away, away!”; but an intelligent man speaks[b], and there is no place for him.
  footnotes:
  - marker: a
    text: 'The Hebrew phrase rendered “Away, away!” is terse and idiomatic; it conveys a repeated cry of dismissal or rebuke. The Greek parallel expands the sense: when the lowly fail, people reproach them.'
    reason: lexical_alternative
  - marker: b
    text: Or “he is given no hearing.” Literally, “there is no place for him,” meaning his insightful words receive no social room or acceptance.
    reason: alternative_reading
translation:
  language: ko
  text: 가난한 사람은 비틀거립니다[a]—그가 말하면 사람들은 “가라, 가라!” 하고 외치지만, 분별 있는 사람은 말해도[b] 그에게는 자리가 없습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 ‘미끄러지다/비틀거리다’의 불안정한 이미지를 담습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 “그에게는 자리가 없습니다”입니다. 여기서는 그의 말이 받아들여질 사회적 공간이 없다는 뜻입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: דַּל
  english_pob_choice: a poor man
  chosen_korean: 가난한 사람
  alternatives_korean:
  - 가난한 자
  - 빈한한 사람
  - 가난한 남자
  lexicon: HALOT
  rationale: דל은 사회적으로 가난하고 약한 사람을 가리키므로, 현대 한국어에서는 성별을 불필요하게 좁히지 않는 ‘가난한 사람’이 자연스럽고 원문 취지를 잘 드러냅니다.
- source_word: נָמוֹט
  english_pob_choice: totters
  chosen_korean: 비틀거립니다
  alternatives_korean:
  - 흔들립니다
  - 넘어집니다
  - 미끄러집니다
  lexicon: HALOT
  rationale: מוט는 불안정하게 흔들리거나 비틀거리는 이미지를 주므로, 상황의 취약성을 살리는 ‘비틀거립니다’가 적절합니다.
- source_word: גָּע גָּע יִשֶּׂא
  english_pob_choice: “Away, away!” / they cry
  chosen_korean: “가라, 가라!” 하고 외치지만
  alternatives_korean:
  - “꺼져, 꺼져!” 하고 외치지만
  - “물러가라, 물러가라!” 하고 외치지만
  - “나가라, 나가라!” 하고 외치지만
  lexicon: HALOT
  rationale: 반복된 감탄사는 단순한 거절과 배척의 외침이므로, 한국어에서는 직역적이면서도 자연스러운 배척 구호인 ‘가라, 가라!’로 옮겼습니다.
- source_word: מַשְׂכִּיל
  english_pob_choice: an intelligent/discerning man
  chosen_korean: 분별 있는 사람
  alternatives_korean:
  - 슬기로운 사람
  - 지각 있는 사람
  - 총명한 사람
  lexicon: HALOT
  rationale: משכיל은 단순 지능보다 이해와 분별을 강조하므로, ‘분별 있는 사람’이 POB의 의미를 가장 균형 있게 반영합니다.
- source_word: וְאֵין לוֹ מָקוֹם
  english_pob_choice: there is no place for him
  chosen_korean: 그에게는 자리가 없습니다
  alternatives_korean:
  - 그는 설 자리가 없습니다
  - 그에게는 자리가 주어지지 않습니다
  - 그는 받아들여지지 않습니다
  lexicon: HALOT
  rationale: 직역은 ‘자리가 없다’이지만, 여기서는 발언이 사회적으로 받아들여지지 않는 뜻이므로 한국어에서는 문맥을 살려 ‘그에게는 자리가 없습니다’로 옮겼습니다.
theological_decisions:
- issue: 시적 평행에서 두 사람의 사회적 취급 대비를 어떻게 드러낼지
  chosen_reading: 가난한 사람의 발언은 배척당하고, 분별 있는 사람의 발언도 받아들여질 자리가 없다는 대비를 살렸습니다.
  alternative_readings:
  - 가난한 사람은 넘어지고, 분별 있는 사람은 말해도 듣지 않는다
  - 가난한 사람은 비틀거리고, 분별 있는 사람은 말하지만 환영받지 못한다
  rationale: 히브리어와 그리스어 병행 모두 사회적 배제의 역설을 보여 주므로, 한국어에서도 단순한 개인 감정보다 공동체의 배척과 무시를 선명하게 드러냈습니다.
  doctrine_reference: 지혜문학의 사회적 통찰과 약자 배제의 현실을 보여 주는 본문 해석
