  naturalness: ‘가라, 가라!’는 현대 한국어의 배척 외침으로 다소 어색합니다. ‘저리 가라, 저리 가라!’가 반복된 축출의 외침을 더 자연스럽게 전달합니다. 또한 ‘말해도’의 양보 표현보다 원문의 병렬을 보존하는 ‘말하지만’이 안전합니다.
