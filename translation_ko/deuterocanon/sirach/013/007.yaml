  source_fidelity: 개정이 필요합니다. 특히 לְהִתְעַבֵּר בָּךְ는 עבר의 히트파엘 용례상 단순히 ‘지나쳐 가다’로 보기보다 ‘너에게 분노하다/격분하다’로 이해하는 것이 히브리어 문법과 어휘에 더 직접적으로 맞습니다. 그리스어는 ‘그가 너를 보고 버릴 것이다’라는 다른 전승 또는 해석적 확장을 보이므로, 본문에는 히브리어의 우선 의미를 두고 각주에서 그리스어 병행을 밝혀야 합니다. 마지막 구의 אֵלֶיךָ도 번역에 명시하는 편이 좋습니다.
  naturalness: ‘너를 가지고 장난칠 것입니다’와 ‘두세 번 너에게 아첨할 것입니다’는 현대 표준 한국어의 합쇼체로 자연스럽습니다. 다만 ‘너를 지나쳐 갈 것처럼 바라보고’는 한국어로 다소 부자연스럽고, 히브리어의 유력한 의미도 충분히 반영하지 못합니다. ‘너를 보고 네게 분노할 것이며’가 더 자연스럽고 충실합니다.
