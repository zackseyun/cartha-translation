base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/013/007.yaml
  text: As long as you are useful[a], he will make sport of you; two or three times he will flatter you. Then he will look at you as if to pass beyond you[b], and he will shake his head at you.
  footnotes:
  - marker: a
    text: Hebrew יְהָתֵל can suggest mocking, trifling with, or toying with someone; 'make sport of you' aims to preserve that range.
    reason: lexical_alternative
  - marker: b
    text: 'The Hebrew of the middle clause is difficult. The Greek witness expands the thought: after using you, he later sees you and leaves you. The translation follows the Hebrew while keeping the Greek parallel in view.'
    reason: textual_variant
translation:
  language: ko
  text: 네가 쓸모 있는 동안에는 그가 너를 가지고 장난칠 것입니다[a]. 두세 번 너에게 아첨할 것입니다. 그러고 나서는 너를 지나쳐 갈 것처럼 바라보고[b], 머리를 흔들 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 יְהָתֵל은 조롱하다, 가지고 놀다, 희롱하다의 뜻을 가질 수 있으므로, ‘가지고 장난치다’는 그 범위를 살린 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: 이 중간 절의 히브리어는 어렵습니다. 그리스어 증인은 ‘그가 너를 보고 버릴 것이다’는 뜻으로 풀어 줍니다. 본문은 히브리어의 이미지를 따르되 그리스어 평행 본문의 의미도 함께 고려했습니다.
    reason: textual_variant
lexical_decisions:
- source_word: עַד אֲשֶׁר תּוֹעִיל
  english_pob_choice: As long as you are useful
  chosen_korean: 네가 쓸모 있는 동안에는
  alternatives_korean:
  - 네가 유익한 동안에는
  - 네가 쓸모 있을 때까지
  lexicon: HALOT
  rationale: 지속 조건을 나타내는 표현으로, 관계가 ‘유용함’에 달려 있다는 뜻을 살려 자연스러운 합쇼체로 옮겼습니다.
- source_word: יְהָתֵל בָּךְ
  english_pob_choice: he will make sport of you
  chosen_korean: 너를 가지고 장난칠 것입니다
  alternatives_korean:
  - 너를 조롱할 것입니다
  - 너를 희롱할 것입니다
  - 너를 속일 것입니다
  lexicon: HALOT
  rationale: התל의 조롱·희롱·가지고 놀이하는 뉘앙스를 살리되, 단순한 ‘속이다’보다 착취적이고 경멸적인 태도를 드러내는 표현을 택했습니다.
- source_word: פַעֲמַיִם שָׁלֹשׁ
  english_pob_choice: two or three times
  chosen_korean: 두세 번
  alternatives_korean:
  - 두 번이나 세 번
  - 두세 차례
  lexicon: HALOT
  rationale: 히브리어의 수사적 반복 표현을 한국어의 자연스러운 관용구로 압축해 반복적 아첨을 전달했습니다.
- source_word: יַעֲרִיצֶךָ
  english_pob_choice: he will flatter you
  chosen_korean: 너에게 아첨할 것입니다
  alternatives_korean:
  - 너를 칭찬할 것입니다
  - 너를 치켜세울 것입니다
  - 너를 추켜세울 것입니다
  lexicon: HALOT
  rationale: 진심 어린 존중이 아니라 자기 이익을 위한 과장된 호의를 뜻하므로, ‘아첨하다’가 가장 직접적으로 대응합니다.
- source_word: יִרְאֲךָ לְהִתְעַבֵּר בָּךְ
  english_pob_choice: he will look at you as if to pass beyond you
  chosen_korean: 너를 지나쳐 갈 것처럼 바라보고
  alternatives_korean:
  - 너를 지나칠 듯 바라보고
  - 너를 외면할 듯 바라보고
  - 너를 스쳐 갈 듯 바라보고
  lexicon: HALOT
  rationale: 히브리어의 קשה한 구문과 그리스어 병행 본문이 모두 버리고 떠나는 뉘앙스를 지지하므로, ‘지나쳐 갈 것처럼’으로 불친절한 이탈의 이미지를 살렸습니다.
- source_word: וּבְרֹאשׁוֹ יָנִיעַ אֵלֶיךָ
  english_pob_choice: he will shake his head at you
  chosen_korean: 머리를 흔들 것입니다
  alternatives_korean:
  - 너를 향해 고개를 흔들 것입니다
  - 너를 보고 머리를 저을 것입니다
  lexicon: HALOT
  rationale: 히브리어 관용적 경멸 제스처와 그리스어의 직행 대응을 반영하되, 현대 한국어에서 자연스러운 ‘머리를 흔들다’로 옮겼습니다.
theological_decisions:
- issue: 본절의 인물 관계를 도덕적·사회적 착취로 드러내는지 여부
  chosen_reading: 가난한 사람을 잠시 이용하다가 버리는 억압적 관계를 그대로 드러내는 표현을 유지했습니다.
  alternative_readings:
  - 더 완곡하게 ‘잘해 주다’로 옮기는 방식
  - 단순히 ‘친절을 베풀다’로 중화하는 방식
  rationale: 히브리어와 그리스어 모두 유용성에 따라 호의를 보이다가 곧 경멸로 돌아서는 착취 구조를 보여 주므로, 이를 완화하지 않고 직설적으로 반영했습니다.
  doctrine_reference: 지혜문학의 사회 윤리와 약자 착취 비판
- issue: 중간 절의 어려운 동사구를 어떻게 처리할지 여부
  chosen_reading: ‘너를 지나쳐 갈 것처럼 바라보고’로 옮겨, 히브리어 이미지와 그리스어의 ‘버리고 떠남’을 함께 살렸습니다.
  alternative_readings:
  - ‘너를 외면할 것입니다’로 단순화하는 방식
  - ‘너를 지나가 버릴 것입니다’로 의역하는 방식
  rationale: 본문의 히브리어 표현이 난해하므로, 해석을 과도하게 단정하기보다 이미지와 병행 본문의 뜻을 함께 반영하는 절충이 필요합니다.
  doctrine_reference: 본문비평 및 평행본문 해석
