    rationale: 원문은 많은 말이 시험하는 수단 또는 계기임을 나타냅니다. 비교·비례 표현보다 ‘많은 말로’가 더 직접적입니다.
  - severity: low
    issue: 후반의 시제와 문장 연결이 다소 부자연스럽습니다.
    rationale: ‘시험하는 것이며’와 ‘살피고 있습니다’보다 일반적 경고를 나타내는 병렬 서술 ‘시험하고 … 살핍니다’가 자연스럽고, 히브리어 및 그리스어의 연속 동작도 잘 반영합니다.
