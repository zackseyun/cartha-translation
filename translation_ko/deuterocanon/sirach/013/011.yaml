base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/013/011.yaml
  text: Do not trust his ease with you[a], and do not believe his many words; for with much talk he is testing you, and while laughing with you he is probing you.
  footnotes:
  - marker: a
    text: Or 'free speech with him,' that is, unguarded familiarity or speaking too openly in his presence. The Hebrew 'freedom' and the Greek parallel both point in this direction.
    reason: lexical_alternative
translation:
  language: ko
  text: 그와 함께 자유롭게 지내려 하지 마시고, 그의 많은 말을 믿지 마십시오. 말이 많을수록 그가 당신을 시험하는 것이며, 당신과 웃으며 이야기하면서도 당신을 살피고 있습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַל תִּבְטַח לְחֹפֶשׁ עִמּוֹ
  english_pob_choice: Do not trust his ease with you
  chosen_korean: 그와 함께 자유롭게 지내려 하지 마시고
  alternatives_korean:
  - 그와 편하게 지내려 하지 마시고
  - 그와의 자유로운 친밀함을 믿지 마시고
  - 그와 허물없이 지내려 하지 마시고
  lexicon: HALOT
  rationale: חֹפֶשׁ עִמּוֹ는 문자적으로는 ‘자유’지만 문맥상 경계심 없는 친밀함을 가리키므로, POB의 해석을 살려 자연스러운 경계의 표현으로 옮겼습니다.
- source_word: וְאַל תַּאֲמִין לְרֹב שִׂיחוֹ
  english_pob_choice: and do not believe his many words
  chosen_korean: 그의 많은 말을 믿지 마십시오
  alternatives_korean:
  - 그의 많은 말을 신뢰하지 마십시오
  - 그의 말이 많다고 믿지 마십시오
  - 그의 많은 말에 속지 마십시오
  lexicon: HALOT
  rationale: אמן의 여기서는 ‘믿다/신뢰하다’의 뜻이므로, 대상이 ‘많은 말’일 때 가장 직접적이고 현대적인 표현으로 옮겼습니다.
- source_word: נִסּיוֹן
  english_pob_choice: he is testing you
  chosen_korean: 그가 당신을 시험하는 것이며
  alternatives_korean:
  - 그가 당신을 시험하고 있는 것이며
  - 그가 당신을 떠보는 것이며
  - 그것은 당신에게 시험이 되기 때문이며
  lexicon: HALOT
  rationale: 압축된 히브리어를 POB의 해석에 따라 동사적으로 풀어, 말이 많음의 목적이 ‘시험함’임을 분명히 했습니다.
- source_word: וַחֲקָרֶךָ
  english_pob_choice: he is probing you
  chosen_korean: 당신을 살피고 있습니다
  alternatives_korean:
  - 당신을 조사하고 있습니다
  - 당신을 탐색하고 있습니다
  - 당신을 캐보고 있습니다
  lexicon: HALOT
  rationale: חקר는 ‘살피다/조사하다/탐구하다’의 뜻이 있어, 대인관계 맥락에서 드러나는 면밀한 관찰과 속셈 파악을 자연스럽게 전달하는 ‘살피다’를 택했습니다.
theological_decisions:
- issue: 직설적 경고의 명령문 어조
  chosen_reading: 지혜문학의 경고를 한국어에서도 단호한 금지형으로 유지했습니다.
  alternative_readings:
  - 부드러운 권고형으로 완화
  - 설명형 문장으로 바꿈
  rationale: 본문은 상대의 말과 태도에 대한 경계 명령이므로, 권면의 긴장을 약화시키지 않도록 금지형을 보존했습니다.
  doctrine_reference: 지혜문학의 훈계와 분별의 권면
- issue: ‘웃으며 이야기하면서’의 양면성
  chosen_reading: 겉으로는 친근하지만 실제로는 시험과 탐색을 하는 이중성을 그대로 살렸습니다.
  alternative_readings:
  - 단순히 ‘친근하게’로 축소
  - 해석 없이 감정 묘사로만 처리
  rationale: 히브리어와 그리스어 모두 표면적 친절과 배후의 의도를 함께 보여 주므로, 그 긴장을 약화시키지 않도록 병렬 구조를 유지했습니다.
  doctrine_reference: 분별과 경계에 대한 지혜 전통
