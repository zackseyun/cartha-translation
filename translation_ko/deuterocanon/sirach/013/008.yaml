translation:
  language: ko
  text: 너무 대담하게 굴지 않도록 조심하고, 분별이 없는 사람들처럼 되지 마십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 병행문은 ‘미혹되지 않도록 조심하라. 그리고 네 기쁨 가운데서 수치를 당하지 말라’로 읽습니다. 히브리어와 그리스어는 이 절에서 상당히 다릅니다.
    reason: textual_variant
lexical_decisions:
- source_word: הִשָּׁמֵר
  english_pob_choice: Be careful
  chosen_korean: 조심하고
  alternatives_korean:
  - 주의하고
  - 경계하고
  - 삼가고
  lexicon: HALOT
  rationale: 니팔 명령형의 경고·주의 촉구를 한국어의 자연스러운 명령 표현인 ‘조심하다’로 옮겨, 문어체이면서도 현대적인 admonition을 살렸습니다.
- source_word: אַל תִּרְהַב מְאֹד
  english_pob_choice: not to be too bold
  chosen_korean: 너무 대담해지지 않도록
  alternatives_korean:
  - 너무 뻔뻔해지지 않도록
  - 너무 오만해지지 않도록
  - 너무 자신만만해지지 않도록
  lexicon: HALOT
  rationale: רָהַב의 과도한 자기주장, 대담함, 뻔뻔함의 범위를 고려하되, 본문의 핵심인 ‘지나친 대담함’에 가장 직접적인 ‘대담해지다’를 택했습니다. מְאֹד는 ‘너무’로 반영했습니다.
- source_word: וְאַל תִּדְמֶה
  english_pob_choice: do not make yourself like
  chosen_korean: 되지 마십시오
  alternatives_korean:
  - 처럼 되지 마십시오
  - 스스로 그렇게 만들지 마십시오
  - 같아지지 마십시오
  lexicon: HALOT
  rationale: 이 절에서 דמה는 ‘닮다/같아지다’의 의미로 이해하는 것이 자연스러워, ‘되다’ 계열로 옮겨 경고의 방향을 분명히 했습니다. 직역적 ‘스스로 같게 하다’는 한국어에서 부자연스러워 보완했습니다.
- source_word: בַּחֲסֵירֵי מַדָּע
  english_pob_choice: those who lack understanding
  chosen_korean: 분별이 없는 사람들
  alternatives_korean:
  - 지식이 부족한 사람들
  - 이해가 부족한 사람들
  - 무지한 사람들
  lexicon: HALOT
  rationale: 직역하면 ‘지식/이해가 결핍된 자들’이지만, 지혜문학의 도덕적·인지적 뉘앙스를 살려 한국어에서 자연스러운 ‘분별이 없는 사람들’로 옮겼습니다. ‘무지한’보다 덜 단정적이면서도 본문의 교훈성을 유지합니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행문의 현저한 차이
  chosen_reading: 본문은 현존 히브리어를 따라 번역하고, 그리스어의 다른 독법은 각주로만 보존합니다.
  alternative_readings:
  - '그리스어: ‘길을 잃지 않도록 조심하라, 그리고 네 기쁨 가운데서 낮아지지 말라.’'
  rationale: 집회서에서는 히브리어가 보존된 경우 그 본문을 우선하고, 의미가 크게 다른 그리스어 병행문은 변이로 투명하게 기록하는 것이 원칙에 맞습니다.
  doctrine_reference: 'PHILOSOPHY.md: translate from Hebrew where it survives; preserve substantial Greek divergences in footnotes.'
