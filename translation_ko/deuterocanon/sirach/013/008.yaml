  naturalness: 본문의 합쇼체와 문장 연결은 자연스럽습니다. 다만 ‘너무 대담해지지 않도록’은 다소 상태 변화에 치우치므로 ‘너무 대담하게 굴지 않도록’이 경계의 대상과 한국어 관용에 더 잘 맞습니다. 그리스어 각주의 ‘낮아지지 말라’는 ταπεινωθῇς의 수동적 ‘수치를 당하다/낮아지다’보다 다소 어색하므로 ‘수치를 당하지 말라’로 다듬는 것이 자연스럽습니다.
  terminology: ‘분별이 없는 사람들’은 חסירי מדע의 지혜문학적 지적·도덕적 결핍을 자연스럽게 전달하며 유지할 수 있습니다. ‘미혹되다’는 그리스어 ἀποπλανηθῇς(잘못 이끌리다, 미혹되다)를 ‘길을 잃다’보다 더 직접적으로 반영합니다.
