base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/013/016.yaml
  text: What fellowship has a wolf with a lamb? So a wicked man with a righteous man[b][a], and likewise a rich man with a man brought low.
  footnotes:
  - marker: a
    text: 'Hebrew: ''a rich man with a man brought low.'' The final expression is somewhat uncertain; it may denote a socially low or reduced person, hence ''brought low.'''
    reason: lexical_alternative
  - marker: b
    text: 'Greek parallel: ''All flesh gathers according to kind, and a man will cling to one like himself.'' This reflects a different form of the saying and supports the general theme that people associate with their own kind.'
    reason: alternative_reading
translation:
  language: ko
  text: 늑대와 어린양이 무슨 교제가 있겠습니까? 악인이 의인과 그러하고, 부자도 낮아진 사람과 그러합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 마지막 표현은 비교적 불확실하며, 문맥상 사회적으로 낮아지거나 축소된 사람을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어 평행문은 ‘모든 육체는 종류대로 모이고, 사람은 자기와 같은 이에게 달라붙는다’는 다른 형태의 속담을 전합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: מַה יְּחֻבַּר
  english_pob_choice: What fellowship has
  chosen_korean: 무슨 교제가 있겠습니까?
  alternatives_korean:
  - 무슨 연합이 있겠습니까?
  - 무엇과 결합될 수 있겠습니까?
  - 무슨 관계가 있겠습니까?
  lexicon: HALOT
  rationale: חבר의 수동형 질문은 단순한 물리적 결합보다 관계적 결속을 묻는 표현이므로, 한국어에서는 자연스럽고 성경적 어감을 살리는 ‘교제’가 가장 잘 맞습니다.
- source_word: זְאֵב
  english_pob_choice: wolf
  chosen_korean: 늑대
  alternatives_korean:
  - 이리
  lexicon: HALOT
  rationale: 비교의 첫 항에 나오는 동물명으로, 표준적인 현대 한국어 표현인 ‘늑대’가 직접적입니다.
- source_word: כֶּבֶשׂ
  english_pob_choice: lamb
  chosen_korean: 어린양
  alternatives_korean:
  - 새끼양
  - 양
  lexicon: HALOT
  rationale: 포식자-피식자 대비에서 ‘어린양’이 가장 분명하고 관용적으로 약함과 무방비를 드러냅니다.
- source_word: נֶאֱצָל
  english_pob_choice: a man brought low
  chosen_korean: 낮아진 사람
  alternatives_korean:
  - 천한 사람
  - 몰락한 사람
  - 가난한 사람
  lexicon: HALOT
  rationale: 이 형용사는 마지막 구절에서 부자와 대비되는 사회적 저하·축소의 상태를 가리킬 수 있으므로, 경제적 빈곤으로 한정하지 않고 폭넓게 ‘낮아진 사람’으로 옮겼습니다.
theological_decisions:
- issue: 남성 단수 명사의 일반적 잠언 용법
  chosen_reading: 악인 / 의인 / 부자 / 낮아진 사람
  alternative_readings:
  - 악한 사람 / 의로운 사람 / 부유한 사람 / 낮아진 사람
  rationale: 히브리어는 대표적 남성 단수를 사용하지만, 잠언적 진술에서는 일반적 인물을 가리키므로 번역도 그 형식을 보존했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
- issue: 히브리어 본문을 मुख्य 본문으로 두고 그리스어 평행문을 보조 증거로 둠
  chosen_reading: 늑대-어린양-악인-의인-부자-낮아진 사람의 히브리어 대비를 본문에 반영
  alternative_readings:
  - 그리스어처럼 ‘모든 육체는 종류대로 모인다’로 옮김
  rationale: 이 단락은 현존 히브리어 본문이 높게 신뢰되므로 이를 본문 번역의 기준으로 삼고, 그리스어는 사상적 평행으로만 존중하는 것이 적절합니다.
  doctrine_reference: PHILOSOPHY.md §What we are translating
