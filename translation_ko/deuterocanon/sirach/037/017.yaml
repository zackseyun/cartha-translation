translation:
  language: ko
  text: 그러나 한 사람은 항상 두려워합니다[a] — 당신이 아는 바로는 그는 계명을 지키는 사람입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 현전 카이로 게니자 히브리어는 이 절에서 매우 다르게 전하며, 대략 ‘그러나 한 사람은 항상 두려워한다. 당신이 아는 바로는 그는 계명을 지키는 사람이다’에 가깝습니다. 히브리어 증언은 이곳에서 본문이 어긋나 있는 것으로 보입니다.
    reason: textual_variant
lexical_decisions:
- source_word: אך איש מפחד תמיד
  english_pob_choice: But a man is always fearful
  chosen_korean: 그러나 한 사람은 항상 두려워합니다
  alternatives_korean:
  - 그러나 한 사람은 늘 두려워합니다
  - 그런데 어떤 사람은 언제나 두려워합니다
  lexicon: HALOT / POB audit trail
  rationale: 현존 히브리어가 '남자/사람'과 '두려워하다'를 전하므로, 영어 POB의 본문 흐름을 따라 '그러나'로 시작하면서 אדם 일반을 '한 사람'으로 자연스럽게 옮겼습니다.
- source_word: שומר מצוה
  english_pob_choice: keeps the commandment
  chosen_korean: 계명을 지키는 사람입니다
  alternatives_korean:
  - 계명을 지킵니다
  - 계명을 지키는 자입니다
  lexicon: HALOT
  rationale: שומר는 단순 소유가 아니라 지속적 준수를 뜻하므로 '지키는'을 택했고, מצוה는 단수형이어서 '계명'으로 옮겼습니다.
- source_word: אשר תדע
  english_pob_choice: whom you know
  chosen_korean: 당신이 아는 바로는
  alternatives_korean:
  - 당신이 아는 사람은
  - 당신이 알고 있는 이는
  lexicon: HALOT
  rationale: 관계절 אשר תדע의 직접적인 인식 관계를 살리되, 한국어에서는 서술어를 앞에 두기보다 '당신이 아는 바로는'으로 풀어 독자가 관계를 자연스럽게 이해하도록 했습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 평행문의 상이함
  chosen_reading: 히브리어 현전문을 본문으로 따르되, 본문이 어색한 관계절 구조를 가진다는 점은 각주로 드러냈습니다.
  alternative_readings:
  - 그리스어 평행문을 따라 '모든 일의 시작은 말이요…'로 옮김
  rationale: 제공된 히브리어는 major_mismatch로 표시되어 있지만, 본문 번역은 우선 현전 히브리어를 반영해야 하므로 이를 채택하되, 별도 각주로 그리스어와의 불일치를 투명하게 남겼습니다.
  doctrine_reference: 'Sirach 번역 원칙: 현전 히브리어를 우선하되, 본문이 손상되거나 크게 불일치할 때는 주석으로 본문 상태를 알린다.'
