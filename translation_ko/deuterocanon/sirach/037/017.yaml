  source_fidelity: 현전 히브리어의 어휘 순서와 크게 맞지만, ‘당신이 아는 바로는’은 אשר תדע의 관계를 한국어에서 부자연스럽고 불분명하게 만듭니다. 또한 현 각주는 히브리어가 ‘매우 다르게’ 전한다고 하나 본문도 바로 그 히브리어를 번역하고 있어, 어느 본문과 다른지 밝히지 않아 부정확합니다. 그리스어 평행문은 실제로 현전 히브리어와 전혀 다른 격언을 전합니다.
  naturalness: ‘그러나 늘 두려워하는 사람이 있으니, 당신이 알기로 그는 계명을 지키는 사람입니다’는 합쇼체를 유지하면서도 히브리어의 어색하고 불확실한 관계절을 과도하게 매끈하게 만들지 않고 전달합니다.
  terminology: ‘계명’과 ‘지키는 사람’은 שומר מצוה에 적절합니다. ‘두려워하는’은 מפחד의 지속적 의미를 자연스럽게 반영합니다.
  issues:
  - severity: medium
    issue: 관계절의 한국어 표현이 부자연스럽고 지시 관계가 불명확합니다.
    rationale: ‘당신이 아는 바로는 그는’은 한국어에서 ‘무엇을 아는지’가 선명하지 않습니다. אשר תדע를 ‘당신이 알기로’로 옮기면 본문의 불완전하거나 난해한 연결을 보존하면서 문장이 읽힙니다.
  - severity: high
    issue: 본문 비평 각주가 본문과의 관계 및 그리스어 평행문의 차이를 정확히 설명하지 않습니다.
    rationale: 현재 본문은 현전 히브리어를 번역하는데 각주는 히브리어가 ‘매우 다르게’ 전한다고만 하여 비교 대상이 없습니다. 각주는 히브리어와 그리스어가 서로 크게 다름을 명시하고, 어느 쪽을 본문에 따랐는지 밝혀야 합니다.
  revised_text: 그러나 늘 두려워하는 사람이 있으니[a], 당신이 알기로 그는 계명을 지키는 사람입니다.
  revised_footnotes:
  - marker: a
    text: 현전 카이로 게니자 히브리어는 대략 ‘그러나 한 사람은 늘 두려워한다. 당신이 아는 이는 계명을 지키는 사람이다’라고 읽힙니다. 그러나 그리스어 평행문은 ‘모든 일의 시작은 말이며, 모든 행동에 앞서 조언이 있다’라고 전합니다. 두 전승은 크게 다르며, 본문은 현전 히브리어를 옮겼습니다.
    reason: textual_variant
  revision_rationale: 현전 히브리어를 우선하여 본문을 유지하되, 난해한 관계절을 현대 표준 한국어의 합쇼체로 최소한만 다듬었습니다. 각주는 히브리어 본문 자체를 ‘다른’ 본문처럼 서술하던 혼선을 바로잡고, 실제 상이한 그리스어 평행문과 본문 선택을 투명하게 제시합니다.
