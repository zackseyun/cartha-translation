translation:
  language: ko
  text: 아, 악한 생각이여! 네가 세상을 속임으로 가득 채우려고 지음받았습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 평행본문은 “아, 악한 생각이여, 네가 어디서 굴러 들어왔느냐? 마른 땅을 속임으로 덮으려고…”라고 합니다. 이는 난해한 히브리어 표현을 ‘생각/의도’로 이해하는 것을 뒷받침하며, 히브리어의 ‘채우다’ 대신 ‘덮다’를 읽습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הוי
  english_pob_choice: Alas
  chosen_korean: 아
  alternatives_korean:
  - 슬프도다
  - 화 있을진저
  lexicon: HALOT
  rationale: 지혜문학의 탄식적 감탄사를 현대 한국어에서는 짧은 탄식형 ‘아’로 옮겨, 원문의 정서적 강도를 살리면서도 자연스럽게 들리게 했습니다.
- source_word: רע / πονηρὸν
  english_pob_choice: evil
  chosen_korean: 악한
  alternatives_korean:
  - 사악한
  - 나쁜
  lexicon: HALOT
  rationale: 도덕적 악을 가리키는 형용사이므로 ‘악한’이 가장 직접적이며, POB의 ‘evil’에 대응하는 무게를 유지합니다.
- source_word: יָמַר/יֹאמַר (difficult; Greek ἐνθύμημα)
  english_pob_choice: thought
  chosen_korean: 생각
  alternatives_korean:
  - 말
  - 생각거리
  lexicon: HALOT
  rationale: 히브리어 전승이 난해하지만 그리스어 평행본문의 ‘생각/의도’(ἐνθύμημα)가 해석을 지지하므로, 인격화된 악한 생각으로 받는 것이 가장 일관됩니다.
- source_word: למלא פני תבל
  english_pob_choice: to fill the face of the world
  chosen_korean: 세상의 온 얼굴을 … 채우려고
  alternatives_korean:
  - 세상의 면을 채우려고
  - 온 세상을 채우려고
  lexicon: HALOT
  rationale: ‘penei tevel’의 직역적 이미지인 ‘세상의 얼굴’을 보존하되, 한국어에서는 ‘온 얼굴’로 자연화하여 원문의 비유를 살렸습니다.
- source_word: תרמית
  english_pob_choice: deceit
  chosen_korean: 속임
  alternatives_korean:
  - 기만
  - 속임수
  lexicon: HALOT
  rationale: 명사 תרמית의 의미를 간결하게 옮기면서, 문맥상 세계를 가득 채우는 부정적 성격을 드러내기 위해 ‘속임’을 택했습니다.
theological_decisions:
- issue: 난해한 히브리어 어형을 그리스어 평행본문으로 보정할지 여부
  chosen_reading: 본문은 ‘악한 생각’으로 이해하여 인격화된 악의 내적 기원을 질책하는 말로 옮겼습니다.
  alternative_readings:
  - 악한 말
  - 악한 친구/동반자
  rationale: 히브리어 본문은 전승상 난점이 있으나, 그리스어가 ‘악한 생각/의도’로 명시하므로 문맥과 평행본문을 함께 고려할 때 가장 설득력 있습니다.
  doctrine_reference: 'PHILOSOPHY.md: Hebrew primary with Greek parallel as translation control where the Hebrew is difficult'
- issue: 원문의 수사적 질문과 탄식 어조 보존
  chosen_reading: 감탄과 질책이 함께 있는 형식으로 ‘아, … 왜 지음받았느냐?’를 유지했습니다.
  alternative_readings:
  - 왜 생겨났느냐?
  - 왜 만들어졌느냐?
  rationale: 지혜문학의 책망적 탄식이므로, 단순 정보 전달보다 인격화된 악을 향한 질책과 허무감을 드러내는 형태가 본문의 힘을 더 잘 반영합니다.
  doctrine_reference: 문학적-신학적 장르 보존 원칙
