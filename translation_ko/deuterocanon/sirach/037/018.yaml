base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/037/018.yaml
  text: But with one whose heart is like your heart[a], if you stumble[b], he will be affected also.
  footnotes:
  - marker: a
    text: 'Hebrew: ''his heart is like your heart.'' This may also be expressed as ''one who is like-minded with you,'' but ''heart'' is retained to preserve the Hebrew idiom.'
    reason: lexical_alternative
  - marker: b
    text: 'The final clause is terse in Hebrew: literally, ''if you stumble, it will reach him.'' The sense is that your misstep or trouble affects such a person as well.'
    reason: alternative_reading
translation:
  language: ko
  text: 그러나 마음이 당신의 마음과 같은 사람이라면[a], 당신이 넘어지면 그것도 그에게 미칩니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘그의 마음은 당신의 마음과 같다’는 뜻입니다. ‘마음’은 여기서 단순한 감정보다 내면의 성향과 의향을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 매우 간결하여, “당신이 넘어지면 그것이 그에게 미친다”에 가깝습니다. 즉, 당신의 실패나 어려움이 그런 사람에게도 영향을 줍니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אך
  english_pob_choice: But
  chosen_korean: 그러나
  alternatives_korean:
  - 하지만
  - 그런데
  - 그러나
  lexicon: HALOT
  rationale: 앞절과의 대비를 자연스럽게 살리면서도, 지혜문학의 간결한 대조를 한국어로 매끄럽게 옮기기 위해 「그러나」를 택했습니다.
- source_word: לבבו כלבבך
  english_pob_choice: whose heart is like your heart
  chosen_korean: 마음이 당신의 마음과 같은 사람
  alternatives_korean:
  - 당신의 마음과 같은 마음을 가진 사람
  - 당신과 마음이 같은 사람
  - 당신의 마음과 같은 자
  lexicon: HALOT
  rationale: 히브리어의 לב/לבב는 단순한 감정이 아니라 내면과 의향을 가리키므로, 전통적 직역을 살려 「마음」을 유지하되 한국어에서 자연스럽게 사람을 지시하도록 옮겼습니다.
- source_word: אם תכשל
  english_pob_choice: if you stumble
  chosen_korean: 당신이 넘어지면
  alternatives_korean:
  - 당신이 실수하면
  - 당신이 실패하면
  - 당신이 비틀거리면
  lexicon: HALOT
  rationale: תכשל는 문자적으로 ‘비틀거리다/넘어지다’의 이미지를 가지므로, 도덕적 실패로 좁히지 않고 비유를 살린 「넘어지다」를 선택했습니다.
- source_word: יגיע אליו
  english_pob_choice: it will reach him also
  chosen_korean: 그에게도 그것이 미칩니다
  alternatives_korean:
  - 그에게도 닿습니다
  - 그에게도 영향을 줍니다
  - 그에게도 이릅니다
  lexicon: HALOT
  rationale: 히브리어는 결과가 그 사람에게 ‘미치다/이르다’는 뜻으로 간결하며, 주어가 생략되어 있습니다. 의미를 과도하게 해석하지 않으면서 한국어에서 자연스럽게 읽히도록 「미칩니다」로 옮겼습니다.
theological_decisions:
- issue: לב/לבב의 인지적·정서적 범위
  chosen_reading: 마음
  alternative_readings:
  - 생각
  - 속마음
  - 내면
  rationale: 전통 교회어인 ‘마음’이 히브리어 인류학의 폭을 가장 잘 보존하며, 단지 감정만이 아니라 의향과 성향까지 포함하는 말맛을 유지합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 6
- issue: יגיע אליו의 모호한 관계
  chosen_reading: 그에게도 그것이 미칩니다
  alternative_readings:
  - 그도 그 일에 영향을 받습니다
  - 그에게도 그 일이 닿습니다
  - 그도 넘어집니다
  rationale: 원문은 무엇이 누구에게 어떻게 미치는지 절제된 방식으로 말하므로, 의미를 특정한 한 가지로 과잉 해명하지 않고 영향의 도달을 남겨 두었습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 3
