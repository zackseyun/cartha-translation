  source_fidelity: 히브리어의 수사 의문문, ‘죽음에 이를’ 정도의 슬픔, 그리고 자기 자신/영혼만큼 가까운 동무가 적으로 변하는 반전을 모두 옮겨야 합니다. 초안의 핵심 의미는 대체로 맞지만, ‘당신의 영혼과 같은 동무’는 히브리어 관용어를 한국어에서 지나치게 문자적으로 재현하여 뜻이 불분명해집니다.
  naturalness: ‘죽음에 이르기까지 미치는 슬픔’과 ‘영혼과 같은 동무’의 결합은 현대 표준 한국어에서 다소 번역투입니다. 수사 의문문 안에 후반 상황을 직접 주어로 배치하면 합쇼체에서 더 자연스럽고 원문의 논리 관계도 선명해집니다.
  terminology: רע כנפשך는 문자적으로는 ‘당신의 영혼/자기 자신 같은 동무’이지만, 여기서는 매우 가까운 친구를 뜻하는 관용적 비교입니다. ‘자기 자신과도 같은 친구’가 자연스럽게 그 친밀성을 보존합니다. צר는 ‘원수’로 유지할 수 있습니다.
