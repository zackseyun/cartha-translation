base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/037/002.yaml
  text: Is there not grief that reaches to death[a], when a companion as your own soul turns into an enemy?
  footnotes:
  - marker: a
    text: Hebrew literally, 'a companion like your own soul'; the Greek parallel has 'a companion and friend.' The main text reflects the shared sense of intimate friendship.
    reason: lexical_alternative
translation:
  language: ko
  text: 자기 자신과도 같은 친구[a]가 원수로 변하는 것은 죽음에 이를 만큼 슬픈 일이 아니겠습니까?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘당신의 영혼/자기 자신 같은 동무’입니다. 이는 매우 가까운 친구를 가리키는 표현입니다. 그리스어 평행본문은 ‘동무와 친구’로 읽힙니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הלא דין
  english_pob_choice: Is there not grief
  chosen_korean: 슬픔이 있지 않습니까?
  alternatives_korean:
  - 슬픔이 없습니까?
  - 슬픔이 있지 않느냐?
  lexicon: HALOT; LXX λύπη
  rationale: הלא의 수사적 질문을 살리면서, דין은 여기서 법정적 '판결'보다 정서적 고통을 가리키므로 '슬픔'으로 옮겼습니다. 합쇼체 질문형으로 자연스럽게 표현했습니다.
- source_word: מגיע אל מות
  english_pob_choice: reaches to death
  chosen_korean: 죽음에 이르기까지 미치는
  alternatives_korean:
  - 죽음까지 이르는
  - 죽음에까지 닿는
  - 죽음에 이르는
  lexicon: HALOT; LXX ἕως θανάτου
  rationale: 히브리어의 '도달함/미침' 이미지를 유지하고, 죽음의 한계까지 닿는 강도를 살리기 위해 '죽음에 이르기까지 미치는'으로 옮겼습니다.
- source_word: רע כנפשך
  english_pob_choice: a companion as your own soul
  chosen_korean: 당신의 영혼과 같은 동무
  alternatives_korean:
  - 당신 자신의 영혼 같은 동무
  - 당신의 혼과 같은 동무
  - 당신의 목숨과 같은 동무
  lexicon: HALOT; LXX ἑταῖρος καὶ φίλος
  rationale: 히브리어의 문자적 비유 'your own soul'을 살리되, 한국어에서 과도하게 생경하지 않도록 '영혼과 같은 동무'로 옮겼습니다. '동무'는 친밀한 동반 관계를 드러냅니다.
- source_word: נהפך לצר
  english_pob_choice: turns into an enemy
  chosen_korean: 원수로 변할 때입니다
  alternatives_korean:
  - 원수로 바뀔 때입니다
  - 적으로 변할 때입니다
  - 원수가 될 때입니다
  lexicon: HALOT; LXX τρεπόμενος εἰς ἔχθραν
  rationale: נהפך의 '뒤집힘/변화'를 '변하다'로, צר의 적대성을 '원수'로 옮겨 관계의 급격한 반전을 드러냈습니다. 한국어 문맥상 '될 때'보다 '변할 때'가 변화의 동작을 더 분명히 합니다.
theological_decisions:
- issue: 히브리어와 그리스어 평행본문 사이의 관계
  chosen_reading: 본문은 히브리어의 '당신의 영혼과 같은 동무'를 본문에 반영하고, 그리스어가 가진 '친구/동무'의 평행 감각을 해치지 않도록 자연스럽게 처리했습니다.
  alternative_readings:
  - 그리스어를 따라 '동무와 친구'로 풀어 쓰는 방식
  - 히브리어를 직역해 '당신 자신의 영혼'으로 옮기는 방식
  rationale: POB의 영어 본문이 두 전통의 공통 의미를 취한 것처럼, 한국어도 한쪽을 지우지 않고 친밀한 관계의 강도와 배신의 충격을 함께 드러내는 쪽을 택했습니다.
  doctrine_reference: 본문비평/평행본문 조화
- issue: 문장의 종결 방식
  chosen_reading: 첫 절은 수사적 질문, 둘째 절은 조건절로 처리했습니다.
  alternative_readings:
  - 두 절을 모두 평서문으로 처리
  - 둘째 절을 질문형 안에 포함
  rationale: 히브리어 הלא의 질문성에 맞춰 첫 절을 질문으로 두고, 후반부는 원문의 상황 설명을 자연스럽게 풀어 합쇼체 문장으로 정리했습니다.
  doctrine_reference: 문장 수사와 담화 기능
