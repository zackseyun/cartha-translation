    rationale: כנפשך의 ‘영혼’은 현대 한국어의 종교적·심리적 의미를 직접 가리키기보다 ‘자기 자신만큼’이라는 친밀성의 비교를 나타냅니다. ‘자기 자신과도 같은 친구’로 풀어야 자연스럽고 충실합니다.
