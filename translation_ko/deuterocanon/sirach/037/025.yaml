base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/037/025.yaml
  text: There is a wise man who is wise for many[b][a], but for himself he is worthless.
  footnotes:
  - marker: a
    text: Hebrew גוֹאָל is difficult. It may carry the sense of being defiled, tainted, or otherwise of no value to oneself; 'worthless' reflects the contrast in context.
    reason: lexical_alternative
  - marker: b
    text: 'The Greek tradition at this point reads a different saying: ''The life of a man is by the number of days, but the days of Israel are innumerable.'' The Hebrew and Greek here do not match closely.'
    reason: textual_variant
translation:
  language: ko
  text: 지혜로운 사람은 많은 이들에게는 지혜롭지만, 자기 자신에게는 아무 쓸모가 없습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 גוֹאָל은 해석이 어렵습니다. 문맥상 ‘더럽혀진’, ‘오염된’, 혹은 ‘자기에게 쓸모 없는’ 뜻일 수 있으며, 여기서는 대조에 맞는 평가적 의미를 따랐습니다.
    reason: lexical_alternative
  - marker: b
    text: '헬라어 전승은 이곳에서 다른 문장을 전합니다: ‘사람의 생명은 날수의 수에 달려 있고, 이스라엘의 날수는 셀 수 없다.’ 따라서 히브리어와 헬라어는 이 절에서 서로 상당히 다릅니다.'
    reason: textual_variant
lexical_decisions:
- source_word: יֵשׁ חָכָם
  english_pob_choice: There is a wise man
  chosen_korean: 지혜로운 사람은
  alternatives_korean:
  - 지혜로운 한 사람은
  - 한 지혜로운 사람은
  lexicon: HALOT
  rationale: 존재 진술을 한국어에서는 자연스럽게 주어 제시형으로 옮겼습니다. חָכָם은 대표적 유형을 가리키므로 성중립화보다 ‘지혜로운 사람’이 원문 의미를 잘 드러냅니다.
- source_word: לְרַבִּים הוּא נֶחְכָּם
  english_pob_choice: wise for many
  chosen_korean: 많은 이들에게는 지혜롭지만
  alternatives_korean:
  - 많은 이들을 위해 지혜롭지만
  - 많은 사람에게 지혜를 베풀지만
  lexicon: HALOT
  rationale: ל + רבים는 대상/유익의 범위를 나타내므로 ‘많은 이들에게는’으로 처리했습니다. נֶחְכָּם의 상태적 뉘앙스는 ‘지혜롭다’로 살렸고, 문맥상 대조를 분명히 하기 위해 ‘하지만’을 붙였습니다.
- source_word: וּלְנַפְשׁוֹ הוּא גוֹאָל
  english_pob_choice: but for himself he is worthless
  chosen_korean: 자기 자신에게는 아무 쓸모가 없습니다
  alternatives_korean:
  - 자기 자신에게는 가치가 없습니다
  - 자기에게는 더럽혀진 자입니다
  lexicon: HALOT
  rationale: גוֹאָל은 어휘적으로 난해하므로, 문맥상 공공의 지혜와 개인적 실패의 대조를 드러내는 평가로 옮겼습니다. ‘아무 쓸모가 없습니다’는 POB의 ‘worthless’와 가장 직접적으로 대응하면서도 현대 한국어에서 자연스럽습니다.
theological_decisions:
- issue: 잠언적 대조의 강도 유지
  chosen_reading: 공동체에는 유익하지만 자기 자신에게는 무가치하다는 날카로운 대조를 그대로 유지했습니다.
  alternative_readings:
  - 자기에게는 더럽혀졌다/오염되었다고 완화하기
  - 개인적 유익이 없다고 완화하기
  rationale: 히브리어의 גוֹאָל은 본문상 확정하기 어려우나, POB도 문맥상 평가적 의미를 우선했습니다. 따라서 도덕적·실천적 경고의 힘을 약화시키지 않는 방향을 택했습니다.
  doctrine_reference: 지혜문학의 경구적 경고와 자기 수양의 책임
- issue: 문장 흐름과 수사적 대조
  chosen_reading: ‘많은 이들에게는 … 하지만 자기 자신에게는 …’의 병렬 구조를 유지했습니다.
  alternative_readings:
  - 한 문장으로 평서적으로 합치기
  - 대조 접속사를 약화하기
  rationale: 원문의 대조는 이 구절의 핵심 수사입니다. 한국어에서도 이 대비를 선명하게 보여 주어야 의미와 교훈이 보존됩니다.
  doctrine_reference: 성서 지혜문학의 대구법 보존
