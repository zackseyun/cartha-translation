translation:
  language: ko
  text: 당신의 마음에 있는 친구를 잊지 말고, 당신의 재물 가운데서도 그를 소홀히 하지 마십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 두 번째 행이 불확실하며, 그리스어 평행본문은 “당신의 소유 가운데서 그를 잊지 말라”는 뜻을 지지합니다.
    reason: textual_variant
  - marker: b
    text: 또는 “당신의 번영 가운데서 그를 저버리지 마십시오.”
    reason: lexical_alternative
