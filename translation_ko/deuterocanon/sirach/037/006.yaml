translation:
  language: ko
  text: 마음속에서 친구를 잊지 말고, 재물이 있을 때에도 그를 소홀히 여기지 마십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 둘째 행이 불확실합니다. 그리스어 평행본문은 “네 소유 가운데서 그를 잊지 말라”라고 하며, “재물이 있을 때에도 그를 소홀히 여기지 말라”는 뜻을 뒷받침합니다.
    reason: textual_variant
  - marker: b
    text: 또는 “번영할 때에도 그를 저버리지 마십시오.”
    reason: lexical_alternative
