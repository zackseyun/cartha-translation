  text: Do not forget a friend in your heart[b][a], and do not neglect him when you have wealth.
  footnotes:
  - marker: a
    text: Hebrew text is difficult in the second line; the Greek parallel reads, 'and do not be unmindful of him in your possessions,' which supports the sense 'do not neglect him when you have wealth.'
    reason: textual_variant
  - marker: b
    text: Or 'do not forsake him in your prosperity.'
