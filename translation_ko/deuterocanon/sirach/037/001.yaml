translation:
  language: ko
  text: 모든 친구는 “나는 그를 사랑합니다”라고 말합니다. 그러나 이름뿐인 친구가 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 압축된 표현이라 직역하면 ‘친구, 거기—이름으로만 친구’쯤 됩니다. 그리스어 평행구가 ‘이름뿐인 친구’라는 뜻을 분명히 해 줍니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כל אוהב
  english_pob_choice: Every friend
  chosen_korean: 모든 친구
  alternatives_korean:
  - 모든 사랑하는 사람
  - 모든 연인
  lexicon: HALOT
  rationale: 히브리어 אוהב는 ‘사랑하는 사람’일 수도 있지만, 여기서는 그리스어 평행구 Πᾶς φίλος에 따라 사회적 의미의 ‘친구’로 이해하는 것이 문맥상 가장 자연스럽습니다.
- source_word: אומר
  english_pob_choice: says
  chosen_korean: 말합니다
  alternatives_korean:
  - 말하십니다
  - 읊습니다
  lexicon: HALOT
  rationale: 지혜문학적 속담체의 단순한 발화를 살려 평이한 ‘말합니다’로 옮겼습니다.
- source_word: אהבתי
  english_pob_choice: I love him
  chosen_korean: 나는 그를 사랑합니다
  alternatives_korean:
  - 나는 그를 사랑했었습니다
  - 나는 그를 좋아합니다
  lexicon: HALOT
  rationale: 완료형이지만 한국어에서는 직설적 현재 인용으로 자연스럽게 풀어 ‘사랑합니다’로 옮기는 것이 적절합니다.
- source_word: אהב שם אהב
  english_pob_choice: a friend who is a friend in name only
  chosen_korean: 이름뿐인 친구
  alternatives_korean:
  - 이름뿐으로 친구인 사람
  - 이름만 친구인 사람
  lexicon: HALOT
  rationale: 히브리어의 압축된 표현을 그리스어 ὀνόματι μόνον φίλος가 분명히 해 주므로, 의미를 드러내는 관용적 한국어로 옮겼습니다.
theological_decisions:
- issue: friendship as nominal profession versus reality
  chosen_reading: 겉으로만 친구라고 말하는 관계와 실제 우정의 부재를 대조하는 잠언으로 읽었습니다.
  alternative_readings:
  - 단순히 친분의 정도를 말하는 중립적 문장으로 읽기
  rationale: 히브리어와 그리스어 모두 ‘말’과 ‘실제’의 대비를 강조하므로, 도덕적 통찰이 살아나도록 옮기는 것이 본문의 힘을 더 잘 반영합니다.
  doctrine_reference: 지혜문학의 도덕적 분별
