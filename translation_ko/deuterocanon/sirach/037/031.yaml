base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/037/031.yaml
  text: A wise man among his people will inherit honor, and his name will endure for everlasting life.
  footnotes:
  - marker: a
    text: Or 'his name will stand forever.' The Hebrew literally says 'his name stands in the life of eternity,' an expression that may denote enduring remembrance and may also carry overtones of everlasting life.
    reason: lexical_alternative
  - marker: b
    text: 'The Greek parallel differs substantially here: ''Through greed many have died, but the one who is attentive will add life.'' The main translation follows the extant Hebrew witness, with the Greek kept in view as a parallel source.'
    reason: alternative_reading
translation:
  language: ko
  text: 지혜로운 사람은 백성 가운데서 영예를 상속받고, 그의 이름은 영원한 생명 안에서 서 있습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘영원의 생명들 안에서’입니다. 이 표현은 오래 남는 기억을 뜻할 수도 있고, 영원한 생명까지 암시할 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어 평행본문은 크게 다릅니다. ‘탐욕 때문에 많은 사람이 죽었지만, 주의를 기울이는 이는 생명을 더할 것입니다.’ 본문은 현존하는 히브리어 증거를 따릅니다.
    reason: alternative_reading
lexical_decisions:
- source_word: חכם
  english_pob_choice: wise man
  chosen_korean: 지혜로운 사람
  alternatives_korean:
  - 지혜로운 이
  - 현자
  lexicon: HALOT
  rationale: 지혜를 가진 인물을 가리키는 일반 명사로 이해했고, 현대 한국어에서는 성별을 과도하게 드러내지 않는 ‘사람’이 자연스럽고 본문 의미를 잘 살립니다.
- source_word: עם
  english_pob_choice: his people
  chosen_korean: 그의 백성 가운데서
  alternatives_korean:
  - 그의 ժողովուրդ 가운데서
  - 그의 사람들 가운데서
  - 그의 민족 가운데서
  lexicon: HALOT
  rationale: 관계 전치사 עם은 소속 집단 안에서의 위치를 나타내므로, ‘그의 백성 가운데서’가 사회적·공동체적 관계를 가장 자연스럽게 드러냅니다.
- source_word: ינחל
  english_pob_choice: will inherit
  chosen_korean: 상속하고
  alternatives_korean:
  - 유업으로 받고
  - 물려받고
  - 얻게 되고
  lexicon: HALOT
  rationale: נחל의 핵심 이미지는 단순 획득보다 ‘유업으로 받다/상속하다’이므로, 명예를 마치 몫처럼 받는 비유를 살렸습니다.
- source_word: כבוד
  english_pob_choice: honor
  chosen_korean: 영예
  alternatives_korean:
  - 존귀
  - 명예
  - 영광
  lexicon: HALOT
  rationale: 지혜문맥에서 사회적 평판과 공적 존중을 가리키므로 ‘명예’도 가능하지만, 상속되는 결과의 품위를 살려 ‘영예’로 옮겼습니다.
- source_word: עומד
  english_pob_choice: will endure
  chosen_korean: 서 있습니다
  alternatives_korean:
  - 견디어 있습니다
  - 남아 있습니다
  - 지속됩니다
  lexicon: HALOT
  rationale: 히브리어는 직역하면 ‘서 있다’이지만, 이름이 시간 속에 계속 존속한다는 의미를 드러내기 위해 현재형 지속 표현을 택했습니다.
theological_decisions:
- issue: בחיי עולם의 의미
  chosen_reading: ‘영원한 생명 가운데서’라는 생명-언어를 유지해, 단순한 ‘영원히’보다 더 강한 표현이 되도록 했습니다.
  alternative_readings:
  - 영원히
  - 끝없는 기억 속에서
  - 영원한 삶 안에서
  rationale: 이 표현은 지속적 기억과 실제 생명의 뉘앙스를 함께 지닐 수 있으므로, 의미를 한쪽으로 닫지 않고 원문의 생명-어휘를 보존했습니다.
  doctrine_reference: 지속적 명성과 영생적 울림 사이의 긴장을 그대로 유지합니다.
