base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/037/011.yaml
  text: He will speak to you of the good of your way[a], and then stand opposite to watch your downfall.
  footnotes:
  - marker: a
    text: Hebrew is terse and somewhat uncertain here. The final phrase may also be rendered 'to watch your misfortune' or 'to watch your poverty.' The Greek parallel for this verse instead preserves a fuller warning not to rely on certain kinds of people for counsel.
    reason: alternative_reading
translation:
  language: ko
  text: 그는 네 길이 좋다고 네게 말하고, 네 불행을 지켜보려고 맞은편에 설 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 간결하고 다소 불확실합니다. 마지막 말은 ‘네 불행’ 외에 ‘네 가난’ 또는 ‘네 몰락’으로도 옮길 수 있습니다. 이 절의 그리스어 병행 본문은 더 긴 형태로, 여러 부류의 사람에게 조언을 구하지 말라고 경고합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ואמר לך
  english_pob_choice: He will speak to you
  chosen_korean: 그는 당신에게 …를 말하고
  alternatives_korean:
  - 그는 당신에게 …를 말할 것입니다
  - 그는 당신에게 …를 이야기하고
  lexicon: HALOT
  rationale: אמר의 기본 의미를 살려 직접적으로 ‘말하다’로 옮기되, 한국어 문장에서는 목적어를 자연스럽게 받도록 구성했습니다.
- source_word: מטוב דרכך
  english_pob_choice: of the good of your way
  chosen_korean: 당신의 길의 선함
  alternatives_korean:
  - 당신의 길의 좋음
  - 당신의 길의 좋았음
  - 당신의 길의 좋은 점
  lexicon: HALOT
  rationale: מן + טוב + דרך의 압축된 표현을 그대로 살려 ‘길’의 비유를 유지했고, ‘선함’으로 긍정적 평가를 드러냈습니다.
- source_word: וקם מנגד
  english_pob_choice: and then stand opposite
  chosen_korean: 그리고 나서 … 맞은편에 서게 될 것입니다
  alternatives_korean:
  - 그리고 나서 … 대하여 서게 될 것입니다
  - 그리고 나서 … 맞서 서게 될 것입니다
  - 그리고 나서 … 반대편에 서게 될 것입니다
  lexicon: HALOT
  rationale: מנגד의 공간적 의미를 살려 ‘맞은편에 서다’로 옮겼고, 원문의 단순 접속을 반영해 반대 접속의 강한 뉘앙스는 과도하게 넣지 않았습니다.
- source_word: להביט רישך
  english_pob_choice: to watch your downfall
  chosen_korean: 당신의 몰락을 지켜보려고
  alternatives_korean:
  - 당신의 불행을 지켜보려고
  - 당신의 가난을 지켜보려고
  - 당신의 재난을 바라보려고
  lexicon: HALOT
  rationale: רישך의 정확한 뜻이 불확실하다는 주석을 반영해, 문맥상 악화된 결과를 포괄하는 ‘몰락’으로 처리하되 ‘지켜보다’로 의도적 감시를 살렸습니다.
theological_decisions:
- issue: 히브리어의 간결하고 불확실한 끝부분을 한국어에서 어떻게 보존할지
  chosen_reading: 마지막 표현은 단정적 해석을 피하면서도 부정적 결과를 드러내는 ‘몰락’으로 번역했습니다.
  alternative_readings:
  - 당신의 불행
  - 당신의 가난
  - 당신의 재난
  rationale: 영문 POB가 각주에서 인정한 여러 가능성을 한국어 본문에서 하나로 확정하지 않고, 본문의 경고적 성격을 유지하는 쪽을 택했습니다.
  doctrine_reference: 'POB translation principle: preserve documented uncertainty without flattening the source'
