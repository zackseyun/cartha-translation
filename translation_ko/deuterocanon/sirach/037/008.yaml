  source_fidelity: 히브리어 דרך עליו는 문자적으로 ‘그를 밟다/짓밟다’라는 이미지를 지닙니다. 초안의 ‘그를 걸려 넘어지게 합니다’는 ‘그가 걸려 넘어지다’라는 별개의 인과 표현으로 바꾸어 원문의 동작상을 충분히 보존하지 못합니다. 대명사 ‘그’의 선행사가 본문에서 명시되지 않는 점은 유지했습니다.
  naturalness: ‘모든 조언자는 … 말합니다. 그러나 … 조언자도 있습니다’는 현대 한국어 합쇼체로 자연스럽습니다. ‘그를 짓밟는 조언자’는 원문의 비유적이고 적대적인 표현을 무리 없이 전달합니다.
