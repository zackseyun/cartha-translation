base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/037/008.yaml
  text: Every counselor says[b][a], “See!” but there is a counselor who trips him up.
  footnotes:
  - marker: a
    text: Hebrew 'See!' is difficult and may reflect a terse claim of insight or direction. The Greek parallel has a fuller warning about protecting yourself from a counselor, since he also counsels for himself.
    reason: alternative_reading
  - marker: b
    text: Or 'who takes advantage of him.' The Hebrew literally says 'treads on him,' likely expressing harmful or self-serving counsel.
    reason: lexical_alternative
translation:
  language: ko
  text: 모든 조언자는 말합니다. 「보라!」 그러나 어떤 조언자는 그를 걸려 넘어지게 합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 חזה는 매우 압축적이라 여기서는 단정적 촉구(“보라!”)로 옮겼습니다. 그리스어 평행본문은 조언자로부터 자신을 지키라는 더 긴 경고를 제시합니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어는 문자적으로는 “그 위를 밟는다/디딘다”는 뜻으로, 여기서는 해를 끼치거나 자기이익을 챙기는 조언을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כל יועץ
  english_pob_choice: Every counselor
  chosen_korean: 모든 조언자
  alternatives_korean:
  - 각 조언자
  - 매 조언자
  lexicon: HALOT
  rationale: 지혜문학의 격언체에 맞게 분배적 의미를 살려 “모든”으로 옮기고, יועץ는 기능을 드러내는 “조언자”로 옮겼습니다.
- source_word: אומר
  english_pob_choice: says
  chosen_korean: 말합니다
  alternatives_korean:
  - 말합니다
  - 말하니
  lexicon: HALOT
  rationale: 현재형 격언 문체를 유지하면서 현대 한국어 합쇼체에 맞게 자연스럽게 표현했습니다.
- source_word: חזה
  english_pob_choice: See!
  chosen_korean: 「보라!」
  alternatives_korean:
  - 「봐라!」
  - 「보십시오!」
  - 「알아보라!」
  lexicon: HALOT
  rationale: 히브리어가 매우 압축적이고 다의적이므로, POB의 “See!”에 대응하는 짧은 촉구형으로 “보라!”를 택해 단정적 통찰의 어조를 살렸습니다.
- source_word: דורך עליו
  english_pob_choice: trips him up
  chosen_korean: 그를 걸려 넘어지게 합니다
  alternatives_korean:
  - 그를 짓밟습니다
  - 그를 밟고 지나갑니다
  - 그에게 해를 끼칩니다
  lexicon: HALOT
  rationale: 직역상의 “밟다/디디다” 이미지는 유지하되, 문맥상 자기중심적 조언이 초래하는 해악을 한국어로 자연스럽게 드러내기 위해 “걸려 넘어지게 하다”로 옮겼습니다.
theological_decisions:
- issue: 히브리어의 압축성과 그리스어 평행본문의 보완 관계
  chosen_reading: 본문은 현존 히브리어를 따라 짧은 발화와 뒤이은 경고를 유지하고, 그 의미는 자기이익을 노리는 조언자의 위험으로 읽었습니다.
  alternative_readings:
  - 그리스어를 더 반영해 “조언자에게서 너 자신을 지키라 … 그가 자기 자신을 위해서도 조언하기 때문이다”로 풀어 쓰는 읽기
  rationale: 시락서는 히브리어가 남아 있을 때 그것을 우선하되, 그리스어가 분명히 덧붙이는 경고의 방향은 보존해야 합니다. 따라서 본문은 히브리어의 간결함을 살리고, 해석은 그리스어와 양립하게 두었습니다.
  doctrine_reference: 'PHILOSOPHY.md: 남아 있는 히브리어를 우선하되, 애매성은 성급히 해소하지 말 것'
