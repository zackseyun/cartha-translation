translation:
  language: ko
  text: 상인과는 거래하지 말고, 구매와 판매를 두고도 그러하십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 평행본문은 “그리고 네 마음의 계획을 세우라. 그것보다 더 신실한 것은 너에게 없기 때문이다.”라고 읽습니다. 현존 히브리어는 이와 상당히 다릅니다.
    reason: textual_variant
lexical_decisions:
- source_word: עם סוחר
  english_pob_choice: with a merchant
  chosen_korean: 상인과는
  alternatives_korean:
  - 장사꾼과는
  - 상인에게는
  lexicon: HALOT
  rationale: עם는 여기서 ‘~와 함께/상대하여’의 관계를 나타내므로, 경고의 대상인 상대자를 자연스럽게 드러내는 ‘상인과는’으로 옮겼습니다.
- source_word: אל תתגר
  english_pob_choice: do not bargain
  chosen_korean: 거래하지 말고
  alternatives_korean:
  - 흥정하지 말고
  - 다투지 말고
  - 장사하지 말고
  lexicon: HALOT
  rationale: 상인과의 문맥상 핵심은 분쟁이 아니라 상거래에 들어가서 흥정하는 행위이므로, 한국어에서는 포괄적으로 ‘거래하지 말고’가 가장 무난합니다.
- source_word: ממקנה
  english_pob_choice: about a purchase
  chosen_korean: 구매를 두고도
  alternatives_korean:
  - 구입을 두고도
  - 사들임을 두고도
  - 구매에 관해서도
  lexicon: HALOT
  rationale: ממקנה는 ‘획득/구매’의 뜻이므로, 뒤의 ממכר(판매)와 짝을 이루는 상거래 표현으로 ‘구매’를 살렸습니다.
- source_word: ממכר
  english_pob_choice: sale
  chosen_korean: 판매를
  alternatives_korean:
  - 팜을
  - 팔매를
  - 매도를
  lexicon: HALOT
  rationale: ממכר는 ‘판매/팔림’의 의미이므로, 앞의 ‘구매’와 짝지어 거래의 양면을 분명히 보여 주는 ‘판매’를 택했습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행구의 현저한 차이
  chosen_reading: 본문은 현존 히브리어의 상거래 경고를 따르고, 그리스어의 ‘마음의 계획을 세우라’는 독립적 전승은 주석적 대안으로만 취급합니다.
  alternative_readings:
  - '그리스어: ‘마음의 계획을 세우라…’'
  rationale: 이 절은 히브리어와 그리스어가 실질적으로 다른 문장을 보이므로, 본문은 현존 히브리어를 따르되 번역의 투명성을 위해 대안 전승 차이를 드러내야 합니다.
  doctrine_reference: 'Sirach 번역 원칙: 히브리어가 보존된 경우 히브리어를 우선하되, 그리스어의 중요한 이탈은 숨기지 않는다.'
