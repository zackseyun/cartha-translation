  text: Do not bargain with a merchant[a], nor over buying and selling.
  footnotes:
  - marker: a
    text: Greek parallel reads, 'And establish the counsel of your heart, for there is none more faithful to you than it.' The surviving Hebrew here differs substantially from the Greek tradition.
