translation:
  language: ko
  text: 어떤 지혜로운 사람은 자기 말 때문에 멸시를 받고, 온갖 맛있는 음식을 누리지 못합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 “자기 백성 가운데 있는 지혜로운 사람은 신뢰를 얻고, 그의 이름은 영원히 살아 있을 것이다”라고 읽습니다. 이곳의 히브리어와 그리스어는 크게 다릅니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְיֵשׁ
  english_pob_choice: There is
  chosen_korean: …도 …
  alternatives_korean:
  - 있습니다
  - 그리고 …이 있습니다
  lexicon: HALOT
  rationale: 존재 진술을 한국어 자연문으로 옮기되, 문장 흐름상 앞 문맥이 암시된 대조를 살려 간결하게 처리했습니다.
- source_word: חָכָם
  english_pob_choice: a wise man
  chosen_korean: 지혜로운 사람
  alternatives_korean:
  - 지혜자
  - 현명한 사람
  lexicon: HALOT
  rationale: 히브리어의 대표적 단수 인물을 자연스러운 현대 한국어로 옮겼습니다.
- source_word: בִּדְבָרוֹ
  english_pob_choice: for his words
  chosen_korean: 그 말 때문에
  alternatives_korean:
  - 그의 말로 인해
  - 그의 말 때문에
  lexicon: HALOT
  rationale: בְּ는 원인/근거를 나타내며, singular collective sense의 ‘말’이 문맥에 더 잘 맞습니다. POB의 영어 선택도 이 원인 의미를 반영합니다.
- source_word: נִמְאָס
  english_pob_choice: is despised
  chosen_korean: 멸시를 받으며
  alternatives_korean:
  - 버림받으며
  - 경멸받으며
  lexicon: HALOT
  rationale: Niphal의 수동적 사회적 거절/경멸을 한국어 관용에 맞게 표현했습니다.
- source_word: מִכָּל מַאֲכָל תַּעֲנוּג
  english_pob_choice: every pleasant food
  chosen_korean: 모든 기분 좋은 음식
  alternatives_korean:
  - 모든 즐거운 음식
  - 모든 별미
  lexicon: HALOT
  rationale: ‘pleasant/delightful food’의 구체적 이미지를 유지하되, 과도한 의역 없이 현대 한국어로 옮겼습니다.
- source_word: נִבְצָר
  english_pob_choice: is deprived
  chosen_korean: 박탈됩니다
  alternatives_korean:
  - 차단됩니다
  - 끊깁니다
  - 제한됩니다
  lexicon: HALOT
  rationale: 문맥상 허용되지 않거나 접근할 수 없게 되는 상태를 나타내므로, 결과 상태를 드러내는 수동 표현을 택했습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행본문의 큰 차이
  chosen_reading: 본문은 현존 히브리어를 따르고, 그리스어 전통은 주석적 대안으로만 보존합니다.
  alternative_readings:
  - 그리스어처럼 ‘백성 가운데 있는 지혜로운 사람은 신실함을 상속하고 그의 이름은 영원히 살 것이다’로 옮김
  rationale: 시라흐서는 현존 히브리어가 있을 때 이를 본문으로 삼는 원칙이 적절하며, 여기서는 그리스어가 단순 변이가 아니라 완전히 다른 진술이므로 본문에 합치지 않았습니다.
  doctrine_reference: 'PHILOSOPHY.md: translate from Hebrew where Sirach Hebrew survives; preserve source uncertainty honestly'
