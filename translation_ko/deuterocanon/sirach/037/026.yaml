revisions:
- from: 지혜로운 사람도 그 말 때문에 멸시를 받으며, 모든 기분 좋은 음식에서 박탈됩니다.[a]
  to: 어떤 지혜로운 사람은 자기 말 때문에 멸시를 받고, 온갖 맛있는 음식을 누리지 못합니다.[a]
  rationale: 원문에 없는 ‘도’를 제거하여 존재 진술을 보존하고, 음식과 관련된 수동 표현을 자연스러운 한국어로 고쳤습니다. 각주는 그리스어 병행본문의 πίστιν을 ‘신뢰’로 바로잡고, 히브리어와 그리스어의 큰 본문 차이를 유지합니다.
