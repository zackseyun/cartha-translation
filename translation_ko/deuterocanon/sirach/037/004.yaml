  lexicon: HALOT
  rationale: מרע는 단순한 성격 묘사보다 관계 안에서 해로운 사람을 가리키므로, 문맥상 자연스럽고 평가가 분명한 ‘악한 친구’로 옮겼습니다.
- source_word: מביט אל שלחן
  english_pob_choice: looks to the table
  chosen_korean: 잔칫상을 바라보지만
  alternatives_korean:
  - 상을 바라보지만
  - 식탁만 바라보지만
  - 식탁을 주시하지만
  lexicon: HALOT
  rationale: 직역하면 ‘상을 바라보다’이지만, 문맥의 대비가 공동 식탁의 이익을 노리는 태도임을 드러내므로 한국어에서 이해 쉬운 ‘잔칫상’을 택했습니다.
- source_word: בעת מצוקה
  english_pob_choice: in a time of distress
  chosen_korean: 환난의 때에는
  alternatives_korean:
  - 곤란의 때에는
  - 고난의 때에는
  - 위기의 때에는
  lexicon: HALOT
  rationale: מצוקה는 압박과 곤경을 뜻하므로, 한국어 성경 문체에서 의미가 가까운 ‘환난’을 사용했습니다.
- source_word: מנגד יעמד
  english_pob_choice: he will stand aloof
  chosen_korean: 옆에 서지 않습니다
  alternatives_korean:
  - 맞은편에 섭니다
  - 멀찍이 섭니다
  - 외면합니다
  lexicon: HALOT
  rationale: 히브리어와 헬라어 모두 ‘맞은편/상대하여’ 서는 이미지를 가지지만, POB의 설명대로 위기 때의 비협조적 거리두기를 한국어로 가장 자연스럽게 드러내기 위해 ‘옆에 서지 않습니다’로 옮겼습니다.
theological_decisions:
- issue: 위기 때의 태도 표현
  chosen_reading: 단순한 무관심을 넘어서, 곁에서 돕지 않고 거리를 두는 태도로 이해했습니다.
  alternative_readings:
  - 그저 옆에 서 있지 않는 중립적 자세
  - 적대적으로 맞서는 태도
  rationale: 히브리어 מנגד와 헬라어 ἀπέναντι는 문자적으로 ‘맞은편/상대하여’의 뜻이지만, 문맥상 배신적인 비우호성을 강조하되 과도한 적대까지 단정하지 않도록 했습니다.
  doctrine_reference: 문맥 중심의 지혜문학 해석
