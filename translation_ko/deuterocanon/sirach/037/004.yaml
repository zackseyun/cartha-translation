base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/037/004.yaml
  text: A bad friend looks to the table[b][a], but in a time of distress he will stand aloof.
  footnotes:
  - marker: a
    text: Or, more explicitly, 'has his eye on the table'—that is, he is present for the benefits of fellowship or food.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'stand opposite'; the Greek likewise has 'will be opposite.' This may imply standing aloof or even taking an adversarial position in trouble.
    reason: alternative_reading
translation:
  language: ko
  text: 악한 친구는 잔칫상을 바라보지만, 환난의 때에는 옆에 서지 않습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘상을 바라보다’입니다. 여기에는 식사나 교제의 이익을 노리는 뜻이 담길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘맞은편에 서다’이고, 헬라어도 ‘맞은편에 있게 되다’입니다. 위기 때 돕지 않고 거리를 두거나 반대편에 선다는 뉘앙스를 가질 수 있습니다.
    reason: alternative_reading
