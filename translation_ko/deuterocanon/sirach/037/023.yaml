base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/037/023.yaml
  text: A wise man instructs his own people, and the fruits of his understanding are trustworthy.[a][b]
  footnotes:
  - marker: a
    text: 'The surviving Hebrew here is difficult and differs sharply from the Greek. The main text follows the clearer Greek witness: ''A wise man instructs his own people, and the fruits of his understanding are trustworthy.'''
