  - marker: b
    text: Hebrew witness literally preserves an obscure phrase, approximately 'the uprooting/crown of the schemes of the heart; four shoulders(?) will blossom,' but the wording is uncertain and likely corrupt or poorly preserved.
    reason: alternative_reading
translation:
  language: ko
  text: 지혜로운 사람은 자신의 백성을 가르치고, 그의 통찰의 열매는 신뢰할 만합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 현존하는 히브리어 본문은 이 절에서 매우 난해하며 그리스어 본문과 크게 다릅니다. 주본문은 더 분명한 그리스어 전승을 따랐습니다.
    reason: textual_variant
  - marker: b
    text: 히브리어 증언에는 대략 ‘마음의 계책들의 뿌리/관(冠), 네 어깨(?)가 꽃필 것이다’라는 난해한 구절이 남아 있습니다. 표현의 뜻이 불확실하며 본문이 훼손되었거나 잘 보존되지 않았을 가능성이 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνὴρ σοφός
  english_pob_choice: a wise man
  chosen_korean: 지혜로운 사람
  alternatives_korean:
  - 지혜로운 남자
  - 지혜로운 이
  lexicon: BDAG
  rationale: 그리스어의 남성형은 대표성을 띠지만, 한국어에서는 성별을 굳이 드러내기보다 속담형 지혜 문장으로 자연스럽게 옮기기 위해 ‘사람’으로 처리했습니다.
- source_word: τὸν ἑαυτοῦ λαόν
  english_pob_choice: his own people
  chosen_korean: 자기 백성
  alternatives_korean:
  - 그의 백성
  - 자기 ժողովրդի
  lexicon: BDAG
  rationale: λαός의 기본 뜻인 ‘백성’을 살리고, ἑαυτοῦ의 소유 관계를 ‘자기’로 간결하게 반영했습니다.
- source_word: παιδεύσει
  english_pob_choice: instructs
  chosen_korean: 가르치며
  alternatives_korean:
  - 가르칩니다
  - 훈련합니다
  - 훈계합니다
  lexicon: BDAG
  rationale: 지혜 격언의 문맥에서 παιδεύω는 단순한 정보 전달보다 교육·훈육의 폭이 있지만, 한국어에서는 과도하게 कठ한 ‘훈계하다’보다 중립적이고 자연스러운 ‘가르치다’가 적절합니다.
- source_word: οἱ καρποὶ τῆς συνέσεως αὐτοῦ
  english_pob_choice: the fruits of his understanding
  chosen_korean: 그의 깨달음의 열매
  alternatives_korean:
  - 그의 이해의 열매
  - 그의 총명의 열매
  lexicon: BDAG
  rationale: καρποί의 복수 이미지를 ‘열매’로 살리고, σύνεσις는 단순 지식보다 사태를 꿰뚫는 ‘깨달음’에 가깝다고 보아 이렇게 옮겼습니다.
- source_word: πιστοί
  english_pob_choice: trustworthy
  chosen_korean: 신뢰할 만합니다
  alternatives_korean:
  - 믿을 만합니다
  - 확실합니다
  - 충실합니다
  lexicon: BDAG
  rationale: 문장의 결말이 결과물의 성격을 말하므로 관계적 의미의 ‘충실한’보다, 현대 한국어에서 평이하고 의미가 분명한 ‘신뢰할 만합니다’가 적절합니다.
theological_decisions:
- issue: 사본 전승이 크게 갈리는 본문의 기준 텍스트 선택
  chosen_reading: 주본문은 의미가 분명한 그리스어 전승을 따라 ‘지혜로운 사람은 자기 백성을 가르치며, 그의 깨달음의 열매는 신뢰할 만합니다’로 옮겼습니다.
  alternative_readings:
  - 히브리어의 불명확한 구절을 따라 ‘마음의 계획들의 뿌리/근원—네 갈래 가지가 번성한다’류로 옮기는 읽기
  rationale: 히브리어는 이 절에서 매우 난해하고 훼손 가능성이 커서, POB의 검토 기록과 본문 판정에 따라 명료한 그리스어 증언을 주본문으로 삼는 것이 더 신뢰할 수 있습니다.
  doctrine_reference: 텍스트비평 원칙; 시락 37:23 병행전승
