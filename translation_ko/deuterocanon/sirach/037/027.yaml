translation:
  language: ko
  text: 스스로를 위하여 지혜로운 사람이 있으니[a], 그의 지식의 열매는 그의 몸에 있습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘그의 영혼을 위해’이지만, 여기서는 ‘자기 자신을 위해’라는 반사적 의미로 이해하는 것이 자연스럽습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘몸’은 어떤 문맥에서는 ‘시체’를 뜻할 수 있지만, 여기서는 살아 있는 사람을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֵשׁ
  english_pob_choice: And there is
  chosen_korean: ~가 있으니
  alternatives_korean:
  - 그리고 ~가 있습니다
  - 또 ~가 있습니다
  lexicon: HALOT
  rationale: 히브리어 존재문을 자연스럽게 옮기면서, 앞 문맥에 이어지는 격언적 진술임을 살리기 위해 ‘~가 있으니’를 택했습니다.
- source_word: לְנַפְשׁוֹ
  english_pob_choice: for himself
  chosen_korean: 자기 자신을 위해
  alternatives_korean:
  - 자기 영혼을 위해
  - 자기 생명을 위해
  lexicon: HALOT
  rationale: 이 표현은 영혼의 기술적 의미보다 자기 지향적 이익을 가리키므로, 문맥에 맞게 반사적 의미를 드러내는 한국어로 옮겼습니다.
- source_word: דַעְתּוֹ
  english_pob_choice: his understanding
  chosen_korean: 깨달음
  alternatives_korean:
  - 지식
  - 이해
  lexicon: HALOT
  rationale: 지혜문학에서 דַעַת은 단순 정보보다 실천적 분별을 가리키므로, ‘지식’보다 의미를 잘 드러내는 ‘깨달음’을 택했습니다.
- source_word: גְוִיָּתוֹ
  english_pob_choice: his own body
  chosen_korean: 그의 몸
  alternatives_korean:
  - 그의 시체
  - 그의 몸통
  lexicon: HALOT
  rationale: 이 구절은 살아 있는 사람에게 돌아오는 유익을 말하므로, 죽은 몸을 뜻할 수 있는 ‘시체’는 배제하고 살아 있는 인격 전체를 가리키는 ‘몸’으로 옮겼습니다.
theological_decisions:
- issue: נֶפֶשׁ의 의미를 ‘영혼’으로 고정할지 여부
  chosen_reading: 자기 자신을 위한 자기 지향적 이익으로 이해하고, ‘자기 자신을 위해’로 번역했습니다.
  alternative_readings:
  - 자기 영혼을 위해
  - 자기 생명을 위해
  rationale: 이 격언은 지혜의 유익이 누구에게 돌아가는지 대비하므로, 영혼에 대한 교리적 함의보다 반사적 의미를 드러내는 것이 본문 의도를 더 정확히 전달합니다.
  doctrine_reference: Translation philosophy §1, §6
- issue: גְוִיָּה를 ‘시체’로 볼지 ‘몸’으로 볼지
  chosen_reading: 살아 있는 사람의 몸으로 이해했습니다.
  alternative_readings:
  - 시체
  rationale: 문맥상 지혜의 열매가 현재의 삶과 몸에 미치는 유익을 말하므로, ‘시체’로 번역하면 격언의 논지가 무너집니다.
  doctrine_reference: Translation philosophy §1
