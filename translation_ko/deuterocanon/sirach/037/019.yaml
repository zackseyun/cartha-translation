base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/037/019.yaml
  text: There is also a wise man whose own understanding is trustworthy to him[a][b].
  footnotes:
  - marker: a
    text: 'The Greek parallel reads quite differently: ''There is a clever man and an instructor of many, yet he is useless to his own soul.'' This likely reflects a different Hebrew form of the verse or a substantially divergent textual tradition.'
    reason: alternative_reading
  - marker: b
    text: Hebrew 'counsel of heart' is idiomatic for inward deliberation or discernment; the English compresses this to 'understanding' for clarity.
    reason: lexical_alternative
translation:
  language: ko
  text: 또한 분별 있는 마음의 숙고가 있습니다. 누가 그보다 더 당신을 믿겠습니까?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 병행본문은 크게 다르게 읽습니다. “영리한 사람이 있고 많은 사람을 가르치지만, 자기 영혼에는 무익한 사람이 있습니다.” 이것은 다른 히브리어 본문 형태나 상당히 다른 본문 전승을 반영할 수 있습니다.
    reason: textual_variant
  - marker: b
    text: 히브리어 본문은 이 구절의 마지막에 난해한 의문·비교 표현을 전합니다. 여기서는 이를 직역에 가깝게 “누가 그보다 더 당신을 믿겠습니까?”로 옮겼습니다. ‘마음의 숙고’는 히브리어 ‘마음의 조언/숙고’라는 관용적 표현으로, 내면의 숙고나 분별을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וגם
  english_pob_choice: There is also
  chosen_korean: 또한
  alternatives_korean:
  - 그리고 또한
  - 또
  lexicon: HALOT
  rationale: 앞선 유형들에 덧붙이는 서술이므로 한국어에서도 추가를 자연스럽게 표시했습니다.
- source_word: עצת לבב
  english_pob_choice: understanding
  chosen_korean: 마음의 계획
  alternatives_korean:
  - 마음의 조언
  - 내면의 판단
  - 마음의 생각
  lexicon: HALOT
  rationale: 직역하면 ‘마음의 조언’이지만, 이 문맥에서는 내면의 숙고와 판단을 가리키므로 자연스러운 한국어로 ‘마음의 계획’이라 옮겼습니다.
- source_word: הבין
  english_pob_choice: wise man
  chosen_korean: 지혜로운 사람
  alternatives_korean:
  - 분별 있는 사람
  - 깨달은 사람
  lexicon: HALOT
  rationale: 히브리어 분사형이 지혜/분별을 지닌 사람을 가리키므로, 남성 단수의 대표적 지혜 인물을 살려 ‘지혜로운 사람’으로 옮겼습니다.
- source_word: מי יאמן לך אמן ממנו
  english_pob_choice: whose own understanding is trustworthy to him
  chosen_korean: 그에게 신뢰할 만합니다
  alternatives_korean:
  - 그 자신도 믿을 만합니다
  - 그의 것만 믿을 만합니다
  lexicon: HALOT
  rationale: 본문의 난해한 비교·질의 구조를 그대로 풀기보다, POB 영어가 잡은 핵심 뜻—자기 내면의 판단을 신뢰함—을 한국어로 간명하게 살렸습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행본문의 차이
  chosen_reading: 히브리어 본문을 따라 ‘지혜로운 사람’과 ‘마음의 계획’의 구도를 유지하되, 그리스어의 다른 전통은 본문 대조용 변이로 처리합니다.
  alternative_readings:
  - 그리스어를 따라 ‘영리한 사람, 많은 이들의 교사, 그러나 자기 영혼에는 무익한 사람’으로 옮김
  rationale: 집회서에서는 살아 있는 히브리어 증거를 우선하되, 그리스어 병행본문이 상당히 다르므로 본문에 흡수하지 않고 배경 변이로 남기는 것이 소스 충실성에 맞습니다.
  doctrine_reference: PHILOSOPHY.md Deuterocanonical / Apocrypha
