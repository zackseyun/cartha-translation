  lexicon: HALOT
  rationale: 히브리어 분사형이 지혜/분별을 지닌 사람을 가리키므로, 남성 단수의 대표적 지혜 인물을 살려 ‘지혜로운 사람’으로 옮겼습니다.
- source_word: מי יאמן לך אמן ממנו
  english_pob_choice: whose own understanding is trustworthy to him
  chosen_korean: 그에게 신뢰할 만합니다
  alternatives_korean:
  - 그 자신도 믿을 만합니다
  - 그의 것만 믿을 만합니다
  lexicon: HALOT
  rationale: 본문의 난해한 비교·질의 구조를 그대로 풀기보다, POB 영어가 잡은 핵심 뜻—자기 내면의 판단을 신뢰함—을 한국어로 간명하게 살렸습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행본문의 차이
  chosen_reading: 히브리어 본문을 따라 ‘지혜로운 사람’과 ‘마음의 계획’의 구도를 유지하되, 그리스어의 다른 전통은 본문 대조용 변이로 처리합니다.
  alternative_readings:
  - 그리스어를 따라 ‘영리한 사람, 많은 이들의 교사, 그러나 자기 영혼에는 무익한 사람’으로 옮김
  rationale: 집회서에서는 살아 있는 히브리어 증거를 우선하되, 그리스어 병행본문이 상당히 다르므로 본문에 흡수하지 않고 배경 변이로 남기는 것이 소스 충실성에 맞습니다.
  doctrine_reference: PHILOSOPHY.md Deuterocanonical / Apocrypha
