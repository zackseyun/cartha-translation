  text: And with all these things[a], pray earnestly to God, who will truly direct your steps.
  footnotes:
  - marker: a
    text: 'Greek witness: ''For grace was not given to him from the Lord, because he was deprived of all wisdom.'' The Hebrew and Greek differ substantially here; the main text follows the extant Hebrew witness.'
