translation:
  language: ko
  text: 이 모든 것과 함께 하나님께 간절히 기도하십시오. 그분은 참으로 당신의 발걸음을 인도하실 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '그리스어 증인: ‘주님에게서 은혜를 받지 못한 것은 모든 지혜가 결핍되었기 때문이다.’ 히브리어와 그리스어는 상당히 다르므로, 본문은 남아 있는 히브리어 증거를 따릅니다.'
    reason: textual_variant
lexical_decisions:
- source_word: ועם כל אלה
  english_pob_choice: And with all these things
  chosen_korean: 이 모든 것과 함께
  alternatives_korean:
  - 그리고 이 모든 것과 함께
  - 이 모든 것 외에도
  lexicon: HALOT
  rationale: 앞의 권면들과의 연결을 살리면서도 한국어로 자연스럽게 이어지도록 ‘이 모든 것과 함께’로 옮겼습니다.
- source_word: עתר
  english_pob_choice: pray earnestly
  chosen_korean: 간절히 기도하십시오
  alternatives_korean:
  - 간청하십시오
  - 간절히 간구하십시오
  - 기도하십시오
  lexicon: HALOT
  rationale: 단순한 기도보다 강한 간청의 뉘앙스를 살리기 위해 ‘간절히’로 강화했습니다.
- source_word: אל אל
  english_pob_choice: to God
  chosen_korean: 하나님께
  alternatives_korean:
  - 하나님께로
  - 하나님께 향하여
  lexicon: HALOT
  rationale: 여기에는 야훼가 아니라 일반적인 신칭이므로 한국어의 표준 번역인 ‘하나님’이 가장 적절합니다.
- source_word: יכין באמת
  english_pob_choice: will truly direct
  chosen_korean: 참으로 … 인도하실 것입니다
  alternatives_korean:
  - 참되게 … 인도하실 것입니다
  - 정확히 … 이끄실 것입니다
  - 참으로 … 확고히 세우실 것입니다
  lexicon: HALOT
  rationale: צעדיך와 결합된 동사의 의미를 삶의 진행을 ‘인도하다’로 자연스럽게 풀되, באמת의 사실성·신뢰성을 ‘참으로’로 살렸습니다.
- source_word: צעדיך
  english_pob_choice: your steps
  chosen_korean: 당신의 발걸음
  alternatives_korean:
  - 당신의 걸음
  - 당신의 걸음걸이
  - 당신의 길
  lexicon: HALOT
  rationale: 히브리어의 발걸음 은유를 직접 보존하면서도 한국어에서 문학적이고 자연스러운 표현으로 옮겼습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행본문의 관계
  chosen_reading: 히브리어의 권면문을 본문으로 두고, 그리스어의 전혀 다른 진술은 주석적 대안으로 처리합니다.
  alternative_readings:
  - '그리스어: ‘주님에게서 은혜를 받지 못한 것은 모든 지혜가 결핍되었기 때문이다.’'
  rationale: 시락서는 여기서 히브리어 전승이 보존되어 있으므로 이를 본문으로 따르는 것이 프로젝트 원칙에 맞습니다. 그리스어는 단순한 표현 차이가 아니라 내용이 크게 달라 본문을 대체하지 않고 변이로 남겨야 합니다.
  doctrine_reference: 'PHILOSOPHY.md: Hebrew primary where extant; preserve substantial Greek divergence as variant.'
