base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/037/010.yaml
  text: 'For he too will think for himself: “Why should this fall to him?”[a][b]'
  footnotes:
  - marker: a
    text: Hebrew is terse and somewhat difficult here. The Greek parallel reads, 'Do not take counsel with one who looks askance at you, and hide your plan from those who are jealous of you,' which supports the sense that the other person is calculating from self-interest or ill will.
    reason: alternative_reading
  - marker: b
    text: 'Or ''For he too will think about himself: “Why should this befall him?”'' The Hebrew wording allows some uncertainty about whether the final pronoun points to the counselor himself or to another person.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 자신에 대해서도 이렇게 생각합니다. “이것이 왜 그에게 닥쳐야 합니까?”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 여기서 매우 압축적이며 다소 난해합니다. 그리스어 평행문은 ‘너를 흘겨보는 사람과는 상의하지 말고, 너를 질투하는 자들에게는 계획을 숨겨라’라고 읽혀, 상대가 자기 이익이나 악의를 따라 계산하고 있음을 뒷받침합니다.
    reason: source_note
  - marker: b
    text: 또는 ‘그는 자신에 대해서도 이렇게 생각합니다. “이것이 왜 그에게 닥쳐야 합니까?”’라고도 옮길 수 있습니다. 전승된 히브리어는 마지막 대명사가 상담자 자신을 가리키는지, 다른 사람을 가리키는지 다소 불확실합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: גם הוא
  english_pob_choice: he too
  chosen_korean: 그는
  alternatives_korean:
  - 그도
  - 그 역시
  lexicon: HALOT
  rationale: 앞뒤 문맥에서 이미 비교 대상이 분명하므로, 추가 성분을 과하게 늘리지 않고도 ‘그도/그 역시’의 대비를 한국어 어순 속에 자연스럽게 담을 수 있습니다.
- source_word: לנפשך
  english_pob_choice: for himself
  chosen_korean: 자신에 대해서도
  alternatives_korean:
  - 자기 자신에 대해서도
  - 자신을 위해서도
  lexicon: HALOT
  rationale: 히브리어가 직역상 ‘네 영혼/생명’으로도 읽힐 수 있지만, POB의 비평 기록처럼 여기서는 반사적 자기지향을 가리키는 말로 보는 편이 문맥에 더 맞아, 한국어도 그 자기중심적 계산을 드러내도록 옮겼습니다.
- source_word: יפול
  english_pob_choice: fall
  chosen_korean: 닥쳐야 합니까
  alternatives_korean:
  - 떨어져야 합니까
  - 임해야 합니까
  - 내려와야 합니까
  lexicon: HALOT
  rationale: ‘떨어지다’의 문자적 이미지를 유지하면서도, 한국어 관용에서 불리한 일이 ‘닥치다’고 할 수 있어 수동적·비자발적 발생의 뉘앙스를 자연스럽게 살렸습니다.
