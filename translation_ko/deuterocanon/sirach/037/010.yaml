  naturalness: ‘그는 자신에 대해서도 이렇게 생각합니다’는 ‘자신에 관해서도’라는 뜻으로 읽혀 반사적·자기지향적 계산을 충분히 나타내지 못하고, ‘도’의 수식 범위도 어색합니다. ‘그도 자신을 생각하며’가 더 자연스럽고 간결합니다.
