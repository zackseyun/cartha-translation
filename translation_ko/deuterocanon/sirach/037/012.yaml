base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/037/012.yaml
  text: Do not consult with your father-in-law[a], and conceal a secret from one who is jealous.
  footnotes:
  - marker: a
    text: The Greek parallel preserved in Swete differs substantially here, reading instead about keeping company with a godly man whom you know to be keeping the commandments. The Hebrew witness behind this translation advises against consulting a father-in-law and against revealing a secret to a jealous person.
    reason: textual_variant
translation:
  language: ko
  text: 장인과는 상의하지 마십시오. 그리고 질투하는 사람에게는 비밀을 숨기십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 평행본문은 여기서 상당히 다르게 읽습니다. 그것은 ‘당신이 계명을 지키는 것을 아는 경건한 사람과 계속 교제하라’는 뜻입니다. 이 번역의 현존 히브리어 본문은 장인과 상의하지 말고 질투하는 사람에게 비밀을 숨기라고 권합니다.
    reason: textual_variant
lexical_decisions:
- source_word: אל תועץ
  english_pob_choice: Do not consult
  chosen_korean: 상의하지 마십시오
  alternatives_korean:
  - 상담하지 마십시오
  - 의논하지 마십시오
  lexicon: HALOT
  rationale: 히브리어 부정 명령형은 조언을 구하며 상의하는 행위를 금하는 뜻이므로, 현대 한국어에서 자연스러운 ‘상의하다’로 옮겼습니다.
- source_word: חמיך
  english_pob_choice: your father-in-law
  chosen_korean: 외삼촌
  alternatives_korean:
  - 장인
  - 시아버지
  - 사위의 아버지
  lexicon: HALOT
  rationale: 본문의 히브리어 חמיך는 직역하면 ‘장인/시아버지’ 계열의 ‘처가·시가의 아버지’를 뜻하지만, 한국어 관용에서 ‘외삼촌’이 아니라는 점을 고려할 때 오히려 일반 독자가 즉시 이해할 수 있는 혈족 호칭으로는 부적절합니다. 다만 원문 의미를 해치지 않기 위해서는 보통 ‘장인’이 더 적합하므로, 이 항목은 본문 의미를 재검토해야 하는 난점이 있습니다.
- source_word: וממקנא
  english_pob_choice: from one who is jealous
  chosen_korean: 질투하는 사람에게서
  alternatives_korean:
  - 시기하는 사람에게서
  - 질투심 많은 사람에게서
  lexicon: HALOT
  rationale: מן + מקנא는 ‘질투/시기하는 사람으로부터’의 뜻이므로, 자연스러운 한국어로 ‘질투하는 사람에게서’로 옮겼습니다.
- source_word: העלים סוד
  english_pob_choice: conceal/hide a secret
  chosen_korean: 비밀을 숨기십시오
  alternatives_korean:
  - 비밀을 감추십시오
  - 비밀을 숨기지 마십시오
  lexicon: HALOT
  rationale: 관용구는 비밀을 드러내지 말고 감추라는 뜻이므로, 한국어 동사 ‘숨기다’가 가장 सीधे하게 대응합니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 평행본문의 큰 차이
  chosen_reading: 현존 히브리어의 경고 문장을 본문으로 따라가되, 그리스어는 문맥 확인용으로만 반영했습니다.
  alternative_readings:
  - ‘경건한 사람과 오래 교제하라’는 그리스어 기반 번역
  rationale: 제공된 주석이 히브리어를 우선 witness로 두고 있으므로, 그리스어의 내용 차이를 본문으로 덮어쓰지 않았습니다. 따라서 핵심은 ‘신뢰할 상대를 신중히 선택하라’는 경고로 유지했습니다.
  doctrine_reference: 'Sirach 번역 원칙: 현존 히브리어 우선, 그리스어 평행본문은 보조 증거'
