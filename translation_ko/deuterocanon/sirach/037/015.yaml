  text: And more than all this, pray to the Most High that he may direct your way in truth.
  footnotes:
  - marker: a
    text: The surviving Cairo Geniza Hebrew for this verse is badly mismatched here and reads roughly, 'With an evil man over the repayment of kindness, and a cruel one over the good of flesh.' Because that wording is contextually incoherent, the main text follows the Greek parallel, which gives the sense of praying to the Most High for guidance.
    reason: textual_variant
translation:
  language: ko
  text: 그리고 이 모든 것보다 더하여, 지극히 높으신 분께 기도하십시오. 그러면 그분께서 진리 안에서 당신의 길을 바로잡아 주실 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 절의 남아 있는 카이로 게니자 히브리어는 본문과 심하게 어긋나 있어, 문맥상 통하지 않는 문구를 전합니다. 그래서 본문은 그리스어 병행문의 뜻을 따랐습니다.
    reason: textual_variant
lexical_decisions:
- source_word: πρὸ πάντων τούτων / And more than all this
  english_pob_choice: And more than all this
  chosen_korean: 그리고 이 모든 것보다 더하여
  alternatives_korean:
  - 그리고 이 모든 것보다
  - 무엇보다도
  lexicon: BDAG
  rationale: 추가 전환을 살리면서도 문맥상 앞의 권면들에 더해지는 한층 높은 요청임을 자연스럽게 드러내는 표현으로 옮겼습니다.
- source_word: ὕψιστος / the Most High
  english_pob_choice: the Most High
  chosen_korean: 지극히 높으신 분
  alternatives_korean:
  - 지존자
  - 가장 높으신 분
  lexicon: BDAG
  rationale: 지혜문학의 경건한 호칭을 한국어로 자연스럽게 살리되, 하나님의 칭호임을 분명히 하기 위해 높임을 유지했습니다.
- source_word: κατευθύνω / direct
  english_pob_choice: direct
  chosen_korean: 바로잡아 주실
  alternatives_korean:
  - 인도해 주실
  - 곧게 하실
  lexicon: BDAG
  rationale: 단순한 안내보다 삶의 길을 올바른 방향으로 정렬해 주는 뜻을 살리기 위해 ‘바로잡다’를 선택했습니다.
- source_word: ὁδός / way
  english_pob_choice: way
  chosen_korean: 길
  alternatives_korean:
  - 행로
  - 삶의 길
  lexicon: BDAG
  rationale: 지혜문학에서의 삶의 방향성을 한국어의 기본어 ‘길’로 옮겨, 실제적·도덕적 함의를 함께 담았습니다.
- source_word: ἀλήθεια / truth
  english_pob_choice: truth
  chosen_korean: 진리 안에서
  alternatives_korean:
  - 진실 안에서
  - 참됨 안에서
  lexicon: BDAG
  rationale: 단순한 사실성보다 하나님의 뜻에 합치되는 올바름을 염두에 둔 표현으로, 전치사구의 의미를 자연스럽게 반영했습니다.
theological_decisions:
- issue: 히브리어 전승과 그리스어 병행 전승의 충돌
  chosen_reading: 본문은 Kahana 히브리어의 불일치하는 문구를 따르지 않고, 문맥에 맞는 그리스어 병행문의 뜻을 따라 ‘지극히 높으신 분께 기도하십시오’로 옮겼습니다.
  alternative_readings:
  - ‘악한 사람과 함께…’로 시작하는 히브리어 직역
  rationale: 주어진 전승이 major_mismatch로 표시되어 있고, 공인된 POB 영어본도 그리스어 의미를 본문으로 채택하고 있으므로, 한국어 본문 역시 그 결정을 따라야 합니다.
  doctrine_reference: 'PHILOSOPHY.md: Sirach는 히브리어를 우선하되, 본절처럼 히브리어 전승이 심하게 어긋난 경우 그리스어 병행을 본문 의미로 채택'
