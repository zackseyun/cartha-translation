  yaml_path: translation/deuterocanon/sirach/037/015.yaml
  text: And more than all this, pray to the Most High that he may direct your way in truth.
  footnotes:
  - marker: a
    text: The surviving Cairo Geniza Hebrew for this verse is badly mismatched here and reads roughly, 'With an evil man over the repayment of kindness, and a cruel one over the good of flesh.' Because that wording is contextually incoherent, the main text follows the Greek parallel, which gives the sense of praying to the Most High for guidance.
    reason: textual_variant
translation:
  language: ko
  text: 그리고 이 모든 것보다 더하여, 지극히 높으신 분께 기도하십시오. 그러면 그분께서 진리 안에서 당신의 길을 바로잡아 주실 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 절의 남아 있는 카이로 게니자 히브리어는 본문과 심하게 어긋나 있어, 문맥상 통하지 않는 문구를 전합니다. 그래서 본문은 그리스어 병행문의 뜻을 따랐습니다.
    reason: textual_variant
