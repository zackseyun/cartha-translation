base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/037/013.yaml
  text: Consult with a woman about her rival, and with a coward about his warfare;[a]
  footnotes:
  - marker: a
    text: 'The Hebrew witness here is difficult and differs sharply from the Greek, which reads approximately: ''one who is in his soul according to your soul, and if you stumble, he will suffer with you''—that is, a kindred friend who shares your pain. The Hebrew term rendered ''coward'' is uncertain; alternatives such as ''rebel'' or ''deserter'' have been proposed.'
    reason: textual_variant
translation:
  language: ko
  text: 여자를 그 여자의 경쟁자에 관해 상담하고, 비겁한 사람에게는 그의 전쟁에 관해 상담하십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 전승은 이곳에서 어렵고, 그리스어는 대략 ‘그의 영혼이 네 영혼과 같고, 네가 넘어지면 그도 너와 함께 아파할 것이다’라고 읽힙니다. 즉, 고통을 함께 나누는 친밀한 친구를 가리키는 뜻입니다. 히브리어의 מָרֵד는 뜻이 분명하지 않아 ‘반역자’나 ‘도망자’로도 제안됩니다.
    reason: textual_variant
lexical_decisions:
- source_word: עִם אִשָּׁה
  english_pob_choice: with a woman / consult with a woman
  chosen_korean: 여자를
  alternatives_korean:
  - 여자와
  - 한 여자와
  lexicon: HALOT
  rationale: 히브리어는 상담의 대상이 되는 사람을 전치사 עִם으로 바로 제시하므로, 한국어에서는 목적어처럼 자연스럽게 풀어 ‘여자를’로 옮겼습니다.
- source_word: צָרָהּ
  english_pob_choice: her rival
  chosen_korean: 그 여자의 경쟁자에 관해
  alternatives_korean:
  - 그 여자의 라이벌에 관해
  - 그 여자의 대적에 관해
  - 그 여자의 질투 대상에 관해
  lexicon: HALOT
  rationale: 이 어휘는 문맥상 여성 경쟁자/라이벌을 가리키며, POB의 ‘rival’을 따라 ‘경쟁자’로 옮기면 관계를 과도하게 좁히지 않으면서도 뜻을 분명히 드러낼 수 있습니다.
- source_word: מָרֵד
  english_pob_choice: a coward
  chosen_korean: 비겁한 사람
  alternatives_korean:
  - 겁쟁이
  - 반역자
  - 도망자
  lexicon: HALOT
  rationale: 히브리어 본문은 난해하고 전통이 흔들리지만, POB는 이 단어를 전쟁에 부적합한 사람으로 이해했습니다. 한국어 ‘비겁한 사람’은 그 의미를 읽기 쉬운 현대어로 전달합니다.
- source_word: מִלְחַמְתּוֹ
  english_pob_choice: his warfare
  chosen_korean: 그의 전쟁에 관해
  alternatives_korean:
  - 그의 전투에 관해
  - 전쟁에 관해
  - 그의 싸움에 관해
  lexicon: HALOT
  rationale: מִלְחָמָה는 전쟁/전투를 뜻하므로, POB의 ‘his warfare’를 살려 소유격을 유지한 채 ‘그의 전쟁’으로 옮겼습니다. '관해'를 덧붙여 전치사 עִם의 상담 의미를 한국어에서 자연스럽게 풀었습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 평행문의 큰 차이
  chosen_reading: 주 본문은 현존하는 히브리어를 따르되, 그리스어가 매우 다른 뜻을 전한다는 점은 각주로 보존했습니다.
  alternative_readings:
  - '그리스어: ‘그의 영혼이 네 영혼과 같고, 네가 넘어지면 그도 너와 함께 아파할 것이다’'
  rationale: 이 절은 단순한 세부 차이가 아니라 문장 전체가 다르게 보일 만큼 차이가 큽니다. 따라서 히브리어를 본문으로 두되, 독자가 두 전통의 긴장을 확인할 수 있도록 그리스어 의미를 각주로 남깁니다.
  doctrine_reference: 'Sirach source-critical policy: surviving Hebrew primary, major Greek divergence preserved honestly'
