  naturalness: ‘여자와 그 여자의 경쟁자에 관하여 상담하고, 비겁한 사람과 그의 전쟁에 관하여 상담하십시오’가 현대 표준어 합쇼체로 자연스럽고, 두 병렬 항목도 분명합니다. 초안의 두 번째 ‘사람에게는’은 첫 항목과 통사적으로 불균형합니다.
