lexical_decisions:
- source_word: טוב
  english_pob_choice: good
  chosen_korean: 선
  alternatives_korean:
  - 좋음
  - 좋은 것
  - 복
  lexicon: HALOT
  rationale: טוב은 지혜문학의 대조쌍에서 도덕적·실존적 포괄 의미를 가지므로, 단순한 ‘좋음’보다 ‘선’이 보다 넓고 문맥에 맞습니다.
- source_word: רעה
  english_pob_choice: evil
  chosen_korean: 악
  alternatives_korean:
  - 해악
  - 불행
  - 재앙
  lexicon: HALOT
  rationale: טוב와의 강한 대칭을 살리기 위해 ‘악’을 택했습니다. 이는 영어 POB의 ‘evil’과 같은 범주를 유지합니다.
- source_word: ומושלת בם כליל
  english_pob_choice: over them all the tongue rules
  chosen_korean: 이 모든 것 위에서 … 다스립니다
  alternatives_korean:
  - 이 모든 것 위에 군림합니다
  - 이 모든 것 전체를 지배합니다
  - 전적으로 이들을 다스립니다
  lexicon: HALOT
  rationale: משל의 통치·지배 의미를 살리되, 한국어에서 자연스럽고 압축적인 ‘다스립니다’로 옮겼습니다. כליל은 범위를 ‘이 모든 것’으로 풀어 포괄성을 드러냈습니다.
- source_word: לשון
  english_pob_choice: the tongue
  chosen_korean: 혀
  alternatives_korean:
  - 말
  - 말하는 혀
  - 언어
  lexicon: HALOT
  rationale: 지혜문학의 관용적 비유를 살려 구체 명사 ‘혀’를 유지했습니다. 이는 말의 힘을 가리키는 원문 이미지와 맞습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행문의 관계
  chosen_reading: 본문은 현존 히브리어를 따라 ‘선과 악, 생명과 죽음—이 모든 것 위에서 혀가 다스립니다’로 옮기고, 그리스어의 다른 독법은 각주로 보존했습니다.
  alternative_readings:
  - 그리스어 병행문의 ‘지혜로운 사람은 복으로 가득 차며…’를 본문으로 채택
  - 그리스어와 히브리어를 절충한 혼합 번역
  rationale: 이 절의 그리스어는 히브리어와 상당히 다른 별개 전승이므로, 본문은 히브리어를 우선하고 그리스어 차이는 투명하게 각주 처리하는 것이 공인된 편집 원칙에 맞습니다.
  doctrine_reference: 'PHILOSOPHY.md: Sirach는 현존 히브리어를 우선하고, 그리스어 병행문은 대조 증거로 보존'
