  source_fidelity: 히브리어 חכם לנפשו ישבע תענוג, ויאשרוהו כל רואינו를 충실히 반영합니다. לנפשו는 ‘자신을 위해’로, ישבע תענוג는 ‘즐거움으로 만족하게 되다’로 옮기며, ויאשרוהו는 제의적 축복이 아닌 ‘행복한 사람이라고 하다’라는 공적 평가로 번역합니다. 다만 초안은 영어 POB 감사 기록에 있는 희랍어 이문 각주를 누락했습니다.
  naturalness: ‘기쁨으로 충만해지고’도 이해되지만, ישבע의 ‘만족하다/배부르다’ 의미에는 ‘즐거움으로 만족하게 되고’가 더 가깝습니다. ‘지혜로운 이’와 ‘모든 이’는 현대 표준어의 격식 있는 잠언체에 자연스럽습니다.
  terminology: ‘지혜로운 이’, ‘즐거움’, ‘행복한 사람’은 문맥과 현대 합쇼체에 적절합니다. 희랍어 χολέρα는 현대 질병명 ‘콜레라’로 단정하기보다 ‘담즙성 질병’으로 옮기고 원어를 병기하여 어휘적 불확실성을 보존합니다.
