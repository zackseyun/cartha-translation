base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/037/030.yaml
  text: A wise man for himself will be filled with delight[b][a], and all who see him will call him happy.
  footnotes:
  - marker: a
    text: Hebrew reads 'all who see him'; the transmitted form appears orthographically irregular in the final word, but the sense is clear from the context.
    reason: textual_variant
  - marker: b
    text: 'Greek has a substantially different line here: ''For in many foods there will be pain, and greed will come near to cholera/bilious sickness.'' The Hebrew witness preserved in the Cairo Geniza is followed for the main text as the primary source where extant.'
    reason: alternative_reading
translation:
  language: ko
  text: 지혜로운 사람은 자기 자신을 위해 기쁨으로 충만해지고, 그를 보는 모든 사람은 그를 행복하다고 말합니다.ᵃ[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘그를 보는 모든 사람’을 뜻합니다. 전해진 형태는 마지막 단어의 철자가 다소 비정형적이지만, 문맥상 뜻은 분명합니다.
    reason: textual_variant
lexical_decisions:
- source_word: חכם
  english_pob_choice: wise man
  chosen_korean: 지혜로운 사람
  alternatives_korean:
  - 지혜로운 남자
  - 지혜자
  lexicon: HALOT
  rationale: 히브리어 형용사/명사 חכם의 일반적 뜻을 살리되, 한국어에서는 성별을 과도하게 드러내지 않는 자연스러운 표준어로 옮겼습니다.
- source_word: לנפשו
  english_pob_choice: for himself
  chosen_korean: 자기 자신을 위해
  alternatives_korean:
  - 자기 영혼을 위해
  - 자기 자신을 위하여
  lexicon: HALOT
  rationale: נפש가 여기서는 단순히 ‘영혼’보다 ‘자기 자신/자아’의 의미로 읽히므로, 문맥에 맞게 반사적 의미를 분명히 했습니다.
- source_word: ישבע תענוג
  english_pob_choice: will be filled with delight
  chosen_korean: 기쁨으로 충만해지고
  alternatives_korean:
  - 기쁨으로 채워지고
  - 기쁨으로 만족하게 되고
  lexicon: HALOT
  rationale: שבע의 ‘충만/만족’ 의미를 살리면서 תענוג의 ‘즐거움/기쁨’을 자연스럽게 결합해, 식욕 이미지보다 만족의 의미가 드러나게 했습니다.
- source_word: ויאשרוהו
  english_pob_choice: will call him happy
  chosen_korean: 그를 행복하다고 말합니다
  alternatives_korean:
  - 그를 복되다고 말합니다
  - 그를 행복한 사람이라고 합니다
  lexicon: HALOT
  rationale: אשר의 ‘행복하다/행복하다고 선언하다’ 의미를 따라, 공적인 평가를 드러내는 표현으로 옮겼습니다.
- source_word: כל רואינו
  english_pob_choice: all who see him
  chosen_korean: 그를 보는 모든 사람은
  alternatives_korean:
  - 그를 보는 이들은 모두
  - 그를 보는 모든 이들은
  lexicon: HALOT
  rationale: 전승된 형태의 어말이 다소 비정형이지만 의미는 ‘그를 보는 모든 사람’으로 분명하므로, 문맥이 자연스럽게 이어지도록 번역했습니다.
theological_decisions:
- issue: Greek parallel differs substantially from the Hebrew line
  chosen_reading: 본문은 카이로 겐자에 전해진 히브리어를 따르고, 희랍어 평행본문은 주석적 대조로만 반영합니다.
  alternative_readings:
  - 희랍어처럼 탐식과 고통에 대한 경구로 옮김
  - 두 전승을 절충한 이중 의미 번역
  rationale: 이 절은 히브리어와 희랍어가 내용상 크게 다르므로, 가시적으로 보존된 히브리어 본문을 본문으로 두고 다른 전승은 각주로 처리하는 것이 자료의 충실성을 높입니다.
  doctrine_reference: 본문비평 원칙 / 전승 비교
- issue: אשר의 의미
  chosen_reading: ‘복을 빌다’가 아니라 ‘행복하다고 말하다/선언하다’로 옮깁니다.
  alternative_readings:
  - 그를 복되다고 축복합니다
  - 그를 인정합니다
  rationale: 문맥은 제의적 축복보다 주변 사람들이 그 사람을 보고 평가하는 상황이므로, ‘행복하다’의 선언적 의미를 살리는 것이 적절합니다.
  doctrine_reference: 어휘 의미론 / 잠언체 문맥
