translation:
  language: ko
  text: 헛된 일꾼은 자기 일에, 헛된 파수꾼은 악을 내보내는 자에게 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '그리스어는 이렇게 읽습니다: “그리고 이 모든 것 위에 지극히 높으신 이께 기도하여, 그가 진리로 당신의 길을 바르게 하시게 하십시오.” 히브리어와 그리스어는 이 구절에서 크게 다릅니다.'
    reason: textual_variant
lexical_decisions:
- source_word: פועל
  english_pob_choice: worker / laborer
  chosen_korean: 일꾼
  alternatives_korean:
  - 노동자
  - 노무자
  lexicon: HALOT
  rationale: 행위를 하는 사람이라는 기본 뜻을 살리면서도 잠언체에서 자연스럽고 간결한 한국어 표현이어서 선택했습니다.
- source_word: שוא
  english_pob_choice: vain
  chosen_korean: 헛된
  alternatives_korean:
  - 허무한
  - 무익한
  - 공허한
  lexicon: HALOT
  rationale: ‘헛된’은 שוא의 공허함과 무익함을 짧고 대구적으로 드러내며, 두 절에 같은 수식어를 붙이기에도 적합합니다.
- source_word: מלאכתו
  english_pob_choice: his task
  chosen_korean: 자기 일
  alternatives_korean:
  - 자기 작업
  - 자기 맡은 일
  lexicon: HALOT
  rationale: 특정한 직무나 맡은 일을 가리키는 뜻을 한국어로 자연스럽게 옮겼습니다. POB의 ‘his task’처럼 소유·부여된 일을 나타냅니다.
- source_word: שומר
  english_pob_choice: guard
  chosen_korean: 파수꾼
  alternatives_korean:
  - 지키는 자
  - 경계하는 자
  - 수문장
  lexicon: HALOT
  rationale: 감시·보호의 의미를 유지하면서 한국어 성경 문맥에서 이해하기 쉬운 보편적 표현입니다.
- source_word: מוציא רע
  english_pob_choice: one who brings forth evil
  chosen_korean: 악을 내보내는 자
  alternatives_korean:
  - 악을 끌어내는 자
  - 악을 만들어 내는 자
  - 악행하는 자
  lexicon: HALOT
  rationale: 히브리어의 직역적 구조를 살려 ‘내보내다’로 옮겼습니다. POB가 해석을 좁혀 ‘evildoer’로 풀지 않은 점을 반영해, 의미를 너무 평면화하지 않았습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행문의 현저한 불일치
  chosen_reading: 본문은 현존 히브리어를 따르되, 그리스어가 전혀 다른 문장을 전하는 만큼 이 절은 잠언형 문장으로만 제시했습니다.
  alternative_readings:
  - ‘이 모든 것 위에 지극히 높으신 이께 기도하여 그가 진리로 당신의 길을 바르게 하시게 하십시오.’
  rationale: 시락서는 히브리어 증거가 살아 있는 경우 그것을 우선하되, 이 절은 히브리어와 그리스어가 내용상 크게 다릅니다. 따라서 본문은 히브리어를 반영하고, 대안 독법은 각주로만 처리하는 편이 주해적으로 정직합니다.
  doctrine_reference: '시락서 본문 비평 원칙: 현존 히브리어 우선, 중대한 그리스어 병행은 각주로 투명하게 제시'
