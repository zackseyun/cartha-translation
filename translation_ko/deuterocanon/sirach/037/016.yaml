  text: A vain laborer for his work[a], a vain guard for one who brings forth evil.
  footnotes:
  - marker: a
    text: 'Greek reads instead: “And over all these things pray to the Most High, that he may direct your way in truth.” The Hebrew and Greek differ substantially here.'
