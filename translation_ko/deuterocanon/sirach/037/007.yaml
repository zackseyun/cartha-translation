translation:
  language: ko
  text: 모든 조언자는 손을 흔들지만, 자신을 위해 조언하는 이도 있습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 끝부분의 히브리어는 이 전승에서 난해하며, 그리스어 평행본문은 ‘자기 자신을 위하여 조언하는 이’라는 뜻을 보여 줍니다.
    reason: textual_variant
  - marker: b
    text: 더 풀어 옮기면, ‘모든 조언자는 조언을 내놓지만, 더러는 자기 이익을 위해 조언합니다’라고 할 수 있습니다.
    reason: lexical_alternative
