  text: Every counselor waves his hand[b][a], but there is a counselor whose advice is for himself.
  footnotes:
  - marker: a
    text: Hebrew is difficult at the end of the verse in the supplied witness; the Greek parallel reads 'but there is one who gives counsel for himself,' which supports the sense adopted here.
    reason: textual_variant
  - marker: b
    text: 'Or, more dynamically: ''Every counselor offers advice, but some counsel for their own benefit.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 모든 조언자는 손을 들어 보이지만, 자신의 유익을 위해 조언하는 이도 있습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 끝부분의 히브리어는 이 전승에서 난해하며, 그리스어 평행본문은 ‘자기 자신을 위하여 조언하는 이’라는 뜻을 보여 줍니다.
    reason: textual_variant
  - marker: b
    text: 더 풀어 옮기면, ‘모든 조언자는 조언을 내놓지만, 어떤 조언은 자기 이익을 위한 것입니다’라고 할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כל יועץ
  english_pob_choice: Every counselor
  chosen_korean: 모든 조언자
  alternatives_korean:
  - 모든 상담가
  - 각 조언자
  lexicon: HALOT
  rationale: 지혜문학의 격언체를 살리기 위해 보편적 주어를 ‘모든’으로, יועץ는 현대적이면서도 조언 행위의 성격을 드러내는 ‘조언자’로 옮겼습니다.
- source_word: יניף יד
  english_pob_choice: waves his hand
  chosen_korean: 손을 들어 보이지만
  alternatives_korean:
  - 손을 흔들지만
  - 손짓하지만
  lexicon: HALOT
  rationale: 히브리어의 손 동작 이미지를 유지하되, 한국어에서 자연스럽게 ‘쉽게/앞장서서 조언을 내놓는’ 뉘앙스가 드러나도록 최소한으로 풀어 옮겼습니다.
- source_word: דרך אל לץ / εἰς αὐτόν
  english_pob_choice: whose advice is for himself
  chosen_korean: 자신의 유익을 위해 조언하는 이도 있습니다
  alternatives_korean:
  - 자기에게로 향하는 조언을 하는 이도 있습니다
  - 자기 자신을 위한 조언을 하는 이도 있습니다
  lexicon: HALOT
  rationale: 본문의 শেষ부분은 현전 히브리어가 난해하고 그리스어 평행본문이 ‘그 자신을 위하여’라는 뜻을 분명히 하므로, 자기중심적/사적 이익을 위한 조언이라는 의미를 살려 옮겼습니다.
- source_word: אך
  english_pob_choice: but
  chosen_korean: 하지만
  alternatives_korean:
  - 그러나
  - 그런데
  lexicon: HALOT
  rationale: 일반 진술과 예외적 경고를 대비시키는 접속사의 기능을 자연스러운 한국어 대조 표지로 반영했습니다.
theological_decisions:
- issue: 난해한 히브리어 결말과 그리스어 평행본문의 관계
  chosen_reading: 그리스어 평행본문을 따라 ‘자신의 유익을 위한 조언’으로 이해했습니다.
  alternative_readings:
  - 현전 히브리어 표면형을 더 직역하여 ‘어리석은 자에게로 향한 조언’처럼 처리하는 읽기
  - 결말을 보류하고 모호성을 그대로 남기는 읽기
  rationale: 검증 메모가 ‘minor mismatch’로 표시하고 있으며, 영어 POB도 그리스어를 근거로 의미를 확정했기 때문에, 본문 의미를 과하게 넓히지 않는 범위에서 그 결정을 한국어로 재현했습니다.
  doctrine_reference: 본문비평/해석학
