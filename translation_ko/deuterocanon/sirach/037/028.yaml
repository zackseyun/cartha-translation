base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/037/028.yaml
  text: For not everything is beneficial for everyone, and not every person delights in every kind of thing.[a]
  footnotes:
  - marker: a
    text: 'The extant Cairo Geniza Hebrew for this verse is difficult and does not closely match the Greek: literally, ''And there is a wise man who will be wise for his people; the fruit of his knowledge is in their bodies.'' Because of this mismatch, the translation follows the Greek witness here while noting the Hebrew reading.'
    reason: textual_variant
translation:
  language: ko
  text: 왜냐하면 모든 것이 모든 사람에게 유익한 것은 아니며, 모든 사람이 모든 것을 기뻐하는 것도 아닙니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 현존하는 카이로 게니자 히브리어는 이 절에서 난해하며 그리스어와도 직접적으로 일치하지 않습니다. 히브리어를 문자적으로 옮기면 ‘또 자기 백성을 지혜롭게 하는 지혜로운 사람이 있고, 그의 지식의 열매는 그들의 몸에 있다’에 가깝습니다. 따라서 본문은 그리스어 증언을 따라 옮기고, 히브리어의 상이한 읽기는 이 각주에 남깁니다.
    reason: textual_variant
lexical_decisions:
- source_word: οὐ γὰρ πάντα πᾶσιν συμφέρει
  english_pob_choice: not everything is beneficial for everyone
  chosen_korean: 모든 것이 모든 사람에게 유익한 것은 아닙니다
  alternatives_korean:
  - 모든 것이 모든 사람에게 이로운 것은 아닙니다
  - 모든 것이 모든 사람에게 유익하지는 않습니다
  lexicon: BDAG
  rationale: συμφέρει는 ‘유익하다, 이롭다, 도움이 되다’의 뜻이므로, 한국어에서는 가장 자연스럽고 현대적인 ‘유익하다’로 옮겼습니다.
- source_word: πᾶσιν
  english_pob_choice: for everyone
  chosen_korean: 모든 사람에게
  alternatives_korean:
  - 모든 이에게
  - 모두에게
  lexicon: BDAG
  rationale: 여격의 수혜 대상을 한국어에서는 ‘~에게’로 자연스럽게 표시했습니다.
- source_word: οὐ πᾶσα ψυχὴ
  english_pob_choice: not every person
  chosen_korean: 모든 사람이
  alternatives_korean:
  - 모든 영혼이
  - 모든 이가
  lexicon: BDAG
  rationale: ψυχή는 여기서 인간 개체를 가리키는 관용적 표현이므로, 오해를 피하려고 ‘영혼’ 대신 ‘사람’으로 풀었습니다.
- source_word: ἐν παντὶ εὐδοκεῖ
  english_pob_choice: delights in every kind of thing
  chosen_korean: 모든 것을 기뻐하는 것도 아닙니다
  alternatives_korean:
  - 모든 것을 좋아하는 것도 아닙니다
  - 모든 일에 만족하는 것도 아닙니다
  lexicon: BDAG
  rationale: εὐδοκεῖ는 ‘기뻐하다, 좋아하다, 만족하다’의 뜻이므로, 문맥상 포괄적인 태도 진술을 살려 ‘기뻐하다’로 옮겼습니다.
theological_decisions:
- issue: 사람 일반에 대한 지혜 격언의 보편성
  chosen_reading: 이 절은 특정 집단이 아니라 사람들의 다양성과 한계를 일반 진술로 말합니다.
  alternative_readings:
  - 도덕적 금지 규정으로 읽기
  - 특정 음식/행위에 대한 제한으로 좁혀 읽기
  rationale: 히브리 본문은 난해하지만, 그리스어 증언은 보편적 지혜 격언의 형식이 분명하므로 이를 따라 일반 원리로 번역했습니다.
  doctrine_reference: 전도서식 지혜 문학의 일반화 진술
