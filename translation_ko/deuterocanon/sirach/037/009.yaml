  text: Guard yourself from a counselor[a], and know beforehand what his need is.
  footnotes:
  - marker: a
    text: 'Or ''what his interest is''—the Hebrew can refer not only to need in a strict sense but also to what concerns or motivates him. The Greek parallel expands the thought differently: ''and he will stand opposite to see what will happen to you.'''
