  text: Guard yourself from a counselor[a], and know beforehand what his need is.
  footnotes:
  - marker: a
    text: 'Or ''what his interest is''—the Hebrew can refer not only to need in a strict sense but also to what concerns or motivates him. The Greek parallel expands the thought differently: ''and he will stand opposite to see what will happen to you.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 조언하는 사람에게서 스스로를 지키고, 그의 필요가 무엇인지 미리 알아두십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebrew의 צרך는 엄밀히는 '필요'를 뜻하지만, 문맥상 그 사람의 관심사나 동기가 무엇인지까지 넓게 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מיועץ
  english_pob_choice: from a counselor
  chosen_korean: 조언하는 사람에게서
  alternatives_korean:
  - 상담하는 사람에게서
  - 조언자에게서
  - 상담자에게서
  lexicon: HALOT
  rationale: מן + יועץ의 경계/경고 뉘앙스를 살리기 위해 출발점을 나타내는 조사 표현으로 옮겼습니다. '조언하는 사람'은 직함보다 기능을 직접 드러내며, 문맥상 경계해야 할 인물을 자연스럽게 나타냅니다.
- source_word: שמור נפשך
  english_pob_choice: Guard yourself
  chosen_korean: 스스로를 지키고
  alternatives_korean:
  - 자신을 지키고
  - 영혼을 지키고
  - 생명을 지키고
  lexicon: HALOT
  rationale: נפשך는 단순한 '생명'보다 인격 전체를 가리킬 수 있으므로, 한국어에서는 과도한 문자주의를 피하면서도 자기 보존의 경계를 드러내는 '스스로를 지키고'로 옮겼습니다.
- source_word: ודע לפנים
  english_pob_choice: and know beforehand
  chosen_korean: 미리 알아두십시오
  alternatives_korean:
  - 미리 아십시오
  - 먼저 알아두십시오
  - 사전에 알아두십시오
  lexicon: HALOT
  rationale: לפנים의 시간 부사적 용법을 현대 한국어에서 가장 자연스럽게 전달하는 표현으로, 경계의 실천성이 살아나는 명령형을 선택했습니다.
- source_word: מה צרכו
  english_pob_choice: what his need is
  chosen_korean: 그의 필요가 무엇인지
  alternatives_korean:
  - 그의 필요가 무엇인지
  - 그의 관심사가 무엇인지
  - 그가 무엇을 필요로 하는지
  lexicon: HALOT
  rationale: צרך의 기본 의미인 '필요/요구'를 우선 반영하되, 한국어에서는 주어를 앞세운 간명한 의문절이 가장 자연스럽습니다. EN POB의 각주가 시사하는 'interest' 가능성은 본문보다 주석에서 처리하는 편이 원문에 충실합니다.
