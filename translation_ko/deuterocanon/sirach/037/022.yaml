    reason: lexical_alternative
translation:
  language: ko
  text: 모든 행동의 시작은 말이며, 모든 일의 시작은 생각입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '그리스어 증거는 여기서 다른 격언을 전합니다: ‘자기 자신에게 지혜로운 사람이 있으며, 그의 분별의 열매는 그의 입술에서 신뢰할 만합니다.’'
    reason: alternative_reading
lexical_decisions:
- source_word: ראש
  english_pob_choice: the beginning of
  chosen_korean: 시작
  alternatives_korean:
  - 머리
  - 첫머리
  - 처음
  lexicon: HALOT
  rationale: 격언적 평행법에서 ראש는 어떤 행위의 선행 단계를 가리키므로, 한국어에서는 자연스럽고 간결한 ‘시작’이 가장 잘 맞습니다.
- source_word: דבר
  english_pob_choice: a word
  chosen_korean: 말
  alternatives_korean:
  - 한마디
  - 말씀
  - 사건
  lexicon: HALOT
  rationale: דבר은 여기서 ‘말/발화’의 뜻이 핵심이므로 ‘말’이 가장 직접적이며, 앞절의 ‘행동’과 대비도 분명하게 살립니다.
- source_word: מעשה
  english_pob_choice: deed
  chosen_korean: 행동
  alternatives_korean:
  - 일
  - 행위
  - 일함
  lexicon: HALOT
  rationale: מעשה는 구체적 행위를 가리키므로 ‘행동’이 자연스럽고, 뒤의 פועל과도 지나치게 겹치지 않게 해 줍니다.
- source_word: מחשבת
  english_pob_choice: thought
  chosen_korean: 생각
  alternatives_korean:
  - 계획
  - 의도
  - 궁리
  lexicon: HALOT
  rationale: מחשבת는 사고, 의도, 계획을 아우를 수 있지만, 여기서는 격언의 간결성과 평행성을 살리는 ‘생각’이 가장 무난합니다.
