  rationale: 집회서는 히브리어 증거가 보존된 경우 그 본문을 우선해야 하며, 이 절의 그리스어는 히브리어의 직역이 아니라 별개의 문장에 가깝기 때문에 본문에 혼합하지 않는 것이 투명합니다.
