base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/037/020.yaml
  text: A man's heart tells of his thoughts[b][a], more than seven watchmen on a lookout.
  footnotes:
  - marker: a
    text: Hebrew שעיותיו is uncertain; it may refer to a person's troubles, anxieties, or inward concerns. The Greek parallel for this verse differs substantially and reads instead about one who is clever in words yet hated and deprived of food.
    reason: textual_variant
  - marker: b
    text: Or 'A person's heart tells of his anxieties, more than seven watchmen at a lookout post.'
    reason: lexical_alternative
translation:
  language: ko
  text: 사람의 마음은 그의 근심을 말해 줍니다[a], 일곱 명의 파수꾼보다 더 분명하게, 망대 위에서.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 שעיותיו는 뜻이 확실하지 않아, 사람의 고통이나 불안, 혹은 내적 염려를 가리키는 말일 수 있습니다. 이 절의 그리스어 평행본문은 내용이 크게 달라, ‘말로 지혜롭게 구는 자는 미움을 받고, 모든 음식이 끊어진다’고 읽습니다.
    reason: textual_variant
lexical_decisions:
- source_word: לב
  english_pob_choice: heart
  chosen_korean: 마음
  alternatives_korean:
  - 심장
  - 중심
  - 속사람
  lexicon: HALOT
  rationale: 히브리어 לב은 인지와 감정을 아우르는 내면을 가리키므로, 한국어에서는 비유를 살리면서도 자연스러운 ‘마음’이 가장 적절합니다.
- source_word: יגיד
  english_pob_choice: tells of
  chosen_korean: 말해 줍니다
  alternatives_korean:
  - 알려 줍니다
  - 드러냅니다
  - 말합니다
  lexicon: HALOT
  rationale: 동사 נגד 히필은 ‘말하다/알리다/선포하다’의 뜻이므로, 잠언체의 흐름을 살려 ‘말해 줍니다’로 옮겼습니다.
- source_word: שעיותיו
  english_pob_choice: his thoughts / his troubles
  chosen_korean: 그의 근심
  alternatives_korean:
  - 그의 생각
  - 그의 걱정
  - 그의 내적 사정
  lexicon: HALOT
  rationale: 본문의 שעיותיו는 난해하지만 내적 근심·걱정·염려를 가리키는 말로 이해하는 것이 가장 자연스럽고, 본 절의 대비 대상인 파수꾼 이미지와도 잘 맞습니다.
- source_word: משבעה צופים על מצפה
  english_pob_choice: more than seven watchmen on a lookout
  chosen_korean: 일곱 명의 파수꾼보다 더 분명하게, 망대 위에서
  alternatives_korean:
  - 일곱 명의 파수꾼보다 더
  - 일곱 파수꾼보다 더
  - 망대의 일곱 파수꾼보다 더
  lexicon: HALOT
  rationale: משבעה는 비교를 나타내므로 ‘~보다 더’로 옮기고, צופים은 경계하는 사람들을 뜻하는 ‘파수꾼’으로, מצפה는 ‘망대/감시 지점’의 넓은 의미를 살려 ‘망대 위에서’로 옮겼습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행본문의 큰 차이
  chosen_reading: 본문은 히브리어를 따라 ‘마음이 그 사람의 근심을 드러낸다’는 잠언으로 번역했습니다.
  alternative_readings:
  - 그리스어 병행본문에 따라 ‘말로 지혜롭게 구는 자는 미움을 받고, 모든 음식이 끊어진다’
  - 본문의 난해어를 더 중립적으로 처리한 번역
  rationale: 이 절은 히브리어와 그리스어가 크게 다르지만, POB의 본문은 히브리어를 기본으로 하므로 히브리어 의미를 우선했습니다. 영어 주석이 지적한 텍스트 차이는 각주로 보존했습니다.
  doctrine_reference: '서문 원칙: source-text primacy; textual criticism'
- issue: ‘그의 근심’의 의미 범위
  chosen_reading: ‘근심’은 단순한 감정이 아니라 내면의 걱정·불안·염려를 포괄하는 표현으로 사용했습니다.
  alternative_readings:
  - 생각
  - 걱정
  - 염려
  rationale: 히브리어의 난해한 어형을 한 단어로 고정하기보다, 본 절이 말하는 내적 부담과 드러남의 이미지를 보존하는 쪽이 문맥상 더 정확합니다.
  doctrine_reference: 지혜문학의 인간 이해
