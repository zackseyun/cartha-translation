translation:
  language: ko
  text: 사람의 마음은 망대 위의 일곱 파수꾼보다도 그의 근심을 더 잘 알려 줍니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 שעיותיו는 뜻이 확실하지 않아, 사람의 고통이나 불안, 혹은 내적 염려를 가리키는 말일 수 있습니다. 이 절의 그리스어 병행본문은 내용이 크게 달라, ‘말로 지혜롭게 구는 자는 미움을 받고, 온갖 양식이 부족하게 된다’고 읽습니다.
    reason: textual_variant
lexical_decisions:
- source_word: לב
  english_pob_choice: heart
  chosen_korean: 마음
  alternatives_korean:
  - 심장
  - 중심
  - 속사람
  lexicon: HALOT
  rationale: 히브리어 לב은 인지와 감정을 아우르는 내면을 가리키므로, 한국어에서는 비유를 살리면서도 자연스러운 ‘마음’이 가장 적절합니다.
- source_word: יגיד
