base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/037/005.yaml
  text: A friend fights with a stranger over a good thing[b][a], and against cities he will take up a shield.
  footnotes:
  - marker: a
    text: 'Greek: ''A companion suffers with a friend for the sake of his stomach, and in the face of war he will take up a shield.'' The Hebrew and Greek differ notably in the first clause and in ''cities''/''war.'' The main text follows the extant Hebrew witness, with the Greek kept as a significant alternative.'
    reason: alternative_reading
  - marker: b
    text: Hebrew 'good' may also mean 'benefit' or 'advantage.'
    reason: lexical_alternative
translation:
  language: ko
  text: 좋은 것 때문에 친구는 낯선 사람과 다투고, 도시들을 상대로는 방패를 들 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '헬라어: “한 동료가 친구를 위해 배 때문에 함께 고난을 겪고, 전쟁 앞에서 방패를 든다.” 히브리어와 헬라어는 첫 절과 ‘도시들/전쟁’에서 눈에 띄게 다릅니다. 본문은 현존 히브리어 증거를 따르고, 헬라어는 중요한 대안으로 남깁니다.'
    reason: textual_variant
  - marker: b
    text: 히브리어의 ‘좋은 것’은 ‘유익’ 또는 ‘이익’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אוהב טוב
  english_pob_choice: a friend ... over a good thing
  chosen_korean: 좋은 것 때문에 친구는
  alternatives_korean:
  - 친구는 좋은 일을 놓고
  - 좋은 것을 두고 친구는
  lexicon: HALOT
  rationale: 히브리어 אוהב는 지혜문맥에서 단순한 ‘사랑하는 자’보다 ‘친구’로 기능하므로 그 의미를 살렸고, טוב는 POB의 판단대로 ‘좋은 것/좋은 일’의 넓은 뜻을 반영했습니다.
- source_word: נלחם עם זר
  english_pob_choice: fights with a stranger
  chosen_korean: 낯선 사람과 다투고
  alternatives_korean:
  - 낯선 사람과 싸우고
  - 외부인과 다투고
  lexicon: HALOT
  rationale: עם의 대립적 용법을 자연스럽게 풀어 한국어에서는 ‘다투다’로 옮겨 갈등 관계를 드러냈습니다. זר는 혈통보다 관계적 타자를 가리키므로 ‘낯선 사람’이 가장 무난합니다.
- source_word: נגד ערים
  english_pob_choice: against cities
  chosen_korean: 도시들을 상대로는
  alternatives_korean:
  - 도시들 앞에서는
  - 도시들을 맞아
  lexicon: HALOT
  rationale: נגד의 공간적·대면적 뉘앙스를 살리되 한국어에서 어색하지 않게 ‘상대로’로 옮겼습니다. POB의 히브리어 본문을 따라 ‘cities’를 유지했습니다.
- source_word: יחזיק צנה
  english_pob_choice: he will take up a shield
  chosen_korean: 방패를 들 것입니다
  alternatives_korean:
  - 방패를 잡을 것입니다
  - 방패를 들어 올릴 것입니다
  lexicon: HALOT
  rationale: יחזיק는 무기를 움켜쥐다/든다는 뜻을 자연스럽게 나타내며, ‘방패를 들다’는 현대 한국어에서 무장 행위를 가장 간결하게 표현합니다.
theological_decisions:
- issue: 히브리어 본문과 헬라어 평행본문의 차이
  chosen_reading: 본문은 히브리어의 ‘좋은 것/도시들’ 독법을 따르고, 헬라어의 ‘배/전쟁’ 독법은 주석적 대안으로만 처리합니다.
  alternative_readings:
  - 그리스어를 따라 ‘친구가 배 때문에 친구와 함께 고생한다’로 읽기
  - ‘전쟁을 앞두고 방패를 든다’로 평탄화하기
  rationale: POB의 원칙상 현존 히브리어 증거를 본문으로 삼되, 헬라어가 제시하는 의미 차이는 지워지지 않도록 유지해야 합니다. 따라서 본문은 히브리어를 따르고, 본질적 이문은 각주로 남깁니다.
  doctrine_reference: 본문비평/이문 처리 원칙
