translation:
  language: ko
  text: 한 사람의 생명은 날 수가 정해져 있지만, 이스라엘 백성의 생명은 날 수가 셀 수 없이 많습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 וְ는 단순히 ‘그리고’일 수도 있지만, 문맥상 앞절과의 대비를 이루는 ‘그러나’로 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַיֵּי אִישׁ
  english_pob_choice: A man's life
  chosen_korean: 한 사람의 생명
  alternatives_korean:
