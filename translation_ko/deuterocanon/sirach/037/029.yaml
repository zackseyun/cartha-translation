  lexicon: HALOT
  rationale: עַם יִשְׂרָאֵל의 집단적 의미를 보존하기 위해 ‘이스라엘 백성’으로 옮겼고, 대비 구조는 앞절과의 접속으로 드러나게 했습니다.
- source_word: יְמֵי אֵין מִסְפָּר
  english_pob_choice: days without number
  chosen_korean: 날 수가 셀 수 없이 많습니다
  alternatives_korean:
