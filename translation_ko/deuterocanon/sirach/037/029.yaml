translation:
  language: ko
  text: 한 사람의 생애는 날 수가 한정되어 있지만, 이스라엘 백성의 생애는 셀 수 없이 많은 날들입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 וְ는 단순히 ‘그리고’로도 옮길 수 있지만, 문맥상 앞 구절과 대비되는 ‘그러나’로 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַיֵּי אִישׁ
  english_pob_choice: A man's life
  chosen_korean: 한 사람의 생명
  alternatives_korean:
