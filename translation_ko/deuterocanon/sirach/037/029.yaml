  text: A man's life is a numbered span of days, but the life of the people of Israel is days without number.
  footnotes:
  - marker: a
    text: Or, more literally, 'and the life of the people of Israel, days without number.' The Hebrew conjunction can be read simply as 'and,' though the sense is contrastive.
