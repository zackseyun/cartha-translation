translation:
  language: ko
  text: 시온을 당신의 찬란함으로, 당신의 성전을 당신의 영광으로 가득 채우십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 절의 그리스어 증언은 현존 히브리어 본문과 크게 다르게, ‘거기서 즐기고, 네 생각을 실행하며, 교만한 말로 죄를 짓지 말라’고 읽습니다.
    reason: textual_variant
lexical_decisions:
- source_word: מלא
  english_pob_choice: Fill
  chosen_korean: 가득 채우십시오
  alternatives_korean:
  - 채우십시오
  - 충만하게 하십시오
  lexicon: HALOT
  rationale: 히브리어 명령형 מלא의 직접적 요청을 살리되, 한국어에서 시온과 성전이 ‘가득’ 차는 이미지를 자연스럽게 드러내기 위해 ‘가득 채우십시오’로 옮겼습니다.
- source_word: ציון
  english_pob_choice: Zion
  chosen_korean: 시온
  alternatives_korean:
  - 예루살렘
  lexicon: HALOT
  rationale: 지명 ציון은 해석하지 않고 음역하여, 본문이 말하는 구체적 대상인 시온을 보존했습니다.
- source_word: הודך
  english_pob_choice: your splendor
  chosen_korean: 네 찬란함
  alternatives_korean:
  - 네 영광
  - 네 위엄
  - 네 아름다움
  lexicon: HALOT
  rationale: הוד는 ‘영광’과 겹치면서도 광채·위엄의 뉘앙스가 있어, 뒤의 כבוד와 구별되도록 ‘찬란함’으로 옮겼습니다.
- source_word: כבודך
  english_pob_choice: your glory
  chosen_korean: 네 영광
  alternatives_korean:
  - 네 존귀
  - 네 위엄
  lexicon: HALOT
  rationale: כבוד의 기본적이고 문맥에 가장 적합한 의미는 ‘영광’이므로, 성전이 하나님의 영광으로 채워진다는 직설적 표현을 유지했습니다.
- source_word: היכלך
  english_pob_choice: your temple
  chosen_korean: 네 성전
  alternatives_korean:
  - 네 궁전
  - 네 성소
  lexicon: HALOT
  rationale: 시온과 병렬을 이루는 예배 장소로서 היכל은 여기서 하나님의 성전을 가리키므로, 현대 독자가 곧바로 이해할 수 있는 ‘성전’이 가장 분명합니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행문의 차이
  chosen_reading: 본문은 현존 히브리어의 기도문을 따라 시온과 성전이 하나님의 찬란함과 영광으로 채워지도록 구합니다.
  alternative_readings:
  - 그리스어처럼 ‘거기서 놀고, 생각한 바를 행하라’는 문장으로 따름
  rationale: 이 절의 그리스어 증언은 히브리어와 크게 달라 별개의 본문 형태로 보이므로, POB의 원칙에 따라 현존 히브리어를 मुख्य본문으로 삼았습니다.
  doctrine_reference: PHILOSOPHY.md § What we are translating
