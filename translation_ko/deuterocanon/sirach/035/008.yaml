  text: Sum up your speech[a]; in few words say much[b]. Be like one who knows and yet keeps silent.
  footnotes:
  - marker: a
    text: The extant Hebrew of this verse is difficult and appears partially corrupt in places; the Greek parallel has been used to recover the likely sense, especially in the first two clauses.
    reason: textual_variant
  - marker: b
    text: Literally, the Greek says, 'in few things, many,' an idiom meaning to say much with few words.
    reason: lexical_alternative
translation:
  language: ko
  text: 당신의 말을 정리하십시오[a]; 적은 말로 많은 것을 말하십시오[b]. 아는 사람처럼 되되, 동시에 침묵하십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 현존하는 히브리어는 이 절에서 난해하거나 부분적으로 손상된 것으로 보이며, 특히 앞의 두 절은 그리스어 평행문을 따라 의미를 복원했습니다.
    reason: textual_variant
  - marker: b
    text: 직역하면 그리스어는 ‘적은 것들 안에 많은 것들’에 가까우며, 적은 말로 많은 뜻을 담는 관용 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: κεφαλαίωσον λόγον / השבת ראש
  english_pob_choice: Sum up your speech
  chosen_korean: 당신의 말을 정리하십시오
  alternatives_korean:
  - 당신의 말을 요약하십시오
  - 당신의 말을 한데 묶으십시오
  - 당신의 말을 결론짓십시오
  lexicon: BDAG; HALOT
  rationale: 히브리어와 그리스어 모두 말을 간결하게 한데 모아 핵심을 잡으라는 뜻이므로, 현대 한국어에서 자연스럽고 합쇼체에 맞는 ‘정리하십시오’로 옮겼습니다.
- source_word: ἐν ὀλίγοις πολλά
  english_pob_choice: in few words say much
  chosen_korean: 적은 말로 많은 것을 말하십시오
  alternatives_korean:
  - 짧은 말로 많은 것을 말하십시오
  - 몇 마디로 많은 것을 말하십시오
  - 적은 말로 많은 뜻을 전하십시오
  lexicon: BDAG
  rationale: 그리스어 관용 표현의 핵심은 ‘적게 말하면서도 많이 담는 것’이므로, 직역보다 의미를 살린 한국어로 재현했습니다.
- source_word: γίνου ὡς γινώσκων
  english_pob_choice: Be like one who knows
  chosen_korean: 아는 사람처럼 되되
  alternatives_korean:
  - 아는 사람처럼 되십시오
  - 알고 있는 사람처럼 되되
  - 아는 자처럼 되되
  lexicon: BDAG
  rationale: 지혜문학적 권고의 비교 구조를 살리기 위해 ‘~처럼 되되’로 옮겨, 뒤의 침묵 권면과 긴장을 유지했습니다.
- source_word: ἅμα σιωπῶν
  english_pob_choice: and yet keeps silent
  chosen_korean: 동시에 침묵하십시오
  alternatives_korean:
  - 그러면서도 침묵하십시오
  - 한편 침묵을 지키십시오
  - 그리고도 잠잠하십시오
  lexicon: BDAG
  rationale: ‘ἅμα’의 병행성과 ‘σιωπῶν’의 침묵을 함께 살리되, 한국어에서 자연스러운 권고 표현으로 다듬었습니다.
theological_decisions:
- issue: 히브리어 본문이 난해한 부분과 그리스어 평행문의 사용
  chosen_reading: 의미가 분명한 그리스어 평행문을 따라 ‘말을 정리하고, 적은 말로 많은 것을 말하며, 아는 사람처럼 되되 침묵하라’는 권면으로 제시했습니다.
  alternative_readings:
  - 히브리어 표면형을 더 좇아 ‘모압’ 등의 난해 요소를 남기는 읽기
  - 본문 훼손을 강하게 반영해 불확정적으로 번역하는 읽기
  rationale: 이 절은 전승된 히브리어가 난해하므로, 영어 POB가 채택한 대로 그리스어 평행문으로 의미를 복원하는 것이 독자에게 저자의 의도를 가장 충실히 전달합니다.
  doctrine_reference: 본문비평 및 지혜문학 해석 원칙
