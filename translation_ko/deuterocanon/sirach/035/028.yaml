  source_fidelity: 첫 문장의 ‘에게도’는 원문의 단순한 열거에 없는 강조(‘~에게조차’)를 더합니다. 또한 ‘당신 위에 권한을 주다’는 한국어에서 부자연스럽고, ἐξουσίαν ἐπὶ σέ의 관계를 명료하게 드러내지 못합니다. 마지막 절은 주어진 재산을 ‘돌려 달라고’ 한다는 문맥적 이해가 가능하지만, 그리스어 δέῃ περὶ αὐτῶν은 압축되어 있어 반환 요구로 단정하기보다 ‘그것들을 두고 간청하다’로 옮기고 각주에서 대안을 밝혀 두는 편이 안전합니다.
  naturalness: ‘아들이나 아내, 형제나 친구에게’와 ‘자신을 다스릴 권한’은 현대 표준 한국어 합쇼체에서 자연스럽습니다. ‘살아 있는 동안’은 시간적 한정을 잘 전달합니다.
  terminology: ἐξουσία는 이 문맥에서 ‘권한’이 적절하나, 한국어에서는 ‘자신을 다스릴 권한을 주다’로 대상과 범위를 밝혀야 합니다. χρήματα는 ‘재산’으로 유지할 수 있습니다. δέῃ의 ‘필요에 처하다/부족하다’와 ‘간청하다’의 가능한 뉘앙스는 각주에 보존합니다.
