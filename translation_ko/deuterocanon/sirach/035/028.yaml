base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/035/028.yaml
  text: Do not give authority over yourself in your lifetime to son or wife[a], brother or friend; and do not give your property to another, lest you regret it and have to ask for it back.
  footnotes:
  - marker: a
    text: Or 'lest, after regretting it, you be reduced to asking about them / pleading for them.' The Greek final clause is somewhat compressed, and the exact nuance of δέῃ περὶ αὐτῶν may be understood more literally as 'be in need concerning them.'
    reason: lexical_alternative
translation:
  language: ko
  text: 아들, 아내, 형제, 친구에게도 살아 있는 동안에는 당신 위에 권한을 주지 마십시오. 또한 당신의 재산을 다른 사람에게 주지 마십시오. 그렇지 않으면 뒤늦게 후회하며 그것들을 돌려 달라고 하게 될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘뒤늦게 후회하며 그것들을 돌려 달라고 하게 될 것입니다’는 그리스어의 압축된 마지막 절을 풀어 옮긴 것입니다. 직역하면 ‘그것들에 관하여 필요에 처하게 되다/부족하게 되다’에 가깝습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ δῷς ἐξουσίαν
  english_pob_choice: do not give authority
  chosen_korean: 권한을 주지 마십시오
  alternatives_korean:
  - 권위를 주지 마십시오
  - 지배권을 넘겨주지 마십시오
  - 통제권을 주지 마십시오
  lexicon: BDAG
  rationale: ἐξουσία는 단순한 추상적 권위보다 실제로 행사되는 권한·지배력을 가리킬 수 있으므로, 한국어에서는 자연스러운 합쇼체 경고로 ‘권한을 주지 마십시오’가 가장 직접적입니다.
- source_word: ἐπὶ σὲ
  english_pob_choice: over yourself
  chosen_korean: 당신 위에
  alternatives_korean:
  - 자기 자신 위에
  - 자신을 지배하도록
  - 당신을 상대로
  lexicon: LSJ
  rationale: 문맥상 누군가가 자신 위에 권한을 갖는 상황이므로, ‘당신 위에’로 관계를 유지하면서 통제의 방향을 드러냈습니다.
- source_word: ἐν ζωῇ σου
  english_pob_choice: in your lifetime
  chosen_korean: 살아 있는 동안에는
  alternatives_korean:
  - 당신의 생애 동안에는
  - 생존하는 동안에는
  - 당신이 사는 동안에는
  lexicon: BDAG
  rationale: 시간 범위를 분명히 하면서도 한국어로 자연스럽게 들리도록, 생명 있는 기간을 강조하는 ‘살아 있는 동안에는’로 옮겼습니다.
- source_word: τὰ χρήματά σου
  english_pob_choice: your property
  chosen_korean: 재산
  alternatives_korean:
  - 소유물
  - 재물
  - 돈
  lexicon: BDAG
  rationale: χρήματα는 돈보다 넓게 소유 자산을 가리킬 수 있으므로, 후반의 ‘다른 사람에게 주지 마십시오’와 잘 맞는 포괄어 ‘재산’을 택했습니다.
theological_decisions:
- issue: 가족·친구 관계에 대한 경계의 강도
  chosen_reading: 아들, 아내, 형제, 친구에게도 자신 위에 권한을 주지 말라는 실천적 경고로 옮겼습니다.
  alternative_readings:
  - 가족에게 의존하지 말라는 일반적 조언
  - 재산 관리만을 말하는 제한적 경고
  rationale: 이 절은 단순한 재산 처분 조언이 아니라 가까운 관계일수록 통제권을 쉽게 넘기지 말라는 지혜문학적 경고이므로, 경고의 직접성을 살렸습니다.
  doctrine_reference: 지혜문학의 절제와 신중한 청지기 정신
