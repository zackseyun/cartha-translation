    rationale: 문맥상 가능한 해석이지만, δέῃ περὶ αὐτῶν은 더 문자적으로 ‘그것들에 관하여 궁핍해지다/필요를 느끼다’ 또는 ‘그것들을 두고 간청하다’로도 이해됩니다. 본문과 각주에서 여지를 남겨야 합니다.
