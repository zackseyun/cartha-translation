translation:
  language: ko
  text: 어떤 남자든 여자를 받아들입니다[a]. 그러나 한 남자는 젊은 여자를 선택합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 병행본문은 “조언 없이 아무것도 하지 말고, 행할 때에는 후회하지 마라”라고 달리 읽습니다. 이곳의 그리스어 전승은 현존 히브리어와 실질적으로 다른 문장을 전합니다.
    reason: textual_variant
lexical_decisions:
- source_word: כָּל זָכָר
  english_pob_choice: Any male
  chosen_korean: 어떤 남자든
  alternatives_korean:
  - 모든 남자
  - 어떤 남성
  lexicon: HALOT
  rationale: זָכָר의 생물학적 성별 표지를 살리면서, 격언체 일반화를 한국어로 자연스럽게 옮기기 위해 ‘어떤 남자든’을 택했습니다.
- source_word: תְּקַבֵּל
