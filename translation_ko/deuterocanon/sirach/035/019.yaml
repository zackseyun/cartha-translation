  rationale: עַלְמָה는 ‘결혼 가능한 젊은 여성’ 정도의 범위이므로, 의미를 과도하게 좁히는 ‘처녀’를 피하고 핵심 연령·성별 정보를 드러내는 표현을 택했습니다.
