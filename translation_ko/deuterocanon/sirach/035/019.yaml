translation:
  language: ko
  text: 모든 남성은 여성을 받아들입니다[a]. 하지만 남자는 젊은 여성을 선택합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 병행 전승은 “조언 없이 아무것도 하지 말고, 행할 때에는 후회하지 마라”라고 달리 읽습니다. 이곳의 그리스어 전승은 현존 히브리어와 실질적으로 다른 문장을 전합니다.
    reason: textual_variant
lexical_decisions:
- source_word: כָּל זָכָר
  english_pob_choice: Any male
  chosen_korean: 어떤 남자든
  alternatives_korean:
  - 모든 남자
  - 어떤 남성
  lexicon: HALOT
  rationale: זָכָר의 생물학적 성별 표지를 살리면서, 격언체 일반화를 한국어로 자연스럽게 옮기기 위해 ‘어떤 남자든’을 택했습니다.
- source_word: תְּקַבֵּל
  english_pob_choice: will accept
  chosen_korean: 받아들입니다
  alternatives_korean:
  - 받습니다
  - 수용합니다
  lexicon: HALOT
  rationale: קבל의 기본 의미인 ‘받다/받아들이다’를 살리되, 관계적 문맥에서 지나치게 물리적이거나 딱딱하지 않게 ‘받아들입니다’로 옮겼습니다.
- source_word: עַלְמָה
  english_pob_choice: a young woman
  chosen_korean: 젊은 여자
  alternatives_korean:
  - 처녀
  - 처녀 여자
  - 젊은 여인
  lexicon: HALOT
  rationale: עַלְמָה는 ‘결혼 가능한 젊은 여성’ 정도의 범위이므로, 의미를 과도하게 좁히는 ‘처녀’를 피하고 핵심 연령·성별 정보를 드러내는 표현을 택했습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행본문의 불일치
  chosen_reading: 현존 히브리어 속담을 본문으로 옮기고, 그리스어의 다른 전승은 각주로 투명하게 밝혔습니다.
  alternative_readings:
  - 그리스어 전승의 '아무 일도 조언 없이 하지 말라…'를 본문으로 따르는 읽기
  rationale: 지혜문학 시락은 히브리어가 남아 있을 때 이를 우선 번역하는 것이 원칙이므로, 본문은 히브리어를 따르되 그리스어는 전승 차이로 각주 처리했습니다.
  doctrine_reference: 'PHILOSOPHY.md: translate from Hebrew where it survives; preserve source uncertainty honestly.'
