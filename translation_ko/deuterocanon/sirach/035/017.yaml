translation:
  language: ko
  text: 목구멍은 모든 음식을 먹지만, 어떤 음식은 다른 음식보다 더 좋습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 짧은 잠언으로서 현존 형태가 다소 난삽합니다. 이 절의 그리스어 평행본문은 “죄인은 책망을 피하고, 자기 뜻대로 판결/논변을 찾는다”라고 하여 상당히 다릅니다. 이는 다른 원문 전승 또는 히브리어 전승의 본문 훼손을 시사합니다.
    reason: textual_variant
  - marker: b
    text: ‘목구멍’은 히브리어 גרגרת를 옮긴 말이며, ‘인후’로도 번역할 수 있습니다.
    reason: lexical_alternative
