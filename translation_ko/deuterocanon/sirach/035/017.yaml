base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/035/017.yaml
  text: The throat eats every kind of food[b][a], but one kind of food is more pleasant than another.
  footnotes:
  - marker: a
    text: The Hebrew is a terse proverb and somewhat awkward in its surviving form. The Greek parallel for this verse differs substantially ('A sinful man will evade reproof, and according to his will he will find a judgment/argument'), suggesting either a different Vorlage or textual disturbance in the Hebrew tradition.
    reason: textual_variant
  - marker: b
    text: Or 'the gullet' for 'the throat.'
    reason: lexical_alternative
translation:
  language: ko
  text: 인후는 모든 음식을 먹지만, 어떤 음식은 다른 음식보다 더 맛있습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 짧은 잠언으로서 다소 난삽하며, 이 절의 그리스어 평행본문은 ‘죄인은 책망을 피하고, 자기 뜻대로 판단/논쟁을 찾는다’고 하여 상당히 다릅니다. 이는 다른 원문 전승이거나 히브리어 전승의 훼손을 시사합니다.
    reason: textual_variant
  - marker: b
    text: ‘인후’는 히브리어 גרגרת의 의미를 살린 번역이며, ‘목구멍’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כל מאכל אוכל גרגרת
  english_pob_choice: The throat eats every kind of food
  chosen_korean: 인후는 모든 음식을 먹지만
  alternatives_korean:
  - 목구멍은 모든 음식을 먹지만
  - 목은 모든 음식을 먹지만
  lexicon: HALOT
  rationale: גרגרת는 목구멍/인후를 가리키는 말이므로, 현대 한국어에서 의미를 비교적 직접적으로 살리는 ‘인후’를 택했습니다. 속담체의 일반 진술도 살려 주어를 앞세웠습니다.
- source_word: מאכל / אכל
  english_pob_choice: every kind of food / food
  chosen_korean: 모든 음식
  alternatives_korean:
  - 먹을거리
  - 식물
  lexicon: HALOT
  rationale: 두 번째 절의 אכל도 같은 의미 영역의 ‘먹을 것’이므로, 영어 POB의 audit처럼 인위적 구분을 두지 않고 ‘음식’으로 통일해 병행성을 살렸습니다.
- source_word: אך
  english_pob_choice: but
  chosen_korean: 하지만
  alternatives_korean:
  - 그러나
  - 그렇지만
  lexicon: HALOT
  rationale: 대조를 분명히 드러내는 접속사로 현대 문체에서 자연스러운 ‘하지만’을 선택했습니다.
- source_word: נעים
  english_pob_choice: more pleasant
  chosen_korean: 더 맛있습니다
  alternatives_korean:
  - 더 հաճ습니다
  - 더 기분 좋습니다
  - 더 즐겁습니다
  lexicon: HALOT
  rationale: 문맥상 먹는 대상의 비교이므로 감각적으로 가장 자연스러운 ‘맛있다’로 옮겼습니다. 다만 원어의 넓은 ‘즐겁고 쾌적함’도 염두에 둔 비교 표현입니다.
theological_decisions:
- issue: 시적/잠언적 일반 진술의 문체
  chosen_reading: 직역보다 속담처럼 읽히는 현대 합쇼체로 옮기되, 문장 구조의 대조를 유지했습니다.
  alternative_readings:
  - ‘인후는 모든 음식을 먹습니다. 그러나 어떤 음식은 다른 음식보다 더 좋습니다.’
  - ‘목구멍은 어떤 음식이든 삼킵니다. 그러나 어떤 음식은 더 좋습니다.’
  rationale: 이 구절은 교리 진술이 아니라 짧은 잠언이므로, 의미를 과도하게 해석하지 않으면서도 현대 한국어에서 읽히는 문장으로 다듬는 것이 적절합니다.
  doctrine_reference: 잠언/지혜문학의 비유적 일반 진술
