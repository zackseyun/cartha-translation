  text: Any food is shut up in the belly[b][a], but one food is more pleasant than another.
  footnotes:
  - marker: a
    text: 'Hebrew is slightly compressed: literally, ''there is food from food that is pleasant.'' The sense is comparative: one kind of food is more pleasant than another.'
