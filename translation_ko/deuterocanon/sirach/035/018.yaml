translation:
  language: ko
  text: 어떤 음식이든지 배 속에 들어가지만, 어떤 음식은 다른 음식보다 더 맛있습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 압축되어 있어, 문자적으로는 ‘음식이 음식으로부터 맛있다’에 가깝습니다. 뜻은 비교적 표현으로, 한 음식이 다른 음식보다 더 맛있다는 의미입니다.
    reason: lexical_alternative
  - marker: b
    text: 이 절의 그리스어 병행본문은 현존 히브리어와 상당히 다르며, 다른 본문 전통을 반영한 것으로 보입니다. 본 번역은 히브리어 증거를 주본문으로 따랐습니다.
    reason: textual_variant
lexical_decisions:
- source_word: כל מאכל
  english_pob_choice: Any food
  chosen_korean: 어떤 음식이든지
  alternatives_korean:
  - 모든 음식이
  - 각종 음식이
  lexicon: HALOT
  rationale: כל + 단수 명사는 포괄적·분배적 의미를 띨 수 있으므로, 한국어에서는 자연스러운 총칭 표현인 “어떤 음식이든지”로 옮겼습니다.
- source_word: תסגר בבטן
  english_pob_choice: is shut up in the belly
  chosen_korean: 배 속에 들어가지만
  alternatives_korean:
  - 배 속에 갇히지만
  - 배 속에 갇힙니다
  - 배에 봉해집니다
  lexicon: HALOT
  rationale: 직역하면 “배 속에 갇히다”에 가깝지만, 음식이 소화기관 안으로 들어간다는 그림을 한국어로 자연스럽게 살리기 위해 “들어가다”를 택했습니다. “배”는 여기서 해부학적 ‘위’보다 히브리어의 구체적 육체 이미지를 더 잘 보존합니다.
- source_word: אך
  english_pob_choice: but
  chosen_korean: 하지만
  alternatives_korean:
  - 그러나
  - 그런데
  - 다만
  lexicon: HALOT
  rationale: 앞 절의 일반적 사실과 뒤의 비교 진술을 대조하는 연결어로 가장 자연스럽습니다.
- source_word: יש מאכל ממאכל תנעם
  english_pob_choice: one food is more pleasant than another
  chosen_korean: 어떤 음식은 다른 음식보다 더 맛있습니다
  alternatives_korean:
  - 어떤 음식은 다른 음식보다 더 즐겁습니다
  - 어떤 음식은 다른 음식보다 더 기분 좋습니다
  lexicon: HALOT
  rationale: 압축된 비교 구문을 한국어로 풀어, “한 음식이 다른 음식보다 더 좋다”는 의미를 분명히 했습니다. נעם의 의미 범위는 ‘맛있다’로도 충분히 전달됩니다.
theological_decisions:
- issue: 감각적 ‘pleasant’의 한국어 표현
  chosen_reading: 기본 의미를 ‘맛있습니다’로 옮겨, 먹는 경험에 대한 직접적 감각을 살렸습니다.
  alternative_readings:
  - 더 pleasant합니다
  - 더 즐겁습니다
  - 더 좋습니다
  rationale: 문맥이 음식의 섭취와 비교를 말하므로, 추상적 ‘즐겁다’보다 미각 중심의 ‘맛있다’가 원문의 육체적·일상적 뉘앙스를 더 잘 드러냅니다.
  doctrine_reference: 문맥 우선 번역 원리
