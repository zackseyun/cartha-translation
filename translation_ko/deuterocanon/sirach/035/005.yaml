review_pass:
  verdict: revise
  source_fidelity: 히브리어 명령형의 병렬 구조(‘표징을 새롭게 하다 / 이적을 다시 행하다 / 손을 영화롭게 하다 / 팔과 오른손을 굳세게 하다’)를 따라야 합니다. 초안의 ‘새로운 표징’은 חדש를 ‘새로운’이라는 형용사로 바꾸어 ‘새롭게 하다/갱신하다’라는 동작을 약화시키며, ‘손을 높이 드시고’는 האדר יד의 ‘손을 영화롭게 하다·위엄 있게 하다’와 다른 신체 동작을 도입합니다.
  naturalness: ‘표징’, ‘이적’, ‘영화롭게’, ‘굳세게’는 현대의 격식 있는 성서 문체에서 자연스럽고, 원문의 반복되는 신체 은유도 보존합니다. 긴 대시 대신 문장과 쉼표로 병렬을 분명히 하는 편이 자연스럽습니다.
  terminology: אות는 ‘표징’, מופת는 ‘이적’으로 구별하여 옮기는 것이 간결하면서도 성서적 용례를 살립니다. יד·זרוע·ימין은 각각 ‘손·팔·오른손’으로 유지합니다.
