translation:
  language: ko
  text: 표징을 새롭게 하시고, 이적을 다시 행하십시오[a]. 손을 영화롭게 하시고, 팔과 오른손을 굳세게 하십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 평행본문은 금 장식 위의 홍옥수 도장과 포도주 잔치에서의 음악의 조화라는 전혀 다른 이미지를 말합니다. 히브리어 증거가 현존하고 신뢰도가 높으므로, 본문은 히브리어를 따르며 이 중요한 차이는 여기에 밝힙니다.
    reason: textual_variant
lexical_decisions:
- source_word: חדש
  english_pob_choice: Renew
  chosen_korean: 새로운 표징을 일으키고
  alternatives_korean:
  - 새롭게 하시고
  - 새 표징을 다시 일으키고
  lexicon: HALOT
  rationale: חדש의 동사를 단순히 '반복하다'로만 좁히기보다, POB의 'Renew'에 맞춰 새롭게 드러내는 동작으로 살렸습니다. '일으키다'는 표징의 발생/현현을 자연스럽게 담습니다.
- source_word: אות
  english_pob_choice: a sign
  chosen_korean: 표징
  alternatives_korean:
  - 표
  - 징조
  - 증거
  lexicon: HALOT
  rationale: 성경적 맥락에서 אות은 하나님의 드러남을 가리키는 표지이므로, 일상적 '표'보다 더 분명한 '표징'을 선택했습니다.
- source_word: ושנה מופת
  english_pob_choice: and repeat a wonder
  chosen_korean: 한 경이로운 일을 다시 행하십시오
  alternatives_korean:
  - 기적 하나를 다시 행하십시오
  - 경이로운 일을 반복하십시오
  lexicon: HALOT
  rationale: מופת를 현대 한국어에서 '경이로운 일'로 옮겨 하나님의 놀라운 행위를 드러냈고, ושנה는 '다시'로 반복의 의미를 분명히 했습니다.
- source_word: האדר יד ואמץ זרוע וימין
  english_pob_choice: glorify the hand and strengthen the arm and the right hand
  chosen_korean: 손을 높이 드시고 — 팔과 오른손을 강하게 하십시오
  alternatives_korean:
  - 손을 영화롭게 하시고 팔과 오른손을 강하게 하십시오
  - 손과 팔과 오른손을 영화롭게 하십시오
  lexicon: HALOT
  rationale: האדר은 단순한 '영광'보다 위엄을 드러내는 동작으로 읽혀 '손을 높이 드시고'로 옮겼습니다. יד/זרוע/ימין의 신체 은유는 그대로 유지하되, 한국어에서는 '팔과 오른손'으로 자연스럽게 연결했습니다.
theological_decisions:
- issue: 의인화된 신체 표현의 보존
  chosen_reading: '''손'', ''팔'', ''오른손''의 이미지를 그대로 살려 하나님의 능력을 추상어로 평탄화하지 않았습니다.'
  alternative_readings:
  - 권능을 드러내십시오
  - 능력을 나타내십시오
  rationale: 히브리어는 하나님의 행위를 신체 이미지로 표현합니다. 본문의 수사와 신학적 질감을 유지하기 위해 추상화보다 직역적 이미지를 택했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 3, 6
- issue: 히브리어 본문을 우선하고 그리스어 평행본문은 부차적으로 다룸
  chosen_reading: 히브리어 본문의 청원형 표현을 따라 번역하고, 그리스어의 다른 이미지(금 장식과 연회 음악)는 본문에 반영하지 않았습니다.
  alternative_readings:
  - 그리스어 평행본문에 맞추어 전혀 다른 이미지를 채택하기
  rationale: 이 절은 히브리어 증거가 고신뢰로 존재하므로, 의미상 핵심을 유지하면서 히브리어를 본문으로 삼는 것이 주석상 타당합니다.
  doctrine_reference: PHILOSOPHY.md 'What we are translating' and user task requirement
