base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/035/033.yaml
  text: Fodder and a stick and loads are for a donkey[c][b][a]; bread and discipline and work are for a slave.
  footnotes:
  - marker: a
    text: Or 'a rod' for ῥάβδος.
    reason: lexical_alternative
  - marker: b
    text: Or 'instruction' or 'training' for 'discipline' (παιδεία).
    reason: lexical_alternative
  - marker: c
    text: Greek οἰκέτῃ refers specifically to a household slave or servant; 'household slave' is a more explicit alternative.
    reason: lexical_alternative
translation:
  language: ko
  text: 사료와 막대와 짐은 나귀를 위한 것이고, 빵과 훈육과 일은 종을 위한 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χορτάσματα
  english_pob_choice: fodder
  chosen_korean: 사료
  alternatives_korean:
  - 먹이
  - 꼴
  lexicon: LSJ
  rationale: 가축의 먹이를 가리키는 구체적 의미를 살리면서 현대 한국어에서 자연스럽게 읽히는 말을 택했습니다.
- source_word: ῥάβδος
  english_pob_choice: a stick
  chosen_korean: 막대
  alternatives_korean:
  - 지팡이
  - 몽둥이
  - 막대기
  lexicon: LSJ
  rationale: 비유적 훈계 도구라기보다 나귀를 다루는 물건이라는 이미지가 더 직접적이어서, ‘막대’로 간결하게 옮겼습니다.
- source_word: παιδεία
  english_pob_choice: discipline
  chosen_korean: 훈육
  alternatives_korean:
  - 교육
  - 훈련
  - 교정
  lexicon: LSJ
  rationale: 이 단락의 병렬 구조에서 단순한 지식 전달보다 통제와 교정의 뉘앙스가 두드러지므로 ‘훈육’이 가장 가깝습니다.
- source_word: οἰκέτῃ
  english_pob_choice: a slave
  chosen_korean: 종
  alternatives_korean:
  - 노예
  - 하인
  - 가사 노예
  lexicon: LSJ
  rationale: English POB가 ‘slave’로 봉사 관계보다 속박된 신분을 드러낸 점을 따라, 한국어에서는 너무 현대적이거나 설명적인 표현보다 성경적 문맥에서 널리 쓰이되 종속성을 유지하는 ‘종’을 택했습니다.
theological_decisions:
- issue: οἰκέτῃ의 사회적 신분을 얼마나 직접적으로 드러낼지
  chosen_reading: ‘종’으로 옮기되, 본문 자체는 간결한 병렬을 유지합니다.
  alternative_readings:
  - ‘노예’로 더 직접적으로 옮김
  - ‘하인’으로 완화함
  rationale: 이 절은 지혜 격언으로서 가정 내 역할의 차이를 병렬적으로 말하므로, 본문에서는 과도한 설명을 넣지 않되 속박된 지위를 완전히 지우지도 않는 균형이 필요합니다. ‘종’은 그 긴장을 비교적 잘 보존합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms table for δοῦλος; Translation philosophy §1'
