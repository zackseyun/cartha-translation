  naturalness: ‘너는’과 ‘-십시오’의 결합은 현대 표준어 합쇼체의 높임 체계와 맞지 않습니다. 또한 ‘너의 이름 안에서’는 한국어에서 부자연스럽습니다. ‘당신의 이름으로’가 자연스럽고, 원문의 전치사구가 지닌 다소 불명확한 관계도 과도하게 해석하지 않습니다.
