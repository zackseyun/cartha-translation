  text: Bear witness to your former deeds[a], and establish the vision swiftly in your name.
  footnotes:
  - marker: a
    text: 'The Hebrew of this line is difficult, especially the phrase rendered ''swiftly.'' The Greek parallel reads instead: ''And besides these things, bless the one who made you and who fills you with his good things.'''
    reason: alternative_reading
translation:
  language: ko
  text: 너는 네 이전 행적을 증언하고, 너의 이름 안에서 그 환상을 세우십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 이 행은 특히 ‘빨리/신속히’에 해당하는 표현이 매우 어렵습니다. 그리스어 평행본문은 대신 “그리고 이 밖에도, 너를 지으신 분과 그분의 좋은 것들로 너를 채우시는 분을 찬송하라”라고 읽습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: תן עדות
  english_pob_choice: Bear witness
  chosen_korean: 증언하고
  alternatives_korean:
  - 증언하십시오
  - 간증하고
  - 증거를 말하고
  lexicon: HALOT
  rationale: 직역된 ‘증거를 주다’보다 현대 합쇼체에서 자연스럽고, 법정적·증언적 힘을 살리는 동사로 ‘증언하다’를 택했습니다.
- source_word: למראש מעשיך
  english_pob_choice: to your former deeds
  chosen_korean: 네 이전 행적을
  alternatives_korean:
  - 네 이전 일들을
  - 네 옛 행적을
  - 네 선행을
  lexicon: HALOT
  rationale: 문맥상 ‘처음부터’보다 ‘이전에 있었던 행적’이 더 자연스럽고, מַעֲשִׂים의 행위·행적 의미를 살리기 위해 ‘행적’을 선택했습니다.
- source_word: והקם חזון
  english_pob_choice: and establish the vision
  chosen_korean: 그 환상을 세우십시오
  alternatives_korean:
  - 그 환상을 확립하십시오
  - 그 계시를 세우십시오
  - 그 비전을 세우십시오
  lexicon: HALOT
  rationale: הקים의 사역적 의미를 ‘세우다/확립하다’로 옮겼고, חזון은 가장 직접적인 의미인 ‘환상’으로 옮겨 시적 이미지를 보존했습니다.
- source_word: דברק
  english_pob_choice: swiftly
  chosen_korean: —
  alternatives_korean:
  - 신속히
  - 번개처럼
  - 속히
  lexicon: HALOT
  rationale: 이 어휘는 히브리어 본문에서 매우 난해하며, 그리스어 평행본문과도 내용이 크게 달라 본문 재구성이 확실하지 않습니다. 따라서 본문에는 억지로 의미를 단정하지 않고, 난해성은 주석으로 처리했습니다.
- source_word: בשמך
  english_pob_choice: in your name
  chosen_korean: 너의 이름 안에서
  alternatives_korean:
  - 너의 이름으로
  - 너의 이름 안에
  - 네 이름 안에서
  lexicon: HALOT
  rationale: ב + שֵׁם을 비교적 सीधे하게 옮겨 원문 어감을 유지했습니다. 한국어에서는 ‘이름 안에서’가 다소 낯설지만, 본문의 축약된 표현을 보존하는 데 유리합니다.
theological_decisions:
- issue: 히브리어 난본문과 그리스어 평행본문의 차이
  chosen_reading: 주본문은 현존 히브리어를 따르고, 그리스어의 ‘하나님을 찬송하라’는 방향은 본문 대신 주석으로만 남깁니다.
  alternative_readings:
  - 그리고 이 모든 것 위에, 너를 지으신 분과 그분의 좋은 것들로 너를 채우시는 분을 찬송하십시오.
  rationale: 시락서는 히브리어 전승을 우선하되, 여기서는 히브리어가 불명확하고 그리스어가 상당히 다르므로 두 전승의 차이를 숨기지 않는 것이 본문 충실성에 부합합니다.
  doctrine_reference: 'PHILOSOPHY.md: translate from Hebrew where it survives; use Greek parallel as actual translation input'
