  yaml_path: translation/deuterocanon/sirach/035/031.yaml
  text: In all your works be preeminent[a]; do not give a blemish to your honor.
  footnotes:
  - marker: a
    text: Or 'do not bring a blemish upon your reputation'; Greek 'glory' here likely carries the sense of honor or good name.
