    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν πᾶσι τοῖς ἔργοις σου
  english_pob_choice: In all your works
  chosen_korean: 모든 일에서
  alternatives_korean:
  - 당신의 모든 일에서
  - 모든 행위에서
  lexicon: LSJ
  rationale: ἔργα는 단순한 행동보다 ‘일/행위’의 폭넓은 범위를 가리키므로, 합쇼체 현대문장에서는 ‘모든 일에서’가 자연스럽고 원문의 포괄성을 유지합니다.
- source_word: γίνου ὑπεράγων
  english_pob_choice: be preeminent
  chosen_korean: 뛰어나십시오
  alternatives_korean:
  - 탁월해지십시오
  - 월등하십시오
  - 으뜸이 되십시오
  lexicon: LSJ
  rationale: γίνομαι의 명령형은 여기서 상태와 태도를 권면하는 용법이므로, 결과 상태를 드러내는 ‘뛰어나십시오’가 과도한 과정성 없이 원문의 권고를 잘 살립니다.
- source_word: μὴ δῷς μῶμον
  english_pob_choice: do not give a blemish
  chosen_korean: 흠을 남기지 마십시오
  alternatives_korean:
  - 흠을 주지 마십시오
  - 흠을 만들지 마십시오
  - 오점을 남기지 마십시오
  lexicon: LSJ
  rationale: μῶμον은 ‘흠, 비난거리, 결점’을 뜻하므로, 한국어에서는 ‘흠을 남기다’가 명예 훼손의 결과를 자연스럽게 전달합니다.
- source_word: ἐν τῇ δόξῃ σου
  english_pob_choice: to your honor
  chosen_korean: 당신의 명예에
  alternatives_korean:
  - 당신의 영광에
  - 당신의 평판에
  - 당신의 좋은 이름에
  lexicon: LSJ
  rationale: δόξα는 여기서 신학적 ‘영광’보다 사회적·윤리적 ‘명예/평판’의 뜻이 강하므로, 문맥에 맞게 ‘명예’로 옮겼습니다.
theological_decisions:
- issue: δόξα의 의미를 ‘영광’으로 둘지 ‘명예’로 둘지
  chosen_reading: 명예
  alternative_readings:
  - 영광
  - 평판
  - 좋은 이름
  rationale: 이 지혜문맥은 외적 존귀보다 삶의 품격과 공적 명성을 염두에 두므로, ‘명예’가 원문의 윤리적 초점을 가장 잘 드러냅니다.
  doctrine_reference: 원어 우선 원칙과 문맥 우선의 최적일치 번역
