base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/035/007.yaml
  text: Hasten the end and attend to the appointed time[b][a], for who will tell you what you should do?
  footnotes:
  - marker: a
    text: 'The Greek parallel tradition here reads very differently: ''Speak, young man, if there is need of you, scarcely twice if you are asked.'' This appears to reflect a different textual form rather than a close translation of the extant Hebrew.'
    reason: textual_variant
  - marker: b
    text: Hebrew 'what you will do' can also be rendered 'what to do'; the translation 'what you should do' brings out the practical force of the rhetorical question.
    reason: lexical_alternative
translation:
  language: ko
  text: 끝을 서두르고 정한 때를 살피십시오[a][b]. 누가 당신에게 무엇을 해야 할지 말해 주겠습니까?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 병행 전승은 여기서 매우 다르게 읽습니다. ‘말하라, 젊은이여, 네가 필요하면, 요청받을 때 겨우 두 번이라도.’ 이는 현존 히브리어와 가까운 번역이라기보다 다른 본문 형태를 반영한 것으로 보입니다.
    reason: textual_variant
  - marker: b
    text: 히브리어의 ‘네가 할 것’은 ‘무엇을 해야 할지’로도 옮길 수 있습니다. 여기서는 잠언식 수사 질문의 실용적 힘을 드러내기 위해 후자를 택했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: החיש קץ
  english_pob_choice: Hasten the end
  chosen_korean: 끝을 서두르십시오
  alternatives_korean:
  - 끝을 재촉하십시오
  - 끝을 앞당기십시오
  lexicon: HALOT
  rationale: החיש의 급박한 명령성을 살려 ‘서두르다/재촉하다’로 옮겼고, קץ는 ‘종말’보다 중립적인 ‘끝’이 문맥상 더 직접적입니다.
- source_word: ופקוד מועד
  english_pob_choice: and attend to the appointed time
  chosen_korean: 정한 때를 살피십시오
  alternatives_korean:
  - 정해진 때를 돌보십시오
  - 정한 때에 주목하십시오
  lexicon: HALOT
  rationale: פקד는 ‘돌보다/주목하다/살피다’의 폭이 있어, כאן은 מועד와 함께 ‘정해진 때를 의식하며 살피다’는 뜻을 가장 자연스럽게 드러내는 ‘살피다’를 택했습니다.
- source_word: מה תעשה
  english_pob_choice: what you should do
  chosen_korean: 무엇을 해야 할지
  alternatives_korean:
  - 무엇을 할지
  - 무엇을 하게 될지
  lexicon: HALOT
  rationale: 직역하면 ‘무엇을 하겠는지’이지만, 수사적 질문의 실용적 힘을 살리기 위해 한국어에서는 ‘해야 할지’가 가장 자연스럽습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행문의 불일치
  chosen_reading: 현존 히브리어 본문을 본문으로 번역하고, 그리스어는 별도 전승으로 각주에 표시했습니다.
  alternative_readings:
  - 그리스어의 ‘젊은이여, 네가 필요하면 말하라’에 따른 번역
  rationale: 집회서에서는 현존 히브리어가 있을 때 그것을 우선하되, 여기서는 그리스어가 현저히 다른 문장을 보이므로 본문을 뒤바꾸지 않고 전승 차이를 투명하게 드러내는 것이 옳습니다.
  doctrine_reference: 'PHILOSOPHY.md: translate from Hebrew where Sirach survives; note divergent Greek parallel as textual variant.'
