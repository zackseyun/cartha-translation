base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/035/027.yaml
  text: So is the man who has no nest[b][a], resting wherever evening overtakes him.
  footnotes:
  - marker: a
    text: Hebrew text is somewhat terse and may be textually uncertain. The line is translated from the surviving Hebrew, with the Greek tradition kept in view as a consistency check.
    reason: textual_variant
  - marker: b
    text: Or 'who has no home.' The Hebrew literally says 'who has no nest,' preserving the image of a creature without a fixed place to settle.
    reason: lexical_alternative
translation:
  language: ko
  text: 그와 같이, 집이 없는 사람은 저녁이 그를 덮칠 때마다 쉬게 됩니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 간결하며 다소 불확실할 수 있습니다. 이 번역은 남아 있는 히브리어를 따르되, 그리스어 전통을 일관성 점검으로 참고했습니다.
    reason: textual_variant
  - marker: b
    text: 또는 ‘집이 없는 사람’입니다. 히브리어는 문자적으로 ‘둥지가 없는 사람’을 뜻하며, 정착할 곳이 없는 이미지를 보존합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כן
  english_pob_choice: So is the man
  chosen_korean: 그와 같이
  alternatives_korean:
  - 이와 같이
  - 그러므로
  lexicon: HALOT
  rationale: 비교·유비를 여는 말로, 한국어에서는 서술을 자연스럽게 시작하는 "그와 같이"가 원문의 비교 관계를 가장 무리 없이 살립니다.
- source_word: איש אשר לא קן
  english_pob_choice: the man who has no nest
  chosen_korean: 집이 없는 사람
  alternatives_korean:
  - 둥지가 없는 사람
  - 안식할 곳이 없는 사람
  lexicon: HALOT
  rationale: 히브리어의 직역 이미지인 "둥지"를 유지할 수도 있지만, 본절은 비유적 표현이므로 한국어에서는 의미를 곧바로 드러내는 "집이 없는 사람"으로 옮겼습니다.
- source_word: המרגיע
  english_pob_choice: resting
  chosen_korean: 쉬게 됩니다
  alternatives_korean:
  - 쉬며 있습니다
  - 안식을 찾습니다
  lexicon: HALOT
  rationale: 분사형의 지속적 상태를 자연스러운 문장으로 풀어, 고정된 거처가 없는 사람이 임시로 쉬는 모습을 살렸습니다.
- source_word: כאשר יערב
  english_pob_choice: wherever evening overtakes him
  chosen_korean: 저녁이 그를 덮칠 때마다
  alternatives_korean:
  - 저녁이 닥칠 때마다
  - 해질 무렵마다
  lexicon: HALOT
  rationale: 문자적 시간표현을 넘어서, 저녁이 닥치는 상황에 따라 머물 곳이 정해짐을 보여 주는 방향으로 옮겼습니다.
theological_decisions:
- issue: 대조적·잠언적 유비를 한국어에서 어떻게 유지할지
  chosen_reading: 직설적 해설보다 비교 구조를 살려, 떠도는 사람의 처지를 생생한 이미지로 전달했습니다.
  alternative_readings:
  - 의미를 풀어 '정처 없이 떠도는 사람'으로 재구성하기
  - 보다 평이하게 '집 없는 사람'으로만 압축하기
  rationale: 본절은 교리 진술보다 잠언적 비유가 핵심이므로, 원문의 이미지성과 적용 가능성을 함께 살리는 번역이 적절합니다.
  doctrine_reference: 잠언/지혜문학의 비유적 진술 원칙
