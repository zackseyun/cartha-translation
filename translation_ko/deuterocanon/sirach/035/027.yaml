    text: 히브리어 본문은 매우 간결하며 본문 상태가 다소 불확실할 수 있습니다. 이 번역은 남아 있는 히브리어 본문을 따르되, 그리스어 전통도 일관성 점검을 위해 참고했습니다.
    reason: textual_variant
