  text: 그리고 또, 혀에 치유가 있다면, 그것은 사람들 가운데에 있지 않습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 제공된 히브리어 사본 전승은 이 절에서 내용이 어긋나거나 훼손된 것으로 보입니다. 따라서 본문은 주어진 히브리어를 따릅니다.
    reason: textual_variant
  - marker: b
    text: ‘혀에 치유’는 문자적으로는 어색하지만, 히브리어 표현을 그대로 살린 번역입니다.
    reason: lexical_alternative
