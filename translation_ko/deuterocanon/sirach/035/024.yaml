  text: And again[a], if there is healing for the tongue[b], it is not among human beings.
  footnotes:
  - marker: a
    text: 'The extant Hebrew line in the supplied Cairo Geniza witness appears mismatched or corrupt at this verse; the translation therefore follows the Greek parallel, which reads coherently: ''Whoever trusts in the law gives heed to the commandments, and whoever trusts in the Lord will not be diminished.'''
