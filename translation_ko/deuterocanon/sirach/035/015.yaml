  - 당신의 기뻐하심에 따라 당신의 백성에게
  lexicon: HALOT
  rationale: רצון은 ‘뜻’과 ‘호의/기쁨’ 모두 가능하지만, 이어지는 ‘당신의 백성에게’와 결합될 때는 관계적이고 호의적인 뉘앙스가 더 분명하므로 ‘호의’로 살렸습니다.
