translation:
  language: ko
  text: 아직 살아 있고 숨이 붙어 있는 동안에는, 어느 누구에게도 자신을 내맡기지 마십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, 더 문자적으로는 ‘어떤 육체에게도 자신을 바꾸지 마십시오.’ 그리스어 표현은 관용적이며, 여기서 ‘육체’는 육체 자체나 죄된 본성이 아니라 죽을 수밖에 없는 사람들을 가리킬 수 있습니다. 따라서 어느 누구에게도 자신을 넘겨주거나 굴복시키지 말라는 뜻으로 이해될 수 있습니다.
    reason: lexical_alternative
