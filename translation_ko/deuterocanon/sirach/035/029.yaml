  source_fidelity: ‘어떤 육체에게도’는 σάρξ의 문자적 형태는 보존하지만 한국어에서 사람을 대상으로 하는 여격 표현으로는 부자연스럽고 의미가 불명확합니다. 문맥상 σάρξ는 ‘필멸의 인간’을 가리키므로 본문에서는 ‘어느 누구에게도’로 자연스럽게 옮기고, 각주에서 원문의 ‘육체’ 표현과 가능한 문자적 번역을 밝혔습니다. ‘자신을 내맡기지 마십시오’는 μὴ ἀλλάξῃς σεαυτόν의 관용적·압축적인 경고의 힘을 보존하면서 특정 교리적 해석을 덧붙이지 않습니다.
  naturalness: ‘아직 살아 있고 숨이 붙어 있는 동안에는’은 생명과 숨의 병렬을 자연스러운 현대 한국어 관용으로 재현합니다. ‘어느 누구에게도 자신을 내맡기지 마십시오’는 합쇼체에 맞고, 원문의 금지 명령을 명료하게 전달합니다.
  terminology: σάρξ를 본문에서 ‘죄성’이나 ‘육신의 정욕’으로 해석하지 않았습니다. 다만 한국어 ‘육체에게’는 비문에 가깝기 때문에, 본문은 사람을 뜻하는 의미로 번역하고 각주에서 ‘육체’라는 원어 표현 및 ‘필멸의 사람들’이라는 의미를 보존했습니다.
