base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/035/029.yaml
  text: As long as you still live and have breath in you, do not give yourself over to any flesh.
  footnotes:
  - marker: a
    text: Or, more formally, 'do not change yourself for any flesh.' The Greek wording is idiomatic and may carry the sense of not yielding yourself to mere mortals.
    reason: lexical_alternative
translation:
  language: ko
  text: 아직 살아 있고 숨이 당신 안에 있는 동안에는, 어떤 육체에게도 자신을 내주지 마십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, 더 문자적으로는 ‘어떤 육체를 위해서도 자신을 바꾸지 마십시오.’ 그리스어 표현은 관용적일 수 있으며, ‘죽을 수밖에 없는 사람들’에게 자신을 굴복시키지 말라는 뜻을 담을 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕως ἔτι ζῇς
  english_pob_choice: As long as you still live
  chosen_korean: 아직 살아 있고
  alternatives_korean:
  - 살아 있는 동안
  - 아직 생명이 있는 동안
  lexicon: LSJ
  rationale: 지속 기간을 나타내는 표현으로, 현재 생명이 지속되는 동안이라는 뜻을 자연스럽게 살렸습니다.
- source_word: πνοὴ
  english_pob_choice: breath
  chosen_korean: 숨
  alternatives_korean:
  - 호흡
  - 생명의 숨
  lexicon: LSJ
  rationale: πνοή의 기본 의미인 물리적 호흡을 살리되, 한국어에서는 ‘숨’이 가장 간결하고 자연스럽습니다.
- source_word: μὴ ἀλλάξῃς σεαυτὸν
  english_pob_choice: do not give yourself over
  chosen_korean: 자신을 내주지 마십시오
  alternatives_korean:
  - 자신을 바꾸지 마십시오
  - 자신을 내맡기지 마십시오
  - 자신을 넘기지 마십시오
  lexicon: LSJ
  rationale: 직역의 ‘바꾸다’보다, 자기 자신을 타인/압력에 넘겨주는 뉘앙스를 살려 금지의 윤리적 힘을 드러냈습니다.
- source_word: πάσῃ σαρκί
  english_pob_choice: to any flesh
  chosen_korean: 어떤 육체에게도
  alternatives_korean:
  - 어떤 사람에게도
  - 모든 육체에게
  - 어떤 필멸자에게도
  lexicon: LSJ
  rationale: 여기서 σάρξ는 죄성보다 연약한 인간을 가리키는 일반적 표현이므로, ‘육체’로 옮겨 원문의 범주와 투명성을 유지했습니다.
theological_decisions:
- issue: πάσῃ σαρκί의 의미 범위
  chosen_reading: ‘육체’는 죄된 본성이라기보다 죽을 수밖에 없는 인간 존재를 가리킵니다.
  alternative_readings:
  - ‘육신의 정욕’으로 이해
  - ‘죄성’으로 이해
  rationale: 지혜문학 문맥에서는 후대 바울서신의 신학적 용례를 끌어오지 않고, 인간의 유한성과 취약성을 경계하는 뜻으로 읽는 것이 타당합니다.
  doctrine_reference: 'DOCTRINE.md: σάρξ = flesh (literal) / sinful nature (metaphorical), context-dependent'
