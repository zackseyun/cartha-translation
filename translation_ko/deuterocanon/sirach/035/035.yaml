  timestamp: '2026-07-13T19:21:01Z'
review_pass:
  verdict: revise
  source_fidelity: 원문의 미래형 κάμψουσιν(‘굽힐 것이다’)을 살리려면 현재 연결형 ‘굽히며’보다 미래 표현이 필요합니다. στρέβλαι는 일반적인 ‘형틀’보다 고문을 위한 틀을 구체적으로 가리키므로 ‘고문틀’이 더 정확합니다. οἰκέτῃ κακούργῳ는 문맥상 ‘악한 노예’로 유지할 수 있습니다.
  naturalness: ‘멍에와 가죽끈은 목을 굽힐 것이며’는 표준어 현대 합쇼체 문장 안에서 자연스럽고, 뒤 절의 ‘있습니다’와도 잘 연결됩니다. ‘고문틀과 고문’은 다소 반복되지만 원문의 도구와 행위를 구별하는 병렬을 보존합니다.
  terminology: ‘멍에’, ‘가죽끈’, ‘노예’는 각각 ζυγός, ἱμάς, οἰκέτης에 적절합니다. ‘고문틀’은 στρέβλαι, ‘고문’은 βάσανοι에 대응합니다. 각주에서는 οἰκέτης의 가정 내 봉사자 의미 가능성을 ‘집안 하인’으로 명시합니다.
  issues:
  - severity: medium
    issue: ‘굽히며’가 κάμψουσιν의 미래형을 충분히 반영하지 못합니다.
    rationale: 그리스어는 미래 능동 직설법이므로, 한국어에서도 ‘굽힐 것입니다/굽힐 것이며’처럼 미래성을 나타내는 것이 원문 충실성에 더 가깝습니다.
  - severity: low
    issue: ‘형틀’은 στρέβλαι의 고문 도구라는 의미를 다소 넓게 만들 수 있습니다.
    rationale: στρέβλαι는 특히 고문용 신체 구속·비틀기 장치를 가리키므로 ‘고문틀’이 더 구체적입니다.
  revised_text: 멍에와 가죽끈은 목을 굽힐 것이며, 악한 노예에게는 고문틀과 고문이 있습니다.[a]
