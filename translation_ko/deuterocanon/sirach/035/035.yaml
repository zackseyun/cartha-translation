base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/035/035.yaml
  text: A yoke and a strap will bend the neck[a], and for a wicked slave there are racks and tortures.
  footnotes:
  - marker: a
    text: Or 'for a wicked servant, racks and tortures.' The Greek οἰκέτης can denote a household servant, but the coercive context here favors 'slave.'
    reason: lexical_alternative
translation:
  language: ko
  text: 멍에와 가죽끈이 목을 굽히며, 악한 노예에게는 형틀과 고문이 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘악한 종에게는 형틀과 고문이 있습니다.’ 그리스어 οἰκέτης는 집안 하인을 가리킬 수 있으나, 여기서는 강제적 처벌의 문맥이므로 ‘노예’가 더 적절합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ζυγός
  english_pob_choice: yoke
  chosen_korean: 멍에
  alternatives_korean:
  - 요
  - 멍에 장치
  lexicon: LSJ
  rationale: 목을 굽히게 하는 구체적 이미지이므로, 짐승의 멍에를 뜻하는 표준어 ‘멍에’가 가장 직접적입니다.
- source_word: ἱμὰς
  english_pob_choice: strap
  chosen_korean: 가죽끈
  alternatives_korean:
  - 끈
  - 띠
  - 채찍끈
  lexicon: LSJ
  rationale: 가죽으로 된 구속용 끈이라는 감각을 살리기 위해 ‘가죽끈’으로 옮겼습니다.
- source_word: οἰκέτῃ
  english_pob_choice: slave
  chosen_korean: 노예
  alternatives_korean:
  - 종
  - 하인
  - 집안종
  lexicon: LSJ
  rationale: 영문 POB가 bonded status를 드러내기 위해 ‘slave’를 택한 점을 따라, 강제성과 처벌의 문맥에서 ‘노예’가 더 정확합니다.
- source_word: στρέβλαι καὶ βάσανοι
  english_pob_choice: racks and tortures
  chosen_korean: 형틀과 고문
  alternatives_korean:
  - 고문대와 고문
  - 고문틀과 형벌
  lexicon: LSJ
  rationale: στρέβλαι는 고문용 형틀, βάσανοι는 고문/고통을 가리키므로, 현대 한국어에서 자연스러운 대응인 ‘형틀과 고문’으로 압축했습니다.
theological_decisions:
- issue: οἰκέτῃ의 계층적·강제적 뉘앙스
  chosen_reading: ‘노예’로 옮겨, 단순한 고용관계보다 구속·처벌의 강한 뉘앙스를 드러냈습니다.
  alternative_readings:
  - 종
  - 하인
  - 집안종
  rationale: 이 절은 물리적 구속과 형벌을 병렬로 말하므로, 완곡한 ‘종/하인’은 본문의 폭력을 약화시킬 수 있습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms table on δοῦλος; translation policy on servile terminology'
