lexical_decisions:
- source_word: ἔμβαλε
  english_pob_choice: Put
  chosen_korean: 투입하여
  alternatives_korean:
  - 넣어
  - 두어
  - 배치하여
  lexicon: LSJ
  rationale: 문맥상 단순한 ‘넣다’보다 사람을 어떤 일에 맡기거나 들여보내는 뜻이 살아 있는 ‘투입하다’가 명령의 힘과 목적을 잘 드러냅니다.
- source_word: αὐτὸν
  english_pob_choice: him
  chosen_korean: 그를
  alternatives_korean:
  - 그 사람을
  - 그 자를
  lexicon: Greek grammar
  rationale: 남성 단수 대명사를 자연스럽고 정확하게 옮겼습니다.
- source_word: εἰς ἐργασίαν
  english_pob_choice: to work
  chosen_korean: 일에
  alternatives_korean:
  - 노동에
  - 노역에
  - 일하도록
  lexicon: LSJ
  rationale: ἐργασία는 단순한 ‘일’보다 노동·일거리·직무의 폭을 가지므로, ‘일에’로 옮겨 동사 ‘투입하다’와 결합된 목적지를 자연스럽게 살렸습니다.
- source_word: μὴ ἀργῇ
  english_pob_choice: he may not be idle
  chosen_korean: 게으르지 않게
  alternatives_korean:
  - 놀지 않게
  - 한가하지 않게
  - 무위하지 않게
  lexicon: LSJ
  rationale: ἀργέω는 ‘게으르다’보다 ‘일을 하지 않고 빈둥거리다/게으르게 있다’는 상태를 가리키므로, 행위 부재의 결과를 한국어로 가장 자연스럽게 반영했습니다.
