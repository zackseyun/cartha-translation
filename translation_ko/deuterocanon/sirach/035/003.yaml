  text: Speak, elder, for it is fitting for you—yet with accurate knowledge, and do not hinder the music.[b][a]
  footnotes:
  - marker: a
    text: The primary Hebrew witness supplied here appears mismatched to this verse; the Greek parallel was therefore used as the main translation input, with the source uncertainty acknowledged.
    reason: textual_variant
  - marker: b
    text: Or 'do not interrupt the musical performance.' The Greek term can refer more broadly to musical proceedings, not only to music in the abstract.
    reason: lexical_alternative
translation:
  language: ko
  text: 어르신, 말씀하십시오. 그것이 어르신께 알맞은 일이니, 정확한 지식을 바탕으로 말씀하시고 음악을 방해하지 마십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 제공된 히브리어 증거본은 이 절과 불일치가 있는 것으로 표시되므로, 여기서는 그리스어 병행 본문을 주요 번역 근거로 사용했습니다.
    reason: textual_variant
  - marker: b
    text: 그리스어 μουσικά는 단순한 ‘음악’뿐 아니라 음악 진행이나 연주 전체를 가리킬 수 있습니다.
    reason: lexical_alternative
