  - 첫아들
  lexicon: HALOT
  rationale: 이스라엘을 하나님의 ‘첫 장자’로 부르는 언약적 표현을 한국어에서 가장 자연스럽게 드러내는 말로 옮겼습니다.
- source_word: קָנִיתָה
  english_pob_choice: whom you acquired
  chosen_korean: 당신께서 그들을 취하셨습니다
  alternatives_korean:
  - 당신께서 그들을 얻으셨습니다
  - 당신께서 그들을 사셨습니다
  - 당신께서 그들을 소유하셨습니다
  lexicon: HALOT
  rationale: 이 동사는 ‘얻다/사다/소유하다/창조하다’의 범위를 가질 수 있으므로, 한국어에서는 하나로 고정된 신학적 해석을 피하면서도 소유·획득의 뜻을 담는 ‘취하다’를 선택했습니다.
theological_decisions:
- issue: ‘주의 이름으로 불리는’의 언약적 의미
  chosen_reading: 단순한 호칭이 아니라 하나님께 속한 백성이라는 소속 표지로 유지했습니다.
  alternative_readings:
  - ‘주의 이름을 지닌’으로 풀어쓰기
  rationale: 본문의 관용구가 지닌 성경적·언약적 뉘앙스를 보존하는 것이 더 정확합니다.
  doctrine_reference: 'POB 원칙: 본문의 신학적 긴장을 평평하게 만들지 말고, 원문의 표현력을 유지한다.'
- issue: קנה의 의미 범위
  chosen_reading: ‘취하셨습니다’로 중립적으로 옮겼습니다.
  alternative_readings:
  - ‘창조하셨습니다’
  - ‘사셨습니다’
  - ‘소유하셨습니다’
  rationale: 히브리어 동사의 다의성을 한 가지 교리적 의미로 확정하지 않고, 문맥에 맞는 언약적 획득을 드러내기 위함입니다.
  doctrine_reference: '원어 우선 원칙: 본문이 명시하지 않은 교리적 결론을 번역에 주입하지 않습니다.'
