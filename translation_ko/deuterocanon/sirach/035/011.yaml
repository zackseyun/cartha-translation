  lexicon: HALOT
  rationale: 예루살렘을 가리키는 시적 문맥에서 현대 한국어로 가장 자연스러운 일반 명사인 ‘도시’를 택했습니다.
- source_word: קדשך
  english_pob_choice: your holiness
  chosen_korean: 당신의 거룩
  alternatives_korean:
  - 당신의 거룩하심
  - 당신의 성소
  - 당신의 거룩한 도시
  lexicon: HALOT
  rationale: 직역된 소유격 표현을 보존하여, ‘거룩함/거룩하심’이라는 추상적 성격을 유지했습니다. 영어 POB의 문구처럼 해석을 과도하게 구체화하지 않았습니다.
- source_word: מכון שבתך
  english_pob_choice: the place established for your dwelling
  chosen_korean: 당신의 거처를 세우신 곳
  alternatives_korean:
  - 당신의 거처로 정하신 곳
  - 당신이 거하실 곳
  - 당신의 거주처를 마련하신 곳
  lexicon: HALOT
  rationale: מכון의 ‘세워진/정해진 곳’과 שבתך의 ‘거처’를 함께 살리기 위해, ‘거처를 세우신 곳’으로 옮겨 두 요소를 분리해 보존했습니다.
theological_decisions:
- issue: קדשך의 신학적 뉘앙스
  chosen_reading: ‘당신의 거룩’으로 옮겨, 예루살렘과 성소의 거룩성이 압축된 표현임을 그대로 드러냈습니다.
  alternative_readings:
  - 당신의 성소
  - 당신의 거룩한 도시
  - 당신의 성역
  rationale: 히브리어는 ‘거룩/거룩함’의 추상적 소유격을 사용하므로, 이를 ‘성소’로 풀어버리면 장소화된 해석이 앞서게 됩니다. 본문의 긴장을 유지하기 위해 보다 직접적인 표현을 택했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
- issue: 히브리어 본문 우선과 그리스어 병행본문의 처리
  chosen_reading: 히브리어 본문을 따라 예루살렘을 위한 자비의 기도로 번역하고, 그리스어 병행본의 상이한 내용은 본문 밖에서 변이로 취급합니다.
  alternative_readings:
  - 그리스어 병행본문을 따라 번역하기
  - 히브리어와 그리스어를 절충하여 합성하기
  rationale: 보존된 히브리어가 이 절의 주 본문이므로, 전혀 다른 내용의 그리스어를 본문에 섞지 않고 변이로 남기는 것이 투명성과 स्रोत 충실성에 부합합니다.
  doctrine_reference: 'PHILOSOPHY.md: Hebrew where it survives; transparency principle'
