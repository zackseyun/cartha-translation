  text: Give the recompense of those who wait for you[b][a], and let your prophets be found faithful.
  footnotes:
  - marker: a
    text: Or, 'those who hope in you.' The Hebrew verb can carry both waiting and hoping.
    reason: lexical_alternative
  - marker: b
    text: 'The Greek witness reads quite differently here, with the sense: ''He who fears the Lord will receive instruction, and those who rise early will find favor.'' This likely reflects a different textual form.'
    reason: alternative_reading
translation:
  language: ko
  text: 당신을 기다리는 이들에게[a] 보상을 주시고, 당신의 예언자들이 신실한 이들로 드러나게 하십시오.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신에게 희망을 두는 이들’. 히브리어 동사는 ‘기다리다’와 ‘희망하다’의 뜻을 함께 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어 증거는 여기서 상당히 다르게 읽습니다. 대략 ‘주님을 두려워하는 사람은 훈계를 받을 것이며, 일찍 일어나는 이들은 호의를 얻을 것이다’라는 뜻입니다. 이는 다른 본문 형식을 반영한 것으로 보입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: תן
  english_pob_choice: Give
  chosen_korean: 주시고
  alternatives_korean:
  - 주십시오
  - 베푸시고
  - 내리시고
  lexicon: BDB/HALOT
  rationale: 하나님께 드리는 직접적 간구로 보아, 명령형의 청유를 부드럽고 공손하게 한국어로 옮겼습니다.
- source_word: פעלת
  english_pob_choice: the recompense / the reward
  chosen_korean: 그 보상
  alternatives_korean:
  - 그 보답
  - 그 상
  - 그 갚음
  lexicon: HALOT
  rationale: 문맥상 하나님께서 기다리는 이들에게 주시는 보상/응답의 뜻이므로, 의미를 지나치게 좁히지 않는 ‘보상’이 가장 자연스럽습니다.
- source_word: קוויך
  english_pob_choice: those who wait for you
  chosen_korean: 당신을 기다리는 이들
  alternatives_korean:
  - 당신을 바라는 이들
  - 당신을 희망하는 이들
  - 당신을 기다려 온 이들
  lexicon: HALOT
  rationale: קוה의 ‘기다리다’와 ‘희망하다’의 중첩을 살리되, 본문 흐름에 맞게 기대와 신뢰를 함께 담는 표현으로 옮겼습니다.
- source_word: ונביאיך
  english_pob_choice: and your prophets
  chosen_korean: 당신의 예언자들이
  alternatives_korean:
  - 당신의 예언자들
  - 당신의 선지자들이
  - 당신의 선견자들이
  lexicon: HALOT
  rationale: 직역성을 유지하면서도 한국어 성경에서 흔한 ‘선지자’보다 원어의 기능을 더 직접적으로 드러내는 ‘예언자’로 옮겼습니다.
- source_word: יאמנו
  english_pob_choice: be found faithful
  chosen_korean: 신실함이 드러나게 하십시오
  alternatives_korean:
  - 신실하다고 드러나게 하십시오
  - 믿을 만한 존재로 드러나게 하십시오
  - 참되게 드러나게 하십시오
  lexicon: HALOT
  rationale: אמן의 핵심인 신뢰성/확증의 의미를 살리면서, 단순한 ‘믿어지다’보다 문맥에 맞는 ‘신실함이 드러나다’로 옮겼습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 평행문의 큰 차이
  chosen_reading: 히브리어 청원을 본문으로 따라 ‘당신을 기다리는 이들’과 ‘당신의 예언자들’의 문맥을 유지했습니다.
  alternative_readings:
  - 그리스어에 따라 ‘주님을 두려워하는 사람은 훈계를 받는다…’로 옮기는 방식
  rationale: 시락의 현존 히브리어가 보존된 경우에는 히브리어를 우선해야 하므로, 그리스어는 대조 증거로만 반영했습니다.
  doctrine_reference: 'PHILOSOPHY.md: 시락은 보존된 히브리어를 우선하고, 그리스어 평행문은 대조 검증에 사용'
- issue: יאמנו의 의미
  chosen_reading: ‘신실함이 드러나게 하십시오’로 옮겨 예언자들의 신뢰성과 입증의 뉘앙스를 함께 살렸습니다.
  alternative_readings:
  - ‘참되게 하십시오’
  - ‘믿을 만하게 하십시오’
  - ‘확증되게 하십시오’
  rationale: 이 동사는 단순한 감정적 ‘믿음’보다 검증된 신뢰성의 의미를 포함하므로, 예언자들의 말과 삶이 참됨으로 입증되는 흐름을 드러내는 번역이 적절합니다.
  doctrine_reference: 시락 35:14의 히브리어 어휘 의미
