  naturalness: 초안의 ‘당신의 예언자들이 신실함이 드러나게’는 주어 ‘예언자들이’와 서술 명사구 ‘신실함이’의 결합이 문법적으로 부자연스럽습니다. ‘신실한 이들로 드러나게’로 고치면 현대 표준 한국어와 합쇼체 기도 문체에 자연스럽습니다. 각주 표지도 해당 어구와 이문(異文) 전체에 각각 붙여 범위를 분명히 했습니다.
