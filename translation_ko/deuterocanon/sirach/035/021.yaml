base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/035/021.yaml
  text: A devious heart causes grief[b][a], and an experienced man will repay him in kind.
  footnotes:
  - marker: a
    text: The final clause is difficult. Hebrew literally reads something like, 'and a seasoned man will return/answer it in/with him/it.' Possible senses include 'will answer it in kind' or 'will repay him accordingly.' The Greek parallel for this verse differs substantially, indicating a likely variant Vorlage or textual corruption.
    reason: alternative_reading
  - marker: b
    text: The Greek parallel in Swete reads, 'Do not trust in a road without stumbling,' which does not closely match the surviving Hebrew here.
    reason: textual_variant
translation:
  language: ko
  text: 간사한 마음은 슬픔을 일으키고, 경험 많은 사람은 그것에 그만큼 되갚습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 마지막 절은 매우 압축적이어서 ‘되갚습니다/응답합니다/보답합니다’처럼 여러 방식으로 옮길 수 있습니다. 영어 POB도 ‘in kind’로 처리하며 해석의 여지를 남깁니다.
    reason: alternative_reading
  - marker: b
    text: ‘경험 많은 사람’은 히브리어 ותיק의 ‘노련함, 숙련됨, 오랜 단련됨’을 풀어 옮긴 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לב עקוב
  english_pob_choice: devious heart
  chosen_korean: 간사한 마음
  alternatives_korean:
  - 뒤틀린 마음
  - 비뚤어진 마음
  - 사악한 마음
  lexicon: HALOT
  rationale: לב는 지혜문학에서 내면 전체를 가리키며, עקוב은 문자적으로 ‘굽은/뒤틀린’ 성격을 뜻하므로 한국어에서는 도덕적 왜곡을 자연스럽게 드러내는 ‘간사한 마음’으로 옮겼습니다.
- source_word: יתן עצבת
  english_pob_choice: brings grief / causes grief
  chosen_korean: 슬픔을 일으키고
  alternatives_korean:
  - 슬픔을 가져오고
  - 슬픔을 줍고
  - 근심을 낳고
  lexicon: HALOT
  rationale: יתן은 직역하면 ‘준다’이지만 여기서는 원인을 만들어 내는 관용법이므로, 한국어에서는 인과를 분명히 하는 ‘일으키고’로 풀었습니다.
- source_word: ואיש ותיק
  english_pob_choice: and an experienced man
  chosen_korean: 경험 많은 사람
  alternatives_korean:
  - 노련한 사람
  - 숙련된 사람
  - 연륜 있는 사람
  lexicon: HALOT
  rationale: ותיק은 ‘시험을 거친, 경험 있는, 성숙한’ 사람을 뜻하므로, 현대 문체에서 가장 자연스럽고 의미가 넓게 살아나는 ‘경험 많은 사람’을 택했습니다.
- source_word: ישיבנה בו
  english_pob_choice: will answer it in kind
  chosen_korean: 그것에 그만큼 되갚습니다
  alternatives_korean:
  - 그것에 맞게 되돌려줍니다
  - 그에게 그에 상응하게 갚습니다
  - 그것에 응답합니다
  lexicon: HALOT
  rationale: 마지막 절은 히브리어가 매우 간결하고 난해하므로, 동등하게 대응해 갚는다는 재귀적 의미를 살려 ‘그만큼 되갚습니다’로 옮겼습니다. ‘그것에’는 앞선 슬픔/상황을 받는 지시를 보존합니다.
theological_decisions:
- issue: 마지막 절의 난해한 대명사·전치사 구조 처리
  chosen_reading: 경험 많은 사람이 그 상황에 상응하게 되갚는다는 뜻으로 자연스럽게 풀었습니다.
  alternative_readings:
  - 그것에 대하여 응답합니다
  - 그를 상대로 되갚습니다
  - 그에 맞게 보답합니다
  rationale: 히브리어는 매우 압축적이며, 영어 POB도 'in kind'로 해석을 열어 두고 있습니다. 본문은 텍스트의 불확실성을 지우지 않되, 한국어 독자가 지혜 격언으로 이해할 수 있도록 상응성의 의미를 전면에 드러냈습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 3
- issue: 남성 단수 איש의 표현 유지
  chosen_reading: 사람
  alternative_readings:
  - 인간
  - 남자
  rationale: 본문의 문맥상 격언 일반을 가리키지만, 한국어에서는 성별을 과도하게 부각하지 않으면서도 문장 성격을 유지하는 ‘사람’이 가장 적절합니다. 이는 히브리어의 남성형을 무시하기보다 관용적 일반화로 옮긴 것입니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
