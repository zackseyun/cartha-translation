  terminology: נכה와 מכה를 모두 ‘타격’으로 옮겨 반복을 보존했습니다. תאכל חיה의 매우 불확실한 구문은 영어 POB의 의미 번역인 ‘낫게 하다’를 따르되, 본문 난해성과 그리스어 이문은 각주에서 계속 밝혔습니다.
