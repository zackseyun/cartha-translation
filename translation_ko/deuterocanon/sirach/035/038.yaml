  yaml_path: translation/deuterocanon/sirach/035/038.yaml
  text: Assign him work as is fitting for him; and if he does not obey[a], make his fetters heavy. But do not be excessive with any flesh, and do nothing without judgment.
  footnotes:
  - marker: a
    text: 'Or ''with anyone'' / ''toward any person.'' Greek: ''with any flesh.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그에게 맞는 일로 맡기십시오. 그가 순종하지 않으면, 그의 발목 사슬을 무겁게 하십시오. 그러나 어떤 육체에게도 지나치게 하지 말고, 판단 없이 아무것도 하지 마십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘어떤 사람에게도’ / ‘어느 누구에게도’. 그리스어는 ‘어떤 육체에게도’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς ἔργα κατάστησον
  english_pob_choice: Assign him work
  chosen_korean: 그에게 맞는 일로 맡기십시오
  alternatives_korean:
  - 그에게 일을 배정하십시오
  - 그를 일에 세우십시오
  - 그에게 작업을 맡기십시오
  lexicon: LSJ
  rationale: κατάστησον은 사람을 어떤 역할이나 일에 두는 뜻이므로, 한국어에서는 자연스럽게 ‘맡기다’로 풀어 직무 배정의 뉘앙스를 살렸습니다.
- source_word: καθὼς πρέπει αὐτῷ
  english_pob_choice: as is fitting for him
  chosen_korean: 그에게 맞는
  alternatives_korean:
  - 그에게 합당한
  - 그에게 어울리는
  - 그에게 알맞은
  lexicon: LSJ
  rationale: πρέπει는 단순 가능이 아니라 적합성과 마땅함을 가리키므로, ‘맞는’으로 간결하게 옮겨 품위와 적절성의 뜻을 유지했습니다.
- source_word: πειθαρχῇ
  english_pob_choice: does not obey
  chosen_korean: 순종하지 않으면
  alternatives_korean:
  - 복종하지 않으면
  - 따르지 않으면
  - 말을 듣지 않으면
  lexicon: LSJ
  rationale: πειθαρχέω는 권위나 규율에 대한 순종을 뜻하므로, POB의 수정 반영에 맞추어 일반적 ‘순종하지 않다’로 번역했습니다.
- source_word: βάρυνον τὰς πέδας αὐτοῦ
  english_pob_choice: make his fetters heavy
  chosen_korean: 그의 발목 사슬을 무겁게 하십시오
  alternatives_korean:
  - 그의 족쇄를 더 무겁게 하십시오
  - 그의 사슬을 무겁게 하십시오
  - 그의 결박을 무겁게 하십시오
  lexicon: LSJ
  rationale: πέδαι는 발에 채우는 족쇄/사슬을 가리키므로, 한국어에서도 구체성을 살려 ‘발목 사슬’로 옮겼습니다.
- source_word: ἐν πάσῃ σαρκί
  english_pob_choice: with any flesh
  chosen_korean: 어떤 육체에게도
  alternatives_korean:
  - 어떤 사람에게도
  - 아무 육체에게도
  - 어느 누구에게도
  lexicon: LSJ
  rationale: σάρξ를 문자적으로 ‘육체’로 유지해 본문의 물질적·인간적 어감을 살리되, 한국어 문맥상 대상 의미가 드러나도록 ‘에게도’를 보탰습니다.
- source_word: ἄνευ κρίσεως
  english_pob_choice: without judgment
  chosen_korean: 판단 없이
  alternatives_korean:
  - 분별 없이
  - 재판 없이
  - 심사 없이
  lexicon: LSJ
  rationale: κρίσις는 여기서 분별과 판단의 행위를 폭넓게 가리키므로, 간결한 경고 표현인 ‘판단 없이’가 가장 자연스럽습니다.
theological_decisions:
- issue: σάρξ의 번역을 추상화할지 여부
  chosen_reading: ‘육체’로 직역하되 한국어 조사로 대상성을 보완했습니다.
  alternative_readings:
  - 사람
  - 누구
  - 인간
  rationale: 이 절은 지혜문학적 훈계로서 σάρξ를 보통 사람들을 가리키는 말로 쓰지만, 본문이 요구하지 않는 한 추상화하지 않고 구체어를 유지하는 편이 source-direct합니다.
  doctrine_reference: POB term policy on σάρξ
- issue: ‘순종’의 적용 범위
  chosen_reading: 권위에 대한 순종으로 읽고 한국어에서 일반적인 도덕적 권면으로 전달했습니다.
  alternative_readings:
  - 규율을 지키지 않으면
  - 명령을 따르지 않으면
  - 복종하지 않으면
  rationale: πειθαρχέω는 단순한 ‘듣다’가 아니라 권위에 대한 순응을 뜻하므로, 지나친 해석 없이도 징계 맥락이 드러나도록 번역했습니다.
  doctrine_reference: LSJ semantic range of πειθαρχέω
