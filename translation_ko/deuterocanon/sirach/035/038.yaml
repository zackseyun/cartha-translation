    text: 또는 ‘어떤 육체에게도’. 그리스어는 직역하면 ‘모든 육체 안에서/에게’입니다.
    reason: lexical_alternative
  revision_rationale: The revision corrects the task-assignment syntax, uses the standard concrete term ‘족쇄,’ and renders σάρξ according to its contextual human referent in natural Korean. The footnote preserves the literal ‘flesh’ expression and its interpretive ambiguity. The imperatives and the source’s restraint against excess remain intact.
