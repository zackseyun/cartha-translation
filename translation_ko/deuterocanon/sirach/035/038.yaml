review_pass:
  verdict: revise
  source_fidelity: 'The draft correctly reflects the imperative sequence, the conditional clause, the fetters, and the final warning against acting without judgment. However, ‘그에게 맞는 일로 맡기십시오’ is grammatically and semantically awkward: it sounds as though one entrusts something ‘by means of’ suitable work. The Greek directs that the person be assigned work fitting for him. Also, ἐν πάσῃ σαρκί is a Semitic/Greek idiom for dealing with any human person; a literal Korean ‘어떤 육체에게도’ is not idiomatic and obscures the admonition. Rendering it as ‘어떤 사람에게도’ communicates the source sense, while a note preserves the literal wording.'
  naturalness: ‘그에게 알맞은 일을 맡기십시오’ is natural modern formal Korean. ‘그의 족쇄를 무겁게 하십시오’ is both idiomatic and suitably concrete. ‘어떤 사람에게도 지나치게 대하지 마십시오’ gives Korean readers a clear object and action where the current wording is unnatural.
  terminology: ‘순종하다,’ ‘족쇄,’ and ‘판단 없이’ are appropriate. The Greek σάρξ is retained in the footnote as ‘육체,’ but its contextual referent is translated as ‘사람’ in the main text to avoid an unnatural, misleading literalism.
  issues:
  - severity: medium
    issue: ‘그에게 맞는 일로 맡기십시오’ is an awkward and inaccurate Korean construction.
    rationale: The particle ‘로’ gives an instrumental sense, while the Greek means to assign/set the person to tasks. ‘그에게 알맞은 일을 맡기십시오’ directly expresses the intended assignment.
  - severity: medium
    issue: ‘어떤 육체에게도 지나치게 하지 말고’ is not natural Korean and leaves the action of ‘being excessive’ unclear.
    rationale: In this context σάρξ denotes a human being/person. Korean requires an explicit relational verb for a comprehensible admonition; ‘어떤 사람에게도 지나치게 대하지 마십시오’ preserves the warning without adding a specific form of mistreatment.
  - severity: low
    issue: ‘발목 사슬’ is understandable but less standard than ‘족쇄.’
    rationale: πέδαι specifically denotes foot-fetters/shackles. ‘족쇄’ is the conventional Korean term and maintains the concrete meaning.
  revised_text: 그에게 알맞은 일을 맡기십시오. 그가 순종하지 않으면 그의 족쇄를 무겁게 하십시오. 그러나 어떤 사람에게도 지나치게 대하지 말고, 판단 없이 아무것도 하지 마십시오.[a]
