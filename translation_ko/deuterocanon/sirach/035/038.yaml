  rationale: The revision corrects the task-assignment syntax, uses the standard concrete term ‘족쇄,’ and renders σάρξ according to its contextual human referent in natural Korean. The footnote preserves the literal ‘flesh’ expression and its interpretive ambiguity. The imperatives and the source’s restraint against excess remain intact.
