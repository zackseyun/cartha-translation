  text: For idleness has taught much evil[a].
  footnotes:
  - marker: a
    text: Or 'For laziness has taught much evil.' The Greek ἀργία can denote idleness, laziness, or inactivity; 'idleness' was chosen as the broadest and most natural fit in this wisdom context.
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 게으름이 많은 악을 가르쳐 왔기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘나태’. 그리스어 ἀργία는 게으름, 나태, 또는 무위 상태를 가리킬 수 있습니다. 여기서는 지혜문학 문맥에 가장 자연스러운 ‘게으름’으로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλὴν
  english_pob_choice: much
  chosen_korean: 많은
  alternatives_korean:
  - 큰
  - 수많은
  lexicon: LSJ
  rationale: 추상명사 κακίαν을 수식하므로 수량보다 정도를 나타내는 ‘많은’이 자연스럽고, 잠언적 진술의 강도도 잘 살립니다.
- source_word: γὰρ
  english_pob_choice: for
  chosen_korean: 실로
  alternatives_korean:
  - 왜냐하면
  - 그리고
  lexicon: LSJ
  rationale: 앞 문맥의 설명·근거를 잇는 연결어로서, 한국어에서는 문장 앞의 ‘실로’가 간결하게 원인 제시의 힘을 살립니다.
- source_word: κακίαν
  english_pob_choice: evil
  chosen_korean: 악
  alternatives_korean:
  - 악행
  - 사악함
  - 죄악
  lexicon: LSJ
  rationale: κακία는 넓은 도덕적 악을 가리키므로, 특정 행위로 좁히는 ‘악행’보다 포괄적인 ‘악’이 원문 의미를 더 직접적으로 옮깁니다.
- source_word: ἡ ἀργία
  english_pob_choice: idleness
  chosen_korean: 게으름
  alternatives_korean:
  - 태만
  - 나태
  - 무위
  lexicon: LSJ
  rationale: 영어 POB의 ‘idleness’에 대응하면서도 한국어 잠언 문맥에서 자연스러운 표준어로 ‘게으름’을 선택했습니다. ‘태만’은 책임 회피의 뉘앙스가 더 강하고, ‘나태’는 다소 문어적입니다.
theological_decisions:
- issue: 잠언적 일반 진술의 어조
  chosen_reading: 과거형 ἐδίδαξεν을 한국어 현재 일반 진술로 옮겨, 보편적 지혜 진술의 성격을 드러냈습니다.
  alternative_readings:
  - ‘가르쳤습니다’처럼 과거 완료형 느낌을 살리는 번역
  rationale: 원문은 특정 한 사건보다 관찰된 보편 진리를 말하는 잠언식 표현이므로, 한국어에서도 현재적 진술이 의미를 더 분명하게 전달합니다.
  doctrine_reference: 지혜문학의 일반화된 교훈 문맥
