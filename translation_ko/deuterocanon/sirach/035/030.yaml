base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/035/030.yaml
  text: For it is better that your children should beg from you than that you should look to the hands of your sons[a][b].
  footnotes:
  - marker: a
    text: Or 'ask from you' rather than 'beg from you'; the Greek verb can denote earnest petition more generally.
    reason: lexical_alternative
  - marker: b
    text: Literally 'look to the hands of your sons,' an image of depending on them for support.
    reason: lexical_alternative
translation:
  language: ko
  text: 자녀들이 너에게 구걸하는 것이, 네가 네 아들들의 손을 바라보는 것보다 낫습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: δεηθῆναί는 여기서 단순한 ‘청하다’보다 더 절박한 부탁이나 구걸의 뉘앙스를 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘아들들의 손을 바라보다’는 문자적으로는 손을 향해 시선을 두는 그림이지만, 실제로는 그들에게서 생계를 기대하는 의존의 이미지를 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: κρεῖσσον
  english_pob_choice: better
  chosen_korean: 낫습니다
  alternatives_korean:
  - 더 좋습니다
  - 더 낫습니다
  - 우월합니다
  lexicon: LSJ
  rationale: 비교급 판단을 자연스러운 현대 한국어로 옮기되, 지혜문학의 가치 판단을 분명하게 드러내기 위해 ‘낫습니다’를 택했습니다.
- source_word: τέκνα
  english_pob_choice: children
  chosen_korean: 자녀들
  alternatives_korean:
  - 아이들
  - 자식들
  - 아들들
  lexicon: LSJ
  rationale: 뒤의 υἱῶν과 구분되는 더 넓은 범주의 말이므로, 성별을 특정하지 않는 ‘자녀들’로 옮겨 원문의 대비를 살렸습니다.
- source_word: δεηθῆναί
  english_pob_choice: should beg
  chosen_korean: 구걸하는 것이
  alternatives_korean:
  - 간청하는 것이
  - 청하는 것이
  - 간절히 구하는 것이
  lexicon: LSJ
  rationale: 문맥상 가난과 의존을 전제로 한 절박한 청원을 나타내므로, 강한 의존성을 드러내는 ‘구걸하는 것이’를 택했습니다.
- source_word: ἐμβλέπειν εἰς χεῖρας υἱῶν
  english_pob_choice: look to the hands of your sons
  chosen_korean: 네가 네 아들들의 손을 바라보는 것
  alternatives_korean:
  - 네 아들들의 손에 의지하는 것
  - 네 아들들의 손을 바라보는 것
  - 네 아들들에게서 도움을 기대하는 것
  lexicon: LSJ
  rationale: 직역에 가까운 손의 이미지를 보존해 원문의 구체성을 살렸습니다. 한국어에서는 ‘바라보다’가 단순 응시와 기대를 함께 담아, 손을 통해 생계를 기대하는 함의를 유지합니다.
theological_decisions:
- issue: τέκνα와 υἱῶν의 범주 차이 보존
  chosen_reading: 앞의 ‘자녀들’과 뒤의 ‘아들들’을 구분해 번역했습니다.
  alternative_readings:
  - 둘 다 ‘자녀들’로 통일
  - 둘 다 ‘아들들’로 통일
  rationale: 그리스어는 더 넓은 τέκνα와 더 좁은 υἱῶν을 의도적으로 병치하므로, 한국어에서도 그 차이를 드러내는 편이 원문 이해에 더 충실합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4–5
