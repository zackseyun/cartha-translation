  text: Stir up anger and pour out wrath[a]; humble the foe and drive back the enemy.
  footnotes:
  - marker: a
    text: The Greek parallel in Swete differs sharply here and reads a line about an emerald seal in gold workmanship and music with pleasant wine. The Hebrew witness is well attested in the Cairo Geniza tradition and is followed here as the primary source for this verse.
    reason: textual_variant
translation:
  language: ko
  text: 분노를 일으키고 진노를 쏟아내며, 원수를 낮추고 적을 물리치십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 칠십인역 그리스어 평행본문은 여기서 ‘금 세공의 에메랄드 인장, 그리고 달콤한 술 위의 음악의 곡조’로 크게 다르게 읽습니다. 본문은 카이로 게니자 계열의 히브리어 증거를 따릅니다.
    reason: textual_variant
lexical_decisions:
- source_word: העיר אף
  english_pob_choice: Stir up anger
  chosen_korean: 분노를 일으키고
  alternatives_korean:
  - 노를 일으키고
  - 분노를 자극하고
  lexicon: HALOT
  rationale: עיר의 사역적 의미를 살려 ‘일으키다’로 옮기고, אף는 문자적 ‘코’보다 관용적 의미인 분노로 풀어 자연스럽게 표현했습니다.
- source_word: ושפוך חמה
  english_pob_choice: and pour out wrath
  chosen_korean: 진노를 쏟아내며
  alternatives_korean:
  - 분노를 쏟아내며
  - 격노를 퍼부으며
  lexicon: HALOT
  rationale: שפוך의 구체적 이미지인 ‘쏟다’를 유지했고, חמה는 משפט/심판 맥락에서 ‘진노’가 한국어에서 가장 응축된 대응입니다.
- source_word: והכניע צר
  english_pob_choice: humble the foe
  chosen_korean: 원수를 낮추고
  alternatives_korean:
  - 대적을 낮추고
  - 적대자를 굴복시키고
  lexicon: HALOT
  rationale: כנע의 핵심인 ‘낮추다/굴복시키다’ 가운데, 평행법상 앞의 감정 동사와 뒤의 군사적 동사를 연결하는 가장 직결된 표현으로 ‘낮추다’를 택했습니다.
- source_word: והדוף אויב
  english_pob_choice: and drive back the enemy
  chosen_korean: 적을 물리치십시오
  alternatives_korean:
  - 적을 밀어내십시오
  - 원수를 몰아내십시오
  lexicon: HALOT
  rationale: הדף는 ‘밀쳐내다, 몰아내다’의 물리적 동작을 가지므로, 현대 한국어에서 그 힘을 잘 드러내는 ‘물리치다’로 옮겼습니다.
theological_decisions:
- issue: 직접 청원형 명령문의 수신자
  chosen_reading: 문장에 주어를 덧붙이지 않고, 하나님께 드리는 직접 청원으로 이해되도록 명령형을 유지했습니다.
  alternative_readings:
  - 일반적 권면문으로 읽기
  rationale: 히브리어는 주어가 생략된 명령문들이며, 문맥상 기도/청원의 어조이므로 한국어에서도 청원형 명령으로 보존하는 것이 원문 긴장을 가장 잘 살립니다.
  doctrine_reference: 본문이 드러내는 기도적 명령의 형식을 보존
