  naturalness: 초안의 의미는 자연스럽지만, ‘…일으키고 …쏟아내며’에서 마지막 ‘물리치십시오’로 끝나는 방식은 기도 청원형의 높임이 앞선 동사들에 충분히 표지되지 않습니다. ‘대적’과 ‘원수’는 이 평행법에서 자연스럽고 성서 한국어에서도 널리 쓰입니다.
