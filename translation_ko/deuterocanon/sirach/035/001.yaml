  text: If they made you a leader, do not exalt yourself; be among them as one of them.[a]
  footnotes:
  - marker: a
    text: The supplied Hebrew witness for this reference reads, 'Save us, God of all, and put your fear upon all the nations.' Because that wording does not match the Greek verse attached to Sirach 35:1, the main translation follows the Greek here and notes the mismatch openly.
    reason: textual_variant
translation:
  language: ko
  text: 사람들이 당신을 지도자로 세웠다면, 자신을 높이지 마십시오. 그들 가운데서 그들 중 한 사람처럼 지내십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 제시된 히브리어 전승은 이 절을 ‘만유의 하나님이여, 우리를 구원하소서. 모든 민족 위에 주님을 두려워하는 마음을 두소서’라는 다른 문장으로 전합니다. 이 표현은 이 절에 해당하는 그리스어 본문과 일치하지 않으므로, 본문은 그리스어를 따르되 그 차이를 밝혔습니다.
    reason: textual_variant
lexical_decisions:
- source_word: Ἡγούμενόν
  english_pob_choice: leader
  chosen_korean: 지도자
  alternatives_korean:
  - 인도자
  - 통치자
  - 우두머리
  lexicon: BDAG
  rationale: 그리스어 ἡγούμενος는 앞서 이끄는 사람, 책임지는 사람의 뜻이므로 현대 한국어에서 역할을 자연스럽게 드러내는 ‘지도자’가 가장 무난합니다.
- source_word: κατέστησαν
  english_pob_choice: they made
  chosen_korean: 세웠거든
  alternatives_korean:
  - 임명했거든
  - 정해 주었거든
  - 만들어 주었거든
  lexicon: BDAG
  rationale: 임명·설정의 의미를 살리되, 한국어에서는 직책 부여를 자연스럽게 나타내는 ‘세우다’가 합쇼체 권고문에 가장 읽기 좋습니다.
- source_word: μὴ ἐπαίρου
  english_pob_choice: do not exalt yourself
  chosen_korean: 스스로를 높이지 마십시오
  alternatives_korean:
  - 교만해지지 마십시오
  - 자기를 높이지 마십시오
  - 우쭐대지 마십시오
  lexicon: BDAG
  rationale: 자기 고양의 비유를 유지하면서도 현대 독자가 바로 이해할 수 있도록 ‘스스로를 높이다’로 옮겼습니다.
- source_word: ὡς εἷς ἐξ αὐτῶν
  english_pob_choice: as one of them
  chosen_korean: 그들 중 한 사람처럼
  alternatives_korean:
  - 그들 가운데 한 사람처럼
  - 그들 중 하나처럼
  - 그들과 같은 한 사람처럼
  lexicon: BDAG
  rationale: 연대와 겸손의 비교를 살리기 위해 ‘그들 중 한 사람처럼’으로 옮겼고, 뒤의 ‘그들 가운데에서’와 함께 중복되지만 뜻의 강도를 분명히 했습니다.
theological_decisions:
- issue: 사본 전승 불일치 처리
  chosen_reading: 히브리어 본문은 완전히 다른 문장을 전하지만, 본문 번호에 해당하는 그리스어 병행문을 본문으로 번역하고 히브리어 불일치를 각주로 밝혔다.
  alternative_readings:
  - 히브리어를 따라 ‘우리를 구원하소서, 만유의 하나님이여, 주의 두려움을 모든 민족 위에 두소서’로 번역
  rationale: 이 절은 제시된 히브리어와 그리스어가 서로 다른 문장이므로, 절 번호와 문맥이 맞는 그리스어를 본문으로 삼되 히브리어 전승 차이는 숨기지 않는 것이 원문 충실성에 가장 적합합니다.
  doctrine_reference: PHILOSOPHY.md의 원어 우선 및 전승 차이의 투명한 문서화 원칙
