  text: And all the ends of the earth will know that you are the eternal God[a][b].
  footnotes:
  - marker: a
    text: 'Greek tradition reads: ''Those who fear the Lord will find judgment, and they will kindle righteous deeds like light.'' The Hebrew witness here preserves a substantially different line.'
    reason: textual_variant
  - marker: b
    text: Or 'the eternal God' / 'the everlasting God.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 땅의 모든 끝이 당신께서 영원하신 하나님이심을 알게 될 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '헬라어 전승은 이렇게 읽습니다: “주님을 경외하는 이들은 심판을 얻고, 의로운 행실을 빛처럼 밝힐 것입니다.” 히브리어 증인은 여기서 상당히 다른 행을 보존합니다.'
    reason: textual_variant
  - marker: b
    text: 또는 “영원하신 하나님” / “영원한 하나님”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וידעו
  english_pob_choice: will know
  chosen_korean: 알게 될 것입니다
  alternatives_korean:
  - 알 것입니다
  - 알게 되리라
  lexicon: HALOT
  rationale: 완료형에 와우가 붙은 예언적 진술로 이해하여 미래 결과를 나타내는 표현으로 옮겼습니다. 합쇼체 문맥에 맞게 자연스럽게 구성했습니다.
- source_word: כל אפסי ארץ
  english_pob_choice: all the ends of the earth
  chosen_korean: 땅의 모든 끝
  alternatives_korean:
  - 땅 끝마다
  - 온 세상의 끝
  lexicon: HALOT
  rationale: 히브리어 관용구의 의미를 살리되, 한국어에서는 더 간결하고 자연스러운 ‘땅의 모든 끝’으로 옮겼습니다.
- source_word: אלהי עולם
  english_pob_choice: the eternal God
  chosen_korean: 영원하신 하나님
  alternatives_korean:
  - 영원의 하나님
  - 영원한 하나님
  lexicon: HALOT
  rationale: 직역하면 ‘영원의 하나님’이지만, 한국어에서 의미가 분명하고 경건한 문체에 맞는 ‘영원하신 하나님’으로 옮겨 עולם의 지속성을 살렸습니다.
- source_word: אתה
  english_pob_choice: you are
  chosen_korean: 당신께서 …이심을
  alternatives_korean:
  - 주께서 …이심을
  - 당신은 …이심을
  lexicon: HALOT
  rationale: 히브리어의 명시적 주어를 드러내기 위해 주어를 살렸고, 신을 향한 직접 진술이므로 존대 표현을 사용했습니다.
theological_decisions:
- issue: 히브리어 본문을 주본문으로 따를지, 평행하는 헬라어 전통을 따를지
  chosen_reading: 현존 히브리어를 본문으로 번역하고, 헬라어의 상이한 전승은 각주로만 처리하지 않고 본문에는 반영하지 않았습니다.
  alternative_readings:
  - ‘주님을 경외하는 이들은 심판을 얻고, 의로운 행실을 빛처럼 밝힐 것입니다’
  rationale: 집회서에서는 히브리어가 남아 있을 때 이를 우선하는 원칙에 따라, 주어진 히브리어 문장을 본문으로 옮겼습니다. 헬라어는 의미가 크게 달라 본문 조화보다 전승 차이를 보존하는 편이 타당합니다.
  doctrine_reference: 'PHILOSOPHY.md: Hebrew Sirach is translated from the Hebrew where it survives; parallel Greek is used as actual input/consistency check, not to override extant Hebrew automatically.'
