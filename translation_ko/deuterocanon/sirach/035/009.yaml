translation:
  language: ko
  text: 야곱의 모든 지파를 모으시고, 그들이 옛날처럼 유산을 받게 하소서.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 병행문은 이 절에서 다르게 읽습니다. “귀족들 가운데서 자신을 그들과 동등하게 여기지 말고, 다른 사람이 말할 때에는 수다를 많이 떨지 마라.” 이는 현존하는 히브리어와 상당히 다른 본문 계열 또는 절 배열을 반영하는 것으로 보입니다.
    reason: textual_variant
