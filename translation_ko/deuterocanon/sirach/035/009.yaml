translation:
  language: ko
  text: 야곱의 모든 지파를 모으고, 옛날과 같이 그들에게 그들의 몫을 차지하게 하소서.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '그리스어 병행문은 이 절에서 다르게 읽습니다: “귀인들 한가운데서 자신을 같게 여기지 말며, 다른 사람이 말할 때는 많이 지껄이지 말라.” 이는 남아 있는 히브리어와 상당히 다른 본문 계열이나 절 배열을 반영하는 것으로 보입니다.'
    reason: textual_variant
