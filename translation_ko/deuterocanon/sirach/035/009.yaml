  - 옛 시절과 같이
  lexicon: HALOT
  rationale: 관용구를 현대 한국어로 풀어, 과거의 원상 회복을 뜻하는 시간표현을 자연스럽게 전달했습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행문의 불일치
  chosen_reading: 현존 히브리어 본문을 본문으로 번역하고, 그리스어 병행문은 별도 주석으로 처리하지 않았습니다.
  alternative_readings:
  - '그리스어 병행문: ''귀인들 한가운데서 자신을 같게 여기지 말며, 다른 사람이 말할 때는 많이 지껄이지 말라.'''
  rationale: 시라서에서는 히브리어가 남아 있는 경우 그 본문을 우선해야 하며, 이 절은 그리스어와 내용이 크게 달라 본문 전통이 다른 선을 반영합니다. 따라서 한국어 본문은 히브리어 회복 기도문을 따릅니다.
  doctrine_reference: 'PHILOSOPHY.md: 히브리어가 보존된 경우 그 본문에서 번역하고, 텍스트 불일치는 숨기지 않습니다.'
