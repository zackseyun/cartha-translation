  lexicon: HALOT
  rationale: 지파라는 언약·이스라엘 정체성을 살리고, המקרא의 집합적 표현을 간결하게 반영했습니다.
- source_word: ויתנחלו
  english_pob_choice: let them inherit
  chosen_korean: 그들에게 그들의 몫을 차지하게 하소서
  alternatives_korean:
  - 그들이 상속하게 하소서
  - 그들이 기업을 얻게 하소서
  - 그들이 유업을 받게 하소서
  lexicon: HALOT
  rationale: נחל의 유업/분배 의미를 살리면서, 한국어에서 ‘inherit’보다 더 직접적으로 몫의 회복을 드러내는 표현을 택했습니다. 이 구절은 단순 소유가 아니라 할당된 분깃의 회복을 시사합니다.
- source_word: כימי קדם
