  text: Gather all the tribes of Jacob[a], and let them inherit as in former days.
  footnotes:
  - marker: a
    text: 'The Greek parallel at this verse reads instead: ''In the midst of nobles do not make yourself equal, and when another is speaking do not babble much.'' This appears to reflect a different textual line or verse alignment than the surviving Hebrew.'
