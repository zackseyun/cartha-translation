  text: Who will trust an armed troop[a], leaping from city to city?
  footnotes:
  - marker: a
    text: 'The supplied Greek parallel for this verse differs completely: ''Understand that I have not labored for myself alone, but for all who seek instruction.'' The Hebrew witness is therefore followed here as the primary text.'
    reason: textual_variant
translation:
  language: ko
  text: 누가 무장한 군대[a], 곧 도시에서 도시로 뛰어다니는 자를 신뢰하겠습니까?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '제공된 그리스어 병행문은 내용이 전혀 다릅니다: “내가 나 자신만을 위해 수고한 것이 아니라, 교훈을 찾는 모든 이를 위해 수고했다.” 따라서 여기서는 히브리어 본문을 따랐습니다.'
    reason: textual_variant
lexical_decisions:
- source_word: מי
  english_pob_choice: Who will
  chosen_korean: 누가 … 신뢰하겠습니까?
  alternatives_korean:
  - 누가 … 믿겠습니까?
  - 누가 … 의지하겠습니까?
  lexicon: HALOT
  rationale: 수사적 질문을 한국어 합쇼체로 살리되, 본문의 핵심 동사 יאמין의 의미를 반영해 ‘신뢰하다’를 선택했습니다.
- source_word: יאמין
  english_pob_choice: trust
  chosen_korean: 신뢰하다
  alternatives_korean:
  - 믿다
  - 의지하다
  - 확신하다
  lexicon: HALOT
  rationale: 여기서는 명제에 대한 단순한 ‘믿음’보다 대상에 대한 신뢰/신용을 뜻하므로, 관계적 뉘앙스를 살린 ‘신뢰하다’가 적절합니다.
- source_word: בגדוד צבא
  english_pob_choice: an armed troop / of an army
  chosen_korean: 무장한 군대
  alternatives_korean:
  - 군대의 무장한 부대
  - 군사 무리
  - 무장한 한 떼의 군사
  lexicon: HALOT
  rationale: גדוד과 צבא가 함께 군사 집단을 가리키므로, 두 어휘를 과도하게 분해하지 않고 한국어로 자연스럽게 합쳐 ‘무장한 군대’로 옮겼습니다.
- source_word: המדלג
  english_pob_choice: leaping
  chosen_korean: 뛰어다니는
  alternatives_korean:
  - 도약하는
  - 뛰어오르는
  - 날뛰는
  lexicon: HALOT
  rationale: 직역상 ‘도약하는’이 가능하지만, 도시에서 도시로 옮겨 다니는 불안정하고 경솔한 움직임을 한국어로 더 분명히 드러내기 위해 ‘뛰어다니는’을 택했습니다.
- source_word: מעיר אל עיר
  english_pob_choice: from city to city
  chosen_korean: 도시에서 도시로
  alternatives_korean:
  - 성에서 성으로
  - 한 도시에서 다른 도시로
  lexicon: HALOT
  rationale: 반복 이동의 관용적 표현을 간결하게 살려 ‘도시에서 도시로’로 옮겼습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행문의 현저한 불일치
  chosen_reading: 히브리어를 본문으로 옮기고, 그리스어는 내용이 전혀 다른 병행문이라는 사실을 각주로 보존합니다.
  alternative_readings:
  - '그리스어: ‘내가 나 자신만을 위해 수고한 것이 아니라, 교훈을 찾는 모든 이를 위해 수고했다.’'
  rationale: 지혜문학에서는 히브리어 전승이 보존될 때 그것을 우선해야 하며, 이 절은 그리스어 병행문이 완전히 다른 내용이므로 본문에 혼합할 수 없습니다. 따라서 히브리어의 수사적 경구를 유지하고, 자료적 차이는 각주로 투명하게 밝힙니다.
  doctrine_reference: 'PHILOSOPHY.md: 가능한 경우 히브리어 본문 우선, 이본 차이는 정직하게 표기'
