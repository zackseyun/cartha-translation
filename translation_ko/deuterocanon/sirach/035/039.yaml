base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/035/039.yaml
  text: The prayer of the humble has passed through the clouds[a], and until it draws near, it will not be comforted[b];
  footnotes:
  - marker: a
    text: Or 'pierced the clouds'; the Greek image is of the humble person's prayer rising unhindered into God's presence.
    reason: lexical_alternative
  - marker: b
    text: 'The Greek is slightly ambiguous: ''until it/he draws near, he/it will not be comforted.'' The translation takes the prayer as drawing near and the humble person as the one not yet comforted.'
    reason: alternative_reading
translation:
  language: ko
  text: 가난한 이의 기도는 구름을 지나가지만[a], 그것이 가까이 이르기까지는 위로를 받지 못합니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘구름을 뚫고 지나가며’. 그리스어 이미지는 가난한 이의 기도가 막힘없이 하나님의 حضور 앞에 이르는 모습을 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어는 약간 모호하여 ‘그것/그가 가까이 이르기까지, 그는/그것은 위로를 받지 못한다’로도 읽을 수 있습니다. 본 번역은 기도가 도달하는 이미지와 기도하는 이의 미완의 위로를 함께 살립니다.
    reason: alternative_reading
lexical_decisions:
- source_word: προσευχὴ
  english_pob_choice: prayer
  chosen_korean: 기도
  alternatives_korean:
  - 간구
  - 기도문
  lexicon: LSJ
  rationale: 문맥상 하나님께 올리는 청원 행위를 가리키므로 가장 자연스럽고 직접적인 ‘기도’로 옮겼습니다.
- source_word: ταπεινοῦ
  english_pob_choice: of the humble
  chosen_korean: 가난한 이의
  alternatives_korean:
  - 겸손한 이의
  - 낮은 이의
  - 비천한 이의
  lexicon: LSJ
  rationale: 이 구절에서 ταπεινός는 단순한 성품만이 아니라 사회적 낮아짐과 의존 상태를 함께 시사하므로, 시편적·지혜문학적 뉘앙스를 살려 ‘가난한 이’로 옮겼습니다.
- source_word: νεφέλας διῆλθεν
  english_pob_choice: has passed through the clouds
  chosen_korean: 구름을 지나가지만
  alternatives_korean:
  - 구름을 통과하지만
  - 구름을 뚫고 지나가지만
  lexicon: LSJ
  rationale: 하늘을 가로막는 구름을 지나 하나님께 향하는 생생한 이미지를 살리되, 한국어에서는 과도한 해석을 피하기 위해 ‘지나가다’로 자연스럽게 표현했습니다.
- source_word: οὐ μὴ παρακληθῇ
  english_pob_choice: will not be comforted
  chosen_korean: 위로를 받지 못합니다
  alternatives_korean:
  - 위로받지 못합니다
  - 위안을 얻지 못합니다
  lexicon: LSJ
  rationale: παρακαλέω의 수동형은 여기서 ‘위로/위안’을 뜻하므로 가장 일반적인 한국어 표현을 택했습니다. 주어는 영어 POB의 문맥을 따라 기도보다 기도하는 사람을 가리키는 여운을 남겼습니다.
theological_decisions:
- issue: 둘째 절의 주어가 기도인지 기도하는 사람인지의 모호성
  chosen_reading: 첫 절은 ‘기도’가 구름을 지나가는 이미지로 살리고, 둘째 절은 그 기도가 도달하기까지 기도하는 이가 아직 위로를 받지 못하는 상태를 유지했습니다.
  alternative_readings:
  - ‘기도가 가까이 이르기까지 위로를 받지 못한다’로 기도를 계속 주어로 보는 해석
  - ‘가난한 이가 가까이 이르기까지 위로를 받지 못한다’로 사람을 명시하는 해석
  rationale: 원문은 시적 전환을 통해 기도와 기도하는 이를 겹쳐 보이게 하므로, 그 긴장을 풀지 않고 한국어에서도 여운 있게 보존했습니다.
  doctrine_reference: 시적 모호성 보존
