translation:
  language: ko
  text: 이방 민족을 두려워하지 말고, 그들이 당신의 능력을 보게 하십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 절의 현존 헬라어 병행문은 히브리어 증거와 상당히 달라, 여기서는 히브리어 본문을 따라 옮겼습니다.
    reason: textual_variant
lexical_decisions:
- source_word: הרף
  english_pob_choice: Strike / Relax / Let up
  chosen_korean: 두려워하지 말고
  alternatives_korean:
  - 물러서지 말고
  - 손을 떼고
  - 그만두고
  lexicon: HALOT
  rationale: 히브리어 הרף는 ‘놓다, 풀다, 멈추다’의 뜻이 있어 문맥상 대상을 향한 경계나 위축을 거두라는 뉘앙스를 담습니다. 한국어에서는 직역보다 자연스럽게 ‘두려워하지 말고’로 옮겨 상대 집단 앞에서 주저하지 말라는 권고를 드러냈습니다.
- source_word: עם נכר
  english_pob_choice: a foreign people
  chosen_korean: 이방 민족
  alternatives_korean:
  - 외국 민족
  - 낯선 민족
  - 이방 사람들
  lexicon: HALOT
  rationale: עם은 집단 단위의 ‘민족/백성’이고 נכר는 ‘낯설고 이방의’라는 표지이므로, 개인적 표현보다 집단성을 살린 ‘이방 민족’이 적절합니다.
- source_word: ויראו
  english_pob_choice: and let them see
  chosen_korean: 그들이 보게 하십시오
  alternatives_korean:
  - 그들이 보도록 하십시오
  - 그들이 보게 될 것입니다
  - 그들이 볼 수 있게 하십시오
  lexicon: HALOT
  rationale: 앞의 명령에 이어지는 의지적 연속을 살려, 단순 미래보다 권면형인 ‘보게 하십시오’로 옮겼습니다.
- source_word: גבורתיך
  english_pob_choice: your mighty deeds
  chosen_korean: 당신의 능력
  alternatives_korean:
  - 당신의 힘찬 일들
  - 당신의 용맹한 일들
  - 당신의 강한 행하심
  lexicon: HALOT
  rationale: 복수형은 눈에 보이는 힘의 발현을 가리키지만, 한국어에서는 자연스럽게 ‘능력’으로 응축해 표현했습니다. 다만 ‘보게’와의 연결을 위해 너무 추상적으로 흐르지 않도록 전체를 간결하게 유지했습니다.
theological_decisions:
- issue: 히브리어 본문과 헬라어 병행문의 큰 차이
  chosen_reading: 히브리어 증거를 본문으로 삼아 번역하고, 헬라어는 본문 형성의 참고로만 둡니다.
  alternative_readings:
  - 헬라어를 따라 ‘차려 앉아… 관을 받으라’는 전혀 다른 내용으로 번역
  rationale: 제공된 검증 메모처럼 이 절의 헬라어 병행문은 히브리어와 상당히 다르므로, 성경 본문에 남아 있는 히브리어를 우선하여 의미를 왜곡하지 않도록 했습니다.
  doctrine_reference: 'PHILOSOPHY.md: 현존하는 히브리어가 있을 때 이를 우선하되, 병행 전승의 차이는 투명하게 보존한다.'
