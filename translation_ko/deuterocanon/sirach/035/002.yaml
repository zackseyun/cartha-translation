    text: 이 절의 현존하는 헬라어 병행문은 히브리어 증거와 상당히 다르며, 다른 본문 형태를 반영하는 듯합니다. 여기서는 남아 있는 히브리어 본문을 따라 옮겼습니다.
    reason: textual_variant
