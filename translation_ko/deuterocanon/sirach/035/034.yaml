review_pass:
  verdict: revise
  source_fidelity: 첫 두 동사(ἔργασαι, ἄνες)는 조건절이 아니라 명령형입니다. 초안의 ‘…하면’은 잠언적 결과 관계는 전달하지만 원문의 직접적인 명령을 약화합니다. 또한 ἀνάπαυσιν은 ‘쉴 곳’이 아니라 ‘쉼/안식’을 뜻합니다. ἐν παιδί의 정확한 문법적 뉘앙스는 압축되어 있으므로, 본문에서는 문맥상 자연스러운 ‘아이에게 일을 시키십시오’로 옮기되 각주에서 직역 가능성을 보존하는 것이 안전합니다.
  naturalness: ‘아이에게 일을 시키십시오. 그러면 쉼을 얻을 것입니다. 그의 손을 풀어 놓으십시오. 그러면 그는 자유를 찾을 것입니다.’는 현대 표준어 합쇼체로 자연스럽고, 명령과 결과의 잠언적 병렬도 분명합니다. ‘그의 손을 놓아 두면’보다 ‘그의 손을 풀어 놓으십시오’가 ἄνες의 ‘풀다/느슨하게 하다’라는 이미지를 더 직접적으로 보존합니다.
  terminology: παιδί는 본문에서 ‘아이’로 유지합니다. ἐλευθερία는 현대 정치적 함의를 덧붙이지 않고 ‘자유’로 번역합니다. ἀνάπαυσις는 이 문맥에서 신학적으로 특정된 ‘안식’보다 일반적인 ‘쉼’이 적절합니다.
  issues:
  - severity: medium
    issue: 명령형을 조건절로 번역함
    rationale: ἔργασαι와 ἄνες는 모두 aorist imperative입니다. ‘…하면’은 직접 명령을 조건으로 바꾸므로, 명령형과 결과절을 한국어에서 명시하는 편이 충실합니다.
  - severity: medium
    issue: ‘쉴 곳’이 ἀνάπαυσις의 의미를 좁힘
    rationale: ἀνάπαυσις는 장소가 아니라 쉼, 휴식, 안도를 가리킵니다. ‘쉼을 얻을 것입니다’가 어휘 의미를 정확히 반영합니다.
  - severity: low
    issue: 각주의 ‘아이와 함께 일하라’가 ἐν παιδί의 한 가능성을 지나치게 단정적으로 제시함
    rationale: 이 전치사구는 압축적이고 해석상 논의의 여지가 있습니다. 문맥상 ‘아이에게 일을 시키라’라는 본문 번역을 유지하되, 각주에서는 직역을 ‘아이와 관련하여/아이에게 일하라’ 정도로 유보적으로 제시하는 편이 좋습니다.
  revised_text: 아이에게 일을 시키십시오. 그러면 쉼을 얻을 것입니다. 그의 손을 풀어 놓으십시오. 그러면 그는 자유를 찾을 것입니다.[a]
