base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/035/034.yaml
  text: Put a child to work[a], and you will find rest; leave his hands idle, and he will seek freedom.
  footnotes:
  - marker: a
    text: Or, more literally, 'Work with a child ... loosen his hands for him.' The Greek imagery suggests keeping a child occupied and not allowing idleness.
    reason: lexical_alternative
translation:
  language: ko
  text: 아이에게 일을 시키십시오. 그러면 쉼을 얻을 것입니다. 그의 손을 풀어 놓으십시오. 그러면 그는 자유를 찾을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 첫 구절은 직역하면 ‘아이와 관련하여 일하라’ 또는 ‘아이에게 일하라’ 정도입니다. 둘째 명령은 직역하면 ‘그의 손을 풀어 놓으라’입니다. 그리스어의 이미지는 아이를 일에 계속 종사하게 하고 게으름을 허용하지 말라는 뜻을 시사합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔργασαι ἐν παιδί
  english_pob_choice: Put a child to work
  chosen_korean: 아이를 일하게 하면
  alternatives_korean:
  - 아이에게 일을 시키면
  - 아이를 부리면
  - 어린이를 일에 붙이면
  lexicon: LSJ
  rationale: ἔργασαι는 ‘일하게 하다/일을 시키다’의 명령형으로 읽히며, ἐν παιδί는 이 잠언적 문맥에서 아이를 노동에 붙여 두는 상황을 가리킵니다. 한국어에서는 자연스럽고 직관적인 ‘아이를 일하게 하면’이 원문의 명령성과 실용적 의미를 함께 살립니다.
- source_word: εὑρήσεις ἀνάπαυσιν
  english_pob_choice: you will find rest
  chosen_korean: 쉴 곳을 얻을 것이고
  alternatives_korean:
  - 안식을 얻을 것이고
  - 휴식을 얻을 것이고
  - 평안을 찾을 것이고
  lexicon: LSJ
  rationale: ἀνάπαυσις는 여기서 ‘휴식’보다 넓게 ‘쉼/안식’의 결과를 뜻합니다. ‘쉴 곳을 얻을 것이고’는 결과 절의 예언적 뉘앙스를 살리면서도 한국어로 매끄럽게 들립니다.
- source_word: ἄνες χεῖρας αὐτῷ
  english_pob_choice: leave his hands idle
  chosen_korean: 그의 손을 놓아 두면
  alternatives_korean:
  - 그의 손을 느슨하게 두면
  - 그의 손을 풀어 주면
  - 그의 손을 게으르게 두면
  lexicon: LSJ
  rationale: ἄνες는 ‘풀어 놓다, 느슨하게 하다’의 뜻이지만, χεῖρας와 함께 쓰인 관용은 일과 훈련의 해이를 가리킵니다. ‘그의 손을 놓아 두면’은 손이라는 구체적 이미지를 유지하면서도 원문의 뜻을 자연스럽게 전달합니다.
- source_word: ζητήσει ἐλευθερίαν
  english_pob_choice: he will seek freedom
  chosen_korean: 그는 자유를 찾으려 할 것입니다
  alternatives_korean:
  - 그는 자유를 구할 것입니다
  - 그는 독립을 찾으려 할 것입니다
  - 그는 풀림을 구할 것입니다
  lexicon: LSJ
  rationale: ἐλευθερία는 기본적으로 ‘자유’이지만, 여기서는 정치적 이념보다 얽매임에서 벗어나려는 태도를 뜻합니다. ‘찾으려 할 것입니다’는 잠언의 경고적 전망을 살리면서 ‘자유’를 직접 보존합니다.
theological_decisions:
- issue: 잠언적 문맥의 παιδί 해석
  chosen_reading: 이 구절은 어린이/아이를 다루는 지혜 격언으로 직역 가능한 범위 안에서 이해하고, 현대적 정치·인권 담론을 덧씌우지 않았습니다.
  alternative_readings:
  - 종아이/하인으로 좁히는 해석
  - 자유를 ‘자기결정권’으로 확장하는 해석
  rationale: 그리스어 παιδί는 문맥상 아이 또는 젊은 종을 가리킬 수 있지만, 원문 자체는 가정적 훈육의 일반 원리를 말합니다. 따라서 독자가 즉시 이해할 수 있도록 하되, 사회사적 긴장은 과도하게 재구성하지 않았습니다.
  doctrine_reference: Translation philosophy §§1, 5, 6
