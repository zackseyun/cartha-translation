revisions:
- from: 아이를 일하게 하면 쉴 곳을 얻을 것이고, 그의 손을 놓아 두면 그는 자유를 찾으려 할 것입니다.[a]
  to: 아이에게 일을 시키십시오. 그러면 쉼을 얻을 것입니다. 그의 손을 풀어 놓으십시오. 그러면 그는 자유를 찾을 것입니다.[a]
  rationale: 원문의 두 명령형을 한국어 합쇼체 명령문으로 회복하고, 결과절은 미래형으로 유지했습니다. ‘쉴 곳’을 ‘쉼’으로 고쳐 ἀνάπαυσις의 비장소적 의미를 반영했습니다. παιδί와 ἐλευθερία는 각각 ‘아이’와 ‘자유’로 유지했으며, ἐν παιδί의 압축적이고 다소 불확정적인 표현은 각주에서 유보적으로 설명했습니다.
