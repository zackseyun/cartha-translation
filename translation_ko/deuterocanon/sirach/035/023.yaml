translation:
  language: ko
  text: 여인의 아름다움은 얼굴을 밝게 하며, 눈이 바라는 모든 것을 능가합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '그리스어는 상당히 다른 독법을 전합니다: “모든 일에서 네 영혼을 믿으십시오. 이것도 계명들을 지키는 일이기 때문입니다.”'
    reason: alternative_reading
lexical_decisions:
- source_word: תאר אשה
  english_pob_choice: A woman’s beauty
  chosen_korean: 여인의 아름다움
  alternatives_korean:
  - 여자의 아름다움
  - 여성의 용모
  - 여인의 자태
  lexicon: HALOT
  rationale: תאר는 외양의 아름다움이나 용모를 가리키므로, POB의 ‘beauty’를 살려 자연스럽게 ‘아름다움’으로 옮겼습니다.
- source_word: יחליץ פנים
  english_pob_choice: brightens the face
  chosen_korean: 얼굴을 밝게 하고
  alternatives_korean:
  - 얼굴을 새롭게 하고
  - 얼굴을 활기 있게 하고
  - 얼굴빛을 좋게 하고
  lexicon: HALOT
  rationale: 이 관용구는 얼굴/낯에 드러나는 변화를 뜻하므로, ‘brightens the face’의 효과를 살려 ‘얼굴을 밝게 하고’로 옮겼습니다.
- source_word: מחמד עין
  english_pob_choice: every delight of the eye
  chosen_korean: 눈이 바라는 모든 것
  alternatives_korean:
  - 눈의 모든 즐거움
  - 눈이 탐내는 모든 것
  - 눈에 기쁜 모든 것
  lexicon: HALOT
  rationale: 직역하면 ‘눈의 바람/소원’에 가까워 시각적 매력과 욕구를 함께 담으므로, 의미를 풀어 ‘눈이 바라는 모든 것’으로 표현했습니다.
- source_word: יגבר
  english_pob_choice: surpasses
  chosen_korean: 뛰어납니다
  alternatives_korean:
  - 능가합니다
  - 우세합니다
  - 이깁니다
  lexicon: HALOT
  rationale: 비교시에서 우월함을 나타내므로, 문맥상 자연스러운 현대 한국어인 ‘뛰어납니다’를 선택했습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행문의 큰 차이
  chosen_reading: 본문은 현존 히브리어를 따라 번역하고, 그리스어는 별도 대안 독법으로 각주에 제시했습니다.
  alternative_readings:
  - '그리스어: ‘모든 일에서 네 영혼을 믿어라. 이것도 계명들을 지키는 것이기 때문이다.’'
  rationale: 집회서에서는 히브리어가 남아 있는 경우 히브리어를 우선하되, 여기서는 그리스어가 단순한 어순 차이가 아니라 전혀 다른 문장을 보존하므로 본문을 대체하지 않고 각주로 투명하게 남겼습니다.
  doctrine_reference: 'PHILOSOPHY.md: 생존한 히브리어를 우선하고, 중대한 본문 차이는 숨기지 않는다.'
