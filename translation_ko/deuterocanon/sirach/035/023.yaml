lexical_decisions:
- source_word: תאר אשה
  english_pob_choice: A woman’s beauty
  chosen_korean: 여인의 아름다움
  alternatives_korean:
  - 여자의 아름다움
  - 여성의 용모
  - 여인의 자태
  lexicon: HALOT
  rationale: תאר는 외양의 아름다움이나 용모를 가리키므로, POB의 ‘beauty’를 살려 자연스럽게 ‘아름다움’으로 옮겼습니다.
- source_word: יחליץ פנים
  english_pob_choice: brightens the face
  chosen_korean: 얼굴을 밝게 하고
  alternatives_korean:
  - 얼굴을 새롭게 하고
  - 얼굴을 활기 있게 하고
  - 얼굴빛을 좋게 하고
  lexicon: HALOT
  rationale: 이 관용구는 얼굴/낯에 드러나는 변화를 뜻하므로, ‘brightens the face’의 효과를 살려 ‘얼굴을 밝게 하고’로 옮겼습니다.
- source_word: מחמד עין
  english_pob_choice: every delight of the eye
  chosen_korean: 눈이 바라는 모든 것
  alternatives_korean:
  - 눈의 모든 즐거움
  - 눈이 탐내는 모든 것
  - 눈에 기쁜 모든 것
  lexicon: HALOT
  rationale: 직역하면 ‘눈의 바람/소원’에 가까워 시각적 매력과 욕구를 함께 담으므로, 의미를 풀어 ‘눈이 바라는 모든 것’으로 표현했습니다.
- source_word: יגבר
  english_pob_choice: surpasses
  chosen_korean: 뛰어납니다
  alternatives_korean:
  - 능가합니다
  - 우세합니다
  - 이깁니다
  lexicon: HALOT
  rationale: 비교시에서 우월함을 나타내므로, 문맥상 자연스러운 현대 한국어인 ‘뛰어납니다’를 선택했습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행문의 큰 차이
