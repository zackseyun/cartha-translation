  alternative_readings:
  - '그리스어: ‘모든 일에서 네 영혼을 믿어라. 이것도 계명들을 지키는 것이기 때문이다.’'
  rationale: 집회서에서는 히브리어가 남아 있는 경우 히브리어를 우선하되, 여기서는 그리스어가 단순한 어순 차이가 아니라 전혀 다른 문장을 보존하므로 본문을 대체하지 않고 각주로 투명하게 남겼습니다.
  doctrine_reference: 'PHILOSOPHY.md: 생존한 히브리어를 우선하고, 중대한 본문 차이는 숨기지 않는다.'
