- source_word: חך
  english_pob_choice: the palate
  chosen_korean: 혀는
  alternatives_korean:
  - 입은
  - 구강은
  - 미각은
  lexicon: HALOT
  rationale: 히브리어 חך는 문자적으로는 입천장/입안의 맛보는 기관을 가리키지만, 한국어에서는 ‘혀’가 맛을 시험하는 감각 기관을 가장 자연스럽게 드러내므로 시적 비유를 살려 옮겼습니다.
- source_word: בוחן
