  text: The palate tests the flavors of speech, and an understanding heart the flavors of falsehood.
  footnotes:
  - marker: a
    text: Or 'The palate tests the taste of speech, and a discerning heart the taste of lies.' The Hebrew repeats the taste metaphor in both halves of the line.
    reason: lexical_alternative
  - marker: b
    text: The Greek parallel in Swete differs substantially here ('Do not go on a path of stumbling...'), indicating a major textual divergence; the translation follows the extant Hebrew witness as the primary source for this verse.
    reason: textual_variant
translation:
  language: ko
  text: 혀는 말의 맛을 시험하고, 이해하는 마음은 거짓의 맛을 분별합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘혀는 말의 맛을 시험하고, 이해하는 마음은 거짓의 맛을 분별합니다’입니다. 히브리어는 두 절에서 맛의 이미지를 반복합니다.
    reason: source_note
  - marker: b
    text: 그리스어 평행본문은 ‘넘어짐의 길로 가지 말라…’라고 크게 다르게 전합니다. 이 번역은 주된 히브리어 증언을 따릅니다.
    reason: textual_variant
lexical_decisions:
- source_word: חך
  english_pob_choice: the palate
  chosen_korean: 혀는
  alternatives_korean:
  - 입은
  - 구강은
  - 미각은
  lexicon: HALOT
  rationale: 히브리어 חך는 문자적으로는 입천장/입안의 맛보는 기관을 가리키지만, 한국어에서는 ‘혀’가 맛을 시험하는 감각 기관을 가장 자연스럽게 드러내므로 시적 비유를 살려 옮겼습니다.
- source_word: בוחן
  english_pob_choice: tests
  chosen_korean: 시험하고
  alternatives_korean:
  - 검사하고
  - 살피고
  - 분별하고
  lexicon: HALOT
  rationale: 지혜문맥의 ‘시험하다’는 감각적 비유와 잘 맞고, 앞구와 뒤구를 이어 주는 동사로도 자연스럽습니다.
- source_word: מטעמי דבר
  english_pob_choice: the flavors of speech
  chosen_korean: 말의 맛을
  alternatives_korean:
  - 말의 풍미를
  - 말의 맛을 느끼는
  - 말의 맛깔을
  lexicon: HALOT
  rationale: POB의 핵심은 ‘speech’보다 히브리어의 맛/풍미 비유를 살리는 데 있으므로, ‘말의 맛’을 택해 표현의 감각성을 보존했습니다.
- source_word: לב מבין
  english_pob_choice: an understanding heart
  chosen_korean: 이해하는 마음은
  alternatives_korean:
  - 분별하는 마음은
  - 깨닫는 마음은
  - 이해력 있는 마음은
  lexicon: HALOT
  rationale: 히브리어는 ‘이해하는 마음’이라는 분사구조이므로, 명사구보다 동사적 표현인 ‘이해하는 마음’을 택해 원문 구조를 반영했습니다.
- source_word: כזב
  english_pob_choice: falsehood
  chosen_korean: 거짓의 맛을 분별합니다
  alternatives_korean:
  - 거짓의 맛을
  - 거짓말의 맛을
  - 속임수의 맛을
  lexicon: HALOT
  rationale: כזב는 단순한 개별 ‘거짓말’보다 더 넓은 ‘거짓/허위’를 가리키므로 ‘거짓’으로 옮겨 의미 범위를 유지했습니다.
theological_decisions:
- issue: 히브리어 수사학의 맛 비유를 한국어에서 얼마나 직접적으로 유지할지
  chosen_reading: ‘맛’을 두 절 모두에 유지해, 말과 거짓을 분별하는 감각적 지혜의 병렬을 드러냈습니다.
  alternative_readings:
  - 둘째 절을 ‘거짓을 분별한다’로 더 평이하게 풀어 쓰는 방법
  - ‘맛’ 비유를 약화시켜 문어적으로 정리하는 방법
  rationale: 본문은 동일한 맛 비유를 의도적으로 반복하므로, 이를 한국어에서도 보존해야 지혜문학의 압축된 대비가 살아납니다.
  doctrine_reference: 지혜문학의 비유적 병행법
