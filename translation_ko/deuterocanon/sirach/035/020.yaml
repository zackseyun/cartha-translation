translation:
  language: ko
  text: 입천장은 말의 맛을 가려 내고, 마음은 거짓의 맛을 분별합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 חך는 문자적으로 입천장, 곧 맛을 느끼는 입안의 기관을 뜻합니다. 히브리어는 두 절에서 ‘맛’의 비유를 반복합니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어 평행본문은 ‘넘어짐의 길로 가지 말라…’라고 크게 다르게 전합니다. 이 번역은 현존하는 히브리어 증언을 우선하여 따릅니다.
    reason: textual_variant
