base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/035/032.yaml
  text: On the day the days of your life are completed[a], and at the time of your death, distribute your inheritance.
  footnotes:
  - marker: a
    text: Or 'at the end of your life'; the Greek literally speaks of the completion of the days of your life.
    reason: lexical_alternative
translation:
  language: ko
  text: 네 생애의 날들이 다 차고, 죽을 때가 되면, 유산을 나누어 주십시오.[a]
  philosophy: formal
  footnotes:
  - marker: a
    text: 또는 ‘네 생애가 끝날 때에’. 그리스어는 문자적으로 ‘네 생애의 날들이 완성될 때’를 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἡμέρᾳ συντελείας ἡμερῶν ζωῆς σου
  english_pob_choice: On the day the days of your life are completed
  chosen_korean: 네 생애의 날들이 다 찬 날
  alternatives_korean:
  - 네 삶의 날들이 끝나는 날
  - 네 생명의 날들이 완성되는 날
  lexicon: BDAG / LXX idiom
  rationale: 연속된 ‘날들’(ἡμερῶν)과 ‘완성/종결’(συντελείας)을 그대로 드러내면서, 한국어에서는 자연스러운 관용으로 ‘다 차다’를 써서 누적된 생애의 마침을 살렸습니다.
- source_word: καιρῷ τελευτῆς
  english_pob_choice: the time of your death
  chosen_korean: 죽을 때
  alternatives_korean:
  - 끝날 때
  - 생을 마칠 때
  - 종말의 때
  lexicon: BDAG
  rationale: τελευτή의 직접적 의미가 여기서는 죽음을 가리키므로, 완곡하게 약화하지 않고 ‘죽을 때’로 옮겨 본문이 요구하는 실제적 의미를 보존했습니다.
- source_word: διάδος
  english_pob_choice: distribute
  chosen_korean: 나누어 주십시오
  alternatives_korean:
  - 분배하십시오
  - 나누십시오
  - 배분하십시오
  lexicon: BDAG
  rationale: 상속 재산을 여러 사람에게 몫대로 넘겨 주는 맥락이므로, 단순한 ‘주다’보다 분할·할당의 의미를 살리는 ‘나누어 주십시오’가 적절합니다.
- source_word: κληρονομίαν
  english_pob_choice: the inheritance
  chosen_korean: 유산
  alternatives_korean:
  - 상속 재산
  - 상속분
  - 기업
  lexicon: BDAG
  rationale: κληρονομία는 여기서 상속되는 재산을 뜻하므로, 현대 한국어 독자에게 즉각 이해되는 ‘유산’으로 옮기되 상속의 맥락을 유지했습니다.
theological_decisions:
- issue: ‘죽을 때’의 직설성 유지 여부
  chosen_reading: 죽을 때
  alternative_readings:
  - 끝날 때
  - 생을 마칠 때
  rationale: 본문은 상속 분배 시점을 분명히 생의 종결과 연결하므로, 죽음을 직접 가리키는 표현을 유지해 경고성과 실제성을 흐리지 않도록 했습니다.
  doctrine_reference: 본문의 직접적 의미 보존; 완곡어법으로 인한 약화 방지
