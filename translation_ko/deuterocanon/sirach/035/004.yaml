base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/035/004.yaml
  text: Where[a] there is listening[b], do not pour out speech, and do not show off wisdom[c] at the wrong time.
  footnotes:
  - marker: a
    text: The supplied Hebrew witness in Zone 1 appears mismatched to Sirach 35:4; the translation therefore follows the Greek parallel, which reads a warning about speaking and displaying wisdom at an inappropriate time.
    reason: textual_variant
  - marker: b
    text: Or 'Where there is an audience, do not pour out talk.' The Greek ἀκρόαμα can refer either to listening/hearing or to an audience.
    reason: lexical_alternative
  - marker: c
    text: Or 'do not play the wise man at the wrong time.'
    reason: lexical_alternative
translation:
  language: ko
  text: 듣는 이들이 있는 자리에서는[a][b] 말을 쏟아내지 말고, 때에 맞지 않게 지혜로운 체하지 마십시오.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 제시된 히브리어 본문은 이 절과 일치하지 않으므로, 본역은 대응하는 그리스어 병행본문을 따랐습니다.
    reason: source_note
  - marker: b
    text: ἀκρόαμα는 ‘듣는 행위’ 또는 ‘청중’으로 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘지혜로운 체하다’는 ‘지혜를 뽐내다’ 또는 ‘지혜를 과시하다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπου ἀκρόαμα
  english_pob_choice: Where there is listening
  chosen_korean: 듣는 이가 있을 때에는
  alternatives_korean:
  - 청중이 있을 때에는
  - 들어 주는 이가 있을 때에는
  - 경청하는 자리가 있을 때에는
  lexicon: BDAG
  rationale: ἀκρόαμα는 ‘듣는 행위/청중’의 뜻을 함께 가질 수 있어, 한국어에서는 상황을 자연스럽게 드러내는 ‘듣는 이가 있을 때’로 옮겼습니다.
- source_word: μὴ ἐκχέῃς λαλιάν
  english_pob_choice: do not pour out speech
  chosen_korean: 말을 쏟아내지 말고
  alternatives_korean:
  - 말을 퍼붓지 말고
  - 말을 쏟지 말고
  - 말을 함부로 하지 말고
  lexicon: BDAG
  rationale: ‘pour out’의 비유를 살리면서도 한국어에서 자연스러운 표현으로 ‘말을 쏟아내다’를 택해, 경솔한 발화를 금하는 뉘앙스를 유지했습니다.
- source_word: ἀκαίρως μὴ σοφίζου
  english_pob_choice: do not show off wisdom at the wrong time
  chosen_korean: 때를 얻지 못하여 지혜를 뽐내지 마십시오
  alternatives_korean:
  - 때에 맞지 않게 지혜를 과시하지 마십시오
  - 때를 가리지 않고 지혜로운 체하지 마십시오
  - 부적절한 때에 지혜를 드러내지 마십시오
  lexicon: BDAG
  rationale: σοφίζου는 단순히 ‘지혜롭다’보다 지혜를 드러내거나 내세우는 행위를 가리키므로, ‘지혜를 뽐내다’로 옮겨 경구적 경고를 살렸습니다.
