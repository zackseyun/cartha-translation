  source_fidelity: 제시된 히브리어는 이 절의 내용과 일치하지 않으며, 대응하는 그리스어 본문(ὅπου ἀκρόαμα, μὴ ἐκχέῃς λαλιάν, καὶ ἀκαίρως μὴ σοφίζου)을 기준으로 삼는 것이 타당합니다. 현 번역의 ‘때를 얻지 못하여’는 ἀκαίρως(‘때에 맞지 않게, 부적절한 때에’)를 ‘때를 얻지 못하다’라는 다른 뜻으로 바꾸므로 수정이 필요합니다.
  naturalness: ‘듣는 이들이 있는 자리에서는’과 ‘말을 쏟아내지 말고’는 현대 표준 한국어에서 자연스럽고 경구체 문맥에도 어울립니다. ‘때에 맞지 않게 지혜로운 체하지 마십시오’는 원문의 자기과시적/현자 행세의 뉘앙스를 자연스럽게 드러냅니다.
