lexical_decisions:
- source_word: אַל תְּקַנֵּא
  english_pob_choice: Do not envy
  chosen_korean: 부러워하지 마십시오
  alternatives_korean:
  - 시기하지 마십시오
  - 질투하지 마십시오
  lexicon: HALOT
  rationale: קנא의 금지문맥은 타인의 형편을 향한 시기·질투를 가리키므로, 현대 한국어에서 가장 자연스럽고 문맥에 맞는 ‘부러워하다’로 옮겼습니다.
- source_word: בְּאִישׁ רָשָׁע
  english_pob_choice: a wicked man
  chosen_korean: 악한 사람
  alternatives_korean:
  - 악한 남자
  - 사악한 사람
  lexicon: HALOT
  rationale: איש는 기본적으로 ‘사람/남자’이지만 잠언적 경고문맥에서는 성별을 과도하게 드러내지 않는 ‘사람’이 자연스럽고, רשע는 도덕적 악을 뜻하므로 ‘악한’이 적절합니다.
- source_word: כִּי לֹא תֵּדֵע
  english_pob_choice: for you do not know
  chosen_korean: 알 수 없기 때문입니다
  alternatives_korean:
  - 알지 못하기 때문입니다
  - 무엇인지 알지 못하기 때문입니다
  lexicon: HALOT
  rationale: כִּי는 이유를 제시하므로 ‘때문입니다’로 처리했고, 동사 לֹא תֵּדֵע는 일반적 인식의 부정을 자연스럽게 옮겨 ‘알 수 없기 때문’으로 만들었습니다.
- source_word: מַה יּוֹמוֹ
  english_pob_choice: what his day will bring
  chosen_korean: 그의 날이 어떻게 될지
  alternatives_korean:
  - 그의 날이 어떨지
  - 그의 날에 무엇이 일어날지
  - 그의 마지막이 어떨지
  lexicon: HALOT
  rationale: 직역하면 ‘그의 날이 무엇인지/어떤지’라는 간결한 표현으로, 확정되지 않은 그 날의 전개를 가리킵니다. 영어 POB가 ‘what his day will bring’로 풀어낸 의미를 반영하되, 본문이 명시하지 않은 ‘마지막’은 덧붙이지 않았습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행문의 불일치
  chosen_reading: 히브리어 본문을 본문으로 번역하고, 그리스어의 다른 문장은 주석에서만 반영합니다.
  alternative_readings:
  - 네 힘에 따라 이웃들을 살피고, 지혜로운 사람들과 상의하십시오.
  rationale: 이 절은 현존 히브리어와 그리스어가 서로 다른 문장입니다. 사본 전승의 차이를 지우지 않기 위해 본문은 히브리어를 따르되, 그리스어 이문은 별도로 확인 가능하게 두는 편이 투명합니다.
  doctrine_reference: 'Sirach 번역 원칙: 히브리어가 보존되면 히브리어를 우선하고, 그리스어는 대조 증거로 사용'
