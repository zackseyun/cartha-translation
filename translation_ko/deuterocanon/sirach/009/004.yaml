  alternative_readings:
  - 그녀의 소득
  - 그녀의 덫
  - 그녀의 계략
  rationale: 본문의 히브리어는 보존되어 있으나 마지막 단어는 단독으로 확정하기 어렵습니다. 병행하는 그리스어가 경고의 성격상 유혹적 수단을 가리키는 방향을 지지하므로, 그 의미를 과도하지 않게 한국어로 옮겼습니다.
  doctrine_reference: 'PHILOSOPHY.md: 히브리어가 남아 있는 지혜문학은 히브리어를 기본으로 번역하되, 난구는 그리스어 병행구를 실제 번역 입력으로 사용합니다.'
