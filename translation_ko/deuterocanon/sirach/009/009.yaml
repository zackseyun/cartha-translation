  text: Turn your eyes away from a graceful woman[a], and do not gaze at beauty that is not yours.
  footnotes:
  - marker: a
    text: 'Greek parallel: ''Do not sit at all with another man''s wife, and do not drink wine with her, lest your soul turn aside to her and by your spirit you slip into destruction.'' The Hebrew witness here is shorter and more general.'
    reason: alternative_reading
translation:
  language: ko
  text: 매력적인 여자에게서 눈을 돌리고, 너에게 속하지 않은 아름다움을 바라보지 마십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '그리스어 병행문: “다른 남자의 아내와는 아예 함께 앉지 말고, 그녀와 함께 포도주도 마시지 말라. 그렇지 않으면 네 혼이 그녀에게 기울고 네 영이 멸망으로 미끄러질지 모른다.” 히브리어 증언은 여기서 더 짧고 일반적입니다.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַעֲלִים עַיִן
  english_pob_choice: Turn your eyes away
  chosen_korean: 눈을 돌리고
  alternatives_korean:
  - 눈을 감추고
  - 시선을 피하고
  lexicon: HALOT
  rationale: 직역하면 ‘눈을 숨기다’에 가깝지만, 여기서는 경계의 대상에서 시선을 의도적으로 거두라는 권면이므로 자연스럽고 의미를 살리는 ‘눈을 돌리고’로 옮겼습니다.
- source_word: אֵשֶׁת חֵן
  english_pob_choice: a graceful woman
  chosen_korean: 매력적인 여자
  alternatives_korean:
  - 은혜로운 여자
  - 아름다운 여자
  lexicon: HALOT
  rationale: חֵן은 단순한 외모만이 아니라 호감과 매력을 포함하는 말이어서, 문맥의 권면성을 살려 ‘매력적인 여자’로 옮겼습니다. ‘아름다운 여자’는 다음 절반의 יֹפִי와 겹침이 큽니다.
- source_word: תַּבִּיט
  english_pob_choice: gaze
  chosen_korean: 바라보지 마십시오
  alternatives_korean:
  - 응시하지 마십시오
  - 쳐다보지 마십시오
  lexicon: HALOT
  rationale: 금지의 강도를 살리면서도 한국어 합쇼체의 자연스러운 경고 표현으로 ‘바라보지 마십시오’를 선택했습니다.
- source_word: יֹפִי לֹא לָךְ
  english_pob_choice: beauty that is not yours
  chosen_korean: 너에게 속하지 않은 아름다움
  alternatives_korean:
  - 너의 것이 아닌 아름다움
  - 네 것이 아닌 미모
  lexicon: HALOT
  rationale: 히브리어는 짧게 소유 경계를 표시하므로, ‘not yours’를 물건화된 소유가 아니라 관계적·윤리적 경계로 살려 ‘너에게 속하지 않은’으로 옮겼습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행문의 관계
  chosen_reading: 히브리어의 짧고 일반적인 경고를 본문으로 따르되, 성적·윤리적 경계의 뜻은 분명히 드러내었습니다.
  alternative_readings:
  - 그리스어 병행문처럼 다른 남자의 아내와 함께 앉거나 포도주를 마시지 말라는 식으로 확장해 옮길 수 있습니다.
  rationale: 이 절은 히브리어 증언이 더 짧고 일반적이므로, 본문 번역은 히브리어를 따르는 것이 맞습니다. 다만 그리스어는 경고의 도덕적 범위를 확인해 주므로, 번역이 지나치게 약화되지 않도록 반영했습니다.
  doctrine_reference: 'PHILOSOPHY.md: translate from Hebrew where it survives; use Greek parallel as actual input'
