  lexicon: HALOT
  rationale: שַׁלִּיט을 단순한 직함보다 실제로 해칠 수 있는 능력으로 이해해, 문맥의 핵심인 위험성을 드러내는 표현을 택했습니다.
- source_word: לַהֲרוֹג
  english_pob_choice: to kill
