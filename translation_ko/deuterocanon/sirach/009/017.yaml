  lexicon: HALOT
  rationale: לאחריו의 부정사 용법을 한국어 관형형으로 처리하여 ‘권세’와 결합되는 즉각적 의미를 자연스럽게 드러냈습니다.
- source_word: פַּחֲדֵי מַוֶת
  english_pob_choice: the terrors of death
