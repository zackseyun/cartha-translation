translation:
  language: ko
  text: 죽일 권세가 있는 사람에게서 멀리 피하십시오[a]. 그리고 죽음의 두려움을 두려워하지 마십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '그리스어 증인은 이곳에서 상당히 다른 문장을 전합니다: “의인들이 당신의 식탁 동무가 되게 하라, 그리고 당신의 자랑은 주님을 경외함이 되게 하라.” 본문은 이 구절에 보존된 히브리어를 따릅니다.'
    reason: textual_variant
lexical_decisions:
- source_word: רְחַק
  english_pob_choice: Keep far from
  chosen_korean: 멀리 피하십시오
  alternatives_korean:
  - 멀리하십시오
  - 멀리 떨어지십시오
  - 피하십시오
  lexicon: HALOT
  rationale: 명령형 רחק의 거리 두기 의미를 살리되, 한국어에서 자연스러운 경계·회피의 뉘앙스를 주기 위해 ‘멀리 피하다’로 옮겼습니다.
- source_word: מֵאִישׁ שַׁלִּיט
  english_pob_choice: from a man who has power
  chosen_korean: 죽일 권세가 있는 사람
  alternatives_korean:
  - 사람
  - 권세 있는 사람
  - 살해할 수 있는 사람
  lexicon: HALOT
  rationale: שַׁלִּיט을 단순한 직함보다 실제로 해칠 수 있는 능력으로 이해해, 문맥의 핵심인 위험성을 드러내는 표현을 택했습니다.
- source_word: לַהֲרוֹג
  english_pob_choice: to kill
  chosen_korean: 죽일
  alternatives_korean:
  - 죽이다
  - 목숨을 빼앗을
  - 죽음에 이르게 할
  lexicon: HALOT
  rationale: לאחריו의 부정사 용법을 한국어 관형형으로 처리하여 ‘권세’와 결합되는 즉각적 의미를 자연스럽게 드러냈습니다.
- source_word: פַּחֲדֵי מַוֶת
  english_pob_choice: the terrors of death
  chosen_korean: 죽음의 두려움
  alternatives_korean:
  - 죽음의 공포
  - 죽음의 테러
  - 죽음의 공포들
  lexicon: HALOT
  rationale: 히브리어의 복수형 명사구가 강한 공포의 감각을 담지만, 한국어에서는 ‘죽음의 두려움’이 과도한 의역 없이도 의미를 전달합니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행본문의 중대한 상이
  chosen_reading: 현존하는 히브리어 본문을 본문으로 번역하고, 그리스어의 다른 경구는 각주로 투명하게 알립니다.
  alternative_readings:
  - '그리스어: ‘의인들이 당신의 식탁 동무가 되게 하라, 그리고 당신의 자랑은 주님을 경외함이 되게 하라.’'
  rationale: 집회서에서는 히브리어가 보존되는 경우 그 본문을 우선하되, 그리스어가 전혀 다른 문장을 전한다는 사실은 각주로 유지해야 독자가 본문 차이를 정확히 볼 수 있습니다.
  doctrine_reference: 'PHILOSOPHY.md: 히브리어가 남아 있으면 히브리어를 우선하고, 본문 차이를 정직하게 보존'
