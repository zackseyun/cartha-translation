  source_fidelity: 그리스어 본문을 본문 번역의 기준으로 삼은 선택은 타당합니다. 그러나 ‘생각을 나누고’는 διαλογισμός(생각·숙고)를 타인과 교환하는 행위로 바꾸어 놓으므로, ‘분별 있는 이들과 함께 생각하십시오’로 고치는 편이 더 충실합니다. 또한 히브리어 이문은 본문과 크게 달라 각주로 명시해야 합니다.
  naturalness: ‘분별 있는 이들과 함께 생각하십시오, 모든 말은 … 율법에 따라 하십시오’는 현대 표준 한국어의 합쇼체 권면으로 자연스럽습니다. ‘율법 안에서 하십시오’보다 ‘율법에 따라 하십시오’가 한국어에서 더 자연스럽고, 여기서 ἐν νόμῳ가 나타내는 규범적 의미도 잘 전달합니다.
  terminology: συνετοί는 단순한 지적 능력보다 분별·통찰을 강조하므로 ‘지혜로운 사람들’보다 ‘분별 있는 이들’이 적절합니다. Ὑψιστος의 신적 칭호는 ‘지극히 높으신 분’으로 유지하고, νόμος는 ‘율법’으로 번역합니다.
