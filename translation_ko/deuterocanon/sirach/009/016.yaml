translation:
  language: ko
  text: 분별 있는 이들과 함께 생각하십시오[a]. 당신의 모든 말은 지극히 높으신 분의 율법에 따라 하십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 현존하는 카이로 게니자 히브리어 본문은 이 절에서 다르게 전합니다. “성공하는 오만한 자를 부러워하지 마십시오. 죽을 때까지 그가 벌을 면하지 못할 것을 기억하십시오.” 이 히브리어 전승은 다른 행이 옮겨졌거나 이문을 반영하는 것으로 보이므로, 본문은 그리스어를 따랐습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ μετὰ συνετῶν
  english_pob_choice: with the discerning
  chosen_korean: 지혜로운 사람들과 함께
  alternatives_korean:
  - 분별 있는 사람들과 함께
  - 슬기로운 사람들과 함께
  lexicon: LSJ
  rationale: συνετῶν은 분별력 있는 사람들을 가리키므로, 현대 한국어에서 자연스럽고 문맥에 맞는 표현으로 옮겼습니다.
- source_word: ἔστω ὁ διαλογισμός σου
  english_pob_choice: let your thoughts be
  chosen_korean: 생각을 나누고
  alternatives_korean:
  - 생각하게 하십시오
  - 사유하게 하십시오
  lexicon: LSJ
  rationale: διαλογισμός는 생각, 숙고, 논의를 포괄하므로, 권면의 흐름을 살려 ‘생각을 나누다’로 풀어 말했습니다.
- source_word: πᾶσα διήγησίς σου
  english_pob_choice: all your speech
  chosen_korean: 모든 말은
  alternatives_korean:
  - 모든 대화는
  - 모든 말하기는
  lexicon: LSJ
  rationale: διήγησις는 말함, 진술, 담화를 가리킬 수 있어, 여기서는 일반적이고 넓은 의미의 ‘말’이 가장 자연스럽습니다.
- source_word: ἐν νόμῳ Ὑψίστου
  english_pob_choice: in the law of the Most High
  chosen_korean: 지극히 높으신 분의 율법 안에서
  alternatives_korean:
  - 지극히 높으신 분의 율법에 따라
  - 지극히 높으신 분의 율법 가운데
  lexicon: LSJ
  rationale: νόμος는 여기서 하나님의 가르침인 율법을 뜻하고, Ὑψίστου는 하나님의 칭호이므로 ‘지극히 높으신 분’으로 옮겼습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행문의 갈등
  chosen_reading: 본문은 그리스어 병행문을 따라 지혜 권면으로 옮기고, 히브리어의 이질적 전승은 주석적 각주 없이 이번 기록에서는 본문 선택으로 반영하지 않았습니다.
  alternative_readings:
  - 히브리어를 따라 ‘오만한 성공자를 부러워하지 말라’로 옮김
  rationale: 이 절의 히브리어는 그리스어와 크게 어긋나는 별개 전승으로 표시되어 있어, 절 번호에 맞는 안정된 본문으로는 그리스어를 따르는 것이 적절합니다.
  doctrine_reference: 'POB 원칙: 본문 위치와 전승의 일치를 우선하며, 명백한 불일치는 투명하게 처리한다.'
