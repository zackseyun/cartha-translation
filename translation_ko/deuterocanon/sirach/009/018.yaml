translation:
  language: ko
  text: 공예가들의 손에서는 작품이 칭찬을 받으며, 백성의 통치자는 자기 말에서 지혜롭습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '히브리어 전승에는 이 절이 크게 다른 내용으로 전해집니다: “네가 다가가면 죄를 짓지 않을 것이며, 그가 네 생명을 취하지 않도록 하라.”'
    reason: textual_variant
lexical_decisions:
- source_word: ἐν χειρὶ / בְּיַד
  english_pob_choice: In the hand of
  chosen_korean: 손에서는
  alternatives_korean:
  - 손 안에서
  - 손에 의해
  lexicon: LSJ / BDB
  rationale: ‘손’은 히브리어·헬라어 모두에서 능력과 통제의 관용적 표현을 살리기에 적절하며, ‘에서는’은 원문의 위치·영역감을 자연스럽게 옮깁니다.
- source_word: τεχνιτῶν
  english_pob_choice: craftsmen
  chosen_korean: 공예가들의
  alternatives_korean:
  - 장인들의
  - 기술자들의
  lexicon: LSJ
  rationale: τεχνίτης는 솜씨 있는 제작자를 가리키므로, 현대 한국어에서는 ‘공예가’가 직역성과 자연스러움을 함께 유지합니다.
- source_word: ἔργον
  english_pob_choice: a work
  chosen_korean: 작품이
  alternatives_korean:
  - 일이
  - 작업물이
  lexicon: LSJ
  rationale: 여기서 ἔργον은 도덕적 행위가 아니라 만들어진 산물을 가리키므로, ‘작품’이 가장 구체적이고 문맥에 맞습니다.
- source_word: ὁ ἡγούμενος λαοῦ
  english_pob_choice: the ruler of a people
  chosen_korean: 백성의 통치자는
  alternatives_korean:
  - 민족의 지도자는
  - 백성의 인도자는
  lexicon: LSJ
  rationale: ἡγούμενος는 단순한 안내자보다 공적 통치의 뉘앙스가 강해 ‘통치자’로 옮겼고, λαοῦ는 특정 국가보다 일반적 공동체를 가리키므로 ‘백성’으로 두었습니다.
- source_word: σοφὸς ἐν λόγῳ αὐτοῦ
  english_pob_choice: wise in his speech
  chosen_korean: 자기 말에서 지혜롭습니다
  alternatives_korean:
  - 말에서 지혜롭습니다
  - 말하는 데 지혜롭습니다
  lexicon: LSJ
  rationale: λόγος는 여기서 ‘말/발언’을 뜻하므로, ‘자기 말’이 소유 대명사와 발화 내용을 함께 살리며 한국어 문장도 자연스럽습니다.
theological_decisions:
- issue: 히브리어와 헬라어 본문의 중대한 불일치
  chosen_reading: 헬라어 본문을 따라 공예와 통치자의 지혜를 말하는 구절로 번역했습니다.
  alternative_readings:
  - 히브리어를 따라 ‘네가 다가가면 죄를 짓지 않을 것이며, 그가 네 생명을 취하지 않도록 하라’로 번역할 수 있습니다.
  rationale: 제공된 자료에서 히브리어는 major_mismatch로 표시되어 있고, 두 전승은 단순 변이 수준이 아니라 서로 다른 속담입니다. 따라서 본문은 헬라어를 채택하되, 히브리어의 대조적 전승은 숨기지 않고 별도 대안으로 보존했습니다.
  doctrine_reference: 'PHILOSOPHY.md: 지혜문학/집회서에서는 전승 차이를 투명하게 표기하고, 채택한 본문을 분명히 밝힙니다.'
