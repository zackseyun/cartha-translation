translation:
  language: ko
  text: 그 여자에게 마음을 기울이지 마십시오. 그러면 피 흘림 가운데 구덩이에 이르게 될 수 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘그 여자에게’(여성 단수)와 ‘구덩이로’에 같은 동사 ‘기울다’를 반복하여, 잘못된 대상에게 마음을 기울이는 일이 파멸로 이어짐을 표현합니다. ‘피 흘림 가운데’는 문자적으로 ‘피들 가운데’입니다.
    reason: source_note
lexical_decisions:
- source_word: לֵב
  english_pob_choice: your heart
  chosen_korean: 당신의 마음
  alternatives_korean:
  - 당신의 심장
  - 마음
  lexicon: לב
  rationale: 히브리어 לֵב는 감정과 의지, 내면 전체를 가리키므로, 현대 한국어에서는 ‘마음’이 가장 자연스럽고 의미 범위도 잘 맞습니다.
- source_word: אֵלֶיהָ
  english_pob_choice: to them
  chosen_korean: 그들에게로
  alternatives_korean:
  - 그것에게로
  - 그녀에게로
  lexicon: אל
  rationale: 영문 POB의 수정본처럼 복수 지시를 반영해 ‘그들에게로’로 옮겼습니다. 히브리어 형태 자체는 단수 여성형이지만, 문맥상 대상은 사람/유혹의 무리로 이해되는 전승을 따라 복수 의미를 살렸습니다.
- source_word: בְּדָמִים
  english_pob_choice: in blood
  chosen_korean: 피 속에서
  alternatives_korean:
  - 피 가운데
  - 피로
  lexicon: דם
  rationale: 직역의 ‘피로’보다, ‘피 속에서… 내려가다’라는 재난·죽음의 상황을 드러내는 표현이 문맥상 더 분명하여 ‘피 속에서’로 다듬었습니다.
- source_word: שָׁחַת
  english_pob_choice: the Pit
  chosen_korean: 구덩이
  alternatives_korean:
  - 음부
  - 무덤
  - 지옥
  lexicon: שחת
  rationale: POB의 ‘the Pit’을 따르되, 사후 세계의 신학적 확정어인 ‘지옥’보다 히브리어가 가진 파괴·죽음의 이미지에 가까운 ‘구덩이’를 택했습니다.
theological_decisions:
- issue: 문장 첫머리의 경고 기능
  chosen_reading: 이 절은 욕망 대상에 마음이 기울어지는 것을 경계하는 윤리적 경고로 읽고, 한국어도 명령형보다 금지·경계의 뉘앙스를 살렸습니다.
  alternative_readings:
  - 직접 명령형으로 옮기는 방식
  - 단순 서술문으로 완화하는 방식
  rationale: 히브리어 פֶּן은 ‘~하지 않도록/혹시 ~할까 하여’의 경계 표현이므로, 경고의 긴장을 유지해야 합니다.
  doctrine_reference: 문맥적 충고문학의 경고 기능
- issue: ‘구덩이’의 종말론적 강도
  chosen_reading: ‘구덩이’를 유지해 죽음과 멸망의 이미지를 보존하고, 특정 교리어로 고정하지 않았습니다.
  alternative_readings:
  - 음부
  - 지옥
  - 무덤
  rationale: 후대 독자가 곧바로 단일한 내세 교리로 읽지 않도록, 본문의 시적·경고적 표현을 우선 보존하는 것이 적절합니다.
  doctrine_reference: 지혜문학의 은유적 사망 이미지
