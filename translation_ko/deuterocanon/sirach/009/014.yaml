  - 신선한 포도주
  lexicon: HALOT
  rationale: יַיִן은 ‘포도주/술’ 범주이지만, 비유의 자연스러운 현대 한국어와 평행구조를 살려 ‘새 포도주’로 옮겼습니다.
- source_word: אוֹהֵב חָדָשׁ
  english_pob_choice: a new friend
  chosen_korean: 새 친구
  alternatives_korean:
  - 새로운 친구
  - 새로운 벗
  lexicon: HALOT
  rationale: 히브리어는 생략적이고 다소 난해하지만, 문맥상 새 포도주에 대응하는 대구로서 ‘새 친구’가 가장 간결하고 직설적입니다.
- source_word: וְיָשָׁן
  english_pob_choice: when it grows old
  chosen_korean: 오래되면
  alternatives_korean:
  - 늙으면
  - 오래되었을 때
  lexicon: HALOT
  rationale: 시간의 경과에 따른 숙성의 의미를 살리기 위해 상태보다는 조건절로 처리했습니다.
- source_word: אַחַר אוּלַי תִּשְׁתֶּינוּ
  english_pob_choice: you may drink it with pleasure
  chosen_korean: 아마 기꺼이 마시게 됩니다
  alternatives_korean:
  - 그때 아마 마시게 됩니다
  - 기꺼이 마실 수 있습니다
  lexicon: HALOT
  rationale: 본문 말미는 전승이 불안정하여 추정적 뉘앙스가 강하므로, ‘아마’와 ‘기꺼이’로 허용·개연성을 모두 반영했습니다.
theological_decisions:
- issue: 히브리어 전승과 그리스어 병행본문의 중대한 불일치
  chosen_reading: 살아 있는 히브리어 증언을 따라 ‘새 포도주/새 친구’ 격언으로 번역하고, 그리스어 병행본문은 이 절의 본문이 크게 다른 전승임을 암시하는 참고로만 취급했습니다.
  alternative_readings:
  - 그리스어의 ‘함정 가운데를 지나간다’는 경고문으로 번역
  rationale: 집회서에서는 히브리어가 보존된 경우 그 증언을 우선하는 편집 원칙이 이 절에 가장 잘 맞습니다. 따라서 본문은 히브리어 격언을 따르되, 전승 차이를 지우지 않았습니다.
  doctrine_reference: 'PHILOSOPHY.md: translate from Hebrew where Sirach survives; document major textual divergence honestly.'
