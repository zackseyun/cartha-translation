base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/009/020.yaml
  text: By your strength acquire your friend[b][a], and associate yourself with the wise.
  footnotes:
  - marker: a
    text: Or 'according to your ability, gain a friend.' The Hebrew can denote strength in the sense of capacity or means.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew verb here is uncommon in this form; the Greek parallel reads more specifically, 'take counsel with the wise.'
    reason: alternative_reading
translation:
  language: ko
  text: 능력에 따라 친구를 얻으십시오[a][b]. 그리고 지혜로운 이들과 어울리십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신의 힘으로 친구를 얻으십시오.’ 히브리어의 ‘힘’은 역량이나 수단을 뜻할 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 동사는 이 형태로는 드물며, 그리스어 평행본문은 더 구체적으로 ‘지혜로운 이들과 상의하십시오’라고 읽습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּכֹחֲךָ
  english_pob_choice: by your strength
  chosen_korean: 힘을 다해
  alternatives_korean:
  - 능력에 따라
  - 가지고 있는 힘으로
  lexicon: HALOT
  rationale: 히브리어는 단순한 수단보다 ‘힘/역량의 범위 안에서’라는 뜻을 담고 있으므로, 한국어에서는 자연스럽게 ‘힘을 다해’로 옮겨 원문의 역량 뉘앙스를 살렸습니다.
- source_word: קְנֵה
  english_pob_choice: acquire
  chosen_korean: 얻으십시오
  alternatives_korean:
  - 사십시오
  - 획득하십시오
  - 사귀십시오
  lexicon: HALOT
  rationale: 문맥상 상거래가 아니라 관계를 ‘얻다/만들다’는 뜻이므로, 직설적이면서도 어색하지 않은 ‘얻으십시오’를 택했습니다.
- source_word: רֵעֶךָ
  english_pob_choice: your friend
  chosen_korean: 친구
  alternatives_korean:
  - 벗
  - 이웃
  - 동무
  lexicon: HALOT
  rationale: 히브리어 רֵעַ는 친구·동반자·이웃을 아우를 수 있지만, 전후 문맥의 관계 형성 표현에는 ‘친구’가 가장 자연스럽고 넓게 통용됩니다.
- source_word: וְעִם חֲכָמִים תִּסְתַּיָּד
  english_pob_choice: associate yourself with the wise
  chosen_korean: 지혜로운 이들과 어울리십시오
  alternatives_korean:
  - 현자들과 상의하십시오
  - 지혜로운 사람들과 교제하십시오
  - 지혜로운 이들과 상담하십시오
  lexicon: HALOT
  rationale: 어근 형태가 다소 드물지만, 영어 POB가 반영한 바와 같이 ‘지혜로운 이들과 함께 지내고 관계를 맺다’는 방향이 적절하므로 ‘어울리다’로 옮겼습니다.
theological_decisions:
- issue: 히브리어 문장의 관계 형성 명령을 한국어에서 어떻게 보존할지
  chosen_reading: ‘얻으십시오 / 어울리십시오’로 두 개의 명령을 병렬로 살렸습니다.
  alternative_readings:
  - ‘사귀십시오 / 상담하십시오’
  - ‘만드십시오 / 상의하십시오’
  rationale: 본문은 지혜를 얻는 일반 원리보다, 실제로 친구와 지혜로운 사람들과의 관계를 적극적으로 형성하라는 권면입니다. 따라서 한국어에서도 행위성을 분명히 드러내는 동사로 옮겼습니다.
  doctrine_reference: '번역 원칙: source-direct, 문맥 우선'
