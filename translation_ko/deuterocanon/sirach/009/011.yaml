  text: Do not dine with her husband[a], and do not sit drinking with him while drunk.
  footnotes:
  - marker: a
    text: The Greek parallel reads, 'Do not envy the glory of a sinner, for you do not know what his downfall will be.' The surviving Hebrew here differs substantially from the Greek tradition.
    reason: alternative_reading
translation:
  language: ko
  text: 그 여자의 남편과 함께 식사하지 마십시오[a]. 또 그와 함께 술에 취한 채 앉아 있지 마십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 헬라어 병행 본문은 “죄인의 영광을 부러워하지 마십시오. 그의 파멸이 무엇일지 알지 못하기 때문입니다.”라고 읽습니다. 현존하는 히브리어 본문은 이와 상당히 다릅니다.
    reason: alternative_reading
lexical_decisions:
- source_word: עִם
  english_pob_choice: with
  chosen_korean: -와 함께
  alternatives_korean:
  - -와
  lexicon: HALOT
  rationale: 동반·동석의 관계를 직접 드러내기 위해 한국어에서도 ‘함께’로 풀었습니다.
- source_word: בַּעְלָהּ
  english_pob_choice: her husband
  chosen_korean: 그의 아내
  alternatives_korean:
  - 그 여자의 남편
  - 아내의 남편
  lexicon: HALOT
  rationale: 히브리어 בעלהּ는 문맥상 ‘그 여자의 남편’이지만, 한국어에서는 소유 관계를 자연스럽게 풀어 ‘그의 아내’로 옮겨 상호관계를 분명히 했습니다.
- source_word: אַל תִּטְעָם
  english_pob_choice: do not dine
  chosen_korean: 먹지 마십시오
  alternatives_korean:
  - 식사하지 마십시오
  - 맛보지 마십시오
  lexicon: HALOT
  rationale: 직역하면 ‘맛보다’이지만, 여기서는 사람과 함께하는 식사 상황을 가리키므로 자연스럽게 ‘먹다’로 옮겼습니다.
- source_word: וְאַל תָּסֵב
  english_pob_choice: and do not sit drinking
  chosen_korean: 술 취한 채 앉아 있지 마십시오
  alternatives_korean:
  - 함께 앉아 있지 마십시오
  - 술 마시며 앉아 있지 마십시오
  lexicon: HALOT
  rationale: תָּסֵב는 식탁에서 ‘앉다/비스듬히 앉다’의 뜻이 있고, 뒤의 שִׁכּוֹר이 음주 상태를 명시하므로 그 결합을 살려 자연스럽게 표현했습니다.
- source_word: שִׁכּוֹר
  english_pob_choice: while drunk
  chosen_korean: 술 취한 채
  alternatives_korean:
  - 취한 채
  - 술에 취해
  lexicon: HALOT
  rationale: 부사적으로 풀어 앞 동작의 상태를 수식하게 했고, 경고의 뉘앙스를 분명하게 했습니다.
theological_decisions:
- issue: 히브리어 본문과 헬라어 병행본문의 큰 차이
  chosen_reading: 주 본문은 현존하는 히브리어를 따라 ‘그의 아내와 함께 먹지 마십시오’로 옮기고, 헬라어의 다른 독법은 각주로 보존합니다.
  alternative_readings:
  - '헬라어 병행본문: ‘죄인의 영광을 부러워하지 마십시오. 그의 파멸이 무엇일지 알지 못하기 때문입니다.’'
  rationale: 집회서에서는 히브리어가 살아 있는 경우 히브리어를 우선하되, 전승 차이를 숨기지 않는 것이 원문 추적 가능성에 부합합니다.
  doctrine_reference: 'PHILOSOPHY.md: 히브리어 전승 우선, 전승 차이는 각주로 투명하게 표기'
- issue: ‘그의 아내’ 표현의 한국어 자연스러움
  chosen_reading: 히브리어 בעלהּ의 관계성을 유지하되, 한국어 어순에 맞게 소유 관계를 자연스럽게 풀었습니다.
  alternative_readings:
  - 그 여자의 남편
  - 아내와 함께
  rationale: 원문의 상호 관계와 사회적 경고를 살리면서도 한국어에서 어색하지 않도록 조정한 것입니다.
  doctrine_reference: 표준어 합쇼체와 직역성의 균형
