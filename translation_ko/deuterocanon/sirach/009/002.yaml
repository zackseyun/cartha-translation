translation:
  language: ko
  text: 당신의 영혼을 여자에게 주어서는 안 됩니다[a][b]—그녀가 당신의 높이 위를 밟게 하지 마십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '그리스어: ‘당신의 영혼을 여자에게 주지 말라, 그가 당신의 힘 위를 밟지 못하게 하라.’ 그리스어는 ‘높이’의 은유를 ‘힘’으로 풀어 줍니다.'
    reason: alternative_reading
  - marker: b
    text: 히브리어의 ‘당신의 높이들’은 지위, 존엄, 힘을 가리키는 비유일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תַּקְנֶא / μὴ δῷς
  english_pob_choice: Do not give
  chosen_korean: 주어서는 안 됩니다
  alternatives_korean:
  - 내주어서는 안 됩니다
  - 넘겨서는 안 됩니다
  - 마음을 주어서는 안 됩니다
  lexicon: HALOT; SBLGNT/LXX parallel
  rationale: 히브리어 동사 형태는 कठिन하지만, 그리스어 병행구가 ‘주다’(δῷς)로 뜻을 분명히 하므로 ‘주어서는 안 됩니다’가 원문 대조를 가장 잘 살립니다.
- source_word: נַפְשְׁךָ / τὴν ψυχήν σου
  english_pob_choice: your soul
  chosen_korean: 당신의 영혼
  alternatives_korean:
  - 당신 자신
  - 당신의 생명
  - 당신의 마음
  lexicon: HALOT
  rationale: פּשׁה/ψυχή의 기본적인 대응을 살리면서도, 문맥상 ‘자기 자신 전체’를 가리키는 의미를 한국어에서 자연스럽게 전달합니다.
- source_word: לְאִשָּׁה / γυναικί
  english_pob_choice: to a woman
  chosen_korean: 여자에게
  alternatives_korean:
  - 여인에게
  - 아내에게
  lexicon: HALOT; BDAG
  rationale: 히브리어와 그리스어 모두 일반적인 ‘여자/여인’을 뜻하며, ‘아내’로 좁히면 원문보다 해석이 강해집니다.
- source_word: עַל בָּמוֹתֶיךָ / ἐπὶ τὴν ἰσχύν σου
  english_pob_choice: on your heights
  chosen_korean: 당신의 높이 위를 밟게
  alternatives_korean:
  - 당신의 높은 곳을 밟게
  - 당신의 힘 위를 밟게
  - 당신의 지위를 짓밟게
  lexicon: HALOT; LXX contextual gloss
  rationale: 히브리어의 ‘높이들/높은 곳’ 이미지를 본문에 보존하되, 그리스어가 이를 ‘당신의 힘’으로 풀어주므로 ‘밟게’라는 구체적 동작을 유지해 두 전통을 함께 반영합니다.
