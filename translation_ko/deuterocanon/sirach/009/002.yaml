    reason: alternative_reading
  - marker: b
    text: 히브리어의 ‘당신의 높은 곳들’은 지위, 존엄 또는 힘을 가리키는 비유일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תַּקְנֶא / μὴ δῷς
  english_pob_choice: Do not give
  chosen_korean: 주어서는 안 됩니다
  alternatives_korean:
