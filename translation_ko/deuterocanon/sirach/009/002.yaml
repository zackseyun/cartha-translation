    issue: 본문의 ‘당신의 높이 위를 밟게 하지 마십시오’는 한국어 표현으로 부자연스럽고, 원문의 종속된 부정 목적/결과 구문을 중복된 독립 명령으로 처리합니다.
    rationale: ‘높은 곳을 밟도록’으로 옮기면 히브리어의 공간적 은유를 유지하면서도 문법적으로 자연스럽고, 앞 절과의 관계도 드러납니다.
  - severity: medium
    issue: 그리스어 각주에서 여성을 가리키는 대명사를 ‘그가’라고 했습니다.
    rationale: γυναικί 및 αὐτήν은 여성 단수이므로 ‘그녀가’가 맞습니다.
  - severity: low
