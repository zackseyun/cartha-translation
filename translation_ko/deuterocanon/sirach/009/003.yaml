translation:
  language: ko
  text: 낯선 여자[a]에게 가까이 가지 마십시오. 그러다가 그 여자의 올가미에 빠질 수 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘낯선 여자’ 또는 ‘외래의 여자’입니다. 지혜문학에서 이 표현은 때때로 혼인이나 성적 관계의 적절한 경계 밖에 있는 여자를 가리킬 수 있습니다.
    reason: lexical_alternative
