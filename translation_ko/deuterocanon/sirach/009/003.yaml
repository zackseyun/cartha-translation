translation:
  language: ko
  text: 낯선 여자에게 가까이 가지 마십시오. 그렇지 않으면 그의 올가미에 빠질까 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘낯선/외래의 여자’입니다. 지혜문학에서는 때때로 적절한 경계 밖의 여성, 곧 부적절한 성적 관계를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּקְרַב
  english_pob_choice: Do not approach
  chosen_korean: 가까이 가지 마십시오
  alternatives_korean:
  - 다가가지 마십시오
  - 접근하지 마십시오
  lexicon: HALOT
  rationale: 부정 명령의 금지 뉘앙스를 현대 한국어로 자연스럽게 옮기되, 단순한 물리적 거리만이 아니라 관계적 접근까지 포함하는 경고를 살렸습니다.
- source_word: אִשָּׁה זָרָה
  english_pob_choice: a foreign woman
  chosen_korean: 낯선 여자
  alternatives_korean:
  - 외국 여자
  - 이방 여자
  - 음란한 여자
  lexicon: HALOT
  rationale: 히브리어의 직역상 ‘낯선/외래의 여자’이지만, 지혜문학의 문맥에서는 혈통보다 부적절한 관계를 가리키는 경고로 읽히므로 한국어에서는 ‘낯선 여자’로 옮겨 과도한 민족적 의미를 피했습니다.
- source_word: בִּמְצוּדֹתֶיהָ
  english_pob_choice: into her snares
  chosen_korean: 그의 올가미에
  alternatives_korean:
  - 그녀의 올무에
  - 그녀의 덫에
  - 그녀의 그물에
  lexicon: HALOT
  rationale: ‘덫/그물/올가미’ 계열의 비유를 반영해야 하므로, 현대어에서 의미가 분명한 ‘올가미’를 택했습니다. 다만 인칭은 앞의 ‘여자’와 맞추어 ‘그녀의’가 자연스럽습니다.
theological_decisions:
- issue: 지혜문학의 ‘낯선 여자’ 표현의 범위
  chosen_reading: 본문에서는 ‘낯선 여자’로 유지해, 단순한 외국 여성이 아니라 경계해야 할 부적절한 관계라는 경고성을 드러냈습니다.
  alternative_readings:
  - 외국 여자
  - 음란한 여자
  - 창녀
  rationale: 히브리어와 그리스어 병행 전승은 성적·도덕적 위험을 암시하지만, 본문이 그 여성을 특정 직업이나 민족으로 단정하지는 않습니다. 따라서 원문의 긴장을 보존하는 쪽이 더 충실합니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
