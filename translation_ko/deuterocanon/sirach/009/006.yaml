    text: '그리스어: ‘네 영혼을 창녀들에게 주지 말라. 그러면 네 상속을 잃지 않게 될 것이다.’ 그리스어는 히브리어의 ‘노래하는 여자들’과 ‘그들의 입’보다 성적·도덕적 경고를 더 분명하게 표현합니다.'
    reason: alternative_reading
lexical_decisions:
- source_word: עִם מְנַגְּנוֹת
  english_pob_choice: with singing women
  chosen_korean: 노래하는 여자들과
  alternatives_korean:
  - 여성 연주자들과
  - 노래하는 여자들 가운데서
  lexicon: HALOT
  rationale: מְנַגְּנוֹת는 여성형 복수로 음악과 관련된 여성을 가리키므로, 본문의 이미지를 살리면서도 자연스러운 합쇼체로 옮겼습니다.
- source_word: אַל תִּדְמוֹךְ
  english_pob_choice: Do not associate with / consort
  chosen_korean: 어울리지 마십시오
  alternatives_korean:
  - 가까이 지내지 마십시오
  - 교제하지 마십시오
  lexicon: HALOT
  rationale: 동사의 형태와 문맥이 다소 불확실하지만, 가까운 관계·동반을 경계하는 금지로 이해하는 것이 타당하므로, 과도하게 딱딱하지 않은 ‘어울리다’를 택했습니다.
- source_word: פֶּן יִשְׂרְפֻךָ
  english_pob_choice: lest they burn you
  chosen_korean: 그러다가는 … 타버릴까 두렵습니다
  alternatives_korean:
  - 그들이 당신을 태울까 두렵습니다
  - 그들의 말로 당신이 불탈까 두렵습니다
  lexicon: HALOT
  rationale: 직역의 ‘태우다/불태우다’ 이미지를 유지하되, 경고의 결과를 한국어 관용으로 자연스럽게 풀어 ‘타버릴까 두렵습니다’로 옮겼습니다.
- source_word: בְּפִיפִיֹתָם
  english_pob_choice: by their mouths
  chosen_korean: 그들의 입으로 말미암아
  alternatives_korean:
  - 그들의 입을 통해
  - 그들의 말로
  lexicon: HALOT
  rationale: ‘입’이라는 구체적 이미지를 보존하면서도, 실제로는 그들이 내뱉는 말이나 노래를 통한 해악임을 드러내기 위해 ‘말미암아’를 사용했습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행본문의 차이
  chosen_reading: 주본문은 현존하는 히브리어의 이미지를 따라 ‘노래하는 여자들’과 ‘그들의 입’의 표현을 유지했습니다.
  alternative_readings:
  - 그리스어를 따라 ‘창녀들’과 ‘상속’을 명시하는 번역
  rationale: 시락서는 히브리어가 보존된 곳에서는 히브리어를 우선하되, 그리스어가 해석상의 차이를 드러내는 경우 주석적 대안으로 남기는 것이 본 프로젝트 원칙에 맞습니다.
  doctrine_reference: 'PHILOSOPHY.md: translate from Hebrew where Sirach survives; use Greek parallel as actual input'
