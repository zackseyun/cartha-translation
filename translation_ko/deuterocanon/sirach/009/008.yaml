base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/009/008.yaml
  text: Do not give yourself to a prostitute[b][a], lest you squander your inheritance.
  footnotes:
  - marker: a
    text: 'Greek: ''Turn your eye away from a beautiful woman, and do not study another''s beauty; for by a woman''s beauty many have gone astray, and from this passion blazes up like fire.'' The Greek witness here is substantially fuller than the surviving Hebrew.'
    reason: alternative_reading
  - marker: b
    text: Hebrew 'your inheritance' may refer to one's estate or hereditary portion; the warning is that sexual folly can divert or forfeit what belongs to you.
    reason: lexical_alternative
translation:
  language: ko
  text: 창녀에게 너 자신을 내주지 마십시오. 그리하면 네 유산을 잃게 됩니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 전승은 “아름다운 여자를 돌이켜 보지 말며, 남의 아름다움을 탐구하지 말라”로 더 길게 전합니다. 이는 현존 히브리어보다 상당히 풍부한 이본입니다.
    reason: textual_variant
  - marker: b
    text: 히브리어의 ‘유산’은 상속 재산, 몫, 또는 자기 몫의 소유를 가리킬 수 있습니다. 여기서는 성적 어리석음이 실제 소유를 잃게 할 수 있다는 경고로 이해했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּתֵּן
  english_pob_choice: Do not give yourself
  chosen_korean: 너 자신을 내주지 마십시오
  alternatives_korean:
  - 주지 마십시오
  - 내어주지 마십시오
  - 몸을 맡기지 마십시오
  lexicon: HALOT
  rationale: נתן의 금지 명령을 한국어에서 자연스럽게 풀어 ‘자신을 내주다’로 옮기면, 단순한 물건 전달이 아니라 자기 자신을 내어맡기는 뜻을 잘 드러냅니다.
- source_word: לְזוֹנָה
  english_pob_choice: to a prostitute
  chosen_korean: 창녀에게
  alternatives_korean:
  - 매춘부에게
  - 음행하는 여자에게
  - 창부에게
  lexicon: HALOT
  rationale: זוֹנָה는 본문 맥락상 성적 유혹의 대상이 되는 여성을 가리키므로, 현대 한국어에서 가장 직접적인 ‘창녀’가 의미를 가장 분명하게 전달합니다.
- source_word: נַפְשְׁךָ
  english_pob_choice: yourself
  chosen_korean: 너 자신
  alternatives_korean:
  - 네 영혼
  - 네 생명
  - 네 몸
  lexicon: HALOT
  rationale: נפש는 여기서 영혼만이 아니라 사람 전체, 곧 자기 자신을 뜻하므로 ‘너 자신’이 가장 자연스럽고 정확합니다.
- source_word: נַחֲלָתֶךָ
  english_pob_choice: your inheritance
  chosen_korean: 네 유산
  alternatives_korean:
  - 네 상속분
  - 네 몫
  - 네 재산
  lexicon: HALOT
  rationale: נחלה는 상속 재산과 몫을 아우르므로, 한국어에서는 소유와 상속의 뉘앙스를 함께 살리는 ‘유산’이 적절합니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행본문의 차이
  chosen_reading: 본문은 현존 히브리어를 따르되, 그리스어가 더 긴 다른 전승임을 주석으로 보존했습니다.
  alternative_readings:
  - 그리스어에 따라 ‘아름다운 여자를 보지 말라’로 옮기기
  rationale: 지혜문헌에서 히브리어가 남아 있을 때는 이를 본문으로 삼아야 하며, 그리스어는 의미 범위를 넓히는 중요한 증거이지만 본문을 대체할 정도로 우세하지는 않습니다.
  doctrine_reference: 'PHILOSOPHY.md: 현존 히브리어 우선, 이본은 투명하게 보존'
- issue: ‘네 유산’의 윤리적 경고
  chosen_reading: 성적 타락이 단지 도덕적 실패가 아니라 실제 상속과 삶의 몫을 잃게 할 수 있다는 경고로 읽었습니다.
  alternative_readings:
  - 단지 물질적 재산만 잃는 경고로 제한하기
  - 비유적으로 인생의 전반적 손실로만 이해하기
  rationale: 히브리어 נחלה는 재산과 상속 몫을 가리키지만, 지혜문학에서는 삶 전체의 결과를 포함할 수 있어 경고의 현실성을 살리는 번역이 필요합니다.
  doctrine_reference: 지혜문학의 실천적 경고, 문맥 우선 해석
