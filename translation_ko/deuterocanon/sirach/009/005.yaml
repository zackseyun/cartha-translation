    rationale: 이 동사는 자신을 욕되게 하다, 비천하게 하다, 수치스럽게 하다는 뜻이며, ‘타락하다’는 원문에 없는 윤리적·성적 함의를 상대적으로 강하게 부과할 수 있습니다.
