  source_fidelity: 히브리어의 반사형 לְהִתְנַבֵּל은 자신을 욕되게 하거나 비천하게 만드는 뜻이므로, ‘타락시키다’보다 ‘욕되게 하다’가 더 직접적이며 불필요하게 특정한 도덕적·성적 의미를 덧붙이지 않습니다. אֲחַר בֵּיתָהּ은 난해하지만 ‘그 집 뒤에서’라고 하면 물리적으로 집 뒤에 있다는 뜻으로 읽혀 히브리어의 ‘뒤를 좇아/추구하여’라는 가능성을 잘못 전달합니다.
  naturalness: ‘눈에 보이는 것을 보고’는 의미는 통하지만 같은 어근의 반복으로 다소 군더더기가 있습니다. ‘눈에 보이는 것으로’는 원문의 수단·계기 표현을 간결하게 살립니다. ‘그녀의 집을 좇다가 황폐하게 되지 마십시오’는 난해함을 보존하면서도 현대 표준어로 이해 가능합니다.
  terminology: ‘욕되게 하다’는 נבל의 자기비하·자기망신의 반사적 뉘앙스를 자연스럽게 옮깁니다. ‘황폐하게 되다’는 שמם의 강한 파괴·폐허화 이미지를 유지합니다. 여성 단수 접미사를 반영하여 ‘그녀의 집’으로 명시합니다.
  issues:
