  text: Do not debase yourself by the sight of your eyes[b][a], nor be appalled after her house.
  footnotes:
  - marker: a
    text: 'Greek parallel: ''Do not scrutinize a virgin, lest you stumble in the reproaches/penalties connected with her.'' The Hebrew and Greek differ substantially in this verse.'
