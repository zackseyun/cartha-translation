base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/009/005.yaml
  text: Do not debase yourself by the sight of your eyes[b][a], nor be appalled after her house.
  footnotes:
  - marker: a
    text: 'Greek parallel: ''Do not scrutinize a virgin, lest you stumble in the reproaches/penalties connected with her.'' The Hebrew and Greek differ substantially in this verse.'
    reason: alternative_reading
  - marker: b
    text: Hebrew 'after her house' is difficult and may imply pursuing her household or being ruined because of involvement with her domestic sphere.
    reason: lexical_alternative
translation:
  language: ko
  text: 눈에 보이는 것으로 스스로를 욕되게 하지 말며, 그녀의 집을 좇다가 황폐하게 되지 마십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 평행문은 ‘처녀를 살피지 말라. 그렇지 않으면 그녀와 관련된 책망/벌에 걸려 넘어질 것이다’로 읽습니다. 이 절의 히브리어와 그리스어는 상당히 다릅니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어의 ‘그녀의 집을 좇다가’는 난해한 표현입니다. 그녀의 집안이나 가정을 추구하는 것, 또는 그와 관련된 일 때문에 파멸하는 것을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהִתְנַבֵּל
  english_pob_choice: debase yourself
  chosen_korean: 스스로를 타락시키지
  alternatives_korean:
  - 스스로를 수치스럽게 하지
  - 스스로를 비천하게 하지
  - 스스로를 더럽히지
  lexicon: HALOT
  rationale: 히트파엘형은 자기 자신을 낮추거나 수치스럽게 만드는 반사적 뉘앙스를 가지므로, 현대 한국어에서는 도덕적 추락을 분명히 드러내는 ‘스스로를 타락시키지’가 가장 자연스럽고 경고의 힘도 살립니다.
- source_word: בְּמַרְאֵה עֵינֵיךָ
  english_pob_choice: by the sight of your eyes
  chosen_korean: 눈에 보이는 것을 보고
  alternatives_korean:
  - 눈앞에 보이는 광경으로
  - 눈으로 보는 것으로
  - 눈앞의 모습에 의해
  lexicon: HALOT
  rationale: 직역하면 ‘네 눈의 보임/모습으로’이지만, 한국어에서는 시각적 유혹을 뜻하는 관용적 의미가 더 분명하도록 ‘눈에 보이는 것을 보고’로 옮겼습니다.
- source_word: וּלְשׁוֹמֵם
  english_pob_choice: be desolated
  chosen_korean: 황폐해지지
  alternatives_korean:
  - 황폐하게 되지
  - 폐허가 되지
  - 앗아가듯 무너져 버리지
  lexicon: HALOT
  rationale: שמם은 ‘황폐하게 되다, 황량해지다, 무너져 버리다’의 강한 파괴감을 지니므로, POB의 보존 의도를 따라 ‘황폐해지지’로 옮겼습니다.
- source_word: אֲחַר בֵּיתָהּ
  english_pob_choice: after her house
  chosen_korean: 그 집 뒤에서
  alternatives_korean:
  - 그 집 뒤를 따라
  - 그 집을 따라
  - 그 집과 관련하여
  lexicon: HALOT
  rationale: 히브리어가 매우 압축적이고 난해하므로, 표면형을 유지하되 한국어에서 어색하지 않게 ‘그 집 뒤에서’로 두어 본문상의 난점을 드러냈습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 평행문의 현저한 차이
  chosen_reading: 주본문은 현존 히브리어를 따라 번역하되, 그리스어의 ‘처녀를 살피지 말라’는 다른 경고는 각주로 노출했습니다.
  alternative_readings:
  - 그리스어에 따라 ‘처녀를 살피지 말라, 그렇지 않으면 그녀의 책망/벌에 걸려 넘어질 것이다’로 옮길 수 있음
  rationale: 집회서에서는 히브리어가 살아 있는 곳을 우선하되, 여기서는 그리스어가 단순한 어휘 차이가 아니라 경고 자체를 다르게 전하므로 차이를 숨기지 않는 것이 본문에 더 충실합니다.
  doctrine_reference: 'PHILOSOPHY.md: Hebrew priority where extant; preserve substantial textual divergence transparently'
