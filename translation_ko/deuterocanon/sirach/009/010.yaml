translation:
  language: ko
  text: 한 늙은 친구를 저버리지 마십시오. 새 친구는 그에게 견줄 수 없기 때문입니다. 새 친구는 새 포도주와 같아서, 그것이 오래되면 당신은 기쁨으로 그것을 마시게 될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문 전승상 이 절의 히브리어는 다른 전승과 어긋나는 난점이 보고되지만, 본 번역은 현재 제시된 히브리어 본문에 따라 옮겼습니다.
    reason: source_note
lexical_decisions:
- source_word: Μὴ ἐγκαταλίπης
  english_pob_choice: Do not abandon
  chosen_korean: 저버리지 마십시오
  alternatives_korean:
  - 버리지 마십시오
  - 떠나지 마십시오
  lexicon: LSJ
  rationale: 관계의 단절과 외면을 드러내는 동사로, 단순한 물리적 이탈보다 인간관계를 끊어버리는 뉘앙스를 살렸습니다.
- source_word: φίλον ἀρχαῖον
  english_pob_choice: an old friend
  chosen_korean: 한 늙은 친구
  alternatives_korean:
  - 오래된 친구
  - 오랜 친구
  lexicon: LSJ
  rationale: ἀρχαῖον의 핵심은 오래된 관계의 지속성이므로, 비교되는 '새 친구'와의 대비를 살리기 위해 '늙은'을 택했습니다.
- source_word: οὐκ ἔστιν ἔφισος αὐτῷ
  english_pob_choice: is not equal to him
  chosen_korean: 그에게 견줄 수 없기 때문입니다
  alternatives_korean:
  - 그와 같지 않기 때문입니다
  - 그의 짝이 될 수 없기 때문입니다
  lexicon: LSJ
  rationale: 직역보다 비교의 힘을 자연스럽게 드러내며, 우열/대등성의 부정을 분명히 전달합니다.
- source_word: οἶνος νέος
  english_pob_choice: new wine
  chosen_korean: 새 포도주
  alternatives_korean:
  - 새 술
  - 갓 빚은 포도주
  lexicon: LSJ
  rationale: 포도주 비유를 한국어로 자연스럽게 옮기되, 원문의 이미지와 비유 관계를 유지했습니다.
theological_decisions:
- issue: 이 본문의 핵심 경구 구조를 한국어에서 어떻게 살릴지
  chosen_reading: 간결한 금지문 뒤에 이유절과 비유문을 이어, 잠언적 리듬을 유지했습니다.
  alternative_readings:
  - 설명적으로 풀어 쓰기
  - 문장 순서를 크게 재배열하기
  rationale: 집약된 격언 형식을 보존해야 본문의 설득력과 기억 가능성이 살아납니다. 따라서 원문의 병렬성과 대비를 최대한 유지했습니다.
  doctrine_reference: 집회서 9:10의 잠언체 문맥
