  naturalness: ‘한 늙은 친구’는 한국어에서 사람을 노쇠하다는 뜻으로 부르는 인상이 있어, 관계의 오래됨을 뜻하는 φίλον ἀρχαῖον에는 ‘오랜 친구’가 자연스럽습니다. 나머지 격언 구조는 간결하게 유지할 수 있습니다.
  terminology: ‘저버리지 마십시오’도 가능하지만, 이 문맥에서는 ‘버리지 마십시오’가 ἐγκαταλίπης의 관계적 유기를 자연스럽고 직접적으로 나타냅니다. ‘새 포도주’는 적절합니다. ‘그와 같지 않기 때문입니다’는 새 친구가 옛 친구에 미치지 못한다는 비교를 유지합니다.
