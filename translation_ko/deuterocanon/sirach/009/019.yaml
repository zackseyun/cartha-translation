base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/009/019.yaml
  text: Know that you will tread among traps, and walk about up to a net.
  footnotes:
  - marker: a
    text: 'The surviving Hebrew reads, ''Know that you will tread among traps, and walk about up to a net.'' The Greek tradition for this verse differs substantially: ''A talkative man is feared in his city, and the one rash in his speech will be hated.'' The translation follows the extant Hebrew as the primary witness here, while preserving awareness of the divergent Greek parallel.'
    reason: textual_variant
translation:
  language: ko
  text: 알아 두십시오. 당신은 덫들 사이를 걷고, 그물 가까이에서 돌아다니게 될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 현존 히브리어는 “알아 두십시오. 당신은 덫들 사이를 걷고, 그물 가까이에서 돌아다니게 될 것입니다”라고 읽습니다. 그리스어 전승은 이 절을 크게 다르게 전하며, “도시에서 말이 많은 사람은 두려움의 대상이며, 자기 말에 성급한 자는 미움을 받는다”라고 합니다.
    reason: textual_variant
lexical_decisions:
- source_word: דַּע
  english_pob_choice: Know
  chosen_korean: 알아 두십시오
  alternatives_korean:
  - 아십시오
  - 기억하십시오
  lexicon: HALOT
  rationale: ידע의 명령형을 한국어의 자연스러운 합쇼체 경고문으로 옮기되, 단순 정보 전달이 아니라 주의 환기의 뉘앙스를 살렸습니다.
- source_word: בֵּין פַּחִים
  english_pob_choice: among traps
  chosen_korean: 덫들 사이를
  alternatives_korean:
  - 덫들 가운데를
  - 올무들 사이를
  lexicon: HALOT
  rationale: פַּחִים은 숨겨진 위험의 ‘덫/올무’ 이미지이므로, 일상적이면서도 직관적인 ‘덫들’로 옮겼습니다.
- source_word: תִּצְעָד
  english_pob_choice: you will tread
  chosen_korean: 걷고
  alternatives_korean:
  - 디디고 가고
  - 발을 디디며
  lexicon: HALOT
  rationale: צעד의 ‘딛다/걷다’라는 구체성을 살리면서도 한국어 문맥에서는 자연스러운 진행형 표현으로 처리했습니다.
- source_word: וְעַד רֶשֶׁת
  english_pob_choice: up to a net
  chosen_korean: 그물 가까이에서
  alternatives_korean:
  - 그물까지
  - 그물 곁까지
  lexicon: HALOT
  rationale: עַד의 공간적 한계를 한국어에서 어색하지 않게 풀어, ‘그물’과의 근접성을 유지했습니다.
- source_word: תִּתְהַלָּךְ
  english_pob_choice: walk about
  chosen_korean: 돌아다니게 될 것입니다
  alternatives_korean:
  - 다니게 될 것입니다
  - 거닐게 될 것입니다
  lexicon: HALOT
  rationale: 히트파엘 הלך의 지속적·반복적 움직임을 ‘돌아다니다’로 살려, 단순한 일회적 ‘걷다’보다 진행성을 드러냈습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행본문의 차이
  chosen_reading: 본문은 현존 히브리어 ‘덫들 사이를 걷고, 그물 가까이에서 돌아다닌다’의 이미지를 따릅니다.
  alternative_readings:
  - 그리스어 병행본문의 ‘도시에 있는 수다스러운 사람’과 ‘말에 성급한 사람은 미움을 받는다’
  rationale: 이 절은 보존된 히브리어와 그리스어 전통이 상당히 다르므로, 본문 번역은 히브리어를 따르되 상이한 그리스어 전승의 존재는 오해 없이 남겨 두어야 합니다.
  doctrine_reference: 본문비평 / 전승 차이
