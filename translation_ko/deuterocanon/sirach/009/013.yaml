translation:
  language: ko
  text: 죽일 권한이 있는 사람에게서 멀리 떨어져 있으십시오. 그러면 죽음의 두려움을 품지 않게 될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 현존 히브리어 전승은 본문의 그리스어 전승과 다른 격언을 전합니다. “옛 친구를 버리지 마십시오. 새 친구는 그에 견줄 수 없기 때문입니다.”
    reason: textual_variant
lexical_decisions:
- source_word: μακρὰν ἄπεχε
  english_pob_choice: Keep far away
  chosen_korean: 멀리 떨어져 있으십시오
  alternatives_korean:
  - 멀리 떨어지십시오
  - 아주 멀리 떨어져 있으십시오
  lexicon: LSJ
  rationale: 그리스어 명령형의 적극적인 거리 두기 의미를 자연스러운 현대 한국어로 옮겼습니다.
- source_word: ἀπὸ ἀνθρώπου
  english_pob_choice: from a man
  chosen_korean: 사람에게서
  alternatives_korean:
  - 한 사람에게서
  - 남자에게서
  lexicon: LSJ
  rationale: 문맥상 특정 개인을 가리키므로, 성별을 과도하게 드러내지 않으면서도 일반적으로 읽히는 ‘사람’으로 옮겼습니다.
- source_word: ὃς ἔχει ἐξουσίαν
  english_pob_choice: who has authority
  chosen_korean: 권세를 가진
  alternatives_korean:
  - 권한을 가진
  - 권세가 있는
  lexicon: BDAG
  rationale: ἐξουσία는 단순한 능력보다 사회적으로 인정된 권세·권한을 가리키므로 ‘권세’가 본문 경고의 뉘앙스를 잘 살립니다.
- source_word: τοῦ φονεῦσαι
  english_pob_choice: to kill
  chosen_korean: 죽일
  alternatives_korean:
  - 죽이게 할
  - 살해할
  lexicon: LSJ
  rationale: 무고한 살인인지 여부를 좁히지 않고, 생명을 빼앗을 수 있는 능력을 직접적으로 표현했습니다.
- source_word: φόβον θανάτου
  english_pob_choice: death
  chosen_korean: 죽음을 두려워하지 않게 될 것입니다
  alternatives_korean:
  - 죽음의 두려움을 갖지 않게 될 것입니다
  - 죽음을 두려워할 필요가 없게 될 것입니다
  lexicon: LSJ
  rationale: 헬라어의 ‘죽음에 대한 두려움’은 한국어에서 결과 절로 풀어 자연스럽게 전달하는 것이 적절합니다.
theological_decisions:
- issue: 히브리어와 그리스어의 현저한 불일치
  chosen_reading: 그리스어 전승의 경고문을 본문으로 옮기고, 히브리어는 각주로 대조를 남겼습니다.
  alternative_readings:
  - ‘옛 친구를 버리지 말라, 새 친구는 그를 대신하지 못한다’
  rationale: 이 절은 현존 히브리어와 그리스어가 서로 다른 격언을 전하므로, 본문은 POB의 그리스어 우선 판단을 따르되 대조 정보를 각주로 보존했습니다.
  doctrine_reference: 'PHILOSOPHY.md: major mismatch가 표시된 경우 병행 전승의 실제 의미를 투명하게 반영하고, 이견은 주석으로 유지한다.'
