  text: Do not gaze at a virgin[b][a], lest you be ensnared by the penalties concerning her.
  footnotes:
  - marker: a
    text: 'Greek reads: ''Do not look around in the streets of a city, and do not wander in its deserted places.'' The surviving Hebrew and Greek witnesses differ substantially here.'
    reason: alternative_reading
  - marker: b
    text: Or 'lest you be caught in the penalties connected with her.' The Hebrew phrase is compressed and may refer to the consequences attached to involvement with her.
    reason: lexical_alternative
translation:
  language: ko
  text: 처녀를 주의 깊게 바라보지 마십시오. 그러다가 그와 관련된 형벌에 걸릴까 두렵습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 ‘도시의 거리들에서 두리번거리지 말고, 그 도시의 버려진 곳들에서 헤매지 말라’로 읽습니다. 현존 히브리어와 크게 다릅니다.
    reason: textual_variant
  - marker: b
    text: 히브리어는 간결한 표현으로, ‘그녀와 관련된 벌’ 또는 ‘그녀에게 딸린 처벌’처럼 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּבְתוּלָה
  english_pob_choice: at a virgin
  chosen_korean: 처녀를
  alternatives_korean:
  - 처녀에게
  - 처녀를 향해
  - 처녀 앞에서
  lexicon: HALOT
  rationale: בְּתוּלָה는 보통 ‘처녀’를 가리키므로, 보다 넓은 ‘소녀/처녀 여자’보다 구체적인 의미를 살렸습니다.
- source_word: אַל תִּתְבּוֹנֵן
  english_pob_choice: Do not gaze
  chosen_korean: 주의 깊게 바라보지 마십시오
  alternatives_korean:
  - 응시하지 마십시오
  - 눈여겨보지 마십시오
  - 유심히 보지 마십시오
  lexicon: HALOT
  rationale: hitbonen은 단순한 시선이 아니라 오래 머무는 주의 깊은 응시를 뜻하므로, 경고의 뉘앙스를 살려 옮겼습니다.
- source_word: פֶּן
  english_pob_choice: lest
  chosen_korean: 그러다가 … 두렵습니다
  alternatives_korean:
  - 그렇지 않도록
  - 혹시 … 않도록
  - 아니면
  lexicon: HALOT
  rationale: 경고를 이끄는 פֶּן의 예방적 의미를 한국어로 자연스럽게 드러내기 위해 결과절을 두려움 표현으로 처리했습니다.
- source_word: בַּעֲנָשֶׁיהָ
  english_pob_choice: by the penalties concerning her
  chosen_korean: 그와 관련된 형벌에
  alternatives_korean:
  - 그녀에게 붙은 형벌에
  - 그와 연관된 벌에
  - 그녀의 형벌에
  lexicon: HALOT
  rationale: 히브리어 표현이 압축적이어서, ‘그녀의 형벌’처럼 단정하기보다 ‘관련된 형벌’로 옮겨 의미의 긴장을 보존했습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 평행본의 차이
  chosen_reading: 히브리어 본문을 본문으로 번역하고, 그리스어의 도시 거리 경고는 각주로 보존하지 않았습니다.
  alternative_readings:
  - 그리스어에 따라 ‘도시의 거리들을 두리번거리지 마십시오’로 옮김
  - 두 전승을 절충한 일반적 유혹 경고로 평탄화
  rationale: 이 절은 현존 히브리어가 분명하므로 그 본문을 따르는 것이 원칙이며, 그리스어는 상당히 다른 평행 전승이므로 본문에 섞지 않는 편이 출처 충실성을 지킵니다.
  doctrine_reference: 'PHILOSOPHY.md: Sirach는 현존 히브리어를 우선하되, 의미 차이는 숨기지 말고 보존한다'
