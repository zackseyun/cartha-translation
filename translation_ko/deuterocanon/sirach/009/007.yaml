  source_fidelity: 히브리어 본문을 따라 בְּתוּלָה를 ‘처녀’, 히트파엘 תִּתְבּוֹנֵן을 지속적·주의 깊은 바라봄으로 옮긴 것은 적절합니다. 다만 ‘그와 관련된’은 여성 단수 접미사 הָ를 받는 대상을 가리키기에 부정확하므로 ‘그녀와 관련된’으로 고쳐야 합니다. פֶּן이 이끄는 경고의 결과절도 화자의 주관적 두려움처럼 들리지 않게 다듬는 것이 좋습니다.
  naturalness: ‘그러다가 … 걸릴까 두렵습니다’는 명령문 뒤에서 화자가 두려워한다는 뜻으로 읽힐 수 있어 자연스럽지 않습니다. ‘… 걸릴까 염려됩니다’는 한국어 경고 문맥에서 자연스럽고, 원문의 예방적 경고를 보존합니다. ‘유심히 바라보다’는 현대 표준어 합쇼체에 잘 맞습니다.
  terminology: ‘처녀’는 בְּתוּלָה의 어휘적 특정성을 보존합니다. עֲנָשֶׁיהָ의 관계는 압축되어 있으므로 ‘그녀와 관련된 형벌’로 유지하되, 각주에서 이것이 그녀에게 내려지는 형벌로만 단정되지 않음을 밝혀 두는 것이 적절합니다. 그리스어의 현저히 다른 전승을 각주로 보존한 점도 적절합니다.
