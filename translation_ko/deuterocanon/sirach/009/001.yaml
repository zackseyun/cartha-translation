base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/009/001.yaml
  text: Do not be jealous of the wife in your bosom[c][b][a], lest you teach against yourself an evil lesson.
  footnotes:
  - marker: a
    text: Or, 'Do not envy your wife.' The Hebrew verb can cover both jealousy and envy, but the marital context favors 'be jealous.'
    reason: lexical_alternative
  - marker: b
    text: Literally, 'the wife in your bosom,' an idiom for one's intimate wife.
    reason: cultural_note
  - marker: c
    text: The Hebrew reads simply 'evil,' while the Greek parallel has 'evil instruction/discipline.' The translation makes that sense explicit as 'an evil lesson.'
    reason: alternative_reading
translation:
  language: ko
  text: 자기 품에 있는 아내를 질투하지 마십시오[a][b]. 그렇지 않으면 스스로에게 악한 교훈을 가르치게 될 것입니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 ‘질투하다’와 ‘시기하다’의 뜻을 함께 가질 수 있으나, 혼인 문맥에서는 ‘질투하다’가 더 자연스럽습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘자기 품에 있는 아내’라는 뜻으로, 자기 아내를 가리키는 친밀한 관용구입니다.
    reason: cultural_note
  - marker: c
    text: 히브리어는 명시적으로 ‘악한 것’ 또는 ‘악’만을 말합니다. 그리스어 평행본문은 ‘악한 훈육/교훈’을 말하므로, 본문은 그 뜻을 밝혀 ‘악한 교훈’으로 옮겼습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תְּקַנֵּא
  english_pob_choice: Do not be jealous
  chosen_korean: 질투하지 마십시오
  alternatives_korean:
  - 시기하지 마십시오
  - 의심하지 마십시오
  lexicon: HALOT
  rationale: 히브리어 קנא는 질투와 시기의 뜻을 함께 가질 수 있으며, 혼인 문맥에서는 ‘질투하다’가 가장 직접적으로 맞습니다.
- source_word: אֵשֶׁת חֵיקֶךָ
  english_pob_choice: the wife in your bosom
  chosen_korean: 네 품의 아내
  alternatives_korean:
  - 네 아내
  - 품에 안은 아내
  lexicon: HALOT
  rationale: חיק는 문자적으로 ‘품, 가슴’이어서 친밀한 아내를 가리키는 관용구입니다. 한국어에서는 ‘네 품의 아내’로 이미지와 의미를 함께 살렸습니다.
- source_word: תִּלְמַד עָלֶיךָ
  english_pob_choice: you teach against yourself
  chosen_korean: 스스로에게 … 가르치게 되기
  alternatives_korean:
  - 자기 자신에게 … 배우게 되기
  - 자기 자신에게 … 가져오게 되기
  lexicon: HALOT
  rationale: Kahana 본문과 그리스어 παράλληλ로 ‘가르치다’의 뜻이 분명하므로, 결과를 나타내는 한국어 표현으로 옮기되 ‘against yourself’의 자해적 방향을 ‘스스로에게’로 반영했습니다.
- source_word: רָעָה
  english_pob_choice: an evil lesson
  chosen_korean: 악한 교훈
  alternatives_korean:
  - 악
  - 악한 가르침
  - 해로운 교훈
  lexicon: HALOT
  rationale: 히브리어는 단순히 ‘악’이지만, 그리스어의 παιδείαν πονηράν은 ‘악한 훈육/교훈’을 가리키므로 POB의 문맥적 해석을 따라 ‘악한 교훈’으로 표현했습니다.
theological_decisions:
- issue: 경고의 결과절 표현
  chosen_reading: ‘그러다가 스스로에게 악한 교훈을 가르치게 되기 때문입니다’로, 자기 파괴적 결과를 분명히 드러냈습니다.
  alternative_readings:
  - ‘그래서 스스로 악을 배우게 되기 때문입니다’
  - ‘그렇지 않으면 해를 입게 되기 때문입니다’
  rationale: 이 절은 단순한 도덕 교훈이 아니라, 질투가 자기 자신을 해치는 왜곡된 배움으로 이어진다는 경고입니다. 그 긴장을 약화시키지 않기 위해 ‘가르치게 되기’와 ‘악한 교훈’을 유지했습니다.
  doctrine_reference: 지혜문학의 훈계 구조와 자해적 죄의 결과에 대한 일반적 성경적 경고
