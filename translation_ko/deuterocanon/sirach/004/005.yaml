  source_fidelity: 히브리어는 ‘비통한 영으로/자기 영혼의 고통 가운데 부르짖는 이’와 ‘그의 부르짖음 소리를 그의 반석이 들을 것이다’라는 구성을 담고 있습니다. 초안은 두 번째 절을 ‘들으시면’으로 처리하여 조건절을 불필요하게 만들고, ‘그의 바위가 들으십니다’는 주어와 경어법의 결합이 부자연스럽습니다. ‘반석’은 צוּרוֹ의 신적 은유를 한국어 성서 문체에서 자연스럽게 보존합니다.
  naturalness: ‘비통한 영’과 ‘그의 영혼의 고통 속에서’의 중첩은 다소 직역투이며, 첫 문장이 ‘자입니다’로 끝나 문맥상 독립된 진술로 성립하지 않습니다. ‘비통한 마음으로 자기 영혼의 고통 가운데 부르짖는 이’로 연결하고, 술어를 ‘들으실 것입니다’로 명료하게 제시하는 편이 현대 한국어 합쇼체에 자연스럽습니다.
  terminology: צוּרוֹ는 하나님을 가리키는 은유적 칭호이므로 ‘그의 반석’으로 옮기고 주석에서 그 점을 밝혔습니다. ‘바위’도 직역상 가능하나, 한국어 성서에서 신적 칭호로 쓰이는 ‘반석’이 자연스럽고 은유의 기능을 더 잘 전달합니다. נפש는 여기서 내적 고통을 나타내므로 ‘영혼’을 유지할 수 있으며, רוּחַ는 한국어 관용상 ‘마음’으로 처리했습니다.
