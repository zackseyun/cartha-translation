translation:
  language: ko
  text: 비통한 마음으로 자기 영혼의 고통 가운데 부르짖는 이의 부르짖는 소리를 그의 반석께서[a] 들으실 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그의 반석’은 히브리어 본문에 나오는 하나님을 가리키는 은유적 칭호입니다. 그리스어 평행본문은 이 대목을 “구걸하는 자에게서 눈을 돌리지 말며, 사람이 너를 저주할 기회를 주지 말라”라고 다르게 전합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: צוֹעֵק
  english_pob_choice: one crying out
  chosen_korean: 부르짖는 자
  alternatives_korean:
  - 부르짖고 있는 사람
  - 울부짖는 자
  - 외치는 자
  lexicon: HALOT
  rationale: פעול/분사형의 지속적 행위를 살려, 단순한 신분명보다 ‘부르짖는 자’로 옮겨 현재 진행되는 절규를 드러냈습니다.
- source_word: מַר רוּחַ
  english_pob_choice: in bitter spirit
  chosen_korean: 비통한 영으로
  alternatives_korean:
  - 쓴 영으로
  - 쓴 마음으로
  - 비통한 마음으로
  lexicon: HALOT
  rationale: 직역에 가까운 ‘쓴 영’은 한국어에서 다소 거칠어, 본문의 내면적 고통을 살리면서도 자연스러운 ‘비통한 영’으로 다듬었습니다.
- source_word: בִּכְאֵב נַפְשׁוֹ
  english_pob_choice: in the pain of his soul
  chosen_korean: 그의 영혼의 고통 속에서
  alternatives_korean:
  - 그의 영혼의 아픔 속에서
  - 그의 마음의 고통 속에서
  - 그의 생명의 고통 속에서
  lexicon: HALOT
  rationale: נפש를 ‘영혼’으로 두어 깊은 내적 고통을 유지했고, ‘고통 속에서’로 כאב의 상태성을 살렸습니다.
- source_word: צּוּרוֹ
  english_pob_choice: his Rock
  chosen_korean: 그의 바위
  alternatives_korean:
  - 그의 반석
  - 그의 피난처
  - 하나님
  lexicon: HALOT
  rationale: 하나님의 칭호인 ‘Rock’을 전통적 교회어 ‘반석’으로 바꾸기보다, 원어의 비유성을 더 직접적으로 드러내는 ‘바위’를 택했습니다. 이는 시적·상징적 호칭을 보존하려는 선택입니다.
theological_decisions:
- issue: 히브리어 본문의 ‘his Rock’ 보존
  chosen_reading: 하나님의 호칭을 일반명사화하지 않고 ‘그의 바위’로 직역하여, 고통받는 자를 들으시는 보호자/견고함의 이미지를 남겼습니다.
  alternative_readings:
  - 그의 반석
  - 하나님
  - 그의 피난처
  rationale: 히브리어 본문은 신적 칭호를 은유적으로 제시하므로, 의미를 평준화하지 않고 이미지와 신학적 긴장을 함께 살리는 것이 적절합니다.
  doctrine_reference: 신적 칭호의 은유 보존; 본문 우선 원칙
