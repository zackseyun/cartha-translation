theological_decisions:
- issue: 주어가 지혜인지, 화자가 1인칭인지의 해석
  chosen_reading: 문맥의 인격화된 지혜를 주어로 두어 ‘그녀는 그를 묶을 것입니다’로 옮겼습니다.
  alternative_readings:
  - ‘내가 그를 묶을 것입니다’라는 1인칭 읽기
  - 비인칭적 읽기
  rationale: 히브리어 형식이 난해하지만, 앞뒤 문맥에서 지혜가 행위 주체로 묘사되므로 급작스러운 화자 전환을 피하는 것이 본문의 흐름을 가장 잘 살립니다.
  doctrine_reference: 문학적 의인화와 해석상의 긴장을 보존하고, 난점을 해소해 버리지 않습니다.
- issue: 그리스어 병행문의 처리
  chosen_reading: 본문은 히브리어를 따르고, 그리스어의 다른 전승은 각주로 보존했습니다.
  alternative_readings:
  - 그리스어처럼 ‘곧게 그에게로 다시 와서…’로 옮기기
  rationale: 이 절의 그리스어는 히브리어와 상당히 다르므로, 현존하는 히브리어 본문을 주본문으로 삼고 전승 차이는 각주에 남기는 것이 더 투명합니다.
  doctrine_reference: 원문 우선 원칙을 따르며, 서로 다른 본문 전승의 차이를 지웁지 않습니다.
