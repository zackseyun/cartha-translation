translation:
  language: ko
  text: 그가 돌아서서 빗나가면, 그녀는 그를 결박할 것입니다.[b][a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 평행본문은 여기서 상당히 다릅니다. “그러면 그녀는 다시 곧바로 그에게로 와서 그를 기쁘게 하고, 자기의 숨은 것들을 그에게 드러낼 것이다.” 이는 시락서의 다른 본문 형태를 반영하는 것으로 보입니다.
    reason: textual_variant
  - marker: b
    text: 히브리어의 ‘결박’은 더 구체적으로 ‘족쇄’ 또는 ‘사슬’로 옮길 수도 있습니다. 또한 동사의 독법에 따라 “내가 그를 묶을 것이다”로 읽을 가능성도 있습니다.
    reason: lexical_alternative
