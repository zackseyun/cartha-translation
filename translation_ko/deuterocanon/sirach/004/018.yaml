  naturalness: 합쇼체는 일관되게 적절합니다. ‘그가 돌아서서 빗나가면’과 ‘그를 결박할 것입니다’가 현대 표준 한국어에서 더 매끄럽고, ‘그녀’는 앞 문맥의 의인화된 지혜를 가리키는 주어로 유지할 수 있습니다.
