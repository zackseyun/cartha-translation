  rationale: 이 구절은 수치심의 대상이 단순한 감정이 아니라 자기 존재와 도덕적 삶에 걸친 문제임을 암시하므로, 의미를 너무 평평하게 만들지 않기 위해 ‘영혼’을 유지했습니다.
