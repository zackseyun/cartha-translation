  rationale: נפש의 ‘영혼/자기/생명’ 가능성을 보존해야 하므로, 내적·인격적 차원을 살리는 ‘영혼’을 택했습니다. ‘네’로 소유 강조도 반영했습니다.
theological_decisions:
- issue: נפש / ψυχή의 인간 이해
  chosen_reading: ‘네 영혼’으로 번역해 내면과 삶의 차원을 함께 드러냈습니다.
  alternative_readings:
  - 너 자신
  - 네 생명
  rationale: 이 구절은 수치심의 대상이 단순한 감정이 아니라 자기 존재와 도덕적 삶에 걸친 문제임을 암시하므로, 의미를 너무 평평하게 만들지 않기 위해 ‘영혼’을 유지했습니다.
