translation:
  language: ko
  text: 고아들에게 아버지처럼 되어 주시고, 과부들에게 남편을 대신하는 이가 되십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 본문에는 본문과 상당히 다른 읽기인 “억울함을 당하는 자를 불의한 자의 손에서 구하라. 네가 재판할 때 낙심하지 말라”가 있습니다. 이는 이 절의 다른 본문 형태를 반영한 것으로 보입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הֱיֵה
  english_pob_choice: Be like
  chosen_korean: 되십시오
  alternatives_korean:
  - 있으십시오
  - 되십시오처럼
  lexicon: HALOT
  rationale: 히브리어 명령형 היה의 비교적·역할적 요청을 한국어에서 자연스럽게 살리려면 단순 존재보다 역할 수행을 드러내는 ‘되십시오’가 적절합니다.
- source_word: כְאָב
  english_pob_choice: like a father
  chosen_korean: 아버지처럼
  alternatives_korean:
  - 아버지로서
  - 아버지같이
  lexicon: HALOT
  rationale: כ의 비교 의미를 직접 살려, 실제 친부가 되라는 뜻이 아니라 보호자 같은 태도를 요구하는 뉘앙스를 유지했습니다.
- source_word: לִיתוֹמִים
  english_pob_choice: to orphans
  chosen_korean: 고아들에게는
  alternatives_korean:
  - 고아들을 위해
  - 고아들에게
  lexicon: HALOT
  rationale: ‘אָרphans’의 의미를 현대 한국어의 ‘고아들’로 옮기되, 수혜 대상임을 분명히 하려고 여격을 썼습니다.
- source_word: וּתְמוּר בַּעַל
  english_pob_choice: in place of a husband
  chosen_korean: 남편 대신이
  alternatives_korean:
  - 남편으로서
  - 남편 자리에
  lexicon: HALOT
  rationale: תמור의 대체·대신 의미를 ‘대신’으로 옮겨, 과부를 보호하는 결핍 보완의 기능을 살렸습니다. בעל은 이 문맥에서 ‘주인’보다 ‘남편’이 맞습니다.
theological_decisions:
- issue: 이 본문의 역할 요구를 한국어에서 어떻게 표현할지
  chosen_reading: 보호자적·대리적 역할을 요구하는 윤리적 권면으로 옮겼습니다.
  alternative_readings:
  - 그대로 신분적 비유로만 처리하는 번역
  - ‘아버지가 되다/남편이 되다’처럼 더 직접적인 문구
  rationale: 히브리어의 כ와 תמור는 실제 가족 관계의 성립이 아니라 취약한 이들을 향한 대리 보호를 말하므로, 이를 윤리적 역할 명령으로 드러냈습니다.
  doctrine_reference: Sirach 4:9의 지혜문학적 사회윤리
