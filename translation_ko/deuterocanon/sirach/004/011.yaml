  text: Wisdom has instructed her children[a], and she bears witness for all who have understanding in her.
  footnotes:
  - marker: a
    text: 'Greek parallel: ''and she lays hold of those who seek her.'' The surviving Hebrew reads, ''and she bears witness for all who have understanding in her.'''
