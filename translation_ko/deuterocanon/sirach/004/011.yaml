translation:
  language: ko
  text: 지혜는 자기 자녀들을 가르쳤으며, 자기 안에서 깨닫는 모든 사람에게 증언합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 병행본은 “그녀를 찾는 이들을 붙잡는다”로 읽습니다. 보존된 히브리어는 “자기 안에서 깨닫는 모든 사람에게 증언합니다”입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: חָכְמוֹת
  english_pob_choice: Wisdom
  chosen_korean: 지혜
  alternatives_korean:
  - 지혜들
  lexicon: HALOT
  rationale: 히브리어는 형태상 복수형이지만, 인격화된 단수 개념인 Wisdom을 가리키므로 한국어도 단수 인격화 표현인 ‘지혜’로 옮기는 것이 자연합니다.
- source_word: לִמְּדָה
  english_pob_choice: has instructed
  chosen_korean: 가르쳤으며
  alternatives_korean:
  - 가르쳤습니다
  - 훈계했습니다
  lexicon: HALOT
  rationale: למד는 ‘가르치다/훈계하다’의 뜻이지만, 지혜문학의 서술과 인격화된 주어에 맞게 ‘가르쳤으며’로 처리해 앞절과 다음 절을 매끈하게 잇습니다.
- source_word: וְתָעִיד
  english_pob_choice: she bears witness
  chosen_korean: 증언합니다
  alternatives_korean:
  - 증언해 왔습니다
  - 증거합니다
  lexicon: HALOT
  rationale: עיד의 법정적·증언적 뉘앙스를 살리기 위해 ‘증언합니다’로 옮겼습니다. ‘증거합니다’보다 한국어에서 더 직접적으로 증언 행위를 드러냅니다.
- source_word: לְכָל מְבִינִים בָּהּ
  english_pob_choice: for all who have understanding in her
  chosen_korean: 자기 안에서 깨닫는 모든 사람에게
  alternatives_korean:
  - 그녀를 이해하는 모든 사람에게
  - 그녀 안에서 분별하는 모든 이에게
  lexicon: HALOT
  rationale: מְבִינִים은 ‘분별하는/깨닫는 사람들’이고, בָּהּ는 ‘그 안에서/그녀 안에서’라는 관계를 나타내므로, 이해 주체가 지혜 ‘안’에서 이해를 얻는다는 뜻을 살려 ‘자기 안에서 깨닫는’으로 옮겼습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행본의 차이
  chosen_reading: 주본문은 히브리어를 따르고, 그리스어의 다른 의미는 각주로만 두지 않았습니다.
  alternative_readings:
  - 그리스어처럼 ‘자기를 찾는 이들을 붙잡습니다’로 번역
  rationale: 이 절은 히브리어가 보존되어 있으므로 본문은 히브리어를 우선해야 합니다. 여기서는 그리스어와 의미가 유의미하게 달라, 번역문 자체에 두 본문을 혼합하지 않았습니다.
  doctrine_reference: 'PHILOSOPHY.md: 히브리어가 남아 있는 집회문헌은 히브리어를 우선하되, 병행 차이는 투명하게 관리한다.'
- issue: 지혜의 인격화와 여성 대명사 유지
  chosen_reading: 지혜를 인격화된 여성 주어로 유지했습니다.
  alternative_readings:
  - 무생물적 ‘지혜’로만 처리
  - 성중립적으로 재진술
  rationale: 본문은 지혜를 가르치고 증언하는 인격적 존재로 묘사하므로, 그 문학적·신학적 효과를 살리기 위해 비인격화하지 않았습니다.
  doctrine_reference: 'DOCTRINE.md: 원문의 인격화와 성별 표지를 지우지 않는다.'
