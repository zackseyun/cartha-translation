base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/004/027.yaml
  text: Do not abase yourself before a fool[b][a], and do not show partiality before rulers.
  footnotes:
  - marker: a
    text: Hebrew 'do not spread out your soul/self to a fool'; the Greek parallel clarifies the idiom as self-abasement before a foolish person.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew of the second line is less transparent in isolation and could be taken differently, but the Greek parallel reads 'do not accept the face of a ruler,' supporting the sense 'do not show partiality before rulers.'
    reason: alternative_reading
translation:
  language: ko
  text: 어리석은 자에게 자신을 낮추지 말고, 통치자들 앞에서 편들지 마십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 '자신/영혼을 펼치다'에 가깝지만, 병행되는 그리스어가 자기 비하의 관용구임을 분명히 합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 둘째 행은 단독으로는 덜 분명하지만, 그리스어 병행본문은 '얼굴을 받아들이다'라는 편파의 뜻을 뒷받침합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תַּצַּע לְנָבָל נַפְשֶׁךָ
  english_pob_choice: Do not abase yourself before a fool
  chosen_korean: 어리석은 자에게 자신을 낮추지 말고
  alternatives_korean:
  - 어리석은 자 앞에 자신을 펼치지 말고
  - 어리석은 자 앞에서 자신을 낮추지 말고
  - 어리석은 자에게 스스로를 낮추지 말고
  lexicon: HALOT; Greek parallel ὑποστρώσῃς σεαυτόν
  rationale: 히브리어 동사는 문자적으로는 '펴다/눕히다'의 이미지이지만, 병행되는 헬라어가 자기 자신을 남에게 깔개처럼 두는 뜻을 분명히 하므로, 자연스러운 한국어로는 '자신을 낮추다'가 의미를 가장 잘 드러냅니다.
- source_word: לְנָבָל
  english_pob_choice: before a fool
  chosen_korean: 어리석은 자
  alternatives_korean:
  - 어리석은 사람
  - 우매한 자
  - 패악한 자
  lexicon: HALOT
  rationale: נָבָל은 단순한 지적 부족보다 도덕적 어리석음을 가리키므로, 표준적이면서도 의미를 살리는 '어리석은 자'로 옮겼습니다.
- source_word: וְאַל תַּאֲמֵן
  english_pob_choice: do not show partiality
  chosen_korean: 편들지 마십시오
  alternatives_korean:
  - 편파를 보이지 마십시오
  - 특혜를 주지 마십시오
  - 기울지 마십시오
  lexicon: HALOT; Greek parallel μὴ λάβῃς πρόσωπον
  rationale: 히브리어 형태만 보면 '믿다' 계열로도 읽힐 여지가 있지만, 병행되는 헬라어는 '얼굴을 받아들이다'라는 편애·편파의 관용구를 뒷받침합니다. 한국어로는 사회적 압력 앞에서 한쪽을 들어 주는 행위를 간명하게 드러내는 '편들다'가 적절합니다.
- source_word: לִפְּנֵי מוֹשְׁלִים
  english_pob_choice: before rulers
  chosen_korean: 통치자들 앞에서
  alternatives_korean:
  - 권력자들 앞에서
  - 관리들 앞에서
  - 통치자들 면전에서
  lexicon: HALOT
  rationale: מוֹשְׁלִים은 다스리는 자들, 곧 권력을 행사하는 사람들을 가리키므로 '통치자들'이 가장 직접적입니다. '앞에서'는 그들이 있는 자리에서의 태도를 보존합니다.
theological_decisions:
- issue: 두 번째 행의 의미가 히브리어 단독으로는 다소 불투명한 점
  chosen_reading: 권력자들 앞에서 편파적으로 기울지 말라는 경고로 읽었습니다.
  alternative_readings:
  - 권력자들 앞에서 신뢰하지 말라는 뜻
  - 권력자들 앞에서 순응하지 말라는 뜻
  rationale: 이 절은 평행법이 핵심이므로, 첫 행의 자기 비하 금지와 짝을 이루는 사회적 태도 경고로 읽는 것이 문맥에 가장 잘 맞습니다. 히브리어의 불투명성은 인정하되, 제공된 헬라어 병행본문이 이 의미를 강하게 지지하므로 그 긴장을 과도하게 완화하지 않았습니다.
  doctrine_reference: 원문 우선 + 병행본문으로 모호성 해소; 잠언적 평행법 보존
