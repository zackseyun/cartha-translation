translation:
  language: ko
  text: 너는 죄에서 돌아서기를 부끄러워하지 말고, 물살 앞에 서지 마십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 “죄들을 고백하라”와 “강물의 흐름”으로 옮깁니다. 히브리어는 첫째 절에서 ‘죄에서 돌아서다’로, 둘째 절에서는 물살의 이미지로 읽힙니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תֵּבוֹשׁ
  english_pob_choice: Do not be ashamed
  chosen_korean: 부끄러워하지 말고
  alternatives_korean:
  - 수치스러워하지 말고
  - 창피해하지 말고
  lexicon: HALOT
  rationale: בוש의 기본 의미인 ‘부끄러워하다/수치를 느끼다’를 직접 살려, 권면의 어조를 자연스러운 합쇼체로 옮겼습니다.
- source_word: לָשׁוּב מֵעָוֹן
  english_pob_choice: to turn back from iniquity
  chosen_korean: 죄에서 돌아서기를
  alternatives_korean:
  - 불의에서 돌아서기를
  - 악에서 돌이키기를
  - 죄에서 회개하기를
  lexicon: HALOT
  rationale: שוב의 ‘돌아서다/되돌아가다’ 이미지를 살리면서, עון은 본문 맥락상 ‘죄’로 옮겨 도덕적 잘못의 무게를 유지했습니다.
- source_word: שִׁבֹּלֶת
  english_pob_choice: the current of a river
  chosen_korean: 물살
  alternatives_korean:
  - 급류
  - 강물의 흐름
  - 하천의 물살
  lexicon: HALOT
  rationale: 히브리어의 드문 표현을 한국어의 간결한 자연 이미지로 살리되, 그리스어 병행본문이 가리키는 ‘흐르는 물/물살’의 뜻을 반영했습니다.
theological_decisions:
- issue: שוב의 회개적 뉘앙스를 얼마나 분명히 할 것인가
  chosen_reading: ‘죄에서 돌아서기’로 옮겨, 회개를 암시하되 전문 용어로 고정하지 않았습니다.
  alternative_readings:
  - ‘회개하다’로 명시하기
  - ‘돌이키다’만 사용하기
  rationale: 본문은 죄로부터의 방향 전환을 말하지만, 문구 자체는 고백이나 회개를 직접 명시하지 않으므로 그 긴장을 유지했습니다.
  doctrine_reference: Translation philosophy §3, Preserve theological tension rather than resolve it.
