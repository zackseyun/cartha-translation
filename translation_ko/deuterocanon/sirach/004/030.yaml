translation:
  language: ko
  text: 이중적인 말을 하는 사람으로[a][b] 불리지 말고, 혀를 그런 말에 익숙하게 하지 마십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘두 [가지]의 소유자’입니다. 이는 아마도 분열되거나 기만적인 말을 하는 사람을 가리키는 관용 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어 대조 본문은 “너희 집에서 사자처럼 되지 말고, 너희 종들 가운데서 허풍을 떨지 마라”라고 읽습니다. 이는 현존 히브리어 본문과 크게 달라, 다른 본문 형태 또는 해석 전통을 반영하는 것으로 보입니다.
    reason: textual_variant
