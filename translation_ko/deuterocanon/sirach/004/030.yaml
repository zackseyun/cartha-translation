base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/004/030.yaml
  text: Do not be called double-tongued[b][a], and do not train your tongue to it.
  footnotes:
  - marker: a
    text: 'Hebrew: ''a possessor of two [things],'' likely an idiom for divided or duplicitous speech; hence ''double-tongued.'''
    reason: lexical_alternative
  - marker: b
    text: The Greek parallel reads, 'Do not be like a lion in your house, and do not be fanciful among your servants.' This differs sharply from the extant Hebrew and likely reflects a different textual form or interpretive tradition.
    reason: textual_variant
translation:
  language: ko
  text: 너는 이중적 입으로 불리지 말고, 네 혀를 그런 데 익숙하게 하지 마십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַל תִּקָּרֵא
  english_pob_choice: Do not be called
  chosen_korean: 불리지 말고
  alternatives_korean:
  - 두 얼굴의 사람으로 불리지 말고
  - 이중적인 말쟁이로 불리지 말고
  lexicon: HALOT
  rationale: 니팔 수동형의 금지문을 한국어로 자연스럽게 옮기되, 단순한 명명보다 공동체적 평판을 뜻하는 뉘앙스를 살려 ‘불리다’로 처리했습니다.
- source_word: בַּעַל שְׁתַּיִם
  english_pob_choice: double-tongued
  chosen_korean: 이중적 입
  alternatives_korean:
  - 두 혀를 가진 사람
  - 이중적인 말투
  lexicon: HALOT
  rationale: 히브리어의 직역은 ‘두 가지의 소유자’에 가깝지만, 바로 뒤의 ‘혀’와 연결되는 관용을 따라 분열되거나 속이는 말을 가리키는 뜻을 한국어로 간결하게 드러냈습니다.
- source_word: לְשׁוֹנְךָ
  english_pob_choice: your tongue
  chosen_korean: 네 혀
  alternatives_korean:
  - 네 말
  - 네 입
  lexicon: HALOT
  rationale: ‘혀’는 말의 도덕적 도구라는 히브리어 이미지를 보존하며, POB의 원문 감각을 유지합니다.
- source_word: אַל תַּרְגֵּל
  english_pob_choice: do not train
  chosen_korean: 익숙하게 하지 마십시오
  alternatives_korean:
  - 훈련하지 마십시오
  - 습관들이지 마십시오
  lexicon: HALOT
  rationale: ‘익숙하게 하다’는 반복적 습관 형성의 뜻을 현대 한국어로 자연스럽게 전달하면서, 단순한 일회적 행위 금지가 아니라 말버릇의 형성을 막는 명령임을 살립니다.
