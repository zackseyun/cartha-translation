lexical_decisions:
- source_word: אַל תִּסָּרֵב
  english_pob_choice: Do not resist
  chosen_korean: 다투지 말고
  alternatives_korean:
  - 저항하지 말고
  - 거역하지 말고
  - 대들지 말고
  lexicon: HALOT
  rationale: 히브리어는 하나님께 맞서거나 반항하는 태도를 금지하며, 한국어에서는 ‘다투다’가 이 대립적 태도를 자연스럽고 힘 있게 드러냅니다.
- source_word: עִם הָאֵל
  english_pob_choice: God
  chosen_korean: 하나님과
  alternatives_korean:
  - 전능자와
  - 강한 분과
  lexicon: HALOT
  rationale: אֵל은 여기서 일반적인 신칭이므로 ‘하나님’이 가장 자연스럽고, 전치사 עִם은 한국어에서 관계적 충돌을 나타내는 조사로 풀었습니다.
- source_word: וְאֶל אֱלֹהִים
  english_pob_choice: before God
  chosen_korean: 하나님 앞에서
  alternatives_korean:
  - 하나님께
  - 하나님을 향하여
  lexicon: HALOT
  rationale: אֶל의 방향성을 한국어에서는 ‘앞에서’로 옮겨, 겸손의 자리와 태도를 동시에 살렸습니다.
- source_word: הִכָּנֵעַ
  english_pob_choice: humble yourself
  chosen_korean: 자신을 낮추십시오
  alternatives_korean:
  - 스스로 겸손해지십시오
  - 자신을 복종시키십시오
  - 스스로 낮추십시오
  lexicon: HALOT
  rationale: 반사적·권고적 의미를 현대 한국어에서 가장 자연스럽게 드러내는 표현은 ‘자신을 낮추십시오’이며, 종교적 관용구로 굳은 표현보다 직접적인 의미를 유지합니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 평행문의 차이
  chosen_reading: 본문은 현존 히브리어를 따라 ‘하나님과 다투지 말고 … 자신을 낮추십시오’로 옮기고, 그리스어의 ‘진리를 거슬러 말하지 말라’는 뜻은 본문이 아니라 주해용 대안으로만 남깁니다.
  alternative_readings:
  - 진리를 거스르지 말고, 무지함을 부끄러워하라
  - 하나님을 거스르지 말고, 자신을 낮추라
  rationale: 이 절은 히브리어와 그리스어가 상당히 다르므로, 살아 있는 히브리어 증거를 본문으로 삼되 그리스어는 해석상 중요한 대안으로 보존하는 것이 원문 충실성에 맞습니다.
  doctrine_reference: 'PHILOSOPHY.md: translate from Hebrew where it survives; use parallel Greek as actual input'
