  verdict: revise
  source_fidelity: 히브리어의 לִבּוֹ는 ‘그의 마음’인데, 초안은 이를 ‘내 마음’으로 옮겨 인칭과 의미가 바뀌었습니다. 또한 ‘기다리다가’는 원문에 없는 기다림의 행동을 보탭니다. אָשׁוּב은 ‘내가 다시 돌아와’로, אֲאַשְּׁרֶנּוֹ는 문맥상 ‘그를 복되게 하다’로, וְגָלִיתִי לוֹ מִסְתָּרִי는 ‘내 비밀을 그에게 드러내다’로 충실히 옮길 수 있습니다.
  naturalness: ‘그의 마음이 나로 가득 찰 때까지’는 원문의 다소 압축된 표현을 유지하면서도 현대 표준 한국어로 이해 가능합니다. 불필요하게 ‘기다리다’를 넣지 않고, 접속 관계는 쉼표와 ‘나는’으로 분명히 했습니다. 합쇼체 종결도 유지했습니다.
  terminology: 인격화된 지혜의 1인칭 발화를 보존하기 위해 ‘나’, ‘내 비밀’을 유지했습니다. ‘복되게 하다’는 אֲאַשְּׁרֶנּוֹ의 행복하게 함/복되다 선언함의 폭을 비교적 중립적으로 살립니다. 히브리어 מִסְתָּרִי는 단수이므로 ‘내 비밀’로 옮겼습니다.
  issues:
