    rationale: וְעַד עֵת는 시간 한계를 나타낼 뿐 ‘기다리다’라는 동작을 명시하지 않습니다. 이를 넣으면 화자가 기다린다는 의미가 추가됩니다.
  - severity: low
    issue: 그리스어 각주의 ‘시험-수용 구조’
    rationale: 그리스어 평행본문의 추가 구절은 지혜의 시험과 이후의 호의라는 더 긴 전개를 반영하지만, ‘수용’은 본문에 명시된 어휘가 아니므로 ‘시험과 그 뒤의 호의’처럼 더 절제해 서술하는 편이 좋습니다.
