base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/004/017.yaml
  text: And until his heart is filled with me[a], I will return and make him happy[b], and I will reveal my secrets to him.
  footnotes:
  - marker: a
    text: 'Greek parallel: ''until she trusts his soul'' / ''until he entrusts his soul'' and ''she will test him in her ordinances,'' reflecting a fuller line about Wisdom''s testing before her favorable return.'
    reason: alternative_reading
  - marker: b
    text: Or 'bless him' or 'pronounce him happy' for 'make him happy.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 마음이 나로 가득 찰 때까지, 나는 다시 돌아와 그를 복되게 하고 내 비밀을 그에게 드러내겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 평행본문은 ‘그녀가 그의 영혼을 신뢰할 때까지’와 ‘그녀의 규례들로 그를 시험할 것이다’를 덧붙입니다. 이는 지혜의 시험과 그 뒤의 호의에 관한 더 긴 전개를 반영합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְעַד עֵת
  english_pob_choice: And until
  chosen_korean: ~까지 기다리다가
  alternatives_korean:
  - 그리고 ~까지
  - ~할 때까지
  lexicon: HALOT
  rationale: 시간의 한계를 나타내는 표현이므로, 한국어에서는 자연스러운 종결 대기 의미가 드러나도록 ‘~까지 기다리다가’로 옮겼습니다.
- source_word: יִמָּלֵא לִבּוֹ בִּי
  english_pob_choice: his heart is filled with me
  chosen_korean: 내 마음이 내게서 가득 차기까지
  alternatives_korean:
  - 그의 마음이 내게로 채워질 때까지
  - 그의 마음이 나를 신뢰할 때까지
  lexicon: HALOT
  rationale: 히브리어의 직역 이미지를 보존하되, 한국어에서는 ‘마음이 내게서 가득 차다’로 하여 ‘with me’의 내재적 충만을 살렸습니다.
- source_word: אֲאַשְּׁרֶנּוֹ
  english_pob_choice: make him happy
  chosen_korean: 그를 복되게 하며
  alternatives_korean:
  - 그를 행복하게 하며
  - 그를 축복하며
  - 그를 복되다고 선언하며
  lexicon: HALOT
  rationale: 아쉐르 계열 동사는 단순 감정적 행복보다 ‘복됨/복되게 함’의 뉘앙스를 가질 수 있어, 현대 한국어에서 너무 교훈적으로 흐르지 않도록 ‘복되게 하다’로 옮겼습니다.
- source_word: מִסְתָּרִי
  english_pob_choice: my secrets
  chosen_korean: 내 비밀
  alternatives_korean:
  - 내 감추어진 것들
  - 내 숨은 것들
  - 내 비밀들
  lexicon: HALOT
  rationale: 단수형처럼 읽히는 POB의 ‘my secrets’를 따라, ‘비밀’로 간결하게 옮겨 계시적 친밀성을 유지했습니다.
theological_decisions:
- issue: 잠언적 지혜 문맥에서의 ‘내게서 마음이 가득 참’의 의미
  chosen_reading: 지혜가 자신에게 온전히 마음을 두는 자에게 돌아와 호의를 베풀고 비밀을 드러내는 흐름으로 읽었습니다.
  alternative_readings:
  - 마음이 지혜를 신뢰한다는 뜻으로 의역
  - 지혜를 향한 사랑이 충만해진 상태로 이해
  rationale: 히브리어 본문을 우선하되, 문맥상 지혜의 인격화된 발화로서 관계적 충만과 응답의 조건을 함께 드러내는 것이 가장 자연스럽습니다.
  doctrine_reference: 'PHILOSOPHY.md: translate from Hebrew where it survives; original-language primacy'
