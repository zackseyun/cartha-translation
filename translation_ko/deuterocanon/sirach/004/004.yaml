  text: Do not withhold a gift from your poor man[a], and do not despise the request of the poor, nor give him occasion to curse you.
  footnotes:
  - marker: a
    text: 'Greek parallel: ''Do not refuse a suppliant in distress, and do not turn your face away from the poor.'' The Greek witness is shorter and lacks the final clause about giving occasion for a curse.'
