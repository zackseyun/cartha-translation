translation:
  language: ko
  text: 가난한 이에게 줄 선물을 아끼지 마십시오. 가난한 이의 간청을 업신여기지 마십시오. 또 그가 당신을 저주할 빌미를 주지 마십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '그리스어 병행본: “곤경에 처해 간청하는 이를 거절하지 마십시오. 가난한 이에게서 얼굴을 돌리지 마십시오.” 그리스어 증인은 더 짧으며, ‘그가 당신을 저주할 빌미를 주지 마십시오’라는 마지막 절이 없습니다.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תִּמְנַע
  english_pob_choice: Do not withhold
  chosen_korean: 아끼지 말며
  alternatives_korean:
  - 거두지 말며
  - 보류하지 말며
  lexicon: HALOT
  rationale: מנע의 핵심은 필요한 것을 '막다/거두다/아끼다'의 의미이므로, 자선을 거절하는 뉘앙스를 살리면서도 한국어 문맥에 자연스럽게 맞는 표현으로 옮겼습니다.
- source_word: מַתָּן
  english_pob_choice: a gift
  chosen_korean: 선물
  alternatives_korean:
  - 선사
  - 증여
  - 구제금
  lexicon: HALOT
  rationale: 이 명사는 일반적인 '줌/선물'을 뜻하므로, 원문의 폭을 좁히는 '구제금'보다 직접적인 '선물'이 더 가깝습니다.
- source_word: מִמִּסְכֵּנֶךָ
  english_pob_choice: from your poor man
  chosen_korean: 당신의 가난한 이에게서
  alternatives_korean:
  - 당신의 빈궁한 사람에게서
  - 당신의 궁핍한 이에게서
  lexicon: HALOT
  rationale: 소유 접미사 '-ךָ'를 살려 '당신의'를 유지했고, 남성형 단수이지만 한국어에서는 대표적·포괄적으로 '가난한 이'가 자연스럽습니다.
- source_word: וְלֹא תִבְזֶה שְׁאֵלוֹת דָּל
  english_pob_choice: and do not despise the request of the poor
  chosen_korean: 가난한 이의 청을 업신여기지 말고
  alternatives_korean:
  - 가난한 이의 요청을 멸시하지 말고
  - 가난한 이의 간청을 깔보지 말고
  lexicon: HALOT
  rationale: בזה는 단순 무시보다 '업신여기다/멸시하다'가 강도를 잘 드러내며, שאלות은 일상적이면서도 간절한 '청'이 적절합니다.
- source_word: וְלֹא תִתֵּן לוֹ מָקוֹם לְקַלְלֶךָ
  english_pob_choice: nor give him occasion to curse you
  chosen_korean: 그가 당신을 저주할 빌미를 주지 마십시오
  alternatives_korean:
  - 그가 당신을 저주할 기회를 주지 마십시오
  - 그가 당신을 저주하게 할 구실을 주지 마십시오
  lexicon: HALOT
  rationale: 직역하면 '그에게 자리를 주지 말라'이지만, 문맥상 '저주할 이유/기회'를 주지 말라는 뜻이므로 '빌미'가 가장 자연스럽고 원문의 경고를 보존합니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행본의 차이
  chosen_reading: 히브리어의 세 번째 절(저주할 빌미를 주지 말라)을 본문에 포함했습니다.
  alternative_readings:
  - 그리스어 병행본처럼 '가난한 자에게서 얼굴을 돌리지 말라'로 더 짧게 옮길 수 있습니다.
  rationale: 집회서는 히브리어가 남아 있는 경우 그 본문을 우선하는 것이 이 프로젝트의 원칙이며, 그리스어는 대조 증거로만 반영하는 것이 적절합니다.
  doctrine_reference: 'PHILOSOPHY.md: translate from Hebrew where it survives; use Greek parallel as actual input'
