revisions:
- from: 그녀에게 봉사하는 이들은 거룩한 이에게 봉사합니다[a]. 그리고 하나님은 그녀의 거처를 사랑하는 이들을 사랑하십니다.
  to: 그녀를 섬기는 이들은 거룩한 분을 섬깁니다. 하나님은 그녀의 거처를 사랑하는 이들을 사랑하십니다[a].
  rationale: 그리스어 대안 독법을 설명하는 각주를 둘째 행으로 옮겨 앵커의 지시 범위를 바로잡았습니다. 또한 שרת의 격조와 종교적 봉사의 뉘앙스를 더 자연스럽게 드러내도록 ‘봉사하다’를 ‘섬기다’로 바꾸었습니다. 히브리어의 난해한 ‘그녀의 거처’ 독법, 히브리어의 신명 ‘하나님’, 그리고 그리스어의 ‘주님/그녀’ 대안은 그대로 보존했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T19:09:33Z'
review_pass:
  verdict: revise
  source_fidelity: 첫 행은 히브리어의 반복된 שרת(섬기다/봉사하다)와 קֹדֶשׁ의 압축된 표현을, 둘째 행은 אֱלֹהִים 및 ‘그녀의 거처’를 포함하는 난해한 히브리어 독법을 대체로 충실히 반영합니다. 다만 그리스어 대안은 둘째 행의 목적어에 관한 것이므로 각주 표지는 그 위치에 놓여야 합니다.
  naturalness: ‘그녀에게 봉사하는 이들’과 ‘거룩한 이’도 이해할 수 있으나, 지혜를 여성으로 의인화한 문맥에서 ‘그녀를 섬기는 이들’과 ‘거룩한 분’이 현대 표준 한국어에서 더 자연스럽고, 종교적·격조 있는 문체에도 맞습니다.
  terminology: ‘섬기다’는 שרת와 그리스어 λειτουργέω가 지닌 예배적·공적 봉사의 어감을 ‘봉사하다’보다 잘 살립니다. אֱלֹהִים은 ‘하나님’으로 유지하며, 그리스어의 ‘주님’은 각주에서만 제시합니다. ‘거처’는 본문의 난해한 히브리어 독법을 보존합니다.
  issues:
