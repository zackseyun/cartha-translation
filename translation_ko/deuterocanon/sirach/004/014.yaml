    rationale: 여기서 שרת는 더 격조 있고 종교적·공적 성격의 섬김을 나타내므로 ‘섬기다’가 문맥과 평행 그리스어의 어감에 더 적절합니다.
  revised_text: 그녀를 섬기는 이들은 거룩한 분을 섬깁니다. 하나님은 그녀의 거처를 사랑하는 이들을 사랑하십니다[a].
