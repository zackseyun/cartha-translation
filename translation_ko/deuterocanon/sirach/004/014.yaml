translation:
  language: ko
  text: 그녀를 섬기는 이들은 거룩한 분을 섬깁니다. 하나님은 그녀의 거처를 사랑하는 이들을 사랑하십니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '그리스어: “그리고 주님은 그녀를 사랑하는 이들을 사랑하십니다.” 히브리어는 여기서 ‘그녀의 거처’와 관련된 더 어려운 독법을 보존하는 것으로 보입니다.'
    reason: alternative_reading
lexical_decisions:
- source_word: מְשָׁרְתֵי / מְשָׁרְתֶיהָ
  english_pob_choice: minister / minister to her
  chosen_korean: 봉사하는 이들 / 그녀에게 봉사하는 이들
  alternatives_korean:
  - 섬기는 이들 / 그녀를 섬기는 이들
  - 시중드는 이들 / 그녀를 시중드는 이들
  lexicon: HALOT
  rationale: שרת는 단순 노동보다 공적·종교적 봉사의 뉘앙스를 지니므로, 한국어에서는 ‘봉사하다’로 옮겨 격조를 살렸습니다.
- source_word: קֹדֶשׁ
  english_pob_choice: the Holy One
  chosen_korean: 거룩한 이
  alternatives_korean:
  - 거룩함
  - 거룩한 것
  - 성소
  lexicon: HALOT
  rationale: 히브리어는 압축적이어서 대상이 명시되지 않지만, 영어 POB의 해석과 지혜문학적 의인화를 따라 ‘거룩한 이’로 풀어 자연스러운 인격적 지시를 살렸습니다.
- source_word: וֵאלֹהִים
  english_pob_choice: and God
  chosen_korean: 하나님은
  alternatives_korean:
  - 그리고 주님은
  lexicon: HALOT
  rationale: 본문 히브리어가 אֱלֹהִים을 직접 가지므로 전통적 ‘주님’보다 ‘하나님’을 택했습니다.
- source_word: בֵּית [מוֹשָׁבָהּ אָהֵב]
  english_pob_choice: loves those who love her dwelling
  chosen_korean: 그녀의 거처를
  alternatives_korean:
  - 그녀의 집을
  - 그녀의 거처에 사는 이들을
  - 그녀를
  lexicon: HALOT
  rationale: 전승된 히브리어가 ‘집/거처’ 언어를 보존하는 것으로 보이며, 영어 POB가 본문에 그 난점을 유지했으므로 한국어도 ‘거처’로 대응했습니다.
- source_word: אָהֵב
  english_pob_choice: loves
  chosen_korean: 사랑하십니다
  alternatives_korean:
  - 사랑합니다
  - 사랑하십니다
  lexicon: HALOT
  rationale: 히브리어 אהב의 반복을 유지해 대칭을 살리되, 하나님을 향한 서술이므로 종결은 존칭형으로 맞췄습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 평행본문의 불일치(‘her dwelling’ vs. ‘her’).
  chosen_reading: 본문에는 ‘그녀의 거처’를 유지하고, 대안 독법은 각주로 제시합니다.
  alternative_readings:
  - 그녀를 사랑하는 이들을 사랑하십니다
  - 그녀에게 봉사하는 이들은 거룩한 이에게 봉사합니다
  rationale: 히브리어 사본 전승의 난점을 지우지 않기 위해 본문은 더 어려운 독법을 보존하되, 그리스어 전승이 반영한 더 매끄러운 독법은 각주로 안내합니다.
  doctrine_reference: 'DOCTRINE.md: source transparency; preserve textual tension rather than smoothing it away'
