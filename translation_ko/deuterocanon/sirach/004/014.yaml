    rationale: 제시된 각주는 그리스어가 둘째 행에서 ‘그녀의 거처’ 대신 ‘그녀’를 사랑하는 이들이라고 읽는다는 대안 독법을 설명합니다. 따라서 표지는 둘째 행의 ‘사랑하십니다’ 뒤에 와야 해당 독법의 범위를 정확히 표시합니다.
  - severity: low
