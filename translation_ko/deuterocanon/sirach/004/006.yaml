  naturalness: ‘마음 깊은 쓰라림 속에서’와 ‘간구를 들어주실 것입니다’는 현대 한국어 합쇼체로 자연스럽습니다. 기존 각주 b의 ‘정죄를 외치면’은 한국어 관용상 어색하고 원문의 저주/불리한 호소의 의미를 충분히 전달하지 못합니다.
