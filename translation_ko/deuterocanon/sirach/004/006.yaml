base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/004/006.yaml
  text: For if he cries out against you in the bitterness of his soul, his Maker will hear his plea.[a][b]
  footnotes:
  - marker: a
    text: The extant Cairo Geniza Hebrew line cited in Zone 1 does not match the Greek wording for this verse; the main translation therefore follows the Greek witness here.
    reason: textual_variant
  - marker: b
    text: Or 'calls down judgment on you' for 'cries out against you.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 마음 깊은 쓰라림 속에서 여러분을 거슬러 부르짖으면, 그를 지으신 분이 그의 간구를 들어주실 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 현재 제시된 카이로 게니자 히브리어 본문은 이 절의 그리스어 본문과 일치하지 않습니다. 따라서 본역은 여기서 그리스어 증거를 따랐습니다.
    reason: textual_variant
  - marker: b
    text: 또는 ‘여러분을 저주하면’으로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: καραμένου
  english_pob_choice: cries out against
  chosen_korean: 부르짖으면
  alternatives_korean:
  - 외쳐 호소하면
  - 호소하듯 부르짖으면
  - 여러분을 거슬러 부르짖으면
  lexicon: LSJ
  rationale: 문맥상 억눌린 이가 상대를 향해 하는 적대적 호소를 한국어로 자연스럽게 살리되, 지나치게 법정어로 굳히지 않기 위해 '부르짖으면'을 택했습니다.
- source_word: ἐν πικρίᾳ ψυχῆς αὐτοῦ
  english_pob_choice: in the bitterness of his soul
  chosen_korean: 마음의 쓰라림 속에서
  alternatives_korean:
  - 영혼의 쓰라림 속에서
  - 속마음의 쓰라림 가운데서
  - 마음이 쓰라린 채
  lexicon: LSJ
  rationale: ψυχή를 직역해 '영혼'으로 고정하기보다, 한국어에서 감정과 내면의 고통을 자연스럽게 드러내는 '마음'으로 옮겨 본문의 정서와 힘을 보존했습니다.
- source_word: ὁ ποιήσας αὐτόν
  english_pob_choice: his Maker
  chosen_korean: 그를 지으신 분
  alternatives_korean:
  - 그의 만드신 이
  - 그의 창조주
  - 그를 지으신 창조주
  lexicon: BDAG
  rationale: 하나님을 창조주로 지칭하는 압축된 표현을 한국어에서 이해하기 쉽게 풀어 옮기되, 신학적 무게는 유지했습니다.
theological_decisions:
- issue: Greek primary reading versus mismatched Hebrew witness
  chosen_reading: 현재 제시된 그리스어 본문을 본역으로 삼고, 히브리어 독법과의 불일치는 각주로 남겼습니다.
  alternative_readings:
  - 제시된 히브리어 구문을 따라 '회중을 사랑하고 권세에 더 머리를 숙이라'로 옮김
  rationale: 제공된 히브리어는 이 절의 그리스어 내용과 일치하지 않으므로, 본문 번역은 그리스어 증거를 따르고 텍스트 차이는 투명하게 표시하는 것이 더 충실합니다.
  doctrine_reference: 'PHILOSOPHY.md: 보존된 원어 증거가 갈릴 때는 사용 가능한 본문을 따르되, 불일치를 숨기지 않는다.'
