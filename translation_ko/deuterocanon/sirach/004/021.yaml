  text: For there is a shame that bears iniquity[b][a], and there is a shame that is glory and favor.
  footnotes:
  - marker: a
    text: Or, following the Greek more closely, 'a shame that leads to sin.' The Hebrew phrase is compressed and may also be understood as 'bearing iniquity.'
