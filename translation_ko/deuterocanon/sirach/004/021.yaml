translation:
  language: ko
  text: 참으로 죄책을 가져오는 수치가 있고[a], 영광과 호의가 되는 수치가 있습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, 헬라어에 더 가깝게 옮기면 ‘죄로 이끄는 수치’입니다. 히브리어 표현은 압축되어 있어 ‘죄책을 가져오는 수치’ 또는 ‘죄악을 지닌 수치’로 이해될 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘영예와 은총’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֹּשֶׁת
  english_pob_choice: shame
  chosen_korean: 수치
  alternatives_korean:
  - 부끄러움
  - 치욕
  lexicon: HALOT
  rationale: 여기서는 개인적 감정의 '부끄러움'보다 사회·도덕적 평가를 담은 '수치'가 원문의 moral/social weight와 대조 구조를 더 잘 살립니다.
- source_word: מַשְׂאֵת עָוֹן
  english_pob_choice: bears iniquity
  chosen_korean: 죄책을 가져오고
  alternatives_korean:
  - 죄악을 지니고
  - 죄를 짊어지고
  - 죄책을 지고
  lexicon: HALOT
  rationale: 히브리어 구문은 압축되어 있어 직역하면 어색하지만, 결과를 나타내는 문맥상 '죄책을 가져오다'가 한국어로 원문의 인과성을 드러냅니다.
- source_word: כָּבוֹד
  english_pob_choice: glory
  chosen_korean: 영광
  alternatives_korean:
  - 존귀
  - 명예
  lexicon: HALOT
  rationale: 히브리어의 높임과 찬양의 뉘앙스를 보존하고, 병렬의 대구를 살리기 위해 '영광'을 택했습니다.
- source_word: חֵן
  english_pob_choice: favor
  chosen_korean: 은혜
  alternatives_korean:
  - 호의
  - 총애
  lexicon: HALOT
  rationale: 히브리어 חֵן은 '호의/은총'의 뜻이지만, 한국어에서 병렬의 미감과 문학적 격조를 살리기 위해 '은혜'를 채택했습니다. 다만 이 용례는 후대 신학적 용례를 직접 가리키기보다 호의의 의미입니다.
theological_decisions:
- issue: 첫째 절의 קשה한 구문 מַשְׂאֵת עָוֹן의 처리
  chosen_reading: 수치가 죄책을 가져오는 경우와, 반대로 영광과 은혜가 되는 수치를 대조하는 문장으로 옮겼습니다.
  alternative_readings:
  - 수치가 죄를 낳는 경우
  - 수치가 죄악을 짊어지는 경우
  - 수치가 죄책을 지는 경우
  rationale: 히브리어 자체가 압축되어 있고, 병행하는 헬라어가 '죄를 가져오는 수치'를 지지하므로, 의미를 과도하게 확장하지 않으면서도 인과관계를 분명히 했습니다.
  doctrine_reference: Sirach 4:21 Hebrew/Greek parallel
