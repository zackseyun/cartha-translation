translation:
  language: ko
  text: 가난한 사람에게 귀를 기울이십시오. 그리고 겸손한 마음으로 그에게 평화롭게 대답하십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '그리스어 병행본: “회중에게 자신을 사랑스럽게 여기도록 하라, 그리고 큰 사람에게는 머리를 낮추라.” 이는 현존 히브리어와 상당히 다른 본문 형태를 반영합니다.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַט / Incline
  english_pob_choice: Incline your ear
  chosen_korean: 귀를 기울이십시오
  alternatives_korean:
  - 귀를 돌리십시오
  - 귀를 내리십시오
  lexicon: HALOT
  rationale: 히브리어 הַט는 ‘기울이다/돌리다’의 명령형으로, 한국어에서는 관용적으로 ‘귀를 기울이다’가 가장 자연스럽고 본문의 주의 깊은 경청을 잘 살립니다.
- source_word: לֶעָנִי / to the poor
  english_pob_choice: to the poor
  chosen_korean: 가난한 사람에게
  alternatives_korean:
  - 가난한 자에게
  - 궁핍한 사람에게
  - 고난받는 사람에게
  lexicon: HALOT
  rationale: עָנִי는 경제적·사회적으로 취약한 사람을 가리킬 수 있으므로, 본문 윤리에 맞게 지나치게 신학화하지 않은 ‘가난한 사람’으로 옮겼습니다.
- source_word: וַהֲשִׁיבֵהוּ / answer him
  english_pob_choice: answer him
  chosen_korean: 그에게 대답하십시오
  alternatives_korean:
  - 그에게 응답하십시오
  - 그에게 답하십시오
  lexicon: HALOT
  rationale: שוב의 히필이 대화 문맥에서는 ‘대답하다/응답하다’의 뜻이므로, 현대 한국어에서 가장 분명한 ‘대답하십시오’를 택했습니다.
- source_word: שָׁלוֹם בַּעֲנָוָה / peacefully with humility
  english_pob_choice: peacefully with humility
  chosen_korean: 평화롭게 … 겸손한 마음으로
  alternatives_korean:
  - 평온하게 … 겸손하게
  - 평화와 함께 … 온유하게
  lexicon: HALOT
  rationale: שָׁלוֹם은 응답의 방식인 ‘평화롭게’로, בַּעֲנָוָה는 태도인 ‘겸손한 마음으로’로 나누어 옮기면 히브리어의 의미 관계를 자연스럽게 드러낼 수 있습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행본의 현저한 차이
  chosen_reading: 본문은 현존 히브리어를 따라 옮기고, 그리스어의 다른 형태는 각주로만 표시합니다.
  alternative_readings:
  - '그리스어: ‘회중에게 자신을 사랑스럽게 여기도록 하라, 그리고 큰 사람에게는 머리를 낮추어라.’'
  rationale: 집회에 ‘사랑스럽게’와 권세자에게 ‘머리를 낮추라’는 그리스어는 히브리어와 상당히 다른 전승이므로, 본문은 히브리어를 따르되 대체 전승의 존재를 투명하게 보존하는 것이 맞습니다.
  doctrine_reference: Sirach의 히브리어 생존 구절은 히브리어 본문 우선, 그리스어는 대체 전승으로 각주 처리
