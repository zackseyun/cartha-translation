  text: Do not show partiality against yourself[a], and do not stumble to your own downfall.
  footnotes:
  - marker: a
    text: Hebrew as transmitted may be read more literally, 'and do not stumble at your stumbling,' while the Greek parallel reads 'and do not be ashamed unto your fall.' The main text follows the sense supported by the Greek parallel for coherence.
