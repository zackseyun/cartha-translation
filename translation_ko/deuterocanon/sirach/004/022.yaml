translation:
  language: ko
  text: 자신에게 불리하게 편파적으로 대하지 마시고, 자기 파멸에 이르도록 넘어지지 마십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 더 문자적으로 ‘자신에게 불리하게 편파적으로 대하지 말고, 자기 넘어짐에 이르도록 넘어지지 마라’로 읽을 수 있습니다. 그리스어 평행본은 둘째 절을 ‘너의 넘어짐에 부끄러워하지 마라’라고 읽습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תִּשָּׂא פָנֶיךָ
  english_pob_choice: Do not show partiality
  chosen_korean: 불공평하지 마시고
  alternatives_korean:
  - 편파적이지 마시고
  - 편애하지 마시고
  - 얼굴을 들어 보이지 마시고
  lexicon: HALOT
  rationale: 히브리어 관용구 נשא פנים은 문자적으로는 '얼굴을 들다'이지만, 여기서는 편파성/편애를 가리키므로 현대 한국어로는 윤리적 의미를 직접 드러내는 표현이 적절합니다.
- source_word: עַל נַפְשֶׁךָ
  english_pob_choice: against yourself
  chosen_korean: 자기 자신에게
  alternatives_korean:
  - 자기 생명에 대해
  - 자기 자신을 거슬러
  - 자기에게 불리하게
  lexicon: HALOT
  rationale: נפש는 여기서 반사적으로 '자기 자신/자기 생명'을 가리키며, 전치사 עַל과 결합해 자기 자신을 향한 왜곡된 태도를 나타냅니다. 한국어에서는 앞 구절과 자연스럽게 이어지도록 '자기 자신에게'로 옮겼습니다.
- source_word: וְאַל תִּכָּשֵׁל
  english_pob_choice: and do not stumble / and do not be ashamed
  chosen_korean: 넘어짐으로 나아가지 마십시오
  alternatives_korean:
  - 수치스러워하지 마십시오
  - 넘어지지 마십시오
  - 실족하지 마십시오
  lexicon: HALOT
  rationale: 히브리어 본문은 כשל('넘어지다')를 전하며, 그리스어 평행본은 '수치스러워하다'를 보입니다. 본문상 가장 직접적인 히브리어 동사를 살리되, 뒤 절과의 연결을 위해 '넘어짐으로 나아가지'라는 진행적 표현을 택했습니다.
- source_word: לְמִכְשׁוֹלֶיךָ
  english_pob_choice: to your own downfall
  chosen_korean: 넘어짐으로
  alternatives_korean:
  - 실족으로
  - 파멸로
  - 걸림돌로
  lexicon: HALOT
  rationale: מכשול은 '걸림, 넘어짐, 장애'를 뜻하며, 문맥상 자기 파멸을 향한 결과를 가리킵니다. 한국어에서는 앞의 '넘어짐'과 어휘를 맞춰 반복 구조를 살렸습니다.
theological_decisions:
- issue: 히브리어와 그리스어 평행본 사이의 차이(‘넘어지다’ vs ‘수치스럽다’)
  chosen_reading: 본문은 히브리어의 ‘넘어지다’를 기본으로 하되, 그리스어의 ‘수치’ 뉘앙스는 번역문 전면에 드러내지 않았습니다.
  alternative_readings:
  - 수치스러워하지 마십시오
  - 부끄러워하지 마십시오
  rationale: 현존 히브리어 증거가 높은 신뢰도를 가지므로 이를 본문으로 따르되, 평행본이 지지하는 의미 차이는 주석 없이 본문에 과도하게 섞지 않았습니다. 다만 의미상 ‘자기 파멸로 이어지는 넘어짐’을 분명히 했습니다.
  doctrine_reference: 본문 비평 및 평행본문 조화 원칙
