base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/004/016.yaml
  text: If he trusts her, he will inherit her, and his descendants will possess her.[a]
  footnotes:
  - marker: a
    text: The extant Hebrew witness here reads approximately, 'For in estrangement I will go with him, and at first I will test him by trials,' a wording that aligns more closely with the preceding context of Wisdom testing a disciple. The Greek witness instead reads, 'If he trusts, he will inherit her, and his descendants will possess her.'
    reason: alternative_reading
translation:
  language: ko
  text: 그가 신뢰하면, 그는 그것을 유업으로 받을 것이며, 그의 후손들이 그것을 차지할 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 남아 있는 히브리어 증언은 대략 ‘내가 낯을 바꾸어 그와 함께 가며, 처음에는 그를 시련으로 시험하겠다’로 읽히며, 앞 문맥의 지혜의 시험이라는 주제와 더 가깝습니다.
    reason: textual_variant
lexical_decisions:
- source_word: ἐὰν ἐμπιστεύσῃς
  english_pob_choice: if he trusts
  chosen_korean: 신뢰하면
  alternatives_korean:
  - 믿으면
  - 의지하면
  lexicon: BDAG
  rationale: 조건문의 핵심을 ‘신뢰하다’로 살려, 단순한 지적 동의보다 인격적 의탁의 뜻을 자연스럽게 드러냈습니다.
- source_word: κατακληρονομήσεις
  english_pob_choice: he will inherit
  chosen_korean: 유업으로 받을 것이며
  alternatives_korean:
  - 상속할 것이며
  - 유산으로 받을 것이며
  lexicon: BDAG
  rationale: ‘상속’보다 성경적 유업의 뉘앙스를 살리되, 현대 한국어에서 자연스럽게 읽히도록 ‘유업으로 받다’로 옮겼습니다.
- source_word: αὐτήν
  english_pob_choice: her
  chosen_korean: 그것을
  alternatives_korean:
  - 그녀를
  - 그를
  lexicon: BDAG
  rationale: 여기서는 인격화된 지혜를 가리키는 여성형 대명사이지만, 한국어에서 목적어 반복을 지나치게 인칭화하면 어색해질 수 있어 문맥상 지시대명사로 풀었습니다.
- source_word: ἐν κατασχέσει ἔσονται
  english_pob_choice: will possess
  chosen_korean: 차지할 것입니다
  alternatives_korean:
  - 소유할 것입니다
  - 붙들게 될 것입니다
  lexicon: BDAG
  rationale: ‘차지하다’는 소유·점유의 결과를 간결하게 전달하면서 상속의 결론을 자연스럽게 이어 줍니다.
- source_word: αἱ γενεαὶ αὐτοῦ
  english_pob_choice: his descendants
  chosen_korean: 그의 후손들이
  alternatives_korean:
  - 그의 نسل들이
  - 그의 세대들이
  lexicon: BDAG
  rationale: 히브리·헬라어의 세대적 후속자를 한국어에서 가장 분명하게 드러내는 표현은 ‘후손들’입니다.
theological_decisions:
- issue: 지혜의 인격화와 대명사 처리
  chosen_reading: 문맥상 지혜가 인격화되어 있지만, 한국어 본문에서는 2인칭/3인칭 여성형 인칭대명사보다 ‘그것’으로 정리해 읽기 흐름을 유지했습니다.
  alternative_readings:
  - ‘그녀를’로 옮겨 지혜의 인격성을 더 강하게 드러내는 방식
  - ‘그분을’처럼 신적 인칭을 부여하는 방식
  rationale: 본문은 지혜를 여성형으로 의인화하지만, 한국어에서 이를 지나치게 인칭화하면 문장이 부자연스러워질 수 있어, 의미는 유지하되 표면형은 절제했습니다.
  doctrine_reference: 지혜문학의 의인화 표현 원칙
- issue: 헬라어 본문의 증거를 본문으로 채택
  chosen_reading: 주본문은 제공된 그리스어 병행본문을 따라 번역하고, 히브리어 이문은 각주로 보존했습니다.
  alternative_readings:
  - 히브리어를 따라 ‘그가 낯을 바꾸어 함께 다니며…’로 번역하는 방식
  rationale: 제공된 히브리어는 이 절의 그리스어 전승과 어긋나며, 본문 주석도 이를 변이 전승으로 표시합니다. 따라서 본문은 그리스어를 따르고 히브리어는 대안 독법으로 남기는 것이 가장 투명합니다.
  doctrine_reference: 외경/제외경 본문 비평 원칙
