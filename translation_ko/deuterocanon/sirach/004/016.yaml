  naturalness: ‘그가 신뢰하면, 그는 그것을’은 주어와 지시대명사의 불필요한 반복으로 현대 한국어 문장 흐름이 어색합니다. ‘그가 지혜를 신뢰하면, 지혜를 …’로 정리하면 자연스럽고 참조도 분명합니다. ‘후손들도’는 앞 절의 결과를 이어 주는 자연스러운 연결입니다.
