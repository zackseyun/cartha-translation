  text: Those who hold fast to her will find honor from Yahweh[a], and they will be favored with the blessing of Yahweh.
  footnotes:
  - marker: a
    text: 'Greek: ''The one who holds her fast will inherit glory, and wherever he enters, the Lord will bless.'' The Hebrew reads ''will find honor from the LORD'' and ''they will be shown favor with the blessing of the LORD.'''
