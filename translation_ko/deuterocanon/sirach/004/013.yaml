- from: 그분을 굳게 붙드는 이들은 야훼에게서 영광을 얻고, 야훼의 복으로 은혜를 입을 것입니다.[a]
  to: 지혜를 굳게 붙드는 이들은 야훼에게서 존귀를 얻고, 야훼의 복으로 은혜를 입을 것입니다.[a]
