translation:
  language: ko
  text: 지혜를 굳게 붙드는 이들은 야훼에게서 존귀를 얻고, 야훼의 복으로 은혜를 입을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 “지혜를 굳게 붙드는 사람은 영광을 상속할 것이며, 그가 들어가는 곳마다 주께서 복을 주실 것이다”로 읽습니다. 히브리어는 “지혜를 굳게 붙드는 이들은 야훼에게서 존귀를 얻고, 야훼의 복으로 은혜를 입을 것이다”라고 합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְתֹמְכֶיהָ
  english_pob_choice: those who hold fast to her
  chosen_korean: 그분을 굳게 붙드는 이들은
  alternatives_korean:
  - 그녀를 지지하는 이들은
  - 그녀를 붙들고 있는 이들은
  lexicon: HALOT תמך
  rationale: 지혜를 가리키는 여성 대명사를 받아, 단순한 지원보다 충실한 결속을 드러내는 ‘굳게 붙드는’으로 옮겼습니다.
- source_word: יִמְצְאוּ כָבוֹד
  english_pob_choice: will find honor
  chosen_korean: 영광을 얻고
  alternatives_korean:
  - 존귀를 얻고
  - 영예를 얻고
  lexicon: HALOT כבוד
  rationale: 히브리어의 ‘찾다’와 ‘영광/존귀’의 결합을 자연스럽게 풀어, 하나님께서 주시는 높임의 의미를 살렸습니다.
- source_word: מֵיהֹוָה
  english_pob_choice: from Yahweh / from the LORD
  chosen_korean: 야훼에게서
  alternatives_korean:
  - 야훼로부터
  - 주님에게서
  lexicon: YHWH
  rationale: 원문이 신명기를 직접 지칭하므로, 프로젝트 기본값에 따라 하나님의 이름을 ‘야훼’로 옮기고 출처성을 드러내기 위해 ‘에게서’를 사용했습니다.
- source_word: וְיֻחַנּוּ
  english_pob_choice: they will be favored
  chosen_korean: 은혜를 입을 것입니다
  alternatives_korean:
  - 호의를 입을 것입니다
  - 은총을 입을 것입니다
  lexicon: HALOT חנן
  rationale: 피엘/수동 계열의 ‘은혜를 베풀다, 호의를 보이다’라는 뜻을 수동적으로 살려, 결과 상태를 나타내는 한국어 관용구로 옮겼습니다.
- source_word: בְּבִרְכַּת יְהֹוָה
  english_pob_choice: with the blessing of Yahweh / of the LORD
  chosen_korean: 야훼의 복으로
  alternatives_korean:
  - 야훼의 축복으로
  - 야훼의 복과 함께
  lexicon: HALOT ברכה
  rationale: בְּ는 동반/수단으로 모두 읽힐 수 있어, 하나님의 복이 은혜 입음의 매개라는 점을 살려 간결하게 ‘-으로’로 처리했습니다.
theological_decisions:
- issue: 여호와/주님의 전통 번역 대신 야훼 사용
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문은 히브리어 Tetragrammaton을 직접 사용하므로, 프로젝트 기본값에 따라 하나님의 이름을 가리고 완화하지 않고 음역형 ‘야훼’로 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH'
- issue: לשון השכינה(지혜를 여성 대명사로 지칭) 보존
  chosen_reading: 그분을 굳게 붙드는 이들
  alternative_readings:
  - 그녀를 굳게 붙드는 이들
  rationale: 히브리어의 -הּ는 지혜를 가리키는 여성 대명사이지만, 한국어에서 지혜를 의인화한 ‘그녀’는 다소 어색할 수 있어 문맥의 인격적 지시를 유지하면서도 자연스럽게 ‘그분’을 선택했습니다.
  doctrine_reference: POB stylistic convention for personified wisdom
