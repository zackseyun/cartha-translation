translation:
  language: ko
  text: 하나님께서 당신을 아들이라고 부르시고, 은혜를 베푸시며, 구덩이에서 건져 주실 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 평행문은 ‘당신은 지극히 높으신 이의 아들처럼 되며, 그분은 어머니보다도 당신을 더 사랑하실 것입니다’로 읽습니다. 히브리어 증거는 ‘하나님께서 당신을 아들이라고 부르시고, 은혜를 베푸시며, 구덩이에서 건져 주실 것입니다’라고 읽습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֵל
  english_pob_choice: And God
  chosen_korean: 하나님께서
  alternatives_korean:
  - 그리고 하나님께서
  - 또 하나님께서
  lexicon: HALOT
  rationale: 히브리어 אל은 여기서 일반적인 신칭으로 읽는 것이 자연스러우며, 한국어 POB 기본어휘에 따라 ‘하나님’으로 옮겼습니다.
- source_word: יִקְרָאֲךָ בֵּן
  english_pob_choice: will call you son
  chosen_korean: 당신을 아들이라고 부르시고
  alternatives_korean:
  - 당신을 아들이라 부르시고
  - 당신을 아들로 부르시고
  lexicon: HALOT
  rationale: 히브리어는 직역하면 ‘당신을 아들로 부르다’에 가깝지만, 한국어에서는 서술적 호격 느낌의 ‘아들이라고 부르다’가 가장 자연스럽고, 원문의 단정적 아들 명명도 잘 드러냅니다.
- source_word: וְיָחְנְךָ
  english_pob_choice: he will show you favor
  chosen_korean: 은혜를 베푸시며
  alternatives_korean:
  - 호의를 베푸시며
  - 자비를 베푸시며
  lexicon: HALOT
  rationale: חנן의 핵심은 ‘은혜/호의’를 베푸는 것이므로, 프로젝트 기본어휘인 ‘은혜’를 사용해 문맥의 긍정적 호의를 살렸습니다.
- source_word: וְיַצִּילְךָ מִשָׁחַת
  english_pob_choice: and deliver you from the Pit
  chosen_korean: 구덩이에서 건져 주실 것입니다
  alternatives_korean:
  - 구덩이에서 구해 주실 것입니다
  - 무덤에서 건져 주실 것입니다
  - 파멸에서 건져 주실 것입니다
  lexicon: HALOT
  rationale: שחת은 ‘구덩이/멸망/무덤’ 범위를 가질 수 있으나, 영어 POB가 ‘Pit’로 잡은 점을 따라 죽음의 영역을 너무 특정하지 않는 ‘구덩이’로 옮겼습니다. ‘건져 주시다’는 נצל의 구출·구원 뉘앙스를 자연스럽게 전달합니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 평행문의 차이
  chosen_reading: 본문은 히브리어의 ‘하나님께서 당신을 아들이라고 부르실 것입니다’와 ‘구덩이에서 건져 주실 것입니다’를 따릅니다.
  alternative_readings:
  - ‘지극히 높으신 이의 아들처럼 되실 것입니다’
  - ‘어머니보다 더 당신을 사랑하실 것입니다’
  rationale: 그리스어 평행문은 다른 전승을 보존하지만, 여기서는 현존하는 히브리어 증거를 본문으로 삼고 그 차이를 주석으로만 남기는 것이 원문 우선 원칙에 맞습니다.
  doctrine_reference: 'DOCTRINE.md: Original-language primacy over translation tradition; Preserve theological tension rather than resolve it.'
