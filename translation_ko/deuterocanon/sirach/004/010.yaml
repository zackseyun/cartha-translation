  text: And God will call you son[a], and he will show you favor and deliver you from the Pit.
  footnotes:
  - marker: a
    text: 'Greek: ''and you will be like a son of the Most High, and he will love you more than your mother.'' The Hebrew witness instead reads, ''And God will call you son, and he will show you favor and deliver you from the Pit.'''
