translation:
  language: ko
  text: 지혜는 말에서 알려지고, 명철은 혀의 대답에서 드러납니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 평행본문은 ‘지혜는 말에서 알려지고, 혀의 말 속에 있는 훈육’에 가깝습니다. 히브리어 증인은 ‘명철은 혀의 대답에서’라고 읽습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: בְאֹמֶר
  english_pob_choice: in speech
  chosen_korean: 말에서
  alternatives_korean:
  - 말로
  - 말 가운데
  - 말함으로
  lexicon: HALOT
  rationale: אמר 계열 명사는 발화와 말을 가리키므로, 한국어에서는 자연스럽고 간결한 ‘말에서’로 옮겨 발화의 장을 살렸습니다.
- source_word: נוֹדַעַת
  english_pob_choice: is made known
  chosen_korean: 알려지고
  alternatives_korean:
  - 알려집니다
  - 드러나고
  - 알게 되고
  lexicon: HALOT
  rationale: 니팔형의 수동적 의미를 살려 지혜가 스스로 드러나는 것이 아니라 ‘알려지는’ 수동성을 유지했습니다.
- source_word: תְבוּנָה
  english_pob_choice: understanding
  chosen_korean: 명철
  alternatives_korean:
  - 이해
  - 분별
  - 통찰
  lexicon: HALOT
  rationale: חכמה와의 평행을 살리면서 Sirach에서 지혜문학적 뉘앙스를 더 정확히 반영하는 한국어 어휘로 ‘명철’을 택했습니다.
- source_word: בְּמַעֲנֵה לָשׁוֹן
  english_pob_choice: in the response of the tongue
  chosen_korean: 혀의 대답에서
  alternatives_korean:
  - 혀의 응답에서
  - 혀의 응답으로
  - 말의 대답에서
  lexicon: HALOT
  rationale: 히브리어가 문자적으로 ‘혀의 대답’이라 하므로, 몸의 비유를 유지해 원문 질감을 살리고 영어 POB의 ‘response’도 반영했습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 평행본문의 차이
  chosen_reading: 주본문은 높은 신뢰도의 히브리어를 따라 ‘명철은 혀의 대답에서 드러납니다’로 옮기고, 그리스어의 ‘instruction’ 계열 의미는 본문이 아닌 주해 차원으로만 보존합니다.
  alternative_readings:
  - '그리스어 기반: ‘지혜는 말에서 알려지고, 혀의 말에서 훈육이 있습니다’'
  rationale: 집회서에서는 생존하는 히브리어를 우선하면서도 그리스어를 실제 증언으로 검토해야 합니다. 이 절의 둘째 행은 히브리어 ותבונה במענה לשון과 그리스어 παιδεία ἐν ῥήματι γλώσσης가 갈라지므로, 검증된 히브리어를 본문으로 채택합니다.
  doctrine_reference: 'PHILOSOPHY.md: 히브리어가 보존된 경우 히브리어 본문 우선, 그리스어 평행본문은 검토용 증거로 사용'
