  text: For wisdom is made known in speech[a], and understanding in the response of the tongue.
  footnotes:
  - marker: a
    text: 'Greek parallel: ''and instruction in an utterance of the tongue.'' The Hebrew witness reads ''and understanding in the answer of the tongue.'''
