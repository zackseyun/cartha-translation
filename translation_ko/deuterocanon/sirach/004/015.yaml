review_pass:
  verdict: revise
  source_fidelity: 첫 행의 אֱמֶת는 ‘진리’를 판단의 기준으로 명시하기보다 ‘참되게/올바르게’라는 방식으로 이해하는 편이 자연스럽습니다. 따라서 ‘진리를 따라 심판하다’보다는 ‘올바르게 판단하다’가 히브리어의 간결한 표현과 영어 POB의 ‘judge truly’를 더 충실히 반영합니다. 둘째 행의 안전한 거처는 난해한 히브리어 끝부분을 그리스어 평행본문으로 보조하여 이해한 영어 POB의 결정을 따를 수 있으나, 본문과 각주에서 그 근거가 그리스어임을 분명히 하는 것이 좋습니다.
  naturalness: ‘내 방들 안에서’는 문법적으로 가능하나 현대 한국어에서는 다소 직역투입니다. 인격화된 지혜의 집 내부라는 비유를 살려 ‘내 여러 방에서’로 하면 복수 חדרי와 거처의 이미지를 더 자연스럽게 전달합니다. 두 행 모두 ‘나에게 귀를 기울이는 사람’으로 반복한 것은 원문의 평행법을 보존하므로 유지할 수 있습니다.
  terminology: ‘심판하다’는 종말론적·징벌적 심판을 연상시킬 수 있어 כאן의 משפט에는 ‘판단하다’가 더 중립적이고 자연스럽습니다. ‘거처하다’보다 ‘머물다’가 현대 표준어 합쇼체 문장에 알맞습니다. ‘여러 방’은 Wisdom의 인격화된 집 이미지와 히브리어 복수형을 함께 반영합니다.
  issues:
  - severity: medium
    issue: ‘진리를 따라 심판할’은 אֱמֶת를 판단의 명시적 규범으로 구체화합니다.
    rationale: 히브리어는 문자적으로 ‘진리를 판단할’이며, 문맥상 자연스러운 번역은 ‘참되게/올바르게 판단할’입니다. ‘진리를 따라’는 가능한 해석이지만 원문의 압축성과 다의성을 다소 좁힙니다.
  - severity: low
    issue: ‘내 방들 안에서 안전하게 거처할’은 현대 한국어로 다소 직역투입니다.
    rationale: 복수 חדרי는 보존하되 ‘내 여러 방에서 안전하게 머물’로 옮기면 자연스럽습니다. 안전의 의미는 히브리어 끝구의 난해함 때문에 그리스어 평행본문이 보조한다는 점을 각주에 밝혀야 합니다.
  - severity: medium
    issue: 현행 각주 a는 첫 행의 그리스어 이문만 언급하고, 둘째 행의 ‘안전하게’가 그리스어 평행본문으로 보조되는 사실을 설명하지 않습니다.
    rationale: 영어 POB 감사 기록은 그리스어 κατασκηνώσει πεποιθώς를 난해한 마지막 구의 해명에 사용합니다. 한국어 각주도 이 본문비평적 근거와 불확실성을 밝혀야 합니다.
