base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/004/015.yaml
  text: Whoever listens to me will judge truly[b][a], and whoever gives ear to me will dwell securely in my inner chambers.
  footnotes:
  - marker: a
    text: 'Greek parallel: ''Whoever obeys her will judge nations, and whoever approaches her will camp in confidence.'' The Hebrew witness differs notably in both clauses; the main text follows the surviving Hebrew while using the Greek to clarify the difficult final phrase.'
    reason: alternative_reading
  - marker: b
    text: Hebrew 'my inner chambers' continues the personification of Wisdom as a woman who receives the attentive into her household space.
    reason: cultural_note
translation:
  language: ko
  text: 나에게 귀를 기울이는 사람은 진리를 따라 심판할 것이며, 나에게 귀를 기울이는 사람은 내 방들 안에서 안전하게 거처할 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 첫 절에서 ‘열방’을 말하는 그리스어와 달리 ‘진리/참되게’의 방향으로 읽힙니다.
    reason: textual_variant
  - marker: b
    text: ‘내 방들’은 지혜가 사람처럼 자기 집 안으로 맞아들이는 인격화된 표현을 이어 갑니다.
    reason: cultural_note
lexical_decisions:
- source_word: שׁוֹמֵעַ לִי
  english_pob_choice: whoever listens to me
  chosen_korean: 나에게 귀를 기울이는 사람
  alternatives_korean:
  - 나를 듣는 사람
  - 나에게 순종하는 사람
  lexicon: HALOT
  rationale: שמע는 단순히 듣다보다 응답하는 청취를 포함할 수 있어, 한국어에서는 ‘귀를 기울이다’가 청취와 응답성을 함께 살립니다.
- source_word: יִשׁפֹּט אֱמֶת
  english_pob_choice: will judge truly
  chosen_korean: 진리를 따라 심판할
  alternatives_korean:
  - 참되게 심판할
  - 정확히 심판할
  lexicon: HALOT
  rationale: אמת의 문자적 뜻을 살리되, 한국어에서는 부사적으로 ‘진리를 따라’가 ‘진실하게/바르게’의 의미를 자연스럽게 드러냅니다.
- source_word: וּמַאֲזִין לִי
  english_pob_choice: and whoever gives ear to me
  chosen_korean: 나에게 귀를 기울이는 사람
  alternatives_korean:
  - 나를 경청하는 사람
  - 나의 말을 듣는 사람
  lexicon: HALOT
  rationale: מאזין은 단순 청각보다 주의 깊은 경청을 가리켜, 앞 절과의 평행성을 유지하면서도 반복을 과도하게 피했습니다.
- source_word: בַּחֲדָרַי מִבָּיִת
  english_pob_choice: will dwell securely in my inner chambers
  chosen_korean: 내 방들 안에서 안전하게 거처할 것입니다
  alternatives_korean:
  - 내 안방들에 거할 것입니다
  - 내 내실들에 살 것입니다
  lexicon: HALOT
  rationale: חדרים는 ‘방/내실’ 계열의 내부 공간이며, POB의 audit trail이 Greek parallel을 따라 안전한 거처의 뜻을 반영하므로 ‘안전하게 거처하다’로 옮겼습니다.
theological_decisions:
- issue: 마지막 구의 난해한 히브리어와 그리스어 평행본문의 관계
  chosen_reading: 히브리어 본문을 따라 ‘내 방들 안에서 안전하게 거처할 것입니다’로 옮기되, Greek parallel이 시사하는 안전한 거주 의미를 반영했습니다.
  alternative_readings:
  - 그리스어를 따라 ‘확신하며 진을 칠 것입니다’
  - 더 문자적으로 ‘내 방들에 머물 것입니다’
  rationale: 이 절은 히브리어 끝부분이 다소 난해하므로, 본문이 허용하는 범위 안에서 안전한 거처의 이미지를 살리고 불확실성을 과장하지 않았습니다.
  doctrine_reference: '번역 원칙: 히브리어가 남아 있는 경우 이를 우선하되, 평행본문은 의미 해명에 사용한다.'
