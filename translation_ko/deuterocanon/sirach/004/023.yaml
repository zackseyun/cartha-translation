lexical_decisions:
- source_word: אַל תִּמְנַע
  english_pob_choice: Do not withhold
  chosen_korean: 아끼지 마십시오
  alternatives_korean:
  - 숨기지 마십시오
  - 붙들지 마십시오
  - 억제하지 마십시오
  lexicon: HALOT
  rationale: מנע의 기본 뜻은 ‘막다/막아 두다/아끼다’의 범주에 있어, 현대 한국어에서는 ‘아끼지 마십시오’가 말을 내놓지 않는 태도를 자연스럽게 드러냅니다.
- source_word: דִּבֵּר
  english_pob_choice: a word
  chosen_korean: 말
  alternatives_korean:
  - 한마디
  - 말씀
  - 말 한마디
  lexicon: HALOT
  rationale: 여기서는 추상적 ‘언어’보다 구체적인 발화 단위가 필요하므로, 단수성을 지나치게 두드러지게 하지 않으면서도 자연스러운 ‘말’로 옮겼습니다.
- source_word: בָּעוֹלָם
  english_pob_choice: in the world
  chosen_korean: 세상에서
  alternatives_korean:
  - 세상 안에서
  - 공적으로
  - 세상 속에서
  lexicon: HALOT
  rationale: 직역의 ‘세계/세상 안에서’보다 한국어 관용에 맞는 ‘세상에서’가 מקור의 장면감을 살리면서도 POB의 본문 선택을 유지합니다.
- source_word: וְאַל תַּצְפִּין אֶת חָכְמָתֶךָ
  english_pob_choice: and do not hide your wisdom
  chosen_korean: 당신의 지혜를 숨기지 마십시오
  alternatives_korean:
  - 당신의 지혜를 감추지 마십시오
  - 당신의 지혜를 비밀로 두지 마십시오
  lexicon: HALOT
  rationale: צפן은 ‘숨기다/감추다’의 의미가 분명하므로, 현대 문어에서 가장 직접적인 ‘숨기지 마십시오’로 대응했습니다. ‘지혜’는 חכמה의 표준적 대응어입니다.
theological_decisions:
- issue: 히브리어 본문과 헬라어 병행문의 차이
  chosen_reading: 본문은 히브리어의 ‘세상에서’와 ‘말’을 따라 번역하고, 헬라어의 ‘때’/‘구원’ 의미는 각주로 보존합니다.
  alternative_readings:
  - ‘구원의 때에’ 또는 ‘구출의 때에’
