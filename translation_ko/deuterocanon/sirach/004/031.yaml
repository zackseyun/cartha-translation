translation:
  language: ko
  text: 말에 있어서는 교만하지 말고, 일에 있어서는 느슨하고 게으르지 마십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '그리스어에는 다른 형식의 속담이 있습니다: ‘받으려고 손을 뻗고, 갚을 때에는 거두어들이지 말아라.’'
    reason: textual_variant
lexical_decisions:
- source_word: גַבְהָן
  english_pob_choice: proud
  chosen_korean: 교만하지
  alternatives_korean:
  - 자만하지
  - 오만하지
  - 거만하지
  lexicon: HALOT
  rationale: 말하는 태도의 우쭐함과 자기 우월감을 함께 드러내기 위해 ‘교만하다’를 택했습니다. 문맥이 ‘혀/말’에 붙어 있으므로 형용사보다 부사구로 자연스럽게 연결했습니다.
- source_word: בִּלְשׁוֹנֶךָ
  english_pob_choice: in your speech
  chosen_korean: 말에 있어서는
  alternatives_korean:
  - 혀에 있어서
  - 말할 때
  - 네 혀로
  lexicon: HALOT
  rationale: 직역하면 ‘네 혀 안에서’이지만, 한국어에서는 발화 행위를 가리키는 표현으로 옮기는 것이 뜻을 더 분명하게 전달합니다. 단순한 의역이 아니라 행위 범위를 드러내는 관용적 대응입니다.
- source_word: רָפוּי
  english_pob_choice: slack
  chosen_korean: 느슨하고
  alternatives_korean:
  - 해이하고
  - 나태하고
  - 느리고
  lexicon: HALOT
  rationale: 작업 태도의 풀림, 긴장 없음, 부실함을 살리기 위해 ‘느슨하다’를 선택했습니다. 뒤의 ‘게으르다’와 함께 두 겹의 꾸짖음을 유지합니다.
- source_word: רָשִׁישׁ
  english_pob_choice: negligent
  chosen_korean: 게으르지
  alternatives_korean:
  - 부주의하지
  - 태만하지
  - 나태하지
  lexicon: HALOT
  rationale: 희귀어로서 앞말과 의미가 겹치지만, POB의 영어처럼 두 표현을 분리해 반복적 경고를 보존했습니다. 한국어에서는 ‘게으르다’가 일에 대한 부지런함 부족을 가장 직접적으로 전달합니다.
- source_word: בִּמְלַאכְתֶּךָ
  english_pob_choice: in your work
  chosen_korean: 일에 있어서는
  alternatives_korean:
  - 일에서
  - 네 일에
  - 노동에서
  lexicon: HALOT
  rationale: ‘일/업무/노동’을 포괄하는 말이므로 현대 한국어에서 가장 읽기 쉬운 ‘일’로 옮겼습니다. 앞의 ‘말에 있어서는’과 구조를 맞춰 경계와 대조를 분명히 했습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 평행문의 관계
  chosen_reading: 히브리어 본문을 본문으로 번역하고, 그리스어의 다른 형식은 주석으로 분리합니다.
  alternative_readings:
  - 그리스어처럼 ‘받으려고 손을 뻗고 갚을 때에는 거두어들이는’ 형태로 본문을 옮김
  rationale: 이 절은 히브리어가 높은 신뢰도로 보존되어 있고, 그리스어는 내용상 상당히 다른 속담형을 전합니다. 따라서 본문은 히브리어를 따르되, 다른 전승을 숨기지 않고 각주로 투명하게 남기는 것이 번역 원칙에 부합합니다.
  doctrine_reference: 'PHILOSOPHY.md: 히브리어가 살아 있는 집회서 본문은 히브리어를 우선하고, 다른 전승 차이는 투명하게 표시'
