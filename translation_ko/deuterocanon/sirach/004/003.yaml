base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/004/003.yaml
  text: Do not embitter the inward parts of the poor[a], and do not cause pain to the heart of the needy.
  footnotes:
  - marker: a
    text: Hebrew 'inward parts'; the Greek parallel has 'heart,' interpreting the phrase as the inner emotional life.
    reason: lexical_alternative
translation:
  language: ko
  text: 가난한 이의 속을 쓰리게 하지 말고, 궁핍한 이의 마음을 아프게 하지 마십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘속’은 히브리어 מְעֵי의 직역적 신체 이미지를 한국어 관용으로 옮긴 말이며, 내적 감정의 자리를 가리킵니다. 그리스어 병행 본문은 이를 ‘마음’으로 해석합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְעֵי
  english_pob_choice: inward parts
  chosen_korean: 내장
  alternatives_korean:
  - 내면
  - 속마음
  - 창자
  lexicon: HALOT
  rationale: 히브리어의 구체적 신체 이미지를 살리면서도 한국어에서 비교적 자연스러운 표현으로 옮겼습니다. POB의 ‘inward parts’에 대응하되, ‘속마음’처럼 심리화하여 평평하게 만들지 않았습니다.
- source_word: תַּחְמִיר
  english_pob_choice: embitter
  chosen_korean: 쓰라리게 하다
  alternatives_korean:
  - 가혹하게 하다
  - 괴롭히다
  - 분하게 하다
  lexicon: HALOT
  rationale: 문맥상 단순한 감정의 ‘슬픔’보다 더 강한, 쓰리고 거칠게 만드는 뉘앙스를 반영했습니다. ‘쓰라리게 하다’는 POB의 ‘embitter’가 지닌 감각적·정서적 강도를 비교적 직접적으로 전달합니다.
- source_word: קֶרֶב
  english_pob_choice: heart
  chosen_korean: 마음
  alternatives_korean:
  - 내부
  - 중심
  - 심장
  lexicon: HALOT
  rationale: 두 번째 행은 이미 히브리어의 신체적 이미지보다 내적 정서를 가리키는 방향으로 해석된 POB의 ‘heart’와 맞닿아 있어, 한국어에서는 관용적이면서도 의미를 분명히 하는 ‘마음’을 선택했습니다.
- source_word: עָנִי
  english_pob_choice: the needy
  chosen_korean: 궁핍한 이
  alternatives_korean:
  - 가난한 이
  - 불쌍한 이
  - 억눌린 이
  lexicon: HALOT
  rationale: 첫 행의 ‘가난한 이’와 구별하면서도, עָנִי가 지닌 결핍·의존의 상태를 드러내기 위해 ‘궁핍한 이’로 옮겼습니다. 이는 POB가 ‘needy’를 택한 이유를 한국어로 재현합니다.
- source_word: תַּכְאִיב
  english_pob_choice: cause pain
  chosen_korean: 아프게 하다
  alternatives_korean:
  - 고통을 주다
  - 상하게 하다
  - 괴롭게 하다
  lexicon: HALOT
  rationale: 히브리어 사역형의 직접성을 살리면서, 한국어에서 가장 자연스럽고 즉각적인 표현으로 옮겼습니다. POB의 ‘cause pain’처럼 실제적 고통의 유발을 분명히 합니다.
theological_decisions:
- issue: 히브리어의 신체적 관용구를 한국어에서 얼마나 구체적으로 보존할지
  chosen_reading: 첫 행은 ‘내장’을 유지해 히브리어의 구체성을 살리고, 둘째 행은 ‘마음’으로 풀어 정서적 의미를 분명히 했습니다.
  alternative_readings:
  - 두 행 모두 ‘마음’으로 통일하기
  - 두 행 모두 ‘속사람’으로 추상화하기
  rationale: 이 절은 히브리어 본문이 인간의 내적 삶을 구체적 신체 이미지로 말하는 시를 보존하는 것이 중요합니다. POB의 audit trail도 첫 행과 둘째 행을 구분해 번역하므로, 한국어에서도 그 긴장을 유지했습니다.
  doctrine_reference: Translation philosophy §§1, 5
