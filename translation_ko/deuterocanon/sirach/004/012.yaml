  rationale: 집회서 4:12는 현존 히브리어가 명료하고 우선적인 본문이므로 이를 본문으로 따르되, 그리스어의 다른 전승도 독자를 위해 투명하게 남깁니다.
  doctrine_reference: 'PHILOSOPHY.md: 히브리어가 현존하는 집회서는 히브리어를 우선하되, 유의미한 대안은 각주로 보존'
