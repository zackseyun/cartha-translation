  source_fidelity: 히브리어 נֶפֶשׁ는 여기서 비물질적 ‘영혼’에 한정되기보다 궁핍하고 고통받는 사람 전체를 가리킵니다. ‘궁핍한 영혼’과 ‘부서진 영혼’은 원문의 은유를 따르려는 장점이 있으나, 현대 한국어에서는 영혼의 상태를 말하는 표현으로 좁게 들릴 수 있습니다. ‘궁핍하고 고통받는 이’와 ‘짓눌린 이’는 דֹּוֶוה/חֲסֵרָה 및 מְדֻכְדָּךְ의 의미를 더 자연스럽고 충실하게 전달합니다. אַל תָּפוּחַ의 난해성은 영어 POB의 ‘절망하게 하다’와 그리스어 λυπήσῃς의 ‘괴롭게 하다’ 사이에 남아 있으나, 현 번역의 ‘절망하게 하지 말고’는 영어 감사 번역의 선택을 일관되게 반영합니다.
  naturalness: ‘부서진 영혼을 못 본 체하지 마십시오’도 이해되지만, ‘짓눌린 이를 외면하지 마십시오’가 현대 표준 한국어의 합쇼체에서 더 자연스럽고, 히브리어의 ‘스스로를 숨기다/못 본 체하다’라는 의미도 충분히 보존합니다.
  terminology: ‘영혼’은 נֶפֶשׁ의 가능한 번역어이지만, 이 사회윤리적 권면에서는 ‘이’ 또는 ‘사람’이 한국어 독자에게 인격 전체를 더 정확히 전달합니다. ‘짓눌린’은 מְדֻכְדָּךְ의 눌리고 꺾인 상태를 보존하며, 특정 교리적 함의를 더하지 않습니다.
