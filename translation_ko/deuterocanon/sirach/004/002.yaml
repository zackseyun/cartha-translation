  text: Do not make a needy soul despair[a], and do not ignore a crushed soul.
  footnotes:
  - marker: a
    text: 'Greek parallel: ''Do not grieve a hungry soul, and do not provoke a man in his distress.'' The Hebrew witness is broader (''needy soul'' / ''crushed soul''), so the main text follows the Hebrew while preserving the Greek nuance here.'
