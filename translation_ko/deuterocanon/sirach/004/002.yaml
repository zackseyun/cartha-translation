translation:
  language: ko
  text: 궁핍한 영혼을 절망하게 하지 말고, 부서진 영혼을 못 본 체하지 마십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 병행문은 ‘배고픈 영혼을 슬프게 하지 말라, 그리고 곤경에 있는 사람을 격분시키지 말라’로 읽힙니다. 본문은 히브리어 증인을 따르되, 병행전승의 뉘앙스를 보존합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: דֹּוֶוה נֶפֶשׁ חֲסֵרָה
  english_pob_choice: a needy soul
  chosen_korean: 궁핍한 영혼
  alternatives_korean:
  - 가난한 영혼
  - 궁핍한 사람
  - 결핍된 영혼
  lexicon: HALOT
  rationale: 히브리어는 고통/쇠약의 뉘앙스와 결핍의 뜻을 함께 가지므로, POB의 ‘needy soul’을 따라 물질적·존재적 궁핍을 함께 담는 ‘궁핍한 영혼’으로 옮겼습니다.
- source_word: אַל תָּפוּחַ
  english_pob_choice: do not make ... despair
  chosen_korean: 절망하게 하지 말고
  alternatives_korean:
  - 슬퍼하게 하지 말고
  - 괴롭게 하지 말고
  - 한숨짓게 하지 말고
  lexicon: HALOT
  rationale: 히브리어 동사는 난해하지만, 문맥상 이미 궁핍한 사람의 내적 붕괴를 더 심화시키지 말라는 뜻이며, POB의 해석을 반영해 ‘절망하게 하다’로 옮겼습니다.
- source_word: וְאַל תִּתְעַלֵּם
  english_pob_choice: and do not ignore
  chosen_korean: 못 본 체하지 마십시오
  alternatives_korean:
  - 무시하지 마십시오
  - 외면하지 마십시오
  - 간과하지 마십시오
  lexicon: HALOT
  rationale: 히브리어 관용구는 스스로를 숨기거나 보지 않은 척하는 뜻이므로, 현대 한국어에서 그 행위를 자연스럽게 드러내는 ‘못 본 체하지 마십시오’를 택했습니다.
- source_word: מִמְּדֻכְדַּךְ נָפֶשׁ
  english_pob_choice: a crushed soul
  chosen_korean: 부서진 영혼
  alternatives_korean:
  - 짓눌린 영혼
  - 상한 영혼
  - 깨어진 영혼
  lexicon: HALOT
  rationale: מדוכדך는 눌려 부서진 상태를 가리키므로, 메타포의 강도를 살리면서도 현대 한국어로 자연스러운 ‘부서진 영혼’으로 옮겼습니다.
theological_decisions:
- issue: ‘영혼’의 번역 범위와 인간의 궁핍을 가리키는 표현
  chosen_reading: 신체적 결핍만이 아니라 전체 인격이 궁핍하고 눌린 상태를 가리키는 표현으로 유지했습니다.
  alternative_readings:
  - ‘사람’으로 풀어 인간 대상만 강조하기
  - ‘마음’으로 좁혀 내면 정서만 강조하기
  rationale: 히브리어 נֶפֶשׁ는 단순한 비물질 영혼보다 생명 있는 존재 전체를 가리킬 수 있으므로, 본문의 폭을 보존하는 쪽이 소스에 더 충실합니다.
  doctrine_reference: 성서 히브리어 어휘의 인류학적 용법
- issue: 부정 명령의 강도
  chosen_reading: 권고가 아니라 억압받는 이를 적극적으로 해치지 말라는 금지로 읽었습니다.
  alternative_readings:
  - 완곡한 배려 권유로 읽기
  - 감정적 상처만 피하라는 뜻으로 약화하기
  rationale: 히브리어 금지문과 그리스어 병행문의 어조는 실제로 상대의 처지를 악화시키지 말라는 강한 윤리적 금지를 드러냅니다.
  doctrine_reference: 지혜문학의 사회윤리
