    reason: alternative_reading
lexical_decisions:
- source_word: יָסוּר מֵאַחֲרַי
  english_pob_choice: If he turns away from me
  chosen_korean: 그가 내 뒤에서 돌아서면
  alternatives_korean:
  - 그가 나를 떠나면
  - 그가 나에게서 돌아서면
  - 그가 나를 따르지 않으면
  lexicon: HALOT
  rationale: יָסוּר는 ‘돌아서다/떠나다’의 뜻이 있고, מֵאַחֲרַי는 직역하면 ‘내 뒤에서/나를 따라오던 자리에서’라는 추종 관계를 나타냅니다. 한국어에서는 관계와 방향을 함께 살리기 위해 ‘내 뒤에서 돌아서면’으로 옮겼습니다.
- source_word: אַשׁלִיכֶנּוּ
  english_pob_choice: I will cast him off
  chosen_korean: 내가 그를 내버려 두고
  alternatives_korean:
  - 내가 그를 버리고
  - 내가 그를 내쫓고
  - 내가 그를 내던지고
  lexicon: HALOT
  rationale: 문자적으로는 ‘던지다/내치다’이지만, 지혜문학의 맥락에서는 지혜가 보호와 동행을 거두는 그림이므로 ‘내버려 두고’가 관계적 단절을 자연스럽게 드러냅니다.
- source_word: וְאַסְגִּירֶנּוּ
  english_pob_choice: and hand him over
  chosen_korean: 약탈자들의 손에 넘겨버리겠습니다
  alternatives_korean:
  - 넘겨주겠습니다
  - 건네주겠습니다
  - 그들에게 넘기겠습니다
  lexicon: HALOT
  rationale: סגר의 사역적 의미는 ‘넘겨주다/인도하다’입니다. 여기서는 뒤따르는 목적어와 함께 ‘손에’라는 이미지를 보존해, 단순한 이탈이 아니라 위험한 세력에게 맡겨지는 강도를 살렸습니다.
- source_word: לַשֹׁדְדִים
  english_pob_choice: to plunderers
  chosen_korean: 약탈자들
  alternatives_korean:
  - 노략꾼들
  - 강도들
  - 침탈자들
  lexicon: HALOT
  rationale: שֹׁדְדִים은 전리품을 노리는 자들, 즉 ‘약탈자들’을 뜻합니다. ‘약탈자들’이 본문의 폭력성과 약탈 이미지를 가장 직접적으로 전달합니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 평행문의 차이 반영
  chosen_reading: 주본문은 현존하는 히브리어의 ‘약탈자들에게 넘겨버리다’를 따르고, 그리스어식 ‘그의 몰락의 손에’라는 읽기는 주석으로 보존합니다.
  alternative_readings:
  - 그의 몰락의 손에 넘겨버리겠습니다
  - 그의 파멸에 넘겨버리겠습니다
  rationale: 시락서는 히브리어가 보존된 곳에서는 히브리어를 우선하는 것이 원문 근거에 가장 충실합니다. 다만 그리스어 평행문은 다른 Vorlage 또는 해석적 번역을 시사하므로, 본문은 히브리어를 따르되 차이는 각주로 드러냅니다.
  doctrine_reference: 'PHILOSOPHY.md: translate from Hebrew where Sirach survives; preserve genuine ambiguity in footnotes'
