  - marker: b
    text: 'The Greek parallel in Swete reads a different sentence here: ''Do not be harsh in your tongue, and sluggish and slack in your works.'' The Hebrew Cairo Geniza witness is followed for the main text.'
    reason: textual_variant
translation:
  language: ko
  text: 죽을 때까지 의를 위해 다투십시오. 그러면 야훼께서 당신을 위해 싸워 주십니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '죽을 때까지 정의를 위해 다투십시오.' 히브리어 צֶדֶק은 '의'와 '정의'를 모두 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 본문을 따랐습니다. 그리스어 평행본문은 '혀에서 거칠지 말고, 일에서 게으르고 나태하지 말라'고 읽습니다.
    reason: textual_variant
lexical_decisions:
- source_word: עַד הַמָּוֶת
  english_pob_choice: until death
  chosen_korean: 죽을 때까지
  alternatives_korean:
  - 죽음에 이를 때까지
  - 죽기까지
  lexicon: HALOT
  rationale: 끝까지 지속되는 헌신을 자연스러운 한국어로 옮겼으며, 순교를 과도하게 암시하지 않으면서 원문의 강도를 살렸습니다.
- source_word: הִנָּצֵה
  english_pob_choice: contend
  chosen_korean: 다투십시오
  alternatives_korean:
  - 싸우십시오
  - 변론하십시오
  - 분투하십시오
  lexicon: HALOT
  rationale: 히브리어는 스스로 맞서며 분투하라는 뜻으로, POB의 'contend'에 가장 가까운 한국어는 '다투다'의 대치·경쟁 의미를 살린 '다투십시오'입니다.
- source_word: עַל הַצֶּדֶק
  english_pob_choice: for righteousness
  chosen_korean: 의를 위해
  alternatives_korean:
  - 공의를 위해
  - 정의를 위해
  - 의로움을 위해
  lexicon: HALOT
  rationale: צֶדֶק의 윤리적·종교적 폭을 보존하기 위해 '의'를 택했습니다. '정의'도 가능하지만, 지혜문맥에서는 더 넓은 도덕적 올바름을 가리킵니다.
- source_word: וַיהֹוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: HALOT
  rationale: 본 프로젝트의 기본 용례에 따라 신명은 학술적 음역인 '야훼'로 옮겼습니다.
theological_decisions:
- issue: יהוה의 번역 방식
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 원문에 직접 나타난 신명 יְהוָה를 가리기보다 보존하는 것이 이 절의 언약적 약속을 더 분명히 드러냅니다.
  doctrine_reference: 'POB contested-terms policy: YHWH → 야훼'
- issue: צֶדֶק의 의미 범위
  chosen_reading: 의
  alternative_readings:
  - 정의
  - 의로움
  rationale: 여기서는 법정적 정의보다 하나님 앞에서의 올바름과 충성의 의미가 함께 작동하므로, 포괄적인 '의'가 가장 적절합니다.
  doctrine_reference: POB contested-terms policy on semantic range preservation
