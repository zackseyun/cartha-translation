translation:
  language: ko
  text: 내 아들아, 가난한 이의 삶을[a] 비웃지 말고, 가난하고 마음이 쓰라린 영혼을[b] 괴롭히지 마십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 본문은 “가난한 이의 생명을 빼앗지 말라”라고 하며, 이는 “가난한 이의 생계를 빼앗지 말라”는 뜻으로도 이해될 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어 ‘נֶפֶשׁ’는 여기서 ‘영혼’ 외에도 ‘생명’, ‘자기’, ‘사람’을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנִי
  english_pob_choice: My son
  chosen_korean: 내 아들아
  alternatives_korean:
  - 내 자녀야
  - 내 아이야
  lexicon: HALOT
  rationale: 지혜문학의 전형적인 아들 호칭을 살리되, 한국어에서는 직접 호격으로 자연스럽게 옮겼습니다.
- source_word: אַל תִּלְעַג
  english_pob_choice: do not mock
  chosen_korean: 비웃지 말고
  alternatives_korean:
  - 조롱하지 말고
  - 우습게 여기지 말고
  lexicon: HALOT
  rationale: 동사에는 경멸과 조소의 뜻이 있으므로, 짧고 직설적인 금지 표현인 ‘비웃지 말고’를 택했습니다.
- source_word: לְחַיֵּי עָנִי
  english_pob_choice: the life of the poor
  chosen_korean: 가난한 자의 삶
  alternatives_korean:
  - 가난한 자의 생명
  - 가난한 자의 생활
  lexicon: HALOT
  rationale: 히브리어의 ‘삶/생명’과 그리스어의 사회적 손상 뉘앙스를 함께 살리기 위해, 생존 상태와 삶의 형편을 아우르는 ‘삶’을 썼습니다.
- source_word: וְאַל תַּדְאִיב נֶפֶשׁ עָנֵי וּמַר נָפֶשׁ
  english_pob_choice: do not grieve a poor and bitter soul
  chosen_korean: 가난하고 마음이 쓰라린 영혼을 괴롭게 하지 마십시오
  alternatives_korean:
  - 가난하고 쓰라린 영혼을 슬프게 하지 마십시오
  - 가난하고 마음 아픈 사람을 아프게 하지 마십시오
  lexicon: HALOT
  rationale: נפשׁ는 ‘영혼’뿐 아니라 ‘사람/자기’까지 가질 수 있지만, 여기서는 내면의 고통을 드러내는 표현이므로 ‘영혼’으로 유지했습니다. תַּדְאִיב은 단순한 슬픔보다 ‘괴롭게 하다/아프게 하다’에 가까워 이를 반영했습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행본의 첫 절구 차이
  chosen_reading: 본문은 히브리어를 따라 ‘가난한 자의 삶’을 비웃지 말라고 번역하되, 의미상으로는 가난한 사람의 생존 형편을 해치거나 멸시하는 행위를 포괄하도록 했습니다.
  alternative_readings:
  - ‘가난한 자의 생계를 빼앗지 말고’(그리스어 ἀποστερήσῃς를 더 직접 반영)
  rationale: 히브리어가 현존하는 주본문이므로 이를 우선하되, 그리스어가 시사하는 사회적 해악의 범위를 ‘삶’으로 충분히 넓게 담았습니다.
  doctrine_reference: 'PHILOSOPHY.md: translate from Hebrew where it survives; use Greek parallel as actual translation input'
- issue: 지혜문학의 남성 단수 호칭
  chosen_reading: ‘내 아들아’
  alternative_readings:
  - ‘내 자녀야’
  rationale: 본문의 교육적 호칭을 그대로 보존하는 쪽이 소스의 형식을 더 잘 드러냅니다. 성중립화는 여기서 본문 이해를 더 돕지 않습니다.
  doctrine_reference: DOCTRINE.md §4 Gender-accurate over gender-neutral
