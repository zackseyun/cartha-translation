base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/004/008.yaml
  text: Rescue the oppressed from his oppressors[a], and do not let your spirit grow impatient when judging rightly.
  footnotes:
  - marker: a
    text: 'Greek parallel: ''Incline your ear to the poor, and answer him peaceably with meekness.'' The Hebrew witness here instead speaks of rescuing the oppressed and not growing impatient in just judgment.'
    reason: alternative_reading
translation:
  language: ko
  text: 억눌린 이를 그를 억압하는 자들에게서 구출하십시오[a]. 공정하게 판결할 때에 마음이 조급해지지 않게 하십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '그리스어 병행문: ‘가난한 이에게 귀를 기울이고, 온유하게 그에게 평화롭게 대답하십시오.’ 히브리어 전승은 이와 달리 ‘억눌린 이를 그를 억압하는 자들에게서 구출하고, 공정하게 판결할 때에 마음이 조급해지지 않게 하라’고 말합니다.'
    reason: alternative_reading
lexical_decisions:
- source_word: הוֹשַׁע
  english_pob_choice: Rescue
  chosen_korean: 구원하십시오
  alternatives_korean:
  - 구출하십시오
  - 건져내십시오
  lexicon: HALOT
  rationale: 위급한 상황에서의 능동적 개입을 요구하는 명령형으로 이해하여, 문맥상 가장 자연스럽고 강한 표현인 ‘구원하십시오’를 택했습니다.
- source_word: מוּצָק
  english_pob_choice: the oppressed
  chosen_korean: 억눌린 사람
  alternatives_korean:
  - 억압받는 사람
  - 고통받는 사람
  lexicon: HALOT
  rationale: ‘압박을 받는 상태의 사람’이라는 의미를 살리면서도 한국어에서 매끄럽게 읽히는 표현으로 옮겼습니다.
- source_word: מִמְּצִיקָיו
  english_pob_choice: from his oppressors
  chosen_korean: 그 억압하는 자들로부터
  alternatives_korean:
  - 그를 괴롭히는 자들로부터
  - 그를 압제하는 자들로부터
  lexicon: HALOT
  rationale: 앞절의 ‘억눌린’과 같은 어근 계열의 대응을 살려 사회적 억압의 관계를 분명히 드러냈습니다.
- source_word: וְאַל תָּקוֹץ רוּחֲךָ
  english_pob_choice: do not let your spirit grow impatient
  chosen_korean: 당신의 영이 조급해지지 않게 하십시오
  alternatives_korean:
  - 당신의 영이 불쾌해지지 않게 하십시오
  - 당신의 영이 싫증내지 않게 하십시오
  lexicon: HALOT
  rationale: קוץ의 감정적 불편함·짜증·조급함의 뉘앙스를 반영해, 재판 상황에서 내적 초조함이 생기지 말라는 뜻으로 옮겼습니다.
- source_word: בְּמִשְׁפַט יֹשֶׁר
  english_pob_choice: when judging rightly
  chosen_korean: 바르게 판단할 때에
  alternatives_korean:
  - 의로운 판결을 할 때에
  - 정의롭게 재판할 때에
  lexicon: HALOT
  rationale: ‘judging rightly’의 동사적 뉘앙스를 살려, 판결 행위 자체를 자연스럽게 한국어로 풀었습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행문의 차이
  chosen_reading: 본문은 히브리어 전승을 따르고, 그리스어의 ‘가난한 이를 향해 귀를 기울이라’는 다른 전승은 각주로 보존했습니다.
  alternative_readings:
  - 가난한 이에게 귀를 기울이십시오, 그리고 온유함으로 그에게 평화롭게 대답하십시오.
  rationale: 시락서처럼 히브리어가 보존된 경우에는 히브리어 본문을 우선하되, 그리스어 병행 전승의 실질적 차이를 숨기지 않고 기록하는 것이 감사 가능성과 정직성을 지키는 길입니다.
  doctrine_reference: 'PHILOSOPHY.md: Hebrew priority where extant; preserve alternate Greek tradition in footnote.'
