translation:
  language: ko
  text: 불의한 재판관과 함께 앉지 마십시오. 그와 함께 있으면 판결은 그의 마음대로 이루어집니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '그리스어에는 이곳에 상당히 다른 독법이 있습니다: “진리를 위해 죽기까지 싸우라. 그러면 주 하나님이 너를 위해 싸우실 것이다.”'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תֵּשֵׁב
  english_pob_choice: Do not sit
  chosen_korean: 함께 앉지 마십시오
  alternatives_korean:
  - 앉지 마십시오
  - 함께하지 마십시오
  - 동석하지 마십시오
  lexicon: HALOT
  rationale: 히브리어의 직역 이미지인 ‘앉다’를 살리되, 문맥상 단순한 좌석 동작보다 교제·동참의 금지를 자연스럽게 드러내기 위해 ‘함께 앉지 마십시오’로 옮겼습니다.
- source_word: שׁוֹפֵט
  english_pob_choice: judge
  chosen_korean: 재판관
  alternatives_korean:
  - 판사
  - 심판자
  - 재판장
  lexicon: HALOT
  rationale: 법정 맥락에서 שׁוֹפֵט는 판결을 내리는 자를 가리키므로, 현대 한국어에서 가장 자연스럽고 위계가 덜 특정적인 ‘재판관’으로 옮겼습니다.
- source_word: עַוָּל
  english_pob_choice: unjust
  chosen_korean: 불의한
  alternatives_korean:
  - 불공정한
  - 불의로운
  - 악한
  lexicon: HALOT
  rationale: 법적 부정의와 도덕적 왜곡을 함께 담는 형용사로서, ‘불의한’이 문맥의 도덕적·재판적 뉘앙스를 균형 있게 반영합니다.
- source_word: כַאֲשֶׁר כִּרְצוֹנוֹ תִּשְׁפּוֹט עִמּוֹ
  english_pob_choice: for with him judgment will be according to his pleasure
  chosen_korean: 그와 함께 있으면 판결은 그의 마음대로 이루어집니다
  alternatives_korean:
  - 그와 함께 있으면 판결은 그의 뜻대로 이루어집니다
  - 그와 함께 있으면 판결은 그의 기호에 따라 이루어집니다
  - 그와 함께 있으면 그에게 유리하게 판결됩니다
  lexicon: HALOT
  rationale: כִּרְצוֹנוֹ의 ‘자기 뜻/기쁨’과 판단의 자의성을 살리기 위해 ‘마음대로’로 옮겼고, תִּשְׁפּוֹט עִמּוֹ는 문맥상 ‘그와 함께 있으면 판결이 그렇게 된다’는 의미로 풀어 자연스럽게 표현했습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행문의 큰 차이 처리
  chosen_reading: 히브리어 본문을 본문역으로 따르고, 그리스어의 현저히 다른 독법은 각주로만 제시합니다.
  alternative_readings:
  - '그리스어: “진리를 위해 죽기까지 싸우라. 그러면 주 하나님이 너를 위해 싸우실 것이다.”'
  rationale: 이 절은 현존 히브리어가 분명하므로 본문은 히브리어를 우선하고, 그리스어는 별개의 전승으로서만 투명하게 보존하는 것이 자료 원칙에 맞습니다.
  doctrine_reference: 'PHILOSOPHY.md: 남아 있는 히브리어를 우선하고, 중대한 이본은 정직하게 표기'
