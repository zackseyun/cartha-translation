base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/020/007.yaml
  text: A wise man keeps silent until the right time[a], but a fool does not observe the right time.
  footnotes:
  - marker: a
    text: 'Or, ''does not observe the proper time.'' The Hebrew literally says ''does not keep time.'' The Greek parallel for this verse reads quite differently: ''The one who abounds in speech will be detested, and the one who acts high-handedly will be hated.'''
    reason: alternative_reading
translation:
  language: ko
  text: 지혜로운 사람은 때를 기다리며 잠잠하지만, 어리석은 사람은 때를 살피지 못합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “적절한 때를 살피지 못합니다.” 히브리어는 문자적으로 “때를 지키지 않는다”에 가깝습니다. 이 절의 그리스어 평행문은 “말이 지나치게 많은 사람은 미움을 받을 것이요, 제멋대로 행동하는 사람은 미움을 받을 것이다”로 상당히 다릅니다.
    reason: alternative_reading
lexical_decisions:
- source_word: חָכָם
  english_pob_choice: a wise man
  chosen_korean: 지혜로운 사람
  alternatives_korean:
  - 지혜로운 남자
  - 지혜로운 자
  lexicon: HALOT
  rationale: 히브리어 단수 남성형 격언이지만, 한국어에서는 성별을 전면화하기보다 격언의 대표성을 살려 ‘사람’으로 자연스럽게 옮겼습니다.
- source_word: יַחֲרִישׁ
  english_pob_choice: keeps silent
  chosen_korean: 잠잠하지만
  alternatives_korean:
  - 침묵하지만
  - 말을 하지 않지만
  lexicon: HALOT
  rationale: 동사는 ‘침묵하다/잠잠하다’의 뜻이며, 잠언적 문맥에서 현재적 습관을 살리기 위해 ‘-지만’ 구조로 간결하게 표현했습니다.
- source_word: עַד עֵת
  english_pob_choice: until the right time
  chosen_korean: 때를 기다리며
  alternatives_korean:
  - 알맞은 때까지
  - 적절한 때까지
  - 때까지
  lexicon: HALOT
  rationale: 직역하면 ‘때까지’이지만, 지혜 문맥의 ‘적절한 때’를 한국어에서 자연스럽게 드러내기 위해 ‘때를 기다리며’로 옮겼습니다.
- source_word: לֹא יִשְׁמוֹר עֵת
  english_pob_choice: does not keep time / does not observe the right time
  chosen_korean: 때를 살피지 못합니다
  alternatives_korean:
  - 때를 지키지 못합니다
  - 적절한 때를 살피지 않습니다
  - 때를 지키지 않습니다
  lexicon: HALOT
  rationale: 히브리어의 핵심은 ‘때를 지키다/살피다’는 의미의 부정이며, 한국어에서는 ‘observe’의 감각을 살리면서도 속담처럼 자연스럽게 ‘때를 살피지 못하다’로 표현했습니다.
theological_decisions:
- issue: 지혜와 어리석음의 대조를 직설적으로 유지할지 여부
  chosen_reading: 도덕적·지혜문학적 대조를 약화시키지 않고 그대로 유지했습니다.
  alternative_readings:
  - 부드럽게 일반 교훈으로 완화하는 번역
  - 행동의 서두름을 더 해설적으로 풀어 쓰는 번역
  rationale: 원문은 지혜로운 사람과 어리석은 사람을 대조하는 격언이므로, 해설을 덧붙여 의미를 좁히기보다 간결한 대조를 유지하는 것이 स्रोत에 충실합니다.
  doctrine_reference: 지혜문학의 평행법과 교훈적 대조
