  text: How good it is to reprove rather than to become angry[a], and the one who confesses will be kept from loss.
  footnotes:
  - marker: a
    text: Or 'the one who acknowledges it will be spared disadvantage.' The Greek leaves the object of 'confesses/acknowledges' unstated and the noun for the consequence can mean loss, damage, or disadvantage.
    reason: lexical_alternative
translation:
  language: ko
  text: 꾸짖는 것이 분노하는 것보다 얼마나 좋은지요! 그리고 자백하는 사람은 손실에서 보호받을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그것을 인정하는 사람은 불이익을 면할 것입니다.’ 그리스어는 ‘자백/인정하다’의 대상을 생략하며, 결과를 나타내는 명사는 손실, 해, 불이익을 뜻할 수 있습니다.
    reason: lexical_alternative
