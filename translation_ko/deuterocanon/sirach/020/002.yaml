  source_fidelity: 첫 절은 Ὡς καλὸν의 감탄적 도덕 평가와 ἐλέγξαι/θυμοῦσθαι의 대비를 대체로 충실히 옮겼습니다. 그러나 ‘자백하다’는 한국어에서 범죄나 종교적 죄의 자백을 강하게 연상시켜, 목적어를 밝히지 않는 ὁ ἀνθομολογούμενος보다 의미를 다소 좁힐 수 있습니다. ‘인정하는 사람’이 목적어의 생략을 더 무리 없이 보존합니다. κωλυθήσεται ἀπό는 ‘보호받다’보다 ‘면하다’가 결과의 의미를 자연스럽고 직접적으로 드러냅니다.
  naturalness: ‘분노하는 것’도 이해되지만 현대 표준어에서는 ‘화를 내는 것’이 더 자연스럽습니다. ‘손실에서 보호받을 것입니다’는 한국어 결합이 다소 어색하므로 ‘손실을 면할 것입니다’로 고치는 것이 좋습니다.
  terminology: ἐλέγξαι에는 ‘꾸짖다’가 가능한 번역입니다. ἀνθομολογούμενος는 대상이 명시되지 않았으므로 본문에서 ‘잘못’이나 ‘죄’를 보충하지 않았습니다. ἐλάττωσις는 손실·해·불이익의 폭을 지니며, 본문에서는 ‘손실’, 각주에서 대안을 제시합니다.
