base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/020/020.yaml
  text: A proverb will be rejected from the mouth of a fool[a], for he will certainly not speak it at its proper time.
  footnotes:
  - marker: a
    text: Or, 'A parable will be rejected from the mouth of a fool,' if παραβολή is taken more broadly than 'proverb.'
    reason: lexical_alternative
translation:
  language: ko
  text: 어리석은 사람의 입에서 나온 잠언[a]은 받아들여지지 않을 것입니다. 그는 그것을 알맞은 때에 결코 말하지 않을 것이기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘어리석은 사람의 입에서 나온 비유는 받아들여지지 않을 것입니다.’ παραβολή를 ‘잠언’보다 넓은 뜻으로 이해할 경우입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ στόματος
  english_pob_choice: from the mouth of
  chosen_korean: ~의 입에서는
  alternatives_korean:
  - 입에서
  - 입으로부터
  - 그 입에서
  lexicon: LSJ
  rationale: 발화의 출처를 나타내는 표현이므로, 한국어에서도 ‘입에서는’으로 구체적 출처를 살려 비유적 긴장을 유지했습니다.
- source_word: μωροῦ
  english_pob_choice: a fool
  chosen_korean: 어리석은 사람
  alternatives_korean:
  - 바보
  - 우매한 사람
  - 미련한 사람
  lexicon: LSJ
  rationale: 지혜문학의 μωρός는 지적 부족보다 도덕적·실천적 어리석음을 가리키므로, 현대 한국어에서 직설적이면서도 과도하게 조롱적으로 들리지 않는 ‘어리석은 사람’을 택했습니다.
- source_word: ἀποδοκιμασθήσεται
  english_pob_choice: will be rejected
  chosen_korean: 받아들여지지 않습니다
  alternatives_korean:
  - 거절될 것입니다
  - 배척될 것입니다
  - 인정받지 못합니다
  lexicon: LSJ
  rationale: 수동 미래의 핵심은 그 잠언이 부적절한 화자 때문에 거부된다는 점이므로, 자연스러운 한국어로 ‘받아들여지지 않습니다’라 옮겼습니다.
- source_word: παραβολή
  english_pob_choice: a proverb
  chosen_korean: 잠언
  alternatives_korean:
  - 비유
  - 비유담
  - 속담
  lexicon: LSJ
  rationale: 시락의 지혜문맥에서는 παραβολή가 내러티브 ‘비유’보다 지혜로운 격언에 가깝기 때문에, 한국어 성경 용례에 맞는 ‘잠언’을 사용했습니다.
- source_word: οὐ γὰρ μὴ εἴπῃ αὐτὴν ἐν καιρῷ αὐτῆς
  english_pob_choice: for he will certainly not speak it at its proper time
  chosen_korean: 그는 그것을 적절한 때에 결코 말하지 않기 때문입니다
  alternatives_korean:
  - 그는 그것을 제때에 결코 말하지 않기 때문입니다
  - 그는 그것을 알맞은 때에 말하지 못하기 때문입니다
  lexicon: Greek grammar / LSJ
  rationale: οὐ μὴ의 강한 부정을 ‘결코’로, καιρός의 적합한 때를 ‘적절한 때’로 옮겨 시간성과 적합성을 함께 살렸습니다.
theological_decisions:
- issue: wisdom saying about rejected speech from an unsuitable speaker
  chosen_reading: 이 구절은 지혜문학적 관찰로서, 내용 자체보다 화자의 부적절함이 잠언의 수용 여부에 영향을 준다는 점을 강조합니다.
  alternative_readings:
  - 단순히 ‘말의 타이밍’만을 말하는 것으로 약화하는 해석
  - 화자의 도덕적 상태를 완전히 삭제하는 해석
  rationale: 본문은 잠언의 진술이 맞는지보다, 어리석은 사람이 그것을 제때 말하지 못해 결과적으로 거부된다는 현실을 말하므로 그 긴장을 보존했습니다.
  doctrine_reference: 지혜문학의 화용론적 관찰
- issue: parabole as proverb rather than narrative parable
  chosen_reading: παραβολή를 ‘잠언’으로 옮겨 지혜문학의 장르 감각을 유지했습니다.
  alternative_readings:
  - ‘비유’로 옮겨 예수의 비유처럼 읽히게 하는 해석
  - ‘격언’으로만 좁혀 장르의 폭을 줄이는 해석
  rationale: 시락에서는 παραβολή가 이야기 비유보다 짧은 지혜의 말, 곧 잠언에 가깝게 쓰이므로 본문 장르에 맞춰 처리했습니다.
  doctrine_reference: 시락 20:20의 장르 용례
