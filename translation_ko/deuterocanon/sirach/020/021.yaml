base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/020/021.yaml
  text: There is one who is prevented from sinning by poverty[b][a], and in his rest he will feel no remorse.
  footnotes:
  - marker: a
    text: Or 'through want' or 'because of need.' The Greek phrase points to lack or poverty as the reason the person is restrained.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'he will not be pierced/stung.' The sense is that he will feel no inward compunction or remorse.
    reason: lexical_alternative
translation:
  language: ko
  text: 가난으로 인해 죄를 짓지 못하게 되는 사람도 있고, 그의 쉼에서는 그는 가책을 느끼지 않습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘가난으로 인해’는 헬라어 ἀπὸ ἐνδείας의 원인적 의미를 따른 번역입니다. ‘궁핍 때문에’, ‘결핍으로 인해’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘가책을 느끼지 않습니다’는 문자적으로는 ‘찌름/찔림을 받지 않는다’는 표현을 풀어 옮긴 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: κωλυόμενος ἁμαρτάνειν
  english_pob_choice: is prevented from sinning
  chosen_korean: 죄를 짓지 못하게 되는
  alternatives_korean:
  - 죄를 짓는 데서 막히는
  - 죄짓기를 방해받는
  lexicon: BDAG
  rationale: κωλυόμενος는 단순히 ‘못하다’보다 외적 제지로 ‘막히다/못하게 되다’의 뜻이 더 분명하므로, 자연스러운 합쇼체로 옮겼습니다.
- source_word: ἀπὸ ἐνδείας
  english_pob_choice: by poverty
  chosen_korean: 가난으로 인해
  alternatives_korean:
  - 궁핍으로 인해
  - 결핍 때문에
  - 모자람 때문에
  lexicon: LSJ
  rationale: ἐνδεία는 궁핍, 결핍, 가난의 범위를 가지므로, 원인 관계를 살리면서 가장 직관적인 ‘가난으로 인해’를 택했습니다.
- source_word: ἐν τῇ ἀναπαύσει αὐτοῦ
  english_pob_choice: in his rest
  chosen_korean: 그의 쉼에서는
  alternatives_korean:
  - 그가 쉬는 때에는
  - 그의 안식 가운데서는
  lexicon: LSJ
  rationale: ἀναπαύσις는 단순 휴식 이상의 ‘쉼/안정된 상태’를 가리킬 수 있으므로, 본문 의미를 넓게 열어 두는 ‘쉼’을 사용했습니다.
- source_word: οὐ κατανυγήσεται
  english_pob_choice: he will feel no remorse
  chosen_korean: 가책을 느끼지 않습니다
  alternatives_korean:
  - 찔림을 느끼지 않습니다
  - 마음이 찔리지 않습니다
  - 후회하지 않습니다
  lexicon: LSJ
  rationale: κατανύσσομαι 계열은 문자적으로 ‘찔리다/찌르다’의 이미지를 가지지만, 여기서는 내적 양심의 찔림을 뜻하므로 ‘가책’이 가장 적절합니다.
theological_decisions:
- issue: 가난이 죄를 막는다는 지혜문학적 진술
  chosen_reading: 이 절은 가난 자체를 미화하기보다, 가난이 어떤 사람에게는 죄를 짓지 못하게 하는 현실적 제약이 될 수 있다고 관찰합니다.
  alternative_readings:
  - 가난을 도덕적 선으로 읽는 해석
  - 단순한 사회적 결핍 진술로만 약화하는 해석
  rationale: 본문은 교리 선언이 아니라 관찰형 지혜 진술이므로, 가난의 도덕적 가치를 과장하지도, 의미를 지나치게 약화하지도 않게 옮겼습니다.
  doctrine_reference: 지혜문학의 관찰 진술을 교리화하지 않음
