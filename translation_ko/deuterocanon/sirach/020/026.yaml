lexical_decisions:
- source_word: ἦθος
  english_pob_choice: character
  chosen_korean: 성품
  alternatives_korean:
  - 성격
  - 품성
  - 습성
  lexicon: LSJ
  rationale: ἦθος는 단순한 습관보다 사람의 고정된 도덕적 성향을 가리키므로, 문맥상 ‘성품’이 가장 자연스럽게 그 의미를 살립니다.
- source_word: ἀνθρώπου ψευδοῦς
  english_pob_choice: of a lying man
  chosen_korean: 거짓말하는 사람의
  alternatives_korean:
  - 거짓된 사람의
  - 기만하는 사람의
  - 거짓말하는 남자의
  lexicon: LSJ
  rationale: ψευδοῦς는 거짓말을 일삼는 사람의 성격을 가리키므로, 성별을 과도하게 드러내지 않으면서도 행위의 성격을 살려 ‘거짓말하는 사람의’로 옮겼습니다.
- source_word: ἀτιμία
  english_pob_choice: dishonor
  chosen_korean: 불명예
  alternatives_korean:
  - 수치
  - 치욕
  - 불명예스러움
  lexicon: LSJ
  rationale: ἀτιμία는 명예의 상실, 곧 사회적·도덕적 불명예를 뜻하므로 ‘불명예’가 가장 직접적이고 자연스럽습니다.
- source_word: ἐνδελεχῶς
  english_pob_choice: continually
  chosen_korean: 끊임없이
  alternatives_korean:
  - 늘
  - 계속
  - 지속적으로
  lexicon: LSJ
  rationale: ἐνδελεχῶς는 지속성과 끊어지지 않는 상태를 나타내므로, 반복·지속의 뉘앙스를 분명히 하는 ‘끊임없이’가 적절합니다.
