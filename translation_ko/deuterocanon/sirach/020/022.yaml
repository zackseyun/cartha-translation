  text: There is one who destroys his own life through shame[b][a], and because of a foolish face he will lose it.
  footnotes:
  - marker: a
    text: Or 'his soul' for 'his own life'; Greek ψυχή can mean 'life,' 'self,' or 'soul.'
    reason: lexical_alternative
  - marker: b
    text: Literally, 'from a foolish face/countenance.' The phrase likely refers to a foolish or senseless facial expression or outward demeanor.
    reason: lexical_alternative
translation:
  language: ko
  text: 부끄러움 때문에 자기 생명을 파괴하는 이도 있고, 어리석은 얼굴 때문에 그것을 잃는 이도 있습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 영혼’으로도 옮길 수 있습니다. 그리스어 ψυχή는 ‘생명’, ‘자기 자신’, ‘영혼’을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘어리석은 얼굴/얼굴표정 때문에’입니다. 여기서는 어리석거나 무분별한 외적 태도나 표정을 가리키는 것으로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπολλύων τὴν ψυχὴν αὐτοῦ
  english_pob_choice: destroys his own life
  chosen_korean: 자기 생명을 파괴하는
  alternatives_korean:
  - 자기 목숨을 잃는
  - 자기 영혼을 망치는
  lexicon: BDAG
  rationale: ἀπόλλυμι는 여기서 자기 파멸의 강한 의미를 가지므로 ‘파괴하는’이 행위의 파괴성을 잘 드러냅니다. ψυχή는 이 문맥에서 ‘생명’이 가장 자연스럽고, ‘영혼’으로 좁히지 않도록 했습니다.
- source_word: διʼ αἰσχύνην
  english_pob_choice: through shame
  chosen_korean: 부끄러움 때문에
  alternatives_korean:
  - 수치 때문에
  - 부끄러움으로
  - 수치심으로
  lexicon: LSJ
  rationale: διά + 대격은 원인/수단을 나타낼 수 있으므로, 결과를 낳는 원인을 한국어로 자연스럽게 풀어 ‘때문에’로 옮겼습니다.
- source_word: ἀπὸ ἄφρονος προσώπου
  english_pob_choice: because of a foolish face
  chosen_korean: 어리석은 얼굴 때문에
  alternatives_korean:
  - 어리석은 표정 때문에
  - 어리석은 얼굴상 때문에
  - 어리석은 모습 때문에
  lexicon: LSJ
  rationale: πρόσωπον의 기본 의미인 ‘얼굴’을 유지하고, ἄφρων의 ‘어리석은/무분별한’ 의미를 직역해 이미지와 판단을 함께 살렸습니다.
- source_word: ἀπολεῖ αὐτήν
  english_pob_choice: he will lose it
  chosen_korean: 그것을 잃는 이도 있습니다
  alternatives_korean:
  - 그것을 잃게 됩니다
  - 그것을 잃을 것입니다
  - 그것을 파괴할 것입니다
  lexicon: BDAG
  rationale: 앞절의 ψυχή를 받아 ‘그것’을 사용해 반복을 살렸고, 미래형의 일반적 진술을 한국어 현재 서술로 자연스럽게 표현했습니다.
theological_decisions:
- issue: ψυχή의 범위
  chosen_reading: 생명
  alternative_readings:
