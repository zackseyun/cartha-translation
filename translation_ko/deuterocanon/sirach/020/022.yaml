  yaml_path: translation/deuterocanon/sirach/020/022.yaml
  text: There is one who destroys his own life through shame[b][a], and because of a foolish face he will lose it.
  footnotes:
  - marker: a
    text: Or 'his soul' for 'his own life'; Greek ψυχή can mean 'life,' 'self,' or 'soul.'
    reason: lexical_alternative
  - marker: b
    text: Literally, 'from a foolish face/countenance.' The phrase likely refers to a foolish or senseless facial expression or outward demeanor.
    reason: lexical_alternative
translation:
  language: ko
  text: 부끄러움 때문에 자기 생명[a]을 파멸시키는 사람이 있으며, 그는 어리석은 얼굴[b] 때문에 그것을 잃게 될 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 영혼’ 또는 ‘자기 자신’으로도 옮길 수 있습니다. 그리스어 ψυχή는 ‘생명’, ‘영혼’, ‘자기 자신’을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘어리석은 얼굴 때문에’입니다. 그리스어 πρόσωπον은 ‘얼굴’, ‘낯빛’, 또는 겉으로 드러난 모습을 뜻할 수 있습니다.
    reason: lexical_alternative
