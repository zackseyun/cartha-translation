  - 자기 자신
  rationale: 지혜문학의 경고 문맥에서 ψυχή를 ‘생명’으로 옮기면 인간의 실존적 파괴를 바로 전달하면서, 본문이 요구하지 않는 영혼론적 해석을 덧붙이지 않습니다.
