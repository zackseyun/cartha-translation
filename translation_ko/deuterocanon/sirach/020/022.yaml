  - 그것을 파괴할 것입니다
  lexicon: BDAG
  rationale: 앞절의 ψυχή를 받아 ‘그것’을 사용해 반복을 살렸고, 미래형의 일반적 진술을 한국어 현재 서술로 자연스럽게 표현했습니다.
