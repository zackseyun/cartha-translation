  text: Hospitality and gifts blind the eyes of the wise[b][a], and like a muzzle on the mouth they turn away rebukes.
  footnotes:
  - marker: a
    text: Or 'guest-gifts' for 'hospitality'; the Greek ξένια can refer to hospitality shown to a guest or to gifts associated with guest-friendship.
    reason: lexical_alternative
  - marker: b
    text: '''Gifts'' here carries the sense of favors that can corrupt judgment; the Greek does not explicitly say ''bribes.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 접대와 선물은 지혜로운 이들의 눈을 멀게 하고, 입에 씌운 입마개처럼 책망을 물리칩니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ξένια는 손님을 맞이하는 ‘접대’ 또는 그와 관련된 ‘손님 선물’을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 여기서 ‘선물’은 판단을 그릇되게 할 수 있는 호의나 증여를 뜻할 수 있으나, 원문에는 ‘뇌물’이라는 말이 직접 나오지 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ξένια
  english_pob_choice: hospitality
  chosen_korean: 호의
  alternatives_korean:
