  lexicon: LSJ
  rationale: ξένια는 손님 환대 자체와 그에 딸린 호의나 증여를 아우를 수 있으므로, 본문에서는 δῶρα와 중복을 피하면서 사회적 호의를 살리는 ‘호의’로 옮겼습니다.
- source_word: δῶρα
  english_pob_choice: gifts
  chosen_korean: 선물
  alternatives_korean:
  - 증정물
  - 예물
  - 뇌물
  lexicon: LSJ
  rationale: 원문은 직접 ‘뇌물’이라고 말하지 않으므로, 외형상 중립적인 ‘선물’을 유지하되 문맥상 판단을 흐리게 하는 유혹이라는 힘을 살렸습니다.
- source_word: ἀποτυφλοῖ
  english_pob_choice: blind
  chosen_korean: 눈을 멀게 하고
  alternatives_korean:
  - 눈을 가리고
  - 시야를 흐리게 하고
  lexicon: LSJ
  rationale: 강한 인과적 동사이므로, 단순한 시야 방해보다 결과를 분명히 드러내는 ‘눈을 멀게 하고’가 원문 힘을 가장 잘 보존합니다.
- source_word: φιμός
  english_pob_choice: muzzle
  chosen_korean: 재갈을 물린 것처럼
  alternatives_korean:
  - 입마개를 한 것처럼
  - 재갈처럼
  lexicon: LSJ
  rationale: ‘mouth’에 놓인 구체적 이미지가 핵심이므로, 동물의 입을 막는 물건을 연상시키는 ‘재갈’을 택해 비유를 살렸습니다.
