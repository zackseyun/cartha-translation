lexical_decisions:
- source_word: δόσις
  english_pob_choice: gift
  chosen_korean: 선물
  alternatives_korean:
  - 줌
  - 나눔
  - 주는 것
  lexicon: LSJ
  rationale: δόσις는 ‘주는 행위/주는 것’이지만, 잠언적 문맥에서 한국어로는 간결한 ‘선물’이 자연스럽고 의미도 넓게 유지됩니다. 다만 반복되는 추상성을 살리기 위해 ‘선물 중에는… 선물 중에는…’으로 구조를 맞췄습니다.
- source_word: λυσιτελήσει
  english_pob_choice: will profit
  chosen_korean: 유익하지 않은
  alternatives_korean:
  - 이익이 되지 않는
  - 도움이 되지 않는
  - 유리하지 않은
  lexicon: LSJ
  rationale: λυσιτελήσει는 ‘유익하다/이익이 되다’의 미래형으로, 한국어에서는 잠언체에 맞게 부정형으로 옮겨 ‘유익하지 않은’이라고 했습니다.
- source_word: ἀνταπόδομα
  english_pob_choice: repayment
  chosen_korean: 보상
  alternatives_korean:
  - 되갚음
  - 보답
  - 갚음
  lexicon: LSJ
  rationale: ἀνταπόδομα는 되돌려 주는 것, 상응하는 반환을 가리키므로 ‘보상’이 가장 무난합니다. ‘되갚음’은 다소 구어적이고, ‘보답’은 호의에 대한 응답 뉘앙스가 강합니다.
- source_word: διπλοῦν
  english_pob_choice: double
  chosen_korean: 두 배
  alternatives_korean:
  - 배로 된
  - 이중의
  - 두 겹인
  lexicon: LSJ
  rationale: διπλοῦν은 직접적으로 ‘두 배’라는 수량적 의미이므로, 현대 한국어에서 가장 분명한 ‘두 배’로 옮겼습니다.
