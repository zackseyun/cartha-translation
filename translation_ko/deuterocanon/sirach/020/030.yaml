  text: Hidden wisdom and an unseen treasure—what benefit is there in either of them?[a]
  footnotes:
  - marker: a
    text: Or, more formally, 'what profit is there in both?' The Greek ἐν ἀμφοτέροις refers to the two items together; the main text uses idiomatic English to express the sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 숨겨진 지혜와 보이지 않는 보물, 그 둘에 무슨 유익이 있겠습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 직역하면, ‘둘 다에 무슨 유익이 있겠습니까?’라고 옮길 수 있습니다. 그리스어 ἐν ἀμφοτέροις는 이 두 대상을 함께 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: σοφία
  english_pob_choice: wisdom
  chosen_korean: 지혜
  alternatives_korean:
