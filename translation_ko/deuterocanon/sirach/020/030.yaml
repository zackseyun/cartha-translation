  - 보화
  lexicon: LSJ
  rationale: 여기서는 추상적 가치가 아닌 구체적이고 귀한 대상의 이미지를 살리는 것이 적절합니다.
- source_word: ἀφανής
  english_pob_choice: unseen
  chosen_korean: 보이지 않는
  alternatives_korean:
