  lexicon: LSJ
  rationale: 이미 κεκρυμμένη가 '숨겨진'을 담고 있으므로, ἀφανής는 시각적으로 드러나지 않음을 분명히 하면서 중복을 피하는 표현이 적합합니다.
- source_word: ἐν ἀμφοτέροις
  english_pob_choice: in either of them
  chosen_korean: 둘 중 어느 것에도
  alternatives_korean:
  - 둘 다에
  - 그 둘에
  lexicon: LSJ
  rationale: 직역상 '둘 모두에/둘 중에'의 범위가 있으나, 수사적 질문의 요지는 접근 불가능한 두 항목의 유익 없음이므로 한국어로는 '둘 중 어느 것에도'가 가장 자연스럽습니다.
theological_decisions:
- issue: 수사적 질문의 뉘앙스
  chosen_reading: 이 절은 지혜와 보물이 '숨겨져/보이지 않는' 상태일 때의 무익함을 묻는 수사적 질문으로 읽습니다.
  alternative_readings:
  - 단순 정보 질문으로 읽기
  - 둘을 함께 갖고 있어도 유익이 없다는 뜻으로 좁게 읽기
  rationale: 본문의 τίς ὠφέλεια는 기대하는 답이 '없다'인 수사적 질문이며, POB의 주석처럼 두 항목의 결합된 무익함을 드러내되 한국어에서는 자연스럽게 풀어야 합니다.
  doctrine_reference: 지혜문학의 수사적 질문 해석
