  rationale: 완료 수동 분사로서 이미 감춰져 있는 상태를 자연스럽게 나타내며, 현대 한국어에서도 간결합니다.
- source_word: θησαυρὸς
  english_pob_choice: treasure
  chosen_korean: 보물
  alternatives_korean:
