  text: Hidden wisdom and an unseen treasure—what benefit is there in either of them?[a]
  footnotes:
  - marker: a
    text: Or, more formally, 'what profit is there in both?' The Greek ἐν ἀμφοτέροις refers to the two items together; the main text uses idiomatic English to express the sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 숨겨진 지혜와 보이지 않는 보물은 — 둘 중 어느 것에도 무슨 유익이 있겠습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 직역하면, '둘 다에 무슨 유익이 있습니까?'라고 옮길 수 있습니다. 그리스어 ἐν ἀμφοτέροις는 두 항목을 함께 가리키므로, 본문은 그 뜻을 자연스럽게 나타냈습니다.
    reason: lexical_alternative
