  text: Those who eat my bread are evil of tongue[a]; how often, and how many[b], will laugh at him?
  footnotes:
  - marker: a
    text: Or 'will mock him.' The Greek verb can carry the stronger sense of ridicule, not merely laughter.
    reason: lexical_alternative
  - marker: b
    text: The Greek of the second clause is abrupt and may reflect a compressed or difficult text; the translation stays close to the extant wording rather than smoothing it heavily.
    reason: textual_variant
translation:
  language: ko
  text: 내 빵을 먹는 자들은 혀로 악합니다[a]. 얼마나 자주, 또 얼마나 많은 이들이 그를 비웃겠습니까[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그를 조롱합니다.’ 그리스어 동사는 단순한 웃음보다 조롱의 강한 뜻을 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 둘째 절의 그리스어는 갑작스럽고 압축된 형태일 수 있어, 매끄럽게 다듬기보다 현전 본문에 가깝게 옮겼습니다.
    reason: textual_variant
lexical_decisions:
- source_word: οἱ ἐσθίοντες
  english_pob_choice: those who eat
  chosen_korean: 먹는 자들
  alternatives_korean:
  - 먹는 이들
  - 먹는 사람들
  lexicon: LSJ
  rationale: 현재분사 명사적 용법을 한국어의 자연스러운 집단 표현인 ‘먹는 자들’로 옮겨, 지속적·일반적 의미를 살렸습니다.
- source_word: τὸν ἄρτον μου
  english_pob_choice: my bread
  chosen_korean: 내 빵
  alternatives_korean:
