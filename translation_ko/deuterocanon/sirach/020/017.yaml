translation:
  language: ko
  text: 내 빵을 먹는 자들은 말이 악한 자들입니다. 얼마나 자주, 또 얼마나 많은 이들이 그를 비웃겠습니까[a]?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그를 조롱하겠습니까.’ 그리스어 동사는 단순한 웃음보다 조롱의 강한 뜻을 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 둘째 절의 그리스어는 갑작스럽고 압축된 형태일 수 있어, 매끄럽게 다듬기보다 현전 본문에 가깝게 옮겼습니다.
    reason: textual_variant
