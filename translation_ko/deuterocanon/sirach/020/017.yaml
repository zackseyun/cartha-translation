  alternative_readings:
  - ‘얼마나 자주, 또 얼마나 많은 이들이 그를 조롱하겠습니까?’로 더 강하게 옮김
  - ‘얼마나 자주, 또 얼마나 많은 이들이 그를 비웃을지요!’처럼 감탄형으로 풀어씀
  rationale: 원문은 다소 급작스럽고 압축되어 있으므로, 매끄럽게 정리하기보다 현전 본문의 날것을 보존하는 쪽이 소스-우선 원칙에 부합합니다.
  doctrine_reference: 원문의 난해함과 압축성을 보존하여, 의미를 해소하기보다 본문 증언을 우선함.
