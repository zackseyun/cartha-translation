  rationale: 직역에 가까운 ‘내 빵’이 원문의 구체성을 유지하며, 베풂과 식탁 교제를 암시하는 표현을 흐리지 않습니다.
- source_word: φαῦλοι γλώσσῃ
  english_pob_choice: evil of tongue
  chosen_korean: 혀로 악합니다
  alternatives_korean:
  - 말이 악합니다
  - 혀가 사악합니다
  lexicon: LSJ
  rationale: ‘γλώσσῃ’의 도구적 의미를 살리면서도 한국어에서 어색한 소유격 표현을 피하기 위해 ‘혀로’로 옮겼고, ‘φαῦλοι’는 도덕적 부패를 드러내는 ‘악합니다’로 압축했습니다.
- source_word: καταγελάσονται
  english_pob_choice: will laugh at / mock
  chosen_korean: 비웃겠습니까
  alternatives_korean:
  - 조롱하겠습니까
  - 웃어대겠습니까
  lexicon: LSJ
  rationale: 단순한 웃음보다 조롱·비웃음의 뜻이 강하므로 ‘비웃다’가 본문과 주해를 가장 잘 반영합니다.
theological_decisions:
- issue: 둘째 절의 압축되고 난해한 어순을 어떻게 처리할지
  chosen_reading: 의미를 과도하게 풀지 않고, 수사적 질문의 긴장감을 유지해 ‘얼마나 자주, 또 얼마나 많은 이들이 그를 비웃겠습니까?’로 직역에 가깝게 두었습니다.
  alternative_readings:
  - ‘얼마나 자주, 또 얼마나 많은 이들이 그를 조롱하겠습니까?’로 더 강하게 옮김
  - ‘얼마나 자주, 또 얼마나 많은 이들이 그를 비웃을지요!’처럼 감탄형으로 풀어씀
  rationale: 원문은 다소 급작스럽고 압축되어 있으므로, 매끄럽게 정리하기보다 현전 본문의 날것을 보존하는 쪽이 소스-우선 원칙에 부합합니다.
  doctrine_reference: 원문의 난해함과 압축성을 보존하여, 의미를 해소하기보다 본문 증언을 우선함.
