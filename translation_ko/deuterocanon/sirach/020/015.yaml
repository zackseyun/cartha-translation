  yaml_path: translation/deuterocanon/sirach/020/015.yaml
  text: Today he lends[a], and tomorrow he demands it back; such a man is hateful.
  footnotes:
  - marker: a
    text: Or, 'such a person is hated' or 'detestable.' The Greek adjective μισητός can be understood either as describing the man's odious character or the reaction he provokes.
    reason: lexical_alternative
translation:
  language: ko
  text: 오늘은 빌려주고 내일은 돌려 달라고 요구합니다. 그런 사람은 혐오스럽습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그런 사람은 미움을 받습니다.’ 그리스어 형용사 μισητός는 그 사람이 혐오스럽다는 평가를 나타낼 수도 있고, 그가 미움을 받는다는 뜻일 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: σήμερον
  english_pob_choice: Today
  chosen_korean: 오늘
  alternatives_korean:
  - 금일
  - 오늘날
  lexicon: LSJ
  rationale: 즉시적인 현재를 가리키는 부사이므로, 속담의 시간 대비를 살려 가장 자연스럽게 ‘오늘’로 옮겼습니다.
- source_word: δανιεῖ
  english_pob_choice: he lends
  chosen_korean: 빌려 주고
  alternatives_korean:
  - 빌립니다
  - 빌려 줍니다
  - 대여합니다
  lexicon: LSJ
  rationale: 미래형이지만 격언적 현재로 쓰인 표현이어서, 한국어에서는 행위의 반복적·일반적 성격을 살리는 ‘빌려 주고’로 옮겼습니다.
- source_word: ἀπαιτήσει
  english_pob_choice: he demands it back
  chosen_korean: 그것을 되돌려 달라고 요구합니다
  alternatives_korean:
  - 돌려달라고 요구합니다
  - 상환을 요구합니다
  - 되찾으려 합니다
  lexicon: LSJ
  rationale: 문맥상 빌려 준 것을 다시 요구하는 뜻이므로, 암시된 목적어를 한국어에서 분명히 드러내되 원문의 의미를 넘지 않도록 했습니다.
- source_word: μισητὸς ἄνθρωπος
  english_pob_choice: such a man is hateful
  chosen_korean: 그런 사람은 미움을 받습니다
  alternatives_korean:
  - 그런 사람은 미운 사람입니다
  - 그런 사람은 혐오스럽습니다
  - 그런 사람은 사람들에게 미움을 삽니다
  lexicon: LSJ
  rationale: μισητός는 ‘미운/가증한’과 함께 ‘미움을 받는’도 가능하므로, 여기서는 행위의 평가와 반응을 함께 담는 표현으로 옮겼습니다.
- source_word: ὁ τοιοῦτος
  english_pob_choice: such a
  chosen_korean: 그런
  alternatives_korean:
  - 이런
  - 저런
  - 그와 같은
  lexicon: LSJ
  rationale: 직전의 행위를 가리키는 지시적 표현이므로, 간결한 ‘그런’으로 유형을 묶어 주었습니다.
theological_decisions:
- issue: μισητός의 의미를 ‘사람의 성격’과 ‘사람이 받는 반응’ 중 어떻게 살릴지
  chosen_reading: ‘그런 사람은 미움을 받습니다’로 옮겨, 평가적 성격과 사회적 반응을 함께 열어 둡니다.
  alternative_readings:
  - 그런 사람은 미운 사람입니다
  - 그런 사람은 혐오스럽습니다
  - 그런 사람은 미움을 받는 사람입니다
  rationale: 주석에 제시된 양쪽 가능성(그 사람의 성품 또는 그가 유발하는 반응)을 한국어 본문에서 모두 지나치게 좁히지 않도록 했습니다.
  doctrine_reference: 'POB 번역 원칙: 원문의 어휘적 긴장을 보존하고 단일 해석으로 과도하게 봉합하지 않음'
