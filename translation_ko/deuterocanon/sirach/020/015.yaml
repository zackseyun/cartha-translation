  terminology: ‘혐오스럽습니다’는 μισητός의 ‘hateful/detestable’ 의미를 현대 합쇼체로 자연스럽게 전달합니다. ‘돌려 달라고 요구합니다’는 ἀπαιτήσει의 반환 요구를 충실히 나타냅니다.
