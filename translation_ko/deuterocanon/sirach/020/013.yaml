  - 현자
  lexicon: HALOT
  rationale: וע substantival 형용사로서 '지혜로운 사람'이 자연스럽고, 성별을 과도하게 강조하지 않으면서도 인물을 가리키는 뜻을 살립니다.
- source_word: בִּמְעַט
