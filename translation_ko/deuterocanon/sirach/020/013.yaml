base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/020/013.yaml
  text: A wise man speaks little for himself[c][b][a], but the goodness of fools pours out wisdom.
  footnotes:
  - marker: a
    text: 'Greek: ''A fool’s gift will not benefit you, for his eyes are many instead of one.'' The Hebrew and Greek witnesses differ substantially in this verse; the main text follows the extant Hebrew witness, with the Greek preserved here because the divergence materially affects interpretation.'
    reason: textual_variant
  - marker: b
    text: Or 'A wise man speaks briefly.'
    reason: lexical_alternative
  - marker: c
    text: 'The final clause may be ironic: fools pour out words as if dispensing wisdom.'
    reason: lexical_alternative
translation:
  language: ko
  text: 지혜로운 사람은 자신을 위해 적게 말합니다. 그러나 어리석은 자들의 선함은 지혜를 쏟아 냅니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어와 그리스어 전승이 이 절에서 크게 다릅니다. 본문은 현존 히브리어를 따르며, 그리스어는 해석에 중요한 차이가 있어 별도로 보존됩니다.
    reason: textual_variant
  - marker: b
    text: 또는 ‘지혜로운 사람은 짧게 말합니다’.
    reason: lexical_alternative
  - marker: c
    text: 마지막 절은 반어일 수 있습니다. 어리석은 자들이 마치 지혜를 나누는 것처럼 말을 쏟아낸다는 뜻일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָכָם
  english_pob_choice: wise man
  chosen_korean: 지혜로운 사람
  alternatives_korean:
