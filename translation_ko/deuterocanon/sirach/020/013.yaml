  chosen_korean: 적게
  alternatives_korean:
  - 짧게
  - 짧은 말로
  - 조금
  lexicon: HALOT
  rationale: 말의 분량이 적다는 뜻을 한국어 부사로 간결하게 옮겨, 잠언체의 압축성을 유지합니다.
- source_word: נַפְשׁוֹ
  english_pob_choice: for himself
  chosen_korean: 자신을 위해
  alternatives_korean:
  - 그의 영혼을 위해
  - 그 자신을 위해
  lexicon: HALOT
  rationale: נֶפֶשׁ가 여기서는 문자적 '영혼'보다 반사적·관용적 용법으로 보이므로, 자기지시를 드러내는 표현을 택했습니다.
- source_word: טוֹבַת כְּסִילִים
  english_pob_choice: the goodness of fools
  chosen_korean: 어리석은 자들의 선함
  alternatives_korean:
  - 어리석은 자들의 선물
  - 어리석은 자들의 유익
  - 어리석은 자들의 좋음
  lexicon: HALOT
  rationale: 히브리어 טוֹבָה는 '선함/좋음'과 '유익/선물' 모두 가능하며, 본문상 모호성이 남습니다. 영어 POB의 재검토 전통을 따라 본문에는 보다 문자적인 '선함'을 두었습니다.
- source_word: יִשְׁפוֹךְ חָכְמָה
  english_pob_choice: pours out wisdom
  chosen_korean: 지혜를 쏟아 냅니다
  alternatives_korean:
  - 지혜를 흘려보냅니다
  - 지혜를 쏟아 붓습니다
  lexicon: HALOT
  rationale: 동사 '붓다/쏟다'의 생생한 이미지를 살려, 말이 넘쳐 흐르는 모습을 한국어로 자연스럽게 재현합니다.
theological_decisions:
- issue: 문장 후반의 의미가 진지한 진술인지 반어인지
  chosen_reading: 본문은 '어리석은 자들의 선함'이 지혜를 쏟아 낸다고 직역하되, 반어 가능성은 본문 의미의 여백으로 남깁니다.
  alternative_readings:
  - 어리석은 자들이 지혜를 마구 퍼뜨린다는 반어적 의미
  - 어리석은 자들의 선물이 지혜가 된다는 뜻
  rationale: 히브리어와 평행 전승의 차이로 인해 해석이 단정적이지 않으므로, 단일 해석으로 좁히지 않고 원문의 긴장을 보존합니다.
  doctrine_reference: 본문 해석의 불확정성 유지
