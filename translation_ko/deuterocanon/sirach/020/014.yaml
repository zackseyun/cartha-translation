lexical_decisions:
- source_word: ὀλίγα
  english_pob_choice: little
  chosen_korean: 조금
  alternatives_korean:
  - 적게
  - 얼마 안 되게
  lexicon: LSJ
  rationale: 중성 복수의 부사적 용법으로 ‘적은 양으로’라는 뜻이므로, 한국어에서는 자연스러운 부사 표현인 ‘조금’이 가장 적절합니다.
- source_word: δώσει
