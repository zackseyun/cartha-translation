- source_word: πολλὰ ὀνειδίσει
  english_pob_choice: heaps on many reproaches
  chosen_korean: 많은 꾸짖음을 쏟아내며
  alternatives_korean:
  - 많이 꾸짖으며
  - 많은 책망을 퍼부으며
