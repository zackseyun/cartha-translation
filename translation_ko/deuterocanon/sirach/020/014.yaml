  lexicon: LSJ
  rationale: ὀνειδίζω는 단순한 책망보다 ‘꾸짖음/모욕/조롱’의 뉘앙스가 있어, 반복적이고 거센 공격성을 살리는 ‘쏟아내다’로 처리했습니다.
- source_word: ὡς κῆρυξ
  english_pob_choice: like a herald
  chosen_korean: 전령처럼
  alternatives_korean:
  - 나팔수처럼
  - 선포자처럼
  - 헤럴드처럼
  lexicon: LSJ
  rationale: κῆρυξ는 공개적으로 알리는 전령/선포자를 가리키므로, 한국어에서 공적이고 격식 있는 이미지를 주는 ‘전령’이 적합합니다.
theological_decisions:
- issue: 잠언적 일반 진술의 시제 처리
