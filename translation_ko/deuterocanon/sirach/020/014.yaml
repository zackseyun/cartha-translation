  - 그는 떠벌립니다
  rationale: 본문은 단순한 발화가 아니라 선포자의 이미지로 말을 시작하는 모습을 강조하므로, 직유를 살려 원문의 표현력을 보존했습니다.
  doctrine_reference: 수사적 직유
