  text: There is one who buys much for little[b][a], and repays it sevenfold.
  footnotes:
  - marker: a
    text: 'Greek ''them'' could also be rendered more literally: ''and repaying them sevenfold.'' The pronoun is plural in form, though English may treat the purchased goods or their value collectively.'
    reason: lexical_alternative
  - marker: b
    text: 'The Greek source is concise and somewhat compressed: the sense may be either that someone buys many things cheaply and later pays back seven times as much, or more generally that an apparent bargain proves very costly.'
    reason: alternative_reading
translation:
  language: ko
  text: 적은 값에 많은 것을 사고, 그것들을 일곱 배로 갚는 사람이 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 헬라어의 ‘그것들을’은 복수형입니다. 이는 산 물건들을 가리킬 수도 있고 그 물건들의 값이나 대가를 가리킬 수도 있습니다. 따라서 적은 값에 많은 것을 산 뒤 그것들을 일곱 배로 갚는다는 뜻일 수도 있으며, 더 일반적으로는 겉보기의 좋은 거래가 매우 큰 대가를 치르게 한다는 뜻일 수도 있습니다.
    reason: lexical_alternative
