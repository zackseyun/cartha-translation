  text: A wise man will advance himself by his words[a], and a prudent man will please great men.
  footnotes:
  - marker: a
    text: Or 'the great,' 'nobles,' or 'rulers' for 'great men.' The Greek refers broadly to socially prominent or powerful people.
    reason: lexical_alternative
translation:
  language: ko
  text: 지혜로운 사람은 그의 말로 자신을 앞서 나가게 하고, 사려 깊은 사람은 큰 사람들에게 호감을 얻습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘유력자들’, ‘귀인들’, ‘권세 있는 이들’로 옮길 수 있습니다. 그리스어는 사회적으로 두드러지거나 권세 있는 사람들을 넓게 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: σοφὸς
  english_pob_choice: wise
  chosen_korean: 지혜로운 사람
  alternatives_korean:
  - 현명한 사람
  - 지혜 있는 사람
  lexicon: BDAG
  rationale: 지혜 문맥에서 σοφός는 단순한 학식보다 실천적 지혜를 뜻하므로, 자연스럽고 넓게 통하는 ‘지혜로운 사람’으로 옮겼습니다.
- source_word: ἐν λόγοις
  english_pob_choice: by his words
  chosen_korean: 그의 말로
  alternatives_korean:
  - 말로
  - 그의 말로써
  - 말을 통해
  lexicon: BDAG
  rationale: 전치사 ἐν의 수단적 의미를 살려, 말이 자기 진보의 매개임을 자연스럽게 드러내는 표현으로 옮겼습니다.
- source_word: προάξει ἑαυτόν
  english_pob_choice: will advance himself
  chosen_korean: 자신을 앞서 나가게 하고
  alternatives_korean:
  - 자신을 진전시키고
  - 자신을 높이고
  - 자기 자신을 앞서가게 하고
  lexicon: BDAG
  rationale: προάγω와 재귀대명사 ἑαυτόν은 자기 자신을 앞쪽으로 나아가게 하는 뜻이므로, ‘앞서 나가게 하다’로 옮겨 자기 진전의 뉘앙스를 살렸습니다.
- source_word: φρόνιμος
  english_pob_choice: prudent
  chosen_korean: 사려 깊은
  alternatives_korean:
  - 신중한
  - 분별 있는
  - 현명한
  lexicon: BDAG
  rationale: φρόνιμος는 지적 능력보다 판단의 신중함과 실천적 분별을 강조하므로, 문맥에 맞게 ‘사려 깊은’으로 번역했습니다.
- source_word: μεγιστᾶσιν
  english_pob_choice: great men
  chosen_korean: 큰 사람들
  alternatives_korean:
  - 유력자들
  - 귀인들
  - 권세 있는 이들
  lexicon: LSJ
  rationale: 그리스어는 사회적으로 두드러지거나 권세 있는 사람들을 넓게 가리키므로, 영어 주해의 폭을 반영해 직역보다 덜 특정적인 ‘큰 사람들’로 옮겼습니다.
