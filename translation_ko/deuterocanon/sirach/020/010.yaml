  yaml_path: translation/deuterocanon/sirach/020/010.yaml
  text: There is a humiliation for the sake of glory, and there is one who from humiliation has lifted up his head.
  footnotes:
  - marker: a
    text: Or 'There is a lessening for the sake of glory.' The Greek noun can denote reduction, abasement, or humiliation; the sense is that some are brought low in a way that leads to honor.
    reason: lexical_alternative
  - marker: b
    text: '''Has lifted up his head'' is an idiom for rising from a low condition to dignity or confidence.'
    reason: cultural_note
translation:
  language: ko
  text: 영광을 위한 낮아짐[a]이 있고, 낮은 처지에서 머리를 든[b] 사람도 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘낮아짐’은 이 헬라어 명사가 가리킬 수 있는 ‘감소’, ‘비하’, ‘굴욕’의 의미 범위를 함께 살린 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘머리를 들다’는 낮은 처지에서 존귀나 자신감을 회복하는 것을 나타내는 관용적 표현입니다.
    reason: cultural_note
lexical_decisions:
- source_word: ἐλάττωσις
  english_pob_choice: humiliation
  chosen_korean: 낮아짐
  alternatives_korean:
  - 굴욕
  - 비천해짐
  - 감소
  lexicon: LSJ
  rationale: 이 명사는 상태가 낮아지거나 줄어드는 뜻을 가지므로, 문맥의 역설을 살리면서도 ‘굴욕’보다 덜 해석적인 ‘낮아짐’이 자연스럽습니다.
- source_word: ἕνεκεν δόξης
  english_pob_choice: for the sake of glory
  chosen_korean: 영광을 위한
  alternatives_korean:
  - 영광 때문에의
  - 영광을 위하여의
  - 영광을 위해
  lexicon: BDAG / LSJ
  rationale: ‘~를 위한’은 목적·관련성을 살리며, 지혜문학의 ‘영광’과 ‘낮아짐’의 대비를 간결하게 드러냅니다.
- source_word: ἦρεν κεφαλήν
  english_pob_choice: has lifted up his head
  chosen_korean: 머리를 들어 올리는
  alternatives_korean:
  - 머리를 들다
  - 머리를 높이다
  - 고개를 치켜들다
  lexicon: LSJ
  rationale: 성경적 관용구로서 회복·고양의 이미지를 유지하되, 한국어에서는 현재형 서술이 잠언적 진술에 더 자연스럽습니다.
- source_word: ἔστιν ὃς
  english_pob_choice: there is one who
  chosen_korean: 사람도 있습니다
  alternatives_korean:
  - 한 사람이 있습니다
  - 어떤 이도 있습니다
  - 그런 이도 있습니다
  lexicon: Greek grammar
  rationale: 격언체의 ‘~하는 이가 있다’는 구조를 한국어에서 매끄럽게 옮기기 위해 일반화된 표현을 사용했습니다.
