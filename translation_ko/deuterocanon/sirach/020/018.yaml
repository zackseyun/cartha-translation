  yaml_path: translation/deuterocanon/sirach/020/018.yaml
  text: A slip is better from the ground than from the tongue[a]; so the downfall of the wicked will come in haste.
  footnotes:
  - marker: a
    text: Or 'the fall of evils will come quickly'; the Greek κακῶν can be read abstractly ('evils') or personally ('the wicked').
    reason: alternative_reading
translation:
  language: ko
  text: 발에서 미끄러지는 것은 혀에서 미끄러지는 것보다 낫습니다[a]. 그러므로 악한 자들의 몰락은 서둘러 찾아올 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘악들의 몰락은 빨리 찾아올 것이다’; 헬라어 κακῶν은 추상적으로 ‘악들’로도, 인격적으로 ‘악한 자들’로도 읽을 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: Ὀλίσθημα
  english_pob_choice: a slip
  chosen_korean: 미끄러지는 것
  alternatives_korean:
  - 한 번의 미끄러짐
  - 실족
  - 발을 헛디딤
  lexicon: LSJ
  rationale: 속담의 대비를 살리기 위해 물리적 ‘미끄러짐’을 자연스럽게 풀어 옮겼습니다. ‘실족’은 도덕적 뉘앙스를 더할 수 있어 피했습니다.
- source_word: ἀπὸ ἐδάφους
  english_pob_choice: from the ground
  chosen_korean: 발에서
  alternatives_korean:
  - 땅에서
  - 바닥에서
  - 지면에서
  lexicon: LSJ
  rationale: 문맥상 발밑의 지면에서 생기는 미끄러짐을 가리키므로 한국어에서는 더 자연스러운 ‘발에서’로 옮겼습니다.
- source_word: γλώσσης
  english_pob_choice: the tongue
  chosen_korean: 혀
  alternatives_korean:
  - 말
  - 입
  - 언어
  lexicon: LSJ
  rationale: 지혜문학에서 ‘혀’는 말의 기관이라는 구체적 은유를 보존합니다. ‘말’로 풀면 대비 이미지가 약해집니다.
- source_word: κακῶν
  english_pob_choice: the wicked
  chosen_korean: 악한 자들
  alternatives_korean:
  - 악들
  - 악인들
  - 악한 사람들
  lexicon: LSJ
  rationale: 영어 POB가 이 격을 인격적으로 읽은 전례를 따라, 문맥상 ‘악들’보다 사람을 가리키는 ‘악한 자들’로 번역했습니다.
theological_decisions:
- issue: κακῶν의 의미를 추상적 ‘악들’로 볼지, 인격적 ‘악한 자들’로 볼지
  chosen_reading: '인격적 읽기: ‘악한 자들’'
  alternative_readings:
  - '추상적 읽기: ‘악들’'
  - ‘악한 사람들’
  rationale: 이 속담은 혀의 해악과 악인의 급작스러운 몰락을 병치하므로, 후반절은 사람을 가리키는 것으로 읽는 편이 전체 의미가 더 분명합니다. 다만 형태상 추상적 가능성도 있어 영어 주해 전례를 반영해 본문에 너무 단정적으로 다루지 않았습니다.
  doctrine_reference: 잠언형 지혜문학의 평행법과 의미 범위
- issue: κατὰ σπουδήν의 속도감을 한국어로 어떻게 살릴지
  chosen_reading: ‘서둘러’
  alternative_readings:
  - ‘빨리’
  - ‘급히’
  - ‘재빨리’
  rationale: σπουδή의 긴급성과 신속성을 함께 담기 위해 ‘서둘러’가 가장 균형 있습니다. 단순 속도보다 ‘급박하게 다가옴’의 뉘앙스를 유지합니다.
  doctrine_reference: 지혜문학의 경구적 긴박성
