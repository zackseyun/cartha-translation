  - severity: medium
    issue: 두 ἀπό 구문의 대칭이 한국어에서 불균형함
    rationale: 원문은 ‘땅에서’와 ‘혀에서’를 병렬하여 육체적 미끄러짐과 말의 미끄러짐을 대비합니다. ‘땅에서의 미끄러짐/혀에서의 미끄러짐’으로 대칭을 살리는 것이 안전합니다.
  - severity: low
    issue: ‘몰락은 서둘러 찾아올 것입니다’의 결합이 다소 부자연스러움
    rationale: ‘서두르다’는 보통 행위자의 의지적 행동을 나타내므로, 사건인 ‘몰락’에는 ‘재빨리 닥치다’가 더 자연스럽고 κατὰ σπουδήν의 신속함도 전달합니다.
