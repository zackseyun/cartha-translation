revisions:
- from: 발에서 미끄러지는 것은 혀에서 미끄러지는 것보다 낫습니다[a]. 그러므로 악한 자들의 몰락은 서둘러 찾아올 것입니다.
  to: 땅에서의 미끄러짐이 혀에서의 미끄러짐보다 낫습니다[a]. 이와 같이 악한 자들의 몰락도 재빨리 닥칠 것입니다.
  rationale: 원문의 ἀπὸ ἐδάφους와 ἀπὸ γλώσσης가 이루는 대칭 및 ‘혀’의 은유를 보존하면서, 한국어에서 어색한 ‘발에서 미끄러지는 것’을 바로잡았습니다. 후반절은 κακῶν의 인격적 독법을 본문에 유지하되, 원문 형태가 허용하는 추상적 독법을 각주에 명시했습니다. οὕτως는 ‘이와 같이’로, κατὰ σπουδήν은 ‘재빨리’로 자연스럽게 옮겼습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T19:15:13Z'
