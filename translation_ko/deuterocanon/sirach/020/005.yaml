base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/020/005.yaml
  text: There is one who keeps silent and is considered wise[a], and there is one who is despised because of much talk.
  footnotes:
  - marker: a
    text: 'Greek: ''There is one who keeps silent because he has no answer, and there is one who keeps silent, knowing the right time.'' The Hebrew witness preserved here differs substantially; the main text follows the extant Hebrew as the primary source for Sirach where available.'
    reason: alternative_reading
translation:
  language: ko
  text: 침묵하는 자가 있어서 지혜롭게 여겨지고, 말이 많아서 미움을 받는 자가 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 ‘침묵하는 자’를 두 부류로 나누어, 한 사람은 지혜롭게 여겨지고 다른 한 사람은 말이 많은 탓에 미움을 받는다고 말합니다. 그리스어 병행본문은 “대답이 없어서 침묵하는 자”와 “때를 아는 자”를 말하므로, 본문 전승 간 차이가 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יֵשׁ
  english_pob_choice: There is one who
  chosen_korean: …하는 자가 있어서
  alternatives_korean:
  - …하는 이가 있습니다
  - …하는 사람이 있습니다
  lexicon: HALOT
  rationale: 히브리어 존재구문 יֵשׁ는 잠언형 진술에서 어떤 유형의 사람을 소개하므로, 한국어에서는 자연스럽게 ‘…하는 자가 있어서’로 풀어 인물 유형을 제시했습니다.
- source_word: מַחֲרִישׁ
  english_pob_choice: keeps silent
  chosen_korean: 침묵하는
  alternatives_korean:
  - 말을 아끼는
  - 잠잠한
  lexicon: HALOT
  rationale: חרש의 분사형은 지속적인 침묵 상태를 가리키므로, ‘침묵하는’이 가장 직접적으로 본문 대조를 살립니다.
- source_word: וְנֶחְשָׁב חָכָם
  english_pob_choice: is considered wise
  chosen_korean: 지혜롭게 여겨지고
  alternatives_korean:
  - 지혜로운 사람으로 여겨지고
  - 지혜롭다고 생각되고
  lexicon: HALOT
  rationale: נחשב는 ‘간주되다/여겨지다’의 수동적 평가를 나타내므로, ‘지혜롭게 여겨지고’로 옮겨 외부의 판단이라는 뉘앙스를 유지했습니다.
- source_word: נִמְאָס בְּרוֹב שִׂיחַ
  english_pob_choice: is despised because of much talk
  chosen_korean: 말이 많아서 미움을 받는 자가 있습니다
  alternatives_korean:
  - 많은 말 때문에 멸시를 받는 자가 있습니다
  - 말을 지나치게 많이 해서 업신여김을 받는 자가 있습니다
  lexicon: HALOT
  rationale: מאס는 단순한 ‘거절’보다 사회적 경멸/혐오의 반응을 포함하므로 ‘미움을 받다’로 옮겼습니다. בְּרוֹב는 원인·이유를 나타내 ‘말이 많아서’로 자연스럽게 풀고, שִׂיחַ는 이 잠언의 대조에 맞게 ‘말’로 옮겼습니다.
