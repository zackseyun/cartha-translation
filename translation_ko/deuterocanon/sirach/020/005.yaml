  source_fidelity: 히브리어는 두 인물 유형을 병렬로 제시합니다. 첫째는 침묵하며 지혜로운 사람으로 여겨지는 이이고, 둘째는 말이 많은 까닭에 멸시를 받는 이입니다. 초안의 본문 뜻은 대체로 맞지만, 주석이 히브리어 본문이 ‘침묵하는 자’를 두 부류로 나눈다고 설명한 것은 본문과 맞지 않습니다.
