  text: Like a eunuch’s desire to deflower a young woman, so is one who executes judgments by force.
  footnotes:
  - marker: a
    text: Or 'with violence.' The Greek phrase ἐν βίᾳ can emphasize coercion or violent action.
    reason: lexical_alternative
  - marker: b
    text: The proverb's image may stress either the wrongness of coercive judgment or its frustrated incongruity and futility.
    reason: alternative_reading
translation:
  language: ko
  text: 환관의 젊은 여자 처녀성 파괴하려는 욕망과 같으니, 강제로 판결을 집행하는 자도 그러합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘폭력으로’. 그리스어 ἐν βίᾳ는 강압이나 폭력적 행위를 모두 강조할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 이 속담은 강압적 판결의 부당함을 강조할 수도 있고, 그 부조리하고 좌절된 성격을 강조할 수도 있습니다.
    reason: alternative_reading
