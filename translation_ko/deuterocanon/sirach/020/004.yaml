  text: There is one who keeps silent and is found wise[a], and there is one who is hated because of much talk.
  footnotes:
  - marker: a
    text: Or 'because of excessive talking.' The Greek phrase literally reads 'from much talk,' with ἀπό expressing cause.
    reason: lexical_alternative
translation:
  language: ko
  text: 침묵을 지키는 이가 지혜로운 사람으로 드러나고, 많은 말 때문에 미움을 받는 이도 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 헬라어 ἀπό는 여기서 원인이나 이유를 나타내므로, “많은 말에서”보다는 “많은 말 때문에”로 옮기는 것이 자연스럽습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔστιν σιωπῶν εὑρισκόμενος σοφός
  english_pob_choice: There is one who keeps silent and is found wise
  chosen_korean: 침묵을 지키는 이가 지혜로운 사람으로 드러나고
  alternatives_korean:
  - 잠잠히 있는 이가 지혜로운 사람으로 여겨지고
  - 말을 아끼는 이가 지혜롭게 드러나고
  lexicon: LSJ; BDAG
  rationale: ἔστιν… εὑρισκόμενος는 단순 존재 진술이면서 관찰 결과를 말하므로, 한국어에서는 ‘드러나고’로 옮겨 잠잠함이 지혜로 판명되는 뉘앙스를 살렸습니다.
- source_word: σιωπῶν
  english_pob_choice: keeps silent
  chosen_korean: 침묵을 지키는
  alternatives_korean:
  - 잠잠한
  - 말을 아끼는
  lexicon: BDAG
  rationale: 현재분사로서 지속적이고 의식적인 침묵을 가리키므로, 단순 상태보다 행위성을 살린 ‘침묵을 지키는’이 적절합니다.
- source_word: μισητὸς ἀπὸ πολλῆς λαλιᾶς
  english_pob_choice: is hated because of much talk
  chosen_korean: 많은 말 때문에 미움을 받는 이도 있습니다
  alternatives_korean:
  - 말이 많기 때문에 미움을 받는 이도 있습니다
  - 과한 말 때문에 미움을 받는 이도 있습니다
  lexicon: LSJ
  rationale: ἀπό는 원인 의미를 가지므로 ‘때문에’로 옮겼고, λαλιά는 ‘말/수다’보다 넓은 ‘많은 말’로 처리해 잠언적 대비를 간결하게 유지했습니다.
theological_decisions:
- issue: 지혜와 말의 절제의 대비를 어떻게 살릴지
  chosen_reading: 침묵은 지혜로 판명될 수 있고, 말이 많음은 미움을 부를 수 있다는 경구로 읽었습니다.
  alternative_readings:
  - 침묵 자체가 지혜라는 단정
  - 말 많은 사람에 대한 단순 성격 묘사
  rationale: 본문은 두 부류를 대조하는 지혜문학적 격언이므로, 규범적 단정으로 과장하지 않으면서도 교훈적 대비를 분명히 드러냈습니다.
  doctrine_reference: 전도문학/지혜문학의 경구적 표현
