base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/020/006.yaml
  text: There is one who keeps silent because there is no answer[b][a], and there is one who keeps silent because he sees the right time.
  footnotes:
  - marker: a
    text: 'Greek parallel: ''A wise man will keep silent until the right time, but a babbler and a fool will go beyond the right time.'' The Hebrew and Greek forms of this proverb differ notably; the main text follows the extant Hebrew witness, with the Greek informing the timing nuance in ''the right time.'''
    reason: textual_variant
  - marker: b
    text: Or 'for lack of a reply' / 'because he has no answer.'
    reason: lexical_alternative
translation:
  language: ko
  text: 말할 거리가 없어서 잠잠한 사람이 있고, 적절한 때를 알아서 잠잠한 사람도 있습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '칠십인역 병행: ‘지혜로운 사람은 적절한 때까지 잠잠하고, 수다쟁이와 어리석은 사람은 때를 지나쳐 버립니다.’ 히브리어와 그리스어가 이 속담을 다르게 전하므로, 본문은 현존 히브리어를 따르되 ‘적절한 때’의 시기 의미는 그리스어 병행에서 보완했습니다.'
    reason: textual_variant
  - marker: b
    text: 또는 ‘대답이 없어서’ / ‘응답할 말이 없어서’.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַחֲרִישׁ
  english_pob_choice: keeps silent
  chosen_korean: 잠잠한 사람
  alternatives_korean:
  - 침묵하는 사람
  - 말을 아끼는 사람
  lexicon: HALOT
  rationale: 히브리어 분사형의 지속적·잠정적 뉘앙스를 살려, 단순 상태 설명보다 잠잠하게 말하지 않는 사람을 자연스럽게 옮겼습니다.
- source_word: מֵאֵין מַעֲנֶה
  english_pob_choice: because there is no answer
  chosen_korean: 말할 거리가 없어서
  alternatives_korean:
  - 대답이 없어서
  - 응답할 말이 없어서
  lexicon: HALOT
  rationale: 직역하면 ‘대답이 없음/답이 없음’이지만, 한국어 속담적 문맥에서는 ‘말할 거리가 없어서’가 원문이 말하는 무응답의 이유를 자연스럽게 드러냅니다.
- source_word: עֵת
  english_pob_choice: the right time
  chosen_korean: 적절한 때
  alternatives_korean:
  - 알맞은 때
  - 때
  - 좋은 때
  lexicon: HALOT
  rationale: 지혜문학에서의 עֵת은 단순한 시간보다 마땅한 시점을 가리키므로, ‘적절한 때’로 옮겨 시기 판단의 의미를 살렸습니다.
- source_word: רֹאֶה עֵת
  english_pob_choice: sees the right time
  chosen_korean: 적절한 때를 알아서
  alternatives_korean:
  - 적절한 때를 분별해서
  - 때를 알아서
  - 알맞은 시기를 보아서
  lexicon: HALOT
  rationale: 히브리어의 ‘시간을 보다’는 관용적 표현이므로, 한국어에서는 그 감각을 살려 시기를 알아차리고 판단하는 뜻의 ‘알아서’로 옮겼습니다.
theological_decisions:
- issue: 사본 차이로 인한 의미 방향
  chosen_reading: 본문은 히브리어 사본의 두 경우를 따르되, 두 번째는 ‘적절한 때를 알아서 잠잠한 사람’으로 옮겨 지혜의 시기 판단을 드러냈습니다.
  alternative_readings:
  - 칠십인역처럼 ‘지혜로운 사람은 적절한 때까지 잠잠한다’는 방향으로 옮길 수 있습니다.
  - 히브리어를 더 직역해 ‘적절한 때를 보는 사람이 있다’고 할 수도 있습니다.
  rationale: 히브리어 본문이 주요 본문이지만, 병행 헬라어가 시기의 지혜를 분명히 하므로 그 함의를 한국어에 자연스럽게 반영했습니다.
  doctrine_reference: 본문비평 / 지혜문학 해석
- issue: ‘잠잠하다’의 반복
  chosen_reading: 두 절 모두 ‘잠잠하다’를 유지해 병렬 구조와 속담적 리듬을 살렸습니다.
  alternative_readings:
  - 첫 절은 ‘침묵하다’, 둘째 절은 ‘말을 아끼다’로 다양화할 수 있습니다.
  rationale: 원문의 대구를 보존하는 것이 이 속담의 의미 전달에 중요하므로, 동일 동사를 반복해 대비를 분명히 했습니다.
  doctrine_reference: 수사학적 평행법
