  - 친절
  lexicon: LSJ
  rationale: 세속적·사회적 맥락에서 χάριν은 신학적 ‘은혜’보다 친구에게 베푸는 ‘호의’가 맞습니다.
- source_word: αἰσχύνης
  english_pob_choice: out of shame
  chosen_korean: 부끄러움 때문에
  alternatives_korean:
