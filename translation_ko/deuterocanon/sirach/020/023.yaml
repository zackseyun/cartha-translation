  text: There is one who promises a favor out of shame to a friend[a], and so acquires him as an enemy for nothing.
  footnotes:
  - marker: a
    text: Or 'without cause' for 'for nothing'; the Greek adverb can express either pointlessness or lack of just cause.
    reason: lexical_alternative
translation:
  language: ko
  text: 누군가는 친구에게 부끄러움 때문에 호의를 약속하고, 그리하여 아무 까닭 없이 그를 원수로 삼습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘까닭 없이’로도 옮길 수 있습니다. 그리스어 부사는 ‘헛되이’와 ‘정당한 이유 없이’ 둘 다를 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: χάριν
  english_pob_choice: a favor
  chosen_korean: 호의
  alternatives_korean:
  - 은혜
  - 친절
  lexicon: LSJ
  rationale: 세속적·사회적 맥락에서 χάριν은 신학적 ‘은혜’보다 친구에게 베푸는 ‘호의’가 맞습니다.
- source_word: αἰσχύνης
  english_pob_choice: out of shame
  chosen_korean: 부끄러움 때문에
  alternatives_korean:
  - 수치 때문에
  - 부끄러워서
  lexicon: LSJ
  rationale: 원문의 속격은 동기의 원인을 나타내므로, 체면이나 수치심에 떠밀린 행동임을 자연스럽게 드러냈습니다.
- source_word: ἐκτήσατο
  english_pob_choice: has acquired
  chosen_korean: 삼습니다
  alternatives_korean:
  - 얻습니다
  - 획득합니다
  lexicon: LSJ
  rationale: ‘얻다’보다 관계적 역설이 살아나는 ‘삼다’를 택해, 호의를 약속했는데도 결과가 적대 관계가 되는 아이러니를 살렸습니다.
- source_word: δωρεάν
  english_pob_choice: for nothing
  chosen_korean: 아무 까닭 없이
  alternatives_korean:
  - 헛되이
  - 공짜로
  lexicon: LSJ
  rationale: δώρεάν은 ‘공짜로’보다 ‘이유 없이/헛되이’의 뜻이 더 적절하므로, 결과의 무의미함과 부당함을 함께 담았습니다.
theological_decisions:
- issue: 관계적 역설의 보존
  chosen_reading: 친구에게 호의를 약속했지만 결과적으로 원수 관계를 얻게 되는 역설을 그대로 살렸습니다.
  alternative_readings:
  - 친구에게 친절을 베풀려다가 원수가 됩니다
  - 친구를 도우려다 적을 만듭니다
  rationale: 잠언식 지혜 문장으로서 원문의 냉소적·역설적 결론을 약화시키지 않도록, 결과 진술을 직접적으로 유지했습니다.
  doctrine_reference: 지혜문학의 교훈적 경구
- issue: δωρεάν의 의미 범위
  chosen_reading: ‘아무 까닭 없이’로 옮겨 무의미함과 무정당성을 함께 나타냈습니다.
  alternative_readings:
  - ‘헛되이’
  - ‘공짜로’
  rationale: 본문의 핵심은 값어치 없는 결과이면서 동시에 정당한 이유가 없다는 점이므로, 두 의미를 포괄하는 표현을 선택했습니다.
  doctrine_reference: 어휘 의미역 분화
