  source_fidelity: 첫 절은 αἰσχύνης χάριν(부끄러움/수치심 때문에)과 φίλῳ(친구에게)를 충실히 반영합니다. 그러나 ἐκτήσατο αὐτὸν ἐχθρόν은 그 친구를 적대자로 ‘얻게 된’ 결과를 말하므로, 현행 ‘그를 원수로 삼습니다’는 화자가 그를 원수로 간주하거나 선택한다는 뜻으로도 읽힐 수 있습니다. 또한 δωρεάν의 ‘헛되이/까닭 없이’라는 열려 있는 의미 범위를 본문과 주석에서 더 정확히 구분할 필요가 있습니다.
