  text: There is one who promises a favor out of shame to a friend[a], and so acquires him as an enemy for nothing.
  footnotes:
  - marker: a
    text: Or 'without cause' for 'for nothing'; the Greek adverb can express either pointlessness or lack of just cause.
    reason: lexical_alternative
translation:
  language: ko
  text: 부끄러워서 친구에게 호의를 약속하고서는, 헛되이 그를 원수로 만든 사람이 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘아무 까닭 없이’. 그리스어 부사는 ‘헛되이, 아무 소득 없이’ 또는 ‘정당한 이유 없이’라는 뜻으로 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: χάριν
  english_pob_choice: a favor
  chosen_korean: 호의
  alternatives_korean:
