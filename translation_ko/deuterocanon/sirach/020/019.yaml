  text: An ungracious person is an untimely saying[a]; in the mouth of the undisciplined it will be repeated continually.
  footnotes:
  - marker: a
    text: Or 'An unpleasant person is an ill-timed tale'; both halves are terse and somewhat elliptical in Greek, so several closely related renderings are possible.
    reason: lexical_alternative
translation:
  language: ko
  text: 무례한 사람은 시기적절하지 않은 말과 같으며, 훈련받지 못한 자의 입에서는 그것이 끊임없이 되풀이됩니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘무례한 사람은 시기적절하지 않은 말’이 될 수 있습니다. 그리스어는 두 절이 모두 매우 압축되어 있어, ‘사람’과 ‘말/이야기’의 대응을 약간 다르게 잡는 번역도 가능합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἄνθρωπος ἄχαρις
  english_pob_choice: An ungracious person
  chosen_korean: 무례한 사람
  alternatives_korean:
  - 은혜가 없는 사람
  - 비호의적인 사람
  - 감사할 줄 모르는 사람
  lexicon: LSJ
  rationale: ἄχαρις는 은혜 없음, 호감 없음, 감사하지 않음을 아우르므로, 한국어에서는 인격적·사회적 부조화를 드러내는 ‘무례한 사람’이 가장 자연스럽습니다.
- source_word: μῦθος
  english_pob_choice: saying
  chosen_korean: 말
  alternatives_korean:
  - 이야기
  - 이야깃거리
  - 담화
  - 속담
  lexicon: LSJ
  rationale: 여기서는 긴 서사보다 짧은 발언을 가리키므로, 시적 압축을 살리면서도 의미를 넓게 유지하는 ‘말’이 적절합니다.
- source_word: ἄκαιρος
  english_pob_choice: untimely
  chosen_korean: 시기적절하지 않은
  alternatives_korean:
  - 때에 맞지 않은
  - 부적절한
  - 때를 놓친
  lexicon: LSJ
  rationale: 핵심은 ‘때가 맞지 않음’이므로, 현대 한국어에서 가장 직접적이고 공손한 표현인 ‘시기적절하지 않은’으로 옮겼습니다.
- source_word: ἀπαιδεύτων
  english_pob_choice: undisciplined
  chosen_korean: 훈련받지 못한 자
  alternatives_korean:
  - 무절제한 사람
  - 교육받지 못한 자
  - 훈육되지 않은 자
  lexicon: LSJ
  rationale: 단순한 지적 무지가 아니라 형성·훈련의 부재를 가리키므로, POB의 ‘undisciplined’를 따라 도덕적·사회적 훈련의 결핍을 드러냈습니다.
- source_word: ἐνδελεχισθήσεται
  english_pob_choice: will be repeated continually
  chosen_korean: 끊임없이 되풀이됩니다
  alternatives_korean:
  - 계속 이어집니다
  - 끊임없이 계속됩니다
  - 반복됩니다
  lexicon: LSJ
  rationale: 동사의 지속·반복 뉘앙스를 한국어에서 자연스럽게 풀어, 그 말이 계속 입에 오르내린다는 뜻을 분명히 했습니다.
theological_decisions:
- issue: 격언의 두 절이 모두 압축된 비유로 제시되는 점
  chosen_reading: 첫 절은 사람의 성품을, 둘째 절은 그가 내뱉는 말의 반복성을 말하는 것으로 살렸습니다.
  alternative_readings:
  - 첫 절을 ‘무례한 사람은 때에 맞지 않는 말이다’로 더 직역하는 읽기
  - 둘째 절을 단순히 ‘입에 머문다’로 보는 읽기
  rationale: 그리스어는 두 절 모두 생략이 많은 잠언식 표현이므로, 한국어에서는 의미를 과도하게 확장하지 않으면서도 관계를 분명히 드러내는 것이 좋습니다.
  doctrine_reference: 지혜문학의 압축된 비유 해석 원칙
