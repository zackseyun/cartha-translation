  rationale: 동사의 지속·반복 뉘앙스를 한국어에서 자연스럽게 풀어, 그 말이 계속 입에 오르내린다는 뜻을 분명히 했습니다.
theological_decisions:
- issue: 격언의 두 절이 모두 압축된 비유로 제시되는 점
  chosen_reading: 첫 절은 사람의 성품을, 둘째 절은 그가 내뱉는 말의 반복성을 말하는 것으로 살렸습니다.
  alternative_readings:
  - 첫 절을 ‘무례한 사람은 때에 맞지 않는 말이다’로 더 직역하는 읽기
  - 둘째 절을 단순히 ‘입에 머문다’로 보는 읽기
  rationale: 그리스어는 두 절 모두 생략이 많은 잠언식 표현이므로, 한국어에서는 의미를 과도하게 확장하지 않으면서도 관계를 분명히 드러내는 것이 좋습니다.
  doctrine_reference: 지혜문학의 압축된 비유 해석 원칙
