  text: 상냥하지 못한 사람은 때에 맞지 않는 말과 같으며[a], 제대로 훈련받지 못한 사람들의 입에서는 그 말이 끊임없이 되풀이됩니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘상냥하지 못한 사람, 때에 맞지 않는 말’입니다. 그리스어의 두 절은 모두 매우 압축되어 있습니다. ‘상냥하지 못한’은 문맥에 따라 ‘호감 없는’, ‘무례한’, 또는 ‘감사할 줄 모르는’으로, ‘말’은 ‘이야기’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
