translation:
  language: ko
  text: 거짓말은 사람에게 수치스러운 흠이며[a], 훈련받지 못한 이들의 입에서는 늘 끊이지 않을 것입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘수치스러운 흠’은 μῶμος πονηρός의 부정적 평가를 드러내기 위한 옮김입니다. μῶμος는 문자적으로 ‘흠, 오점, 비난거리’를 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘훈련받지 못한 이들’은 ἀπαίδευτων이 단순한 무학보다 지혜와 도덕의 훈련이 결핍된 상태를 가리킬 수 있다는 점을 반영합니다.
    reason: lexical_alternative
