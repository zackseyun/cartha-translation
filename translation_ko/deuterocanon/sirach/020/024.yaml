  text: A lie is a shameful blemish in a person[b][a]; in the mouth of the undisciplined it will be continually present.
  footnotes:
  - marker: a
    text: Or 'A lie is an evil blemish in a person'; the Greek ἐν ἀνθρώπῳ is a generic singular, and μῶμος can also be rendered 'disgrace' or 'reproach.'
    reason: lexical_alternative
  - marker: b
    text: '''Undisciplined'' translates a term that can also mean ''uninstructed'' or ''uneducated,'' but here likely carries a moral-wisdom sense rather than merely lack of schooling.'
    reason: lexical_alternative
translation:
  language: ko
  text: 거짓말은 사람에게 수치스러운 흠이요, 훈련받지 못한 자의 입에서는 늘 이어집니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘수치스러운’은 μῶμος πονηρός의 부정적 평가를 드러내기 위한 옮김입니다. 문자적으로는 ‘흠, 오점, 비난거리’의 범주입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘훈련받지 못한 자’는 ἀπαιδεύτων이 단순한 무학보다 지혜와 도덕의 훈련이 결핍된 상태를 가리킬 수 있다는 점을 반영합니다.
    reason: lexical_alternative
