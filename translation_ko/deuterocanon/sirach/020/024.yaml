  source_fidelity: 핵심 어휘의 선택은 대체로 적절합니다. 그러나 ἐνδελεχισθήσεται는 미래의 지속을 나타내므로, 현재형 ‘늘 이어집니다’보다 ‘늘 끊이지 않을 것입니다’가 원문의 미래성과 지속성을 더 충실히 드러냅니다. 또한 ‘입에서는 늘 이어집니다’는 한국어에서 무엇이 이어지는지 다소 불분명합니다.
  naturalness: ‘거짓말은 사람에게 수치스러운 흠이요’는 격식은 있으나 다소 압축적이며, ‘훈련받지 못한 자의 입에서는 늘 이어집니다’는 서술어의 결합이 부자연스럽습니다. 접속 표현과 미래 지속 표현을 보완하면 현대 표준어 합쇼체로 더 자연스럽습니다.
  terminology: ‘수치스러운 흠’은 μῶμος πονηρός의 오점/비난거리 비유와 부정적 평가를 무리 없이 살립니다. ‘훈련받지 못한 이들’은 ἀπαίδευτος의 지혜·도덕적 미훈련이라는 문맥적 의미를 보존하며, 단순히 교육을 받지 못했다는 뜻으로 축소하지 않습니다.
