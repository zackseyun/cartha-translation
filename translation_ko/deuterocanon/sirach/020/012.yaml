  text: A wise man will make himself beloved by his words[a], but the favors of fools will be poured out.
  footnotes:
  - marker: a
    text: Or 'the graces/charms of fools will be poured out.' The Greek χάριτες can denote gracious acts, attractiveness, or charm; 'favors' was chosen as the clearest contextual rendering.
    reason: lexical_alternative
translation:
  language: ko
  text: 지혜로운 사람은 자기 말로 자신을 사랑받게 만들지만, 어리석은 자들의 호의는 쏟아져 나올 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘호의’는 여기서 χάριτες의 가능한 뜻 가운데 문맥상 가장 자연스러운 번역입니다. 이 단어는 ‘은혜들’, ‘매력들’, ‘친절한 행위들’ 등으로도 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: σοφὸς
  english_pob_choice: wise man
  chosen_korean: 지혜로운 사람
  alternatives_korean:
  - 지혜로운 남자
  - 지혜자
  - 지혜로운 이
  lexicon: LSJ
  rationale: 그리스어 형용사가 명사처럼 쓰였지만, 한국어에서는 성별을 과도하게 표지하기보다 대표적 인물 표현인 ‘사람’이 자연스럽고 문맥상 적절합니다.
- source_word: ἐν λόγῳ
  english_pob_choice: by his words
  chosen_korean: 자기 말로
  alternatives_korean:
  - 말로
  - 자기의 말로
  - 말함으로
  lexicon: LSJ
  rationale: 수단/영역의 의미를 한국어에서 가장 간결하게 드러내기 위해 ‘-로’의 수단 조사로 옮겼습니다.
- source_word: ἑαυτὸν προσφιλῆ ποιήσει
  english_pob_choice: will make himself beloved
  chosen_korean: 자신을 사랑받게 만들지만
  alternatives_korean:
  - 자신을 사랑스럽게 만들지만
  - 자신을 사랑받는 이가 되게 하지만
  - 자기 자신을 사랑받게 하지만
  lexicon: LSJ
  rationale: προσφιλῆ의 관계적 의미를 ‘사랑받게’로 옮겨, 단순한 ‘호감’보다 타인에게서 받는 애정의 결과를 살렸습니다.
- source_word: χάριτες
  english_pob_choice: favors
  chosen_korean: 호의
  alternatives_korean:
  - 은총
  - 은혜들
  - 호감들
  - 친절
  lexicon: LSJ
  rationale: 문맥상 추상적 ‘은혜’보다 실제적인 호의/호의적 행위가 자연스러워 ‘호의’로 옮겼습니다. 복수형 뉘앙스는 문맥으로 유지했습니다.
- source_word: ἐκχυθήσονται
  english_pob_choice: will be poured out
  chosen_korean: 쏟아져 나올 것입니다
  alternatives_korean:
  - 부어질 것입니다
  - 흘러나올 것입니다
  - 쏟아질 것입니다
  lexicon: LSJ
  rationale: ‘poured out’의 비유를 한국어에서 유동성과 과잉감을 함께 살리기 위해 ‘쏟아져 나올 것입니다’로 표현했습니다.
theological_decisions:
- issue: 지혜와 어리석음의 대조를 설교적으로 강화할지 여부
  chosen_reading: 본문의 대비를 유지하되, ‘호의’와 ‘쏟아져 나올 것입니다’라는 이미지 자체를 보존했습니다.
  alternative_readings:
  - 어리석은 자들의 미덕이 낭비될 것입니다
  - 어리석은 자들의 매력이 흘러넘칠 것입니다
  rationale: 그리스어 χάριτες의 의미 범위가 넓지만, 본문은 도덕적 평가를 설명적으로 풀기보다 이미지로 제시합니다. 따라서 해석을 과도하게 특정하지 않고 원문의 대비를 유지했습니다.
  doctrine_reference: 지혜문학의 수사적 대비
- issue: 성별 표지의 처리
  chosen_reading: σοφὸς는 성별을 일반화하지 않고 한국어 대표 표현 ‘사람’으로 옮겼습니다.
  alternative_readings:
  - 지혜로운 남자
  - 지혜자
  rationale: 그리스어 남성형 단수의 문법을 확인하되, 한국어에서 불필요한 성별 배타성을 피하면서도 단수 인물성을 유지하는 방식이 가장 균형적입니다.
  doctrine_reference: 문법적 성/현대 한국어 문체
