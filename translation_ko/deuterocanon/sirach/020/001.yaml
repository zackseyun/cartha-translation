  text: There is a rebuke that is not timely[a], and there is one who keeps silent and is himself wise.
  footnotes:
  - marker: a
    text: Or 'There is a reproof that is not appropriate / seasonable.' The Greek adjective can mean 'timely,' 'fitting,' or in other contexts 'beautiful'; here the sense is suitability of timing.
    reason: lexical_alternative
translation:
  language: ko
  text: 꾸짖음 중에는 때에 맞지 않은 것도 있고, 잠잠한 사람은 그 자신이 지혜롭습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘때에 맞지 않은 꾸짖음’으로 옮길 수 있습니다. 여기서 ὡραῖος는 ‘아름다운’보다 ‘시기적절한, 알맞은’의 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγχος
  english_pob_choice: rebuke
  chosen_korean: 꾸짖음
  alternatives_korean:
  - 책망
  - 질책
  - 권면
  lexicon: BDAG
  rationale: ἔλεγχος는 잘못을 드러내고 바로잡는 말로, 여기서는 잠잠함과 대조되는 경구적 표현이어서 ‘꾸짖음’이 자연스럽고 직접적입니다.
- source_word: ὡραῖος
  english_pob_choice: timely
  chosen_korean: 때에 맞지 않은
  alternatives_korean:
  - 시기적절하지 않은
  - 적절하지 않은
  - 때맞지 않은
  lexicon: LSJ
  rationale: 문맥상 ‘아름다운’보다 ‘때에 맞는/맞지 않는’ 의미가 핵심이므로, 꾸짖음의 적절한 시점을 가리키는 표현으로 옮겼습니다.
- source_word: σιωπῶν
  english_pob_choice: keeps silent
  chosen_korean: 잠잠한 사람
  alternatives_korean:
  - 침묵하는 사람
  - 말이 없는 사람
  - 침묵을 지키는 사람
  lexicon: BDAG
  rationale: 현재분사로 된 사람의 상태를 나타내므로, 단순 형용사보다 인물을 수식하는 ‘잠잠한 사람’이 경구의 리듬을 살립니다.
- source_word: φρόνιμος
  english_pob_choice: wise
  chosen_korean: 지혜롭습니다
  alternatives_korean:
  - 슬기롭습니다
  - 신중합니다
  - 분별 있습니다
  lexicon: BDAG
  rationale: φρόνιμος는 실천적 분별을 뜻하지만, 한국어에서는 여기서 ‘지혜롭다’가 가장 넓고 자연스러운 대응입니다.
theological_decisions:
- issue: 잠잠함과 지혜의 관계를 단정적 교리로 확장할지 여부
  chosen_reading: 본문의 격언적 관찰로 유지하고, 침묵 자체를 무조건 미덕으로 일반화하지 않았습니다.
  alternative_readings:
  - 침묵은 항상 지혜롭다는 규범적 진술
  - 적절한 말과 침묵의 분별에 대한 관찰
  rationale: 히브리 지혜문학의 간결한 대조를 살리되, 본문이 말하는 것은 특정 상황에서의 분별이지 절대적 침묵론이 아니므로 과잉 일반화를 피했습니다.
  doctrine_reference: 지혜문학의 경구적 일반화와 분별의 원리
