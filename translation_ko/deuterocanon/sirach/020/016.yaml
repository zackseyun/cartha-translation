  text: A fool will say[a], “I have no friend, and there is no gratitude for my good deeds.”
  footnotes:
  - marker: a
    text: Or 'there is no thanks for my benefactions.' The Greek χάρις can mean 'gratitude,' 'thanks,' or 'favor,' and τοῖς ἀγαθοῖς μου can mean 'my good things' or 'my good deeds.'
    reason: lexical_alternative
translation:
  language: ko
  text: 어리석은 사람은 이렇게 말합니다. 「나는 친구가 없고, 내 선행에 대해 감사하는 이도 없습니다.」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μωρός
  english_pob_choice: a fool
  chosen_korean: 어리석은 사람
  alternatives_korean:
  - 어리석은 자
  - 바보
  lexicon: LSJ
  rationale: 지혜문학의 일반적 인물을 자연스러운 현대 한국어로 옮기기 위해 직설적이되 비속하지 않은 표현을 택했습니다.
- source_word: ἐρεῖ
  english_pob_choice: will say
  chosen_korean: 말합니다
  alternatives_korean:
  - 말할 것입니다
  - 이렇게 말할 것입니다
  lexicon: LSJ
  rationale: 그리스어 미래형의 문형을 보존하되, 한국어 격언체에서는 현재형 서술이 더 자연스러워 의미와 가독성을 함께 살렸습니다.
- source_word: Οὐχ ὑπάρχει μοι φίλος
  english_pob_choice: I have no friend
  chosen_korean: 나는 친구가 없고
  alternatives_korean:
  - 내게 친구가 없고
  - 나에게는 친구가 없고
  lexicon: LSJ
  rationale: 소유·존재를 나타내는 관용을 한국어의 자연스러운 ‘-가 없다’로 옮겨, 자기연민 섞인 독백의 뉘앙스를 살렸습니다.
- source_word: χάρις
  english_pob_choice: gratitude
  chosen_korean: 감사하는 이도 없습니다
  alternatives_korean:
  - 감사도 없습니다
  - 고마움도 없습니다
  - 은혜도 없습니다
  lexicon: LSJ
  rationale: 여기서는 신학적 ‘은혜’가 아니라 보답과 감사의 사회적 의미이므로, POB의 ‘gratitude’에 맞춰 ‘감사하는 이’로 풀었습니다.
- source_word: τοῖς ἀγαθοῖς μου
  english_pob_choice: for my good deeds
  chosen_korean: 내 선행에 대해
  alternatives_korean:
  - 내 좋은 일들에 대해
  - 내 은혜로운 일들에 대해
  - 내가 한 좋은 일들에 대해
  lexicon: LSJ
  rationale: 복수 형용사의 실질적 의미를 ‘선행’으로 옮겨, 단순한 ‘좋은 것들’보다 행위적·도덕적 의미를 분명히 했습니다.
theological_decisions:
- issue: χάρις의 의미 범위
  chosen_reading: 본절에서는 χάρις를 ‘감사/고마움’의 의미로 번역하고, 신학적 ‘은혜’로 옮기지 않았습니다.
  alternative_readings:
  - 은혜
  - 호의
  rationale: 문맥이 하나님과의 구원론이 아니라 사람들 사이의 보답과 평가를 말하므로, 헬라어의 사회적·윤리적 뜻을 우선했습니다.
  doctrine_reference: 지혜문학의 인간관계 윤리
