  text: 자기 어리석음을 숨기는 사람은 자기 지혜를 숨기는 사람보다 더 낫습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 ἄνθρωπος는 성별을 특정하지 않는 일반명사로도 쓰일 수 있으나, 본문은 속담의 반복 구조를 살려 ‘사람’으로 옮겼습니다.
    reason: lexical_alternative
