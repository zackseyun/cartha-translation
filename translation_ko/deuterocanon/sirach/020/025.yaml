  lexicon: LSJ
  rationale: 분사와 여격의 결합이 반복적·지속적 행위를 나타내므로, 행위의 지속성을 자연스럽게 드러내는 ‘거짓말을 계속하는 자’로 옮겼습니다.
- source_word: ἀπώλειαν κληρονομήσουσιν
  english_pob_choice: will inherit destruction
  chosen_korean: 파멸을 상속받을 것입니다
