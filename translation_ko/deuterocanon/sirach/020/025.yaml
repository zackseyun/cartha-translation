theological_decisions:
- issue: 도덕적 비교의 강도
  chosen_reading: 본문은 도둑질을 승인하지 않으면서도, 지속적으로 거짓말하는 자보다 도둑이 더 낫다고 실제로 비교합니다.
  alternative_readings:
  - 과장된 지혜 격언으로서 ‘거짓말의 해악’을 강조하는 표현으로만 약화해 읽을 수 있습니다.
  rationale: 둘 다 결국 파멸을 상속받는다고 말함으로써, 비교는 유지하되 도둑질의 정당화는 차단합니다. 원문의 긴장을 보존하는 것이 필요합니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
