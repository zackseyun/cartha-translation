translation:
  language: ko
  text: 사람에게는 나쁜 일들 가운데서도 성공이 있고, 감소에 이르는 이득도 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 ‘나쁜 일들’은 도덕적으로 악한 일들을 뜻할 수도 있고, 불행이나 곤경을 뜻할 수도 있습니다. 이 짧은 경구의 표현은 어느 한쪽으로 단정되지 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐοδία
  english_pob_choice: success
  chosen_korean: 성공
  alternatives_korean:
  - 번영
  - 좋은 결과
  - 형통
  lexicon: LSJ
  rationale: εὐοδία는 좋은 진행과 번성의 결과를 가리키므로, 여기서는 현대 한국어에서 가장 자연스럽고 반어적 경구의 힘을 살리는 ‘성공’으로 옮겼습니다.
- source_word: ἐν κακοῖς
  english_pob_choice: in evil things
  chosen_korean: 악한 일들 가운데서
  alternatives_korean:
  - 악들 안에서
  - 악한 것들에서
  - 나쁜 상황 속에서
  lexicon: LSJ
  rationale: 문맥상 단순한 불운보다 도덕적으로 그른 행위를 가리키므로, ‘악한 일들 가운데서’로 옮겨 행위의 성격을 드러냈습니다.
- source_word: εὕρεμα
  english_pob_choice: gain
  chosen_korean: 이익
  alternatives_korean:
  - 획득물
  - 얻은 것
  - 득
  - 수익
  lexicon: LSJ
  rationale: εὕρεμα는 얻어진 것, 얻어낸 유익을 뜻할 수 있어, 앞의 ‘성공’과 대응되는 결과를 자연스럽게 보이도록 ‘이익’으로 옮겼습니다.
- source_word: εἰς ἐλάττωσιν
  english_pob_choice: that leads to loss
  chosen_korean: 감소로 이어지는
  alternatives_korean:
  - 줄어듦으로 가는
  - 감손으로 향하는
  - 줄어들게 하는
  lexicon: LSJ
  rationale: 직역하면 ‘감소를 향하여’이므로, 역설적 의미를 살리면서도 한국어로는 결과 지향을 분명히 하는 ‘감소로 이어지는’이 적절합니다.
