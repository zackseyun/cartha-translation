  yaml_path: translation/deuterocanon/sirach/020/028.yaml
  text: The one who works the land will raise up his grain heap[a], and the one who pleases great men will atone for injustice.
  footnotes:
  - marker: a
    text: Or 'will cover over wrongdoing.' The Greek says 'will make atonement for injustice,' which may describe the practical effect of winning the favor of powerful people.
    reason: lexical_alternative
translation:
  language: ko
  text: 땅을 경작하는 사람은 자기 곡식 더미를 높이 쌓을 것이고, 높은 사람들에게 잘 보이는 사람은 불의를 속죄할 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘불의를 덮을 것입니다.’ 그리스어는 문자적으로 ‘불의를 속죄할 것입니다’라고 하며, 실제로는 유력자의 호의를 얻어 문제를 무마하는 효과를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἐργαζόμενος γῆν
  english_pob_choice: the one who works the land
  chosen_korean: 땅을 경작하는 사람
  alternatives_korean:
  - 땅에서 일하는 사람
  - 농사짓는 사람
  lexicon: LSJ / BDAG
  rationale: 농경적 속담의 뜻을 살리면서도 현대 한국어에서 자연스럽게 읽히도록 ‘경작하다’를 택했습니다.
- source_word: ἀνυψώσει
  english_pob_choice: will raise up
  chosen_korean: 높이 쌓을 것입니다
  alternatives_korean:
  - 올릴 것입니다
  - 들어 올릴 것입니다
  lexicon: BDAG
  rationale: ‘raise up’의 기본 이미지를 유지하되, 뒤의 θιμωνιὰν과 결합된 결과를 한국어로 분명하게 보여 주기 위해 ‘높이 쌓다’로 옮겼습니다.
- source_word: θιμωνιὰν
  english_pob_choice: grain heap
  chosen_korean: 곡식 더미
  alternatives_korean:
  - 곡물 더미
  - 추수 더미
  - 낟가리
  lexicon: LSJ
  rationale: 수확된 곡식의 더미를 가리키는 말이므로, 현대 독자가 바로 이해할 수 있는 ‘곡식 더미’가 가장 무난합니다.
- source_word: ἐξιλάσεται ἀδικίαν
  english_pob_choice: will atone for injustice
  chosen_korean: 불의를 속죄할 것입니다
  alternatives_korean:
  - 불의를 속량할 것입니다
  - 불의를 화해시킬 것입니다
  - 불의를 덮을 것입니다
  lexicon: BDAG
  rationale: ἱλάσκομαι 계열의 속죄/속죄하다 어감을 살려 ‘속죄하다’로 옮겼습니다. 이 속담의 사회적 뉘앙스가 있더라도, 본문의 강한 속죄 언어를 약화시키지 않았습니다.
- source_word: μεγιστᾶσιν
  english_pob_choice: great men
  chosen_korean: 높은 사람들에게
  alternatives_korean:
  - 권세 있는 이들에게
  - 유력자들에게
  - 귀인들에게
  lexicon: LSJ
  rationale: 사회적으로 높은 지위를 가진 사람들을 가리키므로, 성별·계층의 일반성을 해치지 않으면서도 한국어로 자연스러운 표현을 선택했습니다.
theological_decisions:
- issue: 두 번째 행의 ‘속죄’ 언어를 사회적 처세로 완화할지 여부
  chosen_reading: 본문의 속죄 언어를 유지해 ‘불의를 속죄할 것입니다’로 옮겼습니다.
  alternative_readings:
  - 불의를 덮을 것입니다
  - 불의를 무마할 것입니다
  rationale: 그리스어 ἐξιλάσεται는 분명히 속죄/달램의 의미를 지니므로, 잠재된 역설을 지우지 않고 보존하는 것이 원문에 더 충실합니다.
  doctrine_reference: 'DOCTRINE.md: lexical tension should be preserved rather than flattened.'
