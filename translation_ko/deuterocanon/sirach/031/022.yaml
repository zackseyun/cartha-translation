review_pass:
  verdict: revise
  source_fidelity: 히브리어 본문 ‘וגם אם בין רבים ישבת, לפני רע אל תושיט יד.’의 양보 조건, 여러 사람 가운데 앉은 식사 상황, 그리고 상대보다 앞서 손을 내미는 금지를 대체로 충실히 반영합니다. 다만 רֵעַ는 이 식사 장면에서 특정한 식탁 상대·동료를 가리키므로 ‘이웃’보다 ‘곁에 있는 사람’이 문맥에 더 정확합니다.
  naturalness: 현대 표준어 합쇼체는 자연스럽습니다. ‘많은 사람들 가운데 앉아 있더라도’와 ‘손을 내밀지 마십시오’는 간결한 지혜문학적 훈계체를 잘 유지합니다. ‘곁에 있는 사람보다’가 식탁 예절 문맥을 더 자연스럽고 명료하게 합니다.
  terminology: ‘이웃’은 한국어 성경 용례로 가능하지만, 현대 한국어에서는 일반적 인접 관계 또는 윤리적 ‘이웃’의 함의가 강해 이 절의 רֵעַ가 가리키는 식사 상대를 충분히 특정하지 못합니다. ‘곁에 있는 사람’으로 조정합니다. 본문은 음식물을 명시하지 않고, 그 관습적 뜻은 주석으로 처리하는 것이 적절합니다.
