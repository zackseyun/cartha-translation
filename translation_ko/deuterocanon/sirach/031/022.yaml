  rationale: 본문의 히브리어 어순과 금지의 직접성은 유지하되, רֵעַ를 식탁에서 함께 있는 구체적 상대라는 문맥에 맞게 ‘곁에 있는 사람’으로 옮겼습니다. 음식물을 먼저 집는다는 관습적 의미는 본문에 첨가하지 않고 각주에만 남겼습니다. 그리스어 병행문의 현저한 차이와 ‘호의’ 관련 진술을 각주에서 더 정확히 밝혔습니다.
