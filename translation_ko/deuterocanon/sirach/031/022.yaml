  text: Even if you sit among many[b][a], do not reach out your hand before your companion.
  footnotes:
  - marker: a
    text: That is, do not take food ahead of another person at the table.
    reason: cultural_note
  - marker: b
    text: The Greek parallel in Swete differs sharply here and reads a line about 'the mockeries of the lawless' not being for favor; the Hebrew witness is therefore followed as the primary text for this verse, with the Greek kept in view as a divergent parallel.
    reason: textual_variant
translation:
  language: ko
  text: 비록 많은 사람들 가운데 앉아 있더라도, 당신의 이웃보다 먼저 손을 내밀지 마십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 즉, 식탁에서 다른 사람보다 먼저 음식을 집어 들지 말라는 뜻입니다.
    reason: cultural_note
  - marker: b
    text: 그리스어 병행문은 여기서 크게 달라, ‘율법 없는 자들의 조롱’에 관한 다른 문구를 전합니다. 이 절은 히브리어 본문을 따르고 그리스어는 대조 본문으로 보존합니다.
    reason: textual_variant
lexical_decisions:
- source_word: וגם אם
  english_pob_choice: Even if
  chosen_korean: 비록 … 하더라도
  alternatives_korean:
  - 설령 … 할지라도
  - 비록 … 해도
  lexicon: HALOT
  rationale: 양보적 조건을 자연스러운 합쇼체로 옮기기 위해 한국어의 표준적인 양보 표현을 사용했습니다.
- source_word: בין רבים
  english_pob_choice: among many
  chosen_korean: 많은 사람들 가운데
  alternatives_korean:
  - 많은 이들 가운데
  - 무리 가운데
  lexicon: HALOT
  rationale: 단순한 수적 의미를 살리면서도 식사 자리의 사회적 장면을 무리하지 않게 드러내기 위해 이렇게 옮겼습니다.
- source_word: רע
  english_pob_choice: your companion
  chosen_korean: 당신의 이웃
  alternatives_korean:
  - 당신의 동료
  - 당신의 벗
  lexicon: HALOT
  rationale: wisdom 문맥의 רע를 단순한 ‘악’이 아니라 함께 있는 상대를 가리키는 말로 읽어, 한국어에서 가장 무난하게 관계성을 나타내는 ‘이웃’을 택했습니다.
- source_word: אל תושיט יד
  english_pob_choice: do not reach out your hand
  chosen_korean: 손을 내밀지 마십시오
  alternatives_korean:
  - 손을 뻗지 마십시오
  - 손을 내밀어 잡지 마십시오
  lexicon: HALOT
  rationale: 식탁 예절의 이미지를 보존하면서도 한국어로 자연스럽게 들리도록 직역에 가깝게 옮겼습니다.
theological_decisions:
- issue: 잠언적 식사 예절 경고의 직접성
  chosen_reading: 규범적 권면으로서, ‘~하지 마십시오’라는 직접 명령형을 유지했습니다.
  alternative_readings:
  - 완곡하게 풀어 ‘먼저 가져가지 마십시오’로 옮길 수 있음
  - 설명적으로 ‘음식을 먼저 집지 마십시오’로 덧붙일 수 있음
  rationale: 히브리어의 짧고 날카로운 금지형을 약화시키지 않기 위해 본문 이미지를 유지한 채 직접 명령으로 처리했습니다.
  doctrine_reference: 지혜문학의 훈계 형식
- issue: ‘이웃’의 범위
  chosen_reading: 개별 식탁 상대를 가리키는 관계적 용어로 ‘이웃’을 사용했습니다.
  alternative_readings:
  - ‘동료’로 한정할 수 있음
  - ‘옆 사람’으로 구체화할 수 있음
  rationale: רע의 관계적 뉘앙스를 살리되, 지나치게 현대적이거나 협소한 사회적 역할로 제한하지 않기 위해 더 넓은 관계어를 택했습니다.
  doctrine_reference: 지혜문학의 일반적 인간관계 윤리
