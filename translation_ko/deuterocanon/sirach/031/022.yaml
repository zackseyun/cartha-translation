    rationale: 여기서 רֵעַ는 일반적인 도덕적 범주의 ‘이웃’보다 함께 자리한 상대를 뜻합니다. ‘곁에 있는 사람’은 본문의 관계성과 식사 상황을 자연스럽게 보존합니다.
