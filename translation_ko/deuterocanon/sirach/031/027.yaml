- source_word: הסבה
  english_pob_choice: the banquet
  chosen_korean: 잔치 자리
  alternatives_korean:
  - 연회
  - 식사 자리
  - 상에 둘러앉은 자리
  lexicon: HALOT
  rationale: סבה는 단순한 ‘식탁’보다 식사에 둘러앉은 자리/연회의 장면을 가리키므로, 한국어에서는 의미를 덜 좁히면서도 장면성을 살리는 ‘잔치 자리’를 택했습니다.
- source_word: נחת
  english_pob_choice: rest
  chosen_korean: 안식
  alternatives_korean:
  - 쉼
  - 평안
  - 편안함
  lexicon: HALOT
  rationale: נחת의 ‘편히 놓임, 쉼, 안도’는 문맥상 결과로서의 고요한 평정을 가리키므로, 간결하게 ‘안식’으로 옮기되 종교적 상투어로만 들리지 않게 문장 전체를 평이하게 구성했습니다.
