translation:
  language: ko
  text: '[그리고 그들이 당신에게 억지로 먹으라고 하면[a], 잔치 자리를 떠나십시오.] 그러면 안식을 얻게 될 것입니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 남아 있는 히브리어는 ‘그리고 그들이 당신에게 먹으라고 억지로 하면, 잔치 자리를 떠나라, 그러면 안식을 얻을 것이다’로 읽히지만, 제시된 그리스어 병행본은 ‘임금 삯을 빼앗는 자는 피를 쏟는 자이다’라고 달리 읽혀, 본문 전승이나 절 배열에 큰 차이가 있습니다.
    reason: textual_variant
