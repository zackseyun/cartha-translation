base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/031/002.yaml
  text: Like one who grasps at a shadow and pursues the wind, so is one who clings to dreams.
  footnotes:
  - marker: a
    text: 'The extant Hebrew witness aligned here in Kahana reads a substantially different line: ''An evil faithful one will stir up reproach, and one who conceals a secret is a friend like oneself.'' Because the Hebrew and Greek do not match at this verse reference, the main text follows the Greek witness for 31:2.'
    reason: textual_variant
  - marker: b
    text: Or 'one who pays attention to dreams' or 'one who holds fast to dreams.'
    reason: lexical_alternative
translation:
  language: ko
  text: 마치 그림자를 붙잡으려 하고 바람을 뒤쫓는 사람과 같아서, 꿈에 매달리는 자도 그러합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '히브리어 카이로 게니자 전승은 이 절에서 다른 문장을 보존합니다: ‘생계에 대한 걱정이 잠을 방해하고, 심한 병이 잠을 방해한다’에 해당하는 내용입니다. 따라서 본문은 그리스어 전승을 따릅니다.'
    reason: textual_variant
  - marker: b
    text: 또는 ‘꿈에 주의를 기울이는 자’, ‘꿈을 붙드는 자’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δρασσόμενος σκιᾶς
  english_pob_choice: Like one who grasps at a shadow
  chosen_korean: 마치 그림자를 붙잡으려 하고
  alternatives_korean:
  - 그림자를 움켜쥐려 하고
  - 그림자를 붙잡듯이 하고
  lexicon: LSJ
  rationale: 그림자는 잡히지 않는 대상을 가리키므로, 미완료적 시도와 헛됨을 함께 드러내는 ‘붙잡으려 하고’가 자연스럽습니다.
- source_word: διώκων ἄνεμον
  english_pob_choice: pursues the wind
  chosen_korean: 바람을 뒤쫓는 사람과 같아서
  alternatives_korean:
  - 바람을 쫓는 사람과 같아서
  - 바람을 추격하는 사람과 같아서
  lexicon: LSJ
  rationale: ‘뒤쫓다’는 헛된 추적이라는 뉘앙스를 살리면서도 현대 한국어에서 무리하지 않은 표현입니다.
- source_word: ὁ ἐπέχων ἐνυπνίοις
  english_pob_choice: one who clings to dreams
  chosen_korean: 꿈에 매달리는 자도
  alternatives_korean:
  - 꿈을 붙드는 자도
  - 꿈에 집착하는 자도
  lexicon: LSJ
  rationale: ἐπέχω는 ‘붙들다/매달리다/주목하다’의 범위를 가지므로, 문맥상 헛된 의탁을 드러내는 ‘매달리다’가 가장 적절합니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 본문의 큰 불일치
  chosen_reading: 본문은 그리스어 전승의 비유문을 따르고, 히브리어 전승이 이 절 번호에서 상당히 다른 내용을 보존한다는 사실은 각주로 남깁니다.
  alternative_readings:
  - '히브리어 본문: ‘생계에 대한 걱정이 잠을 방해하고, 심한 병이 잠을 방해한다’에 해당하는 내용'
  rationale: 이 절은 major_mismatch로 표시되어 있어, 숫자상 동일 절이라도 실제 문구가 서로 대응하지 않습니다. 번역 본문은 현재 참고 가능한 그리스어 문장을 반영하되, 다른 전승의 존재를 숨기지 않는 것이 소스 충실성에 부합합니다.
  doctrine_reference: Sirach의 상이한 본문 전승을 정직하게 병기하는 POB 원칙
- issue: 문장 종결의 비교 구조
  chosen_reading: ‘~와 같아서’로 비유를 한국어에서 매끄럽게 연결했습니다.
  alternative_readings:
  - ‘~와 같이’
  - ‘~와 같습니다’
  rationale: 원문의 ὡς가 도입하는 비교 관계를 보존하면서, 현대 한국어 합쇼체의 흐름에 맞게 마무리했습니다.
  doctrine_reference: 비유문 처리의 문체적 정합성
