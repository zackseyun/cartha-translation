    reason: textual_variant
  - marker: c
    text: Reclining was the customary posture at formal meals in the ancient Mediterranean world.
    reason: cultural_note
translation:
  language: ko
  text: 품위 있는 사람처럼[a] 기대어 앉으십시오[c]. 그리고 게걸스럽게 먹지 마십시오. 그렇지 않으면 혐오스러운 사람이 될 것입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 표현은 직역하면 ‘선택된 사람처럼’입니다. 여기서는 식사 예절의 문맥상 ‘품위 있는 사람처럼’ 또는 ‘훌륭한 사람처럼’이라는 뜻일 수 있으나, 정확한 뉘앙스는 다소 불확실합니다.
    reason: lexical_alternative
  - marker: b
    text: 이 절의 히브리어 본문은 식사 예절을 직접 말합니다. 그러나 스웨테 판 그리스어 병행본문은 이 구절의 같은 위치에 이에 정확히 대응하는 본문을 두지 않아, 본문 전승에 차이가 있음을 보여 줍니다.
    reason: textual_variant
  - marker: c
    text: 기대어 앉는 것은 고대 지중해 세계의 격식 있는 식사 자리에서 흔한 자세였습니다.
    reason: cultural_note
