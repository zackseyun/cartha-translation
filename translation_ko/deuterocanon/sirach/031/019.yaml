base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/031/019.yaml
  text: Recline like a well-bred man[a], and do not gobble[c][b], lest you become disgusting.
  footnotes:
  - marker: a
    text: Or 'like a distinguished man' or 'like a chosen man'; the Hebrew phrase is somewhat uncertain in nuance, though the sense is clearly courteous, refined table conduct.
    reason: lexical_alternative
  - marker: b
    text: The Greek parallel in Swete does not correspond to this Hebrew line at Sirach 31:19, indicating a source-level mismatch in the verse tradition.
    reason: textual_variant
  - marker: c
    text: Reclining was the customary posture at formal meals in the ancient Mediterranean world.
    reason: cultural_note
translation:
  language: ko
  text: 선별된 사람처럼 기대어 앉으십시오[a], 그리고 탐욕스럽게 먹지 마십시오[b][c]. 그러면 혐오스럽게 되실 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘선별된 사람처럼’은 히브리어 כאיש אשר נבחר의 뜻을 따라, ‘귀한/선택된/잘 길들여진’ 뉘앙스를 모두 열어 둔 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: 이 절의 히브리어는 식사 예절을 직접 말하며, 그리스어 병행본문은 이 구절의 같은 자리에 정확히 대응하지 않아 본문 전승 차이가 있습니다.
    reason: textual_variant
  - marker: c
    text: 기대어 앉는 자세는 고대 지중해 세계의 공식 식사 자리에서 흔한 관습이었습니다.
    reason: cultural_note
