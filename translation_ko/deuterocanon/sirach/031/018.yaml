base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/031/018.yaml
  text: Know your neighbor as yourself[a], and in everything you hate[c][b], be considerate.
  footnotes:
  - marker: a
    text: The Greek parallel supplied here differs substantially from the Hebrew, reading approximately, 'Whom does he attend to? and what is his support?' This draft follows the extant Hebrew witness as the primary source for Sirach where Hebrew survives.
    reason: textual_variant
  - marker: b
    text: Or 'Know your neighbor as your own self'; Hebrew נפש can mean 'soul,' 'life,' or 'self.'
    reason: lexical_alternative
  - marker: c
    text: The final clause may also be understood, 'and consider carefully whatever you hate,' expressing an ethical test based on what one would not want done to oneself.
    reason: alternative_reading
translation:
  language: ko
  text: 이웃을 자기 자신처럼 이해하십시오. 그리고 당신이 미워하는 모든 일에 대해서는 신중하게 생각하십시오.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 평행 본문은 상당히 다르게 전해지며, 여기서는 히브리어 증언을 주본문으로 따릅니다.
    reason: textual_variant
  - marker: b
    text: נפש는 ‘생명’, ‘영혼’, ‘자기 자신’을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 마지막 절은 ‘네가 미워하는 것은 무엇이든지’로도 이해될 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: דעה
  english_pob_choice: Know / Understand
  chosen_korean: 이해하십시오
  alternatives_korean:
  - 알아두십시오
  - 아십시오
  - 알고 있으십시오
  lexicon: HALOT
  rationale: ידע의 명령형으로서 단순 지식보다 관계적·윤리적 인식을 요구하므로, 현대 한국어에서는 ‘이해하십시오’가 문맥상 가장 자연스럽고 포괄적입니다.
- source_word: רעך
  english_pob_choice: your neighbor
  chosen_korean: 이웃을
  alternatives_korean:
  - 동료를
  - 친구를
  - 네 이웃을
  lexicon: HALOT
  rationale: רע는 가까운 사회적 관계의 타인을 가리키므로, 성경적 윤리를 살리는 표준어로 ‘이웃’이 적절합니다.
- source_word: כנפשך
  english_pob_choice: as yourself
  chosen_korean: 자기 자신처럼
  alternatives_korean:
  - 자기 영혼처럼
  - 자기 생명처럼
  - 스스로처럼
  lexicon: HALOT
  rationale: נפש는 ‘생명/자아/자기 자신’의 폭이 있으나, 윤리적 비교 표현으로는 한국어의 ‘자기 자신처럼’이 가장 자연스럽게 반영합니다.
- source_word: התבונן
  english_pob_choice: be considerate / take thought
  chosen_korean: 신중하게 생각하십시오
  alternatives_korean:
  - 깊이 생각하십시오
  - 숙고하십시오
  - 살피십시오
  lexicon: HALOT
  rationale: התבונן은 단순 인지가 아니라 숙고와 분별을 동반한 관찰이므로, 행위 이전의 윤리적 성찰을 드러내는 ‘신중하게 생각하십시오’로 옮겼습니다.
theological_decisions:
- issue: 히브리어 본문이 익숙한 ‘이웃을 사랑하라’ 공식이 아니라 ‘이해하라’는 지시를 담는 점
  chosen_reading: 사랑으로 순화하지 않고, 이웃에 대한 인식과 숙고를 요구하는 본문의 직설을 유지했습니다.
  alternative_readings:
  - 이웃을 사랑하십시오
  - 이웃을 배려하십시오
  rationale: 본문의 ידע와 התבונן은 사랑 명령이 아니라 이해와 분별의 윤리적 요구를 형성하므로, 전통적 구절과 조화시키지 않고 원문 긴장을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Original-language primacy over translation tradition; Preserve theological tension rather than resolve it.'
