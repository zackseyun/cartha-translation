theological_decisions:
- issue: 히브리어 본문과 그리스어 평행본문의 큰 차이
  chosen_reading: 현존 히브리어 본문을 본문으로 번역하되, 이 절의 그리스어 평행본문이 전혀 다른 말(점, 꿈, 산통하는 여인의 마음)을 전한다는 점은 주석으로 분리합니다.
  alternative_readings:
  - '그리스어 평행본문: ‘점과 징조와 꿈은 헛되며, 마음은 해산하는 여인의 마음처럼 상상합니다.’'
  rationale: 이 절은 단순한 어휘 차이가 아니라 다른 전승의 문장일 가능성이 커서, 본문을 혼합하거나 조화시키지 않고 차이를 투명하게 남겨야 합니다.
  doctrine_reference: 'PHILOSOPHY.md: 남아 있는 히브리어 전승을 우선하되, 중요한 본문 차이는 숨기지 않습니다.'
