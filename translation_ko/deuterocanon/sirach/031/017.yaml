base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/031/017.yaml
  text: Stretch out your hand to the place he looks at[a], and do not reach with him into the dish.
  footnotes:
  - marker: a
    text: The Greek tradition here reads, 'Happy is the soul of the one who fears the Lord.' The Hebrew witness preserved in the Cairo Geniza gives a different line about table manners, and the source tradition is uncertain at this point.
    reason: alternative_reading
translation:
  language: ko
  text: 손을 그가 바라보는 자리로 내밀고, 그와 함께 접시에 손을 넣지 마십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 전승은 이곳을 ‘주를 경외하는 이의 영혼은 복됩니다’로 읽습니다. 그러나 카이로 게니자 히브리어 증거는 식사 예절에 관한 다른 문장을 전하므로, 본문은 히브리어 전승을 따랐습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: מקום
  english_pob_choice: the place
  chosen_korean: 자리
  alternatives_korean:
  - 곳
  - 위치
  lexicon: HALOT
  rationale: 식사 자리의 맥락에서 단순한 물리적 공간보다 “자리”가 상대가 보는 앞의 몫/위치를 자연스럽게 드러냅니다.
- source_word: יביט
  english_pob_choice: he looks at
  chosen_korean: 그가 바라보는
  alternatives_korean:
  - 그가 보는
  - 그가 주시하는
  lexicon: HALOT
  rationale: 동작 자체를 직접 번역하기보다 상대가 보고 있는 대상의 경계를 나타내는 현재 관형으로 살려 예절 문맥을 유지했습니다.
- source_word: תושיט יד
  english_pob_choice: stretch out your hand
  chosen_korean: 손을 내밀고
  alternatives_korean:
  - 손을 뻗고
  - 손을 펴고
  lexicon: HALOT
  rationale: 히브리어 관용구의 직설성을 유지하면서도 현대 한국어에서 자연스러운 식사 동작 표현으로 옮겼습니다.
- source_word: אל תחד עמו
  english_pob_choice: do not reach with him
  chosen_korean: 그와 함께 접시에 손을 넣지 마십시오
  alternatives_korean:
  - 그와 함께 집지 마십시오
  - 그와 함께 손을 대지 마십시오
  lexicon: HALOT
  rationale: 문맥상 “함께”라는 동시성을 분명히 드러내고, 공유 접시에서 동시에 집는 행위를 한국어로 구체화했습니다. POB의 영문처럼 단순한 ‘reach’보다 식사 예절 위반을 더 분명히 합니다.
- source_word: בטנא
  english_pob_choice: into the dish
  chosen_korean: 접시에
  alternatives_korean:
  - 그릇에
  - 쟁반에
  lexicon: HALOT
  rationale: 어근의 일반적 의미 범위는 그릇/용기이지만, 이 장면에서는 공동 식사용 용기를 가리키므로 “접시”가 가장 분명합니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행문의 큰 불일치
  chosen_reading: 본문은 현존하는 히브리어의 식사 예절 문장을 따르고, 그리스어의 ‘주를 경외하는 자의 영혼은 복되다’는 전승은 각주로만 보존했습니다.
  alternative_readings:
  - 복되다, 주를 경외하는 이의 영혼은.
  - 주를 경외하는 자의 영혼은 복됩니다.
  rationale: 집회서에서는 히브리어가 살아 있을 때 그것을 본문으로 따르되, 현저한 전승 차이는 숨기지 않는 것이 원칙입니다. 여기서는 단순한 어휘 차이가 아니라 사실상 다른 문장입니다.
  doctrine_reference: 'PHILOSOPHY.md: Sirach는 히브리어가 보존된 경우 히브리어를 본문으로 따르고, 큰 전승 차이는 투명하게 표시한다.'
