  source_fidelity: 본문은 카이로 게니자 히브리어의 식사 예절 문장(‘손을 내밀라’ 및 ‘그와 함께 용기에 손대지 말라’)을 충실히 따릅니다. ‘그가 바라보는 자리로’는 מקום/יביט의 다소 어려운 결합을 과도하게 해석하지 않고 자연스럽게 옮겼으며, ‘그와 함께’는 עמו의 동시성을 보존합니다. 그리스어 병행문의 현저히 다른 읽기는 본문에 섞지 않고 각주에 제시했습니다.
  naturalness: ‘손을 … 내밀고, … 손을 넣지 마십시오’는 현대 표준 한국어의 공적이고 정중한 합쇼체로 자연스럽습니다. 식사 예절 문맥에서 ‘접시에 손을 넣지 마십시오’도 명확하고 관용적입니다.
  terminology: ‘주를 경외하는 이’와 ‘영혼’은 그리스어 대안 읽기의 종교·인간론 용어를 적절히 반영합니다. ‘접시’는 בטנא의 용기라는 넓은 의미를 식사 장면에 맞게 무리 없이 구체화한 표현입니다.
