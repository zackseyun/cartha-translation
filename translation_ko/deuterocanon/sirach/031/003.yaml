  source_fidelity: 히브리어 עמלי עשיר לקבץ הון, ואם ינוח לקבל תענוג을 따르면, 부유한 사람이 재물을 모으기 위해 수고하고 쉰 뒤 즐거움을 누린다는 뜻입니다. 본문의 ‘수고하고’와 ‘즐거움을 누립니다’는 이 의미를 충실히 전달합니다. 다만 기존 각주는 히브리어 표현 자체를 설명하면서 불필요하게 영어 POB를 기준으로 삼고, 실제로 중요한 그리스어 병행 본문의 불일치도 반영하지 못합니다.
