  terminology: ‘부유한 사람’, ‘재물’, ‘수고하다’, ‘즐거움’은 지혜문학의 관찰적 어조와 어휘에 잘 맞습니다. תענוג에는 ‘즐거움/기쁨’뿐 아니라 ‘사치스러운 향락’의 뉘앙스도 가능하지만, 여기서는 해석을 과도하게 구체화하지 않는 ‘즐거움’이 적절합니다.
