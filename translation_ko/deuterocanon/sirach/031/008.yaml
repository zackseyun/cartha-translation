  lexicon: HALOT
  rationale: 본문이 난해하므로 ‘재물’과 ‘길을 벗어남’이라는 핵심 의미를 보존하면서, 원문의 관계성을 과도하게 재구성하지 않았습니다.
theological_decisions:
