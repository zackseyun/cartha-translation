  chosen_reading: ‘재물에 관해 길을 벗어나지 않은’으로 옮겨, 본문이 말하는 도덕적 일탈 금지를 유지했습니다.
  alternative_readings:
  - 재물을 따라 길을 벗어나지 않은
  - 돈에 이끌려 빗나가지 않은
  rationale: 현존 히브리어는 어색하고, 영어 POB도 ‘after wealth’/‘led astray by money’의 가능성을 열어 둡니다. 그래서 확정적 해석을 피하고 의미 핵심만 남겼습니다.
