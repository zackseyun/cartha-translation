  rationale: 히브리어는 남성 단수이지만, 한국어에서는 대표적 인간 일반을 자연스럽게 드러내기 위해 ‘사람’을 택했습니다.
- source_word: תמים
  english_pob_choice: blameless
  chosen_korean: 흠이 없다고 인정받는
  alternatives_korean:
  - 온전한
  - 결함 없는
  - 완전한
  lexicon: HALOT
  rationale: 윤리적 무결함을 뜻하되, 단순한 내적 상태보다 공동체적 평가까지 포함할 수 있어 ‘인정받는’으로 풀었습니다.
- source_word: ויחר ממון לא נלוז
  english_pob_choice: has not gone astray after wealth
  chosen_korean: 재물에 관해 길을 벗어나지 않은
  alternatives_korean:
  - 재물을 따라 길을 벗어나지 않은
  - 돈에 이끌려 빗나가지 않은
  lexicon: HALOT
  rationale: 본문이 난해하므로 ‘재물’과 ‘길을 벗어남’이라는 핵심 의미를 보존하면서, 원문의 관계성을 과도하게 재구성하지 않았습니다.
theological_decisions:
- issue: 히브리어 말미 구절의 난해함과 재물과의 관계 표현
  chosen_reading: ‘재물에 관해 길을 벗어나지 않은’으로 옮겨, 본문이 말하는 도덕적 일탈 금지를 유지했습니다.
  alternative_readings:
  - 재물을 따라 길을 벗어나지 않은
  - 돈에 이끌려 빗나가지 않은
  rationale: 현존 히브리어는 어색하고, 영어 POB도 ‘after wealth’/‘led astray by money’의 가능성을 열어 둡니다. 그래서 확정적 해석을 피하고 의미 핵심만 남겼습니다.
