  source_fidelity: 히브리어 본문을 따라 수사적 질문, 공동 청유, 그리고 그 이유가 되는 ‘자기 백성 가운데서’의 놀라운 행위를 충실히 옮겼습니다. 다만 원문의 일반적 모범 인물에게 높임 종결 ‘행하셨으니’를 쓰는 것은 근거 없는 높임이므로 고쳤습니다.
  naturalness: ‘하십시다’보다 현대 표준 합쇼체 청유형인 ‘부릅시다’가 자연스럽습니다. 또한 ‘복된 이’는 원문의 ‘복되다/복된 이로 일컫다’라는 선언적 의미를 자연스럽게 전달합니다.
  terminology: ‘복된 이’는 אשר의 의미를 보존하며, ‘놀라운 일을 행하다’는 הפליא לעשות의 탁월하고 경이로운 행위를 과장 없이 반영합니다. 그리스어 각주는 σύνεσις를 ‘이해력’으로 옮겨 ‘지혜’보다 원문에 가깝게 조정했습니다.
