translation:
  language: ko
  text: 이 사람이 누구입니까? 그가 자기 백성 가운데서 놀라운 일들을 행하셨으니, 그를 복된 사람이라 하십시다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '제시된 그리스어 평행문은 내용이 크게 다릅니다: ‘학식 있는 사람은 많은 것을 알았고, 경험이 많은 사람은 지혜를 말해 줄 것입니다.’ 이는 다른 본문 형태나 절 배열을 반영한 것일 가능성이 큽니다.'
    reason: textual_variant
lexical_decisions:
- source_word: מי הוא זה
  english_pob_choice: Who is this?
  chosen_korean: 이 사람이 누구입니까?
  alternatives_korean:
  - 누구입니까?
  - 이분이 누구입니까?
  lexicon: HALOT
  rationale: 히브리어의 수사적 질문과 지시어 זה의 대상을 살리기 위해 ‘이 사람’으로 옮겼습니다. 예수나 특정 인물을 가리키는 문맥이 아니라 일반적인 모범 인물을 가리키므로 과도한 지정은 피했습니다.
- source_word: ונאשרנו
  english_pob_choice: Let us call him blessed
  chosen_korean: 그를 복된 사람이라 하십시다
  alternatives_korean:
  - 그를 복되다고 하십시다
  - 그를 복이라고 하십시다
  - 그를 복되다 일컫읍시다
  lexicon: HALOT
  rationale: אשר의 ‘복되다, 복된 자로 일컫다’라는 뜻을 살려 단순 찬양보다 ‘복된 사람’으로 판정하는 표현을 택했습니다. 공동체적 권면의 청유형도 유지했습니다.
- source_word: הפליא לעשות
  english_pob_choice: has done wonders
  chosen_korean: 놀라운 일들을 행하셨으니
  alternatives_korean:
  - 기이한 일들을 행하셨으니
  - 놀랍게 행하셨으니
  - 기이한 일을 하셨으니
  lexicon: HALOT
  rationale: פלא의 ‘놀랍고 기이한 행위’라는 강한 의미를 살리기 위해 ‘놀라운 일들’을 택했습니다. 영어처럼 추상화하지 않고 행위의 탁월성을 직접 드러냈습니다.
- source_word: בעמו
  english_pob_choice: among his people
  chosen_korean: 자기 백성 가운데서
  alternatives_korean:
  - 자기 백성에게
  - 자기 백성을 위하여
  - 자기 백성 안에서
  lexicon: HALOT
  rationale: ב의 공간적·공동체적 용법을 따라 ‘가운데서’로 옮겼습니다. ‘for his people’로 좁히면 히브리어가 가진 범위를 넘을 수 있어 피했습니다.
theological_decisions:
- issue: 히브리어 본문과 제시된 그리스어 평행문의 큰 차이
  chosen_reading: 본문은 살아 있는 히브리어를 따르고, 그리스어 평행은 각주로만 알려 주었습니다.
  alternative_readings:
  - ‘학식 있는 사람은 많은 것을 알고, 경험 많은 사람은 지혜를 풀어 말한다.’
  rationale: 이 절은 히브리어와 그리스어가 사실상 다른 문장 형태이므로, 프로젝트 원칙에 따라 보존된 히브리어를 본문으로 번역하고 그리스어는 대안 전승으로 표시했습니다.
  doctrine_reference: 'PHILOSOPHY.md: 히브리어가 보존될 때는 히브리어를 우선하고, 큰 불일치는 숨기지 않는다.'
