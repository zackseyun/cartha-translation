base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/031/029.yaml
  text: Even if you are constrained[a], wait for delicacies patiently[b], and it will bring you rest.
  footnotes:
  - marker: a
    text: The Greek parallel reads, 'One praying and one cursing—which voice will the Master listen to?' This reflects a substantially different textual tradition from the extant Hebrew here.
    reason: alternative_reading
  - marker: b
    text: The Hebrew of this verse is uncertain and differs sharply from the Greek witness; 'you are constrained' renders a difficult form that may mean 'you are compelled' or 'you are under pressure.'
    reason: textual_variant
translation:
  language: ko
  text: 압박을 받고 있더라도, 진미를 인내하며 기다리십시오. 그러면 그것이 당신에게 쉼을 가져다줄 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 절의 히브리어는 불확실하며 그리스어 본문과 크게 다릅니다. ‘압박을 받고’로 옮긴 말은 강요되거나 압력을 받는다는 뜻일 수 있는 어려운 히브리어 형태입니다. 그리스어 병행문은 “한 사람은 기도하고 한 사람은 저주하니, 주인은 누구의 음성을 들으시겠느냐?”라고 합니다.
    reason: textual_variant
