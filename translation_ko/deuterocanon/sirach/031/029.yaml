  alternative_readings:
  - '그리스어 병행문의 의미: ‘한 사람은 기도하고 한 사람은 저주하니, 주인은 누구의 음성을 들으시겠느냐?’'
  rationale: 이 절은 단순한 어휘 차이가 아니라 서로 다른 문장 전승을 보이므로, 주본문은 히브리어를 따르되 번역문 자체는 히브리어의 실제 문맥을 우선 반영했습니다.
  doctrine_reference: 'Sirach source-policy: 히브리어가 남아 있는 경우 히브리어를 주본문으로 삼되, 중대한 전승 차이는 별도 기록으로 남김'
