  language: ko
  text: 건강한 배에는 생명의 세월이 따릅니다. 그는 아침에 일어나도 생명이 그에게 있습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שנות חיים
  english_pob_choice: Years of life
  chosen_korean: 생명의 세월
  alternatives_korean:
  - 생명의 해들
  - 장수의 세월
  - 생명의 햇수
  lexicon: שנים + חיים
  rationale: 직역하면 ‘생명의 해들’이지만, 한국어에서는 ‘세월’이 자연스럽게 시간의 길이와 장수를 함께 드러내므로 문맥에 맞게 옮겼습니다.
- source_word: על קרב תולל
  english_pob_choice: from a sound stomach
  chosen_korean: 건강한 배에서
  alternatives_korean:
  - 튼튼한 배에서
  - 건전한 내장에서
  - 건강한 위에서
  lexicon: קרב + תולל
  rationale: 히브리어는 몸의 중심 내부 장기를 가리키는 표현으로, 영어 POB의 ‘sound stomach’를 따라 한국어에서도 직설적으로 ‘배’로 옮기되 자연스러운 ‘건강한’을 붙였습니다.
- source_word: ונפשו אתו
  english_pob_choice: and his life is with him
  chosen_korean: 그의 생명이 그와 함께 있습니다
  alternatives_korean:
  - 그의 혼이 그와 함께 있습니다
  - 그의 목숨이 그와 함께 있습니다
  - 그의 생명이 그와 더불어 있습니다
  lexicon: נפש
  rationale: נפש는 여기서 단순한 ‘혼’보다 생명/목숨의 의미가 강하므로, POB의 ‘life’를 반영해 ‘생명’으로 번역했습니다.
theological_decisions:
- issue: 인간의 삶의 근원이 ‘건강한 배’에 있다고 말하는 표현
  chosen_reading: 지혜문학의 관찰적 진술로 유지하여, 신학적 교리화 없이 신체적·일상적 인과를 그대로 드러냈습니다.
  alternative_readings:
  - 비유적으로 소화와 절제를 말하는 교훈으로 완화
  - ‘위장’에 대한 의학적 진술로 특정
  rationale: 본문은 교리 선언이 아니라 삶의 상태에 대한 통찰이므로, 원문의 직설성과 관찰성을 유지하는 것이 가장 충실합니다.
  doctrine_reference: 지혜문학의 격언적 관찰
