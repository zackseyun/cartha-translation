  source_fidelity: 히브리어의 שנות חיים(‘생명의 세월/햇수’), קרב תולל(건강하고 온전한 몸속/배), וקם בבקר ונפשו אתו(‘아침에 일어나며 그의 생명이 그와 함께 있다’)라는 병렬적 격언을 대체로 반영했습니다. 다만 초안의 ‘배에서 … 나옵니다’는 על의 관계를 물리적 발생지처럼 들리게 하며 한국어 관용에도 맞지 않습니다.
  naturalness: ‘건강한 배에서 생명의 세월이 나옵니다’와 ‘그의 생명이 그와 함께 있습니다’는 직역 흔적이 강합니다. ‘건강한 배에는 생명의 세월이 따릅니다’ 및 ‘그는 아침에 일어나도 생명이 그에게 있습니다’로 다듬으면 현대 표준 한국어의 격언적 문체에서 자연스럽습니다.
