translation:
  language: ko
  text: 네 모든 일에 절제하십시오. 그러면 어떤 재앙도 당신에게 닿지 않을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '그리스어에는 이곳이 상당히 다른 독법으로 전해집니다: ‘한 사람이 짓고 다른 사람이 헐어 버리니, 그들이 수고 외에 무엇을 더 얻었습니까?’ 이 절은 현존 히브리어를 따라 번역했으며, 그리스어 전통은 본문과 크게 다릅니다.'
    reason: textual_variant
lexical_decisions:
- source_word: בכל מעשיך
  english_pob_choice: In all your deeds
  chosen_korean: 네 모든 일에
  alternatives_korean:
  - 네 모든 행실에서
  - 네 모든 행위에
  - 모든 일마다
  lexicon: HALOT
  rationale: בכל은 범위를 포괄하는 표현이므로 ‘네 모든 일에’로 자연스럽게 살렸고, מעשיך는 단순한 행위보다 삶의 실제적 행실 전체를 가리키는 맥락에 맞게 옮겼습니다.
- source_word: צנוע
  english_pob_choice: modest
  chosen_korean: 절제하십시오
  alternatives_korean:
  - 겸손하십시오
  - 신중하십시오
  - 수줍어하십시오
  lexicon: HALOT
  rationale: צנוע는 단순한 내적 겸손보다 품위 있는 절제와 드러남을 삼가는 태도를 뜻하므로, 한국어에서는 도덕적·사회적 뉘앙스를 살린 ‘절제하십시오’가 가장 직접적입니다.
- source_word: אסון
  english_pob_choice: disaster
  chosen_korean: 재앙
  alternatives_korean:
  - 재난
  - 불행
  - 화
  lexicon: HALOT
  rationale: אסון은 중대한 해악이나 재난을 가리키므로, 현대 한국어에서 위협의 강도를 분명히 드러내는 ‘재앙’이 적절합니다.
- source_word: לא יגע בך
  english_pob_choice: will touch you
  chosen_korean: 당신에게 닿지 않을 것입니다
  alternatives_korean:
  - 당신에게 미치지 않을 것입니다
  - 당신을 건드리지 않을 것입니다
  - 당신에게 이르지 않을 것입니다
  lexicon: HALOT
  rationale: נגע의 기본 이미지를 살리면서도 한국어에서 해가 임박해 ‘닿는다’는 표현이 자연스럽기 때문에, 단순한 추상화보다 직역성을 유지한 ‘닿지 않을 것입니다’를 택했습니다.
theological_decisions:
- issue: 헬라어 전승과 히브리어 본문의 차이
  chosen_reading: 본문은 현존 히브리어를 따라 ‘절제하십시오’로 번역하고, 그리스어의 상이한 독법은 각주로 알렸습니다.
  alternative_readings:
  - 그리스어 전승을 따라 ‘한 사람은 짓고 다른 사람은 헐어 버리니, 그들이 수고 외에 무엇을 더 얻었습니까?’
  - 그리스어 독법을 본문에 병기하는 처리
  rationale: 이 절은 히브리어와 그리스어가 크게 다르므로, 원문 전승 우선 원칙에 따라 현존 히브리어를 본문으로 두고 헬라어 차이는 독자가 확인할 수 있도록 각주로 처리하는 것이 가장 투명합니다.
  doctrine_reference: 본문비평 / 전승사
