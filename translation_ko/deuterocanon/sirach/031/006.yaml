  rationale: 이 단어는 값비싼 보석 일반까지 넓게 가리킬 수 있지만, POB의 영어 선택에 맞춰 대표적 구체어인 진주를 사용했습니다.
- source_word: להנצל / להושע
  english_pob_choice: find escape / deliverance
  chosen_korean: 벗어나는 길을 찾지 못했고, … 구원도 얻지 못했습니다
