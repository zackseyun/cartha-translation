  - 금붙이
  - 귀금속
  lexicon: HALOT
  rationale: 히브리어의 직설적 표현을 따라 재물로서의 금을 자연스럽게 옮겼습니다.
- source_word: פנינים
  english_pob_choice: pearls
  chosen_korean: 진주
  alternatives_korean:
  - 보석
  - 귀한 보석
