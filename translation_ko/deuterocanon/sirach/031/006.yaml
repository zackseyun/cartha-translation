  alternative_readings:
  - ‘지극히 높으신 이에게서 방문 가운데 보내지지 않았다면, 그것들에게 마음을 두지 마십시오’라는 그리스어식 번역
  rationale: 집회서에서는 히브리어가 살아 있는 경우 이를 मुख्य 본문으로 삼되, 크게 다른 그리스어 전승은 숨기지 않고 주석으로 보존하는 것이 원문에 가장 충실합니다.
  doctrine_reference: 'PHILOSOPHY.md: translate Sirach from Hebrew where it survives; preserve major Greek variants honestly.'
