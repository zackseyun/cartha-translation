  - 해악에서 … 진노의 날에
  - 악에서 … 분노의 날에
  lexicon: HALOT
  rationale: wisdom 문맥에서 מרעה를 단순한 도덕악과 재난 모두를 아우를 수 있는 ‘악’으로, עברה를 종말론적 심판 뉘앙스가 강한 ‘진노’로 옮겼습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행본의 큰 차이
