base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/031/006.yaml
  text: Many have been ruined by gold[a], and by trusting in pearls; they did not find escape from evil[b], nor deliverance on the day of wrath.
  footnotes:
  - marker: a
    text: Hebrew פנינים may mean 'pearls' or more broadly costly gems/jewels.
    reason: lexical_alternative
  - marker: b
    text: 'The Greek witness differs substantially here: ''Unless it is sent from the Most High in visitation, do not give your heart to them.'' The Hebrew text used for the main translation instead warns that trust in wealth does not save from evil or from the day of wrath.'
    reason: textual_variant
translation:
  language: ko
  text: 많은 사람이 금 때문에 파멸했고[a], 진주를 의지한 사람도 그랬습니다. 그들은 악에서 벗어날 길을 찾지 못했고, 진노의 날에 구원도 얻지 못했습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 פנינים은 ‘진주’일 수도 있고, 더 넓게는 값비싼 보석을 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어 전승은 여기서 크게 다릅니다. “지극히 높으신 이에게서 심판을 위해 보내진 것이 아니라면, 그것들에게 마음을 두지 마십시오.” 본문 번역은 현존 히브리어 본문을 따라, 재물을 의지하는 것이 악과 진노의 날에 구해 주지 못한다고 말합니다.
    reason: textual_variant
