  - 피할 길을 찾지 못했고
  - 구출을 얻지 못했고
  - 구원받지 못했습니다
  lexicon: HALOT
  rationale: 두 동사를 각각 ‘escape’와 ‘deliverance’의 차이를 살려 옮기되, 한국어에서는 반복을 줄여 자연스럽게 정리했습니다.
- source_word: מרעה / ביום עברה
  english_pob_choice: from evil / on the day of wrath
  chosen_korean: 악에서 … 진노의 날에
  alternatives_korean:
  - 재앙에서 … 분노의 날에
  - 해악에서 … 진노의 날에
  - 악에서 … 분노의 날에
  lexicon: HALOT
  rationale: wisdom 문맥에서 מרעה를 단순한 도덕악과 재난 모두를 아우를 수 있는 ‘악’으로, עברה를 종말론적 심판 뉘앙스가 강한 ‘진노’로 옮겼습니다.
theological_decisions:
