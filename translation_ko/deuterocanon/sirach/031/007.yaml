translation:
  language: ko
  text: 왜냐하면 그것은 어리석은 자에게 걸림돌이 되고, 모든 순진한 자는 그것에 걸려듭니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '그리스어 평행본문: “꿈이 많은 이를 미혹했고, 그 꿈들에 희망을 둔 이들은 넘어졌습니다.” 히브리어와 그리스어 증언은 이곳에서 상당히 다릅니다.'
    reason: alternative_reading
lexical_decisions:
- source_word: תקלה
  english_pob_choice: stumbling block
  chosen_korean: 걸림돌
  alternatives_korean:
  - 넘어짐의 덫
  - 실족거리
  - 함정
  lexicon: HALOT
  rationale: 무언가에 걸려 넘어지는 구체적 은유를 살려 ‘걸림돌’로 옮겼습니다. ‘오프ense’류의 추상화보다 본문의 위험성을 더 직접적으로 드러냅니다.
- source_word: אויל
  english_pob_choice: fool
  chosen_korean: 어리석은 자
  alternatives_korean:
  - 우매한 자
  - 미련한 자
  - 어리석은 사람
  lexicon: HALOT
  rationale: 지혜문학에서의 도덕적·지적 결핍을 가리키는 표준 어휘이므로, 한국어에서는 인격적 호칭을 살린 ‘어리석은 자’가 가장 자연스럽습니다.
- source_word: יוקש
  english_pob_choice: is ensnared
  chosen_korean: 걸려듭니다
  alternatives_korean:
  - 함정에 빠집니다
  - 덫에 걸립니다
  - 포획됩니다
  lexicon: HALOT
  rationale: 수동적 ‘포획됨’보다 함정에 걸리는 이미지를 살리는 동사로 옮겼습니다. 앞의 ‘걸림돌’과도 소리와 뜻이 맞물립니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 평행본문의 큰 차이
  chosen_reading: 본문은 현존 히브리어를 따르되, 이 절의 그리스어 전승이 내용상 크게 다르다는 점을 각주로 밝혔습니다.
  alternative_readings:
  - “많은 이들을 꿈이 미혹했고, 그것들을 바란 이들은 그 꿈들 때문에 넘어졌습니다.”
  rationale: 이 절은 단순한 단어 차이가 아니라 본문 자체가 다른 수준의 차이를 보입니다. 따라서 주본문은 히브리어를 따르고, 그리스어는 대안 독법으로 보존하는 것이 가장 정직합니다.
  doctrine_reference: 'PHILOSOPHY.md: 히브리어가 보존된 곳에서는 히브리어를 우선하고, 그리스어 평행본문의 차이는 숨기지 않는다.'
