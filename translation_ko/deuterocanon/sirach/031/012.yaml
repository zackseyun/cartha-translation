base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/031/012.yaml
  text: Therefore hold fast to his goodness[a], and the assembly will recount his praise. Bread is instruction[c][b], and wine with it.
  footnotes:
  - marker: a
    text: 'Greek has a substantially different reading: ''I have seen many things in my wandering, and my understanding is more than my words.'' The Hebrew and Greek witnesses diverge sharply here.'
    reason: textual_variant
  - marker: b
    text: Or 'his bounty' / 'his generosity' for 'his goodness.'
    reason: lexical_alternative
  - marker: c
    text: The final clause is textually and semantically difficult; 'discipline' could also be rendered 'instruction' or 'correction.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 그의 선하심을 굳게 붙드십시오[a]. 그러면 회중이 그의 찬양을 이야기할 것입니다. 빵은 훈육이고[b], 포도주도 함께 있습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 본문은 ‘나는 내 방랑 중에 많은 것을 보았고, 내 깨달음은 내 말보다 더 많다’는 상당히 다른 독법을 전합니다.
    reason: textual_variant
  - marker: b
    text: ‘훈육’ 대신 ‘교훈’ 또는 ‘징계’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 마지막 절은 본문상 어려우며, ‘포도주도 함께 있다’는 구문도 ‘포도주와 함께’ 또는 ‘포도주도 곁들여 있다’로 이해할 수 있습니다.
    reason: lexical_alternative
