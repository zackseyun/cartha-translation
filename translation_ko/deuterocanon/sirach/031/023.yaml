  text: Is not a little enough for an intelligent man? And on his bed he does not gasp[a][b].
  footnotes:
  - marker: a
    text: Hebrew 'does not pant' is somewhat uncertain here; the surviving Hebrew is difficult, but the sense in context is that moderate eating leaves a man undistressed in bed.
