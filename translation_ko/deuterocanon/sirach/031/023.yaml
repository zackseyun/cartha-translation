  text: Is not a little enough for an intelligent man? And on his bed he does not gasp[a][b].
  footnotes:
  - marker: a
    text: Hebrew 'does not pant' is somewhat uncertain here; the surviving Hebrew is difficult, but the sense in context is that moderate eating leaves a man undistressed in bed.
    reason: textual_variant
  - marker: b
    text: The Greek parallel supplied with this verse in the source data does not match the Hebrew line and appears to reflect a different verse; the translation therefore follows the Hebrew as the primary witness while noting uncertainty.
    reason: textual_variant
translation:
  language: ko
  text: 지각 있는 사람에게는 적은 것만으로도 충분하지 않습니까? 그리고 그의 침상에서 그는 헐떡이지 않습니다[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 여기서 다소 불확실하며, 문맥상 절제된 식사가 침상에서의 불편을 줄인다는 뜻으로 이해하는 것이 가장 자연스럽습니다.
    reason: textual_variant
  - marker: b
    text: 제공된 그리스어 병행문은 이 절의 히브리어와 일치하지 않으며 다른 절을 반영한 것으로 보입니다. 따라서 번역은 히브리어를 따랐습니다.
    reason: textual_variant
lexical_decisions:
- source_word: הלא די
  english_pob_choice: Is not a little enough
  chosen_korean: 적은 것만으로도 충분하지 않습니까
  alternatives_korean:
  - 조금이면 충분하지 않습니까
  - 적은 것으로도 족하지 않습니까
  lexicon: HALOT
  rationale: הלא의 수사적 질문과 די의 ‘충분함’을 함께 살려, 단순 서술이 아니라 동의와 성찰을 요구하는 문장으로 옮겼습니다.
- source_word: אנוש נבון
  english_pob_choice: an intelligent man
  chosen_korean: 지각 있는 사람
  alternatives_korean:
  - 총명한 사람
  - 이해력이 있는 사람
  - 현명한 사람
  lexicon: HALOT
  rationale: נבון은 단순 지능보다 분별과 이해를 가리키므로, 식사 절제와 휴식의 문맥에 맞게 ‘지각 있는’으로 옮겼습니다.
- source_word: יצועיו
  english_pob_choice: his bed
  chosen_korean: 그의 침상
  alternatives_korean:
  - 그의 침대
  - 그의 잠자리
  lexicon: HALOT
  rationale: 문맥상 눕는 자리를 가리키며, 시적·잠언적 표현을 살리기 위해 ‘침상’을 선택했습니다.
- source_word: לא ישיק
  english_pob_choice: he does not gasp
  chosen_korean: 그는 헐떡이지 않습니다
  alternatives_korean:
  - 그는 숨이 차지 않습니다
  - 그는 가쁜 숨을 쉬지 않습니다
  - 그는 몸부림치지 않습니다
  lexicon: HALOT
  rationale: 히브리어 동사는 난해하지만, 문맥상 과식 후 침상에서 겪는 불편함이나 호흡 곤란을 가리키는 것으로 보여, 과도한 해석을 피하면서도 육체적 불편을 드러내는 ‘헐떡이지 않습니다’로 옮겼습니다.
theological_decisions:
- issue: 난해한 히브리어 동사 לא ישיק의 처리
  chosen_reading: ‘헐떡이지 않습니다’로 번역하여, 절제된 식사가 침상에서의 불편과 호흡 곤란을 막는다는 잠언적 의미를 드러냈습니다.
  alternative_readings:
  - ‘숨이 차지 않습니다’
  - ‘토하지 않습니다’
  rationale: 본문의 히브리어는 불확실하므로, 확정적 증상을 단정하지 않고 문맥이 요구하는 ‘불편 없음’의 뜻을 유지했습니다.
  doctrine_reference: 본문 비평 및 지혜문학 해석 원칙
- issue: 그리스어 병행문의 불일치
  chosen_reading: 본문 번역은 히브리어를 주된 증거로 따르고, 그리스어 병행문은 다른 절에 해당하는 것으로 보아 본문에는 반영하지 않았습니다.
  alternative_readings:
  - 그리스어 문구를 절의 의미로 조정해 반영
  - 그리스어를 본문 기준으로 채택
  rationale: 제공된 자료가 그리스어 병행문의 절 번호 불일치를 명시하므로, 히브리어 본문을 우선하고 그리스어는 대조 증거로만 취급했습니다.
  doctrine_reference: 본문 비평과 사본 증거 우선 원칙
