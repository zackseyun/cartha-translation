translation:
  language: ko
  text: 내 아들아, 들으십시오. 나를 업신여기지 마십시오. 마침내 내 말을 깨닫게 될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 병행본은 이 절에서 전혀 다른 말을 전합니다. “시체와 접촉한 뒤 몸을 씻은 사람이 다시 그것을 만지면, 그 씻음이 그에게 무슨 유익이 있겠느냐?” 이는 절의 배치나 본문 전승에 중대한 불일치가 있음을 보여 줍니다. 본문은 현존 히브리어 증거를 따릅니다.
    reason: textual_variant
lexical_decisions:
- source_word: שמע
  english_pob_choice: Listen
  chosen_korean: 귀를 기울이고
  alternatives_korean:
  - 들으십시오
  - 들으세요
  lexicon: HALOT
  rationale: 청중의 주의를 요구하는 명령으로서 단순 청취보다 적극적 경청을 드러내는 표현이 더 자연스럽고, POB의 'Listen'도 그 뉘앙스를 반영합니다.
- source_word: בני
  english_pob_choice: my son
  chosen_korean: 내 말에 귀를 기울이고, 나를
  alternatives_korean:
  - 내 아들아
  - 내 아들
  lexicon: HALOT
  rationale: 지혜훈계의 호칭이지만 한국어에서는 직설적 호칭을 반복하기보다 문장 흐름을 살려 자연스럽게 처리했습니다. 'my son'의 친밀한 권면 관계는 뒤의 1인칭 직접호칭으로 유지됩니다.
- source_word: תבוז
  english_pob_choice: despise
  chosen_korean: 업신여기지 마십시오
  alternatives_korean:
  - 멸시하지 마십시오
  - 경멸하지 마십시오
  lexicon: HALOT
  rationale: בזה의 핵심은 경멸과 무시입니다. 한국어에서는 훈계의 강도를 살리면서도 현대 독자에게 자연스러운 '업신여기다'가 가장 직접적입니다.
- source_word: ובאחרית תשיג
  english_pob_choice: in the end you will grasp
  chosen_korean: 끝에 가서야 ... 이해하게 될 것입니다
  alternatives_korean:
  - 마침내 ... 붙잡게 될 것입니다
  - 나중에 ... 알게 될 것입니다
  lexicon: HALOT
  rationale: תשיג는 문자적으로 '도달하다/붙잡다'의 뜻이 있지만, כאן에서는 앞의 '내 말'과 결합해 의미를 깨닫는 결과를 가리키므로 한국어로는 '이해하다'가 가장 자연스럽습니다. '끝에 가서야'는 결과의 지연을 잘 드러냅니다.
- source_word: אמרי
  english_pob_choice: my words
  chosen_korean: 내 말
  alternatives_korean:
  - 내 말들
  - 내 말씀이
  lexicon: HALOT
  rationale: 히브리어의 복수형이라도 한국어에서는 훈계의 내용 전체를 가리키는 집합적 단수 '내 말'이 가장 자연스럽습니다. '말씀'은 어휘적으로 지나치게 높아질 수 있어 피했습니다.
theological_decisions:
- issue: Sirach의 히브리어 본문과 병행 그리스어 전승의 심한 불일치
  chosen_reading: 주 본문은 현존 히브리어 증거를 따르고, 그리스어는 별도의 전승 차이로만 취급합니다.
  alternative_readings:
  - '그리스어 병행문의 내용: ''죽은 몸에서 씻은 사람이 다시 그것을 만지면, 그의 씻음이 무슨 유익이 있겠느냐?'''
  rationale: 시락서에서는 히브리어가 보존된 경우 그 본문을 우선하는 것이 프로젝트 원칙입니다. 이 절의 그리스어는 단순한 이형이 아니라 완전히 다른 문장으로 보이므로, 본문에 섞지 않고 주석적 차원에서만 보존해야 합니다.
  doctrine_reference: 'PHILOSOPHY.md: translate from Hebrew where Sirach survives; preserve source uncertainty honestly'
