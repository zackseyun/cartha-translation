base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/031/010.yaml
  text: Who is this[a], He has been tested in these things and has become complete; and it will be for him a ground for boasting.
  footnotes:
  - marker: a
    text: 'The Hebrew witness here is difficult and does not align cleanly with the Greek. A more literal Hebrew reading would be: ''Who is this that clung to it and had peace, and it became glory for him?'''
    reason: alternative_reading
  - marker: b
    text: 'The Greek parallel is quite different and may reflect another textual form; taken more literally, it reads along the lines of: ''Who has not been tested in a little knows little.'''
    reason: textual_variant
translation:
  language: ko
  text: 이 사람은 누구입니까?[a] 그는 이런 일들 가운데서 시험을 받아 온전해졌고, 그것은 그에게 자랑거리가 될 것입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 증인은 이 구절에서 난해하며 그리스어와도 깔끔하게 일치하지 않습니다. 더 문자적으로 읽으면, ‘이것에 붙어 있어 평안을 누렸고, 그것이 그에게 영광이 된 이 사람은 누구인가?’ 정도입니다.
    reason: alternative_reading
  - marker: b
    text: 그리스어 평행본문은 상당히 다릅니다. 더 문자적으로는 ‘시험을 받아 본 적이 없는 사람은 아는 것이 적습니다’ 정도로 읽힙니다.
    reason: textual_variant
lexical_decisions:
- source_word: מי הוא זה
  english_pob_choice: Who is this?
  chosen_korean: 누가 이것입니까?
  alternatives_korean:
  - 그는 누구입니까?
  - 누가 이런 사람입니까?
  lexicon: HALOT
  rationale: 히브리어의 수사적 질문을 한국어의 직접적인 확인 질문으로 옮겨 문장의 도입부가 지닌 호소력을 살렸습니다.
- source_word: נִדְבַּק בו / שנדבק בו
  english_pob_choice: has been tested in these things
  chosen_korean: 이것들 가운데서 시험을 받아
  alternatives_korean:
  - 그것에 매달려
  - 그것에 붙어
  - 그 가운데서 검증을 받아
  lexicon: HALOT / BDAG
  rationale: 히브리어 표면형은 난해하지만, 본문 맥락과 그리스어 평행본문의 시험/증명 의미를 따라 ‘시험을 받아’로 옮겼습니다.
- source_word: והיה לו שלום
  english_pob_choice: has become complete
  chosen_korean: 온전해졌고
  alternatives_korean:
  - 평안을 얻었고
  - 무사하였고
  - 평강이 있었고
  lexicon: HALOT
  rationale: 히브리어의 ‘평화/평안’ 표현을 결과 상태로 이해해, 시험을 거친 뒤의 완결성과 무흠함을 드러내는 ‘온전해졌고’로 옮겼습니다.
- source_word: והיה לו תפארה
  english_pob_choice: it will be for him a ground for boasting
  chosen_korean: 그것은 그에게 자랑거리가 될 것입니다
  alternatives_korean:
  - 그것은 그에게 영광이 될 것입니다
  - 그것은 그에게 명예가 될 것입니다
  - 그것은 그에게 칭송거리가 될 것입니다
  lexicon: HALOT
  rationale: תפארה의 핵심 의미인 영광/화려함을 살리면서, 문맥상 시험의 결과가 사람에게 돌아오는 긍정적 평가라는 점을 한국어 관용으로 자연스럽게 나타냈습니다.
theological_decisions:
- issue: 히브리어 난본문과 그리스어 평행본문의 긴장 처리
  chosen_reading: 본문의 수사적 질문과 결과 언어는 히브리어를 따르고, ‘시험을 받아’라는 핵심 개념은 그리스어 평행본문의 의미를 반영하는 절충 번역으로 처리했습니다.
  alternative_readings:
  - ‘누가 이것입니까? 그가 그것에 매달려 평안하였고, 그것이 그에게 영광이 되었습니다.’
  - ‘누가 이것입니까? 그는 조금도 시험받지 않은 자는 조금밖에 알지 못합니다.’
  rationale: 이 절은 자료상 major_mismatch로 표시되어 있어, 어느 한 본문만을 기계적으로 따르기보다 두 전승의 핵심 의미를 투명하게 반영하는 것이 필요합니다. 시험/증명과 영광이라는 지혜문학적 주제를 보존하면서도, 본문 불일치의 긴장을 지우지 않도록 했습니다.
  doctrine_reference: Deuterocanon translation policy; source note marked major_mismatch and Greek parallel as actual translation input
- issue: ‘자랑’과 ‘영광’의 어휘 선택
  chosen_reading: 결과절은 ‘자랑거리가 될 것입니다’로 번역해, 시험을 통과한 뒤 드러나는 공적 평가의 뉘앙스를 살렸습니다.
  alternative_readings:
  - ‘영광이 될 것입니다’
  - ‘명예가 될 것입니다’
  rationale: 영어 POB가 ‘ground for boasting’로 정리한 결과적 의미를 한국어에서 자연스럽게 드러내기 위해, 단순한 추상명사보다 ‘자랑거리’ 표현이 문맥에 더 잘 맞습니다.
  doctrine_reference: Wisdom literature rhetorical idiom; lexical choice aligned with audited English POB
