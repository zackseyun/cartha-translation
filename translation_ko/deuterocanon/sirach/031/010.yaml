  source_fidelity: 현 초안은 영어 POB의 절충 본문(시험·온전함·자랑거리)을 대체로 반영하지만, 첫 문장 ‘누가 이것입니까?’는 사람을 가리키는 히브리어 מי הוא זה 및 영어의 수사적 ‘Who is this?’를 한국어에서 사물 ‘이것’으로 오해하게 합니다. 또한 각주 b의 ‘조금도 시험받지 않은’은 그리스어 ὀλίγα를 ‘전혀’라는 부정 강조로 바꾸므로 적절하지 않습니다.
  naturalness: ‘이 사람은 누구입니까?’가 문맥상 사람을 묻는 수사적 질문을 자연스럽게 나타냅니다. ‘이런 일들 가운데서’는 영어 POB의 ‘in these things’를 어색하지 않게 옮긴 표현입니다.
  terminology: ‘시험을 받아’, ‘온전해졌고’, ‘자랑거리가 될 것입니다’는 현 영어 POB의 선택을 자연스럽고 현대적인 합쇼체 한국어로 반영합니다. 히브리어의 תפארה와 관련하여 ‘자랑거리’는 영어 audit trail의 ‘ground for boasting’를 따르는 절충 선택임을 각주가 보완합니다.
