base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/031/024.yaml
  text: Pain and sleepless wandering[a], and retching and choking[c][b], and a turned face with a foolish man.
  footnotes:
  - marker: a
    text: The Hebrew text of this line is difficult, especially the middle symptoms and the phrase 'a turned face.' The Greek parallel for this verse is entirely different, indicating a major textual divergence in the tradition.
    reason: textual_variant
  - marker: b
    text: Or 'restless sleep,' 'wakeful tossing.'
    reason: lexical_alternative
  - marker: c
    text: Or 'an averted face' or 'a distorted expression.'
    reason: lexical_alternative
translation:
  language: ko
  text: 고통과 잠 못 이루는 방황, 그리고 구역질과 질식, 그리고 어리석은 사람과 함께하는 일그러진 얼굴입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 특히 가운데 증상들과 ‘일그러진/돌아간 얼굴’이라는 표현이 난해합니다. 이 절의 그리스어 평행본문은 전혀 다른 내용이어서, 전승 사이에 큰 본문 차이가 있습니다.
    reason: textual_variant
  - marker: b
    text: 또는 ‘불면의 뒤척임’, ‘깨어 있는 방황’입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘외면한 얼굴’, ‘뒤틀린 표정’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מכאוב
  english_pob_choice: pain
  chosen_korean: 고통
  alternatives_korean:
  - 통증
  - 아픔
  lexicon: HALOT
  rationale: 신체적 고통과 불편을 가리키는 말로, 문맥의 연속적인 증상 목록에 가장 자연스럽습니다.
- source_word: ונדד ישנה
  english_pob_choice: sleepless wandering
  chosen_korean: 잠 못 이루는 방황
  alternatives_korean:
  - 불면의 뒤척임
  - 잠이 달아나는 방황
  - 깨어 있는 방황
  lexicon: HALOT
  rationale: נדד와 שנה의 결합이 잠이 달아나고 뒤척이는 상태를 가리키므로, ‘잠 못 이루는’으로 수면의 상실을 살리고 ‘방황’으로 움직임의 이미지를 유지했습니다.
- source_word: ומער
  english_pob_choice: retching
  chosen_korean: 구역질
  alternatives_korean:
  - 토악질
  - 메스꺼움
  lexicon: HALOT
  rationale: 어근이 위장 경련과 토해내려는 동작을 시사하므로, 실제 구토보다 덜 단정적인 ‘구역질’이 가장 무난합니다.
- source_word: ותשניק
  english_pob_choice: choking
  chosen_korean: 질식
  alternatives_korean:
  - 숨막힘
  - 목이 막힘
  lexicon: HALOT
  rationale: 숨이 막히는 신체 반응을 직접적으로 옮기되, 증상 목록의 압박감을 살리기 위해 ‘질식’으로 옮겼습니다.
- source_word: ופני הפוכות
  english_pob_choice: a turned face
  chosen_korean: 일그러진 얼굴
  alternatives_korean:
  - 돌아선 얼굴
  - 외면한 얼굴
  - 뒤틀린 얼굴
  lexicon: HALOT
  rationale: 문자적으로는 ‘뒤집힌/돌아간 얼굴’이지만, 한국어에서는 그 비유가 자연스럽지 않아 얼굴의 변형된 상태를 드러내는 ‘일그러진 얼굴’로 옮겼습니다.
- source_word: עם איש כסיל
  english_pob_choice: with a foolish man
  chosen_korean: 어리석은 사람과 함께하는
  alternatives_korean:
  - 어리석은 사람과 함께 있는
  - 바보와 함께하는
  lexicon: HALOT
  rationale: כְּסִיל의 지혜문학적 용례를 따라 ‘어리석은 사람’으로 옮기고, 함께 있음의 관계를 드러내기 위해 부사적 구성을 사용했습니다.
theological_decisions:
- issue: 히브리어 본문의 난해한 증상 목록을 얼마나 직역할지
  chosen_reading: 본문의 비유적·신체적 이미지를 보존하되, 한국어에서 이해 가능한 질병/고통의 연쇄로 옮겼습니다.
  alternative_readings:
  - 보다 평이하게 풀어쓴 의역
  - 구토/메스꺼움 등으로 증상을 단정하는 번역
  rationale: 이 구절은 전통 사이의 차이와 어휘 난점이 크므로, 너무 풀어 쓰면 본문의 거친 체감과 모호성이 사라지고, 너무 단정하면 원문의 불확실성을 지우게 됩니다.
  doctrine_reference: '번역 원칙: 원문 불확실성 보존'
