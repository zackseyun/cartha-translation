  text: For because of every matter the eye trembles[a], and from the face tears will flow.
  footnotes:
  - marker: a
    text: 'The surviving Hebrew here differs sharply from the Greek tradition, which reads: ''The one who fears the Lord will certainly not be timid, and will certainly not be cowardly, because he himself is his hope.'' The main text follows the extant Hebrew witness.'
    reason: textual_variant
translation:
  language: ko
  text: 이는 모든 일 때문에 눈이 떨리고, 얼굴에서 눈물이 흐르기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 현존 히브리어 본문은 그리스어 전통과 크게 다릅니다. 그리스어는 “주님을 두려워하는 사람은 결코 두려워하지도 않고 겁내지도 않을 것입니다. 그분 자신이 그의 소망이기 때문입니다”라고 읽습니다.
    reason: textual_variant
lexical_decisions:
- source_word: כי
  english_pob_choice: For because
  chosen_korean: 이는 … 때문입니다
  alternatives_korean:
  - 왜냐하면 …
  - …입니다
  lexicon: HALOT
  rationale: 원문의 כי가 설명적·인과적으로 시작하므로, 한국어에서는 ‘이는 … 때문입니다’로 원인 설명을 자연스럽게 살렸습니다.
- source_word: מפני כל דבר
  english_pob_choice: because of every matter
  chosen_korean: 모든 일 앞에서
  alternatives_korean:
  - 모든 일 때문에
  - 모든 사정 앞에서
  - 모든 일로 인해
  lexicon: HALOT
  rationale: מפני와 כל דבר의 폭넓은 의미를 고려해, 단순한 원인뿐 아니라 ‘어떤 일 앞에서도’라는 압박감의 뉘앙스를 살리는 표현을 택했습니다.
- source_word: תזוע עין
  english_pob_choice: the eye trembles
  chosen_korean: 눈이 떱니다
  alternatives_korean:
  - 눈이 떨립니다
  - 눈이 흔들립니다
  - 눈이 동요합니다
  lexicon: HALOT
  rationale: זוע의 ‘흔들리다/떨리다’라는 감각적 의미를 한국어의 자연스러운 동사로 옮겼습니다.
- source_word: ומפנים דמעה תדמע
  english_pob_choice: and from the face tears will flow
  chosen_korean: 얼굴에서 눈물이 흘러나옵니다
  alternatives_korean:
  - 얼굴에서 눈물이 흐릅니다
  - 얼굴로부터 눈물이 흘러납니다
  - 얼굴에서 눈물이 떨어집니다
  lexicon: HALOT
  rationale: פָּנִים의 직역인 ‘얼굴’을 유지하면서, דמעה תדמע의 반복 강조를 ‘흘러나오다’로 읽어 눈물의 분출 이미지를 살렸습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행본문의 큰 차이
  chosen_reading: 본문은 현존 히브리어를 따라 번역하고, 그리스어 전통의 다른 읽기는 각주로만 알립니다.
  alternative_readings:
  - 그리스어처럼 ‘주를 두려워하는 자는 결코 두려워하지 않는다’로 의역
  rationale: 이 절은 히브리어와 그리스어가 실질적으로 다른 문장을 전하므로, 본문을 조화시키지 않고 히브리어 증거를 우선하는 것이 사료에 충실합니다.
  doctrine_reference: 'Sirach 번역 원칙: 현존 히브리어 우선, 큰 본문 차이는 각주로 공개'
