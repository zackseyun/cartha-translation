  naturalness: ‘이는 … 때문입니다’라는 합쇼체의 문장 틀은 자연스럽습니다. ‘모든 일 때문에’가 ‘모든 일 앞에서’보다 현대 한국어에서 명료하며, 본문의 인과 관계를 더 정확하게 드러냅니다.
  terminology: 각주의 그리스어 εὐλαβηθήσεται를 ‘조심하다’로 옮긴 것은 문맥상 부정확합니다. 여기서는 ‘두려워하다’ 또는 ‘겁내다’의 뜻이며, 이어지는 δειλιάσῃ와 함께 ‘두려워하지도 않고 겁내지도’로 옮길 수 있습니다. κύριον은 각주에서 ‘주님’으로 표기합니다.
