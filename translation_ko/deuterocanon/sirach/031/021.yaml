translation:
  language: ko
  text: 좋은 예절을 위해 먼저 멈추십시오[a]. 그리고 탐식하는 사람이 되지 마십시오[b]. 그렇지 않으면 사람들이 당신을 경멸할 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 מוסר는 보통 ‘훈련’이나 ‘징계’ 뜻이지만, 식사 자리의 문맥에서는 ‘예절’ 또는 ‘품위’의 뜻으로 이해하는 편이 자연스럽습니다.
    reason: lexical_alternative
  - marker: b
    text: 이 절의 히브리어는 주어진 자료에서 본문상 일치 문제가 표시되어 있으며, 그리스어 평행본문도 이 줄과 맞지 않습니다. 번역은 히브리어 증언을 우선하되 불일치를 주석으로 남깁니다.
    reason: textual_variant
