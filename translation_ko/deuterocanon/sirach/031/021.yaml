translation:
  language: ko
  text: 예절을 지키기 위해 남보다 먼저 그만두십시오[a]. 탐식하는 사람이 되지 마십시오[b]. 그렇지 않으면 미움을 받게 될 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 מוסר는 보통 ‘훈련’이나 ‘징계’를 뜻하지만, 식사 자리의 문맥에서는 ‘예절’ 또는 ‘품위’의 뜻으로 이해하는 편이 자연스럽습니다.
    reason: lexical_alternative
  - marker: b
    text: 이 절의 히브리어 본문은 현존하지만, 주어진 자료에는 본문상 불일치 문제가 표시되어 있으며, 제시된 그리스어 평행본문도 이 히브리어 구절과 일치하지 않습니다. 따라서 번역은 히브리어 증언을 우선하되 이 불일치를 주석으로 남깁니다.
    reason: textual_variant
