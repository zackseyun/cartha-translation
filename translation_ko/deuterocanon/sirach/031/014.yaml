translation:
  language: ko
  text: “그 사람에게는 충분하다”라고 말하지 마십시오. 기억하십시오. 악한 눈은 악합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구 ‘악한 눈’은 흔히 인색함, 아낌, 시기 어린 태도를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 제공된 그리스어 병행본은 이 절의 히브리어 문구와 일치하지 않으며, 다른 절 배치나 전승을 반영한 것으로 보입니다.
    reason: textual_variant
lexical_decisions:
- source_word: אל תאמר
  english_pob_choice: Do not say
  chosen_korean: “...라고 말하지 마십시오”
  alternatives_korean:
  - “...라고 생각하지 마십시오”
  - “...라고 자기 자신에게 말하지 마십시오”
  lexicon: HALOT
  rationale: אמר의 직접적인 부정 명령을 한국어의 자연스러운 금지 표현으로 옮겼습니다. 본문이 경구적 경고이므로 ‘생각하다’보다 ‘말하다’가 원문 명령성을 더 분명히 드러냅니다.
- source_word: ספוק
  english_pob_choice: It is enough
  chosen_korean: “충분하다”
  alternatives_korean:
  - “넉넉하다”
  - “족하다”
  - “이미 충분하다”
  lexicon: HALOT
  rationale: ספוק은 충분함·충당됨의 뜻이므로, 영어의 “It is enough”에 맞게 한국어에서도 간결한 진술형으로 살렸습니다. 여기서는 누군가에게 베풀지 않으려는 계산적 태도를 드러내는 말로 읽히므로, 과도한 의역 없이 ‘충분하다’가 가장 직접적입니다.
- source_word: עליו
  english_pob_choice: for him
  chosen_korean: “그 사람에게”
  alternatives_korean:
  - “그에게”
  - “그를 위해”
  lexicon: HALOT
  rationale: 인칭 대명사의 지시 대상을 한국어에서는 상황상 더 분명한 ‘그 사람’으로 풀어, 식탁에서의 대상 인물을 자연스럽게 드러냈습니다. 단순히 ‘그에게’로 두면 경구의 대상이 흐려질 수 있어 약간만 구체화했습니다.
- source_word: רעה עין רעה
  english_pob_choice: an evil eye is evil
  chosen_korean: “악한 눈은 악합니다”
  alternatives_korean:
  - “탐욕스러운 눈은 나쁩니다”
  - “악한 눈은 나쁩니다”
  - “인색한 눈은 악합니다”
  lexicon: HALOT
  rationale: 반복어법을 살려 ‘악한 눈’이라는 관용구를 본문에 유지했습니다. 전통적 해석인 인색함/질투의 의미는 주석으로 열어 두되, 본문은 원문의 날카로운 압축성을 보존했습니다.
theological_decisions:
- issue: ‘악한 눈’ 관용구의 본문 처리
  chosen_reading: 본문에는 ‘악한 눈’을 그대로 두고, 해석적 의미는 주석으로 설명하는 방향을 택했습니다.
  alternative_readings:
  - ‘인색한 태도’로 풀어 번역하기
  - ‘질투하는 마음’으로 풀어 번역하기
  rationale: 히브리어의 비유적 표현을 본문에서 평탄화하면 원문의 경구적 힘과 문학성이 약해집니다. 따라서 소스에 충실하게 관용구를 유지하고, 독자가 오해하지 않도록 의미 영역은 주석에서 보충하는 것이 적절합니다.
  doctrine_reference: '번역 원칙: 원문 투명성 및 관용구 보존'
- issue: 히브리어 본문 우선과 그리스어 병행본 차이
  chosen_reading: 남아 있는 히브리어 본문을 기준으로 번역하고, 제공된 그리스어 병행본은 본문과 다른 전승임을 반영하지 않습니다.
  alternative_readings:
  - 그리스어 병행본을 따라 ‘야훼를 경외하는 이들의 영은 살 것이다’로 옮기기
  - 두 전승을 절충해 본문에 병기하기
  rationale: 이 절의 제공된 그리스어 병행본은 히브리어 문구와 내용이 상당히 달라, 본문 번역의 기준으로 삼기 어렵습니다. 프로젝트 원칙상 현존 히브리어를 우선하되, 본문 불일치 사실은 별도 각주나 기록에서 투명하게 다루는 것이 옳습니다.
  doctrine_reference: '번역 원칙: 현존 히브리어 우선, 전승 차이의 투명한 기록'
