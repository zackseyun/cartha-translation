translation:
  language: ko
  text: 가난한 사람은 힘이 다할 때까지 수고하지만, 쉬면 여전히 궁핍합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עני / poor man
  english_pob_choice: A poor man
  chosen_korean: 가난한 사람
  alternatives_korean:
  - 가난한 자
  - 빈궁한 사람
  - 빈곤한 사람
  lexicon: 가난한
  rationale: 히브리어 עני는 단순히 소득이 적은 사람보다 생활이 궁핍한 사람을 가리키므로, 자연스럽고 현대적인 표준어로 ‘가난한 사람’이 가장 직접적입니다.
- source_word: יגע / labors
  english_pob_choice: labors
  chosen_korean: 수고합니다
  alternatives_korean:
  - 일합니다
  - 애씁니다
  - 노동합니다
  lexicon: 수고하다
  rationale: 본문의 동사는 생계를 위한 고된 노동의 지속을 나타내므로, 일상적인 ‘일합니다’보다 노동의 고됨이 드러나는 ‘수고합니다’가 더 가깝습니다.
- source_word: לחסר כחו / until his strength is spent
  english_pob_choice: until his strength is spent
  chosen_korean: 힘이 다할 때까지
  alternatives_korean:
  - 힘이 소진될 때까지
  - 힘이 없어질 때까지
  - 기력이 다할 때까지
  lexicon: 힘이 다하다
  rationale: 원문의 ‘힘이 부족해지다/다해 버리다’는 상태를 간결하게 살려, 반복적 수고의 한계를 자연스럽게 표현했습니다.
- source_word: אם ינוח יהיה צריך / if he rests, he is still in need
  english_pob_choice: if he rests, he is still in need
  chosen_korean: 쉬면 여전히 궁핍합니다
  alternatives_korean:
  - 쉬어도 여전히 필요합니다
  - 쉬어도 아직 필요합니다
  - 쉬면 아직도 부족합니다
  lexicon: 궁핍하다
  rationale: 여기서 ‘need’는 단순한 필요보다 생계의 결핍을 뜻하므로, 문맥상 더 강한 ‘궁핍합니다’로 옮겨 빈곤의 지속성을 드러냈습니다.
