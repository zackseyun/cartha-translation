base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/031/026.yaml
  text: Years of life are with a discerning man[a]; he will lie down until morning[b], and his life is with him.
  footnotes:
  - marker: a
    text: Hebrew reads 'and his life is with him'; alternatively, 'and his soul is with him.' The Hebrew נפש can mean life, self, or soul depending on context.
    reason: lexical_alternative
  - marker: b
    text: The Greek parallel cited here differs sharply from the Hebrew, reading approximately, 'He who takes away a neighbor's livelihood is killing him.' This appears to reflect a different textual form, so the main translation follows the extant Hebrew witness.
    reason: textual_variant
translation:
  language: ko
  text: 분별 있는 사람에게는 생명의 세월이 있습니다. 그는 아침까지 묵고, 그의 생명[a]은 그와 함께 있습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 נפש는 문맥에 따라 ‘생명’, ‘자기’, ‘영혼’을 뜻할 수 있습니다. 여기서는 생존과 보전의 의미가 더 자연스럽습니다.
    reason: lexical_alternative
  - marker: b
    text: 이 구절의 그리스어 병행본문은 히브리어와 크게 달라, 대략 ‘이웃의 생계를 빼앗는 자는 이웃을 죽이는 자입니다’라고 읽힙니다. 본문은 현존 히브리어를 따랐습니다.
    reason: textual_variant
lexical_decisions:
- source_word: שנות חיים
  english_pob_choice: Years of life
  chosen_korean: 삶의 여러 해
  alternatives_korean:
  - 생명의 세월
  - 생애의 해들
  - 오래 사는 날들
  lexicon: HALOT
  rationale: 히브리어 관용구의 수명/생애 뉘앙스를 살리면서, ‘Years of life’를 지나치게 직역하지 않고 자연스러운 현대 한국어로 옮겼습니다.
- source_word: איש נבון
  english_pob_choice: a discerning man
  chosen_korean: 지혜로운 사람
  alternatives_korean:
  - 분별 있는 사람
  - 통찰력 있는 사람
  - 이해력 있는 사람
  lexicon: HALOT
  rationale: נבון의 핵심은 일반적 지식보다 분별과 이해에 있으나, 한국어에서는 ‘지혜로운 사람’이 문맥상 자연스럽고 과도한 철학적 분화를 피합니다.
- source_word: ילין עד בקר
  english_pob_choice: he will lodge until morning
  chosen_korean: 아침까지 누워도
  alternatives_korean:
  - 아침까지 묵어도
  - 아침까지 머물러도
  - 새벽까지 밤을 새워도
  lexicon: HALOT
  rationale: לון/לין의 ‘밤을 지내다’ 의미를 살리되, 현대 한국어에서 굳은 표현을 피하고 잠자리의 지속을 자연스럽게 드러냈습니다.
- source_word: ונפשו עמו
  english_pob_choice: and his life is with him
  chosen_korean: 그의 생명이 그와 함께 있습니다
  alternatives_korean:
  - 그의 혼이 그와 함께 있습니다
  - 그의 목숨이 그와 함께 있습니다
  - 그의 생명이 그에게 있습니다
  lexicon: HALOT
  rationale: נפש의 다의성은 그대로 두되, 여기서는 ‘생명/목숨’이 가장 문맥에 맞습니다. ‘혼/영혼’으로 옮기면 이 구절의 생존·보전 의미를 지나치게 신학화할 수 있습니다.
theological_decisions:
- issue: נפש의 번역 범위
  chosen_reading: ‘영혼’보다 ‘생명’으로 옮겨, 지속되는 삶과 보전된 자기의 의미를 살렸습니다.
  alternative_readings:
  - 그의 영혼이 그와 함께 있습니다
  - 그의 혼이 그와 함께 있습니다
  rationale: 문맥이 밤을 지내는 안전과 생존을 말하므로, נפש를 교리적 ‘영혼’으로 고정하지 않고 폭넓은 인간 생명 개념으로 유지하는 것이 원문에 더 가깝습니다.
  doctrine_reference: 'DOCTRINE.md: 문맥이 허락하는 의미 범위를 보존하고, 신학적 개념을 과도하게 투사하지 말 것.'
- issue: 히브리어 본문과 그리스어 병행본문의 차이
  chosen_reading: 본문은 현존 히브리어를 따르고, 그리스어의 급격히 다른 내용은 본문에 반영하지 않았습니다.
  alternative_readings:
  - 그리스어 병행본문을 따라 ‘이웃의 생계를 빼앗는 자는 그를 죽이는 것이다’로 옮기기
  rationale: 사역 정책상 시라흐는 히브리어가 남아 있으면 그것을 우선하며, 그리스어는 대조 증거로만 사용합니다. 여기서는 두 전승이 내용상 크게 다르므로 히브리어를 본문으로 채택합니다.
  doctrine_reference: 'PHILOSOPHY.md: 존속하는 히브리어 본문 우선, 그리스어는 대조 증거로 유지.'
