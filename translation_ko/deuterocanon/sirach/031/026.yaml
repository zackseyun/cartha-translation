  naturalness: 초안은 ‘지혜로운 사람과 함께하는 삶의 여러 해는, 그는’이 문법적으로 연결되지 않고 의미 관계도 불명확합니다. 두 문장으로 나누고 ‘분별 있는 사람에게는 생명의 세월이 있습니다’로 고쳐 현대 한국어 합쇼체로 자연스럽게 만들었습니다.
