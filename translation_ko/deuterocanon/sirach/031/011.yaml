    rationale: 반복은 자연스럽지만 סור의 ‘돌아서다/벗어나다’라는 비유적 어휘를 지웁니다. 본문에는 ‘그릇된 길로 돌아서다’를 사용하고, 대안 독법은 각주에 보존하는 편이 좋습니다.
