base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/031/011.yaml
  text: Who was tested by it and was found complete? Let it be for him a boast[a]. Who was able to transgress and did not transgress[b], and to do evil and did not desire it?
  footnotes:
  - marker: a
    text: The Hebrew of the first line is textually difficult. The transmitted wording can also be understood more literally as 'Who blessed him, and he was complete in his life,' but the context and parallel tradition support the sense of being tested and found sound.
    reason: textual_variant
  - marker: b
    text: Or 'Who was able to turn aside and did not turn aside, and to do harm and did not consent?'
    reason: lexical_alternative
translation:
  language: ko
  text: 그것으로 시험을 받아 완전한 사람이 누구입니까? 그는 자랑거리가 될 것입니다[a]. 잘못할 수 있으면서도 잘못하지 않았고[b], 악을 행할 수 있으면서도 그것을 바라지 않은 사람은 누구입니까?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 첫 줄은 본문상 난해합니다. 더 문자적으로는 '그를 복 주었고 그는 그의 생애에 완전하였다'로도 읽을 수 있지만, 문맥과 병행 전승은 시험을 받아 온전함이 입증된 뜻을 지지합니다.
    reason: textual_variant
  - marker: b
    text: 또는 '돌아설 수 있었으나 돌아서지 않았고, 해를 끼칠 수 있었으나 동의하지 않았다'로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מי
  english_pob_choice: Who
  chosen_korean: 누구입니까?
  alternatives_korean:
  - 누가입니까?
  - 누구겠습니까?
  lexicon: HALOT
  rationale: 수사적 질문 구조를 그대로 살리기 위해 평서형으로 풀지 않고 표준적 의문문으로 옮겼습니다.
- source_word: ברכו
  english_pob_choice: was tested by it
  chosen_korean: 그것으로 시험을 받아
  alternatives_korean:
  - 그것으로 검증을 받아
  - 그것으로 단련되어
  - 그에게 복을 받아
  lexicon: HALOT
  rationale: 히브리어 본문은 난해하지만 문맥상 재산/시험의 맥락에서 '복을 받다'보다 '시험을 받다'가 더 적절하므로, POB의 해석을 따라 시험의 의미를 드러냈습니다.
- source_word: וישלם בחייו
  english_pob_choice: and was found complete
  chosen_korean: 완전한 사람이
  alternatives_korean:
  - 그의 생애에 온전한 사람이
  - 그의 삶에서 흠이 없는 사람이
  - 생애 동안 완전하게 된 사람
  lexicon: HALOT
  rationale: שלם의 핵심은 평안보다 '온전함/완전함'이므로, 도덕적·인격적 온전함을 간결하게 표현했습니다.
- source_word: הוא לך לתפארת
  english_pob_choice: Let it be for him a boast
  chosen_korean: 그는 자랑거리가 될 것입니다
  alternatives_korean:
  - 그것은 그에게 영광이 될 것입니다
  - 그는 당신의 영예가 될 것입니다
  - 그에게 칭찬거리가 될 것입니다
  lexicon: HALOT
  rationale: 원문은 대명사와 구문이 불안정하지만, 문맥상 시험을 견딘 사람을 칭찬하는 뜻이므로 '자랑거리'로 공적 칭송의 힘을 살렸습니다.
- source_word: ולא אבה
  english_pob_choice: and did not desire it
  chosen_korean: 그것을 바라지 않은
  alternatives_korean:
  - 그것을 원하지 않은
  - 그것에 동의하지 않은
  - 그것을 마다한
  lexicon: HALOT
  rationale: אבה는 단순한 의지보다 내적 승인/바람을 뜻할 수 있어, 죄를 향한 내적 욕구가 없었다는 뉘앙스를 살렸습니다.
theological_decisions:
- issue: 히브리어 난구절을 어떻게 반영할지
  chosen_reading: 히브리어 현전 본문을 우선하되, 문맥상 시험과 온전함의 의미로 자연스럽게 읽히도록 번역했습니다.
  alternative_readings:
  - '''그에게 복이 있었다''에 가깝게 옮김'
  - 그리스어 병행본문을 더 강하게 따라 재구성
  rationale: 이 절은 본문 상태가 불안정하므로, 확정적 재구성보다 POB의 해석을 따라 의미를 드러내되 불확실성을 과잉 숨기지 않는 방식이 적절합니다.
  doctrine_reference: 'PHILOSOPHY.md: 히브리어가 남아 있는 곳에서는 히브리어를 우선하고, 난해한 경우 병행 전승을 참고하되 불확실성을 정직하게 보존한다.'
