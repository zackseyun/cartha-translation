  text: The sleeplessness of a rich man wastes away his flesh[a], and anxiety about livelihood drives away sleep.
  footnotes:
  - marker: a
    text: The Hebrew of the opening clause is difficult. The Greek parallel reads, 'Empty and false hopes are for an unintelligent man, and dreams give wings to fools.' The main text follows the extant Hebrew witness while acknowledging that the verse's transmission is unstable at this point.
    reason: textual_variant
translation:
  language: ko
  text: 부유한 사람이 잠을 이루지 못하면 그의 살이 쇠하게 하며[a], 생계에 대한 걱정은 잠을 쫓아냅니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 절 첫 구절의 히브리어는 난해합니다. 그리스어 평행문은 ‘분별없는 사람에게는 헛되고 거짓된 희망이 있으며, 꿈은 어리석은 자들에게 날개를 달아 준다’라고 읽습니다. 본문은 현존하는 히브리어 전승을 따르면서, 이 지점에서 이 절의 전승이 불안정함을 밝힙니다.
    reason: textual_variant
lexical_decisions:
- source_word: שקר
  english_pob_choice: sleeplessness
  chosen_korean: 잠 못 이룸
  alternatives_korean:
  - 불면
  - 잠 못 잠
  - 불면증
  lexicon: BDB / HALOT
  rationale: 히브리어 שקר는 이 본문 전승에서 난해하지만, 바로 뒤의 ‘잠’과 평행을 이루는 상태를 가리키므로 ‘잠 못 이룸’으로 옮겨 수면의 부재를 자연스럽게 드러냈습니다.
- source_word: עשיר
  english_pob_choice: a rich man
  chosen_korean: 부유한 사람
  alternatives_korean:
  - 부자
  - 부유한 이
  - 재물 많은 사람
  lexicon: HALOT
  rationale: 특정 유형의 단수 인물을 가리키므로 일반적이고 현대적인 ‘부유한 사람’을 택해, 성별을 과도하게 강조하지 않으면서도 인격적 주어를 살렸습니다.
- source_word: ימחה שארו
  english_pob_choice: wears away his flesh
  chosen_korean: 그의 살을 쇠하게 하고
  alternatives_korean:
  - 그의 살을 닳게 하고
  - 그의 몸을 소모하고
  - 그의 살을 없애고
  lexicon: HALOT
  rationale: 직역적 어색함을 피하면서도 육체가 서서히 약해지는 이미지를 보존하기 위해 ‘쇠하게 하다’를 사용했습니다. ‘살’은 본문이 말하는 육체적 손상을 가장 직접적으로 반영합니다.
- source_word: דאגת מחיה
  english_pob_choice: anxiety about livelihood
  chosen_korean: 생계에 대한 걱정
  alternatives_korean:
  - 먹고사는 일에 대한 걱정
  - 생활 걱정
  - 생계 걱정
  lexicon: HALOT
  rationale: מחיה는 단순한 수입보다 삶을 유지하게 하는 생계 전반을 가리키므로, 현대 한국어에서 의미가 분명한 ‘생계’로 옮겼습니다. דאגת는 과도한 근심을 나타내어 ‘걱정’이 무난합니다.
- source_word: תפריע נומה
  english_pob_choice: drives away sleep
  chosen_korean: 잠을 쫓아냅니다
  alternatives_korean:
  - 잠을 방해합니다
  - 잠을 몰아냅니다
  - 잠을 빼앗습니다
  lexicon: HALOT
  rationale: 동사는 방해를 넘어 제거의 뉘앙스를 가지므로, ‘쫓아내다’로 번역해 수면이 밀려나는 생생한 효과를 살렸습니다. ‘잠’을 목적어로 두어 평행 구조도 분명히 했습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 평행문의 불일치
  chosen_reading: 본문은 현존 히브리어를 따라 ‘부유한 사람의 잠 못 이룸… 생계에 대한 걱정…’으로 옮기되, 주석으로 그리스어의 다른 전승을 알립니다.
  alternative_readings:
  - 그리스어를 따라 ‘헛된 희망과 거짓된 꿈…’으로 옮김
  - 히브리어를 불확정으로 보고 더 일반화된 의미로 처리함
  rationale: 이 절은 전승이 불안정하므로, 본문 번역은 현존 히브리어를 우선하되 다른 주요 전승이 있음을 독자가 확인할 수 있도록 했습니다.
  doctrine_reference: 텍스트비평 / 본문전승
