  lexicon: HALOT
  rationale: 지혜문학의 친자적 권면 호칭을 살리되, 한국어에서는 직접 호명형인 ‘아들아’가 가장 자연스럽고 간결합니다.
- source_word: על שלחן גדול
  english_pob_choice: at a great table
  chosen_korean: 큰 상에
  alternatives_korean:
  - 큰 식탁에
  - 부잣집 상에
  - 좋은 상에
  lexicon: HALOT
  rationale: על + ישב의 자리를 나타내는 용법을 반영해 ‘상에’로 옮기고, גדול은 크기와 위상 모두를 담아 ‘큰’으로 두어 과도한 해석을 피했습니다.
- source_word: אל תפתח
  english_pob_choice: do not open
  chosen_korean: 벌리지 마라
  alternatives_korean:
  - 열지 마라
  - 펴지 마라
  - 넓히지 마라
  lexicon: HALOT
  rationale: 문맥상 직역의 ‘열다’보다 입을 크게 벌리거나 탐욕스럽게 덤비는 이미지를 드러내는 ‘벌리다’가 히브리어 관용의 힘을 더 잘 살립니다.
- source_word: גרנך
  english_pob_choice: your throat
  chosen_korean: 네 목을
  alternatives_korean:
  - 네 목구멍을
  - 네 목을 크게
  - 네 식욕을
  lexicon: HALOT
  rationale: 문자적으로는 ‘목’이며, 관용적으로는 탐욕스러운 식욕을 가리킵니다. 본문 이미지를 유지하기 위해 직역하되, 의미는 문맥이 드러내도록 두었습니다.
theological_decisions:
- issue: 관용구의 의미를 직설적 이미지로 유지할지, 해석어로 풀어쓸지
  chosen_reading: 직역 이미지 ‘네 목을 벌리지 마라’를 유지했습니다.
  alternative_readings:
  - 탐욕스럽게 굴지 마라
  - 먹는 데 지나치게 덤비지 마라
  - 식욕을 자제하라
  rationale: 히브리어는 ‘목’을 열지 말라는 강한 관용적 경고이므로, 해석어로 완전히 평탄화하면 원문의 생생한 경고가 약해집니다. 의미는 문맥과 주석으로 보완하고 본문은 이미지성을 보존했습니다.
  doctrine_reference: 지혜문학의 절제 권면
