  alternative_readings:
  - 탐욕스럽게 굴지 마라
  - 먹는 데 지나치게 덤비지 마라
  - 식욕을 자제하라
  rationale: 히브리어는 ‘목’을 열지 말라는 강한 관용적 경고이므로, 해석어로 완전히 평탄화하면 원문의 생생한 경고가 약해집니다. 의미는 문맥과 주석으로 보완하고 본문은 이미지성을 보존했습니다.
  doctrine_reference: 지혜문학의 절제 권면
