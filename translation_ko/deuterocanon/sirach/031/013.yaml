  text: 아들아[a], 네가 큰 상에 앉거든[b] 그 위에서 네 목을 벌리지 마라.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 표현은 탐욕스러운 식욕을 경고하는 관용구이므로, 직역하면 ‘목’이지만 뜻은 음식 앞에서 과도하게 탐하지 말라는 권면입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘큰 상’은 히브리어 על שלחן גדול을 문자에 가깝게 옮긴 표현입니다. 문맥상 크기뿐 아니라 지위와 풍성함의 뉘앙스를 포함할 수 있습니다.
    reason: source_note
lexical_decisions:
- source_word: בני
  english_pob_choice: My son
  chosen_korean: 아들아
  alternatives_korean:
  - 내 아들아
  - 아들
  lexicon: HALOT
  rationale: 지혜문학의 친자적 권면 호칭을 살리되, 한국어에서는 직접 호명형인 ‘아들아’가 가장 자연스럽고 간결합니다.
- source_word: על שלחן גדול
  english_pob_choice: at a great table
  chosen_korean: 큰 상에
  alternatives_korean:
  - 큰 식탁에
  - 부잣집 상에
  - 좋은 상에
  lexicon: HALOT
  rationale: על + ישב의 자리를 나타내는 용법을 반영해 ‘상에’로 옮기고, גדול은 크기와 위상 모두를 담아 ‘큰’으로 두어 과도한 해석을 피했습니다.
- source_word: אל תפתח
  english_pob_choice: do not open
  chosen_korean: 벌리지 마라
  alternatives_korean:
  - 열지 마라
  - 펴지 마라
  - 넓히지 마라
  lexicon: HALOT
  rationale: 문맥상 직역의 ‘열다’보다 입을 크게 벌리거나 탐욕스럽게 덤비는 이미지를 드러내는 ‘벌리다’가 히브리어 관용의 힘을 더 잘 살립니다.
- source_word: גרנך
  english_pob_choice: your throat
  chosen_korean: 네 목을
  alternatives_korean:
  - 네 목구멍을
  - 네 목을 크게
  - 네 식욕을
  lexicon: HALOT
  rationale: 문자적으로는 ‘목’이며, 관용적으로는 탐욕스러운 식욕을 가리킵니다. 본문 이미지를 유지하기 위해 직역하되, 의미는 문맥이 드러내도록 두었습니다.
