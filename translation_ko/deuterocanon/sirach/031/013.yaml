base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/031/013.yaml
  text: My son[a], if you sit at a great table[b], do not open your throat over it.
  footnotes:
  - marker: a
    text: Hebrew 'do not open your throat over it' is an idiom warning against greed or ravenous appetite at a rich host's table; compare the more interpretive sense 'do not be greedy over it.'
    reason: lexical_alternative
  - marker: b
    text: The Greek parallel supplied here does not correspond to the Hebrew verse and appears mismatched for this reference, so the translation is anchored in the Hebrew witness.
    reason: textual_variant
translation:
  language: ko
  text: 내 아들아, 네가 큰 상에 앉거든 그 상을 향해 네 목구멍을 벌리지 마십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 ‘목구멍을 열다’는 풍성한 상 앞에서 탐욕스럽거나 게걸스럽게 굴지 말라는 뜻의 관용적 표현입니다. 본문은 원문의 생생한 이미지를 보존합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘큰 상’은 히브리어 표현을 가깝게 옮긴 말입니다. 문맥상 물리적 크기뿐 아니라 풍성함이나 격식을 암시할 수도 있습니다. 이 절에 제시된 그리스어 평행 본문은 히브리어 본문과 일치하지 않으므로, 번역은 히브리어 증거에 근거합니다.
    reason: textual_variant
lexical_decisions:
- source_word: בני
  english_pob_choice: My son
  chosen_korean: 아들아
  alternatives_korean:
