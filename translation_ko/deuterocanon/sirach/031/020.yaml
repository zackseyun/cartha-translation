review_pass:
  verdict: revise
  source_fidelity: The Hebrew reads, literally, “Know [that] your neighbor is a man/person like you, and eat what is set before you.” The draft retains both imperatives and the table-setting sense, but ‘자신과 같은 사람인 이웃을 알고’ can suggest merely knowing an acquaintance rather than recognizing the neighbor’s shared humanity. A small syntactic revision makes the exhortation clearer. Korean ‘사람’ is a natural generic rendering of איש in this proverbial context; the literal masculine wording may be noted without claiming that the translation deliberately broadens the source.
  naturalness: The revised wording is more idiomatic modern formal-polite Korean. It preserves the direct-address style already used by ‘네 앞에’ while avoiding the somewhat heavy attributive phrase ‘자신과 같은 사람인 이웃.’
  terminology: ‘이웃’ suitably renders רֵעַ in its ethical-social sense, and ‘차려진 것’ naturally conveys food set before someone. The Greek note should describe a divergent witness without presenting an interpretive rationale as though it were part of the Hebrew text.
  issues:
  - severity: medium
    issue: The main clause is syntactically less natural and slightly semantically imprecise.
    rationale: ‘자신과 같은 사람인 이웃을 알고’ can mean “know the neighbor who is a person like oneself.” The Hebrew imperative calls for recognizing that one’s neighbor is like oneself. ‘이웃도 자신과 같은 사람임을 알고’ expresses that relationship directly.
  - severity: medium
    issue: Footnote a introduces an unsupported translation-policy explanation.
    rationale: The note says the Korean text uses ‘사람’ “for broader application,” which frames the rendering as a deliberate expansion beyond the Hebrew. It should simply identify the literal masculine expression and let the Korean generic noun stand as an idiomatic rendering.
  revised_text: 이웃도 자신과 같은 사람임을 알고[a], 네 앞에 차려진 것을 먹으십시오.[b]
  revised_footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘너와 같은 남자’입니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어 증언은 이 구절에서 상당히 다릅니다. ‘영혼을 높이고 눈을 밝히며, 치유와 생명과 복을 주는 것.’ 히브리어와 그리스어는 이 절의 서로 다른 형태를 전하는 것으로 보입니다.
    reason: textual_variant
  revision_rationale: The revision clarifies the Hebrew’s recognition/exhortation structure, maintains the direct imperatives and meal context, and removes an unnecessary claim that the Korean wording intentionally expands the source. The Greek variant remains clearly identified as a substantially divergent parallel witness.
