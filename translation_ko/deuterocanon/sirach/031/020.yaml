  text: Know that your neighbor is a man like yourself[b][a], and eat what is set before you.
  footnotes:
  - marker: a
    text: Or, more inclusively, 'your neighbor is a person like yourself.' The Hebrew reads literally 'a man like you.'
    reason: lexical_alternative
  - marker: b
    text: 'The Greek witness here differs substantially: ''lifting up the soul and enlightening the eyes, giving healing, life, and blessing.'' The Hebrew and Greek appear to preserve different forms of the verse.'
    reason: alternative_reading
translation:
  language: ko
  text: 이웃도 자신과 같은 사람임을 알고[a], 네 앞에 차려진 것을 먹으십시오.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘너와 같은 남자’입니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어 증언은 이 구절에서 상당히 다릅니다. ‘영혼을 높이고 눈을 밝히며, 치유와 생명과 복을 주는 것.’ 히브리어와 그리스어는 이 절의 서로 다른 형태를 전하는 것으로 보입니다.
    reason: textual_variant
