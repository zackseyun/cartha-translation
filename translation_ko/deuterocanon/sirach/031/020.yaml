  - 네 앞에 마련된
  lexicon: HALOT
  rationale: 식탁에 놓인 음식이라는 관용을 살려 ‘차려진’으로 옮겼습니다. 단순한 위치보다 식사 상황을 더 분명히 드러냅니다.
theological_decisions:
- issue: 인명/성별 표현의 일반화
  chosen_reading: 본문은 ‘사람’으로 옮기되, 원문이 남성 명사임을 각주로 밝힙니다.
  alternative_readings:
  - ‘남자’로 직역
  - ‘인간’으로 비성별화
  rationale: 히브리어 איש의 남성형을 완전히 지우지 않으면서도, 잠언적 권면의 적용 대상을 한국어 독자에게 자연스럽게 전달하기 위해 본문은 완화된 표현을 택했습니다.
  doctrine_reference: Translation philosophy 4
