  - 너 같은 사람
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 남성형 ‘남자’이지만, 한국어 본문에서는 잠언적 권면의 보편성을 살려 의미를 살린 표현을 택했습니다. 남성형 뉘앙스는 각주로 보완합니다.
