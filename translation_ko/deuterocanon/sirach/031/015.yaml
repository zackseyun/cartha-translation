base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/031/015.yaml
  text: An evil eye hates God[b][a], and he created nothing worse than it.
  footnotes:
  - marker: a
    text: Literally 'an evil eye,' a Hebrew idiom for a stingy, begrudging, or envious person.
    reason: lexical_alternative
  - marker: b
    text: 'The Greek parallel for this verse differs sharply, reading instead: ''for their hope is in the one who saves them.'' This appears to reflect a substantially different textual form.'
    reason: textual_variant
translation:
  language: ko
  text: 악한 눈은 하나님을 미워합니다[a], 그리고 하나님은 그것보다 더 나쁜 것은 아무것도 창조하지 않으셨습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘악한 눈’입니다. 히브리어 관용구로서 인색함, 질투, 혹은 구두쇠 같은 마음가짐을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: '그리스어 평행문은 이 절을 매우 다르게 전합니다: ‘그들의 희망은 그들을 구원하시는 분에게 있습니다.’ 이는 단순한 표현 차이가 아니라 상당히 다른 본문형을 반영하는 것으로 보입니다.'
    reason: textual_variant
lexical_decisions:
- source_word: רע עין
  english_pob_choice: an evil eye
  chosen_korean: 악한 눈
  alternatives_korean:
  - 질투하는 눈
  - 인색한 사람
  - 시기하는 눈
  lexicon: HALOT
  rationale: 히브리어 관용구를 본문 표면대로 살리되, 한국어에서는 ‘눈’보다 ‘악한 눈’이 가장 직접적이고 투명한 대응이어서 본문에 유지했습니다.
- source_word: שונא
  english_pob_choice: hates
  chosen_korean: 미워합니다
  alternatives_korean:
  - 증오합니다
  - 싫어합니다
  lexicon: HALOT
  rationale: 동사의 기본 의미인 ‘미워하다’를 살려, 주어인 ‘악한 눈’의 강한 적대감을 자연스러운 현대 한국어로 옮겼습니다.
- source_word: אל
  english_pob_choice: God
  chosen_korean: 하나님
  alternatives_korean:
  - 하느님
  - 신
  lexicon: HALOT
  rationale: 지혜문학에서 אל은 신적 호칭으로 쓰이므로, 프로젝트 기본어휘에 따라 ‘하나님’으로 옮겼습니다.
- source_word: ורע ממנו לא ברא
  english_pob_choice: and he created nothing worse than it
  chosen_korean: 그것보다 더 나쁜 것은 아무것도 창조하지 않으셨습니다
  alternatives_korean:
  - 그것보다 더 나쁜 것은 아무것도 만드시지 않으셨습니다
  - 그것보다 더 나쁜 것을 아무것도 خلق하지 않으셨습니다
  lexicon: HALOT
  rationale: בּרא의 창조 언어를 보존하되, 부정문을 한국어의 자연스러운 어순으로 풀어 ‘아무것도…않으셨습니다’로 번역했습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 평행문의 큰 불일치
  chosen_reading: 히브리어 본문을 따라 ‘악한 눈은 하나님을 미워합니다’로 옮기고, 그리스어는 다른 본문형으로 보았습니다.
  alternative_readings:
  - 그리스어 평행문을 따라 ‘그들의 희망은 그들을 구원하시는 분에게 있습니다’로 옮길 수 있음
  rationale: 이 절은 그리스어가 히브리어와 거의 다른 문장을 전하므로, 단순 이역이 아니라 본문 전승 차이로 처리하는 것이 타당합니다.
  doctrine_reference: 'Sirach textual criticism / project rule: translate surviving Hebrew of Sirach as primary where extant'
