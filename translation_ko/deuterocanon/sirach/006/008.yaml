  text: For there is a friend for the occasion[a], and he will not stand firm in the day of distress.
  footnotes:
  - marker: a
    text: Or, 'there is a friend for a time' or 'there is a friend when it suits him.' The Hebrew phrase is idiomatic, and the Greek parallel likewise suggests a friendship limited to favorable circumstances.
    reason: lexical_alternative
translation:
  language: ko
  text: 왜냐하면 때로는 친구가 있지만, 고난의 날에는 그가 끝까지 함께 서지 못합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘때에 따른 친구’ 또는 ‘때에 맞는 친구’이며, 여기서는 기회가 좋을 때만 붙어 있는 우정의 한계를 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹהֵב / φίλος
  english_pob_choice: friend
  chosen_korean: 친구
  alternatives_korean:
  - 사랑하는 사람
  - 우애하는 이
  lexicon: HALOT; LXX φίλος
  rationale: 히브리어 פעול형 אוֹהֵב와 헬라어 φίλος는 여기서 연애적 의미가 아니라 관계적 동반자, 곧 ‘친구’의 뜻으로 쓰입니다. 한국어에서는 이를 자연스럽고 문맥에 맞게 ‘친구’로 옮기는 것이 가장 직접적입니다.
- source_word: כְּפִי עֵת / ἐν καιρῷ αὐτοῦ
  english_pob_choice: for the occasion
  chosen_korean: 때를 따라
  alternatives_korean:
  - 그때에 맞추어
  - 필요한 때에
  - 한때만
  lexicon: HALOT; LSJ
  rationale: 직역하면 ‘시간의 입/정도에 따라’이지만, 관용적으로 ‘때에 맞게, 상황이 허락할 때에만’이라는 뜻입니다. 한국어 ‘때를 따라’가 이 한시적·조건부 성격을 가장 간결하게 살립니다.
- source_word: יַעֲמוֹד / παραμείνῃ
  english_pob_choice: stand firm
  chosen_korean: 끝까지 함께 서지 못합니다
  alternatives_korean:
  - 굳게 서지 못합니다
  - 버티지 못합니다
  - 지속하지 못합니다
  lexicon: HALOT; BDAG
  rationale: 히브리어 ‘서다’와 헬라어 ‘머무르다’가 모두 관계적 충성의 지속을 가리키므로, 단순한 물리적 ‘서다’보다 위기 때 곁을 지키는 뉘앙스를 드러내는 표현을 택했습니다.
- source_word: בְּיוֹם צָרָה / ἐν ἡμέρᾳ θλίψεώς σου
  english_pob_choice: in the day of distress
  chosen_korean: 고난의 날
  alternatives_korean:
  - 환난의 날
  - 곤경의 날
  - 재앙의 날
  lexicon: HALOT; LXX parallel
  rationale: צָרָה와 θλῖψις는 압박과 곤란, 재난성 위기를 함께 가리킵니다. 한국어에서는 관용적인 ‘고난의 날’이 본문의 경고성을 유지하면서도 자연스럽습니다.
theological_decisions:
- issue: 본문의 일반 지혜문학적 경고를 종교적 교리어로 과잉 해석할지 여부
  chosen_reading: 이 절은 충성심이 상황에 따라 변하는 ‘조건부 친구’에 대한 일반 지혜의 경고로 옮겼습니다.
  alternative_readings:
  - 신앙 공동체 안의 배신에 대한 직접 경고로 좁혀 읽기
  - 영적 우정의 비유로 확대 해석하기
  rationale: 시락은 인생 경험을 바탕으로 한 지혜의 진술이며, 여기서 강조점은 위기 때 드러나는 관계의 진정성입니다. 따라서 교리화보다 원문의 실천적 경고를 유지하는 것이 적절합니다.
  doctrine_reference: 지혜문학의 일반적 권면과 언어적 관찰
