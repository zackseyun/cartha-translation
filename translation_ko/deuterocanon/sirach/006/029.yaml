  text: Its net will become for you a strong refuge[b][a], and its cords garments of fine gold.
  footnotes:
  - marker: a
    text: 'Greek parallel: ''its fetters will be for you a shelter of strength, and its branches a robe of glory.'' This differs notably from the extant Hebrew, which reads ''its net ... its cords ... garments of fine gold.'''
    reason: alternative_reading
  - marker: b
    text: The Hebrew imagery presents what first seems restrictive as ultimately protective and honorable.
    reason: cross_reference
translation:
  language: ko
  text: 그 네트는 너에게 강한 피난처가 되고, 그 끈들은 금빛 옷이 될 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 병행본은 “그 사슬들은 힘의 가리개가 되고, 그 가지들은 영광의 옷이 된다”라고 다르게 읽습니다.
    reason: textual_variant
  - marker: b
    text: 히브리어 이미지는 처음에는 구속처럼 보이는 것이 결국 보호와 존귀가 됨을 보여 줍니다.
    reason: theological_note
lexical_decisions:
- source_word: וְהָיְתָה לְךָ
  english_pob_choice: will become for you
  chosen_korean: 너에게 ... 될 것입니다
  alternatives_korean:
  - 너에게 ...가 될 것입니다
  - 너의 것이 될 것입니다
  lexicon: HALOT
  rationale: 미래 결과를 나타내는 구조를 자연스러운 한국어로 옮기되, 단순 소유보다 변화·귀결의 뉘앙스를 살렸습니다.
- source_word: רִשְׁתָּהּ
  english_pob_choice: its net
  chosen_korean: 그 네트
  alternatives_korean:
  - 그물
  - 그 망
  lexicon: HALOT
  rationale: רשת는 ‘그물/네트’를 뜻하며, 본문은 끈과 병렬을 이루므로 ‘네트’가 시각적·구조적 대응을 가장 잘 보존합니다.
- source_word: מְכוֹן עֹז
  english_pob_choice: a strong refuge
  chosen_korean: 강한 피난처
  alternatives_korean:
  - 견고한 피난처
  - 강한 요새
  - 힘의 거처
  lexicon: HALOT
  rationale: מכון은 ‘자리/터/거처’의 뜻이 있고 עז와 결합해 보호의 장소를 가리키므로, 읽기 자연성을 살린 ‘피난처’로 옮겼습니다.
- source_word: חַבְלֹתֶיהָ
  english_pob_choice: its cords
  chosen_korean: 그 끈들
  alternatives_korean:
  - 그 밧줄들
  - 그 줄들
  lexicon: HALOT
  rationale: חבל은 끈, 밧줄, 줄을 가리키며, 앞의 ‘네트’와 함께 짝을 이루는 이미지이므로 ‘끈들’이 무리 없이 연결됩니다.
- source_word: בִּגְדֵי כָתֶם
  english_pob_choice: garments of fine gold
  chosen_korean: 금빛 옷
  alternatives_korean:
  - 정금의 옷
  - 귀한 금의 옷
  - 화려한 옷
  lexicon: HALOT
  rationale: כתם은 ‘정금/고운 금’을 가리키지만, 시적 이미지상 ‘금빛 옷’이 의미를 덜 훼손하면서도 더 자연스럽게 전달합니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행본의 이미지 차이
  chosen_reading: 히브리어의 ‘네트/끈/금빛 옷’을 본문으로 따르고, 그리스어의 ‘사슬/힘의 덮개/영광의 옷’은 대안 전승으로 보존합니다.
  alternative_readings:
  - '그리스어: ‘그 사슬들은 힘의 가리개가 되고, 그 가지들은 영광의 옷이 된다’'
  rationale: 집회서에서는 히브리어가 존속하는 경우 히브리어를 본문으로 삼는 원칙이 있으며, 여기서는 그리스어가 해석적 변형 또는 다른 전승을 반영할 가능성이 큽니다.
  doctrine_reference: 'PHILOSOPHY.md: Sirach는 현존 히브리어를 기본 본문으로 삼고, 그리스어는 대조·주석용으로 사용합니다.'
