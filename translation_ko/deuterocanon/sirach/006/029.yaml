  text: Its net will become for you a strong refuge[b][a], and its cords garments of fine gold.
  footnotes:
  - marker: a
    text: 'Greek parallel: ''its fetters will be for you a shelter of strength, and its branches a robe of glory.'' This differs notably from the extant Hebrew, which reads ''its net ... its cords ... garments of fine gold.'''
    reason: alternative_reading
  - marker: b
    text: The Hebrew imagery presents what first seems restrictive as ultimately protective and honorable.
    reason: cross_reference
translation:
  language: ko
  text: 그 그물은 너에게 견고한 피난처가 되고, 그 끈들은 정금으로 된 옷이 될 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 병행본은 “그 사슬들은 너에게 힘의 피난처가 되고, 그 가지들은 영광의 옷이 된다”라고 읽습니다. 이는 현존 히브리어의 “그물 … 끈들 … 정금으로 된 옷”과 뚜렷이 다릅니다.
    reason: textual_variant
  - marker: b
    text: 히브리어의 이미지는 처음에는 속박처럼 보일 수 있는 것이 마침내 보호와 존귀가 됨을 나타냅니다.
    reason: cross_reference
lexical_decisions:
- source_word: וְהָיְתָה לְךָ
  english_pob_choice: will become for you
  chosen_korean: 너에게 ... 될 것입니다
  alternatives_korean:
