  rationale: 시락은 히브리어가 살아 있는 경우 히브리어를 우선하되, 여기서는 중요한 차이가 있으므로 그리스어 증거를 무시하지 않고 의미상 병행으로 인정해야 합니다.
  doctrine_reference: 'PHILOSOPHY.md: 히브리어 우선, 그리스어 병행은 실제 입력으로 존중'
