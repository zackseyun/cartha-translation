  yaml_path: translation/deuterocanon/sirach/006/035.yaml
  text: See who has understanding[a], and seek him out[b]; and let your foot wear out his threshold.
  footnotes:
  - marker: a
    text: 'Greek parallel: ''Desire to hear every divine discourse, and do not let proverbs of understanding escape you.'' The Hebrew and Greek witnesses differ substantially here, though both urge eager pursuit of wisdom.'
    reason: alternative_reading
  - marker: b
    text: Literally, 'let your foot wear out his threshold'—an image of frequenting the house of a wise person to learn from him.
    reason: lexical_alternative
translation:
  language: ko
  text: 분별력이 있는 사람이 누구인지 살펴보십시오. 그를 부지런히 찾으십시오. 그의 문지방에서 발이 닳도록 하십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 병행문은 “모든 신성한 말씀을 듣기를 원하고, 지혜의 잠언을 놓치지 마십시오”라고 전합니다. 히브리어와 그리스어 본문은 여기서 표현이 크게 다르지만, 둘 다 지혜를 열심히 추구하라고 권면합니다.
    reason: alternative_reading
  - marker: b
    text: 직역하면 “그의 문지방에서 네 발을 닳게 하라”는 뜻입니다. 지혜로운 사람을 자주 찾아가 배운다는 비유입니다.
    reason: lexical_alternative
