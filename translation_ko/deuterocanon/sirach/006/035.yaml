    rationale: 그리스어 이문과 히브리어의 문지방 비유는 별개의 정보입니다. 영어 감사 기록의 각주 기능을 따라 비유의 뜻을 별도 각주로 제공하면 독자가 본문을 오해하지 않습니다.
