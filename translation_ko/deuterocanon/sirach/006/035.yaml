  text: See who has understanding[a], and seek him out[b]; and let your foot wear out his threshold.
  footnotes:
  - marker: a
    text: 'Greek parallel: ''Desire to hear every divine discourse, and do not let proverbs of understanding escape you.'' The Hebrew and Greek witnesses differ substantially here, though both urge eager pursuit of wisdom.'
    reason: alternative_reading
  - marker: b
    text: Literally, 'let your foot wear out his threshold'—an image of frequenting the house of a wise person to learn from him.
    reason: lexical_alternative
translation:
  language: ko
  text: 현명한 이가 누구인지 보십시오. 그를 찾아내십시오. 그리고 당신의 발이 그의 문지방을 닳게 하십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 병행문은 ‘모든 신성한 강론을 들으려 하며, 지혜의 잠언이 당신에게서 빠져나가게 하지 마십시오’로 다르게 전합니다. 히브리어와 그리스어는 표현이 크게 다르지만, 둘 다 지혜를 적극적으로 추구하라는 취지를 공유합니다.
    reason: alternative_reading
