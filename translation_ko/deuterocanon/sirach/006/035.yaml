  rationale: 히브리어 본문을 우선하여 분별 있는 사람을 열심히 찾아 그 문간을 자주 드나들라는 권면을 보존했습니다. 그리스어는 본문에 혼합하지 않고, 실질적으로 다른 병행 읽기임을 밝히는 각주로 제시했습니다. 문지방 비유는 한국어에서 자연스러운 ‘발이 닳도록’으로 옮기고 설명 각주를 추가했습니다.
