theological_decisions:
- issue: 히브리어 본문과 그리스어 병행문의 차이 처리
  chosen_reading: 현존하는 히브리어 본문을 본문으로 번역하고, 그리스어는 별도 대안 읽기로 보존합니다.
  alternative_readings:
