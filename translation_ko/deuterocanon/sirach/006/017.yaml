    reason: alternative_reading
lexical_decisions:
- source_word: כָּמוֹהוּ
  english_pob_choice: as he is
  chosen_korean: 그와 같으면
  alternatives_korean:
  - 그가 그러하듯
  - 그와 같이
  lexicon: HALOT
  rationale: 비교 접두사 כ־와 대명사 결합은 간결한 ‘~와 같음’의 뜻이므로, 잠언체의 압축성을 살려 ‘그와 같으면’으로 옮겼습니다.
- source_word: רֵעֵהוּ
  english_pob_choice: his friend
  chosen_korean: 그의 친구
  alternatives_korean:
  - 그의 동무
  - 그의 이웃
  lexicon: HALOT
  rationale: 문맥이 우정의 관계를 말하므로 넓은 의미의 ‘이웃’보다 직접적인 ‘친구’가 본문 흐름에 더 잘 맞습니다.
- source_word: כִּשְׁמוֹ
  english_pob_choice: as his name
  chosen_korean: 그의 이름과 같으면
  alternatives_korean:
  - 그의 이름대로
  - 그의 명성처럼
  lexicon: HALOT
  rationale: 히브리어가 문자적으로 ‘그의 이름’을 가리키므로, 해석을 덧붙이지 않고 ‘이름’의 직설성을 살렸습니다.
- source_word: מַעֲשָׂיו
  english_pob_choice: his deeds
  chosen_korean: 그의 행실
  alternatives_korean:
  - 그의 행동
  - 그의 일들
  lexicon: HALOT
  rationale: 지혜문학의 도덕적 뉘앙스를 살리기 위해 중립적인 ‘행동’보다 평가적 색채가 있는 ‘행실’을 택했습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행본문의 차이
  chosen_reading: 본문은 현존 히브리어를 따라 번역하고, 그리스어가 제시하는 ‘여호와를 두려워하는 자’ 관련 확장은 본문에 넣지 않았습니다.
  alternative_readings:
  - 그리스어에 따라 ‘주님을 경외하는 이가 자기의 우정을 바르게 인도하니, 그와 같이 그의 이웃도 그러하다’로 옮길 수 있음
  rationale: 이 절은 히브리어와 그리스어가 첫 행에서 크게 다르므로, 번역 본문은 현존 히브리어를 우선하고 그 차이는 각주로 남기는 편이 출처 충실성에 부합합니다.
  doctrine_reference: 'PHILOSOPHY.md: 현존 히브리어 우선, 본문 차이는 정직하게 보존'
