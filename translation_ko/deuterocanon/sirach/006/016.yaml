- source_word: יְרֵא
  english_pob_choice: one who fears
  chosen_korean: 경외하는 사람
  alternatives_korean:
  - 두려워하는 사람
  - 경외하는 이
  - 주님을 두려워하는 사람
  lexicon: HALOT
  rationale: 지혜문맥에서 ירא는 단순 공포보다 하나님에 대한 경외를 뜻하므로, 한국어 성경어법에 맞게 ‘경외하다’로 옮겼습니다.
- source_word: Κύριον
  english_pob_choice: the Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주
  - 주 하나님
  lexicon: BDAG
  rationale: 그리스어 평행본문이 भय의 대상이 되는 분을 분명히 하므로, 프로젝트 표준에 따라 κύριος를 ‘주님’으로 번역했습니다.
- source_word: יַשִּׂיגֵם
  english_pob_choice: will find him
  chosen_korean: 그를 얻을 것입니다
  alternatives_korean:
  - 그를 찾을 것입니다
  - 그에게 이를 것입니다
  - 그를 발견할 것입니다
  lexicon: HALOT
  rationale: 히브리어 동사의 본래 뉘앙스는 ‘붙잡다/도달하다/획득하다’에 가깝지만, 그리스어 평행본문의 ‘찾다’와 문맥상의 결과를 함께 반영하여 ‘얻다’로 자연스럽게 풀었습니다.
theological_decisions:
