  alternative_readings:
  - 주님을 경외하는 사람은 그를 찾을 것입니다
  - 주님을 경외하는 사람은 그에게 이를 것입니다
  rationale: 히브리어는 목적어와 동사 결합이 압축적이어서 문맥이 불분명하므로, 사본 간 일치를 위해 그리스어 평행본문의 의미를 보완적으로 사용하되 히브리어의 수동적/획득적 뉘앙스도 보존했습니다.
