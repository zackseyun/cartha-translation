base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/006/016.yaml
  text: A faithful friend is a bundle of life[b][a], and one who fears the Lord will attain him.
  footnotes:
  - marker: a
    text: Hebrew reads literally 'a bundle of life, a lover of faithfulness'; the Greek parallel has 'a faithful friend is a remedy of life.' The translation follows the Hebrew image 'bundle of life' while using the Greek to clarify the sense of the line.
    reason: alternative_reading
  - marker: b
    text: The final clause is textually difficult in the Hebrew, which lacks an explicit object for 'fears' and has a verb/object form that is hard to construe. The Greek parallel reads, 'those who fear the Lord will find him.'
    reason: textual_variant
translation:
  language: ko
  text: 믿음직한 친구는 생명의 묶음이며, 주님을 경외하는 사람은 그를 얻을 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘생명의 묶음, 신의를 사랑하는 자’에 가깝고, 그리스어 평행본문은 ‘생명의 약(치료제)인 신실한 친구’라고 합니다. 본문은 히브리어의 이미지를 따르되, 뜻은 그리스어로 확인한 번역입니다.
    reason: source_note
  - marker: b
    text: 마지막 절은 히브리어가 압축되어 있어 ‘경외하다’의 목적어가 분명하지 않습니다. 그리스어 평행본문은 ‘주님을 두려워하는 이들은 그를 찾을 것입니다’라고 합니다.
    reason: textual_variant
lexical_decisions:
- source_word: צְרוֹר חַיִּים
