  text: It will consume your leaves and uproot your fruit[b][a], and leave you like a dry tree.
  footnotes:
  - marker: a
    text: Hebrew is difficult at several points in this verse; the Greek parallel supports the sense 'your leaves' and a destructive outcome for 'your fruit.'
    reason: textual_variant
  - marker: b
    text: Or 'destroy your fruit.' The underlying Hebrew verb is uncertain here, and the Greek reads 'destroy/lose.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그것이 당신의 잎을 먹어 치우고 당신의 열매를 망쳐 버리며, 당신을 마른 나무처럼 남겨 둘 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 절은 히브리어 본문이 여러 군데 난해하며, 그리스어 병행문이 ‘잎’과 파괴적 결과의 뜻을 뒷받침합니다.
    reason: textual_variant
  - marker: b
    text: 히브리어 동사는 불확실하여 ‘망쳐 버리다’ 외에 ‘뿌리째 뽑다/없애다’로도 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלֶיךָ
  english_pob_choice: your leaves
  chosen_korean: 당신의 잎
  alternatives_korean:
  - 당신 위에
  - 당신에게
  lexicon: HALOT
  rationale: 본문의 히브리어는 난해하지만, 병행하는 그리스어 τὰ φύλλα σου와 문맥상 식물 이미지에 따라 ‘잎’으로 이해하는 것이 가장 자연스럽습니다.
- source_word: תֹּאכַל
  english_pob_choice: it will consume
  chosen_korean: 먹어 치우고
  alternatives_korean:
  - 삼키고
  - 먹고
  lexicon: HALOT
  rationale: 동사는 문자적으로 ‘먹다/소비하다’이므로, 파괴적 비유를 살리기 위해 한국어에서는 ‘먹어 치우다’로 옮겼습니다.
- source_word: וּפֶרְיְךָ
  english_pob_choice: your fruit
  chosen_korean: 당신의 열매
  alternatives_korean:
  - 당신의 소출
  - 당신의 생산물
  lexicon: HALOT
  rationale: 나무 비유를 유지하려면 ‘열매’가 가장 직접적이며, 앞의 ‘잎’과 뒤의 ‘마른 나무’와도 호응합니다.
- source_word: תְּשָׁרֵשׁ
  english_pob_choice: uproot
  chosen_korean: 망쳐 버리며
  alternatives_korean:
  - 뿌리째 뽑고
  - 뽑아 버리며
  - 없애고
  lexicon: HALOT
  rationale: 히브리어 형태가 난해하고 그리스어는 ‘destroy/lose’를 읽으므로, 과도하게 구체적인 ‘뿌리째 뽑다’보다 파괴의 결과를 드러내는 ‘망쳐 버리다’가 본문의 불확실성을 덜 훼손합니다.
- source_word: וְהִנִיחַתְךָ
  english_pob_choice: leave you
  chosen_korean: 당신을 … 남겨 둘 것입니다
  alternatives_korean:
  - 당신을 버릴 것입니다
  - 당신을 남겨 둘 것입니다
  lexicon: HALOT
  rationale: 사전적 ‘쉬게 하다’보다 문맥과 그리스어 ἀφήσεις σεαυτόν에 따라 ‘버려 두다/남겨 두다’의 의미가 적절합니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행문의 긴장 처리
  chosen_reading: 히브리어를 기본으로 하되, 난해한 형태는 그리스어 병행문이 확인하는 ‘잎/열매/마른 나무’의 이미지를 따라 의미를 정리했습니다.
  alternative_readings:
  - 히브리어를 더 직역해 ‘당신 위에 먹을 것이고…’로 옮김
  - 그리스어를 따라 더 직접적으로 ‘잎을 삼키고 열매를 잃게 하며…’로 옮김
  rationale: 이 절은 본문 전승이 불안정하므로, 원문 우선 원칙을 지키면서도 병행문이 보강하는 식물 비유를 명료하게 드러내는 것이 가장 책임 있는 번역입니다.
  doctrine_reference: 'POB 번역 원칙: 히브리어가 보존된 지혜문학은 히브리어를 우선하되, 검증 가능한 병행문으로 난문을 해명한다.'
