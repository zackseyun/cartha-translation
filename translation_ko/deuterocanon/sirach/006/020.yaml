base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/006/020.yaml
  text: It is difficult for a fool[b][a], and one lacking sense will not endure it.
  footnotes:
  - marker: a
    text: Or 'It is rough/hard for a fool'; the Greek parallel reads 'it is very rough for the undisciplined,' supporting the sense 'very difficult.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'lacking heart,' a Hebrew idiom meaning lacking sense or understanding.
    reason: lexical_alternative
translation:
  language: ko
  text: 그것은 어리석은 자에게는 어렵고[a], 분별이 없는 사람은[b] 그것을 견디지 못합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 עֲקֻבָּה는 문자적으로 ‘구부러진/뒤틀린’ 뜻을 가질 수 있으나, 문맥에서는 ‘거칠고 어렵다’는 뜻으로 이해됩니다. 그리스어 평행본문은 ‘매우 거칠다’고 말합니다.
    reason: source_note
  - marker: b
    text: 히브리어 חֲסַר לֵב는 직역하면 ‘마음이 없는’이지만, 여기서는 ‘분별이 없는/이해가 없는’이라는 관용적 의미입니다.
    reason: source_note
lexical_decisions:
- source_word: עֲקֻבָּה
  english_pob_choice: very difficult
  chosen_korean: 매우 어렵고
  alternatives_korean:
  - 거칠고
  - 힘들고
  - 꼬여 있고
  lexicon: HALOT
  rationale: 히브리어는 문자적으로는 ‘구불구불한/뒤틀린’ 뉘앙스를 가질 수 있지만, 문맥과 그리스어 평행구의 τραχεῖά ἐστιν σφόδρα가 뜻하는 바를 따라 ‘매우 어렵다’로 옮기는 것이 자연스럽고 의미를 더 정확히 드러냅니다.
- source_word: לָאֱוִיל
  english_pob_choice: for a fool
  chosen_korean: 어리석은 자에게는
  alternatives_korean:
  - 어리석은 자에게
  - 바보에게
  - 우매한 자에게는
  lexicon: HALOT
  rationale: אֱוִיל은 단순 지능 부족이 아니라 지혜 전통에서의 도덕적·지성적 우둔함을 가리키므로, 표준적이면서도 다소 평가적인 ‘어리석은 자’로 옮겼습니다.
- source_word: וְלֹא יְכַלְכְּלֶנָּה
  english_pob_choice: will not endure it
  chosen_korean: 그것을 견디지 못합니다
  alternatives_korean:
  - 그것을 감당하지 못합니다
  - 그것을 지속하지 못합니다
  - 그 안에 머물지 못합니다
  lexicon: HALOT
  rationale: כלכל은 여기서 단순히 ‘붙들다’보다 ‘감당하다/견디다’의 의미가 문맥에 맞고, 지혜의 길을 지속적으로 받아들이지 못한다는 뜻을 현대 한국어로 가장 자연스럽게 드러냅니다.
- source_word: חֲסַר לֵב
  english_pob_choice: one lacking sense
  chosen_korean: 분별이 없는 사람
  alternatives_korean:
  - 마음이 없는 사람
  - 이해가 없는 사람
  - 분별 없는 자
  lexicon: HALOT
  rationale: 직역인 ‘마음이 없는’은 한국어에서 정서적 공감 결여처럼 들릴 수 있어, 히브리어 관용구의 뜻인 ‘분별/이해가 없음’을 살려 옮겼습니다.
theological_decisions:
- issue: ‘마음이 없다’는 히브리어 관용구의 처리
  chosen_reading: 직역보다 의미역으로 풀어 ‘분별이 없는 사람’으로 번역했습니다.
  alternative_readings:
  - 마음이 없는 사람
  - 마음이 결여된 사람
  rationale: 본문의 핵심은 심리적 감정 결핍이 아니라 지혜를 이해하고 받아들일 내적 분별의 부재이므로, 한국어 독자가 오해하지 않도록 관용적 의미를 드러냈습니다.
  doctrine_reference: 'Translation philosophy: source 의미 우선, 관용구는 오독을 피하기 위해 자연스러운 한국어로 의미화'
