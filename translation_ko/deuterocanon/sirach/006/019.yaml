review_pass:
  verdict: revise
  source_fidelity: 히브리어 본문을 따라 ‘밭을 갈고 거두는 이’와 ‘풍성한 소출’을 유지하고, 그리스어의 ‘뿌리는 이’ 이문은 각주로 보존했습니다. לְמָחָר는 문자적으로 ‘내일’이지만 병행 그리스어의 ‘빨리’와 문맥을 고려하여 본문에서는 ‘머지않아’로 옮기고 각주에서 직역과 해석을 밝혔습니다.
  naturalness: 초안의 ‘그 여인의 봉사 가운데서는’은 한국어에서 그 여인이 하는 봉사로 읽히며, 원문의 지혜를 섬기며 수고한다는 뜻을 충분히 드러내지 못합니다. ‘그녀를 섬기는 일에서는’이 자연스럽고 의미도 분명합니다. 명령의 연결도 ‘가까이 가서 … 기다리십시오’로 다듬었습니다.
  terminology: 지혜의 여성 의인화는 문맥상 유지하되, 반복적인 ‘그 여인’보다 자연스러운 대명사 ‘그녀’를 사용했습니다. 농경 비유의 ‘소출’과 ‘열매’는 구별하여 유지했습니다.
  issues:
  - severity: medium
    issue: ‘그 여인의 봉사 가운데서는’
    rationale: 이 표현은 ‘그 여인이 수행하는 봉사’라는 소유·주체 관계로 자연스럽게 해석됩니다. בַעֲבֹדָתָהּ는 여기서 지혜를 섬기거나 지혜를 위해 일하는 수고를 가리키므로 ‘그녀를 섬기는 일에서는’으로 바로잡아야 합니다.
  - severity: low
    issue: 명령문의 연결과 각주 표지 위치
    rationale: ‘가고, … 기다리십시오’보다 ‘가까이 가서 … 기다리십시오’가 합쇼체 명령문으로 더 매끄럽습니다. 이문 및 시간 표현 각주는 각각 해당 단어 바로 뒤에 두는 편이 독자의 확인을 돕습니다.
  revised_text: 밭을 갈고 거두는 이처럼 그녀에게 가까이 가서, 그녀의 풍성한 소출을 기다리십시오. 그녀를 섬기는 일에서는 조금만 수고할 것이며, 머지않아[b] 그녀의 열매를 먹게 될 것입니다.
  revised_footnotes:
  - marker: a
    text: 그리스어는 ‘밭을 갈고 뿌리는 이처럼’이라고 하여, 히브리어의 ‘거두는 이’와 다릅니다.
    reason: textual_variant
  - marker: b
    text: 히브리어는 문자적으로 ‘내일’이라고 합니다. 여기서는 ‘머지않아’ 또는 ‘곧’이라는 뜻으로 이해할 수 있으며, 그리스어는 ‘빨리’라고 합니다.
    reason: lexical_alternative
  revision_rationale: ‘봉사’의 소유 관계가 한국어에서 오해되지 않도록 지혜를 섬기는 행위로 명시했습니다. 히브리어의 농경 이미지, 여성 의인화, 적은 수고와 가까운 장래의 결실이라는 대조는 유지했습니다. 이문 각주는 반드시 ‘거두는 이’ 뒤에 붙여야 하므로 본문에도 표지를 반영했습니다.
