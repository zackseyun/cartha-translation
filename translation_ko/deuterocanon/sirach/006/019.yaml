base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/006/019.yaml
  text: Draw near to her like one who plows and reaps[a], and wait for her abundant produce. For in her service you will labor only a little[b], and before long you will eat her fruit.
  footnotes:
  - marker: a
    text: Greek reads 'like one who plows and sows' instead of 'plows and reaps.'
    reason: textual_variant
  - marker: b
    text: Hebrew literally says 'tomorrow'; the sense here is likely 'soon' or 'before long,' supported by the Greek's 'quickly.'
    reason: lexical_alternative
translation:
  language: ko
  text: 밭 가는 자와 거두는 자처럼 그 여인에게 가까이 가고, 그 여인의 풍성한 소출을 기다리십시오. 그 여인의 봉사 가운데서는 수고가 조금뿐이며, 곧 그 여인의 열매를 먹게 될 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 '뿌리는 자'로 되어 있어, 히브리어의 '거두는 자'와 다릅니다.
    reason: textual_variant
  - marker: b
    text: 히브리어는 문자적으로 '내일'이지만, 여기서는 '곧' 또는 '머지않아'라는 뜻으로 읽는 것이 자연스럽습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּחוֹרֵשׁ וּכְקוֹצֵר
  english_pob_choice: like one who plows and reaps
  chosen_korean: 밭 가는 자와 거두는 자처럼
  alternatives_korean:
  - 갈아엎는 자와 거두는 자처럼
  - 농부처럼
  lexicon: HALOT
  rationale: 히브리어의 농경적 비유를 살리되, 한국어에서 자연스러운 병렬 표현으로 옮겼습니다. '거두는 자'는 수확의 동작을 직접 드러냅니다.
- source_word: קְרַב אֵלֶיהָ
  english_pob_choice: Draw near to her
  chosen_korean: 그 여인에게 가까이 가고
  alternatives_korean:
  - 그 여인에게 다가가고
  - 그 여인에게 접근하고
  lexicon: HALOT
  rationale: קְרַב의 명령형은 '가까이 가다/다가가다'로 옮길 수 있으며, 지혜를 의인화한 문맥을 고려해 직설적이면서도 자연한 표현을 택했습니다.
- source_word: וְקַוֵּה לְרֹב תְּבוּאָתָהּ
  english_pob_choice: wait for her abundant produce
  chosen_korean: 그 여인의 풍성한 소출을 기다리십시오
  alternatives_korean:
  - 그 여인의 많은 수확을 바라십시오
  - 그 여인의 풍성한 열매를 기대하십시오
  lexicon: HALOT
  rationale: תבואה는 '소출/수확' 계열이므로 '소출'이 가장 직접적입니다. רֹב은 양적 풍성함을 나타내므로 '풍성한'으로 살렸습니다.
- source_word: בַעֲבֹדָתָהּ מְעַט תַּעֲבוֹד
  english_pob_choice: in her service you will labor only a little
  chosen_korean: 그 여인의 봉사 가운데서는 수고가 조금뿐이며
  alternatives_korean:
  - 그 여인을 섬기는 일에서는 조금만 수고하며
  - 그 여인을 위해 일하는 수고는 조금뿐이며
  lexicon: HALOT
  rationale: עבודה는 '일/노동/봉사'를 모두 아우르지만, 지혜를 향한 헌신의 뉘앙스를 살려 '봉사'로 옮겼습니다. '수고'는 노동의 부담을 한국어에서 자연스럽게 전달합니다.
- source_word: וּלְמָחָר
  english_pob_choice: before long / soon
  chosen_korean: 곧
  alternatives_korean:
  - 머지않아
  - 내일이면
  lexicon: HALOT
  rationale: 히브리어의 문자적 '내일'보다 문맥상 가까운 시점을 가리키는 관용적 용법으로 읽어, 한국어에서는 간결한 '곧'이 가장 자연스럽습니다.
- source_word: פִּרְיָהּ
  english_pob_choice: her fruit
  chosen_korean: 그 여인의 열매
  alternatives_korean:
  - 그 여인의 소출
  - 그 여인의 과실
  lexicon: HALOT
  rationale: 의인화된 지혜의 이미지를 유지하기 위해 여성 대명사에 대응되는 '그 여인의'를 유지했고, פְּרִי를 한국어 성경 문맥에 익숙한 '열매'로 옮겼습니다.
theological_decisions:
- issue: 지혜의 의인화 유지
  chosen_reading: 지혜를 여성으로 지칭하는 문맥을 따라 '그 여인'을 일관되게 사용했습니다.
  alternative_readings:
  - '''그것''으로 중성화하여 추상화함'
  rationale: 본문은 지혜를 한 여성으로 인격화해 초청합니다. 이를 중성화하면 문학적 힘과 문맥의 수사적 효과가 약해집니다.
  doctrine_reference: 'Translation philosophy: source-text primacy and preservation of literary-theological texture'
- issue: לְמָחָר의 시간 표현
  chosen_reading: 문자적 '내일' 대신 문맥적 의미인 '곧'으로 번역했습니다.
  alternative_readings:
  - '''내일'''
  - '''머지않아'''
  rationale: 지혜문학의 권면에서 '내일'은 시간표시보다 가까운 장래를 뜻하는 관용으로 읽히며, 병행하는 그리스어의 '빨리'도 이를 지지합니다.
  doctrine_reference: 'Source comparison: Hebrew primary with Greek parallel as consistency check'
