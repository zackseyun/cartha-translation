  text: Be eager to hear every discourse[a], and do not let a proverb of understanding escape you.
  footnotes:
  - marker: a
    text: 'Greek parallel: ''Stand in the company of elders, and if anyone is wise, attach yourself to him.'' The surviving Hebrew witness differs substantially here; the main text follows the Hebrew, since Hebrew survives for this verse.'
    reason: alternative_reading
translation:
  language: ko
  text: 모든 말에 귀 기울이기를 갈망하고, 지혜의 속담이 여러분에게서 빠져나가지 않게 하십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 평행문은 ‘장로들 가운데 서라. 그리고 지혜로운 사람이 누구든 그에게 달라붙으라’라고 다릅니다. 이 절의 살아 있는 히브리어 증거는 상당히 다르므로, 주본문은 히브리어를 따릅니다.
    reason: alternative_reading
lexical_decisions:
- source_word: כָּל שִׂיחָה
  english_pob_choice: every discourse
  chosen_korean: 모든 말
  alternatives_korean:
  - 모든 담화
  - 모든 대화
  - 모든 말씀
  lexicon: HALOT
  rationale: שִׂיחָה는 일상적 대화보다 넓게 ‘말/담화’를 가리킬 수 있으므로, 한국어에서는 자연스럽고 포괄적인 ‘모든 말’로 옮겨 청자의 개방성을 살렸습니다.
- source_word: חֲפוֹץ
  english_pob_choice: Be eager
  chosen_korean: 갈망하고
  alternatives_korean:
  - 기꺼이 여기고
  - 열심히 듣고자 하고
  - 듣기를 바라며
  lexicon: HALOT
  rationale: 명령형의 적극적 태도를 드러내기 위해 단순한 의지보다 더 강한 내적 열망을 나타내는 ‘갈망하고’를 선택했습니다.
- source_word: מְשַׁל בִּינָה
  english_pob_choice: a proverb of understanding
  chosen_korean: 지혜의 속담
  alternatives_korean:
  - 이해의 속담
  - 분별의 잠언
  - 깨달음의 격언
  lexicon: HALOT
  rationale: מָשָׁל은 지혜문학에서 속담/잠언을 뜻하므로 ‘속담’으로 자연스럽게 살리고, בִּינָה는 이해·분별의 의미를 담아 ‘지혜’로 압축했습니다.
- source_word: אַ ל יֵצְאֶךָּ
  english_pob_choice: do not let ... escape you
  chosen_korean: 여러분에게서 빠져나가지 않게 하십시오
  alternatives_korean:
  - 여러분이 놓치지 않게 하십시오
  - 여러분 곁을 떠나지 않게 하십시오
  - 여러분에게서 사라지지 않게 하십시오
  lexicon: HALOT
  rationale: 히브리어 관용구는 ‘놓치다’의 의미를 포함하므로, 단순히 ‘듣다’보다 기억과 붙들기를 아우르는 ‘빠져나가지 않게 하십시오’로 옮겼습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 평행문의 차이
  chosen_reading: 주본문은 살아 있는 히브리어 본문을 따르고, 그리스어의 ‘장로들 가운데 서라’는 다른 전통은 본문에 끌어오지 않았습니다.
  alternative_readings:
  - 그리스어에 따라 ‘장로들 가운데 서 있으십시오. 그리고 지혜로운 사람이 있으면 그에게 달라붙으십시오.’로 옮김
  rationale: 시라크서는 히브리어가 보존된 경우 히브리어를 우선하므로, 이 절의 큰 차이는 주본문에 반영하지 않고 병행 증거로만 존중하는 것이 맞습니다.
  doctrine_reference: 'PHILOSOPHY.md: translate from Hebrew where Sirach survives; use Greek parallel as parallel witness only.'
