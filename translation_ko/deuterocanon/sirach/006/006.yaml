    text: 히브리어의 בעל סוד는 문자적으로는 ‘비밀/내밀한 의논의 소유자’에 가깝고, 그리스어는 ‘조언자들’(σύμβουλοί)로 옮깁니다. 본문은 히브리어의 친밀한 신뢰 관계를 살렸습니다.
    reason: source_note
