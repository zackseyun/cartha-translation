translation:
  language: ko
  text: 그대와 평화롭게 지내는 사람들은 많게 하되, 그대의 비밀을 나눌 사람은 천 명 가운데 하나만 두십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 בעל סוד는 직역하면 ‘그대의 비밀/내밀한 의논에 참여하는 사람’이라는 뜻입니다. 그리스어는 ‘그대의 조언자들’(οἱ δὲ σύμβουλοί σου)로 읽습니다. 본문은 히브리어의 친밀한 신뢰 관계의 뉘앙스를 따랐습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אַנְשֵׁי שְׁלוֹמְךָ
