  - 천 명 가운데서도 하나
  lexicon: HALOT
  rationale: 희귀성과 탁월함을 나타내는 관용적 표현을 한국어에서 가장 자연스럽게 살렸습니다.
theological_decisions:
- issue: '히브리어 본문과 그리스어 병행본문의 차이: ‘confidant’ vs. ‘counselors/advisers’'
  chosen_reading: 본문은 히브리어의 ‘신뢰하는 벗/내밀한 상대’ 의미를 우선하고, 그리스어가 제시하는 조언자 의미는 배경으로만 유지했습니다.
  alternative_readings:
  - 그대의 조언자
  - 그대의 상담자
  rationale: 이 절의 핵심 대비는 ‘많은 평화의 사람들’과 ‘극히 드문 내밀한 신뢰 관계’이며, 히브리어 סוד가 단순한 직무적 조언보다 더 깊은 친밀성을 요구하므로 이를 본문에 반영했습니다.
  doctrine_reference: 'PHILOSOPHY.md: Hebrew Sirach is primary where it survives; Greek parallel as audit support'
