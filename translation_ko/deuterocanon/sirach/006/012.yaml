lexical_decisions:
- source_word: תַּשִּׂיגְךָ / ἐὰν ταπεινωθῇς
  english_pob_choice: If trouble overtakes you / If you are brought low
  chosen_korean: 재앙이 네게 닥치면
  alternatives_korean:
  - 네가 낮아지면
  - 환난이 네게 닥치면
  - 고난이 너를 덮치면
  lexicon: HALOT; BDAG
  rationale: 히브리어 본문은 ‘악/재앙이 너를 따라잡다’의 뜻이고, 그리스어 평행본문은 ‘낮아지다’로 읽히므로, 본문이 남아 있는 히브리어를 본문으로 따르되 한국어에서는 자연스러운 위기 상황으로 옮겼습니다.
- source_word: רָעָה
  english_pob_choice: trouble
  chosen_korean: 재앙
  alternatives_korean:
  - 악
  - 불행
  - 환난
  lexicon: HALOT
  rationale: 여기서는 도덕적 ‘악’이 아니라 닥쳐오는 불운·재난을 가리키므로, 현대 한국어에서 강하고도 자연한 ‘재앙’을 택했습니다.
- source_word: יֵהָפֵךְ בְּךָ
  english_pob_choice: he will turn against you
  chosen_korean: 그는 너를 배반하고
  alternatives_korean:
  - 그는 너에게 등을 돌리고
  - 그는 너를 향해 돌아서고
  - 그는 너에게 불리하게 돌변하고
  lexicon: HALOT
  rationale: 문맥상 친구의 관계가 적대적으로 뒤집히는 뜻이므로, 단순한 방향 전환보다 관계적 배신을 드러내는 ‘배반하고’로 옮겼습니다.
- source_word: וּמִפָּנֶיךָ
  english_pob_choice: from your presence
  chosen_korean: 네 앞에서
  alternatives_korean:
  - 네 얼굴 앞에서
  - 네 존재 앞에서
  - 네 면전에서
  lexicon: HALOT
  rationale: 직역은 ‘네 얼굴/앞에서’이지만, 한국어에서는 사람 앞에서 숨는다는 의미를 가장 자연하게 살리는 ‘네 앞에서’를 썼습니다.
- source_word: יִסָּתֵר
  english_pob_choice: hide himself
  chosen_korean: 숨을 것입니다
  alternatives_korean:
  - 몸을 숨길 것입니다
  - 피할 것입니다
  - 자취를 감출 것입니다
  lexicon: HALOT
  rationale: 수동형/재귀적 의미를 문맥상 능동적으로 풀어, 곤경을 피하려는 비열한 회피를 간결하게 드러냈습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 평행본문의 차이
  chosen_reading: 본문은 히브리어 ‘재앙이 네게 닥치면’을 따르고, 그리스어의 ‘네가 낮아지면’은 각주로 보존합니다.
  alternative_readings:
  - 네가 낮아지면, 그는 너를 거스르고 네 앞에서 숨을 것입니다.
  rationale: 집회서에서는 현존하는 히브리어를 우선하되, 그리스어와의 긴장을 숨기지 않는 것이 번역 원칙에 맞습니다. 그래서 본문은 히브리어를 따르고, 그리스어는 대안으로 남깁니다.
  doctrine_reference: 'PHILOSOPHY.md: 히브리어가 남아 있을 때는 히브리어를 본문으로 두고, 본문 차이를 각주로 투명하게 보존'
