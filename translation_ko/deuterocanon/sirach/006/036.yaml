  chosen_reading: 본문은 현존 히브리어를 따르고, 그리스어 병행은 각주로 투명하게 남겼습니다.
  alternative_readings:
  - '그리스어: ‘지혜로운 사람을 보거든 일찍 그에게 가고, 네 발이 그의 문지방을 닳게 하라’'
  rationale: 시라서는 히브리어가 보존된 곳에서는 히브리어를 본문으로 삼는다는 프로젝트 원칙에 따라 번역하되, 이 절은 전승 차이가 매우 크므로 대조 본문을 각주로 보존해야 합니다.
  doctrine_reference: 'PHILOSOPHY.md: translate Sirach from Hebrew where it survives; use Greek in view'
