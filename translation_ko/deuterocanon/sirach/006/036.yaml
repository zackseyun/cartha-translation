lexical_decisions:
- source_word: וְהִתְבּוֹנַנְתָּ
  english_pob_choice: Reflect on
  chosen_korean: 되새기십시오
  alternatives_korean:
  - 생각하십시오
  - 곰곰이 살피십시오
  - 묵상하십시오
  lexicon: HALOT
  rationale: בין의 히트보넨형은 단순한 인지가 아니라 주의 깊게 곱씹는 성찰을 뜻하므로, 문맥상 자연스럽고 반복적 사고의 뉘앙스를 살리는 ‘되새기십시오’를 택했습니다.
- source_word: בְּיִרְאַת עֶלְיוֹן
  english_pob_choice: the fear of the Most High
  chosen_korean: 지극히 높으신 분에 대한 두려움
  alternatives_korean:
  - 지극히 높으신 분을 경외하는 마음
  - 지극히 높으신 분에 대한 경외
  lexicon: HALOT
  rationale: יִרְאָה는 지혜문학에서 단순 감정보다 하나님 앞의 경외적 두려움을 가리키므로, 관용구를 유지하면서도 ‘두려움’으로 원문의 긴장감을 살렸습니다.
- source_word: וּבְמִצוֹתָיו
  english_pob_choice: on his commandments
  chosen_korean: 그의 계명들을
  alternatives_korean:
  - 그의 명령들을
  - 그의 규례들을
  lexicon: HALOT
  rationale: מִצְוֹת는 율법적 명령들을 뜻하므로, POB의 ‘commandments’에 맞춰 ‘계명들’로 옮겨 원문의 종교적·언약적 어조를 유지했습니다.
- source_word: וֶהְגֵה תָמִיד
  english_pob_choice: meditate continually
  chosen_korean: 끊임없이 묵상하십시오
  alternatives_korean:
  - 늘 묵상하십시오
  - 항상 묵상하십시오
  - 계속 마음에 두십시오
  lexicon: HALOT
  rationale: הגה는 지혜문맥에서 낮게 중얼거리며 되뇌는 묵상까지 포함하는데, 한국어의 ‘묵상하다’가 이 지속적 내면 행위를 가장 자연스럽게 전달합니다.
