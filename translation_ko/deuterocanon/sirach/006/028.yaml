  text: For in the end you will find its rest[b][a], and it will turn for you into delight.
  footnotes:
  - marker: a
    text: Hebrew 'afterward/back'; Greek parallel 'at the last.' The sense is that perseverance with wisdom leads eventually to rest and joy.
    reason: lexical_alternative
  - marker: b
    text: The feminine suffixes refer to wisdom personified in the surrounding passage; English 'its' is used here for smoother style.
    reason: lexical_alternative
translation:
  language: ko
  text: 그것의 끝에서 그 휴식을 찾게 되고, 그것은 여러분에게 기쁨이 됩니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘뒤에/나중에’, 그리스어는 ‘마침내’의 뜻을 반영합니다. 의미는 지혜를 끝까지 따를 때 결국 쉼과 기쁨에 이른다는 것입니다.
    reason: lexical_alternative
  - marker: b
    text: 여기서 여성형 지시어는 앞선 문맥의 의인화된 지혜를 가리킵니다. 한국어는 문맥상 ‘그것’으로 자연스럽게 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְאָחוֹר
  english_pob_choice: in the end
  chosen_korean: 그것의 끝에서
  alternatives_korean:
  - 마침내
  - 나중에
  - 뒤에
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘뒤로/나중에’를 가리키며, 영어 POB의 시간적 결론 감각을 따라 ‘끝에서’로 옮기면 결과의 시점을 자연스럽게 살릴 수 있습니다.
- source_word: תִּמְצָא
  english_pob_choice: you will find
  chosen_korean: 찾게 되고
  alternatives_korean:
  - 찾을 것입니다
  - 발견할 것입니다
  lexicon: HALOT
  rationale: מצא의 기본 뜻인 ‘찾다/발견하다’를 직접 살리면서, 지혜문학 문맥의 결과적 흐름에 맞게 한국어에서는 연결형으로 처리했습니다.
- source_word: מְנוּחָתָהּ
  english_pob_choice: its rest
  chosen_korean: 그 휴식
  alternatives_korean:
  - 그 안식
  - 그의 휴식
  - 그녀의 휴식
  lexicon: HALOT
  rationale: 문맥상 의인화된 지혜를 가리키지만 한국어에서는 소유대명사와 성 구분을 과도하게 드러내지 않고, 본문의 평안/쉼의 의미를 직접적으로 살렸습니다.
- source_word: וְתֵהָפֵךְ לְךָ לְתַעֲנוּג
  english_pob_choice: and it will turn for you into delight
  chosen_korean: 그것은 여러분에게 기쁨이 됩니다
  alternatives_korean:
  - 그것은 여러분에게 즐거움으로 바뀝니다
  - 그것은 여러분에게 즐거움이 됩니다
  - 그것은 여러분에게 기쁨으로 변합니다
  lexicon: HALOT
  rationale: הפך는 단순한 ‘되다’보다 ‘뒤집히다/변하다’의 변환 이미지를 가지지만, 한국어에서는 결과 상태를 자연스럽게 드러내기 위해 ‘기쁨이 됩니다’로 옮겼습니다.
theological_decisions:
- issue: 의인화된 지혜의 여성형 지시어
  chosen_reading: 문맥의 지혜를 가리키는 여성형 소유·지시를 한국어에서는 성 구분 없이 ‘그것’으로 처리했습니다.
  alternative_readings:
  - 그녀의 휴식
  - 지혜의 휴식
  rationale: 히브리어와 그리스어는 지혜를 여성형으로 가리키지만, 한국어 합쇼체 본문에서는 의인화를 과도하게 강조하지 않으면서도 문맥상 지혜를 떠올리게 하는 방식이 더 자연스럽습니다.
  doctrine_reference: Translation philosophy §5 (key-term consistency with documented exception)
