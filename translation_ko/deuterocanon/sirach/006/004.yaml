translation:
  language: ko
  text: 사나운 영혼은 그 주인을 멸망시키며, 원수의 기쁨이 그에게 닥칩니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 말미의 동사는 문자적으로 ‘그들을 따라잡을 것이다/그들에게 이를 것이다’라는 복수형처럼 보이므로 수와 의미에 난점이 있습니다. 그리스어 평행본문은 ‘그를 원수들의 기쁨거리로 만들 것이다’라고 읽습니다.
    reason: textual_variant
lexical_decisions:
- source_word: נֶפֶשׁ עַזָּה
  english_pob_choice: fierce soul
  chosen_korean: 거친 영혼
  alternatives_korean:
  - 사나운 영혼
  - 강한 영혼
  - 포악한 영혼
  lexicon: HALOT
  rationale: נֶפֶשׁ는 여기서 사람의 내적 성향을 가리키며, עַזָּה는 단순한 강함보다 통제되지 않은 거친 성격을 뜻합니다. '거친 영혼'은 이 부정적 성격을 자연스럽게 드러내면서도 본문의 인류학적 힘을 살립니다.
- source_word: תַּשְׁחִית
  english_pob_choice: destroys
  chosen_korean: 멸망시키고
  alternatives_korean:
  - 파괴하고
  - 망하게 하고
  - 훼손하고
  lexicon: HALOT
  rationale: שחת의 의미는 파괴·멸망·부패를 포함하지만, 문맥상 자기 파괴의 결과를 경고하므로 '멸망시키다'가 가장 강하고 분명합니다.
- source_word: בְּעָלֶיהָ
  english_pob_choice: its owner
  chosen_korean: 그 주인을
  alternatives_korean:
  - 그 소유자를
  - 그 소유주를
  - 그를 소유한 이를
  lexicon: HALOT
  rationale: בעל은 소유자/주인을 뜻하며, 본문과 평행하는 그리스어 κτησάμενον도 소유의 의미를 지지합니다. '주인'은 한국어에서 간결하고 힘 있게 전달됩니다.
- source_word: וְשִׂמְחַת שׂוֹנֵא תַּשִּׂיגֵם
  english_pob_choice: and the rejoicing of an enemy overtakes him
  chosen_korean: 원수의 즐거움이 그를 덮칩니다
  alternatives_korean:
  - 원수의 기쁨이 그를 따라잡습니다
  - 원수의 즐거움이 그에게 미칩니다
  - 원수들의 기쁨이 그를 덮칩니다
  lexicon: HALOT
  rationale: שׂמחה는 '기쁨/즐거움'으로 옮길 수 있고, תַּשִּׂיג는 '따라잡다/미치다/덮치다'의 뜻을 가집니다. 히브리어는 수적·문법적으로 다소 난점이 있으나, 그리스어 평행본문의 ‘원수들의 즐거움’이라는 뜻을 따라 피해자가 원수의 환호에 잠식되는 그림을 살렸습니다.
theological_decisions:
- issue: 난해한 마지막 절의 처리에서 히브리어와 그리스어 평행본문의 관계
  chosen_reading: 주된 번역은 히브리어를 따르되, 마지막 절은 그리스어 평행본문이 지지하는 ‘원수의 즐거움’이라는 의미를 반영했습니다.
  alternative_readings:
  - ‘원수의 기쁨이 그들을 따라잡습니다’
  - ‘원수들의 즐거움이 그를 따라잡습니다’
  rationale: 이 절은 히브리어 말미의 수적 불일치와 의미상 난점이 있어 직역만으로는 자연스러운 본문 의미를 충분히 드러내기 어렵습니다. 그리스어 평행본문은 이 문맥에서 지혜문학적 경고의 뜻을 분명하게 해 주므로, 본문이 의도한 결과를 한국어로 명료하게 옮겼습니다.
  doctrine_reference: 'Sirach 번역 원칙: 히브리어 본문을 우선하되, 명백한 난문은 공인된 평행본문으로 보완'
