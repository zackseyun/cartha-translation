  source_fidelity: 첫 절은 히브리어 נֶפֶשׁ עַזָּה와 תַּשְׁחִית בְּעָלֶיהָ를 대체로 충실히 옮겼습니다. 그러나 마지막 절의 תַּשִּׂיגֵם은 기본적으로 ‘그들을/그들에게 이르다·따라잡다’라는 형태여서, ‘덮칩니다’는 다소 과도하게 해석적입니다. 단수 수혜자 ‘그에게’는 그리스어 평행본문의 αὐτόν과 영어 POB의 처리에 따라 본문에서 유지할 수 있으나, 히브리어의 수적 난점은 정확히 밝혀야 합니다.
  naturalness: ‘거친 영혼’은 현대 표준 한국어에서 성격을 가리키는 표현으로 다소 어색합니다. ‘사나운 영혼’이 עַזָּה의 통제되지 않은 강함을 더 자연스럽게 전달합니다. ‘원수의 기쁨이 그에게 닥칩니다’는 원수의 기쁨이 그 사람에게 불리한 결과로 미친다는 문맥을 자연스럽게 나타내며, 합쇼체에도 맞습니다.
