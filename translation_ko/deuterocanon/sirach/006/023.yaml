  chosen_reading: 이 절은 혼재된 히브리어 본문보다 의미가 분명한 그리스어 본문을 따라 번역했습니다.
  alternative_readings:
  - 현존 히브리어 본문을 직역하기
  - 히브리어와 그리스어를 절충하여 번역하기
  rationale: 제시된 히브리어는 이 절과 맞지 않는 별개의 내용처럼 보이므로, 영어 POB의 감사 추적과 같이 그리스어 병행본문을 실제 번역 기준으로 삼는 것이 본문의 의도를 가장 투명하게 보존합니다.
  doctrine_reference: 'deuterocanonical translation principle: use the most coherent extant witness while preserving textual uncertainty transparently.'
