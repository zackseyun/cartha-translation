base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/006/023.yaml
  text: Listen, my son, and accept my judgment, and do not reject my counsel.
  footnotes:
  - marker: a
    text: 'The extant Hebrew line supplied in Zone 1 appears to be a mismatched or corrupt witness for this verse; the translation therefore follows the Greek parallel: ''Listen, child, and receive my judgment, and do not refuse my counsel.'''
    reason: textual_variant
  - marker: b
    text: Or 'my child' for 'my son'; Greek τέκνον is broader in sense, but the instructional idiom here is rendered gender-accurately.
    reason: lexical_alternative
  - marker: c
    text: Or 'receive my instruction/opinion' for 'accept my judgment'; Greek γνώμη can carry several nuances of considered thought or counsel.
    reason: lexical_alternative
translation:
  language: ko
  text: 들으십시오, 내 아들아, 내 판단을 받아들이고 내 충고를 거절하지 마십시오.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 현존 히브리어 본문은 이 절과 불일치하는 것으로 보이므로, 번역은 그리스어 병행본문을 따랐습니다.
    reason: textual_variant
  - marker: b
    text: τέκνον은 문자적으로는 ‘아이/자녀’도 될 수 있지만, 여기서는 교훈을 주는 호칭으로 ‘아들’로 옮겼습니다.
    reason: lexical_alternative
  - marker: c
    text: γνώμη는 ‘의견’이나 ‘생각’도 뜻할 수 있으나, 여기서는 숙고된 ‘판단’의 의미로 옮겼습니다.
    reason: lexical_alternative
