base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/006/009.yaml
  text: There is a friend who turns into an enemy[a], and he will expose the quarrel that brings your disgrace.
  footnotes:
  - marker: a
    text: Or, more literally, 'and the quarrel of your disgrace he will expose.' The Hebrew construction is terse; the translation brings out the probable sense that the dispute becomes a source of public shame.
    reason: lexical_alternative
translation:
  language: ko
  text: 친구인 듯하다가 원수가 되는 사람이 있으며, 그는 당신의 수치를 드러내는 다툼을 폭로합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘수치를 드러내는 다툼’은 히브리어의 압축된 소유 관계를 풀어 옮긴 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵשׁ אוֹהֵב
  english_pob_choice: There is a friend
  chosen_korean: 친구인 듯하다가
  alternatives_korean:
  - 한 친구가
  - 사랑하는 이가
  - 친구가
  lexicon: HALOT
  rationale: אוֹהֵב은 문자적으로는 ‘사랑하는 이/사람’이지만, 지혜문맥과 헬라어 φίλος를 따라 관계적 의미의 ‘친구’로 옮기는 것이 자연스럽습니다. 문장의 경계어미를 살려 뒤의 বিপ변을 대비시키기 위해 ‘친구인 듯하다가’를 택했습니다.
- source_word: נֶהְפָּךְ לְשׂוֹנֵא
  english_pob_choice: who turns into an enemy
  chosen_korean: 원수가 되는 사람이 있으며
  alternatives_korean:
  - 적으로 변하는 사람이 있으며
  - 원수로 바뀌는 사람이 있으며
  - 원수가 되어 버리는 사람이 있으며
  lexicon: HALOT
  rationale: נהפך לְ는 관계의 반전을 나타내므로, 의미를 직접 드러내는 ‘원수가 되는’으로 옮겼습니다. ‘원수’는 단순한 반대편이 아니라 관계 파괴의 강도를 살립니다.
- source_word: רִיב חֶרְפָּתְךָ
  english_pob_choice: the quarrel that brings your disgrace
  chosen_korean: 당신의 수치를 드러내는 다툼
  alternatives_korean:
  - 당신의 수치를 가져오는 다툼
  - 당신의 수치가 되는 다툼
  - 수치의 다툼
  lexicon: HALOT
  rationale: רִיב은 다툼·분쟁의 뜻이 있고, חֶרְפָּה는 ‘수치/모욕’입니다. 히브리어의 압축된 소유·관계 구조를 한국어에서는 ‘당신의 수치를 드러내는’으로 풀어, 분쟁이 공개적 수치로 이어지는 뜻을 살렸습니다.
- source_word: יַחְשֹׂף
  english_pob_choice: he will expose
  chosen_korean: 폭로합니다
  alternatives_korean:
  - 드러냅니다
  - كشف합니다
  - 드러낼 것입니다
  lexicon: HALOT
  rationale: חשׂף는 ‘벗기다, 드러내다, 폭로하다’의 뜻이며, 여기서는 수치스러운 분쟁을 남에게 알리는 뉘앙스가 강합니다. 현대 한국어에서는 ‘폭로합니다’가 가장 직접적으로 대응합니다.
theological_decisions:
- issue: 지혜문학의 경고문을 한국어에서 얼마나 직접적으로 표현할지
  chosen_reading: 도덕적·사회적 위험성을 선명하게 드러내는 직설적 표현을 유지했습니다.
  alternative_readings:
  - 더 완곡한 표현으로 누그러뜨리기
  - ‘수치’ 대신 ‘부끄러움’으로 약화하기
  rationale: 본문은 신뢰 관계의 붕괴와 공개적 수치를 경고하는 잠언적 진술이므로, 완곡화하면 원문의 경고 강도가 약해집니다.
  doctrine_reference: 지혜문학의 경고와 훈계는 본문 수사 자체의 강도를 보존해야 합니다.
