  - 그리스어를 따라 ‘자기 영혼의 계획 속에서 자신을 높이지 마십시오’로 옮기기
  rationale: 이 절은 히브리어가 난해하고 그리스어 평행문이 의미를 분명히 하므로, 두 증거를 함께 따라 자기중심적 욕망이 파멸을 낳는다는 경고를 보존했습니다.
  doctrine_reference: 'PHILOSOPHY.md: 집회서는 현존 히브리어를 우선하되, 의미가 불명확한 곳에서는 그리스어 평행문을 실제 번역 입력으로 사용한다.'
