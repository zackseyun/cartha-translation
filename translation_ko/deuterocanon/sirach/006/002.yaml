base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/006/002.yaml
  text: Do not fall into the power of your own desire[a], lest your strength be consumed against you.
  footnotes:
  - marker: a
    text: 'Hebrew: ''Do not fall into the hand of your soul''; the Greek parallel reads, ''Do not exalt yourself in the counsel of your soul, lest your soul be torn apart like a bull.'' The Hebrew second clause is difficult, so the translation follows the shared sense of warning against self-indulgent desire leading to ruin.'
    reason: alternative_reading
translation:
  language: ko
  text: 자기 욕망의 지배에 빠지지 마십시오[a]. 그러지 않으면 당신의 힘이 소진될 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘네 영혼(자아)의 손에 떨어지지 말라’입니다. 그리스어 평행문은 ‘네 영혼의 뜻을 따라 자신을 높이지 말라. 그러지 않으면 네 영혼이 황소처럼 찢길 것이다’라고 읽습니다. 히브리어 둘째 절은 난해하므로, 이 번역은 두 전승이 함께 가리키는 자기 욕망에 자신을 내맡길 때 닥치는 파멸의 경고를 따릅니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תִּפּוֹל בְּיַד
  english_pob_choice: Do not fall into the power of
