  - 당신의 능력
  - 당신의 기력
  lexicon: HALOT
  rationale: חיל은 문맥에 따라 ‘힘, 역량, 재물’이 될 수 있으나, 이 절의 자기 파괴 경고에는 ‘힘’이 가장 직접적으로 맞습니다.
theological_decisions:
- issue: 히브리어 난구와 그리스어 평행문의 반영
  chosen_reading: 본문의 경고를 ‘자기 욕망에 빠져 자기 힘이 무너지는 것’으로 이해해 옮겼습니다.
  alternative_readings:
