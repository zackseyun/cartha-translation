  lexicon: HALOT
  rationale: 이 히브리어는 본문이 난해하므로, 영어 POB처럼 파괴·소진의 경고를 살리되 한국어에서는 ‘무너져 내리다’로 격렬한 붕괴감을 자연스럽게 표현했습니다.
- source_word: חֵילֵךָ
  english_pob_choice: your strength
  chosen_korean: 당신의 힘
  alternatives_korean:
