  text: Do not fall into the power of your own desire[a], lest your strength be consumed against you.
  footnotes:
  - marker: a
    text: 'Hebrew: ''Do not fall into the hand of your soul''; the Greek parallel reads, ''Do not exalt yourself in the counsel of your soul, lest your soul be torn apart like a bull.'' The Hebrew second clause is difficult, so the translation follows the shared sense of warning against self-indulgent desire leading to ruin.'
    reason: alternative_reading
translation:
  language: ko
  text: 자기 욕망의 힘에 빠지지 마십시오[a]. 그러면 당신의 힘이 당신에게서 무너져 내립니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘네 영혼의 손에 떨어지지 말라’에 가깝고, 그리스어 평행문은 ‘네 영혼의 계획에서 스스로를 높이지 말라’고 읽습니다. 본문이 난해하므로, 번역은 두 전승이 함께 가리키는 자기욕망 경고를 따릅니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תִּפּוֹל בְּיַד
  english_pob_choice: Do not fall into the power of
  chosen_korean: …의 힘에 빠지지 마십시오
  alternatives_korean:
  - …의 손에 떨어지지 마십시오
  - …에 굴복하지 마십시오
  - …에 자신을 내맡기지 마십시오
  lexicon: HALOT
  rationale: 히브리어 직역의 ‘손에 떨어지다’는 한국어로는 자연스럽게 ‘…의 힘에 빠지다’로 옮겨, 자기 욕망에 붙잡혀 지배당하는 뜻을 드러냈습니다.
- source_word: נַפְשְׁךָ
  english_pob_choice: your own desire
  chosen_korean: 자기 욕망
  alternatives_korean:
  - 자기 영혼
  - 자기 혼
  - 자기 마음
  lexicon: HALOT
  rationale: נפש는 여기서 단순한 ‘영혼’보다 내적 충동, 욕구를 가리키므로, 영어 POB의 해석을 따라 ‘자기 욕망’으로 옮겼습니다.
- source_word: וּתְעַבֶּה
  english_pob_choice: lest your strength be consumed
  chosen_korean: 당신의 힘이 당신에게서 무너져 내립니다
  alternatives_korean:
  - 당신의 힘이 당신에게서 소모됩니다
  - 당신의 힘이 찢겨 나갑니다
  - 당신의 힘이 소비됩니다
  lexicon: HALOT
  rationale: 이 히브리어는 본문이 난해하므로, 영어 POB처럼 파괴·소진의 경고를 살리되 한국어에서는 ‘무너져 내리다’로 격렬한 붕괴감을 자연스럽게 표현했습니다.
- source_word: חֵילֵךָ
  english_pob_choice: your strength
  chosen_korean: 당신의 힘
  alternatives_korean:
  - 당신의 재산
  - 당신의 능력
  - 당신의 기력
  lexicon: HALOT
  rationale: חיל은 문맥에 따라 ‘힘, 역량, 재물’이 될 수 있으나, 이 절의 자기 파괴 경고에는 ‘힘’이 가장 직접적으로 맞습니다.
theological_decisions:
- issue: 히브리어 난구와 그리스어 평행문의 반영
  chosen_reading: 본문의 경고를 ‘자기 욕망에 빠져 자기 힘이 무너지는 것’으로 이해해 옮겼습니다.
  alternative_readings:
  - 히브리어 표면형을 따라 ‘자기 영혼의 손에 떨어지지 마십시오’로 옮기기
  - 그리스어를 따라 ‘자기 영혼의 계획 속에서 자신을 높이지 마십시오’로 옮기기
  rationale: 이 절은 히브리어가 난해하고 그리스어 평행문이 의미를 분명히 하므로, 두 증거를 함께 따라 자기중심적 욕망이 파멸을 낳는다는 경고를 보존했습니다.
  doctrine_reference: 'PHILOSOPHY.md: 집회서는 현존 히브리어를 우선하되, 의미가 불명확한 곳에서는 그리스어 평행문을 실제 번역 입력으로 사용한다.'
