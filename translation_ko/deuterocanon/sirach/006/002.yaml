  rationale: 히브리어 직역의 ‘손에 떨어지다’는 한국어로는 자연스럽게 ‘…의 힘에 빠지다’로 옮겨, 자기 욕망에 붙잡혀 지배당하는 뜻을 드러냈습니다.
- source_word: נַפְשְׁךָ
