translation:
  language: ko
  text: 그녀를 존귀의 옷처럼 입고, 영화의 관처럼 그녀를 머리에 쓰게 될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 히브리어의 ‘영화의 관’ 대신 ‘기쁨/환희의 관’(στέφανον ἀγαλλιάματος)으로 읽습니다. 본문은 현존 히브리어 사본의 읽기를 따릅니다.
    reason: alternative_reading
lexical_decisions:
- source_word: בִּגְדֵי כָבוֹד
  english_pob_choice: garments of honor
  chosen_korean: 명예의 옷
  alternatives_korean:
  - 영광의 옷
  - 존귀의 옷
  - 명예로운 옷
  lexicon: HALOT
  rationale: כָבוֹד는 문자적으로 ‘영예/존귀/영광’의 뜻을 가지므로, 구체적 의복 이미지를 살리면서도 의미를 압축하는 ‘명예의 옷’이 가장 자연스럽고 원문의 품위를 유지합니다.
- source_word: תִלְבְּשֶׁנָּה
  english_pob_choice: you will wear her
  chosen_korean: 그 여를 입을 것이며
  alternatives_korean:
  - 그 여를 두를 것이며
  - 그 여를 입히실 것이며
  - 그 여를 걸칠 것이며
  lexicon: HALOT
  rationale: לבש는 ‘입다/착용하다’의 기본 의미이므로, 지혜를 여성 인격체로 가리키는 ‘그 여’를 대상어로 두고 한국어에서도 의복 은유를 직접 살리는 표현을 택했습니다.
- source_word: וַעֲטֶרֶת תִּפְאֶרֶת
  english_pob_choice: a crown of splendor
  chosen_korean: 영화의 관
  alternatives_korean:
  - 아름다움의 관
  - 찬란함의 관
  - 영광의 관
  lexicon: HALOT
  rationale: תִּפְאֶרֶת는 ‘아름다움/장엄함/영화’의 폭이 있으나, 시문맥에서 관의 화려함을 살리는 ‘영화의 관’이 가장 균형적입니다.
- source_word: תְּעַטְּרֶנָּה
  english_pob_choice: you will crown yourself with her
  chosen_korean: 스스로를 두를 것입니다
  alternatives_korean:
  - 스스로를 관을 씌울 것입니다
  - 그 여로 스스로를 관할 것입니다
  - 그 여로 자신을 관으로 삼을 것입니다
  lexicon: HALOT
  rationale: עטר는 ‘관을 씌우다/두르다/장식하다’의 의미를 가지며, 히브리어가 지혜를 매개로 자신을 장식하는 평행구조를 이루므로, 한국어에서는 과장되지 않게 ‘스스로를 두르다’로 표현해 관의 은유를 유지했습니다.
theological_decisions:
- issue: 지혜의 여성 지시대명사 유지
  chosen_reading: ‘그 여’로 지혜의 여성 인격화와 관찰 가능한 원문 수식 관계를 드러냈습니다.
  alternative_readings:
  - 지혜를 여성 대명사 없이 ‘그것’으로 중성화하기
  - 아예 대명사를 생략해 추상화하기
  rationale: 전후 문맥에서 지혜가 여성으로 인격화되어 있으므로, 이를 평면화하지 않고 ‘그 여’로 남겨 문학적·신학적 결을 보존했습니다.
  doctrine_reference: 지혜문학의 인격화 표현과 번역 일관성
