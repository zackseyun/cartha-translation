translation:
  language: ko
  text: 그것은 그에게 무거운 돌처럼[가] 될 것이며, 그는 그것을 벗어던지기를 지체하지 않을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘짐의 돌’에 가깝고, 그리스어 평행본문은 ‘강한 시험의 돌’로 읽어 이 비유가 무게와 시험을 함께 시사합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: כְּאֶבֶן מַשָּׂא
  english_pob_choice: like a heavy stone
  chosen_korean: 무거운 돌처럼
  alternatives_korean:
  - 짐이 되는 돌처럼
  - 부담스러운 돌처럼
  - 무거운 짐돌처럼
  lexicon: HALOT
  rationale: כְּ는 비교를 나타내고, מַשָּׂא 는 ‘짐/부담’의 뜻이므로 한국어에서는 자연스럽게 ‘무거운 돌처럼’으로 옮겨 무게 이미지를 살렸습니다.
- source_word: תִּהְיֶה עָלָיו
  english_pob_choice: will be upon him
  chosen_korean: 그에게 ... 될 것이며
  alternatives_korean:
  - 그 위에 놓일 것이며
  - 그에게 얹힐 것이며
  - 그에게 지워질 것이며
  lexicon: HALOT
  rationale: ‘위에 있다’는 압박감을 한국어에서 가장 자연스럽게 드러내기 위해 ‘그에게 ... 될 것이다’로 처리했습니다.
- source_word: וְלֹא יְאַחֵר
  english_pob_choice: he will not delay
  chosen_korean: 지체하지 않을 것입니다
  alternatives_korean:
  - 머뭇거리지 않을 것입니다
  - 늦추지 않을 것입니다
  - 미루지 않을 것입니다
  lexicon: HALOT
  rationale: 히필 אחר의 핵심은 ‘지체하다/늦추다’이므로, 바로 그 동작을 보존하는 표현을 택했습니다.
- source_word: לְהַשְׁלִיכָה
  english_pob_choice: to throw it off
  chosen_korean: 그것을 벗어던지기를
  alternatives_korean:
  - 그것을 던져 버리기를
  - 그것을 내던지기를
  - 그것을 떨쳐 버리기를
  lexicon: HALOT
  rationale: ‘throw off’의 제거 동작을 한국어에서 가장 직관적으로 전달하는 표현으로 ‘벗어던지다’를 사용했습니다.
theological_decisions:
- issue: 히브리어 ‘짐/무게’ 이미지와 헬라어의 ‘시험/검증’ 뉘앙스 병행
  chosen_reading: 본문은 기본적으로 ‘무거운 돌’의 짐 이미지를 살리되, 주석 각주로 헬라어가 시험/검증의 뉘앙스를 더함을 표시합니다.
  alternative_readings:
  - 시험하는 돌처럼
  - 검증의 돌처럼
  - 무거운 시험 돌처럼
  rationale: 히브리어 본문이 직접적 근거이지만, 제공된 그리스어 병행본문이 δοκιμασίας(시험/검증)를 더하므로 본문에서는 히브리어의 부담 이미지를 유지하고 각주로 차이를 투명하게 드러내는 것이 가장 충실합니다.
  doctrine_reference: 'Sirach source policy: Hebrew primary where extant, Greek parallel consulted for significant nuance; preserve textual tension rather than flatten it.'
