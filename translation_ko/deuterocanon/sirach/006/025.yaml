    reason: textual_variant
lexical_decisions:
- source_word: הַט
  english_pob_choice: Bend
  chosen_korean: 어깨를 낮추다
  alternatives_korean:
  - 굽히다
  - 숙이다
  lexicon: HALOT
  rationale: 어깨를 아래로 내리어 짐을 지는 동작을 자연스러운 현대 한국어로 살렸습니다. '굽히다'보다 몸짓의 방향성이 분명하고, 지혜의 짐을 자원하여 지는 비유를 유지합니다.
- source_word: שִׁכְמְךָ
  english_pob_choice: your shoulder
  chosen_korean: 어깨
  alternatives_korean:
  - 등
  - 목
  lexicon: HALOT
  rationale: 히브리어와 그리스어 모두 신체 부위로서 '어깨'를 가리키므로, 본문의 부담/멍에 이미지를 가장 직접적으로 보존합니다.
- source_word: וְשָׂאֶהָ
  english_pob_choice: and carry her
  chosen_korean: 그것을 메다
  alternatives_korean:
  - 그녀를 지다
  - 그것을 들다
  lexicon: HALOT
  rationale: 지혜를 여성으로 의인화한 문맥을 유지하되, 한국어에서 대상이 비인격화되는 것을 피하기 위해 '그것'을 택했습니다. '메다'는 지속적으로 짐을 지는 의미를 살립니다.
- source_word: בְּתַחְבּוּלוֹתֶיהָ
  english_pob_choice: by her bonds
  chosen_korean: 그 끈
  alternatives_korean:
  - 그 족쇄
  - 그 속박
  - 그 멍에
  lexicon: HALOT / LXX parallel
  rationale: 히브리어는 난해하지만 병행 그리스어가 '그녀의 결박들'을 지지하므로, 구속과 통제를 나타내는 짧은 표지를 본문에 반영했습니다. '끈'은 과도하게 해석하지 않으면서도 얽어매는 이미지를 전달합니다.
theological_decisions:
- issue: 지혜의 의인화 보존
  chosen_reading: 여성형 지시 대명사를 유지하지 않고, 한국어에서는 비인격적 표현으로 옮기되 지혜를 대상화하는 비유는 보존했습니다.
  alternative_readings:
  - 그녀를 메고
  - 그분을 메고
  - 그것을 메고
  rationale: 히브리어/그리스어는 지혜를 여성형으로 의인화하지만, 현대 한국어 성경 문체에서는 지혜를 인격적 존재로 직접 지칭하면 어색할 수 있습니다. 본문 의미를 해치지 않는 범위에서 비유적 대상성을 유지했습니다.
  doctrine_reference: 원문 우선 번역 원칙; 지혜의 문학적 의인화
- issue: 난해한 히브리어 표현 처리
  chosen_reading: 본문의 핵심 이미지는 '짐/구속'으로 읽고, 과도한 추정 없이 '끈'으로 최소한의 해석을 반영했습니다.
  alternative_readings:
  - 결박
  - 속박
  - 규율
  rationale: 히브리어 어형은 불확실하지만, 영어 POB와 그리스어 평행본문이 제약의 이미지를 분명히 보여 줍니다. 그래서 본문을 매끄럽게 풀기보다, 제약의 감각을 간결하게 살렸습니다.
  doctrine_reference: 히브리어 본문 우선, 평행본문은 해석 보조
