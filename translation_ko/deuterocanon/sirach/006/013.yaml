lexical_decisions:
- source_word: מִשֹּׂנְאֶיךָ / ἀπὸ τῶν ἐχθρῶν σου
  english_pob_choice: from your enemies
  chosen_korean: 원수들에게서
  alternatives_korean:
  - 당신을 미워하는 자들에게서
  - 적들에게서
  lexicon: HALOT; LXX ἐχθροί
  rationale: 히브리어의 분사형 ‘미워하는 자들’과 그리스어의 ‘원수들’이 모두 강한 적대 관계를 가리키므로, 한국어에서는 자연스럽고 압축적인 ‘원수들’로 옮겼습니다.
- source_word: הִבָּדֵל / διαχωρίσθητι
  english_pob_choice: Keep away
  chosen_korean: 떠나고
  alternatives_korean:
  - 멀리하십시오
  - 분리되십시오
  - 떨어지십시오
  lexicon: HALOT; BDAG
  rationale: 명령형 분리·거리두기의 뜻을 살리되, 현대 한국어에서 짧고 직접적인 권면으로 읽히는 ‘떠나고’로 처리했습니다.
- source_word: וּמֵאֹהֲבֶיָך / ἀπὸ τῶν φίλων σου
  english_pob_choice: be on guard against your friends
  chosen_korean: 친구들을 경계하십시오
  alternatives_korean:
  - 당신을 사랑하는 자들을 경계하십시오
  - 벗들을 경계하십시오
  lexicon: HALOT; LXX φίλοι
  rationale: 히브리어는 문자적으로 ‘당신을 사랑하는 자들’이지만, 그리스어 병행은 ‘친구들’이므로 본문 대비를 살려 ‘친구들’로 옮겼습니다.
- source_word: הֵשָּׁמֵר / πρόσεχε
  english_pob_choice: be on guard
  chosen_korean: 경계하십시오
  alternatives_korean:
  - 주의하십시오
  - 조심하십시오
  - 깨어 있으십시오
  lexicon: HALOT; BDAG
  rationale: 주의·경계의 지속적 태도를 요구하는 명령으로 이해하여, 경계의 강도를 드러내는 ‘경계하십시오’를 택했습니다.
theological_decisions:
- issue: 히브리어 ‘사랑하는 자들’과 그리스어 ‘친구들’의 차이
  chosen_reading: 본문은 ‘친구들’을 본문어로 두되, 히브리어의 직역 가능성은 주석으로 남기지 않고 번역 내부에서 의미 대비를 살렸습니다.
  alternative_readings:
  - 당신을 사랑하는 자들
  - 벗들
  rationale: 경구의 대비는 ‘원수’ 대 ‘가까운 관계의 사람들’에 있으므로, 한국어에서는 두 번째 대상을 ‘친구들’로 두는 편이 청자에게 문맥 효과를 더 분명히 전달합니다.
  doctrine_reference: 'POB 번역 원칙: 살아 있는 대비와 문맥 효과를 우선하되, 원어 의미 범위를 해치지 않음'
