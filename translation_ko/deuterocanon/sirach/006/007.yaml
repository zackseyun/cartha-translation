  text: If you acquire a friend, acquire him through testing, and do not quickly put your trust in him.
  footnotes:
  - marker: a
    text: Or 'gain a friend by testing him'; the Hebrew and Greek both use a verb meaning 'acquire' or 'obtain,' which may sound more transactional than idiomatic English 'make a friend.'
