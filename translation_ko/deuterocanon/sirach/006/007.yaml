translation:
  language: ko
  text: 친구를 얻으려거든, 시험을 거쳐 얻으십시오. 그리고 그를 쉽게 믿지 마십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קָנִיתָ / קְנֵהוּ
  english_pob_choice: acquire / acquire him
  chosen_korean: 얻었거든 / 얻으십시오
  alternatives_korean:
  - 사귀었거든 / 사귀십시오
  - 획득했거든 / 획득하십시오
  - 사셨거든 / 사십시오
  lexicon: HALOT
  rationale: קנה의 기본 의미인 ‘얻다, 획득하다’를 살리되 한국어에서는 ‘얻다’가 가장 자연스럽고 문맥의 거래적 뉘앙스를 과도하게 키우지 않습니다.
- source_word: בְּנִסָּיוֹן
  english_pob_choice: through testing
  chosen_korean: 시험으로
  alternatives_korean:
  - 검증으로
  - 시험을 거쳐
  - 시련 가운데
  lexicon: HALOT
  rationale: נסיון은 시험·시련의 의미를 가지며, כאן의 ב는 수단/상황을 나타내므로 ‘시험으로’가 간결하게 그 기능을 드러냅니다.
- source_word: וְאַל תְּמַהֵר
  english_pob_choice: do not quickly
  chosen_korean: 쉽게
  alternatives_korean:
  - 서둘러
  - 너무 빨리
  - 급히
  lexicon: HALOT
  rationale: מוהר의 경고를 한국어 관용으로 옮겨, 분별 없이 성급히 신뢰하지 말라는 뜻을 담는 ‘쉽게’로 표현했습니다.
- source_word: לִבְטוֹחַ עָלָיו
  english_pob_choice: put your trust in him
  chosen_korean: 그에게 믿음을 두지 마십시오
  alternatives_korean:
  - 그를 믿지 마십시오
  - 그에게 신뢰를 두지 마십시오
  - 그에게 의지하지 마십시오
  lexicon: HALOT
  rationale: בטח + על의 ‘의지하다/신뢰하다’ 의미를 살리면서도, 한국어에서 관계 대상에 대해 자연스럽게 들리는 ‘믿음을 두다’로 옮겼습니다.
theological_decisions:
- issue: 지혜문학의 일반적 남성 단수 지시
  chosen_reading: ‘그’와 ‘그에게’를 유지했습니다.
  alternative_readings:
  - 성중립화하여 ‘그 사람’ 또는 복수형으로 처리
  rationale: 히브리어와 그리스어가 모두 남성 단수를 쓰므로, 일반화하되 성별 표지를 지우지 않는 번역을 택했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
