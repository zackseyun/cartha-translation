  source_fidelity: 히브리어의 קָנִיתָ ... קְנֵהוּ와 그리스어의 εἰ κτᾶσαι ... κτῆσαι αὐτόν은 친구를 얻는 일을 시험과 연관시키라는 반복적 표현입니다. 초안의 ‘얻었거든, ... 얻으십시오’는 완료된 획득 뒤에 다시 얻으라고 하는 뜻으로 읽혀 조건적 권면의 흐름을 흐립니다. ‘얻으려거든’은 문맥상 조건을 자연스럽게 드러내며, ‘시험을 거쳐’는 בְּנִסָּיוֹן/ἐν πειρασμῷ의 수단·상황을 보존합니다. ‘그를 쉽게 믿지 마십시오’는 לִבְטוֹחַ עָלָיו의 신뢰 대상을 정확히 옮깁니다.
  naturalness: ‘친구를 얻으려거든, 시험을 거쳐 얻으십시오’는 반복을 보존하면서도 현대 표준 한국어 합쇼체로 자연스럽습니다. ‘그에게 쉽게 믿음을 두지 마십시오’보다 ‘그를 쉽게 믿지 마십시오’가 현대어에서 훨씬 관용적이고 직접적입니다.
  terminology: ‘친구’, ‘시험’, ‘믿다’는 각각 אוֹהֵב, נִסָּיוֹן, בטח על의 문맥상 의미에 적절합니다. ‘시험’은 도덕적 시험이나 검증 어느 쪽으로도 과도하게 한정하지 않아 원문의 폭을 유지합니다.
