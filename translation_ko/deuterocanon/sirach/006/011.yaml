translation:
  language: ko
  text: 네 형편이 좋을 때에는 그가 너와 같겠지만[a], 네 형편이 나쁠 때에는 너에게서 떨어져 나갈 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 ‘그리고 네 종들에게 대담하게 말할 것이다’로 읽습니다. 그러나 히브리어 증인은 ‘너에게서 떨어져 나갈 것이다’로 읽으므로, 본문은 현존 히브리어를 따릅니다.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּטוֹבָתְךָ
  english_pob_choice: in your prosperity
  chosen_korean: 네 형편이 좋을 때에는
  alternatives_korean:
  - 네 번영 속에서는
  - 네 좋은 형편에는
  - 네 형통할 때에는
  lexicon: HALOT
  rationale: טובה는 여기서 물질적 부유보다 ‘좋은 형편/상황’을 가리키므로, 한국어에서는 자연스럽게 ‘형편이 좋을 때’로 넓게 옮겨 대조 구조를 살렸습니다.
- source_word: הוּא כָמוֹךָ
  english_pob_choice: he is like you
  chosen_korean: 그가 너와 같겠지만
  alternatives_korean:
  - 그가 너와 같을 것입니다
  - 그는 너 자신과 같습니다
  - 그는 너와 꼭 같습니다
  lexicon: HALOT
  rationale: 직역상 단순 비교이므로 ‘너와 같다’로 유지했고, 앞절과의 대비를 살리기 위해 전체 문맥에서는 연결을 자연스럽게 했습니다.
- source_word: וּבְרָעָתְךָ
  english_pob_choice: but in your adversity
  chosen_korean: 네 형편이 나쁠 때에는
  alternatives_korean:
  - 네 환난 때에는
  - 네 곤경에서는
  - 네 불운 속에서는
  lexicon: HALOT
  rationale: רעה는 여기서 일반적인 ‘악’보다 상황적 불운·곤란을 뜻하므로, 앞의 ‘형편이 좋을 때’와 대칭되는 표현으로 옮겼습니다.
- source_word: יִתְנַדֶּה מִמֶּךָּ
  english_pob_choice: he will separate himself from you
  chosen_korean: 너에게서 떨어져 나갈 것입니다
  alternatives_korean:
  - 너에게서 물러날 것입니다
  - 너에게서 멀어질 것입니다
  - 너에게서 등을 돌릴 것입니다
  lexicon: HALOT
  rationale: 히트파엘의 반사적 뉘앙스를 반영해 단순히 ‘떠나다’보다 관계의 이탈을 드러내는 ‘떨어져 나가다’로 옮겼습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행본문의 차이
  chosen_reading: 본문은 현존 히브리어의 ‘너에게서 떨어져 나갈 것입니다’를 따르고, 그리스어의 ‘네 종들에게 대담하게 말할 것입니다’는 각주로 표시했습니다.
  alternative_readings:
  - 그가 네 종들에게 거리낌 없이 말할 것입니다
  - 그가 네 종들 편에 나설 것입니다
  rationale: 이 절은 히브리어와 그리스어 전승의 차이가 크므로, 본문은 주요 현존 히브리어를 따르되 대체 전승을 독자가 확인할 수 있게 남겨 두는 것이 적절합니다.
  doctrine_reference: 본문 비평 / 전승 차이
