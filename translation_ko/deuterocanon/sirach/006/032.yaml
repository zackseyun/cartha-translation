  source_fidelity: 히브리어 본문은 ‘원한다면, 내 아들아, 지혜롭게 될 것이며, 네 마음을 둔다면 영리해질 것이다’라는 조건-결과의 병행을 이룹니다. 초안은 이 기본 의미를 대체로 보존하지만, 둘째 절의 ‘그것에’는 히브리어에 명시되지 않은 목적어를 다소 부자연스럽게 보충합니다. 목적어를 드러내지 않은 ‘마음을 기울이다’가 원문의 함축을 더 잘 보존합니다. 그리스어 병행은 첫 결과를 ‘가르침을 받다’로, 둘째 조건을 ‘네 영혼을 주다’로 표현하므로 각주에서만 제시하는 것이 적절합니다.
