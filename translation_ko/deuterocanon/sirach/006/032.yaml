base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/006/032.yaml
  text: If you desire it[a], my son, you will become wise; and if you set your heart on it[b], you will become shrewd.
  footnotes:
  - marker: a
    text: 'Greek: ''If you are willing, child, you will be instructed; and if you give your soul, you will be resourceful/shrewd.'' The Hebrew and Greek agree in overall sense, but the Greek foregrounds instruction where the Hebrew says ''become wise.'''
    reason: alternative_reading
  - marker: b
    text: Hebrew 'set your heart' is an idiom for intentional attention and commitment.
    reason: cultural_note
translation:
  language: ko
  text: 내 아들아, 네가 원한다면[a] 지혜롭게 될 것입니다. 네 마음을 기울인다면[b] 영리해질 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '그리스어: “네가 원한다면, 아이야, 가르침을 받을 것이며, 네 영혼을 내어준다면 슬기롭고 능숙하게 될 것이다.” 히브리어와 그리스어는 전체 의미에서는 일치하지만, 그리스어는 히브리어의 ‘지혜롭게 되다’보다 가르침을 받는다는 점을 앞세웁니다.'
    reason: alternative_reading
  - marker: b
    text: 히브리어의 ‘마음을 두다’는 어떤 일에 의도적으로 주의를 기울이고 헌신한다는 뜻의 관용 표현입니다.
    reason: cultural_note
lexical_decisions:
- source_word: אִם תַּחְפּוֹץ
  english_pob_choice: If you desire it
  chosen_korean: 네가 원하면
  alternatives_korean:
  - 네가 원한다면
  - 네가 바라면
  lexicon: HALOT
  rationale: חפץ는 단순한 의지뿐 아니라 원함/기쁨의 뉘앙스를 가지므로, 합쇼체에서 자연스럽고 조건의지를 살리는 「원하면」으로 옮겼습니다.
- source_word: בְּנִי
  english_pob_choice: my son
  chosen_korean: 내 아들아
  alternatives_korean:
  - 내 자녀야
  - 내 아이야
  lexicon: HALOT
  rationale: 히브리어가 남성 단수 호격을 분명히 하므로, 성별 표지를 보존하는 「내 아들아」가 본문에 가장 가깝습니다.
- source_word: תִּתְחַכָּם
  english_pob_choice: you will become wise
  chosen_korean: 지혜롭게 될 것이며
  alternatives_korean:
  - 지혜를 얻게 될 것이며
  - 지혜로워질 것이며
  lexicon: HALOT
  rationale: 히트파엘형은 ‘지혜로운 상태로 들어감’을 나타내므로, 결과 상태를 드러내는 「지혜롭게 될」이 적절합니다. 영어 POB의 ‘become wise’와도 대응됩니다.
- source_word: וְאִם תָּשִׂים לִבְּךָ
  english_pob_choice: and if you set your heart on it
  chosen_korean: 네 마음을 그것에 두면
  alternatives_korean:
  - 네 마음을 그것에 쏟으면
  - 네 마음을 그것에 기울이면
  lexicon: HALOT
  rationale: 히브리어 관용구 ‘마음을 두다’는 의도적 주의와 헌신을 뜻하므로, 한국어 관용으로 그대로 살렸습니다. 영어의 ‘set your heart on it’도 같은 관용을 반영합니다.
- source_word: תַּעֲרֹם
  english_pob_choice: you will become shrewd
  chosen_korean: 영리하게 될 것이다
  alternatives_korean:
  - 슬기롭게 될 것이다
  - 분별 있게 될 것이다
  - 간교하게 될 것이다
  lexicon: HALOT
  rationale: 이 문맥에서 ערם은 부정적 ‘간교함’보다 지혜 실천의 민첩함을 가리키므로, 의미상 중립적이면서도 sharp한 감각을 살리는 「영리하게」를 택했습니다.
theological_decisions:
- issue: '지혜의 성격: 형성되는 상태인가, 외적 주입인가'
  chosen_reading: 이 구절은 지혜가 주어지는 동시에 스스로 그것을 원하고 마음을 두는 사람에게서 형성되는 것으로 표현했습니다.
  alternative_readings:
  - ‘가르침을 받게 될 것이다’처럼 외적 교육의 강조
  - ‘슬기로워질 것이다’처럼 일반적 성숙 강조
  rationale: 히브리어는 ‘지혜롭게 되다’와 ‘마음을 두다’의 상호작용을 함께 제시하므로, 수동적 주입으로 좁히지 않고 인간의 의지적 응답을 함께 드러냈습니다.
  doctrine_reference: 지혜문학의 인간 응답성과 형성 개념
