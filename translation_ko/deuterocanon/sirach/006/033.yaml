base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/006/033.yaml
  text: If you are willing to listen[a], you will receive instruction; if you incline your ear[b], you will become wise.
  footnotes:
  - marker: a
    text: The surviving Hebrew for this verse is difficult and appears shorter than the Greek. The Greek parallel reads, 'If you love to listen, you will receive instruction, and if you incline your ear, you will be wise.' The translation follows the Hebrew as primary while using the Greek to clarify the sense and preserve the fuller parallelism.
    reason: textual_variant
  - marker: b
    text: Or 'receive instruction' for 'learn discipline.'
    reason: lexical_alternative
translation:
  language: ko
  text: 듣고자 하면[a] 훈계를 받게 될 것이며[b], 귀를 기울이면 지혜롭게 될 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 절에 남아 있는 히브리어 본문은 난해하고 그리스어 본문보다 짧아 보입니다. 그리스어 병행 본문은 “듣기를 사랑하면 교훈을 받고, 귀를 기울이면 지혜롭게 될 것이다”라고 읽습니다. 이 번역은 히브리어를 우선하되, 뜻을 분명히 하고 더 온전한 대구를 반영하기 위해 그리스어를 참고했습니다.
    reason: textual_variant
  - marker: b
    text: ‘훈계를 받다’는 원문의 יסר 계열이 지닌 교정과 훈육의 뜻을 살린 표현입니다. 달리 ‘교훈을 받다’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם תּוֹבֵא לִשְׁמֹעַ / ἐὰν ἀγαπήσῃς ἀκούειν
  english_pob_choice: If you are willing to listen
  chosen_korean: 듣고자 하시면
  alternatives_korean:
  - 들으려 하시면
  - 기꺼이 들으시면
  - 들음을 사랑하시면
  lexicon: HALOT; LXX parallel
  rationale: 히브리어의 다소 이례적인 용법과 그리스어의 ‘듣기를 사랑하다’가 모두 자발적 태도를 가리키므로, 현대 한국어에서는 ‘듣고자 하시면’이 의지와 호응을 가장 자연스럽게 드러냅니다.
- source_word: וְתֵט אָזְנְךָ / κλίνῃς τὸ οὖς σου
  english_pob_choice: if you incline your ear
  chosen_korean: 귀를 기울이시면
  alternatives_korean:
  - 귀를 굽히시면
  - 주의를 기울이시면
  - 귀를 숙이시면
  lexicon: HALOT; BDAG
  rationale: ‘귀를 기울이다’는 히브리어 관용구를 한국어에서도 그대로 살리는 표현으로, 청종의 비유를 유지하면서도 이해하기 쉽습니다.
- source_word: תִּוָּסֵר
  english_pob_choice: you will receive instruction
  chosen_korean: 훈계를 받게 되실 것이며
  alternatives_korean:
  - 교훈을 받게 되실 것이며
  - 수정을 받게 되실 것이며
  - 가르침을 받게 되실 것이며
  lexicon: HALOT
  rationale: 이 동사는 단순 정보 습득보다 훈육·교정의 의미를 포함하므로, POB의 ‘receive instruction’에 맞추되 ‘훈계’로 옮겨 지혜문학적 교정의 뉘앙스를 드러냈습니다.
- source_word: σοφὸς ἔσῃ
  english_pob_choice: you will become wise
  chosen_korean: 지혜로워지실 것입니다
  alternatives_korean:
  - 지혜롭게 되실 것입니다
  - 지혜로운 사람이 되실 것입니다
  - 지혜를 얻게 되실 것입니다
  lexicon: BDAG
  rationale: 그리스어 병행구의 결과 진술을 살려, 단순 상태보다 변화의 결과를 나타내는 ‘-아/어지다’형으로 옮겼습니다.
theological_decisions:
- issue: 지혜문학에서의 ‘훈계/교정’ 뉘앙스
  chosen_reading: ‘훈계를 받게 되실 것’으로 번역해, 단순한 정보 전달이 아니라 인격과 삶을 바로잡는 교육적 교정을 드러냈습니다.
  alternative_readings:
  - ‘가르침을 받게 되실 것’
  - ‘교훈을 받게 되실 것’
  rationale: 시락 6:33의 어휘는 지혜를 얻는 통로로서의 훈련과 교정을 말하므로, 한국어에서 약화되기 쉬운 규범적·형성적 의미를 보존하는 것이 적절합니다.
  doctrine_reference: 지혜문학의 교훈/훈육 모티프
