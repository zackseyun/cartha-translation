base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/006/014.yaml
  text: A faithful friend is a strong refuge[a], and whoever finds one has found a treasure.
  footnotes:
  - marker: a
    text: 'The extant Hebrew here is difficult and differs notably from the Greek witness. More literally from the Hebrew as transmitted: ''A lover of faithfulness [is/ loves] strength, and whoever finds it has found wealth.'' The main text follows the clearer sense of the Greek parallel: ''A faithful friend is a strong shelter.'''
    reason: textual_variant
translation:
  language: ko
  text: 충실한 친구는 든든한 피난처입니다[a]. 그를 찾는 사람은 보물을 찾은 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 현존 히브리어 본문은 난해하며 그리스어 본문과 상당히 다릅니다. 전승된 히브리어를 더 직역하면, ‘충실함을 사랑하는 이는 강함이다’ 또는 ‘충실함을 사랑하는 이는 강함을 사랑한다,’ 그리고 ‘그것을 찾는 이는 재물을 찾았다’가 됩니다. 본문은 더 분명한 그리스어 평행본문의 ‘충실한 친구는 강한 피난처이다’라는 뜻을 따릅니다.
    reason: textual_variant
lexical_decisions:
- source_word: אוֹהֵב אֱמוּנָה / φίλος πιστός
  english_pob_choice: a faithful friend
  chosen_korean: 충실한 친구
  alternatives_korean:
  - 믿음직한 친구
  - 신실한 친구
  - 성실한 친구
  lexicon: HALOT; LXX parallel φίλος πιστός
  rationale: 히브리어 본문은 직역상 어색하지만, 그리스어 평행본문이 뜻을 분명히 보여 주므로 친구의 성품을 나타내는 한국어로 '충실한'을 택해 의미와 격식을 함께 살렸습니다.
- source_word: תְּקוֹף / σκέπη κραταιά
  english_pob_choice: strong refuge
  chosen_korean: 강한 피난처
  alternatives_korean:
  - 튼튼한 피난처
  - 견고한 피난처
  - 강한 보호처
  lexicon: HALOT; LXX parallel σκέπη κραταιά
  rationale: '''피난처''는 προστασία보다 은유를 더 직접적으로 살리고, ''강한''은 κραταιά의 힘센/견고한 뉘앙스를 반영합니다.'
- source_word: וּמוֹצְאוֹ / ὁ δὲ εὑρὼν αὐτόν
  english_pob_choice: whoever finds one / him
  chosen_korean: 그런 친구를 찾는 사람은
  alternatives_korean:
  - 그를 찾는 사람은
  - 그것을 찾는 사람은
  lexicon: HALOT; Greek parallel αὐτόν
  rationale: 히브리어 어미와 그리스어 대명사가 가리키는 대상을 한국어에서는 자연스럽게 풀어, 앞절의 '친구'를 다시 받아 주는 인칭 표현으로 옮겼습니다.
- source_word: הוֹן / θησαυρόν
  english_pob_choice: a treasure
  chosen_korean: 보물
  alternatives_korean:
  - 재물
  - 부
  - 보화
  lexicon: HALOT; LXX parallel θησαυρόν
  rationale: 히브리어 הוֹן의 '재물/부'와 그리스어 θησαυρόν의 '보물'을 함께 반영하되, 잠언적 비유에 가장 자연스러운 '보물'을 선택했습니다.
theological_decisions:
- issue: 히브리어와 그리스어 평행본문이 맞지 않는 경우의 본문 선택
  chosen_reading: 그리스어가 분명하게 제시하는 '충실한 친구는 강한 피난처'의 뜻을 본문으로 채택하되, 히브리어의 더 직역적인 가능성은 각주로 남깁니다.
  alternative_readings:
  - 충실함을 사랑하는 이는 강함을 사랑하며, 그것을 찾는 사람은 재물을 찾은 것입니다.
  rationale: 이 절은 전승 간 불일치가 크므로, 본문이 청자에게 전달하려는 잠언적 의미를 우선하고, 동시에 히브리어 전승의 긴장도 숨기지 않는 것이 적절합니다.
  doctrine_reference: 'POB Sirach translation policy: surviving Hebrew is primary where clear, but the Greek parallel may function as actual translation input when the Hebrew is difficult or mismatched.'
