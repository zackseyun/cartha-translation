base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/006/010.yaml
  text: There is a friend who is a table-companion[b][a], but he will not be found in a day of trouble.
  footnotes:
  - marker: a
    text: Hebrew literally, 'a friend of table'; the Greek parallel reads 'a sharer of tables,' clarifying the sense of one who joins you at meals but proves unreliable in hardship.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew says 'will not be found,' while the Greek parallel has 'will not remain.' Both convey that such a friend disappears when trouble comes.
    reason: alternative_reading
translation:
  language: ko
  text: 식탁을 함께하는 친구도 있으나, 환난의 날에는 그를 찾을 수 없습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘식탁의 친구’에 가깝고, 그리스어 병행본은 ‘식탁의 동반자’라고 합니다. 이는 식사 자리를 함께하는 친구를 가리킵니다.
    reason: source_note
  - marker: b
    text: 히브리어는 ‘찾히지 않는다’이고, 그리스어 병행본은 ‘남아 있지 않는다’입니다. 두 표현 모두 환난 때 그가 없다는 뜻을 전합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אוֹהֵב חָבֵר שֻׁלְחָן
  english_pob_choice: a friend who is a table-companion
  chosen_korean: 식탁의 벗
  alternatives_korean:
  - 식탁의 동무
  - 식사 친구
  - 식탁 동반자
  lexicon: HALOT
  rationale: 히브리어의 압축된 표현을 자연스러운 한국어로 옮기되, 단순한 친교가 아니라 식사 자리를 함께하는 관계라는 이미지를 살리기 위해 ‘식탁의 벗’으로 옮겼습니다.
- source_word: וְלֹא יִמָּצֵא
  english_pob_choice: he will not be found
  chosen_korean: 그를 찾지 못합니다
  alternatives_korean:
  - 그는 발견되지 않습니다
  - 그는 없을 것입니다
  - 그는 남아 있지 않습니다
  lexicon: HALOT
  rationale: 히브리어 nifal의 기본 의미인 ‘찾아지다/발견되다’를 따라가되, 한국어에서는 수동형보다 의미가 분명한 능동 표현이 더 자연스러워 ‘그를 찾지 못합니다’로 옮겼습니다.
- source_word: בְּיוֹם רָעָה
  english_pob_choice: in a day of trouble
  chosen_korean: 환난의 날
  alternatives_korean:
  - 재난의 날
  - 고난의 날
  - 악한 날
  lexicon: HALOT
  rationale: 여기서 רָעָה는 도덕적 악보다 재난·곤경을 뜻하므로, 지혜문맥에 맞는 ‘환난’으로 옮겨 그 뉘앙스를 분명히 했습니다.
theological_decisions:
- issue: 그리스어 병행본의 '남지 않다'와 히브리어 본문의 '찾히지 않다' 사이의 긴장
  chosen_reading: 본문에는 히브리어를 따라 ‘그를 찾지 못합니다’를 두되, 의미상 관계 단절과 부재를 함께 드러내는 표현으로 읽습니다.
  alternative_readings:
  - 그는 남아 있지 않습니다
  - 그는 끝내 머물지 않습니다
  rationale: 히브리어 본문이 우선이므로 ‘찾지 못한다’는 동사 의미를 보존하되, 그 결과로 위기 때 사라지는 무상한 친구라는 경고를 한국어에서 자연스럽게 전달합니다.
  doctrine_reference: 지혜문학의 우정 경계 경고
- issue: ‘식탁의 벗’이 단순한 교제와 달리 피상적 우정을 암시하는지
  chosen_reading: 식사 자리의 친분은 있으나 고난에는 함께하지 않는 겉친구로 이해됩니다.
  alternative_readings:
  - 단순한 식사 동반자
  - 일반적인 친구
  rationale: 히브리어와 그리스어 모두 식탁 교제를 강조하므로, 한국어에서도 관계의 얕음을 암시하는 표현을 유지해야 본문의 교훈이 살아납니다.
  doctrine_reference: 지혜문학의 인간관계 분별
