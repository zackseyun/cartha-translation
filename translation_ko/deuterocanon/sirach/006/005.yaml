    rationale: 현 번역은 그리스어가 지지하는 의미를 채택하지만, 히브리어 표면형은 ‘사랑하는 이’를 뜻하는 것으로 보이며 난해합니다. 출전의 주요 불일치 표지와 영어 POB 주석을 고려할 때 이 선택을 독자에게 밝혀야 합니다.
  - severity: medium
    issue: ‘은혜로운 입술’은 현대 한국어에서 어색하고 חֵן의 사회적·화행적 의미를 충분히 드러내지 못합니다.
    rationale: 이 문맥의 חֵן은 신학적 은혜보다 호의, 친절, 상냥함의 뉘앙스입니다. ‘상냥한 입술’이 병행법과 현대적 문체에 더 적합합니다.
  - severity: low
    issue: ‘평화를 묻습니다’는 히브리어 관용구의 문자성을 보존하지만 한국어 문장으로는 다소 비관용적입니다.
