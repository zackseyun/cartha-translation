base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/006/005.yaml
  text: A sweet palate multiplies friends[b][a], and gracious lips ask after peace.
  footnotes:
  - marker: a
    text: Hebrew 'multiplies one who loves' is difficult; the Greek parallel reads 'multiplies his friends,' which is followed here as the clearer sense.
    reason: alternative_reading
  - marker: b
    text: Or 'gracious speech multiplies friendly greetings.' The Hebrew uses bodily imagery ('palate,' 'lips'), while the Greek similarly uses 'throat' and 'tongue.'
    reason: lexical_alternative
translation:
  language: ko
  text: 달콤한 입천장은 친구를 많이 만들고, 상냥한 입술은 안부를 묻습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘달콤한 입천장’이라고 하며, 말의 기관을 가리키는 비유적 표현입니다. 이어지는 히브리어 ‘사랑하는 이’를 늘린다는 표현은 난해합니다. 그리스어 평행본문은 ‘그의 친구들’을 늘린다고 읽으며, 본문은 이 뜻을 따릅니다.
    reason: alternative_reading
  - marker: b
    text: 문자적으로는 ‘평안을 묻는 입술’입니다. 이는 안부를 묻거나 우호적으로 인사한다는 뜻의 관용적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵךְ עָרֵב
  english_pob_choice: A sweet palate
  chosen_korean: 달콤한 입천장
  alternatives_korean:
  - 달콤한 입
  - 부드러운 입천장
  - 감미로운 입천장
  lexicon: HALOT
  rationale: 히브리어는 신체기관을 통해 말을 빗대는 표현이므로, 뜻을 평평하게 풀기보다 구체적 이미지를 살려 '입천장'으로 옮겼습니다. '달콤한'은 עָרֵב의 감각적 뉘앙스와 평행하는 이미지를 반영합니다.
- source_word: יַרְבֶּה אוֹהֵב
  english_pob_choice: multiplies friends
  chosen_korean: 친구를 많게 하고
  alternatives_korean:
  - 사랑하는 이들을 많게 하고
  - 좋아하는 이들을 늘리고
  - 친구들을 늘리고
  lexicon: HALOT
  rationale: 히브리어 표면형은 해석이 어렵지만, 그리스어 평행본문이 '그의 친구들'을 뜻하므로 관계적 의미를 따라 '친구를 많게 하고'로 옮겼습니다.
- source_word: שִׂפְתֵי חֵן
  english_pob_choice: gracious lips
  chosen_korean: 은혜로운 입술
  alternatives_korean:
  - 호감 가는 입술
  - 우아한 입술
  - 호의로운 입술
  lexicon: HALOT
  rationale: 직역하면 '은혜/호의의 입술'이므로, חֵן의 사회적 호의와 말의 품위를 함께 살리는 표현으로 '은혜로운 입술'을 택했습니다.
- source_word: שׁוֹאֲלֵי שָׁלוֹם
  english_pob_choice: ask after peace
  chosen_korean: 평화를 묻습니다
  alternatives_korean:
  - 안부를 묻습니다
  - 평안을 묻습니다
  - 평화를 구합니다
  lexicon: HALOT
  rationale: 문자적으로는 '평안을 묻는 이들'이라는 관용구이므로, 친교적 인사와 안부 확인의 뜻을 드러내면서도 '묻다'를 유지했습니다.
