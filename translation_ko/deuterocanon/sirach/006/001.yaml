  source_fidelity: 초안은 히브리어와 그리스어가 공유하는 ‘악한 이름—수치와 치욕’ 및 마지막의 그리스어 해석을 반영하지만, 영어 POB 본문이 채택한 그리스어의 분명한 권면(‘친구 대신 원수가 되지 마십시오’)을 누락했습니다. 또한 히브리어의 짧고 난해한 결말은 단정하지 않고 각주에서 보존해야 합니다.
  naturalness: ‘그래서 두 혀를 가진 죄인은 그렇습니다’는 한국어 문장으로 부자연스럽고, 무엇과 같은지의 지시 관계도 불명확합니다. ‘두 혀를 지닌 죄인도 이와 같습니다’로 고치면 격언의 비교 구문이 자연스럽습니다.
  terminology: ‘악한 이름’, ‘수치’, ‘치욕’은 원문의 어휘적 짝을 무리 없이 보존합니다. ‘두 혀를 지닌’은 그리스어의 비유를 직역적으로 살린 표현이며, 그 의미와 히브리어의 불확실성은 해당 어구에 직접 연결한 각주로 밝혀야 합니다.
  issues:
