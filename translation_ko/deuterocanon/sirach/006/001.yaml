base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/006/001.yaml
  text: Do not become an enemy instead of a friend, for an evil name will inherit shame and disgrace[b][a]; so it is with a sinful man of double tongue.
  footnotes:
  - marker: a
    text: The surviving Hebrew witness is shorter and reads approximately, 'An evil name [inherits/brings] shame and disgrace; so is an evil man, a possessor of two [things].' The Greek adds the opening warning, 'Do not become an enemy instead of a friend,' and interprets the final expression as 'double-tongued.'
    reason: textual_variant
  - marker: b
    text: Or 'double-tongued.' The Hebrew expression is obscure, but the Greek makes the sense explicit.
    reason: lexical_alternative
translation:
  language: ko
  text: 친구 대신 원수가 되지 마십시오. 악한 이름은 수치와 치욕을 물려받을 것이기 때문입니다[a]. 두 혀를 지닌 죄인도 이와 같습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 남아 있는 히브리어 증인은 더 짧습니다. 대략 ‘악한 이름은 수치와 치욕을 물려받는다/물려준다. 이와 같은 이는 두 [무언가]를 가진 악한 사람이다’로 읽히지만, 동사의 뉘앙스와 마지막 표현은 불확실합니다. 그리스어는 ‘친구 대신 원수가 되지 마십시오’라는 권면을 덧붙이며, 그 앞에 큰 일과 작은 일에 관한 또 다른 권면도 포함합니다.
    reason: textual_variant
  - marker: b
    text: 또는 ‘두 말을 하는’ 또는 ‘이중적인’으로 옮길 수 있습니다. 히브리어의 ‘두 [무언가]를 가진 이’라는 표현은 모호하며, 그리스어는 이를 ‘두 혀를 지닌’으로 풀이합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׁם רַע / ὄνομα πονηρόν
  english_pob_choice: an evil name
  chosen_korean: 악한 이름
  alternatives_korean:
  - 나쁜 평판
  - 악명
  lexicon: HALOT; BDAG
  rationale: 히브리어와 그리스어 모두 ‘이름’ 이미지를 유지하므로, 의미를 풀기보다 ‘악한 이름’으로 직역해 idiom을 살렸습니다.
- source_word: וְקָלוֹן / αἰσχύνη
  english_pob_choice: shame
  chosen_korean: 수치
  alternatives_korean:
  - 부끄러움
  - 치욕
  lexicon: HALOT; BDAG
  rationale: 공적 수치를 가리키는 말로, 이어지는 חֶרְפָּה와 구별되도록 한국어에서는 간결한 ‘수치’를 택했습니다.
- source_word: חֶרְפָּה / ὄνειδος
  english_pob_choice: disgrace
  chosen_korean: 치욕
  alternatives_korean:
  - 수치
  - 모욕
  - 비난
  lexicon: HALOT; BDAG
  rationale: 공공연한 망신과 비난의 뉘앙스를 살리기 위해 ‘치욕’을 사용했습니다.
- source_word: בַּעַל שְׁתָּיִם / ὁ δίγλωσσος
  english_pob_choice: of double tongue
  chosen_korean: 두 혀를 가진
  alternatives_korean:
  - 두 말하는
  - 이중적인
  - 이중 혀의
  lexicon: HALOT; BDAG
  rationale: 히브리어의 난해한 표현을 그리스어의 ‘double-tongued’ 해석에 따라 풀되, 원문의 비유성을 유지하려고 ‘두 혀를 가진’으로 옮겼습니다.
theological_decisions:
- issue: 히브리어와 그리스어의 본문 차이 반영
  chosen_reading: 본문의 핵심 경고인 ‘악한 이름은 수치와 치욕을 상속한다’는 흐름을 살리되, 히브리어의 난해한 끝부분을 그리스어의 해석에 따라 ‘두 혀를 가진’으로 풀어 옮겼습니다.
  alternative_readings:
  - ‘악한 이름은 수치와 치욕을 상속합니다. 그러니 악한 사람은 곧 두 [무언가]의 소유자입니다.’
  - ‘악한 이름은 수치와 치욕을 상속합니다. 그래서 이중 혀를 가진 죄인입니다.’
  rationale: 이 절은 히브리어 전승이 짧고 모호하며, 그리스어가 의미를 분명히 해 줍니다. 따라서 두 증언의 긴장을 지우지 않되, 출판용 본문은 읽히는 한국어로 제시했습니다.
  doctrine_reference: Sirach 6:1의 major_mismatch 주석과 POB의 병행 본문 사용 원칙
- issue: 동사 시제의 일반성 표현
  chosen_reading: 현재형 ‘상속합니다’로 일반 진리를 표현했습니다.
  alternative_readings:
  - ‘상속할 것입니다’
  - ‘상속합니다’
  rationale: 지혜문학의 격언적 진술이므로, 한국어에서는 보편적 진술을 나타내는 현재형이 가장 자연스럽습니다.
  doctrine_reference: 지혜문학의 격언적 현재
