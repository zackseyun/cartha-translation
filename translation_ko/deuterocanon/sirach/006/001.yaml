    issue: 그리스어의 ‘친구 대신 원수가 되지 마십시오’라는 권면이 본문에서 빠져 있습니다.
    rationale: 영어 POB 감사 본문은 이 분명한 그리스어 구절을 본문에 채택합니다. 히브리어 증인이 더 짧다는 사실은 본문 삭제의 근거가 아니라 본문비평 각주로 밝혀야 합니다.
