translation:
  language: ko
  text: 교훈은 그 이름에 걸맞은 것이며, 많은 이들에게는 분명하지 않습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '그리스어 병행본문: “지혜는 그 이름에 걸맞은 것이며, 많은 이들에게는 분명하지 않습니다.” 히브리어 본문은 여기서 ‘지혜’ 대신 ‘교훈’(מוסר)을 읽습니다.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַמּוּסָר
  english_pob_choice: discipline
  chosen_korean: 지혜
  alternatives_korean:
  - 훈계
  - 훈련
  - 징계
  lexicon: HALOT
  rationale: 히브리어 본문은 מוּסָר(훈련, 훈계, 교훈, 징계 계열)로 읽히지만, 여기서는 아래의 히브리어 표현과 더 자연스럽게 이어지는 문맥적 의미를 살려 본문 의미를 '지혜'로 옮기지 않고, 히브리어 본문의 내용 흐름에 맞춰 번역했습니다. 다만 이 구절은 영어 POB가 히브리어를 따라 'discipline'로 잡고 있어, 본문 대조를 위해 그 차이를 반영해야 합니다.
- source_word: בִּשְׁמָהּ
  english_pob_choice: true to its name
  chosen_korean: 자기 이름에 맞는
  alternatives_korean:
  - 이름대로의
  - 이름에 따라
  - 그 이름에 맞는
  lexicon: HALOT
  rationale: 직역은 '그 이름 안에서/그 이름에 따라'이지만, 한국어에서는 대상의 실체와 명칭이 부합한다는 뜻을 자연스럽게 드러내는 '자기 이름에 맞는'이 문맥상 가장 정확합니다.
- source_word: נְכוֹחָה
  english_pob_choice: evident
  chosen_korean: 분명하지 않습니다
  alternatives_korean:
  - 드러나지 않습니다
  - 쉽게 보이지 않습니다
  - 명백하지 않습니다
  lexicon: HALOT
  rationale: 문맥상 '많은 이들에게 분명하지 않다/드러나지 않는다'는 뜻이므로, 형용사성을 한국어 서술로 풀어 '분명하지 않습니다'라고 옮겼습니다.
- source_word: לְרַבִּים
  english_pob_choice: to many
  chosen_korean: 많은 이들에게
  alternatives_korean:
  - 많은 사람에게
  - 많은 이들 앞에
  - 다수에게
  lexicon: HALOT
  rationale: 전치사 לְ의 수혜/도달 대상을 살려 '많은 이들에게'로 옮기면, 바로 앞의 '분명하지 않다'와 자연스럽게 결합됩니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행본문의 핵심 명사 차이
  chosen_reading: 본문은 히브리어를 따라 '지혜' 대신 다른 의미 흐름을 우선하지 않고, 그리스어 병행본문의 'wisdom'은 각주 없이 본문 의미 대비에만 반영했습니다.
  alternative_readings:
  - 그리스어에 따라 '지혜는 자기 이름에 맞는 것이며…'로 본문을 옮김
  - 각주로 히브리어 'discipline'과 그리스어 'wisdom'의 차이를 명시함
  rationale: 이 절은 히브리어와 그리스어가 실질적으로 어휘를 달리하므로, 주된 본문은 주어진 히브리어 증거를 우선하되 한국어 문장에서는 원문의 대조 구조를 유지하는 것이 필요합니다. POB의 영어 본문이 히브리어 'discipline'을 택하고 있으므로, 한국어도 그 흐름을 따르면서 의미를 과도하게 평평하게 만들지 않았습니다.
  doctrine_reference: 'Sirach 번역 원칙: 히브리어 생존 본문 우선, 그리스어 병행본문은 감사 가능한 보조 증거로 사용'
