translation:
  language: ko
  text: 신실한 친구[a]에게는 값을 매길 수 없고, 그의 선함[b]을 저울질할 수도 없습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '그리스어: ‘신실한 친구’; 히브리어는 더 문자적으로 ‘신실함을 사랑하는 자’입니다. 문맥상 신실한 친구를 가리키는 것으로 보는 것이 자연스럽습니다.'
    reason: alternative_reading
  - marker: b
    text: '그리스어: ‘그의 아름다움’ 또는 ‘그의 고귀함’.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְאוֹהֵב אֱמוּנָה / φίλου πιστοῦ
  english_pob_choice: for a faithful friend
  chosen_korean: 신실한 친구
  alternatives_korean:
  - 믿음직한 친구
  - 충실한 친구
  - 성실한 친구
  lexicon: HALOT; LXX φίλου πιστοῦ
  rationale: 히브리어는 직역하면 ‘신실함을 사랑하는 자’이지만, 평행구의 문맥과 그리스어 병행본문이 뜻하는 바는 ‘신실한 친구’이므로 자연스럽게 옮겼습니다.
- source_word: אֵין מְחִיר / οὐκ ἔστιν ἀντάλλαγμα
  english_pob_choice: there is no price
  chosen_korean: 값이 없고
  alternatives_korean:
  - 값을 매길 수 없고
  - 대가가 없고
  - 값어치를 헤아릴 수 없고
  lexicon: HALOT; LXX ἀντάλλαγμα
  rationale: ‘가격/대가’의 뜻을 살리되, 한국어에서는 ‘값이 없다’가 가장 간결하게 ‘비교 불가한 가치’를 전달합니다.
- source_word: מִשְׁקָל / σταθμός
  english_pob_choice: weighing
  chosen_korean: 저울질할 수도 없습니다
  alternatives_korean:
  - 헤아릴 수도 없습니다
  - 달아볼 수도 없습니다
  - 무게를 잴 수도 없습니다
  lexicon: HALOT; LXX σταθμός
  rationale: ‘저울에 달다/저울질하다’가 원문의 측량 비유를 살리면서도 현대 한국어에서 자연스럽습니다.
- source_word: לְטוֹבָתוֹ / καλλονῆς αὐτοῦ
  english_pob_choice: his worth
  chosen_korean: 그의 선함
  alternatives_korean:
  - 그의 가치
  - 그의 뛰어남
  - 그의 아름다움
  lexicon: HALOT; LXX καλλονή
  rationale: 히브리어의 ‘좋음/선함’에 우선하고, 그리스어의 ‘아름다움/고귀함’은 보완 의미로 남겨 두었습니다. ‘선함’은 단순 도덕성보다 친구의 귀함과 유익함을 함께 담습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행본문의 차이
  chosen_reading: 본문은 히브리어의 ‘선함’을 따르되, 의미는 그리스어의 ‘아름다움/고귀함’과 충돌하지 않도록 넓게 잡았습니다.
  alternative_readings:
  - ‘그의 가치’로 더 일반화
  - ‘그의 아름다움’으로 그리스어를 전면 반영
  rationale: 시락서의 현존 히브리어와 그리스어가 서로 다른 어휘를 보이므로, 어느 한쪽을 지워 버리지 않고 히브리어를 본문으로 두면서 그리스어의 뉘앙스를 해치지 않게 했습니다.
  doctrine_reference: 본문 비평 및 지혜문학의 평행어법
- issue: ‘신실한 친구’의 관계적 의미
  chosen_reading: 친구의 도덕적 자질을 단순 형용하는 데 그치지 않고, 관계 안에서 드러나는 신실함을 강조했습니다.
  alternative_readings:
  - ‘신실함을 사랑하는 자’로 직역
  - ‘믿을 만한 친구’로 완화
  rationale: 문맥상 지혜문학의 교훈은 추상적 성향보다 실제 우정의 신뢰성을 말하므로, 관계적 표현을 택하는 것이 본뜻을 가장 잘 드러냅니다.
  doctrine_reference: 지혜문학의 교훈적 문맥
