translation:
  language: ko
  text: 내 아들아, 젊을 때부터 교훈을 받아들이고, 백발이 될 때까지 지혜를 얻으십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘교훈을 받아들이라’는 뜻이고, 그리스어는 ‘교훈을 선택하라’는 뜻입니다. 두 전승은 모두 젊을 때부터 형성적 가르침을 붙들라는 같은 방향을 가리킵니다.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּנִי
  english_pob_choice: My son
  chosen_korean: 내 아들아
  alternatives_korean:
  - 내 자식아
  - 내 아이야
  lexicon: HALOT
  rationale: 직접적인 아버지의 훈계 خطاب를 살리되, 한국어 합쇼체 본문 안에서 자연스럽고 문학적인 호격으로 옮겼습니다.
- source_word: מִנְּעוּרֶיךָ
  english_pob_choice: from your youth
  chosen_korean: 젊을 때부터
  alternatives_korean:
  - 네 청년 시절부터
  - 어려서부터
  lexicon: HALOT
  rationale: ‘여러 해 전부터’가 아니라 삶의 초기부터라는 의미를 자연스럽게 전달하는 현대 한국어 표현입니다.
- source_word: קַח לֶקַח
  english_pob_choice: receive instruction
  chosen_korean: 교훈을 받아들이고
  alternatives_korean:
  - 가르침을 받으십시오
  - 훈계를 받으십시오
  lexicon: HALOT
  rationale: 히브리어 ‘take instruction’의 수용적 뉘앙스를 살려, 단순한 지식 습득보다 삶을 빚는 교훈의 수용을 드러냈습니다.
- source_word: וְעַד שֵׂיבָה
  english_pob_choice: until gray hair
  chosen_korean: 백발이 될 때까지
  alternatives_korean:
  - 노년까지
  - 흰 머리가 될 때까지
  lexicon: HALOT
  rationale: ‘백발’은 노년의 구체적 표지이자 원문 이미지에 대응하는 한국어 관용 표현입니다.
- source_word: תַּשִּׂיג חָכְמָה
  english_pob_choice: you will attain wisdom
  chosen_korean: 지혜를 얻으십시오
  alternatives_korean:
  - 지혜에 이르실 것입니다
  - 지혜를 얻을 것입니다
  lexicon: HALOT
  rationale: 원문의 도달·획득 의미를 살리되, 한국어에서는 후반 절의 권면성과 병행되도록 미래 서술보다 권면형으로 자연스럽게 다듬었습니다.
theological_decisions:
- issue: 후반 절의 동사 시제와 문장 기능
  chosen_reading: 전체를 지혜 문학 특유의 교훈적 권면으로 읽어, 미래 진술의 형식을 한국어 권면형으로 자연화했습니다.
  alternative_readings:
  - 직역하여 ‘지혜를 얻을 것입니다’로 옮기는 읽기
  - 예언적 확정 표현으로 처리하는 읽기
  rationale: 히브리어는 미래형이지만, 잠언식 훈계 문맥에서는 행위의 결과를 격려하는 기능이 강하므로 한국어에서는 권면의 힘을 유지하는 편이 더 자연스럽습니다.
  doctrine_reference: 지혜문학의 교훈적 미래/권면 용법
- issue: 호칭의 성별 표지
  chosen_reading: ‘내 아들아’로 옮겨 원문의 남성 호격을 유지했습니다.
  alternative_readings:
  - ‘내 자녀야’로 중성화하는 읽기
  rationale: 원문과 POB의 직접 호칭을 보존하는 것이 본문의 수사적 관계를 더 정확히 드러냅니다.
  doctrine_reference: 본문 수사와 독자 지시
