  naturalness: 초안의 호격 ‘내 아들아’와 ‘젊을 때부터’, ‘백발이 될 때까지’는 현대 한국어의 격식 있는 성경 문체에서 자연스럽습니다. 다만 한 문장 안에서 ‘받아들이고 … 얻으십시오’로 두 명령형을 연결한 것은 원문의 명령-미래 구조를 흐립니다. 두 문장으로 나누고 후반을 ‘얻게 될 것입니다’로 처리하면 합쇼체와 논리 관계가 모두 자연스럽습니다.
