translation:
  language: ko
  text: 내 아들아, 젊을 때부터 교훈을 받으십시오. 그리고 백발이 될 때까지 지혜를 얻게 될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘교훈을 받으라’고 하고, 그리스어는 ‘교훈을 선택하라’고 합니다. 여기서는 히브리어 본문을 우선하였으나, 두 전승 모두 젊을 때부터 교훈을 받아들이라는 뜻을 나타냅니다.
    reason: alternative_reading
