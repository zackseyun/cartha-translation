translation:
  language: ko
  text: 찾아보고 살피십시오. 찾고 찾아내십시오. 그것을 굳게 붙드십시오. 놓지 마십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 병행본문은 “찾으라. 그러면 그것이 너에게 알려질 것이다”라고 읽습니다. 히브리어 증인은 더 직접적으로 “찾으라, 그리고 찾아내라”라고 읽습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: דְּרֹש
  english_pob_choice: Search out
  chosen_korean: 찾아내고
  alternatives_korean:
  - 탐구하고
  - 찾고
  lexicon: HALOT
  rationale: דרש의 능동적이고 철저한 추적을 살리기 위해 단순한 '찾다'보다 강한 '찾아내다'를 택했습니다. 바로 뒤의 חקר와도 구별됩니다.
- source_word: וַחֲקֹר
  english_pob_choice: and investigate
  chosen_korean: 조사하십시오
  alternatives_korean:
  - 검토하십시오
  - 살피십시오
  lexicon: HALOT
  rationale: חקר는 깊이 파고들어 살피는 뜻이므로, 현대 한국어에서 가장 직접적인 '조사하다'가 어울립니다.
- source_word: בַּקֵּש
  english_pob_choice: seek
  chosen_korean: 찾으십시오
  alternatives_korean:
  - 구하십시오
  - 찾아보십시오
  lexicon: HALOT
  rationale: בקש의 기본 의미를 살리되, 앞의 '찾아내다'와 어조를 구별하기 위해 더 간결한 '찾으십시오'로 옮겼습니다.
- source_word: וְהֶחֱזַקְתָּהּ / וְאַל תַּרְפֶּהָ
  english_pob_choice: Hold fast to her, and do not let her go
  chosen_korean: 그것을 굳게 붙드십시오. 그리고 그것을 놓지 마십시오.
  alternatives_korean:
  - 그녀를 굳게 붙드십시오
  - 그것을 굳게 잡으십시오
  lexicon: HALOT
  rationale: 히브리어는 여성형 목적어를 사용하지만, 지혜의 인격화를 한국어에서 '그녀'로 고정하기보다 문맥상 가리키는 대상의 추상성을 살려 '그것'으로 옮겼습니다. '굳게 붙드십시오'는 חזק의 지속적·강한 붙듦을, '놓지 마십시오'는 רפה의 풀어짐을 자연스럽게 드러냅니다.
theological_decisions:
- issue: 지혜의 여성형 목적어와 인칭 처리
  chosen_reading: 한국어 본문에서는 의인화된 지혜를 직접 '그녀'로 고정하지 않고 '그것'으로 두었습니다.
  alternative_readings:
  - '''그녀를 굳게 붙드십시오''로 의인화를 보존함'
  - '''지혜를 굳게 붙드십시오''로 명시함'
  rationale: 이 절은 지혜를 여성형으로 의인화하지만, 바로 앞뒤 문맥의 핵심은 인격적 지혜 자체보다 그것을 끝까지 붙드는 행동입니다. 한국어에서 '그녀'는 현대 독자에게 불필요한 성별 인상을 줄 수 있어, 문맥상 대상의 추상성을 유지하는 방향을 택했습니다.
  doctrine_reference: 'Translation philosophy: preserve source meaning and readable modern Korean without overcommitting a personification where the source form can be represented more neutrally.'
- issue: 히브리어와 그리스어의 분기
  chosen_reading: 본문은 히브리어의 명령 연쇄('찾으라, 그리고 찾아내라')를 따르고, 그리스어의 '알게 될 것이다'는 주석으로만 처리했습니다.
  alternative_readings:
  - 그리스어를 따라 '찾으십시오. 그러면 그것이 알려질 것입니다.'로 번역함
  rationale: 이 단락은 히브리어 전승이 분명히 남아 있고, POB 기록도 히브리어 본문을 मुख्य 본문으로 삼되 그리스어 병행본문의 차이를 보존합니다. 따라서 본문은 히브리어를 따르되, 분기점은 주석으로 드러내는 편이 가장 투명합니다.
  doctrine_reference: 'PHILOSOPHY.md: translate from Hebrew where it survives; preserve significant parallel divergences in footnotes.'
