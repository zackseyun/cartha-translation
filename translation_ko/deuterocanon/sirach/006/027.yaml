  naturalness: 합쇼체는 유지되었으나, ‘찾으십시오, 그리고 찾아내십시오’와 반복된 ‘그것을’은 다소 부자연스럽습니다. ‘찾아보고 살피십시오. 찾고 찾아내십시오’는 원문의 의도적인 탐구 동사 축적을 유지하면서 현대 한국어로 더 자연스럽습니다.
