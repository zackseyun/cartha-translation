- from: 찾아내고 조사하십시오. 찾으십시오, 그리고 찾아내십시오. 그것을 굳게 붙드십시오. 그리고 그것을 놓지 마십시오.[a]
  to: 찾아보고 살피십시오. 찾고 찾아내십시오. 그것을 굳게 붙드십시오. 놓지 마십시오.[a]
  rationale: 히브리어 본문을 따라 명령의 연쇄와 ‘찾아냄’의 결말을 본문에 유지했습니다. ‘찾아보고 살피십시오 / 찾고 찾아내십시오’는 דרש·חקר·בקש·מצא의 구별과 수사적 축적을 비교적 자연스럽게 전달합니다. 여성형 목적어는 한국어에 문법 성을 표시할 자연스러운 대명사 체계가 없으므로 ‘그것’으로 두되, 문맥의 지혜 의인화를 배제하지 않았습니다. 그리스어와 히브리어의 발견 절 차이는 각주에서 충실히 밝혔습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T19:09:37Z'
