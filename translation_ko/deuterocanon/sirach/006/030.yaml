base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/006/030.yaml
  text: Its yoke is a golden ornament[b][a], and its bonds are a cord of blue thread.
  footnotes:
  - marker: a
    text: Hebrew preserves 'yoke' imagery here, while the Greek parallel emphasizes adornment ('an ornament of gold upon her'). The translation keeps both senses by rendering the first phrase as a yoke that is also a golden ornament.
    reason: alternative_reading
  - marker: b
    text: Or 'a cord of violet-blue' or 'a hyacinth-blue cord.' The color term refers to a valued blue-purple dyed thread.
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 멍에는 금으로 된 장식이고, 그의 결박은 청색 실로 된 끈입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘멍에’ 이미지를 보존하고, 그리스어 평행본문은 ‘그 위의 금 장식’이라는 뜻을 더 분명히 합니다. 본문은 이 두 느낌을 함께 살립니다.
    reason: source_note
  - marker: b
    text: ‘청색 실’은 보랏빛을 띤 청색 염색 실을 가리킬 수 있습니다. 그리스어 평행본문의 ὑάκινθινον도 푸른-보랏빛 계열을 뒷받침합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֻלֵּי / עֻלָּהּ
  english_pob_choice: yoke / golden ornament
  chosen_korean: 멍에는 금으로 된 장식
  alternatives_korean:
  - 멍에
  - 장식
  - 목걸이
  lexicon: HALOT
  rationale: 히브리어는 ‘멍에’ 이미지와 장식적 뉘앙스를 함께 지니며, 영어 POB도 이 긴장을 유지합니다. 한국어에서는 ‘멍에’만 두면 부담의 이미지로만 좁아지므로, 뒤에 ‘금으로 된 장식’을 붙여 원문의 이중성을 살렸습니다.
- source_word: מוֹסְרוֹתֶיהָ
  english_pob_choice: bonds
  chosen_korean: 결박
  alternatives_korean:
  - 끈
  - 사슬
  - 묶음
  lexicon: HALOT
  rationale: 이 단어는 묶는 것, 억제하는 것을 가리키므로 ‘결박’이 가장 직접적입니다. 이어지는 ‘청색 실로 된 끈’과 함께, 관계를 묶는 이미지가 분명하게 드러납니다.
- source_word: פְּתִיל תְּכֵלֶת
  english_pob_choice: a cord of blue thread
  chosen_korean: 청색 실로 된 끈
  alternatives_korean:
  - 보랏빛 푸른 실의 끈
  - 히아신스빛 끈
  - 청색 끈
  lexicon: HALOT
  rationale: פְּתִיל은 ‘실’보다 조금 더 실용적인 ‘끈/실’의 중간 느낌이 있어 ‘끈’으로, תְּכֵלֶת은 성막·제사장 문맥의 특수한 청색 염료를 가리키므로 ‘청색 실’로 풀어 옮겼습니다. 영어 POB의 각주가 제시한 색조의 다양성은 각주로 보완했습니다.
theological_decisions:
- issue: 히브리어의 ‘멍에’와 그리스어의 ‘장식’ 사이의 긴장
  chosen_reading: 본문은 ‘멍에’의 억압성만으로도, ‘장식’의 미적 이미지로만도 환원하지 않고 두 의미를 함께 보이게 했습니다.
  alternative_readings:
  - ‘그의 금 장식은…’처럼 장식으로만 번역
  - ‘그의 멍에는…’처럼 부담으로만 번역
  rationale: 원문 전승은 지혜에 매이는 것이 단지 속박이 아니라 귀하고 아름다운 것임을 함께 말합니다. 한국어도 이 긴장을 유지해야 원문의 신학적 효과가 살아납니다.
  doctrine_reference: 'POB 번역 원칙: theological tension 유지'
