  text: He will give understanding to your heart[a], and what you have desired will make you wise.
  footnotes:
  - marker: a
    text: 'Greek parallel: ''he himself will strengthen your heart, and the desire of your wisdom will be given to you.'' The Hebrew witness here instead reads, ''He will give understanding to your heart, and what you have desired will make you wise.'''
    reason: alternative_reading
translation:
  language: ko
  text: 그분은 당신의 마음에 분별력을 주시고, 당신이 바란 것은 당신을 지혜롭게 할 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 평행본문은 “그가 친히 당신의 마음을 강하게 하실 것이며, 당신의 지혜에 대한 갈망이 당신에게 주어질 것입니다”라고 읽습니다. 히브리어 증언은 여기에서 “그분은 당신의 마음에 분별력을 주시고, 당신이 바란 것은 당신을 지혜롭게 할 것입니다”라고 읽습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהוּא
  english_pob_choice: He
  chosen_korean: 그분은
  alternatives_korean:
  - 그는
  - 그것은
  lexicon: HALOT
  rationale: 히브리어 남성 단수 대명사를 인격적 주어로 살려, 그분이 직접 행하시는 행동임을 드러냈습니다. 영어 POB의 주어 이해와도 맞습니다.
- source_word: יָבִין
  english_pob_choice: will give understanding
  chosen_korean: 분별력을 주시고
  alternatives_korean:
  - 이해하게 하시고
  - 깨닫게 하시고
  lexicon: HALOT
  rationale: 히필형의 사역적 뜻을 반영해 단순한 ‘이해하다’보다 ‘이해/분별을 주다’로 옮겼습니다. ‘분별력’은 ‘your heart’에 대한 인지적 작용을 자연스럽게 드러냅니다.
- source_word: לִבֶּךָ
  english_pob_choice: your heart
  chosen_korean: 당신의 마음
  alternatives_korean:
  - 당신의 심장
  - 당신의 내면
  lexicon: HALOT
  rationale: 히브리어 לֵב은 사고와 의지의 중심을 가리키므로, 한국어에서는 현대어로 가장 자연스러운 ‘마음’을 택했습니다. 전통적 ‘심장’보다 본문의 인지적 의미를 잘 전달합니다.
- source_word: יְחַכְּמֶךָּ
  english_pob_choice: will make you wise
  chosen_korean: 당신을 지혜롭게 할 것입니다
  alternatives_korean:
  - 당신에게 지혜를 주실 것입니다
  - 당신을 현명하게 하실 것입니다
  lexicon: HALOT
  rationale: 히브리어의 사역적 ‘지혜롭게 하다’라는 의미를 살려, 결과를 직접적으로 말하는 표현으로 옮겼습니다. ‘지혜를 주다’보다 원문의 동사성을 더 가깝게 반영합니다.
theological_decisions:
- issue: 대명사 ‘그분’의 지시 대상
  chosen_reading: 그분은 하나님/주님을 가리키는 인격적 주어로 읽었습니다.
  alternative_readings:
  - 지혜나 추상적 원리
  - 비인칭적 주어
  rationale: 히브리어 단독으로는 선행사가 명시되지 않지만, 영어 POB가 제시한 그리스어 평행본문이 주님의 계명에 묵상하는 맥락에서 ‘그 자신’이 마음을 강하게 하신다고 읽게 합니다. 따라서 비인칭화하지 않고 인격적 행위자로 유지했습니다.
  doctrine_reference: 지혜문학의 신적 인격화 및 하나님의 주도적 인도
