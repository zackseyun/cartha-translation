  text: He will give understanding to your heart[a], and what you have desired will make you wise.
  footnotes:
  - marker: a
    text: 'Greek parallel: ''he himself will strengthen your heart, and the desire of your wisdom will be given to you.'' The Hebrew witness here instead reads, ''He will give understanding to your heart, and what you have desired will make you wise.'''
