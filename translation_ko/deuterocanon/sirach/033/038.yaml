  yaml_path: translation/deuterocanon/sirach/033/038.yaml
  text: For there is a friend in his own time[a], and he will certainly not remain in the day of your distress.
  footnotes:
  - marker: a
    text: Or, 'there is a friend for a time' or 'when it suits him,' highlighting the idea of friendship that lasts only under favorable conditions.
    reason: lexical_alternative
translation:
  language: ko
  text: 친구는 자기 때에만 있으며, 당신의 환난 날에는 결코 머물지 않을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘잠깐의 친구’, 혹은 ‘자기에게 유리할 때만’의 뜻으로, 우정이 좋은 조건에서만 지속되는 경우를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: φίλος
  english_pob_choice: friend
  chosen_korean: 친구
  alternatives_korean:
  - 벗
  - 동무
  lexicon: BDAG
  rationale: 일반적인 인간관계의 친구를 가리키므로, 자연스럽고 현대적인 표준어인 ‘친구’로 옮겼습니다.
- source_word: ἐν καιρῷ αὐτοῦ
  english_pob_choice: in his own time
  chosen_korean: 자기 때에만
  alternatives_korean:
  - 자기 때에
  - 때에 맞을 때에
  - 마땅한 때에
  lexicon: BDAG
  rationale: καιρός는 ‘정해진 때/적절한 때’의 뜻이 있어, 자기에게 유리한 시기에만 드러나는 조건적 우정을 드러내기 위해 ‘자기 때에만’으로 옮겼습니다.
- source_word: οὐ μὴ παραμείνῃ
  english_pob_choice: he will certainly not remain
  chosen_korean: 결코 머물지 않을 것입니다
  alternatives_korean:
  - 결코 남아 있지 않을 것입니다
  - 절대로 머물지 않을 것입니다
  lexicon: BDAG
  rationale: οὐ μή의 강한 부정을 살려 단순한 미래 부정이 아니라 ‘결코 … 않다’의 확정적 거절로 표현했습니다.
- source_word: ἐν ἡμέρᾳ θλίψεώς σου
  english_pob_choice: in the day of your distress
  chosen_korean: 당신의 환난 날에는
  alternatives_korean:
  - 당신의 고난 날에는
  - 당신의 곤경의 날에는
  lexicon: BDAG
  rationale: θλῖψις는 단순한 어려움보다 더 강한 압박·환난의 뉘앙스가 있어, 본문의 중한 상황을 살려 ‘환난’으로 옮겼습니다.
theological_decisions:
- issue: 조건적 우정의 뉘앙스
  chosen_reading: ‘자기 때에만’은 친구가 유익할 때만 가까이하는 계산된 관계를 드러내는 표현으로 보았습니다.
  alternative_readings:
  - 단순히 ‘자기 때에’로 중립적으로 옮길 수 있음
  - ‘때가 맞을 때만’으로 해석을 더 분명히 할 수 있음
  rationale: 영문 주석도 friendship that lasts only under favorable conditions를 지적하므로, 본문이 말하는 우정의 불충분함을 희석하지 않도록 했습니다.
  doctrine_reference: 지혜문학의 도덕적 경고; 인간관계의 진실성
- issue: 강한 부정의 재현
  chosen_reading: ‘결코 … 않을 것입니다’로 οὐ μή의 절대적 부정을 반영했습니다.
  alternative_readings:
  - ‘아마 … 않을 것입니다’
  - ‘…하지 않을 것입니다’
  rationale: 본문의 강조는 단순 예측이 아니라 확정적 부정이므로, 한국어에서도 강한 부정을 유지해야 합니다.
  doctrine_reference: 헬라어 부정법 οὐ μή
