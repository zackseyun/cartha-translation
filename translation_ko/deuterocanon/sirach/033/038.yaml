review_pass:
  verdict: revise
  source_fidelity: The emphatic future negation in οὐ μὴ παραμείνῃ is conveyed well by ‘결코 … 않을 것입니다.’ However, the draft’s ‘친구는 자기 때에만 있으며’ is syntactically unnatural and makes the referent of the following action less clear. A personal formulation better reflects φίλος and the singular pronoun implicit in the Greek verb. The phrase ἐν καιρῷ αὐτοῦ remains somewhat ambiguous; the revised wording retains the contextual sense of a friend whose friendship is limited to his own favorable time, while the note records alternatives.
  naturalness: ‘친구는 … 있으며’ is not natural modern Korean for a person who proves to be a conditional friend. ‘자기 때에만 친구로 지내는 사람이 있으나, 그는 …’ is clear, idiomatic, and maintains modern formal-polite register.
  terminology: ‘친구,’ ‘환난,’ and ‘결코’ are appropriate. ‘환난의 날’ naturally represents ἐν ἡμέρᾳ θλίψεώς σου without weakening its serious sense.
  issues:
  - severity: medium
    issue: The opening clause is awkward and has an unclear personal referent.
    rationale: ‘친구는 자기 때에만 있으며’ treats ‘friend’ as an abstract existence and leaves the subsequent subject unexpressed. The Greek speaks of a friend who does not remain in distress; Korean should explicitly retain that person.
  - severity: low
    issue: The footnote is placed at the end rather than at the temporally ambiguous phrase.
    rationale: The note concerns ἐν καιρῷ αὐτοῦ, not the whole sentence. Moving its anchor to ‘자기 때에만’ improves anchor accuracy.
  revised_text: 자기 때에만[a] 친구로 지내는 사람이 있으나, 그는 당신의 환난의 날에는 결코 곁에 남아 있지 않을 것입니다.
  revised_footnotes:
  - marker: a
    text: 또는 ‘한동안 친구로 지내는 사람’ 또는 ‘자기에게 유리할 때에 친구로 지내는 사람’으로 옮길 수 있습니다. 이는 좋은 조건에서만 지속되는 우정을 가리킬 수 있습니다.
    reason: lexical_alternative
