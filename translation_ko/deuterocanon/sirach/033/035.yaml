  terminology: ‘낯선 이’는 ἀλλότριον의 비특정적이고 비민족적인 의미를 유지합니다. ‘당신의 것들’은 사람, 집안, 소유를 어느 하나로 한정하지 않으며, 각주에서 가능한 범위를 설명합니다.
