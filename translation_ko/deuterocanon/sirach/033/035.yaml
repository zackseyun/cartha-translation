base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/033/035.yaml
  text: Settle a stranger with you[a], and he will throw you into turmoil, and estrange you from your own.
  footnotes:
  - marker: a
    text: Or 'from your own household' or 'from what is your own.' The Greek τῶν ἰδίων σου is broad and can refer to one's own people, household, or belongings; the context favors estrangement from one's proper circle.
    reason: lexical_alternative
translation:
  language: ko
  text: 낯선 사람을 당신 곁에 정착시키면 그는 당신을 혼란에 빠뜨리고, 당신의 것에서 당신을 멀어지게 할 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신의 집안에서’ 또는 ‘당신의 소유에서’. 헬라어 τῶν ἰδίων σου는 넓게는 사람들, 가정, 소유를 가리킬 수 있으며, 문맥은 자신의 적절한 관계망에서 멀어지는 뜻을 더 잘 지지합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: παροίκισον
  english_pob_choice: Settle ... with you
  chosen_korean: 당신 곁에 정착시키면
  alternatives_korean:
  - 당신과 함께 살게 하면
  - 당신 집에 머물게 하면
  - 당신 곁에 거주시키면
  lexicon: LSJ
  rationale: παροικίζω의 사역적 뉘앙스인 ‘옆에 살게 하다/거주하게 하다’를 살리되, 현대 한국어에서는 ‘정착시키다’가 자연스럽고 경고의 의미도 잘 드러냅니다.
- source_word: ἀλλότριον
  english_pob_choice: a stranger
  chosen_korean: 낯선 사람
  alternatives_korean:
  - 외인
  - 이방인
  - 남의 사람
  lexicon: LSJ
  rationale: 직역하면 ‘남의 것에 속한 자/낯선 자’이므로, 여기서는 혈통보다 소속의 낯섦을 가리키는 일반적 표현인 ‘낯선 사람’이 가장 무난합니다.
- source_word: διαστρέψει σε ἐν ταραχαῖς
  english_pob_choice: will throw you into turmoil
  chosen_korean: 당신을 혼란에 빠뜨리고
  alternatives_korean:
  - 당신을 소란 속에 던지고
  - 당신을 뒤흔들고
  - 당신을 소동에 빠뜨리고
  lexicon: LSJ
  rationale: διαστρέφω와 ταραχαί의 결합은 단순한 기분 상함보다 삶의 질서가 흔들리는 상태를 가리키므로, ‘혼란에 빠뜨리다’가 힘과 결과를 함께 전달합니다.
- source_word: τῶν ἰδίων σου
  english_pob_choice: from your own
  chosen_korean: 당신의 것에서
  alternatives_korean:
  - 당신의 사람들에서
  - 당신의 집안에서
  - 당신의 소유에서
  lexicon: LSJ
  rationale: ἴδια는 문맥상 사람, 가정, 소유를 포괄할 수 있어, 범위를 좁히지 않도록 ‘당신의 것’으로 옮겼습니다. 이는 POB의 본문 의도인 폭넓은 소외를 유지합니다.
theological_decisions:
- issue: 잠언형 지혜 경고의 대상 범위
  chosen_reading: 이 구절은 특정 집단이나 외국인 자체를 정죄하는 말이 아니라, 자기 공동체 밖의 사람을 무분별하게 들일 때 생길 관계적·사회적 혼란을 경계하는 경구로 읽었습니다.
  alternative_readings:
  - 외부인을 들이지 말라는 민족주의적 금지로 읽기
  - 가정 내부의 재산 손실 경고로만 읽기
  rationale: 헬라어의 ἀλλότριον과 τῶν ἰδίων σου가 모두 넓은 의미를 가지므로, 문맥의 지혜 문학적 경고를 살리는 해석이 가장 적절합니다.
  doctrine_reference: 지혜문학의 경구적 성격
