  text: A yoke and a strap will bend the neck[a], and for a wicked slave there are racks and tortures.
  footnotes:
  - marker: a
    text: Or 'servant' or 'household servant' for Greek οἰκέτῃ; the main text uses 'slave' because the context emphasizes bonded status and coercive discipline.
    reason: lexical_alternative
translation:
  language: ko
  text: 멍에와 가죽끈은 목을 굽히게 하고, 악한 노예에게는 고문틀과 고문이 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘종’, ‘집안 종’으로도 옮길 수 있습니다. 그러나 본문은 강제적 훈육과 속박의 맥락을 강조하므로 본문에서는 ‘노예’를 택했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ζυγός
  english_pob_choice: yoke
  chosen_korean: 멍에
  alternatives_korean:
  - 요
  - 고랑틀
  lexicon: LSJ
  rationale: 가축의 목에 얹는 도구라는 구체적 이미지를 살려, 목을 ‘굽히게’ 한다는 뒤 문맥과 자연스럽게 대응시켰습니다.
- source_word: ἱμὰς
