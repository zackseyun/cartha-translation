  - 채찍끈
  - 띠
  lexicon: LSJ
  rationale: ἱμάς는 가죽으로 된 끈이나 띠를 가리키므로, 현대 한국어에서 가장 직접적이고 구체적인 ‘가죽끈’으로 옮겼습니다.
- source_word: οἰκέτῃ
  english_pob_choice: slave
  chosen_korean: 노예
  alternatives_korean:
  - 종
  - 하인
  - 집안 종
  lexicon: BDAG
  rationale: 영어 POB가 bonded status를 살리기 위해 ‘slave’를 택한 점을 따라, 종보다 더 강하게 속박과 강제적 처벌의 현실을 드러내는 ‘노예’를 사용했습니다.
- source_word: στρέβλαι καὶ βάσανοι
  english_pob_choice: racks and tortures
  chosen_korean: 선반과 고문
  alternatives_korean:
  - 고문틀과 고문
  - 고문대와 고문
  - 비틀개와 고문
  lexicon: LSJ
  rationale: στρέβλαι는 비트는 고문 기구를, βάσανοι는 고문/심한 고통을 뜻하므로 두 개념을 각각 살리되, 한국어에서 문장 흐름이 매끄럽도록 ‘선반과 고문’으로 옮겼습니다.
theological_decisions:
