  language: ko
  text: 그들이 주님을 알게 하시되, 우리도 주님을 알았던 것처럼 하십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 ἐπιγνώτωσάν은 일반적인 ‘알다’보다 더 강한 인식, 곧 ‘알아보다/충분히 알다’의 뉘앙스를 가질 수 있지만, 본문은 이를 한국어 본문에서 과도하게 분리해 강조하지는 않았습니다.
    reason: lexical_alternative
