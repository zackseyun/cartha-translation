  text: Put your slave to work[a], and you will find rest; let his hands be idle, and he will seek freedom.
  footnotes:
  - marker: a
    text: Greek παιδί literally means 'child' or 'boy,' but here it refers to a household dependent under authority; 'servant' is a possible alternative, though the context of seeking freedom supports the stronger sense 'slave.'
    reason: lexical_alternative
translation:
  language: ko
  text: 네 종을 일하게 하십시오[a], 그러면 안식을 얻으실 것입니다. 그의 손을 쉬게 하십시오, 그러면 그는 자유를 찾을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 παιδί는 문자적으로는 ‘아이/소년’을 뜻할 수 있지만, 여기서는 가정 내 종속 노동자를 가리키며, 뒤의 ‘자유를 찾다’와 맞물려 더 강한 ‘종’의 의미가 두드러집니다.
    reason: lexical_alternative
