  rationale: 문맥상 가정 내 종속 노동자를 가리키므로 단순한 ‘하인’보다 지위의 종속성을 드러내는 ‘종’을 택했습니다. 영어 POB의 ‘slave’처럼 노골적 표현을 그대로 반복하기보다 한국어 수용성을 고려해 ‘네 종’으로 번역했습니다.
- source_word: ἄνες χεῖρας αὐτῷ
  english_pob_choice: let his hands be idle
  chosen_korean: 그의 손을 쉬게 하십시오
  alternatives_korean:
  - 그의 손을 놀게 하십시오
  - 그의 손을 놓아 주십시오
  lexicon: LSJ
  rationale: ἄνες의 ‘느슨하게 하다/쉬게 하다’와 χεῖρας αὐτῷ의 ‘그의 손’을 함께 살려, 노동 중단의 이미지를 자연스럽게 전달했습니다.
- source_word: ζητήσει ἐλευθερίαν
  english_pob_choice: he will seek freedom
  chosen_korean: 그는 자유를 찾을 것입니다
  alternatives_korean:
