  terminology: 문맥상 παιδί는 단순한 아이보다는 집안의 종속된 사람을 가리키므로 ‘종’은 가능한 문맥적 번역입니다. 다만 해당 낱말의 기본 의미가 ‘아이/소년’이므로 각주에서 그 어휘적 여지를 밝혀 두는 것이 좋습니다. ἐλευθερία는 ‘자유’로 적절합니다.
