  text: Put your slave to work[a], and you will find rest; let his hands be idle, and he will seek freedom.
  footnotes:
  - marker: a
    text: Greek παιδί literally means 'child' or 'boy,' but here it refers to a household dependent under authority; 'servant' is a possible alternative, though the context of seeking freedom supports the stronger sense 'slave.'
    reason: lexical_alternative
translation:
  language: ko
  text: 종을 일하게 하십시오[a]. 그러면 안식을 얻을 것입니다. 그의 손을 놀게 하십시오. 그러면 그는 자유를 찾을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 παιδί는 문자적으로 ‘아이’ 또는 ‘소년’을 뜻합니다. 그러나 여기서는 집안에서 권위 아래 있는 종속된 사람을 가리키는 것으로 보이며, 뒤의 ‘자유를 찾을 것이다’라는 말과 함께 볼 때 ‘종’으로 옮겼습니다. ‘하인’으로 옮길 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔργασαι
