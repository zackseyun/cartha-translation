base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/033/036.yaml
  text: Do not seek counsel from every man[b][a], but keep one counselor out of a thousand.
  footnotes:
  - marker: a
    text: Or, 'Do not consult every man.' The Greek verb can mean 'consult' or 'take counsel.'
    reason: lexical_alternative
  - marker: b
    text: The phrase 'one out of a thousand' is proverbial hyperbole, urging extreme selectivity in choosing a counselor.
    reason: cultural_note
translation:
  language: ko
  text: 모든 사람에게서 조언을 구하지 마십시오. 그러나 천 명 가운데 한 사람만 조언자로 두십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘모든 사람과 의논하지 마십시오.’ 그리스어 동사 συμβούλευε는 ‘의논하다’ 또는 ‘조언을 구하다’라는 뜻으로도 쓰일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘천 명 가운데 한 사람’은 속담적 과장법으로, 조언자를 고를 때 극도로 신중하라는 뜻입니다.
    reason: cultural_note
lexical_decisions:
- source_word: μὴ ἐν παντὶ ἀνθρώπῳ συμβούλευε
  english_pob_choice: Do not seek counsel from every man
  chosen_korean: 모든 사람에게서 조언을 구하지 마십시오
  alternatives_korean:
  - 모든 사람과 의논하지 마십시오
  - 모든 사람에게 조언을 구하지 마십시오
  lexicon: BDAG
  rationale: συμβούλευε는 ‘조언을 구하다/의논하다’의 뜻을 가지므로, 한국어에서는 자연스러운 금지 명령인 ‘조언을 구하지 마십시오’로 옮겼고, ἐν παντὶ ἀνθρώπῳ는 ‘모든 사람에게서’로 처리해 상담의 출처를 드러냈습니다.
- source_word: ἕνα ἐκ χιλίων
  english_pob_choice: one out of a thousand
  chosen_korean: 천 명 중 한 사람
  alternatives_korean:
  - 천 명 가운데 하나
  - 천 명 중 하나
  lexicon: BDAG
  rationale: 비유적 과장법을 보존하기 위해 직역에 가깝게 옮겼으며, 한국어에서는 ‘한 사람’으로 받아 사람이 선택되는 맥락을 분명히 했습니다.
- source_word: σύμβουλον
  english_pob_choice: counselor
  chosen_korean: 조언자
