  - 권고자
  lexicon: BDAG
  rationale: 명사형 대응을 유지하되 현대 한국어에서 가장 자연스러운 ‘조언자’를 택해, 앞의 ‘조언을 구하다’와 어휘 연결을 살렸습니다.
- source_word: ἔχε
  english_pob_choice: keep
  chosen_korean: 두십시오
  alternatives_korean:
  - 가지십시오
  - 간직하십시오
  lexicon: BDAG
  rationale: 단순 소유보다 신중하게 ‘보유하다/두다’의 뉘앙스를 살리기 위해 ‘두십시오’로 옮겼습니다.
