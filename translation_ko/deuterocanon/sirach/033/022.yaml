  text: For it is better that your children should have need of you than that you should look to the hands of your sons[a].
  footnotes:
  - marker: a
    text: Or, more dynamically, 'than that you should depend on your sons.' The Greek literally says 'look to the hands of your sons,' using 'hands' as an image of support or provision.
    reason: lexical_alternative
translation:
  language: ko
  text: 참으로 자녀들이 여러분을 필요로 하는 편이, 여러분이 아들들의 손을 바라보는 것보다 낫습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘아들들의 손을 바라보다’입니다. 여기서 ‘손’은 도움이나 부양을 가리키는 이미지입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: κρεῖσσον
  english_pob_choice: better
  chosen_korean: 낫습니다
  alternatives_korean:
  - 더 좋습니다
  - 더 낫습니다
  - 유익합니다
  lexicon: LSJ
  rationale: 비교급의 실질적 우위를 자연스러운 현대 한국어로 간결하게 살렸습니다.
- source_word: τέκνα
  english_pob_choice: children
  chosen_korean: 자녀들이
  alternatives_korean:
  - 아이들이
  - 자식들이
  - 아들딸이
  lexicon: LSJ
  rationale: 앞부분의 τέκνα는 성별을 특정하지 않는 넓은 표현이므로, 한국어에서도 포괄적인 ‘자녀들’로 옮겼습니다.
- source_word: ἐμβλέπειν εἰς χεῖρας
  english_pob_choice: should look to the hands of your sons
  chosen_korean: 아들들의 손을 바라보는 것
  alternatives_korean:
  - 아들들의 손에 의지하는 것
  - 아들들에게서 도움을 바라는 것
  - 아들들의 손을 바라보는 것
  lexicon: LSJ
  rationale: 직역하면 ‘손을 바라보다’이지만, 한국어에서는 ‘바라보다’가 의존과 기대의 이미지를 유지하면서도 문장을 자연스럽게 만듭니다.
- source_word: υἱῶν
  english_pob_choice: sons
  chosen_korean: 아들들의
  alternatives_korean:
  - 자녀들의
  - 아들들의
  lexicon: LSJ
  rationale: 뒤의 υἱῶν은 앞의 τέκνα와 달리 분명히 ‘아들들’이므로, 앞부분과 구별되는 표현을 유지했습니다.
theological_decisions:
- issue: 가정 내 부양 관계의 방향성
  chosen_reading: 부모가 자녀에게 의존하는 것보다 자녀가 부모를 필요로 하는 편이 더 낫다는 지혜문으로 읽었습니다.
  alternative_readings:
  - 자녀가 부모를 필요로 하는 것이 아니라 단순히 경제적 우위를 말하는 것
  - 아들과의 상호의존을 말하는 것
  rationale: 본문은 ‘자녀들이 여러분을 필요로 하는 편’과 ‘아들들의 손을 바라보는 편’을 대조하여, 노년의 역전된 의존 상태를 경계하는 지혜를 말합니다.
  doctrine_reference: 지혜문학의 실천적 권면
- issue: ‘손’의 은유
  chosen_reading: ‘손’을 실제 손이 아니라 공급·부양의 상징으로 이해하되, 한국어 본문에는 이미지를 보존했습니다.
  alternative_readings:
  - ‘손’을 생략하고 의미만 전달
  - ‘도움’으로만 풀어쓰기
  rationale: 원문은 χεῖρας를 통해 지원과 생계의 이미지를 남기므로, 해석을 과도하게 평준화하지 않고 은유를 살렸습니다.
  doctrine_reference: 지혜문학의 수사적 이미지
