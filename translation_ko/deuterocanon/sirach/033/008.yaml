  source_fidelity: 그리스어 ἔγειρον θυμὸν καὶ ἔκχεον ὀργήν의 두 명령을 빠짐없이 옮겼습니다. ‘분노를 일으키고’는 ἔγειρον θυμόν의 감정을 불러일으키는 동작을, ‘진노를 쏟아내십시오’는 ἔκχεον ὀργήν의 액체적 비유와 명령법을 충실히 보존합니다. 현존 본문에 없는 내용을 보충하지 않았습니다.
  naturalness: ‘분노를 일으키고 진노를 쏟아내십시오’는 현대 표준 한국어의 격식 있는 합쇼체로 자연스럽습니다. 짧은 병렬 명령문의 리듬도 유지됩니다.
  terminology: ‘분노’와 ‘진노’는 θυμός와 ὀργή의 병렬 및 미세한 어감 차이를 한국어에서 무리 없이 드러냅니다. ‘진노’가 문맥상 반드시 신적 진노를 뜻한다고 한정하지 않으며, 원문의 강한 ὀργή에 적절합니다. 본문비평 각주도 영어 감사 기록의 불확실성 범위와 일치합니다.
