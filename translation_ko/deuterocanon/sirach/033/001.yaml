  rationale: 이 프로젝트의 기본 원칙에 따라 여호와가 아니라 야훼를 사용해 고유한 언약명을 드러냈습니다.
  doctrine_reference: 'PROJECT GLOSSARY: יהוה / YHWH → 야훼'
- issue: 재난의 범위와 시편적-잠언적 긴장 유지
  chosen_reading: 악을 만나지 않습니다. 그러나 시험 가운데서 그는 다시 돌아서서 벗어납니다.
  alternative_readings:
  - 전혀 해를 입지 않습니다
  - 시험에서 곧바로 구원받습니다
  rationale: 본문은 경외하는 자의 보전을 말하지만, 동시에 시험의 가능성을 열어 둡니다. 절대적 무고통으로 평탄화하지 않고, 경구의 확신과 긴장을 함께 살렸습니다.
  doctrine_reference: DOCTRINE.md §3 Preserve theological tension rather than resolve it
