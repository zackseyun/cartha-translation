lexical_decisions:
- source_word: יְרֵא יְהֹוָה
  english_pob_choice: One who fears Yahweh
  chosen_korean: 야훼를 경외하는 사람
  alternatives_korean:
  - 야훼를 두려워하는 사람
  - 야훼를 경외하는 자
  lexicon: HALOT
  rationale: 히브리어 분사구는 야훼에 대한 지속적 경외로 특징지어진 사람을 가리키므로, 현대 한국어에서는 자연스럽고 품위 있는 ‘경외하는 사람’이 가장 적합합니다.
- source_word: לֹא יִפְגַּע רָע
  english_pob_choice: will not meet with evil
  chosen_korean: 악을 만나지 않습니다
  alternatives_korean:
  - 해를 당하지 않습니다
  - 재앙을 만나지 않습니다
  lexicon: HALOT
  rationale: פגע는 여기서 ‘마주치다/만나다’의 의미를 살리고, רָע는 도덕적 악보다 해악·재앙까지 포함할 수 있어 ‘악’으로 넓게 두었습니다.
- source_word: כִּי אִם
  english_pob_choice: for even
  chosen_korean: 그러나
  alternatives_korean:
  - 오직
  - 하지만
  lexicon: HALOT
  rationale: 뒤의 시험과 탈출을 고려하면 단순한 부정 강화가 아니라 허용된 대비를 표시하는 연결이 필요하므로, 한국어에서는 대조를 드러내는 ‘그러나’로 옮겼습니다.
- source_word: שָׁב וְנִמְלָט
  english_pob_choice: he will turn back and escape
  chosen_korean: 다시 돌아서서 벗어납니다
  alternatives_korean:
  - 다시 돌아옵니다
  - 구원받아 벗어납니다
  lexicon: HALOT
  rationale: שָׁב와 נִמְלָט 두 동사를 분리해 보존했습니다. ‘돌아서다’는 회복적 전환을, ‘벗어나다’는 탈출/구출의 구체성을 살립니다.
