lexical_decisions:
- source_word: ἔξαρον
  english_pob_choice: Raise up
  chosen_korean: 일으키고
  alternatives_korean:
  - 들어 올리고
  - 격려하고
  - 세우고
  lexicon: LSJ
  rationale: 원문은 상대를 ‘일으키라’는 명령형으로, 문자적 상향보다 행동을 촉발하는 힘을 나타내므로 ‘일으키고’가 간결하게 살립니다.
- source_word: ἀντίδικον
  english_pob_choice: an adversary
  chosen_korean: 적대자
  alternatives_korean:
  - 대적
  - 원고
  - 송사 상대
  lexicon: BDAG
  rationale: 법정적 ‘고소자’로 좁히기보다, 병행되는 ἐχθρόν과 함께 적대 관계를 넓게 드러내는 ‘적대자’가 더 적합합니다.
- source_word: ἔκτριψον
  english_pob_choice: wipe out
  chosen_korean: 없애 버리십시오
  alternatives_korean:
  - 지워 버리십시오
  - 쓸어 버리십시오
  - 말살하십시오
  lexicon: LSJ
  rationale: 직역의 ‘문질러 지우다’보다, 적대적 문맥에서의 강한 제거 의미를 자연스러운 한국어 명령으로 옮겼습니다.
- source_word: ἐχθρόν
  english_pob_choice: an enemy
  chosen_korean: 원수
  alternatives_korean:
  - 적
  - 적군
  - 미운 자
  lexicon: BDAG
  rationale: 단수의 적대적 인물을 가리키며, 한국어에서는 ‘원수’가 병행 구조와 감정적 적대성을 가장 또렷하게 전달합니다.
theological_decisions:
- issue: 지혜문학/집회서의 공격적 명령문을 어떻게 옮길지
  chosen_reading: 원문의 두 명령형을 그대로 살려, 완화하지 않고 직선적으로 번역했습니다.
  alternative_readings:
  - 더 완곡한 기원형으로 돌려 말하기
  - 해석을 덧붙여 문맥상 제한하기
  rationale: 본문은 짧은 병렬 명령문이므로, 의미를 희석하지 않고 원문의 날카로움을 보존하는 것이 적절합니다.
  doctrine_reference: 문맥 보존과 번역 충실성
- issue: 본문 주석의 텍스트 불확실성 처리
  chosen_reading: 현존하는 스웨테 그리스어를 바탕으로 간단한 명령문으로 번역했습니다.
  alternative_readings:
  - 다른 전승의 히브리어/그리스어를 재구성해 확장하기
  - 불확실성을 본문 안에 반영해 의역하기
  rationale: 메타데이터가 본문 불일치를 알리지만, 주어진 그리스어 자체는 분명하므로 재구성 없이 최대한 밀착 번역했습니다.
  doctrine_reference: 본문비평과 번역 윤리
