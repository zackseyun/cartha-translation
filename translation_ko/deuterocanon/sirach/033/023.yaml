lexical_decisions:
- source_word: ἐν πᾶσι τοῖς ἔργοις σου
  english_pob_choice: In all your works
  chosen_korean: 모든 일에서
  alternatives_korean:
  - 모든 행위에서
  - 모든 행동에서
  lexicon: LSJ
  rationale: ἔργα는 일반적으로 ‘일/행위’를 뜻하므로, 포괄성을 살리면서도 현대 한국어에서 자연스러운 ‘모든 일에서’로 옮겼습니다.
- source_word: γίνου ὑπεράγων
  english_pob_choice: be preeminent / be outstanding
  chosen_korean: 뛰어나십시오
  alternatives_korean:
  - 탁월하십시오
  - 우수하십시오
  - 남보다 뛰어나십시오
  lexicon: LSJ
  rationale: γίνου ὑπεράγων은 단순 상태가 아니라 ‘우위를 드러내라/탁월하라’는 권면이므로, 지나치게 직역적인 표현보다 합쇼체의 권고로 자연스럽게 옮겼습니다.
- source_word: μῶμον
  english_pob_choice: a blemish
  chosen_korean: 흠
  alternatives_korean:
  - 흠집
  - 오점
  - 결점
  lexicon: LSJ
  rationale: μῶμος/μῶμον의 핵심은 명예를 손상시키는 ‘흠/비점’이므로, 한국어의 짧고 관용적인 ‘흠’이 비유적 이미지를 잘 살립니다.
- source_word: ἐν τῇ δόξῃ σου
  english_pob_choice: to your honor
  chosen_korean: 자신의 명예에
  alternatives_korean:
  - 자신의 영광에
  - 자신의 평판에
  lexicon: LSJ
  rationale: δώξα는 여기서 신학적 ‘영광’보다 사회적·윤리적 ‘명예/평판’의 뜻이 강하므로, 문맥에 맞게 ‘명예’로 옮겼습니다.
theological_decisions:
- issue: δόξα의 의미를 ‘영광’으로 둘지 ‘명예’로 둘지
  chosen_reading: 명예
  alternative_readings:
  - 영광
  - 평판
  rationale: 지혜문학적 권면으로서 이 절은 하나님께 드리는 영광이 아니라 자기 행실이 훼손되지 않도록 하는 공적 명예를 다룹니다. 따라서 ‘명예’가 가장 직접적입니다.
  doctrine_reference: 지혜문학의 윤리적·사회적 문맥 우선; source-language semantics
