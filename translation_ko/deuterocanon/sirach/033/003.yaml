base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/033/003.yaml
  text: A discerning man understands the word of Yahweh[b][a], and his instruction is like the Urim in the breastpiece.
  footnotes:
  - marker: a
    text: Or, 'and his law/instruction is like the Urim in the breastpiece,' if the suffix is taken to refer to the LORD rather than to the discerning man.
    reason: alternative_reading
  - marker: b
    text: The Hebrew witness here differs sharply from the extant Greek parallel for this verse; this translation follows the surviving Hebrew text as the primary witness for Sirach where available.
    reason: textual_variant
translation:
  language: ko
  text: 슬기로운 사람은 야훼의 말씀을 깨닫고, 그의 가르침은 가슴받이 안에 있는 우림과 같습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 가르침’은 야훼의 가르침을 가리킬 수 있습니다. 히브리어 소유 접미사가 앞의 슬기로운 사람을 가리키는지 야훼를 가리키는지는 분명하지 않습니다.
    reason: alternative_reading
  - marker: b
    text: 이 절의 현존 히브리어 본문은 같은 절의 그리스어 병행본과 내용이 크게 다릅니다. 이 번역은 현존 히브리어 증거를 주본문으로 따릅니다.
    reason: textual_variant
lexical_decisions:
- source_word: אִישׁ נָבוֹן
  english_pob_choice: A discerning man
  chosen_korean: 슬기로운 사람
  alternatives_korean:
  - 분별 있는 사람
  - 지혜로운 사람
  - 깨닫는 사람
  lexicon: HALOT
  rationale: נָבוֹן의 지혜문학적 성격을 살리되, 현대 한국어에서 자연스러운 품질 형용사로 옮겼습니다. אִישׁ은 성별을 드러내기보다 대표적 인간형을 가리키는 말로 보아 ‘사람’으로 풀었습니다.
- source_word: דְּבַר יְהֹוָה
  english_pob_choice: the word of Yahweh
  chosen_korean: 야훼의 말씀
  alternatives_korean:
  - 야훼의 말
  - 주님의 말씀
  - 여호와의 말씀
  lexicon: HALOT
  rationale: דָּבָר는 여기서 단순한 ‘사안’보다 신적 발화/계시의 뜻이 강하므로 ‘말씀’이 적절합니다. יְהֹוָה는 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
- source_word: וְתוֹרָתוֹ
  english_pob_choice: his instruction
  chosen_korean: 그의 율법
  alternatives_korean:
  - 그의 가르침
  - 그의 교훈
  - 그의 법
  lexicon: HALOT
  rationale: 히브리어 문맥상 토라의 교육적 뉘앙스가 있지만, 이 절은 지혜자가 야훼의 말씀과 연결되어 ‘그의 율법’으로 읽히는 여지가 큽니다. 영어 POB 주석이 지적한 대로 소유격 해석의 긴장이 있어, 한국어 본문은 그 긴장을 보존하는 쪽을 택했습니다.
- source_word: כְּאוּרִים בַּחֹשֶׁן
  english_pob_choice: like the Urim in the breastpiece
  chosen_korean: 가슴받이에 있는 우림과 같습니다
  alternatives_korean:
  - 흉패에 있는 우림과 같습니다
  - 가슴받이의 우림과 같습니다
  - 판결 흉패의 우림과 같습니다
  lexicon: HALOT
  rationale: אוּרִים은 번역보다 음역이 더 정확한 제의 용어이므로 ‘우림’으로 보존했습니다. חֹשֶׁן은 현대어로 이해하기 쉬운 ‘가슴받이’를 택해 제사장 흉패를 가리키는 기술적 의미를 살렸습니다.
theological_decisions:
- issue: וְתוֹרָתוֹ의 소유격 대상
  chosen_reading: 본문은 ‘그의 율법’으로 옮기되, 이 ‘그’가 앞의 슬기로운 사람을 가리키는지 야훼를 가리키는지는 확정하지 않고 열어 둡니다.
  alternative_readings:
  - 슬기로운 사람의 율법
  - 야훼의 율법/가르침
  rationale: 히브리어 문장구조상 선행사의 지시가 다소 모호하며, 영어 POB도 같은 긴장을 주석으로 보존합니다. 본문 번역은 의미 가능성을 삭제하지 않도록 중립적으로 처리했습니다.
  doctrine_reference: Sirach 33:3 source-ambiguity / audit trail on suffix reference
- issue: 히브리어 본문과 그리스어 병행본의 현저한 불일치
  chosen_reading: 번역은 현존 히브리어 본문을 따릅니다.
  alternative_readings:
  - 그리스어 병행본의 다른 내용
  - 혼합 조화 번역
  rationale: 제공된 감사 자료가 이 절의 히브리어와 그리스어가 크게 다르다고 명시하므로, 주본문은 히브리어 증거를 우선해야 합니다. 본문 외 다른 전승과의 차이는 각주로만 처리합니다.
  doctrine_reference: Textual criticism principle for Sirach in POB
