  naturalness: 합쇼체 기도문으로 자연스럽습니다. 각주 표지를 해당 표현과 종결 청원에 붙이면 독자가 각주의 적용 범위를 명확히 알 수 있습니다.
  terminology: ‘주님’, ‘이스라엘’, ‘장자’는 현대 표준 한국어 성경 문맥에서 적절합니다. πρωτογόνῳ에 ‘아들’을 보충하지 않고 ‘장자’로 두어 그리스어의 압축성을 유지합니다.
