base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/033/017.yaml
  text: Have mercy on the people[a], O Lord, who are called by your name, and on Israel[b], whom you made equal to a firstborn son.
  footnotes:
  - marker: a
    text: Or possibly, 'and Israel, make him like the firstborn.' The Greek wording at the end of the verse is syntactically difficult, and the final verb may be understood as a fresh petition rather than as describing God's prior treatment of Israel.
    reason: alternative_reading
  - marker: b
    text: '''Called by your name'' is a biblical idiom meaning marked out as belonging to God.'
    reason: cultural_note
translation:
  language: ko
  text: 주님, 주님의 이름으로 불리는[b] 백성을 불쌍히 여기시고, 이스라엘을 장자와 같게 하십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘이스라엘을 장자처럼 여기십시오’로도 옮길 수 있습니다. 본문의 마지막 그리스어 구문은 문법적으로 난해하며, 마지막 동사를 하나님께 드리는 새로운 청원으로 이해할 수도 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘주님의 이름으로 불리는’은 성경에서 하나님께 속한 자임을 나타내는 관용구입니다.
    reason: cultural_note
lexical_decisions:
- source_word: ἐλέησον
  english_pob_choice: Have mercy
  chosen_korean: 불쌍히 여기시고
  alternatives_korean:
  - 자비를 베푸시고
  - 긍휼히 여기시고
  lexicon: BDAG
  rationale: 청원형 aorist imperative의 간절한 기도 어조를 살리면서, 현대 한국어에서 자연스럽고 공손한 간구 표현으로 옮겼습니다.
- source_word: κεκλημένον ἐπ᾽ ὀνόματί σου
  english_pob_choice: who are called by your name
  chosen_korean: 주님의 이름으로 불리는
  alternatives_korean:
  - 주님의 이름으로 일컬음을 받는
  - 주님의 이름에 속한
  - 주님의 이름을 지닌
  lexicon: BDAG
  rationale: 히브리적 관용구인 '이름으로 불리다'의 소속·식별 의미를 살리기 위해 직역에 가까운 표현을 사용했습니다.
- source_word: ὁμοίωσον
  english_pob_choice: you made like
  chosen_korean: 장자의 아들과 같게 여기십시오
  alternatives_korean:
  - 장자와 같이 만드십시오
  - 장자의 아들과 같게 하십시오
  - 장자처럼 여기십시오
  lexicon: BDAG
  rationale: 본문의 마지막 동사는 문법적으로 난해하므로, POB의 보수적 해석을 따라 이스라엘을 '장자' 신분에 비견하는 청원으로 풀었습니다. 한국어에서는 비교의 결과를 분명히 하기 위해 '같게 여기십시오'로 옮겼습니다.
- source_word: Ἰσραὴλ
  english_pob_choice: Israel
  chosen_korean: 이스라엘
  alternatives_korean:
  - 이스라엘 백성
  lexicon: BDAG
  rationale: 고유명사는 통용 표기를 따르되, 문맥상 민족 집합체로 읽히는 점은 본문 구성으로 드러나게 했습니다.
theological_decisions:
- issue: 마지막 절의 난해한 구문과 '장자' 비유
  chosen_reading: 이스라엘이 하나님 앞에서 장자의 신분에 비견되는 존재로 간주되도록 구하는 기도로 읽었습니다.
  alternative_readings:
  - '''이스라엘을 장자처럼 만들어 주십시오''라는 현재형 청원으로 읽을 수 있습니다.'
  - 하나님께서 이미 이스라엘을 장자와 같이 대하셨다는 서술로 읽을 수 있습니다.
  rationale: 그리스어 종결부는 문법적으로 압축되고 애매하므로, 의미를 과도하게 해소하지 않고 POB의 해석을 반영해 청원성과 비교 이미지를 함께 보존했습니다.
  doctrine_reference: 난해한 본문은 가능한 범위 안에서 문법적 긴장을 유지하고, 확정적 교리화는 피합니다.
