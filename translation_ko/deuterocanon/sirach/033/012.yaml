translation:
  language: ko
  text: 적들의 통치자들의 머리를 부수십시오. 그들은 말합니다. 「우리밖에는 아무도 없습니다.」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, 「우리 외에는 아무도 없습니다」. 그리스어의 배제적 어조를 더 형식적으로 살린 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: 이 절의 그리스어 본문은 소스 검증에서 ‘major_mismatch’로 표시되지만, 본 번역은 제시된 Zone 1 그리스어를 따릅니다.
    reason: textual_variant
lexical_decisions:
- source_word: σύντριψον
  english_pob_choice: Crush
  chosen_korean: 부수십시오
  alternatives_korean:
  - 짓부수십시오
  - 산산이 부수십시오
  lexicon: LSJ
  rationale: 부수다/짓부수다 계열이 aorist imperative συντρίβω의 강한 파괴성을 잘 살리며, 한국어에서 명령형으로도 자연스럽습니다.
- source_word: ἀρχόντων
  english_pob_choice: rulers
  chosen_korean: 통치자들의
  alternatives_korean:
  - 지배자들의
  - 지도자들의
  - 군주들의
  lexicon: LSJ
  rationale: ἄρχων은 권위를 가진 자를 가리키므로, 현대 독자에게 정치적·권력적 뉘앙스가 분명한 '통치자들'이 가장 직접적입니다.
- source_word: ἐχθρῶν
  english_pob_choice: of the enemies
  chosen_korean: 적들의
  alternatives_korean:
  - 원수들의
  - 적대자들의
  lexicon: LSJ
  rationale: genitive plural가 통치자들을 '적에 속한 자들'로 한정하므로, 한국어에서도 소속 관계를 간결하게 드러냈습니다.
- source_word: Οὐκ ἔστιν πλὴν ἡμῶν
  english_pob_choice: There is no one except us
  chosen_korean: 우리밖에는 아무도 없습니다
  alternatives_korean:
  - 우리 외에는 아무도 없습니다
  - 우리만 있습니다
  lexicon: LSJ
  rationale: πλήν + 속격은 배제의 뜻이므로, 비교보다 배타적 주장으로 읽히는 한국어를 택해 자만하는 어조를 유지했습니다.
theological_decisions:
- issue: 폭력적 명령의 직설성
  chosen_reading: 원문이 지닌 전투적·파괴적 명령을 완화하지 않고 직접적으로 옮겼습니다.
  alternative_readings:
  - 무너뜨리십시오
  - 꺾으십시오
  rationale: 지혜문학적 문맥이라도 동사의 강도는 보존해야 하므로, 도덕화하거나 상징화하지 않았습니다.
  doctrine_reference: 본문의 수사적 강도를 보존하고 해석으로 희석하지 않기
- issue: ‘우리밖에는 아무도 없습니다’의 함의
  chosen_reading: 배타적 우월감을 드러내는 자기과시로 읽히도록 유지했습니다.
  alternative_readings:
  - 우리뿐입니다
  - 우리가 최고입니다
  rationale: 그리스어는 비교보다 배제를 나타내므로, 신학적으로 특정 교리를 덧씌우지 않고 교만한 발화를 그대로 드러냅니다.
  doctrine_reference: 본문의 문법적 배제 의미를 우선함
