  lexicon: LSJ
  rationale: ἄρχων은 권위를 가진 자를 가리키므로, 현대 독자에게 정치적·권력적 뉘앙스가 분명한 '통치자들'이 가장 직접적입니다.
- source_word: ἐχθρῶν
  english_pob_choice: of the enemies
  chosen_korean: 적들의
  alternatives_korean:
  - 원수들의
  - 적대자들의
  lexicon: LSJ
  rationale: genitive plural가 통치자들을 '적에 속한 자들'로 한정하므로, 한국어에서도 소속 관계를 간결하게 드러냈습니다.
- source_word: Οὐκ ἔστιν πλὴν ἡμῶν
  english_pob_choice: There is no one except us
  chosen_korean: 우리밖에는 아무도 없습니다
  alternatives_korean:
  - 우리 외에는 아무도 없습니다
  - 우리만 있습니다
  lexicon: LSJ
  rationale: πλήν + 속격은 배제의 뜻이므로, 비교보다 배타적 주장으로 읽히는 한국어를 택해 자만하는 어조를 유지했습니다.
