  lexicon: BDAG
  rationale: ἀδικέω의 핵심인 ‘불의를 행하다/해하다’ 중, 대상인 ‘주의 백성’을 직접 가해하는 뜻을 현대 한국어로 자연스럽게 드러냈습니다.
