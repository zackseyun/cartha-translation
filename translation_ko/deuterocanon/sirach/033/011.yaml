translation:
  language: ko
  text: 불의 진노 가운데서 구원받는 자가 삼켜지게 하시고[a], 주의 백성을 해치는 자들은 멸망을 만나게 하소서.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ὁ σωζόμενος는 ‘구원받는 자’로도, 문맥에 따라 ‘살아남은 자’로도 옮길 수 있습니다. 이 문맥에서는 이미 재앙을 피한 뒤에도 심판을 받는다는 역설이 강조됩니다.
    reason: lexical_alternative
