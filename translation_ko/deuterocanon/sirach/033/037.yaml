  text: When you acquire a friend[a], acquire him through testing, and do not quickly trust him.
  footnotes:
  - marker: a
    text: Or 'acquire him in a time of testing' or 'gain him by trial.' The Greek phrase ἐν πειρασμῷ can be rendered in several closely related ways.
    reason: lexical_alternative
translation:
  language: ko
  text: 친구를 얻으려거든 시험을 거쳐[a] 얻으십시오. 그리고 그를 성급히 믿지 마십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘시험의 때에 그를 얻으라’ 또는 ‘시험으로 그를 얻으라’로 옮길 수 있습니다. ἐν πειρασμῷ는 문맥에 따라 서로 가까운 여러 의미로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: κτήσῃ φίλον
  english_pob_choice: acquire a friend
  chosen_korean: 친구를 얻으려거든
  alternatives_korean:
  - 친구를 취하려거든
  - 친구를 사귀려거든
  lexicon: LSJ
  rationale: κτάομαι의 기본값인 ‘얻다/획득하다’를 살리되, 한국어에서는 속담형 권고문처럼 ‘-려거든’으로 시작해 의도적·규범적 뉘앙스를 자연스럽게 전달했습니다.
- source_word: ἐν πειρασμῷ
  english_pob_choice: through testing
  chosen_korean: 시험을 통해
  alternatives_korean:
  - 시험 가운데
  - 시련으로
  - 시험으로
  lexicon: BDAG
  rationale: πειρασμός의 여기서의 뜻은 유혹보다 ‘검증/시험’이므로, 관계의 신뢰성을 확인하는 수단이라는 점을 드러내는 ‘시험을 통해’로 옮겼습니다.
- source_word: μὴ ταχὺ ἐμπιστεύσῃς αὐτῷ
  english_pob_choice: do not quickly trust him
  chosen_korean: 그를 너무 빨리 믿지 마십시오
  alternatives_korean:
  - 그를 성급히 믿지 마십시오
  - 그를 빨리 신뢰하지 마십시오
  lexicon: BDAG
  rationale: ἐμπιστεύω의 신뢰 행위를 한국어에서는 가장 직접적인 ‘믿다’로 풀어, 성급한 신뢰 금지라는 경구적 힘을 유지했습니다.
theological_decisions:
- issue: 속담형 지혜문에서의 직접 권면 어조
  chosen_reading: 한국어는 보편 권고의 합쇼체로 처리하고, 명령 강도를 과도하게 높이지 않았습니다.
  alternative_readings:
  - 친구를 얻거든 시험으로 얻으라
