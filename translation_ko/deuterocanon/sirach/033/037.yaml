  rationale: 지혜문학의 경구적 성격상 현대 한국어에서는 독자에게 직접 권면하는 형식이 가장 자연스럽고, 원문의 교훈적 압박도 잘 보존합니다.
  doctrine_reference: 'Translation philosophy: optimal-equivalence'
