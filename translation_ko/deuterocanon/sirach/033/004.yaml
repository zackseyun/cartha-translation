base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/033/004.yaml
  text: Just as you were sanctified among us before them[a], so also be magnified among them before us[b];
  footnotes:
  - marker: a
    text: Or 'you were shown holy among us in their sight.' The Greek passive 'you were sanctified' is a biblical idiom for God being acknowledged as holy.
    reason: lexical_alternative
  - marker: b
    text: 'The final verb is an optative of wish: ''may you be magnified'' is also possible.'
    reason: lexical_alternative
translation:
  language: ko
  text: 주께서 우리 가운데서 그들 앞에 거룩하신 분으로 드러나셨듯이[a], 그들 가운데서도 우리 앞에 크게 높임을 받으소서[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그들 앞에서 우리 가운데서 거룩하게 되셨듯이’입니다. 하나님을 대상으로 한 이 수동 표현은 하나님이 거룩하게 변화하셨다는 뜻이 아니라, 그분의 거룩하심이 사람들 앞에 드러나고 인정되었다는 성서적 관용입니다.
    reason: theological_note
  - marker: b
    text: 끝 동사는 희구를 나타내는 옵타티브입니다. ‘크게 높임을 받으시기를’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνώπιον αὐτῶν
  english_pob_choice: before them
  chosen_korean: 그들 앞에서
  alternatives_korean:
