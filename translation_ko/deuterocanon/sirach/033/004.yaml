  yaml_path: translation/deuterocanon/sirach/033/004.yaml
  text: Just as you were sanctified among us before them[a], so also be magnified among them before us[b];
  footnotes:
  - marker: a
    text: Or 'you were shown holy among us in their sight.' The Greek passive 'you were sanctified' is a biblical idiom for God being acknowledged as holy.
    reason: lexical_alternative
  - marker: b
    text: 'The final verb is an optative of wish: ''may you be magnified'' is also possible.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들 앞에서 주께서 우리 가운데 거룩하게 되셨듯이, 우리 앞에서 그들 가운데서도 높임을 받으소서.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그들 앞에서 우리 가운데서 거룩하게 되셨듯이’입니다. 여기서는 하나님이 거룩해지셨다는 뜻이 아니라, 그들 앞에서 거룩하심이 드러나고 인정되었다는 관용적 의미로 이해할 수 있습니다.
    reason: theological_note
  - marker: b
    text: 끝 동사는 희구를 나타내는 옵타티브이므로, ‘높임을 받으소서’ 외에 ‘높임을 받으시기를 원합니다/원하나이다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνώπιον αὐτῶν
  english_pob_choice: before them
  chosen_korean: 그들 앞에서
  alternatives_korean:
  - 그들 앞에
  - 그들의 눈앞에서
  lexicon: BDAG
  rationale: 사람들 앞이나 시야 앞에 있다는 뜻을 자연스러운 한국어로 옮기되, 뒤의 ἐναντίον ἡμῶν과 평행을 살리기 위해 ‘앞에서’를 택했습니다.
- source_word: ἡγιάσθης
  english_pob_choice: you were sanctified
  chosen_korean: 거룩하게 되셨듯이
  alternatives_korean:
  - 성별되셨듯이
  - 거룩하심을 드러내셨듯이
  - 거룩하다고 인정되셨듯이
  lexicon: BDAG
  rationale: 하나님께 적용된 수동형을 한국어에서 직역하면 어색하므로, 문맥상 ‘거룩하심이 드러나고 인정되다’는 관용을 살려 ‘거룩하게 되셨다’로 옮겼습니다.
- source_word: μεγαλυνθείης
  english_pob_choice: be magnified
  chosen_korean: 높임을 받으소서
  alternatives_korean:
  - 크게 되소서
  - 크심을 드러내소서
  - 영광을 받으소서
  lexicon: BDAG
  rationale: 희구적 옵타티브의 기도체를 한국어 예배/기도 문맥에 맞게 살리되, ‘μεγαλύνω’의 ‘크게 하다/크게 되다’ 의미를 너무 설명적으로 풀지 않고 ‘높임을 받으소서’로 자연스럽게 옮겼습니다.
- source_word: ἐν ἡμῖν / ἐν αὐτοῖς
  english_pob_choice: among us / among them
  chosen_korean: 우리 가운데 / 그들 가운데
  alternatives_korean:
  - 우리 안에서 / 그들 안에서
  - 우리 가운데서 / 그들 가운데서
  lexicon: BDAG
  rationale: 공동체 안에서의 현현과 인정이라는 뉘앙스를 살리기 위해 ‘가운데’를 사용했습니다. 내면 변화로 좁혀지지 않도록 ‘안에서’는 피했습니다.
theological_decisions:
- issue: 하나님께 대한 ‘거룩하게 되다’의 수동형 의미
  chosen_reading: 본문에는 ‘거룩하게 되셨듯이’라고 두되, 하나님이 거룩해지셨다는 뜻이 아니라 사람들 앞에서 그 거룩하심이 인정되고 드러났다는 관용을 전제했습니다.
  alternative_readings:
  - 거룩하심이 드러나셨듯이
  - 거룩하다고 인정되셨듯이
  - 거룩하심으로 나타나셨듯이
  rationale: 원문의 수동형과 예배적 요청 형식을 유지하면서도 신학적으로 오해되지 않도록 한국어 관용으로 풀었습니다.
  doctrine_reference: 'DOCTRINE.md: 신학적 긴장을 지우지 말고, 본문이 실제로 말하는 형식을 보존한다.'
- issue: 옵타티브 희구문의 기도체
  chosen_reading: 명시적 ‘may’에 해당하는 표현 없이 ‘높임을 받으소서’로 기도형을 살렸습니다.
  alternative_readings:
  - 높임을 받기를 원하나이다
  - 높임을 받게 하소서
  - 높임을 받으시옵소서
  rationale: 한국어 합쇼체에서 간결하고 예배적인 요청을 만들기 위해 직역형보다 기도형 종결을 택했습니다.
  doctrine_reference: 'DOCTRINE.md: 현대 한국어로 읽히는 예배적 문체를 우선한다.'
