  text: For there is no God except you, Lord. Renew signs and alter wonders,
translation:
  language: ko
  text: 당신 외에는 하나님이 없으시기 때문입니다, 주님. 표징들을 새롭게 하시고 이적들을 바꾸어 주십시오.[a]
  philosophy: formal
  footnotes:
  - marker: a
    text: ‘표징들’과 ‘이적들’은 헬라어 병렬어구를 구분해 옮긴 것입니다.
    reason: source_note
lexical_decisions:
- source_word: θεὸς
  english_pob_choice: God
  chosen_korean: 하나님
  alternatives_korean:
  - 신
  - 하느님
  lexicon: Θεός
  rationale: 시라크스의 헬라어 본문에서 θεὸς는 일반적인 신이 아니라 유일하신 참 하나님을 가리키므로, 프로젝트 기본어인 ‘하나님’을 유지했습니다.
- source_word: πλὴν σοῦ
  english_pob_choice: except you
  chosen_korean: 당신 외에는
  alternatives_korean:
  - 당신을 제외하고는
  - 당신밖에는
  lexicon: πλὴν
  rationale: 배제의 뜻을 분명히 하면서도 합쇼체 문장 흐름에 자연스럽게 맞도록 ‘외에는’으로 옮겼습니다.
- source_word: ἐγκαίνισον
  english_pob_choice: Renew
  chosen_korean: 새롭게 하시고
  alternatives_korean:
  - 갱신하시고
  - 다시 시작하게 하시고
  lexicon: ἐγκαινίζω
  rationale: 동사는 단순한 반복이 아니라 표징의 효력을 새로이 드러내게 하는 의미이므로, ‘새롭게 하다’로 옮겼습니다.
- source_word: ἀλλοίωσον
  english_pob_choice: alter
  chosen_korean: 바꾸어 주십시오
  alternatives_korean:
  - 변하게 하십시오
  - 달리 하십시오
  lexicon: ἀλλοιόω
  rationale: 영어 POB가 ‘alter’를 채택한 것은 변화 자체를 강하게 드러내기 위한 것으로 보이며, 한국어도 인위적 수정보다 결과의 변화를 드러내는 ‘바꾸어 주십시오’로 맞췄습니다.
theological_decisions:
- issue: 간구문의 높임말과 직접청원 형식
  chosen_reading: 하나님께 드리는 직접 간구이므로 본문 전체를 합쇼체로 옮기되, ‘주님’에는 경칭을 유지하고 명령형은 공손한 청원형으로 처리했습니다.
  alternative_readings:
  - 평서형으로 완화
  - 전통 기도문식 어미 사용
  rationale: 원문은 유일하신 하나님께 표징과 이적의 변화를 구하는 탄원문이므로, 현대 한국어에서 경외와 청원을 함께 드러내는 합쇼체가 가장 적절합니다.
  doctrine_reference: 기도와 간구의 문체
- issue: ‘이적’을 ‘바꾸다’의 객체로 유지
  chosen_reading: σημεῖα와 θαυμάσια를 각각 ‘표징들’과 ‘이적들’로 구분해, 하나님의 행위가 단순한 기적 일반이 아니라 언약적 표징과 놀라운 행위임을 보존했습니다.
  alternative_readings:
  - 둘 다 ‘기적’으로 통일
  - ‘표적’과 ‘놀라운 일’로 분산
  rationale: 본문의 병렬성은 의미상 중복이 아니라 두 범주의 표지적 능력을 함께 요청하는 구조이므로, 각 용어의 차이를 살려 번역했습니다.
  doctrine_reference: 성서적 표징과 기적의 어휘
