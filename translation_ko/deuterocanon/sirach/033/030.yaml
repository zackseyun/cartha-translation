  yaml_path: translation/deuterocanon/sirach/033/030.yaml
  text: Set him to work as is fitting for him[a], and if he does not obey, make his fetters heavy; but do not be excessive with any flesh, and do nothing without judgment.
  footnotes:
  - marker: a
    text: Or 'do not be excessive with anyone'; Greek 'with any flesh.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그를 마땅한 일에 맡기십시오[a]. 그가 순종하지 않으면, 그의 족쇄를 무겁게 하십시오. 그러나 어느 육체에게도 지나치지 마시고, 판단 없이 아무것도 하지 마십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그에게 알맞은 일을 맡기십시오’.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς ἔργα κατάστησον
  english_pob_choice: Set him to work
  chosen_korean: 그를 마땅한 일에 맡기십시오
  alternatives_korean:
  - 그를 일에 배치하십시오
  - 그를 일하도록 시키십시오
  lexicon: LSJ
  rationale: κατάστησον은 어떤 상태나 역할에 두는 뜻이 있고, εἰς ἔργα는 구체적으로 ‘일/과업’을 가리키므로, 한국어에서는 지시·배치의 힘을 살린 ‘맡기십시오’가 자연스럽고 과도한 해설도 피합니다.
- source_word: καθὼς πρέπει αὐτῷ
  english_pob_choice: as is fitting for him
  chosen_korean: 마땅한
  alternatives_korean:
  - 그에게 합당한
  - 그에게 알맞은
  lexicon: LSJ
  rationale: πρέπει는 도덕적·실용적 적합성을 함께 담으므로, ‘마땅한’이 가장 간결하게 그 적합성의 판단을 살립니다.
- source_word: κἂν μὴ πειθαρχῇ
  english_pob_choice: if he does not obey
  chosen_korean: 그가 순종하지 않으면
  alternatives_korean:
  - 그가 복종하지 않으면
  - 그가 명령에 따르지 않으면
  lexicon: LSJ
  rationale: πειθαρχέω는 단순한 듣기가 아니라 권위에 대한 순종을 뜻하므로, 한국어에서 가장 자연스러운 대응인 ‘순종하다’를 택했습니다.
- source_word: βάρυνον τὰς πέδας αὐτοῦ
  english_pob_choice: make his fetters heavy
  chosen_korean: 그의 족쇄를 무겁게 하십시오
  alternatives_korean:
  - 그의 족쇄를 더 무겁게 하십시오
  - 그의 쇠사슬을 무겁게 하십시오
  lexicon: LSJ
  rationale: πέδαι는 묶어 두는 족쇄·쇠사슬이므로, ‘족쇄’를 기본으로 하되 βάρυνον의 직설성을 살려 ‘무겁게 하십시오’로 옮겼습니다.
- source_word: ἄνευ κρίσεως
  english_pob_choice: without judgment
  chosen_korean: 판단 없이
  alternatives_korean:
  - 분별 없이
  - 옳고 그름의 판단 없이
  lexicon: LSJ
  rationale: κρίσις는 여기서 판단·결정을 뜻하므로, 한국어에서는 간결한 ‘판단 없이’가 본문의 금지를 분명히 전달합니다.
theological_decisions:
- issue: ἐν πάσῃ σαρκί의 직역성
  chosen_reading: ‘어느 육체에게도’로 살려 두어, 인간 일반을 가리키는 관용적 뜻을 유지하면서도 원문의 거친 표현을 지웁지 않았습니다.
  alternative_readings:
  - 어느 사람에게도
  - 모든 사람에게도
  rationale: σάρξ는 문맥상 사람을 가리키지만, 본문은 의도적으로 ‘육체’라는 구체적 표현을 사용합니다. 한국어도 그 긴장을 보존하는 쪽이 원문 충실도에 맞습니다.
  doctrine_reference: 'DOCTRINE.md: Preserve source texture and tension; do not soften difficult social language'
