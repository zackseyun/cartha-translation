review_pass:
  verdict: revise
  source_fidelity: 핵심 명령의 구조와 의미는 대체로 충실합니다. 다만 καθὼς πρέπει αὐτῷ의 αὐτῷ는 ‘그에게’로 명시하는 편이 정확하며, ἐν πάσῃ σαρκί는 문맥상 사람을 가리키므로 본문에서 ‘육체’라고 하면 한국어 관용과 문법적 결합이 크게 어색해집니다. 직역적 표현은 각주로 보존할 수 있습니다.
  naturalness: ‘어느 육체에게도 지나치지 마시고’는 현대 표준 한국어에서 자연스럽지 않으며, ‘지나치다’는 이 문맥에서 사람을 대하는 태도를 직접 목적어로 취하지 않습니다. ‘어느 사람에게도 지나치게 대하지 마십시오’가 합쇼체 문체에 맞고 뜻도 분명합니다.
  terminology: ‘족쇄’는 πέδας에 적절하며, 강제 노동과 구속이라는 역사적으로 어려운 표현도 완화하지 않고 유지되었습니다. ‘순종하지 않으면’도 πειθαρχῇ의 권위에 대한 복종이라는 뜻을 무리 없이 전달합니다.
  issues:
  - severity: medium
    issue: ‘어느 육체에게도 지나치지 마시고’는 비문에 가깝고 의미 관계가 불명확합니다.
    rationale: μὴ περισσεύσῃς ἐν πάσῃ σαρκί는 누구에게든 과도하게 행하지 말라는 금지입니다. 한국어에서는 ‘사람에게 지나치게 대하다’로 옮기고, σάρξ의 직역은 각주에서 밝혀야 자연성과 원문 표현을 함께 보존합니다.
  - severity: low
    issue: ‘마땅한 일’에 ‘그에게’라는 적합성의 대상이 명시되지 않았습니다.
    rationale: καθὼς πρέπει αὐτῷ는 그 사람에게 알맞거나 마땅한 방식이라는 뜻이므로 ‘그에게 마땅한 일’이 더 직접적입니다.
  revised_text: 그를 그에게 마땅한 일에 맡기십시오[a]. 그가 순종하지 않으면 그의 족쇄를 무겁게 하십시오. 그러나 어느 사람에게도 지나치게 대하지 마시고, 판단 없이 아무것도 하지 마십시오.
  revised_footnotes:
  - marker: a
    text: 또는 ‘그에게 알맞은 일을 맡기십시오’.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘어느 육체에게도’입니다.
    reason: literal_rendering
  revision_rationale: 본문의 ‘육체’ 표현은 한국어에서 사람을 지칭하는 말로 자연스럽지 않고 ‘지나치다’와의 결합도 성립하기 어려우므로, 문맥상의 지시 대상인 ‘사람’으로 본문을 다듬었습니다. 원문의 구체적 σάρξ 표현은 새 각주로 보존했습니다. 또한 ‘그에게 마땅한’을 명시하여 αὐτῷ의 수식 관계를 분명히 했습니다.
