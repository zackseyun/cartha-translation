translation:
  language: ko
  text: 내가 홀로를 위해 수고한 것이 아니라, 교육을 찾는 모든 사람을 위해 수고했음을 깨달으십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘instruction’로 옮긴 παιδεία는 문맥에 따라 ‘훈련’이나 ‘훈육’의 뜻도 포함할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατανοήσατε
  english_pob_choice: Understand
  chosen_korean: 깨달으십시오
  alternatives_korean:
  - 이해하십시오
  - 생각하십시오
  - 유의하십시오
  lexicon: LSJ
  rationale: 청중에게 요점을 분명히 인식하라는 명령으로서, 현대 한국어에서 자연스럽고 직접적인 합쇼체로 옮겼습니다.
- source_word: οὐκ ἐμοὶ μόνῳ
  english_pob_choice: not for myself alone
  chosen_korean: 내가 홀로를 위해
  alternatives_korean:
  - 나만을 위해
  - 나 혼자만을 위해
  - 나 자신만을 위해
  lexicon: LSJ
  rationale: 여기서는 이익의 방향을 드러내는 표현으로 이해해, 수고가 자기 자신만을 위한 것이 아니었음을 한국어로 자연스럽게 나타냈습니다.
- source_word: παιδείαν
  english_pob_choice: instruction
  chosen_korean: 교육
  alternatives_korean:
  - 훈련
  - 훈육
  - 가르침
  - 훈계
  lexicon: LSJ
  rationale: παιδεία가 단순한 지식 전달보다 도덕적 형성까지 포함할 수 있으므로, 한국어에서는 범위를 지나치게 좁히지 않는 ‘교육’을 택했습니다.
theological_decisions:
- issue: παιδείαν의 의미 범위
  chosen_reading: 지적 전달뿐 아니라 인격 형성과 도덕적 형성을 포함하는 ‘교육’으로 번역합니다.
  alternative_readings:
  - 단순한 ‘가르침’으로 제한
  - ‘훈련’ 또는 ‘훈육’으로 좁힘
  rationale: 집회서의 παιδεία는 문맥상 지혜 교육과 삶의 형성을 함께 가리킬 수 있어, 특정 방향으로 과도하게 축소하지 않는 번역이 필요합니다.
  doctrine_reference: 지혜문학의 교육 개념
- issue: οὐκ ἐμοὶ μόνῳ의 초점
  chosen_reading: ‘나 자신만을 위한 수고가 아니었다’는 공동 유익의 강조로 읽습니다.
  alternative_readings:
  - 단순히 개인적 이익이 아니었다는 뜻
  - 자기중심성을 부정하는 윤리적 진술
  rationale: 문장의 대조는 화자의 사적인 유익이 아니라 듣는 이들의 유익을 위한 수고를 강조합니다.
  doctrine_reference: 문맥적 수사
- issue: 명령형의 한국어 톤
  chosen_reading: 공적인 권면으로서 정중하지만 단호한 합쇼체를 사용합니다.
  alternative_readings:
  - 평서형으로 완화
  - 더 구어적인 명령형
  rationale: 원문의 aorist imperative는 청중의 즉각적 인식을 촉구하므로, ‘깨달으십시오’가 가장 직접적입니다.
  doctrine_reference: 수사적 명령
