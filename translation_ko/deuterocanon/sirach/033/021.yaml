  yaml_path: translation/deuterocanon/sirach/033/021.yaml
  text: As long as you are still alive and breath is in you[a], do not give yourself over to any flesh.
  footnotes:
  - marker: a
    text: Or 'do not hand yourself over to anyone' or 'do not submit yourself to any person.' The Greek literally says 'to any flesh.'
    reason: lexical_alternative
translation:
  language: ko
  text: 아직 살아 있고 숨이 너희 안에 있는 동안에는 어떤 육체에게도 너 자신을 내맡기지 마십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘아무에게도 너 자신을 넘기지 마십시오’ 혹은 ‘어떤 사람에게도 너 자신을 복종시키지 마십시오’. 그리스어는 문자적으로 ‘어떤 육체에게도’라고 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕως ἔτι ζῇς
  english_pob_choice: As long as you are still alive
  chosen_korean: 아직 살아 있는 동안에는
  alternatives_korean:
  - 네가 아직 사는 동안에는
  - 살아 있는 한
  lexicon: LSJ
  rationale: ἕως ἔτι ζῇς는 생명이 계속되는 기간을 가리키므로, 한국어에서는 시간 한계를 자연스럽게 드러내는 ‘아직 살아 있는 동안에는’로 옮겼습니다.
- source_word: πνοὴ ἐν σοί
  english_pob_choice: breath is in you
  chosen_korean: 숨이 너희 안에 있는
  alternatives_korean:
  - 숨이 네 안에 있는
  - 생기가 네 안에 있는
  lexicon: LSJ
  rationale: πνοή는 기본적으로 ‘숨’이므로, 해석을 덜어내고 생명 지속의 표지를 그대로 살려 ‘숨이 … 안에 있는’으로 번역했습니다.
- source_word: μὴ ἀλλάξῃς σεαυτὸν
  english_pob_choice: do not give yourself over
  chosen_korean: 너 자신을 내맡기지 마십시오
  alternatives_korean:
  - 너 자신을 넘기지 마십시오
  - 너 자신을 내주지 마십시오
  - 너 자신을 바꾸지 마십시오
  lexicon: LSJ
  rationale: ἀλλάξῃς σεαυτόν은 직역하면 어색하지만, 문맥상 자신을 다른 이의 처분 아래 두는 뜻이므로 ‘내맡기다’로 옮겨 자기를 넘기는 뉘앙스를 살렸습니다.
- source_word: πάσῃ σαρκί
  english_pob_choice: to any flesh
  chosen_korean: 어떤 육체에게도
  alternatives_korean:
  - 어떤 사람에게도
  - 어떤 인간에게도
  - 어떤 자에게도
  lexicon: LSJ
  rationale: σάρξ를 일반적으로 ‘사람’으로 풀기보다, 본문이 가진 충격을 보존하기 위해 문자성 있는 ‘육체’로 유지했습니다.
theological_decisions:
- issue: σάρξ의 번역 유지
  chosen_reading: ‘육체’로 직역하여 인간의 연약함과 피조적 유한성을 드러냅니다.
  alternative_readings:
  - 사람
  - 인간
  - 죽을 몸
  rationale: 이 구절은 인간 일반을 뜻하지만, 본문은 의도적으로 ‘육체’라는 날카로운 표현을 사용하므로 이를 완화하지 않고 유지하는 것이 원문 효과를 더 잘 전달합니다.
  doctrine_reference: 'DOCTRINE.md: contested terms table for σάρξ'
