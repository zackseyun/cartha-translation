  text: 여물과 막대기와 짐은 나귀를 위한 것이며, 빵과 훈육과 일은 집안 종을 위한 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χορτάσματα
  english_pob_choice: Fodder
  chosen_korean: 먹이는 것
  alternatives_korean:
  - 여물
  - 사료
  lexicon: LSJ
  rationale: 동물에게 주는 먹이를 뜻하므로, 나귀와 함께 쓰인 비유적·구체적 이미지를 살리면서도 현대 한국어에서 자연스럽게 읽히는 표현으로 옮겼습니다.
- source_word: ῥάβδος
  english_pob_choice: rod
  chosen_korean: 몽둥이
  alternatives_korean:
  - 막대기
  - 지팡이
  lexicon: LSJ
  rationale: 이 문맥에서는 걷는 지팡이보다 통제와 징계의 도구가 더 강하게 드러나므로, 교정적 힘을 드러내는 한국어를 택했습니다.
- source_word: φορτία
  english_pob_choice: loads
  chosen_korean: 짐
  alternatives_korean:
  - 무거운 짐
  - 짐짝
  lexicon: LSJ
  rationale: 짐을 지는 짐승에게 매다는 물건이라는 뜻을 살려, 짧고 관용적인 한국어인 '짐'으로 옮겼습니다.
- source_word: οἰκέτῃ
  english_pob_choice: slave
  chosen_korean: 종
  alternatives_korean:
  - 노예
  - 하인
  - 집안 종
  lexicon: LSJ
  rationale: οἰκέτης는 가정 내 종속 노동자를 가리키므로 '종'이 가장 간결하면서도 종속성을 보존합니다. 본문에 'slave'를 그대로 노출하는 것보다 한국어 성경 문맥에서의 사회적 종속을 충분히 드러낼 수 있습니다.
theological_decisions:
- issue: οἰκέτῃ의 사회적 종속성 표현
  chosen_reading: 종
  alternative_readings:
  - 하인
  - 노예
  rationale: 이 잠언적 진술은 가정 내 노동과 훈육의 질서를 말하므로, 의미를 약화시키는 '하인'보다 종속 관계를 유지하는 '종'이 본문 의도를 더 정확히 전달합니다.
  doctrine_reference: Original-language primacy over translation tradition; contested bonded-labor terms should preserve social reality without unnecessary softening.
