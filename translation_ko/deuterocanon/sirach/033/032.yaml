lexical_decisions:
- source_word: ἐν ἡμέρᾳ συντελείας ἡμερῶν ζωῆς σου
  english_pob_choice: On the day the days of your life are completed
  chosen_korean: 네 삶의 날들이 다 채워지는 날
  alternatives_korean:
  - 네 삶의 날들이 끝나는 날
  - 네 생애의 날들이 완성되는 날
  - 네 삶의 날들의 완결의 날
  lexicon: LSJ
  rationale: συντελεία는 ‘완성, 끝맺음’의 뜻이어서 한국어에서는 ‘다 채워지는 날’로 자연스럽게 풀어 의미를 보존했습니다. ἡμερῶν ζωῆς σου는 직역하면 ‘네 삶의 날들’이므로 이를 그대로 살렸습니다.
- source_word: καιρῷ τελευτῆς
  english_pob_choice: at the time of death
  chosen_korean: 죽을 때에
  alternatives_korean:
  - 죽음의 때에
  - 끝날 때에
  - 임종의 때에
  lexicon: LSJ
  rationale: καιρός는 적절한 때, 정해진 때의 뉘앙스를 가지며 τελευτή는 끝, 죽음을 뜻하므로 문맥상 ‘죽을 때에’가 가장 직접적이고 간결합니다.
- source_word: διδὸς
  english_pob_choice: give
  chosen_korean: 주십시오
  alternatives_korean:
  - 주어라
  - 베푸십시오
  - 넘겨주십시오
  lexicon: LSJ
  rationale: 지혜문학의 명령형을 현대 한국어의 공손한 명령으로 옮겼습니다. 유산 분배라는 문맥을 고려하면 단순한 ‘주다’보다 ‘주십시오’가 행위를 분명히 드러냅니다.
- source_word: κληρονομίαν
  english_pob_choice: an inheritance
  chosen_korean: 유산
  alternatives_korean:
  - 상속 재산
  - 상속분
  - 재산
  lexicon: LSJ
  rationale: κληρονομία는 상속되는 재산, 유산을 가리키므로 문맥상 ‘유산’이 가장 직접적입니다. 여기서는 일반적 상속 개념보다 재산 처분의 의미가 분명합니다.
theological_decisions:
- issue: 문장 전체를 지혜의 실천 지시로 유지할지, ‘상속’의 법적 의미를 더 강조할지
  chosen_reading: 임종 시점에 재산을 분배하라는 실제적 권고로 읽었습니다.
  alternative_readings:
  - 영적 유업을 암시하는 표현으로 읽기
  - 일반적인 상속 원칙의 비유로 읽기
  rationale: 문맥의 어휘가 ζωή, τελευτή, κληρονομία의 조합으로 실제 삶의 끝과 유산 처분을 가리키므로, 비유화하지 않고 실천적 의미를 살렸습니다.
  doctrine_reference: 'Translation philosophy: original-language primacy over translation tradition; consistency of key terms, or documented exception.'
