base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/033/020.yaml
  text: To son and wife[a], to brother and friend, do not give authority over yourself during your lifetime; and do not give your possessions to another[c][b], lest you regret it and have to plead for them.
  footnotes:
  - marker: a
    text: Or 'do not give control over yourself.' The Greek speaks of granting ἐξουσία, authority or power, over oneself.
    reason: lexical_alternative
  - marker: b
    text: Or 'your possessions' or 'your money.' The Greek χρήματα can refer broadly to property, goods, or money.
    reason: lexical_alternative
  - marker: c
    text: Literally, 'lest, having regretted it, you be in need concerning them.' The sense is that after giving away your assets, you may have to ask for them back.
    reason: lexical_alternative
translation:
  language: ko
  text: 아들, 아내, 형제, 친구에게, 살아 있는 동안에는 너 자신에 대한 권한을 주지 마십시오. 또 다른 사람에게는 너의 재산을 주지 마십시오. 그러면 나중에 후회하며 그것들을 구해 달라고 해야 할까 봐 두렵습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘권한’은 ἐξουσία의 기본 의미를 반영한 번역입니다. 문맥상 ‘통제권’으로 이해해도 되지만, 원문의 형식을 더 가깝게 살렸습니다.
    reason: lexical_alternative
  - marker: b
    text: χρήματα는 돈에만 한정되지 않고 재산, 소유물, 자산을 넓게 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 마지막 절은 문자적으로는 ‘그것들에 관하여 필요에 빠지게 될까 봐’에 가깝습니다. 뜻은 결국 넘긴 재산을 다시 돌려 달라고 구하게 된다는 경고입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: υἱῷ
  english_pob_choice: son
  chosen_korean: 아들
  alternatives_korean:
  - 자녀
  lexicon: LSJ
  rationale: 남성 단수 관계어를 그대로 살려, 성중립화하지 않고 ‘아들’로 옮겼습니다.
- source_word: γυναικί
  english_pob_choice: wife
  chosen_korean: 아내
  alternatives_korean:
  - 여자
  - 부인
  lexicon: LSJ
  rationale: 앞뒤 관계 목록에서 가정 관계를 이루는 의미가 자연스러워 ‘아내’가 가장 분명합니다.
- source_word: ἐξουσίαν ἐπὶ σέ
  english_pob_choice: do not give authority over yourself
  chosen_korean: 너 자신에 대한 권한을 주지 마십시오
  alternatives_korean:
  - 너 자신을 지배할 권한을 주지 마십시오
  - 너 자신에 대한 통제권을 주지 마십시오
  lexicon: LSJ
  rationale: ἐξουσία는 단순한 통제보다 ‘권한/권위’의 의미가 강하므로, ‘너 자신에 대한 권한’으로 구조를 최대한 보존했습니다.
- source_word: τὰ χρήματά σου
  english_pob_choice: your property
  chosen_korean: 너의 재산
  alternatives_korean:
  - 너의 소유물
  - 너의 돈
  - 너의 소유
  lexicon: LSJ
  rationale: χρήματα가 돈에 한정되지 않고 재산·소유 전반을 가리킬 수 있으므로, 범위를 살린 ‘재산’이 적절합니다.
theological_decisions:
- issue: 경고문의 종결을 한국어에서 어떻게 자연스럽게 마무리할지
  chosen_reading: 직설적 경고의 힘을 살리되, 한국어 문장에서는 ‘그러면 나중에 후회하며 그것들을 구해 달라고 해야 할까 봐 두렵습니다’로 결과와 우려를 함께 드러냈습니다.
  alternative_readings:
  - 그것들 때문에 후회하고 되찾아 달라고 해야 할 것입니다
  - 그것들을 두고 후회하게 되며 돌려 달라고 구하게 될 것입니다
  rationale: 헬라어의 ἵνα μὴ μεταμεληθεὶς δέῃ περὶ αὐτῶν은 단순한 정보가 아니라, 재산을 넘긴 뒤 겪을 수 있는 수치스러운 의존 상태를 경고합니다. 한국어에서도 그 경고성을 유지하는 쪽을 택했습니다.
  doctrine_reference: 잠언적 지혜문학의 경고 구조
