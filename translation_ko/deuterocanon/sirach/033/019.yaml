  rationale: 후대 제도적 ‘교회’가 아니라 모인 공동체를 가리키므로, 종교적·제도적 뉘앙스를 덧씌우지 않는 ‘회중’이 적절합니다.
- source_word: ἐνωτίσασθε
  english_pob_choice: give ear
  chosen_korean: 귀를 기울이십시오
  alternatives_korean:
  - 귀를 기울이십시오
  - 주의 깊게 들으십시오
  - 귀담아들으십시오
  lexicon: LSJ
  rationale: 단순 청취보다 집중적 경청을 요구하는 관용적 명령이므로, 한국어에서도 신체 은유를 살린 ‘귀를 기울이십시오’가 가장 자연스럽습니다.
