  - 귀담아들으십시오
  lexicon: LSJ
  rationale: 단순 청취보다 집중적 경청을 요구하는 관용적 명령이므로, 한국어에서도 신체 은유를 살린 ‘귀를 기울이십시오’가 가장 자연스럽습니다.
