lexical_decisions:
- source_word: ἐν ἡμέρᾳ συντελείας ἡμερῶν ζωῆς σου
  english_pob_choice: On the day your life's days come to an end
  chosen_korean: 네 삶의 날들이 끝나는 날
  alternatives_korean:
  - 네 생애의 날들이 끝나는 날
  - 네 생의 날들이 다하는 날
  - 네 삶의 기간이 끝나는 날
  lexicon: LSJ
  rationale: ἡμέρᾳ συντελείας ἡμερῶν ζωῆς σου는 직역하면 ‘네 삶의 날들의 완결/끝’이므로, ‘삶의 날들’과 ‘끝나는 날’을 살려 POB의 해석과 그리스어의 중첩된 종결 표현을 반영했습니다.
- source_word: καιρῷ τελευτῆς
  english_pob_choice: at the time of death
  chosen_korean: 죽을 때에
  alternatives_korean:
  - 죽음의 때에
  - 종말의 때에
  - 임종할 때에
  lexicon: LSJ
  rationale: καιρῷ τελευτῆς는 구체적으로 죽음의 시점을 가리키므로, 간결하고 자연스러운 ‘죽을 때에’로 옮겨 의미를 분명히 했습니다.
- source_word: διάδος
  english_pob_choice: distribute
  chosen_korean: 나누어 주십시오
  alternatives_korean:
  - 분배하십시오
  - 배분하십시오
  - 나누십시오
  lexicon: LSJ
  rationale: διαδίδωμι의 명령형은 유산을 여러 몫으로 나누어 주는 행위를 뜻하므로, 유언 집행의 뉘앙스를 살리는 ‘나누어 주십시오’가 가장 자연스럽습니다.
- source_word: κληρονομίαν
  english_pob_choice: inheritance
  chosen_korean: 유산
  alternatives_korean:
  - 상속 재산
  - 상속분
  - 기업
  lexicon: LSJ
  rationale: 문맥상 상속되는 재산을 가리키므로, 한국어에서 법적·가족적 의미를 함께 담는 ‘유산’이 적절합니다.
