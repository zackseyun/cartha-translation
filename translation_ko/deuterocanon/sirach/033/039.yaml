  yaml_path: translation/deuterocanon/sirach/033/039.yaml
  text: And there is a friend who changes into enmity[b][a], and he will expose a quarrel to your disgrace.
  footnotes:
  - marker: a
    text: Or 'turns into hostility'; the Greek uses the abstract noun 'enmity' rather than 'enemy.'
    reason: lexical_alternative
  - marker: b
    text: Or 'he will reveal a quarrel as a reproach against you.' The Greek phrase is compact and may emphasize either the quarrel itself or the disgrace it brings.
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 변절하여 원수가 되는 친구도 있으며, 그는 당신의 수치를 드러낼 싸움을 폭로합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘원수로 변하는’. 그리스어는 ‘원수’라는 인적 명사보다 추상명사 ‘적대/원한’을 사용합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그가 당신에게 수치가 되는 싸움을 드러낼 것이다.’ 그리스어 구문은 매우 압축적이어서, 싸움 자체와 그 싸움이 가져오는 수치를 둘 다 가리킬 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: φίλος
  english_pob_choice: friend
  chosen_korean: 친구
  alternatives_korean:
  - 벗
  - 사람
  lexicon: LSJ
  rationale: 관계적 친밀함을 가리키는 일반적 의미를 살려 ‘친구’로 옮겼습니다.
- source_word: μεταβαλλόμενος εἰς ἔχθραν
  english_pob_choice: changes into enmity
  chosen_korean: 변절하여 원수가 되는
  alternatives_korean:
  - 원한으로 바뀌는
  - 적대감으로 바뀌는
  - 적이 되는
  lexicon: LSJ
  rationale: ἔχθρα는 추상명사이지만 한국어에서는 ‘원수’로 풀어야 관계의 적대화가 자연스럽게 드러나므로, 변화의 결과를 드러내는 표현으로 옮겼습니다.
- source_word: μάχην
  english_pob_choice: a quarrel
  chosen_korean: 싸움
  alternatives_korean:
  - 다툼
  - 분쟁
  - 언쟁
  lexicon: LSJ
  rationale: 지혜문맥의 사회적 갈등을 뜻하므로 물리적 전투보다 관계적 충돌을 나타내는 ‘싸움’이 가장 무난합니다.
- source_word: ὀνειδισμοῦ
  english_pob_choice: to your disgrace
  chosen_korean: 수치를
  alternatives_korean:
  - 모욕을
  - 치욕을
  - 수치가 되도록
  lexicon: LSJ
  rationale: γενitive의 수치·모욕 성격을 한국어에서는 결과 목적격처럼 풀어 자연스럽게 옮길 수 있어 ‘수치를’로 처리했습니다.
- source_word: ἀποκαλύψει
  english_pob_choice: he will expose
  chosen_korean: 드러낼
  alternatives_korean:
  - 폭로할
  - 드러내 보일
  - 밝힐
  lexicon: LSJ
  rationale: 단순한 ‘reveals’보다 상대를 망신시키는 맥락이므로 ‘드러낼’로 유지하고, 뒤의 목적어와 함께 치욕의 공개성을 살렸습니다.
theological_decisions:
- issue: ‘원수’와 ‘적대’의 번역 강도
  chosen_reading: 관계가 완전히 적대화된 상태를 ‘원수가 되는’으로 옮겼습니다.
  alternative_readings:
  - ‘적대가 되는’
  - ‘적의가 되는’
  rationale: 히브리 지혜문학의 경고적 톤을 살리되, 한국어에서 즉각 이해되는 강한 관계 파열을 표현하기 위해 선택했습니다.
  doctrine_reference: 지혜문학의 인간관계 경계 표현
- issue: 두 번째 절 후반의 압축된 구문
  chosen_reading: ‘수치를 드러낼 싸움’처럼 한국어에서 관계와 결과를 한 번에 연결해 읽히도록 했습니다.
  alternative_readings:
  - ‘수치를 주는 싸움’
  - ‘수치가 되는 싸움’
  rationale: 그리스어의 압축성을 유지하면서도 문장 흐름이 자연스럽게 읽히도록, 노출과 치욕의 결합을 보존했습니다.
  doctrine_reference: 문학적 압축의 보존
