translation:
  language: ko
  text: 율법을 미워하는 사람은 지혜롭게 되지 못하고, 폭풍 속에서 배처럼 이리저리 흔들립니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘교훈’, ‘가르침’. 히브리어 תורה는 이 지혜 문맥에서 더 넓게 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 제공된 그리스어 평행본문은 이 절과 맞지 않는 다른 구절처럼 보이므로, 본문은 히브리어를 따랐습니다.
    reason: textual_variant
