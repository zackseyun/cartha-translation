translation:
  language: ko
  text: 가르침을 미워하는 사람은 지혜롭게 되지 못하며, 폭풍 속의 배처럼 이리저리 흔들립니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘율법’, ‘교훈’. 히브리어 תורה는 이 지혜 문맥에서 가르침, 교훈, 또는 율법을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 제공된 그리스어 평행본문은 이 절의 히브리어 본문과 다른 행을 반영하는 것으로 보입니다. 여기서는 뜻이 분명한 히브리어 본문을 따랐습니다.
    reason: textual_variant
