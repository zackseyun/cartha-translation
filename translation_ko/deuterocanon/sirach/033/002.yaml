- source_word: יֶחְכַּם
  english_pob_choice: will not become wise
  chosen_korean: 지혜롭게 되지 못하고
  alternatives_korean:
  - 지혜롭게 되지 않을 것입니다
  - 지혜를 얻지 못하고
  lexicon: HALOT
  rationale: 히필 미완료의 결과적·과정적 의미를 살려, 단순 상태보다 ‘지혜롭게 되다’의 미달로 표현했습니다.
- source_word: מִתְמוֹטֵט בְּמִסְעָר כָּאֳנִיָּה
  english_pob_choice: is tossed about in a storm like a ship
  chosen_korean: 폭풍 속에서 배처럼 이리저리 흔들립니다
  alternatives_korean:
  - 폭풍 속에서 배처럼 떠밀립니다
  - 폭풍 속에서 배처럼 요동합니다
  lexicon: HALOT
  rationale: 재귀·수동적 흔들림과 폭풍-배의 비유를 한국어 관용으로 옮겨, 외력에 의해 불안정하게 흔들리는 모습을 분명히 했습니다.
theological_decisions:
- issue: תוֹרָה의 번역 범위
  chosen_reading: 본문에는 ‘율법’을 사용하되, 지혜 문맥에서의 ‘교훈/가르침’ 의미 가능성은 본문 밖에서 인정합니다.
  alternative_readings:
  - 교훈
  - 가르침
  rationale: 이 절은 단순한 정보 전달이 아니라, 하나님의 가르침을 거부하는 태도의 결과를 경고합니다. 다만 벤 시라의 תורה는 율법만이 아니라 교육적 가르침도 포함할 수 있으므로, 전통어를 본문에 두되 의미 폭을 좁히지 않도록 해석을 열어 둡니다.
  doctrine_reference: 원어 우선 원칙; 문맥에 따른 다의어 처리
