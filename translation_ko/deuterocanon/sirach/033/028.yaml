  text: Put him to work, so that he may not be idle;
translation:
  language: ko
  text: 그를 일에 투입하여, 게으르지 않게 하십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔμβαλε
  english_pob_choice: Put ... to
  chosen_korean: 투입하여
  alternatives_korean:
  - 일하게 하십시오
  - 일에 들이십시오
  - 일에 붙이십시오
  lexicon: LSJ
  rationale: ἐμβάλλω의 문자적 이미지는 '던지다/넣다'이지만, εἰς ἐργασίαν과 함께 쓰여 사람을 일에 배치하라는 명령으로 기능하므로, 한국어에서는 동작성을 살리면서도 자연한 '투입하다'로 옮겼습니다.
- source_word: εἰς ἐργασίαν
  english_pob_choice: to work
  chosen_korean: 일에
  alternatives_korean:
  - 노동에
  - 일하도록
  - 노역에
  lexicon: LSJ
  rationale: ἐργασία는 일반적인 일/노동을 가리키므로, '일에'가 가장 सीधे하게 대응하며 '노역'처럼 과도한 형벌 뉘앙스를 넣지 않습니다.
- source_word: ἵνα μὴ ἀργῇ
  english_pob_choice: so that he may not be idle
  chosen_korean: 게으르지 않게
  alternatives_korean:
  - 빈둥거리지 않게
  - 유휴 상태에 있지 않게
  - 게으르지 않도록
  lexicon: LSJ
  rationale: ἀργέω는 '게으르다'보다 넓게 '일하지 않고 있다/한가하다/놀다'의 뜻이므로, 한국어에서는 결과절의 목적을 살리되 도덕적 비난을 과장하지 않는 '게으르지 않게'로 옮겼습니다.
- source_word: αὐτὸν
  english_pob_choice: him
  chosen_korean: 그를
  alternatives_korean:
  - 그 사람을
  - 그 자를
  - 그를/그녀를
  lexicon: Greek grammar
  rationale: 대명사는 남성 단수 목적격이며 문맥상 남성의 종/종속자를 가리키므로, 성별을 지우지 않고 '그를'로 옮겼습니다.
theological_decisions:
- issue: 노동 명령의 어조와 사회적 현실 보존
  chosen_reading: 종속자를 실제로 일에 배치하라는 직접 명령으로 유지했습니다.
  alternative_readings:
  - 부드럽게 일시키라는 권고로 완화하기
  - 일을 맡겨 두라는 중립적 표현으로 바꾸기
  rationale: 본문은 추상적 권면이 아니라 구체적인 관리 지시이므로, 명령의 직접성과 고대 종속 관계의 현실을 흐리지 않도록 했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 4
