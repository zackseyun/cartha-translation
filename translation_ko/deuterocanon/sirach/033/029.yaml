  text: For idleness has taught much evil.
translation:
  language: ko
  text: 실로 게으름은 많은 악을 가르칩니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πολλὴν
  english_pob_choice: much
  chosen_korean: 많은
  alternatives_korean:
  - 큰
  - 여러
  lexicon: LSJ
  rationale: 단수 명사 악(κακίαν)에 붙는 양적 강조를 한국어에서는 ‘많은’으로 자연스럽게 옮겨, ‘악이 많다’가 아니라 ‘많은 악’이라는 수량감을 살렸습니다.
- source_word: κακίαν
  english_pob_choice: evil
  chosen_korean: 악
  alternatives_korean:
  - 악함
  - 사악함
  - 악행
  lexicon: LSJ
  rationale: 이 문맥의 κακία는 특정 행동 하나보다 도덕적 악의 일반 범주를 가리키므로, 가장 सीधे적인 ‘악’으로 옮겼습니다.
- source_word: ἐδίδαξεν
  english_pob_choice: has taught
  chosen_korean: 가르칩니다
  alternatives_korean:
  - 가르쳐 왔습니다
  - 가르쳤습니다
  - 익히게 합니다
  lexicon: LSJ
  rationale: 격언적 진술이므로 한국어에서는 현재형으로 옮겨 일반 진리를 선명하게 드러냈습니다. 영어의 현재완료도 한국어에서는 현재 진술로 자연스럽게 대응됩니다.
- source_word: ἡ ἀργία
  english_pob_choice: idleness
  chosen_korean: 게으름
  alternatives_korean:
  - 나태
  - 무위
  - 한가함
  lexicon: LSJ
  rationale: ἀργία는 ‘일하지 않음, 나태함, 게으름’을 뜻하므로, 도덕적 뉘앙스를 가진 표준어 ‘게으름’이 가장 مستقیم하며 문장 전체의 경고 성격을 잘 살립니다.
theological_decisions:
- issue: 격언문장의 시제와 어조
  chosen_reading: 문장 전체를 현재형의 일반 진술로 처리했습니다.
  alternative_readings:
  - 과거형으로 옮겨 ‘가르쳤습니다’로 할 수 있음
  - 완료형으로 옮겨 ‘가르쳐 왔습니다’로 할 수 있음
  rationale: 지혜문학의 격언은 단회 사건보다 보편적 진리를 말하므로, 한국어 현재형이 원문의 gnomic force를 가장 잘 전달합니다.
  doctrine_reference: 지혜문학의 격언적 일반진술
- issue: ‘악’의 범위
  chosen_reading: 특정 악행이 아니라 도덕적 악 전반을 가리키는 일반어로 옮겼습니다.
  alternative_readings:
  - ‘사악함’처럼 성격적 악으로 좁힐 수 있음
  - ‘악행’으로 행위 중심으로 좁힐 수 있음
  rationale: 원문 κακία는 개별 범죄 목록이 아니라 넓은 도덕적 악을 가리키므로, 신학적으로도 의미를 좁히지 않는 ‘악’이 안전합니다.
  doctrine_reference: 지혜문학의 도덕적 경고
