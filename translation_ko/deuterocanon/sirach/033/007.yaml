lexical_decisions:
- source_word: δόξασον
  english_pob_choice: Honor
  chosen_korean: 높이십시오
  alternatives_korean:
  - 영광을 돌리십시오
  - 존귀하게 하십시오
  - 경외하십시오
  lexicon: LSJ
  rationale: δόξασον은 δοξάζω의 명령형으로, 여기서는 단순한 시각적 ‘영광’보다 대상을 높여 존중하라는 뜻이 자연스럽습니다. 한국어에서는 몸의 일부에 직접 ‘영광을 돌리다’보다 ‘높이다/높이십시오’가 간결하고 문맥에 맞습니다.
- source_word: χεῖρα
  english_pob_choice: the hand
  chosen_korean: 손
  alternatives_korean:
  - 그 손
  - 손을
  lexicon: LSJ
  rationale: χειρ는 기본적으로 ‘손’이며, 한국어에서는 관사가 없으므로 자연스럽게 명사만 두었습니다. 문맥상 특정 손을 가리킨다고 단정할 근거가 부족해 ‘그 손’은 피했습니다.
- source_word: βραχίονα
  english_pob_choice: arm
  chosen_korean: 오른팔
  alternatives_korean:
  - 팔
  - 팔뚝
  lexicon: LSJ
  rationale: βραχίων은 ‘팔’이 기본 뜻이지만, 이어지는 δεξιόν과 결합해 ‘오른팔’로 옮기면 원문의 결합을 더 분명하게 드러냅니다. ‘팔뚝’은 해부학적으로 지나치게 좁습니다.
- source_word: δεξιόν
  english_pob_choice: right
  chosen_korean: 오른
  alternatives_korean:
  - 우편의
  - 오른쪽
  lexicon: LSJ
  rationale: δεξιόν은 형용사로서 팔을 수식하므로 한국어에서도 ‘오른’으로 처리했습니다. ‘오른쪽’보다 ‘오른팔’이 더 자연스럽고 원문의 짝구조를 살립니다.
