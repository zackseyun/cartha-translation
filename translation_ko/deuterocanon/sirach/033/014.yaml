  yaml_path: translation/deuterocanon/sirach/033/014.yaml
  text: Opposite evil is good[a], and opposite death is life; so opposite a godly man is a sinner.
  footnotes:
  - marker: a
    text: Or 'opposite the godly is the sinner.' The Greek can be read more generically without supplying 'man,' but the singular masculine form is retained in the main text.
    reason: lexical_alternative
translation:
  language: ko
  text: 악의 반대는 선이고, 죽음의 반대는 생명입니다. 이와 같이 경건한 사람의 반대는 죄인입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘경건한 이의 반대는 죄인입니다.’ 그리스어의 남성 단수형은 문맥상 더 일반적인 뜻으로도 이해될 수 있으나, 본문에서는 단수의 인격적 표현을 유지했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέναντι
  english_pob_choice: opposite
  chosen_korean: ~에 맞서는 것
  alternatives_korean:
  - ~의 반대편에
  - ~과 대조되는 것은
  - ~에 맞서는
  lexicon: LSJ
  rationale: 반복되는 ἀπέναντι의 대칭 구조를 한국어의 대조 표현으로 살리면서, 단순한 위치가 아니라 가치·상태의 맞섬을 드러내기 위해 '~에 맞서는 것'으로 옮겼습니다.
- source_word: κακοῦ / ἀγαθόν
  english_pob_choice: evil / good
  chosen_korean: 악 / 선
  alternatives_korean:
  - 나쁜 것 / 좋은 것
  - 악한 것 / 선한 것
  lexicon: LSJ
  rationale: 지혜문학의 도덕적 대립을 가장 직접적으로 드러내는 기본 어휘로서 '악'과 '선'을 선택했습니다.
- source_word: θανάτου / ζωή
  english_pob_choice: death / life
  chosen_korean: 죽음 / 생명
  alternatives_korean:
  - 사망 / 삶
  - 죽음 / 삶
  lexicon: LSJ
  rationale: 대구를 유지하면서도 문맥상 생명의 질적 대조를 분명하게 하기 위해 '생명'을 택했습니다.
- source_word: εὐσεβοῦς
  english_pob_choice: a godly man
  chosen_korean: 경건한 사람
  alternatives_korean:
  - 경건한 자
  - 경건한 사람
  - 경건한 남자
  lexicon: LSJ
  rationale: 영어 POB가 남성 단수의 인격적 표현을 유지했지만, 한국어에서는 '사람'이 성별을 과도하게 특정하지 않으면서도 단수 지시를 자연스럽게 살릴 수 있어 가장 적절합니다.
- source_word: ἁμαρτωλός
  english_pob_choice: a sinner
  chosen_korean: 죄인
  alternatives_korean:
  - 죄인
  - 죄 많은 사람
  - 죄인 한 사람
  lexicon: LSJ
  rationale: 서술적 판단을 단정적으로 유지하는 명사형 '죄인'이 수사학적 평행과 가장 잘 맞습니다.
theological_decisions:
- issue: 경건한 사람을 일반화하지 않고 단수 대조를 유지할지 여부
  chosen_reading: ‘경건한 사람’과 ‘죄인’의 단수 대조를 유지했습니다.
  alternative_readings:
  - ‘경건한 자들’과 ‘죄인들’처럼 일반화
  - ‘경건한 이’와 ‘죄인’처럼 성별 중립화
  rationale: 그리스어가 단수 형태로 짝을 이루어 잠언적 대조를 구성하므로, 한국어도 단수의 인격적 대조를 유지해 문장의 압축성과 경구성을 보존했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
