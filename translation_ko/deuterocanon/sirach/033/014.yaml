  source_fidelity: 그리스어 ἀπέναντι는 반복되는 대조·대응 관계를 나타내며, ‘~에 맞서는 것’은 능동적으로 대항한다는 뜻을 더해 원문의 경구적 대칭을 약화시킵니다. ‘~의 반대는’이 원문의 세 대구를 정확히 재현합니다. εὐσεβοῦς와 ἁμαρτωλός의 단수 인격 대조는 ‘경건한 사람’과 ‘죄인’으로 유지할 수 있습니다.
  naturalness: ‘악의 반대는 선이고, 죽음의 반대는 생명입니다’는 현대 표준 한국어의 자연스러운 대구이며 합쇼체 문체에도 맞습니다. ‘이와 같이’는 οὕτως의 적용·귀결 기능을 자연스럽게 드러냅니다.
  terminology: ‘악/선’, ‘죽음/생명’, ‘경건한 사람/죄인’은 지혜문학의 통상적이고 이해하기 쉬운 용어입니다. ‘경건한 사람’은 그리스어의 남성 단수 형식을 한국어에서 불필요한 성별 특정 없이 자연스럽게 반영합니다.
