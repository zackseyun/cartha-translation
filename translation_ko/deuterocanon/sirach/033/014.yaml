  text: Opposite evil is good[a], and opposite death is life; so opposite a godly man is a sinner.
  footnotes:
  - marker: a
    text: Or 'opposite the godly is the sinner.' The Greek can be read more generically without supplying 'man,' but the singular masculine form is retained in the main text.
    reason: lexical_alternative
translation:
  language: ko
  text: 악에 맞서는 것은 선이며, 죽음에 맞서는 것은 생명입니다. 그러므로 경건한 사람에 맞서는 것은 죄인입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘경건한 자와 죄인.’ 그리스어는 더 일반적으로 읽을 수도 있으나, 본문은 단수 남성형을 유지합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέναντι
  english_pob_choice: opposite
  chosen_korean: ~에 맞서는 것
  alternatives_korean:
  - ~의 반대편에
