  text: Fodder and a rod and loads are for a donkey[a]; bread and discipline and work are for a slave.
  footnotes:
  - marker: a
    text: Or 'a household servant.' Greek οἰκέτῃ refers to a member of the household in servile status; 'slave' is used here to preserve that bonded sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 먹이는 것은 나귀를 위한 것이고, 채찍과 짐은 나귀를 위한 것입니다. 빵과 훈육과 일은 종을 위한 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χορτάσματα
  english_pob_choice: fodder
  chosen_korean: 먹이
  alternatives_korean:
  - 사료
  - 꼴
  - 먹이감
  lexicon: LSJ
  rationale: 동물에게 주는 먹이를 가리키는 말이므로, 나귀에 대한 대비를 살리기 위해 자연스러운 현대어인 ‘먹이’로 옮겼습니다.
- source_word: ῥάβδος
  english_pob_choice: rod
  chosen_korean: 채찍
  alternatives_korean:
  - 막대기
  - 몽둥이
  - 막대
  lexicon: LSJ
  rationale: 문맥상 단순한 막대보다 통제·교정의 기능이 더 분명하므로, ‘채찍’으로 옮겨 징계적 뉘앙스를 살렸습니다.
- source_word: φορτία
  english_pob_choice: loads
  chosen_korean: 짐
  alternatives_korean:
  - 짐꾸러미
  - 부담
  - 적재물
  lexicon: LSJ
  rationale: 나귀가 지는 것을 가리키는 구체적 표현이므로, 현대 한국어에서 가장 자연스럽고 직접적인 ‘짐’을 선택했습니다.
- source_word: οἰκέτῃ
  english_pob_choice: a slave
  chosen_korean: 종
  alternatives_korean:
  - 노예
  - 하인
  - 집안종
  lexicon: LSJ
  rationale: 영어 POB는 bonded status를 살리기 위해 ‘slave’를 택했지만, 한국어에서는 이 구절의 가정 내 종속 신분을 드러내면서도 과도하게 현대적·설명적으로 들리지 않는 ‘종’이 문맥상 가장 적절합니다.
theological_decisions:
- issue: οἰκέτῃ의 신분 뉘앙스
  chosen_reading: ‘종’으로 옮기되, 본문은 고대 가정 질서의 종속 관계를 드러내는 표현으로 유지했습니다.
  alternative_readings:
  - ‘노예’
  - ‘하인’
  rationale: 본문은 노동과 훈육이 특정한 가정 내 종속 인물에게 배정된다는 사회적 현실을 전제합니다. 한국어 ‘종’은 그 위계를 비교적 직접적으로 보존하면서도, 문장 전체의 지혜문학적 경구성을 해치지 않습니다.
  doctrine_reference: 'DOCTRINE.md: bondservant/slave 계열 용례의 사회사적 현실 보존 원칙'
