  source_fidelity: 그리스어의 핵심 의미는 대체로 충실하게 옮겼습니다. 다만 πρόσεχε ἀπό의 자연스러운 한국어 대응은 ‘악인을 경계하십시오’이며, 문맥상 두 번째 목적어 대명사 ‘당신에게’는 불필요하고 현대 한국어에서 다소 부자연스럽습니다. μή ποτε 이하의 경고 목적은 ‘…안기지 않도록 하십시오’로 유지할 수 있습니다.
  naturalness: ‘악인에게서 경계하십시오’보다 ‘악인을 경계하십시오’가 현대 표준어에서 더 자연스럽습니다. 또한 ‘그가 당신에게 수치를 영원히 가져다주지 않도록’은 ‘그가 영원히 수치를 안기지 않도록’으로 다듬는 편이 간결하고 자연스럽습니다.
  terminology: ‘악인’, ‘악한 일’, ‘수치’, ‘영원히’는 각각 κακοῦργος, πονηρά, μῶμος, εἰς τὸν αἰῶνα를 문맥에 맞게 잘 반영합니다. ‘안기다’는 여기서 δῷ σοι의 결과적 의미를 자연스럽게 전달합니다.
