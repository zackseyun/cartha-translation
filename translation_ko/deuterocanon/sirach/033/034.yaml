    reason: lexical_alternative
lexical_decisions:
- source_word: πρόσεχε
  english_pob_choice: Be on guard
  chosen_korean: 경계하십시오
  alternatives_korean:
  - 조심하십시오
  - 주의하십시오
  lexicon: LSJ
  rationale: 접근하는 위험에 대해 각성하고 방비하라는 명령이므로, 단순한 ‘주의’보다 행동성을 가진 ‘경계하십시오’가 더 잘 맞습니다.
- source_word: ἀπὸ κακούργου
  english_pob_choice: against a wrongdoer
  chosen_korean: 악인에게서
  alternatives_korean:
  - 악을 행하는 자에게서
  - 악한 자에게서
  lexicon: LSJ
  rationale: κακούργου는 ‘악을 행하는 사람/해로운 사람’을 가리키므로, 문맥상 ‘악인’이 간결하면서도 충분히 넓은 대응입니다. πρόσεχε + ἀπό의 관계는 한국어에서 자연스럽게 ‘-에게서’로 옮겼습니다.
- source_word: πονηρὰ
  english_pob_choice: evil
  chosen_korean: 악한 일
  alternatives_korean:
  - 악
  - 사악한 것들
  - 불의한 일
  lexicon: LSJ
  rationale: 중성 복수의 명사적 용법으로 ‘악한 것들/일들’을 뜻하므로, 한국어에서는 구체적 행위성을 살린 ‘악한 일’로 옮겼습니다.
- source_word: μῶμον
  english_pob_choice: disgrace
  chosen_korean: 수치
  alternatives_korean:
  - 치욕
  - 비난
  - 책망
  lexicon: LSJ
  rationale: 문맥상 상대에게 가져오는 공개적 불명예와 부끄러움을 나타내므로, ‘수치’가 가장 직관적이고 자연스럽습니다.
- source_word: εἰς τὸν αἰῶνα
  english_pob_choice: forever
  chosen_korean: 영원히
  alternatives_korean:
  - 끝없이
  - 영구히
  - 세세토록
  lexicon: LSJ
  rationale: 시간적으로 지속되는 강한 강조를 살리기 위해 ‘영원히’로 옮겼습니다. 이 문맥에서는 단순한 과장된 관용어보다 지속성 자체가 중요합니다.
