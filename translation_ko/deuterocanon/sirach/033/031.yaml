base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/033/031.yaml
  text: If you have a slave[a], let him be as yourself[b], because you acquired him with blood.
  footnotes:
  - marker: a
    text: Or 'servant' or 'household servant'; the Greek οἰκέτης often refers to a member of the household staff, but here the context of acquisition makes the bonded sense prominent.
    reason: lexical_alternative
  - marker: b
    text: Literally 'because with blood you acquired him.' The phrase likely expresses costly acquisition rather than specifying whose blood is in view.
    reason: lexical_alternative
translation:
  language: ko
  text: 네게 종이 있으면, 그를 너 자신과 같이 여기십시오.[a] 네가 피로 그를 얻었기 때문입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그가 너와 같게 하라’입니다. 한국어에서는 그를 자신과 동등하게 대하라는 뜻이 자연스럽게 드러나도록 ‘그를 너 자신과 같이 여기십시오’로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘피로 그를 얻었기 때문’입니다. 여기서 ‘피’는 누구의 피인지를 특정하지 않으며, 값비싼 획득을 강하게 드러내는 표현일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰκέτης
  english_pob_choice: slave
  chosen_korean: 종
  alternatives_korean:
  - 노예
  - 하인
  - 집안 종
  lexicon: BDAG
  rationale: 이 단어는 본래 집안에 속한 하인을 가리킬 수 있지만, 뒤의 ἐκτήσω αὐτόν(‘그를 얻었다’)와 결합해 소유·예속 관계가 분명해지므로, 본문이 드러내는 종속 상태를 살려 ‘종’으로 옮겼습니다.
- source_word: ἔστω ὡς σύ
  english_pob_choice: let him be as yourself
  chosen_korean: 그를 너 자신처럼 여기게 하십시오
  alternatives_korean:
  - 그가 너처럼 되게 하십시오
  - 그를 너와 같이 여기십시오
  lexicon: LSJ
  rationale: 헬라어는 직역하면 ‘그가 너처럼 되게 하라’에 가깝지만, 한국어에서는 ‘여기다’가 판단·대우의 뜻을 자연스럽게 전달하므로 의미를 과도하게 풀지 않으면서도 읽기 쉽게 옮겼습니다.
- source_word: ἐν αἵματι
  english_pob_choice: with blood
  chosen_korean: 피로
  alternatives_korean:
  - 피로써
  - 목숨을 걸고
  - 피 값으로
  lexicon: LSJ
  rationale: 구절의 핵심 이미지는 ‘피를 매개로 한 값비싼 획득’이므로, 해석을 덧붙이기보다 간결하게 ‘피로’로 살려 혈연적·희생적 뉘앙스를 열어 두었습니다.
- source_word: ἐκτήσω
  english_pob_choice: you acquired
  chosen_korean: 얻었기 때문입니다
  alternatives_korean:
  - 획득하였기 때문입니다
  - 사들였기 때문입니다
  - 취하였기 때문입니다
  lexicon: BDAG
  rationale: κτάομαι 계열의 의미를 반영하되, ‘사다’처럼 상업적 뉘앙스를 강제하지 않기 위해 ‘얻다’로 옮겼습니다. 문맥상 소유 관계는 ‘종’과 함께 충분히 드러납니다.
theological_decisions:
- issue: 피로 획득했다는 표현의 의미
  chosen_reading: 값비싼 획득과 책임 있는 대우를 강조하는 표현으로 읽었습니다.
  alternative_readings:
  - 실제 유혈 희생을 가리키는 표현
  - 노동력 구매의 은유
  rationale: 헬라어는 단순히 ‘피와 함께’라는 형태로, 누구의 피인지 명시하지 않습니다. 따라서 특정 희생을 단정하기보다, 본문이 강조하는 값비싼 획득과 그에 따른 동등한 대우의 책임을 살렸습니다.
  doctrine_reference: 본문 주해상 문맥(χωρίς 명시적 희생 주체)과 POB의 절제된 해석 원칙
