  verdict: revise
  source_fidelity: ‘이삭을 줍는’은 포도 수확꾼(τρυγηταί) 뒤의 장면과 농작물이 맞지 않습니다. καλαμώμενος는 수확 뒤에 남은 것을 줍는 사람을 가리키므로, 이 문맥에서는 남은 포도를 줍는 것으로 구체화하는 것이 자연스럽고 비유의 이미지를 보존합니다. 나머지는 κἀγώ의 첨가·강조, ἔσχατος의 순서, ἠγρύπνησα의 ‘깨어 있음’을 적절히 반영합니다.
  naturalness: ‘포도 수확꾼들 뒤에서 이삭을 줍는’은 한국어에서도 포도밭과 곡식밭의 이미지가 충돌합니다. ‘포도 수확꾼들 뒤에서 남은 포도를 줍는 사람처럼’으로 고치면 현대 표준어 합쇼체에서 자연스럽습니다.
  terminology: ‘포도 수확꾼들’은 τρυγητῶν에 알맞습니다. ‘남은 포도를 줍는 사람’은 교파적 해석을 더하지 않으면서 καλαμώμενος의 이삭줍기/남은 수확물 줍기 개념을 해당 비유의 포도 수확 장면에 맞게 옮깁니다.
  issues:
