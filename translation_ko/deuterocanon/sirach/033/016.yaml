  text: And I too kept watch last of all[a], like one who gleans behind the grape harvesters.
  footnotes:
  - marker: a
    text: Or 'stayed awake last of all'; the Greek verb can emphasize wakefulness or vigilance, and in context likely conveys diligent late labor.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 저도 포도 수확꾼들 뒤에서 남은 포도를 줍는 사람처럼 맨 나중에[a] 깨어 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘맨 나중까지 깨어 있었습니다.’ 그리스어 동사는 ‘깨어 있다’ 또는 ‘경계하다’를 뜻할 수 있으며, 여기서는 부지런히 늦게까지 수고하는 뜻을 내포할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀγώ
  english_pob_choice: And I too
  chosen_korean: 그리고 저도
  alternatives_korean:
  - 저도
  - 그리고 나도
  lexicon: LSJ
  rationale: καί+ἐγώ의 결합이 주는 덧붙임과 강조를 살려, 앞말에 자연스럽게 이어지는 ‘그리고 저도’로 옮겼습니다.
- source_word: ἔσχατος
  english_pob_choice: last of all
  chosen_korean: 맨 나중에
  alternatives_korean:
  - 마지막에
  - 끝으로
  lexicon: LSJ
  rationale: 행위의 순서를 드러내는 부사적 용법이므로, 다른 사람들 뒤에 이어졌다는 뜻이 분명한 ‘맨 나중에’를 택했습니다.
- source_word: ἠγρύπνησα
  english_pob_choice: kept watch
  chosen_korean: 깨어 있었습니다
  alternatives_korean:
  - 경계하고 있었습니다
  - 잠들지 않고 있었습니다
  lexicon: LSJ
  rationale: 이 동사는 문자적으로는 깨어 있거나 경계하는 상태를 뜻하므로, 본문 문맥의 부지런한 늦은 노동을 해치지 않으면서도 감각을 살려 ‘깨어 있었습니다’로 옮겼습니다.
- source_word: καλαμώμενος ὀπίσω τρυγητῶν
  english_pob_choice: like one who gleans behind the grape harvesters
  chosen_korean: 포도 수확꾼들 뒤에서 이삭을 줍는 사람처럼
  alternatives_korean:
  - 포도 수확꾼들 뒤를 따라 남은 것을 줍는 사람처럼
  - 포도 수확자들 뒤에서 줍는 사람처럼
  lexicon: LSJ
  rationale: 비유의 핵심은 ‘뒤따라가며 남은 것을 줍는’ 농경 장면이므로, ‘이삭을 줍는 사람처럼’과 ‘포도 수확꾼들 뒤에서’를 결합해 시각적 이미지를 분명하게 했습니다.
