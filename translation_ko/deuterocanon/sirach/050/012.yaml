revisions:
- from: 그가 형제들의 손에서 몫들을 받았을 때, 그는 자기 배정된 자리에서 서 있었습니다. 그를 둘러싼 것은 아들들의 관이었는데, 레바논의 백향목 묘목들 같았고, 그들은 시냇가의 버들처럼 그를 에워쌌으니—아론의 모든 아들들이 그들의 영광 가운데 있었습니다.[a][b]
  to: 그가 그의 형제들의 손에서 제물의 몫을 받을 때[a], 그는 제의 배열 위에 서 있었습니다[b]. 그의 주위에는 레바논의 백향목 묘목들 같은 아들들의 관이 있었고, 아론의 모든 아들들이 그들의 영광 가운데 시냇가의 버들처럼 그를 에워쌌습니다.
  rationale: 히브리어를 우선하여 ‘형제들’과 제의적 ‘배열’의 모호성을 본문에서 보존했습니다. 그리스어가 제공하는 제단 장면은 각주에만 제시했습니다. 또한 원문의 비유적 구문과 병렬을 더 자연스러운 한국어 문장으로 정리하고, 두 각주를 해당 표현 바로 뒤에 배치했습니다.
