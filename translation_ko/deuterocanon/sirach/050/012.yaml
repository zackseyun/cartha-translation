base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/050/012.yaml
  text: When he received the portions from the hand of his brothers[a], and he stood at his arrangement, around him was a crown of sons, like saplings of cedars in Lebanon[b]; and they surrounded him like willows by a stream—all the sons of Aaron in their splendor.
  footnotes:
  - marker: a
    text: 'Greek: ''from the hands of the priests'' where the Hebrew reads ''from the hand of his brothers.'' The context indicates fellow priests.'
    reason: alternative_reading
  - marker: b
    text: Hebrew 'stood upon/at the arrangements' is difficult; the Greek parallel clarifies the scene as standing by the altar hearth.
    reason: textual_variant
translation:
  language: ko
  text: 그가 그의 형제들의 손에서 제물의 몫을 받을 때[a], 그는 제의 배열 위에 서 있었습니다[b]. 그의 주위에는 레바논의 백향목 묘목들 같은 아들들의 관이 있었고, 아론의 모든 아들들이 그들의 영광 가운데 시냇가의 버들처럼 그를 에워쌌습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 ‘제사장들의 손에서’라고 읽습니다. 히브리어는 ‘그의 형제들의 손에서’라고 하므로, 본문은 히브리어를 따릅니다. 문맥상 이 형제들은 동료 제사장들입니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어의 ‘그의 제의 배열 위에 서 있었다’라는 표현은 정확한 지시 대상이 불확실합니다. 그리스어 병행 본문은 그가 제단의 화덕 곁에 서 있는 것으로 읽습니다.
    reason: textual_variant
lexical_decisions:
- source_word: בְּקַבְּלוֹ נְתָחִים
  english_pob_choice: When he received the portions
  chosen_korean: 그가 ... 몫들을 받았을 때
  alternatives_korean:
  - 그가 ... 분깃들을 받았을 때
  - 그가 ... 제물의 조각들을 받았을 때
  lexicon: HALOT
  rationale: 제의적 문맥의 נְתָחִים을 한국어로는 자연스럽고 구체적으로 ‘몫들’로 옮겨, 제사 분배의 의미를 살리면서도 과도하게 설명적으로 만들지 않았습니다.
- source_word: מִיַּד אֶחָיו
  english_pob_choice: from the hand of his brothers
  chosen_korean: 형제들의 손에서
  alternatives_korean:
  - 형제들의 손으로부터
  - 형제이신 제사장들의 손에서
  lexicon: HALOT
  rationale: 히브리어의 ‘형제들’을 본문대로 유지해, 그들이 제사장들이라는 해석은 다음 절과 병행 전승으로 드러나게 두었습니다.
- source_word: נִצָּב עַל מַעֲרָכוֹת
  english_pob_choice: stood at his arrangement
  chosen_korean: 자기 배정된 자리에서 서 있었습니다
  alternatives_korean:
  - 배열된 자리에서 서 있었습니다
  - 제단의 배열 위에 서 있었습니다
  lexicon: HALOT
  rationale: 마עֲרָכוֹת의 난해함을 한국어에서 ‘배정된 자리’로 풀어, 제의적 질서와 위치 감각은 살리되 영어식 해설을 그대로 따라 과잉 번역하지 않았습니다.
- source_word: כִּשְׁתִילֵי אֲרָזִים
  english_pob_choice: like saplings of cedars
  chosen_korean: 레바논의 백향목 묘목들 같았고
  alternatives_korean:
  - 레바논의 백향목 새순들 같았고
  - 레바논의 백향목 어린나무들 같았고
  lexicon: HALOT
  rationale: 시적 비유의 생동감을 살리기 위해 ‘묘목들’로 옮겼고, ‘레바논의’는 원문의 지명을 그대로 유지했습니다.
- source_word: בְּעַרְבֵי נָחַל
  english_pob_choice: like willows by a stream
  chosen_korean: 시냇가의 버들처럼
  alternatives_korean:
  - 개울가의 버들처럼
  - 시내의 버드나무처럼
  lexicon: HALOT
  rationale: 관용적으로 알려진 수종 비유를 한국어 시어로 자연화하되, 물가에 자라는 이미지는 유지했습니다.
- source_word: בִּכְבוֹדָם
  english_pob_choice: in their splendor
  chosen_korean: 그들의 영광 가운데
  alternatives_korean:
  - 그들의 존귀함 가운데
  - 그들의 위엄 가운데
  lexicon: HALOT
  rationale: כבוד의 핵심을 ‘영광’으로 살리면서, 제사장들의 엄숙하고 장엄한 모습을 한국어에서 압축적으로 드러냈습니다.
theological_decisions:
- issue: ‘his brothers’의 제사장적 정체성
  chosen_reading: 본문에는 ‘형제들’을 유지하고, 그들이 아론의 아들들 곧 제사장들이라는 정체성은 마지막 절구와 병행 전승으로 드러나게 했습니다.
  alternative_readings:
  - 형제이신 제사장들
  - 제사장들의 손에서
  rationale: 히브리어 본문을 우선하면서도, 그리스어 병행이 제공하는 해석을 본문 바깥의 안내로만 사용해 원문 전승의 긴장을 보존했습니다.
  doctrine_reference: 원어 우선 원칙과 전승 간 긴장 보존
- issue: מַעֲרָכוֹת의 난해한 제의적 표현
  chosen_reading: ‘자기 배정된 자리’로 옮겨 제의적 질서와 위치를 암시하되, 제단을 본문에 추가하지 않았습니다.
  alternative_readings:
  - 제단 곁에 서 있었습니다
  - 정렬된 자리에서 서 있었습니다
  rationale: 히브리어 본문만으로는 위치가 다소 모호하므로, 그리스어 병행을 참고하되 본문에 없는 요소를 덧붙이지 않는 방향을 택했습니다.
  doctrine_reference: 최적대응 번역과 병행 전승의 보조적 활용
