base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/050/022.yaml
  text: And now[a], please bless Yahweh, the God of Israel, who does wondrous things on the earth, who makes man great from the womb and deals with him according to his will.
  footnotes:
  - marker: a
    text: 'Greek parallel: ''and does with us according to his mercy'' instead of ''and deals with him according to his will.'''
    reason: alternative_reading
translation:
  language: ko
  text: 이제 모두 야훼, 이스라엘의 하나님을 찬양하십시오. 그는 땅에서 놀라운 일들을 하시고, 사람을 태에서부터 크게 하시며, 자기 뜻대로 그를 대하십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 병행본은 ‘우리를 불쌍히 여기시는 대로 행하신다’는 취지로, 히브리어의 ‘자기 뜻대로 그를 대하신다’와 다릅니다.
    reason: textual_variant
lexical_decisions:
- source_word: בָּרְכוּ נָא
  english_pob_choice: please bless
  chosen_korean: 찬양하십시오
  alternatives_korean:
  - 축복하십시오
  - 축복하소서
  lexicon: HALOT
  rationale: 문맥상 공동체가 하나님을 향해 드리는 찬양 권면이므로 한국어에서는 자연스러운 예배적 명령인 ‘찬양하십시오’로 옮겼습니다. נָא의 간청·권유 뉘앙스는 앞의 ‘이제’로 보완했습니다.
- source_word: יְהֹוָה אֱלֹהֵי יִשְׂרָאֵל
  english_pob_choice: Yahweh, the God of Israel
  chosen_korean: 야훼, 이스라엘의 하나님
  alternatives_korean:
  - 여호와, 이스라엘의 하나님
  - 주, 이스라엘의 하나님
  lexicon: 프로젝트 표준 용례
  rationale: 프로젝트 기본값에 따라 신명은 ‘야훼’로 옮기고, ‘이스라엘의 하나님’은 원문 호칭을 그대로 살렸습니다.
- source_word: הַמַּפְלִיא לַעֲשׂוֹת
  english_pob_choice: who does wondrous things
  chosen_korean: 놀라운 일들을 하시고
  alternatives_korean:
  - 기이한 일들을 하시고
  - 놀라운 일을 행하시고
  lexicon: HALOT
  rationale: פלא의 경이로운 행위를 한국어에서 예배적 문맥에 자연스럽게 전달하기 위해 ‘놀라운 일들’을 택했습니다. 복수형은 문맥상의 총괄적 찬양을 반영합니다.
- source_word: הַמְגַדֵּל אָדָם מֵרֶחֶם
  english_pob_choice: who makes man great from the womb
  chosen_korean: 사람을 태에서부터 크게 하시며
  alternatives_korean:
  - 인간을 태에서부터 높이시며
  - 사람을 태에서부터 높여 주시며
  lexicon: HALOT
  rationale: גדל은 ‘크게 하다/높이다’의 의미가 있어, 영어 POB의 ‘makes man great’를 따라 ‘크게 하시며’로 옮겼습니다. ‘사람’은 אָדָם의 대표적 인간 일반을 자연스럽게 살리는 표현입니다.
- source_word: וַיַּעֲשֵׂהוּ בִּרְצוֹנוֹ
  english_pob_choice: deals with him according to his will
  chosen_korean: 자기 뜻대로 그를 대하십니다
  alternatives_korean:
  - 자기 뜻에 따라 그를 다루십니다
  - 자기 뜻대로 그를 만드십니다
  lexicon: HALOT
  rationale: 본문의 핵심은 인간에 대한 하나님의 주권적 처분이므로, 직역보다 의미를 살려 ‘대하십니다’로 옮겼습니다. ‘자기 뜻대로’는 בִּרְצוֹנוֹ의 의지/뜻을 반영합니다.
theological_decisions:
- issue: סירח 50:22의 히브리어 본문과 그리스어 병행본의 마지막 절 차이
  chosen_reading: 본문은 히브리어 ‘자기 뜻대로 그를 대하십니다’를 따르고, 그리스어의 ‘우리에게 자비를 베푸십니다’는 주석적 대안으로만 남깁니다.
  alternative_readings:
  - 자비를 베푸십니다
  - 자기 뜻대로 그를 다루십니다
  rationale: 히브리어 증언이 현존하는 주본문이므로 이를 우선하되, 그리스어의 자비 강조는 중요한 신학적 변이이므로 배경 차원에서 인지해야 합니다.
  doctrine_reference: 히브리어 우선 원칙; 서기관 전승 변이 보존 원칙
