revisions:
- from: 이제 모두 야훼, 이스라엘의 하나님을 찬양하십시오. 그는 땅에서 놀라운 일들을 하시고, 사람을 태에서부터 크게 하시며, 자기 뜻대로 그를 대하십니다.[a]
  to: 이제, 부디 야훼, 이스라엘의 하나님을 송축하십시오. 그분은 땅에서 기이한 일을 행하시고, 태에서부터 사람을 높이시며, 그를 자신의 뜻대로 만드십니다.[a]
  rationale: 히브리어 본문에 없는 ‘모두’를 제거하고, נָא의 권면적 뉘앙스를 ‘부디’로 반영했습니다. 마지막 절은 히브리어의 직접 목적어와 ‘뜻’의 표현을 보존하도록 수정했으며, 그리스어 병행본의 자비 독법은 각주에 정확히 제시했습니다.
