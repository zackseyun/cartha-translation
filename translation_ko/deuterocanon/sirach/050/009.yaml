  alternative_readings:
  - 그리스어처럼 ‘모든 귀한 돌로 장식된’으로 풀어쓰기
  - 히브리어의 난독 어휘를 생략하고 단순한 장식 묘사로 일반화
  rationale: 이 절은 히브리어와 그리스어가 세부 묘사에서 다르므로, 본문을 과도하게 평준화하지 않고 둘 다 시사하는 화려한 장식성을 보존하는 것이 적절합니다.
  doctrine_reference: 본문 비평 및 번역학적 일치성
