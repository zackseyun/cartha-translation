translation:
  language: ko
  text: 마치 금으로 만든 새겨 넣은 그릇과 같고, 또 안티몬으로 장식되어 있으며, 귀한 돌들 위에 고정된 것 같습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 וְאַנְטִיל은 뜻이 불확실합니다. 안티몬이나 장식용 상감재를 가리킬 수 있으며, 그리스어 병행문은 더 넓게 ‘모든 귀한 돌로 장식된’이라고 읽습니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어 증언은 이미지를 확장하여 ‘금 그릇, 망치로 두들겨 만든 것, 모든 귀한 돌로 장식된 것’이라고 읽습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּכְלִי זָהָב
  english_pob_choice: like a vessel of engraved gold
  chosen_korean: 금으로 만든 새겨 넣은 그릇처럼
  alternatives_korean:
