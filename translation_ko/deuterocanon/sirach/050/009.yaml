    text: 히브리어 וְאַנְטִיל은 뜻이 불확실합니다. 안티몬을 가리킬 수도 있고, 어떤 장식용 상감이나 장신구를 가리킬 수도 있습니다. 그리스어 병행문은 더 넓게 ‘모든 귀한 돌로 장식된’이라고 읽습니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어 증언은 이 이미지를 더 넓게 표현하여 ‘금 그릇, 망치로 두들겨 만든 것, 모든 귀한 돌로 장식된 것’이라고 읽습니다. 이는 히브리어의 정교한 장식이라는 일반적 뜻을 뒷받침합니다.
    reason: alternative_reading
