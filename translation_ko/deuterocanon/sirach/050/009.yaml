  - 금으로 된 그릇처럼
  lexicon: HALOT
  rationale: כְּ는 비교를 나타내고 כְּלִי는 여기서 정교하게 만든 그릇/기물을 가리키므로, ‘그릇’으로 살리되 금 재질과 장식성을 함께 드러냈습니다.
- source_word: מְפֻתָּח
  english_pob_choice: engraved
  chosen_korean: 새겨 넣은
  alternatives_korean:
  - 조각한
  - 장식한
  - 세공한
  lexicon: HALOT
  rationale: 수동 분사형이 금속 공예의 정교한 가공을 가리키므로, 현대 한국어에서 자연스럽고 시각적인 ‘새겨 넣은’으로 옮겼습니다.
- source_word: וְאַנְטִיל
  english_pob_choice: and antimony
  chosen_korean: 안티몬으로 장식되어 있으며
  alternatives_korean:
  - 안티몬과 함께
  - 안티몬이 들어간
  - 어떤 장식으로
  lexicon: HALOT
  rationale: 이 어휘는 불확실하지만 영어 POB가 ‘antimony’를 유지하므로, 본문은 그 가능성을 살리되 문맥상 장식/상감의 의미가 읽히도록 처리했습니다.
- source_word: עַל אַבְנֵי חֵפֶץ
  english_pob_choice: fastened onto precious stones
  chosen_korean: 귀한 돌들 위에 고정된
  alternatives_korean:
  - 귀한 돌들에 붙은
  - 보배로운 돌들 위에 박힌
  - 값비싼 돌들에 장착된
  lexicon: HALOT
  rationale: חֵפֶץ는 ‘원함/귀함, 값짐’의 뉘앙스를 가지며, 그리스어 병행문의 ‘모든 귀한 돌’이 이를 지지하므로 ‘귀한 돌들’로 옮기고 부착 상태는 ‘고정된’으로 나타냈습니다.
