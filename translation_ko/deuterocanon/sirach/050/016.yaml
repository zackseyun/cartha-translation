translation:
  language: ko
  text: 그들은 환호하고 힘찬 소리를 울려 퍼지게 하여, 지극히 높으신 분 앞에 기념이 되게 하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘지극히 높으신 분 앞에서 기억나게 하려고.’ 히브리어 부정사와 그리스어 평행문은 예배 맥락에서의 기념 또는 기억나게 함을 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּרִיעוּ
  english_pob_choice: they raised a shout
  chosen_korean: 크게 외치고
  alternatives_korean:
  - 외치고
  - 함성을 지르고
  - 환호하고
  lexicon: HALOT
  rationale: 의례적·공적 맥락에서의 जोर한 외침을 살리되, 한국어에서 자연스러운 합쇼체 문맥에 맞게 간결하게 옮겼습니다.
- source_word: וַיַּשְׁמִיעוּ
  english_pob_choice: made ... heard
  chosen_korean: 들리게 하여
  alternatives_korean:
  - 들리도록 하여
  - 소리나게 하여
  - 선포하여
  lexicon: HALOT
  rationale: 히필의 사역적 의미(‘듣게 하다’)를 유지하면서, 앞의 ‘크게 외치다’와 병렬로 자연스럽게 연결했습니다.
- source_word: קוֹל אַדִּיר
  english_pob_choice: a mighty sound
  chosen_korean: 위대한 소리
  alternatives_korean:
  - 큰 소리
  - 장엄한 소리
  - 힘찬 소리
  lexicon: HALOT
  rationale: קוֹל을 단순히 ‘음성’으로 한정하지 않고, 제의적 울림을 포괄하는 ‘소리’로 옮겼으며, אַדִּיר의 강한 수식을 살렸습니다.
- source_word: לְהַזְכִּיר
  english_pob_choice: to make remembrance
  chosen_korean: 기억되게 하였습니다
  alternatives_korean:
  - 기념되게 하였습니다
  - 기억나게 하였습니다
  - 기념으로 삼게 하였습니다
  lexicon: HALOT
  rationale: 히필의 기억/기념 의미를 반영하되, 본문이 말하는 제의적 ‘기념’과 일반적 ‘기억’ 사이의 긴장을 보존하기 위해 수동적 결과 표현으로 처리했습니다.
- source_word: לִפְנֵי עֶלְיוֹן
  english_pob_choice: before the Most High
  chosen_korean: 지극히 높으신 분 앞에서
  alternatives_korean:
  - 지극히 높으신 분 앞에
  - 가장 높으신 분 앞에서
  - 지극히 높으신 하나님 앞에서
  lexicon: HALOT
  rationale: עֶלְיוֹן의 신적 칭호를 ‘지극히 높으신 분’으로 옮겨 경외감을 살리고, לִפְנֵי의 전치 의미를 ‘앞에서’로 반영했습니다.
theological_decisions:
- issue: 제의적 기억/기념 언어의 처리
  chosen_reading: ‘기억되게 하였습니다’로 옮겨, 단순한 회상이 아니라 예배적·기념적 행위를 암시하게 했습니다.
  alternative_readings:
  - 기념되게 하였습니다
  - 기념으로 삼게 하였습니다
  - 기억나게 하였습니다
  rationale: 히브리어와 그리스어 병행 모두 memorial language를 지지하므로, 후대 교리 용어로 단정하지 않으면서도 예배 맥락의 의미를 보존했습니다.
  doctrine_reference: 원문 우선 원칙; 제의적 의미를 평준화하지 않고 긴장을 유지
