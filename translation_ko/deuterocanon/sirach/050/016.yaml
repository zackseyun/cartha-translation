  text: And they raised a shout and made a mighty sound heard[a], to make remembrance before the Most High.
  footnotes:
  - marker: a
    text: Or 'to serve as a memorial before the Most High.' The Hebrew infinitive and the Greek parallel both carry memorial language in a liturgical sense.
