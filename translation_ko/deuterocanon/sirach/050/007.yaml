translation:
  language: ko
  text: 왕의 전각을 비추는 해와 같고, 구름 속에 나타나는 무지개와 같습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 병행본문은 ‘지극히 높으신 분의 성전’(ναὸν Ὑψίστου)으로 읽습니다. 히브리어 본문은 ‘왕의 전각’으로 전합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: כְּשֶׁמֶשׁ
  english_pob_choice: Like the sun
  chosen_korean: 마치 해가
  alternatives_korean:
  - 마치 태양이
  - 해처럼
  lexicon: HALOT
  rationale: 비교의 כ를 한국어의 ‘마치’로 자연스럽게 살리고, 시적 문맥에서 ‘해’가 가장 간결하고 직접적인 대응입니다.
- source_word: מְשַׁקֶּרֶת
  english_pob_choice: shining
  chosen_korean: 비추는
  alternatives_korean:
  - 빛나는
  - 환하게 비추는
  lexicon: HALOT
  rationale: 히브리어의 이례적 형태는 문맥상 발광·빛 비춤의 뜻이며, 그리스어 병행본문의 ‘shining forth’와도 맞아 ‘비추는’으로 옮겼습니다.
- source_word: אֶל הֵיכַל הַמֶּלֶךְ
  english_pob_choice: on the temple of the king
  chosen_korean: 왕의 전각에
  alternatives_korean:
  - 왕의 궁전에
  - 왕의 성전에
  lexicon: HALOT
  rationale: הֵיכָל은 ‘전각/궁전/성전’이 모두 가능하나, 히브리어의 ‘왕’ 표현을 보존하면서 문맥상 왕궁의 큰 전각을 뜻하는 기본 의미를 살려 ‘왕의 전각’으로 옮겼습니다.
- source_word: וּכְקֶשֶׁת
  english_pob_choice: and like a rainbow
  chosen_korean: 마치 무지개가
  alternatives_korean:
  - 그리고 무지개처럼
  - 마치 활이
  lexicon: HALOT
  rationale: 뒤의 ‘구름 속에 나타나는’과 결합될 때 קשת는 ‘활’보다 기상 현상인 ‘무지개’가 분명합니다.
- source_word: נִרְאֲתָה
  english_pob_choice: appearing
  chosen_korean: 나타나는
  alternatives_korean:
  - 보이는
  - 드러나는
  lexicon: HALOT
  rationale: 니팔형의 ‘보이다/나타나다’ 의미를 시적으로 살려, 주어인 무지개가 구름 속에 현현하는 장면을 자연스럽게 표현했습니다.
- source_word: בֶעָנָן
  english_pob_choice: in the cloud
  chosen_korean: 구름 속에
  alternatives_korean:
  - 구름 안에
  - 구름 가운데
  lexicon: HALOT
  rationale: 히브리어 단수 ‘구름’을 그대로 반영하면서, 한국어에서는 위치를 더 자연스럽게 드러내는 ‘구름 속에’가 적절합니다.
theological_decisions:
- issue: 히브리어 ‘왕의 전각’과 그리스어 ‘지극히 높으신 분의 성전’의 차이
  chosen_reading: 본문은 히브리어 증거를 따라 ‘왕의 전각’으로 두되, 히브리어 הֵיכָל의 의미는 그리스어 병행본문이 보여 주는 예배 공간의 가능성을 완전히 배제하지는 않습니다.
  alternative_readings:
  - 지극히 높으신 분의 성전
  - 왕의 궁전
  rationale: 현존 히브리어 증거가 ‘왕’을 보존하므로 이를 본문에 남기되, 병행 그리스어가 예배적 배경을 시사하므로 뜻의 범위를 과도하게 좁히지 않도록 했습니다.
  doctrine_reference: 'PHILOSOPHY.md: surviving Hebrew primary, Greek parallel as audit input'
