base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/050/028.yaml
  text: Blessed is the man who meditates on these things[a], and he who takes them to heart will become wise.
  footnotes:
  - marker: a
    text: Or, 'Happy is the man.' The Hebrew beatitude אַשְׁרֵי and the Greek μακάριος can also be rendered 'happy,' but 'blessed' better preserves the wisdom-saying tone.
    reason: lexical_alternative
translation:
  language: ko
  text: 이 일들에 대해 묵상하는 사람은 복이 있으며, 그것들을 마음에 두는 그는 지혜로워질 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘행복한 사람은.’ 히브리어 אַשְׁרֵי와 그리스어 μακάριος는 ‘행복하다’로도 옮길 수 있지만, 지혜 격언의 톤을 더 잘 살리기 위해 ‘복이 있다’를 본문에 두었습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁרֵי / μακάριος
  english_pob_choice: Blessed is
  chosen_korean: 복이 있으며
  alternatives_korean:
  - 행복합니다
  - 복됩니다
  lexicon: HALOT
  rationale: 지혜 문맥의 복됨을 나타내는 축복 선언으로서, 단순 감정 상태보다 의미를 잘 살리는 표현을 택했습니다.
- source_word: אִישׁ
  english_pob_choice: the man
  chosen_korean: 사람은
  alternatives_korean:
  - 그 남자는
  - 사람
  lexicon: HALOT
  rationale: 히브리어는 남성 단수형이지만 지혜문맥에서 일반적 개인을 가리키므로, 한국어에서는 자연스러운 대표적 표현인 '사람'으로 옮겼습니다.
- source_word: בְּאֵלֶּה / ἐν τούτοις
  english_pob_choice: on these things
  chosen_korean: 이 일들에 대해
  alternatives_korean:
  - 이것들 안에서
  - 이 일들 속에서
  lexicon: HALOT
  rationale: 직전 맥락의 가르침들을 가리키는 지시어로 보이며, 한국어에서는 묵상 대상임을 드러내는 '이 일들에 대해'가 가장 자연스럽습니다.
- source_word: יֶהְגֶּה
  english_pob_choice: meditates
  chosen_korean: 묵상하는
  alternatives_korean:
  - 되새기는
  - 생각하는
  lexicon: HALOT
  rationale: 이 동사는 지혜문학에서 단순한 중얼거림보다 깊이 숙고하는 뜻이 강하므로, '묵상하다'가 문맥과 가장 잘 맞습니다.
- source_word: וְנוֹתֵן עַל לִבּוֹ
  english_pob_choice: who takes them to heart
  chosen_korean: 그것들을 마음에 두는 그는
  alternatives_korean:
  - 그것들을 마음에 새기는 그는
  - 그것들을 마음에 간직하는 그는
  lexicon: HALOT
  rationale: ‘마음에 두다’는 히브리 관용구의 내면화·심각한 고려의 뜻을 비교적 직설적으로 살리며, 다음 절의 지혜 획득과도 잘 연결됩니다.
- source_word: יֶחְכָּם
  english_pob_choice: will become wise
  chosen_korean: 지혜로워질 것입니다
  alternatives_korean:
  - 지혜롭게 될 것입니다
  - 지혜를 얻게 될 것입니다
  lexicon: HALOT
  rationale: 히브리어는 결과 상태로서 '지혜롭게 되다'를 뜻하므로, 능동적 결과를 드러내는 미래형으로 옮겼습니다.
theological_decisions:
- issue: ‘Blessed’의 번역 톤
  chosen_reading: 복이 있으며
  alternative_readings:
  - 행복합니다
  - 복됩니다
  rationale: 이 구절은 단순한 심리적 행복보다 지혜 전승에서의 복된 상태를 선언하는 형식이므로, 축복의 무게를 살리는 표현을 사용했습니다.
  doctrine_reference: PHILOSOPHY.md 'wisdom-saying tone' / translation principles
- issue: 히브리어와 그리스어 병행 증거의 반영
  chosen_reading: 히브리어 본문을 기본으로 하되, 그리스어의 복수 지시를 반영해 '그것들'로 처리
  alternative_readings:
  - 히브리어만 따라 단수적 느낌으로 옮김
  - 그리스어에 맞춰 더 해석적으로 확장
  rationale: 두 전승 모두 직전 교훈들을 가리키는 복수 지시를 지지하므로, 한국어 본문에서 이를 분명히 해 주는 것이 본문 충실성과 가독성을 함께 살립니다.
  doctrine_reference: Deuterocanonical / Apocrypha translation policy
