translation:
  language: ko
  text: 그의 시대에 저수지가 파였고, 바다처럼 물이 가득한 수로도 있었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '그리스어 병행문: ‘그에 의해 이중 구조물의 높이가 세워졌고, 성전 경내의 높은 버팀벽이 세워졌다.’ 히브리어 전승은 저수지와 수로를 말하므로, 두 본문은 상당한 차이를 보입니다.'
    reason: alternative_reading
  - marker: b
    text: 히브리어 שִׂיחַ는 의미가 불확실하며, 더 넓게는 물길이나 수로를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּדוֹרוֹ
  english_pob_choice: In his days
  chosen_korean: 그의 시대에는
  alternatives_korean:
  - 그의 날들에는
  - 그의 세대에는
  - 그가 활동하던 때에는
  lexicon: HALOT
  rationale: 인물의 활동 시기를 자연스럽게 가리키는 관용 표현으로 옮겼습니다. ‘그의 시대’는 전후 맥락의 공적·역사적 분위기도 잘 살립니다.
- source_word: נִכְרָה מִקְוֶה
  english_pob_choice: a reservoir was dug out
  chosen_korean: 저수지가 파였고
  alternatives_korean:
  - 저수지가 파졌고
  - 물웅덩이가 파였고
  - 저장용 못이 파였고
  lexicon: HALOT
  rationale: נכרה는 ‘파다/굴착하다’의 수동 의미이며, מִקְוֶה는 이 문맥에서 물을 모아 저장하는 인공 수역을 가리키므로 ‘저수지’가 가장 자연스럽습니다.
- source_word: שִׂיחַ
  english_pob_choice: conduit
  chosen_korean: 수로
  alternatives_korean:
  - 도수로
  - 물길
  - 배수로
  lexicon: HALOT
  rationale: 히브리어 שִׂיחַ는 확정이 어려우나, 저수지와 나란히 놓인 수리 시설을 가리키는 맥락이므로 기능을 살린 ‘수로’로 옮겼습니다.
- source_word: כַּיָּם בַּהֲמוֹנוֹ
  english_pob_choice: like the sea in its abundance
  chosen_korean: 바다처럼 풍성한
  alternatives_korean:
  - 바다처럼 넘치는
  - 바다 같은 풍성함의
  - 바다처럼 가득한
  lexicon: HALOT
  rationale: 직역하면 ‘바다처럼, 그 풍성함/많음 가운데’의 뉘앙스가 되므로, 비교와 양감을 함께 살려 ‘바다처럼 풍성한’으로 압축했습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행문의 큰 차이
  chosen_reading: 본문은 살아 있는 히브리어를 따라 저수지와 수로를 말하는 문장으로 번역하되, 그리스어의 성전 건축 관련 대조는 주석으로 남깁니다.
  alternative_readings:
  - 그에게서 이중 구조의 높이가 세워졌고, 성전 뜰의 높은 버팀벽이 되었다
  rationale: 시락서의 이 절은 히브리어와 그리스어가 표면적으로 크게 다르므로, 본문은 히브리어를 우선하되 다른 전승을 지우지 않기 위해 번역상의 선택 차이를 분명히 보존해야 합니다.
  doctrine_reference: 'PHILOSOPHY.md: 히브리어가 현존하면 히브리어 우선, 그리스어는 일치성 점검 및 대조 증거로 사용'
- issue: ‘수로’의 기술적 범위
  chosen_reading: ‘수로’는 구체적 공학 용어로 단정하지 않고, 물을 이동시키는 인공 통로라는 넓은 의미로 사용했습니다.
  alternative_readings:
  - 도수로
  - 운하
  - 물길
  rationale: 히브리어 שִׂיחַ의 의미가 불확실하므로, 과도한 기술적 특정화를 피하면서도 문맥상 수리 시설임을 분명히 하는 표현이 필요합니다.
  doctrine_reference: 텍스트 불확실성에 대한 보수적 번역 원칙
