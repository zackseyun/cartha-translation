translation:
  language: ko
  text: 그들은 두 번째로 엎드려, 그에게서 복을 받았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 ‘지극히 높으신 이에게서 오는 복을 드러내려고’로 읽어, 복의 근원을 지극히 높으신 이로 명시합니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어는 문자적으로 ‘엎드리다/떨어지다’를 뜻하지만, 문맥상 예배적 엎드림을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁנוּ
  english_pob_choice: they repeated
  chosen_korean: 두 번째로
  alternatives_korean:
  - 다시
  - 반복하여
  - 두 번째로
  lexicon: HALOT
  rationale: שנה의 반복 의미를 살려, 동작의 재개를 자연스럽게 나타냈습니다. 이미 뒤에 ‘엎드려’가 오므로 ‘두 번째로’가 가장 간결하게 반복성을 드러냅니다.
- source_word: לִנְפּוֹל
  english_pob_choice: their falling down
  chosen_korean: 엎드려
  alternatives_korean:
  - 엎드리는 것을
  - 엎드려 절하며
  - 엎드려 절하고
  lexicon: HALOT
  rationale: 직역하면 ‘떨어지다’이지만, 문맥상 예배적 엎드림/절함을 가리키므로 현대 한국어에서 자연스러운 동사 ‘엎드려’로 옮겼습니다.
- source_word: בְּרָכוֹת
  english_pob_choice: blessing
  chosen_korean: 복을
  alternatives_korean:
  - 축복을
  - 복들을
  lexicon: HALOT
  rationale: 히브리어는 복수형이지만, 헬라어 병행문의 단수 τὴν εὐλογίαν과 문맥상 집합적 의미를 반영해 단수 ‘복’을 사용했습니다.
- source_word: מִפָּנָיו
  english_pob_choice: from before him
  chosen_korean: 그 앞에서
  alternatives_korean:
  - 그의 حضور에서
  - 그의 앞에서
  - 그의 임재 앞에서
  lexicon: HALOT
  rationale: ‘그의 얼굴 앞에서/앞으로부터’라는 히브리어 관용을 한국어로 자연스럽게 옮기면서, 지시대상은 본문 흐름에 맡겼습니다.
theological_decisions:
- issue: 히브리어 본문의 대명사와 그리스어의 ‘지극히 높으신 이’ 해석 차이
  chosen_reading: 본문에는 대명사를 살려 ‘그 앞에서’로 두었습니다.
  alternative_readings:
  - 지극히 높으신 이 앞에서
  - 하나님 앞에서
  rationale: 남아 있는 히브리어 본문이 3인칭 대명사를 가지므로, 그리스어의 해석적 확장을 본문에 흡수하지 않고 차이를 보존했습니다. 이는 원문 우선과 긴장 보존 원칙에 맞습니다.
  doctrine_reference: 원문 우선 원칙, 해석 전통과 본문 차이 보존
