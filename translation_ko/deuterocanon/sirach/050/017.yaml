translation:
  language: ko
  text: 모든 육체가 함께 서둘러, 땅에 얼굴을 대고 엎드려 그들의 주권자 하나님, 지극히 높으신 이스라엘의 거룩하신 분께 경배하였습니다.[a]
  philosophy: formal
  footnotes:
  - marker: a
    text: 히브리어는 ‘모든 육체’라고 하여, 사람 전체를 포괄하는 총칭을 사용합니다.
    reason: source_note
lexical_decisions:
- source_word: כָּל בָּשָׂר
  english_pob_choice: All flesh
  chosen_korean: 모든 육체
  alternatives_korean:
  - 모든 사람
  - 온 백성
  lexicon: בָּשָׂר → 육체/사람
  rationale: 히브리어의 보편적 총칭을 살리기 위해 '모든 육체'로 옮겨, 단순한 집단명보다 피조 인간 전체를 가리키는 뉘앙스를 유지했습니다.
- source_word: יַחְדָּו נִמְהָרוּ
  english_pob_choice: hurried
  chosen_korean: 함께 서둘러
  alternatives_korean:
  - 일제히 급히
  - 함께 서두르며
  lexicon: מהר → 서두르다/서둘러
  rationale: POB의 'hurried'를 따라 동작의 속도와 일치를 간결하게 드러내며, '함께'로 יַחְדָּו의 공동성을 보존했습니다.
- source_word: וַיִּפְּלוּ עַל פְּנֵיהֶם אָרְצָה
  english_pob_choice: they fell on their faces to the ground
  chosen_korean: 땅에 얼굴을 대고 엎드려
  alternatives_korean:
  - 땅에 엎드려 얼굴을 댔습니다
  - 얼굴을 땅에 대고 넘어졌습니다
  lexicon: נפל על פניו ארצה → 얼굴을 땅에 대고 엎드리다
  rationale: 관용적 신체 표현을 한국어 자연문으로 풀되, ‘얼굴’과 ‘땅’을 모두 남겨 절하는 자세의 강도를 보존했습니다.
- source_word: לְהִשְׁתַּחֲוֹת
  english_pob_choice: to bow down / to bow down before
  chosen_korean: 경배하였습니다
  alternatives_korean:
  - 절하였습니다
  - 엎드려 경배하였습니다
  lexicon: שחה/השתחוה → 경배하다
  rationale: 예배적 행위를 드러내는 본문이므로 ‘경배하다’를 택해, 단순 신체 동작보다 숭배의 의미를 분명히 했습니다.
theological_decisions:
- issue: ‘לִפְנֵי עֶלְיוֹן … קְדוֹשׁ יִשְׂרָאֵל’의 호칭 처리
  chosen_reading: 그들의 주권자 하나님, 지극히 높으신 이스라엘의 거룩하신 분
  alternative_readings:
  - 지극히 높으신 분
  - 이스라엘의 거룩하신 이
  rationale: 히브리어와 그리스어가 모두 최고신/주권자 호칭과 이스라엘의 거룩하신 분을 병기하므로, 두 호칭을 모두 살려 예배 대상의 두 측면을 드러냈습니다.
  doctrine_reference: 시라 50:17의 신적 호칭 이해
