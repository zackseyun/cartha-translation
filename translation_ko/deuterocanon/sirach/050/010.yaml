translation:
  language: ko
  text: 마치 열매가 가득한 무성한 올리브나무 같고, 마치 가지를 적시는 기름진 나무 같았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 ‘구름 속으로 솟는 사이프러스’로 읽습니다. 본문은 히브리어 카이로 게니자 증거를 따랐습니다.
    reason: alternative_reading
  - marker: b
    text: 희귀어 גַרְגַּר는 이 문맥에서 올리브 열매를 가리키는 것으로 보이며, 따라서 ‘열매가 가득한’으로 풀 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּזַיִת רַעֲנָן
  english_pob_choice: like a flourishing olive tree
  chosen_korean: 무성한 올리브나무 같고
  alternatives_korean:
  - 번성하는 올리브나무 같고
  - 싱싱한 올리브나무 같고
  lexicon: HALOT
  rationale: כְּ는 비교를, רַעֲנָן은 생기 있고 푸른 상태를 나타내므로 나무의 생동감을 살려 ‘무성한’으로 옮겼습니다.
- source_word: מָלֵא גַרְגַּר
  english_pob_choice: heavy with berries
  chosen_korean: 열매가 가득한
  alternatives_korean:
  - 열매들로 무거운
  - 알맹이로 가득한
  lexicon: HALOT
  rationale: גַרְגַּר는 이 문맥에서 올리브 열매를 가리키는 희귀어로 보이므로, 영어 POB의 단서를 따라 구체적 이미지를 유지하되 한국어에서는 자연스럽게 ‘열매가 가득한’으로 풀었습니다.
- source_word: וּכְעֵץ שָׁמֵן
  english_pob_choice: and like a rich tree
  chosen_korean: 기름진 나무 같았습니다
  alternatives_korean:
  - 풍성한 나무 같았습니다
  - 비옥한 나무 같았습니다
  - 기름나무 같았습니다
  lexicon: HALOT
  rationale: שָׁמֵן은 문자적으로 ‘기름진, 살찐, 풍성한’의 뜻이 있어, 단순한 경제적 ‘rich’보다 식물의 충실함을 드러내는 ‘기름진’이 더 स्रोत에 가깝습니다.
- source_word: מְרַוֶּה עָנָף
  english_pob_choice: drenching its branches
  chosen_korean: 가지를 적시는
  alternatives_korean:
  - 가지를 흠뻑 적시는
  - 가지에 물을 주는
  - 가지가 촉촉한
  lexicon: HALOT
  rationale: רוה는 ‘적시다, 흠뻑 젖게 하다’의 뜻이므로, 과장되지 않으면서도 생명력이 느껴지도록 ‘적시는’으로 옮겼습니다.
theological_decisions:
- issue: 그리스어 병행본문과 히브리어 증거의 우선순위
  chosen_reading: 히브리어 본문을 따라 올리브나무와 기름진 나무의 병행으로 옮겼습니다.
  alternative_readings:
  - 그리스어의 ‘구름 속으로 솟는 사이프러스’로 옮기는 읽기
  - 그리스어를 반영해 상록침엽수 이미지를 택하는 읽기
  rationale: 제공된 영어 POB가 히브리어 카이로 게니자 증거를 मुख्य 본문으로 따르고 있으며, 그리스어는 대체 읽기라는 주석이 달려 있으므로 본문은 히브리어 증거를 우선해야 합니다.
  doctrine_reference: 본문비평 원칙
- issue: ‘rich’의 의미를 재현하는 방식
  chosen_reading: ‘기름진’으로 옮겨 풍요와 생기라는 식물 이미지에 초점을 맞췄습니다.
  alternative_readings:
  - ‘풍성한’으로 중화하는 읽기
  - ‘부유한’으로 직역하는 읽기
  rationale: 여기서는 인간의 재산이 아니라 나무의 충실함을 묘사하므로, 한국어 독자가 오해하지 않도록 식물적 풍요를 드러내는 표현이 적절합니다.
  doctrine_reference: 시적 수사 이해
