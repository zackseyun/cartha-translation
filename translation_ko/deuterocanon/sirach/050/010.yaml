  text: like a flourishing olive tree heavy with berries[b][a], and like an rich tree drenching its branches.
  footnotes:
  - marker: a
    text: 'Greek: ''like a cypress rising into the clouds'' instead of Hebrew ''like a rich tree drenching its branches.'' The Hebrew Cairo Geniza witness is followed here as the primary source where extant.'
