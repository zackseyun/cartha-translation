lexical_decisions:
- source_word: וְאִשֵּׁי
  english_pob_choice: and the offerings of
  chosen_korean: 화제물
  alternatives_korean:
  - 불로 드리는 제물
  - 제물
  lexicon: HALOT
  rationale: 히브리어 אִשֵּׁי는 불로 드리는 제물을 가리킬 수 있으므로, 한국어에서는 제의적 성격을 분명히 하는 '화제물'을 택했습니다. 영어 POB가 본문에서 넓은 'offerings'를 택했지만, 히브리어의 제의적·불제사적 뉘앙스를 보존하는 것이 더 직접적입니다.
- source_word: יְהֹוָה
  english_pob_choice: the LORD
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: HALOT
  rationale: 본 프로젝트 기본 원칙에 따라 사중자를 '야훼'로 옮겼습니다. 영어 POB의 'the LORD'는 여기서 하나님의 고유명을 가리키므로, 한국어에서도 신학적·문헌학적 투명성을 위해 전통적 교회 표현보다 직접 음역을 유지했습니다.
- source_word: כָּל קְהַל יִשְׂרָאֵל
  english_pob_choice: all the assembly of Israel
  chosen_korean: 이스라엘 온 회중
  alternatives_korean:
  - 이스라엘의 온 회중
  - 이스라엘의 모든 회중
  - 이스라엘 온 총회
  lexicon: HALOT
  rationale: קהל은 공적 예배 문맥에서 '회중'이 자연스럽고, '온'을 앞세워 전체성을 살렸습니다. 영어의 'assembly'에 대응하면서도 한국어 문체에서 유려하게 읽히도록 정리했습니다.
theological_decisions:
- issue: 희생 제사의 구체성(불로 드리는 제물 vs. 일반 제물)
  chosen_reading: 화제물
  alternative_readings:
  - 제물
  - 불로 드리는 제물
  rationale: 히브리어 어근은 불제사적 의미를 담을 수 있으므로, 본문 핵심 이미지가 흐려지지 않도록 '화제물'로 구체화했습니다. 이는 영어 POB가 보다 넓은 'offerings'를 채택한 것보다 원문 보존을 우선한 선택입니다.
  doctrine_reference: '번역 원칙: 원문이 허용하는 긴장을 해소하지 말고, 제의적 의미를 드러내되 과도한 해석은 피함.'
