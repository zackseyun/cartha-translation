translation:
  language: ko
  text: 구름 사이에서 빛나는 별 같고, 절기 날들에는 둥근 보름달 같으니.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 병행본문은 ‘새벽별이 구름 한가운데에 있는 것처럼’이라고 읽습니다. 히브리어는 더 일반적으로 ‘구름들 사이에서 빛나는 별’로 되어 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: כְּכוֹכָב אוֹר
  english_pob_choice: Like a shining star
  chosen_korean: 빛나는 별 같고
  alternatives_korean:
  - 별 같고
  - 밝은 별 같고
  - 빛나는 별처럼
  lexicon: HALOT
  rationale: כוכב은 ‘별’로 옮기고, אוֹר는 단순한 ‘빛’보다 별의 발광 상태를 살리는 ‘빛나는’이 자연스럽습니다. 비교 접두 כ도 한국어의 ‘-같고’로 간결하게 반영했습니다.
- source_word: מִבֵּין עָבִים
  english_pob_choice: from among clouds
  chosen_korean: 구름 사이에서
  alternatives_korean:
  - 구름들 가운데서
  - 구름 사이로
  - 구름들 사이에서
  lexicon: HALOT
  rationale: בין + מן의 결합은 ‘~사이에서/가운데서’의 출현 이미지를 주므로, 구름 사이에서 드러나는 별의 시각적 대비를 살리는 표현을 택했습니다.
- source_word: וּכְיָרֵחַ מָלֵא
  english_pob_choice: and like the full moon
  chosen_korean: 둥근 보름달 같고
  alternatives_korean:
  - 보름달 같고
  - 가득 찬 달 같고
  - 만월 같고
  lexicon: HALOT
  rationale: ירח מלא는 ‘보름달’이 가장 자연스럽지만, מלא의 충만함을 살려 ‘둥근’을 덧붙여 시적 병행을 강화했습니다.
- source_word: בִּימֵי מוֹעֵד
  english_pob_choice: in the days of the feast
  chosen_korean: 절기 날들에는
  alternatives_korean:
  - 축제 날들에는
  - 절기 때에는
  - 정한 때에
  lexicon: HALOT
  rationale: מוֹעֵד는 ‘정한 때/절기’와 ‘절기(명절)’의 의미가 있으므로, 제의적·축제적 뉘앙스를 함께 살리는 ‘절기 날들’로 옮겼습니다.
theological_decisions:
- issue: מוֹעֵד의 의미를 ‘정한 때’로 일반화할지, ‘절기’로 구체화할지
  chosen_reading: ‘절기 날들’로 옮겨 문맥의 축제성을 드러냈습니다.
  alternative_readings:
  - 정한 때들에는
  - 명절 때에는
  rationale: 지혜문학적 비유이지만, 별과 보름달의 이미지가 축제·예식의 분위기와 잘 맞고, 영어 POB도 ‘feast’를 택했으므로 과도한 추상화보다 제의적 맥락을 드러내는 번역이 적절합니다.
  doctrine_reference: 'Translation philosophy: original-language primacy with contextual clarity'
