  rationale: 직역하면 난해한 관용구이므로, POB의 영어 판단처럼 ordered speech/composition의 의미를 살려 ‘표현의 달인’으로 옮겼습니다. 지나치게 문자적인 ‘바퀴/형태’ 이미지는 본문 의도에 덜 적합합니다.
