translation:
  language: ko
  text: 이 책은 이해에 대한 교훈과 표현의 달인에 관한 것입니다[a]. 시몬, 예수의 아들, 엘르아살의 아들, 시라의 아들에 의한 것입니다. 그는 마음에서 지혜를 쏟아냈습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 난해한 구는 ‘ordered speech/composition’ 계열로 이해될 수 있으나, 정확한 뉘앙스는 확정하기 어렵습니다.
    reason: lexical_alternative
  - marker: b
    text: 마지막 절은 히브리어 본문이 다소 불확실하지만, 그리스어 평행본문의 ‘그의 마음에서’와 ‘지혜를 쏟아냈다’가 뜻을 뒷받침합니다.
    reason: textual_variant
lexical_decisions:
- source_word: מוּסַר שֵׂכֶל
  english_pob_choice: Instruction in understanding
  chosen_korean: 이해에 대한 교훈
  alternatives_korean:
  - 이해의 훈련
  - 깨달음의 교훈
  lexicon: HALOT
  rationale: מוּסַר는 단순한 정보 전달보다 형성력 있는 교훈을 뜻하므로, 책의 서문/표제문맥에 맞게 ‘교훈’으로 두고 שֵׂכֶל은 ‘이해’로 옮겨 자연스러운 합성어를 만들었습니다.
- source_word: וּמוֹשֵׁל אוֹפַנִּים
  english_pob_choice: mastery of expression
  chosen_korean: 표현의 달인
  alternatives_korean:
  - 말의 조율
  - 문장의 운용
  lexicon: HALOT
  rationale: 직역하면 난해한 관용구이므로, POB의 영어 판단처럼 ordered speech/composition의 의미를 살려 ‘표현의 달인’으로 옮겼습니다. 지나치게 문자적인 ‘바퀴/형태’ 이미지는 본문 의도에 덜 적합합니다.
- source_word: נִיבַּע ... וַאֲשֶׁר הִבִּיעַ
  english_pob_choice: who poured forth ... and which he uttered
  chosen_korean: 마음에서 지혜를 쏟아냈습니다
  alternatives_korean:
  - 마음에서 지혜가 흘러나왔습니다
  - 마음으로부터 지혜를 쏟아냈습니다
  lexicon: HALOT
  rationale: 두 동사의 반복적 유출 이미지를 한국어에서도 유지하기 위해 ‘쏟아냈습니다’를 택했습니다. 영어 POB와 같이 종결부를 지혜의 풍성한 분출로 읽되, 한국어는 중복을 줄여 간결하게 정리했습니다.
- source_word: בִּפְתוֹר לְבָן
  english_pob_choice: from his heart
  chosen_korean: 마음에서
  alternatives_korean:
  - 그 마음에서
  - 마음으로부터
  lexicon: HALOT
  rationale: 마소라/제나자의 난해한 어형은 Greek parallel의 ἀπὸ καρδίας αὐτοῦ와 함께 읽어 ‘마음에서’로 옮겼습니다. 본문 의미를 흐리지 않으면서도 원문 긴장을 그대로 유지하는 선택입니다.
