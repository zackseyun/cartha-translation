translation:
  language: ko
  text: 이 책은 이해에 대한 교훈과 표현의 달인에 관한 것입니다[a]. 시몬, 예수의 아들, 엘르아살의 아들, 시라의 아들에 의한 것입니다. 그는 마음에서 지혜를 쏟아냈습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 난해한 구는 ‘ordered speech/composition’ 계열로 이해될 수 있으나, 정확한 뉘앙스는 확정하기 어렵습니다.
    reason: lexical_alternative
  - marker: b
    text: 마지막 절은 히브리어 본문이 다소 불확실하지만, 그리스어 평행본문의 ‘그의 마음에서’와 ‘지혜를 쏟아냈다’가 뜻을 뒷받침합니다.
    reason: textual_variant
