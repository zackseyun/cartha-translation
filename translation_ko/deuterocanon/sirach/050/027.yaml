  chosen_korean: 마음에서 지혜를 쏟아냈습니다
  alternatives_korean:
  - 마음에서 지혜가 흘러나왔습니다
  - 마음으로부터 지혜를 쏟아냈습니다
  lexicon: HALOT
  rationale: 두 동사의 반복적 유출 이미지를 한국어에서도 유지하기 위해 ‘쏟아냈습니다’를 택했습니다. 영어 POB와 같이 종결부를 지혜의 풍성한 분출로 읽되, 한국어는 중복을 줄여 간결하게 정리했습니다.
- source_word: בִּפְתוֹר לְבָן
