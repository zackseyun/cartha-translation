base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/050/020.yaml
  text: Then he came down and lifted up his hands over all the assembly of Israel[a], to give the blessing of Yahweh with his lips[b], and to glory in the name of Yahweh.
  footnotes:
  - marker: a
    text: 'Hebrew: ''and the blessing of the LORD on/with his lips''; the Greek parallel makes the sense explicit: ''to give blessing ... from his lips.'' The English follows that fuller sense.'
    reason: alternative_reading
  - marker: b
    text: Or 'to boast in the name of the LORD.' The verb can carry the sense of exulting or taking pride, and the Greek parallel supports this nuance.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 내려와서 이스라엘의 온 회중 위로 손을 들고, 입술로 야훼의 축복을 선포하며 야훼의 이름으로 자랑하였습니다[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 그가 이스라엘의 온 회중 위로 손을 들었다고 말합니다. 그리스어 평행본문은 이 몸짓이 축복을 주기 위한 것임을 더 분명하게 나타냅니다.
    reason: source_note
  - marker: b
    text: 히브리어의 표현은 압축되어 있으며, 그리스어 평행본문은 ‘축복을 주고’와 ‘그 이름으로 자랑하기 위해’라는 뜻을 분명히 합니다. 또는 ‘야훼의 이름 안에서 기뻐하다/자랑하다’로 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: קְהַל יִשְׂרָאֵל
  english_pob_choice: the assembly of Israel
  chosen_korean: 이스라엘의 온 회중
  alternatives_korean:
  - 이스라엘의 총회
  - 이스라엘의 모인 공동체
  lexicon: HALOT
  rationale: קהל은 공적으로 모인 집합체를 가리키므로, 교회적 색채가 강한 ‘회중’보다도 ‘온 회중’으로 공적·집합적 성격을 살렸습니다.
- source_word: וְנָשָׂא יָדָיו
  english_pob_choice: and lifted up his hands
  chosen_korean: 손을 들어 올렸습니다
  alternatives_korean:
  - 두 손을 들었습니다
  - 손을 치켜들었습니다
  lexicon: HALOT
  rationale: 복을 빌거나 축복할 때의 관용적 제스처를 한국어로 자연스럽게 옮기면서도, 몸짓의 형식을 유지했습니다.
- source_word: וּבִרְכַּת יְהֹוָה בִּשְׂפָתָיו
  english_pob_choice: to give the blessing of Yahweh with his lips
  chosen_korean: 그의 입술로 야훼의 복을 전하며
  alternatives_korean:
  - 야훼의 복을 그의 입술에 두며
  - 그의 입술에 야훼의 복이 있으며
  lexicon: HALOT
  rationale: 히브리어는 축복의 말을 입술로 선포하는 압축 표현이고, 그리스어 평행본문은 목적의 의미를 분명히 하므로 ‘전하며’로 풀어 자연스럽고도 근거 있게 옮겼습니다.
- source_word: וּבְשֵׁם יְהֹוָה הִתְפָּאֵר
  english_pob_choice: and to glory in the name of Yahweh
  chosen_korean: 야훼의 이름으로 자랑하였습니다
  alternatives_korean:
  - 야훼의 이름으로 영광을 돌렸습니다
  - 야훼의 이름으로 기뻐하였습니다
  lexicon: HALOT
  rationale: 히트파엘 הִתְפָּאֵר는 ‘자랑하다/자기를 영화롭게 하다’의 범위를 가지며, 그리스어 καυχᾶσθαι도 ‘자랑하다’의 의미를 지지하므로, 문맥의 승리감과 공개적 찬양을 살려 ‘자랑하였습니다’로 번역했습니다.
theological_decisions:
- issue: 야훼의 이름을 어떻게 옮길지
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 주
  rationale: 본문에 יְהֹוָה가 직접 나오므로, 이 판의 표준 원칙에 따라 고유한 언약 이름을 ‘야훼’로 유지했습니다.
  doctrine_reference: 'POB glossary: יהוה / YHWH → 야훼'
- issue: 히브리어 압축 구문을 그리스어 평행본문으로 보완할지
  chosen_reading: ‘그의 입술로 야훼의 복을 전하며’
  alternative_readings:
  - ‘야훼의 복이 그의 입술에 있으며’
  - ‘야훼의 복을 그의 입술로’
  rationale: 히브리어는 서술동사가 생략된 압축형이지만, 그리스어 δοῦναι εὐλογίαν은 축복을 선포하는 의도를 분명히 하므로, 의미를 과도하게 확장하지 않는 범위에서 목적적·행위적 뜻을 드러냈습니다.
  doctrine_reference: 'Source parallel: LXX Sirach 50:20'
