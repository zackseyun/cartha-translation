  - severity: medium
    issue: ‘모든 것에 대해 힘을 발휘할 것입니다’가 πρὸς πάντα ἰσχύσει를 부자연스럽게 번역함
    rationale: ἰσχύσει는 여기서 힘을 행사하는 특정 행동보다 강함·역량을 나타냅니다. ‘모든 일에서 강할 것입니다’가 문법적 압축성과 의미를 더 잘 보존합니다.
  - severity: low
    issue: 본문의 ‘그의 걸음’이 ἴχνος의 길/자취 비유를 충분히 명료하게 전달하지 못함
    rationale: ‘걸음’은 발걸음이라는 행위로도 읽혀 ‘빛이 그의 걸음이다’가 다소 어색합니다. ‘길’로 자연스럽게 옮기고 문자적 의미는 각주로 보존하는 편이 좋습니다.
