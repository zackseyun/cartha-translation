lexical_decisions:
- source_word: ἐὰν γὰρ αὐτὰ ποιήσῃ
  english_pob_choice: For if one does these things
  chosen_korean: 그가 이 일을 하면
  alternatives_korean:
  - 그가 이 일들을 하면
  - 그가 그것들을 행하면
  lexicon: LSJ
  rationale: 조건절의 일반적 의미를 살리되, 앞선 가르침을 가리키는 αὐτὰ를 자연스럽게 ‘이 일’로 옮겼습니다.
- source_word: πρὸς πάντα ἰσχύσει
  english_pob_choice: he will prevail in everything
  chosen_korean: 그는 모든 것에 대해 힘을 발휘할 것입니다
  alternatives_korean:
  - 그는 모든 일에서 이길 것입니다
  - 그는 모든 것에 대해 강해질 것입니다
  lexicon: LSJ
  rationale: ἰσχύσει의 ‘강하다/유효하다’의 힘을 살리면서, πρὸς πάντα의 포괄성을 ‘모든 것에 대해’로 반영했습니다.
- source_word: φῶς Κυρίου
  english_pob_choice: the light of the Lord
  chosen_korean: 주님의 빛
  alternatives_korean:
  - 주님의 광명
  - 주님의 밝은 빛
  lexicon: LSJ
  rationale: φῶς의 기본 뜻을 직역해 ‘빛’으로 옮기고, Κυρίου는 문맥상 주님으로 표준화했습니다.
- source_word: τὸ ἴχνος αὐτοῦ
  english_pob_choice: his path
  chosen_korean: 그의 걸음
  alternatives_korean:
  - 그의 발자취
  - 그의 발걸음
  - 그의 흔적
  lexicon: LSJ
  rationale: ἴχνος의 문자적 의미인 ‘발자국/발자취’와 길의 비유를 함께 살리기 위해, 너무 추상적인 ‘길’보다 ‘걸음’을 택했습니다.
theological_decisions:
- issue: τὸ ἴχνος αὐτοῦ의 비유 처리
  chosen_reading: 주님의 빛이 사람의 삶의 진행과 걸음을 비추고 인도하는 뜻으로 이해했습니다.
  alternative_readings:
  - 주님의 빛이 그의 발자취 자체라는 뜻
  - 주님의 빛이 그의 흔적을 남긴다는 뜻
  rationale: 지혜문맥에서 자연스러운 인도 비유를 살리되, ἴχνος의 구체적 이미지가 사라지지 않도록 ‘걸음’으로 보존했습니다.
  doctrine_reference: 비유적 표현의 다의성을 보존하고 한 가지로 과도하게 평탄화하지 않습니다.
