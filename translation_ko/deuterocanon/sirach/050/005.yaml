base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/050/005.yaml
  text: How splendid he was when he looked out from the tent[b][a], when he came out from the house of the curtain.
  footnotes:
  - marker: a
    text: The Greek parallel reads, 'How he was glorified in the turning/circuit of the people,' instead of the Hebrew 'when he looked out from the tent.' This suggests a textual divergence in the first line.
    reason: textual_variant
  - marker: b
    text: Or 'veil' for 'curtain' (Hebrew parokhet; Greek katapetasma), the screen before the inner sanctuary.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 장막에서 바라볼 때, 곧 성소의 휘장 문에서 나올 때에 얼마나 빛났습니까.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 평행본문은 첫 행을 ‘백성의 회전/행렬 가운데서 영화롭게 되었다’로 읽으며, 히브리어의 ‘장막에서 바라볼 때’와 다릅니다.
    reason: textual_variant
  - marker: b
    text: ‘휘장’은 성소 앞의 가림막을 가리키며, 히브리어 파로케트(parokhet)와 그리스어 카타페타스마(katapetasma)에 해당합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה נֶהְדַּר
  english_pob_choice: How splendid
  chosen_korean: 얼마나 빛났습니까
  alternatives_korean:
