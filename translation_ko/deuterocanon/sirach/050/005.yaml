  rationale: 히브리어 본문을 우선하여 장막(אֹהֶל)과 휘장(פָּרֹכֶת)의 이미지를 유지했습니다. 원문에 없는 ‘문’과 본문상 단정적인 ‘성소’를 삭제하고, ‘휘장이 있는 집’으로 בֵּית הַפָּרֹכֶת의 구성 관계를 자연스럽게 표현했습니다. 그리스어와 히브리어의 첫 절 차이는 각주에서만 알리고, 그리스어의 의미 범위도 확정하지 않았습니다. 각주 표지는 각각 해당 구절 바로 뒤에 두었습니다.
