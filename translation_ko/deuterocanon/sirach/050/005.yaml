  lexicon: HALOT
  rationale: 감탄문 מַה נֶהְדַּר의 시각적·존귀한 뉘앙스를 한국어의 자연스러운 감탄으로 옮기되, 지나치게 교회식 어휘로 굳히지 않았습니다.
- source_word: בְּהַשְׁגִּיחוֹ
  english_pob_choice: when he looked out
  chosen_korean: 장막에서 바라볼 때
  alternatives_korean:
  - 장막 밖으로 모습을 드러낼 때
  - 장막에서 내다볼 때
  - 장막에서 나타날 때
  lexicon: HALOT
  rationale: השגיח의 ‘바라보다/내다보다’ 의미를 살려, 출현 장면의 시각적 강조를 유지했습니다.
- source_word: מֵאֹהֶל
  english_pob_choice: from the tent
  chosen_korean: 장막에서
  alternatives_korean:
  - 성막에서
  - 성소에서
  - 천막에서
  lexicon: HALOT
  rationale: 히브리어의 직역 요소를 살리면서, 본문이 예배 공간을 가리키는 문맥상 한국어에서 자연스러운 ‘장막’을 택했습니다.
- source_word: מִבֵּית הַפָּרֹכֶת
  english_pob_choice: from the house of the curtain
  chosen_korean: 성소의 휘장 문에서
  alternatives_korean:
  - 휘장 앞에서
  - 휘장의 집에서
  - 휘장 안에서
  lexicon: HALOT
  rationale: פָּרֹכֶת를 ‘휘장’으로, בית를 공간 표지로 이해해 성소 내부 출입을 드러내는 표현으로 옮겼습니다. 직역형인 ‘휘장의 집’은 한국어에서 어색하여 의미를 보존하는 방향으로 다듬었습니다.
theological_decisions:
- issue: 히브리어의 장막/휘장 이미지와 그리스어 평행본문의 차이
  chosen_reading: 주 본문은 히브리어를 따라 ‘장막’과 ‘성소의 휘장’을 함께 살리고, 그리스어가 제시하는 다른 첫 절의 의미는 본문 안에서 평준화하지 않았습니다.
  alternative_readings:
  - 그가 백성의 행렬 가운데서 영화롭게 되었을 때
  - 그가 성소에서 나타났을 때
  rationale: 출처 간 차이를 지워버리면 본문의 전승 흔적이 사라집니다. 히브리어 본문의 예배 공간 이미지를 보존하는 것이 문맥상 더 적절합니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
