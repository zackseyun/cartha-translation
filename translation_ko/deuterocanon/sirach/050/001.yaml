base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/050/001.yaml
  text: Simon son of Yohanan the priest was the glory of his brothers and the splendor of his people[a]; in his generation the house was repaired[b], and in his days the temple was strengthened.
  footnotes:
  - marker: a
    text: 'Greek parallel: ''Simon son of Onias, the great priest'' (or ''high priest''). The Hebrew witness here reads ''Simon son of Yohanan the priest.'''
    reason: alternative_reading
  - marker: b
    text: Or 'the house was attended to/restored.' The Hebrew verb can denote being cared for or repaired; the Greek parallel points specifically to building work on the house.
    reason: lexical_alternative
translation:
  language: ko
  text: 제사장 요하난의 아들 시몬은 그의 형제들 가운데 위대하였으며 그의 백성의 영광이었습니다[a]. 그가 살던 세대에 그 집은 수리되었고[b], 그의 시대에 성전은 견고해졌습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 병행본문에는 ‘오니아스의 아들 시몬, 위대한 제사장’(또는 ‘대제사장’)으로 나옵니다. 이 히브리어 증인은 여기서 ‘요하난의 아들 시몬, 제사장’이라고 읽습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘그 집은 돌봄을 받았다/복구되었다.’ 이 동사는 돌봄이나 수리를 가리킬 수 있으며, 그리스어 병행본문은 건축 보수 작업을 더 분명히 시사합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: גְּדוֹל אֶחָיו
  english_pob_choice: was great among his brothers
  chosen_korean: 그의 형제들 가운데 위대했고
  alternatives_korean:
  - 그의 형제들 가운데 큰 사람이었고
  - 형제들보다 뛰어났고
  lexicon: HALOT
  rationale: 히브리어 גְּדוֹל אֶחָיו는 직역하면 ‘그의 형제들 가운데 큰’이므로, 한국어에서는 관계를 자연스럽게 살려 ‘가운데 위대했고’로 옮겼습니다.
- source_word: תִפְאֶרֶת עַמּוֹ
  english_pob_choice: the splendor of his people
  chosen_korean: 그의 백성의 영광이었습니다
  alternatives_korean:
  - 그의 백성의 아름다움이었습니다
  - 그의 백성의 splendor였습니다
  lexicon: HALOT
  rationale: תִפְאֶרֶת은 ‘영광/아름다움/화려함’의 범위를 가지며, 전통적 교회어보다 원문의 높임과 병렬을 살려 ‘영광’으로 옮겼습니다.
- source_word: נִפְקַד הַבָּיִת
  english_pob_choice: the house was repaired
  chosen_korean: 그 집은 수리되었고
  alternatives_korean:
  - 그 집은 돌봄을 받았고
  - 그 집은 보수되었고
  - 그 집은 회복되었고
  lexicon: HALOT
  rationale: פקד의 니팔은 ‘돌봄을 받다/살피다’에서 ‘수리되다’까지 가능하지만, 문맥상 건축 복원과 맞물려 있는 점을 반영해 한국어에서는 간명하게 ‘수리되다’로 옮겼습니다.
- source_word: חֻזַּק
  english_pob_choice: was strengthened
  chosen_korean: 성전은 견고해졌습니다
  alternatives_korean:
  - 성전은 강화되었습니다
  - 성전은 굳게 세워졌습니다
  lexicon: HALOT
  rationale: חזק의 수동은 ‘강해지다/견고해지다’의 뜻이므로, 건물 문맥에 맞는 ‘견고해졌습니다’를 택했습니다.
theological_decisions:
- issue: 시몬의 직함과 본문 전승 차이
  chosen_reading: 본문은 ‘그의 형제들 가운데 위대했고’로 시작하고, 직함은 단순히 ‘시몬’으로 제시합니다.
  alternative_readings:
  - 그리스어 병행본문의 ‘위대한 제사장’ 또는 ‘대제사장’
  - 히브리어의 ‘제사장’
  rationale: 히브리어 본문과 그리스어 병행본문 사이에 시몬의 신분 표현 차이가 있으므로, 본문은 히브리어를 따르되 역사적·해석적 긴장은 각주로 보존합니다.
  doctrine_reference: 원문 우선과 전승 긴장 보존
