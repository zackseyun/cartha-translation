  - marker: b
    text: 그리스어 본문은 또한 ‘우리 시대 이스라엘에, 옛날처럼 평화가 있기를’이라는 내용을 덧붙입니다.
    reason: textual_variant
lexical_decisions:
- source_word: יִתֵּן
  english_pob_choice: May he give
  chosen_korean: 주시고
  alternatives_korean:
  - 주십시오
  - 주게 하십시오
  lexicon: HALOT
  rationale: 축복의 청원문에서 히브리어 완료/미완료형의 기원적 힘을 한국어 명령·청원형으로 살렸습니다. 앞뒤 문맥상 직접적인 서술 미래보다 기원의 뉘앙스가 더 강합니다.
- source_word: חָכְמַת לֵבָב
  english_pob_choice: wisdom of heart
  chosen_korean: 마음의 지혜
  alternatives_korean:
  - 심장의 지혜
  - 마음의 총명
  lexicon: HALOT
  rationale: 히브리어 본문을 따라 ‘heart’를 단순 감정이 아니라 내적 분별의 자리로 옮겼습니다. ‘마음의 지혜’는 직역성을 유지하면서도 한국어로 자연스럽습니다.
- source_word: וִיהִי שָׁלוֹם
  english_pob_choice: and may there be peace
  chosen_korean: 평강이 있게 하십시오
  alternatives_korean:
  - 평화가 있게 하십시오
  - 평강이 있기를 바랍니다
  lexicon: HALOT
  rationale: 축복 형식의 기원문이므로 선언문보다 청원형이 적절합니다. ‘평강’은 project default를 따르며, 여기서는 개인 간의 화목과 공동체적 평안을 모두 담을 수 있습니다.
- source_word: בֵּינֵיכֶם
  english_pob_choice: among you
  chosen_korean: 여러분 가운데
  alternatives_korean:
  - 여러분 사이에
  - 너희 가운데
  lexicon: HALOT
  rationale: 복수 대상 사이의 관계성을 자연스럽게 드러내기 위해 ‘가운데’를 택했습니다. ‘사이’보다 공동체적 범위를 부드럽고 직접적으로 전달합니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행본의 차이
  chosen_reading: 본문에는 히브리어의 ‘마음의 지혜’와 ‘여러분 가운데 평강’을 따랐습니다.
  alternative_readings:
  - 그리스어의 ‘마음의 기쁨’으로 읽기
  - 그리스어 확장 ‘우리의 날들에 이스라엘 가운데…’를 본문에 반영하기
  rationale: 이 구절은 보존된 히브리어 본문이 명확하므로 이를 मुख्य 본문으로 삼고, 그리스어 차이는 본문과 섞지 않는 것이 원문 우선 원칙에 부합합니다. 따라서 그리스어는 대조용 변이로만 취급합니다.
  doctrine_reference: 'PHILOSOPHY.md: 히브리어가 보존된 지혜문학은 히브리어 본문 우선, 그리스어 차이는 변이로 주석 처리'
