translation:
  language: ko
  text: 그리고 노래가 소리를 내었고, 무리 위에 그의 등불을 정돈했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 병행본문은 “시편 노래하는 이들이 자기 목소리로 찬양했고, 매우 가득 찬 집에서 선율이 아름답게 되었다”로 읽습니다. 이는 히브리어 둘째 행이 본문상 난해하거나 다른 전승을 반영할 수 있음을 시사합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּתֵּן הַשִּׁיר קוֹלוֹ
  english_pob_choice: And the song gave forth its voice
  chosen_korean: 그리고 노래가 자기 목소리를 내었고
  alternatives_korean:
  - 그리고 노래가 소리를 내었고
  - 그리고 노래가 목소리를 높였고
  - 그리고 노래가 울려 퍼졌고
  lexicon: HALOT
  rationale: נתן with קול is the idiom of producing or giving forth a sound, so ‘목소리를 내다’는 Hebrew idiom을 자연스럽게 살리면서도 과도하게 풀지 않습니다.
- source_word: קוֹלוֹ
  english_pob_choice: its voice
  chosen_korean: 자기 목소리
  alternatives_korean:
  - 그 목소리
  - 그 소리
  - 자기 소리
  lexicon: HALOT
  rationale: 문법상 단수 남성 접미사에 맞추되, 한국어에서는 무생물 주어의 소유를 ‘자기’로 처리해 원문 관계를 분명히 했습니다.
- source_word: הֲמּוֹן
  english_pob_choice: the multitude
  chosen_korean: 무리
  alternatives_korean:
  - 무리들
  - 군중
  - 큰 모임
  lexicon: HALOT
  rationale: הָמוֹן은 군중/무리를 뜻하므로, 예배 장면의 집합성을 유지하면서도 한국어에서 지나치게 거창하지 않은 ‘무리’를 택했습니다.
- source_word: הֶעֱרִיכוּ נֵרוֹ
  english_pob_choice: they set his lamp in order
  chosen_korean: 그들의 등불을 정렬했습니다
  alternatives_korean:
  - 그들의 등불을 정돈했습니다
  - 그의 등불을 정렬했습니다
  - 그들의 등불을 배열했습니다
  lexicon: HALOT
  rationale: ערך의 Hifil은 배열하다/정렬하다의 뜻을 가지므로, 의례적 배치를 떠올리게 하는 ‘정렬했습니다’를 택했습니다. 말미의 대명사 처리와 문장 흐름은 본문의 난해함을 드러내기 위해 보수적으로 유지했습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행본문의 불일치
  chosen_reading: 주본문은 현존 히브리어를 따르되, 난해한 두 번째 행을 무리한 조화 없이 그대로 옮겼습니다.
  alternative_readings:
  - 그리스어를 따라 ‘그리고 그들은 자기 목소리로 찬양했고, 매우 가득 찬 집에서 선율이 달콤해졌습니다’로 옮길 수 있습니다.
  rationale: 시락서는 히브리어가 남아 있는 경우 그 히브리어를 우선하되, 여기서는 그리스어가 상당히 다른 전승을 보여 주므로 본문 불확실성을 지우지 않는 번역이 필요합니다.
  doctrine_reference: 'PHILOSOPHY.md: translate from Hebrew where it survives; preserve textual uncertainty honestly.'
