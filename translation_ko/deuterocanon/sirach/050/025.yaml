translation:
  language: ko
  text: 두 민족을 두고 내 영혼은 역겨워하였고, 셋째는 백성이 아닙니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 병행본은 “그리고 셋째는 민족이 아니다”로 읽습니다. 히브리어는 여기서 “백성”을 사용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּשְׁנֵי גוֹיִם / ἐν δυσὶν ἔθνεσιν
  english_pob_choice: with two nations
  chosen_korean: 두 민족을 두고
  alternatives_korean:
  - 두 민족에 대해
  - 두 민족과 함께
  lexicon: HALOT
  rationale: 전치사 ב/ἐν의 관계를 한국어에서는 자연스러운 목적격·대상 표현으로 옮겨, 두 민족을 향한 혐오의 방향성을 살렸습니다.
- source_word: קָצָה נַפְשִׁי / προσώχθισεν ἡ ψυχή μου
  english_pob_choice: my soul is disgusted
  chosen_korean: 내 영혼은 역겨워하였고
  alternatives_korean:
  - 내 영혼은 혐오하였고
  - 나는 역겨워하였고
  - 내 영혼은 싫어하였고
  lexicon: HALOT
  rationale: נפש/ψυχή를 유지하되, קָצָה의 강한 혐오·역겨움의 뉘앙스를 살리기 위해 '역겨워하다'를 택했습니다. 시적 1인칭을 보존하면서도 한국어로는 능동 서술이 자연스럽습니다.
- source_word: וְהַשְּׁלִישִׁית / τὸ τρίτον
  english_pob_choice: the third
  chosen_korean: 셋째는
  alternatives_korean:
  - 세 번째는
  - 그 셋째는
  lexicon: HALOT
  rationale: 문맥상 생략된 '민족/백성'에 걸리는 서수 표현이므로, 한국어에서는 간결하게 '셋째는'으로 처리해 함축을 보존했습니다.
- source_word: אִינֶנּוּ עָם / οὐκ ἔστιν ἔθνος
  english_pob_choice: is not a people
  chosen_korean: 백성이 아닙니다
  alternatives_korean:
  - 민족이 아닙니다
  - 한 백성이 아닙니다
  lexicon: HALOT
  rationale: 히브리어 עָם의 집합적 의미를 따라 '백성'을 택했습니다. 그리스어 병행은 '민족'이지만, 본문이 살아 있는 히브리어를 우선해 POB의 영문 결정을 한국어로 반영했습니다.
theological_decisions:
- issue: 히브리어 '영혼'을 한국어에서 그대로 유지할지, 단순 1인칭으로 풀지 여부
  chosen_reading: '''내 영혼''을 본문에 유지했습니다.'
  alternative_readings:
  - 나는 역겨워하였습니다
  - 나는 혐오하였습니다
  rationale: 시적 표현의 결을 살리고 נפש/ψυχή의 직접 대응을 보존하기 위해 1인칭 일반화보다 '영혼'을 유지했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 6
- issue: 마지막 절의 '민족'과 '백성' 가운데 어느 쪽을 본문에 둘지 여부
  chosen_reading: 본문은 '백성'으로 두고, 그리스어의 '민족'은 별도 주석으로 보존하지 않았습니다.
  alternative_readings:
  - 민족이 아닙니다
  rationale: 이 절의 우선 본문은 신뢰도 높은 히브리어 전승이므로 עָם의 '백성'을 따르는 것이 source-grounded합니다. 그리스어 병행의 차이는 본문보다 번역 대안으로 처리하는 것이 적절합니다.
  doctrine_reference: PHILOSOPHY.md 'What we are translating'; DOCTRINE.md §Translation philosophy 1, 5
