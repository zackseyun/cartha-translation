base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/050/024.yaml
  text: May his mercy remain faithful with Shimon[a], and may he establish for him the covenant of Phinehas[b], which shall not be cut off from him or from his offspring as long as the days of heaven endure.
  footnotes:
  - marker: a
    text: 'Greek parallel: ''Entrust his mercy with us, and in his days may he redeem us.'' This differs substantially from the extant Hebrew, which speaks of Shimon and the covenant of Phinehas.'
    reason: alternative_reading
  - marker: b
    text: '''The covenant of Phinehas'' alludes to the enduring priestly covenant in Numbers 25:12–13.'
    reason: cross_reference
translation:
  language: ko
  text: 그의 자비가 시몬[a]과 함께 변함없이 있기를 바라며, 그가 시몬을 위하여 피느하스의 언약[b]을 세우시기를 바랍니다. 그 언약은 하늘의 날들이 이어지는 동안 시몬에게서나 그의 자손에게서 끊어지지 않을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 병행본문은 “그의 자비를 우리에게 맡기시고, 그의 날들에 우리를 구원하시기를”이라고 전합니다. 이는 시몬과 피느하스의 언약을 말하는 현존 히브리어 본문과 크게 다릅니다.
    reason: alternative_reading
  - marker: b
    text: ‘피느하스의 언약’은 민수기 25장 12–13절에 나오는 지속적인 제사장 언약을 가리킵니다.
    reason: cross_reference
lexical_decisions:
- source_word: יֵאָמֵן
  english_pob_choice: remain faithful
  chosen_korean: 변함없이 있기를 바라며
  alternatives_korean:
  - 견고하게 되기를 바라며
  - 신실하게 남기를 바라며
  - 확증되기를 바라며
  lexicon: HALOT
  rationale: אמן의 니팔 계열이 지닌 ‘견고해지다/신실하게 되다’의 뜻을 한국어에서 자연스럽게 살리기 위해 직역적 ‘확증되다’보다 관계적·지속적 뉘앙스의 표현을 택했습니다.
- source_word: חַסְדּוֹ
  english_pob_choice: his mercy
  chosen_korean: 그의 자비
  alternatives_korean:
  - 그의 인자
  - 그의 언약적 사랑
  - 그의 은혜
  lexicon: HALOT
  rationale: 히브리어 חסד는 언약적 충성의 뉘앙스를 가지지만, 본문과 병행하는 영어 POB의 ‘mercy’를 고려해 한국어에서는 가장 직접적인 ‘자비’를 사용하되, 문맥상 지속성과 신의가 드러나도록 했습니다.
- source_word: בְּרִית פִּינְחָס
  english_pob_choice: the covenant of Phinehas
  chosen_korean: 피느하스의 언약
  alternatives_korean:
  - 피느하스와의 언약
  - 피느하스의 계약
  lexicon: HALOT
  rationale: 고유한 성경 인물명은 음역을 따르고, בְּרִית는 관계적 ‘언약’으로 옮겨 민수기 25:12–13을 가리키는 전승적 표현을 보존했습니다.
- source_word: אֲשֶׁר לֹא יִכָּרֵת
  english_pob_choice: which shall not be cut off
  chosen_korean: 그것은 … 끊어지지 않을 것입니다
  alternatives_korean:
  - 그것은 … 잘려 없어지지 않을 것입니다
  - 그것은 … 끊기지 않을 것입니다
  lexicon: HALOT
  rationale: כרת의 문자적 이미지인 ‘끊다/자르다’를 한국어의 자연스러운 ‘끊어지다’로 옮겨 언약 문맥의 지속 불가침성을 살렸습니다.
- source_word: כִּימֵי שָׁמָיִם
  english_pob_choice: as long as the days of heaven endure
  chosen_korean: 영원한 하늘의 날들처럼
  alternatives_korean:
  - 하늘의 날들처럼
  - 하늘의 날이 지속되는 동안
  lexicon: HALOT
  rationale: 관용구가 장구한 지속을 뜻하므로, 문자 이미지를 유지하면서도 한국어에서 시간적 무한성을 드러내는 표현으로 옮겼습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행본문의 관계
  chosen_reading: 본문은 현존 히브리어를 따르되, חסד를 ‘자비’로 옮길 때 그리스어 ἔλεος의 대응을 참고했습니다.
  alternative_readings:
  - 그리스어에 따라 ‘그가 그의 자비를 우리에게 맡기시고’로 옮김
  rationale: 시락서는 히브리어가 보존된 경우 히브리어를 우선하는 원칙에 따라 번역하되, 병행 그리스어가 어휘 선택에 주는 신호는 반영했습니다.
  doctrine_reference: 'PHILOSOPHY.md: translate from Hebrew where Sirach Hebrew survives; original-language primacy over translation tradition.'
