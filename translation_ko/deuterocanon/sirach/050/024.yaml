  source_fidelity: 현존 히브리어를 우선한 본문의 큰 방향은 적절합니다. 다만 원문의 두 청원형 동사를 한국어에서 더 분명히 드러내고, ‘그를 위하여’ 및 뒤의 대명사가 시몬을 가리킴을 명시하는 편이 정확합니다. כִּימֵי שָׁמָיִם에는 ‘영원한’이라는 단정적 수식을 덧붙이기보다 하늘의 날들이 지속되는 기간이라는 이미지를 보존하는 것이 좋습니다.
  naturalness: 초안의 ‘있기를 바라며’와 ‘세우셔서’의 연결은 두 번째 청원이 결과절처럼 들리며, ‘세우셔서’는 원문의 청원형과 맞지 않습니다. 두 청원을 병렬로 ‘...있기를 바라며, ...세우시기를 바랍니다’로 표현하면 현대 표준 한국어 합쇼체로 자연스럽습니다.
