- from: 그의 자비가 시몬과 함께 변함없이 있기를 바라며, 그를 위하여 피느하스의 언약을 세우셔서 — 그것은 그에게서나 그의 자손에게서 영원한 하늘의 날들처럼 끊어지지 않을 것입니다.[a][b]
  to: 그의 자비가 시몬[a]과 함께 변함없이 있기를 바라며, 그가 시몬을 위하여 피느하스의 언약[b]을 세우시기를 바랍니다. 그 언약은 하늘의 날들이 이어지는 동안 시몬에게서나 그의 자손에게서 끊어지지 않을 것입니다.
  rationale: 히브리어 יֵאָמֵן과 וְיָקֶם의 병렬 청원을 한국어 기원문으로 분명하게 옮겼습니다. ‘그를 위하여’와 ‘그에게서’의 지시 대상을 시몬으로 밝혀 한국어의 대명사 모호성을 줄였고, כִּימֵי שָׁמָיִם은 ‘영원한’이라는 해석적 수식 없이 지속의 비유를 살렸습니다. 각주 내용은 유지하되 각각 시몬과 피느하스의 언약에 표지를 배치하도록 수정했습니다.
  reviewer_model: gpt-5.6-terra
