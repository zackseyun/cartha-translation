base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/050/015.yaml
  text: Then the sons of Aaron, the priests, would raise a shout with hammered trumpets.
  footnotes:
  - marker: a
    text: Greek has a longer parallel here, describing the priest extending his hand for the libation and pouring out the blood of the grape at the altar as a pleasing aroma to the Most High, the King of all. The Hebrew witness preserved here contains only the trumpet acclamation line.
    reason: textual_variant
  - marker: b
    text: Or 'would sound a blast with hammered trumpets.' The Hebrew verb can denote a loud acclamation or signal-shout, and in this context it is expressed through the trumpets.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 아론의 아들들, 곧 제사장들이 두드린 나팔로 환호를 올렸습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 희랍어 전승은 이곳에 제사장이 손을 내밀어 전제를 드리고, 포도주의 피를 제단에 쏟아 올리며, 지극히 높으신 만왕께 향기로운 냄새가 되게 하는 더 긴 대목을 담고 있습니다. 여기의 히브리어 전승은 나팔 환호만 보존합니다.
    reason: textual_variant
  - marker: b
    text: 또는 ‘두드린 나팔로 소리쳤습니다.’ 히브리어 동사는 큰 환호나 신호성 외침을 가리킬 수 있으며, 이 문맥에서는 나팔을 통해 나타난 소리로 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  english_pob_choice: Then
  chosen_korean: 그때
  alternatives_korean:
  - 그런 다음
  - 그리하여
  lexicon: HALOT
  rationale: 장면 전환을 나타내는 시간 표지로, 한국어에서는 자연스러운 서사 연결인 ‘그때’가 가장 간결합니다.
- source_word: יָרִיעוּ
  english_pob_choice: would raise a shout
  chosen_korean: 환호를 올렸습니다
  alternatives_korean:
  - 소리를 질렀습니다
  - 외쳤습니다
  - 환성을 올렸습니다
  lexicon: HALOT
  rationale: שורש רוע/ריע의 큰 외침·환호의 의미를 살리되, 제의 맥락에서 단순한 비명보다 ‘환호’가 어울립니다.
- source_word: בְּנֵי אֲהַרֹן / הַכֹּהֲנִים
  english_pob_choice: the sons of Aaron, the priests
  chosen_korean: 아론의 아들들, 곧 제사장들
  alternatives_korean:
  - 아론의 아들들, 제사장들
  - 아론 자손인 제사장들
  lexicon: HALOT
  rationale: 족속-직분을 병렬로 보존하기 위해 ‘곧’을 넣어 apposition을 드러냈습니다.
- source_word: בַּחֲצֹצְרוֹת מִקְשֶׁה
  english_pob_choice: with hammered trumpets
  chosen_korean: 두드린 나팔로
  alternatives_korean:
  - 두드려 만든 나팔로
  - 망치로 두드려 만든 나팔로
  lexicon: HALOT
  rationale: חצוצרות는 제의용 금속 나팔이고 מִקְשֶׁה는 두드려 만든 금속 공예를 가리키므로, 관용적으로는 ‘두드린 나팔’이 가장 압축적입니다.
theological_decisions:
- issue: 히브리어 본문과 더 긴 희랍어 평행문의 관계
  chosen_reading: 현존 히브리어의 나팔 환호문만 본문으로 옮기고, 희랍어의 제사 행위 세부는 본문에 들이지 않았습니다.
  alternative_readings:
  - 희랍어의 부어 드림과 피의 이미지까지 포함한 확장 번역
  rationale: 이 절의 보존된 히브리어가 더 짧고 직접적이므로, 원문 증거를 우선해 불필요한 확대를 피했습니다.
  doctrine_reference: 'PHILOSOPHY.md: 히브리어가 보존된 곳에서는 히브리어를 우선하고, 평행문은 배경 확인에만 사용'
