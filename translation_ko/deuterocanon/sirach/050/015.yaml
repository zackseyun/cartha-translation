  - 외쳤습니다
  - 환성을 올렸습니다
  lexicon: HALOT
  rationale: שורש רוע/ריע의 큰 외침·환호의 의미를 살리되, 제의 맥락에서 단순한 비명보다 ‘환호’가 어울립니다.
- source_word: בְּנֵי אֲהַרֹן / הַכֹּהֲנִים
  english_pob_choice: the sons of Aaron, the priests
  chosen_korean: 아론의 아들들, 곧 제사장들
  alternatives_korean:
  - 아론의 아들들, 제사장들
  - 아론 자손인 제사장들
  lexicon: HALOT
  rationale: 족속-직분을 병렬로 보존하기 위해 ‘곧’을 넣어 apposition을 드러냈습니다.
- source_word: בַּחֲצֹצְרוֹת מִקְשֶׁה
  english_pob_choice: with hammered trumpets
  chosen_korean: 두드린 나팔로
  alternatives_korean:
  - 두드려 만든 나팔로
  - 망치로 두드려 만든 나팔로
  lexicon: HALOT
  rationale: חצוצרות는 제의용 금속 나팔이고 מִקְשֶׁה는 두드려 만든 금속 공예를 가리키므로, 관용적으로는 ‘두드린 나팔’이 가장 압축적입니다.
theological_decisions:
- issue: 히브리어 본문과 더 긴 희랍어 평행문의 관계
  chosen_reading: 현존 히브리어의 나팔 환호문만 본문으로 옮기고, 희랍어의 제사 행위 세부는 본문에 들이지 않았습니다.
  alternative_readings:
  - 희랍어의 부어 드림과 피의 이미지까지 포함한 확장 번역
  rationale: 이 절의 보존된 히브리어가 더 짧고 직접적이므로, 원문 증거를 우선해 불필요한 확대를 피했습니다.
  doctrine_reference: 'PHILOSOPHY.md: 히브리어가 보존된 곳에서는 히브리어를 우선하고, 평행문은 배경 확인에만 사용'
