translation:
  language: ko
  text: 그가 제단에서 섬기는 일을 마치고, 지극히 높으신 분의 제물의 배열을 정비할 때까지였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 ‘지극히 높으신 전능자의 제물을 장식/정돈하기까지’로 더 구체적입니다. 히브리어는 더 간결하게 ‘지극히 높으신 분의 배열들(orderings)’이라고 말합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: עַד כַּלּוֹתוֹ
  english_pob_choice: until he finished
  chosen_korean: …을 마치고
  alternatives_korean:
  - …을 끝내고
  - …을 마칠 때까지
  lexicon: HALOT
  rationale: 분사적 완료·종결 의미를 자연스러운 한국어 동작 완료 표현으로 옮겼습니다. 문맥상 앞선 제사장 직무의 종료 시점을 분명히 합니다.
- source_word: לְשָׁרֵת מִזְבֵּחַ
  english_pob_choice: ministering at the altar
  chosen_korean: 제단에서 섬기는 일
  alternatives_korean:
  - 제단에서 봉사하는 일
  - 제단에서 직무를 수행하는 일
  lexicon: HALOT
  rationale: שרת는 제의적·성전적 봉사를 뜻하므로 단순한 일반 '봉사'보다 제단을 중심으로 한 섬김을 드러냈습니다.
- source_word: וּלְסַדֵּר מַעַרְכוֹת
  english_pob_choice: arranging the offerings / the orderings
  chosen_korean: 제물의 배열을 정비할 때까지
  alternatives_korean:
  - 제물의 배열을 정돈할 때까지
  - 배열된 것들을 정리할 때까지
  lexicon: HALOT
  rationale: מערכות는 히브리어 본문에서 간결하고 다의적이어서, 제의적 맥락을 유지하면서도 영어 주석의 'the orderings'가 지키는 폭을 살려 '배열'로 옮겼습니다. '정비하다'는 배열된 상태를 바로잡아 갖추는 느낌을 줍니다.
- source_word: עֶלְיוֹן
  english_pob_choice: the Most High
  chosen_korean: 지극히 높으신 분
  alternatives_korean:
  - 지극히 높으신 이
  - 가장 높으신 분
  lexicon: HALOT
  rationale: 하나님을 가리키는 관용적 칭호이므로 인격적·경배적 어감을 살려 자연스러운 존칭 표현으로 옮겼습니다.
theological_decisions:
- issue: 히브리어의 מערכות를 영어 주석의 'offering'보다 얼마나 구체화할 것인가
  chosen_reading: 본문에는 '제물의 배열'처럼 제의적 배열을 드러내되, 특정 제물 종류까지는 밝히지 않았습니다.
  alternative_readings:
  - 지극히 높으신 분의 제물을 정비할 때까지
  - 지극히 높으신 분의 배열들을 정비할 때까지
  rationale: 히브리어 본문이 더 간결하고 추상적이므로, 그 폭을 보존하면서도 제단 문맥상 제의 행위임을 분명히 했습니다. 영어 POB가 주석으로 제물 해석을 제시하지만, 본문은 그보다 덜 특정한 히브리어 어감을 우선했습니다.
  doctrine_reference: 원어 우선 원칙; 모호성 보존
