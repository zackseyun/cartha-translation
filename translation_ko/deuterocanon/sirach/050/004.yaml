base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/050/004.yaml
  text: the one who cares for his people against calamity[b][a], and strengthens his city against distress.
  footnotes:
  - marker: a
    text: Or 'from sudden disaster'; the Greek parallel reads 'from downfall,' supporting the sense of protection from ruin.
    reason: lexical_alternative
  - marker: b
    text: Or 'fortifies his city against siege'; the Greek parallel points more specifically to military pressure than the Hebrew wording may require.
    reason: alternative_reading
translation:
  language: ko
  text: 자기 백성을 재난으로부터 돌보고, 자기 도시를 환난에 맞서 견고하게 하는 이입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 חֶתֶף는 ‘갑작스러운 재난’ 또는 ‘몰락’을 뜻할 수 있습니다. 그리스어 평행본문은 ‘몰락’(πτῶσις)이라고 합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 צָר는 일반적으로 ‘환난’이나 ‘압박’을 뜻할 수 있습니다. 그리스어 평행본문은 더 구체적으로 ‘포위’의 뉘앙스를 시사합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הַדּוֹאֵג
  english_pob_choice: the one who cares for
  chosen_korean: 돌보는 이
  alternatives_korean:
  - 걱정하는 이
  - 염려하는 이
  - 보살피는 이
  lexicon: HALOT
  rationale: דאג의 ‘염려하다/돌보다’ 뉘앙스를 살리되, 문맥상 백성을 향한 적극적 보호를 자연스럽게 드러내기 위해 ‘돌보는 이’로 옮겼습니다.
- source_word: לְעַמּוֹ
  english_pob_choice: his people
  chosen_korean: 자기 백성
  alternatives_korean:
  - 그의 백성
  - 그 사람들의 무리
  lexicon: HALOT
  rationale: עם은 공동체 전체를 가리키므로 ‘백성’이 적절하며, 소유격은 한국어에서 자연스러운 ‘자기’로 풀었습니다.
- source_word: מֵחֶתֶף
  english_pob_choice: against calamity
  chosen_korean: 재난에서
  alternatives_korean:
  - 갑작스러운 재난에서
  - 몰락에서
  - 멸망에서
  lexicon: HALOT
  rationale: חֶתֶף는 급작한 파괴나 재난을 가리킬 수 있으므로, 본문 의미를 넓게 살려 ‘재난에서’로 옮겼습니다.
- source_word: מִצָּר
  english_pob_choice: against distress
  chosen_korean: 환난에서
  alternatives_korean:
  - 포위에서
  - 곤경에서
  - 압박에서
  lexicon: HALOT
  rationale: צָר는 압박, 곤궁, 환난의 의미를 가질 수 있어, 히브리어의 넓은 의미를 유지하는 ‘환난에서’가 가장 안정적입니다.
theological_decisions:
- issue: הצלה/보호와 עיר(도시) 강화의 병행 구조
  chosen_reading: 지혜로운 지도자의 역할을 개인의 경건이 아니라 공동체 보호와 도시의 방어를 함께 수행하는 것으로 읽었습니다.
  alternative_readings:
  - 단순한 도덕적 격려로만 읽는 해석
  - 도시의 군사적 요새화만 강조하는 해석
  rationale: 히브리어 평행법상 첫 행은 백성의 보호, 둘째 행은 도시의 견고함을 말하므로 둘을 함께 살려야 본문의 정치적·공동체적 무게가 보존됩니다.
  doctrine_reference: 집회서 50:4의 지혜 문학적 통치 이해
