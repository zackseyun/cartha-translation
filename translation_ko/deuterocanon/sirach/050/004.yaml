  to: 자기 백성을 재난으로부터 돌보고, 자기 도시를 환난에 맞서 견고하게 하는 이입니다.[a][b]
  rationale: 문법적으로 어색한 명사구 접속을 두 개의 병렬 관형절로 고쳤습니다. 본문은 히브리어의 현재적·기술적 participle을 따라 "돌보고 ... 견고하게 하는 이"로 유지했습니다. 재난과 환난의 폭넓은 뜻을 본문에서 보존하고, 갑작스러움·몰락 및 포위의 세부 가능성은 각주에 남겼습니다.
