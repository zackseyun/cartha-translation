  source_fidelity: 히브리어 본문은 ‘그의 시대에 … 세워졌다’라는 건축 행위를 말합니다. 초안의 ‘왕궁 같은 거처가 있었습니다’는 단순 존재를 진술하여 נִבְנָה(‘세워졌다/지어졌다’)의 의미를 둘째 명사구에 충분히 반영하지 못합니다. 두 건축 대상을 같은 건축 진술 아래에 두는 번역이 더 충실합니다. פִּנּוֹת의 정확한 건축학적 의미는 불확실하므로 ‘모퉁이의’를 유지하고 각주로 설명하는 것이 적절합니다.
  naturalness: ‘모퉁이의 성벽’은 본문에서는 다소 낯설지만, 난해한 원문 표현을 보존하는 번역으로 수용 가능하며 각주가 이를 보완합니다. ‘그의 시대에 … 세워졌습니다’는 현대 표준 한국어 합쇼체로 자연스럽습니다.
  terminology: ‘성벽’, ‘거처’, ‘왕궁’은 각각 קִיר, מָעוֹן, הֵיכַל מֶלֶךְ의 의미 범위를 무리 없이 반영합니다. 그리스어 이문 각주는 본문과 다른 전승임을 분명히 하되, 그리스어의 둘레/청동 관계를 더 자연스럽게 다듬었습니다.
