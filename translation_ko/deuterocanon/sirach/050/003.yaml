translation:
  language: ko
  text: 그의 시대에 모퉁이의 성벽이 세워졌고, 왕궁 같은 거처가 있었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '그리스어는 여기서 상당히 다르게 읽습니다: ‘그의 시대에 물 저장소가 줄어들었고, 그 둘레의 청동은 바다 같았다’로, 다른 저본이나 전승의 훼손을 시사합니다.'
    reason: textual_variant
  - marker: b
    text: ‘모퉁이의 성벽’은 히브리어의 난해한 표현을 가능한 한 글자 그대로 옮긴 것입니다. 모퉁이 구역, 모퉁이 탑, 또는 요새화된 둘레를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר בְּיָמָיו
  english_pob_choice: In his days
  chosen_korean: 그의 시대에
  alternatives_korean:
  - 그의 날들에
  - 그의 때에
  lexicon: HALOT
  rationale: 시간 배경을 드러내는 관용구로, ‘in his days’를 자연스러운 현대 한국어로 옮겼습니다.
- source_word: נִבְנָה קִיר
  english_pob_choice: the wall ... was built
  chosen_korean: 성벽이 세워졌고
  alternatives_korean:
  - 성벽이 지어졌고
  - 벽이 세워졌고
  lexicon: HALOT
  rationale: נבנה는 ‘세워지다/지어지다’가 가능하지만, 성곽 문맥에서는 ‘성벽이 세워지다’가 가장 자연스럽고 구조물의 완성을 잘 드러냅니다.
- source_word: פִּנּוֹת
  english_pob_choice: of the corners
  chosen_korean: 모퉁이의
  alternatives_korean:
  - 모서리의
  - 구석의
  lexicon: HALOT
  rationale: 직역하면 ‘모퉁이들’이지만, 한국어에서는 앞의 성벽을 수식하는 ‘모퉁이의 성벽’이 원문의 난해한 표현을 지나치게 해석하지 않으면서도 읽기 자연스럽습니다.
- source_word: מָעוֹן
  english_pob_choice: dwelling
  chosen_korean: 거처
  alternatives_korean:
  - 주거
  - 주거지
  lexicon: HALOT
  rationale: מָעוֹן의 기본 뜻인 ‘거처/거주지’를 살리되, 문맥상 단순한 집보다 위엄 있는 건축물을 가리키므로 ‘거처’로 옮겼습니다.
- source_word: כְּהֵיכַל מֶלֶךְ
  english_pob_choice: like a royal palace
  chosen_korean: 왕궁 같은
  alternatives_korean:
  - 왕의 궁전 같은
  - 왕실 궁전 같은
  lexicon: HALOT
  rationale: הֵיכָל은 여기서 ‘궁전/왕궁’의 의미가 자연스러우므로, 비교의 웅장함을 살려 ‘왕궁 같은’으로 번역했습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행본문의 차이
  chosen_reading: 히브리어 본문을 본문으로 따르고, 그리스어의 다른 전승은 각주로 처리합니다.
  alternative_readings:
  - 그리스어의 ‘물 저장소’와 ‘청동 둘레’ 내용을 본문에 반영
  - 혼합 번역으로 두 전승을 절충
  rationale: 이 절은 현존 히브리어 본문이 분명하며, 그리스어는 현저히 다르므로 본문은 히브리어를 따르고 전승 차이는 각주에서 투명하게 밝히는 것이 적절합니다.
  doctrine_reference: 본문비평 및 전승사 원칙
