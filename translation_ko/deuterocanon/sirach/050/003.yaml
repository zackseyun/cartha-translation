  rationale: 이 절은 현존 히브리어 본문이 분명하며, 그리스어는 현저히 다르므로 본문은 히브리어를 따르고 전승 차이는 각주에서 투명하게 밝히는 것이 적절합니다.
  doctrine_reference: 본문비평 및 전승사 원칙
