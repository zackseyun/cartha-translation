  yaml_path: translation/deuterocanon/sirach/050/019.yaml
  text: And all the people of the land cried out in prayer before the Merciful One[b][a], until he finished ministering at the altar and his ordinances reached completion.
  footnotes:
  - marker: a
    text: 'Greek: ''the people of the Lord Most High ... before the Merciful One, until the adornment/service of the Lord was completed and they finished his liturgy.'' The Hebrew and Greek differ in the final clause; the main text follows the surviving Hebrew while reflecting the Greek''s sense of completion.'
    reason: textual_variant
  - marker: b
    text: Or 'his prescribed rites reached their end.' The Hebrew phrase in the last clause is difficult, and the Greek parallel supports a completion-of-liturgy sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 온 땅의 모든 백성이 자비로우신 분 앞에서 기도 가운데 외쳤습니다. 그가 제단에서 섬기는 일을 마칠 때까지, 그리고 그의 규례들이 마무리되었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 마지막 절은 난해하며, 그리스어 평행본문은 제의의 완료라는 뜻을 더 분명히 보여 줍니다. 본문은 살아 있는 히브리어를 따르되, 의미상 완료의 뉘앙스를 반영했습니다.
    reason: source_note
lexical_decisions:
- source_word: וַיָּרֹנּוּ
  english_pob_choice: cried out
  chosen_korean: 외쳤습니다
  alternatives_korean:
  - 소리쳤습니다
  - 환호했습니다
  - 부르짖었습니다
  lexicon: HALOT
  rationale: רנן은 예배적 맥락에서 큰 소리로 외치는 뜻을 가질 수 있으며, 여기서는 ‘기도 가운데’와 함께 쓰여 있어 노래보다 공개적 탄원에 가깝게 ‘외쳤습니다’로 옮겼습니다.
- source_word: כָּל עַם הָאָרֶץ
  english_pob_choice: all the people of the land
  chosen_korean: 온 땅의 모든 백성
  alternatives_korean:
  - 그 땅의 모든 백성
  - 그 지역의 모든 백성
  - 온 백성
  lexicon: HALOT
  rationale: 히브리어의 집합적 표현을 살리면서도 한국어에서 자연스럽게 읽히도록 ‘온 땅의 모든 백성’으로 옮겼습니다.
- source_word: לִפְנֵי רַחוּם
  english_pob_choice: before the Merciful One
  chosen_korean: 자비로우신 분 앞에서
  alternatives_korean:
  - 자비로우신 분 앞에
  - 긍휼하신 분 앞에서
  - 자비로우신 하나님 앞에서
  lexicon: HALOT
  rationale: יַחיד칭의 신적 호칭을 ‘분’으로 살려, 본문에 없는 ‘하나님’을 덧붙이지 않으면서 경외적 뉘앙스를 유지했습니다.
- source_word: וּמִשְׁפָּטָיו הִגִּיעַ אֵלָיו
  english_pob_choice: his ordinances reached completion
  chosen_korean: 그의 규례들이 마무리되었습니다
  alternatives_korean:
  - 그의 규례들이 완성되었습니다
  - 그의 규례들이 끝났습니다
  - 그의 규례들이 그에게 이르렀습니다
  lexicon: HALOT
  rationale: מִשְׁפָּטָיו는 제의적 ‘규례들’로 이해하는 것이 자연스럽고, הִגִּיעַ אֵלָיו는 완료/도달의 난해한 관용을 한국어에서 ‘마무리되었습니다’로 기능적으로 살렸습니다.
theological_decisions:
- issue: 신적 호칭 רַחוּם의 표기
  chosen_reading: 자비로우신 분
  alternative_readings:
