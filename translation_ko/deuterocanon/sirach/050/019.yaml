  rationale: 히브리어는 고유명사가 아니라 속성 호칭이므로, 본문이 말하는 하나님의 자비를 드러내되 추가 명사를 넣지 않는 번역을 택했습니다.
  doctrine_reference: original-language primacy; reverential title without over-specification
