theological_decisions:
- issue: 히브리어 본문과 그리스어 병행본의 첫 지명 차이
  chosen_reading: 본문은 히브리어의 세일을 따르되, 괄호 주석 없이 본문만 간결하게 제시합니다.
  alternative_readings:
  - 그리스어의 '사마리아 산지'를 본문에 반영
  - 두 전승을 본문 안에서 절충
  rationale: 시락서는 현존 히브리어 증언이 분명할 때 이를 본문으로 삼는 원칙이 적절하며, 본 절은 그리스어가 첫 지명을 다르게 전합니다. 한국어 본문은 히브리어를 따르되, 별도 주석 없이도 의미가 충분히 전달됩니다.
  doctrine_reference: 원문 우선 원칙, 본문 비평상의 다중 전승 존중
