translation:
  language: ko
  text: 여름날의 레바논 꽃처럼, 곡식 제물 위의 유향의 불처럼.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 병행본은 이 비교열의 끝에서 ‘물이 흘러나오는 곳 곁의 백합들처럼’이라는 표현을 전하며, 히브리어 본문의 ‘곡식 제물 위의 유향의 불처럼’에 해당하는 비교는 전하지 않습니다.
    reason: textual_variant
lexical_decisions:
- source_word: כְּפֶרַח לְבָנוֹן
  english_pob_choice: like a blossom of Lebanon
  chosen_korean: 레바논의 꽃봉오리처럼
  alternatives_korean:
  - 레바논의 꽃처럼
  - 레바논의 꽃송이처럼
  lexicon: HALOT
  rationale: כְּ의 비교를 살리고, פֶּרַח의 생생한 새움 이미지는 한국어에서 ‘꽃봉오리’가 가장 자연스럽게 전달합니다. ‘레바논의’는 산지의 풍요한 식생 이미지를 보존합니다.
- source_word: בִּימֵי קָיִץ
  english_pob_choice: in the days of summer
  chosen_korean: 여름날에 피는 듯하고
  alternatives_korean:
  - 여름철에
  - 여름날에
  lexicon: HALOT
  rationale: 직역형 ‘여름날에’만 두면 앞의 비유가 끊기기 쉬워, 꽃이 피어나는 상태를 드러내는 동사를 보탰습니다. 다만 מקור의 계절 배경은 유지했습니다.
- source_word: וּכְאֵשׁ לְבוֹנָה
  english_pob_choice: and like a fire of frankincense
  chosen_korean: 유향의 불처럼
  alternatives_korean:
  - 향불처럼
  - 유향의 불꽃처럼
  lexicon: HALOT
  rationale: לְבוֹנָה는 일반적 ‘향’보다 구체적으로 유향을 가리키므로 이를 살렸습니다. ‘불처럼’은 제의적 타오름의 이미지를 자연스럽게 전달합니다.
- source_word: עַל הַמִּנְחָה
  english_pob_choice: upon the grain offering
  chosen_korean: 곡식제물 위에
  alternatives_korean:
  - 곡식제물 위에
  - 소제 위에
  lexicon: HALOT
  rationale: מִנְחָה의 제의적 의미를 살리면서도 현대 한국어에서 이해 가능한 ‘곡식제물’을 택했습니다. 전통 교회어 ‘소제’는 덜 투명하므로 본문에는 두지 않았습니다.
theological_decisions:
- issue: 희생제의적 이미지의 보존
  chosen_reading: 향기로운 불이 제물 위에 타오르는 제의 장면으로 읽어, 단순한 자연 비유로 약화시키지 않았습니다.
  alternative_readings:
  - 그냥 ‘향기로운 꽃’의 이미지로 넓게 읽기
  - 일반적 ‘제물’로만 처리하기
  rationale: 히브리어는 유향과 민חה를 함께 두어 성전 제의의 장면을 분명히 드러냅니다. 따라서 한국어도 그 제의적 긴장을 유지해야 합니다.
  doctrine_reference: 성전/제사 용례의 문맥 보존
- issue: LXX와 히브리어 전승의 차이
  chosen_reading: 히브리어 본문을 따라 ‘유향의 불처럼 곡식제물 위에’로 옮기고, 그리스어 병행 전승은 본문 밖 참고로 둡니다.
  alternative_readings:
  - 그리스어의 ‘물가의 백합’ 이미지를 본문에 반영하기
  - 두 전승을 절충하여 혼합하기
  rationale: 영어 POB가 이미 히브리어 본문을 मुख्य text로 두고 그리스어를 병행 전승으로 처리합니다. 본문에는 주된 히브리어 증거를 따르는 것이 공정합니다.
  doctrine_reference: 본문 증거 우선 및 이본 처리 원칙
