base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/050/011.yaml
  text: When he put on garments of honor and clothed himself in garments of splendor[a], when he went up to the altar of glory, he adorned the court of the sanctuary.
  footnotes:
  - marker: a
    text: 'Greek: ''when he went up to the holy altar, he glorified the vesture/court of the sanctuary.'' The Hebrew reads ''the glorious altar'' and ''the court of the sanctuary.'''
    reason: alternative_reading
translation:
  language: ko
  text: 그가 영예의 옷을 입고 찬란한 옷을 걸친 채 영광의 제단에 올라가, 성소의 뜰을 아름답게 꾸몄습니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 ‘그가 거룩한 제단에 올라갈 때, 성소의 의복 또는 뜰을 영화롭게 하였다’고 읽습니다. 히브리어는 ‘영광의 제단’과 ‘성소의 뜰’이라고 합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: בַּעֲטוֹתוֹ / וְהִתְלַבְּשׁוֹ
  english_pob_choice: when he put on / and clothed himself
  chosen_korean: 영예의 옷을 입고 영광의 옷을 걸치며
  alternatives_korean:
  - 영예의 옷을 입으며
  - 영예의 옷을 두르고
  lexicon: HALOT
  rationale: 두 동사 모두 의복을 갖추는 장면을 병렬로 강조하므로, 한국어도 ‘입고 / 걸치며’로 자연스럽게 살리면서 반복된 착의 행위를 드러냈습니다.
- source_word: בִּגְדֵי כָבוֹד / בִּגְדֵי תִפְאָרֶת
  english_pob_choice: garments of honor / garments of splendor
  chosen_korean: 영예의 옷 / 영광의 옷
  alternatives_korean:
  - 존귀의 옷 / 아름다움의 옷
  - 영광스러운 옷 / 화려한 옷
  lexicon: HALOT
  rationale: כָבוֹד와 תִפְאָרֶת의 의미 영역을 각각 영예/영광으로 옮겨, 예복의 장엄함을 살리되 지나치게 장식적이거나 전통 교회 문구에 치우치지 않게 했습니다.
- source_word: מִזְבַּח הוֹד
  english_pob_choice: the altar of glory
  chosen_korean: 영광의 제단
  alternatives_korean:
  - 존귀의 제단
  - 영예의 제단
  lexicon: HALOT
  rationale: הוֹד는 위엄·영광·장엄함의 뉘앙스를 가지므로, 문맥상 제단의 품격을 드러내는 ‘영광의 제단’이 가장 직접적입니다.
- source_word: עֲזֶרֶת מִקְדָּשׁ
  english_pob_choice: the court of the sanctuary
  chosen_korean: 성소의 뜰
  alternatives_korean:
  - 성전 뜰
  - 성소 뜰
  lexicon: HALOT
  rationale: עֲזֶרֶת은 ‘뜰’이 가장 자연스럽고, מִקְדָּשׁ과의 결합은 ‘성소의 뜰’로 간결하게 옮겨 소유 관계를 유지했습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행본문의 차이
  chosen_reading: 본문은 신뢰도 높은 히브리어를 따라 ‘영광의 제단’과 ‘성소의 뜰’을 살리고, 그리스어의 ‘거룩한 제단’/다른 목적어 가능성은 각주로만 남겼습니다.
  alternative_readings:
  - 그리스어를 따라 ‘거룩한 제단’으로 옮기는 읽기
  - 그리스어의 다른 목적어를 반영해 ‘성소의 휘장/예복’ 쪽으로 보는 읽기
  rationale: 이 시라흐 구절은 히브리어가 현존하고 문맥상 자연스러우므로, 본문은 히브리어를 우선하고 그리스어 차이는 보조 정보로 처리하는 것이 번역 원칙에 맞습니다.
  doctrine_reference: 'PHILOSOPHY.md: Hebrew Sirach is translated from the Hebrew where it survives; parallel Greek is used as actual input but not allowed to override a sound Hebrew witness without cause.'
