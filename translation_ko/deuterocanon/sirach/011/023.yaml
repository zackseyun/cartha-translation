  text: Do not say, "What do I need, and what good things will be mine from now on?"[a]
  footnotes:
  - marker: a
    text: 'The extant Hebrew witness here differs sharply: ''He did not know what was coming next, and he left it to another and died,'' or similar. The Greek parallel instead reads as an admonition, which is followed in the main text because the Hebrew appears textually mismatched at this point.'
    reason: textual_variant
translation:
  language: ko
  text: “내게 무엇이 필요하겠느냐? 이제부터 어떤 좋은 것들이 내 것이 되겠느냐?”라고 말하지 마십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 현존 히브리어 전승은 이곳에서 크게 다릅니다. “그는 뒤이어 올 일을 알지 못했고, 그것을 다른 이에게 남기고 죽었다” 또는 이와 비슷한 뜻입니다. 헬라어 평행본문은 권고문으로 읽히며, 본문은 그 흐름을 따랐습니다.
    reason: textual_variant
lexical_decisions:
- source_word: μὴ εἴπῃς
  english_pob_choice: Do not say
  chosen_korean: 「…라고 말하지 마십시오」형의 금지로 처리했습니다.
  alternatives_korean:
  - 「…라고 생각하지 마십시오」
  - 직설적으로 명령형 없이 옮김
  lexicon: LSJ
  rationale: 헬라어의 직접적인 금지 명령을 한국어 합쇼체 금지로 살려, 지혜문학의 경구적 경고를 유지했습니다.
- source_word: Τίς ἐστίν μου χρεία
  english_pob_choice: What do I need
  chosen_korean: 「내게 무슨 필요가 있느냐」
  alternatives_korean:
  - 「내 필요가 무엇이냐」
  - 「내게 무엇이 더 필요하냐」
  lexicon: LSJ
  rationale: χρεία는 단순한 소유가 아니라 ‘필요/궁핍’을 뜻하므로, 자기충족적 태도를 드러내는 수사적 질문으로 자연스럽게 옮겼습니다.
- source_word: τίνα ... τὰ ἀγαθά
  english_pob_choice: what good things will be mine
  chosen_korean: 「무슨 좋은 것들이 있겠느냐」
  alternatives_korean:
  - 「어떤 좋은 것들이 내 것이 되겠느냐」
  - 「무슨 유익이 내게 있겠느냐」
  lexicon: LSJ
  rationale: τὰ ἀγαθά는 단순 재산보다 넓은 ‘좋은 것들/복리’를 가리킬 수 있어, 의미를 좁히지 않는 표현을 택했습니다.
- source_word: ἀπὸ τοῦ νῦν
  english_pob_choice: from now on
  chosen_korean: 「이제부터」
  alternatives_korean:
  - 「지금부터」
  - 「이후로」
  lexicon: LSJ
  rationale: 시간 부사의 평이한 현대 한국어 대응으로, 문장의 흐름을 매끄럽게 했습니다.
theological_decisions:
- issue: 히브리어와 헬라어의 본문 불일치 처리
  chosen_reading: 본문은 헬라어의 권고문 형태를 따라 「말하지 마십시오」로 옮기고, 히브리어의 이질적인 전승은 각주로 표기했습니다.
  alternative_readings:
  - 히브리어를 따라 「그는 뒤에 올 일을 알지 못했고, 그것을 다른 이에게 남기고 죽었습니다」로 옮김
  rationale: 이 절은 보존된 히브리어가 주변 문맥과 어긋나는 반면, 헬라어는 앞뒤 경고문맥과 자연스럽게 이어집니다. 따라서 본문은 헬라어의 의미를 따르되, 텍스트 불일치는 숨기지 않고 각주로 남겼습니다.
  doctrine_reference: Sirach 11:23의 minor_mismatch 주석 및 영어 POB의 textual_variant 처리
