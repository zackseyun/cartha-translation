  text: My son[a], stand by your appointed lot and walk in it[b], and grow old in your work.
  footnotes:
  - marker: a
    text: 'Greek witness: ''Do not say, “I am self-sufficient, and what harm shall come to me from now on?”'' The surviving Hebrew here differs substantially from the Greek tradition.'
