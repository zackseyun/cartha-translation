translation:
  language: ko
  text: 내 아들아, 네 분깃에 서서 거기서 살아가라. 그리고 네 일에서 늙어 가라.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 현존 히브리어는 ‘네 분깃/네 정해진 몫’으로 읽히지만, 그리스어 전승은 ‘나는 족하다…’라는 다른 형태를 전합니다.
    reason: textual_variant
  - marker: b
    text: 히브리어 בחקך는 문맥상 ‘율법’보다는 ‘정해진 몫, 배정된 삶의 영역’에 가깝습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנִי
  english_pob_choice: My son
  chosen_korean: 내 아들아
  alternatives_korean:
  - 내 아이야
  - 내 자녀야
  lexicon: HALOT
  rationale: 지혜 교훈의 호칭으로서 친자 관계를 드러내는 직접 호소를 살렸습니다. 성별 표지는 원문의 남성 단수 호격을 반영합니다.
- source_word: בְּחֻקֶּךָ
  english_pob_choice: your appointed lot / your allotted way
  chosen_korean: 네 분깃
  alternatives_korean:
  - 네 정해진 몫
  - 네 지정된 길
  - 네 규례
  lexicon: HALOT
  rationale: 문맥상 ‘율법’이 아니라 하나님이 정하신 몫·배정된 삶의 영역이라는 의미가 강하므로, 그 긴장을 살려 ‘분깃’으로 옮겼습니다.
- source_word: וּבוֹ הִתְהַלֵּךְ
  english_pob_choice: and walk in it
  chosen_korean: 거기서 살아가라
  alternatives_korean:
  - 그 안에서 걸어가라
  - 그것을 따라 살아가라
  - 그 안에서 행하라
  lexicon: HALOT
  rationale: 히브리어 התהלך의 지속적 삶의 행위를 한국어 자연어로 풀어, 단순한 이동이 아니라 그 배정된 삶의 방식 안에서의 지속적 행보를 나타냈습니다.
- source_word: וּבִמְלָאכְתְּךָ
  english_pob_choice: in your work
  chosen_korean: 네 일에서
  alternatives_korean:
  - 네 노동에서
  - 네 직분에서
  - 네 작업에서
  lexicon: HALOT
  rationale: מלאכה는 일반적인 ‘일/일거리/노동’의 폭을 가지므로, 현대 한국어에서 가장 넓고 무난한 ‘일’로 렌더링했습니다.
- source_word: הִתְיַשֶּׁן
  english_pob_choice: grow old
  chosen_korean: 늙어 가라
  alternatives_korean:
  - 나이 들어 가라
  - 오래 견뎌라
  - 점점 늙어 가라
  lexicon: HALOT
  rationale: 여기서는 피곤해 지친다는 뜻보다 시간 속에서 계속 머무르며 나이 들어 간다는 지속성을 강조하므로, 명령형으로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행본문의 차이
  chosen_reading: 본문은 현존 히브리어를 따라 옮기되, 히브리어의 어려운 표현을 ‘분깃’으로 살려 병행본문이 암시하는 ‘자기충족/자기만족’의 반대 방향이 드러나게 했습니다.
  alternative_readings:
  - 그리스어를 따라 ‘나는 족하다’ 류로 번역
  - 히브리어를 ‘규례/율법’으로 평탄화
  rationale: 집회서에서는 히브리어가 남아 있을 때 히브리어를 우선하되, 병행 그리스어는 본문의 의미 범위를 설명하는 보조 증거로 존중합니다. 따라서 본문은 히브리어를 반영하고, 해석상 부담은 과도하게 제거하지 않았습니다.
  doctrine_reference: 'PHILOSOPHY.md: 히브리어 우선, 병행 그리스어는 실제 입력으로 사용하되 불확실성을 정직하게 보존'
