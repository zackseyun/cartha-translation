  rationale: 여기서는 피곤해 지친다는 뜻보다 시간 속에서 계속 머무르며 나이 들어 간다는 지속성을 강조하므로, 명령형으로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행본문의 차이
  chosen_reading: 본문은 현존 히브리어를 따라 옮기되, 히브리어의 어려운 표현을 ‘분깃’으로 살려 병행본문이 암시하는 ‘자기충족/자기만족’의 반대 방향이 드러나게 했습니다.
  alternative_readings:
  - 그리스어를 따라 ‘나는 족하다’ 류로 번역
  - 히브리어를 ‘규례/율법’으로 평탄화
  rationale: 집회서에서는 히브리어가 남아 있을 때 히브리어를 우선하되, 병행 그리스어는 본문의 의미 범위를 설명하는 보조 증거로 존중합니다. 따라서 본문은 히브리어를 반영하고, 해석상 부담은 과도하게 제거하지 않았습니다.
  doctrine_reference: 'PHILOSOPHY.md: 히브리어 우선, 병행 그리스어는 실제 입력으로 사용하되 불확실성을 정직하게 보존'
