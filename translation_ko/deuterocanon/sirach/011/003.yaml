theological_decisions:
- issue: 벌의 ‘열매’를 어떻게 이해할지
  chosen_reading: 문맥상 꿀을 포함한 벌의 산물이지만, 본문은 비유를 유지해 ‘열매’라는 표현을 그대로 살렸습니다.
  alternative_readings:
  - ‘그 꿀은’
  - ‘그 생산물은’
  rationale: 히브리어와 그리스어 모두 비유적으로 ‘열매/산물’을 말하므로, 의미를 특정한 식품명으로 좁히지 않았습니다.
  doctrine_reference: 지혜문학의 비유적 언어 보존
