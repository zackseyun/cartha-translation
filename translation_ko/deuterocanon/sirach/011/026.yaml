translation:
  language: ko
  text: 가난한 사람을 순식간에 부유하게 하시는 것은 주님 보시기에 쉬운 일입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '그리스어: “주님 앞에서, 죽음의 날에, 사람에게 그의 길들을 따라 갚아 주는 것은 쉬운 일입니다.” 그리스어는 이 절의 현전 히브리어와 상당히 다른 형태를 반영합니다.'
    reason: alternative_reading
lexical_decisions:
- source_word: נֹכַח / κοῦφον
  english_pob_choice: easy
  chosen_korean: 쉬운 일
  alternatives_korean:
  - 가벼운 일
  - 손쉬운 일
  - 쉽습니다
  lexicon: HALOT; BDAG
  rationale: 히브리어 נֹכַח과 그리스어 κοῦφον이 모두 ‘쉽다/가볍다’는 의미를 지지하므로, 한국어에서는 의미를 분명히 드러내는 ‘쉬운 일’로 옮겼습니다.
- source_word: בְּעֵינֵי יי / ἔναντι Κυρίου
  english_pob_choice: in the eyes of the Lord
  chosen_korean: 야훼 보시기에
  alternatives_korean:
  - 주님의 눈에
  - 주님 앞에서
  - 주님의 보시기에
  lexicon: HALOT; BDAG
  rationale: 히브리어 관용구를 자연스러운 한국어로 살리면서도, 프로젝트 기본어에 따라 신적 이름은 ‘야훼’로 옮겼습니다.
- source_word: בְּפֶתַע פִּתְאֹם
  english_pob_choice: in a sudden moment
  chosen_korean: 갑작스러운 순간에
  alternatives_korean:
  - 순식간에
  - 갑자기
  - 한순간에
  lexicon: HALOT
  rationale: 겹친 표현이 주는 급작성과 순간성을 함께 담기 위해, 부사 하나보다 시간 표현을 살린 ‘갑작스러운 순간에’를 선택했습니다.
- source_word: לְהַעֲשִׁיר דָּל
  english_pob_choice: to make a poor man rich
  chosen_korean: 가난한 사람을 부유하게 만드는 일
  alternatives_korean:
  - 가난한 이를 부유하게 하는 일
  - 가난한 사람을 부자로 만드는 일
  - 가난한 사람을 부유하게 하다
  lexicon: HALOT
  rationale: 히브리어 사역형의 원인을 분명히 드러내기 위해 ‘만드는 일’ 구조를 유지했고, דָּל은 개인을 가리키므로 ‘가난한 사람’으로 옮겼습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행본문의 처리
  chosen_reading: 본문은 현전하는 히브리어를 따르고, 그리스어의 다른 형태는 주석으로만 보존합니다.
  alternative_readings:
  - 그리스어처럼 ‘사람에게 그의 행위대로 갚는 것’으로 옮기기
  rationale: 이 절은 히브리어와 그리스어가 실질적으로 다른 형태이므로, 본문은 히브리어를 따르되 대체 전승은 삭제하지 않고 주석으로 남겨 투명성을 확보했습니다.
  doctrine_reference: 'PHILOSOPHY.md: 유대 지혜문학은 현전하는 히브리어가 있을 때 이를 우선하되, 의미상 중요한 이본은 보존한다.'
