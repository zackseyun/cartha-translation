base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/011/017.yaml
  text: Good and evil[a], life and death[c][b], poverty and wealth—they are from him.
  footnotes:
  - marker: a
    text: Or 'harm' or 'adversity' for 'evil' (Hebrew רַע); the term can denote calamity as well as evil more broadly.
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew: ''from him.'' The referent is likely God from context, but the divine name is not stated in this line.'
    reason: alternative_reading
  - marker: c
    text: 'The Greek parallel preserved in Swete for Sirach 11:17 differs substantially: ''The gift of the Lord remains for the godly, and his favor will prosper forever.'' The Hebrew and Greek witnesses here do not closely align.'
    reason: textual_variant
translation:
  language: ko
  text: 좋음과 악, 생명과 죽음, 가난과 부요함 — 그것들은 그에게서 옵니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 רַע는 ‘악’뿐 아니라 ‘재앙’, ‘해악’의 뜻도 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 본문은 마지막에 명시적 신명을 두지 않고 ‘그에게서’라고만 말합니다. 문맥상 하나님을 가리킬 가능성이 큽니다.
    reason: theological_note
  - marker: c
    text: 이 절의 그리스어 평행본문은 스웨테 본문에서 ‘주님의 선물은 경건한 이들에게 남아 있고…’로 매우 다르게 전해집니다.
    reason: textual_variant
lexical_decisions:
- source_word: טוֹב
  english_pob_choice: good
  chosen_korean: 좋음
  alternatives_korean:
  - 선함
  - 좋은 것
  lexicon: HALOT
  rationale: 히브리어 טוֹב는 형용사적 의미뿐 아니라 명사적으로도 쓰이므로, 목록형 대구 속에서는 ‘좋음’이 가장 자연스럽게 폭넓은 뜻을 살립니다.
- source_word: וְרַע
  english_pob_choice: and evil
  chosen_korean: 악
  alternatives_korean:
  - 해악
  - 재앙
  lexicon: HALOT
  rationale: 영어 POB의 ‘evil’을 따라, 문맥상 재앙적 뉘앙스가 가능하더라도 어휘의 범위를 좁히지 않기 위해 ‘악’을 택했습니다.
- source_word: רֵישׁ
  english_pob_choice: poverty
  chosen_korean: 가난
  alternatives_korean:
  - 빈곤
  - 궁핍
  lexicon: HALOT
  rationale: 히브리어 רֵישׁ은 결핍 상태를 가리키며, ‘wealth’와의 대조를 살리기에 ‘가난’이 가장 자연스럽습니다.
- source_word: וְעֹשֶׁר
  english_pob_choice: and wealth
  chosen_korean: 부요함
  alternatives_korean:
  - 부유함
  - 재물
  lexicon: HALOT
  rationale: עֹשֶׁר는 재산/부를 뜻하지만, ‘poverty’와 대칭되는 추상명사로는 ‘부요함’이 문맥상 적절합니다.
theological_decisions:
- issue: 마지막 대명사의 지시 대상
  chosen_reading: ‘그에게서’로 유지하고, ‘그’의 지시 대상을 본문 안에서 명시하지 않았습니다.
  alternative_readings:
  - ‘주님에게서’
  - ‘하나님에게서’
  rationale: 히브리어 본문은 명시적 신명 없이 3인칭 대명사만 제시하므로, 한국어에서도 원문의 긴장을 유지하는 것이 source-grounded합니다. 문맥상 하나님을 가리킬 가능성은 크지만, 본문에 없는 호칭을 덧붙이지 않았습니다.
  doctrine_reference: 원문 우선 원칙; 본문이 명시하지 않은 신호칭의 보충을 보류
