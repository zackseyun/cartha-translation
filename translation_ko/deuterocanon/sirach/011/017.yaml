  rationale: 히브리어 טוֹב는 형용사적 의미뿐 아니라 명사적으로도 쓰이므로, 목록형 대구 속에서는 ‘좋음’이 가장 자연스럽게 폭넓은 뜻을 살립니다.
- source_word: וְרַע
