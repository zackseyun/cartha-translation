  - 재앙
  lexicon: HALOT
  rationale: 영어 POB의 ‘evil’을 따라, 문맥상 재앙적 뉘앙스가 가능하더라도 어휘의 범위를 좁히지 않기 위해 ‘악’을 택했습니다.
- source_word: רֵישׁ
  english_pob_choice: poverty
  chosen_korean: 가난
  alternatives_korean:
  - 빈곤
  - 궁핍
  lexicon: HALOT
  rationale: 히브리어 רֵישׁ은 결핍 상태를 가리키며, ‘wealth’와의 대조를 살리기에 ‘가난’이 가장 자연스럽습니다.
- source_word: וְעֹשֶׁר
  english_pob_choice: and wealth
  chosen_korean: 부요함
  alternatives_korean:
  - 부유함
  - 재물
  lexicon: HALOT
  rationale: עֹשֶׁר는 재산/부를 뜻하지만, ‘poverty’와 대칭되는 추상명사로는 ‘부요함’이 문맥상 적절합니다.
theological_decisions:
- issue: 마지막 대명사의 지시 대상
  chosen_reading: ‘그에게서’로 유지하고, ‘그’의 지시 대상을 본문 안에서 명시하지 않았습니다.
  alternative_readings:
  - ‘주님에게서’
  - ‘하나님에게서’
  rationale: 히브리어 본문은 명시적 신명 없이 3인칭 대명사만 제시하므로, 한국어에서도 원문의 긴장을 유지하는 것이 source-grounded합니다. 문맥상 하나님을 가리킬 가능성은 크지만, 본문에 없는 호칭을 덧붙이지 않았습니다.
  doctrine_reference: 원문 우선 원칙; 본문이 명시하지 않은 신호칭의 보충을 보류
