base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/011/005.yaml
  text: For the works of the Lord are wondrous[b][a], and his work is hidden from man.
  footnotes:
  - marker: a
    text: Or 'from humankind.' Hebrew 'from man' uses a singular generic term for humanity.
    reason: lexical_alternative
  - marker: b
    text: 'The Greek parallel for this verse differs substantially: ''Many tyrants sat on the ground, but the unimagined one wore a crown.'' The Hebrew and Greek witnesses appear to reflect different textual forms at this point.'
    reason: textual_variant
translation:
  language: ko
  text: 야훼의 일들은 놀랍고[a], 그분의 일은 사람에게 숨겨져 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 병행 본문은 크게 다릅니다. “많은 폭군이 땅에 앉았으나, 아무도 생각하지 못한 이가 왕관을 썼다.” 히브리어와 그리스어 전승은 여기에서 서로 다른 본문형을 반영하는 것으로 보입니다.
    reason: textual_variant
lexical_decisions:
- source_word: פְלָאוֹת
  english_pob_choice: wondrous
  chosen_korean: 놀랍습니다
  alternatives_korean:
  - 경이롭습니다
  - 놀랍고 기이합니다
  lexicon: HALOT
  rationale: פלא의 의미를 살려 하나님의 일의 경이로움을 자연스러운 현대 한국어로 옮겼습니다. "놀랍습니다"는 형용적 숭고함을 유지하면서도 문장 흐름이 매끄럽습니다.
- source_word: מַעֲשֵׂי
  english_pob_choice: the works of
  chosen_korean: 주님의 일들
  alternatives_korean:
  - 주님의 행위들
  - 주님의 역사
  lexicon: HALOT
  rationale: 복수 구성형을 살려 하나님의 여러 사역/행동을 가리키는 표현으로 옮겼습니다. "일들"은 원문의 복수성을 보존하면서도 한국어에서 자연스럽습니다.
- source_word: יי
  english_pob_choice: the Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주
  - 야훼
  lexicon: 'DOCTRINE.md: Contested terms table, יְהוָה YHWH → 야훼 / κύριος → 주님'
  rationale: 히브리어 약어형 신명 표기를 존중하되, 본문 문맥상 한국어에서는 예수/하나님을 직접 호칭하는 일반적 존칭인 "주님"으로 옮겼습니다. 여기서는 본문이 명시적으로 신적 주권을 말하므로 "주님"이 가장 자연스럽습니다.
- source_word: וְנֶעְלָם
  english_pob_choice: is hidden
  chosen_korean: 숨겨져 있습니다
  alternatives_korean:
  - 감추어져 있습니다
  - 알려져 있지 않습니다
  lexicon: HALOT
  rationale: נעלם의 피동적 의미를 살려, 인간에게 드러나지 않은 상태를 직접적으로 표현했습니다. "숨겨져 있습니다"는 원문의 수동성을 유지합니다.
- source_word: מֵאָדָם
  english_pob_choice: from man
  chosen_korean: 사람에게
  alternatives_korean:
  - 인류에게
  - 사람으로부터
  lexicon: HALOT
  rationale: 히브리어 אָדָם의 일반적인 인류 지시를 한국어에서 남성 단수로 굳히지 않도록, 의미를 살려 "사람에게"로 옮겼습니다. POB의 의미상 선택인 generic singular을 한국어에서는 자연스러운 포괄 표현으로 풀었습니다.
- source_word: פָּעֳלוֹ
  english_pob_choice: his work
  chosen_korean: 그의 일
  alternatives_korean:
  - 그의 행위
  - 그가 하시는 일
  lexicon: HALOT
  rationale: 앞의 "일들"과 구별되는 단수형을 살려, 하나님의 구체적 작용/역사를 가리키는 표현으로 유지했습니다. "그의 일"은 반복을 피하면서도 원문의 단수 전환을 보존합니다.
theological_decisions:
- issue: 인간 일반을 뜻하는 אָדָם의 처리
  chosen_reading: 사람에게
  alternative_readings:
  - 인류에게
  - 사람으로부터
  rationale: 원문은 남성 개인을 특정하기보다 인간 일반을 가리킵니다. 한국어에서는 성별 편향을 강화하는 '사람'보다 문맥상 자연스러운 포괄 표현 '사람에게'로 옮겨, 의미상의 일반성을 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Gender-accurate over gender-neutral; preserve generic reference without unnecessary masculinization'
