translation:
  language: ko
  text: 악을 행하는 자들을 보고 놀라지 마십시오. 주님께로 달려가서 그의 빛을 기다리십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '그리스어 평행문: “좋은 날에는 나쁜 일에 대한 망각이 있고, 나쁜 날에는 좋은 일을 기억하지 못한다.” 여기서는 히브리어 본문과 내용이 상당히 다릅니다.'
    reason: textual_variant
lexical_decisions:
- source_word: אַל תִּתְמַה
  english_pob_choice: Do not be astonished
  chosen_korean: 놀라지 마십시오
  alternatives_korean:
  - 경탄하지 마십시오
  - 당황하지 마십시오
  - 이상하게 여기지 마십시오
  lexicon: HALOT
  rationale: 히브리어는 악인들을 보고 크게 놀라거나 휘둘리지 말라는 뜻이므로, 자연스러운 현대 경고문체로 ‘놀라지 마십시오’가 가장 직접적입니다.
- source_word: בְּעוֹשֵׂי רָע
  english_pob_choice: at those who do evil
  chosen_korean: 악을 행하는 자들
  alternatives_korean:
  - 악인들
  - 악을 행하는 사람들
  - 악행을 하는 자들
  lexicon: HALOT
  rationale: 직역하면 ‘악을 행하는 자들’이어서, 행위 중심의 히브리어 분사를 살리면서도 한국어에서는 간결하게 표현했습니다.
- source_word: תָּרוּץ
  english_pob_choice: run
  chosen_korean: 달려가서
  alternatives_korean:
  - 서둘러
  - 달려가십시오
  - 급히 가십시오
  lexicon: HALOT
  rationale: 동사의 긴급하고 구체적인 움직임을 살리기 위해 ‘달려가서’를 택했고, 이어지는 동사와의 연결도 자연스럽게 했습니다.
- source_word: לַיי
  english_pob_choice: to the Lord
  chosen_korean: 주님께로
  alternatives_korean:
  - 주께로
  - 야훼께로
  - 주님께
  lexicon: HALOT
  rationale: 이 구절의 전치사 구조는 ‘~께로 달려가다’가 가장 자연스럽고, 본문이 가리키는 이스라엘의 하나님을 한국어 경건체로 분명히 드러내기 위해 ‘주님’으로 옮겼습니다.
- source_word: לְאוֹרוֹ
  english_pob_choice: for his light
  chosen_korean: 그의 빛을
  alternatives_korean:
  - 그의 빛을 향해
  - 그의 비춤을
  - 그의 조명을
  lexicon: HALOT
  rationale: 히브리어의 직접적인 이미지인 ‘그의 빛’을 보존해, 단순한 도움이나 해석으로 좁히지 않고 하나님의 인도와 구원을 함께 열어 두었습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 평행문의 관계
  chosen_reading: 히브리어 본문을 본문 번역의 기준으로 삼고, 그리스어가 크게 다른 내용이라는 점만 주석으로 남깁니다.
  alternative_readings:
  - 그리스어 뜻을 본문에 반영해 조정한다
  - 두 전승을 절충해 혼합 번역한다
  rationale: 이 절은 현존 히브리어와 그리스어가 실질적으로 다른 격언을 전하므로, 본문은 히브리어를 따르고 전승 차이는 별도로 표시하는 것이 사료에 가장 충실합니다.
  doctrine_reference: PHILOSOPHY.md — 히브리어가 보존된 경우 히브리어 본문을 우선하고 그리스어 평행은 검토 자료로 사용
