  source_fidelity: 본문은 현존 히브리어를 충실히 따릅니다. ‘악을 행하는 자들’, ‘달려가서’, ‘그의 빛을 기다리십시오’는 각각 בְּעוֹשֵׂי רָע, תָּרוּץ, לְאוֹרוֹ의 행위 중심 표현과 긴급한 명령 및 열린 비유를 잘 보존합니다. 다만 각주에서 그리스어 ἀγαθῶν은 ‘좋은 날’이 아니라 ‘좋은 일들/좋은 것들’을 뜻하므로 이를 바로잡아야 합니다.
  naturalness: 본문은 현대 표준 한국어 합쇼체로 자연스럽습니다. ‘주님께로 달려가서’와 ‘그의 빛을 기다리십시오’의 연결도 무리 없습니다. 각주는 ‘망각이 있고’보다 ‘잊게 되고’가 현대 한국어에서 더 자연스럽습니다.
