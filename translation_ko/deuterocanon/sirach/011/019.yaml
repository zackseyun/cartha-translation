translation:
  language: ko
  text: 어리석음과 어둠은 범법자들에게 예비되어 있습니다. 악을 행하는 자들에게는 악이 함께 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 병행본은 이렇게 다릅니다. “그가 ‘나는 안식을 찾았으니, 이제 내 재산으로 먹겠다’ 하고 말할 때, 그는 어느 때가 지나갈지 알지 못하며, 그것들을 다른 이들에게 남기고 죽을 것입니다.” 히브리어 증언은 여기서 그리스어 전통과 크게 다릅니다.
    reason: textual_variant
lexical_decisions:
- source_word: שִׂכְלוּת
  english_pob_choice: folly
  chosen_korean: 어리석음
  alternatives_korean:
  - 우매함
  - 무지
  lexicon: HALOT
  rationale: 지혜문학 문맥에서 שִׂכְלוּת의 도덕적·지혜적 반대 개념을 살리기 위해 '어리석음'을 택했습니다.
- source_word: וְחֹשֶׁךְ
  english_pob_choice: and darkness
  chosen_korean: 어둠
  alternatives_korean:
  - 흑암
  - 캄캄함
  lexicon: HALOT
  rationale: 직역에 가까운 기본 의미를 유지하면서 현대 한국어에서 자연스러운 표현으로 옮겼습니다.
- source_word: לְפוֹשְׁעִים
  english_pob_choice: for transgressors
  chosen_korean: 범법자들을 위해
  alternatives_korean:
  - 반역자들을 위해
  - 죄인들을 위해
  lexicon: HALOT
  rationale: פשע의 '의도적 위반/범법' 뉘앙스를 살리기 위해 '범법자'를 선택했고, 전치사 לְ의 목적·대상성은 '위해'로 반영했습니다.
- source_word: נוֹצְרָה
  english_pob_choice: are reserved
  chosen_korean: 예비되어 있으며
  alternatives_korean:
  - 간직되어 있으며
  - 보관되어 있으며
  - 저장되어 있으며
  lexicon: HALOT
  rationale: 수동적 보존·대기 상태를 나타내는 동사로서, 단순 보관보다 심판적 예비의 뉘앙스를 담는 '예비되어'가 가장 적절합니다.
- source_word: וּמְרֵעִים
  english_pob_choice: evildoers / those who do evil
  chosen_korean: 악을 행하는 자들
  alternatives_korean:
  - 악인들
  - 행악자들
  lexicon: HALOT
  rationale: 분사형의 행위성을 드러내기 위해 '악을 행하는 자들'로 풀어, 명사화된 '악인'보다 원문의 동사적 힘을 더 가깝게 반영했습니다.
- source_word: רָעָה
  english_pob_choice: evil
  chosen_korean: 악
  alternatives_korean:
  - 재앙
  - 해악
  - 불행
  lexicon: HALOT
  rationale: 앞 절의 רע 계열 반복을 보존하기 위해 '악'을 사용했습니다. 이는 도덕적 악과 해로운 결과의 중의성을 비교적 그대로 남깁니다.
- source_word: עִמָּם
  english_pob_choice: with them
  chosen_korean: 자기들과 함께
  alternatives_korean:
  - 그들과 함께
  - 그들 곁에
  lexicon: HALOT
  rationale: 관계·동반의 의미를 자연스럽게 살리면서, 한국어에서 주어-동일집단을 명시하는 '자기들과 함께'로 응축했습니다.
theological_decisions:
