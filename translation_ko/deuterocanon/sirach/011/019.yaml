  - 그리스어 병행본을 따라 '내가 안식을 찾았다'로 시작하는 전혀 다른 문장으로 옮김
  rationale: 이 절은 히브리어와 그리스어 전통이 크게 어긋나지만, 제공된 히브리어가 고신뢰 본문이므로 원문 우선 원칙에 따라 히브리어를 본문으로 유지합니다.
  doctrine_reference: 'PHILOSOPHY.md: surviving Hebrew in Sirach is primary; preserve textual divergence transparently.'
