  source_fidelity: 히브리어 본문을 주본문으로 따른 점은 적절합니다. שִׂכְלוּת/חֹשֶׁךְ, פושעים, נוֹצְרָה의 의미도 대체로 충실합니다. 다만 עִמָּם의 ‘그들과 함께’라는 관계를 ‘자기들과 함께 악을 지닙니다’로 옮기면 한국어에서 다소 부자연스럽고, 악을 소유한다는 뜻으로 좁혀질 수 있습니다.
  naturalness: ‘범법자들에게 예비되어 있습니다’가 ‘범법자들을 위해 예비되어 있으며’보다 한국어에서 더 자연스럽습니다. 또한 ‘악을 행하는 자들에게는 악이 함께 있습니다’는 원문의 반복과 동반 관계를 살리면서 현대의 격식 있는 문장으로 자연스럽습니다. 각주의 ‘내 재산에서 먹겠다’와 ‘남에게 남겨 두고’는 한국어 관용상 다듬는 것이 좋습니다.
  terminology: ‘어리석음’, ‘어둠’, ‘범법자’, ‘악을 행하는 자’, ‘악’은 지혜문학의 격식과 원문의 어휘 반복을 적절히 반영합니다. ‘범법자’는 פושעים의 의도적 위반이라는 뉘앙스를 충분히 보존합니다.
