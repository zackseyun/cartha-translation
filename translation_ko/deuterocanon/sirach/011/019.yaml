  text: Folly and darkness are reserved for transgressors[a], and evildoers have evil with them.
  footnotes:
  - marker: a
    text: 'Greek parallel: ''When he says, “I have found rest, and now I will eat from my goods,” he does not know what time will pass by, and he will leave them to others and die.'' The Hebrew witness here differs sharply from the Greek tradition.'
