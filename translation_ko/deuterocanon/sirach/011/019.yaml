  text: Folly and darkness are reserved for transgressors[a], and evildoers have evil with them.
  footnotes:
  - marker: a
    text: 'Greek parallel: ''When he says, “I have found rest, and now I will eat from my goods,” he does not know what time will pass by, and he will leave them to others and die.'' The Hebrew witness here differs sharply from the Greek tradition.'
    reason: alternative_reading
translation:
  language: ko
  text: 어리석음과 어둠은 범법자들을 위해 예비되어 있으며, 악을 행하는 자들은 자기들과 함께 악을 지닙니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '그리스어 병행본은 이렇게 다릅니다: “그가 말하기를, ‘나는 안식을 찾았다. 이제 내 재산에서 먹겠다.’ 그러나 그는 시간이 지나갈 것을 알지 못하고, 그것들을 남에게 남겨 두고 죽게 됩니다.” 히브리어 증언은 여기서 그리스어 전통과 크게 다릅니다.'
    reason: textual_variant
lexical_decisions:
- source_word: שִׂכְלוּת
  english_pob_choice: folly
  chosen_korean: 어리석음
  alternatives_korean:
  - 우매함
  - 무지
  lexicon: HALOT
  rationale: 지혜문학 문맥에서 שִׂכְלוּת의 도덕적·지혜적 반대 개념을 살리기 위해 '어리석음'을 택했습니다.
- source_word: וְחֹשֶׁךְ
  english_pob_choice: and darkness
