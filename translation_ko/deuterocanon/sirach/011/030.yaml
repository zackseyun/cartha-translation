base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/011/030.yaml
  text: A good day makes one forget trouble[a], and a bad day makes one forget prosperity; and a man's end will be set before him.
  footnotes:
  - marker: a
    text: Hebrew literally, 'and a man's end will be upon him.' The sense may be that a person's final outcome confronts him or overtakes him. The Greek parallel at this point differs substantially from the extant Hebrew and does not clarify the clause.
    reason: alternative_reading
translation:
  language: ko
  text: 좋은 날은 불행을 잊게 하고, 나쁜 날은 번영을 잊게 하며, 사람의 마지막은 그에게 닥칠 것입니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘사람의 마지막이 그에게/그 위에 있을 것이다’입니다. 이 표현은 그 사람의 최종 결과가 그에게 닥치거나 그를 마주한다는 뜻일 수 있습니다. 이 대목의 그리스어 병행 본문은 현존 히브리어 본문과 크게 달라 이 절의 뜻을 더 명확히 해 주지 않습니다.
    reason: ‘그에게/그 위에’라는 히브리어 전치사 표현의 문자적 의미와, ‘닥치다’라는 한국어 번역이 지닌 문맥적 해석을 투명하게 제시합니다.
lexical_decisions:
- source_word: טוֹב יוֹם
  english_pob_choice: A good day
  chosen_korean: 좋은 날
  alternatives_korean:
  - 복된 날
  - 좋은 하루
  - 호의적인 날
  lexicon: HALOT
  rationale: 히브리어의 짧은 관용구를 자연스러운 현대 한국어로 옮기되, 단순한 감탄이 아니라 형편이 좋은 때를 가리키는 말로 유지했습니다.
- source_word: תִּשָּכַח רָעָה
  english_pob_choice: makes one forget trouble
  chosen_korean: 재앙을 잊게 하고
  alternatives_korean:
  - 고통을 잊게 하고
  - 불행을 잊게 하고
  - 악을 잊게 하고
  lexicon: HALOT
  rationale: 여기서 רָעָה는 도덕적 악보다 경험적 불행·재난의 뜻이 더 강하므로, 한국어에서는 '재앙'으로 옮겨 대조를 선명하게 했습니다.
- source_word: תִּשָׁכַח טוֹבָה
  english_pob_choice: makes one forget prosperity
  chosen_korean: 번영을 잊게 합니다
  alternatives_korean:
  - 좋음을 잊게 합니다
  - 행복을 잊게 합니다
  - 복을 잊게 합니다
  lexicon: HALOT
  rationale: טוֹבָה를 단순한 감정이 아니라 좋은 형편과 성공 상태로 이해하여, 앞의 '재앙'과 대조되는 '번영'으로 옮겼습니다.
- source_word: וְאַחֲרִית אָדָם תִּהְיֶה עָלָיו
  english_pob_choice: and a man's end will be set before him
  chosen_korean: 그러나 사람의 끝은 그에게 드러납니다
  alternatives_korean:
  - 그리고 사람의 끝은 그 위에 있습니다
  - 사람의 마지막은 그에게 임합니다
  - 사람의 결말은 그 앞에 놓입니다
  lexicon: HALOT
  rationale: אַחֲרִית אָדָם과 עָלָיו는 문자적으로 '사람의 끝이 그 위에/그에게 있다'는 뜻이어서, 문맥상 최종 결과가 그에게 마주 오거나 드러나는 의미를 살려 옮겼습니다. POB의 영어도 이 구절을 해석적으로 처리하므로, 한국어 역시 직역보다 의미를 우선했습니다.
theological_decisions:
- issue: 마지막 절의 모호한 종결 표현
  chosen_reading: 사람의 끝은 그에게 드러납니다
  alternative_readings:
  - 사람의 끝은 그 위에 있습니다
  - 사람의 끝이 그에게 임합니다
  rationale: 히브리어 עָלָיו는 물리적 위치라기보다 당사자에게 닥치거나 드러나는 종결을 가리킬 수 있으므로, 최종 결말이 개인 앞에 노출된다는 의미를 보존했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy; contested expressions in wisdom literature
- issue: אָדָם의 일반적 용법
  chosen_reading: 사람
  alternative_readings:
  - 인간
  - 한 사람
  - 남자
  rationale: 여기서 אָדָם은 특정 남성이 아니라 일반적 인간을 가리키므로, 성별을 불필요하게 부각하지 않는 '사람'으로 옮겼습니다.
  doctrine_reference: 'DOCTRINE.md §Translation philosophy 4; Contested terms: אָדָם'
