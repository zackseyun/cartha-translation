translation:
  language: ko
  text: “내 앞에 있는 것으로 충분합니다. 어떤 재난이 제게 닥치겠습니까?”라고 말하지 마십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 “모든 사람을 당신의 집에 들이지 마십시오. 간사한 자의 매복은 많습니다.”라고 읽습니다. 이는 현전하는 히브리어와 상당히 다른 본문 형태입니다.
    reason: textual_variant
lexical_decisions:
- source_word: אַל תֹּאמַר
  english_pob_choice: Do not say
  chosen_korean: 말하지 마십시오
  alternatives_korean:
  - 말하지 마라
  - 말하지 마세요
  lexicon: HALOT
  rationale: אָמַר의 직접적인 금지 명령을 살려, 경계의 말을 실제로 입에 올리지 말라는 뜻을 분명하게 전합니다.
- source_word: דַּיִּי
  english_pob_choice: I have enough
  chosen_korean: 충분하다
  alternatives_korean:
  - 내게 충분하다
  - 나는 만족한다
  lexicon: HALOT
  rationale: ‘충분함, 넉넉함’의 뜻을 자연스러운 한국어로 옮겨, 현재 가진 것으로 충분하다고 자족하는 뉘앙스를 살렸습니다.
- source_word: לְפָנַי
  english_pob_choice: before me
  chosen_korean: 내 앞에
  alternatives_korean:
  - 내게
  - 곁에
  lexicon: HALOT
  rationale: 히브리어의 공간적 이미지를 그대로 살리면서도 한국어에서 어색하지 않게 ‘내 앞에’로 옮겼습니다.
- source_word: מַה אָסוֹן
  english_pob_choice: what disaster
  chosen_korean: 어떤 재난
  alternatives_korean:
  - 어떤 재앙
  - 무슨 화
  lexicon: HALOT
  rationale: אָסוֹן의 무게를 반영해 단순한 ‘해’보다 강한 ‘재난’으로 옮겼습니다.
- source_word: יְהִי עָלָי
  english_pob_choice: could come upon me
  chosen_korean: 닥치겠습니까
  alternatives_korean:
  - 나에게 올까요
  - 나를 덮치겠습니까
  lexicon: HALOT
  rationale: 직역의 ‘내 위에 있을 것이다’보다, 수사적 질문 속에서 닥쳐오는 재난의 긴박함을 자연스럽게 드러내는 표현을 택했습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행문의 차이
  chosen_reading: 주 본문은 현전하는 히브리어를 따르고, 그리스어의 크게 다른 형태는 각주로 보존했습니다.
  alternative_readings:
  - ‘사람마다 집에 들이지 마십시오. 속이는 자의 올무는 많습니다.’
  rationale: 지혜문학에서는 히브리어가 남아 있는 경우 그 본문을 우선하면서, 의미가 크게 다른 그리스어 전승은 독자에게 숨기지 않는 것이 투명합니다.
  doctrine_reference: 'PHILOSOPHY.md: 히브리어 현전 본문 우선, 대체 전승은 정직하게 보존'
