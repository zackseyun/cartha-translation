base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/011/002.yaml
  text: Do not praise a man for his appearance[a], and do not despise a man who is ugly in his looks.
  footnotes:
  - marker: a
    text: 'Greek parallel: ''Do not praise a man in his beauty, and do not despise a person in his appearance.'' The Hebrew''s first clause is broader (''appearance'') while the Greek narrows it to ''beauty.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 사람의 외모를 보고 칭찬하지 마십시오. 또한 겉모습이 못생긴 사람을 업신여기지 마십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 첫 절에서 ‘외모/형태’를 더 넓게 말하고, 그리스어 병행본문은 이를 ‘아름다움’으로 좁혀 표현합니다.
    reason: source_note
lexical_decisions:
- source_word: אַל תְּהַלֵּלו / μὴ αἰνέσῃς
  english_pob_choice: Do not praise
  chosen_korean: 칭찬하지 마십시오
  alternatives_korean:
  - 찬양하지 마십시오
  - 높이 평가하지 마십시오
  lexicon: HALOT; LXX αἰνέω
  rationale: 히브리어 힐렐과 그리스어 αἰνέω는 긍정적으로 평가하거나 칭찬한다는 뜻이므로, 현대 합쇼체에서는 자연스럽고 직접적인 ‘칭찬하다’가 적절합니다.
- source_word: אָדָם / ἄνδρα, ἄνθρωπον
  english_pob_choice: a man
  chosen_korean: 사람
  alternatives_korean:
  - 한 사람
  - 남자
  lexicon: HALOT; LSJ
  rationale: 문맥은 특정 성별 강조보다 개별 인간 일반을 가리키므로, 한국어에서는 성별을 과도하게 드러내지 않는 ‘사람’이 가장 자연스럽습니다.
- source_word: בְּתָאֳרוֹ / ἐν κάλλει αὐτοῦ
  english_pob_choice: for his appearance
  chosen_korean: 외모를 보고
  alternatives_korean:
  - 모습을 보고
  - 아름다움을 보고
  lexicon: HALOT; LXX
  rationale: 히브리어 תֹּאַר은 외형·외모를 가리키고, 그리스어는 ‘아름다움’으로 더 좁혀집니다. 본문은 넓은 히브리어 의미를 살려 ‘외모를 보고’로 옮겼습니다.
- source_word: מְכוֹעָר / βδέλυξῃ
  english_pob_choice: ugly in his looks
  chosen_korean: 겉모습이 못생긴
  alternatives_korean:
  - 외모가 못난
  - 보기 흉한
  lexicon: HALOT; LSJ
  rationale: 형용사 מְכוֹעָר는 단순히 미적 취향이 아닌 눈에 거슬리는 외형을 뜻하므로, 직설적이되 과도하게 비속하지 않은 ‘못생긴’이 적절합니다.
theological_decisions:
- issue: 첫째 절의 판단 기준을 외형적 아름다움으로 한정하는지 여부
  chosen_reading: 이 절은 사람의 가치를 외모나 보이는 조건으로 재단하지 말라는 지혜 교훈으로 읽었습니다.
  alternative_readings:
  - 단순한 예절 규범
  - 미적 판단을 금하는 일반 도덕 교훈
  rationale: 히브리어와 그리스어의 대조 구조가 ‘칭찬/업신여김’이라는 상반된 태도를 외모에 연결하므로, 사회적 판단의 왜곡을 경계하는 지혜문으로 옮기는 것이 가장 충실합니다.
  doctrine_reference: 지혜문학의 인격 평가와 외적 기준 비판
