translation:
  language: ko
  text: 많은 사람이 집에 드나들지 못하게 하고, 아무나 집 안으로 들이지 마십시오. 숨어 노리는 이들이 많고, 속이는 자들도 많습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 전승을 주본문으로 따랐습니다. 병행하는 그리스어는 “낯선 이를 묵게 하면, 그가 너를 혼란에 빠뜨리고 네 소유에서 너를 떼어 놓을 것이다”라는 뜻에 가깝습니다. 이는 다른 본문형 또는 이 경고의 확장을 반영하는 것으로 보입니다.
    reason: alternative_reading
  - marker: b
    text: 이 절의 히브리어는 인용된 판본에서 대괄호로 표시된 부분이 있어, 현존 필사 전승의 복원 또는 불확실성을 나타냅니다.
    reason: textual_variant
lexical_decisions:
- source_word: מְנַע רַבִּים מִתּוֹךְ בֵּיתֶךָ
  english_pob_choice: Keep many out of your house
  chosen_korean: 집 안에서 많은 사람을 물리치고
  alternatives_korean:
  - 많은 사람을 당신의 집 밖에 두고
  - 많은 사람의 집 안 출입을 막고
  lexicon: HALOT
  rationale: מְנַע는 단순한 방지가 아니라 출입을 막는 뜻이므로, 현대 한국어에서 자연스러운 경고문투로 '물리치다'를 택해 배제의 뉘앙스를 살렸습니다.
- source_word: וְלֹא כָל אִישׁ לְהָבִיא אֶל בַּיִת
  english_pob_choice: do not bring every man into your home
  chosen_korean: 아무나 집 안으로 들이지 마십시오
  alternatives_korean:
  - 모든 사람을 집 안으로 들이지 마십시오
  - 모든 남자를 집 안으로 들이지 마십시오
  lexicon: HALOT
  rationale: אִישׁ의 남성형 형식을 직역하면 '남자'이지만, 격언체 경고의 일반성을 살리기 위해 한국어에서는 '아무나'로 풀어 의미를 분명히 했습니다.
- source_word: אוֹרְבִים
  english_pob_choice: many lie in wait
  chosen_korean: 많은 사람이 매복하고 있으며
  alternatives_korean:
  - 많은 사람이 숨어 해치려 하며
  - 많은 사람이 노리고 있으며
  lexicon: HALOT
  rationale: 분사형은 단순한 존재 진술보다 현재적 상태를 드러내므로, '매복하다'를 써서 위협의 긴박한 이미지를 보존했습니다.
- source_word: נוֹכְלִים
  english_pob_choice: many are deceivers
  chosen_korean: 많은 사람이 속이는 자들입니다
  alternatives_korean:
  - 많은 사람이 속임수꾼입니다
  - 많은 사람이 기만하는 자들입니다
  lexicon: HALOT
  rationale: נוֹכְלִים은 교활하게 속이는 사람들을 가리키므로, 뜻을 직접 드러내는 '속이는 자들'이 가장 분명합니다.
- source_word: וְכֵן
  english_pob_choice: and many are deceivers
  chosen_korean: 그리고 또한
  alternatives_korean:
  - 그와 같이
  - 그뿐 아니라
  lexicon: HALOT
  rationale: 히브리어의 וְכֵן은 앞의 경계 대상과 뒤의 경계 대상을 병렬로 연결하므로, 한국어에서는 문장 구조상 이미 '많은 사람이'를 반복해 병렬성을 드러냈습니다.
theological_decisions:
- issue: 지혜문학의 경고 어조
  chosen_reading: 훈계로서의 일반적 경계 명령을 살려 직접적인 금지형으로 옮겼습니다.
  alternative_readings:
  - 완곡한 조언형으로 완화하는 번역
  - 교회적 환대 강조로 부드럽게 조정하는 번역
  rationale: 본문은 손님 접대의 무조건적 미덕보다 분별을 강조하는 격언이므로, 경고의 힘을 약화시키지 않도록 금지형을 유지했습니다.
  doctrine_reference: 지혜문학의 분별과 경계 원리
- issue: 본문 전승 차이
  chosen_reading: 히브리어를 본문으로 두고, 그리스어 병행본의 다른 확장 의미는 본문에 흡수하지 않았습니다.
  alternative_readings:
  - 그리스어처럼 '외인을 들이면 혼란에 빠진다'는 내용을 본문에 반영하는 번역
  - 그리스어 확장을 각주로만 처리하는 번역
  rationale: 제시된 원전에서 히브리어가 주본이며, 그리스어는 다른 본문형을 시사하므로 본문은 히브리어의 경고를 따르고 별도 본문 확장은 두지 않았습니다.
  doctrine_reference: 본문비평과 전승사
