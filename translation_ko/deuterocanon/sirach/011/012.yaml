    rationale: 그리스어는 ‘게으르고 도움이 필요하며, 힘이 부족하고 가난한 사람’ 및 ‘주님의 눈이 그를 선하게 돌아보셨고 그를 그의 비천함에서 일으키셨다’고 말합니다. ‘긍휼’은 가능한 신학적 함의일 수 있으나 명시된 표현이 아니므로, 본문 전승 차이를 알리는 각주에서는 피하는 편이 정확합니다.
  revised_text: 내 아들아, 네가 달리지 않으면 도달하지 못하고, 네가 찾지 않으면 발견하지 못합니다.[a]
