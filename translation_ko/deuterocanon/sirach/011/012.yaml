base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/011/012.yaml
  text: My son[a], if you do not run, you will not attain; and if you do not seek, you will not find.
  footnotes:
  - marker: a
    text: The Greek witness at this point differs substantially, reading instead about a person who is sluggish, lacking strength, and poor, whom the eyes of the Lord look upon for good and raise from humiliation. The Hebrew here is therefore followed as the primary witness, with the Greek preserved as a significant alternative textual tradition.
    reason: textual_variant
translation:
  language: ko
  text: 내 아들아, 네가 달리지 않으면 도달하지 못하고, 네가 찾지 않으면 발견하지 못합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 절의 그리스어 증인은 내용이 크게 다르며, 게으름·무력함·가난함과 주님의 긍휼스러운 돌보심 및 낮아짐에서의 일으키심을 말합니다. 따라서 여기서는 히브리어 본문을 따르고 그리스어 전승은 중요한 대안 본문으로 보존합니다.
    reason: textual_variant
lexical_decisions:
- source_word: בְּנִי
  english_pob_choice: My son
  chosen_korean: 내 아들아
  alternatives_korean:
  - 내 아이야
  - 내 자녀야
  lexicon: HALOT
  rationale: 지혜 문학의 직접 호칭으로서 남성 단수의 친자 관계를 살리면서도, 한국어에서는 호격 감탄형을 써서 구어적 권면의 톤을 자연스럽게 살렸습니다.
- source_word: תָּרוּץ
  english_pob_choice: run
  chosen_korean: 달리지
  alternatives_korean:
  - 뛰지
  - 서두르지
  lexicon: HALOT
  rationale: 동작 이미지를 그대로 살리는 기본 의미인 ‘달리다’를 유지해, 행위의 적극성과 노력의 비유를 보존했습니다.
- source_word: תַגִּיעַ
  english_pob_choice: attain
  chosen_korean: 도달하지 못하고
  alternatives_korean:
  - 이르지 못하고
  - 얻지 못하고
  lexicon: HALOT
  rationale: 직역적 공간 이동보다 결과 도달의 의미를 넓게 담는 ‘도달하다’가 지혜문학의 목표-성취 구도를 자연스럽게 반영합니다.
- source_word: תְּבַקֵּשׁ
  english_pob_choice: seek
  chosen_korean: 찾지
  alternatives_korean:
  - 구하지
  - 추구하지
  lexicon: HALOT
  rationale: 앞 절과 평행을 이루는 동사로서, 한국어에서는 ‘찾다’가 의미 범위를 가장 무리 없이 담아 ‘발견하다’와의 대응을 살립니다.
- source_word: תִמְצָא
  english_pob_choice: find
  chosen_korean: 발견하지 못합니다
  alternatives_korean:
  - 찾지 못합니다
  - 얻지 못합니다
  lexicon: HALOT
  rationale: 마지막 동사는 평행법의 종결을 분명히 하기 위해 ‘발견하다’를 택해, 단순한 재발견보다 목표 성취의 결과를 드러냈습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행본문의 차이
  chosen_reading: 본문은 현존 히브리어 잠언을 따라 옮기고, 그리스어 전승의 현저한 상이성은 각주로 표시합니다.
  alternative_readings:
  - 그리스어 전승의 ‘나태함, 무력함, 가난함, 주님의 눈이 그를 돌아보심, 낮아짐에서의 일으키심’ 쪽으로 맞춤
  rationale: 이 절은 히브리어와 그리스어가 내용상 크게 다르므로, 주요 본문은 히브리어를 따르되 대안 전승이 실제로 다르다는 점을 투명하게 남기는 것이 가장 충실합니다.
  doctrine_reference: 'PHILOSOPHY.md ''What we are translating'' / DOCTRINE.md §Translation philosophy #1'
