base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/011/006.yaml
  text: Many who were oppressed sat on a throne[b][a], and one not thought of put on a turban.
  footnotes:
  - marker: a
    text: Or, more idiomatically, 'an unexpected person received high honor.' The Hebrew says 'did not come up on the heart' and then 'put on a turban,' using a concrete image for sudden elevation.
    reason: lexical_alternative
  - marker: b
    text: The Greek parallel differs in wording, reading instead that many rulers were greatly dishonored and illustrious men were handed over into the hands of others. Both forms express reversal of status.
    reason: alternative_reading
translation:
  language: ko
  text: 많은 사람이 억눌린 채 왕좌에 앉았고[a], 뜻밖의 사람이 터번을 썼습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘마음에 올라오지 않았던 사람’이라는 뜻으로, 영어 POB의 ‘one not thought of’처럼 예상 밖의 사람이 높아졌다는 의미입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַבִּים
  english_pob_choice: Many
  chosen_korean: 많은 사람
  alternatives_korean:
  - 많은 이들
  - 무수한 사람들
  lexicon: HALOT
  rationale: 수량 표현을 자연스럽게 옮기되, 지혜문학의 일반적 진술로 읽히도록 간결하게 처리했습니다.
- source_word: נִדְכָּאִים
  english_pob_choice: who were oppressed
  chosen_korean: 억눌린 채
  alternatives_korean:
  - 압제받은 채
  - 짓눌린 채
  - 억압받은 사람들
  lexicon: HALOT
  rationale: ‘짓눌리다/억압되다’의 수동적 상태를 살리면서, 뒤의 상승 이미지와 대비가 되도록 했습니다.
- source_word: יָשְׁבוּ עַל כִּסֵּא
  english_pob_choice: sat on a throne
  chosen_korean: 왕좌에 앉았고
  alternatives_korean:
  - 보좌에 앉았고
  - 왕위에 올랐고
  - 좌정했고
  lexicon: HALOT
  rationale: כִּסֵּא를 단순한 ‘자리’보다 통치권을 암시하는 ‘왕좌’로 옮겨, 문맥의 신분 역전 의미를 드러냈습니다.
- source_word: עָטוּ צְנִיף
  english_pob_choice: put on a turban
  chosen_korean: 터번을 썼습니다
  alternatives_korean:
  - 두건을 썼습니다
  - 관모를 썼습니다
  - 터번을 둘렀습니다
  lexicon: HALOT
  rationale: צְנִיף의 구체적 이미지를 유지하면서도, 한국어에서 자연스러운 ‘쓰다’ 표현으로 옮겼습니다.
theological_decisions:
- issue: 시편적·지혜문학적 신분 역전의 표현 방식
  chosen_reading: 히브리어의 구체적 이미지인 ‘터번을 썼습니다’를 유지해, 갑작스러운 상승과 명예 부여의 놀라움을 직접적으로 보이게 했습니다.
  alternative_readings:
  - 더 추상적으로 ‘영예를 얻었습니다’로 옮김
  - 그리스어 병행본문처럼 ‘다른 이들의 손에 넘겨졌다’ 쪽을 따름
  rationale: 이 구절은 히브리어 본문이 우선이며, 그리스어는 같은 주제를 다른 어휘로 확인해 줍니다. 따라서 원문이 가진 감각적·서사적 힘을 지키는 것이 적절합니다.
  doctrine_reference: '번역 원칙: 히브리어 본문 우선, 병행 그리스어는 의미 확인용으로 사용'
- issue: ‘여럿’이 아닌 일반적 다수 표현
  chosen_reading: ‘많은 사람’으로 평이하게 옮겨, 개인 특정이 아니라 광범위한 신분 역전을 말하는 지혜문학적 일반성을 살렸습니다.
  alternative_readings:
  - ‘많은 이들’
  - ‘수많은 자들’
  rationale: 본문은 특정 인물의 이야기가 아니라 보편적 교훈을 주는 격언형 진술이므로, 한국어에서도 과도한 개별화를 피했습니다.
  doctrine_reference: 지혜문학의 일반 명제 전달
