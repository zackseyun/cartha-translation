  verdict: revise
  source_fidelity: 본문은 이 절에 대해 일관된 그리스어 병행본(ἔστιν κοπιῶν καὶ πονῶν καὶ σπεύδων, καὶ τόσῳ μᾶλλον ὑστερεῖται)을 따르며, 제공된 히브리어 행의 불일치를 각주로 밝히는 판단이 타당합니다. 다만 ‘그럴수록’은 원문의 비교 강조를 조건·상관관계로 다소 강하게 풀어냅니다.
  naturalness: ‘부족해집니다’는 사람이 그 자체로 불완전해진다는 뜻으로도 들릴 수 있어 ὑστερεῖται가 말하는 결핍 상태를 자연스럽게 전달하지 못합니다. ‘부족함을 겪습니다’가 결핍의 대상과 영역을 특정하지 않으면서도 현대 표준어 합쇼체로 자연스럽습니다.
  terminology: ‘애쓰고 수고하며 서두르는’은 κοπιῶν, πονῶν, σπεύδων의 누적된 노고와 조급함을 무리 없이 구별합니다. 본문비평 각주는 절의 본문 선택과 히브리어 증언의 불일치를 충분히 알립니다.
  issues:
  - severity: medium
    issue: ‘부족해집니다’의 의미와 결속
    rationale: ὑστερεῖται는 ‘결핍을 겪다/부족하다’라는 결과 상태이지, 그 사람이 ‘부족한 존재가 되다’라는 뜻은 아닙니다. ‘부족함을 겪습니다’로 고치면 의미가 명료하고 자연스럽습니다.
  - severity: low
    issue: ‘그럴수록’의 명시적 상관관계
