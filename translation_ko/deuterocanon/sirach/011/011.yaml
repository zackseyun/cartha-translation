translation:
  language: ko
  text: 노력하며 수고하고 서두르는 이가 있습니다. 그러나 그럴수록 오히려 더 부족해집니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 제공된 카이로 게니자 히브리어 행은 이 절의 그리스어 병행본과 일치하지 않습니다. 본문은 그리스어 증거를 따랐습니다.
    reason: textual_variant
lexical_decisions:
- source_word: ἔστιν
  english_pob_choice: There is
  chosen_korean: …이 있습니다
  alternatives_korean:
  - …가 있습니다
  - …이 하나 있습니다
  lexicon: LSJ
  rationale: 존재를 알리는 도입부로 처리해, 뒤의 묘사절이 한 부류의 사람을 제시한다는 점을 자연스럽게 살렸습니다.
- source_word: κοπιῶν καὶ πονῶν
  english_pob_choice: labors and toils
  chosen_korean: 노력하며 수고하고
  alternatives_korean:
  - 일하며 애쓰고
  - 수고하며 애쓰고
  lexicon: BDAG
  rationale: 서로 겹치지만 뉘앙스가 다른 두 동작어의 누적을 살리기 위해, ‘노력하다/수고하다’의 병치를 사용했습니다.
- source_word: σπεύδων
  english_pob_choice: hurries
  chosen_korean: 서두르는
  alternatives_korean:
  - 재촉하는
  - 급히 움직이는
  lexicon: BDAG
  rationale: 앞선 노고의 누적 위에 더해지는 조급한 속도를 한국어 현재분사형으로 옮겼습니다.
- source_word: τόσῳ μᾶλλον
  english_pob_choice: all the more
  chosen_korean: 그럴수록 오히려 더
  alternatives_korean:
  - 그만큼 더
  - 더욱더
  lexicon: BDAG
  rationale: 노력이 늘수록 결핍이 심해지는 역설적 비교를 드러내기 위해 ‘오히려’를 보탰습니다.
- source_word: ὑστερεῖται
  english_pob_choice: he comes up short
  chosen_korean: 부족해집니다
  alternatives_korean:
  - 뒤처집니다
  - 모자라게 됩니다
  - 부족함을 겪습니다
  lexicon: BDAG
  rationale: 결과 상태의 결핍을 직접적으로 드러내되, 무엇이 부족한지 특정하지 않는 표현을 택했습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행본의 상이함
  chosen_reading: 본문은 이 절의 그리스어 병행본이 보여 주는 ‘노력하지만 더 부족해지는 사람’의 의미를 따라 번역하고, 히브리어 불일치는 각주로 표시합니다.
  alternative_readings:
  - ‘내 아들아, 어찌하여 네 압제를 더하느냐…’로 시작하는 히브리어식 직역
  rationale: 제공된 히브리어 행은 이 절의 그리스어와 직접 대응하지 않으므로, 출처가 확인되는 병행 전승을 본문에 두고 변이를 투명하게 기록하는 것이 가장 정직합니다.
  doctrine_reference: 'Sirach textual tradition: preserve the most coherent witness while documenting manuscript mismatch honestly.'
