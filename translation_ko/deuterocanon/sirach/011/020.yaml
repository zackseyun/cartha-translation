translation:
  language: ko
  text: 당신의 언약에 굳게 서서 그것을 지키고, 당신의 일에 늙도록 힘쓰십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 전승은 ‘의인의 선물은 그를 경외하는 자들을 위해 서며, 그의 호의는 영원히 형통할 것이다’로 읽습니다. 히브리어와 그리스어는 이 절에서 크게 다릅니다.
    reason: alternative_reading
lexical_decisions:
- source_word: στῆθι ἐν διαθήκῃ σου
  english_pob_choice: Stand by your covenant
  chosen_korean: 당신의 언약에 굳게 서십시오
  alternatives_korean:
  - 당신의 언약 안에 서십시오
  - 당신의 언약을 지키십시오
  - 언약에 머무르십시오
  lexicon: BDAG
  rationale: διαθήκη는 성경적·언약적 의미에서 ‘언약’이 자연스럽고, στῆθι는 단순 위치가 아니라 흔들리지 않는 지속을 요구하므로 ‘굳게 서다’로 옮겼습니다.
- source_word: ὁμίλει ἐν αὐτῇ
  english_pob_choice: attend to it
  chosen_korean: 그것을 지키고
  alternatives_korean:
  - 그것을 살피고
  - 그것에 힘쓰고
  - 그것과 함께 지내고
  lexicon: BDAG
  rationale: ὁμιλέω는 여기서 단순한 말하기보다 언약에 대한 지속적 관여를 가리키므로, 한국어로는 의미를 살려 ‘지키다’로 옮겨 실천적 충실성을 드러냈습니다.
- source_word: ἐν τῷ ἔργῳ σου παλαιώθητι
  english_pob_choice: grow old in your work
  chosen_korean: 당신의 일에 늙도록 힘쓰십시오
  alternatives_korean:
  - 당신의 일에서 늙으십시오
  - 당신의 일에 오래도록 힘쓰십시오
  - 당신의 일에 평생 힘쓰십시오
  lexicon: BDAG
  rationale: παλαιώθητι는 문자적으로 ‘늙다/오래되다’의 이미지가 있으므로, 장구한 충성을 보이도록 ‘늙도록 힘쓰다’로 옮겨 노년까지 이어지는 지속성을 살렸습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 평행본문의 차이
  chosen_reading: 본문 번역은 그리스어 평행본문의 명령형 연속을 따르되, 이 구절의 히브리어 이본은 각주로 보존했습니다.
  alternative_readings:
  - '히브리어 본문: ‘의인의 선물은 그를 경외하는 자들을 위해 서며, 그의 호의는 영원히 형통할 것이다.’'
  rationale: 이 절은 히브리어와 그리스어가 크게 다르며, POB의 문서화된 판단처럼 본문은 그리스어를 따라 읽는 것이 문맥상 일관됩니다. 다만 히브리어 전승도 중요한 대안 읽기이므로 삭제하지 않았습니다.
  doctrine_reference: 'PHILOSOPHY.md: source uncertainty를 숨기지 않고, 병행 전승을 명시적으로 보존한다.'
