  yaml_path: translation/deuterocanon/sirach/011/022.yaml
  text: And at the time he says, “I have found rest,” then now he will eat from his good things.
  footnotes:
  - marker: a
    text: Hebrew literally, 'And now I will eat from my good things.' The clause may be taken as continuing the man's speech in the first person; the main text renders it as narrative for smoother sense.
    reason: alternative_reading
  - marker: b
    text: 'The Greek parallel differs substantially: ''The blessing of the Lord is in the reward of the godly, and in a swift hour his blessing causes flourishing.'' The Hebrew and Greek appear to reflect different textual forms at this point.'
    reason: textual_variant
translation:
  language: ko
  text: 그때 그가 말하기를 “내가 안식을 얻었다”고 할 때, 이제 그는 자기 좋은 것들을 먹을 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘그리고 이제 나는 나의 좋은 것들에서 먹을 것이다’입니다. 이 구절은 화자의 1인칭 발화가 계속되는 것으로도 읽을 수 있으므로, 본문은 서술형으로 다듬었습니다.
    reason: alternative_reading
  - marker: b
    text: '그리스어 평행본문은 크게 다릅니다: ‘주님의 복은 경건한 이의 보상에 있으며, 빠른 시간에 그의 복이 번성하게 합니다.’ 이 지점에서 히브리어와 그리스어는 서로 다른 본문 형태를 반영하는 듯합니다.'
    reason: textual_variant
lexical_decisions:
- source_word: וּבְעֵת
  english_pob_choice: And at the time
  chosen_korean: 그때
  alternatives_korean:
  - 그 시기에
  - 그리고 그때
  lexicon: HALOT
  rationale: 시점을 가리키는 פתיחה를 간결하게 살려, 서술 흐름을 자연스럽게 시작합니다.
- source_word: יֹאמַר
  english_pob_choice: he says
  chosen_korean: 그가 말하기를
  alternatives_korean:
  - 그가 말합니다
  - 그가 말하듯이
  lexicon: HALOT
  rationale: 문맥상 자기만족의 말을 직접 인용하는 구조이므로, 한국어에서는 인용 도입형으로 옮기는 편이 원문 효과를 잘 드러냅니다.
- source_word: נַחַת
  english_pob_choice: rest
  chosen_korean: 안식
  alternatives_korean:
  - 평안
  - 휴식
  - 편안함
  lexicon: HALOT
  rationale: נחת의 정착된 평온/쉼을 나타내며, 한국어에서는 단순한 휴식보다 더 안정된 상태를 보여 주는 ‘안식’이 적절합니다.
- source_word: מִטּוֹבָתִי
  english_pob_choice: from his good things
  chosen_korean: 자기 좋은 것들
  alternatives_korean:
  - 내 좋은 것들
  - 자기 재산에서
  - 자기 번영에서
  lexicon: HALOT
  rationale: 히브리어는 1인칭 접미사를 가지지만, POB 영어는 문맥상 인물의 소유물/풍요를 가리키는 것으로 읽습니다. 한국어 본문은 그 의미를 따라 중립적으로 ‘자기 좋은 것들’로 옮기고, 1인칭 가능성은 각주로 남깁니다.
theological_decisions:
- issue: 히브리어 본문의 화자 인칭이 문맥상 1인칭인지 3인칭인지
  chosen_reading: 본문은 서술체로 옮기되, 주석 없이 본문만 읽어도 자가만족의 발언이 드러나도록 했습니다.
  alternative_readings:
  - 그는 말하기를 “내가 안식을 얻었다”고 할 때, 이제 나는 나의 좋은 것들을 먹을 것입니다.
  rationale: Kahana 본문은 מִטּוֹבָתִי의 1인칭 접미사 때문에 직접화법이 지속되는지, 혹은 서술자가 인물을 묘사하는지 긴장이 있습니다. POB의 판단을 따라 본문은 자연스러운 서술로 제시하되, 대안 독법을 각주로 보존합니다.
  doctrine_reference: 본문비평/해석학
