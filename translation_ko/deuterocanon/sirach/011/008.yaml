base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/011/008.yaml
  text: Before you investigate[a], do not find fault; examine first[b], and afterward rebuke.
  footnotes:
  - marker: a
    text: Hebrew wording in the second half is difficult. The Greek witness reads, 'Before you hear, do not answer, and in the midst of words do not interject.'
    reason: alternative_reading
  - marker: b
    text: The Hebrew verb rendered 'find fault' may more literally suggest 'twist' or 'pervert'; the translation gives its likely sense here as warning against premature adverse judgment.
    reason: lexical_alternative
translation:
  language: ko
  text: 조사하기 전에는 섣불리 흠잡지 마십시오.[a] 먼저 살펴보고, 그 뒤에 책망하십시오.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 문자적으로 ‘비틀다’ 또는 ‘왜곡하다’에 더 가깝습니다. 여기서는 성급한 부정적 판단을 경계하는 뜻으로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 본문의 후반부는 난해합니다. 그리스어 증인은 이 절을 “듣기 전에 대답하지 말고, 말하는 중간에 끼어들지 말라”라고 다르게 읽습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּטֶרֶם תַּחְקוֹר
  english_pob_choice: Before you investigate
  chosen_korean: 조사하기 전에
  alternatives_korean:
  - 살피기 전에
  - 탐구하기 전에
  lexicon: HALOT
  rationale: בְּטֶרֶם의 시간 부사 기능을 자연스럽게 살려 ‘~하기 전에’로 옮기고, תַּחְקוֹר의 ‘조사하다/살피다’ 의미를 일상적이면서도 문맥에 맞게 반영했습니다.
- source_word: אַל תְּסַלֵּף
  english_pob_choice: do not find fault
  chosen_korean: 함부로 판단하지 말고
  alternatives_korean:
  - 잘못을 찾지 말고
  - 비틀어 해석하지 말고
  - 왜곡하지 말고
  lexicon: HALOT
  rationale: 히브리어 סלף의 ‘비틀다/왜곡하다’ 가능성을 유지하면서도, 문맥상 성급한 부정적 판정을 경계하는 뜻을 한국어로 자연스럽게 드러내기 위해 ‘함부로 판단하지 말고’로 옮겼습니다.
- source_word: בַּקֵּר לְפָנִים
  english_pob_choice: examine first
  chosen_korean: 먼저 살핀 뒤에야
  alternatives_korean:
  - 먼저 조사한 뒤에야
  - 우선 검토한 뒤에야
  lexicon: HALOT
  rationale: בַּקֵּר의 ‘살피다/검토하다’ 의미를 살리고, לְפָנִים의 순서 강조를 ‘먼저 … 뒤에야’로 표현해 앞선 조사 후에만 반응하라는 흐름을 분명히 했습니다.
- source_word: וְאַחַר תַּזִּיף
  english_pob_choice: and afterward rebuke
  chosen_korean: 책망하십시오
  alternatives_korean:
  - 그 후에 책망하십시오
  - 그 뒤에 꾸짖으십시오
  - 그 후에 반박하십시오
  lexicon: HALOT
  rationale: 히브리어 본문은 어렵지만, POB가 채택한 ‘rebuke’를 따라 경고의 뉘앙스를 살렸습니다. 다만 원문의 순서상 앞선 조사와 대비되는 행위를 한국어 한 동사로 압축해 자연스럽게 표현했습니다.
theological_decisions:
- issue: 성급한 판단과 정죄를 경계하는 지혜 문맥
  chosen_reading: 이 절은 충분히 살피기 전에 남을 비판하거나 결론짓지 말라는 지혜 교훈으로 읽었습니다.
  alternative_readings:
  - 단순한 대화 예절로만 읽기
  - 말하기 전에 침묵하라는 기술적 지침으로만 읽기
  rationale: 히브리어와 그리스어 대조 모두, 근거 없이 반응하거나 비판을 서두르지 말라는 윤리적 권고를 지지하므로, 이를 본문의 핵심 의도로 반영했습니다.
  doctrine_reference: 잠언적 지혜 전통; 약 1:19와 유사한 신중한 경청의 원리
