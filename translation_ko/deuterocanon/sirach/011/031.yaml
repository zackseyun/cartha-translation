translation:
  language: ko
  text: 악한 때에는 즐거움을 잊게 되고, 사람의 끝은 그를 드러냅니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 ‘악한 때가 즐거움을 잊게 한다’고 말하지만, 그리스어 평행본문은 ‘좋은 것을 악으로 바꾸고…’라는 다른 형태로 전합니다. 본문은 여기서 현존 히브리어를 따랐습니다.
    reason: textual_variant
lexical_decisions:
- source_word: עֵת רָעָה
  english_pob_choice: an evil time
  chosen_korean: 악한 때
  alternatives_korean:
  - 재앙의 때
  - 고난의 때
  - 나쁜 때
  lexicon: HALOT
  rationale: עֵת는 일반적인 ‘때/시기’이고, רָעָה는 도덕적 악보다 불운·재앙의 뉘앙스를 띱니다. ‘악한 때’는 영어 POB의 직설성을 살리면서도 한국어 잠언체로 자연스럽습니다.
- source_word: תְּשַׁכֵּח תַּעֲנוּג
  english_pob_choice: makes pleasure be forgotten
  chosen_korean: 즐거움을 잊게 되고
  alternatives_korean:
  - 즐거움을 잊게 하며
  - 기쁨이 잊히게 하고
  - 즐거움을 잊게 만듭니다
  lexicon: HALOT
  rationale: 히필의 사역적 의미를 살려 ‘잊게 하다’로 옮겼습니다. ‘즐거움’은 תַּעֲנוּג의 쾌락/기쁨의 범위를 비교적 간결하게 담습니다.
- source_word: וְסוֹף אָדָם
  english_pob_choice: a man's end
  chosen_korean: 사람의 끝
  alternatives_korean:
  - 한 사람의 끝
  - 인간의 끝
  - 그 사람의 마지막
  lexicon: HALOT
  rationale: אָדָם의 대표적 보편성을 한국어 일반명사 ‘사람’으로 옮겼습니다. 잠언형 진술의 압축성을 살리면서 성중립적 의미도 유지합니다.
- source_word: יַגִּיד עָלָיו
  english_pob_choice: tells about him
  chosen_korean: 그를 드러냅니다
  alternatives_korean:
  - 그에 대해 말합니다
  - 그를 알게 합니다
  - 그에 관해 말해 줍니다
  lexicon: HALOT
  rationale: נגד의 ‘말하다/알리다’와 עָלָיו의 ‘그에 관하여’를 합쳐, 문맥상 ‘사람의 끝이 그 사람의 실체를 드러낸다’는 지혜문학적 의미를 더 자연스럽게 살렸습니다. 영어 POB의 revelatory sense와도 맞닿습니다.
theological_decisions:
- issue: אָדָם의 일반적 인간 지시를 한국어에서 어떻게 처리할지
  chosen_reading: 사람의 끝
  alternative_readings:
  - 한 사람의 끝
  - 인간의 끝
  rationale: 이 속담은 특정 남성 개인이 아니라 대표적 인간을 가리키므로, 문맥상 일반명사 ‘사람’이 가장 직역에 가깝고 현대 한국어 독자에게도 분명합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4; Contested terms table for אָדָם
