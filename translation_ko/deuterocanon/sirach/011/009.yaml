  text: My son[a], do not answer a matter before you hear it, and do not speak in the midst of conversation.
  footnotes:
  - marker: a
    text: 'Greek: ''Do not quarrel about a matter you have no need of, and do not sit in judgment with sinners.'' The extant Hebrew and Greek differ substantially here; the main text follows the surviving Hebrew witness, with the Greek preserved as an alternative textual tradition.'
    reason: textual_variant
translation:
  language: ko
  text: 내 아들아, 네가 듣기도 전에 말을 대답하지 말고, 대화 중간에 말하지 마십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 ‘내 아들아… 듣기 전에 대답하지 말고, 대화 중간에 말하지 말라’라고 전하며, 그리스어 본문은 이와 상당히 다릅니다.
    reason: textual_variant
lexical_decisions:
- source_word: בְּנִי
  english_pob_choice: My son
  chosen_korean: 내 아들아
  alternatives_korean:
  - 내 자녀야
  - 내 아들
  lexicon: HALOT
  rationale: 지혜훈계의 직접 호칭으로서 남성 단수 호칭을 살려 ‘아들’로 옮겼고, 한국어 호격에 맞게 ‘내 아들아’로 자연화했습니다.
- source_word: אַל תָּשִׁיב דָּבָר
  english_pob_choice: do not answer a matter
  chosen_korean: 말을 대답하지 말고
  alternatives_korean:
  - 일에 대답하지 말고
  - 사안에 응답하지 말고
  lexicon: HALOT
  rationale: דָּבָר는 여기서 단순한 ‘말’보다 ‘사안/말’의 폭을 가지지만, 한국어에서는 ‘말을 대답하다’가 성급한 응답 금지를 가장 직접적으로 전달합니다.
- source_word: טֶרֶם תִּשְׁמָע
  english_pob_choice: before you hear it
  chosen_korean: 네가 듣기도 전에
  alternatives_korean:
  - 듣기 전에
  - 아직 듣기도 전에
  lexicon: HALOT
  rationale: טֶרֶם의 선행성을 살리되, 한국어의 유연한 어순으로 ‘듣기도 전에’라고 옮겨 경고의 즉각성을 유지했습니다.
- source_word: וּבְתוֹךְ שִׂיחָה
  english_pob_choice: in the midst of conversation
  chosen_korean: 대화 중간에
  alternatives_korean:
  - 대화 한복판에서
  - 말하는 도중에
  lexicon: HALOT
  rationale: שִׂיחָה를 일상적 ‘대화’로 옮기면서, 중간 개입을 금하는 뜻을 자연스럽게 드러내기 위해 ‘중간에’를 선택했습니다.
- source_word: אַל תְּדַבֵּר
  english_pob_choice: do not speak
  chosen_korean: 말하지 마십시오
  alternatives_korean:
  - 말하지 말고
  - 입을 열지 마십시오
  lexicon: HALOT
  rationale: 직전 명령과 함께 평행을 이루는 금지형으로, 합쇼체 문체에 맞게 ‘말하지 마십시오’로 분명하게 표현했습니다.
theological_decisions:
- issue: 지혜문학의 훈계체 호칭과 한국어 높임말의 조화
  chosen_reading: 화자가 아들에게 직접 훈계하는 문맥을 유지하되, 본문 명령형은 합쇼체로 정리했습니다.
  alternative_readings:
  - 반말형 훈계
  - 전통적 교회체 종결
  rationale: 원문의 친밀한 아들 호칭은 살리되, 한국어 독자에게는 본문 전체를 현대 공식 문체로 읽히게 하는 것이 적절합니다.
  doctrine_reference: 지혜문학의 교육적 훈계체
