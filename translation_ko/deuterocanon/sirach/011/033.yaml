revisions:
- from: 죽기 전에 사람을 복되다고 하지 마십시오. 그의 끝에서 사람은 알려집니다.[a][b][c]
  to: 죽기 전에 사람을 복되다고[a] 부르지 마십시오. 사람은 그의 마지막에 이르러 드러납니다.[b][c]
  rationale: 히브리어의 ‘죽음 전에 … 복되다고 부르지 말라’는 금지와 ‘그의 끝/마지막에 사람이 알려지거나 드러난다’는 결론을 유지했습니다. 한국어에서는 ‘부르다’로 평가적 선언을 명료하게 하고, 마지막 절은 ‘마지막에 이르러 드러납니다’로 자연스럽게 다듬었습니다. ‘마지막’은 אַחֲרִית의 삶의 끝과 최종 결과라는 넓은 여지를 보존하며, ‘드러납니다’는 정체나 최종 상태가 분명해진다는 뜻을 과도하게 해석하지 않습니다. 각주 표지도 관련 어구에 재배치하고, 그리스어 이문을 정확히 밝혔습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T19:10:31Z'
