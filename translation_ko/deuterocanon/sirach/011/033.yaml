  text: Before death, do not call a man blessed, for in his end a man is made known.
  footnotes:
  - marker: a
    text: 'The Greek parallel reads quite differently: ''Beware of an evildoer, for he devises evil, lest he put a blemish on you forever.'' This likely reflects a different textual form; the Hebrew is followed here as the primary witness.'
    reason: alternative_reading
  - marker: b
    text: Or 'do not pronounce a man happy/fortunate.'
    reason: lexical_alternative
  - marker: c
    text: Or 'at his end a man is recognized' or 'becomes evident.'
    reason: lexical_alternative
translation:
  language: ko
  text: 죽기 전에 사람을 복되다고[a] 부르지 마십시오. 사람은 그의 마지막에 이르러 드러납니다.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “행복하다고”, “복이 있다고.”
    reason: lexical_alternative
  - marker: b
    text: 또는 “그의 끝에 이르러 사람은 알려집니다”, “그의 마지막에 사람은 인정됩니다.”
    reason: lexical_alternative
  - marker: c
    text: 그리스어 병행본은 상당히 다르게 읽습니다. “악을 행하는 자를 조심하십시오. 그가 악을 꾸미니, 그가 당신에게 영원히 오점을 남길까 두렵습니다.” 이는 다른 본문 형태를 반영할 수 있으며, 여기서는 히브리어 본문을 따릅니다.
    reason: alternative_reading
