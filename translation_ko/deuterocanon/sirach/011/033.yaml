  naturalness: ‘사람을 복되다고 하지 마십시오’보다 ‘사람을 복되다고 부르지 마십시오’가 선언·평가 행위인 תְּאַשֶּׁר를 더 직접적이고 자연스러운 현대 한국어로 옮깁니다. 마지막 절은 ‘사람은 그의 마지막에 이르러 드러납니다’로 고치는 것이 합쇼체 문체에 자연스럽습니다.
