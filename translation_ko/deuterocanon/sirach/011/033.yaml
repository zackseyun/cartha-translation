base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/011/033.yaml
  text: Before death, do not call a man blessed, for in his end a man is made known.
  footnotes:
  - marker: a
    text: 'The Greek parallel reads quite differently: ''Beware of an evildoer, for he devises evil, lest he put a blemish on you forever.'' This likely reflects a different textual form; the Hebrew is followed here as the primary witness.'
    reason: alternative_reading
  - marker: b
    text: Or 'do not pronounce a man happy/fortunate.'
    reason: lexical_alternative
  - marker: c
    text: Or 'at his end a man is recognized' or 'becomes evident.'
    reason: lexical_alternative
translation:
  language: ko
  text: 죽기 전에 사람을 복되다고 하지 마십시오. 그의 끝에서 사람은 알려집니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “행복하다고/복되다고.”
    reason: lexical_alternative
  - marker: b
    text: 또는 “그의 끝에서 사람은 인식됩니다/드러납니다.”
    reason: lexical_alternative
  - marker: c
    text: 그리스어 병행본은 “악한 자를 조심하라… 영원한 오점”으로 상당히 다르게 읽습니다. 여기서는 히브리어 본문을 따랐습니다.
    reason: cross_reference
lexical_decisions:
- source_word: לִפְנֵי מָוֶת
  english_pob_choice: Before death
  chosen_korean: 죽기 전에
  alternatives_korean:
  - 죽음 전에
  - 죽음에 앞서
  lexicon: HALOT
  rationale: 시간적 경계를 간결하고 자연스럽게 옮겼습니다. 잠정적 판단을 경계하는 잠언의 뉘앙스를 살립니다.
- source_word: אַל תְּאַשֶּׁר
  english_pob_choice: do not call ... blessed
  chosen_korean: 복되다고 하지 마십시오
  alternatives_korean:
  - 행복하다고 하지 마십시오
  - 복이 있다고 하지 마십시오
  lexicon: HALOT
  rationale: 아셔르의 평가적 의미를 한국어의 형용사적 선언으로 옮겼습니다. 교회 전통의 고정 표현보다 원문의 판단 행위를 직접 드러냅니다.
- source_word: בְּאַחֲרִיתוֹ
  english_pob_choice: in his end
  chosen_korean: 그의 끝에서
  alternatives_korean:
  - 그의 마지막에
  - 그의 결말에서
  - 그의 말년에
  lexicon: HALOT
  rationale: אַחֲרִית의 시간적·결과적 의미를 함께 살리면서, 히브리어의 간결성을 유지했습니다.
- source_word: יִנָּכֵר
  english_pob_choice: is made known
  chosen_korean: 알려집니다
  alternatives_korean:
  - 드러납니다
  - 알려집니다
  - 드러나 알려집니다
  lexicon: HALOT
  rationale: 피동/결과적 의미를 살려 인물이 최종적으로 분명해진다는 뜻을 자연스럽게 표현했습니다.
theological_decisions:
- issue: 인물의 참된 상태가 언제 드러나는가 하는 잠언의 경계
  chosen_reading: 죽기 전에는 사람을 평가하지 말고, 마지막에 드러나는 것을 보라.
  alternative_readings:
  - 죽기 전에 사람을 축복된 자로 부르지 말라
  - 끝에서만 사람의 참모습이 드러난다
  rationale: 이 절은 성급한 최종 판정의 위험을 경고합니다. 한국어 본문은 평가 행위를 금지하는 문장 구조를 유지해, 잠언적 교훈을 직접 전달합니다.
  doctrine_reference: 'PHILOSOPHY.md: translate Sirach from Hebrew where it survives, using Greek in view'
