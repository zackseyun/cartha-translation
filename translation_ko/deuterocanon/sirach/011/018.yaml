translation:
  language: ko
  text: 지혜와 통찰력과 사리를 깨닫는 능력은 주님에게서 나옵니다[a]. 죄와 올바른 길들도 주님에게서 나옵니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 제시된 카이로 게니자 히브리어 본문은 “지혜와 통찰력과 사리를 깨닫는 능력은 주님에게서 나옵니다. 죄와 올바른 길들도 주님에게서 나옵니다”라는 다른 격언을 전합니다. 그리스어 병행본문은 “한 사람이 자신의 부지런함과 인색함으로 부유해지며, 이것이 그가 받는 몫이다”라고 하여, 이 절과 다른 본문 전승을 반영합니다.
    reason: textual_variant
lexical_decisions:
- source_word: חָכְמָה
  english_pob_choice: Wisdom
  chosen_korean: 지혜
  alternatives_korean:
  - 슬기
  - 지식
  lexicon: 일반 성경어
  rationale: 지혜는 הָכְמָה의 기본적이고 가장 자연스러운 대응으로, 문맥상 삶의 분별을 가리키는 핵심 덕목을 잘 드러냅니다.
- source_word: וְשֶׂכֶל
  english_pob_choice: understanding
  chosen_korean: 분별
  alternatives_korean:
  - 이해
  - 통찰
  lexicon: 일반 성경어
  rationale: שֶׂכֶל은 단순한 지적 이해보다 사안을 가려내는 능력을 포함하므로, 현대 한국어에서 가장 응축된 대응인 분별을 택했습니다.
- source_word: וְהָבִין דָּבָר
  english_pob_choice: the knowledge of a matter
  chosen_korean: 사물의 이해
  alternatives_korean:
  - 한 일의 이해
  - 사안을 깨닫는 능력
  lexicon: 일반 성경어
  rationale: 직역하면 '사안을 분별함/이해함'에 가깝지만, 한국어로는 '사물의 이해'가 원문의 대상성(דָּבָר)을 비교적 직접적으로 옮깁니다.
- source_word: מֵיי הוּא
  english_pob_choice: are from the Lord
  chosen_korean: 주님에게서 나옵니다
  alternatives_korean:
  - 주님에게서 옵니다
  - 주님께 속합니다
  lexicon: 일반 성경어
  rationale: 원문의 기원 표현을 한국어에서 자연스러운 출처 진술로 옮겼으며, '나옵니다'가 두 절의 병렬 구조를 가장 잘 살립니다.
- source_word: חֵטְא
  english_pob_choice: sin
  chosen_korean: 죄
  alternatives_korean:
  - 악
  - 죄악
  lexicon: 일반 성경어
  rationale: חֵטְא의 표준적 대응인 죄를 유지해, 다음 절의 '곧은 길들'과 의도적 대조가 분명하게 보이도록 했습니다.
- source_word: וּדְרָכִים יְשָׁרִים
  english_pob_choice: upright ways
  chosen_korean: 곧은 길들
  alternatives_korean:
  - 올바른 길들
  - 정직한 길들
  lexicon: 일반 성경어
  rationale: דְרָכִים יְשָׁרִים의 직설적 이미지인 '곧은 길들'을 살려, 도덕적 의미를 지나치게 추상화하지 않도록 했습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행본문의 상이함
  chosen_reading: 본문은 히브리어 문장을 그대로 따르되, 그리스어 병행본문과의 불일치를 각주로 투명하게 표시했습니다.
  alternative_readings:
  - 그리스어에 따라 '한 사람이 근면과 인색함으로 부유해진다'로 옮김
  rationale: 제시된 히브리어는 본 절의 그리스어와 다른 격언을 반영하므로, 한국어 본문은 주어진 히브리어를 번역하되 자료 차이를 숨기지 않는 방식이 가장 투명합니다.
  doctrine_reference: 'PHILOSOPHY.md: 가능한 가장 원문적인 증언을 우선하되, 병행본 차이는 명시적으로 보존한다.'
