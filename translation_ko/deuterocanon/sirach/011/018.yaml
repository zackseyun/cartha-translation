    rationale: ‘사리를 깨닫는 능력’은 ‘어떤 사안을 이해/분별함’이라는 히브리어의 의미를 자연스러운 현대 한국어로 전달합니다.
  - severity: low
    issue: 각주의 그리스어 병행본문 요약이 생략 부호로 끝나 원문 차이를 충분히 보여 주지 못합니다.
    rationale: 그리스어의 이어지는 절, 즉 그것이 그가 받는 몫이라는 내용을 밝혀 두면 본문 계통의 차이가 더 투명해집니다.
