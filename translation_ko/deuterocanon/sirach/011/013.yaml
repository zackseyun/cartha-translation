translation:
  language: ko
  text: 일하는 사람도 있고 수고하는 사람도 있으며 분주히 달려다니기도 하지만, 그만큼 더 뒤처집니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 ‘그가 늦어진다 / 뒤처진다’로 읽히며, 이 절의 그리스어 병행본문은 대신 ‘그가 머리를 들었고 많은 이들이 그를 보고 놀랐다’고 읽어 상당히 다른 전승을 보여 줍니다.
    reason: textual_variant
lexical_decisions:
- source_word: יֵשׁ
  english_pob_choice: There is one who
  chosen_korean: 일하는 사람도 있고
  alternatives_korean:
  - 어떤 사람이 있습니다
  - 한 사람이 있습니다
  lexicon: HALOT
  rationale: 존재를 일반적인 유형 진술로 여는 표현이므로, 한국어에서는 ‘사람도 있고’로 풀어 자연스러운 격언형 서두를 살렸습니다.
- source_word: עָמֵל וְיָגֵעַ
  english_pob_choice: labors and toils
  chosen_korean: 일하는 사람도 있고 수고하는 사람도 있으며
  alternatives_korean:
  - 애써 일하는 사람도 있고 지쳐가는 사람도 있으며
  - 노력하며 애쓰는 사람도 있으며
  lexicon: HALOT
  rationale: 두 분사는 거의 동의 반복이므로, 한국어에서도 의미를 겹치게 하되 ‘일하다/수고하다’로 분리해 강한 수고를 드러냈습니다.
- source_word: וָרָץ
  english_pob_choice: rushes about
  chosen_korean: 분주히 달려다니기도 하지만
  alternatives_korean:
  - 달리기도 하지만
  - 서둘러 다니기도 하지만
  lexicon: HALOT
  rationale: 문자적으로는 ‘달리다’이지만 지혜문학의 맥락상 부산한 움직임을 나타내므로 ‘분주히 달려다니다’로 옮겼습니다.
- source_word: וּכְדֵי כֵן הוּא מִתְאַחֵר
  english_pob_choice: yet all the more he falls behind
  chosen_korean: 그만큼 더 뒤처집니다
  alternatives_korean:
  - 오히려 더 늦어집니다
  - 그런데도 더 뒤떨어집니다
  lexicon: HALOT
  rationale: ‘미תאַחֵר’의 핵심은 지연/뒤처짐이므로 자연스러운 한국어 격언 표현인 ‘뒤처집니다’로 옮겼고, ‘그만큼 더’로 역설적 강조를 살렸습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행본문의 현저한 차이
  chosen_reading: 본문은 히브리어 전승을 따르되, 역설적 결말(뒤처짐)을 본문에 반영합니다.
  alternative_readings:
  - 그리스어 병행본문처럼 ‘그는 머리를 들었고 많은 이들이 그를 보고 놀랐다’로 옮기는 방식
  rationale: 이 절은 히브리어와 그리스어 전승이 서로 크게 달라서, POB의 본문은 히브리어 어형에 따라 번역하고 그 차이는 주석으로 남기는 것이 타당합니다.
  doctrine_reference: 본문 비평 / 전승 차이
