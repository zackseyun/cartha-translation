review_pass:
  verdict: revise
  source_fidelity: 히브리어 본문은 존재문(יֵשׁ)으로 시작하여 한 사람을 묘사합니다. 초안의 첫머리 ‘그는’은 선행 지시 대상이 없어 문법적으로 성립하지 않으며, ‘사람도 있고’와 끝의 ‘사람도 있습니다’가 한 인물을 둘로 나누어 보이게 합니다. 또한 וְיוֹתֵר אִישׁ עָנִי에는 ‘~보다’의 비교 대상이 명시되어 있지 않으므로 ‘가난한 사람보다 더한’이라고 보충하지 않는 편이 안전합니다. 마소라화된 히브리어의 어구 자체가 다소 난해하고 그리스어 대조 본문과도 현저히 다르므로, 그 모호성은 유지해야 합니다.
  naturalness: ‘걸어가다가 망해 가는’은 일상 동작의 우연한 계기처럼 들리고, 문장 전체의 주어 연결도 부자연스럽습니다. ‘가난하여 망해 가는 이’와 ‘아무것도 없으며’는 현대 표준어의 격식 있는 성서 문체로 자연스럽고, 원문의 압축된 묘사를 유지합니다.
  terminology: ‘가난한 이’, ‘아무것도 없으며’, ‘더욱 가난한 사람’은 רֹשֵׁשׁ, חֲסַר כֹּל, וְיוֹתֵר אִישׁ עָנִי의 결핍·빈곤 어휘를 일관되게 반영합니다. 마지막 ‘더욱’은 비교 기준이 본문에 명시되지 않은 히브리어의 타원성과 강조를 보존합니다.
  issues:
  - severity: high
    issue: 문장이 무근거한 대명사 ‘그는’으로 시작하고 한 존재문 안의 인물을 중복하여 제시합니다.
    rationale: יֵשׁ는 ‘~하는 이가 있다’라는 존재문을 이끌며, 본문은 한 인물에 대한 연속 묘사입니다. 초안은 이 구조를 훼손합니다.
  - severity: medium
    issue: ‘가난한 사람보다 더한’이 원문에 없는 비교 대상을 명시합니다.
    rationale: וְיוֹתֵר의 정확한 구문적 기능은 난해하지만, ‘가난한 사람보다’라는 기준은 히브리어에 표면적으로 없습니다. ‘더욱 가난한 사람’이 더 절제된 번역입니다.
  - severity: medium
    issue: 각주가 본문의 이문 관계를 충분히 설명하지 못합니다.
    rationale: 그리스어 대조 본문은 ‘선과 악, 삶과 죽음, 가난과 부가 주님에게서 난다’라는 전혀 다른 문장입니다. 히브리어를 본문으로 따르되, 이 현저한 차이와 히브리어 어구의 난해함을 밝혀야 합니다.
  revised_text: 가난하여 망해 가는 이가 있습니다. 그는 아무것도 없으며, 더욱 가난한 사람입니다.[a]
  revised_footnotes:
  - marker: a
    text: 현존 히브리어 본문은 이 구절의 그리스어 대조 본문과 크게 다릅니다. 그리스어는 “선과 악, 삶과 죽음, 가난과 부는 주님에게서 난다”라고 읽습니다. 여기서는 현존 히브리어를 따라 옮겼으며, 히브리어 마지막 표현의 정확한 구문은 다소 불확실합니다.
    reason: textual_variant
  revision_rationale: 현존 히브리어를 우선하여 한 인물에 대한 존재문과 연속된 결핍 묘사를 복원했습니다. 원문에 없는 비교 대상과 부자연스러운 대명사·중복된 존재문을 제거했습니다. 그리스어와의 중대한 이문 및 히브리어 말미의 불확실성은 각주에서 밝혔습니다.
