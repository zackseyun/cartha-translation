base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/011/014.yaml
  text: There is one who is poor and perishing as he walks[a], lacking everything, yet more than a poor man.
  footnotes:
  - marker: a
    text: The extant Hebrew line in the primary witness appears to reflect a different wording, while the Greek parallel reads 'Good and evil, life and death, poverty and wealth are from the Lord.' Because the Hebrew here is marked with minor mismatch and does not align with the verse reference, the translation follows the Greek parallel as the stable source for this verse.
    reason: textual_variant
translation:
  language: ko
  text: 그는 가난하고 걸어가다가 망해 가는 사람도 있고, 모든 것이 부족하지만, 오히려 가난한 사람보다 더한 사람도 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 이 절의 통상적인 그리스어 대조구와 일치하지 않으며, 여기서는 히브리어를 따라 옮겼습니다.
    reason: textual_variant
lexical_decisions:
- source_word: יֵשׁ
  english_pob_choice: There is
  chosen_korean: 그는 ... 사람도 있습니다
  alternatives_korean:
  - 있습니다
  - ~하는 이가 있습니다
  lexicon: BHS
  rationale: 히브리어 존재문 יֵשׁ의 존재 진술을 살려, 단순 서술이 아니라 '그런 사람이 있습니다'라는 형식으로 시작하게 했습니다.
- source_word: רֹשֵׁשׁ
  english_pob_choice: poor
  chosen_korean: 가난한
  alternatives_korean:
  - 빈곤한
  - 궁핍한
  lexicon: HALOT
  rationale: 재정적 결핍 상태를 가리키는 말로 보아, 현대 한국어에서 가장 자연스러운 '가난한'으로 옮겼습니다.
- source_word: וְאֹבֵד מְהַלֵּךְ
  english_pob_choice: perishing as he walks
  chosen_korean: 걸어가다가 망해 가는
  alternatives_korean:
  - 걸으며 사라져 가는
  - 걸어가며 죽어 가는
  lexicon: HALOT
  rationale: 동작 중에 파멸해 가는 이미지가 핵심이므로, 직역을 유지하되 한국어 어법에 맞게 '걸어가다가 망해 가는'으로 옮겼습니다.
- source_word: חֲסַר כֹּל
  english_pob_choice: lacking everything
  chosen_korean: 모든 것이 부족하지만
  alternatives_korean:
  - 아무것도 부족한
  - 모든 것을 결핍한
  lexicon: HALOT
  rationale: 완전한 결핍을 뜻하므로 '모든 것이 부족하다'를 사용해 의미를 분명히 했습니다.
- source_word: וְיוֹתֵר אִישׁ עָנִי
  english_pob_choice: yet more than a poor man
  chosen_korean: 오히려 가난한 사람보다 더한 사람도 있습니다
  alternatives_korean:
  - 그러나 가난한 사람보다 더한 사람도 있습니다
  - 그런데도 가난한 사람보다 더한 사람도 있습니다
  lexicon: HALOT
  rationale: 마지막 절의 비교·역설을 살려, '오히려'로 강조된 반전과 '가난한 사람보다 더한'이라는 비교를 유지했습니다.
theological_decisions:
- issue: 문장 전체의 역설적 비교 구조
  chosen_reading: 이 구절은 한 사람의 외적 형편이 단순한 빈곤을 넘어 더 심한 결핍과 파멸로 진행될 수 있음을 말합니다.
  alternative_readings:
  - 단순히 가난의 다양한 단계에 대한 묘사로 볼 수 있습니다.
  - 사회경제적 빈곤을 도덕적 평가와 분리해 읽을 수 있습니다.
  rationale: 히브리어의 병렬과 비교 표현을 살려, 문학적·현실적 역설을 약화시키지 않았습니다.
  doctrine_reference: source-first; preserve rhetorical force
