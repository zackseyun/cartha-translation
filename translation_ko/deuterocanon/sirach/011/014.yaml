translation:
  language: ko
  text: 그는 가난하고 걸어가다가 망해 가는 사람도 있고, 모든 것이 부족하지만, 오히려 가난한 사람보다 더한 사람도 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 이 절의 통상적인 그리스어 대조구와 일치하지 않으며, 여기서는 히브리어를 따라 옮겼습니다.
    reason: textual_variant
lexical_decisions:
- source_word: יֵשׁ
  english_pob_choice: There is
  chosen_korean: 그는 ... 사람도 있습니다
  alternatives_korean:
  - 있습니다
  - ~하는 이가 있습니다
  lexicon: BHS
  rationale: 히브리어 존재문 יֵשׁ의 존재 진술을 살려, 단순 서술이 아니라 '그런 사람이 있습니다'라는 형식으로 시작하게 했습니다.
- source_word: רֹשֵׁשׁ
  english_pob_choice: poor
  chosen_korean: 가난한
  alternatives_korean:
  - 빈곤한
  - 궁핍한
  lexicon: HALOT
  rationale: 재정적 결핍 상태를 가리키는 말로 보아, 현대 한국어에서 가장 자연스러운 '가난한'으로 옮겼습니다.
- source_word: וְאֹבֵד מְהַלֵּךְ
  english_pob_choice: perishing as he walks
  chosen_korean: 걸어가다가 망해 가는
  alternatives_korean:
