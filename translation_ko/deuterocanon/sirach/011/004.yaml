translation:
  language: ko
  text: 가난한 사람을 조롱하지 말며, 쓴날에 스스로를 뽐내지 마십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '그리스어 평행본: “옷 한 벌로 자랑하지 말며, 영광의 날에 스스로를 높이지 말라. 이는 주님의 일들이 놀랍고, 그의 일들이 사람들 가운데 숨겨져 있기 때문이다.”'
    reason: textual_variant
  - marker: b
    text: 히브리어는 문자적으로 ‘사라져 가는/망가진 덮개’에 가깝습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַעֲטֶה אֹבֵד
  english_pob_choice: a poor man / a worn-out cloak
  chosen_korean: 가난한 사람
  alternatives_korean:
  - 낡은 망토
  - 헤진 옷
  lexicon: HALOT
  rationale: 히브리어는 문자 그대로는 ‘사라져 가는/망가진 덮개’에 가깝지만, 문맥상 비천하거나 궁핍한 사람을 가리키는 경구로 읽히며 영어 POB도 이를 반영했습니다. 한국어 본문은 우선적 의미를 따라 ‘가난한 사람’으로 자연스럽게 옮기고, 옷의 이미지보다는 수치를 조롱하는 행위를 드러내도록 했습니다.
- source_word: תְּהַתֵּל
  english_pob_choice: do not mock
  chosen_korean: 조롱하지 말며
  alternatives_korean:
  - 비웃지 말며
  - 놀리지 말며
  lexicon: HALOT
  rationale: 이 동사는 단순한 농담이 아니라 사람을 깎아내리는 조롱을 가리키므로, 현대 합쇼체에서도 강도가 분명한 ‘조롱하다’를 택했습니다.
- source_word: וְאַל תְּקַלֵּס
  english_pob_choice: do not boast / praise yourself
  chosen_korean: 스스로를 뽐내지 마십시오
  alternatives_korean:
  - 스스로를 자랑하지 마십시오
  - 스스로를 치켜세우지 마십시오
  lexicon: HALOT
  rationale: 둘째 금지는 자기 과시와 자찬을 겨냥하므로, 첫 절의 ‘조롱’과 대구를 이루는 자연스러운 한국어로 ‘스스로를 뽐내다’를 사용했습니다. 이는 영어 전통 본문상의 ‘boast’와 주석의 ‘praise yourself’가 가리키는 자기 과시의 공통 의미를 살립니다.
- source_word: בִּמְרִירֵי יוֹם
  english_pob_choice: in bitter days
  chosen_korean: 쓴날에
  alternatives_korean:
  - 쓴 날에
  - 고된 날들에
  - 괴로운 날에
  lexicon: HALOT
  rationale: 히브리어 복수 표현은 ‘비통한/쓰라린 날들’을 뜻하므로, 한국어에서는 경구적 압축을 살린 ‘쓴날에’로 옮겼습니다. 이는 단순히 우울한 시기가 아니라 곤궁하고 쓰라린 상황을 가리킵니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 평행본의 차이
  chosen_reading: 본문은 현존하는 히브리어 두 행을 따르고, 그리스어의 ‘영광의 날’과 추가 설명은 각주로 처리합니다.
  alternative_readings:
  - ‘영광의 날에 스스로를 높이지 말라’
  - 그리스어의 ‘주님의 일들은 놀랍다…’까지 포함
  rationale: 시락서는 히브리어가 보존된 경우 히브리어를 본문으로 삼되, 그리스어 평행본의 실재하는 차이를 숨기지 않는 것이 원칙입니다. 여기서는 두 번째 행 자체도 어휘가 다르고, 그리스어는 추가 설명절까지 붙이므로 본문과 각주로 분리하는 것이 가장 투명합니다.
  doctrine_reference: 'Sirach source policy: preserve primary Hebrew witness while recording Greek parallel variants honestly'
