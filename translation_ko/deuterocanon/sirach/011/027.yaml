base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/011/027.yaml
  text: The blessing of God is the lot of the righteous[b][a], and in the time of his hope it will blossom.
  footnotes:
  - marker: a
    text: 'Hebrew: ''The blessing of God is the lot of the righteous, and at the time of his hope it will blossom.'' The Greek parallel reads quite differently: ''An evil hour brings forgetfulness of luxury, and at a man''s end there is a revealing of his works.'' This suggests a divergent textual tradition for this verse.'
    reason: textual_variant
  - marker: b
    text: Or 'his hope will blossom.' The Hebrew verb can be understood with either 'blessing' or 'hope' as its referent.
    reason: lexical_alternative
translation:
  language: ko
  text: 하나님의 복은 의인의 몫이며, 그가 소망하는 때에 그것은 꽃필 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘하나님의 복은 의인의 몫이며, 그가 소망하는 때에 그것은 꽃필 것입니다’라고 읽힙니다. 그러나 그리스어 병행본문은 상당히 다르게 전합니다. ‘불행한 때는 사치스러운 삶을 잊게 하며, 사람의 마지막에는 그의 행위가 드러난다.’ 이는 이 절에 서로 다른 본문 전통이 있음을 시사합니다.
    reason: textual_variant
  - marker: b
    text: 또는 ‘그의 희망이 꽃필 것입니다.’ 히브리어 동사는 ‘복’ 또는 ‘희망’을 가리키는 것으로 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּרְכַּת אֵל
  english_pob_choice: the blessing of God
  chosen_korean: 하나님의 복
  alternatives_korean:
  - 하나님의 축복
  - 하나님께서 주시는 복
  lexicon: HALOT
  rationale: 히브리어 בִּרְכַּת은 구체적이기보다 일반적인 ‘복’의 의미를 가지므로, 평범한 표준어로 간결하게 옮겼습니다. ‘축복’보다 ‘복’이 지혜문맥에서 더 자연스럽고, 구문상 소유격도 무리 없이 반영합니다.
- source_word: גּוֹרָל
  english_pob_choice: the lot
  chosen_korean: 몫
  alternatives_korean:
  - 제비
  - 분깃
  - 운명
  lexicon: HALOT
  rationale: 이 단어는 문자적으로 ‘제비/몫’이지만, 여기서는 하나님께서 정하시는 배분의 의미가 강하므로 ‘몫’이 가장 자연스럽습니다. ‘운명’은 해석이 과도하고, ‘제비’는 한국어에서 오히려 의식적 뉘앙스가 강합니다.
- source_word: צַדִּיק
  english_pob_choice: the righteous
  chosen_korean: 의인
  alternatives_korean:
  - 의로운 사람
  - 의인된 자
  lexicon: HALOT
  rationale: 형용사적 명사 용법이므로 집단적·대표적 의미를 살려 ‘의인’으로 옮겼습니다. 한국어 성서어휘에서도 가장 안정적인 대응입니다.
- source_word: תִּפְרָח
  english_pob_choice: it will blossom
  chosen_korean: 꽃필 것입니다
  alternatives_korean:
  - 피어날 것입니다
  - 번성할 것입니다
  - 번개할 것입니다
  lexicon: HALOT
  rationale: פרח의 핵심 이미지는 ‘피다/꽃피다’이므로 식물적 비유를 유지하는 ‘꽃필 것입니다’를 택했습니다. ‘번성하다’는 의미는 전달되지만 원문의 생생한 이미지를 약화시킵니다.
theological_decisions:
- issue: תִּפְרָח의 주어가 ‘복’인지 ‘희망’인지의 모호성
  chosen_reading: ‘그것’으로 처리해, ‘하나님의 복’과 ‘그의 희망’ 사이의 문법적 모호성을 그대로 남겼습니다.
  alternative_readings:
  - ‘그의 희망이 꽃필 것입니다’
  - ‘하나님의 복이 꽃필 것입니다’
  rationale: 히브리어에서는 여성형 단수 동사가 바로 앞의 ‘복’과도, 의미상 연결된 ‘희망’과도 이어질 수 있어 해소하지 않는 편이 원문에 더 충실합니다. 영어 POB의 주석도 이 양쪽 가능성을 인정하므로, 한국어 본문은 중립적 지시어로 긴장을 보존했습니다.
  doctrine_reference: 원문이 허용하는 문법적/의미적 이중 가능성을 보존하고, 번역이 단정적으로 하나로 해결하지 않도록 함.
