  text: The wisdom of the poor lifts up his head[a], and seats him among nobles.
  footnotes:
  - marker: a
    text: Or 'the lowly' or 'the humble'; the Hebrew says 'the poor,' while the Greek parallel can suggest low status more broadly.
    reason: lexical_alternative
translation:
  language: ko
  text: 가난한 이[a]의 지혜는 그의 머리를 들어 올리고 그를 귀인들 가운데 앉힙니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘낮은 이’, ‘겸손한 이’. 히브리어는 ‘가난한 이’를 말하지만, 그리스어 평행 본문은 더 넓은 낮은 지위를 시사할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָכְמַת דַּל
  english_pob_choice: The wisdom of the poor
  chosen_korean: 가난한 이의 지혜
  alternatives_korean:
  - 가난한 자의 지혜
  - 가난한 사람의 지혜
  - 낮은 이의 지혜
  lexicon: HALOT
  rationale: 히브리어는 ‘지혜’와 ‘가난한 이’의 소유 관계를 이루므로, 한국어도 속격 구조를 살려 ‘가난한 이의 지혜’로 옮겼습니다. POB의 영어처럼 사회경제적 의미를 기본으로 두되, 한국어에서는 ‘가난한 자’보다 현대적이고 중립적인 ‘가난한 이’를 택했습니다.
- source_word: תִּשָּׂא רֹאשׁוֹ
  english_pob_choice: lifts up his head
  chosen_korean: 그의 머리를 들어 올리고
  alternatives_korean:
  - 그의 머리를 높이고
  - 그를 높여 주고
  - 그의 머리를 들어 주고
  lexicon: HALOT
  rationale: ‘머리를 들어 올리다’는 히브리어 관용구를 가능한 한 투명하게 보존하는 표현입니다. 이는 지위의 상승과 존귀의 회복이라는 함의를 직접 드러냅니다.
- source_word: וּבֵין נְדִיבִים
  english_pob_choice: among nobles
  chosen_korean: 귀인들 한가운데
  alternatives_korean:
  - 귀인들 가운데
  - 고관들 한가운데
  - 귀족들 가운데
  lexicon: HALOT
  rationale: נְדִיבִים은 사회적으로 높은 지위를 가진 사람들을 가리키며, 영어 POB의 ‘nobles’에 맞추어 한국어 ‘귀인들’로 옮겼습니다. ‘한가운데’는 וּבֵין의 ‘among’에 해당하는 자연스러운 위치 표현입니다.
- source_word: תּוֹשִׁיבֶנּוּ
  english_pob_choice: seats him
  chosen_korean: 앉혀 줍니다
  alternatives_korean:
  - 앉게 합니다
  - 자리를 주십니다
  - 앉힙니다
  lexicon: HALOT
  rationale: 히필형의 사역 의미를 살리면서도 한국어에서 자연스러운 결과 상태를 나타내기 위해 ‘앉혀 줍니다’를 택했습니다. 단순히 ‘앉힙니다’보다, 명예로운 자리를 마련해 주는 뉘앙스를 조금 더 분명히 전달합니다.
theological_decisions:
- issue: דַּל의 의미를 사회경제적 ‘가난한 이’로 둘지, 더 넓은 ‘낮은/겸손한 이’로 열어 둘지
  chosen_reading: 본문은 ‘가난한 이’를 기본 의미로 유지하되, 문맥상 낮은 신분과 겸손의 함의도 함께 느껴지도록 했습니다.
  alternative_readings:
  - 낮은 이
  - 겸손한 이
  rationale: 히브리어 본문이 가장 직접적으로 지시하는 것은 빈곤한/낮은 사회적 상태이며, 그리스어 평행 본문은 더 넓은 낮은 지위를 시사합니다. 본문은 영어 POB처럼 사회경제적 의미를 기본으로 두었습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
