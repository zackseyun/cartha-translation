  text: Many who were exalted have been greatly disgraced[a], and brought low together; even the honored have been given into another's hand.
  footnotes:
  - marker: a
    text: 'Greek has a substantially different reading here: ''Before you examine, do not blame; first understand, and then rebuke.'' The translation follows the extant Hebrew witness, per project policy for Sirach where Hebrew survives.'
