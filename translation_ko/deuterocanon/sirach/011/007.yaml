translation:
  language: ko
  text: 높임을 받은 많은 이들이 크게 멸시를 받고 함께 낮아졌으며, 존귀한 이들도 다른 이의 손에 넘겨졌습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 여기서 상당히 다른 본문을 전합니다. ‘살피기 전에는 비난하지 말라. 먼저 이해한 뒤에 책망하라.’ 이 번역은 시락서의 현존 히브리어 증언을 따릅니다.
    reason: alternative_reading
lexical_decisions:
- source_word: רַבִּים
  english_pob_choice: Many
  chosen_korean: 많은 이들
  alternatives_korean:
  - 많은 사람들
  - 많은 자들
  lexicon: HALOT
  rationale: 서술 대상이 일반적인 다수임을 자연스럽게 드러내면서도, 본문의 사회적 역전 구조를 흐리지 않는 중립적 표현입니다.
- source_word: נִשָּׂאִים
  english_pob_choice: were exalted
  chosen_korean: 높아졌다가
  alternatives_korean:
  - 들려졌다가
