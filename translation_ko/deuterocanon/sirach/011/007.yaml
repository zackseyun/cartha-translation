translation:
  language: ko
  text: 많은 이들이 높아졌다가 크게 수치를 당하고, 함께 낮아졌으며, 심지어 존귀한 이들도 다른 이의 손에 넘겨집니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '그리스어는 여기서 상당히 다른 본문을 전합니다: ‘먼저 살피기 전에는 책망하지 말라. 먼저 이해하고, 그다음에 꾸짖어라.’ 이 번역은 시락서의 현존 히브리어 증언을 따릅니다.'
    reason: alternative_reading
lexical_decisions:
- source_word: רַבִּים
  english_pob_choice: Many
  chosen_korean: 많은 이들
  alternatives_korean:
  - 많은 사람들
  - 많은 자들
  lexicon: HALOT
  rationale: 서술 대상이 일반적인 다수임을 자연스럽게 드러내면서도, 본문의 사회적 역전 구조를 흐리지 않는 중립적 표현입니다.
- source_word: נִשָּׂאִים
  english_pob_choice: were exalted
  chosen_korean: 높아졌다가
  alternatives_korean:
  - 들려졌다가
  - 들어 올려졌다가
  - 승귀했다가
  lexicon: HALOT
  rationale: נשא의 ‘올려짐/고양됨’에서 사회적 지위의 상승을 살리되, 한국어에서는 ‘높아지다’가 가장 자연스럽고 문맥상 대조도 분명합니다.
- source_word: נִקְלוּ מְאֹד
  english_pob_choice: have been greatly disgraced
  chosen_korean: 크게 수치를 당하고
  alternatives_korean:
  - 심히 멸시를 당하고
  - 매우 천대를 받고
  - 크게 경멸을 당하고
  lexicon: HALOT
  rationale: קלל/קלה 계열의 ‘경멸·수치’ 의미를 한국어의 ‘수치를 당하다’로 옮겨, 단순한 불운이 아니라 명예 훼손과 모욕의 뉘앙스를 살렸습니다.
- source_word: נִתְּנוּ בְיָד
  english_pob_choice: have been given into another's hand
  chosen_korean: 다른 이의 손에 넘겨집니다
  alternatives_korean:
  - 다른 이의 손에 맡겨집니다
  - 다른 이의 권세 아래로 넘겨집니다
  - 남의 손에 붙잡힙니다
  lexicon: HALOT
  rationale: 히브리어 관용구를 직역해 ‘손’ 이미지를 보존하면서, 실제 뜻인 ‘타인의 통제/지배 아래로 넘겨짐’을 현대 한국어로 분명히 했습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행본문의 불일치
  chosen_reading: 히브리어 전승의 역전 진술을 본문으로 따르되, 그리스어가 보여 주는 ‘판단 전 분별’의 지혜 주제는 배경 증언으로만 인정합니다.
  alternative_readings:
  - 그리스어를 따라 ‘먼저 살피기 전에는 책망하지 말라’로 옮김
  rationale: 시락서는 현존 히브리어가 있을 때 이를 우선한다는 원칙에 따라, 본문 자체의 형식을 바꾸지 않고 히브리어 문장을 번역했습니다.
  doctrine_reference: 'PHILOSOPHY.md: translate from Hebrew where it survives; use parallel Greek as actual input without displacing original-language primacy.'
