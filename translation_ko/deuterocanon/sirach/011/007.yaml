  naturalness: ‘많은 이들이 높아졌다가’는 자연스럽지만 원문의 분사적 ‘높임을 받은/높은 지위에 있던’ 상태보다 시간적 순서를 다소 강하게 만듭니다. 또한 ‘크게 수치를 당하고’보다 ‘크게 멸시를 받고’가 נִקְלוּ의 ‘하찮게 여김·멸시’에 더 직접적입니다. 문장 전체를 완료형으로 일관시키는 편이 현대 한국어 문장으로도 더 매끄럽습니다.
