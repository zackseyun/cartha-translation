translation:
  language: ko
  text: 그는 그를 머리 위로 들어 올리고 높이셨으며, 많은 이들이 그를 보고 놀랐습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘그를 그의 머리 위에 올렸다’는 뜻이지만, 문맥상 최고 지위로 높여졌다는 관용적 의미로 이해하는 것이 자연스럽습니다.
    reason: lexical_alternative
  - marker: b
    text: 이 절에 대한 그리스어 병행구는 히브리어 본문과 일치하지 않으므로, 번역은 현존 히브리어 증거를 따릅니다.
    reason: textual_variant
lexical_decisions:
- source_word: נָשָׂא
  english_pob_choice: lifted
  chosen_korean: 들어 올리고
  alternatives_korean:
  - 들어올리고
  - 올리고
  - 받들어
  lexicon: HALOT
  rationale: נָשָׂא의 기본 의미인 ‘들어 올리다/raise’와 영어 POB의 ‘lifted’를 따라, 물리적 상승과 비유적 승격을 함께 드러내는 표현으로 옮겼습니다.
- source_word: בְּרֹאשׁוֹ
  english_pob_choice: to the top
  chosen_korean: 머리 위로
  alternatives_korean:
  - 정상으로
  - 꼭대기로
  - 머리로
  lexicon: HALOT
  rationale: 직역하면 ‘그의 머리 위에/에서’이지만, 주석이 밝히듯 지위의 최고점으로 끌어올려졌다는 관용적 뜻이므로 이미지가 남는 ‘머리 위로’를 택했습니다.
- source_word: וַיְרֹמְמֵהוּ
  english_pob_choice: exalted him
  chosen_korean: 높이셨으며
  alternatives_korean:
  - 높여 주셨으며
  - 승귀시키셨으며
  - 들어 높이셨으며
  lexicon: HALOT
  rationale: רומם은 ‘높이다, 높이 들다, 높여 주다’의 뜻이므로, 앞 동사와 평행을 이루면서 지위의 상승을 분명히 하는 ‘높이셨으며’로 옮겼습니다.
- source_word: וַיִּתְמְהוּ
  english_pob_choice: were astonished
  chosen_korean: 놀랐습니다
  alternatives_korean:
  - 경탄했습니다
  - 경이로워했습니다
  - 어리둥절했습니다
  lexicon: HALOT
  rationale: תמה는 단순한 호기심보다 강한 놀라움과 경탄을 나타내지만, 한국어에서 자연스러운 서술을 위해 과도하게 해석하지 않는 ‘놀랐습니다’를 사용했습니다.
theological_decisions:
- issue: 히브리어 본문이 명시적 주어를 제시하지 않음
  chosen_reading: 문맥의 익명성을 유지하여 특정 인물이나 하나님을 본문에 새로 지정하지 않았습니다.
  alternative_readings:
  - 그를 하나님께서 들어 올리셨습니다
  - 어떤 통치자가 그를 높였습니다
  rationale: 동사와 대명사만으로 된 히브리어의 익명성을 보존해야 하므로, 독자가 본문 바깥의 특정 주어를 단정하지 않도록 했습니다.
  doctrine_reference: 'DOCTRINE.md: Preserve theological tension rather than resolve it; source-first ambiguity retention'
