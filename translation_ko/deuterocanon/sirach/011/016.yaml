- from: 그는 그를 머리 위로 들어 올리고 높이셨으며, 많은 이들이 그를 보고 놀랐습니다.[a][b]
  to: 그가 그를 그의 머리 위로 들어 올리고 그를 높였으며, 많은 사람이 그를 두고 놀랐습니다.[a][b]
  rationale: 명시되지 않은 주어를 한국어의 생략 가능한 주어 처리로 최대한 보존하고, 원문에 없는 주어 존대를 제거했습니다. ‘그의 머리 위로’는 히브리어의 이미지를 본문에 남기되, 그 관용적·지위적 이해는 불확실성을 보존한 주석으로 설명했습니다. ‘그를 두고’는 놀람의 대상을 나타내는 על을 ‘보고’보다 덜 구체화하여 반영합니다.
