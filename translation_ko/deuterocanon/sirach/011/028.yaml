  text: Do not say[a], “Look, I have done what I desired; and what now will be lacking to me?”
  footnotes:
  - marker: a
    text: 'Greek parallel: “Before the end do not call anyone blessed, and in his children a man will be known.” The Hebrew witness here instead warns against saying, “I have done what I desired; what now will be lacking to me?”'
    reason: alternative_reading
translation:
  language: ko
  text: “보십시오, 내가 바라는 것을 이루었습니다. 이제 내게 무엇이 부족하겠습니까?”라고 말하지 마십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 병행본문은 “죽기 전에 아무도 복되다고 하지 마십시오. 그의 자녀들을 통해 그 사람이 알려질 것입니다”라고 전합니다. 그러나 현존 히브리어 본문은 “보십시오, 내가 바라는 것을 이루었습니다. 이제 내게 무엇이 부족하겠습니까?”라고 말하지 말라고 경고합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תֹּאמַר
  english_pob_choice: Do not say
  chosen_korean: 말하지 마십시오
  alternatives_korean:
  - 말하지 마세요
  - 선언하지 마십시오
  lexicon: HALOT
  rationale: 금지형을 자연스러운 현대 한국어 명령형으로 옮기되, 합쇼체를 유지했습니다.
- source_word: הִנֵּה
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보십시오, 여기
  - 보라
  lexicon: HALOT
  rationale: 화자의 자기확신을 드러내는 지시어로서, 현대 한국어에서 가장 자연스럽게는 ‘보십시오’가 문장의 주의를 끄는 기능을 살립니다.
- source_word: חֶפְצִי
  english_pob_choice: what I desired
  chosen_korean: 내가 바라던 것
  alternatives_korean:
  - 내가 원하던 것
  - 내 소원
  lexicon: HALOT
  rationale: חפץ는 단순한 욕구보다 ‘바라다/원하다’의 뜻을 담으므로, 자기 성취를 자랑하는 뉘앙스를 살려 ‘내가 바라던 것’으로 옮겼습니다.
- source_word: יֵעָזֵב לִי
  english_pob_choice: will be lacking to me
  chosen_korean: 내게 무엇이 더 부족하겠습니까
  alternatives_korean:
  - 내게 무엇이 남지 않겠습니까
  - 내게 무엇이 더 남겠습니까
  lexicon: HALOT
  rationale: 직역하면 ‘내게 남아 있을 것’ 계열이지만, 문맥상 자족적 자문을 나타내므로 한국어에서는 ‘무엇이 더 부족하겠습니까’가 의미를 가장 분명하게 전달합니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행본문의 차이
  chosen_reading: 본문은 현존 히브리어의 경고를 그대로 따르고, 그리스어의 ‘죽기 전 아무도 복되다 하지 말라’는 다른 형태는 본문에 섞지 않았습니다.
  alternative_readings:
  - 그리스어 병행본문에 따라 ‘죽기 전에 아무도 복되다 하지 마십시오’
  rationale: 시락서에서는 히브리어가 보존된 곳에서는 히브리어를 우선해야 하므로, 의미가 크게 다른 그리스어 병행본문은 각주 수준의 대안으로만 처리하는 것이 적절합니다.
  doctrine_reference: 'POB 원칙: 현존 히브리어 우선, 그리스어 병행은 대조 증거로 활용'
