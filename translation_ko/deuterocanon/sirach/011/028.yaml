  source_fidelity: 본문은 히브리어의 금지 명령(אַל תֹּאמַר), 자기만족의 선언(הִנֵּה כִּי עָשִׂיתִי חֶפְצִי), 그리고 수사적 질문(וּמֶה עַתָּה יֵעָזֵב לִי)을 대체로 충실히 반영합니다. 다만 현 번역은 인용문의 범위와 ‘말하지 마십시오’의 연결이 한국어 문법상 불명확하여, 금지 명령이 인용 전체를 수식하도록 바로잡아야 합니다.
  naturalness: ‘내가 내가 바라던 것’은 주어가 불필요하게 반복되어 다소 어색합니다. 또한 인용문 뒤에 ‘라고 말하지 마십시오’를 두는 것이 현대 표준 한국어의 직접 인용 구성에 자연스럽습니다. ‘보십시오’는 히브리어 הִנֵּה의 주의를 끄는 자기확신의 어조를 무리 없이 살립니다.
  terminology: ‘바라는 것’, ‘이루었습니다’, ‘무엇이 부족하겠습니까’는 각각 חֶפְצִי, עָשִׂיתִי, יֵעָזֵב לִי의 문맥상 뜻을 자연스럽고 과도한 해석 없이 전달합니다. 그리스어 병행본문은 본문과 상당히 다르므로 대안 읽기로 각주에 남기는 것이 적절합니다.
