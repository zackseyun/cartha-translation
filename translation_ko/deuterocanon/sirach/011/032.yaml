  rationale: 후반절을 수동 표현 ‘복되다고 일컬어질 것’으로 고쳐 히브리어 동사의 태와 앞뒤 반복을 보존했습니다. ‘그의 마지막에 이르러’는 אַחֲרִית의 시간적 끝과 최종 결과의 여지를 유지합니다. 또한 영어 POB 감사 기록에 있는 그리스어 병행 본문의 중대한 이문을 각주로 추가했습니다.
