    issue: 후반절의 수동태가 보존되지 않았습니다.
    rationale: יְאֻשַּׁר는 수동형으로, 사람이 스스로 ‘복되다 할’ 것이 아니라 마지막에 ‘복되다고 일컬어질’ 것입니다.
  - severity: low
    issue: ‘마지막’의 소유 관계와 결과적 의미가 약합니다.
    rationale: בְּאַחֲרִיתוֹ는 ‘그의 끝/마지막’이며 문맥상 최종 결과도 함축합니다. ‘그의 마지막에 이르러’가 이를 더 정확히 반영합니다.
