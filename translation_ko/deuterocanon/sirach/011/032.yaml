review_pass:
  verdict: revise
  source_fidelity: 첫 절의 ‘사람을 살피기 전에’와 ‘그를 복되다 하지 마십시오’는 히브리어의 시간 관계와 평가적 금지를 대체로 충실히 옮깁니다. 그러나 후반부 ‘그가 마지막에 이르면 복되다 할 것’은 히브리어 수동형 יְאֻשַּׁר(‘복되다고 일컬어질 것이다’)을 능동형처럼 처리하며, ‘마지막’의 소유 관계도 충분히 드러내지 못합니다.
  naturalness: ‘복되다 하지 마십시오’도 이해되지만 ‘복되다고 하지 마십시오’가 현대 표준 한국어에서 더 자연스럽습니다. ‘그의 마지막에 이르러’는 죽음만으로 한정하지 않으면서도 אַחֲרִית의 끝·최종 결과의 폭을 보존합니다.
  terminology: ‘복되다/복되다고 일컬어지다’는 אשר의 앞선 능동형과 뒤의 수동형의 반복 및 대비를 자연스럽게 유지합니다. אָדָם은 이 격언에서 일반적 개인을 가리키므로 ‘사람’이 적절합니다.
  issues:
