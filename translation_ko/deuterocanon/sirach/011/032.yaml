base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/011/032.yaml
  text: Before you examine a man[a], do not call him blessed[b], for a man will be called blessed in his end.
  footnotes:
  - marker: a
    text: Or 'Before you investigate a person, do not pronounce him happy; for in his outcome a person is pronounced happy.' The Hebrew repeats the verb 'call blessed' in active and passive forms.
    reason: lexical_alternative
  - marker: b
    text: The Greek parallel in Swete differs substantially here ('From a spark of fire a heap of coals will be multiplied, and a sinful man lies in wait for blood'), indicating a major textual divergence between the Hebrew and Greek witnesses for this verse.
    reason: textual_variant
translation:
  language: ko
  text: 사람을 살피기 전에 그를 복되다 하지 마십시오. 그가 마지막에 이르면 복되다 할 것이기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 앞뒤에서 같은 동사 אשר를 능동형과 수동형으로 반복하여, ‘복되다’ 판정의 행위와 결과를 대조합니다.
    reason: source_note
lexical_decisions:
- source_word: בְּטֶרֶם תַּחְקֹר
  english_pob_choice: Before you examine
  chosen_korean: 사람을 살피기 전에
  alternatives_korean:
  - 사람을 조사하기 전에
  - 사람을 시험하기 전에
  lexicon: HALOT
  rationale: תַּחְקֹר는 지혜 문맥에서 사람의 상태나 됨됨이를 살피는 뜻이므로, 한국어에서는 자연스러운 ‘살피다’로 옮겨 원문의 평가적 뉘앙스를 살렸습니다.
- source_word: אַל תְּאַשְּׁרֵהוּ
  english_pob_choice: do not call him blessed
  chosen_korean: 그를 복되다 하지 마십시오
  alternatives_korean:
  - 그를 행복하다 하지 마십시오
  - 그를 복 있다고 하지 마십시오
  - 그를 축복받았다고 하지 마십시오
  lexicon: HALOT
  rationale: אשר의 사역형은 ‘복되다/행복하다고 판정하다’는 뜻이므로, 교회적 관용구에 기대기보다 판정 행위를 드러내는 표현으로 옮겼습니다.
- source_word: בְּאַחֲרִיתוֹ
  english_pob_choice: in his end
  chosen_korean: 그가 마지막에 이르면
  alternatives_korean:
  - 그의 끝에서
  - 그의 말년에
  - 그의 결과에서
  lexicon: HALOT
  rationale: אַחֲרִית는 단순한 종결보다 ‘최종 결과’까지 포함할 수 있어, 지혜서의 의도를 살려 한국어에서는 시간적·결과적 함의를 함께 드러냈습니다.
- source_word: יְאֻשַּׁר
  english_pob_choice: will be called blessed
  chosen_korean: 복되다 할 것이기 때문입니다
  alternatives_korean:
  - 복되다고 판정될 것이기 때문입니다
  - 행복하다 할 것이기 때문입니다
  lexicon: HALOT
  rationale: 앞의 능동형과 대응하는 수동형을 살려 ‘복되다 하다’로 일관되게 번역해, 히브리어의 반복 구조를 유지했습니다.
theological_decisions:
- issue: אָדָם의 한국어 처리
  chosen_reading: 사람
  alternative_readings:
  - 한 남자
  - 인간
  rationale: 히브리어 אָדָם은 여기서 특정 성별보다 일반적 인간을 가리키므로, 현대 한국어에서는 자연스럽고 성중립적인 ‘사람’으로 옮겼습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4; Contested terms table for אָדָם
