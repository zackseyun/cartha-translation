base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/011/015.yaml
  text: And the eye of the Lord looked on him for good[c][b][a], and shook him out of the dust of filth.
  footnotes:
  - marker: a
    text: Or 'the eye of the Lord watched him with favor'; the Hebrew phrase combines divine sight with beneficial intent.
    reason: lexical_alternative
  - marker: b
    text: '''Dust of filth'' may also be understood as ''dust of stench'' or ''foul dust''; the Hebrew image is vivid but somewhat uncertain in nuance.'
    reason: alternative_reading
  - marker: c
    text: 'The Greek parallel for this verse differs sharply: ''The Lord plucked up the roots of nations and planted the humble in their place.'' The Hebrew and Greek appear to reflect substantially different textual forms.'
    reason: textual_variant
translation:
  language: ko
  text: 주의 눈이 그를 호의롭게 살피시고, 그를 더러운 먼지에서 떨쳐 내셨습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘호의롭게’는 ‘좋게’ 또는 ‘그의 유익을 위해’로도 옮길 수 있으나, 여기서는 호의적인 시선이라는 뜻을 자연스럽게 드러내는 표현을 택했습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘더러운 먼지’는 ‘악취 나는 먼지’ 또는 ‘더럽고 악취 나는 먼지’로도 이해할 수 있습니다. 히브리어 צַחֲנָה는 불결함과 악취의 뉘앙스를 함께 가질 수 있습니다.
    reason: alternative_reading
  - marker: c
    text: 그리스어 평행본문은 전혀 다른 형태로, ‘주께서 민족들의 뿌리를 뽑으시고 그 자리에 낮은 이들을 심으셨다’고 읽습니다.
    reason: textual_variant
lexical_decisions:
- source_word: וְעֵין יי
  english_pob_choice: And the eye of the Lord
  chosen_korean: 주의 눈이
  alternatives_korean:
  - 주님의 눈이
  - 야훼의 눈이
  lexicon: HALOT
  rationale: 히브리어의 구체적인 이미지인 ‘눈’(eye)을 살리고, יי는 본문 흐름에 맞게 ‘주’로 옮겼습니다. ‘주의 눈이’는 신적 관심과 감시의 이미지를 자연스럽게 드러냅니다.
- source_word: צָפַתְהוּ
  english_pob_choice: looked on him
  chosen_korean: 그를 좋게 살피고
  alternatives_korean:
  - 그를 바라보고
  - 그를 지켜보고
  - 그를 살펴보고
  lexicon: HALOT
  rationale: 동사는 단순한 관찰보다 관심 어린 주시를 뜻하므로, 앞의 ‘눈’ 이미지와 맞게 ‘살피고’로 옮기되, לְטוֹב의 긍정적 방향을 함께 반영했습니다.
- source_word: לְטוֹב
  english_pob_choice: for good
  chosen_korean: 좋게
  alternatives_korean:
  - 유익하게
  - 호의로
  - 그의 유익을 위해
  lexicon: HALOT
  rationale: 직역하면 ‘좋게/유익하게’의 방향을 나타내므로, 한국어에서는 부사적으로 처리해 앞 절의 신적 시선을 자연스럽게 연결했습니다. 과도한 확장인 ‘그의 유익을 위해’는 피했습니다.
- source_word: וַיְנַעֲרֵהוּ מֵעֲפַר צַחֲנָה
  english_pob_choice: and shook him out of the dust of filth
  chosen_korean: 그를 더러운 먼지에서 털어 내십니다
  alternatives_korean:
  - 그를 더러운 먼지에서 흔들어 내십니다
  - 그를 악취 나는 먼지에서 털어 내십니다
  - 그를 더럽고 악취 나는 먼지에서 떨쳐 내십니다
  lexicon: HALOT
  rationale: מֵעֲפַר은 ‘먼지에서’, צַחֲנָה는 물질적 오물보다 더럽고 불결한 상태를 가리키므로 ‘더러운 먼지’로 옮겼습니다. וַיְנַעֲרֵהוּ의 강한 ‘털어 내다/흔들어 내다’ 이미지를 살리되, 문장 전체는 합쇼체에 맞게 정리했습니다.
theological_decisions:
- issue: 하나님 주권적 개입을 나타내는 ‘눈’과 ‘털어 내다’의 이미지
  chosen_reading: 하나님이 사람의 낮은 상태를 외면하지 않으시고, 호의로 살피시며 그 상태에서 건져 내시는 장면으로 읽었습니다.
  alternative_readings:
  - 단순히 관찰하신다
  - 물리적으로 옮겨 놓으신다
  rationale: 히브리어는 시선의 긍정성과 강한 전환 동작을 함께 묶어 표현하므로, 둘 중 하나로 약화하지 않고 모두 드러내는 쪽을 택했습니다.
  doctrine_reference: 시락 11:15의 신적 섭리와 구제 이미지
