base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/011/021.yaml
  text: There is one who grows rich through affliction[b][a], and this is the reward he deserves.
  footnotes:
  - marker: a
    text: Or 'through self-denial,' 'through suffering,' or 'from toil.' The Hebrew מֵהִתְעַנּוֹת is broad enough to cover hardship or self-affliction; the Greek parallel points toward labor and poverty.
    reason: lexical_alternative
  - marker: b
    text: Hebrew literally, 'and this will make liable his reward' (or similar). The clause is difficult; the translation gives the probable sense of due recompense in idiomatic English.
    reason: alternative_reading
translation:
  language: ko
  text: 고난을 겪으면서 부유해지는 사람이 있으며, 이것이 그가 받을 보상입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 מֵהִתְעַנּוֹת은 ‘고난’뿐 아니라 ‘자기 절제’, ‘고통’, 또는 ‘수고’를 가리킬 수 있는 넓은 표현입니다. 그리스어 병행문은 수고와 가난의 맥락을 보입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 직역하면 ‘이것이 그의 보상을 의무로 한다’ 정도이나, 문법 관계와 정확한 뜻이 난해합니다. יְחַיֵּב은 ‘의무를 지우다’ 또는 ‘책임이 있게 하다’라는 뜻을 낼 수 있습니다. 본문은 문맥상 보상에 관한 말로 옮겼습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יֵשׁ
  english_pob_choice: There is one
  chosen_korean: 한 사람은
  alternatives_korean:
  - 한 사람이 있습니다
  - 있습니다
  lexicon: HALOT
  rationale: 잠언형 관찰문으로서 특정 인물을 가리키기보다 유형적 인물을 도입하므로, 한국어에서는 간결하게 ‘한 사람은’으로 시작해 문장의 자연스러움을 살렸습니다.
- source_word: מִתְעַשּׁר
  english_pob_choice: grows rich
  chosen_korean: 부유해지며
  alternatives_korean:
  - 부자가 되며
  - 부유해집니다
  lexicon: HALOT
  rationale: 히트파엘 분사는 ‘풍부해져 가다’라는 진행성을 띠므로, 상태 진술보다 과정감을 살린 ‘부유해지며’가 적절합니다.
- source_word: מֵהִתְעַנּוֹת
  english_pob_choice: through affliction
  chosen_korean: 고난을 통해
  alternatives_korean:
  - 자기 절제를 통해
  - 고통을 통해
  - 수고를 통해
  lexicon: HALOT
  rationale: 히브리어는 자발적 금욕과 강요된 고난을 모두 열어 두며, 헬라어 병행문도 수고/가난의 맥락을 보이므로 의미 범위를 좁히지 않는 ‘고난을 통해’를 택했습니다.
- source_word: יְחַיֵּב שְׂכָרוֹ
  english_pob_choice: the reward he deserves
  chosen_korean: 그에게 마땅히 돌아갈 보상입니다
  alternatives_korean:
  - 그의 보상입니다
  - 그가 마땅히 받을 보수입니다
  - 그에게 귀속될 보상입니다
  lexicon: HALOT
  rationale: יְחַיֵּב은 ‘책임을 지우다/부과하다’의 뉘앙스를 지니므로, 직역을 억지로 늘이기보다 ‘마땅히 돌아갈 보상’으로 옮겨 보상의 당위성과 귀속성을 함께 드러냈습니다.
theological_decisions:
- issue: 고난과 부의 관계를 보상 개념으로 어떻게 옮길 것인가
  chosen_reading: 본문은 어떤 사람이 고난을 통하여 부유해질 수 있으며, 그 결과가 그에게 합당한 보상으로 주어진다는 지혜의 관찰로 읽었습니다.
  alternative_readings:
  - 자기 절제를 통해 부유해지며, 이것이 그의 보상입니다
  - 수고를 통해 부유해지며, 이것이 그의 삯입니다
  rationale: 히브리어의 압축된 표현은 행위의 공로를 체계화하기보다 관찰적 진술에 가깝습니다. 따라서 원문이 가진 보상 언어는 살리되, 더 강한 공로론으로 확장하지 않도록 했습니다.
  doctrine_reference: 지혜문학의 관찰 진술은 교리적 체계화보다 본문의 표현 강도를 우선 보존해야 합니다.
