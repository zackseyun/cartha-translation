base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/011/010.yaml
  text: Do not contend where there is no cause[b][a], and do not rise up in the quarrel of the arrogant.
  footnotes:
  - marker: a
    text: 'The Greek reads very differently here: ''My child, do not let your actions be occupied with many things; if you multiply them, you will not be acquitted; if you pursue, you will not overtake; and by fleeing you will not escape.'' This likely reflects a different Hebrew Vorlage or a major textual divergence.'
    reason: alternative_reading
  - marker: b
    text: Hebrew עַצָּבָה is uncertain in nuance here; it may mean 'grief,' 'trouble,' or 'cause/offense.' The translation takes it as the absence of valid grounds for contention.
    reason: lexical_alternative
translation:
  language: ko
  text: 근거가 없을 때 다투지 마십시오[b][a], 그리고 교만한 자들의 다툼에 끼어들지 마십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '그리스어 본문은 매우 다르게 읽습니다: ‘내 아이야, 네 행동이 많은 일들에 얽매이게 하지 마라. 네가 그것들을 늘리면 무죄함을 얻지 못할 것이며, 추격하면 따라잡지 못하고, 달아나도 도망치지 못할 것이다.’ 이는 다른 히브리어 전승 또는 큰 본문 차이를 반영하는 듯합니다.'
    reason: textual_variant
  - marker: b
    text: 히브리어 עַצָּבָה는 여기서 뜻이 분명하지 않으며, ‘슬픔’, ‘괴로움’, ‘근거/명분’ 등으로 이해될 수 있습니다. 번역은 다툼의 정당한 근거가 없다는 뜻으로 취했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּאֵין עַצָּבָה
  english_pob_choice: where there is no cause
  chosen_korean: 근거가 없을 때
  alternatives_korean:
  - 사유가 없을 때
  - 명분이 없을 때
  - 갈 이유가 없을 때
  lexicon: HALOT
  rationale: עַצָּבָה는 뜻이 불분명하지만, 본문에서 분쟁의 정당한 이유가 없다는 경고로 읽는 것이 가장 자연스럽습니다. 한국어로는 과도하게 해석하지 않으면서도 상황을 분명히 하는 ‘근거가 없을 때’가 적절합니다.
- source_word: אַל תִּתְחָר
  english_pob_choice: do not contend
  chosen_korean: 다투지 마십시오
  alternatives_korean:
  - 달아오르지 마십시오
  - 분쟁을 일으키지 마십시오
  - 시비하지 마십시오
  lexicon: HALOT
  rationale: התחר의 감정적 격화와 분쟁 가담의 뜻을 살려, 현대 한국어에서 즉각 이해되는 금지 표현으로 옮겼습니다.
- source_word: זֵדִים
  english_pob_choice: the arrogant
  chosen_korean: 교만한 자들
  alternatives_korean:
  - 오만한 자들
  - 거만한 자들
  - 불손한 자들
  lexicon: HALOT
  rationale: זֵדִים은 거만하고 방자한 태도를 가리키므로, 한국어 성경 문맥에서 널리 통하는 ‘교만한 자들’이 가장 안정적입니다.
- source_word: וּבְרִיב ... אַל תְּקוֹמֵם
  english_pob_choice: do not rise up in the quarrel
  chosen_korean: 다툼에 끼어들지 마십시오
  alternatives_korean:
  - 분쟁에 일어나지 마십시오
  - 그들의 다툼에 맞서지 마십시오
  - 시비에 뛰어들지 마십시오
  lexicon: HALOT
  rationale: תְּקוֹמֵם의 문자적 ‘일어남’ 이미지는 살리되, 한국어에서는 관용적으로 ‘끼어들다’가 분쟁에 자발적으로 가담하는 뉘앙스를 잘 전달합니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행본문의 관계
  chosen_reading: 히브리어 본문을 본문으로 삼고, 그리스어는 별개의 전승으로만 본문 이면에 둡니다.
  alternative_readings:
  - 그리스어를 따라 ‘아들아, 네 행동이 많은 일에 얽매이지 않게 하라…’로 옮김
  rationale: 여기서는 현존 히브리어가 명확하므로 그 본문을 따라야 하며, 그리스어는 상당히 다른 전승이어서 본문 번역을 대체하지 않습니다.
  doctrine_reference: 'Sirach 번역 원칙: 히브리어가 보존된 경우 히브리어 본문 우선, 그리스어는 대조 증거로 사용'
- issue: 문장 첫머리의 ‘where there is no cause’ 해석
  chosen_reading: 분쟁의 정당한 근거가 없다는 뜻으로 읽습니다.
  alternative_readings:
  - 상처가 없을 때
  - 슬픔이 없을 때
  - 괴로움이 없을 때
  rationale: 문맥상 단순한 감정 상태보다 다툼을 정당화할 이유의 부재를 가리키는 것으로 보는 편이 권면의 힘을 더 잘 보존합니다.
  doctrine_reference: 잠언형 경구의 문맥적 의미 우선 원칙
