  text: Do not laugh with him[a], lest you share his pain, and in the end you will gnash your teeth.
  footnotes:
  - marker: a
    text: 'Or ''Do not laugh with him ... and at the last you will grind your teeth.'' The Greek wording allows slightly more formal renderings, but the sense is the same: indulgent amusement now leads to later distress.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그와 함께 웃지 마십시오. 그러다가 그와 함께 고통을 겪게 되고, 마침내 이를 갈게 될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그와 함께 웃지 마십시오… 마지막에는 이를 갈게 될 것입니다.” 그리스어 συγγελάσῃς는 ‘함께 웃다’, συνοδυνηθῇς는 ‘함께 고통을 겪다’ 또는 ‘함께 아파하다’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ συγγελάσῃς αὐτῷ
  english_pob_choice: Do not laugh with him
  chosen_korean: 그와 함께 웃지 마십시오
  alternatives_korean:
  - 그와 웃지 마십시오
  - 그와 함께 웃어 주지 마십시오
  - 함께 웃어 넘기지 마십시오
  lexicon: LSJ
  rationale: συγγελάσῃς는 단순한 동시 행위보다 상대의 웃음에 동참하는 뉘앙스가 있어, 한국어에서는 ‘그와 함께 웃다’로 자연스럽게 살렸습니다.
- source_word: ἵνα μὴ συνοδυνηθῇς
  english_pob_choice: lest you share his pain
  chosen_korean: 그의 고통에 함께 휩쓸리게 되고
  alternatives_korean:
  - 그의 고통을 함께 겪게 되고
  - 그의 아픔을 함께 나누게 되고
  - 그와 함께 고통받게 되고
  lexicon: LSJ
  rationale: συνοδυνηθῇς는 함께 아파하고 함께 고통받는 의미로, 직역보다 경고의 결과를 드러내는 ‘함께 휩쓸리다’가 문맥상 더 자연스럽습니다.
- source_word: ἐπʼ ἐσχάτῳ
  english_pob_choice: in the end
  chosen_korean: 끝내는
  alternatives_korean:
  - 마침내
  - 결국
  - 마지막에는
  lexicon: LSJ
  rationale: 시간적 종결을 가리키는 표현으로, 현대 한국어의 경고문맥에 맞는 ‘끝내는’이 가장 직접적입니다.
- source_word: γομφιάσεις τοὺς ὀδόντας σου
  english_pob_choice: you will gnash your teeth
  chosen_korean: 이를 갈게 될 것입니다
  alternatives_korean:
  - 이를 갈 것입니다
  - 이를 악물게 될 것입니다
  - 이를 갈고 말 것입니다
  lexicon: LSJ
  rationale: 구체적 관용구를 한국어 관용으로 옮기되, 분노·고통의 표현인 ‘이를 갈다’를 사용해 원문의 비유적 긴장감을 유지했습니다.
theological_decisions:
- issue: 권면의 어조
  chosen_reading: 직접 경고형 명령문으로 옮겨, 현재의 동조적 웃음이 훗날 고통으로 이어진다는 도덕적 인과를 분명히 했습니다.
  alternative_readings:
  - 완곡한 권고형으로 낮추기
  - 단순 정보문으로 옮기기
  rationale: 원문은 금지 명령과 결과절로 구성된 강한 경고이므로, 한국어에서도 명령형을 유지하는 것이 문장 기능을 가장 잘 보존합니다.
  doctrine_reference: 지혜문학의 훈계와 경고 구조
- issue: ‘그의 고통에 함께 휩쓸리게 되고’의 결과성
  chosen_reading: 웃음에 동참하면 나중에 같은 고통에 빠지게 된다는 인과적 경고로 이해했습니다.
  alternative_readings:
  - 단순한 감정적 공감
  - 윤리적 비난만을 강조
  rationale: 문맥상 단순한 공감이 아니라 행동의 결과로 오는 고통을 경고하므로, 결과성을 드러내는 번역이 필요합니다.
  doctrine_reference: 지혜문학의 행위-결과 교훈
