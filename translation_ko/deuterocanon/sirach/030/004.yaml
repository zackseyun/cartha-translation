  lexicon: LSJ
  rationale: 명시된 명사 없이 실질적으로 후손/자식을 가리키므로, 본문에 없는 ‘아들’을 본문에 직접 넣지 않고 ‘자기와 같은 이’로 유지했습니다.
theological_decisions:
- issue: 후손을 본문에서 ‘아들’로 명시할지 여부
  chosen_reading: 본문은 ‘자기와 같은 이’를 유지하고, 주석에서 후손 가능성을 밝혔습니다.
  alternative_readings:
  - 그와 같은 아들
  - 자기 같은 아들
  rationale: 앞 문맥상 아들을 가리킬 가능성은 크지만, 이 절 자체는 ὅμοιον만 사용하므로 본문에는 명시되지 않은 성별/관계어를 과도하게 보태지 않았습니다.
