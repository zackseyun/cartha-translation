base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/030/004.yaml
  text: His father has died[a], yet it is as though he had not died, for he has left behind one like himself after him.
  footnotes:
  - marker: a
    text: Literally, 'he left behind after him one like himself.' In context, this refers to surviving offspring, likely a son.
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 아버지는 죽었습니다[a]. 그러나 그가 죽지 않은 것과 같으니, 그 뒤에 자기와 같은 이를 남겨 두었기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그는 그 뒤에 자기와 같은 이를 남겨 두었다’입니다. 문맥상 생존한 후손, 아마도 아들을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐτελεύτησεν
  english_pob_choice: has died
  chosen_korean: 죽었습니다
  alternatives_korean:
  - 숨을 거두었습니다
  - 세상을 떠났습니다
  lexicon: LSJ
  rationale: 동사는 여기서 죽음을 뜻하므로, 완곡하게 돌리지 않고 직접적이고 자연스러운 표준어로 옮겼습니다.
- source_word: ὡς οὐκ ἀπέθανεν
  english_pob_choice: as though he had not died
  chosen_korean: 죽지 않은 것과 같으니
  alternatives_korean:
  - 죽지 않은 듯하니
  - 죽지 않은 것처럼
  lexicon: LSJ
  rationale: 비교를 나타내는 ὡς의 뉘앙스를 살려 실제 부정이 아니라 ‘마치 ~하지 않은 것처럼’으로 옮겼습니다.
- source_word: ὅμοιον ... μετʼ αὐτόν
  english_pob_choice: one like himself ... after him
  chosen_korean: 자기와 같은 이를 ... 그 뒤에
  alternatives_korean:
  - 자기와 같은 사람을 ... 뒤에
  - 자기와 닮은 이를 ... 그 뒤에
  lexicon: LSJ
  rationale: 명시된 명사 없이 실질적으로 후손/자식을 가리키므로, 본문에 없는 ‘아들’을 본문에 직접 넣지 않고 ‘자기와 같은 이’로 유지했습니다.
theological_decisions:
- issue: 후손을 본문에서 ‘아들’로 명시할지 여부
  chosen_reading: 본문은 ‘자기와 같은 이’를 유지하고, 주석에서 후손 가능성을 밝혔습니다.
  alternative_readings:
  - 그와 같은 아들
  - 자기 같은 아들
  rationale: 앞 문맥상 아들을 가리킬 가능성은 크지만, 이 절 자체는 ὅμοιον만 사용하므로 본문에는 명시되지 않은 성별/관계어를 과도하게 보태지 않았습니다.
  doctrine_reference: 'Translation philosophy: Never paraphrase beyond what the source text warrants.'
