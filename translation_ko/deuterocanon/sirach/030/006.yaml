  lexicon: LSJ
  rationale: χάρις는 이 문맥에서 신학적 '은혜'보다 인간관계의 호의·호감을 뜻하므로, '은혜를 갚는 이'로 하되 한국어에서 상투적인 종교어로 오해되지 않도록 문맥을 반영했습니다.
- source_word: κατέλιπεν
