  lexicon: LSJ
  rationale: ἔκδικος/ἔκδικον은 원수를 상대로 응징하거나 정의를 집행하는 이를 가리키므로, 본문이 가진 응징적 힘을 살리기 위해 '복수자'를 택했습니다.
- source_word: ἀνταποδιδόντα χάριν
