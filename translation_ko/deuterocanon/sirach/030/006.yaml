  verdict: revise
  source_fidelity: 핵심 대조와 보응의 의미는 대체로 충실합니다. 다만 그리스어의 공통 동사 κατέλιπεν은 두 목적어에 모두 걸리므로, 둘째 구절도 ‘남겼습니다’에 연결되도록 바로잡아야 합니다.
  naturalness: ‘이였습니다’는 현대 표준어 합쇼체 서술형으로 부자연스럽고, 현 문장은 둘째 목적어가 독립 서술어처럼 처리되어 원문의 병렬 구조를 흐립니다. ‘호의를 되갚는 이’가 인간관계 문맥의 χάριν을 자연스럽게 전달합니다.
  terminology: ‘복수자’는 ἔκδικον의 응징적 함의를 보존합니다. 그러나 각주 대안은 ‘변호자’보다 권리의 옹호나 정의의 실현이라는 의미 범위를 더 정확히 밝혀야 합니다. χάρις는 여기서 신학적 ‘은혜’보다 ‘호의’가 적절합니다.
  issues:
  - severity: medium
    issue: 둘째 절이 공통 동사 ‘남겼고/남겼습니다’에 문법적으로 연결되지 않았습니다.
    rationale: κατέλιπεν은 ‘복수자’와 ‘호의를 되갚는 이’ 모두를 목적어로 취합니다. 한국어도 두 목적어가 모두 ‘남겼습니다’에 걸리게 해야 원문의 통사와 뜻이 보존됩니다.
  - severity: low
    issue: ‘이였습니다’는 표준 현대 합쇼체에 맞지 않습니다.
    rationale: 서술격 조사 뒤 과거형은 ‘이었습니다’가 표준이지만, 이 구절에서는 애초에 독립 서술이 아니라 ‘이를 남겼습니다’로 처리하는 것이 더 정확합니다.
  - severity: low
    issue: ‘은혜를 갚는 이’는 χάρις의 비종교적 사회 관계 의미를 다소 흐릴 수 있습니다.
    rationale: 이 문맥의 χάρις는 친구 사이에 받은 호의나 친절에 대한 보답을 뜻하므로 ‘호의를 되갚는 이’가 더 분명합니다.
  revised_text: 그는 원수들 앞에 복수자를 남겼고, 친구들에게 호의를 되갚는 이를 남겼습니다.
  revised_footnotes:
  - marker: a
    text: 또는 ‘권리를 옹호하는 이’, ‘정의를 바로잡는 이’. 이 그리스어는 다른 이를 대신하여 정의나 보응을 실현하는 사람을 가리킬 수 있습니다.
    reason: lexical_alternative
  revision_rationale: 공통 동사 ‘남겼습니다’를 두 병렬 목적어에 적용하여 그리스어 통사를 보존했습니다. ‘호의’로 χάρις의 사회적 상호성 의미를 명확히 했으며, ‘복수자’는 본문의 강한 보응 의미를 유지했습니다. 각주는 ἔκδικον의 가능한 법적·옹호적 의미를 제시하되 본문의 응징적 뉘앙스를 약화하지 않도록 조정했습니다.
