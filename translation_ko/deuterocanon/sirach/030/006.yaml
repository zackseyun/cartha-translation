lexical_decisions:
- source_word: ἐναντίον ἐχθρῶν
  english_pob_choice: Before enemies
  chosen_korean: 원수들 앞에서
  alternatives_korean:
  - 원수들 앞에
  - 원수들 앞에서 대하여
  - 원수들을 향하여
  lexicon: LSJ
  rationale: ἐναντίον은 단순한 시간·공간의 '앞'보다 대항적 상황 속에서의 위치를 나타내므로, 한국어에서는 '원수들 앞에서'가 공개적 대치의 뉘앙스를 자연스럽게 살립니다.
- source_word: ἔκδικον
  english_pob_choice: an avenger
  chosen_korean: 복수자
  alternatives_korean:
  - 보복하는 이
  - 변호자
  - 옹호자
  - 옳음을 밝히는 이
  lexicon: LSJ
  rationale: ἔκδικος/ἔκδικον은 원수를 상대로 응징하거나 정의를 집행하는 이를 가리키므로, 본문이 가진 응징적 힘을 살리기 위해 '복수자'를 택했습니다.
- source_word: ἀνταποδιδόντα χάριν
  english_pob_choice: one who repays kindness
  chosen_korean: 은혜를 갚는 이
  alternatives_korean:
  - 호의를 되갚는 이
  - 은혜에 보답하는 이
  - 호의에 보답하는 이
  lexicon: LSJ
  rationale: χάρις는 이 문맥에서 신학적 '은혜'보다 인간관계의 호의·호감을 뜻하므로, '은혜를 갚는 이'로 하되 한국어에서 상투적인 종교어로 오해되지 않도록 문맥을 반영했습니다.
- source_word: κατέλιπεν
  english_pob_choice: left behind
  chosen_korean: 남겼고
  alternatives_korean:
  - 두고 갔고
  - 남겨 두었고
  - 남겨 놓았고
  lexicon: LSJ
  rationale: κατέλιπεν은 뒤에 남겨 둔 상태를 나타내므로, 상속적 맥락을 과하게 풀지 않으면서도 자연스러운 서술로 '남겼고'를 사용했습니다.
theological_decisions:
- issue: ἔκδικον의 강한 응징성 보존
  chosen_reading: '''복수자''로 옮겨 아들/후손이 원수에게 대응하는 응징적 의미를 보존했습니다.'
  alternative_readings:
  - '''변호자'''
  - '''옹호자'''
  - '''옳음을 밝히는 이'''
  rationale: 본문은 단순한 보호가 아니라 원수에 대한 대응을 전제하므로, 그 긴장을 완화하지 않고 직설적으로 옮기는 것이 원문 의도에 더 가깝습니다.
