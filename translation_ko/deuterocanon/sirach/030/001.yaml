  source_fidelity: 그리스어 ἐνδελεχήσει는 미래 직설법이므로, 초안의 ‘대어야 합니다’(의무·당위)는 원문의 예언적/일반적 미래 진술을 ‘해야 한다’는 명령으로 바꿉니다. 이를 미래 진술인 ‘할 것입니다’로 고쳐야 합니다. μάστιγας의 직접적인 체벌 이미지는 ‘매질’로 유지할 수 있습니다. ἵνα 절의 목적 관계와 ἐπʼ ἐσχάτων αὐτοῦ의 폭넓은 시간·결말의 함의는 ‘자신이 마지막 때에 기뻐하게 되도록’ 및 각주로 보존했습니다.
  naturalness: ‘아들을 사랑하는 이는’은 잠언적 일반 진술에 자연스럽고, 현대 표준 한국어의 격식 있는 합쇼체에 맞습니다. ‘매를 꾸준히 대다’도 가능하나, 이 문맥에서는 ‘아들에게 매질을 꾸준히 하다’가 도구와 행위 양쪽으로 쓰일 수 있는 μάστιγας를 더 자연스럽게 드러냅니다.
  terminology: υἱός는 ‘아들’로 유지했습니다. μάστιγας는 ‘매질’로 번역하여 체벌 이미지를 추상적인 ‘훈육’으로 완화하지 않았습니다. ‘마지막 때’는 ‘말년’보다 생애의 후반기에 한정하지 않으면서, 원문의 ‘마지막 일들/끝’이라는 다의성을 보존합니다.
