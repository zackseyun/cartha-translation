  lexicon: LSJ
  rationale: υἱός는 ‘아들’이므로 성중립적인 ‘자녀’로 완화하지 않고, 소유 대명사는 한국어 문맥상 생략해도 의미가 유지됩니다.
- source_word: ἐνδελεχήσει μάστιγας αὐτῷ
  english_pob_choice: will continue the lash for him
  chosen_korean: 매를 꾸준히 대어야 합니다
  alternatives_korean:
  - 채찍을 계속해야 합니다
  - 징계를 계속해야 합니다
  - 매질을 계속해야 합니다
  lexicon: LSJ
  rationale: ἐνδελεχήσει는 지속적·성실한 계속을, μάστιγας는 체벌의 도구/행위를 가리키므로, 소스의 강도를 유지하면서도 한국어 자연성을 위해 ‘매를 꾸준히 대다’로 옮겼습니다.
- source_word: ἐπʼ ἐσχάτων αὐτοῦ
  english_pob_choice: in his final days
  chosen_korean: 말년에
  alternatives_korean:
  - 마지막에
  - 그의 마지막 때에
  - 최후에
  lexicon: LSJ
  rationale: 이 표현은 후기의 결과나 생의 끝을 모두 포괄할 수 있어, 한국어에서는 관용적인 ‘말년’이 범위를 좁히지 않으면서도 문학적 무게를 살립니다.
theological_decisions:
- issue: 체벌 이미지를 추상화할지 여부
  chosen_reading: ‘매를 꾸준히 대어야 합니다’로 직접적 체벌 이미지를 유지했습니다.
  alternative_readings:
  - 훈육해야 합니다
  - 교정해야 합니다
  - 벌해야 합니다
  rationale: 본문은 μάστιγας를 사용해 명시적으로 체벌의 이미지를 제시하므로, 이를 추상화하면 원문의 긴장을 약화시킵니다. 번역은 그 도덕적 불편함을 지우지 않되, 처벌을 권장하는 신학적 확대도 하지 않습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
- issue: 잠언식 일반 진술의 문체
  chosen_reading: ‘아들을 사랑하는 사람은’으로 일반적·잠언적 문체를 유지했습니다.
  alternative_readings:
  - 아들을 사랑하는 이는
  - 아들을 사랑하면
  rationale: 그리스어의 관사 결합 분사는 보편 명제를 이루므로, 한국어도 잠언체의 일반 진술로 유지하는 것이 본문 의도를 가장 잘 전달합니다.
  doctrine_reference: Translation philosophy §4
