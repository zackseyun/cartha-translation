base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/030/016.yaml
  text: There is no wealth greater than a sound body[b][a], and there is no good greater than a glad heart.
  footnotes:
  - marker: a
    text: Hebrew 'soundness of body' is supported by the Greek parallel 'health of body.' The Hebrew phrase is idiomatic and somewhat compressed.
    reason: lexical_alternative
  - marker: b
    text: Or 'joy of heart.' The Hebrew literally says 'goodness of heart,' while the Greek parallel reads 'joy of heart.'
    reason: alternative_reading
translation:
  language: ko
  text: 건강한 몸보다 더 큰 재산은 없고, 즐거운 마음보다 더 큰 선도 없습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 표현은 압축적이며, 그리스어 평행본문의 ‘몸의 건강’이 이 뜻을 분명하게 해 줍니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘마음의 선/좋음’에 가깝지만, 그리스어 평행본문은 ‘마음의 기쁨’으로 옮깁니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אין עושר על עושר
  english_pob_choice: There is no wealth greater than
  chosen_korean: 건강한 몸보다 더 큰 재산은 없고
  alternatives_korean:
  - 몸의 건강보다 더 큰 재산은 없고
  - 건강한 몸보다 나은 재산은 없고
  lexicon: HALOT
  rationale: אין ... על의 비교 구조를 한국어의 ‘보다 더 큰’으로 자연스럽게 살렸고, POB가 본문의 압축된 표현을 ‘sound body’로 풀어 읽은 점을 반영했습니다.
- source_word: שַׂר עֶצֶם
  english_pob_choice: a sound body
  chosen_korean: 건강한 몸
  alternatives_korean:
  - 몸의 건강
  - 온전한 몸
  - 건전한 몸
  lexicon: HALOT
  rationale: 히브리어 표현은 압축적이므로, 그리스어 평행본문의 ‘몸의 건강’ 의미를 따라 한국어로는 자연스러운 ‘건강한 몸’으로 옮겼습니다.
- source_word: אין טובה על טוב לבב
  english_pob_choice: there is no good greater than a glad heart
  chosen_korean: 즐거운 마음보다 더 큰 선도 없습니다
  alternatives_korean:
  - 기쁜 마음보다 더 큰 선도 없습니다
  - 마음의 기쁨보다 더 큰 선도 없습니다
  - 좋은 마음보다 더 큰 선도 없습니다
  lexicon: HALOT
  rationale: טוֹבָה를 단순한 형용사보다 명사적 ‘선’으로 살려 반복되는 비교를 유지했고, טוּב לֵבָב은 그리스어 평행본문의 ‘마음의 기쁨’에 맞춰 정서적 의미를 담는 ‘즐거운 마음’으로 옮겼습니다.
theological_decisions:
- issue: 본문의 가치 판단이 신체적 건강과 정서적 기쁨을 ‘재산’과 ‘선’의 언어로 대비합니다.
  chosen_reading: 물질적 부보다 몸의 건강과 마음의 기쁨이 더 귀하다는 지혜문학적 평가로 읽었습니다.
  alternative_readings:
  - 도덕적 선을 뜻하는 추상적 진술로만 읽기
  - ‘좋은 마음’을 인격적 덕목으로 좁혀 읽기
  rationale: 문맥이 지혜문학의 실용적 관찰이므로, 영적 교훈으로 과도하게 추상화하지 않고 본문이 말하는 인간의 온전함을 그대로 드러냈습니다.
  doctrine_reference: 지혜문학의 인간 번영 이해
