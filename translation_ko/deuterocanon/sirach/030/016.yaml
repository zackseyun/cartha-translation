    reason: alternative_reading
translation:
  language: ko
  text: 건강한 몸[a]보다 더 큰 재산은 없고, 즐거운 마음[b]보다 더 큰 선도 없습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 표현은 압축적이며, 그리스어 평행본문의 ‘몸의 건강’이 이 뜻을 뒷받침합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘마음의 좋음’에 가깝지만, 그리스어 평행본문은 ‘마음의 기쁨’으로 옮깁니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אין עושר על עושר
  english_pob_choice: There is no wealth greater than
  chosen_korean: 건강한 몸보다 더 큰 재산은 없고
  alternatives_korean:
