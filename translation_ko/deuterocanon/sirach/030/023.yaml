  text: Do not give your soul over to grief[b][a], and do not stumble in your iniquity.
  footnotes:
  - marker: a
    text: Hebrew לדין is difficult. The Greek parallel supports the sense 'grief' or 'sorrow'; a more literal reading from the Hebrew consonants alone could suggest 'judgment.'
    reason: lexical_alternative
  - marker: b
    text: 'The Greek witness is considerably fuller here: ''Love your soul and comfort your heart, and put grief far from you; for grief has killed many, and there is no benefit in it.'' The Hebrew surviving text is shorter.'
    reason: alternative_reading
translation:
  language: ko
  text: 당신의 영혼을 그리움에 내주지 말고, 당신의 죄악으로 걸려 넘어지지 마십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 לדין은 난해합니다. 그리스어 평행문은 ‘슬픔/근심’의 뜻을 분명히 보태며, 자음만 보면 ‘심판’으로도 읽힐 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어 증언은 여기서 훨씬 더 길며, ‘당신의 영혼을 사랑하고 당신의 마음을 위로하며, 슬픔을 멀리하라…’라고 이어집니다. 현존 히브리어는 더 짧습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אל תתן
  english_pob_choice: Do not give ... over
  chosen_korean: 내주지 말고
  alternatives_korean:
  - 넘겨주지 말고
  - 맡기지 말고
  - 버리지 말고
  lexicon: HALOT
  rationale: נתן + 목적어 구문은 누군가/무언가에 자신을 ‘내어주다’는 뜻으로 자연스럽게 읽히므로, 경고의 뉘앙스를 살려 간결하게 옮겼습니다.
- source_word: לדין
  english_pob_choice: to grief
  chosen_korean: 그리움에
  alternatives_korean:
  - 슬픔에
  - 근심에
  - 심판에
  lexicon: HALOT
  rationale: 히브리어는 난해하지만, 그리스어 병행문의 λύπη가 ‘슬픔/근심’ 계열이므로 법적 의미의 ‘심판’보다 정서적 고통을 가리키는 방향으로 옮겼습니다.
- source_word: נפשך
  english_pob_choice: your soul
  chosen_korean: 당신의 영혼
  alternatives_korean:
  - 당신의 생명
  - 당신의 자기 자신
  lexicon: HALOT
  rationale: נפש은 여기서 인간의 내면적 생명/자아를 가리키며, 한국어에서는 ‘영혼’이 본문의 антропological 용례를 가장 직접적으로 살립니다.
- source_word: בעונך
  english_pob_choice: in your iniquity
  chosen_korean: 당신의 죄악으로
  alternatives_korean:
  - 당신의 악으로
  - 당신의 죄로
  - 당신의 죄책으로
  lexicon: HALOT
  rationale: עון은 죄악, 죄책, 불의의 무게를 포괄하므로, 도덕적 무게를 분명히 하는 ‘죄악’으로 옮겼습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 평행문의 범위 차이
  chosen_reading: 본문은 히브리어의 짧은 두 행을 따르되, 난해한 לדין은 그리스어 평행문을 따라 ‘슬픔/근심’ 계열로 이해했습니다.
  alternative_readings:
  - 그리스어를 따라 더 길게 ‘당신의 영혼을 사랑하고 당신의 마음을 위로하며…’로 확장 번역
  - 히브리어 자음만 따라 ‘심판’으로 직역
  rationale: 이 절은 히브리어가 우선이지만 보존이 짧고 어려운 표현이 있어, 평행문의 도움으로 의미를 보정하되 본문 길이는 늘리지 않는 것이 가장 투명합니다.
  doctrine_reference: 'PHILOSOPHY.md: translate from Hebrew where it survives; use Greek parallel as actual translation input.'
