  text: He who instructs his son will provoke the enemy to jealousy[a], and in the presence of friends he will rejoice over him.
  footnotes:
  - marker: a
    text: Or 'will make the enemy envious.' The Greek verb can denote provoking jealousy or envy.
    reason: lexical_alternative
translation:
  language: ko
  text: 자기 아들을 훈계하는 이는 원수의 질투를 불러일으키고, 친구들 앞에서는 그로 인해 기뻐하게 됩니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘원수를 시기하게 할 것이다.’ 그리스어 동사는 질투와 시기 둘 다를 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ διδάσκων
  english_pob_choice: He who instructs
  chosen_korean: 훈계하는 이는
  alternatives_korean:
  - 가르치는 이는
  - 훈련하는 이는
  lexicon: BDAG
  rationale: 지속적 행위를 나타내는 분사이므로 단순한 한 번의 교육보다 양육·형성의 뉘앙스가 살아 있는 ‘훈계하다’를 택했습니다.
- source_word: τὸν υἱὸν αὐτοῦ
  english_pob_choice: his son
  chosen_korean: 자기 아들
  alternatives_korean:
  - 그의 아들
  - 자녀
  lexicon: BDAG
  rationale: 그리스어는 남성 단수 ‘아들’을 분명히 가리키므로, 성별을 지우지 않되 한국어에서는 소유관계를 자연스럽게 ‘자기 아들’로 옮겼습니다.
- source_word: παραζηλώσει
  english_pob_choice: will provoke ... to jealousy
  chosen_korean: 질투를 불러일으키고
  alternatives_korean:
  - 시기하게 하고
  - 질투하게 하고
  - 분발하게 하고
  lexicon: BDAG
  rationale: 이 동사는 문맥상 단순한 ‘부러움’보다 질투/시기라는 강한 감정을 유발한다는 뜻이어서, 그 긴장을 약화하지 않도록 직역에 가깝게 옮겼습니다.
- source_word: ἔναντι φίλων ἐπʼ αὐτῷ ἀγαλλιάσεται
  english_pob_choice: in the presence of friends he will rejoice over him
  chosen_korean: 친구들 앞에서는 그로 인해 기뻐하게 됩니다
  alternatives_korean:
  - 친구들 앞에서 그를 두고 기뻐하게 됩니다
  - 친구들 앞에서 그를 두고 크게 기뻐하게 됩니다
  lexicon: BDAG
  rationale: ἔναντι는 ‘앞에서/면전에서’의 공개적 장면을 가리키며, ἐπʼ αὐτῷ는 기쁨의 이유를 나타내므로 한국어에서는 ‘그로 인해’로 자연스럽게 연결했습니다.
