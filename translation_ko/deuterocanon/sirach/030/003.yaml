  source_fidelity: 개정이 필요합니다. διδάσκων은 ‘가르치다/교육하다’에 해당하며, ‘훈계하다’는 꾸짖거나 타이르는 의미가 강하여 원문의 교육·훈련 의미를 지나치게 좁힙니다. 또한 παραζηλώσει는 원수를 질투 또는 시기하게 한다는 뜻이므로 목적어를 드러내는 표현이 더 충실합니다.
  naturalness: ‘자기 아들을 가르치는 이는 … 기뻐할 것입니다’는 현대 표준 한국어의 자연스러운 합쇼체이며, 두 미래 동사의 병렬도 분명히 드러냅니다. ‘그를 두고’는 ἐπʼ αὐτῷ의 기쁨의 대상·계기를 자연스럽게 보존합니다.
  terminology: ‘아들’은 남성 단수인 υἱόν을 보존합니다. ‘시기하게 하다’를 본문에 쓰고 ‘질투하게 하다’를 각주 대안으로 제시하여 παραζηλόω의 의미 범위를 보존합니다. ‘원수’와 ‘친구들’은 각각 단수 정관사 목적어와 복수 φίλων에 적절합니다.
