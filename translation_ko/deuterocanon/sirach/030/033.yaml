  text: Fodder and a rod and burdens are for a donkey[c][b][a]; bread and discipline and work are for a slave.
  footnotes:
  - marker: a
    text: Or 'loads' for 'burdens.'
    reason: lexical_alternative
  - marker: b
    text: Or 'servant' or 'household servant' for 'slave'; the Greek οἰκέτης often refers to a domestic bondservant.
    reason: alternative_reading
  - marker: c
    text: '''Discipline'' may also be understood as ''training'' or ''correction.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 먹이와 몽둥이와 짐[a]은 나귀를 위한 것이고, 빵과 훈육[c]과 일은 종[b]을 위한 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘짐’은 ‘부담’ 또는 ‘실어 나르는 짐’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘종’은 ‘하인’ 또는 ‘집안 하인’으로도 옮길 수 있으나, 그리스어 οἰκέτης는 흔히 가정에 속한 예속된 사람을 가리킵니다.
    reason: alternative_reading
  - marker: c
    text: ‘훈육’은 ‘교육’이나 ‘교정’으로도 이해할 수 있습니다.
    reason: lexical_alternative
