- issue: οἰκέτῃ의 사회적 지위 표현
  chosen_reading: ‘종’으로 번역하여 예속된 신분을 드러냅니다.
  alternative_readings:
  - ‘노예’로 직접 옮김
  - ‘하인’으로 완화함
  rationale: 이 구절은 훈육과 노동이 배정된 신분을 대비시키는 격언이므로, 원문의 종속적 현실을 흐리지 않는 표현이 필요합니다. 다만 한국어 문맥에서 과도하게 현대적 법제어인 ‘노예’보다, 성경적이면서도 예속성을 보존하는 ‘종’이 균형이 좋습니다.
