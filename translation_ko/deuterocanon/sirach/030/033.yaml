  text: Fodder and a rod and burdens are for a donkey[c][b][a]; bread and discipline and work are for a slave.
  footnotes:
  - marker: a
    text: Or 'loads' for 'burdens.'
    reason: lexical_alternative
  - marker: b
    text: Or 'servant' or 'household servant' for 'slave'; the Greek οἰκέτης often refers to a domestic bondservant.
    reason: alternative_reading
  - marker: c
    text: '''Discipline'' may also be understood as ''training'' or ''correction.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 먹이와 몽둥이와 짐은 나귀를 위한 것이고, 빵과 훈육과 일은 종을 위한 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘짐’은 ‘무거운 짐’이라는 뜻의 ‘부담’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘종’은 여기서 가정의 하인보다 예속된 신분을 더 강하게 드러냅니다.
    reason: alternative_reading
  - marker: c
    text: ‘훈육’은 ‘교육’이나 ‘교정’으로도 이해할 수 있습니다.
    reason: lexical_alternative
