  text: A joyful heart is a man's life[a], and a person's gladness prolongs his life.
  footnotes:
  - marker: a
    text: 'The final Hebrew words are difficult: the transmitted text reads literally something like ''has lengthened his nose/anger.'' The Greek parallel supports the sense ''lengthens his days'' or ''prolongs life,'' which is followed here.'
    reason: textual_variant
translation:
  language: ko
  text: 즐거운 마음은 사람의 생명이며, 사람의 기쁨은 그 사람의 수명을 연장합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 전승된 히브리어 본문의 마지막 말은 문자적으로 ‘그의 코/분노를 길게 하였다’ 정도로 읽혀 문맥상 뜻이 불분명합니다. 제공된 그리스어 평행본문은 날수 또는 생명과 관련된 의미를 지지하므로, 여기서는 생명이 연장된다는 뜻으로 옮겼습니다.
    reason: textual_variant
lexical_decisions:
- source_word: שמחת לב
  english_pob_choice: a joyful heart
  chosen_korean: 즐거운 마음
  alternatives_korean:
  - 마음의 기쁨
  - 기쁜 마음
  lexicon: HALOT
  rationale: 히브리어 구성은 ‘마음의 기쁨/즐거움’이라는 뜻이므로, 자연스러운 한국어로 옮기되 내적인 정서를 분명히 드러내기 위해 ‘마음’을 살렸습니다.
- source_word: חיי איש
  english_pob_choice: is a man's life
  chosen_korean: 사람의 생명
  alternatives_korean:
  - 한 남자의 생명
  - 한 사람의 삶
  lexicon: HALOT
  rationale: חיי איש는 잠언체로 ‘사람의 생명/삶’의 의미를 가지며, 한국어에서는 ‘생명’이 문맥상 더 직접적이고 압축적으로 대응합니다.
- source_word: וגיל אדם
  english_pob_choice: and a person's gladness
  chosen_korean: 사람의 기쁨
  alternatives_korean:
  - 인간의 즐거움
  - 사람의 환희
  lexicon: HALOT
  rationale: אדם이 여기서는 성별보다 일반적 인간을 가리키므로 ‘사람’으로 옮겼고, גיל의 기쁨/즐거움의 의미를 반영해 ‘기쁨’으로 번역했습니다.
- source_word: האריך אפו
  english_pob_choice: lengthens his days
  chosen_korean: 그의 날수를 길게 합니다
  alternatives_korean:
  - 그의 생명을 연장합니다
  - 그의 날들을 길게 합니다
  lexicon: HALOT
  rationale: 본문의 히브리어 말미는 전승상 난해하지만, 제공된 그리스어 평행본문이 날수의 단축/연장 의미를 뒷받침하므로 그 뜻을 따라 ‘날수’로 옮겼습니다.
theological_decisions:
- issue: 히브리어 אדם의 일반적 인간 지시
  chosen_reading: 두 번째 행은 성별을 좁히지 않고 ‘사람’으로 번역했습니다.
  alternative_readings:
  - ‘한 남자’로 일관되게 옮김
  - ‘인간’으로 보다 추상화함
  rationale: 첫 행의 איש와 구별을 유지하면서도, כאן의 אדם은 일반적 인간을 가리키는 용법이므로 대표성을 살린 ‘사람’이 가장 균형적입니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
- issue: 난해한 히브리어 말미 처리
  chosen_reading: 그리스어 평행본문이 제시하는 ‘날수/생명 연장’의 뜻을 본문 의미로 채택했습니다.
  alternative_readings:
  - 히브리어를 따라 ‘그의 코를 길게 합니다’처럼 직역함
  - 주본문에서 더 강하게 의역해 ‘생명을 연장합니다’로 정리함
  rationale: 현재 히브리어는 문맥상 어색하므로, 투명성을 유지하면서도 지혜문학의 의미가 드러나도록 평행본문이 지지하는 방향을 본문에 반영했습니다.
  doctrine_reference: PHILOSOPHY.md §What we are translating; transparency principle
