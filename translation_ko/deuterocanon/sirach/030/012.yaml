base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/030/012.yaml
  text: Bend his neck in his youth[a], and break his loins while he is still small[b], lest he become stubborn and bring you bitterness of soul.
  footnotes:
  - marker: a
    text: Hebrew reads 'break his loins,' while the Greek parallel reads 'crush his sides/ribs.' The main text follows the extant Hebrew witness, with the Greek used to clarify the disciplinary sense where the Hebrew line is difficult.
    reason: textual_variant
  - marker: b
    text: The clause rendered 'lest he become stubborn' reflects a difficult Hebrew reading in the Cairo Geniza text; the Greek parallel more clearly supports the sense 'lest he become hardened.'
    reason: alternative_reading
translation:
  language: ko
  text: 그가 젊을 때에 그의 목을 굽히시고, 아직 어릴 때에 그의 허리를 꺾으십시오[a]. 그가 완고해져서 당신을 거역하고 당신에게 마음의 쓰라림을 안겨 줄까 염려해서입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘그의 허리를 꺾으라’고 읽히지만, 그리스어 병행본문은 ‘그의 옆구리/갈비를 부수라’에 가깝습니다. 본문은 현존 히브리어 본문을 따릅니다.
    reason: textual_variant
  - marker: b
    text: 이 후반절의 히브리어 본문은 난해합니다. 그리스어 병행본문은 ‘그가 완고해져서 당신에게 불순종하지 않게 하라’는 뜻을 더 분명하게 나타냅니다. 본문은 이 병행본문의 도움을 받아 ‘완고해져서 당신을 거역하다’로 옮겼습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: כוף ראשו
  english_pob_choice: Bend his neck
  chosen_korean: 그의 목을 굽히고
  alternatives_korean:
  - 그의 머리를 굽히고
  - 그를 굴복시키고
  lexicon: HALOT
  rationale: כוף는 물리적으로 ‘굽히다’의 뜻을 살리고, ראשו는 관용적으로 머리보다 목으로 옮겨 굴복·억제의 이미지를 한국어로 자연스럽게 보존했습니다.
- source_word: בנערותו
  english_pob_choice: in his youth
  chosen_korean: 젊었을 때에
  alternatives_korean:
  - 그의 젊은 시절에
  - 어릴 때에
  lexicon: HALOT
  rationale: 시기 부사를 간결하고 현대적으로 옮겨, 훈계가 이른 시기에 이뤄져야 한다는 점을 드러냈습니다.
- source_word: ובקע מתניו
  english_pob_choice: break his loins
  chosen_korean: 그의 허리를 꺾어라
  alternatives_korean:
  - 그의 허리를 부러뜨려라
  - 그의 옆구리를 꺾어라
  lexicon: HALOT
  rationale: 히브리어의 강한 신체적 이미지를 완화하지 않고, 한국어에서도 ‘허리’와 ‘꺾다’로 직접적으로 살렸습니다. 그리스어의 ‘옆구리/갈비’ 계열은 주석적 배경으로만 반영했습니다.
- source_word: ומרה בך
  english_pob_choice: rebel against you
  chosen_korean: 너에게 반역하고
  alternatives_korean:
  - 너에게 거역하고
  - 너를 대적하고
  lexicon: HALOT
  rationale: 히브리어의 ‘쓰라리다/거역하다’와 영어 POB의 ‘rebel’이 가리키는 자녀의 불순종을, 교회적 완곡어법보다 강한 ‘반역’으로 옮겼습니다.
- source_word: מפח נפש
  english_pob_choice: bitterness of soul
  chosen_korean: 마음에 쓰라림을 일으킬까
  alternatives_korean:
  - 영혼의 쓰라림을 일으킬까
  - 깊은 근심을 일으킬까
  lexicon: HALOT
  rationale: 직역적 ‘영혼’보다 한국어에서 자연스러운 내면 표현인 ‘마음’으로 옮기되, 히브리어의 정서적 고통을 살리기 위해 ‘쓰라림’을 유지했습니다.
theological_decisions:
- issue: 지혜문학의 가혹한 신체 비유를 어떻게 처리할 것인가
  chosen_reading: 주요 본문에서는 신체적 폭력 이미지를 완화하지 않고 그대로 유지했습니다.
  alternative_readings:
  - 훈육하라로 의역
  - 강한 징계로 순화
  rationale: 히브리어 본문과 그리스어 병행본문 모두 거친 신체 은유를 사용하므로, 본문이 가진 경고의 수위를 숨기지 않는 것이 원문 충실성에 부합합니다.
  doctrine_reference: 'DOCTRINE.md: Original-language primacy; Preserve theological tension rather than resolve it'
