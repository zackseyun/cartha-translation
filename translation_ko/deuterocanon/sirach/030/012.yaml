revisions:
- from: 젊었을 때에 그의 목을 굽히고, 아직 어릴 때에 그의 허리를 꺾어라[a]. 그가 고집스러워져서 너에게 반역하고 마음에 쓰라림을 일으킬까 봐서이다[b].
  to: 그가 젊을 때에 그의 목을 굽히시고, 아직 어릴 때에 그의 허리를 꺾으십시오[a]. 그가 완고해져서 당신을 거역하고 당신에게 마음의 쓰라림을 안겨 줄까 염려해서입니다[b].
  rationale: 원문의 거친 신체 이미지는 완화하지 않았습니다. 다만 한국어의 현대 합쇼체에 맞게 명령형과 종결 표현을 다듬고, 자녀의 불순종 문맥에 부정확하게 정치화된 ‘반역’을 ‘거역’으로 고쳤습니다. 각주는 히브리어와 그리스어의 신체 부위 차이 및 난해한 후반절의 본문 문제를 각각 정확히 설명하도록 수정했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T19:16:20Z'
review_pass:
  verdict: revise
  source_fidelity: 히브리어의 두 명령(‘그의 머리/목을 굽히라’, ‘그가 작은 동안 그의 허리를 꺾으라’)과 뒤따르는 완고함·거역 및 깊은 고통의 결과를 보존했습니다. 다만 ‘반역’은 한국어에서 국가적·정치적 반란의 뉘앙스가 지나치게 강하므로, 부모를 향한 불복종이라는 문맥에는 ‘거역’이 더 정확합니다. 난해한 히브리어 후반부는 그리스어 병행본문이 뒷받침하는 ‘완고해져 … 거역하다’라는 의미를 본문에 유지하되, 주석에서 본문의 불확실성을 밝혀야 합니다.
  naturalness: 초안의 ‘일으킬까 봐서이다’는 현대 표준어 문장으로 어색하고 인과 관계도 불분명합니다. ‘… 안겨 줄까 염려해서입니다’로 고치면 합쇼체 문체를 유지하면서 목적·경계의 의미가 자연스럽게 드러납니다. ‘목을 굽히십시오’는 히브리어의 ‘머리’가 나타내는 굴복의 신체 이미지를 한국어 관용에 맞게 보존합니다.
  terminology: ‘허리를 꺾다’는 히브리어 מתנים의 강한 신체 이미지를 보존하는 안전한 번역입니다. ‘마음의 쓰라림’은 נפש의 내적 고통을 자연스러운 한국어로 옮깁니다. 그리스어 θλάσον은 ‘치다’보다 ‘부수다/짓누르다’ 계열이므로 주석의 표현을 바로잡았습니다.
  issues:
  - severity: medium
    issue: ‘너에게 반역하고’의 어휘 선택
    rationale: ומרה בך 및 그리스어 ἀπειθήσῃ σοι는 이 문맥에서 부모에게 거역하거나 불순종한다는 뜻입니다. ‘반역’은 정치적 반란을 강하게 연상시켜 의미 영역을 과도하게 좁힙니다.
  - severity: medium
    issue: 본문 종결 표현 ‘일으킬까 봐서이다’
    rationale: 현대 한국어로 부자연스럽고, 누가 누구에게 쓰라림을 일으키는지도 흐립니다. 히브리어의 결과 표현을 ‘네게 마음의 쓰라림을 안겨 줄까 염려해서입니다’로 명료하게 옮기는 편이 낫습니다.
  - severity: low
    issue: 각주 a의 그리스어 설명
    rationale: 그리스어 병행본문은 ‘옆구리/갈비를 부수다, 짓누르다’에 해당하며, ‘치다’는 정확도가 낮습니다. 또한 ‘완곡하지 않은 신체 이미지’라는 설명은 본문의 대조를 설명하지 못합니다.
