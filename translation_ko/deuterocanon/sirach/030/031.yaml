lexical_decisions:
- source_word: ἐν πᾶσι τοῖς ἔργοις σου
  english_pob_choice: In all your works
  chosen_korean: 모든 일에서
  alternatives_korean:
  - 당신이 하는 모든 일에서
  - 모든 행실에서
  lexicon: LSJ
  rationale: ἔργα는 여기서 행위·일을 가리키며, πᾶσι가 포괄성을 더하므로 한국어로는 자연스러운 포괄 표현인 ‘모든 일에서’로 옮겼습니다.
- source_word: γίνου ὑπεράγων
  english_pob_choice: be outstanding
  chosen_korean: 뛰어나십시오
  alternatives_korean:
  - 탁월하십시오
  - 월등하십시오
  - 뛰어나게 되십시오
  lexicon: LSJ
  rationale: ὑπεράγων은 ‘뛰어난, 탁월한’의 뜻이므로 현대 한국어의 윤리적 권면으로는 ‘뛰어나십시오’가 가장 자연스럽고 직접적입니다.
- source_word: μὴ δῷς μῶμον
  english_pob_choice: do not give a blemish
  chosen_korean: 흠을 내지 마십시오
  alternatives_korean:
  - 흠을 주지 마십시오
  - 결점을 만들지 마십시오
  - 오점이 생기게 하지 마십시오
  lexicon: LSJ
  rationale: μῶμον은 문자적으로 ‘흠, 결점, 비난거리’이므로 ‘흠’이 이미지를 살리면서도 현대 한국어에서 자연스럽습니다. ‘내지 마십시오’는 관용적으로 ‘bring upon’의 의미를 잘 드러냅니다.
- source_word: ἐν τῇ δόξῃ σου
  english_pob_choice: to your honor
  chosen_korean: 당신의 명예에
  alternatives_korean:
  - 당신의 영광에
  - 당신의 평판에
  lexicon: LSJ
  rationale: δόξα는 문맥상 신학적 ‘영광’보다 사회적 ‘명예, 평판’이 적절하므로 POB의 선택을 따라 ‘명예’로 옮겼습니다.
