  - 네가 아직 사는 동안
  lexicon: LSJ
  rationale: 시간적 지속을 나타내는 구문이므로 한국어에서도 생명과 호흡의 상태를 함께 살려, 뒤의 πνοὴ ἐν σοί와 자연스럽게 연결되도록 옮겼습니다.
- source_word: πνοὴ ἐν σοί
