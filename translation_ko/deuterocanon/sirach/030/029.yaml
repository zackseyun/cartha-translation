  chosen_korean: 숨이 아직 네 안에 있는 동안
  alternatives_korean:
  - 네 안에 숨이 있을 동안
  - 네게 숨이 있을 동안
  lexicon: LSJ
  rationale: 직역하면 어색하지만, 본문이 말하는 생명의 현존 이미지를 살려 ‘숨’으로 옮겼습니다.
- source_word: μὴ ἀλλάξῃς σεαυτὸν
  english_pob_choice: do not give yourself over to
  chosen_korean: 너 자신을 바꾸지 마십시오
  alternatives_korean:
  - 너 자신을 내주지 마십시오
  - 너 자신을 넘기지 마십시오
  - 너 자신을 바꾸어서는 안 됩니다
  lexicon: LSJ
  rationale: ἀλλάσσω의 기본 의미를 유지하되, 수동적/굴복적 뉘앙스를 한국어에서 직접적으로 재현하기 어려워 ‘자신을 바꾸다’로 옮겼습니다. 다만 원문의 경고가 자기 처신의 전환을 말한다는 점은 주석으로 보완합니다.
- source_word: πάσῃ σαρκί
  english_pob_choice: any flesh
  chosen_korean: 모든 육체에 대하여
  alternatives_korean:
  - 어떤 육체에도
  - 모든 사람에게
  - 어떤 사람에게도
  lexicon: LSJ
  rationale: σάρξ를 기본적으로 ‘육체’로 유지하여 원문의 어휘와 인간의 유한성을 드러냈습니다. ‘대하여’는 -σάρκι의 관계를 자연스럽게 풀어 준 것입니다.
theological_decisions:
- issue: σάρξ의 의미를 한국어에서 어떻게 유지할지
  chosen_reading: 육체
  alternative_readings:
  - 사람
  - 인간
  - 인간 존재
  rationale: 지혜문맥에서 σάρξ는 죄성의 교리어라기보다 유한한 인간 육체를 가리키므로, 교리적 확장 없이 ‘육체’로 보존하는 편이 원문에 더 가깝습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — σάρξ'
