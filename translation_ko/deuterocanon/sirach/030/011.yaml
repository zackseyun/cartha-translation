base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/030/011.yaml
  text: Do not give him free rein in his youth, and do not overlook his destructive behavior.
  footnotes:
  - marker: a
    text: Or 'Do not give him authority in his youth.' The Hebrew verb can mean to grant rule or control; the Greek parallel reads 'do not give him authority in youth.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'his corruptions' or 'his destructive acts'; the sense is that a youth's harmful faults are not to be ignored.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 젊을 때에 그에게 자유를 주지 말며, 그의 허물을 못 본 체하지 마십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히필형 משל은 ‘다스리다/권한을 주다’의 뜻도 가질 수 있습니다. 여기서는 청년에게 방임적으로 자유를 주지 말라는 뜻으로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: לשחיתותיו는 ‘그의 부패’, ‘그의 파괴적인 행위’로도 옮길 수 있습니다. 문맥상 허물과 잘못의 범주로 이해했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תמשילהו
  english_pob_choice: give him free rein
  chosen_korean: 그에게 자유를 주지 말며
  alternatives_korean:
  - 그에게 권한을 주지 말며
  - 그에게 다스릴 권세를 주지 말며
  - 그를 제멋대로 하게 두지 말며
  lexicon: HALOT
  rationale: 히필형 משל의 사역적 의미를 살리되, 지혜문맥에서 부모의 통제 부재를 경계하는 뜻이므로 ‘자유를 주다’로 옮기면 원문의 ‘권한/방임’ 뉘앙스를 자연스럽게 전달할 수 있습니다.
- source_word: בנעוריו
  english_pob_choice: in his youth
  chosen_korean: 젊을 때에
  alternatives_korean:
  - 그의 젊은 시절에
  - 젊었을 때
  - 청년기에
  lexicon: HALOT
  rationale: נעורים의 시간적 의미를 간결한 한국어로 옮겼습니다. 문맥상 특정 시기의 청년기를 가리키므로 ‘젊을 때에’가 가장 자연스럽습니다.
- source_word: תשא
  english_pob_choice: overlook
  chosen_korean: 못 본 체하지 말며
  alternatives_korean:
  - 간과하지 말며
  - 눈감아주지 말며
  - 용서하지 말며
  lexicon: HALOT
  rationale: נשא가 여기서는 허물을 ‘감당하다/덮다’의 관용적 의미로 쓰이므로, 실제로는 잘못을 방치하거나 묵인하지 말라는 뜻을 살려 ‘못 본 체하지 말며’로 번역했습니다.
- source_word: לשחיתותיו
  english_pob_choice: his destructive behavior
  chosen_korean: 그의 허물
  alternatives_korean:
  - 그의 파괴적인 행위
  - 그의 부패한 행실
  - 그의 타락
  lexicon: HALOT
  rationale: שחיתותיו는 문자적으로는 파괴·부패·해로운 행실을 가리키지만, 지혜문학의 훈계 문맥에서는 구체적 행동만이 아니라 그에 따르는 잘못을 포괄하므로 ‘허물’이 과도한 확장 없이 의미를 전달합니다.
theological_decisions:
- issue: 청년기에 대한 훈계의 어조
  chosen_reading: 훈계체 명령으로 옮겨, 방임이 아니라 절제된 양육의 권고로 읽히도록 했습니다.
  alternative_readings:
  - 도덕적 경고문으로 완화할 수 있음
  - 직설적 금지문으로만 옮길 수 있음
  rationale: 본문은 지혜문학의 실천적 훈계이므로, 강한 금지형을 유지하되 한국어에서 지나치게 거칠지 않게 합쇼체 명령으로 표현했습니다.
  doctrine_reference: 잠언적/지혜문학적 훈계의 수사
