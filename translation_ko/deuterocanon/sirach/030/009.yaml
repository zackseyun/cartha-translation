  text: Discipline your son[a], lest you be put to shame; but if you play with him, he will humiliate you.
  footnotes:
  - marker: a
    text: 'Greek: ''Nurse/coddle a child, and he will astonish you; play with him, and he will grieve you.'' The Hebrew witness instead reads ''Discipline your son ... he will humiliate you.'''
    reason: alternative_reading
translation:
  language: ko
  text: 아들을 훈계하십시오. 그래야 당신이 수치를 당하지 않을 것입니다. 그러나 그와 함께 놀면, 그가 당신을 모욕할 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '그리스어: ‘어린아이를 기르고 달래면 당신을 놀라게 할 것이며, 그와 함께 놀면 당신을 슬프게 할 것입니다.’ 그러나 히브리어 증거는 ‘아들을 훈계하라… 그가 당신을 모욕할 것이다’라고 읽습니다.'
    reason: alternative_reading
lexical_decisions:
- source_word: יסר
  english_pob_choice: Discipline
  chosen_korean: 훈계하십시오
  alternatives_korean:
  - 징계하십시오
  - 바르게 가르치십시오
  - 교정하십시오
  lexicon: HALOT
  rationale: 히브리어 יסר는 단순한 가르침보다 교정적 훈계를 뜻하므로, 현대 한국어에서 부모의 교정 책임을 가장 자연스럽게 드러내는 ‘훈계하십시오’를 택했습니다.
- source_word: בנך
  english_pob_choice: your son
  chosen_korean: 아들을
  alternatives_korean:
  - 아들을
  - 자녀를
  lexicon: HALOT
  rationale: 히브리어는 남성 단수 ‘당신의 아들’이므로, 성별 정보를 유지해 ‘아들을’로 옮겼습니다.
- source_word: לבל תבוש
  english_pob_choice: lest you be put to shame
  chosen_korean: 그래야 당신이 수치를 당하지 않을 것입니다
  alternatives_korean:
  - 그래야 당신이 부끄러워하지 않을 것입니다
  - 수치를 당하지 않게 하십시오
  - 부끄러움을 당하지 않게 하십시오
  lexicon: HALOT
  rationale: 문맥상 목적/방지의 뜻을 나타내며, 사회적 명예-수치의 뉘앙스를 살리기 위해 ‘수치를 당하다’를 사용했습니다.
- source_word: תשחק עמו
  english_pob_choice: play with him
  chosen_korean: 그와 함께 놀면
  alternatives_korean:
  - 그와 함께 장난하면
  - 그를 제멋대로 받아주면
  - 그와 함께 놀아주면
  lexicon: HALOT
  rationale: שׂחק의 기본 의미와 히브리어 병행구의 직설성을 살려 ‘놀다’로 옮겼고, 여기서는 지나친 해석을 덧붙이지 않았습니다.
- source_word: יכלימך
  english_pob_choice: he will humiliate you
  chosen_korean: 그가 당신을 모욕할 것입니다
  alternatives_korean:
  - 그가 당신을 수치스럽게 할 것입니다
  - 그가 당신을 창피하게 할 것입니다
  - 그가 당신을 욕되게 할 것입니다
  lexicon: HALOT
  rationale: כלם은 수치/모욕의 의미를 가지므로, 앞절의 ‘수치’와 연결되면서도 동사의 적극적 결과를 드러내는 ‘모욕할 것입니다’를 선택했습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행본문의 차이
  chosen_reading: 주본문은 살아 있는 히브리어 증거를 따라 ‘훈계하다/모욕하다’의 구조로 번역하고, 그리스어의 다른 뉘앙스는 본문 밖 주석에서 처리합니다.
  alternative_readings:
  - 그리스어를 따라 ‘어린아이를 길러주면 놀라게 할 것이며, 그와 함께 놀면 그가 당신을 슬프게 할 것입니다’로 옮기기
  rationale: 벤 시라에서는 히브리어가 보존된 경우 히브리어를 우선하되, 그리스어는 대조 증거로 보존하는 것이 원칙입니다. 이 절은 두 증거가 첫 동사와 마지막 결과에서 달라서, 본문에서는 히브리어의 권면 구조를 유지하는 편이 더 정합적입니다.
  doctrine_reference: 'PHILOSOPHY.md: translate Sirach from Hebrew where it survives; use Greek parallel as actual input/check'
