    rationale: καυχήσεται ἐπʼ αὐτῷ는 아들을 두고/아들 때문에 자랑한다는 뜻입니다. ‘그를 두고’는 원문의 자랑의 근거를 유지하면서 한국어 관용에 맞습니다.
  revised_text: 아들을 훈계하는 이는 그에게서 유익을 얻고, 자신이 아는 이들 가운데에서 그를 두고 자랑할 것입니다.
