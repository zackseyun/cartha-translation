  text: He who disciplines his son will profit by him, and among his acquaintances he will boast because of him.
translation:
  language: ko
  text: 아들을 훈계하는 이는 그로 말미암아 이익을 얻고, 자기 아는 이들 가운데서는 그로 말미암아 자랑할 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ παιδεύων
  english_pob_choice: He who disciplines
  chosen_korean: 아들을 훈계하는 이는
  alternatives_korean:
  - 아들을 훈련하는 이는
  - 아들을 가르치는 이는
  - 아들을 바로잡는 이는
  lexicon: BDAG
  rationale: παιδεύω는 교육, 훈련, 교정의 뜻을 함께 가질 수 있으나, 지혜문맥에서는 자녀를 바르게 길들이는 의미가 핵심이므로 ‘훈계하다’가 가장 균형 있게 전달합니다.
- source_word: ὀνήσεται ἐπʼ αὐτῷ
  english_pob_choice: will profit by him
  chosen_korean: 그로 말미암아 이익을 얻고
  alternatives_korean:
  - 그에게서 유익을 얻고
  - 그로부터 이익을 보며
  lexicon: BDAG
  rationale: ὀνίνημι 계열은 ‘유익을 얻다, 이익을 보다’의 뜻이므로, 부모가 아들로 인해 실제로 이익을 얻는다는 인과를 살려 ‘그로 말미암아 이익을 얻고’로 옮겼습니다.
- source_word: ἀνὰ μέσον γνωρίμων
  english_pob_choice: among his acquaintances
  chosen_korean: 자기 아는 이들 가운데서는
  alternatives_korean:
  - 아는 사람들 가운데서는
  - 친지들 가운데서는
  - 지인들 가운데서는
  lexicon: BDAG
  rationale: γνωρίμων은 단순한 친우보다 ‘알고 지내는 사람들, 지인들’에 가깝기 때문에, 과도한 친밀감을 피하면서도 자연스러운 한국어로 옮겼습니다.
- source_word: καυχήσεται ἐπʼ αὐτῷ
  english_pob_choice: he will boast because of him
  chosen_korean: 그로 말미암아 자랑할 것입니다
  alternatives_korean:
  - 그 때문에 자랑할 것입니다
  - 그를 두고 자랑할 것입니다
  - 그로 인해 뽐낼 것입니다
  lexicon: BDAG
  rationale: καυχάομαι는 문맥에 따라 ‘자랑하다, 뽐내다, 뽐내어 말하다’의 뜻이지만, 여기서는 사회적 명예를 드러내는 중립적 의미가 강하므로 ‘자랑하다’를 유지했습니다.
theological_decisions:
- issue: 부모의 자랑을 도덕적으로 완화할지 여부
  chosen_reading: ‘자랑할 것입니다’로 직역적 의미를 유지했습니다.
  alternative_readings:
  - ‘자랑스러워할 것입니다’
  - ‘기뻐할 것입니다’
  rationale: 본문은 잘 훈계된 아들로 인한 사회적 명예를 말할 뿐, 자랑을 도덕적으로 평가하지 않습니다. 그래서 어조를 완화하지 않고 원문의 진술성을 보존했습니다.
  doctrine_reference: 지혜문학의 사회적 명예 개념을 그대로 반영
