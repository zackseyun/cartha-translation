  lexicon: LSJ
  rationale: στρέβλαι는 몸을 비트는 고문 도구를, βάσανοι는 고문/가혹한 형벌을 뜻하므로, 한국어에서 과도하게 설명하지 않으면서도 두 겹의 가혹성을 드러내도록 ‘틀과 고문’으로 옮겼습니다.
