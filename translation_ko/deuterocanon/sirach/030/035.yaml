  source_fidelity: ‘멍에’와 ‘목을 굽히게 하다’는 ζυγός와 κάμψουσιν τράχηλον을 충실히 옮깁니다. 다만 ἱμάς는 단순한 ‘끈’보다 가죽으로 된 끈·가죽띠를 뜻하며, στρέβλαι는 단순한 ‘틀’보다 고문 도구, 특히 ‘고문틀’로 밝혀 주는 편이 원문의 구체성을 보존합니다.
