translation:
  language: ko
  text: 멍에와 가죽끈은 목을 굽히게 하고, 악한 노예[a]에게는 고문틀과 고문이 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘집안 종’ 또는 ‘하인’. 그리스어 οἰκέτῃ는 집안에 속한 종이나 하인을 가리킬 수 있지만, 이 문맥에서는 강제적 종속과 처벌이 두드러지므로 본문에는 ‘노예’를 썼습니다.
    reason: lexical_alternative
