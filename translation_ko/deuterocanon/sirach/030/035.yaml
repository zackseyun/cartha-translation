  terminology: οἰκέτῃ를 ‘노예’로 번역한 것은 이 문맥의 강제적 종속과 처벌을 완화하지 않으며 적절합니다. 각주의 ‘집안 사람’이라는 설명은 οἰκέτης의 실제 직업·신분 의미를 다소 넓게 들리게 하므로 ‘집안 종’ 또는 ‘하인’이라는 대안으로 정정합니다.
