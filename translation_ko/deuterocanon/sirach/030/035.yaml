  text: A yoke and a strap will bend the neck[a], and for a wicked slave there are racks and tortures.
  footnotes:
  - marker: a
    text: Or 'servant' / 'household servant' for Greek οἰκέτῃ; the main text uses 'slave' because the context emphasizes coercive subjection.
    reason: lexical_alternative
translation:
  language: ko
  text: 멍에와 끈은 목을 굽히게 하고, 악한 노예에게는 틀과 고문이 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘종’ / ‘집안 종’. 그리스어 οἰκέτῃ는 ‘집안 사람’ 계열의 뜻도 있지만, 이 문맥에서는 강제적 종속과 처벌이 두드러지므로 본문에는 ‘노예’를 썼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ζυγὸς
  english_pob_choice: yoke
  chosen_korean: 멍에
  alternatives_korean:
  - 요
  - 멍에 장치
  lexicon: LSJ
  rationale: 목을 굽히게 하는 구체적 억압 도구라는 이미지가 핵심이므로, 한국어 성경에서 가장 자연스럽고 직역에 가까운 ‘멍에’를 택했습니다.
- source_word: ἱμὰς
  english_pob_choice: strap
  chosen_korean: 끈
  alternatives_korean:
  - 가죽끈
  - 끈자락
  - 채찍끈
  lexicon: LSJ
  rationale: ἱμὰς는 묶는 가죽끈/끈을 가리키므로, 멍에와 짝을 이루는 구속의 이미지를 살려 간결하게 ‘끈’으로 옮겼습니다.
- source_word: οἰκέτῃ
  english_pob_choice: slave
  chosen_korean: 노예
  alternatives_korean:
  - 종
  - 하인
  - 집안 종
  lexicon: LSJ
  rationale: 영문 POB가 bonded-status를 드러내기 위해 ‘slave’를 택한 점을 반영하여, 완곡한 ‘종’보다 강한 ‘노예’가 강제적 종속과 처벌의 현실을 더 정확히 드러냅니다.
- source_word: στρέβλαι καὶ βάσανοι
  english_pob_choice: racks and tortures
  chosen_korean: 틀과 고문
  alternatives_korean:
  - 고문틀과 고문
  - 비틀개와 고문
  lexicon: LSJ
  rationale: στρέβλαι는 몸을 비트는 고문 도구를, βάσανοι는 고문/가혹한 형벌을 뜻하므로, 한국어에서 과도하게 설명하지 않으면서도 두 겹의 가혹성을 드러내도록 ‘틀과 고문’으로 옮겼습니다.
theological_decisions:
- issue: οἰκέτῃ의 사회적 뉘앙스 보존
  chosen_reading: 노예
  alternative_readings:
  - 종
  - 하인
  rationale: 이 구절은 단순한 신분 호칭보다 억압적 처벌의 대상이라는 점이 중요하므로, 완곡한 ‘하인’이나 ‘종’보다 ‘노예’가 본문의 사회적 현실을 더 분명히 전달합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — bonded-status terminology; use 강한 종속성이 분명할 때 slave/노예를 우선'
