  rationale: 합쇼체 문체를 일관되게 하기 위해 친근한 소유 대명사 ‘네’를 제거했습니다. 한국어에서는 소유 관계가 문맥상 분명하므로 생략해도 원문의 2인칭 소유 의미가 손실되지 않습니다. ‘다하는 날’은 συντελείας의 완료·종결 의미를 자연스럽게 반영하며, ‘분배하십시오’는 유산 맥락의 διάδος를 정확히 옮깁니다. 각주 표지는 원문의 압축된 첫 시간구에 붙였습니다.
