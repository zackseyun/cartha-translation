lexical_decisions:
- source_word: ἐν ἡμέρᾳ συντελείας ἡμερῶν ζωῆς σου
  english_pob_choice: On the day your life's days are completed
  chosen_korean: 네 삶의 날들이 끝나는 날
  alternatives_korean:
  - 네 삶의 날들이 완성되는 날
  - 네 생애의 날들이 끝나는 날
  - 네 생의 날들이 다하는 날
  lexicon: LSJ
  rationale: Greek의 압축된 관용구를 자연스러운 한국어로 풀되, ‘날들’과 ‘끝나는’의 대응을 유지해 삶의 기간이 마무리되는 뜻을 드러냈습니다.
- source_word: καιρῷ τελευτῆς
  english_pob_choice: at the time of your death
  chosen_korean: 네 죽을 때
  alternatives_korean:
  - 네 마지막 때
  - 네 종말의 때
  - 네 죽음의 때
  lexicon: LSJ
  rationale: τελευτή는 여기서 문맥상 ‘죽음’이 가장 분명하므로, 유산 분배와 연결되는 실제 시점을 간결하게 옮겼습니다.
- source_word: διάδος
  english_pob_choice: distribute
  chosen_korean: 나누어 주십시오
  alternatives_korean:
  - 분배하십시오
  - 나눠 주십시오
  - 유산을 배분하십시오
  lexicon: LSJ
  rationale: 상속 재산을 여러 사람에게 넘기는 뜻을 살리면서도, 한국어 명령문으로는 ‘나누어 주십시오’가 가장 자연스럽고 법적 맥락도 유지합니다.
- source_word: κληρονομίαν
  english_pob_choice: your inheritance
  chosen_korean: 네 유산
  alternatives_korean:
  - 네 상속 재산
  - 네 재산
  - 네 몫
  lexicon: LSJ
  rationale: κληρονομία는 상속 재산을 가리키므로 ‘유산’이 직역성과 가독성의 균형이 가장 좋습니다.
theological_decisions:
- issue: 재산 분배 명령의 해석 범위
  chosen_reading: 이 절은 죽음이 임하기 전에 자신의 유산을 정리하여 분배하라는 지혜 교훈으로 읽었습니다.
  alternative_readings:
  - 죽음을 앞두고 일반적으로 아낌없이 베풀라는 권면
  - 후대의 상속법을 암시하는 규범적 교훈
  rationale: 본문은 ‘죽음’과 ‘유산’의 결합으로 매우 구체적이므로, 일반적 윤리나 법제도로 확장하지 않고 본문의 직접적 뜻을 따랐습니다.
  doctrine_reference: '원문 우선 원칙: 본문의 표면적 지혜 교훈을 보존하고, 번역 전통이 아닌 원어 문맥을 우선합니다.'
