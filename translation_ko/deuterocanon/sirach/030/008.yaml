  text: An unbroken horse turns out stubborn[b][a], and a son left unchecked turns out headstrong.
  footnotes:
  - marker: a
    text: Or 'untamed' for 'unbroken' (ἀδάμαστος). The image is of a horse not brought under training.
    reason: lexical_alternative
  - marker: b
    text: The final adjective (προαλής) is rare; possible renderings include 'self-willed' or 'presumptuous.' 'Headstrong' is chosen to reflect the sense of uncontrolled forwardness in context.
    reason: lexical_alternative
translation:
