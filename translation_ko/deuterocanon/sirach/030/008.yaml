    reason: lexical_alternative
  - marker: b
    text: προαλής는 희귀한 형용사로, ‘자기 뜻을 앞세우는’, ‘고집 센’ 또는 ‘방자한’으로도 옮길 수 있습니다. 여기서는 문맥상 ‘제멋대로’로 옮겼습니다.
    reason: lexical_alternative
