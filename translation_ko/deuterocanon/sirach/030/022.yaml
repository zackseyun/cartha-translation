lexical_decisions:
- source_word: εὐφροσύνη καρδίας
  english_pob_choice: gladness of heart
  chosen_korean: 행복한 마음
  alternatives_korean:
  - 마음의 기쁨
  - 마음의 즐거움
  lexicon: LSJ
  rationale: Greek parallel의 핵심은 내면의 즐거움이 생명의 원천이라는 뜻이므로, 합쇼체 현대 한국어에서 자연스러운 ‘행복한 마음’으로 옮겨 감정의 밝은 상태를 살렸습니다.
- source_word: ζωὴ ἀνθρώπου
  english_pob_choice: a man's life
  chosen_korean: 사람의 생명
  alternatives_korean:
  - 한 사람의 삶
  - 인간의 생명
  lexicon: LSJ
  rationale: 문법상 단수 남성형이지만 대표적 일반성을 띠므로, 성별을 과도하게 부각하지 않는 ‘사람의 생명’으로 자연스럽게 옮겼습니다.
- source_word: ἀγαλλίαμα
  english_pob_choice: rejoicing
  chosen_korean: 기쁨
  alternatives_korean:
  - 환희
  - 즐거워함
  lexicon: LSJ
  rationale: 행위를 나타내는 명사로서의 적극적 뉘앙스를 살리되, 한국어에서 문맥상 매끄럽고 의미가 분명한 ‘기쁨’을 선택했습니다.
- source_word: μακροημέρευσις
  english_pob_choice: prolongs his days
  chosen_korean: 그의 날들을 길게 합니다
  alternatives_korean:
  - 날수를 늘립니다
  - 장수하게 합니다
  lexicon: LSJ
  rationale: 직역에 가깝게 ‘날들을 길게 합니다’로 옮겨, 시적 병행구의 구조와 ‘길어진 날들’의 의미를 유지했습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 평행본문의 불일치
  chosen_reading: 이 절은 의미가 분명한 그리스어 평행본문의 뜻을 따라 번역하고, 본문 차이를 각주로 표시했습니다.
  alternative_readings:
  - 현존 히브리어를 따라 ‘처녀와 동침하는 자…’로 옮기는 읽기
  rationale: 제공된 히브리어는 전승상 난해하고 그리스어와 의미가 크게 어긋나므로, POB의 공적 주석에 맞추어 안정적인 그리스어 의미를 본문으로 채택했습니다.
  doctrine_reference: 'POB source policy: Hebrew primary where secure, but Greek parallel may govern translation when the Hebrew witness is corrupt or divergent.'
