    rationale: 히브리어는 ‘마음의 기쁨’이나 ‘날들을 길게 함’을 포함하지 않습니다. 원문 우선 검토 원칙상, 고신뢰도로 제시된 히브리어의 의미를 본문에 반영해야 합니다.
