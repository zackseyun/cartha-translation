lexical_decisions:
- source_word: פוג
  english_pob_choice: give rest
  chosen_korean: 쉬게 하다
  alternatives_korean:
  - 편안하게 하다
  - 쉬도록 하다
  - 가라앉히다
  lexicon: HALOT
  rationale: 영혼을 향한 명령으로서 내면의 긴장을 풀고 진정시키는 뜻을 살리기 위해 '쉬게 하다'를 택했습니다. 한국어에서 자연스럽고도 권면의 힘이 유지됩니다.
- source_word: נפשך
  english_pob_choice: your soul
  chosen_korean: 당신의 영혼
  alternatives_korean:
  - 당신의 생명
  - 당신 자신
  lexicon: HALOT
  rationale: 지혜문학의 נפש는 내면의 생명/자아를 가리킬 수 있으므로, '영혼'이 그 깊이를 비교적 잘 보존합니다. 다만 여기서는 형이상학적 구분을 강요하지 않도록 문맥적으로 읽었습니다.
- source_word: ופיג לבך
  english_pob_choice: and gladden your heart
  chosen_korean: 당신의 마음을 기쁘게 하며
  alternatives_korean:
  - 당신의 마음을 시원하게 하며
  - 당신의 마음을 즐겁게 하며
  - 당신의 마음을 진정시키며
  lexicon: HALOT
  rationale: 히브리어 동사는 난해하지만, 앞뒤 문맥상 내면을 회복시키는 긍정적 의미가 필요합니다. '기쁘게 하다'는 단순한 진정보다 적극적인 회복과 생기를 반영합니다.
- source_word: וקצפון הרחק ממך
  english_pob_choice: and keep anger far from you
  chosen_korean: 분노를 당신에게서 멀리하십시오
  alternatives_korean:
  - 분노를 당신에게서 멀리 두십시오
  - 분노를 당신에게서 치우십시오
  - 분노를 당신으로부터 떼어 놓으십시오
  lexicon: HALOT
  rationale: 명령형과 방향부사적 표현을 한국어의 자연스러운 금지/권면 표현으로 옮겼습니다. '멀리하십시오'가 행동 촉구의 힘을 가장 सीधे하게 전달합니다.
theological_decisions:
- issue: נפש의 인간 이해
  chosen_reading: 당신의 영혼
  alternative_readings:
  - 당신의 생명
  - 당신 자신
  rationale: 이 절은 내면의 상태를 다루는 지혜문학적 권면이므로, '영혼'이 본문의 무게를 살리면서도 교리적 체계를 과도하게 도입하지 않습니다.
  doctrine_reference: 'Translation philosophy: original-language primacy and readable modern Korean'
- issue: 히브리어 본문과 그리스어 병행본문의 불일치
  chosen_reading: 히브리어 사본 전통을 따라 내면의 휴식과 기쁨을 권하는 문장으로 번역하되, 본문 난해성은 주석으로 드러내지 않음
  alternative_readings:
  - 그리스어 병행본문을 따라 전혀 다른 내용으로 번역
  - פוג/ופיג를 더 문자적으로 '느슨하게 하다/약하게 하다'로 옮김
  rationale: 제시된 그리스어 병행본문이 히브리어와 내용상 크게 다르므로, 살아남은 히브리어 증거를 우선하되 한국어 본문 자체는 읽을 수 있게 다듬었습니다. 다만 단일 절 기록에서는 과도한 주석화를 피했습니다.
  doctrine_reference: Deuterocanonical source transparency and original-language priority
