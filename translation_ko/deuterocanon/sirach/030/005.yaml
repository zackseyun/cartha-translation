  source_fidelity: 첫 절은 시간 표현과 목적어가 명시되지 않은 εἶδεν을 충실히 보존합니다. 다만 ἐν τῇ τελευταῖ αὐτοῦ는 문맥상 삶의 마지막 시기를 뜻하므로, ‘그의 끝에서는’보다 자연스럽고 분명한 표현으로 고치는 것이 좋습니다. οὐκ ἐλυπήθη는 ‘근심하다’보다 슬픔·괴로움을 나타내는 말로 옮기는 편이 가깝습니다.
  naturalness: ‘그의 끝에서는’은 현대 표준 한국어에서 부자연스럽고, 지시 대상도 다소 불명확합니다. ‘그의 마지막 때에는’이 현대 합쇼체 문맥에서 자연스럽습니다. ‘슬퍼하지 않았습니다’는 수동형을 한국어의 자연스러운 감정 서술로 옮긴 표현입니다.
  terminology: 특별한 신학 용어는 없습니다. ‘마지막 때’는 죽음 자체를 과도하게 단정하지 않으면서 그리스어의 삶의 종결 시기를 적절히 나타냅니다.
  issues:
