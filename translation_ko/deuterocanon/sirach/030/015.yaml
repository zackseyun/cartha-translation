translation:
  language: ko
  text: 가난한 이의 삶은 정련한 금보다 낫고, 좋은 영은 진주들보다 낫습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '그리스어: ‘건강과 안녕이 모든 금보다 낫고, 튼튼한 몸이 헤아릴 수 없는 재물보다 낫다.’ 히브리어와 그리스어는 크게 달라, 현존 전승의 차이 또는 히브리어 본문의 손상을 시사합니다.'
    reason: textual_variant
lexical_decisions:
- source_word: חיי שר
  english_pob_choice: Life for the poor
  chosen_korean: 가난한 이의 삶
  alternatives_korean:
  - 가난한 자의 생명
  - 궁핍한 이의 삶
  lexicon: HALOT
  rationale: 히브리어 본문은 비교 대상의 출발점을 ‘가난한 이’로 읽는 것이 가장 자연스럽고, 한국어에서는 ‘삶’이 잠언적 대구를 간결하게 살립니다.
- source_word: מפז
  english_pob_choice: refined gold
  chosen_korean: 정련한 금
  alternatives_korean:
  - 순금
  - 고운 금
  lexicon: HALOT
  rationale: פז는 고급스럽게 정련된 금을 가리키므로, ‘정련한 금’이 현대 한국어에서 의미를 가장 직접적으로 드러냅니다.
- source_word: ורוח טובה
  english_pob_choice: and a good spirit
  chosen_korean: 좋은 영
  alternatives_korean:
  - 좋은 마음
  - 건강한 정신
  - 유쾌한 영
  lexicon: HALOT
  rationale: רוח는 단순한 기분보다 내적 생기나 영을 넓게 가리킬 수 있으므로, 본문의 폭을 유지하려고 ‘영’으로 옮겼습니다.
- source_word: מפנינים
  english_pob_choice: than pearls
  chosen_korean: 진주들보다
  alternatives_korean:
  - 진주보다
  - 산호보다
  - 보석들보다
  lexicon: HALOT
  rationale: פנינים은 값진 장신구를 가리키며, 표준적인 현대 한국어에서는 ‘진주’가 가장 자연스러운 대응어입니다. 복수형은 비교 표현의 형식을 살려 ‘진주들’로 반영했습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 평행본의 큰 차이
  chosen_reading: 주본문은 현존 히브리어를 따라 ‘가난한 이의 삶… 좋은 영…’으로 두었습니다.
  alternative_readings:
  - '그리스어식 의미: ‘건강과 안녕이 모든 금보다 낫고, 튼튼한 몸이 헤아릴 수 없는 재물보다 낫다’'
  rationale: 집회서는 히브리어가 남아 있는 곳에서는 그 본문을 우선하되, 그리스어와의 차이는 투명하게 보존해야 합니다. 여기서는 두 전승이 크게 달라서, 주본문은 히브리어를 따르고 그리스어 기반 의미는 주석으로 남기는 것이 가장 정직합니다.
  doctrine_reference: 'PHILOSOPHY.md: 히브리어가 보존된 경우 그 본문을 따라 번역하고, 전승 차이는 숨기지 않는다'
