  text: Jealousy and anger shorten days[b][a], and anxiety brings old age before its time.
  footnotes:
  - marker: a
    text: Hebrew דין is difficult here. It may mean 'anger' or, less likely, 'contention/strife' or 'judgment.' The main text chooses 'anger' because the verse lists destructive dispositions that damage life.
    reason: lexical_alternative
  - marker: b
    text: The Greek parallel supplied in Zone 1 does not correspond to this verse and appears to reflect a different passage, so the Hebrew witness governs the translation here.
    reason: textual_variant
translation:
  language: ko
  text: 질투와 분노는 날수를 줄이고, 걱정은 때보다 먼저 늙게 합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קנאה
  english_pob_choice: Jealousy
  chosen_korean: 질투
  alternatives_korean:
  - 시기
  - 투기
  lexicon: HALOT
  rationale: 지혜문학의 문맥에서 사람을 소모시키는 부정적 감정을 가리키므로, 긍정적 열심이 아닌 ‘질투’가 가장 자연스럽습니다.
- source_word: דין
  english_pob_choice: anger
  chosen_korean: 분노
  alternatives_korean:
  - 판단
  - 다툼
  - 논쟁
  lexicon: HALOT
  rationale: 이 구절에서는 해로운 내적 태도들이 병렬되므로, ‘판결’보다 감정적·관계적 파괴를 드러내는 ‘분노’가 본문 의도에 더 가깝습니다.
- source_word: יקצרו ימים
  english_pob_choice: shorten days
  chosen_korean: 날수를 줄이고
  alternatives_korean:
  - 생명을 단축하고
  - 수명을 줄이고
  lexicon: HALOT
  rationale: 히브리어 관용구를 비교적 직역하여, 삶의 기간이 실제로 짧아진다는 의미를 살렸습니다.
- source_word: ובלא עת תזקין דאגה
  english_pob_choice: anxiety brings old age before its time
  chosen_korean: 걱정은 때보다 먼저 늙게 합니다
  alternatives_korean:
  - 걱정은 제때가 되기 전에 늙게 합니다
  - 걱정은 이르게 늙게 합니다
  lexicon: HALOT
  rationale: ‘∪때보다 먼저’의 시간적 뉘앙스를 ‘때보다 먼저’로 살리고, תזקין의 사역적 의미를 한국어의 자연스러운 표현으로 옮겼습니다.
