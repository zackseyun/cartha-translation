base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/030/021.yaml
  text: Do not look with your eyes and groan[a], like a eunuch embracing a young woman.
  footnotes:
  - marker: a
    text: 'Greek parallel: ''Do not give your soul over to grief, and do not afflict yourself in your own counsel/planning.'' The Hebrew witness here preserves a vivid image of frustrated longing; the Greek expresses the verse more directly as an admonition against self-inflicted sorrow.'
    reason: alternative_reading
translation:
  language: ko
  text: 내시가 젊은 여인을 끌어안는 것처럼 눈으로 보고 한숨짓지 마십시오[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '헬라어 평행문: “네 영혼을 슬픔에 내주지 말며, 네 생각으로 스스로를 괴롭게 하지 말라.” 히브리어는 좌절된 갈망의 생생한 이미지를 보존하고, 헬라어는 이를 보다 직접적인 권면으로 표현합니다.'
    reason: alternative_reading
lexical_decisions:
- source_word: ראה בעיניו
  english_pob_choice: Do not look with your eyes
  chosen_korean: 눈으로 보고
  alternatives_korean:
  - 눈여겨보고
  - 눈으로 바라보고
  lexicon: HALOT
  rationale: 히브리어는 시각 행위를 말하지만, 문맥상 금지형으로 읽히므로 한국어도 직접적인 금지 표현으로 옮기고 ‘눈으로’로 시각성을 살렸습니다.
- source_word: ומתאנח
  english_pob_choice: and groan
  chosen_korean: 한숨짓지 마십시오
  alternatives_korean:
  - 신음하지 마십시오
  - 탄식하지 마십시오
  lexicon: HALOT
  rationale: 동사는 단순한 ‘숨쉬다’보다 억눌린 고통과 실망을 나타내므로, 현대 한국어에서 자연스럽고 감정의 무게가 있는 ‘한숨짓다’로 옮겼습니다.
- source_word: סריס
  english_pob_choice: eunuch
  chosen_korean: 내시
  alternatives_korean:
  - 환관
  - 궁정 관리
  lexicon: HALOT
  rationale: 비유의 핵심이 성적 불능과 접근 불가능성에 있으므로, 한국어 성서 문맥에서 익숙한 ‘내시’가 이미지를 가장 직접적으로 전달합니다.
- source_word: נערה
  english_pob_choice: a young woman
  chosen_korean: 젊은 여인
  alternatives_korean:
  - 처녀
  - 소녀
  lexicon: HALOT
  rationale: ‘젊은 여인’은 나이감과 성별을 드러내면서도 ‘소녀’처럼 미성숙한 인상을 피하고, ‘처녀’처럼 추가 함의를 덧붙이지 않습니다.
theological_decisions:
- issue: 히브리어 직유와 헬라어 평행문의 관계
  chosen_reading: 본문의 히브리어 직유를 살리되, 헬라어가 드러내는 권면적 뉘앙스에 맞게 금지형으로 자연스럽게 옮겼습니다.
  alternative_readings:
  - 헬라어를 따라 ‘자기 영혼을 슬픔에 내주지 마십시오’로 번역함
  - 히브리어를 따라 단순 묘사문으로 옮김
  rationale: 이 절은 현존 히브리어의 생생한 이미지가 중요하지만, 헬라어 평행문이 이 말이 훈계임을 분명히 하므로, 둘을 함께 반영한 금지형으로 번역하는 것이 가장 균형적입니다.
  doctrine_reference: Sirach parallel-text translation principle
- issue: 모욕적이거나 완곡한 표현의 선택
  chosen_reading: ‘내시’라는 직접적 표현을 유지했습니다.
  alternative_readings:
  - ‘궁정 관리’처럼 완곡하게 옮김
  rationale: 이 비유는 의도적으로 강한 상실감과 성적 불능의 이미지를 사용하므로, 그 긴장감을 약화시키는 완곡어는 피했습니다.
  doctrine_reference: source-direct imagery preservation
