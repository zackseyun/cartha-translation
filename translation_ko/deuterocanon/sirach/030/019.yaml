lexical_decisions:
- source_word: מה יעריכו
  english_pob_choice: What value is there
  chosen_korean: 무슨 가치가 있겠습니까?
  alternatives_korean:
  - 무엇이 가치가 있겠습니까?
  - 무슨 유익이 있겠습니까?
  - 무엇을 값매길 수 있겠습니까?
  lexicon: HALOT
  rationale: 히브리어는 우상의 실질적 ‘가치’나 ‘유익’을 묻는 수사 의문문이므로, 한국어도 자연스럽게 가치 판단의 물음을 살렸습니다.
- source_word: לאלילי הגוים
  english_pob_choice: in the idols of the nations
  chosen_korean: 민족들의 우상에서
  alternatives_korean:
  - 열국의 우상에서
  - 이방 민족들의 우상에서
  - 민족들의 우상들에
  lexicon: HALOT
  rationale: אלילי הגוים는 ‘민족들/열방의 우상들’을 뜻하므로, 교회 언어에 치우친 ‘이방인’보다 ‘민족들’이 원문에 더 가깝고 문맥상도 자연스럽습니다.
- source_word: אשר לא יאכלון ולא יריחון
  english_pob_choice: which neither eat nor smell
  chosen_korean: 그것들은 먹지도 못하고 냄새도 맡지 못합니다.
  alternatives_korean:
  - 그것들은 먹지도 못하며 냄새도 맡지 못합니다.
  - 그것들은 먹지도 못하고 냄새를 맡지도 못합니다.
  lexicon: HALOT
  rationale: 히브리어의 두 부정 동사를 한국어에서도 병렬로 살리되, 우상들의 무능을 분명하게 드러내기 위해 ‘못하다’ 표현을 사용했습니다.
theological_decisions:
- issue: 헬라어 병행본문의 추가 절을 본문에 넣을지 여부
  chosen_reading: 히브리어 본문에 있는 우상에 대한 질문만 본문으로 옮기고, 헬라어의 추가 비교문은 각주로 둡니다.
  alternative_readings:
  - 헬라어처럼 '야훼에게 쫓겨난 자도 이와 같다'를 본문에 포함
  rationale: 이 절의 주 번역 기준은 살아 있는 히브리어 증거이므로, 본문은 히브리어를 따르고 헬라어의 중요한 확장만 변이로 보존하는 것이 원문 충실성과 투명성을 함께 지킵니다.
  doctrine_reference: 'PHILOSOPHY.md: 히브리어가 보존된 곳에서는 히브리어를 우선하고, 추가 전승은 주석/각주로 투명하게 보존'
