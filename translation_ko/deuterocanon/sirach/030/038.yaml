  text: 그에게 알맞은 일을 맡기십시오[a]. 그가 순종하지 않으면, 그의 족쇄를 무겁게 하십시오. 그러나 어떤 육체에게든 지나치게 하지 말며, 판단 없이 아무것도 하지 마십시오.
  philosophy: optimal-equivalence
  footnotes:
