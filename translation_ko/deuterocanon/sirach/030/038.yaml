  source_fidelity: 첫 절의 ‘그에게 알맞은 일을 맡기십시오’와 불순종 시 족쇄를 무겁게 하라는 표현은 εἰς ἔργα κατάστησον, καθὼς πρέπει αὐτῷ, βάρυνον τὰς πέδας αὐτοῦ를 충실히 옮깁니다. 그러나 ἐν πάσῃ σαρκί는 부정문 아래에서 ‘누구에게도/어느 사람에게도’라는 보편적 대상 표현으로 자연스럽게 번역되어야 하며, 현행 ‘어떤 육체에게든’은 한국어에서 부자연스럽고 πᾶσῃ의 범위도 충분히 드러내지 못합니다.
  naturalness: ‘어떤 육체에게든 지나치게 하지 말며’는 현대 표준 한국어에서 의미 결합이 어색합니다. ‘누구에게도 지나치게 행동하지 마십시오’는 원문의 일반적 금지 범위를 유지하면서 자연스럽습니다. 모든 문장을 합쇼체로 통일합니다.
  terminology: πέδαι는 ‘족쇄’가 적절합니다. σάρξ는 이 지혜문학 문맥에서 신학적 ‘육체’가 아니라 인간 일반을 가리키므로 본문에서는 ‘누구’로 자연화하고, 각주에서 직역과 셈어풍 관용을 밝혀 원문의 표현을 보존하는 것이 적절합니다. 각주 표지는 σάρξ에 해당하는 본문 어구에 붙여야 합니다.
