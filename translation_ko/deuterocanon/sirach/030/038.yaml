  text: Put him to work as is fitting for him[a], and if he does not obey, make his fetters heavy. But do not be excessive with any flesh, and do nothing without judgment.
  footnotes:
  - marker: a
    text: 'Or ''with anyone'' / ''toward any person.'' Greek: ''with any flesh,'' a Semitic-style way of speaking about human beings generally.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그에게 알맞은 일을 맡기십시오. 그가 순종하지 않으면 그의 족쇄를 무겁게 하십시오. 그러나 누구에게도[a] 지나치게 행동하지 말고, 판단 없이 아무것도 하지 마십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘모든 육체 안에서/에게’. 여기서 ‘육체’는 인간 일반을 가리키는 셈어풍 표현입니다.
    reason: lexical_alternative
