  rationale: 히브리어 본문을 우선하여 ‘멍에’와 ‘어리석음으로 … 삼키다’라는 비유를 유지했습니다. פן의 경고·예방 관계를 ‘~하지 않도록 하십시오’로 옮겨 결과 보장의 뉘앙스를 제거했습니다. 그리스어 병행문의 실질적 차이는 각주에서 보존하되, 한국어 인용문은 현대적이고 문법적으로 일관되게 다듬었습니다.
