translation:
  language: ko
  text: 아들을 훈계하고 그의 멍에를 무겁게 하십시오. 그가 어리석음으로 당신을 삼키지 않도록 하십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 병행문은 “아들을 훈계하고 그를 힘써 훈련하라. 그가 당신의 수치 때문에 걸려 넘어지지 않도록 하라”로 읽힙니다. 히브리어는 “그가 어리석음으로 당신을 삼키지 않도록 하라”라고 읽습니다.
    reason: textual_variant
lexical_decisions:
- source_word: יסר
  english_pob_choice: Discipline
  chosen_korean: 훈계하다
  alternatives_korean:
  - 징계하다
  - 가르치다
  - 교정하다
  lexicon: HALOT
  rationale: יסר는 교정적 훈련과 꾸짖음을 함께 띠는 말이므로, 현대 한국어에서는 아들을 바로잡는 행위를 분명히 드러내는 ‘훈계하다’가 가장 자연스럽고도 의미를 잘 살립니다.
- source_word: והכבד עולו
  english_pob_choice: make his yoke heavy
  chosen_korean: 그의 멍에를 무겁게 하십시오
  alternatives_korean:
  - 그에게 무거운 멍에를 지우십시오
  - 그에게 무거운 짐을 지우십시오
  - 그를 강하게 다루십시오
  lexicon: HALOT
  rationale: 히브리어의 구체적 은유인 ‘멍에’를 보존해, 훈련과 절제의 압박이라는 이미지를 살렸습니다. ‘무겁게 하다’는 원문 동사를 직역하여 부모의 엄중한 통제를 유지합니다.
- source_word: באולתו
  english_pob_choice: in his foolishness
  chosen_korean: 그의 어리석음으로 말미암아
  alternatives_korean:
  - 그의 어리석음 가운데서
  - 그의 어리석음 때문에
  - 그의 우둔함으로
  lexicon: HALOT
  rationale: אולת는 지혜문학에서 단순한 실수가 아니라 도덕적 어리석음을 가리키므로, ‘어리석음’으로 옮기되 원인·결과를 드러내는 ‘말미암아’를 붙여 문맥의 위험성을 분명히 했습니다.
- source_word: יבלע בך
  english_pob_choice: he consume you
  chosen_korean: 그가 당신을 삼키지 못할 것입니다
  alternatives_korean:
  - 그가 당신을 삼켜 버리지 못할 것입니다
  - 그가 당신을 집어삼키지 못할 것입니다
  - 그가 당신을 해치지 못할 것입니다
  lexicon: HALOT
  rationale: בלע의 기본 뜻인 ‘삼키다’를 살리되, 문맥상 파멸·해악의 결과를 뜻하므로 한국어에서는 부정형으로 풀어 경고의 의도를 분명하게 했습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행문의 차이 반영
  chosen_reading: 히브리어 본문을 본문 번역의 우선 기준으로 삼되, 경고의 방향은 ‘어리석음으로 인해 부모가 삼켜짐’으로 유지했습니다.
  alternative_readings:
  - 그리스어처럼 ‘부끄러움 때문에 그가 걸려 넘어지지 않도록’으로 옮김
  rationale: 이 구절은 그리스어 병행문이 ‘부끄러움/수치’와 ‘걸려 넘어짐’으로 다르게 전하지만, 살아 있는 히브리어 증언이 더 직접적이고 고신뢰이므로 이를 본문으로 따르는 것이 프로젝트 원칙에 맞습니다.
  doctrine_reference: 'PHILOSOPHY.md: Hebrew primary where extant; Greek parallel retained as control'
