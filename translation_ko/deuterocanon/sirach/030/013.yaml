review_pass:
  verdict: revise
  source_fidelity: 본문의 ‘그러면 … 못할 것입니다’는 히브리어 פן(‘~하지 않도록/그렇지 않으면’)이 나타내는 경고·예방의 관계를 결과에 대한 단정으로 바꿉니다. 또한 ‘못할 것입니다’는 아들이 해치지 못한다는 보장을 암시합니다. 이를 예방 목적의 표현으로 바로잡아야 합니다.
  naturalness: ‘아들을 훈계하고 그의 멍에를 무겁게 하십시오’는 현대의 격식 있는 합쇼체로 자연스럽고, 히브리어의 멍에 은유도 보존합니다. 후반절은 ‘그가 어리석음으로 당신을 삼키지 않도록 하십시오’가 원문의 경고를 자연스럽게 재현합니다.
  terminology: ‘훈계하다’, ‘멍에’, ‘어리석음’, ‘삼키다’는 각각 יסר, עול, אולת, בלע의 의미와 비유성을 적절히 보존합니다. 그리스어 이문 각주는 그리스어의 ‘그 안에서 수고하라’ 및 ‘수치 때문에 걸려 넘어지다’를 더 정확하고 자연스럽게 제시해야 합니다.
  issues:
  - severity: medium
    issue: 본문 후반의 접속·서법이 원문의 경고를 단정적 결과로 바꿈
    rationale: 히브리어 פן은 ‘lest’의 예방적 경고인데, 초안의 ‘그러면 … 삼키지 못할 것입니다’는 훈계의 결과가 보장된다는 뜻이 됩니다. ‘~하지 않도록 하십시오’로 옮겨야 합니다.
  - severity: medium
    issue: 그리스어 병행문 각주의 번역이 부정 목적절의 기능을 정확히 반영하지 못함
    rationale: 그리스어 ἵνα μὴ ... προσκόψῃ는 ‘그가 당신의 수치 때문에 걸려 넘어지지 않도록’이라는 경고이며, 초안의 ‘걸려 넘어지지 않게 하라’는 인용문 안에서 서법이 혼란스럽습니다. ἔργασαι ἐν αὐτῷ도 문맥상 ‘그를 힘써 훈련하라’로 제시하는 편이 자연스럽습니다.
