  text: Discipline your son and make his yoke heavy[a], lest in his foolishness he consume you.
  footnotes:
  - marker: a
    text: 'Greek parallel: ''Discipline your son and work on him, lest he stumble because of your disgrace.'' The Hebrew reads ''lest in his foolishness he consume you.'''
