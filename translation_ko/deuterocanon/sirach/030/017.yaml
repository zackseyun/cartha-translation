  text: Death is better than a life of emptiness[b][a], and eternal rest than unrelenting pain.
  footnotes:
  - marker: a
    text: 'Greek parallel: ''Death is better than a bitter life.'' The Hebrew reads ''a life of emptiness.'''
    reason: alternative_reading
  - marker: b
    text: Greek parallel has 'a lasting sickness/affliction' where the Hebrew says 'pain' qualified as enduring.
    reason: lexical_alternative
translation:
  language: ko
  text: 죽는 것이 헛된 삶보다 낫고, 영원한 안식은 그치지 않는 고통보다 낫습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 평행본문은 ‘쓴 삶’으로 읽습니다.
    reason: alternative_reading
  - marker: b
    text: 그리스어 평행본문은 כאן에 해당하는 표현으로 ‘오래가는/지속하는 질병’ 계열을 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: טוב למות
  english_pob_choice: Death is better
  chosen_korean: 죽는 것이 ... 낫습니다
  alternatives_korean:
  - 죽음이 ... 낫습니다
  - 죽는 편이 ... 낫습니다
  lexicon: HALOT
  rationale: 히브리어 טוב ל־의 비교문을 한국어 자연문으로 살리기 위해 '...보다 낫습니다'를 사용했고, למות는 잠정적 동작보다 잠언체의 보편 진술로서 동사구 '죽는 것'이 가장 자연스럽습니다.
- source_word: מחיי שוא
  english_pob_choice: a life of emptiness
  chosen_korean: 헛된 삶
  alternatives_korean:
  - 허무한 삶
  - 공허한 삶
  - 헛된 인생
  lexicon: HALOT
  rationale: שוא는 '헛됨, 공허, 허무'의 범위를 가지므로, 현대 한국어에서 즉시 이해되는 '헛된 삶'으로 옮겨 본문의 가치 평가를 분명히 했습니다.
- source_word: ונוחת עולם
  english_pob_choice: eternal rest
  chosen_korean: 영원한 안식
  alternatives_korean:
  - 영원한 쉼
  - 영속하는 안식
  - 영원한 휴식
  lexicon: HALOT
  rationale: נוחה/נוחת은 '안식, 쉼'의 뜻이고 עולם은 지속성을 더하므로, 교회적 관용을 유지하되 지나치게 신학화하지 않는 '영원한 안식'이 가장 균형적입니다.
- source_word: מכאב נאמן
  english_pob_choice: unrelenting pain
  chosen_korean: 그치지 않는 고통
  alternatives_korean:
  - 끊이지 않는 고통
  - 지속되는 고통
  - 완고한 고통
  lexicon: HALOT
  rationale: כאב은 '고통'이고 נאמן은 문자적으로 '견고한, 지속적인'의 뉘앙스를 가지므로, '그치지 않는'으로 지속성과 압박감을 함께 살렸습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 평행본문의 첫 비교어 차이
  chosen_reading: 본문은 히브리어의 '헛된 삶'을 따르고, 그리스어의 '쓴 삶'은 각주로만 반영합니다.
  alternative_readings:
  - 쓴 삶
  - 고통스러운 삶
  rationale: 현존 히브리어가 주본문의 1차 증거이므로 이를 따르되, 평행 그리스어가 보이는 의미 차이는 번역상의 투명성을 위해 숨기지 않고 각주로 남깁니다.
  doctrine_reference: 'PHILOSOPHY.md: 현존 히브리어 우선, 그리스어 평행본문은 보조 증거로 사용'
- issue: עולם의 지속성 표현
  chosen_reading: '''영원한''으로 옮겨 시간적 지속을 압축해 표현합니다.'
  alternative_readings:
  - 영속한
  - 끝없는
  - 항구한
  rationale: 지혜문학의 대구법 안에서 חיים/מכאב의 지속성과 맞서는 표현이므로, 독자가 즉시 대비를 읽을 수 있는 '영원한 안식'이 본문의 수사적 힘을 가장 잘 드러냅니다.
  doctrine_reference: 'DOCTRINE.md: 읽기 쉬운 현대어, 본문이 허용하는 신학적 긴장은 유지'
