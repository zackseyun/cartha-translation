  rationale: 그리스어는 추상적 의존이 아니라 ‘손’을 향해 보는 구체적 이미지를 사용하므로, 본문에서는 그 이미지를 유지하고 의미는 독자가 읽어낼 수 있게 두었습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1
