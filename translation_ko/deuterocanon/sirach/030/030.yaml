base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/030/030.yaml
  text: For it is better that your children should beg from you than that you look to the hands of your sons[a].
  footnotes:
  - marker: a
    text: Or, more idiomatically, 'than that you depend on your sons for support.' The Greek says literally, 'look to the hands of your sons.'
    reason: lexical_alternative
translation:
  language: ko
  text: 네 자녀가 네게 구걸하는 것이 네 아들들의 손을 바라보는 것보다 낫습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘네 아들들의 손을 바라보는 것’입니다. 뜻으로는 ‘네 아들들의 부양에 의지하는 것’이라고도 할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: κρεῖσσον
  english_pob_choice: better
  chosen_korean: 낫습니다
  alternatives_korean:
  - 더 좋습니다
  - 더 낫습니다
  lexicon: LSJ
  rationale: 비교급 κρεῖσσον의 자연스러운 현대 한국어 대응으로, 형식적이면서도 평이한 ‘낫습니다’를 사용했습니다.
- source_word: τὰ τέκνα
  english_pob_choice: your children
  chosen_korean: 네 자녀가
  alternatives_korean:
  - 네 아이들이
  - 네 자식들이
  lexicon: LSJ
  rationale: τέκνα는 문맥상 자녀를 가리키므로 ‘자녀’로 옮겼고, 소유격 σου를 반영해 ‘네’로 처리했습니다.
- source_word: δεηθῆναί
  english_pob_choice: should beg
  chosen_korean: 구걸하는 것이
  alternatives_korean:
  - 구하는 것이
  - 간청하는 것이
  - 빌어야 하는 것이
  lexicon: LSJ
  rationale: 이 경제·의존 맥락에서는 단순한 요청보다 절박한 구걸의 뉘앙스가 강하므로, 의미를 분명히 드러내는 ‘구걸하는 것’으로 옮겼습니다.
- source_word: ἐμβλέπειν εἰς χεῖρας υἱῶν σου
  english_pob_choice: look to the hands of your sons
  chosen_korean: 네 아들들의 손을 바라보는 것
  alternatives_korean:
  - 네 아들들의 손에 의지하는 것
  - 네 아들들의 손을 바라보는 것
  lexicon: LSJ
  rationale: ἐμβλέπειν εἰς χεῖρας의 구체적 신체 이미지를 보존하기 위해 직역적 표현을 유지했고, υἱῶν은 ‘아들들’로 구체적으로 옮겼습니다.
theological_decisions:
- issue: 형제적/가족적 의존의 역전이라는 수치 이미지
  chosen_reading: 네 자녀가 네게 구걸하는 것
  alternative_readings:
  - 네 자녀가 네게 요청하는 것
  - 네 자녀가 네게 의지하는 것
  rationale: 원문은 단순한 필요 충족이 아니라 자녀가 부모에게 구걸해야 하는 역전된 수치를 강조하므로, 이를 약화하지 않는 표현을 선택했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 6
- issue: ‘손’을 통한 부양의 구체적 이미지
  chosen_reading: 네 아들들의 손을 바라보는 것
  alternative_readings:
  - 네 아들들에게서 부양을 기대하는 것
  - 네 아들들에게 의지하는 것
  rationale: 그리스어는 추상적 의존이 아니라 ‘손’을 향해 보는 구체적 이미지를 사용하므로, 본문에서는 그 이미지를 유지하고 의미는 독자가 읽어낼 수 있게 두었습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1
