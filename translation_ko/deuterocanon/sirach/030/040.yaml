translation:
  language: ko
  text: 네가 그를 학대하고 내보내면, 그는 달아날 것입니다. 어느 길에서 그를 찾겠습니까?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐὰν κακώσῃς
  english_pob_choice: If you mistreat him
  chosen_korean: 네가 그를 학대하고
  alternatives_korean:
  - 네가 그에게 해를 끼치고
  - 네가 그를 못되게 대하고
  lexicon: BDAG
  rationale: 조건문과 사람을 거칠게 대하는 뜻을 함께 살리기 위해, 관계적·실천적 뉘앙스가 분명한 ‘학대하다’를 선택했습니다.
- source_word: ἀπάρᾳς
  english_pob_choice: send him away
  chosen_korean: 내쫓으면
  alternatives_korean:
  - 보내면
  - 떠나게 하면
  lexicon: LSJ
  rationale: 단순한 이동보다 강한 배제·추방의 힘이 문맥상 두드러지므로, 결과적으로 그를 떼어 놓는 의미를 드러내는 ‘내쫓다’를 택했습니다.
- source_word: ἀποδρᾷ
  english_pob_choice: he will run off
  chosen_korean: 도망할 것입니다
  alternatives_korean:
  - 달아날 것입니다
  - 도망칠 것입니다
  lexicon: BDAG
  rationale: 학대와 내쫓음의 결과로 생기는 즉각적인 도피를 자연스러운 한국어로 옮겼습니다.
- source_word: ἐν ποίᾳ ὁδῷ ζητήσεις αὐτόν
  english_pob_choice: on what road will you look for him?
  chosen_korean: 어느 길에서 그를 찾겠습니까?
  alternatives_korean:
  - 어느 길로 그를 찾겠습니까?
  - 어디에서 그를 찾겠습니까?
  lexicon: BDAG
  rationale: 원문의 구체적 이미지인 ‘길/경로’를 살리되, 한국어에서는 조사와 어순을 자연스럽게 조정해 수사적 질문으로 유지했습니다.
theological_decisions:
- issue: 수사적 질문의 강도
  chosen_reading: 마지막 질문을 단순 정보 요청이 아니라, 한 번 내쫓은 사람을 다시 찾기 어려운 현실을 드러내는 수사적 질문으로 옮겼습니다.
  alternative_readings:
  - 어디에서 그를 찾겠습니까?
  - 그를 다시 찾을 수 있겠습니까?
  rationale: 헬라어 문장은 관계를 깨뜨린 뒤 회복이 얼마나 어려운지 강조하는 수사적 효과가 있으므로, 한국어도 그 압박감을 유지했습니다.
  doctrine_reference: 잠언적 교훈의 수사적 강조
