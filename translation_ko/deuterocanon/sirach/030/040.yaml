review_pass:
  verdict: revise
  source_fidelity: ‘학대하고’는 κακώσῃς의 넓은 ‘나쁘게 대하다/해치다’를 문맥상 적절히 옮깁니다. 다만 ἀπάρᾳς는 단순한 내보냄·떠나게 함을 가리킬 수 있으므로, 강제 추방을 단정하는 ‘내쫓으면’보다 ‘내보내면’이 원문의 여지를 더 잘 보존합니다. ‘어느 길에서’는 ἐν ποίᾳ ὁδῷ의 구체적 길 이미지를 충실히 살립니다.
  naturalness: 수정문은 현대 표준 한국어 합쇼체로 자연스럽고, 조건문과 수사 의문문의 흐름도 명료합니다.
  terminology: ‘학대하다’와 ‘달아나다’는 이 대인 관계 문맥에서 자연스럽고 과도하게 신학적·해석적이지 않습니다. 기존 각주는 본문을 사실상 그대로 반복하면서 ‘장소를 묻는 말이 아니다’라고 단정하여, 원문의 ‘어느 길에서’라는 구체적 물음을 불필요하게 약화하므로 삭제하는 편이 낫습니다.
  issues:
  - severity: low
    issue: ‘내쫓으면’은 ἀπάρᾳς의 강제 추방 의미를 다소 좁게 확정합니다.
    rationale: 이 동사는 문맥상 상대를 떠나게 하거나 보내는 행위를 뜻하지만, 반드시 강압적 추방만을 뜻한다고 단정하기 어렵습니다. ‘내보내면’은 문맥의 결과를 유지하면서 의미 범위를 보존합니다.
  - severity: medium
    issue: 각주가 ‘장소를 묻는 말이 아니다’라고 서술합니다.
    rationale: ἐν ποίᾳ ὁδῷ는 문자적으로 ‘어느 길에서/어떤 길로’라는 구체적 표현이며 수사적 효과가 있어도 질문 자체의 길·경로 이미지를 부정할 수는 없습니다. 또한 각주는 본문 번역을 반복할 뿐 유의미한 대안을 제공하지 않습니다.
  revised_text: 네가 그를 학대하고 내보내면, 그는 달아날 것입니다. 어느 길에서 그를 찾겠습니까?
