base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/030/014.yaml
  text: Better is a poor man who is alive in himself than a rich man stricken in his flesh[a].
  footnotes:
  - marker: a
    text: 'Greek parallel: ''Better is a poor man, healthy and strong in constitution, than a rich man scourged in his body.'' The Hebrew witness is shorter and says literally ''alive in himself'' and ''stricken in his flesh.'''
    reason: alternative_reading
translation:
  language: ko
  text: 가난하지만 살아 있는 사람이, 자기 육체에 상처를 입은 부자보다 더 낫습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 문자적으로 ‘자기 안에서 살아 있는’과 ‘자기 육체에 상처를 입은’이라고 말합니다. 그리스어 평행본문은 ‘건강하고 기운 있는 가난한 사람’과 ‘몸에 채찍질당한 부자’로 더 풀어 말합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: טוב
  english_pob_choice: Better is
  chosen_korean: …보다 더 낫습니다
  alternatives_korean:
  - 좋습니다
  - 더 좋습니다
  lexicon: HALOT
  rationale: 히브리어 잠언식 비교문이므로 한국어에서도 비교 구조로 자연스럽게 옮겼습니다.
- source_word: מסכן
  english_pob_choice: poor man
  chosen_korean: 가난한 사람
  alternatives_korean:
  - 가난한 남자
  - 궁핍한 사람
  lexicon: HALOT
  rationale: 남성형 단수 형식이지만, 한국어에서는 성별보다 처지 대비가 핵심이어서 자연스러운 대표 명사로 옮겼습니다.
- source_word: וחי בעצמו
  english_pob_choice: who is alive in himself
  chosen_korean: 살아 있는 사람
  alternatives_korean:
  - 자기 안에서 살아 있는 사람
  - 자기 자신 안에서 살아 있는 사람
  lexicon: HALOT
  rationale: 직역하면 어색하지만, 본문의 반사적 관용을 한국어에서 자연스럽게 풀어 ‘살아 있는’으로 옮기되, 존재의 온전함을 유지했습니다.
- source_word: מעשיר
  english_pob_choice: a rich man
  chosen_korean: 부자
  alternatives_korean:
  - 부유한 사람
  - 재물 많은 사람
  lexicon: HALOT
  rationale: 대조 구조를 간결하게 살리기 위해 통용되는 명사형 ‘부자’를 사용했습니다.
- source_word: ונגע בבשרו
  english_pob_choice: stricken in his flesh
  chosen_korean: 자기 육체에 상처를 입은
  alternatives_korean:
  - 자기 살에 상처를 입은
  - 자기 몸에 해를 입은
  lexicon: HALOT
  rationale: 히브리어 בשר를 ‘육체’로 보존하면서, נגע의 물리적 타격감을 ‘상처를 입은’으로 옮겼습니다.
theological_decisions:
- issue: עצמו의 반사적 뉘앙스
  chosen_reading: ‘살아 있는 사람’으로 옮겨, 생명이 자기 내부에서 온전히 유지되는 뉘앙스를 살렸습니다.
  alternative_readings:
  - 자기 안에서 살아 있는 사람
  - 자기 자신 안에서 살아 있는 사람
  rationale: 히브리어의 반사적 표현을 너무 기계적으로 반복하면 한국어가 부자연스러워지므로, 의미는 보존하되 문장성을 우선했습니다.
  doctrine_reference: Translation philosophy §§1, 5, 6
- issue: 보편적 지혜 격언의 인칭 처리
  chosen_reading: 성별 표지를 드러내지 않고 대표적 인간형으로 번역했습니다.
  alternative_readings:
  - 가난한 남자... 부유한 남자
  - 가난한 자... 부유한 자
  rationale: 본절은 교리 진술이 아니라 잠언적 대조이므로, 한국어 관용에 맞는 대표명사로 읽히게 했습니다.
  doctrine_reference: Translation philosophy §4
