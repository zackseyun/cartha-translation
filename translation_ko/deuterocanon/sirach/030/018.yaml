base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/030/018.yaml
  text: Delicacies poured out before a shut mouth are like an offering set before an idol[a][b].
  footnotes:
  - marker: a
    text: Hebrew גלול is a contemptuous term for an idol; alternatively, 'a dung-idol' or 'a filthy idol.'
    reason: lexical_alternative
  - marker: b
    text: The Greek parallel reads 'food portions laid beside a tomb' instead of the Hebrew's 'an offering set before an idol,' showing a notable difference in the second comparison while preserving the same idea of futility.
    reason: textual_variant
translation:
  language: ko
  text: 다문 입 앞에 부어 놓은 맛있는 음식은 우상 앞에 차려 놓은 제물과 같습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 גלול은 우상을 낮잡아 이르는 말입니다. 더 강하게는 ‘분뇨 우상’ 또는 ‘더러운 우상’으로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어 병행본문은 ‘무덤 곁에 놓인 음식 몫’으로 읽습니다. 이는 히브리어의 ‘우상 앞에 차려 놓은 제물’과 비교 이미지가 다르지만, 둘 다 헛된 제시라는 요점을 드러냅니다.
    reason: textual_variant
lexical_decisions:
- source_word: טובה
  english_pob_choice: delicacies
  chosen_korean: 맛있는 음식
  alternatives_korean:
  - 좋은 것들
  - 진수성찬
  - 귀한 음식
  lexicon: HALOT
  rationale: 문맥상 추상적 ‘선함’이 아니라 먹을 수 있는 좋은 음식들을 가리키므로, 감각적으로 자연스러운 ‘맛있는 음식’으로 옮겼습니다.
- source_word: שפוכה
  english_pob_choice: poured out
  chosen_korean: 쏟아져 있는
  alternatives_korean:
  - 부어 놓인
  - 쏟아진
  - 엎질러진
  lexicon: HALOT
  rationale: ‘붓다/쏟다’의 수동적 이미지가 살아 있어야 하므로, 음식이 무의미하게 흩뿌려진 장면을 드러내는 표현을 택했습니다.
- source_word: על פה סתום
  english_pob_choice: before a shut mouth
  chosen_korean: 입을 다문 입 앞에
  alternatives_korean:
  - 닫힌 입 앞에
  - 입을 닫은 사람 앞에
  - 다문 입 위에
  lexicon: HALOT
  rationale: 관용적이면서도 원문의 대비를 살리기 위해, 먹을 수 없거나 응답할 수 없는 상태를 나타내는 ‘입을 다문’ 구성을 유지했습니다.
- source_word: תנופה מצגת
  english_pob_choice: an offering set
  chosen_korean: 바쳐 놓은 제물
  alternatives_korean:
  - 드린 제물
  - 흔든 제물
  - 제물로 차려 놓은 것
  lexicon: HALOT
  rationale: תנופה가 기술적으로는 ‘거제/요제’ 계열일 수 있으나, 이 속담에서는 의례적 제의물을 일반적으로 가리키는 기능이 더 크므로 ‘제물’로 넓게 옮겼습니다.
- source_word: גלול
  english_pob_choice: idol
  chosen_korean: 우상
  alternatives_korean:
  - 우상
  - 분뇨 우상
  - 더러운 우상
  lexicon: HALOT
  rationale: 원어는 경멸적 뉘앙스를 지니지만, 본문에서는 일차적으로 대상을 분명히 하는 ‘우상’을 쓰고, 경멸성은 주석으로 처리하는 편이 자연스럽습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행본문의 비교 이미지 차이
  chosen_reading: 히브리어의 ‘우상 앞에 바친 제물’ 이미지를 본문에 따르고, 그리스어의 ‘무덤 곁에 놓인 음식 몫’ 차이는 주석으로만 반영했습니다.
  alternative_readings:
  - 그리스어를 따라 ‘무덤 앞에 놓인 음식’으로 옮김
  - 두 이미지를 절충하여 혼합 표현 사용
  rationale: 이 절의 핵심은 무엇을 앞에 두어도 받아들여질 수 없는 상태의 헛됨이므로, 기준 본문인 히브리어의 대조를 살리되 병행본문 차이는 숨기지 않도록 했습니다.
  doctrine_reference: Translation philosophy §1, §6
