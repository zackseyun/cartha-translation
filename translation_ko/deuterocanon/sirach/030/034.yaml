  yaml_path: translation/deuterocanon/sirach/030/034.yaml
  text: Put him to work while he is a child[a], and you will find rest; let his hands go idle[b], and he will seek freedom.
  footnotes:
  - marker: a
    text: Or 'let up on his hands,' that is, relax discipline over his work or activity.
    reason: lexical_alternative
  - marker: b
    text: '''Freedom'' here means throwing off restraint or discipline, not political liberty.'
    reason: cultural_note
translation:
  language: ko
  text: 아이일 때 그를 일하게 하십시오. 그러면 안식을 얻을 것입니다. 그의 손을 놀게 두십시오[a]. 그러면 그는 자유를 찾을 것입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 손을 느슨하게 하라’. 곧 그의 일이나 활동에 대한 훈육을 완화하라는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 여기서 ‘자유’는 정치적 자유가 아니라, 제약이나 훈육을 벗어버리려는 뜻입니다.
    reason: cultural_note
lexical_decisions:
- source_word: ἔργασαι
  english_pob_choice: Put him to work
  chosen_korean: 그를 일하게 하십시오
  alternatives_korean:
  - 그에게 일을 시키십시오
  - 그를 일에 종사하게 하십시오
  - 그를 노동하게 하십시오
  lexicon: LSJ
  rationale: aorist middle imperative의 권고적 힘을 살리면서도, 현대 한국어에서 자연스럽고 과도하게 거칠지 않은 명령형으로 옮겼습니다.
- source_word: ἐν παιδί
  english_pob_choice: while he is a child
  chosen_korean: 아이일 때
  alternatives_korean:
  - 어릴 때
  - 어린 시절에
  - 아동기에
  lexicon: LSJ
  rationale: 전치사구의 시간적 의미를 분명히 하면서, 뒤의 남성 단수 대명사와 연결되는 대상이 어린 시기임을 간결하게 드러냈습니다.
- source_word: ἄνες χεῖρας αὐτῷ
  english_pob_choice: let his hands go idle
  chosen_korean: 그의 손을 풀어 주면
  alternatives_korean:
  - 그의 손을 느슨하게 하면
  - 그의 손을 쉬게 하면
  - 그의 손에서 힘을 빼면
  lexicon: LSJ
  rationale: 직역의 '손'을 유지하되, 문맥상 작업과 훈육의 긴장을 풀어 주는 뜻을 한국어 관용에 맞게 표현했습니다.
- source_word: ἐλευθερίαν
  english_pob_choice: freedom
  chosen_korean: 자유
  alternatives_korean:
  - 해방
  - 제멋대로 함
  - 독립
  lexicon: LSJ
  rationale: 기본 어휘 의미를 살리되, 본문 주석이 말하듯 정치적 자유가 아니라 제약과 훈육을 벗어나려는 뜻이므로 일반적인 '자유'로 번역하고 주석으로 범위를 밝혔습니다.
theological_decisions:
- issue: 훈육과 자유의 대비가 단순한 정치적 자유로 오해되지 않도록 할 것인지
  chosen_reading: '''자유''를 유지하되, 손을 풀어 주는 훈육 완화의 맥락으로 읽히게 했습니다.'
  alternative_readings:
  - '''제멋대로 하려 할 것입니다''로 의역'
  - '''독립을 찾을 것입니다''로 구체화'
  rationale: 본문의 지혜문은 훈육이 느슨해질 때 생기는 태도 변화를 말하며, POB의 audit trail도 정치적 자유가 아님을 분명히 합니다. 한국어 본문은 본뜻을 보존하고 의미 범위는 주석으로 처리하는 편이 적절합니다.
  doctrine_reference: POB translation philosophy; Sirach wisdom instruction context
