  source_fidelity: 첫 절의 ‘아이일 때 그를 일하게 하십시오’와 결과절은 그리스어의 권면과 인과를 대체로 충실히 옮겼습니다. 그러나 ἄνες χεῖρας αὐτῷ는 손을 ‘풀어 주다’라는 물리적 의미보다 그가 손을 놀리도록 내버려 두어 일이나 훈육을 느슨하게 한다는 뜻이므로, 본문을 더 분명하고 자연스럽게 고쳤습니다. 두 명령형의 병행도 회복했습니다.
  naturalness: ‘그의 손을 풀어 주면’은 현대 한국어에서 구속을 풀어 준다는 뜻으로 쉽게 읽혀 노동·활동을 쉬게 한다는 비유적 의미가 충분히 드러나지 않습니다. ‘그의 손을 놀게 두십시오’가 이 문맥에서 더 자연스럽고 뜻이 명확합니다.
  terminology: ‘안식’은 ἀνάπαυσις를 적절히 보존하며, ‘자유’는 ἐλευθερία의 기본 뜻을 유지합니다. 후자는 정치적 자유가 아니라 훈육과 제약을 벗어나려는 뜻임을 각주로 한정했습니다.
