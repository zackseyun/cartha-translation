translation:
  language: ko
  text: 이와 같습니다. 재산을 가진 사람이 그것을 누리지 못하는 경우입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 짧지만, 그리스어 평행본문은 ‘눈으로 보고 한숨짓는…’이라는 생생한 이미지를 덧붙여 “가지고 있으나 누리지 못함”의 뜻을 뒷받침합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: כן
  english_pob_choice: So it is with
  chosen_korean: 이와 같습니다
  alternatives_korean:
  - 그러하니
  - 그와 같습니다
  lexicon: HALOT
  rationale: 비교·비유를 여는 말이므로, 문어체이면서도 자연스러운 한국어로 관계를 분명히 했습니다.
- source_word: מי שיש לו
  english_pob_choice: one who has
  chosen_korean: 재산을 가진 사람이
  alternatives_korean:
  - 재산이 있는 사람
  - 어떤 사람이 재산을 가지고
  lexicon: HALOT
  rationale: 히브리어의 일반적 관계절을 한국어로 풀어, 특정 인물보다 일반적 사례를 가리키는 뜻을 살렸습니다.
- source_word: עושר
  english_pob_choice: wealth
  chosen_korean: 재산
  alternatives_korean:
  - 부
  - 부유함
  - 재물
  lexicon: HALOT
  rationale: 문맥상 물질적 소유를 가리키므로, 현대 한국어에서 바로 이해되는 ‘재산’을 선택했습니다.
- source_word: ואין נהנה ממנו
  english_pob_choice: and does not enjoy it
  chosen_korean: 그것을 누리지 못하는
  alternatives_korean:
  - 그것에서 유익을 얻지 못하는
  - 그것을 즐기지 못하는
  lexicon: HALOT
  rationale: נהנה는 단순한 이익보다 실제로 누리는 경험을 뜻하므로, POB의 ‘enjoy’에 맞춰 ‘누리다’로 옮겼습니다.
theological_decisions:
- issue: 풍자적 비교의 강도
  chosen_reading: 재산의 소유와 실제 향유 사이의 대비를 직설적으로 드러냈습니다.
  alternative_readings:
  - ‘재산이 있어도 쓸모가 없는’처럼 완화할 수 있음
  - ‘유익을 얻지 못하는’처럼 경제적 의미로 좁힐 수 있음
  rationale: 히브리어는 단순한 소유 여부가 아니라 소유한 것을 실제로 누리지 못하는 아이러니를 말하므로, 그 긴장을 약화하지 않았습니다.
  doctrine_reference: 문학적 지혜문학의 대비 표현
