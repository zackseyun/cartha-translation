  source_fidelity: 히브리어 כן מי שיש לו עושר, ואין נהנה ממנו.의 비교 구문과 ‘재산을 가지고도 그것을 누리지 못하는 사람’이라는 뜻은 초안에 대체로 반영되어 있습니다. 다만 원문은 앞 문맥을 받는 비교의 결론이므로, 이를 한국어 문장 안에서 더 직접적으로 나타내는 편이 정확합니다.
  naturalness: ‘이와 같습니다. 재산을 가진 사람이 그것을 누리지 못하는 경우입니다.’는 두 문장으로 끊기면서 다소 설명문·메모체처럼 들립니다. 비교 대상을 주어로 삼아 한 문장으로 옮기면 현대 표준어 합쇼체 문맥에서 자연스럽습니다.
