translation:
  language: ko
  text: 왜냐하면 분노가 많은 사람을 죽였고, 격노 안에는 이익이 없기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 제시된 그리스어 병행문은 이 절과 내용이 달라 보이며, 다른 절 또는 다른 전승을 반영하는 것으로 보입니다. 본문은 남아 있는 히브리어 증거를 따릅니다.
    reason: textual_variant
  - marker: b
    text: 히브리어의 첫 행에 있는 단어는 형태가 다소 불확실하므로, 문맥과 둘째 행의 ‘격노’와의 병행에 따라 옮겼습니다.
    reason: lexical_alternative
