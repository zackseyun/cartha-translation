theological_decisions:
- issue: 히브리어 본문과 제시된 그리스어 병행문의 불일치
  chosen_reading: 주어진 히브리어를 본문으로 따라 ‘분노가 많은 사람을 죽였고…’로 번역했습니다.
  alternative_readings:
  - 그리스어 병행문을 따라 ‘생각하십시오. 나는 나 혼자만을 위해 수고한 것이 아니라, 가르침을 찾는 모든 이를 위해 수고했습니다.’로 옮길 수 있습니다.
  rationale: 이 구절의 그리스어는 내용상 전혀 다른 문장을 반영하므로 본문을 지배할 수 없고, 서라크의 남아 있는 히브리어 증거를 우선하는 것이 프로젝트 원칙에 맞습니다.
  doctrine_reference: 'PHILOSOPHY.md: 히브리어가 보존된 경우 히브리어를 우선하며, 본문 전승의 차이는 투명하게 기록한다.'
