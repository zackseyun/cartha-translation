translation:
  language: ko
  text: 그에게 섬기고 그를 위해 제사장으로 봉사하며, 그의 백성을 그의 이름으로 축복합니다. 그는 모든 살아 있는 존재 가운데서 그를 택하여 번제물과 기름 부분들을 드리게 하셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 병행문은 더 길며, ‘주님께 제물을 드리며, 향과 기쁜 향기를 기억물로 드려, 백성을 위해 속죄하게 하다’라는 내용이 더 있습니다. 현존 히브리어 증거는 더 짧습니다.
    reason: textual_variant
lexical_decisions:
- source_word: לשרת
  english_pob_choice: to minister
  chosen_korean: 섬기고
  alternatives_korean:
  - 봉사하고
  - 시무하고
  lexicon: HALOT
  rationale: 성소 문맥에서의 예배적 섬김을 살리면서도, 뒤의 제사장 봉사와 함께 자연스럽게 읽히도록 ‘섬기다’로 옮겼습니다.
- source_word: ולכהן לו
  english_pob_choice: to serve as priest
  chosen_korean: 그를 위해 제사장으로 봉사하며
  alternatives_korean:
  - 그를 위해 제사장으로 섬기며
  - 그에게 제사장 직무를 수행하며
  lexicon: HALOT
  rationale: כהן의 제의적·직분적 의미를 드러내기 위해 ‘제사장으로 봉사하다’로 옮겼고, 대상인 ‘그를 위해’를 보존했습니다.
- source_word: ולברך את עמו בשמו
  english_pob_choice: and to bless his people in his name
  chosen_korean: 그의 백성을 그의 이름으로 축복합니다
  alternatives_korean:
  - 그의 백성을 그의 이름 안에서 축복합니다
  - 그의 이름으로 그의 백성을 복을 빕니다
  lexicon: HALOT
  rationale: ‘이름으로’라는 매개 표현을 직역해 언약적·예전적 축복의 성격을 유지했습니다.
- source_word: להגיש עלה וחלבים
  english_pob_choice: to present burnt offerings and fat portions
  chosen_korean: 번제물과 기름 부분들을 드리게 하셨습니다
  alternatives_korean:
  - 번제물과 기름 몫들을 드리게 하셨습니다
  - 번제와 기름 부분들을 바치게 하셨습니다
  lexicon: HALOT
  rationale: עלה와 חלבים의 제의적 의미를 살려 ‘번제물’과 제단에 올리는 ‘기름 부분들’로 옮겼습니다. 복수형 뉘앙스는 ‘부분들’로 반영했습니다.
theological_decisions:
- issue: 히브리어 본문과 더 긴 그리스어 병행문의 처리
  chosen_reading: 본문은 현존 히브리어를 따르고, 그리스어의 더 긴 제의 항목은 본문에 합치지 않았습니다.
  alternative_readings:
  - 그리스어의 향, 기념물, 속죄 표현을 본문에 합쳐 옮기기
  - 히브리어와 그리스어를 조화시켜 하나의 확장된 문장으로 만들기
  rationale: 이 절은 히브리어 전승이 더 짧고, 그리스어는 제의 세부를 추가합니다. 본문에 그 추가분을 넣으면 히브리어 증거를 넘어서게 되므로, 본문은 히브리어를 따르고 그 차이는 별도 주석으로 처리하는 것이 가장 투명합니다.
  doctrine_reference: 'PHILOSOPHY.md: translate from Hebrew where it survives; preserve source uncertainty honestly'
