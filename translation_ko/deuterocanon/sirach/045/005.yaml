base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/045/005.yaml
  text: He let him hear his voice[a], and brought him near into the dark cloud. He placed in his hand the commandment, a law of life and understanding, to teach Jacob his statutes[b], and Israel his testimonies and judgments.
  footnotes:
  - marker: a
    text: 'Greek: ''commandments'' instead of ''the commandment.'''
    reason: textual_variant
  - marker: b
    text: Greek reads 'to teach Jacob the covenant, and Israel his judgments' where the Hebrew reads 'his statutes ... his testimonies and judgments.'
    reason: alternative_reading
translation:
  language: ko
  text: 그분께서는 그에게 자신의 음성을 들려주시고, 그를 짙은 어둠 속으로 가까이 이끄셨습니다. 그의 손에 명령[a], 곧 생명과 깨달음의 율법을 주셔서, 야곱에게 그의 규례들을, 이스라엘에게 그의 증거들과 판결들을 가르치게 하셨습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 여기서 히브리어의 단수형 ‘명령’ 대신 복수형 ‘명령들’을 읽습니다.
    reason: textual_variant
  - marker: b
    text: 그리스어는 ‘야곱에게 언약을, 이스라엘에게 그의 판결들을 가르치도록’으로 읽습니다. 히브리어는 ‘야곱에게 그의 규례들을, 이스라엘에게 그의 증거들과 판결들을’로 읽습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וישמיעהו את קולו
  english_pob_choice: He let him hear his voice
  chosen_korean: 그에게 자기의 음성을 듣게 하시고
  alternatives_korean:
  - 그에게 자기 음성을 들려주시고
  - 그가 자기 음성을 듣게 하시고
  lexicon: HALOT
  rationale: 히필형 שמע의 인과 의미를 살리되, 한국어에서는 ‘듣게 하다’가 가장 자연스럽고 본문의 신적 주도성을 유지합니다.
- source_word: ויגישהו לערפל
  english_pob_choice: brought him near into the dark cloud
  chosen_korean: 그를 어두운 구름으로 데려가셨습니다
  alternatives_korean:
  - 그를 짙은 어둠 속으로 인도하셨습니다
  - 그를 짙은 구름으로 데려가셨습니다
  lexicon: HALOT
  rationale: ערפל은 단순한 어둠보다 시내 현현의 신적 임재를 동반한 ‘구름/짙은 어둠’의 뉘앙스가 있어, 접근성과 상징성을 함께 살렸습니다.
- source_word: מצוה
  english_pob_choice: the commandment
  chosen_korean: 명령
  alternatives_korean:
  - 계명
  - 명령들
  lexicon: HALOT
  rationale: 히브리어 단수형을 따라 한 개의 구체적 수여물로 읽되, 문맥상 시내에서 주어진 신적 명령의 성격을 살리기 위해 ‘명령’으로 옮겼습니다.
- source_word: תורת חיים ותבונה
  english_pob_choice: a law of life and understanding
  chosen_korean: 생명과 깨달음의 율법
  alternatives_korean:
  - 생명과 이해의 율법
  - 생명의 율법과 깨달음
  lexicon: HALOT
  rationale: תורה의 ‘율법/가르침’ 의미를 유지하고, תבונה는 단순 지식보다 분별과 이해를 포함하므로 ‘깨달음’으로 옮겼습니다.
- source_word: חוקיו ... ועדותיו ומשפטיו
  english_pob_choice: his statutes ... his testimonies and judgments
  chosen_korean: 그의 규례들을, 이스라엘에게는 그의 증거들과 판단들을
  alternatives_korean:
  - 그의 율례들을, 이스라엘에게는 그의 증거들과 판결들을
  - 그의 법도들을, 이스라엘에게는 그의 증거들과 규례들을
  lexicon: HALOT
  rationale: חוקים, עדות, משפט의 서로 다른 법적 어휘를 구분해, 전통적 교회어를 무리하게 평탄화하지 않고 각각 ‘규례들/증거들/판단들’로 대응했습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 평행본문의 차이
  chosen_reading: 본문은 히브리어의 단수 ‘명령’과 ‘증거들’ 구성을 따르고, 그리스어가 보이는 복수 ‘계명’ 및 ‘언약’ 독법은 주본문에 흡수하지 않았습니다.
  alternative_readings:
  - ‘계명들’
  - ‘언약’
  rationale: 이 절은 히브리어 본문이 고신뢰로 남아 있으므로 그것을 우선하되, 그리스어의 실재하는 변이를 번역문에 덧씌우지 않고 별도 주해로 처리하는 것이 원문 가독성과 감사 가능성을 함께 지킵니다.
  doctrine_reference: 원문 우선 원칙; 시락서의 경우 보존된 히브리어를 주본문으로 삼고 그리스어는 대조 증거로 반영
