base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/045/007.yaml
  text: He put splendor upon him and ministered to him with his glory[b][a]; he girded him with the horns of a wild ox and clothed him with bells.
  footnotes:
  - marker: a
    text: 'Greek parallel: ''He established for him an everlasting covenant, and gave him the priesthood of the people; he blessed him with adornment, and girded him with a robe of glory.'' The Hebrew witness here differs substantially from the Greek.'
    reason: alternative_reading
  - marker: b
    text: Or possibly 'with the lofty strength of a wild ox.' The Hebrew phrase is difficult, and the image may be metaphorical rather than describing literal horned ornamentation.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 그에게 위엄을 주셨고, 그의 영광으로 그를 섬기게 하셨습니다[a][b]. 그분은 그를 들소의 뿔들로 띠처럼 두르시고, 종들로 그를 입히셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '그리스어 병행본문: “그에게 영원한 언약을 세우시고, 백성의 제사장직을 주시며, 그를 아름다움으로 복되게 하시고, 영광의 옷으로 두르셨습니다.” 이 절의 히브리어 전승은 그리스어와 상당히 다릅니다.'
    reason: textual_variant
  - marker: b
    text: ‘들소의 뿔들’은 난해한 히브리어 표현입니다. 문자적 이미지일 수도 있지만, ‘들소의 높은 힘/장엄한 힘’이라는 뜻을 시사할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ויתן עליו הוד
  english_pob_choice: He put splendor upon him
  chosen_korean: 그는 그에게 위엄을 주셨고
  alternatives_korean:
  - 그는 그에게 영광을 주셨고
  - 그는 그에게 광채를 입히셨고
  lexicon: HALOT
  rationale: נתן עליו는 단순히 ‘주다’보다 ‘그 위에 놓다/입히다’의 부여-투사 이미지를 가지므로, 문맥의 의복·임직 이미지에 맞게 ‘위엄을 주셨고’로 옮겼습니다.
- source_word: וישרתהו בכבודו
  english_pob_choice: ministered to him with his glory
  chosen_korean: 그의 영광으로 그를 섬기게 하셨습니다
  alternatives_korean:
  - 그의 영광으로 그를 시중들게 하셨습니다
  - 그의 영광으로 그를 봉사하게 하셨습니다
  lexicon: HALOT
  rationale: שרת의 기본 뜻은 ‘섬기다/시중들다’이지만, 주어가 하나님인 점과 제사장 임직 문맥을 살려 ‘섬기게 하셨습니다’로 옮겼습니다. בכבודו의 소유격은 ‘그의 영광으로’로 보존했습니다.
- source_word: ויאזרהו בתועפות ראם
  english_pob_choice: he girded him with the horns of a wild ox
  chosen_korean: 그분은 그를 들소의 뿔들로 띠처럼 두르시고
  alternatives_korean:
  - 그분은 그를 들소의 뿔들로 띠를 매시고
  - 그분은 그를 야생소의 힘으로 두르시고
  lexicon: HALOT
  rationale: תועפות ראם은 난해하여 ‘들소의 뿔들’이라는 직역적 이미지를 유지하되, אזר의 ‘허리띠를 두르다’ 느낌을 살려 ‘띠처럼 두르시고’로 자연화했습니다.
- source_word: וילבישהו פעמונים
  english_pob_choice: clothed him with bells
  chosen_korean: 종들로 그를 입히셨습니다
  alternatives_korean:
  - 방울들로 그를 입히셨습니다
  - 방울을 달아 그를 입히셨습니다
  lexicon: HALOT
  rationale: פעמונים은 문자적으로 ‘방울들’이지만, 문맥상 제의적 옷장식 요소이므로 ‘종들’로 옮겨 한국어 독자가 의복 장식을 자연스럽게 이해하도록 했습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행문의 현저한 불일치
  chosen_reading: 본문은 현존 히브리어를 따라 임직과 장식의 이미지를 번역하고, 그리스어의 ‘영원한 언약/제사장직’ 내용은 각주로 보존했습니다.
  alternative_readings:
  - 그리스어를 따라 ‘영원한 언약을 세우시고…’로 옮김
  rationale: 시락 45:7은 히브리어와 그리스어가 크게 다르므로, 본문은 히브리어를 우선하되 유의미한 대체 전승을 각주로 드러내야 합니다.
  doctrine_reference: 'PHILOSOPHY.md: 현존 히브리어 우선, 그리스어 평행본문은 실제 번역 입력으로 취급'
- issue: 제의적 의복 이미지의 직역성과 가독성의 균형
  chosen_reading: ‘들소의 뿔들로 띠처럼 두르시고’와 같이 난해한 비유를 보존하되, 한국어 문장에서는 임직 장식의 연속 동작으로 읽히게 했습니다.
  alternative_readings:
  - ‘들소의 뿔의 높이/힘으로 두르시고’
  rationale: 원문의 상징성을 평탄화하지 않으면서도 한국어 독자가 제의적 수여 장면으로 이해하도록 최소한의 연결어만 보강했습니다.
  doctrine_reference: 'POB 번역 원칙: source-direct, tension 보존'
