  text: But in their land he will not inherit[a], and among them he will not be allotted an inheritance; the offerings of Yahweh are his portion and his inheritance among the sons of Israel.
  footnotes:
  - marker: a
    text: 'Greek parallel: ''for he himself is your portion, inheritance,'' reflecting a different form of the final clause than the extant Hebrew, which reads ''the offerings of the LORD are his portion and his inheritance.'''
