translation:
  language: ko
  text: 그러나 그들의 땅에서는 상속받지 못하고, 그들 가운데서도 몫을 나누어 받지 못합니다. 야훼의 제물들이 그의 몫이자 그의 기업이 되며, 이스라엘 자손 가운데서 그렇게 됩니다.<a>[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 병행본문은 “그 자신이 너의 몫, 기업”으로 읽으며, 현존 히브리어의 “야훼의 제물들이 그의 몫과 그의 기업”과 다릅니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אך
  english_pob_choice: But
  chosen_korean: 그러나
  alternatives_korean:
  - 하지만
  - 그런데
  lexicon: HALOT
  rationale: 앞선 아론과 그 후손의 특권과 대비되는 전환을 한국어의 자연스러운 역접으로 옮겼습니다.
- source_word: לא ינחל
  english_pob_choice: he will not inherit
  chosen_korean: 상속받지 못하고
  alternatives_korean:
  - 유업을 받지 못하고
  - 기업을 얻지 못하고
  lexicon: HALOT
  rationale: נחל의 상속/기업 언어를 살리면서, 현대 한국어에서 문맥상 자연한 동사형으로 옮겼습니다.
- source_word: לא יחלק נחלה
  english_pob_choice: will not be allotted an inheritance
  chosen_korean: 몫을 나누어 받지 못합니다
  alternatives_korean:
  - 유업이 배당되지 않습니다
  - 기업으로 분배받지 못합니다
  lexicon: HALOT
  rationale: 수동적 ‘배당/할당’ 의미를 살리되, 회중이 바로 이해할 수 있도록 ‘몫을 나누어 받다’로 풀었습니다.
- source_word: אשי יהוה
  english_pob_choice: the offerings of Yahweh
  chosen_korean: 야훼의 제물들
  alternatives_korean:
  - 야훼의 화제물
  - 야훼께 드리는 제물들
  lexicon: HALOT
  rationale: אשי는 불로 드리는 제물의 의미를 담지만, 한국어에서는 본문이 말하는 제사 공급의 내용을 드러내는 ‘제물들’이 가장 सीधे적입니다. 전통적 ‘화제물’보다 의미 접근성이 높아 본문용으로 채택했습니다.
- source_word: חלקו ונחלתו
  english_pob_choice: his portion and his inheritance
  chosen_korean: 그의 몫이자 그의 기업
  alternatives_korean:
  - 그의 분깃이자 그의 유업
  - 그의 몫과 그의 유산
  lexicon: HALOT
  rationale: בנסח의 짝표현을 한국어 성서 문체에 맞게 ‘몫/기업’으로 대응시켜 분배와 소유의 두 뉘앙스를 함께 보존했습니다.
- source_word: בתוך בני ישראל
  english_pob_choice: among the sons of Israel
  chosen_korean: 이스라엘 자손 가운데서 그렇게 됩니다
  alternatives_korean:
  - 이스라엘 자손 가운데
  - 이스라엘의 자손들 가운데서
  lexicon: HALOT
  rationale: 문장 끝의 위치를 자연스럽게 풀어 연결하면서도, ‘בני ישראל’의 집단적 호칭은 ‘이스라엘 자손’으로 보존했습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행본문의 마지막 절 차이
  chosen_reading: 주본문은 현존 히브리어의 ‘야훼의 제물들이 그의 몫이자 그의 기업’으로 따르고, 그리스어의 ‘그 자신이 너의 몫, 기업’은 각주로만 남깁니다.
  alternative_readings:
  - 야훼 자신이 그의 몫과 기업이다
  rationale: 시락서는 히브리어가 남아 있는 곳에서는 히브리어를 우선하되, 의미 차이가 큰 그리스어 변이를 숨기지 않는 것이 적절합니다. 따라서 본문은 제사장 몫으로서의 제물을 유지하고, 보다 신학적으로 직접적인 그리스어 읽기는 각주로 추적 가능하게 처리합니다.
  doctrine_reference: 'PHILOSOPHY.md: translate from Hebrew where it survives; preserve meaningful source tension rather than harmonize it away.'
