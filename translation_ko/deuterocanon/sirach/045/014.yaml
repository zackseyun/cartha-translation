translation:
  language: ko
  text: 그의 소제는 날마다 계속해서 두 번 온전히 불살라질 것입니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 병행 본문은 “그의 희생 제물들은 계속하여 날마다 두 번 온전히 태워질 것입니다”라고 합니다. 그러나 현존 히브리어 본문은 더 구체적으로 “그의 소제”라고 말합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: מנחתו
  english_pob_choice: His grain offering
  chosen_korean: 그의 소제
  alternatives_korean:
  - 그의 곡식 제물
  - 그의 예물
  - 그의 헌물
  lexicon: HALOT
  rationale: 제사 문맥의 מִנְחָה는 일반적 ‘예물’보다 제의적 의미가 분명한 ‘소제’로 옮기는 것이 가장 직접적입니다.
- source_word: כליל תקטר
  english_pob_choice: burned up whole
  chosen_korean: 온전히 불살라질
  alternatives_korean:
  - 완전히 태워질
  - 통째로 불살라질
  - 온전히 연기로 올라갈
  lexicon: HALOT
  rationale: כליל은 전부 소비됨을, תקטר는 제단 위에서 불사르는 행위를 나타내므로 ‘온전히 불살라질’이 의미를 가장 자연스럽게 전달합니다.
- source_word: בכל יום
  english_pob_choice: every day
  chosen_korean: 매일
  alternatives_korean:
  - 날마다
  - 매 하루마다
  - 각 날마다
  lexicon: HALOT
  rationale: 시간 부사로서의 בכל יום을 간결하고 자연스럽게 살려 ‘매일’로 옮겼습니다.
- source_word: צמיד
  english_pob_choice: continually
  chosen_korean: 계속해서
  alternatives_korean:
  - 끊임없이
  - 지속적으로
  - 항상
  lexicon: HALOT
  rationale: 제의적 지속성을 나타내는 표현이므로, 한국어에서는 중복을 피하면서도 지속 의미를 살리는 ‘계속해서’가 적절합니다.
- source_word: פעמים
  english_pob_choice: twice
  chosen_korean: 두 번
  alternatives_korean:
  - 두 차례
  - 두 번씩
  - 이회
  lexicon: HALOT
  rationale: 히브리어 פעמים와 그리스어 δίς가 모두 ‘두 번’임을 분명히 하므로, 직설적이고 현대적인 ‘두 번’을 택했습니다.
theological_decisions:
- issue: 히브리어 본문의 구체성 vs. 그리스어 병행문의 일반성
  chosen_reading: 히브리어의 ‘소제’(מנחתו)를 유지하고, 그리스어의 더 넓은 ‘희생 제물들’은 본문으로 확장하지 않았습니다.
  alternative_readings:
  - 그의 제물은 온전히 불살라질 것입니다…
  - 그의 희생 제물은 온전히 불살라질 것입니다…
  rationale: 현존 히브리어 본문이 제의 항목을 더 구체적으로 제시하므로, 번역 본문은 이를 우선 반영하되 그리스어 병행은 주석적 근거로만 남기는 것이 소스 충실성에 맞습니다.
  doctrine_reference: 원어 우선 원칙; 번역 전통보다 स्रोत विशिष्ट성 우선
