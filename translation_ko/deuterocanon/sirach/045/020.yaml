    rationale: ‘영광’은 가능하지만 이 문맥의 수여되는 사회적·제의적 명예에는 ‘존귀’가 더 직접적입니다. ‘몫’은 배분의 결과만 나타내어 נחלה의 유업·상속 함의를 잃게 합니다.
  - severity: low
