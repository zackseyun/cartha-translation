translation:
  language: ko
  text: 그는 아론에게 영광을 더해 주시고, 그에게 그의 몫을 주셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 본문은 이어서 “첫 열매와 맏배의 처음 난 것들을 그들에게 나누어 주셨고, 가장 앞선 이들을 위해서는 떡을 풍성히 준비하셨습니다”라고 덧붙입니다. 이 히브리어 증거는 그리스어보다 짧습니다.
    reason: textual_variant
lexical_decisions:
- source_word: ויוסף
  english_pob_choice: and he added
  chosen_korean: 더해 주시고
  alternatives_korean:
  - 더하시고
  - 추가하시고
  lexicon: HALOT
  rationale: 히브리어 יסף의 ‘더하다/보태다’ 의미를 살리면서, 주어가 하나님임을 한국어에서 자연스럽게 드러내는 형태로 옮겼습니다.
- source_word: כבודו
  english_pob_choice: honor
  chosen_korean: 영광
  alternatives_korean:
  - 존귀
  - 명예
  lexicon: HALOT
  rationale: 아론의 제의적 높임과 지위를 고려해 ‘영광’이 한국어 성서 문맥에서 더 넓고 강한 존엄의 뉘앙스를 전달합니다.
- source_word: נחלתו
  english_pob_choice: his inheritance
  chosen_korean: 그의 몫
  alternatives_korean:
  - 그의 유업
  - 그의 상속분
  - 그의 기업
  lexicon: HALOT
  rationale: 여기서는 토지 상속보다 아론에게 주어진 제의적 배분이 핵심이므로, 문맥에 맞는 분배·할당의 의미를 살려 ‘몫’으로 옮겼습니다.
- source_word: κληρονομίαν
  english_pob_choice: inheritance
  chosen_korean: 몫
  alternatives_korean:
  - 유업
  - 기업
  lexicon: BDAG
  rationale: 그리스어 병행구도 상속/분배의 뜻을 확인해 주므로, 한국어에서는 독자가 곧바로 이해할 수 있는 ‘몫’으로 처리하되 유산적 함의는 유지했습니다.
theological_decisions:
- issue: 아론의 ‘inheritance’의 성격
  chosen_reading: 제의적으로 주어진 몫
  alternative_readings:
  - 토지적 상속
  - 일반적 재산 상속
  rationale: 문맥상 아론에게 주어지는 것은 재산 상속이 아니라 하나님이 정하신 제사장 몫이므로, 지나친 물질적 의미로 좁히지 않도록 했습니다.
  doctrine_reference: 제사장직과 분깃의 언어(민 18장 배경)
