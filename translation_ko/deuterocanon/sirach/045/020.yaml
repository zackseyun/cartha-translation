    rationale: ‘맏배의 처음 난 것들’과 ‘가장 앞선 이들’은 현대 한국어로 어색합니다. 병행 그리스어의 ‘맏것들의 첫 열매’ 및 ‘먼저 그들을 위하여’라는 표현을 보다 명료하게 제시할 수 있습니다.
  revised_text: 그는 아론에게 존귀를 더하시고, 그에게 그의 유업을 주셨습니다.[a]
