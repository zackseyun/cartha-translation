base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/045/026.yaml
  text: And now[a], please bless Yahweh[b], the good one.
  footnotes:
  - marker: a
    text: 'Hebrew: ''And now, please bless the Lord, who is good.'' The Greek witness here instead reads substantially differently: ''May he give you wisdom in your heart, to judge his people in righteousness, so that their good things may not vanish, and their glory through their generations.'''
    reason: textual_variant
  - marker: b
    text: Hebrew has the divine name YHWH; the project's standard rendering is 'the LORD.'
    reason: alternative_reading
translation:
  language: ko
  text: 이제, 부디 선하신 야훼를 송축하십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 “이제, 부디 선하신 야훼를 송축하십시오”라는 결론적 권면을 전합니다. 그러나 이 절의 그리스어 전승은 크게 달라, “그가 여러분의 마음에 지혜를 주시어 그의 백성을 의로 판단하게 하시고 …”라고 시작합니다.
    reason: textual_variant
  - marker: b
    text: 히브리어 본문은 하나님의 고유명사 YHWH를 사용합니다. 이 번역은 프로젝트 표준에 따라 이를 ‘야훼’로 옮겼습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְעַתָּה
  english_pob_choice: And now
  chosen_korean: 이제
  alternatives_korean:
  - 그리고 이제
  - 지금
  lexicon: HALOT
  rationale: 결론부를 여는 담화 표지로서 시간적 전환과 호소의 시작을 자연스럽게 드러내는 표준어 표현입니다.
- source_word: בָּרֲכוּ־נָא
  english_pob_choice: please bless
  chosen_korean: 찬양하십시오
  alternatives_korean:
  - 복을 빌어 주십시오
  - 축복하십시오
  - 찬양해 주십시오
  lexicon: HALOT
  rationale: 문맥상 공동체가 하나님을 ‘축복’한다기보다 찬미와 송축을 드리는 호소이므로, 한국어에서는 오해를 줄이기 위해 예배적 의미가 분명한 ‘찬양하십시오’를 택했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 주어진 프로젝트 표준에 따라 신적 고유명사는 ‘야훼’로 옮겨, 호칭이 아닌 이름이라는 점을 드러냈습니다.
- source_word: הַטּוֹב
  english_pob_choice: the good one / who is good
  chosen_korean: 좋은 분이신
  alternatives_korean:
  - 좋으신
  - 선하신
  - 좋은 이신
  lexicon: HALOT
  rationale: 관사 있는 형용사의 서술적·별칭적 용법을 살려, 야훼를 설명하는 분유적 표현으로 한국어에서는 ‘좋은 분이신’을 사용했습니다.
theological_decisions:
- issue: 히브리어 סוף구와 영어 POB의 ‘bless’ 처리
  chosen_reading: 히브리어의 ברכו־נא는 예배적 송축 요청으로 이해하여 한국어에서는 ‘찬양하십시오’로 옮겼습니다.
  alternative_readings:
  - 복을 빌어 주십시오
  - 축복하십시오
  - 축복해 주십시오
  rationale: 한국어에서 하나님께 사람이 ‘복을 빌어 드린다’는 표현은 어색하므로, 본문의 의도인 공적 송송(頌頌) 요청을 더 직접적으로 드러냈습니다.
  doctrine_reference: 시락 45:26의 결론적 예전 호소에 대한 문맥 해석
- issue: 히브리어와 그리스어 본문의 차이
  chosen_reading: 본문은 신뢰도 높은 히브리어 청원문을 따르고, 그리스어의 현저히 다른 축복문은 본문에 합치지 않았습니다.
  alternative_readings:
  - 그리스어를 본문으로 채택
  - 히브리어와 그리스어를 혼합
  rationale: 보존된 히브리어가 분명하므로 본문 우선 원칙을 따르되, 다른 전승과의 충돌을 억지로 조화시키지 않았습니다.
  doctrine_reference: 원문 우선과 투명한 본문 증거 제시 원칙
