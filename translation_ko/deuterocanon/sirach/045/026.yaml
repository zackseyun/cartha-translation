  terminology: YHWH는 프로젝트 표준에 따라 ‘야훼’로 유지합니다. 하나님을 향한 ברך는 한국어 성서·예배 문맥에서 ‘찬양’보다 ‘송축’이 더 근접한 대응어입니다.
