    reason: alternative_reading
translation:
  language: ko
  text: 그의 신실함과 겸손함으로, 그를 모든 육체 가운데서 택하셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 평행본문은 “그의 믿음과 온유함으로, 그를 거룩하게 하셨고, 모든 육체 가운데서 그를 택하셨습니다”라고 합니다. 히브리어 증언에는 그리스어에 있는 “그를 거룩하게 하셨고”가 명시적으로 없습니다. 또한 여기서 ‘신실함’ 대신 ‘믿음’으로 옮길 가능성도 그리스어가 뒷받침합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: באמונתו
  english_pob_choice: in his faithfulness
  chosen_korean: 그의 신실함으로
  alternatives_korean:
  - 그의 믿음으로
  - 그의 믿음 때문에
  lexicon: HALOT
  rationale: 히브리어 אֱמוּנָה는 문맥에 따라 ‘믿음’ 또는 ‘신실함/충실함’을 뜻합니다. 여기서는 모세의 성품을 칭찬하는 병렬 표현이므로 ‘신실함’이 의미를 더 정확히 드러냅니다.
- source_word: ובענותו
  english_pob_choice: and humility
  chosen_korean: 겸손함
  alternatives_korean:
  - 온유함
  - 낮아짐
  lexicon: HALOT
  rationale: עֲנָוָה는 ‘겸손’과 ‘온유’의 의미 영역을 모두 가리키지만, 현대 한국어에서 가장 자연스럽고 품격 있게 들리는 표현은 ‘겸손함’입니다.
- source_word: בחר
  english_pob_choice: he chose
  chosen_korean: 택하셨습니다
  alternatives_korean:
  - 선택하셨습니다
  - 고르셨습니다
  lexicon: HALOT
  rationale: בחר의 기본 뜻은 ‘선택하다/택하다’이며, 여기서는 하나님이 모세를 택하신 행위를 가리키므로 한국어 성경 문체에 맞는 ‘택하셨습니다’가 가장 적절합니다.
- source_word: מכל בשר
  english_pob_choice: from all flesh
  chosen_korean: 모든 육체 가운데서
  alternatives_korean:
  - 모든 사람 가운데서
  - 모든 인류 가운데서
  lexicon: HALOT
  rationale: 히브리어 직역을 살려 ‘육체’ 이미지를 유지했습니다. 이는 단순한 ‘사람들’보다 성경적 보편 범위를 더 직접적으로 보존합니다.
theological_decisions:
- issue: ‘faith’와 ‘faithfulness’ 사이의 긴장
  chosen_reading: 신실함
  alternative_readings:
  - 믿음
  rationale: 영어 POB가 히브리어 우선 판단으로 ‘faithfulness’를 채택한 점을 따라, 모세의 내적 신앙 행위보다 언약적 신뢰성과 충실성을 강조했습니다. 다만 ‘믿음’ 가능성은 원문의 의미 범위로 남겨 둡니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms table for אמונה / πίστις'
