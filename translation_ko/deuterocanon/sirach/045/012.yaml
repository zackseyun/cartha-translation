translation:
  language: ko
  text: 금관, 에봇, 터번, 그리고 거룩의 인장이 새겨진 이마패입니다. 영광의 위엄과 힘의 찬양이며, 눈이 즐거워하는 것과 아름다움의 완성입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '그리스어 평행본문: ‘명예의 자랑, 힘의 일, 눈이 원하는 장식들.’ 이 절은 히브리어 증거와 표현이 상당히 다르지만, 둘 다 대제사장 예복의 장엄함을 높여 말합니다.'
    reason: textual_variant
lexical_decisions:
- source_word: עטרת פז
  english_pob_choice: splendor of glory
  chosen_korean: 금관
  alternatives_korean:
  - 찬란한 면류관
  - 황금 면류관
  lexicon: HALOT
  rationale: 문맥상 대제사장 의복의 첫 항목인 관을 가리키므로, 시적 수식은 살리되 핵심 명사인 관을 분명히 드러내는 ‘금관’이 가장 자연스럽습니다.
- source_word: מצנפת
  english_pob_choice: —
  chosen_korean: 터번
  alternatives_korean:
  - 머리관
  - 두건
  lexicon: HALOT
  rationale: 대제사장 복식의 정식 명칭에 해당하므로, 관과 구별되는 머리쓰개를 나타내는 ‘터번’이 적절합니다.
- source_word: ציץ חרות חותם קדש
  english_pob_choice: delight of the eyes and perfection of beauty
  chosen_korean: 거룩의 인장이 새겨진 이마패
  alternatives_korean:
  - 거룩의 도장이 새겨진 패
  - 성별의 인장이 새겨진 관패
  lexicon: HALOT
  rationale: ציץ는 대제사장의 이마패를 뜻하므로 ‘이마패’로 옮기고, חרות חותם קדש는 새겨진 거룩의 인장이라는 뜻을 살려 직역에 가깝게 처리했습니다.
- source_word: הוד כבוד ותהלת עז
  english_pob_choice: splendor of glory and praise of strength
  chosen_korean: 영광의 위엄과 힘의 찬양
  alternatives_korean:
  - 장엄한 영광과 힘의 칭송
  - 위엄의 영광과 힘의 예찬
  lexicon: HALOT
  rationale: הוד와 כבוד의 중첩된 장엄함을 ‘영광의 위엄’으로, תהלה + עז는 ‘힘의 찬양’으로 옮겨 히브리어의 병렬적 시구를 유지했습니다.
- source_word: מחמד עין
  english_pob_choice: delight of the eyes
  chosen_korean: 눈이 즐거워하는 것
  alternatives_korean:
  - 눈의 기쁨
  - 눈에 즐거운 것
  lexicon: HALOT
  rationale: 관용구적 의미가 ‘보기 좋은, 눈을 즐겁게 하는 것’이므로, 시적이면서도 의미를 살리는 표현으로 옮겼습니다.
- source_word: ומכלל יופי
  english_pob_choice: and perfection of beauty
  chosen_korean: 아름다움의 완성
  alternatives_korean:
  - 아름다움의 완전함
  - 아름다움의 절정
  lexicon: HALOT
  rationale: מכלל은 완전함·충만함의 뉘앙스를 가지므로, 단순한 예쁨이 아니라 미의 절정적 충만을 드러내는 ‘아름다움의 완성’이 적절합니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 평행본문의 차이 처리
