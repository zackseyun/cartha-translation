  chosen_reading: 본문은 히브리어를 따라 번역하되, 그리스어가 보여 주는 찬미적 확장 의미는 본문 전체의 장엄한 어조로만 반영했습니다.
  alternative_readings:
  - 그리스어를 따라 '명예의 자랑, 힘의 일, 눈이 원하는 장식'으로 옮김
  rationale: 이 절은 히브리어와 그리스어가 어휘적으로 꽤 다르므로, 살아 있는 히브리어 증거를 मुख्य 본문으로 두고 차이는 과장 없이 보존하는 편이 투명합니다.
  doctrine_reference: 'PHILOSOPHY.md: 히브리어가 보존된 곳에서는 히브리어 본문 우선, 차이는 정직하게 드러냄'
