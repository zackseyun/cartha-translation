base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/045/023.yaml
  text: And Phinehas son of Eleazar inherited a third place in might[c][b][a], because he was zealous for the God of all and stood in the breach for his people.
  footnotes:
  - marker: a
    text: 'Greek: ''third in glory,'' where the Hebrew reads ''inherited a third place in might/valor.'' The Hebrew witness is followed here, with the Greek kept in view as a notable alternative nuance of honor.'
    reason: textual_variant
  - marker: b
    text: '''Stood in the breach'' is a Hebrew idiom for stepping in at a moment of communal danger, with intercessory or protective force.'
    reason: cultural_note
  - marker: c
    text: The Greek continues, 'and he made atonement for Israel,' an expansion not present in the extant Hebrew here.
    reason: textual_variant
translation:
  language: ko
  text: 그리고 엘르아살의 아들 비느하스는 용맹으로 세 번째 자리를 차지하였습니다[a]. 그는 모든 이의 하나님께 열심을 내었고, 자기 백성을 위하여 무너진 틈에 서 있었습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 ‘영광으로 셋째’라고 이어지며, 현존 히브리어는 ‘용맹으로 세 번째’를 말합니다. 본문은 히브리어 증거를 따르고, 그리스어의 영예 의미는 대안으로 보존합니다.
    reason: textual_variant
  - marker: b
    text: ‘무너진 틈에 서 있다’는 히브리어 관용구로, 공동체의 위험한 순간에 중보하거나 보호하는 행동을 뜻합니다.
    reason: cultural_note
lexical_decisions:
- source_word: נחל שלישי
  english_pob_choice: inherited a third place
  chosen_korean: 세 번째 자리를 차지하였습니다
  alternatives_korean:
  - 세 번째 몫을 얻었습니다
  - 세 번째 지위를 물려받았습니다
  - 세 번째 자리에 올랐습니다
  lexicon: HALOT
  rationale: 히브리어의 ‘נחל’은 단순한 소유보다 ‘받아 누리다/차지하다’에 가깝고, 여기서는 토지 상속보다 명예의 순위를 가리키므로 자연스럽게 ‘세 번째 자리’로 옮겼습니다.
- source_word: בגבורה
  english_pob_choice: in might
  chosen_korean: 용맹으로
  alternatives_korean:
  - 힘으로
  - 능력으로
  - 무용으로
  lexicon: HALOT
  rationale: 문맥상 개인의 물리적 힘보다 칭송되는 용기와 영웅적 강건함이 핵심이므로, 한국어에서는 ‘용맹으로’가 가장 직접적입니다.
- source_word: בקנאו
  english_pob_choice: because he was zealous
  chosen_korean: 그는 … 열심을 내었고
  alternatives_korean:
  - 그가 열심을 내었으므로
  - 그가 질투하여
  - 그가 열광하였기 때문에
  lexicon: HALOT
  rationale: 히브리어 תחביר는 결과의 근거를 밝히는 표현이어서 원문의 인과를 살리되, 한국어에서는 ‘열심을 내었다’로 옮겨 경건한 열정의 의미를 드러냈습니다.
- source_word: לאלוה כל
  english_pob_choice: for the God of all
  chosen_korean: 모든 이의 하나님께
  alternatives_korean:
  - 만물의 하나님께
  - 모든 것의 하나님께
  - 온 세상의 하나님께
  lexicon: HALOT
  rationale: 히브리어의 ‘모든 것의 하나님’은 보편적 주권을 드러내는 독특한 호칭이므로, 한국어에서는 인격적·포괄적 의미가 살아나는 ‘모든 이의 하나님’으로 옮겼습니다.
- source_word: ויעמוד בפרץ
  english_pob_choice: stood in the breach
  chosen_korean: 무너진 틈에 서 있었습니다
  alternatives_korean:
  - 틈에 서 있었습니다
  - 파괴의 틈을 막아 섰습니다
  - 무너진 틈을 막아 섰습니다
  lexicon: HALOT
  rationale: 이 표현은 공동체의 위험 앞에서 중재하거나 방어하는 관용구이므로, ‘틈’의 이미지를 유지하면서도 한국어로는 상황이 분명한 ‘무너진 틈에 서 있다’로 풀었습니다.
- source_word: עמו
  english_pob_choice: for his people
  chosen_korean: 자기 백성을 위하여
  alternatives_korean:
  - 그의 백성을 위하여
  - 백성을 위해
  - 자기 ժողովրդի를 위해
  lexicon: HALOT
  rationale: 대상은 이스라엘 공동체이며, 한국어 성경 문체에서는 소유격보다 ‘자기 백성’이 대표적이고 자연스러운 대응입니다.
theological_decisions:
- issue: 그리스어의 ‘영광’과 히브리어의 ‘용맹’ 중 어느 축을 본문에 둘 것인가
  chosen_reading: 본문은 히브리어의 ‘용맹/용맹스러움’과 명예의 순위를 따르되, 그리스어의 ‘영광’은 각주로 남겼습니다.
  alternative_readings:
  - ‘영광으로 세 번째’처럼 그리스어를 본문화하는 읽기
  - 히브리어와 그리스어의 의미를 절충해 ‘영예의 세 번째 자리’로 옮기는 읽기
  rationale: 현존 히브리어는 ‘용맹으로 세 번째’를 말하고, 그리스어는 ‘영광으로 셋째’라는 확장을 보이므로, 본문은 히브리어 증거를 따르면서도 의미 차이를 각주로 보존했습니다.
  doctrine_reference: 본문비평과 정경 간 증거 보존 원칙
- issue: ‘stood in the breach’의 신학적 의미를 어떻게 드러낼 것인가
  chosen_reading: 단순한 물리적 방어가 아니라 공동체를 대신해 위기에 개입하는 중보적·보호적 행위로 읽었습니다.
  alternative_readings:
  - 전투적 방어 행위로만 읽는 해석
  - 비유를 약화시켜 일반적 도움으로 읽는 해석
  rationale: 이 히브리 관용구는 민수기 25장의 사건을 배경으로 공동체 재앙 앞의 중보와 방어를 함께 담으므로, 그 의미를 축소하지 않았습니다.
  doctrine_reference: 중보와 공동체적 대속 개념
