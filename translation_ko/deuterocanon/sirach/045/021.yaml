base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/045/021.yaml
  text: He gave him the choicest holy bread[a]; they shall eat the food offerings of Yahweh. The bread of the Presence is his portion[c][b], a gift to him and to his offspring.
  footnotes:
  - marker: a
    text: Or, more formally, 'the first of the holy things he gave him as bread.' The Hebrew wording is compressed, and the Greek parallel broadens the sense to priestly sacrificial portions.
    reason: lexical_alternative
  - marker: b
    text: '''Food offerings'' renders the Hebrew term often translated ''offerings by fire.'''
    reason: lexical_alternative
  - marker: c
    text: '''Bread of the Presence'' is the sacred bread traditionally called ''showbread.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 그에게 가장 좋은 거룩한 빵을 주었습니다. 그들은 야훼의 화제물을 먹을 것입니다. 빵의 임재는 그의 몫이며, 그와 그의 후손에게 주시는 선물입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘거룩한 빵’은 히브리어의 압축된 표현을 풀어 옮긴 것으로, 문자적으로는 ‘거룩한 것의 첫것/으뜸’을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘화제물’은 문자적으로는 ‘불로 드리는 제물’입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘빵의 임재’는 전통적으로 ‘진설병’이라 부르는 성소의 빵을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ראשית קדש
  english_pob_choice: the choicest holy bread
  chosen_korean: 가장 좋은 거룩한 빵
  alternatives_korean:
  - 거룩한 것의 첫것
  - 거룩한 것 중 으뜸 되는 빵
  - 최상의 거룩한 제물
  lexicon: HALOT
  rationale: 히브리어의 ‘첫/으뜸’ 뉘앙스와 ‘거룩한 것’의 성격을 함께 살리되, 바로 뒤의 לחם과 이어지는 식용 문맥을 자연스럽게 드러내기 위해 ‘가장 좋은 거룩한 빵’으로 옮겼습니다.
- source_word: אשי יהוה
  english_pob_choice: the food offerings of Yahweh
  chosen_korean: 야훼의 화제물
  alternatives_korean:
  - 야훼께 드리는 불제물
  - 야훼의 불로 드리는 제물
  - 야훼의 제물
  lexicon: HALOT
  rationale: 표준 제의 용어인 אשֵׁי/אִשֵּׁי의 ‘불에 의해 드리는 제물’ 성격을 살려, 한국어에서는 전통적이고도 의미가 분명한 ‘화제물’을 택했습니다.
- source_word: לחם פנים
  english_pob_choice: the bread of the Presence
  chosen_korean: 빵의 임재
  alternatives_korean:
  - 진설병
  - 임재의 빵
  - 주 앞에 놓인 빵
  lexicon: HALOT
  rationale: 직역에 가까운 ‘bread of the Presence’를 따르되, 전통 교회 용어인 ‘진설병’은 의미가 가려질 수 있어 피했습니다. ‘임재’는 כאן의 성소적 의미를 드러내는 현대 한국어 대응입니다.
- source_word: חלקו
  english_pob_choice: is his portion
  chosen_korean: 그의 몫이며
  alternatives_korean:
  - 그의 분깃이며
  - 그의 몫입니다
  - 그에게 속한 몫이며
  lexicon: HALOT
  rationale: פּרiestly allotted share라는 의미를 자연스럽게 전달하기 위해 ‘몫’으로 옮겼고, 문맥상 소유·배당의 결과를 나타내는 현재형 서술로 정리했습니다.
- source_word: ומתנה לו ולזרעו
  english_pob_choice: a gift to him and to his offspring
  chosen_korean: 그와 그의 후손에게 주시는 선물입니다
  alternatives_korean:
  - 그와 그의 자손에게 주시는 선물입니다
  - 그와 그의 씨에게 주시는 선물입니다
  - 그에게와 그의 후손에게 주시는 선물입니다
  lexicon: HALOT
  rationale: מתנה의 ‘선물/증여’와 זרעו의 세대적 계승을 함께 반영하여 ‘후손’으로 옮겼습니다. 본문이 제사장 직분의 지속성을 말하므로 단수 자녀가 아니라 혈통 계승을 드러내는 표현이 적절합니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 원문이 하나님의 이름을 직접 사용하므로, 프로젝트 기본값에 따라 ‘야훼’로 옮겨 언약적 고유명을 보존했습니다.
  doctrine_reference: 'POB glossary: יהוה / YHWH → 야훼'
- issue: 제의적 빵과 제물의 병렬
  chosen_reading: 가장 좋은 거룩한 빵 / 야훼의 화제물 / 빵의 임재
  alternative_readings:
  - 진설병 / 불제물 / 진설된 빵
  rationale: 이 절은 아론과 그 후손의 제사장 몫을 설명하는 법적·제의적 진술이므로, 의미를 희석하지 않도록 전통 용어보다 원문 구조를 드러내는 표현을 택했습니다.
  doctrine_reference: 'translation philosophy: source-direct, avoid domestication'
