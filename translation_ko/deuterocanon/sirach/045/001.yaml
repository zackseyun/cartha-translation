base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/045/001.yaml
  text: Beloved by God and men was Moses[c][b][a], whose memory is for blessing.
  footnotes:
  - marker: a
    text: Or, more literally, 'his memory is for good.' The Greek parallel reads 'whose memorial is in blessings,' which supports the idiomatic sense 'whose memory is for blessing.'
    reason: lexical_alternative
  - marker: b
    text: The Greek parallel for this verse is longer, adding that God 'brought forth from him a man of mercy, finding favor in the eyes of all flesh' before naming Moses. Those words are not present in the supplied Hebrew witness.
    reason: textual_variant
  - marker: c
    text: Hebrew 'men'; Greek has a broader term meaning 'people' or 'human beings.'
    reason: alternative_reading
translation:
  language: ko
  text: 모세는 하나님과 사람들에게[c] 사랑받았고, 그에 대한 기억은 복되게 남습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어를 문자적으로 옮기면 ‘그의 기억은 좋음을 위하여’ 정도입니다. 이는 고인을 좋고 복되게 기억한다는 관용적 표현입니다. 그리스어 평행본문은 ‘그의 기념은 축복들 가운데 있다’라고 하여 이 이해를 뒷받침합니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어 평행본문은 이 절을 더 길게 전하며, 하나님께서 ‘자비의 사람’을 내셨고 그가 ‘모든 육체의 눈에 은총을 얻었다’는 말을 모세를 언급하기 전에 덧붙입니다. 이 말들은 여기 제시된 히브리어 본문에는 없습니다.
    reason: textual_variant
  - marker: c
    text: 히브리어는 문자적으로 ‘사람들’에 해당하는 복수 표현을 사용합니다. 그리스어는 더 넓게 ‘사람들’ 또는 ‘인류’를 뜻할 수 있는 표현을 씁니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אהוב
  english_pob_choice: Beloved
  chosen_korean: 사랑받던
  alternatives_korean:
