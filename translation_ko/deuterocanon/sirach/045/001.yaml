base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/045/001.yaml
  text: Beloved by God and men was Moses[c][b][a], whose memory is for blessing.
  footnotes:
  - marker: a
    text: Or, more literally, 'his memory is for good.' The Greek parallel reads 'whose memorial is in blessings,' which supports the idiomatic sense 'whose memory is for blessing.'
    reason: lexical_alternative
  - marker: b
    text: The Greek parallel for this verse is longer, adding that God 'brought forth from him a man of mercy, finding favor in the eyes of all flesh' before naming Moses. Those words are not present in the supplied Hebrew witness.
    reason: textual_variant
  - marker: c
    text: Hebrew 'men'; Greek has a broader term meaning 'people' or 'human beings.'
    reason: alternative_reading
translation:
  language: ko
  text: 하나님과 사람들에게 사랑받던 모세는 그의 기억이 복이 됩니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그의 기억은 선을 위한다’에 가깝지만, 문맥상 ‘복되게 기억됨’이라는 관용적 뜻입니다. 그리스어 평행본문의 ‘축복들 가운데 있는 기념’이 이 이해를 뒷받침합니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어 평행본문은 이 절을 더 길게 전하며, ‘자비의 사람’과 ‘모든 육체의 눈에 은총을 얻는’ 내용이 덧붙습니다. 그러나 이 구절은 여기 제시된 히브리어 본문에는 없습니다.
    reason: textual_variant
  - marker: c
    text: 히브리어는 문자적으로 ‘사람들’에 해당하는 복수 표현을 사용합니다. 그리스어는 더 넓은 ‘인류/사람들’을 뜻하는 표현을 씁니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אהוב
  english_pob_choice: Beloved
  chosen_korean: 사랑받던
  alternatives_korean:
  - 사랑받은
  - 사랑스러운
  lexicon: HALOT
  rationale: 히브리어 אהוב의 수동적·형용사적 의미를 살려, 단순한 감정보다 존중의 뉘앙스가 있는 ‘사랑받던’으로 옮겼습니다.
- source_word: אלהים
  english_pob_choice: God
  chosen_korean: 하나님
  alternatives_korean:
  - 신
  - 하느님
  lexicon: HALOT
  rationale: 이 문맥의 אלהים은 이스라엘의 하나님을 가리키므로 한국어 성서 용례에 맞게 ‘하나님’으로 번역했습니다.
- source_word: ואנשים
  english_pob_choice: and men
  chosen_korean: 사람들에게
  alternatives_korean:
  - 사람들로부터
  - 남자들에게
  lexicon: HALOT
  rationale: 히브리어 복수형은 문자적으로 ‘사람들/남자들’이지만, 여기서는 수동 주어에 연결된 수용자 범위를 자연스럽게 드러내는 ‘사람들에게’가 가장 매끄럽습니다. 그리스어 평행본문의 ἀνθρώπων도 이 방향을 뒷받침합니다.
- source_word: זכרו לטובה
  english_pob_choice: whose memory is for blessing
  chosen_korean: 그의 기억이 복이 됩니다
  alternatives_korean:
  - 그의 기억이 복을 받습니다
  - 그의 기억이 복되게 남습니다
  - 그의 기념이 복이 됩니다
  lexicon: HALOT
  rationale: זכרו לטובה는 직역하면 ‘그의 기억이 선/좋음에 있다’는 뜻이지만, 관용적으로는 축복받는 기억을 가리킵니다. 그리스어의 μνημόσυνον ἐν εὐλογίαις도 이 의미를 확인해 줍니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 평행본문의 관계
  chosen_reading: 히브리어에 있는 핵심 진술만 본문에 반영하고, 그리스어가 확인해 주는 ‘복된 기억’의 관용 의미만 살렸습니다.
  alternative_readings:
  - 그리스어의 ‘자비의 사람’과 ‘모든 육체의 눈에 은총을 얻는’ 구절까지 본문에 포함하는 것
  - זכרו לטובה를 ‘그의 기억은 선을 위한다’처럼 더 직역하는 것
  rationale: 이 절의 주된 증거는 현존 히브리어 본문이므로, 없는 내용을 확장하지 않아야 합니다. 다만 그리스어 평행본문은 마지막 관용어의 뜻을 분명히 해 주므로 번역 의미 판단에 반영했습니다.
  doctrine_reference: 'Sirach 본문 번역 원칙: 히브리어가 보존된 곳에서는 히브리어를 본문으로 삼고, 그리스어는 해석 보조로 사용합니다.'
