translation:
  language: ko
  text: 하나님께서 그를 존귀하게 하셨고, 높은 곳에서 그를 강하게 하셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 더 자세히, ‘그를 거룩한 이들의 영광과 같이 되게 하셨고, 원수들의 두려움 가운데서 그를 크게 하셨다’고 읽습니다. 히브리어 증거는 ‘하나님께서 그를 존귀하게 하셨고, 높은 곳에서 그를 강하게 하셨다’고 읽습니다.
    reason: textual_variant
lexical_decisions:
- source_word: ויכבדהו
  english_pob_choice: honored him
  chosen_korean: 그를 높이셨고
  alternatives_korean:
  - 그를 존귀하게 하셨고
  - 그를 영화롭게 하셨고
  lexicon: HALOT
  rationale: כבד의 사역적 의미를 살려 ‘존귀하게 하다/영화롭게 하다’보다, 본문이 말하는 상승과 공적 인정의 뉘앙스를 담는 ‘높이셨다’로 옮겼습니다. ‘honored him’의 간결함도 유지합니다.
- source_word: ויאמצהו
  english_pob_choice: strengthened him
  chosen_korean: 그를 강하게 하셨습니다
  alternatives_korean:
  - 그를 굳세게 하셨습니다
  - 그를 힘 있게 하셨습니다
  - 그를 강화하셨습니다
  lexicon: HALOT
  rationale: אמץ의 사역형은 ‘강하게 하다, 굳세게 하다’의 의미이므로 자연스러운 현대 한국어로 ‘강하게 하셨습니다’를 택했습니다. ‘strengthened him’의 동작성을 직접 반영합니다.
- source_word: במרומים
  english_pob_choice: in the heights
  chosen_korean: 높은 곳에서
  alternatives_korean:
  - 높은 데에서
  - 높은 곳에
  - 하늘 높은 곳에서
  lexicon: HALOT
  rationale: מרומים은 문자적으로 ‘높은 곳들/높은 곳’이므로 공간적 고도를 살려 ‘높은 곳에서’로 옮겼습니다. 이렇게 하면 하늘의 영역인지, 높은 지위인지 단정하지 않고 여지를 남깁니다.
- source_word: אלהים
  english_pob_choice: God
  chosen_korean: 하나님
  alternatives_korean:
  - 하느님
  lexicon: 표준 개신교 용례
  rationale: 본문의 단수 신적 주어를 한국어 성서 표준 용례에 따라 ‘하나님’으로 옮겼습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행문의 차이 처리
  chosen_reading: 히브리어가 보존하는 본문을 따라 ‘그를 높이셨고, 높은 곳에서 그를 강하게 하셨습니다’로 본문을 세웠습니다.
  alternative_readings:
