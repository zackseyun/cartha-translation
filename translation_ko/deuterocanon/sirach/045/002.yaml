  rationale: 이 절은 히브리어와 그리스어가 상당히 다르므로, 살아 있는 히브리어 증거를 본문으로 두고 그리스어는 변이로 보존하는 것이 원문 근거에 가장 충실합니다.
  doctrine_reference: 'PHILOSOPHY.md: 살아 있는 히브리어 본문을 우선하되 주요 변이는 투명하게 기록'
