  source_fidelity: 본문은 현존 히브리어의 ‘그러므로/그에게도/규례/영원한 언약/성소를 유지하다’를 대체로 충실히 반영합니다. 다만 ‘성소를 보존하게 하셨습니다’는 보존 행위의 담당자를 그에게로 다소 강하게 귀속시킬 수 있으므로, 목적을 나타내는 표현으로 더 중립적으로 옮기는 것이 좋습니다.
