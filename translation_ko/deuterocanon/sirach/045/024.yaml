  text: Therefore he also established for him a statute[a], an everlasting covenant, to sustain the sanctuary.
  footnotes:
  - marker: a
    text: 'Greek parallel: ''Therefore a covenant of peace was established for him, as guardian of the holy things and for his people, so that the dignity of the priesthood might belong to him and to his offspring forever.'' The Hebrew witness here is shorter and focuses on a statute and everlasting covenant to sustain the sanctuary.'
    reason: alternative_reading
translation:
  language: ko
  text: 그러므로 그에게도 규례와 영원한 언약을 세워 주어 성소를 보존하게 하셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 병행본문은 ‘그러므로 그에게 평화의 언약이 세워졌고, 거룩한 것들의 보호자와 그의 백성을 위한 자가 되었으며, 그와 그의 씨에게 영원히 위대한 제사장직이 있게 하려 하였다’고 덧붙입니다. 히브리어 증언은 더 짧아 성소를 보존하게 하는 규례와 영원한 언약에 초점을 둡니다.
    reason: source_note
lexical_decisions:
- source_word: לכן / Therefore
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 이 때문에
  - 그래서
  lexicon: HALOT
  rationale: 앞선 열심의 행위에 대한 결과를 분명히 드러내는 인과 접속사로, 문맥의 논리 연결을 자연스럽게 살립니다.
- source_word: גם לו / he also established for him
  english_pob_choice: he also established for him
  chosen_korean: 그에게도 ... 세워 주어
  alternatives_korean:
  - 그를 위해서도 ... 마련하여
  - 또 그에게 ... 정해 주어
  lexicon: HALOT
  rationale: ‘גם’의 추가·부여 뉘앙스를 살려 ‘그에게도’로 옮기고, הכין의 확정·설정 의미를 ‘세워 주다’로 풀어 한국어 문맥에서 법적·언약적 어감을 유지했습니다.
- source_word: חק / a statute
  english_pob_choice: a statute
  chosen_korean: 규례
  alternatives_korean:
  - 법도
  - 율례
  - 법령
  lexicon: HALOT
  rationale: חק은 고정된 규정·정한 몫의 의미를 가지므로, 교회적 관용어인 ‘율례’보다 보다 중립적이고 법규적인 ‘규례’를 택했습니다.
- source_word: ברית עולם / an everlasting covenant
  english_pob_choice: an everlasting covenant
  chosen_korean: 영원한 언약
  alternatives_korean:
  - 영구한 언약
  - 영속하는 언약
  lexicon: HALOT
  rationale: 표준적 언약 표현을 유지하되, עולם의 지속성을 자연스러운 한국어로 옮기기 위해 ‘영원한’으로 번역했습니다.
- source_word: לכלכל מקדש / to sustain the sanctuary
  english_pob_choice: to sustain the sanctuary
  chosen_korean: 성소를 보존하게
  alternatives_korean:
  - 성소를 유지하게
  - 성소를 떠받치게
  - 성소를 돌보게
  lexicon: HALOT
  rationale: לכלכל은 ‘지탱하다/유지하다/부양하다’의 범위를 가지므로, 제의적 공간을 단순히 소유하는 것이 아니라 지속적으로 유지·보존하는 뜻을 살렸습니다. ‘성소’는 מקדש의 성스러운 공간성을 넓게 반영합니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행본문의 차이
  chosen_reading: 본문은 현존 히브리어의 간결한 진술을 따르고, 그리스어가 덧붙이는 ‘평화의 언약’과 제사장직 확대는 본문에 넣지 않았습니다.
  alternative_readings:
  - ‘평화의 언약’과 ‘거룩한 것들의 보호자’ 및 ‘영원한 제사장직’
  rationale: 이 구절은 히브리어가 더 짧고 직접적인 반면, 그리스어는 신학적으로 중요한 확장을 제공합니다. POB 원칙에 따라 본문은 히브리어를 우선하고, 의미 차이는 주석으로만 처리하는 것이 타당합니다.
  doctrine_reference: 'PHILOSOPHY.md: Hebrew priority where extant; preserve source divergence honestly'
