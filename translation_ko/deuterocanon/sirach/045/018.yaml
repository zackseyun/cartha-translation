  text: Strangers grew angry with him[a], and in the wilderness they were jealous of him—men of Dathan and Abiram, and the company of Korah, in fury and wrath.
  footnotes:
  - marker: a
    text: 'The extant Hebrew witness is shorter: ''Strangers grew angry with him, and in the wilderness they were jealous of him.'' The Greek parallel explicitly identifies these as the men associated with Dathan, Abiram, and Korah.'
    reason: textual_variant
translation:
  language: ko
  text: 그는 백성에게 규례를 가르치고, 이스라엘 자손에게는 율례와 판결을 가르쳤습니다. 외인들이 그에게 분노했고, 광야에서 그를 시기했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 현존 히브리어 증인은 더 짧아서 ‘외인들이 그에게 분노했고, 광야에서 그를 시기했습니다’만 전합니다. 그리스어 평행문은 다단, 아비람, 고라와 연결된 반역자들을 명시합니다.
    reason: textual_variant
lexical_decisions:
- source_word: וילמד את עמו חק, ומשפט את בני ישראל
  english_pob_choice: He taught his people statutes, and judgments to the children of Israel
  chosen_korean: 그는 백성에게 규례를 가르치고, 이스라엘 자손에게는 율례와 판결을 가르쳤습니다
  alternatives_korean:
  - 그는 자기 백성에게 법을 가르치고, 이스라엘 자손에게 법도와 판결을 가르쳤습니다
  - 그는 백성에게 규례와 법도를, 이스라엘 자손에게는 판결을 가르쳤습니다
  lexicon: HALOT
  rationale: חק과 משפט는 율법적 가르침의 쌍으로, 규례와 판결을 사용해 두 항목의 병렬을 살리면서 한국어 성경에서 익숙한 법률-언약 어휘를 유지했습니다.
- source_word: עמו
  english_pob_choice: his people
  chosen_korean: 백성
  alternatives_korean:
  - 자기 백성
  - 그의 백성
  lexicon: HALOT
  rationale: 직역의 소유격을 살릴 수 있지만, 문맥상 지도자에게 속한 공동체를 자연스럽게 가리키므로 '백성'으로 간결하게 옮겼습니다.
- source_word: זרים
  english_pob_choice: strangers
  chosen_korean: 외인들
  alternatives_korean:
  - 낯선 이들
  - 이방인들
  lexicon: HALOT
  rationale: 여기서는 단순한 민족적 '외국인'보다 그에게 맞서 분노한 자들을 가리키므로, 한국어에서 상대적으로 중립적이면서도 배외성을 드러내는 '외인들'을 택했습니다.
- source_word: ויחרו בו
  english_pob_choice: grew angry with him
  chosen_korean: 그에게 분노했고
  alternatives_korean:
  - 그에게 화가 났고
  - 그를 향해 분노가 타올랐고
  lexicon: HALOT
  rationale: חרה ב는 상대를 향해 격한 분노가 일어나는 표현이라, 동적 이미지보다 직접적이고 문어적인 '분노했다'를 사용했습니다.
- source_word: ויקנאו בו
  english_pob_choice: were jealous of him
  chosen_korean: 그를 시기했습니다
  alternatives_korean:
  - 그에게 질투했습니다
  - 그를 질투했습니다
  lexicon: HALOT
  rationale: קנא는 문맥상 경쟁심과 적대적 시기를 뜻하므로, 한국어에서 관계의 긴장을 잘 드러내는 '시기하다'를 선택했습니다.
- source_word: במדבר
  english_pob_choice: in the wilderness
  chosen_korean: 광야에서
  alternatives_korean:
  - 들판에서
  - 사막에서
  lexicon: HALOT
  rationale: 출애굽 서사와 연관된 표준 지리 용어로 '광야'가 가장 정확합니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 평행문의 범위
  chosen_reading: 본문은 현존 히브리어의 두 절을 따라 번역하고, 그리스어가 제시하는 다단·아비람·고라의 명시는 본문에 넣지 않았습니다.
  alternative_readings:
  - 그리스어를 따라 '다단과 아비람과 고라의 무리'를 본문에 포함한다
  - 히브리어만 따라 짧게 번역한다
  rationale: 이 절의 현존 히브리어는 짧지만 분명한 두 절을 보존하므로, 한국어 본문은 이를 우선해 읽기 쉽게 옮기고, 그리스어의 확장은 별도 각주 없이 본문에 섞지 않아 본문 경계를 명확히 했습니다.
  doctrine_reference: 'PHILOSOPHY.md: 히브리어가 보존된 곳에서는 이를 우선하되, 이질적 전승은 혼합하지 않고 투명하게 반영한다.'
