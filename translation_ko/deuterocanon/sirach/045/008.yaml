base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/045/008.yaml
  text: He clothed him with perfect splendor[a], and adorned him with glory and strength, with trousers, tunics, and a robe[b]; and he encircled him with bells.
  footnotes:
  - marker: a
    text: The surviving Hebrew and Greek differ in the details of the priestly garments here. The Hebrew reads 'trousers, tunics, and a robe ... bells,' while the Greek witness has a different sequence and includes the ephod.
    reason: textual_variant
  - marker: b
    text: Or 'full ornament of beauty' for 'perfect splendor'; the Hebrew phrase is compact and exalted, and the Greek points in a similarly heightened direction.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 그에게 온전한 찬란함[b]을 입히시고, 영광과 힘으로 그를 단장하시며, 속바지와 긴옷들과 겉옷[a]을 입히시고, 방울을 그의 둘레에 두르셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 남아 있는 히브리어와 그리스어는 이 절의 제사장 의복 세부에서 서로 다릅니다. 히브리어는 ‘속바지, 긴옷들, 겉옷 … 방울’이라고 읽는 반면, 그리스어 본문은 배열이 다르고 에봇을 포함합니다.
    reason: textual_variant
  - marker: b
    text: ‘온전한 찬란함’은 달리 ‘아름다움의 온전한 장식’으로 옮길 수도 있습니다. 히브리어 표현은 간결하면서도 고양되어 있으며, 그리스어도 이와 비슷하게 강조된 표현을 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וילבישהו
  english_pob_choice: He clothed him
  chosen_korean: 그에게 입히고
  alternatives_korean:
