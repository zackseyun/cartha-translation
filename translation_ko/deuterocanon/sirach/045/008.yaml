  lexicon: HALOT
  rationale: 히필형 לבש의 기본 의미는 ‘입히다’이므로, 제의적 의미를 살리면서도 현대 한국어에서 자연스럽게 처리했습니다.
- source_word: כליל תפארת
  english_pob_choice: perfect splendor
  chosen_korean: 완전한 화려함
  alternatives_korean:
  - 완전한 영광
  - 온전한 찬란함
  - 아름다움의 완전한 장식
  lexicon: HALOT
  rationale: כליל의 ‘완전함/온전함’과 תפארת의 ‘화려함/찬란함/영광’의 결합을 살려, 응축된 수식어의 높임과 제의적 장엄함을 함께 반영했습니다.
- source_word: בכבוד ועוז
  english_pob_choice: with glory and strength
  chosen_korean: 영광과 힘으로
  alternatives_korean:
  - 영광과 능력으로
  - 존귀와 능력으로
  - 영예와 권세로
  lexicon: HALOT
  rationale: כבוד과 עוז의 대응을 직역에 가깝게 옮기되, 한국어 문맥에서 자연스럽게 ‘~으로’의 수단/양태로 처리했습니다.
- source_word: מכנסים כתנות ומעיל
  english_pob_choice: with trousers, tunics, and a robe
  chosen_korean: 바지와 속옷, 그리고 겉옷으로
  alternatives_korean:
  - 바지와 튜닉과 겉옷으로
  - 속바지와 속옷과 겉옷으로
  - 바지와 긴옷과 겉옷으로
  lexicon: HALOT
  rationale: מכנסים, כתנות, מעיל의 제의복 목록을 현대 독자가 이해할 수 있도록 풀어 옮겼습니다. 다만 전통 교회어로 고정하지 않고, 각 의복의 기능적 차이를 드러내는 표현을 택했습니다.
- source_word: פעמונים
  english_pob_choice: bells
  chosen_korean: 방울
  alternatives_korean:
  - 종
  - 작은 방울
  lexicon: HALOT
  rationale: 제사장 예복에 달린 작은 종을 가리키는 말이므로, 일반적인 ‘종’보다 ‘방울’이 더 구체적이고 자연스럽습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행본 사이의 의복 목록 차이
  chosen_reading: 히브리어 본문의 목록을 본문으로 따르되, 방울을 두르는 장면만 반영했습니다.
  alternative_readings:
  - 그리스어 본문을 따라 에봇과 다른 순서의 제의복 목록으로 옮김
  - 두 본문 차이를 본문 안에 모두 병기함
  rationale: 시락의 이 절은 현전 히브리어와 그리스어가 세부에서 다르므로, 살아 있는 히브리어를 본문 기준으로 삼고 그 차이는 주석적 처리로 남기는 것이 공정합니다.
  doctrine_reference: '시락서 번역 원칙: 히브리어 우선, 그리스어 병행본은 대조 증거로 사용'
