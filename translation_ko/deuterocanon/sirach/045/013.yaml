translation:
  language: ko
  text: 그 앞에는 그런 옷이 없었습니다. 외국인은 결코 그것을 입지 못할 것입니다. 오직 그의 아들들과 그 후손들만이 그러합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 후반부는 난해하므로, 병행하는 헬라어가 보여 주는 ‘외국인 배제’와 ‘아론의 아들들과 후손에게만 허락됨’의 뜻을 본문에 반영했습니다.
    reason: source_note
lexical_decisions:
- source_word: לפניו / πρὸ αὐτοῦ
  english_pob_choice: Before him
  chosen_korean: 그 앞에는
  alternatives_korean:
  - 그 이전에는
  - 그보다 앞서는 때에는
  lexicon: HALOT / LXX parallel
  rationale: 시간적 선행을 나타내는 표현으로 이해하여, 한국어에서는 문맥에 자연스러운 ‘그 앞에는’으로 옮겼습니다.
- source_word: לא היה כן / τοιαῦτα
  english_pob_choice: there had not been such
  chosen_korean: 그런 옷이 없었습니다
  alternatives_korean:
  - 그와 같은 것은 없었습니다
  - 그런 것은 전에 없었습니다
  lexicon: HALOT / LXX parallel
  rationale: 문맥상 대제사장 의복을 가리키므로, 암시된 대상을 한국어에서 분명히 하되 과도하게 풀지 않고 ‘그런 옷’으로 처리했습니다.
- source_word: זר / ἀλλογενής
  english_pob_choice: foreigner
  chosen_korean: 외국인
  alternatives_korean:
  - 이방인
  - 타인
  - 외부 사람
  lexicon: HALOT / BDAG
  rationale: 허가된 제사장 계통 밖의 사람을 가리키는 배타적 표현으로, 한국어에서는 가장 직설적인 ‘외국인’이 문맥의 제한성을 잘 드러냅니다.
- source_word: לבניו ... בניו לדורותם / τὰ ἔκγονα αὐτοῦ διὰ παντός
  english_pob_choice: his descendants throughout their generations
  chosen_korean: 그 후손들만이 그러합니다
  alternatives_korean:
  - 그 후손들도 대대로 그러합니다
  - 그 자손들이 영원토록 그러합니다
  lexicon: HALOT / BDAG
  rationale: 히브리어와 헬라어 모두 아론 계열의 세습적 지속을 가리키므로, 한국어에서는 간결하게 ‘그 후손들만이 그러합니다’로 옮겨 제한성과 지속성을 함께 살렸습니다.
theological_decisions:
- issue: 아론 계열의 제의적 배타성
  chosen_reading: 이 구절은 이 옷이 오직 아론의 아들들과 그 후손들에게만 속하며, 외부인은 이를 입지 못한다고 말합니다.
  alternative_readings:
  - 어려운 히브리어만 따라가면 ‘그가 그와 그의 아들들에게 그렇게 맡기셨다/확인하셨다’는 뜻으로도 읽힐 수 있습니다.
  rationale: 히브리어 본문이 압축적이지만, 병행하는 헬라어가 외부인 배제와 혈통적 계승을 분명히 하므로 그 의미를 본문 이해의 핵심으로 반영했습니다.
  doctrine_reference: 원문 우선 및 어려운 본문은 병행본문으로 해석 보완
