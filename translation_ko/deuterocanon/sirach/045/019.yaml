  naturalness: 초안은 ‘…무리를, 그들의 … 안에서—야훼께서’라는 조사 연결과 대시 때문에 문장 구조가 무너집니다. 현대 표준 한국어 합쇼체에서는 시간절로 연결하고 ‘보시고 격분하셔서’로 이어야 자연스럽습니다. ‘불타는 진노’는 בחרון אפו의 관용적 강도를 자연스럽게 전달합니다.
