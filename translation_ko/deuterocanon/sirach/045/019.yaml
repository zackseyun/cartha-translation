base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/045/019.yaml
  text: The men of Dathan and Abiram[a], and the company of Korah in the strength of their anger— Yahweh saw and was enraged[b], and he consumed them in the heat of his anger.
  footnotes:
  - marker: a
    text: 'Greek parallel expands the judgment: ''they were brought to an end in wrath; he did wonders for them, to consume them in the fire of his flame.'' The Hebrew witness is shorter here.'
    reason: alternative_reading
  - marker: b
    text: Or 'in the fierceness of their anger.' The Hebrew phrase is compressed and may describe the rebels' violent rage.
    reason: lexical_alternative
translation:
  language: ko
  text: 다단과 아비람의 사람들과 고라의 무리가 맹렬히 분노하였을 때[a], 야훼께서 보시고 격분하셔서 불타는 진노로 그들을 소멸하셨습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 구는 압축되어 있어 ‘그들의 분노의 힘으로’, ‘그들의 격렬한 분노 가운데’ 등으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어 병행본은 심판을 더 확장하여, “그들은 진노 가운데 멸망하였고, 그가 그들에게 표징들을 행하셔서 자기 불꽃의 불로 그들을 소멸하셨다”라고 합니다. 여기의 히브리어 증거는 더 짧습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אנשי
  english_pob_choice: The men of
  chosen_korean: 다단과 아비람의 사람들
  alternatives_korean:
  - 다단과 아비람의 자들
  - 다단과 아비람의 무리
  lexicon: HALOT
  rationale: 히브리어 אנשי의 문자적 집단표현을 살리되, 한국어에서는 자연스럽게 ‘사람들’로 옮겨 구체적 반란 집단을 드러냈습니다.
- source_word: ועדת קרח
  english_pob_choice: and the company of Korah
  chosen_korean: 고라의 무리
  alternatives_korean:
  - 고라의 회중
  - 고라의 모임
  lexicon: HALOT
  rationale: עדה는 ‘회중/무리/집단’ 범위를 가지며, 여기서는 반역 집단의 뉘앙스를 살리는 ‘무리’가 가장 직접적입니다.
- source_word: בעזוז אפם
  english_pob_choice: in the strength of their anger
  chosen_korean: 그들의 분노의 힘 안에서
  alternatives_korean:
  - 그들의 격렬한 분노 가운데
  - 그들의 맹렬한 분노 속에서
  lexicon: HALOT
  rationale: עזוז의 ‘힘, 강함’과 אף의 ‘분노’를 함께 보존해, ‘분노의 힘’이라는 압축된 히브리어 표현을 한국어에서도 가깝게 유지했습니다.
- source_word: וירא יהוה
  english_pob_choice: Yahweh saw
  chosen_korean: 야훼께서 보시고
  alternatives_korean:
  - 야훼께서 보셨고
  - 주님께서 보시고
  lexicon: HALOT
  rationale: 본문의 יהוה는 프로젝트 기본값에 따라 ‘야훼’로 옮겼고, 동사는 서술 흐름상 ‘보시고’로 자연스럽게 연결했습니다.
- source_word: ויתאנף
  english_pob_choice: was enraged
  chosen_korean: 격분하셨으며
  alternatives_korean:
  - 노여워하셨으며
  - 분노하셨으며
  lexicon: HALOT
  rationale: 히트파엘의 강한 분노를 ‘격분하다’로 옮겨 단순한 감정 변화보다 강한 격앙을 드러냈습니다.
- source_word: ויכלם
  english_pob_choice: and he consumed them
  chosen_korean: 그들을 소멸하셨습니다
  alternatives_korean:
  - 그들을 멸하셨습니다
  - 그들을 없애셨습니다
  lexicon: HALOT
  rationale: 히브리어는 문맥상 징벌적 파괴를 가리키며, 그리스어 병행본의 불로 태워 끝내는 이미지도 이를 뒷받침하므로 ‘소멸하다’가 가장 적절합니다.
- source_word: בחרון אפו
  english_pob_choice: in the heat of his anger
  chosen_korean: 그의 진노의 열기 속에서
  alternatives_korean:
  - 그의 분노의 열기 속에서
  - 그의 타오르는 진노 속에서
  lexicon: HALOT
  rationale: 관용구의 불타는 분노 이미지를 살리면서도, ‘열기’로 히브리어적 비유를 과도하게 해설하지 않게 유지했습니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본 절은 사신명 יהוה를 직접 사용하므로, 프로젝트 기본값에 따라 학술적 음역인 ‘야훼’를 유지해 언약 이름을 가립니다.
  doctrine_reference: 'POB contested terms: YHWH / יהוה'
- issue: 히브리어 본문 우선, 그리스어 병행본 보조
  chosen_reading: 히브리어의 짧은 징벌 진술을 본문으로 두고, 그리스어의 확장된 불 심판 이미지는 소멸 의미를 지지하는 보조 근거로만 반영
  alternative_readings:
  - 그리스어의 '기이한 일들을 행하여 불로 태움'까지 본문에 포함
  - 그리스어를 따라 더 विस्त하게 옮김
  rationale: 사이락은 살아 있는 히브리어 증거를 우선하되 그리스어가 난해한 동사를 해석하는 데 도움을 주므로, 본문에는 히브리어가 가진 간결성을 유지했습니다.
  doctrine_reference: 'Project philosophy: translate from Hebrew where extant; use Greek parallel as audit support'
