base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/045/025.yaml
  text: 'And his covenant was with David son of Jesse, from the tribe of Judah: the inheritance of the king is from son to son alone, but the inheritance of Aaron is also for his offspring[a].'
  footnotes:
  - marker: a
    text: 'The Hebrew witness for this verse is shorter and appears compressed; the Greek parallel preserves the fuller contrast: the royal inheritance belongs to a single dynastic line, while Aaron''s inheritance belongs to his offspring.'
    reason: textual_variant
translation:
  language: ko
  text: 그에게와 그의 후손에게는 영원한 대제사장직이 있을 것입니다. 또 그의 언약은 유다 지파 이새의 아들 다윗과 맺어졌습니다. 왕의 유업은 오직 아들에게서 아들에게로 이어지지만, 아론의 유업은 그의 후손에게도 돌아갑니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 절의 히브리어 증인은 더 짧고 압축되어 보입니다. 그리스어 평행문은 왕의 유업은 하나의 왕조 계통으로 이어지고, 아론의 유업은 그의 후손에게 속한다는 더 완전한 대조를 보존합니다.
    reason: textual_variant
lexical_decisions:
- source_word: וגם בריתו עם דוד, בן ישי למטה יהודה
  english_pob_choice: And his covenant was with David son of Jesse, from the tribe of Judah
  chosen_korean: 그리고 그분의 언약은 다윗, 곧 이새의 아들, 유다 지파에게 있었습니다
  alternatives_korean:
  - 그리고 그분의 언약은 다윗과 맺어졌습니다
  - 그분의 언약은 다윗, 이새의 아들, 유다 지파에 있었습니다
  lexicon: HALOT
  rationale: 히브리어의 ובריתו/עם דוד 구조를 자연스럽게 살려 ‘언약은 … 있었습니다’로 옮기고, בן ישי와 למטה יהודה는 다윗의 혈통과 지파를 분명히 하도록 동격으로 처리했습니다.
- source_word: כהונה גדולה
  english_pob_choice: a high priesthood forever
  chosen_korean: 영원한 대제사장직
  alternatives_korean:
  - 영원한 대제사직
  - 영원히 계속되는 대제사장직
  lexicon: HALOT
  rationale: כהונה גדולה는 직무 자체를 가리키므로 ‘대제사장직’이 가장 직접적이며, ‘영원한’으로 על עולם의 지속성을 압축해 표현했습니다.
- source_word: לו ולזרעו
  english_pob_choice: for his offspring
  chosen_korean: 그분에게와 그의 후손에게
  alternatives_korean:
  - 그에게와 그의 씨에게
  - 그분과 그 후손에게
  lexicon: HALOT
  rationale: 전치사 ל + 대명사와 לזרעו의 병렬을 살려 수혜 범위를 ‘그분에게와 그의 후손에게’로 풀었고, 혈통적 계승을 분명히 했습니다.
theological_decisions:
- issue: 부재한 그리스어 평행문의 왕권/아론 계승 구문을 본문에 추가할지 여부
  chosen_reading: 제시된 히브리어 본문만을 번역해, 다윗 언약과 레위 제사직의 서술만 담았습니다.
  alternative_readings:
  - 그리스어를 따라 왕의 유업과 아론의 유업 대비를 본문에 포함한다
  - 히브리어를 따라 짧은 문장으로만 옮기고 후반 대비 구문은 각주로 처리한다
  rationale: 주어진 히브리어 텍스트에는 다윗 언약과 영원한 대제사장직만 명시되어 있으므로, 확인되지 않은 왕권/아론 대비를 본문에 확장하지 않았습니다.
  doctrine_reference: 'PHILOSOPHY.md: Sirach는 보존된 히브리어를 우선 번역하되, 실제로 존재하는 경우에만 평행 본문을 보조 증거로 사용한다.'
