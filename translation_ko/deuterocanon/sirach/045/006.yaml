base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/045/006.yaml
  text: He exalted Aaron[a], a holy one like himself, from the tribe of Levi[b], and made him an everlasting statute.
  footnotes:
  - marker: a
    text: Greek parallel explicitly reads 'a holy one like himself, his brother, from the tribe of Levi.' The Hebrew line as cited is shorter; 'like himself' is retained in the main text because the Greek is a required translation input and coheres with the sense of Aaron's exalted holiness.
    reason: alternative_reading
  - marker: b
    text: Or 'a perpetual statute' or 'a lasting ordinance.' The Hebrew idiom likely refers to Aaron's enduring legal-priestly appointment.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 레위 지파 출신인 아론을 자기와 같은 거룩한 이로 높이셨으며, 그를 영원한 규례로 삼으셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 병행 본문은 “자기와 같은 거룩한 이, 곧 레위 지파 출신인 그의 형제”라고 더 길게 읽습니다. 제시된 히브리어 줄은 더 짧지만, 본문에서는 병행 증거를 반영하여 “자기와 같은”이라는 비교 표현을 유지했습니다.
    reason: alternative_reading
  - marker: b
    text: “영원한 규례”는 직역상 다소 압축적인 표현입니다. 문맥상 아론에 대한 지속적인 법적·제의적 지정을 가리키지만, 본문에 없는 “제사직”이라는 말을 덧붙이지 않았습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וירם / ὕψωσεν
  english_pob_choice: He exalted
  chosen_korean: 높이셨으며
  alternatives_korean:
  - 들어 올리셨으며
  - 높여 주셨으며
  lexicon: HALOT; BDAG
  rationale: רום의 사역형과 그리스어 ὕψωσεν의 대응을 살려, 단순한 이동보다 지위와 존귀의 상승을 나타내는 '높이셨다'로 옮겼습니다.
- source_word: קדוש / ἅγιον
  english_pob_choice: a holy one
  chosen_korean: 거룩한 사람
  alternatives_korean:
  - 거룩한 이
  - 성도
  lexicon: HALOT; BDAG
  rationale: 아론을 지칭하는 앱포지션으로서 정체성을 설명하되, 관사 없는 단수 표현의 느낌을 살려 '거룩한 사람'으로 옮겼습니다.
- source_word: למטה לוי / ἐκ φυλῆς Λευεί
  english_pob_choice: from the tribe of Levi
  chosen_korean: 레위 지파에서
  alternatives_korean:
  - 레위의 지파에서
  - 레위 집안에서
  lexicon: HALOT; BDAG
  rationale: מַטֶּה의 족속·지파 의미를 반영하여 가장 자연스러운 표준어 표현인 '레위 지파에서'를 택했습니다.
- source_word: וישימהו / לחק עולם
  english_pob_choice: and made him an everlasting statute
  chosen_korean: 그를 영원한 규례로 삼으셨습니다
  alternatives_korean:
  - 그를 영원한 규례로 정하셨습니다
  - 그를 영원한 법도로 세우셨습니다
  lexicon: HALOT
  rationale: שׂים의 구성적 용법을 살려, 아론을 어떤 직분의 대상/제도로 '삼다'는 뜻을 드러내면서도 '규례'로 법적·언약적 성격을 보존했습니다.
theological_decisions:
- issue: 히브리어 본문에 없는 비교구 '자기와 같은'의 반영
  chosen_reading: 그리스어 병행 본문의 ὅμοιον αὐτῷ를 따라 '자기와 같은'을 본문에 반영했습니다.
  alternative_readings:
  - 이를 생략하고 히브리어의 더 짧은 본문만 따름
  - 각주로만 처리함
  rationale: 제시된 영어 POB가 그리스어 병행을 필수 번역 입력으로 삼아 'like himself'를 본문에 유지하므로, 한국어도 이를 본문에 포함해 아론의 존귀한 대응 관계를 드러냈습니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: לחק עולם의 제도적 함의
  chosen_reading: '''영원한 규례''로 옮겨, 아론에 대한 지속적 법적·제의적 지정의 의미를 보존했습니다.'
  alternative_readings:
  - 영원한 제도로 번역
  - 영원한 제사직으로 구체화
  rationale: 본문은 제사직을 명시하지 않으므로, 의미를 과도하게 확장하지 않고 '규례'라는 법적 언어를 유지했습니다.
  doctrine_reference: Translation philosophy §1, §3
