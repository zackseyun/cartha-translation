translation:
  language: ko
  text: 거룩한 옷들, 곧 금과 청색과 자색으로 만든 무늬 있는 솜씨의 옷들, 판결의 흉패와 에봇과 띠, 주홍 실[a], 곧 직조공이 만든 것들입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘주홍 실’은 히브리어 ושני תולעת를 옮긴 것입니다. ‘진홍 실’ 또는 ‘홍색 실’로도 옮길 수 있으며, 정확한 색조는 확정하기 어렵습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בגדי קודש
  english_pob_choice: holy garments
  chosen_korean: 거룩한 옷들
  alternatives_korean:
  - 성스러운 옷들
  - 거룩한 제의복
  lexicon: HALOT
  rationale: 제의적 의미를 살리면서도 현대 한국어로 자연스럽게 옮기기 위해 ‘거룩한 옷들’로 렌더링했습니다.
- source_word: זהב תכלת, וארגמן
  english_pob_choice: of gold, blue, and purple
  chosen_korean: 금과 푸른색과 자색으로 된
  alternatives_korean:
  - 금과 청색과 자색의
  - 금과 하늘빛과 자색의
  lexicon: HALOT
  rationale: 재료와 색채의 나열을 한국어에서 자연스럽게 풀어, 성막/제의 직물의 고급 재료 목록이라는 점을 보존했습니다.
- source_word: מעשה חשב
  english_pob_choice: the work of a designer
  chosen_korean: 정교하게 짠 작품
  alternatives_korean:
  - 설계자의 작품
  - 무늬를 넣어 짠 작품
  - 장인의 작품
  lexicon: HALOT
  rationale: 이 표현은 단순한 ‘디자인’보다 무늬가 들어간 정교한 직조를 가리키므로, POB의 의도를 살리되 한국어에서 더 직접적인 직물 표현을 택했습니다.
- source_word: חשן משפט
  english_pob_choice: a breastpiece of judgment
  chosen_korean: 판결의 흉패
  alternatives_korean:
  - 심판의 흉패
  - 판단의 흉패
  - 판결 흉패
  lexicon: HALOT
  rationale: 출애굽기 제사장 용어의 관용적 표현을 유지하되, ‘판결’로 משפט의 판단/결정 기능을 드러냈습니다.
- source_word: ושני תולעת
  english_pob_choice: scarlet yarn
  chosen_korean: 주홍 실
  alternatives_korean:
  - 홍색 실
  - स्कार렛 실
  - 진홍 실
  lexicon: HALOT
  rationale: POB의 ‘scarlet yarn’을 한국어에서 가장 자연스럽고 직물 맥락에 맞게 ‘주홍 실’로 옮겼습니다.
- source_word: מעשה אורג
  english_pob_choice: the work of a weaver
  chosen_korean: 베 짠 사람의 작품
  alternatives_korean:
  - 직조공의 작품
  - 베 짜는 사람의 작품
  - 직조한 작품
  lexicon: HALOT
  rationale: 마지막 구절은 앞의 ‘정교하게 짠 작품’과 구별되는 직조 작업을 가리키므로, 직역에 가깝게 ‘베 짠 사람’으로 살렸습니다.
theological_decisions:
- issue: 제사장 복식의 기술적 용어 보존
  chosen_reading: ‘흉패’, ‘에봇’ 같은 고유한 제의 용어를 유지했습니다.
  alternative_readings:
  - 전부 풀어 ‘가슴받이’나 ‘제사장 조끼’로 옮김
  - 현대식 의복 명칭으로 환원
  rationale: 이 구절은 아론 계열 대제사장 복장을 열거하므로, 출애굽기 전승과 연결되는 기술적 용어를 보존하는 편이 본문 의미를 더 정확히 전달합니다.
  doctrine_reference: 'DOCTRINE.md: technical cultic terminology should be retained where no concise equivalent exists.'
