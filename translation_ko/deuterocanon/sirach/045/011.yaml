  - marker: b
    text: The Greek explicitly mentions a gold mounting ('in a setting of gold'), while the Hebrew here only implies mounted settings.
    reason: textual_variant
translation:
  language: ko
  text: 흉패 위에는 인장 새김처럼 새긴 귀한 보석들이 물림[b]에 끼워져 있으며, 모든 보석에는 이스라엘 아들들[a]의 수에 따라 글자를 새겨 기념을 삼았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 ‘이스라엘 아들들’이라고 읽지만, 칠십인역은 ‘이스라엘의 지파들’이라고 합니다.
    reason: alternative_reading
  - marker: b
    text: 칠십인역은 이 물림이 금으로 된 것이라고 더 분명히 언급하지만, 여기의 히브리어 본문은 금이라는 재질을 직접 말하지 않습니다.
    reason: textual_variant
lexical_decisions:
- source_word: אבני חפץ
  english_pob_choice: precious stones
  chosen_korean: 보석 같은 돌들
  alternatives_korean:
  - 귀한 돌들
  - 귀중한 돌들
  - 보석들
  lexicon: HALOT
  rationale: חפץ는 값지고 귀한 것을 가리키므로, 제사장 예복의 맥락에서 자연스럽고 과도하게 장식적이지 않은 ‘보석 같은 돌들’로 옮겼습니다.
- source_word: החשן
  english_pob_choice: the breastpiece
  chosen_korean: 흉패
  alternatives_korean:
  - 가슴받이
  - 가슴판
  lexicon: HALOT
  rationale: 제사장 의복 용어로는 ‘흉패’가 한국어 성경에서 가장 안정적이며, ‘breastpiece’의 기능을 정확히 드러냅니다.
- source_word: פתוחי חותם
  english_pob_choice: engraved like a seal
  chosen_korean: 마치 인장으로 새긴 듯이
  alternatives_korean:
  - 인장 새김처럼
  - 도장처럼 새겨진
  lexicon: HALOT
  rationale: 본문은 새김의 양식을 말하므로, 인장/도장 각인을 떠올리게 하는 표현으로 감각과 의미를 함께 살렸습니다.
- source_word: לזכרון
  english_pob_choice: as a memorial
  chosen_korean: 기념물이 됩니다
  alternatives_korean:
  - 기념으로
  - 기억의 표가 됩니다
  - 기념이 됩니다
  lexicon: HALOT
  rationale: 예전적 기억 표지의 기능을 살리되, 돌 자체가 기념 표지가 된다는 점을 분명히 하기 위해 ‘기념물이 됩니다’로 옮겼습니다.
theological_decisions:
- issue: 기념/기억의 제의적 기능
  chosen_reading: 돌들은 단순 장식이 아니라 이스라엘 지파를 대표하는 기억 표지로 제의적 의미를 가집니다.
  alternative_readings:
  - 단순히 정교한 장식 묘사로만 읽을 수 있습니다.
  rationale: זכרון과 μνημόσυνον 계열의 표현이 기억과 표상 기능을 분명히 하므로, 그 신학적 무게를 유지했습니다.
  doctrine_reference: 제의적 표상과 언약 기억의 보존
- issue: בני ישראל의 범위
  chosen_reading: 본문은 히브리어 본문을 따라 ‘이스라엘 아들들’로 두되, 지파 명칭을 가리키는 표상으로 이해합니다.
  alternative_readings:
  - 칠십인역처럼 ‘이스라엘의 지파들’로 풀 수 있습니다.
  rationale: 히브리어 증거의 문구를 본문에 유지하면서도, 실제 지시 대상이 지파 배열임을 해치지 않도록 의미를 보존했습니다.
  doctrine_reference: 원문 우선과 본문 변이의 보존
