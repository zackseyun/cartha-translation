base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/045/015.yaml
  text: Moses ordained him and anointed him with holy oil[a]. It became for him an everlasting covenant, and for his offspring[c][b], for as long as the heavens endure.
  footnotes:
  - marker: a
    text: Hebrew literally, 'filled his hand,' a priestly idiom for installing or ordaining someone to office; the Greek likewise reads 'filled the hands.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew literally, 'as the days of heaven'; this idiom expresses enduring duration.
    reason: lexical_alternative
  - marker: c
    text: 'The Greek parallel continues beyond the extant Hebrew here: ''to minister to him and to serve as priest, and to bless his people in his name.'' The main translation follows the surviving Hebrew as the primary witness.'
    reason: alternative_reading
translation:
  language: ko
  text: 모세는 그를 임직시키고 거룩한 기름을 그에게 부으셨습니다[a]. 이는 그와 그의 후손에게[c] 하늘이 있는 한 지속될 영원한 언약이 되었습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘그의 손을 채웠다’라고 되어 있으며, 제사장 직분에 세우는 제의적 관용구입니다. 그리스어도 ‘손들을 채웠다’라고 합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘하늘의 날들처럼’이라고 되어 있으며, 지속되는 시간을 뜻하는 관용구입니다.
    reason: lexical_alternative
  - marker: c
    text: 그리스어 병행문은 현존 히브리어 본문보다 더 이어져, ‘그를 섬기며 제사장으로 봉사하고, 그의 이름으로 그의 백성을 축복하도록’이라고 덧붙입니다. 본문은 현존 히브리어를 주된 본문으로 따릅니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וימלא משה את ידו / ἐπλήρωσεν Μωυσῆς τὰς χεῖρας
  english_pob_choice: ordained him
  chosen_korean: 그에게 손을 채워 주고
  alternatives_korean:
  - 그를 임직하셨습니다
  - 그를 설치하셨습니다
  - 그를 서품하셨습니다
  lexicon: HALOT
  rationale: 히브리어 관용구 ‘손을 채우다’와 그리스어 대응 표현을 살리기 위해 직역을 택하되, 한국어에서는 제의적 임직 의미가 드러나도록 자연스럽게 옮겼습니다.
- source_word: וימשחהו / ἔχρισεν αὐτόν
  english_pob_choice: anointed him
  chosen_korean: 그를 부으셨습니다
  alternatives_korean:
  - 그에게 기름을 부으셨습니다
  - 그를 기름부으셨습니다
  - 그를 성별하셨습니다
  lexicon: HALOT
  rationale: משח는 분명한 ‘기름 붓다’의 동사이므로, 제의 행위를 직접적으로 드러내는 표현을 사용했습니다.
- source_word: בשמן הקדש / ἐν ἐλαίῳ ἁγίῳ
  english_pob_choice: with holy oil
  chosen_korean: 거룩한 기름으로
  alternatives_korean:
  - 성스러운 기름으로
  - 거룩한 기름을 가지고
  - 거룩한 기름 안에서
  lexicon: HALOT
  rationale: 히브리어와 그리스어 모두 예식을 위한 거룩한 기름을 가리키므로, 한국어에서는 수단을 나타내는 ‘-으로’로 자연스럽게 옮겼습니다.
- source_word: ברית עולם / διαθήκην αἰώνιον
  english_pob_choice: an everlasting covenant
  chosen_korean: 영원한 언약
  alternatives_korean:
  - 영속하는 언약
  - 영구한 언약
  - 끝없는 언약
  lexicon: HALOT
  rationale: ‘ברית עולם’의 지속성을 한국어 성경에서 익숙하면서도 원뜻을 잘 전하는 ‘영원한 언약’으로 옮겼습니다.
- source_word: ולזרעו / καὶ ἐν τῷ σπέρματι αὐτοῦ
  english_pob_choice: and for his offspring
  chosen_korean: 그의 후손에게도
  alternatives_korean:
  - 그의 씨에게도
  - 그의 자손에게도
  - 그의 후예에게도
  lexicon: HALOT
  rationale: ‘זרע’의 집합적 의미를 현대 한국어에서 분명하게 전달하기 위해 ‘후손’을 택했습니다.
- source_word: כימי שמים / ἐν ἡμέραις οὐρανοῦ
  english_pob_choice: for as long as the heavens endure
  chosen_korean: 하늘의 날들 동안
  alternatives_korean:
  - 하늘의 날들처럼
  - 하늘이 있는 날들 동안
  - 하늘의 날만큼
  lexicon: HALOT
  rationale: 히브리어 관용구를 가능한 한 가깝게 유지해 우주적 지속성을 보이되, 한국어에서도 의미가 통하도록 간결하게 옮겼습니다.
theological_decisions:
- issue: ‘손을 채우다’ 관용구의 제의적 의미
  chosen_reading: 문자적 이미지를 완전히 지우지 않고, 임직/직분 부여의 제의적 의미가 드러나도록 ‘손을 채워 주다’로 옮겼습니다.
  alternative_readings:
  - 그를 임직하셨습니다
  - 그를 서품하셨습니다
  - 그를 설치하셨습니다
  rationale: 본문은 아론의 제사장 임직을 말하므로, 관용구의 배경을 드러내면서도 원문 이미지를 보존하는 번역이 필요합니다.
  doctrine_reference: 'DOCTRINE.md: 원문 이미지와 제의적 함의를 함께 보존하고, 본문이 말하지 않는 신학적 확장을 피합니다.'
- issue: ‘하늘의 날들’의 지속성 표현
  chosen_reading: 히브리어 관용구의 시적 표현을 살려 ‘하늘의 날들 동안’으로 두었습니다.
  alternative_readings:
  - 하늘이 지속되는 동안
  - 하늘이 있는 한
  - 영원히
  rationale: 영속성을 분명히 하되, 본문의 시적·우주적 비유를 평이한 추상어로 바꿔 버리지 않기 위해 원문에 가까운 표현을 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: 의미를 평탄화하지 말고, 독자가 감지해야 할 긴장과 이미지를 보존합니다.'
