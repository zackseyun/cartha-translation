  naturalness: ‘그의 말씀에 표징들이 속히 일어났고’는 다소 문어적이지만 원문의 표징이 신속히 발생했다는 표현을 보존하는 현대 한국어 합쇼체로 수용 가능합니다. ‘강하게 하셨습니다’와 ‘백성에 관하여 그에게 명령하시고’도 문맥상 자연스럽고 격식에 맞습니다.
