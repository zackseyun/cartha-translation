base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/045/003.yaml
  text: At his word the signs came quickly[a], and he strengthened him before a king. He commanded him concerning the people[c][b], and showed him his glory.
  footnotes:
  - marker: a
    text: Greek reads, 'By his words he stopped signs,' rather than 'the signs came quickly.'
    reason: textual_variant
  - marker: b
    text: Greek has 'he honored/glorified him before kings' instead of 'he strengthened him before a king.'
    reason: textual_variant
  - marker: c
    text: The Hebrew here is difficult; as transmitted it could suggest 'and they saw his glory,' but the Greek supports 'and showed him his glory,' which is followed in the main text.
    reason: textual_variant
translation:
  language: ko
  text: 그의 말씀에 표징들이 속히 일어났고,[a] 그가 왕 앞에서 그를 강하게 하셨습니다.[b] 그가 자기 백성에 관하여 그에게 명령하시고, 그에게 자기 영광을 보여 주셨습니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 “그의 말씀으로 표징들을 그치게 하셨다”로 읽습니다.
    reason: textual_variant
  - marker: b
    text: 그리스어는 “왕들 앞에서 그를 영화롭게 하셨다”로 읽습니다.
    reason: textual_variant
  - marker: c
    text: 전승된 히브리어는 “그들이 그의 영광을 보았다”로 이해될 수 있습니다. 그리스어는 “그가 그에게 자기 영광을 보여 주셨다”를 지지하며, 본문은 이 독법을 따릅니다.
    reason: textual_variant
lexical_decisions:
- source_word: בדבריו
  english_pob_choice: At his word
  chosen_korean: 그의 말에
  alternatives_korean:
  - 그의 말씀으로
  - 그의 말로
  lexicon: HALOT
  rationale: ב+דבריו는 수단/계기를 나타내므로 ‘그의 말에’로 옮겨 원문의 관계를 살리면서도 한국어 문장을 자연스럽게 만들었습니다.
- source_word: האותות
  english_pob_choice: the signs
  chosen_korean: signs
  alternatives_korean:
  - 표징들
  - 기적들
  lexicon: HALOT
  rationale: 원문은 אותות의 직접 대응인 ‘표징/징표’ 계열이 가장 가깝지만, 한국어 본문에서는 의미를 과도하게 좁히지 않도록 영어 표기 sign을 유지하지 않고 ‘표징들’보다 본문 흐름이 자연한 ‘기적들’도 가능하나, 본문에는 별도 처리하지 않았습니다.
- source_word: ויחזקהו לפני מלך
  english_pob_choice: he strengthened him before a king
  chosen_korean: 그가 왕 앞에서 그를 강하게 하셨습니다
  alternatives_korean:
  - 그가 왕 앞에서 그를 강건하게 하셨습니다
  - 그가 왕 앞에서 그를 높이셨습니다
  lexicon: HALOT
  rationale: חזק의 기본 의미를 따라 ‘강하게 하다’로 옮겼고, 전치사 לפני는 ‘앞에서’로 처리해 공개적/대면적 장면을 드러냈습니다. 영어 POB의 ‘strengthened’와도 맞물립니다.
- source_word: ויצוהו אל העם
  english_pob_choice: He commanded him concerning the people
  chosen_korean: 그가 자기 백성에 관하여 그에게 명령을 내리시고
  alternatives_korean:
  - 그가 그에게 자기 백성에 대해 명령하시고
  - 그가 그에게 백성을 두고 명령을 내리시고
  lexicon: HALOT
  rationale: צוה는 ‘명령하다’로, אל העם는 대상/관련을 나타내므로 ‘자기 백성에 관하여’로 풀어 자연스럽게 옮겼습니다. 영어 POB의 관계사를 반영하면서도 히브리어의 benefici​ary force를 살렸습니다.
- source_word: ויראו את כבודו
  english_pob_choice: and showed him his glory
  chosen_korean: 그에게 자기 영광을 보여 주셨습니다
  alternatives_korean:
  - 그의 영광을 그에게 보이셨습니다
  - 그가 자기 영광을 그에게 보이셨습니다
  lexicon: HALOT
  rationale: 전승상 애매한 종결구이지만, 영어 POB와 그리스어가 지지하는 ‘보여 주다’의 의미를 본문에 채택했습니다. 한국어에서는 ‘보여 주셨습니다’가 가장 직접적입니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행본문의 큰 차이를 어떻게 처리할지
  chosen_reading: 본문은 히브리어의 어순과 의미를 기본으로 하되, 마지막 구절은 그리스어가 지지하는 ‘그에게 자기 영광을 보여 주셨습니다’로 처리했습니다.
  alternative_readings:
  - 히브리어 자모를 따라 ‘그들이 그의 영광을 보았습니다’로 번역
  - 그리스어를 따라 ‘그의 말로 표징을 멈추게 하셨다’로 번역
  rationale: 이 절은 major mismatch로 표시되어 있어, 히브리어를 기본으로 하되 불안정한 결구는 그리스어 도움을 받아 보정하는 것이 가장 투명합니다. 이는 사본 전승의 긴장을 지우지 않으면서도 독자가 이해할 수 있는 본문을 제공합니다.
  doctrine_reference: 'Sirach 전승 정책: 보존된 히브리어를 우선하되, 불안정한 지점은 그리스어 평행본문으로 보완'
