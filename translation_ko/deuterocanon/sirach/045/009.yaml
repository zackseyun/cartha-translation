translation:
  language: ko
  text: 그 주위에는 석류가 풍성히 둘러 있어, 그의 걸음에 맞추어 소리가 나게 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 본문은 더 길게 읽습니다. “그를 석류와 사방의 많은 금방울로 둘러, 그의 걸음에 맞추어 들리는 소리가 나게 하고, 그의 백성의 자손이 기억하도록 성전에서 그 소리가 들리게 하였다.” 히브리어 증거는 더 짧으며, 이 절에서는 석류와 걸음에 맞춘 소리만 언급합니다.
    reason: textual_variant
lexical_decisions:
- source_word: ורמונים
  english_pob_choice: and pomegranates
  chosen_korean: 석류가
  alternatives_korean:
  - 석류 장식이
  - 석류 무늬 장식이
  lexicon: HALOT
  rationale: 히브리어는 단순히 ‘석류’를 말하며, POB도 본문에는 사물을 직접 두었습니다. 문맥상 제사장 예복의 석류 장식을 가리키더라도 본문은 해석을 과도하게 넣지 않는 편이 좋습니다.
- source_word: המון
  english_pob_choice: in abundance
  chosen_korean: 풍성하게
  alternatives_korean:
  - 많이
  - 무수히
  lexicon: HALOT
  rationale: 다수성·풍부함을 자연스러운 한국어로 살리되, 단순 수량보다 장식의 넉넉한 배치를 드러내기 위해 ‘풍성하게’를 택했습니다.
- source_word: סביב
  english_pob_choice: all around
  chosen_korean: 둘려 있어
  alternatives_korean:
  - 주위를 둘러
  - 사방에
  lexicon: HALOT
  rationale: 주위를 에워싼 배치를 한국어 동사구로 풀어, 장식의 둘러진 상태를 시각적으로 분명하게 표현했습니다.
- source_word: נעינה
  english_pob_choice: melody
  chosen_korean: 소리를 내게 합니다
  alternatives_korean:
  - 멜로디를 내게 합니다
  - 울림을 내게 합니다
  - 찬란한 소리를 내게 합니다
  lexicon: HALOT
  rationale: 히브리어는 음악적·청각적 울림을 가리키지만, 여기서는 과도하게 서정화하기보다 걸음에서 나는 소리를 자연스럽게 옮기는 것이 본문에 더 가깝습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행본문의 차이
  chosen_reading: 본문은 살아 있는 히브리어의 간결한 표현을 따르고, 그리스어가 덧붙이는 ‘금방울’과 성전 기억의 확장은 본문에 넣지 않았습니다.
  alternative_readings:
  - 그가 그를 석류와 많은 금방울로 두르셨습니다
  - 걸음에서 들리는 소리가 성전에서 기억되게 하셨습니다
  rationale: 이 절의 히브리어 증거는 더 짧고, POB도 이를 본문으로 삼고 그리스어 확장을 주석으로 처리합니다. 따라서 본문은 히브리어를 우선하고 차이는 드러내는 방식이 적절합니다.
  doctrine_reference: 'PHILOSOPHY.md: surviving Hebrew is primary; preserve Greek expansion honestly in note rather than collapsing witnesses.'
