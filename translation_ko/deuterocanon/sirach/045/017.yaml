  - marker: a
    text: 'The extant Cairo Geniza Hebrew for this verse is shorter: ''He gave him his commandments, and granted him authority in statute and judgment.'' The clauses ''to teach Jacob his testimonies and to enlighten Israel with his law'' are supported by the Greek witness and are included here because the Hebrew line appears abbreviated.'
