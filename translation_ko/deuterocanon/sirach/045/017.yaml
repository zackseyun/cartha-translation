translation:
  language: ko
  text: 그에게 그분의 계명들을 주시고, 규례와 판결에 관한 권한을 주셔서, 야곱에게 그분의 증언들을 가르치고 이스라엘을 그분의 율법으로 밝히게 하셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 현전하는 카이로 게니자 히브리어 본문은 “그에게 그분의 계명들을 주시고, 규례와 판결에 관한 권한을 주셨습니다”까지만 전합니다. 그 뒤의 “야곱에게 그분의 증언들을 가르치고 이스라엘을 그분의 율법으로 밝히게 하셨습니다”는 그리스어 전승에 근거하여 보완한 것입니다.
    reason: textual_variant
lexical_decisions:
- source_word: ויתן לו מצותיו
  english_pob_choice: He gave him his commandments
  chosen_korean: 그에게 그의 계명들을 주시고
  alternatives_korean:
  - 그에게 그의 명령들을 주시고
  - 그에게 그의 계명들을 맡기시고
  lexicon: HALOT
  rationale: נתן은 여기서 단순한 ‘주다’의 의미가 자연스럽고, מצותיו는 언약적·법적 어감이 있는 ‘계명들’로 옮기는 것이 가장 직접적입니다.
- source_word: וימשילהו
  english_pob_choice: and granted him authority
  chosen_korean: 그에게 권위를 주셔서
  alternatives_korean:
  - 그를 다스리게 하셔서
  - 그에게 통치권을 주셔서
  lexicon: HALOT
  rationale: 히필 형태의 משל은 ‘다스리게 하다’ 또는 ‘권한을 부여하다’의 뜻이 가능하므로, 제사적·법적 위임을 살리는 ‘권위’가 가장 무난합니다.
- source_word: בחוק ומשפט
  english_pob_choice: in statute and judgment
  chosen_korean: 규례와 판결 가운데서
  alternatives_korean:
  - 율례와 판결 가운데서
  - 규례와 정의 가운데서
  - 법과 न्याय 가운데서
  lexicon: HALOT
  rationale: חוק ומשפט는 법적·언약적 짝 표현이므로, 전통적 교회어 ‘율례’보다 더 중립적인 ‘규례’와 ‘판결’로 대응하되, ‘가운데서’로 תחום을 살렸습니다.
- source_word: τὰ μαρτύρια / ἐν νόμῳ αὐτοῦ φωτῖσαι Ἰσραήλ
  english_pob_choice: to teach Jacob his testimonies and to enlighten Israel with his law
  chosen_korean: 야곱에게 그의 증거들을 가르치고 이스라엘을 그의 율법으로 비추게 하셨습니다
  alternatives_korean:
  - 야곱에게 그의 증언들을 가르치고 이스라엘을 그의 율법으로 밝히게 하셨습니다
  - 야곱에게 그의 증거들을 가르치고 이스라엘에게 그의 율법으로 빛을 주게 하셨습니다
  lexicon: BDAG
  rationale: 히브리어 본문에는 빠져 있지만, 주어진 그리스어 병행본문이 목적절을 보완하므로 이를 본문에 반영했습니다. μαρτύρια는 법정·언약 문맥의 ‘증거들’이 자연스럽고, φωτῖσαι는 ‘비추다’로 직역성이 좋습니다.
theological_decisions:
- issue: 히브리어 축약본과 그리스어 병행본문의 결합
  chosen_reading: 히브리어에 남아 있는 ‘계명…권위…규례와 판결’ 뒤에 그리스어의 목적절을 본문에 포함했습니다.
  alternative_readings:
  - 히브리어 현전분만 번역하여 목적절을 생략함
  rationale: 이 절은 현전 히브리어가 짧고, 제시된 그리스어 병행본문이 아론의 직무 설명을 완결합니다. 따라서 POB의 주어진 번역 자료를 따라 보완 본문을 본문에 반영하고, 각주로 투명하게 밝혔습니다.
  doctrine_reference: 'Sirach 번역 원칙: 현전 히브리어를 우선하되, 결락·축약이 분명할 때는 병행 전승을 보조 본문으로 사용함.'
