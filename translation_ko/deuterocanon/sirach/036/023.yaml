  yaml_path: translation/deuterocanon/sirach/036/023.yaml
  text: A woman will accept any male[a], but one daughter is better than another.
  footnotes:
  - marker: a
    text: Or, 'A wife will accept any man.' Greek γυνή can mean either 'woman' or 'wife,' and ἄρρην can be rendered more generally as 'man,' though 'male' is more literal.
    reason: lexical_alternative
translation:
  language: ko
  text: 여자는 어떤 남자든 받아들이지만, 어떤 딸은 다른 딸보다 더 낫습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘아내는 어떤 남자든 받아들입니다.’ 그리스어 γυνή는 ‘여자’와 ‘아내’ 모두를 뜻할 수 있으며, ἄρρην은 더 문자적으로 ‘남성/수컷’을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα ἄρρενα
  english_pob_choice: any male
  chosen_korean: 모든 남자
  alternatives_korean:
  - 모든 남성
  - 어떤 남자든지
  lexicon: LSJ
  rationale: ἄρρενα는 생물학적 성별을 가리키는 ‘수컷/남성’ 계열이지만, 한국어 속담문맥에서는 ‘남자’가 가장 자연스럽고 직역의 딱딱함을 덜하면서도 성별 대비를 유지합니다.
- source_word: ἐπιδέξεται
  english_pob_choice: will accept
  chosen_korean: 받아들이지만
  alternatives_korean:
  - 받지만
  - 수용하지만
  lexicon: LSJ
  rationale: 미래 중간형의 ‘받다/받아들이다’ 의미를 살려, 문맥상 선택·수용의 뉘앙스를 담는 ‘받아들이다’로 옮겼습니다.
- source_word: θυγάτηρ θυγατρός
  english_pob_choice: one daughter ... another
  chosen_korean: 한 딸이 다른 딸보다
  alternatives_korean:
  - 딸 하나가 다른 딸보다
  - 한 딸이 딸보다
  lexicon: LSJ
  rationale: 반복된 명사의 비교 관용구를 한국어의 자연스러운 비교문으로 풀어, ‘daughter of a daughter’ 같은 오독을 피했습니다.
- source_word: κρεῖσσον
  english_pob_choice: is better
  chosen_korean: 낫습니다
  alternatives_korean:
  - 더 좋습니다
  - 더 낫습니다
  lexicon: LSJ
  rationale: κρεῖσσον의 비교급을 한국어에서 가장 자연스럽게 드러내는 표현은 ‘낫다’이며, 격언체의 단정적 리듬도 잘 살립니다.
theological_decisions:
- issue: 잠언적 문장의 성별 지시를 어떻게 보존할지
  chosen_reading: 여성과 딸을 대상으로 한 일반 진술로 유지하고, 성별이 드러나는 표현을 완화하지 않았습니다.
  alternative_readings:
  - 성중립적으로 바꾸어 일반 인간의 선택으로 풀기
  - ‘아내’로 좁혀 결혼 선택의 문장으로 읽기
  rationale: 원문의 짧고 속담적인 형식은 그 사회적 세계의 성별 대비를 전제하므로, 이를 완화하기보다 그대로 드러내는 편이 소스 충실도에 맞습니다.
  doctrine_reference: DOCTRINE.md §§1, 4, 6
