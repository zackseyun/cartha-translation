  text: He who acquires a wife begins an acquisition[b][a], a helper corresponding to him and a pillar of rest.
  footnotes:
  - marker: a
    text: Or 'begins a possession' or 'begins property'; the Greek uses a cognate wordplay between 'acquires' and 'acquisition/possession.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'according to him,' that is, corresponding to him or suited to him.
    reason: lexical_alternative
translation:
  language: ko
  text: 아내를 얻는 사람은 획득을 시작합니다[a][b] — 그에게 맞는 도움과 안식의 기둥입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘획득’은 κτήσεως의 어근을 살려, ‘얻는’(κτώμενος)과의 말장난을 가능한 한 한국어로 반영한 것입니다.
    reason: lexical_alternative
  - marker: b
    text: κατʼ αὐτόν은 문자적으로는 ‘그에 따라’이지만, 여기서는 ‘그에게 맞는/상응하는’의 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ κτώμενος
  english_pob_choice: He who acquires
  chosen_korean: 아내를 얻는 사람은
  alternatives_korean:
  - 아내를 획득하는 사람은
  - 아내를 취하는 사람은
  - 아내를 얻는 자는
  lexicon: LSJ
  rationale: 문장 전체가 격언적이어서 현대 한국어에서는 ‘사람은’으로 자연스럽게 풀되, κτάομαι의 획득 뉘앙스를 살리기 위해 ‘얻는’으로 옮겼습니다.
- source_word: ἐνάρχεται κτήσεως
  english_pob_choice: begins an acquisition
  chosen_korean: 획득을 시작합니다
  alternatives_korean:
  - 소유를 시작합니다
  - 소유의 시작을 합니다
  - 재산을 얻기 시작합니다
  lexicon: LSJ
  rationale: ἐνάρχεται와 κτήσεως의 어근 연결이 있는 말장난을 한국어에서 완전히 재현하기는 어렵지만, ‘획득’으로 같은 어휘장을 유지해 반복 효과를 최대한 보존했습니다.
- source_word: βοηθὸν κατʼ αὐτόν
  english_pob_choice: a helper corresponding to him
  chosen_korean: 그에게 맞는 도움
  alternatives_korean:
  - 그에게 맞는 돕는 이
  - 그와 상응하는 도움
  - 그에 맞는 조력자
  lexicon: BDAG/LSJ
  rationale: βοηθός의 기본 의미는 ‘돕는 존재’이므로 명사구를 자연스럽게 풀었고, κατʼ αὐτόν은 ‘그에게 맞는/상응하는’의 적합성 관계를 살려 번역했습니다.
- source_word: στύλον ἀναπαύσεως
  english_pob_choice: a pillar of rest
  chosen_korean: 안식의 기둥입니다
  alternatives_korean:
  - 휴식의 기둥입니다
  - 평안의 기둥입니다
  - 쉼의 기둥입니다
  lexicon: LSJ/BDAG
  rationale: 비유적 구조를 유지하기 위해 ‘기둥’을 직역했고, ἀναπαύσεως는 단순한 휴식보다 안정된 쉼의 뜻을 살려 ‘안식’으로 옮겼습니다.
