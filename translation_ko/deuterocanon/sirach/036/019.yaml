translation:
  language: ko
  text: 아론이 당신의 백성에 관하여[a] 한 축복에 따라, 땅 위의 모든 사람이 당신께서 주이시며 만세의 하나님이심을 알게 될 것입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신의 백성을 위해’ 또는 ‘당신의 백성 위에’. 그리스어 구는 아론이 이스라엘을 위하여 또는 이스라엘 위에 축복을 선포한 것과 관련하여 이해할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘영원한 하나님’. 그리스어를 더 문자적으로 옮기면 ‘시대들의 하나님’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ τὴν εὐλογίαν Ἀαρὼν
  english_pob_choice: according to the blessing of Aaron
  chosen_korean: 아론의 복[으로]
  alternatives_korean:
  - 아론의 축복에 따라
  - 아론이 베푼 축복대로
  - 아론의 축복을 따라
  lexicon: LSJ
  rationale: κατὰ + 대격은 준거를 나타내므로 ‘따라’의 의미를 살리되, 축복을 선포하는 문맥상 ‘아론의 복[으로]’처럼 간결하게 옮겼습니다.
- source_word: περὶ τοῦ λαοῦ σου
  english_pob_choice: over your people
  chosen_korean: 당신의 백성 위에
  alternatives_korean:
  - 당신의 백성을 위해
  - 당신의 백성에 관하여
  - 당신의 백성을 향하여
  lexicon: LSJ
  rationale: περὶ는 문맥상 ‘~에 대하여/위하여’의 여지가 있지만, 축복을 선포하는 관용을 살려 ‘위에’로 옮기는 것이 가장 자연스럽습니다.
- source_word: γνώσονται πάντες οἱ ἐπὶ τῆς γῆς
  english_pob_choice: all those on the earth will know
  chosen_korean: 땅 위의 모든 사람은 … 알게 될 것입니다
  alternatives_korean:
  - 땅에 있는 모든 이들은 … 알 것입니다
  - 온 땅의 모든 사람은 … 알게 될 것입니다
  lexicon: LSJ
  rationale: οἱ ἐπὶ τῆς γῆς는 지상의 인류 전체를 가리키므로, 한국어에서는 ‘땅 위의 모든 사람’이 직역성과 자연스러움을 함께 살립니다.
- source_word: Κύριος εἶ
  english_pob_choice: you are the Lord
  chosen_korean: 당신께서 주이시며
  alternatives_korean:
  - 당신이 주이심을
  - 당신은 주이심을
  lexicon: LSJ
  rationale: κύριος는 프로젝트 기본에 따라 ‘주’로 옮기고, 직접 지시가 아니라 선언문이므로 ‘주이시며’로 문장을 연결했습니다.
- source_word: ὁ θεὸς τῶν αἰώνων
  english_pob_choice: the God of the ages
  chosen_korean: 영원들의 하나님이심을
  alternatives_korean:
  - 시대들의 하나님이심을
  - 세대들의 하나님이심을
  - 영원의 하나님이심을
  lexicon: LSJ
  rationale: αἰώνων을 단순히 ‘영원’으로 평탄화하기보다 복수형의 시간적 범위를 살려 ‘영원들의’로 옮겨, ‘ages’의 중첩된 뜻을 보존했습니다.
theological_decisions:
- issue: κύριος의 신적 호칭을 한국어에서 어떻게 표시할지
  chosen_reading: ‘주’로 옮기되, 문장 전체에서는 ‘주이시며’로 예배적 선언의 울림을 유지했습니다.
  alternative_readings:
  - 주님
  - 주인
  rationale: 이 구절에서 Κύριος는 하나님의 칭호이므로 일반적 소유/주인보다 신적 호칭인 ‘주’가 적절합니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: κύριος → 주'
- issue: ὁ θεὸς τῶν αἰώνων의 시간 개념을 어떻게 처리할지
  chosen_reading: ‘영원들의 하나님’으로 유지했습니다.
  alternative_readings:
  - 영원하신 하나님
  - 영원의 하나님
  rationale: POB의 ‘the God of the ages’를 너무 익숙한 ‘영원하신 하나님’으로 평탄화하면 원문의 ‘ages’가 주는 역사적·우주적 폭이 줄어들 수 있습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §5
