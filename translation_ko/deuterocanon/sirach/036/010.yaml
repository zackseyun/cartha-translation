  text: And all men are from the ground[a], and Adam was created from the earth.
  footnotes:
  - marker: a
    text: Or 'all people.' The Greek says 'all men' (ἄνθρωποι πάντες), using a masculine plural with representative force for humanity.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 모든 사람은 흙에서 났으며, 아담은 땅에서 창조되었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘모든 사람’은 그리스어의 남성 복수형 ἄνθρωποι πάντες가 대표적으로 인류 전체를 가리킨다는 점을 반영한 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄνθρωποι πάντες
  english_pob_choice: all men
  chosen_korean: 모든 사람은
  alternatives_korean:
  - 모든 인간은
  - 모든 남자는
  lexicon: BDAG
  rationale: 그리스어는 남성 복수형이지만 대표성을 띤 인류 일반을 가리키므로, 한국어에서는 성별 한정처럼 들리지 않으면서도 보편적 의미를 드러내는 ‘모든 사람은’을 택했습니다.
- source_word: ἀπὸ ἐδάφους
  english_pob_choice: from the ground
  chosen_korean: 흙에서 났으며
  alternatives_korean:
  - 땅에서 났으며
  - 지면에서 났으며
  lexicon: LSJ
  rationale: ἐδάφος의 구체적 이미지가 ‘흙/땅’의 창조 배경을 띠므로, 자연스러운 한국어 표현인 ‘흙에서 났으며’로 옮겨 기원의 감각을 살렸습니다.
- source_word: ἐκ γῆς
  english_pob_choice: from the earth
  chosen_korean: 땅에서
  alternatives_korean:
  - 흙에서
  - 땅으로부터
  lexicon: LSJ
  rationale: γῆ는 여기서 ἐδάφους와 병행하며 더 넓은 ‘땅/대지’의 의미를 가지므로, 앞 구절과 약간 구분되는 대응을 살려 ‘땅에서’로 번역했습니다.
- source_word: ἐκτίσθη
  english_pob_choice: was created
  chosen_korean: 창조되었습니다
  alternatives_korean:
  - 지어졌습니다
  - 만들어졌습니다
  lexicon: LSJ
  rationale: κτίζω의 수동형은 창조 행위를 분명히 가리키므로, 한국어 성경 문체에서 자연스러운 ‘창조되었습니다’를 사용했습니다.
theological_decisions:
- issue: 아담과 모든 사람의 관계를 어떻게 드러낼지
  chosen_reading: 첫 절반은 인류 일반의 기원을 말하고, 뒤 절반은 아담의 창조를 그 근거로 제시하는 구조를 유지했습니다.
  alternative_readings:
  - 아담을 단지 ‘첫 사람’의 상징으로만 풀어 설명하는 방식
  - ‘사람들’ 대신 성별 중립 표현만으로 일반화하는 방식
  rationale: 그리스어는 보편 진술 뒤에 아담의 창조를 제시하므로, 역사적 인물 아담을 보존하면서도 대표적 의미를 흐리지 않게 했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4; Contested terms table for אָדָם
