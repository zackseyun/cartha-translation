translation:
  language: ko
  text: 여인의 아름다움은 얼굴을 밝게 하고, 사람의 모든 욕망보다 더 뛰어납니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘얼굴을 즐겁게 한다’, ‘얼굴을 기쁘게 한다’.
    reason: lexical_alternative
  - marker: b
    text: ἀνθρώπου는 문맥에 따라 더 일반적으로 ‘사람의’ 또는 ‘인간의’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: κάλλος
  english_pob_choice: beauty
  chosen_korean: 아름다움
  alternatives_korean:
  - 미모
  - 아름다움/외모
  lexicon: LSJ
  rationale: μορφή가 아니라 κάλλος이므로 외적 매력과 미감을 가리키는 뜻을 살려 ‘아름다움’으로 옮겼습니다.
- source_word: γυναικός
  english_pob_choice: a woman's
  chosen_korean: 여인의
  alternatives_korean:
  - 한 여자의
  - 아내의
  lexicon: LSJ
  rationale: γυνή는 일반적으로 ‘여자/여인’을 뜻하며, 여기서는 혼인 관계를 특정하지 않으므로 ‘여인’이 자연스럽습니다.
- source_word: ἱλαρύνει πρόσωπον
  english_pob_choice: brightens the face
  chosen_korean: 얼굴을 밝게 하고
  alternatives_korean:
  - 얼굴을 환하게 하고
  - 용안을 밝게 하고
  lexicon: LSJ
  rationale: ἱλαρύνει는 ‘밝게 하다, 즐겁게 하다’의 의미로, πρόσωπον과 함께 얼굴의 표정을 밝히는 이미지를 살려 직역에 가깝게 옮겼습니다.
- source_word: ὑπὲρ πᾶσαν ἐπιθυμίαν ἀνθρώπου ὑπεράγει
  english_pob_choice: surpasses every desire of a man
  chosen_korean: 사람의 모든 욕망보다 더 뛰어납니다
  alternatives_korean:
  - 사람의 모든 욕망을 뛰어넘습니다
  - 사람의 모든 바람보다 더 큽니다
  lexicon: LSJ
  rationale: ὑπέρ...ὑπεράγει의 중복된 비교·초월 구조를 한국어에서도 ‘보다 더 뛰어납니다’로 살리고, ἐπιθυμία는 문맥상 단순한 ‘원함’보다 강한 ‘욕망’이 더 가깝습니다.
theological_decisions:
- issue: ἀνθρώπου의 성별 표지와 대표성
  chosen_reading: ‘사람의’로 옮겨 γενικ한 인간의 욕망을 가리키되, 원문의 비교 구조는 유지했습니다.
  alternative_readings:
  - ‘남자의’
  - ‘인간의’
  rationale: POB 영어 본문이 ‘of a man’/‘human desire’ 사이의 해석 흔적을 보이지만, 그리스어 ἀνθρώπου는 여기서 보편적 인간을 가리키는 일반격으로 읽는 편이 자연스럽습니다. 따라서 성별을 과도하게 고정하지 않고 한국어에서는 ‘사람의’로 처리했습니다.
  doctrine_reference: DOCTRINE.md §4 Gender-accurate over gender-neutral
