  yaml_path: translation/deuterocanon/sirach/036/001.yaml
  text: No evil will confront the one who fears the Lord[b][a], but in trial he will rescue him again.
  footnotes:
  - marker: a
    text: Or 'No harm will meet the one who fears the Lord.' Greek κακόν can mean 'evil,' 'harm,' or 'misfortune.'
    reason: lexical_alternative
  - marker: b
    text: Or 'but in testing/temptation he will deliver him again.' Greek πειρασμός can denote trial, testing, or temptation; here the context favors adversity or testing.
    reason: lexical_alternative
translation:
  language: ko
  text: 주님을 경외하는 이에게는 악이 닥치지 않지만, 시험 가운데서는 그를 다시 건져내십니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주님을 경외하는 이에게는 해가 닥치지 않는다.’ 그리스어 κακόν은 ‘악’, ‘해’, ‘불행’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘시험/유혹 가운데서 그를 다시 건져내십니다.’ 그리스어 πειρασμός는 시련, 시험, 유혹을 가리킬 수 있으며, 이 문맥은 시련이나 시험의 뜻이 더 적절합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τῷ φοβουμένῳ Κύριον
  english_pob_choice: the one who fears the Lord
  chosen_korean: 주님을 경외하는 이
  alternatives_korean:
  - 주님을 두려워하는 이
  - 주님을 무서워하는 이
  - 주님을 경외하는 사람
  lexicon: BDAG
  rationale: φοβέομαι의 경외·두려움의 뉘앙스를 한국어에서 가장 자연스럽게 살리기 위해 ‘경외하다’를 택했습니다. 문장 전체가 잠언형 일반 진술이므로 ‘이’로 간결하게 처리했습니다.
- source_word: Κύριον
  english_pob_choice: the Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주
  - 주 하나님
  lexicon: BDAG
  rationale: 시락서의 경구적 문맥에서 κύριος는 하나님을 가리키는 호칭으로 읽히므로, 프로젝트 기본값에 따라 ‘주님’으로 옮겼습니다.
- source_word: οὐκ ἀπαντήσει κακόν
  english_pob_choice: No evil will confront
  chosen_korean: 악이 닥치지 않지만
  alternatives_korean:
  - 악이 맞닥뜨리지 않지만
  - 해악이 그를 만나지 않지만
  - 불행이 닥치지 않지만
  lexicon: BDAG
  rationale: ἀπαντάω의 ‘마주치다/닥치다’ 이미지를 한국어에서 자연스럽게 살리기 위해 ‘닥치다’를 썼습니다. κακόν은 단순한 사고보다 더 넓은 부정적 현실을 가리키므로 ‘악’을 유지했습니다.
- source_word: ἐν πειρασμῷ
  english_pob_choice: in trial
  chosen_korean: 시험 가운데서는
  alternatives_korean:
  - 시련 가운데서는
  - 시험을 당할 때는
  - 유혹 가운데서는
  lexicon: BDAG
  rationale: πειρασμός는 이 문맥에서 유혹보다 시련·시험의 의미가 강하므로 ‘시험’으로 옮겼습니다. 부사구의 상황성을 드러내기 위해 ‘가운데서는’을 덧붙였습니다.
- source_word: ἐξελεῖται
  english_pob_choice: he will rescue him
  chosen_korean: 그를 다시 건져내십니다
  alternatives_korean:
  - 그를 다시 구해내십니다
  - 그를 다시 건지십니다
  - 그를 다시 구원하십니다
  lexicon: BDAG
  rationale: ἐξαιρέω의 ‘빼내다/건져내다/구출하다’ 의미를 살려 구체적이고 성경적인 표현인 ‘건져내다’를 택했습니다. καὶ πάλιν의 반복성은 ‘다시’로 반영했습니다.
theological_decisions:
- issue: 주어의 암시성
  chosen_reading: 본문에 드러난 ‘주님’을 암시 주어로 이해해 ‘건져내십니다’로 번역했습니다.
  alternative_readings:
  - 무주어에 가까운 ‘그를 다시 건져냅니다’
  - 일반 진술형 ‘건져내실 것입니다’
  rationale: 그리스어는 주어를 생략하지만 앞의 ‘주님’을 자연스럽게 이어 읽는 지혜문학적 진술입니다. 한국어에서는 동사의 높임을 통해 주어가 하나님임을 분명히 했습니다.
  doctrine_reference: 하나님의 섭리와 보호를 드러내는 잠언형 약속으로 읽되, 시험의 존재 자체를 지우지 않도록 병렬 구조를 유지합니다.
- issue: ‘악’과 ‘시험’의 병렬 긴장
  chosen_reading: 첫 절은 ‘악이 닥치지 않지만’, 둘째 절은 ‘시험 가운데서는’으로 구분해, 악의 일반 부정성과 실제 시험의 현실을 함께 남겼습니다.
  alternative_readings:
  - 둘 다 완화해 ‘해로운 일’과 ‘시련’으로 통일
  - 둘 다 강하게 ‘악’과 ‘유혹’으로 통일
  rationale: 영어 POB도 κακόν과 πειρασμός의 의미 범위를 서로 다르게 처리합니다. 이를 따라 한국어에서도 윤리적 악과 실제 시련을 구분해 번역하는 것이 원문의 긴장을 더 잘 보존합니다.
  doctrine_reference: 지혜문학의 일반 원리를 보존하며, 의인의 삶에 시험이 없다고 말하지는 않는다는 점을 유지합니다.
