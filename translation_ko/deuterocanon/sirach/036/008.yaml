translation:
  language: ko
  text: 그들은 주님의 지식으로 구별되었고, 그분은 때와 절기를 바꾸셨습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν γνώσει Κυρίου
  english_pob_choice: By the knowledge of the Lord
  chosen_korean: 주님의 지식으로
  alternatives_korean:
  - 주님의 앎으로
  - 주님을 아는 지식으로
  lexicon: γνῶσις
  rationale: ἐν + dative는 원인/수단을 나타낼 수 있으므로, ‘~으로’로 옮겨 원문의 작용 원리를 살렸습니다. ‘앎’보다 ‘지식’이 여기서는 보다 직접적입니다.
- source_word: διεχωρίσθησαν
  english_pob_choice: they were distinguished
  chosen_korean: 그들은 구별되었고
  alternatives_korean:
  - 그들은 나뉘었고
  - 그들은 분리되었고
  lexicon: διαχωρίζω
  rationale: 문맥상 단순 분리보다 서로 다른 범주로 ‘구별됨’의 의미가 자연스럽고, POB의 distinguished를 과도하게 해석하지 않습니다.
- source_word: ἠλλοίωσεν καιροὺς καὶ ἑορτάς
  english_pob_choice: he altered seasons and festivals
  chosen_korean: 계절과 절기를 바꾸셨습니다
  alternatives_korean:
  - 때와 절기를 바꾸셨습니다
  - 시기와 절기를 변경하셨습니다
  lexicon: ἀλλοιόω / καιρός / ἑορτή
  rationale: PB의 ‘altered’에 맞추되, καιρούς는 자연스러운 한국어로 ‘계절’로 옮겼습니다. ἑορτάς는 종교적 절기를 가리키므로 ‘절기’가 가장 직접적입니다.
theological_decisions:
- issue: The subject of the verb in the second clause is God implied by the Greek, while the first clause names the Lord explicitly.
  chosen_reading: 두 절을 같은 주체의 연속 행위로 읽어, ‘그분은’으로 자연스럽게 연결했습니다.
  alternative_readings:
  - ‘주님께서 … 바꾸셨습니다’로 반복 명시
  - 둘째 절을 비인칭적으로 처리
  rationale: 원문은 주체가 이어지는 구조이므로, 한국어에서는 호응을 명확히 하되 의미를 바꾸지 않는 방식이 적절합니다.
  doctrine_reference: 문맥상 하나님의 주권적 섭리
