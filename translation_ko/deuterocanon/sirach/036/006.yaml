  text: A horse for mounting is like a mocking friend; under anyone who sits on it[a], it neighs.
  footnotes:
  - marker: a
    text: The Greek wording is somewhat terse and unusual. The phrase translated 'for mounting' can in other contexts carry a sexual sense, but here the surrounding image of someone sitting on the horse supports the riding sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 탈 것용 말은 조롱하는 친구와 같아서, 누구든 그 위에 타면 히힝거립니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 헬라어 표현은 간결하고 이례적이며, ὀχεία는 다른 문맥에서는 성적 의미를 가질 수 있지만, 여기서는 ‘타다/오르다’의 뜻이 문맥상 적절합니다.
    reason: lexical_alternative
