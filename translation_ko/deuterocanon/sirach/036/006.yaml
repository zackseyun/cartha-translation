  - 중립적인 승마 묘사로 약화하는 읽기
  - 단순히 ‘시끄럽게 운다’는 식의 완화
  rationale: 헬라어의 압축되고 다소 기묘한 비유 구조를 평이하게만 만들면 풍자성이 약해지므로, 조롱하는 친구라는 비교를 그대로 살렸습니다.
  doctrine_reference: 잠언적 지혜문학의 비유적 풍자
