theological_decisions:
- issue: 직유의 과장된 풍자 유지
  chosen_reading: 이 구절을 단순한 동물 묘사가 아니라, 타는 자를 거슬러 반응하는 말처럼 신뢰하기 어려운 관계를 풍자하는 직유로 보존했습니다.
