base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/036/017.yaml
  text: Give testimony to your creatures from the beginning[b][a], and raise up the prophecies spoken in your name.
  footnotes:
  - marker: a
    text: Or 'to your creations that were from the beginning.' The Greek phrase is compressed and may refer broadly to what God created at the beginning rather than specifically to living creatures.
    reason: lexical_alternative
  - marker: b
    text: Or 'fulfill the prophecies in your name.' The Greek literally says 'raise up the prophecies,' which may imply bringing them into effect.
    reason: alternative_reading
translation:
  language: ko
  text: 처음부터 있던 주님의 피조물들에게 증거를 보이시고,[a] 주님의 이름으로 선포된 예언들을 일으키소서.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “처음부터 있었던 주님의 창조물들에게.” 그리스어 표현은 압축되어 있으며, 살아 있는 존재에만 한정하지 않고 태초에 창조된 것들을 넓게 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 “예언들을 일으키소서”입니다. 문맥에 따라 예언들을 효력 있게 하시거나 성취하신다는 뜻으로 이해될 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: δὸς
  english_pob_choice: Give
  chosen_korean: 주시고
  alternatives_korean:
  - 주십시오
  - 베푸시고
  lexicon: LSJ
  rationale: aorist imperative의 직접 명령을 한국어 합쇼체 청원형으로 자연스럽게 옮겼습니다. 이 문맥에서는 단순한 명령보다 간구의 뉘앙스가 강하므로 '주시고'가 적절합니다.
- source_word: μαρτύριον
  english_pob_choice: testimony
  chosen_korean: 증언
  alternatives_korean:
  - 증거
  - 간증
  lexicon: LSJ
  rationale: μαρτύριον의 법정적·계시적 성격을 살리기 위해 '증언'을 택했습니다. '증거'는 대상물처럼 들리고, '간증'은 신앙적 체험에 치우칠 수 있습니다.
- source_word: τοῖς ἐν ἀρχῇ κτίσμασίν σου
  english_pob_choice: to your creatures from the beginning
  chosen_korean: 당신의 조물들에게, 곧 처음부터 있던 것들에게
  alternatives_korean:
  - 당신의 피조물들에게, 처음부터 있는 것들에게
  - 처음부터 있었던 당신의 창조물들에게
  lexicon: LSJ
  rationale: κτίσμα을 전통적 교회어인 '피조물'로 좁히기보다, 본문이 말하는 '창조된 것들/존재들'의 넓은 범위를 살리려고 '조물'을 사용했습니다. '처음부터 있던 것들'은 압축된 희랍어 구문을 풀어 주되 의미를 과도하게 확정하지 않습니다.
- source_word: ἔγειρον προφητείας
  english_pob_choice: raise up the prophecies
  chosen_korean: 예언들을 일으키소서
  alternatives_korean:
  - 예언들을 세우소서
  - 예언들을 일으켜 세우소서
  - 예언들을 이루소서
  lexicon: LSJ
  rationale: ἔγειρον의 기본 뜻인 '일으키다'를 보존하되, 한국어에서 예언의 효력이 다시 드러나는 느낌을 주기 위해 '일으키소서'로 옮겼습니다. '이루소서'는 해석을 강하게 고정할 수 있어 피했습니다.
- source_word: τὰς ἐπʼ ὀνόματί σου
  english_pob_choice: spoken in your name
  chosen_korean: 당신의 이름으로 된
  alternatives_korean:
  - 당신의 이름에 속한
  - 당신의 이름으로 말해진
  lexicon: LSJ
  rationale: ἐπʼ ὀνόματί σου의 관용적 의미를 한국어로 자연스럽게 풀어, 예언이 하나님의 이름 아래 권위 있게 선포되었음을 드러냈습니다. '된'은 문법적 압축을 풀어 주지만, 해석을 과도하게 덧붙이지는 않습니다.
theological_decisions:
- issue: τοῖς ἐν ἀρχῇ κτίσμασίν σου의 범위
  chosen_reading: 하나님이 처음부터 두신 창조된 것들/존재들에 대한 청원으로 유지했습니다.
  alternative_readings:
  - 이스라엘을 가리키는 말로 좁혀 읽기
  - 하나님의 원초적 행위나 질서를 가리키는 말로 읽기
  rationale: 희랍어 κτίσμα은 생물/피조물/창조물 모두를 아울 수 있어, 본문이 지시하는 대상을 좁히지 않고 열어 두는 편이 원문에 더 충실합니다. 한국어에서는 '조물들'과 '처음부터 있던 것들'로 그 긴장을 보존했습니다.
  doctrine_reference: Translation philosophy §1, §3, §5
- issue: ἔγειρον προφητείας의 의미
  chosen_reading: 예언 자체를 다시 일으켜 활성화해 달라는 청원으로 읽었습니다.
  alternative_readings:
  - 예언을 성취해 달라는 뜻
  - 예언자들을 다시 일으켜 달라는 뜻
  rationale: 목적어가 '예언들'이므로 예언자 개인보다 예언 말씀이 대상입니다. '일으키소서'는 성취의 가능성을 열어 두면서도 원문의 은유를 그대로 살립니다.
  doctrine_reference: Translation philosophy §3, §5
