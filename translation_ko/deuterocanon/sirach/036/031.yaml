theological_decisions:
- issue: 수사적 질문과 잠언적 비유의 보존
  chosen_reading: 한 사람의 신뢰 불가능성과 정착 없는 삶을 병렬 비유로 제시하는 지혜문으로 읽고, 직접적 교훈 문장으로 풀어 쓰지 않았습니다.
  alternative_readings:
  - 도덕적 경고를 명시적으로 덧붙이는 읽기
  - 일반적 인생무상 표현으로 완화하는 읽기
  rationale: 원문은 질문과 비유를 통해 판단을 유도하므로, 그 긴장과 풍자를 유지하는 편이 텍스트의 설득력을 더 정확히 전달합니다.
  doctrine_reference: 지혜문학의 수사와 비유 보존
