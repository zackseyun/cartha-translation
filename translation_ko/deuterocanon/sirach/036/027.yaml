base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/036/027.yaml
  text: Where there is no fence[a], the property will be plundered; and where there is no wife[b], he will groan as he wanders.
  footnotes:
  - marker: a
    text: Or 'hedge' for 'fence.' The Greek term denotes a protective enclosure or barrier around property.
    reason: lexical_alternative
  - marker: b
    text: The Greek literally says 'and where there is no wife, will groan wandering,' with the male householder understood as the implied subject.
    reason: lexical_alternative
translation:
  language: ko
  text: 울타리가 없는 곳에서는 재산이 약탈당하고, 아내가 없는 곳에서는 헤매며 신음합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: φραγμός는 보호용 울타리나 경계막을 뜻하므로, 여기서는 현대적으로 ‘울타리’로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어는 둘째 절의 주어를 직접 밝히지 않으며, 앞의 ‘아내’가 없는 남성 가구주가 암시됩니다.
    reason: source_note
lexical_decisions:
- source_word: φραγμός
  english_pob_choice: fence
  chosen_korean: 울타리
  alternatives_korean:
