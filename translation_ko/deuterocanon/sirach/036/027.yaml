  - 떠돌며 신음합니다
  lexicon: LSJ
  rationale: στενάζω의 강한 고통·신음의 뉘앙스를 살리면서, πλανώμενος의 떠도는 상태를 한국어 부사구로 자연스럽게 연결했습니다.
theological_decisions:
- issue: 둘째 절의 생략된 주어를 어떻게 처리할지
  chosen_reading: 명시적 주어를 넣지 않고, 앞 절의 남성 가구주를 암시하는 구조를 한국어에서도 유지했습니다.
  alternative_readings:
  - 그는 헤매며 신음합니다
  - 남자는 헤매며 신음합니다
  rationale: 그리스어는 στενάξει의 주어를 명시하지 않으므로, 본문에 없는 ‘남자’를 추가하지 않고 ‘아내가 없는 곳에서는 … 신음합니다’로 간결하게 옮기는 것이 원문에 더 가깝습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
