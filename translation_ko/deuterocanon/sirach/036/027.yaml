base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/036/027.yaml
  text: Where there is no fence[a], the property will be plundered; and where there is no wife[b], he will groan as he wanders.
  footnotes:
  - marker: a
    text: Or 'hedge' for 'fence.' The Greek term denotes a protective enclosure or barrier around property.
    reason: lexical_alternative
  - marker: b
    text: The Greek literally says 'and where there is no wife, will groan wandering,' with the male householder understood as the implied subject.
    reason: lexical_alternative
translation:
  language: ko
  text: 울타리가 없는 곳에서는 재산이 약탈당할 것이며, 아내가 없는 남자는 떠돌며 신음할 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: φραγμός는 보호를 위한 울타리 또는 경계막을 뜻합니다. ‘울타리’는 이 문맥에서 자연스러운 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어는 둘째 절의 주어를 직접 밝히지 않습니다. ‘아내’라는 말과 가정에 관한 속담의 문맥상 아내가 없는 남성 가구주 또는 남편이 함의됩니다.
    reason: source_note
