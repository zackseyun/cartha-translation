  source_fidelity: 첫 절은 φραγμός, κτῆμα, διαρπαγήσεται의 의미를 충실히 반영합니다. 둘째 절의 ‘헤매며 신음합니다’도 στενάξει πλανώμενος를 잘 살립니다. 그러나 한국어 문장에서는 둘째 절의 행위 주체가 완전히 생략되어, 바로 앞의 ‘재산’이 계속 주어인 듯한 일시적 문법적 모호성이 생깁니다. 원문의 생략된 남성 가구주/남편이라는 주체를 한국어에서 자연스럽게 드러낼 필요가 있습니다.
  naturalness: ‘울타리가 없는 곳에서는 …, 아내가 없는 곳에서는 …’의 병행은 좋지만, ‘아내가 없는 곳에서는 헤매며 신음합니다’는 현대 한국어에서 누가 신음하는지 불분명하여 다소 부자연스럽습니다. ‘아내가 없는 남자는’으로 주체를 제시하면 속담의 대조와 문장 흐름이 분명해집니다.
  terminology: ‘울타리’, ‘재산’, ‘약탈당하다’, ‘아내’, ‘신음하다’는 적절합니다. 미래형 διαρπαγήσεται 및 στενάξει는 한국어 속담 문맥에서 현재형으로 일반적 결과를 나타낼 수도 있으나, ‘것입니다’를 사용하면 원문의 미래 지향적 결과도 더 분명해집니다.
