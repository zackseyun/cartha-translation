  rationale: 수동 미래의 강한 강탈 의미를 살리기 위해, 단순한 분실보다 폭력적·적대적 취지를 드러내는 ‘약탈당하다’를 택했습니다.
- source_word: γυνή
  english_pob_choice: wife
