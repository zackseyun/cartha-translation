  text: The inward parts of a fool are like a cartwheel[a], and his thinking is like a turning axle.
  footnotes:
  - marker: a
    text: Or, more literally, 'the entrails of a fool are like a cartwheel.' The Greek uses bodily imagery for the fool's inner state.
    reason: lexical_alternative
translation:
  language: ko
  text: 어리석은 자의 내장(內臟)은 마차 바퀴 같고, 그의 생각은 도는 축과 같습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 문자적으로, ‘어리석은 자의 창자들은 마차 바퀴와 같다.’ 그리스어는 어리석은 자의 내적 상태를 몸의 이미지로 묘사합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τροχὸς ἁμάξης
  english_pob_choice: a cartwheel
  chosen_korean: 마차 바퀴
  alternatives_korean:
  - 수레바퀴
  - 장바퀴
  lexicon: LSJ
  rationale: τροχός는 ‘바퀴’, ἁμάξης는 ‘마차/수레’의 수식이므로, 구체적인 사물 이미지를 살려 ‘마차 바퀴’로 옮겼습니다. '마차'는 현대 한국어에서 너무 낯설지 않으면서도 고전적 비유감을 유지합니다.
- source_word: σπλάγχνα
  english_pob_choice: the inward parts
  chosen_korean: 내장
  alternatives_korean:
  - 속
  - 내면
  - 창자
  lexicon: LSJ
  rationale: σπλάγχνα는 문자적으로 몸속 장기들을 가리키며, 여기서는 비유의 강한 신체성을 살리는 것이 중요하므로 ‘내장’으로 옮겼습니다. ‘속’이나 ‘내면’은 본문의 육체적 이미지가 약해집니다.
- source_word: μωροῦ
  english_pob_choice: of a fool
  chosen_korean: 어리석은 자의
  alternatives_korean:
  - 우둔한 자의
  - 미련한 자의
  lexicon: LSJ
  rationale: μωρός는 지혜문학에서 도덕적·지적 어리석음을 가리키는 말이므로, 전통적 표현을 피하면서도 의미를 분명히 하는 ‘어리석은 자’로 옮겼습니다.
- source_word: ὡς ἄξων στρεφόμενος
  english_pob_choice: like a turning axle
  chosen_korean: 도는 축과 같습니다
  alternatives_korean:
  - 회전하는 축과 같습니다
  - 빙빙 도는 축과 같습니다
  lexicon: LSJ
  rationale: στρεφόμενος는 계속 도는 동작을 나타내므로, ‘도는 축’으로 간결하게 옮겨 반복적 운동성과 불안정함을 살렸습니다.
theological_decisions:
- issue: 지혜문학의 신체 은유를 얼마나 직접적으로 드러낼지
  chosen_reading: ‘내장’처럼 신체를 직접 가리키는 표현을 유지해, 어리석은 자의 내면 상태를 육체적 혼란의 이미지로 보여 주었습니다.
  alternative_readings:
  - ‘내면’으로 추상화
  - ‘마음’으로 순화
  rationale: 본문은 σπλάγχνα와 ἄξων의 결합으로 내적 상태를 물리적 회전 이미지에 연결하므로, 의미를 완화하지 않고 신체성을 보존하는 편이 원문에 가깝습니다.
  doctrine_reference: 지혜문학의 수사와 인간 내면의 상태 묘사
