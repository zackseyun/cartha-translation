  rationale: 그리스어는 3인칭 단수 동사만 두고 주어를 생략하므로, 한국어 문장 성립을 위해 대명사는 필요하지만 특정 호칭으로 좁히지 않는 것이 원문의 모호성을 보존합니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
