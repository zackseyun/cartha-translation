  text: From them he exalted and sanctified[b][a], and from them he appointed a fixed number of days.
  footnotes:
  - marker: a
    text: Or 'he raised up and made holy'; the Greek verbs can be rendered more literally that way.
    reason: lexical_alternative
  - marker: b
    text: Literally 'into a number of days,' likely meaning an assigned or fixed span of days.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들로부터 그분은 높이시고 거룩하게 하셨으며, 그들로부터 정해진 날들의 수를 세우셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들을 들어 올리고 거룩하게 하셨다’로도 옮길 수 있습니다. 두 동사는 더 직역적으로 렌더링될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘날들의 수 안으로’이며, 아마도 정해진 기간 또는 한정된 일수를 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπ᾽ αὐτῶν
  english_pob_choice: From them
  chosen_korean: 그들로부터
  alternatives_korean:
  - 그들 가운데서
  - 그들 중에서
  lexicon: LSJ
  rationale: ἀπό + 속격은 기본적으로 출처·기원을 나타내므로, ‘그들로부터’가 원문의 separative 의미를 가장 직접적으로 살립니다.
- source_word: ἀνύψωσεν
  english_pob_choice: he exalted
  chosen_korean: 높이시고
  alternatives_korean:
  - 들어 올리시고
  - 높여 주시고
  lexicon: LSJ
  rationale: ἀνυψόω는 ‘높이다/들어 올리다’와 ‘높이다(존귀하게 하다)’를 모두 가질 수 있어, 문맥상 존귀하게 하시는 의미를 살리되 한국어로는 동작성과 존귀함을 함께 담는 ‘높이시고’로 옮겼습니다.
- source_word: ἡγίασεν
  english_pob_choice: sanctified
  chosen_korean: 거룩하게 하셨으며
  alternatives_korean:
  - 성별하셨으며
  - 성화하셨으며
  lexicon: LSJ
  rationale: ἁγιάζω는 ‘거룩하게 하다, 성별하다’의 뜻이므로, 종교적 문맥을 지나치게 축소하지 않으면서도 현대 한국어에서 자연스러운 ‘거룩하게 하셨으며’를 선택했습니다.
- source_word: εἰς ἀριθμὸν ἡμερῶν
  english_pob_choice: a fixed number of days
  chosen_korean: 정해진 날들의 수
  alternatives_korean:
  - 날수의 정해진 수
  - 정한 기간
  lexicon: LSJ
  rationale: 직역하면 ‘날들의 수 안으로/로’이지만, 영어 POB가 보존한 바와 같이 관용적으로는 특정한 기간을 가리키므로 ‘정해진 날들의 수’로 옮겨 시간의 한정성을 드러냈습니다.
