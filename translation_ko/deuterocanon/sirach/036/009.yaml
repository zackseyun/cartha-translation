  text: 그들 가운데서 어떤 이들을 높이시고 거룩하게 하셨으며[a], 그들 가운데서 어떤 이들을 정해진 날수에 두셨습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들을 들어 올리고 거룩하게 하셨다’로 옮길 수 있습니다. 이 두 동사는 더 직역하면 그렇게 번역할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘날들의 수 안으로’입니다. 아마도 배정되거나 정해진 날수, 곧 한정된 기간을 뜻합니다.
    reason: lexical_alternative
