  source_fidelity: 헬라어의 비교 표현(ἡμέρα ἡμέρας ὑπερέχει), 연중 날들의 빛과 해의 공통 근원이라는 대조는 대체로 충실합니다. 다만 본문의 두 절을 질문과 비격식적 덧붙임으로 나누기보다, ‘…인데도’의 양보 관계 안에서 하나의 수사적 질문으로 구성하는 편이 원문의 논리와 문장 기능을 더 정확히 드러냅니다.
  naturalness: ‘것인데요’는 현대 합쇼체 성경 문체에서 다소 구어적이며, 문장 끝의 [a]도 질문의 종결과 주석 연결을 흐리게 합니다. 양보절을 앞세운 한 문장의 질문이 자연스럽고 격식에 맞습니다.
