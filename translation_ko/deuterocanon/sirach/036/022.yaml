    text: 그리스어는 더 일반적으로 ‘경험이 매우 많은 사람이 그에게 응답하거나 갚을 것이다’로도 이해될 수 있습니다. 그 응답의 정확한 뉘앙스는 특정되지 않습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: καρδία
  english_pob_choice: heart
  chosen_korean: 마음
  alternatives_korean:
