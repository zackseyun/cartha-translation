translation:
  language: ko
  text: 굽은 마음은 슬픔을 낳고, 매우 경험이 많은 사람은 그에게 갚아줄 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘비뚤어진’ 혹은 ‘뒤틀린 마음’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어는 더 일반적으로 ‘매우 경험이 많은 사람’ 또는 ‘경험 많은 사람’으로도 이해될 수 있으며, 응답의 정확한 뉘앙스는 특정되지 않습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: καρδία
  english_pob_choice: heart
  chosen_korean: 마음
  alternatives_korean:
  - 심장
  - 속사람
  lexicon: LSJ
  rationale: 지혜문학의 문맥에서 καρδία는 감정과 판단의 중심을 가리키므로, 한국어에서는 자연스럽고 의미가 넓은 ‘마음’으로 옮겼습니다.
- source_word: στρεβλὴ
  english_pob_choice: crooked
  chosen_korean: 굽은
  alternatives_korean:
  - 비뚤어진
  - 뒤틀린
  - 사악한
  lexicon: LSJ
  rationale: 도덕적·성품적 왜곡을 드러내되 과도하게 신학화하지 않기 위해, 물리적 비유를 살리는 ‘굽은’을 택했습니다.
- source_word: πολύπειρος
  english_pob_choice: a very experienced man
  chosen_korean: 매우 경험이 많은 사람
  alternatives_korean:
  - 아주 경험 많은 사람
  - 오랜 경험을 지닌 사람
  - 노련한 사람
  lexicon: LSJ
  rationale: πολύπειρος의 ‘많은 경험을 겪은’ 뉘앙스를 살리기 위해, 간결한 숙련감보다 경험의 축적을 드러내는 표현을 선택했습니다.
- source_word: ἀνταποδώσει αὐτῷ
  english_pob_choice: will repay him
  chosen_korean: 그에게 갚아줄 것입니다
  alternatives_korean:
  - 그에게 되갚을 것입니다
  - 그에게 보답할 것입니다
  - 그에게 응답할 것입니다
  lexicon: LSJ
  rationale: 동사의 상호적·반응적 성격을 유지하되, 무엇을 갚는지는 본문이 특정하지 않으므로 한국어도 그 여지를 남겼습니다.
theological_decisions:
- issue: 수사적·격언적 문맥에서 ἄνθρωπος의 번역
  chosen_reading: 사람
  alternative_readings:
  - 남자
  - 인간
  rationale: 본문은 격언이지만, 한국어 합쇼체 문맥에서는 일반 독해를 위해 성별 표지를 약화한 ‘사람’이 가장 자연스럽습니다. 다만 의미상 단수의 인물을 유지했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
- issue: ἀνταποδώσει의 보상/되갚음의 방향성
  chosen_reading: 갚아줄 것입니다
  alternative_readings:
  - 되갚을 것입니다
  - 보응할 것입니다
  - 응답할 것입니다
  rationale: 그리스어는 반응의 성격만 말하고 그 내용의 선악을 확정하지 않으므로, 본문이 허용하는 중립적 표현을 유지했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 3
