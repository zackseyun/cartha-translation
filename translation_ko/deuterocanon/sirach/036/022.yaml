  - 속사람
  lexicon: LSJ
  rationale: 지혜문학의 문맥에서 καρδία는 감정과 판단의 중심을 가리키므로, 한국어에서는 자연스럽고 의미가 넓은 ‘마음’으로 옮겼습니다.
- source_word: στρεβλὴ
