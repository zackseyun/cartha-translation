base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/036/018.yaml
  text: Give a reward to those who wait for you[a], and let your prophets be trusted. Hear, O Lord[b], the prayer of your suppliants.
  footnotes:
  - marker: a
    text: Or 'to those who endure for you' or 'to those who remain steadfast toward you.' The Greek verb can express both waiting and persevering.
    reason: lexical_alternative
  - marker: b
    text: Or 'let your prophets be trusted' or 'let your prophets be believed.' The Greek is somewhat compressed and may refer either to the prophets' being shown trustworthy or to their receiving trust.
    reason: alternative_reading
translation:
  language: ko
  text: 당신을 기다리는 이들에게[a] 보상을 주시고, 당신의 예언자들이 신뢰받게 하십시오.[b] 주님, 당신께 간청하는 이들의 기도를 들어 주십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신을 위하여 견디는 이들에게’ 또는 ‘당신을 향해 굳게 버티는 이들에게’. 그리스어 동사는 기다림과 인내를 모두 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘당신의 예언자들이 믿을 만한 이들로 드러나게 하십시오’ 또는 ‘당신의 예언자들이 믿어지게 하십시오’. 그리스어 표현은 압축되어 있어, 예언자들이 신뢰할 만하다는 점이 드러나는지, 아니면 그들이 신뢰를 받게 하라는 뜻인지로 이해될 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: δὸς μισθὸν
  english_pob_choice: Give a reward
  chosen_korean: 상을 주십시오
  alternatives_korean:
