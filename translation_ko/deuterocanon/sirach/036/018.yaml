  - 삯을 주십시오
  lexicon: LSJ
  rationale: μισθός는 보상, 삯, 삯품의 뜻이 있으나, 이 기도문에서는 거래적 뉘앙스를 줄이면서도 상응하는 보응을 자연스럽게 드러내는 '상'이 가장 적절합니다.
- source_word: τοῖς ὑπομένουσίν σε
  english_pob_choice: to those who wait for you
  chosen_korean: 당신을 기다리는 이들에게
  alternatives_korean:
  - 당신을 견디는 이들에게
  - 당신을 끝까지 견디는 이들에게
  - 당신 앞에서 인내하는 이들에게
  lexicon: LSJ
  rationale: ὑπομένω는 기다리다, 견디다, 끝까지 버티다의 범위를 가지며, 여기서는 하나님을 향한 신앙적 기대를 담은 '기다리는'이 가장 자연스럽습니다.
- source_word: ἐμπιστευθήτωσαν
  english_pob_choice: let your prophets be trusted
  chosen_korean: 당신의 예언자들이 믿을 만한 사람들로 드러나게 하십시오
  alternatives_korean:
  - 당신의 예언자들이 신뢰받게 하십시오
  - 당신의 예언자들이 믿어지게 하십시오
  - 당신의 예언자들이 신실한 것으로 판명되게 하십시오
  lexicon: LSJ
  rationale: 수동 명령형의 압축된 표현을 한국어에서는 단순 수동보다 결과 상태를 나타내는 '믿을 만한 사람들로 드러나게 하다'로 풀어, 예언의 신뢰성이 확인되는 뉘앙스를 살렸습니다.
- source_word: τῶν ἱκετῶν σου
  english_pob_choice: of your suppliants
  chosen_korean: 당신의 간구하는 이들
  alternatives_korean:
  - 당신께 간청하는 이들
  - 당신께 탄원하는 이들
  lexicon: LSJ
  rationale: ἱκέτης는 간청자, 탄원자를 뜻하지만, 한국어 성경 문맥에서는 격식 있는 '간구하는 이들'이 가장 자연스럽고 원어의 간절한 청원 태도를 보존합니다.
theological_decisions:
- issue: 주님/예언자 호칭의 대상과 어조
  chosen_reading: 예언자와 간구자들을 위한 기도문으로 읽고, 직접 호칭은 하나님께 대한 존대형으로 유지했습니다.
  alternative_readings:
  - 예언자를 '선지자'로 번역하는 전통적 표현
  - 직접 호칭을 '야훼'로 옮기는 방식
  rationale: 이 구절은 기도 형식이므로 하나님께 대한 직접 호칭은 합쇼체 존대형 '주님'으로 처리하고, προφῆται는 문맥상 예언 수행자를 가리켜 '예언자'로 옮기는 편이 원문의 기능을 더 정확히 드러냅니다.
  doctrine_reference: Translation philosophy §§1, 4
