  text: 야곱의 모든 지파를 모으시고, 처음과 같이 그들에게 유업을 나누어 주십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 동사 κατακληρονομήσεις는 드문 말로 상속과 배정의 이미지를 지닙니다. 더 문자적으로는 ‘그들을 유업으로 삼으십시오’라고도 옮길 수 있고, ‘그들에게 유업을 배정해 주십시오’라는 뜻으로도 이해할 수 있습니다.
    reason: lexical_alternative
