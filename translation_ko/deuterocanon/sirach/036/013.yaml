    text: 그리스어 동사 κατακληρονομήσεις는 희귀하며, 문자적으로는 ‘그들을 유업으로 삼으시다/상속하라’는 뉘앙스를 띱니다. 문맥상 여기서는 지파들에게 그들의 몫을 다시 주시는 뜻으로 이해하는 것이 자연스럽습니다.
