  text: A man of understanding will trust in the law, and the law is as trustworthy to him as an oracle of the righteous.
translation:
  language: ko
  text: 지혜 있는 사람은 율법을 신뢰할 것이며, 율법은 의인들의 질문처럼 그에게 신실합니다.[a]
  philosophy: formal
  footnotes:
  - marker: a
    text: 직역하면 “의인들의 질문”이며, 여기서는 그 유비를 그대로 살렸습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄνθρωπος συνετὸς
  english_pob_choice: A man of understanding
  chosen_korean: 지혜 있는 사람
  alternatives_korean:
  - 이해력 있는 사람
  - 분별 있는 사람
  - 슬기로운 사람
  lexicon: ἄνθρωπος / συνετός
  rationale: ἄνθρωπος는 일반적으로 ‘사람’이고, συνετός는 단순 지적 능력보다 분별과 이해를 포함하므로 ‘지혜 있는 사람’으로 자연스럽게 옮겼습니다.
- source_word: ἐμπιστεύσει νόμῳ
  english_pob_choice: will trust in the law
  chosen_korean: 율법을 신뢰할 것이며
  alternatives_korean:
  - 율법을 믿을 것이며
  - 율법에 의지할 것이며
  lexicon: ἐμπιστεύω / νόμος
  rationale: ἐμπιστεύσει는 단순 지식 동의보다 신뢰·의탁의 의미가 강해 ‘신뢰하다’를 택했고, νόμος는 여기서 토라적 ‘율법’이 적절합니다.
- source_word: πιστὸς
  english_pob_choice: trustworthy
  chosen_korean: 신실합니다
  alternatives_korean:
  - 신뢰할 만합니다
  - 믿을 만합니다
  lexicon: πιστός
  rationale: 법이 사람에게 ‘신실하다’는 표현은 상호적 신뢰 관계를 살리며, POB의 trustworthy를 한국어에서 가장 힘 있게 전달합니다.
- source_word: ὡς ἐρώτημα δικαίων
  english_pob_choice: as an oracle of the righteous
  chosen_korean: 의인들의 질문처럼
  alternatives_korean:
  - 의인들의 신탁처럼
  - 의인들의 묻는 바처럼
  - 의인들의 예언처럼
  lexicon: ἐρώτημα / δίκαιος
  rationale: POB의 oracle을 그대로 반영하되, ἐρώτημα의 ‘질문/묻는 것’이라는 형태를 살려 직역적 긴장을 보존했습니다.
theological_decisions:
- issue: ὡς ἐρώτημα δικαίων의 해석
  chosen_reading: ‘의인들의 질문처럼’으로 두어, 본문이 말하는 유비를 ‘신탁/예언’으로 평탄화하지 않고 남겼습니다.
  alternative_readings:
  - ‘의인들의 신탁처럼’
  - ‘의인들의 예언처럼’
  rationale: POB가 oracle을 채택했더라도, 그리스어 원문은 ἐρώτημα를 사용하므로 번역에서 의미의 긴장과 다의성을 보존하는 편이 소스-근거에 더 충실합니다.
  doctrine_reference: '번역 원칙: 원문 어휘의 다의성과 문학적 긴장 보존'
