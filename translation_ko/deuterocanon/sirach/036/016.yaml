  text: Fill Zion with your praises[b][a], and your people with your glory.
  footnotes:
  - marker: a
    text: Or 'Fill Zion with the proclamation of your mighty deeds,' or 'with your excellencies.' The Greek noun can denote praise or the recounting of praiseworthy deeds/virtues.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'and your people from your glory.' In English this is naturally expressed as 'fill your people with your glory.'
    reason: lexical_alternative
translation:
  language: ko
  text: 시온을 당신의 찬양으로 가득 채우고, 당신의 백성을 당신의 영광으로 채우소서.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘찬양’은 ‘그의 위대한 일들’ 또는 ‘그의 탁월하심들’을 드러내어 말하는 뜻도 포함할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 원문은 직역하면 ‘당신의 영광으로부터’이지만, 한국어에서는 ‘당신의 영광으로’가 더 자연스럽습니다.
    reason: lexical_alternative
