  text: A wise man will not hate the law[a], but the one who is hypocritical in it is like a ship in a storm.
  footnotes:
  - marker: a
    text: Or, 'the hypocrite in it is like a ship in a tempest.' The Greek participle can be rendered more compactly as a noun-like expression.
    reason: lexical_alternative
translation:
  language: ko
  text: 지혜로운 사람은 율법[a]을 미워하지 않지만, 율법에 대하여 위선적으로 행동하는 사람은 폭풍 속의 배와 같습니다.
  philosophy: optimal-equivalence
  footnotes:
