translation:
  language: ko
  text: 지혜로운 사람은 율법을 미워하지 않지만, 그 안에서 위선을 행하는 사람은 폭풍 속의 배와 같습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘율법’은 여기서 시라흐의 유대적 지혜문맥에 따른 토라/하나님의 율법을 가리킵니다.
    reason: cross_reference
lexical_decisions:
- source_word: ἀνὴρ σοφὸς
  english_pob_choice: A wise man
  chosen_korean: 지혜로운 사람
  alternatives_korean:
  - 지혜로운 남자
  - 지혜로운 자
  lexicon: LSJ
  rationale: 직역의 남성성은 유지 가능하지만, 한국어에서는 격언체의 일반 인물을 뜻하는 ‘사람’이 자연스럽고 문맥상 대표적 인간을 가리키는 지혜문학의 관용을 잘 살립니다.
- source_word: μισήσει νόμον
  english_pob_choice: will not hate the law
  chosen_korean: 율법을 미워하지 않지만
  alternatives_korean:
  - 율법을 싫어하지 않지만
  - 율법을 경멸하지 않지만
  lexicon: LSJ
  rationale: μισέω의 강한 반의 감정을 살려 ‘미워하다’로 옮겼고, νόμος는 시라흐의 유대적 문맥에 맞게 ‘율법’으로 두었습니다.
- source_word: ὑποκρινόμενος ἐν αὐτῷ
  english_pob_choice: the one who is hypocritical in it
  chosen_korean: 그 안에서 위선을 행하는 사람
  alternatives_korean:
  - 그 안에서 위선자인 사람
  - 그것에 대해 위선적인 사람
  lexicon: LSJ
  rationale: 분사형 ὑποκρινόμενος의 ‘연기하다/가식하다’는 동사를 살리기 위해 정태적 명사보다 행위 표현을 택했고, ἐν αὐτῷ는 앞의 율법을 가리켜 ‘그 안에서’로 간결하게 연결했습니다.
- source_word: ὡς ἐν καταιγίδι πλοῖον
  english_pob_choice: like a ship in a storm
  chosen_korean: 폭풍 속의 배와 같습니다
  alternatives_korean:
  - 폭풍 속의 배처럼
  - 광풍 속의 배와 같습니다
  lexicon: LSJ
  rationale: καταιγίς의 강한 풍랑 이미지를 한국어 현대어에서 자연스럽고 분명한 ‘폭풍’으로 옮기고, πλοῖον은 위엄 있는 비유에 맞는 ‘배’로 처리했습니다.
