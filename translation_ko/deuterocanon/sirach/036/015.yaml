lexical_decisions:
- source_word: οἰκτείρησον
  english_pob_choice: Have compassion
  chosen_korean: 불쌍히 여기소서
  alternatives_korean:
  - 자비를 베푸소서
  - 긍휼을 베푸소서
  lexicon: BDAG
  rationale: 간구형 명령으로서의 애끓는 연민을 살리기 위해 ‘불쌍히 여기소서’를 택했습니다. ‘자비/긍휼’은 교회어로는 자연스럽지만, 여기서는 대상의 비참함을 직접 마주하는 감정이 더 앞섭니다.
- source_word: ἁγιάσματός
  english_pob_choice: your sanctuary
  chosen_korean: 성소의
  alternatives_korean:
  - 거룩한 곳의
  - 성역의
  lexicon: LSJ
  rationale: ἁγίασμα는 거룩하게 구별된 장소를 가리키므로, 예루살렘을 하나님의 거룩한 임재와 연결하는 ‘성소’가 가장 간결하고 원문에 충실합니다.
- source_word: καταπαύματός
  english_pob_choice: your dwelling place
  chosen_korean: 거처의
  alternatives_korean:
  - 안식처의
  - 머무시는 곳의
  - 안식의
  lexicon: LSJ
  rationale: κατάπαυμα의 핵심은 ‘쉬는 자리/머무는 곳’이므로, 예루살렘을 하나님의 거처로 보는 이미지를 살려 ‘거처’로 옮겼습니다. ‘안식처’는 현대 한국어에서 정서적 뉘앙스가 더 강해 약간 좁습니다.
- source_word: Ἰερουσαλήμ
  english_pob_choice: Jerusalem
  chosen_korean: 예루살렘
  alternatives_korean:
  - 예루살렘
  lexicon: 고유명사 표기
  rationale: 통용 표기를 따랐습니다.
theological_decisions:
- issue: 예루살렘을 두 개의 병렬 구문으로 어떻게 보존할지
  chosen_reading: 예루살렘은 ‘주님의 성소의 도시’이면서 동시에 ‘주님의 거처의 도시’로 병렬 제시합니다.
  alternative_readings:
  - 주님의 거룩한 도시 예루살렘, 주님의 거처
  - 성소와 거처를 한데 묶어 ‘주님의 거룩한 거처의 도시’로 통합
  rationale: 원문은 두 개의 소유격 구문으로 예루살렘의 정체성을 중첩해서 말하므로, 이를 하나로 합치지 않고 각각 드러냈습니다. 이는 예루살렘을 하나님의 거룩한 임재와 선택된 거처의 장소로 함께 이해하게 합니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
