  source_fidelity: 핵심 대조와 덕목(ἔλεος, πραΰτης)은 대체로 충실합니다. 다만 αὐτῆς는 여성 소유격인데 본문의 ‘그’와 ‘그의’는 한국어에서 남성으로도 읽힐 수 있으므로 지시 대상을 분명히 해야 합니다. 또한 현 주석 a는 그리스어 부정문(οὐκ ἔστιν)을 빠뜨리고 ‘같다’라고 하여 원문과 맞지 않습니다.
  naturalness: ‘혀 위에’는 그리스어의 신체 이미지를 지나치게 기계적으로 옮긴 표현입니다. ‘혀에’는 이미지를 보존하면서도 자연스럽습니다. ‘사람의 아들들과 같지 않습니다’는 다소 낯설지만, 원문의 의도적인 관용적·고풍스러운 표현을 보존할 수 있으며 주석으로 뜻을 밝혀 줄 수 있습니다.
  terminology: ‘자비’와 ‘온유’는 각각 ἔλεος와 πραΰτης에 적절합니다. ‘그녀의’로 고쳐 여성 지시어와 ‘그녀의 남편’이라는 결혼 문맥을 명료하게 해야 합니다.
