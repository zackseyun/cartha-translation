    rationale: 원문은 같은 여성을 가리켜 ‘그녀의 혀’와 ‘그녀의 남편’이라고 합니다. 표준 현대 한국어에서는 ‘그의’가 남성으로도 해석되므로 ‘그녀의’가 안전합니다.
