  rationale: 여기서는 성품의 덕을 가리키므로, 한국어 성경에서 널리 쓰이는 ‘온유’가 원문의 덕목적 뉘앙스를 가장 잘 살립니다.
- source_word: καθʼ υἱοὺς ἀνθρώπων
  english_pob_choice: like the sons of men
  chosen_korean: 사람의 아들들과 같지 않습니다
  alternatives_korean:
