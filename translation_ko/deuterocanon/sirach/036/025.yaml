  - 사람들과 같지 않습니다
  - 인간들과 같지 않습니다
  lexicon: LSJ
  rationale: 남성형의 관용구를 지우지 않고 유지하되, 한국어에서는 자연스럽게 ‘사람의 아들들’로 옮겨 원문의 표현성과 불편한 직역성을 함께 드러냈습니다.
theological_decisions:
- issue: 남성형 관용구 καθʼ υἱοὺς ἀνθρώπων의 처리
  chosen_reading: 본문에는 ‘사람의 아들들과 같지 않습니다’로 두어 원문의 남성형 표현을 유지했습니다.
  alternative_readings:
  - ‘다른 남자들과 같지 않습니다’로 자연화
  - ‘사람들과 같지 않습니다’로 중성화
  rationale: 원문 자체가 남성형 관용구이므로 이를 평탄화하지 않고 보존했습니다. 문맥상 뜻은 ‘보통 사람들과 다르다’이지만, 본문은 원형을 유지하고 독자가 의미를 추적할 수 있게 했습니다.
