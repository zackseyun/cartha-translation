base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/036/025.yaml
  text: If there is mercy and gentleness on her tongue[b][a], her husband is not like the sons of men.
  footnotes:
  - marker: a
    text: Or, more idiomatically, 'her husband is not like other men.' The Greek says 'the sons of men,' a masculine proverbial expression.
    reason: lexical_alternative
  - marker: b
    text: The Greek text here is somewhat awkward in expression; the sense is that a wife whose speech is marked by mercy and gentleness makes her husband exceptional.
    reason: cultural_note
translation:
  language: ko
  text: 만일 그 혀 위에 자비와 온유가 있으면, 그의 남편은 사람의 아들들과 같지 않습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그의 남편은 사람의 아들들과 같다’는 뜻이지만, 문맥상 ‘그의 남편은 다른 남자들과 같지 않다’는 의미로 이해됩니다.
    reason: alternative_reading
  - marker: b
    text: 그리스어 표현은 다소 어색하지만, 자비와 온유가 깃든 말은 남편을 남다르게 만든다는 뜻입니다.
    reason: source_note
