base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/036/014.yaml
  text: Have mercy on the people, O Lord, who are called by your name, and on Israel, whom you likened to a firstborn son.
  footnotes:
  - marker: a
    text: Or, 'Israel, whom you made your firstborn,' reflecting the broader biblical theme of Israel as God's firstborn son (compare Exod 4:22). The Greek here more literally says 'whom you likened to a firstborn.'
    reason: alternative_reading
translation:
  language: ko
  text: 주님, 주님의 이름으로 불리는 백성에게, 그리고 주님께서 맏아들과 같게 하신 이스라엘에게 자비를 베푸소서.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “맏아들로 삼으신 이스라엘”로 옮길 수 있습니다. 그리스어는 더 직접적으로 “맏아들과 같게 하신”에 가깝습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐλέησον
  english_pob_choice: Have mercy
  chosen_korean: 자비를 베푸소서
  alternatives_korean:
  - 긍휼을 베푸소서
  - 불쌍히 여기소서
  lexicon: BDAG
  rationale: aorist imperative ἐλεέω의 간구를 한국어 기도체로 자연스럽게 살리되, 단순 감정이 아니라 실제로 자비를 행해 달라는 요청을 드러냅니다.
- source_word: λαόν
  english_pob_choice: the people
  chosen_korean: 백성
  alternatives_korean:
  - 그 백성
  - 주님의 백성
  lexicon: BDAG
  rationale: 그리스어에는 소유격이 없으므로 ‘주님의’를 덧붙이지 않고, 뒤의 ‘주님의 이름으로 불린’ 구절이 누구를 가리키는지 규정하도록 두었습니다.
- source_word: κεκλημένον ἐπʼ ὀνόματί σου
  english_pob_choice: who are called by your name
  chosen_korean: 주님의 이름으로 불린
  alternatives_korean:
  - 주님의 이름으로 불리운
  - 주님의 이름에 속한
  - 주님의 이름을 지닌
  lexicon: BDAG
  rationale: ‘이름 위에 불리다’는 언약적 소속과 명명 관계를 뜻하므로, 직역에 가까운 수동 표현으로 옮겼습니다.
- source_word: πρωτόγονον ὡμοίωσας
  english_pob_choice: whom you likened to a firstborn son
  chosen_korean: 한 맏아들과 같게 여기신
  alternatives_korean:
  - 맏아들과 같게 하신
  - 맏아들로 삼으신
  - 첫째 난 아들처럼 만드신
  lexicon: LSJ
  rationale: ὡμοίωσας의 비교·유사화 의미를 살려 ‘같게 여기다’로 옮기고, πρωτόγονον은 ‘맏아들’로 번역해 혈연적 비유를 유지했습니다.
theological_decisions:
- issue: 마지막 절이 이스라엘을 실제로 ‘하나님의 맏아들’로 선언하는지, 아니면 맏아들과 닮게 비교하는지
  chosen_reading: 본문의 비교적 힘을 따라 ‘한 맏아들과 같게 여기신’으로 두어, 동일시를 과도하게 확정하지 않았습니다.
  alternative_readings:
  - 맏아들로 삼으신
  - 주님의 맏아들인 이스라엘
  rationale: 그리스어 ὁμοιόω는 기본적으로 ‘같게 하다, 비유하다’의 의미이므로, 본문이 지닌 긴장을 보존하는 것이 원문 우선 원칙에 부합합니다.
  doctrine_reference: 원문 비교적 표현 보존; 출애굽기 4:22와의 신학적 조화를 번역에서 미리 확정하지 않음.
