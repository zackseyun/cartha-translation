revisions:
- from: 목구멍은 사냥한 음식의 맛을 보고, 지혜로운 마음은 거짓 말을 분별합니다.[a][b]
  to: 목구멍은 사냥에서 얻은 음식을 맛보고, 분별 있는 마음은 거짓된 말을 분별합니다.[a][b]
  rationale: 원문의 비교 구조와 둘째 절의 동사 생략을 유지하되, 한국어에서 불명료한 ‘사냥한 음식’을 출처 관계가 분명한 표현으로 고쳤습니다. 또한 비교사 οὕτως를 각주에서 ‘이와 같이’로 정확히 반영하고, συνετή의 식별·판단 뉘앙스를 ‘분별 있는’으로 드러냈습니다.
  reviewer_model: gpt-5.6-terra
