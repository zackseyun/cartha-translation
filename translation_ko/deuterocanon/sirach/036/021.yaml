  - severity: low
    issue: 각주 a의 접속 표현
    rationale: οὕτως는 결론을 이끄는 ‘그러므로’보다 비교를 나타내는 ‘이와 같이’입니다. 각주도 원문의 비교 구조를 그대로 밝혀야 합니다.
  - severity: low
    issue: συνετή의 번역
    rationale: ‘지혜로운’도 가능한 번역이나, 이 격언에서 맛으로 시험하는 행위와 상응하는 판단·식별 능력을 나타내려면 ‘분별 있는’이 더 직접적입니다.
