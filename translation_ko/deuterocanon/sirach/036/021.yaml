    text: 그리스어는 문자적으로 ‘목구멍은 사냥에서 얻은 음식들을 맛보고, 이와 같이 분별 있는 마음은 거짓된 말들을 [맛본다/분별한다]’에 가깝습니다. 둘째 절의 대응 동사는 생략되어 있습니다.
    reason: source_note
  - marker: b
    text: ‘사냥에서 얻은 음식’은 ‘사냥감’ 또는 ‘사냥의 음식’으로도 옮길 수 있습니다.
    reason: alternative_reading
