  text: 목구멍은 사냥한 음식의 맛을 보고, 지혜로운 마음은 거짓 말을 분별합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 문자적으로 ‘목구멍은 사냥의 음식들을 맛본다, 그러므로 지혜로운 마음은 거짓 말들’에 가깝고, 둘째 절의 대응 동사는 생략되어 있습니다.
    reason: source_note
  - marker: b
    text: ‘사냥한 음식’은 ‘사냥감’ 또는 ‘사냥으로 얻은 음식’으로도 옮길 수 있습니다.
