theological_decisions:
- issue: 비교절의 생략된 후행 동사
  chosen_reading: 둘째 절에 대응하는 동사를 한국어에서 ‘분별합니다’로 보충해, 첫 절의 ‘맛을 보고’와 짝을 이루는 지혜 격언의 대구를 분명히 했습니다.
  alternative_readings:
  - 거짓 말을 [그렇게] 합니다
  - 거짓 말을 압니다
  - 거짓 말을 판단합니다
  rationale: 그리스어 본문은 비교 구문 뒤에 대응 동사를 직접 제시하지 않아, 한국어에서는 의미를 완결하는 보충이 필요합니다. ‘분별합니다’는 지혜문학의 판단 행위를 자연스럽게 드러냅니다.
  doctrine_reference: 지혜문학의 수사적 평행법
- issue: καρδία συνετή의 인지적 중심
  chosen_reading: ‘마음’을 이해와 판단의 자리로 유지했습니다.
  alternative_readings:
  - 지성
  - 생각
  - 속사람
  rationale: 히브리적 인간 이해에서 ‘마음’은 단순 감정이 아니라 판단과 분별의 중심이므로, 이를 살려 원문의 인류학적 이미지를 보존했습니다.
  doctrine_reference: 구약적 마음 이해
