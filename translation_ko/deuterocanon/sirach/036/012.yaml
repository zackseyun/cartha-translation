  source_fidelity: 핵심 어휘와 의미 방향은 대체로 맞지만, σύντριψον은 ‘짓밟다’보다 ‘부수다/짓부수다’가 더 직접적으로 대응합니다. 또한 현재 문장의 끝맺음은 명령문 뒤에 서술격 표현이 붙어 원문의 관계절 구조와 문장 의미를 훼손합니다.
  naturalness: ‘…머리를 짓밟으소서…, 「…」라고 말하는 자들입니다’는 현대 한국어 문장으로 비문에 가깝습니다. 관계절을 ‘적 통치자들’에 직접 연결해야 합니다. ‘적들의 통치자들’도 가능하나 ‘적 통치자들’이 더 자연스럽습니다.
  terminology: ἄρχων은 ‘통치자’, ἐχθρῶν은 ‘적’으로 옮기는 것이 적절합니다. κεφαλάς의 구체적 이미지는 ‘머리’를 유지해 보존했습니다. 본문에 없는 하나님 언급은 추가하지 않았습니다.
