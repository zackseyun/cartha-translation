  text: Crush the heads of enemy rulers[a], who say, “There is no one but us.”
  footnotes:
  - marker: a
    text: Or, “There is none besides us.” The Greek wording expresses exclusive self-exaltation; some readers may hear a stronger claim of quasi-divine arrogance, but 'God' is not stated in the text.
    reason: lexical_alternative
translation:
  language: ko
  text: 적들의 통치자들의 머리를 짓밟으소서[a], 「우리 외에는 아무도 없다」라고 말하는 자들입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, 「우리 외에는 아무도 없다」. 그리스어 표현은 배타적 자기과시를 드러내며, 어떤 독자들은 더 강한 준신적 오만으로 들을 수 있지만, 본문에는 '하나님'이 나오지 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: σύντριψον
  english_pob_choice: Crush
  chosen_korean: 짓밟으소서
  alternatives_korean:
  - 부수소서
  - 짓이기소서
  lexicon: LSJ
  rationale: aorist imperative συντρίβω의 강한 파괴적 명령을 한국어로 자연스럽게 옮겼습니다. '짓밟다'는 폭력성과 압박감을 살리면서도 합쇼체 명령으로 유지하기에 적절합니다.
- source_word: κεφαλὰς
  english_pob_choice: heads
  chosen_korean: 머리들을
  alternatives_korean:
  - 머리
  - 수뇌를
  lexicon: LSJ
  rationale: 복수 목적어의 구체적 신체 이미지를 그대로 살렸습니다. 은유적으로 완화한 '수뇌'보다 원문의 생생함을 유지하는 것이 적절합니다.
- source_word: ἀρχόντων ἐχθρῶν
  english_pob_choice: enemy rulers
  chosen_korean: 적들의 통치자들
  alternatives_korean:
  - 원수의 통치자들
  - 적의 지도자들
  lexicon: LSJ
  rationale: ἄρχων은 권세 있는 지배자를 가리키므로 '통치자들'이 적절합니다. ἐχθρῶν은 그들이 적대 집단에 속함을 나타내므로 '적들의'로 연결해 원문의 소유/관계 구문을 보존했습니다.
- source_word: λεγόντων Οὐκ ἔστιν πλὴν ἡμῶν
  english_pob_choice: who say, “There is no one but us.”
  chosen_korean: 「우리 외에는 아무도 없다」라고 말하는 자들입니다.
  alternatives_korean:
  - 「우리뿐이다」라고 말하는 자들입니다.
  - 「우리 외에는 아무도 없다」라고 하는 자들입니다.
  lexicon: LSJ
  rationale: λεγοντων의 설명적 분사를 관계절로 풀어 자연스럽게 옮겼습니다. Οὐκ ἔστιν πλὴν ἡμῶν은 배타적 자기과시를 나타내므로 '우리 외에는 아무도 없다'가 가장 직접적입니다.
theological_decisions:
- issue: 원문에 없는 신적 언급 여부
  chosen_reading: 문장을 '우리 외에는 아무도 없다'로 옮겨, 본문에 없는 '하나님'을 덧붙이지 않았습니다.
  alternative_readings:
  - 우리 외에는 하나님이 없다
  - 우리뿐이며 다른 이는 없다
  rationale: 그리스어 본문은 배타적 자기고양을 말하지만 '하나님'은 명시하지 않습니다. 따라서 원문이 허용하는 범위를 넘지 않도록 유지했습니다.
  doctrine_reference: Translation philosophy §§1, 3
