  lexicon: LSJ
  rationale: σύνδησον의 ‘묶다/함께 묶다’라는 비유를 살리면서, παιδείαν을 문맥상 답변을 위해 정돈된 가르침으로 이해해 ‘가르침’으로 옮겼습니다.
- source_word: ἀποκρίθητι
