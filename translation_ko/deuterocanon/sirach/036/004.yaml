translation:
  language: ko
  text: 말[a]을 준비하십시오. 그러면 사람들이 당신의 말을 들을 것입니다. 가르침을 한데 묶고 대답하십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘한 마디’ 또는 ‘연설’로 옮길 수 있습니다. 그리스어 λόγον은 단수이며, σύνδησον παιδείαν은 직역하면 ‘가르침을 함께 묶어’이고, ‘가르침을 정리하여’로 더 해석적으로 옮길 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑτοίμασον
