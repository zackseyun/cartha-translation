  text: Prepare your words[a], and then you will be heard; bind together instruction, and answer.
  footnotes:
  - marker: a
    text: Or 'Prepare a word/speech, and in this way you will be heard; gather instruction together, and reply.' The Greek λόγον may be singular ('a word' or 'a speech'), and σύνδησον παιδείαν is a metaphor that could be rendered more interpretively as 'organize instruction.'
    reason: lexical_alternative
translation:
  language: ko
  text: 당신의 말을 준비하십시오. 그러면 들릴 것입니다. 가르침을 하나로 묶어, 대답하십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신의 말을 준비하십시오… 가르침을 모아, 대답하십시오.’ λόγον은 ‘한 말씀’ 또는 ‘연설’일 수도 있고, σύνδησον παιδείαν은 ‘가르침을 정리하라’는 보다 해석적인 뜻으로 옮길 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἑτοίμασον
  english_pob_choice: Prepare
  chosen_korean: 준비하십시오
  alternatives_korean:
  - 마련하십시오
  - 갖추십시오
  lexicon: LSJ
  rationale: aorist imperative ἑτοιμάζω의 촉구를 한국어에서 가장 자연스럽게 살리면서, 즉각적이되 단정적인 명령을 유지합니다.
- source_word: λόγον
  english_pob_choice: your words
  chosen_korean: 당신의 말
  alternatives_korean:
  - 당신의 말씀
  - 당신의 말들
  - 한마디
  lexicon: LSJ
  rationale: λόγος는 여기서 발화 전체를 가리키므로, 복수형으로 기계적으로 옮기기보다 ‘말’로 옮겨 준비된 발화를 자연스럽게 드러냅니다.
- source_word: σύνδησον παιδείαν
  english_pob_choice: bind together instruction
  chosen_korean: 가르침을 하나로 묶어
  alternatives_korean:
  - 가르침을 모아
  - 가르침을 묶어
  - 훈계를 정리하여
  lexicon: LSJ
  rationale: σύνδησον의 ‘묶다/함께 묶다’라는 비유를 살리면서, παιδείαν을 문맥상 답변을 위해 정돈된 가르침으로 이해해 ‘가르침’으로 옮겼습니다.
- source_word: ἀποκρίθητι
  english_pob_choice: answer
  chosen_korean: 대답하십시오
  alternatives_korean:
  - 답하십시오
  - 응답하십시오
  lexicon: LSJ
  rationale: 짧은 훈계문맥에서 가장 직접적인 한국어 명령형을 사용해, 준비된 말과 이어지는 응답의 요청을 분명히 합니다.
theological_decisions:
- issue: 훈계문의 명령형 어조
  chosen_reading: 지혜문학의 일반적 교훈으로 보아, 한국어도 직접적인 명령문을 유지했습니다.
  alternative_readings:
  - 권고형으로 완화하여 번역
  - 서술형으로 풀어 번역
  rationale: 본문은 수사적 교훈을 주는 명령문이므로, 과도한 완화 없이 청자에게 직접 말하는 형식을 보존하는 것이 원문 효과에 가깝습니다.
  doctrine_reference: 지혜문학의 교훈적 장르와 수사적 명령
- issue: σύνδησον παιδείαν의 은유
  chosen_reading: ‘가르침을 하나로 묶어’로 직역에 가까운 은유를 유지했습니다.
  alternative_readings:
  - ‘가르침을 정리하여’로 의역
  - ‘훈계를 모아’로 완화
  rationale: 원문은 답변을 위해 지식을 ‘묶는’ 이미지가 있으므로, 그 비유적 긴장을 지우지 않고 한국어에서도 보이게 했습니다.
  doctrine_reference: 문학적 은유 보존 원칙
