base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/036/028.yaml
  text: For who will trust a well-armed robber[b][a], staggering from city to city? So it is with a man who has no nest and lodges wherever night finds him.
  footnotes:
  - marker: a
    text: Or 'well-girded robber'—the Greek adjective literally refers to being well belted or equipped for action.
    reason: lexical_alternative
  - marker: b
    text: '''No nest'' preserves the Greek metaphor of a bird without a settled resting place; the sense is a man with no secure home.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 누가 허리띠를 단단히 맨 강도[a]를 믿겠습니까? 그는 이 도시에서 저 도시로 비틀거리며 다니지 않습니까? 이와 같이 보금자리[b]가 없는 사람은, 밤이 그를 찾아내는 곳마다 머뭅니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘잘 띤/잘 허리띠를 맨’에 가깝습니다. 무장한 강도의 준비 상태를 드러내기 위해 본문에서는 자연스럽게 풀었습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘보금자리’는 그리스어의 새 둥지 이미지를 보존한 표현입니다. 뜻은 정착된 거처가 없다는 말입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐζώνῳ
  english_pob_choice: well-armed
  chosen_korean: 허리띠를 단단히 맨
  alternatives_korean:
  - 잘 무장한
  - 잘 띤
  lexicon: LSJ
  rationale: εὐζώνῳ는 문자적으로 ‘잘 띠를 맨’에 가깝고, 무장한 강도라는 문맥을 살리면서도 한국어에서 자연스럽게 행동 준비 상태를 드러내기 위해 ‘허리띠를 단단히 맨’으로 옮겼습니다.
- source_word: λῃστῇ
  english_pob_choice: robber
  chosen_korean: 강도
  alternatives_korean:
