  - 산적
  lexicon: LSJ
  rationale: λῃστής는 단순한 절도범보다 폭력적 약탈자를 가리키므로, 문맥상 ‘강도’가 가장 직접적입니다.
- source_word: σφαλλομένῳ ἐκ πόλεως εἰς πόλιν
  english_pob_choice: staggering from city to city
  chosen_korean: 이 도시에서 저 도시로 비틀거리며 다니지
  alternatives_korean:
  - 이 도시에서 저 도시로 헤매며 다니지
  - 이 도시에서 저 도시로 흔들리며 다니지
  lexicon: LSJ
  rationale: σφαλλομένῳ는 단순 이동보다 비틀거림, 불안정함, 발 디딤의 흔들림을 담으므로 ‘비틀거리며’가 이미지와 경고성을 함께 보존합니다.
- source_word: νοσσιὰν
  english_pob_choice: nest
  chosen_korean: 보금자리
  alternatives_korean:
  - 둥지
  - 안식처
  lexicon: LSJ
  rationale: νοσσιά는 새의 둥지/번식처를 뜻하지만, 한국어에서는 ‘보금자리’가 비유를 유지하면서도 정착된 거처의 의미를 자연스럽게 전달합니다.
- source_word: καταλύοντι οὗ ἐὰν ὀψίσῃ
  english_pob_choice: lodges wherever night finds him
  chosen_korean: 밤이 그를 찾아내는 곳마다 머뭅니다
  alternatives_korean:
  - 밤이 그를 만나는 곳마다 묵습니다
  - 해가 저물면 닿는 곳마다 머뭅니다
  lexicon: LSJ
  rationale: καταλύοντι는 하룻밤 묵는 것을 뜻하고, οὗ ἐὰν ὀψίσῃ는 ‘저녁/밤이 그를 맞닥뜨리는 곳마다’라는 불안정한 유랑을 나타내므로 이를 자연스럽게 풀었습니다.
theological_decisions:
- issue: 비유의 보존과 평이한 의미 전달
  chosen_reading: ‘보금자리’와 ‘밤이 그를 찾아내는 곳마다’로, 정착처 없음과 유랑의 불안을 함께 드러냈습니다.
  alternative_readings:
  - ‘집이 없는 사람은 어디서든 머문다’로 평이화
  - ‘둥지가 없는 사람은 밤마다 떠돈다’로 직역화
  rationale: 지혜문학의 속담적 이미지를 너무 평이하게 눌러버리면 원문의 경구적 날카로움이 약해지므로, 은유를 유지하되 한국어로 읽히게 했습니다.
  doctrine_reference: 잠언적/지혜문학의 비유 해석 원칙
- issue: 수사적 질문의 강도
  chosen_reading: ‘누가 … 믿겠습니까?’로 수사적 질문을 유지했습니다.
  alternative_readings:
  - ‘아무도 … 믿지 않을 것입니다’로 서술화
  - ‘누가 … 믿겠습니까’에서 어조를 약화
  rationale: τίς γὰρ πιστεύσει는 단순 정보가 아니라 신뢰 불가능성을 강조하는 반문이므로, 한국어에서도 질문 형식을 유지해야 경고의 힘이 살아납니다.
  doctrine_reference: 수사적 질문 보존 원칙
