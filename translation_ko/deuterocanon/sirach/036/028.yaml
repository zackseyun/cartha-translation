- from: 그러므로 누가 허리띠를 단단히 맨 강도[a]를 믿겠습니까? 그는 이 도시에서 저 도시로 비틀거리며 다니지 않습니까? 이와 같이 보금자리[b]가 없는 사람은, 밤이 그를 찾아내는 곳마다 머뭅니다.
  to: 도시에서 도시로 비틀거리며 다니는 잘 무장한 강도[a]를 누가 믿겠습니까? 보금자리[b]가 없고 밤이 그를 맞닥뜨리는 곳마다 묵는 사람도 그와 같습니다.
  rationale: The revision restores the Greek syntax as one rhetorical question, avoids reversing γάρ’s explanatory relation, and explicitly expresses the οὕτως comparison. It retains the instability conveyed by σφαλλομένῳ, the nest metaphor, and the lodging-at-night idiom without adding interpretive doctrine.
