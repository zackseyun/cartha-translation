review_pass:
  verdict: revise
  source_fidelity: The draft incorrectly divides the Greek’s single rhetorical question into two questions and changes the participial description (‘staggering from city to city’) into an independent rhetorical assertion. It also renders γάρ (‘for’) as ‘therefore,’ reversing its connective force. The comparison introduced by οὕτως is better made explicit in Korean as ‘that person is likewise so.’
  naturalness: The proposed revision is idiomatic modern formal Korean and retains the proverb-like rhetorical force. ‘밤이 그를 맞닥뜨리는 곳마다 묵는’ naturally conveys lodging wherever evening/night overtakes him.
  terminology: ‘강도’ accurately renders λῃστής. ‘잘 무장한’ follows the English audit trail’s contextual sense of εὐζώνῳ while a note preserves the literal ‘well-girded’ sense. ‘보금자리’ suitably retains the bird-nest metaphor of νοσσιά.
  issues:
  - severity: high
    issue: The first clause is split into two questions.
    rationale: τίς γὰρ πιστεύσει governs both εὐζώνῳ λῃστῇ and the participle σφαλλομένῳ ἐκ πόλεως εἰς πόλιν. The draft’s second question (‘그는 … 다니지 않습니까?’) adds a separate assertion not present in the Greek.
  - severity: medium
    issue: ‘그러므로’ mistranslates γάρ.
    rationale: γάρ is explanatory (‘for’), not inferential (‘therefore’). In Korean it may be left implicit rather than replaced with an adversative or inferential connector.
  - severity: medium
    issue: The comparison in the second sentence is incomplete.
    rationale: 'οὕτως introduces the stated analogy: the person without a nest and lodging wherever night overtakes him is likewise untrustworthy/like the robber. ‘이와 같이’ alone leaves the comparison syntactically and semantically underexpressed.'
  revised_text: 도시에서 도시로 비틀거리며 다니는 잘 무장한 강도[a]를 누가 믿겠습니까? 보금자리[b]가 없고 밤이 그를 맞닥뜨리는 곳마다 묵는 사람도 그와 같습니다.
  revised_footnotes:
  - marker: a
    text: 그리스어는 직역하면 ‘잘 띠를 맨’ 또는 ‘잘 갖춘’이라는 뜻입니다. 여기서는 행동할 준비가 된 모습을 가리키므로 ‘잘 무장한’으로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘보금자리’는 그리스어의 새 둥지 이미지를 보존한 표현입니다. 정착된 거처가 없다는 뜻을 나타냅니다.
    reason: lexical_alternative
  revision_rationale: The revision restores the Greek syntax as one rhetorical question, avoids reversing γάρ’s explanatory relation, and explicitly expresses the οὕτως comparison. It retains the instability conveyed by σφαλλομένῳ, the nest metaphor, and the lodging-at-night idiom without adding interpretive doctrine.
