  terminology: ‘불 같은 진노’, ‘살아남은 자’, ‘당신의 백성에게 불의를 행하는 자들’, ‘멸망’은 원문의 심판 이미지와 주요 용어를 적절히 반영합니다. 각주 표지는 해당 난해한 분사구 바로 뒤에 두어 참조 범위를 명확히 해야 합니다.
