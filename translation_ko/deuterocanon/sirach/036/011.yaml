  source_fidelity: 개정이 필요합니다. 초안의 ‘불의한 진노’는 ‘unrighteous wrath’, 곧 도덕적으로 불의한 진노를 뜻하게 되어, πυρός(‘불의’)를 잘못 옮깁니다. ‘불 같은 진노’는 ἐν ὀργῇ πυρός의 불 이미지와 격렬한 심판의 진노를 자연스럽게 보존합니다. ὁ σωζόμενος의 문맥상 의미는 ‘살아남은 자’로 유지하되, 각주에서 더 문자적인 가능성을 밝혀 두는 것이 적절합니다. 두 청원문의 기원·명령적 힘도 보존되었습니다.
