  text: In fiery wrath let the survivor be consumed[a], and let those who do injustice to your people meet destruction.
  footnotes:
  - marker: a
    text: Or, more literally, 'the one being saved/preserved.' The Greek phrase is difficult in context and may refer to any enemy who has thus far escaped destruction.
    reason: lexical_alternative
translation:
  language: ko
  text: 불의한 진노 가운데 살아남은 자가 삼켜지게 하시고, 당신의 백성에게 불의를 행하는 자들은 멸망을 만나게 하소서.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 문자적으로, ‘구원받고/보존되는 자’. 그리스어 표현은 문맥상 난해하며, 이미 파멸을 피한 어떤 적을 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ὀργῇ πυρὸς
  english_pob_choice: In fiery wrath
  chosen_korean: 불의한 진노 가운데
  alternatives_korean:
  - 불 같은 진노 가운데
  - 불의 진노 가운데
  lexicon: LSJ
  rationale: 그리스어의 ‘불’ 이미지를 살리되 한국어에서는 ‘불의한 진노’로 압축해 심판의 격렬함을 자연스럽게 드러냈습니다.
- source_word: καταβρωθήτω
  english_pob_choice: let ... be consumed
  chosen_korean: 삼켜지게 하시고
  alternatives_korean:
  - 소멸되게 하시고
  - 먹혀 없어지게 하시고
  lexicon: LSJ
  rationale: 소극태 명령의 파괴적 뉘앙스를 한국어 동사 ‘삼키다’로 살려 불의 심판의 이미지를 보존했습니다.
- source_word: ὁ σωζόμενος
  english_pob_choice: the survivor
  chosen_korean: 살아남은 자
  alternatives_korean:
  - 구원받고 있는 자
  - 보존되는 자
  - 남은 자
  lexicon: LSJ
  rationale: 문맥상 이미 파멸을 피한 사람을 가리키므로, 직역성의 긴장을 유지하면서도 문맥에 맞는 ‘살아남은 자’로 옮겼습니다.
- source_word: οἱ ἀδικοῦντες τὸν λαόν σου
  english_pob_choice: those who do injustice to your people
  chosen_korean: 당신의 백성에게 불의를 행하는 자들
  alternatives_korean:
  - 당신의 백성을 해치는 자들
  - 당신의 백성을 학대하는 자들
  lexicon: LSJ
  rationale: ἀδικεῖν의 기본 의미를 따라 ‘불의를 행하다’로 두어, 단순한 감정적 해악보다 불의한 행위 자체를 강조했습니다.
- source_word: εὕροισαν ἀπώλειαν
  english_pob_choice: meet destruction
  chosen_korean: 멸망을 만나게 하소서
  alternatives_korean:
  - 파멸을 맞게 하소서
  - 멸망을 얻게 하소서
  lexicon: LSJ
  rationale: ‘찾다/만나다’의 뜻을 살리면서도 한국어 기도문 맥락에 맞게 ‘멸망을 만나게 하소서’로 자연화했습니다.
