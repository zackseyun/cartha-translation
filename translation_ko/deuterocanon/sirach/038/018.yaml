translation:
  language: ko
  text: 슬픔에서 재앙이 나옵니다.[a] 그러므로 괴로운 마음은 슬픔으로 쇠합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 “슬픔에서 죽음이 나오며, 마음의 슬픔이 힘을 꺾는다”라고 합니다. 히브리어는 ‘죽음’ 대신 ‘재앙’을 말하므로, 본문은 히브리어 증거를 따릅니다.
    reason: alternative_reading
lexical_decisions:
- source_word: מדין
  english_pob_choice: from grief
  chosen_korean: 그리움으로부터
  alternatives_korean:
  - 슬픔으로부터
  - 괴로움으로부터
  lexicon: HALOT
  rationale: 히브리어 자체는 어려우나, 그리스어 병행문이 λύπης(슬픔/근심)로 읽히므로 감정적 고통의 원인을 나타내는 표현으로 옮겼습니다.
- source_word: אסון
  english_pob_choice: disaster
  chosen_korean: 재앙
  alternatives_korean:
  - 재난
  - 불행
  lexicon: HALOT
  rationale: 히브리어의 기본 의미는 중대한 재앙이나 불행이므로, 그리스어의 ‘죽음’과 구별되는 본문 읽기를 살려 ‘재앙’으로 옮겼습니다.
- source_word: רע לבב
  english_pob_choice: a troubled heart
  chosen_korean: 마음이 괴로운 사람
  alternatives_korean:
  - 괴로운 마음
  - 슬픈 마음
  lexicon: HALOT
  rationale: 직역하면 ‘마음이 나쁜/악한’이지만, 문맥상 도덕적 악이 아니라 내적 고통을 가리키므로 한국어에서는 상태를 드러내는 표현으로 풀었습니다.
- source_word: עצבה
  english_pob_choice: in sorrow
  chosen_korean: 슬픔 속에서
  alternatives_korean:
  - 근심 속에서
  - 비탄 속에서
  lexicon: HALOT
  rationale: 감정 상태를 나타내는 명사로서, 한국어에서 자연스럽고 본문의 정서를 유지하는 표현을 선택했습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행문의 차이(‘재앙’ vs ‘죽음’)
  chosen_reading: 본문은 히브리어의 ‘재앙’을 따르되, 그리스어 대조를 고려해 의미 영역이 지나치게 축소되지 않도록 유지했습니다.
  alternative_readings:
  - 그리움으로부터 죽음이 나옵니다
  - 슬픔으로부터 불행이 나옵니다
  rationale: 사본 전통 간 차이는 의미상 중요한 변이이므로, 주본문은 히브리어 증거를 따르고 그리스어는 해석상 대안으로 남기는 것이 적절합니다.
  doctrine_reference: 본문비평 / 외경 번역 원칙
