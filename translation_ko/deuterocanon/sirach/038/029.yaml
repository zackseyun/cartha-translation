  lexicon: LSJ
  rationale: κατέναντι는 단순 위치보다 ‘마주하여’의 시선 집중을 담지만, 한국어에서는 과도한 해석을 피하고 ὁμοίωμα의 기본 의미인 ‘형태’로 옮겨 장인의 응시를 살렸습니다.
