  yaml_path: translation/deuterocanon/sirach/038/001.yaml
  text: Honor the physician according to your need of him[a], for God has also given him a portion.
  footnotes:
  - marker: a
    text: 'Or, following the Greek: ''Honor the physician for his services, for the Lord also created him.'' The Hebrew reads more literally, ''for with him also is a share from God.'''
    reason: alternative_reading
translation:
  language: ko
  text: 의사를 필요에 따라 공경하십시오[a]. 그에게도 하나님께로부터 몫이 있기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 그리스어를 따르면, “의사를 그의 봉사를 위하여 공경하십시오. 주께서도 그를 창조하셨기 때문입니다.” 히브리어 후반절은 더 문자적으로 “그에게도 하나님께로부터 몫이 있기 때문입니다”라고 읽습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: רעי / Τίμα
  english_pob_choice: Honor
  chosen_korean: 공경하십시오
  alternatives_korean:
  - 존중하십시오
  - 높이십시오
  - 귀히 여기십시오
  lexicon: HALOT; LXX Τίμα
  rationale: 히브리어 동사는 관계적 친근함보다 존중과 예우의 의미가 강하고, 그리스어 병행본문도 ‘공경하다’를 분명히 지지하므로 ‘공경하십시오’로 옮겼습니다.
- source_word: רופא
  english_pob_choice: the physician
  chosen_korean: 의사
  alternatives_korean:
  - 의술가
  - 치료자
  - 의생
  lexicon: HALOT
  rationale: 지혜문맥에서 품위 있는 직능 명칭으로 자연스럽고 현대 독자에게도 분명한 ‘의사’를 택했습니다.
- source_word: לפני צרכו
  english_pob_choice: according to your need of him
  chosen_korean: 네 필요에 따라
  alternatives_korean:
  - 그에게 필요할 때
  - 그의 필요에 따라
  - 그의 필요한 섬김에 따라
  lexicon: HALOT
  rationale: 히브리어는 ‘필요/요구’의 상황을 압축적으로 말하므로, 행위의 기준을 드러내는 ‘네 필요에 따라’가 가장 간결하게 뜻을 살립니다.
- source_word: חלק אל
  english_pob_choice: a portion
  chosen_korean: 몫
  alternatives_korean:
  - 한 부분
  - 일정한 몫
  - 하나님께서 주신 몫
  lexicon: HALOT
  rationale: חלק은 ‘몫, 분깃, 몫의 분배’라는 뜻이므로 ‘몫’이 가장 직접적입니다. 문맥상 이것이 하나님에게서 온 몫임을 본문에서 분명히 했습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행본문의 차이(몫/창조)
  chosen_reading: 본문은 히브리어의 ‘하나님께서 몫을 주셨다’는 진술을 따르고, 그리스어의 ‘주께서 그를 창조하셨다’는 해석은 각주로 제시했습니다.
  alternative_readings:
  - 그에게도 주님께서 그를 창조하셨기 때문입니다
  - 그에게도 주님께서 한 몫을 주셨기 때문입니다
  rationale: 이 절의 두 전승은 신학적 근거를 서로 다른 방식으로 말합니다. 히브리어의 ‘몫’ 표현을 본문에 두되, 그리스어의 창조 진술도 지워 버리지 않고 각주에 남겨 두어 전승 간 긴장을 보존했습니다.
  doctrine_reference: 원문 우선 원칙; 전승 차이의 투명한 보존
