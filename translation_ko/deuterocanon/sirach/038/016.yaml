  text: My son[a], shed tears for the dead, be bitter, and begin the lament.
  footnotes:
  - marker: a
    text: 'Hebrew: ''be bitter and ... a lament''; the final verb is difficult in the surviving Hebrew. The Greek parallel reads, ''and as one suffering terribly, begin the lament,'' which supports the sense given here.'
