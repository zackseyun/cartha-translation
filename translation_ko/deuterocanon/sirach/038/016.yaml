  - 눈물을 쏟고
  - 눈물 한 방울을 내라
  lexicon: HALOT
  rationale: 히브리어 관용구를 직역하기보다 울음을 시작하라는 명령성을 살리는 한국어 관용으로 옮겼습니다.
- source_word: התמרר וגהה קינה
  english_pob_choice: be bitter, and begin the lament
  chosen_korean: 슬퍼하며 애도를 시작하라
  alternatives_korean:
  - 쓰라리게 애도를 시작하라
  - 비통해하며 곡을 시작하라
  - 슬프게 통곡을 시작하라
  lexicon: HALOT
  rationale: התמרר의 ‘쓰라림/비통함’과 קינה의 정식 애가를 함께 살리되, 본문 전승상 다소 어려운 동사를 한국어에서 과도하게 해석하지 않도록 ‘슬퍼하며’로 처리했습니다.
theological_decisions:
- issue: קינה의 장르 표현
  chosen_reading: קינה를 ‘애도’로 옮겨, 장례적 lament의 정식 행위를 드러냈습니다.
  alternative_readings:
  - ‘곡’으로 옮겨 더 전통적 장례 울음을 드러내기
  - ‘통곡’으로 옮겨 감정적 강도를 높이기
  rationale: 이 구절은 단순 감정이 아니라 죽은 이를 향한 공식적 애가를 권하는 맥락이므로, 한국어에서 장르적 기능이 드러나는 표현을 택했습니다.
  doctrine_reference: 시락 38:16의 애도 윤리
