  lexicon: HALOT
  rationale: 상실을 애도하는 대상성을 살리면서도 현대 한국어에서 자연스러운 목적·대상 표현으로 다듬었습니다.
- source_word: הזיב דמעה
  english_pob_choice: shed tears
  chosen_korean: 눈물을 흘리고
  alternatives_korean:
