review_pass:
  verdict: revise
  source_fidelity: 첫 절의 κτίσμα αἰῶνος는 ‘시대의 질서’로 문맥상 가능하지만, κτίσμα의 ‘만들어진 것/창조물’이라는 폭을 보존할 필요가 있습니다. ‘떠받칠’은 στηρίζω의 뜻에 대체로 맞지만 다소 구어적·물리적인 어감이 있으므로 ‘지탱할 것입니다’가 더 안정적입니다. 둘째 절은 ἐν ἐργασίᾳ τέχνης의 ‘숙련된 일/기술의 노동 가운데’라는 관계를 유지해야 합니다.
  naturalness: ‘그들의 기도는 자기들의 기술의 일에 있습니다’는 한국어에서 부자연스럽고, ‘자기들의’도 현대 표준 한국어 문체에서는 불필요하게 무겁습니다. ‘그들의 기도는 그들이 하는 숙련된 일 가운데 있습니다’가 합쇼체 문맥에서 자연스럽고 원문의 압축된 표현도 유지합니다.
  terminology: δέησις는 ‘기도’로 옮길 수 있습니다. 다만 주석에서 이를 ‘단순한 종교 행위가 아니라’라고 대립시키거나 노동 자체가 기도라는 특정 해석으로 확정하지 않는 편이 좋습니다. τέχνη는 이 문맥에서 ‘기술’보다 ‘숙련된 일’ 또는 ‘기술의 노동’이 자연스럽습니다.
  issues:
