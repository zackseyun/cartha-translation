  text: but they will sustain the order of the age[b][a], and their prayer is in the work of their craft.
  footnotes:
  - marker: a
    text: Or 'they will establish the creation/order of the age.' The Greek κτίσμα αἰῶνος is compact and may refer either to the enduring fabric of society or more broadly to the world's established order.
    reason: lexical_alternative
  - marker: b
    text: Or 'their supplication is in the labor of their craft,' expressing that their prayer is bound up with their skilled work.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그들은 시대의 질서를 떠받칠 것이며, 그들의 기도는 자기들의 기술의 일에 있습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘시대의 질서’는 κτίσμα αἰῶνος를 직역한 것으로, ‘만들어진 것/구조’와 ‘시대’의 뉘앙스를 함께 살린 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘기도’는 여기서 단순한 종교 행위가 아니라, 장인의 숙련된 노동과 결합된 간구를 가리킬 수 있습니다.
    reason: theological_note
lexical_decisions:
- source_word: κτίσμα αἰῶνος
  english_pob_choice: the order/fabric of the age
  chosen_korean: 시대의 질서
  alternatives_korean:
  - 세상의 질서
  - 시대의 구조
  - 세상의 짜임새
  lexicon: LSJ
  rationale: κτίσμα은 ‘지어진 것, 만들어진 것’의 뜻이지만, 이 문맥에서는 장인들이 떠받치는 사회적·세계적 질서를 가리키므로 ‘질서’로 옮기되, αἰῶνος의 시간적 뉘앙스를 살려 ‘시대의’로 표현했습니다.
- source_word: στηρίσουσιν
  english_pob_choice: will sustain / uphold
  chosen_korean: 떠받칠 것입니다
  alternatives_korean:
  - 지탱할 것입니다
  - 굳게 할 것입니다
  - 붙들어 세울 것입니다
  lexicon: LSJ
  rationale: στηρίζω의 ‘견고하게 하다, 지탱하다’라는 뜻을 살려, 공동체의 질서를 지속적으로 받쳐 준다는 이미지를 담는 ‘떠받치다’를 택했습니다.
- source_word: δέησις
  english_pob_choice: prayer
  chosen_korean: 기도
  alternatives_korean:
  - 간구
  - 청원
  - 기도와 간구
  lexicon: LSJ
  rationale: δέησις는 보통 간구/기도를 뜻하지만, 한국어에서는 문맥상 가장 자연스럽고 직접적인 대응어가 ‘기도’이므로 이를 사용했습니다.
- source_word: ἐν ἐργασίᾳ τέχνης
  english_pob_choice: in the work of their craft
  chosen_korean: 자기들의 기술의 일에
  alternatives_korean:
  - 그들의 기술의 노동 속에
  - 그들의 기술 작업 안에
  - 그들의 공예 일에
  lexicon: LSJ
  rationale: ἐργασία와 τέχνη가 함께 장인의 숙련된 노동을 가리키므로, ‘기술의 일’로 옮겨 기도와 노동의 결합을 드러냈습니다. ‘자기들의’은 αὐτῶν의 소유 관계를 반영합니다.
theological_decisions:
- issue: 장인들의 ‘기도’와 ‘일’의 관계
  chosen_reading: 이 구절은 장인들이 말로만 기도하는 것이 아니라, 그들의 숙련된 노동 자체가 기도의 자리와 방식이 된다는 뜻으로 읽었습니다.
  alternative_readings:
  - 그들의 요청은 일의 성공을 뜻한다
  - 그들의 기도는 일과 병행된다
  rationale: δέησις가 단순한 업무상의 요청보다 신앙적 기도를 가리키는 경우가 더 자연스럽고, 뒤의 ‘일’ 구문이 그 기도의 장을 규정합니다. 따라서 노동을 기도의 표현/자리로 살렸습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 3
