    issue: 둘째 절의 한국어 표현이 부자연스럽습니다.
    rationale: ‘기술의 일에 있습니다’는 한국어 관용에 맞지 않으며, ἐν ἐργασίᾳ τέχνης가 가리키는 숙련된 노동의 영역도 충분히 드러내지 못합니다.
