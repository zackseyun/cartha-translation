revisions:
- from: 그러나 그들은 시대의 질서를 떠받칠 것이며, 그들의 기도는 자기들의 기술의 일에 있습니다.[a][b]
  to: 그러나 그들은 시대의 질서를 지탱할 것이며, 그들의 기도는 그들이 하는 숙련된 일 가운데 있습니다.[a][b]
  rationale: 문맥상 가능한 ‘시대의 질서’는 유지하되, 주석에서 κτίσμα의 어휘적 폭과 구절의 해석상 여지를 정확히 밝혔습니다. ‘떠받칠’은 더 중립적이고 문어적인 ‘지탱할 것입니다’로, 부자연스러운 ‘자기들의 기술의 일에 있습니다’는 원문의 전치사적 관계와 합쇼체 문장을 살린 ‘그들이 하는 숙련된 일 가운데 있습니다’로 고쳤습니다. 주석과 설명에서 노동 자체를 기도로 동일시하는 해석은 피했습니다.
