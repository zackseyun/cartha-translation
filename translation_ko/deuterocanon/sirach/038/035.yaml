    rationale: κτίσμα은 엄밀히 ‘만들어진 것, 창조물’이며 ‘질서’는 문맥적 해석입니다. 주석은 이 차이와 가능한 대안을 밝혀야 합니다.
  - severity: low
    issue: 주석 b와 신학적 설명이 노동 자체가 기도라는 해석을 다소 단정합니다.
    rationale: 원문은 기도가 숙련된 일 가운데 있다고 말하지만, 그 관계가 노동 자체가 기도라는 뜻인지, 노동과 결부된 기도인지는 열어 두는 편이 적절합니다.
