translation:
  language: ko
  text: 그의 손에 좋은 결과가 달려 있을 때가 있으니, 그도 하나님께 간구할 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 ‘그들의 손에’라고 복수형을 보이지만, 히브리어 증거는 단수형 ‘그의 손’을 읽습니다. 본문은 히브리어를 따랐습니다.
    reason: textual_variant
lexical_decisions:
- source_word: כי / for
  english_pob_choice: for
  chosen_korean: -니
  alternatives_korean:
  - 왜냐하면
  - 이에
  lexicon: HALOT
  rationale: 앞뒤 절을 설명하는 인과를 살리기 위해 종결형보다 연결형 '-니'로 자연스럽게 옮겼습니다.
- source_word: יש עתם
  english_pob_choice: there is a time
  chosen_korean: 때도 있습니다
  alternatives_korean:
  - 정해진 때가 있습니다
  - 때가 있습니다
  lexicon: HALOT
  rationale: ‘있다’의 존재 진술을 유지하되, 문맥상 일반적 가능성을 드러내기 위해 ‘때도 있습니다’로 다듬었습니다.
- source_word: בידו מצלחת
  english_pob_choice: success is in his hands
  chosen_korean: 성공이 손안에 있을 때도
  alternatives_korean:
  - 형통이 그의 손에 있을 때도
  - 좋은 결과가 그의 손에 있을 때도
  lexicon: HALOT
  rationale: "직역적 이미지인 ‘손안에’는 살리고, \x18מצלחת\x19는 의료 문맥에 맞게 ‘성공’으로 옮겨 결과의 잘됨을 표현했습니다."
- source_word: אל אל יעתיר
  english_pob_choice: will make supplication to God
  chosen_korean: 하나님께 간구합니다
  alternatives_korean:
  - 하나님께 빕니다
  - 하나님께 간절히 청합니다
  lexicon: HALOT
  rationale: "יהווה가 아닌 일반 엘로힘/하나님 대상의 반복을 자연스럽게 처리하면서, \x18יעתיר\x19의 간절한 청원을 ‘간구하다’로 보존했습니다."
theological_decisions:
- issue: 의료인의 실제 성공과 하나님께 대한 의존의 긴장
  chosen_reading: 의사는 실제로 성공할 수 있지만, 그 성공이 있어도 하나님께 간구하는 존재로 제시했습니다.
  alternative_readings:
  - 단순히 인간 의술의 유효성을 말하는 것으로만 좁힐 수 있습니다.
  - 모든 경우에 성공이 보장된다는 뜻으로 오해될 수 있습니다.
  rationale: 히브리어와 그리스어 모두 인간의 손 안에 있는 실제적 성취와 동시에 하나님께의 청원을 함께 말하므로, 어느 한쪽으로 환원하지 않았습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 3
