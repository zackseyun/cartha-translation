- from: 그에게는 성공이 손안에 있을 때도 있으니, 그도 하나님께 간구합니다.[a]
  to: 그의 손에 좋은 결과가 달려 있을 때가 있으니, 그도 하나님께 간구할 것입니다.[a]
  rationale: 히브리어 본문을 우선하여 단수형을 본문에 유지하고, 그리스어의 복수형은 각주로 밝혔습니다. 첫 절에서는 불필요한 ‘도’를 제거하고 한국어 관용에 맞게 성공/좋은 결과가 그의 손에 있다는 뜻을 표현했습니다. 둘째 절은 미완료형의 전망성을 ‘간구할 것입니다’로 반영했습니다.
