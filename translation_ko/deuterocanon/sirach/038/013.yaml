  text: For there is a time when success is in his hands[a], for he too will make supplication to God.
  footnotes:
  - marker: a
    text: 'Greek: ''there is a time when success is also in their hands.'' The Hebrew witness reads singular (''his hands''), which is followed in the main text.'
