base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/038/004.yaml
  text: The Lord created medicines from the earth[b][a], and a sensible man will not despise them.
  footnotes:
  - marker: a
    text: Hebrew has 'God' (אל) as the subject; the Greek parallel reads 'Lord' (Κύριος).
    reason: alternative_reading
  - marker: b
    text: The Hebrew wording behind 'created' is difficult in this manuscript tradition; the Greek parallel supports the sense that the Lord is the one who brings medicines into being from the earth.
    reason: textual_variant
translation:
  language: ko
  text: 주님은 땅에서 약초를 창조하셨으며, 지각 있는 사람은 그것을 업신여기지 않습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 ‘하나님’을 뜻하는 אל을 쓰며, 그리스어 평행본문은 ‘주님’(Κύριος)을 읽습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어 전승의 동사 형태는 난점이 있으나, 그리스어 평행본문은 ‘창조하셨다’는 뜻을 분명히 지지합니다.
    reason: textual_variant
lexical_decisions:
- source_word: אל / Κύριος
  english_pob_choice: The Lord
  chosen_korean: 주님
  alternatives_korean:
  - 하나님
  lexicon: HALOT; LXX parallel
  rationale: 히브리어 본문은 אל을, 그리스어 평행본문은 Κύριος를 사용하므로 신적 칭호로서 ‘주님’이 가장 자연스럽고 POB의 κύριος 기본값에도 부합합니다.
- source_word: מארץ / ἐκ γῆς
  english_pob_choice: from the earth
  chosen_korean: 땅에서
  alternatives_korean:
  - 땅으로부터
  - 땅에서 나온
  lexicon: HALOT
  rationale: 약초의 물질적 근원을 나타내므로 ‘땅에서’가 간결하면서도 원문의 창조-공급 의미를 잘 살립니다.
- source_word: מצוציא / ἔκτισεν
  english_pob_choice: created
  chosen_korean: 창조하셨으며
  alternatives_korean:
  - 만드셨으며
  - 지으셨으며
  - 생겨나게 하셨으며
  lexicon: HALOT; LXX parallel
  rationale: 히브리어 형태는 전승상 난점이 있으나 그리스어 ἔκτισεν이 ‘창조하다’를 분명히 뒷받침하므로, 하나님의 공급 행위를 분명하게 드러내는 ‘창조하셨으며’를 택했습니다.
- source_word: תרופות
  english_pob_choice: medicines
  chosen_korean: 약초
  alternatives_korean:
  - 약
  - 의약품
  - 치료제
  lexicon: HALOT
  rationale: תרופות은 치료용 약재를 가리키며, 이 구절은 땅에서 나는 자연적 약재를 말하므로 ‘약초’가 현대 한국어에서 가장 구체적이고 문맥에 맞습니다.
- source_word: גבר מבין / ἀνὴρ φρόνιμος
  english_pob_choice: a sensible man
  chosen_korean: 지각 있는 사람
  alternatives_korean:
  - 슬기로운 사람
  - 분별 있는 사람
  - 지혜로운 사람
  lexicon: HALOT
  rationale: מבין/φρόνιμος는 단순한 지능보다 분별과 사려를 뜻하므로 ‘지각 있는’이 의미를 넓지 않게 유지합니다. 남성형 일반어를 한국어에서는 자연스럽게 포괄 표현으로 옮겼습니다.
- source_word: אל ימאס בם / οὐ προσοχθιεῖ αὐτοῖς
  english_pob_choice: will not despise them
  chosen_korean: 그것을 업신여기지 않습니다
  alternatives_korean:
  - 그것들을 멸시하지 않습니다
  - 그것을 무시하지 않습니다
  - 그것을 경멸하지 않습니다
  lexicon: HALOT; LXX parallel
  rationale: מאס와 그리스어 동사는 약재를 하찮게 여기는 태도를 가리키므로, 현재형 일반 진술로서 ‘업신여기지 않습니다’가 가장 자연스럽고 평가적 힘도 잘 보존합니다.
theological_decisions:
- issue: 히브리어 אל과 그리스어 Κύριος의 신적 호칭 차이
  chosen_reading: 주님
  alternative_readings:
  - 하나님
  rationale: 병행본문과 본문 전승을 함께 고려하면 주어는 하나님이시며, 한국어 본문에서는 POB의 번역 원칙에 따라 신적 칭호를 ‘주님’으로 일관되게 표기하는 것이 적절합니다.
  doctrine_reference: POB divine title rendering; κύριος default 'Lord'
