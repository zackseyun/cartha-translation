  text: So the smith sits near the anvil and studies the raw iron; the vapor of the fire wastes his flesh, and he struggles with the heat of the furnace.
  footnotes:
  - marker: a
    text: Or 'the unworked iron' for 'the raw iron.' The Greek adjective can denote what is idle or not yet worked.
    reason: lexical_alternative
  - marker: b
    text: Literally 'the vapor of the fire melts his flesh.' The English main text uses 'wastes' to express the bodily toll idiomatically.
    reason: lexical_alternative
translation:
  language: ko
  text: 이와 같이 대장장이도 모루 가까이에 앉아 거친 쇠를 살피며, 불의 증기 때문에 그의 살이 녹고, 용광로의 열기와 씨름합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘거친 쇠’는 ἀργῷ σιδήρῳ를 직역한 것으로, ‘가공되지 않은 쇠’ 또는 ‘손대지 않은 쇠’라는 뜻으로도 이해할 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 직역하면 ‘불의 증기가 그의 살을 녹입니다’입니다. 본문은 육체적 소모를 강하게 그리는 표현입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: χαλκεύς
  english_pob_choice: smith
  chosen_korean: 대장장이
  alternatives_korean:
  - 쇠장인
  - 금속공
  - 주조공
  lexicon: LSJ
  rationale: 금속을 다루는 직업인을 가리키는 일반적이고 자연스러운 한국어로 옮겼습니다. 문맥상 철을 다루므로 ‘대장장이’가 가장 읽기 쉽고 과도하게 좁히지 않습니다.
- source_word: καθήμενος ἐγγὺς ἄκμονος
  english_pob_choice: sits near the anvil
  chosen_korean: 모루 가까이에 앉아
  alternatives_korean:
  - 모루 곁에 앉아
  - 모루 옆에 앉아
  lexicon: LSJ
  rationale: 작업자의 자세와 공간을 단순하고 직접적으로 살렸습니다. ‘모루’는 금속세공 문맥에서 자연스러운 대응어입니다.
- source_word: ἀργῷ σιδήρῳ
  english_pob_choice: the raw iron
  chosen_korean: 거친 쇠
  alternatives_korean:
  - 가공되지 않은 쇠
  - 손대지 않은 쇠
  lexicon: LSJ
  rationale: ἀργός가 여기서는 ‘게으른’이 아니라 ‘일을 하지 않은, 손대지 않은’ 상태를 가리키므로, 금속 세공의 장면에 맞게 ‘거친 쇠’로 옮겼습니다. ‘raw iron’의 직역보다 한국어에서 더 자연스럽습니다.
- source_word: ἀτμὶς πυρός τήξει σάρκας αὐτοῦ
  english_pob_choice: the vapor of the fire wastes his flesh
  chosen_korean: 불의 증기 때문에 그의 살이 녹고
  alternatives_korean:
  - 불의 증기가 그의 살을 녹이고
  - 불의 김이 그의 살을 녹이고
  lexicon: LSJ
  rationale: ἀτμίς는 ‘증기/김’의 이미지를 보존해야 하므로 이를 살렸고, τήξει는 문자적으로 ‘녹이다’로 옮겨 육체적 고통의 강한 이미지를 유지했습니다.
- source_word: ἐν θέρμῃ καμίνου διαμαχήσεται
  english_pob_choice: he struggles with the heat of the furnace
  chosen_korean: 용광로의 열기와 씨름합니다
  alternatives_korean:
  - 용광로의 열기와 맞서 싸웁니다
  - 풀무의 열기와 씨름합니다
  lexicon: LSJ
  rationale: διαμαχήσεται는 단순한 불편함보다 ‘버티며 맞서는’ 긴장을 담으므로 ‘씨름합니다’가 적절합니다. καμίνου는 금속 작업의 문맥을 따라 ‘용광로’로 옮겼습니다.
theological_decisions:
- issue: 비유의 강도와 육체성 유지
  chosen_reading: 노동의 고통을 도덕화하거나 완화하지 않고, 불이 ‘살을 녹이는’ 육체적 소모를 그대로 드러냈습니다.
  alternative_readings:
  - ‘지치게 한다’처럼 완화하는 번역
  - ‘몸을 해친다’처럼 일반화하는 번역
  rationale: 지혜문학의 관찰적 비유를 유지하려면 신체적 이미지가 약화되지 않아야 합니다. 원문은 작업의 현실적 고통을 매우 직접적으로 묘사합니다.
  doctrine_reference: 지혜문학의 관찰적·묘사적 표현 유지
- issue: 직업 비유의 일상성 유지
  chosen_reading: 대장장이의 작업 장면을 현대 한국어에서 바로 떠오르는 이미지로 제시했습니다.
  alternative_readings:
  - ‘금속공’처럼 학술적이거나 중립적인 표현
  - ‘주석공’처럼 재료를 특정하는 표현
  rationale: 본문은 교훈적 논증보다 일상적 관찰에 가깝기 때문에, 독자가 즉시 장면을 그릴 수 있는 표현이 적합합니다.
  doctrine_reference: 시락서/집회서의 지혜 교훈 문맥
