base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/038/017.yaml
  text: My son[a], make the mourning bitter and complete the lament; perform his mourning as is fitting for him. For a day or two, because of slander, shed tears[b]; then be comforted because of grief.
  footnotes:
  - marker: a
    text: Hebrew 'because of reproach' is uncertain in nuance here; the Greek reads 'for the sake of slander/reproach,' likely referring to avoiding social criticism by neglecting proper mourning.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew final phrase could be read more literally as 'because of affliction' or, if taken differently, 'because of iniquity'; the Greek supports the sense 'because of grief/sorrow.'
    reason: alternative_reading
translation:
  language: ko
  text: 내 아들아, 슬픔의 곡을 쓰라. 애곡을 마치고, 그를 위한 애곡을 그에게 합당하게 하라. 하루나 이틀 동안은 비방 때문에 눈물을 흘리고, 그다음에는 슬픔 때문에 위로를 받으십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 말미는 문자적으로는 불분명하지만, 여기서는 그리스어가 뒷받침하는 '슬픔/비탄'의 뜻으로 이해했습니다.
    reason: source_note
lexical_decisions:
- source_word: כמשפטו ... כיוצא בו / κατὰ τὴν ἀξίαν αὐτοῦ
  english_pob_choice: as is fitting for him
  chosen_korean: 그를 위한 애곡을 그에게 합당하게 하라
  alternatives_korean:
  - 그에게 맞게 하라
  - 그에게 마땅한 대로 하라
  - 그의 분에 맞게 하라
  lexicon: HALOT; LXX ἀξία
  rationale: 히브리어와 그리스어가 모두 장례 애곡을 '합당한 정도'로 행하라는 뜻을 지지하므로, 한국어는 관용적이면서도 평가적 뉘앙스를 살려 옮겼습니다.
- source_word: המר ... מספד
  english_pob_choice: make the mourning bitter / complete the lament
  chosen_korean: 슬픔의 곡을 쓰라. 애곡을 마치고
  alternatives_korean:
  - 애곡을 쓰게 하라
  - 슬픔을 쓰라
  - 애곡을 끝내라
  lexicon: HALOT
  rationale: 히브리어의 '쓰게 하다/완성하다'는 상례적 애곡을 진지하고 충분하게 수행하라는 뜻이므로, 한국어에서는 '슬픔의 곡'과 '애곡'을 병렬해 감정과 의례성을 함께 살렸습니다.
- source_word: יום ושנים ...
  english_pob_choice: For a day or two
  chosen_korean: 하루나 이틀 동안은
  alternatives_korean:
  - 하루이틀 동안
  - 하루 또는 이틀 동안은
  - 하루나 이틀을 두고
  lexicon: HALOT
  rationale: 짧은 기간을 가리키는 관용적 표현이므로, 현대 한국어에서 자연스러운 시간 부사구로 옮겼습니다.
- source_word: בעבור דמעה
  english_pob_choice: shed tears
  chosen_korean: 눈물을 흘리고
  alternatives_korean:
  - 눈물을 흘리며
  - 울고
  - 눈물로
  lexicon: HALOT
  rationale: 직역하면 '눈물을 위하여'이지만, 문맥상 잠깐의 애도 행위를 뜻하므로 한국어에서는 자연스럽게 '눈물을 흘리다'로 풀었습니다.
- source_word: בעבור עון
  english_pob_choice: because of grief
  chosen_korean: 슬픔 때문에
  alternatives_korean:
  - 근심 때문에
  - 비탄 때문에
  - 고통 때문에
  lexicon: HALOT; Greek λύπης ἕνεκα
  rationale: 히브리어 말미는 의미가 어려우나 그리스어가 '슬픔'을 지지하므로, 애도 문맥에 맞는 '슬픔'으로 옮겼습니다.
theological_decisions:
- issue: 애도 지침의 직접 명령형 유지
  chosen_reading: 지혜문학의 권면을 살려, 죽은 이를 위한 정당한 애곡을 적극적으로 행하라는 명령으로 번역했습니다.
  alternative_readings:
  - 완곡한 위로 권면으로 약화하기
  - 장례 절차 설명문처럼 중립적으로 옮기기
  rationale: 본문은 상실을 가볍게 넘기지 말고, 공동체가 적절한 애통을 수행하라는 윤리적 권면이므로 명령형의 강도를 유지했습니다.
  doctrine_reference: 시락 38:17 문맥상의 애도 윤리
