  naturalness: ‘그를 위한 애곡을 그에게 합당하게 하라’는 지시 대상과 기준이 중복되어 어색합니다. ‘그에게 마땅한 대로 애도하십시오’가 자연스럽습니다. 합쇼체 명령문을 일관되게 사용해야 하므로 ‘하라’도 ‘하십시오’로 고쳤습니다.
