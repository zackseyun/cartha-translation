translation:
  language: ko
  text: 그를 더 이상 생각하지 마십시오. 그에게는 희망이 없으니,[a] 무슨 도움이 되겠습니까? 오히려 자신에게 해를 끼치게 됩니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 '그에게는 희망이 없으니'라고 합니다. 그리스어 평행본문은 '돌아옴이 없으니, 그를 돕지 못하고 자신에게 해를 끼치게 된다'고 읽습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אל תזכרנו
  english_pob_choice: Do not keep remembering him
  chosen_korean: 그를 계속 기억하지 마십시오
  alternatives_korean:
  - 그를 기억하지 마십시오
  - 그를 떠올리지 마십시오
  lexicon: HALOT
  rationale: 부정 명령의 핵심은 단순한 망각이 아니라 죽은 이를 향한 지속적 집착을 멈추라는 뜻이므로, '계속 기억하다'로 문맥의 힘을 살렸습니다.
- source_word: כי אין לו תקוה
  english_pob_choice: for there is no return
  chosen_korean: 그에게는 돌아올 희망이 없으니
  alternatives_korean:
  - 그에게는 희망이 없으니
  - 그는 희망이 없으니
  lexicon: HALOT
  rationale: 히브리어 תקוה의 기본 뜻은 '희망'이지만, 그리스어 평행본문의 '돌아옴이 없다'는 장례 문맥의 의도를 분명히 합니다. 두 증언을 함께 살려 '돌아올 희망이 없다'로 옮겼습니다.
- source_word: מה תועיל
  english_pob_choice: you will not help him
  chosen_korean: 그것이 당신에게 무슨 유익이 되겠습니까
  alternatives_korean:
  - 당신은 그에게 아무 도움도 주지 못합니다
  - 무슨 소용이 있겠습니까
  lexicon: HALOT
  rationale: 문장 구조상 수사 의문형이므로 한국어에서는 자연스러운 '무슨 유익이 되겠습니까'로 풀되, 그리스어의 '그를 유익하게 하지 못한다'는 뜻을 반영했습니다.
- source_word: ולך תרע
  english_pob_choice: and you will harm yourself
  chosen_korean: 당신은 스스로에게 해를 끼치게 됩니다
  alternatives_korean:
  - 그리고 당신 자신을 해치게 됩니다
  - 당신에게도 해가 됩니다
  lexicon: HALOT
  rationale: 마지막 경고는 애도에 몰입하는 자가 자기 자신에게 입는 손해를 말하므로, 그리스어의 반사적 의미를 살려 '스스로에게 해를 끼치다'로 옮겼습니다.
theological_decisions:
- issue: תקוה를 '희망'으로만 둘지, 그리스어 평행본문을 따라 '돌아옴'의 의미를 드러낼지
  chosen_reading: 그에게는 돌아올 희망이 없으니
  alternative_readings:
  - 그에게는 희망이 없으니
  - 그에게는 돌아올 길이 없으니
  rationale: 히브리어는 '희망'을, 그리스어는 '돌아옴'을 말하므로 어느 한쪽을 지워서는 안 됩니다. 본문 의미상 죽은 자가 다시 돌아오지 않는다는 점을 살리되, 희망의 어휘를 함께 보존했습니다.
  doctrine_reference: 'Translation philosophy: original-language primacy with parallel-source consultation; preserve tension where source witnesses differ.'
