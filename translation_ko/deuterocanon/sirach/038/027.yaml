base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/038/027.yaml
  text: So too every craftsman and planner[a], who labors by night as by day.
  footnotes:
  - marker: a
    text: 'The Hebrew is concise: ''every craftsman and planner/designer.'' The Greek parallel expands the picture with terms for a builder/master craftsman and continues with engravers and their sleepless effort to complete the work. The main text follows the Hebrew while allowing the Greek to clarify the sense of skilled design.'
    reason: alternative_reading
translation:
  language: ko
  text: 이와 같이, 모든 장인과 설계자[a]도 밤에도 낮처럼 수고합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 간결하게 ‘모든 장인과 설계자’라고 말합니다. 그리스어 병행문은 ‘모든 장인과 우두머리 장인’을 언급한 뒤, 인장 무늬를 새기는 이들의 끈질긴 작업을 더 자세히 묘사합니다. 본문은 히브리어의 압축된 표현을 따릅니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אף
  english_pob_choice: So too
  chosen_korean: 이와 같이
  alternatives_korean:
  - 또한
  - 그와 같이
  - 이처럼
  lexicon: HALOT
  rationale: 앞선 부류의 일꾼들을 계속 이어 주는 비교·연결 표지로 보아, 단순한 첨가보다 ‘이와 같이’가 문맥상 자연스럽습니다.
- source_word: עשה חרש
  english_pob_choice: every craftsman
  chosen_korean: 모든 장인
  alternatives_korean:
  - 모든 기술자
  - 모든 공예가
  - 모든 일꾼
  lexicon: HALOT
  rationale: 히브리어의 압축된 표현은 숙련된 손기술을 지닌 제작자를 가리키므로, 현대 한국어에서는 ‘장인’이 가장 간결하게 대응합니다.
- source_word: וחשב
  english_pob_choice: planner/designer
  chosen_korean: 설계자
  alternatives_korean:
  - 계획자
  - 구상자
  - 디자이너
  lexicon: HALOT
  rationale: חשב은 ‘궁리하다/계획하다’의 뜻을 가지며, 병행문의 의미상 단순 계획자보다 제작을 염두에 둔 설계의 뉘앙스가 살아야 하므로 ‘설계자’가 적절합니다.
- source_word: לילה כיום יגיע
  english_pob_choice: who labors by night as by day
  chosen_korean: 밤낮으로 수고합니다
  alternatives_korean:
  - 밤이나 낮이나 수고합니다
  - 밤에도 낮처럼 일합니다
  - 밤낮으로 노동합니다
  lexicon: HALOT
  rationale: 관용적으로 ‘밤낮으로’가 히브리어의 ‘밤을 낮처럼 지내며’라는 뜻을 자연스럽게 옮기며, ‘수고합니다’는 지속적이고 힘든 노동을 부드럽게 전달합니다.
