base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/038/025.yaml
  text: How can one who guides the plow become wise[b][a], who drives the ox with a goad and whose concerns are with the cattle?
  footnotes:
  - marker: a
    text: Hebrew is somewhat difficult in its first clause; the Greek parallel reads more explicitly, 'How will one who holds a plow become wise ... driving oxen ... ?' The translation follows the Hebrew while using the Greek to clarify the agricultural sense.
    reason: alternative_reading
  - marker: b
    text: Or 'whose talk is about the cattle.' The Hebrew can point either to his concerns generally or more specifically to what he speaks about; the Greek parallel leans toward 'speech/account.'
    reason: lexical_alternative
translation:
  language: ko
  text: 쟁기를 잡고 소를 가이로 몰며, 관심을 소떼에 두는 사람이 어떻게 지혜로워지겠습니까?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 첫 절은 다소 어렵습니다. 헬라어 평행본문은 ‘쟁기를 잡는 자가 어떻게 지혜로워지겠습니까…?’라고 더 분명하게 읽습니다. 이 번역은 히브리어를 따르되 농경의 의미를 분명히 하기 위해 헬라어를 참고했습니다. ‘가이’는 소를 모는 막대기입니다.
    reason: alternative_reading
  - marker: b
    text: ‘관심을 소떼에 두는’은 ‘그의 말이 소떼에 관한’으로도 옮길 수 있습니다. 히브리어는 관심 일반이나 말의 주제를 모두 가리킬 수 있으며, 헬라어는 말이나 이야기의 뜻에 더 가깝습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אלוף
  english_pob_choice: one who guides
  chosen_korean: 쟁기를 잡고도
  alternatives_korean:
  - 쟁기를 이끄는 사람이
  - 쟁기질을 맡은 사람이
  - 밭일을 지휘하는 사람이
  lexicon: HALOT
  rationale: 히브리어의 קשה한 첫 절은 직함보다 농경 작업을 수행하는 사람을 가리키는 기능적 표현으로 이해하는 것이 적절하므로, 쟁기와 결합해 역할을 자연스럽게 드러냈습니다.
- source_word: ישובב
  english_pob_choice: drives
  chosen_korean: 소를 가이로 몰며
  alternatives_korean:
  - 소를 몰며
  - 소를 몰아 돌리며
  - 소를 부리며
  lexicon: HALOT
  rationale: 동사는 가축을 몰거나 움직이게 하는 뜻이므로, 경작 장면에서 자연스럽게 읽히도록 ‘가이로 몰며’로 옮겼습니다.
- source_word: שעיותיו
  english_pob_choice: whose concerns are with
  chosen_korean: 자기 관심이 … 있는
  alternatives_korean:
  - 자기 말이 … 있는
  - 자기 생각이 … 있는
  - 자기 이야기가 … 있는
  lexicon: HALOT
  rationale: 이 단어는 관심·사색·말을 모두 가리킬 수 있으나, 문맥상 노동 대상에 마음이 묶여 있다는 넓은 의미를 살려 ‘관심’으로 번역했습니다.
- source_word: בני בקר
  english_pob_choice: the cattle
  chosen_korean: 소떼에
  alternatives_korean:
  - 송아지들에
  - 황소들에
  - 가축에
  lexicon: HALOT
  rationale: 직역하면 ‘소의 아들들’이지만 관용적으로 소떼/가축을 뜻하므로, 한국어에서는 일반 독자가 바로 이해할 수 있는 ‘소떼’로 풀었습니다.
theological_decisions:
- issue: 히브리어 난해 구절을 헬라어 병행본문으로 보조할지 여부
  chosen_reading: 히브리어의 기본 농경 이미지를 유지하되, 첫 절은 직역보다 의미를 드러내는 쪽으로 풀었습니다.
  alternative_readings:
  - 헬라어에 따라 ‘쟁기를 잡는 자가 어떻게 지혜로워지겠습니까?’로 더 직접 옮길 수 있습니다.
  - 히브리어를 따라 더 모호하게 ‘쟁기질하는 사람이 어떻게 지혜로워지겠습니까?’로 둘 수 있습니다.
  rationale: 본문 자체가 첫 절에서 난해하므로, 헬라어의 명시성을 참고하되 번역문에는 히브리어의 농경 노동 장면을 자연스럽게 반영했습니다.
  doctrine_reference: '번역학 원리: 난해본문의 의미 보존과 병행본문 참고'
- issue: 수사 의문문의 한국어 처리
  chosen_reading: 반문 형식으로 ‘누가 … 지혜로워지겠습니까?’를 사용했습니다.
  alternative_readings:
  - 평서문으로 ‘그런 사람은 지혜로워지기 어렵습니다.’
  - 직설적 의문으로 ‘어떻게 지혜로워지겠습니까?’
  rationale: 본문의 수사적 질문 효과를 살리면서도 한국어 합쇼체의 자연스러운 반문으로 유지했습니다.
  doctrine_reference: 문학적 수사 보존
