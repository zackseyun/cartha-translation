  text: With his arm he will shape clay[a], and before his feet he will bend his strength.
  footnotes:
  - marker: a
    text: Or 'he will stoop with all his strength before his feet.' The Greek phrase 'he will bend his strength' is idiomatic and may describe either the craftsman's physical posture or the exertion of his power in the work.
