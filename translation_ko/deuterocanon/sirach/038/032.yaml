  text: With his arm he will shape clay[a], and before his feet he will bend his strength.
  footnotes:
  - marker: a
    text: Or 'he will stoop with all his strength before his feet.' The Greek phrase 'he will bend his strength' is idiomatic and may describe either the craftsman's physical posture or the exertion of his power in the work.
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 팔로 그는 진흙을 빚고, 그의 발 앞에서 그의 힘을 굽힙니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그는 발 앞에서 온 힘을 다해 몸을 숙입니다.’ 그리스어의 ‘그의 힘을 굽힌다’는 표현은 관용구로서, 장인의 몸 자세를 가리키거나 작업에 힘을 쏟는 모습을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν βραχίονι αὐτοῦ
  english_pob_choice: With his arm
  chosen_korean: 그의 팔로
  alternatives_korean:
  - 그의 팔로써
  - 그의 팔로서
  lexicon: LSJ
  rationale: βραχίων은 노동의 도구로서의 팔을 가리키므로, 한국어로도 수단을 나타내는 조사 ‘-로’로 자연스럽게 옮겨 팔의 물리적 도구성을 살렸습니다.
- source_word: τυπώσει πηλόν
  english_pob_choice: he will shape clay
  chosen_korean: 진흙을 빚고
  alternatives_korean:
  - 점토를 빚고
  - 진흙을 형태 짓고
  - 진흙을 빚어
  lexicon: LSJ
  rationale: πηλός는 문맥상 도공이 다루는 재료를 가리키지만, 한국어 성경 문맥에서 ‘진흙’이 더 자연스럽고 시각적입니다. τυπώσει는 단순한 ‘치다’가 아니라 빚어 형태를 만드는 뜻이므로 ‘빚다’로 옮겼습니다.
- source_word: πρὸ ποδῶν
  english_pob_choice: before his feet
  chosen_korean: 그의 발 앞에서
  alternatives_korean:
  - 그의 발 앞에
  - 발 앞에서
  lexicon: LSJ
  rationale: 공간적 위치를 드러내는 표현이므로 ‘발 앞에서’로 옮겨, 작업물이 발 아래 낮게 놓인 장면을 보존했습니다.
- source_word: κάμψει ἰσχὺν αὐτοῦ
  english_pob_choice: he will bend his strength
  chosen_korean: 그의 힘을 굽힙니다
  alternatives_korean:
  - 그의 힘을 숙입니다
  - 그의 힘으로 몸을 굽힙니다
  - 힘을 다해 몸을 굽힙니다
  lexicon: LSJ
  rationale: 그리스어는 ‘힘을 굽힌다’는 압축된 관용구로, 영어 POB처럼 신체적 자세와 노동의 힘을 함께 열어 둡니다. 한국어도 직역적 긴장을 유지해 ‘힘을 굽힙니다’로 두었습니다.
theological_decisions:
- issue: 문장의 마지막 구절이 자세 묘사인지, 능력의 발휘인지 애매한 관용구입니다.
  chosen_reading: ‘그의 힘을 굽힙니다’로 직역하여 신체적 숙임과 일에 쏟는 힘을 함께 열어 둡니다.
  alternative_readings:
  - ‘그의 몸을 굽힙니다’
  - ‘힘을 다해 몸을 숙입니다’
  rationale: 영어 POB 주석이 지적하듯 이 구절은 장인의 몸을 굽히는 자세 또는 작업에 힘을 쓰는 행위를 모두 가리킬 수 있습니다. 어느 한쪽으로 확정하지 않고 원문의 긴장을 보존하는 것이 더 충실합니다.
  doctrine_reference: 시락 38:32의 문맥적 관용구 해석
