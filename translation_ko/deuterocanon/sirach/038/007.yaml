  - 의학과 향료 제조의 세속적 직능을 단순 묘사하는 읽기
  rationale: 히브리어와 그리스어 모두 직업적 행위를 평행 구조로 제시하며, 본문은 신학적 확장보다 일상적 지혜 관찰을 전면에 둡니다.
