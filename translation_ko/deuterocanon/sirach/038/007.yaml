  source_fidelity: 히브리어 בהם을 수단의 뜻으로 ‘그것들로’라고 옮긴 것은 적절하며, רופא יניח מכאוב도 ‘의사가 고통을 덜어 준다’로 충실히 반영합니다. 그러나 וכן은 단순 결과를 뜻하는 ‘그래서’가 아니라 병렬·유사의 ‘마찬가지로’이므로 이를 명시하는 편이 정확합니다. רוקח는 여기서 향료를 조제하는 사람이지 판매상(‘향료상’)을 특별히 가리키지 않습니다.
  naturalness: ‘이것들로’보다 앞 문맥을 받는 ‘그것들로’가 한국어 성경 문맥에서 더 자연스럽습니다. ‘향료상’은 판매업자를 주로 연상시키므로 ‘향료 제조자’가 직능과 문맥에 더 맞습니다. ‘조제물’은 מרקחת의 만들어진 배합물을 자연스럽게 나타냅니다.
  terminology: 의사와 고통은 중립적이고 현대적인 용어입니다. רוקח는 ‘향료 제조자’로, מרקחת는 ‘조제물’로 옮겨 향료·약재 등의 배합이라는 어휘 범위를 보존합니다. 본문이 특정 물질을 확정하지 않으므로 ‘약’이나 ‘향수’로 한정하지 않습니다.
