  - marker: b
    text: 히브리어 יניח מכאוב는 직역하면 ‘고통을 가라앉히다/덜다’에 가깝습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: בהם
  english_pob_choice: By them
  chosen_korean: 이것들로
  alternatives_korean:
  - 그것들로
  - 그것들을 통해
  lexicon: source pronoun
  rationale: 앞선 문맥의 치료 수단을 가리키는 지시대명사로 이해하여, 원인·수단을 드러내는 자연스러운 한국어로 옮겼습니다.
- source_word: רופא
