  - 치료사
  lexicon: occupation
  rationale: 히브리어 רופא의 일반적 의미를 따라, 현대 독자가 즉시 이해할 수 있는 중립적 직업명으로 옮겼습니다.
- source_word: יניח מכאוב
  english_pob_choice: eases pain
  chosen_korean: 통증을 덜어 주고
  alternatives_korean:
  - 통증을 완화하고
  - 고통을 가라앉히고
  lexicon: verbal_phrase
  rationale: יניח는 ‘가볍게 하다/덜다’의 뉘앙스가 있어, POB의 ‘eases’에 맞추어 과도하게 강한 ‘치유하다’보다 ‘덜어 주다’를 택했습니다.
- source_word: רוקח
  english_pob_choice: perfumer
  chosen_korean: 향료상
  alternatives_korean:
  - 조향사
  - 향수 제조자
  lexicon: occupation
  rationale: 성경적 직업 배경에서 향료를 다루는 사람을 뜻하므로, POB의 ‘perfumer’ 의미를 살리되 현대 한국어에서 이해 가능한 ‘향료상’을 택했습니다.
- source_word: מרקחת
  english_pob_choice: a mixture
  chosen_korean: 혼합물
  alternatives_korean:
  - 배합물
  - 조제물
  lexicon: object
  rationale: 약재나 향료를 섞어 만든 것을 가리키므로, 단순한 ‘섞은 것’보다 기능을 드러내는 ‘혼합물’이 적절합니다.
