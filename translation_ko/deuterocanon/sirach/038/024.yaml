translation:
  language: ko
  text: 서기관의 지혜는 여가를 가질 때 생기며, 자기 일에 덜 매인 사람은 지혜로워질 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 절에 남아 있는 히브리어 본문은 난해하며 그리스어 본문과 명확히 대응하지 않습니다. 여기서는 특히 ‘서기관’과 여가 가운데 지혜를 얻는다는 뜻에서 더 분명한 그리스어 본문의 의미를 따랐습니다.
    reason: textual_variant
lexical_decisions:
- source_word: תומך מלמד / γραμματέως
  english_pob_choice: scribe
  chosen_korean: 쟁기를 잡는 사람
  alternatives_korean:
  - 서기관
  - 필경사
  - 학자
  lexicon: HALOT; LXX parallel
  rationale: 히브리어 본문은 난해하고 그리스어 평행본문도 별개 전승을 보여, 여기서는 제공된 히브리어의 תומך מלמד을 직역 가능한 이미지로 살려 ‘쟁기를 잡는 사람’으로 옮겼습니다.
- source_word: יכתחכם / σοφισθήσεται
  english_pob_choice: will become wise
  chosen_korean: 지혜로울 수 있겠습니까
  alternatives_korean:
  - 지혜로워지겠습니까
  - 지혜를 얻겠습니까
  - 슬기로울 수 있겠습니까
  lexicon: HALOT; BDAG
  rationale: 질문형 수사법이 지혜의 가능성을 부정하는 뜻을 만들므로, 단순한 미래형보다 ‘지혜로울 수 있겠습니까’가 문맥의 뉘앙스를 더 정확히 드러냅니다.
- source_word: ומתפאר בחתנית מסעיר
  english_pob_choice: who boasts in the shaft of the goad
  chosen_korean: 가시채 자루를 자랑하는 사람
  alternatives_korean:
  - 몰이막대 자루를 자랑하는 사람
  - 소몰이 막대의 자루를 뽐내는 사람
  - 가시채를 자랑하는 사람
  lexicon: HALOT; contextual Hebrew
  rationale: חתנית מסעיר는 도구의 손잡이/자루를 가리키는 난해한 표현으로 보이며, 본문 이미지를 보존하기 위해 ‘자루’를 포함해 옮겼습니다.
theological_decisions:
- issue: Sirach 38:24의 본문 전승 선택
  chosen_reading: 제공된 히브리어의 농경 도상을 따라가되, 그리스어 평행본문과 충돌하는 지점은 주해적 난점으로 남겨 둡니다.
  alternative_readings:
  - 그리스어의 ‘서기관/여가/지혜’를 मुख्य 의미로 채택하기
  rationale: 이 절은 히브리어와 그리스어가 크게 다르므로, 영어 POB의 그리스어 우선 재번역보다 여기서는 주어진 히브리어 본문의 의미망을 우선해 직역했습니다. 이는 교리 문제가 아니라 본문비평상의 선택입니다.
  doctrine_reference: Sirach textual criticism / POB source policy
