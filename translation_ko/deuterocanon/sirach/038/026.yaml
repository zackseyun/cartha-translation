base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/038/026.yaml
  text: His diligence is to finish the foddering place[b][a]; he sets his heart on plowing the furrows.
  footnotes:
  - marker: a
    text: 'Greek: ''and his wakefulness is for the fodder of calves,'' which supports the Hebrew sense of constant concern for feeding cattle. The Hebrew wording likely focuses on the stall or feeding-place, while the Greek expresses the same idea through the animals'' fodder.'
    reason: alternative_reading
  - marker: b
    text: Or 'he applies his mind to breaking up the furrows.' The Hebrew verb may denote working over the soil rather than specifically harrowing in the technical sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 가축 우리를 마무리하는 데 부지런하며[a], 밭고랑을 써레질하는 일에 마음을 둡니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 “그의 깨어 있음은 송아지들의 먹이를 위한 것이다”라고 하여, 가축의 먹이에 대한 끊임없는 관심을 나타냅니다.
    reason: cross_reference
  - marker: b
    text: 히브리어 동사는 기술적으로 ‘써레질하다’보다 넓게, 흙을 부수고 고르는 일을 뜻할 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ושקידתו
  english_pob_choice: His diligence
  chosen_korean: 그의 부지런함
  alternatives_korean:
  - 그의 끊임없는 주의
  - 그의 열심
  - 그의 깨어 있음
  lexicon: HALOT
  rationale: שקד는 지속적이고 꾸준한 주의를 뜻하므로, 농사 맥락에서 자연스러운 ‘부지런함’으로 옮겨 지속적 노동의 뉘앙스를 살렸습니다.
- source_word: לכלות
  english_pob_choice: to finish
  chosen_korean: 끝내는 데
  alternatives_korean:
  - 완성하는 데
  - 마치는 데
  - 마무리하는 데
  lexicon: HALOT
  rationale: כלה는 ‘끝내다/완성하다’의 뜻이므로, 대상이 되는 농사 일을 마무리한다는 흐름을 살려 ‘끝내는 데’로 옮겼습니다.
- source_word: מרבק
  english_pob_choice: the foddering-place
  chosen_korean: 가축우리
  alternatives_korean:
  - 사료 주는 곳
  - 먹이 우리
  - 비육우리
  lexicon: HALOT
  rationale: מרבק은 가축을 먹이고 살찌우는 우리나 장소를 가리키므로, 한국어에서 의미가 드러나는 ‘가축우리’로 옮겼습니다.
- source_word: לשדד
  english_pob_choice: on harrowing
  chosen_korean: 써레질하는 데
  alternatives_korean:
  - 갈아엎는 데
  - 흙덩이를 깨는 데
  - 고랑을 정리하는 데
  lexicon: HALOT
  rationale: 농업 용어로서 שדד는 파종 전후에 흙을 고르고 부수는 작업을 가리키므로, 기술적으로 가장 가까운 ‘써레질하다’로 옮겼습니다.
theological_decisions:
- issue: 농사 동작의 구체성 보존
  chosen_reading: 문장의 두 번째 절은 단순히 밭을 가는 일반적 노동이 아니라, 고랑을 써레질하는 구체적 농사 작업으로 읽었습니다.
  alternative_readings:
  - ‘밭고랑을 갈아엎는 데’
  - ‘고랑을 정리하는 데’
  rationale: 히브리어 לשדד와 평행하는 그리스어의 농사 이미지가 모두 실제 밭일의 세부를 가리키므로, 일반화하지 않고 구체성을 유지했습니다.
  doctrine_reference: 창세기 3장 농사 맥락; 잠언의 일상 지혜 문맥
