translation:
  language: ko
  text: 그래서 그의 일이 그치지 않게 하고, 사람들 가운데서 유익이 있게 하려는 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 תושיה는 여기서 의미가 분명하지 않으며, 그리스어 평행본문은 ‘그에게서 땅의 표면 위에 평화가 있다’고 읽습니다.
    reason: alternative_reading
  - marker: b
    text: ‘사람들’은 남성만이 아니라 일반적인 인간을 가리키는 표현입니다.
    reason: lexical_alternative
