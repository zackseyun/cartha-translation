theological_decisions:
- issue: 히브리어 תושיה와 그리스어 평행본문 εἰρήνη의 관계
  chosen_reading: 히브리어 본문을 따르되, 그리스어가 암시하는 공동체적 결과를 반영해 ‘유익’으로 옮겼습니다.
  alternative_readings:
  - 평안이 있게
  - 성공이 있게
  - 지혜가 있게
  rationale: 현존 히브리어를 우선하되, 본문이 가리키는 효과가 단순한 기술력보다 사람들 사이에 미치는 긍정적 결과라는 점을 살려야 하므로, 그리스어 증거를 참고한 포괄 번역을 선택했습니다.
  doctrine_reference: 'PHILOSOPHY.md: 히브리어가 남아 있는 구절은 히브리어를 우선하고, 그리스어 평행본문은 해석 보조로 사용함'
