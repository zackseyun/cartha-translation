  text: He will apply his heart to the completion of his work[a], and his wakefulness is to bring it to perfection.
  footnotes:
  - marker: a
    text: Greek literally, 'he will give his heart to the completion of works, and his wakefulness to adorn unto completion.' The wording is idiomatic and somewhat compressed; the translation brings out the sense of concentrated effort to finish craftsmanship well.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 일들을 완성하는 데 마음을 쏟고, 마무리할 때에는 깨어서 정돈합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 헬라어는 문자적으로 ‘그는 일들의 완성에 자기 마음을 주고, 그의 깨어 있음은 마무리 때에 정돈하기 위한 것이다’라고 합니다. 문장이 압축되어 있으며, ‘정돈하다’의 목적어는 명시되어 있지 않습니다. 이 동사는 꾸미다, 정돈하다, 알맞게 갖추다라는 뜻을 가질 수 있습니다.
    reason: source_note
lexical_decisions:
- source_word: καρδίαν αὐτοῦ δώσει
  english_pob_choice: He will apply his heart
  chosen_korean: 자기 마음을 ... 두고
  alternatives_korean:
  - 자기 마음을 바치고
  - 자기 마음을 기울이고
  - 자기 마음을 내어주고
  lexicon: LSJ
  rationale: δώσει εἰς는 곧장 ‘내다/주다’의 직역보다 어떤 일에 마음을 집중해 두는 관용을 보여 주므로, ‘마음을 두다’로 옮겨 집중과 의도를 살렸습니다.
- source_word: εἰς συντέλειαν ἔργων
  english_pob_choice: to the completion of his work
  chosen_korean: 자기 일의 완성
  alternatives_korean:
  - 일의 끝맺음
  - 일의 마무리
  - 작업의 완성
  lexicon: LSJ
  rationale: συντέλεια는 단순한 종결보다 ‘완결/완성’의 뉘앙스가 있어, 공예·노동 문맥에 맞게 ‘완성’으로 옮겼습니다.
- source_word: ἀγρυπνία αὐτοῦ
  english_pob_choice: his wakefulness
  chosen_korean: 그의 깨어 있음
  alternatives_korean:
  - 그의 철야
  - 그의 각성
  - 그의 잠 못 이룸
  lexicon: LSJ
  rationale: ἀγρυπνία는 문자적으로 잠들지 않고 깨어 있는 상태를 가리키므로, 추상적인 ‘경계’보다 이미지가 살아 있는 ‘깨어 있음’을 택했습니다.
- source_word: κοσμῆσαι ἐπὶ συντελείας
  english_pob_choice: to bring it to perfection
  chosen_korean: 그것을 끝내는 데 있습니다
  alternatives_korean:
  - 그것을 완성하는 데 있습니다
  - 그것을 정돈하여 마치는 데 있습니다
  - 그것을 완전하게 하는 데 있습니다
  lexicon: LSJ
  rationale: κοσμέω는 ‘꾸미다’ 외에도 ‘질서를 잡다, 정돈하다, 알맞게 마치다’의 뜻이 있어, 이 문맥에서는 장식보다 끝마침의 기능을 드러내는 표현이 적절합니다.
theological_decisions:
- issue: κοσμῆσαι를 ‘perfection/완전함’으로 너무 추상화할지, 아니면 마무리 행위로 살릴지
  chosen_reading: ‘그것을 끝내는 데 있습니다’로 옮겨, 수공업적 완성의 의미를 유지했습니다.
  alternative_readings:
  - ‘그것을 완전하게 하는 데 있습니다’
  - ‘그것을 아름답게 다듬는 데 있습니다’
  rationale: 이 절은 도덕적 완전성보다 장인의 집중과 마무리를 말하므로, 독자가 작업의 끝맺음을 바로 이해하도록 했습니다.
  doctrine_reference: 집회서 38:30의 노동/기술 문맥
