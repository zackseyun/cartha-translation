review_pass:
  verdict: revise
  source_fidelity: 첫 절의 ‘마음을 … 두고’는 δώσει εἰς의 집중 의미를 대체로 잘 살립니다. 그러나 ἔργων은 복수이며, 둘째 절의 κοσμῆσαι는 단순히 ‘끝내다’보다 ‘정돈하다/다듬다/꾸미다’의 의미를 포함합니다. 또한 그리스어에는 ‘그것’을 받는 명시적 목적어가 없습니다.
  naturalness: ‘그의 깨어 있음은 그것을 끝내는 데 있습니다’는 한국어에서 다소 번역투이며, ‘깨어 있음’이 추상 명사로서 행위의 주체가 되는 연결도 부자연스럽습니다. ‘마무리할 때에는 깨어서 정돈합니다’로 풀면 현대 표준어 합쇼체에서 자연스럽습니다.
  terminology: ‘마음’과 ‘완성’은 적절합니다. 다만 수공업 문맥의 ἔργα는 ‘일들’로 복수성을 드러내고, κοσμέω는 ‘정돈하다’로 옮겨 마무리·다듬기의 뜻을 보존하는 것이 좋습니다.
  issues:
  - severity: medium
    issue: 둘째 절에서 κοσμῆσαι를 ‘끝내는 데 있습니다’로만 옮김
    rationale: κοσμέω의 정돈·다듬음·꾸밈의 의미가 탈락합니다. 앞의 συντέλειαν이 이미 완성을 말하므로, 후반은 완성 단계에서 작업을 질서 있게 다듬는 행위를 나타내는 것으로 옮기는 편이 가깝습니다.
  - severity: low
    issue: ‘자기 일’이 ἔργων의 복수성을 희미하게 함
    rationale: 집합 단수도 가능하지만, 본문의 수공업적 작업들을 반영하여 ‘일들’로 옮기면 원문의 형태와 문맥이 더 잘 드러납니다.
  - severity: low
    issue: 각주가 그리스어에 없는 목적어 ‘그것’을 문자적 표현에 삽입함
    rationale: 목적어는 문맥상 추정될 수 있으나 본문에는 명시되어 있지 않습니다. 각주는 이 압축성과 목적어의 생략을 보존해야 합니다.
  revised_text: 그는 일들을 완성하는 데 마음을 쏟고, 마무리할 때에는 깨어서 정돈합니다.[a]
