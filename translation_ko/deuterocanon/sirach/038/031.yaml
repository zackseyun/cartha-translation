  yaml_path: translation/deuterocanon/sirach/038/031.yaml
  text: So the potter[a], sitting at his work and turning the wheel with his feet, is continually anxious over his work, and all his labor is by number;
  footnotes:
  - marker: a
    text: Or 'all his work is numbered.' The Greek adjective ἐνάριθμος can be rendered more directly as 'numbered' or 'counted.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이와 같이 자기 일터에 앉아 발로 물레를 돌리는 토기장이도 언제나 자기 일에 대하여 염려하며, 그가 하는 모든 일은 수로 헤아려집니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그가 하는 모든 일은 수로 셈해져 있습니다.” 그리스어 ἐνάριθμος는 “번호가 매겨진, 수로 헤아려진”이라는 뜻입니다.
    reason: lexical_alternative
