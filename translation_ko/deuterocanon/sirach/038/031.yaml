  text: So the potter[a], sitting at his work and turning the wheel with his feet, is continually anxious over his work, and all his labor is by number;
  footnotes:
  - marker: a
    text: Or 'all his work is numbered.' The Greek adjective ἐνάριθμος can be rendered more directly as 'numbered' or 'counted.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이와 같이 토기장이가 자기 일을 하며 앉아 있고, 발로 물레를 돌리면서도 늘 자기 일에 마음을 쓰며, 그의 모든 일은 수로 정해져 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그의 모든 일은 수대로 정해져 있습니다.” ἐνάριθμος는 더 직접적으로 “수대로 된/수로 셈해진” 뜻으로 옮길 수 있습니다.
    reason: lexical_alternative
