    reason: textual_variant
lexical_decisions:
- source_word: דעת / ἐπιστήμη
  english_pob_choice: knowledge
  chosen_korean: 지식
  alternatives_korean:
  - 지혜
  - 이해
  - 숙련
  lexicon: HALOT; LSJ
  rationale: 의사에게 필요한 학문적·전문적 소양을 가리키므로, 일반적인 ‘지식’이 가장 직접적이고 자연스럽습니다. 여기서는 단순한 정보가 아니라 의료적 역량을 포함하지만, 원문의 평이한 진술을 넘지 않도록 ‘지식’으로 둡니다.
- source_word: רופא / ἰατροῦ
  english_pob_choice: physician
  chosen_korean: 의사
  alternatives_korean:
  - 치유자
  - 의술인
  - 의관
  lexicon: HALOT; LSJ
  rationale: 히브리어와 헬라어 모두 의료 행위를 하는 사람을 뜻하므로 현대 한국어에서 가장 분명한 ‘의사’를 택했습니다. 고전적 ‘의관’은 시대감을 바꾸고, ‘치유자’는 직업명보다 기능 설명에 가깝습니다.
- source_word: תרים קרנו
  english_pob_choice: will raise his horn
  chosen_korean: 그의 머리를 높이 들어 올리고
  alternatives_korean:
  - 그의 뿔을 높이 들고
  - 그의 영예를 높이고
  - 그의 지위를 높이고
  lexicon: HALOT
  rationale: ‘뿔’은 권세와 영예의 관용구이지만, 한국어에서는 그대로 옮기면 이미지가 낯설 수 있습니다. 영어 POB의 주석이 보여 주듯 이 표현은 ‘높임/존귀’의 뜻이므로, 의미를 살리되 자연스러운 한국어 관용으로 ‘머리를 높이 들어 올리고’라고 옮겼습니다.
- source_word: נדיבים / μεγιστάνων
  english_pob_choice: nobles
  chosen_korean: 귀인들
  alternatives_korean:
  - 귀족들
  - 유력자들
  - 대인들
  lexicon: HALOT; LSJ
  rationale: 히브리어는 사회적으로 높은 지위의 사람들을 가리키고, 헬라어 μεγιστάνων도 ‘큰 자들/유력자들’의 뜻입니다. ‘귀인들’이 이 사회적 위상을 비교적 간결하게 담아 주며, 현대어에서도 과도하게 제도화되지 않습니다.
- source_word: יתיצב / θαυμασθήσεται
  english_pob_choice: he will stand
  chosen_korean: 그는 서게 됩니다
  alternatives_korean:
  - 그는 나서게 됩니다
  - 그는 나타나게 됩니다
  - 그는 존경을 받게 됩니다
  lexicon: HALOT; LSJ
  rationale: 히브리어 본문은 ‘서다/서 있게 되다’의 뜻이 분명하므로 이를 따랐습니다. 영어 주석이 제시하는 헬라어 ‘감탄받다’는 주석적 대안으로 보존하되, 본문은 히브리어의 공적 자리·출현의 이미지를 유지했습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행본의 차이
  chosen_reading: 본문은 히브리어의 ‘귀인들 앞에 그는 서게 됩니다’를 따르고, 그리스어의 ‘그들 앞에서 놀라움을 받게 됩니다’는 주석으로만 반영했습니다.
  alternative_readings:
  - 귀인들 앞에서 그는 존경을 받게 됩니다
  - 유력자들 앞에서 그는 찬탄을 받게 됩니다
  rationale: 시락서는 현존 히브리어 증거가 분명할 때 그것을 본문으로 삼는 것이 이 프로젝트 원칙에 부합합니다. 다만 그리스어는 의미 차이를 보여 주는 중요한 증거이므로, 본문을 바꾸지 않고 주석으로만 남겨 두었습니다.
  doctrine_reference: 'PHILOSOPHY.md: Hebrew primary where extant; Greek parallel as audit input and textual variant note.'
