theological_decisions:
- issue: 히브리어 본문과 그리스어 병행문의 차이
  chosen_reading: 본문은 현존 히브리어의 ‘의사 앞에서 버티게 됩니다’를 따르고, 그리스어의 ‘의사의 손에 떨어지다’는 각주로 보존합니다.
  alternative_readings:
  - 그리스어를 따라 ‘의사의 손에 떨어지게 됩니다’
  rationale: 집합적 편집 원칙상 현존 히브리어가 우선이지만, 두 전승의 의미 차이가 분명하므로 대안 독법을 각주로 남겨 투명성을 확보합니다.
  doctrine_reference: 'PHILOSOPHY.md: Hebrew precedence where extant, with preserved textual alternatives in footnotes'
