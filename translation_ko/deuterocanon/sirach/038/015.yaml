  source_fidelity: 첫 행은 히브리어의 일반화된 관계절과 ‘그를 지으신 분 앞에서 죄를 짓다’를 대체로 충실히 반영합니다. 둘째 행의 ‘버티게 됩니다’는 יתנכר의 비협조적·적대적 태도를 일부 전달하지만, 한국어에서는 다소 구어적이고 의미가 불명확합니다. ‘반항할 것입니다’가 히브리어 본문이 가리키는 의사에 대한 저항적 태도를 더 분명하게 나타냅니다.
  naturalness: ‘자기 지으신 분’은 ‘자기를 지으신 분’으로도 해석될 수 있어 ‘그 자신을 지으신 분’처럼 들릴 위험이 있습니다. ‘자신을 지으신 분’이 자연스럽고 정확합니다. 또한 ‘버티게 됩니다’보다 ‘반항할 것입니다’가 현대 표준어의 격식 있는 문체에 더 적합합니다.
