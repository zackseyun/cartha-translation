base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/038/010.yaml
  text: Turn away from wrongdoing[a], and make your hands straight[b]; and from every sin cleanse your heart.
  footnotes:
  - marker: a
    text: The middle clause is textually difficult in the surviving Hebrew. The Greek parallel reads 'make straight your hands,' which likely reflects the intended sense of setting one's actions right.
    reason: textual_variant
  - marker: b
    text: Or 'from all transgressions.' The Hebrew term can carry the stronger sense of rebellious offenses, though the Greek parallel has 'from every sin.'
    reason: lexical_alternative
translation:
  language: ko
  text: 불의에서 돌아서십시오[a], 그리고 손을 바르게 하십시오[b]. 또한 모든 죄에서 마음을 깨끗하게 하십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘불의에서’. 히브리어 מעול은 ‘불의/부정의/죄악’까지 넓게 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어의 중간절은 본문상 난해하지만, 그리스어 평행문은 ‘손을 곧게 하다’로 읽습니다. 여기서는 그 의미를 따라 옮겼습니다.
    reason: textual_variant
lexical_decisions:
- source_word: נום
  english_pob_choice: Turn away
  chosen_korean: 돌아서십시오
  alternatives_korean:
  - 떠나십시오
  - 물러서십시오
  lexicon: HALOT
  rationale: 히브리어 동사는 잘못에서 물러서는 회개적 방향 전환을 나타내며, 예의체 명령형으로는 ‘돌아서십시오’가 자연스럽고 힘 있게 그 의미를 살립니다.
- source_word: מעול
  english_pob_choice: from wrongdoing
  chosen_korean: 불의에서
  alternatives_korean:
  - 잘못에서
  - 죄악에서
  - 불법에서
  lexicon: HALOT
  rationale: עול은 단순한 실수보다 도덕적 불의와 부정의의 뉘앙스를 가지므로, 한국어에서는 더 직접적인 ‘불의’가 본문의 윤리적 무게를 잘 드러냅니다.
- source_word: ומהכר פנים
  english_pob_choice: and make your hands straight
  chosen_korean: 손을 바르게 하십시오
  alternatives_korean:
  - 손을 곧게 하십시오
  - 행동을 바르게 하십시오
  - 손을 곧게 다스리십시오
  lexicon: HALOT
  rationale: 히브리어 구문은 난해하지만, 그리스어의 ‘손을 곧게 하라’는 평행 구조를 따라 행동의 바로잡음을 뜻하는 표현으로 옮겼습니다. 한국어에서는 직역보다 ‘손을 바르게 하다’가 관용적으로도 이해됩니다.
- source_word: ומכל פשעים
  english_pob_choice: and from every sin
  chosen_korean: 모든 죄에서
  alternatives_korean:
  - 모든 허물에서
  - 모든 범죄에서
  - 모든 죄과에서
  lexicon: HALOT
  rationale: פשעים는 ‘허물/범죄/반역’까지 포괄할 수 있으나, 본문과 그리스어 평행문의 총괄적 의미를 살려 ‘모든 죄에서’로 옮겼습니다.
- source_word: טהר לב
  english_pob_choice: cleanse your heart
  chosen_korean: 마음을 깨끗하게 하십시오
  alternatives_korean:
  - 마음을 정결하게 하십시오
  - 마음을 정화하십시오
  lexicon: HALOT
  rationale: טהר는 정결하게 하다/깨끗하게 하다의 의미이므로, 현대 한국어에서 자연스럽고 직접적인 ‘깨끗하게 하십시오’를 택했습니다.
theological_decisions:
- issue: 난해한 히브리어 중간절과 그리스어 평행문의 관계
  chosen_reading: 히브리어를 기본으로 하되, 중간절은 그리스어의 명료한 평행구를 따라 행동의 바로잡음으로 이해해 번역했습니다.
  alternative_readings:
  - 난해한 히브리어를 문자적으로 옮기기
  - 얼굴 관련 관용구로 따로 해석하기
  rationale: 본문이 minor_mismatch로 표시되어 있고 그리스어가 ‘손을 곧게 하라’는 분명한 권고를 제시하므로, 독자가 본문의 윤리적 흐름을 오해하지 않도록 그 의미를 반영했습니다.
  doctrine_reference: 'Sirach 번역 원칙: 보존된 히브리어를 우선하되, 불확실한 곳은 그리스어 평행문으로 의미를 보정'
