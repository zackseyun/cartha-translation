base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/038/010.yaml
  text: Turn away from wrongdoing[a], and make your hands straight[b]; and from every sin cleanse your heart.
  footnotes:
  - marker: a
    text: The middle clause is textually difficult in the surviving Hebrew. The Greek parallel reads 'make straight your hands,' which likely reflects the intended sense of setting one's actions right.
    reason: textual_variant
  - marker: b
    text: Or 'from all transgressions.' The Hebrew term can carry the stronger sense of rebellious offenses, though the Greek parallel has 'from every sin.'
    reason: lexical_alternative
translation:
  language: ko
  text: 불의에서 돌아서십시오. 손을 바르게 하십시오[a]. 모든 죄에서 마음을 깨끗하게 하십시오[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 현존 히브리어의 중간절은 본문상 난해합니다. 그리스어 평행문은 ‘손을 곧게 하라’고 읽으며, 이는 행동을 바로잡으라는 뜻을 반영하는 것으로 보입니다.
    reason: textual_variant
  - marker: b
    text: 또는 ‘모든 허물에서’. 히브리어 פשעים는 반역적 범죄라는 더 강한 뉘앙스를 지닐 수 있으나, 그리스어 평행문은 ‘모든 죄에서’라고 읽습니다.
    reason: lexical_alternative
