  rationale: עול은 단순한 실수보다 도덕적 불의와 부정의의 뉘앙스를 가지므로, 한국어에서는 더 직접적인 ‘불의’가 본문의 윤리적 무게를 잘 드러냅니다.
- source_word: ומהכר פנים
  english_pob_choice: and make your hands straight
  chosen_korean: 손을 바르게 하십시오
  alternatives_korean:
  - 손을 곧게 하십시오
  - 행동을 바르게 하십시오
  - 손을 곧게 다스리십시오
  lexicon: HALOT
  rationale: 히브리어 구문은 난해하지만, 그리스어의 ‘손을 곧게 하라’는 평행 구조를 따라 행동의 바로잡음을 뜻하는 표현으로 옮겼습니다. 한국어에서는 직역보다 ‘손을 바르게 하다’가 관용적으로도 이해됩니다.
- source_word: ומכל פשעים
  english_pob_choice: and from every sin
  chosen_korean: 모든 죄에서
  alternatives_korean:
  - 모든 허물에서
  - 모든 범죄에서
  - 모든 죄과에서
  lexicon: HALOT
  rationale: פשעים는 ‘허물/범죄/반역’까지 포괄할 수 있으나, 본문과 그리스어 평행문의 총괄적 의미를 살려 ‘모든 죄에서’로 옮겼습니다.
- source_word: טהר לב
  english_pob_choice: cleanse your heart
  chosen_korean: 마음을 깨끗하게 하십시오
  alternatives_korean:
  - 마음을 정결하게 하십시오
  - 마음을 정화하십시오
  lexicon: HALOT
  rationale: טהר는 정결하게 하다/깨끗하게 하다의 의미이므로, 현대 한국어에서 자연스럽고 직접적인 ‘깨끗하게 하십시오’를 택했습니다.
theological_decisions:
