translation:
  language: ko
  text: 그의 탄원이 응답받을 수 있고[a], 그의 치유는 생명을 보존하는 데 쓰입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 פשרה는 여기서 뜻이 분명하지 않습니다. 그리스어 평행본문은 더 분명하게 ‘그들도 주님께 기도하여, 그분이 그들에게 안식과 치유를 번영하게 하시기를’로 읽힙니다.
    reason: alternative_reading
lexical_decisions:
- source_word: פשרה
  english_pob_choice: his plea
  chosen_korean: 그의 탄원
  alternatives_korean:
  - 그의 간구
  - 그의 청원
  - 그의 기도
  lexicon: HALOT
  rationale: 히브리어 פשרה는 이 절에서 뜻이 분명하지 않지만, 영어 POB가 그 청원적 의미를 살려 ‘plea’로 처리한 점을 따라 한국어도 예배문체보다 중립적인 ‘탄원’으로 옮겼습니다.
- source_word: יצלח
  english_pob_choice: may succeed
  chosen_korean: 응답받을 수 있고
  alternatives_korean:
  - 성공할 수 있고
  - 잘될 수 있고
  - 번성할 수 있고
  lexicon: HALOT
  rationale: 동사의 핵심은 일이 ‘잘 풀리다/성공하다’는 뜻이지만, 앞의 탄원과 결합될 때 한국어에서는 ‘응답받다’가 결과를 가장 자연스럽게 드러내므로 그렇게 옮겼습니다.
- source_word: ורפאות
  english_pob_choice: his healing
  chosen_korean: 그의 치유
  alternatives_korean:
  - 그의 치료
  - 그의 회복
  - 치유
  lexicon: HALOT
  rationale: 복수형이라도 의미상 치유·회복의 수단과 행위를 가리킬 수 있으므로, 현대 한국어에서 자연스럽고 본문 초점에 맞는 ‘치유’를 선택했습니다.
- source_word: למען מחיה
  english_pob_choice: for the sake of preserving life
  chosen_korean: 생명을 보존하는 데
  alternatives_korean:
  - 생명을 살리기 위해
  - 생존을 위해
  - 생명을 유지하기 위해
  lexicon: HALOT
  rationale: למען은 목적을, מחיה는 생명 유지/생존을 가리키므로 목적 표현을 살려 ‘생명을 보존하는 데’라고 옮겼습니다.
theological_decisions:
- issue: 히브리어의 난해한 פשרה를 과도하게 해석하지 않고, 그리스어 병행구가 드러내는 간구-치유-생명 보존의 흐름을 어떻게 반영할지
  chosen_reading: 본문은 히브리어의 압축된 구조를 유지하되, 첫 절의 의미를 ‘탄원’으로 풀어 간구의 뜻을 드러내고 마지막 절은 생명 보존의 목적을 명시했습니다.
  alternative_readings:
  - 그의 기도가 응답될 수 있고, 그의 치유는 생명을 보존합니다.
  - 그의 간구가 성공하고, 그의 치유는 생명을 살리기 위한 것입니다.
  rationale: 히브리어 본문이 불확실한 부분을 포함하므로 뜻을 지나치게 특정하지 않으면서도, 그리스어 평행본문이 제시하는 supplication/healing-for-life의 의미망을 한국어에 반영했습니다.
  doctrine_reference: 'Sirach source policy: Hebrew primary with Greek parallel as clarifying input; preserve ambiguity where the witness is uncertain.'
