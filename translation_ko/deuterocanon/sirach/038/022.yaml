  rationale: 히브리어 본문을 우선하여, ‘죽은 이의 안식’(מושבת מתו)을 배경으로 ‘그를 기억하는 일을 그치라’(שבת זכרו)는 권면을 본문에 복원했습니다. 이는 애도를 끝내라는 문맥적 권고를 전달하지만, 기간이나 방식에 관한 추가 해석은 덧붙이지 않습니다. נפש의 넓은 의미 범위와 그리스어의 실질적으로 다른 독법은 각각 주석으로 보존했습니다.
