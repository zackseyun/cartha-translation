base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/038/022.yaml
  text: The resting place of the dead is his dwelling[b][a]; and be comforted when his life departs.
  footnotes:
  - marker: a
    text: Or, 'when his soul departs.' Hebrew נפש can mean life, soul, self, or life-breath.
    reason: lexical_alternative
  - marker: b
    text: 'The Greek parallel reads substantially differently: ''Remember that his judgment is like yours: mine yesterday, and yours today.'' This likely reflects a different textual form than the surviving Hebrew.'
    reason: alternative_reading
translation:
  language: ko
  text: 죽은 이가 안식하면 그를 기억하는 일을 그치고, 그의 생명이 떠날 때 위로를 받으십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 혼이 떠날 때’. 히브리어 נפש는 생명, 혼, 자신, 또는 숨결을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어 병행문은 상당히 다릅니다. ‘그의 심판이 너의 것과 같다는 것을 기억하라. 내게는 어제였고 너에게는 오늘이다.’ 이는 보존된 히브리어와 다른 본문 형태를 반영하는 것으로 보입니다.
    reason: textual_variant
lexical_decisions:
- source_word: מושבת מתו
  english_pob_choice: The resting place of the dead is his dwelling
  chosen_korean: 죽은 이의 거처는 그의 안식처
  alternatives_korean:
  - 죽은 이의 거처는 그의 집
  - 죽은 이의 머무는 자리는 그의 거처
  lexicon: HALOT
  rationale: מושבת는 ‘앉는 곳/거처’ 계열로, כאן에서는 मृत자의 거주·안식 자리를 가리키므로 ‘안식처’가 문맥상 가장 자연스럽고 장례적 뉘앙스를 살립니다.
- source_word: שבת
  english_pob_choice: be comforted
  chosen_korean: 위로를 받으십시오
  alternatives_korean:
  - 위로를 받으세요
  - 스스로 위로하십시오
  lexicon: HALOT
  rationale: 히브리어의 위로 권고를 현대 합쇼체로 자연스럽게 옮기면서도, 수동·수용적 뉘앙스를 살려 ‘위로를 받으십시오’로 표현했습니다.
- source_word: צאת נפשו
  english_pob_choice: when his life departs
  chosen_korean: 그의 생명이 떠날 때
  alternatives_korean:
  - 그의 혼이 떠날 때
  - 그의 영이 떠날 때
  lexicon: HALOT
  rationale: נפש는 생명, 혼, 자신, 숨결까지 포괄하므로, 본문은 죽음의 관용구를 과도한 신학화 없이 드러내는 ‘생명’으로 옮겼습니다.
theological_decisions:
- issue: נפש의 의미 범위
  chosen_reading: 본문에는 ‘그의 생명’으로 두어 죽음의 순간을 자연스럽게 표현했습니다.
  alternative_readings:
  - ‘그의 혼’으로 옮길 수 있습니다.
  - ‘그의 영’으로 옮길 수도 있습니다.
  rationale: 이 절은 נפש의 인간학적 범위를 확정하기보다 죽음의 이별을 말하므로, 한국어 본문은 ‘생명’을 택하고 대안은 주석에서 열어 두는 편이 원문 긴장을 보존합니다.
  doctrine_reference: 'DOCTRINE.md: 의미 범위를 단정하지 말고 본문이 허용하는 긴장을 유지한다.'
- issue: 히브리어 본문과 그리스어 병행문의 차이
  chosen_reading: 히브리어 본문을 따라 장례적 권면으로 번역했습니다.
  alternative_readings:
  - 그리스어 병행문의 ‘그의 심판은 너의 것과 같다’는 독법을 따를 수 있습니다.
  rationale: 보존된 히브리어 본문이 주요 आधार이지만, 그리스어는 현존 히브리어와 크게 다르므로 본문 번역은 히브리어를 우선하고 차이는 주석으로만 남깁니다.
  doctrine_reference: 'PHILOSOPHY.md: 보존된 히브리어를 우선하되, 병행 전승의 큰 차이는 투명하게 기록한다.'
