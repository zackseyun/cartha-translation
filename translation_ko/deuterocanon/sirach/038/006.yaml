base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/038/006.yaml
  text: And he gave man understanding[c][b][a], to glory in his might.
  footnotes:
  - marker: a
    text: Or 'humankind' or 'mortals'; Hebrew 'man' here has a representative, collective sense.
    reason: lexical_alternative
  - marker: b
    text: Or 'to boast.' The Hebrew can carry the sense of glorying or exulting, and the Greek parallel supports an exalted sense rather than mere self-congratulation.
    reason: lexical_alternative
  - marker: c
    text: The Hebrew reads 'in his might/mighty deeds'; the Greek parallel reads 'in his wondrous things,' which supports understanding this as God's manifested works.
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 그분께서는 사람에게 이해력을 주셔서, 그분의 능력을 자랑하게 하셨습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 אֱנוֹשׁ는 여기서 개별 남성을 가리키기보다 인류 일반을 대표하는 집합적 표현일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 להתפאר는 '자랑하다'의 뜻을 가질 수 있으며, 그리스어 병행본문도 높은 어조의 '영광을 돌리다/자랑하다' 쪽을 지지합니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 בגבורתו는 문자적으로는 '그의 능력 안에서/그의 능력으로'에 가깝고, 그리스어는 '그의 놀라운 일들 안에서'라고 읽습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ויתן
  english_pob_choice: And he gave
  chosen_korean: 그리고 그분께서는 ... 주셔서
  alternatives_korean:
  - 그리고 그분께서는 ... 주셨습니다
  - 그리고 그분께서는 ... 주십니다
  lexicon: HALOT
  rationale: 완료형 서술로 과거의 주심을 자연스럽게 반영하고, 이어지는 목적절을 한국어로 매끄럽게 연결했습니다.
- source_word: לאנוש
  english_pob_choice: man
  chosen_korean: 사람
  alternatives_korean:
  - 인간
  - 인류
  - 사람들
  lexicon: HALOT
  rationale: 히브리어 אֱנוֹשׁ의 대표적·집합적 의미를 살리면서도 현대 한국어에서 가장 무난한 단수 대표형으로 옮겼습니다.
- source_word: בינה
  english_pob_choice: understanding
  chosen_korean: 이해력
  alternatives_korean:
  - 분별력
  - 지식
  - 통찰
  lexicon: HALOT
  rationale: בינה의 핵심 의미인 이해·분별을 살리되, 문맥상 하나님이 주신 인식 능력을 드러내기 위해 '이해력'을 선택했습니다.
- source_word: להתפאר
  english_pob_choice: to glory
  chosen_korean: 자랑하게
  alternatives_korean:
  - 영광을 돌리게
  - 기뻐하게
  - 자부하게
  lexicon: HALOT
  rationale: 히트파엘형의 자기-드러냄/자랑의 뉘앙스를 한국어 동사로 직접 살리기 위해 '자랑하게'를 택했습니다. '영광을 돌리다'는 의미를 약화시킬 수 있습니다.
- source_word: בגבורתו
  english_pob_choice: in his might
  chosen_korean: 그분의 능력
  alternatives_korean:
  - 그분의 힘
  - 그분의 능하신 일들
  - 그분의 위력
  lexicon: HALOT
  rationale: 히브리어 גְּבוּרָה의 '능력, 위력, 용맹' 범위를 반영하면서, 문맥상 하나님을 가리키는 소유대명사를 자연스럽게 한국어로 옮겼습니다.
theological_decisions:
- issue: 문장의 목적절이 인간의 자기과시인지, 하나님의 능력을 찬양하는 것인지
  chosen_reading: 사람에게 주신 이해력은 궁극적으로 하나님의 능력을 자랑하도록 주어진 것입니다.
  alternative_readings:
  - 사람이 자기 자신의 힘을 자랑하도록 주어진 것입니다
  - 사람이 하나님 앞에서 기뻐하며 살도록 주어진 것입니다
  rationale: 히브리어의 소유대명사와 인접 문맥, 그리고 그리스어 병행본문이 모두 하나님의 행위를 가리키므로, 인간의 자만으로 약화시키지 않고 하나님 찬양의 방향을 살렸습니다.
  doctrine_reference: 문맥 우선, 소유대명사의 지시를 하나님의 행위로 읽는 원칙
- issue: '''자랑하게''의 신학적 톤'
  chosen_reading: '''자랑하게''를 유지해 인간의 인식이 하나님의 위대하심을 드러내는 방향을 살렸습니다.'
  alternative_readings:
  - '''영광을 돌리게''로 완화'
  - '''기뻐하게''로 중화'
  rationale: POB의 'to glory'는 단순한 자기만족보다 더 높아진 찬양의 어감을 지니므로, 이를 약화하지 않고 그대로 보존했습니다.
  doctrine_reference: 찬양/자랑 어휘의 보존 원칙
