base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/038/006.yaml
  text: And he gave man understanding[c][b][a], to glory in his might.
  footnotes:
  - marker: a
    text: Or 'humankind' or 'mortals'; Hebrew 'man' here has a representative, collective sense.
    reason: lexical_alternative
  - marker: b
    text: Or 'to boast.' The Hebrew can carry the sense of glorying or exulting, and the Greek parallel supports an exalted sense rather than mere self-congratulation.
    reason: lexical_alternative
  - marker: c
    text: The Hebrew reads 'in his might/mighty deeds'; the Greek parallel reads 'in his wondrous things,' which supports understanding this as God's manifested works.
    reason: alternative_reading
translation:
  language: ko
  text: 그분께서는 사람[a]에게 이해력을 주셔서 그분의 능력[c]을 자랑으로 여기게[b] 하셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 אֱנוֹשׁ는 여기서 개별 남성을 가리키기보다 인류 일반을 대표하는 집합적 표현일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 להתפאר는 ‘자랑하다’, ‘영광으로 여기다’, 또는 ‘영광을 받다’로 옮길 수 있습니다. 그리스어 병행본문은 높은 어조의 영광과 관련된 의미를 나타냅니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 בגבורתו는 직역하면 ‘그의 능력 안에서’입니다. 문맥과 그리스어 병행본문의 ‘그의 놀라운 일들’은 이를 하나님의 능력 또는 드러난 일들로 이해하게 합니다. 다만 히브리어 소유 접미사만으로 그 지시 대상을 문법적으로 확정할 수는 없습니다.
    reason: alternative_reading
