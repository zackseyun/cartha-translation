base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/038/005.yaml
  text: Was not water made sweet by wood[c][b][a], so that his power might be made known to every man?
  footnotes:
  - marker: a
    text: Or 'its power,' taking the pronoun to refer to the wood; the Hebrew and Greek allow this, though the context favors God's power displayed through the means used.
    reason: alternative_reading
  - marker: b
    text: Likely alludes to the episode in which bitter water was made sweet by means of wood (Exod 15:25).
    reason: cross_reference
  - marker: c
    text: Hebrew 'every man' uses a masculine singular term for humanity in general.
    reason: cultural_note
translation:
  language: ko
  text: 나무로[b] 물이 달게 된 것은, 모든 사람[c]에게 그의 능력[a]을 알리기 위해서가 아니겠습니까?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그의 능력’은 나무의 능력을 가리킬 수도 있습니다. 그러나 문맥상 하나님께서 드러내신 능력으로 이해될 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 이 구절은 출애굽기 15:25에서 쓴 물이 나무로 달게 된 사건을 떠올리게 합니다.
    reason: cross_reference
  - marker: c
    text: ‘모든 사람’은 히브리어의 남성 단수형으로 된 인류 일반 표현을 한국어로 옮긴 것입니다.
    reason: cultural_note
lexical_decisions:
- source_word: הלא / οὐκ
  english_pob_choice: Was not
  chosen_korean: …이 아니겠습니까?
  alternatives_korean:
  - …아니었습니까?
  - …이 아니겠느냐?
  lexicon: HALOT; SBLGNT parallel
  rationale: 수사적 질문으로서의 기대된 동의를 살리기 위해 한국어에서는 정중한 반문형으로 옮겼습니다.
- source_word: בעץ / ξύλου
  english_pob_choice: by wood
  chosen_korean: 나무로
  alternatives_korean:
  - 나무로써
  - 나무에 의해
  - 한 조각 나무로
  lexicon: HALOT; LSJ
  rationale: ב + כלי/수단의 용법을 자연스럽게 드러내면서, 본문의 물-나무 매개를 과도하게 구체화하지 않기 위해 ‘나무로’로 옮겼습니다.
- source_word: המתיקו / ἐγλυκάνθη
  english_pob_choice: made sweet
  chosen_korean: 물이 달게 되었으니
  alternatives_korean:
  - 물이 달아졌으니
  - 물이 달게 만들어졌으니
  lexicon: HALOT; LSJ
  rationale: ‘달게 되다’는 변화를 간결하게 나타내며, 히브리어와 그리스어가 모두 가리키는 물의 성질 변화에 충실합니다.
- source_word: כל אנוש
  english_pob_choice: every man
  chosen_korean: 모든 사람
  alternatives_korean:
  - 모든 인간
  - 각 사람
  lexicon: HALOT
  rationale: 원문은 남성 단수의 인간 일반을 가리키지만, 한국어에서는 성별 표지를 굳이 유지하기보다 대표성 있는 일반어 ‘모든 사람’이 자연스럽습니다.
theological_decisions:
- issue: כחו / αὐτοῦ의 소유격 지시 대상
  chosen_reading: ‘그의 힘’은 하나님을 가리키는 것으로 이해하되, 번역 본문에서는 원문의 인칭 소유격을 그대로 유지했습니다.
  alternative_readings:
  - ‘그것의 힘’으로 나무를 가리킴
  - ‘모세의 힘’으로 이해
  rationale: 문맥상 기적의 의미는 매개인 나무 자체보다 하나님이 드러내신 능력에 초점이 있으므로 인칭 소유격을 보존하면서도, 모호성은 본문에서 강제로 해소하지 않았습니다.
  doctrine_reference: 본문의 의도된 긴장을 보존하고, 해석은 주석에서 다루기
