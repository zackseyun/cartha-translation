  text: He will apply his heart to complete the glaze[b][a], and his wakefulness is to cleanse the furnace.
  footnotes:
  - marker: a
    text: Or 'the kiln.' In the pottery context of the surrounding lines, κάμινος may refer specifically to a kiln rather than a furnace in general.
    reason: lexical_alternative
  - marker: b
    text: The Greek wording here is somewhat difficult, especially τὸ χάρισμα. The translation understands it as the pottery's finished coating or decorative finish ('glazing') in light of the surrounding context.
    reason: alternative_reading
translation:
  language: ko
  text: 그는 마음을 기울여 그 마감을 완성할 것이며, 그의 깨어 있음은 가마를 깨끗하게 할 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 문맥상 일반적인 ‘가마’보다 도자기를 굽는 가마를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: τὸ χάρισμα는 이 문맥에서 ‘은사’가 아니라 도자기의 표면 처리나 완성된 마감으로 이해하는 것이 자연스럽습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: καρδίαν ἐπιδώσει
  english_pob_choice: he will apply his heart
  chosen_korean: 마음을 기울여
  alternatives_korean:
  - 마음을 바쳐
  - 마음을 두고
  - 마음을 집중하여
  lexicon: LSJ
  rationale: ‘마음을 기울이다’는 마음을 특정 일에 적극적으로 돌린다는 관용을 살리면서, 원문의 구체적 인간 내부를 가리키는 표현을 자연스럽게 옮깁니다.
- source_word: τὸ χάρισμα
  english_pob_choice: the glazing
  chosen_korean: 그 마감
  alternatives_korean:
  - 그 유약칠
  - 그 장식
  - 그 마무리
  lexicon: LSJ
  rationale: 문맥이 도자기 제작이므로 ‘은사’가 아니라 공정의 완성된 표면 처리를 가리키는 뜻으로 보아, 일반 독자도 이해할 수 있는 ‘마감’으로 옮겼습니다.
- source_word: ἡ ἀγρυπνία αὐτοῦ
  english_pob_choice: his wakefulness
  chosen_korean: 그의 깨어 있음
  alternatives_korean:
  - 그의 철야
  - 그의 경계함
  - 그의 깨어 지킴
  lexicon: LSJ
  rationale: ἀγρυπνία의 핵심은 잠들지 않고 일에 매달리는 상태이므로, 추상적인 ‘경계’보다 상태를 직접 드러내는 표현을 택했습니다.
- source_word: κάμινον
  english_pob_choice: the furnace
  chosen_korean: 가마
  alternatives_korean:
  - 용광로
  - 화덕
  - 화로
  lexicon: LSJ
  rationale: 영어 POB의 각주처럼 이 단어는 문맥상 일반적인 furnace보다 도자기 굽는 ‘가마’가 더 적절하므로, 공예 맥락을 살려 옮겼습니다.
theological_decisions:
- issue: 도공 작업을 묘사하는 전문 용어의 번역
  chosen_reading: 이 절은 영적 은유보다 실제 제작 공정을 묘사하는 것으로 읽고, ‘마감’과 ‘가마’ 같은 공예 어휘를 사용했습니다.
  alternative_readings:
  - 도덕적 수양의 비유로 넓게 읽는 해석
  - ‘은사’로 직역하는 해석
  rationale: 원문과 주변 문맥이 도공의 노동과 불가마를 가리키므로, 후대 교회어를 덧씌우기보다 작업 현장의 의미를 살리는 것이 본문의 의도에 더 가깝습니다.
  doctrine_reference: 문맥 우선 번역 원칙; 집회서 38장 주변의 도예 작업 묘사
