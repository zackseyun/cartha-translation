    rationale: 선택어 ‘가마’는 이미 도자기를 굽는 kiln을 뜻하므로, ‘도자기를 굽는 가마’라고 다시 제시하는 것은 유의미한 대안이 아닙니다. κάμινος의 더 일반적인 뜻인 ‘화덕’을 대안으로 제시하는 편이 적절합니다.
