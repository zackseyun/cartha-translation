translation:
  language: ko
  text: 이 모든 이들은 자기 손에 의지하였으며, 각 사람은 자기 일에 능숙합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 표현은 다소 어렵습니다. 이 구절은 '그들의 손에 맡겨졌다' 또는 '자기 손을 신뢰하였다'로도 이해될 수 있습니다. 본문은 이 장인들이 손기술에 의지한다는, 가장 그럴듯한 뜻을 따랐습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: πάντες οὗτοι
  english_pob_choice: All these
  chosen_korean: 이 모든 이들
  alternatives_korean:
  - 모든 이들
  - 이들 모두
  lexicon: LSJ
  rationale: 지시어 οὗτοι를 살려 앞선 장인의 무리를 가리키는 표현으로 옮겼습니다. 남성 명사로 한정하지 않고 원문 범위를 보존했습니다.
- source_word: εἰς χεῖρας αὐτῶν ἐνεπίστευσαν
  english_pob_choice: have trusted in their hands
  chosen_korean: 자기 손에 의지하였고
  alternatives_korean:
  - 그들의 손에 맡겨졌고
  - 자기 손을 신뢰하였고
  lexicon: LSJ
  rationale: 원문의 동사는 '맡기다/신뢰하다'와 '의지하다'의 긴장이 있는 표현인데, 문맥상 장인들이 손기술에 기대는 뜻을 드러내므로 '의지하다'를 택했습니다.
- source_word: ἕκαστος ἐν τῷ ἔργῳ αὐτοῦ
  english_pob_choice: each becomes skillful in his own work
  chosen_korean: 각 사람은 자기 일에서
  alternatives_korean:
  - 각자는 자기 일에서
  - 각 사람은 자기 공예에서
  lexicon: LSJ
  rationale: ἔργον을 특정 직업적 문맥에서 '일'로 옮겨, 원문의 보편적 표현을 유지하되 자연스러운 한국어로 정리했습니다.
- source_word: σοφίζεται
  english_pob_choice: becomes skillful
  chosen_korean: 능숙해집니다
  alternatives_korean:
  - 지혜로워집니다
  - 숙련됩니다
  lexicon: LSJ
  rationale: 이 문맥에서는 지적 '지혜'보다 기술적 숙련의 의미가 강하므로, 장인의 맥락을 반영해 '능숙해지다'로 옮겼습니다.
