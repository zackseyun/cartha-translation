  text: A scribe’s wisdom increases wisdom[a], and one free from busyness will become wise.
  footnotes:
  - marker: a
    text: 'Hebrew: ''lacking occupation/business.'' The Greek parallel points toward the sense of being at rest or in leisure, which supports the rendering ''free from busyness.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 서기관의 지혜는 지혜를 더해 주고, 일에 얽매이지 않는 사람은 지혜롭게 됩니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘일/업무가 없는’ 뜻이며, 그리스어 평행본문은 ‘쉼/한가로움’의 뉘앙스를 더 분명히 보여 줍니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חכמת סופר
  english_pob_choice: A scribe’s wisdom
  chosen_korean: 서기관의 지혜
  alternatives_korean:
  - 필경사의 지혜
  - 서사의 지혜
  lexicon: HALOT
  rationale: סופר는 단순한 ‘글 쓰는 사람’보다 학문과 본문을 다루는 ‘서기관’이 자연스럽고, 지혜 문맥에서도 역할을 살립니다.
- source_word: תרבה
  english_pob_choice: increases
  chosen_korean: 더해 주고
  alternatives_korean:
  - 증가시키고
  - 늘리고
  lexicon: HALOT
  rationale: 히필의 증대·증가 의미를 한국어로 자연스럽게 살리면서, 앞의 ‘지혜’와의 반복을 어색하지 않게 옮겼습니다.
- source_word: וחסר עסק
  english_pob_choice: one free from busyness
  chosen_korean: 일에 얽매이지 않는 사람
  alternatives_korean:
  - 일이 없는 사람
  - 업무에서 벗어난 사람
  - 일에 바쁜 일 없는 사람
  lexicon: HALOT
  rationale: עסק은 단순한 ‘일’보다 ‘일에 얽매인 분주함/관여’의 뉘앙스가 있어, POB의 ‘busyness’에 맞춰 속박감 있는 표현으로 옮겼습니다.
- source_word: ייתחכם
  english_pob_choice: will become wise
  chosen_korean: 지혜롭게 됩니다
  alternatives_korean:
  - 지혜로워집니다
  - 지혜를 얻게 됩니다
  lexicon: HALOT
  rationale: 히트파엘의 진입·형성 의미를 반영해 ‘지혜롭게 되다’로 옮겼고, 합쇼체 현재·미래 맥락에 맞게 정리했습니다.
theological_decisions:
- issue: “일에 얽매이지 않는”의 의미 범위
  chosen_reading: 이 구절은 단순한 무직 상태가 아니라, 지혜를 배우고 숙고할 수 있도록 일상적 분주함에서 풀려 있는 상태를 말한다고 읽었습니다.
  alternative_readings:
  - 단순한 실업 상태
  - 경제적 여유가 있는 상태
  rationale: 히브리어 עסקים 계열 표현과 그리스어 평행본문이 ‘휴식/한가로움’ 쪽을 지지하므로, 사회경제적 상황보다 지혜 학습에 유리한 여유를 강조했습니다.
  doctrine_reference: Sirach 38:23의 지혜-교육 맥락
