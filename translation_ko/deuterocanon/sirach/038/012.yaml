  to: 또한 의사에게도 자리를 내어 주십시오[a]. 그를 떠나보내지 마십시오. 그도 필요하기 때문입니다.
  rationale: 히브리어 본문을 따라 의사에게 적절한 자리를 주고 그를 떠나보내지 말라는 권고를 유지했습니다. ‘물리치다’를 ‘떠나보내다’로 고쳐 מוש의 이동·떠남의 의미를 반영했고, 마지막 절을 ‘그도 필요하기 때문입니다’로 고쳐 의사가 필요하다는 뜻을 명확히 했습니다. 그리스어의 창조 언급은 본문에 보태지 않고, 그 위치를 명시한 각주로만 처리했습니다.
