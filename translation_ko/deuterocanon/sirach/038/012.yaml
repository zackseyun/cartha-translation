translation:
  language: ko
  text: 또한 의사에게도 자리를 내어 주십시오[a]. 그를 떠나보내지 마십시오. 그도 필요하기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 “그를 떠나보내지 마십시오” 앞에 “주님께서도 그를 지으셨다”는 구절을 덧붙입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וגם
  english_pob_choice: Also
  chosen_korean: 또한
  alternatives_korean:
  - 그리고 또한
  - 더욱이
  lexicon: HALOT
  rationale: 앞 구절에 덧붙이는 권고의 연결을 간결하게 살리기 위해 ‘또한’을 택했습니다.
- source_word: לרופא
  english_pob_choice: the physician
  chosen_korean: 의사
  alternatives_korean:
  - 의료인
  - 치료사
  - 의원
  lexicon: HALOT
  rationale: 히브리어 רופא는 ‘의사/치유자’를 뜻하며, 지혜문학 문맥에서는 현대 한국어의 ‘의사’가 가장 자연스럽고 의미도 분명합니다.
- source_word: תן מקום
  english_pob_choice: give ... a place
  chosen_korean: 자리를 내어 주십시오
  alternatives_korean:
  - 자리를 주십시오
  - 자리를 마련해 주십시오
  - 받아들이십시오
  lexicon: HALOT
  rationale: 직역의 ‘자리를 주다’보다 한국어 관용에 맞게 ‘자리를 내어 주다’로 옮기되, 환대와 인정의 의미를 유지했습니다.
- source_word: ולא ימוש
  english_pob_choice: do not let him depart / do not dismiss him
  chosen_korean: 그를 물리치지 마십시오
  alternatives_korean:
  - 그가 떠나지 못하게 하십시오
  - 그를 떠나보내지 마십시오
  - 그를 내치지 마십시오
  lexicon: HALOT
  rationale: 히브리어 מוש의 떠남/물러남을 단순한 이동이 아니라 ‘배척하다, 내치다’의 실질적 의미로 자연스럽게 풀어, EN POB의 ‘do not dismiss him’에 맞췄습니다.
- source_word: כי גם בו צורך
  english_pob_choice: for there is need of him as well
  chosen_korean: 그에게도 필요함이 있기 때문입니다
  alternatives_korean:
  - 그도 필요하기 때문입니다
  - 그에게도 쓸모가 있기 때문입니다
  - 그 역시 필요하기 때문입니다
  lexicon: HALOT
  rationale: impersonal한 ‘צורך 있음’을 살려 ‘필요함이 있다’로 표현했고, ‘גם’은 ‘-도’로 반영했습니다.
theological_decisions:
- issue: 그리스어 보조 전승의 추가 문구 처리
  chosen_reading: 본문은 히브리어를 따라 ‘야훼가 그를 지으셨다’는 그리스어 추가를 본문에 넣지 않았고, 대신 주석 처리하지 않았습니다.
  alternative_readings:
  - 그를 물리치지 마십시오. 야훼께서도 그를 지으셨기 때문입니다.
  - 그를 물리치지 마십시오. 주님께서도 그를 지으셨기 때문입니다.
  rationale: 이 절의 히브리어 본문이 온전하므로, 그리스어의 확장 구문은 본문을 대체하지 않고 별도 전승으로만 취급하는 것이 원문 우선 원칙에 부합합니다.
  doctrine_reference: 'PHILOSOPHY.md: 히브리어가 남아 있는 시락서는 히브리어 본문 우선, 그리스어는 보조 증거로 사용'
