    rationale: ‘물리치다’는 적을 격퇴하거나 사람을 배척한다는 뜻이 강합니다. 여기서는 의사가 떠나거나 곁을 떠나는 것을 허용하지 말라는 의미이므로 ‘떠나보내지 마십시오’가 더 정확합니다.
  - severity: medium
    issue: ‘그에게도 필요함이 있기 때문입니다’는 한국어 의미가 모호하고 부정확합니다.
    rationale: 히브리어 כי גם בו צורך는 의사 ‘그도 필요하다’는 뜻입니다. ‘그에게 필요함’은 필요의 주체 또는 소유자를 그로 오해하게 할 수 있습니다.
