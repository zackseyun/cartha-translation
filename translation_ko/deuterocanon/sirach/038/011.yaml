  - 기억 제물
  - 기념물 제사
  lexicon: HALOT
  rationale: אזכרה는 제의적 ‘기념/기억’ 제물 용어로, 한국어에서도 기술어로 남겨 본문의 제의적 특성을 보존했습니다.
- source_word: ודשן ערוך
  english_pob_choice: enrich the arranged offering
  chosen_korean: 마련된 제물을 풍성하게
  alternatives_korean:
  - 마련된 기름진 제물을
  - 준비된 제물을 살찌게
  - 배치된 제물을 풍성하게
  lexicon: HALOT
  rationale: דשן은 ‘풍성하게 하다/살찌게 하다’의 뜻이므로 자연스러운 한국어 동사로 풀었고, ערוך는 ‘마련된/갖추어진’으로 받아 제의적 준비 상태를 살렸습니다.
- source_word: בכנפי הוניך
  english_pob_choice: with the best of your wealth
  chosen_korean: 당신의 재산의 가장 좋은 부분으로
  alternatives_korean:
  - 당신의 재산의 날개로
  - 당신의 재산의 끝부분으로
  - 당신의 소유의 가장 좋은 몫으로
  lexicon: HALOT
  rationale: ‘날개’는 히브리어 관용구에서 경계/끝, 곧 가장 좋은 몫을 가리키므로 직역보다 의미역으로 옮겨 원뜻인 ‘가장 좋은/가장 넉넉한 몫’을 분명히 했습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 평행문의 차이
  chosen_reading: 주본문은 히브리어를 따르고, 그리스어의 다른 끝부분 의미는 본문에 반영하지 않았습니다.
  alternative_readings:
  - 그리스어처럼 ‘향기와 고운 가루의 기념’을 반영하는 읽기
