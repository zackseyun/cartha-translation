base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/038/002.yaml
  text: From God the physician becomes wise[c][b][a], and from the king he receives a gift.
  footnotes:
  - marker: a
    text: 'Greek: ''For healing is from the Most High.'' The Hebrew reads ''from God'' and contains a difficult form where the Greek clearly supports ''healing.'''
    reason: alternative_reading
  - marker: b
    text: The Hebrew line also includes 'physician/doctor' in a difficult construction; the Greek parallel instead gives a smoother sense focused on healing itself.
    reason: textual_variant
  - marker: c
    text: Or 'from the king he receives payment.' The Hebrew wording is idiomatic and difficult, while the Greek reads 'he will receive a gift.'
    reason: lexical_alternative
translation:
  language: ko
  text: 의사는 야훼로부터 지혜를 얻고, 왕으로부터는 선물을 받습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '대안 독법: 일부 전통은 이 구절의 첫 행을 ‘치유는 가장 높으신 분에게서 온다’로 이해합니다. 본문 히브리어는 난해하여, 문맥상 ‘의사는 … 지혜를 얻고’로 옮겼습니다.'
    reason: alternative_reading
  - marker: b
    text: 히브리어의 ‘의사/의술’ 표현은 구문이 난해합니다. 그리스어 병행문은 의미를 더 매끄럽게 ‘치유’ 쪽으로 풀어 주지만, 본문은 의사와 지혜의 연결을 유지합니다.
    reason: textual_variant
  - marker: c
    text: 또는 ‘왕으로부터 보수를 받습니다’로 옮길 수 있습니다. 히브리어의 관용구가 모호하여, 영어 POB도 ‘gift’로 완화해 읽습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מאת אל
  english_pob_choice: from God
  chosen_korean: 야훼로부터
  alternatives_korean:
  - 하나님으로부터
  - 가장 높으신 분으로부터
  lexicon: HALOT
  rationale: 히브리어 본문은 אל(하나님)을 가지므로 기본 본문을 따라 ‘야훼로부터’로 옮겼습니다. 이 절의 지혜의 근원이라는 문맥상, 신성한 출처를 분명히 드러내는 표현이 적절합니다.
- source_word: יחכם רופא
  english_pob_choice: the physician becomes wise
  chosen_korean: 의사는 … 지혜를 얻고
  alternatives_korean:
  - 의사는 지혜로워지고
  - 의사는 지혜롭게 되고
  - 의사는 치유를 받습니다
  lexicon: HALOT
  rationale: 히브리어의 קשה한 구성은 문자적으로 매끄럽지 않지만, 본문이 의사와 지혜의 관계를 말하는 것으로 읽히므로 ‘의사는 … 지혜를 얻고’로 자연스럽게 살렸습니다. 영어 POB의 텍스트 비평 메모는 다른 독법(‘healing’)을 보존하지만, 히브리어 직접독해의 핵심 의미는 지혜로움에 있습니다.
- source_word: ישא משאות
  english_pob_choice: he receives a gift
  chosen_korean: 선물을 받습니다
  alternatives_korean:
  - 보수를 받습니다
  - 사례를 받습니다
  - 짐을 집니다
  lexicon: HALOT
  rationale: 직역하면 ‘짐을 지다/들다’이지만, 문맥상 왕에게서 받는 보상이라는 뜻이 자연스럽고 영어 POB도 ‘gift’로 처리했습니다. 한국어에서는 왕실 보상을 일반 독자에게 분명히 전달하는 ‘선물을 받습니다’가 가장 직접적입니다.
theological_decisions:
- issue: 신적 호칭에서 אל의 표기
  chosen_reading: 주요 본문에는 ‘하나님’ 대신 ‘야훼’를 사용했습니다.
  alternative_readings:
  - 하나님으로부터
  - 가장 높으신 분으로부터
  rationale: 프로젝트 기본값은 אל / YHWH를 야훼로 옮기며, 이 절은 지혜의 근원을 신적으로 제시하는 격언이므로 그 호칭을 분명히 했습니다.
  doctrine_reference: POB glossary default for יהוה / YHWH
