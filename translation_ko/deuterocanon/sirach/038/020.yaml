base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/038/020.yaml
  text: 'Remember his lot, for it is your lot: his yesterday, and your today.'
  footnotes:
  - marker: a
    text: Or 'his decree' / 'his appointed portion.' Hebrew חק commonly means 'statute' or 'decree,' but here likely refers to the fate allotted to every person in death.
    reason: lexical_alternative
  - marker: b
    text: 'The Greek parallel reads differently: ''Do not give your heart over to grief; put it away, remembering the last things.'' This supports the verse''s focus on mortality, though the Hebrew wording here is distinct.'
    reason: alternative_reading
translation:
  language: ko
  text: 그의 몫을 기억하십시오. 그것이 당신의 몫이기 때문입니다. 그에게는 어제였고, 당신에게는 오늘입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 חק은 보통 ‘율례, 법령, 규정’을 뜻하지만, 이 문맥에서는 죽음 앞에서 모든 사람에게 주어진 ‘몫’이나 ‘할당된 운명’의 뜻으로 읽는 것이 자연스럽습니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어 병행본문은 “마음을 슬픔에 내주지 말라. 마지막 일들을 기억하며 그것을 물리쳐라”라고 달리 읽습니다. 이 히브리어 절과는 표현이 다르지만, 죽음의 현실을 되새기게 한다는 점에서는 서로 통합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: זכור
  english_pob_choice: Remember
  chosen_korean: 기억하십시오
  alternatives_korean:
  - 기억하세요
  - 기억하시오
  lexicon: HALOT
  rationale: 히브리어 명령형 זכר의 직접적 촉구를 살리되, 합쇼체에 맞게 자연스럽게 옮겼습니다.
- source_word: חקו
  english_pob_choice: his lot
  chosen_korean: 그의 몫
  alternatives_korean:
  - 그의 법
  - 그의 법도
  - 그의 정해진 몫
  lexicon: HALOT
  rationale: 문맥이 애도와 죽음의 운명을 다루므로, 법적 의미보다 할당된 몫/배분의 뜻이 살아나는 ‘몫’이 원문의 긴장을 가장 잘 보존합니다.
- source_word: כי הוא חקך
  english_pob_choice: for it is your lot
  chosen_korean: 그것이 바로 당신의 몫입니다
  alternatives_korean:
  - 그것이 바로 당신의 법입니다
  - 그것이 바로 당신의 정해진 몫입니다
  lexicon: HALOT
  rationale: 앞절의 ‘몫’을 그대로 이어 공유된 인간의 운명을 분명히 하면서, 문장 압축성을 크게 훼손하지 않도록 했습니다.
- source_word: לו אתמול ולך היום
  english_pob_choice: his yesterday, and your today
  chosen_korean: 그의 어제, 그리고 당신의 오늘입니다
  alternatives_korean:
  - 그에게는 어제였고 당신에게는 오늘입니다
  - 그의 어제, 당신의 오늘
  lexicon: HALOT
  rationale: 히브리어의 대조적·압축적 시구를 살려, 의미를 풀어쓰되 과도한 해설을 덧붙이지 않았습니다.
theological_decisions:
- issue: חק의 의미를 법조문이 아니라 죽음의 몫으로 볼지 여부
  chosen_reading: 죽음 앞에서 모든 사람에게 주어진 공유된 몫/운명
  alternative_readings:
  - 계명
  - 법규
  - 판결
  rationale: 애도와 죽음의 문맥, 그리고 본문의 병렬 구조는 חוק을 법적 규정이 아니라 인간의 필연적 종말로 읽게 합니다.
  doctrine_reference: 번역 철학 §1, §5
- issue: 마지막 절의 압축된 대조를 얼마나 풀어 쓸지
  chosen_reading: 시적 압축을 유지하되 한국어로 이해 가능하게 제시
  alternative_readings:
  - 그는 어제이고 당신은 오늘입니다
  - 그가 어제 죽었고 당신은 오늘 죽습니다
  rationale: 원문은 의도적으로 짧고 단호한 대조를 사용하므로, 의미는 드러내되 해설체로 확장하지 않았습니다.
  doctrine_reference: 번역 철학 §1, §6
