- from: 그의 몫을 기억하십시오. 그것이 바로 당신의 몫입니다. 그의 어제, 그리고 당신의 오늘입니다.[a][b]
  to: 그의 몫을 기억하십시오. 그것이 당신의 몫이기 때문입니다. 그에게는 어제였고, 당신에게는 오늘입니다.[a][b]
  rationale: 수정은 חק의 문맥적 의미를 ‘몫’으로 유지하고, 원문의 인과 접속사 כי를 ‘~이기 때문입니다’로 반영했습니다. 마지막 행은 죽음이라는 공통 운명을 직접 해설하지 않은 채, 원문의 압축된 ‘그에게는 어제, 당신에게는 오늘’ 대조를 자연스러운 합쇼체로 옮겼습니다. 각주 b의 그리스어 인용도 의미를 바꾸지 않고 더 자연스러운 한국어로 다듬었습니다.
