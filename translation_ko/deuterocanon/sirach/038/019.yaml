base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/038/019.yaml
  text: Do not set your heart on him any longer[a]; let his memory go[c][b], and remember the end.
  footnotes:
  - marker: a
    text: Hebrew 'do not place your heart toward him any longer,' an idiom meaning not to remain emotionally fixed on the dead.
    reason: lexical_alternative
  - marker: b
    text: Or 'release his memory' / 'dismiss his remembrance.' The Hebrew verb in this phrase is difficult, and the Greek parallel supports the sense of moving beyond grief.
    reason: alternative_reading
  - marker: c
    text: Or 'remember his end' or 'remember your own end.' The Hebrew simply says 'remember the end,' which may intentionally remain broad.
    reason: alternative_reading
translation:
  language: ko
  text: 더는 그에게 마음을 두지 마십시오[a]. 그의 기억을 놓아주고[b], 끝을 기억하십시오[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구 ‘그에게 마음을 두다’는 죽은 이를 향한 감정적 집착을 계속하지 말라는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 동사는 난해하며, ‘그의 기억을 놓아주다’는 기억에 대한 집착을 풀라는 뜻을 살린 옮김입니다. 그리스어 평행 본문도 애도의 지속을 넘어서는 방향을 뒷받침합니다.
    reason: alternative_reading
  - marker: c
    text: 또는 ‘그의 끝’을 기억하라, 혹은 ‘자신의 끝’을 기억하라로도 옮길 수 있습니다. 히브리어는 단지 ‘끝’을 말해 범위를 넓게 남겨 둡니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אל תשים אליו לב עוד
  english_pob_choice: Do not set your heart on him any longer
  chosen_korean: 더는 그에게 마음을 두지 마십시오
  alternatives_korean:
  - 더는 그를 마음에 두지 마십시오
  - 더는 그에게 마음을 쏟지 마십시오
  - 더는 그에게 마음을 기울이지 마십시오
  lexicon: HALOT
  rationale: 히브리어의 관용구는 죽은 이를 향한 내적 집착과 애도에 머무르지 말라는 뜻이므로, 직역보다 자연스러운 한국어로 ‘마음을 두다’라고 옮겨 심적 집착을 살렸습니다.
- source_word: עוד
  english_pob_choice: any longer
  chosen_korean: 더는
  alternatives_korean:
  - 이제는 더 이상
  - 아직도
  - 계속
  lexicon: HALOT
  rationale: 앞선 애도 상태의 지속을 끊으라는 뉘앙스를 한국어 부사 ‘더는’으로 간결하게 반영했습니다.
- source_word: פרע זכרו
  english_pob_choice: let his memory go
  chosen_korean: 그의 기억을 놓아주고
  alternatives_korean:
  - 그의 기억을 지워 버리고
  - 그의 기억을 떨쳐 버리고
  - 그의 기억을 놓아 버리고
  lexicon: HALOT
  rationale: 동사의 의미가 난해하므로 완전한 망각보다 기억에 대한 집착을 풀어 놓는 뜻을 살려, POB의 ‘release his memory’ 계열을 따라 ‘놓아주다’로 옮겼습니다.
- source_word: וזכור אחרית
  english_pob_choice: and remember the end
  chosen_korean: 끝을 기억하십시오
  alternatives_korean:
  - 마지막을 기억하십시오
  - 결말을 기억하십시오
  - 자신의 끝을 기억하십시오
  lexicon: HALOT
  rationale: אחרית는 최후, 끝, 결과를 넓게 가리키므로 범위를 좁히지 않고 ‘끝’으로 두어 지혜문학의 죽음/종말 사유를 열어 두었습니다.
theological_decisions:
- issue: אחרית의 지시 대상
  chosen_reading: 죽은 이의 끝만이 아니라, 애도하는 사람에게도 열려 있는 일반적 ‘끝’의 기억으로 남겨 둡니다.
  alternative_readings:
  - 그의 끝을 기억하십시오
  - 자신의 끝을 기억하십시오
  rationale: 본문은 지시 대상을 명시하지 않으므로, 죽음과 인간의 유한성이라는 지혜문학적 긴장을 해소하지 않고 보존하는 쪽이 원문에 더 충실합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 3 (preserve theological tension rather than resolve it)
