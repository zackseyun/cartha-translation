base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/038/009.yaml
  text: My son[a], in your sickness do not be negligent; pray to God[b], for he will heal you.
  footnotes:
  - marker: a
    text: 'Greek parallel: ''pray to the Lord.'' The Hebrew witness here reads ''to God.'''
    reason: alternative_reading
  - marker: b
    text: Or 'do not neglect it' / 'do not overlook it'; the Greek parallel supports the sense of not disregarding one's illness.
    reason: lexical_alternative
translation:
  language: ko
  text: 내 아들아, 네가 병들었을 때에는 소홀히 여기지 말고[b], 하나님께[a] 기도하십시오. 그분께서 너를 고쳐 주실 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 병행본문은 ‘주께 기도하라’로 읽습니다. 이 구절의 히브리어 증거는 ‘하나님께’입니다.
    reason: alternative_reading
  - marker: b
    text: 그리스어 병행본문은 ‘소홀히 여기지 말고 / 간과하지 말고’의 뜻을 분명히 지지합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בני
  english_pob_choice: My son
  chosen_korean: 내 아들아
  alternatives_korean:
  - 아들아
  - 내 자녀야
  - 자녀야
  lexicon: HALOT
  rationale: 히브리어 בני는 직역하면 '내 아들'이며, 지혜문학적 권면의 친밀한 호칭을 살리기 위해 '내 아들아'로 옮겼습니다. 그리스어 τέκνον보다 좁지만, 본문의 히브리어 증거를 우선해 성별이 드러나는 호칭을 유지합니다.
- source_word: בחולי
  english_pob_choice: in your sickness
  chosen_korean: 네 병중에
  alternatives_korean:
  - 네 병 가운데
  - 네가 병들었을 때
  - 병들었을 때
  lexicon: HALOT
  rationale: ב + חולי는 상태/시기를 가리키므로 '병중에'가 가장 자연스럽고 원문에 가깝습니다. '네 병중에'는 병의 상황 한가운데 있다는 뜻을 간결하게 전달합니다.
- source_word: על תתעבר
  english_pob_choice: do not be negligent
  chosen_korean: 소홀히 여기지 말고
  alternatives_korean:
  - 무시하지 말고
  - 등한히 여기지 말고
  - 외면하지 말고
  lexicon: HALOT
  rationale: 이 표현은 관용적이며 정확한 뉘앙스가 단일하지 않으므로, 병을 외면하거나 제대로 돌보지 않는다는 뜻을 담아 '소홀히 여기지 말고'로 옮겼습니다. 영어 POB의 'be negligent'와 그리스어 μὴ παράβλεπε의 '간과하다/소홀히 하다'를 함께 반영합니다.
- source_word: התפלל אל אל
  english_pob_choice: pray to God
  chosen_korean: 하나님께 기도하십시오
  alternatives_korean:
  - 하나님께 기도하시오
  - 하나님께 간구하십시오
  - 하나님께 부르짖으십시오
  lexicon: HALOT
  rationale: התפלל은 일반적인 '기도하다'로 충분하며, אל אל은 히브리어 본문상 '하나님께'입니다. 그리스어 병행본문의 '주께'는 주석적 대안으로 남기되, 본문은 히브리어를 따라 '하나님'을 유지했습니다.
- source_word: כי הוא ירפא
  english_pob_choice: for he will heal you
  chosen_korean: 그분이 너를 고쳐 주실 것입니다
  alternatives_korean:
  - 그분이 너를 치료하실 것입니다
  - 그분이 너를 낫게 하실 것입니다
  - 그가 너를 고치실 것입니다
  lexicon: HALOT
  rationale: ירפא는 '치유하다/고치다'를 뜻하므로 한국어에서 자연스럽고 구체적인 '고쳐 주시다'를 선택했습니다. '너를'을 넣어 그리스어의 σε와 병행하며, 허용되는 자연스러운 보완으로 보존했습니다.
theological_decisions:
- issue: '기도의 대상: 히브리어 ''하나님''과 그리스어 ''주''의 차이'
  chosen_reading: 본문은 '하나님'으로 두고, 그리스어 병행본문의 '주'는 주석으로만 처리합니다.
  alternative_readings:
  - 주님께
  - 주께
  rationale: 히브리어 사본이 כאן(אל)에서 분명히 '하나님'을 읽으므로 본문은 이를 따르는 것이 원문 우선 원칙에 맞습니다. 그리스어 Κυρίῳ는 의미 있는 병행 차이이지만, 이 구절의 본문 용례를 뒤집을 만큼 강하지 않아 본문 외 주석으로 남깁니다.
  doctrine_reference: Translation philosophy §1; source primacy in Hebrew-Greek divergence
