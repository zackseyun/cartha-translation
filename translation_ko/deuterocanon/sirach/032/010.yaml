translation:
  language: ko
  text: 우박보다 먼저 번개가 번쩍이고, 수치보다 먼저 호의가 나타납니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘은혜’. 히브리어 חֵן은 문맥에 따라 호의, 은혜, 호감을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어 병행본문은 이 절을 상당히 다르게 전합니다. “선한 눈으로 주님을 영화롭게 하고, 네 손의 첫 열매를 적게 하지 마십시오.” 본문은 현존하는 히브리어 증언을 따릅니다.
    reason: alternative_reading
