base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/032/020.yaml
  text: Do not walk on a path full of obstacles[b][a], and do not stumble over the same hazard twice.
  footnotes:
  - marker: a
    text: Hebrew 'a path of מוקשות.' The term may suggest snares, traps, or stumbling obstacles; the translation 'full of obstacles' follows the verse's parallel emphasis on stumbling.
    reason: lexical_alternative
  - marker: b
    text: The Greek parallel in Swete differs substantially here ('He who serves with favor will be accepted, and his petition will reach to the clouds'), indicating a major divergence in the textual tradition. The main text follows the extant Hebrew witness, which is the primary source where preserved for Sirach.
    reason: textual_variant
translation:
  language: ko
  text: 장애물이 가득한 길을 걷지 마십시오.[a][b] 같은 장애물에 두 번 걸려 넘어지지 마십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘장애물이 있는 길’(דרך מוקשות)은 직역하면 ‘덫들/올무들의 길’ 또는 ‘걸려 넘어지게 하는 것들의 길’에 가까울 수 있습니다. 여기서는 다음 절의 ‘걸려 넘어지다’와의 병행을 살려 ‘장애물이 가득한 길’로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 스웨테의 그리스어 본문은 이 구절에서 크게 다릅니다. 그 본문은 ‘호의로 섬기는 이는 받아들여지고, 그의 간구는 구름에 닿을 것이다’라는 뜻입니다. 이 본문은 현존 히브리어 전승을 따르며, 히브리어가 보존된 시락에서는 이를 우선합니다.
    reason: textual_variant
lexical_decisions:
- source_word: בדרך
  english_pob_choice: on a path
  chosen_korean: 길로
  alternatives_korean:
  - 길에서
  - 길 위로
  - 행로로
  lexicon: HALOT
  rationale: דרך는 문자 그대로 ‘길, 도로, 행로’를 뜻하므로, 권면의 문맥에서는 자연스러운 현대어 ‘길로’가 이미지와 비유적 행로를 함께 살립니다.
- source_word: מוקשות
  english_pob_choice: full of obstacles
  chosen_korean: 장애물이 가득한
  alternatives_korean:
  - 덫이 가득한
  - 올무가 가득한
  - 걸림돌이 많은
  lexicon: HALOT
  rationale: מוקשות는 사람을 걸려 넘어지게 하는 것들을 가리키므로, 뒤의 ‘넘어지다’와 평행을 이루도록 ‘장애물이 가득한’으로 옮겼습니다.
- source_word: תתקל
  english_pob_choice: stumble
  chosen_korean: 넘어지지 마십시오
  alternatives_korean:
  - 걸려 넘어지지 마십시오
  - 비틀거리지 마십시오
  - 실족하지 마십시오
  lexicon: HALOT
  rationale: 히트파엘 형태의 תקל은 ‘걸려 넘어지다’는 뜻이므로, 현대 한국어에서 바로 이해되는 ‘넘어지다’를 쓰되 앞절의 ‘장애물’과 연결되도록 했습니다.
- source_word: בנגף
  english_pob_choice: over the same hazard
  chosen_korean: 같은 걸림에
  alternatives_korean:
  - 같은 해악에
  - 같은 장애에
  - 같은 충격에
  lexicon: HALOT
  rationale: נגף는 ‘넘어지게 하는 것, 걸림, 타격’의 폭넓은 뜻을 가지며, 여기서는 반복되는 실패의 대상이므로 ‘걸림’으로 압축해 표현했습니다.
theological_decisions:
- issue: 반복 금지의 강조
  chosen_reading: 같은 걸림에 두 번 넘어지지 마십시오
  alternative_readings:
  - 같은 장애에 두 번 걸려 넘어지지 마십시오
  - 같은 실수로 두 번 넘어지지 마십시오
  rationale: 히브리어의 פעמים는 단순히 ‘두 번’을 뜻하므로, 도덕적 일반화인 ‘실수’보다 원문이 말하는 반복적 넘어짐을 직접 살리는 표현을 택했습니다.
  doctrine_reference: 지혜문학의 권면과 경계의 반복 강조
