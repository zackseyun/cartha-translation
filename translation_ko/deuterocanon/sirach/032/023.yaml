  text: In all your deeds guard yourself[b][a], for the one who does this keeps the commandment.
  footnotes:
  - marker: a
    text: Or 'guard your soul' or 'guard your life'; Hebrew nephesh can mean 'self,' 'soul,' or 'life.'
    reason: lexical_alternative
  - marker: b
    text: Or 'whoever does this keeps a commandment.' The singular 'commandment' may be understood generically.
    reason: lexical_alternative
translation:
  language: ko
  text: 네 모든 행위에서 너 자신을 지키십시오[a]. 이는 이 일을 하는 사람이 계명을 지키기 때문입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘네 영혼을 지키십시오’, ‘네 생명을 지키십시오’. 히브리어 nephesh는 ‘자기 자신’, ‘영혼’, ‘생명’을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘이 일을 하는 사람은 계명을 지킵니다’. 히브리어 단수 ‘계명’은 일반적으로 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בכל מעשיך
  english_pob_choice: In all your deeds
  chosen_korean: 네 모든 행위에서
  alternatives_korean:
  - 네 모든 일에서
  - 네 모든 행동에서
  lexicon: HALOT
  rationale: בכל은 포괄적 범위를 나타내므로 ‘모든’으로 살리고, מעשיך는 구체적 행위·생활 전반을 가리켜 ‘행위’가 가장 자연스럽고 문맥에도 맞습니다.
- source_word: שמור
  english_pob_choice: guard
  chosen_korean: 지키십시오
  alternatives_korean:
  - 경계하십시오
  - 보호하십시오
  - 살피십시오
  lexicon: HALOT
  rationale: שמר는 ‘지키다/보호하다/주의 깊게 살피다’의 뜻이지만, 여기서는 자기 점검의 권면이므로 한국어로는 간결한 명령형 ‘지키십시오’가 가장 잘 대응합니다.
- source_word: נפשך
  english_pob_choice: yourself
  chosen_korean: 너 자신
  alternatives_korean:
  - 네 영혼
  - 네 생명
  lexicon: HALOT
  rationale: נפש는 ‘영혼’만이 아니라 ‘자기 자신/생명’의 뜻도 있으므로, 이 지혜문맥에서는 이분법적 뉘앙스를 피하는 ‘너 자신’이 소스의 실제 권면을 더 정확히 전달합니다.
- source_word: שומר מצוה
  english_pob_choice: keeps the commandment
  chosen_korean: 계명을 지키기 때문입니다
  alternatives_korean:
  - 계명을 지키는 사람이기 때문입니다
  - 한 계명을 지키기 때문입니다
  lexicon: HALOT
  rationale: 히브리어는 단수 ‘계명’이지만 일반적·총괄적 의미일 수 있으므로, 한국어도 관용적으로 ‘계명’을 유지하되 원인절로 풀어 주어 앞 명령의 근거를 자연스럽게 드러냅니다.
theological_decisions:
- issue: נפש의 의미 범위
  chosen_reading: ‘너 자신’으로 번역하여 전인적 자기 경계를 권면하는 뜻을 살립니다.
  alternative_readings:
  - 네 영혼
  - 네 생명
  rationale: 지혜문학의 נפש는 형이상학적 ‘영혼’보다 인격 전체나 삶을 가리키는 경우가 많으므로, 본문이 요구하는 실제적 자기 관리의 의미를 보존하는 쪽이 더 적절합니다.
  doctrine_reference: Translation philosophy §1, §6
- issue: 단수 ‘계명’의 일반적 의미
  chosen_reading: ‘계명’을 단수로 유지해 일반적 순종 원리를 나타내게 합니다.
  alternative_readings:
  - 한 계명
  - 계명들
  rationale: 히브리어 단수는 특정 하나만이 아니라 규범 전체를 대표할 수 있으므로, 개별 조항으로 좁히지 않고 총괄적 의미를 살리는 것이 문맥에 합당합니다.
  doctrine_reference: Translation philosophy §2
