  rationale: 제공된 그리스어는 같은 절의 시적 평행이 아니라 다른 전승/번호에 속한 문구로 보이므로, 살아 있는 히브리어를 본문으로 삼는 POB 원칙을 따르면서 차이는 투명하게 남겼습니다.
