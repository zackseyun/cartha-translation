base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/032/006.yaml
  text: Like settings of gold and a seal of beryl[b][a], so is the sound of a psalm with the sweetness of new wine.
  footnotes:
  - marker: a
    text: The Greek parallel supplied for this verse reads, 'Do not appear before the Lord empty,' reflecting a different verse tradition or numbering. The main translation follows the extant Hebrew witness.
    reason: textual_variant
  - marker: b
    text: Or 'a signet of emerald.' The identification of ברקת is uncertain; 'beryl' is a common scholarly choice.
    reason: lexical_alternative
translation:
  language: ko
  text: 순금 장식과 베릴의 인장[b]처럼, 새 포도주의 달콤함과 함께하는 노래 소리도 그러합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 제공된 그리스어 평행문은 “주님 앞에 빈손으로 보이지 말라”로, 현존 히브리어 시구와 다른 전승 또는 절 번호를 반영합니다. 본문은 남아 있는 히브리어를 따랐습니다.
    reason: textual_variant
  - marker: b
    text: 히브리어 ברקת이 가리키는 보석은 확실하지 않습니다. 여기서는 ‘베릴’로 옮겼으며, ‘에메랄드’로 이해하기도 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מלואות פז
  english_pob_choice: settings of gold
  chosen_korean: 금 세공의 받침
  alternatives_korean:
  - 금 장식의 세팅
  - 순금의 받침
  - 금으로 된 받침
  lexicon: HALOT
  rationale: מלואות는 장식품을 받쳐 주거나 채워 넣는 받침·세공의 뜻으로 이해하는 것이 자연스럽고, פז는 순금/정금이므로 ‘금 세공의 받침’으로 보석 이미지의 화려함을 살렸습니다.
- source_word: חותם ברקת
  english_pob_choice: a seal of beryl
  chosen_korean: 벽옥의 인장
  alternatives_korean:
  - 베릴의 인장
  - 에메랄드의 인장
  - 인장 반지
  lexicon: HALOT
  rationale: חותם은 인장/도장이고, ברקת은 보석 명칭이 불확실하므로 전통적 학술 번역인 벽옥을 택해 지나친 특정화를 피했습니다.
- source_word: קול מזמור
  english_pob_choice: the sound of a psalm
  chosen_korean: 시편의 소리
  alternatives_korean:
  - 노래의 소리
  - 찬송의 소리
  - 시가의 소리
  lexicon: HALOT
  rationale: קול은 소리이고 מזמור은 시편·찬가를 가리키므로, 예배적 운율을 살리면서도 직역을 과도하게 어색하게 만들지 않는 ‘시편의 소리’를 선택했습니다.
- source_word: על נועם תירוש
  english_pob_choice: with the sweetness of new wine
  chosen_korean: 새 포도주의 달콤함
  alternatives_korean:
  - 새 포도주의 기쁨
  - 향긋한 새 포도주의 달콤함
  - 새 포도주의 부드러움
  lexicon: HALOT
  rationale: נועם은 달콤함·유쾌함·좋음의 범위를 가지며 תירוש는 새 포도주이므로, 비교구문을 한국어로 매끄럽게 옮기기 위해 ‘새 포도주의 달콤함’으로 압축했습니다.
