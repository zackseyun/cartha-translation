  - 노래를 방해하지 마십시오
  - 노래를 멈추게 하지 마십시오
  lexicon: HALOT
  rationale: מנע는 '막다, 저지하다, 방해하다'의 의미이므로 한국어에서 가장 직접적인 동사 '막다'를 사용했습니다. '노래'는 집합적 의미를 살려 단수형으로 유지했습니다.
