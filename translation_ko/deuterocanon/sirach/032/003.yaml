  - 그리고 신중한 이해로
  - 그러나 절제하며 분별 있게
  lexicon: HALOT
  rationale: 압축된 히브리어의 의미를 살려, 'שכל'의 분별/이해를 드러내고 동사적 뉘앙스는 '가지고'로 풀어 자연스러운 한국어로 옮겼습니다. 영어 POB의 'but'에 해당하는 대조도 '그러나'로 반영했습니다.
- source_word: ואל תמנע שיר
  english_pob_choice: and do not hinder song
  chosen_korean: 노래를 막지 마십시오
  alternatives_korean:
