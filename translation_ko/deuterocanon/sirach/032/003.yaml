translation:
  language: ko
  text: 말씀하십시오, 어르신이여. 그것은 당신에게 합당합니다. 그리고 분별을 감추고[a], 노래를 막지 마십시오.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 והצנע שכל은 압축된 표현입니다. 직역하면 ‘분별을 감추고’이며, ‘분별을 드러낼 때 절제하고’, ‘지혜에 있어 겸손하게 처신하고’로도 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 이 절의 그리스어 병행본은 상당히 다르게 전하며, ‘고운 밀가루를 바치는 이가 은혜를 갚는다’라고 읽습니다. 이는 이 구절에 서로 다른 본문 전승이 있음을 보여 줍니다.
    reason: textual_variant
