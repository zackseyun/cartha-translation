  text: Speak[a], elder, for it is fitting for you; but with sound understanding[b], and do not hinder song.
  footnotes:
  - marker: a
    text: Hebrew והצנא שכל is somewhat compressed and may also be understood as 'and be restrained/modest in understanding' or 'and show prudent reserve.'
