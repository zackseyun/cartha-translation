translation:
  language: ko
  text: 말하시오, 장로여, 그것이 당신에게 합당합니다. 그러나 분별 있는 이해를 가지고, 노래를 막지 마십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 והצנא שכל은 압축된 표현으로, ‘분별을 가지고’ 혹은 ‘신중한 절제를 보이며’로도 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 이 절의 그리스어 병행본은 상당히 다르게 전하며, ‘고운 밀가루를 바치는 이가 은혜를 갚는다’라고 읽습니다.
    reason: textual_variant
lexical_decisions:
- source_word: מלל
  english_pob_choice: Speak
  chosen_korean: 말하시오
  alternatives_korean:
  - 말하십시오
  - 말하세요
  - 이야기하시오
  lexicon: HALOT
  rationale: 명령형 뉘앙스를 살리면서도 합쇼체로 옮겼습니다. '말하다'는 본문의 직접적인 발화 행위를 가장 자연스럽게 드러냅니다.
- source_word: שב
  english_pob_choice: elder
  chosen_korean: 장로여
  alternatives_korean:
  - 늙은이여
  - 어르신이여
  - 연장자여
  lexicon: HALOT
  rationale: 여기서는 단순한 생물학적 노년보다 존중받는 연장자를 가리키므로, 경구적 호칭인 '장로'를 택했습니다. 호격 어미 '-여'로 직접 호명을 반영했습니다.
- source_word: והצנא שכל
  english_pob_choice: but with sound understanding
  chosen_korean: 그러나 분별 있는 이해를 가지고
  alternatives_korean:
  - 그리고 절제된 분별로
  - 그리고 신중한 이해로
  - 그러나 절제하며 분별 있게
  lexicon: HALOT
  rationale: 압축된 히브리어의 의미를 살려, 'שכל'의 분별/이해를 드러내고 동사적 뉘앙스는 '가지고'로 풀어 자연스러운 한국어로 옮겼습니다. 영어 POB의 'but'에 해당하는 대조도 '그러나'로 반영했습니다.
- source_word: ואל תמנע שיר
  english_pob_choice: and do not hinder song
  chosen_korean: 노래를 막지 마십시오
  alternatives_korean:
  - 노래를 금하지 마십시오
  - 노래를 방해하지 마십시오
  - 노래를 멈추게 하지 마십시오
  lexicon: HALOT
  rationale: מנע는 '막다, 저지하다, 방해하다'의 의미이므로 한국어에서 가장 직접적인 동사 '막다'를 사용했습니다. '노래'는 집합적 의미를 살려 단수형으로 유지했습니다.
theological_decisions:
