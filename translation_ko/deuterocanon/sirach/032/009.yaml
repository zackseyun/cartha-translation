theological_decisions:
- issue: 히브리어 본문과 그리스어 병행문의 차이
  chosen_reading: 본문은 현존 히브리어 격언을 따르고, 그리스어 전승의 다른 문장은 본문이 아니라 주석으로만 처리합니다.
  alternative_readings:
  - 그리스어 전승을 따라 ‘의인의 제사는 받아들여지고, 그 기념은 잊히지 않습니다’로 번역
  rationale: 시라흐에서는 히브리어가 보존된 곳에서 이를 우선하는 원칙을 따릅니다. 여기의 그리스어 병행문은 히브리어와 내용이 전혀 달라 다른 전승 또는 절 배치를 반영하므로, 본문에 섞지 않고 분리하는 것이 가장 투명합니다.
  doctrine_reference: 'PHILOSOPHY.md: 시라흐는 히브리어 보존 본문 우선, 그리스어는 실제 입력이지만 본문 일치 여부를 분리하여 처리'
