  text: Before hail, lightning flashes forth; and before a modest man, favor goes before him.
  footnotes:
  - marker: a
    text: The Greek witness supplied here reads instead, 'The sacrifice of a righteous man is acceptable, and its memorial will not be forgotten,' reflecting a different textual tradition or verse alignment than the extant Hebrew.
    reason: textual_variant
  - marker: b
    text: Or 'the humble' / 'the lowly' for 'a modest man.' The Hebrew term can denote one who is humble or brought low.
    reason: lexical_alternative
translation:
  language: ko
  text: 우박 앞에는 번개가 번쩍이고, 겸손한 사람 앞에는 은총이 앞서 갑니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 증거는 ‘의인의 제사는 받아들여지고, 그 기념은 잊히지 않는다’로 읽으며, 이는 현존 히브리어와 다른 전승입니다.
    reason: textual_variant
  - marker: b
    text: 히브리어 דַכָּא에는 ‘겸손한’ 외에도 ‘낮아진/부서진’의 뜻이 있습니다.
    reason: lexical_alternative
