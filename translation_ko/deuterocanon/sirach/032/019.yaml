base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/032/019.yaml
  text: Do nothing without counsel[a], and after your deeds[b], do not be regretful.
  footnotes:
  - marker: a
    text: Or, more literally, 'do not be vexed/angry.' The Hebrew can denote becoming upset after one's action; the main text renders the likely sense in this wisdom context as regret or self-reproach.
    reason: lexical_alternative
  - marker: b
    text: The Greek parallel supplied here does not align with the Hebrew wording of this verse, so the translation follows the extant Hebrew witness as the primary source.
    reason: textual_variant
translation:
  language: ko
  text: 충고 없이 아무것도 하지 말고, 네 행위들 뒤에는 후회하지 마십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사 קצף 계열은 ‘성내다, 격분하다, 상하다’의 뜻도 가질 수 있습니다. 이 문맥에서는 사후의 번민이나 자책을 가리키는 것으로 이해해 ‘후회하다’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בלא עצה
  english_pob_choice: without counsel
  chosen_korean: 충고 없이
  alternatives_korean:
  - 조언 없이
  - 상의 없이
  - 숙고 없이
  lexicon: HALOT
  rationale: 지혜문학의 권면으로서 עצה는 단순한 정보보다 판단을 돕는 충고·조언의 뜻을 가지므로, 간결하게 ‘충고 없이’로 옮겼습니다.
- source_word: אל תפעל דבר
  english_pob_choice: do nothing
  chosen_korean: 아무것도 하지 말고
  alternatives_korean:
  - 행하지 말고
  - 아무 일도 하지 말고
  - 무엇도 하지 말고
  lexicon: HALOT
  rationale: 부정 명령과 דבר의 포괄성을 살려, 특정 행위만이 아니라 어떤 일도 착수하지 말라는 뜻을 자연스럽게 표현했습니다.
- source_word: ואחר מעשיך
  english_pob_choice: after your deeds
  chosen_korean: 네 행위들 뒤에는
  alternatives_korean:
  - 네 행위들 뒤에
  - 네 행한 일 뒤에는
  - 네 행동 뒤에는
  lexicon: HALOT
  rationale: 복수형 מעשיך를 반영해 ‘네 행위들’로 옮기고, 시간적 선후를 살리기 위해 ‘뒤에는’으로 처리했습니다.
- source_word: אל תתקצף
  english_pob_choice: do not be regretful
  chosen_korean: 후회하지 마십시오
  alternatives_korean:
  - 마음 상해하지 마십시오
  - 성내지 마십시오
  - 노하지 마십시오
  lexicon: HALOT
  rationale: קצף 계열은 ‘성내다/화를 내다’도 가능하지만, 앞선 ‘충고 없이’라는 지혜적 맥락에서는 사후의 번민·자책까지 포함하는 ‘후회하다’가 문맥상 가장 자연스럽습니다.
theological_decisions:
- issue: 경구체 명령의 어조
  chosen_reading: 합쇼체의 일반 권면으로 번역하되, 직접 경고의 힘을 유지했습니다.
  alternative_readings:
  - 더 단정한 금지문으로 옮김
  - 완곡한 권고문으로 옮김
  rationale: 본문은 지혜서의 교훈적 금언이므로, 한국어에서도 권위적이되 과도하게 경직되지 않은 합쇼체가 적절합니다.
  doctrine_reference: 지혜문학의 교훈적 장르
