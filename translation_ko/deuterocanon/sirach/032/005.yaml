base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/032/005.yaml
  text: Like a gold ornament set with onyx and sapphire[c][b][a], so are beautiful words at a banquet of wine.
  footnotes:
  - marker: a
    text: The Hebrew gemstone term rendered 'onyx' is uncertain; other identifications have been proposed.
    reason: lexical_alternative
  - marker: b
    text: The stone called 'sapphire' in ancient texts may not match the modern gemstone exactly; some identify it with lapis lazuli.
    reason: lexical_alternative
  - marker: c
    text: The supplied Greek parallel source for this verse does not match the Hebrew wording here and appears to reflect a different textual alignment.
    reason: textual_variant
translation:
  language: ko
  text: 오닉스[a]와 사파이어[b]가 박힌 금 장식처럼, 술잔치에서 아름다운 말도 그러합니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 보석명 ‘נפך’의 정확한 현대 보석 대응은 확정되지 않았습니다. 오닉스 외에 다른 보석으로 보는 견해도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘ספיר’은 고대 용례에서 오늘날의 사파이어와 정확히 일치하지 않을 수 있으며, 라피스라줄리로 보는 견해도 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 이 절의 히브리어 본문은 술잔치에서의 아름다운 말을 금 장식에 비유합니다. 제공된 그리스어 병행문은 이 히브리어 본문과 일치하지 않으며, 다른 본문 전승 또는 절 배열을 반영하는 것으로 보입니다.
    reason: textual_variant
lexical_decisions:
- source_word: כרביד
  english_pob_choice: Like a gold ornament
  chosen_korean: 금빛 장식에
  alternatives_korean:
  - 금목걸이처럼
  - 금 사슬처럼
  - 금 장식처럼
  lexicon: HALOT
  rationale: רביד는 목에 걸거나 두르는 장식물을 가리키므로, 형태를 지나치게 특정하지 않는 ‘장식’으로 옮기되 simile의 כ는 문맥상 ‘-처럼’의 의미로 처리했습니다.
- source_word: נפך
  english_pob_choice: onyx
  chosen_korean: 홍옥
  alternatives_korean:
  - 오닉스
  - 흑옥
  - 가넷
  lexicon: HALOT
  rationale: 이 보석명은 현대 광물학적 대응이 불확실하므로, 전통적 번역어를 그대로 고정하기보다 보석성 이미지를 살리는 번역을 택했습니다. 다만 본문에는 과도한 주석화를 피했습니다.
- source_word: ספיר
  english_pob_choice: sapphire
  chosen_korean: 청옥
  alternatives_korean:
  - 사파이어
  - 라피스라줄리
  lexicon: HALOT
  rationale: ספיר는 고대에는 오늘날의 사파이어와 정확히 같지 않을 수 있어, 한국어에서도 현대 보석명보다 포괄적인 ‘청옥’으로 옮겨 고대적 색감과 장식 이미지를 살렸습니다.
- source_word: דברים יפים
  english_pob_choice: beautiful words
  chosen_korean: 아름다운 말
  alternatives_korean:
  - 아름다운 말씀
  - 좋은 말
  - 아름다운 언어
  lexicon: HALOT
  rationale: יעֻים/יפים의 핵심은 말의 미적·수사적 매력입니다. 한국어에서는 단순한 ‘말’이 가장 자연스럽고, 비유의 대응관계도 분명하게 드러납니다.
theological_decisions:
- issue: 본문 심상과 비교구문의 보존
  chosen_reading: ‘금빛 장식에 …을 박은 것 같으니’로 보석 장식의 시각적 유사성을 살리고, 뒤 문장도 같은 비유 구조로 대응시켰습니다.
  alternative_readings:
  - ‘금목걸이처럼 …’로 형태를 더 구체화하는 읽기
  - ‘아름다운 말은 술잔치에 어울립니다’처럼 의미를 완화하는 읽기
  rationale: 히브리어는 지혜문학 특유의 감각적 비교를 통해 말의 아름다움을 강조하므로, 해석적 평어보다 물질적 이미지가 살아 있는 비유를 유지하는 것이 본문의 의도를 더 잘 전달합니다.
  doctrine_reference: Sirach 32:5의 지혜문학적 수사 이해
