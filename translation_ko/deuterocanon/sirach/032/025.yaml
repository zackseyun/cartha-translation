  rationale: ἐν의 도구적/수단적 뉘앙스를 한국어 조사 ‘-로’로 자연스럽게 나타냈고, ἐλέος는 문맥상 ‘자비’가 가장 직결되는 표현입니다.
theological_decisions:
- issue: κρίνῃ τὴν κρίσιν의 반복적 표현을 어떻게 처리할지
  chosen_reading: ‘판결을 내리시고’로 의미를 풀어, 판단/판결 행위가 백성을 위한 것임을 드러냈습니다.
  alternative_readings:
  - ‘그 백성의 사건을 판단하시고’
  - ‘그 백성을 위해 정의를 집행하시고’
  rationale: 헬라어의 형식적 반복은 관용적으로 ‘판결하다/심판하다’는 의미를 가질 수 있으므로, 한국어에서는 의미를 과도하게 특정하지 않되 독자가 이해할 수 있게 정리했습니다.
  doctrine_reference: Sirach 32:25 문맥의 재판/구원 어휘
