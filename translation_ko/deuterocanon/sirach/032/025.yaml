translation:
  language: ko
  text: 그분께서 자기 백성의 판결을 내리시고 자기 자비로 그들을 기쁘게 하실 때까지입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘자기 백성의 사건을 결정하실 때까지’ 혹은 ‘자기 백성을 위해 정의를 집행하실 때까지’로 옮길 수 있습니다. 그리스어 표현은 형식상 반복적이며, 판결을 가리키는 관용구일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕως
  english_pob_choice: until
  chosen_korean: ~할 때까지
  alternatives_korean:
  - ~까지
  - ~할 동안
  lexicon: LSJ
  rationale: 문장의 종결점을 나타내는 시간 표현이므로 한국어에서도 가장 자연스러운 종속절 종결 방식으로 옮겼습니다.
- source_word: κρίνῃ τὴν κρίσιν
  english_pob_choice: he judges the case / he judges the judgment
  chosen_korean: 판결을 내리시고
  alternatives_korean:
  - 판결하실 때까지
  - 사건을 심판하시고
  - 재판을 하시고
  lexicon: LSJ
  rationale: 헬라어의 반복적이고 관용적인 표현을 한국어로는 어색한 직역보다 ‘판결을 내리다’로 옮겨, 심판 행위의 결과를 분명하게 드러냈습니다.
- source_word: τοῦ λαοῦ αὐτοῦ
  english_pob_choice: of his people
  chosen_korean: 자기 백성의
  alternatives_korean:
  - 그의 백성의
  - 자기 ժողովրդի의
  lexicon: LSJ
  rationale: 소유 관계를 자연스럽게 살리면서, ‘αὐτοῦ’의 관계를 한국어 재귀적 표현인 ‘자기’로 반영했습니다.
- source_word: ἐν τῷ ἐλέει αὐτοῦ
  english_pob_choice: with his mercy
  chosen_korean: 자기 자비로
  alternatives_korean:
  - 자기 자비와 함께
  - 자기 자비 안에서
  - 그의 긍휼로
  lexicon: LSJ
  rationale: ἐν의 도구적/수단적 뉘앙스를 한국어 조사 ‘-로’로 자연스럽게 나타냈고, ἐλέος는 문맥상 ‘자비’가 가장 직결되는 표현입니다.
theological_decisions:
- issue: κρίνῃ τὴν κρίσιν의 반복적 표현을 어떻게 처리할지
  chosen_reading: ‘판결을 내리시고’로 의미를 풀어, 판단/판결 행위가 백성을 위한 것임을 드러냈습니다.
  alternative_readings:
  - ‘그 백성의 사건을 판단하시고’
  - ‘그 백성을 위해 정의를 집행하시고’
  rationale: 헬라어의 형식적 반복은 관용적으로 ‘판결하다/심판하다’는 의미를 가질 수 있으므로, 한국어에서는 의미를 과도하게 특정하지 않되 독자가 이해할 수 있게 정리했습니다.
  doctrine_reference: Sirach 32:25 문맥의 재판/구원 어휘
