translation:
  language: ko
  text: 말하라, 젊은이여, 말할 필요가 있다면 절제하여, 물으면 두세 번만 하십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 בחזק은 이 구절에서 뜻이 분명하지 않으며, 문맥상 ‘절제하여’로 옮겼습니다.
    reason: textual_variant
  - marker: b
    text: 문자적으로는 ‘두세 번’이며, 말의 빈도를 제한하는 관용적 표현으로 이해할 수 있습니다.
    reason: lexical_alternative
