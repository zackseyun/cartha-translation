base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/032/008.yaml
  text: Speak briefly[a], though you know much, and be like one who knows and keeps silent.
  footnotes:
  - marker: a
    text: 'Hebrew text is somewhat compressed and may be elliptical: literally, something like ''Speak little—much; and be like one knowing and keeping silent together.'' The translation brings out the likely sense of restrained speech. The Greek parallel for this verse in Swete does not correspond to this Hebrew line, so the Hebrew is followed as the primary witness here.'
    reason: textual_variant
translation:
  language: ko
  text: 많이 알더라도 말을 짧게 하고, 아는 사람처럼 보이되 침묵을 지키십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 매우 압축되어 있어, 문자적으로는 '말을 조금—많이; 그리고 아는 자와 침묵하는 자와 함께'에 가깝게 읽힐 수 있습니다. 이 번역은 그 뜻을 풀어 '많이 알더라도 말을 짧게 하고'로 옮겼습니다. 이 구절에 대한 스웨테 헬라어 평행본문은 이 히브리어 행과 일치하지 않으므로, 여기서는 히브리어를 मुख्य 본문 증거로 따랐습니다.
    reason: textual_variant
lexical_decisions:
- source_word: כל לאמר ומעט הרבה
  english_pob_choice: Speak briefly, though you know much
  chosen_korean: 많이 알더라도 말을 짧게 하고
  alternatives_korean:
  - 짧게 말하십시오
  - 말을 적게 하십시오
  - 몇 마디만 하십시오
  lexicon: HALOT
  rationale: 히브리어는 압축된 속담형 표현이므로, '많이'와 '짧게'의 대조를 살려 지식의 많음에도 말을 절제하라는 뜻으로 옮겼습니다.
- source_word: ודמה
  english_pob_choice: and be like
  chosen_korean: 아는 사람처럼 보이되
  alternatives_korean:
  - 그리고 닮으십시오
  - 그리고 ~와 같이 되십시오
  - 그리고 ~처럼 되십시오
  lexicon: HALOT
  rationale: דמה는 '닮다/같다'의 뜻이므로, 한국어에서는 자연스럽게 '처럼' 구조로 옮겼습니다.
- source_word: ליודע ומחריש יחדו
  english_pob_choice: one who knows and keeps silent
  chosen_korean: 아는 사람처럼 보이되 침묵을 지키십시오
  alternatives_korean:
  - 아는 자이면서 침묵하는 사람처럼
  - 아면서도 잠잠한 사람처럼
  - 알면서도 조용한 사람처럼
  lexicon: HALOT
  rationale: יודע와 מחריש의 병행을 살리되, '함께/동시에'의 יחדו는 한국어에서 자연스러운 행위의 결합으로 처리해 '알면서도 침묵하는' 의미를 드러냈습니다.
theological_decisions:
- issue: 본문의 압축성과 생략된 연결 관계
  chosen_reading: 히브리어의 생략된 뉘앙스를 과도하게 풀지 않고, 지혜문학의 절제된 언어로 읽히게 했습니다.
  alternative_readings:
  - 말을 짧게 하되 많이 아는 사람처럼 하십시오
  - 많이 알더라도 조용히 있는 사람처럼 되십시오
  rationale: 이 구절은 문법적으로 압축되어 있어 직역만으로는 어색할 수 있으나, 지혜문학의 교훈적 의도를 보존하는 범위에서만 완만하게 풀었습니다.
  doctrine_reference: 지혜문학의 절제된 권면
- issue: 구두 수사와 침묵의 윤리
  chosen_reading: '''침묵을 지키십시오''로 마무리해, 아는 자의 신중함과 말의 절제를 함께 강조했습니다.'
  alternative_readings:
  - 침묵하십시오
  - 잠잠하십시오
  - 입을 다무십시오
  rationale: מחריש는 단순 무발화가 아니라 의도적인 침묵의 유지이므로, 한국어에서는 윤리적·행동적 지속성을 가진 표현을 택했습니다.
  doctrine_reference: 잠언적 지혜의 언어 윤리
