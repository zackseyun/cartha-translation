base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/032/022.yaml
  text: Do not trust in the way of the wicked[a], and be careful in your paths. In all your ways guard yourself, for everyone who does these things keeps the commandment.
  footnotes:
  - marker: a
    text: 'The Hebrew witness for this verse in Kahana includes before the verse number: ''Do not trust in the way of the wicked, and in your paths be careful.'' Because this clause stands before the verse marker and does not match the Greek parallel for Sirach 32:22, it is likely adjacent material rather than part of this verse.'
