translation:
  language: ko
  text: 악인의 길을 신뢰하지 마십시오. 그리고 당신의 길들에서 조심하십시오. 당신의 모든 길에서 자신을 지키십시오. 왜냐하면 이런 것들을 행하는 모든 사람은 계명을 지키기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 전승에는 이 절 앞에 ‘악인의 길을 신뢰하지 마십시오, 그리고 당신의 길에서 조심하십시오’라는 구절이 붙어 있으나, 절 번호 뒤의 본문과는 별개의 인접 전승일 가능성이 있습니다.
    reason: textual_variant
lexical_decisions:
- source_word: אל תבטח בדרך רשעים
  english_pob_choice: Do not trust in the way of the wicked
  chosen_korean: 악인의 길을 신뢰하지 마십시오
  alternatives_korean:
  - 악한 자들의 길을 믿지 마십시오
  - 악인들의 행로를 의지하지 마십시오
  lexicon: BDB / HALOT
  rationale: הדרך רשעים의 기본 이미지는 ‘악인의 길’이며, בּטח의 금지형은 단순한 정보가 아니라 의지·신뢰의 금지이므로 ‘신뢰하지 마십시오’가 가장 직접적입니다.
- source_word: ובארחותיך הזהר
  english_pob_choice: and be careful in your paths
  chosen_korean: 그리고 당신의 길들에서 조심하십시오
  alternatives_korean:
  - 그리고 당신의 행로에서 주의하십시오
  - 그리고 당신의 길에서 신중하십시오
  lexicon: BDB / HALOT
  rationale: אורחותיך는 개인의 삶의 행로들을 가리키므로 복수성을 살려 ‘길들’로 옮기고, הזהר는 경계하라는 윤리적 명령이어서 ‘조심하십시오’가 자연스럽습니다.
- source_word: בכל דרכיך
  english_pob_choice: In all your ways
  chosen_korean: 당신의 모든 길에서
  alternatives_korean:
  - 모든 행위에서
  - 당신의 모든 행로에서
  lexicon: BDB / HALOT
  rationale: דרכים의 비유를 그대로 살리면서 한국어에서 가장 자연스러운 위치 표현으로 옮겼습니다.
- source_word: שמור נפשך
  english_pob_choice: guard yourself
  chosen_korean: 자신을 지키십시오
  alternatives_korean:
  - 당신의 생명을 지키십시오
  - 당신의 영혼을 지키십시오
  lexicon: BDB / HALOT
  rationale: נפש는 여기서 ‘영혼’보다 사람 자신/생명 전체를 가리키므로, 반사적 의미를 살린 ‘자신을 지키십시오’가 source-direct입니다.
- source_word: כל עושה אלה
  english_pob_choice: everyone who does these things
  chosen_korean: 이런 것들을 행하는 모든 사람은
  alternatives_korean:
  - 이런 일을 하는 사람마다
  - 이것들을 하는 자는 누구나
  lexicon: BDB / HALOT
  rationale: 행위 일반을 가리키는 분사구문이므로 대표성을 살려 ‘모든 사람은’으로 옮겼습니다.
- source_word: שומר מצוה
  english_pob_choice: keeps the commandment
  chosen_korean: 계명을 지키기 때문입니다
  alternatives_korean:
  - 그 계명을 지키기 때문입니다
  - 명령을 지키기 때문입니다
  lexicon: BDB / HALOT
  rationale: מצוה는 여기서 특정한 한 계명이라기보다 하나님께 대한 순종의 규범을 가리키는 일반적 표현이므로 ‘계명’이 가장 무난합니다.
theological_decisions:
- issue: הזהר의 어조
  chosen_reading: 윤리적 경계의 명령으로 직역해 ‘조심하십시오’로 유지했습니다.
  alternative_readings:
  - ‘주의하십시오’
  - ‘삼가십시오’
  rationale: 지혜문학의 경구체에서 הזהר는 단순한 주의 환기보다 실제적 자기보호를 촉구하므로, 완곡한 표현보다 직접적인 명령형이 적절합니다.
  doctrine_reference: 지혜문학의 권면 어조 보존
- issue: נפש의 이해
  chosen_reading: ‘영혼’으로 영해하지 않고 사람 전체/자기 자신으로 읽었습니다.
  alternative_readings:
  - 영혼
  - 목숨
  rationale: 문맥상 도덕적 자기보호를 말하므로 נפש를 신학적 ‘영혼’ 개념으로 좁히면 원문의 실천적 의미가 약해집니다.
  doctrine_reference: 본문 우선 원칙
