base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/032/026.yaml
  text: Mercy is beautiful in the time of his distress[b][a], like rain clouds in a time without rain.
  footnotes:
  - marker: a
    text: Or 'Mercy is fitting in a time of distress.' The adjective can emphasize beauty, pleasantness, or appropriateness.
    reason: lexical_alternative
  - marker: b
    text: Greek 'his distress,' using a masculine singular pronoun in a generic wisdom sense.
    reason: cultural_note
translation:
  language: ko
  text: 자비는 그가[b] 고난을 겪을 때 아름답습니다[a]. 이는 비가 없는 때의 비구름과 같습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그가 고난을 겪을 때 자비는 알맞습니다.’ ὡραῖον은 아름다움뿐 아니라 적절함이나 기분 좋음을 나타낼 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어는 남성 단수 대명사 ‘그의’를 쓰지만, 지혜문학의 대표적 표현으로 이해됩니다.
    reason: cultural_note
lexical_decisions:
- source_word: ὡραῖον
  english_pob_choice: beautiful
  chosen_korean: 아름답습니다
  alternatives_korean:
  - 아름답습니다
  - 보기 좋습니다
  - 마땅합니다
  - 알맞습니다
  lexicon: LSJ
  rationale: 형용사 ὡραῖον의 핵심은 단순한 유용성보다 아름다움·호감·적합성의 평가인데, 한국어에서는 ‘아름답습니다’가 그 가치 판단과 이미지 효과를 가장 직접적으로 살립니다.
- source_word: ἔλεος
  english_pob_choice: mercy
  chosen_korean: 자비
  alternatives_korean:
  - 긍휼
  - 인애
  - 은총
  lexicon: BDAG/LSJ
  rationale: 시락의 지혜문맥에서 ἔλεος는 어려운 자에게 베푸는 긍휼한 도움을 뜻하므로, 현대 한국어에서 가장 자연스럽고 직접적인 ‘자비’로 옮겼습니다.
- source_word: ἐν καιρῷ θλίψεως
  english_pob_choice: in the time of his distress
  chosen_korean: 그의 고난의 때에
  alternatives_korean:
  - 그의 환난의 때에
  - 그의 곤고의 때에
  - 그의 고통의 때에
  lexicon: LSJ/BDAG
  rationale: καιρός의 시간성은 ‘때’로 살리고, θλῖψις는 지혜서 문맥에 맞게 과도한 신학 용어보다 ‘고난’으로 풀어 자연스러운 합쇼체 문장을 만들었습니다.
- source_word: νεφέλαι ὑετοῦ
  english_pob_choice: rain clouds
  chosen_korean: 비구름
  alternatives_korean:
  - 비 내리는 구름
  - 비의 구름
  - 비를 머금은 구름
  lexicon: LSJ
  rationale: ‘구름과 비’의 비유를 한국어 관용에 맞게 압축하면 ‘비구름’이 가장 자연스럽고, 원문의 이미지도 선명하게 유지됩니다.
- source_word: ἀβροχίας
  english_pob_choice: a time without rain
  chosen_korean: 비 없는 때
  alternatives_korean:
  - 가뭄의 때
  - 무우의 때
  - 비가 없는 때
  lexicon: LSJ
  rationale: ἀβροχία는 ‘비가 없음’ 자체를 뜻하므로, 영어의 ‘a time without rain’을 따라 원문의 병행 구조를 보존하는 ‘비 없는 때’로 옮겼습니다.
theological_decisions:
- issue: θηλίψεως의 전달을 지혜문학 맥락에서 어떻게 표현할지
  chosen_reading: ‘고난’으로 번역해 일상적이면서도 압박과 시련을 포함하는 폭을 유지했습니다.
  alternative_readings:
  - 환난
  - 고통
  - 압박
  rationale: 시락 32:26은 교리적 전문용어보다 삶의 처지에 대한 지혜적 관찰을 말하므로, ‘고난’이 과장 없이 원문의 적용성을 살립니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1
