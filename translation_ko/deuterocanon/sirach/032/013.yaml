base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/032/013.yaml
  text: For all these things bless your Maker[a], who fills you with his goodness. He who seeks the law will obtain favor[c][b], but the hypocrite will be caught by it.
  footnotes:
  - marker: a
    text: 'The Hebrew witness for this verse differs substantially from the Greek, which reads: ''For the Lord is one who repays, and he will repay you sevenfold.'''
    reason: textual_variant
  - marker: b
    text: The Hebrew of the second line is difficult. 'The law' reflects a contextual reading of the transmitted text; alternatively, the phrase may point more generally to seeking God or divine instruction.
    reason: alternative_reading
  - marker: c
    text: The word rendered 'hypocrite' is uncertain; possible senses include 'boaster' or 'self-deluded person.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이 모든 것 위에 너희의 만드신 분을 찬양하십시오[a]. 그는 자신의 선하심으로 너희를 채우십니다. 율법을 찾는 사람은 호의를 얻고[b], 허풍쟁이는 그것에 붙잡힐 것입니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 절의 히브리어 증언은 그리스어와 상당히 다르며, 그리스어는 ‘주님은 갚으시는 분이시며, 당신에게 일곱 배로 갚으실 것입니다’라고 읽습니다.
    reason: textual_variant
  - marker: b
    text: 히브리어의 두 번째 행은 어렵습니다. 여기서는 문맥상 ‘율법’을 찾는 뜻으로 읽었지만, 더 넓게는 하나님이나 그분의 가르침을 찾는 뜻일 수도 있습니다.
    reason: alternative_reading
  - marker: c
    text: 이 단어의 뜻은 분명하지 않으며, ‘허풍쟁이’ 외에 ‘위선자’나 ‘자기기만하는 사람’으로도 볼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ברך
  english_pob_choice: bless
  chosen_korean: 찬양하십시오
  alternatives_korean:
  - 복을 빕니다
  - 축복하십시오
  lexicon: HALOT
  rationale: 히브리어 명령형 ברך는 하나님께 좋은 말을 돌리는 의미이므로, 문맥상 대상이 하나님일 때 자연스럽고 경건한 한국어 동사인 ‘찬양하십시오’를 택했습니다.
- source_word: עושך
  english_pob_choice: your Maker
  chosen_korean: 너희의 만드신 분
  alternatives_korean:
  - 너희의 창조주
  - 너희를 지으신 분
  lexicon: HALOT
  rationale: 형태상 ‘너를 만드신 이’이므로, 직접적 관계를 살리면서도 합쇼체 본문에 맞게 ‘너희의 만드신 분’으로 옮겼습니다.
- source_word: מרוך מטובתו
  english_pob_choice: who satisfies you with his goodness
  chosen_korean: 자신의 선하심으로 너희를 채우십니다
  alternatives_korean:
  - 그의 선하심으로 너희를 채우십니다
  - 자신의 선하심으로 너희를 만족시키십니다
  lexicon: HALOT
  rationale: 본문은 하나님이 선하심으로 풍성히 공급하신다는 뜻이므로, ‘채우십니다’가 ‘fills you’의 핵심 이미지를 가장 직접적으로 살립니다.
- source_word: יקוה רצון
  english_pob_choice: will obtain favor
  chosen_korean: 호의를 얻고
  alternatives_korean:
  - 은혜를 얻고
  - 호의를 기대하고
  lexicon: HALOT
  rationale: 히브리어는 ‘바라고 구함’의 뉘앙스가 있으나 문맥상 결과를 말하는 표현으로 읽히므로, 자연스러운 한국어 결과 표현인 ‘호의를 얻고’로 옮겼습니다.
- source_word: ומתלהלה
  english_pob_choice: the hypocrite
  chosen_korean: 허풍쟁이
  alternatives_korean:
  - 위선자
  - 자기기만하는 사람
  - 허세꾼
  lexicon: HALOT
  rationale: 이 단어는 뜻이 불확실하며, 지혜문학의 대비 구조상 허세 섞인 자기과시자를 가리킬 가능성이 있어, POB의 불확실성을 살리면서도 한국어에서 무난한 ‘허풍쟁이’를 선택했습니다.
- source_word: יוקש בו
  english_pob_choice: will be caught by it
  chosen_korean: 그것에 붙잡힐 것입니다
  alternatives_korean:
  - 그것에 걸려들 것입니다
  - 그것에 덫이 될 것입니다
  lexicon: HALOT
  rationale: יוקש는 ‘덫에 걸리다/올무에 걸리다’의 의미이므로, 율법/가르침이 오히려 그 사람을 걸러내는 역설을 드러내는 ‘붙잡힐 것입니다’로 옮겼습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 평행본문의 차이 반영
  chosen_reading: 본문은 현존 히브리어를 따라 번역하고, 그리스어의 다른 전승은 각주로 보존했습니다.
  alternative_readings:
  - 그리스어에 따라 ‘주님은 갚으시는 분이시며, 일곱 배로 갚아 주실 것입니다’로 번역
  rationale: 이 절은 히브리어와 그리스어가 크게 다르므로, 본문 번역은 히브리어를 우선하되 대체 전승을 숨기지 않도록 했습니다.
  doctrine_reference: 'PHILOSOPHY.md: 히브리어가 보존된 경우 그 본문을 우선하고, 다른 전승은 각주로 투명하게 표시'
