  - marker: b
    text: Or 'discipline' or 'good order' for 'instruction.' The Hebrew מוסר can carry several wisdom-related senses.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리하여 그들의 명예를 기뻐하고, 교훈에 대한 보상을 받도록 하십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 병행문은 “계명에 주의를 기울이는 자는 화목제물을 드린다”라고 매우 다르게 읽습니다. 본문은 현존하는 히브리어 증거를 따릅니다.
    reason: textual_variant
  - marker: b
    text: ‘교훈’(히브리어 מוסר)은 ‘훈계’, ‘훈육’, 또는 ‘좋은 질서’의 뜻도 가질 수 있습니다.
    reason: lexical_alternative
