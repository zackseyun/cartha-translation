  rationale: כבוד은 ‘명예’보다 넓게 존귀·영광의 뉘앙스를 가질 수 있어, 문맥상 손님들의 존귀를 자연스럽게 드러내는 ‘존귀’를 택했습니다.
- source_word: מוסר
  english_pob_choice: instruction
  chosen_korean: 교훈
  alternatives_korean:
