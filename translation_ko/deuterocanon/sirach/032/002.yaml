  - 훈육
  - 교정
  lexicon: HALOT
  rationale: 무서르/מוסר은 징계보다 지혜문학적 가르침의 뉘앙스가 강하므로, ‘instruction’에 대응하는 ‘교훈’이 가장 무난하고 본문 맥락에 맞습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행문의 차이
  chosen_reading: 주본문은 현존 히브리어의 잔존 구문을 따라 번역하고, 그리스어의 ‘계명을 따르는 자가 화목제물을 드린다’는 다른 전승은 본문 주석 차원의 대안으로만 둡니다.
  alternative_readings:
  - 그리스어를 따라 ‘계명에 주의를 기울이는 사람은 화목제물을 드립니다’
  rationale: 집회서는 히브리어가 보존된 곳에서는 히브리어를 우선하는 편집 원칙이므로, 그리스어 전승으로 본문을 대체하지 않고 의미 차이를 보존합니다.
  doctrine_reference: 'PHILOSOPHY.md: translate from Hebrew where it survives; parallel Greek used as control, not as replacement.'
