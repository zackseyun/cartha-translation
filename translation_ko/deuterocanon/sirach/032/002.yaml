translation:
  language: ko
  text: 그들의 존귀를 기뻐하게 되며, 너의 교훈으로 보상을 받게 됩니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 병행문은 ‘계명에 주의를 기울이는 자는 화목제물을 드린다’라고 매우 다르게 읽습니다. 본문은 현존 히브리어 증거를 따릅니다.
    reason: textual_variant
  - marker: b
    text: ‘교훈’은 여기서 ‘훈계’나 ‘질서 있는 가르침’까지 아우를 수 있습니다. 히브리어 מוסר의 의미 범위를 반영한 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: למען
  english_pob_choice: so that
  chosen_korean: -게 되며 / 하게 되며
  alternatives_korean:
  - 하기 위해
  - 하도록
  lexicon: HALOT
  rationale: 목적을 나타내는 למען을 한국어의 자연스러운 결과·목적 연결로 살렸습니다.
- source_word: תשמח
  english_pob_choice: you may rejoice
  chosen_korean: 기뻐하게 됩니다
