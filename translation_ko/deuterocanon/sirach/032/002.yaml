  text: so that you may rejoice in their honor[b][a], and receive a reward for your instruction.
  footnotes:
  - marker: a
    text: 'The Greek parallel reads very differently here: ''He who pays attention to the commandments offers a peace offering.'' The main text follows the extant Hebrew witness, which is the primary source for Sirach where preserved.'
