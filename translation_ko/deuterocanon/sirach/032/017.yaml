base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/032/017.yaml
  text: A wise man will incline himself to reproof[a], but one who is deceived will follow his own desire. A wise man will not conceal anger, but a scoffer will not guard his tongue.
  footnotes:
  - marker: a
    text: 'Greek witness: ''He will not disregard the plea of an orphan, nor a widow when she pours out her complaint.'' The Hebrew witness preserved here differs substantially from the Greek at this verse.'
    reason: alternative_reading
translation:
  language: ko
  text: 지혜로운 사람은 훈계에 귀를 기울이고, 쉽게 속는 사람은 자기 욕망을 따릅니다. 지혜로운 사람은 분노를 숨기지 않지만, 조롱하는 자는 자기 혀를 지키지 않습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '그리스어 증인: “그는 고아의 간구를 외면하지 않으며, 과부가 자기 호소를 쏟아낼 때에도 외면하지 않는다.” 이 절의 히브리어 증인은 그리스어와 상당히 다릅니다.'
    reason: alternative_reading
lexical_decisions:
- source_word: איש חכם
  english_pob_choice: a wise man
  chosen_korean: 지혜로운 사람
  alternatives_korean:
  - 지혜로운 남자
  - 지혜로운 자
  lexicon: HALOT
  rationale: 히브리어는 문법적으로 남성형 단수이지만, 한국어 속담체에서는 성별을 전면화하기보다 보편적 인간을 가리키는 표현이 자연스럽습니다.
- source_word: יטה תוכחות
  english_pob_choice: will incline himself to reproof
  chosen_korean: 훈계를 받아들이고
  alternatives_korean:
  - 훈계에 몸을 기울이고
  - 책망에 기울이고
  lexicon: HALOT
  rationale: 히브리어의 ‘기울이다’ 이미지를 살리면서도, 한국어에서는 ‘훈계를 받아들이다’가 권면을 향해 마음과 태도를 여는 뜻을 가장 자연스럽게 드러냅니다.
- source_word: ואחר צרכו ימשך נפתה
  english_pob_choice: will follow his own desire
  chosen_korean: 속는 사람은 자기 욕심을 따릅니다
  alternatives_korean:
  - 속은 사람은 제 욕구를 따라갑니다
  - 어리석은 자는 자기 뜻을 좇습니다
  lexicon: HALOT
  rationale: נפתה는 쉽게 속는 상태를 가리키므로 ‘속는 사람’으로 옮겼고, צרכו는 문맥상 욕구/원함의 방향을 나타내므로 ‘자기 욕심’이 가장 간결하게 대응합니다.
- source_word: לא יכסה כחמה
  english_pob_choice: will not conceal anger
  chosen_korean: 분노를 숨기지 않지만
  alternatives_korean:
  - 분노를 감추지 않지만
  - 노여움을 덮지 않지만
  lexicon: HALOT
  rationale: 전승된 히브리어는 ‘분노/노여움’을 가리키는 말로 읽히며, 직역의 ‘덮다’보다 한국어에서는 ‘숨기다’가 의도된 대비를 더 분명하게 전달합니다.
- source_word: לץ
  english_pob_choice: a scoffer
  chosen_korean: 조롱하는 자
  alternatives_korean:
  - 비웃는 자
  - 조롱꾼
  lexicon: HALOT
  rationale: 지혜문학의 לץ는 단순한 농담꾼이 아니라 권위와 훈계를 업신여기는 태도를 가리키므로, ‘조롱하는 자’가 그 성격을 잘 보존합니다.
- source_word: לא ישמר לשונו
  english_pob_choice: will not guard his tongue
  chosen_korean: 자기 혀를 지키지 않습니다
  alternatives_korean:
  - 혀를 삼가지 않습니다
  - 말을 조심하지 않습니다
  lexicon: HALOT
  rationale: 히브리어의 ‘지키다’ 동사를 살려 혀를 제어하는 이미지를 보존했고, 관용적으로도 자연스러운 표현을 택했습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행본문의 차이
  chosen_reading: 히브리어 전승의 두 행을 본문으로 번역하고, 그리스어는 각주로 보존합니다.
  alternative_readings:
  - '그리스어: 고아의 간구와 과부의 호소를 외면하지 않는다'
  rationale: 이 절은 히브리어와 그리스어가 내용상 크게 달라 단순한 어휘 차이를 넘어서는 본문 전승의 분기입니다. 본문은 현존 히브리어를 따르되, 대안 전승은 각주로 투명하게 남깁니다.
  doctrine_reference: 'PHILOSOPHY.md: 히브리어가 보존된 곳에서는 히브리어를 본문으로 번역하고, 중대한 병행 전승은 각주로 공개한다.'
