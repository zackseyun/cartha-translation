    text: '그리스어: ‘지극히 높으신 분에게 그분의 선물에 따라 주고, 호의로운 눈으로 네 손이 얻는 바에 따라 하십시오.’ 그리스어 증인은 현존 히브리어와 상당히 다른 형태의 본문을 반영합니다.'
    reason: alternative_reading
lexical_decisions:
- source_word: ושלם
  english_pob_choice: and fulfill
  chosen_korean: 채우고
  alternatives_korean:
  - 완성하고
  - 이루고
  - 갚고
  lexicon: HALOT
  rationale: שלם의 완료·충족 의미를 살려, 여기서는 ‘욕망을 채우다’가 행위의 완결을 자연스럽게 드러냅니다.
- source_word: רצון
  english_pob_choice: your desire
  chosen_korean: 당신의 욕망
  alternatives_korean:
  - 당신의 소원
  - 당신의 뜻
  - 당신의 바람
  lexicon: HALOT
  rationale: רצון은 뜻·원함·기쁨을 가질 수 있으나, 본문은 경외 안에서 채워야 할 내적 지향을 말하므로 ‘욕망’이 가장 직접적입니다.
- source_word: ביראת אל
  english_pob_choice: in the fear of God
  chosen_korean: 하나님을 경외하는 가운데
  alternatives_korean:
  - 하나님에 대한 두려움 속에서
  - 하나님을 두려워하는 가운데
  - 하나님 경외 안에서
  lexicon: HALOT
  rationale: ב + יראה의 관용구를 한국어로는 행위의 분위기와 기준을 살려 ‘경외하는 가운데’로 옮기는 것이 자연스럽습니다.
- source_word: ולא בחסר כל
  english_pob_choice: and not with any lack
  chosen_korean: 어떤 부족함으로도 하지 마십시오
  alternatives_korean:
  - 어떤 결핍으로도 하지 마십시오
  - 부족함 없이가 아니라
  - 무엇 하나 모자라지 않게
  lexicon: HALOT
  rationale: חסר כל은 ‘전적으로 결핍된 상태/부족함’의 의미를 압축적으로 담으므로, 한국어에서는 금지형으로 풀어 ‘부족함으로 하지 마십시오’라고 자연스럽게 전달합니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행문의 차이
  chosen_reading: 본문은 현존 히브리어를 따르고, 그리스어의 ‘지극히 높으신 분에게… 네 손이 얻는 바에 따라’라는 다른 형식은 각주로만 표시합니다.
  alternative_readings:
  - ‘지극히 높으신 이에게 그분의 선물에 따라 주고…’
  rationale: 집회서의 이 구절은 히브리어와 그리스어가 상당히 다르므로, 본문은 히브리어를 우선하고 그리스어는 대조 증거로만 남겨 텍스트 차이를 흐리지 않습니다.
  doctrine_reference: 'PHILOSOPHY.md: translate from Hebrew where it survives; use Greek parallel as input/check'
