base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/032/016.yaml
  text: One who fears Yahweh will understand judgment[d][c][b][a], and from the dawn he will bring forth wise sayings from his heart.
  footnotes:
  - marker: a
    text: 'Hebrew witnesses vary: some read ''will understand judgment,'' others ''will understand his judgment.'''
    reason: alternative_reading
  - marker: b
    text: The Hebrew phrase rendered 'from the dawn' is uncertain; it may also mean 'early' or refer more generally to daybreak/twilight.
    reason: lexical_alternative
  - marker: c
    text: Another Hebrew line reads, 'those who fear the LORD will understand his judgment, and with much wisdom they will bring it forth from their heart.'
    reason: textual_variant
  - marker: d
    text: The extant Greek parallel for this verse reflects a substantially different wording, indicating a divergent textual tradition here.
    reason: textual_variant
translation:
  language: ko
  text: 야훼를 경외하는 사람은 판단을 이해하고, 새벽부터 마음에서 지혜로운 말을 끌어냅니다.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 전승은 ‘판단을 이해하다’와 ‘그의 판단을 이해하다’로 갈립니다.
    reason: textual_variant
  - marker: b
    text: ‘새벽부터’에 해당하는 히브리어는 불확실하여, ‘일찍’이나 더 넓게는 ‘동틀녘/황혼’으로도 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 다른 히브리어 전승은 ‘야훼를 경외하는 이들은 그의 판단을 이해하고, 많은 지혜로 그것을 마음에서 끌어낸다’고 읽습니다.
    reason: textual_variant
  - marker: d
    text: 현존 그리스어 평행본문은 이 절과 상당히 다른 문구를 보여 주어, 본문 전승이 갈라져 있음을 시사합니다.
    reason: textual_variant
lexical_decisions:
- source_word: ירא יהוה / יראי יהוה
  english_pob_choice: one who fears the LORD / those who fear the LORD
  chosen_korean: 야훼를 경외하는 사람
  alternatives_korean:
  - 야훼를 두려워하는 사람들
  - 야훼를 경외하는 이
  lexicon: HALOT
  rationale: Hebrew tradition varies between singular and plural, so 한국어 본문은 대표적 단수 표현으로 자연스럽게 정리하되, ירא의 핵심인 경외를 살렸습니다.
- source_word: יבין
  english_pob_choice: will understand
  chosen_korean: 이해하고
  alternatives_korean:
  - 분별하고
  - 깨닫고
  lexicon: HALOT
  rationale: 지혜문맥에서 בין의 기본 의미를 살리면서 현대 한국어에서 자연스러운 인지 동사로 옮겼습니다.
- source_word: משפט
  english_pob_choice: judgment
  chosen_korean: 판단
  alternatives_korean:
  - 재판
  - 정의
  lexicon: HALOT
  rationale: 문맥상 추상적 ‘정의’보다 분별된 판정/판단의 의미가 더 직접적이어서, 원문의 משפט를 과도하게 신학화하지 않고 옮겼습니다.
- source_word: מנשף
  english_pob_choice: from the dawn
  chosen_korean: 새벽부터
  alternatives_korean:
  - 동트기부터
  - 새벽녘부터
  lexicon: HALOT
  rationale: נשף의 시간 표현이 새벽/황혼 양면성을 가지지만, 여기서는 지혜가 일찍 솟아나는 이미지를 살려 ‘새벽부터’로 옮겼습니다.
- source_word: יוציא
  english_pob_choice: will bring forth
  chosen_korean: 끌어냅니다
  alternatives_korean:
  - 내어놓습니다
  - 내뿜습니다
  lexicon: HALOT
  rationale: ‘가져오다/내다’보다 마음에서 말이나 지혜가 밖으로 나오는 이미지를 살릴 수 있는 동사로 정리했습니다.
- source_word: ובחכמות רבות / מלבם
  english_pob_choice: wise sayings / from his heart
  chosen_korean: 마음에서 지혜로운 말을
  alternatives_korean:
  - 많은 지혜를 마음에서
  - 그 마음에서 지혜들을
  lexicon: HALOT
  rationale: 본문 전승이 단수·복수와 표현상 흔들리므로, 한국어는 ‘지혜로운 말’로 의미를 매끈하게 하면서도 마음(לב)의 중심성을 유지했습니다.
theological_decisions:
- issue: YHWH의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 프로젝트 기본 원칙에 따라 히브리어 신명은 음역형 ‘야훼’를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יהוה / YHWH → 야훼'
- issue: 히브리어 본문을 우선하고 그리스어 평행본문을 따르지 않음
  chosen_reading: 현존 히브리어 본문을 본문으로 삼고, 그리스어는 상이한 전승으로만 처리합니다.
  alternative_readings:
  - 그리스어 평행본문을 본문으로 채택
  - 두 전승을 절충해 조화시킴
  rationale: 제시된 그리스어는 히브리어와 실질적으로 다른 문장을 보이므로, 본문 번역을 흐리지 않기 위해 히브리어를 기준으로 하고 전승 차이는 별도 주석으로 남기는 것이 타당합니다.
  doctrine_reference: 'PHILOSOPHY.md: Sefaria Ben Sira Hebrew is primary where it survives'
