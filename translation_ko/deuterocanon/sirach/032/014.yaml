translation:
  language: ko
  text: 하나님을 기쁘시게 하는 것을 찾는 사람은 훈계를 받아들이고, 그분을 일찍 찾는 사람은 기도 가운데서 응답을 얻습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 전승은 “뇌물을 바치지 말라. 그가 그것을 받지 않을 것이다.”로 달리 읽습니다. 현존 히브리어 본문은 이와 상당히 다릅니다.
    reason: textual_variant
lexical_decisions:
- source_word: דורש
  english_pob_choice: one who seeks
  chosen_korean: 찾는 사람
  alternatives_korean:
  - 구하는 사람
  - 찾아 구하는 사람
  lexicon: HALOT
  rationale: משך되는 행위를 나타내는 분사로 보고, 문맥에 맞는 자연스러운 현대 한국어인 ‘찾는 사람’으로 옮겼습니다.
- source_word: חפצי אל
  english_pob_choice: what pleases God
  chosen_korean: 하나님을 기쁘시게 하는 것
  alternatives_korean:
  - 하나님의 뜻
  - 하나님이 원하시는 것
  lexicon: HALOT
  rationale: 직역적 ‘하나님의 기쁨들’보다는, 하나님께서 기뻐하시는 바를 찾는다는 뜻을 한국어로 분명히 드러내는 표현을 택했습니다.
- source_word: יקח לקח
  english_pob_choice: will accept instruction
  chosen_korean: 훈계를 받아들이고
  alternatives_korean:
  - 가르침을 받아들이고
  - 교훈을 받습니다
  lexicon: HALOT
  rationale: 지혜문학의 관용구인 ‘take instruction’을 한국어 관용으로 풀어, 받아들임과 교정의 의미가 살아나도록 했습니다.
- source_word: ומשחרהו / ישיג מענה / ויענהו בתפלתו
  english_pob_choice: and the one who seeks him early will receive an answer through his prayer
  chosen_korean: 그분을 일찍 찾는 사람은 기도 가운데서 응답을 얻습니다
  alternatives_korean:
  - 그분을 간절히 찾는 사람은 기도 속에서 응답을 받습니다
  - 그분을 부지런히 찾는 사람은 기도로 응답을 얻습니다
  lexicon: HALOT
  rationale: ‘일찍 찾다’의 시간적 뉘앙스를 살리되, 한국어에서는 자연스럽게 ‘응답을 얻다’로 정리했습니다. ‘기도 가운데서’는 응답이 기도와 연결되어 있다는 원문의 설명을 반영합니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 전통의 큰 차이
  chosen_reading: 주본문은 현존 히브리어를 따르고, 그리스어의 ‘뇌물을 바치지 말라’ 전승은 각주로 밝혔습니다.
  alternative_readings:
  - “뇌물을 바치지 말라. 그가 그것을 받지 않을 것이다.”
  rationale: 시라서는 현존 히브리어를 우선 번역하되 그리스어 전승의 משמעות도 공개해야 하므로, 본문은 히브리어를 따르고 의미가 크게 다른 그리스어는 주석으로 보존했습니다.
  doctrine_reference: 'PHILOSOPHY.md: translate Sirach from Hebrew where it survives; use Swete LXX alongside it'
