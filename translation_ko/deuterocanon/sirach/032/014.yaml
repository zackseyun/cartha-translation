  source_fidelity: 주본문은 영어 POB가 채택한 현존 히브리어 계열의 의미, 곧 하나님께서 기뻐하시는 것을 찾고 가르침을 받아들이며 기도와 관련하여 응답을 얻는다는 뜻을 대체로 충실히 반영합니다. 다만 ‘기도 가운데서’는 בתפלתו의 소유·관련성을 다소 흐리므로 ‘그의 기도에’가 더 직접적입니다. 히브리어와 크게 다른 그리스어 전승을 각주로 보존한 점은 적절합니다.
  naturalness: ‘하나님을 기쁘시게 하는 것’도 이해되지만, 현대 표준 한국어에서는 ‘하나님께서 기뻐하시는 것’이 수식 관계를 더 분명하고 자연스럽게 드러냅니다. ‘기도에 응답을 얻습니다’는 합쇼체 문체를 유지하면서 원문의 기도 관련성을 자연스럽게 표현합니다.
