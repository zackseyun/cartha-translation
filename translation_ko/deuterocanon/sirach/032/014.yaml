  text: One who seeks what pleases God will accept instruction[a], and the one who seeks him early will receive an answer through his prayer.
  footnotes:
  - marker: a
    text: 'Greek tradition: ''Do not offer bribes, for he will not accept them.'' The extant Hebrew witness here differs substantially from the Greek.'
