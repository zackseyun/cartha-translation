base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/032/018.yaml
  text: A wise man will not take a bribe[c][b][a], but a proud scoffer will not keep the law.
  footnotes:
  - marker: a
    text: Hebrew זד ולץ may also be read as two character labels, 'the insolent and the scoffer,' rather than the combined expression 'an insolent scoffer.'
    reason: alternative_reading
  - marker: b
    text: Or 'instruction' for 'the law'; Hebrew תורה can denote authoritative teaching more broadly, not only legal statute.
    reason: lexical_alternative
  - marker: c
    text: The Greek parallel supplied here does not align with this Hebrew line, so the translation follows the extant Hebrew witness primarily.
    reason: textual_variant
translation:
  language: ko
  text: 지혜로운 사람은 뇌물을 받지 않습니다. 그러나 거만하고 조롱하는 자는 율법을 지키지 않습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 זד ולץ는 '거만한 조롱꾼'이라는 하나의 복합 표현으로도, '거만한 자와 조롱하는 자'라는 두 성격 표지로도 읽을 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: תורה는 여기서 '율법'보다 넓게 '교훈' 또는 '가르침'을 뜻할 수도 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 제시된 그리스어 평행본문은 이 히브리어 행과 맞지 않으므로, 번역은 현존하는 히브리어 증거를 우선했습니다.
    reason: textual_variant
lexical_decisions:
- source_word: איש חכם
  english_pob_choice: a wise man
  chosen_korean: 지혜로운 사람
  alternatives_korean:
  - 지혜로운 남자
  - 현명한 사람
  lexicon: HALOT
  rationale: 히브리어는 남성 단수형이지만, 한국어에서는 잠언적 일반 진술로 자연스럽게 읽히도록 성별 표지를 완화한 '사람'을 썼습니다.
- source_word: לא יקח שחד
  english_pob_choice: will not take a bribe
  chosen_korean: 뇌물을 받지 않습니다
  alternatives_korean:
  - 뇌물을 취하지 않습니다
  - 뇌물을 받지 않을 것입니다
  lexicon: HALOT
  rationale: שחד는 금품성 뇌물을 가리키므로 '받다'가 자연스럽고 직접적입니다. 현재형은 지혜 격언의 상시적 행위를 잘 나타냅니다.
- source_word: זד ולץ
  english_pob_choice: a proud scoffer
  chosen_korean: 거만하고 조롱하는 자
  alternatives_korean:
  - 거만한 조롱꾼
  - 오만하고 비웃는 자
  - 거만한 조롱하는 자
  lexicon: HALOT
  rationale: 히브리어는 접속사 없이 두 성격표지를 나란히 두어, '거만하고 조롱하는 자'로 풀어 두 특성을 모두 드러냈습니다. 문맥상 한 인물을 가리키는 복합 표현으로 읽었습니다.
- source_word: תורה
  english_pob_choice: the law
  chosen_korean: 율법
  alternatives_korean:
  - 가르침
  - 교훈
  lexicon: HALOT
  rationale: 지혜문학 맥락에서 תורה는 폭넓게 '가르침'을 뜻할 수 있지만, 여기서는 의인/악인의 대조 속에서 권위 있는 규범을 가리키므로 '율법'이 가장 직접적입니다.
theological_decisions:
- issue: 토라(תורה)의 범위
  chosen_reading: 이 구절에서는 '율법'으로 번역하되, 일반적 교훈까지 포함할 수 있는 넓은 의미는 본문 주석 가능성으로 남깁니다.
  alternative_readings:
  - 교훈
  - 가르침
  rationale: 본문의 윤리적 대조가 핵심이므로 규범적 무게를 살렸습니다. 다만 תורה의 의미 범위가 더 넓을 수 있어 번역 선택이 과도하게 협소해지지 않도록 했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 5
