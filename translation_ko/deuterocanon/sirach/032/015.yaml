translation:
  language: ko
  text: 율법을 찾는 이는 그것을 붙잡을 것이며, 위선을 부리는 자는 그것에 걸려들 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ומתלהלה는 뜻이 분명하지 않아, ‘위선을 부리는 자’, ‘가식적인 자’, ‘자기기만에 빠진 자’ 등으로 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: '이 절의 그리스어 병행본문은 내용이 크게 다릅니다: ‘그리고 불의한 희생제사를 계속 드리지 말라. 주님은 재판장이시며, 그분께는 사람을 외모로 보아 편파적으로 대하심이 없기 때문이다.’ 히브리어와 그리스어 증서는 이곳에서 서로 다른 본문 형태를 반영하는 것으로 보입니다.'
    reason: textual_variant
lexical_decisions:
- source_word: דורש תורה
  english_pob_choice: seeks the law
  chosen_korean: 율법을 찾는 이는
  alternatives_korean:
  - 율법을 구하는 이는
  - 율법을 찾는 사람은
  - 율법을 추구하는 이는
  lexicon: HALOT
  rationale: דרש תורה는 단순한 정보 탐색이 아니라 율법을 향한 적극적 추구를 가리키므로, ‘찾는’이 가장 자연스럽고도 그 긴박함을 살립니다.
- source_word: תורה
  english_pob_choice: the law
  chosen_korean: 율법
  alternatives_korean:
  - 가르침
  - 교훈
  - 토라
  lexicon: HALOT
  rationale: 이 지혜문맥에서 תורה는 단순한 일반 교훈보다 권위 있는 하나님의 율법을 가리키는 흐름이어서, POB의 ‘the law’에 맞춰 ‘율법’으로 옮겼습니다.
- source_word: ומתלהלה
  english_pob_choice: the one who plays the hypocrite
  chosen_korean: 위선을 부리는 자는
  alternatives_korean:
  - 가식적인 자는
  - 자기기만에 빠진 자는
  - 허세를 부리는 자는
  lexicon: HALOT
  rationale: 본문의 متלהלה는 난해하지만, POB가 지적하듯 진실하지 못한 태도를 가리키는 것으로 읽는 것이 대비 구조에 가장 잘 맞습니다. ‘위선을 부리다’는 외형상 종교적 태도와 내면의 불일치를 드러냅니다.
- source_word: יוקש בו
  english_pob_choice: will be caught by it
  chosen_korean: 그것에 걸려들 것입니다
  alternatives_korean:
  - 그것에 잡힐 것입니다
  - 그것에 올무처럼 걸릴 것입니다
  - 그것에 포획될 것입니다
  lexicon: HALOT
  rationale: יוקש는 ‘덫에 걸리다/잡히다’의 수동 의미가 분명하므로, 한국어에서는 ‘걸려들다’가 가장 자연스럽게 함정을 당하는 뉘앙스를 전달합니다.
theological_decisions:
- issue: How to represent the contrast between sincere seeking and insincere handling of the law
  chosen_reading: 율법을 찾는 사람은 그것을 얻고, 위선을 부리는 자는 그 율법 자체에 걸려든다
  alternative_readings:
  - 율법을 아는 이는 그것을 깨닫는다
  - 율법을 찾는 이는 그것을 이해한다
  rationale: 본문은 단순한 인지보다 ‘붙잡음/획득’과 ‘걸려듦’의 대비를 세우므로, 의미를 약화시키는 ‘이해하다’보다 결과의 강한 역전을 살려야 합니다. 또한 ‘그것에’는 앞선 율법을 가리켜, 같은 율법이 진실한 자에게는 소유가 되고 거짓된 자에게는 함정이 됨을 드러냅니다.
  doctrine_reference: 'POB 원칙: 원문 우선, 대조 구조 보존'
