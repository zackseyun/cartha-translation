translation:
  language: ko
  text: 포도주 잔치에서 하나님께 드리는 노래는 금 주머니 위의 인장과 같습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 שיר אל은 ‘하나님께 드리는 노래’로도, 하나님과 관련된 노래로도 이해될 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 이 절 단위의 앞선 히브리어 행들은 전승 과정에서 본문이 불확실합니다. 여기서는 비교를 이루는 마지막 구절을 현존 히브리어 본문에 따라 옮겼습니다.
    reason: textual_variant
lexical_decisions:
- source_word: כחותם
  english_pob_choice: Like a seal
  chosen_korean: 마치 인장처럼
  alternatives_korean:
  - 마치 봉인처럼
  - 마치 도장처럼
  lexicon: HALOT
  rationale: כ 의 비교 용법을 살려 ‘마치 …처럼’으로 옮기고, חותם은 문맥상 물건의 값을 높이는 표지인 ‘인장’이 가장 자연스럽습니다.
- source_word: כיס זהב
  english_pob_choice: on a bag/pouch of gold
  chosen_korean: 금이 든 주머니에
  alternatives_korean:
  - 금 주머니에
  - 금 주머니 위에
  - 금이 든 자루에
  lexicon: HALOT
  rationale: כיס는 값진 물건을 넣는 주머니/자루의 이미지이므로, 비교 구문의 자연스러움을 살려 ‘금이 든 주머니’로 풀었습니다.
- source_word: שיר אל
  english_pob_choice: a song to God / of God
  chosen_korean: 하나님께 드리는 노래
  alternatives_korean:
  - 하나님의 노래
  - 하나님께 드리는 찬가
  - 하나님께 바치는 노래
  lexicon: HALOT
  rationale: 히브리어가 압축되어 있어 ‘אל’의 관계를 단정하지 않도록 하면서도, 문맥상 하나님을 향한 노래라는 뜻을 가장 분명하게 드러냈습니다.
- source_word: על משתה היין
  english_pob_choice: at a banquet of wine
  chosen_korean: 잔치 자리에서
  alternatives_korean:
  - 포도주 잔치에서
  - 포도주 잔치 자리에서
  - 술잔치에서
  lexicon: HALOT
  rationale: משתה היין은 단순한 음주보다 잔치의 장면을 가리키므로, 한국어에서는 과도한 설명을 덜고 ‘잔치 자리’로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: שיר אל의 관계 표현
  chosen_reading: ‘하나님께 드리는 노래’로 번역해 방향성을 살리되, ‘하나님의 노래’처럼 소유적 의미로 닫지 않았습니다.
  alternative_readings:
  - 하나님의 노래
  - 하나님을 위한 노래
  rationale: 본문의 압축성을 고려하면 관계가 완전히 단정되지 않으므로, 예배적 방향은 드러내되 의미를 과도하게 좁히지 않는 표현이 적절합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 3
- issue: 비유문의 수사 강도
  chosen_reading: 비교문을 직역하지 않고 한국어 자연성을 위해 ‘마치 …처럼’으로 정리했습니다.
  alternative_readings:
  - 인장과 같이
  - 인장처럼
  rationale: 지혜문학의 비유 효과를 살리면서도 현대 한국어에서 읽기 쉬운 문장 흐름을 유지하기 위한 선택입니다.
  doctrine_reference: DOCTRINE.md §Style and readability
