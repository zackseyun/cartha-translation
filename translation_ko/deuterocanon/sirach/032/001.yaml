base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/032/001.yaml
  text: If they have made you the leader[a], do not exalt yourself; be among them like one of them. Care for them, and then recline; prepare what is needed[c][b], and then take your place.
  footnotes:
  - marker: a
    text: 'The opening clause in the Hebrew witness is bracketed in Kahana''s edition: ''If they have made you the leader, do not exalt yourself.'' The surrounding lines strongly support this banquet-host setting, and the Greek parallel also reflects meal-related instruction in this section, though it differs substantially in wording.'
    reason: textual_variant
  - marker: b
    text: Or 'look after them' for 'Care for them.' The Hebrew verb can emphasize practical concern as well as inward solicitude.
    reason: lexical_alternative
  - marker: c
    text: '''Recline'' reflects the posture customary at formal ancient meals.'
    reason: cultural_note
translation:
  language: ko
  text: 그들이 당신을 모임의 책임자로 세웠다면[a], 자신을 높이지 마십시오. 그들 가운데서 그들 중 한 사람처럼 있으십시오. 그들을 돌보십시오[b]. 그런 뒤에 자리에 기대어 앉으십시오[c]. 필요한 것을 마련한 뒤에 자리를 잡으십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 전승에서 이 첫 구절은 카하나 판에서 대괄호로 표시되어 있습니다. 뒤따르는 문맥은 잔치 자리에서의 처신을 가리키며, 그리스어 본문도 이 단락에서 식사 관련 교훈을 전하지만 표현은 상당히 다릅니다.
    reason: textual_variant
  - marker: b
    text: 또는 ‘살피십시오’ 또는 ‘챙기십시오’. 히브리어 동사는 실제로 보살피고 배려하는 뜻을 포함할 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘기대어 앉으십시오’는 고대의 격식 있는 식사에서 흔했던 식탁 자세를 반영합니다.
    reason: cultural_note
lexical_decisions:
- source_word: ראש נבחרת
  english_pob_choice: the leader
  chosen_korean: 우두머리
  alternatives_korean:
  - 지도자
  - 책임자
  - 우두머리 격인 사람
  lexicon: HALOT
  rationale: 선출된 무리의 머리라는 뜻을 살리면서, 잔치 자리의 맥락에서 권위와 자리 선정을 자연스럽게 드러내기 위해 ‘우두머리’를 택했습니다.
- source_word: אל תתרומם
  english_pob_choice: do not exalt yourself
  chosen_korean: 스스로 높이지 마십시오
  alternatives_korean:
  - 교만해지지 마십시오
  - 자기를 높이지 마십시오
  - 우쭐대지 마십시오
  lexicon: HALOT
  rationale: 반사적 동작을 직접 반영해 자가 고양의 금지를 분명히 했습니다.
- source_word: דאג להם
  english_pob_choice: Care for them
  chosen_korean: 그들을 돌보십시오
  alternatives_korean:
  - 그들을 염려하십시오
  - 그들을 살피십시오
  - 그들을 보살피십시오
  lexicon: HALOT
  rationale: 단순한 내적 염려보다 실제적인 배려와 접대의 의미를 함께 담을 수 있어 ‘돌보다’를 사용했습니다.
- source_word: תסב / תרבץ
  english_pob_choice: recline / take your place
  chosen_korean: 자리에 드십시오 / 앉으십시오
  alternatives_korean:
  - 몸을 누이십시오 / 자리를 잡으십시오
  - 식탁에 드십시오 / 자리에 앉으십시오
  lexicon: HALOT
  rationale: 고대 연회의 식사 자세를 완전히 현대화하지 않되, 한국어에서 자연스럽게 이해되는 착석·자리잡기 표현으로 옮겼습니다.
theological_decisions:
