  text: He who keeps the law guards his life[a], and he who trusts in Yahweh will not be put to shame.
  footnotes:
  - marker: a
    text: 'The Greek parallel at this verse differs substantially: ''until he repays a man according to his deeds, and the works of men according to their thoughts.'' The main text follows the extant Hebrew witness here.'
