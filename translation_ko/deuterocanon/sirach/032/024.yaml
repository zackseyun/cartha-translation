translation:
  language: ko
  text: 율법을 지키는 사람은 자기 생명을 지키며, 야훼를 신뢰하는 사람은 부끄러움을 당하지 않습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 평행문은 이 절에서 상당히 다릅니다. ‘사람에게 그의 행위대로 갚으실 때까지, 또 사람들의 일들을 그들의 생각대로’라고 되어 있습니다. 본문은 여기서 현존 히브리어 증언을 따릅니다.
    reason: textual_variant
lexical_decisions:
- source_word: נוצר תורה
  english_pob_choice: keeps the law
  chosen_korean: 율법을 지키는
  alternatives_korean:
  - 율법을 보존하는
  - 율법을 준수하는
  lexicon: HALOT
  rationale: נצר는 ‘지키다, 보존하다, 간수하다’의 뜻이므로, תורה의 규범적 의미를 살려 ‘율법을 지키는’으로 자연스럽게 옮겼습니다.
- source_word: תורה
  english_pob_choice: the law
  chosen_korean: 율법
  alternatives_korean:
  - 법
  - 가르침
  lexicon: HALOT
  rationale: 지혜문맥이지만 여기서는 언약적·종교적 규범을 가리키므로 ‘가르침’보다 ‘율법’이 본문의 힘을 더 분명히 드러냅니다.
- source_word: שומר נפשו
  english_pob_choice: guards his life
  chosen_korean: 자기 생명을 지키며
  alternatives_korean:
  - 자기 영혼을 지키며
  - 자신을 보호하며
  lexicon: HALOT
  rationale: נפש는 여기서 현대 한국어의 ‘영혼’보다 ‘생명’이 더 정확하며, ‘지키다’가 앞의 נוצר와도 평행을 이룹니다.
- source_word: ובוטח ביהוה
  english_pob_choice: and he who trusts in the LORD
  chosen_korean: 야훼를 신뢰하는 사람은
  alternatives_korean:
  - 주님을 신뢰하는 사람은
  - 야훼를 믿는 사람은
  lexicon: HALOT
  rationale: 이 프로젝트의 기본 원칙에 따라 יהוה는 ‘야훼’로 옮겼고, בטח는 단순한 ‘믿다’보다 의탁의 뉘앙스가 살아 있는 ‘신뢰하다’로 옮겼습니다.
- source_word: לא יבוש
  english_pob_choice: will not be put to shame
  chosen_korean: 부끄러움을 당하지 않습니다
  alternatives_korean:
  - 수치를 당하지 않습니다
  - 부끄러워하지 않습니다
  lexicon: HALOT
  rationale: בוש의 결과적·수동적 의미를 살려, 단순한 내적 감정보다 실패한 의탁으로 인한 ‘부끄러움/수치’를 표현했습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 이 프로젝트의 기본 용례에 따라 tetragrammaton은 ‘야훼’로 직접 표기하여 본문의 고유 신명성을 드러냈습니다.
  doctrine_reference: 'Project glossary: יהוה / YHWH'
- issue: 히브리어 본문과 그리스어 평행문의 긴장
  chosen_reading: 현존 히브리어 본문을 본문으로 번역하고, 그리스어 평행문의 상이함은 각주로 남김
  alternative_readings:
  - '그리스어: ‘사람에게 그의 행위대로 갚으실 때까지, 또 사람들의 일들을 그들의 생각대로’'
  rationale: 이 절은 그리스어 평행문이 본문과 실질적으로 다른 격언이므로, 히브리어 증언을 우선하고 그 차이를 번역 본문에 혼합하지 않았습니다.
  doctrine_reference: 'PHILOSOPHY.md: translate from Hebrew where it survives; use parallel Greek as actual input'
