  lexicon: HALOT
  rationale: 히브리어의 ‘거짓의 사람들’이라는 관용을 뜻이 드러나도록 풀어, 단순한 발화 행위보다 삶의 성격까지 포함하는 표현으로 옮겼습니다.
- source_word: לֹא יִזְכְּרוּהָ
  english_pob_choice: will not remember her
  chosen_korean: 그녀를 기억하지 못합니다
  alternatives_korean:
  - 그녀를 기억하지 않을 것입니다
  - 그녀를 떠올리지 못합니다
  lexicon: HALOT
  rationale: זכר의 기본 의미인 ‘기억하다/떠올리다’를 그대로 살리면서, 현재형 미래적 진술을 한국어의 일반적인 부정 종결로 자연스럽게 표현했습니다.
