translation:
  language: ko
  text: 그녀는 조롱하는 자들에게서 멀리 떨어져 있으며, 거짓된 사람들은 그녀를 기억하지 않습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '그리스어: ‘그녀는 교만과는 멀리 떨어져 있고, 거짓말하는 사람들은 결코 그녀를 기억하지 않을 것입니다.’ 히브리어는 ‘조롱하는 자들’로 읽는 반면, 그리스어는 ‘교만’을 읽습니다. 이는 서로 다른 바탕 본문이나 해석적 옮김을 반영할 수 있습니다.'
    reason: alternative_reading
