  language: ko
  text: 그 여자는 조롱하는 자들로부터 멀리 있고, 거짓된 사람들은 그녀를 기억하지 못합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '그리스어: ‘그 여자는 교만으로부터 멀리 있고, 거짓말하는 사람들은 결코 그녀를 기억하지 않을 것입니다.’ 히브리어는 ‘조롱하는 자들’로 읽히며, 그리스어는 ‘교만’을 보입니다. 이는 서로 다른 바탕본문 또는 해석적 옮김을 반영한 것으로 보입니다.'
    reason: alternative_reading
