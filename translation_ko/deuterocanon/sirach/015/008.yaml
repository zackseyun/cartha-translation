  source_fidelity: 히브리어 본문은 ‘조롱하는 자들’(מִלֵּצִים)과 ‘거짓의 사람들’(אַנְשֵׁי כָזָב)을 말하며, 지혜를 가리키는 여성 단수 대명사를 유지합니다. 초안은 이 대조를 대체로 충실히 반영하지만, ‘기억하지 못합니다’는 기억할 능력이 없다는 뜻으로도 읽혀 단순 부정인 לֹא יִזְכְּרוּהָ보다 강하거나 다르게 들릴 수 있습니다.
  naturalness: ‘그 여자’는 한국어에서 앞 문맥의 의인화된 지혜를 가리키는 표현으로 부자연스럽고 불필요하게 일상적·대인적인 뉘앙스를 냅니다. ‘그녀는’이 문맥상의 여성 의인화를 자연스럽게 보존합니다. 또한 ‘…로부터 멀리 있고’보다 ‘…에게서 멀리 떨어져 있으며’가 비유적 분리를 더 자연스럽게 나타냅니다.
