  lexicon: HALOT
  rationale: 히브리어의 구체적 의인화 이미지를 살려 ‘눈’을 유지했고, 하나님을 주어로 자연스럽게 드러내는 표현으로 옮겼습니다.
- source_word: יִרְאוּ
