base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/015/019.yaml
  text: The eyes of God see his works[b][a], and he knows every deed of a man.
  footnotes:
  - marker: a
    text: Or 'every deed of a person.' The Hebrew reads 'of a man' (אִישׁ), a masculine singular form often used generically in wisdom literature.
    reason: lexical_alternative
  - marker: b
    text: The Greek parallel differs in the first clause, reading, 'his eyes are upon those who fear him,' while agreeing in sense that God fully knows human deeds.
    reason: alternative_reading
translation:
  language: ko
  text: 하나님의 눈은 그의 행위를 보시며, 그분은 사람의 모든 행위를 알아보십니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘사람’은 히브리어 אִישׁ의 남성 단수형을 따른 표현입니다. 지혜문학에서는 일반적으로 사람을 가리키는 대표적 용법으로 쓰입니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어 병행본문은 첫 절을 ‘그의 눈은 그를 경외하는 이들 위에 있습니다’로 달리 전합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: עֵינֵי אֵל
  english_pob_choice: The eyes of God
  chosen_korean: 하나님의 눈은
  alternatives_korean:
  - 하나님의 시선은
  - 하나님은 보십니다
  lexicon: HALOT
  rationale: 히브리어의 구체적 의인화 이미지를 살려 ‘눈’을 유지했고, 하나님을 주어로 자연스럽게 드러내는 표현으로 옮겼습니다.
- source_word: יִרְאוּ
  english_pob_choice: see
  chosen_korean: 보시며
  alternatives_korean:
  - 살피시며
  - 보십니다
  lexicon: HALOT
  rationale: 단순한 인지보다 실제로 ‘보는’ 동작을 나타내어 앞절의 의인적 이미지를 보존했습니다.
- source_word: מַעֲשָׂיו
  english_pob_choice: his works
  chosen_korean: 그의 행위
  alternatives_korean:
  - 그의 일
  - 그의 행적
  lexicon: HALOT
  rationale: 히브리어 מעשה의 도덕적·행동적 의미를 살리면서, 한국어에서 ‘works’보다 더 자연스러운 ‘행위’를 택했습니다.
- source_word: מִפְעַל אִישׁ
  english_pob_choice: every deed of a man
  chosen_korean: 사람의 모든 행위
  alternatives_korean:
  - 한 사람의 모든 행위
  - 모든 사람의 행위
  lexicon: HALOT
  rationale: אִישׁ의 남성 단수 형식을 유지하면서도 잠언적·지혜문학적 일반성을 살려 ‘사람’으로 옮겼고, ‘모든’으로 כָּל의 포괄성을 표현했습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행본문의 차이
  chosen_reading: 히브리어 본문을 따라 첫 절은 ‘하나님의 눈은…’으로 옮기고, 그리스어의 ‘그를 경외하는 이들’은 본문에 반영하지 않았습니다.
  alternative_readings:
  - 그의 눈은 그를 경외하는 이들 위에 있습니다
  - 하나님의 눈은 그를 경외하는 이들 위에 있습니다
  rationale: 이 단락의 주본문은 히브리어이며, 그리스어는 병행 확인 자료로만 제시되므로 히브리어의 직설적 진술을 우선했습니다.
  doctrine_reference: DOCTRINE.md §Source primacy
