    rationale: יַכִּיר의 인식·파악의 뜻은 ‘아십니다’로 충분히 전달되며, 하나님의 인간 행위에 대한 완전한 앎을 말하는 문맥에도 더 자연스럽습니다.
  revised_text: 하나님의 눈은 사람이 한 일을 보시며, 그분은 사람의 모든 행위를 아십니다.[a][b]
