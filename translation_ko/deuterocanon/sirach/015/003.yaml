  text: He will feed him with the bread of understanding[b][a], and give him the water of insight to drink.
  footnotes:
  - marker: a
    text: 'Or, with Wisdom explicit from the context: ''She will feed him with the bread of understanding, and give him the water of insight to drink.'''
    reason: alternative_reading
  - marker: b
    text: The Greek parallel reads 'water of wisdom' where the Hebrew has 'water of insight.' The Hebrew witness is primary here, but the Greek supports the same wisdom-metaphor broadly.
    reason: textual_variant
translation:
  language: ko
  text: 그는 그에게 이해의 빵을 먹이고, 통찰의 물을 마시게 하십니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 문맥상 지혜를 분명히 의인화하면 ‘그녀는 그에게 이해의 빵을 먹이고, 통찰의 물을 마시게 하십니다’로도 읽을 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어는 ‘통찰의 물’이고, 그리스어 평행본문은 ‘지혜의 물’입니다. 본문은 히브리어 증언을 따르되, 전승 차이도 함께 보존합니다.
    reason: textual_variant
lexical_decisions:
- source_word: וְהֶאֱכִילַתְהוּ
  english_pob_choice: He will feed him
  chosen_korean: 그는 그에게 먹이고
  alternatives_korean:
  - 그녀는 그에게 먹이고
  - 그를 먹이십니다
  - 그에게 먹이를 주고
  lexicon: HALOT
  rationale: הִפְעִיל형 동사 אכל은 ‘먹게 하다/먹이다’의 뜻이므로, 본문 동사를 자연스럽게 살려 ‘먹이고’로 옮겼습니다. 영어 초안의 인칭 불확정성을 따르되, 히브리어 본문과 문맥의 의인화 가능성은 따로 단정하지 않았습니다.
- source_word: שָׂכֶל
  english_pob_choice: understanding
  chosen_korean: 이해
  alternatives_korean:
  - 이해력
  - 분별
  - 통찰
  lexicon: HALOT
  rationale: שָׂכֶל은 지적·실천적 ‘이해/분별’을 가리키므로, 문맥의 지혜 은유에 맞게 ‘이해’로 옮겼습니다. 앞의 다른 지혜어와 의미를 지나치게 겹치지 않게 하면서도 자연스러운 한국어로 유지합니다.
- source_word: תְבוּנָה
  english_pob_choice: insight
  chosen_korean: 통찰
  alternatives_korean:
  - 깨달음
  - 분별
  - 이해
  lexicon: HALOT
  rationale: תְבוּנָה는 ‘분별/통찰’의 의미가 강하므로, 앞의 שָׂכֶל과 구별되도록 ‘통찰’로 번역했습니다. 영어 초안의 ‘insight’와도 잘 대응하며, 두 지혜 표현의 병렬을 살립니다.
- source_word: לֶחֶם ... וּמֵי ...
  english_pob_choice: bread ... water of ...
  chosen_korean: 빵 ... 물
  alternatives_korean:
  - 떡 ... 물
  - 양식 ... 물
  lexicon: HALOT
  rationale: ‘빵’과 ‘물’의 구체적 이미지를 유지해 지혜의 양육 이미지를 살렸습니다. ‘양식’으로 일반화하면 은유의 생동감이 약해질 수 있어, 보다 직접적인 표상을 택했습니다.
theological_decisions:
- issue: 지혜의 의인화 여부
  chosen_reading: 본문에서는 중성적 주어 처리로 의미를 열어 두었습니다.
  alternative_readings:
  - 그녀는 그에게 이해의 빵을 먹이고, 통찰의 물을 마시게 하십니다.
  - 지혜가 그에게 이해의 빵을 먹이고, 통찰의 물을 마시게 합니다.
  rationale: 집성 본문과 영어 POB 초안은 지혜의 의인화를 암시하지만, 이 절 자체의 표면형은 주어를 명시하지 않으므로 한국어 본문에서는 해석을 과도하게 고정하지 않았습니다. 다만 문맥상 지혜의 인격화 가능성은 열어 둡니다.
  doctrine_reference: 문맥적 의인화는 유지하되, 본문 외 해석을 본문에 강제하지 않음.
