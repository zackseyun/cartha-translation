  text: Do not say[a], “My transgression is from God,” for he has not done what he hates.
  footnotes:
  - marker: a
    text: 'Greek parallel: “Do not say, ‘Through the Lord I fell away,’ for you will not do what he hated.” The Greek reflects a related but not identical wording to the surviving Hebrew.'
    reason: alternative_reading
translation:
  language: ko
  text: “내 허물이 하나님에게서 났다”라고 말하지 마십시오. 그는 자기가 미워하는 것을 하시지 않기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 병행문은 “주님 때문에 내가 떠났다”와 같은 다른 표현을 보입니다. 히브리어는 허물이 하나님에게서 난다고 말하는 것을 금합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תֹּאמַר
  english_pob_choice: Do not say
  chosen_korean: 말하지 마십시오
  alternatives_korean:
  - 말하지 마소서
  - 입 밖에 내지 마십시오
  lexicon: HALOT
  rationale: 히브리어의 직접적인 부정 명령을 표준적인 현대 한국어 명령형으로 옮기되, 합쇼체를 유지해 경구적 경고의 어조를 살렸습니다.
- source_word: מֵאֵל
  english_pob_choice: from God
  chosen_korean: 하나님에게서
  alternatives_korean:
  - 하나님으로부터
  - 하나님 탓으로
  lexicon: HALOT
  rationale: מִן + אֵל은 원인/출처를 가리키므로, 허물의 근원을 하나님께 돌리는 진술을 한국어에서도 분명히 드러내도록 ‘하나님에게서’로 옮겼습니다.
- source_word: פִּשְׁעִי
  english_pob_choice: my transgression
  chosen_korean: 내 허물
  alternatives_korean:
  - 내 죄
  - 내 범죄
  - 내 반역
  lexicon: HALOT
  rationale: פשע의 도덕적 위반과 고의성을 살리면서도, ‘반역’처럼 정치적 뉘앙스로 과도하게 좁히지 않기 위해 ‘허물’을 택했습니다.
- source_word: אֶת אֲשֶׁר שָׂנֵא
  english_pob_choice: what he hates
  chosen_korean: 자기가 미워하는 것
  alternatives_korean:
  - 미워하시는 것
  - 그가 싫어하는 것
  lexicon: HALOT
  rationale: 관계절을 자연스러운 한국어로 풀어 쓰되, 본문이 하나님을 가리키는 것으로 이해되므로 주어를 보충해 의미를 분명히 했습니다.
theological_decisions:
- issue: 죄의 원인을 하나님에게 돌리는 진술의 차단
  chosen_reading: 본문은 내 허물이 하나님에게서 났다고 말하는 태도를 금지합니다.
  alternative_readings:
  - 하나님 때문에 내가 넘어졌다고 말하지 마십시오
  - 주님 때문에 떠나갔다고 말하지 마십시오
  rationale: 히브리어 본문은 허물의 출처를 하나님께 두는 것을 직접 부정합니다. 그리스어 병행문은 ‘주님 때문에 내가 떠났다’는 다른 표현을 보이지만, 본문 번역은 히브리어를 우선하여 원인 전가를 명확히 드러냅니다.
  doctrine_reference: 원문 우선 원칙; 신정론과 인간 책임의 구분
- issue: לֹא עָשָה의 시제 감각
  chosen_reading: ‘하시지 않기 때문입니다’로 현재적 일반 진술처럼 읽히게 했습니다.
  alternative_readings:
  - 하신 일이 없기 때문입니다
  - 하신 적이 없기 때문입니다
  rationale: 히브리어 완료형은 지혜문맥에서 일반적 진리로 들릴 수 있으므로, 한국어에서도 단정적 현재 의미를 살려 자연스럽게 옮겼습니다.
  doctrine_reference: 지혜문학의 격언적 현재
