  source_fidelity: 히브리어 본문의 핵심 의미, 곧 자신의 허물의 근원을 하나님께 돌리지 말라는 금지와 하나님께서 미워하시는 일을 하지 않으신다는 근거를 대체로 충실히 반영합니다. 다만 לֹא עָשָה는 완료형이므로 ‘하시지 않기’보다 ‘하신 일이 없으시기’가 원문의 형태와 논증을 더 잘 드러냅니다.
  naturalness: ‘하나님에게서 났다’도 이해되지만, 현대 표준어의 격식 있는 문체에서는 ‘하나님에게서 비롯되었다’가 출처 귀속을 더 자연스럽고 분명하게 표현합니다. 하나님의 행위를 가리킬 때 ‘자기가 미워하는 것을 하시지’보다 일관된 높임 표현이 더 자연스럽습니다.
  terminology: ‘허물’은 פִּשְׁעִי의 도덕적 잘못과 책임의 뉘앙스를 무리 없이 전달합니다. ‘하나님’과 ‘주님’의 구별은 본문과 그리스어 병행문을 각각 반영하므로 유지할 수 있습니다.
