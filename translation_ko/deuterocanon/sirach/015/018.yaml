  lexicon: HALOT
  rationale: אַמִּיץ와 גְּבוּרוֹת은 힘/권능의 강함을 뜻하며, 그리스어 ἰσχυρὸς ἐν δυναστείᾳ와도 맞물리므로 ‘능력에 강하며’로 간결하게 대응했습니다.
