  lexicon: HALOT
  rationale: חוֹזֶה는 ‘보다/바라보다’이고 כֹל은 포괄성을 더하므로, ‘모든 것을 보십니다’가 문맥과 병행 구문을 가장 자연스럽게 반영합니다.
