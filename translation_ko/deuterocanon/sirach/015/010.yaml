    issue: ‘찬양이 말해지며’라는 표현의 어색함
    rationale: 히브리어의 수동적 ‘말해지다’를 기계적으로 옮긴 표현으로, 현대 표준 한국어에서는 ‘입에서 나오다’가 더 자연스럽게 발화를 나타냅니다.
  - severity: low
    issue: ‘그것을 다스리는 이’의 한국어 의미 불명확성
    rationale: 찬양을 ‘다스린다’는 결합은 한국어에서 부자연스럽고, 원문의 משל이 이 문맥에서 지닌 숙달의 뉘앙스를 충분히 전달하지 못합니다.
  - severity: low
    issue: 각주 표지의 위치
    rationale: 각주는 지혜로운 이 자체가 아니라 그리스어 병행문의 상이한 둘째 행에 관한 것이므로, 절의 끝에 두는 편이 참조 범위를 더 정확히 나타냅니다.
