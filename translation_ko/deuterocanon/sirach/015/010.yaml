revisions:
- from: 지혜로운 이의 입으로는 찬양이 말해지며, 그것을 다스리는 이는 그것을 가르칩니다.[a]
  to: 찬양은 지혜로운 이의 입에서 나오며, 그것을 통달한 이는 그것을 가르칩니다.[a]
  rationale: 본문은 고신뢰 현존 히브리어를 따릅니다. 첫 행은 한국어 관용에 맞게 ‘입에서 나오며’로 다듬되, 지혜로운 이의 입을 통한 찬양이라는 원문의 이미지를 유지했습니다. 둘째 행은 여성 단수 대명사 ‘그것’을 보존하여 선행사가 완전히 명시되지 않은 원문의 여지를 유지하면서, ‘통달한’으로 משל의 숙달 의미를 자연스럽게 옮겼습니다. 그리스어의 상이한 읽기는 절 끝의 각주로 보존했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T19:15:10Z'
review_pass:
  verdict: revise
  source_fidelity: 현존 히브리어를 본문으로 삼고 그리스어의 크게 다른 둘째 행을 각주로 보존한 방향은 적절합니다. 다만 וּמשֵׁל בָּהּ의 문맥상 ‘다스리다’보다 숙달·통달의 의미가 한국어에서 더 자연스럽게 전달됩니다.
  naturalness: ‘찬양이 말해지며’는 한국어에서 다소 부자연스럽습니다. ‘찬양은 … 입에서 나오며’가 발화의 비유를 자연스럽게 살립니다. ‘그것을 통달한 이’는 반복되는 대명사를 유지하면서도 격언체로 자연스럽습니다.
  terminology: ‘찬양’, ‘지혜로운 이’, ‘주’는 적절합니다. ‘통달한’은 משל의 지배/숙달 범위 가운데 이 문맥에서 자연스러운 숙달의 뜻을 표현하며, 특정 교리적 해석을 추가하지 않습니다.
  issues:
