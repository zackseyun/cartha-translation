translation:
  language: ko
  text: 지혜로운 이의 입으로는 찬양이 말해지며, 그것을 다스리는 이는 그것을 가르칩니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 병행문은 “그리고 주께서 그를/그것을 번영하게 하십니다”로 읽어, 남아 있는 히브리어 둘째 행과 상당히 다릅니다.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּפֶה
  english_pob_choice: by the mouth of
  chosen_korean: ~의 입으로는
  alternatives_korean:
  - 입으로
  - 입을 통해
  lexicon: HALOT
  rationale: בְּ + פה는 발화의 도구/매개를 나타내므로, 한국어에서는 자연스럽게 ‘~의 입으로는’으로 옮겨 말의 발화를 강조했습니다.
- source_word: חָכָם
  english_pob_choice: the wise
  chosen_korean: 지혜로운 이
  alternatives_korean:
  - 지혜로운 사람
  - 지혜자
  lexicon: HALOT
  rationale: 히브리어의 단수 일반칭을 한국어에서 남성 고정 없이 대표적 인물로 살리기 위해 ‘지혜로운 이’로 번역했습니다.
- source_word: תְּהִלָּה
  english_pob_choice: praise
  chosen_korean: 찬양
  alternatives_korean:
  - 찬송
  - 칭송
  lexicon: HALOT
  rationale: 히브리어와 그리스어 αἶνος가 가리키는 의미를 반영해 ‘찬양’으로 옮겼고, 명사적 추상성을 유지했습니다.
- source_word: וּמשֵׁל בָּהּ
  english_pob_choice: one who masters it
  chosen_korean: 그것을 다스리는 이
  alternatives_korean:
  - 그것을 주관하는 이
  - 그것을 통달하는 이
  lexicon: HALOT
  rationale: משל의 ‘다스리다/통치하다’라는 동사를 살리되, 문맥상 지배·숙달의 뉘앙스를 함께 담아 ‘다스리는 이’로 옮겼습니다.
- source_word: יִלַמְּדֶנָּה
  english_pob_choice: will teach it
  chosen_korean: 그것을 가르칩니다
  alternatives_korean:
  - 그것을 가르칠 것입니다
  - 그것을 가르칩니다/알려 줍니다
  lexicon: HALOT
  rationale: 지혜 문학의 격언적 현재를 살려 미래형보다 일반 현재로 옮겼으며, ‘가르칩니다’가 가장 자연스럽고 평이합니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행문의 차이
  chosen_reading: 본문은 현존 히브리어를 따라 ‘그것을 다스리는 이는 그것을 가르칩니다’로 두었습니다.
  alternative_readings:
  - 그리스어 병행문의 ‘주께서 그를 번영하게 하십니다/그것을 번영하게 하십니다’
  rationale: 이 절은 히브리어 증거가 고신뢰로 남아 있고, 그리스어는 상당히 다른 계열의 읽기이므로 본문은 히브리어를 우선하고, 중대한 차이는 각주에서 보존하는 것이 적절합니다.
  doctrine_reference: 원문 우선 원칙; 전승 차이를 본문에서 무리하게 조화시키지 않음
