translation:
  language: ko
  text: 사람들 앞에 생명과 죽음이 놓여 있습니다[b][a]. 그가 무엇을 바라든지 그것이 그에게 주어질 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘사람들을 위해’라고도 읽을 수 있습니다. 히브리어 전치사는 그 뜻이 가능하지만, 그리스어 평행문은 ‘~앞에’라는 뜻을 지지합니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘그가 무엇을 선택하든지’라고도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי אָדָם
  english_pob_choice: Before human beings
  chosen_korean: 사람들 앞에
  alternatives_korean:
  - 사람들을 위해
  - 사람들에게
  - 사람들 앞에
  lexicon: HALOT
  rationale: 히브리어 표현은 문자적으로는 ‘사람의 아들들에게/사람들을 위해’이지만, 그리스어 평행문의 ἔναντι ἀνθρώπων이 ‘~앞에’를 강하게 지지하므로, 장면적으로 ‘사람들 앞에’로 옮겨 원문의 대비를 살렸습니다.
- source_word: חַיִּים וָמָוֶת
  english_pob_choice: life and death
  chosen_korean: 생명과 죽음
  alternatives_korean:
  - 삶과 죽음
  - 생명과 사망
  lexicon: HALOT
  rationale: 생명과 죽음의 양자택일을 이루는 히브리어 대구를 자연스럽게 반영하되, 문맥상 대조가 분명한 ‘생명과 죽음’으로 간명하게 옮겼습니다.
- source_word: אֲשֶׁר יַחְפֹּץ
  english_pob_choice: whichever he desires
  chosen_korean: 그가 무엇을 바라든지
  alternatives_korean:
  - 그가 무엇을 선택하든지
  - 그가 무엇을 원하든지
  - 그가 무엇을 기뻐하든지
  lexicon: HALOT
  rationale: חפץ는 원함·즐거움·의지의 범위를 가지며, 영어 POB의 ‘desires’도 선택의 여지를 유지합니다. 한국어에서는 ‘무엇을 바라든지’가 욕구와 의향을 함께 담아 과도한 해석 없이 대응합니다.
- source_word: יִנָּתֵן לוֹ
  english_pob_choice: will be given to him
  chosen_korean: 그에게 주어질 것입니다
  alternatives_korean:
  - 그에게 주어집니다
  - 그에게 허락될 것입니다
  - 그에게 주어질 것입니다
  lexicon: HALOT
  rationale: נתן의 피동형을 그대로 살려 행위자를 덧붙이지 않고, 원문의 수동 구문이 지닌 열린 구조를 유지했습니다.
theological_decisions:
- issue: 사람 앞에 놓인 선택과 수동형 종결의 관계
  chosen_reading: 이 절은 생명과 죽음이 사람들 앞에 놓여 있고, 사람이 무엇을 바라면 그것이 그에게 주어진다고 말할 뿐, 그 선택이 어떻게 하나님의 주권과 연결되는지는 설명하지 않습니다.
  alternative_readings:
  - 강한 자유의지 진술로 읽는 해석
  - 하나님의 직접적 결정권을 더 분명히 드러내는 해석
  rationale: 히브리어와 그리스어 모두 선택의 구도를 제시하지만 신학적 종결을 주지 않으므로, 번역도 그 긴장을 그대로 보존해야 합니다.
  doctrine_reference: DOCTRINE.md §3 Preserve theological tension rather than resolve it
- issue: ‘사람들’과 이어지는 일반적 단수의 처리
  chosen_reading: 첫 구는 집합적 표현으로 ‘사람들’을 쓰고, 뒤의 절은 단수 ‘그가/그에게’를 유지했습니다.
  alternative_readings:
  - 전부 단수 ‘사람’으로 통일
  - 전부 복수형으로 바꾸어 ‘그들이... 그들에게’로 처리
  rationale: 원문은 집합 표현에서 일반적 단수로 전환하므로, 한국어도 그 문법적 전환을 살려 개인의 선택을 강조하되 보편성을 유지했습니다.
  doctrine_reference: DOCTRINE.md §4 Gender-accurate over gender-neutral
