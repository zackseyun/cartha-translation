  text: Before human beings are life and death[b][a], and whichever he chooses will be given to him.
  footnotes:
  - marker: a
    text: Or, 'For human beings are life and death'; the Hebrew preposition can be read that way, but the Greek parallel supports the sense 'before human beings.'
