base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/015/001.yaml
  text: He who fears Yahweh will do this[b][a], and he who grasps the law will attain her.
  footnotes:
  - marker: a
    text: Hebrew תּוֹרָה can also be rendered 'Torah' or more broadly 'instruction.'
    reason: lexical_alternative
  - marker: b
    text: The final verb is difficult in the extant Hebrew; the Greek parallel reads 'will attain her,' supporting the sense that the one who holds fast to the law comes to Wisdom.
    reason: textual_variant
translation:
  language: ko
  text: 주님을 경외하는 사람은 이것을 행할 것입니다. 율법을 붙드는 사람은 그녀를 얻게 될 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 תּוֹרָה는 ‘율법’ 외에도 ‘토라’, 더 넓게는 ‘가르침’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 전승된 히브리어의 마지막 동사는 문자적으로 ‘그녀를 인도할 것이다’로 읽힐 수 있으나 문맥상 난해합니다. 헬라어 병행본문은 ‘그녀를 얻게 될 것이다’라고 읽으며, 여기서 ‘그녀’는 의인화된 지혜를 가리킵니다.
    reason: textual_variant
lexical_decisions:
- source_word: יְרֵא יְהֹוָה
  english_pob_choice: he who fears Yahweh
  chosen_korean: 주님을 경외하는 사람
  alternatives_korean:
  - 야훼를 두려워하는 사람
  - 주님을 두려워하는 자
  lexicon: HALOT
  rationale: 히브리어 פעול사 용법의 ‘경외하는 사람’을 한국어로 자연스럽게 풀되, POB의 야훼 관행 대신 본문 내 인용형인 주님을 사용해 유대 지혜문맥의 경건한 경외를 살렸습니다.
- source_word: יַעֲשֶׂה זֹאת
  english_pob_choice: will do this
  chosen_korean: 이렇게 할 것입니다
  alternatives_korean:
  - 이것을 행할 것입니다
  - 그렇게 할 것입니다
  lexicon: HALOT
  rationale: 지시대명사 ‘this’의 전후 문맥상 지혜의 길을 가리키므로, 한국어에서는 자연스러운 지시 부사구로 옮겨 원문의 지시성을 유지했습니다.
- source_word: תּוֹרָה
  english_pob_choice: the law
  chosen_korean: 율법
  alternatives_korean:
  - 토라
  - 가르침
  lexicon: HALOT
  rationale: 히브리어 תּוֹרָה는 여기서 단순한 일반법보다 언약적 규범을 가리키므로, 프로젝트 기본값에 따라 ‘율법’으로 번역했습니다.
- source_word: יַדְרִיכֶנָּה
  english_pob_choice: will attain her
  chosen_korean: 그녀를 얻게 될 것입니다
  alternatives_korean:
  - 그녀에게 이르게 될 것입니다
  - 그녀를 얻을 것입니다
  - 그녀와 만나게 될 것입니다
  lexicon: HALOT
  rationale: 전승된 히브리어는 다소 난해하지만, 헬라어 병행본문의 καταλήμψεται αὐτήν이 ‘붙잡다/획득하다’의 뜻을 뒷받침하므로, 지혜를 여성 인칭으로 유지한 채 ‘얻게 될 것입니다’로 옮겼습니다.
theological_decisions:
- issue: 문장 끝 여성 대명사 ‘그녀’의 지시 대상
  chosen_reading: 그녀는 전 문맥의 의인화된 지혜를 가리킵니다.
  alternative_readings:
  - 율법 준수의 결과를 추상적으로 가리킨다고 볼 수 있습니다.
  - 난해한 히브리어만 따르면 ‘인도받다’의 의미로 완화할 수 있습니다.
  rationale: 집회서 14:20–15:10의 흐름에서 지혜는 여인으로 의인화되며, 헬라어 평행본문도 여성 목적어를 보존하므로, 신학적 인격화를 흐리지 않고 ‘그녀’로 유지했습니다.
  doctrine_reference: 문학적·신학적 의인화를 보존하고 난해한 본문은 병행본문으로 조명한다는 원칙
