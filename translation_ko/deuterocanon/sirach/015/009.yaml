base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/015/009.yaml
  text: Praise is not fitting in the mouth of a wicked man[a], for it has not been allotted to him by God.
  footnotes:
  - marker: a
    text: 'Greek: ''for it was not sent from the Lord.'' The Hebrew reads, more literally, ''for it has not been allotted to him from God.'''
    reason: alternative_reading
translation:
  language: ko
  text: 악인의 입에는 찬양이 어울리지 않습니다. 찬양은 하나님께서 그에게 나누어 주신 몫이 아니기 때문입니다[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 “이는 주님에게서 보내심을 받지 않았기 때문이다”로 읽습니다. 히브리어는 더 문자적으로 “이는 하나님에게서 그에게 나누어지지 않았기 때문이다”입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: לֹא נָאֲתָה / Οὐχ ὡραῖος
  english_pob_choice: is not fitting
  chosen_korean: 어울리지 않습니다
  alternatives_korean:
  - 합당하지 않습니다
  - 마땅하지 않습니다
  - 어울리지는 않습니다
  lexicon: HALOT
  rationale: 히브리어와 그리스어가 모두 ‘아름답다’보다 ‘어울리다/합당하다’의 적절성 판단을 가리키므로, 현대 한국어에서는 ‘어울리지 않습니다’가 자연스럽고 문맥의 규범성을 잘 드러냅니다.
- source_word: תְהִלָּה
  english_pob_choice: Praise
  chosen_korean: 찬양
  alternatives_korean:
  - 칭찬
  - 찬송
  - 찬미
  lexicon: HALOT
  rationale: 문맥상 입으로 드리는 하나님을 향한 찬양을 가리키므로, 한국어에서 가장 직접적인 표준어는 ‘찬양’입니다. ‘칭찬’은 사람에 대한 commendation으로 오해될 수 있습니다.
- source_word: רָשָׂע
  english_pob_choice: wicked man
  chosen_korean: 악인
  alternatives_korean:
  - 악한 사람
  - 악한 자
  - 죄인
  lexicon: HALOT
  rationale: 히브리어는 남성 단수이지만, 한국어에서는 성별 표지를 강하게 드러내는 ‘악한 사람’보다 성서 문맥의 고정된 도덕 범주인 ‘악인’이 더 간결하고 정확합니다.
- source_word: נֶחְלְקָה לּוֹ / מֵאֵל
  english_pob_choice: it has not been allotted to him by God
  chosen_korean: 그에게 나누어 주신 몫이 아니기 때문입니다
  alternatives_korean:
  - 그에게 분배된 것이 아니기 때문입니다
  - 하나님께서 그에게 맡기신 것이 아니기 때문입니다
  - 하나님께서 그에게 배정하신 몫이 아니기 때문입니다
  lexicon: HALOT
  rationale: 히브리어의 ‘나누다/할당하다’ 의미를 살려 ‘몫’으로 옮기면, 찬양이 그에게 속하지 않은 배분된 몫이라는 뜻이 살아납니다. ‘from God’는 한국어 관용상 원인·주체를 모두 담는 ‘하나님께서…’로 처리했습니다.
theological_decisions:
- issue: 히브리어와 그리스어의 둘째 절 차이
  chosen_reading: 본문은 히브리어의 ‘하나님께서 그에게 나누어 주신 몫이 아니다’를 따르고, 그리스어의 ‘주께로부터 보내심을 받지 않았다’는 대안 읽기로 처리합니다.
  alternative_readings:
  - 그에게 주께로부터 보내심을 받지 않았기 때문입니다
  rationale: 이 절은 살아 있는 히브리어 본문이 명확하므로 그 의미를 본문에 반영하되, LXX의 다른 개념화는 각주로 남겨 두는 것이 가장 투명합니다.
  doctrine_reference: Sirach 원문 우선 원칙; 병행 그리스어는 대조 자료로 보존
