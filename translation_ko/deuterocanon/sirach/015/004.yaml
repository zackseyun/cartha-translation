base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/015/004.yaml
  text: He will lean on her and not be shaken[c][b][a]; he will trust in her and not be put to shame.
  footnotes:
  - marker: a
    text: That is, Wisdom, personified as a woman in the surrounding context.
    reason: cross_reference
  - marker: b
    text: Or 'and not totter' / 'and not be moved.'
    reason: lexical_alternative
  - marker: c
    text: Or 'and not be ashamed'; the phrase can also carry the sense 'and not be disappointed' when trust proves well placed.
    reason: lexical_alternative
translation:
  language: ko
  text: 그녀[a]에게 기대면 흔들리지 않고[b], 그녀를 신뢰하면 수치를 당하지 않습니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 즉, 앞선 문맥에서 여성으로 의인화된 지혜를 가리킵니다.
    reason: cross_reference
  - marker: b
    text: 또는 ‘기울지 않고’ / ‘무너지지 않고’의 뜻입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘부끄러워하지 않고’; 믿음이 잘못되지 않을 때에는 ‘실망하지 않고’의 뜻도 될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִשְׁעַן עָלֶיהָ
  english_pob_choice: he will lean on her
  chosen_korean: 그녀에게 기대면
  alternatives_korean:
  - 그녀 위에 기대면
  - 그녀를 의지하면
  lexicon: HALOT
  rationale: שׁען의 핵심 이미지는 ‘기대다’이며, עָלֶיהָ가 붙어 물리적으로 받침을 얻는 장면을 살립니다. ‘의지하다’도 가능하지만, 본문은 지혜를 붙들고 서는 구체적 비유가 더 강합니다.
- source_word: וְלֹא יִמּוֹט
  english_pob_choice: and not be shaken
  chosen_korean: 흔들리지 않고
  alternatives_korean:
  - 비틀리지 않고
  - 무너지지 않고
  - 기울어지지 않고
  lexicon: HALOT
  rationale: מוֹט는 ‘흔들리다/기울다/무너지다’의 안정성 상실을 가리키므로, 현대 한국어에서는 가장 자연스러운 ‘흔들리지 않고’로 옮겼습니다.
- source_word: וּבָהּ יִבְטַח
  english_pob_choice: he will trust in her
  chosen_korean: 그녀를 신뢰하면
  alternatives_korean:
  - 그녀를 믿으면
  - 그녀에게 의지하면
  - 그녀 안에 신뢰를 두면
  lexicon: HALOT
  rationale: בטח는 단순한 지적 동의보다 ‘신뢰를 두다/믿다’의 의미가 강하므로, 앞절의 ‘기대다’와 구분되면서도 자연스러운 동사구로 처리했습니다.
- source_word: וְלֹא יֵבוֹשׁ
  english_pob_choice: and not be put to shame
  chosen_korean: 부끄러움을 당하지 않습니다
  alternatives_korean:
  - 수치를 당하지 않습니다
  - 부끄럽지 않을 것입니다
  - 실망하지 않을 것입니다
  lexicon: HALOT
  rationale: בוש는 명예 손상과 공개적 수치를 뜻할 수 있어, ‘부끄러움을 당하다’가 문맥의 사회적/관계적 뉘앙스를 잘 담습니다. ‘실망하다’는 가능하지만 1차 의미를 약화합니다.
theological_decisions:
- issue: 지혜의 여성 인격화된 지시 대상
  chosen_reading: 여성 대명사를 그대로 살려 ‘그녀’로 번역했습니다.
  alternative_readings:
  - 무생물처럼 ‘그것’으로 옮김
  rationale: 본문은 지혜를 여성으로 인격화하는 문맥이며, 히브리어의 여성형을 한국어에서도 보존해야 본문의 문학적·신학적 이미지를 유지할 수 있습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
