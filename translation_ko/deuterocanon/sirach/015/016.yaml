  source_fidelity: 첫 절은 히브리어의 이례적인 מוּצָק을 문맥과 그리스어 병행본문에 따라 ‘놓여 있습니다’로 처리하여 적절합니다. 그러나 둘째 절의 ‘당신이 원하시는 것을, 거기에’는 선행하는 두 선택지와의 문법적 연결이 부자연스럽습니다. בַּאֲשֶׁר תַּחְפֹּץ는 불과 물 가운데 원하는 것을 가리키므로 ‘원하시는 쪽으로’가 이를 자연스럽고 충실하게 나타냅니다.
  naturalness: 현대 표준어 합쇼체로 첫 문장은 자연스럽습니다. 둘째 문장은 목적어 ‘것을’ 뒤에 쉼표를 두고 장소 지시어 ‘거기에’를 잇는 현행 구성이 비문에 가깝습니다. ‘원하시는 쪽으로 손을 뻗으십시오’로 고치면 자연스럽습니다.
  terminology: ‘불과 물’, ‘앞에 놓여 있습니다’, ‘손을 뻗으십시오’는 원문의 구체적 비유와 명령을 보존하며 신학적 해석을 덧붙이지 않습니다. ‘당신’은 이 문맥에서 허용되는 존대 호칭입니다.
  issues:
