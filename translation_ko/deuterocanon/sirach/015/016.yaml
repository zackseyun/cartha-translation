translation:
  language: ko
  text: 불과 물이 당신 앞에 놓여 있습니다. 당신이 원하시는 것을, 거기에 손을 뻗으십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 시작 부분의 형태가 이례적이지만, 그리스어 병행본문과 문맥이 ‘당신 앞에 놓여 있습니다’라는 뜻을 지지합니다.
    reason: textual_variant
lexical_decisions:
- source_word: מוּצָק / παρέθηκέν σοι
  english_pob_choice: are set before you
  chosen_korean: 당신 앞에 놓여 있습니다
  alternatives_korean:
  - 당신 앞에 세워져 있습니다
  - 당신 앞에 마련되어 있습니다
  - 당신 앞에 놓였습니다
  lexicon: HALOT; LXX παρέθηκεν
  rationale: 히브리어 본문은 이례적 형태이지만 ‘앞에 제시하다/놓다’라는 뜻을 주며, 그리스어 병행본문도 같은 의미를 분명히 합니다. 한국어에서는 자연스럽게 ‘앞에 놓여 있습니다’로 옮겨, 선택지가 눈앞에 제시된 장면을 살렸습니다.
- source_word: אֵשׁ וָמָיִם
  english_pob_choice: Fire and water
  chosen_korean: 불과 물
  alternatives_korean:
  - 불과 물의
  lexicon: HALOT
  rationale: 히브리어와 그리스어의 구체적인 대조쌍을 그대로 살려, 상징화하지 않고 문자적으로 옮겼습니다.
- source_word: בַּאֲשֶׁר תַּחְפֹּץ
  english_pob_choice: whichever you choose
  chosen_korean: 당신이 원하시는 것을
  alternatives_korean:
  - 당신이 선택하시는 것을
  - 당신이 바라시는 것을
  - 원하시는 쪽을
  lexicon: HALOT
  rationale: חפץ는 ‘원하다/기뻐하다’의 뜻이 기본이므로, 본문이 요구하는 의지적 선택을 드러내되 과도한 해석을 피해서 ‘원하시는 것을’로 옮겼습니다. ‘choose’보다 원문 의미에 더 가깝고, 앞절의 선택 상황과도 잘 맞습니다.
- source_word: שְׁלַח יָדֶיךָ
  english_pob_choice: stretch out your hand to it
  chosen_korean: 거기에 손을 뻗으십시오
  alternatives_korean:
  - 그것에 손을 내미십시오
  - 손을 뻗으십시오
  lexicon: HALOT
  rationale: 관용구는 손을 목표물 쪽으로 내미는 행위를 뜻하므로, 한국어에서는 자연스럽고 직접적인 명령형으로 옮겼습니다. 문맥상 대상을 이미 제시하고 있으므로 ‘거기에’로 보완해 의미를 분명히 했습니다.
theological_decisions:
- issue: 인간의 도덕적 선택과 책임을 어떻게 드러낼지
  chosen_reading: 본문을 선택지의 실제 제시로 읽고, 인간이 응답해야 하는 책임을 분명히 드러냈습니다.
  alternative_readings:
  - 더 약하게 처리해 단순한 비유처럼 읽는 해석
  - 결정론적으로 의지의 강도를 낮추는 해석
  rationale: 히브리어와 그리스어 모두 불과 물이라는 대조된 선택지를 앞에 두고, 그 중 하나를 향해 손을 뻗으라고 말합니다. 번역은 이 긴장을 약화하지 않고 그대로 보존해야 합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 3
