base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/015/014.yaml
  text: God[a], from the beginning, created man, and placed him in the hand of his own violence[b]; he gave him over to the hand of his own inclination.
  footnotes:
  - marker: a
    text: 'Greek: ''and he left him in the hand of his own counsel.'' The Hebrew first clause after ''created man'' is textually difficult; the Greek supports the broader sense of human self-direction.'
    reason: alternative_reading
  - marker: b
    text: Or 'humankind.' Hebrew אדם is singular but can represent humanity collectively.
    reason: lexical_alternative
translation:
  language: ko
  text: 하나님께서는 처음부터 사람을 창조하셨고, 그를 자기의 폭력의 손에 두셨으며, 자기의 성향의 손에 넘겨주셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 난해한 어구는 문자적으로 ‘그의 폭력/획득’ 계열로도 이해되지만, 본문은 인간의 내적 방향성과 책임을 드러내는 쪽으로 읽을 수 있습니다.
    reason: source_note
lexical_decisions:
- source_word: אֱלֹהִים
  english_pob_choice: God
  chosen_korean: 하나님께서는
  alternatives_korean:
  - 하나님이
  - 하느님께서는
  lexicon: 표준 번역 관례
  rationale: 히브리어 המקור의 명시적 주어를 살려 ‘하나님’으로 옮기고, 문장 서두의 주어 표지를 분명히 했습니다.
- source_word: מִבְּרֵאשִׁית
  english_pob_choice: from the beginning
  chosen_korean: 처음부터
  alternatives_korean:
  - 태초부터
  - 처음에
  lexicon: HALOT
  rationale: מִן + רֵאשִׁית의 시간적 의미를 자연스러운 한국어로 살리되, 본문의 시작점 강조를 유지했습니다.
- source_word: בָּרָא
  english_pob_choice: created
  chosen_korean: 창조하셨고
  alternatives_korean:
  - 만드셨고
  - 지으셨고
  lexicon: HALOT
  rationale: 하나님을 주어로 한 ברא의 창조 행위를 직접적으로 드러내기 위해 ‘창조하다’를 선택했습니다.
- source_word: חוֹתְפוֹ
  english_pob_choice: his own violence
  chosen_korean: 자기의 폭력의 손
  alternatives_korean:
  - 자기의 힘의 손
  - 자기의 충동의 손
  - 자기의 폭력
  lexicon: HALOT
  rationale: 히브리어는 난해하지만, POB의 최종 본문이 채택한 ‘violence’를 따라 손의 비유를 유지해 거칠고 위험한 지시를 보존했습니다.
- source_word: יִצְרוֹ
  english_pob_choice: his own inclination
  chosen_korean: 자기의 성향의 손
  alternatives_korean:
  - 자기의 기질의 손
  - 자기의 성향
  - 자기의 충동의 손
  lexicon: HALOT
  rationale: יצר의 지혜문학적 의미를 ‘성향’으로 옮겨, 인간 내면의 방향성을 드러내면서도 윤리적 판단을 과도하게 덧씌우지 않았습니다.
- source_word: בְּיַד / וַיִּתְּנֵהוּ
  english_pob_choice: placed him / gave him over
  chosen_korean: 그를 ... 손에 두셨으며, ... 손에 넘겨주셨습니다
  alternatives_korean:
  - 그를 ... 손에 놓으셨으며, ... 손에 맡기셨습니다
  - 그를 ... 손에 두셨고, ... 손에 넘기셨습니다
  lexicon: HALOT
  rationale: ‘손에’라는 히브리어 관용을 보존하면서, 첫 동사는 ‘두다’, 둘째 동사는 ‘넘겨주다’로 구분해 맡김과 이전의 차이를 살렸습니다.
theological_decisions:
- issue: 인간의 자기 방향성과 폭력/성향의 긴장
  chosen_reading: 본문은 하나님이 창조주이심을 분명히 하면서도, 인간이 자신의 내적 방향성 안에 놓인 상태를 말하는 것으로 번역했습니다.
  alternative_readings:
  - 하나님께서 인간을 자기 뜻대로 완전히 자율하게 두셨다
  - 하나님께서 인간을 악한 충동에 넘기셨다
  rationale: 히브리어와 그리스어 전승이 모두 인간의 자기사용/자기지향을 암시하지만 세부 뉘앙스는 난해하므로, 절의 긴장을 풀지 않고 그대로 드러냈습니다.
  doctrine_reference: 창조주 하나님과 인간 책임의 긴장을 보존
