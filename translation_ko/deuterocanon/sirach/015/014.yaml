  source_fidelity: 히브리어는 하나님이 처음부터 אדם을 창조하셨다고 한 뒤, 그를 ‘그 자신의’ חוֹתְפוֹ 및 יֵצֶר의 손/권세 아래 둔다는 두 표현을 제시합니다. חוֹתְפוֹ는 난해하므로 ‘폭력’이라는 본문 선택을 유지하되, 한국어에서 소유자가 하나님으로 오해되지 않도록 ‘그 자신의’으로 명시해야 합니다. 그리스어는 이 난해한 전개 대신 ‘그 자신의 숙고/판단의 손에 그를 남겨 두셨다’고 읽으므로 각주에 제시하는 것이 적절합니다.
  naturalness: 초안의 ‘자기의 폭력의 손’과 ‘자기의 성향의 손’은 한국어에서 매우 부자연스러울 뿐 아니라 ‘자기’가 문장 주어인 하나님을 가리키는 것으로 읽힐 수 있습니다. ‘그 자신의 … 지배 아래’는 ביד의 권세·통제 관용을 자연스럽게 옮기며, 지시 대상을 분명히 합니다.
  terminology: ‘하나님’, ‘처음부터’, ‘창조하셨고’, ‘성향’은 현대 표준어 합쇼체와 본문의 용어에 대체로 적절합니다. 난해한 חוֹתְפוֹ를 확정적으로 내적 충동이나 도덕적 악으로 해석하지 않고 ‘폭력’으로 유지하되, 그 불확실성과 그리스어 이문을 각주로 밝혀야 합니다.
