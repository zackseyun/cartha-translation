  chosen_korean: 계명을 지키게 될 것입니다
  alternatives_korean:
  - 그 계명을 지키실 것입니다
  - 계명들을 지키게 될 것입니다
  - 명령을 지키게 될 것입니다
  lexicon: HALOT
  rationale: 히브리어 단수 ‘계명’을 반영하되, 한국어에서는 단수 관사를 자연스럽게 풀어 표현했습니다.
- source_word: וְתָבִינָה לַעֲשׂוֹת רְצוֹנוֹ
  english_pob_choice: to act faithfully is a matter of your good pleasure
  chosen_korean: 그분의 뜻을 행하는 일은 당신의 기쁨 안에 있습니다
  alternatives_korean:
  - 그분의 뜻을 행하는 것은 당신의 뜻에 달려 있습니다
  - 그분의 뜻을 행하는 일은 당신이 기뻐하는 바입니다
  - 충실하게 행하는 것은 당신의 기쁨에 달려 있습니다
  lexicon: HALOT
  rationale: 본문의 난해한 중간 절은 히브리어와 그리스어 병행을 함께 고려해, ‘뜻/기쁨’의 긴장을 살리면서도 과도한 해석을 피하는 방식으로 옮겼습니다.
- source_word: אִם תַּאֲמִין בּוֹ
  english_pob_choice: If you trust in him
  chosen_korean: 그분을 신뢰하면
  alternatives_korean:
  - 그분을 믿으면
  - 그분 안에 믿음을 두면
  - 그분을 믿고 의지하면
  lexicon: HALOT
  rationale: אמן + ב의 관계적 신뢰를 현대 한국어에서 가장 직접적으로 드러내기 위해 ‘신뢰하다’를 택했습니다.
- source_word: תִּחְיֶה
  english_pob_choice: you too will live
  chosen_korean: 당신도 살 것입니다
  alternatives_korean:
  - 당신도 생명을 얻을 것입니다
  - 당신도 살아 있을 것입니다
  - 당신도 살게 될 것입니다
  lexicon: HALOT
  rationale: 동사의 기본 의미를 간결하게 살리면서 גַּם אַתָּה의 포함성을 ‘도’로 반영했습니다.
theological_decisions:
- issue: 히브리어 중간 절의 난해성과 그리스어 병행의 반영
  chosen_reading: 본문은 히브리어를 기본으로 두되, 그리스어 병행이 시사하는 ‘충실히 행함/기쁨’의 의미를 반영해 ‘그분의 뜻을 행하는 일은 당신의 기쁨 안에 있습니다’로 옮겼습니다.
  alternative_readings:
  - 그분의 뜻을 행하는 것이 당신의 선한 뜻에 달려 있습니다
  - 충실하게 행하는 것은 당신의 기쁨입니다
  - 그분의 뜻을 행하고 충실함을 이루는 것은 기쁨의 문제입니다
  rationale: 서로 다른 전승이 있는 난구를 단정적으로 평탄화하지 않고, 본문이 실제로 전달하는 책임성과 의지의 긴장을 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Preserve theological tension rather than resolve it.'
