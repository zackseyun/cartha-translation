base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/015/015.yaml
  text: If you desire[a], you will keep the commandment, and to act faithfully is a matter of your good pleasure. If you trust in him[c][b], you too will live.
  footnotes:
  - marker: a
    text: Hebrew has singular 'commandment'; the Greek parallel reads plural 'commandments.'
    reason: textual_variant
  - marker: b
    text: The middle clause is difficult in the Hebrew. The Greek parallel reads, 'and to produce faith is of good pleasure,' reflecting either a different Vorlage or an interpretive rendering.
    reason: alternative_reading
  - marker: c
    text: Or 'If you believe in him, you too will live.'
    reason: lexical_alternative
translation:
  language: ko
  text: 원하신다면 계명을 지키실 것입니다.[a] 또 그분의 뜻을 행하는 것이 분별입니다.[b] 그분을 신뢰하시면 당신도 살 것입니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘계명’ 단수형이지만, 그리스어 병행 본문은 복수형 ‘계명들’을 읽습니다.
    reason: textual_variant
  - marker: b
    text: 이 절의 히브리어는 난해합니다. 그리스어 병행 본문은 ‘믿음’ 또는 ‘충실함을 행하는 것’과 ‘기쁨/선한 뜻’을 읽으며, 다른 원문 전승이나 해석적 번역을 반영할 수 있습니다.
    reason: alternative_reading
  - marker: c
    text: 또는 ‘그분을 믿으시면’이라고 옮길 수 있습니다.
    reason: lexical_alternative
