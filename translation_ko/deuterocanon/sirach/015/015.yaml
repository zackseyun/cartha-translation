  source_fidelity: 첫 절과 마지막 절은 대체로 히브리어를 충실히 반영합니다. 그러나 난해한 중간 절에서 초안의 ‘당신의 기쁨 안에 있습니다’는 히브리어의 ‘그분의 뜻을 행하다’와 연결되는 분별/이해의 표현을 충분히 반영하지 못하며, 한국어로도 직역투입니다. 히브리어를 본문 우선으로 따르면 이 절은 ‘그분의 뜻을 행하는 것이 분별입니다’처럼 옮기는 것이 안전합니다. 그리스어 병행의 상이한 읽기는 각주로 남깁니다.
  naturalness: ‘원하시면’, ‘계명을 지키실 것입니다’, ‘그분을 신뢰하시면 당신도 살 것입니다’는 현대 표준 한국어 합쇼체로 자연스럽습니다. ‘기쁨 안에 있습니다’는 현대 한국어의 자연스러운 서술이 아니므로 고쳐야 합니다. 또한 각주 표지는 해당 어구 바로 뒤에 두는 편이 독자에게 명확합니다.
  terminology: ‘계명’, ‘그분의 뜻’, ‘신뢰하다’, ‘살다’는 문맥과 성서 한국어의 현대적 격식체에 적절합니다. 중간 절의 תבינה는 난해하지만 히브리어의 분별/이해 계열을 본문에서 보존하고, 그리스어의 ‘믿음(충실함)을 행함’ 계열은 대안 읽기로 각주 처리하는 것이 텍스트 비평상 더 적절합니다.
