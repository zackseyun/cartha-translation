base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/015/015.yaml
  text: If you desire[a], you will keep the commandment, and to act faithfully is a matter of your good pleasure. If you trust in him[c][b], you too will live.
  footnotes:
  - marker: a
    text: Hebrew has singular 'commandment'; the Greek parallel reads plural 'commandments.'
    reason: textual_variant
  - marker: b
    text: The middle clause is difficult in the Hebrew. The Greek parallel reads, 'and to produce faith is of good pleasure,' reflecting either a different Vorlage or an interpretive rendering.
    reason: alternative_reading
  - marker: c
    text: Or 'If you believe in him, you too will live.'
    reason: lexical_alternative
translation:
  language: ko
  text: 원하시면 계명을 지키게 될 것입니다. 그리고 그분의 뜻을 행하는 일은 당신의 기쁨 안에 있습니다. 그분을 신뢰하면 당신도 살 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘계명’ 단수형이지만, 그리스어 병행은 복수형 ‘계명들’을 읽습니다.
    reason: textual_variant
  - marker: b
    text: 중간 절은 난해하며, 그리스어 병행은 ‘믿음을 행함’ 또는 그와 유사한 해석을 시사합니다.
    reason: alternative_reading
  - marker: c
    text: 또는 ‘그분을 믿으면’이라고 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם תַּחְפֹּץ
  english_pob_choice: If you desire
  chosen_korean: 원하시면
  alternatives_korean:
