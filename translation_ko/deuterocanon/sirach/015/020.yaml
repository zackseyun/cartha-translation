  verdict: revise
  source_fidelity: 히브리어 본문은 첫 절에서 하나님이 사람에게 죄를 짓도록 명령하지 않으셨다고 말하지만, 둘째 절은 ‘아무에게도 죄를 짓는 것을 허락하지 않으셨다’가 아니라 ‘거짓의 사람들’을 강하게 하거나 지지하지 않으셨다는 뜻입니다. 그리스어 병행 본문은 둘째 절을 ‘아무에게도 죄짓는 것을 허락하지 않으셨다’로 읽으므로, 영어 POB는 그 읽기를 따릅니다. 표제 히브리어 본문을 우선할 경우 현 번역은 둘째 절을 바꾸어야 합니다.
  naturalness: 현 문장은 ‘사람은’이 동사의 주어가 되어, 원문의 문맥상 주어인 하나님을 사람으로 바꾸는 문제가 있습니다. ‘그분은’은 앞 문맥의 하나님을 자연스럽게 가리키며 합쇼체 문체에 맞습니다. ‘강하게 해 주지 않으셨습니다’는 다소 직역적이지만, 불확실하거나 논쟁적인 동사를 ‘허락하다’로 단정하지 않고 히브리어의 표현을 보존합니다.
  terminology: לַחֲטֹא는 ‘죄를 짓다’로 적절합니다. אַנְשֵׁי כָזָב는 ‘거짓된 자들’로 옮깁니다. הֶחֱלִים은 그리스어의 ‘허락하다’와 달리 히브리어에서는 ‘강하게 하다/지지하다’ 계열로 이해되므로, 본문에는 ‘강하게 해 주다’를 쓰고 각주에서 그리스어 병행 읽기를 밝혀야 합니다.
