  text: He did not command anyone to be ungodly, and he did not permit anyone to sin.
translation:
  language: ko
  text: 그분은 사람에게 죄를 짓도록 명령하지 않으셨고, 거짓된 자들을 강하게 해 주지 않으셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘거짓된 자들을 강하게 하다/지지하다’라는 뜻입니다. 그리스어 본문은 둘째 절을 ‘아무에게도 죄를 짓는 것을 허락하지 않으셨다’로 읽으며, 영어 POB는 그 읽기를 따릅니다.
    reason: source_note
lexical_decisions:
- source_word: לֹא צִוָּה אֱנוֹשׁ לַחֲטֹא
  english_pob_choice: He did not command anyone to be ungodly / to sin
  chosen_korean: “아무에게도 죄를 짓도록 명령하지 않았습니다”
  alternatives_korean:
  - 아무에게도 불경건하게 하라고 명령하지 않았습니다
  - 아무에게도 죄를 짓게 명령하지 않았습니다
  lexicon: צוה
  rationale: 히브리어의 핵심은 ‘죄를 짓다’(לַחֲטֹא)이며, 영어 POB의 최신 본문도 이를 ‘permit anyone to sin’과 짝지어 도덕적 행동을 분명히 합니다. ‘죄를 짓도록 명령하다’는 문장 구조를 살려 직접적 의미를 전달했습니다.
- source_word: הֶחֱלִים
  english_pob_choice: permit
  chosen_korean: “허락하지 않았습니다”
  alternatives_korean:
  - 허용하지 않았습니다
  - 용인하지 않았습니다
  lexicon: חלה/חיל
  rationale: 본문의 둘째 절은 ‘허락/허용하다’의 금지로 이해하는 것이 영어 POB의 최종 결정과 일치합니다. 한국어에서는 현대 표준어로 가장 자연스러운 ‘허락하지 않았습니다’를 택했습니다.
- source_word: אֱנוֹשׁ
  english_pob_choice: anyone / man
  chosen_korean: “사람은”
  alternatives_korean:
  - 사람은 아무도
  - 인간은
  lexicon: אנוש
  rationale: אנושׁ는 일반적인 ‘인간/사람’의 총칭이므로, 문맥상 보편성을 살려 ‘사람은’으로 옮겼습니다. 이는 특정 남성 개인이 아니라 인류 일반을 가리키는 표현입니다.
- source_word: צִוָּה / הֶחֱלִים의 병렬
  english_pob_choice: command / permit
  chosen_korean: 명령하지 않았고 … 허락하지 않았습니다
  alternatives_korean:
  - 지시하지 않았고 … 허용하지 않았습니다
  - 명하지 않았고 … 용인하지 않았습니다
  lexicon: 병렬 동사 구조
  rationale: 히브리어의 부정 병렬은 두 동사의 책임/허가 차원을 함께 막습니다. 한국어도 두 절을 대등하게 배치해 원문의 균형을 유지했습니다.
theological_decisions:
- issue: 지혜문학의 일반 진술을 어떻게 번역할지
  chosen_reading: 하나님이 인간을 죄로 부추기거나 죄를 허락하시는 분이 아니라는 일반적 진술로 읽었습니다.
  alternative_readings:
  - 인간의 도덕 책임을 강조하는 교훈적 경구로만 읽기
  - 더 약하게 ‘나쁜 일을 시키지 않았다’로 완화하기
  rationale: 전후 문맥이 하나님의 공의와 인간 책임을 다루는 지혜문학이므로, 본문이 전달하는 신학적 긴장을 약화시키지 않고 직접적으로 옮겼습니다.
  doctrine_reference: 지혜문학의 인간 책임과 하나님의 거룩하심
