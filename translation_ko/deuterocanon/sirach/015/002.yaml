translation:
  language: ko
  text: 그녀는 어머니처럼 그를 맞이하고, 그의 젊은 시절의 아내처럼 그를 받아들일 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '그리스어: ‘처녀의 여자’ 곧 젊은 신부 또는 순결한 아내라는 뜻입니다.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְקִדְּמַתְהוּ
  english_pob_choice: will meet him
  chosen_korean: 그를 맞이하고
  alternatives_korean:
  - 그를 만나고
  - 그에게 먼저 다가가고
  - 그를 맞으러 가고
  lexicon: HALOT
  rationale: קדם의 ‘마주 가다/맞이하다’라는 능동적 뉘앙스를 살려, 하나님의 지혜가 먼저 다가가는 이미지를 한국어로 자연스럽게 옮겼습니다.
- source_word: כָאֵם
  english_pob_choice: like a mother
  chosen_korean: 어머니처럼
  alternatives_korean:
  - 어머니같이
  - 한 어머니처럼
  lexicon: HALOT
  rationale: 직접적인 비교 표현이므로, 시적이고도 분명한 ‘어머니처럼’으로 옮겼습니다.
- source_word: וּכְאֵשֶׁת נְעוּרִים
  english_pob_choice: like a wife of his youth
  chosen_korean: 그의 젊은 시절의 아내처럼
  alternatives_korean:
  - 젊은 시절의 아내처럼
  - 젊은 아내처럼
  - 그의 청춘의 아내처럼
  lexicon: HALOT
  rationale: 히브리어 관용구 אֵשֶׁת נְעוּרִים를 직역하기보다, 한국어에서 이해되는 ‘젊은 시절의 아내’로 옮겨 원문의 친밀함과 청춘의 정서를 살렸습니다.
- source_word: תְּקַבְּלֶנּוּ
  english_pob_choice: receive him
  chosen_korean: 그를 받아들일 것입니다
  alternatives_korean:
  - 그를 받아줄 것입니다
  - 그를 맞아들일 것입니다
  - 그를 영접할 것입니다
  lexicon: HALOT
  rationale: קבל의 기본 의미인 ‘받다/받아들이다’를 반영하되, 시적 문맥에서 ‘받아들이다’가 가장 자연스럽고 격식을 갖춘 표현입니다.
theological_decisions:
- issue: 지혜의 여성적 인격화 보존
  chosen_reading: 지혜를 ‘그녀’로 유지하고, 모성과 혼인 이미지를 그대로 살렸습니다.
  alternative_readings:
  - 무생물적 ‘그것’으로 처리
  - 상징을 풀어 설명문으로 바꾸기
  rationale: 히브리어 동사와 비유가 모두 여성형 인격화를 전제하므로, 이를 유지해야 본문의 시적·신학적 의미가 훼손되지 않습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
- issue: ‘젊은 시절의 아내’의 정서 유지
  chosen_reading: 히브리어 본문을 따라 ‘젊은 시절의 아내’로 두고, 그 안에 담긴 신부/순결의 뉘앙스는 본문 표현 안에서만 암시했습니다.
  alternative_readings:
  - 순결한 아내
  - 젊은 신부
  - 처녀 같은 아내
  rationale: 남아 있는 히브리어 증거를 우선하되, 그리스어의 ‘처녀성’ 뉘앙스를 과도하게 본문에 이식하지 않고 시적 친밀감을 유지하는 것이 더 충실합니다.
  doctrine_reference: PHILOSOPHY.md on Hebrew primacy for extant Sirach Hebrew
