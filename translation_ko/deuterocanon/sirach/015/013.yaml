base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/015/013.yaml
  text: Yahweh hates evil and abomination[a], and he will not permit it to those who fear him.
  footnotes:
  - marker: a
    text: 'Greek parallel: ''and it is not beloved/acceptable to those who fear him.'' The Hebrew witness instead reads, ''and he will not let it happen to those who fear him.'''
    reason: alternative_reading
translation:
  language: ko
  text: 야훼께서는 악과 가증한 것을 미워하십니다[a]. 또한 그는 그것을 그분을 두려워하는 이들에게 허락하지 않으십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 평행문은 ‘그리고 그것은 그분을 두려워하는 이들에게 사랑받지/받아들여지지 않습니다’로 읽습니다. 현존하는 히브리어 본문은 ‘그리고 그는 그것을 그분을 두려워하는 이들에게 허락하지 않으십니다’라고 읽습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: רָעָה
  english_pob_choice: evil
  chosen_korean: 악
  alternatives_korean:
  - 악행
  - 재앙
  lexicon: HALOT
  rationale: תוֹעֵבָה와 함께 짝을 이루는 점을 따라 도덕적 악을 가리키는 말로 옮겼습니다.
- source_word: תּוֹעֵבָה
  english_pob_choice: abomination
  chosen_korean: 가증한 것
  alternatives_korean:
  - 가증한 일
  - 혐오스러운 것
  lexicon: HALOT
  rationale: 하나님께서 혐오하시는 대상을 강하게 드러내는 표현을 유지하되, 한국어에서 자연스러운 명사구로 옮겼습니다.
- source_word: שָׂנֵא
  english_pob_choice: hates
  chosen_korean: 미워하십니다
  alternatives_korean:
  - 증오하십니다
  - 싫어하십니다
  lexicon: HALOT
  rationale: 하나님의 지속적·단호한 거부를 평서형 현재로 담아, 문맥의 일반 진리를 살렸습니다.
- source_word: יְהֹוָה
  english_pob_choice: the LORD / Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: SBL/Hebrew Tetragrammaton convention
  rationale: POB 기본 원칙에 따라 신명기적 표기인 야훼를 사용했습니다.
- source_word: וְלֹא יְאַנֶּנָּה
  english_pob_choice: he will not let it happen / permit it
  chosen_korean: 허락하지 않으십니다
  alternatives_korean:
  - 허용하지 않으십니다
  - 일어나게 하지 않으십니다
  lexicon: HALOT
  rationale: 히브리어는 뒤의 대상을 ‘그것’으로 받아 하나님이 그 일이 일어나도록 두지 않으심을 뜻하므로, 한국어에서는 ‘허락하다’로 자연스럽고 직접적으로 옮겼습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 평행문의 차이
  chosen_reading: 본문은 히브리어를 따라 ‘그것을 … 허락하지 않으십니다’로 옮기고, 그리스어의 ‘사랑받지/받아들여지지 않는다’는 차이는 각주로 보존합니다.
  alternative_readings:
  - 그것은 그분을 두려워하는 이들에게 사랑받지 않습니다
  - 그것은 그분을 두려워하는 이들에게 받아들여지지 않습니다
  rationale: 시에라크는 히브리어가 현존할 때 히브리어를 우선하되, 중요한 평행 전승의 의미 차이는 숨기지 않는 것이 투명성에 부합합니다.
  doctrine_reference: 'PHILOSOPHY.md: translate Sirach from Hebrew where it survives; preserve Greek parallel divergences transparently.'
