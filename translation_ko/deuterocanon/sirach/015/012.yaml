translation:
  language: ko
  text: 「하나님이 나를 넘어지게 하셨다」고 말하지 마십시오. 그분은 폭력적인 사람들을 필요로 하지 않으십니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 평행본문은 “그가 나를 그릇되게 하셨다”라고 읽습니다. 이는 히브리어의 “나를 넘어지게 하셨다”보다 더 넓은 의미입니다.
    reason: alternative_reading
  - marker: b
    text: 그리스어 평행본문은 “죄인”에 해당하는 표현을 쓰지만, 히브리어는 “폭력적인 사람들”이라고 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּן תֹּאמַר
  english_pob_choice: Do not say
  chosen_korean: 「…고 말하지 마십시오」
  alternatives_korean:
  - 「…라고 하지 마십시오」
  - 「…라고 말하지 마십시오」
  - 「…라고 생각하지 마십시오」
  lexicon: HALOT
  rationale: פן + 미완료형의 경고 용법을 한국어에서는 직접적인 금지 표현으로 옮기는 것이 자연스럽고, 지혜문맥의 훈계 어조를 살릴 수 있습니다.
- source_word: הִתְקִילָנִי
  english_pob_choice: made me stumble
  chosen_korean: 나를 넘어지게 하셨다
  alternatives_korean:
  - 나를 걸려 넘어지게 하셨다
  - 나를 실족하게 하셨다
  - 나를 미혹하셨다
  lexicon: HALOT
  rationale: 히브리어는 넘어짐/걸림의 구체적 이미지를 가지므로, 본문에 충실하게 한국어에서도 ‘넘어지게 하다’로 옮겼습니다. '실족하다'는 교회적 어감이 강하고, '미혹하다'는 그리스어 뉘앙스로 기울어집니다.
- source_word: אֵין צֹרֶךְ בְּאַנְשֵׁי חָמָס
  english_pob_choice: has no need of violent men
  chosen_korean: 폭력적인 사람을 필요로 하지 않으십니다
  alternatives_korean:
  - 폭력한 사람을 필요로 하지 않으십니다
  - 폭력적인 자들을 필요로 하지 않으십니다
  - 악한 사람을 필요로 하지 않으십니다
  lexicon: HALOT
  rationale: חָמָס는 단순한 '악함'보다 폭력성과 폭력적 해악을 가리키므로, 한국어에서도 그 구체성을 살려 '폭력적인 사람'으로 번역했습니다. 단수화는 한국어 관용에 따른 것으로, 집합적 의미를 해치지 않습니다.
- source_word: הוּא
  english_pob_choice: He
  chosen_korean: 그분
  alternatives_korean:
  - 그
  - 그이
  lexicon: HALOT
  rationale: 문맥상 주어는 하나님이므로, 한국어에서는 경칭이 자연스러운 '그분'으로 처리하여 직접적인 신칭을 분명히 했습니다.
theological_decisions:
- issue: 히브리어 본문의 '넘어지게 하다'와 그리스어 평행문의 '그릇되게 하다/유혹하다'(ἐπλάνησεν) 중 어느 뉘앙스를 본문에 둘 것인가
  chosen_reading: 히브리어 본문을 따라 '나를 넘어지게 하셨다'를 본문에 두고, 그리스어의 더 넓은 의미는 각주로 보존합니다.
  alternative_readings:
  - 나를 미혹하셨다
  - 나를 그릇되게 이끄셨다
  rationale: 이 항목은 히브리어가 보존된 본문이므로 히브리어의 구체적 이미지를 우선해야 합니다. 동시에 그리스어 평행은 해석 전통의 폭을 보여 주므로, 본문을 바꾸지 않고 각주로만 남기는 것이 가장 투명합니다.
  doctrine_reference: 'PHILOSOPHY.md: surviving Hebrew governs the main text; preserve meaningful Greek alternatives in footnotes'
- issue: 주어 대명사 '그분'을 하나님으로 명시적으로 이해시킬지 여부
  chosen_reading: 문맥상 하나님을 가리키므로 한국어에서 '그분'으로 처리합니다.
  alternative_readings:
  - 하나님
  - 그
  rationale: 원문 대명사는 문맥상 분명히 하나님을 가리키므로, 한국어에서는 경칭 대명사를 사용해 문맥의 주어를 자연스럽게 드러내는 것이 적절합니다.
  doctrine_reference: 'DOCTRINE.md: 문맥상 지시 대상을 분명히 하되, 원문의 주어 관계를 바꾸지 않는다'
