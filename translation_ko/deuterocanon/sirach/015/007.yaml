base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/015/007.yaml
  text: Men of falsehood will not attain her[b][a], and men of insolence will not see her.
  footnotes:
  - marker: a
    text: Hebrew 'men of falsehood.' The Greek parallel reads 'senseless people,' which may reflect a different Vorlage or an interpretive rendering.
    reason: alternative_reading
  - marker: b
    text: The Hebrew verb is difficult if read woodenly as 'guide her'; the Greek parallel supports the sense 'grasp' or 'attain' her.
    reason: lexical_alternative
translation:
  language: ko
  text: 거짓된 사람들은 그것을 얻지 못하고, 오만한 사람들은 그것을 보지 못합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘거짓/허무의 사람들’의 뜻입니다. 그리스어 병행본문은 ‘무감각한 사람들’로 읽어, 다른 원문 전승이나 해석적 번역을 반영한 것으로 보입니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어 동사는 문자적으로는 ‘인도하다’에 가깝지만, 이 문맥에서는 ‘얻다/도달하다’의 뜻이 자연스럽습니다. 그리스어 병행본문도 ‘붙잡다/획득하다’의 의미를 지지합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא יַדְרִיכוּהָ
  english_pob_choice: will not attain her
  chosen_korean: 그것을 얻지 못하고
  alternatives_korean:
  - 그것을 차지하지 못하고
  - 그것에 이르지 못하고
  - 그것을 붙잡지 못하고
  lexicon: HALOT
  rationale: 히브리어 동사 דרך의 이 형태는 문자적으로는 ‘이끌다/인도하다’가 가능하지만, 병행절과 문맥상 지혜를 ‘얻다/차지하다’의 뜻으로 보는 것이 자연스럽습니다. 한국어에서는 ‘얻지 못하다’가 그 도달·획득의 의미를 가장 간결하게 살립니다.
- source_word: מְתֵי שָׁוְא
  english_pob_choice: men of falsehood
  chosen_korean: 거짓된 사람들
  alternatives_korean:
  - 거짓의 사람들
  - 허망한 사람들
  - 속이는 사람들
  lexicon: HALOT
  rationale: מתי שוא는 직역하면 ‘거짓/허무의 사람들’이지만, 한국어에서는 너무 낯선 구성보다 의미를 살린 표현이 필요합니다. POB의 ‘men of falsehood’를 따라 ‘거짓된 사람들’로 옮겨 히브리어의 도덕적 성격을 유지했습니다.
- source_word: וְאַנְשֵׁי זָדוֹן
  english_pob_choice: men of insolence
  chosen_korean: 오만한 사람들
  alternatives_korean:
  - 거만한 사람들
  - 주제넘은 사람들
  - 패역한 사람들
  lexicon: HALOT
  rationale: זדון은 오만, 거만, presumptuous rebellion의 뉘앙스를 가지므로, 한국어에서는 ‘오만한’이 가장 직접적으로 대응합니다. ‘악한’처럼 넓게 만들지 않고, 인물의 태도 자체를 드러내도록 했습니다.
- source_word: לֹא יִרְאוּהָ
  english_pob_choice: will not see her
  chosen_korean: 그것을 보지 못합니다
  alternatives_korean:
  - 그것을 보지 못할 것입니다
  - 그녀를 보지 못합니다
  - 그것을 알아보지 못합니다
  lexicon: HALOT
  rationale: ראה의 기본 의미인 ‘보다’를 유지하되, 지혜를 인격화한 ‘그녀’는 한국어에서 부자연스러울 수 있어 중성 대명사 ‘그것’을 택했습니다. 문맥상 ‘보다’는 단순 시각보다 인식/접근의 실패를 포함하지만, 본문 어휘의 표면 의미는 보존했습니다.
theological_decisions:
- issue: 지혜를 가리키는 대명사의 한국어 처리
  chosen_reading: 히브리어의 여성 대명사 אַותה? / αὐτήν에 해당하는 지혜를 한국어에서는 ‘그것’으로 중성화해 표현했습니다.
  alternative_readings:
  - 그녀를 보지 못합니다
  - 그를 보지 못합니다
  - 그 지혜를 보지 못합니다
  rationale: 한국어는 지혜를 여성 인칭대명사로 자연스럽게 받지 않으며, 본문이 전달하려는 핵심은 성별이 아니라 지혜에 대한 접근 불가입니다. 따라서 인격화의 흔적은 유지하되, 독자가 의미를 오해하지 않도록 중성 대명사를 사용했습니다.
  doctrine_reference: 'POB 번역 원칙: 원문의 의미와 수사적 힘을 보존하되 한국어 자연성을 해치지 않음'
