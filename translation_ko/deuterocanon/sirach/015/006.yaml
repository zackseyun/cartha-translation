base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/015/006.yaml
  text: He will find gladness and joy[a], and an everlasting name will be his inheritance.
  footnotes:
  - marker: a
    text: Or, 'he will inherit an everlasting name.' The Hebrew verb can be construed this way, and the Greek parallel explicitly uses inheritance language.
