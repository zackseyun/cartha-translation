translation:
  language: ko
  text: 그는 즐거움과 기쁨을 얻고, 영원한 이름을 그의 몫으로 받습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘그는 영원한 이름을 상속받습니다.’ 히브리어 동사는 이렇게도 이해될 수 있고, 그리스어 평행본문도 ‘상속’ 표현을 분명히 사용합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: שָׂשׂוֹן
  english_pob_choice: gladness
  chosen_korean: 즐거움
  alternatives_korean:
  - 기쁨
  - 환희
  - 즐거워함
  lexicon: HALOT
  rationale: שָׂשׂוֹן은 기쁜 상태를 가리키므로, 한국어에서는 자연스럽고 현대적인 ‘즐거움’으로 옮겨 감정의 밝음을 살렸습니다.
- source_word: שִׂמְחָה
  english_pob_choice: joy
  chosen_korean: 기쁨
  alternatives_korean:
  - 즐거움
  - 환희
  - 기쁨스러움
  lexicon: HALOT
  rationale: 앞말과 의미가 겹치는 평행어이므로, 구별되면서도 가까운 표현인 ‘기쁨’으로 번역해 시적 짝을 살렸습니다.
- source_word: יִמְצָא
  english_pob_choice: will find
  chosen_korean: 얻고
  alternatives_korean:
  - 찾게 되고
  - 발견하고
  - 만나게 되고
  lexicon: HALOT
  rationale: 직역하면 ‘찾다’이지만, 문맥상 실제로 누리거나 받는 결과를 가리키므로 한국어에서는 ‘얻다’가 더 자연스럽습니다.
- source_word: שֵׂם עוֹלָם
  english_pob_choice: an everlasting name
  chosen_korean: 영원한 이름
  alternatives_korean:
  - 끝없는 이름
  - 영구한 이름
  - 영원한 명성
  lexicon: HALOT
  rationale: ‘이름’이라는 비유를 유지하면서, 지속성을 나타내는 עוֹלָם을 ‘영원한’으로 옮겨 본문의 상징을 보존했습니다.
- source_word: תּוֹרִישֶׁנּוּ
  english_pob_choice: will be his inheritance
  chosen_korean: 그의 몫으로 받습니다
  alternatives_korean:
  - 그가 상속받습니다
  - 그가 유산으로 받습니다
  - 그에게 상속됩니다
  lexicon: HALOT
  rationale: 히필형은 ‘상속하게 하다/상속받게 하다’의 뜻을 담으므로, 한국어에서는 결과를 분명히 드러내는 ‘몫으로 받다’로 옮겼습니다.
theological_decisions:
- issue: 마지막 절의 ירש(상속/받음) 표현을 어떻게 처리할지
  chosen_reading: ‘영원한 이름’은 그 사람이 받는 몫, 곧 상속으로 주어지는 선물로 이해했습니다.
  alternative_readings:
  - 그가 영원한 이름을 상속받는다
  - 영원한 이름이 그의 유산이 된다
  rationale: 히브리어와 그리스어 평행본문 모두 ‘상속’의 의미를 지지하므로, 단순한 소유보다 선물로 받는 성격이 드러나도록 번역했습니다.
  doctrine_reference: 지혜문학의 보상/유업 이미지
