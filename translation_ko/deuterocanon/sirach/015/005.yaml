translation:
  language: ko
  text: 그는 그를 자기 동료들보다 높이시고, 회중 한가운데서 그의 입을 여실 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘동료들’은 히브리어 단수형 רֵעַ를 문맥상 집합적으로 이해한 번역입니다. 그리스어 평행문은 더 넓은 복수 의미를 지지합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרוֹמְמַתְהוּ / ὑψώσει
  english_pob_choice: he will exalt him
  chosen_korean: 그를 … 높이시고
  alternatives_korean:
  - 그를 높이 올리시고
  - 그를 높이시며
  lexicon: HALOT
  rationale: רומם과 그리스어 ὑψώσει는 단순한 물리적 ‘올림’보다 지위와 존귀의 상승을 함께 담으므로, 한국어에서는 ‘높이시다’가 가장 자연스럽고 의미를 온전히 전달합니다.
- source_word: מֵרֵעֵהוּ / παρὰ τοὺς πλησίον αὐτοῦ
  english_pob_choice: above his companions
  chosen_korean: 자기 동료들보다
  alternatives_korean:
  - 그의 친구보다
  - 그의 이웃들보다
  lexicon: HALOT
  rationale: 히브리어 단수형이지만 문맥과 그리스어 병행문이 사회적 복수 의미를 지지하므로, 좁은 ‘친구’보다 공동체적 관계를 드러내는 ‘동료들’이 적절합니다.
- source_word: וּבְתוֹךְ קָהָל / ἐν μέσῳ ἐκκλησίας
  english_pob_choice: in the midst of the assembly
  chosen_korean: 회중 한가운데서
  alternatives_korean:
  - 회중 가운데서
  - 모임 한가운데서
  lexicon: HALOT
  rationale: קהל과 ἐκκλησία는 여기서 제도교회보다 공개적으로 모인 공동체를 가리키므로, POB 기본어인 ‘회중’을 살리되 위치감을 드러내는 ‘한가운데서’로 옮겼습니다.
- source_word: תִּפְתַּח פִּיו / ἀνοίξει στόμα αὐτοῦ
  english_pob_choice: he will open his mouth
  chosen_korean: 그의 입을 여실 것입니다
  alternatives_korean:
  - 그의 입을 열 것입니다
  - 그가 말하기 시작할 것입니다
  lexicon: HALOT
  rationale: 관용구를 단순히 ‘말하다’로 풀지 않고, 히브리어와 그리스어가 함께 쓰는 구체적 표현을 보존했습니다. 이는 공적 발화의 개시를 강조합니다.
theological_decisions:
- issue: 행위 주체의 명시 여부
  chosen_reading: 문장은 주어를 분명히 드러내지 않고 ‘그는’으로 유지했습니다.
  alternative_readings:
  - 하나님이 그를 높이시고로 주어를 명시할 수 있음
  - 지혜를 행위 주체로 더 강하게 읽을 수 있음
  rationale: 본절은 동사 형태상 주어를 직접 이름하지 않으며, 앞뒤 문맥에서 지혜가 의인에게 베푸는 작용이 이어집니다. 따라서 해석을 과도하게 확정하지 않고 원문의 긴장을 보존했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it
