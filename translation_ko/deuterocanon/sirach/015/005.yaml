  text: And he will exalt him above his companions[a], and in the midst of the assembly he will open his mouth.
  footnotes:
  - marker: a
    text: Or 'above his friend'; the Hebrew has a singular form, but the Greek parallel reflects a broader plural sense ('his neighbors/companions'), which is likely the intended meaning here.
