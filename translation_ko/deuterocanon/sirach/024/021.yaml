  rationale: 그리스어는 ‘더 원하다’고 설명하기보다 실제 감각어를 사용합니다. 따라서 본문이 의도한 긴장과 지혜에 대한 끝없는 추구를 그대로 드러내는 편이 소스에 더 충실합니다.
