  text: Those who eat me will still hunger[a], and those who drink me will still thirst.
  footnotes:
  - marker: a
    text: Or, 'will hunger for more ... will thirst for more.' The Greek says literally 'will still hunger' and 'will still thirst,' expressing an ongoing desire for Wisdom after partaking of her.
    reason: lexical_alternative
translation:
  language: ko
  text: 나를 먹는 사람들은 여전히 배고프고, 나를 마시는 사람들은 여전히 목마를 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘더 원하게 될 것입니다 … 더 갈망하게 될 것입니다.’ 그리스어는 문자적으로 ‘여전히 배고프다’와 ‘여전히 목마르다’라고 하며, 지혜를 맛본 뒤에도 계속되는 갈망을 나타냅니다.
    reason: lexical_alternative
