  yaml_path: translation/deuterocanon/sirach/024/015.yaml
  text: Like cinnamon and aspalathus[a], I gave forth a scent of spices, and like choice myrrh I spread fragrance, like galbanum and onycha and stacte[e][d][c][b], and like the smoke of frankincense in the tabernacle.
  footnotes:
  - marker: a
    text: Or 'in the tabernacle.' The Greek literally says 'in the tent,' but in this incense-setting it likely alludes to the sanctuary tent.
    reason: lexical_alternative
  - marker: b
    text: Aspalathus is an aromatic plant, but its exact identification is uncertain.
    reason: cultural_note
  - marker: c
    text: Or 'Like cinnamon and aspalathus of spices I gave off fragrance, and like choice myrrh I spread a sweet smell, like galbanum and onycha and stacte, and like the vapor of frankincense in the tent.'.
    reason: previous_rendering
  - marker: d
    text: Or 'Like cinnamon and aspalathus, I gave forth a scent of spices, and like choice myrrh I spread a sweet smell, like galbanum and onycha and stacte, and like the vapor of frankincense in the tent.'.
    reason: previous_rendering
  - marker: e
    text: Or 'Like cinnamon and aspalathus, I gave forth a scent of spices, and like choice myrrh I spread a sweet fragrance, like galbanum and onycha and stacte, and like the vapor of frankincense in the tabernacle.'.
    reason: previous_rendering
translation:
  language: ko
  text: 계피와 아스팔라토스[b]처럼 향료의 향을 내었고, 정선된 몰약처럼 향기를 퍼뜨렸으며, 갈반과 오니카와 스태크테처럼, 또 장막[a] 안의 유향 연기처럼 향기를 퍼뜨렸습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘성막 안의’. 그리스어는 문자적으로 ‘장막 안에’라고 하지만, 향연의 맥락에서는 성소의 장막을 가리킬 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 아스팔라토스는 향기로운 식물이지만, 정확한 식물 동정은 확실하지 않습니다.
    reason: cultural_note
lexical_decisions:
- source_word: κιννάμωμον
  english_pob_choice: cinnamon
  chosen_korean: 계피
  alternatives_korean:
  - 시나몬
  lexicon: LSJ
  rationale: 그리스어 κιννάμωμον은 통상 계피를 가리키므로 한국어에서도 가장 자연스러운 대응인 계피를 택했습니다.
- source_word: ἀσπάλαθος
  english_pob_choice: aspalathus
  chosen_korean: 아스팔라토스
  alternatives_korean:
  - 가시관목
  - 향기로운 관목
  lexicon: LSJ
  rationale: 식물 식별이 불확실하므로 음역을 유지해 과도한 특정화를 피하고, 본문의 향료 목록성을 보존했습니다.
- source_word: ἀρωμάτων
  english_pob_choice: of spices
  chosen_korean: 향료의
  alternatives_korean:
  - 향신료의
  - 향료들의
  lexicon: LSJ
  rationale: 여기서는 냄새의 성격을 규정하는 속격이므로 단순한 재료 목록보다 ‘향료의 향’으로 받는 것이 문맥에 더 가깝습니다.
- source_word: σμύρνα ἐκλεκτή
  english_pob_choice: choice myrrh
  chosen_korean: 선택한 몰약
  alternatives_korean:
  - 상급 몰약
  - 좋은 몰약
  lexicon: LSJ
  rationale: ἐκλεκτή의 ‘선택된, 정선된’ 의미를 살려 ‘선택한’으로 옮겼고, 몰약은 한국어 성경에서 널리 쓰이는 표준어를 사용했습니다.
- source_word: εὐωδίαν
  english_pob_choice: fragrance
  chosen_korean: 향기
  alternatives_korean:
  - 향내
  - 좋은 향
  lexicon: LSJ
  rationale: εὐωδία는 좋은 향기를 뜻하므로 ‘향기’를 택해 과도한 수식 없이 긍정적 향취를 전달했습니다.
- source_word: χαλβάνη καὶ ὄνυξ καὶ στακτή
  english_pob_choice: galbanum and onycha and stacte
  chosen_korean: 갈반과 오니카와 스태크테
  alternatives_korean:
  - 갈반과 온니카와 스탁테
  - 갈바눔과 오니카와 스택테
  lexicon: LSJ
  rationale: 세 향료는 특정 향료명들이어서 통용 음역을 유지했습니다. ὄνυξ는 보석 ‘오닉스’가 아니라 향료 목록의 ‘오니카’로 이해했습니다.
- source_word: λίβανου ἀτμὶς
  english_pob_choice: the smoke of frankincense
  chosen_korean: 유향 연기
  alternatives_korean:
  - 유향의 연기
  - 유향의 증기
  lexicon: LSJ
  rationale: 불에 태운 유향의 ἀτμίς는 실제로 드러나는 연기를 가리키므로 ‘연기’가 가장 자연스럽습니다.
- source_word: ἐν σκηνῇ
  english_pob_choice: in the tabernacle
  chosen_korean: 장막 안의
  alternatives_korean:
  - 장막에서
  - 성막 안의
  lexicon: LSJ
  rationale: σκηνή는 문자적으로 ‘장막’이지만 예배 문맥에서는 성막을 가리킬 수 있어, 본문 의미를 살리되 직역성을 유지하는 ‘장막 안의’로 옮겼습니다.
theological_decisions:
- issue: σκηνή의 예배 문맥
  chosen_reading: 장막 안의
  alternative_readings:
  - 성막 안의
  - 장막에서
  rationale: 본문은 향료 목록을 통해 성소 향연 이미지를 그리므로, 문자적 ‘장막’과 예배적 함의 사이의 긴장을 유지하는 쪽이 적절합니다.
  doctrine_reference: '번역 원칙: 원문이 허용하는 예배적 암시를 과도하게 해석하지 않되, 문자적 의미도 지우지 않음'
