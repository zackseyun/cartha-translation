  source_fidelity: 현 번역은 향료명과 ‘장막’의 문자적 표현을 대체로 충실히 보존합니다. 다만 ‘선택한 몰약’은 한국어에서 몰약을 선택하는 행위처럼 들려 ἐκλεκτή(‘정선된, 좋은’)의 수식 관계를 충분히 전달하지 못합니다. 또한 마지막의 ‘…처럼 하였습니다’는 원문의 향기 발산 이미지를 불명확하게 만듭니다.
  naturalness: ‘선택한 몰약’과 문장 끝의 ‘하였습니다’는 현대 표준 한국어에서 부자연스럽고 의미가 모호합니다. 반복되는 비교구문에는 ‘향기를 퍼뜨렸습니다’를 다시 밝혀 주면 합쇼체 문장으로도 자연스럽고 원문의 시적 열거를 유지할 수 있습니다.
  terminology: 계피, 아스팔라토스, 몰약, 갈반, 오니카, 스태크테, 유향은 안전하게 유지할 수 있습니다. ἐκλεκτή는 ‘정선된’으로, εὐωδία는 ‘향기’로 옮깁니다. σκηνή는 본문에서 ‘장막’을 유지하고 ‘성막’ 가능성은 해당 단어에 직접 붙인 각주로 제시합니다.
