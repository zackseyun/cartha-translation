translation:
  language: ko
  text: 나는 말했습니다. ‘내 정원에 물을 주고, 내 정원의 밭을 흠뻑 적시겠습니다.’ 보십시오, 내 수로가 강이 되었고, 내 강이 바다가 되었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘정원의 밭’은 원문의 πρασιά가 가리키는 정원 안의 경작된 밭 또는 심는 구획이라는 뜻을 살린 것입니다.
    reason: lexical_alternative
  - marker: b
    text: 이미지는 수로에서 강으로, 다시 바다로 확대되며 비상한 증가를 보여 줍니다.
    reason: cultural_note
lexical_decisions:
- source_word: Ποτιῶ
  english_pob_choice: I will water
  chosen_korean: 물을 주겠습니다
  alternatives_korean:
  - 관개하겠습니다
  - 적시겠습니다
  lexicon: LSJ
  rationale: 정원에 대한 동작이므로 ‘물을 주다’가 가장 자연스럽고, 원문의 농업적 이미지를 유지합니다.
- source_word: πρασιάν
  english_pob_choice: garden bed
  chosen_korean: 정원밭
  alternatives_korean:
  - 정원침상
  - 화단
  - 밭
  lexicon: LSJ
  rationale: πρασιά는 꽃밭보다 경작된 심기 자리나 밭에 가깝기 때문에, 장식적 뉘앙스를 피하고 소스의 농업적 뜻을 살려 ‘정원밭’으로 옮겼습니다.
- source_word: διῶρυξ
  english_pob_choice: channel
  chosen_korean: 수로
  alternatives_korean:
  - 도랑
  - 운하
  - 물길
  lexicon: LSJ
  rationale: 인공적으로 판 물길이라는 뜻을 살리면서도, ‘도랑’보다 덜 초라하고 ‘운하’보다 덜 기술적인 중립어로 ‘수로’를 선택했습니다.
- source_word: ἐγένετό μοι ... εἰς
  english_pob_choice: became
  chosen_korean: ~가 되었습니다
  alternatives_korean:
  - ~로 변했습니다
  - ~가 되었습니다
  lexicon: LSJ
  rationale: 크게 증폭되는 이미지를 그대로 살리기 위해, ‘~가 되었습니다’로 단계적 확대를 분명하게 표현했습니다.
theological_decisions:
- issue: 과장된 물의 확대 이미지의 해석
  chosen_reading: 본문이 말하는 정원-수로-강-바다의 점증 이미지를 직설적으로 유지했습니다.
  alternative_readings:
  - 지혜의 가르침이 열방으로 퍼진다는 상징을 본문에 덧붙여 해석하기
  - 영적 풍성함을 명시적으로 주석화하기
  rationale: 이 절은 은유를 제시하지만 해설하지는 않으므로, 본문이 허용하는 범위를 넘지 않도록 구체적 이미지 그대로 옮겼습니다.
