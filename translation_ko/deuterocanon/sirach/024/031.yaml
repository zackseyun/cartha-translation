  text: I said[a], ‘I will water my garden, and I will drench my garden bed.’ And behold, my channel became a river[c][b], and my river became a sea.
  footnotes:
  - marker: a
    text: Or 'garden bed' for 'flowerbed'; the Greek refers to a cultivated plot or bed of greenery.
    reason: lexical_alternative
  - marker: b
    text: The image intensifies from a small irrigation channel to a river and then to a sea, expressing extraordinary increase.
    reason: cultural_note
  - marker: c
    text: Or 'I said, ‘I will water my garden, and I will drench my flowerbed.’ And behold, my channel became a river, and my river became a sea.'.
