translation:
  language: ko
  text: 그것은 이해를 유프라테스처럼, 또 추수철의 요단처럼 가득 채웁니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘유프라테스처럼 이해를 가득 채우고, 추수철의 요단처럼 [채우는] 이’입니다. 그리스어는 정관사가 붙은 분사로 시작하므로, 문맥의 선행사를 받아 옮길 수도 있습니다.
    reason: alternative_reading
  - marker: b
    text: 이 비유는 물이 불어나 넘치는 두 큰 강의 풍성함을 떠올리게 합니다.
    reason: cultural_note
