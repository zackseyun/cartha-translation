  text: 그것은 유프라테스처럼, 그리고 추수철의 요단처럼 이해를 채워 줍니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이해를 유프라테스처럼, 그리고 추수철의 요단처럼 채우는 자는’. 그리스어는 정관사 붙은 분사로 시작하므로 ‘그것은’ 대신 ‘...하는 자는’으로도 옮길 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 이 비유는 큰 강이 물이 불어난 때의 압도적 풍성함을 떠올리게 합니다.
    reason: cultural_note
