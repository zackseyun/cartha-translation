translation:
  language: ko
  text: 나는 거룩한 천막에서 그분 앞에 섬겼고, 그리하여 시온에 굳게 세워졌습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘거룩한 천막, 그분 앞에서 나는 거룩한 섬김을 행했다.’
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘시온에, 이렇게 나는 굳게 세워졌다.’
    reason: previous_rendering
lexical_decisions:
- source_word: σκηνῇ ἁγίᾳ
  english_pob_choice: the holy tent
  chosen_korean: 거룩한 천막
  alternatives_korean:
  - 거룩한 장막
  - 거룩한 성막
  lexicon: LSJ
  rationale: σκηνή는 문자 그대로 천막/장막을 뜻하므로, POB의 'holy tent'를 따라 구체적이고 소박한 예배 공간 이미지를 살리는 것이 좋습니다. '성막'도 가능하지만 한국 교회어의 관습이 강해 원문 이미지가 약해집니다.
- source_word: ἐνώπιον αὐτοῦ
  english_pob_choice: before him
  chosen_korean: 그분 앞에
  alternatives_korean:
  - 그분의 앞에서
  - 그분의 임재 안에서
  lexicon: LSJ
  rationale: ἐνώπιον은 문자 그대로 '앞에'라는 관계를 나타내므로, POB처럼 공간적·관계적 감각을 유지해 '그분 앞에'로 옮겼습니다. '임재 안에서'는 더 해석적입니다.
- source_word: ἐλειτούργησα
  english_pob_choice: I ministered
  chosen_korean: 섬겼고
  alternatives_korean:
  - 봉사했고
  - 예배 봉사를 드렸고
  - 성직으로 봉사했고
  lexicon: BDAG
  rationale: λειτουργέω는 제의적·공적 섬김을 뜻하지만, 본문은 특정 직분을 명시하지 않습니다. '섬기다'는 신성한 봉사의 뉘앙스를 유지하면서도 과도한 교회 제도 용어를 피합니다.
- source_word: ἐστηρίχθην
  english_pob_choice: I was established
  chosen_korean: 굳게 세워졌습니다
  alternatives_korean:
  - 설립되었습니다
  - 확고히 서게 되었습니다
  - 정착되었습니다
  lexicon: BDAG
  rationale: στηρίζω의 수동형은 '견고하게 세우다/확립하다'의 뜻이므로, 인격화된 지혜의 문맥에 맞게 '굳게 세워졌습니다'로 자연스럽게 표현했습니다. '설립되었습니다'는 너무 제도적입니다.
theological_decisions:
- issue: 지혜의 성전 봉사 표현
  chosen_reading: ἐλειτούργησα를 '섬겼고'로 옮겨, 제의적 봉사의 의미는 살리되 특정 제사장 직분으로 지나치게 한정하지 않았습니다.
  alternative_readings:
  - 봉사했고
  - 예배 봉사를 드렸고
  - 제사장처럼 봉사했고
  rationale: 화자는 성전/천막 문맥의 의인화된 지혜이므로, 본문은 거룩한 섬김의 긴장을 유지해야 합니다. 직분을 명시적으로 덧씌우면 원문의 표현 범위를 좁힐 수 있습니다.
  doctrine_reference: '번역 원칙: 해석을 과도하게 확정하지 말고, 원문의 신학적 긴장을 보존합니다.'
