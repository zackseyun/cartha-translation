translation:
  language: ko
  text: 그리고 나도 강에서 갈라져 나온 운하처럼, 수로처럼 정원으로 나아갔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘낙원.’ 이 그리스어는 정원, 공원, 낙원을 뜻할 수 있는데, 여기서는 관개가 흘러 들어가는 가꾸어진 정원의 이미지가 직접적입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀγώ
  english_pob_choice: And I
  chosen_korean: 그리고 저도
  alternatives_korean:
  - 그리고 나도
  - 그리고 저 역시
  lexicon: LSJ
  rationale: 화자의 자기 동일시를 자연스럽게 드러내면서, 단순한 접속을 살려 English POB의 ‘And I’보다 한국어 문맥에 맞는 완곡한 연결로 옮겼습니다.
- source_word: διῶρυξ ἀπὸ ποταμοῦ
  english_pob_choice: a canal from a river
  chosen_korean: 강에서 갈라져 나온 운하
  alternatives_korean:
  - 강에서 나온 수로
  - 강에서 갈라진 도랑
  lexicon: LSJ
  rationale: διῶρυξ는 인공적으로 낸 수로이므로 ‘운하’로, ἀπὸ ποταμοῦ는 출처/분기 관계를 살려 ‘강에서 갈라져 나온’으로 옮겼습니다.
- source_word: ὑδραγωγὸς
  english_pob_choice: water channel
  chosen_korean: 물길
  alternatives_korean:
  - 수로
  - 물수로
  - 물길
  lexicon: LSJ
  rationale: English POB가 강조한 인공적 유도 수로의 의미를 한국어의 짧고 자연스러운 ‘물길’로 살려, 뒤의 이미지와 병렬을 유지했습니다.
- source_word: παράδεισον
  english_pob_choice: garden
  chosen_korean: 정원
  alternatives_korean:
  - 동산
  - 낙원
  - 동산 정원
  lexicon: LSJ
  rationale: 이 문맥은 관개 이미지가 중심이므로 종말론적 ‘낙원’보다 실제로 가꾸어진 공간인 ‘정원’이 원문의 구체적 그림을 더 직접적으로 전달합니다.
theological_decisions:
- issue: παράδεισον의 신학적 확장 여부
  chosen_reading: ‘정원’으로 유지하여 관개 비유를 전면에 둡니다.
  alternative_readings:
  - ‘낙원’으로 옮겨 상징성을 강화함
  - ‘동산’으로 옮겨 에덴 연상을 보강함
  rationale: 본문은 지혜의 흐름이 정원으로 들어가는 비유를 말할 뿐, 여기서 곧바로 종말론적 낙원을 선언하지 않습니다. 따라서 독자의 신학적 선이해를 앞세우지 않고 이미지 자체를 보존하는 번역이 적절합니다.
  doctrine_reference: 원문 우선 원칙; 비유의 문맥적 의미 보존
