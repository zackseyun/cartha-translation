    reason: previous_rendering
lexical_decisions:
- source_word: ἴδετε
  english_pob_choice: See that
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 살피십시오
  - 유의하십시오
  lexicon: LSJ
  rationale: 청중에게 사실을 확인하라고 촉구하는 복수 명령형이므로, 합쇼체의 직접적 권고인 ‘보십시오’가 자연스럽고 원문의 호소력을 잘 살립니다.
- source_word: οὐκ ἐμοὶ μόνῳ
  english_pob_choice: not for myself alone
  chosen_korean: 나 자신만을 위해
  alternatives_korean:
  - 나를 위해서만
  - 나 혼자만을 위해
  - 나 자신만을 위하지는
  lexicon: LSJ
  rationale: 여격과 μόνος가 ‘혜택/목적의 배타성’을 나타내므로, 한국어에서는 ‘나 자신만을 위해’로 옮겨 자기만을 위한 수고가 아님을 분명히 했습니다.
- source_word: ἐκοπίασα
  english_pob_choice: I have labored
  chosen_korean: 수고했습니다
  alternatives_korean:
  - 애썼습니다
  - 고생했습니다
  - 수고하였습니다
  lexicon: LSJ
  rationale: 완료된 수고의 현재적 결과를 드러내는 영어 POB의 present perfect 취지를 반영해, 현대 한국어의 자연스러운 완료형 ‘수고했습니다’를 택했습니다.
- source_word: πᾶσι τοῖς ἐκζητοῦσιν αὐτήν
  english_pob_choice: for all who seek her
  chosen_korean: 그녀를 찾는 모든 사람을 위해
  alternatives_korean:
  - 그녀를 찾는 모든 이를 위해
  - 그녀를 간절히 찾는 모든 사람을 위해
  - 그녀를 구하는 모든 사람을 위해
  lexicon: LSJ
  rationale: ἐκζητέω의 ‘찾다/구하다’ 중 여기서는 지혜 문맥의 과잉 번역을 피하면서도 대상이 분명하므로 ‘찾는’으로 처리했고, αὐτήν의 여성 인칭은 문맥상 인격화된 지혜를 따라 ‘그녀’로 살렸습니다.
theological_decisions:
- issue: 지혜의 여성 인칭 유지
  chosen_reading: αὐτήν을 ‘그녀’로 번역해 인격화된 지혜를 가리키게 했습니다.
  alternative_readings:
  - ‘그것’으로 중성화하여 번역하기
  - ‘지혜’를 반복하여 대상을 명시하기
  rationale: 이 장 전체가 지혜를 여성 인칭으로 의인화하므로, 번역에서도 그 문학적·신학적 형상을 유지하는 것이 본문의 의도를 가장 잘 반영합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
