  lexicon: LSJ
  rationale: 지혜문학 문맥에서 παιδεία는 단순한 교정보다 형성적 가르침을 뜻하므로, 현대 한국어에서 자연스럽고 의미 범위가 넓은 '가르침'을 선택했습니다.
- source_word: ὡς Γηὼν
  english_pob_choice: like the Gihon
  chosen_korean: 기혼강처럼
  alternatives_korean:
  - 기혼처럼
  - 기혼강과 같이
  lexicon: LSJ
  rationale: 강 이름임을 드러내기 위해 '강'을 덧붙였고, 한국어 성경 문맥에서 익숙한 고유명사 음역을 유지했습니다.
- source_word: ἐν ἡμέραις τρυγητοῦ
  english_pob_choice: in the days of the grape harvest
  chosen_korean: 수확철에
  alternatives_korean:
  - 포도 수확철에
  - 포도 추수 때
  lexicon: LSJ
  rationale: τrυγητός는 포도 수확을 가리키지만, 한국어에서는 '수확철'이 시기성을 가장 간결하게 전달합니다. 다만 포도 수확의 뉘앙스는 앞의 '기혼강' 이미지와 함께 문맥상 보존됩니다.
