  lexicon: LSJ
  rationale: 문맥상 의인화된 대상이 계속 이어지므로, 영어 POB의 'It makes'에 맞춰 한국어에서도 비인칭 주어를 유지해 앞선 참조를 흐리지 않도록 했습니다.
- source_word: παιδείαν
