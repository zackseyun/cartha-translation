  source_fidelity: 첫째 절의 μνημόσυνόν μου는 ‘나를 기억하는 것’으로 자연스럽게 보존되었고, 두 비교절의 ὑπέρ도 ‘~보다 더 달다’로 잘 반영되었습니다. 그러나 μέλιτος κηροῦ는 여기서 ‘벌집의 꿀’이라기보다 통상 ‘벌집꿀/꿀송이(honeycomb)’를 가리키므로, 현 번역은 원문의 대상을 ‘벌집에서 난 꿀’로 다소 풀어 옮깁니다. γάρ의 연결도 ‘이는’으로 드러내는 편이 충실합니다.
