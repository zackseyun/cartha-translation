  text: For the memory of me is sweeter than honey[c][b][a], and my inheritance is sweeter than the honeycomb.
  footnotes:
  - marker: a
    text: Or 'remembrance of me' or 'memorial of me.'
    reason: lexical_alternative
  - marker: b
    text: Literally, 'than honey of the comb'; that is, choice honey from the honeycomb.
    reason: lexical_alternative
  - marker: c
    text: Or 'For the memory of me is sweeter than honey, and my inheritance than honey from the comb.'.
    reason: previous_rendering
translation:
  language: ko
  text: 이는 나를 기억하는 것이[a] 꿀보다 더 달고, 나의 유산은 벌집꿀보다 더 답니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘나에 대한 기억’ 또는 ‘나를 기념함’으로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘벌집의 꿀’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: μνημόσυνόν μου
  english_pob_choice: memory of me
  chosen_korean: 나를 기억하는 것
  alternatives_korean:
  - 나의 기억
  - 나를 기념하는 것
  - 나의 기념
  lexicon: LSJ
  rationale: μνημόσυνον은 ‘기억/기념/추모’의 범위를 가지므로, 시적 문맥에서 자연스럽고 인격적 관계를 살리는 ‘나를 기억하는 것’으로 옮겼습니다.
- source_word: ὑπὲρ μέλι γλυκύ
  english_pob_choice: sweeter than honey
  chosen_korean: 꿀보다 더 달고
  alternatives_korean:
  - 꿀보다 달고
  - 꿀을 넘어서 달고
  lexicon: LSJ
  rationale: ὑπέρ의 비교 용법과 γλυκύ의 비교적 의미를 반영해 한국어에서도 비교 표현 ‘~보다 더 달고’로 옮겼습니다.
- source_word: κληρονομία μου
  english_pob_choice: my inheritance
  chosen_korean: 나의 유업
  alternatives_korean:
  - 나의 상속
  - 나의 몫
  - 나의 기업
  lexicon: LSJ
  rationale: κληρονομία는 상속받는 몫, 유산, 유업을 뜻하므로 문맥상 교회적 전통어에 기대지 않고도 직접적인 ‘유업’이 가장 적절합니다.
- source_word: μέλιτος κηροῦ
  english_pob_choice: the honeycomb
  chosen_korean: 벌집의 꿀
  alternatives_korean:
  - 꿀벌집
  - 벌집 꿀
  - 꿀벌집의 꿀
  lexicon: LSJ
  rationale: 그리스어 관용구 μέλιτος κηροῦ는 ‘벌집의 꿀’, 곧 벌집에서 난 꿀을 가리키므로, 이미지의 직설성을 살려 ‘벌집의 꿀’로 옮겼습니다.
theological_decisions:
- issue: 지혜의 1인칭 발화 유지
  chosen_reading: ‘나’와 ‘나의 유업’을 그대로 살려 지혜가 자기 자신에 대해 말하는 문장으로 유지했습니다.
  alternative_readings:
  - 지혜의 추상적 성격을 살려 인칭을 약화하는 번역
  - 대상을 일반화하여 ‘기억’과 ‘유산’만 강조하는 번역
  rationale: 앞뒤 문맥에서 지혜가 1인칭으로 자신을 소개하므로, 이를 약화하지 않고 인격적 자기발화를 보존했습니다.
  doctrine_reference: 원문 우선과 문맥적 인격화 유지
