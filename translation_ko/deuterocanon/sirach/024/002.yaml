translation:
  language: ko
  text: 지극히 높으신 이의 회중에서 그녀는 입을 열며, 그의 능력 앞에서 자랑할 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이는 주변 문맥에서 확립되는 인격화된 지혜를 가리킵니다.
    reason: cross_reference
  - marker: b
    text: 또는 ‘그의 권능 앞에서’라고도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκκλησίᾳ
  english_pob_choice: assembly
  chosen_korean: 회중
  alternatives_korean:
  - 모임
  - 집회
  - 교회
  lexicon: LSJ
  rationale: 시라흐에서 ἐκκλησία는 제도적 ‘교회’보다 모인 공동체를 가리키므로, 중립적이고 소집된 공동체성을 살린 ‘회중’이 가장 적절합니다.
- source_word: Ὑψίστου
  english_pob_choice: the Most High
  chosen_korean: 지극히 높으신 이
  alternatives_korean:
  - 가장 높으신 분
  - 지극히 높으신 분
  lexicon: LSJ
  rationale: 하나님을 가리키는 경외적 칭호이므로, 한국어에서는 자연스럽고 위엄 있는 ‘지극히 높으신 이’로 옮겼습니다.
- source_word: στόμα αὐτῆς ἀνοίξει
  english_pob_choice: she will open her mouth
  chosen_korean: 입을 열며
  alternatives_korean:
  - 그녀는 입을 열 것입니다
  - 그녀는 말을 시작할 것입니다
  lexicon: LSJ
  rationale: 헬라어 관용구를 직역하되, 한국어에서는 발화 개시의 생동감을 살리기 위해 ‘입을 열며’로 표현했습니다.
- source_word: ἔναντι δυνάμεως αὐτοῦ
  english_pob_choice: before his power
  chosen_korean: 그의 능력 앞에서
  alternatives_korean:
  - 그의 권능 앞에서
  - 그의 군대 앞에서
  lexicon: LSJ
  rationale: 본문의 δύναμις는 여기서 직접적으로 ‘능력’이라는 의미가 가장 분명하므로, 해석을 과도하게 좁히는 ‘군대’보다 원어 의미를 더 직접 반영한 ‘능력’을 택했습니다.
- source_word: καυχήσεται
  english_pob_choice: will boast
  chosen_korean: 자랑할 것입니다
  alternatives_korean:
  - 자랑스러워할 것입니다
  - 영광을 돌릴 것입니다
  lexicon: LSJ
  rationale: 동사의 기본 의미인 ‘boast/glory in’를 한국어의 자연스러운 동사 ‘자랑하다’로 옮겨, 수사적 자신감을 보존했습니다.
theological_decisions:
- issue: 본문의 여성 인칭과 인격화된 지혜의 지시 대상
  chosen_reading: 본문에는 ‘그녀’를 유지하고, 본문 안에 ‘지혜’라는 명칭을 덧붙이지 않았습니다.
  alternative_readings:
  - ‘지혜’로 명시하여 ‘지혜가 입을 열 것입니다’로 번역
  rationale: 주변 문맥이 인격화된 지혜를 가리키지만, 절 자체는 여성 대명사만 사용하므로 본문은 그 긴장을 보존하는 쪽이 더 충실합니다.
  doctrine_reference: 문맥이 밝히는 의미를 유지하되, 본문에 없는 명시를 덧붙이지 않습니다.
