lexical_decisions:
- source_word: Ἡ σοφία
  english_pob_choice: Wisdom
  chosen_korean: 지혜
  alternatives_korean:
  - 지혜(인격화된 지혜)
  lexicon: LSJ
  rationale: 여기서는 의인화가 분명하지만, 한국어 본문은 과도한 대문자화 없이 ‘지혜’로 두고 문맥이 인격적 표현임을 자연스럽게 드러내는 편이 합쇼체 본문에 적합합니다.
- source_word: αἰνέσει
  english_pob_choice: will praise
  chosen_korean: 찬양하고
  alternatives_korean:
  - 찬양할 것입니다
  - 칭송할 것입니다
  - 찬미할 것입니다
  lexicon: LSJ
  rationale: 미래 능동의 αἰνέω는 ‘찬양하다/칭송하다’의 뜻이므로, 현대 한국어에서 자연스럽고 직설적인 ‘찬양하다’를 택했습니다.
- source_word: ψυχὴν αὐτῆς
  english_pob_choice: herself
  chosen_korean: 자기 영
  alternatives_korean:
  - 자기 자신
  - 자기 자신을
  - 자기 혼
  lexicon: LSJ
  rationale: 직역하면 ‘자기 영/혼’이지만, 본문에서는 반사적 용법이므로 의미상은 ‘자기 자신’을 가리킵니다. 다만 한국어에서 ‘자기 영을 찬양하다’는 표현이 어색하여, 원문의 ‘ψυχή’를 살리면서도 의미를 전달하는 쪽으로 조정했습니다.
- source_word: ἐν μέσῳ λαοῦ αὐτῆς
  english_pob_choice: in the midst of her people
  chosen_korean: 자기 백성 가운데에서
  alternatives_korean:
  - 자기 백성 한복판에서
  - 자기 백성 가운데
  lexicon: LSJ
  rationale: ἐν μέσῳ는 공간적·수사적 중심을 나타내므로 ‘가운데에서’로 옮겼고, λαός는 여기서 공동체를 뜻하는 ‘백성’이 가장 자연스럽습니다.
- source_word: καυχήσεται
  english_pob_choice: she will boast
  chosen_korean: 자랑할 것입니다
  alternatives_korean:
  - 자랑할 것입니다
  - 자부할 것입니다
  - 뽐낼 것입니다
  lexicon: LSJ
  rationale: καυχάομαι는 문맥에 따라 ‘자랑하다/자부하다/영광을 말하다’의 뜻이 있으므로, 공적 선포의 뉘앙스를 살리면서도 과도한 자기과시로 들리지 않는 ‘자랑하다’를 택했습니다.
theological_decisions:
- issue: 의인화된 지혜의 인칭 표현
  chosen_reading: ‘지혜’가 여성 인칭으로 말하고 행동하는 의인화는 그대로 유지하되, 한국어에서는 자연스러운 서술형으로 옮겼습니다.
  alternative_readings:
  - 추상명사로만 처리하여 ‘지혜는 자신을 찬양합니다’라고 평면화함
  - 문학적 의인화를 약화시켜 중립적으로 옮김
  rationale: 원문은 여성형 문법과 인격적 행위를 통해 지혜를 화자로 제시하므로, 그 문학신학적 긴장을 유지하는 것이 स्रोत에 더 충실합니다.
  doctrine_reference: 'DOCTRINE.md: 원문이 지닌 문학적·신학적 긴장을 해소하지 말고 보존할 것'
- issue: ψυχὴν αὐτῆς의 반사적 의미
  chosen_reading: 문자적 ‘자기 영’의 어색함보다 반사적 의미를 우선하여, 지혜가 자기 자신을 높이는 뜻으로 읽었습니다.
  alternative_readings:
  - ‘그녀의 영혼’ 또는 ‘자기 영혼’으로 직역함
  - 의미를 약화해 단순한 자기 칭찬으로 축소함
  rationale: 영문 POB도 이 구절을 반사적 표현으로 판단했으며, 한국어 역시 본래 의미를 드러내는 쪽이 오해를 줄입니다.
  doctrine_reference: 'DOCTRINE.md: 사본·어휘가 허용하는 범위에서 의미를 우선하되, 과잉 해석은 피할 것'
