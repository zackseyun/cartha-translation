    reason: previous_rendering
translation:
  language: ko
  text: 그분은 세상이 있기 전에, 처음부터 저를 창조하셨고, 영원히 저는 사라지지 않을 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘세상이 있기 전에’는 αἰών을 시대로 좁히기보다, 여기서의 시간 이전성을 자연스럽게 풀어 옮긴 것입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘사라지지 않을 것입니다’는 οὐ μὴ ἐκλίπω의 강한 부정을 살린 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸ τοῦ αἰῶνος
  english_pob_choice: Before the age
  chosen_korean: 세상이 있기 전에
  alternatives_korean:
  - 시대가 있기 전에
  - 영원 전에
  - 세상이 시작되기 전에
  lexicon: LSJ
  rationale: αἰών이 여기서는 단순한 ‘한 시대’보다 시간의 시작 이전을 가리키므로, 한국어에서는 자연스럽게 ‘세상이 있기 전에’로 옮겨 전(前)창조적 선재를 드러냈습니다.
- source_word: ἀπʼ ἀρχῆς
  english_pob_choice: from the beginning
  chosen_korean: 처음부터
  alternatives_korean:
  - 태초부터
  - 시초부터
  - 시작부터
  lexicon: LSJ
  rationale: ἀρχῆς의 시작점 의미를 살리면서도 현대 한국어에서 과도하게 문어적인 느낌을 줄여 ‘처음부터’로 옮겼습니다.
- source_word: ἔκτισέν
  english_pob_choice: created
  chosen_korean: 창조하셨고
  alternatives_korean:
  - 만드셨고
  - 세우셨고
  - 지으셨고
  lexicon: LSJ
  rationale: κτίζω의 직접적인 의미는 ‘창조하다/세우다’이므로, 지혜의 기원에 대한 본문의 강한 표현을 약화하지 않도록 ‘창조하셨고’로 옮겼습니다.
- source_word: οὐ μὴ ἐκλίπω
  english_pob_choice: I will never cease
  chosen_korean: 저는 사라지지 않을 것입니다
  alternatives_korean:
  - 저는 결코 그치지 않을 것입니다
  - 저는 결코 사라지지 않을 것입니다
  - 저는 끝나지 않을 것입니다
  lexicon: LSJ
  rationale: 강한 부정 표현 οὐ μὴ는 단순한 완곡어보다 절대적 부정을 요구하므로, 존재의 지속을 살린 ‘사라지지 않을 것입니다’로 옮겼습니다.
theological_decisions:
- issue: 지혜의 선재와 창조 표현을 한국어에서 어떻게 보존할지
  chosen_reading: ‘세상이 있기 전에 … 저를 창조하셨고’로 직역성보다 본문의 선재·창조 긴장을 보존했습니다.
  alternative_readings:
  - ‘영원 전에 … 저를 세우셨고’
  - ‘세상이 있기 전에 … 저를 만드셨고’
  rationale: 본문은 personified Wisdom이 자신이 ‘창조되었다’고 말하는 구조이므로, 후대 신학적 난점을 피하려고 표현을 완화하지 않았습니다. 동시에 한국어에서는 의미가 자연스럽게 전달되도록 시제를 정리했습니다.
  doctrine_reference: Translation philosophy §1, §3
