  text: Come to me[a], you who desire me[b], and be filled with my fruits.
  footnotes:
  - marker: a
    text: Or 'you who long for me.' The Greek participle expresses strong desire.
    reason: lexical_alternative
  - marker: b
    text: Or 'my produce' or 'my yield.' The Greek refers to what is produced; 'fruits' is chosen to preserve the surrounding poetic imagery of Wisdom as a fruitful plant.
    reason: lexical_alternative
translation:
  language: ko
  text: 나에게 와라, 나를 간절히 바라는 너희여 — 내 열매로 배부르게 되어라.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘나를 그리워하는 너희여’. 그리스어 분사는 강한 욕구를 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘내 소출’ 혹은 ‘내 생산물’. 그리스어는 산출된 것을 가리키며, ‘열매’는 지혜를 풍성한 식물로 그리는 주변 이미지를 살리기 위해 택했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: προέλθετέ πρὸς μέ
  english_pob_choice: Come to me
  chosen_korean: 나에게 와라
  alternatives_korean:
  - 나에게로 오라
  - 내게 와라
  - 나에게 가까이 오너라
  lexicon: LSJ
  rationale: 초청의 명령형을 자연스러운 현대 한국어로 옮기되, 지혜가 직접 부르는 초대라는 어조를 살리기 위해 간결한 ‘와라’를 택했습니다.
- source_word: οἱ ἐπιθυμοῦντές μου
  english_pob_choice: you who desire me
  chosen_korean: 나를 간절히 바라는 너희여
  alternatives_korean:
  - 나를 원하는 너희여
  - 나를 갈망하는 너희여
  - 나를 사모하는 너희여
  lexicon: LSJ
  rationale: ἐπιθυμοῦντές의 강한 욕구를 단순한 ‘원하다’보다 강한 ‘간절히 바라다’로 옮겨, POB가 주석에서 밝힌 강한 desire의 뉘앙스를 반영했습니다.
- source_word: γενημάτων μου
  english_pob_choice: my fruits
  chosen_korean: 내 열매
  alternatives_korean:
  - 내 생산물
  - 내 소출
  - 내 열매들
  lexicon: LSJ
  rationale: γέννημα/γενημάτων의 ‘산출된 것’이라는 뜻을 살리면서도, 지혜의 식물적 이미지와 이어지는 시적 표현을 유지하기 위해 ‘열매’로 번역했습니다.
- source_word: ἐμπλήσθητε
  english_pob_choice: be filled
  chosen_korean: 배부르게 되어라
  alternatives_korean:
  - 채워져라
  - 충만하여라
  - 배불리 먹어라
  lexicon: LSJ
  rationale: 단순한 상태 변화보다 초대에 응답해 풍성히 누리는 이미지를 담기 위해 ‘배부르게 되어라’를 사용했으며, 본문의 은유를 과도하게 풀어 설명하지 않았습니다.
theological_decisions:
- issue: 의인화된 지혜의 자기 초청 유지
  chosen_reading: 지혜의 1인칭 초청을 그대로 유지하고, 열매를 교훈이나 은유의 해설로 바꾸지 않았습니다.
  alternative_readings:
  - ‘내 열매’를 ‘내 교훈’이나 ‘내 유익’으로 풀어쓰는 해석적 번역
  rationale: 본문은 의인화된 지혜가 직접 초대하는 시를 말하므로, 해설적 확장을 넣기보다 원문의 비유적 긴장을 보존하는 것이 적절합니다.
  doctrine_reference: 원문 우선 원칙; 비유의 해설적 평탄화 금지
