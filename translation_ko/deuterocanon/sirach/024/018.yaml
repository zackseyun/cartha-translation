  source_fidelity: 그리스어 ἐγὼ εἰμι μήτηρ τῆς καλῆς ἀγάπης καὶ φόβου καὶ γνώσεως καὶ ἁγίας ἐλπίδος를 충실히 옮겼습니다. ‘나는 … 어머니입니다’는 ἐγώ εἰμι μήτηρ를 자연스럽게 반영하며, 네 항목의 병렬 관계와 수식 범위(‘아름다운’은 사랑, ‘거룩한’은 소망)를 정확히 보존합니다.
