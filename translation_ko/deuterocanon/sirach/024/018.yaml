  terminology: μήτηρ를 ‘어머니’로, καλῆς ἀγάπης를 ‘아름다운 사랑’으로, φόβου를 해석적으로 좁히지 않은 ‘두려움’으로, γνώσεως를 ‘지식’으로, ἁγίας ἐλπίδος를 ‘거룩한 소망’으로 옮긴 선택이 적절합니다. 원문의 φόβος가 지닌 경외의 함의는 유지하되 특정 교리적 해석으로 고정하지 않았습니다.
