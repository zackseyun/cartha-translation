  text: I am the mother of beautiful love[a], and of fear, and of knowledge, and of holy hope[b];
  footnotes:
  - marker: a
    text: Or 'good love' or 'noble love'; Greek καλῆς can carry moral as well as aesthetic force.
    reason: lexical_alternative
  - marker: b
    text: Or 'reverence'; Greek φόβου in wisdom literature often denotes reverent fear, especially toward God.
    reason: lexical_alternative
translation:
  language: ko
  text: “나는 아름다운 사랑과 두려움과 지식과 거룩한 소망의 어머니입니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μήτηρ
  english_pob_choice: mother
  chosen_korean: 어머니
  alternatives_korean:
  - 어미
  - 근원
  lexicon: LSJ
  rationale: 지혜가 인격화되어 자신의 기원을 말하는 문맥이지만, 그 은유를 살리기 위해 추상화된 ‘근원’보다 친숙한 친족 은유인 ‘어머니’를 유지했습니다.
- source_word: καλῆς
  english_pob_choice: beautiful
  chosen_korean: 아름다운
  alternatives_korean:
  - 좋은
  - 고귀한
  - 아름다운
  lexicon: LSJ
  rationale: καλός는 ‘좋은/고귀한/아름다운’의 범위를 가지며, 여기서는 ἀγάπη와 결합한 시적 자기진술이므로 미학적·도덕적 뉘앙스를 함께 살릴 수 있는 ‘아름다운’이 가장 적절합니다.
- source_word: φόβου
  english_pob_choice: fear
  chosen_korean: 두려움
  alternatives_korean:
  - 경외
  - 경건한 두려움
  lexicon: LSJ
  rationale: 지혜문학에서 경외의 의미가 가능하지만, 원어가 명시적으로 그 의미로 제한하지 않으므로 ‘두려움’으로 옮겨 긴장을 보존했습니다.
- source_word: ἁγίας
  english_pob_choice: holy
  chosen_korean: 거룩한
  alternatives_korean:
  - 성스러운
  - 거룩한
  lexicon: LSJ
  rationale: ἅγιος의 일반적인 성경적 대응인 ‘거룩한’을 사용해 성서적 어조와 신학적 울림을 유지했습니다.
theological_decisions:
- issue: φόβος를 경외로 완화할지 여부
  chosen_reading: ‘두려움’으로 직역에 가깝게 두어, 지혜문학의 경외적 함의는 독자가 문맥에서 읽도록 남겨 둡니다.
  alternative_readings:
  - 경외
  - 경건한 두려움
  rationale: 본문은 단순히 φόβου라고 말할 뿐 설명을 덧붙이지 않으므로, 해석을 앞당겨 ‘경외’로 고정하기보다 원문의 긴장을 보존하는 것이 더 충실합니다.
  doctrine_reference: 'DOCTRINE.md: Preserve theological tension rather than resolve it.'
