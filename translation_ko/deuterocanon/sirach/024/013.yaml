  text: Like a cedar I was raised high in Lebanon[a], and like a cypress in the mountains of Hermon.
  footnotes:
  - marker: a
    text: Greek Ἀερμών reflects the place-name commonly rendered 'Hermon.'
    reason: lexical_alternative
translation:
  language: ko
  text: 레바논에서는 백향목처럼 높이 자라났고, 헤르몬의 산들에서는 노간주나무처럼 그러했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ἀερμών은 흔히 ‘헤르몬’으로 옮기는 지명입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς
  english_pob_choice: like
  chosen_korean: -처럼
  alternatives_korean:
  - 같이
  - 와 같이
  lexicon: LSJ
  rationale: 비교를 여는 ὡς의 비유 기능을 자연스럽게 살리기 위해 한국어 비유 표지 ‘-처럼’을 사용했습니다.
- source_word: κέδρος
  english_pob_choice: cedar
  chosen_korean: 백향목
  alternatives_korean:
  - 삼나무
  - 시더
  lexicon: LSJ
  rationale: 지중해 성경 전통에서 cedar에 대응하는 한국어 성경어로 ‘백향목’이 가장 널리 쓰이며, 레바논 이미지도 함께 살립니다.
- source_word: ἀνυψώθην
  english_pob_choice: was raised high
  chosen_korean: 높이 자라났고
  alternatives_korean:
  - 높이 उठ어졌고
  - 높이 올려졌고
  - 높이 들려졌고
  lexicon: LSJ
  rationale: 수동형의 높아짐을 그대로 담되, 나무 비유 안에서는 ‘자라나다’가 한국어로 더 자연스럽고 시각적입니다. ‘승귀/높임’의 신학적 뉘앙스를 과도하게 끌어오지 않도록 했습니다.
- source_word: κυπάρισσος
  english_pob_choice: cypress
  chosen_korean: 노간주나무
  alternatives_korean:
  - 사이프러스
  - 편백나무
  - 향나무
  lexicon: LSJ
  rationale: 그리스어 κυπάρισσος는 전통적으로 노간주나무/측백류로 번역되어 왔고, 여기서는 레바논의 백향목과 대구를 이루는 수목 이미지로 무난합니다.
- source_word: ἐν ὄρεσιν Ἀερμών
  english_pob_choice: in the mountains of Hermon
  chosen_korean: 헤르몬의 산들에서는
  alternatives_korean:
  - 헤르몬 산들에서는
  - 헤르몬의 산악지대에서는
  lexicon: LSJ
  rationale: 복수형 ὄρεσιν을 ‘산들’로 살리고, Ἀερμών은 POB 각주 취지에 맞춰 표준 지명 ‘헤르몬’으로 옮겼습니다.
theological_decisions:
- issue: 비유적 자기 진술의 높임 표현을 신학화할지 여부
  chosen_reading: ‘높이 자라났고’로 유지하여 나무 비유의 시각적 높이를 살립니다.
  alternative_readings:
  - ‘높임을 받았고’
  - ‘높이 들려졌고’
  rationale: 이 절은 지혜의 의인화된 자기진술이므로, ‘높임’의 존귀 의미를 강하게 주기보다 식물 비유의 문맥을 우선해 읽히게 하는 것이 원문에 더 가깝습니다.
  doctrine_reference: 비유와 의인화를 원문 수준에서 보존하고, 불필요한 교리적 확장을 피합니다.
