  to: 레바논의 백향목처럼 높이 솟아올랐으며, 헤르몬 산지의 사이프러스처럼 높이 솟아올랐습니다.[a]
  rationale: 수목명 κυπάρισσος를 ‘사이프러스’로 바로잡고, 두 병행 비유에 공통되는 ‘높이’의 이미지를 명시했습니다. ‘높이 솟아올랐습니다’는 나무 비유에 자연스러우면서도 ἀνυψώθην의 고양·높이 이미지를 보존하며, 과도하게 신학적 의미를 덧붙이지 않습니다.
