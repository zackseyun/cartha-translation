translation:
  language: ko
  text: 저는 포도나무처럼 은혜를 싹틔웠고, 내 꽃은 영광과 부의 열매입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘은혜’는 이 시적 문맥에서 ‘아름다움’, ‘호의’, ‘매력’의 뜻도 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘영광과 부의 열매’는 더 관용적으로 ‘영광과 부가 깃든 열매’ 또는 ‘영광스럽고 풍성한 열매’로도 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγώ
  english_pob_choice: I
  chosen_korean: 저는
  alternatives_korean:
  - 나는
  lexicon: BDAG
  rationale: 화자가 자신을 분명히 드러내는 1인칭 대명사를 자연스러운 현대 한국어로 살리되, 시적 자기선언의 공손한 합쇼체에 맞춰 ‘저는’을 택했습니다.
- source_word: ὡς ἄμπελος
  english_pob_choice: like a vine
  chosen_korean: 포도나무처럼
  alternatives_korean:
  - 포도나무와 같이
  - 한 포도나무처럼
  lexicon: BDAG
  rationale: 직유를 유지하면서도 한국어에서 자연스러운 식물 이미지로 옮겼습니다. ‘포도나무’는 속담적이거나 교회적 정형화 없이 원문 이미지를 직설적으로 전달합니다.
- source_word: βλαστήσασα χάριν
  english_pob_choice: put forth grace
  chosen_korean: 은혜를 싹틔웠고
  alternatives_korean:
  - 은혜를 내어놓았고
  - 은혜를 피워냈고
  - 은혜를 내었습니다
  lexicon: BDAG
  rationale: βλαστάνω의 ‘싹트다/돋다/자라나다’ 뉘앙스를 살려, χάριν을 단순한 미적 요소가 아니라 생명력 있게 ‘싹틔우는’ 것으로 표현했습니다. 영어 POB의 ‘put forth grace’에 대응하면서도 한국어 시어로 자연스럽습니다.
- source_word: τὰ ἄνθη μου
  english_pob_choice: my blossoms
  chosen_korean: 내 꽃은
  alternatives_korean:
  - 내 꽃망울은
  - 내 꽃송이들은
  lexicon: BDAG
  rationale: ἄνθη는 ‘꽃/꽃들’이지만, 포도나무 이미지에서는 ‘꽃’이 가장 간결하고 시적으로 맞습니다. 소유격을 분명히 해 원문의 1인칭 화자성을 보존했습니다.
- source_word: καρπὸς δόξης καὶ πλούτου
  english_pob_choice: the fruit of glory and wealth
  chosen_korean: 영광과 부의 열매
  alternatives_korean:
  - 영광과 부로 맺는 열매
  - 영광과 부를 띤 열매
  - 영광과 풍요의 열매
  lexicon: BDAG
  rationale: 그리스어의 속격 결합을 한국어 소유격 구조로 옮겨 ‘영광과 부의 열매’로 자연화했습니다. 영어 POB의 문맥처럼 결실의 성격을 드러내면서도 과도한 해석어를 덧붙이지 않았습니다.
theological_decisions:
- issue: χάρις의 의미 범위
  chosen_reading: ‘은혜’로 옮겨, 미적 아름다움과 호의/유익의 의미를 함께 열어 둡니다.
  alternative_readings:
  - 아름다움
  - 호의
  - 매력
  rationale: 지혜의 인격화된 자기표현이라는 문맥에서 χάρις는 단지 외적 아름다움만이 아니라, 사람에게 베푸는 호의와 생명력까지 함축할 수 있습니다. ‘은혜’는 이 긴장을 가장 잘 보존합니다.
  doctrine_reference: 'Translation philosophy: original-language primacy; lexical tension preserved.'
