  source_fidelity: 개정이 필요합니다. 헬라어 κατέπαυσεν의 주어는 본절에 명시되지 않았는데, 본문의 ‘그분’은 한국어에서 그 주어를 명시해 버립니다. 또한 ‘그분도 또한’은 ὁμοίως(‘또한/그와 같이’)를 주어에 부가하는 듯하여 원문의 연결 부사 기능을 다소 흐립니다. 주어를 생략하고 ‘-에서도’로 연결 관계를 나타내는 편이 원문에 더 충실합니다.
  naturalness: ‘그 사랑받는 도성에서도 나를 쉬게 하셨고’는 현대 한국어의 문장 흐름에 자연스럽고, 지혜문학에 알맞은 격조를 유지합니다. ‘도성’은 예루살렘과 병행되는 πόλις의 문맥에 적절합니다.
  terminology: ‘사랑받는’은 ἠγαπημένῃ의 수동적 뉘앙스를 보존하며, ‘권위’는 ἐξουσία의 추상적 의미를 적절히 옮깁니다. ‘쉬게 하셨고’는 κατέπαυσεν의 안식·정착 의미를 무리 없이 유지합니다.
  issues:
