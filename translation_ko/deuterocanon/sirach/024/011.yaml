translation:
  language: ko
  text: 그 사랑받는 도성에서도 나를 쉬게 하셨고, 예루살렘에는 내 권위가 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 본문의 ‘쉬게 하셨고’의 주어는 헬라어에서 생략되어 있습니다. 문맥상 하나님을 가리키는 것으로 이해되지만, 이 절 자체에는 명시되어 있지 않습니다.
    reason: source_note
lexical_decisions:
- source_word: πόλει ἠγαπημένῃ
  english_pob_choice: the beloved city
  chosen_korean: 그 사랑받는 도시
  alternatives_korean:
  - 그 사랑스러운 도시
  - 그 사랑하신 도시
  lexicon: LSJ
  rationale: ἠγαπημένῃ는 ‘사랑받은/사랑받는’의 뜻을 지니므로, 수동적 뉘앙스를 살려 ‘사랑받는’으로 옮겼습니다. ‘예루살렘’이 뒤에서 특정되므로 지시성을 위해 ‘그’를 보탰습니다.
- source_word: ὁμοίως
  english_pob_choice: likewise
  chosen_korean: 또한
  alternatives_korean:
  - 같이
  - 그와 같이
  lexicon: LSJ
  rationale: 앞선 문맥의 흐름을 이어 주는 연결어이므로, 한국어에서는 지나치게 딱딱하지 않으면서도 이어짐을 드러내는 ‘또한’이 자연스럽습니다.
- source_word: κατέπαυσεν
  english_pob_choice: he gave me rest
  chosen_korean: 나를 쉬게 하셨고
  alternatives_korean:
  - 나에게 안식을 주셨고
  - 나를 머물게 하셨고
  - 나를 정착시키셨고
  lexicon: LSJ
  rationale: 동사가 단순 휴식보다 ‘머무르게 하여 쉬게 함/정착시킴’까지 포괄하므로, 본문의 시적 톤을 유지하면서도 의미를 넓게 살리는 ‘쉬게 하셨고’로 옮겼습니다.
- source_word: ἐξουσία
  english_pob_choice: authority
  chosen_korean: 권위
  alternatives_korean:
  - 권한
  - 통치권
  - 권세
  lexicon: LSJ
  rationale: ἐξουσία는 단순 힘보다 정당한 권리·권위를 가리키므로, 도시적 지배를 과도하게 상상하게 하는 ‘통치권’보다 ‘권위’가 더 적절합니다.
theological_decisions:
- issue: κατέπαυσεν의 주어가 본문에 명시되지 않음
  chosen_reading: 주어를 특정하지 않고 ‘그분도 또한’으로 처리해 앞뒤 문맥상 암시된 주체를 드러내되, 본문 자체의 비명시성을 유지했습니다.
  alternative_readings:
  - 주님이 나를 쉬게 하셨고
  - 하나님이 나를 쉬게 하셨고
  rationale: 헬라어 본문은 남성 단수 주어를 전제하지만 이 절만 놓고 보면 명시하지 않습니다. 한국어 본문은 문맥의 신적 주체를 암시하면서도, 본절의 직접 표현을 넘어서 과잉 확정하지 않도록 했습니다.
  doctrine_reference: 문맥적 주체의 암시를 보존하되 본문 미표시 요소를 과도하게 명시하지 않음
- issue: ‘예루살렘에는 내 권위가 있었습니다’의 시제 처리
  chosen_reading: 완료된 과거 서술로 ‘있었습니다’를 사용했습니다.
  alternative_readings:
  - 있습니다
  - 있었고
  rationale: 문맥상 지혜가 시온/예루살렘에 자리 잡은 역사적 서술이므로, 현재형보다 과거형이 더 적절합니다. 영어 POB의 과거형 처리도 이를 지지합니다.
  doctrine_reference: 지혜의 역사적 안착을 나타내는 서술 시제 유지
