translation:
  language: ko
  text: 나는 다시 한 번 교훈을 새벽처럼 비추겠습니다. 그리고 그것들을 먼 곳까지 드러내겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 단수 ‘교훈’ 뒤에 중성 복수 ‘그것들’을 사용합니다. 이는 지혜의 가르침의 내용들을 가리키는 것으로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔτι
  english_pob_choice: again
  chosen_korean: 다시 한 번
  alternatives_korean:
  - 또
  - 여전히
  - 한 번 더
  lexicon: LSJ
  rationale: 추가적·계속적 의미를 살려, 단순 반복보다 진행을 나타내는 ‘다시 한 번’으로 옮겼습니다.
- source_word: παιδείαν
  english_pob_choice: instruction
  chosen_korean: 교훈
  alternatives_korean:
