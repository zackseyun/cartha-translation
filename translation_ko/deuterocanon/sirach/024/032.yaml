- source_word: ἐκφανῶ αὐτὰ ἕως εἰς μακράν
  english_pob_choice: I will bring these things to light far into the distance
  chosen_korean: 그것들을 먼 곳까지 드러내겠습니다
  alternatives_korean:
  - 그것들을 멀리까지 밝히겠습니다
  - 그것들을 먼 데까지 나타내겠습니다
  - 그것들을 널리 드러내겠습니다
  lexicon: LSJ
  rationale: ἐκφανῶ의 핵심은 ‘드러내다/드러나게 하다’이므로, 빛의 이미지를 유지하면서도 한국어로 자연스러운 ‘드러내다’를 택했습니다. ἕως εἰς μακράν은 범위를 넓게 펼치는 뜻을 살려 ‘먼 곳까지’로 옮겼습니다.
theological_decisions:
- issue: αὐτά의 지시 대상이 단수 ‘교훈’에서 복수 ‘그것들’로 바뀌는 문제
  chosen_reading: 한국어 본문에서는 ‘그것들’로 옮겨, 지혜의 가르침에서 나온 구체적 내용들을 가리키는 복수성을 드러냈습니다.
  alternative_readings:
  - ‘그것’을 써서 단수 ‘교훈’에 맞출 수 있음
  - ‘이것들을’로 더 가까운 지시를 만들 수 있음
  rationale: 그리스어는 단수 παιδείαν 뒤에 중성 복수 αὐτά를 사용하므로, 단수 개념만으로 평탄화하지 않고 복수 지시의 긴장을 보존했습니다.
  doctrine_reference: 원문이 가진 문법적 긴장 보존
