translation:
  language: ko
  text: 나는 다시 한 번 교훈을 새벽처럼 비추며, 그것들을 먼 곳까지 드러내겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 단수 ‘교훈’ 뒤에 중성 복수 ‘그것들’을 사용합니다. 이는 지혜의 가르침의 내용들을 가리키는 것으로 보입니다.
    reason: theological_note
