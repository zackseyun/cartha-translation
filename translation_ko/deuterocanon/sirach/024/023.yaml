- source_word: βίβλος διαθήκης
  english_pob_choice: the book of the covenant
  chosen_korean: 언약의 책
  alternatives_korean:
  - 계약서
  - 성약의 책
  lexicon: LSJ
  rationale: βίβλος와 διαθήκη의 결합을 직역해, 하나님의 계시를 담은 언약 문서라는 의미를 분명히 했습니다.
- source_word: θεοῦ Ὑψίστου
  english_pob_choice: God Most High
  chosen_korean: 지극히 높으신 하나님
  alternatives_korean:
  - 가장 높으신 하나님
  - 지존하신 하나님
  lexicon: LSJ
  rationale: ‘Most High’의 비교급적 뉘앙스를 표준적 예배 언어로 살리되, 문어체로 자연스럽게 표현했습니다.
- source_word: συναγωγαῖς
  english_pob_choice: assemblies
  chosen_korean: 회중들에게
  alternatives_korean:
  - 모임들에게
  - 집회들에게
  - 공동체들에게
  lexicon: LSJ
  rationale: 후대 제도명인 ‘회당’으로 고정하지 않고, 함께 모인 이스라엘 공동체라는 기본 의미를 살렸습니다.
- source_word: Ἰακώβ
  english_pob_choice: Jacob
  chosen_korean: 야곱
  alternatives_korean:
  - 이스라엘
  lexicon: LSJ
  rationale: 본문의 고유명사를 그대로 유지해, 해석적 치환 없이 원문 표지를 보존했습니다.
theological_decisions:
- issue: διαθήκη의 번역
  chosen_reading: ‘언약’으로 번역해, 토라가 단순한 문서가 아니라 하나님과 백성 사이의 언약적 질서를 담은 책이라는 점을 드러냈습니다.
  alternative_readings:
  - ‘유언’
  - ‘계약’
  rationale: 시락의 문맥과 유대-성경적 용례에서 διαθήκη는 명백히 언약 의미가 우세하므로, 신학적 연속성을 유지하는 번역이 필요합니다.
  doctrine_reference: 'DOCTRINE.md: original-language primacy / covenant terminology'
- issue: συναγωγαῖς의 교회제도화 여부
  chosen_reading: ‘회중들’로 이해해, 후대 제도인 ‘회당’이나 ‘교회’로 좁히지 않았습니다.
  alternative_readings:
  - ‘회당들’
  - ‘교회들’
  rationale: 본문 시기와 어휘상 초점은 제도명보다 이스라엘의 모인 공동체에 있으므로, 역사적 과잉투사를 피했습니다.
  doctrine_reference: 'DOCTRINE.md: historical-context fidelity'
