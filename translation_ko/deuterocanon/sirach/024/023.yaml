  source_fidelity: 본문의 핵심 의미는 충실합니다. ταῦτα πάντα를 ‘이 모든 것들’, βίβλος διαθήκης를 ‘언약의 책’, νόμον을 ‘율법’, κληρονομίαν을 ‘유산으로’, συναγωγαῖς Ἰακώβ를 ‘야곱의 회중들’로 옮긴 것은 적절합니다. 다만 συναγωγαῖς 관련 주석 표지는 해당 표현 바로 뒤에 두는 편이 정확합니다.
