  text: All these things are the book of the covenant of God Most High[b][a], the law that Moses commanded as an inheritance for the assemblies of Jacob.
  footnotes:
  - marker: a
    text: Or 'the Most High God.' The Greek word order can be represented either way in English.
    reason: lexical_alternative
  - marker: b
    text: Or 'for the congregations of Jacob.' The Greek συναγωγαῖς here likely means the assembled communities of Israel, not necessarily later synagogue institutions.
    reason: lexical_alternative
translation:
  language: ko
  text: 이 모든 것들은 지극히 높으신 하나님[a]의 언약의 책, 곧 모세가 야곱의 회중들에게[b] 유산으로 명령한 율법입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘가장 높으신 하나님’으로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘야곱의 모인 공동체들’입니다. 여기의 συναγωγαῖς는 후대의 제도적 ‘회당’보다 이스라엘의 모인 공동체를 가리킬 가능성이 큽니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα πάντα
  english_pob_choice: All these things
  chosen_korean: 이 모든 것들은
  alternatives_korean:
