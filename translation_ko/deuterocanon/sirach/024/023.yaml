  - 지존하신 하나님
  lexicon: LSJ
  rationale: ‘Most High’의 비교급적 뉘앙스를 표준적 예배 언어로 살리되, 문어체로 자연스럽게 표현했습니다.
- source_word: συναγωγαῖς
  english_pob_choice: assemblies
