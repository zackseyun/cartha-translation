  rationale: 본문의 고유명사를 그대로 유지해, 해석적 치환 없이 원문 표지를 보존했습니다.
theological_decisions:
- issue: διαθήκη의 번역
  chosen_reading: ‘언약’으로 번역해, 토라가 단순한 문서가 아니라 하나님과 백성 사이의 언약적 질서를 담은 책이라는 점을 드러냈습니다.
  alternative_readings:
  - ‘유언’
  - ‘계약’
  rationale: 시락의 문맥과 유대-성경적 용례에서 διαθήκη는 명백히 언약 의미가 우세하므로, 신학적 연속성을 유지하는 번역이 필요합니다.
  doctrine_reference: 'DOCTRINE.md: original-language primacy / covenant terminology'
- issue: συναγωγαῖς의 교회제도화 여부
  chosen_reading: ‘회중들’로 이해해, 후대 제도인 ‘회당’이나 ‘교회’로 좁히지 않았습니다.
  alternative_readings:
  - ‘회당들’
  - ‘교회들’
  rationale: 본문 시기와 어휘상 초점은 제도명보다 이스라엘의 모인 공동체에 있으므로, 역사적 과잉투사를 피했습니다.
  doctrine_reference: 'DOCTRINE.md: historical-context fidelity'
