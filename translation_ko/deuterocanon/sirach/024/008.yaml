translation:
  language: ko
  text: 그때 모든 것의 창조주께서 나에게 명령하셨고, 나를 지으신 분이 내 장막을 치시고 말씀하셨습니다. “야곱에 머무르십시오[b][c], 이스라엘에서 당신의 몫을 받으십시오[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “이스라엘에서 기업을 받으십시오” / “이스라엘에서 분배받으십시오.” 그리스어 동사는 상속과 분배의 이미지를 담고 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “야곱에 거하십시오” / “야곱에 장막을 치십시오.”
    reason: lexical_alternative
  - marker: c
    text: 또는 “그러고 나서 모든 것의 창조주께서 나에게 명령하시고, 나를 지으신 분이 내 장막을 치시고 말씀하셨습니다. ‘야곱에 머무르십시오, 이스라엘에서 당신의 몫을 받으십시오.’”
    reason: previous_rendering
lexical_decisions:
- source_word: ὁ κτίστης ἁπάντων
  english_pob_choice: the Creator of all
  chosen_korean: 모든 것의 창조주
  alternatives_korean:
  - 만물을 지으신 분
  - 모든 것의 만드신 이
  lexicon: LSJ
  rationale: κτίστης는 창조주/만드신 이를 뜻하므로, ἁπάντων의 포괄성을 살려 '모든 것의 창조주'로 옮겼습니다.
- source_word: ἐνετείλατό
  english_pob_choice: commanded
  chosen_korean: 명령하셨고
  alternatives_korean:
  - 지시하셨고
  - 명하셨고
  lexicon: BDAG
  rationale: ἐντέλλομαι의 직접적인 명령 의미를 살리되, 한국어에서는 자연스럽게 '명령하셨고'로 표현했습니다.
- source_word: κατέπηξεν τὴν σκηνήν μου
  english_pob_choice: pitched my tent
  chosen_korean: 내 장막을 치시고
  alternatives_korean:
  - 내 장막을 세우시고
  - 내 거처를 마련하시고
  - 내 성막을 세우시고
  lexicon: LSJ
  rationale: καταπήγνυμι는 천막을 '치다/박다'는 구체적 이미지를 가지므로, '장막을 치시고'로 옮겨 원문의 텐트 비유를 유지했습니다.
- source_word: κατακληρονομήθητι
  english_pob_choice: receive your inheritance
  chosen_korean: 네 몫을 받으라
  alternatives_korean:
  - 네 기업을 받으라
  - 이스라엘에서 분배받으라
  - 네 상속을 받으라
  lexicon: LSJ
  rationale: 이 동사는 분깃/상속의 배당 의미를 담으므로, 한국어에서 자연스럽고 분배 이미지를 보존하는 '네 몫을 받으라'로 옮겼습니다.
theological_decisions:
- issue: 지혜의 인격화와 창조주-피조물 구분
  chosen_reading: 지혜의 1인칭 음성을 그대로 살리면서도, '모든 것의 창조주'와 '나를 지으신 분'을 분명히 구분해 창조주와 피조물의 구분을 흐리지 않았습니다.
  alternative_readings:
  - 지혜를 더 추상적으로 바꾸어 인격성을 약화시키는 해석
  - 성막/성전 용어를 덧붙여 예전적 의미를 강화하는 해석
  rationale: 원문은 지혜를 인격적으로 말하게 하면서도 하나님께 창조된 존재로 제시하므로, 그 긴장을 해소하지 않고 그대로 전달하는 것이 가장 충실합니다.
  doctrine_reference: 지혜문학의 인격화와 창조 질서의 구분을 유지함
- issue: 야곱/이스라엘의 병행과 거주·상속 명령
  chosen_reading: '''야곱 안에 거하라, 이스라엘 안에서 네 몫을 받으라''의 병행을 살려, 공동체 안의 거주와 분깃 배정을 함께 드러냈습니다.'
  alternative_readings:
  - '''야곱에서 장막을 치라''처럼 더 유목적으로 옮기는 방식'
  - '''이스라엘에서 상속받으라''처럼 법적 용어를 강하게 드러내는 방식'
  rationale: 원문의 병행 구조가 지혜의 거처와 분깃을 연결하므로, 두 동사를 각각 살려 공동체적·상속적 의미를 함께 전달했습니다.
  doctrine_reference: 이스라엘 안에서의 거주와 분깃 부여라는 본문 의미 보존
