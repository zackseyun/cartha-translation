  yaml_path: translation/deuterocanon/sirach/024/012.yaml
  text: And I took root among a glorified people[a], in the portion of the Lord[b], his inheritance.
  footnotes:
  - marker: a
    text: Or, 'among a glorious people.' The Greek participle can be taken more adjectivally, though the main text preserves its verbal/resultative force.
    reason: lexical_alternative
  - marker: b
    text: The phrase 'in the portion of the Lord, his inheritance' may also be rendered 'in the portion of the Lord's inheritance' or 'in the Lord's allotted inheritance.'
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 나는 영광을 받은 백성[a] 가운데, 주님의 몫, 곧 그분의 유업 안에[b] 뿌리내렸습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘영광을 받은 백성’은 완료수동 분사 δεδοξασμένῳ의 결과 상태를 살린 번역입니다. 더 형용사적으로는 ‘영광스러운 백성’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘주님의 몫, 곧 그분의 유업 안에’는 ‘주님의 유업의 몫 안에’ 또는 ‘주님이 정하신 유업 안에’처럼 옮길 수도 있습니다. 그리스어의 소유격 관계는 압축되어 있어 다소 모호합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐρρίζωσα
  english_pob_choice: I took root
  chosen_korean: 뿌리내렸습니다
  alternatives_korean:
  - 뿌리를 내렸습니다
  - 정착했습니다
  lexicon: LSJ
  rationale: 첫인칭 능동의 ‘뿌리내리다’는 원문의 결과적·능동적 뉘앙스를 자연스럽게 살리면서도 한국어 문장으로 무리 없이 읽힙니다.
- source_word: λαῷ δεδοξασμένῳ
  english_pob_choice: a glorified people
  chosen_korean: 영화로운 백성
  alternatives_korean:
  - 영화롭게 된 백성
  - 영광스러운 백성
  lexicon: LSJ
  rationale: δεδοξασμένῳ의 완료수동 분사 의미를 살리되, 한국어에서는 ‘영화로운’이 상태 결과를 간결하게 드러내어 본문의 수여된 영광을 반영합니다.
- source_word: μερίδι Κυρίου
  english_pob_choice: the portion of the Lord
  chosen_korean: 주님의 몫
  alternatives_korean:
  - 주님의 분깃
  - 주님의 몫으로 주어진 부분
  lexicon: LSJ
  rationale: μερίς는 ‘분깃/몫’의 의미가 강하므로, 할당된 몫이라는 뉘앙스를 살려 ‘주님의 몫’으로 옮겼습니다.
- source_word: κληρονομίας αὐτοῦ
  english_pob_choice: his inheritance
  chosen_korean: 그의 유업
  alternatives_korean:
  - 그의 상속
  - 그의 기업
  lexicon: LSJ
  rationale: κληρονομία는 상속받는 몫이라는 의미가 있으므로, 교회적 관용어이면서도 문맥의 상속·배분 의미를 살리는 ‘유업’이 적절합니다.
theological_decisions:
- issue: δεδοξασμένῳ를 단순 형용사로 평탄화할지, 완료수동 분사로서 ‘되어진 영광’의 결과성을 유지할지
  chosen_reading: 결과성을 살려 ‘영화로운’으로 옮깁니다.
  alternative_readings:
  - 영광스러운 백성
  - 영화롭게 된 백성
  rationale: 원문은 단순 속성보다 ‘영광을 입은 상태’의 결과를 암시하므로, 한국어에서도 그 수여된 상태를 유지하는 번역이 더 원문 충실적입니다.
  doctrine_reference: Translation philosophy §1, §5
- issue: ἐν μερίδι Κυρίου κληρονομίας αὐτοῦ의 압축된 소유격 관계를 어떻게 풀지
  chosen_reading: ‘주님의 몫이요 그의 유업 안에’로 병렬·관계성을 유지합니다.
  alternative_readings:
  - 주님의 유업의 몫 안에
  - 주님의 할당된 유업 안에
  rationale: 그리스어는 압축적이고 다소 병렬적이어서, 한국어에서도 해설적으로 풀기보다 ‘몫/유업’의 관계를 유지해 원문 구조를 투명하게 드러냅니다.
  doctrine_reference: Translation philosophy §1, §3, §5
