  source_fidelity: ‘뿌리내렸습니다’는 ἐρρίζωσα의 1인칭 능동 의미를 자연스럽게 반영합니다. 그러나 δεδοξασμένῳ는 완료수동분사이므로 ‘영화로운’보다 ‘영광을 받은’이 수여된 영광의 결과 상태를 더 분명히 드러냅니다. 또한 ‘주님의 몫이요 그의 유업’은 한국어에서 병렬 명사구가 다소 불명확하므로, 원문의 압축적 동격 관계를 ‘곧’으로 표시하는 편이 안전합니다.
  naturalness: ‘영화로운’은 현대 표준 한국어에서 다소 문어적이며 ‘영화(榮華)를 누리는’ 쪽으로도 읽힐 수 있습니다. ‘영광을 받은 백성’은 현대적인 문어체로 자연스럽고 원문의 수동성을 보존합니다. 각주 표지도 해당 어구 바로 뒤에 두어 참조 범위를 명확히 했습니다.
  terminology: ‘주님’, ‘몫’, ‘유업’은 일관되고 적절합니다. ‘그분’은 αὐτοῦ의 선행사인 주님을 한국어에서 분명하고 존중하는 방식으로 가리킵니다. ‘영광을 받은’은 δεδοξασμένῳ의 완료수동 의미에 적합합니다.
