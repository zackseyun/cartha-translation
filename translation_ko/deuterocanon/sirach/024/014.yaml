  yaml_path: translation/deuterocanon/sirach/024/014.yaml
  text: Like a palm tree I was raised high on the shores[a], and like rose plants in Jericho; like a splendid olive tree in the plain[b], and I was raised high like a plane tree.
  footnotes:
  - marker: a
    text: Greek reads 'in the seashores.' Some interpreters suspect a different underlying setting because the image of a palm is more commonly associated with oasis or riverbank environments, but the extant Greek witness here supports 'seashores.'
    reason: lexical_alternative
  - marker: b
    text: Or 'Like a palm tree I was raised up in the seashores, and like rose plants in Jericho; like a splendid olive tree in the plain, and I was raised up like a plane tree.'.
    reason: previous_rendering
translation:
  language: ko
  text: 마치 종려나무처럼 나는 해변들[a]에서 높이 솟아 있었고, 여리고의 장미나무들처럼, 마치 평야의 빛나는 올리브나무처럼, 또 나는 플라타너스처럼 높이 솟아 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 ‘해변들’(in the seashores)이라고 읽습니다. 일부 해석자들은 야자수 이미지 때문에 오아시스나 강가 환경을 추정하지만, 전승된 그리스어 본문은 여기서 ‘해변들’을 지지합니다.
    reason: source_note
