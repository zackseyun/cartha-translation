  - ‘커졌습니다’처럼 성장만 강조하는 방식
  rationale: 본문의 핵심은 지혜가 다양한 장소와 나무 이미지로 비견되며 고양된 상태를 말하는 데 있으므로, 물리적·상징적 상승을 함께 보존했습니다.
  doctrine_reference: 문학적-지혜문학적 이미지 보존
