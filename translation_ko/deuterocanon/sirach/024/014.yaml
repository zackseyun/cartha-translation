  lexicon: LSJ
  rationale: 건축적·시적 비유에서 φοῖνιξ는 한국어 성경어법상 종려나무가 가장 자연스럽고, palm tree의 이미지를 비교적 정확히 옮깁니다.
- source_word: ἀνυψώθην
  english_pob_choice: was raised high
  chosen_korean: 높이 솟아 있었고
  alternatives_korean:
  - 높이 세워졌고
  - 들려 올려졌고
  - 높여졌고
  lexicon: LSJ
  rationale: 단순한 ‘올려짐’보다 수직적 상승과 비유적 고양을 함께 드러내기 위해 ‘높이 솟다’를 택했습니다.
- source_word: αἰγιαλοῖς
  english_pob_choice: shores
  chosen_korean: 해변들
  alternatives_korean:
  - 해안들
  - 물가들
  - 바닷가
  lexicon: LSJ
  rationale: ἐν αἰγιαλοῖς의 지리적 이미지를 살리면서도 한국어에서 자연스럽게 읽히는 표현으로 옮겼습니다.
- source_word: φυτὰ ῥόδου
  english_pob_choice: rose plants
  chosen_korean: 장미나무들
  alternatives_korean:
  - 장미식물들
  - 장미덩굴들
  - 장미나무
  lexicon: LSJ
  rationale: φυτά는 ‘심긴 식물들’이므로, 복수의 식물 이미지를 유지하는 범위에서 ‘장미나무들’로 옮겼습니다.
- source_word: ἐλαία εὐπρεπής
  english_pob_choice: splendid olive tree
  chosen_korean: 빛나는 올리브나무
  alternatives_korean:
  - 아름다운 올리브나무
  - 근사한 올리브나무
  - 장엄한 올리브나무
  lexicon: LSJ
  rationale: εὐπρεπής의 품위 있고 보기 좋은 뉘앙스를 ‘빛나는’으로 압축해, 시적 장엄함과 현대 한국어의 자연스러움을 함께 살렸습니다.
- source_word: πλάτανος
  english_pob_choice: plane tree
  chosen_korean: 플라타너스
  alternatives_korean:
  - 버즘나무
  - 플레인 트리
  lexicon: LSJ
  rationale: πλάτανος는 별도의 나무 종이므로, 성경적 오해를 피하면서도 현대 독자에게 분명한 외래어 표기인 플라타너스를 사용했습니다.
theological_decisions:
- issue: 시적 1인칭 화자의 자기비유를 한국어에서 어떻게 유지할지
  chosen_reading: 화자의 ‘높이 솟아 있음’을 반복해, 지혜의 고양과 성장 이미지를 그대로 드러냈습니다.
  alternative_readings:
  - ‘높임을 받았습니다’처럼 더 추상적으로 옮기는 방식
  - ‘커졌습니다’처럼 성장만 강조하는 방식
  rationale: 본문의 핵심은 지혜가 다양한 장소와 나무 이미지로 비견되며 고양된 상태를 말하는 데 있으므로, 물리적·상징적 상승을 함께 보존했습니다.
  doctrine_reference: 문학적-지혜문학적 이미지 보존
