revisions:
- from: 첫 사람이 그것을 다 알지는 못하였고, 그와 같이 마지막 사람도 그것을 다 찾아내지 못하였습니다.
  to: 첫 사람은 그녀를 온전히 알지 못하였고, 그와 같이 마지막 사람도 그녀를 끝까지 찾아내지 못하였습니다.
  rationale: 여성으로 의인화된 지혜를 가리키는 대명사를 ‘그녀’로 바로잡아 원문의 인칭성과 성을 보존했습니다. ‘첫 사람’과 ‘마지막 사람’의 대조는 유지하되, 아담이나 특정 종말론적 인물을 본문에 삽입하지 않았습니다. ‘온전히’와 ‘끝까지’는 각각 συνετέλεσεν과 ἐξιχνίασεν의 완결·철저성의 뉘앙스를 자연스럽게 반영합니다.
