translation:
  language: ko
  text: 첫 사람은 그녀를 온전히 알지 못하였고, 그와 같이 마지막 사람도 그녀를 끝까지 찾아내지 못하였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐ συνετέλεσεν
  english_pob_choice: did not finish
  chosen_korean: 다 알지는 못하였고
  alternatives_korean:
  - 끝내 알지는 못하였고
  - 완전히 알지는 못하였고
  lexicon: LSJ
  rationale: συνετέλεσεν의 ‘끝내/완전히 이르지 못함’과 γνῶναι의 ‘알다’ 의미를 함께 살려, 지혜를 온전히 파악하지 못했다는 뜻을 자연스럽게 전달했습니다.
- source_word: ὁ πρῶτος
  english_pob_choice: the first
  chosen_korean: 첫 사람
  alternatives_korean:
  - 첫째는
  - 처음 사람
  lexicon: LSJ
  rationale: 문맥상 보편적 인류의 첫 인간을 가리키는 substantival 표현이므로, 한국어에서는 ‘첫 사람’으로 옮겨 대비 구조를 분명히 했습니다.
- source_word: γνῶναι αὐτήν
  english_pob_choice: knowing her
  chosen_korean: 그것을 다 알다
  alternatives_korean:
  - 그녀를 다 알다
  - 그것을 알다
  lexicon: LSJ
  rationale: 지혜가 여성으로 의인화되어 있어 원문상 인칭성이 있으나, 한국어에서는 성별 인칭 대명사보다 지시대명사 ‘그것’을 써서 문맥의 대상성도 함께 드러내었습니다.
- source_word: καὶ οὕτως
  english_pob_choice: likewise
  chosen_korean: 그와 같이
  alternatives_korean:
  - 이와 같이
  - 마찬가지로
  lexicon: LSJ
  rationale: 두 절의 관계가 인과가 아니라 평행 대비이므로, ‘그와 같이’로 반복되는 구조를 살렸습니다.
- source_word: οὐκ ἐξιχνίασεν
  english_pob_choice: did not trace her out
  chosen_korean: 다 찾아내지 못하였습니다
  alternatives_korean:
  - 끝내 찾아내지 못하였습니다
  - 완전히 추적하지 못하였습니다
  lexicon: LSJ
  rationale: ἐξιχνιάζω의 ‘추적하여 찾아내다/밝혀내다’ 뉘앙스를 살리되, 한국어에서는 ‘찾아내다’가 가장 자연스럽고 본문의 탐구적 의미를 잘 전달합니다.
theological_decisions:
- issue: 의인화된 지혜의 인칭성 유지 방식
  chosen_reading: 한국어 본문에서는 여성 대명사 대신 중립적 지시대명사 ‘그것’을 사용했습니다.
  alternative_readings:
  - ‘그녀’를 사용해 여성 의인화를 직역하기
  - ‘지혜를’로 명시해 대명사 생략하기
  rationale: Sirach 24의 지혜는 문학적으로 여성 인격체로 그려지지만, 한국어 합쇼체 본문에서는 성별 인칭대명사보다 ‘그것’을 택해 과도한 의인화의 어색함을 피하면서도 대상의 동일성을 유지했습니다.
  doctrine_reference: Translation philosophy §4 (gender-accurate over gender-neutral)
