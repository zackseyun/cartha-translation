  source_fidelity: 수정이 필요합니다. αὐτήν은 앞 문맥에서 여성으로 의인화되어 말하는 지혜를 가리키는데, ‘그것’은 이 인칭적·여성적 지시를 평면화합니다. 또한 ὁ πρῶτος와 ὁ ἔσχατος는 대조되는 명사화 표현일 뿐, ‘첫 인간’이라는 해석을 본문에 확정하여 넣을 근거는 없습니다. ‘첫 사람/마지막 사람’은 원문의 열린 지시를 비교적 잘 보존합니다.
  naturalness: ‘그녀’는 한국어에서 다소 표시적인 표현이지만, 본 절은 의인화된 지혜를 가리키므로 문맥상 자연스럽게 이해됩니다. ‘온전히 알지 못하다’와 ‘끝까지 찾아내지 못하다’는 각각 완료되지 않은 앎과 철저한 탐구의 실패를 자연스러운 합쇼체로 드러냅니다.
  terminology: 지혜의 여성 의인화를 ‘그녀’로 유지했습니다. ‘그와 같이’는 인과가 아닌 평행 관계인 καὶ οὕτως를 적절히 반영합니다. ‘끝까지 찾아내다’는 ἐξιχνιάζω의 철저히 추적·탐구한다는 뉘앙스를 보존합니다.
