lexical_decisions:
- source_word: Ἐγὼ
  english_pob_choice: I
  chosen_korean: 나는
  alternatives_korean:
  - 내가
  lexicon: SBLGNT / Korean syntax
  rationale: 첫머리의 1인칭 주어를 자연스럽게 살리되, 시적 자기선언의 흐름을 해치지 않도록 평이한 주어형으로 옮겼습니다.
- source_word: ἀπὸ στόματος Ὑψίστου
  english_pob_choice: from the mouth of the Most High
  chosen_korean: 가장 높으신 분의 입에서
  alternatives_korean:
  - 지극히 높으신 분의 입에서
  - 지존자의 입에서
  lexicon: BDAG / LXX usage
  rationale: στόμα를 문자적으로 '입'으로 유지해 발화와 기원의 이미지를 보존했고, Ὑψίστου는 경전적 호칭의 의미를 살려 '가장 높으신 분'으로 옮겼습니다.
- source_word: ἐξῆλθον
  english_pob_choice: came forth
  chosen_korean: 나왔고
  alternatives_korean:
  - 나가고
  - 나타났고
  - 나아왔고
  lexicon: BDAG
  rationale: '''came forth''의 출현·기원 뉘앙스를 살리면서도 한국어에서 가장 직접적이고 문학적인 동사로 처리했습니다.'
- source_word: ὡς ὁμίχλη κατεκάλυψα γῆν
  english_pob_choice: like a mist I covered the earth
  chosen_korean: 안개처럼 땅을 덮었습니다
  alternatives_korean:
  - 안개처럼 세상을 덮었습니다
  - 안개처럼 온 땅을 덮었습니다
  lexicon: LSJ / BDAG
  rationale: ὁμίχλη는 '안개'가 현대 한국어에서 가장 자연스럽고, γῆν은 이 문맥에서 포괄적 공간을 가리키므로 '땅'으로 옮겨 시적 이미지를 간결하게 살렸습니다.
theological_decisions:
- issue: 지혜의 인격화와 기원 진술
  chosen_reading: 지혜의 첫인칭 기원 진술을 약화하지 않고 그대로 유지했습니다.
  alternative_readings:
  - '''가장 높으신 분께서 나를 보내셨습니다'''
  - '''가장 높으신 분의 뜻에서 나왔습니다'''
  rationale: 헬라어는 지혜를 1인칭으로 말하게 하며 '입에서 나왔다'는 기원 이미지를 제시하므로, 이를 설명문으로 풀지 않고 시적·신학적 긴장을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Preserve theological tension rather than resolve it.'
