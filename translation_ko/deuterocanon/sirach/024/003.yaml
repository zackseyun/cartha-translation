- source_word: ἀπὸ στόματος Ὑψίστου
  english_pob_choice: from the mouth of the Most High
  chosen_korean: 가장 높으신 분의 입에서
  alternatives_korean:
  - 지극히 높으신 분의 입에서
  - 지존자의 입에서
  lexicon: BDAG / LXX usage
  rationale: στόμα를 문자적으로 '입'으로 유지해 발화와 기원의 이미지를 보존했고, Ὑψίστου는 경전적 호칭의 의미를 살려 '가장 높으신 분'으로 옮겼습니다.
- source_word: ἐξῆλθον
  english_pob_choice: came forth
  chosen_korean: 나왔고
  alternatives_korean:
  - 나가고
  - 나타났고
  - 나아왔고
  lexicon: BDAG
  rationale: '''came forth''의 출현·기원 뉘앙스를 살리면서도 한국어에서 가장 직접적이고 문학적인 동사로 처리했습니다.'
- source_word: ὡς ὁμίχλη κατεκάλυψα γῆν
  english_pob_choice: like a mist I covered the earth
  chosen_korean: 안개처럼 땅을 덮었습니다
  alternatives_korean:
  - 안개처럼 세상을 덮었습니다
  - 안개처럼 온 땅을 덮었습니다
  lexicon: LSJ / BDAG
  rationale: ὁμίχλη는 '안개'가 현대 한국어에서 가장 자연스럽고, γῆν은 이 문맥에서 포괄적 공간을 가리키므로 '땅'으로 옮겨 시적 이미지를 간결하게 살렸습니다.
