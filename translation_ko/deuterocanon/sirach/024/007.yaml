  - 쉼터
  lexicon: LSJ
  rationale: 단순한 추상명사 ‘안식’보다, 뒤의 ‘묵다’와 평행을 이루는 장소성을 살린 한국어 표현이 필요해 ‘쉴 곳’으로 옮겼습니다.
- source_word: ἐζήτησα
