  - 몫
  - 소유
  lexicon: LSJ
  rationale: 본문의 ‘누구의’와 결합한 소유·배당의 뉘앙스를 살리되, 한국어에서 문맥상 ‘거처할 몫/영역’에 가깝게 들리도록 ‘유산’을 택했습니다.
- source_word: αὐλισθήσομαι
  english_pob_choice: shall I lodge
  chosen_korean: 내가 묵게 되겠습니까
  alternatives_korean:
  - 내가 묵겠습니까
  - 내가 장막을 치겠습니까
  - 내가 머물겠습니까
  lexicon: LSJ
  rationale: αὐλίζομαι는 하룻밤 묵음/거처 잡음을 뜻하므로, 장기간의 ‘거하다’보다 임시 체류의 느낌을 주는 ‘묵게 되다’로 옮겼습니다.
theological_decisions:
- issue: 지혜의 인격화와 거처 탐색의 문학적 긴장
  chosen_reading: 지혜가 직접 말하는 형식을 유지하고, ‘유산’과 ‘묵다’의 결합이 주는 거처·배당의 긴장을 본문 그대로 남겼습니다.
  alternative_readings:
  - 지혜를 단순한 추상 개념으로 풀어쓰기
  - ‘유산’을 특정 공동체로 미리 좁혀 해석하기
  rationale: 그리스어는 인격화된 지혜가 거처를 찾는 장면을 제시하므로, 후속 문맥이 확정하기 전까지는 의미를 미리 해소하지 않는 것이 원문에 충실합니다.
  doctrine_reference: 문학적·신학적 긴장을 보존
