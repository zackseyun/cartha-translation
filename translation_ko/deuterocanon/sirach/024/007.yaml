  - 나는 찾고자 했습니다
  lexicon: LSJ
  rationale: ζητέω의 단순 과거로, 능동적으로 탐색했다는 뜻을 자연스럽고 격식 있게 드러내기 위해 ‘찾았습니다’로 옮겼습니다.
- source_word: κληρονομίᾳ
