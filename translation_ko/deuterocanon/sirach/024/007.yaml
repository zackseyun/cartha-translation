  lexicon: LSJ
  rationale: μετά + 속격은 관계적·분포적 의미로 ‘~가운데서/~중에서’를 가질 수 있으므로, 대상을 훑어보며 그 안에서 거처를 찾는 문맥에 맞게 옮겼습니다.
