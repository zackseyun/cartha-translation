  text: Among all these I sought a resting place[b][a], and in whose inheritance shall I lodge?
  footnotes:
  - marker: a
    text: Or 'rest'; the Greek noun can denote rest or repose, but here likely carries the sense of a place of rest in parallel with 'shall I lodge.'
    reason: lexical_alternative
  - marker: b
    text: Or 'shall I encamp.' The Greek verb can refer to taking up lodging or camping for the night.
    reason: lexical_alternative
translation:
  language: ko
  text: 이 모든 것 가운데서 나는 쉴 곳을 찾았습니다[a][b]. 그리고 누구의 유산에 내가 묵게 되겠습니까?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘쉼’; 여기의 그리스어 명사는 ‘쉼’과 ‘안식’을 뜻할 수 있으나, 뒤의 ‘묵다’와 평행을 이루는 문맥에서는 ‘쉴 곳’의 의미가 더 자연스럽습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘내가 장막을 치겠습니까’. 그리스어 동사는 숙박하거나 야영을 시작하는 뜻을 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ τούτων πάντων
