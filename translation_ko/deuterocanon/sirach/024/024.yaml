translation:
  language: ko
  text: 힘을 잃지 마십시오[a]. 여러분이 강하게 되도록 그분께 굳게 붙으십시오[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘힘이 약해지지 마십시오.’ 이 동사는 ‘실패하다, 그치다, 기운이 꺾이다’라는 뜻을 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 이 행은 시락 24장의 일부 전승에서 추가된 절로 전해지며, 본 판은 해당 장의 절 순서 안에서 이를 그대로 유지합니다.
    reason: textual_variant
lexical_decisions:
- source_word: μὴ ἐκλίπητε ἐν ἰσχύϊ
  english_pob_choice: Do not fail in strength
  chosen_korean: 힘에서 낙심하지 마십시오
  alternatives_korean:
  - 강함에서 실패하지 마십시오
  - 힘에서 쇠하지 마십시오
  - 강건함을 잃지 마십시오
  lexicon: LEH
  rationale: ἐκλίπητε는 ‘fail / cease / faint / grow weary’의 범위를 가지므로, 한국어에서는 ‘낙심하다’로 옮겨 힘이 꺾이고 시드는 뉘앙스를 자연스럽게 살렸습니다. ἐν ἰσχύϊ는 ‘in strength’이므로 ‘힘에서’로 대응했습니다.
- source_word: κολλᾶσθε
  english_pob_choice: cling
  chosen_korean: 붙어 있으십시오
  alternatives_korean:
  - 굳게 매달리십시오
  - 밀착하십시오
  - 굳게 붙드십시오
  lexicon: LEH
  rationale: 중간/수동형의 κολλᾶσθε는 단순 접촉보다 ‘자기 몸을 붙이다’는 밀착의 뜻이 있어, 현대 한국어에서 관계적·지속적 의존을 드러내는 ‘붙어 있으십시오’가 가장 직접적입니다.
- source_word: αὐτῷ
  english_pob_choice: him
  chosen_korean: 그분께
  alternatives_korean:
  - 그에게
  - 그것에
  lexicon: LEH
  rationale: 문법상 중성 가능성이 있으나, 영어 POB의 해석처럼 권면의 대상은 추상적 대상보다 인격적 존재로 듣는 것이 자연스럽기 때문에 한국어도 ‘그분께’로 두었습니다.
- source_word: κραταιωθῆτε
  english_pob_choice: be strengthened
  chosen_korean: 강건해질 것입니다
  alternatives_korean:
  - 강하게 될 것입니다
  - 강해질 것입니다
  - 튼튼해질 것입니다
  lexicon: LEH
  rationale: 수동·결과적 뉘앙스를 살려 ‘강건해지다’로 옮겼습니다. 단순한 상태 변화보다, 붙어 있음의 결과로 힘을 얻는 의미를 드러냅니다.
theological_decisions:
- issue: αὐτῷ의 지시 대상
  chosen_reading: 그분께를 사용해, 권면의 초점을 인격적 대상에게 둡니다.
  alternative_readings:
  - 그에게
  - 그것에
  rationale: 문법적으로는 중성 가능성도 있지만, 본문의 권면 구조와 POB의 해석을 따르면 인격적 의존을 드러내는 번역이 더 적절합니다.
  doctrine_reference: 'DOCTRINE.md: original-language primacy with natural modern Korean that preserves theological force'
- issue: 이 절의 본문 지위
  chosen_reading: 본문에 포함하고 각주로 변이 전승을 밝힙니다.
  alternative_readings:
  - 본문에서 제외
  rationale: 이 절은 일부 집회본/전승에서 추가 절로 취급되지만, 본 프로젝트의 장 절 배열을 따라 본문에 두고 그 텍스트적 지위를 각주로 표기하는 편이 감사 가능성과 연속성을 함께 지킵니다.
  doctrine_reference: Project textual-variant policy for Sirach
