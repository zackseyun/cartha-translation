translation:
  language: ko
  text: 나는 아직도 instruction을 prophecy처럼 쏟아내고, 그것을 끝없는 세대들을 위해 남겨 두겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘예언처럼’. 헬라어는 비교적 의미와 동일시적 의미로 모두 읽힐 수 있지만, 본문은 비교를 분명히 드러내고 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔτι
  english_pob_choice: Still / Again
  chosen_korean: 아직도
  alternatives_korean:
  - 또
  - 여전히
  - 다시
  lexicon: LSJ
  rationale: ἔτι는 이 문맥에서 계속됨이나 추가 행위를 나타내므로, 반복성과 지속성을 함께 살리는 ‘아직도’가 자연스럽습니다.
- source_word: διδασκαλίαν
  english_pob_choice: instruction
  chosen_korean: instruction
  alternatives_korean:
  - 가르침
  - 교훈
  - 지침
  lexicon: LSJ
  rationale: 지혜문학적 문맥의 ‘instruction’에 해당하는 의미를 살리기 위해, 여기서는 교회 제도적 뉘앙스가 강한 용어보다 직접성을 유지했습니다.
- source_word: ὡς προφητείαν
  english_pob_choice: like prophecy
  chosen_korean: prophecy처럼
  alternatives_korean:
  - 예언처럼
  - 예언으로서
  - 예언같이
  lexicon: LSJ
  rationale: ὡς의 비교적 용법을 살려 동일시보다 비교를 분명히 드러내는 표현으로 옮겼습니다.
- source_word: καταλείψω αὐτήν
  english_pob_choice: I will leave it
  chosen_korean: 그것을 남겨 두겠습니다
  alternatives_korean:
  - 그것을 남기겠습니다
  - 그것을 물려주겠습니다
  - 그것을 두겠습니다
  lexicon: LSJ
  rationale: καταλείψω는 단순한 ‘두다’보다 지속적 유산으로 남기는 뉘앙스가 있어, ‘남겨 두다’가 가장 무난하게 그 뜻을 담습니다.
- source_word: εἰς γενεὰς αἰώνων
  english_pob_choice: for everlasting generations
  chosen_korean: 끝없는 세대들을 위해
  alternatives_korean:
  - 영원한 세대들을 위해
  - 영원한 세대에 걸쳐
  - 끝없는 세대에 걸쳐
  lexicon: LSJ
  rationale: ‘세대들’의 복수성과 αἰώνων의 장구함을 함께 살리되, 한국어에서 어색한 직역을 피하기 위해 자연스러운 미래 지속 표현을 택했습니다.
theological_decisions:
- issue: ὡς προφητείαν의 비교 용법
  chosen_reading: instruction를 prophecy와 동일시하지 않고 ‘~처럼’의 비교로 유지했습니다.
  alternative_readings:
  - instruction을 prophecy로 동일시하는 읽기
  - 예언적 권위의 직접 선언으로 읽기
  rationale: 헬라어 ὡς는 여기서 비교를 뜻할 수 있으므로, 본문이 말하는 수사적 비유를 보존하고 과도한 동일시를 피했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
