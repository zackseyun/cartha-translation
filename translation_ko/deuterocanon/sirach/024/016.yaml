translation:
  language: ko
  text: 테레빈스나무처럼 나는 내 가지를 뻗었고, 내 가지들은 영광과 은혜의 가지들입니다.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 가지를 펼쳤습니다’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 테레빈스나무는 성서적 이미지에 자주 쓰이는 큰 나무로, 그리스어는 일반적인 ‘상수리나무’가 아니라 이 특정 수종을 가리킵니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘영광과 호의의 가지들’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: d
    text: 또는 ‘나는 테레빈스나무처럼 내 가지를 뻗었고, 내 가지들은 영광과 은혜의 가지들입니다’로도 옮길 수 있습니다.
    reason: previous_rendering
lexical_decisions:
- source_word: τερέβινθος
  english_pob_choice: terebinth
  chosen_korean: 테레빈스 나무
  alternatives_korean:
  - 테레빈트 나무
  - 상수리나무
  lexicon: LSJ
  rationale: 그리스어가 특정 수종을 가리키므로, 일반적인 나무 이름으로 넓히지 않고 음역+설명형으로 보존했습니다.
- source_word: ἐξέτεινα
  english_pob_choice: spread out
  chosen_korean: 뻗었습니다
  alternatives_korean:
  - 펼쳤습니다
  - 내밀었습니다
  - 펴서 넓혔습니다
  lexicon: LSJ
  rationale: 가지의 물리적 확장을 자연스러운 현대 한국어로 살리되, 동작의 방향성이 분명한 ‘뻗다’를 택했습니다.
- source_word: κλάδους / κλάδοι
  english_pob_choice: branches
  chosen_korean: 가지
  alternatives_korean:
  - 가지들
  - 큰 가지
  - 나뭇가지
  lexicon: LSJ
  rationale: 반복되는 κλάδοι를 일관되게 ‘가지’로 옮겨 원문의 반복 효과를 유지했습니다.
- source_word: δόξης καὶ χάριτος
  english_pob_choice: glory and grace
  chosen_korean: 영광과 은혜
  alternatives_korean:
  - 영광과 호의
  - 영화와 은혜
  - 영광과 아름다움
  lexicon: LSJ
  rationale: δόξα와 χάρις의 예배적·지혜문학적 울림을 살려, 각각 ‘영광’과 ‘은혜’로 직역에 가깝게 옮겼습니다.
theological_decisions:
- issue: 반복된 ‘가지’ 표현의 유지
  chosen_reading: ‘내 가지들은 영광과 은혜의 가지들입니다’처럼 반복을 그대로 살렸습니다.
  alternative_readings:
  - ‘내 가지들은 영광과 은혜로 빛납니다’처럼 형용사화함
  - ‘내 가지들은 영광과 은혜를 지닌 가지들입니다’처럼 완화함
  rationale: 그리스어는 κλάδοι를 반복해 강조하므로, 이를 평준화하지 않고 문학적 반복을 유지하는 것이 원문 의도에 더 충실합니다.
  doctrine_reference: '번역 원칙: 원문의 수사적 강조를 보존하고, 의미를 해치지 않는 한 평탄화하지 않음.'
