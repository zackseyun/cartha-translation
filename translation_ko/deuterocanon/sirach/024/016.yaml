translation:
  language: ko
  text: 테레빈스 나무처럼 나는 내 가지를 뻗었고, 내 가지들은 영광과 은혜의 가지들입니다.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 가지를 뻗었습니다’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 테레빈스 나무는 성서적 이미지에 자주 쓰이는 큰 나무로, 그리스어는 일반적인 ‘상수리나무’가 아니라 이 특정 수종을 가리킵니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘영광과 호의의 가지들’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: d
    text: 또는 ‘테레빈스 나무처럼 나는 내 가지를 뻗었고, 내 가지들은 영광과 은혜의 가지들입니다’로도 옮길 수 있습니다.
    reason: previous_rendering
