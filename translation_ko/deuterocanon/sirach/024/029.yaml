translation:
  language: ko
  text: 그녀의 이해는 바다보다 더 풍성하고, 그녀의 뜻은 큰 심연보다도 그러합니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이해’는 여기서 단순한 지식보다 사고의 결과나 능력을 가리키는 말로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘큰 심연’은 ‘큰 깊음’으로도 옮길 수 있습니다. 여기서는 바다와 짝을 이루는 깊은 물의 심연이라는 이미지를 살렸습니다.
    reason: lexical_alternative
  - marker: c
    text: 헬라어는 두 번째 절에서 동사를 생략합니다. 한국어의 ‘그러합니다’는 첫 절의 ‘더 풍성하다’라는 비교를 이어 받습니다.
    reason: source_note
