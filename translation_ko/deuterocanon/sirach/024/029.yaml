translation:
  language: ko
  text: 그녀의 이해는 바다보다 더 풍성하고, 그녀의 계획은 큰 깊음보다 더 풍성합니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이해’는 여기서 단순한 지식보다 사고의 결과나 능력을 가리키는 말로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘큰 깊음’은 ‘큰 심연’으로도 옮길 수 있으나, 물의 깊이를 떠올리게 하는 표현을 택했습니다.
    reason: lexical_alternative
  - marker: c
    text: 헬라어는 두 번째 절에서 동사를 생략하므로, 한국어도 그 비교를 이어 받는 방식으로 자연스럽게 옮겼습니다.
    reason: source_note
