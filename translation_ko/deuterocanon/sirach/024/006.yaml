lexical_decisions:
- source_word: ἐν κύμασιν θαλάσσης
  english_pob_choice: In the waves of the sea
  chosen_korean: 바다의 파도 속
  alternatives_korean:
  - 바다의 물결 속
  - 바다의 물결 가운데
  lexicon: LSJ
  rationale: ἐν + 여격은 위치를 나타내므로 ‘속’으로 옮겨 원문의 장면감을 살렸고, κύματα는 현대 한국어에서 자연스러운 ‘파도’가 가장 직접적입니다.
- source_word: ἐν πάσῃ τῇ γῇ
  english_pob_choice: in all the earth
  chosen_korean: 온 땅에서
  alternatives_korean:
  - 온 세상에서
  - 온 땅 전체에서
  lexicon: LSJ
  rationale: γῆ는 여기서 지리적 범위를 넓게 가리키므로, 우주적·보편적 확장을 드러내는 ‘온 땅’이 적절합니다.
- source_word: ἐν παντὶ λαῷ καὶ ἔθνει
  english_pob_choice: among every people and nation
  chosen_korean: 모든 백성과 민족 가운데서
  alternatives_korean:
  - 모든 사람들과 나라들 가운데서
  - 모든 ժողովուրդ과 민족 가운데서
  lexicon: LSJ
  rationale: λαός와 ἔθνος의 병렬을 살려 각각 ‘백성’과 ‘민족’으로 옮겼고, ‘가운데서’는 공동체 안에서의 범위를 자연스럽게 드러냅니다.
- source_word: ἐκτησάμην
  english_pob_choice: I gained possession
  chosen_korean: 내가 소유를 얻었습니다
  alternatives_korean:
  - 내가 얻었습니다
  - 내가 차지했습니다
  lexicon: LSJ
  rationale: κτάομαι의 핵심은 ‘획득하다, 소유하다’이므로, 목적어가 생략된 상태를 한국어에서 자연스럽게 보완하면서도 ‘차지하다’의 지나친 강세는 피했습니다.
theological_decisions:
- issue: ἐκτησάμην의 생략된 목적어 처리
  chosen_reading: ‘소유를 얻었습니다’로 옮겨, 원문이 구체적 대상을 밝히지 않는 폭넓은 의미를 유지했습니다.
  alternative_readings:
  - ‘그들을 얻었습니다’
  - ‘소유를 취했습니다’
  rationale: 영문 POB가 지적하듯 이 동사는 목적어가 드러나지 않으므로, 한국어에서도 특정 대상을 단정하지 않는 일반적 표현이 원문의 범위를 가장 잘 보존합니다.
  doctrine_reference: Translation philosophy §3, §5
