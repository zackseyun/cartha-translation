lexical_decisions:
- source_word: συνοικῆσαι
  english_pob_choice: live with
  chosen_korean: 함께 사는
  alternatives_korean:
  - 한집에 사는
  - 동거하는
  lexicon: BDAG
  rationale: 같은 집에서 함께 산다는 동사의 핵심을 살리면서, 현대 한국어에서 자연스럽고 성적인 뉘앙스를 과도하게 불러오지 않는 표현을 택했습니다.
- source_word: λέοντι καὶ δράκοντι
  english_pob_choice: a lion and a dragon
  chosen_korean: 사자와 용
  alternatives_korean:
  - 사자와 뱀
  - 사자와 괴물
  lexicon: LSJ
  rationale: 두 대상의 짝을 그대로 유지해 비유의 강도를 살렸습니다. δράκων은 문맥상 ‘용/큰 뱀’의 범주이지만, 한국어 성경 전통과 이미지의 생생함을 고려해 ‘용’으로 옮겼습니다.
- source_word: εὐδόκησα ἢ ἐνοικῆσαι
  english_pob_choice: I would rather dwell
  chosen_korean: 사는 편이 ... 낫습니다
  alternatives_korean:
  - 거주하는 것보다 더 좋습니다
  - 머무는 것보다 더 낫습니다
  lexicon: BDAG
  rationale: 비교 구문에서의 선호를 한국어의 자연스러운 비교 표현으로 옮겨, 원문의 ‘~보다 차라리’라는 뜻을 분명히 했습니다.
- source_word: γυναικὸς πονηρᾶς
  english_pob_choice: a wicked woman
  chosen_korean: 악한 여자
  alternatives_korean:
  - 악한 아내
  - 나쁜 여자
  lexicon: BDAG
  rationale: γυνή는 문맥에 따라 ‘여자’ 또는 ‘아내’가 될 수 있으나, 원문에는 소유 관계가 드러나지 않으므로 기본값인 ‘여자’를 유지했습니다. πονηρός는 도덕적 악함을 가리키므로 ‘악한’이 가장 가깝습니다.
theological_decisions:
- issue: γυνή를 ‘여자’로 둘지 ‘아내’로 둘지
  chosen_reading: 여자
  alternative_readings:
  - 아내
  rationale: 문맥상 ‘아내’로도 읽을 수 있지만, 그리스어 자체는 일반적인 ‘여자’를 가리킬 수 있고 소유격 표지가 없으므로 본문에는 더 직접적인 ‘여자’를 두었습니다. 의미의 여지는 각주로 보존했습니다.
  doctrine_reference: Translation philosophy §3, §5
