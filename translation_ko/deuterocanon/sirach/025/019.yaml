base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/025/019.yaml
  text: Any evil is small compared with the evil of a woman[b][a]; may the lot of a sinner fall upon her.
  footnotes:
  - marker: a
    text: Or, 'Any evil is slight beside a woman's evil.' The Hebrew and Greek both express a comparison; the wording can be turned in more than one natural English way.
    reason: lexical_alternative
  - marker: b
    text: The final clause may be heard as an imprecation ('may the lot of a sinner fall upon her') rather than a simple prediction ('the lot of a sinner will fall upon her'). The Greek parallel supports the wish-like sense.
    reason: alternative_reading
translation:
  language: ko
  text: 어떤 악도 여자의 악에 비하면 작습니다. 죄인의 몫이 그녀에게 떨어지기를 바랍니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘어떤 악도 여자의 악보다 약합니다.’ 히브리어와 그리스어 모두 비교 표현이므로, 한국어로는 자연스럽게 여러 방식으로 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: מְעַט רָעָה
  english_pob_choice: Any evil is small
  chosen_korean: 어떤 악도 … 작습니다
  alternatives_korean:
  - 모든 악은 … 적습니다
  - 어떤 악이든 … 미미합니다
  lexicon: HALOT
  rationale: מְעַט은 비교 속에서 ‘작다/적다’의 의미를 가지므로, 한국어에서는 자연스러운 비교문으로 옮겨 ‘어떤 악도 … 작습니다’라고 했습니다. '작다'가 מקור의 비교적 경감을 직접 드러냅니다.
- source_word: כְרָעַת אִשָּׁה
  english_pob_choice: compared with the evil of a woman
  chosen_korean: 여자의 악에 비하면
  alternatives_korean:
  - 여자의 악과 비교하면
  - 한 여자의 악보다
  lexicon: HALOT
  rationale: כְ는 비교를 나타내므로 ‘-에 비하면’이 가장 간결하고 직역에 가깝습니다. אִשָּׁה는 문법상 단수의 ‘여자/여성’이므로 ‘여자’로 유지했습니다.
- source_word: גוֹרַל חוֹטֵא
  english_pob_choice: the lot of a sinner
  chosen_korean: 죄인의 몫
  alternatives_korean:
  - 죄인의 분깃
  - 죄인의 제비
  lexicon: HALOT
  rationale: גוֹרַל은 ‘제비’의 이미지가 있으나, 문맥상 ‘정해진 몫/배당된 운명’까지 포함하므로 한국어에서는 의미를 살린 ‘몫’이 자연스럽습니다. חוֹטֵא는 일반적 단수형 ‘죄인’으로 옮겼습니다.
- source_word: יִפּוֹל עָלֶיהָ
  english_pob_choice: may ... fall upon her
  chosen_korean: 그녀에게 떨어지기를 바랍니다
  alternatives_korean:
  - 그녀 위에 임하기를 바랍니다
  - 그녀에게 임하기를 바랍니다
  lexicon: HALOT
  rationale: יִפּוֹל עָלֶיהָ는 문자적으로 ‘그녀 위에 떨어지다’이지만, 한국어에서는 숙어적으로 ‘~에게 떨어지다’가 자연스럽습니다. 서원/저주의 뉘앙스를 유지하려고 미래형보다 소망형으로 옮겼습니다.
theological_decisions:
- issue: 마지막 절의 문장 기능
  chosen_reading: 예언적 진술이 아니라 저주/기원형으로 읽어 ‘떨어지기를 바랍니다’라고 옮겼습니다.
  alternative_readings:
  - ‘죄인의 몫이 그녀에게 떨어질 것입니다’로 예언형 처리
  - ‘그녀에게 닥치기를 바랍니다’로 더 강한 저주형 처리
  rationale: 히브리어 יִפּוֹל은 문맥상 기원형으로 읽을 수 있고, 대응하는 그리스어 optative도 그 뉘앙스를 뒷받침합니다. 그래서 단순 미래보다 저주에 가까운 소망형을 택했습니다.
  doctrine_reference: 본문의 정서와 수사 기능에 대한 번역 판단입니다.
