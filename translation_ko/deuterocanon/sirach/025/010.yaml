  text: Blessed is the one who has found wisdom[b][a], and the one who speaks in the ears of those who hear.
  footnotes:
  - marker: a
    text: Or 'the one who recounts/explains in the hearing of listeners.' The Greek participle can suggest more than simple speaking.
    reason: lexical_alternative
  - marker: b
    text: The Greek text is somewhat terse and idiomatic here ('speaks into the ears of those who hear'), so the exact nuance may be either direct speech or skillful explanation addressed to attentive hearers.
    reason: alternative_reading
translation:
  language: ko
  text: 지혜를 얻은 사람은 복이 있습니다. 그리고 듣는 이들의 귀에 말하는 사람도 복이 있습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 동사 διηγούμενος는 단순히 ‘말하다’보다 ‘전하다, 풀어 설명하다, 이야기해 주다’의 뜻을 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘지혜’는 여기서 단순 지식보다 실천적 분별과 올바른 판단을 포함합니다.
    reason: theological_note
lexical_decisions:
- source_word: μακάριος
  english_pob_choice: Blessed
  chosen_korean: 복이 있습니다
  alternatives_korean:
  - 행복합니다
  - 복됩니다
  lexicon: 일반 용례 / 지혜문학 어조
  rationale: μακάριος는 단순한 감정 상태보다 복된 처지를 가리키므로, 지혜문학의 선언형 문맥을 살려 ‘복이 있습니다’로 옮겼습니다.
- source_word: φρόνησιν
  english_pob_choice: understanding
  chosen_korean: 지혜
  alternatives_korean:
  - 분별
  - 슬기
  - 이해
  lexicon: BDAG
  rationale: 이 단어는 실천적 분별과 판단력을 가리키지만, 한국어에서는 ‘지혜’를 쓰되 문맥상 추상적 교훈이 아니라 얻어낸 통찰의 뜻으로 읽히도록 했습니다.
- source_word: διηγούμενος
  english_pob_choice: speaks
  chosen_korean: 말하는 사람
  alternatives_korean:
  - 이야기하는 사람
  - 전하는 사람
  - 풀어 설명하는 사람
  lexicon: BDAG
  rationale: 동사는 단순 발화보다 ‘자세히 전함/설명함’의 뉘앙스를 가질 수 있으나, 본문이 요구하는 최소 의미는 ‘말하는’ 것이므로 지나친 해석을 피했습니다.
- source_word: εἰς ὦτα ἀκουόντων
  english_pob_choice: in the ears of those who hear
  chosen_korean: 듣는 이들의 귀에
  alternatives_korean:
  - 듣는 사람들의 귀에
  - 듣는 자들의 귀속에
  - 듣는 이들에게
  lexicon: BDAG
  rationale: 그리스어의 관용적 방향 표현을 살려 ‘귀에’로 직역성을 유지했고, ‘듣는 이들’로 ἀκουόντων의 관계분사를 자연스럽게 반영했습니다.
theological_decisions:
- issue: φρόνησιν의 의미 범위
  chosen_reading: ‘지혜’를 사용하되, 실천적 분별을 포함하는 지혜로 이해하게 했습니다.
  alternative_readings:
  - 분별
  - 슬기
  - 이해
  rationale: 서신적 교리 용어가 아니라 지혜문학의 덕목 표현이므로, 한국어 독자가 자연스럽게 받아들이면서도 본문의 칭송 대상을 약화하지 않는 표현을 택했습니다.
  doctrine_reference: 지혜문학의 분별/통찰 어휘
- issue: προσφωνητικός한 관용구의 직역성
  chosen_reading: ‘듣는 이들의 귀에’라는 구체적 이미지와 반복 구조를 유지했습니다.
  alternative_readings:
  - 듣는 이들에게
  - 듣는 이들 앞에서
  rationale: 본문의 수사 효과는 ‘귀’ 이미지에 있으므로, 이를 평범한 ‘에게’로 완전히 평준화하지 않았습니다.
  doctrine_reference: 본문 수사와 지혜 교훈의 전달 방식
