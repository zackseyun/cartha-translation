  text: The fear of the Lord surpasses everything[b][a]; to whom will the one who holds fast to it be compared?
  footnotes:
  - marker: a
    text: Or, 'The fear of the Lord is above everything.' The Greek wording expresses superiority over all things.
    reason: lexical_alternative
  - marker: b
    text: Or, 'the one who possesses it—to whom will he be likened?' The verb can suggest firm possession as well as holding fast.
    reason: lexical_alternative
translation:
  language: ko
  text: 주님을 두려워하는 마음은 모든 것 위에 있습니다.[a][b] 그것을 굳게 붙드는 사람은 누구와 같겠습니까?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, '주님을 두려워하는 마음은 모든 것보다 높습니다.' 그리스어 표현은 모든 것에 대한 우월성을 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: 또는, '그것을 소유한 사람—누구와 비기겠습니까?' 동사는 단단히 붙드는 뜻과 소유의 뜻을 함께 띨 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: φόβος Κυρίου
  english_pob_choice: the fear of the Lord
  chosen_korean: 주님을 두려워하는 마음
  alternatives_korean:
  - 주님의 두려움
  - 주님 경외함
  - 주님을 경외하는 마음
  lexicon: LSJ
  rationale: φόβος는 단순한 경외감으로 완화하기보다 '두려워하는 마음'으로 살려, 지혜문학의 긴장과 무게를 유지했습니다.
- source_word: ὑπὲρ πᾶν ὑπερέβαλεν
  english_pob_choice: surpasses everything
  chosen_korean: 모든 것 위에 있습니다
  alternatives_korean:
  - 모든 것보다 뛰어납니다
  - 모든 것을 능가합니다
  - 무엇보다 높습니다
  lexicon: LSJ
  rationale: ὑπέρ + πᾶν의 우월성을 한국어 관용에 맞게 '모든 것 위에'로 옮겨, 비교 우위를 분명히 했습니다.
- source_word: ὁ κρατῶν αὐτοῦ
  english_pob_choice: the one who holds fast to it
  chosen_korean: 그것을 굳게 붙드는 사람
  alternatives_korean:
  - 그것을 소유한 사람
  - 그것을 꽉 붙잡는 사람
  - 그것을 지키는 사람
  lexicon: LSJ
  rationale: κρατέω는 단순 소유보다 강하게 붙들고 유지하는 뉘앙스가 있어 '굳게 붙드는'으로 옮겼습니다.
- source_word: τίνι ὁμοιωθήσεται
  english_pob_choice: to whom will he be compared?
  chosen_korean: 누구와 같겠습니까?
  alternatives_korean:
  - 누구에 비기겠습니까?
  - 누구와 비교될 수 있겠습니까?
  - 어느 것과 같겠습니까?
  lexicon: LSJ
  rationale: 수동 미래의 수사 의문을 자연스러운 한국어로 풀어, 비교 불가능성을 간결하게 드러냈습니다.
theological_decisions:
- issue: φόβος Κυρίου를 '경외'로 완화할지 여부
  chosen_reading: 주님을 두려워하는 마음
  alternative_readings:
  - 주님을 경외하는 마음
  - 주님 경외함
  rationale: 지혜문학의 핵심 개념인 'fear of the Lord'를 희석하지 않고, 소스가 가진 경외와 두려움의 긴장을 그대로 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Preserve theological tension rather than resolve it'
- issue: 대표적 단수의 인칭 처리
  chosen_reading: 사람은 누구와 같겠습니까?
  alternative_readings:
  - 그는 누구와 같겠습니까?
  - 누구와 같겠습니까?
  rationale: 그리스어는 문법상 남성 단수이지만, 한국어에서는 문장 전체의 일반 진술성을 살려 '사람'으로 풀어 자연스럽게 전달했습니다.
  doctrine_reference: 'DOCTRINE.md: Gender-accurate over gender-neutral'
