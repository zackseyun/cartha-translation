translation:
  language: ko
  text: 힘 풀린 손과 힘 빠진 무릎은 자기 남편을 복되다고 여기지 않는 아내입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 ‘축복하다’로도 옮길 수 있으나, 여기서는 ‘복되다고 여기다’ 또는 ‘복되다고 말하다’라는 뜻일 수 있습니다. 문맥상 남편을 행복하거나 복된 사람으로 여기게 하지 않는다는 뉘앙스도 가능합니다. 그리스어 역문은 ‘자기 남편을 복되다고 여기지 않는 여자’라고 읽습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רִפְיוֹן יָדַיִם
  english_pob_choice: Slack hands
  chosen_korean: 늘어진 손
  alternatives_korean:
  - 축 늘어진 손
  - 무기력한 손
  - 힘 빠진 손
  lexicon: HALOT
  rationale: 손의 물리적 이완과 무기력을 살리기 위해 ‘늘어진’으로 옮겼습니다. ‘손’은 본문의 구체적 신체 이미지를 그대로 보존합니다.
- source_word: כִשְׁלוֹן בִּרְכַּיִם
  english_pob_choice: failing knees
  chosen_korean: 힘 빠진 무릎
  alternatives_korean:
  - 무너지는 무릎
  - 흔들리는 무릎
  - 비틀거리는 무릎
  lexicon: HALOT
  rationale: ‘무릎’이 힘을 잃고 주저앉는 이미지를 자연스럽게 살리기 위해 ‘힘 빠진’으로 옮겼습니다. 영어의 ‘failing’과 히브리어 뿌리의 ‘비틀거림’ 이미지를 함께 반영합니다.
- source_word: אִשָּׁה לֹא תְאַשֵּׁר
  english_pob_choice: a wife who does not bless
  chosen_korean: 자기 남편을 복되다고 하지 않는 아내
  alternatives_korean:
  - 자기 남편을 축복하지 않는 아내
  - 자기 남편을 복되다고 여기지 않는 아내
  - 자기 남편을 행복하다고 하지 않는 아내
  lexicon: HALOT
  rationale: 피엘 אשר의 핵심을 ‘복되다/복되다고 말하다’로 살리면서, 영어 POB의 ‘bless’보다 한국어에서 더 자연스러운 평가적 표현으로 옮겼습니다. 남편을 대상으로 하는 점을 분명히 하기 위해 ‘자기 남편’을 덧붙였습니다.
- source_word: בַּעֲלָהּ
  english_pob_choice: her husband
  chosen_korean: 남편
  alternatives_korean:
  - 남자 주인
  - 주인
  lexicon: HALOT
  rationale: 결혼 문맥에서의 표준 의미를 따라 ‘남편’으로 번역했습니다. ‘주인’은 여기서 문맥에 맞지 않는 지배적 뉘앙스를 불필요하게 가져옵니다.
theological_decisions:
- issue: ‘bless’의 한국어 처리와 평가적 뉘앙스
  chosen_reading: ‘복되다고 하지 않는’으로 옮겨, 단순한 종교적 축복 행위보다 남편을 복된 사람으로 인정하고 말해 주지 않는 의미를 살렸습니다.
  alternative_readings:
  - 축복하지 않는
  - 행복하게 하지 않는
  - 복되다고 여기지 않는
  rationale: 히브리어와 영어 주석 모두 이 동사가 ‘복을 빌다’만이 아니라 ‘복되다고 인정하다/선언하다’는 뜻을 가질 수 있음을 보여 줍니다. 한국어에서는 그 평가적 의미가 가장 분명하게 드러나는 표현을 택했습니다.
  doctrine_reference: 'Sirach의 지혜 문맥: 도덕적 평가를 담은 관용적 축복 표현'
- issue: 여성 일반이 아니라 아내로 제한하는 해석
  chosen_reading: ‘아내’로 옮겼습니다.
  alternative_readings:
  - 여자
  - 여인
  rationale: 히브리어 뒤의 ‘그의 남편’이 결혼 관계를 명확히 하므로, 본문의 사회적 관계를 정확히 반영하는 ‘아내’가 가장 적절합니다.
  doctrine_reference: 문맥 우선 원칙
