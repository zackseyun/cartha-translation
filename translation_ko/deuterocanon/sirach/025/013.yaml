translation:
  language: ko
  text: 어떤 상처라도 마음의 상처만큼은 아닙니다. 어떤 악이라도 여자의 악만큼은 아닙니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘어떤 불행이라도 여자가 가져오는 불행만큼은 아닙니다.’ 히브리어 רָעָה는 ‘악’ 또는 ‘불행/해악’을 뜻할 수 있고, אִשָּׁה는 문맥에 따라 ‘여자’ 또는 ‘아내’를 뜻할 수 있습니다.
    reason: lexical_alternative
