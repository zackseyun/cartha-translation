lexical_decisions:
- source_word: בַּעֲלָה
  english_pob_choice: her husband
  chosen_korean: 그의 남편
  alternatives_korean:
  - 그녀의 남편
  - 그의 주인
  - 그의 소유주
  lexicon: HALOT
  rationale: בעל + 3fs 접미사는 이 문맥에서 결혼한 여인의 남편을 가리키므로, 한국어에서도 관계를 직접 드러내는 ‘남편’이 가장 정확합니다.
- source_word: בֵּין רֵעִים
  english_pob_choice: among his companions
  chosen_korean: 친구들 사이에
  alternatives_korean:
  - 동료들 사이에
  - 벗들 가운데
  - 이웃들 사이에
  lexicon: HALOT
  rationale: רֵעִים은 ‘친구/동료’의 뜻이므로, 자연스러운 현대 한국어로는 ‘친구들 사이에’가 가장 무리 없이 대응합니다.
- source_word: וּבְלֹא טַעֲמוֹ
  english_pob_choice: without sense
  chosen_korean: 이해 없이
  alternatives_korean:
  - 감각 없이
  - 분별 없이
  - 이유도 모르고
  lexicon: HALOT
  rationale: טַעַם은 여기서 문자적 ‘맛’보다 판단력·이해를 뜻하는 관용적 용법이므로, ‘이해 없이’가 의미를 가장 직접적으로 드러냅니다.
- source_word: יִתְאַנָּח
  english_pob_choice: he groans
  chosen_korean: 신음합니다
  alternatives_korean:
  - 탄식합니다
  - 한숨 쉽니다
  - 신음합니다
  lexicon: HALOT
  rationale: 반복적이거나 약한 ‘한숨’보다, 고통과 불편을 강하게 나타내는 ‘신음하다’가 동사의 음성적·정서적 무게를 더 잘 살립니다.
theological_decisions:
- issue: 히브리어 본문과 헬라어 병행본문의 차이 처리
  chosen_reading: 본문은 현존하는 히브리어를 따라 ‘앉아 있으며 / 이해 없이 신음합니다’로 옮기고, 그리스어의 ‘누워 있을 것이다 / 듣고 쓰게 탄식했다’는 차이는 주석으로만 반영합니다.
  alternative_readings:
  - 그는 누워 있을 것이다
  - 듣고 쓰게 탄식했다
  rationale: 집회서에서는 히브리어가 보존된 경우 그 본문을 우선하고, 의미 있는 이문은 각주로 보존하는 것이 자료 충실성과 감사 가능성을 함께 살립니다.
  doctrine_reference: 'PHILOSOPHY.md: 히브리어가 남아 있는 집회서는 히브리어를 본문 우선으로 번역하고, 그리스어 병행본문은 대조 자료로 사용한다.'
