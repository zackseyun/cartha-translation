  yaml_path: translation/deuterocanon/sirach/025/001.yaml
  text: 'In three things I was made beautiful[b][a], and I stood beautiful before the Lord and men:'
  footnotes:
  - marker: a
    text: Or 'I was made beautiful' for 'I became beautiful'; the Greek passive can be heard either as a resulting state or as an action done to the speaker.
    reason: lexical_alternative
  - marker: b
    text: Or 'I arose beautiful' / 'I stood beautiful'; the Greek keeps a concrete image of rising or standing forth, not merely an abstract 'appeared.'
    reason: lexical_alternative
translation:
  language: ko
  text: 세 가지 일에서 나는 아름답게 되었고[a], 주님과 사람들 앞에서 아름답게 일어섰습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘나는 아름답게 만들어졌고’로 옮길 수 있습니다. 그리스어 수동형은 결과 상태로도, 화자에게 행해진 작용으로도 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘나는 아름답게 일어났습니다’로 옮길 수 있습니다. 그리스어는 단순히 ‘나타났다’가 아니라 일어나거나 서는 구체적 이미지를 유지합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν τρισὶν
  english_pob_choice: In three things
  chosen_korean: 세 가지 일에서
  alternatives_korean:
  - 세 가지 가운데서
  - 세 가지로
  lexicon: LSJ
  rationale: ἐν + 여격은 여기서 ‘~에서/~안에서’의 영역 또는 범위를 나타내므로, 열거의 틀을 살리면서도 자연스러운 ‘세 가지 일에서’로 옮겼습니다.
- source_word: ὡραιώθην
  english_pob_choice: I was made beautiful / I became beautiful
  chosen_korean: 나는 아름답게 되었고
  alternatives_korean:
  - 나는 아름답게 만들어졌고
  - 나는 아름다워졌고
  lexicon: LSJ
  rationale: aorist passive의 결과 상태를 살려 ‘아름답게 되다’로 옮기되, 수동으로 강하게 고정하지 않고 한국어에서 자연스러운 상태 변화 표현을 택했습니다.
- source_word: ἀνέστην
  english_pob_choice: I stood / I stood up
  chosen_korean: 아름답게 일어섰습니다
  alternatives_korean:
  - 아름답게 일어났습니다
  - 아름답게 섰습니다
  lexicon: LSJ
  rationale: ‘일어섰다’는 ἀνίστημι의 구체적 동작 이미지와 POB가 지적한 ‘stand forth’의 감각을 함께 살리며, 단순한 ‘나타났다’로 평탄화하지 않습니다.
- source_word: ἔναντι Κυρίου καὶ ἀνθρώπων
  english_pob_choice: before the Lord and men
  chosen_korean: 주님과 사람들 앞에서
  alternatives_korean:
  - 주님과 사람들 앞에
  - 주님과 인간들 앞에서
  lexicon: LSJ
  rationale: ἔναντι는 ‘앞에/앞에서’의 의미이므로 관계적·목격자적 뉘앙스를 살려 ‘앞에서’로 옮겼고, ἀνθρώπων은 일반 인간을 가리키므로 ‘사람들’이 가장 자연스럽습니다.
theological_decisions:
- issue: Κυρίου의 번역
  chosen_reading: 주님
  alternative_readings:
  - 주
  - 주 하나님
  rationale: 이 절의 Κυρίου는 하나님을 가리키지만, 본문이 그리스어 사본을 직접 번역하는 자리이므로 프로젝트 기본값에 따라 ‘주님’으로 유지했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: κύριος → Lord'
- issue: ἀνθρώπων의 인칭 범위
  chosen_reading: 사람들
  alternative_readings:
  - 남자들
  - 인류
  rationale: 원문은 성별 제한이 없는 일반 인간을 뜻하므로, 교회적 관용어보다 원문의 보편 범위를 드러내는 ‘사람들’을 택했습니다.
  doctrine_reference: DOCTRINE.md §4 Gender-accurate over gender-neutral
