  lexicon: HALOT
  rationale: כחש는 거짓말하다, 속이다, 부인하다의 범위를 가지며, 여기서는 그리스어 병행본문의 ‘거짓말하는 사람’과 맞물려 ‘거짓말하며’가 가장 자연스럽습니다.
- source_word: וַחֲסַר דַּעַת
  english_pob_choice: and lacks sense
  chosen_korean: 분별이 부족한 것
  alternatives_korean:
  - 이해가 없는 것
  - 지혜가 없는 것
  - 판단력이 부족한 것
  lexicon: HALOT
  rationale: דעת는 단순 지식보다 분별과 이해를 포함하므로, 그리스어의 ‘이해가 줄어든/부족한’ 뉘앙스를 살려 ‘분별이 부족한 것’으로 옮겼습니다.
