base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/025/003.yaml
  text: A poor man who is proud[a], and a rich man who lies[b], and an old man who commits adultery and lacks sense.
  footnotes:
  - marker: a
    text: Hebrew מְכַחֵשׁ can also mean 'deceiving' or 'denying'; the Greek parallel has 'liar,' which supports the rendering 'who lies.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'lacks sense' could also be rendered 'is without understanding' or 'is deficient in judgment'; the Greek similarly reads 'diminished in understanding.'
    reason: lexical_alternative
translation:
  language: ko
  text: 가난한 사람이 교만하고, 부유한 사람이 거짓말하며, 늙은 사람이 간음하고 분별이 부족한 것.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 מְכַחֵשׁ는 ‘거짓말하다’ 외에도 ‘속이다’, ‘부인하다’의 뜻이 있을 수 있으나, 그리스어 병행본문의 ψεύστην이 ‘거짓말하는 사람’임을 뒷받침합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 חֲסַר דַּעַת은 ‘이해가 없다’, ‘판단력이 부족하다’로도 옮길 수 있으며, 그리스어의 ἐλαττούμενον συνέσει도 이해의 결핍을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּל
