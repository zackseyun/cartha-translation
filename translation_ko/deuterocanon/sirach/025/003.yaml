  - marker: b
    text: Hebrew 'lacks sense' could also be rendered 'is without understanding' or 'is deficient in judgment'; the Greek similarly reads 'diminished in understanding.'
    reason: lexical_alternative
translation:
  language: ko
  text: 교만한 가난한 사람, 거짓말하는 부자[a], 간음하며 분별이 부족한 늙은 사람[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 מְכַחֵשׁ는 ‘거짓말하다’ 외에도 ‘속이다’ 또는 ‘부인하다’라는 뜻일 수 있습니다. 그러나 그리스어 병행본문의 ψεύστην은 ‘거짓말쟁이’를 뜻하므로, ‘거짓말하는’이라는 번역을 뒷받침합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 חֲסַר דַּעַת은 ‘이해가 없다’ 또는 ‘판단력이 부족하다’로도 옮길 수 있습니다. 그리스어 ἐλαττούμενον συνέσει도 이해 또는 분별의 결핍을 가리킵니다.
    reason: lexical_alternative
