base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/025/025.yaml
  text: A bad wife is leprosy to her husband[a]; let him drive her out of his house[c][b], and he will be healed of his leprosy.
  footnotes:
  - marker: a
    text: Hebrew צָרַעַת, traditionally 'leprosy,' refers broadly to a serious skin affliction in biblical usage, not necessarily modern leprosy.
    reason: cultural_note
  - marker: b
    text: Or 'he should divorce her'; the Hebrew more literally says 'drive her out of his house,' which may imply separation without specifying the legal form.
    reason: alternative_reading
  - marker: c
    text: 'The Greek parallel reads quite differently: ''Do not give water an outlet, nor authority to a wicked wife.'' The English here follows the extant Hebrew witness as the primary source for this verse.'
    reason: textual_variant
translation:
  language: ko
  text: 나쁜 아내는 남편에게 나병입니다[a]. 그는 그녀를 자기 집에서 내쫓아야 하며[b], 그러면 자기 나병에서 나을 것입니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 צָרַעַת은 성경에서 넓은 의미의 피부 질환을 가리키며, 현대 의학적 나병과 반드시 일치하지는 않습니다.
    reason: cultural_note
  - marker: b
    text: 또는 ‘그녀와 이혼해야 하며’로 옮길 수도 있습니다. 그러나 히브리어는 문자적으로 ‘그의 집에서 그녀를 내쫓다’라고 말하며, 법적 형태를 명시하지는 않습니다.
    reason: alternative_reading
  - marker: c
    text: 그리스어 병행 본문은 상당히 다르게 “물에 출구를 주지 말고, 악한 아내에게 권세를 주지 말라”라고 읽습니다. 여기서는 이 절에 대해 현존하는 히브리어 증언을 우선하여 따릅니다.
    reason: textual_variant
lexical_decisions:
- source_word: אִשָּׁה רָעָה
  english_pob_choice: a bad wife
  chosen_korean: 나쁜 아내
  alternatives_korean:
  - 악한 아내
  - 사악한 아내
  - 나쁜 여자
  lexicon: HALOT
  rationale: לְבַעֲלָהּ로 이어져 결혼 관계를 분명히 하므로 ‘여자’보다 ‘아내’가 정확합니다. רָעָה는 강한 윤리판정인 ‘악한’보다 넓은 부정성을 담는 ‘나쁜’이 원문의 폭을 더 잘 보존합니다.
- source_word: צָרַעַת
  english_pob_choice: leprosy
  chosen_korean: 나병
  alternatives_korean:
  - 문둥병
  - 피부병
  - 악성 피부 질환
  lexicon: HALOT
  rationale: 비록 고대의 범주는 현대 의학적 나병과 일치하지 않지만, 본문의 비유적·사회적 충격을 살리기 위해 전통적으로 인식되는 ‘나병’을 택했습니다. 주해적 설명은 각주로 보완할 수 있습니다.
- source_word: יְגַרְשֶׁנָּה מִבֵּיתוֹ
  english_pob_choice: let him drive her out of his house
  chosen_korean: 그가 그녀를 자기 집에서 내쫓으면
  alternatives_korean:
  - 그가 그녀를 집에서 쫓아내면
  - 그가 그녀와 이혼하면
  - 그가 그녀를 자기 집에서 내보내면
  lexicon: HALOT
  rationale: גרש와 ‘집에서’의 결합은 법적 용어인 ‘이혼’보다 물리적·가정적 축출을 먼저 뜻하므로, 구체적 동사를 유지했습니다. POB의 영어도 그 법적 해석을 확정하지 않고 집 밖으로 내쫓는 행위를 중심에 둡니다.
- source_word: וְיִתְרַפֵּא מִצָּרַעְתּוֹ
  english_pob_choice: and he will be healed of his leprosy
  chosen_korean: 그는 자기 나병에서 나을 것입니다
  alternatives_korean:
  - 그는 자기 나병에서 회복될 것입니다
  - 그는 그 나병에서 치유될 것입니다
  lexicon: HALOT
  rationale: רפא의 기본 의미를 살려 ‘나을 것입니다’로 옮겼고, מִן을 ‘에서’로 처리해 질병에서 벗어나는 결과를 자연스럽게 드러냈습니다. 반복되는 ‘나병’을 유지해 첫 행의 비유적 대응을 보존했습니다.
theological_decisions:
- issue: ‘drive her out’의 법적 해석을 ‘이혼’으로 좁힐지 여부
  chosen_reading: ‘내쫓으면’으로 두어 concrete expulsion을 유지했습니다.
  alternative_readings:
  - 그가 그녀와 이혼하면
  rationale: 히브리어는 גרש와 ‘자기 집에서’라는 표현으로 가정에서의 축출을 말할 뿐, 법적 절차를 명시하지 않습니다. 따라서 번역에서 이혼으로 확정하면 원문이 열어 둔 긴장을 지워 버립니다.
  doctrine_reference: 원어 우선 원칙; 번역이 본문의 법적 범위를 과잉 규정하지 않도록 보존
