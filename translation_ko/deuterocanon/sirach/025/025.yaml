  naturalness: ‘나쁜 아내는 남편에게 나병입니다’는 원문의 의도적인 은유를 직접적이고 자연스러운 현대 한국어로 재현합니다. ‘그러면 … 나을 것입니다’는 합쇼체를 유지하면서 앞선 권고의 결과를 명료하게 연결합니다.
  terminology: ‘아내’, ‘나병’, ‘내쫓다’는 각각 אִשָּׁה, צָרַעַת, גרש의 문맥상 의미를 적절히 반영합니다. ‘나병’은 현대 의학적 질환명과 완전히 동일하지 않으므로 각주 a를 유지합니다. 그리스어 병행 본문은 히브리어와 크게 달라 본문비평상 중요한 정보이므로 영어 POB 감사 기록에 맞추어 각주 c를 보완했습니다.
