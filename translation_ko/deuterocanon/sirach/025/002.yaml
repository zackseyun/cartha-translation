  - 나는 크게 곤혹스럽습니다
  lexicon: HALOT
  rationale: 직역보다 현대 한국어에서 자연스럽게 강한 불쾌·고통의 감정을 전달하는 표현을 택했습니다.
- source_word: בְּחַיֵּיהֶם
  english_pob_choice: by their lives / way of life
  chosen_korean: 그들의 삶은
  alternatives_korean:
  - 그들의 삶 가운데서
  - 그들의 생활 방식은
  - 그들이 사는 방식은
  lexicon: HALOT
  rationale: 본문의 히브리어는 문자적으로 ‘그들의 삶/생애 안에서’이므로, 뜻을 과도하게 해석하지 않되 문맥상 대상의 삶 자체를 가리키는 말로 옮겼습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행문의 중대한 차이
