  alternative_readings:
  - '그리스어: ‘형제들 사이의 화목, 이웃의 우정, 그리고 아내와 남편이 서로 잘 지내는 것’'
  rationale: 지혜문학 사본 전승에서 두 전통의 내용이 크게 갈라지므로, 본문은 현존 히브리어를 우선하되 다른 전승을 숨기지 않는 것이 감사가능성과 정직성에 부합합니다.
  doctrine_reference: 'PHILOSOPHY.md: surviving Hebrew governs where extant; disclose major textual divergence honestly'
