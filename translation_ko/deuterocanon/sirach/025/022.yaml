  rationale: 지시적 ‘그 여자’를 문맥상 적절한 일반 명사 ‘아내’로 고치고, 상황절과 결과절을 한 문장으로 연결했습니다. 이는 여성의 남편 부양을 수치와 연결하는 고대 본문의 평가를 완화하거나 강화하지 않으면서, 히브리어의 인과 관계와 그리스어 병행 본문의 조건적 표현을 자연스러운 한국어로 반영합니다.
