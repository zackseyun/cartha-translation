    rationale: ‘말입니다’는 본문의 격언적 진술에 맞지 않고, 원문의 원인·상황 관계를 느슨하게 만듭니다. 조건·상황절로 직접 연결하는 편이 정확하고 자연스럽습니다.
  - severity: low
