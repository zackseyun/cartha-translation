  verdict: revise
  source_fidelity: ‘그 여자’는 히브리어 אִשָּׁה에 없는 지시성을 더하며, 앞의 ‘그 여자 때문에’와 뒤의 ‘아내’가 동일 대상을 가리키는 방식도 불필요하게 어색합니다. 또한 ‘말입니다’로 분리한 문장은 본문의 인과·상황 연결을 부자연스럽게 만듭니다. 아내가 남편을 부양하는 상황과 그로 인한 수치·부끄러움의 진술을 한 문장으로 연결하는 것이 히브리어 및 그리스어 병행 본문의 의미를 더 충실히 반영합니다.
  naturalness: ‘아내가 남편을 부양하면, 그로 인해 수치와 부끄러움이 있습니다’는 현대 표준 한국어의 격식 있는 문체로 자연스럽고, 합쇼체 종결을 유지합니다. ‘그로 인해’는 원문의 בַעֲדָהּ가 나타내는 원인 관계를 자연스럽게 드러냅니다.
  terminology: ‘아내’, ‘남편’, ‘부양하다’는 각각 אִשָּׁה, בַּעַל, מְכַלְכֶּלֶת에 적절합니다. ‘수치와 부끄러움’은 חֶרְפָּה וּבֹשֶׁת의 공적 치욕과 수치의 짝을 무리 없이 보존합니다. 각주에서는 ‘여자’가 가능한 어휘적 대안임을 밝히되, 본문 문맥상 ‘아내’를 채택한 번역을 훼손하지 않습니다.
