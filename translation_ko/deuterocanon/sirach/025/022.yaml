  text: For because of her there is reproach and shame[a], when a wife supports her husband.
  footnotes:
  - marker: a
    text: Or 'a woman who provides for her husband.' The Hebrew מְכַלְכֶּלֶת and Greek ἐπιχορηγῇ both carry the sense of supplying or sustaining materially.
    reason: lexical_alternative
translation:
  language: ko
  text: 아내가 남편을 부양하면[a], 그로 인해 수치와 부끄러움이 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘남편에게 물자를 공급하는 여자’. 히브리어 מְכַלְכֶּלֶת과 그리스어 ἐπιχορηγῇ는 모두 물질적으로 공급하거나 생계를 유지하게 한다는 뜻을 가집니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי בַעֲדָהּ
  english_pob_choice: For because of her
  chosen_korean: 그 여자 때문에
  alternatives_korean:
  - 그녀로 인해
  - 그 여자 탓에
  - 그 여자 때문에 그러하니
  lexicon: HALOT
  rationale: 원문의 인과 연결을 자연스럽게 살리면서, בַעֲדָהּ의 원인·계기 의미를 한국어 인과 표현으로 옮겼습니다.
- source_word: חֶרְפָּה וּבֹשֶׁת
  english_pob_choice: reproach and shame
  chosen_korean: 수치와 부끄러움
  alternatives_korean:
  - 비난과 수치
  - 치욕과 수치
  - 모욕과 부끄러움
  lexicon: HALOT
  rationale: 두 명사를 대응시키되, חֶרְפָּה의 공적 수치와 בֹשֶׁת의 수치감을 한국어의 ‘수치’와 ‘부끄러움’으로 구분해 담았습니다.
- source_word: אִשָּׁה מְכַלְכֶּלֶת
  english_pob_choice: a wife supports
  chosen_korean: 아내가 남편을 부양할 때에
  alternatives_korean:
  - 아내가 남편을 먹여 살릴 때에
  - 여자가 남편을 부양할 때에
  - 아내가 남편을 돕고 먹여 살릴 때에
  lexicon: HALOT
  rationale: מְכַלְכֶּלֶת은 단순한 도움보다 물질적 유지·공급을 가리키므로, 문맥상 ‘부양하다’가 가장 직접적입니다.
- source_word: אֶת בַּעֲלָהּ
  english_pob_choice: her husband
  chosen_korean: 남편을
  alternatives_korean:
  - 그의 남편을
  - 배우자를
  - 주인을
  lexicon: HALOT
  rationale: בַּעַל은 여기서 소유주가 아니라 혼인 관계의 ‘남편’이 분명하므로, 관계를 명시하는 번역이 적절합니다.
theological_decisions:
- issue: 여성의 남편 부양을 수치로 연결하는 고대 사회적 평가를 어떻게 드러낼지
  chosen_reading: 본문의 수치 진술을 그대로 유지하고, 해설적 완화는 넣지 않았습니다.
  alternative_readings:
  - 고대 가부장적 관념임을 주석적으로 완화하기
  - 의역하여 중립화하기
  rationale: 히브리어와 그리스어 모두 이 상황을 공적 수치로 진술하므로, 번역이 그 긴장을 희석하지 않도록 했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
