base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/025/024.yaml
  text: From a woman is the beginning of sin[b][a], and because of her we all die together.
  footnotes:
  - marker: a
    text: Or, 'and because of her we all died/perished.' The Hebrew verb can be read as a completed action, while the Greek parallel reads 'we all die,' supporting the present, universal sense used in the main text.
    reason: lexical_alternative
  - marker: b
    text: The line likely alludes to the woman in the primeval fall narrative; the verse states this tersely and does not itself elaborate the theology.
    reason: cross_reference
translation:
  language: ko
  text: 여인에게서 죄의 시작이 있으며, 그녀로 인해 우리는 모두 함께 죽습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 완료된 사건처럼 읽을 수 있지만, 그리스어 평행구는 ‘우리는 모두 죽습니다’라는 현재적·보편적 진술을 지지합니다.
    reason: lexical_alternative
  - marker: b
    text: 이 구절은 대체로 태고의 타락 이야기의 여인을 암시하는 것으로 읽히지만, 본문 자체는 그 신학을 길게 설명하지 않습니다.
    reason: cross_reference
lexical_decisions:
- source_word: מֵאִשָּׁה
  english_pob_choice: From a woman
  chosen_korean: 여인에게서
  alternatives_korean:
  - 한 여인에게서
  - 여자로부터
  - 아내에게서
  lexicon: HALOT
  rationale: מִן + אִשָּׁה는 출처·기원을 나타내므로 한국어로는 ‘-에게서’가 자연스럽고, 본문은 일반적이고 상징적인 ‘여인’을 가리키므로 ‘아내’는 배제했습니다.
- source_word: תְחִלַת עָוֹן
  english_pob_choice: the beginning of sin
  chosen_korean: 죄의 시작
  alternatives_korean:
  - 죄의 근원
  - 죄의 첫 시작
  - 죄의 출발
  lexicon: HALOT
  rationale: תְחִלַת은 ‘시작/개시’이고 עָוֹן은 여기서 도덕적 잘못을 가리키므로, 축약된 잠언체를 살려 ‘죄의 시작’으로 옮겼습니다.
- source_word: וּבִגְלָלָהּ
  english_pob_choice: because of her
  chosen_korean: 그녀로 인해
  alternatives_korean:
  - 그녀 때문에
  - 그녀의 탓으로
  - 그녀로 말미암아
  lexicon: HALOT
  rationale: בגלל은 인과를 나타내며, 본문의 직접적 원인 표지를 살리면서도 현대 한국어에서 자연스러운 표현으로 옮겼습니다.
- source_word: גָוַעְנוּ יַחַד
  english_pob_choice: we all die together
  chosen_korean: 우리는 모두 함께 죽습니다
  alternatives_korean:
  - 우리는 모두 죽습니다
  - 우리는 함께 죽습니다
  - 우리는 모두 같이 죽습니다
  lexicon: HALOT
  rationale: 가운데 동사는 죽음을 뜻하고 יַחַד는 집합적 동시성을 더하므로, 영어 POB의 ‘together’를 따라 ‘모두 함께’로 중첩 없이 자연스럽게 살렸습니다.
theological_decisions:
- issue: 여성을 죄와 죽음의 기원으로 진술하는 직설적 문구를 완화할지 여부
  chosen_reading: 본문의 성별 표지를 그대로 유지해 ‘여인에게서… 그녀로 인해…’로 옮겼습니다.
  alternative_readings:
  - 사람에게서 죄의 시작이 있습니다
  - 한 여인으로 말미암아 죄가 시작되었습니다
  rationale: 히브리어와 그리스어가 모두 단수 여성 명사를 쓰므로, 본문의 날카로운 표현을 중화하지 않고 그대로 드러내는 것이 원문에 더 충실합니다.
  doctrine_reference: 'DOCTRINE.md: gender-accurate over gender-neutral; preserve theological tension rather than resolve it.'
