  text: Happy is the man who has not stumbled with his tongue[a], and has not served one more contemptible than himself.
  footnotes:
  - marker: a
    text: 'Greek reads instead: ''a man rejoicing in his children, living and seeing the downfall of enemies.'' The Hebrew witness here differs substantially from the Greek.'
