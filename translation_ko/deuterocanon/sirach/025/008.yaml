translation:
  language: ko
  text: 말에서 실수하지 않는 사람은 행복합니다[a], 자기보다 더 비천한 사람을 섬기지 않았기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 대신 ‘자녀들을 기뻐하는 사람, 살아서 원수의 몰락을 보는 사람’으로 읽습니다. 여기의 히브리어 증거는 그리스어와 상당히 다릅니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אַשְׁרֵי
  english_pob_choice: Happy is
  chosen_korean: 행복합니다
  alternatives_korean:
  - 복됩니다
  - 복이 있습니다
  lexicon: HALOT
  rationale: 지혜문학의 복 선언을 현대 한국어로 자연스럽게 살리면서, 단순한 종교적 정형어보다 삶의 상태를 가리키는 뉘앙스를 유지합니다.
- source_word: נִכְשַׁל
  english_pob_choice: has not stumbled
  chosen_korean: 실수하지 않는
  alternatives_korean:
  - 넘어지지 않는
  - 걸려 넘어지지 않는
  lexicon: HALOT
  rationale: ‘혀/말’과 결합할 때 말의 잘못이나 언어적 실책을 가리키므로, 직유를 과도하게 굳히지 않으면서도 ‘stumble’의 도덕적 함의를 드러냅니다.
- source_word: עֹבֵד נִקְלֶה מִמֶּנּוּ
  english_pob_choice: has not served one more contemptible than himself
  chosen_korean: 자기보다 더 비천한 사람을 섬기지 않았기 때문입니다
  alternatives_korean:
  - 자기보다 더 천한 사람의 종이 되지 않았기 때문입니다
  - 자기보다 더 천한 사람을 섬기지 않았기 때문입니다
  lexicon: HALOT
  rationale: ‘섬기다’는 관계적 종속을 넓게 살리며, POB의 ‘served’와도 맞습니다. ‘종이 되다/노예가 되다’는 본문이 요구하는 봉사·복종의 폭보다 더 강하게 특정할 수 있어 보류했습니다.
- source_word: בִּלְשׁוֹנוֹ
  english_pob_choice: with his tongue
  chosen_korean: 말에서
  alternatives_korean:
  - 혀로
  - 말로
  lexicon: HALOT
  rationale: 직역의 이미지보다 한국어에서 자연스러운 표현을 택하되, 말의 영역이라는 본문 초점을 유지합니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행본문의 상이한 내용 처리
  chosen_reading: 본문은 현존 히브리어를 따르고, 그리스어의 ‘자녀로 기뻐하는 사람… 원수의 몰락을 보는 사람’ 읽기는 주석 각주로 분리했습니다.
  alternative_readings:
  - '그리스어 병행: ‘자녀들을 기뻐하는 사람, 살아서 원수의 몰락을 보는 사람’'
  rationale: 이 절은 히브리어와 그리스어가 실질적으로 다른 전승이므로, 본문을 하나로 평준화하지 않고 차이를 드러내는 것이 source-grounded 원칙에 맞습니다.
  doctrine_reference: 'PHILOSOPHY.md: 히브리어가 보존된 경우 그 본문을 우선하고, 중요한 이문은 노출한다.'
