  naturalness: ‘말에서 실수하지 않는’은 자연스럽지만 נִכְשַׁל의 ‘넘어지다’ 비유와 בִּלְשׁוֹנוֹ의 도구적 표현을 다소 약화합니다. ‘말로 넘어지지 않는’은 현대 한국어에서도 자연스러우며 원문의 표현을 더 잘 보존합니다. ‘비천한’은 사람의 사회적·도덕적 낮음을 나타내는 데 가능하나, 현대어에서는 불필요하게 강하고 계층적인 어감을 낼 수 있어 ‘천한’보다 완화된 ‘하찮은’도 고려할 수 있습니다. 그러나 נִקְלֶה의 경멸적 평가를 살려 ‘비천한’을 유지할 수 있습니다.
