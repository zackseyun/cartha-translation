  text: 그것이 당신의 손을 따라 가지 않으면, 당신의 살에서 그것을 잘라 내십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 직역은 ‘당신의 손을 따라’로, 남편의 지시나 주도 아래 행동한다는 관용적 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘당신의 살에서 잘라 내라’는 표현은 이혼의 기술적 용어가 아니라, 신체적 이미지를 통해 단호한 분리를 나타냅니다.
    reason: alternative_reading
