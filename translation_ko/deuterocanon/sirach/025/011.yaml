  - 소와 나귀를 함께 밭갈이하지 않는 사람입니다
  lexicon: HALOT
  rationale: חוֹרֵשׁ는 ‘갈다/쟁기질하다’의 뜻이며, 여기서는 현대 한국어에서 가장 자연스러운 농경 동사 ‘갈다’를 택해 관용적으로 표현했습니다. ‘함께’는 יַחְדָּו를 살립니다.
