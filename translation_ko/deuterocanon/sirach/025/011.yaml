  rationale: 가정적·실천적 맥락에서 좋은 판단력을 가리키므로, 일상적이면서도 판단의 올바름을 담는 ‘현명한’이 가장 균형적입니다.
- source_word: חוֹרֵשׁ בְּשׁוֹר וְבַחְמוֹר יַחְדָּו
  english_pob_choice: does not plow with an ox and a donkey together
  chosen_korean: 소와 나귀를 함께 갈지 않는 사람입니다
  alternatives_korean:
  - 소와 나귀를 함께 쟁기질하지 않는 사람입니다
  - 소와 나귀를 함께 밭갈이하지 않는 사람입니다
  lexicon: HALOT
  rationale: חוֹרֵשׁ는 ‘갈다/쟁기질하다’의 뜻이며, 여기서는 현대 한국어에서 가장 자연스러운 농경 동사 ‘갈다’를 택해 관용적으로 표현했습니다. ‘함께’는 יַחְדָּו를 살립니다.
