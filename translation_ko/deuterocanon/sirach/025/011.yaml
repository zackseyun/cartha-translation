  source_fidelity: 본문은 현존 히브리어의 ‘슬기로운 아내를 둔 남편’과 ‘소와 나귀를 함께 사용하여 밭을 갈지 않는’ 사람이라는 병렬 묘사를 따릅니다. 다만 초안의 서술어 연결은 두 번째 묘사를 독립된 ‘사람’으로 다시 정의하여 한국어 문장 구조가 부자연스럽습니다. 또한 ‘소와 나귀를 함께 갈다’는 동물을 갈거나 밭을 가는 대상이 무엇인지 모호할 수 있으므로, 두 짐승을 함께 써서 밭을 간다는 뜻을 명시하는 것이 안전합니다. 그리스어 이문 각주는 본문과의 큰 차이를 적절히 보존하되, εὑρών의 ‘찾아낸’을 더 분명히 반영했습니다.
  naturalness: ‘현명한 아내를 둔 남편은 행복하고, 소와 나귀를 함께 써서 밭을 갈지 않습니다’는 합쇼체 문장으로 자연스럽고, 두 절이 같은 남편을 묘사한다는 현재 초안 및 영어 감사 기록의 이해를 유지합니다.
  terminology: בעל אשה는 ‘남편’, משכלת은 실천적 판단력을 나타내는 ‘현명한’, חורש는 ‘밭을 갈다’로 옮겼습니다. ‘함께 써서’는 원문의 ‘함께’와 신명기 22:10의 농경 행위를 자연스러운 한국어로 드러내며, 비유적 의미를 본문에 과도하게 첨가하지 않습니다.
