base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/025/011.yaml
  text: Happy is the husband of a prudent wife[b][a], and who does not plow with an ox and a donkey together.
  footnotes:
  - marker: a
    text: 'Greek has a substantially different reading: ''How great is one who has found wisdom, but there is none above one who fears the Lord.'''
    reason: alternative_reading
  - marker: b
    text: The image likely alludes to Deuteronomy 22:10, which forbids plowing with an ox and a donkey together; here it functions proverbially for an ill-matched pairing.
    reason: cross_reference
translation:
  language: ko
  text: 현명한 아내를 둔 남편은 행복하고, 소와 나귀를 함께 써서 밭을 갈지 않습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '그리스어에는 상당히 다른 읽기가 있습니다: “지혜를 찾아낸 사람은 얼마나 위대한가! 그러나 주님을 경외하는 사람보다 더 위대한 이는 없습니다.”'
    reason: alternative_reading
  - marker: b
    text: 이 이미지는 신명기 22:10의 ‘소와 나귀를 함께 갈지 말라’는 규정을 떠올리게 하며, 여기서는 어울리지 않는 짝을 가리키는 속담처럼 쓰입니다.
    reason: cross_reference
