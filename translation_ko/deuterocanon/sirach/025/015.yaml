  text: There is no head above the head of a snake[a], and there is no wrath above the wrath of an enemy.
  footnotes:
  - marker: a
    text: Or, 'There is no venom like the venom of a snake.' The Greek literally says 'head ... head of a snake,' and the translation preserves that image rather than replacing it with an interpretive paraphrase.
    reason: lexical_alternative
translation:
  language: ko
  text: 뱀의 머리 위에 있는 머리보다 더 높은 머리는 없으며, 원수의 분노보다 더 큰 분노도 없습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘뱀의 머리…’입니다. 일부 해석은 이를 뱀의 독이나 위험성의 관용적 표현으로 보지만, 본문은 해석 대신 이미지를 유지합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: κεφαλή
  english_pob_choice: head
  chosen_korean: 머리
  alternatives_korean:
  - 정수리
  - 머리통
  - 수장
  lexicon: LSJ
  rationale: 그리스어는 두 번 모두 문자 그대로 κεφαλή를 쓰므로, 해석적 바꿈 없이 ‘머리’를 유지해 직유적 이미지를 살렸습니다.
- source_word: ὄφις
  english_pob_choice: snake
  chosen_korean: 뱀
  alternatives_korean:
