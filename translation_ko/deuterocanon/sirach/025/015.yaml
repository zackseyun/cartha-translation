  text: There is no head above the head of a snake[a], and there is no wrath above the wrath of an enemy.
  footnotes:
  - marker: a
    text: Or, 'There is no venom like the venom of a snake.' The Greek literally says 'head ... head of a snake,' and the translation preserves that image rather than replacing it with an interpretive paraphrase.
    reason: lexical_alternative
translation:
  language: ko
  text: 뱀의 머리보다 더한 머리는 없으며, 원수의 분노보다 더한 분노도 없습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어를 직역하면 ‘뱀의 머리보다 더한 머리는 없다’입니다. 일부에서는 ‘뱀의 독보다 더한 독은 없다’는 뜻으로 이해하기도 하지만, 그리스어 본문은 ‘머리’를 두 번 사용하므로 번역도 그 이미지를 유지합니다.
    reason: lexical_alternative
