  - 서펀트
  lexicon: LSJ
  rationale: 현대 한국어에서 가장 자연스럽고 직접적인 대응어는 ‘뱀’이며, 문맥의 경구적 표현에도 잘 맞습니다.
- source_word: θυμός
  english_pob_choice: wrath
  chosen_korean: 분노
  alternatives_korean:
  - 노여움
  - 격분
  - 진노
  lexicon: LSJ
  rationale: 여기서는 강한 적대적 감정을 가리키므로 ‘분노’가 가장 무난하게 원문의 강도를 전달합니다.
- source_word: ὑπέρ
  english_pob_choice: above
  chosen_korean: ~보다 더
  alternatives_korean:
  - ~위에
  - ~보다 큰
  - ~를 넘어
  lexicon: LSJ
  rationale: 비교 구문에서 ὑπέρ의 우위 의미를 한국어의 비교형으로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 직유적 경구를 해석적으로 완화할지 여부
  chosen_reading: 뱀의 ‘머리’ 이미지를 그대로 살려, ‘독’이나 ‘독사’로 바꾸지 않았습니다.
  alternative_readings:
  - ‘뱀의 독보다 더 큰 것은 없다’
  - ‘독사보다 더한 머리는 없다’
  rationale: 그리스어 본문은 κεφαλή를 반복해 실제로 ‘머리’를 말하므로, 문학적 이미지를 보존하는 편이 원문 충실도에 맞습니다.
  doctrine_reference: 지혜문학의 비유적 표현 보존 원칙
