  lexicon: HALOT
  rationale: 연령의 시기를 가리키는 표현으로, 현재 합쇼체 문장 안에서 가장 자연스럽고 격식 있는 표현을 택했습니다.
- source_word: לֹא חֲפַצְתָּם
  english_pob_choice: you did not seek them
  chosen_korean: 그것들을 원하지 않았다
  alternatives_korean:
  - 그것들을 찾지 않았다
  - 그것들을 바라지 않았다
  lexicon: HALOT
  rationale: חפץ는 기본적으로 ‘기뻐하다/원하다’의 뜻이므로, 본문이 유지하는 대상의 불특정성을 살려 ‘그것들’을 두고 ‘원하지 않았다’로 옮겼습니다.
- source_word: תַּשִּׁיגֵם
  english_pob_choice: you attain them
  chosen_korean: 그것들을 얻을 수 있겠습니까
  alternatives_korean:
  - 그것들을 이룰 수 있겠습니까
  - 그것들을 획득할 수 있겠습니까
  lexicon: HALOT
  rationale: השיג는 ‘미치다, 따라잡다, 얻다’의 범위를 가지므로, 수사적 질문에 맞게 결과적 도달을 드러내는 ‘얻을 수 있겠습니까’로 옮겼습니다.
- source_word: בְּזִקְנוֹתֶיךָ
  english_pob_choice: in your old age
  chosen_korean: 늙은 나이에
  alternatives_korean:
  - 노년에
  - 늙어서
  lexicon: HALOT
  rationale: 젊은 시절과의 대조를 분명히 하면서도 현대 한국어에서 자연스러운 노화의 시기를 나타내는 표현을 택했습니다.
theological_decisions:
- issue: 히브리어의 불특정 복수 목적어
  chosen_reading: 본문의 ‘그것들’을 그대로 유지하여, 대상이 특정 명사로 확정되지 않도록 했습니다.
  alternative_readings:
  - 지혜를
  - 좋은 것들을
  rationale: 히브리어는 복수 목적어만 남기고 대상을 명시하지 않으며, 그 모호성을 풀어 써서 특정화하면 원문이 가진 수사적 긴장이 약해집니다.
  doctrine_reference: 'DOCTRINE.md: 원문이 남긴 모호성은 해소하지 말고 유지할 것.'
