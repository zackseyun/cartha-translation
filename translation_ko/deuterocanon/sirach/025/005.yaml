base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/025/005.yaml
  text: If you did not desire them in your youth[b][a], how will you attain them in your old age?
  footnotes:
  - marker: a
    text: The Hebrew has an unspecified plural object, 'them.' In context, the Greek parallel speaks of judgment and understanding counsel, so the reference is likely to wisdom-related qualities or attainments.
    reason: lexical_alternative
  - marker: b
    text: Hebrew חפץ more literally means 'desire' or 'take pleasure in'; the rendering 'seek' brings out the active sense implied by the rhetorical question and the Greek parallel.
    reason: alternative_reading
translation:
  language: ko
  text: 젊은 시절에 그것들을[a] 원하지 않았다면[b], 노년에 어떻게 그것들을 얻겠습니까?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 목적어를 특정하지 않은 복수형만 두며, 그 대상은 문맥상 지혜와 관련된 성취일 수 있습니다.
    reason: source_note
  - marker: b
    text: חפץ는 문자적으로는 ‘원하다, 기뻐하다’의 뜻이지만, 수사적 문맥에서는 적극적으로 추구하지 않았다는 뉘앙스를 띱니다.
    reason: alternative_reading
