  - 늙은이의 발밑에 있는
  - 어른의 발밑에 있는
  lexicon: HALOT; Greek parallel ἐν ποσὶν πρεσβυτέρου
  rationale: יָשִׁישׁ은 연로한 사람을 가리키므로, 발 아래의 불안정함이라는 비유를 한국어로 자연스럽게 드러냈습니다.
- source_word: אֵשֶׁת לָשׁוֹן
  english_pob_choice: a sharp-tongued wife
  chosen_korean: 말이 많은 여자는
  alternatives_korean:
  - 수다스러운 여자는
  - 혀가 센 여자는
  - 말 많은 아내는
  lexicon: HALOT; Greek parallel γυνὴ γλωσσώδης
  rationale: 직역하면 ‘혀의 아내’이지만, 관용적으로 잦고 해로운 말을 가리키므로 그 의미를 풀어 ‘말이 많은 여자’로 옮겼습니다. ‘sharp-tongued’의 공격성을 살리되, 한국어 속담체의 자연스러움을 우선했습니다.
- source_word: לְאִישׁ רַךְ
  english_pob_choice: to a gentle man
  chosen_korean: 조용한 남자에게
  alternatives_korean:
  - 온유한 남자에게
  - 부드러운 남자에게
  - 잠잠한 남자에게
  lexicon: HALOT; Greek parallel ἀνδρὶ ἡσύχῳ
  rationale: רַךְ는 본래 ‘부드러운/연한’이지만 사람에 대해서는 성향의 부드러움, 차분함을 뜻할 수 있으므로, 그리스어 ἡσύχῳ의 ‘조용한/평온한’ 뉘앙스를 살렸습니다.
theological_decisions:
- issue: 성별이 분명한 지혜 격언의 번역
  chosen_reading: 여자 / 남자와 같은 성별 표지를 유지했습니다.
  alternative_readings:
  - 배우자 / 사람
  - 한 사람 / 다른 사람
  rationale: 히브리어와 그리스어 모두 여성형과 남성형을 명시하므로, 성별 대립 구조를 중화하지 않고 그대로 드러내는 것이 본문의 형식을 보존합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
