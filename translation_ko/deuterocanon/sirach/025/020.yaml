revisions:
- from: 늙은 사람의 발밑에 있는 모래의 오르막처럼, 말이 많은 여자는 조용한 남자에게 그렇습니다.[a][b][c]
  to: 연로한 이의 발밑에 있는 모래 비탈이 그러하듯, 말 많은 아내도 온유한 남자에게 그러합니다.[a][b][c]
  rationale: 혼인 관계를 나타내는 אֵשֶׁת를 ‘아내’로 바로잡고, 히브리어 רַךְ의 의미를 우선하여 ‘온유한’으로 옮겼습니다. 그리스어 평행문에서 비롯되는 ‘조용한/평온한’ 해석과 난해한 חוּץ의 ‘모래의’ 해석은 각주에 밝혔습니다. 문장은 원문의 비교 대구를 살리는 자연스러운 합쇼체 격언 문장으로 다듬었습니다.
