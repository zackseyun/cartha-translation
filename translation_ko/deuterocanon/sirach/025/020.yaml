base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/025/020.yaml
  text: Like a sandy ascent under the feet of an old man[c][b][a], so is a sharp-tongued wife to a gentle man.
  footnotes:
  - marker: a
    text: 'Hebrew חוּץ is difficult here; the Greek parallel reads ''sandy,'' which likely preserves the sense of the image: unstable footing for an elderly man.'
    reason: textual_variant
  - marker: b
    text: Or 'a talkative wife.' The Hebrew idiom literally says 'a wife of tongue,' and the Greek has 'a tongue-given woman.'
    reason: lexical_alternative
  - marker: c
    text: Or 'to a quiet man.' The Greek parallel uses a word that can mean 'quiet' or 'peaceable'; 'gentle' was chosen for natural English and to reflect the contrast in character.
    reason: lexical_alternative
translation:
  language: ko
  text: 늙은 사람의 발밑에 있는 모래의 오르막처럼, 말이 많은 여자는 조용한 남자에게 그렇습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 חוּץ는 여기서 난해하며, 그리스어 평행문은 ‘모래의’라는 뜻을 지지합니다.
    reason: textual_variant
  - marker: b
    text: 직역하면 ‘혀를 가진 아내’에 가까우며, 관용적으로는 말이 많은 여자를 뜻합니다.
    reason: lexical_alternative
  - marker: c
    text: 그리스어는 ‘조용한’ 또는 ‘평온한’ 뜻을 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּמַעֲלֵה חוּץ
  english_pob_choice: Like a sandy ascent
  chosen_korean: 모래의 오르막처럼
  alternatives_korean:
  - 모래언덕처럼
  - 모래의 비탈처럼
  - 거친 비탈처럼
  lexicon: HALOT; Greek parallel ἀνάβασις ἀμμώδης
  rationale: 히브리어의 난해한 חוּץ는 그리스어 평행문의 ‘모래의(sandy)’가 받쳐 주므로, 불안정한 모래 비탈의 이미지를 살려 옮겼습니다.
- source_word: לְרַגְלֵי יָשִׁישׁ
  english_pob_choice: under the feet of an old man
  chosen_korean: 늙은 사람의 발밑에 있는
  alternatives_korean:
  - 노인의 발밑에 있는
  - 늙은이의 발밑에 있는
  - 어른의 발밑에 있는
  lexicon: HALOT; Greek parallel ἐν ποσὶν πρεσβυτέρου
  rationale: יָשִׁישׁ은 연로한 사람을 가리키므로, 발 아래의 불안정함이라는 비유를 한국어로 자연스럽게 드러냈습니다.
- source_word: אֵשֶׁת לָשׁוֹן
  english_pob_choice: a sharp-tongued wife
  chosen_korean: 말이 많은 여자는
  alternatives_korean:
  - 수다스러운 여자는
  - 혀가 센 여자는
  - 말 많은 아내는
  lexicon: HALOT; Greek parallel γυνὴ γλωσσώδης
  rationale: 직역하면 ‘혀의 아내’이지만, 관용적으로 잦고 해로운 말을 가리키므로 그 의미를 풀어 ‘말이 많은 여자’로 옮겼습니다. ‘sharp-tongued’의 공격성을 살리되, 한국어 속담체의 자연스러움을 우선했습니다.
- source_word: לְאִישׁ רַךְ
  english_pob_choice: to a gentle man
  chosen_korean: 조용한 남자에게
  alternatives_korean:
  - 온유한 남자에게
  - 부드러운 남자에게
  - 잠잠한 남자에게
  lexicon: HALOT; Greek parallel ἀνδρὶ ἡσύχῳ
  rationale: רַךְ는 본래 ‘부드러운/연한’이지만 사람에 대해서는 성향의 부드러움, 차분함을 뜻할 수 있으므로, 그리스어 ἡσύχῳ의 ‘조용한/평온한’ 뉘앙스를 살렸습니다.
theological_decisions:
- issue: 성별이 분명한 지혜 격언의 번역
  chosen_reading: 여자 / 남자와 같은 성별 표지를 유지했습니다.
  alternative_readings:
  - 배우자 / 사람
  - 한 사람 / 다른 사람
  rationale: 히브리어와 그리스어 모두 여성형과 남성형을 명시하므로, 성별 대립 구조를 중화하지 않고 그대로 드러내는 것이 본문의 형식을 보존합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
