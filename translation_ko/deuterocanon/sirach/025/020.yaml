  lexicon: HALOT; Greek parallel ἀνάβασις ἀμμώδης
  rationale: 히브리어의 난해한 חוּץ는 그리스어 평행문의 ‘모래의(sandy)’가 받쳐 주므로, 불안정한 모래 비탈의 이미지를 살려 옮겼습니다.
- source_word: לְרַגְלֵי יָשִׁישׁ
  english_pob_choice: under the feet of an old man
  chosen_korean: 늙은 사람의 발밑에 있는
  alternatives_korean:
