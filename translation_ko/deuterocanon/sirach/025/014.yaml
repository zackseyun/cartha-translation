  source_fidelity: 원문의 πᾶσαν … καὶ μὴ … 반복과 생략된 비교를 반영하려는 방향은 적절합니다. 다만 현 번역은 목적격 형태인 ‘모든 상처를’, ‘모든 복수를’ 뒤에 이를 지배할 동사가 없고, ‘…는 아니며’의 비교 대상도 문법적으로 성립하지 않아 원문의 격언적 비교가 한국어에서 전달되지 않습니다. ‘미워하는 자들의 상처’와 ‘원수들의 복수’는 문맥상 그들이 가하는 해악과 보복으로 이해하는 것이 자연스럽습니다.
  naturalness: 현 문장은 쉼표·세미콜론으로 이어진 명사구와 ‘아닙니다’가 결합되어 현대 표준 한국어 합쇼체 문장으로 자연스럽지 않습니다. 비교 관계를 명시하되, ‘보다야’와 ‘낫습니다’를 사용하면 짧고 자연스러운 격언체가 됩니다.
  terminology: ‘상처’는 논쟁적인 ἐπαγωγή의 간결한 번역으로 유지할 수 있으며, 각주에서 ‘해악’ 또는 ‘환난’의 넓은 가능성을 밝혀야 합니다. ἐκδίκησις의 ‘복수’, μισούντων의 ‘미워하는 자들’, ἐχθρῶν의 ‘원수들’도 적절합니다. 다만 소유격만으로는 누가 상처·복수를 가하는지 다소 불분명하므로 ‘미워하는 자들이 입히는’, ‘원수들이 하는’으로 풀어 쓰는 것이 문맥상 명료합니다.
