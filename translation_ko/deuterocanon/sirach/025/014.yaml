theological_decisions:
- issue: 본문의 생략된 비교적 의미
  chosen_reading: ‘모든 … 그러나 …는 아니다’라는 대구를 그대로 살려, 미워하는 자들과 원수들의 상처와 복수가 특히 더 나쁜 것임을 암시하는 격언으로 읽었습니다.
  alternative_readings:
  - ‘그들의 상처/복수보다 차라리 어떤 상처나 복수든 낫다’는 비교문으로 풀어 쓰기
  - ‘상처’ 대신 더 넓은 ‘환난’으로 일반화하기
  rationale: 헬라어는 동사 없이 병렬된 격언형 문장입니다. 한국어도 설명을 덧붙이기보다 원문의 압축성과 대비를 유지하는 편이 더 충실합니다.
  doctrine_reference: '번역 원칙: 실제로 본문이 말하는 대비를 보존하고, 모호성은 불필요하게 해소하지 않습니다.'
