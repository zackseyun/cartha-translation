  rationale: '한국어에서 성립하는 비교문으로 고쳐 원문의 생략된 격언적 의미를 드러냈습니다. 어순은 한국어의 자연스러운 비교 표현을 위해 조정했으나, 두 병렬 항목과 ‘상처/복수’, ‘미워하는 자들/원수들’의 대구는 보존했습니다. 각주 b의 원문 직역에는 ‘상처는’의 조사 오류가 없도록 문구를 정비할 필요가 있어, 아래와 같이 이해되어야 합니다: ‘… 미워하는 자들의 상처가 아니고; … 원수들의 복수가 아니다.’'
