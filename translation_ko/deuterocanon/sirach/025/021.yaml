translation:
  language: ko
  text: 여자의 아름다움에 마음을 빼앗기지 마십시오. 그리고 그 여자가 가진 것을 탐내지 마십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 병행본문은 ‘한 여자를 탐내지 마라’라고 더 단순하게 읽습니다. 그러나 이 절의 히브리어 증인은 ‘그 여자가 가진 것’을 이유로 삼는 더 구체적인 경고를 담고 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תִּפּוֹל
  english_pob_choice: Do not fall for
  chosen_korean: 마음을 빼앗기지 마십시오
  alternatives_korean:
  - 넘어지지 마십시오
  - 빠지지 마십시오
  - 홀리지 마십시오
  lexicon: HALOT
  rationale: 히브리어의 ‘떨어지다’는 직역보다, 아름다움에 매혹되어 끌려 들어가는 뜻을 한국어로 자연스럽게 드러내기 위해 ‘마음을 빼앗기다’를 택했습니다.
- source_word: בְּיֹפִי
  english_pob_choice: for ... beauty
  chosen_korean: 아름다움에
  alternatives_korean:
  - 아름다움 때문에
  - 아름다움으로
  - 아름다움을 보고
  lexicon: HALOT
  rationale: 전치사 ב의 원인·계기 뉘앙스를 살려, 유혹의 계기가 되는 ‘아름다움에’로 옮겼습니다.
- source_word: וְעַל יֵש לָהּ
  english_pob_choice: for what she has
  chosen_korean: 그 여자가 가진 것을
  alternatives_korean:
  - 그녀의 소유를
  - 그녀의 재산을
  - 그녀가 가진 것을
  lexicon: HALOT
  rationale: 히브리어의 압축된 표현을 반복을 줄이면서도, 그녀에게 속한 것 때문에 탐내지 말라는 뜻이 드러나도록 옮겼습니다.
- source_word: לֹא תַּחְמוֹד
  english_pob_choice: do not desire
  chosen_korean: 탐내지 마십시오
  alternatives_korean:
  - 욕심내지 마십시오
  - 원하지 마십시오
  - 갈망하지 마십시오
  lexicon: HALOT
  rationale: חמד의 윤리적 금지 뉘앙스를 살려, 단순한 욕구보다 더 강한 ‘탐내다’로 옮겼습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행본문의 차이
  chosen_reading: 본문은 히브리어의 두 번째 절을 따라 ‘그 여자가 가진 것을 탐내지 마십시오’로 유지했습니다.
  alternative_readings:
  - 그리고 여자를 탐내지 마십시오
  - 그리고 그 여자에게 욕심내지 마십시오
  rationale: 이 구절은 히브리어가 더 구체적이며, POB의 원칙상 살아 있는 히브리어 본문을 우선합니다. 그리스어는 더 일반적인 금지로 단순화하지만, 본문은 히브리어의 소유·소지 뉘앙스를 보존했습니다.
