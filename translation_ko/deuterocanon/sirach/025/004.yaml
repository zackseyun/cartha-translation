translation:
  language: ko
  text: 젊을 때에 모으지 않았다면, 늙어서 어찌 찾을 수 있겠습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 구절의 그리스어 동사 형태는 전승상 난해합니다. 번역은 '모으다' 또는 '거두다'라는 가능한 뜻을 따랐습니다.
    reason: textual_variant
lexical_decisions:
- source_word: ἐν νεότητι
  english_pob_choice: in your youth
  chosen_korean: 젊을 때에
  alternatives_korean:
  - 청년기에
  - 젊었을 때에
  - 젊은 시절에
  lexicon: LSJ
  rationale: 시간 구간을 가리키는 표현으로, 한국어에서는 자연스럽게 '젊을 때에'라고 옮겨 원문의 생애 단계 대비를 살렸습니다.
- source_word: οὐ συναγίοχας
  english_pob_choice: you did not gather
  chosen_korean: 모으지 않았다면
  alternatives_korean:
  - 가두지 않았다면
  - 수집하지 않았다면
  - 저축하지 않았다면
  lexicon: LSJ
  rationale: 비정상적이거나 손상된 형태이므로, POB의 'gather'에 맞춰 가장 중립적인 '모으다'를 택해 대상의 구체화를 피했습니다.
- source_word: πῶς ἂν εὕροις
  english_pob_choice: how then would you find
  chosen_korean: 어찌 그것을 찾을 수 있겠습니까
  alternatives_korean:
  - 어찌 찾겠습니까
  - 어떻게 찾을 수 있겠습니까
  - 그것을 어떻게 찾을 수 있겠습니까
  lexicon: LSJ
  rationale: 반문적 가능성을 한국어의 '어찌 … 수 있겠습니까'로 살려, 추론의 압박을 자연스럽게 드러냈습니다.
- source_word: ἐν τῷ γήρᾳ σου
  english_pob_choice: in your old age
  chosen_korean: 늙어서
  alternatives_korean:
  - 노년에
  - 늙은 때에
  - 늙어서야
  lexicon: LSJ
  rationale: '''늙어서''는 원문의 생애 후반을 가리키는 뜻을 간결하게 전하면서, 앞의 ''젊을 때에''와 대구를 이룹니다.'
theological_decisions:
- issue: 목적어의 생략을 어떻게 처리할지
  chosen_reading: 원문과 POB를 따라 '무엇을' 찾는지 구체화하지 않고 '그것을'로만 받았습니다.
  alternative_readings:
  - 지혜를 보충해 넣기
  - 양식을 보충해 넣기
  - 재물을 보충해 넣기
  rationale: 그리스어 본문은 목적어를 명시하지 않으므로, 한국어에서도 범위를 좁히지 않고 수사적 여백을 유지했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
- issue: 희귀한 동사 형태 συναγίοχας의 불확실성 처리
  chosen_reading: '''모으다'' 계열의 가능한 뜻을 따르되, 본문 불확실성을 본문 안에서는 과장하지 않았습니다.'
  alternative_readings:
  - 거두다
  - 수집하다
  - 저장하다
  rationale: 전승된 형태가 비정상적이므로, 번역은 가능한 의미를 보존하되 확정적인 해석을 본문에 덧씌우지 않는 것이 적절합니다.
  doctrine_reference: 'PHILOSOPHY.md: preserve source uncertainty honestly'
