  text: 노인의 면류관은 많은 경험이며, 그들의 자랑은 주님을 경외함입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘많은 경험’은 πολυπειρία의 직역에 가깝습니다. ‘큰 경험’ 또는 ‘풍부한 경험’으로도 옮길 수 있습니다.
    reason: lexical_alternative
