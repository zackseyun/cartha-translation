  - ‘경건함’
  rationale: 본문의 지혜적 역설은 하나님을 향한 실제적인 두려움과 경외를 함께 지니므로, 의미를 순화하는 표현은 피했습니다.
  doctrine_reference: 지혜문학의 관용구 φόβος Κυρίου
