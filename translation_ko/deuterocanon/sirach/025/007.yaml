  rationale: 연령을 가리키는 복수 속격이므로 직분적 뉘앙스가 있는 ‘장로들’은 피하고, 현대 한국어에서 자연스러운 ‘노인’으로 옮겼습니다.
- source_word: πολυπειρία
  english_pob_choice: much experience
  chosen_korean: 많은 경험
  alternatives_korean:
  - 큰 경험
  - 풍부한 경험
  - 오랜 경험
  lexicon: LSJ
  rationale: πολυ-의 양적 강조를 살리면서도 한국어에서 문맥상 자연스러운 표현으로 ‘많은 경험’을 택했습니다.
- source_word: φόβος Κυρίου
  english_pob_choice: the fear of the Lord
  chosen_korean: 주님을 경외함
  alternatives_korean:
  - 주님을 두려워함
  - 주를 경외함
  - 주님에 대한 경외
  lexicon: LSJ
  rationale: 지혜문학의 관용구인 ‘fear’는 단순한 공포보다 경외의 의미가 강하므로, 너무 약화시키지 않으면서도 한국어 표현으로는 ‘경외함’이 적절합니다.
theological_decisions:
- issue: φόβος Κυρίου의 정서적 강도
  chosen_reading: ‘경외함’으로 번역해 공포와 경건한 두려움이 함께 남도록 했습니다.
  alternative_readings:
  - ‘존경함’
  - ‘경건함’
  rationale: 본문의 지혜적 역설은 하나님을 향한 실제적인 두려움과 경외를 함께 지니므로, 의미를 순화하는 표현은 피했습니다.
  doctrine_reference: 지혜문학의 관용구 φόβος Κυρίου
