  source_fidelity: 그리스어는 ‘노인들’(γερόντων, 복수)의 면류관과 ‘그들의’ 자랑을 병렬로 말합니다. 초안의 ‘노인의’도 총칭적으로 이해될 수 있으나, 복수 관계를 명시하는 편이 원문에 더 충실합니다. ‘면류관’, ‘많은 경험’, ‘주님을 경외함’은 각각 στέφανος, πολυπειρία, φόβος Κυρίου를 적절히 반영합니다.
