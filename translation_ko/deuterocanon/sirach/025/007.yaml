translation:
  language: ko
  text: 노인들의 면류관은 많은 경험이며, 그들의 자랑은 주님을 경외함입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘많은 경험’은 πολυπειρία를 옮긴 것입니다. ‘풍부한 경험’ 또는 ‘폭넓은 경험’으로도 옮길 수 있으며, 오랜 시간에 걸쳐 쌓인 넓은 경험을 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: στέφανος
  english_pob_choice: crown
  chosen_korean: 면류관
  alternatives_korean:
  - 관
  - 왕관
  lexicon: LSJ
  rationale: στέφανος는 명예의 표지로서의 관을 가리키므로, 지혜 문맥에서 비유적 영예를 살리는 ‘면류관’이 가장 자연스럽습니다.
- source_word: γερόντων
