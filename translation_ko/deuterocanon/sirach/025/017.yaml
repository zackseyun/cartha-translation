translation:
  language: ko
  text: 여인의 악함은 남자의 얼굴을 어둡게 하고, 그의 얼굴을 곰처럼 침울하게 만듭니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 אִשָּׁה는 ‘여자’뿐 아니라 ‘아내’도 뜻할 수 있어, 이 구절은 가정적 맥락으로도 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어 병행문은 ‘그녀의 얼굴을 삼베처럼 어둡게 한다’고 읽어, 현존 히브리어의 ‘곰처럼’과 다른 비유를 보여 줍니다.
    reason: alternative_reading
