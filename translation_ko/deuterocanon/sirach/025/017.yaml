  lexicon: HALOT
  rationale: 히브리어 본문의 ברור한 동물 이미지를 직접 반영해 ‘곰처럼’으로 옮겼고, 수식어를 통해 앞의 ‘어둡게’와 연결되는 침울한 얼굴빛을 자연스럽게 풀었습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행문의 이미지 차이
  chosen_reading: 본문은 히브리어의 ‘곰처럼’을 본문에 반영하고, 그리스어의 ‘삼베처럼’ 이미지는 주석으로 남깁니다.
  alternative_readings:
  - 삼베처럼
  - 슬픔의 자루처럼
  rationale: 현존 히브리어 증거가 곰 이미지를 분명히 제시하므로 본문은 이를 따르되, 전승 차이로서 그리스어 병행문의 다른 비유는 본문 밖에서 보존합니다.
  doctrine_reference: DOCTRINE.md §Source priority and textual plurality
