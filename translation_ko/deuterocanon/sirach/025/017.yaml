  text: 여자의 악은 남자의 낯빛을 어둡게 하고, 그의 얼굴을 곰처럼 검게 합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 אִשָּׁה는 ‘여자’뿐 아니라 ‘아내’도 뜻할 수 있어, 이 구절은 가정적 맥락으로도 이해될 수 있습니다.
    reason: lexical_alternative
