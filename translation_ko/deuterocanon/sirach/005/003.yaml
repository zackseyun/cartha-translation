base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/005/003.yaml
  text: Do not go after your heart and your eyes[b][a], to walk in evil desires.
  footnotes:
  - marker: a
    text: Or 'Do not follow your heart and your eyes, to walk in wicked cravings.' The Hebrew phrase 'heart and eyes' is a concrete idiom for inward desire and outward attraction.
    reason: lexical_alternative
  - marker: b
    text: 'The Greek parallel for this verse differs substantially: ''And do not say, “Who will overpower me?” for the Lord will surely take vengeance on you.'' The Hebrew witness is therefore followed here as the primary text, with the Greek kept in view as a divergent parallel tradition.'
    reason: textual_variant
translation:
  language: ko
  text: 마음과 눈[a]을 따라 악한 욕망 속으로 걸어가지 마십시오.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 ‘마음과 눈’은 내면의 욕구와 외면의 끌림을 가리키는 구체적인 관용 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어 병행 전승은 이 구절을 크게 다르게 전합니다. “누가 나를 압도하겠느냐?”라고 말하지 마십시오. 주님께서 반드시 당신에게 보응하실 것입니다. 여기서는 히브리어 본문을 우선하여 따랐습니다.
    reason: textual_variant
lexical_decisions:
- source_word: אַל תֵּלֵךְ אַחֲרֵי
  english_pob_choice: Do not go after
  chosen_korean: 따라가지 마십시오
  alternatives_korean:
  - 가리지 마십시오
  - 뒤따르지 마십시오
  - 가십시오
  lexicon: HALOT
  rationale: הלך와 אַחֲרֵי의 결합은 단순 이동보다 ‘뒤따라가다/따르다’의 뜻이 강하므로, 한국어에서는 자연스러운 금지형으로 옮겼습니다.
- source_word: לִבְּךָ וְעֵינֵיךָ
  english_pob_choice: your heart and your eyes
  chosen_korean: 마음과 눈
  alternatives_korean:
  - 마음과 눈들
  - 심장과 눈
  - 생각과 눈
  lexicon: HALOT
  rationale: 히브리어의 ‘마음과 눈’은 내적 욕구와 외적 끌림을 가리키는 구체적 관용구이므로, 이를 그대로 살려 한국어에서도 이미지가 유지되도록 했습니다.
- source_word: לָלֶכֶת בַּחֲמוּדוֹת רָעָה
  english_pob_choice: to walk in evil desires
  chosen_korean: 악한 욕망 속으로 걸어가게 됩니다
  alternatives_korean:
  - 악한 욕망 안에서 걷게 됩니다
  - 악한 탐욕 속으로 걸어가게 됩니다
  - 악한 욕망을 따라 걷게 됩니다
  lexicon: HALOT
  rationale: חמודות는 ‘바람/탐하는 것들’의 폭이 있으나 여기서는 רָעָה가 도덕적으로 규정하므로, 독자에게 자연스럽고 경고의 힘이 분명한 ‘악한 욕망’으로 옮겼습니다. לָלֶכֶת는 앞의 금지와 호응하는 ‘걸어가다’로 처리했습니다.
theological_decisions:
- issue: ‘heart and eyes’의 신학적 인류학적 이미지 보존
  chosen_reading: ‘마음과 눈’ 이미지를 본문에서 그대로 유지했습니다.
  alternative_readings:
  - ‘욕망’을 따라가지 마십시오
  - ‘정욕’을 따르지 마십시오
  rationale: 이 구절은 인간의 내적 의지와 외적 유혹을 함께 겨냥하는 히브리어 관용구를 사용하므로, 이를 풀어쓰면 경고의 구조와 성경적 인류학이 약화됩니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 3, 6
- issue: 히브리어 본문을 우선하고 그리스어 병행전승은 별도로 처리
  chosen_reading: 본문은 히브리어를 따라 번역하고, 그리스어의 ‘누가 나를 압도하겠느냐’ 전승은 본문 밖 변이로 보았습니다.
  alternative_readings:
  - 그리스어 전승을 따라 ‘누가 나를 능히 이기겠느냐’로 옮김
  - 두 전승을 절충하여 이중 진술로 번역
  rationale: 제시된 히브리어는 명령형 금지와 욕망 경고로 일관되며, 그리스어는 내용이 크게 달라 별도 전승으로 보존하는 것이 감사추적에 더 충실합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 5, 6
