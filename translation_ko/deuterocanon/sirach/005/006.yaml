  lexicon: רַחוּם
  rationale: 히브리어 רַחוּם의 핵심 의미는 자비/긍휼이므로, 장황한 설명보다 현대적이고 직접적인 “자비로우시다”를 택했습니다.
- source_word: יִמְחֶה / will wipe away
  english_pob_choice: will wipe away
  chosen_korean: “지워 주실 것입니다”
  alternatives_korean:
  - “없애 주실 것입니다”
  - “지우실 것입니다”
  lexicon: מחה
  rationale: 히브리어 동사는 지우다/말소하다의 의미이므로, 죄과의 기록을 지운다는 이미지가 살아 있는 “지워 주실 것입니다”로 옮겼습니다.
