    reason: source_note
  - marker: b
    text: 히브리어 רַחוּם은 “자비로운, 긍휼이 많은”의 뜻입니다.
    reason: lexical_alternative
  - marker: c
    text: “지워 주실 것입니다”는 히브리어 יִמְחֶה의 말소/삭제 이미지를 살린 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תֹּאמַר / Do not say
  english_pob_choice: Do not say
  chosen_korean: “...라고 말하지 마십시오”
  alternatives_korean:
