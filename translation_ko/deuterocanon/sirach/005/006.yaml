  rationale: 단순한 내적 생각보다 실제 발화를 금하는 직설을 살려, 현대 한국어 금지 명령인 “말하지 마십시오”로 옮겼습니다.
- source_word: רַחוּם יהוה / The LORD is compassionate
  english_pob_choice: The LORD is compassionate
  chosen_korean: “주님은 자비로우시다”
