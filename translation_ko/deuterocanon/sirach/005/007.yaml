  text: Do not rely on forgiveness to add sin to sin[a].
  footnotes:
  - marker: a
    text: 'Greek parallel: ''Do not delay turning to the Lord, and do not put it off from day to day; for suddenly the Lord’s wrath will come forth, and at the time of punishment you will perish.'' The Hebrew surviving here is shorter and focuses specifically on presuming upon forgiveness while continuing in sin.'
    reason: alternative_reading
translation:
  language: ko
  text: 용서를 믿고 의도적으로 죄를 죄에 더하지 마십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 평행본문은 “주께 돌아서기를 미루지 말라, 날마다 미루지 말라… 주의 진노가 갑자기 나아올 것이다”라고 더 길게 말합니다. 현존 히브리어는 더 짧고, 용서를 가볍게 여기며 죄를 계속 더하는 태도에 초점을 둡니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אֶל סְלִיחָה / forgiveness
  english_pob_choice: rely on forgiveness
  chosen_korean: 용서를 믿고
  alternatives_korean:
  - 용서에 의지하고
  - 용서에 기대어
  lexicon: HALOT
  rationale: בטח의 핵심은 ‘의지하다/믿다’이므로, 본문은 용서를 하나의 안전장치처럼 기대는 태도를 경계하는 뜻으로 살려야 합니다.
- source_word: לְהוֹסִיף עָוֹן עַל עָוֹן
  english_pob_choice: to add sin to sin
  chosen_korean: 의도적으로 죄를 죄에 더하지
  alternatives_korean:
  - 죄를 죄에 더하여
  - 죄 위에 죄를 더하지
  lexicon: HALOT
  rationale: 반복 구조는 죄를 누적하는 관용구이므로, 한국어에서도 ‘죄를 죄에 더하다’로 직역에 가깝게 살리되 자연스러운 현대어로 다듬었습니다.
- source_word: עָוֹן
  english_pob_choice: sin
  chosen_korean: 죄
  alternatives_korean:
  - 악
  - 불의
  - 죄책
  lexicon: HALOT
  rationale: 이 문맥에서는 행위로서의 범죄를 가리키므로, 결과로서의 ‘죄책’보다 ‘죄’가 가장 직접적입니다.
theological_decisions:
- issue: 용서를 전제로 죄를 계속하는 태도에 대한 경고
  chosen_reading: 이 절은 용서를 핑계로 회개를 미루거나 죄를 반복하는 태도를 경고합니다.
  alternative_readings:
  - 단순히 용서에 대해 지나치게 자신하지 말라는 일반적 권고
  rationale: 히브리어는 ‘용서를 믿음’과 ‘죄를 더함’을 직접 연결하고 있어, 단순한 심리적 낙관이 아니라 도덕적 방종을 겨냥합니다.
  doctrine_reference: Translation philosophy §1, §3
