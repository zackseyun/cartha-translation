  rationale: 이 구절은 자기중심적 욕망을 경고하지만, 원문은 심리적 자기반성과 함께 인류학적 표현을 사용합니다. 그래서 의미를 평탄화하지 않고 ‘영혼’을 유지해 원문의 긴장을 살렸습니다.
