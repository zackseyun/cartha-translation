  text: Do not rely on your own strength to walk after the desire of your soul[a][b].
  footnotes:
  - marker: a
    text: Or 'Do not follow yourself and your strength, to walk in the desires of your heart,' reflecting the Greek parallel more closely; the Hebrew reads 'Do not rely on your strength, to walk after the desires of your soul.'
