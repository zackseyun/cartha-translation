  - marker: b
    text: '''Your soul'' can also mean ''yourself'' or ''your life'' in Hebrew usage.'
    reason: lexical_alternative
translation:
  language: ko
  text: 자신의 힘에 의지하지 말고, 자기 영혼의 욕망을 따라 걷지 마십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 뉘앙스를 더 가까이 따르면 ‘자신과 자신의 힘을 따르지 말고, 마음의 욕망을 따라 걷지 마십시오’로도 옮길 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘영혼’은 히브리어 נֶפֶשׁ이 가리킬 수 있는 ‘자기 자신’ 또는 ‘생명’의 뜻도 함께 담을 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּשָּׁעֵן
  english_pob_choice: Do not rely
  chosen_korean: 의지하지 말고
  alternatives_korean:
  - 기대지 말고
  - 의존하지 말고
  lexicon: HALOT
  rationale: שׁען의 핵심 비유는 ‘기대다/의지하다’이므로, 현대 한국어에서는 자연스럽고 직접적인 ‘의지하다’가 경고의 의미를 잘 살립니다.
- source_word: כֹּחֶךָ
  english_pob_choice: your own strength
  chosen_korean: 자신의 힘
  alternatives_korean:
  - 자기 힘
  - 당신의 힘
  lexicon: HALOT
  rationale: כֹּחַ는 물리적·능력적 ‘힘’을 뜻하므로 ‘힘’으로 옮기고, 문맥상 자기 의존을 분명히 하기 위해 ‘자신의’로 처리했습니다.
- source_word: לָלֶכֶת אַחַר
  english_pob_choice: to walk after
  chosen_korean: 따라 걷지 마십시오
  alternatives_korean:
  - 뒤따르지 마십시오
  - 따라가며 살지 마십시오
  lexicon: HALOT
  rationale: 히브리어의 ‘걷다’는 삶의 방식과 행위를 가리키므로, 목적어를 살리되 현대어로는 ‘따라 걷다’가 가장 직관적으로 행위의 지속성을 드러냅니다.
- source_word: תַּאֲוַת נַפְשֶׁךָ
  english_pob_choice: the desire of your soul
  chosen_korean: 자기 영혼의 욕망
  alternatives_korean:
  - 자기 영혼의 바람
  - 자기 목숨의 욕망
  - 자기 욕구
  lexicon: HALOT
  rationale: נפשׁ는 ‘영혼/자기/생명’ 범위를 가지지만, 병행구와 인류학적 어감을 보존하기 위해 ‘영혼’을 택했고, תַּאֲוָה는 지나치게 좁히지 않는 ‘욕망’으로 옮겼습니다.
theological_decisions:
