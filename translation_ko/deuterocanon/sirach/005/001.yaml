translation:
  language: ko
  text: 재산을 의지하지 말고, “내 힘이면 충분하다”라고도 말하지 마십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘내 손에 힘이 있다’에 가깝고, 그리스어 병행구는 ‘자족하다/충분하다’는 뜻을 분명히 보여 줍니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תִּשָּׁעֵן / μὴ ἔπεχε
  english_pob_choice: Do not rely
  chosen_korean: 의지하지 말고
  alternatives_korean:
  - 기대지 말고
  - 의존하지 말고
  lexicon: HALOT; LSJ
  rationale: 히브리어 שׁען의 기본 이미지는 ‘기대다’이지만, 문맥상 자신이 가진 것에 신뢰를 두지 말라는 경고이므로 현대 한국어에서는 “의지하다”가 가장 자연스럽고 의미를 잘 드러냅니다.
- source_word: חֵילֶךָ / τοῖς χρήμασίν σου
  english_pob_choice: your wealth
  chosen_korean: 재산을
  alternatives_korean:
  - 부를
  - 재물을
  - 소유를
  lexicon: HALOT; BDAG
  rationale: 히브리어 חֵיל은 힘, 역량, 재산 등으로 넓게 쓰이지만, 그리스어 병행구의 χρήματα가 소유·돈의 의미를 분명히 하므로 “재산”이 가장 무난합니다.
- source_word: יֵשׁ לְאֵל יָדִי / Αὐτάρκη μοί ἐστιν
  english_pob_choice: I have the power
  chosen_korean: “내 힘이면 충분하다”
  alternatives_korean:
  - “내 손에 힘이 있다”
  - “내가 충분히 할 수 있다”
  - “내 힘이 있다”
  lexicon: HALOT; LSJ
  rationale: 히브리어는 문자적으로 ‘내 손에 힘이 있다’는 식의 압축된 표현이고, 그리스어는 자족/충분함의 뜻을 보강합니다. 한국어에서는 손-힘의 직역보다 자족적 자기확신을 살린 표현이 문맥과 더 잘 맞습니다.
theological_decisions:
- issue: 두 번째 금지문의 의미 범위
  chosen_reading: 이 구절은 소유와 능력을 근거로 한 자기충족적 확신을 경계합니다.
  alternative_readings:
  - 단순히 물질을 과신하지 말라는 뜻
  - 자기 손의 능력을 직접 자랑하지 말라는 뜻
  rationale: 히브리어와 그리스어가 함께 볼 때 경고의 초점은 ‘재산’ 자체보다 그것을 바탕으로 한 자기충분성에 있습니다. 그래서 한국어도 재산과 힘을 함께 드러내되, 자기충족의 뉘앙스를 살렸습니다.
  doctrine_reference: 'PHILOSOPHY.md: 히브리어 본문을 우선하되 그리스어 병행구로 의미를 보강'
