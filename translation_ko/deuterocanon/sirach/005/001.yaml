  text: Do not rely on your wealth[a], and do not say, “I have the power.”
  footnotes:
  - marker: a
    text: Hebrew literally, 'there is to the power of my hand'; the Greek parallel reflects the sense 'I am self-sufficient' or 'it is enough for me.'
