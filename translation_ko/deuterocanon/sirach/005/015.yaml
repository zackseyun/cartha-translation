  text: Be quick to listen[c][b][a], and with patience give a reply.
  footnotes:
  - marker: a
    text: Hebrew 'with length of spirit,' an idiom for patience or restrained temper.
    reason: lexical_alternative
  - marker: b
    text: Or 'with patience return a word' / 'reply with a saying.' The Hebrew phrase is concise, and 'answer' brings out the likely sense in context.
    reason: alternative_reading
  - marker: c
    text: The Greek parallel for this verse differs substantially from the extant Hebrew and appears to reflect a different textual form; the translation here follows the surviving Hebrew witness as the primary source.
    reason: textual_variant
translation:
  language: ko
  text: 듣기를 서두르고, 오래 참으며 대답하십시오.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘긴 영으로’라는 말은 인내나 절제된 성품을 뜻하는 관용구입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 표현은 간결하여, 문맥상 ‘대답하다’ 또는 ‘한 마디를 돌려주다’ 정도로도 옮길 수 있습니다.
    reason: alternative_reading
  - marker: c
    text: 이 절의 그리스어 병행 본문은 현존 히브리어와 상당히 다르므로, 번역은 남아 있는 히브리어 증언을 주 본문으로 따랐습니다.
    reason: textual_variant
lexical_decisions:
- source_word: הֱיֶה מְמַהֵר
  english_pob_choice: Be quick
  chosen_korean: 서두르고
  alternatives_korean:
