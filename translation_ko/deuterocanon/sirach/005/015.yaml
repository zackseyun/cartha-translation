  lexicon: HALOT
  rationale: 단순 청취보다 적극적이고 응답적인 ‘귀 기울여 듣는’ 뜻이지만, 문장 전체의 간결성을 위해 기본형 ‘듣기’를 사용했습니다.
- source_word: וּבְאֶרֶךְ רוּחַ
  english_pob_choice: with patience
  chosen_korean: 오래 참으며
  alternatives_korean:
  - 인내하며
  - 참을성을 가지고
  - 길이 참으며
  lexicon: HALOT
  rationale: 직역하면 ‘긴 영’이지만 관용구가 가리키는 윤리적 의미는 인내이므로, 한국어의 자연스러운 숙어 ‘오래 참으며’로 옮겼습니다.
- source_word: פִּתְגָּם
  english_pob_choice: an answer
  chosen_korean: 대답하십시오
  alternatives_korean:
  - 답변하십시오
  - 응답하십시오
  - 한 마디를 돌려주십시오
  lexicon: HALOT
  rationale: 문맥상 듣고 난 뒤에 돌려주는 말을 가리키므로, ‘답’보다 구체적인 대화 행위인 ‘대답’으로 옮겨 응답의 의미를 살렸습니다.
