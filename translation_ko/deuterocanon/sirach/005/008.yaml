  text: And you said, “His mercies are many; for the multitude of my iniquities he will forgive.”
  footnotes:
  - marker: a
    text: 'Greek parallel: “Do not rely on unrighteous riches, for they will profit you nothing in the day of visitation.” The surviving Hebrew witness here instead gives a warning against presuming on God’s mercy.'
    reason: textual_variant
translation:
  language: ko
  text: 그리고 당신은 말합니다. “그분의 긍휼은 많습니다. 나의 죄악이 많으니, 그분은 용서하실 것입니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '그리스어 병행문: “불의한 재물에 의지하지 말라. 그것은 환난/돌봄의 날에 아무런 유익이 되지 않는다.” 현존 히브리어는 하나님의 긍휼을 함부로 기대하는 경고를 전합니다.'
    reason: textual_variant
lexical_decisions:
- source_word: וְאָמַרְתָּ
  english_pob_choice: And you said
  chosen_korean: 그리고 당신은 말합니다
  alternatives_korean:
  - 그리고 당신은 말했습니다
  - 그리고 당신은 말할 것입니다
  lexicon: HALOT
  rationale: 히브리어 완료형이 권면 속에서 인용되는 경우를 고려해, 한국어에서는 현재형으로 생생한 직접 화법을 살리면서도 단정적 선언의 뉘앙스를 유지했습니다.
- source_word: רַחֲמָיו
  english_pob_choice: His mercies
  chosen_korean: 그분의 긍휼은
  alternatives_korean:
  - 그분의 자비는
  - 그분의 긍휼들이
  lexicon: HALOT
  rationale: 복수형의 풍성함은 살리되, 한국어에서는 자연스러운 단수 보통명사로 옮기고 문맥상 '은'으로 대비를 세웠습니다.
- source_word: עֲוֹנוֹתַי
  english_pob_choice: my iniquities
  chosen_korean: 나의 죄악이
  alternatives_korean:
  - 나의 죄들이
  - 나의 불의가
  lexicon: HALOT
  rationale: 일반적인 '죄'보다 도덕적 무게가 강한 표현이어서, 복수성과 강도를 살릴 수 있는 '죄악'을 선택했습니다.
- source_word: יִסְלָח
  english_pob_choice: he will forgive
  chosen_korean: 그분은 용서하실 것입니다
  alternatives_korean:
  - 그분은 용서하십니다
  - 그분은 용서하실 수 있습니다
  lexicon: HALOT
  rationale: 미래적 확신과 화자의 자기합리화를 함께 드러내기 위해 미래형으로 옮겼습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행문의 관계
  chosen_reading: 히브리어 본문을 본문으로 번역하고, 그리스어의 다른 경구는 각주로 분리합니다.
  alternative_readings:
  - 그리스어에 따라 ‘불의한 재물에 의지하지 말라’로 옮김
  rationale: 이 절의 히브리어와 그리스어는 내용 자체가 상당히 달라, 본문에서는 현존 히브리어의 경구를 따르고 변이 사항은 각주로 투명하게 남기는 것이 적절합니다.
  doctrine_reference: 'POB 원칙: 현존 히브리어 우선, 중대한 병행 전승은 변이 주로 보존'
- issue: 화자의 태도
  chosen_reading: 이 구절은 하나님의 넓은 긍휼을 핑계로 죄를 가볍게 여기는 자기기만적 발화를 드러냅니다.
  alternative_readings:
  - 단순한 회개의 표현
  rationale: 문맥상 칭찬이 아니라 경고의 대상이 되는 발화이므로, 한국어에서도 그 자기합리화의 뉘앙스가 드러나도록 했습니다.
  doctrine_reference: 지혜문학의 경계 경구
