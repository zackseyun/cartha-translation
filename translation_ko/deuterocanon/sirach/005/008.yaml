  source_fidelity: 본문은 현존 히브리어를 충실히 따릅니다. רַחֲמָיו רַבִּים은 ‘그분의 긍휼은 많습니다’로, לְרֹב עֲוֹנוֹתַי יִסְלָח은 죄악의 많음을 근거로 용서를 당연시하는 발화로 적절히 옮겼습니다. וְאָמַרְתָּ의 완료형은 이 권면 문맥에서 현재적 인용으로도 가능한 해석이므로 ‘말합니다’는 유지할 수 있습니다. 다만 각주의 그리스어 ἐν ἡμέρᾳ ἐπαγωγῆς를 ‘환난/돌봄의 날’로 번역한 것은 ‘돌봄’이 문맥과 어휘 의미에 맞지 않아 수정이 필요합니다.
