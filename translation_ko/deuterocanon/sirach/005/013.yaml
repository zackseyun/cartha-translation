base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/005/013.yaml
  text: Do not be a winnower to every wind[b][a], or walk on the path of the storm.
  footnotes:
  - marker: a
    text: Hebrew שִׁבֹּלֶת is uncertain here. It may mean 'storm' or 'torrent'; elsewhere it can also mean an 'ear of grain.' The translation follows the sense that best matches the parallel image of 'every wind.'
    reason: lexical_alternative
  - marker: b
    text: 'The Greek parallel text reads quite differently: ''Honor and dishonor are in speech, and a man''s tongue is his downfall.'' The main translation follows the extant Hebrew witness, which is the primary source for this verse where available.'
    reason: alternative_reading
translation:
  language: ko
  text: 바람마다 흔드는 키질하는 사람이 되지 말고, 폭풍의 길로 걸어가지 마십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 שִׁבֹּלֶת는 여기서 뜻이 분명하지 않으며, ‘폭풍’ 또는 ‘급류’로 볼 수 있습니다. 본 번역은 앞부분의 ‘바람마다’와 나란히 놓인 이미지를 고려해 ‘폭풍’을 따랐습니다.
    reason: lexical_alternative
  - marker: b
    text: '그리스어 병행본문은 매우 다르게 읽습니다: ‘말 속에 영광과 수치가 있으며, 사람의 혀는 그에게 넘어짐이다.’ 본문은 가용한 히브리어 증거를 따릅니다.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תִּהְיֶה
  english_pob_choice: Do not be
  chosen_korean: ~가 되지 마십시오
  alternatives_korean:
  - ~하지 마십시오
  - ~가 되지 말라
  lexicon: HALOT
  rationale: 히브리어 היה의 금지형을 한국어에서는 상태 전환을 나타내는 ‘~가 되다’로 살려, 단순 행위 금지보다 ‘그런 사람이 되지 말라’는 권면을 자연스럽게 전달했습니다.
- source_word: זוֹרֶה
  english_pob_choice: a winnower
  chosen_korean: 키질하는 사람
  alternatives_korean:
  - 키질꾼
  - 바람에 흩뿌리는 사람
  lexicon: HALOT
  rationale: 농업적 비유인 ‘winnower’를 직접 살리되, 한국어 성경문체에서 덜 낯선 ‘키질하는 사람’으로 옮겨 이미지의 구체성을 유지했습니다.
- source_word: לְכָל רוּחַ
  english_pob_choice: to every wind
  chosen_korean: 바람마다
  alternatives_korean:
  - 모든 바람마다
  - 모든 바람에
  lexicon: HALOT
  rationale: ‘모든 바람’보다 압축적인 ‘바람마다’가 히브리어의 산만함과 흔들림의 이미지를 더 간결하게 드러냅니다.
- source_word: וּפוֹנֶה דֶרֶך שִׁבֹּלֶת
  english_pob_choice: or walk on the path of the storm
  chosen_korean: 폭풍의 길로 걸어가지 마십시오
  alternatives_korean:
  - 폭풍의 길을 따라가지 마십시오
  - 폭풍의 길로 돌지 마십시오
  lexicon: HALOT
  rationale: POB의 ‘walk on the path of the storm’를 반영해 ‘길로 걸어가다’로 옮겼고, שִׁבֹּלֶת의 난해함은 한국어 본문에서는 자연스러운 ‘폭풍’으로 처리하되 주석으로 불확실성을 남겼습니다.
