base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/005/005.yaml
  text: Do not say[a], “I have sinned[b], and what has been done to me? Nothing,” for God is patient.
  footnotes:
  - marker: a
    text: Or, more literally, “for God is slow to anger.”
    reason: lexical_alternative
  - marker: b
    text: 'The Greek parallel reads differently: “Do not be without fear concerning atonement, to add sin upon sins.” The Hebrew witness here warns against saying that sin brings no consequence because God is patient; both forms caution against presuming on divine mercy.'
    reason: alternative_reading
translation:
  language: ko
  text: “내가 죄를 지었는데,[b] 내게 무슨 일이 일어나겠는가? 아무 일도 없을 것이다”라고 말하지 마십시오. 하나님께서 오래 참으시기[a] 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “노하기를 더디 하신다”입니다.
    reason: lexical_alternative
  - marker: b
    text: '그리스어 병행 본문은 다르게 읽습니다: “속죄에 관하여 안심하지 말라. 죄에 죄를 더하지 말라.” 히브리어 본문은 하나님의 오래 참으심을 빌미로 죄의 결과가 없다고 여기는 태도를 경고하며, 그리스어 본문도 죄를 거듭 짓는 일을 경고합니다.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תֹּאמַר
  english_pob_choice: Do not say
  chosen_korean: 말하지 마십시오
  alternatives_korean:
  - 말하지 마라
  - 스스로에게 말하지 마십시오
  lexicon: HALOT
  rationale: 직접적인 금지 명령을 표준어 합쇼체로 옮겼습니다. 문맥상 자기합리화의 내적 독백일 수 있으나, 히브리어의 기본 형식은 단순한 금지입니다.
- source_word: חָטָאתִי
  english_pob_choice: I have sinned
  chosen_korean: 내가 죄를 지었다
  alternatives_korean:
  - 내가 죄를 범했다
  - 내가 죄를 지었습니다
  lexicon: HALOT
  rationale: 완료된 죄의 행위를 자연스러운 현대 한국어로 표현했습니다. ‘죄를 지었다’는 본문의 도덕적·법적 책임감을 잘 드러냅니다.
- source_word: וְמַה יֵעָשֶׂה לִי / וְמַה יֵעָשֶׂה לִי
  english_pob_choice: and what has happened to me?
  chosen_korean: 내게 무슨 일이 일어났느냐?
  alternatives_korean:
  - 내게 무슨 일이 행해졌느냐?
  - 내게 무슨 일이 일어날 것이냐?
  lexicon: HALOT
  rationale: 히브리어의 수동형 질문을 한국어에서 자연스럽게 풀어, ‘결과가 실제로 없었다’는 자기변명적 뉘앙스를 살렸습니다. 영어 POB가 채택한 회고적 의미를 따랐습니다.
- source_word: מְאוּמָה
  english_pob_choice: Nothing
  chosen_korean: 아무것도 아니다
  alternatives_korean:
  - 아무 일도 아니다
  - 한 가지도 아니다
  lexicon: HALOT
  rationale: 질문에 대한 답으로 기능하는 무(無)반응을 한국어 관용으로 분명하게 표현했습니다. 단독 ‘아무것도’보다 서술적으로 마무리하는 편이 문맥에 맞습니다.
- source_word: אֶרֶךְ אַפַּיִם
  english_pob_choice: God is patient
  chosen_korean: 하나님이 오래 참으시는 분이시기 때문입니다
  alternatives_korean:
  - 하나님이 오래 참으시기 때문입니다
  - 하나님이 노하기를 더디 하시기 때문입니다
  lexicon: HALOT
  rationale: 직역인 ‘노하기를 더디 하다’의 관용을 보존하되, 현대 독자에게는 ‘오래 참으시는 분’이 더 자연스럽고 오해가 적습니다. 하나님을 설명하는 서술로 정리해 문장 흐름을 살렸습니다.
theological_decisions:
- issue: 하나님의 성품을 ‘patient’로 옮길지 ‘slow to anger’로 옮길지
  chosen_reading: 본문은 하나님의 오래 참으심을 강조하는 경고로 읽고, 한국어 본문은 ‘오래 참으시는 분’으로 옮겼습니다.
  alternative_readings:
  - 노하기를 더디 하시는 분
  - 참으시는 하나님
  rationale: 이 절은 하나님의 자비를 면허로 삼아 죄를 가볍게 여기는 태도를 경고합니다. 번역은 본문의 경고성을 유지하되, 전통적 직역 관용은 주석 여지를 남깁니다.
  doctrine_reference: 'DOCTRINE.md: 현대적 가독성 유지, 그러나 신적 속성의 긴장(긍휼과 심판)을 약화하지 말 것'
