base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/005/010.yaml
  text: Do not delay to return to him[b][a], and do not put it off from day to day.
  footnotes:
  - marker: a
    text: Or 'do not postpone it from one day to the next.' The second clause uses a difficult Hebrew verb, but the context clearly points to repeated delay.
    reason: lexical_alternative
  - marker: b
    text: '''Returning to him'' likely refers to turning back to God in repentance, though the Hebrew says simply ''to him.'''
    reason: alternative_reading
translation:
  language: ko
  text: 그에게[b] 돌아가기를 지체하지 마십시오. 또 하루하루 미루지 마십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하루에서 다음 날로 미루지 마십시오.’ 둘째 절은 어려운 히브리어 동사를 포함하지만, 문맥은 분명 반복적인 지연을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그에게 돌아가다’는 문맥상 하나님께로 돌이키는 뜻일 가능성이 크지만, 히브리어는 단지 ‘그에게’라고만 말합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תְּאַחֵר
  english_pob_choice: Do not delay
  chosen_korean: 지체하지 마십시오
  alternatives_korean:
  - 늦추지 마십시오
  - 미루지 마십시오
  lexicon: HALOT
  rationale: תְּאַחֵר는 ‘지연하다, 늦추다’의 금지형으로 이해되어, 현대 한국어에서 자연스럽고 경구적인 ‘지체하지 마십시오’로 옮겼습니다.
- source_word: לָשׁוּב אֵלָיו
  english_pob_choice: to return to him
  chosen_korean: 그에게로 돌아오는 일
  alternatives_korean:
  - 그에게 돌아가는 것
  - 그에게로 돌아서기
  lexicon: HALOT
  rationale: 히브리어는 단순히 ‘그에게’라고만 하므로, 본문의 절제된 표현을 살려 대상을 드러내되 ‘하나님’으로 명시하지 않고 ‘그에게로’로 옮겼습니다.
- source_word: תִּתְעַבֵּר
  english_pob_choice: put it off
  chosen_korean: 미루지 마십시오
  alternatives_korean:
  - 연기하지 마십시오
  - 보류하지 마십시오
  - 늦추지 마십시오
  lexicon: HALOT
  rationale: 어려운 동사이지만 ‘하루에서 하루로’와의 병행이 반복적 유예를 분명히 가리키므로, 그 의미를 가장 자연스럽게 드러내는 ‘미루다’를 선택했습니다.
- source_word: מִיּוֹם אֶל יוֹם
  english_pob_choice: from day to day
  chosen_korean: 하루에서 하루로
  alternatives_korean:
  - 날마다
  - 하루하루
  - 하루에서 다음 날로
  lexicon: HALOT
  rationale: 히브리어 관용구의 반복적 연기를 직역에 가깝게 살려, ‘하루에서 하루로’로 표현했습니다.
theological_decisions:
- issue: ‘그에게’의 대상이 누구인지 명시할지 여부
  chosen_reading: 본문의 절제된 표현을 따라 대상은 숨기고 ‘그에게로’만 제시했습니다.
  alternative_readings:
  - 하나님께로
  - 주님께로
  rationale: 본문 자체는 대명사만 사용하므로, 회개 대상이 하나님이라는 문맥적 가능성은 인정하되 번역문에서 신학적 명시를 앞세우지 않았습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
