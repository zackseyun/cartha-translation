- from: 그에게로 돌아오는 일을 지체하지 마십시오.[a][b] 또 하루에서 하루로 미루지 마십시오.
  to: 그에게[b] 돌아가기를 지체하지 마십시오. 또 하루하루 미루지 마십시오.[a]
  rationale: Directly rendering the Hebrew infinitive with ‘돌아가기를’ improves Korean idiom and source correspondence. Replacing the calqued temporal phrase with ‘하루하루’ communicates the contextual sense of repeated postponement. The implicit referent remains unexpanded, and the footnote wording and anchors are aligned with the revised Korean text.
