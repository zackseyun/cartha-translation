translation:
  language: ko
  text: “그의 힘을 누가 당해 내겠느냐?”라고[a] 말하지 마십시오. 야훼께서는 박해받는 이들을 찾으십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 “내가 죄를 지었는데, 내게 무슨 일이 있었느냐?”라고 말하지 마십시오. 주님께서는 오래 참으십니다.”라고 읽습니다. 이는 현존 히브리어와 다른 바탕 본문을 반영할 가능성이 큽니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תֹּאמַר
  english_pob_choice: Do not say
  chosen_korean: 말하지 마십시오
  alternatives_korean:
  - 말하지 마세요
  - 입밖에 내지 마십시오
  lexicon: HALOT
  rationale: אמר의 기본 금지 명령을 자연스러운 현대 한국어 금지 표현으로 옮겼습니다. 합쇼체를 유지해 문장의 권고성과 권위를 살렸습니다.
- source_word: מִי יוּכַל כֹּחוֹ
  english_pob_choice: Who can prevail against his power?
  chosen_korean: 그의 힘을 누가 당해 내겠느냐
  alternatives_korean:
  - 그의 힘을 누가 이기겠느냐
  - 그의 힘을 누가 견디겠느냐
  lexicon: HALOT
  rationale: יוכל의 도전적 뉘앙스를 ‘당해 내다’로 살려, 단순한 존재 가능성보다 ‘대적하여 이겨 내는’ 의미를 드러냈습니다. כוח은 문맥상 ‘힘’이 가장 직접적입니다.
- source_word: יְהֹוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 프로젝트 기본값에 따라 신명기적 고유명사는 학술적 음역인 ‘야훼’로 옮겼습니다. 본문이 하나님의 이름을 직접 말하므로 ‘주님’으로 완화하지 않았습니다.
- source_word: מְבַקֵּשׁ נִרְדָּפִים
  english_pob_choice: seeks the persecuted
  chosen_korean: 박해받는 이들을 찾으십니다
  alternatives_korean:
  - 박해받는 이들을 찾으십니다
  - 쫓기는 이들을 찾으십니다
  - 박해받는 자들을 찾으십니다
  lexicon: HALOT
  rationale: בקש는 단순한 탐색보다 능동적 관심을 담아 ‘찾으십니다’로 옮겼고, נרדפים는 도덕적·사회적 가해를 받은 상태를 드러내는 ‘박해받는 이들’로 옮겼습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행본문의 차이
  chosen_reading: 본문은 현존 히브리어를 따르고, 그리스어의 다른 읽기는 각주 없이 본문 밖 정보로 보존합니다.
  alternative_readings:
  - “내가 죄를 지었는데 무슨 일이 있었느냐?”라고 말하지 마십시오. 주님께서는 오래 참으십니다.
  rationale: 시락서에서는 현존 히브리어를 우선하되, 그리스어가 현저히 다른 전승을 보인다는 점은 번역판의 주해 자료로 남기는 것이 적절합니다. 본문이 너무 길어지지 않도록 여기서는 히브리어 의미를 우선했습니다.
  doctrine_reference: 'PHILOSOPHY.md: surviving Hebrew takes precedence; alternate witness may be noted when materially divergent.'
