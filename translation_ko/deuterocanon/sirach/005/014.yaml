translation:
  language: ko
  text: 분별을 굳게 지니십시오[a]. 말을 한결같이 하십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 병행 본문은 다르게 읽습니다. “수군거리는 자라 불리지 말고, 네 혀로 숨어서 해치려 하지 말라. 도둑에게는 수치가 있고, 두 혀를 가진 자에게는 악한 정죄가 있다.” 이는 이 절의 ‘말을 한결같이 하십시오’가 이중적이거나 일관되지 않은 말을 경계하는 뜻일 수 있음을 보여 줍니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הֱיֶה סָמוּךְ
  english_pob_choice: Be firm
  chosen_korean: 견고하십시오
  alternatives_korean:
  - 굳게 서십시오
  - 견고하게 되십시오
  - 확고하십시오
  lexicon: HALOT
  rationale: היה의 명령형에 סמוך의 ‘지탱된, 흔들리지 않는’ 뉘앙스를 살려, 분별이 안정되고 흔들리지 않는 상태를 자연스럽게 표현했습니다.
- source_word: עַל דַּעְתֶּךָ
  english_pob_choice: in your understanding
  chosen_korean: 당신의 분별에
  alternatives_korean:
  - 당신의 이해에
  - 당신의 지혜에
  - 당신의 판단에
  lexicon: HALOT
  rationale: דעת는 단순 지식보다 숙고된 이해와 분별을 가리킬 수 있으므로, 지혜 문맥에 맞게 ‘분별’로 옮겼습니다.
- source_word: וְאֶחָד יְהִי דְבָרֶךָ
  english_pob_choice: let your word be one
  chosen_korean: 당신의 말은 하나가 되게 하십시오
  alternatives_korean:
  - 당신의 말은 한결같게 하십시오
  - 당신의 말이 하나이게 하십시오
  - 당신의 말은 일관되게 하십시오
  lexicon: HALOT
  rationale: ‘one’을 직역하되, 한국어에서는 말의 단일성·일관성을 드러내는 표현이 더 자연스러워 ‘하나가 되게 하십시오’로 옮겼습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행문의 관계
  chosen_reading: 히브리어 본문을 본문으로 두고, ‘말이 하나가 되라’는 표현 안에 이중적·이중언어적 말을 경계하는 의미를 간접적으로 살렸습니다.
  alternative_readings:
  - 그리스어 병행을 따라 ‘수군거리는 자라 불리지 말라’로 옮김
  - 그리스어의 ‘이중 혀’ 경고를 본문에 직접 반영함
  rationale: 시락서에서는 남아 있는 히브리어를 우선해야 하며, 그리스어는 병행 증거로서 의미를 보완합니다. 히브리어의 ‘한 말’은 그리스어의 이중성 경고와 실질적으로 맞닿아 있어 본문과 주석을 분리하는 편이 가장 투명합니다.
  doctrine_reference: 'PHILOSOPHY.md: 히브리어가 남아 있는 시락서는 히브리어 본문 우선, 그리스어 병행은 주석적 보강'
