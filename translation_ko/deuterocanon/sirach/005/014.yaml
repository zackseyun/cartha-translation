  source_fidelity: 히브리어 본문은 ‘네 이해/분별에 굳게 서라’와 ‘네 말이 하나가 되게 하라’라는 두 명령을 담고 있습니다. 초안의 기본 의미는 이를 따르지만, ‘분별에 견고하십시오’는 한국어에서 부자연스럽고, 둘째 절은 ‘하나’의 관용적 의미인 한결같고 이중적이지 않은 말을 더 자연스럽게 드러낼 필요가 있습니다. 그리스어는 실질적으로 다른 병행 본문이므로 각주에서 별도의 읽기로 제시하는 것이 적절합니다.
  naturalness: ‘당신의 분별에 견고하십시오’는 조사 결합과 ‘견고하다’의 용법이 어색합니다. ‘분별을 굳게 지니십시오’가 현대 표준어 합쇼체로 자연스럽습니다. ‘말은 하나가 되게 하십시오’도 문법상 가능하지만 다소 직역투이므로 ‘말을 한결같이 하십시오’가 자연스럽습니다.
  terminology: דעת에 대한 ‘분별’은 지혜문학 문맥에서 적절합니다. 다만 반복되는 ‘당신의’는 한국어 성서 문체에 불필요하므로 생략했습니다. 그리스어의 δίγλωσσος는 ‘이중 혀’보다 ‘두 혀를 가진 자’가 한국어에서 더 명료하며, 이는 비유적으로 이중적인 말을 하는 사람을 가리킵니다.
