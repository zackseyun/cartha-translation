  text: For suddenly his wrath will come forth[a], and at the time of vengeance you will be swept away.
  footnotes:
  - marker: a
    text: 'The Greek parallel for this verse reads quite differently: ''Be swift in your hearing, and with patience speak an answer.'' The English main text follows the extant Hebrew witness here, where the wording diverges substantially from the Greek tradition.'
