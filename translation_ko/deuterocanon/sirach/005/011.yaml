translation:
  language: ko
  text: 그의 분노가 갑자기 터져 나오고, 보복의 때에 너희는 휩쓸려 갈 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '그리스어 병행본문은 이 구절을 매우 다르게 읽습니다: ‘너는 듣는 일에 빠르고, 인내로 대답을 말하라.’ 본문 본문은 여기에서 현존하는 히브리어 증언을 따릅니다.'
    reason: textual_variant
lexical_decisions:
- source_word: פִתְאֹם
  english_pob_choice: suddenly
  chosen_korean: 갑자기
  alternatives_korean:
  - 문득
  - 뜻밖에
  lexicon: HALOT
  rationale: פתאם의 기본 부사적 의미를 자연스러운 현대 한국어로 옮겼습니다.
- source_word: יֵצֵא זַעְמוֹ
  english_pob_choice: his wrath will come forth
  chosen_korean: 그의 분노가 … 터져 나오고
  alternatives_korean:
  - 그의 분노가 … 나올 것이고
  - 그의 진노가 … 일어날 것이고
  lexicon: HALOT
  rationale: יצא의 ‘나오다/나가다’ 이미지를 살리되, 분노가 밖으로 분출되는 긴박함을 한국어로는 ‘터져 나오다’가 가장 가깝게 전달합니다.
- source_word: נָקָם
  english_pob_choice: vengeance
  chosen_korean: 보복
  alternatives_korean:
  - 복수
  - 응보
  lexicon: HALOT
  rationale: 문맥상 심판적 보복의 성격이 강하므로, 지나치게 개인적 정서가 강한 ‘복수’보다 ‘보복’이 더 직접적입니다.
- source_word: תִּסָּפֶה
  english_pob_choice: you will be swept away
  chosen_korean: 휩쓸려 갈 것입니다
  alternatives_korean:
  - 쓸려 갈 것입니다
  - 사라질 것입니다
  - 멸망할 것입니다
  lexicon: HALOT
  rationale: ספה의 수동적 ‘휩쓸려 가다/사라지다’ 감각을 보존하여, 파멸의 방식보다 결과의 강도를 드러냈습니다.
theological_decisions:
- issue: ‘그의 분노’의 지시 대상
  chosen_reading: 직접적으로는 소유대명사만 유지하고, 본문이 암시하는 주체를 한국어 본문 안에서 명시하지 않았습니다.
  alternative_readings:
  - 하나님의 분노
  - 주님의 분노
  rationale: 히브리어는 인칭대명사만 두고 있어, 해석상 하나님을 가리키는 맥락이 강하더라도 본문 자체보다 더 좁혀 쓰지 않았습니다.
  doctrine_reference: 본문이 허용하는 범위를 넘어서지 않기
- issue: ‘보복’의 종말론적/심판적 어조
  chosen_reading: 윤리적 경고로서의 재앙적 심판 어조를 살렸습니다.
  alternative_readings:
  - 형벌의 때
  - 심판의 때
  rationale: נָקָם은 단순 징벌보다 응보적 심판의 뉘앙스를 가지므로, 문맥의 경고성을 유지하는 표현을 택했습니다.
  doctrine_reference: 지혜문학의 경고적 심판 언어 유지
