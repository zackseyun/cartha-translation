  source_fidelity: 히브리어 본문은 ‘그의 진노’(זַעְמוֹ)가 ‘갑자기’(פִתְאֹם) 나올 것이며, ‘보복/응징의 때’(וּבְעֵת נָקָם)에 2인칭 단수로 된 대상이 휩쓸려 갈 것이라고 경고합니다. 초안의 ‘너희는’은 히브리어의 단수 תִּסָּפֶה와 일치하지 않습니다. ‘터져 나오다’는 יצא의 ‘나오다’ 이미지를 다소 강하게 구체화하지만, 진노의 급작스러운 발현이라는 문맥 안에서 안전합니다.
  naturalness: 합쇼체 문장으로 자연스럽습니다. 다만 단수 청자를 ‘너는’으로 바로잡고, 접속 표현을 ‘터져 나오며’로 다듬으면 원문의 병렬 구조도 자연스럽게 유지됩니다.
