base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/005/009.yaml
  text: For mercy and anger are with him[a], and his wrath comes to rest on the wicked.
  footnotes:
  - marker: a
    text: 'Greek tradition reads instead: ''Do not winnow with every wind, and do not walk in every path; so is the double-tongued sinner.'' This differs substantially from the extant Hebrew and likely reflects a different textual form of the verse.'
    reason: textual_variant
translation:
  language: ko
  text: 그분께는 자비와 분노가 있으며, 그의 격노가 악인 위에 머뭅니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 전승은 “모든 바람에 키질하지 말며, 모든 길로 다니지 말라. 입이 두 개인 죄인은 그와 같다”로 읽습니다. 이는 현존 히브리어와 상당히 다르며, 다른 본문 형태를 반영한 것으로 보입니다.
    reason: textual_variant
lexical_decisions:
- source_word: רַחֲמִים
  english_pob_choice: mercy
  chosen_korean: 자비
  alternatives_korean:
  - 긍휼
  - 인자하심
  lexicon: HALOT
  rationale: 자비는 הרחמים의 포괄적 자비/긍휼 의미를 자연스럽게 담으면서, 이어지는 '분노'와 대구를 이루는 한국어로 읽기 쉽습니다.
- source_word: אַף
  english_pob_choice: anger
  chosen_korean: 분노
  alternatives_korean:
  - 노
  - 진노
  lexicon: HALOT
  rationale: 직역하면 '코/콧김'이지만 여기서는 관용적으로 '분노'가 맞습니다. 뒤의 רָגְזוֹ를 '격노'로 두어 첫 행과 구분했습니다.
- source_word: רָגְזוֹ
  english_pob_choice: his wrath
  chosen_korean: 그의 격노
  alternatives_korean:
  - 그의 진노
  - 그의 분노
  lexicon: HALOT
  rationale: 이 단어는 격렬한 분노/동요를 가리키므로, אַף보다 강한 뉘앙스를 살리기 위해 '격노'를 택했습니다.
- source_word: וְאֵל רְשָׁעִים
  english_pob_choice: on the wicked
  chosen_korean: 악인 위에
  alternatives_korean:
  - 악인에게
  - 악인에게로
  lexicon: HALOT
  rationale: '''위에''는 심판과 임함의 이미지를 살리면서, 원문의 대상 표지를 자연스럽게 전달합니다.'
theological_decisions:
- issue: 지시대상 없는 대명사 접미사(그분께, 그의)의 해석
  chosen_reading: 문맥상 하나님을 가리키는 것으로 번역했습니다.
  alternative_readings:
  - 중립적으로 '그에게'로 둘 수 있음
  - 명시적으로 '하나님께는'으로 풀 수 있음
  rationale: 원문에는 하나님의 이름이 없지만, 전후 문맥상 자비와 분노가 하나님께 속한다는 뜻이 분명하므로, 한국어에서는 이해를 돕되 과도하게 보태지 않도록 했습니다.
  doctrine_reference: 'DOCTRINE.md: 문맥이 충분할 때만 지시대상을 명확히 하고, 해석을 과도하게 확장하지 않습니다.'
- issue: 히브리 본문 우선과 그리스어 병행 전승의 처리
  chosen_reading: 본문은 현존 히브리어를 따르고, 그리스어의 상당히 다른 전승은 각주로 보존합니다.
  alternative_readings:
  - 그리스어 본문을 본문으로 채택
  - 각주 없이 히브리어만 제시
  rationale: 시락서의 이 절은 그리스어가 전혀 다른 형태이므로, 본문 이해에 중요한 전승 차이를 숨기지 않고 각주로 남기는 것이 적절합니다.
  doctrine_reference: 'PHILOSOPHY.md: 히브리어가 남아 있으면 이를 우선하되, משמעות 있는 대체 전승은 보존합니다.'
