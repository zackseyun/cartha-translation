  source_fidelity: 히브리어 알 תבטח על נכסי שקר, כי לא יועילו ביום עברה를 충실히 반영합니다. 다만 초안의 ‘속이는 재산’은 재산 자체가 능동적으로 속인다는 인상을 주어 נִכְסֵי שקר의 ‘거짓/기만에 속한 재물’이라는 폭넓은 의미를 자연스럽게 전달하지 못합니다. ‘분노의 날’은 עֶבְרָה의 명시되지 않은 주체를 보존하는 적절한 번역입니다.
  naturalness: ‘거짓된 재물’이 현대 한국어에서 더 자연스럽고, ‘아무런 도움이 되지 않습니다’가 ‘유익하지 못합니다’보다 לֹא יוֹעִילוּ의 결과적 무익함을 자연스럽게 표현합니다. 그리스어 이문 주석의 ‘네 손이 네 입에 있으라’도 한국어 관용상 다듬을 필요가 있습니다.
  terminology: ‘재물’은 נִכְסֵי의 집합적 자산·부의 뜻에 적합합니다. ‘분노’는 본문에 하나님을 명시하지 않으면서 עֶבְרָה의 강한 의미를 유지합니다. 그리스어 병행 본문은 본문과 현저히 다르므로 주석으로 명시하는 것이 적절합니다.
