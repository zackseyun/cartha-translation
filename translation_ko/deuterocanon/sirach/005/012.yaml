base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/005/012.yaml
  text: Do not trust in deceitful wealth[b][a], for it will not profit in the day of wrath.
  footnotes:
  - marker: a
    text: 'The Greek parallel tradition for this verse reads instead: ''If you have understanding, answer your neighbor; but if not, let your hand be upon your mouth.'' The Hebrew witness here is substantially different, and this translation follows the extant Hebrew as primary.'
    reason: textual_variant
  - marker: b
    text: Or 'false wealth,' 'fraudulent riches,' or 'wealth of falsehood.' The Hebrew can describe wealth marked by deception, whether because it is dishonestly gained or because it proves unreliable.
    reason: lexical_alternative
translation:
  language: ko
  text: 속이는 재산을 신뢰하지 마십시오. 그것은 분노의 날에 유익하지 못합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '그리스어 병행 전승은 이 절을 다르게 전합니다: ''지각이 있으면 네 이웃에게 대답하라. 그러나 그렇지 않으면 네 손이 네 입에 있으라.'' 이 번역은 현존 히브리어 본문을 따릅니다.'
    reason: textual_variant
  - marker: b
    text: 또는 '거짓된 재산', '사기성 재물', '거짓의 재물'로 옮길 수 있습니다. 히브리어는 기만적으로 얻은 재산일 수도, 믿을 수 없는 재산일 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּבְטַח
  english_pob_choice: Do not trust
  chosen_korean: 신뢰하지 마십시오
  alternatives_korean:
  - 믿지 마십시오
  - 의지하지 마십시오
  lexicon: HALOT
  rationale: 지혜문학의 금지형에서 'trust'의 의미를 가장 직접적으로 살리면서, 현대 합쇼체 명령으로 자연스럽게 옮겼습니다.
- source_word: נִכְסֵי שֶׁקֶר
  english_pob_choice: deceitful wealth
  chosen_korean: 속이는 재산
  alternatives_korean:
  - 거짓된 재산
  - 사기성 재물
  - 허망한 재물
  lexicon: HALOT
  rationale: '''wealth''의 자산/재산 의미를 살리되, שֶׁקֶר의 ''거짓/기만''을 형용사적으로 풀어 너무 좁게 ''불법 취득''으로 한정하지 않았습니다.'
- source_word: לֹא יוֹעִילוּ
  english_pob_choice: will not profit
  chosen_korean: 유익하지 못합니다
  alternatives_korean:
  - 도움이 되지 않습니다
  - 이익이 되지 않습니다
  - 유효하지 않습니다
  lexicon: HALOT
  rationale: 히브리어의 '유익하다/도움이 되다'를 한국어에서 가장 자연스럽게 전달하면서, 경고의 실용적 뉘앙스를 유지했습니다.
- source_word: עֶבְרָה
  english_pob_choice: wrath
  chosen_korean: 분노
  alternatives_korean:
  - 진노
  - 격노
  - 심판의 날
  lexicon: HALOT
  rationale: 본문은 하나님을 명시하지 않으므로 '진노'로 신학적으로 구체화하기보다, 히브리어의 강한 감정/재난적 어감을 담는 일반어 '분노'를 택했습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행 전승의 차이 처리
  chosen_reading: 히브리어 본문을 따라 '속이는 재산을 신뢰하지 마십시오'로 번역했습니다.
  alternative_readings:
  - '그리스어 병행: ''지각이 있으면 이웃에게 대답하라…'''
  rationale: 이 절은 그리스어 전승이 완전히 다른 문장을 보이므로, 현존 히브리어를 주본문으로 삼는 이 프로젝트 원칙을 따랐습니다.
  doctrine_reference: 원어 우선 원칙과 본문비평상의 전승 차이를 구분해 반영
