base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/043/002.yaml
  text: The sun[a], appearing in its form and hot[c][b], how awe-inspiring are the works of the Lord.
  footnotes:
  - marker: a
    text: 'Greek parallel: ''The sun, proclaiming as it appears at its rising, a marvelous instrument, the work of the Most High.'' The Hebrew witness instead emphasizes the sun''s visible form and heat.'
    reason: alternative_reading
  - marker: b
    text: The Hebrew wording is compressed and slightly difficult at 'appearing in its form and hot'; the sense is that the sun's visible appearance and heat display the awe-inspiring works of the Lord.
    reason: lexical_alternative
  - marker: c
    text: Masada preserves this line only fragmentarily here, while the Cairo Geniza text supplies the fuller Hebrew wording used for the main translation.
    reason: textual_variant
translation:
  language: ko
  text: 해는 그 모습으로 드러나고 뜨겁습니다. 주님의 하신 일들이 얼마나 경외심을 불러일으키는지요.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 병행본문은 “해가 떠오를 때 그 모습으로 선포하는, 지극히 높으신 이의 작품인 놀라운 기구”로 읽힙니다. 히브리어 증거는 이와 달리 해의 보이는 모습과 열기를 강조합니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어 표현은 압축되어 있고 다소 난해합니다. 해의 보이는 모습과 열기가 주님의 경외로운 일들을 드러낸다는 뜻으로 이해할 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 마사다 본문은 이 행을 여기서 단편적으로만 보존하며, 본 번역에 사용한 더 온전한 히브리어 문구는 카이로 게니자 본문에서 전합니다.
    reason: textual_variant
lexical_decisions:
- source_word: שמש
  english_pob_choice: The sun
  chosen_korean: 해
  alternatives_korean:
  - 태양
  lexicon: HALOT
  rationale: 히브리어 שמש는 천체인 해를 가리키므로, 현대 한국어에서 자연스럽고 간명한 ‘해’로 옮겼습니다.
- source_word: מביע בצורתו
  english_pob_choice: appearing in its form
  chosen_korean: 그 모습으로 나타나며
  alternatives_korean:
  - 그 형체로 드러나며
  - 그 형태로 나타나며
  lexicon: HALOT
  rationale: 난해한 שבורת 구문을 ‘보이는 형상’의 의미로 살려, 외형이 드러나는 장면을 자연스럽게 표현했습니다.
- source_word: וחמה
  english_pob_choice: and hot
  chosen_korean: 뜨거우니
  alternatives_korean:
  - 그리고 뜨겁고
  - 열기로
  lexicon: HALOT
  rationale: 히브리어의 압축된 표현이 태양의 열을 가리키므로, 문맥상 드러나는 성질을 짧게 살렸습니다.
- source_word: מעשי ה'
  english_pob_choice: the works of the Lord
  chosen_korean: 주님의 일들
  alternatives_korean:
  - 주님의 일
  - 주님의 행하신 일들
  lexicon: HALOT
  rationale: 히브리어 복수형 מעשי를 살려 ‘일들’로 옮겼고, ה'는 본문 관행에 따라 ‘주님’으로 처리했습니다.
theological_decisions:
- issue: 여호와/주님의 표기
  chosen_reading: 주님의
  alternative_readings:
  - 야훼의
  - 여호와의
  rationale: 이 구절의 히브리어 약어 ה'는 경외적 신칭이므로, 본문 흐름에 맞는 ‘주님’으로 처리해 과도한 표기 충돌을 피했습니다.
  doctrine_reference: 'DOCTRINE.md contested terms: יְהוָה YHWH'
- issue: 그리스어 병행본문과의 차이
  chosen_reading: 히브리어 본문의 ‘태양의 모습과 열기’ 의미를 본문으로 따릅니다.
  alternative_readings:
  - 그리스어의 ‘떠오르며 선포하는 해’ 의미를 반영
  rationale: POB 영어본이 히브리어 증거를 मुख्य 본문으로 삼고 그리스어를 대안으로 주석 처리한 만큼, 본문은 히브리어 의미를 따르고 그리스어는 배경 자료로만 유지했습니다.
  doctrine_reference: Source hierarchy / textual criticism
