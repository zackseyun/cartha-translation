base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/043/021.yaml
  text: It scorches the produce of the mountains with drought[b][a], and the pasture of plants with flame.
  footnotes:
  - marker: a
    text: The Greek parallel reads more generally, 'It will consume mountains and burn up the wilderness, and extinguish the green grass like fire.' The Hebrew text behind this translation is more compact and differs in imagery.
    reason: alternative_reading
  - marker: b
    text: The Hebrew phrase rendered 'with drought' uses a word for dryness; 'with dryness' is a possible more literal alternative.
    reason: lexical_alternative
translation:
  language: ko
  text: 그것은 산의 소출을 가뭄으로[b] 태우고, 초목이 자라는 풀밭을 불꽃으로 사릅니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 평행문은 더 일반적으로 ‘산들을 삼키고, 광야를 불태우며, 푸른 풀을 불처럼 사른다’고 읽습니다. 히브리어 본문은 더 압축적이며 이미지가 다릅니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어 בחרב는 ‘가뭄’으로 옮겼습니다. 문자적으로는 ‘건조함’도 가능합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יבול
  english_pob_choice: produce
  chosen_korean: 소출
  alternatives_korean:
  - 생산물
  - 열매
