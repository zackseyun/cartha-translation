  lexicon: HALOT
  rationale: 산에서 나는 것을 가리키는 넓은 표현으로, ‘produce’를 자연스럽게 옮기면서 농업적으로만 좁아지지 않게 합니다.
- source_word: בחרב
  english_pob_choice: with drought
  chosen_korean: 가뭄으로
  alternatives_korean:
  - 건조로
  - 메마름으로
  - 건조함으로
  lexicon: HALOT
  rationale: 히브리어 חֹרֶב의 핵심 의미인 메마름/가뭄을 살려, 파괴적 자연력이라는 문맥에 맞게 옮겼습니다.
- source_word: ישיק
  english_pob_choice: it scorches
  chosen_korean: 태우고
  alternatives_korean:
  - 사르고
  - 불태우고
  - 그슬리고
  lexicon: HALOT
  rationale: 앞절의 가뭄과 뒷절의 불꽃 이미지에 맞춰, 단순한 훼손보다 강한 소각·소멸의 동작을 드러내는 표현을 택했습니다.
- source_word: נוה צמחים
  english_pob_choice: the pasture of plants
  chosen_korean: 초목의 풀밭
  alternatives_korean:
  - 식물의 풀밭
  - 초원의 초목
  - 초목의 목장
  lexicon: HALOT
  rationale: נוה를 목초지/풀밭의 자연 이미지로 보고, צמחים는 ‘초목’으로 받아 두 이미지를 함께 살렸습니다.
- source_word: בלהבה
  english_pob_choice: with flame
  chosen_korean: 불꽃으로
  alternatives_korean:
  - 화염으로
  - 불길로
  - 불꽃과 함께
  lexicon: HALOT
  rationale: 전치사 ב + 명사 구조를 도구·수단의 의미로 자연스럽게 처리하되, 시적 병행을 살리는 간결한 표현으로 옮겼습니다.
