  alternative_readings:
  - 그리스어를 따라 ‘산들을 삼키고, 광야를 불태우며, 푸른 풀을 불처럼 사르는’ 식으로 더 일반화할 수 있습니다.
  rationale: 이 절의 히브리어는 더 압축적이며, POB의 기준처럼 히브리어 증거를 우선하되 그리스어는 대조 참고로 남겨 둡니다.
