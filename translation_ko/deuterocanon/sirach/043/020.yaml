base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/043/020.yaml
  text: The cold of the north wind returns[a]; like rot, it freezes its spring. Over every standing body of water it settles[b], and the reservoir puts on armor like a breastplate.
  footnotes:
  - marker: a
    text: Hebrew reads 'like rot, it freezes its spring,' a difficult image. The Greek parallel reads more straightforwardly, 'ice/crystal freezes from water.' The main text follows the Hebrew as primary for Sirach where extant, while preserving the Greek sense here.
    reason: alternative_reading
  - marker: b
    text: The Hebrew wording in the clause rendered 'over every standing body of water it settles' is textually difficult. The Greek parallel supports the sense of ice settling over every gathered body of water.
    reason: textual_variant
translation:
  language: ko
  text: 북풍의 차가움이 되돌아오며, 썩은 것처럼 그것은 그 샘을 얼게 합니다. 모든 고인 물 위에 그것이 내려앉고, 저수지는 흉배처럼 갑옷을 입습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: צִנַּת רוּחַ צָפוֹן
  english_pob_choice: The cold of the north wind
  chosen_korean: 북풍의 차가움
  alternatives_korean:
  - 북풍의 추위
  - 북풍의 냉기
  lexicon: HALOT
  rationale: רוּחַ צָפוֹן은 날씨 맥락의 북풍으로 이해하고, צִנַּת는 그 바람의 차가움을 나타내므로 ‘북풍의 차가움’으로 자연스럽게 옮겼습니다.
- source_word: וְכָרָקָב
  english_pob_choice: like rot
  chosen_korean: 썩은 것처럼
  alternatives_korean:
  - 부패처럼
  - 썩음처럼
  lexicon: HALOT
  rationale: 히브리어 본문은 난해하지만 POB의 본문 선택을 따라 ‘rot’의 의미를 살려, 직역에 가까운 ‘썩은 것처럼’을 택했습니다.
- source_word: מְקוֹרוֹ
  english_pob_choice: its spring
  chosen_korean: 그 샘
  alternatives_korean:
  - 그 근원
  - 그 샘물
  lexicon: HALOT
  rationale: מָקוֹר/מְקוֹר은 샘과 근원을 뜻할 수 있으나, 여기서는 물의 이미지가 분명하므로 ‘샘’이 가장 직접적입니다.
- source_word: מַעֲמַד מַיִם / יְקָרִים
  english_pob_choice: standing body of water / it settles
  chosen_korean: 고인 물 위에 그것이 내려앉고
  alternatives_korean:
  - 정체된 물 위에 그것이 머물고
  - 모인 물 위에 그것이 내려앉고
  lexicon: HALOT
  rationale: 문맥과 그리스어 평행본문의 ‘모인 물 위에’라는 뜻을 반영하여, 물 위에 얼음/냉기가 덮이는 장면을 한국어로 선명하게 표현했습니다.
- source_word: מִקְוֶה
  english_pob_choice: the reservoir
  chosen_korean: 저수지
  alternatives_korean:
  - 못
  - 웅덩이
  - 물웅덩이
  lexicon: HALOT
  rationale: מִקְוֶה는 모인 물의 저장소를 가리키므로, 현대 독자가 즉시 이해할 수 있는 ‘저수지’를 택했습니다.
- source_word: כְּשִׁרְיוֹן
  english_pob_choice: like a breastplate
  chosen_korean: 흉배처럼 갑옷을 입습니다
  alternatives_korean:
  - 흉갑처럼
  - 흉배처럼 몸을 두릅니다
  - 갑옷처럼
  lexicon: HALOT
  rationale: שִׁרְיוֹן은 갑옷/흉갑을 뜻하며, 그리스어 θώραξ와도 맞물리므로 군사적 비유를 살려 ‘흉배처럼 갑옷을 입습니다’로 옮겼습니다.
