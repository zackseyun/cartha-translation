  text: For this reason he created the storehouse[b][a], and made the clouds fly like birds.
  footnotes:
  - marker: a
    text: Hebrew has 'created a storehouse' if read strictly from the consonants, but the Greek parallel reads 'the storehouses were opened,' which likely preserves the intended sense here.
    reason: textual_variant
  - marker: b
    text: Masada does not preserve this verse clearly; the Cairo Geniza Hebrew is the main witness here, with the Greek used as a consistency check.
    reason: cross_reference
translation:
  language: ko
  text: 이 때문에 그분께서는 창고들[a][b]을 여시고, 구름들이 새들처럼 날아가게 하셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 자음 본문은 엄격히 읽으면 ‘창고를 창조하셨다’로도 이해될 수 있습니다. 그러나 그리스어 병행 본문은 ‘창고들이 열렸다’라고 하며, 여기서는 이 뜻을 강하게 지지합니다.
    reason: textual_variant
  - marker: b
    text: 마사다 본문은 이 절을 분명하게 보존하지 않습니다. 카이로 게니자의 히브리어 본문이 주요 증인이며, 그리스어 병행 본문은 의미를 확인하는 데 사용됩니다.
    reason: cross_reference
