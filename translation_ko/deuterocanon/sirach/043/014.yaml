    rationale: The Hebrew/Greek textual issue concerns ‘created’ versus ‘opened’; neither wording specifically requires that the storehouses remain open. ‘여시고’ renders the adopted reading without this addition.
  - severity: low
    issue: Footnote anchors are placed at the end of the whole sentence rather than on the disputed ‘storehouses/opened’ expression.
    rationale: Both notes concern the textual basis for the storehouse/opening clause, so anchoring them after ‘창고들’ makes their referent unambiguous.
