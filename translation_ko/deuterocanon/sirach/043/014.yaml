  rationale: 의미상 부자연스러운 '창고를 창조하다'를 피하고, 병행 전승이 보여 주는 천상 저장소의 개방 이미지를 한국어로 전달하기 위해서입니다.
  doctrine_reference: Sirach 43:14의 히브리어-그리스어 병행 읽기
