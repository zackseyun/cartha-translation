base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/043/022.yaml
  text: 'A healing for all: a massing cloud of dew[c][b][a], driving back the scorching heat.'
  footnotes:
  - marker: a
    text: Hebrew 'a massing cloud of dew' is difficult; the Greek parallel reads 'mist, dew,' pointing to cooling moisture rather than a storm cloud.
    reason: lexical_alternative
  - marker: b
    text: The final clause may also be understood more literally as 'driving away the scorching heat to enrich/moisten,' with 'for refreshment' expressing the likely sense in idiomatic English.
    reason: alternative_reading
  - marker: c
    text: The Masada scroll for this area is fragmentary and does not supply a clear competing reading for this verse; the translation is anchored in the Cairo Geniza Hebrew with the Greek parallel used as a control.
    reason: textual_variant
translation:
  language: ko
  text: 모든 것을 위한 치유입니다. 이슬의 구름이 몰려와 사나운 더위를 몰아냅니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 난해하지만, 그리스어 병행본문은 ‘안개, 이슬’로 읽어 냉각과 습기의 이미지를 지지합니다.
    reason: cross_reference
  - marker: b
    text: ‘몰아냅니다’는 פורע의 문맥적 의미를 살린 것이며, 더 문자적으로는 ‘흩어버립니다’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 마사다 두루마리의 이 대목은 단편적이어서, 이 구절의 본문은 카이로 게니자 히브리어와 그리스어 병행본문을 함께 참고했습니다.
    reason: textual_variant
lexical_decisions:
- source_word: מרפא כל
  english_pob_choice: A healing for all
  chosen_korean: 모든 것을 위한 치유입니다
  alternatives_korean:
  - 만물을 위한 치유입니다
  - 모든 이에게 주는 치유입니다
  lexicon: HALOT
  rationale: מרפא는 ‘치유/치유책’의 뜻이 자연스럽고, כל는 문맥상 포괄적 대상으로 읽혀 ‘모든 것’을 살리는 자연 현상의 효력을 나타냅니다.
- source_word: מערף ענן טל
  english_pob_choice: a massing cloud of dew
  chosen_korean: 이슬의 구름이 몰려와
  alternatives_korean:
  - 이슬이 응집된 구름이
  - 이슬의 군집한 구름이
  lexicon: HALOT
  rationale: 히브리어는 난해하지만, 그리스어 병행본문의 ὁμίχλη, δρόσος가 가리키는 ‘안개/이슬’의 냉각 효과를 살려 ‘이슬의 구름’으로 옮기고 동사로 움직임을 드러냈습니다.
- source_word: פורע לדשן שרב
  english_pob_choice: driving back the scorching heat
  chosen_korean: 사나운 더위를 몰아냅니다
  alternatives_korean:
  - 타는 더위를 물리칩니다
  - 작열하는 열기를 걷어냅니다
  lexicon: HALOT
  rationale: פורע는 이 문맥에서 ‘몰아내다/걷어내다’의 뜻이 적절하고, שרב는 ‘혹독한 더위, 타는 열기’를 가리키므로 현대 한국어로 분명하게 풀었습니다.
theological_decisions:
- issue: 자연 묘사의 기능을 지혜문학적 은유로 유지할지 여부
  chosen_reading: 이 구절을 물리적 기상 현상이자 생명을 살리는 은유로 함께 읽어, ‘치유’와 ‘더위의 퇴치’를 과장하지 않고 병행했습니다.
  alternative_readings:
  - 단순한 기상 묘사로만 제한
  - 영적 은유로만 확대
  rationale: 본문은 자연 현상을 통해 복리와 회복을 보여 주므로, 과도한 영해석이나 축소를 피하고 본래의 지혜문학적 관찰을 유지하는 것이 적절합니다.
  doctrine_reference: 지혜문학의 창조 질서 관찰
- issue: ‘모든 것’의 범위
  chosen_reading: כל을 ‘모든 것’으로 넓게 반영하되, 맥락상 만물의 유익을 말하는 표현으로 이해했습니다.
  alternative_readings:
  - ‘모두’로 인격 대상에 한정
  - ‘전부’로 중성화
  rationale: 히브리어 כל는 범위가 넓으며, 여기서는 치유적 효력을 강조하는 자연 묘사이므로 포괄적 표현이 원문의 힘을 잘 드러냅니다.
  doctrine_reference: 히브리어 כל의 문맥적 범위
