base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/043/032.yaml
  text: Many such wonders exist[b][a], but I have seen only a few of his works.
  footnotes:
  - marker: a
    text: 'Greek: ''There are many hidden things greater than these.'' The Hebrew witness reads more briefly, ''Many such wonders...,'' without explicitly saying ''hidden things.'''
    reason: alternative_reading
  - marker: b
    text: Greek has 'we have seen only a few of his works,' while the extant Hebrew reads 'I have seen.'
    reason: textual_variant
translation:
  language: ko
  text: 이와 같은 놀라운 일들은 많이 있습니다[b][a], 그러나 나는 그분의 일 가운데서 겨우 조금만 보았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 ‘이것들보다 더 큰 숨겨진 것들이 많이 있습니다’라고 더 길게 말합니다. 현존 히브리어는 ‘이와 같은 놀라운 일들은 많이 있습니다’로 더 간결합니다.
    reason: textual_variant
  - marker: b
    text: 그리스어는 ‘우리는 그의 일들 가운데서 겨우 조금만 보았습니다’라고 1인칭 복수를 사용합니다. 현존 히브리어는 1인칭 단수입니다.
    reason: textual_variant
lexical_decisions:
- source_word: רוב נפלאות כאלה
  english_pob_choice: Many such wonders
  chosen_korean: 이와 같은 놀라운 일들은 많이 있습니다
  alternatives_korean:
  - 이와 같은 경이로운 일들은 많이 있습니다
  - 이런 놀라운 일들은 많이 있습니다
  lexicon: HALOT
  rationale: רוב은 단순한 ‘대부분’보다 수량의 많음을 나타내므로, 한국어에서는 ‘많이 있습니다’로 자연스럽게 옮기고 נפלאות는 경외를 불러일으키는 행위를 뜻해 ‘놀라운 일들’로 렌더링했습니다.
- source_word: כאלה
  english_pob_choice: such
  chosen_korean: 이와 같은
  alternatives_korean:
  - 이런
  - 그와 같은
  lexicon: HALOT
  rationale: 앞서 언급된 놀라운 일들을 가리키는 지시 관계를 살려 ‘이와 같은’으로 번역했습니다.
- source_word: מעט
  english_pob_choice: only a few
  chosen_korean: 겨우 조금만
  alternatives_korean:
  - 겨우 몇 가지
  - 아주 조금만
  lexicon: HALOT
  rationale: 남아 있는 것의 제한성을 강조하는 뉘앙스를 살려 ‘겨우 조금만’으로 옮겼습니다.
- source_word: ממעשיו
  english_pob_choice: of his works
  chosen_korean: 그분의 일 가운데서
  alternatives_korean:
  - 그분의 일들 가운데서
  - 그분이 하신 일 가운데서
  lexicon: HALOT
  rationale: מן의 부분적 의미를 살려 전체 가운데 일부만 보았다는 뜻이 되도록 ‘가운데서’로 풀었고, ‘일’은 하나님의 행위를 자연스럽게 가리킵니다.
theological_decisions:
- issue: 히브리어 본문의 간결한 진술과 그리스어의 더 긴 변이(‘greater than these’, ‘hidden things’)를 어떻게 반영할지
  chosen_reading: 본문은 히브리어의 간결한 진술을 따르고, 그리스어가 더 분명히 말하는 ‘숨겨진 것들/더 큰 것들’의 뉘앙스는 각주로 보존합니다.
  alternative_readings:
  - 이것들보다 더 큰 숨겨진 것들이 많이 있습니다
  - 이보다 더 큰 많은 비밀들이 있습니다
  rationale: 존재하는 히브리어 증거가 본문상 우선이므로, 추가적 해석을 본문에 흡수해 의미를 넓히기보다 변이를 각주에 남겨 긴장을 보존했습니다.
  doctrine_reference: 원어 우선 원칙; 본문과 변이 사이의 긴장 보존
- issue: 주어의 인칭 차이(히브리어 ‘나는 보았다’ vs. 그리스어 ‘우리는 보았다’)
  chosen_reading: 주요 본문에는 단수 ‘나는 보았습니다’를 사용합니다.
  alternative_readings:
  - 우리는 그의 일들 가운데서 겨우 조금만 보았습니다
  rationale: 현존 히브리어는 1인칭 단수이므로 이를 본문에 반영하고, 그리스어 복수는 의미 있는 변이로 각주 처리합니다.
  doctrine_reference: 원어 우선 원칙
