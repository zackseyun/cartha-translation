translation:
  language: ko
  text: 그분께서는 자신의 계획으로 심연을 잠잠하게 하시고[a], 그 안에 섬들을[b] 심으셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 이 부분이 난해합니다. 헬라어 병행본은 ‘그의 이성으로 심연을 그치게 하였고, 그것을 심었다’고 읽습니다. 헬라어의 후반절은 히브리어와 표현이 다르지만, 전반절은 ‘심연을 잠잠하게 하시고’라는 번역을 뒷받침합니다.
    reason: textual_variant
  - marker: b
    text: ‘섬들’은 ‘해안들’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מחשבתו
  english_pob_choice: his plan
  chosen_korean: 그의 계획
  alternatives_korean:
  - 그의 생각
  - 그의 뜻
  - 그의 설계
  lexicon: HALOT
  rationale: חשׁב 계열 명사는 단순한 내적 생각보다 의도와 실행을 포함한 계획의 뜻이 강하므로, POB의 'his plan'에 맞춰 '계획'으로 옮겼습니다.
- source_word: משיק רבה
  english_pob_choice: stilled the deep
  chosen_korean: 깊은 바다를 잠잠하게 하셨고
  alternatives_korean:
  - 깊은 바다를 진정시키셨고
  - 깊은 바다를 शांत하게 하셨고
  - 깊은 바다를 가라앉히셨고
  lexicon: HALOT
  rationale: 히브리어는 난해하지만, 헬라어 ἐκόπασεν의 '멈추게 하다, 그치게 하다'를 반영해 물결과 혼돈을 가라앉히는 뜻을 살려 '잠잠하게 하셨고'로 옮겼습니다.
- source_word: איים
  english_pob_choice: islands
  chosen_korean: 섬들
  alternatives_korean:
  - 해안들
  - 섬들로
  - 연안들
  lexicon: HALOT
  rationale: איים은 문맥에 따라 '섬들' 또는 '해안들'을 뜻할 수 있으나, 창조적 지형 형성의 구체성이 더 잘 드러나도록 기본값인 '섬들'을 택했습니다.
theological_decisions:
- issue: 히브리어 난구와 헬라어 병행본의 의미를 어떻게 통합할지
  chosen_reading: 히브리어 본문을 기본으로 하되, 헬라어의 '그치게 하다'와 '심다'가 드러내는 창조적 질서를 한국어에 반영했습니다.
  alternative_readings:
  - 그의 생각으로 그는 심연을 가라앉히셨고, 그 안에 섬들을 심으셨습니다.
  - 그의 뜻으로 그는 깊음을 멈추게 하셨고, 그 안에 해안들을 세우셨습니다.
  rationale: 이 구절은 히브리어가 불확실하므로, 의미를 안정시키기 위해 헬라어 병행본을 실제 번역 입력으로 사용하되, 바다의 혼돈이 질서로 바뀌는 창조적 행위를 드러내는 방향을 유지했습니다.
  doctrine_reference: 'PHILOSOPHY.md: 현존하는 히브리어를 우선하되, 본문이 난해할 때는 헬라어 병행본을 실제 번역 근거로 사용하고 불확실성을 투명하게 반영한다.'
