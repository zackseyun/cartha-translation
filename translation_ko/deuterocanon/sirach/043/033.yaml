base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/043/033.yaml
  text: The Lord made everything[a], and to those who fear him he gave wisdom[b]; the praise of the fathers is everlasting.
  footnotes:
  - marker: a
    text: The Hebrew witness adds 'the praise of the fathers of old,' a phrase likely carried over from the next section; the Greek parallel ends with 'he gave wisdom.'
    reason: textual_variant
  - marker: b
    text: Or 'to the pious' (following the Greek); the Hebrew more literally says 'to those who fear him.'
    reason: alternative_reading
translation:
  language: ko
  text: 주님께서는 모든 것을 만드셨고, 그분을 경외하는 이들에게[a] 지혜를 주셨습니다. 옛 조상들에 대한 찬양.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘경건한 이들에게는’(그리스어에 따른 번역)으로 옮길 수 있습니다. 히브리어는 더 문자적으로 ‘그분을 경외하는 이들’이라고 말합니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어 전승에는 ‘옛 조상들에 대한 찬양’이라는 어구가 이어지지만, 그리스어 평행본문은 ‘지혜를 주셨습니다’로 끝납니다. 이 어구는 다음 단락의 표제가 이입된 것일 수 있습니다.
    reason: textual_variant
lexical_decisions:
