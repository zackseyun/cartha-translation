base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/043/033.yaml
  text: The Lord made everything[a], and to those who fear him he gave wisdom[b]; the praise of the fathers is everlasting.
  footnotes:
  - marker: a
    text: The Hebrew witness adds 'the praise of the fathers of old,' a phrase likely carried over from the next section; the Greek parallel ends with 'he gave wisdom.'
    reason: textual_variant
  - marker: b
    text: Or 'to the pious' (following the Greek); the Hebrew more literally says 'to those who fear him.'
    reason: alternative_reading
translation:
  language: ko
  text: 주님께서는 모든 것을 만드셨고, 그분을 경외하는 이들에게는 지혜를 주셨습니다. 조상들의 찬양은 영원합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 전승에는 '조상들의 찬양은 영원합니다'라는 어구가 이어지지만, 그리스어 평행본문은 '지혜를 주셨습니다'로 끝납니다.
    reason: textual_variant
  - marker: b
    text: 또는 '경건한 이들에게는'(그리스어에 따른 번역)로도 옮길 수 있습니다. 히브리어는 더 문자적으로 '그분을 경외하는 이들'이라고 말합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: את הכל
  english_pob_choice: everything
  chosen_korean: 모든 것
  alternatives_korean:
  - 만물
  - 전부
  lexicon: HALOT
  rationale: 포괄적 대상을 자연스러운 현대 한국어로 옮겼으며, 의미 범위는 영어 POB의 everything과 히브리어 הכל의 포괄성을 그대로 반영합니다.
- source_word: עשה
  english_pob_choice: made
  chosen_korean: 만드셨고
  alternatives_korean:
  - 지으셨고
  - 하셨고
  lexicon: HALOT
  rationale: 창조적 총괄 진술에 맞는 동사로, 히브리어 עשה와 그리스어 ἐποίησεν의 의미를 자연스럽게 살렸습니다.
- source_word: ליראיו
  english_pob_choice: to those who fear him
  chosen_korean: 그분을 경외하는 이들에게는
  alternatives_korean:
  - 그분을 두려워하는 이들에게는
  - 경건한 이들에게는
  lexicon: HALOT
  rationale: 히브리어의 '경외하다' idiom을 살려 번역했고, 영어 POB의 대안인 'the pious'는 주석에서만 반영했습니다.
- source_word: נתן חכמה
  english_pob_choice: he gave wisdom
  chosen_korean: 지혜를 주셨습니다
  alternatives_korean:
  - 지혜를 주셨다
  - 지혜를 주셨습니다
  lexicon: HALOT
  rationale: 사역·수여의 뉘앙스를 자연스럽게 살린 평서형으로 옮겼고, חכמה는 본서의 핵심 용어이므로 '지혜'로 일관했습니다.
- source_word: שבח אבות עולם
  english_pob_choice: the praise of the fathers is everlasting
  chosen_korean: 조상들의 찬양은 영원합니다
  alternatives_korean:
  - 옛 조상들의 찬양은 영원합니다
  - 조상들의 영원한 찬양입니다
  lexicon: HALOT
  rationale: 최신 영어 개정이 채택한 문구를 반영해 본문에 포함했습니다. 다만 히브리어의 이 어구는 본절의 앞부분과 다소 긴장 관계가 있어, 직역보다 한국어 문맥에 맞는 간결한 표현으로 옮겼습니다.
theological_decisions:
- issue: 히브리어 축약형 ה'의 번역
  chosen_reading: 주님
  alternative_readings:
  - 야훼
  - 주
  rationale: 본문은 하나님의 호칭을 가리키며, 한국어 현대 문체의 본문에서는 예배적이면서도 자연스러운 '주님'이 가장 읽기 쉽습니다. 다만 프로젝트 기본어인 '야훼'는 이 절에서 영어 POB의 'The Lord'와 문체상 거리가 있어 본문에서는 채택하지 않았습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms table, divine names and title rendering'
- issue: 마지막 어구 שבח אבות עולם의 포함
  chosen_reading: 본문에 포함하여 '조상들의 찬양은 영원합니다'로 번역
  alternative_readings:
  - 주석으로 돌려 본문에서 제외
  - '''옛 조상들의 찬양''으로 더 문자적으로 옮김'
  rationale: 최신 영어 POB 개정이 이 어구를 본문에 반영하므로, 한국어 초안도 그 결정을 따랐습니다. 히브리어와 그리스어 전승의 차이는 본문을 축소하지 않고 노출하는 쪽이 투명합니다.
  doctrine_reference: 'DOCTRINE.md: Preserve textual tension rather than resolve it'
