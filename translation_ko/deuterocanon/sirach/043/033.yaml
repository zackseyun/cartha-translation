theological_decisions:
- issue: 히브리어 축약형 ה'의 번역
  chosen_reading: 주님
  alternative_readings:
  - 야훼
  - 주
  rationale: 본문은 하나님의 호칭을 가리키며, 한국어 현대 문체의 본문에서는 예배적이면서도 자연스러운 '주님'이 가장 읽기 쉽습니다. 다만 프로젝트 기본어인 '야훼'는 이 절에서 영어 POB의 'The Lord'와 문체상 거리가 있어 본문에서는 채택하지 않았습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms table, divine names and title rendering'
- issue: 마지막 어구 שבח אבות עולם의 포함
  chosen_reading: 본문에 포함하여 '조상들의 찬양은 영원합니다'로 번역
  alternative_readings:
  - 주석으로 돌려 본문에서 제외
  - '''옛 조상들의 찬양''으로 더 문자적으로 옮김'
  rationale: 최신 영어 POB 개정이 이 어구를 본문에 반영하므로, 한국어 초안도 그 결정을 따랐습니다. 히브리어와 그리스어 전승의 차이는 본문을 축소하지 않고 노출하는 쪽이 투명합니다.
  doctrine_reference: 'DOCTRINE.md: Preserve textual tension rather than resolve it'
