base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/043/005.yaml
  text: For great is the Lord who made it[b][a], and by his word he hastens its course.
  footnotes:
  - marker: a
    text: Masada preserves only the first colon ('For great is the Lord who made it'); the Cairo Geniza Hebrew continues with a difficult reading, and the Greek parallel supports the sense 'by his word he hastens its course.'
    reason: textual_variant
  - marker: b
    text: Or 'at his command he directs its course.'
    reason: lexical_alternative
translation:
  language: ko
  text: 크신 주님께서 그것을 만드셨으니, 그분의 말씀으로 그것의 길을 재촉하십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 둘째 행의 어휘가 난해하지만, 그리스어 평행문은 ‘그분의 말씀으로 그 길을 재촉하신다’는 뜻을 분명하게 뒷받침합니다.
    reason: textual_variant
lexical_decisions:
- source_word: גדול
  english_pob_choice: great
  chosen_korean: 크신
  alternatives_korean:
  - 위대하신
  - 큰
  lexicon: HALOT
  rationale: 찬양 시구에서 ‘great’를 가장 직접적으로 살리면서도 하나님께 대한 호칭에 자연스럽게 맞도록 형용사형 존대 표현을 택했습니다.
- source_word: ה'
  english_pob_choice: the Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주
  - 야훼
  lexicon: HALOT
  rationale: 프로젝트 기본값상 신명은 한국어 본문에서 ‘주님’으로 옮기되, 직접 음역은 피했습니다.
- source_word: בדבריו
  english_pob_choice: by his word
  chosen_korean: 그분의 말씀으로
  alternatives_korean:
  - 그분의 말로
  - 그분의 명령으로
  lexicon: HALOT
  rationale: 히브리어의 도구적 용법을 살려 ‘말씀으로’로 옮겼고, 단수 ‘말씀’을 유지해 경구적·시편적 어감을 보존했습니다.
- source_word: ינצח
  english_pob_choice: he hastens
  chosen_korean: 재촉하십니다
  alternatives_korean:
  - 앞당기십니다
  - 서두르게 하십니다
  lexicon: HALOT
  rationale: 그리스어 병행문의 ‘재촉하다/앞당기다’ 계열 의미를 반영하되, 천체의 운동을 부자연스럽게 기술하는 현대적 표현은 피했습니다.
theological_decisions:
- issue: 신성 호칭의 존대와 시적 문맥
  chosen_reading: ‘주님께서…하십니다’의 합쇼체를 유지해 찬양문답시의 경배 어조를 살렸습니다.
  alternative_readings:
  - 평서형으로 낮춘 표현
  - 더 전통적인 교회어휘
  rationale: 본문은 창조주를 찬양하는 지혜문학의 선언이므로, 현대 표준어 합쇼체로도 경외의 의미를 충분히 전달할 수 있습니다.
  doctrine_reference: 'POB Korean style guide: modern formal-polite register'
