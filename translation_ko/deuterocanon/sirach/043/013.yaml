translation:
  language: ko
  text: 그분의 능력으로 번개를 그어 놓으시고, 번갯불들을 높은 곳에서 승리하게 하십니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '그리스어 평행본문: ‘그분의 명령으로 눈을 그치게 하시고, 그분의 심판의 번개를 재촉하십니다.’ 히브리어와 그리스어는 이 줄에서 상당히 다릅니다.'
    reason: alternative_reading
  - marker: b
    text: 히브리어 동사 תתוה는 이 문맥에서 드물고 뜻이 확실하지 않아, ‘그어 놓다’, ‘표시하다’, ‘지정하다’ 같은 뜻이 가능하며, 본문은 그중 가장 직관적인 이미지를 따른 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: גבורתו
  english_pob_choice: by his might
  chosen_korean: 그분의 능력으로
  alternatives_korean:
  - 그분의 힘으로
  - 그분의 권능으로
  lexicon: HALOT
  rationale: גבורתו는 하나님의 힘과 위력을 가리키므로, 행위를 가능케 하는 수단을 드러내는 조사와 함께 ‘능력’으로 옮겼습니다.
- source_word: תתוה
  english_pob_choice: he marks out
  chosen_korean: 그어 놓으시고
  alternatives_korean:
  - 표시하시고
  - 그어 두시고
  - 지정하시고
  lexicon: HALOT
  rationale: 이 동사는 이 문맥에서 드문 용법으로, ‘자취를 그어 놓다/표시하다’의 이미지를 살리면 하늘 현상을 질서 있게 배치하시는 뜻을 비교적 직접적으로 전달합니다.
- source_word: ברק
  english_pob_choice: the lightning
  chosen_korean: 번개를
  alternatives_korean:
  - 번개를
  - 벼락을
  lexicon: HALOT
  rationale: ברק은 일반적으로 번개를 뜻하므로, 자연현상 자체를 가리키는 가장 표준적인 표현으로 옮겼습니다.
- source_word: זיקות
  english_pob_choice: the flashes
  chosen_korean: 번갯불들
  alternatives_korean:
  - 섬광들을
  - 번쩍임들을
  - 불꽃들을
  lexicon: HALOT
  rationale: זיקות은 불꽃 같은 섬광을 뜻할 수 있어, ברק과의 평행을 살리면서도 과도하게 기술적이지 않은 ‘번갯불들’로 옮겼습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행본문의 차이
  chosen_reading: 본문은 히브리어의 ‘번개를 그어 놓으시고’와 ‘번갯불들을 높은 곳에서’라는 이미지를 따르고, 그리스어가 드러내는 더 명시적인 ‘명령으로 눈을 그치게 하다/심판의 번개를 재촉하다’의 뜻은 주석적 대안으로만 보존했습니다.
  alternative_readings:
  - 그분의 명령으로 눈을 그치게 하시고, 심판의 번개를 재촉하십니다.
  rationale: 시락서는 현존 히브리어를 우선하되, 그리스어 평행본문이 실제 대조 자료이므로 본문 의미를 흐리지 않는 범위에서 차이를 주석으로 남기는 것이 가장 투명합니다.
  doctrine_reference: 'PHILOSOPHY.md: 시락서는 현존 히브리어를 우선하고, 그리스어 평행본문은 실제 번역 입력으로 참고합니다.'
