    reason: alternative_reading
  - marker: b
    text: 히브리어 동사 תתוה는 이 문맥에서 드물고 뜻이 확실하지 않습니다. ‘자취를 내다’, ‘인도하다’, ‘지정하다’ 등의 뜻이 가능하며, 본문은 문맥에 따라 ‘번개의 길을 정하다’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: גבורתו
  english_pob_choice: by his might
  chosen_korean: 그분의 능력으로
  alternatives_korean:
