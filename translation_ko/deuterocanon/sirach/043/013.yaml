  text: By his might he directs the lightning[b][a], and he makes the flashes prevail on high.
  footnotes:
  - marker: a
    text: 'Greek parallel: ''By his command he stills the snow, and he hastens the lightnings of his judgment.'' The Hebrew and Greek differ substantially in this line.'
    reason: alternative_reading
  - marker: b
    text: The Hebrew verb rendered 'marks out' is uncommon/uncertain in this context; possible senses include 'traces,' 'directs,' or 'appoints.'
