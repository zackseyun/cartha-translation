base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/043/015.yaml
  text: By his power he gives strength to the clouds[b][a], to cast down hailstones.
  footnotes:
  - marker: a
    text: Hebrew reads 'the cloud' (singular); the Greek parallel has 'clouds' (plural). The translation follows the Hebrew as the primary witness here.
    reason: alternative_reading
  - marker: b
    text: Masada preserves only the opening of the verse ('And by his might the cloud is strong'), while the Cairo Geniza Hebrew continues with the hailstone clause; the full translation follows the extant Hebrew line in Zone 1, with the Greek parallel supporting the hail imagery.
    reason: textual_variant
translation:
  language: ko
  text: 그의 능력으로 그가 구름에 힘을 더하셔서, 우박 돌을 떨어뜨리게 하십니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘구름’ 단수이고, 헬라어 평행본문은 ‘구름들’ 복수입니다. 본 번역은 이 구절의 주된 증인인 히브리어를 따릅니다.
    reason: alternative_reading
  - marker: b
    text: 마사다 사본은 이 절의 시작 부분만 보존하고, 카이로 게니자 히브리어는 우박 돌 구절까지 이어집니다. 본 번역은 현존 히브리어 본문을 따르며, 우박 이미지는 헬라어 평행본문으로도 뒷받침됩니다.
    reason: textual_variant
lexical_decisions:
- source_word: בכחו
  english_pob_choice: By his power
  chosen_korean: 그의 능력으로
  alternatives_korean:
  - 그의 힘으로
  - 그의 권능으로
  lexicon: HALOT
  rationale: ב + כוח는 수단/원인을 나타내므로 “~으로”가 자연스럽고, כוח의 의미를 한국어로는 “능력”이 본문 흐름에 가장 매끄럽습니다.
- source_word: יתן
  english_pob_choice: he gives
  chosen_korean: 그가 … 더하셔서
  alternatives_korean:
  - 그가 주셔서
  - 그가 주십니다
  lexicon: HALOT
  rationale: 직역의 “주다”보다 여기서는 구름에 힘을 ‘부여하여 강하게 만듦’이므로, 결과를 드러내는 “더하셔서”가 מקור의 동사를 과도하게 바꾸지 않으면서 의미를 드러냅니다.
- source_word: לענן / עז
  english_pob_choice: strength to the clouds
  chosen_korean: 구름에 힘
  alternatives_korean:
  - 구름에 능력
  - 구름들에 힘
  lexicon: HALOT
  rationale: 히브리어는 “구름” 단수이지만 시적·집합적 용법으로 이해할 수 있어 한국어는 자연스러운 집합 의미를 살리되 단수형으로 유지했습니다.
- source_word: להשליך אבני אלגביש
  english_pob_choice: to cast down hailstones
  chosen_korean: 우박 돌을 떨어뜨리게 하십니다
  alternatives_korean:
  - 우박 돌을 내리치게 하십니다
  - 우박 돌을 던지게 하십니다
  lexicon: HALOT
  rationale: להשליך는 목적/결과를 나타내며, “떨어뜨리다”가 자연스럽게 하늘에서 내리는 이미지를 살립니다. אבני אלגביש는 “우박 돌”로 옮겨 히브리어의 구체적 이미지를 보존했습니다.
theological_decisions:
- issue: 히브리어 단수 ‘구름’과 헬라어 복수 ‘구름들’의 차이
  chosen_reading: 본문의 히브리어를 따라 단수 의미를 유지하되, 한국어에서는 집합적 의미로 자연스럽게 읽히도록 처리했습니다.
  alternative_readings:
  - 구름들에 힘을 더하셔서
  - 구름에 힘을 더하셔서
  rationale: POB 영어가 히브리어를 우선하여 단수 ‘the cloud’를 택한 것과 같은 원칙을 따르되, 한국어 문장에서는 단수형이 어색하지 않아 그 형태를 유지했습니다.
  doctrine_reference: 본문 비평/번역 원칙
