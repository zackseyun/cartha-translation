  source_fidelity: 히브리어의 ‘그를 위하여’와 מַלְאָךְ의 ‘사자/천사’ 양의성은 본문에서 유지되어야 합니다. 후반절은 히브리어의 대명사 지시가 압축되어 있으나, 문맥 및 영어 POB의 독법을 따라 하나님의 말씀과 뜻을 가리키는 번역은 가능합니다. 다만 한국어 존대 종결은 후반절의 주어를 하나님으로 사실상 확정하므로, 지시 대상을 자연스럽고 일관되게 밝혀야 합니다.
  naturalness: ‘그의 말로 그는 자신의 뜻을 이루십니다’는 ‘그 사자’ 뒤에 오는 ‘그는’의 지시 대상이 한국어 문장 안에서 부자연스럽게 전환되고, 존대 서술어와도 어울리지 않습니다. ‘그분’과 ‘말씀’을 사용하면 현대 표준어 합쇼체에서 더 자연스럽고 경건한 격식을 유지합니다.
  terminology: ‘사자’는 מַלְאָךְ의 의미 범위를 보존하며 각주로 ‘천사’를 제시하는 방식이 적절합니다. 하나님의 발화를 가리키는 경우 ‘말씀’이 ‘말’보다 한국어 성경 문체와 존대 격식에 알맞습니다. 그리스어 평행본문 각주는 본문에 없는 ‘질서’ 개념이 본문 번역에 반영되었다고 주장하지 말고, 이문으로 중립적으로 제시해야 합니다.
