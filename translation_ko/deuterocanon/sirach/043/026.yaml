base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/043/026.yaml
  text: For his sake the messenger succeeds[b][a], and by his word he accomplishes his will.
  footnotes:
  - marker: a
    text: Or 'the angel prospers.' Hebrew מַלְאָךְ can mean either 'messenger' or 'angel.'
    reason: lexical_alternative
  - marker: b
    text: The Greek parallel reads more broadly, 'and by his word all things are ordered together,' supporting the sense of divine command as the ordering power behind creation.
    reason: alternative_reading
translation:
  language: ko
  text: 그를 위하여 그 사자가 형통하고, 그분께서는 자신의 말씀으로 자신의 뜻을 이루십니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘천사’. 히브리어 מַלְאָךְ는 ‘사자’와 ‘천사’를 모두 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어 평행본문은 더 넓게 ‘그분의 말씀으로 만물이 함께 정돈된다’고 읽습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: למענו
  english_pob_choice: For his sake
  chosen_korean: 그를 위하여
  alternatives_korean:
  - 그의 까닭에
  - 그를 위해
  lexicon: HALOT
  rationale: למַעַן 계열의 목적·참조 용법을 자연스러운 현대 한국어로 옮기되, 원문의 관계를 유지하기 위해 ‘그를 위하여’로 렌더링했습니다.
- source_word: מלאך
  english_pob_choice: the messenger
  chosen_korean: 그 사자
  alternatives_korean:
  - 그 천사
  - 한 사자
  lexicon: HALOT
  rationale: 히브리어 מלאך는 ‘사자/메신저’와 ‘천사’가 모두 가능하므로, 본문이 강하게 특정하지 않는 범위를 살려 ‘사자’로 옮겼습니다.
- source_word: ובדבריו
  english_pob_choice: by his word
  chosen_korean: 그의 말로
  alternatives_korean:
  - 그의 말씀으로
  - 그의 말에 의하여
  lexicon: HALOT
  rationale: 베트 전치사의 도구적 의미를 살리면서도, 하나님의 명령적 언어를 한국어에서 간결하게 드러내기 위해 ‘그의 말로’로 옮겼습니다.
- source_word: רצון
  english_pob_choice: his will
  chosen_korean: 자신의 뜻
  alternatives_korean:
  - 그의 뜻
  - 그의 원하심
  lexicon: HALOT
  rationale: רצון은 ‘뜻, 의지, 기쁨’의 범위를 가지며, 한국어에서는 신적 의도를 가장 직접적으로 드러내는 ‘뜻’이 적절합니다. 문맥상 주어를 명시하지 않아도 하나님을 가리키므로 존대와 함께 ‘자신의 뜻’으로 자연화했습니다.
theological_decisions:
- issue: מלאך를 ‘천사’로 좁힐지, ‘사자’로 둘지
  chosen_reading: 본문은 ‘사자’로 두어 의미의 폭을 보존했습니다.
  alternative_readings:
  - 천사
  - 메신저
  rationale: 히브리어 어휘의 양의성 자체가 주석적 긴장점이므로, 특정 천상 존재로 단정하지 않고 원문의 개방성을 보존하는 쪽이 POB 원칙에 부합합니다.
  doctrine_reference: 'DOCTRINE.md: Preserve theological tension rather than resolve it; documented lexical ambiguity.'
