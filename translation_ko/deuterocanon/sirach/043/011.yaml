  rationale: ברך는 여기서 하나님께 복을 비는 뜻보다 ‘좋게 말하다/찬양하다’의 기능이므로 한국어에서는 예배적 맥락이 살아 있는 ‘찬양하십시오’로 옮겼습니다.
