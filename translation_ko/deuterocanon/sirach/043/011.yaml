  rationale: הוד의 핵심인 찬란함·위엄을 한국어의 ‘광채’로 반영하고, 영어 본문의 ‘splendor’에 해당하는 시각적 뉘앙스를 살렸습니다.
theological_decisions:
- issue: 무지개의 창조주를 직접 하나님으로 명시하지 않는 방식
  chosen_reading: 본문의 ‘그것을 지으신 분’을 유지하여, 독자가 하나님을 자연스럽게 떠올리게 하되 본문보다 더 확장하지 않았습니다.
  alternative_readings:
  - 하나님을 찬양하십시오
  - 그 무지개를 만드신 하나님을 찬양하십시오
  rationale: 히브리어와 영어 본문 모두 직접적으로는 ‘그것의 Maker’라고 말하므로, 신학적 명시는 절제하고 원문 수준을 유지했습니다.
  doctrine_reference: 번역 원칙 1, 3
