  text: Look at the rainbow and bless its Maker[b][a], for it is exceedingly majestic in splendor.
  footnotes:
  - marker: a
    text: Hebrew 'bow'; here the sky-bow, that is, the rainbow.
    reason: lexical_alternative
  - marker: b
