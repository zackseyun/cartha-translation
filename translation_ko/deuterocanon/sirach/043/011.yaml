base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/043/011.yaml
  text: Look at the rainbow and bless its Maker[b][a], for it is exceedingly majestic in splendor.
  footnotes:
  - marker: a
    text: Hebrew 'bow'; here the sky-bow, that is, the rainbow.
    reason: lexical_alternative
  - marker: b
    text: Masada scroll supports the sense of majesty/splendor here, with a cognate wording where the Cairo Geniza text reads 'for it is exceedingly majestic in splendor.'
    reason: textual_variant
translation:
  language: ko
  text: 무지개를 보십시오. 그것을 지으신 분을 찬양하십시오. 그분은 그 빛의 광채 속에서 매우 위엄이 있으십니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘활’이지만, 여기서는 하늘의 무지개를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 마사다 사본 전승은 여기의 의미를 ‘위엄/광채’ 쪽으로 뒷받침합니다.
    reason: textual_variant
