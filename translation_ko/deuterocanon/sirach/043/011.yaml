translation:
  language: ko
  text: 무지개[a]를 보십시오. 그것을 지으신 분을 찬양하십시오. 그것은 광채 가운데서 매우 장엄합니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘활’이지만, 여기서는 하늘의 무지개를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 마사다 사본은 카이로 게니자 본문의 ‘매우 장엄하다/광채 가운데서’라는 의미를 뒷받침하는 동계어 표현을 전합니다.
    reason: textual_variant
