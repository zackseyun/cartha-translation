base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/043/010.yaml
  text: At his word the decree stands[b][a], and they do not fail in their watches.
  footnotes:
  - marker: a
    text: Masada reads 'At the word of the Lord the decree stands,' making the divine subject explicit where the Cairo Geniza text is less explicit.
    reason: textual_variant
  - marker: b
    text: Or 'they do not grow weak in their stations'; the Hebrew verb is uncertain here, and the Greek parallel supports the sense of not slackening or failing.
    reason: lexical_alternative
translation:
  language: ko
  text: 하나님의 말씀으로 법도가 굳게 서고, 그들은 자기 파수 중에 약해지지 않습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 마사다 사본은 ‘주님의 말씀으로 법도가 선다’라고 읽어, 여기의 ‘하나님’ 대신 ‘주님’이라는 신명칭을 사용합니다.
    reason: textual_variant
  - marker: b
    text: 또는 ‘자기 파수 중에 쇠약해지지 않습니다.’ 히브리어 동사는 불확실하지만, 그리스어 병행문은 ‘약해지다’ 또는 ‘풀어지다’의 뜻을 뒷받침합니다. ‘파수’는 맡겨진 경계·근무 또는 정해진 자리의 비유입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בדבר
  english_pob_choice: At his word
  chosen_korean: 그의 말씀으로
  alternatives_korean:
  - 말씀에 따라
  - 그 말씀으로
  - 그의 말로
  lexicon: HALOT
  rationale: בְּ+דָּבָר는 ‘~에 의해/~으로’의 수단·기점 의미를 가질 수 있으므로, 주어를 직접 풀지 않되 신적 발화를 자연스럽게 살려 ‘그의 말씀으로’로 옮겼습니다.
- source_word: חק
  english_pob_choice: the decree
  chosen_korean: 법령
  alternatives_korean:
  - 규례
  - 칙령
  - 정해진 질서
  lexicon: HALOT
  rationale: 우주적 질서의 맥락에서 חק은 단순한 법 조항보다 이미 정해진 공적 규정을 가리키므로, 한국어에서는 ‘법령’이 권위와 정해짐을 가장 간결하게 드러냅니다.
- source_word: ולא ישח
  english_pob_choice: and they do not fail
  chosen_korean: 그들은 … 게을리하지 않습니다
  alternatives_korean:
  - 그들은 실패하지 않습니다
  - 그들은 약해지지 않습니다
  - 그들은 흐트러지지 않습니다
  lexicon: HALOT
  rationale: 히브리어 동형은 전승상 다소 불확실하지만, 병행 그리스어의 ‘약해지지 않다/풀어지지 않다’와 맥락상 ‘임무를 저버리지 않다’는 뜻이 핵심이어서, 기능적 의미를 살린 한국어로 옮겼습니다.
- source_word: באשמרותם
  english_pob_choice: in their watches
  chosen_korean: 자기 경비
  alternatives_korean:
  - 자기 경계
  - 자기 근무
  - 자기 파수
  lexicon: HALOT
  rationale: אשמרות는 ‘경계, 파수, 근무 교대’의 뜻을 가지며, 여기서는 천체들의 맡은 자리/순번을 가리키는 표현으로 읽혀 ‘자기 경비’가 현대 한국어에서 가장 자연스럽게 그 이미지를 전달합니다.
theological_decisions:
- issue: 본문에 암시된 신적 주어를 한국어 본문에 얼마나 드러낼지
  chosen_reading: ‘그의 말씀으로’로 두어 본문 안에서는 주어를 암시적으로 유지했습니다.
  alternative_readings:
  - ‘주님의 말씀으로’
  - ‘야훼의 말씀으로’
  rationale: 이 절의 히브리어 본문은 현재 형태상 명시적 ‘주님’ 표지가 약하므로, 본문은 암시를 유지하고 해석적 확정은 피했습니다. 다만 말씀의 권위는 신적 발화로 읽히므로 인칭대명사로 그 함의를 보존했습니다.
  doctrine_reference: 본문 비평 및 절제된 신적 주어 처리
