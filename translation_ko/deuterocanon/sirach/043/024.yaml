  text: Those who go down to the sea recount its far reaches[a]; when our ears hear[b], we are astonished.
  footnotes:
  - marker: a
    text: Greek reads 'its danger' instead of Hebrew 'its far reaches/extremity.' The main text follows the extant Hebrew witness; the Greek preserves an interpretive or variant reading focused on the sea's peril.
    reason: alternative_reading
  - marker: b
    text: The Hebrew says literally 'those who go down to the sea,' an idiom for seafarers.
    reason: cultural_note
translation:
  language: ko
  text: 바다를 항해하는 이들은[a] 그 바다의 끝을 이야기합니다[b]. 우리가 그 이야기를 들으면 놀랍니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘바다로 내려가는 이들’이라고 말하며, 바다를 항해하는 이들을 가리키는 관용적 표현입니다.
    reason: cultural_note
  - marker: b
    text: 그리스어는 ‘그 바다의 끝’ 대신 ‘그 바다의 위험’을 읽습니다. 본문은 현존 히브리어 증거를 따릅니다.
    reason: textual_variant
