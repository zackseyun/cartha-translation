base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/043/024.yaml
  text: Those who go down to the sea recount its far reaches[a]; when our ears hear[b], we are astonished.
  footnotes:
  - marker: a
    text: Greek reads 'its danger' instead of Hebrew 'its far reaches/extremity.' The main text follows the extant Hebrew witness; the Greek preserves an interpretive or variant reading focused on the sea's peril.
    reason: alternative_reading
  - marker: b
    text: The Hebrew says literally 'those who go down to the sea,' an idiom for seafarers.
    reason: cultural_note
translation:
  language: ko
  text: 바다로 내려가는 사람들은 바다의 끝을 이야기합니다[a]. 우리의 귀로 듣는다면, 우리는 놀랍니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 ‘바다의 끝’이 아니라 ‘그 바다의 위험’을 읽습니다. 본문은 현존 히브리어 증거를 따릅니다.
    reason: textual_variant
lexical_decisions:
- source_word: יורדי הים
  english_pob_choice: Those who go down to the sea
  chosen_korean: 바다로 내려가는 사람들
  alternatives_korean:
  - 바다로 가는 사람들
  - 바다로 나아가는 사람들
  - 바다를 항해하는 사람들
  lexicon: HALOT
  rationale: 히브리어의 관용구를 살리되, 현대 한국어에서 자연스럽게 읽히도록 옮겼습니다. 단순 직업명인 ‘선원’으로 평탄화하지 않았습니다.
- source_word: קצהו
  english_pob_choice: its far reaches
  chosen_korean: 바다의 끝
  alternatives_korean:
  - 바다의 끝자락
  - 바다의 극한
  - 바다의 위험
  lexicon: HALOT
  rationale: 히브리어는 바다의 ‘끝/극한/경계’를 뜻하므로, 본문 흐름에 맞게 ‘끝’으로 옮겼습니다. 그리스어의 ‘위험’은 대조적 독법으로 처리했습니다.
- source_word: לשמע אזנינו
  english_pob_choice: when our ears hear
  chosen_korean: 우리의 귀로 듣는다면
  alternatives_korean:
  - 우리 귀가 들으면
  - 귀로 듣게 되면
  - 듣는 순간
  lexicon: HALOT
  rationale: 직역하면 ‘우리 귀의 들음에/듣기에’에 가까운 관용 표현이므로, 청각적 강조를 살리면서도 한국어답게 정리했습니다.
- source_word: נשתומם
  english_pob_choice: we are astonished
  chosen_korean: 우리는 놀랍니다
  alternatives_korean:
  - 우리는 놀라게 됩니다
  - 우리는 경탄합니다
  - 우리는 경악합니다
  lexicon: HALOT
  rationale: 문맥상 충격과 경탄 사이의 반응을 나타내므로, 과도하게 강하거나 약하지 않은 ‘놀랍니다’를 택했습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행본문의 차이
  chosen_reading: 본문은 히브리어의 ‘바다의 끝’을 따르고, 그리스어의 ‘위험’ 독법은 주석적 대안으로 보존합니다.
  alternative_readings:
  - 바다의 위험
  - 바다의 위태로움
  - 바다의 경계
  rationale: 이 절은 히브리어 본문과 그리스어가 서로 다른 뉘앙스를 보이므로, 주 본문은 현존 히브리어 증거를 따르되 번역 노트로 대조 독법을 남기는 것이 가장 투명합니다.
  doctrine_reference: 본문비평 / 사본 전승
