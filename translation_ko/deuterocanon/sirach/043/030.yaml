translation:
  language: ko
  text: 주님을 높이는 이들아, 너희가 할 수 있는 만큼 소리를 높이십시오. 아직도 더 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 ‘그는 아직도 더 뛰어나신다’는 뜻을 분명히 하여, 주님이 모든 찬양을 넘어선다는 점을 드러냅니다. 히브리어는 더 짧게 ‘아직도 더 있습니다’라고 합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: מגדלי ה'
  english_pob_choice: As you exalt the Lord
  chosen_korean: 주님을 높이는 이들아
  alternatives_korean:
  - 주님을 크게 하는 이들아
  - 주님을 찬양하는 이들아
  - 주님을 높이시는 분들아
  lexicon: HALOT
  rationale: 히브리어 분사형은 단순한 호칭보다 ‘주님을 높이다’라는 행위를 하는 이들을 부르며, 영어 POB의 동적 처리에 맞춰 한국어에서는 자연스러운 호격으로 옮겼습니다.
- source_word: הרימו קול
  english_pob_choice: lift up your voice
  chosen_korean: 소리를 높이십시오
  alternatives_korean:
  - 목소리를 높이십시오
  - 소리를 들어 올리십시오
  - 목소리를 높여 외치십시오
  lexicon: HALOT
  rationale: 관용구적으로 ‘소리를 높이다’가 히브리어의 신체적 이미지와 찬양의 맥락을 가장 자연스럽게 반영합니다.
- source_word: בכל תוכלו
  english_pob_choice: as much as you can
  chosen_korean: 너희가 할 수 있는 만큼
  alternatives_korean:
  - 너희가 능한 만큼
  - 너희의 힘이 닿는 만큼
  - 너희가 가능한 만큼
  lexicon: HALOT
  rationale: 능력의 한계에 따라 하라는 뜻이므로, 한국어에서는 ‘할 수 있는 만큼’이 의미를 가장 직접적으로 전달합니다.
- source_word: כי יש עוד
  english_pob_choice: for there is still more
  chosen_korean: 아직도 더 있습니다
  alternatives_korean:
  - 아직 더 있습니다
  - 여전히 더 있습니다
  - 더 남아 있습니다
  lexicon: HALOT
  rationale: 히브리어는 짧고 압축적이라 ‘더 있다’는 여운을 남기며, 영어 POB의 주해적 확장을 과도하게 따라가지 않고 간결함을 살렸습니다.
theological_decisions:
- issue: 마지막 절의 ‘더 있음’이 무엇을 가리키는지 명시할지 여부
  chosen_reading: ‘아직도 더 있습니다’로 남겨, 하나님을 찬양해도 그분의 크심이 다 소진되지 않음을 암시하게 했습니다.
  alternative_readings:
  - ‘그분은 아직도 더 높으십니다’
  - ‘그분은 이보다 더 크십니다’
  rationale: 히브리어 본문은 의도적으로 절제되어 있고, 그리스어는 더 분명히 확장합니다. 본문 차이를 지우지 않기 위해 한국어 본문은 간결하게 두고, 과잉 해석을 피했습니다.
  doctrine_reference: 원문 우선 원칙; 본문이 가진 간결한 신학적 긴장을 보존
