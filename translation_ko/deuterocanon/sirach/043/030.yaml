  text: As you exalt the Lord[a], lift up your voice as much as you can, for there is still more.
  footnotes:
  - marker: a
    text: 'Greek: ''for he surpasses still,'' making explicit that the Lord exceeds all praise. The Hebrew is shorter: ''for there is still more.'''
