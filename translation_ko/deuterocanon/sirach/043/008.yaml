base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/043/008.yaml
  text: Month by month it renews itself—how awe-inspiring it is in its changing! A vessel of the host on high[c][b][a], from the expanse of the sky is its shining.
  footnotes:
  - marker: a
    text: 'Greek parallel: ''Month by month, according to its name, it increases wondrously in change.'' This reflects a different wording or interpretation than the extant Hebrew ''Month by month it renews itself.'''
    reason: alternative_reading
  - marker: b
    text: The Hebrew of the second half is difficult and likely textually uncertain. Masada preserves related wording that differs from the Cairo Geniza text in this line; the general sense is that the moon belongs to the heavenly host and shines from the sky.
    reason: textual_variant
  - marker: c
    text: Or 'harp of the heights.' The Hebrew phrase is unusual and may be metaphorical rather than literal.
    reason: lexical_alternative
translation:
  language: ko
  text: 달마다 그것은 새로워집니다. 변화할 때에 얼마나 경외로운지요! 하늘의 군대의 한 기구, 높은 곳의 수금이요[a][b][c], 궁창의 펼쳐진 공간에서 그 광채가 빛납니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 평행문은 “달은 그 이름에 따라 변화 속에서 놀랍게 자란다”라고 읽으며, 현존 히브리어의 “달마다 그것은 새로워진다”와 다른 전승 또는 해석을 반영합니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어 후반부는 난해하며 본문 전승상 불확실합니다. 마사다 사본에는 이 행과 관련된, 카이로 게니자 본문과 다른 표현이 보존되어 있습니다. 일반적 의미는 달이 하늘의 군대에 속하며 하늘에서 빛난다는 것입니다.
    reason: textual_variant
  - marker: c
    text: 또는 “높은 곳의 하프.” 히브리어 표현은 이례적이며, 문자적 진술보다 비유적 이미지일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חדש בחדשו הוא מתחדש
  english_pob_choice: Month by month it renews itself
  chosen_korean: 한 달마다 새로워집니다
  alternatives_korean:
  - 달마다 새로워집니다
  - 그 달에 새로워집니다
  lexicon: HALOT
  rationale: חדש와 מתחדש의 반복을 살려 달의 주기적 갱신을 간결하게 나타냈습니다. 한국어에서는 자연스러운 시간 부사구로 옮겨, 원문의 의미를 과도하게 해석하지 않으면서도 현대적인 문체를 유지했습니다.
- source_word: מה נורא
  english_pob_choice: how awe-inspiring
  chosen_korean: 얼마나 놀라운지 모릅니다
  alternatives_korean:
  - 얼마나 두려운지 모릅니다
  - 얼마나 경외로운지 모릅니다
  lexicon: HALOT
  rationale: נורא의 핵심은 단순한 공포보다 경외를 일으키는 놀라움입니다. 시적 감탄을 살리면서 현대 한국어 독자에게 자연스럽게 들리는 표현을 택했습니다.
- source_word: כלי צבא
  english_pob_choice: A vessel of the host
  chosen_korean: 하늘의 군대의 그릇이요
  alternatives_korean:
  - 하늘의 군대의 도구이요
  - 군대의 그릇이요
  lexicon: HALOT
  rationale: כלי는 그릇/도구/기구로 폭넓게 쓰이지만, 여기서는 천체를 하늘의 군대에 속한 하나의 대상물로 묘사하는 문맥을 따라 '그릇'을 유지했습니다. צבא는 군대/무리의 뜻이 있어 '하늘의 군대'로 옮겼습니다.
- source_word: מרצף רקיע מזהירתו
  english_pob_choice: from the expanse of the sky is its shining
  chosen_korean: 하늘의 넓은 궁창에서 그 빛이 빛납니다
  alternatives_korean:
  - 궁창의 넓은 펼침에서 그 광채가 빛납니다
  - 하늘의 펼쳐진 공간에서 그 밝음이 빛납니다
  lexicon: HALOT
  rationale: רקיע을 '궁창'으로, מזהירתו를 '그 빛이 빛납니다'로 옮겨 원문의 광휘 이미지를 살렸습니다. מרצף은 문맥상 난해하므로 의미를 지나치게 확정하지 않고 출처가 드러나는 범위 안에서 자연스럽게 풀었습니다.
theological_decisions:
- issue: 히브리어 난구와 그리스어 평행문의 관계
  chosen_reading: 주 본문은 현존 히브리어를 따르되, 어려운 후반부는 달의 천상적 이미지가 드러나도록 너무 단정하지 않고 옮겼습니다.
  alternative_readings:
  - 그리스어를 따라 '이름에 따라 달마다 놀랍게 자랍니다'로 옮김
  - 후반부를 평이한 '하늘의 군대 중 하나'로 완전히 평준화함
  rationale: 이 본문은 히브리어가 남아 있지만 후반부가 본질적으로 난해하므로, POB의 원칙에 따라 히브리어를 우선하고 그리스어 평행문은 대안으로만 보존했습니다. 불확실한 부분을 과하게 해소하면 원문이 지닌 시적 긴장이 사라집니다.
  doctrine_reference: 'PHILOSOPHY.md: 히브리어가 현존할 때는 히브리어 우선, 난구는 과도하게 해소하지 말 것.'
