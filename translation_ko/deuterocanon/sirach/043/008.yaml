  source_fidelity: 첫 행은 히브리어 חדש/מתחדש의 반복과 변화의 이미지를 대체로 잘 옮겼습니다. 그러나 후반부에서 נבלי מרום(‘높은 곳의 수금/하프’)이 본문 번역에서 누락되어, 난해한 명사 연쇄를 보존해야 한다는 원칙에 미치지 못합니다. כלי를 일상적 용기인 ‘그릇’으로 옮긴 것도 이 천상·악기 비유의 문맥에서는 부정확하게 들립니다.
