  terminology: צבא는 문맥상 ‘하늘의 군대’ 또는 ‘천상 군대’로 옮길 수 있습니다. כלי는 여기서 ‘그릇’보다 ‘기구’가 적절합니다. 누락된 נבלי는 ‘수금’으로 옮기고, 하프라는 대안을 각주로 남깁니다. רקיע는 ‘궁창’, מזהירתו는 ‘그 광채’로 처리했습니다.
