base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/043/007.yaml
  text: From them come the appointed time and the fixed seasons by statute[b][a], and the work he desired is in its cycle.
  footnotes:
  - marker: a
    text: Hebrew is difficult in the second line. The Cairo Geniza text reads approximately, 'and the desired thing/work ... in its cycle.' The Greek parallel reads, 'From the moon is the sign of a festival, a luminary waning at completion.'
    reason: alternative_reading
  - marker: b
    text: Masada scroll reads, 'for great is the Lord who made it,' where the Cairo Geniza text has a different and more difficult wording.
    reason: textual_variant
translation:
  language: ko
  text: 그것들로부터 정한 때와 법으로 정해진 절기가 나오며, 그것의 원하신 일은 그 순환 안에 있습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 둘째 행이 어렵습니다. 카이로 게니자 본문은 대략 ‘그리고 원하는 것/일이 … 그 순환 안에’로 읽히며, 그리스어 평행본문은 ‘달로부터 절기의 표지가 나오며, 완성될 때 줄어드는 광명체’라고 읽습니다.
    reason: alternative_reading
  - marker: b
    text: 마사다 두루마리는 ‘그것을 만드신 주님은 크시다’로 읽으며, 카이로 게니자 본문은 더 어렵고 다른 표현을 보입니다.
    reason: textual_variant
lexical_decisions:
- source_word: בם
  english_pob_choice: From them come
  chosen_korean: 그것들로부터 나오며
  alternatives_korean:
  - 그것들 안에
  - 그것들에 의하여
  lexicon: HALOT
  rationale: ב의 전치 관계를 시적 압축에 맞게 풀어, 천체들에서 절기와 때가 나온다는 뜻을 자연스러운 한국어로 드러냈습니다.
- source_word: מועד
  english_pob_choice: appointed time
  chosen_korean: 정한 때
  alternatives_korean:
  - 절기
  - 정해진 시기
  - 기한
  lexicon: HALOT
  rationale: מועד는 때와 절기를 함께 가리킬 수 있지만, 여기서는 זמני와 병렬을 이루므로 달력적 의미를 살려 ‘정한 때’로 옮겼습니다.
- source_word: וזמני חוק
  english_pob_choice: the fixed seasons by statute
  chosen_korean: 법으로 정해진 절기
  alternatives_korean:
  - 규례로 정한 절기
  - 법도에 따른 시기
  - 정해진 절기들
  lexicon: HALOT
  rationale: זמנים과 חוק의 규범적·반복적 의미를 함께 살리기 위해, 단순한 시간표시가 아니라 정해진 절기를 뜻하는 표현으로 옮겼습니다.
- source_word: וחפץ עשיו
  english_pob_choice: the work he desired
  chosen_korean: 그것의 원하신 일
  alternatives_korean:
  - 그가 바라신 일
  - 원하신 일
  - 그의 뜻하신 일
  lexicon: HALOT
  rationale: 히브리어 본문이 어려운 대목이므로, חפץ의 ‘원하다/기뻐하다’의 뜻을 살리되 문맥상 대상의 작업·일을 가리키는 표현으로 유지했습니다.
- source_word: בתקופתו
  english_pob_choice: in its cycle
  chosen_korean: 그 순환 안에
  alternatives_korean:
  - 그 주기 안에
  - 그 순환 속에
  - 그때마다
  lexicon: HALOT
  rationale: תקופה의 순환·주기적 운동 의미를 따라, 천체의 반복적 운행을 드러내는 ‘순환’으로 옮겼습니다.
theological_decisions:
- issue: 둘째 행의 난해한 히브리어와 그리스어 평행본문의 관계
  chosen_reading: 본문은 천체의 질서에서 정한 때와 절기가 나오는 창조 질서를 말하는 것으로 유지했습니다.
  alternative_readings:
  - 그리스어 평행본문처럼 달이 절기의 표지가 된다는 뜻으로 더 구체화할 수 있습니다.
  - 마사다 판본처럼 ‘그것을 만드신 주님은 크시다’라는 독법도 가능합니다.
  rationale: 카이로 게니자 히브리어는 어렵고, 그리스어는 축제 표지로서의 달을 분명히 말하므로, 주석으로 변이를 남기되 본문은 히브리어의 난해함을 과도하게 해소하지 않았습니다.
  doctrine_reference: 원문 우선과 본문 변이의 정직한 보존
