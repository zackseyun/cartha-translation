base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/043/019.yaml
  text: He spreads frost like salt[c][b][a], and it sprouts like palm shoots.
  footnotes:
  - marker: a
    text: Hebrew Kahana reads 'mist/frost ... dwells like salt'; the Greek parallel reads 'he pours frost like salt upon the earth.' The line is textually uncertain, and the translation reflects the shared sense rather than a strictly literal rendering of the damaged Hebrew.
    reason: textual_variant
  - marker: b
    text: The final image may also be rendered 'and it blossoms like palm blossoms' or, with the Greek parallel in view, may refer to frost hardening into pointed icy formations.
    reason: lexical_alternative
  - marker: c
    text: Masada preserves a different reading in this part of the verse than the Cairo Geniza text represented by Kahana, indicating textual disturbance in the Hebrew tradition here.
    reason: textual_variant
translation:
  language: ko
  text: 그는 서리를 소금처럼 퍼뜨리시며, 그것은 종려나무 싹처럼 돋아납니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 전승은 이 대목에서 본문이 불안정하며, 그리스어 평행본문은 하나님이 서리를 땅 위에 내리시는 장면으로 읽힙니다.
    reason: textual_variant
  - marker: b
    text: 마지막 이미지는 종려나무의 싹이나 꽃봉오리처럼 보이는 형상으로도, 그리스어를 따르면 얼어붙어 뾰족하게 솟은 형상으로도 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 카이로 게니자 계열의 히브리어 본문과 마사다 전승 사이에 차이가 있어, 이 절의 히브리어 전승은 세부적으로 흔들립니다.
    reason: textual_variant
lexical_decisions:
- source_word: כפור
  english_pob_choice: frost
  chosen_korean: 서리
  alternatives_korean:
  - 얼음서리
  - 상고대
  lexicon: HALOT
  rationale: כפור는 기상 현상으로서 ‘frost/hoarfrost’의 뜻이므로, 현대 한국어에서는 가장 자연스러운 ‘서리’가 적절합니다.
- source_word: כמלח
  english_pob_choice: like salt
  chosen_korean: 소금처럼
  alternatives_korean:
  - 소금같이
  - 소금과 같이
  lexicon: HALOT
  rationale: 히브리어의 פשוט한 비유를 그대로 살려, 서리가 소금에 비견되는 외형과 퍼짐을 자연스럽게 표현합니다.
- source_word: ישכון
  english_pob_choice: spreads
  chosen_korean: 퍼뜨리시며
  alternatives_korean:
  - 머무르십니다
  - 내려앉습니다
  - 퍼집니다
  lexicon: HALOT
  rationale: 문맥상 서리가 땅 위에 놓이는 장면이므로 ‘머무르다’보다 동작성을 살린 ‘퍼뜨리시며’가 한국어로 가장 자연스럽고, 영어 POB의 최종 수정본과도 잘 맞습니다.
- source_word: ויציץ
  english_pob_choice: it sprouts
  chosen_korean: 돋아납니다
  alternatives_korean:
  - 싹틉니다
  - 피어납니다
  - 자라납니다
  lexicon: HALOT
  rationale: צוץ의 식물적 이미지와 시적 평행을 살리면서, 얼음 결정이 위로 치솟는 느낌도 함께 전달하는 표현입니다.
- source_word: כתמר ציצים
  english_pob_choice: like palm shoots
  chosen_korean: 종려나무 싹처럼
  alternatives_korean:
  - 종려 싹처럼
  - 야자나무 싹처럼
  - 종려나무 꽃처럼
  lexicon: HALOT
  rationale: תמר는 ‘종려나무/야자나무’이지만, 한국어 성경 문맥에서는 ‘종려나무’가 가장 익숙하고, ציצים의 생장 이미지를 ‘싹’으로 옮기는 것이 영어 POB의 식물 비유를 잘 반영합니다.
theological_decisions:
- issue: 이 절의 첫 행은 본문 전승이 불안정하여 히브리어와 그리스어 병행 증거 사이에 차이가 있습니다.
  chosen_reading: 주어를 명시하지 않고 ‘그는…’으로 옮겨, 자연현상을 일으키시는 하나님을 가리키는 시적 문맥을 살리면서도 본문의 간결함을 유지했습니다.
  alternative_readings:
  - ‘서리를 소금처럼 퍼뜨립니다’처럼 주어를 더 직접적으로 드러내는 번역
  - ‘서리가 소금처럼 퍼집니다’처럼 비인칭적으로 옮기는 번역
  rationale: 히브리어의 텍스트 상태와 그리스어 평행본문을 함께 고려할 때, 이 장면은 하나님이 눈·서리·우박을 다스리시는 찬가의 일부입니다. 따라서 주어를 과도하게 보강하지 않되, 신적 행위를 암시하는 번역이 가장 적절합니다.
  doctrine_reference: 원문 우선 원칙; 전승 불안정 본문에서의 절제된 의미 보존
