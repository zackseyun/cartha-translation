  naturalness: ‘그분께서는 … 내려앉게 하시며, 그것이 … 돋아납니다’는 현대 표준어 합쇼체의 시적 문체로 자연스럽습니다. ‘그는’보다 ‘그분께서는’이 하나님을 가리키는 높임말 문맥에서 더 자연스럽고, 대명사의 지시도 분명합니다.
  terminology: ‘서리’, ‘소금처럼’, ‘종려나무’, ‘싹’은 적절합니다. 다만 마지막 명사 ציצים은 ‘싹’ 외에 ‘꽃봉오리/꽃’으로도 이해될 수 있으므로 각주에서 그 가능성과 그리스어의 뾰족한 얼음 형상을 계속 밝혀야 합니다. 본문비평 각주는 카하나의 실제 읽기와 그리스어 병행본문을 더 구체적으로 명시해야 합니다.
