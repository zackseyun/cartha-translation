base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/043/003.yaml
  text: At its shining it makes the world boil[b][a], and before its sword who can endure?
  footnotes:
  - marker: a
    text: Hebrew 'before its sword'; the Greek parallel reads 'before its burning/heat who will stand?' The main text keeps the Hebrew metaphor.
    reason: alternative_reading
  - marker: b
    text: The older Masada witness for this verse is fragmentary at this point; the Cairo Geniza Hebrew provides the main wording used here, with the Greek consulted as a control.
    reason: textual_variant
translation:
  language: ko
  text: 그 빛이 비칠 때 세상을 끓어오르게 하고, 그 칼 앞에 누가 버틸 수 있겠습니까?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘그 칼’로 읽지만, 그리스어 병행구는 ‘그 열기’로 읽습니다. 본문은 히브리어의 은유를 유지했습니다.
    reason: alternative_reading
  - marker: b
    text: 이 절의 더 오래된 마사다 히브리어 증인은 이 부분이 단편적입니다. 카이로 게니자 히브리어가 주된 문구를 제공하며, 그리스어는 대조 확인용으로 참고했습니다.
    reason: textual_variant
lexical_decisions:
- source_word: בהצהירו
  english_pob_choice: At its shining
  chosen_korean: 그 빛이 비칠 때
  alternatives_korean:
  - 그 빛이 밝아질 때
  - 그것이 빛날 때
  - 정오에
  lexicon: HALOT
  rationale: 히브리어는 시간표현보다 해의 강렬한 ‘비침/밝음’을 가리키므로, 한국어에서는 자연스러운 조건절로 옮기되 시간표현인 ‘정오에’는 본문의 직접 의미를 약화할 수 있어 피했습니다.
- source_word: ירתיח
  english_pob_choice: it makes ... boil
  chosen_korean: 세상을 끓어오르게 하고
  alternatives_korean:
  - 세상을 달아오르게 하고
  - 세상을 태우고
  - 세상을 끓게 하고
  lexicon: HALOT
  rationale: רתח의 강한 ‘끓다/끓어오르다’ 이미지를 살려, 단순한 ‘뜨겁게 하다’보다 생생한 동사형으로 표현했습니다.
- source_word: תבל
  english_pob_choice: the world
  chosen_korean: 세상
  alternatives_korean:
  - 세계
  - 땅
  - 거주하는 세상
  lexicon: HALOT
  rationale: תבל은 사람이 사는 세계라는 뜻을 포함하므로, 한국어에서는 자연스럽고 포괄적인 ‘세상’이 적절합니다.
- source_word: חרבו
  english_pob_choice: its sword
  chosen_korean: 그 칼
  alternatives_korean:
  - 그의 칼
  - 그 칼날
  - 그의 열기
  lexicon: HALOT
  rationale: 히브리어의 직설적 은유를 살려 ‘칼’을 유지했습니다. 영어 주석이 제시하듯 그리스어는 이를 열기/타오름으로 풀지만, 본문에서는 은유를 보존하는 것이 더 원문적입니다.
- source_word: מי יתכלכל
  english_pob_choice: who can endure?
  chosen_korean: 누가 버틸 수 있겠습니까?
  alternatives_korean:
  - 누가 견딜 수 있겠습니까?
  - 누가 살아남을 수 있겠습니까?
  - 누가 감당할 수 있겠습니까?
  lexicon: HALOT
  rationale: התכלכל은 압박 아래에서 자신을 지탱하고 버티는 뜻을 담으므로, 한국어에서는 일상적이면서도 강한 ‘버틸 수 있겠습니까?’가 가장 자연스럽습니다.
theological_decisions:
- issue: 히브리어의 ‘칼’ 은유를 그리스어의 ‘열기/타는 더위’로 완화할지 여부
  chosen_reading: 본문에는 ‘그 칼 앞에’로 유지했습니다.
  alternative_readings:
  - 그 뜨거움 앞에
  - 그 타는 더위 앞에
  rationale: 영어 POB가 밝혔듯 그리스어는 열기 이미지를 해석적으로 제시하지만, 히브리어가 보존하는 날카로운 은유를 지우지 않기 위해 직역에 가깝게 유지했습니다.
  doctrine_reference: 원문 은유 보존과 본문 비평의 우선순위
