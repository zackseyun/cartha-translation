  yaml_path: translation/deuterocanon/sirach/043/027.yaml
  text: 'We could say more than these[a], but there would be no end[b]; and the conclusion of the matter is: all is he.'
  footnotes:
  - marker: a
    text: Or, 'We could say many more things and still not reach the end.' The Greek parallel makes explicit the idea of speaking at length without exhausting the subject.
    reason: alternative_reading
  - marker: b
    text: 'Or, ''he is all'' or ''he is everything.'' The Hebrew is terse, and the Greek parallel supports a personal subject: ''he himself is the all.'''
    reason: lexical_alternative
translation:
  language: ko
  text: '우리가 이보다 더 많은 말을 할 수는 있겠지만[a], 끝이 없을 것입니다[b]. 그리고 이 일의 결론은 이렇습니다: 그는 전체이십니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘이와 같은 말들을 더 많이 해도 여전히 모자라지 않을 것이다.’ 그리스어 평행구는 길게 말해도 주제를 다 소진하지 못한다는 뜻을 분명히 보여 줍니다.
    reason: alternative_reading
  - marker: b
    text: 또는, ‘끝이 닿지 않을 것입니다.’ 히브리어는 매우 간결하며, 그리스어 평행구가 ‘끝에 이르지 못함’의 뜻을 뒷받침합니다.
    reason: alternative_reading
