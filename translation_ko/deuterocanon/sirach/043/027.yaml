  yaml_path: translation/deuterocanon/sirach/043/027.yaml
  text: 'We could say more than these[a], but there would be no end[b]; and the conclusion of the matter is: all is he.'
  footnotes:
  - marker: a
    text: Or, 'We could say many more things and still not reach the end.' The Greek parallel makes explicit the idea of speaking at length without exhausting the subject.
    reason: alternative_reading
  - marker: b
    text: 'Or, ''he is all'' or ''he is everything.'' The Hebrew is terse, and the Greek parallel supports a personal subject: ''he himself is the all.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 우리가 이와 같은 것들을 더 많이 말할 수는 있겠지만[a], 끝에 이르지는 못할 것입니다[b]. 말의 결론은 이것입니다. 그분이 모든 것이십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘우리가 더 많은 말을 해도 끝에 이르지 못할 것이다.’ 그리스어 평행구는 길게 말해도 주제를 다 소진하지 못한다는 뜻을 분명히 보여 줍니다.
    reason: alternative_reading
  - marker: b
    text: 또는, ‘끝이 없을 것입니다.’ 히브리어는 매우 간결하며, 그리스어 평행구는 ‘끝에 이르지 못함’의 뜻을 뒷받침합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: עוד כאלה
  english_pob_choice: more like these
  chosen_korean: 이보다 더 많은 말
  alternatives_korean:
  - 이런 것들보다 더한 것
  - 이와 같은 것들을 더
  lexicon: HALOT
  rationale: 히브리어는 같은 종류의 항목을 더하는 뜻이며, 문맥상 지혜와 창조를 길게 말할 수 있다는 의미이므로 자연스럽게 ‘이보다 더 많은 말’로 옮겼습니다.
- source_word: לא נוסף
  english_pob_choice: there would be no end
  chosen_korean: 끝이 없을 것입니다
  alternatives_korean:
  - 더해질 수 없을 것입니다
  - 끝에 이르지 못할 것입니다
  lexicon: HALOT
  rationale: 직역하면 어색한 표현이지만, 그리스어 평행구가 말의 한계에 이르지 못함을 분명히 하므로 ‘끝이 없을 것입니다’로 의미를 살렸습니다.
- source_word: וקץ דבר
  english_pob_choice: the conclusion of the matter
  chosen_korean: 이 일의 결론
  alternatives_korean:
  - 말의 끝
  - 이 말의 끝맺음
  lexicon: HALOT
  rationale: קץ는 ‘끝/결론’, דבר는 ‘말, 일, 사안’의 뜻이어서, 찬양의 종결부라는 문맥을 따라 ‘이 일의 결론’으로 옮겼습니다.
- source_word: הוא הכל
  english_pob_choice: all is he / he is the whole
  chosen_korean: 그는 전체이십니다
  alternatives_korean:
  - 그는 모든 것입니다
  - 그는 전부이십니다
  lexicon: HALOT
  rationale: 히브리어 הכל은 ‘전체, 모두’이며, 그리스어도 인칭 주어를 지지하므로 ‘그는 전체이십니다’로 압축된 총체적 진술을 보존했습니다.
