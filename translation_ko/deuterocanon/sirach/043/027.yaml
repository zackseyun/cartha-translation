  naturalness: ‘그는 전체이십니다’는 현대 표준 한국어에서 부자연스럽고 ‘전체’가 가리키는 바도 불명확합니다. ‘그분이 모든 것이십니다’는 압축된 표현을 유지하면서도 자연스럽습니다. ‘이 일의 결론’은 דבר의 말/담화의 종결이라는 문맥보다 다소 좁습니다.
  terminology: 하나님을 가리키는 인칭 주어에는 문맥상 ‘그분’과 높임 서술 ‘이십니다’를 사용하는 것이 합쇼체에 적절합니다. ‘모든 것’은 הכל의 총체성을 보존하며, 교리적으로 설명을 덧붙이지 않습니다.
