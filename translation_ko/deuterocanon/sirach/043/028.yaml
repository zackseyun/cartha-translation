  text: Let us still magnify him[a], for we cannot search him out; and he is greater than all his works.
  footnotes:
  - marker: a
    text: Hebrew literally, 'Let us magnify/speak further, for we cannot search out'; the object of 'search out' is implicit. The Greek parallel makes the reference to God explicit in sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 우리는 여전히 그분의 위대하심을 높이 찬양해야 합니다[a]. 우리는 그분을 다 헤아려 알 수 없고, 그분은 그분의 모든 일보다 더 크십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘더욱 크게 하자/찬양하자’에 가깝고, ‘헤아려 알 수 없다’의 목적어는 생략되어 있습니다. 그리스어 평행본문도 하나님을 가리키는 뜻을 분명히 해 줍니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נגדלה עוד
  english_pob_choice: Let us still speak of his greatness
  chosen_korean: 우리는 여전히 그분의 위대하심을 높이 찬양해야 합니다
  alternatives_korean:
  - 우리는 여전히 그분을 크게 찬양해야 합니다
  - 우리는 더더욱 그분을 높여야 합니다
  - 우리는 계속 그분의 위대하심을 말해야 합니다
  lexicon: HALOT
  rationale: 히브리어는 גדל 계열의 공동체적 권고를 나타내므로, 한국어에서는 ‘찬양하다’보다 의미를 더 직접 드러내는 ‘위대하심을 높이 찬양하다’로 옮겨 공동체적 호응과 동작성을 살렸습니다.
- source_word: כי לא נחקור
  english_pob_choice: for we cannot search him out
  chosen_korean: 우리는 그분을 다 헤아려 알 수 없고
  alternatives_korean:
  - 우리는 그분을 다 조사해 알 수 없고
  - 우리는 그분을 다 파헤칠 수 없고
  - 우리는 그분을 끝까지 찾아낼 수 없고
  lexicon: HALOT
  rationale: חקר는 ‘탐구하다, 샅샅이 살피다’의 뜻이므로, 한국어에서는 신학적으로도 자연한 ‘헤아려 알다’로 옮겨 인간 인식의 한계를 보존했습니다.
- source_word: והוא גדול מכל מעשיו
  english_pob_choice: and he is greater than all his works
  chosen_korean: 그분은 그분의 모든 일보다 더 크십니다
  alternatives_korean:
  - 그분은 그분의 모든 일보다 크십니다
  - 그분은 그가 행하신 모든 것보다 더 크십니다
  - 그분은 모든 그분의 일보다 크십니다
  lexicon: HALOT
  rationale: 비교 구문은 ‘더 크다’로 분명히 드러내야 하므로, ‘greater’의 비교 의미를 살려 ‘더 크십니다’로 번역했습니다. מעשים는 여기서 하나님의 행하심과 창조적 일 모두를 포괄할 수 있어 ‘모든 일’이 적절합니다.
theological_decisions:
- issue: 히브리어의 생략된 목적어를 한국어에서 어떻게 처리할 것인가
  chosen_reading: 문맥상 대상은 하나님 자신이므로, ‘그분을 다 헤아려 알 수 없고’로 목적어를 보충했습니다.
  alternative_readings:
  - 목적어를 생략한 채 ‘헤아릴 수 없고’로 둘 수도 있습니다
  - 보다 추상적으로 ‘그분의 깊이를 다 알 수 없고’로 옮길 수도 있습니다
  rationale: 히브리어는 목적어를 명시하지 않지만, 앞뒤 문맥과 그리스어 평행본문이 하나님을 가리키므로 한국어에서는 이해를 돕기 위해 목적어를 드러내는 편이 더 충실합니다.
  doctrine_reference: 'DOCTRINE.md: 원문이 허락하는 범위에서만 보충하고, 문맥이 지시하는 대상을 명확히 한다.'
