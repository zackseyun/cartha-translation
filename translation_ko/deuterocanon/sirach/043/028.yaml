  naturalness: ‘우리는 여전히 … 찬양해야 합니다’는 청유의 호소를 의무 진술로 바꾸며, ‘위대하심을 높이 찬양하다’는 다소 중복됩니다. ‘우리는 더욱 그분을 찬양합시다’는 현대 표준어 합쇼체에서 자연스럽고 예배·지혜문학의 권고 어조에도 맞습니다.
