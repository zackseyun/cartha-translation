translation:
  language: ko
  text: 그곳에는 그가 이루신 놀라운 일들의 경이와 온갖 생물의 다양함과 큰 바다 생물들이 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 말미는 난해하며, 문자적으로는 ‘그리고 큰/강한 …’ 정도로 읽힙니다. 그리스어 병행구는 ‘바다 생물들의 창조’라고 읽으며, 이것이 문맥상 의도된 뜻일 가능성이 큽니다.
    reason: source_note
lexical_decisions:
- source_word: שם
  english_pob_choice: There are
  chosen_korean: 거기에는 …이 있습니다
  alternatives_korean:
  - 거기에는 …이 있습니다
  - 그곳에는 …이 있습니다
  - 거기 있다
  lexicon: HALOT
  rationale: 히브리어 שם의 위치 부사적 의미를 살리면서 한국어에서는 존재를 자연스럽게 드러내기 위해 ‘거기에는 …이 있습니다’로 옮겼습니다.
- source_word: פלאות תמהי מעשהו
  english_pob_choice: the wonders of his marvelous works
  chosen_korean: 그의 놀라운 일의 경이로움
  alternatives_korean:
  - 그의 놀라운 행위의 경이로움
  - 그의 기이한 일들의 놀라움
  - 그의 경이로운 일의 경이
  lexicon: HALOT
  rationale: פלאות와 תמהי가 겹쳐서 ‘놀라움/경이로움’의 중첩을 이루므로, 이를 평평하게 풀기보다 중첩된 감탄을 살려 ‘경이로움’으로 옮겼습니다.
- source_word: מין כל חי
  english_pob_choice: every kind of living thing
  chosen_korean: 온갖 살아 있는 것들
  alternatives_korean:
  - 모든 살아 있는 것들의 종류
  - 모든 생물의 각종
  - 온갖 살아 있는 피조물
  lexicon: HALOT
  rationale: מין의 ‘종류/부류’와 כל חי의 포괄성을 함께 살리되, 현대 한국어에서 자연스러운 분류 표현으로 ‘온갖 살아 있는 것들’이라 옮겼습니다.
- source_word: וגבורות רבה
  english_pob_choice: the great sea-creatures
  chosen_korean: 큰 바다짐승들
  alternatives_korean:
  - 큰 바다괴물들
  - 큰 바다생물들
  - 강력한 바다짐승들
  lexicon: HALOT
  rationale: 히브리어 말미는 본문상 난해하지만, 병행하는 그리스어 κτίσις κητῶν이 바다 생물을 가리키므로 POB의 해석을 따라 ‘바다짐승들’로 옮겼습니다.
theological_decisions:
- issue: 난해한 히브리어 말미를 그리스어 병행구로 해석할지 여부
  chosen_reading: 마지막 구절을 바다의 큰 피조물에 대한 언급으로 읽었습니다.
  alternative_readings:
  - 큰 힘들이
  - 큰 강한 것들
  - 많은 능력들
  rationale: 히브리어는 압축적이고 의미가 불분명하지만, 그리스어 병행구가 ‘바다짐승/바다 생물의 창조’를 분명히 제시하므로 문맥적 의미를 드러내는 쪽이 더 충실합니다.
  doctrine_reference: 'Ben Sira 번역 원칙: 보존된 히브리어를 우선하되, 현존하는 그리스어 병행구를 실제 번역 입력으로 사용해 난해한 구절을 해명한다.'
