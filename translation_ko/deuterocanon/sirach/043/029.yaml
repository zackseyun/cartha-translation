translation:
  language: ko
  text: 주님은 매우, 매우 두려우신 분이시며, 그의 말씀은 놀랍습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 병행본은 ‘그의 다스림은 놀랍다’(또는 ‘그의 통치는 놀랍다’)로 달리 읽습니다. 현존 히브리어는 ‘그의 말씀은 놀랍다’라고 전합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: נורא
  english_pob_choice: awesome
  chosen_korean: 두려우신
  alternatives_korean:
  - 경외롭게 하시는
  - 경외로운
  - 무서우신
  lexicon: HALOT
  rationale: 히브리어 נורא는 단순한 공포가 아니라 경외와 두려움을 함께 불러일으키는 성격을 가리키므로, 현대 한국어에서는 ‘두려우신’이 그 긴장을 가장 직접적으로 살립니다.
- source_word: ה'
  english_pob_choice: The Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주
  - 주인
  lexicon: project default / divine title
  rationale: 축약형 ה'는 하나님의 이름을 가리키는 표지이므로, 한국어에서는 경외를 담아 ‘주님’으로 옮겼습니다.
- source_word: מאד מאד
  english_pob_choice: exceedingly
  chosen_korean: 매우, 매우
  alternatives_korean:
  - 지극히
  - 극히
  - 대단히
  lexicon: HALOT
  rationale: 겹친 מאד의 반복을 그대로 살려 강한 강조를 보존했습니다. ‘매우, 매우’는 반복 구조를 드러내면서도 현대 문장으로 자연스럽습니다.
- source_word: ונפלאות דבריו
  english_pob_choice: and his words are wondrous
  chosen_korean: 그의 말씀은 놀랍습니다
  alternatives_korean:
  - 그의 말씀은 경이롭습니다
  - 그의 말은 놀랍습니다
  lexicon: HALOT
  rationale: 히브리어 דבריו는 직역하면 ‘그의 말씀들/말씀’이며, 문맥상 야훼의 발화와 선언을 가리키므로 ‘말씀’으로 옮겼습니다. נפלאות는 ‘놀랍습니다’로 자연스럽게 처리했습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행본의 차이
  chosen_reading: 본문은 히브리어의 ‘그의 말씀은 놀랍습니다’를 따르고, 그리스어의 ‘그의 다스림/권세는 놀랍습니다’는 본문이 아닌 대조 자료로 남깁니다.
  alternative_readings:
  - 그의 다스림은 놀랍습니다
  - 그의 권세는 놀랍습니다
  rationale: 이 절에서는 현존 히브리어가 구체적으로 ‘말씀’을 전하므로 본문 우선 원칙에 따라 이를 주본문으로 유지했습니다. 다만 그리스어는 다른 전승을 보여 주므로 의미 차이를 숨기지 않도록 별도 주석으로 보존합니다.
  doctrine_reference: Original-language primacy over translation tradition; preserve textual tension rather than harmonize it
