  text: The Lord is exceedingly awesome[a], and his words are wondrous.
  footnotes:
  - marker: a
    text: 'Greek parallel: ''and his dominion is wondrous'' (or ''his rule is marvelous''), differing from the extant Hebrew ''and his words are wondrous.'''
