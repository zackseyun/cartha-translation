base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/043/012.yaml
  text: He encircled the horizon in his glory[c][b][a], and the hand of God stretched out in his majesty.
  footnotes:
  - marker: a
    text: 'Greek parallel: ''He encircled the heaven with a circle of glory.'' The Hebrew reads ''the statute,'' which may reflect a different underlying text or a difficult poetic expression.'
    reason: alternative_reading
  - marker: b
    text: Hebrew has singular 'the hand of God'; Greek parallel has plural 'hands of the Most High.'
    reason: textual_variant
  - marker: c
    text: Masada preserves only a fragment here ('... in his glory'), while the Cairo Geniza text supplies the fuller wording used for the main translation.
    reason: textual_variant
translation:
  language: ko
  text: 그는 그의 영광 안에서 지평선을 둘러싸셨고, 하나님의 손이 그의 위엄 안에서 그것을 펼치셨습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 병행본문은 “영광의 원으로 하늘을 둘러싸셨다”고 읽습니다. 히브리어는 “지평선/규정”으로 되어 있어, 다른 원문 전승이나 난해한 시적 표현을 반영하는 듯합니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어는 단수 ‘하나님의 손’이지만, 그리스어 병행본문은 ‘지극히 높으신 이의 손들’로 복수입니다.
    reason: textual_variant
  - marker: c
    text: 마사다 본문은 여기서 일부만 보존되어 있으며, 카이로 게니자 본문이 본역에 쓸 더 긴 표현을 제공합니다.
    reason: textual_variant
lexical_decisions:
- source_word: חוק
  english_pob_choice: the statute
  chosen_korean: 지평선
  alternatives_korean:
  - 정해진 경계
  - 규례
  - 법령
  lexicon: HALOT
  rationale: 히브리어 חוק은 본문에서 단순한 ‘규례’보다 원형적 경계·테두리의 뜻이 강해, 영어 POB의 초고와 후속 수정이 가리키는 의미를 따라 ‘지평선’으로 옮겼습니다.
- source_word: הקיפה
  english_pob_choice: encircled
  chosen_korean: 둘러싸셨고
  alternatives_korean:
  - 에워싸셨고
  - 둘러가셨고
  lexicon: HALOT
  rationale: 동사 הקיף는 둘러 감싸는 동작을 뜻하므로, 시적 문맥에서 자연스럽고 간결한 ‘둘러싸셨고’를 택했습니다.
- source_word: ויד אל
  english_pob_choice: and the hand of God
  chosen_korean: 하나님의 손이
  alternatives_korean:
  - 하나님의 손이
  - 전능자의 손이
  lexicon: HALOT
  rationale: אל은 여기서 일반적인 ‘신’이 아니라 하나님을 가리키는 문맥이므로, 한국어 성경 전통에 맞는 ‘하나님의 손’으로 옮겼습니다.
- source_word: נטתה
  english_pob_choice: stretched itself out
  chosen_korean: 펼치셨습니다
  alternatives_korean:
  - 뻗으셨습니다
  - 펴셨습니다
  - 펼치셨습니다
  lexicon: HALOT
  rationale: נטה의 ‘펼치다/뻗다’ 의미를 살리되 한국어에서 부자연스러운 재귀 표현을 피하고, 손의 동작을 생생하게 드러내는 ‘펼치셨습니다’를 택했습니다.
- source_word: בגבה
  english_pob_choice: in his majesty
  chosen_korean: 그의 위엄 안에서
  alternatives_korean:
  - 그의 존귀 안에서
  - 그의 높이 안에서
  - 그의 위엄 속에서
  lexicon: HALOT
  rationale: גבה/גובה는 높이와 존귀함을 함께 담지만, 찬양 문맥에서는 공간적 ‘높이’보다 ‘위엄’이 의미를 더 잘 전달합니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행본문의 차이
  chosen_reading: 본문은 히브리어 사본의 ‘지평선’과 단수 ‘하나님의 손’을 따르고, 그리스어의 ‘하늘’과 복수 ‘손들’은 주석적 변이로 보존합니다.
  alternative_readings:
  - 그는 영광의 하늘을 둘러싸셨고, 지극히 높으신 이의 손들이 그것을 펼치셨습니다.
  rationale: 시락서는 현존 히브리어를 우선하되, 그리스어 병행본문이 실제 번역 전승을 보여 주므로 본문을 덮어쓰지 않고 변이로만 기록하는 것이 가장 투명합니다.
  doctrine_reference: 'Sirach 번역 원칙: 현존 히브리어 우선, 병행 헬라어는 변이증거로 보조'
