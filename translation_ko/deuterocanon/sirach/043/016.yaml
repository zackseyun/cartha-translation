base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/043/016.yaml
  text: At the sound of his thunder the earth writhes[b][a]; the blasts of the north are storm and tempest.
  footnotes:
  - marker: a
    text: 'Greek parallel reads: ''and at his appearing the mountains will be shaken; at his will the south wind blows.'' This differs substantially from the extant Hebrew, whose second line speaks of the north''s blasts as storm and tempest.'
    reason: alternative_reading
  - marker: b
    text: The Hebrew verb for 'writhes' can also be rendered 'trembles' or 'shakes,' with an image of convulsive motion.
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 천둥 소리에 땅이 떨립니다[b][a]. 북쪽에서 불어오는 사나운 바람은 폭풍과 광풍입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 두 번째 행에서 ‘북쪽의 거센 바람들’을 말하지만, 그리스어 평행본문은 ‘그의 나타나심에 산들이 흔들리고, 그의 뜻에 남풍이 붑니다’라고 다르게 전합니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어 동사 יחיל은 ‘떨다’ 외에도 ‘흔들리다’, ‘몸부림치다’처럼 격렬한 움직임을 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: קול רעמו
  english_pob_choice: At the sound of his thunder
  chosen_korean: 그의 천둥 소리에
  alternatives_korean:
  - 그의 천둥의 소리에
  - 천둥 소리에
  lexicon: HALOT
  rationale: קול רעמו는 ‘천둥’의 들리는 소리를 가리키므로 ‘소리’로 풀어 자연스럽고, 소유격은 하나님께 귀속된 천둥임을 살리기 위해 유지했습니다.
- source_word: יחיל
  english_pob_choice: writhes
  chosen_korean: 떨립니다
  alternatives_korean:
  - 몸부림칩니다
  - 흔들립니다
  - 요동칩니다
  lexicon: HALOT
  rationale: יחיל은 떨림·요동·산고 같은 격렬한 움직임을 뜻하므로, 땅의 의인화된 반응을 살리면서도 한국어로는 ‘떨립니다’가 가장 자연스럽습니다.
- source_word: זלעפות צפון
  english_pob_choice: the blasts of the north
  chosen_korean: 북쪽의 거센 바람들
  alternatives_korean:
  - 북풍의 분출
  - 북쪽의 폭풍 바람
  lexicon: HALOT
  rationale: זלעפות은 거칠고 사나운 바람의 분출을 가리키므로 ‘거센 바람들’로 옮겨 폭력성과 복수를 함께 살렸습니다. צפון은 문자적으로 ‘북쪽’이지만 여기서는 기상적 배경을 띱니다.
- source_word: סופה וסערה
  english_pob_choice: storm and tempest
  chosen_korean: 폭풍과 폭우입니다
  alternatives_korean:
  - 폭풍과 광풍입니다
  - 소용돌이와 폭풍입니다
  lexicon: HALOT
  rationale: 두 항은 모두 격렬한 기상 현상을 가리키므로, 한국어에서 함께 읽히는 강한 날씨 표현으로 처리했습니다. 다만 원문의 폭력적 기상 이미지를 유지하기 위해 ‘폭풍’과 병렬을 이루게 했습니다.
theological_decisions:
- issue: 하나님께 귀속된 천둥의 소유격
  chosen_reading: ‘그의 천둥 소리’로 옮겨 천둥의 근원을 하나님께 돌렸습니다.
  alternative_readings:
  - ‘천둥 소리’
  - ‘그의 천둥의 소리’
  rationale: 본문의 소유격은 단순 자연현상이 아니라 하나님이 주권적으로 일으키시는 천둥임을 드러냅니다. 한국어에서는 반복된 소유격이 어색하므로 땅 쪽에는 소유격을 반복하지 않았습니다.
  doctrine_reference: 'Translation philosophy: source-language primacy with readable modern Korean'
