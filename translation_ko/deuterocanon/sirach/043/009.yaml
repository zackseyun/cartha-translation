  rationale: 원문의 장소구 במרומי אל을 ‘하나님의 높은 곳에서’로 바로 옮겨 불필요한 ‘안에서’ 및 관계절을 제거했습니다. תואר와 הדר의 어휘적 구별은 ‘아름다움’과 ‘장엄함’으로 유지했고, 단수 접미사를 보존하는 ‘그 빛’을 유지했습니다. 각주는 마사다와 게니자 사이의 이문 및 그리스어 평행본문의 역할을 정확히 기술하도록 보완했습니다.
