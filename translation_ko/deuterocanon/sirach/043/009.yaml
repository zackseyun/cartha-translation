  source_fidelity: 개정이 필요합니다. 본문의 ‘지극히 높은 곳에 계신 하나님 안에서’는 히브리어 בְּמְרוֹמֵי אֵל(‘하나님의 높은 곳들/높은 곳에서’)의 장소 표현을 하나님 ‘안에’라는 부자연스럽고 의미가 다른 표현으로 바꿉니다. 또한 ‘계신’은 원문에 없는 관계절을 보탭니다. ‘하나님의 높은 곳에서’가 원문의 אל과 장소 표현을 모두 자연스럽게 보존합니다.
  naturalness: ‘하나님 안에서 빛납니다’는 한국어에서 빛의 발광 장소로 자연스럽지 않습니다. ‘하나님의 높은 곳에서 빛납니다’는 현대 표준어 문어체로 자연스럽고, 지혜문학의 시적 격조도 유지합니다.
  terminology: תואר는 ‘아름다움’, הדר는 ‘장엄함’으로 구별하여 옮기는 것이 적절합니다. ‘영광’도 가능한 번역이나, כאן에서는 천체의 위엄 있고 찬란한 외관을 가리키므로 ‘장엄함’이 הדר의 의미를 더 직접적으로 살립니다. אל은 ‘하나님’으로 명시합니다.
