base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/043/009.yaml
  text: The splendor of the heavens and the majesty of the stars—its light shines brightly in the heights of God[a][b].
  footnotes:
  - marker: a
    text: Masada preserves a differing opening reading at this point ('... the beauty/splendor of heaven and the majesty of a star'), while the Cairo Geniza text reads 'The splendor of the heavens and the majesty of the stars.' The main text follows the Zone 1 Hebrew with the Greek parallel supporting a collective sense.
    reason: textual_variant
  - marker: b
    text: 'Greek parallel: ''beauty of heaven, glory of stars, an ornament giving light, in the heights the Lord.'' This supports the verse''s imagery of the heavenly lights as radiant adornment, though the main text follows the surviving Hebrew wording.'
    reason: alternative_reading
translation:
  language: ko
  text: 하늘의 아름다움과 별들의 영광은—그 빛이 지극히 높은 곳에 계신 하나님 안에서 빛납니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 전승은 ‘하늘의 아름다움과 별들의 영광’으로 읽히며, 그리스어 평행본문도 하늘의 아름다움과 별들의 영광이라는 집합적 의미를 뒷받침합니다.
    reason: source_note
  - marker: b
    text: 그리스어 평행본문은 ‘하늘의 아름다움, 별들의 영광, 빛을 비추는 장식물, 지극히 높은 곳의 주님’으로 이어져, 이 절의 핵심이 하늘의 광휘와 찬란한 장엄함에 있음을 보여 줍니다.
    reason: cross_reference
lexical_decisions:
- source_word: תואר שמים
  english_pob_choice: the splendor of the heavens
  chosen_korean: 하늘의 아름다움
  alternatives_korean:
  - 하늘의 광휘
  - 하늘의 빛나는 아름다움
  - 하늘의 장엄함
  lexicon: HALOT
  rationale: תואר는 단순한 형태보다 눈에 보이는 아름다움과 빛남을 가리키므로, 시적이면서도 자연스러운 ‘아름다움’으로 옮겼습니다.
- source_word: הדר כוכב
  english_pob_choice: the majesty of the stars
  chosen_korean: 별들의 영광
  alternatives_korean:
  - 별들의 장엄함
  - 별의 위엄
  - 별들의 광휘
  lexicon: HALOT
  rationale: הדר는 단순한 아름다움과 구별되는 위엄·장엄함의 뉘앙스가 있어, 한국어에서는 격조 있는 ‘영광’으로 살렸습니다.
- source_word: ואורו מזהיר
  english_pob_choice: its light shines brightly
  chosen_korean: 그 빛이 빛납니다
  alternatives_korean:
  - 그 빛이 밝게 비칩니다
  - 그 빛이 찬란히 빛납니다
  - 그 빛이 환하게 빛납니다
  lexicon: HALOT
  rationale: 히브리어는 ‘빛을 내다/눈부시게 빛나다’는 의미이므로, 과도한 부연 없이 동작을 살려 ‘빛납니다’로 옮기되 문맥상 충만한 발광을 유지했습니다.
- source_word: במרומי אל
  english_pob_choice: in the heights of God
  chosen_korean: 지극히 높은 곳에 계신 하나님 안에서
  alternatives_korean:
  - 하나님의 높은 곳에서
  - 하나님의 지극히 높은 곳에서
  - 지극히 높은 곳에서
  lexicon: HALOT
  rationale: אל을 생략하지 않고 하나님으로 드러내되, מקום 표현은 시적으로 ‘지극히 높은 곳’을 살려 원문의 높이를 보존했습니다.
theological_decisions:
- issue: אל의 신적 지시와 위치 표현의 결합
  chosen_reading: ‘지극히 높은 곳에 계신 하나님 안에서’로 옮겨, 하나님을 장소의 소유자이자 구체적 현존의 기준으로 드러냈습니다.
  alternative_readings:
  - ‘하나님의 높은 곳에서’
  - ‘하나님의 높으신 곳에서’
  - ‘지극히 높은 곳에서’
  rationale: 히브리어는 단순한 장소 묘사보다 하나님과 연결된 가장 높은 영역을 말하므로, ‘하나님’과 ‘지극히 높은 곳’을 함께 살리는 쪽이 원문의 신학적 긴장을 더 투명하게 드러냅니다.
  doctrine_reference: 원어 우선과 시적 병행성 보존
