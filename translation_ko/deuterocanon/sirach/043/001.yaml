  text: The splendor of the heights is the clear firmament, the appearance of heaven in a vision of glory.
translation:
  language: ko
  text: 높은 곳의 영광은 맑은 궁창이며, 하늘의 모습은 영광의 환상입니다.
  philosophy: formal
lexical_decisions:
- source_word: γαύριαμα ὕψους
  english_pob_choice: the splendor of the heights
  chosen_korean: 높은 곳의 영광
  alternatives_korean:
  - 높은 곳의 찬란함
  - 높은 곳의 광휘
  lexicon: γaύριαμα / ὕψος
  rationale: ‘splendor’는 단순한 시각적 밝기보다 위엄과 찬란함을 함께 드러내므로, ‘높은 곳’의 영광으로 옮겨 시적 병행을 살렸습니다.
- source_word: στερέωμα καθαριότητος
  english_pob_choice: the clear firmament
  chosen_korean: 맑은 궁창
  alternatives_korean:
  - 맑은 창공
  - 깨끗한 궁창
  lexicon: στερέωμα / καθαριότης
  rationale: ‘firmament’는 창세기의 전통적 우주론 용어에 해당하므로 ‘궁창’을 살렸고, καθαριότης는 ‘맑은’으로 간결하게 반영했습니다.
- source_word: εἶδος οὐρανοῦ
  english_pob_choice: the appearance of heaven
  chosen_korean: 하늘의 모습
  alternatives_korean:
  - 하늘의 형상
  - 하늘의 외형
  lexicon: εἶδος / οὐρανός
  rationale: εἶδος는 ‘보이는 모습’이라는 의미가 강해, 추상적인 ‘형상’보다 ‘모습’이 본문 흐름에 자연스럽습니다.
- source_word: ἐν ὁράματι δόξης
  english_pob_choice: in a vision of glory
  chosen_korean: 영광의 환상
  alternatives_korean:
  - 영광의 환시 안에서
  - 영광의 이상 가운데
  lexicon: ὅραμα / δόξα
  rationale: ‘vision’은 예언적 환시의 뉘앙스를 지니므로 ‘환상’으로 옮겼고, δόξα는 문맥상 ‘영광’이 가장 직접적입니다.
theological_decisions:
- issue: 창조 질서의 묘사를 우주론적 용어로 보존할지, 현대적 자연 묘사로 완화할지
  chosen_reading: ‘궁창’과 ‘하늘의 모습’을 유지해 본문이 가진 고대 우주론적 시각을 보존했습니다.
  alternative_readings:
  - ‘하늘 돔’처럼 현대화된 표현
  - ‘창공’으로 일반화된 표현
  rationale: 시적 이미지이지만 지혜문학의 관찰 세계를 형성하는 핵심 어휘이므로, 시대적 배경을 지우지 않는 번역이 더 충실합니다.
  doctrine_reference: 창세기 1장의 궁창 전통과 지혜문학의 창조 묘사
