base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/043/031.yaml
  text: Who has seen him and can describe him? And who can magnify him as he is?[a]
  footnotes:
  - marker: a
    text: 'The extant Cairo Geniza Hebrew here is divergent and appears mismatched: literally, ''The heights renew strength and do not grow weary, for you will not search them out.'' The Greek parallel instead reads, ''Who has seen him and can describe him? And who can magnify him as he is?'' The main text follows the Greek because it fits the context coherently.'
    reason: textual_variant
translation:
  language: ko
  text: 누가 그분을 보았으며 그분을 설명할 수 있겠습니까? 누가 그분이 어떠하신지 그대로 드높일 수 있겠습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 현전하는 히브리어 본문은 이 자리에서 다르게 전개되며, 직역하면 ‘높은 곳들이 힘을 새롭게 하고 지치지 않으니, 너희는 그것들을 찾아내지 못한다’는 뜻입니다. 본문은 문맥에 맞는 그리스어 평행본문을 따랐습니다.
    reason: textual_variant
lexical_decisions:
- source_word: τίς ἑόρακεν αὐτόν
  english_pob_choice: Who has seen him
  chosen_korean: 누가 그분을 보았으며
  alternatives_korean:
  - 누가 그분을 봤으며
  - 누가 그분을 목격했으며
  lexicon: BDAG
  rationale: 완료형의 ‘본 적이 있다’는 뉘앙스를 살려 ‘보았으며’로 옮기고, 문맥상 하나님을 높이는 질문이므로 존칭 대명사 ‘그분’을 썼습니다.
- source_word: ἐκδιηγήσεται
  english_pob_choice: can describe
  chosen_korean: 설명할 수 있겠습니까
  alternatives_korean:
  - 자세히 말할 수 있겠습니까
  - 끝까지 이야기할 수 있겠습니까
  lexicon: BDAG
  rationale: 단순한 ‘말하다’보다 의미를 풀어 내어 진술하는 기능을 살려 ‘설명하다’로 옮겼습니다.
- source_word: μεγαλυνεῖ
  english_pob_choice: can magnify
  chosen_korean: 드높일 수 있겠습니까
  alternatives_korean:
  - 크게 할 수 있겠습니까
  - 찬양하여 높일 수 있겠습니까
  lexicon: BDAG
  rationale: 하나님의 위대함을 ‘크다’고 만드는 뜻이 아니라 드러내어 높이는 뜻이므로, 예배적 울림을 유지하는 ‘드높이다’를 택했습니다.
- source_word: καθὼς ἐστιν
  english_pob_choice: as he is
  chosen_korean: 그분이 어떠하신지 그대로
  alternatives_korean:
  - 그분이 본래 그러하시듯
  - 그분의 실상대로
  lexicon: BDAG
  rationale: ‘있는 그대로’라는 의미를 자연스럽게 풀어, 하나님을 인간이 완전히 표현할 수 없다는 점을 분명히 했습니다.
theological_decisions:
- issue: 하나님의 측량 불가능성과 수사적 질문의 보존
  chosen_reading: 본문을 연속된 반문으로 처리하여, 하나님의 참모습을 인간이 충분히 말하거나 드높일 수 없다는 뜻을 직접 드러냈습니다.
  alternative_readings:
  - 평서문처럼 완화하여 옮길 수 있음
  - ‘누가 감히…’처럼 강조를 더할 수 있음
  rationale: 헬라어 문장의 수사적 질문 구조를 그대로 살려야 시편적 찬양 문맥의 경외감이 보존됩니다.
  doctrine_reference: 'Sir 43:31의 신학적 요지: 창조주 하나님의 위대함은 인간의 언어로 온전히 포착되지 않습니다.'
