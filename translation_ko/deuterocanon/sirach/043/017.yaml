base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/043/017.yaml
  text: At the flash he shakes out snow[a], and like locusts it settles where it stays.
  footnotes:
  - marker: a
    text: Hebrew witness is difficult and differs sharply from the Greek parallel. The Greek reads instead about the sound of his thunder and a storm of the north wind. Masada also preserves a different Hebrew line here, reading in part 'the sound of thunder' where the Cairo Geniza text has 'at the flash.'
    reason: textual_variant
translation:
  language: ko
  text: 그는 번쩍임에 눈[a]을 흩뿌리시고, 메뚜기들처럼 그것이 내려앉아 머뭅니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 증인은 해석이 어렵고 그리스어 평행본문과 크게 다릅니다. 그리스어는 대신 그의 천둥의 소리와 북풍의 폭풍을 말합니다. 마사다도 이 대목에서 카이로 게니자 본문과 다른 히브리어를 보존합니다.
    reason: textual_variant
lexical_decisions:
- source_word: ברשף
  english_pob_choice: At the flash
  chosen_korean: 번쩍임에
  alternatives_korean:
  - 번개에
  - 번쩍일 때
  lexicon: HALOT
  rationale: רשף는 번쩍임, 불꽃, 번개 같은 빛의 섬광을 가리킬 수 있으므로, 자연현상 문맥에서 ‘번쩍임에’가 מקור의 압축된 시간·수단 감각을 가장 잘 살립니다.
- source_word: יניף
  english_pob_choice: he shakes out
  chosen_korean: 흩뿌리시고
  alternatives_korean:
  - 털어내시고
  - 흩날리시고
  - 휘두르시고
  lexicon: HALOT
  rationale: 눈을 대상으로 할 때 단순한 ‘흔들다’보다 ‘흩뿌리다’가 떨어져 퍼지는 이미지를 살리며, 자연현상 묘사로서 한국어에서도 가장 매끈합니다.
- source_word: שלגו
  english_pob_choice: snow
  chosen_korean: 눈
  alternatives_korean:
  - 그의 눈
  lexicon: HALOT
  rationale: 문자적으로는 ‘그의 눈’이지만, 영어 POB의 판단처럼 날씨 묘사에서는 소유격을 굳이 살리지 않는 편이 자연스럽고, 본문 초점도 눈 자체에 있습니다.
- source_word: וכארבה
  english_pob_choice: and like locusts
  chosen_korean: 메뚜기들처럼
  alternatives_korean:
  - 메뚜기 떼처럼
  - 메뚜기같이
  lexicon: HALOT
  rationale: ארבה는 메뚜기(들) 또는 메뚜기 떼를 뜻하므로, 비유의 집단적 움직임을 살리기 위해 복수형 느낌의 ‘메뚜기들처럼’을 택했습니다.
- source_word: ישכון
  english_pob_choice: it settles
  chosen_korean: 내려앉아
  alternatives_korean:
  - 자리잡아
  - 거주하여
  - 머물러
  lexicon: HALOT
  rationale: שכן은 ‘거하다/머물다/자리잡다’의 뜻이지만, 눈이 공중에서 땅으로 가라앉는 장면에는 ‘내려앉다’가 가장 적절합니다.
- source_word: דירתו
  english_pob_choice: where it stays
  chosen_korean: 머뭅니다
  alternatives_korean:
  - 머무는 곳에
  - 거처에
  lexicon: HALOT
  rationale: דירה는 ‘거처, 거주지’이나, 시적·문맥적으로 이미 앞의 ‘내려앉아’와 겹치므로 동사로 풀어 ‘머뭅니다’라고 옮겨 안정된 현대어를 만들었습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 평행본문의 상이한 형상
  chosen_reading: 주본문은 현존 히브리어를 따르되, 눈을 섬광에 흩뿌리는 자연현상 묘사로 읽었습니다.
  alternative_readings:
  - 그리스어 평행본문에 따라 천둥의 소리와 북풍의 폭풍으로 옮김
  rationale: 시락 43:17은 히브리어와 그리스어가 크게 다르므로, 가용한 히브리어를 본문으로 두는 프로젝트 원칙을 따르되 그 긴장 자체는 보존합니다.
  doctrine_reference: 'PHILOSOPHY.md: Sirach는 히브리어가 남아 있을 때 히브리어 우선, 차이는 정직하게 표시'
