base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/043/006.yaml
  text: The moon also marks the returning seasons[c][b][a], a ruler of the end and a sign forever.
  footnotes:
  - marker: a
    text: 'Greek parallel: ''the moon in all things for its appointed time, a manifestation of times and a sign forever.'' The Hebrew instead reads ''the returning seasons'' and ''a ruler of the end.'''
    reason: alternative_reading
  - marker: b
    text: The Hebrew phrase 'a ruler of the end' is compact and may refer to the moon's governance of the month's completion or fixed limit.
    reason: lexical_alternative
  - marker: c
    text: Masada preserves a different reading for this verse than the Cairo Geniza Hebrew represented here; the surviving Masada excerpt reads, 'for the great Lord made it.'
    reason: textual_variant
translation:
  language: ko
  text: 달도 돌아오는 때들을 알리며, 끝의 통치자요 영원한 표징입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 병행본은 ‘달이 모든 일에서 제 때에 있으며, 때들을 드러내는 것이며 영원한 표징’으로 읽습니다. 히브리어 본문은 ‘돌아오는 때들’과 ‘끝의 통치자’를 말합니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어의 ‘끝의 통치자’는 달이 한 달의 끝, 곧 달력의 마무리나 정해진 한계를 주관한다는 뜻일 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 마사다 사본 단편은 이 절을 달리 전하며, ‘큰 주께서 그것을 만드셨다’라고 읽습니다.
    reason: textual_variant
lexical_decisions:
- source_word: וגם / καὶ
  english_pob_choice: also
  chosen_korean: 또한
  alternatives_korean:
  - 그리고
  - 또
  lexicon: HALOT; SBLGNT
  rationale: 앞 절에 이어 달을 덧붙이는 연결이므로, 한국어에서는 문어체의 ‘또한’이 가장 자연스럽고 첨가 관계를 분명히 드러냅니다.
- source_word: ירח
  english_pob_choice: the moon
  chosen_korean: 달
  alternatives_korean:
  - 달님
  - 월
  lexicon: HALOT
  rationale: 천체로서의 moon은 한국어 성경 문맥에서 ‘달’이 가장 직관적이며, 현대 합쇼체 문체에도 잘 맞습니다.
- source_word: עתות שבות
  english_pob_choice: the returning seasons
  chosen_korean: 돌아오는 계절들
  alternatives_korean:
  - 되돌아오는 때들
  - 반복되는 시기들
  - 돌아오는 때들
  lexicon: HALOT
  rationale: ‘עתות’의 시간/계절적 의미와 ‘שבות’의 반복·회귀성을 함께 살리기 위해, 순환하는 달의 역할을 보여 주는 ‘돌아오는 계절들’로 옮겼습니다.
- source_word: ממשלת קץ
  english_pob_choice: a ruler of the end
  chosen_korean: 끝의 통치자
  alternatives_korean:
  - 끝을 다스리는 자
  - 끝의 지배자
  - 한계의 통치자
  lexicon: HALOT
  rationale: 히브리어의 짧고 압축된 표현을 살려 직역에 가깝게 두었고, 시적 의인화도 유지했습니다.
- source_word: ואות עולם
  english_pob_choice: and a sign forever
  chosen_korean: 영원한 표징
  alternatives_korean:
  - 영원한 표지
  - 영속한 표징
  - 세세토록의 표징
  lexicon: HALOT
  rationale: ‘אות’은 표징/표지를 뜻하므로 ‘표징’이 문맥상 적절하며, ‘עולם’은 지속성을 나타내므로 ‘영원한’으로 옮겼습니다.
