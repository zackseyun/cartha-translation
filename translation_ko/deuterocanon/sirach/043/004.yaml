base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/043/004.yaml
  text: Like a blazing furnace in the works of heat[a], the sun scorches the mountains three times over; breathing out fiery vapors, and flashing rays[b], it dims the eyes.
  footnotes:
  - marker: a
    text: The Hebrew text of this verse is partially difficult and does not align neatly at every point with the Greek. The translation follows the extant Hebrew as primary, with the Greek parallel used to clarify several compressed or uncertain phrases.
    reason: textual_variant
  - marker: b
    text: The phrase 'three times over' is explicit in the Greek witness (τριπλασίως) but not clearly preserved in the extant Hebrew line.
    reason: alternative_reading
translation:
  language: ko
  text: 마치 열기로 달군 풀무질하는 용광로 같고, 해는 산들을 세 번이나 태우며, 불타는 증기를 내뿜고 빛살을 번쩍이니 눈을 흐리게 합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 일부가 압축적이거나 불명확하여, 의미가 분명한 그리스어 병행본을 함께 참고해 옮겼습니다.
    reason: textual_variant
  - marker: b
    text: ‘세 번이나’에 해당하는 τριπλασίως는 그리스어 증인에 명시되어 있으나, 현존 히브리어 줄에서는 분명하게 보존되지 않습니다.
    reason: textual_variant
lexical_decisions:
- source_word: כור נפוח
  english_pob_choice: a blazing furnace
  chosen_korean: 열기로 달군 풀무질하는 용광로
  alternatives_korean:
  - 불붙는 용광로
  - 부는 풀무가 있는 용광로
  lexicon: HALOT; LSJ
  rationale: 히브리어의 ‘풀무로 부는’ 이미지를 살리면서, 한국어에서는 자연스러운 명사구로 풀어 옮겼습니다.
- source_word: שולח שמש ידליק הרים
  english_pob_choice: the sun scorches the mountains
  chosen_korean: 해는 산들을 세 번이나 태우며
  alternatives_korean:
  - 해는 산들을 그을리며
  - 해는 산들을 불태우며
  lexicon: HALOT
  rationale: 주어가 압축된 히브리어를 문맥상 분명한 ‘해’로 풀었고, 동사는 산을 가열·점화하는 강한 이미지를 살려 ‘태우며’로 옮겼습니다.
- source_word: τριπλασίως
  english_pob_choice: three times over
  chosen_korean: 세 번이나
  alternatives_korean:
  - 세 배로
  - 세 차례 더
  lexicon: LSJ
  rationale: 그리스어 병행본에 명시된 강조 표현을 본문에 반영하되, 한국어에서는 과장된 어감을 피하면서도 분명히 드러나도록 했습니다.
- source_word: ἀτμίδας πυρώδεις ἐμφυσῶν
  english_pob_choice: breathing out fiery vapors
  chosen_korean: 불타는 증기를 내뿜고
  alternatives_korean:
  - 불기운 서린 연기를 내뿜고
  - 불꽃 같은 김을 내뿜고
  lexicon: LSJ
  rationale: ‘증기/김’의 물리적 이미지와 ‘불타는’ 성격을 함께 살려, 그리스어의 생생한 열기 표현을 유지했습니다.
- source_word: ἀκτῖνας
  english_pob_choice: flashing rays
  chosen_korean: 빛살을 번쩍이니
  alternatives_korean:
  - 광선을 번쩍이며
  - 광채를 뿜으니
  lexicon: LSJ
  rationale: 그리스어의 ‘광선’ 이미지를 한국어 시적 표현인 ‘빛살’로 옮겨, 문장의 병렬성과 시적 리듬을 살렸습니다.
- source_word: ἀμαυροῖ ὀφθαλμούς
  english_pob_choice: it dims the eyes
  chosen_korean: 눈을 흐리게 합니다
  alternatives_korean:
  - 눈을 어둡게 합니다
  - 눈을 멀게 합니다
  lexicon: LSJ
  rationale: ‘완전히 실명’보다는 시야를 흐리게 하는 효과가 문맥에 더 정확하므로, 과장하지 않는 동사로 옮겼습니다.
theological_decisions:
