  alternative_readings:
  - 완곡하게 순화해 ‘뜨겁게 합니다’ 수준으로 낮추기
  - 비유성을 강조해 지나치게 해석적으로 바꾸기
  rationale: 이 절은 교리 진술이 아니라 창조 세계의 압도적 열기를 묘사하는 시적 본문이므로, 원문의 강도를 보존하는 번역이 적절합니다.
  doctrine_reference: 지혜문학의 시적 과장법과 자연 묘사
