translation:
  language: ko
  text: 열기에 달아오른 풀무처럼, 해는 산들을 세 배나 태우고, 불 같은 김을 내뿜으며 빛살을 번쩍여 눈을 흐리게 합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 일부가 압축적이거나 불명확하여, 의미가 더 분명한 그리스어 병행본을 함께 참고하여 옮겼습니다.
    reason: textual_variant
  - marker: b
    text: ‘세 배나’에 해당하는 τριπλασίως는 그리스어 증인에는 명시되어 있으나, 현존 히브리어 행에는 분명하게 보존되어 있지 않습니다.
    reason: alternative_reading
