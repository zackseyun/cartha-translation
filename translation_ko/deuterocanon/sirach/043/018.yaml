base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/043/018.yaml
  text: The appearance of snow dazzles the eyes, and at its falling the heart is amazed.
  footnotes:
  - marker: a
    text: Hebrew 'whiteness' could be read here, but the Greek parallel and the weather context strongly support 'snow.'
    reason: lexical_alternative
  - marker: b
    text: The Hebrew line about its 'rain/shower' is textually awkward in context; the Greek parallel supports understanding the phrase as the snow's falling or precipitation.
    reason: textual_variant
  - marker: c
    text: Masada preserves a different neighboring line in this section ('and the sight amazes the heart'), showing some instability in the arrangement of these cola among Hebrew witnesses.
    reason: textual_variant
translation:
  language: ko
  text: 눈의 모습은 눈을 현혹시키고, 그것이 내릴 때 마음은 놀랍니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘희게 함/희고 밝음’으로도 읽을 수 있지만, 이 구절의 기상 문맥과 그리스어 평행본문은 ‘눈’으로 이해하는 쪽을 강하게 지지합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어의 ‘내림/소나기’ 표현은 문맥상 다소 어색하므로, 눈의 ‘내림’이라는 뜻으로 이해해 옮겼습니다.
    reason: textual_variant
