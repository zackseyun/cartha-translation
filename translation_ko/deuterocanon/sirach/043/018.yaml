  rationale: 히브리어의 ‘요동치다/소란하다’와 그리스어의 ‘놀라다/경이로워하다’가 만나는 지점을 살려, 과도하게 강하거나 부정적인 ‘경악’보다 ‘놀랍니다’가 적절합니다.
