review_pass:
  verdict: revise
  source_fidelity: 히브리어의 대구 구조(‘무에서 무로’, ‘공허에서 공허로’)와 ‘돌아가다’를 유지했습니다. חנף는 단순한 도덕적 악행보다 불경·불경건의 뜻을 포함하므로 ‘악한 자’보다 ‘불경한 자’가 더 정확합니다. 그리스어 병행본문의 실질적 이문도 각주에 보존했습니다.
  naturalness: ‘아무것에서 아무것으로’는 현대 표준 한국어에서 다소 부자연스럽고, ‘무에서 무로’가 간결한 격언체와 원문의 반복을 더 잘 살립니다. ‘공허함에서 공허함으로’도 가능하나 ‘공허에서 공허로’가 더 자연스럽습니다. 본문의 중복 각주 표지 ‘ᵃ[a]’는 단일 표지로 바로잡아야 합니다.
  terminology: ‘불경한 자’는 חנף의 종교·윤리적 함의를 보존하면서 ‘위선자’라는 좁은 해석을 피합니다. ‘무’와 ‘공허’는 אפס와 תהו의 의도적인 어휘 차이를 유지합니다.
  issues:
  - severity: medium
    issue: חנף를 ‘악한 자’로 번역함
    rationale: ‘악한 자’는 지나치게 일반적이어서 חנף 및 그리스어 ἀσεβεῖς가 지닌 불경·불경건의 종교적 함의를 약화합니다.
  - severity: low
    issue: ‘아무것에서 아무것으로’라는 표현
    rationale: 문법적으로 이해되지만 현대 한국어의 격언 문체에서는 ‘무에서 무로’가 더 자연스럽고 간결합니다.
  - severity: medium
    issue: 본문에 각주 표지가 ‘ᵃ[a]’로 중복됨
    rationale: 각주 앵커는 하나만 있어야 하며, 중복 표기는 구조적으로 부정확합니다.
  - severity: low
    issue: 각주의 그리스어 첫 구를 ‘땅에서 나온 것은’으로 옮김
    rationale: πάντα ὅσα의 포괄성은 ‘땅에서 나온 모든 것은’으로 드러내는 편이 정확합니다.
  revised_text: 모든 것은 무에서 무로 돌아가고, 그와 같이 불경한 자도 공허에서 공허로 갑니다.ᵃ
  revised_footnotes:
  - marker: a
    text: '그리스어 병행본문: ‘땅에서 나온 모든 것은 땅으로 갑니다. 그와 같이 불경한 자들은 저주에서 멸망으로 갑니다.’ 현존 히브리어 본문은 이 절에서 상당히 다른 형태를 보입니다.'
    reason: alternative_reading
  revision_rationale: 히브리어 본문을 우선하여 אפס의 반복은 ‘무’, תהו의 반복은 ‘공허’로 구별해 옮겼습니다. חנף는 원문의 종교·윤리적 의미를 반영하여 ‘불경한 자’로 수정했습니다. 그리스어의 이문은 본문에 혼합하지 않고 각주에 남겼으며, 중복된 각주 표지는 단일 표지로 정리했습니다.
