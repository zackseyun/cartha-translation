translation:
  language: ko
  text: 모든 것은 아무것에서 아무것으로 돌아가고, 그와 같이 악한 자도 공허함에서 공허함으로 갑니다.ᵃ[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '그리스어 병행본문: ‘땅에서 나온 것은 땅으로 사라집니다. 그와 같이 악인들은 저주에서 멸망으로 갑니다.’ 히브리어 현존 본문은 이 구절의 형상이 상당히 다릅니다.'
    reason: alternative_reading
lexical_decisions:
- source_word: כל
  english_pob_choice: Everything
  chosen_korean: 모든 것은
  alternatives_korean:
  - 모든 것
  - 만물은
  lexicon: HALOT
  rationale: 짧은 격언문의 보편적 주어로 자연스럽게 읽히도록 ‘모든 것은’으로 옮겼습니다.
- source_word: מאפס / אל אפס
  english_pob_choice: from nothing / to nothing
  chosen_korean: 아무것에서 아무것으로
  alternatives_korean:
  - 무(無)에서 무(無)로
  - 없음에서 없음으로
  - 공허함에서 공허함으로
  lexicon: HALOT
  rationale: אפס의 급격한 ‘무(없음)’의 뉘앙스를 살리되, 한국어에서는 반복 구조가 가장 분명한 ‘아무것에서 아무것으로’로 옮겼습니다.
- source_word: חנף
  english_pob_choice: the ungodly
  chosen_korean: 악한 자
  alternatives_korean:
  - 경건하지 않은 자
  - 불경한 자
  - 사악한 자
  lexicon: HALOT
  rationale: 히브리어 חנף를 단순한 ‘위선자’보다 도덕·종교적으로 어긋난 사람으로 넓게 잡아, POB의 ‘ungodly’ 취지를 반영했습니다.
- source_word: מתהו / אל תהו
  english_pob_choice: from emptiness / to emptiness
  chosen_korean: 공허함에서 공허함으로
  alternatives_korean:
  - 허무에서 허무로
  - 텅 빔에서 텅 빔으로
  - 무의미함에서 무의미함으로
  lexicon: HALOT
  rationale: תהו를 창세기의 우주론적 ‘혼돈’으로 과도하게 끌고 가지 않고, 격언의 허무성과 공허함을 드러내는 ‘공허함’으로 옮겼습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행본문의 차이
  chosen_reading: 본문은 살아 있는 히브리어를 따라 번역하고, 그리스어의 ‘땅에서 땅으로’ 이미지는 각주로 남겼습니다.
  alternative_readings:
  - 그리스어를 따라 ‘땅에서 땅으로’로 본문을 바꾸기
  - 두 증언을 절충해 혼합 번역하기
  rationale: 이 절은 히브리어와 그리스어가 실질적으로 다르므로, 본문은 히브리어를 따르되 audit를 위해 그리스어의 다른 형상을 각주로 보존하는 것이 가장 투명합니다.
  doctrine_reference: 'PHILOSOPHY.md: Sirach는 현존 히브리어 우선, 그리스어 병행본문은 실제 번역 자료로 사용'
