base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/041/015.yaml
  text: Better is a man who hides his folly than a man who hides his wisdom[b][a]; instruction is shame.
  footnotes:
  - marker: a
    text: Hebrew ends with a difficult phrase, literally something like 'discipline/reproof of shame' (מוסר בשת), where the Greek reads simply 'than a man who hides his wisdom.' The main text follows the clearer comparative sense supported by the Greek parallel.
    reason: textual_variant
  - marker: b
    text: Or 'Better is a person who hides his folly than one who hides his wisdom.' The source uses the singular masculine form 'man' in a representative sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 자신의 어리석음을 숨기는 사람이 자신의 지혜를 숨기는 사람보다 낫습니다. 훈계는 수치입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문 끝의 מוסר בשת은 직역하면 대략 ‘훈계/교정, 수치’에 해당하지만, 문법과 정확한 뜻이 확정되지 않은 난구입니다. 그리스어 평행문은 ‘자신의 지혜를 숨기는 사람보다’에서 끝나며 이 어구를 포함하지 않습니다. 본문은 히브리어의 난해한 종결을 ‘훈계는 수치입니다’로 잠정적으로 옮겼습니다.
    reason: textual_variant
lexical_decisions:
- source_word: טוב / κρείσσων
  english_pob_choice: Better is
  chosen_korean: …보다 낫습니다
  alternatives_korean:
  - 좋습니다
  - 더 낫습니다
  lexicon: HALOT / LXX κρείσσων
  rationale: 히브리어와 그리스어 모두 비교 우위를 나타내므로, 한국어에서는 자연스러운 비교 구문인 ‘…보다 낫습니다’로 옮겨 간결함을 살렸습니다.
- source_word: איש / ἄνθρωπος
  english_pob_choice: a man
  chosen_korean: 사람
  alternatives_korean:
  - 한 사람
  - 남자
  lexicon: HALOT / LSJ
  rationale: 원문은 남성 단수형이지만 지혜문학의 대표적 일반화로 기능하므로, 한국어에서는 성별을 과도하게 전면화하지 않는 ‘사람’이 문맥상 가장 자연스럽습니다.
- source_word: מצפין אולתו / ἀποκρύπτων τὴν μωρίαν αὐτοῦ
  english_pob_choice: who hides his folly
  chosen_korean: 자기 어리석음을 숨기는
  alternatives_korean:
  - 자기 어리석음을 감추는
  - 자기 어리석음을 덮는
  lexicon: HALOT / BDAG
  rationale: מצפין과 ἀποκρύπτων은 ‘숨기다/감추다’의 반복 구조를 이루므로, 도덕적 함의를 유지하면서도 직설적인 ‘숨기는’으로 옮겼습니다.
- source_word: חכמתו / τὴν σοφίαν αὐτοῦ
  english_pob_choice: his wisdom
  chosen_korean: 자기 지혜를
  alternatives_korean:
  - 그의 지혜를
  - 자신의 지혜를
  lexicon: HALOT / BDAG
  rationale: 앞절과의 평행성을 살리기 위해 ‘자기’를 반복해 주어를 명확히 했고, ‘지혜’가 원문의 σοφία와 ישר하게 대응되도록 했습니다.
theological_decisions:
- issue: 마지막 구절 מוסר בשת의 처리
  chosen_reading: ‘훈계는 수치입니다’로 옮기되, 본문의 난해한 히브리어 종결을 반영합니다.
  alternative_readings:
  - ‘수치의 훈계입니다’
  - ‘훈계는 부끄러움입니다’
  - 그리스어 평행문만 따라 마지막 절을 생략
  rationale: 히브리어의 מוסר בשת은 문법적으로 압축되고 난해하지만, 전승된 본문을 지우지 않기 위해 그 의미 영역을 최대한 짧고 직접적으로 살렸습니다. 동시에 그리스어 평행문의 더 분명한 비교 구조와의 긴장은 보존됩니다.
  doctrine_reference: 지혜문학 본문비평; 잠언적 압축 표현의 보존
- issue: 대표적 남성 단수의 일반화
  chosen_reading: ‘사람’으로 번역하되, 문장의 대표성은 유지합니다.
  alternative_readings:
  - ‘남자’
  - ‘한 사람’
  rationale: 원문은 איש/ἄνθρωπος의 남성 단수를 사용하지만, 여기서는 교훈적 일반명제로 기능하므로 한국어 합쇼체 독자에게 성별 특정성을 과도하게 부각하지 않는 쪽이 적절합니다.
  doctrine_reference: 문학적 일반화와 대표 표지
