translation:
  language: ko
  text: 부모 앞에서, 또 성적 타락에 대해 부끄러워하십시오[a]. 그리고 직분에 앉은 통치자 앞에서 거짓말에 대해 부끄러워하십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘앉아 있는 통치자’라는 이미지를 담고 있으며, 그리스어 평행본문은 ‘지도자와 권세자’로 일반화합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: בוש
  english_pob_choice: Be ashamed
  chosen_korean: 부끄러워하십시오
  alternatives_korean:
  - 수치스러워하십시오
  - 부끄러움을 느끼십시오
  lexicon: HALOT
  rationale: 권면형 명령으로서의 수치/부끄러움 반응을 자연스러운 현대 합쇼체로 옮겼습니다.
- source_word: מאב ואם
  english_pob_choice: before father and mother
  chosen_korean: 부모 앞에서
  alternatives_korean:
  - 아버지와 어머니 앞에서
  - 아버지와 어머니에게
  lexicon: HALOT
  rationale: 히브리어 מן의 관계적 의미를 한국어의 ‘~앞에서’로 자연스럽게 살렸고, 부모를 묶는 표현으로 간결하게 옮겼습니다.
- source_word: אל זנות
  english_pob_choice: for sexual immorality
  chosen_korean: 성적 타락에 대해
  alternatives_korean:
  - 음행에 대해
  - 성적 부도덕에 대해
  lexicon: HALOT
  rationale: זנות의 넓은 윤리적 범위를 살리되, 현대 한국어에서 과도하게 교회 용어화되지 않은 표현을 택했습니다.
- source_word: מנשיא יושב
  english_pob_choice: before a ruler in office
  chosen_korean: 직분에 앉은 통치자 앞에서
  alternatives_korean:
  - 자리에 앉은 통치자 앞에서
  - 직위에 있는 통치자 앞에서
  - 통치자 앞에서
  lexicon: HALOT
  rationale: יושב의 ‘앉아 있는’ 이미지를 유지하면서도, 단순한 자세 묘사가 아니라 공적 권위의 자리에 앉아 있는 상태를 드러내도록 옮겼습니다.
- source_word: אל כחש
  english_pob_choice: for lying
  chosen_korean: 거짓말에 대해
  alternatives_korean:
  - 거짓에 대해
  - 속임수에 대해
  lexicon: HALOT
  rationale: כחש를 이 문맥의 윤리적 항목에 맞게 가장 직접적인 한국어로 옮겼습니다.
theological_decisions:
- issue: 공적 권위자 앞에서의 수치 권면
  chosen_reading: 통치자 앞에서의 거짓말 금지를 개인 윤리 차원이 아니라 공적 권위 앞에서의 책임 있는 말하기로 표현했습니다.
  alternative_readings:
  - 단순히 ‘거짓말하지 말라’는 일반 윤리로 평탄화하는 읽기
  - ‘지도자’로 약화해 공적 위계를 흐리는 읽기
  rationale: 히브리어와 그리스어 모두 공적 권위의 자리를 전제하므로, 문맥의 사회적 긴장을 보존하는 것이 적절합니다.
  doctrine_reference: 잠언적 지혜문학의 공적-윤리적 권면
