theological_decisions:
- issue: 밥상 예절의 구체적 이미지 보존
  chosen_reading: ‘팔꿈치를 빵 위에 기대는 일’이라는 구체적 식사 자세를 그대로 살렸습니다.
  alternative_readings:
  - ‘음식을 앞에 두고 기대는 일’처럼 완화하기
  - ‘식탁 예절을 어기는 일’로 일반화하기
  rationale: 히브리어와 그리스어 병행이 모두 팔꿈치를 빵 위에 두는 구체적 동작을 지시하므로, 이를 일반적인 예절 위반으로만 풀지 않고 이미지 자체를 보존했습니다.
  doctrine_reference: 본문의 지혜문학적 경고와 사회적 수치의 표현
