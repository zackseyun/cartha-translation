translation:
  language: ko
  text: 맹세[b]와 언약을 어기는 일과 빵 위에 팔꿈치를 괴는 일[a]을 부끄러워하십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 둘째 구절은 간결하여 뜻이 다소 불확실합니다. 그리스어 평행본문은 더 자세히 ‘빵들 위에 팔꿈치를 짚는 것’이라고 읽으며, 이 번역을 뒷받침합니다.
    reason: textual_variant
  - marker: b
    text: ‘맹세’는 ‘저주’ 또는 ‘맹세-저주’로도 옮길 수 있습니다. 히브리어 낱말에는 맹세에 수반되는 저주의 함의가 있을 수 있습니다.
    reason: lexical_alternative
