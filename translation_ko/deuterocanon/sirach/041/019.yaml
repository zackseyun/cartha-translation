  text: for violating an oath and a covenant[b][a], and for leaning with your elbow over the bread.
  footnotes:
  - marker: a
    text: Hebrew is terse and somewhat uncertain in the second clause. The Greek parallel reads more fully, 'and from planting the elbow over the loaves,' which supports the rendering 'leaning with your elbow over the bread.'
    reason: textual_variant
  - marker: b
    text: '''An oath'' could also be rendered ''a curse'' or ''an adjuration,'' since the Hebrew term can carry oath-curse overtones.'
    reason: lexical_alternative
translation:
  language: ko
  text: 맹세와 언약을 어기는 일과, 팔꿈치를 빵 위에 기대는 일로부터입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 둘째 절이 간결하고 다소 불확실합니다. 그리스어 평행본문은 ‘빵들 위에 팔꿈치를 고정하는 것’으로 더 자세히 읽히며, 이를 뒷받침합니다.
    reason: textual_variant
  - marker: b
    text: ‘맹세’는 ‘저주’나 ‘맹세-저주’로도 옮길 수 있습니다. 히브리어 용례상 그런 함의가 함께할 수 있습니다.
    reason: lexical_alternative
