  text: for a friend[a], over words of reproach; and after giving a gift to a brother, do not reproach him.
  footnotes:
  - marker: a
    text: 'The Hebrew of this line is terse and somewhat elliptical. The Greek parallel makes the implied sense explicit: ''from friends concerning words of reproach, and after giving, do not reproach.'''
    reason: textual_variant
translation:
  language: ko
  text: 친구와 관련된 모욕적인 말을 삼가고, 형제에게 선물을 준 뒤에는 그를 비난하지 마십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 첫 구절은 매우 압축적이어서 동사가 생략되어 있습니다. 그리스어 평행본문은 친구들과 관련된 비난의 말이라는 뜻과, 선물을 준 뒤에는 비난하지 말라는 금지를 더 분명히 드러냅니다.
    reason: textual_variant
lexical_decisions:
- source_word: מאוהב
  english_pob_choice: for a friend
  chosen_korean: 친구로 인하여는
  alternatives_korean:
  - 친구 때문에는
  - 친구를 두고는
  - 친구와 관련하여
  lexicon: HALOT
  rationale: 히브리어는 אוהב 계열의 압축된 표현이어서 관계의 대상을 가리키는 말로 읽는 것이 자연합니다. 영어 POB의 'for a friend'에 맞추되, 한국어에서는 문맥상 원인/관련을 드러내는 '인하여는'으로 옮겨 간결한 경구성을 살렸습니다.
- source_word: על דברי חרפה
  english_pob_choice: over words of reproach
  chosen_korean: 비방의 말을
  alternatives_korean:
  - 수치를 주는 말로
  - 모욕의 말로
  - 수치스러운 말을
  lexicon: HALOT
  rationale: דברי חרפה는 단순한 말이 아니라 수치와 모욕을 일으키는 발언을 뜻하므로, 교회적 완곡어법보다 직접적인 '비방의 말'이 원문의 사회적 공격성을 더 잘 드러냅니다.
- source_word: מתת
  english_pob_choice: giving a gift
  chosen_korean: 선물을 준 뒤에는
  alternatives_korean:
  - 선물을 준 후에는
  - 준 선물 뒤에는
  - 주고 난 뒤에는
  lexicon: HALOT
  rationale: 히브리어는 명사형 '주심/증여'를 가리킬 수 있지만, 여기서는 시간 부사구로 기능하므로 한국어에서는 자연스럽게 동사구로 풀어 '선물을 준 뒤에는'이라고 옮겼습니다.
- source_word: אח
  english_pob_choice: a brother
  chosen_korean: 형제에게
  alternatives_korean:
  - 형제에게
  - 동료에게
  - 친족에게
  lexicon: HALOT
  rationale: 문자적으로는 '형제'이며, 지혜문학의 넓은 친족/동료 의미를 지나치게 일반화하지 않고 원문 호칭을 유지했습니다. 한국어 합쇼체 문맥에서는 '형제에게'가 가장 직접적입니다.
- source_word: מנאץ
  english_pob_choice: do not reproach him
  chosen_korean: 그를 꾸짖지 마십시오
  alternatives_korean:
  - 그를 비난하지 마십시오
  - 그를 모욕하지 마십시오
  - 그를 힐난하지 마십시오
  lexicon: HALOT
  rationale: 어근은 '경멸하다/모독하다' 쪽의 강한 비난을 가리키지만, 여기서는 그 뒤에 오는 금지형의 기능상 '선물을 준 뒤에 상대를 책망하지 말라'는 충고가 됩니다. '꾸짖다'가 관계를 깨는 공개적 책망의 뉘앙스를 가장 균형 있게 전달합니다.
theological_decisions:
- issue: 히브리어의 압축성을 그리스어 평행구로 보완할지 여부
  chosen_reading: 히브리어를 기본으로 두되, 의미상 '친구를 두고 비방의 말로 다투지 말라'는 금지와 '형제에게 준 뒤 꾸짖지 말라'는 경구로 읽었습니다.
  alternative_readings:
  - 히브리어의 생략을 더 강하게 남겨 '친구에 대하여, 비방의 말들…'처럼 단편적으로 옮기는 방법
  - 그리스어를 따라 첫 절을 '친구에 대하여 비방의 말 때문에'로 보다 설명적으로 옮기는 방법
  rationale: 이 절은 히브리어가 매우 압축적이고 그리스어가 이를 명료화합니다. 번역은 히브리어의 우선성을 유지하되, 영어 POB의 해석된 구조를 한국어에서 자연스럽게 구현하여 독자가 경구의 금지 의미를 바로 이해하도록 했습니다.
  doctrine_reference: 'PHILOSOPHY.md: Hebrew Sirach translated from Hebrew where it survives, with Greek parallel used for consistency check/input'
