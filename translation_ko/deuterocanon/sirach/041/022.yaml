  source_fidelity: 히브리어 첫 구절은 동사가 생략된 매우 압축적인 표현이며, 그리스어 평행본문은 친구들과 관련된 ‘비난/모욕의 말’이라는 관계를 밝혀 줍니다. 초안의 ‘친구로 인하여는’은 친구가 행위의 원인인 듯한 인과 관계를 만들어 내므로 על 및 평행본문이 시사하는 관련·대상 관계를 충분히 반영하지 못합니다. 둘째 구절은 ‘선물을 준 뒤’와 금지 명령을 적절히 전달하지만, מנאץ/ὀνείδιζε에는 단순한 훈계보다 비난하거나 모욕하는 뜻이 더 가깝습니다.
  naturalness: ‘친구와 관련된 모욕적인 말을 삼가고’는 현대 표준어에서 자연스럽고, 생략된 금지의 힘을 과도하게 확정하지 않으면서도 경구의 흐름을 살립니다. ‘선물을 준 뒤에는 그를 비난하지 마십시오’도 합쇼체의 격식 있는 문체에 맞습니다.
