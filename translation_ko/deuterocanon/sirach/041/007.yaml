base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/041/007.yaml
  text: The children of a wicked father are cursed[a], for because of him they are a disgrace.
  footnotes:
  - marker: a
    text: 'Greek parallel: ''The children of an ungodly father are reproached, because of him they will be disgraced.'' The Hebrew more sharply suggests being cursed, while the Greek emphasizes reproach.'
    reason: alternative_reading
translation:
  language: ko
  text: 악한 아버지의 자녀는 저주를 받습니다[a]. 그 아버지 때문에 그들은 수치를 당합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 평행문은 ‘경건하지 않은 아버지의 자녀는 비난을 받습니다. 그 아버지 때문에 그들은 수치를 당할 것입니다’라고 하여, 히브리어의 ‘저주’보다 사회적 비난의 뉘앙스를 더 강하게 드러냅니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אב רשע
  english_pob_choice: a wicked father
  chosen_korean: 악한 아버지
  alternatives_korean:
  - 불경한 아버지
  - 사악한 아버지
  - 악한 부모
  lexicon: HALOT
  rationale: 히브리어는 단수의 부친을 가리키며, רשע는 도덕적 악함을 뜻하므로 ‘악한 아버지’가 가장 직접적입니다.
- source_word: יקוב
  english_pob_choice: are cursed
  chosen_korean: 저주를 받습니다
  alternatives_korean:
  - 저주받습니다
  - 비난을 받습니다
  - 꾸지람을 받습니다
  lexicon: HALOT
  rationale: 히브리어는 maledictory한 결과를 강하게 시사하므로 수동적 결과를 살린 ‘저주를 받습니다’가 본문 뜻을 잘 드러냅니다.
- source_word: לחרפה
  english_pob_choice: for disgrace
  chosen_korean: 수치를 당합니다
  alternatives_korean:
  - 수치가 됩니다
  - 비난을 받습니다
  - 모욕을 당합니다
  lexicon: HALOT
  rationale: חרפה는 단순한 내적 부끄러움보다 공개적 수치와 모욕의 의미가 있어, 한국어에서는 ‘수치를 당합니다’가 사회적 맥락을 잘 반영합니다.
theological_decisions:
- issue: 히브리어의 ‘저주’와 그리스어 평행문의 ‘비난/수치’ 긴장 유지
  chosen_reading: 본문에는 ‘저주를 받습니다’로 두되, 뒤 절에서 ‘수치를 당합니다’로 사회적 수치의 의미를 함께 살렸습니다.
  alternative_readings:
  - ‘비난을 받습니다’로 통일
  - ‘수치가 됩니다’로 완화
  rationale: 시락서의 히브리어가 더 강한 저주 어휘를 보이지만, 그리스어는 reproach/disgrace 쪽 의미를 강조하므로 두 층위를 함께 보존하는 쪽이 원문 긴장을 가장 잘 유지합니다.
  doctrine_reference: 'PHILOSOPHY.md: 히브리어가 남아 있는 시락서는 히브리어를 우선하되, 평행 전승의 의미 차이를 지우지 않는다.'
