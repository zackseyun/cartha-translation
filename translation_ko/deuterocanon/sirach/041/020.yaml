translation:
  language: ko
  text: 요청을 거절하는 일을 부끄러워하고, 이웃을 외면하는 일을 부끄러워하십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 확실하지 않으며, 그리스어는 대략 ‘침묵에 관한 인사에서, 또 동반자 또는 창녀인 여인을 바라보는 것에서’라고 읽습니다. 본문은 남아 있는 히브리어 전승을 따르지만, 두 본문의 차이는 매우 큽니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ממנוע מתת שאלה
  english_pob_choice: of refusing a request
  chosen_korean: 요청을 거절하는 일
  alternatives_korean:
  - 청을 거절하는 일
  - 청원을 거부하는 일
  - 청하는 것을 막는 일
  lexicon: HALOT
  rationale: מנוע/מנע 계열은 ‘막다, 거절하다, 금하다’의 뜻을 가지므로, שאלה와 함께 있을 때 한국어로는 자연스럽게 ‘요청을 거절하는 일’로 옮기는 것이 가장 분명합니다.
- source_word: מתת
  english_pob_choice: a request
  chosen_korean: 요청
  alternatives_korean:
  - 청원
  - 청함
  - 선물
  lexicon: HALOT
  rationale: 전승된 히브리어는 문자적으로는 ‘줌/선물’과 연관되지만, שאלה와의 결합 및 영어 POB의 판단을 따라 이 구절에서는 ‘요청’의 의미가 핵심이므로 한국어도 그 뜻을 따랐습니다.
- source_word: מהשב אפי רעך
  english_pob_choice: of turning away the face of your neighbor
  chosen_korean: 이웃의 얼굴을 외면하는 일
  alternatives_korean:
  - 이웃의 얼굴을 돌이키는 일
  - 이웃의 얼굴을 물리치는 일
  - 이웃의 얼굴을 돌려세우는 일
  lexicon: HALOT
  rationale: רעך는 ‘네 이웃’이며, אפי는 전승상 ‘네 이웃의 얼굴’을 뜻하는 것으로 보는 것이 자연스럽습니다. 따라서 직역을 유지하되 한국어에서는 ‘외면하다’로 관계적 거절의 뉘앙스를 살렸습니다.
theological_decisions:
- issue: 히브리어 전승과 그리스어 병행본문의 큰 차이
  chosen_reading: 본문은 살아남은 히브리어 전승을 따라 ‘요청을 거절하는 일, 이웃의 얼굴을 외면하는 일’로 번역하고, 그리스어의 현저히 다른 읽기는 각주로 드러냈습니다.
  alternative_readings:
  - '그리스어 계열: ‘침묵과 관련된 인사, 한 동반자/창녀인 여인을 바라봄’'
  rationale: 이 절은 히브리어와 그리스어가 크게 어긋나므로, 원문 우선 원칙에 따라 본문은 히브리어를 따르되 불확실성과 이질성을 숨기지 않는 것이 필요합니다.
  doctrine_reference: 'PHILOSOPHY.md: original-language primacy; preserve source uncertainty honestly'
