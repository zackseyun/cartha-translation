  naturalness: ‘하나님에게서 온 모든 육체의 몫’은 ‘하나님에게서 온’의 수식 범위가 불분명하고 현대 한국어로 다소 어색합니다. ‘모든 사람에게 하나님에게서 주어진 몫’으로 옮기면 원문의 ‘모든 육체’ 관용구가 가리키는 인간 전체를 자연스럽고 정확하게 전달합니다. ‘결정’보다 ‘정하심’이 이 문맥에서 더 자연스럽고, 히브리어의 율법과 그리스어의 기뻐하심 사이를 중립적으로 보존합니다.
