base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/041/004.yaml
  text: This is the lot of all flesh from God[a], so why reject the decree of the Most High? Whether for a thousand years, or a hundred, or ten[d][c][b], there is no rebuke of life in Sheol.
  footnotes:
  - marker: a
    text: Hebrew reads 'from God'; the Greek parallel reads 'from the Lord.'
    reason: alternative_reading
  - marker: b
    text: The Hebrew text appears to read 'the law of the Most High,' while the Greek parallel has 'the good pleasure of the Most High.' The main text's 'decree' reflects the sense of what the Most High has ordained in context.
    reason: alternative_reading
  - marker: c
    text: The number sequence is textually difficult in the Hebrew witness; the Greek parallel reads 'whether ten or a hundred or a thousand years.'
    reason: textual_variant
  - marker: d
    text: Greek has 'Hades'; the Hebrew witness supports 'Sheol.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이것은 하나님에게서 온 모든 육체의 몫이니, 어찌 지극히 높으신 분의 결정을 거절하겠습니까? 천 년이든, 백 년이든, 열 년이든 — 스올에는 생명의 책망이 없습니다.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 ‘하나님에게서’로 읽히며, 그리스어 평행본문은 ‘주님에게서’로 읽습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어 본문은 ‘지극히 높으신 분의 율법’으로 읽힐 수 있으나, 그리스어 평행본문은 ‘지극히 높으신 분의 기뻐하심’을 지닙니다.
    reason: alternative_reading
  - marker: c
    text: 숫자 배열은 히브리어 증거가 난해하며, 그리스어는 ‘열 년이든 백 년이든 천 년이든’으로 읽습니다.
    reason: textual_variant
  - marker: d
    text: 그리스어는 ‘하데스’이지만, 히브리어 증거는 ‘스올’을 지지합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: זה חלק כל בשר / τοῦτό τὸ κρίμα ... πάσῃ σαρκί
  english_pob_choice: This is the lot of all flesh
  chosen_korean: 이것은 ... 모든 육체의 몫
