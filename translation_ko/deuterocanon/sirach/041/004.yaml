  rationale: חלק의 기본 의미인 ‘몫/몫으로 주어진 것’을 살리고, כל בשר의 관용구를 ‘모든 육체’로 직역해 인간의 유한성을 유지했습니다.
- source_word: מאל / παρὰ Κυρίου
  english_pob_choice: from God
  chosen_korean: 하나님에게서 온
  alternatives_korean:
  - 주님에게서 온
  - 하나님으로부터 온
  lexicon: HALOT; BDAG/LXX lexica
  rationale: 히브리어 본문이 מאל('하나님에게서')을 지지하므로, 영어 본문의 주님보다 한국어 본문에서는 하나님을 따랐습니다.
- source_word: בתורת עליון / ἐν εὐδοκίᾳ Ὑψίστου
  english_pob_choice: the decree of the Most High
  chosen_korean: 지극히 높으신 분의 결정
