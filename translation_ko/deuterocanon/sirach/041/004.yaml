  - 지극히 높으신 분의 뜻
  lexicon: HALOT; BDAG
  rationale: 히브리어의 ‘율법’과 그리스어의 ‘기뻐하심/선하신 뜻’ 사이의 긴장을 한쪽으로 과도하게 좁히지 않기 위해, 문맥상 ‘정해진 판단’의 뜻을 지닌 ‘결정’을 택했습니다.
- source_word: שאול / ᾅδου
