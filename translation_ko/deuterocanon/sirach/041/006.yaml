  text: The dominion of evil is from the child of injustice, and disgrace is always with his offspring.
  footnotes:
  - marker: a
    text: 'Greek: ''The inheritance of sinners'' children will perish, and with their offspring reproach will continue.'' The Hebrew surviving here is difficult, especially in the second clause, but it points in the same general direction of lasting shame upon the descendants of the unjust.'
    reason: alternative_reading
translation:
  language: ko
  text: 불의의 자식에게서 악의 통치가 나오며, 수치는 언제나 그의 자손과 함께합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '그리스어: ‘죄인들의 자녀의 유산은 사라지고, 그들의 자손과 함께 치욕은 계속됩니다.’ 히브리어 전승은 특히 두 번째 절이 난해하지만, 후손에게 지속되는 수치라는 같은 방향을 가리킵니다.'
    reason: alternative_reading
lexical_decisions:
- source_word: מבן עול
  english_pob_choice: from the child of injustice
  chosen_korean: 불의의 자식에게서
  alternatives_korean:
  - 불의의 아들에게서
  - 불의의 아이에게서
  - 불의한 자에게서
  lexicon: HALOT
  rationale: בן을 자연스러운 한국어로 옮기면서도 단수 인물을 유지해야 하므로 ‘자식’을 택했습니다. עול은 단순한 고난이 아니라 도덕적 불의/불의를 가리키므로 ‘불의’로 옮겼습니다.
- source_word: ממשלת רע
  english_pob_choice: the dominion of evil
  chosen_korean: 악의 통치가
  alternatives_korean:
  - 악한 통치가
  - 악의 지배가
  - 악한 지배가
  lexicon: HALOT
  rationale: ממשלה의 ‘통치/지배/지배권’ 의미를 살리고, רע를 명사적으로 처리한 영어의 genitive 구조에 맞추어 ‘악의 통치’로 옮겼습니다.
- source_word: וריש עם
  english_pob_choice: and disgrace
  chosen_korean: 수치가
  alternatives_korean:
  - 치욕이
  - 모욕이
  - 수치와
  lexicon: HALOT
  rationale: 히브리어 전승이 난해하므로, 그리스어 병행구의 ὄνειδος(비난, 치욕, 수치)를 참고해 공적 수치를 뜻하는 ‘수치’로 안정화했습니다.
- source_word: זרעו תמיד
  english_pob_choice: always with his offspring
  chosen_korean: 그의 자손과 함께 항상 있습니다
  alternatives_korean:
  - 그의 자손에게 늘 있습니다
  - 그의 자손과 함께 계속 있습니다
  - 그의 후손에게 항상 있습니다
  lexicon: HALOT
  rationale: זרע는 후손/자손을 뜻하므로 ‘자손’이 자연스럽고, תמיד는 지속성을 나타내므로 ‘항상’으로 옮겼습니다.
theological_decisions:
- issue: 히브리어 난구절과 그리스어 병행구의 관계
  chosen_reading: 본문은 히브리어를 기본으로 하되, 난해한 두 번째 절은 그리스어의 ‘치욕/수치’ 의미를 반영하여 ‘수치’로 번역했습니다.
  alternative_readings:
  - 그리스어를 따라 ‘죄인들의 자손의 유산은 사라지고, 그들의 자손과 함께 치욕이 계속된다’라고 옮길 수 있습니다.
  - 히브리어를 더 직역해 불명확한 표현을 그대로 살릴 수도 있습니다.
  rationale: 이 절은 히브리어 전승이 불완전하거나 난해하므로, 원문 우선 원칙을 유지하면서도 병행 전승이 분명히 지지하는 의미를 반영해야 합니다.
  doctrine_reference: 'PHILOSOPHY.md: 히브리어 우선, 난구절은 그리스어 병행구로 의미를 보정'
