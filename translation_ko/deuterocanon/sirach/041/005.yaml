base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/041/005.yaml
  text: The children of the despised are an evil thing[c][b][a], and the offspring of a fool are in the terror of the wicked.
  footnotes:
  - marker: a
    text: Hebrew is difficult in the first line; the Greek parallel reads more like, 'Abominable children are the children of sinners.'
    reason: alternative_reading
  - marker: b
    text: The Greek parallel differs more strongly in the second line, reading approximately, 'and they keep company in the dwellings of the ungodly.'
    reason: alternative_reading
  - marker: c
    text: The older Masada witness for this area is fragmentary here; the Cairo Geniza Hebrew provides the main readable wording for this verse.
    reason: textual_variant
translation:
  language: ko
  text: 멸시받는 이의 자녀는 악한 것이며, 어리석은 자의 후손은 악인의 두려움 속에 있습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 첫 행은 난해합니다. 그리스어 평행본문은 대체로 “죄인들의 자녀는 가증한 자들입니다”에 가깝습니다.
    reason: alternative_reading
  - marker: b
    text: 둘째 행의 그리스어 평행본문은 더 크게 달라져, 대략 “그리고 그들은 악인들의 거처에 함께 어울립니다”로 읽힙니다.
    reason: alternative_reading
  - marker: c
    text: 이 대목의 옛 마사다 증거는 여기서 단편적이므로, 카이로 게니자 히브리어가 이 절의 주된 가독 본문입니다.
    reason: textual_variant
lexical_decisions:
- source_word: נין
  english_pob_choice: Children
  chosen_korean: 자녀
  alternatives_korean:
  - 아이들
  - 자손
  - 후손
  lexicon: HALOT
  rationale: נין은 자손/후손의 의미를 지니지만, 본문 첫 행의 ընդհանուր적인 후예 개념을 자연스럽게 살리기 위해 ‘자녀’를 택했습니다.
- source_word: נמאס דבר רעים
  english_pob_choice: are an evil thing
  chosen_korean: 악한 것이며
  alternatives_korean:
  - 악한 것입니다
  - 역겨운 것입니다
  - 나쁜 것입니다
  lexicon: HALOT
  rationale: 히브리어는 난해하지만, POB의 의미 판단처럼 강한 부정 평가를 유지하되 한국어에서는 ‘악한 것’으로 직역에 가까운 평가를 살렸습니다.
- source_word: נכד
  english_pob_choice: the offspring
  chosen_korean: 후손
  alternatives_korean:
  - 자손
  - 손자
  - 후예
  lexicon: HALOT
  rationale: נכד은 여기서 ‘손자’보다 넓은 후예/후손의 뜻으로 보이므로, 첫 행의 נין과 평행을 이루는 일반적 혈통 표현인 ‘후손’을 사용했습니다.
- source_word: במגור רשע
  english_pob_choice: in the terror of the wicked
  chosen_korean: 악인의 두려움 속에
  alternatives_korean:
  - 악인의 공포 속에
  - 악인들의 두려움 가운데
  - 악인이 두려워하는 가운데
  lexicon: HALOT
  rationale: מגור는 ‘두려움/공포/전율’을 뜻하므로, POB의 ‘terror’에 맞춰 ‘두려움 속에’로 옮겨 압박적 분위기를 유지했습니다.
theological_decisions:
- issue: 히브리어 본문이 난해한 첫 행과, 그리스어 평행본문의 더 강한 비난 어조 처리
  chosen_reading: 히브리어 본문을 기본으로 두되, 문맥상 ‘악한 것’이라는 강한 평가를 유지하여 그리스어의 부정적 톤과 조응하게 했습니다.
  alternative_readings:
  - ‘멸시받은 이의 자녀는 가증한 자들입니다’처럼 그리스어 쪽으로 더 기울인 번역
  - ‘멸시받은 이의 자녀는 나쁜 일입니다’처럼 완화된 번역
  rationale: 전승이 갈리는 자리이지만, 살아 있는 히브리어를 우선하면서도 그리스어가 증폭하는 강한 경고성을 지우지 않도록 했습니다.
  doctrine_reference: 'Sirach 번역 원칙: 현존 히브리어 우선, 그리스어는 통제 증거로 활용'
- issue: ‘악인의 두려움 속에 있습니다’의 구조를 시간적/상태적 의미로 풀지 않음
  chosen_reading: 상태 표현으로 직역해, 후손이 악인이 불러오는 공포의 영역 안에 놓여 있다는 뜻을 유지했습니다.
  alternative_readings:
  - ‘악인들 가운데 삽니다’처럼 그리스어 평행에 따른 해석
  - ‘악인을 두려워합니다’처럼 주체를 후손으로 돌리는 해석
  rationale: 히브리어 מגור רשע는 단순 거주보다 ‘두려움/공포’의 상태를 더 직접적으로 가리키므로, 그 긴장을 보존하는 쪽이 소스-직결적입니다.
  doctrine_reference: HALOT on מגור; Greek parallel as secondary control
