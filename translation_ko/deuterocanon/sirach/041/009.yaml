    text: 원문은 출생과 죽음 모두를 저주와 연결하는 병렬 구조입니다.
    reason: source_note
lexical_decisions:
- source_word: γεννηθήσεσθε / אם תולידו
  english_pob_choice: you are born
  chosen_korean: 태어나면
  alternatives_korean:
  - 태어날 것이면
  - 나게 되면
  lexicon: 출생/태어나다
  rationale: 히브리어와 그리스어 병행이 모두 ‘태어남’을 가리키므로, 한국어에서는 자연스러운 출생 표현인 ‘태어나다’를 사용해 결과 구문을 살렸습니다.
- source_word: εἰς κατάραν / לקללה
  english_pob_choice: for a curse / to a curse
  chosen_korean: 저주는 받으려고
  alternatives_korean:
  - 저주를 위해
  - 저주로
  - 저주에
  lexicon: κατάρα
  rationale: 단순한 상태표시보다 목적·귀착을 드러내는 ‘~받으려고’로, 출생의 목적성이 아니라 저주에 귀속되는 운명을 표현했습니다.
- source_word: μερισθήσεσθε
  english_pob_choice: you will be allotted
  chosen_korean: 배정될 것입니다
  alternatives_korean:
  - 할당될 것입니다
  - 배당될 것입니다
  - 나뉘어질 것입니다
  lexicon: μερίζω
  rationale: 본문의 핵심은 ‘몫으로 배정됨’이므로, 전통적 문어체보다 의미가 분명한 ‘배정되다’를 택했습니다.
theological_decisions:
- issue: 저주가 출생과 죽음 모두에 연결되는 강한 운명 진술
  chosen_reading: 출생과 죽음이 모두 ‘저주에 배정됨’으로 병렬되도록 직설적으로 옮겼습니다.
  alternative_readings:
  - 완곡하게 ‘불행하게 될 것입니다’로 약화
  - 설명적으로 의역해 저주의 반복을 줄임
  rationale: 히브리어와 그리스어 모두 저주를 반복해 강조하므로, 수위를 낮추지 않고 본문의 경고성을 그대로 드러내는 것이 합당합니다.
  doctrine_reference: 집회서의 지혜 경고 문맥
