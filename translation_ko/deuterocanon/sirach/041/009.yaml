  text: And if you are born, you will be born for a curse; and if you die, you will be allotted to a curse.
translation:
  language: ko
  text: 그리고 여러분이 태어나면, 저주는 받으려고 태어나는 것이며, 죽으면 저주에 배정될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
