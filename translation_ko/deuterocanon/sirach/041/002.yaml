base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/041/002.yaml
  text: O death, how fitting is your sentence for a man who is needy and lacking strength, stumbling in everything, defiant, and having lost hope.
translation:
  language: ko
  text: 오, 죽음이여, 네 판결은 궁핍하고 힘이 부족한 사람, 모든 일에서 비틀거리는 사람, 반항적인 사람, 그리고 희망을 잃은 사람에게 얼마나 합당합니까.[a]
  philosophy: formal
  footnotes:
  - marker: a
    text: 호격으로 부르는 수사적 표현입니다.
    reason: korean_style_note
lexical_decisions:
- source_word: מות / θάνατε
  english_pob_choice: death
  chosen_korean: 죽음
  alternatives_korean:
  - 사망
  - 죽음이여
  lexicon: death
  rationale: 호격으로 부르는 인격화된 표현을 살리기 위해 ‘죽음이여’를 썼고, 대상 자체는 ‘죽음’으로 번역했습니다.
- source_word: חקיך / κρίμα
  english_pob_choice: sentence
  chosen_korean: 판결
  alternatives_korean:
  - 심판
  - 선고
  - 결정
  lexicon: sentence
  rationale: 여기서는 죽음의 ‘판결/선고’라는 법정적 뉘앙스가 살아야 하므로, 보다 일반적인 ‘심판’보다 ‘판결’이 적합합니다.
- source_word: איש אונים וחסר עצמה / ἀνθρώπῳ ἐπιδεομένῳ καὶ ἐλασσουμένῳ ἰσχύϊ
  english_pob_choice: a man who is needy and lacking strength
  chosen_korean: 궁핍하고 힘이 부족한 사람
  alternatives_korean:
  - 도움이 필요한 사람
  - 힘이 모자라는 사람
  - 빈곤하고 무력한 사람
  lexicon: needy / lacking strength
  rationale: 두 병렬 표현을 자연스러운 현대 한국어로 옮기되, 물질적·신체적 결핍의 중복을 유지했습니다.
- source_word: איש כושל ינקש בכל
  english_pob_choice: stumbling in everything
  chosen_korean: 모든 일에서 비틀거리는 사람
  alternatives_korean:
  - 모든 일에서 넘어지는 사람
  - 매사에 흔들리는 사람
  lexicon: stumbling
  rationale: 히브리어와 그리스어의 계속되는 무기력·불안정을 ‘비틀거리는’으로 옮겨, 단순한 실패보다 지속적인 취약성을 드러냈습니다.
- source_word: סורב / ἀπειθοῦντι
  english_pob_choice: defiant
  chosen_korean: 반항적인 사람
  alternatives_korean:
  - 불순종하는 사람
  - 완강한 사람
  - 고집 센 사람
  lexicon: defiant
  rationale: 개정된 영어 선택인 ‘defiant’의 저항적 태도를 반영해, 도덕적 완곡어인 ‘불순종’보다 ‘반항적인’이 더 직접적입니다.
- source_word: אובד תקוה / ἀπολωλεκότι ὑπομονήν
  english_pob_choice: having lost hope
  chosen_korean: 희망을 잃은 사람
  alternatives_korean:
  - 소망을 잃은 사람
  - 인내를 잃은 사람
  lexicon: hope
  rationale: 히브리어의 ‘희망’과 그리스어의 ‘인내’ 사이 긴장을 고려했지만, 본문과 POB의 최종 선택을 따라 ‘희망을 잃은’으로 번역했습니다.
theological_decisions:
- issue: 죽음에 대한 호격과 인격화
  chosen_reading: ‘오, 죽음이여’로 죽음을 직접 부르는 수사적 호격을 유지했습니다.
  alternative_readings:
  - 그냥 ‘죽음’으로 평서화
  - ‘죽음아’ 같은 구어적 호격
  rationale: 지혜문학의 수사적 강도를 살리면서도 현대 한국어에서 문어체 품위를 유지하기 위해 호격을 분명히 드러냈습니다.
  doctrine_reference: 문학적 인격화와 수사학적 호격
- issue: ‘defiant’의 도덕적 톤
  chosen_reading: ‘반항적인’으로 번역해 단순한 무능이 아니라 의도적 저항의 뉘앙스를 보존했습니다.
  alternative_readings:
  - 불순종하는
  - 고집 센
  rationale: 영어 POB의 수정이 ‘defiant’를 확정하므로, 이 항목은 행동의 방향성이 드러나는 표현으로 옮기는 것이 본문 의도에 더 가깝습니다.
  doctrine_reference: 지혜문학의 도덕적 진술
