base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/041/018.yaml
  text: Before a master and mistress[a], be ashamed of a lie; before an assembly and the people, of transgression; before a companion and a friend, of wrongdoing; and where you sojourn[c][b], of theft.
  footnotes:
  - marker: a
    text: Hebrew reads 'master and mistress'; the Greek parallel has 'judge and ruler.' The main text follows the Hebrew as the primary witness for extant Hebrew Sirach.
    reason: textual_variant
  - marker: b
    text: Hebrew מעל can also be rendered 'trespass' or 'breach of trust.'
    reason: lexical_alternative
  - marker: c
    text: 'The final Hebrew phrase is difficult: literally something like ''from/at the place where you dwell, concerning זר.'' The Greek parallel points toward ''theft/stealing,'' which is reflected in the main text.'
    reason: textual_variant
translation:
  language: ko
  text: 주인과 주부 앞에서는 거짓말 때문에 부끄러워하십시오. 회중과 백성 앞에서는 범법 때문에, 동료와 친구 앞에서는 악행 때문에, 그리고 머무는 곳에서는 도둑질 때문에 부끄러워하십시오.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 ‘주인과 주부’로 읽히며, 그리스어 평행본문은 ‘재판관과 통치자’로 다릅니다. 주 본문은 현존하는 히브리어 증거를 따릅니다.
    reason: textual_variant
  - marker: b
    text: מעל은 ‘범법’ 외에도 ‘배신’이나 ‘신의 위반’으로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 마지막 히브리어 구절은 난해하지만, 그리스어 평행본문은 이 항목을 절도와 연결하는 방향을 보여 줍니다.
    reason: textual_variant
lexical_decisions:
- source_word: מאדון וגברת
  english_pob_choice: Before a master and mistress
  chosen_korean: 주인과 주부 앞에서는
  alternatives_korean:
  - 주인과 안주인 앞에서는
  - 주인과 여주인 앞에서는
  lexicon: HALOT
  rationale: 히브리어는 ‘주인과 주부’의 평행쌍을 분명히 가리키므로, 그 사회적 관계를 직접 살렸습니다. ‘앞에서는’은 מן/מ־의 위치적 표현을 한국어의 자연스러운 경계 표현으로 옮긴 것입니다.
- source_word: מעדה ועם
  english_pob_choice: before an assembly and the people
  chosen_korean: 회중과 백성 앞에서는
  alternatives_korean:
  - 집회와 백성 앞에서는
  - 모임과 백성 앞에서는
  lexicon: HALOT
  rationale: עדה는 넓게 ‘회중/집회’를 뜻하므로, 여기서는 종교적 뉘앙스를 과도하게 좁히지 않는 ‘회중’을 택했습니다. ‘백성’은 ועם의 평행을 살립니다.
- source_word: על פשע
  english_pob_choice: of transgression
  chosen_korean: 범법 때문에
  alternatives_korean:
  - 범죄 때문에
  - 허물 때문에
  lexicon: HALOT
  rationale: פשע는 단순한 실수보다 규범을 어기는 ‘범법/반역’의 무게가 있어, 한국어로는 ‘범법’이 가장 직접적입니다. 문맥상 부끄러워해야 할 사유를 자연스럽게 나타내기 위해 ‘때문에’로 풀었습니다.
- source_word: על מעל
  english_pob_choice: of wrongdoing
  chosen_korean: 악행 때문에
  alternatives_korean:
  - 배신 때문에
  - 부정 때문에
  - 횡령 때문에
  lexicon: HALOT
  rationale: מעל은 ‘배신/배임/신의 위반’까지 가능하지만, 이 절의 사회적 죄 목록에서는 특정 법적 범죄로 한정하기보다 더 넓은 ‘악행’이 적절합니다. 필요한 경우 더 좁은 의미는 주석적 대안으로 남길 수 있습니다.
- source_word: וממקום תגור
  english_pob_choice: and where you live
  chosen_korean: 그리고 머무는 곳에서는
  alternatives_korean:
  - 그리고 거처하는 곳에서는
  - 그리고 임시로 머무는 곳에서는
  - 그리고 네가 사는 곳에서는
  lexicon: HALOT
  rationale: תגור는 ‘거주하다/나그네로 머물다’의 범위를 가지므로, ‘머무는 곳’이 본문의 유동적 의미를 살립니다. 출애굽기적 거류의 뉘앙스를 강제하지 않으면서도, ‘where you live’보다 원문에 더 가깝습니다.
- source_word: על זר
  english_pob_choice: of theft
  chosen_korean: 도둑질 때문에
  alternatives_korean:
  - 남의 물건에 관한 일 때문에
  - 낯선 것 때문에
  - 남의 것을 훔친 일 때문에
  lexicon: HALOT
  rationale: 히브리어 זר는 여기서 난해하지만, 그리스어 평행본문이 절도의 방향을 지지합니다. 따라서 본문 이해에 유리한 ‘도둑질’로 옮기되, 원문의 어려움은 주석에서 추적할 수 있게 남깁니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 평행본문의 최종 항목 해석
  chosen_reading: 본문은 ‘도둑질’로 이해하여 번역했습니다.
  alternative_readings:
  - ‘남의 것’ 또는 ‘낯선 것’에 대한 일
  - ‘외인/낯선 사람’과 관련된 일
  rationale: 히브리어 זר는 난해하지만, 같은 절의 그리스어 평행본문이 ἀδικία/도둑질 계열이 아니라 이 문맥의 마지막 항목을 절도로 읽게 하는 방향을 제공합니다. 그래서 주 본문은 한국어 독자가 즉시 이해할 수 있는 ‘도둑질’로 제시했습니다.
  doctrine_reference: 본문비평 및 사본 대조 원리
- issue: ‘머무는 곳’의 거주/체류 뉘앙스
  chosen_reading: ‘머무는 곳’은 거주와 체류를 함께 담는 중립적 표현으로 유지했습니다.
  alternative_readings:
  - ‘사는 곳’
  - ‘나그네로 머무는 곳’
  rationale: תגור의 어근은 단순 거주보다 나그네적 체류를 포함할 수 있지만, 이 절은 교훈 목록으로서 일반적 경고를 주므로 특정 신학적 함의를 과잉 부여하지 않는 중립적 표현이 적절합니다.
  doctrine_reference: 본문어휘의 의미 범위
