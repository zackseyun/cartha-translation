translation:
  language: ko
  text: 다른 사람의 아내의 얼굴을 유심히 바라보거나 그녀의 여종에게 다가가는 일을 부끄러워하십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 זרה는 ‘낯선 여인’ 또는 ‘외국 여인’으로도 옮길 수 있습니다. 그러나 헬라어 평행본문은 ‘남편 있는 여자’를 가리키므로, 여기서는 ‘다른 사람의 아내’로 옮겼습니다.
    reason: alternative_reading
