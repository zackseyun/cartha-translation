  source_fidelity: 히브리어 מהביט אל פני זרה 및 헬라어 평행본문의 γυναικὸς ὑπάνδρου는, 금지되거나 부적절한 대상으로 여겨지는 혼인한 여인을 바라보는 일을 가리키는 것으로 읽을 수 있습니다. 다만 히브리어 זרה 자체에는 ‘낯선/외국 여인’이라는 더 넓은 의미 가능성이 남아 있으므로 각주로 보존하는 것이 적절합니다. ומהתקרב אל שפחתה는 그 여인의 여종에게 가까이 다가가는 것을 뜻합니다.
  naturalness: 현 번역은 절(節)의 명사구를 종결 서술어 ‘말합니다’에 부자연스럽게 연결하며, 원문에 없는 발화 행위를 도입합니다. 한국어에서는 이 문맥의 금지·수치 목록을 자연스럽게 표현하도록 ‘…하는 일을 부끄러워하십시오’로 옮기는 것이 적절합니다.
  terminology: ‘다른 사람의 아내’는 헬라어 평행본문의 구체적 의미를 반영하며, ‘여종’은 שפחתה의 사회적 종속 관계와 성별을 보존합니다. ‘응시하다’는 단순한 보다보다 강할 수 있으므로, 원문의 관찰/주시와 문맥의 부적절성을 함께 살리는 ‘유심히 바라보다’를 사용했습니다.
