translation:
  language: ko
  text: 사람의 몸은 덧없지만, 인자한 이름은 끊어지지 않습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 병행본문은 ‘죄인들의 이름, 곧 좋지 않은 이름은 지워질 것입니다’로 읽습니다. 히브리어 증거는 ‘인자함의 이름은 끊어지지 않습니다’에 해당합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הבל
  english_pob_choice: vanity
  chosen_korean: 허무
  alternatives_korean:
  - 헛됨
  - 바람
  - 공허
  lexicon: HALOT
  rationale: 지혜문학의 통상적 의미인 덧없음과 실체 없음에 맞추어, 현대 한국어에서 자연스러운 ‘허무’를 택했습니다. ‘바람’은 직역감이 강하고, ‘헛됨’은 다소 설명적입니다.
- source_word: בגויתו
  english_pob_choice: body
  chosen_korean: 몸
  alternatives_korean:
  - 시체
  - 육체
  - 몸뚱이
  lexicon: HALOT
  rationale: 문맥상 생물학적 ‘몸’을 가리키며, 존재의 덧없음과 명성의 지속을 대조하므로 ‘몸’이 가장 자연스럽습니다. ‘시체’는 죽음을 과도하게 특정합니다.
- source_word: חסד
  english_pob_choice: kindness
  chosen_korean: 은혜로운
  alternatives_korean:
  - 인자한
  - 자비로운
  - 선한
  lexicon: HALOT
  rationale: 히브리어 חסד는 단순한 예의가 아니라 호의, 선의, 은혜의 뉘앙스를 가집니다. 한국어에서는 명사를 그대로 옮기기보다 수식어로 풀어 ‘이름’의 긍정적 성격을 살렸습니다.
- source_word: לא יכרת
  english_pob_choice: will not be cut off
  chosen_korean: 끊어지지 않습니다
  alternatives_korean:
  - 잘리지 않습니다
  - 끊기지 않습니다
  - 없어지지 않습니다
  lexicon: HALOT
  rationale: 히브리어 관용구를 한국어 자연문으로 옮기되, 지속과 보존의 의미를 유지하기 위해 ‘끊어지지 않습니다’를 택했습니다. ‘잘리지 않습니다’는 직역성이 강하고, ‘없어지지 않습니다’는 칼로 자르는 이미지를 약화합니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행본문의 2행 차이
  chosen_reading: 히브리어를 따라 ‘은혜로운 이름은 끊어지지 않습니다’로 번역했습니다.
  alternative_readings:
  - '그리스어 병행본문: ‘죄인들의 이름은 좋은 것으로 지워지지 않을 것입니다’'
  - '그리스어 병행본문: ‘죄인들의 이름은 끝내 지워지지 않을 것입니다’'
  rationale: 시락서는 현존 히브리어 증거가 있을 때 그것을 우선하는 것이 본 프로젝트 원칙에 맞습니다. 여기서는 히브리어가 긍정적 평행구조를 주며, 그리스어는 의미가 다른 부정적 표현이므로 본문에는 히브리어를 따르고 차이는 각주로 남깁니다.
  doctrine_reference: 'PHILOSOPHY.md: 보존된 히브리어를 우선하고, 본문 전통 간 실제 차이는 숨기지 않습니다.'
