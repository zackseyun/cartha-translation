  source_fidelity: 본문의 ‘허무’와 ‘끊어지지 않습니다’는 히브리어 הבל 및 לא יכרת를 대체로 충실히 반영합니다. 그러나 그리스어 각주는 οὐκ가 ἐξαλειφθήσεται(‘지워질 것이다’)가 아니라 ἀγαθόν(‘좋은’)을 수식하는 구문을 잘못 반영했습니다. 그리스어는 ‘죄인들의 좋지 않은 이름은 지워질 것이다’라는 뜻입니다.
