  text: The good of life is a limited number of days[b][a], but the good of a name is days without number.
  footnotes:
  - marker: a
    text: 'Greek: ''and a good name will remain forever.'''
    reason: alternative_reading
  - marker: b
    text: '''Name'' here carries the sense of one''s reputation or remembered honor, not merely a personal label.'
