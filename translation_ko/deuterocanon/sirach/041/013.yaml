translation:
  language: ko
  text: 삶의 유익은 날 수가 제한되어 있지만, 이름의 유익은 날 수가 없습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '그리스어: ‘그리고 좋은 이름은 영원히 남을 것입니다.’'
