    reason: lexical_alternative
lexical_decisions:
- source_word: טובת חי
  english_pob_choice: The good of life
  chosen_korean: 삶의 유익
  alternatives_korean:
  - 삶의 좋음
  - 생명의 유익
  - 삶의 선
  lexicon: HALOT
  rationale: 히브리어의 טובת는 단순한 ‘좋음’보다 ‘유익/장점’의 뜻을 자연스럽게 담을 수 있어, 수식 관계를 살리면서도 현대 한국어에서 매끄럽게 옮겼습니다.
- source_word: ימי מספר
  english_pob_choice: a limited number of days
  chosen_korean: 날 수가 제한되어 있지만
  alternatives_korean:
  - 셀 수 있는 날들이지만
  - 제한된 날들이지만
  - 날 수가 얼마 되지 않지만
  lexicon: HALOT
  rationale: ימי מספר는 문자적으로 ‘숫자가 있는 날들’로, 셀 수 있음과 제한됨의 뉘앙스가 있습니다. ‘날 수가 제한되어 있지만’으로 옮겨 생애의 유한성을 분명히 했습니다.
- source_word: שם
  english_pob_choice: name
  chosen_korean: 이름
  alternatives_korean:
  - 평판
  - 명성
  - 명예
  lexicon: HALOT
  rationale: 히브리어 ‘이름’은 평판과 기억된 인격을 포함할 수 있지만, 본문은 시적 대구를 위해 구체적 표현을 유지하는 것이 적절하므로 기본어 ‘이름’을 살렸습니다.
- source_word: ימי אין מספר
  english_pob_choice: days without number
  chosen_korean: 날 수가 없습니다
  alternatives_korean:
  - 셀 수 없는 날들이 있습니다
  - 끝이 없는 날들입니다
  - 헤아릴 수 없는 날들입니다
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘숫자가 없는 날들’이므로, 한국어에서는 이를 자연스럽게 ‘날 수가 없습니다’로 압축해 셀 수 없음과 지속성을 동시에 드러냈습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행문의 차이
  chosen_reading: 본문은 히브리어의 ‘셀 수 없는 날들’이라는 대구를 따르고, 그리스어의 해석적 확장인 ‘영원히 남는다’는 본문에 넣지 않았습니다.
  alternative_readings:
  - 이름의 유익은 영원히 남습니다
  - 좋은 이름은 영원합니다
  rationale: 이 절은 히브리어 본문이 분명하게 보존되어 있어 이를 우선해야 합니다. 그리스어는 의미를 풀어 ‘영원히’로 명시하지만, 본문은 히브리어의 절제된 시적 표현을 유지하는 편이 소스 충실성에 더 적합합니다.
  doctrine_reference: 'PHILOSOPHY.md: Sirach는 히브리어가 남아 있을 때 히브리어를 मुख्य 본문으로 삼고, 그리스어는 보조적 해석으로 사용합니다.'
