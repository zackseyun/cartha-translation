  source_fidelity: 히브리어 חכמה טמונה ואוצר מוסתר를 ‘숨겨진 지혜와 감춰진 보물’로 옮긴 것은 정확합니다. מה תועלה בשתיהם는 두 항목이 감추어져 있을 때의 무익함을 묻는 수사 의문문이며, 한국어에서는 두 항목을 주어로 삼아 자연스럽게 표현할 수 있습니다. 그리스어에만 있는 서두를 각주로 처리한 것도 히브리어 본문 증거를 우선하는 적절한 방식입니다.
