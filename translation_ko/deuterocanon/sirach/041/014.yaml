base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/041/014.yaml
  text: Hidden wisdom and a concealed treasure—what benefit is there in either of them?[a][b]
  footnotes:
  - marker: a
    text: Literally, 'what benefit is there in both of them?' The English 'either of them' brings out the rhetorical sense in natural English.
    reason: lexical_alternative
  - marker: b
    text: 'The Greek parallel adds an introductory line: ''Keep instruction in peace, children,'' before ''hidden wisdom and an unseen treasure…'' The Hebrew witness used for the main translation begins with this line about hidden wisdom.'
    reason: textual_variant
translation:
  language: ko
  text: 숨겨진 지혜와 감춰진 보물은—그 둘에 무슨 유익이 있습니까?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 בשתיהם는 문자적으로는 ‘그 둘 안에/둘 모두에’에 가깝습니다. 한국어에서는 수사적 의미를 살려 ‘그 둘에’로 옮겼습니다.
    reason: alternative_reading
  - marker: b
    text: 그리스어 평행본문은 ‘평화 가운데 교훈을 지키라, 아이들아’라는 서두를 더한 뒤 ‘숨겨진 지혜와 드러나지 않은 보물…’로 이어집니다. 본 번역은 히브리어 증거를 따릅니다.
    reason: textual_variant
lexical_decisions:
- source_word: חכמה
  english_pob_choice: wisdom
  chosen_korean: 지혜
  alternatives_korean:
  - 슬기
  - 지식
  lexicon: HALOT
  rationale: 히브리어 חכמה는 여기서 가치 있는 지혜를 가리키며, 한국어로는 문맥상 가장 자연스럽고 정확한 ‘지혜’가 맞습니다.
- source_word: טמונה
  english_pob_choice: hidden
  chosen_korean: 숨겨진
  alternatives_korean:
  - 감춰진
  - 은닉된
  lexicon: HALOT
  rationale: 분사 טמונה는 드러나지 않게 감추어진 상태를 뜻하므로, 현대 한국어에서 간결하고 자연스러운 ‘숨겨진’이 적절합니다.
- source_word: מוסתר
  english_pob_choice: concealed
  chosen_korean: 감춰진
  alternatives_korean:
  - 숨겨진
  - 은폐된
  lexicon: HALOT
  rationale: 앞선 ‘숨겨진’과 평행을 이루되 동일어 반복을 피하기 위해, 두 번째 형용사는 ‘감춰진’으로 옮겨 히브리어의 시적 병행을 살렸습니다.
- source_word: מה תועלה
  english_pob_choice: what benefit is there
  chosen_korean: 무슨 유익이 있습니까
  alternatives_korean:
  - 무슨 فائد이 있습니까
  - 무슨 소용이 있습니까
  lexicon: HALOT
  rationale: 관용적 수사 의문문으로서 실질적 이익을 묻는 표현이므로, 직역보다 자연스럽게 ‘무슨 유익이 있습니까’로 옮겼습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 평행문의 차이
  chosen_reading: 본문은 히브리어 전승을 따라 ‘숨겨진 지혜와 감춰진 보물’만 번역하고, 그리스어의 서두 ‘아이들아, 평화 가운데 교훈을 지키라’는 본문 주석으로 처리하지 않았습니다.
  alternative_readings:
  - 그리스어 평행문의 서두까지 본문에 포함하는 읽기
  rationale: 이 절의 मुख्य 본문은 사용된 히브리어 증거가 시작하는 구절을 따르는 것이며, 그리스어는 병행 증거로서만 확인됩니다.
  doctrine_reference: 본문 증거 우선 원칙, 변이 전승 처리
- issue: 숫자 표현의 자연스러운 한국어화
  chosen_reading: ‘그 둘에’로 옮겨 히브리어 בשתיהם의 복수 관계를 보존하되, 한국어 수사문답으로 자연스럽게 처리했습니다.
  alternative_readings:
  - ‘둘 다에’
  - ‘양쪽에’
  rationale: 원문의 ‘둘’(두 항목 전체)을 분명히 드러내면서도, ‘무슨 유익이 있습니까’라는 수사적 질문의 흐름을 살리기 위한 선택입니다.
  doctrine_reference: 수사적 평행법 보존
