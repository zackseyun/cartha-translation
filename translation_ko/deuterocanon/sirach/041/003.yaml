base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/041/003.yaml
  text: Do not fear the decree of your death[c][b][a]; remember that those before and those after are with you.
  footnotes:
  - marker: a
    text: 'Hebrew: ''Do not fear from death, your decree/appointed lot''; the Greek parallel reads ''Do not fear the judgment of death.'' The main text reflects the likely combined sense.'
    reason: alternative_reading
  - marker: b
    text: '''Those before and those after are with you'' means that the same fate is shared by earlier and later people alike.'
    reason: lexical_alternative
  - marker: c
    text: Masada preserves this section only fragmentarily; the Cairo Geniza Hebrew here is fuller, while the Greek helps clarify the compressed phrase about death.
    reason: textual_variant
translation:
  language: ko
  text: 당신에게 정해진 죽음의 판결을 두려워하지 마십시오[a][c][b]. 먼저 살았던 이들과 뒤에 올 이들이 다 당신과 함께 있음을 기억하십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘죽음’과 ‘당신의 정해진 몫/규정’을 압축하여 말하며, 헬라어 평행본문은 이를 ‘죽음의 판결’로 풀이합니다.
    reason: source_note
  - marker: b
    text: ‘먼저 살았던 이들과 뒤에 올 이들’은 앞선 사람들과 뒤에 올 사람들 모두가 같은 죽음의 운명을 공유한다는 뜻입니다.
    reason: lexical_alternative
  - marker: c
    text: 마사다 본문은 이 대목이 부분적으로만 남아 있어, 여기서는 카이로 게니자 히브리어와 헬라어 평행본문을 함께 참고했습니다.
    reason: textual_variant
lexical_decisions:
- source_word: אל תפחד
  english_pob_choice: Do not fear
  chosen_korean: 두려워하지 마십시오
  alternatives_korean:
  - 무서워하지 마십시오
  - 겁내지 마십시오
  lexicon: HALOT
  rationale: פחד의 금지 명령을 현대 합쇼체의 직접 권면으로 옮겼습니다. 지혜문학의 경고문 톤을 유지하면서도 자연스럽고 엄숙한 표현입니다.
- source_word: ממות חקיך / κρίμα θανάτου
  english_pob_choice: the decree of your death
  chosen_korean: 죽음의 판결
  alternatives_korean:
  - 죽음의 결정
  - 죽음의 선고
  - 당신의 죽음의 판결
  lexicon: HALOT; Greek parallel κρίμα
  rationale: 히브리어는 압축되어 있고 헬라어 평행본문은 '죽음의 판결/심판'을 분명히 합니다. 한국어에서는 관용적으로 자연스러운 '죽음의 판결'로 옮겨 본문이 가리키는 운명적·재판적 의미를 살렸습니다.
- source_word: ראשנים ואחרנים
  english_pob_choice: those before and those after
  chosen_korean: 앞선 이들과 뒤에 올 이들
  alternatives_korean:
  - 먼저 온 이들과 뒤에 올 이들
  - 이전 세대와 이후 세대
  - 앞사람들과 뒷사람들
  lexicon: HALOT
  rationale: 직역적인 '먼저/나중'의 대조를 유지하되, 지혜문맥에서의 시간적 연속성을 드러내기 위해 '앞선 이들/뒤에 올 이들'로 다듬었습니다.
- source_word: עמך
  english_pob_choice: are with you
  chosen_korean: 당신과 함께 있음을
  alternatives_korean:
  - 당신과 함께 있음을
  - 당신 곁에 있음을
  - 당신과 운명을 함께함을
  lexicon: HALOT
  rationale: עם의 기본 의미를 따라 '함께 있다'로 옮기되, 단순한 동행보다 같은 죽을 운명을 공유한다는 문맥상의 뉘앙스를 주석 없이도 읽히게 했습니다.
theological_decisions:
- issue: 히브리어의 압축된 '죽음' 표현과 헬라어의 '판결/심판' 표현을 어떻게 통합할지
  chosen_reading: '''죽음의 판결''로 번역하여 죽음의 필연성과 선고적 뉘앙스를 함께 드러냈습니다.'
  alternative_readings:
  - 죽음을 두려워하지 마십시오
  - 죽음의 선고를 두려워하지 마십시오
  - 죽음의 심판을 두려워하지 마십시오
  rationale: 히브리어 본문은 간결하지만, 평행 헬라어가 법정적 의미를 보강합니다. 본문을 평준화하지 않고 두 전승의 긴장을 함께 보존하는 쪽이 POB 원칙에 맞습니다.
  doctrine_reference: 'PHILOSOPHY.md: Hebrew Sirach primacy with Greek parallel as clarifying translation input'
