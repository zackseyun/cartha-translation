  chosen_reading: '''죽음의 판결''로 번역하여 죽음의 필연성과 선고적 뉘앙스를 함께 드러냈습니다.'
  alternative_readings:
  - 죽음을 두려워하지 마십시오
  - 죽음의 선고를 두려워하지 마십시오
  - 죽음의 심판을 두려워하지 마십시오
  rationale: 히브리어 본문은 간결하지만, 평행 헬라어가 법정적 의미를 보강합니다. 본문을 평준화하지 않고 두 전승의 긴장을 함께 보존하는 쪽이 POB 원칙에 맞습니다.
