base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/041/016.yaml
  text: 'Instruction in shame: hear[a], sons, and be ashamed according to my judgments. Not every shame is fitting to keep[b], and not every disgrace is rightly chosen.'
  footnotes:
  - marker: a
    text: 'Greek parallel: ''Therefore be ashamed at my word; for it is not good to preserve every shame, and not everything is approved by all in faith.'' The Greek final clause differs notably from the extant Hebrew.'
    reason: alternative_reading
  - marker: b
    text: '''Sons'' renders the masculine Hebrew address and preserves the wisdom-teacher''s form of speech.'
    reason: cultural_note
translation:
  language: ko
  text: '부끄러움에 관한 훈계: 아들들아, 들으십시오. 내 판단에 따라 부끄러워하십시오.[a] 모든 부끄러움이 간직할 만한 것은 아니며, 모든 수치가 택할 만한 것도 아닙니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 평행본문은 “그러므로 내 말에 부끄러워하십시오. 모든 부끄러움을 간직하는 것이 좋은 것은 아니며, 모든 것이 믿음 안에서 모든 사람에게 인정받는 것도 아닙니다”라고 달리 전합니다.
    reason: textual_variant
lexical_decisions:
- source_word: מוסר בשת
  english_pob_choice: Instruction in shame
  chosen_korean: 지혜로운 훈계는 부끄러움 속에서 있습니다
  alternatives_korean:
  - 부끄러움에 관한 훈계는 있습니다
  - 부끄러움에 대한 교훈이 있습니다
  lexicon: HALOT
  rationale: מוסר은 지혜문학에서 단순한 처벌보다 훈계·교훈의 성격이 강하고, בשת와 결합해 제목처럼 기능하므로 한국어에서는 자연스럽게 ‘지혜로운 훈계는 부끄러움 속에서 있습니다’로 풀어 시작 구조를 살렸습니다.
- source_word: שמעו בנים
  english_pob_choice: hear, sons
  chosen_korean: 아들들아, 들으십시오
  alternatives_korean:
  - 들으십시오, 아들들아
  - 자녀들아, 들으십시오
  lexicon: HALOT
  rationale: 히브리어의 남성 복수 호격을 살려 ‘아들들아’로 옮겼고, 지혜문학의 권면 어조에 맞게 ‘들으십시오’를 택했습니다.
- source_word: והכלמו על משפטי
  english_pob_choice: be ashamed according to my judgments
  chosen_korean: 내 판결에 따라 부끄러워하십시오
  alternatives_korean:
  - 내 판결을 따라 수치를 느끼십시오
  - 내 판단에 따라 부끄러워하십시오
  lexicon: HALOT
  rationale: משפטי는 단순한 ‘법규’보다 화자의 판결·판정에 가깝기 때문에 ‘판결’로 옮겼고, הכלמו의 수동/권고적 의미를 한국어 명령형 ‘부끄러워하십시오’로 반영했습니다.
- source_word: לא כל בשת נאה לשמור
  english_pob_choice: Not every shame is fitting to keep
  chosen_korean: 모든 부끄러움이 지켜 둘 만한 것은 아니며
  alternatives_korean:
  - 모든 부끄러움이 지킬 만한 것은 아니며
  - 모든 수치가 간직할 만한 것은 아니며
  lexicon: HALOT
  rationale: נאה는 ‘합당한/어울리는’의 뜻이므로 ‘지켜 둘 만한’으로 자연스럽게 풀었고, לשמור의 ‘지키다/보존하다’ 의미를 살렸습니다.
- source_word: ולא כל הכלם נבחר
  english_pob_choice: and not every disgrace is rightly chosen
  chosen_korean: 모든 수치가 택할 만한 것도 아닙니다
  alternatives_korean:
  - 모든 수치가 선택할 만한 것도 아닙니다
  - 모든 굴욕이 바람직한 것도 아닙니다
  lexicon: HALOT
  rationale: הכלם은 ‘수치/굴욕/부끄러움’의 범위가 있어 앞 절과의 변화를 살리되 한국어에서는 ‘수치’로 옮겨 반복을 줄였고, נבחר는 선택·선정의 의미를 유지해 ‘택할 만한’으로 반영했습니다.
theological_decisions:
- issue: 남성 호격 בנים의 처리
  chosen_reading: 아들들아
  alternative_readings:
  - 자녀들아
  - 아이들아
  rationale: 본문이 지혜교사의 직접적인 남성 복수 호격을 사용하므로 중성화하지 않고 원문 형식을 보존했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
- issue: 히브리어 본문과 그리스어 평행본문의 관계
  chosen_reading: 히브리어 본문을 본문으로 따르고, 그리스어는 참고 변이로만 보존
  alternative_readings:
  - 그리스어의 '내 말에 대하여 부끄러워하십시오…'를 본문에 더 가깝게 반영
  rationale: 현재 본문은 히브리어가 고신뢰로 보존되어 있으며, 그리스어는 마지막 절에서 의미가 달라지는 평행본문이므로 본문 번역은 히브리어를 따르고 변이는 주해적으로만 처리하는 것이 투명합니다.
  doctrine_reference: PHILOSOPHY.md §What we are translating; §transparent actually means
