base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/041/008.yaml
  text: Woe to you[a], wicked men[b], who have abandoned the law of the Most High.
  footnotes:
  - marker: a
    text: 'Greek parallel: ''the law of God Most High.'' The Hebrew primary witness reads simply ''the law of the Most High.'''
    reason: alternative_reading
  - marker: b
    text: Hebrew תורת can also be rendered 'instruction' or 'teaching,' though 'law' fits the covenantal sense here and is supported by the Greek νόμον.
    reason: lexical_alternative
translation:
  language: ko
  text: “너희에게 화가 있도다, 악한 사람들아, 너희가 가장 높으신 분의 율법을 버렸기 때문이다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 병행문은 ‘하나님의’가 들어간 ‘지극히 높으신 하나님’에 해당합니다. 히브리어 주요 증거는 본문처럼 더 짧게 ‘가장 높으신 분’이라고만 합니다.
    reason: textual_variant
  - marker: b
    text: 히브리어 תורת은 ‘율법’ 외에 ‘가르침’ 또는 ‘교훈’으로도 옮길 수 있지만, 여기서는 언약적 규범을 가리키는 뜻이 강합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אוי / οὐαί
  english_pob_choice: Woe
  chosen_korean: 화가 있도다
  alternatives_korean:
  - 슬프도다
  - 아아
  lexicon: HALOT; BDAG
  rationale: 예언적 경고와 탄식을 함께 지닌 감탄사로, 한국어에서는 ‘화가 있도다’가 가장 직접적으로 심판 선언의 강도를 살립니다.
- source_word: לכם / ὑμῖν
  english_pob_choice: to you
  chosen_korean: 너희에게
  alternatives_korean:
  - 너희를 향하여
  - 너희에게로
  lexicon: HALOT; BDAG
  rationale: 수신자 지시의 여격을 자연스럽게 살리되, 경고문의 직접성을 유지합니다.
- source_word: אנשי / ἄνδρες
  english_pob_choice: men
  chosen_korean: 사람들
  alternatives_korean:
  - 남자들
  - 남자 사람들
  lexicon: HALOT; BDAG
  rationale: 원문은 남성 복수형이지만, 한국어에서는 호명 구조상 ‘악한 사람들아’가 문맥상 더 자연스럽고, 본문의 공적 질책 기능을 잘 드러냅니다.
- source_word: תורת / νόμον
  english_pob_choice: the law
  chosen_korean: 율법
  alternatives_korean:
  - 가르침
  - 교훈
  lexicon: HALOT; BDAG
  rationale: תורה는 넓게는 ‘가르침’이 가능하지만, 여기서는 그리스어 νόμος와 함께 언약적·규범적 의미가 분명하므로 ‘율법’이 가장 적절합니다.
- source_word: עליון / θεοῦ Ὑψίστου
  english_pob_choice: the Most High
  chosen_korean: 가장 높으신 분
  alternatives_korean:
  - 지극히 높으신 분
  - 가장 높으신 하나님
  lexicon: HALOT; BDAG
  rationale: 히브리어 본문은 ‘가장 높으신 분’에 해당하는 קצר한 호칭만 두고 있어, 본문에 없는 ‘하나님’을 덧붙이지 않고 그대로 옮겼습니다.
theological_decisions:
- issue: 히브리어 본문의 קצר한 신칭과 그리스어 병행문의 확장(‘하나님의’) 처리
  chosen_reading: 본문에는 ‘가장 높으신 분’만 두고, 그리스어의 ‘하나님’은 본문에 반영하지 않았습니다.
  alternative_readings:
  - 가장 높으신 하나님
  - 지극히 높으신 하나님
  rationale: 시라 41:8의 히브리어 주요 증거가 더 짧은 형태를 전하므로, 본문에 없는 신학적 설명어를 보강하지 않고 원문 증거를 우선했습니다.
  doctrine_reference: 원문 우선 원칙; 병행본문이 암시하는 내용을 본문에 과잉투입하지 않음
