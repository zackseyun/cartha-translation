base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/041/001.yaml
  text: O death[a], how bitter is your remembrance to a man at ease in his possessions, to a man untroubled and prospering in everything[b], and still strong enough to enjoy pleasure.
  footnotes:
  - marker: a
    text: 'Hebrew: ''still having strength to receive pleasure''; the Greek parallel reads more specifically, ''still strong enough to receive food.'' The translation follows the likely sense reflected by the Greek.'
    reason: alternative_reading
  - marker: b
    text: The Hebrew phrase rendered 'at ease in his possessions' is somewhat uncertain; the Greek parallel supports the sense of a man living in peace with what he has.
    reason: textual_variant
translation:
  language: ko
  text: 오 죽음이여, 네 기억은 재산 가운데 편안한 사람에게, 모든 일에 걱정 없이 형통하며, 아직도 즐거움을 받아들일 힘이 있는 사람에게 얼마나 쓰라린가.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘즐거움’을 받을 힘으로 읽을 수 있지만, 그리스어는 더 구체적으로 ‘음식’을 받는 것으로 말합니다. 본문은 히브리어의 의미를 따르되 병행 본문의 차이를 반영합니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어 구절은 다소 불확실하지만, 그리스어는 ‘자기가 가진 것들 가운데 평안한’ 뜻을 분명히 뒷받침합니다.
    reason: textual_variant
lexical_decisions:
- source_word: מה מר זכרך / ὡς πικρόν σου τὸ μνημόσυνόν
  english_pob_choice: how bitter is your remembrance
  chosen_korean: 네 기억은 얼마나 쓰라린가
  alternatives_korean:
  - 너를 기억함은 얼마나 쓰라린가
  - 네 추억은 얼마나 쓰라린가
  lexicon: HALOT; BDAG
  rationale: 히브리어 זכרך와 그리스어 μνημόσυνον은 죽음 자체가 아니라 죽음을 떠올리는 기억/상기를 가리키므로, ‘기억’으로 직역하되 수사적 감탄을 살렸습니다.
- source_word: לאיש שוקט על מכונתו / ἐν τοῖς ὑπάρχουσιν αὐτοῦ
  english_pob_choice: to a man at ease in his possessions
  chosen_korean: 재산 가운데 편안한 사람에게
  alternatives_korean:
  - 소유한 것들 가운데 평안한 사람에게
  - 자기 소유에 안주한 사람에게
  lexicon: HALOT; BDAG
  rationale: 히브리어는 다소 불확실하지만 그리스어가 ‘자기가 가진 것들 가운데 평안한’ 뜻을 분명히 하므로, 재산/소유의 안정감을 드러내는 표현으로 옮겼습니다.
- source_word: איש שליו / ἀνδρὶ ἀπερισπάστῳ
  english_pob_choice: to a man untroubled
  chosen_korean: 걱정 없이
  alternatives_korean:
  - 근심 없이
  - 방해받지 않고
  lexicon: HALOT; BDAG
  rationale: שליו와 ἀπερίσπαστος는 한가함보다 ‘방해와 근심이 없는 안정’에 가깝기 때문에, 문맥에 맞는 자연스러운 한국어로 ‘걱정 없이’를 택했습니다.
- source_word: ומצליח בכל / καὶ εὐοδουμένῳ ἐν πᾶσιν
  english_pob_choice: and prospering in everything
  chosen_korean: 모든 일에 … 형통하며
  alternatives_korean:
  - 모든 일에 성공하며
  - 모든 일에 잘되어
  lexicon: HALOT; BDAG
  rationale: 히브리어와 그리스어 모두 전반적인 번영과 성공을 가리키므로, 한국어 성서 문맥에서 널리 이해되는 ‘형통하다’를 사용했습니다.
- source_word: ועוד בו חיל לקבל תענוג / καὶ ἔτι ἰσχύοντι ἐπιδέξασθαι τροφήν
  english_pob_choice: and still strong enough to enjoy food
  chosen_korean: 아직도 즐거움을 받아들일 힘이 있는 사람에게
  alternatives_korean:
  - 아직도 먹을 것을 받아들일 힘이 있는 사람에게
  - 아직도 양식을 받아들일 힘이 있는 사람에게
  lexicon: HALOT; BDAG
  rationale: 히브리어 תענוג는 ‘즐거움’을 뜻하고, 그리스어 τροφή는 ‘음식/양식’이지만 본문은 노년의 생명력과 향유 가능성을 함께 말하므로, 히브리어의 직접 의미를 살려 ‘즐거움’으로 옮겼습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행본문의 긴장 처리
  chosen_reading: 본문은 히브리어를 기본으로 하되, 불확실한 구절은 그리스어가 제시하는 의미 범위로 보완했습니다.
  alternative_readings:
  - 그리스어를 따라 ‘음식’을 명시하는 번역
  - 히브리어만 따라 ‘즐거움’을 유지하는 번역
  rationale: 집회서의 현존 히브리어는 부분적으로 불확실하므로, 병행 그리스어를 보조 증거로 사용하되 히브리어의 표현력을 지우지 않는 쪽이 가장 공정합니다.
  doctrine_reference: PHILOSOPHY.md ‘What we are translating’와 본 과제의 병행 본문 사용 지침
- issue: 남성 단수 일반표현의 유지
  chosen_reading: ‘사람’이라는 일반적 한국어를 쓰되, 원문의 איש/ἀνδρὶ는 그대로 반영했습니다.
  alternative_readings:
  - 성별 중립화한 ‘누구에게나’
  - ‘한 사람에게’로 완전 중립화
  rationale: 원문은 대표적 남성 단수를 사용하지만 대상은 일반 인간을 가리키므로, 과도한 성별 중립화 없이 자연스러운 한국어 문장으로 유지했습니다.
  doctrine_reference: DOCTRINE.md §4 Gender-accurate over gender-neutral
