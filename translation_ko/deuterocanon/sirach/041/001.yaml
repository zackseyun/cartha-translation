revisions:
- from: 오 죽음이여, 네 기억은 재산 가운데 편안한 사람에게, 모든 일에 걱정 없이 형통하며, 아직도 즐거움을 받아들일 힘이 있는 사람에게 얼마나 쓰라린가.[a][b]
  to: 죽음아, 자기가 가진 것들 가운데 평안히 지내고[b] 아무 근심 없이 모든 일에 형통하며 아직도 즐거움을 누릴 힘이 있는 사람에게, 당신을 기억하는 일이 얼마나 쓰라린가.[a]
  rationale: 직접 호격과 ‘죽음을 기억함’의 의미 관계를 분명히 하고, 소유 가운데 누리는 평안·근심 없음·전반적 형통·즐거움을 누릴 활력이라는 원문의 수식 연쇄를 자연스러운 합쇼체 한국어로 옮겼습니다. 히브리어와 그리스어의 마지막 어구 차이 및 불확실한 처지 표현은 각각 해당 어구에 붙인 각주로 보존했습니다.
