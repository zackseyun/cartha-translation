  source_fidelity: 히브리어의 직접 호격과 ‘기억’, 평안·번영·아직 남아 있는 힘의 연쇄를 보존해야 합니다. 마지막 תענוג는 ‘즐거움’으로 옮길 수 있으며, 그리스어 병행문의 τροφή(음식)는 각주에서 밝혀 두는 것이 적절합니다. 불확실한 מכונתו는 본문에서 그리스어의 보조를 받아 ‘자기가 가진 것들 가운데’로 자연스럽게 처리하되, 불확실성은 각주에 유지합니다.
  naturalness: 초안의 ‘재산 가운데 편안한 사람’, ‘즐거움을 받아들일 힘’은 현대 한국어에서 다소 직역투입니다. ‘자기가 가진 것들 가운데 평안히 지내고’ 및 ‘즐거움을 누릴 힘’이 자연스럽고 문맥에도 맞습니다. 같은 대상을 가리키는 반복된 ‘사람에게’는 한국어 문장에서는 하나의 수식 연쇄로 묶는 편이 매끄럽습니다.
  terminology: ‘죽음아’는 직접 호격을 자연스럽게 살리며, ‘당신을 기억하는 일’은 זכרך/μνημόσυνον이 뜻하는 죽음 자체가 아니라 죽음을 상기함을 명료하게 합니다. ‘형통하다’는 모든 일에서 잘됨을 나타내는 성서적이면서도 현대에 통용되는 표현입니다.
