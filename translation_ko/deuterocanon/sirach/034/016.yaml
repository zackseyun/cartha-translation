lexical_decisions:
- source_word: תמרורי רצון
  english_pob_choice: signs of favor
  chosen_korean: 호의의 표징들
  alternatives_korean:
  - 호의의 징표들
  - 은총의 표징들
  - 호의의 표시들
  lexicon: HALOT
  rationale: תמרורי는 눈에 보이는 표지나 징표를 가리키는 것으로 보고, רצון은 여기서 ‘호의/좋은 뜻’의 의미로 이해하여 ‘호의의 표징들’로 옮겼습니다. ‘은총’은 신학적 색채가 더 강하고, ‘표시’는 다소 약해 보여 피했습니다.
- source_word: הניחה
  english_pob_choice: set down
  chosen_korean: 내려놓았고
  alternatives_korean:
  - 놓았고
  - 두었고
  - 세웠고
  lexicon: HALOT
  rationale: הניחה의 구체적 동작성을 살리되, 시적 문맥에 맞게 자연스럽고 단정한 한국어로 ‘내려놓았고’를 택했습니다. 영어 POB의 ‘set down’처럼 의도적으로 손으로 내려놓는 느낌을 유지합니다.
- source_word: וצעקה ענן חשתה
  english_pob_choice: and a cry made the cloud hasten
  chosen_korean: 외침이 구름을 재촉하였습니다
  alternatives_korean:
  - 부르짖음이 구름을 서둘게 하였습니다
  - 외침이 구름을 hasten하게 하였습니다
  - 외침이 구름을 급히 움직이게 하였습니다
  lexicon: HALOT
  rationale: וצעקה를 명사적 ‘외침’으로 보고, חשתה의 ‘서두르게 하다/재촉하다’는 뜻을 한국어 동사 ‘재촉하다’로 표현했습니다. ‘구름’에 정관사는 없으므로 자연스러운 일반명사로 두었습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행본문의 큰 차이
  chosen_reading: 본문은 현존 히브리어를 따라 옮기고, 의미가 크게 다른 그리스어 전승은 각주로 보존합니다.
  alternative_readings:
  - 그는 무엇으로 붙들려 있습니까?
  - 그리고 그의 버팀목은 무엇입니까?
  rationale: 이 절은 히브리어와 그리스어가 실질적으로 다른 문장을 전하므로, 본문은 현존 히브리어를 우선하되 그리스어의 다른 의미 가능성을 숨기지 않는 것이 번역 윤리에 맞습니다.
  doctrine_reference: 'PHILOSOPHY.md: 현존 히브리어가 있으면 그 본문을 우선하고, 중대한 전승 차이는 투명하게 각주에 보존한다.'
