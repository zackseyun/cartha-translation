base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/034/030.yaml
  text: Drunkenness multiplies the anger of a foolish man into stumbling[a], diminishing strength and producing wounds.
  footnotes:
  - marker: a
    text: Or 'the anger of a fool leads to a stumbling block'; πρόσκομμα can denote an occasion for stumbling or downfall.
    reason: lexical_alternative
translation:
  language: ko
  text: 술 취함은 어리석은 사람의 분노를 더 크게 하여 그를 걸려 넘어지게 하고[a], 힘을 약화시키며 상처를 입힙니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘어리석은 사람의 분노를 걸림돌이 되게 하고’로도 옮길 수 있습니다. πρόσκομμα는 걸려 넘어짐, 또는 걸려 넘어지게 하는 것을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: μέθη
  english_pob_choice: drunkenness
  chosen_korean: 술 취함
  alternatives_korean:
  - 주취
  - 취함
  - 술에 취함
  lexicon: LSJ
  rationale: 명사 μέθη는 단순한 음주 행위가 아니라 취한 상태를 가리키므로, 현대 문체에서 자연스러우면서 상태를 분명히 드러내는 ‘술 취함’을 택했습니다.
- source_word: ἄφρονος
  english_pob_choice: of a foolish man
  chosen_korean: 어리석은 사람의
  alternatives_korean:
  - 어리석은 자의
  - 어리석은 이의
  - 어리석은 남자의
  lexicon: LSJ
  rationale: 그리스어 속격 단수 남성형의 대표적 지시를 살리되, 한국어에서는 성별을 불필요하게 강조하지 않는 ‘어리석은 사람의’로 옮겨 의미를 보존했습니다.
- source_word: εἰς πρόσκομμα
  english_pob_choice: into stumbling
  chosen_korean: 넘어져 걸려들게
  alternatives_korean:
  - 걸림돌이 되게
  - 넘어지게
  - 걸려 넘어지게
  lexicon: LSJ
  rationale: πρόσκομμα는 문자적으로 ‘걸려 넘어짐/걸림’의 이미지를 가지므로, 결과 상태를 살리면서도 한국어로는 동작성과 비유를 함께 드러내는 표현을 사용했습니다.
- source_word: προσποιοῦν
  english_pob_choice: producing
  chosen_korean: 상처를 냅니다
  alternatives_korean:
  - 상처를 만들어 냅니다
  - 상처를 일으킵니다
  - 상처를 만듭니다
  lexicon: LSJ
  rationale: 분사형이 덧붙는 해로운 결과를 나타내므로, 최종 결과를 자연스럽게 표현하는 ‘상처를 냅니다’를 택했습니다.
theological_decisions:
- issue: 어리석음과 술 취함의 인과를 직접적으로 드러내는지 여부
  chosen_reading: 문장의 흐름을 따라 술 취함이 어리석은 사람의 분노를 ‘넘어져 걸려들게’ 하는 결과를 그대로 살렸습니다.
  alternative_readings:
  - 술 취함은 어리석은 사람의 분노를 크게 합니다
  - 술 취함은 어리석은 사람을 걸려 넘어지게 합니다
  rationale: 원문은 술 취함이 분노를 증폭시키고 그 분노가 결국 걸려 넘어지는 결과로 이어진다는 지혜문학적 인과를 제시하므로, 도덕적 경고의 강도를 약화시키지 않도록 직설적으로 옮겼습니다.
  doctrine_reference: 시락 34:30의 지혜 경고 구조
- issue: 대표적 남성형의 처리
  chosen_reading: ἄφρονος를 성별 중립어로 평탄화하지 않고 ‘어리석은 사람’으로 옮겼습니다.
  alternative_readings:
  - 어리석은 자
  - 어리석은 사람
  rationale: 공식적으로는 남성 단수 대표형을 유지하되, 한국어에서는 과도한 남성 표지가 본문의 지혜 유형을 흐릴 수 있어 성별을 과도하게 드러내지 않는 표현을 선택했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
