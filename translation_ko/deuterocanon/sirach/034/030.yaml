  terminology: μέθη는 ‘술 취함’, θυμός는 ‘분노’, ἄφρων은 대표적 지혜 유형으로서 ‘어리석은 사람’, ἰσχύς는 ‘힘’, τραύματα는 ‘상처’로 옮기는 것이 적절합니다. πρόσκομμα의 해석상 여지는 각주로 유지합니다.
