translation:
  language: ko
  text: 그분은 정의의 하나님이시며, 그분께는 편파가 없으십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 번역은 남아 있는 히브리어 증거를 따릅니다. 제시된 스웨테 그리스어 평행본문은 “나는 여러 번 죽을 위험을 겪었으나, 이러한 일들 때문에 구원받았다”라는 다른 문장을 전하므로, 여기에는 본문 또는 절 번호의 불일치가 있습니다.
    reason: textual_variant
lexical_decisions:
- source_word: אלהי משפט
  english_pob_choice: a God of justice
  chosen_korean: 정의의 하나님
  alternatives_korean:
  - 공의의 하나님
  - 정의의 분이시며
  lexicon: HALOT
  rationale: גנ티브 구조를 한국어로는 ‘정의의 하나님’처럼 자연스럽게 옮겨, 하나님의 성품이 정의와 결부된다는 뜻을 간결하게 드러냈습니다.
- source_word: משפט
  english_pob_choice: justice
  chosen_korean: 정의
  alternatives_korean:
  - 심판
  - 공의
  lexicon: HALOT
  rationale: 이 문맥은 재판적·윤리적 성격을 함께 띠므로, 현대 한국어에서 그 힘을 가장 분명히 전달하는 ‘정의’를 선택했습니다.
- source_word: אין עמו
  english_pob_choice: with him there is no
  chosen_korean: 그분과 함께는 … 없습니다
  alternatives_korean:
  - 그분 안에는 … 없습니다
  - 그분에게는 … 없습니다
  lexicon: HALOT
  rationale: 히브리어 관용구를 직역하되 한국어 어순에 맞게 풀어, 하나님의 임재와 성품 안에 해당 요소가 없다는 뜻을 살렸습니다.
- source_word: משוא פנים
  english_pob_choice: partiality
  chosen_korean: 편파
  alternatives_korean:
  - 편애
  - 사람을 차별함
  - 치우침
  lexicon: HALOT
  rationale: 법정적·윤리적 맥락에서 ‘partiality’는 사람을 기준으로 치우치는 태도를 가리키므로, 간결하고 중립적인 ‘편파’가 가장 적절합니다.
theological_decisions:
- issue: 하나님의 성품을 나타내는 משפט의 번역
  chosen_reading: 정의
  alternative_readings:
  - 심판
  - 공의
  rationale: 이 절은 뇌물과 착취적 제사를 거부하는 근거로서 하나님의 성품을 진술하므로, ‘정의’가 독자에게 윤리적·재판적 의미를 가장 분명하게 전달합니다.
  doctrine_reference: 'DOCTRINE.md: key-term consistency, contextual exception'
- issue: 편파 없음의 표현을 법정적 의미로 유지할지 여부
  chosen_reading: 편파가 없습니다
  alternative_readings:
  - 사람을 차별하지 않으십니다
  - 사람을 외모로 판단하지 않으십니다
  rationale: 히브리어 관용구를 더 친숙한 설교체로 바꾸지 않고, 하나님께는 지위나 외적 조건에 따른 치우침이 없다는 원뜻을 보존했습니다.
  doctrine_reference: 'PHILOSOPHY.md: source-proximate rendering'
