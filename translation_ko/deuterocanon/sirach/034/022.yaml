  - 양식
  - 음식
  lexicon: LSJ
  rationale: ἄρτος의 기본적이고 구체적인 뜻을 살리면서, 한국어에서 일상적이고 직관적인 생존 식량 이미지를 주기 위해 ‘빵’을 택했습니다.
- source_word: ἐπιδεομένων
