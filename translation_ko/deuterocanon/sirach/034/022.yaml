  text: 궁핍한 이들의 빵은 가난한 사람들의 생명입니다[a]. 그것을 그들로부터 빼앗는 사람은 피의 사람입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘살인자’ 또는 ‘피를 흘린 죄가 있는 사람.’ 헬라어는 문자적으로 ‘피의 사람’이라고 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρτος
  english_pob_choice: Bread
  chosen_korean: 빵
  alternatives_korean:
