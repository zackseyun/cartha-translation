  - 피를 흘린 죄가 있는 사람
  rationale: 빵을 빼앗는 행위를 단순한 무례가 아니라 피흘림과 연관된 중대한 죄로 규정하는 원문의 도덕적 충격을 약화시키지 않기 위해서입니다.
  doctrine_reference: 혈죄와 윤리적 책임의 강한 진술을 보존
