review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the contrast between indispensable bread for those in need and the grave culpability of depriving the poor of it. However, ‘궁핍한 이들의 빵’ can naturally be read as bread owned by needy people rather than bread provided for them, and ‘피의 사람’ is not an established or natural Korean expression for the Greek idiom.
  naturalness: A modest revision makes the first clause idiomatic Korean and renders the final idiom in intelligible modern formal Korean without reducing its force.
  terminology: ‘빵’ appropriately retains the concrete sense of ἄρτος. ‘피 흘림의 죄를 지은 사람’ communicates the bloodguilt force of ἄνθρωπος αἱμάτων; the footnote preserves the Greek’s literal wording and alternatives.
  issues:
  - severity: medium
    issue: ‘궁핍한 이들의 빵’ is potentially possessive in Korean.
    rationale: The Greek expression denotes bread as the sustenance of people in need. Korean readers may understand the draft as referring specifically to bread that already belongs to needy people. ‘궁핍한 이들에게 빵은’ more clearly conveys the intended relation.
  - severity: medium
    issue: ‘피의 사람’ is overly literal and unnatural in contemporary Korean.
    rationale: Although it follows the Greek wording, it does not function as a recognizable Korean idiom. A rendering referring to guilt for bloodshed communicates the idiom’s force, while a footnote can retain the literal Greek expression.
  revised_text: 궁핍한 이들에게 빵은 가난한 이들의 생명입니다[a]. 그것을 그들에게서 빼앗는 사람은 피 흘림의 죄를 지은 사람입니다.
  revised_footnotes:
  - marker: a
    text: 또는 ‘살인자’ 또는 ‘피 흘림의 죄가 있는 사람’. 헬라어는 문자적으로 ‘피의 사람’이라고 말합니다.
    reason: lexical_alternative
  revision_rationale: The revision clarifies that bread is sustenance for the needy rather than merely their possession. It also replaces an unidiomatic literalism with a natural Korean expression for bloodguilt, while preserving the literal Greek wording and narrower alternatives in the footnote. The pronoun ‘그것’ leaves the immediately preceding referent unexpanded, as in the source.
