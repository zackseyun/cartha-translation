  rationale: 결핍과 궁핍의 상태를 나타내는 분사이므로, 짧고 자연스러운 ‘궁핍한 이들’로 옮겨 원문의 필요성 강조를 살렸습니다.
- source_word: πτωχῶν
  english_pob_choice: of the poor
  chosen_korean: 가난한 사람들의
  alternatives_korean:
