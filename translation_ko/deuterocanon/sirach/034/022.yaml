  - 빈곤한 사람들의
  lexicon: LSJ
  rationale: 소유격 관계를 한국어로 자연스럽게 드러내기 위해 ‘가난한 사람들의’로 처리했습니다. ‘가난한 이들’도 가능하지만 문맥상 명사성을 분명히 했습니다.
- source_word: ἄνθρωπος αἱμάτων
  english_pob_choice: a man of blood
  chosen_korean: 피의 사람
  alternatives_korean:
  - 피 흘림의 사람
  - 살인자
  - 피를 즐기는 사람
  lexicon: LSJ
  rationale: 직역적이고 관용적인 표현을 유지해, 단순히 ‘살인자’로 좁히지 않고 혈죄의 무게를 드러내는 원문의 긴장을 보존했습니다.
theological_decisions:
- issue: ἄνθρωπος αἱμάτων의 윤리적 충격을 어떻게 처리할지
  chosen_reading: 본문에는 ‘피의 사람’이라는 직역을 유지했습니다.
  alternative_readings:
