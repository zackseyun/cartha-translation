- source_word: διώκων ἄνεμον
  english_pob_choice: chasing the wind
  chosen_korean: 바람을 쫓는
  alternatives_korean:
  - 바람을 추적하는
  - 바람을 따라가는
  lexicon: LSJ
  rationale: 헛된 추구를 나타내는 관용적 이미지를 한국어에서도 자연스럽게 유지했습니다.
- source_word: ὁ ἐπέχων ἐνυπνίοις
  english_pob_choice: one who clings to dreams
  chosen_korean: 꿈을 붙드는 사람
  alternatives_korean:
  - 꿈에 매달리는 사람
  - 꿈을 의지하는 사람
  - 꿈에 귀를 기울이는 사람
  lexicon: LSJ
  rationale: ἐπέχω가 이 문맥에서는 단순 소유가 아니라 무엇인가에 매달리거나 의지하는 뉘앙스를 가지므로, 꿈에 대한 잘못된 의존을 드러내는 표현으로 옮겼습니다.
theological_decisions:
- issue: ἐπέχων ἐνυπνίοις의 평가적 뉘앙스
  chosen_reading: ‘꿈을 붙드는 사람’으로 번역해, 헛된 대상에 매달리는 부정적 평가를 본문 자체에서 드러냈습니다.
  alternative_readings:
  - 꿈을 주의 깊게 보는 사람
  - 꿈을 의지하는 사람
  rationale: 문맥은 꿈에 대한 의존을 그림자와 바람의 허망함에 비유해 비판하므로, 중립적 표현보다 부정적 함의를 분명히 살리는 것이 원문의 힘을 더 잘 전합니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
