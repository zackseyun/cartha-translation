  yaml_path: translation/deuterocanon/sirach/034/002.yaml
  text: Like one grasping at a shadow and chasing the wind[a], so is one who clings to dreams.
  footnotes:
  - marker: a
    text: Or 'one who relies on dreams' or 'one who pays attention to dreams.' The Greek verb can suggest holding fast to, depending on, or giving heed to something.
    reason: lexical_alternative
translation:
  language: ko
  text: 마치 그림자를 움켜쥐고 바람을 쫓는 사람 같으니, 꿈을 붙드는 사람도 그러합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘꿈에 의지하는 사람’ 혹은 ‘꿈에 주의를 기울이는 사람’. 그리스어 동사는 무엇인가를 붙들고 의지하거나, 그것에 주의를 기울이는 뜻을 띨 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: δρασσόμενος
  english_pob_choice: grasping at
  chosen_korean: 움켜쥐고
  alternatives_korean:
  - 붙잡고
  - 잡으려 하고
  lexicon: LSJ
  rationale: 손으로 무엇을 붙드는 동작을 살리되, 현대 한국어에서 자연스럽고 허망한 시도를 드러내는 표현으로 옮겼습니다.
- source_word: σκιᾶς
