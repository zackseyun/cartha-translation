base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/034/027.yaml
  text: Wine is like life to a man[a], if you drink it in due measure. What is life to one diminished by wine? For it too was created for human gladness.
  footnotes:
  - marker: a
    text: Or possibly, 'What is life to one lacking wine?' The Greek phrase is terse, and the dative with 'wine' can be taken differently; the main text understands the sense as a person diminished by wine, that is, harmed by it.
    reason: alternative_reading
translation:
  language: ko
  text: 포도주는 사람에게 생명과 같으니, 알맞은 분량으로 마신다면 그러합니다. 포도주로 인해 약해진 사람[a]에게 무슨 생명이 있겠습니까? 포도주도 사람들의 기쁨을 위해 지음받았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 헬라어 표현은 매우 간결합니다. 이 말은 ‘포도주로 인해 약해진 사람’으로 읽을 수도 있고, ‘포도주가 부족한 사람’으로 읽을 수도 있습니다. 본문은 앞뒤 문맥에 따라 포도주로 인해 해를 입은 사람이라는 뜻을 택했습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἴσον ζωῆς
  english_pob_choice: is like life
  chosen_korean: 생명과 같으니
  alternatives_korean:
  - 생명과 같으니라
  - 생명에 비견되니
  - 생명과 같다고 할 수 있으니
  lexicon: LSJ
  rationale: ἴσον은 여기서 비교·동등의 뜻이므로, 한국어에서는 자연스러운 비교 표현인 '같다'로 옮겨 비교의 힘을 살렸습니다.
- source_word: ἐὰν πίνῃς αὐτὸν μέτρῳ αὐτοῦ
  english_pob_choice: if you drink it in due measure
  chosen_korean: 그 분량대로 마시면 됩니다
  alternatives_korean:
  - 그것의 분량대로 마시면 됩니다
  - 적절한 분량으로 마시면 됩니다
  - 절제하여 마시면 됩니다
  lexicon: LSJ
  rationale: μέτρῳ αὐτοῦ는 '그 분량/척도대로'의 직역이 가능하므로, 원문의 기준성을 살리면서도 한국어 독자를 위해 '분량대로'로 옮겼습니다.
- source_word: ἐλασσουμένῳ οἴνῳ
  english_pob_choice: one diminished by wine
  chosen_korean: 포도주에 덜어지는 자
  alternatives_korean:
  - 포도주로 인해 줄어든 자
  - 포도주에 손상된 자
  - 포도주가 모자란 자
  lexicon: LSJ
  rationale: ἐλασσουμένῳ는 '줄어들다, 덜어지다, 약화되다'의 의미를 담으므로, 과음으로 손상된 사람이라는 본문의 긴장을 유지하기 위해 '덜어지는 자'로 옮겼습니다.
- source_word: εἰς εὐφροσύνην ἀνθρώποις
  english_pob_choice: for human gladness
  chosen_korean: 사람의 기쁨을 위해 지음받았습니다
  alternatives_korean:
  - 사람들의 기쁨을 위해 지음받았습니다
  - 인간의 즐거움을 위해 지음받았습니다
  - 사람의 환희를 위해 지음받았습니다
  lexicon: LSJ
  rationale: εὐφροσύνη는 단순한 즐거움보다 밝은 기쁨·환희를 가리키므로, 문맥상 자연스러운 '기쁨'을 사용하되 목적절로 풀어 한국어 문장을 매끄럽게 했습니다.
theological_decisions:
- issue: 포도주의 창조 목적 진술
  chosen_reading: 포도주도 사람의 기쁨을 위해 지음받았다는 긍정과, 그 분량을 넘어 마시면 해가 된다는 경고를 함께 살렸습니다.
  alternative_readings:
  - 포도주는 단지 기쁨을 위한 것이다
  - 포도주는 원래 사람을 즐겁게 하도록 만들어졌다
  rationale: 본문은 포도주의 선한 창조 목적을 말하면서도, 바로 앞의 수사 질문으로 절제를 전제합니다. 따라서 긍정과 경계를 모두 보존하는 방향이 원문에 가장 충실합니다.
  doctrine_reference: 집회서 34:27의 문맥상 지혜적 절제 강조
- issue: 수사 질문의 긴장
  chosen_reading: 포도주에 덜어지는 자에게 무슨 생명이 있겠습니까?
  alternative_readings:
  - 포도주가 부족한 자에게 무슨 생명이 있겠습니까?
  - 포도주 없이 무슨 생명이 있겠습니까?
  rationale: 헬라어는 매우 압축적이어서 '포도주에 의해 약화된 사람'과 '포도주가 없는 사람' 둘 다 가능하지만, 문맥상 과음의 해를 묻는 주된 흐름을 본문에 두었습니다.
  doctrine_reference: 본문의 대조법과 영어 POB 주석의 대안 독해
