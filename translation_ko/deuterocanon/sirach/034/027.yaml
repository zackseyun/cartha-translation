  rationale: 조건문을 허용·권고로 바꾸지 않도록 바로잡고, 불자연스러운 ‘덜어지는 자’를 현대 표준어의 ‘포도주로 인해 약해진 사람’으로 수정했습니다. 이는 영어 POB가 본문에서 택한 독법을 한국어로 자연스럽게 반영하지만, 원문의 여격이 허용하는 ‘포도주가 부족한 사람’이라는 대안은 각주에 보존합니다. ‘포도주도’는 καὶ αὐτός의 ‘그것도’를 명시적으로 드러내며, 각주 앵커를 관련 어구에 배치했습니다.
