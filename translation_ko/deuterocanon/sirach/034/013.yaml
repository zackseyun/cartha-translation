lexical_decisions:
- source_word: לא ישא פנים אל דל
  english_pob_choice: does not show partiality to the poor
  chosen_korean: 가난한 사람에게 편파적으로 대하지 않으시고
  alternatives_korean:
  - 가난한 사람의 얼굴을 들어 주지 않으시고
  - 가난한 사람을 차별하지 않으시고
  - 가난한 사람에게 특혜를 베풀지 않으시고
  lexicon: HALOT
  rationale: נשא פנים의 관용적 의미를 따라 ‘편파적으로 대하다’로 옮기고, אל דל은 대상을 ‘가난한 사람’으로 분명하게 드러냈습니다.
- source_word: דל
  english_pob_choice: the poor
  chosen_korean: 가난한 사람
  alternatives_korean:
  - 가난한 자
  - 가난한 이
  - 빈곤한 사람
  lexicon: HALOT
  rationale: דל은 사회적으로 취약한 ‘가난한 사람’을 가리키므로, 현대 한국어에서 가장 자연스럽고 분명한 표현을 택했습니다.
- source_word: תחנוני מצוק
  english_pob_choice: the plea of the oppressed
  chosen_korean: 억눌린 자의 호소
  alternatives_korean:
  - 고난받는 자의 간청
  - 곤경에 빠진 자의 간구
  - 압박받는 자의 탄원
  lexicon: HALOT
  rationale: תחנונים의 간절한 청원을 ‘호소’로, מצוק을 사회적 압박 상태를 드러내는 ‘억눌린 자’로 옮겨 두 절의 평행을 살렸습니다.
- source_word: ישמע
  english_pob_choice: he hears
  chosen_korean: 들으십니다
  alternatives_korean:
  - 들으십니다만
  - 들으십니다
  - 들어 주십니다
  lexicon: HALOT
  rationale: 지혜문학의 현재적·일반적 진술로 이해하여, 한국어에서는 하나님의 지속적 행동을 드러내는 현재형 존대 ‘들으십니다’를 택했습니다.
theological_decisions:
- issue: 히브리어 본문과 헬라어 이본의 관계
  chosen_reading: 주 본문은 현존 히브리어를 따르고, 헬라어의 전혀 다른 읽기는 각주로 보존했습니다.
  alternative_readings:
  - ‘주를 경외하는 이들의 영은 살 것이며, 그들의 희망은 그들을 구원하시는 이에게 있습니다.’
  rationale: 시락서는 히브리어가 보존된 경우 그 본문을 우선하되, 이 절처럼 헬라어가 실질적으로 다른 본문을 전하는 경우에는 번역 본문을 히브리어에 두고 헬라어는 변이로 기록하는 것이 가장 투명합니다.
  doctrine_reference: 'PHILOSOPHY.md: Sirach는 히브리어가 남아 있으면 히브리어를 मुख्य 본문으로 삼고, 헬라어는 대조 증거로 보존한다.'
