  text: For dreams have misled many[b][a], and those who hoped in them have fallen.
  footnotes:
  - marker: a
    text: Or 'led many astray' for 'have misled many.'
    reason: lexical_alternative
  - marker: b
    text: The Greek says 'have fallen'; the sense may include failure or ruin for those who put their hope in dreams.
    reason: lexical_alternative
translation:
  language: ko
  text: 꿈은 많은 사람을 미혹하였습니다. 그것들을 바라던 이들은 넘어졌습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘많은 사람을 길 잃게 하였다’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘넘어졌다’에는 실패하거나 파멸했다는 뜻이 포함될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὺς
  english_pob_choice: many
  chosen_korean: 많은 사람을
  alternatives_korean:
  - 많은 이들을
  - 많은 무리를
  lexicon: LSJ
  rationale: 목적어 πολλοὺς의 인간 대상을 자연스럽게 드러내되, 원문의 포괄적 의미를 유지하기 위해 일반적인 ‘많은 사람을’로 옮겼습니다.
- source_word: ἐπλάνησεν
  english_pob_choice: have misled
  chosen_korean: 미혹하였습니다
  alternatives_korean:
  - 길을 잃게 하였습니다
  - 속였습니다
  - 그릇되게 하였습니다
  lexicon: BDAG
  rationale: ‘길을 잃게 하다/미혹하다’ 계열이 원문의 ‘방향을 잃게 함, 잘못된 길로 이끔’의 뜻을 잘 살리므로, 종교적 경고의 뉘앙스를 유지하는 ‘미혹하였습니다’를 선택했습니다.
- source_word: τὰ ἐνύπνια
  english_pob_choice: dreams
  chosen_korean: 꿈은
  alternatives_korean:
  - 꿈들이
  - 꿈의 환상은
  lexicon: LSJ
  rationale: ἐνύπνια는 일반적으로 ‘꿈들’이지만, 한국어에서는 문장 첫머리의 주어로 ‘꿈은’이 가장 자연스럽고 원문의 일반 진술을 잘 전달합니다.
- source_word: ἐξέπεσαν
  english_pob_choice: have fallen
  chosen_korean: 넘어졌습니다
  alternatives_korean:
  - 떨어졌습니다
  - 실패하였습니다
  - 몰락하였습니다
  lexicon: BDAG
  rationale: 직역의 ‘떨어졌습니다’보다, 앞절의 미혹과 연결되는 결과를 한국어로 더 분명히 드러내는 ‘넘어졌습니다’가 은유를 살리면서도 과도한 해석을 피합니다.
- source_word: ἐπʼ αὐτοῖς
  english_pob_choice: in them
  chosen_korean: 그것들을
  alternatives_korean:
  - 그 꿈들에
  - 그것들 안에
  lexicon: BDAG
  rationale: 희망의 대상이 앞의 꿈들이므로, 한국어에서는 전치사구를 반복하기보다 ‘그것들을 바라다’로 연결해 원문의 의미관계를 자연스럽게 재현했습니다.
theological_decisions:
- issue: 꿈에 대한 경고의 범위
  chosen_reading: 이 절은 꿈 자체를 무조건 배격한다기보다, 꿈에 기대어 희망을 두는 태도가 사람을 미혹하고 넘어지게 할 수 있음을 경고합니다.
  alternative_readings:
  - 모든 꿈을 일괄적으로 부정하는 진술
  - 거짓 꿈 해석만을 겨냥하는 진술
  rationale: 그리스어는 ‘꿈들이 많은 사람을 미혹했고, 그것들에 희망을 둔 자들이 넘어졌다’고 직접 말하므로, 경고의 초점을 꿈에 대한 의존에 두는 해석이 원문에 가장 충실합니다.
  doctrine_reference: 의도된 긴장을 유지하고 과도한 일반화는 피합니다.
