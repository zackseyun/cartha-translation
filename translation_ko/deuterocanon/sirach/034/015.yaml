  - severity: medium
    issue: ‘너 자신의 것에 비추어 판단하고’는 어색하며, 이웃의 감정을 평가·판정한다는 뜻으로 읽힐 수 있습니다.
    rationale: 그리스어 권고는 자기 경험을 기준으로 이웃에게 관련된 것을 숙고·이해하라는 취지입니다. 영어 POB의 ‘feelings’를 유지할 경우 ‘자신의 감정에 비추어 이웃의 감정을 헤아리고’가 더 자연스럽고 의미상 안전합니다.
  - severity: medium
    issue: 각주의 ‘그것을 망치는 자들’은 ‘그것’의 지시 대상이 불명확합니다.
    rationale: 히브리어 이형의 여성 접미사가 가리키는 대상은 문맥상 확정하기 어렵습니다. 영어 감사 기록의 destroyers/rebels라는 양자적 해석을 보존하면서도 한국어 대명사 혼동을 피해야 합니다.
