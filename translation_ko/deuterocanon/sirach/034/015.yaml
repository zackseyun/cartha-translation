  text: Judge your neighbor's feelings by your own, and think carefully about every matter.[a]
  footnotes:
  - marker: a
    text: 'Hebrew witness (Cairo Geniza/Kahana) is markedly different here: ''Does not a tear run down the cheek, and a sigh over her destroyers/rebels?'' The source tradition for this verse is uncertain, so the main text follows the Greek parallel.'
    reason: alternative_reading
translation:
  language: ko
  text: 이웃의 감정을 자신의 감정에 비추어 헤아리고, 모든 일을 신중히 생각하십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 증거(카이로 게니자; 카하나 판)는 이곳에서 본문이 크게 다릅니다. “눈물이 뺨을 따라 흘러내리지 않습니까? 또 그녀의 파괴자들/반역자들 때문에 한숨이 나오지 않습니까?” 이 절의 전승은 불확실하므로, 본문은 그리스어 평행문을 따릅니다.
    reason: alternative_reading
lexical_decisions:
- source_word: νόει
  english_pob_choice: Judge
  chosen_korean: 판단하고
  alternatives_korean:
  - 헤아리고
  - 이해하고
  - 생각하고
  lexicon: BDAG
  rationale: 그리스어 명령형은 자기 자신을 기준으로 이웃을 분별하라는 뜻이므로, 현대 한국어에서는 ‘판단하다’가 지시적 힘을 가장 자연스럽게 살립니다.
- source_word: τὰ τοῦ πλησίον
  english_pob_choice: your neighbor’s feelings
  chosen_korean: 네 이웃의 감정을
  alternatives_korean:
  - 네 이웃의 처지를
  - 이웃의 것들을
  - 네 이웃에게 속한 것들을
  lexicon: BDAG
  rationale: 영어 POB가 이 구절의 윤리적 함의를 ‘feelings’로 풀어냈으므로, 한국어도 관계적 공감의 초점을 살려 ‘감정’을 택했습니다.
- source_word: ἐκ σεαυτοῦ
  english_pob_choice: by your own
  chosen_korean: 너 자신의 것에 비추어
  alternatives_korean:
  - 너 자신으로부터
  - 자기 자신을 기준으로
  - 네 자신에 따라
  lexicon: BDAG
  rationale: 직역적 ‘~로부터’보다, 자기 경험을 기준 삼아 이웃을 이해하라는 비교 의미를 현대 한국어에서 자연스럽게 전달합니다.
- source_word: ἐπὶ παντὶ πράγματι
  english_pob_choice: about every matter
  chosen_korean: 모든 일에 대해
  alternatives_korean:
  - 모든 일에서
  - 모든 사안에 대해
  - 모든 문제에 관하여
  lexicon: BDAG
  rationale: πρᾶγμα의 구체적이고 실질적인 뜻을 살려, 추상적인 ‘everything’보다 ‘일’이 문맥에 더 잘 맞습니다.
- source_word: διανοοῦ
  english_pob_choice: think carefully
  chosen_korean: 신중히 생각하십시오
  alternatives_korean:
  - 깊이 생각하십시오
  - 숙고하십시오
  - 주의 깊게 생각하십시오
  lexicon: BDAG
  rationale: 지속적이고 숙고하는 마음의 작용을 나타내므로, 합쇼체 권고문에 어울리게 ‘신중히 생각하십시오’로 옮겼습니다.
theological_decisions:
- issue: 히브리어 전승과 그리스어 평행문의 본문 차이
  chosen_reading: 본문은 그리스어 평행문의 권고문을 따르고, 히브리어 전승의 시적 이형은 각주로 보존합니다.
  alternative_readings:
  - 히브리어의 ‘눈물/한숨’ 이미지를 본문으로 옮기는 것
  rationale: 이 절은 히브리어와 그리스어가 크게 어긋나며, POB의 기존 판정도 그리스어를 본문으로 채택합니다. 따라서 본문은 안정적인 교훈 문맥을 살리고, 히브리어 차이는 주석으로 투명하게 남깁니다.
  doctrine_reference: 'Sirach 본문 전승 불일치 처리 원칙: 주요 이본 차이는 본문과 각주로 분리해 독자에게 공개한다.'
