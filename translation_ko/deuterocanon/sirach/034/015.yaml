  rationale: 그리스어 평행문을 본문으로 채택하는 기존 편집 판정은 유지했습니다. 한국어 본문은 합쇼체에 맞추고, ‘판단하다’의 부정확한 평가 뉘앙스를 ‘헤아리다’로 바꾸어 성찰적·공감적 권고를 드러냈습니다. 각주는 히브리어 이형의 핵심 이미지와 ‘파괴자들/반역자들’의 불확실성을 보존하되, 모호한 대명사를 제거하고 카하나가 판본임을 밝혔습니다.
