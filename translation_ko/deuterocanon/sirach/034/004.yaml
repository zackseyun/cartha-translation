  - 참이 되겠습니까
  - 참되겠습니까
  lexicon: BDAG
  rationale: 이 동사는 ‘진실을 말하다’와 ‘참되다/참이 되다’의 뜻을 가질 수 있으나, 본문 평행법상 결과 상태를 묻는 의미가 더 강하므로 ‘참되게 되다’로 옮겼습니다.
theological_decisions:
- issue: ἀληθεύσει의 의미 범위
  chosen_reading: 결과적 의미로 이해하여 ‘참되게 되겠습니까’로 번역했습니다.
  alternative_readings:
  - ‘진실을 말하겠습니까’라는 발화 행위 중심 번역
  - ‘참이 되겠습니까’라는 증명/검증 중심 번역
  rationale: 이 절은 ‘깨끗한 것’과 ‘거짓됨’이라는 두 원천에서 어떤 결과가 나올 수 있는지를 묻는 수사적 평행문이므로, 말하기 행위보다 결과 상태를 드러내는 번역이 문맥에 가장 잘 맞습니다.
  doctrine_reference: 집회서 34:4의 지혜 문학적 수사와 평행법
