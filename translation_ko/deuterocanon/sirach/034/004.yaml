  text: From the unclean[a], what will be made clean? And from falsehood, what will become true?
  footnotes:
  - marker: a
    text: Or 'And from a lie, what will prove true?' The Greek verb can also carry the sense 'speak truth' or 'prove true,' but the main text follows the broader parallel with 'be made clean.'
    reason: lexical_alternative
translation:
  language: ko
  text: 부정한 것에서 무엇이 깨끗하게 되겠습니까? 또 거짓에서 무엇이 참이 되겠습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘거짓에서 무엇이 진실을 말하겠습니까?’ 그리스어 동사는 ‘진실을 말하다’ 또는 ‘참으로 드러나다’라는 뜻도 가질 수 있습니다. 그러나 본문은 앞 구절과의 평행을 따라 결과적으로 참이 되는지를 묻습니다.
    reason: lexical_alternative
