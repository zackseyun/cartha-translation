- source_word: ψευδοῦς
  english_pob_choice: falsehood
  chosen_korean: 거짓됨
  alternatives_korean:
  - 거짓
  - 거짓말
  lexicon: BDAG
  rationale: 두 번째 분문의 추상 명사적 평행성을 보존하려고 단일 발화로 좁히는 ‘거짓말’보다 ‘거짓됨’을 택했습니다.
- source_word: ἀληθεύσει
  english_pob_choice: will become true
  chosen_korean: 참되게 되겠습니까
  alternatives_korean:
