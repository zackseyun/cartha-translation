- from: 가난한 이의 부르짖음이 구름을 지나가고, 그것이 그에게 이르기까지는 쉬지 않습니다. 그것은 하나님이 돌보실 때까지 멈추지 않으며, 의로운 재판관이 판결을 집행합니다.[a][b]
  to: 가난한 이의 부르짖음이 구름을 지나가고, 하나님께 이르기까지 쉬지 않습니다. 그것은 하나님께서 돌보시고 의로우신 재판관께서 판결을 내리실 때까지 멈추지 않습니다.[a][b]
  rationale: 원문의 지속적 호소와 하나님의 응답 및 न्याय적 판단이라는 흐름을 유지하면서, ‘판결 집행’이라는 과도하게 좁은 법률적 의미를 ‘판결을 내리다’로 바로잡았습니다. 문맥상 암시된 하나님을 첫 문장에서 밝혔고, 하나님을 가리키는 재판관 호칭에는 합쇼체 높임을 적용했습니다. 본문 전승의 불확실성은 각주에서 계속 명시했습니다.
  reviewer_model: gpt-5.6-terra
