base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/034/017.yaml
  text: The cry of the poor passes through the cloud[a], and until it reaches him it does not rest. It does not cease until God attends[b], and the righteous Judge executes judgment.
  footnotes:
  - marker: a
    text: Or, 'does justice.' The Hebrew idiom literally says 'does judgment.'
    reason: lexical_alternative
  - marker: b
    text: The Greek parallel in Swete differs substantially here ('The eyes of the Lord are upon those who love him ...'), while the surviving Hebrew reads as translated above. This verse is therefore textually uncertain at the source level.
    reason: textual_variant
translation:
  language: ko
  text: 가난한 이의 부르짖음이 구름을 지나가고, 그것이 그에게 이르기까지는 쉬지 않습니다. 그것은 하나님이 돌보실 때까지 멈추지 않으며, 의로운 재판관이 판결을 집행합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 משפט은 문자적으로 ‘판결/재판’을 뜻하며, ‘정의’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 이 구절은 전승상 불확실합니다. 스웨트의 그리스어 병행본문은 히브리어와 크게 달리, ‘주님의 눈이 그를 사랑하는 이들 위에 있다…’로 시작합니다.
    reason: textual_variant
lexical_decisions:
- source_word: שועת דל
  english_pob_choice: the cry of the poor
  chosen_korean: 가난한 이의 부르짖음
  alternatives_korean:
  - 가난한 자의 외침
  - 궁핍한 이의 부르짖음
  lexicon: HALOT
  rationale: שועת는 억눌린 처지에서 도움을 호소하는 ‘부르짖음’이 자연스럽고, דל은 사회적으로 가난하고 약한 사람을 가리키므로 ‘가난한 이’가 가장 잘 맞습니다.
- source_word: ענן חלפה
  english_pob_choice: passes through the cloud
  chosen_korean: 구름을 지나가고
  alternatives_korean:
  - 구름을 통과하고
  - 구름 너머로 지나가고
  lexicon: HALOT
  rationale: 구름은 기도를 가로막는 장벽처럼 묘사되므로, ‘지나가고’로 직선적 이동과 시적 이미지를 함께 살렸습니다.
- source_word: לא תמוש
  english_pob_choice: It does not cease
  chosen_korean: 멈추지 않으며
  alternatives_korean:
  - 그치지 않으며
  - 떠나지 않으며
  lexicon: HALOT
  rationale: 문맥상 계속되는 부르짖음의 지속성을 말하므로, ‘멈추지 않으며’가 가장 자연스럽고 동적인 대응입니다.
- source_word: יפקוד אל
  english_pob_choice: until God attends
  chosen_korean: 하나님이 돌보실 때까지
  alternatives_korean:
  - 하나님이 살피실 때까지
  - 하나님이 찾아오실 때까지
  - 하나님이 개입하실 때까지
  lexicon: HALOT
  rationale: פקד는 ‘찾아보다/돌보다/돌아보다’의 폭이 있어, 과도하게 특정하지 않으면서 응답적 관심을 드러내는 ‘돌보실’이 적절합니다.
- source_word: ושופט צדק יעשה משפט
  english_pob_choice: and the righteous Judge executes judgment
  chosen_korean: 의로운 재판관이 판결을 집행합니다
  alternatives_korean:
  - 의로운 재판관이 심판을 행합니다
  - 의로운 재판관이 판결하십니다
  - 의로운 재판관이 정의를 행합니다
  lexicon: HALOT
  rationale: ‘שופט צדק’는 하나님을 ‘의로운 재판관’으로 부르는 표현이고, ‘יעשה משפט’는 법정적 행위를 가리키므로 ‘판결을 집행합니다’가 judicial force를 가장 잘 보존합니다.
theological_decisions:
- issue: 절의 끝에 나타나는 하나님의 재판 이미지
  chosen_reading: 하나님을 단순한 위로의 대상이 아니라 ‘의로운 재판관’으로 명시했습니다.
  alternative_readings:
  - ‘하나님이 정의를 행합니다’
  - ‘하나님이 판결하십니다’
  rationale: 히브리어는 억압당한 자의 부르짖음에 대해 하나님이 न्याय적 판단을 내리시는 장면을 강조하므로, 재판 언어를 약화하지 않고 살리는 것이 본문의 힘에 부합합니다.
  doctrine_reference: Translation philosophy §1, §5
- issue: ‘기다림’의 지속성 표현
  chosen_reading: ‘그것이 그에게 이르기까지는 쉬지 않습니다’로 부르짖음의 지속을 살렸습니다.
  alternative_readings:
  - ‘도달할 때까지 멈추지 않습니다’
  - ‘그에게 닿을 때까지 그치지 않습니다’
  rationale: 히브리어의 여성형 동사는 ‘부르짖음’을 가리키며, 목적어는 문맥상 하나님입니다. 한국어에서는 이를 명시해 의미를 분명하게 하되, 원문의 지속적 긴장을 유지했습니다.
  doctrine_reference: Translation philosophy §1, §6
