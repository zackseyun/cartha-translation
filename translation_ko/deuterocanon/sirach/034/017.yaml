  - severity: low
    issue: 하나님을 가리키는 ‘의로운 재판관’에 높임 표현이 필요합니다.
    rationale: 앞 절의 ‘돌보실’과 현대 한국어 합쇼체의 경어 체계를 일관되게 유지해야 합니다.
