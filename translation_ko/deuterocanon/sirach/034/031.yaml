  source_fidelity: 그리스어의 네 가지 금지 명령과 병렬 구조를 충실히 보존했습니다. ‘포도주 잔치’, ‘꾸짖다’, ‘업신여기다’, ‘모욕의 말’, ‘요구를 하며 괴롭히다’는 각각 συμποσίῳ οἴνου, ἐλέγξῃς, ἐξουδενώσῃς, λόγον ὀνειδισμοῦ, ἐν ἀπαιτήσει의 의미 범위에 적절합니다. 특히 마지막 표현을 본문에서 빚으로 한정하지 않고, 각주에서 상환 독촉의 가능한 뉘앙스를 제시한 것은 원문의 모호성을 잘 보존합니다.
  naturalness: 현대 표준 한국어 합쇼체로 자연스럽고, 지혜문학의 간결한 권면 어조도 유지합니다. ‘그가 즐거워할 때’와 ‘요구를 하며 그를 괴롭히지 마십시오’는 문맥상 명확합니다.
  terminology: ‘이웃’은 πλησίον의 전통적 윤리 용어를 유지하면서도 본문에서 함께 있는 상대라는 문맥과 충돌하지 않습니다. ‘업신여기다’와 ‘모욕의 말’도 격식 있는 성경 문체에 적합합니다. 각주의 ‘청구나 강제 징수’ 및 ‘빚을 거두는 의미’는 ἀπαίτησις의 요구·추심 관련 의미를 과도하게 단정하지 않고 설명합니다.
