base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/034/031.yaml
  text: At a banquet of wine do not rebuke your neighbor[a], and do not belittle him in his gladness; do not speak a word of reproach to him, and do not distress him by making demands.
  footnotes:
  - marker: a
    text: Or 'do not distress him by pressing for repayment'; the Greek term can refer to a demand or exaction, often in the sense of collecting what is owed.
    reason: lexical_alternative
translation:
  language: ko
  text: 포도주 잔치에서 이웃을 꾸짖지 말고, 그가 즐거워할 때 그를 업신여기지 마십시오. 그에게 모욕의 말을 하지 말고, 요구를 하며 그를 괴롭히지 마십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘상환을 독촉하며 그를 괴롭히지 마십시오’라고 옮길 수 있습니다. 그리스어는 청구나 강제 징수를 뜻할 수 있으며, 흔히 빚을 거두는 의미로 쓰입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν συμποσίῳ οἴνου
  english_pob_choice: At a banquet of wine
  chosen_korean: 포도주 잔치에서
  alternatives_korean:
  - 술자리에서
  - 포도주 연회에서
  - 포도주를 곁들인 잔치에서
  lexicon: LSJ
  rationale: 술이 동반된 사교적 잔치를 가리키므로, 자연스러우면서도 과도하게 구어적이지 않은 ‘포도주 잔치’로 옮겼습니다.
- source_word: ἐλέγξῃς
  english_pob_choice: rebuke
  chosen_korean: 꾸짖지
  alternatives_korean:
  - 책망하지
  - 나무라지
  - 훈계하지
  lexicon: BDAG
  rationale: 이 문맥은 잘못을 드러내는 법적 ‘책망’보다, 잔치 자리에서 상대를 몰아세우는 언동을 금하는 뜻이므로 ‘꾸짖다’가 적절합니다.
- source_word: ἐξουδενώσῃς
  english_pob_choice: belittle
  chosen_korean: 업신여기지
  alternatives_korean:
  - 깔보지
  - 하찮게 여기지
  - 무시하지
  lexicon: BDAG
  rationale: ‘아무것도 아닌 것으로 여기다’는 뉘앙스를 살리면서, 관계적 경멸을 드러내는 한국어로 ‘업신여기다’를 택했습니다.
- source_word: ἐν ἀπαιτήσει
  english_pob_choice: by making demands
  chosen_korean: 요구를 하며
  alternatives_korean:
  - 빚을 갚으라고 압박하며
  - 상환을 독촉하며
  - 받을 것을 독촉하며
  lexicon: LSJ
  rationale: 그리스어가 반드시 ‘빚’만을 명시하지는 않으므로 본문에는 넓게 ‘요구를 하며’로 두고, 청구·독촉의 압박이라는 의미를 반영했습니다.
theological_decisions:
- issue: 연회 자리에서의 금지 표현의 어조
  chosen_reading: 지혜문학의 훈계체를 따라, 직설적 명령 금지형을 유지하면서도 현대 한국어에서 자연스러운 존대형으로 옮겼습니다.
  alternative_readings:
  - 반말형 금지(‘꾸짖지 마라’)
  - 더 공손한 간접화법
  rationale: 원문의 경구적 성격은 유지하되, 한국어 성경 문체로는 합쇼체가 가장 적절합니다.
  doctrine_reference: 지혜문학의 생활 윤리 권고
- issue: ‘요구/독촉’의 의미 범위
  chosen_reading: 본문은 상대를 괴롭히는 강압적 요구를 금지하는 것으로 번역했습니다.
  alternative_readings:
  - 명시적으로 ‘빚 독촉’으로 좁히는 해석
  - 단순한 요청으로 완화하는 해석
  rationale: ἔν ἀπαιτήσει는 청구·요구·독촉의 의미폭이 있어, 본문 자체의 넓이를 보존하는 번역이 필요합니다.
  doctrine_reference: 본문 의미 범위 보존
