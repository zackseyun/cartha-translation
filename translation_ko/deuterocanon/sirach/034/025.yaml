  source_fidelity: 그리스어의 두 현재분사(‘기도하는 사람’, ‘저주하는 사람’)와 ‘누구의 목소리를 주인이 들으실까?’라는 수사 의문문의 구조는 대체로 반영되었습니다. 다만 이 문맥의 δεσπότης는 하나님을 가리키는 호칭으로 쓰였으므로, 한국어 ‘주인’은 인간 소유주를 우선 연상시켜 지시 대상과 존칭을 약화시킬 수 있습니다.
  naturalness: ‘한 사람은 … 하고 있고’의 반복은 가능하나, 격언적 수사 의문문에는 간결한 현재형이 더 자연스럽습니다. ‘누구의 음성’보다 ‘누구의 목소리’가 현대 한국어에서 자연스럽습니다.
  terminology: δεσπότης는 일반 명사적 어원을 지니지만, 본절에서는 하나님을 가리키므로 표준 한국어 성서 문체의 존칭 호칭인 ‘주님’이 적절합니다. 기존 각주는 φωνή와 δεσπότης에 관하여 불필요하게 번역 선택을 제한하거나 오도할 가능성이 있어 삭제합니다.
