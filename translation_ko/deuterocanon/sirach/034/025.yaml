lexical_decisions:
- source_word: εὐχόμενος
  english_pob_choice: praying
  chosen_korean: 기도하고 있습니다
  alternatives_korean:
  - 기도합니다
  - 간구하고 있습니다
  lexicon: εὔχομαι
  rationale: 현재 분사로 진행 중인 행위를 나타내므로, 한국어에서도 진행형으로 살려 문장의 대조를 분명히 했습니다.
- source_word: καταρώμενος
  english_pob_choice: cursing
  chosen_korean: 저주하고 있습니다
  alternatives_korean:
  - 저주합니다
  - 욕하고 있습니다
  lexicon: καταράομαι
  rationale: 기도와 짝을 이루는 반대 행위로서 ‘저주하다’가 직접적이며, 도덕적 대조도 유지합니다.
- source_word: φωνῆς
  english_pob_choice: voice
  chosen_korean: 음성
  alternatives_korean:
  - 목소리
  - 소리
  lexicon: φωνή
  rationale: ‘누구의 음성’은 단순 소리보다 청취·응답의 대상으로서의 발화를 더 분명하게 드러냅니다.
- source_word: δεσπότης
  english_pob_choice: Master
  chosen_korean: 주인
  alternatives_korean:
  - 주인님
  - 주
  lexicon: δεσπότης
  rationale: 본문의 δεσπότης는 소유·권위를 지닌 주인을 뜻하므로, 예수 호칭의 ‘주님’과 구별되는 일반 명사로 ‘주인’이 더 직접적입니다.
theological_decisions:
- issue: δεσπότης의 호칭 뉘앙스
  chosen_reading: ‘주인’으로 옮겨, 청자의 도덕적 상황에서 판정하는 권위자를 가리키는 일반적 지배권을 드러냈습니다.
  alternative_readings:
  - ‘주님’
  - ‘주’
  rationale: 이 구절은 신학적 칭호보다 판단자/소유자의 위치를 강조하므로, 한국 교회 전통어보다 원문의 사회적 호칭을 살렸습니다.
  doctrine_reference: Sirach 34:25의 수사적 대조와 심판적 청취 개념
