    issue: 그리스어에 없는 목적어 ‘그것들을’이 추가되어 있습니다.
    rationale: φαντάζεται는 여기서 명시적 목적어 없이 쓰입니다. ‘그것들’을 보충하면 마음이 앞선 점술·징조·꿈을 상상한다는 특정 해석이 본문에 고정됩니다.
  - severity: medium
