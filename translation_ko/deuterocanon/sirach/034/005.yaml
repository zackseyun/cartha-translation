  - 길조와 흉조
  lexicon: BDAG
  rationale: 오이오니스모이는 사건을 포착해 길흉을 읽는 표지를 뜻하므로, ‘징조’가 자연스럽고 ‘점술’과도 구별됩니다.
- source_word: ἐνύπνια
  english_pob_choice: dreams
  chosen_korean: 꿈
  alternatives_korean:
  - 꿈꾸는 것들
  - 꿈의 영상
  lexicon: BDAG
  rationale: 일반적인 꿈 경험을 가리키므로 과장하지 않고 ‘꿈’으로 옮겼습니다.
- source_word: μάταιά
  english_pob_choice: empty
  chosen_korean: 헛되며
  alternatives_korean:
  - 헛되다
  - 공허하며
  - 무의미하며
  lexicon: BDAG
  rationale: 문장 전체의 판단을 자연스럽게 살리면서, 헛됨과 신뢰 불가능함을 함께 드러내는 표현입니다.
- source_word: ὡς ὠδινούσης
  english_pob_choice: like a woman in labor
  chosen_korean: 해산하는 여자처럼
  alternatives_korean:
