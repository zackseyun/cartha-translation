  - 예언술
  lexicon: BDAG
  rationale: μαντεῖαι는 점을 치고 길흉을 판단하는 행위를 가리키므로, 현대어로는 ‘점술’이 가장 सीधे하고 중립적입니다.
- source_word: οἰωνισμοί
