  lexicon: BDAG
  rationale: 출산 진통의 이미지를 직접 살리되, 한국어 문장에서는 ‘해산하는 여자’가 가장 간결하게 비유를 전달합니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행 본문의 불일치
  chosen_reading: 이 절은 오류 표지가 있는 히브리어 대조문보다 그리스어 병행문의 내용을 본문으로 삼아 번역했습니다.
  alternative_readings:
  - ‘좋은 눈으로 가난한 이에게 주십시오…’로 옮기는 히브리어 읽기
  rationale: 제공된 히브리어는 이 절의 그리스어와 내용이 전혀 맞지 않아 서로 다른 전승으로 보입니다. POB 방침에 따라, 여기서는 의미가 온전한 그리스어 본문을 따르되 불일치를 주석으로 남깁니다.
  doctrine_reference: 'PHILOSOPHY.md: 본문이 불일치할 때는 가장 원문에 가까운 유효 전승을 따르되, 다른 전승의 충돌을 숨기지 않는다.'
