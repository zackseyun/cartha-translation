base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/034/005.yaml
  text: Divinations and omens[b] and dreams are empty, and the heart imagines them like a woman in labor.[a]
  footnotes:
  - marker: a
    text: The extant Hebrew line supplied for this verse reads, 'With a good eye give to the poor, and do not be resentful when you give to him,' which appears to reflect a different verse or a mismatched witness. The Greek text supplies the reading translated here.
    reason: textual_variant
  - marker: b
    text: Or 'auguries' for 'omens.' The Greek term refers to interpreting signs as portents.
    reason: lexical_alternative
translation:
  language: ko
  text: 점술과 징조와 꿈은 헛된 것이며, 마음은 해산하는 여자처럼 환상을 품습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 현존하는 히브리어 행은 “좋은 눈으로 가난한 이에게 주고, 그에게 줄 때 화내지 말라”라고 하며, 다른 절 또는 잘못 대응된 전승을 반영하는 것으로 보입니다. 여기서는 이 절에 부합하는 그리스어 본문을 번역했습니다.
    reason: textual_variant
lexical_decisions:
- source_word: μαντεῖαι
  english_pob_choice: Divinations
  chosen_korean: 점술
  alternatives_korean:
  - 무속
  - 예언술
  lexicon: BDAG
  rationale: μαντεῖαι는 점을 치고 길흉을 판단하는 행위를 가리키므로, 현대어로는 ‘점술’이 가장 सीधे하고 중립적입니다.
- source_word: οἰωνισμοί
  english_pob_choice: omens
  chosen_korean: 징조
  alternatives_korean:
  - 조짐
  - 길조와 흉조
  lexicon: BDAG
  rationale: 오이오니스모이는 사건을 포착해 길흉을 읽는 표지를 뜻하므로, ‘징조’가 자연스럽고 ‘점술’과도 구별됩니다.
- source_word: ἐνύπνια
  english_pob_choice: dreams
  chosen_korean: 꿈
  alternatives_korean:
  - 꿈꾸는 것들
  - 꿈의 영상
  lexicon: BDAG
  rationale: 일반적인 꿈 경험을 가리키므로 과장하지 않고 ‘꿈’으로 옮겼습니다.
- source_word: μάταιά
  english_pob_choice: empty
  chosen_korean: 헛되며
  alternatives_korean:
  - 헛되다
  - 공허하며
  - 무의미하며
  lexicon: BDAG
  rationale: 문장 전체의 판단을 자연스럽게 살리면서, 헛됨과 신뢰 불가능함을 함께 드러내는 표현입니다.
- source_word: ὡς ὠδινούσης
  english_pob_choice: like a woman in labor
  chosen_korean: 해산하는 여자처럼
  alternatives_korean:
  - 진통하는 여자처럼
  - 산고를 겪는 여자처럼
  lexicon: BDAG
  rationale: 출산 진통의 이미지를 직접 살리되, 한국어 문장에서는 ‘해산하는 여자’가 가장 간결하게 비유를 전달합니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행 본문의 불일치
  chosen_reading: 이 절은 오류 표지가 있는 히브리어 대조문보다 그리스어 병행문의 내용을 본문으로 삼아 번역했습니다.
  alternative_readings:
  - ‘좋은 눈으로 가난한 이에게 주십시오…’로 옮기는 히브리어 읽기
  rationale: 제공된 히브리어는 이 절의 그리스어와 내용이 전혀 맞지 않아 서로 다른 전승으로 보입니다. POB 방침에 따라, 여기서는 의미가 온전한 그리스어 본문을 따르되 불일치를 주석으로 남깁니다.
  doctrine_reference: 'PHILOSOPHY.md: 본문이 불일치할 때는 가장 원문에 가까운 유효 전승을 따르되, 다른 전승의 충돌을 숨기지 않는다.'
