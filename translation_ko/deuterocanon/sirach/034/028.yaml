base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/034/028.yaml
  text: Wine drunk at the proper time and in moderation is gladness of heart and joy of soul[a].
  footnotes:
  - marker: a
    text: Or 'Wine drunk at the right time, in sufficient measure.' The Greek adjective can more literally mean 'sufficient' or 'enough'; here it likely refers to moderate use rather than excess.
    reason: lexical_alternative
translation:
  language: ko
  text: 포도주는 알맞은 때에 적당한 양으로 마시면 마음의 기쁨이요 영혼의 즐거움입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘알맞은 때에, 충분한 양으로’라고 옮길 수 있습니다. 그리스어 형용사는 문자적으로는 ‘충분한’ 또는 ‘넉넉한’의 뜻이지만, 여기서는 과음이 아닌 절제된 사용을 가리킬 가능성이 큽니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγαλλίαμα καρδίας
  english_pob_choice: gladness of heart
  chosen_korean: 마음의 기쁨
  alternatives_korean:
  - 마음의 즐거움
  - 마음의 환희
  lexicon: LSJ
  rationale: ἀγαλλίαμα는 단순한 쾌감보다 기쁜 들뜸과 환희를 가리키므로, 자연스러운 한국어로는 ‘마음의 기쁨’이 본문의 긍정적 정서를 잘 살립니다.
- source_word: εὐφροσύνη ψυχῆς
  english_pob_choice: joy of soul
  chosen_korean: 영혼의 즐거움
  alternatives_korean:
  - 영혼의 기쁨
  - 속사람의 즐거움
  lexicon: LSJ
  rationale: ψυχή는 여기서 내면 인격 전체를 가리키므로 ‘영혼’이 시적 평행을 보존합니다. εὐφροσύνη의 축제적 뉘앙스는 ‘즐거움’으로 무리 없이 옮겼습니다.
- source_word: ἐν καιρῷ
  english_pob_choice: at the proper time
  chosen_korean: 알맞은 때에
  alternatives_korean:
  - 적절한 때에
  - 때맞춰
  lexicon: LSJ
  rationale: καιρός는 단순한 시간보다 ‘적절한 시기’를 뜻하므로, 지혜문학적 윤리성을 살려 ‘알맞은 때에’로 번역했습니다.
- source_word: αὐτάρκης
  english_pob_choice: in moderation
  chosen_korean: 적당한 양으로
  alternatives_korean:
  - 절제하여
  - 충분한 양으로
  - 알맞게
  lexicon: LSJ
  rationale: 이 형용사는 문자적으로는 ‘충분한, 넉넉한’의 뜻이지만, 포도주와 함께 쓰일 때는 과음이 아닌 분량의 적절함을 가리키므로 ‘적당한 양으로’가 가장 분명합니다.
theological_decisions:
- issue: 포도주에 대한 윤리적 권고의 강도
  chosen_reading: 이 구절은 포도주를 무제한으로 칭찬하지 않고, 알맞은 때와 적절한 양이라는 조건 아래서만 기쁨이 된다고 말합니다.
  alternative_readings:
  - 단순히 포도주는 기쁨을 준다고 말한다.
  - αὐτάρκης를 더 문자적으로 ‘충분한’으로 읽을 수 있다.
  rationale: 본문은 ἐν καιρῷ와 αὐτάρκης를 함께 묶어 시간적·양적 적절성을 강조합니다. 따라서 도덕적 요점을 살려 ‘적당한 양으로’라고 옮겨, 과음을 암시하지 않도록 했습니다.
  doctrine_reference: 'Translation philosophy: optimal equivalence; 지혜문학의 권고 의미 보존'
