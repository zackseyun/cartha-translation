revisions:
- from: 하나님도 지체하지 않으시며, 용사처럼 나가시고 물러서지 않으십니다. 악한 자의 허리를 꺾으시고, 민족들에게 보복을 돌려주실 때까지, 오만의 홀을 빼앗으시고, 악인의 지팡이를 완전히 꺾어 버리실 것입니다.[a]
  to: 하나님께서도 잔혹한 자의 허리를 짓부수시고 민족들에게 보복을 되갚으실 때까지, 또 오만의 홀을 빼앗으시고 악인의 지팡이를 완전히 잘라 버리실 때까지 지체하지 않으시며, 용사처럼 나아가 자신을 억제하지 않으실 것입니다.[a]
  rationale: 개정문은 히브리어의 주절(‘지체하지 않을 것이다; 용사처럼 나아가 자신을 억제하지 않을 것이다’)과 반복되는 두 עד절을 한국어 문장 안에서 명확히 결속했습니다. ‘잔혹한 자’, ‘짓부수다’, ‘완전히 잘라 버리다’로 원문의 심판 이미지와 동사의 강도를 보존하되, 특정 신학적 해석을 덧붙이지 않았습니다. 그리스어 병행 본문은 주본문과 조화시키지 않고 이문 각주로 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T19:21:05Z'
