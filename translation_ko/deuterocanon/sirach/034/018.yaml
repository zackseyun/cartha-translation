  source_fidelity: 히브리어 본문을 주본문으로 삼고 그리스어의 크게 다른 병행 본문을 각주로 처리한 원칙은 적절합니다. 그러나 초안은 ‘민족들에게 보복을 돌려주실 때까지’가 뒤의 동사들과 문법적으로 부자연스럽게 연결되고, 두 번의 עד(‘~할 때까지’)가 이루는 구조가 충분히 드러나지 않습니다. 또한 אכזרי는 여기서 ‘악한 자’보다 ‘잔혹한 자’가 더 직접적이며, גדע의 ‘잘라 끊다’ 이미지는 ‘꺾다’보다 ‘잘라 버리다’가 가깝습니다.
  naturalness: 합쇼체는 대체로 안정적이나, 현재 초안은 ‘나가시고 물러서지 않으십니다’와 뒤의 미래형이 섞이고, ‘~때까지’ 구절이 문장 중간에 매달려 있어 자연스럽지 않습니다. ‘자신을 억제하지 않으시며’는 לא יתאפק의 자기 억제라는 의미를 보존하면서도 현대 한국어에서 명료합니다.
  terminology: ‘용사’, ‘오만의 홀’, ‘악인의 지팡이’는 적절합니다. ‘민족들’은 גוים에 가능한 번역입니다. ‘보복을 되갚으시다’는 ישיב נקם의 되돌림/보응의 뉘앙스와 민족들이 심판의 대상이라는 문맥을 자연스럽게 전달합니다.
