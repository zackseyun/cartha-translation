translation:
  language: ko
  text: 하나님도 지체하지 않으시며, 용사처럼 나가시고 물러서지 않으십니다. 악한 자의 허리를 꺾으시고, 민족들에게 보복을 돌려주실 때까지, 오만의 홀을 빼앗으시고, 악인의 지팡이를 완전히 꺾어 버리실 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 전승은 이 구절을 ‘영혼을 높이고 눈을 밝히며, 치유와 생명과 복을 주는’ 내용으로 전합니다. 이는 현존 히브리어와 상당히 다른 전승입니다.
    reason: textual_variant
lexical_decisions:
- source_word: גם אל לא יתמהמה
  english_pob_choice: Even God will not delay
  chosen_korean: 하나님도 지체하지 않으시며
  alternatives_korean:
  - 하나님도 더디 하지 않으시며
  - 하나님도 머뭇거리시지 않으시며
  lexicon: HALOT
  rationale: גם אל의 강조를 살려 ‘하나님도’로 옮기고, יתמהמה는 지체/더딤의 의미이므로 현대 한국어에서 자연스러운 ‘지체하지 않으시며’로 렌더링했습니다.
- source_word: וכגבור יצא לא יתאפק
  english_pob_choice: like a warrior he will go out and not hold back
  chosen_korean: 용사처럼 나가시고 물러서지 않으십니다
  alternatives_korean:
  - 전사처럼 나가시고 자신을 억제하지 않으십니다
  - 영웅처럼 나오시고 멈추지 않으십니다
  lexicon: HALOT
  rationale: גבור는 전투적 문맥에서 ‘용사’가 자연스럽고, לא יתאפק는 자기억제의 부정이므로 ‘물러서지 않으시며’로 힘 있게 살렸습니다.
- source_word: ימחץ מתני אכזרי
  english_pob_choice: he crushes the loins of the cruel
  chosen_korean: 악한 자의 허리를 꺾으시고
  alternatives_korean:
  - 잔혹한 자의 허리를 부수시고
  - 잔인한 자의 허리를 짓부수시고
  lexicon: HALOT
  rationale: מתנים의 신체적 이미지를 ‘허리’로 옮기되, 한국어에서 과도하게 낯설지 않게 했습니다. אכזרי는 ‘악한 자/잔인한 자’ 둘 다 가능하지만, 문맥상 폭력적 악행을 포괄하는 ‘악한 자’로 정리했습니다.
- source_word: לגוים ישיב נקם
  english_pob_choice: repays vengeance to the nations
  chosen_korean: 민족들에게 보복을 돌려주실 때까지
  alternatives_korean:
  - 나라들에 보복을 갚으실 때까지
  - 민족들 위에 보복을 되돌리실 때까지
  lexicon: HALOT
  rationale: ישיב נקם의 상환/되돌림 뉘앙스를 살려 ‘돌려주실’로 옮겼고, לגוים은 단순히 ‘나라들’보다 성서적 집단성을 드러내는 ‘민족들’이 더 적절합니다.
- source_word: שבט זדון / מטה רשע
  english_pob_choice: the scepter of arrogance / the staff of the wicked
  chosen_korean: 오만의 홀 / 악인의 지팡이
  alternatives_korean:
  - 교만의 홀 / 악인의 막대기
  - 오만의 왕홀 / 사악한 자의 지팡이
  lexicon: HALOT
  rationale: שבט과 מטה의 통치 상징을 한국어에서 ‘홀’과 ‘지팡이’로 구분해 평행 구조를 살렸습니다. זדון은 단순한 자존심보다 ‘오만’이 더 정확합니다.
- source_word: גדוע יגדע
  english_pob_choice: he will cut down completely
  chosen_korean: 완전히 꺾어 버리실 것입니다
  alternatives_korean:
  - 철저히 잘라 버리실 것입니다
  - 완전히 베어 버리실 것입니다
  lexicon: HALOT
  rationale: 원문의 강한 강조(infinitive absolute + finite verb)를 한국어에서 자연스럽게 드러내기 위해 ‘완전히 꺾어 버리실 것입니다’로 옮겼습니다.
theological_decisions:
- issue: 이 절의 폭력적 심판 표상과 인칭 보존
  chosen_reading: 주어를 계속 ‘하나님’으로 유지하고, 심판 동사의 강도를 약화하지 않았습니다.
  alternative_readings:
  - 심판의 이미지를 완화해 ‘다스리실 것입니다’로 옮김
  - 익명화하여 수동태로 표현
  rationale: 본문은 신적 심판의 적극성과 긴박함을 강조하므로, 이를 완화하지 않고 직접적인 행위로 재현하는 것이 원문 의도를 더 잘 반영합니다.
  doctrine_reference: 시락서 34:18의 문맥적 심판 언어
