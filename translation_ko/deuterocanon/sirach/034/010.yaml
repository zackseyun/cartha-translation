base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/034/010.yaml
  text: A man who has not been tested knows little, but one who has wandered[b] increases cunning[c][a].
  footnotes:
  - marker: a
    text: The extant Hebrew line supplied in Zone 1 does not match the Greek text for this verse; the translation therefore follows the Greek witness here.
    reason: textual_variant
  - marker: b
    text: Or 'one who has gone astray' / 'one who has been misled'; the Greek can carry either literal wandering or figurative deviation.
    reason: alternative_reading
  - marker: c
    text: Or 'craftiness' or 'shrewdness.'
    reason: lexical_alternative
translation:
  language: ko
  text: 시험을 받지 않은 사람은 적게 알고, 방황하는 사람은 교활함을 더합니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 제시된 히브리어 줄은 이 절의 그리스어와 일치하지 않으므로, 번역은 그리스어 증언을 따랐습니다.
    reason: textual_variant
  - marker: b
    text: 또는 '길을 잃은 사람' / '미혹된 사람'으로 옮길 수 있습니다. 그리스어는 문자적 방황과 비유적 일탈을 모두 담을 수 있습니다.
    reason: alternative_reading
  - marker: c
    text: 또는 '간교함' 또는 '노련함'으로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς οὐκ ἐπειράθη
  english_pob_choice: a man who has not been tested
  chosen_korean: 시험을 받지 않은 사람
  alternatives_korean:
  - 시련을 겪지 않은 사람
  - 검증되지 않은 사람
  lexicon: BDAG
  rationale: ἐπειράθη의 시험받음/단련됨 의미를 살려, 자연스러운 현대 한국어로 옮겼습니다. '사람'은 일반적 단수의 뜻을 담으면서도 성중립적으로 읽히게 합니다.
- source_word: ὀλίγα οἶδεν
  english_pob_choice: knows little
  chosen_korean: 적게 알고
  alternatives_korean:
  - 아는 것이 적고
  - 거의 알지 못하고
  lexicon: BDAG
  rationale: 짧은 지혜 격언의 병렬성을 살리기 위해 간결하게 옮겼습니다.
- source_word: ὁ δὲ πεπλανημένος
  english_pob_choice: one who has wandered
  chosen_korean: 방황하는 사람
  alternatives_korean:
  - 길을 잃은 사람
  - 그릇된 길로 간 사람
  - 미혹된 사람
  lexicon: BDAG
  rationale: πλανάω의 '헤매다/방황하다' 범위를 살리되, 문맥상 경험 축적의 뉘앙스와 도덕적 일탈 가능성을 모두 완전히 좁히지 않도록 했습니다.
- source_word: πανουργίαν
  english_pob_choice: cunning
  chosen_korean: 교활함
  alternatives_korean:
  - 간교함
  - 약삭빠름
  - 노련함
  lexicon: BDAG
  rationale: 이 단어의 부정적 색채를 분명히 드러내는 한국어를 택했습니다. 지혜문학의 문맥상 '경험으로 얻는 영리함'보다 '교활함'이 원문의 긴장을 더 잘 보존합니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행본문의 불일치
  chosen_reading: 이 절은 그리스어 증언을 본문으로 번역하고, 히브리어 불일치는 숨기지 않았습니다.
  alternative_readings:
  - 제시된 히브리어를 그대로 이 절로 번역하기
  rationale: 제공된 히브리어 문장은 이 절의 내용과 맞지 않고, 그리스어는 이 절과 정확히 대응합니다. 원천언어 우선과 투명성 원칙에 따라 그리스어를 번역 기준으로 삼는 것이 타당합니다.
  doctrine_reference: 'PHILOSOPHY.md: 원천언어 우선과 투명성'
