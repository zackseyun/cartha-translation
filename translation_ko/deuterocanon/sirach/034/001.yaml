lexical_decisions:
- source_word: κεναὶ
  english_pob_choice: empty
  chosen_korean: 텅 비고
  alternatives_korean:
  - 빈
  - 허무한
  - 헛된
  lexicon: LSJ
  rationale: κενός의 핵심은 내용이나 실재가 비어 있음이므로, 한국어에서는 ‘텅 비고’로 실질 없는 상태를 자연스럽게 살렸습니다.
- source_word: ψευδεῖς
  english_pob_choice: 'false'
  chosen_korean: 거짓된
  alternatives_korean:
