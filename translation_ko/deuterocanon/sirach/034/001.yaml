  - 허위의
  - 속이는
  lexicon: LSJ
  rationale: ψευδής는 참되지 않다는 뜻이므로, ‘거짓된’이 도덕적·인식적 허위를 가장 सीधे하게 드러냅니다.
- source_word: ἀσυνέτῳ ἀνδρί
  english_pob_choice: senseless man
  chosen_korean: 분별없는 사람에게나
  alternatives_korean:
  - 지각 없는 남자에게
  - 어리석은 사람에게
  - 이해 없는 사람에게
  lexicon: LSJ
  rationale: ἀσύνετος는 ‘분별이 없는’ 뜻이고, ἀνήρ는 남성형이지만 속담적 일반 진술이므로 한국어에서는 문맥상 자연한 ‘사람’으로 옮기되, 무감각한 판단 결핍을 드러내는 ‘분별없는’으로 대응했습니다.
- source_word: ἀναπτεροῦσιν
  english_pob_choice: give wings to
  chosen_korean: 날개를 달아 줍니다
  alternatives_korean:
  - 날개를 붙여 줍니다
  - 날아가게 합니다
  - 떠밀어 올립니다
  lexicon: LSJ
  rationale: 동사는 문자적으로 ‘날개를 달다/날게 하다’는 이미지이므로, 꿈이 어리석은 자를 허망한 방향으로 실어 나르는 비유를 살려 직역적 이미지를 유지했습니다.
theological_decisions:
- issue: ἀνδρί의 성별 표지와 한국어 보편화
  chosen_reading: 문맥은 남성형 단수이지만 한국어 본문은 ‘사람’으로 번역했습니다.
  alternative_readings:
  - 남자
  - 인간
  rationale: 히브리/헬라 지혜문학의 속담적 일반화에서는 성별 표지가 대표성의 기능을 하므로, 한국어에서는 과도한 남성 일반화를 피하면서도 경구의 보편성을 유지하는 쪽을 택했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
