base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/034/020.yaml
  text: The kindness of Yahweh is fitting in a time of distress[a], like a rain cloud in a time of drought.
  footnotes:
  - marker: a
    text: 'Greek: ''The Most High does not delight in the offerings of the ungodly, nor is he appeased for sins by a multitude of sacrifices.'' The Hebrew and Greek witnesses differ substantially at this verse.'
    reason: textual_variant
translation:
  language: ko
  text: 환난 때에 야훼의 인자하심은 마땅하며, 가뭄 때의 비구름과도 같습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '그리스어: “지존자는 악인의 제물을 기뻐하지 않으시며, 많은 희생제물로도 죄를 달래지 않으십니다.” 히브리어와 그리스어 증언은 이 절에서 상당히 다릅니다.'
    reason: textual_variant
lexical_decisions:
- source_word: נאה
  english_pob_choice: is fitting
  chosen_korean: 마땅하며
  alternatives_korean:
  - 알맞으며
  - 아름다우며
  - 보기 좋으며
  lexicon: HALOT
  rationale: נאה는 단순한 미적 ‘아름다움’보다 상황에 합당함을 나타내므로, 현대 한국어에서는 ‘마땅하다’가 의미를 가장 직접적으로 살립니다.
- source_word: חסד
  english_pob_choice: kindness
  chosen_korean: 인자하심
  alternatives_korean:
  - 친절
  - 은혜
  - 자애
  lexicon: HALOT
  rationale: 이 문맥의 חסד는 단순한 친절보다 필요할 때 베푸는 호의와 선의를 가리키므로, 한국어 성경에서 널리 쓰이는 ‘인자하심’이 가장 자연스럽고 문맥에 맞습니다.
- source_word: כעב חזיזים
  english_pob_choice: like a rain cloud
  chosen_korean: 가뭄 때의 비구름과도
  alternatives_korean:
  - 비를 머금은 구름과도
  - 소나기 구름과도
  - 폭풍구름과도
  lexicon: HALOT
  rationale: 이미지의 핵심은 가뭄 속에서 비를 가져오는 구름이므로, ‘비구름’으로 옮겨 생명 회복의 비유를 살렸습니다.
- source_word: בעת בצרת
  english_pob_choice: in a time of drought
  chosen_korean: 가뭄 때
  alternatives_korean:
  - 메마름의 때
  - 건기 때
  - 메마른 때
  lexicon: HALOT
  rationale: בצרת는 건조하고 메마른 상태를 가리키므로, 농경적 대비가 분명한 ‘가뭄 때’가 가장 직관적입니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행본문의 큰 차이
  chosen_reading: 히브리어 본문을 본문으로 번역하고, 그리스어의 전혀 다른 독법은 각주로 투명하게 남깁니다.
  alternative_readings:
  - ‘지존자께서는 악인의 제물을 기뻐하지 않으시며…’
  rationale: 이 절은 히브리어와 그리스어가 문장 차원에서 크게 다르므로, 현존하고 신뢰도 높은 히브리어를 본문으로 따르되 대체 전승은 숨기지 않아야 합니다.
  doctrine_reference: 'PHILOSOPHY.md: 히브리어가 남아 있으면 히브리어를 본문으로, 큰 차이는 각주로 보존'
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 프로젝트 기본 용례에 따라 신명은 학술적 전사인 ‘야훼’로 옮겨 원문 고유성을 드러냅니다.
  doctrine_reference: 프로젝트 기본 용례
