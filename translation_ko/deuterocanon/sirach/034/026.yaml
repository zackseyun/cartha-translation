  text: A furnace tests the tempering in dipping[b][a]; so wine tests hearts in the strife of the proud.
  footnotes:
  - marker: a
    text: The Greek of the first line is difficult. The phrase rendered 'the tempering in dipping' may also be understood more specifically as 'an edge in quenching' or, more generally, 'metalwork in immersion.'
    reason: lexical_alternative
  - marker: b
    text: Or 'wine tests hearts in the battle of the proud.' The Greek word can denote battle or conflict; here it is rendered more generally as 'strife.'
    reason: alternative_reading
translation:
  language: ko
  text: 화덕은 담금질을 시험하고, 그와 같이 포도주는 교만한 자들의 다툼 속에서 마음을 시험합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어의 첫 행은 난해합니다. 여기서는 금속을 열로 단련하는 넓은 이미지를 따라 옮겼습니다.
    reason: source_note
  - marker: b
    text: 또는 ‘교만한 자들의 전쟁 속에서’로 옮길 수 있습니다. μάχη는 전쟁이나 충돌을 가리킬 수 있습니다.
    reason: alternative_reading
