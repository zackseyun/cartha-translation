  text: He who offers a sacrifice from the goods of the poor is like one who slaughters a son before his father[a].
  footnotes:
  - marker: a
    text: Or, more literally, 'The one offering a sacrifice from the goods of the poor is one slaughtering a son before his father.' The Greek is a compressed proverbial comparison.
    reason: lexical_alternative
translation:
  language: ko
  text: 가난한 이들의 재물로 제물을 바치는 자는 아버지 앞에서 아들을 죽이는 자와 같습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 헬라어는 압축된 속담형 비교문으로, 더 문자적으로는 “가난한 이들의 재물로 제물을 바치는 자는 아버지 앞에서 아들을 죽이는 자이다”라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: θύων
  english_pob_choice: is like one who slaughters
  chosen_korean: 죽이는 자와 같습니다
  alternatives_korean:
  - 잡는 자와 같습니다
  - 희생제사를 드리는 자와 같습니다
  - 도살하는 자와 같습니다
  lexicon: LSJ
  rationale: θύων은 제사적 ‘바침’과 ‘도살/죽임’의 뉘앙스를 함께 가지므로, 비교문의 충격을 살리기 위해 ‘죽이는’으로 옮기고 “~와 같습니다”로 영어 POB의 비교 구조를 반영했습니다.
- source_word: υἱὸν
  english_pob_choice: a son
  chosen_korean: 아들을
  alternatives_korean:
  - 한 아들을
  - 자식을
  - 그 아들을
  lexicon: LSJ
  rationale: 그리스어에는 소유격이 없으므로, 본문의 문법을 따라 특정 소유를 덧붙이지 않고 ‘아들’을 유지했습니다.
- source_word: ἔναντι
  english_pob_choice: before
  chosen_korean: 앞에서
  alternatives_korean:
  - 면전에서
  - 존전에서
  - 앞에
  lexicon: LSJ
  rationale: ἔναντι는 직접적인 현전 앞을 가리키므로, 한국어에서 가장 간결하고 자연스러운 ‘앞에서’로 옮겼습니다.
- source_word: ἐκ χρημάτων πενήτων
  english_pob_choice: from the goods of the poor
  chosen_korean: 가난한 이들의 재물로
  alternatives_korean:
  - 가난한 이들의 물건으로
  - 가난한 자들의 돈으로
  - 가난한 이들의 소유로
  lexicon: LSJ
  rationale: χρήματα는 돈에만 국한되지 않고 재산·재물을 뜻할 수 있어, 착취의 범위를 넓게 담는 ‘재물’이 적절합니다. πενήτων은 복수이므로 ‘가난한 이들’로 옮겼습니다.
theological_decisions:
- issue: 압축된 속담형 비교문의 구조
  chosen_reading: 제물을 바치는 행위가 곧바로 비유의 주어가 되도록, 한국어에서 비교를 명시해 이해를 돕되 의미를 확장하지는 않았습니다.
  alternative_readings:
  - 그대로 압축해 “가난한 이들의 재물로 제물을 바치는 자, 아버지 앞에서 아들을 죽이는 자.”처럼 둘 수 있습니다.
  rationale: 헬라어는 매우 압축된 격언적 문장이라 한국어에서는 비교 표지를 드러내는 것이 본문의 뜻을 더 정확히 전달합니다.
  doctrine_reference: 'Translation philosophy: optimal equivalence; source의 격언적 경고를 명료하게 보존함.'
