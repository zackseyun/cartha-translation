theological_decisions:
- issue: 이 절의 술 경계가 포도주 자체인지, 과도한 음주인지
  chosen_reading: 포도주 자체가 아니라 ‘과도하게 마신 포도주’가 문제라는 점을 본문 구조로 드러냈습니다.
  alternative_readings:
  - 포도주는 쓴맛이다
  - 포도주는 영혼의 쓴맛이다
  rationale: πινόμενος πολὺς는 양적으로 과도하게 마셔지는 상황을 가리키므로, 절의 경고 초점을 음주 과잉에 두는 것이 원문에 더 충실합니다.
