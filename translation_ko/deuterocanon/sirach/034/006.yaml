  text: Unless it is sent from the Most High in visitation[b][a], do not give your heart to them.
  footnotes:
  - marker: a
    text: Or 'to these things,' referring to the dreams and similar experiences mentioned in the surrounding context.
    reason: lexical_alternative
  - marker: b
    text: '''In visitation'' may also be understood as ''at the time of visitation'' or ''in divine inspection/oversight.'''
    reason: alternative_reading
translation:
  language: ko
  text: 지극히 높으신 이에게서 보내진 것이 아니면, 그런 것들에 마음을 주지 마십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 여기서 ‘그런 것들’은 앞뒤 문맥에서 언급된 꿈과 유사한 체험들을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘보냄을 받을 때에’는 ‘감찰 가운데’, ‘방문하시는 때에’, ‘권고하심 가운데’로도 이해할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐὰν μὴ
  english_pob_choice: Unless
  chosen_korean: …이 아니면
  alternatives_korean:
  - …하지 않으면
  - …이 아니라면
  lexicon: LSJ
  rationale: 부정 조건의 경고를 현대 한국어에서 가장 자연스럽게 살리기 위해 ‘…이 아니면’으로 옮겼습니다.
- source_word: παρὰ Ὑψίστου
  english_pob_choice: from the Most High
  chosen_korean: 지극히 높으신 이에게서
  alternatives_korean:
  - 가장 높으신 분에게서
  - 지극히 높으신 분으로부터
  lexicon: LSJ
  rationale: Ὑψίστου를 하나님을 가리키는 칭호로 풀어 옮기되, 한국어 성경 문체에서 자연스러운 ‘지극히 높으신 이’로 처리했습니다.
- source_word: ἐν ἐπισκοπῇ
  english_pob_choice: in visitation
  chosen_korean: 보냄을 받을 때에
  alternatives_korean:
  - 방문 중에
  - 감찰 가운데
  - 권고하심 가운데
  lexicon: LSJ
  rationale: ‘ἐπισκοπή’의 의미 범위가 넓어 방문/감찰/감독의 함의를 모두 가질 수 있으므로, POB의 열린 해석을 따라 ‘보냄을 받을 때에’로 완화해 문맥상 경고의 기능을 살렸습니다.
- source_word: εἰς αὐτὰ
  english_pob_choice: to them
  chosen_korean: 그런 것들에
  alternatives_korean:
  - 그것들에
  - 그 일들에
  lexicon: LSJ
  rationale: 문맥의 꿈과 유사한 체험들을 가리키는 대명사이므로, 한국어에서는 지시를 분명하게 하되 해석을 과도하게 좁히지 않는 ‘그런 것들’을 택했습니다.
theological_decisions:
- issue: ἐν ἐπισκοπῇ의 열린 의미 유지
  chosen_reading: ‘보냄을 받을 때에’로 옮겨, 그것이 하나님의 방문/감찰/섭리적 개입인지 단정하지 않고 문맥의 경고성을 유지했습니다.
  alternative_readings:
  - 감찰 가운데
  - 권고하심 가운데
  - 심판하시는 때에
  rationale: 본문은 꿈과 유사 체험이 באמת로 하늘에서 오는지 분별하라는 취지이므로, 특정 신학 해석으로 고정하기보다 원문의 모호성을 보존하는 것이 적절합니다.
  doctrine_reference: 본문의 모호성 보존
- issue: 수신어의 지시대상 명시
  chosen_reading: ‘그런 것들’로 풀어 꿈과 유사한 체험을 가리키는 문맥적 지시를 분명히 했습니다.
  alternative_readings:
  - 그것들
  - 이것들
  rationale: 이 대목은 주변 문맥을 참조하는 대명사이므로, 한국어 독자가 경고의 대상이 무엇인지 즉시 이해하도록 보조하되, 본문 의미를 넘어서지는 않게 했습니다.
  doctrine_reference: 문맥적 지시어 해명
