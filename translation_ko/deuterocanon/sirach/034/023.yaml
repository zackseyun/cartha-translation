  text: Whoever takes away a neighbor’s livelihood is murdering him[b][a], and whoever withholds a hired worker’s wages is shedding blood.
  footnotes:
  - marker: a
    text: Or, more literally, 'the one who takes away subsistence.' The Greek term refers to the means by which a person lives.
    reason: lexical_alternative
  - marker: b
    text: The verse states the moral equivalence directly rather than saying merely 'is like a murderer.'
    reason: alternative_reading
translation:
  language: ko
  text: 이웃의 생계[a]를 빼앗는 사람은 이웃을 살해하는 것이며[b], 품꾼의 삯을 가로채는 사람은 피를 흘리는 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: συμβίωσις는 여기서 사람이 살아가는 데 필요한 생계, 곧 삶의 수단을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 본문은 ‘살인자와 같다’는 비교가 아니라, 생계를 빼앗는 일을 이웃을 살해하는 일과 직접 연결하여 말합니다.
    reason: alternative_reading
