  yaml_path: translation/deuterocanon/sirach/034/024.yaml
  text: One builds and another tears down—what did they gain beyond toil?[a]
  footnotes:
  - marker: a
    text: Or, 'what profit did they have except toil?' The Greek wording asks what benefit remained when one person's building was undone by another's tearing down.
    reason: lexical_alternative
translation:
  language: ko
  text: 한 사람은 짓고 다른 사람은 허뭅니다—그들이 수고 말고 무엇을 더 얻었겠습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘수고 말고 어떤 유익을 얻었겠습니까?’ 그리스어 표현은 한 사람의 짓는 일이 다른 사람의 허무는 일로 무너질 때 남는 유익이 무엇인지 묻습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰκοδομῶν
  english_pob_choice: builds
  chosen_korean: 짓고
  alternatives_korean:
  - 세우고
  - 건축하고
  lexicon: LSJ
  rationale: 공경어체의 현대 한국어에서 건물을 세우는 동작을 자연스럽게 드러내면서, 짧은 잠언형 문장의 리듬을 유지합니다.
- source_word: καθαιρῶν
  english_pob_choice: tears down
  chosen_korean: 허뭅니다
  alternatives_korean:
  - 헐고
  - 무너뜨리고
  lexicon: LSJ
  rationale: καθαιρέω의 ‘헐다/철거하다’ 의미를 살리되, 앞의 ‘짓고’와 대구를 이루는 동작성을 유지합니다.
- source_word: τί ὠφέλησαν πλεῖον ἢ κόπους
  english_pob_choice: what did they gain beyond toil?
  chosen_korean: 그들이 수고 말고 무엇을 더 얻었겠습니까?
  alternatives_korean:
  - 그들이 수고 외에 무엇을 더 얻었겠습니까?
  - 수고 말고는 무엇을 더 얻었겠습니까?
  lexicon: LSJ
  rationale: ὠφελέω의 ‘유익을 얻다/얻을 것이 있다’는 질문을 한국어의 ‘얻다’로 옮겨, 결과적으로 남는 이익이 없다는 수사적 물음을 보존합니다.
- source_word: κόπους
  english_pob_choice: toil
  chosen_korean: 수고
  alternatives_korean:
  - 노고
  - 애씀
  lexicon: LSJ
  rationale: κόπος의 ‘힘든 노동, 노고’에 해당하는 말로, 잠언적 문맥에서 가장 자연스럽고 과도하게 문어적이지 않은 표현입니다.
theological_decisions:
- issue: 잠언형 일반화의 주어 처리
  chosen_reading: 한 사람은 짓고 다른 사람은 허뭅니다
  alternative_readings:
  - 사람은 하나는 짓고 다른 하나는 허뭅니다
  - 어떤 이는 짓고 다른 이는 허뭅니다
  rationale: 그리스어 분사구문이 제시하는 일반적·격언적 대조를 한국어의 ‘한 사람/다른 사람’으로 간결하게 살려, 성별을 불필요하게 덧입히지 않았습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy, gender-accurate over gender-neutral
- issue: 수사적 질문의 강도
  chosen_reading: 그들이 수고 말고 무엇을 더 얻었겠습니까?
  alternative_readings:
  - 그들이 수고 외에 무엇을 더 얻었겠습니까?
  - 그들이 얻은 것이 수고 말고 또 무엇이 있겠습니까?
  rationale: 서로 상쇄되는 행동의 허무함을 드러내는 질문으로 읽어, 단순한 정보 질문이 아니라 잃은 것만 남는다는 책망의 뉘앙스를 유지했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy, optimal equivalence
