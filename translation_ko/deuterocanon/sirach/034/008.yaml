  text: Without falsehood the law will be fulfilled[b][a], and wisdom is perfection for a faithful mouth.
  footnotes:
  - marker: a
    text: Or 'wisdom is completion in a faithful mouth.' The Greek syntax of the final clause is compact and may be construed slightly differently.
    reason: alternative_reading
  - marker: b
    text: The Greek source for this verse is textually or syntactically difficult at the final clause; this translation follows the extant wording without claiming more certainty than the text allows.
    reason: textual_variant
translation:
  language: ko
  text: 거짓 없이 율법은 이루어질 것이며, 지혜는 신실한 입의 완성입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 마지막 절의 그리스어 구문은 압축적이어서 ‘신실한 입의 완성’처럼도, ‘신실한 입 안에서의 완성’처럼도 읽힐 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 이 절의 그리스어는 마지막 절에서 문법적으로 다소 난해하므로, 본 번역은 확정적 해석을 넘어서지 않도록 최대한 원문을 따라 옮겼습니다.
    reason: textual_variant
lexical_decisions:
- source_word: ἄνευ ψεύδους
  english_pob_choice: Without falsehood
  chosen_korean: 거짓 없이
  alternatives_korean:
  - 거짓말 없이
  - 속임수 없이
  lexicon: LSJ
  rationale: ἄνευ의 부정 의미를 자연스럽게 살리면서, ψεύδους의 추상적 도덕성을 담아 한국어로는 짧고 힘 있게 ‘거짓 없이’로 옮겼습니다.
- source_word: συντελεσθήσεται νόμος
  english_pob_choice: the law will be fulfilled
  chosen_korean: 율법은 이루어질 것이며
  alternatives_korean:
  - 율법은 완성될 것이며
  - 율법은 성취될 것이며
  lexicon: LSJ
  rationale: νόμος는 지혜문학 맥락이지만 본문 그대로 ‘율법’으로 두고, συντελεσθήσεται는 결과의 완성과 성취를 함께 담는 ‘이루어질 것이다’로 옮겼습니다.
- source_word: σοφία στόματι πιστῷ τελείωσις
  english_pob_choice: wisdom is perfection for a faithful mouth
  chosen_korean: 지혜는 신실한 입의 완성입니다
  alternatives_korean:
  - 지혜는 신실한 입에게 완성입니다
  - 지혜는 신실한 입 안에서의 완성입니다
  lexicon: LSJ
  rationale: 압축된 그리스어 종결구를 과도하게 풀지 않고, τελείωσις의 완료·완성 의미를 살려 ‘완성’으로 옮겼습니다. στόματι πιστῷ는 직역의 딱딱함을 피하면서도 비유를 유지하기 위해 ‘신실한 입의’로 처리했습니다.
theological_decisions:
- issue: στόματι πιστῷ의 압축된 구문 처리
  chosen_reading: ‘신실한 입의 완성’으로 옮겨, 소유·귀속 관계를 암시하되 문장을 자연스럽게 유지했습니다.
  alternative_readings:
  - ‘신실한 입에게 완성’
  - ‘신실한 입 안에서의 완성’
  rationale: 본문의 마지막 절은 구문이 압축되어 있어 의미를 단정적으로 풀기보다, 원문이 허용하는 범위를 보존하는 쪽이 더 충실합니다.
  doctrine_reference: Translation philosophy §3
