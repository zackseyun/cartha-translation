  text: I have seen many things in my wandering, and my understanding is more than my words.[b][a]
  footnotes:
  - marker: a
    text: The extant Cairo Geniza Hebrew line supplied here does not match this verse's sense and appears to reflect displaced material; the translation therefore follows the Greek witness for Sirach 34:11.
    reason: textual_variant
  - marker: b
    text: Or 'in my error,' 'in my travels,' or 'in my straying' for 'in my wandering.'
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 내 방황 가운데서 많은 것을 보았고, 내 깨달음은 내 말보다 더합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 현존하는 카이로 게니자 히브리어 행은 이 절의 의미와 맞지 않으며, 옮김은 그리스어 증거를 따랐습니다.
    reason: textual_variant
  - marker: b
    text: ‘방황’은 ‘오류’, ‘여행’, ‘길 잃음’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλὰ ἑόρακα
  english_pob_choice: I have seen many things
  chosen_korean: 나는 … 많은 것을 보았고
  alternatives_korean:
  - 나는 … 많이 보았고
  - 나는 … 많은 일들을 보았고
  lexicon: LSJ
  rationale: 완료의 경험적 뉘앙스를 살려 ‘보았고’로 옮기고, πολλὰ는 ‘많은 것’을 써서 내용의 범위를 자연스럽게 드러냅니다.
- source_word: ἐν τῇ ἀποπλανήσει μου
  english_pob_choice: in my wandering
  chosen_korean: 내 방황 가운데서
  alternatives_korean:
  - 내 떠돌아다님 가운데서
  - 내 길 잃음 가운데서
  - 내 방황 중에
  lexicon: LSJ
  rationale: ἀποπλάνησις는 단순한 여행보다 길을 벗어난 방황/유랑의 느낌을 주므로, 문맥을 과도하게 도덕화하지 않으면서 ‘방황’으로 옮겼습니다.
- source_word: πλείονα τῶν λόγων μου
  english_pob_choice: more than my words
  chosen_korean: 내 말보다 더합니다
  alternatives_korean:
  - 내 말보다 더 큽니다
  - 내가 말하는 것보다 더합니다
  lexicon: LSJ
  rationale: 비교구문을 한국어에서 자연스럽게 풀어, ‘이해/깨달음이 말의 한계를 넘는다’는 뜻이 드러나도록 했습니다.
- source_word: σύνεσίς μου
  english_pob_choice: my understanding
  chosen_korean: 내 깨달음
  alternatives_korean:
  - 내 이해
  - 내 분별
  lexicon: LSJ
  rationale: 지혜문학적 σύνεσις를 단순 지식보다 통찰이 담긴 ‘깨달음’으로 옮겨, 말로 다 담기지 않는 내적 통찰을 살렸습니다.
theological_decisions:
