translation:
  language: ko
  text: 주님을 경외하는 사람은 흔들리지 않고, 두려워하지도 않습니다. 주님께서 그의 희망이시기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 제공된 카이로 게니자 히브리어 행은 “그는 고아의 부르짖음을 저버리지 않으며, 과부가 호소를 거듭할 때에도 그러하다”라는 뜻으로 읽힙니다. 이는 이 절의 그리스어 본문과 일치하지 않으며, 원문 자료의 절 행이 서로 뒤바뀌었을 가능성을 보여 줍니다.
    reason: textual_variant
lexical_decisions:
- source_word: ὁ φοβούμενος
  english_pob_choice: One who fears
  chosen_korean: 주님을 경외하는 사람은
  alternatives_korean:
  - 주님을 두려워하는 사람은
  - 주님을 경외하는 자는
  lexicon: BDAG
  rationale: 형용사적 분사구를 현대 한국어에서 자연스러운 보편 진술로 옮겼습니다. ‘경외하다’는 지혜문학 맥락에서 단순한 공포보다 하나님에 대한 경외를 더 잘 드러냅니다.
- source_word: Κύριον
  english_pob_choice: the Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주
  - 주인
  lexicon: BDAG
  rationale: 여기서 κύριος는 하나님을 가리키는 호칭이므로 프로젝트 기본값에 따라 ‘주님’으로 옮겼습니다.
- source_word: οὐ μὴ πτοηθῇ καὶ οὐ μὴ δειλιάσῃ
  english_pob_choice: will not be shaken, and will not be afraid
  chosen_korean: 흔들리지 않고, 두려워하지도 않습니다
  alternatives_korean:
  - 겁먹지 않고, 떨지 않습니다
  - 불안해하지 않고, 두려워하지도 않습니다
  lexicon: BDAG
  rationale: πτοέω와 δειλιάω의 중복 강조를 한국어에서 ‘흔들리다’와 ‘두려워하다’로 대응해 정서적 동요와 두려움의 양측면을 살렸습니다.
- source_word: αὐτὸς ἐλπὶς αὐτοῦ
  english_pob_choice: for he is his hope
  chosen_korean: 그는 그의 희망이기 때문입니다
  alternatives_korean:
  - 그가 그의 희망이기 때문입니다
  - 그 자신이 그의 희망이기 때문입니다
  lexicon: BDAG
  rationale: 대명사 αὐτός를 간결하게 ‘그는’으로 살리고, ἐλπίς는 추상명사 ‘희망’으로 옮겨 문장의 논지를 직접적으로 드러냈습니다.
theological_decisions:
- issue: 그리스어 본문과 제공된 히브리어 행의 불일치
  chosen_reading: 그리스어 병행본문을 따라 ‘주님을 경외하는 사람…’으로 번역하고, 히브리어는 주석으로만 남깁니다.
  alternative_readings:
  - 히브리어를 따라 ‘고아의 부르짖음을 무시하지 않고…’로 번역
  rationale: 제공된 히브리어는 이 절의 그리스어 내용과 의미가 맞지 않아 major_mismatch로 표시되어 있습니다. 따라서 본문은 그리스어를 기준으로 하고, 불일치는 투명하게 처리하는 것이 가장 충실합니다.
  doctrine_reference: 'Sirach source policy: where a supplied witness is mismatched, translate the defensible base text while preserving the variant transparently.'
