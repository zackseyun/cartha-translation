  naturalness: ‘주님께서 그의 희망이시기 때문입니다’가 현대 표준 한국어 합쇼체에서 자연스럽고, 원문의 인과 관계와 대명사 관계를 분명히 합니다. ‘흔들리지 않고’와 ‘두려워하지도 않습니다’는 두 동사의 병렬 강조를 자연스럽게 보존합니다.
