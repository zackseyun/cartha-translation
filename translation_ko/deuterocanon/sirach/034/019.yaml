base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/034/019.yaml
  text: Until he repays a man for his deed[a], and a person's recompense according to his scheme; until he pleads the case of his people and gladdens them with his salvation.
  footnotes:
  - marker: a
    text: 'The extant Greek text of Sirach 34:19 reads instead: ''One who sacrifices from injustice offers a blemished offering, and the gifts of lawless men are not for acceptance.'' The surviving Hebrew witness here differs substantially from the Greek.'
    reason: alternative_reading
translation:
  language: ko
  text: 그분께서 사람에게 그가 행한 대로 갚아 주시고, 각 사람에게 그 계획대로 보응하실 때까지, 그분께서 자기 백성의 송사를 변론하시고 그들을 자신의 구원으로 기쁘게 하실 때까지입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 현존하는 그리스어 본문은 달리 읽습니다. “불의한 것으로 제사를 드리는 이는 흠 있는 제물을 드리며, 불법한 자들의 예물은 받아들여지지 않습니다.” 현존하는 히브리어 증언은 여기서 그리스어 본문과 크게 다릅니다.
    reason: textual_variant
lexical_decisions:
- source_word: עד
  english_pob_choice: until
  chosen_korean: -할 때까지
  alternatives_korean:
  - -하는 동안
  - -하는 한
  lexicon: HALOT
  rationale: 두 절 모두 앞선 조건의 종료 시점을 나타내므로 한국어에서는 반복되는 종결표현으로 ‘-할 때까지’를 사용해 시간적 한계를 분명히 했습니다.
- source_word: ישיב
  english_pob_choice: he repays
  chosen_korean: 갚아 주실
  alternatives_korean:
  - 되돌려 주실
  - 보상하실
  lexicon: HALOT
  rationale: 여기서는 단순한 ‘돌려주다’보다 행위에 대한 응보적 갚음을 드러내는 ‘갚아 주다’가 문맥에 더 맞습니다.
- source_word: גמול אדם
  english_pob_choice: a person's recompense
  chosen_korean: 사람에게 … 보응
  alternatives_korean:
  - 사람의 보상
  - 사람의 갚음
  lexicon: HALOT
  rationale: גמול은 도덕적·사법적 의미의 보응이 강하므로 ‘보응’으로 옮겨서 앞 절의 행위에 대한 상응성을 살렸습니다.
- source_word: יריב ריב עמו
  english_pob_choice: he pleads the case of his people
  chosen_korean: 자기 백성의 송사를 변호하시고
  alternatives_korean:
  - 자기 백성의 사건을 변호하시고
  - 자기 백성의 다툼을 풀어 주시고
  lexicon: HALOT
  rationale: ריב ריב의 법정적 뉘앙스를 살리기 위해 ‘송사’와 ‘변호하다’를 사용해, 하나님이 백성의 법적 분쟁을 맡아 주시는 그림을 유지했습니다.
- source_word: ושמחם
  english_pob_choice: and gladdens them
  chosen_korean: 그들을 … 기쁘게 하실
  alternatives_korean:
  - 그들을 즐겁게 하실
  - 그들에게 기쁨을 주실
  lexicon: HALOT
  rationale: 사역적 의미의 שמח를 자연스러운 현대 한국어로 옮기되, 단순 감정 상태보다 ‘기쁘게 하다’의 원인 제공 의미를 살렸습니다.
theological_decisions:
- issue: 히브리어 본문을 우선하면서 그리스어 병행본문과의 큰 차이를 어떻게 처리할지
  chosen_reading: 본문은 현존 히브리어를 따라 번역하고, 그리스어는 별도의 주석으로만 알립니다.
  alternative_readings:
  - '그리스어: ‘불의에서 제사하는 자는 흠 있는 제물을 드리며, 불법한 자들의 예물은 기쁘게 받지 못합니다.’'
  rationale: 이 단락은 히브리어와 그리스어가 실질적으로 다른 문장을 전하므로, 본문은 히브리어를 따르되 독자가 전승 차이를 알 수 있게 주석으로 보존하는 것이 가장 정직합니다.
  doctrine_reference: 'PHILOSOPHY.md: 히브리어가 보존된 곳에서는 히브리어를 본문으로 번역하고, 중대한 이본 차이는 각주로 보존'
