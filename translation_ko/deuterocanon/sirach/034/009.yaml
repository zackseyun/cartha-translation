  rationale: 그리스어의 남성형이지만 잠언적 일반 진술이므로 한국어에서는 성별을 굳이 드러내지 않는 ‘사람’이 문맥상 자연스럽고, 현대 합쇼체 문체에도 잘 맞습니다.
