base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/034/009.yaml
  text: A man who has traveled[b] knows many things, and one with much experience will recount understanding.[a]
  footnotes:
  - marker: a
    text: The supplied Hebrew witness for this verse is materially divergent and reads, approximately, 'In all your deeds show a cheerful face, and with gladness tithe what is holy.' Because that line does not match the context of Sirach 34:9, the main text follows the Greek witness here.
    reason: textual_variant
  - marker: b
    text: Or 'A trained/educated man knows many things.' The Greek wording can naturally bear that sense, though the context of Sirach 34 favors learning through travel and experience.
    reason: lexical_alternative
translation:
  language: ko
  text: 여행을 많이 한 사람은 많은 것을 알고, 경험이 많은 사람은 지혜를 이야기합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 제공된 히브리어 증거는 이 절과 의미가 크게 어긋나며, 대략 ‘모든 행위에서 밝은 얼굴을 보이고, 기쁨으로 거룩한 것을 십일조로 드리라’는 뜻입니다. 따라서 본문은 그리스어 증거를 따릅니다.
    reason: textual_variant
  - marker: b
    text: ‘여행을 많이 한’에 해당하는 그리스어는 문맥상 ‘훈련받은/교육받은’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνὴρ
  english_pob_choice: a man
  chosen_korean: 사람
  alternatives_korean:
  - 남자
  - 한 사람
  lexicon: BDAG
  rationale: 그리스어의 남성형이지만 잠언적 일반 진술이므로 한국어에서는 성별을 굳이 드러내지 않는 ‘사람’이 문맥상 자연스럽고, 현대 합쇼체 문체에도 잘 맞습니다.
- source_word: πεπαιδευμένος
  english_pob_choice: who has traveled
  chosen_korean: 여행을 많이 한
  alternatives_korean:
  - 훈련받은
  - 교육받은
  - 단련된
  lexicon: BDAG
  rationale: 영어 POB의 해석처럼 본문 맥락이 학문적 교육보다 여행과 경험을 통한 배움을 가리키므로, 그 함의를 살려 ‘여행을 많이 한’으로 옮겼습니다.
- source_word: ὁ πολυπειρῶν
  english_pob_choice: one with much experience
  chosen_korean: 경험이 많은 사람
  alternatives_korean:
  - 많이 경험한 사람
  - 매우 경험 많은 이
  lexicon: BDAG
  rationale: 복합어가 강조하는 ‘많은 경험’을 한국어에서 가장 직접적으로 드러내는 표현으로 옮겼습니다.
- source_word: ἐκδιηγήσεται σύνεσιν
  english_pob_choice: will recount understanding
  chosen_korean: 지혜를 이야기합니다
  alternatives_korean:
  - 이해를 말합니다
  - 분별을 들려줍니다
  - 이해를 자세히 설명합니다
  lexicon: BDAG
  rationale: ‘recount’의 서술 행위와 ‘σύνεσις’의 지혜/분별 의미를 합쳐, 한국어 잠언체에서 자연스럽게 읽히는 ‘지혜를 이야기합니다’로 처리했습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행본문의 불일치
  chosen_reading: 그리스어 병행본문을 이 절의 실제 번역 기준으로 삼고, 히브리어는 현전 본문이 구절과 실질적으로 맞지 않는다는 점을 전제로 보조 자료로만 취급했습니다.
  alternative_readings:
  - 히브리어를 따라 ‘모든 행위에서 밝은 얼굴을 보이고, 기쁨으로 거룩한 것을 십일조로 드리십시오’로 옮기기
  rationale: 제공된 히브리어는 시락 34:9의 문맥과 의미가 크게 어긋나므로, 본절은 영어 POB의 감사기록처럼 그리스어 증거를 따라 번역하는 편이 출처 충실성과 문맥 일관성에 부합합니다.
  doctrine_reference: 'PHILOSOPHY.md: 현전하는 더 원초적인 증거를 우선하되, 본문 불일치는 정직하게 보존한다.'
