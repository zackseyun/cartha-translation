  lexicon: BDAG
  rationale: 복합어가 강조하는 ‘많은 경험’을 한국어에서 가장 직접적으로 드러내는 표현으로 옮겼습니다.
- source_word: ἐκδιηγήσεται σύνεσιν
  english_pob_choice: will recount understanding
  chosen_korean: 지혜를 이야기합니다
  alternatives_korean:
  - 이해를 말합니다
  - 분별을 들려줍니다
  - 이해를 자세히 설명합니다
  lexicon: BDAG
  rationale: ‘recount’의 서술 행위와 ‘σύνεσις’의 지혜/분별 의미를 합쳐, 한국어 잠언체에서 자연스럽게 읽히는 ‘지혜를 이야기합니다’로 처리했습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행본문의 불일치
  chosen_reading: 그리스어 병행본문을 이 절의 실제 번역 기준으로 삼고, 히브리어는 현전 본문이 구절과 실질적으로 맞지 않는다는 점을 전제로 보조 자료로만 취급했습니다.
  alternative_readings:
  - 히브리어를 따라 ‘모든 행위에서 밝은 얼굴을 보이고, 기쁨으로 거룩한 것을 십일조로 드리십시오’로 옮기기
  rationale: 제공된 히브리어는 시락 34:9의 문맥과 의미가 크게 어긋나므로, 본절은 영어 POB의 감사기록처럼 그리스어 증거를 따라 번역하는 편이 출처 충실성과 문맥 일관성에 부합합니다.
  doctrine_reference: 'PHILOSOPHY.md: 현전하는 더 원초적인 증거를 우선하되, 본문 불일치는 정직하게 보존한다.'
