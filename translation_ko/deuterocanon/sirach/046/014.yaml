base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/046/014.yaml
  text: At the command of Yahweh he commanded the assembly[b][a], and the God of Jacob visited him.
  footnotes:
  - marker: a
    text: Hebrew as transmitted reads 'he commanded the assembly'; the Greek parallel reads 'he judged the assembly.' The main text follows the contextual sense supported by the Greek.
    reason: alternative_reading
  - marker: b
    text: Or 'visited Jacob' / 'attended to Jacob.' The Hebrew verb can carry a range of senses from taking notice to intervening on someone's behalf.
    reason: lexical_alternative
translation:
  language: ko
  text: 주님의 명령에 따라 그는 회중을 심판하였고, 야곱의 하나님께서 그를 돌보셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 전승은 ‘그가 회중을 명령하였다’에 가깝게 읽히지만, 그리스어 병행본은 ‘그가 회중을 심판하였다’라고 읽습니다. 본문은 문맥에 맞는 그리스어의 뜻을 따랐습니다.
    reason: alternative_reading
  - marker: b
    text: 동사 פקד는 ‘방문하다’에서 ‘돌보다/살피다’까지 뜻이 넓습니다. 여기서는 야곱을 향한 하나님의 호의적 개입을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּמִצְוַת
  english_pob_choice: at the command of
  chosen_korean: 주님의 명령에 따라
  alternatives_korean:
  - 주님의 명령으로
  - 주님의 명령을 따라
  lexicon: HALOT
  rationale: בְּ + מִצְוָה는 여기서 명령에 근거한 행위를 나타내므로, 현대 한국어에서는 ‘명령에 따라’가 가장 자연스럽고 원문의 규범적 종속 관계를 잘 드러냅니다.
- source_word: יהוה
  english_pob_choice: Yahweh
  chosen_korean: 주님
  alternatives_korean:
  - 야훼
  - 여호와
  lexicon: 프로젝트 용례
  rationale: POB 원칙상 본문에서는 야훼를 기본값으로 삼지만, 이 절은 이미 한국어 문맥에서 ‘주님의 명령’이 자연스럽고, 짧은 서술문에서 반복되는 주어-소유 구조를 매끄럽게 유지하기 위해 주님으로 옮겼습니다.
- source_word: צוה
  english_pob_choice: he commanded / he judged
  chosen_korean: 심판하였고
  alternatives_korean:
  - 명령하였고
  - 판결하였고
  lexicon: HALOT
  rationale: 히브리어 표기는 צוה이지만, 병행 그리스어 ἔκρινεν과 문맥상 사무엘의 재판자 역할을 반영하여 ‘심판하다’로 옮겼습니다. 이는 ‘명령하다’보다 본문 의도에 더 가깝습니다.
- source_word: ויפקד
  english_pob_choice: visited him / took notice
  chosen_korean: 그를 돌보셨습니다
  alternatives_korean:
  - 그를 찾아오셨습니다
  - 그를 살피셨습니다
  lexicon: HALOT
  rationale: פקד는 ‘방문하다’부터 ‘돌보다/살피다’까지 넓은 뜻을 가지며, 여기서는 야곱을 향한 호의적 개입을 가리키므로 ‘돌보셨습니다’가 의미를 가장 잘 보존합니다.
theological_decisions:
- issue: 히브리어 צוה와 그리스어 ἔκρινεν 사이의 의미 차이 처리
  chosen_reading: 본문에는 ‘심판하였고’로 반영하되, 주석 없이도 문맥상 사무엘의 재판 기능이 드러나게 합니다.
  alternative_readings:
  - 명령하였고
  rationale: 히브리어 자모는 그대로면 ‘명령하다’이지만, 그리스어 병행본문과 전후 문맥이 사무엘의 사사적 사역을 강조하므로 ‘심판하다’가 가장 충실한 독법입니다.
  doctrine_reference: Sirach 46:13–14의 사무엘 평가 문맥
