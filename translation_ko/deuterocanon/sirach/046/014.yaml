  source_fidelity: 첫 절의 צוה는 전승 히브리어대로라면 ‘명령하였다’이지만, 그리스어 병행본의 ‘심판하였다’와 사무엘의 재판자 문맥을 따라 본문에서 ‘재판하였습니다’로 옮기는 것은 가능하며, 대안 독법을 주석으로 밝혀야 합니다. 후반절의 히브리어는 פקד의 목적어를 명시하지 않지만 그리스어는 ‘야곱을’이라고 명시합니다. 현 번역의 ‘그를’은 앞선 사무엘을 가리키는 것으로 읽혀 병행본문 및 ‘야곱의 하나님’이라는 표현과 맞지 않습니다.
  naturalness: ‘회중을 재판하였습니다’는 현대 표준 한국어의 공식적 성경 문체에 자연스럽습니다. ‘야곱의 하나님께서는 야곱을 돌보셨습니다’는 반복이 있으나, 그리스어의 명시된 목적어를 충실히 반영하며 지시 대상 혼동을 피합니다.
  terminology: YHWH는 프로젝트의 한국어 기본 용례에 맞춰 ‘야훼’로 통일하는 것이 적절합니다. ‘심판하다’는 유죄 선고의 뉘앙스를 낼 수 있으므로 ἔκρινεν의 사법적 역할에는 ‘재판하다’가 더 정확합니다. פקד는 ‘돌보다’로 번역하되 ‘방문하다/살피다’의 폭을 주석에 남깁니다.
