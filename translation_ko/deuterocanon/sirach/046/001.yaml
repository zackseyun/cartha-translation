base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/046/001.yaml
  text: Joshua son of Nun was a mighty warrior[a], Moses’ attendant in prophecy[b]; he was appointed in his days to be a great salvation for his chosen ones.
  footnotes:
  - marker: a
    text: 'Greek: ''successor to Moses in prophecies,'' making Joshua’s relation to Moses more explicitly one of succession than the surviving Hebrew wording does.'
    reason: alternative_reading
  - marker: b
    text: '''A great salvation'' can also be rendered ''great deliverance'' or ''great victory''; the Hebrew תשועה and Greek σωτηρία can carry both military and broader saving senses.'
    reason: lexical_alternative
translation:
  language: ko
  text: 눈부신 용사요, 눈의 아들 여호수아는 모세의 예언에 따른 시종이었습니다[a]. 그는 자기 시대에 일어나, 자기 택하신 이들을 위한 큰 구원이 되도록 마련되었습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 ‘모세의 예언들 가운데 후계자’로 더 분명하게 읽힙니다. 살아남은 히브리어는 이보다 압축적입니다.
    reason: alternative_reading
  - marker: b
    text: ‘큰 구원’은 ‘큰 구출’ 또는 ‘큰 승리’로도 옮길 수 있습니다. 히브리어 תשועה와 그리스어 σωτηρία는 군사적·구원적 뜻을 함께 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: גבור בן חיל
  english_pob_choice: a mighty warrior
  chosen_korean: 눈부신 용사
  alternatives_korean:
  - 용맹한 전사
  - 큰 용사
  - 무력한?
  lexicon: HALOT
  rationale: 히브리어 관용구는 단순한 ‘힘센 사람’보다 전투적 용맹을 강조하므로, 현대 한국어에서 자연스러운 ‘용사’로 옮기되 전쟁 맥락을 살렸습니다.
- source_word: משרת משה
  english_pob_choice: Moses’ attendant
  chosen_korean: 모세의 시종
  alternatives_korean:
  - 모세의 종
  - 모세의 보좌자
  - 모세의 수행자
  lexicon: HALOT
  rationale: 공적 보조 역할을 나타내는 표현이므로, 교회 직분 느낌의 ‘사역자/목사’는 피하고 ‘시종’으로 간결하게 살렸습니다.
- source_word: בנבואה
  english_pob_choice: in prophecy
  chosen_korean: 예언에 따른
  alternatives_korean:
  - 예언 안에서
  - 예언의 일에서
  - 예언의 직분으로
  lexicon: HALOT
  rationale: 히브리어의 압축된 표현과 그리스어의 ‘모세의 후계자’ 뉘앙스를 함께 고려해, 본문을 과도하게 풀지 않으면서 관계를 드러내는 방향으로 번역했습니다.
- source_word: תשועה גדולה
  english_pob_choice: a great salvation
  chosen_korean: 큰 구원
  alternatives_korean:
  - 큰 구출
  - 큰 해방
  - 위대한 구원
  lexicon: HALOT
  rationale: 군사적 구출과 구원 의미가 모두 가능하므로, 한국어 성경에서 넓게 통용되는 ‘구원’을 택해 어휘 범위를 보존했습니다.
theological_decisions:
- issue: Joshua의 역할을 모세와의 관계로 어떻게 표현할지
  chosen_reading: ‘모세의 예언에 따른 시종’으로 두어, 그리스어의 후계자 뉘앙스는 참고하되 히브리어의 짧은 표현을 과도하게 확장하지 않았습니다.
  alternative_readings:
  - 모세의 예언에서 후계자
  - 모세를 이어 예언의 직분을 맡은 이
  - 모세의 예언적 종
  rationale: 히브리어 본문이 प्राथमिक이며, 본절은 후계 관계를 암시하지만 명시적으로 전개하지는 않으므로 한국어도 그 긴장을 유지했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
- issue: ‘구원’의 범위
  chosen_reading: ‘큰 구원’으로 번역해 군사적 구출과 더 넓은 구원의 뜻을 함께 남겼습니다.
  alternative_readings:
  - 큰 구출
  - 큰 승리
  - 큰 해방
  rationale: 여호수아의 역사적 맥락은 전투적이지만, תשועה와 σωτηρία는 더 넓은 구원 어휘이므로 의미를 좁히지 않았습니다.
  doctrine_reference: Translation philosophy §§1, 5
