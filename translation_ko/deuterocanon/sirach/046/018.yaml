base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/046/018.yaml
  text: And at the time of his resting on his bed[b][a], he testified before Yahweh and his anointed one.
  footnotes:
  - marker: a
    text: Hebrew 'his anointed one' uses the same root as 'Messiah'; the phrase may refer specifically to the LORD's anointed ruler in Samuel's day.
    reason: lexical_alternative
  - marker: b
    text: The Greek parallel for this verse differs sharply, reading instead that he 'crushed the leaders of Tyre and all the rulers of the Philistines,' indicating a substantial textual divergence between the Hebrew and Greek witnesses here.
    reason: textual_variant
translation:
  language: ko
  text: 그가 침상에서 쉴 때에, 야훼와 그분의 기름부음 받은 이를 증인으로 불러 세웠습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘기름부음 받은 이’(משיח)는 ‘메시아’라는 말과 같은 어근입니다. 이 절에서는 역사적 문맥상 특정한 기름부음 받은 통치자를 가리킬 가능성이 큽니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어 병행본문은 이 절을 크게 다르게 전하며, ‘두로의 지도자들과 블레셋의 모든 통치자들을 무너뜨렸다’고 읽습니다. 이는 히브리어와 그리스어 전승 사이에 상당한 본문 차이가 있음을 보여 줍니다.
    reason: textual_variant
lexical_decisions:
- source_word: נוחו על משכבו
  english_pob_choice: his resting on his bed
  chosen_korean: 자기 침상에서 쉬실 때에
  alternatives_korean:
  - 자기 침상에서 누우실 때에
  - 자기 침상에서 쉬는 동안에
  - 자기 잠자리에 드실 때에
  lexicon: HALOT
  rationale: נוח와 משכב의 결합은 단순한 수면보다 ‘쉬다/휴식하다’와 ‘침상’의 이미지를 함께 살리는 것이 자연스럽습니다. 시간 부사절로 옮겨 서술 흐름을 유지했습니다.
- source_word: העיד
  english_pob_choice: he testified before
  chosen_korean: 증언하셨습니다
  alternatives_korean:
  - 증언하였습니다
  - 증거로 삼으셨습니다
  - 불러 증인으로 세우셨습니다
  lexicon: HALOT
  rationale: העיד는 여기서 ‘증언하다/증거를 말하다’의 직접적 의미가 자연스럽습니다. 영어 POB의 ‘testified before’에 맞추되, 한국어에서는 ‘before’를 따로 드러내지 않아도 의미가 유지됩니다.
- source_word: יהוה
  english_pob_choice: the LORD
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: project default
  rationale: 프로젝트 기본값에 따라 Tetragrammaton은 ‘야훼’로 옮겼습니다. 본문이 히브리어 원전에서 직접 온 점을 드러내기 위한 선택입니다.
- source_word: ומשיחו
  english_pob_choice: his anointed one
  chosen_korean: 그의 기름부음 받은 이
  alternatives_korean:
  - 그의 메시아
  - 그의 기름부음 받은 자
  - 그의 왕
  lexicon: HALOT
  rationale: משיח은 문자적으로 ‘기름부음 받은 이’입니다. 이 절의 역사적 맥락을 고려하면 고유명사화된 ‘메시아’보다 직역이 더 안정적이며, 본문이 특정 인물을 암시하더라도 원문의 칭호를 보존하는 것이 적절합니다.
theological_decisions:
- issue: משיחו의 종말론적 의미를 한국어 본문에서 얼마나 강하게 드러낼지
  chosen_reading: ‘그의 기름부음 받은 이’로 옮겨, 역사적 칭호로서의 뜻을 먼저 살렸습니다.
  alternative_readings:
  - ‘그의 메시아’
  - ‘그의 왕’
  rationale: 이 절은 현재 문맥에서 특정 왕권 인물을 가리킬 수 있으나, 히브리어 자체는 메시아적 고유명사보다 칭호를 사용합니다. 따라서 본문은 칭호를 유지하고, 메시아적 연상은 독자가 문맥으로 판단하도록 남겨 두는 편이 원문에 더 충실합니다.
  doctrine_reference: 'DOCTRINE.md: Translate titles; preserve lexical tension when historical and later-messianic senses overlap.'
