base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/046/017.yaml
  text: In a mighty crash his voice was heard[a], and the leaders of the foe were subdued[c][b], and all the rulers of the Philistines perished.
  footnotes:
  - marker: a
    text: Hebrew 'in a mighty crash'; the Greek parallel more explicitly reads that the Lord thundered from heaven and made his voice heard with a great sound.
    reason: alternative_reading
  - marker: b
    text: Or 'the garrisons of the enemy,' if נציבי is taken in an impersonal or military-post sense rather than as leaders.
    reason: lexical_alternative
  - marker: c
    text: '''Rulers of the Philistines'' reflects the Philistine title known from 1 Samuel; alternatively, ''lords of the Philistines.'''
    reason: cross_reference
translation:
  language: ko
  text: 큰 굉음 속에 그의 음성이 들렸고[a], 적의 지휘관들이 굴복되었으며[b], 블레셋의 모든 통치자들이 멸망하였습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘큰 굉음’을, 그리스어 병행은 ‘주께서 하늘로부터 천둥 치셨다’는 뜻을 더 분명히 보입니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어 נציבי는 문맥에 따라 ‘지휘관들’ 또는 ‘주둔대들’로도 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘블레셋의 통치자들’은 사무엘서에 나오는 블레셋 지도자 칭호를 반영합니다.
    reason: cross_reference
lexical_decisions:
- source_word: בפרע אדיר
  english_pob_choice: in a mighty crash
  chosen_korean: 큰 굉음 속에
  alternatives_korean:
  - 우렁찬 소리 속에
  - 큰 천둥 소리 속에
  - 엄청난 굉성으로
  lexicon: HALOT
  rationale: 히브리어 표현은 다소 난해하지만, 문맥상 강하고 요란한 음향을 가리키므로 ‘큰 굉음’이 힘과 충격을 살리면서도 지나치게 해석을 좁히지 않습니다.
- source_word: נשמע קולו
  english_pob_choice: his voice was heard
  chosen_korean: 그의 음성이 들렸고
  alternatives_korean:
  - 그의 소리가 들렸고
  - 그의 음성이 들리게 되었고
  lexicon: HALOT
  rationale: 수동형의 핵심을 살려 ‘들렸고’로 옮기되, 시적 병렬을 위해 자연스러운 현대 한국어로 정리했습니다.
- source_word: נציבי צר
  english_pob_choice: the leaders of the foe
  chosen_korean: 적의 지휘관들이
  alternatives_korean:
  - 적의 주둔대들이
  - 적의 수령들이
  - 대적의 지휘관들이
  lexicon: HALOT
  rationale: נציב는 문맥에 따라 관직자나 주둔 병력을 가리킬 수 있으나, 뒤의 ‘블레셋의 모든 통치자들’과의 평행을 살려 인격적·군사적 의미인 ‘지휘관들’로 번역했습니다.
- source_word: סרני פלשתים
  english_pob_choice: all the rulers of the Philistines
  chosen_korean: 블레셋의 모든 통치자들
  alternatives_korean:
  - 블레셋의 모든 방백들
  - 블레셋의 모든 군주들
  - 블레셋의 모든 지배자들
  lexicon: HALOT
  rationale: סרנים은 사무엘서에 나타나는 블레셋 지도자 칭호이므로, 현대 독자가 이해하기 쉬운 ‘통치자들’로 옮기되 고유한 직함성은 유지했습니다.
theological_decisions:
- issue: 히브리어 ‘그의 음성’의 화자/귀속
  chosen_reading: 문맥상 하나님께서 내신 음성으로 읽었습니다.
  alternative_readings:
  - 사무엘의 기도 행위가 낳은 음성으로 덜 직접적으로 읽을 수 있습니다.
  - 히브리어만으로는 화자를 명시하지 않아 더 중립적으로 둘 수 있습니다.
  rationale: 시라 46장 전체 문맥과 병행 그리스어 전승이 하나님의 천둥 같은 음성을 가리키므로, 본문이 암시하는 신적 귀속을 살렸습니다.
  doctrine_reference: 병행 전승을 번역 판단의 보조 증거로 사용하되, 히브리어 본문의 모호성은 과도하게 제거하지 않습니다.
