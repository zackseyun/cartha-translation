  text: In the sight of every living thing—and even after his death he was sought out.[a]
  footnotes:
  - marker: a
    text: 'The Greek parallel expands this: ''after he fell asleep, he prophesied and showed the king his end, and lifted up his voice from the earth in prophecy, to blot out the lawlessness of the people.'' This likely explains the Hebrew ''he was sought out'' as referring to Samuel being consulted after death.'
    reason: alternative_reading
translation:
  language: ko
  text: 살아 있는 모든 이가 보는 앞에서, 심지어 그가 죽은 뒤에도 그는 찾아졌습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 헬라어 병행문은 이를 더 자세히 전합니다. “그가 잠든 뒤에 그는 예언하여 왕에게 그 왕 자신의 최후를 알렸으며, 예언 가운데 땅에서 그의 목소리를 높였습니다. 이는 백성의 불법을 없애기 위해서였습니다.” 이것은 히브리어의 “그는 찾아졌다”가 사무엘이 죽은 뒤에도 문의를 받았다는 뜻일 가능성을 설명해 줍니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ובעיני כל חי
  english_pob_choice: In the sight of every living thing
  chosen_korean: 모든 살아 있는 것 앞에서
  alternatives_korean:
  - 모든 살아 있는 자의 눈앞에서
  - 모든 생명체의 눈앞에서
  lexicon: HALOT
  rationale: 히브리어 관용구 בעיני는 문자적으로는 '눈에'이지만, 공개적으로 누구나 볼 수 있다는 뜻을 살려 '앞에서'로 옮겼습니다. כל חי의 포괄성을 유지하기 위해 '모든 살아 있는 것'을 택했습니다.
- source_word: וגם
  english_pob_choice: and even
  chosen_korean: 그리고
  alternatives_korean:
  - 그리고 심지어
  - 또한
  lexicon: HALOT
  rationale: 히브리어 וגם의 강조를 한국어에서 자연스럽게 드러내기 위해 문맥상 연결어로 처리하되, 뒤의 '죽음 이후에도'가 이미 강조를 충분히 담으므로 과잉 표현은 피했습니다.
- source_word: אחרי מותו
  english_pob_choice: after his death
  chosen_korean: 그의 죽음 이후에도
  alternatives_korean:
  - 그가 죽은 뒤에도
  - 죽은 후에도
  lexicon: HALOT
  rationale: 시간 부사를 현대 한국어로 자연스럽게 옮기되, 뒤의 '도'로 이어지는 지속성을 살렸습니다.
- source_word: נדרש
  english_pob_choice: was sought out
  chosen_korean: 찾아졌습니다
  alternatives_korean:
  - 찾아졌습니다
  - 찾아졌고 문의를 받았습니다
  - 찾아졌습니다(즉, 그에게 문의가 있었습니다)
  lexicon: HALOT
  rationale: דרש의 니팔은 '찾다/문의하다'의 수동 의미가 가능하므로, 본문은 간결하게 '찾아졌습니다'로 두어 히브리어의 압축성을 보존했습니다. 주석에서 그 의미가 '문의/상담' 쪽일 수 있음을 드러냅니다.
theological_decisions:
- issue: 사무엘의 사후 행위가 본문에 얼마나 직접적으로 드러나는가
  chosen_reading: 본문은 히브리어의 간결한 진술을 따라 '그의 죽음 이후에도 그는 찾아졌습니다'로 두고, 헬라어 병행문의 사후 예언과 왕에게 그의 끝을 보인 내용은 각주로 옮겼습니다.
  alternative_readings:
  - 헬라어를 따라 '죽은 뒤 예언하고 왕에게 그의 끝을 보였다'로 본문을 확장하기
  - 히브리어만 따라 사후 문의의 사실만 간단히 남기기
  rationale: 이 절은 살아남은 히브리어 본문이 짧고, 헬라어 병행문이 그 의미를 확장합니다. 본문에서는 히브리어의 절제를 보존하고, 각주에서 헬라어 전승이 제시하는 해석적 확장을 기록해 독자가 사무엘의 사후 '찾아짐'이 무엇을 가리키는지 알 수 있게 했습니다.
  doctrine_reference: Sirach source-primacy policy; Greek parallel retained as interpretive expansion rather than replacing the Hebrew main text.
