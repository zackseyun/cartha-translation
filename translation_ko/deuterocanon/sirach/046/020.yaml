  naturalness: '''살아 있는 모든 이가 보는 앞에서''와 ''심지어 ... 뒤에도''는 현대 표준어 합쇼체에서 자연스럽고, 원문의 공개성 및 강조를 유지합니다. ''찾아졌습니다''는 의도적으로 남겨 히브리어 נדרש의 ''찾음/문의'' 사이의 여지를 보존합니다.'
  terminology: '''불법''은 ἀνομία의 성서적·법적 의미에 적절합니다. 각주에서는 ''잠든 뒤''라는 헬라어의 완곡 표현을 유지하고, ''왕 자신의 최후''로 대명사의 실제 지시 대상을 한국어에서 명료하게 했습니다. ''문의받았다''는 본문 번역이 아니라 각주의 해설에만 사용했습니다.'
