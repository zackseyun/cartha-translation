  text: so that all the offspring of Jacob may know that it is good to fully follow Yahweh[a][b].
  footnotes:
  - marker: a
    text: 'Greek parallel: ''all the sons of Israel'' instead of ''all the offspring of Jacob.'''
    reason: alternative_reading
  - marker: b
    text: The Hebrew wording behind 'follow after' is somewhat unusual; the Greek parallel supports the sense 'to go/walk after the Lord.'
    reason: textual_variant
translation:
  language: ko
  text: 그리하여 야곱의 모든 자손이 야훼를 온전히 따르는 것이 좋다는 것을 알게 하려는 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 병행본문은 '이스라엘의 모든 아들들'로 되어 있습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어의 '뒤따르다/따르다' 관용구는 다소 특이하지만, 그리스어 병행본문이 ‘주 뒤를 걷다’는 의미를 뒷받침합니다.
    reason: textual_variant
lexical_decisions:
- source_word: למען דעת
  english_pob_choice: so that ... may know
  chosen_korean: 알게 하려는 것입니다
  alternatives_korean:
  - 알도록 하려는 것입니다
  - 알게 하십니다
  lexicon: HALOT
  rationale: 목적을 나타내는 למען과 지식 동사를 결합해, 현대 한국어에서 자연스럽고 합쇼체에 맞는 목적 표현으로 옮겼습니다.
- source_word: כל זרע יעקב
  english_pob_choice: all the offspring of Jacob
  chosen_korean: 야곱의 모든 자손
  alternatives_korean:
  - 야곱의 모든 후손
  - 야곱의 모든 씨
  lexicon: HALOT
  rationale: זרע의 집합적 후손 의미를 살리되, 한국어에서 문맥상 자연한 '자손'을 택해 족장 야곱과의 언약적 계승을 유지했습니다.
- source_word: למלא אחרי
  english_pob_choice: to fully follow after
  chosen_korean: 온전히 따르는
  alternatives_korean:
  - 뒤따르는
  - 따라가는
  - 온전히 순종하는
  lexicon: HALOT
  rationale: 히브리어 관용구의 방향성 있는 추종 의미를 살리면서, 문맥상 과도한 해석인 '순종하다'보다는 '따르다'로 옮겼고, POB의 'fully'에 해당하는 의미는 '온전히'로 반영했습니다.
- source_word: יהוה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: project glossary
  rationale: 프로젝트 기본 용례에 따라 신명기를 야훼로 옮겨, 히브리어 본문을 직접 반영했습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행본문의 '야곱' 대 '이스라엘' 차이
  chosen_reading: 야곱의 모든 자손
  alternative_readings:
  - 이스라엘의 모든 아들들
  - 이스라엘의 모든 자손
  rationale: 주 본문이 보존한 히브리어가 '야곱'을 전하므로 이를 본문에 반영하고, 그리스어 병행본문의 차이는 각주로 처리했습니다. 이는 본문 전승 차이를 숨기지 않으면서도 가장 직접적인 증거를 따르는 선택입니다.
  doctrine_reference: 'Sirach 번역 원칙: 보존된 히브리어를 우선하되, 의미 있는 그리스어 병행 차이는 각주로 기록'
