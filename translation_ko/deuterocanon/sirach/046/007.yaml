base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/046/007.yaml
  text: Also[a], because he fully followed God, and in the days of Moses showed loyalty—he and Caleb son of Jephunneh—by standing firm against the assembly's rebellion, to keep the people from sin and to silence wicked grumbling.
  footnotes:
  - marker: a
    text: 'Hebrew: ''by standing firm in the assembly’s rebellion'' (wording compressed and somewhat uncertain); Greek more fully reads: ''to stand against the enemy, to keep the people from sin, and to stop wicked grumbling.'''
    reason: textual_variant
  - marker: b
    text: Or 'showed mercy.' The Hebrew and Greek terms can denote mercy, but here the context favors loyal, faithful action.
    reason: lexical_alternative
translation:
  language: ko
  text: 또한, 그는 하나님을 온전히 따랐고 모세 시대에 충성을 보였습니다. 그와 여분네의 아들 갈렙은 회중의 반역에 맞서 굳게 섰습니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 이 부분을 짧고 압축적으로 표현하며, 직역하면 ‘회중의 반역 가운데 굳게 서기 위해’ 정도입니다. 헬라어는 더 길게 ‘원수에게 맞서 서서, 백성이 죄를 짓지 못하게 하고 악한 원망을 그치게 하려고’라고 전합니다.
    reason: textual_variant
lexical_decisions:
- source_word: מלא אחרי אל
  english_pob_choice: fully followed God
  chosen_korean: 하나님을 온전히 따랐기 때문에
  alternatives_korean:
  - 하나님을 완전히 따랐기 때문에
  - 하나님께 전적으로 헌신했기 때문에
  lexicon: HALOT
  rationale: 히브리어 관용구의 핵심은 단순한 추종이 아니라 전인적·지속적 충성을 뜻하므로, ‘온전히 따랐다’로 자연스럽게 옮겼습니다.
- source_word: עשה חסד
  english_pob_choice: showed loyalty
  chosen_korean: 충성을 보였으며
  alternatives_korean:
  - 인자를 베풀었으며
  - 자비를 보였으며
  - 신실하게 행했으며
  lexicon: HALOT
  rationale: 문맥상 자비 행위보다 언약적 신실성과 충성을 드러내는 표현이므로, POB의 해석을 따라 ‘충성을 보였다’로 옮겼습니다.
- source_word: להתיצב
  english_pob_choice: by standing firm
  chosen_korean: 맞서 서서 섰습니다
  alternatives_korean:
  - 굳게 서서
  - 버티어 맞섰습니다
  - 단호히 대항했습니다
  lexicon: HALOT
  rationale: 대상에 대한 적극적 저항과 굳은 자세를 함께 살리기 위해 ‘맞서 서서’로 옮겼습니다.
- source_word: בפרע קהל
  english_pob_choice: against the assembly’s rebellion
  chosen_korean: 회중이 반역할 때
  alternatives_korean:
  - 회중의 반역에 맞서
  - 회중의 소요 가운데
  - 백성의 반역 앞에서
  lexicon: HALOT
  rationale: 히브리어가 압축적이어서 POB와 본문 전통의 의미를 반영하되, 한국어로는 ‘반역할 때’가 가장 직접적으로 상황을 드러냅니다.
theological_decisions:
- issue: 히브리어 본문과 헬라어 평행문의 긴장 처리
  chosen_reading: 주본문은 주어진 히브리어를 따라 간결하게 옮기되, 헬라어에만 분명한 목적절은 본문에 끼워 넣지 않았습니다.
  alternative_readings:
  - 헬라어를 따라 ‘백성이 죄를 짓지 못하게 하고 악한 원망을 멈추게 하려고’까지 확장하는 번역
  - 히브리어의 압축된 표현만 따라 더 짧게 옮기는 번역
  rationale: 제시된 히브리어는 그 절의 핵심 진술을 담고 있으나 헬라어는 더 긴 설명을 덧붙입니다. 본문에는 불확실한 확장을 넣지 않고, 의미의 중심만 드러내도록 유지했습니다.
  doctrine_reference: 'PHILOSOPHY.md의 Sirach 원칙: 히브리어를 우선하되, 확증적 헬라어는 주해적 참고로 둡니다.'
