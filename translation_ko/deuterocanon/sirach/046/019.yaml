base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/046/019.yaml
  text: 'Even up to the time of his end[1], he was found faithful in the eyes of Yahweh: “I have taken a ransom and hidden it—from whom have I taken anything? And no man answered against him.”'
  footnotes:
  - marker: '1'
    text: Hebrew is somewhat terse here. The Greek witness reads more explicitly, 'Money, even as far as sandals, I have not taken from any flesh, and no man brought a charge against him.' The Hebrew כפר may also be understood in context as 'bribe' rather than 'ransom,' and 'no man answered against him' may mean 'no one accused him.'
    reason: alternative_reading
translation:
  language: ko
  text: 그의 끝날 때까지도 그는 야훼의 눈앞에서 신실한 사람으로 드러났습니다. “나는 뇌물을 받고 그것을 숨겼습니다—내가 누구의 손에서 무엇을 받았습니까? 아무도 그를 거슬러 고발하지 않았습니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 כפר는 문맥상 ‘뇌물’로도 이해될 수 있으며, 그리스어 증인은 이를 더 넓게 ‘돈’의 부정으로 풀어 말합니다.
    reason: theological_note
  - marker: b
    text: ‘그를 거슬러 고발하지 않았다’는 히브리어의 직설적 표현을 문맥상 법정적 의미로 옮긴 것입니다. 그리스어는 ‘아무도 그에게 죄를 묻지 않았다’는 뜻을 더 분명히 드러냅니다.
    reason: cross_reference
lexical_decisions:
- source_word: וגם עד עת קצו / נכון נמצא
  english_pob_choice: Even up to the time of his end / he was found faithful
  chosen_korean: 그의 끝날 때까지도 그는 ... 신실한 사람으로 드러났습니다
  alternatives_korean:
  - 그의 끝까지도 그는 ... 충실한 사람으로 드러났습니다
  - 그가 생을 마칠 때까지도 그는 ... 믿을 만한 사람으로 밝혀졌습니다
  lexicon: HALOT
  rationale: ‘נכון נמצא’는 단순한 상태보다 인격적·도덕적 신실성을 강조하므로, 한국어에서는 ‘신실한 사람으로 드러났습니다’가 문맥의 칭찬 의미를 가장 자연스럽게 살립니다.
- source_word: בעיני יהוה
  english_pob_choice: in the eyes of Yahweh
  chosen_korean: 야훼의 눈앞에서
  alternatives_korean:
  - 야훼의 눈에
  - 야훼 앞에서
  lexicon: HALOT
  rationale: 히브리어 관용구를 직역해 관찰·평가의 뉘앙스를 살렸습니다. 프로젝트 기본값에 따라 יהוה는 ‘야훼’로 옮겼습니다.
- source_word: כפר
  english_pob_choice: I have taken a ransom
  chosen_korean: 나는 뇌물을 받고
  alternatives_korean:
  - 나는 속전(贖錢)을 받고
  - 나는 배상금을 받고
  lexicon: HALOT
  rationale: 본문 맥락이 사법적 청렴성에 대한 부인이고, 영어 POB 주석도 이 어근이 여기서는 ‘bribe’로도 이해될 수 있음을 밝히므로 한국어 본문은 오해를 줄이는 ‘뇌물’을 택했습니다.
- source_word: ונעלם
  english_pob_choice: and hidden it
  chosen_korean: 그것을 숨겼습니다
  alternatives_korean:
  - 그것을 감추었습니다
  - 그 사실을 은폐했습니다
  lexicon: HALOT
  rationale: 앞의 금전 수수와 연결되는 동작을 간결하게 살렸습니다. ‘은폐했습니다’는 다소 해설적이라 본문에는 덜 직접적입니다.
- source_word: וכל אדם לא ענה בו
  english_pob_choice: And no man answered against him
  chosen_korean: 아무도 그를 거슬러 고발하지 않았습니다
  alternatives_korean:
  - 아무도 그에게 대답하지 않았습니다
  - 아무도 그를 반박하지 않았습니다
  lexicon: HALOT
  rationale: 히브리어는 문자적으로는 ‘그에 대해 대답하다’이지만, 그리스어 병행본의 법정적 의미를 따라 ‘고발하지 않았다’로 풀어 문맥의 법적 무결성을 드러냈습니다.
theological_decisions:
- issue: 야훼의 평가와 인물의 청렴성
  chosen_reading: 본문은 사무엘의 죽음 직전까지 이어진 신실함을 야훼 앞의 평가로 제시하며, 뒤따르는 인용문은 그 신실함의 근거를 설명하는 증언으로 읽었습니다.
  alternative_readings:
  - 인용문을 별도의 법적 변론으로만 읽기
  - 그리스어 전승을 따라 금전 일반에 대한 부정으로만 정리하기
  rationale: 본문의 핵심은 인물의 도덕적 신실성을 칭찬하는 데 있으므로, 전승 차이를 완전히 평준화하기보다 본문의 칭찬과 자기변호를 함께 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Preserve theological tension rather than resolve it'
