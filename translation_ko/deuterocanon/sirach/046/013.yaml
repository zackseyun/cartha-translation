base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/046/013.yaml
  text: Beloved by his people and pleasing to his Maker[a], asked for from his mother's womb, Samuel, a Nazirite of the Lord in prophecy, judged and served as priest; by the word of God he established the kingdom, and anointed rulers over his people.
  footnotes:
  - marker: a
    text: 'Greek: ''Samuel, beloved by his Lord, a prophet of the Lord, established a kingdom, and anointed rulers over his people.'' The Hebrew witness instead reads ''a Nazirite of the Lord in prophecy'' and adds that he ''judged and served as priest.'''
    reason: alternative_reading
translation:
  language: ko
  text: 그의 백성을 사랑하고 그의 창조주께 기쁨을 얻으며, 어머니의 태에서부터 간구로 얻어진 사무엘은 예언의 일에서 야훼의 나실인이었고, 재판을 하며 제사장으로 섬겼습니다. 그는 하나님의 말씀으로 왕국을 세우고 그 백성 위에 통치자들에게 기름을 부었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 전승은 “야훼께 사랑받은 사무엘, 야훼의 예언자는 왕국을 세우고 그의 백성 위에 통치자들에게 기름을 부었다”로 읽습니다. 히브리어 본문은 사무엘이 “그의 백성을 사랑하고,” “어머니의 태에서부터 간구로 얻어졌으며,” “예언의 일에서 야훼의 나실인”으로서 “재판을 하고 제사장으로 섬겼다”는 내용을 덧붙입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אוהב עמו ורצוי עושהו
  english_pob_choice: Beloved by his people and pleasing to his Maker
  chosen_korean: 그의 백성에게 사랑받고 그의 창조주를 기쁘시게 하며
  alternatives_korean:
  - 그의 백성에게 사랑받으며 그의 지으신 이를 기쁘시게 하며
  - 그의 백성에게 사랑을 받고 그의 만드신 분을 기쁘시게 하며
  lexicon: BDB / HALOT
  rationale: 첫 두 분사는 수동적·상태적 의미를 함께 가지므로, 관계를 자연스럽게 살려 ‘사랑받고… 기쁘시게 하며’로 옮겼습니다. עושהו는 창조주/만드신 이를 가리키므로 ‘창조주’를 택했습니다.
- source_word: נזיר יהוה בנבואה
  english_pob_choice: a Nazirite of the Lord in prophecy
  chosen_korean: 예언 중에 야훼의 나실인이었고
  alternatives_korean:
  - 예언으로 야훼의 나실인이었고
  - 야훼의 나실인으로서 예언했으며
  lexicon: HALOT
  rationale: נזיר은 일반적 ‘헌신자’보다 제의적 표지인 ‘나실인’이 더 직접적이어서 이를 유지했습니다. בנבואה는 ‘예언 중에’로 옮겨, 사무엘의 예언자적 정체성을 문장 안에서 압축적으로 살렸습니다.
- source_word: שופט ומכהן
  english_pob_choice: judged and served as priest
  chosen_korean: 판결하며 제사장으로 섬겼습니다
  alternatives_korean:
  - 재판하며 제사장으로 봉사했습니다
  - 사사로 다스리며 제사장으로 섬겼습니다
  lexicon: HALOT
  rationale: שופט는 문맥상 사사/재판 역할이지만 현대 한국어에서는 ‘판결하다’가 역할을 덜 자연스럽게 해칠 수 있어 기능을 보여 주는 ‘판결하며’로 처리했습니다. מכהן은 단순 직함보다 행위를 나타내므로 ‘제사장으로 섬겼습니다’가 적절합니다.
- source_word: בדבר אל הכין ממלכת
  english_pob_choice: by the word of God he established the kingdom
  chosen_korean: 하나님의 말씀으로 왕국을 세우고
  alternatives_korean:
  - 하나님의 말씀으로 나라를 세우고
  - 하나님의 말씀으로 왕권을 굳히고
  lexicon: HALOT
  rationale: בדבר אל은 수단/권위의 근거를 나타내므로 ‘하나님의 말씀으로’가 가장 직접적입니다. הכין ממלכת는 ‘세우다/확립하다’의 뜻을 살려 ‘왕국을 세우고’로 옮겼습니다.
- source_word: וימשח נגידים על עם
  english_pob_choice: and anointed rulers over his people
  chosen_korean: 그의 백성 위에 통치자들을 기름부었습니다
  alternatives_korean:
  - 그의 백성 위에 지도자들을 기름부었습니다
  - 그의 백성 위에 방백들을 세우고 기름부었습니다
  lexicon: HALOT
  rationale: נגידים는 왕국 행정의 지도층을 가리키므로 ‘통치자들’이 문맥에 가장 잘 맞습니다. ‘기름부었습니다’는 기름부음 행위와 선출/임명의 상징성을 함께 유지합니다.
theological_decisions:
