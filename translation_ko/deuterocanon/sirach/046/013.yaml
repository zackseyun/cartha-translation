    issue: 첫 구절의 능동/수동 관계가 뒤바뀜
    rationale: 히브리어 אוהב עמו는 ‘그의 백성을 사랑하는’이라는 능동 분사인데, 초안의 ‘그의 백성에게 사랑받고’는 그리스어 병행 본문의 독법에 가까우며 히브리어 우선 원칙에 맞지 않습니다.
  - severity: medium
