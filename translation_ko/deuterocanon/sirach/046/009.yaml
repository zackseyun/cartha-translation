  yaml_path: translation/deuterocanon/sirach/046/009.yaml
  text: And he gave Caleb strength, and it remained with him until old age, so that he went up into the highlands of the land, and his offspring took possession of an inheritance.
translation:
  language: ko
  text: 그리고 주님께서 갈렙에게 힘을 주셨으며, 그는 노년이 올 때까지 그와 함께 머물렀습니다. 그래서 그는 땅의 높은 곳으로 올라갔고, 그의 자손은 유산을 차지했습니다.[a]
  philosophy: formal
  footnotes:
  - marker: a
    text: 히브리어 본문은 갈렙이 '노년이 올 때까지' 힘을 지녔다고 말하며, 그리스어 병행본은 '주님께서 갈렙에게 힘을 주셨다'고 더 분명히 진술합니다.
    reason: textual_variant
lexical_decisions:
