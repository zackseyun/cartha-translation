base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/046/008.yaml
  text: Therefore those two also were spared[a], out of six hundred thousand foot soldiers, to bring them into an inheritance[b], into a land flowing with milk and honey.
  footnotes:
  - marker: a
    text: Hebrew 'among the years' is difficult; it may mean that the two were preserved through the years or into old age. The Greek parallel instead reads more simply, 'being two, they were saved.'
    reason: textual_variant
  - marker: b
    text: 'The Greek parallel continues: ''to bring them into an inheritance, into a land flowing with milk and honey.'' This likely preserves the fuller sense of the verse where the Hebrew witness is shorter.'
    reason: alternative_reading
translation:
  language: ko
  text: 그러므로 그 두 사람도, 육십만 보병 가운데서, 그들을 유산으로 데려가시려고, 곧 젖과 꿀이 흐르는 땅으로 데려가시려고, 구원받았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 קשה한 표현은 직역하면 ‘연중/해들 가운데서’처럼 어색합니다. 본문은 보존받았다는 뜻을 살리되, 그리스어 병행본문의 더 분명한 표현을 함께 반영했습니다.
    reason: textual_variant
  - marker: b
    text: 그리스어 병행본문은 ‘그들을 유산으로 데려가다, 젖과 꿀이 흐르는 땅으로’라고 이어집니다. 히브리어 전승이 짧게 남아 있는 부분을 보완하는 독법입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: לכן
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 그래서
  - 그리하여
  lexicon: HALOT
  rationale: 앞 구절의 분노를 돌이키고 악한 비방을 그치게 한 결과를 받는 논리 연결을 한국어로 자연스럽게 나타냅니다.
- source_word: גם הם
  english_pob_choice: those two also
  chosen_korean: 그 두 사람도
  alternatives_korean:
  - 그들도
  - 두 사람도
  lexicon: HALOT
  rationale: 문맥상 이전에 언급된 둘을 가리키므로, 두 사람임을 분명히 드러내는 표현이 가장 자연스럽습니다.
- source_word: נאצלו
  english_pob_choice: were delivered
  chosen_korean: 구원받았습니다
  alternatives_korean:
  - 구출되었습니다
  - 보호받았습니다
  - 살려 두어졌습니다
  lexicon: HALOT
  rationale: 단순한 생존을 넘어 재앙에서 건져짐을 나타내며, 한국어에서 본문 흐름에 가장 알맞습니다.
- source_word: משש מאות אלף רגלי
  english_pob_choice: out of six hundred thousand foot soldiers
  chosen_korean: 육십만 보병 가운데서
  alternatives_korean:
  - 육십만 보병 중에서
  - 육십만의 보병들 가운데
  lexicon: HALOT
  rationale: רגלי의 군사적 의미를 살려 ‘보병’으로 옮겼고, ‘가운데서’로 집단 속 구별됨을 표현했습니다.
- source_word: εἰσαγαγεῖν αὐτοὺς εἰς κληρονομίαν
  english_pob_choice: to bring them into an inheritance
  chosen_korean: 그들을 유산으로 데려가시려고
  alternatives_korean:
  - 그들을 상속으로 인도하시려고
  - 그들을 상속받을 몫으로 데려가시려고
  lexicon: BDAG
  rationale: 유업/상속의 뜻을 살리되, 약속의 땅으로 ‘데려가다’는 동작을 유지해 문맥상 목적을 드러냅니다.
- source_word: εἰς γῆν ῥέουσαν γάλα καὶ μέλι
  english_pob_choice: into a land flowing with milk and honey
  chosen_korean: 곧 젖과 꿀이 흐르는 땅으로
  alternatives_korean:
  - 젖과 꿀이 흐르는 땅으로
  - 젖과 꿀이 흐르는 나라로
  lexicon: BDAG
  rationale: 약속의 땅을 가리키는 익숙한 관용을 그대로 살려, 앞의 ‘유산’과 병행되도록 했습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행본문의 관계
  chosen_reading: 주 본문은 히브리어의 축약된 문장을 따르되, 그리스어가 보존한 ‘유산으로 데려가다, 젖과 꿀이 흐르는 땅’의 완결된 뜻을 함께 반영했습니다.
  alternative_readings:
  - 히브리어의 짧은 형식만 따라 ‘그 두 사람도 구원받았습니다…’로 끝맺기
  - 그리스어를 따라 본문을 더 길게 확장하기
  rationale: 이 절은 히브리어가 짧고 난해하지만, 그리스어가 문맥상 자연스러운 완결을 제공하므로 둘의 증언을 함께 살리는 편이 본문 의도를 더 잘 전달합니다.
  doctrine_reference: 'Sirach project principle: Hebrew primary with Greek parallel used where it preserves fuller sense'
