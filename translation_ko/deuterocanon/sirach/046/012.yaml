base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/046/012.yaml
  text: May their bones blossom like a lily[c][b][a], and may their name be renewed in their sons.
  footnotes:
  - marker: a
    text: 'Hebrew: ''like a lily''; some have rendered the flower more generally or as ''rose,'' but ''lily'' is the more likely sense of שושנה.'
    reason: lexical_alternative
  - marker: b
    text: The Greek parallel explicitly reads 'from their place' after 'their bones blossom'; this likely clarifies the Hebrew image of their memory flourishing from where they rest.
    reason: alternative_reading
  - marker: c
    text: Or 'their name be passed on through their sons.' The Hebrew verb can suggest renewal or succession, and the Greek likewise points to a name continuing in honored descendants.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들의 뼈가 백합처럼[a] 피어나고, 그들의 이름이 그들의 아들들 가운데서 새로워지기를[c] 바랍니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 שושנה는 가장 자연스럽게 ‘백합’으로 옮길 수 있습니다. 일부 번역은 이를 더 일반적인 ‘꽃’ 또는 ‘장미’로 옮깁니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어 병행본문에는 ‘그들의 자리에서’라는 말이 덧붙어 있습니다. 이 말은 제공된 히브리어 본문에는 없으며, 뼈가 피어나는 이미지를 보충하는 읽기일 수 있습니다.
    reason: alternative_reading
  - marker: c
    text: 또는 ‘그들의 이름이 그들의 아들들을 통해 이어지기를.’ 히브리어 동사는 갱신 또는 계승을 나타낼 수 있으며, 그리스어 병행본문도 존귀한 후손 가운데 이름이 계속됨을 시사합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תפרחנה עצמותם
  english_pob_choice: May their bones blossom
  chosen_korean: 그들의 뼈가 백합처럼 피어나고
  alternatives_korean:
  - 그들의 뼈가 꽃처럼 피어나고
  - 그들의 뼈가 번성하고
  lexicon: HALOT
  rationale: פרח의 생생한 식물 이미지를 살려 ‘피어나다’로 옮기고, עצמותם은 완곡화하지 않고 ‘뼈’로 유지했습니다.
- source_word: כשושנה
  english_pob_choice: like a lily
  chosen_korean: 백합처럼
  alternatives_korean:
  - 백장미처럼
  - 꽃처럼
  lexicon: HALOT
  rationale: שושנה는 여기서 가장 개연성 높은 꽃 이름인 ‘백합’으로 옮겨, 본문의 꽃 이미지와 POB의 기본 선택을 반영했습니다.
- source_word: ושמם תחליף
  english_pob_choice: and may their name be renewed
  chosen_korean: 그들의 이름이 ... 새로워지기를 바랍니다
  alternatives_korean:
  - 그들의 이름이 이어지기를 바랍니다
  - 그들의 이름이 바뀌기를 바랍니다
  lexicon: HALOT
  rationale: חלף는 갱신, 계승, 교체의 의미 범위를 가지므로, 이 기념/후손 문맥에서는 ‘새로워지다’가 이름의 지속과 갱신을 함께 담습니다.
- source_word: לבניהם
  english_pob_choice: in their sons
  chosen_korean: 그들의 아들들 안에서
  alternatives_korean:
  - 그들의 자녀들 가운데
  - 그들의 후손 안에서
  lexicon: HALOT
  rationale: 히브리어가 분명히 남성 복수형이므로, 성별을 중화하지 않고 ‘아들들’로 옮겼습니다.
theological_decisions:
- issue: 죽은 이들의 뼈가 피어나는 비유의 범위
  chosen_reading: 시적·기념적 이미지로서의 뼈가 백합처럼 피어남
  alternative_readings:
  - 몸의 부활을 직접 진술하는 표현
  - 단순한 명예의 회복만을 뜻하는 표현
  rationale: 히브리어와 그리스어 병행은 후손과 기억 속에서 이어지는 명예의 이미지를 강하게 주지만, 여기서 부활 교리를 직접 단정하지 않도록 시적 비유를 유지했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 3
- issue: 남성형 후손 표현
  chosen_reading: 그들의 아들들
  alternative_readings:
  - 그들의 자녀들
  - 그들의 후손들
  rationale: בניהם의 형태를 따라 남성형을 보존했습니다. 이는 성별 정확성 원칙에 따른 것으로, 문맥상 가계의 계승을 가리킵니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
