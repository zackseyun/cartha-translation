translation:
  language: ko
  text: 그가 손을 뻗고 성읍을 향해 창을 휘두를 때, 그는 얼마나 영광스러웠습니까![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 병행본은 “그가 손을 들어 올리고 성읍들을 향해 칼을 휘두를 때, 그가 얼마나 영광스러웠는가”라고 읽습니다. 히브리어 증인은 “성읍을 향해 창을 휘두를 때”라고 읽습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: מה נהדר
  english_pob_choice: How glorious
  chosen_korean: 얼마나 영광스러웠는지요
  alternatives_korean:
  - 얼마나 찬란했는지요
  - 얼마나 장엄했는지요
  - 얼마나 빛났는지요
  lexicon: HALOT
  rationale: 히브리어 감탄문을 자연스러운 한국어 찬탄형으로 옮기되, 전투적 맥락의 칭송을 살리기 위해 ‘영광스럽다’를 택했습니다.
- source_word: בנטותו יד
  english_pob_choice: when he stretched out his hand
  chosen_korean: 손을 뻗을 때
  alternatives_korean:
  - 손을 들었을 때
  - 손을 펼칠 때
  - 팔을 뻗을 때
  lexicon: HALOT
  rationale: 행동의 시점/상황을 나타내는 분사구문을 한국어 시간절로 풀었고, 몸의 동작을 직역하기보다 자연스럽게 ‘손을 뻗다’로 살렸습니다.
- source_word: בהניפו כידון
  english_pob_choice: when he brandished a spear
  chosen_korean: 창을 휘두를 때
  alternatives_korean:
  - 창을 휘날릴 때
  - 투창을 휘두를 때
  - 창을 높이 들 때
  lexicon: HALOT
  rationale: הניף의 ‘휘두르다/휘날리다’라는 동작을 반영하고, כידון을 한국어 성경 문맥에서 이해하기 쉬운 ‘창’으로 옮겼습니다. ‘휘두르다’는 무기를 전투적으로 사용하는 장면을 잘 드러냅니다.
- source_word: על עיר
  english_pob_choice: against a city
  chosen_korean: 성읍을 향해
  alternatives_korean:
  - 성읍에 대하여
  - 성읍을 상대로
  - 성읍을 향하여
  lexicon: HALOT
  rationale: 전쟁 문맥의 על은 적대 방향을 띠므로, 공격 대상임을 드러내는 표현으로 ‘성읍을 향해’로 옮겼습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행본의 무기 명칭 차이
  chosen_reading: 본문은 히브리어의 ‘창’ 이미지를 따르고, 그리스어의 ‘칼’은 각주로만 반영합니다.
  alternative_readings:
  - 그리스어 병행본을 따라 ‘칼’로 번역할 수 있습니다.
  rationale: 이 시서는 살아 있는 히브리어 증거를 우선하되, 그리스어 병행본의 차이를 보존해 감사 가능성을 남기는 방식이 적합합니다.
  doctrine_reference: '번역 원칙: 히브리어 우선, 병행본은 대조·검증 자료로 사용'
