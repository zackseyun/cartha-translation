translation:
  language: ko
  text: 그도 그의 원수들이 사방에서 그를 에워쌌을 때 하나님께 부르짖었습니다[a]. 그가 젖 먹는 어린 양 한 마리를 바쳤을 때, 야훼께서는 하늘에서 천둥을 울리셨습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 전승은 ‘그의 원수들이 … 사방에서’라는 구절의 정확한 형태가 다소 난해합니다. 그러나 헬라어 병행본문은 그의 원수들이 사방에서 그를 압박하거나 에워싼 상황이라는 뜻을 뒷받침합니다.
    reason: textual_variant
  - marker: b
    text: 또는 ‘젖을 빠는 어린 양’.
    reason: lexical_alternative
lexical_decisions:
- source_word: קרא אל אל
  english_pob_choice: called upon God
  chosen_korean: 하나님께 부르짖었습니다
  alternatives_korean:
  - 하나님을 불렀습니다
  - 하나님께 부르짖어 구했습니다
  lexicon: HALOT
  rationale: 히브리어 관용구는 단순 발화보다 절박한 호소를 뜻하므로, ‘부르짖었습니다’가 POB의 ‘called upon’과 가장 자연스럽게 맞습니다.
- source_word: כאפכה לו אויביו מסביב
  english_pob_choice: when his enemies hemmed him in all around
  chosen_korean: 그의 원수들이 사방에서 그를 에워쌌을 때
  alternatives_korean:
  - 원수들이 그를 둘러쌌을 때
  - 원수들이 사방으로 그를 압박했을 때
  lexicon: HALOT
  rationale: 전승이 다소 कठिन하지만, 문맥과 헬라어 병행본문의 ‘사방에서 압박하다’는 뜻을 살려 ‘에워쌌을 때’로 옮겼습니다.
- source_word: טלה חלב
  english_pob_choice: a milk-fed lamb
  chosen_korean: 어린 양 한 마리
  alternatives_korean:
  - 젖 먹는 새끼 양 한 마리
  - 젖을 먹는 어린 양 한 마리
  lexicon: HALOT
  rationale: 직역하면 ‘젖 먹는 어린 양’이지만 한국어에서는 제사 맥락의 자연스러운 표현으로 ‘어린 양 한 마리’가 가장 읽기 쉽고, 각주로 원뜻의 세부를 보완할 수 있습니다.
- source_word: וירעם משמים יהוה
  english_pob_choice: the LORD thundered from heaven
  chosen_korean: 야훼께서는 하늘에서 우레를 치셨습니다
  alternatives_korean:
  - 주께서는 하늘에서 천둥을 치셨습니다
  - 야훼께서는 하늘에서 천둥을 울리셨습니다
  lexicon: HALOT
  rationale: רעם은 ‘우레치다/천둥치다’의 동사이므로, 하나님의 응답을 생생하게 드러내는 ‘우레를 치셨습니다’가 원문 효과를 잘 살립니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문에 직접 나타난 언약명 יהוה를 한국어 기본값인 ‘야훼’로 옮겨, 본문 차원의 고유명성과 신학적 긴장을 유지했습니다.
  doctrine_reference: POB glossary — יהוה / YHWH → 야훼
- issue: 사람의 제물 묘사와 번역의 명시성
  chosen_reading: ‘어린 양 한 마리’
  alternative_readings:
  - ‘젖 먹는 어린 양’
  - ‘젖을 먹는 어린 양’
  rationale: 제사 맥락은 유지하되 한국어 본문을 과도하게 기술적으로 만들지 않도록 하고, 원문의 세부는 각주로 보충했습니다.
  doctrine_reference: source semantics and readability
