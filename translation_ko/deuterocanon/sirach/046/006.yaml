review_pass:
  verdict: revise
  source_fidelity: 히브리어를 우선하면 השליך의 강한 ‘던지다’와 על의 방향을 살려야 합니다. 초안의 ‘재앙을 내리시고’는 목적어를 보충한 해석으로는 가능하지만, ‘내리다’가 동사의 구체적 이미지를 약화합니다. 또한 למען דעת는 ‘알게 하셨으니’라는 사역 진술보다 목적절 ‘알도록’으로 옮기는 것이 맞습니다. חרם은 ‘멸망당할 운명’보다 전쟁·봉헌 맥락의 전문성을 보존하는 ‘진멸’이 적절합니다.
  naturalness: ‘원수의 민족’은 소유 관계처럼 들릴 수 있으므로 ‘원수인 민족’으로 고쳤습니다. ‘원수인 민족 위에 파멸을 내던지시고’는 다소 강한 문체이지만 시적·전투 문맥에서 자연스럽고, 현대 표준어 합쇼체에도 맞습니다. ‘그들의 전투를 살피고 계시다’는 ‘그들의 전쟁을 지켜보고 계시다’보다 다소 부자연스러워 후자로 다듬었습니다.
  terminology: יהוה는 초안의 프로젝트 표기인 ‘야훼’를 유지했습니다. חרם은 본문에서 ‘그들의 진멸’로 번역하고, 각주에서 ‘바쳐진 멸망’이라는 의미 범위를 밝혔습니다. 그리스어 병행본문의 차이는 별도 각주로 분리하여 히브리어 본문과의 차이를 명확히 했습니다.
  issues:
  - severity: medium
    issue: ‘재앙을 내리시고’는 השליך의 ‘던지다’와 본문의 압축된 목적어를 해석적으로 확장합니다.
    rationale: ‘파멸을 내던지시고’는 문맥상 보충된 파멸의 의미를 유지하면서도 원문의 동작상을 더 직접적으로 반영합니다.
  - severity: high
    issue: ‘모든 민족이 … 알게 하셨으니’가 למען דעת의 목적절을 사역문으로 바꿉니다.
    rationale: 본문은 ‘모든 민족이 알도록’이라는 목적을 나타내며, 그가 실제로 알게 만들었다고 서술하지 않습니다.
  - severity: medium
    issue: חרם을 ‘멸망당할 운명’으로 풀면 봉헌·진멸의 전문적 의미가 흐려집니다.
    rationale: ‘그들의 진멸’은 간결하면서도 멸절에 바쳐진다는 전쟁 용어의 의미를 각주와 함께 보존합니다.
  - severity: low
    issue: 기존 b 각주는 히브리어 어휘 설명과 그리스어 이문을 한데 묶고 있습니다.
    rationale: 각주를 분리하면 본문 어휘의 의미와 병행본문의 실질적 차이를 각각 정확하게 확인할 수 있습니다.
  revised_text: 그는 원수인 민족 위에 파멸을 내던지시고[a], 그들이 달아날 때에 그들을 모두 멸하셨습니다. 모든 민족이 그들의 진멸을 알도록 하신 것이니, 야훼께서 그들의 전쟁을 지켜보고 계시기 때문입니다.
  revised_footnotes:
  - marker: a
    text: 히브리어는 ‘원수인 민족 위에 던지셨다’라고 압축하여 말하며, 던져진 대상은 명시하지 않습니다. 여기서는 문맥에 따라 ‘파멸’을 보충했습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 חרם은 전쟁의 맥락에서 신에게 바쳐져 멸절되는 것을 가리키는 용어로, ‘진멸’ 또는 ‘바쳐진 멸망’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 그리스어 병행본문은 ‘한 민족에게 전쟁을 일으키고’ ‘저항한 자들’을 멸하였다고 하며, 또한 ‘그의 전쟁은 주님 앞에 있다’는 말을 덧붙입니다.
    reason: alternative_reading
  revision_rationale: 목적절을 정확히 복원하고, ‘원수의 민족’의 한국어 소유격 모호성을 제거했습니다. 파멸이라는 보충은 히브리어의 생략을 문맥상 최소한으로 드러내되 각주에서 명시했으며, חרם의 전문적 의미와 그리스어 병행본문의 이문은 각각 별도 각주로 보존했습니다.
