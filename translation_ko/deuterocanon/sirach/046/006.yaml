base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/046/006.yaml
  text: He hurled destruction on an enemy nation[a], and as they fled he wiped them all out, so that every nation might know their ban[b], for Yahweh watches over their battle.
  footnotes:
  - marker: a
    text: Hebrew חרם is a covenant-war term for something devoted to destruction under divine judgment; alternatively, 'so that every nation might know their devoted destruction.'
    reason: lexical_alternative
  - marker: b
    text: 'The Greek parallel differs notably: it speaks of bringing war upon a nation and destroying ''those who resisted,'' adding that the battle was before the Lord.'
    reason: alternative_reading
translation:
  language: ko
  text: 그는 원수의 민족에게 재앙을 내리시고[a], 그들이 도망할 때에 그들을 모두 멸하셨습니다. 그래서 모든 민족이 그들의 멸망당할 운명[b]을 알게 하셨으니, 야훼께서 그들의 전투를 살피고 계시기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 השליך는 강하게 내던지거나 쏘아 올리는 행위를 가리키며, 전투 문맥에서는 심판을 ‘내리다’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 חרם은 ‘진멸’ 혹은 ‘바쳐진 멸망’의 뜻을 지닌 전쟁-언약 용어입니다. 그리스어 평행본문은 여기서 ‘전쟁’과 ‘저항한 자들’을 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: השליך
  english_pob_choice: hurled
  chosen_korean: 재앙을 내리시고
  alternatives_korean:
  - 내던지시고
  - 내리치시고
  - 던지시고
  lexicon: HALOT
  rationale: 히브리어 동사는 강하게 던지거나 내던지는 폭력적 행위를 가리키므로, 한국어에서는 전투 맥락을 자연스럽게 드러내는 ‘재앙을 내리시고’로 옮겨 강한 심판의 느낌을 살렸습니다.
- source_word: גוי אויב
  english_pob_choice: an enemy nation
  chosen_korean: 원수의 민족
  alternatives_korean:
  - 적대하는 민족
  - 원수 민족
  - 적대적인 백성
  lexicon: HALOT
  rationale: גוי는 집단으로서의 ‘민족/나라’를 뜻하므로, אויב과 함께 ‘원수의 민족’으로 옮겨 공동체적 대상성을 유지했습니다.
- source_word: ובנוסם
  english_pob_choice: as they fled
  chosen_korean: 그들이 도망할 때에
  alternatives_korean:
  - 도망하는 동안
  - 도망치자
  - 그들이 달아날 때에
  lexicon: HALOT
  rationale: 부사적 상황을 나타내는 형태이므로, 한국어에서는 시간·상황을 분명히 하는 ‘그들이 도망할 때에’가 가장 자연스럽습니다.
- source_word: האביד כולם
  english_pob_choice: he wiped them all out
  chosen_korean: 그들을 모두 멸하셨습니다
  alternatives_korean:
  - 그들을 모두 없애셨습니다
  - 그들을 모두 멸망시키셨습니다
  - 그들을 전부 쓸어버리셨습니다
  lexicon: HALOT
  rationale: אבד의 사역형은 ‘멸하다/멸망시키다’의 뜻이 강하므로, 합쇼체에서 지나치게 구어적인 표현을 피하면서도 총체성을 담아 ‘그들을 모두 멸하셨습니다’로 옮겼습니다.
- source_word: חרם
  english_pob_choice: their ban
  chosen_korean: 그들의 멸망당할 운명
  alternatives_korean:
  - 그들의 바침됨
  - 그들의 진멸
  - 그들의 바나
  lexicon: HALOT
  rationale: חרם은 단순한 ‘금지’가 아니라 하나님께 바쳐져 멸절되는 전쟁-언약 용어이므로, 본문에서는 의미를 드러내되 짧게 ‘멸망당할 운명’으로 풀어 옮겼습니다.
- source_word: יהוה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: HALOT
  rationale: 프로젝트 기본값에 따라 신명은 학술적 음역인 ‘야훼’로 유지했습니다.
theological_decisions:
- issue: חרם의 의미를 본문에서 어떻게 처리할지
  chosen_reading: 본문에서는 ‘그들의 멸망당할 운명’으로 풀어 옮기고, 전쟁-봉헌/진멸 개념을 과도하게 단순화하지 않았습니다.
  alternative_readings:
  - 그들의 바나
  - 그들의 진멸
  - 그들의 완전한 멸망
  rationale: 이 어휘는 심판과 성전(聖戰) 전통을 함께 지니므로, 한국어에서 즉시 이해되면서도 신학적 무게를 잃지 않는 표현을 선택했습니다.
  doctrine_reference: Lexical/theological tension preservation; covenant-war terminology
- issue: 히브리어 본문을 기본으로 하되 그리스어 병행본문을 어떻게 반영할지
  chosen_reading: 주본문은 히브리어를 따르고, 그리스어의 ‘전투’ 및 ‘야훼 앞에서’라는 뉘앙스는 마지막 절의 ‘그들의 전투를 살피고 계시기 때문입니다’로 과하게 확대하지 않고 배경으로만 보존했습니다.
  alternative_readings:
  - 그들의 전쟁을 감시하고 계시기 때문입니다
  - 주님의 앞에서 전쟁이 있었기 때문입니다
  rationale: 시락서는 히브리어가 남아 있는 경우 히브리어를 기본으로 번역하되, 병행본문의 차이는 주석으로 보존하는 것이 원칙입니다.
  doctrine_reference: Original-language primacy over translation tradition
