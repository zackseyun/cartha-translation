  text: And the judges, each by his own name—everyone whose heart was not led astray and who did not turn away from God—may their memory be for blessing.
  footnotes:
  - marker: a
    text: Hebrew literally, 'all who did not lift up his heart'; the Greek parallel reads, 'whose heart did not go astray,' which likely clarifies the intended sense here.
    reason: lexical_alternative
  - marker: b
    text: 'Greek: ''did not turn away from the Lord.'' The Hebrew witness here reads ''from God.'''
    reason: alternative_reading
translation:
  language: ko
  text: 판관들도 한 사람 한 사람 이름을 들어, 마음이 빗나가지 않고[a] 하나님에게서 돌아서지 않은 이들의 기억이 복되기를 바랍니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘자기 마음을 높이 들지 않은 모든 이들’입니다. 그리스어 병행본은 ‘그 마음이 음행하지 않은’, 곧 ‘빗나가지 않은’으로 읽습니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어는 ‘주님에게서 돌아서지 않은’으로 읽지만, 히브리어 본문은 ‘하나님에게서’라고 읽습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: והשופטים
  english_pob_choice: And the judges
  chosen_korean: 재판관들은
  alternatives_korean:
  - 판관들은
  - 심판자들은
  lexicon: HALOT
  rationale: 히브리어 שפטים과 그리스어 οἱ κριταί는 이 문맥에서 이스라엘의 재판관/지도자들을 가리키므로, 현대 한국어에서 가장 직접적인 ‘재판관들’로 옮겼습니다.
- source_word: איש בשמו
  english_pob_choice: each by his own name
  chosen_korean: 각자 자기 이름으로
  alternatives_korean:
  - 각자 자기 이름대로
  - 한 사람씩 자기 이름으로
  lexicon: HALOT
  rationale: 개별적으로 기억된다는 뜻을 살리면서도 한국어 어순에 자연스럽게 맞추어 옮겼습니다.
- source_word: כל אשר לא נשא לבו
  english_pob_choice: everyone whose heart was not led astray
  chosen_korean: 마음이 길을 잃지 않았고
  alternatives_korean:
  - 마음이 높아지지 않았고
  - 마음이 방황하지 않았고
  lexicon: HALOT
  rationale: 히브리어의 직역 가능성보다, 병행하는 그리스어의 ‘마음이 빗나가지 않았다’는 뜻을 반영해 언약적 불신실함이 아니라 ‘길을 잃지 않음’으로 표현했습니다.
- source_word: ולא נסוג מאחרי אל
  english_pob_choice: and who did not turn away from God
  chosen_korean: 하나님에게서 돌아서지 않은
  alternatives_korean:
  - 하나님을 떠나지 않은
  - 주님에게서 돌아서지 않은
  lexicon: HALOT
  rationale: 히브리어 본문이 אל(하나님)을 읽으므로 본문을 따랐고, 그리스어 Κυρίου에 해당하는 ‘주님’은 본문 주석 없이 본문에는 넣지 않았습니다.
- source_word: יהי זכרם לברכה
  english_pob_choice: may their memory be for blessing
  chosen_korean: 그들의 기억이 복이 되기를 바랍니다
  alternatives_korean:
  - 그들의 기억이 복된 일이 되기를 바랍니다
  - 그들을 기념함이 복이 되기를 바랍니다
  lexicon: HALOT
  rationale: 히브리어 관용구를 한국어로 자연스럽게 풀되, ‘기억/복’의 연결을 유지해 전형적인 축복 공식의 의미를 살렸습니다.
theological_decisions:
- issue: 히브리어 אל과 그리스어 Κυρίου의 차이
  chosen_reading: 본문에는 ‘하나님’으로 두고, 그리스어의 ‘주님’은 본문에 반영하지 않았습니다.
  alternative_readings:
  - 주님
  - 주
  rationale: 이 절의 주요 히브리어 증거가 אל을 읽으므로 본문 번역은 히브리어를 따랐습니다. 그리스어는 의미상 중요한 병행 증거이지만, 본문보다 우선하지는 않았습니다.
  doctrine_reference: 원문 우선과 병행본 주석 처리
