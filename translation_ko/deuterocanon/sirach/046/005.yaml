translation:
  language: ko
  text: 그가 적들이 사방에서 그를 압박할 때 지극히 높으신 하나님께 부르짖었고, 지극히 높으신 하나님께서는 우박과 얼음돌로 그에게 응답하셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 ‘큰 주께서 그들을 들으셨다’라고 하며, ‘우박 돌’과 ‘큰 능력’이라는 더 확장된 폭풍 신현의 표현을 덧붙입니다. 히브리어 본문은 ‘그에게 응답하셨다’라고 하므로, 여기서는 히브리어를 따랐습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: קרא אל
  english_pob_choice: called on
  chosen_korean: 부르짖었고
  alternatives_korean:
  - 불렀고
  - 호소했고
  - 간구했고
  lexicon: HALOT
  rationale: קרא אל은 단순한 호출보다 도움을 구하는 간청의 뉘앙스가 강하므로, 예배적·위기 상황에 어울리는 ‘부르짖다’로 옮겼습니다. 영어 POB의 ‘called on’과 같은 구도를 유지하면서도 한국어에서 더 자연스럽게 기도적 행위를 드러냅니다.
- source_word: אל עליון
  english_pob_choice: God Most High
  chosen_korean: 지극히 높으신 하나님
  alternatives_korean:
  - 가장 높으신 하나님
  - 지존하신 하나님
  - 하나님 지극히 높으신 분
  lexicon: HALOT
  rationale: אל עליון은 ‘하나님’과 ‘가장 높으신’의 결합이므로, 전통적 교회어보다 직접적인 의미를 살려 ‘지극히 높으신 하나님’으로 옮겼습니다. 같은 칭호가 두 번 반복되므로 두 절에서 동일하게 유지했습니다.
- source_word: כאכפה לו אויביו מסביב
  english_pob_choice: when his enemies pressed him from all around
  chosen_korean: 적들이 사방에서 그를 압박할 때
  alternatives_korean:
  - 적들이 그를 사방으로 에워쌌을 때
  - 적들이 사방에서 그를 괴롭힐 때
  - 적들이 둘러싸고 그를 눌렀을 때
  lexicon: HALOT
  rationale: 희귀한 동사형의 정확한 형태보다 문맥상 ‘사방에서 누르다/압박하다’는 뜻이 분명하므로, 둘러싸임과 고통의 압력을 함께 살린 ‘사방에서 그를 압박할 때’로 옮겼습니다. 이는 그리스어의 θλίψαι(압박하다, 괴롭히다)와도 부합합니다.
- source_word: באבני ברד
  english_pob_choice: with hailstones
  chosen_korean: 우박
  alternatives_korean:
  - 우박으로
  - 우박 돌
  - 우박덩이
  lexicon: HALOT
  rationale: 베트 전치사는 수단을 나타내므로 한국어에서는 자연스럽게 ‘우박으로’의 뜻이 되지만, 절 전체의 동사와 결합해 ‘우박과 얼음 돌로’가 더 매끄럽습니다. 본문에서는 뒤의 재료 표현과 병렬을 맞추기 위해 명사구로 처리했습니다.
- source_word: ואלגביש
  english_pob_choice: and ice-stones
  chosen_korean: 얼음 돌
  alternatives_korean:
  - 얼음돌
  - 얼음덩이
  - 단단한 얼음
  lexicon: HALOT
  rationale: אלגביש은 희귀어로, 일반적인 ‘우박’과 구별되는 두 번째 폭풍 심판 표현을 유지하는 것이 중요합니다. 한국어에서는 직역성을 살리면서도 읽기 쉬운 ‘얼음 돌’로 옮겨, 우박과의 이중 표현을 보존했습니다.
theological_decisions:
- issue: 하나님 칭호의 반복 유지
  chosen_reading: 두 절 모두에서 ‘지극히 높으신 하나님’으로 반복했습니다.
  alternative_readings:
  - 둘째 절에서는 ‘지극히 높으신 분’으로 줄이기
  - 한 번은 ‘가장 높으신 하나님’으로 바꾸기
  rationale: 히브리어는 אל עליון을 반복해 동일한 하나님이 부르짖음에 응답하신다는 점을 강조합니다. 반복을 유지함으로써 시적 평행법과 신적 응답의 동일성을 드러냅니다.
  doctrine_reference: Translation philosophy §5 (consistency of key terms)
