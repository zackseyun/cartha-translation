  text: For he called on God Most High when his enemies pressed him from all around[a], and God Most High answered him with hailstones and ice-stones.
  footnotes:
  - marker: a
    text: 'Greek: ''the great Lord heard them/him in stones of hail, with mighty power.'' The Hebrew witness is primary here, but the Greek suggests a more expansive storm-theophany wording.'
