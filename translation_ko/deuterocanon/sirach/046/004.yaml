base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/046/004.yaml
  text: Was it not by his hand that the sun stood still[b][a], and one day was like two?
  footnotes:
  - marker: a
    text: Or, more explicitly, 'one day became like two days.' The Hebrew says simply 'like two,' with 'day' understood from the context.
    reason: lexical_alternative
  - marker: b
    text: The verse alludes to Joshua's victory tradition in which the sun's course was halted; compare Joshua 10:12–14.
    reason: cross_reference
translation:
  language: ko
  text: 그의 손으로 해가 멈추지 않았습니까? 한 날이 두 날과 같았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘한 날이 두 날처럼 되었다.’ 히브리어는 단지 ‘두’라고만 말하며, ‘날’은 앞 문맥에서 이해됩니다.
    reason: lexical_alternative
  - marker: b
    text: 이 구절은 여호수아 10:12–14의 태양 정지 전승을 가리킵니다.
    reason: cross_reference
