base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/046/015.yaml
  text: By the faithfulness of his mouth he was sought out as a seer[c][b][a], and also by his word he was found faithful as a shepherd.
  footnotes:
  - marker: a
    text: Or 'By the faith of his mouth'; the Hebrew more naturally suggests the faithfulness or trustworthiness of his speech.
    reason: lexical_alternative
  - marker: b
    text: 'Greek: ''prophet'' where the Hebrew reads ''seer.'''
    reason: alternative_reading
  - marker: c
    text: The Hebrew wording in the second line is somewhat compressed; the sense may be that by his word he was recognized as a faithful shepherd.
    reason: textual_variant
translation:
  language: ko
  text: 그의 입의 신실함으로 그는 선지자로 찾아졌고, 또한 그의 말로는 신실한 목자임이 알려졌습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그의 입의 신실함’은 곧 ‘그의 입의 믿음’으로도 읽을 수 있으나, 히브리어는 말의 신뢰성과 성실함을 더 자연스럽게 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어는 여기서 ‘선지자/예언자’를 사용합니다.
    reason: alternative_reading
  - marker: c
    text: 두 번째 행의 히브리어는 압축적이어서, 의미는 ‘그의 말로 신실한 목자로 인정되었다’는 뜻일 수 있습니다.
    reason: textual_variant
lexical_decisions:
- source_word: באמונת פיו
  english_pob_choice: By the faithfulness of his mouth
  chosen_korean: 그의 입의 신실함으로
  alternatives_korean:
  - 그의 입의 믿음으로
  - 그의 입의 신실성으로
  - 그의 말을 믿을 만함으로
  lexicon: HALOT
  rationale: אֱמוּנָה는 여기서 내적 믿음보다 말의 신뢰성과 성실함을 가리키므로, 한국어도 ‘신실함’으로 옮겨 입과 말의 신뢰성을 살렸습니다.
- source_word: דרוש חזה
  english_pob_choice: he was sought out as a seer
  chosen_korean: 그는 선지자로 찾아졌고
  alternatives_korean:
  - 그는 선견자로 찾아졌고
  - 그는 예언자로 찾아졌고
  - 그는 선지자로 여겨졌고
  lexicon: HALOT
  rationale: 히브리어 חזה는 ‘보는 자, 선견자’의 뜻이지만, 본문 전승의 기능을 살려 한국어에서는 이해가 쉬운 ‘선지자’로 옮기되, ‘찾아졌다’로 דרש의 수동적 의미를 반영했습니다.
- source_word: בדברו נאמן רועה
  english_pob_choice: by his word he was found faithful as a shepherd
  chosen_korean: 그의 말로는 신실한 목자임이 알려졌습니다
  alternatives_korean:
  - 그의 말로는 목자로서 신실하다는 것이 알려졌습니다
  - 그의 말로는 신실한 목자로 인정되었습니다
  - 그의 말에 의해 신실한 목자로 드러났습니다
  lexicon: HALOT
  rationale: בדברו와 נאמן의 압축된 구조를 자연스럽게 풀어, ‘그의 말’과 ‘신실한 목자’의 결속을 유지하면서 결과적 인식의 뉘앙스를 살렸습니다.
theological_decisions:
- issue: 히브리어 חזה와 그리스어 προφήτης의 대응
  chosen_reading: 본문의 히브리어를 따라 ‘선지자’로 번역하되, 예언자적 직분을 가리키는 표현으로 이해했습니다.
  alternative_readings:
  - 선견자
  - 예언자
  - 선지자
  rationale: 이 구절은 히브리어가 직접 전승되므로 본문 우선 원칙에 따라 히브리어의 구체성을 살렸고, 그리스어의 ‘prophet’은 의미상 대응으로 보았습니다.
  doctrine_reference: 'DOCTRINE.md: original-language primacy over translation tradition.'
