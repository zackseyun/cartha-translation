translation:
  language: ko
  text: 누가 그의 앞에 설 수 있겠습니까? 그가 야훼의 전쟁을 싸웠기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 ‘누가 그의 앞에 설 수 있겠습니까? 그가 야훼의 전쟁을 싸웠기 때문입니다’라고 읽습니다. 그리스어 평행문은 대략 ‘누가 그 앞에 이처럼 서 있었습니까? 이는 주께서 친히 원수들을 이끄셨기 때문입니다’로 달리 읽습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: מי הוא לפניו יתיצב
  english_pob_choice: Who could stand before him?
  chosen_korean: 누가 그의 앞에 설 수 있겠습니까?
  alternatives_korean:
  - 누가 그의 앞에 설 수 있습니까?
  - 누가 그를 당해 낼 수 있겠습니까?
  lexicon: HALOT
  rationale: 히브리어 수사 의문문을 현대 한국어의 가능성 표현으로 옮겨, 단순한 ‘서다’보다 ‘대항하여 버티다’의 함의를 자연스럽게 살렸습니다.
- source_word: מלחמות
  english_pob_choice: wars
  chosen_korean: 전쟁을
  alternatives_korean:
  - 싸움을
  - 전투를
  lexicon: HALOT
  rationale: 복수형 명사로서 규모가 큰 전쟁들을 가리키므로, ‘전투’보다 넓은 ‘전쟁’이 더 적절합니다.
- source_word: יהוה
  english_pob_choice: Yahweh
  chosen_korean: 야훼의
  alternatives_korean:
  - 주님의
  - 여호와의
  lexicon: project default
  rationale: 본문에 직접 나온 신명 표기를 프로젝트 기본값에 따라 ‘야훼’로 옮겨, 소스의 표지성을 유지했습니다.
- source_word: נלחם
  english_pob_choice: he fought
  chosen_korean: 싸웠습니다
  alternatives_korean:
  - 전쟁하였습니다
  - 전투하였습니다
  lexicon: HALOT
  rationale: 동사의 기본 의미를 직역하되, 한국어에서는 ‘전쟁을 싸우다’보다 ‘전쟁을 싸우다/싸웠다’가 더 자연스럽습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 평행문의 차이
  chosen_reading: 주된 본문은 히브리어를 따라 ‘그가 야훼의 전쟁을 싸웠기 때문입니다’로 옮기되, 그리스어의 ‘주께서 친히 원수들을 이끄셨다’는 의미는 본문 밖 대조 자료로 남깁니다.
  alternative_readings:
  - 그가 주의 전쟁을 싸웠기 때문입니다
  - 주께서 친히 원수들을 이끄셨기 때문입니다
  rationale: 히브리어 증거가 ‘야훼의 전쟁’이라는 표현을 분명히 하므로 이를 본문에 반영하고, 그리스어는 의미상 중요한 대안 독법으로 보존합니다.
  doctrine_reference: 'POB translation policy: source-priority with audited alternative readings'
- issue: 신명 표기의 한국어 처리
  chosen_reading: 야훼
  alternative_readings:
  - 주
  - 여호와
  rationale: 이 사전의 기본 원칙에 따라 히브리어 יהוה는 ‘야훼’로 일관되게 옮겨, 전쟁의 주체가 누구인지 본문에서 명시되게 했습니다.
  doctrine_reference: POB glossary — יהוה / YHWH
