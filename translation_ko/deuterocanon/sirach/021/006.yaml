  yaml_path: translation/deuterocanon/sirach/021/006.yaml
  text: One who hates reproof walks in the track of a sinner, but one who fears the Lord will turn back in his heart.
  footnotes:
  - marker: a
    text: Or, more literally, 'is in the track/footstep of a sinner.' The Greek first clause is elliptical, so English supplies the implied motion.
    reason: lexical_alternative
translation:
  language: ko
  text: 훈계를 미워하는 사람은 죄인의 발자취를 따르지만, 주님을 두려워하는 사람은 마음으로 돌이킵니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘죄인의 발자취 안에/위에 있다’에 가깝습니다. 그리스어 첫 절은 동사가 생략된 축약 표현이어서, 한국어에서는 자연스러운 동작 표현을 보탰습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: μισῶν ἐλεγμὸν
  english_pob_choice: one who hates reproof
  chosen_korean: 훈계를 미워하는 사람
  alternatives_korean:
  - 꾸짖음을 미워하는 사람
  - 책망을 미워하는 사람
  lexicon: LSJ; BDAG
  rationale: ἐλεγμός는 지혜문맥에서 도덕적 교정이나 훈계를 뜻하므로, 한국어로는 자연스럽고 의미 범위가 맞는 '훈계'를 택했습니다.
- source_word: ἐν ἴχνει
  english_pob_choice: walks in the track of
  chosen_korean: 발자취를 따르지만
  alternatives_korean:
  - 흔적 속에 있지만
  - 발자국을 따라가지만
  lexicon: LSJ
  rationale: ἴχνος는 발자국, 흔적, 자취를 뜻하므로 '발자취'로 옮겼고, 첫 절의 생략된 동작은 관계절처럼 자연스러운 '따르다'로 보완했습니다.
- source_word: ἁμαρτωλοῦ
  english_pob_choice: a sinner
  chosen_korean: 죄인
  alternatives_korean:
  - 죄인의
  - 죄 많은 사람의
  lexicon: BDAG
  rationale: 단수 보통명사로서 특정 개인이 아니라 유형을 가리키므로 '죄인'으로 간결하게 살렸습니다.
- source_word: Κύριον
  english_pob_choice: the Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주
  - 주인
  lexicon: POB default glossary
  rationale: κύριος는 본 프로젝트 기본어휘에 따라 '주님'으로 옮겨, 경외의 뉘앙스를 유지했습니다.
- source_word: ἐπιστρέψει ἐν καρδίᾳ
  english_pob_choice: will turn back in his heart
  chosen_korean: 마음으로 돌이킵니다
  alternatives_korean:
  - 마음속으로 돌아섭니다
  - 마음에서 돌이킵니다
  lexicon: BDAG
  rationale: ἐπιστρέφω는 '돌이키다/되돌아가다'의 뜻이므로, 내적 태도의 전환을 드러내는 '마음으로 돌이키다' 계열로 옮겼습니다.
theological_decisions:
- issue: 주님에 대한 경외와 내적 회심의 관계
  chosen_reading: ‘주님을 두려워하는 사람’이 ‘마음으로 돌이키는’ 내적 반응으로 이어진다고 옮겼습니다.
  alternative_readings:
  - ‘주님을 두려워하는 사람은 마음속으로 돌아섭니다’
  - ‘주님을 두려워하는 사람은 속으로 돌이킵니다’
  rationale: 히브리/지혜문학의 경구답게 외적 행동보다 내적 방향 전환을 강조하므로, '마음으로'를 살려 회심의 내면성을 유지했습니다.
  doctrine_reference: 지혜문학의 경구적 병행 구조; μετανοέω가 아닌 ἐπιστρέφω의 기본 의미 보존
