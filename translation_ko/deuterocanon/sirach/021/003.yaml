- source_word: וּמַשְׁתִּין מָיִם
  english_pob_choice: and urinates
  chosen_korean: 소변을 보는
  alternatives_korean:
  - 오줌을 누는
  - 배뇨하는
  - 소변을 누는
  lexicon: HALOT
  rationale: 히브리어의 ‘물을 내보내다/소변을 보다’는 관용을 현대 한국어에서는 가장 자연스럽고 품위 있게 ‘소변을 보는’으로 옮겼습니다.
- source_word: פִּתְאוֹם
  english_pob_choice: suddenly
  chosen_korean: 갑자기
  alternatives_korean:
  - 뜻밖에
  - 예고 없이
  - 돌연
  lexicon: HALOT
  rationale: 문맥상 예고 없는 침입의 돌발성을 나타내므로, 가장 직관적인 ‘갑자기’를 선택했습니다.
