base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/021/003.yaml
  text: Like one who grasps a woman’s private parts and urinates[b][a], so is one who suddenly enters his neighbor’s house.
  footnotes:
  - marker: a
    text: The Hebrew here is a crude bodily proverb. The word rendered “private parts” can have other senses in Hebrew, but in this context the obscene sense best fits the line.
    reason: lexical_alternative
  - marker: b
    text: 'Greek has a different line here: “Her teeth are lion’s teeth, destroying the lives of men.” This appears to reflect a substantially different textual form.'
    reason: textual_variant
translation:
  language: ko
  text: 여자의 은밀한 부위를 붙잡고 소변을 보는 사람은 갑자기 이웃의 집에 들어가는 사람과 같습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 이 표현은 거친 신체 비유입니다. ‘은밀한 부위’로 옮긴 말은 다른 뜻들도 가질 수 있으나, 이 문맥에서는 여성의 사적인 신체 부위를 가리키는 뜻이 가장 알맞습니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어 본문은 여기서 전혀 다른 행을 전합니다. “그녀의 이빨은 사자의 이빨이며, 사람들의 생명을 앗아간다.” 이는 상당히 다른 본문 형태를 반영하는 것으로 보입니다.
    reason: textual_variant
lexical_decisions:
