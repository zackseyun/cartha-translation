  yaml_path: translation/deuterocanon/sirach/021/014.yaml
  text: The inward parts of a fool are like a broken vessel[a], and they will not hold any knowledge.
  footnotes:
  - marker: a
    text: Or 'like a shattered jar' or 'like a broken pot.' The Greek image is of a container smashed so that it cannot retain what is put into it.
    reason: lexical_alternative
translation:
  language: ko
  text: 어리석은 자의 속은 깨진 그릇[a]과 같아서, 어떤 지식도 간직하지 못합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘부서진 항아리’, ‘깨진 질그릇’. 그리스어의 이미지는 안에 담긴 것을 간직하지 못하도록 산산이 부서진 용기를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔγκατα
  english_pob_choice: the inward parts
  chosen_korean: 속
  alternatives_korean:
  - 내장
  - 내면
  - 심장
  lexicon: LSJ
  rationale: 직역하면 신체 내부 장기이지만, 지혜문학의 비유적 문맥에서는 사람의 안쪽 전체를 가리키므로, 너무 해부학적이거나 추상적인 표현보다 ‘속’이 이미지와 의미를 함께 살립니다.
- source_word: μωροῦ
  english_pob_choice: of a fool
  chosen_korean: 어리석은 자의
  alternatives_korean:
  - 우매한 자의
  - 미련한 자의
  - 바보의
  lexicon: LSJ
  rationale: 속담체의 평가어로서 부정적 도덕성과 판단력 결핍을 함께 담아야 하므로, 현대 한국어에서 자연스럽고 지나치게 구어적이지 않은 ‘어리석은 자’로 옮겼습니다.
- source_word: ὡς ἄγγιον συντετριμμένον
  english_pob_choice: like a broken vessel
  chosen_korean: 깨진 그릇과 같아서
  alternatives_korean:
  - 부서진 항아리와 같아서
  - 산산이 부서진 그릇과 같아서
  - 깨진 항아리와 같아서
  lexicon: LSJ
  rationale: ἄγγιον은 그릇/용기를 뜻하는 비교적 넓은 말이어서, 한국어에서는 가장 자연스러운 일반명사 ‘그릇’이 비유를 과도하게 구체화하지 않으면서도 잘 전달합니다.
- source_word: πᾶσαν γνῶσιν
  english_pob_choice: any knowledge
  chosen_korean: 어떤 지식도
  alternatives_korean:
  - 모든 지식도
  - 아무 지식도
  - 지식을 전혀
  lexicon: LSJ
  rationale: 부정 미래와 결합해 ‘전혀 붙들어 두지 못함’의 뜻이므로, 범위를 넓혀 배제하는 ‘어떤 지식도’가 원문의 부정적 보편성을 잘 반영합니다.
- source_word: οὐ κρατήσει
  english_pob_choice: they will not hold any knowledge
  chosen_korean: 붙들지 못합니다
  alternatives_korean:
  - 간직하지 못합니다
  - 지니지 못합니다
  - 붙잡아 두지 못합니다
  lexicon: LSJ
  rationale: κρατέω의 핵심은 붙들어 유지하다이므로, ‘지식이 머물러 있지 않음’과 그릇 비유를 함께 살리는 ‘붙들지 못합니다’가 가장 직결됩니다.
theological_decisions:
- issue: 지혜문학의 신체 비유를 추상화할지 여부
  chosen_reading: ‘속’으로 옮겨, 내부 장기의 구체적 이미지를 유지하되 현대 독자가 읽을 수 있도록 완화했습니다.
  alternative_readings:
  - ‘내장’으로 더 해부학적으로 옮김
  - ‘마음’이나 ‘내면’으로 완전히 추상화함
  rationale: 본문은 ‘내부 장기’와 ‘깨진 그릇’의 물질적 대비를 통해 지혜가 머물지 못하는 상태를 말하므로, 이미지를 지우지 않는 번역이 원문의 효과를 더 잘 전달합니다.
  doctrine_reference: 지혜문학의 비유적 언어와 인식론적 교훈
- issue: κρατέω를 단순 소유가 아니라 유지·보존의 의미로 읽을지 여부
  chosen_reading: 지식이 들어와도 유지되지 못한다는 뜻으로 읽어 ‘붙들지 못합니다’로 옮겼습니다.
  alternative_readings:
  - ‘지식을 가지지 못합니다’
  - ‘지식을 이해하지 못합니다’
  rationale: 그릇 비유와 함께 보면 초점은 지식의 획득보다 보존 실패에 있으므로, 단순 소유나 이해 부족보다 ‘붙들어 유지하지 못함’이 문맥에 더 가깝습니다.
  doctrine_reference: 지혜/우매의 대비와 비유적 진술
