base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/021/002.yaml
  text: Flee from sin as from the face of a snake[a]; for if you come near it, it will bite you.[b]
  footnotes:
  - marker: a
    text: Literally, 'Flee from sin as from the face/presence of a snake.' The Greek image is highly concrete; 'snake' could also be rendered 'serpent.'
    reason: lexical_alternative
  - marker: b
    text: The extant Cairo Geniza Hebrew line in the provided source does not match the Greek wording for this verse and appears to reflect a source-location mismatch; the translation therefore follows the Greek witness here.
    reason: textual_variant
translation:
  language: ko
  text: 뱀을 피하듯이[a] 죄를 피하십시오. 가까이 가면 그것이 당신을 물 것입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘뱀의 얼굴/낯으로부터 피하듯이’입니다. 여기서 ‘얼굴/낯’은 뱀의 앞이나 면전을 뜻하는 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 제공된 카이로 게니자 히브리어 본문은 이 절의 그리스어 문구와 일치하지 않아, 본문 번역은 그리스어 증거를 따랐습니다.
    reason: textual_variant
lexical_decisions:
- source_word: φεῦγε / שַׂר
  english_pob_choice: Flee
  chosen_korean: 도망치십시오
  alternatives_korean:
  - 피하십시오
  - 달아나십시오
  lexicon: BDAG / HALOT
  rationale: Greek imperative φεῦγε는 단순한 회피보다 급박한 도피를 뜻하므로, 합쇼체 명령으로 자연스럽게 옮겨 긴박감을 살렸습니다.
- source_word: ἁμαρτίας
  english_pob_choice: sin
  chosen_korean: 죄
  alternatives_korean:
  - 악
  - 잘못
  lexicon: BDAG
  rationale: ἁμαρτία의 기본적 도덕·신학적 의미를 가장 직접적으로 드러내는 표준 번역이므로 ‘죄’로 옮겼습니다.
- source_word: ὡς ἀπὸ προσώπου ὄφεως
  english_pob_choice: as from the face of a snake
  chosen_korean: 뱀의 얼굴에서 도망치듯이
  alternatives_korean:
  - 뱀의 얼굴 앞에서처럼
  - 뱀의 낯을 피하듯이
  lexicon: BDAG / LSJ
  rationale: 직역은 ‘얼굴/낯’의 구체성을 지니지만 한국어에서는 ‘~에서 도망치듯이’가 자연스러워, 원문의 생생한 이미지와 회피의 비유를 함께 살렸습니다.
- source_word: ἐὰν ... προσέλθῃς
  english_pob_choice: if you come near it
  chosen_korean: 가까이 가시면
  alternatives_korean:
  - 다가가시면
  - 접근하시면
  lexicon: BDAG
  rationale: προσέρχομαι의 ‘가까이 가다/다가서다’를 현대 한국어로 자연스럽게 표현했습니다.
- source_word: δήξεταί
  english_pob_choice: it will bite you
  chosen_korean: 물 것입니다
  alternatives_korean:
  - 독을 물 것입니다
  - 당할 것입니다
  lexicon: BDAG / LSJ
  rationale: δήξομαι 계열은 ‘물다’가 핵심이므로, 결과를 과장하지 않고 직접적으로 ‘물을 것입니다’로 옮겼습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행본의 불일치
  chosen_reading: 이 절은 현존 히브리어 라인이 본절과 맞지 않는다는 주석을 반영해, 본문 번역은 그리스어 증거를 따랐습니다.
  alternative_readings:
  - 현존 히브리어 라인을 따라 ‘술집에 익숙한 통치자…’로 번역
  rationale: 제공된 히브리어는 21:2의 그리스어 내용과 대응하지 않는 ‘minor_mismatch’로 표시되어 있으므로, 독자에게 실제 본문의 경고를 전달하는 쪽을 우선했습니다.
  doctrine_reference: 'PHILOSOPHY.md: surviving Hebrew where possible; Greek where Hebrew is displaced or uncertain'
