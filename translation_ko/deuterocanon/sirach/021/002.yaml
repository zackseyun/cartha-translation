  naturalness: ‘뱀을 피하듯이 죄를 피하십시오’는 현대 표준 한국어의 자연스러운 합쇼체이며, 원문의 긴급한 명령과 비유를 보존합니다. ‘가까이 가면’은 조건절로 자연스럽고, ‘그것이 당신을 물 것입니다’는 죄를 뱀에 비유한 원문의 의도적 비유를 유지합니다.
