  text: The whisperer defiles his own soul[a], and in the place where he lives he will be hated.
  footnotes:
  - marker: a
    text: Or 'among those with whom he resides' or 'in his neighborhood.' The Greek phrase refers to the sphere of one's dwelling or resident community.
    reason: lexical_alternative
translation:
  language: ko
  text: 수군거리는 자는 자기 영혼을 더럽히며, 그가 사는 곳에서 미움을 받게 될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그가 함께 사는 사람들 가운데서’ 혹은 ‘그의 이웃에서’. 그리스어 표현은 거주하는 영역이나 그 안의 공동체를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: μολύνει
  english_pob_choice: defiles
  chosen_korean: 더럽힙니다
  alternatives_korean:
  - 부정하게 합니다
  - 오염시킵니다
  - 타락시킵니다
  lexicon: BDAG
  rationale: μολύνει는 단순한 물리적 오염보다 도덕적·의례적 부정을 함께 담아내므로, 한국어에서는 ‘더럽히다’가 그 함의를 가장 직접적으로 살립니다.
- source_word: τὴν ἑαυτοῦ ψυχὴν
  english_pob_choice: his own soul
  chosen_korean: 자기 영혼
  alternatives_korean:
  - 자기 자신
  - 자기 생명
  - 자기 목숨
  lexicon: BDAG
  rationale: ψυχή는 여기서 내적 인격과 도덕적 상태를 가리키므로, ‘자기 영혼’이 자기 자신으로 완화하지 않으면서도 내면 손상을 드러냅니다.
- source_word: ὁ ψιθυρίζων
  english_pob_choice: the whisperer
  chosen_korean: 수군거리는 자
  alternatives_korean:
  - 속삭이는 자
  - 험담하는 자
  - 뒷말하는 자
  lexicon: BDAG
  rationale: ψιθυρίζων은 은밀한 말하기를 가리키며 보통 험담·이간의 뉘앙스를 띱니다. ‘수군거리는 자’는 그 은밀함을 유지하면서도 지나치게 특정한 ‘험담하는 자’로 좁히지 않습니다.
- source_word: ἐν παροικήσει
  english_pob_choice: in the place where he lives
  chosen_korean: 그가 사는 곳에서
  alternatives_korean:
  - 그가 머무는 곳에서
  - 그가 사는 공동체에서
  - 그가 거주하는 주변에서
  lexicon: LSJ
  rationale: παροίκησις는 거주의 영역이나 삶의 자리 전체를 가리킬 수 있으므로, ‘그가 사는 곳에서’가 해석을 덧붙이지 않으면서도 한국어로 자연스럽습니다.
theological_decisions:
- issue: ψιθυρίζων의 사회적-윤리적 뉘앙스
  chosen_reading: ‘수군거리는 자’로 옮겨, 단순한 속삭임이 아니라 공동체 안에서 평판을 해치는 은밀한 말의 죄성을 드러냈습니다.
  alternative_readings:
  - ‘속삭이는 자’로 중립화
  - ‘험담하는 자’로 명시화
  rationale: 문맥은 은밀한 말이 공동체적 혐오를 낳는 윤리적 결과를 말하므로, 지나치게 중립적이거나 지나치게 협소한 표현보다 균형 잡힌 표현이 적합합니다.
  doctrine_reference: 지혜문학의 언어윤리와 공동체 질서
- issue: ἐν παροικήσει의 범위
  chosen_reading: ‘그가 사는 곳’으로 옮겨 거주 공간 전반을 가리키게 했습니다.
  alternative_readings:
  - ‘그가 사는 공동체’
  - ‘그의 이웃 사이’
  rationale: 본문은 특정 지리적 지점보다 거주 영역과 그 안의 사회적 관계망을 염두에 두므로, 한국어에서는 과도한 해석을 피하고 넓게 잡는 것이 좋습니다.
  doctrine_reference: 공동체적 책임과 평판의 수치
