    rationale: ‘불경한’은 현대어에서 무례함 또는 모독적 태도에 치우쳐 들릴 수 있습니다. ἀσεβής의 포괄적인 무경건·불신앙의 도덕적 성격에는 ‘경건하지 않은 자’가 더 적절합니다.
  revised_text: 경건하지 않은 자가 대적자를 저주할 때, 그는 자기 영혼을 저주하는 것입니다.[a]
