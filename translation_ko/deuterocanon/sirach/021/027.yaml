  verdict: revise
  source_fidelity: 그리스어의 시간적 부정사구(‘…할 때’), 저주의 반복, 그리고 ‘자기 자신의 영혼’은 대체로 충실히 옮겼습니다. 그러나 τὸν σατανᾶ는 원어상 ‘대적자’라는 의미를 지닌 음역어이므로, 본문에서 단정적으로 고유명사 ‘사탄’으로만 옮기기보다 영어 POB의 원어 우선 결정을 따라 의미를 본문에 보존하고 ‘사탄’을 각주 대안으로 두는 편이 안전합니다.
  naturalness: ‘경건하지 않은 자’는 ἀσεβής의 종교적·도덕적 의미를 현대 표준 한국어에서 자연스럽게 전달합니다. 문장 전체는 합쇼체의 설명적 종결인 ‘것입니다’를 유지하여 자연스럽습니다.
  terminology: ‘불경한 자’는 현대 한국어에서 예의 없거나 신성한 것을 모독하는 행위에 다소 좁게 들릴 수 있습니다. ‘경건하지 않은 자’가 ἀσεβής에 더 정확합니다. σατανᾶ의 의미상 투명성을 위해 본문은 ‘대적자’, 각주는 ‘사탄’으로 조정합니다.
  issues:
