    issue: τὸν σατανᾶ를 본문에서 ‘사탄’으로만 고정함
    rationale: 이 단어는 ‘대적자’라는 뜻의 셈어계 음역어이며, 이 지혜문학 문맥에서 고유명사적 독법만을 본문에 확정할 필요는 없습니다. 원어의 의미 가능성과 영어 POB 감사 기록을 따라 의미 번역을 본문에 두고 ‘사탄’을 대안으로 밝혀야 합니다.
