lexical_decisions:
- source_word: ἐν τῷ καταρᾶσθαι
  english_pob_choice: When ... curses
  chosen_korean: …할 때
  alternatives_korean:
  - …하는 중에
  - …하면서
  lexicon: BDAG
  rationale: 부정과거적 상황을 나타내는 관용구로 이해하여, 한국어에서는 자연스러운 시간 부사절 ‘…할 때’로 옮겼습니다.
- source_word: ἀσεβῆ
  english_pob_choice: the ungodly
  chosen_korean: 불경한 자
  alternatives_korean:
  - 악한 자
  - 경건하지 않은 자
  lexicon: LSJ
  rationale: 도덕적·종교적 무경건을 드러내면서도 단수 일반명사로 읽히도록 ‘불경한 자’로 옮겼습니다.
- source_word: τὸν σατανᾶ
  english_pob_choice: the Adversary
  chosen_korean: 사탄
  alternatives_korean:
  - 대적
  - 적대자
  lexicon: LSJ
  rationale: 문맥상 인격적 존재를 가리키므로 한국어 독자가 바로 식별할 수 있는 음역형 ‘사탄’을 본문에 두고, 의미상 대안은 주석으로 처리했습니다.
- source_word: τὴν ἑαυτοῦ ψυχήν
  english_pob_choice: his own soul
  chosen_korean: 자기 영혼
  alternatives_korean:
  - 자기 생명
  - 자기 자신
  lexicon: BDAG
  rationale: ψυχή의 영적·내적 무게를 살리기 위해 ‘영혼’을 택했고, ἑαυτοῦ의 소유 관계는 ‘자기’로 반영했습니다.
theological_decisions:
- issue: σατανᾶ를 고유명처럼 둘지, 의미 번역할지
  chosen_reading: 본문은 ‘사탄’으로 옮기되, 주석에서 ‘대적자’라는 의미 가능성을 밝힙니다.
  alternative_readings:
  - 대적
  - 적대자
  rationale: 지혜문학 맥락에서 의미 번역도 가능하지만, 한국어 독자에게는 인격적 반대자를 가리키는 ‘사탄’이 더 직접적입니다. 다만 원어의 투명성을 위해 대안 의미를 남깁니다.
  doctrine_reference: 'DOCTRINE.md: 원어 우선, 전통어는 필요한 경우만 채택, 대안 의미는 주석으로 보존'
