  text: He who builds his house with another’s money is like one gathering his stones for winter[a][b].
  footnotes:
  - marker: a
    text: Or 'with others’ wealth.' The Greek says 'in another’s monies/possessions,' an idiom for using resources that belong to someone else.
    reason: lexical_alternative
  - marker: b
    text: '''For winter'' may also imply ''for the storm season,'' sharpening the image of futility: the materials are gathered too late to build securely.'
    reason: lexical_alternative
translation:
  language: ko
  text: 자기 집을 남의 돈으로 짓는 사람은 겨울을 위해 자기 돌들을 모으는 사람과 같습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘남의 재물로’. 그리스어 표현은 남에게 속한 돈이나 재물을 사용한다는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘겨울을 위해’는 ‘겨울에 대비하여’로도 옮길 수 있습니다. ‘겨울’에 해당하는 그리스어는 폭풍이 이는 계절을 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ οἰκοδομῶν
  english_pob_choice: He who builds
  chosen_korean: 짓는 사람
  alternatives_korean:
  - 집을 짓는 사람
  - 세우는 사람
  - 건축하는 사람
  lexicon: LSJ
  rationale: 동사 οἰκοδομέω의 일반적 ‘짓다/건축하다’ 의미를 살리되, 한국어 속담체 문맥에서는 간결한 ‘짓는 사람’이 가장 자연스럽습니다.
- source_word: τὴν οἰκίαν αὐτοῦ
  english_pob_choice: his house
  chosen_korean: 자기 집
  alternatives_korean:
  - 그의 집
  - 자기 집안
  - 자기 가옥
  lexicon: LSJ
  rationale: οἰκία는 이 구절에서 건물로서의 ‘집’이 핵심이므로, ‘자기 집’이 비유의 물리적 이미지를 가장 مستقیم하게 전달합니다.
- source_word: ἐν χρήμασιν ἀλλοτρίοις
  english_pob_choice: with another’s money
  chosen_korean: 남의 돈으로
  alternatives_korean:
  - 남의 재물로
  - 남의 돈과 재산으로
  - 타인의 돈으로
  lexicon: LSJ
  rationale: χρήματα와 ἀλλότριος의 결합은 ‘남에게 속한 돈/재물’을 뜻하므로, 한국어에서는 구어적이되 함의를 놓치지 않는 ‘남의 돈으로’가 적절합니다.
- source_word: εἰς χειμῶνα
  english_pob_choice: for winter
  chosen_korean: 겨울을 대비해
  alternatives_korean:
  - 겨울을 위해
  - 겨울을 향해
  - 겨울철에
  lexicon: LSJ
  rationale: χείμων은 단순 계절명뿐 아니라 거친 계절·폭풍의 뉘앙스를 가질 수 있어, ‘겨울을 대비해’로 옮기면 시기착오와 무익함의 암시를 살릴 수 있습니다.
theological_decisions:
- issue: 비유의 의미를 단순한 계절 정보로 축소하지 않을지
  chosen_reading: ‘겨울을 대비해’로 옮겨, 돌을 모으는 시기의 부적절함과 헛수고의 뉘앙스를 드러냈습니다.
  alternative_readings:
  - ‘겨울을 위해’
  - ‘겨울에’
  rationale: 영문 POB 주해가 지적하듯 χειμών은 단지 계절이 아니라 폭풍철의 이미지도 포함할 수 있으므로, 한국어에서도 비유적 긴장감을 유지하는 것이 본문의 힘을 더 잘 보존합니다.
  doctrine_reference: 지혜문학의 교훈적 비유 해석
