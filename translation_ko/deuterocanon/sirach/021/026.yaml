  text: In the mouth of fools is their heart[a], but the heart of the wise is their mouth.
  footnotes:
  - marker: a
    text: Or, more interpretively, 'the mouth of the wise is in their heart'—that is, the wise keep speech under inward control. The Greek wording is terse and antithetical, and this alternative makes the implied sense explicit.
    reason: alternative_reading
translation:
  language: ko
  text: 미련한 사람의 입에는 그들의 마음이 있고, 지혜로운 사람의 마음은 그들의 입에 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘지혜로운 사람의 입은 그들의 마음 안에 있다’로도 이해할 수 있습니다. 즉, 지혜로운 사람은 말을 내기 전에 내면에서 다스린다는 뜻입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν στόματι
