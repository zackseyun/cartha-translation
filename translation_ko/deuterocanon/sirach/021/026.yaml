  - ‘지혜로운 사람의 입에는 그들의 마음이 있다’로 평행을 매끈하게 재배열하기
  rationale: 시락 21:26의 핵심은 짧고 날카로운 대구법이며, 원문의 도치와 긴장을 보존해야 문장의 교훈성이 약화되지 않습니다.
  doctrine_reference: 지혜문학의 수사적 평행법 보존
