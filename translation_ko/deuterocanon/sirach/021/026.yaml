theological_decisions:
- issue: 원문의 역설적·대구법적 구조를 한국어에서 얼마나 직역할 것인가
  chosen_reading: ‘미련한 사람의 입에는 그들의 마음이 있고, 지혜로운 사람의 마음은 그들의 입에 있습니다’라고 옮겨, 반대 배열을 드러냈습니다.
