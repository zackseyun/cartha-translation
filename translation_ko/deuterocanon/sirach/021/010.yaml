  yaml_path: translation/deuterocanon/sirach/021/010.yaml
  text: The way of sinners is paved with stones[b][a], and at its end is the pit of Hades.
  footnotes:
  - marker: a
    text: Or "is made smooth with stones." The Greek participle can emphasize a road made even or leveled; "paved with stones" brings out the likely roadway image.
    reason: lexical_alternative
  - marker: b
    text: '"Hades" here refers to the realm of the dead; alternatively, "the grave" or "the underworld."'
    reason: alternative_reading
translation:
  language: ko
  text: 죄인들의 길은 돌로 포장되어 있고[a], 그 끝에는 하데스의 구덩이가 있습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘돌로 매끄럽게 되어 있습니다.’ 그리스어 분사는 길이 고르게 다져졌다는 뜻을 강조할 수 있으며, 문맥상 도로를 포장한 이미지를 살려 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘하데스’는 여기서 죽은 자들의 영역을 가리킵니다. 달리 ‘무덤’이나 ‘저승’으로도 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁδὸς
  english_pob_choice: way
  chosen_korean: 길
  alternatives_korean:
  - 방식
  - 도로
  lexicon: BDAG
  rationale: 비유적 의미의 삶의 길을 살리면서도 뒤의 돌 포장 이미지를 자연스럽게 받쳐 주기 위해 ‘길’로 옮겼습니다.
- source_word: ἁμαρτωλῶν
  english_pob_choice: of sinners
  chosen_korean: 죄인들의
  alternatives_korean:
  - 죄 많은 사람들의
  - 죄악한 자들의
  lexicon: BDAG
  rationale: 도덕적 범주를 분명히 드러내는 직접적 표현으로 ‘죄인들’이 가장 간결하고 원문에 가깝습니다.
- source_word: ὡμαλισμένη ἐκ λίθων
  english_pob_choice: is paved with stones
  chosen_korean: 돌로 포장되어 있고
  alternatives_korean:
  - 돌로 평평하게 되어 있고
  - 돌로 깔려 있고
  lexicon: LSJ
  rationale: ‘고르게/매끄럽게’의 의미를 살리되, 문맥상 길이 석재로 다져진 이미지를 현대 한국어에서 가장 자연스럽게 드러내는 표현입니다.
- source_word: βόθρος ᾅδου
  english_pob_choice: the pit of Hades
  chosen_korean: 하데스의 구덩이
  alternatives_korean:
  - 하데스의 웅덩이
  - 음부의 구덩이
  - 무덤의 구덩이
  lexicon: BDAG
  rationale: ᾅδης를 ‘하데스’로 유지해 사망자의 영역이라는 Septuagint적 배경을 보존했고, βόθρος는 파멸의 함정을 드러내는 기본 의미를 따라 ‘구덩이’로 옮겼습니다.
theological_decisions:
- issue: ᾅδου의 번역 범위
  chosen_reading: ‘하데스’로 음역해 사자의 영역을 직접 표기합니다.
  alternative_readings:
  - 무덤
  - 음부
  - 지옥
  rationale: 원문은 일반적 ‘무덤’보다 고유명사 ᾅδης를 사용하므로, 후대의 지옥 개념으로 좁히지 않고 LXX의 개념 세계를 보존하는 편이 더 충실합니다.
  doctrine_reference: '번역 원칙: 원어 우선, 후대 교리 범주를 본문에 앞세워 해석하지 않음.'
