    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ παιδευθήσεται
  english_pob_choice: will not be instructed
  chosen_korean: 훈계받지 못합니다
  alternatives_korean:
  - 가르침을 받지 못합니다
  - 훈련받지 못합니다
  - 교훈을 받지 못합니다
  lexicon: BDAG
  rationale: παιδεύω의 미래 수동은 교육·훈련·징계·교훈을 모두 포괄할 수 있으므로, 지혜문맥에서 교정적 가르침의 거부를 자연스럽게 살리는 ‘훈계받다’가 가장 균형적입니다.
- source_word: ὃς
  english_pob_choice: He who
  chosen_korean: …자는
  alternatives_korean:
  - 누구든지 …하는 자는
  - …하는 사람은
  lexicon: LSJ
  rationale: 일반적 인간을 가리키는 관계절이므로, 현대 한국어에서는 ‘…자는’ 구조가 간결하면서도 대표성 있는 남성형 일반표현의 기능을 잘 전달합니다.
- source_word: πανοῦργος
  english_pob_choice: shrewd
  chosen_korean: 지혜롭지 못한
  alternatives_korean:
  - 영리하지 못한
  - 간교하지 못한
  - 신중하지 못한
  - 재빠르지 못한
  lexicon: LSJ
  rationale: 이 단어는 문맥에 따라 부정적 ‘간교한’도 가능하지만, 여기서는 교훈을 받아들이는 능력과 연결되므로, POB의 ‘shrewd’처럼 실용적 판단력의 부재를 드러내는 방향으로 옮겼습니다.
theological_decisions:
- issue: πανοῦργος의 도덕적 뉘앙스
  chosen_reading: 부정적 ‘간교함’보다는, 지혜를 받아들일 만큼의 실용적 통찰이 없는 상태로 읽었습니다.
  alternative_readings:
  - 간교하지 않은 자는 훈계받지 못합니다
  - 영리하지 못한 자는 훈계받지 못합니다
  rationale: 본문은 지혜의 격언으로서 학습 가능성과 분별력을 말하므로, ‘간교함’으로 강하게 악덕화하면 ‘배우려면 악인이어야 한다’는 인상을 줄 수 있습니다. 따라서 중립-긍정적 뉘앙스를 유지하되, 문맥상 필요한 날카로움은 보존했습니다.
  doctrine_reference: Translation philosophy §§1, 5, 6
