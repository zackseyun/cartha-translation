translation:
  language: ko
  text: 자녀여, 죄를 지었습니까? 다시는 죄를 짓지 말고, 이전에 지은 죄들에 관하여 기도하십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 절에 제시된 히브리어 행은 Sirach 21:1과 맞지 않는 다른 행이므로, 본문은 그리스어 증거를 따릅니다.
    reason: textual_variant
lexical_decisions:
- source_word: Τέκνον
  english_pob_choice: Child
  chosen_korean: 아들아
  alternatives_korean:
  - 자녀야
  - 내 아들아
  - 얘야
  lexicon: BDAG
  rationale: 호격의 친밀한 직접 부름을 살리되, 문맥상 권면과 교훈의 어조를 자연스럽게 드러내기 위해 한국어에서는 자연스러운 호칭으로 옮겼습니다. 다만 성별을 덧붙이지 않는 '자녀야'도 가능하므로 본문은 더 구어적이고 직접적인 '아들아'로 처리했습니다.
- source_word: ἥμαρτες
  english_pob_choice: have you sinned
  chosen_korean: 죄를 지었습니까
  alternatives_korean:
  - 죄를 범했습니까
  - 죄를 지었나요
  - 죄를 지었습니까요
  lexicon: BDAG
  rationale: 직접 질문의 도덕적·종교적 의미를 살리면서 현대 한국어에서 자연스러운 표현으로 옮겼습니다. '죄를 범했습니까'도 가능하지만 다소 문어적입니다.
- source_word: μὴ προσθῇς μηκέτι
  english_pob_choice: Do so no more
  chosen_korean: 더는 그렇게 하지 말고
  alternatives_korean:
  - 더 이상 하지 마십시오
  - 더 보태지 마십시오
  - 그 일을 더하지 마십시오
  lexicon: BDAG
  rationale: 직역하면 '더하지 말라'는 뜻이지만, 한국어에서는 반복 금지를 뜻하는 관용적 표현으로 풀어야 의미가 분명합니다. 본문은 행위의 반복 중단을 가장 직접적으로 전달합니다.
- source_word: περὶ τῶν προτέρων σου
  english_pob_choice: concerning your former sins
  chosen_korean: 이전의 죄들에 관해
  alternatives_korean:
  - 옛 죄들에 관해
  - 이전에 지은 죄에 대해
  - 지난 죄들에 대하여
  lexicon: BDAG
  rationale: 본문의 '이전의 것들'은 앞선 문맥의 죄를 가리키므로, 영어 POB의 해석을 따라 한국어에서도 '죄들'을 보충해 뜻을 분명히 했습니다.
- source_word: δεήθητι
  english_pob_choice: pray
  chosen_korean: 기도하십시오
  alternatives_korean:
  - 간구하십시오
  - 빌십시오
  - 탄원하십시오
  lexicon: BDAG
  rationale: 권면문맥에서 현대 합쇼체에 가장 자연스럽고, 종교적 행위를 정확히 가리키는 표현을 선택했습니다. '간구하십시오'는 더 형식적이지만 일반 독자 가독성은 떨어집니다.
theological_decisions:
- issue: 히브리어와 그리스어 본문 불일치에 따른 본문 선택
  chosen_reading: 이 절은 히브리어의 불일치가 문서상 명시되어 있으므로, 사본 전승이 맞물리는 그리스어 본문을 따라 번역했습니다.
  alternative_readings:
  - 히브리어에 맞춰 '세 가지를 미워했고, 네 가지를 사랑하지 않았다'로 옮김
  - 불일치를 본문에 반영하지 않고 영어 POB만 따라 감
  rationale: 제시된 히브리어는 이 절과 맞지 않는 다른 행으로 표시되어 있으며, 문맥상 그리스어가 Sirach 21:1의 실제 본문을 제공합니다. 번역은 절 번호에 맞는 원문 증거를 우선해야 하므로 그리스어를 기준으로 했습니다.
  doctrine_reference: 'PHILOSOPHY.md: deuterocanonical books should be translated from the most-reliable original witness available, while preserving textual uncertainty honestly.'
