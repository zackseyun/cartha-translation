- source_word: ὡς
  english_pob_choice: like
  chosen_korean: ~와 같습니다
  alternatives_korean:
  - ~처럼
  - ~같이
  lexicon: LSJ
  rationale: 비유를 여는 ὡς를 한국어의 자연스러운 비교 표현으로 옮겨, 경구체의 힘을 유지했습니다.
- source_word: ῥομφαία δίστομος
  english_pob_choice: a two-edged sword
  chosen_korean: 양날의 칼
  alternatives_korean:
  - 두 날의 칼
  - 두 날 칼
  lexicon: LSJ
  rationale: δίστομος의 두 날 이미지를 살리되, 현대 한국어에서 가장 즉각적으로 전달되는 관용적 표현을 택했습니다.
- source_word: πᾶσα ἀνομία
  english_pob_choice: all lawlessness
  chosen_korean: 모든 불법
  alternatives_korean:
  - 모든 무법
  - 모든 죄악
  - 모든 악행
  lexicon: BDAG
  rationale: ἀνομία의 핵심인 율법/질서의 위반을 살려 ‘불법’으로 옮겼고, πᾶσα는 ‘모든’으로 반영했습니다.
- source_word: τῇ πληγῇ αὐτῆς
  english_pob_choice: for its wound
  chosen_korean: 그 상처에는
  alternatives_korean:
  - 그 상처로는
  - 그 타격에는
  - 그 상처에
  lexicon: LSJ
  rationale: πληγή는 ‘타격’도 가능하지만, 뒤의 ἴασις(치유)와의 대응을 고려해 결과로 남는 ‘상처’로 구체화했습니다.
- source_word: οὐκ ἔστιν ἴασις
  english_pob_choice: there is no healing
  chosen_korean: 치유가 없습니다
  alternatives_korean:
  - 낫는 길이 없습니다
  - 회복이 없습니다
  - 치료가 없습니다
  lexicon: LSJ
  rationale: ἴασις의 의미를 살려 ‘치유’로 옮기고, 문장 전체의 단정적 경고를 자연스럽게 전달했습니다.
theological_decisions:
- issue: ἀνομία의 윤리적·법적 뉘앙스
  chosen_reading: ‘불법’으로 옮겨 단순한 도덕적 악보다 법/질서의 위반이라는 날카로운 의미를 드러냈습니다.
  alternative_readings:
  - ‘악행’으로 완화하는 번역
  - ‘불의’로 일반화하는 번역
  rationale: 본문은 악의 일반론이 아니라 질서와 규범을 어기는 상태를 지적하므로, 더 직접적인 법적 어휘가 원문의 긴장을 잘 보존합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 5
