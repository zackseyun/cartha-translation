translation:
  language: ko
  text: 사람이 문간에서 엿듣는 것은 무절제함입니다. 그러나 분별 있는 사람은 수치로 인해 무거워질 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘문에서 듣다’이며, 여기서는 남의 말을 몰래 듣는다는 함의를 지닙니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπαιδευσία
  english_pob_choice: lack of discipline
  chosen_korean: 무절제함
  alternatives_korean:
  - 훈련 부족
  - 무례함
  - 교양 없음
  lexicon: LSJ
  rationale: 교육·훈련의 결핍에서 비롯된 부적절한 행동이라는 뜻을 살려, 도덕적·사회적 어감을 지닌 ‘무절제함’으로 옮겼습니다.
- source_word: ἀκροᾶσθαι παρὰ θύραν
  english_pob_choice: to listen at a door
  chosen_korean: 문간에서 엿듣는 것
  alternatives_korean:
  - 문 옆에서 듣는 것
  - 문가에서 듣는 것
  lexicon: LSJ
  rationale: 직역하면 ‘문에서/문가에서 듣다’이지만, 문맥상 남의 말을 몰래 듣는 행위를 가리키므로 한국어에서는 관용적으로 ‘엿듣다’로 풀어 소스의 함의를 드러냈습니다.
- source_word: φρόνιμος
  english_pob_choice: prudent man
  chosen_korean: 분별 있는 사람
  alternatives_korean:
  - 지혜로운 사람
  - 신중한 사람
  lexicon: LSJ
  rationale: 실천적 판단력과 분별을 강조하는 말이므로, 단순한 지적 능력보다 태도와 판단을 함께 드러내는 ‘분별 있는 사람’이 적절합니다.
- source_word: βαρυνθήσεται ἀτιμίᾳ
  english_pob_choice: will be burdened by disgrace
  chosen_korean: 수치로 인해 무거워질 것입니다
  alternatives_korean:
  - 수치로 인해 부담을 질 것입니다
  - 수치로 인해 짐을 지게 될 것입니다
  lexicon: LSJ
  rationale: ‘무거워지다’는 βαρυνθήσεται의 중량 이미지를 살리고, ἀτιμίᾳ는 사회적 수치·불명예를 뜻하므로 자연스러운 한국어로 옮겼습니다.
theological_decisions:
- issue: 후반절의 감정·평가 표현을 어떻게 처리할지
  chosen_reading: ‘수치로 인해 무거워질 것입니다’로 옮겨, 단순한 감정상태보다 불명예가 사람을 짓누르는 이미지를 살렸습니다.
  alternative_readings:
  - ‘불명예 때문에 괴로워할 것입니다’
  - ‘수치에 눌릴 것입니다’
  rationale: 본문의 동사와 명사가 함께 만드는 무게감 이미지를 유지하는 것이 핵심이므로, 도덕적 수치가 주는 압박을 가능한 한 직접적으로 반영했습니다.
  doctrine_reference: 잠언적 지혜문학의 사회적 수치 개념
