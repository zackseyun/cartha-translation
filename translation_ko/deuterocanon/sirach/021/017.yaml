  verdict: revise
  source_fidelity: 첫 절의 ζητηθήσεται는 ‘찾아질 것이다/찾음을 받을 것이다’라는 미래 수동입니다. 초안의 ‘찾게 될 것이며’는 한국어에서 ‘(누군가가) 찾게 될 것’이라는 능동적 의미로 읽힐 수 있으므로 수동을 분명히 해야 합니다. 나머지 표현은 원문의 구체적 비유(‘입’), 공동체적 배경(ἐκκλησίᾳ), 그리고 마음속의 숙고를 충실히 반영합니다.
  naturalness: ‘지혜로운 이의 입’은 원문의 비유를 보존하면서 한국어에서도 이해 가능합니다. ‘회중에서 찾아질 것이며’는 다소 문어적이지만 지혜문학의 격식 있는 문체에 알맞고, 수동 의미를 정확히 드러냅니다. ‘마음속에서 곰곰이 생각할 것입니다’도 현대 표준어 합쇼체로 자연스럽습니다.
  terminology: ‘회중’은 이 지혜문학 문맥의 ἐκκλησία를 후대 제도 교회로 한정하지 않아 적절합니다. ‘지혜로운 이’와 ‘마음’도 원문의 의미 범위를 무리 없이 보존합니다. 각주 b는 그리스어 καρδίᾳ가 단수이고 소유 대명사가 없다는 점을 정확히 밝혀야 합니다.
  issues:
  - severity: medium
    issue: ‘찾게 될 것이며’가 ζητηθήσεται의 수동태를 충분히 나타내지 못함
    rationale: 한국어의 ‘-게 되다’는 보통 주체가 어떤 행위를 하게 됨을 뜻하므로, ‘지혜로운 이의 입’이 찾는 주체처럼 읽히거나 행위자가 불분명해질 수 있습니다. ‘찾아질 것이며’로 고치면 원문의 미래 수동을 보존합니다.
  - severity: low
    issue: 각주 a도 본문의 수동 수정에 맞추어 조정 필요
    rationale: 본문을 ‘찾아질 것입니다’로 고친 뒤 각주에는 기존의 ‘찾게 될 것입니다’가 남아 있으면 동일한 문법적 불명확성이 반복됩니다.
  - severity: low
    issue: 각주 b의 원문 설명을 더 정확히 할 필요
    rationale: ἐν καρδίᾳ는 직역하면 ‘마음에/마음 안에’이며 καρδίᾳ는 단수이고 소유 대명사가 명시되어 있지 않습니다. ‘복수를 드러내지 않았다’는 설명만으로는 이 문법적 사실이 충분히 전달되지 않습니다.
  revised_text: 지혜로운 이의 입은 회중에서 찾아질 것이며, 그들은 그의 말을 마음속에서 곰곰이 생각할 것입니다.[a][b]
