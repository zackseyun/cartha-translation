  text: The mouth of a wise man will be sought in the assembly[b][a], and they will ponder his words in their hearts.
  footnotes:
  - marker: a
    text: Or 'will be sought after in the congregation.'
    reason: lexical_alternative
  - marker: b
    text: 'Greek ''in heart''; the English supplies ''their'' for natural sense: the community inwardly reflects on what the wise man says.'
    reason: lexical_alternative
translation:
  language: ko
  text: 지혜로운 이의 입은 회중에서 찾아질 것이며, 그들은 그의 말을 마음속에서 곰곰이 생각할 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘회중 가운데서 찾아질 것입니다.’
    reason: lexical_alternative
  - marker: b
    text: 그리스어는 ‘마음에’(단수)라고 하며 소유 대명사를 명시하지 않습니다. 한국어에서는 자연스러운 의미를 위해 ‘마음속에서’라고 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: στόμα
  english_pob_choice: mouth
  chosen_korean: 입
  alternatives_korean:
  - 말
  - 입술
  lexicon: LSJ
  rationale: 그리스어의 구체적 이미지를 살리되, 한국어에서는 ‘입’이 화자의 말과 발화를 자연스럽게 가리키는 가장 직접적인 표현입니다.
- source_word: φρονίμου
  english_pob_choice: of a wise man
  chosen_korean: 지혜로운 이의
  alternatives_korean:
  - 현명한 사람의
  - 신중한 이의
  lexicon: LSJ
  rationale: φρόνιμος는 단순한 지식보다 분별과 지혜를 가리키므로 ‘지혜로운’이 가장 자연스럽고, 성별을 고정하는 ‘남자’는 한국어 본문에서 불필요한 제약이어서 피했습니다.
- source_word: ζητηθήσεται
  english_pob_choice: will be sought
  chosen_korean: 찾게 될 것이며
  alternatives_korean:
  - 찾아질 것이며
  - 구하게 될 것이며
  lexicon: LSJ
  rationale: 수동 미래의 의미를 살려 공동체가 그 입과 말을 가치 있게 여겨 찾는다는 뜻을 자연스럽게 옮겼습니다.
- source_word: ἐν ἐκκλησίᾳ
  english_pob_choice: in the assembly
  chosen_korean: 회중에서
  alternatives_korean:
  - 모임에서
  - 집회에서
  - 교회에서
  lexicon: LSJ
  rationale: 시락의 ἐκκλησία는 후대 제도교회보다 모인 공동체를 뜻하므로, POB의 ‘assembly’ 취지를 따라 ‘회중’으로 옮겼습니다.
- source_word: διανοηθήσεται
  english_pob_choice: will ponder
  chosen_korean: 곰곰이 생각할 것입니다
  alternatives_korean:
  - 숙고할 것입니다
  - 되새길 것입니다
  lexicon: LSJ
  rationale: 내면적이고 반성적인 ‘생각함’을 살리되, 한국어에서 가장 자연스럽게 읽히는 표현으로 옮겼습니다.
- source_word: ἐν καρδίᾳ
  english_pob_choice: in their hearts
  chosen_korean: 마음속에서
  alternatives_korean:
  - 마음에
  - 속으로
  lexicon: LSJ
  rationale: 그리스어의 ‘마음/심장’ 중심의 내적 숙고를 살리면서, 한국어에서 복수 대명사를 무리하게 드러내지 않고 자연스럽게 표현했습니다.
theological_decisions:
- issue: ἐκκλησία의 공동체적 범위
  chosen_reading: 회중
  alternative_readings:
  - 교회
  - 회합
  rationale: 이 문맥은 지혜문학적 공동체 장면이므로, 후대 교회 제도를 연상시키는 ‘교회’보다 모인 공동체 자체를 드러내는 ‘회중’이 원문 의도에 더 가깝습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1
- issue: ‘마음’의 내적 숙고 표현
  chosen_reading: 마음속에서 곰곰이 생각할 것입니다
  alternative_readings:
  - 마음에 새길 것입니다
  - 마음으로 헤아릴 것입니다
  rationale: 원문의 ἐν καρδίᾳ는 단순 감정이 아니라 내면적 숙고를 뜻하므로, 공동체가 그의 말을 속으로 깊이 되새긴다는 의미를 살렸습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 2
