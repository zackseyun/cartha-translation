  lexicon: LSJ
  rationale: 앞선 말을 기반으로 추가적인 통찰을 더한다는 뜻을 자연스럽게 드러내되, 원문의 여지를 남기기 위해 직역보다 유연하게 옮겼습니다.
- source_word: ὁ σπαταλῶν
  english_pob_choice: a wasteful man
  chosen_korean: 낭비하는 사람
  alternatives_korean:
  - 방탕한 사람
  - 사치하는 사람
  - 허비하는 사람
  lexicon: LSJ
  rationale: σπαταλάω의 핵심인 낭비·탕진의 이미지를 한국어에서 가장 중립적으로 전달하는 표현을 선택했습니다.
- source_word: ἀπῄρεσεν αὐτῷ
  english_pob_choice: was displeased with it / rejected it
  chosen_korean: 못마땅해하며
  alternatives_korean:
  - 거절하며
  - 불쾌해하며
  - 마음에 들지 않아하며
  lexicon: LSJ
  rationale: 이 동사는 문맥상 단순한 ‘거절’보다 듣고 난 뒤의 부정적 반응을 가리키므로, 관계적 뉘앙스를 살려 ‘못마땅해하며’로 옮겼습니다.
- source_word: ἀπέστρεψεν αὐτοῦ ὀπίσω τοῦ νώτου αὐτοῦ
  english_pob_choice: he cast it behind his back
  chosen_korean: 자기 등 뒤로 던져 버릴 것입니다
  alternatives_korean:
  - 자기 등 뒤로 내던질 것입니다
  - 자기 뒤로 제쳐 둘 것입니다
  - 자기 등 뒤로 밀어 버릴 것입니다
  lexicon: LSJ
  rationale: 지혜의 말을 의도적으로 무시하는 몸짓을 살리기 위해, 단순한 ‘뒤로 두다’보다 강한 ‘던져 버리다’로 옮겼습니다.
