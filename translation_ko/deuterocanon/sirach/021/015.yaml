base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/021/015.yaml
  text: If an intelligent man hears a wise word[a], he will praise it and add to it; a wasteful man heard it and rejected it[c][b], and he cast it behind his back.
  footnotes:
  - marker: a
    text: Or 'a wise saying.' The Greek λόγον σοφόν can refer to a wise utterance more broadly than a single word.
    reason: lexical_alternative
  - marker: b
    text: The expression 'add to it' likely means to build on the wise saying by contributing further insight.
    reason: lexical_alternative
  - marker: c
    text: The Greek for 'was displeased with it' is difficult; the sense in context is that he reacted negatively and dismissed what he heard.
    reason: alternative_reading
translation:
  language: ko
  text: 지혜로운 말을 들으면 총명한 사람은 그것을 칭찬하고 더 보탤 것입니다. 낭비하는 사람은 그것을 들었으나 못마땅해하며 자기 등 뒤로 던져 버릴 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘지혜로운 말’은 단일한 낱말이라기보다 지혜가 담긴 발화 전체를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘더 보탤 것입니다’는 그 말에 추가적인 통찰이나 내용을 덧붙인다는 뜻으로 이해할 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ἀπῄρεσεν αὐτῷ는 문맥상 단순한 거절보다, 들은 것에 대해 못마땅해하고 받아들이지 않는 반응을 가리키는 것으로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: λόγον σοφὸν
  english_pob_choice: a wise word
  chosen_korean: 지혜로운 말
  alternatives_korean:
  - 지혜로운 말씀
  - 지혜로운 한마디
  - 지혜로운 말 한마디
  lexicon: LSJ
  rationale: λόγος σοφός는 단일 어휘보다 지혜가 담긴 발화 전체를 가리킬 수 있어, ‘말’로 옮겨 간결함과 의미 범위를 함께 살렸습니다.
- source_word: ἐπιστήμων
  english_pob_choice: an intelligent man
  chosen_korean: 총명한 사람
  alternatives_korean:
  - 지적인 사람
  - 이해하는 사람
  - 지식 있는 사람
  lexicon: LSJ
  rationale: 지혜로운 말을 알아듣는 대조를 살리기 위해 이해력과 분별력을 함께 드러내는 ‘총명한 사람’을 택했습니다.
- source_word: ἐπʼ αὐτὸν προσθήσει
  english_pob_choice: he will add to it
  chosen_korean: 더 보탤 것입니다
  alternatives_korean:
  - 거기에 덧붙일 것입니다
  - 그것을 바탕으로 더할 것입니다
  - 거기에 더 보탤 것입니다
  lexicon: LSJ
  rationale: 앞선 말을 기반으로 추가적인 통찰을 더한다는 뜻을 자연스럽게 드러내되, 원문의 여지를 남기기 위해 직역보다 유연하게 옮겼습니다.
- source_word: ὁ σπαταλῶν
  english_pob_choice: a wasteful man
  chosen_korean: 낭비하는 사람
  alternatives_korean:
  - 방탕한 사람
  - 사치하는 사람
  - 허비하는 사람
  lexicon: LSJ
  rationale: σπαταλάω의 핵심인 낭비·탕진의 이미지를 한국어에서 가장 중립적으로 전달하는 표현을 선택했습니다.
- source_word: ἀπῄρεσεν αὐτῷ
  english_pob_choice: was displeased with it / rejected it
  chosen_korean: 못마땅해하며
  alternatives_korean:
  - 거절하며
  - 불쾌해하며
  - 마음에 들지 않아하며
  lexicon: LSJ
  rationale: 이 동사는 문맥상 단순한 ‘거절’보다 듣고 난 뒤의 부정적 반응을 가리키므로, 관계적 뉘앙스를 살려 ‘못마땅해하며’로 옮겼습니다.
- source_word: ἀπέστρεψεν αὐτοῦ ὀπίσω τοῦ νώτου αὐτοῦ
  english_pob_choice: he cast it behind his back
  chosen_korean: 자기 등 뒤로 던져 버릴 것입니다
  alternatives_korean:
  - 자기 등 뒤로 내던질 것입니다
  - 자기 뒤로 제쳐 둘 것입니다
  - 자기 등 뒤로 밀어 버릴 것입니다
  lexicon: LSJ
  rationale: 지혜의 말을 의도적으로 무시하는 몸짓을 살리기 위해, 단순한 ‘뒤로 두다’보다 강한 ‘던져 버리다’로 옮겼습니다.
theological_decisions:
- issue: 집합적 잠언에서의 대표 남성 단수
  chosen_reading: ‘총명한 사람’과 ‘낭비하는 사람’으로 옮기되, 동사는 단수 미래형으로 유지했습니다.
  alternative_readings:
  - ‘총명한 이는 …’
  - ‘사람은 …’
  rationale: 그리스어는 남성 단수 형태를 대표적으로 사용하므로, 성별을 희석하지 않으면서도 한국어에서는 자연스럽게 읽히도록 처리했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
