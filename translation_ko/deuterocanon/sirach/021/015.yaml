base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/021/015.yaml
  text: If an intelligent man hears a wise word[a], he will praise it and add to it; a wasteful man heard it and rejected it[c][b], and he cast it behind his back.
  footnotes:
  - marker: a
    text: Or 'a wise saying.' The Greek λόγον σοφόν can refer to a wise utterance more broadly than a single word.
    reason: lexical_alternative
  - marker: b
    text: The expression 'add to it' likely means to build on the wise saying by contributing further insight.
    reason: lexical_alternative
  - marker: c
    text: The Greek for 'was displeased with it' is difficult; the sense in context is that he reacted negatively and dismissed what he heard.
    reason: alternative_reading
translation:
  language: ko
  text: 총명한 사람은 지혜로운 말[a]을 들으면 그것을 칭찬하고 더 보탤 것입니다[b]. 낭비하는 사람은 그것을 들었으나 못마땅하게 여기고[c] 자기 등 뒤로 던져 버렸습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘지혜로운 말’은 단일한 낱말이라기보다 지혜가 담긴 발화 전체를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘더 보탤 것입니다’는 그 말에 추가적인 통찰이나 내용을 덧붙인다는 뜻으로 이해할 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ἀπῄρεσεν αὐτῷ는 문맥상 단순한 거절보다, 들은 것에 대해 못마땅해하고 받아들이지 않는 반응을 가리키는 것으로 보입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: λόγον σοφὸν
  english_pob_choice: a wise word
  chosen_korean: 지혜로운 말
  alternatives_korean:
