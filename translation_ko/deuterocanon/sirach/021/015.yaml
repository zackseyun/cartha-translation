  lexicon: LSJ
  rationale: 지혜로운 말을 알아듣는 대조를 살리기 위해 이해력과 분별력을 함께 드러내는 ‘총명한 사람’을 택했습니다.
- source_word: ἐπʼ αὐτὸν προσθήσει
  english_pob_choice: he will add to it
  chosen_korean: 더 보탤 것입니다
  alternatives_korean:
  - 거기에 덧붙일 것입니다
