  source_fidelity: 첫 절의 조건절과 미래형은 잘 반영되었습니다. 그러나 둘째 절의 ἤκουσεν, ἀπῄρεσεν, ἀπέστρεψεν은 모두 부정과거형이므로, 마지막 동사를 미래형(‘던져 버릴 것입니다’)으로 옮긴 것은 시제를 일관되게 반영하지 못합니다. ἀπῄρεσεν αὐτῷ의 난해성과 문맥상 부정적 반응이라는 의미는 ‘못마땅하게 여기고’로 절제하여 반영할 수 있습니다.
  naturalness: ‘총명한 사람은 지혜로운 말을 들으면’의 어순이 더 자연스럽고, 각 주석 표지를 해당 표현 바로 뒤에 배치하면 독자가 주석의 대상을 분명히 알 수 있습니다. 합쇼체의 잠언 문체도 유지됩니다.
