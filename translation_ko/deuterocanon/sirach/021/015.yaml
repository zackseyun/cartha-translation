  rationale: λόγος σοφός는 단일 어휘보다 지혜가 담긴 발화 전체를 가리킬 수 있어, ‘말’로 옮겨 간결함과 의미 범위를 함께 살렸습니다.
- source_word: ἐπιστήμων
  english_pob_choice: an intelligent man
  chosen_korean: 총명한 사람
