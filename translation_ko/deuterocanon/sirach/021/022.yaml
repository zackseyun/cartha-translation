translation:
  language: ko
  text: 어리석은 자의 발은 집으로 서두르지만, 계책을 지닌 사람은 많은 이들[b] 앞에서 몸을 낮춥니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 헬라어 병행본문은 “지극히 경험 많은 사람은 어떤 이의 면전에서 부끄러워할 것입니다”로 읽습니다. 둘째 행은 히브리어 본문과 상당히 다릅니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어 ‘많은 이들’은 문맥에 따라 ‘유력한 이들’ 또는 ‘큰 자들’로 이해될 수도 있습니다.
    reason: lexical_ambiguity
lexical_decisions:
- source_word: רֶגֶל נָבָל
  english_pob_choice: A fool’s foot
  chosen_korean: 어리석은 자의 발
  alternatives_korean:
  - 어리석은 자의 발걸음
  - 미련한 자의 발
  lexicon: HALOT
  rationale: 히브리어의 단수 이미지와 POB의 ‘foot’을 살려 직역에 가깝게 두었습니다. ‘어리석은 자’는 지혜문학의 נָבָל을 자연스럽게 옮깁니다.
- source_word: מִהֲרָה
  english_pob_choice: hurries
  chosen_korean: 서두르지만
  alternatives_korean:
  - 급히 갑니다
  - 재촉하여 갑니다
  lexicon: HALOT
  rationale: 행동의 경솔한 속도를 살리면서 현대 한국어 문장 흐름에 맞게 옮겼습니다.
- source_word: אֶל בָּיִת
  english_pob_choice: to a house
  chosen_korean: 집으로
  alternatives_korean:
  - 어느 집으로
  - 한 집으로
  lexicon: HALOT
  rationale: 히브리어의 비한정성을 유지하면서도 한국어 속담체에서는 목적지를 자연스럽게 드러내는 ‘집으로’가 가장 간결합니다.
- source_word: מְזִימוֹת
  english_pob_choice: of schemes
  chosen_korean: 음모를 꾸미는 사람은
  alternatives_korean:
  - 계획이 많은 사람은
  - 꾀가 많은 사람은
  lexicon: HALOT
  rationale: 히브리어 명사 자체는 ‘계획/음모’의 뜻을 가지며, 문맥상 인물을 수식하는 표현으로 읽히므로 동작적 풀이를 붙여 한국어에서 의미를 선명하게 했습니다. POB가 Hebrew를 우선해 ‘schemes’ 쪽을 택한 점을 반영했습니다.
- source_word: יַכְנִיעַ
  english_pob_choice: bows low / humbles himself
  chosen_korean: 몸을 낮춥니다
  alternatives_korean:
  - 자기를 낮춥니다
  - 겸손히 굽힙니다
  lexicon: HALOT
  rationale: 히브리어 히필의 ‘낮추다/겸비하다’ 의미를 반영해, 물리적·사회적 굴복의 뉘앙스를 살리는 ‘몸을 낮추다’를 택했습니다. POB의 수정 판단도 이 방향과 일치합니다.
- source_word: לָרַבִּים
  english_pob_choice: before the great
  chosen_korean: 큰 사람들 앞에서
  alternatives_korean:
  - 많은 사람들 앞에서
  - 권세 있는 이들 앞에서
  lexicon: HALOT
  rationale: רַבִּים은 ‘많은 사람들’과 ‘큰 자들/유력자들’ 사이의 범위를 가지며, 여기서는 사회적 위계 앞의 굴복이 핵심이므로 ‘큰 사람들’로 옮겼습니다.
theological_decisions:
- issue: 히브리어 본문과 헬라어 병행본문의 차이 처리
  chosen_reading: 본문은 보존된 히브리어를 따라 번역하되, 둘째 행의 사회적 굴복 이미지를 살렸습니다.
  alternative_readings:
  - ‘경험 많은 사람은 얼굴/존재 앞에서 부끄러워할 것입니다’
  rationale: 시라크는 현존 히브리어가 있을 때 이를 우선하는 프로젝트 원칙을 따릅니다. 여기서는 첫 행은 히브리어와 헬라어가 대체로 일치하지만, 둘째 행은 의미가 크게 달라서 헬라어 의미를 본문에 섞기보다 주석에서만 보존하는 편이 투명합니다.
  doctrine_reference: 'PHILOSOPHY.md: translate from Hebrew where it survives; preserve source uncertainty honestly'
