lexical_decisions:
- source_word: γνῶσις
  english_pob_choice: knowledge
  chosen_korean: 지식
  alternatives_korean:
  - 앎
  - 이해
  - 분별
  lexicon: LSJ
  rationale: γνῶσις의 기본 의미를 살려 ‘지식’으로 옮겼습니다. 지혜 문맥이지만 여기서는 지식 자체가 불어나는 이미지를 분명히 드러내는 것이 적절합니다.
- source_word: σοφοῦ
  english_pob_choice: of a wise man
  chosen_korean: 지혜로운 사람의
  alternatives_korean:
  - 지혜로운 자의
  - 지혜로운 이의
  - 지혜로운 사람들의
  lexicon: LSJ
  rationale: 그리스어 단수 소유격을 반영해 단수 표현으로 유지했습니다. 영어 POB의 성별 정확성 원칙을 따라 집단명사화하지 않았습니다.
- source_word: ὡς κατακλυσμός
  english_pob_choice: like a flood
  chosen_korean: 홍수처럼
  alternatives_korean:
  - 범람처럼
  - 대홍수처럼
  - 홍수 같이
  lexicon: LSJ
  rationale: κατακλυσμός의 핵심 이미지를 자연스러운 현대 한국어로 살렸습니다. ‘홍수’가 가장 직접적이며 시각적 대비도 분명합니다.
- source_word: βουλή
  english_pob_choice: counsel
  chosen_korean: 조언
  alternatives_korean:
  - 권고
  - 계책
  - 의도
  lexicon: LSJ
  rationale: 여기서는 지혜로운 사람이 다른 이에게 주는 실천적 조언의 의미가 자연스럽습니다. ‘계책’보다 덜 음험하고 문맥에 맞습니다.
- source_word: πηγή ζωῆς
  english_pob_choice: a spring of life
  chosen_korean: 생명의 샘
  alternatives_korean:
  - 생명의 우물
  - 생명의 샘물
  - 생명의 원천
  lexicon: LSJ
  rationale: πηγή는 ‘샘’이 가장 직접적입니다. 영어 POB의 ‘spring of life’를 반영하면서도 한국어 성경체에 자연스럽게 맞췄습니다.
theological_decisions:
- issue: σοφοῦ의 단수성 유지 여부
  chosen_reading: 지혜로운 사람의
  alternative_readings:
  - 지혜로운 이들의
  - 지혜로운 자들의
  rationale: 본문은 단수형을 사용하므로 대표적 개인을 가리키는 단수로 유지했습니다. 일반화는 가능하지만 원문 형식을 약화시킬 수 있습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy, point 4
