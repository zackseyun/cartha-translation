  text: An assembly of the lawless is like a bundle of tow[a], and their end is a flame of fire.
  footnotes:
  - marker: a
    text: 'Or ''a gathering of the wicked is like tow gathered together.'' The Greek compresses the image: literally ''tow gathered together, an assembly of the lawless.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 법 없는 자들의 모임은 묶인 삼껍질섬유 한 다발[a]과 같고, 그들의 끝은 불꽃입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘악인들의 모임은 함께 모인 토우와 같습니다.’ 그리스어는 이미지를 압축해서 말하므로, 문자적으로는 ‘모인 토우, 곧 법 없는 자들의 모임’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: στιππύον
  english_pob_choice: tow
  chosen_korean: 삼껍질섬유
  alternatives_korean:
  - 삼짚
  - 섬유 찌꺼기
  - 인피섬유
  lexicon: LSJ
  rationale: 토우(tow)는 불에 잘 타는 섬유 찌꺼기를 가리키므로, 한국어로는 의미를 드러내면서도 재료의 성격을 보존하는 ‘삼껍질섬유’가 가장 근접합니다.
- source_word: συνηγμένον
  english_pob_choice: bundle
  chosen_korean: 묶인 … 한 다발
  alternatives_korean:
  - 모인
  - 한 무더기
  - 모아진
  lexicon: LSJ
  rationale: 분사형의 ‘모인/모아진’보다, POB의 이미지처럼 타기 위해 묶인 상태를 살리는 ‘묶인 … 한 다발’이 시각적 힘을 잘 전달합니다.
- source_word: συναγωγὴ ἀνόμων
  english_pob_choice: assembly of the lawless
  chosen_korean: 법 없는 자들의 모임
  alternatives_korean:
  - 불법한 자들의 회중
  - 악인들의 모임
  - 율법을 어기는 자들의 모임
  lexicon: LSJ
  rationale: συναγωγή는 단순한 군중이 아니라 ‘모임/집합’을 뜻하므로 ‘모임’을 살렸고, ἄνομος는 도덕적 일반어보다 법-질서의 부재를 드러내는 ‘법 없는 자들’이 더 직접적입니다.
- source_word: συντέλεια
  english_pob_choice: end
  chosen_korean: 끝
  alternatives_korean:
  - 종말
  - 결말
  - 마지막
  lexicon: LSJ
  rationale: 여기서는 집단의 최종 운명을 가리키므로, 종말론적 어감을 과도하게 덧씌우지 않는 ‘끝’이 간결하고 원문의 문맥에 맞습니다.
- source_word: φλὸξ πυρός
  english_pob_choice: a flame of fire
  chosen_korean: 불꽃
  alternatives_korean:
  - 불꽃의 불
  - 불길
  - 화염
  lexicon: LSJ
  rationale: ‘불의 불꽃’처럼 중복을 직역하기보다, 시적 대비를 유지하는 ‘불꽃’이 한국어에서 자연스럽고도 충분히 강한 이미지입니다.
theological_decisions:
- issue: ἀνόμων의 윤리적 뉘앙스를 ‘악한’으로 완화할지 여부
  chosen_reading: ‘법 없는 자들’로 직역해 법-질서의 위반성을 유지합니다.
  alternative_readings:
  - 악인들
  - 불의한 자들
  - 불법한 자들
  rationale: 본문은 단순한 성품 평가보다 ‘법 없음’이라는 범주를 사용하므로, 이를 유지해야 경고의 날카로움이 보존됩니다.
  doctrine_reference: translation philosophy §1, §5
- issue: 압축된 비유를 풀어 설명할지 여부
  chosen_reading: 원문의 짧고 강한 대조를 살려 최소한의 보충만 넣습니다.
  alternative_readings:
  - 법 없는 자들의 모임은 불붙기 쉬운 다발과 같습니다
  - 법 없는 자들의 집단은 불길에 던져질 섬유 다발과 같습니다
  rationale: 지혜문학의 이미지성을 살리려면 설명적 확대보다 직접적 비유가 적절합니다.
  doctrine_reference: translation philosophy §1, §6
