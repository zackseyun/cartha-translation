    reason: lexical_alternative
translation:
  language: ko
  text: 율법을 지키는 사람은 자신의 생각을 다스립니다.[a] 주님을 두려워하는 것의 완성은 지혜입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 마음을 다스린다’, ‘그의 의도를 붙든다’, ‘그의 이해를 보존한다’. 그리스어 표현은 압축되어 있으며, ἐννόημα는 생각, 의도, 이해를 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘주님을 두려워함의 완성은 지혜입니다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ φυλάσσων νόμον
  english_pob_choice: Whoever keeps the law
  chosen_korean: 율법을 지키는 사람
  alternatives_korean:
  - 율법을 지키는 자
  - 율법을 지키는 이
  lexicon: BDAG
  rationale: 분사구문은 일반적 의미를 지닌 표현이므로 한국어에서는 자연스러운 보편 주어로 풀었습니다. νόμον은 유대 지혜문맥의 규범적 율법을 가리키므로 ‘율법’이 적절합니다.
- source_word: κατακρατεῖ
  english_pob_choice: controls
  chosen_korean: 제어합니다
  alternatives_korean:
  - 다스립니다
  - 지배합니다
  - 장악합니다
  lexicon: BDAG
  rationale: ‘자기 생각을 제어하다’는 현대 한국어에서 자연스럽고, 내적 능력에 대한 통제라는 의미를 잘 살립니다. ‘지배하다/장악하다’는 지나치게 강하거나 어색할 수 있습니다.
- source_word: τοῦ ἐννοήματος αὐτοῦ
  english_pob_choice: his understanding
  chosen_korean: 자기의 생각
  alternatives_korean:
  - 자기의 이해
  - 자기의 의도
  - 자기의 마음
  lexicon: LSJ
  rationale: ἐννόημα는 생각, 의도, 이해를 아우를 수 있으므로, 지혜문학 문맥에서 ‘생각’이 가장 넓고 자연스럽게 내적 분별을 전달합니다. 소유격 αὐτοῦ는 ‘자기의’로 반영했습니다.
- source_word: συντέλεια
  english_pob_choice: the completion / the fulfillment
  chosen_korean: 완성
  alternatives_korean:
  - 완결
  - 성취
  - 완료
  lexicon: BDAG
  rationale: συντέλεια는 어떤 것이 제자리에 이르러 갖추어지는 완료의 의미를 가지므로, 종말론적 뉘앙스를 과도하게 넣지 않는 ‘완성’이 적절합니다.
theological_decisions:
- issue: ‘두려움’(φόβος)과 ‘주님’(Κυρίου)의 관계를 한국어에서 어떻게 유지할지
  chosen_reading: ‘주님을 두려워하는 것’으로 직역에 가깝게 유지했습니다.
  alternative_readings:
  - ‘주님을 경외하는 것’
  - ‘주님에 대한 경외’
  rationale: 지혜문학의 표준 표현이지만, 원문의 φόβος가 지닌 두려움과 경외의 긴장을 그대로 남기기 위해 ‘두려워하는 것’을 택했습니다. 필요하면 각주나 다른 본문에서 ‘경외’로 옮길 수 있으나, 이 절 자체에서는 긴장을 보존하는 편이 원문에 가깝습니다.
  doctrine_reference: Preserve theological tension rather than resolve it; consistency of key terms, or documented exception.
