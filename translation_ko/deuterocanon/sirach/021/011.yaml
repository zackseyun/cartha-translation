  text: 율법을 지키는 사람은 자기의 생각을 제어합니다. 주님을 두려워하는 것의 완성은 지혜입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 마음을 다스린다’, ‘그의 의도를 붙든다’, ‘그의 이해를 보존한다’. 그리스어 표현은 압축되어 있으며, ἐννόημα는 생각, 의도, 이해를 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘주님을 두려워하는 것의 완성은 지혜입니다’.
