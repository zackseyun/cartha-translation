  text: Whoever keeps the law controls his understanding[b][a], and the fulfillment of the fear of the Lord is wisdom.
  footnotes:
  - marker: a
    text: Or 'masters his mind,' 'holds fast to his intention,' or 'preserves his understanding.' The Greek phrase is compact, and ἐννόημα can mean thought, intention, or understanding.
    reason: lexical_alternative
  - marker: b
