  rationale: 지혜문학의 경구체를 살리면서도, 도덕적·실천적으로 분별 없는 사람이라는 뜻을 자연스럽게 드러내기 위해 ‘어리석은 자’로 옮겼습니다.
- source_word: ἐν γέλωτι
