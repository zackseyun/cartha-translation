  text: A fool raises his voice in laughter[a], but a shrewd man will scarcely smile quietly.
  footnotes:
  - marker: a
    text: Or 'hardly smile quietly.' The Greek phrase joins 'scarcely,' 'silence/quiet,' and 'smile' in a compact expression of restrained amusement.
    reason: lexical_alternative
translation:
  language: ko
  text: 어리석은 자는 웃음 속에서 자기 목소리를 높입니다. 그러나 슬기로운 사람은 침묵 속에서도 겨우 미소를 짓습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘침묵 속에서도 겨우 미소를 짓습니다’는 ἡσυχῇ와 μειδιάσει의 결합을 살린 표현으로, 영어 POB의 ‘scarcely smile quietly’에 해당합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: μωρὸς
