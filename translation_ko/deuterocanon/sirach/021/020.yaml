  text: A fool raises his voice in laughter[a], but a shrewd man will scarcely smile quietly.
  footnotes:
  - marker: a
    text: Or 'hardly smile quietly.' The Greek phrase joins 'scarcely,' 'silence/quiet,' and 'smile' in a compact expression of restrained amusement.
    reason: lexical_alternative
translation:
  language: ko
  text: 어리석은 자는 웃음 속에서 자기 목소리를 높입니다. 그러나 슬기로운 사람은 조용히 겨우 미소를 짓습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 ‘겨우’, ‘조용히’, ‘미소 짓다’를 짧게 결합하여 절제된 웃음을 나타냅니다. 또는 ‘거의 조용히 미소를 짓습니다’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: μωρὸς
