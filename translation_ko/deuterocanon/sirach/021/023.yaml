  naturalness: ‘문간에서 집을 들여다보지만’과 ‘밖에 서서 말합니다’는 자연스럽고 합쇼체 격언 문체에 적합합니다. 다만 ‘그것이 사람에게는 명예입니다’로 병렬을 명료하게 하면 한국어에서도 더 자연스럽습니다.
  terminology: אֱוִיל의 ‘어리석은 자’와 מפתח의 ‘문간’은 적절합니다. כבוד은 여기서 ‘존귀한 사람’보다 ‘명예’로 유지하는 것이 안전하며, 해석적 인물화는 각주에서 보조할 수 있습니다.
