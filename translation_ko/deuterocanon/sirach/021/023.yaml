base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/021/023.yaml
  text: A fool peers into a house from the doorway[b][a], but an honorable man will stand outside and speak.
  footnotes:
  - marker: a
    text: Hebrew reads 'and honor to a man [who] will stand outside and speak,' a compressed expression rendered here as 'a well-bred man.' The Greek parallel has 'a trained/educated man will stand outside.'
    reason: alternative_reading
  - marker: b
    text: The Greek parallel ends with 'will stand outside' and does not include 'and speak,' which is present in the Hebrew witness followed here.
    reason: textual_variant
translation:
  language: ko
  text: 어리석은 자는 문간에서 집을 들여다보지만, 밖에 서서 말하는 것은 사람에게 명예입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘그리고 사람에게는 명예가 있다. 밖에 서서 말한다’라는 압축된 표현입니다. 그리스어 병행본은 ‘교양 있는 사람은 밖에 설 것이다’라고 합니다.
    reason: source_note
  - marker: b
    text: 그리스어 병행본은 ‘밖에 설 것이다’로 끝나며, 히브리어 본문에 있는 ‘말하다’에 해당하는 말을 포함하지 않습니다.
    reason: textual_variant
lexical_decisions:
- source_word: אֱוִיל
  english_pob_choice: a fool
  chosen_korean: 어리석은 자
  alternatives_korean:
  - 바보
  - 우매한 사람
  lexicon: HALOT
  rationale: 지혜문학에서 אֱוִיל은 단순한 지능 부족이 아니라 분별과 행실이 어리석은 사람을 가리키므로, 현대 한국어에서도 인물형 표현인 ‘어리석은 자’가 가장 자연스럽습니다.
- source_word: מִפֶּתַח יַבִּיט אֶל בָּיִת
  english_pob_choice: peers into a house from the doorway
  chosen_korean: 문간에서 집을 들여다보지만
  alternatives_korean:
  - 현관에서 집을 들여다보지만
  - 문에서 집을 엿보지만
  lexicon: HALOT
  rationale: 문맥상 침입적으로 안을 훔쳐보는 동작이 핵심이므로 ‘문간에서 집을 들여다보다’가 ‘peers into’의 시각적·행동적 뉘앙스를 살립니다.
- source_word: וְכָבוֹד לְאִישׁ
  english_pob_choice: but an honorable man / a well-bred man
  chosen_korean: 존귀한 사람
  alternatives_korean:
  - 품위 있는 사람
  - 예의 바른 사람
  - 존경받는 사람
  lexicon: HALOT
  rationale: 히브리어는 직역하면 ‘그리고 영광/존귀가 한 사람에게…’로 압축되어 있어, POB의 사회적 품격 이해를 반영하되 ‘존귀한 사람’으로 더 직설적이고 형식적으로 옮겼습니다.
- source_word: בַּחוּץ יַעֲמוֹד וִידַבֵּר
  english_pob_choice: will stand outside and speak
  chosen_korean: 밖에 서서 말합니다
  alternatives_korean:
  - 밖에 서며 말합니다
  - 밖에 서서 이야기합니다
  lexicon: HALOT
  rationale: ‘밖에 서다’와 ‘말하다’의 순서를 유지하되, 잠언형 현재시제로 한국어 격언체를 살렸습니다. 히브리어의 명시적 ‘말하다’는 예절 있게 자신의 존재를 알리는 행위를 뜻합니다.
theological_decisions:
- issue: 히브리어의 압축된 'וְכָבוֹד לְאִישׁ' 표현 처리
  chosen_reading: 사회적 품위와 존귀를 나타내는 서술로 보고 ‘존귀한 사람’으로 풀어 옮겼습니다.
  alternative_readings:
  - ‘그리고 사람에게는 영광이 있다’처럼 추상명사형으로 옮기는 해석
  - ‘품위 있는 사람’처럼 행동 규범 중심으로 옮기는 해석
  rationale: 병렬되는 그리스어 전승이 ‘훈련된/교양 있는 사람’이라는 사회적 성숙을 가리키므로, 본문을 도덕적 품위와 존귀함의 표지로 읽는 번역이 가장 안전합니다.
  doctrine_reference: 지혜문학의 품행 윤리와 사회적 분별
- issue: 그리스어 병행본의 '말하다' 부재와 히브리어 본문의 보존
  chosen_reading: 본문에는 히브리어의 ‘말하다’를 반영했습니다.
  alternative_readings:
  - 그리스어를 따라 ‘밖에 서기만 한다’로 줄이는 읽기
  - 히브리어를 따라 ‘서서 말한다’를 유지하는 읽기
  rationale: POB의 본문 우선 원칙상 히브리어 증언을 따라 ‘말합니다’를 유지하되, 문맥상 침범하지 않고 밖에서 정중히 말하는 행위로 이해했습니다.
  doctrine_reference: 본문비평 및 사본 증거 우선 원칙
