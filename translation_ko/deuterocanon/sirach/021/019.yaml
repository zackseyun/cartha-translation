lexical_decisions:
- source_word: πέδαι
  english_pob_choice: shackles
  chosen_korean: 족쇄
  alternatives_korean:
  - 쇠사슬
  - 족철
  lexicon: LSJ
  rationale: 발에 채우는 구속구라는 구체적 이미지를 살리기 위해 ‘족쇄’로 옮겼습니다. 영어 POB의 ‘shackles’와 대응하면서도 자연스럽습니다.
- source_word: παιδεία
  english_pob_choice: instruction
  chosen_korean: 훈계
  alternatives_korean:
  - 가르침
  - 교훈
  - 훈련
  lexicon: LSJ
  rationale: 지혜문학 문맥에서 παιδεία는 단순한 정보 전달보다 교정적 가르침과 훈육의 성격이 있어 ‘훈계’가 가장 근접합니다.
- source_word: ἀνοήτοις
  english_pob_choice: the senseless
  chosen_korean: 어리석은 자
  alternatives_korean:
  - 무지한 자
  - 분별없는 자
  - 지각 없는 자
  lexicon: LSJ
  rationale: 지혜 전승에서 이해력과 분별이 결여된 사람을 가리키므로, ‘어리석은 자’가 인격적 평가를 유지하면서도 과도하게 축소하지 않습니다.
- source_word: χειροπέδαι
  english_pob_choice: handcuffs
  chosen_korean: 수갑
  alternatives_korean:
  - 족쇄
  - 수쇠
  - 쇠고랑
  lexicon: LSJ
  rationale: 손에 채우는 구속구의 현대적 대응으로 ‘수갑’을 택해, 원문의 비유적 압박감을 분명하게 전달했습니다.
theological_decisions:
- issue: παιδεία의 의미를 단순한 지식 전달로 볼지, 훈육적 교정으로 볼지
  chosen_reading: 여기서는 ‘훈계’로 옮겨, 어리석은 자에게는 지혜의 교정이 속박처럼 느껴진다는 대비를 드러냈습니다.
  alternative_readings:
  - ‘교육’으로 보다 중립적으로 옮길 수 있음
  - ‘훈련’으로 더 강하게 규율성을 드러낼 수 있음
  rationale: 문맥상 지혜의 가르침 자체가 거부당하는 역설을 표현하는 것이 핵심이므로, 훈계라는 말이 부정적 체감까지 함께 담아냅니다.
  doctrine_reference: 지혜문학의 훈육과 거절의 대비
