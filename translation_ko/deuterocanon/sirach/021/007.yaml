base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/021/007.yaml
  text: A man mighty in tongue is known from afar[b][a], but one with understanding knows when he slips.
  footnotes:
  - marker: a
    text: Or 'is recognized from a distance'; the Greek may suggest either conspicuous speech or a reputation that precedes him.
    reason: lexical_alternative
  - marker: b
    text: Or 'when he stumbles.' The Greek image of slipping can denote either literal stumbling or figurative error.
    reason: lexical_alternative
translation:
  language: ko
  text: 말에 능한 사람은 멀리서도[a] 알려지지만, 분별 있는 사람은 그 사람이 미끄러질 때를[b] 압니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘멀리서도 알아볼 수 있다’; 그리스어는 그의 말이 두드러져 드러난다는 뜻일 수도 있고, 그의 명성이 먼저 알려진다는 뜻일 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘넘어질 때’. 그리스어의 ‘미끄러지다’라는 이미지는 문자적으로 발을 헛디디는 것과 비유적으로 오류를 범하는 것을 모두 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: γνωστὸς μακρόθεν
  english_pob_choice: is known from afar
  chosen_korean: 멀리서도 알려지지만
  alternatives_korean:
  - 멀리서도 인식되지만
  - 멀리서도 유명하지만
  lexicon: LSJ
  rationale: γνωστός μακρόθεν의 핵심은 멀리서도 드러나거나 알려진다는 뜻이므로, 짧고 자연스러운 ‘멀리서도 알려지지만’으로 옮겨 그 뉘앙스를 보존했습니다.
- source_word: ὁ δυνατὸς ἐν γλώσσῃ
  english_pob_choice: a man mighty in tongue
  chosen_korean: 말솜씨에 능한 사람
  alternatives_korean:
  - 혀에 강한 사람
  - 말에 능한 사람
  - 말솜씨가 강한 사람
  lexicon: LSJ
  rationale: ἐν γλώσσῃ는 문자 그대로는 ‘혀에’이지만 한국어에서는 ‘말솜씨’가 관용적이어서, 힘있게 말하는 사람이라는 이미지를 살리면서도 읽기 쉬운 표현으로 옮겼습니다.
- source_word: ὁ δὲ νοήμων
  english_pob_choice: but one with understanding
  chosen_korean: 분별 있는 사람은
  alternatives_korean:
  - 이해하는 사람은
  - 지각 있는 사람은
  - 슬기로운 사람은
  lexicon: LSJ
  rationale: νοήμων은 단순 지식보다 분별과 통찰을 가리키므로, 대조되는 인물상을 자연스럽게 드러내는 ‘분별 있는 사람’이 적절합니다.
- source_word: ἐν τῷ ὀλισθάνειν αὐτόν
  english_pob_choice: when he slips
  chosen_korean: 자기가 미끄러질 때를 압니다
  alternatives_korean:
  - 그가 넘어질 때를 압니다
  - 그가 실수할 때를 압니다
  - 그가 미끄러지는 때를 압니다
  lexicon: LSJ
  rationale: ὀλισθάνειν은 문자적으로 ‘미끄러지다/넘어지다’이므로, 직유를 유지해 ‘미끄러질 때’를 택했습니다. POB의 주석처럼 문자적 넘어짐과 비유적 실책 가능성을 함께 열어 두기 위해 ‘실수’로 좁히지 않았습니다.
theological_decisions:
- issue: ὀλισθάνειν의 문자적·비유적 범위
  chosen_reading: ‘미끄러질 때’로 번역해, 실제 발을 헛디디는 장면과 도덕적/언어적 실책의 가능성을 모두 열어 둡니다.
  alternative_readings:
  - ‘넘어질 때’로 옮겨 더 일반적인 뜻을 취함
  - ‘실수할 때’로 옮겨 비유적 의미를 분명히 함
  rationale: 지혜문학의 비유적 언어를 과도하게 해설하지 않고, 원문의 이미지가 주는 경고를 그대로 살리는 편이 본문 의도에 가깝습니다.
  doctrine_reference: 지혜문학의 수사와 비유 해석 원칙
- issue: 남성 단수 표현의 대표성
  chosen_reading: ‘사람’으로 옮겨 남성 단수의 대표적 인물을 자연스럽게 살렸습니다.
  alternative_readings:
  - ‘한 남자’로 직역
  - ‘그 사람은’으로 성별 표지를 약화
  rationale: 그리스어의 남성 단수는 이 구절에서 대표적 인물을 가리키는 일반적 용법이므로, 한국어에서는 뜻을 살리면서도 과도하게 성별을 부각하지 않는 ‘사람’이 적절합니다.
  doctrine_reference: DOCTRINE.md §4 Gender-accurate over gender-neutral
