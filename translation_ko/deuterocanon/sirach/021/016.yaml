base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/021/016.yaml
  text: A fool’s explanation is like a burden on the road[a], but grace will be found on the lips of the prudent.
  footnotes:
  - marker: a
    text: Or 'favor will be found on the lips of the prudent.' The Greek χάρις can denote grace, favor, or graciousness.
    reason: lexical_alternative
translation:
  language: ko
  text: 어리석은 자의 설명은 길 위의 짐과 같지만, 분별 있는 자의 입술에서는 은혜로움을 찾아볼 수 있을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘분별 있는 자의 입술에서는 호의를 찾아볼 수 있을 것입니다.’ 그리스어 χάρις는 은혜, 호의, 또는 은혜로움(친절함)을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξήγησις μωροῦ
  english_pob_choice: A fool’s explanation
  chosen_korean: 어리석은 자의 설명
  alternatives_korean:
  - 어리석은 자의 해설
  - 어리석은 자의 말풀어내기
  - 어리석은 자의 풀이
  lexicon: LSJ
  rationale: ἐξήγησις는 '설명/해설'의 뜻으로, 지혜문학의 대비 구조에서 무난하고 직접적인 '설명'이 가장 자연스럽습니다.
- source_word: ὡς ἐν ὁδῷ φορτίον
  english_pob_choice: like a burden on the road
  chosen_korean: 길 위의 짐과 같지만
  alternatives_korean:
  - 길 위의 부담과 같지만
  - 길에서 짐이 되는 것과 같지만
  - 길 위의 무거운 짐과 같지만
  lexicon: LSJ
  rationale: φορτίον은 운반되는 짐, 무거운 짐을 가리키므로 '짐'으로 옮기되, ἐν ὁδῷ의 구체적 이미지를 살려 '길 위의'로 번역했습니다.
- source_word: συνετοῦ
  english_pob_choice: the prudent
  chosen_korean: 분별 있는 자
  alternatives_korean:
  - 신중한 사람
  - 슬기로운 자
  - 깨달은 자
  lexicon: LSJ
  rationale: συνετός는 단순한 지적 능력보다 판단력과 분별을 가진 사람을 가리키므로, 지혜문학적 대비를 살려 '분별 있는 자'로 옮겼습니다.
- source_word: εὑρεθήσεται χάρις
  english_pob_choice: grace will be found
  chosen_korean: 은혜가 발견될 것입니다
  alternatives_korean:
  - 호의가 발견될 것입니다
  - 은총이 발견될 것입니다
  - 은혜를 얻을 것입니다
  lexicon: LSJ
  rationale: χάρις는 이 문맥에서 '은혜/호의/호감'의 범위를 가지므로, 본문 그대로의 표현을 살리면서도 한국어에서 자연스러운 '은혜가 발견될 것입니다'를 선택했습니다.
theological_decisions:
- issue: χάρις의 의미 범위
  chosen_reading: 본문에서는 '은혜'를 기본으로 두되, 문맥상 '호의' 가능성도 여전히 열어 둡니다.
  alternative_readings:
  - 호의
  - 호감
  - 은총
  rationale: 영어 POB가 각주에서 χάρις의 의미 범위를 명시하므로, 본문은 전통적이면서도 문맥에 맞는 '은혜'를 유지하고 의미 여백은 각주로 보존합니다.
  doctrine_reference: 지혜문학의 어휘 유연성 및 다의어 보존
