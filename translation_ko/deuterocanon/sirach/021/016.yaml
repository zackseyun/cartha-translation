  to: 어리석은 자의 설명은 길 위의 짐과 같지만, 분별 있는 자의 입술에서는 은혜로움을 찾아볼 수 있을 것입니다.[a]
  rationale: The revision replaces the literal but unidiomatic ‘은혜가 발견될 것입니다’ with ‘은혜로움을 찾아볼 수 있을 것입니다.’ This conveys the future passive sense of εὑρεθήσεται naturally in Korean and reflects χάρις as graciousness in the immediate context, while the footnote preserves the viable alternative ‘호의’ and the broader lexical range.
