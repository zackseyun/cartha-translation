  lexicon: LSJ
  rationale: σοφία의 기본 의미를 가장 직접적으로 살려 표준적인 ‘지혜’로 옮겼습니다.
- source_word: μωρῷ
  english_pob_choice: to a fool
  chosen_korean: 어리석은 자에게
  alternatives_korean:
