  rationale: 여격의 관계를 한국어에서 자연스럽게 드러내기 위해 ‘-에게’로 처리했고, μωρός의 도덕적·지적 결핍을 ‘어리석은 자’로 옮겼습니다.
- source_word: οἶκος ἠφανισμένος
  english_pob_choice: a ruined house
  chosen_korean: 무너진 집
  alternatives_korean:
  - 파괴된 집
  - 사라진 집
  lexicon: LSJ
  rationale: ἠφανισμένος의 ‘보이지 않게 되다/무너뜨리다’ 계열 의미를 살리면서, 비유의 핵심인 기능 상실과 폐허감을 가장 자연스럽게 드러내는 표현으로 선택했습니다.
- source_word: ἀδιεξέταστοι λόγοι
  english_pob_choice: words that cannot be examined
  chosen_korean: 살필 수 없는 말
  alternatives_korean:
  - 검토할 수 없는 말
  - 헤아릴 수 없는 말
  - 이해할 수 없는 말
  lexicon: LSJ
  rationale: POB의 ‘examined’는 단순한 난해함보다 탐구·검증의 불가능성을 가리키므로, ‘살필 수 없는’으로 옮겨 그 조사 불가능성을 간결하게 드러냈습니다.
theological_decisions:
- issue: 그리스어 비유문의 수사적 강도 보존
  chosen_reading: 지혜/지식의 무용성을 단순한 무지보다 더 강하게, ‘무너진 집’과 ‘살필 수 없는 말’의 이미지로 유지했습니다.
  alternative_readings:
  - 지혜는 어리석은 자에게 쓸모없습니다
  - 이해가 없는 자의 지식은 알아들을 수 없습니다
  rationale: 본문은 지적 결핍을 넘어 구조적으로 붕괴된 상태와 조사 불가능한 발화를 대비시키므로, 완화된 설명보다 원문의 비유적 압력을 보존하는 쪽이 적절합니다.
  doctrine_reference: 지혜문학의 수사와 대비법
