  text: Wisdom to a fool is like a ruined house, and the knowledge of one without understanding is words that cannot be examined.
  footnotes:
  - marker: a
    text: Or 'a destroyed house' for 'a ruined house'; the Greek participle can carry the sense of something obliterated or made to disappear.
    reason: lexical_alternative
  - marker: b
    text: Or 'incomprehensible words' for 'words that cannot be examined'; the Greek may emphasize either unintelligibility or the impossibility of probing the speech meaningfully.
    reason: lexical_alternative
translation:
  language: ko
  text: 지혜는 어리석은 자에게 무너진 집과 같고, 이해가 없는 자의 지식은 살필 수 없는 말입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘파괴된 집’; ἠφανισμένος는 ‘무너진’보다 더 강하게 없어지거나 폐허가 된 상태를 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘검토할 수 없는 말’/‘이해할 수 없는 말’; ἀδιεξέταστοι는 말의 조사 불가능성이나 난해함을 모두 암시할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: σοφία
  english_pob_choice: wisdom
  chosen_korean: 지혜
  alternatives_korean:
