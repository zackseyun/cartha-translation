base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/021/025.yaml
  text: The lips of strangers will be weighed down by these things[b][a], but the words of the wise will be set on a balance.
  footnotes:
  - marker: a
    text: Or 'in these things' for 'by these things'; the Greek phrase may be read more literally, but the English here reflects the likely sense in context.
    reason: lexical_alternative
  - marker: b
    text: The image in 'will be set on a balance' suggests that the wise speak with measured judgment.
    reason: cultural_note
translation:
  language: ko
  text: 낯선 사람들의 입술은 이런 것들로 무거워질 것이지만, 지혜로운 이들의 말은 저울 위에 놓일 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘이런 것들 안에서’가 될 수 있으나, 문맥상 원인·도구의 뜻이 자연스럽습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘저울 위에 놓일 것입니다’는 지혜의 말이 분별되고 측정된다는 이미지를 살린 표현입니다.
    reason: cultural_note
