  text: The lips of strangers will be weighed down by these things[b][a], but the words of the wise will be set on a balance.
  footnotes:
  - marker: a
    text: Or 'in these things' for 'by these things'; the Greek phrase may be read more literally, but the English here reflects the likely sense in context.
    reason: lexical_alternative
  - marker: b
    text: The image in 'will be set on a balance' suggests that the wise speak with measured judgment.
    reason: cultural_note
translation:
  language: ko
  text: 낯선 이들의 입술은 이런 것들로[a] 무거워질 것이지만, 지혜로운 이들의 말은 저울 위에 놓일 것입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이런 것들 안에서’로도 옮길 수 있습니다. 여기서는 문맥에 따라 원인이나 수단의 뜻으로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘저울 위에 놓일 것입니다’는 말이 저울에 달리는 비유적 이미지를 살린 표현입니다.
    reason: cultural_note
