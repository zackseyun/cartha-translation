  - 금빛의
  lexicon: LSJ
  rationale: 형용사는 장식의 재질을 분명히 하므로, 현대 한국어에서 가장 직접적인 ‘금으로 된’으로 옮겨 금의 가치와 물질감을 함께 드러냈습니다.
- source_word: φρονίμῳ
  english_pob_choice: to a prudent man
  chosen_korean: 지혜로운 사람에게
  alternatives_korean:
  - 분별 있는 사람에게
  - 신중한 남자에게
  - 지혜로운 남자에게
  lexicon: LSJ
  rationale: 여격은 훈계가 잘 어울리거나 유익한 대상을 가리키므로 ‘-에게’로 풀었고, φρόνιμος의 실천적 지혜를 살려 ‘지혜로운’으로 옮겼습니다.
- source_word: παιδεία
  english_pob_choice: instruction
  chosen_korean: 훈계
  alternatives_korean:
  - 가르침
  - 교육
  - 훈련
  lexicon: LSJ
  rationale: 지혜문학에서 παιδεία는 단순한 정보 전달보다 교정과 형성을 포함하므로, 본문이 칭찬하는 형성적 의미를 살릴 수 있는 ‘훈계’를 택했습니다.
- source_word: χλιδών
  english_pob_choice: bracelet
  chosen_korean: 팔찌
  alternatives_korean:
  - 팔장식
  - 완장
  - 팔목장식
  lexicon: LSJ
  rationale: ‘오른팔에’와 결합하므로 팔에 차는 장식이 가장 자연스럽고, 현대 독자에게 분명한 대응어인 ‘팔찌’를 사용했습니다.
- source_word: βραχίονι δεξιῷ
  english_pob_choice: on his right arm
  chosen_korean: 그의 오른팔에 있는
  alternatives_korean:
  - 오른팔에
  - 오른팔 위에 있는
  - 오른팔에 찬
  lexicon: LSJ
  rationale: 원문의 위치 표현을 자연스럽게 살리면서 소유 관계를 드러내기 위해 ‘그의 오른팔에 있는’으로 풀었습니다.
