  source_fidelity: 개정이 필요합니다. παιδεία를 ‘훈계’로 한정하면 교정·책망의 뜻이 전면에 나와, 이 문맥에서의 폭넓은 ‘가르침/훈련’의 의미를 다소 좁힙니다. φρονίμῳ도 일반적인 지적 지혜보다 실천적 분별을 강조하는 ‘분별 있는 사람’이 더 가깝습니다. ‘그의 오른팔에 있는 팔찌’는 의미상 가능하나, 착용한 장신구의 이미지에는 ‘찬’이 더 자연스럽습니다.
