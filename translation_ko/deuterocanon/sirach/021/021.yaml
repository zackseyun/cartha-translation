translation:
  language: ko
  text: 가르침은 분별 있는 사람에게 금 장식품 같고, 그의 오른팔에 찬 팔찌와 같습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘훈련’ 또는 ‘교육’으로 옮길 수 있습니다. 그리스어 παιδεία는 가르침뿐 아니라 도덕적 형성을 포함할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: κόσμος
  english_pob_choice: ornament
  chosen_korean: 장식품
  alternatives_korean:
  - 장식물
  - 장신구
  - 장식
  lexicon: LSJ
  rationale: 이 문맥의 κόσμος는 ‘세상’이 아니라 몸에 걸거나 치는 장식물을 뜻하므로, ‘금으로 된 장식품’으로 옮겨 비교적 자연스럽게 이미지가 살아나게 했습니다.
- source_word: χρυσοῦς
