  source_fidelity: 원문의 δέησις, πτωχός, κρίμα, κατὰ σπουδήν 및 현재형 ἔρχεται의 의미는 대체로 잘 반영되었습니다. 그러나 한국어 본문의 ‘그의 입에서 그의 귀까지’와 이어지는 ‘그의 판결’은 모두 가장 가까운 선행사인 ‘가난한 사람’을 가리키는 것으로 읽혀, 기도가 가난한 사람 자신의 귀에 이르고 그 사람 자신의 판결이 온다는 부자연스럽고 문맥상 부정확한 의미가 됩니다. 헬라어의 생략된 신적 지시 대상은 문맥상 보충할 필요가 있습니다.
  naturalness: ‘가난한 이’와 ‘간구’는 현대 표준 한국어의 격식 있는 성경 문체에 자연스럽습니다. ‘그분의 귀’와 ‘그분의 판결’은 하나님을 명시하는 ‘하나님의’보다 원문의 대명사적 표현을 어느 정도 보존하면서도, 한국어에서 선행사 혼동을 피합니다.
  terminology: δέησις는 ‘간구’, κρίμα는 이 문맥에서 하나님의 법적 판정이라는 폭을 지닌 ‘판결’로 옮기는 것이 적절합니다. ‘그분’은 원문에 이름으로 명시되지 않은 하나님을 문맥상 가리키며, 각주에서 원문의 문자적 표현과 지시 대상의 해석성을 밝혀야 합니다.
