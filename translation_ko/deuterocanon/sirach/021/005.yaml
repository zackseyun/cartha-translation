revisions:
- from: 가난한 사람의 기도는 그의 입에서 그의 귀까지 이르고, 그의 판결은 신속히 이릅니다.[a][b]
  to: 가난한 이의 간구는 그 입에서 그분의 귀까지 이르고, 그분의 판결은 신속히 이릅니다.[a][b]
  rationale: 한국어에서 동일한 ‘그의’를 반복하면 원문의 문맥상 지시 대상이 가난한 사람으로 오해되므로, ‘그분’으로 바꾸어 최소한의 문맥적 보충을 했습니다. 원문이 하나님이라는 명사를 직접 쓰지 않는 점과 κρίμα의 의미 범위는 각주에 보존했습니다. 각주 b의 비한국어 표현은 ‘정의’로 고쳐야 합니다.
  reviewer_model: gpt-5.6-terra
