  text: The prayer of a poor man goes from his mouth to his ears[b][a], and his judgment comes quickly.
  footnotes:
  - marker: a
    text: 'Literally, ''from mouth to his ears.'' The pronoun ''his'' is most naturally understood as referring to God: the poor man''s prayer reaches God''s ears.'
    reason: lexical_alternative
  - marker: b
    text: Or 'his case' or 'justice'; the Greek 'judgment' can refer to the decision rendered on behalf of the poor man.
    reason: alternative_reading
translation:
  language: ko
  text: 가난한 사람의 기도는 그의 입에서 그의 귀까지 이르고, 그의 판결은 신속히 이릅니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그의 입에서 그의 귀까지’입니다. 이 ‘그의’는 문맥상 하나님을 가리키는 것으로 가장 자연스럽게 이해되며, 가난한 사람의 기도가 하나님의 귀에 이른다는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘판결’은 여기서 가난한 사람을 위해 내려지는 법적 판정이나 사건의 결정을 가리킬 수도 있습니다. 따라서 ‘심판’보다 넓은 뜻을 가집니다.
    reason: alternative_reading
lexical_decisions:
- source_word: δέησις
  english_pob_choice: prayer
  chosen_korean: 기도
  alternatives_korean:
  - 간구
  - 청원
  - 기도함
  lexicon: LSJ
  rationale: 문맥상 가난한 사람의 간절한 호소를 가리키므로, 한국어에서는 가장 자연스럽고 넓은 의미를 담는 ‘기도’로 옮겼습니다.
- source_word: πτωχοῦ
  english_pob_choice: poor man
  chosen_korean: 가난한 사람
  alternatives_korean:
  - 가난한 남자
  - 빈곤한 사람
  - 궁핍한 사람
  lexicon: BDAG
  rationale: 헬라어 남성형 단수는 유지하되, 한국어에서는 성별 표지를 굳이 드러내지 않는 ‘가난한 사람’이 본문 기능을 가장 자연스럽게 드러냅니다.
- source_word: ἐκ στόματος ἕως ὠτίων αὐτοῦ
  english_pob_choice: from his mouth to his ears
  chosen_korean: 그의 입에서 그의 귀까지
  alternatives_korean:
  - 그의 입에서 하나님의 귀까지
  - 그의 입에서 귀에까지
  lexicon: LSJ
  rationale: 원문 이미지를 살려 문자적으로 옮겼습니다. ‘그의 귀’의 대명사 지시를 본문 안에서 과도하게 해석하지 않고, 독자가 문맥상 하나님을 떠올리게 하는 여지를 남겼습니다.
- source_word: κρίμα
  english_pob_choice: judgment
  chosen_korean: 판결
  alternatives_korean:
  - 심판
  - 사건의 결말
  - 의로운 판정
  lexicon: BDAG
  rationale: 여기서는 가난한 사람을 위한 법적 판정의 뉘앙스가 강하므로, 추상적인 ‘심판’보다 ‘판결’이 문맥과 더 잘 맞습니다.
- source_word: κατὰ σπουδήν ἔρχεται
  english_pob_choice: comes quickly
  chosen_korean: 신속히 이릅니다
  alternatives_korean:
  - 빨리 옵니다
  - 서둘러 옵니다
  - 곧 이릅니다
  lexicon: LSJ
  rationale: σπουδή의 ‘서두름/신속함’을 살리면서, 문어체 합쇼체에서 자연스럽게 읽히는 표현으로 다듬었습니다.
theological_decisions:
- issue: αὐτοῦ의 지시 대상과 ‘귀’의 표현
  chosen_reading: 본문은 문자적으로 ‘그의 귀’라고 두고, 지시 대상이 문맥상 하나님으로 읽힐 수 있다는 긴장을 유지했습니다.
  alternative_readings:
  - ‘하나님의 귀까지’라고 명시해 해석을 앞당김
  - ‘그의’가 가난한 사람을 가리키는 것으로 이해
  rationale: 영어 POB의 주석처럼 문맥상 하나님이 들으시는 뜻이 분명하지만, 원문은 직접 그렇게 말하지 않습니다. 본문에는 원문 이미지를 유지하고, 해석은 독자에게 열어 두는 편이 더 소스 충실적입니다.
  doctrine_reference: Translation philosophy §3, 애매함이 실제로 존재할 때는 해석을 본문에 과도하게 주입하지 않음
