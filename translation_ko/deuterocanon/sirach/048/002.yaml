translation:
  language: ko
  text: 그는 그들의 양식의 지팡이[a]를 꺾었고, 그의 열심으로 그들을 줄였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘양식의 지팡이’는 식량 공급을 지탱하는 버팀, 곧 식량의 공급을 가리키는 관용구입니다. 그리스어 병행본은 이를 ‘그들에게 기근을 가져왔다’로 옮깁니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וישבר
  english_pob_choice: He broke
  chosen_korean: 부러뜨렸고
  alternatives_korean:
  - 깨뜨렸고
  - 꺾었고
  lexicon: HALOT
  rationale: 히브리어 שבר의 기본 의미인 ‘부수다/부러뜨리다’를 살리면서, 시적 문맥에서 자연스럽게 읽히는 동사를 택했습니다.
- source_word: מטה לחם
  english_pob_choice: staff of bread
  chosen_korean: 빵의 몽둥이
  alternatives_korean:
  - 빵의 지팡이
  - 빵의 버팀목
  - 빵의 몽둥이
  lexicon: HALOT
  rationale: 본문의 히브리어 관용구를 직역해 이미지성을 유지하되, 한국어에서 ‘몽둥이’는 어색하지만 ‘staff’의 물체적 이미지를 가장 가깝게 드러냅니다. 다만 의미가 ‘식량의 공급/버팀’이라는 점은 본문 안에서 과도하게 풀지 않고, 필요 시 주석으로 처리하는 편이 원문 보존에 유리합니다.
- source_word: ובקנאתו
  english_pob_choice: and in his zeal
  chosen_korean: 그의 열심으로
  alternatives_korean:
  - 그의 열심 안에서
  - 그의 질투로
  - 그의 열정으로
  lexicon: HALOT
  rationale: קנאה는 ‘열심’과 ‘질투’ 모두 가능하지만, 문맥상 하나님을 향한 엘리야의 열심을 가리키므로 ‘열심’이 가장 적절합니다. 전치사 ב는 결과/수단의 뉘앙스를 살려 ‘-으로’로 옮겼습니다.
- source_word: המעיטם
  english_pob_choice: he diminished them
  chosen_korean: 그들을 적게 만드셨습니다
  alternatives_korean:
  - 그들을 줄이셨습니다
  - 그들을 감소시키셨습니다
  - 그들을 작게 만드셨습니다
  lexicon: HALOT
  rationale: 히필 מעט의 ‘적게 하다/줄이다’라는 의미를 살려 결과를 분명히 드러냈습니다. 다만 한국어로는 ‘적게 만드시다’가 다소 어색하므로, 원문의 동작성과 의미를 함께 보이도록 선택했습니다.
theological_decisions:
- issue: 히브리어 관용구를 직역할지, 의미를 풀이할지
  chosen_reading: 본문에는 관용구의 이미지성을 유지하고, ‘식량의 부족/기근’이라는 뜻은 주석으로 보조하는 방향을 택했습니다.
  alternative_readings:
  - 그는 그들에게 기근을 가져오셨습니다
  - 그는 그들의 식량을 끊으셨습니다
  rationale: 히브리어 본문이 1차 증거이고, 그리스어 병행본이 기근 해석을 뒷받침하지만, 본문 번역에서 이미지까지 보존하는 것이 시적·문학적 효과를 더 잘 살립니다.
  doctrine_reference: 'Translation philosophy: original-language primacy over translation tradition; optimal equivalence.'
