translation:
  language: ko
  text: 시내에서 책망을 들려주시고, 호렙에서 보복의 심판들을 선포하셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 평행본문은 상당히 다른 독법을 보입니다. 그 뜻은 ‘보복을 위해 왕들을 기름부으시고, 그 뒤에 예언자들을 후계자로 세우셨다’입니다. 히브리어와 그리스어는 이 절에서 서로 다른 본문 형태를 반영하는 것으로 보입니다.
    reason: textual_variant
lexical_decisions:
- source_word: השמע
  english_pob_choice: You made heard
  chosen_korean: 들려주시고
  alternatives_korean:
  - 들리게 하시고
  - 듣게 하시고
  - 선포하시고
  lexicon: HALOT
  rationale: 히필형 שמע의 사역적 의미를 살려 단순한 ‘말하다’보다 ‘듣게 하다/들려주다’로 옮겼습니다. 문맥상 하나님이 시내에서 경고의 말씀을 주신다는 뜻을 자연스럽게 드러냅니다.
- source_word: תוכחות
  english_pob_choice: rebukes
  chosen_korean: 책망
  alternatives_korean:
  - 꾸짖음
  - 훈계
  - 경책
  lexicon: HALOT
  rationale: תוכחות는 단순한 조언보다 강한 admonitory force를 가지므로, 현대 한국어에서 가장 직접적인 ‘책망’을 택했습니다.
- source_word: משפטי נקם
  english_pob_choice: judgments of vengeance
  chosen_korean: 보복의 심판들
  alternatives_korean:
  - 원수 갚음의 심판들
  - 징벌의 판결들
  - 응보의 심판들
  lexicon: HALOT
  rationale: משפט를 ‘심판’으로, נקם을 ‘보복’으로 옮겨 두 명사 사이의 결합을 살렸습니다. ‘보복’은 현대어에서 다소 거칠 수 있지만, 본문의 강한 응보적 의미를 가장 직접적으로 반영합니다.
- source_word: בסיני / ובחורב
  english_pob_choice: at Sinai / and at Horeb
  chosen_korean: 시내에서 / 호렙에서
  alternatives_korean:
  - 시내에서 / 그리고 호렙에서
  - 시내 산에서 / 호렙 산에서
  lexicon: HALOT
  rationale: 지명 앞의 ב는 한국어에서 장소 부사격 ‘-에서’가 가장 자연스럽습니다. ‘산’을 덧붙이지 않고도 고유 지명 자체가 성경적 장소를 충분히 가리킵니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 평행본문의 차이
  chosen_reading: 본문은 현존 히브리어를 따라 ‘시내에서 책망을 들려주시고, 호렙에서 보복의 심판들을 선포하셨습니다’로 옮기고, 그리스어의 다른 독법은 각주로만 보존합니다.
  alternative_readings:
  - '그리스어 평행본문의 뜻: ‘왕들을 보복으로 기름부으시고, 그 뒤에 예언자들을 후계자로 세우셨다’'
  rationale: 집회서에서는 히브리어 증거가 보존될 때 그것을 मुख्य 본문으로 삼는 편집 원칙을 따릅니다. 여기서는 그리스어가 단순한 표현 차이가 아니라 다른 문장을 반영하므로, 본문과 각주를 분리해 투명성을 유지합니다.
  doctrine_reference: 'PHILOSOPHY.md: translate from Hebrew where Sirach survives; preserve source uncertainty honestly'
