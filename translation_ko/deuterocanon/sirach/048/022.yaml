base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/048/022.yaml
  text: For Hezekiah did what was good[a], and was strong in the ways of David, as Isaiah the prophet commanded him[b], the one praised among the prophets.
  footnotes:
  - marker: a
    text: 'Greek: ''did what was pleasing to the Lord.'' The extant Hebrew reads simply ''did what was good.'''
    reason: alternative_reading
  - marker: b
    text: Greek instead describes Isaiah as 'the great prophet, faithful in his vision.' The Hebrew reads 'praised among the prophets.'
    reason: textual_variant
translation:
  language: ko
  text: 히스기야는 야훼께서 보시기에 좋은 일을 했고, 다윗의 길에서 굳세게 걸었으니, 예언자 이사야가 그에게 명한 대로입니다. 그는 예언자들 가운데서 칭송받는 사람이었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 ‘주님께서 기뻐하시는 것’을 뜻합니다. 현존 히브리어는 단순히 ‘좋은 일’이라고 읽습니다.
    reason: textual_variant
  - marker: b
    text: 그리스어는 이사야를 ‘그의 환상에서 크고 신실한 예언자’로 묘사합니다. 히브리어는 ‘예언자들 가운데서 칭송받는 이’라고 읽습니다.
    reason: textual_variant
lexical_decisions:
- source_word: כי עשה ... את הטוב / ἐποίησεν ... τὸ ἀρεστὸν Κυρίῳ
  english_pob_choice: did what was good
  chosen_korean: 야훼께서 보시기에 좋은 일을 했고
  alternatives_korean:
  - 좋은 일을 했고
  - 주님께 기쁨이 되는 일을 했고
  lexicon: HALOT; LXX parallel
  rationale: 히브리어 본문은 단순히 ‘좋은 일’이라 하고, 그리스어 평행문은 ‘주님께서 기뻐하시는 것’으로 풀어 말합니다. 본문에는 하늘의 평가를 분명히 드러내는 방향으로, 그러나 히브리어의 도덕적 평가와 그리스어의 야훼 지시를 함께 살려 옮겼습니다.
- source_word: ויחזק / ἐνίσχυσεν
  english_pob_choice: was strong
  chosen_korean: 굳세게 걸었으니
  alternatives_korean:
  - 강건하였으니
  - 굳세었습니다
  - 강하게 행하였으니
  lexicon: HALOT
  rationale: חזק은 이 문맥에서 단순 상태 진술보다 ‘굳세게 나아감/행함’의 뉘앙스가 강하므로, 한국어에서는 ‘걸었다’로 동적 이미지를 살리되 합쇼체 문장에 맞게 정리했습니다.
- source_word: בדרכי דוד
  english_pob_choice: in the ways of David
  chosen_korean: 다윗의 길에서
  alternatives_korean:
  - 다윗의 길 안에서
  - 다윗의 길을 따라
  lexicon: HALOT
  rationale: ‘길들’은 성경적 삶의 방식·행보를 가리키는 관용구이므로, 직역에 가깝게 ‘다윗의 길’로 유지했습니다.
- source_word: כאשר צוהו ישעיה הנביא
  english_pob_choice: as Isaiah the prophet commanded him
  chosen_korean: 예언자 이사야가 그에게 명한 대로입니다
  alternatives_korean:
  - 예언자 이사야가 그를 명령한 대로입니다
  - 이사야 예언자가 그에게 지시한 대로입니다
  lexicon: HALOT
  rationale: 히브리어는 이사야의 명령 대상이 히스기야임을 분명히 하므로, 그 구조를 그대로 따랐습니다. ‘명한 대로’는 מקור의 강한 명령성을 살립니다.
- source_word: המהלל בנביאים / ὁ μέγας καὶ πιστὸς ἐν ὁράσει αὐτοῦ
  english_pob_choice: the one praised among the prophets
  chosen_korean: 예언자들 가운데서 칭송받는 사람이었습니다
  alternatives_korean:
  - 예언자들 가운데서 찬양받는 사람이었습니다
  - 예언자들 가운데서 칭송된 사람이었습니다
  lexicon: HALOT; Greek parallel
  rationale: 히브리어 본문은 ‘예언자들 가운데서 칭송받는’이라는 압축된 수동 표현이고, 그리스어는 ‘큰 예언자이며 그의 환상에서 신실한 자’로 다르게 전합니다. 본문은 히브리어를 따르되, 수동의 평가를 자연스러운 한국어로 풀었습니다.
theological_decisions:
- issue: 히브리어와 그리스어 평행본의 ‘야훼께서 보시기에’ 여부
  chosen_reading: 본문에는 ‘야훼께서 보시기에 좋은 일’의 의미를 포함했습니다.
  alternative_readings:
  - 단순히 ‘좋은 일’로만 번역
  - ‘주님께 기쁨이 되는 일’로 번역
  rationale: 히브리어는 직접적으로 ‘좋은 일’이라 하지만, 그리스어 평행본은 이를 분명히 ‘주님께서 기뻐하시는 것’으로 해석합니다. 본문에서는 히브리어를 기본으로 하되, 구절 전체의 신학적 평가를 오해 없이 드러내기 위해 야훼 지시를 반영했습니다.
  doctrine_reference: 원문 우선 원칙과 평행본문 증거의 조화; 본문 의미를 약화시키지 않되 문헌적 긴장을 보존합니다.
- issue: 이사야에 대한 마지막 수식구의 상이한 전승
  chosen_reading: 예언자들 가운데서 칭송받는 사람
  alternative_readings:
  - 그의 환상에서 신실한 큰 예언자
  - 큰 예언자이며 그의 환상에서 신실한 사람
  rationale: 히브리어와 그리스어가 실질적으로 다르므로, 본문은 히브리어 전승을 따르고 그리스어 차이는 주석적 대안으로 남겨야 합니다.
  doctrine_reference: 중요한 본문 차이는 평탄화하지 않고 보존한다는 번역 원칙.
