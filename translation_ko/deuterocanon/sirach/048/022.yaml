revisions:
- from: 히스기야는 야훼께서 보시기에 좋은 일을 했고, 다윗의 길에서 굳세게 걸었으니, 예언자 이사야가 그에게 명한 대로입니다. 그는 예언자들 가운데서 칭송받는 사람이었습니다.[a][b]
  to: 이는 히스기야가 좋은 일을 하였고[a] 다윗의 길에서 굳세었으며, 예언자 이사야가 그에게 명한 대로 하였기 때문입니다. 이사야는 예언자들 가운데서 칭송받는 이였습니다.[b]
  rationale: 히브리어를 본문 번역의 기준으로 삼아 그리스어에만 있는 ‘주님께서 보시기에’라는 표현을 삭제했습니다. 히브리어의 כי는 앞 문맥을 설명하는 접속사이므로 ‘이는 … 때문입니다’로 자연스럽게 반영했습니다. ויחזק בדרכי דוד의 다소 압축된 표현은 ‘다윗의 길에서 굳세었으며’로 보존했고, 이사야에 대한 마지막 동격 수식은 별도 문장에서 명시했습니다. 두 중요한 히브리어-그리스어 차이는 համապատասխան 각주에 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T19:21:45Z'
