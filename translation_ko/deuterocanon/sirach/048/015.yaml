base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/048/015.yaml
  text: Yet for all this the people did not turn back[a], and they did not cease from their sins[c][b], until they were uprooted from their land and were scattered throughout the earth.
  footnotes:
  - marker: a
    text: Or 'did not repent.' The Hebrew says 'did not turn back,' while the Greek parallel explicitly uses 'repent.'
    reason: lexical_alternative
  - marker: b
    text: Or 'were scattered in every land.' The Hebrew 'throughout all the earth/land' can denote broad dispersion among many lands.
    reason: alternative_reading
  - marker: c
    text: 'The Greek parallel continues beyond the extant Hebrew here: ''and the people were left very few, and a ruler in the house of David.'' This draft follows the surviving Hebrew as the primary text.'
    reason: textual_variant
translation:
  language: ko
  text: 그럼에도 불구하고 백성은 돌이키지 않았고, 자기들의 죄에서 떠나지 않았습니다. 마침내 그들은 자기들의 땅에서 뽑혀 나가 온 땅에 흩어졌습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘회개하지 않았고’. 히브리어는 문자적으로 ‘돌이키지 않았다’고 말하고, 그리스어 평행본문은 ‘회개하다’를 분명히 사용합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘모든 땅에 흩어졌다’. 히브리어의 בכל הארץ는 ‘온 땅’ 또는 ‘모든 땅/나라’로도 이해될 수 있습니다.
    reason: alternative_reading
  - marker: c
    text: 그리스어 평행본문은 여기서 더 이어져 ‘그리고 백성은 매우 적게 남았고, 다윗의 집에 통치자가 있었다’고 말합니다. 이 번역은 남아 있는 히브리어 본문을 따릅니다.
    reason: textual_variant
lexical_decisions:
- source_word: בכל זאת
  english_pob_choice: Yet for all this
  chosen_korean: 그럼에도 불구하고
  alternatives_korean:
  - 이 모든 일에도
  - 그럼에도
  lexicon: HALOT
  rationale: 앞선 심판과 경고를 받은 뒤에도 변하지 않았다는 역접을 자연스럽게 살리면서, 문맥의 무게를 유지합니다.
- source_word: לא שב
  english_pob_choice: did not turn back
  chosen_korean: 돌이키지 않았고
  alternatives_korean:
  - 돌아오지 않았고
  - 회개하지 않았고
  lexicon: HALOT
  rationale: שוב의 기본 이미지는 ‘돌이키다/되돌아가다’이므로, 본문은 행동의 전환을 드러내는 표현으로 옮기되, 주해적 해석인 ‘회개하다’는 본문 밖 대안으로 남깁니다.
- source_word: ויפוצו בכל הארץ
  english_pob_choice: and were scattered throughout the earth
  chosen_korean: 온 땅에 흩어졌습니다
  alternatives_korean:
  - 온 나라에 흩어졌습니다
  - 모든 땅에 흩어졌습니다
  lexicon: HALOT
  rationale: פוץ는 흩어지다/퍼지다의 뜻이므로 ‘흩어졌습니다’가 직접적입니다. בכל הארץ는 히브리어의 ארץ가 ‘땅/나라/세상’ 모두 가능하므로, 여기서는 넓은 분산을 살리는 ‘온 땅’으로 처리했습니다.
theological_decisions:
- issue: ‘돌이키다’와 ‘회개하다’의 관계
  chosen_reading: 본문에는 ‘돌이키지 않았고’라고 두고, 회개 의미는 내포된 것으로만 유지했습니다.
  alternative_readings:
  - 회개하지 않았고
  - 돌아오지 않았고
  rationale: 히브리어 원문의 שוב은 구체적 방향 전환의 이미지를 가지며, 그리스어 평행본문의 μετανοέω는 도덕적 회개를 분명히 합니다. 본문은 히브리어 이미지를 우선 살리되, 의미를 약화시키지 않도록 했습니다.
  doctrine_reference: 'DOCTRINE.md: 원어 우선, 의미는 보존하되 과도한 신학적 설명은 본문에 주입하지 않음'
