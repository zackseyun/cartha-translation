  naturalness: ‘기름부어 세우고’와 뒤의 ‘후계자로 세웠습니다’는 ‘세우다’가 중복되고, 앞 구문은 기름 붓기 자체를 임명으로 과도하게 풀어냅니다. ‘기름을 부으시고’가 현대 한국어에서 자연스럽고 원문에도 더 가깝습니다. 원문의 2인칭 소유 접미사를 반영하도록 주어를 생략하고 ‘당신의’만 유지했습니다.
