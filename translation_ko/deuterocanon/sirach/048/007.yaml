translation:
  language: ko
  text: 그는 보복을 위한 한 사람을 기름부어 세우고, 한 예언자를 당신의 후계자로 세웠습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '그리스어 평행본문: ''시내에서 책망을 듣고, 호렙에서 보복의 심판을 들었다.'' 남아 있는 히브리어는 이곳에서 그리스어 전승과 상당히 다릅니다.'
    reason: alternative_reading
  - marker: b
    text: 히브리어의 '보복을 위한 한 사람'은 합성된 제나사 문서 본문에서 다소 난해하므로, 문맥상의 뜻을 따라 옮겼습니다.
    reason: textual_variant
