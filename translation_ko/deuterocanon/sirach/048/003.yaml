  text: By his word he restrained the heavens[b][a], and brought down fire three times.
  footnotes:
  - marker: a
    text: 'Greek parallel: ''By the word of the Lord he shut up heaven.'' The Hebrew is more compressed at this point, so the main text follows the surviving Hebrew witness while preserving the Greek''s more explicit wording.'
    reason: alternative_reading
  - marker: b
    text: Literally, 'three fires'; the sense is likely that he brought down fire on three occasions.
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 말씀으로 하늘들을 억제하시고, 불을 세 번 내리셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 병행본문은 ‘주의 말씀으로 그가 하늘을 닫았다’고 더 분명히 말합니다. 히브리어는 이 대목이 더 압축적이므로 본문은 남아 있는 히브리어 증인을 따릅니다.
    reason: alternative_reading
  - marker: b
    text: 직역하면 ‘세 불들’입니다. 의미는 아마도 세 차례에 걸쳐 불을 내리셨다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בדבר
  english_pob_choice: By his word
  chosen_korean: 그의 말씀으로
  alternatives_korean:
  - 말씀으로
  - 그 말씀으로
  lexicon: HALOT
  rationale: 히브리어 ב־는 도구·수단의 뜻을 띠므로 ‘~으로’로 옮기고, 문맥상 엘리야의 발화가 아니라 그의 말의 권위를 드러내기 위해 인칭대명사 ‘그의’를 살렸습니다.
- source_word: עצר
  english_pob_choice: restrained
  chosen_korean: 억제하시고
  alternatives_korean:
  - 막으시고
  - 가두시고
  - 봉쇄하시고
  lexicon: HALOT
  rationale: 동사는 하늘을 ‘붙들어 비를 못 내리게 함’이라는 제어의 뉘앙스를 가지므로, 자연스럽고 강한 한국어 ‘억제하다’가 가장 가깝습니다.
- source_word: שלוש אשות
  english_pob_choice: fire three times
  chosen_korean: 불을 세 번
  alternatives_korean:
  - 세 번의 불을
  - 세 차례 불을
  lexicon: HALOT
  rationale: 직역하면 ‘세 불들’에 가깝지만, 영어 POB가 밝혔듯이 의미는 ‘세 차례에 걸쳐 내린 불’이므로 한국어도 사건 횟수를 드러내는 ‘불을 세 번’으로 옮겼습니다.
theological_decisions:
- issue: 그리스어 병행본문의 ‘주의 말씀’(Κυρίου)을 본문에 직접 반영할지 여부
  chosen_reading: 주체를 히브리어에 따라 간접적으로 두고, 본문은 ‘그의 말씀으로’로 유지했습니다.
  alternative_readings:
  - 주의 말씀으로
  - 야훼의 말씀으로
  rationale: 남아 있는 히브리어 본문이 더 압축적이므로, 본문은 그것을 따라 엘리야의 권위 있는 발화를 유지하고, ‘주의 말씀’은 주석적 대안으로 처리하는 편이 원문 증거에 더 충실합니다.
  doctrine_reference: 원문 우선 원칙과 본문-각주 구분; 병행본문의 해석적 확장 보존
