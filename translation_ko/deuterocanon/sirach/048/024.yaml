  text: By a spirit of might he saw the end[b][a], and he comforted the mourners of Zion.
  footnotes:
  - marker: a
    text: 'Greek: ''in a great spirit he saw the last things.'' The Hebrew reads ''by a spirit of might he saw the end.'''
    reason: alternative_reading
  - marker: b
    text: Or 'those mourning in Zion,' following the Greek parallel more closely.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 용기의 영으로 끝을 보았고, 시온의 애곡하는 이들을 위로했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 “큰 영으로 그는 마지막 것들을 보았다”로 읽습니다. 히브리어는 “용기의 영으로 그는 끝을 보았다”로 읽습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 “시온에서 애곡하는 이들”로도 옮길 수 있으며, 이는 그리스어 평행본문을 더 가깝게 따른 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ברוח גבורה
  english_pob_choice: By a spirit of might
  chosen_korean: 용기의 영으로
  alternatives_korean:
  - 권능의 영으로
  - 능력의 영으로
  - 큰 영으로
  lexicon: HALOT
  rationale: בְּרוּחַ는 수단/영역의 뜻을 살리고, גְּבוּרָה는 단순한 '큰'보다 힘과 용맹의 뉘앙스가 있는 '용기'로 옮겨 자연스럽게 표현했습니다.
- source_word: חזה
  english_pob_choice: he saw
  chosen_korean: 보았고
  alternatives_korean:
  - 환상으로 보았고
  - 예견했고
  - 분별했고
  lexicon: HALOT
  rationale: 예언적 시각을 가질 수 있지만, 기본 의미는 '보다'이므로 과도한 해석을 피하고 직접적으로 옮겼습니다.
- source_word: אחרית
  english_pob_choice: the end
  chosen_korean: 끝을
  alternatives_korean:
  - 미래를
  - 마지막 것을
  - 장래를
  lexicon: HALOT
  rationale: 히브리어의 אחרית는 종말/결말/후일을 가리킬 수 있으므로, 그리스어 평행본문의 τὰ ἔσχατα와도 맞물리는 간결한 '끝'을 선택했습니다.
- source_word: אבלי ציון
  english_pob_choice: the mourners of Zion
  chosen_korean: 시온의 애곡하는 이들
  alternatives_korean:
  - 시온의 슬퍼하는 이들
  - 시온에서 애곡하는 이들
  - 시온의 슬퍼하는 자들
  lexicon: HALOT
  rationale: 히브리어의 소유격 구조를 살리되, 그리스어의 '시온에서 애곡하는 이들'이라는 공간적 뉘앙스도 무리 없이 담기도록 자연스러운 한국어로 옮겼습니다.
theological_decisions:
- issue: '''ברוח גבורה''의 영적/예언적 성격'
  chosen_reading: ‘용기의 영으로’로 옮겨, 예언적 통찰이 강한 영적 능력에 의해 주어졌다는 점을 암시하되 문장 안에서는 과도하게 신학화하지 않았습니다.
  alternative_readings:
  - ‘큰 영으로’
  - ‘권능의 영으로’
  rationale: 히브리어 본문이 주는 역동성과 그리스어의 '큰 영' 전승을 함께 존중하되, 본문이 명시하지 않은 추가 신학 개념은 넣지 않았습니다.
  doctrine_reference: 원문 우선 원칙; 번역은 가능한 한 본문이 허용하는 범위에서만 함의를 드러냄.
