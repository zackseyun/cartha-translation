translation:
  language: ko
  text: 죽은 이를 죽음에서, 그리고 스올에서, 야훼의 뜻에 따라 일으키신 분입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 병행문은 '지극히 높으신 이의 말씀으로'라고 읽습니다. 히브리어 증인은 '야훼의 뜻에 따라'라고 읽습니다.
    reason: textual_variant
lexical_decisions:
- source_word: המקים
  english_pob_choice: who raised up
  chosen_korean: 일으키신 분
  alternatives_korean:
  - 다시 살리신 분
  - 일으켜 세우신 분
  - 살려 내신 분
  lexicon: HALOT
  rationale: 히필 분사형의 행위성을 살리되, 문맥상 죽은 이를 다시 생명으로 되돌린 뜻이므로 한국어에서는 자연스럽게 '일으키신 분'으로 옮겼습니다.
- source_word: גוע
  english_pob_choice: a corpse / a dead man
  chosen_korean: 죽은 이
  alternatives_korean:
  - 시신
  - 시체
  - 죽은 사람
  lexicon: HALOT
  rationale: 히브리어는 이미 죽은 존재를 가리키며, 한국어에서는 '죽은 이'가 육체적 잔해보다 인물 지시를 보존하면서도 원문의 죽음 상태를 드러냅니다.
- source_word: ומשאול
  english_pob_choice: and from Sheol
  chosen_korean: 그리고 스올에서
  alternatives_korean:
  - 그리고 음부에서
  - 그리고 무덤에서
  - 그리고 저승에서
  lexicon: HALOT
  rationale: 지하 세계를 가리키는 히브리어 고유 개념을 살리기 위해 음역형 '스올'을 유지했습니다. '무덤'은 범위를 좁히고, '저승'은 후대 한국어 종교어감이 강합니다.
- source_word: כרצון יהוה
  english_pob_choice: by the will of Yahweh
  chosen_korean: 야훼의 뜻에 따라
  alternatives_korean:
  - 야훼의 뜻대로
  - 야훼의 의지에 따라
  - 주님의 뜻에 따라
  lexicon: HALOT
  rationale: כרצון은 '뜻/기쁨/의지'의 범위를 가지므로, 본문 맥락에서는 '뜻에 따라'가 원문의 유연한 의미를 보존합니다. 프로젝트 원칙에 따라 신성호칭 יהוה는 '야훼'로 옮겼습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행문의 문구 차이
  chosen_reading: 본문에는 히브리어의 '야훼의 뜻에 따라'를 따르고, 그리스어의 '지극히 높으신 이의 말씀으로'는 주석으로 남깁니다.
  alternative_readings:
  - 지극히 높으신 이의 말씀으로
  - 주님의 말씀으로
  rationale: 이 절은 치유/소생의 기원이 '뜻'인지 '말씀'인지에 따라 신학적 강조가 달라지므로, 히브리어 증거를 본문에 반영하고 그리스어 병행은 숨기지 않고 보존하는 편이 공정합니다.
  doctrine_reference: 원문 우선 원칙; 본문 변이의 신학적 긴장 보존
