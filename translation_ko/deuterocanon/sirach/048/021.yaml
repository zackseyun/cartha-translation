translation:
  language: ko
  text: 그는 앗시리아의 진영을 치고, 역병으로 그들을 혼란에 빠뜨리셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '그리스어: “그의 천사가 그들을 멸망시켰다.”'
