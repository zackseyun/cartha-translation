    reason: alternative_reading
lexical_decisions:
- source_word: ויך
  english_pob_choice: He struck
  chosen_korean: 그는 … 치고
  alternatives_korean:
  - 그는 … 치셨습니다
  - 그는 … 때리셨습니다
  - 그는 … 치셨다
  lexicon: HALOT
  rationale: נכה의 기본적 의미는 ‘치다/치다, 치명타를 가하다’이므로, 현대 한국어에서 직접적이고 힘 있는 표현인 ‘치고’로 옮겼습니다.
- source_word: מחנה אשור
  english_pob_choice: the camp of Assyria
  chosen_korean: 앗시리아의 진영
  alternatives_korean:
  - 앗시리아의 캠프
  - 앗시리아 진영
  - 앗시리아 군대
  lexicon: HALOT
  rationale: מחנה는 군사적 ‘진영’이 자연스럽고, 영어 POB의 ‘camp’보다 한국어 성경 문맥에서 더 정확하게 작동합니다.
- source_word: ויהמם
  english_pob_choice: threw it into confusion
  chosen_korean: 혼란에 빠뜨리셨습니다
  alternatives_korean:
  - 혼란에 몰아넣으셨습니다
  - 두렵게 하셨습니다
  - 소란에 빠뜨리셨습니다
  lexicon: HALOT
  rationale: הםם의 사역적 의미는 ‘혼란시키다, 패닉에 빠뜨리다’이므로, 결과 상태를 분명히 드러내는 ‘혼란에 빠뜨리셨습니다’를 택했습니다.
- source_word: במגפה
  english_pob_choice: with a plague
  chosen_korean: 역병으로
  alternatives_korean:
  - 전염병으로
  - 재앙으로
  - 역병과 함께
  lexicon: HALOT
  rationale: מגפה는 단순한 질병보다 재난적 유행병/역병의 뉘앙스가 강해, 한국어 성경 문체에서 자연스러운 ‘역병으로’가 가장 적합합니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행본문의 차이
  chosen_reading: 본문은 히브리어를 따라 ‘역병으로 그들을 혼란에 빠뜨리셨습니다’로 두고, 그리스어의 ‘그의 천사가 그들을 멸망시켰다’는 대안으로 보존합니다.
  alternative_readings:
  - 그의 천사가 그들을 멸망시켰습니다
  - 그의 천사가 그들을 파멸시켰습니다
  rationale: 이 절에서는 현존 히브리어가 높은 신뢰도의 주본문이므로 이를 우선하되, 그리스어 전승이 추가하는 천사 매개 파괴 모티프는 삭제하지 않고 각주로 남겨 해석상의 긴장을 보존합니다.
  doctrine_reference: 원어 우선 원칙; 본문 전승 간 신학적 긴장 보존
