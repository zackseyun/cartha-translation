lexical_decisions:
- source_word: נמוגו
  english_pob_choice: melted
  chosen_korean: 녹아내렸고
  alternatives_korean:
  - 흔들렸고
  - 기운이 빠졌고
  - 무너졌고
  lexicon: HALOT
  rationale: 히브리어의 ‘녹다/풀리다’ 이미지를 살려, 두려움으로 기세가 꺾이는 모습을 자연스럽게 옮겼습니다.
- source_word: בגאון לבם
  english_pob_choice: in the pride of their heart
  chosen_korean: 마음의 교만 속에서
  alternatives_korean:
  - 마음의 자만 속에서
  - 마음이 부푼 채로
  - 마음의 오만 가운데
  lexicon: HALOT
  rationale: גאון은 교만, 자만, 부푼 상태를 아우를 수 있어, 문맥상 내적 자만의 붕괴를 드러내는 ‘마음의 교만’이 가장 균형적입니다.
- source_word: ויחילו
  english_pob_choice: they writhed
  chosen_korean: 몸부림쳤습니다
  alternatives_korean:
  - 떨었습니다
  - 해산의 고통을 겪었습니다
  - 괴로워했습니다
  lexicon: HALOT
  rationale: 다음 절의 출산 비유와 겹치지 않으면서도, 단순한 떨림보다 더 강한 육체적 고통과 뒤틀림을 살렸습니다.
- source_word: כיולדה
  english_pob_choice: like a woman giving birth
  chosen_korean: 해산하는 여인처럼
  alternatives_korean:
  - 아이를 낳는 여인처럼
  - 출산하는 여인처럼
  - 산통하는 여인처럼
  lexicon: HALOT
  rationale: 히브리어의 출산 비유를 직설적으로 반영하되, 현대 한국어에서 자연스럽고 또렷한 표현을 택했습니다.
theological_decisions:
- issue: Greek parallel versus Hebrew main reading
  chosen_reading: 본문은 히브리어의 ‘마음의 교만’과 ‘해산하는 여인처럼’이라는 이미지를 따르고, 그리스어 평행본문의 ‘마음과 손’은 주석적 대안으로만 반영하지 않았습니다.
  alternative_readings:
  - 그때 그들의 마음과 손이 흔들렸고, 해산하는 여인처럼 고통했습니다.
  rationale: 이 절의 주된 사본 증거는 히브리어이며, POB의 영어 본문도 히브리어를 따릅니다. 따라서 본문은 히브리어 이미지를 유지하고, 그리스어는 평행 증거로만 취급하는 것이 맞습니다.
  doctrine_reference: 사본 증거 우선 원칙
