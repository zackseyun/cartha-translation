base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/048/001.yaml
  text: Then a prophet arose like fire[b][a], and his words were like a burning furnace.
  footnotes:
  - marker: a
    text: 'Greek: ''Then Elijah the prophet arose like fire.'' The Hebrew here reads simply ''a prophet arose like fire,'' though the context clearly concerns Elijah.'
    reason: alternative_reading
  - marker: b
    text: 'Greek parallel: ''his word burned like a torch.'' Hebrew: ''his words were like a blazing furnace.'''
    reason: textual_variant
translation:
  language: ko
  text: 그때 한 예언자가 불처럼 일어났고, 그의 말들은 타오르는 화덕과 같았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '그리스어: “엘리야 예언자가 불처럼 일어났다.” 히브리어 본문은 단지 “한 예언자가 불처럼 일어났다”라고 읽습니다.'
    reason: alternative_reading
  - marker: b
    text: '그리스어 병행문: “그의 말은 횃불처럼 타올랐다.” 히브리어 본문은 “그의 말들은 타오르는 화덕과 같았다”라고 읽습니다.'
    reason: textual_variant
lexical_decisions:
- source_word: עד אשר
  english_pob_choice: Then
  chosen_korean: 그때
  alternatives_korean:
  - 그 후
  - 그리하여
  lexicon: HALOT
  rationale: 시간 경과를 나타내는 전환 어구로 읽어 서술 흐름을 자연스럽게 이어 주는 것이 적절합니다.
- source_word: קם
  english_pob_choice: arose
  chosen_korean: 일어났고
  alternatives_korean:
