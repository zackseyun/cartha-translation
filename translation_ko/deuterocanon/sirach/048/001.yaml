base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/048/001.yaml
  text: Then a prophet arose like fire[b][a], and his words were like a burning furnace.
  footnotes:
  - marker: a
    text: 'Greek: ''Then Elijah the prophet arose like fire.'' The Hebrew here reads simply ''a prophet arose like fire,'' though the context clearly concerns Elijah.'
    reason: alternative_reading
  - marker: b
    text: 'Greek parallel: ''his word burned like a torch.'' Hebrew: ''his words were like a blazing furnace.'''
    reason: textual_variant
translation:
  language: ko
  text: 그때 한 예언자가 불처럼 일어났고, 그가 한 말은 타오르는 화덕 같았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '그리스어: “그때 예언자 엘리야가 불처럼 일어났다.” 히브리어 본문은 단지 “한 예언자가 불처럼 일어났다”라고 읽습니다.'
    reason: alternative_reading
  - marker: b
    text: '그리스어 병행 본문: “그의 말은 횃불처럼 타올랐다.” 히브리어 본문은 “그가 한 말은 타오르는 화덕 같았다”라고 읽습니다.'
    reason: textual_variant
lexical_decisions:
- source_word: עד אשר
  english_pob_choice: Then
  chosen_korean: 그때
  alternatives_korean:
  - 그 후
  - 그리하여
  lexicon: HALOT
  rationale: 시간 경과를 나타내는 전환 어구로 읽어 서술 흐름을 자연스럽게 이어 주는 것이 적절합니다.
- source_word: קם
  english_pob_choice: arose
  chosen_korean: 일어났고
  alternatives_korean:
  - 일어섰고
  - 나타났고
  lexicon: HALOT
  rationale: 예언자의 출현을 표현하는 관용적 동사로, 위엄 있는 발생/등장을 자연스럽게 담습니다.
- source_word: נביא
  english_pob_choice: a prophet
  chosen_korean: 한 예언자
  alternatives_korean:
  - 예언자 한 사람
  - 한 선지자
  lexicon: HALOT
  rationale: 히브리어의 부정관사적 표현을 살려 특정 인물을 이름 없이 제시하되, 문맥상 엘리야를 가리키는 점은 각주로 보완합니다.
- source_word: כתנור בוער
  english_pob_choice: a burning furnace
  chosen_korean: 타오르는 화덕
  alternatives_korean:
  - 불타는 용광로
  - 타는 화로
  lexicon: HALOT
  rationale: תנור는 화덕/화로 계열이므로, 불길의 강렬함을 살리면서도 지나치게 현대 산업적 이미지가 되지 않도록 '화덕'을 택했습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행문의 인물 식별 차이
  chosen_reading: 본문에는 이름을 넣지 않고 '한 예언자'로 두었습니다.
  alternative_readings:
  - 엘리야 예언자가 일어났고
  rationale: 히브리어 본문은 이름 없이 말하지만 그리스어는 엘리야를 명시하므로, 본문에는 히브리어를 따르고 각주로 그 차이를 보존하는 것이 적절합니다.
  doctrine_reference: 원문 우선 원칙과 본문 전승의 투명성
