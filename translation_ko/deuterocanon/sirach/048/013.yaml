  source_fidelity: 히브리어 본문을 우선할 때 마지막 콜론은 난해하지만, 현존 독법의 어순과 모호성을 보존한 번역이 가능합니다. 초안의 ‘그의 육체는 그 아래서 지어졌습니다’는 의미상 불투명한 점 자체는 반영하나, 한국어 어순상 ‘그 아래서’의 수식 관계가 지나치게 어색합니다. 또한 כל בשר는 여기서 문자적 ‘육체’보다 ‘어떤 사람도/어떤 인간도’로 옮기는 편이 관용적 의미에 충실합니다. 그리스어 평행 본문의 대안 독법은 각주에서 밝혀야 합니다.
  naturalness: ‘어떤 육체도 그의 영을 지배하지 못했습니다’는 한국어에서 육체가 행위 주체처럼 들려 자연스럽지 않습니다. ‘어떤 말도 그에게는 너무 놀랍지 않았고’도 부정 범위가 다소 어색합니다. 문장을 현대 표준어 합쇼체로 다듬고, 각주 표지를 해당 어구에 붙였습니다.
  terminology: רוּחַ는 이 문맥에서 인물의 정신·의지를 가리키므로 ‘영’은 유지할 수 있습니다. כל בשר는 ‘어떤 사람도’로 번역해 히브리어 관용을 자연스럽게 전달했습니다. דבר는 본문에서 ‘말’로 유지하고, ‘일/사안’이라는 대안을 각주로 제시했습니다.
