translation:
  language: ko
  text: 그의 시대에는 누구 앞에서도 떨지 않았고, 어떤 육체도 그의 영을 지배하지 못했습니다. 어떤 말도 그에게는 너무 놀랍지 않았고, 그의 육체는 그 아래서 지어졌습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew for the final colon is difficult and may reflect a textual problem; the Greek parallel is clearer and reads, ‘and in sleep his body prophesied.’
    reason: textual_variant
  - marker: b
    text: Hebrew davar can mean ‘word’ or ‘matter.’
    reason: lexical_alternative
lexical_decisions:
- source_word: מימיו
  english_pob_choice: In his days
  chosen_korean: 그의 시대에는
  alternatives_korean:
  - 그의 생애 동안에는
  - 그가 살던 날에는
  lexicon: HALOT
  rationale: 시간을 가리키는 관용구로서 인물의 활동 기간을 자연스럽게 드러내기 위해 ‘그의 시대에는’로 옮겼습니다.
- source_word: לא זע מכל
  english_pob_choice: he did not tremble before anyone
  chosen_korean: 누구 앞에서도 떨지 않았고
  alternatives_korean:
  - 어떤 것에도 흔들리지 않았고
  - 아무 앞에서도 흔들리지 않았고
  lexicon: HALOT
  rationale: זע/זוע의 핵심은 떨림·동요이므로, 엘리야/엘리사의 담대함을 살려 ‘누구 앞에서도 떨지 않았고’로 번역했습니다.
- source_word: ולא משל ברוחו כל בשר
  english_pob_choice: and no flesh mastered his spirit
  chosen_korean: 어떤 육체도 그의 영을 지배하지 못했습니다
  alternatives_korean:
  - 어떤 사람도 그의 영을 다스리지 못했습니다
  - 어떤 인간도 그의 영 위에 군림하지 못했습니다
  lexicon: HALOT
  rationale: ‘모든 육체’는 인간 전체를 가리키는 관용이지만, 한국어에서는 ‘어떤 육체도’가 낯설어 ‘어떤 육체도…지배하지 못했습니다’로 의미를 보존했습니다. 여기서 רוּחַ는 인물의 내적 영으로 처리했습니다.
- source_word: כל דבר לא נפלא ממנו
  english_pob_choice: No word was too wondrous for him
  chosen_korean: 어떤 말도 그에게는 너무 놀랍지 않았고
  alternatives_korean:
  - 어떤 일도 그에게는 너무 신비롭지 않았고
  - 어떤 것도 그에게는 너무 기이하지 않았고
  lexicon: HALOT
  rationale: 히브리어 דבר의 ‘말/사안’ 중 영어 POB가 ‘word’를 택한 점을 반영해 ‘말’로 두되, נפלא의 의미를 살려 ‘너무 놀랍지 않았고’로 옮겼습니다.
- source_word: ומתחתיו נברא בשרו
  english_pob_choice: and beneath him his flesh was created
  chosen_korean: 그의 육체는 그 아래서 지어졌습니다
  alternatives_korean:
  - 그의 육체는 그 밑에서 창조되었습니다
  - 그 아래에서 그의 살이 지어졌습니다
  lexicon: HALOT
  rationale: 마지막 행은 현존 히브리어를 따라 불투명한 의미를 보존했습니다. ‘그 아래서’는 מתחתיו의 방향성을 살리되, 한국어에서 가장 덜 추측적인 표현으로 처리했습니다.
theological_decisions:
- issue: 마지막 행의 난해한 본문 처리
  chosen_reading: 히브리어 사본의 현행 독법을 기본으로 두어 ‘그의 육체는 그 아래서 지어졌습니다’라고 옮겼습니다.
  alternative_readings:
  - 그리스어 평행본을 따라 ‘그의 육체는 잠들어 있는 동안 예언했습니다’로 옮길 수 있습니다.
  - 본문을 더 적극적으로 교정해 영적 현상으로 해석할 수 있습니다.
  rationale: 이 절의 히브리어는 난해하며, 영어 POB도 본문상의 문제를 각주로 인정합니다. 한국어 본문은 과도한 조화를 피하고 텍스트의 불확실성을 드러내는 쪽이 더 소스-정직적입니다.
  doctrine_reference: Sirach 48:13 textual problem; preserve source uncertainty honestly while prioritizing extant Hebrew where possible.
