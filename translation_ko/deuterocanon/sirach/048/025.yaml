base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/048/025.yaml
  text: He declared what would be forever[b][a], and hidden things before they came.
  footnotes:
  - marker: a
    text: Or 'forever' or 'to the end of the age' for 'until eternity.' The Hebrew עד עולם and Greek ἕως τοῦ αἰῶνος both express an unbounded future span.
    reason: lexical_alternative
  - marker: b
    text: '''Hidden things'' could also be rendered ''secret things'' or ''concealed things.'' The Greek parallel has ''the hidden things'' (τὰ ἀπόκρυφα).'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 영원까지 올 일을 알리고, 오기 전에 숨은 것들을 알려 주었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘영원까지’는 히브리어 עד עולם과 그리스어 ἕως τοῦ αἰῶνος가 가리키는 ‘끝없는 미래’를 살린 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘숨은 것들’은 ‘숨겨진 것들’이나 ‘비밀한 것들’로도 옮길 수 있습니다. 그리스어 평행본문은 τὰ ἀπόκρυφα입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עד עולם
  english_pob_choice: until eternity
  chosen_korean: 영원까지
  alternatives_korean:
  - 영원히
  - 끝없는 때까지
  - 세상 끝까지
  lexicon: HALOT
  rationale: 히브리어의 ‘until + eternity/age’ 구조를 살려, 단순한 관용어 ‘영원히’보다 범위감이 드러나는 ‘영원까지’로 옮겼습니다.
- source_word: הגיד
  english_pob_choice: declared
  chosen_korean: 알리고
  alternatives_korean:
  - 선언하고
  - 말하고
  - 알려 주고
  lexicon: HALOT
  rationale: 예언적 맥락에서 단순 진술보다 ‘알리다’가 더 자연스럽고, 원문의 공적·계시적 전달을 유지합니다.
- source_word: נהיות
  english_pob_choice: what would be
  chosen_korean: 올 일
  alternatives_korean:
  - 장차 있을 일
  - 다가올 일
  - 장래의 일
  lexicon: HALOT
  rationale: 미래 사건을 가리키는 명사를 한국어에서는 간결하게 ‘올 일’로 살려, 시간적 전개를 자연스럽게 표현했습니다.
- source_word: ונסתרות
  english_pob_choice: hidden things
  chosen_korean: 숨은 것들
  alternatives_korean:
  - 숨겨진 것들
  - 은밀한 것들
  - 비밀한 것들
  lexicon: HALOT
  rationale: 히브리어의 ‘숨겨진/가려진 것들’을 직설적으로 살려, 문맥에 없는 추가 뉘앙스인 ‘비밀한’의 종교적 고어 느낌은 피했습니다.
theological_decisions:
- issue: 예언 지식의 범위 표현
  chosen_reading: ‘영원까지’와 ‘오기 전에’로, 미래와 감추어진 것에 대한 계시를 넓게 표현했습니다.
  alternative_readings:
  - ‘영원히’
  - ‘세상 끝까지’
  - ‘오기 전에’ 대신 ‘일어나기 전에’
  rationale: 이 절은 엘리야에 대한 찬양으로서 예언적 통찰의 광범위를 말하지만, 전지성 교리를 체계화하지는 않습니다. 따라서 원문의 시적 과장을 유지하면서도 과도하게 신학화하지 않도록 했습니다.
  doctrine_reference: 예언적 계시의 범위와 하나님의 주권적 드러내심
