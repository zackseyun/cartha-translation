lexical_decisions:
- source_word: הנלקח
  english_pob_choice: who was taken up
  chosen_korean: 올려지고
  alternatives_korean:
  - 들려 올라가고
  - 데려가심을 받고
  - 올림을 받으시고
  lexicon: HALOT
  rationale: לקח의 수동 분사로서 엘리야 전승의 ‘끌어올려짐’을 반영하되, 현대 한국어에서는 자연스럽게 ‘올려지고’로 옮겼습니다.
- source_word: בסערה
  english_pob_choice: in a storm
  chosen_korean: 폭풍 가운데
  alternatives_korean:
  - 폭풍 속에서
  - 회오리바람 가운데
  - 광풍 가운데
  lexicon: HALOT
  rationale: 히브리어 סערה는 특정한 ‘회오리바람’보다 넓은 ‘폭풍/광풍’의 뜻이 있어, 본문에 충실하게 ‘폭풍 가운데’로 옮겼습니다.
- source_word: מעלה
  english_pob_choice: into the heavens
  chosen_korean: 하늘로
  alternatives_korean:
  - 위로
  - 높은 곳으로
  - 하늘들로
  lexicon: HALOT
  rationale: 문맥상 상승 방향을 가리키며, 영어 POB의 해석처럼 엘리야의 승천을 분명하게 드러내기 위해 ‘하늘로’로 옮겼습니다.
- source_word: ובגדודי אש
  english_pob_choice: and in ranks of fire
  chosen_korean: 불의 무리 가운데
  alternatives_korean:
  - 불의 대열 가운데
  - 불의 떼 가운데
  - 불의 군대 가운데
  lexicon: HALOT
  rationale: גדודים는 ‘무리/대열/부대’의 뜻이므로, 그리스어 병행문의 ‘불 말의 병거’로 과도하게 구체화하지 않고 히브리어 증거를 따라 ‘불의 무리 가운데’로 옮겼습니다.
theological_decisions:
- issue: 히브리어 본문을 따를지, 그리스어 병행문이 더 분명한 엘리야 전승을 본문에 반영할지
  chosen_reading: 본문에는 히브리어의 간결한 표현을 유지하고, 그리스어의 더 자세한 형태는 본문 밖에서만 참고하도록 했습니다.
  alternative_readings:
  - 불의 병거와 불말들 가운데
  - 불의 병거 가운데
  rationale: 이 절은 남아 있는 히브리어 증거를 우선해야 하며, 전승적으로 잘 알려진 열왕기하 2:11의 표현으로 본문을 맞추면 히브리어 사료의 긴장이 사라집니다. 따라서 ‘병거/불말’은 본문에 넣지 않았습니다.
  doctrine_reference: 원문 우선 원칙; 보존된 히브리어 사본의 증거를 번역 본문에서 우선함.
