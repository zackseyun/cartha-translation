translation:
  language: ko
  text: 엘리야여, 당신은 얼마나 경외할 만한 분이십니까![a] 누가 당신처럼 자랑할 수 있습니까?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 병행문은 ‘엘리야여, 당신의 놀라운 일들로 얼마나 영광을 받으셨습니까! 그리고 누가 당신처럼 자랑할 수 있습니까?’라고 읽습니다. 그러나 히브리어는 더 직접적으로 ‘엘리야여, 당신은 얼마나 경외할 만한 분이십니까!’라고 말합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: מה נורא
  english_pob_choice: How fearsome
  chosen_korean: 얼마나 경외롭습니까
  alternatives_korean:
  - 얼마나 두렵습니까
  - 얼마나 놀랍습니까
  - 얼마나 두려운 분이십니까
  lexicon: HALOT
  rationale: מה의 감탄문과 נורא의 ‘경외를 불러일으키는’ 뉘앙스를 살려, 단순한 ‘멋지다/놀랍다’보다 경외와 두려움이 함께 있는 표현으로 옮겼습니다.
- source_word: אתה
  english_pob_choice: you are
  chosen_korean: 당신처럼
  alternatives_korean:
  - 당신은
  - 당신이
  - 당신은 참
  lexicon: Hebrew grammar
  rationale: 히브리어는 계사 없는 감탄문이므로 한국어에서도 과도한 과거화 없이 현재적 감탄으로 처리했습니다.
- source_word: אליהו
  english_pob_choice: Elijah
  chosen_korean: 엘리야
  alternatives_korean:
  - 엘리야후
  - 엘리야 선지자
  lexicon: proper noun standard
  rationale: 히브리어 인명 אֵלִיָּהוּ의 표준 한국어 음역을 따랐습니다.
- source_word: ואשר כמוך יתפאר
  english_pob_choice: And who like you can boast?
  chosen_korean: 당신처럼 자랑할 자가 누구입니까?
  alternatives_korean:
  - 누가 당신처럼 자랑할 수 있습니까?
  - 누가 당신처럼 자랑하겠습니까?
  - 당신과 같은 이가 누가 자랑할 수 있습니까?
  lexicon: HALOT
  rationale: יתפאר의 기본 뜻인 ‘자랑하다/스스로를 자랑스러워하다’를 살리되, 수사적 질문 구조를 한국어에서 자연스럽게 재현했습니다. 직역형 ‘누가 당신처럼 자랑할 수 있습니까?’도 가능하지만, 문맥의 찬탄을 더 분명히 드러내기 위해 ‘자랑할 자가’로 다듬었습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행문의 긴장
  chosen_reading: 히브리어의 경외감(נורא)을 본문으로 살리되, 그리스어의 ‘영광받다’는 뜻은 수사적 칭찬의 배경으로만 참고했습니다.
  alternative_readings:
  - 얼마나 영광스럽게 되셨습니까, 엘리야여!
  - 얼마나 영화로우십니까, 엘리야여!
  rationale: 이 구절은 살아남은 히브리어가 ‘경외롭다’는 감탄을, 그리스어는 ‘영광을 받다’는 방향을 보여 줍니다. POB 원칙에 따라 히브리어의 독특한 어조를 보존했습니다.
  doctrine_reference: Translation philosophy §1, source-language primacy with parallel support
