base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/048/012.yaml
  text: Elijah was hidden in the storehouse[a], and Elisha was filled with his spirit. Twice as many signs, and many wonders[b], came from his mouth.
  footnotes:
  - marker: a
    text: 'Greek: ''Elijah, who was covered in a whirlwind.'' The Hebrew witness instead reads ''Elijah was hidden in the storehouse.'''
    reason: textual_variant
  - marker: b
    text: Or 'twice as many signs'; the Hebrew phrase literally says 'double' with reference to the signs, likely echoing Elisha's double portion.
    reason: lexical_alternative
translation:
  language: ko
  text: 엘리야는 창고에 숨겨졌고[a], 엘리사는 그의 영으로 가득 찼습니다. 그는 두 배나 많은 표징을 보였고[b], 그의 입에서 나오는 모든 말에는 기사가 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '그리스어: “엘리야는 회오리바람에 감싸였다.” 히브리어 증언은 대신 “엘리야는 창고에 숨겨졌다”라고 읽습니다.'
    reason: textual_variant
  - marker: b
    text: 또는 “두 배의 표징”. 히브리어 표현은 문자적으로 “두 배”를 뜻하며, 엘리사가 받은 두 몫을 암시할 가능성이 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שבאוצר נסתר
  english_pob_choice: was hidden in the storehouse
  chosen_korean: 창고에 숨겨졌고
  alternatives_korean:
  - 보물창고에 숨겨졌고
  - 감추어졌고
  - 회오리바람에 휩싸였고
  lexicon: HALOT
  rationale: 히브리어 본문은 אוצר를 직역하면 ‘창고/보물창고’이므로, 그 이미지를 살리되 한국어에서는 간결하게 ‘창고’로 옮겼습니다. 그리스어의 ‘회오리바람’ 읽기는 각주로 보존합니다.
- source_word: ונמלא רוחו אלישע
  english_pob_choice: and Elisha was filled with his spirit
  chosen_korean: 엘리사는 그의 영으로 충만해졌습니다
  alternatives_korean:
  - 엘리사는 그의 영으로 채워졌습니다
  - 엘리사는 그의 성령으로 충만해졌습니다
  - 엘리사는 그의 호흡으로 충만해졌습니다
  lexicon: HALOT
  rationale: 대명사 ‘his’는 문맥상 엘리야를 가리키므로 ‘그의 영’으로 옮겼고, 본문이 명시하지 않은 신학적 해석을 피하기 위해 ‘성령’은 쓰지 않았습니다.
- source_word: פי שנים
  english_pob_choice: Twice as many
  chosen_korean: 두 배의 많은
  alternatives_korean:
  - 두 배로 많은
  - 두 배의 표징을
  - 배나 많은
  lexicon: HALOT
  rationale: פי שנים의 핵심은 ‘두 배’이므로 수량 관계를 살리되, 바로 뒤의 ‘표징’과 자연스럽게 이어지도록 한국어에서는 ‘두 배의 많은’으로 처리했습니다.
- source_word: אותות הרבה
  english_pob_choice: many signs
  chosen_korean: 많은 표징
  alternatives_korean:
  - 많은 기적
  - 많은 이적
  - 많은 징조
  lexicon: HALOT
  rationale: אותות는 성경 히브리어에서 흔히 ‘표징’으로 옮기는 것이 가장 직결되며, 뒤의 ‘기사’와의 병렬도 유지합니다.
- source_word: ומופתים
  english_pob_choice: many wonders
  chosen_korean: 많은 기사
  alternatives_korean:
  - 많은 경이
  - 많은 이적
  - 많은 놀라운 일
  lexicon: HALOT
  rationale: מופתים는 기이한 능력 행위를 가리키므로, 한국어 성경 전통과도 맞는 ‘기사’가 적절합니다. ‘표징’과 구별되는 병렬성을 살리기 위해 같은 어휘를 반복하지 않았습니다.
- source_word: כל מוצא פיהו
  english_pob_choice: came from his mouth
  chosen_korean: 그의 입에서 나온
  alternatives_korean:
  - 그의 입에서 나오는
  - 그의 입에서 나간
  - 그가 말할 때마다 나온
  lexicon: HALOT
  rationale: 직역하면 ‘입에서 나오는 모든 것’에 가까우나, 한국어에서는 ‘그의 입에서 나온’으로 압축해 발화의 출처를 살렸습니다.
theological_decisions:
- issue: 첫 행의 엘리야 출발 묘사에 대한 본문 차이
  chosen_reading: 히브리어 본문을 따라 ‘창고에 숨겨졌고’로 본문을 두었습니다.
  alternative_readings:
  - 그리스어를 따라 ‘회오리바람에 휩싸였고’로 옮김
  rationale: 시락서에서는 현존 히브리어 본문을 우선하되, 그리스어 전승의 의미 있는 차이는 각주로 보존하는 것이 원문 충실성과 검증 가능성을 함께 지키는 방식입니다.
  doctrine_reference: 'PHILOSOPHY.md: 히브리어가 보존된 경우 히브리어 본문 우선, 그리스어 병행본은 대조 입력으로 활용'
- issue: 엘리사에게 ‘그의 영’이 채워졌다는 표현의 신학적 범위
  chosen_reading: 엘리야의 영이 엘리사에게 منتقل/계승되었다는 의미로만 유지했습니다.
  alternative_readings:
  - 더 강한 성령론적 의미로 ‘성령’이라 이해
  - 예언적 은사 전수로 제한
  rationale: 대명사와 문맥상 엘리야를 가리키는 것이 가장 자연스러우며, 본문이 직접 말하지 않는 신학적 확장을 피해야 합니다.
  doctrine_reference: 'DOCTRINE.md: 본문이 말하지 않는 신학적 강화를 피하고 긴장을 보존'
