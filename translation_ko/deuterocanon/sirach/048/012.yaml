  source_fidelity: 첫 절과 엘리야의 영에 관한 번역은 히브리어 증언을 충실히 따릅니다. 그러나 후반부는 히브리어의 압축된 병렬 표현을 ‘그가 … 기사를 행했다’로 재구성하면서, ‘그의 입에서 나오는 모든 것’(כל מוצא פיהו)의 범위를 ‘그가 행한 기사’로 바꾸었습니다. 또한 ‘두 배의 많은’은 현대 한국어에서 비문에 가깝습니다.
  naturalness: ‘두 배의 많은 표징과, 그의 입에서 나온 많은 기사를 행했습니다’는 수식 관계와 목적어 병렬이 어색합니다. ‘두 배나 많은 표징을 보였고, 그의 입에서 나오는 모든 말에는 기사가 있었습니다’로 하면 합쇼체의 자연스러움을 유지하면서 원문의 두 절을 분명히 살릴 수 있습니다.
  terminology: ‘창고’, ‘그의 영’, ‘표징’, ‘기사’는 적절합니다. ‘성령’으로 대문자화하거나 신학적으로 한정하지 않은 점도 좋습니다. ‘두 몫’은 각주에서 암시 가능성으로만 언급하는 것이 적절합니다.
