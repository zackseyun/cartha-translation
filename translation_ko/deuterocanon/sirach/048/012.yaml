    rationale: 히브리어는 문자적으로 ‘그의 입에서 나오는 모든 것’을 가리키며, 기사가 그의 발화와 결부됨을 말합니다. 행위 동사 ‘행했습니다’는 이 발화 이미지를 지웁니다.
