translation:
  language: ko
  text: 그의 생전에는 놀라운 일들을 행하셨고, 그가 죽을 때에도 그가 하신 일들은 놀라웠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어를 더 가깝게 따르면 “그의 마지막 때에 그가 하신 일들은 놀라웠습니다”로 옮길 수 있습니다. 히브리어는 “그의 죽음에”라고 읽습니다. 마지막 절의 히브리어 형태는 다소 어렵지만, 그리스어는 그의 죽음 또는 마지막 때와 관련하여 경이로운 일들이 있었다는 뜻을 뒷받침합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: בחייו
  english_pob_choice: In his life
  chosen_korean: 그의 생전에는
  alternatives_korean:
  - 그의 삶 동안에는
  - 그가 살아 있는 동안에는
  lexicon: HALOT
  rationale: ב + חַיִּים의 시간적 용법을 자연스러운 현대 한국어로 옮기되, 인물의 활동 기간을 가리키는 문맥을 살려 ‘생전’으로 간결하게 표현했습니다.
- source_word: עשה נפלאות
  english_pob_choice: he did wonders
  chosen_korean: 놀라운 일들을 행하셨고
  alternatives_korean:
  - 기적들을 행하셨고
  - 놀라운 일들을 하셨고
  lexicon: HALOT
  rationale: נפלאות는 단순한 ‘행동’이 아니라 경탄을 불러일으키는 일들을 가리키므로 ‘놀라운 일들’로 옮겼고, 시적 문맥에 맞게 ‘행하셨고’를 택했습니다.
- source_word: ובמותו
  english_pob_choice: and in his death
  chosen_korean: 그의 죽음에는
  alternatives_korean:
  - 그의 죽음 가운데
  - 그가 죽을 때에는
  lexicon: HALOT
  rationale: 히브리어의 직접적인 전치사구를 유지하면서도 한국어에서 자연스러운 시간 부사어로 처리했습니다.
- source_word: תמהי מעשה
  english_pob_choice: his works were marvelous
  chosen_korean: 그의 업적들이 놀랍습니다
  alternatives_korean:
  - 그의 일들이 놀랍습니다
  - 그의 행적이 놀랍습니다
  lexicon: HALOT
  rationale: 형태가 다소 어려운 히브리어와 그리스어의 θαυμάσια τὰ ἔργα αὐτοῦ를 함께 반영해, 집합적 의미의 מעשה를 ‘업적들’로 풀어 현대 독자가 이해하기 쉽게 했습니다.
theological_decisions:
- issue: 히브리어 본문 우선과 그리스어 병행본의 보정 관계
  chosen_reading: 히브리어의 ‘그의 죽음에는’ 구조를 유지하되, 그리스어가 뒷받침하는 ‘놀라운/경탄할 만한’ 의미를 한국어로 명확히 드러냈습니다.
  alternative_readings:
  - 그의 끝에서 그의 업적들이 놀랍습니다
  - 그의 죽음에서 그의 일들이 놀랍습니다
  rationale: 집회서의 살아 있는 히브리어 증거를 기본으로 하면서, अंतिम 절의 어려운 형식을 그리스어가 확증하는 의미 범위 안에서 번역했습니다. 따라서 본문을 과도하게 평탄화하지 않되, 의미는 안정적으로 전달했습니다.
  doctrine_reference: 'PHILOSOPHY.md: translate Sirach from Hebrew where it survives; use Greek parallel as confirmatory witness'
