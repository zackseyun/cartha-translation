  rationale: 과거 서술의 시제를 일관되게 바로잡고, 원문의 넓고 중립적인 ‘일/행위’의 뜻을 보존하도록 ‘업적들’을 ‘그가 하신 일들’로 수정했습니다. 히브리어의 ‘그의 죽음에’라는 다소 어려운 표현은 본문에서 자연스러운 ‘그가 죽을 때에도’로 옮기고, 그리스어의 ‘마지막 때’ 대안과 본문상의 불확실성은 각주에 유지했습니다.
