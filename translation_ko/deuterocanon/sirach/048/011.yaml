translation:
  language: ko
  text: 당신을 본 사람은 죽었고 복이 있습니다[a]. 당신도 복이 있습니다. 당신은 반드시 살 것이기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '그리스어 병행본문: “당신을 본 이들과 사랑으로 단장된 이들은 복이 있습니다. 우리도 또한 살 것이기 때문입니다.” 히브리어 증인은 “그리고 당신도 복이 있습니다. 당신은 반드시 살 것이기 때문입니다.”라고 읽습니다.'
    reason: alternative_reading
lexical_decisions:
- source_word: אשרי
  english_pob_choice: Happy is / happy are
  chosen_korean: 행복합니다
  alternatives_korean:
  - 복됩니다
  - 복이 있습니다
  lexicon: HALOT
  rationale: 히브리어 אשרי의 축복-행복 선언을 현대 한국어에서 자연스럽게 살리되, 교회적 상투어보다 직접적이고 문맥에 맞는 표현을 택했습니다.
- source_word: ראך
  english_pob_choice: saw you
  chosen_korean: 당신을 본
  alternatives_korean:
  - 당신을 보신
  - 당신을 보았던
  lexicon: HALOT
  rationale: ראה의 완료형을 단순 과거로 옮겨, 대상인 엘리야를 직접 본 사실을 간결하게 드러냈습니다.
- source_word: ומת
  english_pob_choice: and died
  chosen_korean: 죽었지만
  alternatives_korean:
  - 죽고
  - 그리고 죽었습니다
  lexicon: HALOT
  rationale: 히브리어에는 양보 접속이 없지만, 한국어에서는 앞뒤의 축복 대비를 자연스럽게 보여 주기 위해 매우 절제된 양보 뉘앙스로 옮겼습니다.
- source_word: חיה תחיה
  english_pob_choice: you will surely live
  chosen_korean: 반드시 살 것이기 때문입니다
  alternatives_korean:
  - 분명히 살 것입니다
  - 정녕 살 것입니다
  lexicon: HALOT
  rationale: 부정확한 단순 미래가 아니라 강조를 지닌 부정사 절대형+동사형의 중첩을 반영하여, 확실성을 드러내는 표현을 사용했습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행본문의 관계
  chosen_reading: 본문은 현존 히브리어를 따르되, 의미가 크게 다른 그리스어 확장 독법은 각주로 남겼습니다.
  alternative_readings:
  - '그리스어: "당신을 본 이들과 사랑으로 단장된 이들은 행복합니다. 우리도 또한 살 것이기 때문입니다."'
  rationale: 이 절은 히브리어와 그리스어 사이의 차이가 상당하므로, 본문을 임의로 혼합하지 않고 검증 가능한 독법 차이를 보존하는 것이 번역 투명성에 더 부합합니다.
  doctrine_reference: 'PHILOSOPHY.md: translate from Hebrew where it survives; use Greek parallel as actual input'
