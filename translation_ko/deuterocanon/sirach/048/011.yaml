translation:
  language: ko
  text: 당신을 본 사람은 죽었지만 행복합니다[a]. 당신도 행복합니다. 이는 당신이 반드시 살 것이기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '그리스어 병행본문: “당신을 본 이들과 사랑으로 단장된 이들은 행복합니다. 우리도 또한 살 것이기 때문입니다.” 히브리어 증인은 “그리고 당신도 행복합니다. 이는 당신이 반드시 살 것이기 때문입니다.”라고 읽습니다.'
    reason: alternative_reading
lexical_decisions:
- source_word: אשרי
  english_pob_choice: Happy is / happy are
  chosen_korean: 행복합니다
  alternatives_korean:
  - 복됩니다
  - 복이 있습니다
  lexicon: HALOT
  rationale: 히브리어 אשרי의 축복-행복 선언을 현대 한국어에서 자연스럽게 살리되, 교회적 상투어보다 직접적이고 문맥에 맞는 표현을 택했습니다.
- source_word: ראך
