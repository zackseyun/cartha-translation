  text: Happy is the one who saw you and died[a], and happy are you, for you will surely live.
  footnotes:
  - marker: a
    text: 'Greek parallel: ''Happy are those who saw you and those adorned in love, for we also shall live.'' The Hebrew witness instead reads, ''and happy are you, for you will surely live.'''
