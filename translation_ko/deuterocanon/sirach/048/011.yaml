  - 정녕 살 것입니다
  lexicon: HALOT
  rationale: 부정확한 단순 미래가 아니라 강조를 지닌 부정사 절대형+동사형의 중첩을 반영하여, 확실성을 드러내는 표현을 사용했습니다.
