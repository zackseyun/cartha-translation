  text: In his days the sun stood still[b][a], and life was added to the king.
  footnotes:
  - marker: a
    text: That is, the king's life was extended; the referent is Hezekiah in the surrounding context.
    reason: cross_reference
  - marker: b
    text: 'Greek: ''he impeded the sun'' or ''the sun was hindered,'' a difficult expression corresponding to the Hebrew ''the sun stood still.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 시대에 해가 멈추었고, 왕의 생명에 생명이 더해졌습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 곧 왕의 생명이 연장되었다는 뜻입니다. 주변 문맥의 인물은 히스기야입니다.
    reason: cross_reference
  - marker: b
    text: 그리스어는 '해가 방해를 받았다' 또는 '해가 저지되었다'는 난해한 표현으로, 히브리어의 '해가 멈추었다'에 대응합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עמד השמש
  english_pob_choice: the sun stood still
  chosen_korean: 해가 멈추었고
  alternatives_korean:
  - 해가 서 있었고
  - 해가 멎었고
  lexicon: HALOT
  rationale: 히브리어 עמד는 문자적으로는 '서다'이지만, 태양과 함께 쓰일 때는 운동의 정지를 뜻하므로 '멈추다'로 옮겨 의미를 분명히 했습니다.
- source_word: ונוסף
  english_pob_choice: was added
  chosen_korean: 생명이 더해졌습니다
  alternatives_korean:
  - 생명이 추가되었습니다
  - 생명이 늘어났습니다
  lexicon: HALOT
  rationale: 히브리어의 수동적 뉘앙스를 살리면서, 뒤따르는 '생명'을 주어로 드러내어 자연스러운 한국어로 표현했습니다.
- source_word: חיי
  english_pob_choice: life
  chosen_korean: 생명
  alternatives_korean:
  - 삶
  - 목숨
  lexicon: HALOT
  rationale: 문맥상 왕의 수명/생존 기간을 가리키므로, 본문 의미를 가장 직접적으로 드러내는 '생명'을 택했습니다.
- source_word: המלך
  english_pob_choice: the king
  chosen_korean: 왕
  alternatives_korean:
  - 그 왕
  - 임금
  lexicon: HALOT
  rationale: 본문 자체가 고유명 대신 직함을 사용하므로, 문맥상 히스기야를 염두에 두더라도 본문 표현을 보존해 '왕'으로 옮겼습니다.
theological_decisions:
- issue: 본문에 히스기야의 이름을 명시할지 여부
  chosen_reading: 본문에는 '왕'을 유지하고, 주석 없이 이름을 넣지 않았습니다.
  alternative_readings:
  - 히스기야
  - 히스기야 왕
  rationale: 원문은 해석을 본문에 삽입하지 않고 직함만 사용하므로, 주변 문맥의 식별을 해치지 않으면서도 본문의 간결성을 보존했습니다.
  doctrine_reference: 원문 우선 번역 원칙; 본문에 없는 설명적 보충을 최소화
