base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/048/006.yaml
  text: who brought down kings to destruction[c][b][a], and nobles from their beds.
  footnotes:
  - marker: a
    text: Or 'to the pit'; Hebrew שחת can denote a pit or ruin/destruction. The Greek parallel reads 'to destruction.'
    reason: lexical_alternative
  - marker: b
    text: Or 'nobles' or 'the honored ones.'
    reason: lexical_alternative
  - marker: c
    text: The line likely echoes Elijah's judgments on kings and high-ranking figures, including a king confined to his bed (compare 2 Kings 1).
    reason: cross_reference
translation:
  language: ko
  text: 왕들을 멸망으로 끌어내리고, 존귀한 자들을 그들의 침상에서 끌어내리신 분입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘구덩이로’. 히브리어 שחת는 구덩이, 멸망, 파괴를 가리킬 수 있으며, 그리스어 병행구는 ‘멸망’으로 읽습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘귀인들’ 혹은 ‘존귀한 자들’.
    reason: lexical_alternative
  - marker: c
    text: 이 구절은 열왕기하 1장에 나오는 엘리야의 왕 징계를 암시하는 것으로 보입니다.
    reason: cross_reference
lexical_decisions:
- source_word: המוריד
  english_pob_choice: who brought down
  chosen_korean: 끌어내리고
  alternatives_korean:
  - 내려뜨리고
  - 끌어내리시고
  lexicon: HALOT
  rationale: 히필 분사로서 지위를 낮추고 전복시키는 동작을 나타내므로, 단순한 위치 이동보다 권세의 추락을 함께 드러내는 ‘끌어내리다’가 적절합니다.
- source_word: שחת
  english_pob_choice: to destruction
  chosen_korean: 멸망으로
  alternatives_korean:
  - 구덩이로
  - 파멸로
  lexicon: HALOT
  rationale: 본문의 병행어와 그리스어 εἰς ἀπώλειαν을 따라, 문자적 ‘구덩이’보다 결과 상태를 나타내는 ‘멸망’이 더 분명합니다.
- source_word: ונכבדים
  english_pob_choice: and honored men
  chosen_korean: 존귀한 자들
  alternatives_korean:
  - 존귀한 사람들
  - 명망 있는 자들
  - 귀인들
  lexicon: HALOT
  rationale: כבד 계열은 ‘무게 있는/존귀한’ 사람들을 가리키므로, 사회적 지위의 핵심을 살리면서도 성별을 덜 한정하는 표현으로 옮겼습니다.
- source_word: ממטותם
  english_pob_choice: from their beds
  chosen_korean: 그들의 침상에서
  alternatives_korean:
  - 그들의 침대에서
  - 그들의 침상들에서
  lexicon: HALOT
  rationale: מַטָּה는 침상/침대를 뜻하므로, 현대 한국어에서는 ‘침상’이 고전적 함의를 유지하면서도 문맥상 자연스럽습니다.
theological_decisions:
- issue: 문맥에 드러난 엘리야의 왕 징계 암시를 본문에 얼마나 반영할지
  chosen_reading: 본문은 이미지 그대로 두고, 역사적 암시는 본문 밖에서 이해하도록 했습니다.
  alternative_readings:
  - ‘병상에서’처럼 병든 왕을 더 분명히 암시하는 번역
  - ‘가까운 곳에서’ 같은 일반화
  rationale: 히브리어와 그리스어 모두 ‘침상/침대’라는 구체적 이미지를 유지하므로, 암시는 살리되 본문에 추가 해석을 덧붙이지 않는 것이 원문에 가장 가깝습니다.
  doctrine_reference: 원문 우선, 암시적 역사 배경은 주해에서 다룸
