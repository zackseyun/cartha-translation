  naturalness: 합쇼체의 관계절 종결 ‘분입니다’는 문맥상 가능합니다. 그러나 ‘왕들을 멸망으로 끌어내리고’와 ‘침상에서 끌어내리신’의 연쇄는 어색하고 중복됩니다. 첫 행을 ‘멸망에 이르게 하시고’로, 둘째 행을 ‘침상에서 끌어내리신’으로 구분하면 현대 표준 한국어로 더 자연스럽습니다.
  terminology: ‘존귀한 자들’은 נכבדים의 넓은 뜻을 보존하는 적절한 번역입니다. ‘침상’도 문체적으로 알맞습니다. 각주 b는 본문 표현 자체를 대안으로 제시하는 중복을 피하고 ‘귀인들’ 및 ‘명망 있는 이들’처럼 실제 번역 대안을 제시하는 편이 낫습니다. 역사적 암시를 다루는 각주 c는 왕뿐 아니라 고위 인물들을 포함하고, 침상에 누운 왕이라는 제한된 암시를 지나치게 단정하지 않도록 보완해야 합니다.
