  source_fidelity: 현 번역은 히브리어의 복수형과 ‘이스라엘’을 잘 반영하지만, ‘분노를 가라앉히고’에는 ‘불타는 진노가 일어나기 전에/앞에서’라는 시간적 한정이 빠져 있습니다. 또한 ‘임명되어 … 회복시키게 되었습니다’는 원문의 목적 부정사들의 병렬과 주체의 행위를 다소 어색하게 처리합니다. 첫 구절은 히브리어와 그리스어 모두 난해하므로 ‘정해진 때를 위하여 세움을 받은’으로 제한적으로 옮겨 모호성을 보존하는 것이 안전합니다.
