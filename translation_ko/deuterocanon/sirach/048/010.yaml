base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/048/010.yaml
  text: who was appointed for the appointed time[a], to calm wrath before fury, to turn the heart of fathers to sons[c][b], and to restore the tribes of Israel.
  footnotes:
  - marker: a
    text: 'Hebrew more fully: ''to make anger cease before the burning anger of God.'' The Greek reads more briefly, ''to calm wrath before fury.'''
    reason: alternative_reading
  - marker: b
    text: Hebrew has 'fathers ... sons/children' in the plural; the Greek has the singular, 'father ... son.'
    reason: textual_variant
  - marker: c
    text: Greek reads 'the tribes of Jacob'; Hebrew reads 'the tribes of Israel.'
    reason: textual_variant
translation:
  language: ko
  text: 그는 정해진 때를 위하여 세움을 받은 이로서, 진노가 불타오르기 전에 분노를 가라앉히고[a], 아버지들의 마음을 아들들에게로 돌이키며[b], 이스라엘의 지파들을 회복시키는 이입니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 더 풀어 쓰면 ‘하나님의 불타는 진노 앞에서 분노를 그치게 하다’에 가깝습니다. 그리스어는 더 간단히 ‘진노 앞에서 분노를 가라앉히다’라고 말합니다.
    reason: textual_variant
  - marker: b
    text: 히브리어는 ‘아버지들…아들들’의 복수형을, 그리스어는 ‘아버지…아들’의 단수를 사용합니다.
    reason: textual_variant
  - marker: c
    text: 그리스어는 ‘야곱의 지파들’이라고 하고, 히브리어는 ‘이스라엘의 지파들’이라고 합니다.
    reason: textual_variant
lexical_decisions:
- source_word: הכתוב נכון לעת / ὁ καταγραφεὶς ἐν ἐλεγμοῖς εἰς καιρούς
  english_pob_choice: who was appointed for the appointed time
  chosen_korean: 정해진 때를 위해 임명되어
  alternatives_korean:
  - 장차 올 때를 위해 기록되어
  - 정해진 시기를 위해 지정되어
  - 때를 위해 적혀 있어
  lexicon: HALOT; BDAG
  rationale: 히브리어의 הכתוב/נכון לעת는 문자적으로는 ‘기록됨/정해짐’의 의미를 가지지만, 문맥상 미래를 향해 따로 세워진 뜻이 강합니다. 한국어에서는 이를 자연스럽게 ‘정해진 때를 위해 임명되어’로 옮겨, 지정성과 시간성을 함께 살렸습니다.
- source_word: להשבית אף / κοπάσαι ὀργήν
  english_pob_choice: to calm wrath
  chosen_korean: 분노를 가라앉히고
  alternatives_korean:
  - 분노를 그치게 하고
  - 노여움을 멈추고
  - 진노를 잠재우고
  lexicon: HALOT; BDAG
  rationale: 히브리어의 ‘그치게 하다’와 그리스어의 ‘진정시키다’가 모두 강한 분노를 누그러뜨리는 뜻이므로, 현대 한국어에서 가장 자연스러운 ‘가라앉히다’를 택했습니다.
- source_word: להשיב לב אבות על בנים / ἐπιστρέψαι καρδίαν πατρὸς πρὸς υἱόν
  english_pob_choice: to turn the heart of fathers to sons
  chosen_korean: 아버지들의 마음을 아들들에게로 돌이키며
  alternatives_korean:
  - 아버지들의 마음을 자녀들에게로 돌이키며
  - 아버지와 아들의 마음을 화해시키며
  - 아버지들의 마음을 아들들에게 향하게 하며
  lexicon: HALOT; BDAG
  rationale: 히브리어 복수형 ‘아버지들…아들들’을 반영하되, ‘마음을 돌이키다’라는 성경적 관용구를 유지했습니다. 관계 회복의 함의를 살리면서도 본문의 표현을 과도하게 풀지 않았습니다.
- source_word: ולהכין שבטי ישראל / καταστῆσαι φυλὰς Ἰακώβ
  english_pob_choice: to restore the tribes of Israel
  chosen_korean: 이스라엘의 지파들을 회복시키게 되었습니다
  alternatives_korean:
  - 이스라엘의 지파들을 다시 세우게 되었습니다
  - 이스라엘의 지파들을 바로잡게 되었습니다
  - 이스라엘의 지파들을 세우게 되었습니다
  lexicon: HALOT; BDAG
  rationale: 히브리어 להכין과 그리스어 καταστῆσαι는 ‘세우다/설립하다/회복하다’의 범위를 가지며, 문맥상 엘리야적 회복의 의미가 강합니다. 한국어 ‘회복시키다’가 이를 가장 잘 전달합니다.
theological_decisions:
- issue: 시르 48:10의 히브리어·그리스어 병행본 처리
  chosen_reading: 본문은 살아 남은 히브리어의 흐름을 따르되, 뜻이 불분명한 부분은 그리스어 평행문으로 보정했습니다.
  alternative_readings:
  - 그리스어를 더 직접 따라 ‘책망을 위해 기록된 자’로 옮기는 방식
  - 히브리어를 더 직접 따라 ‘정한 때를 위해 적힌 자’로 옮기는 방식
  rationale: 집회서의 이 절은 히브리어 전승과 그리스어 전승이 서로 약간 다르므로, 어느 한쪽을 기계적으로 고정하지 않고 두 증언이 함께 지시하는 의미를 한국어로 재구성했습니다.
  doctrine_reference: 'PHILOSOPHY.md: Hebrew Sirach where it survives; translation policy on parallel witnesses'
- issue: 말라기 4:6을 연상시키는 ‘마음을 돌이킴’의 보존
  chosen_reading: ‘화해하다’로 풀지 않고 ‘마음을 돌이키다’라는 관용구를 유지했습니다.
  alternative_readings:
  - 아버지와 자녀를 완전히 화해시키다
  - 가정 관계를 회복하다
  rationale: 본문은 엘리야적 회복의 언어를 사용하지만, 실제로는 ‘돌이키다’라는 표현 자체가 신학적·상호본문적 연결고리이므로 이를 보존하는 편이 더 충실합니다.
  doctrine_reference: Translation philosophy §3
