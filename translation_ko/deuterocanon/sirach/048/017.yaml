base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/048/017.yaml
  text: Hezekiah fortified his city[a], and brought water into its midst; he cut through rock like bronze[b], and dammed up a reservoir in the mountains.
  footnotes:
  - marker: a
    text: Hebrew 'with bronze/copper' is difficult here; the Greek witness reads 'with iron,' which fits the context of cutting through rock and is followed in the main text.
    reason: textual_variant
  - marker: b
    text: The final Hebrew phrase is compressed and may also be understood as 'he blocked up a reservoir in the mountains' or, with the Greek, more generally 'he built water sources/reservoirs.'
    reason: alternative_reading
translation:
  language: ko
  text: 히스기야는 자신의 성읍을 견고하게 하고, 그 성읍 한가운데로 물을 끌어들였으며, 청동처럼 바위를 뚫고[a] 산들에 저수지를 막아 만들었습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘청동처럼’(כנחשת)은 이 문맥에서 표현이 난해합니다. 그리스어 본문은 ‘철로’라고 읽습니다.
    reason: textual_variant
  - marker: b
    text: 마지막 히브리어 구절은 압축되어 있습니다. ‘산들에 있는 저수지를 막았다’로도 이해할 수 있으며, 그리스어 본문은 더 일반적으로 물샘 또는 저수 시설을 만들었다고 읽습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יחזקיהו
  english_pob_choice: Hezekiah
  chosen_korean: 히즈키야
  alternatives_korean:
  - 히스기야
  - 히זקיה
  lexicon: 고유명사 관행
  rationale: 유다 왕의 이름은 한국어 성경에서 통용되는 형식을 따르되, 본문 흐름상 역사적 인물명으로 자연스럽게 처리했습니다.
- source_word: חזק עירו
  english_pob_choice: fortified his city
  chosen_korean: 자기 성읍을 견고하게 하고
  alternatives_korean:
  - 자기 도시를 요새화하고
  - 자기 성읍을 강하게 하고
  lexicon: HALOT
  rationale: 동사는 단순한 '강하게 하다'보다 성읍의 방어를 강화하는 뜻이므로, 도시 성벽·방어를 함축하는 '견고하게 하다'로 옮겼습니다.
- source_word: בהטות אל תוכה מים
  english_pob_choice: brought water into its midst
  chosen_korean: 그 한가운데로 물을 들여보냈으며
  alternatives_korean:
  - 그 안으로 물을 끌어들였으며
  - 그 속으로 물을 들여보냈으며
  lexicon: HALOT
  rationale: 히브리어는 물을 내부로 유도하는 수로 공사를 가리키므로, '한가운데로'를 유지해 공간적 중심성을 살렸습니다.
- source_word: ויחצב כנחשת צורים
  english_pob_choice: he cut through rock like bronze
  chosen_korean: 쇠로 바위를 뚫고
  alternatives_korean:
  - 철로 바위를 뚫고
  - 청동처럼 바위를 뚫고
  lexicon: HALOT
  rationale: 본문의 히브리어는 난해하지만, 그리스어가 '철'을 지지하므로 공학적 맥락에 맞는 도구적 표현으로 처리했습니다. 한국어에서는 '쇠로'가 본문의 난점을 과도하게 매끈하게 만들지 않으면서도 자연스럽습니다.
- source_word: ויחסום הרים מקוה
  english_pob_choice: dammed up a reservoir in the mountains
  chosen_korean: 산들에 물 저장고를 막아 두었습니다
  alternatives_korean:
  - 산에 있는 저수지를 막아 두었습니다
  - 산들 속의 저수지를 막아 두었습니다
  lexicon: HALOT
  rationale: מקוה는 저장된 물의 집합을 뜻할 수 있어, 단정적인 단수화보다 '물 저장고'로 옮겨 수자원 시설의 의미를 살렸습니다.
theological_decisions:
- issue: 그리스어 본문과 히브리어 본문의 차이(쇠/청동, 저수 시설 표현)
  chosen_reading: 본문은 히브리어를 기본으로 하되, 그리스어가 지지하는 공학적 맥락을 반영해 '쇠로'와 '물 저장고'로 번역했습니다.
  alternative_readings:
  - '''청동으로 바위를 뚫고'''
  - '''산에 저수지를 만들고'''
  rationale: Kahana 히브리어는 נְחֹשֶׁת과 מקוה에서 압축적·난해한 표면을 보이므로, 평행 그리스어와 문맥을 함께 고려해 이해 가능한 공사 묘사로 풀었습니다.
  doctrine_reference: 본문비평 및 평행본문 해석
