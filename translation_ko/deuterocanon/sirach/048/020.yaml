translation:
  language: ko
  text: 그들은 지극히 높으신 하나님을 부르고, 그분께 손을 펼쳤습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 병행본문은 이어서 ‘그리고 그 거룩하신 분께서 하늘에서 속히 그들의 말을 들으시고, 이사야의 손을 통해 그들을 구원하셨다’고 덧붙입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ויקראו / ἐπεκαλέσαντο
  english_pob_choice: they called
  chosen_korean: 부르짖었고
  alternatives_korean:
  - 불렀고
  - 간구했고
  - 호소했고
  lexicon: HALOT; LSJ
  rationale: 하나님께 드리는 요청의 뉘앙스를 살리기 위해 단순한 ‘불렀다’보다 더 간절한 ‘부르짖다’를 택했습니다. 시편적 기도 맥락과 헬라어 ἐπεκαλέσαντο의 ‘부르짖어 부르다/호소하다’에 잘 맞습니다.
- source_word: אל אל עליון
  english_pob_choice: God Most High
  chosen_korean: 하나님 가장 높으신 분
  alternatives_korean:
  - 가장 높으신 하나님
  - 지극히 높으신 하나님
  - 하나님, 지극히 높으신 분
  lexicon: HALOT
  rationale: 히브리어의 간결한 호칭을 살리면서도 ‘אל’과 ‘עליון’의 결합을 자연스럽게 옮기기 위해 ‘하나님 가장 높으신 분’으로 풀어 옮겼습니다. ‘가장 높으신 하나님’도 가능하지만, 원문의 호칭성을 더 직접적으로 드러냅니다.
- source_word: ויפרשו
  english_pob_choice: spread out
  chosen_korean: 펼쳤습니다
  alternatives_korean:
  - 펴 들었습니다
  - 벌렸습니다
  - 넓게 펼쳤습니다
  lexicon: HALOT
  rationale: 기도할 때 손을 펴는 몸짓을 한국어로 가장 자연스럽게 나타내는 동사로 ‘펼치다’를 택했습니다. 과도한 해석 없이 동작 자체를 분명히 보여 줍니다.
- source_word: כפים
  english_pob_choice: their hands
  chosen_korean: 자기들의 손
  alternatives_korean:
  - 손바닥을
  - 두 손을
  - 손바닥을 펼쳤습니다
  lexicon: HALOT
  rationale: כפים는 문자적으로 ‘손바닥’이지만, 한국어에서는 기도 자세를 말할 때 ‘손을 펼치다’가 더 자연스럽습니다. 본문은 손바닥의 세부보다 손을 들어 펴는 행위를 강조하므로 ‘자기들의 손’으로 처리했습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행본문의 범위
  chosen_reading: 본문은 히브리어에 있는 절만 옮기고, 그리스어가 덧붙이는 ‘하늘에서 속히 들으시고 이사야의 손으로 구원하셨다’는 내용은 각주로 보존했습니다.
  alternative_readings:
  - 그리스어의 후속 구절까지 본문에 포함하는 번역
  - 후속 구절을 아예 생략하는 번역
  rationale: 이 절의 주요 본문 증거는 히브리어이며, 그리스어의 추가 문장은 본문 범위를 넘어서는 병행 전승입니다. 따라서 본문은 히브리어를 따르고, 추가 전승은 각주로 투명하게 남기는 편이 원문 충실성과 검증 가능성을 함께 지킵니다.
  doctrine_reference: 'Sirach source-policy: Hebrew primary where extant; Greek parallel retained as audit note rather than conflated into main line.'
