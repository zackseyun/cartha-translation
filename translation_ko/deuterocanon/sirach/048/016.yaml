  text: A remnant was left to Judah[a], and to the house of David a ruler. Some of them did what was right, but some of them greatly increased apostasy.
  footnotes:
  - marker: a
    text: 'Greek parallel: ''some of them multiplied sins.'' The Hebrew reads more sharply, ''greatly multiplied apostasy/treachery.'''
    reason: alternative_reading
translation:
  language: ko
  text: 유다에게는 남은 자가 남았고, 다윗의 집에는 한 통치자가 남았습니다. 그들 가운데 어떤 이들은 옳은 일을 했지만, 어떤 이들은 크게 배교를 더했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 병행본문은 ‘어떤 이들은 죄들을 크게 늘렸습니다’라고 읽습니다. 히브리어는 더 날카롭게 ‘배교/배신’을 말합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וישאר ליהודה מזער
  english_pob_choice: A remnant was left to Judah
  chosen_korean: 유다에게는 남은 자가 남았고
  alternatives_korean:
  - 유다에게는 한 남은 무리가 남았고
  - 유다에게는 작은 남은 것이 있었고
  lexicon: HALOT
  rationale: מזער의 ‘아주 적은 남은 몫’과 וישאר의 수동적 ‘남겨졌다’를 함께 살려, 관용적이면서도 잔여 공동체의 뉘앙스를 유지했습니다.
- source_word: קצין
  english_pob_choice: a ruler
  chosen_korean: 한 통치자가
  alternatives_korean:
  - 한 지도자가
  - 한 군왕이
  - 한 군주가
  lexicon: HALOT
  rationale: קצין은 권위를 가진 통치자를 가리키므로, 다윗 왕조 문맥에서 너무 구체적이거나 시대착오적인 직함보다 ‘통치자’가 가장 무난합니다.
- source_word: עשו יושר
  english_pob_choice: did what was right
  chosen_korean: 옳은 일을 했지만
  alternatives_korean:
  - 정직하게 행했지만
  - 올바른 일을 했지만
  lexicon: HALOT
  rationale: עשו יושר의 관용구를 한국어의 자연스러운 도덕 판단 표현으로 옮기되, 단순한 ‘의로움’보다 행위 중심의 의미를 드러냈습니다.
- source_word: הפליאו מעל
  english_pob_choice: greatly increased apostasy
  chosen_korean: 크게 배교를 더했습니다
  alternatives_korean:
  - 크게 배반을 더했습니다
  - 크게 신의를 저버렸습니다
  - 크게 죄를 더했습니다
  lexicon: HALOT
  rationale: מעל은 단순한 범죄보다 언약적 불충실/배신을 뜻하므로, POB의 ‘apostasy’를 따라 ‘배교’로 옮기되 동사의 ‘더하다’와 הפליאו의 증강 의미를 살렸습니다.
theological_decisions:
- issue: 마지막 절의 מעל을 한국어로 어떻게 유지할 것인가
  chosen_reading: ‘배교’로 번역해 언약적 배신의 강한 의미를 살렸습니다.
  alternative_readings:
  - 죄를 더했습니다
  - 배반을 더했습니다
  - 신의를 저버렸습니다
  rationale: 히브리어 본문이 그리스어의 일반적 ‘죄들’보다 더 날카로운 מעל을 사용하므로, 본문이 가진 예언적·언약적 평가를 약화하지 않도록 했습니다.
  doctrine_reference: 원어 우선 원칙; 본문이 드러내는 언약 불성실의 신학적 긴장 보존
- issue: ‘남은 자’와 왕조의 회복 암시
  chosen_reading: 유다의 남은 자와 다윗의 집의 통치자를 병렬로 유지했습니다.
  alternative_readings:
  - 유다의 생존자와 다윗 가문의 지도자
  - 유다에 남겨진 소수와 다윗 집의 왕
  rationale: 본문의 희망과 심판이 함께 있는 구조를 살리기 위해, 공동체의 잔여와 다윗 왕조의 통치자라는 두 축을 그대로 드러냈습니다.
  doctrine_reference: 문맥적 병행성 보존; 메시아적 암시를 과도하게 명시화하지 않음
