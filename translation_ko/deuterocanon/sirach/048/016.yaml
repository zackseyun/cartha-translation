  source_fidelity: 히브리어의 대조와 핵심 의미는 대체로 반영되었습니다. 다만 מזער는 문맥상 ‘남은 자’로 이해할 수 있으나, 초안의 ‘남은 자가 남았고’는 원문의 ‘극히 적은 것이 남았다’는 표현을 불필요하게 중복시킵니다. 또한 הפליאו מעל은 ‘배교를 더했습니다’보다 ‘배교를 크게 늘렸습니다’가 증강의 뜻을 더 분명하고 자연스럽게 나타냅니다.
  naturalness: ‘유다에게는 남은 자가 남았고’와 ‘크게 배교를 더했습니다’는 현대 한국어로 다소 어색합니다. ‘유다에는 소수의 남은 자들이 있었고’, ‘배교를 크게 늘렸습니다’로 고치면 합쇼체의 문체와 문장 흐름이 자연스러워집니다.
  terminology: ‘다윗의 집’, ‘통치자’, ‘옳은 일’, ‘배교’는 원문의 왕조적·도덕적·언약적 어휘를 과도한 교리화 없이 적절히 전달합니다. 각주에서는 히브리어 מעל의 의미를 ‘배교 또는 배신’으로 제시하되, 그리스어의 넓은 ‘죄들’ 읽기와 구별하는 것이 적절합니다.
