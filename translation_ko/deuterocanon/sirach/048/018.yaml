translation:
  language: ko
  text: 그의 시대에 산헤립이 올라와 랍사게를 보냈습니다[a]. 그는 시온을 향해 손을 뻗고, 자기의 교만 속에서 하나님을 모독하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 평행본은 ‘그가 자기의 오만함으로 자랑하였다’고 읽습니다. 히브리어 증거는 신성모독적 발언을 말하며, 본문은 이 히브리어를 따릅니다.
    reason: alternative_reading
lexical_decisions:
- source_word: בימיו / ἐν ἡμέραις αὐτοῦ
  english_pob_choice: In his days
  chosen_korean: 그의 시대에
  alternatives_korean:
  - 그의 날들에
  - 그가 다스리던 때에
  lexicon: HALOT
  rationale: 히브리어 관용구를 한국어 서술체로 자연스럽게 옮기되, 단순한 시간표현을 넘어 역사적 통치 시기를 가리키는 뉘앙스를 살렸습니다.
- source_word: וישלח את רבשקה
  english_pob_choice: sent Rabshakeh
  chosen_korean: 랍사게를 보냈습니다
  alternatives_korean:
  - 랍사게를 보냈습니다
  - 랍사게를 파견했습니다
  lexicon: HALOT
  rationale: רַב־שָׁקֵה를 고유명사/관직명 관행에 따라 음역했고, שלח는 본문의 역사 서술에 맞게 간결한 '보냈습니다'로 옮겼습니다.
- source_word: ויט ידו על ציון
  english_pob_choice: he stretched out his hand against Zion
  chosen_korean: 시온을 향해 손을 뻗고
  alternatives_korean:
  - 시온을 향해 손을 뻗고
  - 시온에 대하여 손을 뻗고
  - 시온을 향해 손을 들어
  lexicon: HALOT
  rationale: נטה/ויט יד는 적대적 행동을 나타내는 관용구로 보아 '손을 뻗다'로 옮겨 공격적 제스처를 살렸습니다.
- source_word: ויגדף / Greek ἐμεγαλαύχησεν
  english_pob_choice: blasphemed in his pride
  chosen_korean: 자기의 교만 속에서 하나님을 모독하였습니다
  alternatives_korean:
  - 자기의 교만 속에서 모독하였습니다
  - 교만하게 하나님을 모독하였습니다
  - 자기의 교만으로 하나님을 모독하였습니다
  lexicon: HALOT
  rationale: 히브리어 גדף의 신성모독적 강도를 살리기 위해 '모독하였습니다'를 택했고, 엘(אל)을 본문상 명시되지 않은 대상으로 두지 않는 대신 의미상 드러나는 하나님을 보완적으로 제시했습니다.
- source_word: בגאונו
  english_pob_choice: in his pride
  chosen_korean: 자기의 교만 속에서
  alternatives_korean:
  - 자기의 교만 속에서
  - 자기의 오만 속에서
  - 자기 교만으로
  lexicon: HALOT
  rationale: גאון은 단순한 자존감이 아니라 오만한 자긍을 가리키므로, 서술어의 수식을 자연스럽게 유지하는 '교만 속에서'로 번역했습니다.
theological_decisions:
- issue: 히브리어 본문의 '모독'과 그리스어 평행문의 '자랑/교만' 사이의 긴장
  chosen_reading: 본문은 히브리어의 신성모독적 표현을 따르되, 그리스어가 보존한 '교만/자랑'의 뉘앙스는 '자기의 교만 속에서'로 함께 살렸습니다.
  alternative_readings:
  - 그는 자기의 오만을 자랑하였습니다
  - 그는 자기의 교만으로 자랑하였습니다
  rationale: 시락에서는 살아 남은 히브리어 증거를 우선하되, 그리스어 평행이 제시하는 의미 차이는 삭제하지 않고 한국어 문장 안에 함께 반영하는 것이 본문의 긴장을 가장 잘 보존합니다.
  doctrine_reference: 'PHILOSOPHY.md: translate Sirach from Hebrew where it survives; preserve tension from parallel witnesses.'
