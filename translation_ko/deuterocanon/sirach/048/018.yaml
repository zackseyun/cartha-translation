  text: In his days Sennacherib came up and sent Rabshakeh[a]; he stretched out his hand against Zion and blasphemed in his pride.
  footnotes:
  - marker: a
    text: 'Greek parallel: ''and he boasted in his arrogance.'' The Hebrew witness instead speaks of blasphemous speech, which is followed in the main text.'
