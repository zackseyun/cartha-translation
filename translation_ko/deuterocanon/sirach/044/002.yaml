base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/044/002.yaml
  text: The Most High apportioned abundant honor[c][b][a], and his greatness is from everlasting.
  footnotes:
  - marker: a
    text: Hebrew Cairo Geniza reads חלק עליון, while the older Masada scroll reads חולק עליון, supporting the sense 'the Most High apportioned/distributed.' The Greek parallel reads 'The Lord created much glory.'
    reason: textual_variant
  - marker: b
    text: Or 'abundant glory.' Hebrew כבוד and Greek δόξα can denote either 'honor' or 'glory' depending on context.
    reason: lexical_alternative
  - marker: c
    text: Or 'from of old' or 'from eternity.'
    reason: lexical_alternative
translation:
  language: ko
  text: 지극히 높으신 분께서 많은 영예를 나누어 주셨고, 그분의 위대하심은 영원 전부터 있습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 카이로 게니자 본문은 חלק עליון을 읽고, 더 오래된 마사다 두루마리는 חולק עליון을 읽어 ‘지극히 높으신 분이 나누어 주셨다/분배하셨다’는 뜻을 뒷받침합니다. 헬라어 병행본문은 ‘주께서 많은 영광을 창조하셨다’고 읽습니다.
    reason: textual_variant
  - marker: b
    text: 또는 ‘풍성한 영광’. 히브리어 כבוד와 헬라어 δόξα는 문맥에 따라 ‘영예’ 또는 ‘영광’을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘옛적부터’ 또는 ‘영원부터’.
    reason: lexical_alternative
lexical_decisions:
- source_word: רב כבוד
  english_pob_choice: abundant honor
  chosen_korean: 많은 영예
  alternatives_korean:
  - 풍성한 영광
  - 많은 영광
  - 큰 영예
  lexicon: HALOT
  rationale: רב는 양적·질적 풍성을 나타내므로 ‘많은/풍성한’으로 옮기고, כבוד는 여기서 ‘영예’로 두어 분배되는 명예의 뉘앙스를 살렸습니다.
- source_word: חלק / חולק
  english_pob_choice: apportioned
  chosen_korean: 나누어 주셨고
  alternatives_korean:
  - 분배하셨고
  - 배정하셨고
  - 나누셨고
  lexicon: HALOT
  rationale: 히브리어 사본 전통의 분배 동사를 반영하여, 지극히 높으신 분이 영예를 사람들에게 ‘나누어 주시는’ 뜻이 드러나도록 했습니다.
- source_word: עליון
  english_pob_choice: the Most High
  chosen_korean: 지극히 높으신 분
  alternatives_korean:
  - 가장 높으신 이
  - 지존자
  - 지극히 높으신 하나님
  lexicon: HALOT
  rationale: אָֽלְיוֹן은 신적 칭호이므로 직역보다 한국어 성경에서 자연스러운 경배적 호칭으로 풀되, 인격적 지시를 유지했습니다.
- source_word: וגדלו
  english_pob_choice: and his greatness
  chosen_korean: 그의 위대하심
  alternatives_korean:
  - 그의 عظ대함
  - 그의 크심
  - 그의 위엄
  lexicon: HALOT
  rationale: 접미사 소유격을 살려 ‘그의’로 옮기고, כבוד와 짝을 이루는 נ사וע?—그의 عظ대?—의 중첩을 피하면서도 위엄의 정도를 표현하는 ‘위대하심’을 택했습니다.
- source_word: מימות עולם
  english_pob_choice: is from everlasting
  chosen_korean: 영원부터입니다
  alternatives_korean:
  - 옛적부터입니다
  - 영원 전부터입니다
  - 태초부터입니다
  lexicon: HALOT
  rationale: 시간의 원점을 가리키는 관용구를 한국어에서 간결하게 ‘영원부터’로 옮겨, 신적 속성에 대한 선언문 구조를 유지했습니다.
theological_decisions:
- issue: 히브리어와 헬라어의 첫 행 차이
  chosen_reading: 히브리어의 분배 의미를 따라 ‘지극히 높으신 분께서 많은 영예를 나누어 주셨고’로 번역했습니다.
  alternative_readings:
  - ‘주님께서 많은 영광을 창조하셨습니다’(헬라어 직행)
  - ‘지극히 높으신 분의 몫은 많은 영예입니다’(명사구 처리)
  rationale: 이 절은 사본 전통상 히브리어가 우선이며, Kahana 본문과 Masada 독본이 분배 동사를 지지합니다. 따라서 헬라어의 ἔκτισεν은 주해적 보조로만 두고 본문 의미는 히브리어에 맞췄습니다.
  doctrine_reference: 'PHILOSOPHY.md: translate from Hebrew where Sirach survives; use Greek as actual input/consistency check'
