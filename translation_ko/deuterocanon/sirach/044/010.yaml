base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/044/010.yaml
  text: But these were men of mercy, whose righteous deeds[b] were not forgotten;
  footnotes:
  - marker: a
    text: The extant Cairo Geniza Hebrew for this line is difficult and appears mismatched here; taken more literally, it reads something like, 'As though they had not been, they were, and their children after them.' The main text follows the coherent Greek parallel for this verse.
    reason: textual_variant
  - marker: b
    text: Or 'acts of justice' for 'righteous deeds.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 이들은[a] 자비로운 사람들이며, 그들의 의로운 행위들은[b] 잊히지 않았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 현존하는 카이로 게니자 히브리어 본문은 난해하며 이 절과 잘 맞지 않는 듯합니다. 이를 더 직역하면 ‘그들이 없었던 것처럼 그들은 있었고, 그들 뒤에 그들의 자손이 있었다’ 정도입니다. 본문은 이 절의 문맥에 맞는 그리스어 병행본문을 따랐습니다.
    reason: textual_variant
  - marker: b
    text: 또는 ‘정의의 행위들’.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλʼ ἢ
  english_pob_choice: But these
  chosen_korean: 그러나 이들은
  alternatives_korean:
  - 오히려 이들은
  - 하지만 이들은
  lexicon: LSJ / POB audit trail
  rationale: 그리스어의 대조적 전환을 살려 앞 절과 이어지는 반전을 자연스러운 한국어로 옮겼습니다. 히브리어 본문은 이 위치에서 불확실하므로, 문맥상 안정적인 그리스어 대조를 반영했습니다.
- source_word: ἄνδρες ἐλέους
  english_pob_choice: men of mercy
  chosen_korean: 자비의 사람들
  alternatives_korean:
  - 자비의 남자들
  - 긍휼의 사람들
  lexicon: BDAG / LSJ
  rationale: ἄνδρες의 남성형은 유지하되, 한국어에서는 성별을 과도하게 부각하지 않고 대표적 인간 집단을 뜻하는 표현으로 옮겼습니다. ἐλέους는 단순한 성향보다 ‘자비에 속한 사람들’이라는 성격 규정으로 이해했습니다.
- source_word: δικαιοσύναι
  english_pob_choice: righteous deeds
  chosen_korean: 의로운 행위
  alternatives_korean:
  - 의로운 일들
  - 의의 행위들
  - 정의로운 행위
  lexicon: BDAG / LSJ
  rationale: 복수형이므로 추상명사 ‘의’보다 구체적 행위를 드러내는 표현을 택했습니다. 영어 POB의 ‘righteous deeds’와 같은 실천적 무게를 살렸습니다.
- source_word: οὐκ ἐπελήσθησαν
  english_pob_choice: were not forgotten
  chosen_korean: 잊히지 않았습니다
  alternatives_korean:
  - 잊히지 않았습니다
  - 기억에서 사라지지 않았습니다
  - 잊혀지지 않았습니다
  lexicon: BDAG / LSJ
  rationale: 수동의 ‘forgotten’에 맞추어 자연스럽고 문어적인 종결형으로 옮겼습니다. ‘잊혀지지 않았습니다’도 가능하지만, 현대 표준어에서 더 안정적인 ‘잊히지 않았습니다’를 택했습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행본문의 차이
  chosen_reading: 이 절은 본문 상태가 불안정한 히브리어보다, 문맥이 매끄러운 그리스어 병행본문을 따라 번역했습니다.
  alternative_readings:
  - 히브리어를 따라 ‘그들이 없는 듯하였으나, 그들은 있었고, 그들 뒤에 그들의 자손이 있었다’로 옮길 수 있습니다.
  rationale: 제공된 히브리어는 이 구절 자리와 잘 맞지 않는 것으로 표시되어 있으며, 검증 상태도 minor_mismatch입니다. 그러므로 확정되지 않은 히브리어를 본문처럼 가장하지 않고, 주어진 그리스어의 안정된 의미를 본문에 반영했습니다.
  doctrine_reference: 'Sirach 번역 원칙: surviving Hebrew is primary, but uncertain/mismatched Hebrew may be corrected by the coherent Greek parallel while preserving transparency.'
