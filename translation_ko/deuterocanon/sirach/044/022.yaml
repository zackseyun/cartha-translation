  text: And in Isaac he established[a], because of Abraham his father, a covenant with every firstborn[b], and the blessing rested on the head of Israel.
  footnotes:
  - marker: a
    text: 'Greek: ''a blessing of all men and a covenant,'' where the Hebrew here reads ''a covenant with every firstborn.'' The Hebrew line is difficult, and the Greek preserves a broader universal sense.'
    reason: alternative_reading
  - marker: b
    text: The Hebrew text appears troubled at the point where it reads 'son'; the Greek parallel supports the sense 'covenant' in this verse.
    reason: textual_variant
translation:
  language: ko
  text: 그리고 이사악 안에서 그는 아브라함 그의 아버지 때문에 한 언약[a], 곧 모든 첫사람[b]의 언약을 세우셨으며, 이스라엘의 머리 위에 복이 머물렀습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 “이사악 안에서 … 언약”으로 읽으며, 히브리어의 ליצחק과 문맥을 함께 반영합니다.
    reason: textual_variant
  - marker: b
    text: 히브리어 전승은 כאן ‘첫사람/첫태어난 자’로 읽히지만, 그리스어 본문은 “모든 사람의 복과 언약”으로 달리 전합니다.
    reason: textual_variant
lexical_decisions:
- source_word: וגם ליצחק הקים
  english_pob_choice: And in Isaac he established
  chosen_korean: 그리고 이사악 안에서 그는 … 세우셨으며
  alternatives_korean:
  - 그리고 이사악을 위해 그는 세우셨으며
  - 그리고 이사악에게 그는 세우셨으며
  lexicon: HALOT; LXX ἐν τῷ Ἰσαὰκ
  rationale: 히브리어 ליצחק은 ‘이사악에게/위해’로도 읽히지만, 그리스어 병행본문이 ‘이사악 안에서’라고 하므로 그 관계를 살려 번역했습니다.
- source_word: בן / διαθήκην
  english_pob_choice: a covenant
  chosen_korean: 한 언약
  alternatives_korean:
  - 한 아들
  - 한 계약
  lexicon: HALOT; LXX διαθήκην
  rationale: 전승된 히브리어 בן은 문맥상 어색하지만, 그리스어 διαθήκην과 바로 뒤의 ברית가 모두 언약 어휘를 지지하므로 ‘언약’으로 옮겼습니다.
- source_word: כל ראשון
  english_pob_choice: with every firstborn
  chosen_korean: 모든 첫사람의
  alternatives_korean:
  - 모든 장자의
  - 모든 첫째 아들의
  lexicon: HALOT
  rationale: 히브리어 표면형은 ‘첫사람/첫태어난 자’의 범위를 가리키므로, 전승의 어려움을 반영하면서도 가장 직접적인 현대 한국어로 옮겼습니다.
- source_word: וברכה נחה על ראש ישראל
  english_pob_choice: and the blessing rested on the head of Israel
  chosen_korean: 이스라엘의 머리 위에 복이 머물렀습니다
  alternatives_korean:
  - 이스라엘의 머리 위에 축복이 내렸습니다
  - 이스라엘의 머리 위에 복이 내려앉았습니다
  lexicon: HALOT
  rationale: נחה는 ‘쉬다/머물다’의 뜻이므로, 머리 위에 놓인 복의 이미지를 살려 ‘머물렀습니다’로 옮겼습니다.
theological_decisions:
- issue: ‘이스라엘’의 지시 대상
  chosen_reading: 족장 야곱/이스라엘을 가리키는 이름으로 유지했습니다.
  alternative_readings:
  - 이스라엘 민족 전체를 가리킨다
  rationale: 아브라함–이사악–이스라엘의 족장 계보가 이어지므로, 본문은 민족보다 족장 야곱을 먼저 가리키는 것으로 읽는 것이 자연스럽습니다. 다만 이름 자체는 그대로 두어 이중 의미를 열어 두었습니다.
  doctrine_reference: 족장사 전통과 성경 본문 문맥
