    reason: textual_variant
  revision_rationale: 히브리어 본문을 우선하여 בן을 ‘아들’로, נתיו를 ‘그에게 … 주셨고’로 번역했습니다. 문맥상 불명확한 ברית כל ראשון은 과도하게 조화시키지 않고 ‘모든 맏이의 언약’으로 보존했으며, 그리스어의 대안 읽기와 히브리어 표현의 난해성은 적절한 위치의 각주로 제시했습니다.
