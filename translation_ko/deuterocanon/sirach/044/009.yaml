  source_fidelity: 히브리어 본문은 ‘기억이 없는/남지 않는 이들’과 ‘그들은 그쳤던 대로 그쳤다’라는 매우 압축되고 반복적인 문구만을 담고 있습니다. 현 본문의 ‘마치 존재한 적이 없었던 것처럼’은 히브리어에는 없고 그리스어의 확장에 속합니다. 그리스어 확장을 본문에 반영하려면 그리스어의 후속 절도 함께 다루어야 하므로, 히브리어를 우선하는 본문에서는 이를 각주로 한정하는 것이 안전합니다.
  naturalness: ‘기억이 없고’는 그들 자신이 기억력을 잃었다는 뜻으로도 읽힐 수 있습니다. ‘기억되지 않는 이들’은 타인에게 남은 기억이나 명성이 없다는 문맥을 자연스럽게 전달합니다. 두 번째 절은 원문의 반복과 불명료함 자체가 중요한 본문적 특징이므로, 다소 압축적인 ‘그쳤던 대로 그쳤습니다’로 보존합니다.
  terminology: זכר는 여기서 개인의 기억력보다 그들에 관한 기억·명성이 남아 있지 않음을 가리키므로 ‘기억되지 않는’이 적절합니다. וישבתו/שבתו의 반복에는 ‘사라졌다’나 ‘존재한 적이 없었다’라는 확정적 확대를 본문에 부가하지 않았습니다.
