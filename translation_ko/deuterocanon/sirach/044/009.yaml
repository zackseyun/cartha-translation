base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/044/009.yaml
  text: And there are some for whom there is no remembrance[a], they ceased to be, just as they had ceased, as though they had never existed, and so did their children after them.
  footnotes:
  - marker: a
    text: 'The Hebrew witness is shorter and reads literally, ''And there are some for whom there is no remembrance, and they ceased as they ceased.'' The Greek parallel preserves a fuller form of the thought: ''they perished as though they had not existed ... and their children after them.'' The main text follows the Hebrew as primary while allowing the Greek to clarify the compressed wording.'
    reason: textual_variant
translation:
  language: ko
  text: 그들 가운데 어떤 이들은 기억이 없고, 그들은 마치 존재한 적이 없었던 것처럼 사라졌습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 증거는 더 짧으며 문자적으로는 ‘기억이 없고, 그들은 그들이 그쳤던 대로 그쳤다’에 가깝습니다. 그리스어 평행본문은 ‘존재하지 않았던 것처럼 사라졌고… 그들의 자녀도 그들 뒤에 있었다’는 더 긴 형태를 보존합니다. 본문은 히브리어를 우선하되, 의미를 분명히 하도록 그리스어를 보조적으로 참고했습니다.
    reason: textual_variant
lexical_decisions:
- source_word: ויש מהם אשר אין לו זכר
  english_pob_choice: for whom there is no remembrance
  chosen_korean: 기억이 없고
  alternatives_korean:
  - 기억될 일이 없고
  - 기억나는 일이 없고
  - 기억이 남아 있지 않고
  lexicon: HALOT
  rationale: זכר는 여기서 개인의 ‘기억’ 또는 ‘기념’이 없다는 뜻이므로, 현대 한국어에서 자연스러운 ‘기억이 없고’로 옮기되 기념비적 뉘앙스로 좁히지 않았습니다.
- source_word: וישבתו
  english_pob_choice: they ceased to be
  chosen_korean: 사라졌습니다
  alternatives_korean:
  - 존재를 멈추었습니다
  - 그치셨습니다
  - 끊어졌습니다
  lexicon: HALOT
  rationale: 동사의 핵심은 존재의 종결/소멸이므로, 한국어에서는 문맥상 가장 자연스러운 ‘사라졌습니다’로 풀어 과도한 해석을 피했습니다.
- source_word: כאשר שבתו
  english_pob_choice: just as they had ceased
  chosen_korean: 마치 존재한 적이 없었던 것처럼
  alternatives_korean:
  - 그들이 그쳤던 것처럼
  - 그들이 사라진 대로
  - 그들이 그쳤던 바로 그처럼
  lexicon: HALOT
  rationale: 히브리어의 반복은 아주 압축적이어서, 그 상태의 완전한 소멸감을 드러내는 표현으로 옮겼습니다. 영어 POB가 반영한 그리스어 확장(‘존재하지 않았던 것처럼’)은 본문의 의미를 분명히 하는 보조 근거로만 사용했습니다.
theological_decisions:
- issue: 히브리어 본문이 짧고, 그리스어 평행본문은 ‘존재하지 않았던 것처럼’ 및 후손 언급까지 더합니다.
  chosen_reading: 본문에는 히브리어의 간결한 흐름을 따르되, 소멸의 강도를 한국어 관용에 맞게 드러내는 방향으로 옮겼습니다.
  alternative_readings:
  - 그들은 존재하지 않았던 것처럼 사라졌습니다
  - 그들은 마치 존재하지 않았던 것처럼 멸망했습니다
  - 그들의 자녀도 그들 뒤에 뒤따랐습니다
  rationale: 이 절은 전승 차이가 있는 곳이므로, 본문 주도성을 유지하면서도 그리스어가 분명히 드러내는 ‘완전한 소멸’의 의미는 본문 번역에 반영하되, 추가된 후손 언급은 히브리어 본문을 따라 본문에는 넣지 않았습니다.
  doctrine_reference: textual criticism / source priority
