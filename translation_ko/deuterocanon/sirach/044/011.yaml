theological_decisions:
- issue: 히브리어 본문과 그리스어 병행문의 현저한 차이
  chosen_reading: 히브리어 본문을 따라 ‘충실한 사랑의 사람들, 그들의 희망은 사라지지 않을 것입니다’로 번역했습니다.
  alternative_readings:
  - 그리스어를 따라 ‘그들의 자손에게 좋은 유산이 남아 있습니다’류로 옮김
  - 두 전통을 섞어 후손/유산 어휘를 본문에 반영함
  rationale: 이 절은 히브리어와 그리스어가 서로 다른 방향을 보이므로, 살아 있는 히브리어 본문을 मुख्य으로 두되 중요한 대안 전승은 각주로 보존하는 것이 원문 충실성과 투명성에 부합합니다.
  doctrine_reference: 'PHILOSOPHY.md: Hebrew primacy where extant; preserve textual divergence honestly'
