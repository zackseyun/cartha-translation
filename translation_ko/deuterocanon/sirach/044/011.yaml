base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/044/011.yaml
  text: But these are men of steadfast love[b][a], and their hope will not cease.
  footnotes:
  - marker: a
    text: 'Greek parallel: ''With their offspring an excellent inheritance remains, their descendants.'' The Hebrew Cairo Geniza text here instead reads, ''these are men of faithful love, and their hope will not cease.'' Masada also reflects a different surrounding wording focused on offspring/endurance.'
    reason: textual_variant
  - marker: b
    text: Or 'steadfast love,' 'mercy,' or 'loyalty' for 'faithful love' (Hebrew חסד).
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 이들은 충실한 사랑의 사람들입니다[a][b]. 그들의 희망은 사라지지 않을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '그리스어 병행본문: ‘그들의 자손과 함께 좋은 유산이 남아 있습니다, 그들의 후손이.’ 여기서는 카이로 게니자 히브리어 본문이 ‘충실한 사랑의 사람들, 그들의 희망은 사라지지 않을 것입니다’라고 읽습니다.'
    reason: textual_variant
  - marker: b
    text: חֶסֶד는 문맥에 따라 ‘충실한 사랑’, ‘인애’, ‘자비’, ‘신실한 사랑’ 등으로 옮길 수 있습니다.
    reason: lexical_alternative
