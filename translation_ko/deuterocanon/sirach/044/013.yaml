  text: Their remembrance will stand forever[a], and their righteousness will not be forgotten.
  footnotes:
  - marker: a
    text: Greek reads, 'Their offspring will remain forever, and their glory will not be blotted out.' The Masada scroll likewise reads 'their offspring/seed' where the Cairo Geniza Hebrew here reads 'their remembrance.'
    reason: textual_variant
translation:
  language: ko
  text: 그들의 기억은 영원히 남아 있을 것이며, 그들의 의는 잊히지 않을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 ‘그들의 씨/자손은 영원히 남을 것이며, 그들의 영광은 지워지지 않을 것이다’라고 읽습니다. 마사다 두루마리도 여기의 카이로 게니자 히브리어가 읽는 ‘기억’ 대신 ‘씨/자손’을 읽습니다.
    reason: textual_variant
lexical_decisions:
- source_word: זכרם
  english_pob_choice: their remembrance
  chosen_korean: 그들의 기억
  alternatives_korean:
  - 그들의 회상
  - 그들의 기념
  lexicon: HALOT
  rationale: זֵכֶר는 ‘기억/기념’의 뜻을 가지므로, 한국어에서는 자연스럽고 직접적인 ‘기억’으로 옮겼습니다. 다만 본문은 히브리어 사본을 따르므로 ‘offspring/seed’가 아니라 ‘기억’이라는 현재 전승을 반영합니다.
- source_word: יעמד
  english_pob_choice: will stand
  chosen_korean: 서 있을 것입니다
  alternatives_korean:
  - 영속할 것입니다
  - 지속될 것입니다
  lexicon: HALOT
  rationale: עָמַד의 기본 이미지는 ‘서다’이므로, 원문의 구체성을 살려 ‘서 있을 것입니다’로 옮겼습니다.
- source_word: צדקתם
  english_pob_choice: their righteousness
  chosen_korean: 그들의 의
  alternatives_korean:
  - 그들의 의로움
  - 그들의 의로운 행위
  lexicon: HALOT
  rationale: צְדָקָה는 지혜문학 맥락에서 ‘의/의로움’을 뜻할 수 있어, 가장 직접적인 ‘의’를 택했습니다. ‘의로운 행위’는 해설적이어서 본문에는 두지 않았습니다.
- source_word: לא תשכח
  english_pob_choice: will not be forgotten
  chosen_korean: 잊히지 않을 것입니다
  alternatives_korean:
  - 기억에서 사라지지 않을 것입니다
  - 잊혀지지 않을 것입니다
  lexicon: HALOT
  rationale: 수동적 의미를 살려 ‘잊히지 않을 것입니다’로 자연스럽게 표현했습니다. 이는 앞절의 ‘기억’과도 평행을 이룹니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어/마사다 전승의 차이
  chosen_reading: 본문은 현존하는 카이로 게니자 히브리어의 ‘기억/의’ 구조를 따라 번역하고, 대안 전승은 각주로만 남깁니다.
  alternative_readings:
  - 그들의 씨/자손은 영원히 남을 것이며, 그들의 영광은 지워지지 않을 것입니다.
  rationale: 이 절은 전승 차이가 번역 의미를 크게 바꾸므로, 살아 있는 히브리어 본문을 본문으로 두되 ‘씨/영광’ 전승을 숨기지 않고 보존하는 것이 투명합니다.
  doctrine_reference: 'PHILOSOPHY.md: surviving Hebrew witness has primacy; significant textual variants should be preserved transparently'
