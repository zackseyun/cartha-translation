  text: All these were honored in their generations[a], and in their days they were a glory.
  footnotes:
  - marker: a
    text: Hebrew has a compact nominal clause, literally, 'and in their days, their glory.' The Greek parallel reads, 'and in their days [there was] a boast/glory.' The translation expresses the sense in idiomatic English.
    reason: lexical_alternative
translation:
  language: ko
  text: 이 모두는 그 세대에 존귀를 얻었고, 그들의 날에는 그들의 영광이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 압축된 명사절로, 직역하면 ‘그들의 날들, 그들의 영광’에 가깝습니다. 그리스어 평행본문도 ‘그들의 날들에 자랑/영광’이라고 하므로, 한국어에서는 자연스러운 문장으로 풀어 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כל אלה
  english_pob_choice: All these
  chosen_korean: 이 모두는
  alternatives_korean:
  - 이 모든 사람들은
  - 이 사람들 모두는
  lexicon: HALOT
  rationale: 앞선 인물들을 가리키는 총괄 표현이므로, 불필요한 성별 표지를 덧붙이지 않고 간결하게 ‘이 모두는’으로 옮겼습니다.
- source_word: בדורם
  english_pob_choice: in their generations
  chosen_korean: 그 세대에
  alternatives_korean:
  - 그들의 세대에
  - 그 세대들 안에서
  lexicon: HALOT
  rationale: 히브리어 דור의 시간·세대 의미를 살리되 한국어에서는 자연스러운 관용으로 ‘그 세대에’라고 옮겨, 역사적 자리에서의 인정이라는 뜻을 드러냈습니다.
- source_word: ומימיהם
  english_pob_choice: and in their days
  chosen_korean: 그들의 날에는
  alternatives_korean:
  - 그리고 그들의 날에
  - 그들의 시대에는
  lexicon: HALOT
  rationale: 문맥상 ‘날들’은 생애/시대를 가리키는 시간 표현이므로, 평행구조를 유지하면서도 현대 한국어에 맞게 ‘그들의 날에는’으로 번역했습니다.
- source_word: תפארתם
  english_pob_choice: they were a glory
  chosen_korean: 그들의 영광이었습니다
  alternatives_korean:
  - 그들의 영광이었습니다
  - 그들의 자랑이었습니다
  - 영광이었습니다
  lexicon: HALOT
  rationale: 히브리어의 명사절(직역하면 ‘그들의 영광’)과 그리스어의 καύχημα(‘자랑/영광’)를 함께 고려하여, 이들이 당대에 존귀의 대상이었음을 드러내는 ‘그들의 영광이었습니다’로 옮겼습니다.
