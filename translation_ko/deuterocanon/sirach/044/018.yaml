lexical_decisions:
- source_word: באות עולם
  english_pob_choice: an everlasting covenant
  chosen_korean: 영원한 언약
  alternatives_korean:
  - 영속한 언약
  - 영원의 언약
  lexicon: HALOT
  rationale: עולם의 지속성을 자연스럽게 살리되, 한국어 성경 문맥에서 가장 읽기 쉬운 표현인 ‘영원한 언약’을 택했습니다.
- source_word: נכרת עמו
  english_pob_choice: was cut with him
  chosen_korean: 그와 맺어졌습니다
  alternatives_korean:
  - 그와 잘려졌습니다
  - 그와 끊어졌습니다
  - 그와 언약이 맺어졌습니다
  lexicon: HALOT
  rationale: 히브리어 관용구는 문자적으로는 ‘언약을 자르다’이지만, 한국어에서는 의미를 드러내는 ‘맺어지다’가 자연스럽고 오해가 적습니다.
- source_word: לבלתי השחית כל בשר
  english_pob_choice: that all flesh might not be destroyed
  chosen_korean: 모든 육체가 멸망하지 않게 하셨습니다
  alternatives_korean:
  - 모든 육체가 멸망하지 않도록 하셨습니다
  - 모든 육체가 파괴되지 않게 하셨습니다
  lexicon: HALOT
  rationale: לבלתי의 목적/방지 의미를 한국어로 자연스럽게 옮기고, השחית의 파괴·멸망 의미를 살려 간결하게 표현했습니다.
- source_word: כל בשר
  english_pob_choice: all flesh
  chosen_korean: 모든 육체
  alternatives_korean:
  - 온갖 육체
  - 모든 생명체
  - 모든 사람
  lexicon: HALOT
  rationale: 본문의 넓은 범위를 유지하면서도 현대 한국어에서 ‘육체’가 문자적 생물학적 총칭으로 이해되도록 했습니다.
theological_decisions:
- issue: 노아 홍수 정황의 명시 여부
  chosen_reading: 본문에는 ‘홍수’라는 말을 넣지 않고, 보편적 파괴 방지를 그대로 옮겼습니다.
  alternative_readings:
  - 홍수로 말미암아 모든 육체가 지워지지 않게 하셨습니다
  rationale: 히브리어 본문은 홍수를 직접 언급하지 않으므로, 그리스어 병행본문의 설명을 본문에 흡수하지 않고 주석적 수준으로 남기는 것이 원문 우선 원칙에 부합합니다.
  doctrine_reference: 'PHILOSOPHY.md: extant Hebrew governs the main text; Greek parallel may inform but not override.'
