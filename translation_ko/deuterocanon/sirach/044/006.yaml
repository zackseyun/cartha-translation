translation:
  language: ko
  text: 그들은 용맹하고 힘이 굳센 사람들이며, 자기 거처에서 평안히 지내는 사람들이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 ‘부유한 사람들, 힘을 갖춘 사람들, 그들의 정착지에서 평화롭게 사는 사람들’로 읽습니다. 본문은 히브리어를 따랐고, 그리스어는 일치 여부를 확인하는 보조 본문으로 사용했습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אנשי חיל
  english_pob_choice: men of valor
  chosen_korean: 용맹한 사람들
  alternatives_korean:
  - 힘센 사람들
  - 용사들
  - 능력 있는 사람들
  lexicon: HALOT
  rationale: חיל은 전투적 용기만이 아니라 능력·기백을 포함할 수 있으므로, 본문의 칭송 어조를 살리면서도 지나치게 군사적으로 좁히지 않게 했습니다.
- source_word: וסמכי כח
  english_pob_choice: steadfast in strength
  chosen_korean: 힘에 굳게 서 있는 사람들
  alternatives_korean:
  - 힘에 떠받쳐진 사람들
  - 힘에 의지하는 사람들
  - 강함에 굳게 선 사람들
  lexicon: HALOT
  rationale: סמכי는 ‘버팀/지지/굳게 서 있음’의 뉘앙스가 있어, כח와 결합된 상태를 자연스럽게 드러내는 표현으로 옮겼습니다.
- source_word: ושוקטים
  english_pob_choice: at ease
  chosen_korean: 평안히 지내는 사람들
  alternatives_korean:
  - 고요히 있는 사람들
  - 조용히 사는 사람들
  - 평온한 사람들
  lexicon: HALOT
  rationale: 동사는 단순한 침묵보다 안정되고 평화로운 정착 상태를 가리키므로, 문맥상 ‘평안히 지내는’이 가장 자연스럽습니다.
- source_word: על מכונתם
  english_pob_choice: in their place
  chosen_korean: 자기 거처에서
  alternatives_korean:
  - 자기 자리에서
  - 자기 처소에서
  - 자기 정착지에서
  lexicon: HALOT
  rationale: מכונה는 고정된 자리, 터전, 거처를 가리킬 수 있어, 단순한 추상적 ‘자리’보다 실제 정주를 드러내는 ‘거처’가 본문과 그리스어 병행구의 뜻을 함께 살립니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행구의 차이
  chosen_reading: 히브리어 본문을 본문 번역의 우선 기준으로 따르되, 그리스어의 ‘부유한 사람들/평안히 사는 사람들’은 의미 범위를 확인하는 보조 증거로만 반영했습니다.
  alternative_readings:
  - 그리스어를 따라 ‘부유한 사람들’로 옮기기
  - 그리스어의 ‘settlements’를 따라 ‘정착지’로 강조하기
  rationale: 이 절은 히브리어가 ‘용맹/힘/평안한 정주’를 중심으로 말하고, 그리스어는 ‘부유함/평화로운 거주’로 풀어 옮기므로, 서로 다른 전승을 혼합하기보다 히브리어를 본문으로 유지하는 것이 가장 투명합니다.
  doctrine_reference: 본문 비평 및 사본 전승 원칙
