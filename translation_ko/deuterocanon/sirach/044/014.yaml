  yaml_path: translation/deuterocanon/sirach/044/014.yaml
  text: Their bodies were gathered in peace[b][a], and their name lives from generation to generation.
  footnotes:
  - marker: a
    text: 'Greek: ''Their body was buried in peace.'' The Greek witness makes the funerary sense explicit where the Hebrew says ''were gathered in peace.'''
    reason: alternative_reading
  - marker: b
    text: Masada preserves a shorter reading here ('if/in peace they were gathered'), while the Cairo Geniza text reads 'Their bodies were gathered in peace.'
    reason: textual_variant
translation:
  language: ko
  text: 그들의 몸은 평안 가운데 거두어졌으며,[a][b] 그들의 이름은 대대로 살아 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 ‘그들의 몸은 평안 가운데 묻혔다’(τὸ σῶμα αὐτῶν ἐν εἰρήνῃ ἐτάφη)로, 장례의 의미를 더 분명히 드러냅니다.
    reason: cross_reference
  - marker: b
    text: 마사다 전승은 이곳을 더 짧게 ‘평안 가운데 그들이 거두어졌다’로 읽는 반면, 카이로 게니자 본문은 ‘그들의 몸은 평안 가운데 거두어졌다’로 읽힙니다.
    reason: textual_variant
lexical_decisions:
- source_word: גויתם
  english_pob_choice: their bodies
  chosen_korean: 그들의 몸은
  alternatives_korean:
  - 그들의 시신은
  - 그들의 주검은
  lexicon: HALOT
  rationale: גויתם은 문맥상 죽은 이들의 몸을 가리키므로 ‘몸’이 기본 의미를 살리면서도 과도하게 현대화하지 않습니다. 복수형 의미도 자연스럽게 반영됩니다.
- source_word: בשלום
  english_pob_choice: in peace
  chosen_korean: 평안히
  alternatives_korean:
  - 평안 가운데
  - 평화롭게
  lexicon: HALOT
  rationale: 전치사구의 핵심은 ‘평안/평화’ 상태이며, 한국어에서는 서술부를 자연스럽게 다듬은 ‘평안히’가 간결하게 대응합니다.
- source_word: נאספו
  english_pob_choice: were gathered
  chosen_korean: 거두어졌고
  alternatives_korean:
  - 모여졌고
  - 거두어졌고 장사되었고
  - 거두어졌습니다
  lexicon: HALOT
  rationale: 히브리어 אסף의 기본 이미지는 ‘거두다/모으다’입니다. 여기서는 죽음의 관용구로 쓰였지만, 본문이 직접 ‘묻히다’라고 말하지 않으므로 ‘거두어졌고’로 원문 어감을 보존합니다.
- source_word: ושמם חי לדור ודור
  english_pob_choice: and their name lives from generation to generation
  chosen_korean: 그들의 이름은 대대로 살아 있습니다
  alternatives_korean:
  - 그들의 이름은 세세대대로 살아 있습니다
  - 그들의 이름은 대대에 걸쳐 살아 있습니다
  lexicon: HALOT
  rationale: ‘이름’이 지속되는 명예/기억의 관용구를 그대로 살리되, 한국어에서는 ‘살아 있습니다’가 히브리어 חי의 현재적 생동감을 가장 잘 전달합니다.
theological_decisions:
- issue: 히브리어의 ‘거두어지다’와 그리스어의 ‘매장되다’(ἐτάφη) 사이의 긴장
  chosen_reading: 본문에는 히브리어를 따라 ‘거두어졌고’로 두고, 매장 의미를 직접 서술하지 않습니다.
  alternative_readings:
  - 그들의 몸은 평안히 장사되었고
  rationale: 시락서의 살아 있는 히브리어 전승을 मुख्य 본문으로 삼는 원칙을 따르면서, 그리스어 평행본문이 드러내는 장례적 뉘앙스를 과잉 해석 없이 유지합니다.
  doctrine_reference: 'PHILOSOPHY.md: 히브리어가 보존된 시락서는 히브리어 본문을 우선하고, 그리스어는 검증용 평행본문으로 사용'
