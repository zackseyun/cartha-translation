translation:
  language: ko
  text: 노래를 규정에 따라 찾아내고, 잠언을 글로 남깁니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 ‘규정에 따라’는 다소 어려운 표현입니다. 그리스어 평행문은 ‘음악의 노래들/악곡들을 찾아내는 자들’로 읽혀, 질서 있게 다듬어진 노래라는 뜻을 뒷받침합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어의 ‘잠언’은 그리스어 평행문의 더 넓은 ‘말들/말씀들’보다 좁습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: חוקרי
  english_pob_choice: investigating
  chosen_korean: 찾아내고
  alternatives_korean:
  - 탐구하고
  - 살피고
  - 연구하고
  lexicon: HALOT
  rationale: חקר의 능동적·탐색적 뉘앙스를 살리되, 시문맥에서 자연스럽게 읽히도록 ‘찾아내고’로 옮겼습니다. 영어 POB의 investigation/seek out 계열 의미를 반영합니다.
- source_word: מזמור
  english_pob_choice: song
  chosen_korean: 노래
  alternatives_korean:
  - 시편
  - 찬가
  - 시
  lexicon: HALOT
  rationale: 여기서는 예배 용어인 ‘시편’보다 일반적인 예술·문학적 노래를 가리키는 뜻이 더 적절하므로 ‘노래’로 옮겼습니다. 그리스어 평행문의 μουσικῶν도 이를 뒷받침합니다.
- source_word: על חוק
  english_pob_choice: according to rule
  chosen_korean: 규정에 따라
  alternatives_korean:
  - 규칙에 따라
  - 법도에 따라
  - 정해진 질서에 따라
  lexicon: HALOT
  rationale: חוק은 고정된 규범·규정의 뜻이 있으므로, 여기서는 법조문보다 형식적 질서라는 점을 살려 ‘규정에 따라’로 번역했습니다. 영어 POB의 ‘according to rule’과도 대응합니다.
- source_word: נושאי ... בכתב
  english_pob_choice: bearing ... in writing
  chosen_korean: 글로 남기고
  alternatives_korean:
  - 글로 전하고
  - 문자로 적어 두고
  - 기록하고
  lexicon: HALOT
  rationale: 직역하면 ‘들고/지니고’이지만, משל과 בכתב의 결합은 문학적 언어를 기록해 전한다는 뜻이므로 한국어에서는 결과를 드러내는 ‘글로 남기고’가 가장 자연스럽습니다. 그리스어 ἐν γραφῇ도 서면 기록을 확인합니다.
- source_word: משל
  english_pob_choice: proverbs
  chosen_korean: 잠언
  alternatives_korean:
  - 속담
  - 교훈
  - 비유
  lexicon: HALOT
  rationale: 지혜문학 맥락에서 משל은 일반적으로 잠언을 가리키므로 ‘잠언’이 가장 적절합니다. 영어 POB의 ‘proverbs’와도 직접 대응합니다.
