translation:
  language: ko
  text: 규정에 따라 노래를 탐구하고[a], 잠언을 글로 남깁니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 ‘규정에 따라’는 뜻이 다소 어려운 표현입니다. 그리스어 평행문은 ‘음악의 노래들’ 또는 ‘악곡들을 탐구하는 이들’로 읽히며, 질서 있게 다듬어진 노래라는 의미를 뒷받침합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어의 ‘잠언’은 그리스어 평행문의 더 넓은 ‘말들’ 또는 ‘표현들’보다 좁은 표현입니다.
    reason: alternative_reading
