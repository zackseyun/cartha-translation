  text: With their offspring their good endures faithfully[a], and their inheritance is for their children's children.
  footnotes:
  - marker: a
    text: 'Greek: ''Their offspring stood in the covenants, and their children because of them.'' The older Masada Hebrew witness also reflects a covenant-focused reading rather than Cairo Geniza''s ''their good ... and their inheritance.'''
    reason: alternative_reading
translation:
  language: ko
  text: 그들의 후손과 함께 그들의 선함은 변함없이 남으며, 그들의 유산은 그들의 자손의 자손에게 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '그리스어: “그들의 후손은 언약들 가운데 서 있었고, 그들의 자녀는 그들 때문에 있었다.” 오래된 맛사다 히브리어 증거도 ‘그들의 선함…유산’보다 언약 중심의 읽기를 반영합니다.'
    reason: alternative_reading
lexical_decisions:
- source_word: עם זרעם
  english_pob_choice: With their offspring
  chosen_korean: 그들의 후손과 함께
  alternatives_korean:
  - 그들의 자손과 함께
  - 그들의 씨와 함께
  lexicon: HALOT
  rationale: עם은 동반·결합을 나타내므로, 문맥상 조상들의 지속되는 복을 후손과 연결하는 ‘~과 함께’로 옮겼습니다. זרעם은 현대 한국어에서 자연스럽게 ‘후손’이 가장 무난합니다.
- source_word: נאמן
  english_pob_choice: endures faithfully
  chosen_korean: 변함없이 남으며
  alternatives_korean:
  - 신실하게 남으며
  - 굳게 서 있으며
  - 확실하게 남으며
  lexicon: HALOT
  rationale: נאמן은 ‘견고함/신뢰성/지속성’을 포함하므로, 본문이 간결하고 압축적인 점을 살려 ‘변함없이 남다’로 옮겨 안정성과 지속성을 드러냈습니다.
- source_word: טובם
  english_pob_choice: their good
  chosen_korean: 그들의 선함
  alternatives_korean:
  - 그들의 복
  - 그들의 좋음
  - 그들의 복된 상태
  lexicon: HALOT
  rationale: טוב은 선함과 복지/번영의 폭을 가질 수 있으나, 여기서는 조상들의 남겨진 덕과 복된 상태를 함께 담는 넓은 표현으로 ‘선함’을 택했습니다.
- source_word: ונחלתם לבני בניהם
  english_pob_choice: and their inheritance is for their children's children
  chosen_korean: 그들의 유산은 그들의 자손의 자손에게 있습니다
  alternatives_korean:
  - 그들의 상속은 그들의 손자들에게 있습니다
  - 그들의 기업은 그들의 대대로 이어집니다
  lexicon: HALOT
  rationale: נחלה는 ‘유산/기업/상속’의 뜻이 있어, 현대 독자가 이해하기 쉬우면서 세대 간 전승을 살리는 ‘유산’으로 번역했습니다. לבני בניהם은 직역하면 ‘그들의 아들들의 아들들에게’이므로, 남성 한정으로 좁히지 않기 위해 관용적으로 ‘자손의 자손’으로 옮겼습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 평행문의 차이 반영
  chosen_reading: 본문은 현존하는 히브리어의 ‘그들의 선함’과 ‘유산’ 구문을 따르되, 각주로 그리스어의 언약 중심 대안을 보존합니다.
  alternative_readings:
  - 그들의 후손은 언약들 가운데 서 있었고, 그들의 자녀는 그들 때문에 있었다
  - 언약 중심의 의미를 본문에 직접 반영하는 번역
  rationale: 시락은 히브리어가 우선이지만, 여기서는 히브리어와 그리스어가 어휘적으로 다릅니다. 본문은 히브리어를 따라가되, 대안 전승이 담고 있는 언약적 뉘앙스는 각주로 남겨 의미의 긴장을 지우지 않았습니다.
  doctrine_reference: 'PHILOSOPHY.md: 히브리어가 보존된 시락에서는 히브리어 본문을 우선하되, 그리스어 평행문은 보조 증거로 사용'
