  source_fidelity: 히브리어의 압축된 구문(עם זרעם נאמן טובם, ונחלתם לבני בניהם)을 본문 번역의 우선 근거로 삼았습니다. 초안의 ‘선함’은 טובם을 도덕적 성품으로 다소 좁히므로, 문맥상 복지·번영·좋은 몫을 포괄할 수 있는 표현으로 고쳤습니다. ‘굳게 남아 있으며’는 נאמן의 안정성과 지속성을 자연스럽게 반영합니다. 각주는 그리스어 및 마사다 증거의 언약 중심 대안을 본문과 구별하여 보존합니다.
  naturalness: ‘그들의 유산은 그들의 자손의 자손에게 있습니다’는 한국어에서 다소 직역투입니다. ‘그 자손의 자손에게 돌아갑니다’로 다듬어 세대 간 상속의 뜻을 자연스럽게 밝혔습니다. ‘그들의 후손과 함께’는 히브리어 עם의 연결 관계를 유지합니다.
  terminology: ‘복’은 טוב의 넓은 문맥적 의미를 한국어 성서 문체에서 자연스럽게 전달하며, ‘유산’은 נחלה의 상속·세대 계승 의미를 유지합니다. ‘마사다’는 통용되는 한국어 지명 표기입니다. 그리스어의 복수형 ‘언약들’과 διʼ αὐτούς의 인과 관계도 각주에서 보존했습니다.
