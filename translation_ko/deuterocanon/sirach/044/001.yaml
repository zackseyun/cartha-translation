- from: 이제 우리는 신의 사람들[a], 곧 우리 조상들을 그 세대들 가운데서 찬양합시다.
  to: 이제 신실한 사랑을 실천한 사람들, 곧 각자의 시대에 살았던 우리 조상들을 찬양합시다[a].
