translation:
  language: ko
  text: 이제 우리는 신의 사람들[a], 곧 우리 조상들을 그 세대들 가운데서 찬양합시다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '그리스어: ‘이제 우리는 영광스러운 사람들과, 우리 조상들을 그들의 세대 가운데서 찬양합시다.’ 히브리어는 ‘신실한 사랑의 사람들’로 읽습니다.'
    reason: alternative_reading
lexical_decisions:
- source_word: אהללה נא
  english_pob_choice: Let us now praise
  chosen_korean: 이제 우리는 … 찬양합시다
  alternatives_korean:
  - 이제 내가 찬양하겠습니다
  - 이제 나로 하여금 찬양하게 하십시오
  lexicon: HALOT
  rationale: 히브리어 형태는 단수로도 읽힐 수 있지만, 그리스어 평행본문의 권고형 복수(‘let us praise now’)를 반영해 공동 권면으로 옮겼고, נא는 ‘이제’로 살렸습니다.
- source_word: אנשי חסד
  english_pob_choice: godly men / men of faithful love
  chosen_korean: 신의 사람들
  alternatives_korean:
  - 은혜의 사람들
  - 신실한 사랑의 사람들
  - 경건한 사람들
  lexicon: HALOT
  rationale: חסד는 단순한 ‘경건’보다 언약적 신실함과 호의, 사랑을 함께 담는 말이라서, 한국어에서는 의미를 넓게 담을 수 있는 ‘신의 사람들’로 옮겼습니다. 전통적 교회어 ‘경건한 사람들’은 너무 좁아질 수 있습니다.
- source_word: אבותינו
  english_pob_choice: our fathers
  chosen_korean: 우리 조상들
  alternatives_korean:
  - 우리 아버지들
  lexicon: HALOT
  rationale: 직역하면 ‘우리 아버지들’이지만, 여기서는 역사적 선조 전체를 가리키는 용법이므로 한국어에서는 의미를 분명히 해 주는 ‘우리 조상들’이 자연스럽습니다.
- source_word: בדורותם
  english_pob_choice: in their generations
  chosen_korean: 그 세대들 가운데서
  alternatives_korean:
  - 그들의 세대에서
  - 여러 세대에 걸쳐
  lexicon: HALOT
  rationale: 히브리어 복수형을 살리면서도 한국어에서 어색하지 않게 하려면 ‘세대들 가운데서’가 가장 무난합니다.
theological_decisions:
- issue: 히브리어와 그리스어의 첫 구절 묘사 차이
  chosen_reading: 본문은 히브리어의 חסד를 따라 ‘신의 사람들’로 두고, 그리스어의 ‘영광스러운 사람들’이라는 차이는 각주로 드러냅니다.
  alternative_readings:
  - 영광스러운 사람들
  - 경건한 사람들
  rationale: 집회서에서는 남아 있는 히브리어 증거를 우선하되, 그리스어 평행본문이 다른 전승을 반영할 수 있으므로 그 긴장을 지우지 않고 남겨 두는 것이 적절합니다.
  doctrine_reference: 'DOCTRINE.md: 원문 우선과 전승 차이의 투명한 보존'
