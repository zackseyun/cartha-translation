  verdict: revise
  source_fidelity: 히브리어 אנשי חסד는 ‘신의 사람들’(하나님께 속한 사람들/신적 인물)이 아니라 חסד, 곧 신실한 사랑·호의·인애와 관련된 사람들을 뜻합니다. 따라서 현 번역은 핵심 어휘의 의미가 바뀝니다. אבותינו는 문맥상 ‘우리 조상들’로 자연스럽게 옮길 수 있습니다. בדורותם은 각 인물이 속했던 시대·세대라는 뜻이므로 ‘그 세대들 가운데서’보다 ‘각자의 시대에 살았던’이 한국어에서 더 정확하고 자연스럽습니다.
  naturalness: ‘신의 사람들’은 현대 표준 한국어에서 ‘신의 사람’ 또는 ‘하나님의 사람’처럼 이해되어 원문의 뜻과 다르게 들립니다. 또한 ‘조상들을 그 세대들 가운데서 찬양하다’는 수식 관계가 부자연스럽습니다. 수정문은 합쇼체의 권면 형식과 본문의 간결한 열거를 유지합니다.
  terminology: חסד는 특정 교단의 전문 용어로 좁히지 않고 ‘신실한 사랑을 실천한’으로 옮겨 사랑, 충실성, 호의의 의미 범위를 드러냈습니다. 그리스어 ἄνδρας ἐνδόξους는 각주에서 ‘영예로운 사람들’로 제시하여 히브리어와의 실질적 차이를 보존했습니다.
