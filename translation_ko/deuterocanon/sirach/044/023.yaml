translation:
  language: ko
  text: 그분은 복으로 그를 세우시고, 그의 몫을 그에게 주셨습니다. 그분은 그를 지파들 위에 세우시어, 열두 몫으로 나누게 하셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 마지막 구에서 ‘열둘로 나누다’라는 압축된 표현을 사용하며, 그리스어 병행본문은 이를 지파들 가운데서 열두 몫으로 나눈다는 뜻으로 더 분명하게 나타냅니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ויכוננהו
  english_pob_choice: He established him
  chosen_korean: 그분은 … 그를 세우시고
  alternatives_korean:
  - 그를 확고히 세우시고
  - 그를 հաստատ히 세우시고
  lexicon: HALOT / כון (Hiphil)
  rationale: 히필의 ‘세우다, 확립하다’ 뜻을 자연스러운 합쇼체로 옮겼습니다. ‘확립하다’보다 서술 흐름이 부드럽고, 문맥의 축복-상속-배치 순서를 살리기에 ‘세우시다’가 적절합니다.
- source_word: בברכה
  english_pob_choice: with a blessing
  chosen_korean: 복으로
  alternatives_korean:
  - 복과 함께
  - 축복으로
  - 축복 가운데
  lexicon: HALOT / ברכה
  rationale: ב의 수단·동반 의미를 간결하게 살려 ‘복으로’로 옮겼습니다. 전통교회식 ‘축복’보다 본문의 행위가 복을 매개로 이루어졌다는 점을 직접 드러냅니다.
- source_word: נחלתו
  english_pob_choice: his inheritance
  chosen_korean: 그의 몫
  alternatives_korean:
  - 그의 상속분
  - 그의 유산
  - 그의 기업
  lexicon: HALOT / נחלה
  rationale: 문맥상 단순한 소유가 아니라 하나님이 주시는 분깃을 가리키므로 ‘몫’으로 옮겨 과도한 교회식 용어인 ‘기업’을 피했습니다. 앞절의 가나안/이스라엘 분배 맥락과도 잘 맞습니다.
- source_word: ויציבהו לשבטים, לחלק שנים עשר
  english_pob_choice: he set him over the tribes, as twelve divisions
  chosen_korean: 그를 지파들 위에 세우시어, 열두 몫으로 나누게 하셨습니다
  alternatives_korean:
  - 그를 지파들 가운데 두시어, 열두 몫으로 나누게 하셨습니다
  - 그를 지파들을 맡은 자로 세우시어, 열두 부분으로 나누게 하셨습니다
  lexicon: HALOT / יצב; שׁבט; חלק
  rationale: יצב의 ‘세우다’와 לשבטים의 지파 배치 의미를 살려 ‘지파들 위에 세우시어’로 옮겼습니다. לחלק שנים עשר은 히브리어가 압축되어 있으므로, 영어 POB와 그리스어 병행본문이 보여 주는 분할 의미를 따라 ‘열두 몫으로 나누게 하셨습니다’로 풀었습니다.
theological_decisions:
- issue: 히브리어의 압축된 마지막 구와 그리스어 병행본문의 해석 관계
  chosen_reading: 본문은 ‘열두 몫으로 나누게 하셨다’는 분할 의미를 드러내되, ‘지파들 위에 세우시어’라는 권위·배치 표현도 함께 유지했습니다.
  alternative_readings:
  - ‘열두 부분으로’로 더 직역할 수 있음
  - ‘열두 지파로’로 더 해석적으로 옮길 수 있음
  rationale: 히브리어는 압축적이지만 그리스어 병행본문이 분할의 뜻을 분명히 하므로, 두 증거를 함께 반영해 의미를 명료화하되 과도하게 재구성하지 않았습니다.
  doctrine_reference: source-text primacy with parallel-text triangulation
