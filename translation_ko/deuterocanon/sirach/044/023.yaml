revisions:
- from: 그분은 복으로 그를 세우시고, 그의 몫을 그에게 주셨습니다. 그분은 그를 지파들 위에 세우시어, 열두 몫으로 나누게 하셨습니다.[a]
  to: 그분은 복으로 그를 세우시고, 그에게 그의 상속분을 주셨습니다. 그분은 그를 지파들을 위해 세우시고, 그것을 열두 몫으로 나누셨습니다.[a]
  rationale: ‘지파들 위에’와 ‘나누게 하셨습니다’가 덧붙인 통치 및 사역의 뉘앙스를 제거했습니다. 생략된 목적어는 앞선 ‘상속분’을 가리키도록 최소한으로 보완하되, 각 몫의 정확한 성격이나 분배 방식은 각주에서 병행본문에 따라 설명했습니다.
