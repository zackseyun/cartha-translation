review_pass:
  verdict: revise
  source_fidelity: 첫 두 절은 히브리어의 ‘세우다/굳게 하다’, ‘복으로’, ‘그의 상속분’을 대체로 충실히 반영합니다. 그러나 לשבטים는 ‘지파들 위에’라는 통치·권위의 뜻을 명시하지 않으며, 마지막 부정사 לחלק은 ‘그가 나누게 하셨다’라는 사역 구문을 직접 요구하지 않습니다. 그리스어 병행본문은 상속의 몫들을 열둘로 나누어 지파들 가운데 분배한 뜻을 뒷받침하지만, 히브리어의 압축성과 목적어의 생략은 보존해야 합니다.
  naturalness: 초안의 합쇼체는 자연스럽습니다. 다만 ‘그의 몫을 그에게’는 소유·수여의 대상이 겹쳐 다소 어색하고, ‘지파들 위에 세우시어, 열두 몫으로 나누게 하셨습니다’는 누가 무엇을 나누는지와 통치 관계를 과도하게 확정합니다. ‘상속분’과 ‘지파들을 위해 세우시고’가 더 분명하고 자연스럽습니다.
  terminology: נחלה에는 단순한 ‘몫’보다 상속·배분된 소유의 뜻이 있으므로 ‘상속분’이 적절합니다. ברכה는 현대 한국어에서 ‘복’으로 자연스럽게 옮길 수 있습니다. ‘지파’는 표준적인 성서 역사 용어입니다.
  issues:
  - severity: medium
    issue: ‘지파들 위에 세우시어’
    rationale: 히브리어는 לשבטים(‘지파들을 위하여/지파들과 관련하여’)이며 ‘위에’를 뜻하는 전치사 על가 없습니다. ‘위에’는 본문에 없는 권위 관계를 확정합니다.
  - severity: medium
    issue: ‘열두 몫으로 나누게 하셨습니다’
    rationale: לחלק은 압축된 부정사로, 본문은 사역 동사 ‘나누게 하다’를 명시하지 않습니다. 그리스어는 하나님이 몫들을 나누어 분배한 것으로 읽히므로, 수여받은 인물이 나누는 행위자로 확정하지 않는 번역이 안전합니다.
  - severity: low
    issue: ‘그의 몫을 그에게’
    rationale: 히브리어 נחלתו의 ‘상속분’ 의미가 ‘몫’보다 약해지며, 한국어에서는 ‘그의’와 ‘그에게’의 지시 대상이 연속되어 다소 불명료합니다.
