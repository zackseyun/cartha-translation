translation:
  language: ko
  text: 그들 가운데 어떤 이들은 그들의 유산 가운데서 칭송받을 이름을 남겼습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그들의 유산 가운데서’는 문맥상 그들의 후손이나 계승된 유산의 영역을 가리킬 수도 있습니다. 그리스어 평행문은 그들의 칭송을 되풀이하여 말하는 뜻을 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יש מהם
  english_pob_choice: Some of them
  chosen_korean: 그들 가운데 어떤 이들은
  alternatives_korean:
  - 그들 중 일부는
  - 그들 가운데 몇몇은
  lexicon: HALOT
  rationale: 부분을 가리키는 표현이므로, 자연스러운 한국어로 ‘그들 가운데 어떤 이들은’이라고 옮겨 원문의 부분성을 살렸습니다.
- source_word: הניחו שם
  english_pob_choice: left behind a name
  chosen_korean: 이름을 남겨
  alternatives_korean:
  - 이름을 남기고
  - 명성을 남겨
  lexicon: HALOT
  rationale: ‘שם’의 문자적 ‘이름’을 유지하되, 문맥상 기억과 명예의 잔존을 뜻하므로 한국어 관용에 맞게 ‘이름을 남겨’로 옮겼습니다.
- source_word: להשתענות
  english_pob_choice: to be praised
  chosen_korean: 칭송을 받게 했습니다
  alternatives_korean:
  - 찬양을 받게 했습니다
  - 칭찬을 받게 했습니다
  - 기억되게 했습니다
  lexicon: HALOT
  rationale: 난해한 히브리어 표현이지만, 영어 POB와 그리스어 평행문의 ‘칭송/찬양’ 계열 의미를 따라 수동적 결과를 드러내는 ‘칭송을 받게 했습니다’로 옮겼습니다.
- source_word: בנחלתם
  english_pob_choice: among their inheritance
  chosen_korean: 그들의 유산 가운데서
  alternatives_korean:
  - 그들의 상속분 안에서
  - 그들의 기업 가운데서
  - 그들의 후손들 가운데서
  lexicon: HALOT
  rationale: 문자적으로는 ‘그들의 기업/유산 안에서’이지만, 여기서는 기억이 보존되는 영역을 가리키므로 너무 해석을 좁히지 않고 ‘유산 가운데서’로 옮겼습니다.
theological_decisions:
- issue: ‘이름’과 ‘유산’의 관계를 어떻게 보존할 것인가
  chosen_reading: 명예/후손으로 완전히 풀지 않고 ‘이름’과 ‘유산’의 이미지를 유지했습니다.
  alternative_readings:
  - 명성을 남겨 후손들 가운데서 칭송을 받게 했습니다
  - 명예를 남겨 그들의 상속 안에서 기억되게 했습니다
  rationale: 이 절은 교리 논쟁점은 아니지만, 성경적 기념 언어의 울림이 중요하므로 추상화보다 원문 이미지를 더 직접적으로 보존했습니다.
  doctrine_reference: Translation philosophy §§1, 5, 6
