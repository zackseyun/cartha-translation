  source_fidelity: 원문의 맹세에 의한 확증, 민족들이 후손 안에서 복을 받는 수동적 표현, 그리고 후손에게 주어지는 유업의 지리적 범위를 대체로 반영합니다. 다만 현 번역의 ‘그들을 … 유업으로 주시기’는 한국어에서 사람 자체를 유업으로 준다는 뜻으로 읽혀, להנחילם/κατακληρονομῆσαι αὐτούς의 ‘그들이 유업을 받게 하다’라는 뜻을 충분히 전달하지 못합니다.
