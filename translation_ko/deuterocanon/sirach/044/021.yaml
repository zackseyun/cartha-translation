base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/044/021.yaml
  text: Therefore he confirmed it to him with an oath that nations would be blessed in his offspring[a], and that he would give them as an inheritance from sea to sea[b], and from the River to the ends of the earth.
  footnotes:
  - marker: a
    text: Hebrew has 'from water(s) to sea' in the cited edition, but the Greek parallel reads 'from sea to sea,' which likely preserves the intended territorial formula; the translation follows that sense.
    reason: textual_variant
  - marker: b
    text: '''The River'' is the conventional biblical way of referring to the Euphrates in territorial-promise language.'
    reason: cross_reference
translation:
  language: ko
  text: 그러므로 그는 맹세로 그에게 확증하셨습니다. 곧 민족들이 그의 후손 안에서 복을 받게 하시고, 그들을 바다에서 바다까지, 그리고 강에서 땅 끝까지 유업으로 주시기 위해서였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문에는 ‘물들에서 바다까지’로 읽힐 수 있으나, 평행하는 그리스어는 ‘바다에서 바다까지’라는 정형 표현을 보여 줍니다.
    reason: textual_variant
  - marker: b
    text: ‘강’은 이 언약 언어에서 통상 유브라테스를 가리키는 관용적 표현입니다.
    reason: cross_reference
lexical_decisions:
- source_word: בשבועה הקים לו
  english_pob_choice: he confirmed it to him with an oath
  chosen_korean: 맹세로 그에게 확증하셨습니다
  alternatives_korean:
  - 맹세로 그에게 세우셨습니다
  - 맹세로 그에게 굳게 세우셨습니다
  lexicon: HALOT
  rationale: הקים plus oath language는 단순한 ‘세우다’보다 약속을 공식적으로 확정한다는 뜻이 강하므로, 현대 한국어에서는 ‘확증하다’가 그 법적·언약적 뉘앙스를 가장 잘 살립니다.
- source_word: לברך בזרעו גוים / ἐνευλογηθῆναι ἔθνη ἐν τῷ σπέρματι αὐτοῦ
  english_pob_choice: that nations would be blessed in his offspring
  chosen_korean: 민족들이 그의 후손 안에서 복을 받게 하시고
  alternatives_korean:
  - 민족들이 그의 씨 안에서 복을 받게 하시고
  - 그의 후손을 통해 민족들에게 복을 주시고
  lexicon: HALOT / LXX
  rationale: 수동형 의미를 살려 ‘복을 받다’로 옮기고, συλλογ적 단수인 זרעו는 현대 독자에게 자연스러운 ‘후손’으로 옮겼습니다. ‘안에서’는 ἐν τῷ σπέρματι의 관계를 반영합니다.
- source_word: להנחילם
  english_pob_choice: that he would give them as an inheritance
  chosen_korean: 그들을 … 유업으로 주시기 위해서였습니다
  alternatives_korean:
  - 그들에게 유업으로 주시기 위해서였습니다
  - 그들을 상속으로 주시기 위해서였습니다
  lexicon: HALOT / LXX
  rationale: הנחיל은 ‘유업으로 주다/상속시키다’의 뜻이므로, 한국어 성경 용례와 현대 가독성을 함께 고려해 ‘유업으로 주시다’로 옮겼습니다.
- source_word: מים עד ים ... ומנהר עד אפסי ארץ
  english_pob_choice: from sea to sea, and from the River to the ends of the earth
  chosen_korean: 바다에서 바다까지, 그리고 강에서 땅 끝까지
  alternatives_korean:
  - 바다에서 바다까지, 그리고 강에서 땅 끝까지
  - 바다에서 바다까지, 그리고 그 강에서 땅 끝까지
  lexicon: HALOT / parallel Greek
  rationale: 히브리어는 ‘물들’이지만 평행 헬라어가 정착된 지리적 공식 ‘바다에서 바다까지’를 지지하므로 그 관용구를 따랐습니다. ‘강’은 본문이 특정 명칭을 주지 않으므로 ‘그 강’으로 과도하게 특정하지 않았습니다.
theological_decisions:
- issue: 아브라함 언약의 복 주심과 유업 주심의 관계
  chosen_reading: 민족들이 그의 후손 안에서 복을 받게 하시고, 그들을 … 유업으로 주시기 위해서였습니다
  alternative_readings:
  - 민족들을 그의 후손을 통해 복 주시고 그들에게 유업을 주시기 위해서였습니다
  - 민족들이 그의 후손 안에서 복을 받게 하시고 그들이 유업을 받게 하시기 위해서였습니다
  rationale: 히브리어와 그리스어 모두 복 주심과 유업 주심을 함께 보존하므로, 원문의 두 목적절 구조를 풀어내되 행위 주체와 수동 의미의 긴장을 해소하지 않고 유지했습니다.
  doctrine_reference: 언약의 보편성(창세기 12장/22장 계열)과 목적절 구조 보존
