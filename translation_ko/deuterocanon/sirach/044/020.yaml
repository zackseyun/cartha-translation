translation:
  language: ko
  text: 그는 지극히 높으신 분의 계명들을 지키고 그와 언약을 맺었으며, 그의 육신에[b] 그를 위하여 규례를 정하였고[a], 시험에서 신실한 것으로 드러났습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 병행문은 여기서 “그의 육신에 그와 언약을 세웠다”라고 읽습니다. 히브리어 증거는 “규례”를 읽습니다.
    reason: textual_variant
  - marker: b
    text: ‘그의 육신에’는 대체로 할례를 통한 언약의 표지를 가리키는 표현으로 이해됩니다.
    reason: cross_reference
lexical_decisions:
- source_word: שמר מצות
  english_pob_choice: kept the commandments
  chosen_korean: 명령을 지키고
  alternatives_korean:
  - 계명을 지키고
  - 명령들을 지키고
  lexicon: HALOT
  rationale: מצות는 복수형이지만 한국어에서는 ‘명령을 지키다’가 자연스럽고, 언약적 순종의 의미를 과도하게 풀지 않으면서 원문의 뜻을 살립니다.
- source_word: עליון
  english_pob_choice: the Most High
  chosen_korean: 지극히 높으신 이
  alternatives_korean:
  - 지극히 높으신 분
  - 가장 높으신 분
  lexicon: HALOT
  rationale: 하나님 칭호를 직역하기보다 한국어에서 자연스러운 존칭형으로 옮겨, 원문의 경외적 호칭을 유지했습니다.
- source_word: כרת לו חק
  english_pob_choice: he established for him a statute
  chosen_korean: 그에게 규례를 세웠으며
  alternatives_korean:
  - 그에게 규정을 베었으며
  - 그에게 법도를 세웠으며
  - 그에게 율례를 세웠으며
  lexicon: HALOT
  rationale: 히브리어 חק은 ‘규례/법도’의 뜻이므로 이를 살렸고, כרת의 ‘베다’ 뉘앙스는 언약·할례 문맥이지만 본문과 주해상 문맥을 고려해 자연스러운 ‘세우다’로 옮겼습니다.
- source_word: בניסוי נמצא נאמן
  english_pob_choice: in testing he was found faithful
  chosen_korean: 시험 중에 신실한 것으로 드러났습니다
  alternatives_korean:
  - 시련 속에서 신실한 것으로 드러났습니다
  - 시험에서 신실함이 드러났습니다
  - 시험 중에 충실한 사람으로 드러났습니다
  lexicon: HALOT
  rationale: נמצא נאמן은 결과 상태를 나타내므로 ‘드러났습니다’로 자연스럽게 옮겼고, נאמן은 언약적 충실성을 살려 ‘신실한’으로 번역했습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행문의 차이(‘규례’ 대 ‘언약’)
  chosen_reading: 본문은 현존 히브리어를 따라 ‘규례를 세웠으며’로 두고, 그리스어의 ‘언약’ 의미는 각주로 드러냈습니다.
  alternative_readings:
  - ‘그의 육신 안에서 그에게 언약을 세웠으며’
  - ‘그의 육신 안에서 그에게 계약을 맺었으며’
  rationale: 이 절의 핵심은 아브라함 언약 전통과 할례 암시를 보존하되, 사본 증거의 차이를 숨기지 않는 것입니다. 히브리어 증거를 본문에 두고 그리스어 차이는 주석으로 남겨 투명성을 유지했습니다.
  doctrine_reference: Sirach textual criticism; source primacy with transparent variant reporting
- issue: ‘그의 육신 안에서’의 할례 암시
  chosen_reading: 직접 풀어쓰지 않고 육체적 표현을 유지했습니다.
  alternative_readings:
  - ‘그의 몸에 할례로 언약의 표를 세웠으며’
  - ‘그의 육신에 할례를 베풀어’
  rationale: 문맥상 할례를 가리키는 암시가 강하지만, 본문 자체는 압축적으로 말하므로 해설을 본문으로 밀어넣지 않고 원문의 함축을 유지했습니다.
  doctrine_reference: Translation philosophy; preserve allusive biblical wording
