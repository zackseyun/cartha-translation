base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/044/003.yaml
  text: rulers of the land in their kingdoms[a], and men renowned for their might; counselors in their understanding[b], and seers of all things in their prophecy.
  footnotes:
  - marker: a
    text: Hebrew דורי ארץ is difficult; the Greek parallel reads 'exercising dominion in their kingdoms,' which supports the rendering 'rulers of the land.'
    reason: alternative_reading
  - marker: b
    text: Or 'seers of all' / 'those declaring in prophecies.' The Hebrew is terse here, while the Greek parallel more explicitly emphasizes prophetic proclamation.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들의 나라에서 통치하는 이들, 그리고 권능으로 이름난 사람들; 이해력으로 조언하는 이들, 그리고 예언으로 모든 것을 선포하는 사람들입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 דורי ארץ는 단독으로는 어렵지만, 그리스어 병행구의 ‘통치하다/지배하다’가 있어 ‘통치하는 이들’로 옮겼습니다.
    reason: alternative_reading
  - marker: b
    text: ‘예언으로 모든 것을 선포하는’은 히브리어의 간결한 표현과 그리스어 병행구의 예언적 선포를 함께 반영한 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: דורי ארץ / κυριεύοντες ἐν ταῖς βασιλείαις αὐτῶν
  english_pob_choice: rulers of the land in their kingdoms
  chosen_korean: 그들의 나라에서 통치하는 이들
  alternatives_korean:
  - 땅의 통치자들
  - 그들의 왕국에서 다스리는 이들
  lexicon: HALOT; Greek parallel κυριεύοντες
  rationale: 히브리어의 קשה한 표현을 그리스어 병행구가 ‘통치하다/지배하다’로 풀어 주므로, 한국어도 직역보다 기능적으로 ‘통치하는 이들’로 옮겼습니다.
- source_word: אנשי שם
  english_pob_choice: men renowned
  chosen_korean: 이름난 사람들
  alternatives_korean:
  - 명망 있는 사람들
  - 유명한 사람들
  lexicon: HALOT
  rationale: 직역인 ‘이름의 사람들’은 한국어에서 부자연스러워, 관용적 의미인 ‘이름난’으로 옮겼습니다.
- source_word: בגבורתם / ἐν δυνάμει
  english_pob_choice: for their might
  chosen_korean: 권능으로
  alternatives_korean:
  - 힘으로
  - 용맹으로
  lexicon: HALOT; LXX δυναμις
  rationale: 히브리어 גבורת과 그리스어 δύναμις의 넓은 ‘능력/강함’을 살리되, 영웅적 무용담보다 공적 위세를 드러내는 한국어로 ‘권능’이 가장 응축적입니다.
- source_word: היועצים בתבונתם
  english_pob_choice: counselors in their understanding
  chosen_korean: 이해력으로 조언하는 이들
  alternatives_korean:
  - 그들의 이해 안에서 조언하는 이들
  - 지혜로 조언하는 이들
  lexicon: HALOT
  rationale: יועצים는 단순 명사보다 ‘조언하는 이들’이 문맥에 맞고, תבונה는 지적 분별을 가리키므로 ‘이해력’으로 옮겼습니다.
- source_word: וחוזי כל בנבואתם
  english_pob_choice: and seers of all things in their prophecy
  chosen_korean: 그리고 예언으로 모든 것을 선포하는 사람들입니다
  alternatives_korean:
  - 그리고 예언 가운데 모든 것을 보는 사람들입니다
  - 그리고 예언으로 모든 것을 말하는 사람들입니다
  lexicon: HALOT; Greek parallel ἀπηγγελκότες ἐν προφητείαις
  rationale: 히브리어 חוזי와 그리스어 병행구는 단순 ‘보는’ 행위보다 예언적 발표를 강조하므로, ‘선포하는’으로 공적 예언 행위를 드러냈습니다.
theological_decisions:
- issue: 히브리어 남성 복수 אנשי의 성별 표지 유지 여부
  chosen_reading: ‘사람들’로 옮기되, 본문 전체의 남성 대표적 열거 구조는 유지했습니다.
  alternative_readings:
  - ‘사람들’을 ‘인물들’로 중성화
  - ‘남자들’로 직역
  rationale: 여기서는 명백한 남성 집단 호칭이지만 한국어 출판문맥에서 과도한 성별 표지는 불필요하여, 의미는 유지하되 자연스러운 ‘사람들’로 처리했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
