translation:
  language: ko
  text: 그들은 계획에 능한 민족들의 지도자들이며[a], 탐구에 능한 고관들이고, 기록하는 일에 말에 지혜로운 이들이며[b], 맡은 직무를 다스리는 통치자들입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘계획’은 히브리어 מזמה의 문맥상 중립적인 뜻을 따른 번역입니다. 이 말은 ‘계책’이나 ‘도모’로도 옮길 수 있으나, 여기서는 지도자들에 대한 찬양의 문맥에 맞추어 부정적 뉘앙스를 피했습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 본문은 ‘그들의 기록/글쓰기’에 해당하는 표현을 읽습니다. 마사다 사본은 이와 가까운 ‘그들의 책들’이라는 읽기를 지지합니다. 그리스어 병행 본문은 구절의 결합과 강조점이 다소 달라 서기관적 행정과 가르침을 더 부각하지만, 여기서는 히브리어 본문을 따랐습니다.
    reason: textual_variant
lexical_decisions:
- source_word: שרי גוים
  english_pob_choice: leaders of nations
  chosen_korean: 민족들의 지도자들
  alternatives_korean:
  - 나라들의 지도자들
  - 열방의 지도자들
  - 민족의 방백들
  lexicon: HALOT
  rationale: שרים은 통치 엘리트나 지도자를 가리키므로 ‘지도자들’이 자연스럽고, גוים은 정치적·집단적 의미의 ‘민족들’로 옮겨 원문의 넓은 범위를 살렸습니다.
- source_word: במזמתם
  english_pob_choice: in their planning
  chosen_korean: 그들의 계획 안에
  alternatives_korean:
  - 그들의 계책 안에
  - 그들의 도모 안에
  - 그들의 상담 안에
  lexicon: HALOT
  rationale: מזמה는 여기서 부정적 ‘꾀’보다 중립적 ‘계획/도모’가 문맥에 맞으므로, POB의 ‘planning’을 반영해 ‘계획 안에’로 옮겼습니다.
- source_word: במחקרותם
  english_pob_choice: in their investigations
  chosen_korean: 그들의 이해력 안에
  alternatives_korean:
  - 그들의 조사 안에
  - 그들의 탐구 안에
  - 그들의 연구 안에
  lexicon: HALOT
  rationale: מחקר은 ‘탐구/면밀한 살핌’의 뜻이지만, 칭송 문맥에서는 행위보다 그 결과인 ‘이해/분별’이 더 자연스럽게 드러나므로 POB 개정 방향을 따라 ‘이해력’으로 옮겼습니다.
- source_word: בספרתם
  english_pob_choice: through their writings
  chosen_korean: 그들의 기록 안에서
  alternatives_korean:
  - 그들의 글 안에서
  - 그들의 책들 안에서
  - 그들의 저술 안에서
  lexicon: HALOT
  rationale: ספר는 글쓰기·기록·책을 가리킬 수 있으므로, 유다서적 지혜의 맥락에서 ‘기록’이 가장 중립적이며, 본문의 서사적 문맥과도 잘 맞습니다.
theological_decisions:
- issue: 지혜 전승의 성격
  chosen_reading: 본문을 제도적 권력의 칭송이라기보다, 지도력과 문자·기록 능력을 함께 갖춘 지혜 전승의 묘사로 읽었습니다.
  alternative_readings:
  - 단순한 정치 엘리트 목록으로만 읽는 견해
  - 서기관적 지혜를 과장된 수사로 보는 견해
  rationale: 히브리어와 그리스어 병행은 통치와 기록/학문이 함께 제시되어, 권력과 지혜가 결합된 칭송이라는 점을 드러냅니다.
  doctrine_reference: 집회서 44:1-4의 조상 칭송 및 지혜문학의 인물 평가
