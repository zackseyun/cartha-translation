  - marker: b
    text: The Greek parallel differs somewhat from the Hebrew in the second phrase, emphasizing understanding connected with scribal administration of the people. The translation follows the Hebrew as the primary witness here while keeping the Greek in view.
    reason: alternative_reading
translation:
  language: ko
  text: 민족들의 지도자들은 그들의 계획 안에 있고[a], 고관들은 그들의 이해력 안에 있으며, 말에 능한 이들은 그들의 기록 안에서 지혜롭고[b], 통치자들은 그들의 직분 안에 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘계획’은 מזמה의 중립적 의미를 따른 번역입니다. 영어 POB의 ‘planning’과 대응하며, ‘계책’보다 덜 부정적입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘조사/탐구’ 쪽 뉘앙스를 가지며, 영어 POB의 최신 정리도 ‘understanding’과 ‘investigations’ 사이의 긴장을 반영합니다. 여기서는 지혜와 분별의 결과를 드러내기 위해 ‘이해력’으로 옮겼습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: שרי גוים
  english_pob_choice: leaders of nations
  chosen_korean: 민족들의 지도자들
  alternatives_korean:
  - 나라들의 지도자들
  - 열방의 지도자들
  - 민족의 방백들
  lexicon: HALOT
  rationale: שרים은 통치 엘리트나 지도자를 가리키므로 ‘지도자들’이 자연스럽고, גוים은 정치적·집단적 의미의 ‘민족들’로 옮겨 원문의 넓은 범위를 살렸습니다.
- source_word: במזמתם
  english_pob_choice: in their planning
  chosen_korean: 그들의 계획 안에
  alternatives_korean:
  - 그들의 계책 안에
  - 그들의 도모 안에
  - 그들의 상담 안에
  lexicon: HALOT
  rationale: מזמה는 여기서 부정적 ‘꾀’보다 중립적 ‘계획/도모’가 문맥에 맞으므로, POB의 ‘planning’을 반영해 ‘계획 안에’로 옮겼습니다.
- source_word: במחקרותם
  english_pob_choice: in their investigations
  chosen_korean: 그들의 이해력 안에
  alternatives_korean:
  - 그들의 조사 안에
  - 그들의 탐구 안에
  - 그들의 연구 안에
  lexicon: HALOT
  rationale: מחקר은 ‘탐구/면밀한 살핌’의 뜻이지만, 칭송 문맥에서는 행위보다 그 결과인 ‘이해/분별’이 더 자연스럽게 드러나므로 POB 개정 방향을 따라 ‘이해력’으로 옮겼습니다.
- source_word: בספרתם
  english_pob_choice: through their writings
  chosen_korean: 그들의 기록 안에서
  alternatives_korean:
  - 그들의 글 안에서
  - 그들의 책들 안에서
  - 그들의 저술 안에서
  lexicon: HALOT
  rationale: ספר는 글쓰기·기록·책을 가리킬 수 있으므로, 유다서적 지혜의 맥락에서 ‘기록’이 가장 중립적이며, 본문의 서사적 문맥과도 잘 맞습니다.
