lexical_decisions:
- source_word: אברהם
  english_pob_choice: Abraham
  chosen_korean: 아브라함
  alternatives_korean:
  - 아브람
  lexicon: 고유명사 표기 관행
  rationale: 히브리어 고유명사 אברהם은 통용되는 성서 표기인 아브라함으로 옮기는 것이 가장 자연스럽습니다.
- source_word: אב המון גוים
  english_pob_choice: father of a multitude of nations
  chosen_korean: 민족들의 무리의 아버지
  alternatives_korean:
  - 많은 민족들의 아버지
  - 민족들의 큰 무리의 아버지
  lexicon: HALOT
  rationale: אב은 '아버지', המון은 단순한 '많은'보다 '무리/다수'가 더 가깝고, גוים은 문맥상 이방 민족들이므로 '민족들'로 옮겼습니다.
- source_word: לא נתן
  english_pob_choice: no blemish was found
  chosen_korean: 흠이 없었습니다
  alternatives_korean:
  - 흠이 발견되지 않았습니다
  - 결함이 없었습니다
  lexicon: HALOT
  rationale: 히브리어의 직역은 어색하지만, 영어 POB가 잡은 commendatory sense를 따라 아브라함의 명예가 손상되지 않았다는 뜻을 한국어의 자연스러운 부정 표현으로 옮겼습니다.
- source_word: בכבודו
  english_pob_choice: in his honor
  chosen_korean: 그의 영예에는
  alternatives_korean:
  - 그의 명예에는
  - 그의 영광에는
  lexicon: HALOT
  rationale: כבוד는 여기서 '명예/영예'의 의미가 적절하며, '영광'도 가능하지만 흠과 대비되는 문맥에는 '영예'가 더 직접적입니다.
theological_decisions:
- issue: 히브리어 본문과 헬라어 병행문의 마지막 절 표현 차이
  chosen_reading: 본문은 히브리어를 따라 아브라함의 영예에 흠이 없었다고 번역하고, 헬라어의 '영예/영광에서 그와 같은 이가 발견되지 않았다'는 다른 표현은 각주로 보존했습니다.
  alternative_readings:
  - 그의 영광에서 그와 같은 이는 없었습니다
  - 그의 영예에서 동등한 이는 없었습니다
  rationale: 시락서는 살아 있는 히브리어 본문을 우선하되, 헬라어 병행문의 실제 차이는 지워서는 안 됩니다. 두 본문은 모두 아브라함의 탁월함을 말하지만 표현이 달라서, 본문과 각주로 함께 드러내는 것이 적절합니다.
  doctrine_reference: 'PHILOSOPHY.md: surviving Hebrew first, Greek parallel as real translation input; preserve genuine tension.'
