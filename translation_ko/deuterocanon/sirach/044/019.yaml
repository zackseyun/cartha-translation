  source_fidelity: 본문의 ‘아브라함’과 마지막 절의 ‘그의 영예에는 흠이 없었습니다’는 히브리어 אברהם 및 בכבודו מום의 의미를 대체로 충실히 반영합니다. 다만 אב המון גוים는 ‘민족들의 무리의 아버지’보다 ‘수많은 민족의 아버지’가 히브리어의 ‘많은/큰 무리’라는 뜻을 자연스럽고 정확하게 전달합니다. 헬라어 병행문의 실질적 차이도 각주로 보존되어야 합니다.
  naturalness: ‘민족들의 무리의 아버지’는 연속된 소유격 때문에 현대 한국어로 다소 부자연스럽습니다. ‘수많은 민족의 아버지’가 간결하고 자연스러우며, 성서적 문체에도 잘 맞습니다. ‘영예에는 흠이 없었습니다’도 이해 가능하나, 원문의 명시적 부정 표현을 살린 ‘흠이 발견되지 않았습니다’가 더 직접적입니다.
  terminology: ‘아브라함’은 표준적인 성서 인명 표기입니다. כבוד에는 이 문맥에서 ‘영예’가 적절하고, מום에는 ‘흠’이 자연스럽습니다. 각주의 ‘그의 영광/영예에서’는 한국어상 ‘그의 영광(또는 영예)에 있어’로 다듬는 편이 자연스럽고, 헬라어 δόξα의 범위를 보존합니다.
