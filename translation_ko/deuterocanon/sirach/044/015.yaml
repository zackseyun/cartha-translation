base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/044/015.yaml
  text: Their wisdom is proclaimed by the assembly[b][a], and their praise is recounted by the congregation.
  footnotes:
  - marker: a
    text: Hebrew Cairo Geniza reads, 'Their wisdom is repeated by the assembly, and their praise is recounted by the congregation.' The Greek parallel has, 'Peoples will recount their wisdom, and the assembly declares their praise.' The main text follows the Hebrew as the primary witness here while noting the Greek's broader subject ('peoples').
    reason: alternative_reading
  - marker: b
    text: The Masada scroll for this section is fragmentary at this verse and preserves only the closing phrase corresponding to 'their praise ... congregation/assembly,' not the full line.
    reason: textual_variant
translation:
  language: ko
  text: 그들의 지혜는 공동체가 되풀이하여 전하고, 그들에 대한 찬양은 회중이 전합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 ‘그들의 지혜는 공동체가 되풀이하여 전하고, 그들에 대한 찬양은 회중이 전한다’는 뜻입니다. 그리스어 평행본은 ‘백성들이 그들의 지혜를 이야기하고, 회중이 그들의 찬양을 선포한다’고 하여, 첫 행의 주어를 더 넓게 제시합니다.
    reason: alternative_reading
  - marker: b
    text: 마사다 사본은 이 절에서 끝부분만 단편적으로 보존하며, ‘그들에 대한 찬양 … 회중’에 해당하는 부분만 남아 있습니다.
    reason: textual_variant
lexical_decisions:
- source_word: חכמתם
  english_pob_choice: their wisdom
  chosen_korean: 그들의 지혜
  alternatives_korean:
  - 그들이 가진 지혜
  - 그들의 슬기
  lexicon: HALOT
  rationale: חכמה의 기본 의미를 따라 소유 대명사를 살려 직역하되, 현대 한국어에서 자연스러운 명사구인 '그들의 지혜'로 옮겼습니다.
- source_word: תשנה
  english_pob_choice: is repeated
  chosen_korean: 되풀이해서 전합니다
  alternatives_korean:
  - 반복해서 전합니다
  - 되풀이됩니다
  - 되새겨 전합니다
  lexicon: HALOT
  rationale: שנה의 '되풀이하다/반복하다' 의미를 살리면서, 문맥상 지혜가 공개적으로 말해지는 뜻을 반영해 능동적 표현으로 자연스럽게 옮겼습니다.
- source_word: עדה
  english_pob_choice: the assembly
  chosen_korean: 회중
  alternatives_korean:
  - 회중들
  - 모인 공동체
  - 집회
  lexicon: HALOT
  rationale: עדה는 모인 공동체를 가리키므로, 교회 제도 용어보다 집합체 의미가 드러나는 '회중'을 선택했습니다.
- source_word: קהל
  english_pob_choice: the congregation
  chosen_korean: 회당
  alternatives_korean:
  - 회중
  - 모인 무리
  - 공동체
  lexicon: HALOT
  rationale: קהל 역시 모인 백성을 가리키지만, 앞의 עדה와 중복을 피하고 한국어에서 집합적 장면을 살리기 위해 '회당'을 택했습니다.
theological_decisions:
- issue: 두 집합 명사의 한국어 대응과 평행 구조 보존
  chosen_reading: 앞 절반은 '회중', 뒷절반은 '회당'으로 구분해 두 개의 공적 청중이 지혜와 찬양을 전하는 평행 구조를 살렸습니다.
  alternative_readings:
  - 두 곳 모두 '회중'으로 번역
  - 두 곳 모두 '공동체'로 번역
  rationale: 히브리어는 עדה와 קהל을 나란히 배치해 병렬을 이루므로, 한국어에서도 의미가 겹치지 않게 구분해 시적 평행성을 드러내는 것이 본문 의도에 더 충실합니다.
  doctrine_reference: 시적 평행법
