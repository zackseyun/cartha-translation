  verdict: revise
  source_fidelity: 히브리어는 두 공적 집단 명사 עדה와 קהל을 병렬로 두며, 각각이 지혜를 되풀이해 전하고 찬양을 이야기하는 구조입니다. 초안의 능동 표현은 이 구조를 자연스럽게 반영합니다. 그러나 קהל은 모인 백성/회중을 뜻하지 건물 또는 제도인 ‘회당’을 뜻하지 않으므로 수정이 필요합니다. 또한 ‘그들의 찬양’은 한국어에서 그들이 드리는 찬양으로도 읽힐 수 있어, 그들을 향한 찬양임을 밝혔습니다.
  naturalness: ‘공동체’와 ‘회중’은 현대 표준 한국어의 격식 있는 문맥에서 자연스럽고, 서로 다른 히브리어 집단 명사의 병렬도 무리 없이 드러냅니다. ‘되풀이하여 전하고’는 שנה의 반복·낭송 의미를 보존하면서 합쇼체 문장으로 자연스럽습니다.
  terminology: עדה는 ‘공동체’, קהל은 ‘회중’으로 옮겼습니다. 특히 ‘회당’은 synagogue라는 장소·제도를 가리키는 말이므로 קהל의 대응어로 부적절합니다. תהלתם은 ‘그들에 대한 찬양’으로 번역하여 찬양의 대상이 조상들임을 분명히 했습니다.
