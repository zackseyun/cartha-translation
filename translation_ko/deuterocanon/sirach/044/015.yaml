revisions:
- from: 그들의 지혜는 회중이 되풀이해서 전하고, 그들의 찬양은 회당이 전합니다.[a][b]
  to: 그들의 지혜는 공동체가 되풀이하여 전하고, 그들에 대한 찬양은 회중이 전합니다.[a][b]
  rationale: 안전하고 필요한 수정은 קהל의 오역인 ‘회당’을 ‘회중’으로 바로잡는 것입니다. 이에 따라 עדה는 ‘공동체’로 옮겨 두 병렬 명사의 구별을 유지했습니다. ‘그들에 대한 찬양’은 원문의 대상 관계를 한국어에서 명료하게 하며, 반복하여 전함과 전함의 병렬은 히브리어의 시적 구조를 보존합니다. 그리스어와 마사다 사본에 관한 각주도 수정된 본문 용어 및 증거 범위에 맞추었습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T19:22:24Z'
