base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/044/017.yaml
  text: Noah was found righteous[a], blameless; at the time of destruction he became a substitute. Because of him a remnant remained[b], and by his covenant the flood ceased.
  footnotes:
  - marker: a
    text: The Greek parallel differs in the final clause, with a reading that points toward the coming of the flood rather than its cessation. The Hebrew witness used here reads, 'and by his covenant the flood ceased.'
    reason: textual_variant
  - marker: b
    text: Or 'an exchange,' 'compensation,' or 'ransom' for 'a substitute.' The Hebrew תחליף and Greek ἀντάλλαγμα both carry the idea of something given in place of another.
    reason: lexical_alternative
translation:
  language: ko
  text: 노아는 의롭고 흠 없는 이로 인정받았습니다. 파멸의 때에 그는 대체물이 되었습니다.[b] 그로 말미암아 남은 이들이 남게 되었고, 그의 언약으로 홍수가 그쳤습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 헬라어 병행본문은 마지막 절구에서 홍수가 일어났음을 가리키는 읽기를 보입니다. 그러나 여기서는 현존 히브리어 본문을 따라 ‘그의 언약으로 홍수가 그쳤습니다’로 옮겼습니다.
    reason: textual_variant
  - marker: b
    text: ‘대체물’은 ‘교환물’, ‘보상’, ‘속전’, 또는 ‘대속물’로도 옮길 수 있습니다. 히브리어 תחליף와 헬라어 ἀντάλλαγμα은 다른 것을 대신하여 주어지는 것이라는 뜻을 함께 지닙니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: צדיק
  english_pob_choice: righteous
  chosen_korean: 의롭고
  alternatives_korean:
  - 의로운
  - 정의로운
  lexicon: HALOT
  rationale: 사람의 도덕적·언약적 올바름을 가리키는 צדיק을 한국어 성서 문맥에 맞게 ‘의롭고’로 옮겼습니다.
- source_word: תמים
  english_pob_choice: blameless
  chosen_korean: 흠없는
  alternatives_korean:
  - 완전한
  - 온전한
  - 결점 없는
  lexicon: HALOT
  rationale: 절대적 완전성보다 결함 없음과 온전한 인격을 뜻하므로, 현대어로 자연스러운 ‘흠없는’이 적절합니다.
- source_word: תחליף
  english_pob_choice: a substitute
  chosen_korean: 대속물이
  alternatives_korean:
  - 대신한 것
  - 대체물
  - 속전
  lexicon: HALOT
  rationale: 무엇인가를 대신하여 주어지는 것을 가리키는 말로, 문맥상 ‘대속물’이 가장 간결하게 교환·대리의 의미를 드러냅니다.
- source_word: חדל מבול
  english_pob_choice: the flood ceased
  chosen_korean: 홍수가 그쳤습니다
  alternatives_korean:
  - 홍수가 멈추었습니다
  - 홍수가 끝났습니다
  lexicon: HALOT
  rationale: חדל은 ‘그치다/중단되다’의 의미이므로, 본문과 가장 직접적으로 대응하는 동사는 ‘그쳤습니다’입니다.
theological_decisions:
- issue: 히브리어 본문과 헬라어 병행본문의 마지막 절구 차이
  chosen_reading: 히브리어 사본을 따라 ‘그의 언약으로 홍수가 그쳤습니다’로 옮겼습니다.
  alternative_readings:
  - 헬라어 전승은 홍수의 ‘발생’ 쪽으로 기울어진 읽기를 시사합니다.
  rationale: 시락서는 히브리어가 현존하는 곳에서는 히브리어 본문을 우선하는 원칙이 적용됩니다. 이 절은 최종 절구에서 의미 차이가 크므로, 히브리어의 종결·중단 진술을 본문에 반영하고 헬라어 차이는 주석으로 남깁니다.
  doctrine_reference: 'PHILOSOPHY.md: translate Sirach from Hebrew where it survives; preserve source uncertainty honestly'
