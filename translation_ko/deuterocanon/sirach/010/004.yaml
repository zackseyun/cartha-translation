translation:
  language: ko
  text: 하나님의 손 안에 모든 사람의 통치가 있으며, 율법을 주는 이 앞에서 그는 그의 존귀를 세우십니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 평행본은 “주의 손 안에 땅의 권세가 있으며, 그에게 유익한 이를 때에 따라 그 위에 세우실 것이다”로 크게 다르게 읽습니다.
    reason: textual_variant
  - marker: b
    text: ‘존귀’는 כאן의 הוֹד를 따랐으며, ‘위엄’이나 ‘영광’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיַד אֱלֹהִים
  english_pob_choice: In the hand of God
  chosen_korean: 하나님의 손 안에
  alternatives_korean:
  - 하나님 손에
  - 하나님의 권세 아래에
  lexicon: HALOT
  rationale: 히브리어 관용구 בְּיַד를 손의 이미지로 살리되, 한국어에서는 '손 안에'가 통제와 주권을 자연스럽게 드러냅니다.
- source_word: מֶמְשֶׁלֶת
  english_pob_choice: the rule
  chosen_korean: 통치
  alternatives_korean:
  - 다스림
  - 지배
  - 권세
  lexicon: HALOT
  rationale: 명사 מֶמְשֶׁלֶת는 다스리는 권위를 가리키므로, 문맥상 추상적이면서도 힘 있는 '통치'가 적합합니다.
- source_word: כָּל גֶּבֶר
  english_pob_choice: every man
  chosen_korean: 모든 사람
  alternatives_korean:
  - 모든 남자
  - 각 사람
  lexicon: HALOT
  rationale: גֶּבֶר는 남성형이지만, 이 잠언적 진술에서는 인간 일반을 포괄하는 의미가 강하므로 한국어에서는 성별을 과도하게 부각하지 않는 '모든 사람'으로 옮겼습니다.
- source_word: מְחוֹקֵק
  english_pob_choice: the lawgiver
  chosen_korean: 율법을 주는 이
  alternatives_korean:
  - 입법자
  - 율법수여자
  - 법을 세우는 이
  lexicon: HALOT
  rationale: מְחוֹקֵק는 단순한 통치자보다 '법을 제정하거나 주는 자'의 뜻이 강하므로, 독자가 기능을 즉시 이해하도록 '율법을 주는 이'로 풀어 옮겼습니다.
- source_word: הוֹדוֹ
  english_pob_choice: his splendor
  chosen_korean: 그의 존귀
  alternatives_korean:
  - 그의 위엄
  - 그의 영화
  - 그의 영광
  lexicon: HALOT
  rationale: הוֹד는 빛남뿐 아니라 위엄과 존귀를 뜻할 수 있으며, 여기서는 인물의 품위와 높임을 가리키므로 '존귀'가 가장 무난합니다.
theological_decisions:
- issue: 인간 통치와 하나님의 주권
  chosen_reading: 이 절은 인간의 통치가 하나님의 손 안에 있다는 사실을 직접 진술하며, 통치자의 선출 방식까지는 설명하지 않습니다.
  alternative_readings:
  - 모든 통치자를 하나님이 직접 임명하신다는 더 강한 진술
  - 땅의 권세에 대한 제한된 진술
  rationale: 히브리어 본문은 주권의 범위를 분명히 말하지만, 메커니즘까지 구체화하지는 않으므로 그 긴장을 그대로 보존했습니다.
  doctrine_reference: 주권과 섭리의 구체적 방식은 본문이 말하는 범위를 넘겨 단정하지 않습니다.
