  text: Who will justify the one who sins against his own soul[a], and who will honor the one who dishonors his own life?
  footnotes:
  - marker: a
    text: 'The extant Cairo Geniza Hebrew for this verse differs sharply from the Greek and is difficult: approximately, ''My son, in humility honor yourself, and he will give you discernment and lost honor.'' The main text follows the Greek here because the Hebrew witness appears textually unstable at this point.'
    reason: textual_variant
translation:
  language: ko
  text: 자기 영혼에게 죄를 짓는 사람을 누가 의롭다 하겠습니까? 또 자기 생명을 더럽히는 사람을 누가 존중하겠습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 현존 카이로 게니자 히브리어는 이 절에서 그리스어와 크게 다르며 난해합니다. 대략적으로는 ‘내 아들아, 겸손으로 네 자신을 존중하라, 그러면 그가 너에게 분별과 잃어버린 존귀를 주리라’에 가깝습니다. 본문은 이 지점에서 본문 전승이 불안정하므로 그리스어를 따릅니다.
    reason: textual_variant
lexical_decisions:
- source_word: τὸν ἁμαρτάνοντα εἰς τὴν ψυχὴν αὐτοῦ
  english_pob_choice: the one who sins against his own soul
  chosen_korean: 자기 영혼에게 죄를 짓는 사람
  alternatives_korean:
  - 자기 자신에게 죄를 짓는 사람
  - 자기 생명에게 죄를 짓는 사람
  lexicon: BDAG
  rationale: εἰς τὴν ψυχὴν αὐτοῦ는 ‘자기 영혼/자기 자신/자기 생명’으로 갈릴 수 있으나, 뒤 절의 ζωή와 구별을 살리기 위해 ψυχή를 ‘영혼’으로 옮겼습니다.
- source_word: τίς δικαιώσει
  english_pob_choice: Who will justify
  chosen_korean: 누가 의롭다 하겠습니까
  alternatives_korean:
  - 누가 변호하겠습니까
  - 누가 정당하다고 하겠습니까
  lexicon: BDAG
  rationale: δικαιόω는 여기서 도덕적·법정적 판단의 맥락으로 쓰이므로, 한국어 신학 용례를 살리되 직역성을 유지해 ‘의롭다 하다’로 옮겼습니다.
- source_word: δοξάσει
  english_pob_choice: will honor
  chosen_korean: 존중하겠습니까
  alternatives_korean:
  - 영광스럽게 하겠습니까
  - 존귀하게 하겠습니까
  lexicon: BDAG
  rationale: 지혜문맥에서 δοξάζω는 과도한 ‘영광’보다 사람을 높이 평가하는 뜻이 자연스러워 ‘존중하다’로 번역했습니다.
- source_word: τὸν ἀτιμάζοντα τὴν ζωὴν αὐτοῦ
  english_pob_choice: the one who dishonors his own life
  chosen_korean: 자기 생명을 더럽히는 사람
  alternatives_korean:
  - 자기 생명을 욕되게 하는 사람
  - 자기 삶을 천대하는 사람
  lexicon: BDAG
  rationale: ἀτιμάζω는 단순한 무시보다 수치와 불명예를 가하는 뜻이므로, ζωή를 ‘생명’으로 두고 그 가치를 훼손한다는 뜻을 드러내기 위해 ‘더럽히다’로 옮겼습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 평행문의 현저한 불일치
  chosen_reading: 본문은 그리스어의 이중구조를 따라 번역하고, 난해한 히브리어 전승은 각주로 표시했습니다.
  alternative_readings:
  - 히브리어 약본을 따라 ‘내 아들아, 겸손으로 네 자신을 존중하라…’로 옮김
  rationale: 제공된 히브리어는 이 절에서 크게 불안정하고 그리스어는 완결된 지혜 격언을 이루므로, 본문은 그리스어를 따르되 전승 차이를 숨기지 않았습니다.
  doctrine_reference: 'POB/Sirach translation policy: preserve source uncertainty and follow the clearer extant witness where the Hebrew is materially divergent.'
