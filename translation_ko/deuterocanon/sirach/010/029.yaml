  rationale: כבד의 기본 의미인 ‘존중하다/영예롭게 하다’를 살리되, 앞절의 법정적 어조와 대칭을 이루도록 현대 한국어로 자연스럽게 정리했습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 평행문의 큰 차이
  chosen_reading: 히브리어 본문을 본문 번역으로 따르고, 그리스어 전승은 각주로 따로 보존했습니다.
  alternative_readings:
  - '그리스어: ‘가난한 사람은 자기의 지식 때문에 존중을 받고, 부자는 자기의 재산 때문에 존중을 받는다.’'
  rationale: 이 절은 두 전승의 내용이 실질적으로 다르므로, 한쪽으로 조화시키지 않고 주요 본문인 히브리어를 번역한 뒤 그리스어의 다른 전승을 각주로 드러내는 것이 가장 정직합니다.
  doctrine_reference: 'PHILOSOPHY.md: Sirach는 히브리어가 보존된 경우 히브리어를 본문으로 번역하고, 중대한 전승 차이는 각주로 투명하게 제시한다.'
