  - 죄책을 짓는
  lexicon: HALOT
  rationale: 히필 형태의 רשע는 법정적·판결적 의미를 가지므로, 단순한 감정적 비난보다 자기 자신을 죄 있는 상태로 만드는 뉘앙스를 살렸습니다.
- source_word: יַצְדִיקֶנּוּ
  english_pob_choice: declare righteous
  chosen_korean: 의롭다고 하겠으며
  alternatives_korean:
  - 의롭다 하겠으며
  - 정당하다고 하겠으며
  - 의롭게 하겠으며
  lexicon: HALOT
  rationale: צדק의 히필은 ‘의롭다고 선고하다’라는 법정적 의미이므로, 한국어에서는 자연스러운 판정 표현으로 옮겼습니다.
- source_word: מַקְלֶה
  english_pob_choice: dishonors
  chosen_korean: 멸시하는
  alternatives_korean:
  - 욕보이는
  - 천대하는
  - 경시하는
  lexicon: HALOT
  rationale: כבד의 반의적 대응으로 ‘존중하다’와 짝지어질 때, 사람의 가치를 낮추는 의미가 가장 분명하게 드러나는 표현을 택했습니다.
- source_word: יְכַבֵּד
  english_pob_choice: honor
  chosen_korean: 존중하겠습니까
  alternatives_korean:
  - 존경하겠습니까
  - 영예롭게 하겠습니까
  - 높이겠습니까
  lexicon: HALOT
  rationale: כבד의 기본 의미인 ‘존중하다/영예롭게 하다’를 살리되, 앞절의 법정적 어조와 대칭을 이루도록 현대 한국어로 자연스럽게 정리했습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 평행문의 큰 차이
  chosen_reading: 히브리어 본문을 본문 번역으로 따르고, 그리스어 전승은 각주로 따로 보존했습니다.
  alternative_readings:
  - '그리스어: ‘가난한 사람은 자기의 지식 때문에 존중을 받고, 부자는 자기의 재산 때문에 존중을 받는다.’'
  rationale: 이 절은 두 전승의 내용이 실질적으로 다르므로, 한쪽으로 조화시키지 않고 주요 본문인 히브리어를 번역한 뒤 그리스어의 다른 전승을 각주로 드러내는 것이 가장 정직합니다.
  doctrine_reference: 'PHILOSOPHY.md: Sirach는 히브리어가 보존된 경우 히브리어를 본문으로 번역하고, 중대한 전승 차이는 각주로 투명하게 제시한다.'
