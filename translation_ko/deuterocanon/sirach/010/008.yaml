translation:
  language: ko
  text: 나라의 통치권은 폭력과 오만 때문에 민족에서 민족으로 넘어갑니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '그리스어 전통: ‘통치권은 불의와 폭정과 돈 때문에 민족에서 민족으로 옮겨집니다.’'
    reason: textual_variant
lexical_decisions:
- source_word: מַלְכוּת
  english_pob_choice: Kingship
  chosen_korean: 통치권
  alternatives_korean:
  - 왕권
  - 왕국
  - 통치
  lexicon: HALOT
  rationale: 이 말은 영토 자체보다 왕의 지배 권한과 정치적 지배를 가리키므로, 한국어에서는 ‘통치권’이 ‘왕국’보다 원문 의미를 더 정확히 드러냅니다.
- source_word: מִגּוֹי אֶל גּוֹי
  english_pob_choice: from nation to nation
  chosen_korean: 민족에서 민족으로
  alternatives_korean:
  - 나라에서 나라로
  - 국가에서 국가로
  - 민족에서 다른 민족으로
  lexicon: HALOT
  rationale: גוי는 여기서 정치적 집단을 뜻하므로 ‘민족’이 무난하며, 반복 구조도 간결하게 살릴 수 있습니다.
- source_word: חֲמַס
  english_pob_choice: violence
  chosen_korean: 폭력
  alternatives_korean:
  - 강포
  - 불의
  - 억압
  lexicon: HALOT
  rationale: 히브리어 חמס는 폭력적 가해와 폭력을 동반한 악행을 뜻하므로, 현대 한국어에서는 ‘폭력’이 가장 직접적입니다.
- source_word: גַּאֲוָה
  english_pob_choice: arrogance
  chosen_korean: 오만
  alternatives_korean:
  - 교만
  - 자만
  - 거만
  lexicon: HALOT
  rationale: 이 단어는 단순한 자존감이 아니라 높아진 마음과 거만함을 가리키므로, ‘오만’이 비난의 뉘앙스를 잘 담습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행본의 원인 목록 차이
  chosen_reading: 본문은 히브리어의 두 원인인 ‘폭력과 오만’을 따르고, 그리스어의 확장된 전통은 각주로 처리합니다.
  alternative_readings:
  - '그리스어 전통: ‘불의와 폭정/모욕과 돈 때문에’'
  rationale: 이 단락은 히브리어가 고신뢰로 전승되어 있으므로 본문은 히브리어를 따르되, 그리스어의 다른 전승도 확인 가능하도록 보존하는 편이 소스에 가장 충실합니다.
  doctrine_reference: 'PHILOSOPHY.md: 현존 히브리어는 본문으로, 그리스어는 대조 전통으로 사용'
