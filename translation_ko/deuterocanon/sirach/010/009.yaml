base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/010/009.yaml
  text: Why does dust and ashes exalt itself[a], though in its life its body is lifted up?
  footnotes:
  - marker: a
    text: Hebrew final clause is difficult. The Greek parallel reads, 'For in life I cast out his inward parts,' emphasizing human bodily corruption and mortality. The Hebrew may similarly point to the body's humiliation or perishability.
    reason: alternative_reading
translation:
  language: ko
  text: 어찌하여 티끌과 재가 스스로 높아집니까? 그것의 생명 동안에는 그 몸이 들어 올려져 있으면서도 말입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 마지막 절은 난해합니다. 그리스어 병행본문은 ‘생명 중에 나는 그의 내장을 내던졌다’고 읽어, 인간 육체의 부패와 죽음을 더 분명히 드러냅니다.
    reason: alternative_reading
lexical_decisions:
- source_word: מַה
  english_pob_choice: Why
  chosen_korean: 어찌하여
  alternatives_korean:
  - 왜
  - 무엇 때문에
  lexicon: HALOT
  rationale: 수사적 책망의 질문이므로, 단순한 정보 질문보다 반어적 뉘앙스를 살리는 ‘어찌하여’가 가장 자연스럽습니다.
- source_word: יִּגְאֶה
  english_pob_choice: does exalt itself
  chosen_korean: 스스로 높아집니까
  alternatives_korean:
  - 교만해집니까
  - 자기를 높입니까
  - 우쭐해집니까
  lexicon: HALOT
  rationale: גאה의 ‘스스로 높아지다’라는 이미지를 살리면서, 현대 한국어에서 지나치게 설교체가 되지 않도록 했습니다.
- source_word: עָפָר וָאֵפֶר
  english_pob_choice: dust and ashes
  chosen_korean: 티끌과 재
  alternatives_korean:
  - 먼지와 재
  - 흙과 재
  lexicon: HALOT
  rationale: 히브리어의 고정된 인간 유한성 표현을 한국어 성서어감에 맞게 옮기되, ‘티끌’이 ‘dust’의 낮아짐과 허무함을 더 분명히 드러냅니다.
- source_word: יוּרַם גִּוְיוֹ
  english_pob_choice: its body is lifted up
  chosen_korean: 그 몸이 들어 올려져 있으면서도
  alternatives_korean:
  - 그 몸이 높여져 있으면서도
  - 그 몸이 들어 올려집니까
  lexicon: HALOT
  rationale: 난해한 마지막 절을 본문에 가능한 한 가깝게 유지하면서, ‘들어 올려지다’로 수동적 상승의 이미지를 살렸습니다. 영어 주석이 제시하듯 이 표현은 육체의 덧없음/낮아짐을 배경으로 읽히므로, 한국어에서도 그 긴장을 남겨 두었습니다.
theological_decisions:
- issue: 난해한 마지막 절의 처리
  chosen_reading: 히브리어 본문을 기본으로 하되, 마지막 절을 ‘그 몸이 들어 올려져 있으면서도’로 옮겨 몸의 일시적 높아짐과 인간의 유한성 사이의 긴장을 남겼습니다.
  alternative_readings:
  - 그 생전에는 그 몸이 올려져 있습니다
  - 그 생명 동안 그 몸은 높아집니다
  - 그 생명 동안 그 몸은 들어 올려집니다
  rationale: 이 절은 히브리어와 그리스어 병행본문 사이에 긴장이 있는 난해 구절이므로, 해석을 과도하게 평탄화하지 않고 본문의 모호성을 보존하는 쪽을 택했습니다.
  doctrine_reference: 'PHILOSOPHY.md: 살아 있는 히브리어 본문을 우선하되, 그리스어 병행본문은 의미 범위를 확인하는 보조 증거로 사용'
