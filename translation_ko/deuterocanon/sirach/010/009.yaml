    rationale: 그리스어는 ‘내장’을 말하여 히브리어의 ‘몸이 들어 올려지다’와 상당히 다릅니다. 그리스어를 대안 독법으로 제시하되, 히브리어가 육체의 낮아짐 또는 덧없음과 관련될 수 있다는 점을 명시하는 편이 감사 추적과 본문상의 불확실성을 더 정확히 반영합니다.
