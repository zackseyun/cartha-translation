  - 그를 완전히 멸하셨습니다
  lexicon: HALOT
  rationale: 결말의 전면적 파괴를 살리기 위해 단순 반복 대신 결과를 분명히 하는 한국어 표현을 사용했습니다.
- source_word: עַד כַּלֵּה
