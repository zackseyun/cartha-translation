  lexicon: HALOT
  rationale: 총체적 소멸의 의미를 짧고 분명하게 전달합니다.
theological_decisions:
- issue: 히브리어 본문의 신칭 사용과 헬라어 병행본의 차이
  chosen_reading: 본문은 히브리어 עֱלֹהִים을 따라 ‘하나님’으로 옮기고, 주어를 바꾸지 않았습니다.
  alternative_readings:
  - 주님
  - 야훼
  rationale: 이 절의 주요 현존 히브리어 증거가 אֱלֹהִים을 읽으므로, 본문은 이를 우선하고 헬라어의 Κύριος는 본문에 흡수하지 않았습니다.
  doctrine_reference: 'Sirach 번역 원칙: surviving Hebrew 우선, 병행 헬라어는 주석적 참고로 처리'
