translation:
  language: ko
  text: 그러므로 하나님께서 그의 마음을 채우시고 그를 치시며, 그를 끝까지 치셔서 멸하셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 매우 간결하고 난해하여, 직역하면 대략 ‘그러므로 하나님께서 그의 마음을 채우시고, 치셨다’가 됩니다. 병행 헬라어 본문은 주님께서 재앙 또는 심판을 크게 하시고 그들을 끝장내셨다고 읽습니다.
    reason: textual_variant
  - marker: b
    text: 헬라어 본문은 ‘주님’으로 읽습니다. 히브리어 증거는 ‘하나님’입니다.
    reason: alternative_reading
