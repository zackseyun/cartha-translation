translation:
  language: ko
  text: 그러므로 하나님께서 그의 마음을 채우시고 그를 치시며, 그를 완전히 무너뜨리셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 매우 간결하여 ‘마음을 채우다, 치다’ 정도로 직역할 수 있지만, 병행하는 헬라어는 주님의 징벌과 전멸을 말합니다.
    reason: textual_variant
  - marker: b
    text: 헬라어 본문은 ‘주님’으로 읽습니다. 히브리어 증거는 ‘하나님’입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: עַל כֵּן
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 이 때문에
  - 그래서
  lexicon: HALOT
  rationale: 앞선 문맥의 결과를 이끄는 추론 접속사로 자연스럽게 연결합니다.
- source_word: מִלֵּא לִבּוֹ
  english_pob_choice: filled his heart
  chosen_korean: 그의 마음을 채우시고
  alternatives_korean:
  - 그의 마음에 가득 채우시고
  - 그의 마음을 채우셨고
  - 그의 마음을 채우신 뒤
  lexicon: HALOT
  rationale: 히브리어의 직설적 표현을 살리되, 한국어에서는 ‘마음을 채우다’로 옮겨 본문이 말하는 내면의 충만/가득 참을 그대로 드러냅니다.
- source_word: נָגַע
  english_pob_choice: struck
  chosen_korean: 그를 치시며
  alternatives_korean:
  - 그를 치셨고
  - 그를 치셨으며
  - 그를 건드리시며
  lexicon: HALOT
  rationale: 징벌적 문맥에서 נגע는 단순한 ‘닿다’보다 ‘치다/쳐서 해를 입히다’가 더 적절하므로, 직접적이고 현대적인 동사로 옮겼습니다.
- source_word: וַיַּכֵּהוּ
  english_pob_choice: struck him down
  chosen_korean: 그를 완전히 무너뜨리셨습니다
  alternatives_korean:
  - 그를 쓰러뜨리셨습니다
  - 그를 완전히 치셨습니다
  - 그를 완전히 멸하셨습니다
  lexicon: HALOT
  rationale: 결말의 전면적 파괴를 살리기 위해 단순 반복 대신 결과를 분명히 하는 한국어 표현을 사용했습니다.
- source_word: עַד כַּלֵּה
  english_pob_choice: completely
  chosen_korean: 완전히
  alternatives_korean:
  - 끝까지
  - 철저히
  - 완전히 멸하여
  lexicon: HALOT
  rationale: 총체적 소멸의 의미를 짧고 분명하게 전달합니다.
theological_decisions:
- issue: 히브리어 본문의 신칭 사용과 헬라어 병행본의 차이
  chosen_reading: 본문은 히브리어 עֱלֹהִים을 따라 ‘하나님’으로 옮기고, 주어를 바꾸지 않았습니다.
  alternative_readings:
  - 주님
  - 야훼
  rationale: 이 절의 주요 현존 히브리어 증거가 אֱלֹהִים을 읽으므로, 본문은 이를 우선하고 헬라어의 Κύριος는 본문에 흡수하지 않았습니다.
  doctrine_reference: 'Sirach 번역 원칙: surviving Hebrew 우선, 병행 헬라어는 주석적 참고로 처리'
