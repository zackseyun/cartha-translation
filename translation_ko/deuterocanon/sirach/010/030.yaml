translation:
  language: ko
  text: 가난한 사람 가운데서도 그의 통찰 때문에 존중받는 이가 있고, 그의 재산 때문에 존중받는 이도 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '그리스어 병행문: “그러나 가난 속에서 영광받는 이가 있고, 부유함 속에서는 얼마나 더 그러하겠습니까? 그리고 부유함 속에서 영광받지 못하는 이가 있고, 가난 속에서는 얼마나 더 그러하겠습니까?” 히브리어와 그리스어는 상당히 다릅니다.'
    reason: textual_variant
lexical_decisions:
- source_word: יֵשׁ ... וְיֵשׁ
  english_pob_choice: There is ... and there is ...
  chosen_korean: …가 있고, …도 있습니다
  alternatives_korean:
  - …가 있으며, …도 있습니다
  - …하는 이가 있고, …하는 이도 있습니다
  lexicon: BDB / HALOT
  rationale: 히브리어의 존재 구문과 평행 대조를 한국어에서도 자연스럽게 살리기 위해 ‘…가 있고 …도 있습니다’로 옮겼습니다.
- source_word: דַּל
  english_pob_choice: poor man
  chosen_korean: 가난한 사람
  alternatives_korean:
  - 가난한 남자
  - 빈곤한 이
  lexicon: HALOT
  rationale: 히브리어의 단수 대표적 표현을 살리되, 현대 한국어에서 성별을 과도하게 드러내지 않는 ‘사람’으로 자연스럽게 옮겼습니다.
- source_word: שִׂכְלוֹ
  english_pob_choice: his insight
  chosen_korean: 그의 통찰
  alternatives_korean:
  - 그의 이해력
  - 그의 지혜
  - 그의 분별
  lexicon: HALOT
  rationale: שכל의 뜻인 이해·분별·슬기를 포괄하되, 이 절의 대비가 사회적 지위가 아니라 내적 판단 능력임을 드러내기 위해 ‘통찰’을 선택했습니다.
- source_word: עָשְׁרוֹ
  english_pob_choice: his wealth
  chosen_korean: 그의 재산
  alternatives_korean:
  - 그의 부
  - 그의 부유함
  - 그의 재물
  lexicon: HALOT
  rationale: 재물·부의 의미를 갖는 עושר을 일상적이면서도 구체적으로 표현하기 위해 ‘재산’을 택했습니다. 문맥상 사회적 부를 가리키는 점을 충분히 전달합니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행문의 큰 차이
  chosen_reading: 주본문은 현존 히브리어의 긍정적 평행 구조—가난하지만 통찰로 존중받는 사람과 재산 때문에 존중받는 사람—를 따랐습니다.
  alternative_readings:
  - 그리스어는 ‘가난 속에서 영광받는 이가 있는데 부유할 때는 얼마나 더 그러하겠는가’라는 수사적 비교를 제시합니다.
  rationale: 이 절은 본문 전승 차이가 크므로, 주본문은 히브리어를 따르고 그리스어의 상이한 읽기는 각주로 보존하는 것이 가장 투명합니다.
