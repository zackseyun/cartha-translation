translation:
  language: ko
  text: 가난하지만 자신의 분별 때문에 존중받는 이가 있고, 자신의 부 때문에 존중받는 이도 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '그리스어 병행문: “가난한 가운데서 존중받는 이는 부유할 때에는 얼마나 더 존중받겠습니까? 또 부유한 가운데서 존중받지 못하는 이는 가난할 때에는 얼마나 더 존중받지 못하겠습니까?” 히브리어와 그리스어는 상당히 다릅니다.'
    reason: textual_variant
