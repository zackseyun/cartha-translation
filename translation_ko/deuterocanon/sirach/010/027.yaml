  - 노동자
  - 일하는 자
  lexicon: HALOT
  rationale: 여기서는 종속 신분이 아니라 실제로 일하는 행위를 가리키므로, 현대 한국어에서 가장 자연스러운 표현으로 옮겼습니다.
- source_word: וְיוֹתֵר הוֹן
  english_pob_choice: and has abundant wealth
  chosen_korean: 재물이 넉넉한
  alternatives_korean:
  - 더 많은 재물을 가진
  - 풍족한 재산을 가진
  - 재산이 풍부한
  lexicon: HALOT
  rationale: יותר의 과잉/충분함과 הון의 재산 의미를 살려, 단순한 ‘더 많다’보다 풍요와 충분성을 보여 주는 표현을 택했습니다.
- source_word: מִמִּתְכַּבֵּד
  english_pob_choice: than one who honors himself
  chosen_korean: 스스로를 높이는 사람
  alternatives_korean:
  - 자기를 영화롭게 하는 사람
  - 자기를 자랑하는 사람
  - 자신을 드높이는 사람
  lexicon: HALOT
  rationale: 히트파엘의 반사적 의미를 따라, 외적 존중이 아니라 자기과시·자기고양의 뉘앙스를 살렸습니다.
- source_word: וַחֲסַר מַתָּן
  english_pob_choice: and lacks food
  chosen_korean: 음식이 없는 사람
  alternatives_korean:
  - 먹을 것이 없는 사람
  - 양식이 부족한 사람
  - 공급이 없는 사람
  lexicon: HALOT
  rationale: 문맥상 재물과 대비되는 기본 생계의 결핍을 가리키므로, ‘음식/먹을 것’로 옮겨 허기를 분명하게 했습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행본의 큰 차이
  chosen_reading: 주 본문은 현존 히브리어를 따르되, 그리스어는 주석 각주로 투명하게 보존합니다.
  alternative_readings:
  - '그리스어: 「내 아이야, 온유함 가운데서 네 영혼을 영화롭게 하고, 그 가치에 따라 그것을 존귀하게 하라」'
  rationale: 지혜서의 히브리어가 보존된 경우 이를 우선하되, 여기서는 두 전승이 실질적으로 다른 문장을 전하므로 본문과 각주로 차이를 드러내는 것이 소스 충실성에 부합합니다.
  doctrine_reference: 'PHILOSOPHY.md: 히브리어 우선, 큰 본문 차이는 숨기지 않고 기록'
