translation:
  language: ko
  text: 일하는 사람이 있고 재물이 넉넉한 것이, 스스로를 높이는 사람과 음식이 없는 사람보다 낫습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '그리스어 증인: 「내 아이야, 온유함 가운데서 네 영혼을 영화롭게 하고, 그 가치에 따라 그것을 존귀하게 하라」. 히브리어와 그리스어는 상당히 다릅니다.'
    reason: alternative_reading
lexical_decisions:
- source_word: טוֹב
  english_pob_choice: Better is
  chosen_korean: ~보다 낫습니다
  alternatives_korean:
  - 좋습니다
  - 더 좋습니다
  lexicon: HALOT
  rationale: 지혜문학의 비교형 판단을 한국어 자연어로 풀어, 격언의 평가 기능을 분명하게 드러냈습니다.
- source_word: עוֹבֵד
  english_pob_choice: one who works
  chosen_korean: 일하는 사람
  alternatives_korean:
