  lexicon: HALOT
  rationale: 단순 지능보다 상황을 제대로 판단하는 성격이 강조되므로, POB의 ‘intelligent’를 한국어에서 가장 가까운 윤리적·실천적 의미로 옮겼습니다.
- source_word: עַוָּל אֲשֶׁר הוּרָם
  english_pob_choice: a wrongdoer who has been exalted
  chosen_korean: 부당한 일을 저지른 채 높아진 사람
  alternatives_korean:
  - 높임을 받은 불의한 사람
  - 승격된 악인
  - 높아진 불의한 사람
  lexicon: HALOT
  rationale: עַוָּל은 단순한 추상적 악보다 불의/부정의를 행하는 사람을 가리키므로 ‘부당한 일을 저지른 사람’으로 풀어 의미를 드러냈습니다. הוּרָם은 지위 상승의 수동 의미를 살려 ‘높아진’으로 옮겼습니다.
theological_decisions:
