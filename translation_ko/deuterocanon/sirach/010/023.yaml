base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/010/023.yaml
  text: One should not despise an intelligent poor man[a], nor honor a wrongdoer who has been exalted.
  footnotes:
  - marker: a
    text: 'Greek tradition reads very differently here: ''A great man, a judge, and a ruler will be honored, and none of them is greater than the one who fears the Lord.'' The Hebrew witness behind the main text instead gives an ethical maxim about not despising a poor but intelligent man and not honoring an exalted wrongdoer.'
    reason: textual_variant
translation:
  language: ko
  text: 분별력 있는 가난한 사람을 업신여겨서는 안 되며, 부당한 일을 저지른 채 높아진 사람을 존중해서도 안 됩니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '그리스어 전승은 매우 다르게 읽습니다: “큰 사람과 재판관과 통치자는 존중을 받을 것이며, 그들 가운데 아무도 주님을 경외하는 사람보다 크지 않습니다.” 히브리어 증거본문은 가난하지만 분별력 있는 사람을 업신여기지 말고, 높아진 부당한 사람을 존중하지 말라는 윤리적 격언을 전합니다.'
    reason: textual_variant
lexical_decisions:
- source_word: אֵין לִבְזוֹת
  english_pob_choice: One should not despise
  chosen_korean: 업신여겨서는 안 되며
  alternatives_korean:
  - 멸시해서는 안 되며
  - 업신여기면 안 되며
  lexicon: HALOT
  rationale: 명제형 금지 표현으로서 잠언식 교훈의 보편성을 살리기 위해 합쇼체의 완곡한 금지형을 사용했습니다.
- source_word: דַּל
  english_pob_choice: poor man
  chosen_korean: 가난한 사람
  alternatives_korean:
  - 가난한 남자
  - 빈곤한 사람
  - 가난한 이
  lexicon: HALOT
  rationale: 히브리어 단수 남성형이지만 지혜문맥의 일반 교훈이므로 성별을 과도하게 부각하지 않는 자연스러운 한국어로 옮겼습니다.
- source_word: מַשְׁכִּיל
  english_pob_choice: intelligent
  chosen_korean: 분별력 있는
  alternatives_korean:
  - 지혜로운
  - 총명한
  - 통찰력 있는
  lexicon: HALOT
  rationale: 단순 지능보다 상황을 제대로 판단하는 성격이 강조되므로, POB의 ‘intelligent’를 한국어에서 가장 가까운 윤리적·실천적 의미로 옮겼습니다.
- source_word: עַוָּל אֲשֶׁר הוּרָם
  english_pob_choice: a wrongdoer who has been exalted
  chosen_korean: 부당한 일을 저지른 채 높아진 사람
  alternatives_korean:
  - 높임을 받은 불의한 사람
  - 승격된 악인
  - 높아진 불의한 사람
  lexicon: HALOT
  rationale: עַוָּל은 단순한 추상적 악보다 불의/부정의를 행하는 사람을 가리키므로 ‘부당한 일을 저지른 사람’으로 풀어 의미를 드러냈습니다. הוּרָם은 지위 상승의 수동 의미를 살려 ‘높아진’으로 옮겼습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행본문의 큰 차이
  chosen_reading: 본문은 현존 히브리어 격언을 따르고, 그리스어 전승은 각주로만 제시합니다.
  alternative_readings:
  - ‘큰 사람과 재판관과 통치자는 존중을 받을 것이며…’라는 그리스어 기반 문장
  rationale: 이 절은 전승 간 차이가 매우 크므로, 존속하는 히브리어 지혜격언을 본문으로 두는 것이 원문 우선 원칙에 부합합니다. 그리스어는 다른 역사적 전승으로 보존하되 본문을 대체하지 않게 했습니다.
  doctrine_reference: 'PHILOSOPHY.md: Sirach는 현존 히브리어를 우선하고, 그리스어 병행본문은 대조 자료로 보존'
