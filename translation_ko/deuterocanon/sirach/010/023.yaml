  alternative_readings:
  - ‘큰 사람과 재판관과 통치자는 존중을 받을 것이며…’라는 그리스어 기반 문장
  rationale: 이 절은 전승 간 차이가 매우 크므로, 존속하는 히브리어 지혜격언을 본문으로 두는 것이 원문 우선 원칙에 부합합니다. 그리스어는 다른 역사적 전승으로 보존하되 본문을 대체하지 않게 했습니다.
  doctrine_reference: 'PHILOSOPHY.md: Sirach는 현존 히브리어를 우선하고, 그리스어 병행본문은 대조 자료로 보존'
