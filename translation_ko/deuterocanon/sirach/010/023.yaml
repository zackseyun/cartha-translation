base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/010/023.yaml
  text: One should not despise an intelligent poor man[a], nor honor a wrongdoer who has been exalted.
  footnotes:
  - marker: a
    text: 'Greek tradition reads very differently here: ''A great man, a judge, and a ruler will be honored, and none of them is greater than the one who fears the Lord.'' The Hebrew witness behind the main text instead gives an ethical maxim about not despising a poor but intelligent man and not honoring an exalted wrongdoer.'
    reason: textual_variant
translation:
  language: ko
  text: 분별력 있는 가난한 사람을 업신여겨서는 안 되며, 높임을 받은 불의한 사람을 존중해서도 안 됩니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '그리스어 전승은 매우 다르게 읽습니다: “고관과 재판관과 통치자는 존중을 받을 것이며, 그들 가운데 아무도 주님을 경외하는 사람보다 크지 않습니다.” 히브리어 증거본문은 가난하지만 분별력 있는 사람을 업신여기지 말고, 높임을 받은 불의한 사람을 존중하지 말라는 윤리적 격언을 전합니다.'
    reason: textual_variant
