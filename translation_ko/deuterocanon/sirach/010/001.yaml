translation:
  language: ko
  text: 지혜로운 재판관은 자기 백성을 바로잡고, 이해하는 이의 다스림은 잘 정돈됩니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 יוֹסֵד는 ‘세우다’나 ‘설립하다’로도 옮길 수 있으나, 여기서는 백성을 다스려 질서를 잡는 뜻이 더 분명합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוֹפֵט
  english_pob_choice: judge
  chosen_korean: 재판관
  alternatives_korean:
  - 판관
  - 판사
  - 재판자
  lexicon: HALOT
  rationale: 히브리어 שׁוֹפֵט는 단순한 통치자보다 재판과 판결을 수행하는 공적 직분을 가리키므로, 현대 한국어에서는 ‘재판관’이 가장 직접적입니다.
- source_word: יוֹסֵד
  english_pob_choice: sets ... in order
  chosen_korean: 바로잡고
  alternatives_korean:
  - 세우고
  - 설립하고
  - 정립하고
  lexicon: HALOT
  rationale: 이 동사는 ‘세우다/설립하다’도 가능하지만, 여기서는 백성을 대상으로 한 통치·질서 정돈의 뉘앙스가 강하므로 ‘바로잡다’로 처리해 질서 회복의 의미를 살렸습니다.
- source_word: עַמּוֹ
  english_pob_choice: his people
  chosen_korean: 자기 백성
  alternatives_korean:
  - 그의 백성
  - 그 백성
  lexicon: HALOT
  rationale: 소유격을 자연스럽게 드러내면서도 한국어에서 관계가 분명한 ‘자기 백성’이 가장 읽기 쉽고, 문맥상 집합적 의미도 잘 전달합니다.
- source_word: מֵבִין
  english_pob_choice: one who understands
  chosen_korean: 이해하는 이
  alternatives_korean:
  - 분별하는 이
  - 총명한 사람
  - 슬기로운 이
  lexicon: HALOT
  rationale: 분사형의 인격적 의미를 살리되 성별을 특정하지 않기 위해 ‘이해하는 이’로 옮겼습니다. ‘분별하는 이’보다 본문의 지적·통치적 맥락에 덜 해석을 더합니다.
- source_word: סְדוּרָה
  english_pob_choice: well arranged
  chosen_korean: 잘 정돈됩니다
  alternatives_korean:
  - 잘 질서 잡힙니다
  - 잘 배열됩니다
  - 질서 있게 됩니다
  lexicon: HALOT
  rationale: 형용사 סְדוּרָה는 ‘정돈된/질서 잡힌’ 상태를 가리키므로, 결과 상태를 드러내는 수동형 표현인 ‘잘 정돈됩니다’가 가장 자연스럽습니다.
theological_decisions:
- issue: 지혜로운 통치의 성격
  chosen_reading: 이 절은 지혜로운 재판과 통치가 백성을 ‘바로잡고’ 질서를 세우는 기능을 가진다는 점을 강조합니다.
  alternative_readings:
  - 단순히 유능한 행정이 질서를 만든다는 일반 진술
  - 도덕적 교훈만을 말하는 격언
  rationale: 히브리어와 그리스어 병행 모두 공적 통치의 질서 정돈을 강조하므로, 윤리적 교훈으로만 약화하지 않고 통치의 실제적 효과를 드러내는 쪽이 본문에 더 충실합니다.
  doctrine_reference: 지혜문학의 공적 통치관
