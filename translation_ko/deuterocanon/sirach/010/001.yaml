  text: A wise judge sets his people in order[a], and the rule of one who understands is well arranged.
  footnotes:
  - marker: a
    text: Hebrew יוֹסֵד can also be rendered 'establishes' or 'founds'; the Greek parallel points toward the sense of governing or ordering a people.
