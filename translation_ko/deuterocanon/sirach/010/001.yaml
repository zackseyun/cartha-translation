  source_fidelity: 히브리어 본문에는 ‘지혜로운’에 해당하는 말이 없고, שׁוֹפֵט עַם은 재판관과 백성의 관계를 제시합니다. 그리스어 병행 본문의 σοφός(‘지혜로운’)는 참고할 수 있으나, 히브리어를 우선하는 본문 번역에 본문어로 보태지 않는 것이 안전합니다. יוֹסֵד는 ‘세우다/확립하다’의 기본 뜻과 통치 맥락의 질서 정비라는 함의를 함께 지니므로, ‘정비하다’와 각주가 적절합니다. מֵבִין은 ‘이해하는 이’보다 통치 맥락에서 자연스러운 ‘분별 있는 이’로 옮겼습니다.
  naturalness: ‘자기 백성을 바로잡고’는 백성의 도덕적 잘못을 교정한다는 뜻으로 좁혀 들릴 수 있습니다. ‘자기 백성을 정비하고’는 통치와 질서의 맥락을 더 자연스럽고 중립적으로 전달합니다. ‘분별 있는 이의 통치는 잘 정돈되어 있습니다’는 현대 표준어 합쇼체의 격언체 문장으로 자연스럽습니다.
  terminology: ‘재판관’은 שׁוֹפֵט와 그리스어 κριτής에 부합합니다. ‘통치’는 מֶמְשֶׁלֶת의 공적 통치·통치 체제를 자연스럽게 나타냅니다. ‘분별 있는 이’는 מֵבִין의 식별력과 이해력을 반영하며, 특정 성별을 부가하지 않습니다.
