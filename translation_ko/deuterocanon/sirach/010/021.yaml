translation:
  language: ko
  text: 형제들 가운데서는 그들의 우두머리가 존귀하고, 자기 백성 가운데서는 하나님을 경외하는 이가 존귀합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '그리스어 병행본문: ‘부유한 이와 존귀한 이와 가난한 이—그들이 자랑하는 것은 주님을 경외하는 것입니다.’ 히브리어와 그리스어 증거는 크게 다르므로 본문은 현존 히브리어를 따랐습니다.'
    reason: alternative_reading
lexical_decisions:
- source_word: בֵּין אַחִים
  english_pob_choice: Among brothers
  chosen_korean: 형제들 가운데서는
  alternatives_korean:
  - 형제들 사이에서는
  - 형제들 중에서는
  lexicon: HALOT
  rationale: 관계적·사회적 범위를 나타내는 בֵּין은 한국어에서는 ‘가운데서/사이에서’가 자연스럽고, 격언적 평행을 살리기 위해 ‘가운데서는’을 택했습니다.
- source_word: רֹאשָׁם
  english_pob_choice: their chief
  chosen_korean: 그들의 우두머리
  alternatives_korean:
  - 그들의 머리
  - 그들의 지도자
  lexicon: HALOT
  rationale: 직역인 ‘머리’는 한국어에서 어색할 수 있어, 공동체 내 우두머리라는 의미를 드러내는 ‘우두머리’로 옮겼습니다. 다만 지배적 뉘앙스가 강해지지 않도록 ‘지도자’와의 균형을 고려했습니다.
- source_word: נִכְבָּד
  english_pob_choice: is honored
  chosen_korean: 존귀하며
  alternatives_korean:
  - 존중받으며
  - 존경받으며
  - 영예로우며
  lexicon: HALOT
  rationale: נכבד의 ‘존귀/존중됨’ 의미를 살려 상태를 나타내는 형용사형으로 옮겼고, 격언 전체의 병렬성을 위해 서술형 연결어미를 사용했습니다.
- source_word: וִירֵא אֱלֹהִים
  english_pob_choice: one who fears God
  chosen_korean: 하나님을 경외하는 이
  alternatives_korean:
  - 하나님을 두려워하는 이
  - 하나님을 경외하는 사람
  lexicon: HALOT
  rationale: יהוה 대신 본문 히브리어의 אֱלֹהִים을 따라 ‘하나님’으로 옮겼고, ‘경외하는 이’는 지혜문학적 표현을 살리면서도 한국어에서 가장 자연스럽습니다.
- source_word: בְּעַמּוֹ
  english_pob_choice: among his people
  chosen_korean: 자기 백성 가운데서는
  alternatives_korean:
  - 그의 백성 가운데서는
  - 백성 가운데서는
  lexicon: HALOT
  rationale: בְּעַם은 위치·소속의 의미를 함께 가지므로 ‘가운데서는’으로 옮겨 앞 구절의 ‘형제들 가운데서는’과 평행을 이루게 했습니다. ‘자기’는 소유격을 한국어답게 풀어 주는 보충입니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행본문의 현저한 차이
  chosen_reading: 본문은 현존 히브리어를 따르고, 그리스어 전승의 다른 읽기는 각주로만 제시했습니다.
  alternative_readings:
  - ‘부유하고 존귀하며 가난한 사람들—그들의 자랑은 주님을 경외함입니다.’
  rationale: 지혜서 계열에서는 살아 있는 히브리어 증거를 우선하되, 본문 메타데이터가 ‘major mismatch’로 표시한 만큼 그리스어의 실질적 차이를 숨기지 않는 것이 번역의 투명성에 부합합니다.
  doctrine_reference: 'PHILOSOPHY.md: translate from Hebrew where it survives; preserve source uncertainty honestly'
