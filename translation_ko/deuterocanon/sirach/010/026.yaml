base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/010/026.yaml
  text: Do not act too wisely to serve your own desire[a], and do not honor yourself in the time of your need.
  footnotes:
  - marker: a
    text: 'The Greek witness reads very differently here: ''Better one who works in everything than one who goes about boasting and lacks bread.'' The Hebrew surviving in the Cairo Geniza warns against self-serving cleverness and self-honor in time of need.'
    reason: alternative_reading
translation:
  language: ko
  text: 자기 욕망을 섬기려고 너무 지혜롭게 굴지 말고, 궁핍할 때에 스스로를 높이지 마십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 증인은 이 구절을 매우 다르게 전합니다. 곧, “모든 일에서 일하는 자가, 돌아다니며 자랑하면서도 빵이 모자라는 자보다 낫다”입니다. 그러나 여기 남아 있는 히브리어는 자기 욕망을 섬기려는 영리함과 궁핍할 때의 자기 높임을 경고합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תּתְחַכַּם
  english_pob_choice: Do not act too wisely
  chosen_korean: 너무 지혜롭게 굴어
  alternatives_korean:
  - 너무 슬기로운 체하지 마십시오
  - 지나치게 현명한 체하지 마십시오
  - 과도하게 지혜로운 척하지 마십시오
  lexicon: HALOT
  rationale: 히트파엘형의 반성적·자기연출적 뉘앙스를 살리되, 한국어에서 자연스러운 경고 표현으로 옮겼습니다. '지혜롭게 굴다'는 실제 지혜보다 자의적·자기만족적 지혜 행세를 드러냅니다.
- source_word: לַעֲבוֹד חֶפְצֶךָ
  english_pob_choice: to serve your own desire
  chosen_korean: 자기 욕망을 섬기려
  alternatives_korean:
  - 자기 სურვ망을 위하여 일하려
  - 자기 뜻을 따르려
  - 자기 즐거움을 섬기려
  lexicon: HALOT
  rationale: עבד의 '섬기다/봉사하다'를 직접 살려, 주어가 자신의 욕망을 섬기는 역전된 윤리를 분명히 했습니다. חפץ는 여기서 단순한 소원보다 자기중심적 욕망이 더 적절해 '욕망'으로 옮겼습니다.
- source_word: וְאַל תִּתְכַּבֵּד
  english_pob_choice: and do not honor yourself
  chosen_korean: 스스로를 높이지 마십시오
  alternatives_korean:
  - 스스로를 영화롭게 하지 마십시오
  - 스스로를 자랑하지 마십시오
  - 스스로를 존귀하게 여기지 마십시오
  lexicon: HALOT
  rationale: כבד의 반사형이 가진 '무겁게 하다/중히 여기다/영예를 취하다'의 의미를 한국어에서 가장 자연스럽게 반영했습니다. '스스로를 높이다'는 자가 과시와 자기 과장을 함께 드러냅니다.
- source_word: בְּמוֹעֵד צָרְכֶּךָ
  english_pob_choice: in the time of your need
  chosen_korean: 필요할 때에
  alternatives_korean:
  - 당신의 필요의 때에
  - 궁핍할 때에
  - 당신이 필요한 때에
  lexicon: HALOT
  rationale: מוֹעֵד의 '정해진 때/때'와 צֹרֶךְ의 '필요, 결핍'을 간결하게 묶어, 문맥상 자기 과시가 어울리지 않는 '필요한 때'로 옮겼습니다. 한국어에서는 '필요할 때'가 가장 자연스럽고 과장되지 않습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행본의 큰 차이
  chosen_reading: 본문은 남아 있는 히브리어를 따라 '자기 욕망을 섬기려'와 '필요할 때에'로 옮기고, 그리스어의 '일하는 자'와 '빵이 모자라는 자'는 본문 밖 주석으로 남깁니다.
  alternative_readings:
  - 그리스어를 따라 '모든 일에 일하는 자가 낫다…'로 옮김
  rationale: 시라크는 히브리어가 남아 있는 곳에서는 히브리어를 우선하되, 여기서는 그리스어가 상당히 다르므로 이를 본문에 흡수해 조화시키지 않았습니다. 이렇게 해야 본문 전승의 긴장과 불확실성을 정직하게 보존할 수 있습니다.
  doctrine_reference: 'PHILOSOPHY.md: translate from Hebrew where it survives in Sirach; preserve source uncertainty honestly'
