review_pass:
  verdict: revise
  source_fidelity: The draft follows the extant Hebrew rather than harmonizing it with the substantially divergent Greek witness. However, ‘필요할 때에’ can mean ‘when necessary,’ whereas בְּמוֹעֵד צָרְכֶּךָ specifically refers to the time of one’s need or want; ‘궁핍할 때에’ communicates this circumstance more clearly in Korean.
  naturalness: The main sentence is natural formal-polite Korean. Reordering the first clause slightly makes the purposive relation (‘to serve your desire’) more immediately clear, and ‘궁핍할 때에’ avoids the ambiguity of ‘필요할 때에.’
  terminology: ‘자기 욕망을 섬기다’ adequately preserves the deliberately stark object of עבד. ‘스스로를 높이다’ naturally conveys the reflexive sense of התכבד. The Greek footnote needs to include περιπατῶν (‘going about/walking about’), which the draft omits.
  issues:
  - severity: medium
    issue: ‘필요할 때에’ is semantically ambiguous in Korean.
    rationale: It may be understood as ‘when it is necessary,’ rather than ‘at the time of your need/want.’ The Hebrew צָרְכֶּךָ denotes the addressee’s need or lack. ‘궁핍할 때에’ is contextually clear and is consonant with the Greek reference to lacking bread.
  - severity: low
    issue: The alternative-reading footnote omits the Greek participle περιπατῶν.
    rationale: The Greek contrast includes one who ‘goes about/walks about,’ boasting and lacking bread. This element should be represented in the footnote for an accurate audit trail.
  revised_text: 자기 욕망을 섬기려고 너무 지혜롭게 굴지 말고, 궁핍할 때에 스스로를 높이지 마십시오.[a]
  revised_footnotes:
  - marker: a
    text: 그리스어 증인은 이 구절을 매우 다르게 전합니다. 곧, “모든 일에서 일하는 자가, 돌아다니며 자랑하면서도 빵이 모자라는 자보다 낫다”입니다. 그러나 여기 남아 있는 히브리어는 자기 욕망을 섬기려는 영리함과 궁핍할 때의 자기 높임을 경고합니다.
    reason: alternative_reading
  revision_rationale: The revision retains the Hebrew-based rendering and its ambiguity while clarifying that the final phrase concerns personal need or want, not merely a necessary occasion. The footnote is corrected to reflect the full Greek alternative without importing it into the Hebrew-based main text.
