lexical_decisions:
- source_word: זֶרַע
  english_pob_choice: offspring
  chosen_korean: 자손
  alternatives_korean:
  - 씨
  - 후손
  lexicon: HALOT
  rationale: 아포리즘 문맥에서 혈통적 후예를 가리키므로, 단수 집합적 의미를 살리면서도 자연스러운 현대 한국어인 ‘자손’을 택했습니다.
- source_word: נִקְלֶה
  english_pob_choice: contemptible
  chosen_korean: 수치스럽다
  alternatives_korean:
  - 경멸할 만하다
  - 천하다
  - 멸시받는다
  lexicon: HALOT
  rationale: ‘경멸/수치’의 평가적 뉘앙스를 살리되, 문장 전체를 한국어 질문으로 매끄럽게 만들기 위해 ‘수치스럽다’로 옮겼습니다.
- source_word: עוֹבֵר מִצְוָה
  english_pob_choice: transgresses a commandment
  chosen_korean: 계명을 어기는
  alternatives_korean:
  - 명령을 어기는
  - 계명을 범하는
  - 계명을 위반하는
  lexicon: HALOT
  rationale: מִצְוָה는 지혜문학/토라 어휘로서 ‘계명’이 가장 자연스럽고, עוֹבֵר는 단순 ‘지나가다’보다 도덕적 위반인 ‘어기다’가 적절합니다.
- source_word: לֶאֱנוֹשׁ
  english_pob_choice: of one who
  chosen_korean: 자
  alternatives_korean:
  - 사람의
  - 인간의
  lexicon: HALOT
  rationale: 히브리어 전승이 다소 난해하므로, 그 의미를 풀어 ‘…하는 자’로 자연스럽게 표현했습니다.
theological_decisions:
- issue: 히브리어 단수형과 그리스어 복수형의 차이
  chosen_reading: 본문은 히브리어 전승을 따르되, 그리스어가 가리키는 복수적 해석 가능성은 주석으로만 남깁니다.
  alternative_readings:
  - ‘계명들을 어기는 자의 자손’(그리스어에 더 가까움)
  rationale: 이 절은 히브리어가 남아 있으면서도 문맥상 난해하므로, 본문은 히브리어 단수형을 유지하고 그리스어 복수형은 대안 읽기로 처리하는 것이 자료에 충실합니다.
