  text: 어떤 자손이 멸시받습니까? 계명을 어기는 자의 자손입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '그리스어: ‘계명들을 어기는 자들’(복수). 이는 난해한 히브리어 표현을 분명하게 해 줍니다.'
