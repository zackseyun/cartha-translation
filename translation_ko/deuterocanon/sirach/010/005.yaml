translation:
  language: ko
  text: 하나님 손에 세상의 통치가 있으며, 때가 되면 그 위에 적합한 사람을 세우십니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּיַד אֱלֹהִים
  english_pob_choice: In the hand of God
  chosen_korean: 하나님 손에
  alternatives_korean:
  - 하나님의 손에
  - 하나님의 권능 안에
  lexicon: HALOT
  rationale: 히브리어 관용구 בְּיַד은 ‘통제 아래에 있음/권세에 있음’을 뜻하므로, 직역적 이미지를 살리면서도 한국어에서 자연스러운 ‘하나님 손에’로 옮겼습니다.
- source_word: מֶמְשֶׁלֶת
  english_pob_choice: the rule
  chosen_korean: 통치
  alternatives_korean:
  - 다스림
  - 지배
  - 권세
  lexicon: HALOT
  rationale: 명사는 통치권 또는 지배를 가리키므로, 세계 위의 शासन이라는 뜻이 분명하게 드러나는 ‘통치’를 선택했습니다.
- source_word: תֵּבֵל
  english_pob_choice: the world
  chosen_korean: 세상
  alternatives_korean:
  - 온 세상
  - 거주하는 세계
  - 땅
  lexicon: HALOT
  rationale: תֵּבֵל은 ‘거주하는 세계’를 가리키지만, 한국어에서는 ‘세상’이 가장 자연스럽고 문맥상 포괄적입니다.
- source_word: וְאִישׁ לְעֵת יַעֲמוֹד עָלֶיהָ
  english_pob_choice: and in due time he will raise up over it the right man
  chosen_korean: 때가 되면 그 위에 적합한 사람을 세우십니다
  alternatives_korean:
  - 마땅한 사람을 세우십니다
  - 알맞은 사람을 그 위에 세우십니다
  - 그 위에 사람을 일으키십니다
  lexicon: HALOT
  rationale: אִישׁ은 문자적으로 ‘사람/남자’지만 문맥상 통치자로 세워질 개인을 가리키므로 ‘적합한 사람’으로 풀었습니다. יַעֲמוֹד עָלֶיהָ는 ‘그 위에 서다’의 관용으로, 임명·세움의 뜻을 살려 ‘세우십니다’로 옮겼습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행 전통의 차이
  chosen_reading: 본문은 현존하는 히브리어를 따라 ‘하나님 손에 세상의 통치’와 ‘적합한 사람을 세우심’으로 옮기고, 그리스어 전승은 별도 각주로 처리하지 않았습니다.
  alternative_readings:
  - 그리스어 전통처럼 ‘주님의 손에 사람의 형통이 있다’로 옮기기
  rationale: 이 절은 히브리어와 그리스어가 상당히 다르지만, 본문 보존도가 높은 히브리어가 우선이므로 주본문은 히브리어를 따르는 것이 사료에 충실합니다.
  doctrine_reference: 'PHILOSOPHY.md: 현존 히브리어 지혜문학 본문 우선, 그리스어는 대조 자료로 활용'
