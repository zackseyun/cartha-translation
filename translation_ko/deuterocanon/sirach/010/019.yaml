base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/010/019.yaml
  text: What offspring is honorable? Human offspring[a]. What offspring is honorable? Those who fear God[b]. What offspring is honorable? Those who keep the commandment.
  footnotes:
  - marker: a
    text: 'Greek parallel: ''What offspring is dishonorable? Human offspring.'' The Hebrew witness instead reads, ''What offspring is honorable? Those who keep the commandment.'''
    reason: textual_variant
  - marker: b
    text: Greek has 'those who fear the Lord' where the Hebrew reads 'those who fear God.'
    reason: alternative_reading
translation:
  language: ko
  text: 어떤 자손이 존귀합니까? 사람의 자손입니다. 어떤 자손이 존귀합니까? 하나님을 두려워하는 사람들입니다. 어떤 자손이 존귀합니까? 계명을 지키는 사람들입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 병행본에는 “어떤 자손이 비천합니까? 사람의 자손입니다.”로 되어 있습니다. 히브리어 증인은 “어떤 자손이 존귀합니까? 계명을 지키는 사람들입니다.”로 읽습니다.
    reason: textual_variant
  - marker: b
    text: 그리스어에는 “주님을 두려워하는 사람들”로 되어 있으나, 히브리어는 “하나님을 두려워하는 사람들”로 읽습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: זֶרַע / σπέρμα
  english_pob_choice: offspring
  chosen_korean: 자손
  alternatives_korean:
  - 씨
  - 후손
  - 혈통
  lexicon: HALOT; BDAG
  rationale: 반복되는 수사적 핵심어로서 집합적 의미를 살려 ‘자손’으로 옮겼습니다. ‘씨’는 비유적으로는 가능하지만 현대 한국어에서 너무 생물학적이거나 추상적일 수 있고, ‘후손’보다 문장 반복이 자연스럽습니다.
- source_word: נִכְבָּד / ἔντιμον
  english_pob_choice: honorable
  chosen_korean: 존귀한
  alternatives_korean:
  - 귀한
  - 존경받는
  - 고귀한
  lexicon: HALOT; BDAG
  rationale: 지혜문학의 가치 판단을 드러내는 표현으로 ‘존귀한’이 신분적 품격과 가치의 의미를 함께 살립니다. ‘고귀한’은 혈통 뉘앙스가 강하고, ‘존경받는’은 관계적 반응으로 좁아질 수 있습니다.
- source_word: שׂוֹמֵר מִצְוָה
  english_pob_choice: those who keep the commandment
  chosen_korean: 계명을 지키는 사람들
  alternatives_korean:
  - 계명을 지키는 이들
  - 계명을 준수하는 사람들
  - 명령을 지키는 사람들
  lexicon: HALOT
  rationale: 히브리어 단수형 מִצְוָה를 살려 ‘계명’으로 옮겼고, שמר의 관용적 의미를 ‘지키다’로 자연스럽게 반영했습니다. 인칭을 명시해 질문-대답형의 병렬 구조를 한국어에서도 분명하게 했습니다.
- source_word: יְרֵא אֱלֹהִים
  english_pob_choice: those who fear God
  chosen_korean: 하나님을 두려워하는 사람들
  alternatives_korean:
  - 하나님을 경외하는 사람들
  - 하나님을 무서워하는 사람들
  lexicon: HALOT; BDAG
  rationale: ‘두려워하다’는 성경적 경외의 의미를 직접 드러내며, 본문이 말하는 태도(하나님 앞에서의 두려움)를 보존합니다. ‘경외하다’도 가능하지만, 여기서는 동사 구문을 유지해 원문의 참여적 표현을 살렸습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행본의 마지막 행 차이
  chosen_reading: 본문은 현존 히브리어를 따라 ‘계명을 지키는 사람들’로 두고, 그리스어의 대비적 형태는 각주로 보존했습니다.
  alternative_readings:
  - '그리스어: ‘어떤 자손이 비천합니까? 사람의 자손입니다.’'
  rationale: 이 절에서는 히브리어가 ‘존귀한 자손’의 삼중 병렬을 완결하는 반면, 그리스어는 마지막을 ‘비천한 자손’으로 바꿔 대조를 형성합니다. 서원의 원칙에 따라 현존 히브리어를 본문으로 삼되, 중요한 차이를 숨기지 않기 위해 각주로 남겼습니다.
  doctrine_reference: 'Sirach source-policy: extant Hebrew primary, Greek preserved as control/variant.'
