base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/010/010.yaml
  text: A slight illness makes a physician turn pale[a]; a king today[b], and tomorrow he falls.
  footnotes:
  - marker: a
    text: 'Greek parallel: ''and a king today, and tomorrow he will come to his end,'' interpreting the Hebrew ''falls'' more specifically as death.'
