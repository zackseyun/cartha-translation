base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/010/010.yaml
  text: A slight illness makes a physician turn pale[a]; a king today[b], and tomorrow he falls.
  footnotes:
  - marker: a
    text: 'Greek parallel: ''and a king today, and tomorrow he will come to his end,'' interpreting the Hebrew ''falls'' more specifically as death.'
    reason: alternative_reading
  - marker: b
    text: The Hebrew says literally 'look yellow,' using a color-change image for the visible effect of sickness.
    reason: lexical_alternative
translation:
  language: ko
  text: 조금 아픈 병도 의사를 창백하게 합니다. 왕도 오늘은 왕이지만, 내일은 무너집니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘누렇게/창백하게 되다’라는 시각적 이미지를 사용합니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어 평행본문은 ‘내일 그는 끝을 맞는다’는 식으로, 이 구절을 죽음 쪽으로 더 구체적으로 풀이합니다.
    reason: textual_variant
lexical_decisions:
- source_word: שֶׁמֶץ מַחֲלָה
  english_pob_choice: slight illness
  chosen_korean: 조금 아픈 병
  alternatives_korean:
  - 가벼운 병
  - 사소한 병
  - 조그만 질병
  lexicon: HALOT
  rationale: שֶׁמֶץ는 ‘아주 조금, 미세한 양’의 뜻이어서 병의 정도가 크지 않음을 살려야 하므로, 현대 한국어에서 자연스러운 ‘조금 아픈 병’으로 옮겼습니다.
- source_word: יַצְהִיב
  english_pob_choice: makes ... look yellow / turn pale
  chosen_korean: 창백하게 합니다
  alternatives_korean:
  - 노랗게 합니다
  - 창백해지게 합니다
  - 얼굴빛이 누렇게 되게 합니다
  lexicon: HALOT
  rationale: 동사는 본래 누렇게/창백하게 변하는 시각적 변화를 가리키므로, 한국어에서는 병든 기색을 드러내는 표준 표현인 ‘창백하게 합니다’로 옮겨 색채 이미지와 자연스러움을 함께 살렸습니다.
- source_word: יִפּוֹל
  english_pob_choice: he falls
  chosen_korean: 무너집니다
  alternatives_korean:
  - 쓰러집니다
  - 떨어집니다
  - 죽습니다
  lexicon: HALOT
  rationale: 직역하면 ‘떨어지다/넘어지다’이지만 지혜 문맥에서는 몰락과 죽음까지 포함할 수 있어, 히브리어의 더 넓은 의미를 살리는 동시에 한국어 속담체에 가까운 ‘무너집니다’로 표현했습니다.
theological_decisions:
- issue: 왕의 결말을 죽음으로 구체화할지, 더 넓은 몰락으로 둘지
  chosen_reading: 본문은 ‘무너집니다’로 넓게 두고, 직접적인 죽음으로 단정하지 않았습니다.
  alternative_readings:
  - 죽습니다
  - 생명을 마칩니다
  - 끝장납니다
  rationale: 히브리어 본문은 יִפּוֹל(‘떨어지다, 무너지다’)를 쓰며, 그리스어 평행본문은 죽음 쪽으로 더 분명하게 해석하지만, 주본문의 표면 의미는 몰락까지 포함하는 더 넓은 표현이므로 이를 유지했습니다.
  doctrine_reference: 번역 원칙 §1, §3
