  text: God erased the traces of nations[b][a], and their root to the very ground.
  footnotes:
  - marker: a
    text: 'Greek parallel: ''The Lord pulled up the roots of nations, and planted the humble in their place.'' The Hebrew witness instead speaks of God erasing the nations’ ''footprints'' and their ''root'' down to the earth’s lowest level.'
    reason: alternative_reading
  - marker: b
    text: The Hebrew word rendered 'bedrock' is rare and may also mean the lowest depth or bottom of the ground; the sense is total uprooting.
    reason: lexical_alternative
translation:
  language: ko
  text: 하나님은 나라들의 흔적을 지우셨고, 그들의 뿌리를 땅의 가장 낮은 곳까지 내리셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 병행본문은 ‘주께서 민족들의 뿌리를 뽑으시고, 그 자리에 겸손한 이들을 심으셨다’고 말합니다. 히브리어 증거는 이를 달리 전하며, 여기서는 히브리어의 이미지인 ‘흔적’과 ‘뿌리’를 따랐습니다.
    reason: alternative_reading
  - marker: b
    text: 희귀어 קִעֲקָע는 문맥상 땅의 가장 낮은 곳, 바닥, 혹은 기반이 되는 깊은 지점을 가리킬 수 있어, 전체 뜻은 완전한 뿌리뽑음입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עִקְבוֹת
  english_pob_choice: footprints / traces
  chosen_korean: 흔적
  alternatives_korean:
  - 발자국
  - 발자취
  - 자취
  lexicon: HALOT
  rationale: 발에 남은 구체적 자국이라는 이미지를 살리면서도, 문맥상 완전히 지워진 대상을 자연스럽게 드러내기 위해 ‘흔적’을 택했습니다.
- source_word: טִמְטֵם
  english_pob_choice: erased
  chosen_korean: 지우셨고
  alternatives_korean:
  - 말소하셨고
  - 없애셨고
  - 지워 버리셨고
  lexicon: HALOT
  rationale: 발자국이나 흔적을 제거하는 동작과 잘 맞으며, 심판의 단호함을 유지하는 동사로 ‘지우다’가 가장 직접적입니다.
- source_word: וְשָׁרְשָׁם
  english_pob_choice: and their root
  chosen_korean: 그들의 뿌리를
  alternatives_korean:
  - 그들의 근원을
  - 그 뿌리를
  - 그들의 뿌리까지
  lexicon: HALOT
  rationale: 히브리어 단수형의 집합적 용법을 살려 ‘뿌리’ 이미지를 유지했고, 완전한 제거의 뜻이 드러나도록 목적격으로 처리했습니다.
- source_word: עַד אֶרֶץ קִעֲקָע
  english_pob_choice: to the very ground / down to the earth’s bedrock
  chosen_korean: 땅의 가장 낮은 곳까지
  alternatives_korean:
  - 땅의 바닥까지
  - 땅의 밑바닥까지
  - 땅의 기반암까지
  lexicon: HALOT
  rationale: 희귀한 קִעֲקָע의 의미 범위가 ‘최저 지점, 바닥, 깊은 곳’에 걸쳐 있으므로, 과도한 지질학적 구체화보다 완전한 뽑아냄의 힘을 살리는 표현을 택했습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행본문의 이미지 차이
  chosen_reading: 본문은 살아 있는 히브리어 증거를 따라 ‘흔적’과 ‘뿌리’를 유지하고, 그리스어의 ‘주께서… 가난한 자들을 그 자리에 심으셨다’는 병행은 본문이 아닌 주석적 대비로만 반영합니다.
  alternative_readings:
  - 그리스어를 따라 ‘주님께서 민족들의 뿌리를 뽑으시고…’로 옮김
  rationale: 이 절은 히브리어와 그리스어가 실질적으로 다른 형상을 전하므로, 보존된 히브리어의 어휘를 본문에 우선 반영하는 것이 번역 원칙에 맞습니다.
  doctrine_reference: 'PHILOSOPHY.md: 살아 있는 히브리어 시락 본문 우선, 그리스어는 병행·검증 자료로 사용'
