translation:
  language: ko
  text: 통치자와 총독과 재판관은 존경을 받습니다. 그러나 하나님을 경외하는 사람보다 더 큰 이는 없습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 증언은 상당히 다른 읽기를 보입니다. “자유인들이 지혜로운 종을 섬길 것이며, 분별 있는 사람은 불평하지 않을 것입니다.”
    reason: textual_variant
lexical_decisions:
- source_word: נָגִיד
  english_pob_choice: ruler
  chosen_korean: 통치자
  alternatives_korean:
  - 지도자
  - 군주
  lexicon: HALOT
  rationale: 여러 직분을 나열하는 문맥에서 권력의 우두머리를 뜻하는 보편적 표현이 적절하므로 ‘통치자’로 옮겼습니다.
- source_word: מוֹשֶׁל
  english_pob_choice: governor
  chosen_korean: 총독
  alternatives_korean:
  - 다스리는 자
  - 지사
  lexicon: HALOT
  rationale: 앞의 נָגִיד와 구별되는 두 번째 통치 직분을 살리기 위해, 행정적 통치자를 가리키는 ‘총독’으로 구분했습니다.
- source_word: שׁוֹפֵט
  english_pob_choice: judge
  chosen_korean: 재판관
  alternatives_korean:
  - 판사
  - 판관
  lexicon: HALOT
  rationale: 사법 직분을 분명히 드러내면서도 현대 한국어에서 자연스러운 공적 직함이므로 ‘재판관’으로 옮겼습니다.
- source_word: נִכְבָּדוּ
  english_pob_choice: are honored
  chosen_korean: 존중을 받습니다
  alternatives_korean:
  - 존귀하게 여겨집니다
  - 존경을 받습니다
  lexicon: HALOT
  rationale: 수동형의 사회적 존숭을 자연스럽게 드러내기 위해 ‘존중을 받습니다’로 표현했습니다.
- source_word: מִיְּרֵא אֱלֹהִים
  english_pob_choice: one who fears God
  chosen_korean: 하나님을 두려워하는 사람
  alternatives_korean:
  - 하나님을 경외하는 사람
  - 하나님을 무서워하는 사람
  lexicon: HALOT
  rationale: 히브리어 관용구의 핵심인 ‘두려워하다’를 보존하되, 한국어에서는 그 뜻이 경외를 포함하도록 자연스럽게 옮겼습니다.
theological_decisions:
- issue: ‘fears God’의 표현 강도
  chosen_reading: ‘하나님을 두려워하는 사람’을 유지해, 단순한 존중보다 더 깊은 경외와 책임을 암시했습니다.
  alternative_readings:
  - 하나님을 경외하는 사람
  - 하나님을 무서워하는 사람
  rationale: 본문의 지혜 격언은 하나님 앞에서의 경외를 사회적 지위보다 높은 기준으로 제시하므로, 직역적 힘을 약화시키지 않는 표현을 택했습니다.
  doctrine_reference: 지혜문학의 경외 개념
- issue: 히브리어 본문을 मुख्य 본문으로 유지하고 그리스어 병렬은 각주로 처리
  chosen_reading: 현존 히브리어의 세 직분-경외 대조를 본문으로 번역했습니다.
  alternative_readings:
  - 그리스어의 ‘지혜로운 종’과 ‘자유인들’ 구문을 본문에 반영
  rationale: 이 절은 그리스어가 크게 다른 문장을 보이므로, 살아 있는 히브리어 본문을 본문으로 두고 변이를 각주로 투명하게 남기는 것이 적절합니다.
  doctrine_reference: 서사·지혜문학 본문비평 원칙
