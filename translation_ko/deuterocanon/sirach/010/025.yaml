  source_fidelity: 그리스어 본문 Μὴ σοφίζου ποιῆσαι τὸ ἔργον σου는 단순히 ‘지혜롭게 일하지 말라’기보다 일을 하는 데에 지혜로운 체하거나 지나치게 영리하게 굴지 말라는 경계입니다. 현 번역은 이를 긍정적 ‘지혜롭게 일하다’의 금지로 읽히게 하므로 뉘앙스가 약화됩니다. δεύτε 문장은 ‘당신의 곤경의 때’를 자연스럽게 보존해야 합니다. 히브리어 전승은 그리스어와 실질적으로 다른 본문이므로 각주에서 분명히 밝혀야 하며, יתאונן의 불확실성도 보존해야 합니다.
  naturalness: ‘지혜롭게 일하려고 하지 말고’는 현대 한국어에서 부자연스럽고, 지혜롭게 일하는 행위 자체를 부정하는 듯합니다. ‘자기 일을 하면서 지혜로운 체하지 마십시오’가 경구체 합쇼체로 자연스럽고 원문의 자기과시·과도한 영리함의 함의를 더 잘 드러냅니다. ‘곤경에 처했을 때’는 ‘환난의 때에’보다 현대적이며 στενοχωρία의 압박·곤란을 무리 없이 전달합니다.
  terminology: ‘자랑하지 마십시오’는 μὴ δοξάζου에 적절합니다. 히브리어 עבד는 현대 독자에게 ‘노예’보다 넓은 고대의 종속 신분을 가리킬 수 있으나, 대조 전승을 간결히 제시하는 각주에서는 ‘종’이 무난합니다. משכיל은 ‘슬기로운’, סכל은 ‘어리석은’으로 옮기고, 불확실한 יתאונן은 단정하지 않습니다.
