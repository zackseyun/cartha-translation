translation:
  language: ko
  text: 자기 일을 하면서 지혜로운 체하지 마십시오. 곤경에 처했을 때 자랑하지 마십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 현존하는 히브리어 전승은 이 본문과 크게 다릅니다. 그 전승은 “슬기로운 종은 높여지고, 어리석은 종은 불평하지 않는다”라고 읽히지만, 마지막 동사의 뜻은 불확실하며 ‘원망하다’ 또는 ‘구실을 찾다’라는 뉘앙스일 수도 있습니다.
    reason: textual_variant
lexical_decisions:
- source_word: Μὴ σοφίζου
  english_pob_choice: Do not act wisely
  chosen_korean: 지혜롭게 일하려고 하지 말고
  alternatives_korean:
  - 너무 지혜로운 체하지 말고
  - 지혜로운 척하지 말고
  - 지혜롭게 굴지 말고
  lexicon: LSJ
  rationale: 그리스어 σοφίζου의 자기 과시적·과도한 ‘지혜 부리기’ 뉘앙스를 살리되, 한국어에서는 자연스럽게 ‘지혜롭게 일하려고 하지 말고’로 옮겨 경구적 금지를 유지했습니다.
- source_word: ποιῆσαι τὸ ἔργον σου
  english_pob_choice: in doing your work
  chosen_korean: 일하려고
  alternatives_korean:
  - 네 일을 할 때
  - 일을 수행할 때
  - 자기 일을 하는 데
  lexicon: LSJ
  rationale: 행위의 범위를 나타내는 표현이므로 한국어에서는 간결하게 동작의 장면으로 처리해, ‘일’과 연결된 문맥을 자연스럽게 드러냈습니다.
- source_word: μὴ δοξάζου
  english_pob_choice: do not boast
  chosen_korean: 자랑하지 마십시오
  alternatives_korean:
  - 우쭐대지 마십시오
  - 스스로를 높이지 마십시오
  - 자랑스러워하지 마십시오
  lexicon: LSJ
  rationale: 문맥상 자기 과시를 금하는 경계이므로, 현대 한국어에서 가장 직접적인 대응인 ‘자랑하다’를 택했습니다.
- source_word: ἐν καιρῷ στενοχωρίας σου
  english_pob_choice: in a time of distress
  chosen_korean: 환난의 때에
  alternatives_korean:
  - 곤경의 때에
  - 고난의 때에
  - 어려움의 때에
  lexicon: LSJ
  rationale: στενοχωρία의 압박·곤란·고통의 폭을 살리면서도, 경구의 대비를 분명히 하는 전통적이지만 과도하게 교회적이지 않은 표현으로 옮겼습니다.
- source_word: עֶבֶד מַשְׂכּיל הוּרָם, וְעֶבֶד סָכָל לֹא יִתְאוֹנֵן
  english_pob_choice: not followed in main text
  chosen_korean: —
  alternatives_korean:
  - 지혜로운 종은 높여지고, 어리석은 종은 원망하지 않습니다.
  - 슬기로운 종은 높아지고, 어리석은 종은 불평하지 않습니다.
  lexicon: HALOT
  rationale: 제시된 히브리어는 본문 그리스어와 뜻이 크게 어긋나는 별도 전승이므로, 본문에는 반영하지 않고 주요 대조 전승으로만 처리했습니다.
theological_decisions:
- issue: 히브리어와 그리스어 전승의 큰 불일치
  chosen_reading: 본문은 그리스어의 권면형 문장을 따르고, 히브리어는 대조 전승으로만 남겼습니다.
  alternative_readings:
  - '히브리어: ‘지혜로운 종은 높여지고, 어리석은 종은 불평하지 않습니다’'
  rationale: 이 절은 교리 문제라기보다 본문비평 문제이지만, 전승 차이가 실제 번역을 바꾸므로 한 본문을 혼합해 제시하지 않도록 그리스어를 본문으로 채택했습니다.
  doctrine_reference: 'PHILOSOPHY.md: 외경/제외경은 그리스어 본문을 기본으로 하고, 히브리어 전승은 남아 있을 때만 신중히 대조한다.'
