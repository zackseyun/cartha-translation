  text: A resident alien[a], a foreigner, a stranger, and a poor man—their glory is the fear of God.
  footnotes:
  - marker: a
    text: 'Greek parallel: ''It is not right to dishonor a poor intelligent man, and it is not fitting to glorify a sinful man.'' The Hebrew and Greek differ substantially here.'
