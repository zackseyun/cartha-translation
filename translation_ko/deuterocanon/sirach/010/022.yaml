translation:
  language: ko
  text: 나그네와 이방인, 외국인과 가난한 사람 — 그들의 영광은 하나님을 경외하는 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '그리스어 병행본문: ‘가난하지만 지혜로운 사람을 모욕하는 것은 옳지 않고, 죄인인 사람을 영광스럽게 하는 것도 마땅하지 않습니다.’ 히브리어와 그리스어는 이 절에서 상당히 다릅니다.'
    reason: alternative_reading
lexical_decisions:
- source_word: גֵּר
  english_pob_choice: resident alien
  chosen_korean: 나그네
  alternatives_korean:
  - 거류민
  - 체류 외국인
  lexicon: HALOT
  rationale: גר는 단순한 지나가는 사람이 아니라 공동체 안에 머무는 비토착 거주자를 가리키므로, 한국어에서는 자연스럽고 고전적 뉘앙스를 살리는 ‘나그네’가 가장 무난합니다.
- source_word: וְזָר
  english_pob_choice: an outsider
  chosen_korean: 이방인
  alternatives_korean:
  - 외부인
  - 낯선 사람
  lexicon: HALOT
  rationale: זר는 공동체의 친족·사회적 범주 바깥에 있는 사람을 가리키며, 뒤의 נָכְרִי와 겹치지 않게 구별감을 주기 위해 ‘이방인’을 택했습니다.
- source_word: נָכְרִי
  english_pob_choice: a foreigner
  chosen_korean: 외국인
  alternatives_korean:
  - 타민족 사람
  - 외래인
  lexicon: HALOT
  rationale: נכרי는 다른 민족/나라에 속한 사람을 뜻하는 경우가 많아, 현대 한국어에서 가장 직접적인 대응인 ‘외국인’이 문맥상 분명합니다.
- source_word: יִרְאַת אֱלֹהִים
  english_pob_choice: the fear of God
  chosen_korean: 하나님을 경외하는 것
  alternatives_korean:
  - 하나님에 대한 두려움
  - 하나님 경외
  lexicon: HALOT
  rationale: 지혜문학의 관용구로서 단순 공포가 아니라 경외와 신앙적 태도를 포함하므로, 의미를 드러내는 한국어 표현으로 풀어 옮겼습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행본문의 큰 차이
  chosen_reading: 주 본문은 현존하는 히브리어를 따르고, 그리스어의 다른 잠언적 내용은 각주로만 남기지 않았습니다.
  alternative_readings:
  - '그리스어: ‘가난하지만 지혜로운 사람을 모욕하는 것은 옳지 않고, 죄인인 사람을 영광스럽게 하는 것도 마땅하지 않습니다.’'
  rationale: 이 절은 히브리어와 그리스어가 실질적으로 다른 속담을 전하므로, 본문은 히브리어를 번역하되 그리스어의 의미 차이는 번역 원문 주석에서 투명하게 확인할 수 있도록 하는 편이 좋습니다.
  doctrine_reference: 'PHILOSOPHY.md: 히브리어가 보존된 경우 히브리어를 우선하되, 큰 이견은 숨기지 않는다'
