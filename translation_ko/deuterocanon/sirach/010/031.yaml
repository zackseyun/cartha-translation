  text: How honored one is in his wealth[a], and how despised in his poverty.
  footnotes:
  - marker: a
    text: 'The Greek parallel reads differently in order and emphasis: ''But the one honored in poverty—how much more in wealth? And the one without honor in wealth—how much more in poverty?'' The Hebrew witness here is taken as primary, with the Greek used as a consistency check.'
    reason: alternative_reading
translation:
  language: ko
  text: 부요할 때는 얼마나 존귀한지, 가난할 때는 얼마나 멸시받는지요.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '그리스어 평행문은 순서와 강조가 다르게 읽힙니다: ‘가난할 때 존귀한 자는, 부요할 때는 얼마나 더 그렇겠는가? 그리고 부요할 때 무명한 자는, 가난할 때는 얼마나 더 그렇겠는가?’ 히브리어 증거를 본문으로 삼고 그리스어는 일치성 확인으로 사용했습니다.'
    reason: textual_variant
lexical_decisions:
- source_word: נִכְבָּד
  english_pob_choice: honored
  chosen_korean: 존귀한
  alternatives_korean:
  - 존중받는
  - 영예로운
  - 귀히 여김을 받는
  lexicon: HALOT
  rationale: כבד의 수동적 의미를 살리면서 사회적 지위의 높음을 자연스럽게 드러내는 표현으로 ‘존귀한’을 택했습니다.
- source_word: בְּעָשְׁרוֹ
  english_pob_choice: in his wealth
  chosen_korean: 부요할 때
  alternatives_korean:
  - 그의 부요함 안에서
  - 그의 재물 속에서
  - 부유할 때
  lexicon: HALOT
  rationale: 전치사 בְּ는 상태·환경을 나타낼 수 있으므로, 한국어에서는 문맥상 자연한 상황 부사구로 옮겼습니다.
- source_word: וְנִקְלֶה
  english_pob_choice: despised
  chosen_korean: 멸시받는
  alternatives_korean:
  - 천대받는
  - 경멸받는
  - 낮게 여김을 받는
  lexicon: HALOT
  rationale: נקל의 수동적 뉘앙스를 살려 사람에게 가해지는 사회적 경멸을 직접적으로 드러내는 표현으로 옮겼습니다.
- source_word: בְּעָנְיוֹ
  english_pob_choice: in his poverty
  chosen_korean: 가난할 때
  alternatives_korean:
  - 그의 가난 안에서
  - 그의 빈곤 속에서
  - 궁핍할 때
  lexicon: HALOT
  rationale: 앞 절과 평행을 이루도록 상태를 나타내는 자연스러운 한국어로 옮기되, ‘가난’의 경제적 결핍을 분명히 했습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 평행문의 관계
  chosen_reading: 히브리어 본문을 본문으로 채택하되, 의미는 ‘부요/가난’이라는 사회적 역설로 유지했습니다.
  alternative_readings:
  - 그리스어처럼 ‘가난한 때 더 존귀하고, 부요한 때 더 수치스럽다’는 역전 구조로 옮기는 방식
  rationale: 영어 POB가 히브리어를 primary로 두고 그리스어를 대조 증거로 처리하므로, 본문 역순 재구성은 하지 않고 히브리어의 진술형 대조를 따랐습니다.
  doctrine_reference: 본문비평/번역원리
