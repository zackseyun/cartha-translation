translation:
  language: ko
  text: 부요할 때에는 얼마나 존귀하게 여김을 받고, 가난할 때에는 얼마나 멸시받는지요.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '그리스어 평행문은 순서와 강조가 다르게 읽힙니다: ‘가난한 가운데 존귀한 이는 부요할 때에는 얼마나 더 존귀하겠는가? 또 부요한 가운데 존귀하지 못한 이는 가난할 때에는 얼마나 더 그러하겠는가?’ 히브리어 증거를 본문으로 삼고, 그리스어는 대조·확인을 위해 사용했습니다.'
    reason: textual_variant
lexical_decisions:
- source_word: נִכְבָּד
