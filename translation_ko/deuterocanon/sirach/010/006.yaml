translation:
  language: ko
  text: 어떤 허물에도 이웃에게 악을 갚지 말고, 교만의 길을 걷지 마십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '그리스어: ‘어떤 잘못에 대해서도 이웃에게 분노하지 마십시오.’로 되어 있어, 보복보다 원망의 금지를 강조합니다.'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּכֵל פֶּשַׁע
  english_pob_choice: For any offense / For no offense
  chosen_korean: 어떤 허물에도
  alternatives_korean:
  - 어떤 범죄에도
  - 어떤 잘못에도
  - 어떤 죄과에도
  lexicon: HALOT
  rationale: 히브리어의 보편적 부정 용법을 살려, 어떤 허물도 보복의 근거가 될 수 없음을 간결하게 드러냈습니다.
- source_word: אַל תְּשַׁלֵּם רַע
  english_pob_choice: do not repay evil
  chosen_korean: 악을 갚지 말고
  alternatives_korean:
  - 악을 되갚지 말고
  - 해를 갚지 말고
  - 악으로 보답하지 말고
  lexicon: HALOT
  rationale: שׁלם의 피엘이 지닌 ‘갚다, 보상하다’의 의미를 따라 보복 행위를 직접적으로 금하는 표현으로 옮겼습니다.
- source_word: לְרֵעַ
  english_pob_choice: your neighbor
  chosen_korean: 이웃에게
  alternatives_korean:
  - 동료에게
  - 친구에게
  - 동포에게
  lexicon: HALOT
  rationale: רֵעַ는 관계적 근접성을 지닌 사람을 가리키므로, 지혜문맥에서 자연스럽고 직접적인 ‘이웃’이 적절합니다.
- source_word: בְּדֶרֶךְ גַּאֲוָה
  english_pob_choice: in the way of pride
  chosen_korean: 교만의 길을
  alternatives_korean:
  - 오만의 길을
  - 자만의 길을
  - 거만의 길을
  lexicon: HALOT
  rationale: ‘길’이라는 삶의 방식 은유를 살리고, גַּאֲוָה의 핵심 의미를 ‘교만’으로 간결하게 전달했습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 평행문의 차이
  chosen_reading: 본문은 히브리어의 ‘악을 갚지 말고’로 번역하되, 그리스어가 시사하는 분노/원망의 뉘앙스는 본문에 끼워 넣지 않았습니다.
  alternative_readings:
  - 이웃에게 분노하지 마십시오
  - 이웃을 원망하지 마십시오
  rationale: 이 구절은 히브리어가 현존하고 신뢰도가 높으므로 그것을 본문으로 따르되, 그리스어 평행문과의 의미 차이는 해소하지 않고 보존하는 것이 번역 원칙에 부합합니다.
  doctrine_reference: 'PHILOSOPHY.md: 히브리어가 보존된 곳에서는 히브리어를 본문 기준으로 삼되, 평행 전승의 긴장은 은폐하지 않는다.'
