  source_fidelity: 히브리어 본문은 ‘교만한 자들의 보좌’(단수)를, 그리스어 병행 본문은 ‘통치자들의 보좌들’(복수)을 읽습니다. 초안의 복수 번역은 그리스어와 영어 감사본에는 맞지만, 히브리어를 주본문으로 삼는 경우 단수 차이를 각주로 보존하는 편이 더 충실합니다. 또한 주어 ‘그는’은 문맥 밖에서 선행사가 없어 명시해야 합니다.
  naturalness: ‘그는’은 독립 절로 제시된 본문에서 부자연스럽고 지시 대상이 불명확합니다. ‘하나님께서는’으로 명시하면 현대 한국어 합쇼체 문장으로 자연스럽습니다. ‘그 자리에 앉히셨습니다’는 권세의 자리에서 일어난 역전을 자연스럽게 전달합니다.
  terminology: ‘보좌’, ‘교만한 자들’, ‘겸손한 이들’은 적절합니다. 하나님을 명시하여 원문의 אֱלֹהִים을 빠뜨리지 않으며, 특정 교리적 해석을 더하지 않습니다.
