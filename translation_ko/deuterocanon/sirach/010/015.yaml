  text: God overturned the thrones of the proud, and seated the humble in their place.
translation:
  language: ko
  text: 그는 교만한 자들의 보좌들을 뒤엎으시고, 겸손한 이들을 그 자리에 앉히셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘교만한 자들의 보좌’로, 그리스어는 ‘통치자들의 보좌들’로 전합니다. 본문은 교만한 권세와 통치의 자리가 함께 전복된다는 뜻을 담습니다.
    reason: source_note
lexical_decisions:
- source_word: כִּסֵּא גֵאִים / θρόνους ἀρχόντων
  english_pob_choice: the thrones of the proud
  chosen_korean: 교만한 자들의 보좌들
  alternatives_korean:
  - 교만한 자들의 왕좌들
  - 교만한 자들의 왕좌
  lexicon: 보좌
  rationale: 복수형 ‘thrones’를 살려 여러 지배의 자리 전체가 전복된다는 뜻을 반영했습니다. ‘보좌’는 높은 통치 자리를 드러내면서도 현대 한국어에서 지나치게 교회적이지 않습니다.
- source_word: הָפַך / καθεῖλεν
  english_pob_choice: overturned
  chosen_korean: 뒤엎으시고
  alternatives_korean:
  - 무너뜨리시고
  - 끌어내리시고
  lexicon: 뒤엎다
  rationale: 권세의 전복과 질서의 역전을 선명하게 드러내는 동사로, 본문의 급격한 반전을 자연스럽게 전달합니다.
- source_word: עֲנָוִים / πραεῖς
  english_pob_choice: the humble
  chosen_korean: 겸손한 이들
  alternatives_korean:
  - 온유한 이들
  - 낮은 이들
  lexicon: 겸손한 이들
  rationale: 히브리어와 그리스어가 가리키는 약함·낮아짐의 태도를 함께 담되, 한국어에서 가장 넓고 읽기 쉬운 표현으로 옮겼습니다. ‘온유한’은 도덕적 성향이 더 강해 문맥을 다소 좁힐 수 있습니다.
theological_decisions:
- issue: ‘하나님’의 주권적 전복과 사회적 역전의 표현
  chosen_reading: 하나님께서 교만한 자들의 권세 자리를 뒤엎으시고 겸손한 이들을 그 자리에 앉히시는 분으로 제시했습니다.
  alternative_readings:
  - 단순한 격언적 경고로 약화시키는 해석
  - 개인의 내면적 겸손만을 말하는 표현
  rationale: 집회서의 지혜 전승 맥락에서 하나님은 권력 질서를 뒤집어 낮은 이를 높이시는 주권자로 묘사됩니다. 본문의 ‘보좌들’ 복수와 ‘그 자리에’는 이 공적 역전을 유지해야 합니다.
  doctrine_reference: 신 7:7-8; 눅 1:52
