lexical_decisions:
- source_word: תְּחִלַת
  english_pob_choice: The beginning of
  chosen_korean: 시작은
  alternatives_korean:
  - 처음은
  - 첫머리는
  lexicon: HALOT
  rationale: 지혜 격언의 구조를 살리면서도 현대 한국어에서 자연스럽고 간결하게 전달합니다.
- source_word: גְּאוֹן
  english_pob_choice: pride
  chosen_korean: 교만
  alternatives_korean:
  - 오만
  - 자만
  - 자기과시
  lexicon: HALOT
  rationale: 문맥상 단순한 감정이 아니라 자기 높임의 부정적 태도를 가리키므로, 한국어 성경 문맥에서 가장 직접적인 대응어인 교만을 택했습니다.
- source_word: מוּעָז
  english_pob_choice: defiance
  chosen_korean: 오만함
  alternatives_korean:
  - 반항
  - 불손함
  - 무도함
  lexicon: HALOT
  rationale: 히브리어가 드러내는 대담하고 거친 자기주장을 살리되, 본문에 명시되지 않은 대상을 임의로 보태지 않기 위해 ‘오만함’으로 옮겼습니다.
- source_word: וּמֵעֹשֶׂהוּ
  english_pob_choice: from his Maker
  chosen_korean: 자기의 만드신 분에게서
  alternatives_korean:
  - 그를 만드신 분에게서
  - 창조주에게서
  lexicon: HALOT
  rationale: 어근상 ‘만든 이’의 뜻을 살리면서, 하나님을 가리키는 것으로 이해되는 예의 바른 표현을 유지했습니다. '창조주'는 신학적으로는 자연스럽지만 원문보다 해석이 더 강합니다.
theological_decisions:
- issue: Greek parallel이 첫 절에 '주님에게서 떠남'을 덧붙이는 차이를 어떻게 반영할지
  chosen_reading: 본문은 히브리어의 간결한 표현을 따라 '오만함'으로 두고, 대상은 앞뒤 문맥과 '만드신 분' 표현이 하나님 쪽으로 향하도록 유지했습니다.
  alternative_readings:
  - 교만의 시작은 주님에게서 돌아서는 것이며, 그의 마음은 자기의 만드신 분에게서 돌아섭니다.
  rationale: 히브리어 본문은 첫 절에서 하나님을 직접 명시하지 않으므로, 본문에 없는 목적어를 본문 안으로 앞당기기보다 한국어도 히브리어의 압축성을 보존하는 편이 더 충실합니다.
  doctrine_reference: Translation philosophy §§1, 3
