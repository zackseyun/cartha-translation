translation:
  language: ko
  text: 교만은 주님과 사람들에게 미움을 받습니다[a]. 그리고 그 둘 모두에게서 압제의 죄악이 나옵니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 “그 둘 모두에게서”는 앞의 주님과 사람들을 가리키지만, 압제의 죄악이 그들과 맺는 정확한 관계는 난해합니다. 그리스어는 “그 둘로 말미암아 [누군가가] 불의한 일을 범할 것이다”로 읽힐 수 있으며, 주어도 명시하지 않습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: שְׂנוּאָה
  english_pob_choice: is hateful
  chosen_korean: 미움받습니다
  alternatives_korean:
  - 혐오스럽습니다
  - 미움을 받습니다
  - 가증스럽습니다
  lexicon: HALOT
  rationale: 형용사적 술어가 교만을 부정적 평가의 대상으로 규정하므로, 자연스러운 현대 한국어로 그 강도를 살리면서도 과장하지 않는 표현을 택했습니다.
- source_word: לְאָדוֹן
  english_pob_choice: to the Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주께
  - 주님께
  - 주
  lexicon: HALOT
  rationale: 지혜문맥과 그리스어 Κυρίου를 따라 하나님을 가리키는 표현으로 이해하고, 한국어에서는 경건한 합쇼체에 맞는 '주님'으로 옮겼습니다.
- source_word: וַאֲנָשִׁים
  english_pob_choice: and to men
  chosen_korean: 사람들에게
  alternatives_korean:
  - 사람들
  - 남자들에게
  - 인간들에게
  lexicon: HALOT
  rationale: 히브리어 복수 인칭을 한국어에서 가장 자연스럽게 대표하는 일반 명사로 옮겼으며, 성별을 드러내는 '남자들'은 문맥상 필요하지 않아 피했습니다.
- source_word: מַעַל עֹשֶׁק
  english_pob_choice: oppressive wrongdoing
  chosen_korean: 압제하는 악행
  alternatives_korean:
  - 압제적 악행
  - 학대하는 악행
  - 억압하는 불의
  lexicon: HALOT
  rationale: מַעַל은 단순한 '불의'보다 배신·중대 범죄의 뉘앙스가 있으나, 이 절에서는 עֹשֶׁק과 함께 압제의 성격을 띠는 악행으로 압축되어 있으므로 두 요소를 함께 살렸습니다.
theological_decisions:
- issue: 주님과 사람들에게 미움받는다는 관계 표현
  chosen_reading: 교만은 주님과 사람들에게 미움받습니다
  alternative_readings:
  - 교만은 주님과 사람 앞에서 미움받습니다
  - 교만은 주님과 사람들에게 가증합니다
  rationale: 히브리어 לְ는 대상/방향을 포괄할 수 있으므로, 영어 POB의 해석을 따라 관계의 표적을 분명히 하면서도 본문의 평가적 의미를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: original-language primacy; divine title language'
- issue: 둘에게서 나오는 것의 의미
  chosen_reading: 그리고 둘에게서 압제하는 악행이 나옵니다
  alternative_readings:
  - 그리고 둘에게서 압제가 생깁니다
  - 그리고 둘에게서 불의가 나옵니다
  rationale: 영어 POB의 수정 이력을 반영해 מַעַל עֹשֶׁק을 단순한 결과가 아니라 '압제하는 악행'으로 읽어, 본문이 드러내는 도덕적 성격을 그대로 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: source-semantic priority'
