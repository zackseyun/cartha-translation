translation:
  language: ko
  text: 무절제한 왕은 도시를 망하게 하지만, 그 통치자들의 지혜로 도시는 거주할 만하게 됩니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그 통치자들의 지혜로(분별로) 도시가 거주됩니다/정착됩니다’입니다. 히브리어 נוֹשֶׁבֶת의 상태적 의미를 살린 대안 표현입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: מֶלֶךְ
  english_pob_choice: king
  chosen_korean: 왕
  alternatives_korean:
  - 임금
  - 군주
  lexicon: HALOT
  rationale: 정치적 단수 통치자를 가리키는 일반 명사로, 현대 한국어에서는 '왕'이 가장 자연스럽고 직접적입니다.
- source_word: פָּרוּעַ
  english_pob_choice: undisciplined
  chosen_korean: 무절제한
  alternatives_korean:
  - 방종한
  - 통제되지 않은
  - 무질서한
  lexicon: HALOT
  rationale: 어근이 뜻하는 ‘풀어진, 절제 없는’ 상태를 한국어로 과장 없이 옮겼습니다. 도덕적·정치적 무절제를 함께 담기 위해 '무절제한'을 택했습니다.
- source_word: יַשְׁחִית
  english_pob_choice: will ruin
  chosen_korean: 망하게 합니다
  alternatives_korean:
  - 파멸시킵니다
  - 무너뜨립니다
  - 파괴합니다
  lexicon: HALOT
  rationale: 도시라는 대상과 결합할 때 ‘완전히 파괴하다’보다 공동체를 몰락시키는 결과를 드러내는 표현이 적절합니다.
- source_word: בְּשֶׂכֶל שָׂרֶיהָ
  english_pob_choice: through the wisdom of its rulers
  chosen_korean: 그 통치자들의 지혜로
  alternatives_korean:
  - 그 지도자들의 분별로
  - 그 통치자들의 통찰로
  - 그 지도자들의 지혜를 통해
  lexicon: HALOT
  rationale: בְּשֶׂכֶל은 ‘지혜/분별/통찰’의 수단·원인을 나타내므로, 한국어에서는 부사어 '—로'로 옮겨 도시의 지속 가능성이 지도층의 지혜에 달려 있음을 살렸습니다.
theological_decisions:
- issue: 두 절반의 인과 관계와 도시의 상태 표현
  chosen_reading: 앞절의 무절제한 왕이 도시를 망하게 하는 것과 대조되게, 뒷절은 통치자들의 지혜가 도시를 유지 가능하게 만든다고 옮겼습니다.
  alternative_readings:
  - '''도시는 그 통치자들의 지혜로 채워집니다'''
  - '''도시는 그 통치자들의 지혜로 거주됩니다'''
  rationale: 히브리어는 도시의 ‘거주됨/정착됨’ 상태를 말하지만, 한국어에서는 수동형을 그대로 살리면 부자연스러우므로 공동체가 안정적으로 유지된다는 뜻을 드러내는 방향으로 번역했습니다.
  doctrine_reference: Sirach 10:2의 지혜-통치 격언 구조
