  text: As the judge of a people[a], so are his officials; and as the head of a city, so are its inhabitants.
  footnotes:
  - marker: a
    text: 'Greek parallel: ''An undisciplined king will destroy his people, and a city will be inhabited through the understanding of rulers.'' The surviving Hebrew and Greek forms of this verse differ substantially; the main text follows the extant Hebrew witness.'
    reason: alternative_reading
translation:
  language: ko
  text: 백성을 다스리는 재판관이 어떠한지 그러한지, 그의 관리들도 그러하며 — 도시의 우두머리가 어떠한지 그러한지, 그 주민들도 그러합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '그리스어 병행문: ‘훈련받지 않은 왕은 그의 백성을 멸망시킬 것이며, 지배자들의 이해를 통해 도시가 거주될 것이다.’ 현존 히브리어와 그리스어는 이 절에서 상당히 다르며, 본문은 현존 히브리어 증거를 따릅니다.'
    reason: alternative_reading
lexical_decisions:
- source_word: כְּשׁוֹפֵט
  english_pob_choice: as the judge
  chosen_korean: 백성을 다스리는 재판관이 어떠한지 그러한지
  alternatives_korean:
  - 재판관처럼
  - 재판관인 것처럼
  lexicon: HALOT
  rationale: כְּ의 비교 구조를 살리면서 שׁוֹפֵט를 단순한 법정 판사보다 통치 기능이 있는 ‘재판관’으로 옮겼습니다.
- source_word: עַם
  english_pob_choice: a people
  chosen_korean: 백성
  alternatives_korean:
  - 한 민족
  - 사람들
  lexicon: HALOT
  rationale: 여기서는 특정 집단의 구성원을 가리키는 일반 명사로서 ‘백성’이 가장 자연스럽고, 지혜문학의 관용적 어감도 유지합니다.
- source_word: מְלִיצָיו
  english_pob_choice: his officials
  chosen_korean: 그의 관리들
  alternatives_korean:
  - 그의 해석자들
  - 그의 대변자들
  - 그의 신하들
  lexicon: HALOT
  rationale: 문맥이 도시/통치 비유이므로 ‘해석자’보다 행정적 기능을 가진 사람들로 이해하는 것이 타당하여 ‘관리들’로 옮겼습니다.
- source_word: רֹאשׁ עִיר
  english_pob_choice: the head of a city
  chosen_korean: 도시의 우두머리
  alternatives_korean:
  - 도시의 수장
  - 성읍의 우두머리
  - 도시의 지도자
  lexicon: HALOT
  rationale: ‘머리/우두머리’의 은유를 살리되 현대 독자가 이해할 수 있도록 ‘도시의 우두머리’로 풀었습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행문의 차이
  chosen_reading: 본문은 현존하는 히브리어 잠언 구조를 따라 번역하고, 그리스어의 상당히 다른 문형은 별도 주석으로 보존합니다.
  alternative_readings:
  - ‘훈련받지 않은 왕은 그의 백성을 멸망시킬 것이며, 지배자들의 이해를 통해 도시가 거주될 것이다’(그리스어 병행문)
  rationale: 집회서는 히브리어가 존속하는 경우 이를 본문으로 삼는 원칙에 따라, 의미가 크게 달라지는 그리스어 형태는 본문에 흡수하지 않고 참고로만 남기는 것이 소스 충실성에 맞습니다.
  doctrine_reference: 'PHILOSOPHY.md: translate Sirach from Hebrew where it survives; use Greek parallel as actual input/consistency check.'
