    rationale: 히브리어를 본문으로 삼는 것은 옳지만, 그리스어 병행본이 목록을 더 넓게 읽는 중요한 본문상 차이는 독자가 확인할 수 있도록 각주로 보존해야 합니다.
  - severity: low
    issue: ‘그의 유산은’은 יִנְחַל의 동사적 ‘그가 상속받는다’를 다소 약화합니다.
    rationale: 의미는 유지되지만 ‘그가 물려받는 것은’이 히브리어 동사의 구문과 미래적/격언적 힘을 더 직접적으로 드러냅니다.
