base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/010/011.yaml
  text: At a man's death[a], his inheritance is maggots and worms[b], gnats and creeping things.
  footnotes:
  - marker: a
    text: Hebrew כִּנִּים may also be rendered 'lice' or more generally 'vermin'; the exact insect is uncertain.
    reason: lexical_alternative
  - marker: b
    text: The Greek parallel reads more broadly, 'he will inherit creeping things and beasts, worms,' differing from the Hebrew list of creatures.
    reason: alternative_reading
translation:
  language: ko
  text: 사람이 죽으면[a] 그의 유산은 구더기와 벌레[b], 날벌레와 기어다니는 것들입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 בְּמוֹת는 ‘~할 때’의 시간 표현입니다.
    reason: source_note
  - marker: b
    text: 히브리어 כִּנִּים은 ‘이’나 더 넓게는 ‘해충/벌레’로도 옮길 수 있으며, 정확한 곤충은 확실하지 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּמוֹת אָדָם
  english_pob_choice: At a man's death
  chosen_korean: 사람이 죽으면
  alternatives_korean:
  - 한 사람이 죽을 때
  - 사람의 죽음에
  lexicon: HALOT
  rationale: 히브리어의 הזמן적 표현을 한국어 자연문으로 옮기되, אדם의 대표적 인간 일반성을 살려 ‘사람’으로 번역했습니다.
- source_word: יִנְחַל
  english_pob_choice: his inheritance is / what he inherits is
  chosen_korean: 그의 유산은
  alternatives_korean:
  - 그가 상속받는 것은
  - 그가 물려받는 것은
  lexicon: HALOT
  rationale: ‘inherit’의 결과를 한국어에서 가장 간결하게 드러내기 위해 소유격 구조로 옮겼습니다.
- source_word: רִמָּה וְתוֹלֵעָה
  english_pob_choice: maggots and worms
  chosen_korean: 구더기와 벌레
  alternatives_korean:
  - 땅벌레와 벌레
  - 구더기와 지렁이
  lexicon: HALOT
  rationale: 첫 번째는 부패와 연결된 구더기로, 두 번째는 일반적인 벌레로 구분해 히브리어의 병렬을 살렸습니다.
- source_word: כִּנִּים
  english_pob_choice: gnats
  chosen_korean: 날벌레
  alternatives_korean:
  - 이
  - 진드기
  - 벌레
  lexicon: HALOT
  rationale: 어휘의 정확한 곤충 종을 단정하기 어려우므로, 작은 흉측한 해충이라는 범주를 살리는 중립적 표현을 택했습니다.
- source_word: וָרֶמֶשׂ
  english_pob_choice: and creeping things
  chosen_korean: 기어다니는 것들
  alternatives_korean:
  - 기어다니는 피조물
  - 땅을 기어가는 것들
  lexicon: HALOT
  rationale: רֶמֶשׂ의 포괄적 의미를 유지하기 위해 문자적이면서도 한국어로 자연스러운 표현을 사용했습니다.
theological_decisions:
- issue: אָדָם의 일반명사성
  chosen_reading: ‘사람’으로 번역해 남성 단수 형식을 유지하면서도 격언의 보편성을 드러냈습니다.
  alternative_readings:
  - ‘한 남자’
  - ‘인간’
  rationale: 히브리어는 문법적으로 남성 단수이지만, 경구의 의미는 보편적 인간에게 적용됩니다. 한국어에서는 성별을 과도하게 강조하지 않는 ‘사람’이 균형적입니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
- issue: 히브리어 본문 우선과 헬라어 병행본
  chosen_reading: 히브리어의 열거를 본문으로 따르고, 헬라어의 더 넓은 동물 목록 차이는 별도 주석 없이 반영하지 않았습니다.
  alternative_readings:
  - 헬라어처럼 ‘기어다니는 것들과 짐승들, 구더기’로 옮김
  rationale: 시락서는 히브리어가 보존된 곳에서 히브리어를 우선하고, 헬라어는 의미 확인 자료로 활용한다는 원칙에 따릅니다.
  doctrine_reference: PHILOSOPHY.md §What we are translating
