  rationale: 히브리어를 우선하여 네 부류의 생물을 그대로 열거하고, 상속 동사를 ‘그가 물려받는 것’으로 직접 번역했습니다. כִּנִּים의 불확실성은 해당 단어에 붙인 각주로 보존했으며, 영어 POB 감사 기록의 그리스어 병행본 차이도 별도 각주로 반영했습니다.
