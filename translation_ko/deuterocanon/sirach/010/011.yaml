review_pass:
  verdict: revise
  source_fidelity: 히브리어 본문은 사람이 죽을 때 그가 받게 되는 ‘상속’으로 리마, 톨레아, 킨님, 레메스를 열거합니다. 초안은 전체 의미와 열거를 대체로 충실히 반영했으나, יִנְחַל의 능동적 ‘그가 상속받다’를 ‘그의 유산은’으로 바꾸어 다소 명사화했으며, כִּנִּים에 대한 각주 표지가 실제 해당 어휘가 아닌 앞의 ‘벌레’ 뒤에 놓여 있습니다.
  naturalness: ‘사람이 죽을 때, 그가 물려받는 것은 …입니다’는 현대 표준어 합쇼체로 자연스럽고, 격언의 냉철한 문체도 유지합니다. ‘기어 다니는’은 띄어쓰기를 적용했습니다.
  terminology: ‘구더기와 벌레’는 רִמָּה וְתוֹלֵעָה의 구별을 무리 없이 보존합니다. כִּנִּים은 정확한 종이 불확실하므로 본문에서는 통상적인 ‘이’를 쓰고, 각주에서 ‘각다귀류/작은 해충’ 등의 가능성을 밝혀 불확실성을 보존하는 편이 ‘날벌레’보다 더 정확합니다. 그리스어 병행본의 상이한 열거는 영어 POB 감사 기록에 따라 별도 각주로 밝혀야 합니다.
  issues:
  - severity: medium
    issue: כִּנִּים 관련 각주 표지가 ‘날벌레’가 아니라 앞선 ‘벌레’ 뒤에 배치되어 있습니다.
    rationale: 각주 표지는 설명하는 단어에 직접 붙어야 하며, 현 위치는 רִמָּה וְתוֹלֵעָה의 ‘벌레’를 설명하는 것으로 읽힐 수 있습니다.
  - severity: medium
