translation:
  language: ko
  text: 교만이 바라는 것은 죄이며, 교만의 근원은 사악함을 쏟아냅니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '그리스어: “교만의 시작은 죄이며, 그것을 지닌 자는 가증한 것을 쏟아낼 것입니다.” 그리스어는 첫 절이 현저히 다르고, 둘째 절도 확장합니다.'
    reason: alternative_reading
lexical_decisions:
- source_word: מִקְוֵה
  english_pob_choice: hope
  chosen_korean: 희망
  alternatives_korean:
  - 기대
  - 바람
  - 근거
  lexicon: HALOT
  rationale: 히브리어 מִקְוֵה를 POB가 'hope'로 잡은 점을 따라, 교만이 기대하는 바를 나타내는 말로 '희망'을 택했습니다. '시작'으로 옮기면 히브리어 본문의 의미가 약해지므로 본문에는 반영하지 않았습니다.
- source_word: זָדוֹן
  english_pob_choice: arrogance
  chosen_korean: 교만
  alternatives_korean:
  - 오만
  - 거만
  - 자만
  lexicon: HALOT
  rationale: זָדוֹן은 교만하고 함부로 구는 태도를 가리키므로, 한국어 성경 문맥에서 가장 자연스럽고 넓게 통용되는 '교만'으로 옮겼습니다. '오만'도 가능하지만, 여기서는 덕목 대조를 분명히 하는 '교만'이 적절합니다.
- source_word: מְקוֹרָהּ
  english_pob_choice: its source
  chosen_korean: 그 근원
  alternatives_korean:
  - 그 샘
  - 그 원천
  - 그 출처
  lexicon: HALOT
  rationale: 여성형 접미사는 앞의 교만을 가리키므로, 물의 비유를 살리면서도 현대 한국어에서 자연스러운 '근원'을 택했습니다. '샘'은 더 직설적이지만 뒤의 동사와의 연결을 고려할 때 '근원'이 더 유연합니다.
- source_word: יַבִּיעַ
  english_pob_choice: pours out
  chosen_korean: 쏟아냅니다
  alternatives_korean:
  - 흘려보냅니다
  - 솟아나게 합니다
  - 분출합니다
  lexicon: HALOT
  rationale: 이 동사는 샘에서 물이 솟고 흘러나오는 이미지를 가지므로, 결과물을 밖으로 내보내는 힘을 살린 '쏟아냅니다'가 적합합니다. 영어 POB의 'pours out'과도 잘 맞습니다.
- source_word: זִמָּה
  english_pob_choice: wickedness
  chosen_korean: 악
  alternatives_korean:
  - 사악함
  - 패역
  - 음란
  lexicon: HALOT
  rationale: זִמָּה는 문맥에 따라 악한 꾀, 타락, 사악함을 넓게 가리킬 수 있어, 여기서는 의미를 좁히지 않는 '악'으로 옮겼습니다. 성적인 뉘앙스로 한정되는 번역은 이 지혜문맥에 과도합니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 평행본문의 첫 절 차이
  chosen_reading: 본문은 살아 있는 히브리어 증거를 따라 '교만의 희망은 죄이며'로 옮겼습니다.
  alternative_readings:
  - '''교만의 시작은 죄이다'''
  rationale: 이 구절에서는 히브리어가 직접 보존되어 있으므로, 본문은 히브리어 우선을 따르는 것이 POB 원칙에 맞습니다. 그리스어는 중요한 대안 전승이므로 검토하되, 본문을 대체할 정도로 우선하지는 않습니다.
  doctrine_reference: '번역 철학 §1: 사라진 것이 아닌 살아 있는 원어 증거 우선; Ben Sira의 히브리어 우선 원칙'
