base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/010/018.yaml
  text: Arrogance and insolence are not fitting for a human being[a], much less for one born of a woman.
  footnotes:
  - marker: a
    text: 'Greek parallel: ''Arrogance was not created for human beings, nor wrathful anger for those born of women.'' The Hebrew witness instead reads ''arrogance and insolence ... much less for one born of a woman.'''
    reason: alternative_reading
translation:
  language: ko
  text: 교만과 뻔뻔함은 사람에게 어울리지 않으며, 여인에게서 난 사람에게도 그러합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 병행본문은 “교만은 사람들을 위해 창조되지 않았고, 격노도 여자에게서 난 자들을 위해 창조되지 않았다”라고 읽습니다. 히브리어 증거는 본문처럼 “교만과 뻔뻔함 … 여인에게서 난 사람”으로 읽습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: לֹא נָאוֶה
  english_pob_choice: are not fitting
  chosen_korean: 어울리지 않으며
  alternatives_korean:
  - 합당하지 않으며
  - 마땅하지 않으며
  - 어울리는 것이 아니며
  lexicon: HALOT
  rationale: נאוה는 ‘어울리다, 보기 좋다, 합당하다’의 범위로 이해할 수 있어, 한국어에서는 관계적·규범적 부자연스러움을 담는 ‘어울리지 않다’가 가장 자연스럽습니다.
- source_word: לֶאֱנוֹשׁ
  english_pob_choice: for a human being
  chosen_korean: 사람에게
  alternatives_korean:
  - 인간에게
  - 한 사람에게
  - 인류에게
  lexicon: HALOT
  rationale: אֱנוֹשׁ는 유한한 인간을 가리키는 일반 명사이므로, 대표성을 살리면서도 현대 한국어에서 자연스러운 ‘사람’으로 옮겼습니다.
- source_word: זָדוֹן
  english_pob_choice: arrogance
  chosen_korean: 교만
  alternatives_korean:
  - 오만
  - 자만
  - 거만
  lexicon: HALOT
  rationale: זָדוֹן은 거만한 자기고양과 뻔뻔한 자기주장을 가리켜, 내적 태도를 강조하는 한국어 ‘교만’이 가장 적합합니다.
- source_word: וְעַזוּת
  english_pob_choice: insolence
  chosen_korean: 오만
  alternatives_korean:
  - 뻔뻔함
  - 무례함
  - 불손함
  lexicon: HALOT
  rationale: עַזוּת는 대담함이 아니라 도덕적 무례와 뻔뻔한 태도를 뜻하므로, 앞의 ‘교만’과 구별되면서도 강도를 살리는 ‘오만’으로 번역했습니다.
- source_word: לִילוּד אִשָּׁה
  english_pob_choice: for one born of a woman
  chosen_korean: 여인에게서 난 이에게는
  alternatives_korean:
  - 여인에게서 태어난 사람에게는
  - 여자에게서 난 자에게는
  - 여인에게서 태어난 이에게는
  lexicon: HALOT
  rationale: 이 관용구는 인간의 유한성과 피조성을 강조하므로, 본문의 대비를 살리면서도 문학적으로 자연스러운 ‘여인에게서 난 이’로 옮겼습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행본문의 차이
  chosen_reading: 본문은 살아 있는 히브리어 증거를 따라 ‘교만과 오만’을 택하고, 그리스어의 ‘was not created for’는 본문 각주로만 반영합니다.
  alternative_readings:
  - 교만은 사람에게 창조되지 않았으며, 분노한 성질도 여자에게서 난 자들에게는 그렇습니다.
  rationale: 이 구절은 히브리어가 고신뢰로 보존되어 있으므로, मुख्य 본문은 히브리어의 평가적 표현을 따르고 그리스어의 변이 독법은 의미 있는 병행 전승으로 보존하는 것이 원문 우선 원칙에 부합합니다.
  doctrine_reference: 'Translation philosophy: Original-language primacy over translation tradition; preserve significant textual tension.'
