  source_fidelity: 히브리어의 לֹא נָאוֶה는 ‘어울리지 않다’로 잘 반영되었습니다. 그러나 אַף는 문맥상 ‘심지어/또한’의 첨가·강조로도 읽히며, ‘하물며’와 ‘더욱’의 결합은 원문에 명시되지 않은 비교의 강도를 확정합니다. 이를 한국어 본문에서는 보다 중립적으로 보존하는 편이 안전합니다.
  naturalness: ‘교만과 오만’은 현대 한국어에서 의미가 상당히 겹칩니다. עַזוּת의 부정적이고 뻔뻔한 대담함은 ‘뻔뻔함’이 더 분명히 구별해 줍니다. 또한 ‘여인에게서 난 이’보다 ‘여인에게서 난 사람’이 현대 표준어 문장으로 자연스럽습니다.
  terminology: זָדוֹן은 ‘교만’, עַזוּת는 ‘뻔뻔함’으로 구별했습니다. 그리스어 병행본문의 ὀργὴ θυμοῦ는 한국어에서 ‘격노’로 간결하게 옮겼으며, 히브리어와 그리스어의 술어 및 둘째 악덕의 차이를 각주에 유지했습니다.
