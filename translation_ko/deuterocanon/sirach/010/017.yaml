translation:
  language: ko
  text: 그가 그들을 땅에서 쓸어내시고, 뿌리째 뽑으셨으며, 그들의 기억을 땅에서 사라지게 하셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 וְסִחָם은 의미가 분명하지 않아서, 여기서는 그리스어 병행본문이 뒷받침하는 ‘제거하다/쓸어버리다’의 뜻으로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסִחָם
  english_pob_choice: he swept them
  chosen_korean: 그들을 땅에서 쓸어내시고
  alternatives_korean:
  - 그들을 땅에서 쓸어버리시고
  - 그들을 땅에서 없애시고
  - 그들을 땅에서 지워 버리시고
  lexicon: HALOT
  rationale: 희귀하고 다소 불확실한 동사로, 영어 POB처럼 제거·소거의 강한 이미지를 살리되 과도하게 특정한 뜻으로 좁히지 않기 위해 ‘쓸어내시고’를 택했습니다.
- source_word: וַיִּתְּשֵׁם
  english_pob_choice: and uprooted them
  chosen_korean: 뿌리째 뽑으셨으며
  alternatives_korean:
  - 뿌리째 뽑아 내셨으며
  - 뽑아 버리셨으며
  - 뿌리째 들어내셨으며
  lexicon: HALOT
  rationale: נתש의 관용적 이미지를 한국어에서 자연스럽게 전달하는 표현으로, 완전한 제거를 암시하는 ‘뿌리째 뽑다’가 가장 적절합니다.
- source_word: וַיַּשְׁבֵּת ... זִכְרָם
  english_pob_choice: and he made their memory cease
  chosen_korean: 그들의 기억을 땅에서 사라지게 하셨습니다
  alternatives_korean:
  - 그들의 기억을 땅에서 끊어 버리셨습니다
  - 그들의 기억을 땅에서 멈추게 하셨습니다
  - 그들의 기억을 땅에서 소멸시키셨습니다
  lexicon: HALOT
  rationale: שׁבת의 ‘그치게 하다/멈추게 하다’ 의미를 살리면서, 대상이 ‘기억’이므로 한국어에서는 ‘사라지게 하다’가 가장 자연스럽고 문맥상 적절합니다.
- source_word: מֵאֶרֶץ
  english_pob_choice: from the earth
  chosen_korean: 땅에서
  alternatives_korean:
  - 땅으로부터
  - 세상에서
  - 지면에서
  lexicon: HALOT
  rationale: 히브리어 אֶרֶץ는 ‘땅/땅 위’의 범위를 가리킬 수 있으며, 본문이 동일한 표현을 반복해 전면적 소거를 강조하므로 ‘땅에서’가 간결하고 일관됩니다.
