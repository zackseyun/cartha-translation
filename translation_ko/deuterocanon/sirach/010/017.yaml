  terminology: ‘뿌리째 뽑다’, ‘기억’, ‘사라지게 하다’는 문맥에 맞고 신학적·교파적 해석을 덧붙이지 않습니다. 각주도 난해한 첫 히브리어 어형과 그리스어 병행본문의 제한된 보조 역할을 적절히 설명합니다.
