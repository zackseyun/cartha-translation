  rationale: 여기서는 물리적 의자만이 아니라 자리·지위까지 아우르는 뜻이 있으므로, 본문에는 간결한 ‘네 자리’를 두고 발문으로 의미 범위를 열어 두었습니다.
theological_decisions:
- issue: '‘your seat’의 의미 범위: 단순 좌석인가, 지위/자리인가'
  chosen_reading: 본문은 ‘네 자리’로 옮기되, 뜻은 실제 좌석과 함께 지위·몫의 뉘앙스까지 포함하도록 유지했습니다.
  alternative_readings:
  - ‘네 자리’만으로 제한
  - ‘네 지위’로 추상화
  rationale: 히브리어 מוֹשָׁבֶךָ는 좌석, 거처, 자리/위치를 모두 가리킬 수 있습니다. 문맥상 연회의 자리 이미지가 있지만, 지위적 함의도 있으므로 어느 한쪽으로만 좁히지 않았습니다.
  doctrine_reference: 지혜문학의 비유적 경고를 과도하게 축소하지 않고, 원문이 허용하는 의미 범위를 보존하는 번역 원칙
