  text: Do not seat him at your right hand[a], lest he seek your seat.
  footnotes:
  - marker: a
    text: Or, 'Do not seat him on your right, or he will seek your place.' The Hebrew 'your seat' can also imply your position or status, not only a literal chair.
    reason: lexical_alternative
translation:
  language: ko
  text: 그를 네 오른쪽에 앉히지 마십시오. 네 자리를 찾지 않게 하려는 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 מוֹשָׁבֶךָ는 문자적 ‘앉는 자리’뿐 아니라 ‘자리, 위치, 지위’까지도 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל
  english_pob_choice: Do not
  chosen_korean: …마십시오
  alternatives_korean:
  - …하지 마십시오
