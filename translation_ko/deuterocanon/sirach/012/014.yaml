  - 네 오른손에
  lexicon: HALOT
  rationale: 문자적 ‘오른쪽/오른편’ 이미지를 살리되, 현대 한국어에서 자연스러운 표현을 택했습니다.
- source_word: מוֹשָׁבֶךָ
  english_pob_choice: your seat
  chosen_korean: 네 자리
  alternatives_korean:
