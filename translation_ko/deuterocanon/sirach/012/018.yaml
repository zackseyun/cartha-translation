translation:
  language: ko
  text: 그는 불이 그 안에서 타오를 때까지 지나가지 않을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '그리스어 병행본: “그는 머리를 흔들고 손뼉을 치며, 많이 수군거리고 얼굴빛을 바꿀 것입니다.” 이 더 긴 표현은 히브리어의 간결한 적대 행위를 해석한 것일 가능성이 있습니다.'
    reason: alternative_reading
lexical_decisions:
- source_word: לֹא יַעֲבֹר
  english_pob_choice: he will not pass by
  chosen_korean: 지나가지 않을 것입니다
  alternatives_korean:
  - 지나치지 않을 것입니다
  - 가버리지 않을 것입니다
  - 물러서지 않을 것입니다
  lexicon: HALOT
  rationale: עבר의 기본 뜻인 “지나가다/지나치다”를 살려, 고집스럽게 그 자리를 떠나지 않는 뉘앙스를 자연스러운 한국어로 옮겼습니다.
- source_word: עַד
  english_pob_choice: until
  chosen_korean: 때까지
  alternatives_korean:
  - 전에
  - 까지
  lexicon: HALOT
  rationale: 종결 시점을 나타내는 시간 부사절로 가장 자연스럽게 대응됩니다.
- source_word: תִּבְעַר
  english_pob_choice: a fire burns
  chosen_korean: 타오를
  alternatives_korean:
  - 불타게 될
  - 활활 탈
  - 불이 붙을
  lexicon: HALOT
  rationale: 불 자체가 타는 상태를 살리되, 과도하게 인위적이거나 원인화된 표현은 피했습니다. 본문 히브리어는 간결하므로 ‘타오르다’가 가장 무리 없는 대응입니다.
- source_word: אֵשׁ
  english_pob_choice: a fire
  chosen_korean: 불
  alternatives_korean:
  - 한 불
  - 화염
  lexicon: HALOT
  rationale: 히브리어의 בלתי정관사적 표현을 한국어에서는 자연스럽게 ‘불’로 옮겼습니다. 문맥상 비유적 분노/격정의 이미지를 유지합니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행본의 차이
  chosen_reading: 본문은 현존 히브리어를 따라 간결하게 번역하고, 그리스어의 더 긴 묘사는 각주로 보존했습니다.
  alternative_readings:
  - 그는 머리를 흔들고 손뼉을 치며, 많이 수군거리고 얼굴빛을 바꿀 것입니다.
  rationale: 이 절의 히브리어는 짧고 압축적이지만, 그리스어는 적대적 행동을 해석적으로 विस्तार합니다. 본문은 히브리어를 우선하되, 해석상 중요한 그리스어 전승은 유실시키지 않는 것이 적절합니다.
  doctrine_reference: 'PHILOSOPHY.md: 현존 히브리어 우선, 그리스어 병행본은 주해용 증거로 보존'
