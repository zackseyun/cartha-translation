  - marker: b
    text: The Hebrew wording behind 'persists in wickedness' is difficult; the Greek parallel supports the sense of continuing in evil.
    reason: alternative_reading
translation:
  language: ko
  text: 악에 머무는 자에게는 좋은 것이 없고, 자비를 베풀지 않는 자에게도 그러합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘의(צְדָקָה)’를 하지 않는 자라고 읽을 수 있지만, 그리스어 평행본문은 ‘자비/구제’를 뜻하는 ἐλεημοσύνην을 사용합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어의 לִמְנֹחַ רָשָׁע은 난해하지만, 그리스어 평행본문이 ‘악에 계속 머무는’ 뜻을 분명히 뒷받침합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אֵין טוֹבָה
  english_pob_choice: No good comes
  chosen_korean: 좋은 것이 없고
  alternatives_korean:
  - 선한 일이 없습니다
  - 유익이 없습니다
  lexicon: HALOT
  rationale: 히브리어의 존재 부정문을 한국어에서는 자연스럽게 ‘좋은 것이 없다’로 옮기되, 문장 전체의 예언적·격언적 어조를 유지했습니다.
- source_word: לִמְנֹחַ רָשָׁע
  english_pob_choice: to one who persists in wickedness
  chosen_korean: 악에 머무는 자에게는
  alternatives_korean:
  - 악을 계속하는 자에게는
  - 악 가운데 머무는 자에게는
  lexicon: HALOT
  rationale: 본문의 קשה한 표현을 그리스어 평행본문의 지속적 악행 의미에 따라 ‘머무는’으로 풀어, 단순한 정적 ‘쉼’보다 계속적인 상태를 드러냈습니다.
- source_word: צְדָקָה
  english_pob_choice: mercy
  chosen_korean: 자비를
  alternatives_korean:
  - 구제를
  - 알림을
  lexicon: HALOT
  rationale: 히브리어 צְדָקָה가 이 문맥에서는 자선/자비의 실천을 가리키며, 그리스어 평행본문 ἐλεημοσύνην도 이를 지지하므로 추상적 ‘의’보다 구체적 ‘자비’를 택했습니다.
- source_word: לֹא עָשָׂה
  english_pob_choice: does not show
  chosen_korean: 베풀지 않는
  alternatives_korean:
  - 행하지 않는
  - 하지 않는
  lexicon: HALOT
  rationale: ‘자비’를 목적어로 둘 때 한국어에서는 ‘베풀다’가 가장 자연스럽고, 행위의 실천 여부를 분명하게 나타냅니다.
theological_decisions:
- issue: צְדָקָה의 의미 범위
  chosen_reading: 이 절에서는 ‘의’보다 자비/구제의 실천을 가리키는 표현으로 이해했습니다.
  alternative_readings:
  - 의
  - 알림
  - 자선
  rationale: 히브리어만 보면 ‘의’로도 읽을 수 있지만, 그리스어 평행본문이 분명히 ἐλεημοσύνην(자비/구제)을 제시하므로 본문 의미를 희석하지 않기 위해 ‘자비’를 본문에 반영했습니다.
  doctrine_reference: 'DOCTRINE.md: original-language primacy; documented lexical tension'
