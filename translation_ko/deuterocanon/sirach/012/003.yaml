translation:
  language: ko
  text: 악을 계속하는 사람에게는 좋은 것이 없고,[b] 자비를 베풀지 않는 사람에게도 좋은 것이 없습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘의를 행하지 않는 자’라고 할 수 있지만, 그리스어 평행본문은 ‘자비/구제’를 뜻하는 ἐλεημοσύνην을 사용합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어의 לִמְנֹחַ רָשָׁע은 난해하지만, 그리스어 평행본문은 ‘악을 계속하는’ 의미를 지지합니다.
    reason: alternative_reading
