base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/012/008.yaml
  text: A friend is not known in prosperity[a], and an enemy is not hidden in adversity.
  footnotes:
  - marker: a
    text: 'Hebrew: ''A lover/friend is not known in good fortune, and a hater/enemy is not hidden in adversity.'' The Greek parallel differs in the first clause, reading roughly ''A friend will not be avenged/requited in good things,'' but the surviving Hebrew is the primary witness here and yields a balanced proverb contrasting prosperity with adversity.'
    reason: textual_variant
translation:
  language: ko
  text: 좋은 때에 친구는 드러나지 않고, 환난 때에 원수는 숨겨지지 않습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 ‘좋은 때/환난 때’의 대구를 이루지만, 그리스어 평행본문은 첫째 행에서 다른 의미를 보입니다. 본문비평상 히브리어를 따릅니다.
    reason: textual_variant
lexical_decisions:
- source_word: אוֹהֵב
  english_pob_choice: a friend
  chosen_korean: 친구
  alternatives_korean:
  - 사랑하는 사람
  - 애인
  - 사랑하는 자
  lexicon: HALOT
  rationale: 지혜문맥에서 אוֹהֵב은 연애 대상이 아니라 우정의 관계를 가리키므로, 현대 한국어에서 자연스러운 ‘친구’로 옮겼습니다.
- source_word: לֹא יִוָּדַע
  english_pob_choice: is not known
  chosen_korean: 드러나지 않고
  alternatives_korean:
  - 알려지지 않고
  - 알 수 없고
  - 인정되지 않고
  lexicon: HALOT
  rationale: ‘알려지다’보다 관계의 실상이 밖으로 나타나는지를 강조하는 ‘드러나지 않다’가 잠언적 대비를 더 잘 살립니다.
- source_word: בַּטּוֹבָה
  english_pob_choice: in prosperity
  chosen_korean: 좋은 때에
  alternatives_korean:
  - 번영할 때에
  - 형통할 때에
  - 좋은 형편에서
  lexicon: HALOT
  rationale: 직역적인 ‘번영/형통’도 가능하지만, 대구를 이루는 후반절의 ‘환난 때’와 자연스럽게 맞추기 위해 문맥적 표현인 ‘좋은 때’로 옮겼습니다.
- source_word: שׂוֹנֵא
  english_pob_choice: an enemy
  chosen_korean: 원수
  alternatives_korean:
  - 미워하는 자
  - 증오하는 자
  - 적
  lexicon: HALOT
  rationale: 히브리어 분사상 ‘미워하는 자’가 직역이지만, 수사적으로는 관계의 적대자를 가리키므로 한국어의 간명한 대응인 ‘원수’를 택했습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행본문의 차이
  chosen_reading: 히브리어 본문을 따라 첫째 행을 ‘좋은 때/좋은 상황’과 관련된 대구로 유지했습니다.
  alternative_readings:
  - 그리스어 병행본문의 ‘보응/갚음’ 계열 의미를 반영하는 읽기
  rationale: 제시된 영어 POB도 히브리어를 주본문으로 삼아 ‘prosperity/adversity’의 지혜 격언 구조를 채택하므로, 한국어도 그 균형을 보존했습니다.
  doctrine_reference: 본문비평/잠언적 지혜 문학의 평행법
- issue: ‘환난’의 의미 범위
  chosen_reading: ‘환난’으로 번역해 단순한 나쁜 상황이 아니라 드러나는 고난의 상황을 살렸습니다.
  alternative_readings:
  - 어려움
  - 재난
  - 불행
  rationale: 후반절의 대조점은 도덕적 악이 아니라 시련 속에서 관계의 진상이 드러나는 점이므로, 지혜문학에서 자주 쓰이는 ‘환난’이 가장 적절합니다.
  doctrine_reference: 지혜문학의 관찰적 진술
