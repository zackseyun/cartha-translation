base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/012/009.yaml
  text: In a man's prosperity even an enemy is friendly[a], but in his adversity even a friend keeps apart.
  footnotes:
  - marker: a
    text: Or, 'even an enemy becomes a friend.' The Hebrew uses רֵעַ in the first line, which can denote 'friend/companion'; the main text renders it more cautiously as 'is friendly' to preserve the proverb's irony and avoid overstating a genuine reconciliation.
    reason: lexical_alternative
translation:
  language: ko
  text: 사람이 잘될 때에는 적대자도 친한 척하지만, 그가 곤경에 빠지면 친구도 멀어집니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 רֵעַ는 ‘친구/동반자’도 뜻하므로, 첫 행은 ‘친한 척하다’로 옮겨 역설적 뉘앙스를 살렸습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּטוֹבַת אִישׁ
  english_pob_choice: In a man's prosperity
  chosen_korean: 사람이 잘될 때에는
  alternatives_korean:
  - 한 사람의 번영 속에서는
  - 어떤 사람의 형통함 속에서는
  - 사람의 좋은 때에는
  lexicon: HALOT
  rationale: טוֹבָה를 한국어에서 자연스럽게 받쳐 주는 표현으로 ‘잘될 때’를 택해, 상태의 호전과 사회적 분위기 변화를 함께 살렸습니다.
- source_word: שׂוֹנֵא
  english_pob_choice: an enemy
  chosen_korean: 적대자
  alternatives_korean:
  - 원수
  - 미워하는 사람
  - 적
  lexicon: HALOT
  rationale: 직역상 ‘미워하는 자’이지만 문맥상 관계적 의미가 강하므로, 평이하게 ‘적대자’로 옮겨 적대 관계를 드러냈습니다.
- source_word: רֵעַ
  english_pob_choice: is friendly
  chosen_korean: 친한 척하지만
  alternatives_korean:
  - 친한 듯하지만
  - 친구처럼 행동하지만
  - 우호적인 듯하지만
  lexicon: HALOT
  rationale: HEB רֵעַ의 우정/동반자 의미를 살리되, 본문이 진짜 화해가 아니라 역설적 관찰임을 반영해 ‘친한 척하다’로 처리했습니다.
- source_word: וּבְרָעָתוֹ
  english_pob_choice: in his adversity
  chosen_korean: 그가 곤경에 빠지면
  alternatives_korean:
  - 그의 역경 속에서는
  - 그의 재난 때에는
  - 그의 불행 속에서는
  lexicon: HALOT
  rationale: רָעָה를 도덕적 악이 아니라 처지의 불운으로 이해하여, 한국어에서 가장 분명한 상황 표현인 ‘곤경에 빠지다’를 택했습니다.
- source_word: בּוֹדֵד
  english_pob_choice: keeps apart
  chosen_korean: 멀어집니다
  alternatives_korean:
  - 떨어져 있습니다
  - 물러섭니다
  - 따로 떨어집니다
  lexicon: HALOT
  rationale: 분리·단절의 상태를 한국어 관용으로 옮겨, 친구가 어려움에서 관계를 끊고 거리를 두는 뜻을 자연스럽게 드러냈습니다.
theological_decisions:
- issue: 잠언식 역설의 보존
  chosen_reading: 적대자가 실제로 친구가 된다고 단정하지 않고 ‘친한 척하지만’으로 옮겨, 겉보기 우호와 진짜 우정의 긴장을 살렸습니다.
  alternative_readings:
  - 적대자도 친구가 됩니다
  - 적대자도 우호적으로 보입니다
  rationale: 히브리어 רֵעַ의 양가성에 맞춰, 도덕적 진정성보다 사회적 관찰의 역설을 유지하는 것이 본문의 지혜문학적 의도에 더 가깝습니다.
  doctrine_reference: 지혜문학의 관찰적 진술과 관계의 진정성
- issue: 곤경/불행의 성격
  chosen_reading: רָעָה를 ‘악’이 아니라 관계와 삶의 상태가 무너진 ‘곤경’으로 이해했습니다.
  alternative_readings:
  - 악 속에 있을 때
  - 불행할 때
  - 재난 가운데 있을 때
  rationale: 문맥상 윤리적 악이 아니라 사회적 역경을 가리키므로, 한국어에서도 원문의 상황성을 분명히 하는 표현이 필요합니다.
  doctrine_reference: 문맥 우선의 의미론
