  text: Do not give him your bread[b][a], lest by it he set himself against you.
  footnotes:
  - marker: a
    text: 'Hebrew: ''bread-vessels/items of bread''; the wording is difficult. The Greek parallel more clearly supports the sense ''bread'' or ''food.'''
