translation:
  language: ko
  text: 그에게 빵을 주지 마십시오. 그것으로 그가 당신에게 맞서지 않도록 하십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘빵의 기구들/물건들’처럼 보이는 난해한 표현입니다. 병행 그리스어는 ‘빵’ 또는 ‘음식’의 뜻을 더 분명히 뒷받침합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그것들로 그가 당신을 지배하지 않도록 하십시오.’ 히브리어 대명사는 복수이며, 병행 그리스어는 ‘지배하다’라는 더 강한 뜻을 보입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: כְּלֵי לָחֶם
  english_pob_choice: your bread
  chosen_korean: 그의 빵
  alternatives_korean:
  - 빵
  - 음식
  - 양식
  lexicon: HALOT
  rationale: 히브리어 표현이 문자적으로는 어려우나, 병행 그리스어가 빵/음식의 구체적 의미를 분명히 하므로 한국어도 구체적이고 자연스럽게 ‘빵’으로 옮겼습니다.
- source_word: אַל תִּתֵּן לוֹ
  english_pob_choice: Do not give him
  chosen_korean: 주지 마십시오
  alternatives_korean:
  - 주어서는 안 됩니다
  - 주지 말라
  lexicon: HALOT
  rationale: 직설적인 금지문이므로 현대 표준어 합쇼체의 자연스러운 금지 표현으로 옮겼습니다.
- source_word: בָם
  english_pob_choice: by it
  chosen_korean: 그것으로
  alternatives_korean:
  - 그것들로
  - 그것들 때문에
  lexicon: HALOT
  rationale: 히브리어 대명사의 복수성은 원문 난점이지만, 본절의 핵심 기능은 수단/매개를 나타내는 말이므로 한국어에서는 문맥상 단수 지시로 매끈하게 처리했습니다.
- source_word: יַקְבִּיל אֵלֶיךָ
  english_pob_choice: he set himself against you
  chosen_korean: 그가 당신을 압도하지 못하게 하려는 것입니다
  alternatives_korean:
  - 그가 당신에게 맞서지 못하게 하려는 것입니다
  - 그가 당신을 지배하지 못하게 하려는 것입니다
  lexicon: HALOT
  rationale: 히브리어 동사는 ‘맞서다/대적하다’의 방향성을 가지며, 그리스어의 δυναστεύσῃ가 덧붙이는 ‘압도하다/지배하다’의 강한 뉘앙스를 반영해 결과를 풀어 옮겼습니다.
theological_decisions:
- issue: 히브리어의 난해한 마지막 절과 그리스어 병행문의 관계
  chosen_reading: 히브리어 본문을 기본으로 하되, 병행 그리스어가 드러내는 ‘상대에게 해를 당하지 않도록 조심하라’는 경고의 힘을 한국어 본문에 반영했습니다.
  alternative_readings:
  - 더 직역적으로는 ‘그것들로 그가 당신에게 맞서게 되지 않게 하려는 것입니다’
  - 그리스어 쪽을 더 따라 ‘그가 당신을 지배하지 못하게 하려는 것입니다’
  rationale: 시락서는 현존 히브리어와 그리스어 병행이 모두 중요한데, 본절은 히브리어가 매끄럽지 않아 그리스어가 의미 결정을 도와줍니다. 다만 히브리어의 경고 구조는 유지해야 하므로 ‘압도하다’로 의미 강도를 보존했습니다.
  doctrine_reference: 'PHILOSOPHY.md: 히브리어가 남아 있으면 히브리어를 기본으로 번역하되, 병행 그리스어를 실제 번역 입력으로 사용한다.'
