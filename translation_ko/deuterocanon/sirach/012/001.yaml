  text: If you do good, know to whom you do good, and there will be hope for your kindness.
  footnotes:
  - marker: a
    text: 'Or, following the Greek more explicitly: ''and there will be thanks for your good deeds.'' The Hebrew could also be understood as ''there will be hope for your welfare.'''
    reason: alternative_reading
translation:
  language: ko
  text: 선을 행하면, 누구에게 선을 행하는지 알아 두십시오. 그러면 네 선행에는 희망이 있을 것입니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어를 더 직접적으로 따르면 ‘네 선행들에 감사가 있을 것입니다’로도 옮길 수 있습니다. 히브리어는 ‘네 유익(복리)을 위한 희망이 있을 것입니다’로도 이해될 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אִם / ἐὰν
  english_pob_choice: If
  chosen_korean: 네가 ... 하면
  alternatives_korean:
  - 만일 ... 한다면
  - 만약 ... 하면
  lexicon: HALOT; LSJ
  rationale: 히브리어·그리스어 모두 조건절이므로, 자연스러운 합쇼체 조건 표현으로 옮겨 조건의 의미를 분명히 했습니다.
- source_word: תֵּטִיב / εὖ ποιῇς
  english_pob_choice: you do good
  chosen_korean: 선을 행하면
  alternatives_korean:
  - 좋게 행하면
  - 좋은 일을 하면
  lexicon: HALOT; LSJ
  rationale: 히브리어 היטיב과 그리스어 εὖ ποιῇς는 단순히 '기분 좋게'가 아니라 선행을 뜻하므로, 한국어에서는 관용적으로 '선을 행하다'를 택했습니다.
- source_word: לְמִי תֵטִיב / γνῶθι τίνι ποιεῖς
  english_pob_choice: know to whom you do good
  chosen_korean: 네가 누구에게 선을 행하는지 알아 두어야 하며
  alternatives_korean:
  - 누구에게 선을 행하는지 알아야 하며
  - 누구에게 좋은 일을 하는지 알아 두어야 하며
  lexicon: HALOT; LSJ
  rationale: 직역의 '알라'보다 문맥상 숙고를 강조하는 '알아 두어야 하며'가 지혜문학의 권고체를 자연스럽게 살립니다.
- source_word: וִיהִי תִקְוָה לְטוֹבָתָךְ / καὶ ἔσται χάρις τοῖς ἀγαθοῖς σου
  english_pob_choice: there will be hope for your kindness
  chosen_korean: 네 선행에 대한 희망이 있을 것입니다
  alternatives_korean:
  - 네 선행에 대한 감사가 있을 것입니다
  - 네 유익에 대한 희망이 있을 것입니다
  lexicon: HALOT; LSJ
  rationale: 히브리어는 '네 טוב/유익' 쪽, 그리스어는 '네 좋은 행위들에 대한 χάρις(은혜/감사)' 쪽으로 갈릴 수 있어, 본문은 해석을 과도하게 좁히지 않도록 '희망'을 유지했습니다.
theological_decisions:
- issue: 마지막 절의 תִקְוָה/χάρις의 의미 범위
  chosen_reading: 본문은 선행의 결과를 '희망'으로 남겨 두어, 보상인지 감사인지 혹은 선행으로 인한 유익인지 단정하지 않습니다.
  alternative_readings:
  - 감사가 있을 것입니다
  - 유익이 있을 것입니다
  - 보상이 있을 것입니다
  rationale: 히브리어와 그리스어 병행이 완전히 같지 않으므로, 전통적 교리적 매듭을 짓기보다 원문이 허용하는 긴장을 보존하는 것이 더 충실합니다.
  doctrine_reference: 지혜문학의 보응/반응 표현은 단선적 보상론으로 환원하지 않고, 본문이 열어 두는 의미 범위를 보존합니다.
