base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/012/016.yaml
  text: Who will pity a snake charmer who is bitten[b][a], or anyone who goes near a beast of prey?
  footnotes:
  - marker: a
    text: Hebrew 'a beast of tooth/teeth,' meaning a dangerous predatory animal.
    reason: lexical_alternative
  - marker: b
    text: The Greek parallel in Swete differs substantially at this point, reading about an enemy who speaks sweetly with his lips while plotting violence in his heart. Because Hebrew survives for this verse and is the primary witness for extant Hebrew Sirach, the main text follows the Hebrew here.
    reason: textual_variant
translation:
  language: ko
  text: 뱀을 부리는 사람이 물린 것이나 맹수 가까이 가는 사람을 누가 불쌍히 여기겠습니까?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 חַיַּת שֵׁן은 문자적으로 ‘이빨의 짐승’이며, 위험한 포식 동물을 가리키는 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어 병행본문은 이 대목을 상당히 다르게 전하며, 입술로는 감언이설을 하면서 마음속으로는 해칠 일을 꾀하는 원수를 묘사합니다. 이 절에는 히브리어 본문이 남아 있으므로, 본문은 히브리어를 따릅니다.
    reason: textual_variant
lexical_decisions:
- source_word: מִי יוּחַן
  english_pob_choice: Who will pity
  chosen_korean: 누가 … 불쌍히 여기겠으며
  alternatives_korean:
  - 누가 … 가엾게 여기겠으며
  - 누가 … 자비를 베풀겠으며
  lexicon: HALOT
  rationale: 수사적 질문으로서 ‘누가’가 자연스럽고, חנן의 ‘불쌍히 여기다/은혜를 베풀다’ 중 이 문맥의 예기된 반응을 가장 직접적으로 드러내는 표현을 택했습니다.
- source_word: חוֹבֵר
  english_pob_choice: snake charmer
  chosen_korean: 뱀을 다루는 사람
  alternatives_korean:
  - 주술로 뱀을 부리는 사람
  - 뱀 주술사
  lexicon: HALOT
  rationale: 본문의 חוֹבֵר는 뱀을 다루는 자를 가리키며, 직역적 직함보다 한국어에서 의미가 분명한 설명형 표현으로 옮겼습니다.
- source_word: נָשׁוּךְ
  english_pob_choice: who is bitten
  chosen_korean: 물리면
  alternatives_korean:
  - 물린 자를
  - 물린 경우
  lexicon: HALOT
  rationale: 피동 분사적 의미를 한국어 조건절로 자연스럽게 살려, 이미 예상된 위험 결과를 간결하게 표현했습니다.
- source_word: חַיַּת שֵׁן
  english_pob_choice: a beast of prey
  chosen_korean: 맹수
  alternatives_korean:
  - 이빨 있는 짐승
  - 이빨 달린 짐승
  - 사나운 짐승
  lexicon: HALOT
  rationale: 직역하면 ‘이빨의 짐승’이지만, 관용적으로 위험한 포식 동물을 뜻하므로 ‘맹수’가 의미를 가장 잘 전달합니다.
