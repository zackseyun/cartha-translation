translation:
  language: ko
  text: 의인에게 선을 베푸십시오. 그러면 보답을 얻게 될 것입니다. 그에게서가 아니라면 야훼에게서 받을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 ‘그에게서가 아니라면 지극히 높으신 분에게서’라고 읽습니다. 현존 히브리어 증거는 ‘야훼에게서’라고 읽습니다.
    reason: textual_variant
lexical_decisions:
- source_word: הֵיטִב
  english_pob_choice: Do good
  chosen_korean: 선한 일을 하십시오
  alternatives_korean:
  - 좋게 대하십시오
  - 선을 베푸십시오
  - 도움을 베푸십시오
  lexicon: HALOT
  rationale: 히필 명령형은 적극적인 호의를 요구하므로, 단순한 상태 묘사보다 행위 중심의 ‘선한 일을 하십시오’가 원문의 촉구를 가장 자연스럽게 살립니다.
- source_word: לַצַּדִּיק
  english_pob_choice: to the righteous
  chosen_korean: 의인에게
  alternatives_korean:
  - 의로운 사람에게
  - 경건한 사람에게
  - 옳은 사람에게
  lexicon: HALOT
  rationale: 히브리어의 צַדִּיק은 윤리적으로 올바른 사람을 가리키므로, 표준 성서 용례에 맞는 ‘의인’이 가장 직접적입니다.
- source_word: תִּמְצָא תַשְׁלוּמַת
  english_pob_choice: you will find repayment
  chosen_korean: 보답을 찾게 되실 것입니다
  alternatives_korean:
  - 보상을 받게 되실 것입니다
  - 갚음을 얻게 되실 것입니다
  - 보답을 얻게 되실 것입니다
  lexicon: HALOT
  rationale: ‘찾다’의 관용을 살리되 한국어에서 결과 의미가 분명하도록 ‘찾게 되실 것입니다’로 옮겼습니다. תַשְׁלוּמַת은 상호적 ‘보답/갚음’의 뜻이 있어 ‘보답’이 가장 균형적입니다.
- source_word: מֵיְהֹוָה
  english_pob_choice: from Yahweh
  chosen_korean: 야훼에게서
  alternatives_korean:
  - 여호와에게서
  - 주님에게서
  - 하나님에게서
  lexicon: HALOT
  rationale: 히브리어 본문에 있는 신명은 프로젝트 기본값에 따라 ‘야훼’로 옮기고, 전치사 מִן의 출처 의미를 한국어 조사 ‘에게서’로 자연스럽게 반영했습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행본문의 마지막 신적 호칭 차이
  chosen_reading: 본문은 야훼에게서로 두고, 그리스어의 ‘지존자에게서’는 본문에 합치하지 않는 변이로 봅니다.
  alternative_readings:
  - 지존자에게서
  - 가장 높으신 분에게서
  rationale: 이 절의 현존 히브리어 증거는 מֵיְהֹוָה를 지지하므로, 본문은 히브리어를 따르고 그리스어는 주해상 변이로 유지하는 것이 원문 우선 원칙에 부합합니다.
  doctrine_reference: 'DOCTRINE.md: 원문 우선 원칙; YHWH → 야훼 표기 기본값'
- issue: 성수 관계의 주어가 단수 남성형으로 나타남
  chosen_reading: 그에게서
  alternative_readings:
  - 그 사람에게서
  - 그들에게서
  rationale: 히브리어 מִמֶּנוּ와 그리스어 αὐτοῦ는 모두 단수 남성 지시를 가지므로, 이를 평탄화하지 않고 단수 관계로 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: 문법적 수-성 일치 보존'
