translation:
  language: ko
  text: 그가 당신의 말을 듣고 조용히 행동하더라도, 그를 두려워하는 마음을 가지십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 병행본은 ‘스스로를 지키고 그에게서 멀리하라’고 하여, 현존 히브리어 본문보다 자기보호의 경고를 더 분명하게 합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ישמע לך
  english_pob_choice: listens to you
  chosen_korean: 당신의 말을 듣다
  alternatives_korean:
  - 당신에게 순종하다
  - 당신의 말을 귀담아듣다
  lexicon: HALOT
  rationale: שמע + ל의 기본 뜻을 살려 ‘듣다’로 옮기되, 복종을 단정하는 표현은 피했습니다.
- source_word: וִיהַלֵּךְ בְּנַחַת
  english_pob_choice: walks gently
  chosen_korean: 온순하게 걸어가다
  alternatives_korean:
  - 조용히 걸어가다
  - 겸손하게 걷다
  lexicon: HALOT
  rationale: ‘가다/걷다’의 동작과 함께 בְּנַחַת의 차분하고 얌전한 태도를 한국어로 자연스럽게 살렸습니다.
- source_word: תֵּן לִבְּךָ
  english_pob_choice: give your heart
  chosen_korean: 마음을 가지십시오
  alternatives_korean:
  - 마음을 두십시오
  - 마음을 기울이십시오
  lexicon: HALOT
  rationale: 직역의 ‘마음을 주다’는 한국어에서 어색하므로, 관용적이면서도 주의 집중의 요구를 드러내는 표현으로 옮겼습니다.
- source_word: לְהִתְיָרֵא מִמֶּנּוּ
  english_pob_choice: be afraid of him
  chosen_korean: 두려워할 마음을 가지십시오
  alternatives_korean:
  - 그를 두려워하십시오
  - 그를 무서워하십시오
  lexicon: HALOT
  rationale: 히브리어 ירא의 핵심은 단순 경계가 아니라 두려움이므로, 주의해야 한다는 해석을 덧씌우지 않고 감정의 뉘앙스를 보존했습니다.
theological_decisions:
- issue: Greek parallel versus Hebrew base text
  chosen_reading: 본문은 히브리어의 ‘그를 두려워하다’에 따라 번역하고, 그리스어 병행본의 ‘자신을 지키다’ 의미는 본문에 흡수하지 않았습니다.
  alternative_readings:
  - 그를 경계하십시오
  - 그에게서 자신을 지키십시오
  rationale: POB 영어본의 최신 조정도 히브리어 ירא를 복원하는 방향이었으므로, 그리스어의 추가적인 자기보호 뉘앙스는 각주로 처리하는 것이 적절합니다.
  doctrine_reference: 본문 우선 원칙 / 번역 본문과 병행본문 구분
- issue: Fear language retention
  chosen_reading: ‘두려워할 마음을 가지십시오’로 פחד/ירא 계열의 두려움 표현을 직접 보존했습니다.
  alternative_readings:
  - 경계하십시오
  - 조심하십시오
  rationale: 지혜문학의 경고 강도를 약화시키지 않기 위해, 실천적 주의보다 정서적 두려움 표현을 유지했습니다.
  doctrine_reference: 잠언적 경고의 수사 유지
