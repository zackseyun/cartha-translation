translation:
  language: ko
  text: 그 뒤에야 너는 내 말을 깨닫고, 내 누이 때문에 한숨을 내쉬게 될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 여기서 난해하며, ‘내 누이 때문에’라는 표현을 그대로 보존했습니다. 그리스어 전승은 ‘그가 너와 함께 한 시간 동안 머물 것이며, 네가 돌아서더라도 견디지 못할 것이다’로 읽어 상당히 다른 본문을 보여 줍니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וּלְאָחוֹר
  english_pob_choice: Afterward
  chosen_korean: 그 뒤에야
  alternatives_korean:
  - 후에
  - 나중에
  - 그 후에
  lexicon: HALOT
  rationale: 시간의 뒤늦음을 자연스럽게 살리면서도, 앞뒤 문맥에서 ‘그때가 되어서야’라는 뉘앙스를 분명히 나타냅니다.
- source_word: תַּשִּׂיג אֲמָרַי
  english_pob_choice: you will understand my words
  chosen_korean: 내 말을 깨닫고
  alternatives_korean:
  - 내 말을 이해하고
  - 내 말에 이르고
  - 내 말을 깨닫게 되고
  lexicon: HALOT
  rationale: 직역상 ‘도달하다/붙잡다’의 뜻이지만, 목적어가 ‘말’이므로 한국어에서는 ‘깨닫다’가 지연된 인식을 가장 자연스럽게 옮깁니다.
- source_word: וּלְאַחְוָתִי
  english_pob_choice: for my sister
  chosen_korean: 내 누이 때문에
  alternatives_korean:
  - 내 누이를 위하여
  - 내 누이 때문에
  - 내 자매 때문에
  lexicon: HALOT
  rationale: 히브리어 전승을 따라 ‘누이/자매’ 요소를 보존하되, 이 절이 서사적으로 어색하므로 원문의 난점을 유지하는 쪽으로 옮겼습니다.
- source_word: תִּתְאַנָּח
  english_pob_choice: you will sigh
  chosen_korean: 한숨을 내쉬게 될 것입니다
  alternatives_korean:
  - 탄식하게 될 것입니다
  - 한숨 쉬게 될 것입니다
  - 신음하게 될 것입니다
  lexicon: HALOT
  rationale: 동사의 기본 의미인 ‘탄식/신음/한숨’을 현대 한국어에서 과장 없이 전달합니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행본문의 큰 차이
  chosen_reading: 본문은 남아 있는 히브리어를 따르되, 뜻이 분명하지 않은 구절은 한국어에서도 난점을 드러내는 방식으로 유지했습니다.
  alternative_readings:
  - 그리스어를 따라 ‘너와 함께 한 시간 동안 머물며, 네가 돌아서도 견디지 못할 것이다’로 옮김
  rationale: 집회서에서는 보존된 히브리어를 우선하되, 본문 차이가 큰 경우 대체 전승을 숨기지 않는 것이 투명성에 부합합니다.
  doctrine_reference: 'PHILOSOPHY.md: 보존된 히브리어 우선, 그리스어 병행본문은 주석적 대안으로 반영'
