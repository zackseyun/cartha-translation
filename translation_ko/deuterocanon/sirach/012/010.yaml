  source_fidelity: ‘쇠붙이’는 נחשת/χαλκός가 가리키는 특정 금속(청동·구리 계열)을 지나치게 넓게 일반화합니다. 본문의 비유는 청동의 부식과 적대자의 악을 직접 병치하므로 ‘청동’으로 옮기는 것이 더 정확합니다. ‘원수’, ‘영원히’, ‘그의 악’ 및 명령형의 기본 뜻은 잘 반영되어 있습니다.
  naturalness: ‘청동이 녹스는 것처럼, 그의 악도 그러합니다’는 현대 표준어 합쇼체 문맥에서 자연스럽고, 짧은 지혜 경구의 대구 구조를 유지합니다.
  terminology: ‘원수’는 적대자를, ‘악’은 רֹעוֹ/πονηρία의 넓은 악성·해악을 적절히 보존합니다. נחשת/χαλκός에는 ‘청동’이 ‘쇠붙이’보다 정확합니다.
