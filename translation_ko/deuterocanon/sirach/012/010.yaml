    rationale: ‘원수’ 설명 각주는 해당 낱말에 붙이는 편이 명확합니다. 금속 부식 이미지 자체는 번역문에 충분히 드러나므로, 진행성이라는 해석적 주석은 필수적이지 않습니다.
