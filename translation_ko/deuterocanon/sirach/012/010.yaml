    reason: lexical_alternative
  - marker: b
    text: 히브리어와 헬라어는 금속의 ‘녹/부식’ 이미지를 사용해 악의 진행성을 비유합니다.
    reason: source_note
lexical_decisions:
- source_word: אַל תַּאֲמִין / μὴ πιστεύσῃς
  english_pob_choice: Do not trust
  chosen_korean: 믿지 마십시오
  alternatives_korean:
  - 신뢰하지 마십시오
  - 믿어서는 안 됩니다
  lexicon: אמן / πιστεύω
  rationale: 경구형 경고문이므로 직접명령의 부정형으로 자연스럽게 옮기되, 관계적 신뢰의 의미를 살려 ‘믿다’를 기본으로 삼았습니다.
- source_word: בְּשׂוֹנֵא / τῷ ἐχθρῷ σου
  english_pob_choice: an enemy
  chosen_korean: 원수
  alternatives_korean:
  - 적
  - 원수이신 사람
  lexicon: שׂנא / ἐχθρός
  rationale: 지혜문맥에서 단순한 ‘적’보다 더 강한 대립과 적대성을 드러내는 ‘원수’가 원문과 영어의 긴장을 잘 보존합니다.
- source_word: לָעַד / εἰς τὸν αἰῶνα
  english_pob_choice: forever
  chosen_korean: 영원히
  alternatives_korean:
  - 끝까지
  - 항상
  lexicon: לעד / εἰς τὸν αἰῶνα
  rationale: 시간적 범위를 절대화하는 표현이므로 ‘영원히’가 가장 직접적입니다.
- source_word: כִּי כִנְחֹשֶׁת רֹעוֹ יַחֲלִיא / ὡς γὰρ ὁ χαλκὸς ἰοῦται
  english_pob_choice: for as bronze rusts
  chosen_korean: 쇠붙이가 녹스는 것처럼
  alternatives_korean:
  - 청동이 녹스는 것처럼
  - 놋쇠가 녹스는 것처럼
  lexicon: נחשת / χαλκός
  rationale: 히브리어/헬라어의 금속 이미지를 한국어에서 자연스럽게 전달하되, POB의 ‘bronze rusts’ 취지를 살려 부식·녹 발생의 비유로 옮겼습니다.
- source_word: רֹעוֹ / ἡ πονηρία αὐτοῦ
  english_pob_choice: his evil
  chosen_korean: 그의 악
  alternatives_korean:
  - 그의 악함
  - 그의 악한 성품
  lexicon: רַע / πονηρία
  rationale: 행위와 성향을 함께 아우르는 추상명사로 처리해, 원문의 일반적 악성 및 해악성을 그대로 드러냈습니다.
theological_decisions:
- issue: 지혜문학의 보편적 경고를 개인적 미움 조장으로 좁히지 않을지
  chosen_reading: 이 구절은 ‘원수를 미워하라’는 명령이 아니라, 적대자에 대한 무분별한 신뢰를 경계하는 실천적 지혜로 읽었습니다.
  alternative_readings:
  - 도덕적 절대 명령으로 읽기
  - 관계 회복 가능성을 배제하는 선언으로 읽기
  rationale: 문맥상 인간관계의 분별을 가르치는 잠언형 진술이므로, 과도한 신학화 없이 경구의 기능을 유지했습니다.
  doctrine_reference: 지혜문학의 잠언적 권고, 인간관계 분별
