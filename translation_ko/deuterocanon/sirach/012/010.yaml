    rationale: 히브리어 נחשת와 그리스어 χαλκός는 여기서 청동(전통적으로 ‘놋’)의 부식 이미지를 가리킵니다. 일반적인 철 금속을 뜻할 수 있는 ‘쇠붙이’는 원문의 구체성을 잃고, 특히 ‘녹’의 한국어 연상도 철에 치우치게 합니다.
  - severity: low
