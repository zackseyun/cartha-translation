translation:
  language: ko
  text: 이는 하나님께서도 악인들을 미워하시고, 악한 자들에게 보복하실 것이기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 “하나님도 악인들을 미워하신다”로 읽고, 그리스어는 “지존자께서 죄인들을 미워하셨다”로 읽습니다. 본문은 히브리어의 신적 호칭을 따랐습니다.
    reason: textual_variant
  - marker: b
    text: 그리스어는 “경건하지 않은 자들”을 뜻하는 말을 사용하지만, 히브리어는 “악한 자들”이라고 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵל / ὁ ὕψιστος
  english_pob_choice: the Most High
  chosen_korean: 지존자
  alternatives_korean:
  - 하나님
  - 가장 높으신 분
  lexicon: HALOT / BDAG
  rationale: 히브리어 אֵל과 그리스어 ὁ ὕψιστος 사이의 차이를 그대로 드러내기 위해, 본문에서 일반적인 '하나님'보다 더 직역적인 지존자라는 호칭을 택했습니다.
- source_word: שֹׂנֵא / ἐμίσησεν
  english_pob_choice: hates
  chosen_korean: 미워하시고
  alternatives_korean:
  - 미워하십니다
  - 싫어하시고
  lexicon: HALOT
  rationale: 동사의 강한 적대·혐오 의미를 약화하지 않기 위해 '미워하시다'로 옮겼습니다. 문맥상 일반 진술이므로 현대 한국어에서는 자연스럽게 연결형으로 처리했습니다.
- source_word: רָעִים
  english_pob_choice: evildoers
  chosen_korean: 악인들
  alternatives_korean:
  - 악을 행하는 사람들
  - 행악자들
  lexicon: HALOT
  rationale: 행위 중심의 악함을 가리키므로 '악인들'이 간결하면서도 원문의 도덕적 성격을 잘 살립니다.
- source_word: לָרְשָׁעִים / τοῖς ἀσεβέσιν
  english_pob_choice: the wicked
  chosen_korean: 악한 자들
  alternatives_korean:
  - 악인들
  - 경건하지 않은 자들
  lexicon: HALOT / BDAG
  rationale: 히브리어의 '악인'과 구별되도록, 그리스어 ἀσεβέσιν의 경건 없음까지 포괄하는 표현으로 '악한 자들'을 택했습니다.
- source_word: יָשִׁיב / ἀποδώσει
  english_pob_choice: will repay
  chosen_korean: 되갚으실
  alternatives_korean:
  - 보응하실
  - 갚으실
  lexicon: HALOT / BDAG
  rationale: 심판적 상환의 뉘앙스를 유지하면서 한국어에서도 자연스럽고 힘 있는 표현을 위해 '되갚다'를 사용했습니다.
- source_word: נָקָם / ἐκδίκησιν
  english_pob_choice: vengeance
  chosen_korean: 보복
  alternatives_korean:
  - 복수
  - 응징
  lexicon: HALOT / BDAG
  rationale: '''vengeance''의 강한 보복성은 유지하되, 현대 한국어에서 본문 흐름에 가장 자연스러운 명사로 ''보복''을 선택했습니다.'
theological_decisions:
- issue: 신적 호칭을 히브리어 'God'이 아닌 그리스어 'the Most High' 쪽으로 반영할지 여부
  chosen_reading: 지존자
  alternative_readings:
  - 하나님
  - 가장 높으신 분
  rationale: 본문이 히브리어와 그리스어 사이에 현저한 불일치를 보이므로, 더 특수한 호칭인 '지존자'로 옮겨 두 전승의 긴장을 모두 보존했습니다.
  doctrine_reference: 원문 우선 원칙과 텍스트 비평의 투명성
- issue: 마지막 절의 'vengeance'를 개인적 복수처럼 들릴 수 있는 '복수'로 둘지, 심판적 보응으로 둘지 여부
  chosen_reading: 보복
  alternative_readings:
  - 복수
  - 응징
  rationale: 문맥상 인간의 사적 복수가 아니라 하나님/지존자의 न्याय적 보응을 말하므로, 과도하게 사사로운 뉘앙스의 '복수'보다는 '보복'이 더 적절합니다.
  doctrine_reference: 하나님의 공의와 심판의 어휘 구별
- issue: 왜냐하면/…때문입니다의 인과 구조를 문두에 분명히 드러낼지 여부
  chosen_reading: 왜냐하면 … 때문입니다
  alternative_readings:
  - 이는 …이기 때문입니다
  - …하니
  rationale: 히브리어 כִּי와 그리스어 ὅτι의 인과를 한국어에서 가장 분명하고 읽기 쉽게 나타내기 위해, 문두 인과 접속을 사용했습니다.
  doctrine_reference: 문장 구조의 투명성
