  text: For God also hates evildoers[b][a], and will repay the wicked with vengeance.
  footnotes:
  - marker: a
    text: 'Hebrew: ''God also hates evildoers''; Greek: ''the Most High hated sinners.'' The main text follows the Greek divine title while keeping the Hebrew sense in view.'
