base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/012/007.yaml
  text: Give to the good[a], and withhold from the evil; honor the poor, and do not give to a stranger.[b]
  footnotes:
  - marker: a
    text: Hebrew literally, 'withhold from evil' or possibly 'from an evil person'; the Greek parallel reads 'do not support the sinner,' which guides the main text here.
    reason: alternative_reading
  - marker: b
    text: Or 'to an outsider' or 'to a foreigner.' The Hebrew term can refer broadly to one outside the community or proper circle.
    reason: lexical_alternative
translation:
  language: ko
  text: 좋은 사람에게 주고, 악한 자에게서는 거두십시오. 가난한 사람을 존중하고, 낯선 사람에게는 주지 마십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘악으로부터 거두다’ 또는 ‘악한 사람에게서 거두다’로도 읽을 수 있습니다. 그리스어 평행본은 ‘죄인’을 돕지 말라고 하여, 본문은 여기에서 사람을 가리키는 것으로 이해하는 것이 자연스럽습니다.
    reason: alternative_reading
  - marker: b
    text: ‘낯선 사람’은 외인, 외부인, 또는 이방인을 넓게 가리킬 수 있습니다. 본문은 여기서 공동체 밖의 사람을 폭넓게 지칭합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵּן לַטּוֹב
  english_pob_choice: Give to the good
  chosen_korean: 좋은 사람에게 주고
  alternatives_korean:
  - 선한 사람에게 주고
  - 좋은 이에게 주고
  lexicon: HALOT
  rationale: 히브리어의 짧은 윤리 범주를 살리되, 한국어에서는 명사구보다 사람을 뜻하는 표현이 자연스러워 ‘좋은 사람’으로 옮겼습니다.
- source_word: וּמְנַע מֵרָע
  english_pob_choice: withhold from the evil
  chosen_korean: 악한 자에게서는 거두십시오
  alternatives_korean:
  - 악에서 거두십시오
  - 악인에게서 거두십시오
  - 악한 사람을 돕지 마십시오
  lexicon: HALOT
  rationale: מנע는 ‘거두다/막다/보류하다’의 뜻이므로 단순히 금지문으로 풀기보다 ‘거두십시오’로 옮겼고, מֵרָע는 본문과 평행의 그리스어를 함께 고려해 인격화된 ‘악한 자’로 이해했습니다.
- source_word: הֹקֵיר מָךְ
  english_pob_choice: honor the poor
  chosen_korean: 가난한 사람을 존중하고
  alternatives_korean:
  - 가난한 이를 공경하고
  - 가난한 이를 귀하게 여기고
  lexicon: HALOT
  rationale: הֹקֵיר는 ‘귀하게 여기다, 존중하다’의 뉘앙스가 있어 전통적 예배 용어인 ‘공경하다’보다 일상적이면서도 품위 있는 ‘존중하다’가 적절합니다.
- source_word: וְאַל תִּתֵּן לְזֵר
  english_pob_choice: do not give to a stranger
  chosen_korean: 낯선 사람에게는 주지 마십시오
  alternatives_korean:
  - 외인에게는 주지 마십시오
  - 외부 사람에게는 주지 마십시오
  - 타인에게는 주지 마십시오
  lexicon: HALOT
  rationale: זֵר는 공동체 밖의 사람, 낯선 사람, 외인을 가리킬 수 있으므로, 혈통이나 국적을 과도하게 좁히지 않는 ‘낯선 사람’으로 옮겼습니다.
theological_decisions:
- issue: 첫 행의 ‘악’ 관련 표현을 추상적 악으로 볼지, 악한 사람으로 볼지
  chosen_reading: ‘악한 자에게서는 거두십시오’로 번역해 행위보다 사람을 가리키는 윤리적 대비를 드러냈습니다.
  alternative_readings:
  - 악에서 거두십시오
  - 악을 피하십시오
  rationale: 히브리어는 문자적으로 ‘악으로부터’일 수 있지만, 이 절의 대조 구조가 ‘좋은 사람’과 ‘낯선 사람’처럼 사람 중심이므로, 그리스어 평행본을 참고해 인격적 대상을 드러내는 번역을 택했습니다.
  doctrine_reference: 원문 우선 원칙과 평행본문 참조; 해석이 필요한 곳은 본문보다 번역에서 과도하게 약화하지 않음.
