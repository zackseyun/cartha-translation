base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/012/012.yaml
  text: Be to him like one who reveals a secret[a], and he will not find a way to ruin you[b]; and know the outcome of jealousy.
  footnotes:
  - marker: a
    text: Or 'like one uncovering a secret.' The image likely means to treat such a person with caution, as one would someone who exposes confidential matters.
    reason: lexical_alternative
  - marker: b
    text: Or 'know the outcome of envy.' Hebrew 'the end of jealousy/envy'; the Greek parallel expands the warning and makes the eventual consequence more explicit.
    reason: alternative_reading
translation:
  language: ko
  text: 그를 비밀을 드러내는 사람처럼 대하십시오[a]. 그러면 그는 당신을 망하게 할 방법을 찾지 못할 것입니다. 질투의 결과를 아십시오[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘비밀을 밝혀내는 사람처럼’. 이 비유는 그러한 사람을 대할 때 경계하라는 뜻일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘시기의 결말’. 히브리어는 직역하면 ‘질투/시기의 끝’입니다. 그리스어 병행본문은 경고를 더 길게 전개하여, 그 결과가 마침내 드러남을 명시합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הֱיֵה לוֹ
  english_pob_choice: Be to him
  chosen_korean: 그에게는 ... 대하고
  alternatives_korean:
  - 그에게는 ... 되십시오
  - 그에게는 ...처럼 행동하십시오
  lexicon: HALOT
  rationale: 히브리어 היה + לֹו는 단순한 존재 명령이라기보다 ‘그에 대하여 어떤 태도를 취하라’는 뜻이어서, 한국어에서는 ‘대하다’로 옮겨 직접성을 살렸습니다.
- source_word: כִּמְגַלֶּה רָז
  english_pob_choice: like one who reveals a secret
  chosen_korean: 비밀을 드러내는 사람처럼
  alternatives_korean:
  - 비밀을 밝히는 사람처럼
  - 비밀을 폭로하는 사람처럼
  lexicon: HALOT
  rationale: מגלה רז는 ‘비밀/은밀한 것’을 드러내는 사람이라는 비유이므로, 한국어에서도 직설적으로 ‘비밀을 드러내는 사람’이라고 옮겨 경계의 이미지를 유지했습니다.
- source_word: לְהַשְׁחִיתְךָ
  english_pob_choice: to ruin you
  chosen_korean: 당신을 무너뜨릴
  alternatives_korean:
  - 당신을 파괴할
  - 당신을 해칠
  lexicon: HALOT
  rationale: שחת의 Hiphil은 파괴·망침의 폭이 넓지만, 이 문맥에서는 적대적 관계 속의 ‘무너뜨림’이 가장 자연스럽고 과도한 물리적 파멸로 읽히지 않습니다.
- source_word: אַחֲרִית
  english_pob_choice: the outcome
  chosen_korean: 결과
  alternatives_korean:
  - 끝
  - 마지막 결과
  - 결말
  lexicon: HALOT
  rationale: אַחֲרִית는 ‘끝’과 ‘결과/결말’을 함께 가질 수 있으므로, 한국어에서는 문맥상 자연한 ‘결과’로 옮기되 종결적 뉘앙스를 보존했습니다.
- source_word: קִנְאָה
  english_pob_choice: jealousy
  chosen_korean: 질투
  alternatives_korean:
  - 시기
  - 질시
  lexicon: HALOT
  rationale: 이 경구적 문맥에서는 파괴적 관계 감정의 뜻이 강하므로 ‘질투’가 가장 직접적입니다. 전통적 교회어인 ‘시기’도 가능하지만 여기서는 현대어 직해를 택했습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행본문의 차이
  chosen_reading: 현존 히브리어의 간결한 경구를 본문으로 따르고, 그리스어의 확장된 경고는 해석 배경으로만 반영했습니다.
  alternative_readings:
  - 그리스어처럼 상대를 곁에 두지 말고 오른편에 앉히지 말라는 식으로 풀어 옮김
  - 그리스어의 종말 경고를 본문에 적극 반영함
  rationale: 이 절은 히브리어가 살아 있는 본문을 간결하게 제시하며, 그리스어는 그 경고의 의도를 더 노골적으로 풀어줍니다. 한국어 본문은 히브리어의 직설을 유지하되, 독자가 경구적 경고의 강도를 놓치지 않도록 했습니다.
  doctrine_reference: 'Sirach 번역 원칙: 현존 히브리어를 우선하되, 그리스어 평행본문으로 의미 범위를 점검함'
