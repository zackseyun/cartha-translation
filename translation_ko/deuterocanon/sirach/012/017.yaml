translation:
  language: ko
  text: 그와 같이 오만한 사람과 어울리는 자는 그의 죄들 속에 뒹굽니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 증거는 이곳에서 상당히 다릅니다. ‘악이 네게 닥치면, 너는 그가 이미 거기에 있는 것을 발견할 것이며, 그는 도와주는 사람인 듯하면서 네 발꿈치를 걸 것입니다.’라는 뜻입니다. 카이로 겐자에 보존된 히브리어는 오만한 사람과 어울리고 그의 죄들 속에 뒹구는 것에 대해 말합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: כֵּן
  english_pob_choice: So is
  chosen_korean: 그와 같이
  alternatives_korean:
  - 이와 같이
  - 그렇게
  lexicon: HALOT
  rationale: 앞절의 교훈을 이어 받는 비교·적용의 표지이므로, 자연스러운 한국어 관용으로 ‘그와 같이’라고 옮겼습니다.
- source_word: חוֹבֵר אֶל
