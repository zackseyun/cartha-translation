  text: So is one who associates with a man of insolence and rolls about in his sins.[a]
  footnotes:
  - marker: a
    text: 'The Greek witness differs substantially here: ''If evil should meet you, you will find him there before you, and as one helping he will trip up your heel.'' The Hebrew surviving in the Cairo Geniza instead reads about associating with an insolent man and rolling about in his sins.'
    reason: alternative_reading
translation:
  language: ko
  text: 그와 같이 오만한 사람과 어울리는 자는 그 죄들 속에 뒹굽니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 증거는 이곳에서 상당히 다릅니다. ‘악이 네게 닥치면, 너는 그가 이미 거기에 있는 것을 발견할 것이며, 돕는 자처럼 네 발꿈치를 넘어뜨릴 것이다.’라는 뜻입니다. 카이로 겐자에 보존된 히브리어는 오만한 사람과 어울리고 그의 죄들 속에 뒹구는 것에 대해 말합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: כֵּן
  english_pob_choice: So is
  chosen_korean: 그와 같이
  alternatives_korean:
  - 이와 같이
  - 그렇게
  lexicon: HALOT
  rationale: 앞절의 교훈을 이어 받는 비교·적용의 표지이므로, 자연스러운 한국어 관용으로 ‘그와 같이’라고 옮겼습니다.
- source_word: חוֹבֵר אֶל
  english_pob_choice: one who associates with
  chosen_korean: 어울리는 자는
  alternatives_korean:
  - 함께하는 사람은
  - 결합하는 자는
  - 친교하는 자는
  lexicon: HALOT
  rationale: חבר의 결합·교제 의미를 살리되, 현대 한국어에서 도덕적 동반을 드러내는 말로 ‘어울리는’이 가장 간결하고 적절합니다.
- source_word: אִישׁ זָדוֹן
  english_pob_choice: a man of insolence
  chosen_korean: 오만한 사람
  alternatives_korean:
  - 거만한 사람
  - 불손한 사람
  - 오만과 무도함의 사람
  lexicon: HALOT
  rationale: זָדוֹן은 단순한 악함보다 교만하고 방자한 태도를 가리키므로, 이를 ‘오만한’으로 옮겨 도덕적 자세를 드러냈습니다.
- source_word: וּמִתְגֹלֵל
  english_pob_choice: and rolls about
  chosen_korean: 뒹굽니다
  alternatives_korean:
  - 굴러다닙니다
  - 뒤엉킵니다
  - 뒹굴며 삽니다
  lexicon: HALOT
  rationale: 히트파엘의 ‘스스로 굴러감/구르며 구김’ 이미지를 한국어 동사 ‘뒹굽니다’로 살려, 죄에 휘말려 굴러다니는 생생한 감각을 유지했습니다.
- source_word: בַּעֲוֹנֹתָיו
  english_pob_choice: in his sins
  chosen_korean: 그 죄들 속에
  alternatives_korean:
  - 그의 죄들 안에
  - 그의 죄악들 가운데
  - 그의 죄 가운데
  lexicon: HALOT
  rationale: עון은 죄·죄책·악행의 넓은 뜻이지만, 여기서는 죄에 휘말린 상태를 강조하므로 ‘죄들 속에’로 번역해 동사 ‘뒹굽니다’와 연결했습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행본문의 차이
  chosen_reading: 본문은 남아 있는 히브리어를 따라 ‘오만한 사람과 어울리는 자’라는 경구로 옮기고, 그리스어의 다른 경구는 각주로 남깁니다.
  alternative_readings:
  - '그리스어: ‘악이 네게 닥치면, 너는 그가 이미 거기에 있는 것을 발견할 것이며, 돕는 자처럼 네 발꿈치를 넘어뜨릴 것이다.’'
  rationale: 이 절은 히브리어와 그리스어가 내용상 상당히 다르므로, 본문은 현존 히브리어를 우선하고 해석상 큰 차이를 각주로 보존해야 합니다.
  doctrine_reference: Sirach 본문 전승의 복수 증거를 투명하게 반영하는 POB 번역 원칙
