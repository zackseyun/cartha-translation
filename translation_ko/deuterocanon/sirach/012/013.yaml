translation:
  language: ko
  text: 그를 당신 곁에 세우지 마십시오[a]. 그렇지 않으면 그가 당신을 밀쳐 내고 당신 자리에 서게 될 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '그리스어: 「뱀을 다루는 사람이 뱀에게 물렸을 때, 누가 그를 불쌍히 여기겠느냐? 들짐승에게 다가가는 모든 사람을 누가 불쌍히 여기겠느냐?」 이 절의 그리스어 증언은 여기서 히브리어와 상당히 다른 읽기를 보여 줍니다.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תַּעֲמִידֵהוּ
  english_pob_choice: Do not set him beside you
  chosen_korean: 그를 당신 곁에 세우지 마십시오
  alternatives_korean:
  - 그를 당신 곁에 두지 마십시오
  - 그를 당신 곁에 세워 두지 마십시오
  - 그를 당신 옆에 세우지 마십시오
  lexicon: HALOT
  rationale: העמיד의 히필은 ‘세우다, 자리를 잡게 하다’의 뜻이므로, 단순한 ‘두다’보다 ‘세우다’가 원문의 조치성을 더 잘 살립니다.
- source_word: אֶצְלֶךָ
  english_pob_choice: beside you
  chosen_korean: 당신 곁에
  alternatives_korean:
  - 당신 옆에
  - 당신 가까이에
  - 당신 곁으로
  lexicon: HALOT
  rationale: אצל은 근접을 나타내므로, 한국어에서는 자연스럽고 관계적 뉘앙스가 있는 ‘곁에’가 적절합니다.
- source_word: יֶהְדָּפְךָ
  english_pob_choice: he push you aside
  chosen_korean: 그가 당신을 밀쳐 내고
  alternatives_korean:
  - 그가 당신을 밀어내고
  - 그가 당신을 몰아내고
  - 그가 당신을 떠밀어 내고
  lexicon: HALOT
  rationale: הדף는 ‘밀다, 떠밀다, 몰아내다’의 뜻으로, 여기서는 자리에서 밀려나는 의미가 강하므로 ‘밀쳐 내고’가 압축적이고 적절합니다.
- source_word: וְיֲַעמֹד תַּחְתֶּיךָ
  english_pob_choice: and stand in your place
  chosen_korean: 당신 자리에서 서게 될 것입니다
  alternatives_korean:
  - 당신 대신 서게 될 것입니다
  - 당신 자리에 서게 될 것입니다
  - 당신을 대신하여 서게 될 것입니다
  lexicon: HALOT
  rationale: עמד와 תחתיך의 결합은 단순한 ‘서다’가 아니라 남의 자리를 차지하는 뜻을 띠므로, ‘당신 자리에서 서게 될 것입니다’로 직역성을 유지했습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행본의 관계
  chosen_reading: 히브리어 본문을 본문으로 따르고, 그리스어의 매우 다른 읽기는 각주로만 제시합니다.
  alternative_readings:
  - 그리스어를 본문으로 채택하기
  - 그리스어 의미를 본문에 반영해 전면 재구성하기
  rationale: 이 절의 그리스어는 히브리어와 내용이 크게 달라 전승 차이가 분명하므로, 히브리어 본문을 유지하고 그 차이는 각주로 처리하는 것이 사료 충실성에 맞습니다.
  doctrine_reference: 'PHILOSOPHY.md: Sirach는 보존된 히브리어를 우선하고, 그리스어는 대조 자료로 사용'
