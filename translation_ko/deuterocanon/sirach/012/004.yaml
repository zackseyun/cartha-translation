lexical_decisions:
- source_word: פִּי שְׁנַיִם רָעָה תַּשִּׂיג
  english_pob_choice: Give to the godly, and do not support the sinner.
  chosen_korean: “경건한 사람에게 주고 … 죄인을 돕지 마십시오”
  alternatives_korean:
  - “두 배의 재앙이 그를 덮칠 것입니다”
  - “경건한 이에게 베풀고 죄인은 붙들어 주지 마십시오”
  lexicon: εὐσεβεῖ / ἁμαρτωλοῦ
  rationale: 히브리어 본문은 마소라 본문 계열에서 ‘두 배의 재앙’이라는 뜻처럼 보이지만, 영어 POB는 연결된 헬라어 병행구인 ‘경건한 사람에게 주고, 죄인을 돕지 마라’를 채택했습니다. 본 고안은 POB의 확정된 영어 본문을 따라 ‘경건한 사람’과 ‘죄인’을 살리고, 뒤의 동사도 ‘돕지 마십시오’로 의미를 분명히 했습니다.
- source_word: δὸς
  english_pob_choice: Give
  chosen_korean: 주고
  alternatives_korean:
  - 주십시오
  - 베풀고
  lexicon: δίδωμι
  rationale: 명령형의 핵심 뜻은 ‘주다’이므로, 짧고 직접적인 ‘주고’로 옮겨 문장 구조를 자연스럽게 유지했습니다.
- source_word: μὴ ἀντιλάβῃ
  english_pob_choice: do not support
  chosen_korean: 돕지 마십시오
  alternatives_korean:
  - 붙들어 주지 마십시오
  - 지지하지 마십시오
  - 손을 내밀지 마십시오
  lexicon: ἀντιλαμβάνομαι
  rationale: 단순한 감정적 지지가 아니라 실제로 ‘붙들어 주다/도와주다’는 뜻이므로, POB의 ‘support’에 해당하는 한국어로 ‘돕다’를 택했습니다.
theological_decisions:
- issue: 본절의 상이한 전승 처리
  chosen_reading: 영어 POB를 따라 ‘경건한 사람에게 주고, 죄인을 돕지 마십시오’로 옮겼습니다.
  alternative_readings:
  - 히브리어 계열을 따라 ‘두 배의 재앙이 위험 때에 그에게 미치고, 모든 좋은 일에도 그에게 이를 것입니다’
  rationale: 이 절은 히브리어 본문과 그리스어 병행구 사이에 내용 차이가 크므로, 임의로 절충하지 않고 POB의 확정 본문을 따르는 편이 독자에게 더 투명합니다.
  doctrine_reference: 본문 전승 차이와 번역 선택의 투명성
