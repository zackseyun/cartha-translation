  source_fidelity: 그리스어의 병렬 구조와 핵심 어휘를 충실히 반영합니다. πετεινὰ는 ‘새들’, πρὸς τὰ ὅμοια αὐτοῖς는 ‘제 종류와 함께’, καταλύσει는 ‘깃듭니다’로 자연스럽게 옮겼습니다. ἐπανήξει의 ‘되돌아옴’도 유지하여 단순히 ‘온다’로 약화하지 않았습니다.
  naturalness: ‘새들이 제 종류와 함께 깃듭니다’는 속담적 문맥에서 자연스럽고 간결합니다. ‘그리고’는 두 병렬 절의 연결을 명료하게 하며, 전체 문장은 현대 표준어 합쇼체에 맞습니다.
  terminology: ἀλήθεια를 ‘진리’로, ἐργαζομένους αὐτήν을 ‘그것을 행하는 이들’로 번역한 것은 본문의 의인화와 실천적 의미를 모두 보존합니다. 특정 교리적 해석을 덧붙이지 않았습니다.
