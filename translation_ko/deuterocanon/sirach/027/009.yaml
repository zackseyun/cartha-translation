    reason: lexical_alternative
lexical_decisions:
- source_word: πετεινὰ
  english_pob_choice: Birds
  chosen_korean: 새들
  alternatives_korean:
  - 새
  - 날짐승
  lexicon: LSJ
  rationale: 그리스어 중성 복수는 일반적으로 새들을 가리키므로, 현대 한국어에서는 가장 자연스러운 ‘새들’로 옮겼습니다.
- source_word: πρὸς τὰ ὅμοια αὐτοῖς
  english_pob_choice: with their own kind
  chosen_korean: 제 종류와 함께
  alternatives_korean:
  - 자기와 같은 것들과
  - 자기와 같은 종류로
  lexicon: LSJ
  rationale: 비유적 속담의 뜻은 ‘서로 닮은 것끼리 어울린다’는 말이므로, ‘제 종류와 함께’가 의미를 가장 간결하고 자연스럽게 드러냅니다.
- source_word: καταλύσει
  english_pob_choice: settle
  chosen_korean: 깃듭니다
  alternatives_korean:
  - 머뭅니다
  - 자리를 잡습니다
  - 묵습니다
  lexicon: LSJ
  rationale: 새가 내려앉아 머무는 모습을 살리면서도, 속담체의 이미지에 맞게 ‘깃듭니다’를 택했습니다.
- source_word: ἀλήθεια
  english_pob_choice: truth
  chosen_korean: 진리
  alternatives_korean:
  - 진실
  - 참됨
  lexicon: LSJ
  rationale: 이 지혜 문맥에서 ἀλήθεια는 단순 정보의 참됨을 넘어, 삶으로 실천되는 진리의 성격을 띠므로 ‘진리’가 가장 폭넓게 맞습니다.
- source_word: ἐργαζομένους αὐτὴν
  english_pob_choice: those who practice it
  chosen_korean: 그것을 행하는 이들
  alternatives_korean:
  - 그것을 실천하는 이들
  - 그것을 행하는 사람들
  lexicon: LSJ
  rationale: ἐργάζομαι는 대상을 ‘행하다, 실천하다’의 뜻으로 쓸 수 있으므로, 진리를 삶으로 구현한다는 의미를 살려 ‘행하는 이들’로 옮겼습니다.
- source_word: ἐπανήξει
  english_pob_choice: returns
  chosen_korean: 되돌아옵니다
  alternatives_korean:
  - 돌아옵니다
  - 다시 찾아옵니다
  lexicon: LSJ
  rationale: 동사가 단순 동반이 아니라 ‘다시 돌아옴’을 뜻하므로, POB의 인격화된 이미지와 윤리적 상호성을 살려 ‘되돌아옵니다’로 옮겼습니다.
theological_decisions:
- issue: 진리의 인격화와 윤리적 상호성
  chosen_reading: 진리를 실천하는 이들에게 진리가 ‘되돌아오는’ 것으로 표현해, 지혜문학 특유의 도덕적 상응 관계를 유지했습니다.
  alternative_readings:
  - 진리가 그것을 행하는 이들에게 온다
  - 진리가 그것을 행하는 이들과 어울린다
  rationale: ἐπανήξει는 단순한 접촉이나 동반보다 ‘돌아옴’의 뉘앙스를 강하게 가지므로, 본문의 수사적 힘을 살리는 것이 더 적절합니다.
  doctrine_reference: 지혜문학의 보응/상응 원리
