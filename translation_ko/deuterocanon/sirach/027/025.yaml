  text: Whoever throws a stone upward throws it on his own head, and a treacherous blow opens wounds.
translation:
  language: ko
  text: 돌을 높이 던지는 사람은 그것을 자기 머리 위로 던지는 것이고, 속이는 상처는 상처들을 엽니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ βάλλων λίθον εἰς ὕψος
  english_pob_choice: Whoever throws a stone upward
  chosen_korean: 돌을 높이 던지는 사람은
  alternatives_korean:
  - 누구든지 돌을 하늘로 던지는 사람은
  - 돌을 위로 던지는 사람은
  lexicon: βάλλω
  rationale: 행위의 반복·일반성을 살려 관계대명사형으로 옮기고, εἰς ὕψος는 자연스러운 한국어로 ‘높이’라고 풀었습니다.
- source_word: ἐπὶ κεφαλὴν αὐτοῦ βάλλει
  english_pob_choice: throws it on his own head
  chosen_korean: 그것을 자기 머리 위로 던지는 것이고
  alternatives_korean:
  - 그것을 자기 머리에 던지는 것이고
  - 자기 머리 위에 떨어뜨리는 것이고
  lexicon: ἐπί + κεφαλή
  rationale: 직역적 이미지를 유지하되 한국어에서 자연스럽게 이해되도록 ‘자기 머리 위로’로 옮겼습니다.
- source_word: πληγὴ δολία
  english_pob_choice: a treacherous blow
  chosen_korean: 속이는 상처는
  alternatives_korean:
  - 배신하는 타격은
  - 간교한 상처는
  lexicon: πληγή / δόλιος
  rationale: πληγὴ를 ‘상처’로, δολία를 ‘속이는’으로 옮겨 앞뒤의 τραύματα와 어울리게 했습니다. 한국어에서는 ‘상처’가 결과와 타격의 이미지를 함께 담을 수 있습니다.
- source_word: διελεῖ τραύματα
  english_pob_choice: opens wounds
  chosen_korean: 상처들을 엽니다
  alternatives_korean:
  - 상처를 벌립니다
  - 상처들을 찢습니다
  lexicon: διαιρέω
  rationale: PB O B의 ‘opens’를 따라 τραύματα의 복수를 반영해 ‘상처들을’로 옮겼고, ‘엽니다’로 손상과 드러남의 이미지를 살렸습니다.
theological_decisions:
- issue: 잠언적 경구의 직접성 유지
  chosen_reading: 교훈적 경구의 압축된 평행법을 그대로 살려, 설명을 덧붙이지 않고 결과-역전의 이미지를 직설적으로 전달했습니다.
  alternative_readings:
  - 의미를 풀어 ‘스스로 해를 입는다’로 의역
  - 도덕적 교훈을 명시적으로 보강
  rationale: 히브리식 지혜문학의 비유적·경구적 힘은 간결성과 이미지성에 있으므로, 현대 한국어에서도 그 긴장을 유지하는 편이 본문 의도에 가깝습니다.
  doctrine_reference: 지혜문학 일반
- issue: δολία의 윤리적 뉘앙스
  chosen_reading: ‘속이는’으로 번역해 단순한 물리적 충격이 아니라 기만적·배신적 성격을 드러냈습니다.
  alternative_readings:
  - ‘배신하는’으로 번역
  - ‘간교한’으로 번역
  rationale: 문맥상 행위의 도덕적 질감을 유지하되, 과도하게 심리화하지 않는 표현이 적절합니다.
  doctrine_reference: 시락/지혜문학의 교훈적 윤리
