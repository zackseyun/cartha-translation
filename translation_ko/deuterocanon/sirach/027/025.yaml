review_pass:
  verdict: revise
  source_fidelity: 첫 절은 자기 행위가 자기에게 돌아오는 이미지를 잘 포착하지만, ‘자기 머리 위로’는 돌이 머리 위의 공간으로 향한다는 뜻으로도 들려 ἐπὶ κεφαλὴν αὐτοῦ(자기 머리에/자기 머리 위에)의 귀결을 다소 약화합니다. δεύτε 절의 πληγὴ는 ‘상처’라는 결과보다 ‘타격/상해를 입히는 일’에 가깝고, τραύματα가 ‘상처들’입니다.
  naturalness: ‘속이는 상처는 상처들을 엽니다’는 주어와 목적어가 모두 ‘상처’여서 한국어로 부자연스럽고 의미 관계가 불명확합니다. ‘간교한 타격은 상처를 벌립니다’는 경구체를 유지하면서 자연스럽습니다.
  terminology: δολία는 단순히 ‘속이는’보다 ‘간교한’ 또는 ‘기만적인’이 πληγή를 수식하는 원문의 윤리적 성격을 더 정확히 드러냅니다. τραύματα의 복수는 한국어의 총칭 단수 ‘상처’로 자연스럽게 처리할 수 있습니다.
  issues:
  - severity: medium
    issue: πληγὴ δολία를 ‘속이는 상처’로 번역함
    rationale: πληγή는 여기서 상처 자체가 아니라 타격/상해 행위이며, 뒤의 τραύματα와 구별되어야 합니다.
  - severity: medium
    issue: ‘상처들을 엽니다’라는 표현
    rationale: 한국어에서 부자연스러우며, 원문의 상처가 갈라지거나 벌어지는 이미지를 충분히 전달하지 못합니다.
  - severity: low
    issue: ‘자기 머리 위로’의 방향 표현
    rationale: 원문의 ἐπὶ κεφαλὴν은 자기 머리 위에 떨어지도록, 곧 자기 머리에 돌아오는 결과를 말하므로 ‘위에’가 더 직접적입니다.
  revised_text: 돌을 높이 던지는 사람은 그것을 자기 머리 위에 던지는 것이며, 간교한 타격은 상처를 벌립니다.
