  verdict: revise
  source_fidelity: ‘이익 때문에’는 χάριν ἀδιαφόρου의 문맥상 의미를 잘 반영합니다. 다만 원문의 ἀποστρέψει는 미래형이므로 ‘눈을 돌릴 것입니다’가 더 직접적입니다. ‘그것을 늘리려 하는 사람’은 πληθῦναι의 목적어가 앞선 이익임을 드러내려 하나 한국어 문장이 어색하므로 ‘이익을 늘리려는 사람’으로 명시하는 것이 적절합니다.
  naturalness: 현 번역의 ‘누구든 그것을 늘리려 하는 사람은’은 ‘누구든’과 ‘사람’이 중복되고, ‘그것’의 지시 대상도 문장 안에서 다소 불분명합니다. 수정문은 현대 표준 한국어의 격언적 문체와 합쇼체에 자연스럽습니다.
  terminology: ‘이익’과 ‘죄를 짓다’는 적절합니다. ‘눈을 돌리다’는 원문의 눈 이미지와 의도적 외면의 함의를 유지합니다. 그러나 각주 b의 ‘보고도 못 본 척하는’은 원문에 없는 구체적 행위를 보태므로, 눈을 돌리는 대상이 명시되지 않은 원문의 여지를 보존하도록 완화해야 합니다.
