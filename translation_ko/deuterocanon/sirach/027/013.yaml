  alternative_readings:
  - 그저 거슬리는 것이다
  - 그들의 웃음은 지나친 즐거움 속에 있다
  rationale: 지혜문학의 경고는 단순한 사회적 불편이 아니라 죄와 연결된 도덕적 판단입니다. 따라서 μωροί와 ἁμαρτία의 강도를 유지해야 합니다.
  doctrine_reference: 지혜문학의 도덕적 교훈과 죄의 실재에 대한 일반 신학
