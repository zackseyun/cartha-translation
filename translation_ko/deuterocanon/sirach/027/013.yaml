  - 이야기
  - 담화
  - 발언
  lexicon: LSJ
  rationale: 지혜문학의 맥락에서 어리석은 자들의 발화를 자연스럽게 묶어 주는 말로 옮겼습니다. 영어 POB의 'talk'처럼 일상적이면서도 경멸적 뉘앙스를 살립니다.
- source_word: μωρῶν
  english_pob_choice: of fools
  chosen_korean: 어리석은 자들의
  alternatives_korean:
  - 미련한 자들의
  - 우매한 자들의
  lexicon: LSJ
  rationale: 단순 지적 부족보다 도덕적·지혜문학적 무지를 드러내기 위해 '어리석은 자들'을 택했습니다. 'fools'의 통상적 성격을 한국어로 보존합니다.
- source_word: προσόχθισμα
  english_pob_choice: offensive
  chosen_korean: 불쾌한 것
  alternatives_korean:
  - 거슬리는 것
  - 짜증스러운 것
  - 역겨운 것
  - 불만스러운 것
  lexicon: LSJ
  rationale: 이 명사는 상대에게 불쾌감과 혐오감을 주는 대상을 가리키므로, 추상명사화해 '불쾌한 것'으로 옮겼습니다. 단순한 짜증보다 강한 평가를 유지합니다.
- source_word: σπατάλῃ
  english_pob_choice: indulgence
  chosen_korean: 방탕
  alternatives_korean:
  - 사치
  - 사치스런 생활
  - 방종
  - 자기 방임
  lexicon: LSJ
  rationale: σπατάλη의 핵심은 자기 방종과 사치스러운 과잉이므로, 한국어 지혜문학에서 의미 범위가 잘 드러나는 '방탕'을 선택했습니다. 영어 POB의 도덕적 함의를 그대로 받습니다.
- source_word: ἁμαρτίας
  english_pob_choice: of sin
  chosen_korean: 죄의
  alternatives_korean:
  - 죄악의
  - 죄 가운데의
  - 죄스러운
  lexicon: LSJ
  rationale: γενitive를 직접 살려 '죄의'로 연결해, 웃음이 단순한 실수가 아니라 죄에 속한 영역 안에 있음을 드러냈습니다.
theological_decisions:
- issue: 어리석은 자들의 말과 웃음에 대한 도덕적 평가
  chosen_reading: 본문의 평가어를 약화하지 않고, 말은 '불쾌한 것', 웃음은 '죄의 방탕 속'으로 옮겼습니다.
  alternative_readings:
  - 그저 거슬리는 것이다
  - 그들의 웃음은 지나친 즐거움 속에 있다
  rationale: 지혜문학의 경고는 단순한 사회적 불편이 아니라 죄와 연결된 도덕적 판단입니다. 따라서 μωροί와 ἁμαρτία의 강도를 유지해야 합니다.
  doctrine_reference: 지혜문학의 도덕적 교훈과 죄의 실재에 대한 일반 신학
