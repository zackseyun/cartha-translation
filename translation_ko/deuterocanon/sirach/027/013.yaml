base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/027/013.yaml
  text: The talk of fools is offensive[b][a], and their laughter is in the indulgence of sin.
  footnotes:
  - marker: a
    text: Or 'The speech of fools is vexation,' with προσόχθισμα understood more as 'annoyance' or 'vexation.'
    reason: lexical_alternative
  - marker: b
    text: Or 'their laughter is in sinful dissipation'; σπατάλη can suggest self-indulgent excess, luxury, or wanton living.
    reason: lexical_alternative
translation:
  language: ko
  text: 어리석은 자들의 말은 거슬리는 것이며[a], 그들의 웃음은 죄된 방탕 가운데 있습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘어리석은 자들의 말은 짜증스러운 것이다’로 옮길 수 있습니다. προσόχθισμα는 ‘거슬림’, ‘불쾌감’, 또는 ‘짜증’을 일으키는 것을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들의 웃음은 죄악된 사치 속에 있다’로 옮길 수 있습니다. σπατάλη는 사치, 과잉, 자기 방종, 또는 방탕한 생활을 시사할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: διήγησις
  english_pob_choice: talk
  chosen_korean: 말
  alternatives_korean:
