  text: The talk of fools is offensive[b][a], and their laughter is in the indulgence of sin.
  footnotes:
  - marker: a
    text: Or 'The speech of fools is vexation,' with προσόχθισμα understood more as 'annoyance' or 'vexation.'
    reason: lexical_alternative
  - marker: b
    text: Or 'their laughter is in sinful dissipation'; σπατάλη can suggest self-indulgent excess, luxury, or wanton living.
    reason: lexical_alternative
translation:
  language: ko
  text: 어리석은 자들의 말은 불쾌한 것이며, 그들의 웃음은 죄의 방탕 속에 있습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '어리석은 자들의 말은 짜증스러운 것'으로도 옮길 수 있으며, προσόχθισμα는 '거슬림'이나 '불쾌감' 쪽에 더 가깝습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '그들의 웃음은 죄의 사치 속에 있다'로도 옮길 수 있으며, σπατάλη는 사치, 과잉, 방탕한 생활을 시사할 수 있습니다.
    reason: lexical_alternative
