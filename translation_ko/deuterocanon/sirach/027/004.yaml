  yaml_path: translation/deuterocanon/sirach/027/004.yaml
  text: When a sieve is shaken[a], the refuse remains; so a person's filth is revealed in his thoughts.
  footnotes:
  - marker: a
    text: Or 'refuse' or 'rubbish' for 'filth'; the Greek term can denote waste or excrement, and the proverb uses coarse material left behind in sifting as an image for what a person's inner reasoning reveals.
    reason: lexical_alternative
translation:
  language: ko
  text: 체를 흔들면 찌꺼기는 남습니다. 이와 같이 사람의 생각 속에서는 추잡함이 드러납니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원어 κοπρία와 σκύβαλα는 모두 거칠고 불쾌한 물질을 가리킬 수 있어, 문맥에 따라 ‘찌꺼기’, ‘오물’, ‘배설물’ 등으로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν σείσματι κοσκίνου
  english_pob_choice: When a sieve is shaken
  chosen_korean: 체를 흔들면
  alternatives_korean:
  - 체를 흔드는 동안
  - 체를 흔들 때에
  lexicon: LSJ
  rationale: 사물의 동작을 자연스러운 조건절로 옮겨, 속담의 간결한 대응 구조를 살렸습니다.
- source_word: κοπρία
  english_pob_choice: the refuse
  chosen_korean: 찌꺼기
  alternatives_korean:
  - 배설물
  - 쓰레기
  - 오물
  lexicon: LSJ
  rationale: 원어는 거름·분뇨까지 아우를 수 있지만, 체에 남는 비유로서는 현대 한국어에서 가장 자연스럽고 과도하게 생물학적으로 좁히지 않는 표현을 택했습니다.
- source_word: σκύβαλα
  english_pob_choice: filth
  chosen_korean: 추잡함
  alternatives_korean:
  - 오물
  - 찌꺼기
  - 더러움
  lexicon: LSJ
  rationale: 본문의 후반부는 사람의 내적 판단이 밖으로 드러나는 비유이므로, 물질적 ‘찌꺼기’보다 도덕적·미학적 추함을 살리는 표현이 더 적절합니다.
- source_word: ἐν λογισμῷ αὐτοῦ
  english_pob_choice: in his thoughts
  chosen_korean: 생각 속에서는
  alternatives_korean:
  - 생각 가운데서는
  - 이성 안에서는
  - 사고 속에서는
  lexicon: LSJ
  rationale: λογισμός는 단순한 ‘생각’보다 판단·숙고의 영역을 포함하므로, 읽기 쉬운 ‘생각 속’으로 옮기되 내면의 인지 작용을 유지했습니다.
theological_decisions:
- issue: 속담의 도덕적 강도 표현
  chosen_reading: ‘추잡함’으로 옮겨 체질 중 남는 거친 찌꺼기와 사람 내면의 부정함 사이의 연결을 유지했습니다.
  alternative_readings:
  - ‘오물’로 중화
  - ‘더러움’으로 완화
  rationale: 원문은 단순한 불결함이 아니라 내면의 부패가 드러나는 강한 비유를 사용하므로, 이를 약화시키지 않는 방향이 본문 의도에 더 충실합니다.
  doctrine_reference: DOCTRINE.md §Source transparency and strong imagery
