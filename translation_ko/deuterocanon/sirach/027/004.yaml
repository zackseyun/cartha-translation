review_pass:
  verdict: revise
  source_fidelity: 개정이 필요합니다. 원문은 첫 행의 διαμενεῖ(‘남다’)를 둘째 행에 생략하여 이어 주며, σκύβαλα도 기본적으로 ‘찌꺼기/오물’이라는 구체적이고 불쾌한 폐기물의 이미지입니다. 현 번역의 ‘추잡함이 드러납니다’는 도덕적 의미를 해석적으로 강화하고 ‘드러나다’를 보충합니다.
  naturalness: ‘체를 흔들면’과 속담식 병렬은 자연스럽습니다. 다만 ‘사람의 생각 속에서는 추잡함이 드러납니다’는 조사와 추상명사가 다소 무겁고, 원문의 생략된 ‘남다’의 대응도 사라집니다. ‘사람의 생각에도 더러움이 남습니다’는 간결하고 현대 표준어 합쇼체에 자연스럽습니다.
  terminology: κοπρία의 ‘찌꺼기’는 체질 비유에서 적절합니다. σκύβαλα는 ‘추잡함’보다 물질성과 도덕적 불결함을 함께 남기는 ‘더러움’이 더 안전합니다. λογισμός는 ‘생각’으로 옮길 수 있습니다.
  issues:
  - severity: medium
    issue: σκύβαλα를 ‘추잡함’으로 추상화함
    rationale: σκύβαλα는 ‘찌꺼기, 오물, 배설물’ 등의 폐기물을 가리키며, 사람에게 적용될 때에도 그 거친 비유를 보존하는 편이 좋습니다. ‘추잡함’은 미학적·도덕적 성질로 한정합니다.
  - severity: medium
    issue: 둘째 행에 ‘드러납니다’를 보충함
