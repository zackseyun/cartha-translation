base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/027/002.yaml
  text: A peg will be driven in between the joints of stones[b][a], and sin will be wedged in between selling and buying.
  footnotes:
  - marker: a
    text: Or 'will be fixed' / 'will be fastened' for the peg image.
    reason: lexical_alternative
  - marker: b
    text: The image is that just as a peg is wedged into the joints between stones, so sin gets wedged in between seller and buyer in a transaction.
    reason: cultural_note
translation:
  language: ko
  text: 돌 사이의 이음새에 말뚝이 박히듯, 팔고 사는 일 사이에 죄가 부서집니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘말뚝이 박히듯’은 본문의 비유를 살린 번역이며, 원문은 말뚝이 돌의 이음새 사이에 단단히 박히는 장면을 그립니다.
    reason: source_note
  - marker: b
    text: ‘부서집니다’는 원문의 파괴 이미지를 따른 번역으로, 거래의 흐름 속에 죄가 끼어들어 압박받는 상태를 드러냅니다.
    reason: source_note
lexical_decisions:
- source_word: ἀνὰ μέσον ἁρμῶν λίθων
  english_pob_choice: between the joints of stones
  chosen_korean: 돌 사이의 이음새에
  alternatives_korean:
  - 돌들의 맞물린 틈에
  - 돌 사이의 마디에
  lexicon: LSJ
  rationale: ἁρμός는 돌쌓기에서 ‘맞물리는 이음새/접합부’를 가리키므로, 돌의 구조를 살리는 ‘돌 사이의 이음새’로 옮겼습니다.
- source_word: παγήσεται πάσσαλος
  english_pob_choice: A peg will be driven in
  chosen_korean: 말뚝이 박히듯
  alternatives_korean:
  - 말뚝이 박힐 것입니다
  - 못이 박히듯
  lexicon: LSJ
  rationale: παγήσεται는 단순히 ‘고정되다’보다 단단히 ‘박히다/박아 넣다’의 이미지를 주므로, 한국어에서도 박히는 동작을 살려 비유적 장면을 유지했습니다.
- source_word: ἀνὰ μέσον πράσεως καὶ ἀγορασμοῦ
  english_pob_choice: between selling and buying
  chosen_korean: 팔고 사는 일 사이에
  alternatives_korean:
  - 판매와 구매 사이에
  - 매매 사이에
  lexicon: LSJ
  rationale: πράσεως와 ἀγορασμοῦ의 대조를 한국어에서 자연스럽게 살리기 위해 직역적 명사열보다 ‘팔고 사는 일’로 풀어 표현했습니다.
- source_word: συντριβήσεται ἁμαρτία
  english_pob_choice: sin will be wedged in / crushed
  chosen_korean: 죄가 부서집니다
  alternatives_korean:
  - 죄가 깨어집니다
  - 죄가 짓눌립니다
  lexicon: LSJ
  rationale: συντριβήσεται는 ‘부서지다/짓눌리다’의 파괴 이미지를 가지므로, 거래 한복판에 끼어드는 죄의 결과를 드러내는 ‘부서집니다’로 옮겼습니다.
theological_decisions:
- issue: ἁμαρτία의 윤리적 강도
  chosen_reading: 죄를 일반적 도덕 실수보다 강한 신학적·윤리적 현실로 유지했습니다.
  alternative_readings:
  - 거래상의 부정
  - 잘못
  rationale: 이 잠언형 문장은 상거래의 부정행위만이 아니라 죄 자체가 거래 사이를 파고드는 현실을 말하므로, ‘죄’로 번역해 윤리적 무게를 보존했습니다.
  doctrine_reference: Translation philosophy §1, §6
