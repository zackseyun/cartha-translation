  chosen_reading: 전반부는 싸움이 피 흘림으로 이어진다는 지혜 격언으로, 후반부는 그들의 말이 듣는 이에게 해롭고 고통스럽다는 도덕적 평가로 읽었습니다.
  alternative_readings:
  - ‘전투’로 더 형식적으로 옮기기
  - ‘악한 소식’처럼 ἀκοή를 ‘보고’로 이해하기
  rationale: 본문의 짝 구조는 폭력적 행동과 해로운 언어를 병치하므로, 군사적 사건보다 인간관계의 충돌을 보여 주는 속담적 의미를 살리는 것이 문맥에 더 적합합니다.
  doctrine_reference: 지혜문학의 교훈적 병행법
