  - severity: medium
    issue: ‘욕설’은 διαλοιδόρησις의 범위를 다소 좁힐 수 있습니다.
    rationale: 이 말은 욕설에만 한정되지 않고 모욕, 헐뜯음, 비방과 같은 공격적 언어를 포함합니다. ‘모욕적인 말’이 현대 한국어에서 자연스럽게 그 범위를 보존합니다.
