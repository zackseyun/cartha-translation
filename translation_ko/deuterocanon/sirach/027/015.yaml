translation:
  language: ko
  text: 교만한 자들의 싸움은 피 흘림이며, 그들의 모욕적인 말은 듣기에 괴롭습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘교만한 자들의 싸움은 유혈이며, 그들의 모욕은 나쁜 소문입니다.’ 그리스어 ἀκοή는 ‘들음’ 또는 ‘소식/소문’을 뜻할 수 있습니다. 본문은 이 지혜문학의 문맥에서 모욕적인 말을 듣는 것이 괴롭다는 뜻을 따랐습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔκχυσις αἵματος
  english_pob_choice: bloodshed
  chosen_korean: 피 흘림
  alternatives_korean:
  - 유혈
  - 피 흘리는 일
  - 피의 흘림
  lexicon: LSJ
  rationale: ἔκχυσις αἵματος는 관용적으로 ‘피를 흘림’이라는 뜻이므로, ‘유혈’보다 더 직접적이고 현대적인 ‘피 흘림’으로 옮겼습니다.
- source_word: μάχη ὑπερηφάνων
  english_pob_choice: the quarrel/fighting of the proud
  chosen_korean: 자랑스러운 자들의 싸움
  alternatives_korean:
  - 교만한 자들의 다툼
  - 오만한 자들의 싸움
  - 교만한 사람들의 싸움
  lexicon: LSJ
  rationale: μάχη는 여기서 단순한 논쟁보다 실제 충돌의 뉘앙스가 살아 있어 ‘싸움’으로 옮겼고, ὑπερηφάνων은 성품을 드러내는 표현이므로 ‘자랑스러운 자들’로 처리했습니다.
- source_word: διαλοιδόρησις αὐτῶν
  english_pob_choice: their reviling / abusive speech
  chosen_korean: 그들의 욕설
  alternatives_korean:
  - 그들의 비난
  - 그들의 모욕적인 말
  - 그들의 악담
  lexicon: LSJ
  rationale: διαλοιδόρησις는 상호적 욕설·비방의 강한 말투를 가리키므로, 현대 한국어에서 직접적으로 그 힘을 드러내는 ‘욕설’이 가장 간결합니다.
- source_word: ἀκοὴ μοχθηρά
  english_pob_choice: grievous to hear
  chosen_korean: 듣기 괴롭습니다
  alternatives_korean:
  - 듣기에 악합니다
  - 듣기 꺼림칙합니다
  - 듣기 불쾌합니다
  lexicon: LSJ
  rationale: ἀκοή는 ‘듣는 것/들림’이지만 여기서는 말의 성격이 청자에게 주는 불쾌함을 가리키므로, ‘듣기 괴롭습니다’로 자연스럽게 옮겼습니다.
