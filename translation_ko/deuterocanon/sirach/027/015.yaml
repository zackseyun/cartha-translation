  source_fidelity: 전반부의 ‘싸움은 피 흘림’과 후반부의 ‘듣기 괴롭습니다’는 각각 μάχη와 ἀκοὴ μοχθηρά의 문맥상 의미를 잘 반영합니다. 그러나 ὑπερήφανοι는 긍정적인 ‘자랑스러운 자들’이 아니라 ‘교만한/오만한 자들’입니다. 또한 διαλοιδόρησις는 단순한 비속어인 ‘욕설’보다 모욕하고 헐뜯는 말을 가리키므로 이를 더 정확히 반영하는 편이 좋습니다.
  naturalness: ‘교만한 자들의 싸움은 피 흘림이며, 그들의 모욕적인 말은 듣기에 괴롭습니다’는 현대 표준 한국어의 격언적 문체에 자연스럽고, 합쇼체 종결에도 맞습니다.
  terminology: ὑπερηφάνων은 ‘교만한 자들’로, διαλοιδόρησις는 ‘모욕적인 말’로 옮기는 것이 원문의 도덕적 성격과 언어적 폭력을 정확히 드러냅니다. ‘피 흘림’은 ἔκχυσις αἵματος를 직접적으로 보존합니다.
