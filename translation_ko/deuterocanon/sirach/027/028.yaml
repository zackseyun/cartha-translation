  - 징벌
  lexicon: LSJ
  rationale: 직역어보다 원문의 위협적이고 되갚는 성격을 유지하면서도, 현대 한국어에서 문장 전체의 비유와 잘 맞는 말로 옮겼습니다.
- source_word: ἐνεδρεύσει
  english_pob_choice: will lie in wait
  chosen_korean: 엎드려 기다릴 것입니다
  alternatives_korean:
  - 매복할 것입니다
  - 숨어 기다릴 것입니다
  - 기회를 엿볼 것입니다
  lexicon: LSJ
  rationale: '''사자처럼''이라는 비유와 함께 은밀히 노리는 동작을 살리기 위해, 사전적 ''매복하다''를 풀어 자연스러운 한국어 동작상으로 표현했습니다.'
theological_decisions:
- issue: ὑπερηφάνων의 집단 명사와 αὐτόν의 단수 지시를 한국어에서 어떻게 유지할지
  chosen_reading: 집단은 복수로, 최종 표적은 단수 '그를'로 옮겼습니다.
  alternative_readings:
  - 그들을
  - 그 사람을
  - 그들 각자
  rationale: 그리스어가 일반적 범주(교만한 자들)에서 특정 개인을 지목하는 방식이므로, 한국어에서도 경고의 보편성과 개인적 적용을 함께 보존했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
- issue: ἐκδίκησις를 '정의'나 '징벌'로 완화할지 여부
  chosen_reading: 보복으로 옮겼습니다.
  alternative_readings:
  - 응보
  - 징벌
  - 정의
  rationale: 본문은 교만한 자를 향한 되갚음의 위협을 말하며, 사자 이미지와 결합된 강한 경고를 완화하지 않는 것이 원문 효과를 가장 잘 보존합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 3
