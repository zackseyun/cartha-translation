lexical_decisions:
- source_word: ἐμπαιγμός
  english_pob_choice: mockery
  chosen_korean: 조롱
  alternatives_korean:
  - 희롱
  - 비웃음
  lexicon: LSJ
  rationale: 모욕적 조소의 뜻을 살리면서 한국어 문맥에서 자연스럽고 간결하게 읽히는 표현으로 옮겼습니다.
- source_word: ὀνειδισμός
