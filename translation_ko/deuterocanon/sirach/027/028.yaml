- from: 조롱과 모욕은 교만한 자들에게 돌아가고, 보복은 사자처럼 그를 엎드려 기다릴 것입니다.[a][b]
  to: 조롱과 모욕은 교만한 자들[a]의 몫이며, 보복은 사자처럼 그를 숨어 기다릴 것입니다.[b]
  rationale: The revision makes the verbless opening clause idiomatic in Korean, avoids adding the unexpressed posture ‘엎드려,’ and retains the Greek image of vengeance lying in ambush like a lion. It also preserves the source’s plural class noun followed by singular object (‘교만한 자들’/‘그를’) and corrects footnote content and placement.
