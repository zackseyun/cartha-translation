    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그를 매복할 것입니다’.
    reason: lexical_alternative
  revision_rationale: The revision makes the verbless opening clause idiomatic in Korean, avoids adding the unexpressed posture ‘엎드려,’ and retains the Greek image of vengeance lying in ambush like a lion. It also preserves the source’s plural class noun followed by singular object (‘교만한 자들’/‘그를’) and corrects footnote content and placement.
