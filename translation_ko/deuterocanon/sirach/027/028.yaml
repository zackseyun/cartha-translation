  text: Mockery and reproach are for the proud[b][a], and vengeance will lie in wait for him like a lion.
  footnotes:
  - marker: a
    text: Or 'the arrogant.'
    reason: lexical_alternative
  - marker: b
    text: Or 'will ambush him like a lion.'
    reason: lexical_alternative
translation:
  language: ko
  text: 조롱과 모욕은 교만한 자들에게 돌아가고, 보복은 사자처럼 그를 엎드려 기다릴 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘교만한 자들’로도 번역할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘엎드려 기다릴 것입니다’는 ‘매복할 것입니다’라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμπαιγμός
  english_pob_choice: mockery
  chosen_korean: 조롱
  alternatives_korean:
  - 희롱
  - 비웃음
  lexicon: LSJ
  rationale: 모욕적 조소의 뜻을 살리면서 한국어 문맥에서 자연스럽고 간결하게 읽히는 표현으로 옮겼습니다.
- source_word: ὀνειδισμός
  english_pob_choice: reproach
  chosen_korean: 모욕
  alternatives_korean:
  - 책망
  - 치욕
  - 비난
  lexicon: LSJ
  rationale: 단순한 꾸중보다 수치와 깎아내림의 뉘앙스를 함께 담는 말이어서, 뒤의 '조롱'과 짝을 이루는 강한 수치를 반영했습니다.
- source_word: ὑπερηφάνων
  english_pob_choice: the proud
  chosen_korean: 교만한 자들
  alternatives_korean:
  - 교만한 이들
  - 오만한 자들
  - 교만한 사람들
  lexicon: LSJ
  rationale: 품성의 상태가 아니라 그 상태에 있는 사람들을 가리키므로, 집단적 범주를 분명히 드러내는 표현을 택했습니다.
- source_word: ἐκδίκησις
  english_pob_choice: vengeance
  chosen_korean: 보복
  alternatives_korean:
  - 응보
  - 복수
  - 징벌
  lexicon: LSJ
  rationale: 직역어보다 원문의 위협적이고 되갚는 성격을 유지하면서도, 현대 한국어에서 문장 전체의 비유와 잘 맞는 말로 옮겼습니다.
- source_word: ἐνεδρεύσει
  english_pob_choice: will lie in wait
  chosen_korean: 엎드려 기다릴 것입니다
  alternatives_korean:
  - 매복할 것입니다
  - 숨어 기다릴 것입니다
  - 기회를 엿볼 것입니다
  lexicon: LSJ
  rationale: '''사자처럼''이라는 비유와 함께 은밀히 노리는 동작을 살리기 위해, 사전적 ''매복하다''를 풀어 자연스러운 한국어 동작상으로 표현했습니다.'
theological_decisions:
- issue: ὑπερηφάνων의 집단 명사와 αὐτόν의 단수 지시를 한국어에서 어떻게 유지할지
  chosen_reading: 집단은 복수로, 최종 표적은 단수 '그를'로 옮겼습니다.
  alternative_readings:
  - 그들을
  - 그 사람을
  - 그들 각자
  rationale: 그리스어가 일반적 범주(교만한 자들)에서 특정 개인을 지목하는 방식이므로, 한국어에서도 경고의 보편성과 개인적 적용을 함께 보존했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
- issue: ἐκδίκησις를 '정의'나 '징벌'로 완화할지 여부
  chosen_reading: 보복으로 옮겼습니다.
  alternative_readings:
  - 응보
  - 징벌
  - 정의
  rationale: 본문은 교만한 자를 향한 되갚음의 위협을 말하며, 사자 이미지와 결합된 강한 경고를 완화하지 않는 것이 원문 효과를 가장 잘 보존합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 3
