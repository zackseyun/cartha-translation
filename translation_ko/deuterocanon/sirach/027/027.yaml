  text: Whoever does evil[a], onto himself it will roll, and he will certainly not know from where it came upon him.
  footnotes:
  - marker: a
    text: Or, 'it will roll back on him.' The Greek uses rolling imagery for evil returning to its doer.
    reason: lexical_alternative
translation:
  language: ko
  text: 악을 행하는 자는 자기 위에 그것이 굴러떨어지고, 그것이 어디서 자기에게 닥쳤는지 그는 결코 알지 못합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘악한 것들’이지만, 여기서는 도덕적 악을 가리키는 집합적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ποιῶν πονηρὰ
  english_pob_choice: Whoever does evil
  chosen_korean: 악을 행하는 자는
  alternatives_korean:
  - 누구든지 악을 행하는 사람은
  - 악한 일을 하는 자는
  lexicon: BDAG
  rationale: 정관사 있는 현재분사구를 일반적인 속담형 표현으로 옮겼습니다. '악을 행하는 자'가 행위의 도덕적 성격을 분명히 드러내면서도 한국어에서 자연스럽습니다.
- source_word: κυλισθήσεται
  english_pob_choice: it will roll
  chosen_korean: 굴러떨어지고
  alternatives_korean:
  - 굴러가고
  - 되굴러가고
  - 되돌아 굴러가고
  lexicon: BDAG
  rationale: 굴림의 이미지를 살리되, 한국어에서 결과적·귀결적 뉘앙스를 자연스럽게 전달하기 위해 '굴러떨어지다'를 택했습니다.
- source_word: εἰς αὐτόν
  english_pob_choice: onto himself
  chosen_korean: 자기 위에
  alternatives_korean:
  - 자기에게
  - 그에게
  - 자기에게로
  lexicon: BDAG
  rationale: εἰς의 방향성을 살려, 재앙이 행위자 위로 떨어지는 그림을 한국어로 압축적으로 표현했습니다.
- source_word: πόθεν ἧκε αὐτῷ
  english_pob_choice: where it came from / came upon him
  chosen_korean: 어디서 자기에게 닥쳤는지
  alternatives_korean:
  - 어디서 왔는지
  - 어디서 그에게 왔는지
  - 어디서 닥쳐왔는지
  lexicon: BDAG, LSJ
  rationale: ἧκε의 '오다/도착하다'와 부정적 사건의 도래를 함께 살리기 위해 '닥치다'를 사용했고, '어디서'로 출처의 미상함을 보존했습니다.
theological_decisions:
- issue: 보응의 비유적 이미지 보존
  chosen_reading: 악이 단순한 결과로만 환원되지 않고, 행위자에게 되굴러오는 형상으로 유지했습니다.
  alternative_readings:
  - 악한 결과가 돌아옵니다
  - 그 악이 되돌아옵니다
  rationale: 이 절의 핵심은 도덕적 보응을 굴림의 비유로 말하는 데 있으므로, 의미를 평탄화하지 않고 시각적 이미지를 살렸습니다.
  doctrine_reference: 'Translation philosophy: optimal equivalence; proverbial retribution imagery should remain visible unless source context requires otherwise.'
