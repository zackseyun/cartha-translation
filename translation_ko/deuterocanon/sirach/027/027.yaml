  lexicon: BDAG, LSJ
  rationale: ἧκε의 '오다/도착하다'와 부정적 사건의 도래를 함께 살리기 위해 '닥치다'를 사용했고, '어디서'로 출처의 미상함을 보존했습니다.
theological_decisions:
