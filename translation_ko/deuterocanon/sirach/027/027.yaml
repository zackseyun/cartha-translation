  lexicon: BDAG
  rationale: εἰς의 방향성을 살려, 재앙이 행위자 위로 떨어지는 그림을 한국어로 압축적으로 표현했습니다.
- source_word: πόθεν ἧκε αὐτῷ
  english_pob_choice: where it came from / came upon him
