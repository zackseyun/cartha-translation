revisions:
- from: 악을 행하는 자는 자기 위에 그것이 굴러떨어지고, 그것이 어디서 자기에게 닥쳤는지 그는 결코 알지 못합니다.[a]
  to: 악[a]을 행하는 자에게는 악이 그에게로 굴러올 것이며, 그는 그것이 어디서 그에게 왔는지 결코 알지 못합니다.
  rationale: ‘악이 그에게로 굴러올 것이며’로 고쳐 악이 행위자에게 향해 굴러오는 원문의 비유와 미래의 보응을 보존했습니다. ‘왔는지’는 ἧκε의 기본 의미를 자연스럽게 옮기며, ‘결코 알지 못합니다’는 οὐ μὴ의 강한 부정을 유지합니다. 각 ‘그에게’는 문맥상 같은 ‘악을 행하는 자’를 가리켜 원문의 재귀적 관계를 분명히 합니다.
