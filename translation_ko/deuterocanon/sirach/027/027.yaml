    text: 그리스어는 직역하면 ‘악한 것들’이라는 복수형 표현입니다. 여기서는 도덕적 악을 집합적으로 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ποιῶν πονηρὰ
  english_pob_choice: Whoever does evil
  chosen_korean: 악을 행하는 자는
