  rationale: 이 절의 핵심은 도덕적 보응을 굴림의 비유로 말하는 데 있으므로, 의미를 평탄화하지 않고 시각적 이미지를 살렸습니다.
  doctrine_reference: 'Translation philosophy: optimal equivalence; proverbial retribution imagery should remain visible unless source context requires otherwise.'
