  lexicon: BDAG
  rationale: 정관사 있는 현재분사구를 일반적인 속담형 표현으로 옮겼습니다. '악을 행하는 자'가 행위의 도덕적 성격을 분명히 드러내면서도 한국어에서 자연스럽습니다.
