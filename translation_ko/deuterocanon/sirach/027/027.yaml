review_pass:
  verdict: revise
  source_fidelity: The draft preserves the proverbial retributive sense and emphatic future negation, but ‘굴러떨어지고’ changes the Greek rolling-toward image into falling, and ‘자기 위에’ is not a natural or precise Korean equivalent of εἰς αὐτόν in this construction. The implied subject of κυλισθήσεται should be made explicit as ‘악’ in Korean for clarity.
  naturalness: ‘자기 위에 그것이 굴러떨어지고’ is markedly unnatural and creates an incoherent physical image. A construction with ‘그에게로 굴러올 것이며’ is idiomatic, preserves the directional imagery, and fits modern formal-polite Korean.
  terminology: ‘악을 행하는 자’ is an appropriate formal rendering of ὁ ποιῶν πονηρά. The lexical note should be anchored directly to ‘악,’ not to the end of the sentence, and should describe πονηρά as a substantival plural without overstating a single mandatory Korean gloss.
  issues:
  - severity: medium
    issue: ‘굴러떨어지고’ renders κυλισθήσεται as falling rather than rolling.
    rationale: κυλισθήσεται retains rolling imagery; ‘굴러떨어지다’ adds a downward-falling component absent from the Greek and obscures the return-toward-the-doer image.
  - severity: medium
    issue: ‘자기 위에’ is awkward and semantically imprecise for εἰς αὐτόν.
    rationale: The preposition indicates movement directed to the evildoer. ‘그에게로’ naturally conveys this in Korean without introducing the image of something resting or falling on top of him.
  - severity: low
    issue: The footnote marker is placed at sentence end rather than on the lexical item it explains.
    rationale: A lexical note on πονηρά should be attached to ‘악’ for a clear anchor.
  revised_text: 악[a]을 행하는 자에게는 악이 그에게로 굴러올 것이며, 그는 그것이 어디서 그에게 왔는지 결코 알지 못합니다.
  revised_footnotes:
