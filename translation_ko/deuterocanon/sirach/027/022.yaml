  text: One who winks with the eye devises evil things[a], and no one will turn him away from them.
  footnotes:
  - marker: a
    text: Greek literally, 'from it'; the sense is likely 'from the evil things' just mentioned, hence 'from them' in English.
    reason: lexical_alternative
translation:
  language: ko
  text: 눈짓하며 악한 일을 꾀하는 자는 아무도 그 악에서 돌이키게 하지 못합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 문자적으로 ‘그것에게서/그것으로부터’에 해당하는 단수형을 씁니다. 문맥상 이는 앞서 언급한 악한 일, 곧 그가 꾀하는 악을 가리키는 것으로 이해됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: διανεύων
  english_pob_choice: One who winks
  chosen_korean: 눈으로 윙크하며
  alternatives_korean:
  - 눈짓하며
  - 신호를 보내며
  - 눈으로 신호하며
  lexicon: LSJ
  rationale: ἰδία 표정과 함께 쓰여 몰래 보내는 눈짓을 가리키므로, ‘윙크하다’가 간결하면서도 은밀한 संकेत의 뉘앙스를 잘 살립니다.
- source_word: ὀφθαλμῷ
  english_pob_choice: with the eye
  chosen_korean: 눈으로
  alternatives_korean:
  - 그의 눈으로
  - 눈짓으로
  lexicon: LSJ
  rationale: 여격의 도구 의미를 자연스러운 한국어 조사 ‘-으로’로 옮겼고, 원문에 없는 소유격은 넣지 않았습니다.
- source_word: τεκταίνει κακά
  english_pob_choice: devises evil things
  chosen_korean: 악한 일들을 꾀하는
  alternatives_korean:
  - 악을 꾸미는
  - 악한 일들을 계획하는
  - 악을 도모하는
  lexicon: LSJ
  rationale: τεκταίνει의 ‘꾀하다/궁리하다’는 능동적 계략의 뜻을 살려, plural κακά는 ‘악한 일들’로 넓게 옮겼습니다.
- source_word: ἀπʼ αὐτοῦ
  english_pob_choice: from them
  chosen_korean: 그 일
  alternatives_korean:
  - 그것들
  - 그에게서
  - 그 일들
  lexicon: LSJ
  rationale: 그리스어 형식은 단수지만, 문맥상 앞의 ‘악한 일들’이 선행하므로 한국어에서는 의미를 분명히 하되 과도하게 복수화하지 않도록 정리했습니다.
