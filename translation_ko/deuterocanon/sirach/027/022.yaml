  rationale: 'The revision corrects the syntactic roles in the final clause: the evildoer is the object of ‘turn away,’ and the evil he contrives is that from which no one turns him. It also uses idiomatic Korean while preserving the source''s singular pronoun and its contextual ambiguity through a footnote.'
