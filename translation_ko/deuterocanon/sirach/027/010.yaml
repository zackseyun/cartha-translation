  lexicon: LSJ
  rationale: ἄδικα를 단순히 ‘잘못’으로 완화하지 않고, 윤리적·법정적 뉘앙스가 있는 ‘불의’를 택해 원문의 도덕적 초점을 보존했습니다.
theological_decisions:
- issue: 죄의 인격화
  chosen_reading: 죄가 사냥꾼처럼 사람을 노리는 것으로 직역에 가깝게 살렸습니다.
