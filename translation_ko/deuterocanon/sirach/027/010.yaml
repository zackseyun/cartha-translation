  lexicon: LSJ
  rationale: 복수형을 그대로 드러내면서도 인격화된 주어로 기능하게 하려면 ‘죄들’도 가능하지만, 속담체에서는 ‘죄도’가 더 자연스럽고 앞의 사자와 평행을 이룹니다.
- source_word: ἐργαζομένους ἄδικα
