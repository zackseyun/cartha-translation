  - 죄의 결과가 사람을 노린다
  - 죄에 대한 벌이 사람을 노린다
  rationale: 그리스어는 ‘죄’ 자체를 주어로 삼아 포식자 비유를 구성하므로, 해석을 덧씌워 추상화하기보다 원문의 긴장을 유지했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
