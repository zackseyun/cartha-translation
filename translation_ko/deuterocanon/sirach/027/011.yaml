  text: The speech of the godly is always wisdom[b][a], but the fool changes like the moon.
  footnotes:
  - marker: a
    text: Or 'The discourse of the devout is wisdom at all times.'
    reason: lexical_alternative
  - marker: b
    text: 'The comparison to the moon likely points to its changing phases: the fool is unstable or inconstant.'
    reason: cultural_note
translation:
  language: ko
  text: 경건한 이의 말은 언제나 지혜입니다. 그러나 어리석은 자는 달처럼 변합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘경건한 이의 말은 모든 때에 지혜입니다’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 달에 빗댄 것은 달의 차고 기우는 변화, 곧 어리석은 자의 불안정함이나 일관성 없음을 가리키는 것으로 보입니다.
    reason: cultural_note
lexical_decisions:
- source_word: διήγησις
  english_pob_choice: speech
  chosen_korean: 말
  alternatives_korean:
  - 말씀
  - 대화
  - 담화
  lexicon: LSJ
  rationale: 이 문맥에서는 서술문이나 공식적 ‘담화’보다 사람의 실제 발화 전체를 가리키므로, 자연스럽고 간결한 ‘말’이 영어 POB의 ‘speech’를 가장 무리 없이 받습니다.
- source_word: εὐσεβοῦς
  english_pob_choice: the godly
  chosen_korean: 경건한 이
  alternatives_korean:
  - 경건한 사람
  - 경건한 자
  - 신실한 이
  lexicon: LSJ
  rationale: 형용사의 명사적 용법이므로 ‘경건한 이’로 옮기면 품격을 유지하면서도 ‘the godly’의 도덕·종교적 뉘앙스를 살릴 수 있습니다.
- source_word: διὰ παντός
  english_pob_choice: always
  chosen_korean: 언제나
  alternatives_korean:
  - 항상
  - 늘
  - 언제까지나
  lexicon: LSJ
  rationale: ‘through all time’의 관용적 의미를 한국어로 자연스럽게 풀면 ‘언제나’가 가장 간결하고 구어적이지 않으면서도 지속성을 잘 드러냅니다.
- source_word: ἀλλοιοῦται
  english_pob_choice: changes
  chosen_korean: 변합니다
  alternatives_korean:
  - 달라집니다
  - 바뀝니다
  - 변화합니다
  lexicon: LSJ
  rationale: 동사의 핵심은 ‘다르게 된다/변한다’이므로, 달의 변화를 떠올리게 하는 비유와 함께 가장 직설적인 ‘변합니다’를 택했습니다.
theological_decisions:
- issue: 세속적 비유인 달의 변화가 의인의 말과 어리석은 자의 변덕을 대비하는 방식
  chosen_reading: 달의 위상 변화에 빗대어, 어리석은 자의 불안정함을 드러내는 지혜 격언으로 옮겼습니다.
  alternative_readings:
  - 달처럼 변덕스럽다
  - 달의 변화처럼 불안정하다
  rationale: 원문과 POB 주해가 함께 달의 ‘변하는 상태’를 배경으로 삼으므로, 해석을 과도하게 확장하지 않고 ‘달처럼 변합니다’로 간명하게 유지했습니다.
  doctrine_reference: 지혜문학의 관찰적 대비 표현
