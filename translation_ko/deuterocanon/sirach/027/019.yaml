base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/027/019.yaml
  text: And as a bird from your hand you have let go[a], so you have let your neighbor go, and you will not catch him.
  footnotes:
  - marker: a
    text: Or, 'you will not hunt him down.' The Greek verb has hunting imagery.
    reason: lexical_alternative
translation:
  language: ko
  text: 마치 당신의 손에서 새를 놓아 보낸 것처럼, 이웃도 놓아 보냈으니, 그를 붙잡지는 못할 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그를 사냥해 잡지는 못할 것입니다.” 그리스어 동사는 사냥의 이미지를 담고 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: πετεινὸν
  english_pob_choice: bird
  chosen_korean: 새
  alternatives_korean:
  - 날짐승
  - 새 한 마리
  lexicon: LSJ
  rationale: 일반적인 조류를 가리키는 말이므로, 자연스럽고 현대적인 ‘새’로 옮겨 비유의 즉시성을 살렸습니다.
- source_word: ἐκ χειρός σου
  english_pob_choice: from your hand
  chosen_korean: 당신의 손에서
  alternatives_korean:
  - 당신 손에서
  - 당신의 손에서부터
  lexicon: LSJ
  rationale: 손에 쥔 것을 놓는 구체적 이미지를 그대로 드러내는 표현으로, 직역의 힘을 유지했습니다.
- source_word: ἀπέλυσας
  english_pob_choice: you have let go
  chosen_korean: 놓아 보낸
  alternatives_korean:
  - 놓아 준
  - 풀어 놓은
  - 보내 버린
  lexicon: LSJ
  rationale: 새를 손에서 풀어 주는 장면에 맞게 ‘놓아 보낸’으로 옮겨, 뒤의 관계 비유와 평행을 이루게 했습니다.
- source_word: οὐ θηρεύσεις αὐτόν
  english_pob_choice: you will not catch him
  chosen_korean: 그를 다시 잡지는 못할 것입니다
  alternatives_korean:
  - 그를 사냥하지는 못할 것입니다
  - 그를 붙잡지는 못할 것입니다
  - 그를 다시 포획하지는 못할 것입니다
  lexicon: LSJ
  rationale: θηρεύω의 사냥 이미지는 살리되, 문맥상 핵심인 ‘되돌릴 수 없음’을 한국어에서 분명히 하기 위해 결과 중심으로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 마지막 동사의 사냥 이미지를 얼마나 직접적으로 드러낼지
  chosen_reading: ‘잡다’로 옮기되 ‘다시’와 부정형을 더해 회복 불가능성을 강조했습니다.
  alternative_readings:
  - 그를 사냥하지는 못할 것입니다
  - 그를 포획하지는 못할 것입니다
  rationale: 지혜문학의 경구적 힘은 유지하되, 현대 한국어에서 과도하게 생소한 사냥 용어보다 관계의 단절과 회복 불가를 더 분명하게 전달하는 쪽이 본문의 의도를 잘 드러냅니다.
  doctrine_reference: 번역 철학 §6 (가독성 높은 현대어)
