review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents the negative conditional, the Lord-fear idiom, diligence, the rapid future ruin, and the broad sense of οἶκος. However, ‘주님을 경외하는 가운데서 부지런히 굳게 붙들지’ leaves the object of ‘붙들다’ syntactically unexpressed in Korean and is difficult to construe. Supplying ‘주님을 경외함’ makes explicit what the Greek construction conveys without narrowing its sense.
  naturalness: The wording is generally formal and appropriate, but ‘가운데서’ is unnecessarily heavy here, and the sequence ‘부지런히 굳게 붙들지’ is awkward because Korean ‘붙들다’ normally requires a stated object in this sense. The revision is natural modern formal-polite Korean.
  terminology: ‘주님’ and ‘경외함’ appropriately preserve κύριος and φόβος Κυρίου in established biblical Korean. ‘집’ retains the intended ambiguity of οἶκος; the footnote responsibly notes the household sense.
  issues:
  - severity: medium
    issue: The verb ‘붙들다’ has no clear object in the Korean main text.
    rationale: While κρατήσῃ is framed by ἐν φόβῳ Κυρίου in Greek, a direct Korean rendering with ‘붙들다’ needs an object for clarity. ‘주님을 경외함을’ supplies that object and preserves the source’s religious posture rather than introducing a doctrinal interpretation.
  - severity: low
    issue: ‘가운데서’ is stylistically cumbersome in this construction.
    rationale: The source’s ἐν need not be mechanically represented as ‘가운데서.’ Recasting with the nominalized biblical expression ‘주님을 경외함을’ is clearer and more idiomatic.
  revised_text: 만일 그가 주님을 경외함을 힘써 굳게 붙들지 않으면, 그의 집은 곧 무너질 것입니다.[a]
  revised_footnotes:
  - marker: a
    text: 또는 ‘그의 집안이 곧 망할 것입니다.’ 그리스어 ‘집’은 건물뿐 아니라 한 사람의 가정이나 집안을 가리킬 수 있습니다.
    reason: lexical_alternative
