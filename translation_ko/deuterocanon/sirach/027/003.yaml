theological_decisions:
- issue: φόβος Κυρίου의 신학적 표현 유지
  chosen_reading: ‘주님을 경외하는 가운데서’로 옮겨, 지혜문학의 핵심 관용구를 보존했습니다.
  alternative_readings:
  - 주님에 대한 두려움 속에서
  - 주님을 향한 경외심으로
  rationale: 이 표현은 단순한 심리 상태가 아니라 신앙적 자세를 가리키므로, 의미를 완화하지 않고 성경적 관용구의 무게를 살렸습니다.
  doctrine_reference: 'DOCTRINE.md: Preserve theological tension rather than resolve it; keep source-shaped biblical idiom.'
