  to: 만일 그가 주님을 경외함을 힘써 굳게 붙들지 않으면, 그의 집은 곧 무너질 것입니다.[a]
  rationale: The revision resolves the Korean syntactic ambiguity by giving ‘굳게 붙들다’ its natural object, ‘주님을 경외함.’ It retains the source’s conditional force, diligent steadfastness, biblical ‘fear of the Lord’ terminology, and the deliberate breadth of ‘집.’ ‘곧’ naturally conveys ἐν τάχει.
