translation:
  language: ko
  text: 비밀[a]을 누설하는 자는 신뢰를 잃으며, 자기 마음에 맞는 친구[b]를 결코 찾지 못합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘비밀’은 ‘신비’ 또는 다른 사람에게 맡겨진 비밀이라는 뜻으로도 이해할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘자기 영혼을 위한 친구’입니다. 자기 자신에게 참으로 가까우며 잘 맞는 친구를 가리키는 관용적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὁ ἀποκαλύπτων
  english_pob_choice: Whoever reveals
  chosen_korean: 비밀을 드러내는 자는
  alternatives_korean:
