base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/027/016.yaml
  text: Whoever reveals secrets destroys trust[b][a], and will never find a friend for his soul.
  footnotes:
  - marker: a
    text: Or 'mysteries' or 'confidences' for 'secrets.'
    reason: lexical_alternative
  - marker: b
    text: Greek 'for his soul'—an idiom for one truly close to him or fitting for his very self.
    reason: lexical_alternative
translation:
  language: ko
  text: 비밀을 드러내는 자는 신뢰를 잃고, 자기 영혼에 맞는 친구를 결코 찾지 못합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘비밀’은 여기서 ‘신비’나 ‘맡겨진 속마음’의 뜻일 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘자기 영혼에 맞는’은 곧 자기 자신에게 참으로 어울리고 가까운 사람이라는 관용적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὁ ἀποκαλύπτων
  english_pob_choice: Whoever reveals
  chosen_korean: 비밀을 드러내는 자는
  alternatives_korean:
  - 비밀을 밝히는 자는
  - 비밀을 폭로하는 자는
  lexicon: BDAG
  rationale: 관사 포함 현재분사는 일반적인 경구의 주체를 가리키므로, 한국어에서는 ‘…하는 자는’으로 보편적 원칙을 살렸습니다.
- source_word: μυστήρια
  english_pob_choice: secrets
  chosen_korean: 비밀
  alternatives_korean:
  - 신비
  - 은밀한 일
  - 비밀스러운 것
  lexicon: BDAG
  rationale: 이 지혜문맥에서는 신학적 ‘신비’보다 맡겨진 사적인 내용을 뜻하는 ‘비밀’이 가장 자연스럽고 오해가 적습니다.
- source_word: ἀπώλεσεν πίστιν
  english_pob_choice: destroys trust
  chosen_korean: 신뢰를 잃고
  alternatives_korean:
  - 믿음을 잃고
  - 신의를 잃고
  - 신뢰를 파괴하고
  lexicon: BDAG
  rationale: πίστις는 여기서 교리적 ‘믿음’이 아니라 관계적 신뢰를 뜻하므로, 한국어에서도 ‘신뢰’로 옮겨 경구의 뜻을 분명히 했습니다.
- source_word: πρὸς τὴν ψυχὴν αὐτοῦ
  english_pob_choice: for his soul
  chosen_korean: 자기 영혼에 맞는
  alternatives_korean:
  - 자기에게 꼭 맞는
  - 자기 자신에게 속한
  - 자기 영혼을 위한
  lexicon: BDAG
  rationale: ‘πρὸς + 대격’은 단순히 ‘위하여’라기보다 ‘그의 내면/자기 자신에 맞는’이라는 관용적 뉘앙스를 가지므로, 영어 POB의 주석을 따라 ‘자기 영혼에 맞는’으로 처리했습니다.
theological_decisions:
- issue: πίστις의 번역을 이 문맥에서 어떻게 처리할지
  chosen_reading: 신뢰
  alternative_readings:
  - 믿음
  - 신의
  rationale: 이 절은 비밀 누설의 결과로 우정과 관계가 무너지는 경구이므로, 교리어 ‘믿음’보다 관계적 의미의 ‘신뢰’가 원문 의도와 더 가깝습니다.
  doctrine_reference: 'DOCTRINE.md: πίστις의 문맥적 번역 원칙'
