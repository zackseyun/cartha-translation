  - 은밀한 일
  - 비밀스러운 것
  lexicon: BDAG
  rationale: 이 지혜문맥에서는 신학적 ‘신비’보다 맡겨진 사적인 내용을 뜻하는 ‘비밀’이 가장 자연스럽고 오해가 적습니다.
- source_word: ἀπώλεσεν πίστιν
  english_pob_choice: destroys trust
  chosen_korean: 신뢰를 잃고
  alternatives_korean:
  - 믿음을 잃고
  - 신의를 잃고
  - 신뢰를 파괴하고
  lexicon: BDAG
  rationale: πίστις는 여기서 교리적 ‘믿음’이 아니라 관계적 신뢰를 뜻하므로, 한국어에서도 ‘신뢰’로 옮겨 경구의 뜻을 분명히 했습니다.
- source_word: πρὸς τὴν ψυχὴν αὐτοῦ
  english_pob_choice: for his soul
  chosen_korean: 자기 영혼에 맞는
  alternatives_korean:
  - 자기에게 꼭 맞는
  - 자기 자신에게 속한
  - 자기 영혼을 위한
  lexicon: BDAG
  rationale: ‘πρὸς + 대격’은 단순히 ‘위하여’라기보다 ‘그의 내면/자기 자신에 맞는’이라는 관용적 뉘앙스를 가지므로, 영어 POB의 주석을 따라 ‘자기 영혼에 맞는’으로 처리했습니다.
theological_decisions:
- issue: πίστις의 번역을 이 문맥에서 어떻게 처리할지
  chosen_reading: 신뢰
  alternative_readings:
