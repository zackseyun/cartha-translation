  rationale: 이 절은 비밀 누설의 결과로 우정과 관계가 무너지는 경구이므로, 교리어 ‘믿음’보다 관계적 의미의 ‘신뢰’가 원문 의도와 더 가깝습니다.
  doctrine_reference: 'DOCTRINE.md: πίστις의 문맥적 번역 원칙'
