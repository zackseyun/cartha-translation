  - 비밀을 폭로하는 자는
  lexicon: BDAG
  rationale: 관사 포함 현재분사는 일반적인 경구의 주체를 가리키므로, 한국어에서는 ‘…하는 자는’으로 보편적 원칙을 살렸습니다.
- source_word: μυστήρια
  english_pob_choice: secrets
  chosen_korean: 비밀
  alternatives_korean:
