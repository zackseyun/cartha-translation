  text: I have hated many things, but I have not become like him; and the Lord will hate him.
translation:
  language: ko
  text: 나는 많은 것들을 미워했습니다. 그러나 그와 같아지지는 않았습니다. 그리고 주님은 그를 미워하실 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πολλὰ
  english_pob_choice: many things
  chosen_korean: 많은 것들을
  alternatives_korean:
  - 많은 것들
  - 많은 것
  lexicon: LSJ
  rationale: 중성 복수의 명사적 용법을 살려, 단순한 양이 아니라 ‘많은 것들’이라는 대상성을 분명히 드러냈습니다.
- source_word: ἐμίσησα
  english_pob_choice: I have hated
  chosen_korean: 미워했습니다
  alternatives_korean:
  - 미워했습니다만
  - 미워했습니다,
  - 미워해 왔습니다
  lexicon: LSJ
  rationale: 동사의 강한 정서를 유지하되, 한국어에서는 현재완료를 과도하게 드러내기보다 누적된 경험을 자연스럽게 표현하는 과거형이 적절합니다.
- source_word: οὐχ ὡμοίωσα αὐτῷ
  english_pob_choice: I have not become like him
  chosen_korean: 그와 같아지지는 않았습니다
  alternatives_korean:
  - 그를 닮지는 않았습니다
  - 그와 같게 되지는 않았습니다
  - 그와 같아지지 않았습니다
  lexicon: LSJ
  rationale: ὁμοιόω의 비교·동화 의미를 살려, 단순한 외형적 닮음보다 도덕적·실존적 동일화를 부정하는 뜻으로 옮겼습니다.
- source_word: μισήσει
  english_pob_choice: will hate
  chosen_korean: 미워하실 것입니다
  alternatives_korean:
  - 미워하실 것입니다만
  - 미워하실 것입니다,
  - 미워하실 터입니다
  lexicon: LSJ
  rationale: מισέω의 반복을 그대로 살리면서도, 한국어에서는 하나님께 대한 존대를 반영해 ‘미워하실 것입니다’로 옮겼습니다.
theological_decisions:
- issue: 하나님을 가리키는 κύριος의 존대 처리
  chosen_reading: ‘주님’으로 번역하고, 서술 동사에 존대형을 사용했습니다.
  alternative_readings:
  - ‘주’
  - ‘주여’
  rationale: 지혜문학 문맥에서 κύριος는 하나님을 가리키므로, 한국어 독자에게 분명하게 전달되도록 ‘주님’과 존대형을 유지했습니다.
  doctrine_reference: Contested terms table for κύριος
- issue: 하나님의 ‘미워하심’ 표현의 보존
  chosen_reading: ‘주님은 그를 미워하실 것입니다’라고 직설적으로 유지했습니다.
  alternative_readings:
  - 주님은 그를 못마땅해하실 것입니다
  - 주님은 그를 싫어하실 것입니다
  rationale: 본문의 반복되는 μισέω를 완화하지 않고 유지하여, 의도된 수사적 강도와 심판적 대비를 보존했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
