base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/027/029.yaml
  text: Those who rejoice at the fall of the godly will be caught in a trap[a], and pain will consume them before their death.
  footnotes:
  - marker: a
    text: 'Or ''the pious'' or ''the devout.'' Greek: εὐσεβῶν.'
    reason: lexical_alternative
translation:
  language: ko
  text: 경건한 이들[a]의 넘어짐을 즐거워하는 자들은 덫에 걸릴 것이며, 고통이 그들을 죽기 전에 삼킬 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '또는 ‘독실한 이들’. 그리스어: εὐσεβῶν.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παγίδι
  english_pob_choice: in a trap
  chosen_korean: 덫에 걸릴 것입니다
  alternatives_korean:
  - 올무에 걸릴 것입니다
  - 덫에 사로잡힐 것입니다
  lexicon: LSJ
  rationale: 여기서는 포획의 도구를 가리키는 말이므로, 현대 한국어에서 자연스럽고 직접적인 ‘덫’이 가장 잘 맞습니다. ‘걸리다’는 함정에 빠져 잡히는 이미지를 살립니다.
- source_word: ἁλώσονται
  english_pob_choice: will be caught
  chosen_korean: 걸릴 것입니다
  alternatives_korean:
  - 잡힐 것입니다
  - 포로가 될 것입니다
  lexicon: LSJ
  rationale: 미래 수동의 포획 의미를 살리되, ‘덫’과 함께 쓰일 때는 ‘걸리다’가 가장 자연스럽습니다.
- source_word: οἱ εὐφραινόμενοι
  english_pob_choice: those who rejoice
  chosen_korean: 기뻐하는 자들
  alternatives_korean:
  - 즐거워하는 자들
  - 기뻐하는 사람들
  lexicon: LSJ
  rationale: 현재분사 절을 명사화한 표현이므로 ‘~하는 자들’로 옮겨, 특정 행동을 지속적으로 보이는 사람들을 드러냈습니다.
- source_word: πτώσει εὐσεβῶν
  english_pob_choice: the fall of the godly
  chosen_korean: 경건한 이들의 넘어짐
  alternatives_korean:
  - 경건한 이들의 몰락
  - 경건한 이들의 추락
  lexicon: LSJ
  rationale: εὐσεβῶν은 여기서 경건한 사람들을 가리키며, 문맥상 단순한 ‘faithful’보다 도덕·종교적 범주를 드러내는 ‘경건한 이들’이 적절합니다. πτῶσις는 직역하면 ‘넘어짐’이지만, 한국어에서도 비유적·도덕적 سقوط을 충분히 전달합니다.
- source_word: ὀδύνη καταναλώσει αὐτοὺς
  english_pob_choice: pain will consume them
  chosen_korean: 고통이 … 삼킬 것입니다
  alternatives_korean:
  - 고통이 그들을 소모할 것입니다
  - 고통이 그들을 집어삼킬 것입니다
  lexicon: LSJ
  rationale: καταναλώσει의 소멸·삼킴의 이미지를 살려 ‘삼키다’로 옮겼습니다. ‘고통’은 ὀδύνη의 넓은 의미를 보존하면서 물리적·정서적 괴로움을 함께 포괄합니다.
theological_decisions:
- issue: εὐσεβῶν의 한국어 신학적 범주
  chosen_reading: 경건한 이들
  alternative_readings:
  - 경건한 사람들
  - 신실한 이들
  rationale: 이 문맥은 특정 교파 용어보다 지혜문학의 윤리적·종교적 범주를 드러내는 표현이 필요하므로, 전통적이면서도 과도하게 교리화되지 않은 ‘경건한 이들’을 택했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy, lexical consistency in wisdom literature
