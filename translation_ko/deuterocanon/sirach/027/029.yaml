  source_fidelity: 그리스어는 ‘경건한 이들의 넘어짐을 즐거워하는 자들’ 전체를 주어로 하며, 그들이 덫에 걸리고 고통이 죽기 전에 그들을 삼킨다고 말합니다. 초안은 이 수식 관계를 두 개의 서로 다른 집단처럼 분리하여 원문의 구문을 충실히 반영하지 못합니다.
