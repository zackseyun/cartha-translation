  to: 경건한 이들[a]의 넘어짐을 즐거워하는 자들은 덫에 걸릴 것이며, 고통이 그들을 죽기 전에 삼킬 것입니다.
  rationale: 원문의 분사구 οἱ εὐφραινόμενοι πτώσει εὐσεβῶν을 한국어 관형절로 통합하여, 덫에 걸리고 고통을 당하는 대상이 동일한 사람들임을 분명히 했습니다. πρὸ τοῦ θανάτου αὐτῶν의 시간 관계는 ‘그들을 죽기 전에’로 유지했으며, 원문이 특정한 고통의 종류를 규정하지 않으므로 ‘고통’으로 넓게 보존했습니다.
