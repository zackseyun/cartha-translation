  yaml_path: translation/deuterocanon/sirach/027/020.yaml
  text: Do not pursue him[a], for he has gone far away[b], and has escaped like a gazelle from a snare.
  footnotes:
  - marker: a
    text: Or 'Do not chase him.' The Greek verb can denote pursuit more generally.
    reason: lexical_alternative
  - marker: b
    text: The image is of a swift wild animal escaping a hunter's trap; 'gazelle' could also be rendered 'roe' or 'antelope.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그를 쫓지 마십시오. 그는 멀리 떠났고, 덫에서 벗어난 암사슴처럼 빠져나갔습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: διώκω는 여기서 ‘쫓다’보다 넓게 ‘추적하다/뒤쫓다’를 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: δορκάς는 ‘암사슴’으로도 옮길 수 있고, 문자적으로는 가젤/노루류의 민첩한 동물을 가리킵니다.
    reason: lexical_alternative
