base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/027/020.yaml
  text: Do not pursue him[a], for he has gone far away[b], and has escaped like a gazelle from a snare.
  footnotes:
  - marker: a
    text: Or 'Do not chase him.' The Greek verb can denote pursuit more generally.
    reason: lexical_alternative
  - marker: b
    text: The image is of a swift wild animal escaping a hunter's trap; 'gazelle' could also be rendered 'roe' or 'antelope.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그를 뒤쫓지 마십시오.[a] 그는 멀리 떠났고, 덫에서 벗어난 가젤처럼 달아났습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 동사는 ‘추적하다’ 또는 ‘쫓다’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어 δορκάς는 가젤을 가리키며, 문맥에 따라 ‘노루’ 또는 ‘영양’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ ... διώξῃς
  english_pob_choice: Do not pursue
  chosen_korean: 쫓지 마십시오
  alternatives_korean:
  - 추격하지 마십시오
  - 뒤쫓지 마십시오
  lexicon: LSJ
  rationale: διώκω는 여기서 일반적인 추적/뒤쫓음을 뜻하므로, 합쇼체 명령으로 자연스럽게 옮기되 과도한 ‘박해’ 의미는 피했습니다.
- source_word: μακρὰν ἀπέστη
  english_pob_choice: he has gone far away
  chosen_korean: 멀리 떠났고
  alternatives_korean:
  - 멀리 떠나버렸고
  - 멀리 물러났고
  lexicon: LSJ
  rationale: ἀπέστη는 떠남/물러남을 가리키므로, 한국어에서는 결과를 살려 ‘멀리 떠났고’로 간결하게 표현했습니다.
- source_word: ἐξέφυγεν ὡς δορκὰς
  english_pob_choice: has escaped like a gazelle
  chosen_korean: 암사슴처럼 빠져나갔습니다
  alternatives_korean:
  - 사슴처럼 빠져나갔습니다
  - 가젤처럼 빠져나갔습니다
  lexicon: LSJ
  rationale: δορκάς는 가젤/노루류의 민첩한 동물을 가리키지만, 한국어 독자에게는 ‘암사슴’이 가장 자연스럽게 신속한 탈출 이미지를 전달합니다.
- source_word: ἐκ παγίδος
  english_pob_choice: from a snare
  chosen_korean: 덫에서
  alternatives_korean:
  - 올무에서
  - 함정에서
  lexicon: LSJ
  rationale: παγίς는 올무/덫의 뜻이므로, 앞의 동물 이미지와 잘 어울리는 일상적 표현인 ‘덫’으로 옮겼습니다.
