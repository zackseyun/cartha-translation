base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/027/017.yaml
  text: Cherish a friend and be faithful to him; but if you reveal his secrets[a], you will certainly not pursue after him.
  footnotes:
  - marker: a
    text: Or, 'you should certainly not go after him.' The Greek can be heard either as a statement of consequence or, less likely, as a prohibition.
    reason: alternative_reading
translation:
  language: ko
  text: 친구를 아끼고 그에게 신실하십시오. 그러나 그의 비밀을 드러낸다면, 결코 그를 뒤쫓지 못할 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘그를 뒤따르지 못할 것입니다.’ 그리스어는 결과 진술로도, 덜 가능하게는 금지로도 들릴 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: στέργον
  english_pob_choice: Cherish
  chosen_korean: 아끼고
  alternatives_korean:
  - 사랑하고
  - 귀히 여기고
  - 정답게 여기고
  lexicon: LSJ
  rationale: στέργω는 자연스러운 애정과 헌신을 나타내므로, 관계적 충실함을 담되 한국어에서 과도하게 감정화되지 않는 ‘아끼고’로 옮겼습니다.
- source_word: πιστώθητι
  english_pob_choice: be faithful
  chosen_korean: 신실하십시오
  alternatives_korean:
  - 충실하십시오
  - 믿을 만하게 되십시오
  - 성실하십시오
  lexicon: LSJ
  rationale: 이 명령형은 친구 관계 안에서의 신의를 요구하므로, 단순한 성격 평가보다 관계적 충실성을 드러내는 ‘신실하십시오’가 가장 적절합니다.
- source_word: τὰ μυστήρια αὐτοῦ
  english_pob_choice: his secrets
  chosen_korean: 그의 비밀
  alternatives_korean:
  - 그의 비밀스러운 일
  - 그의 은밀한 일
  - 그의 신비
  lexicon: LSJ
  rationale: 지혜문학 문맥에서 μυστήρια는 종교적 ‘신비’보다 드러내지 말아야 할 사적인 비밀을 뜻하므로, ‘그의 비밀’로 직역성 있게 처리했습니다.
- source_word: καταδιώξῃς ὀπίσω αὐτοῦ
  english_pob_choice: pursue after him
  chosen_korean: 그를 뒤쫓지 못할 것입니다
  alternatives_korean:
  - 그를 따라가지 못할 것입니다
  - 그를 다시 찾지 못할 것입니다
  - 그를 뒤쫓지 마십시오
  lexicon: LSJ
  rationale: 직역하면 ‘그 뒤를 추격하다’이지만, 관계 회복을 위해 따라붙는 이미지를 살리면서도 현대 한국어에서 자연스럽게 ‘뒤쫓다’로 옮겼습니다.
theological_decisions:
- issue: '마지막 절의 의미: 결과 진술인가, 금지 명령인가'
  chosen_reading: 비밀을 누설한 뒤에는 친구를 더 이상 뒤쫓아 관계를 회복하지 못한다는 결과 진술로 읽었습니다.
  alternative_readings:
  - 그를 뒤쫓지 말라는 금지 명령
  - 그를 다시 따라잡지 못한다는 진술
  rationale: 그리스어의 강한 부정은 문맥상 파멸적 결과를 예고하는 잠언적 진술로 읽는 것이 가장 자연스럽고, POB의 영어 주해도 이 긴장을 보존합니다.
  doctrine_reference: 주해적 긴장을 본문 수준에서 보존
