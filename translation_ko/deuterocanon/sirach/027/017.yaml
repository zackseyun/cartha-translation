review_pass:
  verdict: revise
  source_fidelity: 첫 두 명령은 στέργον과 πιστώθητι μετʼ αὐτοῦ를 충실하게 옮깁니다. 마지막 절의 οὐ μὴ καταδιώξῃς는 강한 부정의 미래적/잠언적 결과 진술로 읽는 것이 자연스럽습니다. 다만 ‘뒤쫓지 못할 것입니다’는 원문에 명시되지 않은 무능·불가능의 뉘앙스를 더합니다.
  naturalness: ‘친구를 아끼고 그에게 신실하십시오’는 현대 표준 한국어의 합쇼체로 자연스럽고, ‘그의 비밀을 드러낸다면’도 문맥에 적합합니다. ‘결코 그를 뒤쫓지 않을 것입니다’가 원문의 강한 부정과 결과 진술을 더 직접적으로 반영합니다.
  terminology: ‘아끼고’, ‘신실하십시오’, ‘비밀’은 관계적 신의와 비밀 누설이라는 지혜문학의 문맥을 잘 살립니다. 각주 현행 대안은 본문과 실질적으로 같은 뜻인데도 금지 해석을 언급하므로, 실제 금지형 대안을 제시해야 합니다.
  issues:
  - severity: medium
    issue: 마지막 절에 ‘못할 것입니다’를 사용함
    rationale: καταδιώξῃς 앞의 οὐ μή는 강한 부정이지만, ‘할 수 없다’라는 능력 또는 불가능 표지는 원문에 없습니다. 결과적 예언으로서 ‘결코 … 않을 것입니다’가 더 정확합니다.
  - severity: medium
    issue: 각주의 대안 번역이 금지 해석을 반영하지 않음
    rationale: ‘그를 뒤따르지 못할 것입니다’는 본문과 마찬가지로 결과 진술이며, 각주 설명의 ‘금지’ 독법에 대응하지 않습니다. 금지 독법의 대안은 ‘그를 뒤쫓지 마십시오’여야 합니다.
  revised_text: 친구를 아끼고 그에게 신실하십시오. 그러나 그의 비밀을 드러낸다면, 결코 그를 뒤쫓지 않을 것입니다.[a]
