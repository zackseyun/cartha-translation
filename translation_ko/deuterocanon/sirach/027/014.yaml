  text: 맹세를 많이 하는 사람의 말은 머리카락을 곤두서게 하고[a], 그들의 다툼은 귀를 막게 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 πολυκόρυφου는 어휘적으로 뜻이 어렵습니다. 과도하게 맹세하거나 저주를 일삼는 사람을 가리킬 수 있으며, 더 넓게는 요란하고 거칠거나 허풍스러운 말을 하는 사람을 뜻할 수도 있습니다. 본문은 문맥상 ‘맹세를 많이 하는 사람’으로 옮겼으나, 정확한 뉘앙스는 확실하지 않습니다.
    reason: lexical_alternative
