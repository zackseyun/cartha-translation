    text: Greek πολυκόρυφου is lexically difficult. It may refer to a person given to excessive swearing or cursing, or more broadly to loud, outrageous, or boastful speech. The main text adopts 'one who swears much' as the best contextual fit, but the exact nuance is uncertain.
    reason: lexical_alternative
