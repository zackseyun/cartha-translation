base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/027/030.yaml
  text: Resentment and anger—these also are abominations[b][a], and a sinful man will cling to them.
  footnotes:
  - marker: a
    text: Or 'wrath and anger'; Μῆνις can carry the sense of deep-seated or vengeful anger, while ὀργή is a more general term for anger.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'a sinful man will be ἐγκρατής of them.' The expression is difficult; here it is taken to mean that he clings to or retains these vices.
    reason: alternative_reading
translation:
  language: ko
  text: 분노와 격분—이것들도 가증한 것들입니다. 죄인인 사람은 그것들을 붙들고 있습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μῆνις
  english_pob_choice: resentment
  chosen_korean: 분노
  alternatives_korean:
  - 원한
  - 앙심
  - 격한 분노
  lexicon: LSJ
  rationale: Μῆνις는 단순한 순간적 화보다 깊이 쌓인 적대감을 가리킬 수 있어, 현대 한국어에서 자연스럽고 지속성을 살리는 ‘분노’로 옮겼습니다.
- source_word: ὀργή
  english_pob_choice: anger
  chosen_korean: 격분
  alternatives_korean:
  - 분노
  - 화
  - 노여움
  lexicon: LSJ
  rationale: 바로 뒤의 Μῆνις와 구별되도록 더 즉각적이고 격한 감정을 나타내는 ‘격분’을 선택했습니다.
- source_word: βδελύγματα
  english_pob_choice: abominations
  chosen_korean: 가증한 것들
  alternatives_korean:
  - 가증한 일들
  - 혐오스러운 것들
  - 역겨운 것들
  lexicon: LSJ
  rationale: 도덕적·종교적 혐오를 담는 복수 명사를 한국어에서 가장 직접적으로 살리는 표현은 ‘가증한 것들’입니다.
- source_word: ἐγκρατὴς ἔσται αὐτῶν
  english_pob_choice: will cling to them
  chosen_korean: 그것들을 붙들고 있습니다
  alternatives_korean:
  - 그것들을 꽉 붙잡을 것입니다
  - 그것들에 자제력을 보일 것입니다
  - 그것들에 얽매일 것입니다
  lexicon: LSJ
  rationale: ἐγκρατής의 직역인 ‘자제하다’는 여기서 문맥에 맞지 않으므로, 죄인이 그 악한 감정들을 계속 ধরে থাকে는 뜻을 자연스럽게 드러내는 ‘붙들고 있습니다’를 택했습니다.
theological_decisions:
- issue: ἐγκρατής의 역설적 용법
  chosen_reading: 죄인이 악한 감정들을 ‘자기 것처럼 붙들고’ 있는 상태로 표현했습니다.
  alternative_readings:
  - 자제하고 있다
  - 그것들에 지배당하고 있다
  rationale: 본문은 덕목으로서의 절제를 말하지 않고 죄인이 분노와 격분을 놓지 않는다는 비판을 말하므로, 긍정적 의미의 ‘자제’는 피하고 부정적 집착을 드러냈습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 3, 6
