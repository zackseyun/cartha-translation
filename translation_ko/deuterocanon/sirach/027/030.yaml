  rationale: 미래형을 보존하고, Μῆνις와 ὀργή의 의미상 대비를 ‘원한과 분노’로 분명히 했습니다. ‘붙들 것입니다’는 영어 POB의 ‘cling to them’ 및 문맥상 가능한 해석을 자연스럽게 반영하며, 난해한 원문 표현은 주석으로 투명하게 처리했습니다.
