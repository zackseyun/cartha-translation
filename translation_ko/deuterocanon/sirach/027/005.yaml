base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/027/005.yaml
  text: A potter’s vessels are tested by the kiln[a], and likewise a man by his reasoning.
  footnotes:
  - marker: a
    text: Or “by his thoughts” or “in his deliberation”; the Greek parallel reads “in his deliberation.”
    reason: lexical_alternative
translation:
  language: ko
  text: 토기장이의 그릇은 가마로 시험받고, 사람도 자기 숙고로 그러합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “자기 생각으로”, “자기 의논 가운데”; 그리스어 평행본문은 “자기 숙고 가운데”로 읽습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּלֵי יוֹצֵר
  english_pob_choice: A potter’s vessels
  chosen_korean: 토기장이의 그릇
  alternatives_korean:
  - 토기장이의 기물
  - 도공의 그릇
  lexicon: HALOT
  rationale: כְּלֵי יוֹצֵר는 ‘토기장이의 그릇들’이라는 구체적 이미지이므로, 한국어에서도 자연스럽게 소유격 구조로 옮겨 이미지와 관계를 보존했습니다.
- source_word: לְבָעֵר כִּבְשָׁן
  english_pob_choice: are tested by the kiln
  chosen_korean: 가마로 시험받고
  alternatives_korean:
  - 가마에 의해 시험받고
  - 가마에서 불려지고
  - 가마로 검증받고
  lexicon: HALOT; Greek parallel δοκιμάζει κάμινος
  rationale: 히브리어는 압축적 표현이고, 평행한 그리스어가 ‘가마가 시험한다’는 뜻이므로, 한국어에서는 피동 표현으로 풀어 ‘시험받고’라고 옮겨 도자기가 불에 의해 드러나는 의미를 살렸습니다.
- source_word: עַל חֶשְׁבּוֹנוֹ
  english_pob_choice: by his reasoning
  chosen_korean: 자기 숙고로
  alternatives_korean:
  - 자기 생각으로
  - 자기 논리로
  - 자기 사유로
  lexicon: HALOT; LXX διαλογισμῷ
  rationale: חֶשְׁבּוֹן은 계산, 생각, 숙고의 범위를 가지며, 그리스어 평행이 ‘숙고/생각’ 쪽을 지지하므로 ‘자기 숙고로’가 의미를 가장 직접적으로 드러냅니다.
theological_decisions:
- issue: 인간의 분별이 드러나는 기준의 표현
  chosen_reading: 사람도 자기 숙고로 그러합니다
  alternative_readings:
  - 사람도 자기 생각으로 그러합니다
  - 사람도 자기 의논으로 그러합니다
  rationale: 본문은 도덕적 판단보다 내면의 숙고 과정이 사람을 드러낸다는 비유이므로, ‘숙고’로 번역해 사유의 시험이라는 긴장을 보존했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy
