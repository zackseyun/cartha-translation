  text: For just as a man has destroyed his enemy[a], so you have destroyed the friendship of your neighbor;
  footnotes:
  - marker: a
    text: Or, 'so you have ruined your neighbor's friendship' or 'so you have destroyed friendship with your neighbor.' The Greek genitive τοῦ πλησίον can be understood either as the friendship belonging to the neighbor or as friendship involving the neighbor.
    reason: lexical_alternative
translation:
  language: ko
  text: 곧 사람이 자기 원수를 없애듯이, 당신은 이웃과의 우정을 없애 버렸습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 속격 τοῦ πλησίον은 ‘이웃의 우정’ 또는 ‘이웃과의 우정’으로 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς γὰρ
  english_pob_choice: For just as
  chosen_korean: 곧 …듯이
  alternatives_korean:
  - 왜냐하면 …처럼
  - 마치 …듯이
  lexicon: LSJ
  rationale: 비교와 논증의 흐름을 함께 살리기 위해, 인과를 드러내는 ‘곧’과 비교 표지 ‘-듯이’를 결합해 원문의 구조를 자연스럽게 반영했습니다.
- source_word: ἀπώλεσεν / ἀπώλεσας
  english_pob_choice: has destroyed / you have destroyed
  chosen_korean: 없애 버렸습니다
  alternatives_korean:
  - 파괴했습니다
  - 망하게 했습니다
  - 없앴습니다
  lexicon: BDAG
  rationale: ἀπόλλυμι의 강한 ‘파멸/멸실’ 뉘앙스를 살리되, 현대 한국어에서 관계를 완전히 끊어 놓는 힘을 자연스럽게 전달하는 표현으로 옮겼습니다.
- source_word: τὴν φιλίαν
  english_pob_choice: the friendship
  chosen_korean: 우정
  alternatives_korean:
  - 친교
  - 친구 관계
  - 우호
  lexicon: LSJ
  rationale: φιλία는 단순한 감정이 아니라 실제적인 우정/우호 관계를 가리키므로, 본문이 말하는 깨진 관계성을 가장 सीधे하게 드러내는 ‘우정’을 택했습니다.
- source_word: τοῦ πλησίον
  english_pob_choice: of your neighbor
  chosen_korean: 이웃과의
  alternatives_korean:
  - 이웃의
  - 이웃에 대한
  - 이웃과 맺은
  lexicon: BDAG
  rationale: 속격 τοῦ πλησίον은 ‘이웃의 우정’과 ‘이웃과의 우정’ 둘 다 가능하므로, 한국어에서는 관계를 분명히 하면서도 원문의 모호성을 크게 훼손하지 않는 표현으로 처리했습니다.
theological_decisions:
- issue: 원수와 이웃의 평행 대비
  chosen_reading: 원수를 없애는 행위와 이웃과의 우정을 없애는 행위를 같은 강도로 평행시켰습니다.
  alternative_readings:
  - 원수를 물리치는 것과 이웃과의 사이가 나빠지는 것을 대비할 수 있습니다.
  - 원수를 제거하는 것처럼 이웃과의 우정도 잃게 된다는 식으로 약하게 옮길 수 있습니다.
  rationale: 본문은 단순한 관계 악화가 아니라, 원수를 멸하는 것과 같은 파괴적 결과를 강조합니다. 따라서 대조의 충격을 약화시키지 않도록 강한 동사를 유지했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 5
