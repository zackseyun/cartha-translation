  yaml_path: translation/deuterocanon/sirach/027/023.yaml
  text: Before your eyes his mouth speaks sweetly[a], and he will marvel at your words; but afterward he will twist his mouth and, in regard to your words, he will cause offense.
  footnotes:
  - marker: a
    text: Or 'he will give a stumbling block from your words' / 'he will use your words to trip you up.' The Greek σκάνδαλον can denote an offense or a cause of stumbling.
    reason: lexical_alternative
translation:
  language: ko
  text: 당신의 눈앞에서는 그의 입이 달콤한 말을 하고, 그는 당신의 말을 두고 감탄할 것입니다. 그러나 뒤에는 자기 입을 비틀고, 당신의 말과 관련하여 걸림돌을 놓을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신의 말을 이용하여 걸림돌을 놓을 것입니다.’ 헬라어 σκάνδαλον은 ‘걸림돌’, ‘실족하게 하는 것’, 또는 해를 일으키는 일을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέναντι τῶν ὀφθαλμῶν σου
  english_pob_choice: Before your eyes
  chosen_korean: 네 눈앞에서는
  alternatives_korean:
  - 네 앞에서는
  - 네가 보는 앞에서는
  lexicon: LSJ
  rationale: 직접적인 현존의 뉘앙스를 살리면서도 한국어에서 자연스러운 관용으로 옮겼습니다.
- source_word: γλυκανεῖ στόμα σου
  english_pob_choice: his mouth speaks sweetly
  chosen_korean: 그의 입이 달콤하게 말하고
  alternatives_korean:
  - 그의 입을 달게 하고
  - 그의 말이 달콤하고
  lexicon: LSJ
  rationale: 입과 말의 신체적 이미지를 유지하되, 한국어에서는 ‘달콤하게 말하다’가 가장 자연스럽게 그 비유를 드러냅니다.
- source_word: ἐκθαυμάσει
  english_pob_choice: he will marvel
  chosen_korean: 감탄하지만
  alternatives_korean:
  - 몹시 감탄하지만
  - 매우 놀라워하지만
  lexicon: LSJ
  rationale: 과장된 칭찬과 놀라움을 나타내는 동사로서 ‘감탄하다’가 무난하고 문맥상 적절합니다.
- source_word: δώσει σκάνδαλον
  english_pob_choice: he will cause offense
  chosen_korean: 걸림돌이 되게 할 것입니다
  alternatives_korean:
  - 실족하게 할 것입니다
  - 분노를 일으킬 것입니다
  - 오해를 불러일으킬 것입니다
  lexicon: BDAG
  rationale: σκάνδαλον의 핵심은 단순 불쾌감보다 ‘넘어지게 하는 장애’에 있으므로, 문맥을 반영해 ‘걸림돌’로 옮겼습니다.
theological_decisions:
- issue: δώσει σκάνδαλον의 의미 범위
  chosen_reading: 단순한 감정적 ‘오해’보다, 말이 사람을 넘어지게 하거나 해가 되게 만드는 ‘걸림돌’의 의미를 본문에 반영했습니다.
  alternative_readings:
  - 그가 네 말을 듣고 기분 나빠할 것입니다
  - 그가 네 말로 실족할 것입니다
  rationale: 지혜문학 맥락에서 σκάνδαλον은 해를 끼치거나 넘어지게 하는 결과를 가리킬 수 있으므로, 그 강한 함의를 보존했습니다.
  doctrine_reference: 지혜문학의 언어 사용과 윤리적 경고
