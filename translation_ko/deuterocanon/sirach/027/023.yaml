revisions:
- from: 네 눈앞에서는 그의 입이 달콤하게 말하고, 그는 네 말을 보고 감탄하지만, 나중에는 자기 입을 비틀어 네 말로 인해 걸림돌이 되게 할 것입니다.[a]
  to: 당신의 눈앞에서는 그의 입이 달콤한 말을 하고, 그는 당신의 말을 두고 감탄할 것입니다. 그러나 뒤에는 자기 입을 비틀고, 당신의 말과 관련하여 걸림돌을 놓을 것입니다.[a]
  rationale: 현대 합쇼체에 맞추어 2인칭 표현을 정비하고, ‘입’의 이미지는 유지하면서 한국어 문장을 자연스럽게 다듬었습니다. 마지막 절은 δώσει σκάνδαλον의 능동성을 ‘걸림돌을 놓다’로 반영했으며, ἐν τοῖς λόγοις σου의 수단·관련성에 관한 여지는 ‘당신의 말과 관련하여’ 및 각주에서 보존했습니다.
  reviewer_model: gpt-5.6-terra
