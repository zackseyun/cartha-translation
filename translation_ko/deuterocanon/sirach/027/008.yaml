  to: 의를 추구하면 그것을 얻고, 영광의 긴 옷처럼 그것을 입게 됩니다.[a]
  rationale: τὸ δίκαιον의 해석상 열려 있는 윤리적·관계적 범위를 보존하기 위해 ‘정의’를 ‘의’로 수정했습니다. καταλήμψῃ는 추구하는 대상을 성공적으로 얻는다는 문맥에 맞게 ‘얻고’로 옮겼습니다. 나머지 의복 비유와 영광의 속격 표현은 원문의 이미지와 의미를 충실히 유지합니다.
