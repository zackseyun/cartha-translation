base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/027/008.yaml
  text: If you pursue righteousness[a], you will attain it, and put it on like a robe of glory.
  footnotes:
  - marker: a
    text: Or 'what is right'; alternatively, 'justice.' The Greek expression is broad enough to include both personal righteousness and just conduct.
    reason: lexical_alternative
translation:
  language: ko
  text: 정의를 추구하면 그것을 붙잡게 되고, 영광의 긴 옷처럼 그것을 입게 됩니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘옳은 것’; 넓게는 ‘의’도 가능합니다. 그리스어 표현은 개인적 의로움과 올바른 행위를 함께 포함할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: διώκῃς
  english_pob_choice: pursue
  chosen_korean: 추구하면
  alternatives_korean:
  - 좇으면
  - 찾으면
  - 따르면
  lexicon: BDAG
  rationale: 계속적이고 적극적인 도덕적 지향을 나타내므로, 단순한 '찾다'보다 '추구하다'가 원문의 힘을 더 잘 살립니다.
- source_word: τὸ δίκαιον
  english_pob_choice: righteousness
  chosen_korean: 정의
  alternatives_korean:
  - 의
  - 옳은 것
  - 의로움
  lexicon: LSJ
  rationale: 헬라어는 개인적 의로움과 바른 행위를 함께 아우를 수 있는 폭넓은 표현이므로, 한국어에서는 문맥상 더 구체적인 '정의'로 옮겨도 무리가 없습니다. 다만 윤리적·관계적 의를 함께 비추는 표현이라는 점을 유지했습니다.
- source_word: ἐνδύσῃ αὐτὸ
  english_pob_choice: put it on
  chosen_korean: 입게 됩니다
  alternatives_korean:
  - 몸에 걸치게 됩니다
  - 옷처럼 입게 됩니다
  lexicon: BDAG
  rationale: 의복 비유를 자연스러운 한국어로 살리기 위해 '입다'를 사용했고, 중간태의 자기 적용 뉘앙스를 반영해 결과형으로 다듬었습니다.
- source_word: ποδήρη δόξης
  english_pob_choice: robe of glory
  chosen_korean: 영광의 긴 옷
  alternatives_korean:
  - 영광의 로브
  - 영광의 예복
  - 영광의 발목까지 내려오는 옷
  lexicon: LSJ
  rationale: ποδήρη는 발까지 내려오는 긴 옷을 가리키므로, 단순히 '옷'보다 '긴 옷'으로 길이를 드러냈습니다. '영광의'는 속격을 그대로 유지해 고양된 비유를 보존합니다.
theological_decisions:
- issue: τὸ δίκαιον의 한국어 범위
  chosen_reading: 정의로 번역하되, 개인적 의와 바른 행위를 함께 떠올리게 하는 폭을 유지합니다.
  alternative_readings:
  - 의
  - 옳은 것
  - 의로움
  rationale: 이 잠언적·지혜문학적 문맥에서는 추상적 'righteousness'보다 실제 삶의 바름과 공적 정의를 함께 환기하는 한국어가 더 적절합니다. 다만 특정 제도적 정의로만 좁히지 않도록 표현을 절제했습니다.
  doctrine_reference: 'DOCTRINE.md: contested moral terms (δικ- 범주를 문맥에 따라 의/정의로 조정)'
