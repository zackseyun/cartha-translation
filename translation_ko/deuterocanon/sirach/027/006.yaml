  verdict: revise
  source_fidelity: 첫 행의 히브리어는 열매가 나무의 가꿈/재배를 드러낸다는 비교의 방향입니다. 초안의 ‘나무의 가꾸임에는 열매가 나타나고’는 단순 발생 관계로 바꾸어 이 드러냄의 관계가 약해집니다. 둘째 행은 히브리어의 חֶשְׁבּוֹן(생각·헤아림)과 יֵצֶר(성향)를 보존하되, 불완전한 ‘한 사람’을 자연스러운 대표 단수로 옮길 수 있습니다. ‘마음’은 히브리어 본문에 명시되어 있지 않으므로 본문에서는 넣지 않고 그리스어 병행문은 각주에서 밝히는 것이 안전합니다.
  naturalness: ‘가꾸임’은 현대 표준어에서 다소 부자연스럽고, ‘사람의 마음의 생각에는 그 성향이 나타납니다’는 소유 관계와 비교 관계가 겹쳐 어색합니다. ‘나무가 어떻게 가꾸어졌는지’와 ‘사람의 생각은 그 사람의 성향’을 사용하면 현대 합쇼체 문장으로 자연스럽고 격언의 대구도 살아납니다.
  terminology: ‘열매’와 ‘성향’은 적절합니다. חֶשְׁבּוֹן은 여기서 ‘생각’으로, יֵצֶר는 교리적 함의를 덧붙이지 않는 ‘성향’으로 처리합니다. 그리스어의 λόγος는 히브리어 본문에 따라 본문에 ‘말’을 삽입할 근거가 되지는 않지만, 병행 읽기로 각주에 제시할 수 있습니다.
