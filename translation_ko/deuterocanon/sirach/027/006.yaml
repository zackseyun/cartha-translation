  text: The fruit shows the cultivation of a tree[a]; so a man's reasoning shows the inclination of his heart.
  footnotes:
  - marker: a
    text: Hebrew 'reasoning ... inclination of one'; the Greek parallel reads 'the word of a man's heart's thought,' supporting the sense that a person's outward expression reveals the inner disposition.
    reason: alternative_reading
translation:
  language: ko
  text: 나무의 가꾸임에는 열매가 나타나고, 그와 같이 사람의 마음의 생각에는 그 성향이 나타납니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘나무의 가꾸임’과 ‘마음의 생각’ 사이에 더 압축된 표현을 쓰며, 그리스어 병행구는 ‘사람 마음의 생각의 말’이라는 방향을 보여 줍니다.
    reason: alternative_reading
lexical_decisions:
- source_word: עֲבֹדַת עֵץ
  english_pob_choice: the cultivation of a tree
  chosen_korean: 나무의 가꾸임
  alternatives_korean:
  - 나무의 일
  - 나무의 경작
  - 나무의 돌봄
  lexicon: HALOT
  rationale: 히브리어의 ‘일/봉사’와 ‘나무’의 결합을 직역하면 어색하므로, 열매로 드러나는 나무의 상태라는 비유를 살려 ‘가꾸임’으로 옮겼습니다. Greek parallel의 γεώργιον ξύλου도 재배·가꿈의 뜻을 뒷받침합니다.
- source_word: פֶרִי
  english_pob_choice: fruit
  chosen_korean: 열매
  alternatives_korean:
  - 산출물
  - 과실
  lexicon: HALOT
  rationale: 본문의 농경 이미지를 자연스럽게 살리는 기본 대응어로 ‘열매’를 택했습니다.
- source_word: חֶשְׁבּוֹן
  english_pob_choice: reasoning
  chosen_korean: 마음의 생각
  alternatives_korean:
  - 생각
  - 헤아림
  - 계산
  - 말
  lexicon: HALOT
  rationale: 히브리어는 생각의 작용뿐 아니라 드러나는 판단을 가리킬 수 있고, 그리스어 병행구의 λόγος ἐνθυμήματος καρδίας ἀνθρώπου는 내면의 생각이 밖으로 표현되는 흐름을 보여 줍니다. 한국어에서는 ‘마음의 생각’으로 옮겨 이 의미를 자연스럽게 살렸습니다.
- source_word: יֵצֶר
  english_pob_choice: inclination
  chosen_korean: 성향
  alternatives_korean:
  - 기울기
  - 지향
  - 성향
  lexicon: HALOT
  rationale: 내면의 빚어진 경향이라는 뜻을 살리되, 신학적 전문용어를 과도하게 불러오지 않도록 ‘성향’으로 옮겼습니다.
theological_decisions:
- issue: 인류 일반을 가리키는 단수 표현
  chosen_reading: 사람의 마음의 생각 / 그 성향
  alternative_readings:
  - 한 사람의 마음의 생각 / 그의 성향
  - 인간의 마음의 생각 / 그 성향
  rationale: 히브리어의 אֶחָד는 문맥상 ‘한 사람/개인’을 가리키는 불완전한 표현이고, Greek parallel은 ἀνθρώπου로 일반적인 인간 단수를 분명히 합니다. 한국어는 자연스러운 대표 단수로 두면서도 남성성에만 국한되지 않게 했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
