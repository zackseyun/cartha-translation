base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/027/007.yaml
  text: Do not praise a man before he speaks his mind[b][a], for this is the test of men.
  footnotes:
  - marker: a
    text: Or 'before reflection' or 'before a man's reasoning is known.' The Greek says literally, 'Before thought/reasoning, do not praise a man.'
    reason: lexical_alternative
  - marker: b
    text: '''Man'' and ''men'' render Greek masculine forms used proverbially for human beings in general.'
    reason: cultural_note
translation:
  language: ko
  text: 사람을 아직 분별하지도 전에 칭찬하지 마십시오. 이것은 사람들을 시험하는 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘분별하다’는 πρὸ λογισμοῦ의 뜻을 풀어 옮긴 것으로, 문자적으로는 ‘생각/숙고 이전에’라는 의미입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘사람’과 ‘사람들’은 그리스어의 남성형 단어를 속담적으로 일반 인간을 가리키는 말로 옮긴 것입니다.
    reason: cultural_note
lexical_decisions:
- source_word: πρὸ λογισμοῦ
  english_pob_choice: before he speaks his mind
  chosen_korean: 아직 분별하지도 전에
  alternatives_korean:
  - 생각하기 전에
  - 판단하기 전에
  - 숙고하기 전에
  lexicon: LSJ
  rationale: πρὸ λογισμοῦ는 단순한 시간 선행이 아니라 사람의 생각과 판단이 드러나기 전을 가리키므로, 한국어에서는 자연스럽게 ‘아직 분별하지도 전에’로 옮겨 의미를 살렸습니다.
- source_word: μὴ ἐπαινέσῃς
  english_pob_choice: Do not praise
  chosen_korean: 칭찬하지 마십시오
  alternatives_korean:
  - 찬양하지 마십시오
  - 좋다고 말하지 마십시오
  lexicon: LSJ
  rationale: 금지형이므로 합쇼체 명령 부정으로 옮겼고, 문맥상 자연스러운 동사인 ‘칭찬하다’를 택했습니다.
- source_word: ἄνδρα
  english_pob_choice: a man
  chosen_korean: 사람을
  alternatives_korean:
  - 한 남자를
  - 어떤 사람을
  lexicon: LSJ
  rationale: 그리스어는 남성형 단수를 쓰지만, 이 속담은 일반적 인간을 가리키는 관용적 표현이므로 한국어에서는 과도한 성별 제한 없이 ‘사람’을 사용했습니다.
- source_word: πειρασμὸς ἀνθρώπων
  english_pob_choice: the test of men
  chosen_korean: 사람들을 시험하는 것입니다
  alternatives_korean:
  - 사람들의 시험입니다
  - 인간을 시험하는 것입니다
  lexicon: LSJ
  rationale: πειρασμός는 여기서 ‘유혹’보다 ‘시험/검증’의 뜻이 분명하므로 ‘시험하다’로 옮겼고, ἀνθρώπων은 속담적 일반성을 살려 복수로 표현했습니다.
theological_decisions:
- issue: 속담적 일반 남성 표현의 처리
  chosen_reading: ‘ἄνδρα’와 ‘ἀνθρώπων’의 남성형을 한국어에서는 포괄적 ‘사람/사람들’로 옮겼습니다.
  alternative_readings:
  - ‘남자’를 반복해 옮김
  - ‘사람’ 대신 ‘인간’ 사용
  rationale: 이 절은 특정 성별을 구분하려는 문맥이 아니라 사람을 평가하기 전 분별의 지혜를 말하는 속담이므로, 한국어 독자에게 자연스럽고 오해를 줄이지 않는 일반화가 적절합니다.
  doctrine_reference: 잠언적 지혜 문맥의 일반 원리
