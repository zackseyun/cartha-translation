  text: Among the senseless[a], watch for the right time; but among the thoughtful, be constant.
  footnotes:
  - marker: a
    text: Or 'Among fools, keep watch for the proper moment; but among the discerning, remain continually.'
    reason: lexical_alternative
translation:
  language: ko
  text: 어리석은 자들 가운데서는 알맞은 때를 살피십시오. 그러나 생각이 깊은 사람들 가운데서는 꾸준히 머무르십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘어리석은 사람들 가운데서는 알맞은 때를 지키십시오. 그러나 분별 있는 사람들 가운데서는 계속 머무르십시오.’
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς μέσον ἀσυνέτων
  english_pob_choice: Among the senseless
  chosen_korean: 어리석은 자들 가운데서는
  alternatives_korean:
  - 무감각한 자들 가운데서는
  - 분별이 없는 자들 가운데서는
  - 어리석은 자들 사이에서는
  lexicon: LSJ
  rationale: ἀσύνετος는 이해력과 분별이 없는 사람들을 가리키므로, 한국어에서는 자연스럽고 문맥상도 맞는 ‘어리석은 자들’을 택했습니다. ‘가운데서는’은 반복되는 εἰς μέσον 구조의 대비를 살립니다.
- source_word: συντήρησον καιρόν
  english_pob_choice: watch for the right time
  chosen_korean: 알맞은 때를 살피십시오
  alternatives_korean:
  - 기회를 지켜보십시오
  - 때를 지키십시오
  - 적절한 순간을 기다리십시오
  lexicon: LSJ
  rationale: καιρός는 단순한 시간이 아니라 적절한 때, 기회를 뜻하므로 ‘알맞은 때’로 옮겼습니다. συντηρέω의 ‘주의 깊게 지켜보다’라는 뉘앙스를 ‘살피십시오’로 살렸습니다.
- source_word: διανοουμένου
  english_pob_choice: the thoughtful
  chosen_korean: 생각이 깊은 사람들
  alternatives_korean:
  - 분별 있는 사람들
  - 사려 깊은 사람들
  - 생각하는 사람들
  lexicon: LSJ
  rationale: διανοέομαι는 곰곰이 생각하고 숙고하는 태도를 가리키므로, 단순 지능보다 내적 숙고를 드러내는 ‘생각이 깊은 사람들’이 적절합니다.
- source_word: ἐνδελέχιζε
  english_pob_choice: be constant
  chosen_korean: 꾸준히 머무르십시오
  alternatives_korean:
  - 계속 함께하십시오
  - 지속적으로 있으십시오
  - 한결같이 머무르십시오
  lexicon: LSJ
  rationale: 동사는 지속성과 계속 머묾을 강조하므로, 문맥상 ‘생각이 깊은 사람들’과의 관계에서 끊임없이 함께 있으라는 뜻으로 ‘꾸준히 머무르십시오’라고 옮겼습니다.
