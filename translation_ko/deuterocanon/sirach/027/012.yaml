  source_fidelity: 첫 대조항의 ἀσυνέτων(복수)은 ‘어리석은 이들’로 잘 반영되었습니다. 그러나 δεύτε 항의 διανοουμένου는 단수 분사이므로 ‘생각이 깊은 사람’으로 옮기는 것이 원문의 수를 더 충실히 보존합니다. ἐνδελέχιζε는 단순히 그곳에 ‘머무르다’보다 그 사람과 지속적으로 교제하거나 함께 지내라는 뜻을 문맥상 드러내는 번역이 적절합니다.
  naturalness: ‘알맞은 때를 살피십시오’는 자연스럽고 καιρός의 ‘적절한 때’라는 뜻을 잘 전달합니다. ‘생각이 깊은 사람과는 늘 함께 지내십시오’는 현대 표준 한국어의 합쇼체로 자연스러우며, 대조되는 권면을 명료하게 합니다.
  terminology: ‘어리석은 이들’은 ἀσύνετος의 이해력·분별 부족이라는 의미를 무리 없이 전달합니다. ‘생각이 깊은 사람’은 διανοούμενος의 숙고하는 성격을 보존하며, 특정 신학적 해석을 덧붙이지 않습니다.
