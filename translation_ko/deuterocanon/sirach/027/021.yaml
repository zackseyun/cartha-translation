  verdict: revise
  source_fidelity: 수정이 필요합니다. καταδῆσαι는 상처를 ‘꿰매다/봉합하다’라기보다 묶어 싸매거나 붕대를 감는 뜻입니다. 또한 ἀποκαλύψας는 완료된 누설 행위를 가리키므로 ‘드러낸 사람’이 더 가깝습니다. 나머지 대조 구조와 마지막 절의 의도적 미명시는 잘 보존되어 있습니다.
  naturalness: ‘상처는 싸맬 수 있고’는 현대 표준어에서 자연스럽고 잠언 문체에도 어울립니다. ‘모욕 뒤에는 화해가 있을 수 있습니다’도 원문의 간결한 병렬과 가능성을 무리 없이 전달합니다.
  terminology: τραῦμα는 ‘상처’, λοιδορία는 ‘모욕’, διαλλαγή는 ‘화해’, μυστήρια는 이 문맥에서 ‘비밀’로 옮긴 것이 적절합니다. ‘희망’의 대상은 본문에서 특정하지 않아야 하므로, 각주도 이를 먼저 밝혀야 합니다.
  issues:
  - severity: medium
    issue: ‘꿰맬 수 있고’는 καταδῆσαι의 의미를 지나치게 좁혀 봉합 행위로 특정합니다.
    rationale: καταδέω는 여기서 상처를 묶어 싸매거나 붕대를 감는 뜻입니다. 모든 상처가 봉합되는 것은 아니므로 ‘싸맬 수 있고’가 원문의 치료 이미지를 더 충실히 보존합니다.
  - severity: low
    issue: ‘비밀을 드러내는 사람’은 ἀποκαλύψας의 완료된 행위의 뉘앙스를 충분히 드러내지 못합니다.
    rationale: 잠언적 일반 진술로 현재형 결과절은 가능하지만, 분사는 비밀을 이미 누설한 사람을 가리킵니다. ‘비밀을 드러낸 사람’이 더 직접적입니다.
  - severity: medium
    issue: 현 각주는 ‘희망’의 대상을 신뢰와 관계 회복으로 사실상 특정합니다.
    rationale: 문맥상 그러한 이해가 유력하지만, 그리스어는 희망의 대상을 명시하지 않습니다. 각주는 이 미명시성을 먼저 보존하고 문맥적 가능성으로 제시해야 합니다.
  revised_text: 상처는 싸맬 수 있고, 모욕 뒤에는 화해가 있을 수 있습니다. 그러나 비밀을 드러낸 사람은 희망을 잃습니다.[a]
