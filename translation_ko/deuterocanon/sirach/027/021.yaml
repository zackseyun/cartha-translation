theological_decisions:
- issue: 마지막 절의 ‘희망’이 무엇을 가리키는지
  chosen_reading: 비밀을 누설한 사람은 신뢰 회복과 관계 회복의 희망을 잃은 것으로 읽었습니다.
  alternative_readings:
  - 개인적 절망 상태로 읽을 수 있습니다.
  - 절대적 의미에서 회복 불가능한 상태로 읽을 수 있습니다.
  rationale: 앞부분이 상처와 모욕은 어느 정도 복구될 수 있음을 말하는 반면, 비밀 누설은 신뢰를 깨뜨리는 행위이므로, 문맥상 ‘관계 회복의 희망 상실’이 가장 설득력 있습니다. 다만 본문이 그 객체를 명시하지 않으므로 본문에는 일반적으로만 남겼습니다.
  doctrine_reference: 문맥이 허용하는 범위 안에서 긴장을 유지합니다.
