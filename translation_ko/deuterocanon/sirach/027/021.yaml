translation:
  language: ko
  text: 상처는 꿰맬 수 있고, 모욕 뒤에는 화해가 있을 수 있습니다. 그러나 비밀을 드러내는 사람은 희망을 잃습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 여기서 ‘희망’은 문맥상 특히 신뢰와 관계의 회복 가능성을 가리키는 것으로 보입니다.
    reason: theological_note
