  text: For a wound may be bound up, and after insults there may be reconciliation; but one who has revealed secrets has lost hope.
  footnotes:
  - marker: a
    text: Or, 'is beyond hope' or 'has despaired.' The Greek leaves unstated what hope is lost; in context it most likely refers to hope of restored trust after betraying a confidence.
    reason: lexical_alternative
translation:
  language: ko
  text: 상처는 싸맬 수 있고, 모욕 뒤에는 화해가 있을 수 있습니다. 그러나 비밀을 드러낸 사람은 희망을 잃습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 무엇에 대한 희망을 잃는 것인지를 명시하지 않습니다. 문맥상 비밀을 누설하여 잃게 된 신뢰나 관계 회복의 희망을 가리킬 가능성이 큽니다.
    reason: lexical_alternative
