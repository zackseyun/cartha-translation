  text: Many have fallen by the mouth of the sword[a], but not as those who have fallen because of the tongue.
  footnotes:
  - marker: a
    text: Greek literally, 'by the mouth of the sword.' Many English versions render the idiom 'by the edge of the sword,' but the more literal wording preserves the verse's contrast with 'the tongue.'
    reason: lexical_alternative
translation:
  language: ko
  text: 많은 이들이 칼의 입에 쓰러졌지만, 혀 때문에 쓰러진 이들만큼은 아닙니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 직역하면 ‘칼의 입으로/입에’입니다. 많은 영어 성경은 관용적으로 ‘칼날에’로 옮기지만, 여기서는 ‘혀’와의 대조를 살리기 위해 더 문자적인 표현을 유지합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  english_pob_choice: Many
  chosen_korean: 많은 이들이
  alternatives_korean:
  - 많은 사람들이
  - 많은 이들
  lexicon: LSJ
  rationale: 수량 형용사 πολλοὶ를 자연스러운 현대 한국어로 옮기되, 잠언적 진술의 일반성을 살려 ‘이들’로 다듬었습니다.
- source_word: ἔπεσαν
  english_pob_choice: have fallen
  chosen_korean: 쓰러졌지만
  alternatives_korean:
  - 떨어졌지만
  - 넘어졌지만
  lexicon: LSJ
  rationale: 직역상의 ‘떨어지다’보다 사람에게 쓰이는 문맥에 맞는 ‘쓰러지다’가 의미를 더 분명히 전달합니다.
- source_word: ἐν στόματι μαχαίρας
  english_pob_choice: by the mouth of the sword
  chosen_korean: 칼의 입에
  alternatives_korean:
  - 칼의 입으로
  - 검의 입에
  - 칼날에
  lexicon: LSJ
  rationale: POB의 영어가 보존한 ‘mouth of the sword’의 직유를 살려, ‘입’과 뒤 절의 ‘혀’ 사이 대조가 드러나도록 했습니다.
- source_word: διὰ γλῶσσαν
  english_pob_choice: because of the tongue
  chosen_korean: 혀 때문에
  alternatives_korean:
  - 말 때문에
  - 혀로 인해
  lexicon: LSJ
  rationale: διά + 대격의 원인 의미를 자연스럽게 풀면서도, 원문의 구체적 신체 이미지인 ‘혀’를 유지했습니다.
theological_decisions:
- issue: 검과 혀의 대비를 추상화하지 않을지
  chosen_reading: ‘칼의 입’과 ‘혀’라는 신체 이미지를 그대로 유지했습니다.
  alternative_readings:
  - ‘칼날에’와 ‘말 때문에’처럼 관용적으로 완화하기
  rationale: 이 구절의 지혜 문학적 힘은 물리적 무기와 파괴적 언어를 직접 대조하는 데 있으므로, 이미지를 약화하지 않는 것이 원문의 의도를 더 잘 반영합니다.
  doctrine_reference: Translation philosophy §§1, 6
