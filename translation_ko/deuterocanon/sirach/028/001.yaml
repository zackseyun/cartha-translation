base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/028/001.yaml
  text: The one who takes vengeance will find vengeance from the Lord, and he will surely keep his sins in mind.[a]
  footnotes:
  - marker: a
    text: The extant Hebrew line supplied for this verse reads, 'Do not dread tomorrow's trouble, for you do not know what a day will bring forth,' which does not match the Greek Sirach text here and appears to reflect a different verse or a transmission mismatch. The translation therefore follows the Greek witness for Sirach 28:1.
    reason: textual_variant
  - marker: b
    text: Or 'he will keep his sins stored up.' The Greek repeats the same verb for emphasis.
    reason: lexical_alternative
translation:
  language: ko
  text: 복수하는 사람은 주님께서 갚아 주시는 것을 만나게 되며, 그는 자신의 죄를 반드시 간직하게 됩니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 제공된 히브리어 줄은 이 절의 그리스어 본문과 맞지 않으며, '내일의 재앙을 두려워하지 말라, 네가 하루가 무엇을 낳을지 알지 못하기 때문이다'라는 다른 전승에 해당하는 것으로 보입니다.
    reason: textual_variant
lexical_decisions:
- source_word: ὁ ἐκδικῶν
  english_pob_choice: the one who takes vengeance
  chosen_korean: 복수하는 사람
  alternatives_korean:
  - 원수를 갚는 사람
  - 보복하는 사람
  lexicon: BDAG
  rationale: 현재분사 구조를 일반적인 행위자를 가리키는 말로 옮겼으며, 본문의 경고성을 살려 ‘복수하는 사람’으로 표현했습니다.
- source_word: παρὰ Κυρίου
  english_pob_choice: from the Lord
  chosen_korean: 주님께서 갚아 주시는 것을
  alternatives_korean:
  - 주님으로부터
  - 주님에게서
  lexicon: BDAG
  rationale: παρά + 속격의 출처 의미를 살리되, 한국어에서는 자연스럽게 ‘주님께서’로 풀어 주어 원문의 대조적 구조를 드러냈습니다.
- source_word: εὑρήσει ἐκδίκησιν
  english_pob_choice: will find vengeance
  chosen_korean: 갚아 주시는 것을 만나게 되며
  alternatives_korean:
  - 복수를 받게 되며
  - 보복을 만나게 되며
  lexicon: BDAG
  rationale: 직역식 ‘복수를 찾다’보다 한국어에서 더 자연스러운 ‘만나게 되다’를 사용하되, 응보를 뜻하는 동작을 약화시키지 않도록 ‘갚아 주시는 것’으로 구체화했습니다.
- source_word: διατηρῶν διατηρήσει
  english_pob_choice: he will surely keep his sins in mind
  chosen_korean: 자신의 죄를 반드시 간직하게 됩니다
  alternatives_korean:
  - 자신의 죄를 반드시 기억하게 됩니다
  - 자신의 죄를 꼭 붙들고 있게 됩니다
  lexicon: BDAG
  rationale: 반복 동사를 ‘간직하다’로 옮겨 단순한 회상보다 지속적 보존의 뉘앙스를 살렸고, 영어 주석이 제시한 강조도 ‘반드시’로 반영했습니다.
theological_decisions:
- issue: 히브리어와 그리스어 본문의 불일치
  chosen_reading: 그리스어 시락 28:1의 문장을 본문으로 옮기고, 히브리어와의 불일치는 각주로 드러냅니다.
  alternative_readings:
  - 히브리어에 따라 '내일의 재앙을 걱정하지 말라…'로 옮김
  rationale: 제공된 히브리어는 잠언 27:1 계열의 문장으로 보이며 본절의 그리스어 내용과 일치하지 않습니다. 따라서 본문은 그리스어 증거를 따르고, 히브리어의 불일치는 투명하게 표시하는 것이 적절합니다.
  doctrine_reference: 'POB 번역 원칙: 본문이 실제로 전하는 증거를 따르되, 본문 간 차이는 숨기지 않고 주석으로 남긴다.'
