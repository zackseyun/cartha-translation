- source_word: διατηρῶν διατηρήσει
  english_pob_choice: he will surely keep his sins in mind
  chosen_korean: 자신의 죄를 반드시 간직하게 됩니다
  alternatives_korean:
  - 자신의 죄를 반드시 기억하게 됩니다
  - 자신의 죄를 꼭 붙들고 있게 됩니다
  lexicon: BDAG
  rationale: 반복 동사를 ‘간직하다’로 옮겨 단순한 회상보다 지속적 보존의 뉘앙스를 살렸고, 영어 주석이 제시한 강조도 ‘반드시’로 반영했습니다.
theological_decisions:
- issue: 히브리어와 그리스어 본문의 불일치
  chosen_reading: 그리스어 시락 28:1의 문장을 본문으로 옮기고, 히브리어와의 불일치는 각주로 드러냅니다.
  alternative_readings:
  - 히브리어에 따라 '내일의 재앙을 걱정하지 말라…'로 옮김
  rationale: 제공된 히브리어는 잠언 27:1 계열의 문장으로 보이며 본절의 그리스어 내용과 일치하지 않습니다. 따라서 본문은 그리스어 증거를 따르고, 히브리어의 불일치는 투명하게 표시하는 것이 적절합니다.
  doctrine_reference: 'POB 번역 원칙: 본문이 실제로 전하는 증거를 따르되, 본문 간 차이는 숨기지 않고 주석으로 남긴다.'
