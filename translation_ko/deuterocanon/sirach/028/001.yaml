  rationale: παρά + 속격의 출처 의미를 살리되, 한국어에서는 자연스럽게 ‘주님께서’로 풀어 주어 원문의 대조적 구조를 드러냈습니다.
- source_word: εὑρήσει ἐκδίκησιν
