base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/028/001.yaml
  text: The one who takes vengeance will find vengeance from the Lord, and he will surely keep his sins in mind.[a]
  footnotes:
  - marker: a
    text: The extant Hebrew line supplied for this verse reads, 'Do not dread tomorrow's trouble, for you do not know what a day will bring forth,' which does not match the Greek Sirach text here and appears to reflect a different verse or a transmission mismatch. The translation therefore follows the Greek witness for Sirach 28:1.
    reason: textual_variant
  - marker: b
    text: Or 'he will keep his sins stored up.' The Greek repeats the same verb for emphasis.
    reason: lexical_alternative
translation:
  language: ko
  text: 복수하는 사람은 주님에게서 보복을 받을 것이며, 자기 죄를 계속 간직할 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 현존하는 히브리어 행은 ‘내일의 재앙을 두려워하지 말라. 하루가 무엇을 낳을지 네가 알지 못하기 때문이다’라고 되어 있습니다. 이는 이 절의 그리스어 본문과 일치하지 않으며, 다른 전승 또는 전승상의 불일치를 반영하는 것으로 보입니다. 그러므로 본문은 그리스어 증거를 따릅니다.
    reason: textual_variant
  - marker: b
    text: 또는 ‘자기 죄를 그대로 보존할 것입니다.’ 그리스어는 같은 동사를 반복하여 강조하며, 죄가 단지 기억되는 것이 아니라 보존되어 남는다는 뜻을 포함합니다.
    reason: lexical_alternative
