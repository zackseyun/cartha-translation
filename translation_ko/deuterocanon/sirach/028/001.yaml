  - severity: low
    issue: 반복 동사의 지속·보존 함의에 대한 주석 부재
    rationale: διατηρῶν διατηρήσει는 같은 동사의 반복으로 강조되며, 죄가 단지 심리적으로 기억되는 것이 아니라 보존되어 남는다는 뜻을 포함합니다. 번역은 간결하게 유지하되 각주에서 이 점을 밝혀 두는 것이 좋습니다.
