  source_fidelity: 본문은 γλῶσσα τρίτη를 해석하지 않고 ‘세 번째 혀’로 보존하며, ἐσάλευσεν과 διέστησεν 및 ἀπὸ ἔθνους εἰς ἔθνος의 반복 구조도 충실히 반영합니다. 다만 주석의 ‘두 혀를 가진 혀’는 한국어로 부자연스럽고 원문의 불명확한 관용을 설명하는 대안으로도 적절하지 않습니다.
  naturalness: 본문의 ‘민족에서 민족으로’는 원문의 반복을 살린 다소 문어적인 표현이지만, 이 문맥에서는 이해 가능하고 적절합니다. ‘흔들어 놓았고/흩어 놓았습니다’도 현대 합쇼체에 자연스럽습니다. 주석은 열거 뒤의 서술 연결과 대안 표현을 다듬을 필요가 있습니다.
