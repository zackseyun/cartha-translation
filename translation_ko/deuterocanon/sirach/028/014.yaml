  lexicon: LSJ
  rationale: 사람들을 불안정하게 만드는 구체적 동작을 살리되, 한국어에서 자연스러운 결과상 표현으로 옮겼습니다.
- source_word: διέστησεν
  english_pob_choice: scattered
  chosen_korean: 흩어 놓았습니다
  alternatives_korean:
