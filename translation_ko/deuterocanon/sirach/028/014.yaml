  - 떼어 놓았습니다
  lexicon: LSJ
  rationale: ‘분리하여 여기저기로 보내는’ 결과를 한국어에서 가장 직접적으로 드러내는 표현으로 보았습니다.
- source_word: ἀπὸ ἔθνους εἰς ἔθνος
  english_pob_choice: from nation to nation
  chosen_korean: 민족에서 민족으로
  alternatives_korean:
