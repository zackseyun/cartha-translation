  - 국민에서 국민으로
  - 백성에서 백성으로
  lexicon: LSJ
  rationale: ἔθνος의 반복을 살리면서, 본문이 말하는 집단 간 이동·분열을 현대 한국어로 자연스럽게 전달했습니다.
theological_decisions:
- issue: γλῶσσα τρίτη의 관용을 본문에서 해석할지 여부
  chosen_reading: 주석에서 가능한 해석을 열어 두고, 본문은 ‘세 번째 혀’로 투명하게 유지했습니다.
  alternative_readings:
  - 비방하는 혀
  - 이간질하는 혀
  - 두 얼굴의 혀
  - 분열을 일으키는 말
  rationale: 원문은 문자적으로 ‘세 번째 혀’라고 말하므로, 해석을 본문에 흡수하지 않고 이미지 자체를 보존하는 것이 원문 우선 원칙에 더 맞습니다.
  doctrine_reference: 번역 철학 §§1, 3, 5
