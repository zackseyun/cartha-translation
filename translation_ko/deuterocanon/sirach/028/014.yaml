translation:
  language: ko
  text: 세 번째 혀는 많은 사람을 흔들어 놓았고, 그들을 민족에서 민족으로 흩어 놓았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘비방하는 혀’, ‘두 혀를 가진 혀’, 더 넓게는 ‘분열을 일으키는 말’입니다. 그리스어는 문자적으로 ‘세 번째 혀’라고 되어 있어, 본문에서는 그 이미지를 그대로 드러냈습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: γλῶσσα τρίτη
  english_pob_choice: A third tongue
  chosen_korean: 세 번째 혀
  alternatives_korean:
  - 세 번째 말
  - 이간질하는 혀
  - 두 얼굴의 혀
  lexicon: LSJ
  rationale: Greek의 직역 이미지를 살려 γλῶσσα를 ‘혀’로 두고 τρίτη도 ‘세 번째’로 옮겨, 본문의 낯선 관용을 해석 없이 드러냈습니다.
- source_word: ἐσάλευσεν
