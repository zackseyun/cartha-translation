  yaml_path: translation/deuterocanon/sirach/028/009.yaml
  text: For an angry man kindles strife[a], and a sinful man stirs up friends[b], and among those making peace he casts slander.
  footnotes:
  - marker: a
    text: Or 'hot-tempered man.' The Greek θυμώδης describes one marked by anger or a quick temper.
    reason: lexical_alternative
  - marker: b
    text: Literally 'casts slander' among those making peace; the image is of injecting defamatory speech into a reconciliation.
    reason: lexical_alternative
translation:
  language: ko
  text: 화를 잘 내는 사람은 다툼에 불을 붙이고, 죄 많은 사람은 친구들을 동요시키며, 평화를 이루고 있는 사람들 사이에 비방을 던집니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θυμώδης
  english_pob_choice: angry
  chosen_korean: 분노하는
  alternatives_korean:
  - 화를 잘 내는
  - 화가 난
  - 성급한
  lexicon: LSJ
  rationale: θυμώδης는 분노나 격한 성격을 지닌 사람을 가리키므로, 현재적 성향을 살린 ‘분노하는’이 간결하고 원문의 성격 묘사를 잘 드러냅니다.
- source_word: ἐκκαύσει μάχην
  english_pob_choice: kindles strife
  chosen_korean: 다툼을 불태우고
  alternatives_korean:
  - 다툼을 일으키고
  - 분쟁을 불붙이고
  - 싸움을 격화시키고
  lexicon: LSJ
  rationale: ἐκκαύσει는 ‘불붙이다/태우다’의 이미지가 강하므로, 이를 살려 ‘불태우고’로 옮겼습니다. μάχη는 지혜문맥에서 단순한 몸싸움보다 ‘다툼’이 더 자연스럽습니다.
- source_word: ἁμαρτωλὸς
  english_pob_choice: sinful
  chosen_korean: 죄 많은
  alternatives_korean:
  - 죄인인
  - 악한
  - 죄를 지은
  lexicon: LSJ
  rationale: 형용사적 성격을 유지하기 위해 명사형 ‘죄인’보다 ‘죄 많은’이 원문의 병렬 구조와 더 잘 맞습니다.
- source_word: ταράξει φίλους
  english_pob_choice: stirs up friends
  chosen_korean: 친구들을 뒤흔들며
  alternatives_korean:
  - 친구들을 괴롭히며
  - 친구들을 혼란에 빠뜨리며
  - 친구들을 소란케 하며
  lexicon: LSJ
  rationale: ταράσσω는 뒤흔들다, 동요시키다의 뜻이 있어 관계를 불안정하게 만드는 이미지를 살린 ‘뒤흔들며’가 적절합니다.
- source_word: ἀνὰ μέσον εἰρηνευόντων
  english_pob_choice: among those making peace
  chosen_korean: 평화를 이루는 사람들 사이에
  alternatives_korean:
  - 평화를 만드는 사람들 가운데
  - 화해하는 이들 사이에
  - 평화를 이루려는 이들 가운데
  lexicon: LSJ
  rationale: εἰρηνευόντων은 평화를 이루는 행동을 하는 이들을 가리키므로, 단순 상태보다 행위를 살린 표현으로 옮겼습니다.
- source_word: ἐκβάλλει διαβολήν
  english_pob_choice: casts slander
  chosen_korean: 비방을 던집니다
  alternatives_korean:
  - 비방을 퍼뜨립니다
  - 중상을 던집니다
  - 모함을 던집니다
  lexicon: LSJ
  rationale: ἐκβάλλει의 ‘던지다/내던지다’라는 동작성을 보존하고, διαβολή의 핵심 의미를 ‘비방’으로 옮겨 원문의 거친 이미지를 살렸습니다.
theological_decisions:
- issue: 지혜 격언의 남성 일반화 표현
  chosen_reading: 원문의 남성 단수 보편형을 따라 ‘사람’으로 옮기되, 문장 전체는 성별 특정이 아닌 일반적 경계의 진술로 읽힙니다.
  alternative_readings:
  - 사람
  - 인간
  - 어떤 사람
  rationale: ἄνθρωπος와 ἀνήρ가 모두 남성형이지만 지혜문학의 일반적 경구이므로, 한국어에서는 대표적 일반어인 ‘사람’을 써서 원문의 보편 경고를 살렸습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
