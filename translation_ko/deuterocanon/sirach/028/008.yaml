  source_fidelity: 첫 명령절의 ‘다툼을 피하십시오’는 Ἀπόσχου ἀπὸ μάχης의 의도적인 회피라는 뜻과 μάχη의 대인적 다툼이라는 문맥을 잘 살립니다. 그러나 ἐλαττώσεις는 2인칭 단수 능동 미래형으로, 피명령자가 ‘죄를 줄이게’ 되는 결과를 뜻합니다. 현행 ‘죄가 줄어듭니다’는 죄가 저절로 감소하는 것처럼 표현되어 능동적 주체성을 약화합니다.
  naturalness: ‘다툼을 피하십시오’와 ‘그러면’은 현대 표준 한국어 합쇼체로 자연스럽습니다. 결과절은 ‘그러면 죄를 줄일 것입니다’로 하면 능동 구조와 미래 결과를 자연스럽고 분명하게 드러냅니다.
  terminology: ‘다툼’은 μάχης의 폭넓은 갈등·언쟁의 의미에 적절하며, ‘죄’는 ἁμαρτίας의 도덕적 위반 의미를 유지합니다. 한국어에서 복수 표지를 반드시 반복할 필요는 없으며, 문맥상 일반적 복수의 뜻이 보존됩니다.
