base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/028/005.yaml
  text: He, being flesh, keeps wrath; who then will make atonement for his sins?[c][b][a]
  footnotes:
  - marker: a
    text: The surviving Hebrew for this line is difficult and appears corrupt or highly elliptical in the Cairo Geniza tradition. The Greek reads, 'He himself, being flesh, keeps wrath; who will make atonement for his sins?' The translation follows that recoverable sense.
    reason: textual_variant
  - marker: b
    text: Or 'holds on to resentment.'
    reason: lexical_alternative
  - marker: c
    text: Or 'who will forgive his sins?' The Greek verb more specifically carries the sense of making atonement or expiation.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 자신도 육신이면서 분노를 품고 있으니, 누가 그의 죄들을 속죄하겠습니까?[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 남아 있는 히브리어는 이 행에서 매우 난해하며, 카이로 겐자 전승에서는 훼손되었거나 극도로 축약된 것으로 보입니다. 그리스어는 ‘그 자신이 육신이면서 분노를 간직한다. 누가 그의 죄들을 속죄하겠는가?’라고 읽습니다. 번역은 회복 가능한 이 의미를 따릅니다.
    reason: textual_variant
  - marker: b
    text: 또는 ‘원한을 품고 있으니.’
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘누가 그의 죄들을 용서하겠습니까?’ 그리스어 동사는 더 구체적으로 속죄 또는 속죄의 행위를 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: σὰρξ ὢν
  english_pob_choice: being flesh
  chosen_korean: 육체이므로
  alternatives_korean:
  - 몸이므로
  - 인간의 연약한 존재이므로
  - 육신이므로
  lexicon: BDAG
  rationale: 문맥상 단순한 신체가 아니라 인간의 유한성과 취약성을 가리키므로, ‘육체’로 옮겨 본문의 직접성을 살렸습니다.
- source_word: διατηρεῖ μῆνιν
  english_pob_choice: keeps wrath
  chosen_korean: 분노를 품습니다
  alternatives_korean:
  - 원한을 품습니다
  - 분노를 간직합니다
  - 화를 품습니다
  lexicon: BDAG
  rationale: 지속적으로 분노/원한을 붙들고 있다는 뜻을 자연스럽게 드러내기 위해 ‘품습니다’를 택했습니다.
- source_word: ἐξιλάσεται
  english_pob_choice: make atonement
  chosen_korean: 속죄하겠습니까
  alternatives_korean:
  - 화목하게 하겠습니까
  - 죄를 사하겠습니까
  - 속죄제를 드리겠습니까
  lexicon: BDAG
  rationale: 이 동사는 단순 용서보다 제의적·신학적 속죄의 뉘앙스가 강하므로, 본문이 가진 엄중함을 살려 ‘속죄하다’로 옮겼습니다.
- source_word: τὰς ἁμαρτίας αὐτοῦ
  english_pob_choice: for his sins
  chosen_korean: 그의 죄들을
  alternatives_korean:
  - 그의 죄를
  - 그의 허물들을
  - 그의 범죄들을
  lexicon: BDAG
  rationale: 복수형을 반영해 ‘죄들을’로 옮겼고, 한국어에서는 앞의 동사와 함께 목적어로 간결하게 처리했습니다.
theological_decisions:
- issue: 시라흐 28:5의 전승 난해성과 번역 기반
  chosen_reading: 히브리어 전승이 난해하므로, 본문은 주어진 그리스어 평행본문의 의미를 따라 ‘육체이므로 분노를 품습니다’로 옮겼습니다.
  alternative_readings:
  - 히브리어 조각을 따라 ‘신랑에게 관대합니다’로 읽기
  - 본문을 원문 불확실성 때문에 완전히 다른 뜻으로 재구성하지 않기
  rationale: 카하나 히브리어는 이 절에서 불명료하므로, 확정 가능한 그리스어 의미를 실제 번역 입력으로 삼는 것이 본문 보존에 더 충실합니다.
  doctrine_reference: 'POB 번역 원칙: 회복 가능한 본문 의미를 우선하되, 불확실성은 주석으로 투명하게 남김'
- issue: ἐξιλάσεται의 신학적 뉘앙스
  chosen_reading: ‘속죄하겠습니까’
  alternative_readings:
  - ‘용서하겠습니까’
  - ‘화해시키겠습니까’
  rationale: 이 동사는 관계적 용서보다 속죄/속전의 제의적 의미를 가지므로, 본문이 던지는 수사적 긴장을 유지하기 위해 ‘속죄’로 처리했습니다.
  doctrine_reference: 속죄 관련 어휘는 본문의 문맥과 어휘 범위를 우선함
