translation:
  language: ko
  text: 마지막을 기억하고 적대하기를 그치십시오. 썩어 없어짐과 죽음을 기억하고, 계명들 안에 머무르십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 제시된 히브리어 증언은 이 절과 의미상 맞지 않아, 본문은 그리스어 병행본문을 따랐습니다.
    reason: textual_variant
lexical_decisions:
- source_word: μνήσθητι τὰ ἔσχατα
  english_pob_choice: Remember the end
  chosen_korean: 마지막을 기억하고
  alternatives_korean:
  - 끝을 기억하고
  - 마지막 일들을 기억하고
  lexicon: BDAG
  rationale: 지혜문학의 경구체에서는 τὰ ἔσχατα의 넓은 뜻을 살리되, 한국어로는 간결한 ‘마지막’이 가장 자연스럽고 경고의 무게를 유지합니다.
- source_word: παῦσαι ἐχθραίνων
  english_pob_choice: stop being hostile
  chosen_korean: 적대하기를 그치십시오
  alternatives_korean:
  - 원수 맺기를 그치십시오
  - 적대심을 멈추십시오
  lexicon: BDAG
  rationale: ἐχθραίνων은 단순 감정보다 적대적 태도와 행동을 가리킬 수 있으므로, ‘적대하기를 그치십시오’가 의미 범위를 가장 무리 없이 반영합니다.
- source_word: καταφθοράν
  english_pob_choice: decay
  chosen_korean: 썩어 없어짐
  alternatives_korean:
  - 부패
  - 썩음
  - 훼손
  lexicon: BDAG
  rationale: θάνατον과 병렬된 표현으로서 단순한 도덕적 부패보다 육체적 소멸의 뉘앙스를 살리는 쪽이 더 적절하여, ‘썩어 없어짐’으로 옮겼습니다.
- source_word: ἔμμενε ἐντολαῖς
  english_pob_choice: remain in the commandments
  chosen_korean: 계명들 안에 머무르십시오
  alternatives_korean:
  - 계명들에 머물러 있으십시오
  - 계명들을 지키며 머무르십시오
  lexicon: BDAG
  rationale: ἐντολαῖς에는 소유격이 없으므로 ‘하나님의’는 덧붙이지 않았고, 지속성을 나타내는 ἔμμενε를 현대 한국어의 ‘머무르다’로 직역에 가깝게 살렸습니다.
theological_decisions:
- issue: '본문 기준 선택: 히브리어 대조문의 불일치 처리'
  chosen_reading: 이 절은 그리스어 병행본문을 본문으로 삼고, 히브리어 증언의 불일치는 주석으로 처리했습니다.
  alternative_readings:
  - 히브리어를 직역해 ‘여행자보다 가볍고, 듣기 전에 말을 대답하는 자’로 옮김
  rationale: 제시된 히브리어는 시라 28:6의 그리스어 내용과 의미상 대응하지 않으므로, 본문은 일관된 그리스어 지혜훈계를 따르고 히브리어 차이는 숨기지 않는 편이 번역 윤리에 부합합니다.
  doctrine_reference: 'POB 원칙: 가장 원문에 가까운 증언을 따르되, 소스 불일치는 투명하게 드러낸다.'
