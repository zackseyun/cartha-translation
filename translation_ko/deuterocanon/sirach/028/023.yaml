  source_fidelity: 핵심 구조와 비유는 대체로 충실합니다. 그러나 ἐπʼ αὐτοῖς의 적대적 방향은 ‘그들에게 보내질’보다 ‘그들을 향해 보내질’로 드러내는 편이 정확합니다. 또한 λυμανεῖται는 해치고 황폐하게 한다는 뜻이지 문자적으로 ‘짓밟다’라는 뜻은 아니므로, 기존의 ‘짓밟아 망칠’은 과도하게 구체화합니다.
  naturalness: 합쇼체는 일관되어 있으며 전반적으로 자연스럽습니다. 다만 대명사 관련 각주 표지를 해당 대명사·표현 바로 뒤에 배치하면 문장과 주석의 연결이 명확해집니다. ‘그들을 해칠 것입니다’는 사자와 표범의 비유 속에서도 자연스럽고 원문의 일반적 파괴 의미를 보존합니다.
  terminology: ‘주님’, ‘사자’, ‘표범’은 적절합니다. πάρδαλις의 대안은 막연한 ‘큰 고양잇과 동물’보다 통상적인 대안 명칭인 ‘흑표범’으로 제시하는 것이 영어 POB 감사 기록 및 어휘 선택과 더 잘 부합합니다.
