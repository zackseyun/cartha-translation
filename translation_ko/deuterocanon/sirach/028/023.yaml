  text: Those who forsake the Lord will fall into it[a], and it will burn among them and will certainly not be quenched; it will be sent against them like a lion[c][b], and like a leopard it will ravage them.
  footnotes:
  - marker: a
    text: The pronoun 'it' refers to the destructive power described in the preceding context, especially the tongue's harmful speech.
    reason: cross_reference
  - marker: b
    text: Or 'it will be kindled in them'; the Greek can be read with a more internal sense than 'among them.'
    reason: lexical_alternative
  - marker: c
    text: Or 'like a panther.'
    reason: lexical_alternative
translation:
  language: ko
  text: 주님을 버리는 자들은 그 속으로[a] 떨어질 것이며, 그것은 그들 가운데서[b] 타오르고 결코 꺼지지 않을 것입니다. 그것은 사자처럼 그들을 향해 보내질 것이며, 표범처럼[c] 그들을 해칠 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 앞 문맥의 파괴적인 혀와 말의 이미지를 가리킵니다.
    reason: cross_reference
  - marker: b
    text: 또는 ‘그들 안에서 타오를 것입니다’로도 읽을 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘흑표범’.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ καταλείποντες
  english_pob_choice: Those who forsake
  chosen_korean: 주님을 버리는 자들
  alternatives_korean:
  - 주님을 떠나는 자들
  - 주님을 저버리는 자들
  lexicon: LSJ
  rationale: 관계적·언약적 이탈을 나타내는 동사를 한국어에서는 ‘버리다’가 가장 직접적으로 담아 주며, 대상이 주님이므로 도덕적 배신의 뉘앙스도 살아납니다.
- source_word: ἐμπεσοῦνται εἰς αὐτήν
  english_pob_choice: will fall into it
  chosen_korean: 그 속으로 떨어질 것입니다
  alternatives_korean:
  - 그 안에 빠질 것입니다
  - 그것에 걸려들 것입니다
  lexicon: LSJ
  rationale: 여성형 대명사의 선행사는 앞 문맥의 파괴적 이미지이므로, 여기서는 한국어의 중성적 ‘그것/그 속’을 유지해 문맥 의존성을 보존했습니다.
- source_word: ἐν αὐτοῖς ἐκκαήσεται
  english_pob_choice: it will burn among them
  chosen_korean: 그들 가운데서 타오르되
  alternatives_korean:
  - 그들 안에서 타오르되
  - 그들 가운데 불붙으되
  lexicon: LSJ
  rationale: ἐν αὐτοῖς의 공간적 확장을 살려 ‘가운데서’로 옮겼고, ἐκκαίω의 강한 연소 이미지를 ‘타오르다’로 표현했습니다.
- source_word: ἐξαποσταλήσεται ἐπʼ αὐτοῖς
  english_pob_choice: it will be sent against them
  chosen_korean: 그들에게 보내질 것이며
  alternatives_korean:
  - 그들에게 맞서 보내질 것이며
  - 그들에게로 풀려날 것이며
  lexicon: LSJ
  rationale: 수동 미래형의 ‘보내다’ 의미를 살리되, ἐπί의 적대적 힘은 앞뒤 문맥의 심판 이미지로 드러나게 했습니다.
- source_word: ὡς λέων ... ὡς πάρδαλις
  english_pob_choice: like a lion ... like a leopard
  chosen_korean: 사자처럼 ... 표범처럼
  alternatives_korean:
  - 사자처럼 ... 표범 같은 짐승처럼
  - 사자처럼 ... 표범처럼
  lexicon: LSJ
  rationale: 직유를 그대로 살렸고, πάρδαλις는 통상적이고 이해하기 쉬운 한국어 대응인 ‘표범’으로 옮겼습니다.
theological_decisions:
- issue: 문맥상 ‘it’의 지시 대상
  chosen_reading: 본절 자체에는 선행사가 반복되지 않으므로, 앞 문맥의 파괴적 혀/말의 이미지에 연결되는 중성적 ‘그것’을 유지했습니다.
  alternative_readings:
  - ‘혀’로 본문에 명시
  - 인칭화하여 ‘그녀’로 번역
  rationale: 이 절의 그리스어는 앞선 문맥을 전제하는 대명사를 사용하므로, 본문에 없는 명사를 덧붙이지 않고 한국어의 자연스러운 중성 대명사로 문맥 의존성을 보존하는 것이 적절합니다.
  doctrine_reference: 'Translation philosophy: optimal equivalence; preserve source meaning without paraphrasing beyond what the text warrants.'
