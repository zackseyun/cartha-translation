    text: 또는 ‘가시덤불로 여러분의 소유를 둘러싸고’ 및 ‘여러분의 은과 금을 सुरक्षित하게 하라.’ 그리스어의 이미지는 구체적이고 격언적이어서, 귀중한 것을 조심히 지키라는 뜻을 강하게 전합니다.
