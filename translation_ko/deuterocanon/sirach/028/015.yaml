  source_fidelity: 개정이 필요합니다. γλῶσσα τρίτη는 본문에서 문자적으로 ‘세 번째/제삼의 혀’이며, 그 정확한 관용적 의미에는 해석의 여지가 있습니다. 초안의 ‘중상하는 혀’는 가능한 해석 하나를 본문에 확정하여 원문의 낯선 표현과 남아 있는 모호성을 지웁니다. γυναῖκας ἀνδρείας, ἐξέβαλεν, 그리고 수고의 산물을 빼앗긴다는 나머지 뜻은 대체로 충실합니다.
  naturalness: ‘제삼의 혀’는 현대 일상어에서는 낯설지만, 이 절에서는 원문의 의도적인 난해성을 보존해야 하므로 짧은 주석과 함께 사용할 수 있습니다. ‘강인한 여자들’과 ‘그들이 수고하여 얻은 것’은 표준어 합쇼체 성경 문맥에서 자연스럽고 분명합니다.
  terminology: ‘혀’는 γλῶσσα의 비유적 의인화를 유지합니다. ‘제삼의’는 ‘세 번째’보다 성경적 문체에 무리 없이 원문 형식을 보존합니다. ‘강인한 여자들’은 γυναῖκας ἀνδρείας의 성별 지시와 강함의 뜻을 살리며, ‘그들이 수고하여 얻은 것’은 τῶν πόνων αὐτῶν를 부당하게 특정하지 않으면서 영어 감사 번역의 ‘fruit of their labor’가 밝힌 결과물의 뜻을 자연스럽게 나타냅니다.
