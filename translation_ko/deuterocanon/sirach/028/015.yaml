  rationale: ἀνδρείας는 문자적으로 ‘남자다운/용맹한’ 뜻에서 왔지만 여기서는 여성의 강인함을 말하므로, 과도한 해석을 피하면서도 자연스러운 ‘강한 여자들’로 옮겼습니다.
- source_word: ἐξέβαλεν
