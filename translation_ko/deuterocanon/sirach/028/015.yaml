  lexicon: LSJ
  rationale: 공동체적 관계를 깨뜨려 밖으로 밀어내는 동작을 살리기 위해 ‘몰아내다’를 선택했습니다.
- source_word: ἐστέρεσεν αὐτὰς τῶν πόνων αὐτῶν
  english_pob_choice: has deprived them of the fruit of their labor
  chosen_korean: 그들의 수고의 열매를 빼앗아 갑니다
  alternatives_korean:
  - 그들의 수고를 빼앗아 갑니다
  - 그들이 수고하여 얻은 것을 빼앗아 갑니다
