    text: 또는 ‘분열을 일으키는 혀’, ‘뒤에서 헐뜯는 혀’. 그리스어 본문은 문자적으로 ‘세 번째 혀’라고 하며, 사람들 사이에 끼어들어 갈라놓는 말을 가리키는 관용구로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: γλῶσσα τρίτη
  english_pob_choice: A third tongue
  chosen_korean: 중상하는 혀
  alternatives_korean:
