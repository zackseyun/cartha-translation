  lexicon: LSJ
  rationale: 직역하면 ‘세 번째 혀’이지만, 영어 POB가 주석으로 설명하듯 이 표현은 사람들 사이에 끼어드는 분열적 말씨를 가리키는 관용구이므로, 본문에서는 의미를 드러내는 ‘중상하는 혀’로 옮기고 주석으로 원문 직역을 보완했습니다.
- source_word: γυναῖκας ἀνδρείας
  english_pob_choice: strong women
  chosen_korean: 강한 여자들
  alternatives_korean:
  - 용감한 여자들
