  text: A hastened quarrel kindles fire, and a hasty fight pours out blood.
translation:
  language: ko
  text: 급히 벌어진 다툼은 불을 지피고, 성급한 싸움은 피를 쏟습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔρις
  english_pob_choice: quarrel
  chosen_korean: 다투기
  alternatives_korean:
  - 다툼
  - 언쟁
  - 분쟁
  lexicon: ἔρις
  rationale: 사람들 사이의 갈등을 가리키는 말로, 문맥상 추상적·관계적 다툼을 살려 ‘다투기’로 옮겼습니다.
- source_word: κατασπευδομένη
  english_pob_choice: hastened
  chosen_korean: 급해지면
  alternatives_korean:
  - 재촉되면
  - 서둘러지면
  - 급히 진행되면
  lexicon: κατασπεύδω
  rationale: ‘재촉되다/서두르다’의 결과 상태를 살려, 다툼이 과열되는 상황을 한국어로 자연스럽게 표현했습니다.
- source_word: ἐκκαίει πῦρ
  english_pob_choice: kindles fire
  chosen_korean: 불이 붙고
  alternatives_korean:
  - 불을 지피고
  - 불타오르게 하고
  - 불을 일으키고
  lexicon: ἐκκαίω / πῦρ
  rationale: 직역의 ‘불을 붙이다’도 가능하지만, 속담적 경고문의 힘을 살려 결과를 간결하게 ‘불이 붙고’로 처리했습니다.
- source_word: μάχη κατασπεύδουσα
  english_pob_choice: a hasty fight
  chosen_korean: 성급한 싸움은
  alternatives_korean:
  - 서둘러 벌어진 싸움은
  - 급한 싸움은
  - 재촉된 싸움은
  lexicon: μάχη
  rationale: 첫 절의 ‘급해지면’과 평행을 이루면서, 싸움의 성질이 성급함에 있음을 분명히 했습니다.
- source_word: ἐκχέει αἷμα
  english_pob_choice: pours out blood
  chosen_korean: 피를 쏟게 합니다
  alternatives_korean:
  - 피를 쏟아붓습니다
  - 피를 흘리게 합니다
  - 피를 쏟습니다
  lexicon: ἐκχέω / αἷμα
  rationale: 단순한 유혈이 아니라 폭력의 결과로 피가 ‘쏟아지게’ 되는 점을 드러내어 동사의 강도를 살렸습니다.
theological_decisions:
- issue: 잠언형 경구의 인과와 경고 톤
  chosen_reading: 원문의 비유적 인과관계를 그대로 살려, 다툼과 싸움이 실제 화재와 유혈로 이어질 수 있다는 경고문으로 옮겼습니다.
  alternative_readings:
  - 도덕적 교훈을 약화시켜 일반적 조언처럼 완화하는 읽기
  - 비유를 풀어 설명하는 확장 번역
  rationale: 집회서의 지혜문학적 경고는 이미지의 즉시성과 강도를 유지할 때 가장 잘 전달됩니다.
  doctrine_reference: 지혜문학의 교훈적 경고를 있는 그대로 보존하는 번역 원칙
