  source_fidelity: 첫 절의 κατασπευδομένη는 ‘급해지면’이라는 조건절보다 ‘재촉된/급히 벌어진’ 다툼을 가리키는 분사로 옮기는 편이 원문과 영어 POB의 ‘hastened quarrel’에 가깝습니다. 또한 ἐκκαίει πῦρ는 ‘불이 붙고’보다 다툼이 불을 일으키는 능동 표현으로 보존하는 것이 좋습니다. 둘째 절은 원문의 능동 표현에 맞게 ‘피를 쏟습니다’로 옮깁니다.
