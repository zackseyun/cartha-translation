  terminology: ἔρις는 ‘다툼’, μάχη는 ‘싸움’으로 구별했습니다. ἐκκαίει πῦρ는 관용적으로 ‘불을 지피다’, ἐκχέει αἷμα는 ‘피를 쏟다’로 옮겨 원문의 강한 이미지를 유지했습니다.
