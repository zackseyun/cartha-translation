- source_word: δεσμοῖς αὐτῆς
  english_pob_choice: its chains
  chosen_korean: 그의 사슬
  alternatives_korean:
  - 그의 족쇄
  - 그의 결박
  lexicon: BDAG
  rationale: δεσμός의 구속·속박 의미를 ‘사슬’로 옮겨, 앞의 ‘멍에’와 함께 억압의 병치를 보존했습니다.
theological_decisions:
- issue: 여성형 대명사의 지시 대상
  chosen_reading: 한국어 본문에서는 전후 문맥의 파괴적 혀를 가리키는 인격화된 대상로 보되, 자연스러운 현대문체를 위해 ‘그’로 처리했습니다.
  alternative_readings:
  - ‘그녀’로 옮겨 여성형 문법을 드러내기
  - ‘그것’으로 옮겨 비인격적 힘처럼 처리하기
  rationale: 그리스어 여성형은 직전 문맥의 여성명사에 따른 문법적 일치입니다. 한국어에서는 인격화는 유지하되, 파괴적 혀를 ‘그녀’로 의인화하면 지나치게 어색해질 수 있어 남성형 인칭 대신 중성적 지시 없이 ‘그’를 택했습니다.
  doctrine_reference: '번역 원칙: 문법적 성 구분보다 문맥상의 의미와 한국어 자연성을 우선하되, 인격화 비유는 보존합니다.'
