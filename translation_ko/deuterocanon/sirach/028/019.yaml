  rationale: 여기서는 파괴적 말의 격렬한 폭발을 가리키므로 ‘진노’보다 ‘분노’가 한국어에서 더 직접적이며, 전체 비유와도 잘 맞습니다.
- source_word: ζυγὸν αὐτῆς
  english_pob_choice: its yoke
  chosen_korean: 그의 멍에
