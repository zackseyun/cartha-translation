  lexicon: BDAG
  rationale: σκεπάζω의 보호·덮음 이미지를 살리되, 이어지는 파괴적 맥락에서는 ‘피신하다’가 위험에서 벗어남을 가장 분명하게 전달합니다.
- source_word: θυμῷ
  english_pob_choice: wrath
