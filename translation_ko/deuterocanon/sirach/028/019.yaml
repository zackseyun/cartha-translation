  yaml_path: translation/deuterocanon/sirach/028/019.yaml
  text: Blessed is the one sheltered from it[a], who has not passed through its wrath, who has not drawn its yoke, and has not been bound in its chains.
  footnotes:
  - marker: a
    text: Greek has a feminine pronoun throughout this verse, referring back to the destructive tongue in the preceding context; English uses 'it' for natural style. An alternative is 'from her ... her wrath ... her yoke ... her chains.'
    reason: lexical_alternative
translation:
  language: ko
  text: 복되도다, 그에게서 피신한 이여[a], 그의 분노를 지나가지 않은 이요, 그의 멍에를 메지 않은 이요, 그의 사슬에 매이지 않은 이입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 이 절 전체에서 여성형 대명사를 사용하며, 앞 문맥의 파괴적인 혀를 가리킵니다. 한국어에서는 자연스러운 문체를 위해 ‘그’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριος
  english_pob_choice: Blessed
  chosen_korean: 복되도다
  alternatives_korean:
