translation:
  language: ko
  text: 계명들을 기억하십시오. 그리고 이웃에게 분노하지 마십시오. 지극히 높으신 이의 언약을 기억하고, 무지함은 간과하십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘무지를 지나치십시오’—곧 무지에서 비롯된 잘못을 간과하라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: μνήσθητι
  english_pob_choice: Remember
  chosen_korean: 기억하십시오
  alternatives_korean:
  - 기억하십시오
  - 마음에 새기십시오
  lexicon: LSJ
  rationale: aorist middle imperative의 직접적인 촉구를 살려 현대 합쇼체 명령으로 옮겼습니다.
- source_word: ἐντολῶν
  english_pob_choice: the commandments
  chosen_korean: 계명들
  alternatives_korean:
  - 명령들
  - 율법의 계명들
  lexicon: LSJ
  rationale: 종교윤리적 힘을 살리기 위해 단순한 ‘명령’보다 ‘계명’이 더 적절합니다.
- source_word: μὴ μηνίσῃς τῷ πλησίον
  english_pob_choice: do not be angry with your neighbor
  chosen_korean: 이웃에게 분노하지 마십시오
  alternatives_korean:
  - 이웃에게 화내지 마십시오
  - 이웃을 향해 분노하지 마십시오
  lexicon: LSJ
  rationale: μηνίω의 분노/격노 의미를 반영해 ‘분노하다’로 옮겼고, ethical context에서 πλησίον은 ‘이웃’이 자연스럽습니다.
- source_word: διαθήκην Ὑψίστου
  english_pob_choice: the covenant of the Most High
  chosen_korean: 지극히 높으신 이의 언약
  alternatives_korean:
  - 지극히 높으신 이와의 언약
  - 지극히 높으신 분의 언약
  lexicon: LSJ
  rationale: διαθήκη는 ‘언약’으로, Ὑψίστου는 ‘지극히 높으신 이’로 직역해 신적 칭호의 위엄을 보존했습니다.
- source_word: πάριδε ἄγνοιαν
  english_pob_choice: overlook ignorance
  chosen_korean: 무지함은 간과하십시오
  alternatives_korean:
  - 무지를 간과하십시오
  - 무지에서 비롯된 잘못은 넘기십시오
  lexicon: LSJ
  rationale: πάριδε는 ‘간과하다/못 본 체하다’의 뉘앙스를 살렸고, ἄγνοιαν은 어휘 자체를 따라 ‘무지함’으로 유지했습니다.
theological_decisions:
- issue: 이웃에게 대한 금지의 어조
  chosen_reading: ‘분노하지 마십시오’로 직접적인 윤리적 금지를 유지했습니다.
  alternative_readings:
  - ‘성내지 마십시오’
  - ‘원망하지 마십시오’
  rationale: μηνίω의 핵심은 내적 분노이므로, 감정의 강도를 약화시키는 ‘원망하다’보다 직접적인 금지가 원문에 가깝습니다.
  doctrine_reference: 지혜문학의 윤리적 권고; 분노 절제
- issue: ‘무지함’의 처리
  chosen_reading: 문자적으로 ‘무지함은 간과하십시오’로 유지했습니다.
  alternative_readings:
  - ‘무지에서 비롯된 잘못은 넘기십시오’
  - ‘무지로 인한 허물은 덮어주십시오’
  rationale: 영어 POB처럼 해석적 설명을 본문에 넣지 않고, 본문은 짧게 유지하면서 독자가 오해하지 않도록 ‘간과하십시오’로 여지를 남겼습니다.
  doctrine_reference: 용서와 관용의 지혜문학적 권면
