translation:
  language: ko
  text: 네 이웃의 잘못을 용서하십시오. 그러면 당신이 기도할 때 당신의 죄도 풀릴 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '그리스어: ‘당신의 죄가 풀릴 것입니다.’ ‘풀릴 것입니다’는 underlying metaphor를 보존하며, ‘용서될 것입니다’는 해석적 대안입니다.'
    reason: lexical_alternative
  - marker: b
    text: 제공된 히브리어 증언은 Sirach 28:2의 뜻과 맞지 않으며 다른 재료를 반영하는 것으로 보이므로, 이 절은 그리스어 병행본문을 기준으로 번역했습니다.
    reason: textual_variant
lexical_decisions:
- source_word: ἄφες
  english_pob_choice: Forgive
  chosen_korean: 용서하십시오
  alternatives_korean:
  - 풀어 주십시오
  - 사하여 주십시오
  lexicon: BDAG
  rationale: 이웃에게 한 행위에 대한 직접 명령이므로, 현대 한국어에서 가장 자연스럽고 품위 있게 ‘Forgive’의 명령형을 살릴 수 있는 표현으로 옮겼습니다.
- source_word: τῷ πλησίον σου
  english_pob_choice: your neighbor
  chosen_korean: 네 이웃
  alternatives_korean:
  - 당신의 이웃
  - 가까운 사람
  lexicon: BDAG
  rationale: πλησίον의 윤리적·관계적 용례를 살려 ‘이웃’으로 옮겼고, 합쇼체 문맥 안에서 대상자 지시를 자연스럽게 하기 위해 2인칭 소유를 한국어로 압축했습니다.
- source_word: ἀδίκημα
  english_pob_choice: the wrong
  chosen_korean: 잘못
  alternatives_korean:
  - 죄
  - 불의
  - 해악
  lexicon: BDAG
  rationale: ἀδίκημα는 상대에게 가해진 구체적 잘못/해를 뜻하므로, 종교적 추상어보다 관계적 책임을 분명히 하는 ‘잘못’이 가장 직접적입니다.
- source_word: αἱ ἁμαρτίαι σου λυθήσονται
  english_pob_choice: your sins will be released
  chosen_korean: 당신의 죄도 풀릴 것입니다
  alternatives_korean:
  - 당신의 죄도 용서될 것입니다
  - 당신의 죄도 놓일 것입니다
  lexicon: BDAG
  rationale: λυθήσονται의 핵심 은유가 ‘풀리다/풀어지다’이므로, POB의 ‘released’를 살려 ‘풀릴 것입니다’로 옮겨 은유를 보존했습니다.
theological_decisions:
- issue: Greek parallel versus supplied Hebrew witness
  chosen_reading: 이 절은 그리스어 병행본문을 따라 번역하고, 히브리어 증언과의 불일치는 각주로 밝힙니다.
  alternative_readings:
  - 제공된 히브리어를 본문으로 따라 ‘내일 그가 오고 사라질까 하니…’로 옮김
  rationale: 제공된 히브리어는 이 절의 의미와 맞지 않는 다른 재료로 보이며, 그리스어는 Sirach 28:2의 문맥과 정합적입니다. 따라서 본문은 가장 신뢰할 수 있는 원문 증거를 따르되, 텍스트 전승의 긴장은 숨기지 않습니다.
  doctrine_reference: 'PHILOSOPHY.md: 가장 좋은 원문을 기준으로 직접 번역하되, 본문 전승의 불확실성은 정직하게 기록한다.'
