  text: Forgive your neighbor the wrong he has done, and then, when you pray, your sins will be released[a].[b]
  footnotes:
  - marker: a
    text: 'Greek: ''your sins will be loosed.'' The translation ''released'' preserves the underlying metaphor; ''forgiven'' is a possible interpretive alternative.'
