revisions:
- from: 마치 불의 연료가 그러하듯, 그것도 타오를 것입니다. 사람의 힘에 따라 그의 분노도 그러하고, 그의 재산에 따라 그는 자기의 노를 더 들추며, 싸움의 격렬함에 따라 그것도 타오를 것입니다.[a][b]
  to: 불의 연료[a]에 따라 그것이 타오르듯이, 사람의 힘에 따라 그의 분노도 그러할 것입니다. 그의 재산에 따라 그는 자기의 노를 더 높일 것이며, 싸움의 강도에 따라 그것도 타오를 것입니다.[b]
  rationale: 원문의 κατὰ…κατὰ… 반복 비교를 자연스러운 한국어로 유지하고, ἀνυψώσει의 상승·고조 의미를 바로잡았습니다. 마지막 ‘그것’은 그리스어에서 명시되지 않은 지시 대상을 특정하지 않도록 유지했습니다. 각주 표지는 해당 어휘가 처음 또는 직접 나타나는 위치에 배치했습니다.
