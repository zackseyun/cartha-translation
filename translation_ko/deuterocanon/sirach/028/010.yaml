  - severity: medium
    issue: 첫 절의 비교 표현과 ‘그것’의 연결
    rationale: ‘불의 연료가 그러하듯, 그것도’는 무엇이 ‘그러한지’가 불명료합니다. 원문의 반복적 비교 구조를 유지하면서 한국어 문장 관계를 분명히 해야 합니다.
  - severity: low
    issue: στερέωσιν의 주석 범위
    rationale: ‘격렬함’은 가능한 문맥적 이해이나, 원어의 기본 뜻인 견고함·강도도 주석에서 밝혀 두는 편이 원문의 해석상 여지를 더 잘 보존합니다.
