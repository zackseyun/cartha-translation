  text: As the fuel of a fire, so it will be kindled; according to a man's strength, so will his wrath be; and according to his wealth he will raise up his anger, and according to the firmness of the conflict it will be kindled.
  footnotes:
  - marker: a
    text: Or 'wood' instead of 'fuel' for ὕλην; the Greek more literally refers to the material that feeds a fire.
    reason: lexical_alternative
  - marker: b
    text: The final clause could also be understood more interpretively as 'according to how severe the conflict is, so it will blaze up.'
    reason: lexical_alternative
translation:
  language: ko
  text: 마치 불의 연료가 그러하듯, 그것도 타오를 것입니다. 사람의 힘에 따라 그의 분노도 그러하고, 그의 재산에 따라 그는 자기의 노를 더 들추며, 싸움의 격렬함에 따라 그것도 타오를 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ὕλη는 여기서 ‘나무’보다 넓게, 불을 먹여 타오르게 하는 재료를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 마지막 절은 ‘싸움의 격렬함’ 외에도 ‘싸움이 얼마나 치열한가에 따라’로 풀어 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὕλην πυρός
  english_pob_choice: fuel of a fire
  chosen_korean: 불의 연료
  alternatives_korean:
  - 불을 먹이는 나무
  - 불붙는 재료
  lexicon: LSJ
  rationale: ὕλη는 여기서 불을 유지·확장하는 연료 물질을 가리키므로, 문맥을 살리면서도 자연스러운 ‘불의 연료’로 옮겼습니다.
- source_word: ἐκκαυθήσεται
  english_pob_choice: will be kindled
  chosen_korean: 타오를 것입니다
  alternatives_korean:
  - 불붙을 것입니다
  - 활활 타오를 것입니다
  lexicon: LSJ
  rationale: 수동 미래형의 ‘불이 붙어 타오르는’ 이미지를 살리되, 한국어에서 반복되는 결말에도 자연스럽게 들리는 표현으로 옮겼습니다.
- source_word: θυμὸς αὐτοῦ / ὀργὴν αὐτοῦ
  english_pob_choice: his wrath / his anger
  chosen_korean: 그의 분노 / 자기의 노
  alternatives_korean:
  - 그의 진노 / 그의 분노
  - 그의 화 / 그의 분노
  lexicon: LSJ
  rationale: θυμός와 ὀργή의 어휘 차이를 한국어에서도 어느 정도 살리기 위해 앞 항은 ‘분노’, 뒤 항은 더 직접적인 ‘노’로 옮겼습니다.
- source_word: κατὰ τὸν πλοῦτον
  english_pob_choice: according to his wealth
  chosen_korean: 그의 재산에 따라
  alternatives_korean:
  - 그의 부에 따라
  - 그의 재물에 따라
  lexicon: LSJ
  rationale: πλοῦτος는 단순한 추상적 풍요보다 실제 소유와 사회적 여력을 포함하므로, 현대 독자에게 분명한 ‘재산’을 선택했습니다.
theological_decisions:
- issue: θυμός와 ὀργή의 근접 반복을 한국어에서 어떻게 구분할지
  chosen_reading: 앞의 감정은 ‘분노’, 뒤의 감정은 ‘노’로 처리해 반복을 유지하되 완전히 같은 단어로 흡수하지 않았습니다.
  alternative_readings:
  - 둘 다 ‘분노’로 통일
  - 둘 다 ‘진노’로 통일
  rationale: 지혜문학의 평행구조에서 서로 다른 어휘를 같은 말로 평탄화하면 원문의 수사적 긴장이 약해집니다. 다만 한국어의 자연스러움을 위해 완전한 기술적 구분보다는 절제된 차이를 두었습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 5
