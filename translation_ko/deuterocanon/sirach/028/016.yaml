lexical_decisions:
- source_word: ὁ προσέχων
  english_pob_choice: Whoever pays attention
  chosen_korean: 그것에 주의를 기울이는 사람은
  alternatives_korean:
  - 누구든지 그것에 귀를 기울이는 사람은
  - 그것을 주의 깊게 듣는 사람은
  lexicon: BDAG
  rationale: 관형절의 일반적 의미를 살려 누구에게나 적용되는 표현으로 옮겼고, ‘주의를 기울이다’가 현대 한국어에서 자연스럽게 ‘give heed/pay attention’의 의미를 전달합니다.
- source_word: αὐτῇ
  english_pob_choice: to it
  chosen_korean: 그것에
  alternatives_korean:
  - 그녀에게
  - 그것을
  lexicon: BDAG
  rationale: 여성형 대명사이지만 문맥상 여성 인물이 아니라 앞선 여성형 명사(혀/중상 관련 대상)를 가리키므로 한국어에서는 성 구분 없이 ‘그것’이 적절합니다.
- source_word: ἀνάπαυσιν
  english_pob_choice: rest
  chosen_korean: 안식
  alternatives_korean:
  - 휴식
  - 쉼
  lexicon: BDAG
  rationale: 문맥상 단순한 휴식보다 내적·사회적 평온의 부재를 가리키므로, 지혜문학에서 넓게 쓰이는 ‘안식’이 더 정확합니다.
- source_word: μεθʼ ἡσυχίας
  english_pob_choice: in peace
  chosen_korean: 평안 가운데
  alternatives_korean:
  - 고요함 가운데
  - 조용히
  lexicon: BDAG
  rationale: ἡσυχία의 핵심인 조용함·평온함을 살리되, 한국어에서 자연스럽고 문맥에 맞는 상태 표현으로 ‘평안 가운데’를 택했습니다.
theological_decisions:
- issue: οὐ μὴ εὑρῇ의 강한 부정
  chosen_reading: ‘결코 … 못하고’로 옮겨 emphatic negation을 살렸습니다.
  alternative_readings:
  - ‘반드시 … 찾지 못합니다’
  - ‘절대로 … 찾지 못합니다’
  rationale: οὐ μή + 접속법의 강한 부정을 한국어의 자연스러운 금지/불가능 표현으로 재현하여, 단순한 미래 부정보다 확정적 배제를 드러냅니다.
  doctrine_reference: 문법적 강조(헬라어 부정법)
