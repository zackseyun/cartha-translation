    reason: lexical_alternative
  revision_rationale: 강한 부정과 일반적 주어는 유지하되, ἡσυχία의 ‘고요함’이라는 어휘 의미를 본문에 직접 반영했습니다. 또한 κατασκηνόω의 ‘진을 치다/거하다’라는 구체적 어감은 각주로 보존했습니다.
