translation:
  language: ko
  text: 한 사람이 다른 사람에게 분노를 품으면서도 주께 치유를 구합니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 제공된 히브리어 증거는 “나는 모든 것을 저울판에 달아 보았으나, 겨보다 가벼운 것은 찾지 못했습니다”라고 하여 이 절의 문맥과 내용이 맞지 않습니다. 따라서 번역은 집회서 28:3에 해당하는 그리스어 평행본문을 따랐습니다.
    reason: textual_variant
lexical_decisions:
- source_word: ἄνθρωπος
  english_pob_choice: a man
  chosen_korean: 한 사람
  alternatives_korean:
  - 사람 하나
  - 어떤 사람
  lexicon: BDAG
  rationale: 남성 단수의 대표성을 살리되 한국어에서는 성별을 불필요하게 강조하지 않는 중립적 표현이 자연스럽습니다.
- source_word: συντηρεῖ
  english_pob_choice: keeps
  chosen_korean: 분노를 품으면서도
  alternatives_korean:
  - 분노를 간직하면서도
  - 분노를 유지하면서도
  - 분노를 붙들고 있으면서도
  lexicon: BDAG
  rationale: 지속적으로 감정을 붙들고 있는 상태를 한국어 관용에 맞게 자연스럽게 풀어 옮겼습니다.
- source_word: ὀργήν
  english_pob_choice: anger
  chosen_korean: 분노
  alternatives_korean:
  - 노여움
  - 화
  lexicon: BDAG
  rationale: 일반적이고 강한 감정 상태를 가리키는 말로, 문맥상 ‘anger’의 표준적 대응이 가장 적절합니다.
- source_word: παρὰ Κυρίου
  english_pob_choice: from the Lord
  chosen_korean: 주께
  alternatives_korean:
  - 주님께
  - 주로부터
  lexicon: BDAG
  rationale: παρά + ζητεῖ는 청원/구함의 방향을 나타내므로 한국어에서는 ‘주께’가 가장 자연스럽고 간결합니다.
- source_word: ἴασιν
  english_pob_choice: healing
  chosen_korean: 치유
  alternatives_korean:
  - 회복
  - 낫게 하심
  lexicon: BDAG
  rationale: 신체적·관계적 회복까지 아우를 수 있는 표현으로, ‘healing’의 폭을 무리 없이 반영합니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 평행본문의 불일치
  chosen_reading: 이 절은 문맥에 맞는 그리스어 본문을 따라 ‘한 사람이 다른 사람에게 분노를 품으면서도 주께 치유를 구합니까?’로 옮겼습니다.
  alternative_readings:
  - 히브리어를 문자적으로 따라 ‘나는 모든 것을 저울판에 달아 보았으나, 겨보다 가벼운 것은 찾지 못했습니다’로 옮김
  rationale: 제공된 히브리어는 이 절의 문맥과 내용이 맞지 않으므로, 해당 절에 대응하는 그리스어 증거를 따르는 편이 원문-대응성이 높습니다. 동시에 본문 차이를 숨기지 않도록 명시합니다.
  doctrine_reference: original-language primacy and transparent documentation of source data
