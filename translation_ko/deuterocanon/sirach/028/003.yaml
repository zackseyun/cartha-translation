  rationale: 제공된 히브리어는 이 절의 문맥과 내용이 맞지 않으므로, 해당 절에 대응하는 그리스어 증거를 따르는 편이 원문-대응성이 높습니다. 동시에 본문 차이를 숨기지 않도록 명시합니다.
