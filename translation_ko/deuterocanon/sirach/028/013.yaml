base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/028/013.yaml
  text: Curse the whisperer and the double-tongued[a], for they have destroyed many who were at peace.
  footnotes:
  - marker: a
    text: The extant Hebrew here is difficult and appears to read more literally, 'Spit on it, and it will be quenched,' with a bracketed continuation, 'both of them are from your mouth.' The Greek parallel instead reads, 'Curse the whisperer and the double-tongued,' which is followed in the main text because it gives the clearer sense in context.
    reason: alternative_reading
translation:
  language: ko
  text: 수군거리는 자와 두 혀를 가진 자를 저주하십시오. 그들이 평안하게 지내던 많은 사람들을 멸망하게 했기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 현존 히브리어 본문은 난해하며, 더 문자적으로는 ‘그것에 침을 뱉으라. 그러면 그것이 꺼질 것이다’라고 읽힙니다. 대괄호 안의 이어짐은 ‘둘 다 네 입에서 나온다’라는 뜻입니다. 본문은 문맥상 더 분명한 헬라어 평행문의 ‘수군거리는 자와 두 혀를 가진 자를 저주하라’를 따랐습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: Ψίθυρον
  english_pob_choice: the whisperer
  chosen_korean: 수군거리는 자
  alternatives_korean:
  - 속삭이는 자
  - 헐뜯는 자
  lexicon: BDAG
  rationale: 작은 소리로 몰래 퍼뜨리는 부정적 말의 이미지를 살리면서, 한국어에서 자연스럽고 현대적인 표현으로 옮겼습니다.
- source_word: δίγλωσσον
  english_pob_choice: the double-tongued
  chosen_korean: 혀가 두 개인 자
  alternatives_korean:
  - 이중적인 사람
  - 말을 뒤집는 자
  lexicon: BDAG
  rationale: 직역적 이미지를 유지해 위선적·양면적 말을 드러내며, 관용적 해석보다 원문의 비유를 더 직접적으로 반영합니다.
- source_word: εἰρηνεύοντας
  english_pob_choice: who were at peace
  chosen_korean: 평안하던 많은 사람
  alternatives_korean:
  - 평화롭게 지내던 사람들
  - 평안 가운데 있던 이들
  lexicon: BDAG
  rationale: 현재 상태를 나타내는 분사를 자연스러운 한국어로 풀되, 본문의 ‘평안’ 상태를 분명히 살렸습니다.
- source_word: ἀπώλεσαν
  english_pob_choice: have destroyed
  chosen_korean: 멸망시켰기 때문입니다
  alternatives_korean:
  - 파멸시켰기 때문입니다
  - 망하게 했기 때문입니다
  lexicon: BDAG
  rationale: 단순한 ‘해치다’보다 더 강한 파괴의 결과를 나타내는 동사로, 본문의 경고성을 유지했습니다.
theological_decisions:
- issue: 히브리어 본문과 헬라어 평행문의 큰 차이
  chosen_reading: 본문은 헬라어의 윤리적 경고를 따라 ‘수군거리는 자’와 ‘혀가 두 개인 자’를 저주하라고 번역하고, 히브리어의 난해한 표현은 본문에 반영하지 않았습니다.
  alternative_readings:
  - 히브리어를 따라 ‘불꽃에 입김을 불어넣으라…’로 옮기기
  - 히브리어와 헬라어를 절충해 이중 이미지를 본문에 모두 넣기
  rationale: 여기서는 히브리어가 난해하고 단편적이며, 헬라어가 문맥상 더 완결된 경고를 제공합니다. 본문은 헬라어 의미를 따라 읽고, 텍스트 차이는 각주로 처리하는 것이 가장 투명합니다.
  doctrine_reference: 'PHILOSOPHY.md: 원문 증거를 우선하되, 평행 전승의 긴장은 숨기지 않고 각주로 남긴다.'
