  source_fidelity: 본문은 히브리어 전승과 크게 다른 헬라어 평행문(Ψίθυρον καὶ δίγλωσσον …)을 따른 번역입니다. 제공된 영어 POB의 결정에 맞으며, 히브리어의 ‘침을 뱉으라, 그러면 꺼질 것이다’와 대괄호 속 후속구는 각주에서 보존해야 합니다. 다만 각주는 본문이 헬라어를 따른 사실과 그 이유를 명시하는 편이 전승상의 차이를 더 투명하게 드러냅니다.
  naturalness: ‘혀가 두 개인 자’는 뜻은 전달하지만 현대 한국어에서는 다소 어색하게 들립니다. ‘두 혀를 가진 자’가 원문의 비유를 유지하면서 조금 더 자연스럽습니다. ‘평안하던 많은 사람’도 가능하지만 ‘평안하게 지내던 많은 사람들’이 εἰρηνεύοντας의 지속적 상태를 더 자연스럽게 나타냅니다.
  terminology: ‘수군거리는 자’는 비밀스럽고 해로운 말을 퍼뜨리는 Ψίθυρος의 뜻을 적절히 반영합니다. ‘저주하십시오’는 καταράσθε의 명령을 현대 합쇼체로 충실하게 옮깁니다. ‘두 혀를 가진 자’는 δίγλωσσος의 비유를 보존합니다.
