  rationale: 본문은 ᾅδης를 직접 사용하므로, 후대 교리적 연상을 강하게 만드는 ‘지옥’보다 원어 표지를 보존하는 편이 더 소스-직결적입니다.
  doctrine_reference: Translation philosophy §1, §6
