  text: Its death is an evil death[b][a], and its Hades is more advantageous.
  footnotes:
  - marker: a
    text: Or 'her death is an evil death'; the feminine pronoun refers back to the feminine antecedent in the previous context, likely the tongue or slanderous speech.
    reason: lexical_alternative
  - marker: b
    text: Or 'Hades is better than it' or 'the realm of the dead is preferable to it.'
    reason: alternative_reading
translation:
  language: ko
  text: 그것의 죽음은 악한 죽음이며, 그것의 Hades는 더 유익합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그것의 죽음은 악한 죽음이다’; 여성형 대명사는 앞 문맥의 여성형 선행사, 아마도 혀나 비방하는 말을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘Hades는 그것보다 더 낫다’ 또는 ‘죽은 자들의 세계가 그것보다 더 바람직하다’.
    reason: alternative_reading
lexical_decisions:
- source_word: θάνατος πονηρὸς
  english_pob_choice: an evil death
  chosen_korean: 악한 죽음
  alternatives_korean:
  - 사악한 죽음
  - 끔찍한 죽음
  - 비참한 죽음
  lexicon: LSJ
  rationale: θάνατος를 그대로 ‘죽음’으로 옮기고, πονηρός의 강한 부정성을 살려 ‘악한’으로 옮겼습니다. 너무 완화된 ‘나쁜’보다 원문의 날카로움을 더 잘 드러냅니다.
- source_word: αὐτῆς
  english_pob_choice: its
  chosen_korean: 그것의
  alternatives_korean:
  - 그의
  - 그녀의
  lexicon: LSJ
  rationale: 영어 POB처럼 한국어도 앞선 여성형 선행사를 직역하지 않고, 문맥상 가리키는 대상(혀/비방하는 말)을 중성적으로 받는 ‘그것의’로 옮겼습니다.
- source_word: λυσιτελὴς μᾶλλον
  english_pob_choice: more advantageous
  chosen_korean: 더 유익합니다
  alternatives_korean:
  - 더 유리합니다
  - 더 이롭습니다
  - 더 좋습니다
  lexicon: LSJ
  rationale: λυσιτελής의 핵심은 ‘이롭고 유익한/유리한’이라는 비교적 의미이므로, 문장 전체의 판정적 뉘앙스를 살리는 ‘더 유익합니다’를 선택했습니다. ‘더 좋습니다’는 의미가 약해집니다.
- source_word: ᾅδης
  english_pob_choice: Hades
  chosen_korean: Hades
  alternatives_korean:
  - 무덤
  - 스올
  - 죽은 자들의 세계
  lexicon: LSJ
  rationale: 이 본문은 그리스어 지혜문학의 표현이므로 ᾅδης를 전통적 해석어로 바꾸지 않고 음역 ‘Hades’로 유지했습니다. 이는 원문 용어를 가장 투명하게 보존합니다.
theological_decisions:
- issue: ᾅδης의 번역 유지
  chosen_reading: ‘Hades’를 그대로 두어 음부/저승의 범주를 보존합니다.
  alternative_readings:
  - 무덤
  - 스올
  - 지옥
  rationale: 본문은 ᾅδης를 직접 사용하므로, 후대 교리적 연상을 강하게 만드는 ‘지옥’보다 원어 표지를 보존하는 편이 더 소스-직결적입니다.
  doctrine_reference: Translation philosophy §1, §6
