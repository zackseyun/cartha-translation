base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/028/004.yaml
  text: He has no mercy on a man like himself[b][a], yet he asks for his own sins to be forgiven?
  footnotes:
  - marker: a
    text: The extant Cairo Geniza Hebrew line supplied in Zone 1 appears mismatched for this verse; the translation therefore follows the Greek witness here.
    reason: textual_variant
  - marker: b
    text: Or, more literally, 'and does he pray concerning his sins?' The Greek leaves the requested outcome implicit; the main text makes explicit that he is seeking forgiveness.
    reason: lexical_alternative
translation:
  language: ko
  text: 자기와 같은 사람에게는 자비를 베풀지 않으면서도, 자기 죄를 용서받기를 구합니까?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 현존하는 카이로 게니자 히브리어 본문은 이 절과 맞지 않으므로, 본문은 그리스어 증거를 따랐습니다.
    reason: textual_variant
  - marker: b
    text: 직역하면 ‘자기 죄에 관해 기도합니까?’에 가깝지만, 여기서는 죄 사함을 구하는 뜻이 문맥상 드러납니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπʼ ἄνθρωπον ὅμοιον αὐτῷ
  english_pob_choice: on a man like himself
  chosen_korean: 자기와 같은 사람에게
  alternatives_korean:
  - 자기와 같은 사람에게는
  - 자기와 비슷한 사람에게
  lexicon: LSJ
  rationale: ἄνθρωπον은 남성 단수 형태이지만 여기서는 대표적 의미의 ‘사람’으로 옮기는 것이 자연스럽고, ὅμοιον αὐτῷ는 ‘자기와 같은’으로 밀착해 표현하는 것이 적절합니다.
- source_word: οὐκ ἔχει ἔλεος
  english_pob_choice: has no mercy
  chosen_korean: 자비를 베풀지 않으면서도
  alternatives_korean:
  - 자비가 없으면서도
  - 긍휼을 보이지 않으면서도
  lexicon: BDAG
  rationale: ἔλεος는 문맥상 ‘자비/긍휼’의 뜻이지만, 한국어에서는 동작성을 살린 ‘자비를 베풀다’가 무자비함을 더 분명하게 드러냅니다.
- source_word: καὶ περὶ τῶν ἁμαρτιῶν αὐτοῦ δεῖται
  english_pob_choice: yet he asks for his own sins to be forgiven
  chosen_korean: 자기 죄를 용서받기를 구합니까
  alternatives_korean:
  - 자기 죄에 관해 기도합니까
  - 자기 죄를 두고 간구합니까
  lexicon: BDAG
  rationale: δεῖται는 ‘구하다/간구하다/기도하다’의 폭이 있으나, 문맥상 간구의 대상은 죄 사함이므로 한국어에서는 그 함의를 명시해 수사적 대비를 살렸습니다.
theological_decisions:
- issue: 수사적 질문의 함의 명시 여부
  chosen_reading: 문맥이 분명하게 암시하는 ‘죄 사함’을 본문에 드러내어 번역했습니다.
  alternative_readings:
  - ‘자기 죄에 관해 기도합니까?’처럼 더 직역적으로 남기는 방식
  rationale: 그리스어는 요청의 결과를 직접 말하지 않지만, 문맥상 용서/사함을 구하는 뜻이 자연스럽습니다. 한국어 본문에서 이를 드러내면 반어적 대조가 더 분명해집니다.
  doctrine_reference: 'POB philosophy: explicitness where the source’s implicature is clear and stable'
