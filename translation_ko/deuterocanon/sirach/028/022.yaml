  yaml_path: translation/deuterocanon/sirach/028/022.yaml
  text: It will never overpower the godly[a], and they will not be burned in its flame.
  footnotes:
  - marker: a
    text: Or 'It will never seize the devout.' The Greek verb can denote taking hold of, mastering, or prevailing against.
    reason: lexical_alternative
translation:
  language: ko
  text: 그것은 경건한 사람들을 결코 제압하지 못하며, 그 불꽃 속에서도 그들은 타지 않을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그것은 경건한 사람들을 붙잡지 못한다.’ 헬라어 동사 κρατέω는 ‘붙들다, 지배하다, 제압하다’의 뜻을 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ μὴ κρατήσῃ
  english_pob_choice: will never overpower
  chosen_korean: 결코 제압하지 못하며
  alternatives_korean:
  - 결코 붙들지 못하며
  - 결코 장악하지 못하며
  - 결코 이기지 못하며
  lexicon: BDAG
  rationale: οὐ μή의 강한 부정을 한국어에서는 ‘결코 … 못하다’로 자연스럽게 살리고, κρατέω의 ‘지배하다/제압하다’ 의미를 반영했습니다.
- source_word: εὐσεβῶν
  english_pob_choice: the godly
  chosen_korean: 경건한 사람들을
  alternatives_korean:
  - 경건한 이들을
  - 경외하는 사람들을
  - 경건한 자들을
  lexicon: BDAG
  rationale: εὐσεβής의 핵심은 하나님을 향한 경건함이므로, 현대 한국어에서 자연스러운 ‘경건한 사람들’로 옮겼습니다.
- source_word: ἐν τῇ φλογὶ αὐτῆς
  english_pob_choice: in its flame
  chosen_korean: 그 불꽃 속에서도
  alternatives_korean:
  - 그 불길 속에서도
  - 그 불꽃 가운데서도
  - 그 불의 불꽃 속에서도
  lexicon: BDAG
  rationale: φλόξ는 일반적인 불보다 ‘불꽃/불길’에 가깝기 때문에 ‘불꽃’으로 옮기고, 문맥상 지속되는 위험을 살리기 위해 ‘속에서도’를 더했습니다.
- source_word: καήσονται
  english_pob_choice: will be burned
  chosen_korean: 타지 않을 것입니다
  alternatives_korean:
  - 불타지 않을 것입니다
  - 타 버리지 않을 것입니다
  - 불에 타지 않을 것입니다
  lexicon: BDAG
  rationale: 수동 미래의 결과를 자연스럽게 표현하면서도, 문맥의 보호 약속을 분명히 하기 위해 ‘타지 않을 것입니다’로 번역했습니다.
theological_decisions:
- issue: αὐτῆς의 지시 대상
  chosen_reading: ‘그것’으로 두어, 직전 문맥의 파괴적 불꽃을 가리키는 중성적 지시로 처리했습니다.
  alternative_readings:
  - ‘그녀의’로 의인화하여 옮김
  - ‘그 불길의’로 풀어씀
  rationale: 한국어에서는 파괴적 힘을 인칭화하지 않고도 원문의 비유를 충분히 살릴 수 있으며, 문맥상 불꽃 자체를 가리키는 중성적 지시가 가장 자연스럽습니다.
  doctrine_reference: 문맥 우선의 비유 언어 처리
- issue: οὐ μὴ의 강조
  chosen_reading: ‘결코 … 못하다’로 강한 부정을 살렸습니다.
  alternative_readings:
  - ‘반드시 … 않다’
  - ‘전혀 … 못하다’
  rationale: οὐ μή의 서술적·강조적 부정을 한국어에서 과도하게 직역하면 어색해질 수 있으므로, 의미 강도를 유지하는 자연스러운 현대 문장으로 옮겼습니다.
  doctrine_reference: 헬라어 강조 부정의 한국어 등가 처리
