translation:
  language: ko
  text: 그 앞에 숯불이 있었고, 그가 그것에 입김을 불어넣자 활활 타올랐습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '그리스어 병행문은 이렇게 확장합니다: “만약 네가 불꽃에 숨을 불면 타오를 것이고, 그것에 침을 뱉으면 꺼질 것이다. 둘 다 네 입에서 나옵니다.” 히브리어 증인은 더 짧게 “그 앞에 숯불이 있었고, 그가 그것에 입김을 불어넣자 활활 타올랐습니다.”라고 읽습니다.'
    reason: alternative_reading
lexical_decisions:
- source_word: הָיְתָה לְפָנָיו
  english_pob_choice: There was ... before him
  chosen_korean: 그 앞에 ...이 있었고
  alternatives_korean:
  - 그 앞에 ...이 있었으며
  - 그 앞에 ...이 놓여 있었고
  lexicon: HALOT
  rationale: 히브리어는 존재를 나타내는 절로 시작하므로, 자연스러운 존재 표현인 ‘...이 있었습니다’ 구조를 살렸습니다. לְפָנָיו는 ‘그 앞에’로 옮겨 장면의 위치감을 유지했습니다.
- source_word: גַחֶלֶת
  english_pob_choice: a coal
  chosen_korean: 숯불
  alternatives_korean:
  - 숯덩이
  - 불씨
  lexicon: HALOT
  rationale: 직역상 ‘숯’이나 ‘숯덩이’도 가능하지만, 문맥상 불을 붙일 수 있는 타는 물체라는 점을 드러내기 위해 ‘숯불’을 택했습니다. 이는 본문의 생생한 이미지와 한국어 독자에게 더 자연스럽습니다.
- source_word: נָפַח
  english_pob_choice: he blew on it
  chosen_korean: 입김을 불어넣자
  alternatives_korean:
  - 그가 그것에 불자
  - 그가 그것에 입을 대어 불자
  lexicon: HALOT
  rationale: נפח의 기본 의미인 ‘불다/숨을 불어넣다’를 살리되, 불쏘시개를 살리는 동작을 구체적으로 보여 주는 ‘입김을 불어넣자’를 사용했습니다.
- source_word: וּבָעֲרָה
  english_pob_choice: and it blazed up
  chosen_korean: 활활 타올랐습니다
  alternatives_korean:
  - 불붙었습니다
  - 타올랐습니다
  lexicon: HALOT
  rationale: בער은 단순한 ‘탔다’보다 점화되어 세차게 번지는 느낌이 있어, ‘활활 타올랐습니다’로 이 동작의 강한 진행성을 전달했습니다.
theological_decisions:
- issue: 히브리어 본문을 본문 번역의 기준으로 삼고, 그리스어 병행문의 확장형을 각주로 처리할지 여부
  chosen_reading: 본문은 히브리어의 축약형을 따르고, 그리스어의 ‘만약 네가 불꽃에 숨을 불면 타오르고, 그것에 침을 뱉으면 꺼진다’는 확대형은 각주로 제시합니다.
  alternative_readings:
  - 그리스어 병행문을 본문에 반영해 조건문으로 옮김
  - 각주 없이 히브리어 본문만 제시
  rationale: 현존 히브리어 증거가 더 짧고 직접적이므로 본문은 이를 따르되, 그리스어가 보존하는 속담의 확장형과 대비를 독자가 확인할 수 있도록 각주를 남깁니다.
  doctrine_reference: 본문비평 및 사본 증거 우선 원칙
- issue: 발화 방식의 한국어 어법
  chosen_reading: 서술문 전체를 현대 표준어의 합쇼체로 유지했습니다.
  alternative_readings:
  - 구어체로 완화
  - 전통적 종결어미로 고정
  rationale: 지혜문학의 간결한 관찰 서술을 현대적이면서도 공적 읽기에 적합한 문체로 전달하기 위해 합쇼체를 사용했습니다.
  doctrine_reference: 문체 일관성 원칙
