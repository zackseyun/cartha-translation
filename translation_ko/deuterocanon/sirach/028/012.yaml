  to: 그 앞에 숯불이 있었는데, 그가 그것을 불자 타올랐습니다.[a]
  rationale: 본문은 현존 히브리어 증인의 짧은 서술형을 유지했습니다. 한국어에서는 ‘그것을 불다’가 불을 살리는 동작을 가장 직접적이고 자연스럽게 나타내므로 이를 채택했으며, 불필요한 강화 표현은 피했습니다. 각주는 그리스어의 조건문 확장형과 ‘입에서 나오는’ 두 행위를 분명히 하되, 본문과 병행문의 차이를 보존합니다.
