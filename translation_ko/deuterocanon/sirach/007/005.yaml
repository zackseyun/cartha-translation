translation:
  language: ko
  text: 오만을 그치게 할 힘이 없다면, 통치자가 되려고 하지 마십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 “주님 앞에서 스스로 의롭다 하지 말며, 왕 앞에서 지혜로운 체하지 마십시오”라고 읽으며, 현존하는 히브리어 본문과는 상당히 다릅니다.
    reason: textual_variant
lexical_decisions:
- source_word: אַל תְּבַקֵּשׁ
  english_pob_choice: Do not seek
  chosen_korean: 구하지 마십시오
  alternatives_korean:
  - 찾지 마십시오
  - 추구하지 마십시오
  lexicon: HALOT
  rationale: בקשה의 금지형은 단순한 ‘의지하다’보다 목표를 향한 추구를 뜻하므로, 합쇼체에서 자연스럽고 직접적인 ‘구하다’로 옮겼습니다.
- source_word: לִהְיוֹת מוֹשֵׁל
  english_pob_choice: to become a ruler
  chosen_korean: 지배자가 되기를
  alternatives_korean:
  - 통치자가 되기를
  - 다스리는 자가 되기를
  lexicon: HALOT
  rationale: מוֹשֵׁל은 통치하는 사람을 가리키므로, ‘지배자’가 권력의 자리에 오르려는 야심을 비교적 생생하게 드러냅니다.
- source_word: חַיִל
  english_pob_choice: strength
  chosen_korean: 힘
  alternatives_korean:
  - 능력
  - 역량
  - 권세
  lexicon: HALOT
  rationale: 이 지혜문맥에서는 실제로 일을 감당하고 억제할 수 있는 역량을 가리키므로, 보다 포괄적이고 간결한 ‘힘’으로 옮겼습니다.
- source_word: לְהַשְׁבִּית זָדוֹן
  english_pob_choice: to put an end to insolence
  chosen_korean: 교만을 꺾을
  alternatives_korean:
  - 오만을 끝낼
  - 거만함을 잠재울
  - 불손함을 없앨
  lexicon: HALOT
  rationale: שׁבת의 사역형은 어떤 상태를 멈추게 하는 뜻이며, זָדוֹן은 사악함보다 오만하고 뻔뻔한 태도에 가깝기 때문에 ‘교만을 꺾다’로 압축했습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행본의 큰 차이
  chosen_reading: 살아남은 히브리어 본문을 본문으로 번역하고, 그리스어의 다른 형태는 각주로 제시했습니다.
  alternative_readings:
  - 그리스어에 따라 ‘주님 앞에서 스스로 의롭다 하지 말며, 왕 앞에서 지혜로운 체하지 마십시오’로 번역
  rationale: 집회서는 히브리어가 보존된 경우 그 본문을 우선하되, 여기서는 그리스어가 상당히 다른 형태를 보여 번역의 투명성을 위해 본문과 각주를 분리하는 것이 적절합니다.
  doctrine_reference: 'PHILOSOPHY.md: translate Sirach from Hebrew where it survives; preserve divergent Greek as audit footnote'
