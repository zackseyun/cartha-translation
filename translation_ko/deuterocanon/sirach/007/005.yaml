  terminology: מוֹשֵׁל에는 ‘통치자’가 ‘지배자’보다 중립적이고 문맥에 알맞습니다. זָדוֹן은 여기서 ‘오만’으로 옮겨 과도하게 넓은 ‘사악함’을 피하면서도 원문의 오만한 악행의 뉘앙스를 보존합니다.
