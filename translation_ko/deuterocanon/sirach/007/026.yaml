  lexicon: HALOT
  rationale: 히브리어 형식은 수동 ‘미움받는’도 가능하지만, 여기서는 대구와 뒤의 בָּהּ를 따라 화자 쪽의 감정이 걸린 관계를 드러내는 표현이 더 직접적입니다.
- source_word: אַל תַּאֲמֵן בָּהּ
