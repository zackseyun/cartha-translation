translation:
  language: ko
  text: 아내를 멸시하지 마십시오[a]. 그리고 미워하는 한 사람을 신뢰하지 마십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '그리스어 병행문: ‘당신에게는 마음에 맞는 아내가 있습니까? 그녀를 내쫓지 마십시오.’ 현존 히브리어와 그리스어가 이 절에서 크게 달라, 본문은 히브리어를 따르고 이 주석에 그리스어 대안을 보존합니다.'
    reason: alternative_reading
lexical_decisions:
- source_word: אִשָּׁה לְךָ
  english_pob_choice: wife who is yours
  chosen_korean: 아내
  alternatives_korean:
  - 당신의 아내
  - 자기 아내
  - 한 아내
  lexicon: HALOT
  rationale: 문맥상 לְךָ가 관계적 소속을 나타내므로 일반적인 ‘여자’보다 ‘아내’가 원문과 영어 POB의 해석을 가장 자연스럽게 반영합니다.
- source_word: אַל תְּתַעֲבֶהָ
  english_pob_choice: do not despise
  chosen_korean: 멸시하지 마십시오
  alternatives_korean:
  - 미워하지 마십시오
  - 혐오하지 마십시오
  - 경멸하지 마십시오
  lexicon: HALOT
  rationale: 동사는 강한 거절·혐오의 뜻을 가지며, 현대 한국어의 지시문에서 ‘멸시하다’가 가장 압축적으로 그 강도를 살립니다.
- source_word: וּשְׂנוּאָה
  english_pob_choice: one you hate
  chosen_korean: 미워하는 한 사람
  alternatives_korean:
  - 미워하는 여자
  - 미움받는 여자
  - 미워하는 아내
  lexicon: HALOT
  rationale: 히브리어 형식은 수동 ‘미움받는’도 가능하지만, 여기서는 대구와 뒤의 בָּהּ를 따라 화자 쪽의 감정이 걸린 관계를 드러내는 표현이 더 직접적입니다.
- source_word: אַל תַּאֲמֵן בָּהּ
  english_pob_choice: do not trust one you hate
  chosen_korean: 신뢰하지 마십시오
  alternatives_korean:
  - 믿지 마십시오
  - 의지하지 마십시오
  - 맡기지 마십시오
  lexicon: HALOT
  rationale: אמן 히필은 ‘신뢰하다/믿다’의 의미가 기본이므로 ‘신뢰하다’가 원문의 관계적 경고를 가장 정확히 전달합니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행문의 차이
  chosen_reading: 본문은 히브리어 증거를 따라 ‘아내를 멸시하지 말라’와 ‘미워하는 한 사람을 신뢰하지 말라’로 옮기고, 그리스어 대안은 각주로 보존했습니다.
  alternative_readings:
  - '그리스어: ‘당신에게는 마음에 맞는 아내가 있습니까? 그녀를 내쫓지 마십시오.’'
  rationale: 이 절은 현존 히브리어와 그리스어가 상당히 다르므로, 번역문은 주요 현존 증거인 히브리어를 따르되, 그리스어 전승의 별도 전개를 각주로 남기는 것이 가장 투명합니다.
  doctrine_reference: 'PHILOSOPHY.md: 히브리어가 생존하는 곳에서는 히브리어 우선, 그리스어 병행문은 실제 번역 입력으로 보존'
