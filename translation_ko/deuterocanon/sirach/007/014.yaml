base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/007/014.yaml
  text: Do not chatter in the assembly of rulers[b][a], and do not repeat a word in your prayer.
  footnotes:
  - marker: a
    text: Or 'do not prattle' or 'do not talk excessively.' The Greek parallel likewise warns against idle or excessive speech among elders.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'do not repeat a word in your prayer.' This likely warns against redundant or mechanical repetition, not every form of repeated petition.
    reason: alternative_reading
translation:
  language: ko
  text: 통치자들의 모임에서 떠들지 말고, 기도할 때는 말을 되풀이하지 마십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어와 그리스어 병행은 ‘수다/지나친 말’을 가리키므로, 단순한 발화 금지가 아니라 공적 자리에서의 경박하고 과도한 말을 경계합니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘기도에서 한 말을 반복하지 말라’는 뜻으로, 모든 반복 기도를 금한다기보다 중언부언을 경계하는 표현입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: תְּסַוֵּר / μὴ ἀδολέσχει
  english_pob_choice: chatter
  chosen_korean: 떠들지 말고
  alternatives_korean:
  - 수다떨지 말고
  - 쓸데없이 말하지 말고
  - 말을 과하게 하지 말고
  lexicon: HALOT; LSJ
  rationale: 히브리어와 그리스어 병행은 단순한 ‘말하다’가 아니라 공적 자리에서의 경박하거나 과도한 말을 가리키므로, 현대 한국어에서는 ‘떠들다’가 그 경계와 뉘앙스를 가장 자연스럽게 드러냅니다.
- source_word: בַּעֲדַת שָׂרִים / ἐν πλήθει πρεσβυτέρων
  english_pob_choice: assembly of rulers
  chosen_korean: 통치자들의 모임
  alternatives_korean:
  - 지도자들의 모임
  - 장로들의 회중
  - 통치자들의 회중
  lexicon: HALOT; BDAG
  rationale: 히브리어의 שָׂרִים은 권세자·고관을 가리키며, 그리스어의 ‘장로들’은 대응되는 공적·권위적 집단을 보여 줍니다. 한국어에서는 직역성을 살리되, 종교적 고정용어보다 문맥상 중립적인 ‘모임’이 적합합니다.
- source_word: תִּישֶׁן דָּבָר / δευτερώσῃς λόγον
  english_pob_choice: repeat a word
  chosen_korean: 말을 되풀이하지 마십시오
  alternatives_korean:
  - 한 말을 거듭하지 마십시오
  - 같은 말을 반복하지 마십시오
  - 헛된 말을 되풀이하지 마십시오
  lexicon: HALOT; LSJ
  rationale: 직역의 ‘한 단어를 반복하다’는 한국어에서 부자연스러워, 본문의 핵심인 기도 중의 중언부언 금지를 드러내는 ‘말을 되풀이하다’로 옮겼습니다. 이는 무분별한 반복을 경계하는 뜻을 보존합니다.
- source_word: בַּתְּפִלָּה / ἐν προσευχῇ σου
  english_pob_choice: in your prayer
  chosen_korean: 기도할 때는
  alternatives_korean:
  - 당신의 기도에서
  - 기도 가운데서
  - 기도 중에는
  lexicon: HALOT; NA/Greek parallel
  rationale: 히브리어는 장소보다 상황을, 그리스어는 ‘너의 기도 안에서’라는 구체성을 줍니다. 한국어에서는 자연스럽게 ‘기도할 때는’으로 풀어 주되, 개인적 기도 행위를 분명히 했습니다.
theological_decisions:
- issue: 기도에서의 반복 금지가 모든 반복 기도를 금하는지 여부
  chosen_reading: 본문은 기도 중의 공허하고 기계적인 되풀이를 금하는 것으로 읽고, 간절한 재청과 지속적 기도 전체를 금하지는 않는다고 보존했습니다.
  alternative_readings:
  - 기도의 모든 반복을 금한다
  - 간구의 횟수 자체를 금한다
  rationale: 히브리어와 그리스어 병행 모두 말의 중복을 겨냥하며, 지혜문맥상 핵심은 분량이 아니라 공허한 반복입니다. 본문이 가진 긴장을 해소하지 않고, 과도한 해석을 본문 본문에 덧붙이지 않도록 했습니다.
  doctrine_reference: 지혜문학의 경구적 경고를 기도 신학 전체로 과잉 일반화하지 않음
