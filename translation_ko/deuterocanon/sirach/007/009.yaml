translation:
  language: ko
  text: 군대에 성급하게 들어가지 마십시오. 그것은 하나님이 맡기신 수고로운 일입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 병행본문은 “내 제물의 많은 수를 그가 보리라. 그리고 내가 지극히 높으신 하나님께 바칠 때 그가 그것을 받아들일 것이다”라고 읽으며, 현존 히브리어와는 상당히 다른 전승을 보입니다.
    reason: textual_variant
lexical_decisions:
- source_word: אַל תָּאִיץ
  english_pob_choice: Do not be hasty
  chosen_korean: 성급하게 들어가지 마십시오
  alternatives_korean:
  - 서두르지 마십시오
  - 재촉하지 마십시오
  - 급히 나서지 마십시오
  lexicon: HALOT
  rationale: 부정 명령의 핵심은 앞서 나가거나 성급히 행동하지 말라는 경고이므로, 한국어에서는 자연스럽게 ‘성급하게’와 동사구로 풀어 옮겼습니다.
- source_word: בַּצָּבָא
  english_pob_choice: in the army
  chosen_korean: 군대에
  alternatives_korean:
  - 군역에
  - 군복무에
  - 전쟁터에
  lexicon: HALOT
  rationale: 히브리어 צבא의 기본 의미를 군사 맥락으로 보는 것이 가장 직접적이므로, 본문은 군대 관련 상황으로 번역했습니다.
- source_word: מְלֶאכֶת עֲבֹדָה
  english_pob_choice: laborious work
  chosen_korean: 수고로운 일
  alternatives_korean:
  - 고된 일
  - 힘겨운 노동
  - 수고가 많은 일
  lexicon: HALOT
  rationale: ‘일/노동’의 중첩된 뉘앙스를 한국어로 과도하게 직역하기보다, 부담스럽고 고된 성격을 드러내는 ‘수고로운 일’로 압축했습니다.
- source_word: מֵאֵל נֶחֱלָקָה
  english_pob_choice: allotted by God
  chosen_korean: 하나님이 맡기신
  alternatives_korean:
  - 하나님이 나누어 주신
  - 하나님이 배정하신
  - 하나님께서 분배하신
  lexicon: HALOT
  rationale: 수동형 ‘나누어짐/배분됨’은 단순한 허가보다 하나님에 의한 부여·배정의 뜻이 강하므로, 한국어에서는 ‘맡기신’으로 책임과 지정의 의미를 함께 살렸습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행본문의 차이
  chosen_reading: 현존하는 히브리어 본문을 본문으로 따르고, 그리스어의 다른 전승은 각주로 밝혔습니다.
  alternative_readings:
  - '그리스어 전승: ‘내 제물의 많은 수를 그가 보리라…’로 옮김'
  rationale: 집회서에서는 살아남은 히브리어 증거를 우선하되, 그리스어가 상당히 다른 본문 전승을 보이면 본문을 섞지 않고 차이를 투명하게 드러내는 것이 적절합니다.
  doctrine_reference: 'PHILOSOPHY.md: Sirach는 현존 히브리어 우선, 주요 이본은 각주로 보존'
- issue: ‘하나님’의 행위 표지
  chosen_reading: ‘맡기신’으로 번역해 하나님의 주권적 배정과 책임 부여를 드러냈습니다.
  alternative_readings:
  - ‘보내신’
  - ‘정하신’
  - ‘분배하신’
  rationale: 본문은 단순히 일이 어렵다는 설명이 아니라 그 수고가 하나님께로부터 온 배정이라는 점을 말하므로, 행위 주체를 분명히 하는 표현을 택했습니다.
  doctrine_reference: 섭리와 소명에 대한 본문 내 함의
