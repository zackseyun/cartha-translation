  text: Do not despise an intelligent wife, for her graciousness is better than pearls.
  footnotes:
  - marker: a
    text: 'Greek: ''Do not miss a wise and good woman, for her grace is beyond gold.'' The Hebrew reads ''pearls'' (or another precious jewel) where the Greek has ''gold.'''
    reason: alternative_reading
  - marker: b
    text: Or 'a prudent wife' / 'a wise wife.' The Hebrew term emphasizes insight or good sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 슬기로운 아내를 멸시하지 마십시오. 은혜로운 아내는 진주보다 낫습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 פְּנִינִים는 ‘진주’로 옮길 수 있지만, 그리스어 병행본문은 ‘금’을 읽습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어 אִשָּׁה는 여기서 ‘여자’보다 ‘아내’로 읽는 것이 문맥상 자연스럽습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּמְאַס
  english_pob_choice: Do not despise
  chosen_korean: 멸시하지 마십시오
  alternatives_korean:
  - 거절하지 마십시오
  - 업신여기지 마십시오
  lexicon: HALOT
  rationale: מָאַס는 단순한 거절보다 경멸적 배척의 뉘앙스가 강하므로, 경구의 경고를 살려 '멸시하다'로 옮겼습니다.
- source_word: אִשָּׁה מַשְׁכֶּלֶת
  english_pob_choice: an intelligent wife
  chosen_korean: 지혜로운 아내
  alternatives_korean:
  - 슬기로운 아내
  - 이해력 있는 아내
  - 지각 있는 아내
  lexicon: HALOT
  rationale: שכל는 통찰·슬기·분별을 가리키며, 문맥상 가정적 조언에서 '아내'가 가장 자연스럽기 때문에 '지혜로운 아내'로 간결하게 표현했습니다.
- source_word: וְטוֹבַת חֵן
  english_pob_choice: for her graciousness is better
  chosen_korean: 그녀의 은혜로운 품위는
  alternatives_korean:
  - 그녀의 은총은
  - 그녀의 아름다운 품격은
  - 그녀의 호의는
  lexicon: HALOT
  rationale: חֵן은 단순한 외모가 아니라 호의·매력·은총의 품격을 아우르므로, 문맥의 칭찬을 살려 '은혜로운 품위'로 옮겼습니다.
- source_word: מִפְּנִינִים
  english_pob_choice: than pearls
  chosen_korean: 진주보다 낫습니다
  alternatives_korean:
  - 진주보다 귀합니다
  - 보석보다 낫습니다
  - 산호보다 낫습니다
  lexicon: HALOT
  rationale: פְּנִינִים는 지혜문학에서 값비싼 장신구를 가리키며, 한국어 관용에 가장 익숙한 '진주'를 택했습니다.
theological_decisions:
- issue: '여성 명사의 범위: ''woman'' vs ''wife'''
  chosen_reading: 아내
  alternative_readings:
  - 여자
  - 여인
  rationale: 히브리어 אִשָּׁה는 문맥에 따라 '여자' 또는 '아내'가 될 수 있는데, 가정과 관계의 훈계를 다루는 지혜문학 문맥에서는 '아내'가 더 구체적이고 자연스럽습니다.
  doctrine_reference: 문맥 우선의 의미 결정; 성별 중립화보다 관계적 정확성 우선
- issue: 히브리어의 압축된 병렬 표현 'וְטוֹבַת חֵן'의 처리
  chosen_reading: '''은혜로운 품위''로 의미를 묶어 자연스러운 한국어 문장으로 제시'
  alternative_readings:
  - 직역하여 '그리고 은혜의 선함'
  - '''호의가 좋은'''
  rationale: 히브리어는 매우 압축되어 있어 한국어에서는 형식적 직역보다 의미 단위를 풀어주는 것이 원문 의도를 더 잘 전달합니다. 다만 '진주보다 낫다'라는 비교 구조는 그대로 유지했습니다.
  doctrine_reference: 시적·지혜문학의 압축 표현을 한국어로 자연스럽게 재구성
