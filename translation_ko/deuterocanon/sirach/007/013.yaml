translation:
  language: ko
  text: 거짓말을 되풀이하기를[a] 바라지 마십시오. 그 결과는 좋지 않습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘거짓 위에 거짓을 말하다’에 가깝습니다. 이 표현은 거짓을 거듭하거나 거짓말을 반복한다는 뜻으로 이해됩니다. 그리스어 평행본문은 ‘모든 거짓을 말하다’로 읽어, 거짓을 일삼는다는 더 넓은 의미를 뒷받침합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תַּחְפֹּץ
