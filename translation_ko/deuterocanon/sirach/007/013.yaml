base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/007/013.yaml
  text: Do not desire to repeat a lie[a], for its outcome is not good.
  footnotes:
  - marker: a
    text: Hebrew literally, 'do not desire to lie upon falsehood'; the phrase likely means adding lie to lie or repeating falsehood. The Greek parallel reads 'do not want every lie,' supporting the broader sense of practicing falsehood.
    reason: lexical_alternative
translation:
  language: ko
  text: 거짓말을 되풀이하려고 바라지 마십시오. 그것의 끝은 좋지 않습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 표현은 문자적으로 ‘거짓 위에 거짓을 하다’에 가깝지만, 문맥상 거짓을 거듭하거나 거짓말을 반복하는 뜻으로 이해됩니다. 그리스어 평행본문도 ‘모든 거짓’으로 읽어 이 넓은 의미를 뒷받침합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תַּחְפֹּץ
  english_pob_choice: Do not desire
  chosen_korean: 바라지 마십시오
  alternatives_korean:
  - 원하지 마십시오
  - 욕심내지 마십시오
  - 하고 싶어하지 마십시오
  lexicon: HALOT
  rationale: תַּחְפֹּץ의 의지적 ‘바라다/원하다’ 뜻을 살리면서 현대 한국어 경고문으로 자연스럽게 옮겼습니다.
- source_word: לְכַחֵש עַל כָּחַש
  english_pob_choice: repeat a lie
  chosen_korean: 거짓말을 되풀이하다
  alternatives_korean:
  - 거짓말을 거짓말 위에 더하다
  - 거짓말을 반복하다
  - 거짓을 거듭하다
  lexicon: HALOT
  rationale: 히브리어의 ‘거짓 위에 거짓’을 직역하면 어색하므로, 반복·누적의 의미를 살려 ‘되풀이하다’로 옮겼습니다.
- source_word: תִקְוָתוֹ
  english_pob_choice: its outcome
  chosen_korean: 그것의 끝
  alternatives_korean:
  - 그것의 결과
  - 그것의 소망
  - 그것의 기대
  lexicon: HALOT
  rationale: 원뜻은 ‘희망/기대’이지만, 이 문맥에서는 거짓의 귀결을 가리키므로 한국어로는 ‘끝’이 가장 간결하게 결과성을 드러냅니다.
- source_word: לֹא תִנְעָם
  english_pob_choice: is not good
  chosen_korean: 좋지 않습니다
  alternatives_korean:
  - 달갑지 않습니다
  - 유익하지 않습니다
  - 즐겁지 않습니다
  lexicon: HALOT
  rationale: 히브리어의 ‘기쁘다/달다’보다, POB의 ‘not good’ 판단적 의미를 따라 도덕적 평가를 자연스럽게 표현했습니다.
