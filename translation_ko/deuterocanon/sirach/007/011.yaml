translation:
  language: ko
  text: 비통한 마음을 가진 사람을 업신여기지 마십시오. 기억하십시오. 낮추기도 하시고 높이기도 하시는 분이 계십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 전승은 ‘높이기도 하고 낮추기도 하시는 분’의 순서를 보이며, 그리스어 평행본문은 ‘낮추고 높이시는 분’으로 읽습니다.
    reason: textual_variant
lexical_decisions:
- source_word: אַל תִּבֶז / μὴ καταγέλα
  english_pob_choice: Do not despise
  chosen_korean: 업신여기지 마십시오
  alternatives_korean:
  - 경멸하지 마십시오
  - 얕보지 마십시오
  - 비웃지 마십시오
  lexicon: HALOT; LSJ
  rationale: בזה의 핵심은 사람을 하찮게 여기며 경멸하는 태도이므로, 단순한 ‘비웃다’보다 포괄적인 ‘업신여기다’가 본문의 금지 범위를 더 잘 담습니다.
- source_word: לֶאֱנוֹשׁ
  english_pob_choice: a man
  chosen_korean: 사람
  alternatives_korean:
  - 한 남자
  - 인간
  lexicon: HALOT
  rationale: 히브리어 אֱנוֹשׁ는 연약한 인간을 가리키는 일반 명사로 쓰이므로, 한국어에서는 의미를 자연스럽게 살려 ‘사람’으로 옮겼습니다.
- source_word: בְּמַר רוּחַ / ἐν πικρίᾳ ψυχῆς αὐτοῦ
  english_pob_choice: in bitterness of spirit
  chosen_korean: 비통한 마음을 가진
  alternatives_korean:
  - 영의 쓴맛 가운데 있는
  - 영이 쓰린
  - 마음이 비통한
  lexicon: HALOT; BDAG
  rationale: 직역하면 ‘영/마음의 쓰라림’이지만, 현대 한국어에서는 ‘비통한 마음’이 관용구의 힘을 살리면서도 원문의 고통과 상처를 잘 전달합니다.
- source_word: יֵשׁ מֵרִים וּמַשְׁפִּיל / ὁ ταπεινῶν καὶ ἀνυψῶν
  english_pob_choice: there is one who exalts and humbles
  chosen_korean: 낮추기도 하시고 높이기도 하시는 분이 계십니다
  alternatives_korean:
  - 높이기도 하시고 낮추기도 하시는 분이 계십니다
  - 낮추고 높이시는 분이 계십니다
  - 낮추기도 하고 높이기도 하시는 분이 계십니다
  lexicon: HALOT; LSJ
  rationale: 히브리어 전승과 그리스어 평행본문 사이에 동사 순서 차이가 있으나, 한국어 본문은 본문의 경고 기능에 맞게 ‘낮춤-높임’의 역전 구조를 분명히 드러내되, POB 주석에 따라 ‘하시는 분이 계십니다’로 무기명 단수 주체를 유지했습니다.
theological_decisions:
- issue: 하나님의 직접 명시 여부
  chosen_reading: 주어를 ‘하나님/주님’으로 명시하지 않고 ‘분이 계십니다’로 둡니다.
  alternative_readings:
  - 하나님은 낮추기도 하시고 높이기도 하십니다
  - 주님은 낮추기도 하시고 높이기도 하십니다
  rationale: 히브리어와 그리스어 모두 이 절에서 명시적 신명호칭 없이 단수 주체만 암시하므로, 본문이 직접 말하지 않은 호칭을 덧붙이지 않고 신적 주권의 의미만 보존했습니다.
  doctrine_reference: 본문이 말하는 범위를 넘어서 신학적 대상을 명시하지 않음
