  text: Do not despise a man in bitterness of spirit[a]; remember that there is one who exalts and humbles.
  footnotes:
  - marker: a
    text: 'Hebrew: ''there is one who raises up and humbles''; Greek parallel: ''there is one who humbles and exalts.'' The main text follows the Greek-supported order because it better fits the verse''s warning not to despise the distressed.'
