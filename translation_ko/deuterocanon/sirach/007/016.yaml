  - 벌레들
  - 지렁이
  lexicon: HALOT
  rationale: 시체의 부패와 죽음을 가리키는 이미지이므로, 한국어에서는 복수형을 굳이 살리기보다 충격과 소멸의 이미지를 유지하는 ‘벌레’가 가장 간결합니다.
