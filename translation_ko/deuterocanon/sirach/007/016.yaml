  lexicon: HALOT
  rationale: 이 명사는 긍정적 자긍심이 아니라 높아진 자기중심성을 가리키므로, 한국어 성경 문맥에서 오해가 적은 ‘교만’을 택했습니다.
- source_word: רִמָּה
