  rationale: 히필 명령형의 능동적 ‘낮춤’은 한국어에서 직접적인 명령형으로 옮기는 것이 가장 자연스럽고, 문맥상 ‘교만’을 낮추라는 뜻을 분명히 드러냅니다.
