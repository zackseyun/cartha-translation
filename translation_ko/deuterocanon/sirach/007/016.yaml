  alternative_readings:
  - '그리스어 전승: ‘죄인들의 무리에 자신을 끼워 넣지 마십시오’'
  rationale: 집회서에서는 히브리어가 남아 있는 경우 이를 본문으로 옮기되, 그리스어가 단순한 표현 차이가 아니라 다른 전승임을 투명하게 보존해야 합니다.
  doctrine_reference: 'PHILOSOPHY.md: 히브리어가 보존된 경우 히브리어를 본문으로 하고, 그리스어 평행본문은 실제 증거로서 각주에 보존한다.'
