  source_fidelity: 본문은 헬라어 평행본문(ἐν πᾶσι τοῖς λόγοις σου μιμνήσκου τὰ ἔσχατά σου, καὶ εἰς τὸν αἰῶνα οὐχ ἁμαρτήσεις)을 충실히 반영합니다. 그러나 히브리어 증거는 헬라어와 실질적으로 다른 읽기이므로, 본문과의 ‘일치’ 여부가 아니라 서로 다른 전승임을 각주에서 분명히 해야 합니다.
  naturalness: ‘당신의 모든 말에서 자신의 끝을’은 동일 지시 대상을 가리키는 소유 표현이 혼재되어 다소 부자연스럽습니다. 주어가 생략되는 한국어의 특성을 살려 ‘모든 말에서 자신의 끝을’로 정리하면 현대 한국어 합쇼체에서 더 자연스럽습니다.
  terminology: ‘끝’은 죽음, 최종 결과 등 τὰ ἔσχατα의 열린 의미를 유지합니다. ‘죄를 짓지 않을 것입니다’도 ἁμαρτήσεις를 적절히 옮깁니다. 각주의 ‘사랑하는 이’는 능동 분사 אֹהֵב의 의미가 모호할 수 있으므로 ‘사랑하는 사람’보다 ‘사랑하는 이’로 유지하되, 헬라어와의 전승상 차이를 정확히 설명합니다.
