  text: In all your words remember your end, and you will never sin.[a]
  footnotes:
  - marker: a
    text: Hebrew witness (Kahana, Cairo Geniza composite) reads approximately, 'Do not turn your heart away from one who loves, for from him you will be loved.' The Hebrew here appears substantially different from the Greek tradition, so the main text follows the Greek parallel.
    reason: alternative_reading
translation:
  language: ko
  text: 당신의 모든 말에서 자신의 끝을 기억하십시오. 그러면 결코 죄를 짓지 않을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 증거(Kahana, 카이로 게니자 합성본)는 대략 ‘사랑하는 이에게서 마음을 돌리지 말라. 그러면 그로부터 사랑을 받게 될 것이다’로 읽힙니다. 여기서는 헬라어 전승이 본문과 더 일치하고, 히브리어는 상당히 다른 읽기이므로 본문은 헬라어를 따랐습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν πᾶσι τοῖς λόγοις σου
  english_pob_choice: In all your words
  chosen_korean: 당신의 모든 말에서
  alternatives_korean:
  - 당신이 하는 모든 말에서
  - 모든 말 가운데서
  lexicon: LSJ
  rationale: λόγοι는 여기서 ‘말/발언’의 뜻이 자연스러우므로, 한국어도 직접적으로 ‘말’로 옮겨 원문의 범위를 유지했습니다.
- source_word: μιμνήσκου
  english_pob_choice: remember
  chosen_korean: 기억하십시오
  alternatives_korean:
  - 기억하시오
  - 마음에 두십시오
  lexicon: BDAG
  rationale: 명령형의 기억 행위를 가장 직접적으로 드러내기 위해 합쇼체의 ‘기억하십시오’를 선택했습니다.
- source_word: τὰ ἔσχατά σου
  english_pob_choice: your end
  chosen_korean: 자신의 끝
  alternatives_korean:
  - 당신의 끝
  - 마지막 때
  - 마지막 일들
  lexicon: LSJ
  rationale: ‘끝’은 죽음과 최종 귀결을 모두 열어 두는 표현이라, 원문의 의미 범위를 과도하게 좁히지 않습니다.
- source_word: οὐχ ἁμαρτήσεις
  english_pob_choice: you will never sin
  chosen_korean: 결코 죄를 짓지 않을 것입니다
  alternatives_korean:
  - 죄를 짓지 않을 것입니다
  - 전혀 죄를 짓지 않을 것입니다
  lexicon: BDAG
  rationale: ἁμαρτάνω의 기본 의미를 살려 ‘죄를 짓다’로 옮겼고, 영어 POB의 ‘never’에 맞춰 ‘결코’로 부정의 강도를 반영했습니다.
theological_decisions:
- issue: ‘your end’의 범위를 종말론적으로 특정할지 여부
  chosen_reading: ‘자신의 끝’으로 두어 죽음과 최종 귀결을 모두 열어 둡니다.
  alternative_readings:
  - ‘마지막 심판’
  - ‘영원한 운명’
  rationale: 본문은 끝을 기억하라고 권면할 뿐, 후대의 교리적 세부를 명시하지 않으므로 의미의 폭을 유지하는 것이 더 충실합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 3
- issue: 히브리어와 헬라어 전승이 크게 어긋나는 본문 처리
  chosen_reading: 헬라어 평행본문을 본문으로 따르고, 히브리어의 대체 읽기는 각주로만 보존합니다.
  alternative_readings:
  - 히브리어를 따라 ‘사랑하는 이에게서 마음을 돌리지 말라’로 번역
  - 혼합형 본문 구성
  rationale: 제공된 히브리어는 헬라어와 의미가 크게 달라 본문으로 삼기 어렵고, POB의 주석된 본문 원칙에 따라 주된 번역은 안정적인 헬라어 전승을 따르는 것이 적절합니다.
  doctrine_reference: PHILOSOPHY.md 'What we are translating' and transparency principles
