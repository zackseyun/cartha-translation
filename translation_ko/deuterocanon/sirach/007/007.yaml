translation:
  language: ko
  text: 하나님의 성문 앞에 모인 회중 가운데서 죄를 자초하지 마십시오. 또 회중 가운데서 스스로를 낮추지 마십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '그리스어 병행 본문: “성읍의 많은 무리 가운데서 죄를 짓지 말며, 군중 가운데서 스스로를 넘어뜨리지 말라.” 이는 다른 히브리어 독법을 반영하거나, 히브리어의 ‘하나님의 성문들’이라는 표현을 해석적으로 평이하게 옮긴 것일 수 있습니다.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַ ל תַּרְשִׁיעֲךָ
  english_pob_choice: Do not make yourself guilty
  chosen_korean: 스스로 죄를 짓게 하지 말며
  alternatives_korean:
  - 스스로를 유죄로 만들지 말며
  - 악하게 행하지 말며
  - 죄를 짓지 말며
  lexicon: HALOT
  rationale: 히필형의 רשע는 자신에게 죄책을 가져오게 하거나 유죄가 되게 하는 뜻이므로, 단순한 일반론적 '죄를 짓다'보다 자기 자신에게 책임을 돌리는 뉘앙스를 살렸습니다.
- source_word: בַּעֲדַת
  english_pob_choice: in the assembly
  chosen_korean: 회중에서
  alternatives_korean:
  - 모임에서
  - 집회에서
  - 회중 가운데
  lexicon: HALOT
  rationale: עֵדָה는 공개적으로 모인 공동체를 가리키므로, 자연스러운 현대 한국어로 '회중'을 택해 공동체적 상황을 보존했습니다.
- source_word: שַׁעֲרֵי אֵל
  english_pob_choice: at the gates of God
  chosen_korean: 하나님의 문들의
  alternatives_korean:
  - 하나님의 성문들의
  - 하나님의 문 앞의
  - 하나님의 성문에서
  lexicon: HALOT
  rationale: 히브리어의 특이한 표현을 평준화하지 않고 그대로 살려, 공적·재판적 공간이 하나님의 통치 아래 있음을 드러내도록 했습니다.
- source_word: וְאַל תַּפִּילְךָ
  english_pob_choice: and do not bring yourself down
  chosen_korean: 스스로를 낮추지 마십시오
  alternatives_korean:
  - 스스로를 떨어뜨리지 마십시오
  - 자신을 낮추어 버리지 마십시오
  - 스스로를 내리누르지 마십시오
  lexicon: HALOT
  rationale: נפל의 사역/반사적 용법은 자기 자신을 낮추거나 떨어뜨리는 이미지를 가지므로, 한국어에서 가장 자연스럽고 비유를 보존하는 '스스로를 낮추다'로 옮겼습니다.
- source_word: בַּקְּהִלָּה
  english_pob_choice: in the congregation
  chosen_korean: 회중에서
  alternatives_korean:
  - 모임에서
  - 집회에서
  - 무리 가운데
  lexicon: HALOT
  rationale: קְהִלָּה는 모인 공동체를 뜻하므로, 앞의 עֵדָה와 겹치지 않으면서도 공적 공동체성을 살리는 '회중'을 사용했습니다.
theological_decisions:
- issue: 히브리어의 '하나님의 문들'을 주 본문에 유지할지, 그리스어 평행문의 '도시의 무리'를 따를지
  chosen_reading: 주 본문은 히브리어 중심의 '하나님의 문들의 회중'으로 유지하고, 그리스어 평행은 각주로 처리합니다.
  alternative_readings:
  - 도시의 무리에서 죄를 짓지 말며
  - 성읍의 무리 가운데서 죄를 짓지 말며
  rationale: 시락서는 히브리어가 보존된 경우 그 증거를 우선하되, 그리스어 평행이 다른 Vorlage 또는 해석적 완화일 수 있음을 투명하게 남겨야 합니다. 따라서 본문은 히브리어의 난해한 표현을 보존하고, 대안 독법은 각주로 제시합니다.
  doctrine_reference: 'PHILOSOPHY.md: translate from Hebrew where Sirach survives; preserve source uncertainty honestly'
