  lexicon: HALOT
  rationale: יסר는 교정과 교육을 함께 담는 말이므로, 지나치게 강한 ‘징계’보다 권면과 교정의 뉘앙스를 살린 ‘훈계하다’가 합쇼체 본문에 적절합니다.
- source_word: וְשָׂא לָהֶם נָשִׁים
  english_pob_choice: get wives for them
  chosen_korean: 아내를 맞게 해 주십시오
  alternatives_korean:
  - 그들을 위해 아내를 구해 주십시오
  - 아내를 마련해 주십시오
  lexicon: HALOT
  rationale: נָשָׂא לָהֶם נָשִׁים은 결혼을 성사시키도록 마련해 주는 관용적 표현이므로, 현대 한국어에서 자연스러운 ‘아내를 맞게 해 주다’로 옮겼습니다.
- source_word: בִּנְעוּרֵיהֶם
  english_pob_choice: in their youth
  chosen_korean: 젊을 때
  alternatives_korean:
  - 청년기에
  - 젊은 시절에
  lexicon: HALOT
  rationale: בִּנְעוּרֵיהֶם은 청년기의 시간표현이므로, 문맥에 맞게 간결한 ‘젊을 때’로 풀었습니다.
