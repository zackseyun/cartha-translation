translation:
  language: ko
  text: 아들에게는 훈계하십시오[a]. 그리고 그들이 젊을 때 아내를 맞게 해 주십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 평행본문은 “자녀가 있습니까? 그들을 훈육하고, 어린 시절부터 그들의 목을 굽히십시오”로 읽습니다. 그러나 현존 히브리어 본문은 “...그리고 그들이 젊을 때 아내를 맞게 해 주십시오”라고 읽습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: בָּנִים
  english_pob_choice: sons
  chosen_korean: 아들들
  alternatives_korean:
  - 자녀들
  lexicon: HALOT
  rationale: 히브리어 בָּנִים은 여기서 남성 복수인 ‘아들들’로 읽는 것이 자연스럽고, 이어지는 결혼 지시도 남자 자녀를 가리킨다는 점을 분명히 합니다.
- source_word: יַסֵּר
  english_pob_choice: discipline
  chosen_korean: 훈계하십시오
  alternatives_korean:
  - 징계하십시오
  - 교정하십시오
  - 단련하십시오
  lexicon: HALOT
  rationale: יסר는 교정과 교육을 함께 담는 말이므로, 지나치게 강한 ‘징계’보다 권면과 교정의 뉘앙스를 살린 ‘훈계하다’가 합쇼체 본문에 적절합니다.
- source_word: וְשָׂא לָהֶם נָשִׁים
  english_pob_choice: get wives for them
  chosen_korean: 아내를 맞게 해 주십시오
  alternatives_korean:
  - 그들을 위해 아내를 구해 주십시오
  - 아내를 마련해 주십시오
  lexicon: HALOT
  rationale: נָשָׂא לָהֶם נָשִׁים은 결혼을 성사시키도록 마련해 주는 관용적 표현이므로, 현대 한국어에서 자연스러운 ‘아내를 맞게 해 주다’로 옮겼습니다.
- source_word: בִּנְעוּרֵיהֶם
  english_pob_choice: in their youth
  chosen_korean: 젊을 때
  alternatives_korean:
  - 청년기에
  - 젊은 시절에
  lexicon: HALOT
  rationale: בִּנְעוּרֵיהֶם은 청년기의 시간표현이므로, 문맥에 맞게 간결한 ‘젊을 때’로 풀었습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 평행본문의 차이
  chosen_reading: 주본문은 히브리어의 ‘아내를 맞게 해 주십시오’에 따릅니다.
  alternative_readings:
  - 그리스어처럼 ‘어린 시절부터 그들의 목을 굽히십시오’로 옮길 수 있습니다.
  rationale: 이 구절은 히브리어 증거가 남아 있으므로 본문 우선 원칙에 따라 이를 따르되, 그리스어 전승의 실질적 차이는 각주로 드러내어 해석상의 긴장을 숨기지 않았습니다.
