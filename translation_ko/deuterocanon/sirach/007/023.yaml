  alternative_readings:
  - 그리스어처럼 ‘어린 시절부터 그들의 목을 굽히십시오’로 옮길 수 있습니다.
  rationale: 이 구절은 히브리어 증거가 남아 있으므로 본문 우선 원칙에 따라 이를 따르되, 그리스어 전승의 실질적 차이는 각주로 드러내어 해석상의 긴장을 숨기지 않았습니다.
