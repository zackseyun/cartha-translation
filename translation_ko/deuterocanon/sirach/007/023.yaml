translation:
  language: ko
  text: 아들이 있습니까? 그들을 훈육하십시오[a]. 그리고 그들이 젊을 때 그들을 위하여 아내를 마련해 주십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 평행본문은 “자녀가 있습니까? 그들을 훈육하고, 어린 시절부터 그들의 목을 굽히십시오”라고 읽습니다. 그러나 현존 히브리어 본문은 “...그리고 그들이 젊을 때 그들을 위하여 아내를 마련해 주십시오”라고 읽습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: בָּנִים
  english_pob_choice: sons
