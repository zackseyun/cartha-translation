base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/007/030.yaml
  text: With all your strength[a], love your Maker[b], and do not forsake his ministers.
  footnotes:
  - marker: a
    text: Or 'with all your might' or 'with all your power.'
    reason: lexical_alternative
  - marker: b
    text: '''His ministers'' may refer more specifically to those who serve God in sacred or temple service; alternatively, ''his servants.'''
    reason: alternative_reading
translation:
  language: ko
  text: 온 힘을 다해 너의 Maker를 사랑하고, 그의 일꾼들을 저버리지 마십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구는 ‘힘’, ‘능력’, ‘역량’을 모두 포함할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그의 일꾼들’은 성전이나 예배에서 섬기는 사람들을 더 구체적으로 가리킬 수 있으며, 넓게는 ‘그의 종들’로도 이해할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּכָל מְאֹדְךָ
  english_pob_choice: with all your strength
  chosen_korean: 온 힘을 다해
  alternatives_korean:
  - 모든 힘으로
  - 전력을 다해
  - 온 힘과 정성을 다해
  lexicon: HALOT
  rationale: 히브리어 관용구는 사람의 전적인 역량을 뜻하며, POB의 'strength'와 함께 총체적 헌신을 자연스러운 한국어로 옮겼습니다.
- source_word: עוֹשֶׂךָ
  english_pob_choice: your Maker
  chosen_korean: 너의 Maker
  alternatives_korean:
  - 너를 지으신 분
  - 너의 창조주
  - 너를 만드신 분
  lexicon: HALOT
  rationale: 본문의 창조자-피조물 관계를 직접 드러내기 위해 'Maker'를 고유 호칭처럼 보존했습니다. 한국어 본문에서는 독자 이해를 위해 영어 표기를 유지하되, 발화 대상의 신적 의미는 문맥상 분명합니다.
- source_word: מְשָׁרְתָיו
  english_pob_choice: his ministers
  chosen_korean: 그의 일꾼들
  alternatives_korean:
  - 그의 섬기는 사람들
  - 그의 종들
  - 그의 사역자들
  lexicon: HALOT
  rationale: שרת 계열은 공식적·봉사적 섬김을 가리키며, 여기서는 성전/예배 관련 뉘앙스가 있으나 한국어에서 'ministers'를 직역한 '목사' 등은 과도하므로, 서비스의 기능을 살린 '일꾼들'로 옮겼습니다.
- source_word: לֹא תַעֲזֹב
  english_pob_choice: do not forsake
  chosen_korean: 저버리지 마십시오
  alternatives_korean:
  - 버리지 마십시오
  - 떠나지 마십시오
  - 외면하지 마십시오
  lexicon: HALOT
  rationale: עזב의 핵심은 단순한 물리적 이탈보다 관계적·도덕적 '버림'에 있어, 한국어로는 책임을 저버리는 의미를 살리는 표현이 가장 가깝습니다.
theological_decisions:
- issue: ‘Maker’의 신적 지시성과 번역 유지
  chosen_reading: Maker를 본문에서 그대로 살려 창조주 하나님을 가리키는 호칭으로 읽히게 했습니다.
  alternative_readings:
  - 너를 지으신 분
  - 너의 창조주
  rationale: 히브리어와 그리스어 모두 창조 행위를 한 분을 가리키므로, 단순 설명어보다 호칭적 표현을 유지하는 편이 원문의 힘을 보존합니다. 다만 한국어 가독성을 위해 영어 표기를 유지하는 방식은 이 구절에서만의 편집적 선택입니다.
  doctrine_reference: 창조주 하나님 이해
- issue: ‘his ministers’의 범위
  chosen_reading: 성전/예배적 섬김을 포함할 수 있으나, 본문에서는 중립적으로 '일꾼들'로 처리했습니다.
  alternative_readings:
  - 제사장들
  - 사역자들
  - 섬기는 사람들
  rationale: 히브리어 מְשָׁרְתָיו와 그리스어 λειτουργούς αὐτοῦ는 공식적 봉사자들을 뜻하지만, 특정 직분으로 과도하게 한정하지 않고 원문의 유보성을 살렸습니다.
  doctrine_reference: 성전 봉사자 이해
