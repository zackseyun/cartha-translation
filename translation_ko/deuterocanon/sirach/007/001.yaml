base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/007/001.yaml
  text: Do not do evil[a], and evil will not overtake you; keep far from iniquity[b], and it will turn away from you.
  footnotes:
  - marker: a
    text: 'Or ''harm''/''calamity'' in the second clause: ''Do not do evil, and harm will not overtake you.'' The Hebrew repeats the same word, and the Greek likewise has ''evil'' in both places.'
    reason: lexical_alternative
  - marker: b
    text: The final clause is concise in Hebrew and may also be understood as 'and it will depart from you.' The sense is that distancing yourself from iniquity causes its danger or effect to turn aside.
    reason: alternative_reading
translation:
  language: ko
  text: 악을 행하지 마십시오. 그러면 악[a]이 당신을 덮치지 않을 것입니다. 죄악에서 멀리하십시오. 그러면 죄악도 당신에게서 물러설 것입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어와 그리스어는 두 절에서 같은 말을 반복합니다. 둘째 ‘악’은 ‘해’ 또는 ‘재앙’으로도 옮길 수 있지만, 본문은 원문의 반복을 살려 ‘악’으로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 마지막 절은 문자적으로 ‘그것이 당신에게서 돌아서다’에 가깝습니다. ‘그것’은 앞의 ‘죄악’을 가리키는 것으로 읽을 수 있으며, ‘떠나다’ 또는 ‘물러서다’로도 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תַּעַשׂ רָעָה
  english_pob_choice: Do not do evil
  chosen_korean: 악을 행하지 마십시오
  alternatives_korean:
  - 악을 저지르지 마십시오
  - 악을 행하지 마십시오
  lexicon: HALOT
  rationale: עשה의 직접적인 금지를 자연스러운 합쇼체로 옮겼습니다. '행하다'는 도덕적 행위의 일반 동사를 살리면서도 과도한 해석을 덧붙이지 않습니다.
- source_word: וְאַל יַשִּׂיגְךָ רָעָה
  english_pob_choice: and evil will not overtake you
  chosen_korean: 그러면 악이 당신을 덮치지 않을 것입니다
  alternatives_korean:
  - 그러면 악이 당신에게 미치지 않을 것입니다
  - 그러면 악이 당신을 따라잡지 않을 것입니다
  lexicon: HALOT
  rationale: נשׂג의 '따라잡다/덮치다' 의미를 살려, 경고문의 긴박함이 드러나도록 했습니다. '덮치다'는 예상치 못한 재앙의 도래도 함께 담을 수 있습니다.
- source_word: הַרְחֵק מֵעָוֹן
  english_pob_choice: keep far from iniquity
  chosen_korean: 불의에서 멀리 떨어지십시오
  alternatives_korean:
  - 죄악에서 멀리 떨어지십시오
  - 불의에서 멀리하십시오
  lexicon: HALOT
  rationale: עָוֹן은 문맥상 단순한 실수보다 도덕적 굴곡과 불의를 가리키므로, '불의'를 택해 윤리적 무게를 유지했습니다. '멀리 떨어지다'는 공간적 비유를 한국어로 자연스럽게 옮깁니다.
- source_word: וְיֵט מִמְּךָ
  english_pob_choice: and it will turn away from you
  chosen_korean: 그러면 그것이 당신에게서 돌아설 것입니다
  alternatives_korean:
  - 그러면 그것이 당신에게서 떠날 것입니다
  - 그러면 그것이 당신에게서 물러설 것입니다
  lexicon: HALOT
  rationale: 히브리어의 짧고 열린 표현을 따라, 주어를 과도하게 특정하지 않고 '돌아서다'로 옮겼습니다. 이는 가까이 하지 말라는 앞절과 대응하는 반향적 표현입니다.
theological_decisions:
- issue: רָעָה의 반복을 어떻게 살릴 것인가
  chosen_reading: 본문에서는 두 번 모두 '악'으로 통일했습니다.
  alternative_readings:
  - 첫째는 '악', 둘째는 '해/재앙'으로 구분
  - 둘째를 '해악'으로 풀어 의미 차이를 강조
  rationale: 히브리어와 그리스어 모두 같은 어휘의 반복으로 도덕적 행위와 그 결과의 긴밀한 연결을 만들고 있으므로, 한국어에서도 동일어 반복을 유지해 대칭성을 드러냈습니다.
  doctrine_reference: Translation philosophy §5 (consistency of key terms, or documented exception)
