revisions:
- from: 진실하게 일하는 종을 학대하지 마십시오. 또 자기 목숨을 바치는 품꾼도 그러지 마십시오.[a][b]
  to: 성실히 일하는 종[a]을 부당하게 대하지 마십시오. 또 자신을 다 바쳐 일하는 품꾼[b]도 그렇게 대하지 마십시오.
  rationale: The revision moderates ‘학대하다’ to the source-appropriate ‘부당하게 대하다,’ replaces a less idiomatic description of faithful work with ‘성실히 일하는,’ and renders the Greek-supported self-expenditure idiom without suggesting literal death. It also moves each footnote anchor to its corresponding expression.
