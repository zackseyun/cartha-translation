review_pass:
  verdict: revise
  source_fidelity: The draft correctly recognizes the parallel prohibitions and appropriately uses the Greek parallel to clarify the difficult Hebrew wording in the second clause. However, ‘학대하다’ is stronger and more specific than the source’s broader prohibition against harming or treating someone badly. ‘자기 목숨을 바치는’ can imply literal death or martyrdom in modern Korean, whereas the Greek parallel most naturally conveys a laborer who gives/devotes himself to his work.
  naturalness: ‘진실하게 일하는 종’ is understandable but less idiomatic than ‘성실히 일하는 종’ for the ethical sense of working faithfully. Explicitly repeating the prohibition in the second clause is natural Korean and avoids a potentially vague ‘그러지 마십시오.’
  terminology: ‘종’ is suitable for the servant/worker sense in this social setting, and ‘품꾼’ appropriately reflects the Greek μίσθιον. ‘부당하게 대하다’ conveys mistreatment without overstating the degree of abuse. ‘자신을 다 바쳐 일하는’ conveys personal devotion without implying literal loss of life.
  issues:
  - severity: medium
    issue: ‘학대하지 마십시오’ is overly strong.
    rationale: Both the Hebrew רעע and Greek κακόω denote doing harm or treating badly; neither necessarily specifies severe, sustained abuse, which ‘학대’ often implies in current Korean.
  - severity: medium
    issue: ‘자기 목숨을 바치는’ may be read as literal self-sacrifice or death.
    rationale: The difficult Hebrew is controlled here by Greek ‘giving his soul/life,’ an idiom that in this labor context denotes wholehearted self-expenditure. Korean ‘목숨을 바치다’ commonly suggests dying for a cause.
  - severity: low
    issue: Footnote markers are placed only at the end of the whole verse.
    rationale: Placing each marker directly after its relevant expression makes the lexical and textual notes easier to follow.
  revised_text: 성실히 일하는 종[a]을 부당하게 대하지 마십시오. 또 자신을 다 바쳐 일하는 품꾼[b]도 그렇게 대하지 마십시오.
