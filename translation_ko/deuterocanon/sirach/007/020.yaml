  text: Do not mistreat a faithful servant[b][a], nor a hired laborer who gives himself.
  footnotes:
  - marker: a
    text: Hebrew 'worker of truth'; Greek has 'house-servant working in truth.' The sense is a laborer who works faithfully or honestly.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew wording in the second clause is difficult, but the Greek parallel reads 'nor a hired laborer giving his life,' which supports the rendering 'a hired laborer who gives his life.'
    reason: alternative_reading
translation:
  language: ko
  text: 성실히 일하는 종[a]을 부당하게 대하지 마십시오. 또 자신을 다 바쳐 일하는 품꾼[b]도 그렇게 대하지 마십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘진리의 일하는 자’에 가깝고, 그리스어는 ‘진리 안에서 일하는 집안 종’에 가깝습니다. 이는 성실하거나 정직하게 일하는 사람을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어의 두 번째 절은 난해합니다. 그리스어 병행문은 ‘자기 목숨을 내어주는 삯꾼’이라고 하며, 여기서는 일에 자신을 다 바치는 품꾼이라는 뜻으로 옮겼습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תָּרֵעַ
  english_pob_choice: Do not mistreat
  chosen_korean: 학대하지 마십시오
  alternatives_korean:
  - 해를 끼치지 마십시오
  - 못되게 대하지 마십시오
  - 괴롭히지 마십시오
  lexicon: HALOT
  rationale: רעע의 사역적 의미는 해를 끼치거나 나쁘게 대하는 것이므로, 현대 한국어에서 강한 부정적 처지를 드러내는 ‘학대하다’가 가장 직접적입니다.
- source_word: עוֹבֵד אֱמֶת
  english_pob_choice: a faithful servant / a worker who is faithful
  chosen_korean: 진실하게 일하는 종
  alternatives_korean:
  - 진실한 일꾼
  - 믿음직하게 일하는 사람
  - 진리 안에서 일하는 종
  lexicon: HALOT
  rationale: 직역하면 ‘진실의 일하는 자’이므로, 도덕적 성실성을 살리되 한국어로 자연스럽게 ‘진실하게 일하는 종’으로 옮겼습니다.
- source_word: שׁוֹמֵר
  english_pob_choice: a hired laborer
  chosen_korean: 품꾼
  alternatives_korean:
  - 고용된 일꾼
  - 삯꾼
  - 고된 노동자
  lexicon: HALOT
  rationale: 히브리어 표기는 난해하지만 그리스어 μίσθιον이 임금노동자를 분명히 가리키므로, 짧고 구어적이지 않은 ‘품꾼’이 가장 적절합니다.
- source_word: נוֹחֵן נַפְשׁוֹ
  english_pob_choice: who gives himself
  chosen_korean: 자기 목숨을 바치는
  alternatives_korean:
  - 자기를 내어주는
  - 자기 생명을 내어놓는
  - 자신을 다 바치는
  lexicon: HALOT
  rationale: 네페쉬는 여기서 단순한 감정이 아니라 자기 삶/목숨 전체를 가리키는 헌신의 표현이므로, ‘자기 목숨을 바치는’으로 강도와 의미를 살렸습니다.
theological_decisions:
- issue: 히브리어-그리스어 병행본의 의미 조정
  chosen_reading: 본문의 두 번째 절은 히브리어의 난해한 표현을 그리스어의 ‘삯꾼’과 ‘자기 생명을 내어줌’이 보정해 주는 것으로 보고, 둘을 함께 반영했습니다.
  alternative_readings:
  - 히브리어를 따라 ‘지키는 자’로 옮김
  - 그리스어만 따라 ‘자기 생명을 주는 삯꾼’으로 직역
  rationale: 시락의 이 절은 히브리어 본문이 불확실하므로, 주어진 병행 전승을 함께 고려하는 것이 독자에게 가장 충실합니다.
  doctrine_reference: source-critical translation practice
