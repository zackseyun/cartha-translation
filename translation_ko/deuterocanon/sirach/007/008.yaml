translation:
  language: ko
  text: 죄를 거듭 짓지 마십시오. 한 번만 지어도 벌을 면하지 못합니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘무죄로 인정받지 못합니다’, ‘면책되지 못합니다’라는 뜻일 수 있습니다. 히브리어와 그리스어는 벌을 피하지 못한다는 뜻과 함께 법정적 의미도 담을 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּקְשׁוֹר
  english_pob_choice: Do not add / bind
  chosen_korean: 묶어 두지 마십시오
  alternatives_korean:
  - 죄를 두 번 더 짓지 마십시오
  - 죄를 두 번 묶지 마십시오
  - 죄를 다시 범하지 마십시오
  lexicon: HALOT
  rationale: 히브리어 תִּקְשׁוֹר는 문자적으로 ‘묶다/매다’의 뜻이 있어, 단순히 ‘범하다’로 완역하면 이미지가 사라집니다. 한국어에서는 ‘묶어 두다’가 비유적 결속을 살리면서도 자연스럽습니다.
- source_word: לְשָׁנוֹת
  english_pob_choice: a second time
  chosen_korean: 두 번
  alternatives_korean:
  - 다시
  - 두 번째로
  - 한 번 더
  lexicon: HALOT
  rationale: 반복을 나타내는 표현이므로, ‘두 번’이 원문의 중복성을 가장 분명하게 전달합니다. ‘다시’보다 수량적 대비가 살아납니다.
- source_word: חֵטְ
  english_pob_choice: sin
  chosen_korean: 죄
  alternatives_korean:
  - 허물
  - 악행
  - 죄악
  lexicon: HALOT
  rationale: 본문의 חֵטְ는 죄/허물을 뜻하며, POB의 ‘sin’에 맞추어 가장 პირდაპირ적인 표준어 ‘죄’를 택했습니다.
- source_word: לֹא תִנָּקֶה
  english_pob_choice: you will not go unpunished
  chosen_korean: 벌을 면하지 못합니다
  alternatives_korean:
  - 무죄로 인정받지 못합니다
  - 깨끗함을 얻지 못합니다
  - 벌받지 않고 지나가지 못합니다
  lexicon: HALOT
  rationale: נקה는 ‘깨끗하다’뿐 아니라 ‘면제되다/벌을 피하다’의 뜻을 가질 수 있습니다. 지혜문맥에서는 형식적 무죄 선언보다 실제적 징계를 피하지 못한다는 경고가 중심이므로 이렇게 옮겼습니다.
theological_decisions:
- issue: 마지막 절을 법정적 무죄 판정으로 볼지, 벌을 피하지 못한다는 경고로 볼지
  chosen_reading: 벌을 면하지 못합니다
  alternative_readings:
  - 무죄로 선언받지 못합니다
  - 깨끗하다고 인정받지 못합니다
  rationale: 히브리어와 그리스어 모두 법정적 뉘앙스를 담을 수 있지만, 이 절은 지혜문학의 경고로서 한 번의 죄도 결과를 피할 수 없다는 뜻을 강조합니다. 따라서 ‘벌을 면하지 못합니다’가 본문 기능을 가장 잘 드러냅니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 3, 5
