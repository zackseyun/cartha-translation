base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/007/028.yaml
  text: Remember that if not for them[a], you would not have come into the world[b]; and what can you do for them as they have done for you?
  footnotes:
  - marker: a
    text: That is, your parents; the pronoun is implicit from the surrounding context.
    reason: cross_reference
  - marker: b
    text: Or, more literally, 'what will you repay them as they [have done] to you?' The Greek explicitly frames the question in terms of repayment.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들에게서 나지 않았더라면, 당신은 세상에 태어나지 못했을 것입니다. 그러니 그들이 당신에게 해 준 것처럼, 당신은 그들에게 무엇을 해 드릴 수 있습니까?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זְכוֹר
  english_pob_choice: Remember
  chosen_korean: 기억하십시오
  alternatives_korean:
  - 기억하라
  - 기억해 두십시오
  lexicon: HALOT
  rationale: 히브리어 명령형 זכר를 자연스러운 합쇼체 명령으로 옮겼습니다. 여기서는 단순한 지식 전달이 아니라 의무를 상기시키는 촉구이므로 '기억하십시오'가 가장 직접적입니다.
- source_word: לוּלֵי הֵם
  english_pob_choice: if not for them
  chosen_korean: 그들에게서 나지 않았더라면
  alternatives_korean:
  - 그들이 없었더라면
  - 그들 때문에가 아니었다면
  lexicon: HALOT
  rationale: 직역의 '그들이 아니었다면'보다, 부모를 통한 출생이라는 문맥을 살려 '그들에게서 나지 않았더라면'으로 옮겼습니다. 원문의 반사실적 의존성을 자연스럽게 드러냅니다.
- source_word: לֹא בָאתָ לָעוֹלָם
  english_pob_choice: you would not have come into the world
  chosen_korean: 세상에 태어나지 못했을 것입니다
  alternatives_korean:
  - 세상에 오지 못했을 것입니다
  - 이 세상에 나오지 못했을 것입니다
  lexicon: HALOT
  rationale: 히브리어의 '세상에 오다'를 한국어에서 출생을 뜻하는 표현으로 풀었습니다. 문맥상 존재 자체보다 '출생'을 가리키므로 더 분명하게 전달됩니다.
- source_word: וּמָה אַתָּה עוֹשֶׂה לָהֶם
  english_pob_choice: what can you do for them
  chosen_korean: 당신은 그들에게 무엇을 해 드릴 수 있습니까?
  alternatives_korean:
  - 당신은 그들에게 무엇을 할 수 있습니까?
  - 당신은 그들에게 무엇을 갚을 수 있습니까?
  lexicon: HALOT
  rationale: 질문형의 수사적 압박을 살리되, 부모에 대한 공경 문맥에 맞게 '해 드릴 수 있습니까'로 옮겼습니다. 헬라어의 보상/갚음 뉘앙스는 다음 절구에서 드러나므로 본문은 과도하게 해석하지 않았습니다.
- source_word: שֶׁהֵם גּוֹמְלִים לָךְ
  english_pob_choice: as they have done for you
  chosen_korean: 그들이 당신에게 해 준 것처럼
  alternatives_korean:
  - 그들이 당신에게 갚아 준 것처럼
  - 그들이 당신에게 베푼 것처럼
  lexicon: HALOT
  rationale: גמל의 '행하다/베풀다/갚다' 범위를 고려하되, 부모가 이미 한 선행과 돌봄을 가리키는 문맥에 맞춰 중립적으로 옮겼습니다. POB의 'as they have done for you'를 자연스럽게 반영합니다.
theological_decisions:
- issue: 본문이 전제하는 '그들'의 정체
  chosen_reading: 본문에는 대상을 직접 풀어 쓰지 않고 '그들'로 두되, 문맥상 부모를 가리킵니다.
  alternative_readings:
  - '''당신의 부모''를 본문에 명시함'
  rationale: 히브리어와 헬라어 모두 대명사를 그대로 사용하므로, 본문은 간결성을 유지하는 것이 더 충실합니다. 독자는 바로 앞 문맥에서 부모를 이해할 수 있습니다.
  doctrine_reference: 'Translation philosophy: source form 유지와 문맥적 명료성의 균형'
- issue: 보상/되갚음의 뉘앙스
  chosen_reading: 본문에는 직접적으로 '갚다'보다 '해 드리다'를 사용해, 과도한 거래적 표현을 피했습니다.
  alternative_readings:
  - '''갚을 수 있습니까'''
  - '''보답할 수 있습니까'''
  rationale: 헬라어 ἀνταποδώσεις와 히브리어 גמל에는 보응·상응의 의미가 있으나, 여기서는 부모 공경의 윤리적 촉구가 핵심입니다. 본문은 자연스럽게 읽히게 하되, 참고 번역 가능성은 각주 없이 결정 사유로 남깁니다.
  doctrine_reference: Sirach 7:28 filial duty and reciprocal obligation
