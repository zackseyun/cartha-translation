  text: Honor God and honor the priest[a], and give them their portion[b], as you were commanded.
  footnotes:
  - marker: a
    text: 'Greek parallel: ''Fear the Lord and glorify the priest, and give him his portion, as it has been commanded you from the beginning,'' followed by a fuller list of priestly dues.'
    reason: alternative_reading
  - marker: b
    text: Hebrew has 'their portion' (plural), likely referring to the priests' allotted dues collectively; the Greek parallel smooths this to singular, 'his portion.'
    reason: lexical_alternative
translation:
  language: ko
  text: 하나님을 공경하고 제사장을 공경하며, 명령받은 대로 그들의 몫을 주십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 평행본문은 “주님을 두려워하고 제사장을 영화롭게 하며, 처음부터 네게 명령된 대로 그에게 그의 몫을 주라”라고 읽으며, 이어서 제사장에게 드릴 몫의 더 자세한 목록을 덧붙입니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어는 복수 소유 접미사가 붙은 ‘그들의 몫’이라고 합니다. 그리스어 평행본문은 단수형 ‘그의 몫’이라고 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּבֵּד אֵל
  english_pob_choice: Honor God
  chosen_korean: 하나님을 공경하고
  alternatives_korean:
  - 하나님을 존중하고
  - 하나님께 영광을 돌리고
  lexicon: HALOT
  rationale: כבד의 핵심은 ‘무게를 두어 존중하다’이므로 현대 한국어에서는 ‘공경하다’가 가장 자연스럽고, 이 절의 명령형 어조도 잘 살립니다.
- source_word: וַהֲדַר כֹּהֵן
  english_pob_choice: honor the priest
  chosen_korean: 제사장도 공경하며
  alternatives_korean:
  - 제사장도 존귀하게 여기며
  - 제사장을 영화롭게 하며
  lexicon: HALOT
  rationale: הדר는 단순 반복을 피하면서도 존귀함을 인정하라는 뜻이므로, 앞의 ‘공경하다’와 짝을 이루는 한국어로 옮겼습니다.
- source_word: חֶלְקָם
  english_pob_choice: their portion
  chosen_korean: 그들의 몫
  alternatives_korean:
  - 그들의 분깃
  - 그들의 몫과 몫
  lexicon: HALOT
  rationale: 히브리어 복수 소유격을 살려 집합적으로 ‘그들의 몫’으로 옮겼습니다. 제사장 직분에 속한 정당한 배분이라는 뜻을 자연스럽게 드러냅니다.
- source_word: כַּאֲשֶׁר צֻוֵּיתָה
  english_pob_choice: as you were commanded
  chosen_korean: 명령받은 대로
  alternatives_korean:
  - 명령받으신 대로
  - 예전에 명령받은 대로
  lexicon: HALOT
  rationale: 수동형 완료 의미를 간결한 관용 표현으로 살렸습니다. 한국어에서는 지나치게 직역된 ‘명령받았습니다’보다 행위 규범을 드러내는 표현이 더 자연스럽습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 평행본문의 긴장
  chosen_reading: 본문은 히브리어를 따라 ‘하나님/제사장/그들의 몫’으로 두고, 그리스어의 ‘주’와 단수형은 주석적 대안으로만 남깁니다.
  alternative_readings:
  - ‘주님을 공경하고 제사장을 영화롭게 하라’
  - ‘그의 몫을 주라’
  rationale: 시락서에서는 살아 있는 히브리어 본문을 우선하되, 그리스어 평행본문이 보여 주는 전통적 해석은 삭제하지 않고 배경으로 보존하는 것이 적절합니다.
  doctrine_reference: Original-language primacy over translation tradition; documented alternative witness
