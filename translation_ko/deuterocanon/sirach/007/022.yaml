base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/007/022.yaml
  text: Do you have livestock? Keep your eye on it[a]; and if it is profitable[b], keep it.
  footnotes:
  - marker: a
    text: Hebrew 'if it is אֻמָּנָה'; the exact nuance of the adjective is uncertain, but the Greek parallel reads 'useful,' which supports the rendering here.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'see [with] your eyes.' The sense is to watch over or inspect your livestock carefully.
    reason: lexical_alternative
translation:
  language: ko
  text: 가축이 당신에게 있습니까? 그것을 눈여겨보십시오. 그리고 그것이 쓸모가 있다면, 그것을 붙들어 두십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 '그것이 אֻמָּנָה(정확한 뉘앙스가 불확실함)라면'에 가깝고, 그리스어 병렬문은 '쓸모 있는'이라고 읽습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 '네 눈으로 보라'는 뜻입니다. 가축을 세심하게 살피라는 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּהֵמָה / κτήνη
  english_pob_choice: livestock
  chosen_korean: 가축
  alternatives_korean:
  - 짐승
  - 가축떼
  - 동물
  lexicon: HALOT
  rationale: 소유한 가축을 가리키는 지혜문맥이므로, 일반적 '동물'보다 '가축'이 소유성과 실용성을 더 정확히 드러냅니다.
- source_word: רְאֵה עֵינֶיךָ / ἐπισκέπτου αὐτά
  english_pob_choice: Keep your eye on it
  chosen_korean: 눈여겨보십시오
  alternatives_korean:
  - 잘 살펴보십시오
  - 눈을 두고 보십시오
  - 돌보십시오
  lexicon: HALOT
  rationale: 직역하면 '눈으로 보라'는 관용구로, 단순 시각이 아니라 주의 깊은 감독과 점검의 뜻이므로 한국어의 자연스러운 관찰 표현을 택했습니다.
- source_word: אֻמָּנָה / χρήσιμα
  english_pob_choice: profitable
  chosen_korean: 쓸모가 있다
  alternatives_korean:
  - 유익하다
  - 이롭다
  - 수익이 난다
  lexicon: HALOT
  rationale: 히브리어의 정확한 뉘앙스가 다소 불확실하지만, 그리스어 병렬문의 '쓸모 있는'에 맞춰 실용적 유용성을 드러내는 표현으로 옮겼습니다.
- source_word: הַעֲמִידָהּ / ἐμμενέτω σοι
  english_pob_choice: keep it
  chosen_korean: 붙들어 두십시오
  alternatives_korean:
  - 유지하십시오
  - 계속 두십시오
  - 간직하십시오
  lexicon: HALOT
  rationale: 어근의 기본 뜻은 '서게 하다/머물게 하다'이므로, 여기서는 소유를 유지하며 계속 보유하라는 뜻을 살려 '붙들어 두십시오'로 옮겼습니다.
