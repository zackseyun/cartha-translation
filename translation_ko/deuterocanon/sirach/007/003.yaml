lexical_decisions:
- source_word: אַל תְּבַקֵּשׁ
  english_pob_choice: Do not seek
  chosen_korean: 구하지 마십시오
  alternatives_korean:
  - 찾지 마십시오
  - 구하려 하지 마십시오
  lexicon: HALOT
  rationale: בקש은 ‘구하다, 찾다’의 뜻이므로, 권고문의 금지형에 자연스럽고 격식을 갖춘 ‘구하지 마십시오’로 옮겼습니다.
- source_word: מֵאֵל
  english_pob_choice: from God
  chosen_korean: 하나님께서 주시는
  alternatives_korean:
  - 하나님에게서
  - 하나님으로부터
  lexicon: HALOT
  rationale: 직역하면 ‘하나님에게서’이지만, 한국어에서는 ‘하나님께서 주시는’이 문맥상 ‘권세/통치권’을 구하는 뉘앙스를 더 분명히 드러내며 원문의 출처 감각을 유지합니다.
- source_word: מֶמְשֶׁלַת
  english_pob_choice: authority
  chosen_korean: 통치권
  alternatives_korean:
  - 권세
  - 지배권
  - 권위
  lexicon: HALOT
  rationale: ממשלה는 통치, 다스림, 지배 권한을 가리키므로, 단순한 추상적 ‘권위’보다 실제적인 다스림의 성격을 살리는 ‘통치권’이 더 가깝습니다.
- source_word: מוֹשַׁב כָּבוֹד
  english_pob_choice: a seat of honor
  chosen_korean: 명예의 자리
  alternatives_korean:
  - 존귀한 자리
  - 영광의 자리
  - 명예로운 자리
  lexicon: HALOT
  rationale: מוֹשב은 ‘자리, 앉는 곳’이고 כבוד는 ‘명예/영광’이므로, 왕 앞의 높은 지위를 뜻하는 이미지가 드러나도록 ‘명예의 자리’로 옮겼습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행본문의 관계
  chosen_reading: 현존 히브리어 본문을 본문으로 번역하고, 그리스어의 다른 속담은 각주로 표시하지 않고 본문에 혼합하지 않았습니다.
  alternative_readings:
  - 「내 아들아, 불의의 밭고랑에 씨를 뿌리지 말라. 그러면 일곱 배로 거두지 못하리라」
  rationale: 이 절은 히브리어와 그리스어가 내용상 상당히 다르므로, 살아 남은 히브리어를 본문으로 삼는 POB 방침을 따르고, 다른 전승은 별도의 대체 독법으로 다루는 것이 소스 충실성에 부합합니다.
  doctrine_reference: 'PHILOSOPHY.md: translate from Hebrew where it survives; preserve source uncertainty honestly'
