translation:
  language: ko
  text: 모든 살아 있는 사람 앞에 선물을 주고, 죽은 자에게서도 친절을 거두지 마십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 “우는 이들에게서 물러서지 말고, 슬퍼하는 이들과 함께 슬퍼하라”라고 읽습니다. 이는 이 절의 상당히 다른 본문 전승을 반영합니다.
    reason: textual_variant
lexical_decisions:
- source_word: תֵּן
  english_pob_choice: Give
  chosen_korean: 주고
  alternatives_korean:
  - 주십시오
  - 내어 주고
  lexicon: HALOT
  rationale: נתן의 명령형을 자연스러운 현대 한국어로 옮기되, 이어지는 부정명령과의 병렬을 살리기 위해 연결형으로 처리했습니다.
- source_word: מַתָּן
  english_pob_choice: a gift
  chosen_korean: 선물
  alternatives_korean:
  - 증여물
  - 예물
  lexicon: HALOT
  rationale: 여기서는 광범위한 ‘gift’가 가장 자연스럽고, 제의적 뉘앙스를 덧씌우지 않는 ‘선물’이 적절합니다.
- source_word: לִפְנֵי כָל חָי
  english_pob_choice: before every living person
  chosen_korean: 모든 살아 있는 사람 앞에
  alternatives_korean:
  - 모든 산 사람 앞에
  - 모든 살아 있는 이 앞에
  lexicon: HALOT
  rationale: לִפְנֵי의 공간적·관계적 의미를 ‘앞에’로 살리고, כָל חָי의 인간 지시를 분명히 하기 위해 ‘사람’으로 풀었습니다.
- source_word: חָסֶד
  english_pob_choice: kindness
  chosen_korean: 친절
  alternatives_korean:
  - 은혜
  - 인애
  - 자애
  lexicon: HALOT
  rationale: 이 잠언적 문맥에서는 언약적 용어보다 실제적인 호의·배려가 핵심이므로, 현대 한국어에서 직접적인 ‘친절’을 택했습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행 전통의 관계
  chosen_reading: 히브리어 본문을 본문 번역의 기준으로 삼고, 그리스어 전통은 주석적 대안으로만 취급했습니다.
  alternative_readings:
  - '그리스어 병행: ''우는 이들에게서 물러서지 말고, 슬퍼하는 이들과 함께 슬퍼하라.'''
  rationale: 집회서에서는 살아 있는 히브리어 본문이 보존된 경우 히브리어를 우선하는 것이 원칙이며, 여기서는 그리스어가 단순한 어휘 차이보다 큰 전승 차이를 보이므로 본문 대신 주석적 기억으로만 남기는 편이 타당합니다.
  doctrine_reference: 'Sirach 번역 원칙: 보존된 히브리어 본문 우선, 그리스어는 병행 전승으로 검토'
