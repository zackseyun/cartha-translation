review_pass:
  verdict: revise
  source_fidelity: 첫째 행의 ‘스스로를 의롭게 하려 하지 마십시오’는 히트파엘의 반사적 의미를 대체로 전달하지만, ‘의롭게 하려’는 실제로 의로워지려 한다는 뜻으로도 들릴 수 있습니다. 둘째 행의 ‘분별 있는 체하다’는 실제 분별이 없으면서 가장한다는 뉘앙스를 더하므로, 본문의 자기 과시/드러냄보다 강합니다.
  naturalness: ‘왕 앞에서’와 합쇼체 종결은 자연스럽고 적절합니다. ‘스스로 의롭다 하지 마십시오’와 ‘분별을 드러내지 마십시오’가 현대 표준어에서 간결하면서도 본문의 병행을 더 잘 보존합니다.
  terminology: ‘의롭다’는 צדק 계열의 핵심 어휘를 보존합니다. ‘분별’은 בין 계열에 적절합니다. 본문과 크게 다른 그리스어 병행문을 알리는 각주도 필요하며, 인용문의 조사만 자연스럽게 다듬었습니다.
  issues:
