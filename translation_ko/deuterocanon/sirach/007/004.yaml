  - severity: low
    issue: ‘스스로를 의롭게 하려 하지 마십시오’는 ‘스스로를 의롭게 만들다’로 이해될 여지가 있습니다.
    rationale: ‘스스로 의롭다 하지 마십시오’는 자기 자신을 의롭다고 주장하거나 정당화하는 반사적 의미를 더 직접적으로 나타냅니다.
