translation:
  language: ko
  text: 왕 앞에서 스스로를 의롭게 하려 하지 마십시오[a]. 또한 왕 앞에서 분별 있는 체하지 마십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 ‘주님에게서 통치권을 구하지 말고, 왕에게서 영광의 자리를 구하지 말라’고 읽습니다. 여기서는 현존 히브리어 본문을 따릅니다.
    reason: textual_variant
lexical_decisions:
- source_word: אַל תִּצְטַדֵּק
  english_pob_choice: Do not justify yourself
  chosen_korean: 스스로를 의롭게 하려 하지 마십시오
  alternatives_korean:
  - 스스로를 변호하지 마십시오
  - 자신을 의롭다 하지 마십시오
  - 변명하지 마십시오
  lexicon: HALOT
  rationale: 히트파엘의 반사적 뉘앙스를 살리면서, 왕 앞에서 자기 의를 내세우지 말라는 경고를 자연스럽게 전합니다.
- source_word: לִפְנֵי מֶלֶךְ
  english_pob_choice: before a king
  chosen_korean: 왕 앞에서
  alternatives_korean:
  - 왕의 면전에서
  - 한 왕 앞에서
  lexicon: HALOT
  rationale: 히브리어의 직설적 전치사 표현을 한국어의 표준적인 존대 맥락으로 간결하게 옮겼습니다.
- source_word: תִּתְבּוֹנֵן
  english_pob_choice: show understanding
  chosen_korean: 분별 있는 체하지 마십시오
  alternatives_korean:
  - 이해 있는 체하지 마십시오
  - 슬기로워 보이려 하지 마십시오
  - 분별을 드러내지 마십시오
  lexicon: HALOT
  rationale: 이 동사는 단순한 내적 숙고보다 ‘분별 있음’을 드러내 보이려는 태도를 가리키므로, 사회적 경고의 힘을 살려 번역했습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행문의 차이
  chosen_reading: 현존 히브리어 본문을 따라 왕 앞에서의 자기 과시를 경계하는 뜻으로 옮겼습니다.
  alternative_readings:
  - 그리스어처럼 ‘주님에게서 통치권을 구하지 말고, 왕에게서 영광의 자리를 구하지 말라’는 뜻으로 옮김
  rationale: 집회서에서는 히브리어가 보존된 경우 히브리어를 우선하되, 그리스어의 상당히 다른 표현은 주석으로만 남기는 것이 본 프로젝트 원칙에 맞습니다.
