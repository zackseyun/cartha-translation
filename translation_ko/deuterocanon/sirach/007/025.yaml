  naturalness: ‘딸을 시집보내면 일이 끝나며’는 조건절과 연결 어미가 겹쳐 다소 매끄럽지 않습니다. 또한 ‘그녀를 주십시오’는 한국어에서 혼인 문맥이 즉시 드러나지 않고 다소 부자연스럽습니다. ‘딸을 주십시오’는 고대 혼인 관용을 보존하면서 여격 구문으로 대상과 관계를 명확히 합니다.
