base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/007/025.yaml
  text: Marry off a daughter[a], and the matter will be settled[b]; and give her to an intelligent man.
  footnotes:
  - marker: a
    text: Hebrew 'and the matter will go out'; the sense is that the concern is concluded. The Greek parallel reads more explicitly, 'and you will have completed a great task.'
    reason: alternative_reading
  - marker: b
    text: Or 'give her in marriage to a prudent man.'
    reason: lexical_alternative
translation:
  language: ko
  text: 딸을 시집보내면 일이 끝나며, 분별 있는 남자에게 그녀를 주십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘딸을 내보내라’에 가깝지만, 문맥상 ‘딸을 혼인시키다’는 뜻입니다. 그리스어 병행구는 ‘큰 일을 완수하다’라고 더 분명하게 풀이합니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘분별 있는 남자에게 그녀를 혼인시키십시오.’
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹצֵא
  english_pob_choice: Marry off
  chosen_korean: 시집보내면
  alternatives_korean:
  - 결혼시키면
  - 딸을 주면
  - 시집가게 하면
  lexicon: HALOT
  rationale: 문자적으로는 ‘내보내다’에 가깝지만, 딸과 혼인 문맥에서는 부모가 딸을 혼인시키는 뜻이므로 한국어 관용에 맞게 ‘시집보내다’로 옮겼습니다.
- source_word: וְיֵצֵא עֵסֶק
  english_pob_choice: the matter will be settled
  chosen_korean: 일이 끝나며
  alternatives_korean:
  - 일이 정리되며
  - 걱정이 끝나며
  - 그 일이 끝나며
  lexicon: HALOT
  rationale: עֵסֶק은 ‘일, 일거리, 일과 관련된 문제’의 폭이 있으나, 여기서는 딸의 혼인 준비와 관련된 걱정이 마무리되는 뜻이므로 간결하게 ‘일이 끝나다’로 풀었습니다.
- source_word: גֶּבֶר נָבוֹן
  english_pob_choice: an intelligent man
  chosen_korean: 분별 있는 남자
  alternatives_korean:
  - 지혜로운 남자
  - 슬기로운 남자
  - 이해력 있는 남자
  lexicon: HALOT
  rationale: נָבוֹן은 단순 지능보다 분별과 이해를 가리키므로, 현대 한국어에서 그 뉘앙스를 더 잘 드러내는 ‘분별 있는’으로 옮겼습니다.
theological_decisions:
- issue: 혼인 주체를 ‘give her’로 표현하는 방식
  chosen_reading: ‘그녀를 주십시오’로 옮겨, 혼인을 위한 딸의 인도를 직접적이되 과도하게 물화하지 않게 했습니다.
  alternative_readings:
  - ‘그녀를 혼인시키십시오’
  - ‘그녀를 아내로 주십시오’
  rationale: 히브리어와 그리스어 모두 부모가 딸을 상대 남자에게 ‘주는’ 관용을 사용하므로, 본문의 직설성을 살리되 한국어에서 오해를 줄이는 표현을 택했습니다.
  doctrine_reference: 가족 윤리와 지혜문학의 혼인 권면
