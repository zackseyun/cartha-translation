lexical_decisions:
- source_word: אַל תִּתְקַצֵּר
  english_pob_choice: Do not be fainthearted
  chosen_korean: 낙심하지 말고
  alternatives_korean:
  - 기운 빠지지 말고
  - 마음이 약해지지 말고
  - 낙담하지 말고
  lexicon: HALOT
  rationale: 히브리어 동사는 문자적으로는 '짧아지다/기력이 줄다'의 뜻을 띠지만, 그리스어 병행구 μὴ ὀλιγοψυχήσῃς가 '마음이 약해지다, 낙심하다'의 의미를 분명히 해 줍니다. 현대 한국어로는 이 권면의 힘을 살리는 '낙심하지 말고'가 가장 자연스럽습니다.
- source_word: בַּתְּפִלָּה
  english_pob_choice: in prayer
  chosen_korean: 기도에
  alternatives_korean:
  - 기도 중에
  - 당신의 기도에
  lexicon: HALOT
  rationale: 히브리어는 단순히 '기도 안에서/기도에'라고 말하며, 문맥상 특정 소유격을 요구하지 않습니다. 한국어에서는 '기도에'가 간결하고 원문에 가깝습니다.
- source_word: וּבִצְדָקָה
  english_pob_choice: to give alms
  chosen_korean: 자선을 베풀기를
  alternatives_korean:
  - 구제를 하기를
  - 구제하기를
  - 의를 행하기를
  lexicon: HALOT
  rationale: צדקה는 여기서 단순한 '의'보다 구제·자선의 뜻으로 쓰인 것으로 보이며, 그리스어 병행구 ἐλεημοσύνην ποιῆσαι가 이를 명시적으로 뒷받침합니다. 한국어 성경 문맥에서는 '자선을 베풀기를'이 의미를 직접 드러냅니다.
- source_word: אַל תִּתְעַבָּר
  english_pob_choice: do not neglect
  chosen_korean: 소홀히 하지 마십시오
  alternatives_korean:
  - 무시하지 마십시오
  - 간과하지 마십시오
  - 외면하지 마십시오
  lexicon: HALOT
  rationale: 동사의 기본 뜻은 '지나쳐 버리다/못 본 체하다'에 가깝고, 그리스어 μὴ παρίδῃς가 '간과하지 말라, 소홀히 하지 말라'는 의미를 확정합니다. 현대 합쇼체 권면으로는 '소홀히 하지 마십시오'가 자연스럽습니다.
