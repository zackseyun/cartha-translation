  lexicon: BDAG
  rationale: 히브리어 본문은 압축적이지만, 그리스어 평행본문이 뜻을 ‘어머니의 산고를 기억하라’로 풀어 주므로, 본문 의미를 반영하는 데 필요한 범위에서 한국어 본문은 자연스럽게 다듬고 그 해석적 확장은 주석 기능에 맡겼습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 평행본문의 결합
  chosen_reading: 히브리어를 본문 기초로 삼되, 마지막 행은 그리스어가 제시하는 ‘어머니의 산고를 잊지 말라’는 의미를 반영하여 번역했습니다.
  alternative_readings:
  - 히브리어를 더 문자적으로 따라 ‘너를 낳은 어머니를 잊지 말라’처럼 옮기는 방식
  rationale: 지혜문학의 압축된 히브리어는 문맥상 그리스어가 명시하는 의미를 수용할 때 더 정확하게 이해됩니다. 다만 한국어 본문은 과도한 설명을 피하고, 독자가 바로 읽을 수 있는 형태로 제시했습니다.
