  lexicon: HALOT
  rationale: 히브리어의 출생 행위를 분명히 드러내되, 한국어에서 어색하지 않게 과도한 의역 없이 옮겼습니다.
- source_word: μητρὸς ὠδῖνας
  english_pob_choice: the labor pains of your mother
  chosen_korean: 어머니를 잊지 마십시오
  alternatives_korean:
