translation:
  language: ko
  text: 온 마음을 다해 아버지를 공경하고, 너를 낳은 어머니의 산고[a]를 잊지 마십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 둘째 행은 ‘너를 낳은 어머니를 잊지 말라’는 식으로 압축되어 있습니다. 그리스어 평행본문은 그 뜻을 ‘어머니의 산고를 잊지 말라’로 명시합니다.
    reason: source_note
lexical_decisions:
- source_word: בְּכָל לִבְּךָ
  english_pob_choice: With all your heart
