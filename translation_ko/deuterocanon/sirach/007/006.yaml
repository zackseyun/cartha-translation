translation:
  language: ko
  text: 귀인을 보고 겁내지 마십시오. 그렇지 않으면 당신의 바름 속에 뇌물을 들이게 됩니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 평행문은 ‘당신의 바름에 걸림돌을 놓다’라고 더 넓게 표현합니다.
    reason: textual_variant
lexical_decisions:
- source_word: תָגוּר
  english_pob_choice: cower
  chosen_korean: 겁내지 마십시오
  alternatives_korean:
  - 두려워하지 마십시오
  - 기죽지 마십시오
  - 위축되지 마십시오
  lexicon: HALOT
  rationale: 단순한 감정적 두려움보다 권세 있는 사람 앞에서 위축되어 물러서는 뜻이므로, 합쇼체에서는 ‘겁내다’가 가장 자연스럽게 그 뉘앙스를 살립니다.
- source_word: נָדִיב
  english_pob_choice: noble
  chosen_korean: 귀인
  alternatives_korean:
  - 귀족
  - 고관
  - 유력자
  lexicon: HALOT
  rationale: 사회적 지위가 높은 사람을 가리키는 말이므로, 한국어에서는 ‘귀인’이 품격과 신분의 높음을 함께 담아 비교적 직접적으로 대응합니다.
- source_word: בֶּצַע
  english_pob_choice: a bribe
  chosen_korean: 뇌물
  alternatives_korean:
  - 부정한 이익
  - 탐욕스러운 이득
  - 불의한 이익
  lexicon: HALOT
  rationale: 문맥이 권세자 앞에서 바름이 흐트러지는 상황이므로, 추상적 ‘이익’보다 실제로 부정을 유발하는 ‘뇌물’이 영어 POB의 해석을 한국어로 명확히 옮깁니다.
- source_word: בִּתְמִימִיךָ
  english_pob_choice: within your integrity
  chosen_korean: 당신의 바름 속에
  alternatives_korean:
  - 당신의 온전함 속에
  - 당신의 정직함 안에
  - 당신의 결백 속에
  lexicon: HALOT
  rationale: תמים 계열의 윤리적 ‘온전함/바름’을 살리면서, ‘속에’로 내면적 영역에 부정한 것을 들여오는 이미지를 유지했습니다.
theological_decisions:
- issue: 마지막 구절의 의미를 어떻게 처리할 것인가
  chosen_reading: 히브리어를 따라 ‘뇌물을 들이게 됩니다’로 번역하되, 바름이 부패하는 내적·윤리적 결과를 드러내도록 했습니다.
  alternative_readings:
  - 당신의 바름에 걸림돌을 놓게 됩니다
  - 당신의 바름 안에 부정한 이익을 두게 됩니다
  rationale: 현존 히브리어는 ‘부정한 이익/뇌물’을 구체적으로 말하고, 그리스어 평행문은 더 넓게 ‘걸림돌’을 말합니다. 본문이 허락하는 범위 안에서 히브리어의 구체성을 우선하되, 그 결과가 곧 바름의 훼손임을 분명히 했습니다.
  doctrine_reference: 'PHILOSOPHY.md: preserve the surviving Hebrew where extant, while using the Greek parallel as a consistency check'
