    reason: lexical_alternative
lexical_decisions:
- source_word: בָּנוֹת לְךָ / θυγατέρες σοί εἰσιν
  english_pob_choice: Do you have daughters?
  chosen_korean: 딸이 있습니까?
  alternatives_korean:
  - 딸들이 있습니까?
  - 딸이 있으십니까?
  lexicon: HALOT / LSJ
  rationale: 히브리어와 그리스어가 모두 ‘딸들이 너에게/너에게 딸들이 있다’는 존재 구문을 사용하므로, 현대 한국어에서는 자연스러운 질문형으로 옮겼습니다.
- source_word: נְצוֹר / πρόσεχε
  english_pob_choice: Guard
  chosen_korean: 지키고
  alternatives_korean:
  - 보호하고
  - 살피고
  - 감시하고
  lexicon: HALOT / BDAG
  rationale: 명령의 핵심은 신중한 보호와 감시이므로, 한국어에서는 간결하게 ‘지키고’로 옮겨 경계의 뉘앙스를 살렸습니다.
- source_word: שְׁאֵרָם / τῷ σώματι αὐτῶν
  english_pob_choice: their bodies
  chosen_korean: 그들의 몸
  alternatives_korean:
  - 그들의 육체
  - 그들의 몸과 정절
  - 그들의 몸과 순결
  lexicon: HALOT / LSJ
  rationale: 그리스어 병행본문이 ‘몸’을 분명히 가리키므로, 본문 수준에서는 추상화된 ‘정절’보다 직접적인 ‘몸’이 더 근거가 있습니다.
- source_word: וְאַל תָּאִיר ... פָּנִים / καὶ μὴ ἱλαρώσῃς ... τὸ πρόσωπόν σου
  english_pob_choice: do not show them a cheerful face
  chosen_korean: 그들에게 얼굴을 환하게 하지 마십시오
  alternatives_korean:
  - 그들에게 너그러워 보이지 마십시오
  - 그들에게 밝은 얼굴을 보이지 마십시오
  - 그들에게 환한 얼굴을 하지 마십시오
  lexicon: HALOT / LSJ
  rationale: 직역하면 ‘얼굴을 밝히다’는 관용구이지만, 한국어에서는 낯선 직역을 약간 다듬되 원문의 얼굴-밝힘 이미지를 보존하는 표현으로 옮겼습니다.
theological_decisions:
- issue: 얼굴을 밝히는 관용구의 해석
  chosen_reading: 표면 이미지를 유지하되, 본문이 경고하는 과도한 관대함이나 응석을 한국어 본문에 직접 설명으로 풀어 넣지는 않았습니다.
  alternative_readings:
  - 그들에게 지나치게 너그러이 대하지 마십시오
  - 그들을 응석받이로 대하지 마십시오
  rationale: 이 구절은 윤리적 충고이지 교리 쟁점은 아니므로, 원문의 표현력을 보존하고 해석은 독자가 주해로 확인하도록 두는 편이 더 적절합니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
