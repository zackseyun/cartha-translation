translation:
  language: ko
  text: 또한 가난한 사람에게도 손을 내미십시오[a]. 그러면 당신의 복이 온전해질 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '그리스어 병행본: “선물의 친절이 모든 살아 있는 사람 앞에 있게 하라. 그리고 죽은 자에게서도 친절을 거두지 말라.” 히브리어 증거는 여기서 “또한 가난한 사람에게 손을 내미라, 그러면 당신의 복이 온전해질 것이다”라고 읽습니다.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְגַם
  english_pob_choice: Also
  chosen_korean: 또한
  alternatives_korean:
  - 그리고 또한
  - 더욱이
  lexicon: HALOT
  rationale: 앞선 권면에 항목을 덧붙이는 접속부로서, 간결한 ‘또한’이 추가의 힘을 자연스럽게 살립니다.
- source_word: לְאֶבְיוֹן
  english_pob_choice: to the poor
  chosen_korean: 가난한 사람에게
  alternatives_korean:
  - 가난한 이에게
  - 궁핍한 사람에게
  lexicon: HALOT
  rationale: אֶבְיוֹן은 사회적으로 가난한 사람을 가리키므로, 현대 한국어에서는 ‘가난한 사람’이 가장 직관적으로 대응됩니다.
- source_word: הוֹשִׁיט יָד
  english_pob_choice: stretch out your hand
  chosen_korean: 손을 내미십시오
  alternatives_korean:
  - 손을 펴십시오
  - 손을 뻗으십시오
  - 손을 내밀어 주십시오
  lexicon: HALOT
  rationale: 히브리어의 몸짓 이미지를 유지하면서도, 자선과 도움의 관용적 의미를 살리는 한국어 표현으로 옮겼습니다.
- source_word: תִּשְׁלַם בִּרְכָתֶךָ
  english_pob_choice: your blessing may be complete
  chosen_korean: 당신의 복이 온전해질 것입니다
  alternatives_korean:
  - 당신의 복이 완성될 것입니다
  - 당신의 복이 충만해질 것입니다
  lexicon: HALOT
  rationale: שלם의 ‘완전해지다/온전해지다’ 의미를 따라, 결과절의 자연스러운 한국어로 옮겼습니다. ‘복’은 여기서 הברכה의 일반적 축복/복된 상태를 포괄합니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행본의 차이
  chosen_reading: 본문은 살아 있는 히브리어 증거를 따르고, 그리스어 병행본은 각주로 남겼습니다.
  alternative_readings:
  - '그리스어: ‘선물의 친절이 모든 살아 있는 사람 앞에 있게 하라. 그리고 죽은 자에게서도 친절을 거두지 말라.’'
  rationale: 이 절은 히브리어와 그리스어가 상당히 다르므로, 서기관 전승의 차이를 지우지 않기 위해 히브리어 본문을 본문으로 두고 그리스어를 대안 증거로 보존합니다.
  doctrine_reference: 'PHILOSOPHY.md: translate Sirach from Hebrew where it survives; use Swete LXX as Greek source alongside Hebrew witness.'
