  naturalness: ‘가난한 이’는 격식 있는 성서 문체에서 자연스럽고, ‘그렇게 하여 … 온전해지도록 하십시오’는 합쇼체를 유지하면서 히브리어의 목적 관계를 자연스럽게 드러냅니다. 그리스어 각주는 ‘죽은 이에게도’로 고치면 한국어 의미 관계도 명료해집니다.
