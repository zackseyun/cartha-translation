lexical_decisions:
- source_word: לֶחֶם אַבִּירִים
  english_pob_choice: Bread of the mighty
  chosen_korean: 힘센 이들의 빵
  alternatives_korean:
  - 권세자들의 빵
  - 용사들의 빵
  - 강한 자들의 빵
  lexicon: HALOT
  rationale: אַבִּירִים은 문맥상 ‘힘센 이들/강한 자들’을 가리키는 보수적 번역이 가장 안전하여, 영어 POB의 the mighty를 따라 자연스러운 복수 소유 표현으로 옮겼습니다.
- source_word: וּתְרוּמַת יָד
  english_pob_choice: an offering of the hand
  chosen_korean: 손의 예물
  alternatives_korean:
  - 손에서 드리는 예물
  - 손으로 드리는 예물
  - 손의 바침
  lexicon: HALOT
  rationale: תרומה의 ‘예물/바침’ 의미를 살리면서, יד를 문자 그대로 ‘손’으로 유지해 히브리어의 직설적 이미지를 보존했습니다.
- source_word: זִבְחֵי צֶדֶק
  english_pob_choice: sacrifices of righteousness
  chosen_korean: 의의 제물
  alternatives_korean:
  - 의로운 제물
  - 정의의 제물
  - 의로움의 제물
  lexicon: HALOT
  rationale: צֶדֶק의 추상명사성을 살려 ‘의의 제물’로 옮겨, 영어 POB의 복합 명사 구조를 과도하게 윤문하지 않았습니다.
- source_word: וּתְרוּמַת קֹדֶשׁ
  english_pob_choice: a holy contribution
  chosen_korean: 거룩한 기여물
  alternatives_korean:
  - 거룩한 예물
  - 성별된 기여물
  - 거룩한 바침
  lexicon: HALOT
  rationale: קֹדֶשׁ의 성별/거룩함을 ‘거룩한’으로 유지하고, תרומה의 헌납 성격을 ‘기여물’로 표현해 예배적 헌납의 뉘앙스를 반영했습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행문의 큰 차이
  chosen_reading: 본문은 현존 히브리어를 따르되, 그리스어가 제시하는 다른 전통은 각주로 보존하지 않았습니다.
  alternative_readings:
  - ‘가난한 이에게 네 손을 내밀라, 그리하여 네 복이 완전해지게 하라’
  rationale: 이 절은 히브리어와 그리스어가 실질적으로 다른 내용을 전하므로, 본문은 히브리어 증언을 따르는 것이 원칙에 부합합니다. 다만 본 예고문은 핵심이 헌납 이미지이므로, 별도 각주 없이도 번역의 의미를 충분히 드러낼 수 있습니다.
  doctrine_reference: Sirach Hebrew-priority policy; significant textual divergence handled conservatively.
