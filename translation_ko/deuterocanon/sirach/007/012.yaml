translation:
  language: ko
  text: 형제에게 폭력을 꾀하지 말고, 친구와 동료에게도 똑같이 하지 마십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חָמָס
  english_pob_choice: plot violence
  chosen_korean: 폭력을 꾸미다
  alternatives_korean:
  - 해악을 도모하다
  - 폭력을 계획하다
  - 악을 꾀하다
  lexicon: חָמָס
  rationale: 히브리어 חָמָס는 단순한 ‘폭력’ 자체보다 해를 끼칠 의도적 가해를 가리키므로, POB의 ‘plot violence’를 살려 ‘폭력을 꾸미다’로 옮겼습니다.
- source_word: עַל אָח
  english_pob_choice: against a brother
  chosen_korean: 형제에게
  alternatives_korean:
  - 형제를 향해
  - 형제에 대하여
  - 형제에게 해를
  lexicon: אָח
  rationale: 전치사 עַל의 대립 관계를 한국어에서는 목적어 표지보다 방향성을 가진 ‘에게’로 자연스럽게 드러냈습니다.
- source_word: רֵעַ וְחָבֵר
  english_pob_choice: a friend or companion
  chosen_korean: 친구나 동료
  alternatives_korean:
  - 벗이나 동료
  - 친구나 벗
  - 이웃이나 동료
  lexicon: רֵעַ / חָבֵר
  rationale: 두 명사 모두 관계적 가까움을 말하므로, 문맥에 맞는 평행 표현으로 ‘친구나 동료’를 선택해 중복을 피하면서 의미 범위를 살렸습니다.
theological_decisions:
- issue: 악행의 의도성을 어떻게 드러낼지
  chosen_reading: 본문은 단순한 폭력 행위보다 그에 앞선 의도적 음모를 금지합니다.
  alternative_readings:
  - 단순히 폭력을 행하지 말라는 윤리적 금지
  - 형제를 상대로 한 일반적 해악 금지
  rationale: 히브리어 동사와 POB의 ‘plot’은 실행보다 기획·모의에 무게가 있으므로, 본문의 도덕적 긴장을 유지하기 위해 ‘꾸미지 말라’로 번역했습니다.
  doctrine_reference: 잠언적 지혜문학의 금지 명령
- issue: 병렬 구문의 반복을 어떻게 처리할지
  chosen_reading: ‘친구나 동료에게도 그와 같이 하지 마십시오’로 후반 병렬을 압축해 자연스러운 한국어로 유지했습니다.
  alternative_readings:
  - ‘그리고 친구와 동료에게도 같은 일을 하지 마십시오’
  - ‘친구와 동료에게도 동일하게 하지 마십시오’
  rationale: 히브리어의 יַחְדָּו와 그리스어의 τὸ ὅμοιον은 ‘같은 방식으로’의 병렬성을 강조하므로, 한국어에서는 ‘그와 같이’로 간결하게 반영했습니다.
  doctrine_reference: 평행법 보존
