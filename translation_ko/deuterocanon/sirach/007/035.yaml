translation:
  language: ko
  text: 우는 이들과 함께 있기를 미루지 말고, 애도하는 이들과 함께 애도하십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '그리스어 증인: “병자를 방문하는 일을 미루지 말라. 그러면 그런 일들로 인해 사랑을 받게 될 것이다.” 이는 현존 히브리어와 상당히 다른 독법입니다.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תִּתְאַחֵר
  english_pob_choice: Do not delay
  chosen_korean: 미루지 말고
  alternatives_korean:
  - 지체하지 말고
  - 늦추지 말고
  - 머뭇거리지 말고
  lexicon: HALOT
  rationale: 부정 명령으로서 ‘지연시키지 말라’는 뜻을 자연스럽게 살리되, 한국어에서 문맥상 가장 직접적인 행동 촉구인 ‘미루지 말고’로 옮겼습니다.
- source_word: מִבּוֹכִים
  english_pob_choice: with those who weep
  chosen_korean: 우는 이들과
  alternatives_korean:
  - 우는 사람들과
  - 슬퍼하는 이들과
  - 애도하는 이들과
  lexicon: HALOT
  rationale: 히브리어는 ‘우는 사람들’과의 동행/연대를 가리키므로, 관계를 분명히 드러내는 ‘~와 함께’ 구조를 유지했습니다.
- source_word: אֲבֵלִים
  english_pob_choice: those who mourn
  chosen_korean: 애도하는 이들과
  alternatives_korean:
  - 애도자들과
  - 슬퍼하는 이들과
  - 상중인 이들과
  lexicon: HALOT
  rationale: 명사 ‘상주/애도자’의 의미를 현대 한국어에서 분명하게 드러내기 위해 ‘애도하는 이들’로 옮겼습니다.
- source_word: תִּתְאַבָּל
  english_pob_choice: mourn
  chosen_korean: 애도하십시오
  alternatives_korean:
  - 슬퍼하십시오
  - 함께 우십시오
  - 애통하십시오
  lexicon: HALOT
  rationale: 앞절과의 동형 평행을 살리기 위해 같은 어근 계열인 ‘애도하다’를 반복해, 함께 슬퍼하는 윤리를 분명하게 표현했습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 증인의 차이
  chosen_reading: 주본문은 현존 히브리어의 ‘우는 이들과 함께하고, 애도하는 이들과 함께 애도하라’는 권고를 따랐습니다.
  alternative_readings:
  - 그리스어 증인은 ‘병자를 방문하는 일을 미루지 말라. 그러면 그런 일들로 인해 사랑을 받게 될 것이다’라고 읽습니다.
  rationale: 집회서에서는 살아남은 히브리어를 우선하되, 그리스어가 상당히 다른 독법을 보이는 경우에는 본문과 분리해 보존하는 것이 원문 충실성과 감사 가능성을 함께 지키는 방식입니다.
  doctrine_reference: 'PHILOSOPHY.md: 히브리어가 보존된 경우 히브리어 본문을 우선하고, 중대한 평행 전승 차이는 주석으로 보존한다.'
