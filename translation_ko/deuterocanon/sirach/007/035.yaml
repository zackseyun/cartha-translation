base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/007/035.yaml
  text: Do not delay with those who weep[a], and mourn with those who mourn.
  footnotes:
  - marker: a
    text: 'Greek witness: ''Do not hesitate to visit the sick, for from such things you will be loved.'' This is a substantially different reading from the extant Hebrew.'
