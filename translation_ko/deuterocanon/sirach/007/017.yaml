lexical_decisions:
- source_word: ταπείνωσον
  english_pob_choice: Humble
  chosen_korean: 낮추십시오
  alternatives_korean:
  - 겸손하게 하십시오
  - 낮아지십시오
  - 겸비하십시오
  lexicon: ταπεινόω
  rationale: 명령형으로서 ‘낮추다/낮아지다’가 헬라어의 낮춤·겸비의 행동을 가장 सीधे하게 드러내며, 합쇼체에서도 자연스럽습니다.
- source_word: τὴν ψυχήν σου
  english_pob_choice: your soul
  chosen_korean: 네 영
  alternatives_korean:
  - 네 혼
  - 네 목숨
  - 네 마음
  lexicon: ψυχή
  rationale: 시락 전승의 ‘soul’은 한국어 성서에서 문맥에 따라 ‘영’으로 옮길 수 있으며, 단순한 감정이 아니라 사람의 내면 전체를 가리키는 무게를 살리기 위해 ‘영’을 택했습니다.
- source_word: σφόδρα
  english_pob_choice: greatly
  chosen_korean: 크게
  alternatives_korean:
  - 몹시
  - 지극히
  - 매우
  lexicon: σφόδρα
  rationale: 강조 부사로서 원문의 강도를 유지하면서도 문어체에서 자연스러운 정도 부사인 ‘크게’를 사용했습니다.
theological_decisions:
- issue: 히브리어·헬라어 본문의 방향 차이
  chosen_reading: 히브리어 전승의 ‘하나님께 맡기고 그의 길을 받아들이라’는 확장 대신, 헬라어 병행구의 ‘네 영을 크게 낮추라’에 따라 간결한 권면으로 번역했습니다.
  alternative_readings:
  - ‘하나님께 맡기고 그분의 길을 받아들이십시오’
  - ‘몹시 겸손해지십시오’
  rationale: 제시된 English POB는 후기 개정에서 본문을 ‘Humble your soul greatly’로 환원하고 있으며, 주어진 그리스어 병행구도 같은 방향이므로, 본문 핵심인 자기 낮춤을 직접적으로 반영했습니다.
