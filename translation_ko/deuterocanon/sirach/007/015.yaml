  naturalness: ‘사람들의 죽은 자들 가운데에 자신을 두지 마십시오’는 이해되지만 ‘자신을 … 넣지 마십시오’가 범주에 자신을 계산해 넣는 뜻을 더 자연스럽고 정확하게 전달합니다. ‘기억하십시오’ 뒤는 쉼표보다 마침표가 현대 한국어 문장 흐름에 적합합니다.
  terminology: ‘백성의 죽은 이들’은 עם의 공동체적 소유 관계와 מותי의 구체성을 간결하게 보존합니다. ‘지나감’은 난해한 עִבָּרוֹן을 단정적으로 ‘죽어감’으로 한정하지 않으면서도 주석을 통해 문맥상 함의를 밝혀 둘 수 있습니다. ‘지극히 높으신 분’은 Ὑψίστος의 존칭으로 적절합니다.
