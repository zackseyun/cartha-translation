base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/007/015.yaml
  text: Do not count yourself among the people’s dead[b][a]; remember that passing away will not pass over.
  footnotes:
  - marker: a
    text: 'Greek tradition: “Do not hate hard labor and farming created by the Most High.” The Greek differs substantially from the surviving Hebrew here.'
    reason: alternative_reading
  - marker: b
    text: The Hebrew of the second line is difficult and may involve wordplay on “passing over / passing away”; the sense is that death or mortality does not bypass anyone.
    reason: lexical_alternative
translation:
  language: ko
  text: 백성의 죽은 이들 가운데에 자신을 넣지 마십시오. 기억하십시오. 지나감은 누구도 비켜 가지 않습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '그리스어 전승: “힘든 노동과 지극히 높으신 분이 지으신 농사를 미워하지 마십시오.” 그리스어는 현존 히브리어 본문과 상당히 다릅니다.'
    reason: alternative_reading
  - marker: b
    text: 히브리어 둘째 행은 난해하며, ‘지나감/지나가다’의 말놀이를 포함할 수 있습니다. 문맥상 죽음 또는 유한함과 관련되며, 누구도 이를 피할 수 없다는 뜻을 암시합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תַּחְשׁוֹבְךָ
  english_pob_choice: Do not count yourself
  chosen_korean: 자신을 두지 마십시오
  alternatives_korean:
  - 자신을 헤아리지 마십시오
  - 자신을 여기지 마십시오
  - 자신을 포함시키지 마십시오
  lexicon: HALOT
  rationale: חשב의 반성적 용법을 따라 어떤 범주에 자신을 넣어 셈하는 금지를 자연스러운 현대 한국어로 옮겼습니다. '두다'는 문맥상 소속 판단을 드러내며, 과도하게 해석을 덧붙이지 않습니다.
- source_word: בָּמֳתֵי עָם
  english_pob_choice: among the people’s dead
  chosen_korean: 사람들의 죽은 자들 가운데에
  alternatives_korean:
  - 백성의 죽은 자들 가운데에
  - 사람들의 사망자들 가운데에
  - 백성의 죽은 이들 가운데에
  lexicon: HALOT
  rationale: מותי를 '죽은 자들'로 받아 구체적 집단을 살렸고, עם은 문맥상 공동체/사람들을 가리키므로 '사람들'로 옮겼습니다. '가운데에'는 소속 범주를 드러내는 전치사값을 유지합니다.
- source_word: עִבָּרוֹן
  english_pob_choice: passing away
  chosen_korean: 죽어감
  alternatives_korean:
  - 지나감
  - 사라짐
  - 죽음
  lexicon: HALOT
  rationale: 어근 עבר의 '지나가다/지나감'과 바로 뒤 동사와의 말장난을 살리면서, 문맥상 죽음·유한성을 가리키는 뜻을 드러내기 위해 '죽어감'으로 옮겼습니다. 너무 단정적인 '죽음'보다 과정성을 더 잘 보여줍니다.
- source_word: לֹא יִתְעַבָּר
  english_pob_choice: will not pass over
  chosen_korean: 누구도 비켜 가지 않습니다
  alternatives_korean:
  - 지나치지 않습니다
  - 피해 가지 않습니다
  - 비껴 가지 않습니다
  lexicon: HALOT
  rationale: עבר의 어감과 앞말의 말장난을 고려해 '비켜 가다'를 택했습니다. 한국어에서 '누구도 비켜 가지 않습니다'는 보편적 예외 없음과 피할 수 없음을 자연스럽게 전달합니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행본문의 큰 차이
  chosen_reading: 본문은 현존 히브리어를 따르고, 그리스어는 주석에서 대안 전통으로만 보존했습니다.
  alternative_readings:
  - '그리스어 전통: ''힘든 노동과 지극히 높으신 분이 지으신 농사를 미워하지 마라'''
  rationale: 집회서에서는 히브리어가 남아 있는 곳은 히브리어를 본문으로 삼는 것이 원칙이며, 여기서는 히브리어가 고신뢰로 전해집니다. 다만 그리스어는 실질적으로 다른 전승이므로 본문에 섞어 넣지 않고 대안으로만 남겨 투명성을 지켰습니다.
  doctrine_reference: 'PHILOSOPHY.md: translate from Hebrew where it survives; preserve major parallel traditions honestly.'
