base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/007/018.yaml
  text: Do not trade away a friend for a price[c][b][a], or a brother who is worth the gold of Ophir.
  footnotes:
  - marker: a
    text: 'Greek has a very different reading here: ''Remember that anger does not last long.'' The Hebrew witness preserved in the Cairo Geniza instead warns against trading away a friend or brother for wealth.'
    reason: textual_variant
  - marker: b
    text: Or 'exchange a friend for payment.'
    reason: lexical_alternative
  - marker: c
    text: '''Brother'' may refer to a literal brother or, more broadly, a close kinsman or companion.'
    reason: lexical_alternative
translation:
  language: ko
  text: 친구를 값으로 바꾸지 말고, 오빌의 금만큼 값진 형제를 버리지 마십시오.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 본문은 여기서 전혀 다른 독법을 보이며, ‘분노가 오래 지속되지 않는다는 것을 기억하십시오’라고 합니다. 카이로 게니자 계열의 히브리어는 친구나 형제를 재물 때문에 바꾸지 말라고 경고합니다.
    reason: textual_variant
  - marker: b
    text: 또는 ‘친구를 대가로 교환하지 말고’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘형제’는 문자적 형제뿐 아니라 가까운 친족이나 동료를 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תָּמִיר
  english_pob_choice: trade away
  chosen_korean: 값으로 바꾸지 말고
  alternatives_korean:
  - 교환하지 말고
  - 팔아넘기지 말고
  - 바꾸지 말고
  lexicon: HALOT
  rationale: 히필형의 תמיר는 단순 교체보다 대가를 전제로 한 교환·양도를 뜻하므로, 상업적 뉘앙스를 살려 ‘값으로 바꾸지 말고’로 옮겼습니다.
- source_word: אוֹהֵב
  english_pob_choice: friend
  chosen_korean: 친구
  alternatives_korean:
  - 사랑하는 이
  - 사랑하는 벗
  - 벗
  lexicon: HALOT
  rationale: 직역하면 ‘사랑하는 자’이지만, 지혜문학 문맥에서는 관계의 충실함을 가리키므로 한국어로는 자연스럽게 ‘친구’가 가장 적절합니다.
- source_word: בִּמְחִיר
  english_pob_choice: for a price
  chosen_korean: 값으로
  alternatives_korean:
  - 대가로
  - 돈을 받고
  - 보상으로
  lexicon: HALOT
  rationale: מְחִיר는 가격·대가를 뜻하므로, 물질적 거래성을 드러내는 ‘값으로’가 본문의 경고를 잘 살립니다.
- source_word: אָח תָּלוּי בִּזְהַב אוֹפִיר
  english_pob_choice: a brother who is worth the gold of Ophir
  chosen_korean: 오빌의 금만큼 값진 형제
  alternatives_korean:
  - 오빌의 금과 맞먹는 형제
  - 오빌의 금에 버금가는 형제
  - 오빌의 금보다 귀한 형제
  lexicon: HALOT
  rationale: תָּלוּי는 כאן에서 문자적 ‘매달린’보다 가치 비교의 뜻으로 읽히므로, ‘값진’으로 풀어 한국어에서 비교적 자연스럽게 가치 평가를 전달했습니다. אַח는 기본적으로 ‘형제’로 보존했습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행본문의 차이
  chosen_reading: 히브리어 본문을 본문 번역의 기준으로 삼고, 그리스어의 전혀 다른 독법은 각주로 보존합니다.
  alternative_readings:
  - '그리스어: ‘분노가 오래 지속되지 않는다는 것을 기억하십시오’'
  rationale: 집회서에서는 히브리어가 남아 있는 경우 이를 우선하되, 본 구절처럼 전통이 크게 갈라지면 본문 불안정을 숨기지 않는 것이 투명한 번역 원칙에 부합합니다.
  doctrine_reference: 'POB translation philosophy: surviving Hebrew is primary; major textual divergence is preserved honestly'
