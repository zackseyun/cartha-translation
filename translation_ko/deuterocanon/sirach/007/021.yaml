lexical_decisions:
- source_word: עֶבֶד
  english_pob_choice: slave
  chosen_korean: 노예
  alternatives_korean:
  - 종
  - 시종
  lexicon: HALOT
  rationale: 뒤에 이어지는 “자유”와 연결될 때 본문은 종속된 신분을 분명히 드러내므로, 완곡한 “종”보다 POB의 선택을 따라 “노예”가 원문의 사회적 상태를 더 직접적으로 반영합니다.
- source_word: מַשְׂכִּיל
  english_pob_choice: intelligent
  chosen_korean: 지혜로운
  alternatives_korean:
  - 총명한
  - 슬기로운
  - 분별력 있는
  lexicon: HALOT
  rationale: 이 형용사는 이해와 분별을 가진 사람을 가리키므로, 현대 한국어에서 자연스럽고 본문의 긍정적 평가를 살리는 “지혜로운”으로 옮겼습니다. 영어 POB의 “intelligent”도 같은 판단 능력을 가리킵니다.
- source_word: חַבֵּב
  english_pob_choice: love
  chosen_korean: 사랑하십시오
  alternatives_korean:
  - 귀하게 여기십시오
  - 아끼십시오
  lexicon: HALOT
  rationale: 명령형은 단순한 호의가 아니라 진정한 애정을 요구하므로, “사랑하다”가 원문의 강도를 가장 잘 전달합니다.
- source_word: חֹפֶשׁ
  english_pob_choice: freedom
  chosen_korean: 자유
  alternatives_korean:
  - 해방
  - 석방
  lexicon: HALOT
  rationale: 명사 חֹפֶשׁ은 자유 상태, 즉 속박에서 풀린 신분을 가리키므로, 문맥상 가장 자연스러운 표준어인 “자유”로 옮겼습니다.
theological_decisions:
