base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/007/002.yaml
  text: Do not sow furrows of injustice against a brother[b][a], lest you reap it sevenfold.
  footnotes:
  - marker: a
    text: Hebrew literally has 'reap him/it'; the suffix is ambiguous in isolation. The translation takes it as referring to the injustice sown, which best fits the sowing-and-reaping imagery.
    reason: lexical_alternative
  - marker: b
    text: The Greek parallel reads more generally, 'Turn away from injustice, and it will turn away from you,' reflecting a different form of the saying than the extant Hebrew.
    reason: alternative_reading
translation:
  language: ko
  text: 형제에게 불의의 고랑을 뿌리지 마십시오. 그러면 그것을 일곱 배로 거두게 될 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 목적어 접미사는 단독으로는 모호합니다. 여기서는 뿌린 불의가 되돌아와 거두어지는 것으로 이해했습니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어 평행문은 더 일반적으로 '불의에서 떠나라, 그러면 그것이 너에게서 떠날 것이다'라고 읽힙니다. 현존 히브리어는 더 구체적인 농경 비유를 보존합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תִּזְרַע
  english_pob_choice: Do not sow
  chosen_korean: 뿌리지 마십시오
  alternatives_korean:
  - 심지 마십시오
  - 뿌려서는 안 됩니다
  lexicon: HALOT
  rationale: 농경 비유를 살리되 현대 한국어에서 가장 자연스러운 금지 표현으로 옮겼습니다. '심다'보다 '뿌리다'가 씨 뿌리기와 추수의 대응을 더 잘 드러냅니다.
- source_word: חֲרוּשֵׁי עָוֶל
  english_pob_choice: furrows of injustice
  chosen_korean: 불의의 고랑
  alternatives_korean:
  - 불의의 쟁기질
  - 부정의의 고랑
  - 불의한 행위
  lexicon: HALOT
  rationale: 직역에 가까운 농경 이미지를 유지하기 위해 '고랑'을 택했습니다. POB의 'furrows'처럼 비유를 지워서 일반 윤리 격언으로 약화시키지 않도록 했습니다.
- source_word: עַל אָח
  english_pob_choice: against a brother
  chosen_korean: 형제에게
  alternatives_korean:
  - 형제를 향하여
  - 형제에 대하여
  - 네 형제에게
  lexicon: HALOT
  rationale: 문맥상 적대적 방향을 드러내는 표현으로 한국어에서는 '형제에게'가 가장 간결하고 자연스럽습니다. 원문이 가진 사회적·관계적 대상을 보존했습니다.
- source_word: שִׁבְעָתָיִם
  english_pob_choice: sevenfold
  chosen_korean: 일곱 배로
  alternatives_korean:
  - 일곱 배나
  - 칠배로
  lexicon: HALOT
  rationale: 히브리어의 수적 강조를 그대로 살리기 위해 '일곱 배로'로 옮겼습니다. 한국어 성경에서 익숙한 '칠배'보다 의미가 분명하고 현대적입니다.
theological_decisions:
- issue: תִּקְצְרֵהוּ의 목적어 해석
  chosen_reading: '''그것을''로 옮겨, 뿌린 불의가 되돌아와 거두어질 대상임을 드러냈습니다.'
  alternative_readings:
  - '''그를''로 옮겨 형제를 가리킬 가능성'
  - 그리스어 평행문의 일반화된 의미를 따라 '불의가 너를 떠나게 된다'로 완화하는 읽기
  rationale: 히브리어의 농경 은유는 뿌린 것과 거두는 것의 대응을 강하게 요구하므로, 목적어를 불의로 이해하는 것이 가장 자연스럽습니다. 다만 대명사 자체는 문법적으로 여지를 남기므로, 그 긴장은 유지했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 4, 5
