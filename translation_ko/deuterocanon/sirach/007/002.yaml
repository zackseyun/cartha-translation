  rationale: 한국어에서 성립하지 않는 '고랑을 뿌리다'를 '불의의 밭고랑에 씨를 뿌리다'로 조정했습니다. 이는 씨 뿌림-거둠의 비유를 보존하면서 히브리어의 압축된 농경 표현을 자연스러운 한국어로 재구성한 것입니다. '형제를 해치려고'는 על אח의 적대적 방향을 명확히 하며, '그렇지 않으면'은 פן의 경고를 반영합니다. 대명사의 지시 대상에 관한 불확실성과 그리스어의 이문은 각주로 보존했습니다.
