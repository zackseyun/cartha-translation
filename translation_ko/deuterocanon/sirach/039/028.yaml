base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/039/028.yaml
  text: There are spirits created for judgment[a], and in their anger they move mountains; at the time of wrath they display their might[b], and they stir up a storm from the open country.
  footnotes:
  - marker: a
    text: Or 'winds created for punishment.' Hebrew רוחות and Greek πνεύματα can denote either 'spirits' or 'winds.'
    reason: lexical_alternative
  - marker: b
    text: The latter clause is bracketed in the Cairo Geniza Hebrew edition, indicating some textual uncertainty; the Greek witness supports including the fuller sense of the verse.
    reason: textual_variant
translation:
  language: ko
  text: 판결을 위해 지음 받은 영들이 있습니다[a]. 그들의 분노 속에서 그들은 산들을 옮기며, 진노의 때에는 그들의 힘을 드러내고[b], 들판에서 폭풍을 일으킵니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘벌을 위해 지음 받은 바람들.’ 히브리어 רוחות와 그리스어 πνεύματα는 둘 다 ‘바람들’ 또는 ‘영들’을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 카이로 겐니자 본문에서는 이 뒤 절이 괄호로 표시되어 있어 전승상 다소 불확실하지만, 그리스어 증거가 더 넓은 의미를 지지합니다.
    reason: textual_variant
lexical_decisions:
- source_word: רוחות / πνεύματα
  english_pob_choice: spirits
  chosen_korean: 영들
  alternatives_korean:
  - 바람들
  - 정령들
  lexicon: HALOT; LSJ
  rationale: 히브리어와 그리스어가 모두 '바람/영'의 이중 의미를 가지지만, 심판을 위해 창조된 존재라는 문맥은 단순한 기상 현상보다 주체적 작용자를 가리키므로 '영들'이 가장 적절합니다.
- source_word: למשפט / εἰς ἐκδίκησιν
  english_pob_choice: for judgment
  chosen_korean: 판결을 위해
  alternatives_korean:
  - 심판을 위해
  - 징벌을 위해
  lexicon: HALOT; BDAG
  rationale: 문맥상 단순한 법정 판정이라기보다 응보적 심판의 목적을 포함하지만, 한국어에서 의미를 지나치게 좁히지 않도록 '판결을 위해'로 옮겨 심판성과 집행성을 함께 살렸습니다.
- source_word: ובאפם / ἐν θυμῷ αὐτῶν
  english_pob_choice: in their anger
  chosen_korean: 그들의 분노 속에서
  alternatives_korean:
  - 그들의 진노 속에서
  - 그들이 분노하여
  lexicon: HALOT; BDAG
  rationale: אַף/θυμός의 기본 의미는 분노이며, 행위의 동시성을 드러내기 위해 '속에서'를 더해 원문의 힘 있는 이미지를 유지했습니다.
- source_word: הרים יעתיקו
  english_pob_choice: they move mountains
  chosen_korean: 그들은 산들을 옮기며
  alternatives_korean:
  - 그들은 산들을 움직이며
  - 산들을 뿌리째 옮기며
  lexicon: HALOT
  rationale: 히브리어 관용구의 과장법을 자연스러운 한국어로 옮기기 위해 '산들을 옮기며'를 택해 파괴적 능력을 과장 없이 전달했습니다.
- source_word: שדה
  english_pob_choice: open country
  chosen_korean: 들판
  alternatives_korean:
  - 넓은 들
  - 들
  lexicon: HALOT
  rationale: שדה는 여기서 도시가 아닌 열린 야외 공간을 가리키므로, POB의 'open country'에 맞추어 '들판'으로 옮겼습니다.
theological_decisions:
- issue: רוחות/πνεύματα를 '영들'로 유지할지, '바람들'로 바꿀지
  chosen_reading: 주체적 심판 도구로서의 '영들'을 본문에 두고, 기상적 의미는 주석으로 열어 둡니다.
  alternative_readings:
  - 바람들
  - 심판용 바람들
  rationale: 히브리어와 그리스어는 둘 다 가능한 다의성을 갖지만, 본문은 '창조됨'과 '분노'를 말하여 단순한 날씨보다 인격적/준인격적 도구의 느낌이 강합니다. 그래서 본문에서는 '영들'을 택하고, 다의성은 각주로 보존합니다.
  doctrine_reference: DOCTRINE.md §3 Preserve theological tension rather than resolve it
- issue: 히브리어 전승의 괄호 친 후반부를 본문에 포함할지
  chosen_reading: 그리스어 증거를 따라 본문에 포함하고, 각주로 전승상의 불확실성을 밝힙니다.
  alternative_readings:
  - 후반부를 생략하여 첫 절만 번역
  - 후반부를 본문 밖으로 밀어 주석화
  rationale: 제시된 히브리어 본문은 후반부를 괄호로 표시하지만, 그리스어 병행본문이 같은 내용을 지지하므로 누락보다 투명한 포함이 적절합니다.
  doctrine_reference: PHILOSOPHY.md transparency principle
