  text: Do not say[a], “This is bad[b]; what is this?” for everything will prevail in its time.
  footnotes:
  - marker: a
    text: The Hebrew wording is somewhat difficult here; the Greek parallel clarifies the sense as 'This is worse than that.'
    reason: textual_variant
  - marker: b
    text: Or 'everything will prosper in its time' or 'everything will be approved in its time.'
    reason: lexical_alternative
translation:
  language: ko
  text: “이것은 저것보다 더 나쁘다”고 말하지 마십시오.[a] 모든 것은 제때에 좋게 드러날 것입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 여기의 히브리어 표현은 다소 난해합니다. 그리스어 평행본문은 ‘이것이 저것보다 더 나쁘다’라는 비교의 뜻을 분명히 합니다.
    reason: textual_variant
  - marker: b
    text: 또는 ‘제때에 번성할 것입니다’, ‘제때에 인정받을 것입니다’. 히브리어 동사의 정확한 뉘앙스는 불확실하며, 그리스어 평행본문은 긍정적으로 드러나거나 인정받는 뜻을 시사합니다.
    reason: lexical_alternative
