base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/039/034.yaml
  text: Do not say[a], “This is bad[b]; what is this?” for everything will prevail in its time.
  footnotes:
  - marker: a
    text: The Hebrew wording is somewhat difficult here; the Greek parallel clarifies the sense as 'This is worse than that.'
    reason: textual_variant
  - marker: b
    text: Or 'everything will prosper in its time' or 'everything will be approved in its time.'
    reason: lexical_alternative
translation:
  language: ko
  text: 무엇보다 먼저 이렇게 말하지 마십시오. “이것은 저것보다 더 나쁩니다.” 모든 것은 때가 되면 제자리를 찾습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 여기서 다소 난해하므로, 그리스어 평행본문의 비교 의미를 반영했습니다.
    reason: textual_variant
  - marker: b
    text: 직역하면 ‘이것이 저것보다 더 나쁩니다’의 뜻입니다.
    reason: cross_reference
lexical_decisions:
- source_word: אל לאמר
  english_pob_choice: Do not say
  chosen_korean: “이렇게 말하지 마십시오”
  alternatives_korean:
  - “말하지 마십시오”
  - “라고 말하지 마십시오”
  lexicon: HALOT
  rationale: 히브리어의 금지형 אל와 לאמר을 한국어 자연문으로 풀어, 단순한 부정이 아니라 발화 금지를 분명히 드러냈습니다.
- source_word: זה רע מה זה
  english_pob_choice: This is worse than that
  chosen_korean: “이것은 저것보다 더 나쁩니다”
  alternatives_korean:
  - “이것은 나쁩니다; 이것이 무엇입니까?”
  - “이것은 저것보다 더 악합니다”
  lexicon: HALOT
  rationale: 전승된 히브리어의 어색함은 있으나, 그리스어 평행본문의 비교 의미를 따라 비교급으로 옮겼습니다.
- source_word: יגביר
  english_pob_choice: will prevail / will prove good
  chosen_korean: “제자리를 찾습니다”
  alternatives_korean:
  - “번성합니다”
  - “승리합니다”
  - “좋게 드러납니다”
  lexicon: HALOT
  rationale: 히브리어 동사는 문맥상 최종적으로 바르게 드러나고 성취되는 뜻을 담으므로, 시의적합한 한국어 관용으로 그 결과를 표현했습니다.
- source_word: בעתו
  english_pob_choice: in its time
  chosen_korean: “때가 되면”
  alternatives_korean:
  - “제때에”
  - “정해진 때에”
  lexicon: HALOT
  rationale: 시간 부사의 핵심인 ‘때’를 살리되, 한국어에서 자연스러운 조건·시점 표현으로 옮겼습니다.
theological_decisions:
- issue: 어려운 히브리어와 그리스어 평행본문의 관계
  chosen_reading: 문장은 어떤 사물을 성급히 더 나쁘다고 단정하지 말라는 금지로 읽고, 모든 것이 자기 때에 올바른 모습을 드러낸다는 뜻으로 번역했습니다.
  alternative_readings:
  - “이것은 나쁩니다; 이것이 무엇입니까?”로 더 직역
  - “모든 것이 때가 되면 번성합니다”로 더 평이하게 번역
  rationale: 히브리어 본문이 다소 난해하므로, 검증 메모와 그리스어 평행본문이 주는 비교 의미를 함께 반영해 의미를 보존했습니다.
