  source_fidelity: 첫머리의 ‘무엇보다 먼저’는 히브리어와 그리스어 어느 쪽에도 근거가 없으므로 삭제해야 합니다. 비교 구문은 난해한 히브리어를 그리스어 평행본문으로 보완하여 ‘이것은 저것보다 더 나쁘다’로 옮기는 것이 적절합니다. 마지막 절의 ‘제자리를 찾습니다’는 יגביר 및 그리스어 εὐδοκιμηθήσεται의 평가적·긍정적 결과를 충분히 반영하지 못합니다.
  naturalness: ‘…고 말하지 마십시오’와 ‘제때에 좋게 드러날 것입니다’는 현대 표준어 합쇼체로 자연스럽습니다. 인용문 안에는 서술형 ‘나쁘다’를 쓰고, 바깥 문장에서 높임 종결을 사용하는 것이 자연스럽습니다.
