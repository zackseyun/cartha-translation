base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/039/024.yaml
  text: The ways of the blameless are made straight[b][a]; but for strangers they become ruinous.
  footnotes:
  - marker: a
    text: 'Greek: ''for the lawless, stumbling blocks.'' The Greek appears to interpret the Hebrew ''strangers'' as those alien to God''s way.'
    reason: alternative_reading
  - marker: b
    text: The final Hebrew verb is difficult; the sense 'become ruinous' is guided by the Greek parallel, which reads 'stumbling blocks.'
    reason: textual_variant
translation:
  language: ko
  text: 흠 없는 이들의 길은 곧지만, 낯선 이들에게는 걸림돌이 됩니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '그리스어: “법 없는 자들에게는 걸림돌.” 그리스어는 히브리어의 ‘낯선 이들’을 하나님의 길에서 벗어난 자들로 해석합니다.'
    reason: alternative_reading
  - marker: b
    text: 마지막 히브리어 동사는 뜻이 어렵습니다. 본문의 ‘걸림돌’은 ‘걸림돌’이라고 읽는 그리스어 병행문의 도움을 받아 옮긴 것입니다.
    reason: textual_variant
lexical_decisions:
- source_word: ארחות
  english_pob_choice: ways
  chosen_korean: 길
  alternatives_korean:
  - 행로
  - 길들
  - 방식
  lexicon: HALOT
  rationale: 히브리어 복수형 ארחות는 문자적 ‘길들/경로들’이지만, 비유적으로 삶의 행로를 가리키므로 한국어에서는 자연스럽고 이미지가 살아 있는 ‘길’로 옮겼습니다.
- source_word: תמים
  english_pob_choice: the blameless
  chosen_korean: 흠없는 이들
  alternatives_korean:
  - 완전한 이들
  - 온전한 이들
  - 의로운 이들
  lexicon: HALOT
  rationale: תמים은 ‘흠없는, 온전한, 흠잡을 데 없는’의 의미 범위를 가지므로, 도덕적 결함이 없음을 드러내는 ‘흠없는 이들’로 옮겼습니다.
- source_word: יִשָּׁרוּ
  english_pob_choice: are made straight
  chosen_korean: 곧게 되지만
  alternatives_korean:
  - 곧게 됩니다
  - 바로잡힙니다
  - 곧게 만들어집니다
  lexicon: HALOT
  rationale: 동사 ישר의 수동/상태적 뉘앙스를 살려, 길이 ‘곧아진다’는 결과를 자연스러운 한국어로 표현했습니다.
- source_word: לזרים
  english_pob_choice: for strangers
  chosen_korean: 낯선 이들에게는
  alternatives_korean:
  - 외인들에게는
  - 이방인들에게는
  - 외부자들에게는
  lexicon: HALOT
  rationale: זר는 문자적으로 ‘낯선 사람, 외인’이지만, 이 구절에서는 지혜의 길과 멀어진 이들을 가리키는 말로 읽히므로, 너무 경직된 교회용어보다 의미를 넓게 드러내는 ‘낯선 이들’이 적절합니다.
- source_word: יִסְתּוֹלָלוּ
  english_pob_choice: they become ruinous
  chosen_korean: 걸림돌이 됩니다
  alternatives_korean:
  - 파멸이 됩니다
  - 무너지는 것이 됩니다
  - 넘어지게 하는 것이 됩니다
  lexicon: HALOT
  rationale: 희귀하고 어려운 동사이므로, 그리스어 병행구가 제시하는 ‘걸려 넘어짐/걸림’의 방향을 따라, 결과적 의미를 살린 ‘걸림돌이 됩니다’로 옮겼습니다.
theological_decisions:
- issue: 히브리어의 ‘낯선 이들’과 그리스어의 해석적 ‘법 없는 자들’ 사이의 긴장
  chosen_reading: 본문에는 히브리어를 따라 ‘낯선 이들’로 두고, 그리스어의 해석은 주석으로만 남깁니다.
  alternative_readings:
  - 법 없는 자들
  - 하나님의 길 밖에 있는 자들
  rationale: 시라 39:24에서는 히브리어 증거가 현존하고 신뢰할 수 있으므로, 본문은 히브리어 표현을 우선했습니다. 다만 그리스어는 이 대상을 도덕적으로 해석하므로, 그 해석을 본문에 흡수하지 않고 별도로 보존해야 합니다.
  doctrine_reference: 원어 우선 원칙, 번역 전통보다 원문 증거를 우선하되 해석적 긴장은 보존
