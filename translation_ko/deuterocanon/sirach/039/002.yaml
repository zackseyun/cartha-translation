  text: He will preserve the accounts of famous men, and he will enter into the twists of parables.
translation:
  language: ko
  text: 그는 유명한 사람들의 이야기를 보존하고, 비유의 굴곡 속으로 들어갈 것입니다.
  philosophy: formal
lexical_decisions:
- source_word: διηγήσεις
  english_pob_choice: accounts
  chosen_korean: 이야기들
  alternatives_korean:
  - 기록들
  - 설명들
  - 전승들
  lexicon: διήγησις
  rationale: 서술된 내용의 연속성과 전승성을 살리되, 한국어에서 자연스럽고 문맥에 맞는 복수 명사로 옮겼습니다.
- source_word: ἀνδρῶν ὀνομαστῶν
  english_pob_choice: famous men
  chosen_korean: 유명한 사람들
  alternatives_korean:
  - 이름난 사람들
  - 저명한 사람들
  - 명망 있는 사람들
  lexicon: ἀνήρ + ὀνομαστός
  rationale: 직역하면 ‘이름난 남자들’이지만, 여기서는 남성성보다 명성과 인물을 가리키는 점이 핵심이므로 자연스러운 현대 한국어로 옮겼습니다.
- source_word: στροφαῖς παραβολῶν
  english_pob_choice: the twists of parables
  chosen_korean: 비유의 굴곡 속
  alternatives_korean:
  - 비유의 꼬임 속
  - 비유의 우여곡절 속
  - 비유의 회전들 속
  lexicon: στροφή + παραβολή
  rationale: POB의 ‘twists’를 반영하면서, 비유의 복잡한 전개와 돌아감의 이미지를 살리기 위해 ‘굴곡’으로 옮겼습니다.
theological_decisions:
- issue: 인물의 성별 표지
  chosen_reading: ἀνδρῶν을 문자적으로 ‘남자들’로 좁히지 않고 ‘사람들’로 옮겼습니다.
  alternative_readings:
  - 유명한 남자들
  - 저명한 남성들
  rationale: 문맥상 지혜문학적 일반 진술로 읽히며, 여기서 강조점은 성별이 아니라 유명한 인물들의 전승이기 때문입니다.
  doctrine_reference: 문맥 우선 원칙
