translation:
  language: ko
  text: 이 모든 것은 좋은 이들에게는 선으로 되지만, 악한 이들에게는 악으로 바뀝니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 헬라어 병행문은 ‘경건한 이들’(τοῖς εὐσεβέσιν)로 읽습니다. 본문 히브리어는 ‘좋은 이들’(לטובים)입니다.
    reason: cross_reference
lexical_decisions:
- source_word: כל אלה
  english_pob_choice: All these things
  chosen_korean: 이 모든 것은
  alternatives_korean:
  - 이 모든 것들은
  - 이 모든 일은
  lexicon: HALOT
  rationale: 히브리어의 포괄적 지시구를 살려, 문장 전체의 대상이 되는 모든 것을 자연스럽게 나타냈습니다.
- source_word: לטובים
  english_pob_choice: for good to the goodly
  chosen_korean: 좋은 이들에게는
  alternatives_korean:
  - 선한 이들에게는
  - 의로운 이들에게는
  - 좋은 사람들에게는
  lexicon: HALOT
  rationale: 히브리어 טובים의 기본 의미를 따라 ‘좋은 이들’로 옮기되, 헬라어 병행문의 ‘경건한 이들’이 암시하는 도덕적·종교적 뉘앙스도 너무 희석하지 않도록 했습니다.
- source_word: לרעה
  english_pob_choice: to harm
  chosen_korean: 악으로
  alternatives_korean:
  - 해악으로
  - 해를 입히도록
  - 재앙으로
  lexicon: HALOT
  rationale: 히브리어 רעה는 이 문맥에서 추상적 악보다 불리한 결과를 가리키므로, 한국어에서는 결과의 성격을 드러내는 ‘악으로’가 가장 간결하고 대조가 뚜렷합니다.
- source_word: נהפכו
  english_pob_choice: they are turned
  chosen_korean: 바뀝니다
  alternatives_korean:
  - 뒤바뀝니다
  - 돌아섭니다
  - 전환됩니다
  lexicon: HALOT
  rationale: 수동적/피동적 전환의 의미를 살려, 같은 것들이 받는 대상에 따라 성격이 달라지는 뉘앙스를 현대 한국어로 자연스럽게 표현했습니다.
theological_decisions:
- issue: ‘좋은 이들’의 성격을 얼마나 명시할 것인가
  chosen_reading: 본문에는 히브리어의 ‘좋은 이들’을 유지하되, 헬라어 병행문이 시사하는 경건성은 주석적 여운으로 남겨 둡니다.
  alternative_readings:
  - 경건한 이들에게는
  - 의로운 이들에게는
  - 선한 사람들에게는
  rationale: 히브리어 본문이 우선이므로 मुख्य text에서 헬라어의 해석어를 직접 대체하지 않고, 본문이 말하는 도덕적 수혜 대상을 ‘좋은 이들’로 유지했습니다.
  doctrine_reference: Original-language primacy; preserve textual tension rather than resolving Hebrew/Greek nuance in the main text.
