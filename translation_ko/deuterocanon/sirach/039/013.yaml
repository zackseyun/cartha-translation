translation:
  language: ko
  text: 내 말을 들으십시오, 거룩한 아들들이여, 들판의 시냇가에서 자라는 장미처럼 움트십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘들판의 물길 곁에서 자라는 장미처럼’입니다. ἐπὶ ῥεύματος ἀγροῦ는 들판에 있는 시내 또는 물길과 관련된 장소를 가리킵니다.
    reason: source_note
lexical_decisions:
- source_word: εἰσακούσατέ
  english_pob_choice: Listen to me
  chosen_korean: 제게 들으십시오
  alternatives_korean:
  - 제 말을 들으십시오
  - 제게 귀를 기울이십시오
  lexicon: LSJ
  rationale: 직접적인 호소형 명령을 살리면서, 현대 한국어의 자연스러운 공손한 요청으로 옮겼습니다.
- source_word: υἱοὶ
  english_pob_choice: sons
  chosen_korean: 아들들이여
  alternatives_korean:
  - 자녀들이여
  - 아들들아
  lexicon: LSJ
  rationale: 원문이 남성 복수 호격이므로 성별을 지우지 않고 ‘아들들’로 옮겼으며, 호격 어감을 살리기 위해 ‘-이여’를 붙였습니다.
- source_word: ὅσιοι
  english_pob_choice: holy
  chosen_korean: 거룩한
  alternatives_korean:
  - 경건한
  - 독실한
  - 신실한
  lexicon: LSJ
  rationale: ὅσιος의 경건/성별된 의미를 한국어의 종교적 어감으로 간결하게 반영하되, 해석을 과도하게 좁히지 않기 위해 ‘거룩한’을 택했습니다.
- source_word: βλαστήσατε
  english_pob_choice: bud forth
  chosen_korean: 움트십시오
  alternatives_korean:
  - 싹트십시오
  - 피어나십시오
  - 자라나십시오
  lexicon: LSJ
  rationale: 식물 성장의 명령형 이미지를 살리면서도, ‘bud forth’의 새 생명/새순의 느낌을 현대 한국어로 자연스럽게 전달했습니다.
theological_decisions:
- issue: 유이오이 ὅσιοι의 호칭과 성별-정확성
  chosen_reading: ‘거룩한 아들들이여’로 남성 복수 호격을 유지했습니다.
  alternative_readings:
  - ‘거룩한 자녀들이여’
  - ‘경건한 아들들이여’
  rationale: 이 구절은 남성 복수 호칭을 직접적으로 사용하므로, 성별을 일반화하지 않고 원문의 형식을 보존하는 쪽이 본문 의미를 더 정확히 드러냅니다.
  doctrine_reference: 'DOCTRINE.md: Gender-accurate over gender-neutral'
- issue: 식물 은유의 명령형 강도
  chosen_reading: ‘움트십시오’로 번역해 성장의 시작과 권면의 힘을 함께 살렸습니다.
  alternative_readings:
  - ‘피어나십시오’
  - ‘자라나십시오’
  rationale: 원문은 단순 묘사가 아니라 권면형 명령이므로, 부드럽지만 명령성을 유지하는 표현이 적절합니다.
  doctrine_reference: 'POB translation philosophy: optimal-equivalence'
