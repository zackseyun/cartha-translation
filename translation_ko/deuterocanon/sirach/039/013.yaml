  yaml_path: translation/deuterocanon/sirach/039/013.yaml
  text: Listen to me[a], holy sons, and bud forth like a rose growing beside a stream in a field[b],
  footnotes:
  - marker: a
    text: Or 'devout sons.' The adjective can denote those who are pious or faithful in worshipful conduct.
    reason: lexical_alternative
  - marker: b
    text: Or 'blossom like a rose growing by a stream in the field.' The plant-growth imagery is exhortational and may be rendered with slightly different English verbs.
