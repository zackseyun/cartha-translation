  text: The deeds of all flesh are before him[b][a], and nothing is hidden from before his eyes.
  footnotes:
  - marker: a
    text: Or 'every living being' or 'all humanity' for 'all flesh'; the Hebrew idiom is broad, and the Greek parallel likewise reads 'all flesh.'
    reason: lexical_alternative
  - marker: b
    text: 'Greek: ''and it is not possible to be hidden from his eyes,'' making the impossibility slightly more explicit than the Hebrew wording.'
    reason: alternative_reading
translation:
  language: ko
  text: 모든 육체의 행위가 그 앞에 있으며, 그 눈앞에서 숨겨진 것은 아무것도 없습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘모든 육체’는 히브리어 관용구로, 문맥에 따라 ‘모든 사람’ 또는 ‘모든 생명체’를 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어는 ‘그의 눈에서 숨는 것이 가능하지 않다’고 더 분명하게 말합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: מעשה
  english_pob_choice: deeds
  chosen_korean: 행위
  alternatives_korean:
  - 일
  - 행적
  - 작위
  lexicon: HALOT
  rationale: 히브리어 מעשה는 구체적인 ‘함들/행위’의 의미를 가지며, 여기서는 모든 존재의 행위를 총괄하므로 ‘행위’가 자연스럽고 본문의 행위성도 잘 드러냅니다.
- source_word: כל בשר
  english_pob_choice: all flesh
  chosen_korean: 모든 육체
  alternatives_korean:
  - 모든 사람
  - 모든 인류
  - 모든 생명체
  lexicon: HALOT
  rationale: 직역적 관용구를 살려 보편성을 유지하기 위해 ‘모든 육체’로 옮겼습니다. 이는 영어 POB의 ‘all flesh’를 따라 범위를 임의로 좁히지 않으면서도 한국어에서 이해 가능한 표현입니다.
- source_word: נגדו / ἐνώπιον αὐτοῦ
  english_pob_choice: before him
  chosen_korean: 그 앞에
  alternatives_korean:
  - 그 앞에 놓여
  - 그의 면전에서
  - 그 앞에서
  lexicon: HALOT
  rationale: ‘before him’의 위치 관계를 간결하게 살리면서도, 심판자 앞에 모든 것이 드러나 있다는 뉘앙스를 자연스럽게 전달합니다.
- source_word: אין נסתר / οὐκ ἔστιν κρύβηναι
  english_pob_choice: nothing is hidden
  chosen_korean: 숨겨진 것은 아무것도 없습니다
  alternatives_korean:
  - 감추어진 것은 아무것도 없습니다
  - 숨길 수 있는 것은 아무것도 없습니다
  - 숨은 것은 아무것도 없습니다
  lexicon: HALOT
  rationale: 히브리어의 단정적 진술을 직접 반영하되, 그리스어가 덧붙이는 ‘숨길 수 없음’의 불가능성도 한국어에서 자연스럽게 전달되도록 했습니다.
theological_decisions:
- issue: ‘all flesh’의 범위 보존
  chosen_reading: ‘모든 육체’로 옮겨 관용구의 폭을 그대로 유지했습니다.
  alternative_readings:
  - 모든 사람
  - 모든 인류
  rationale: 본문은 하나님의 보편적 통찰을 말하지만, 히브리어와 그리스어가 모두 ‘육체/살’ 표현을 쓰므로 이를 해석적으로 축소하지 않는 것이 본문의 어조와 신학적 폭을 보존합니다.
  doctrine_reference: 'DOCTRINE.md: Preserve theological tension rather than resolve it; consistency of key terms, or documented exception.'
