lexical_decisions:
- source_word: הרימו קולכם
  english_pob_choice: Raise your voices
  chosen_korean: 너희 목소리를 높여
  alternatives_korean:
  - 목소리를 들어
  - 소리를 높여
  lexicon: HALOT
  rationale: 히브리어 명령형 복수와 ‘목소리/소리’를 함께 살려, 단순한 감정 고조가 아니라 실제로 소리를 높이는 초청임을 드러냈습니다.
- source_word: וברכו יחדו
  english_pob_choice: and bless together
  chosen_korean: 함께 찬양하며
  alternatives_korean:
  - 함께 축복하며
  - 함께 복을 빌며
  lexicon: HALOT
  rationale: ברך의 기본 뜻은 ‘축복하다’이지만, 하나님께 드리는 예배 문맥에서는 한국어에서 자연스럽고 기능적으로도 맞는 ‘찬양하다’가 더 직접적입니다.
- source_word: והודו
  english_pob_choice: and give thanks
  chosen_korean: 감사를 드리십시오
  alternatives_korean:
  - 감사하십시오
  - 감사드리십시오
  lexicon: HALOT
  rationale: ידה의 예배적 용법을 반영해 단순한 정보 전달이 아니라 하나님께 드리는 감사 행위를 분명하게 표현했습니다.
- source_word: ליהוה
  english_pob_choice: to Yahweh / to the LORD
  chosen_korean: 야훼께
  alternatives_korean:
  - 여호와께
  - 주님께
  lexicon: project default
  rationale: 이 프로젝트의 기본 원칙에 따라 신명기적 고유명사를 음역해, 일반 호칭인 ‘주님’과 구별했습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행본문의 차이
  chosen_reading: 본문은 현존 히브리어의 간결한 예배 권면을 따르고, 그리스어의 더 긴 시적 문구는 주석으로만 남겼습니다.
  alternative_readings:
  - 그리스어 병행본문의 ‘유향처럼 향기를 퍼뜨리며… 노래를 부르라’를 본문에 반영하기
  rationale: 이 절은 히브리어 증거가 분명하고 완결된 권면을 이루므로 본문은 히브리어를 우선했고, 다른 전승은 투명성을 위해 별도로 기록하는 것이 적절합니다.
  doctrine_reference: Sirach textual tradition; Hebrew primary with Greek parallel attested
