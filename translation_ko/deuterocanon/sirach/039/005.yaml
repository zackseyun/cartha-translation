  to: 그는 자신을 지으신 주님을 향해 일찍 일어나려고[a] 마음을 기울일 것이며, 지극히 높으신 분 앞에서 간구할 것입니다. 그는 기도로 입을 열고 자기 죄들에 관하여 간구할 것입니다.
