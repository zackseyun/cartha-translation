  text: He will devote his heart to rising early to the Lord who made him[a], and he will make supplication before the Most High; he will open his mouth in prayer, and he will make supplication for his sins.
  footnotes:
  - marker: a
    text: Or 'to seek early the Lord'; the Greek verb refers to early rising and can, by context, imply eager early seeking.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 마음을 주어 아침 일찍 일어나 야훼께 나아가고, 지극히 높으신 분 앞에서 간구할 것이며, 기도로 자기 입을 열고 자기 죄들을 위해 간구할 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘아침 일찍 야훼를 찾으려고’; 그리스어 동사는 이른 기상을 가리키며, 문맥상 간절한 이른 추구를 뜻할 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιδώσει τὴν καρδίαν
  english_pob_choice: will devote his heart
  chosen_korean: 마음을 주어
  alternatives_korean:
  - 마음을 바쳐
  - 마음을 두어
  - 마음을 쏟아
  lexicon: LSJ
  rationale: ἐπιδώσει는 단순히 ‘마음’ 자체가 아니라 마음을 어떤 행위에 의도적으로 두는 뜻이어서, 한국어로는 목적 지향을 살리는 ‘마음을 주어’가 가장 자연스럽고 과도한 해석을 피합니다.
- source_word: ὀρθρίσαι πρὸς Κύριον
  english_pob_choice: to rising early to the Lord
  chosen_korean: 아침 일찍 일어나 야훼께 나아가고
  alternatives_korean:
  - 일찍 일어나 주님께 나아가고
  - 새벽에 일어나 주님을 찾고
  - 일찍 일어나 야훼를 찾고
  lexicon: LSJ
  rationale: ὀρθρίσαι는 ‘아침 일찍 일어나다’가 핵심이므로 이를 직접 반영했고, πρὸς는 방향성을 나타내므로 ‘~께 나아가고’로 살렸습니다.
- source_word: ἔναντι Ὑψίστου
  english_pob_choice: before the Most High
  chosen_korean: 지극히 높으신 분 앞에서
  alternatives_korean:
  - 지극히 높으신 분 앞에
  - 가장 높으신 분 앞에서
  - 지극히 높으신 분 앞에서
  lexicon: LSJ
  rationale: ἔναντι는 ‘앞에서/면전에서’의 공간적 관계를 보존하는 것이 중요해 ‘앞에서’로 옮겼고, Ὕψιστος는 관용적으로 ‘지극히 높으신 분’으로 번역했습니다.
- source_word: δεηθήσεται
  english_pob_choice: will make supplication
  chosen_korean: 간구할 것입니다
  alternatives_korean:
  - 간청할 것입니다
  - 청원할 것입니다
  - 기도드릴 것입니다
  lexicon: BDAG
  rationale: 이 동사는 일반적 기도보다 간절한 청원을 가리키므로, 반복되는 두 곳 모두에서 한국어로는 ‘간구하다’가 의미를 가장 잘 드러냅니다.
theological_decisions:
- issue: κύριος를 야훼로 옮길지 여부
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 주
  rationale: 본문은 하나님을 지칭하는 κύριος를 사용하고 있으며, 프로젝트 기본값에 따라 고유 신명인 야훼를 적용하면 창조주를 가리키는 관계가 더 분명해집니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יהוה / YHWH → 야훼'
- issue: 자기 죄들을 위해 간구한다는 표현의 신학적 범위
  chosen_reading: 자기 죄들을 위해 간구할 것입니다
  alternative_readings:
  - 자기 죄들에 대해 간구할 것입니다
  - 자기 죄들 때문에 간구할 것입니다
  rationale: 본문은 용서, 속죄, 고백을 명시적으로 해석하지 않으므로, 그 신학적 함의를 좁히지 않고 죄와 관련한 간구라는 열린 표현을 유지했습니다.
  doctrine_reference: DOCTRINE.md §3 Preserve theological tension rather than resolve it
