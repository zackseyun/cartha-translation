translation:
  language: ko
  text: 불과 우박, 기근과 전염병—이것들도 심판을 위하여 창조되었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '그리스어: “이 모든 것은 보복을 위하여” 또는 “형벌을 위하여” 창조되었습니다. 히브리어는 “심판을 위하여”라고 읽습니다.'
    reason: alternative_reading
lexical_decisions:
- source_word: אש
  english_pob_choice: fire
  chosen_korean: 불
  alternatives_korean:
  - 화염
  - 불꽃
  lexicon: HALOT
  rationale: 히브리어 אש의 기본 의미를 가장 자연스럽게 살려, 재앙 목록의 첫 항목으로서 ‘불’로 옮겼습니다.
- source_word: ברד
  english_pob_choice: hail
  chosen_korean: 우박
  alternatives_korean:
  - 서리우박
  lexicon: HALOT
  rationale: 기상 재해를 가리키는 표준어로 ‘우박’이 가장 직접적이며, 영어 POB의 hail과도 대응합니다.
- source_word: רעב
  english_pob_choice: famine
  chosen_korean: 기근
  alternatives_korean:
  - 굶주림
  lexicon: HALOT
  rationale: 문맥상 개인적 배고픔보다 공동체적 재앙을 가리키므로 ‘기근’이 더 정확합니다.
- source_word: דבר
  english_pob_choice: pestilence
  chosen_korean: 전염병
  alternatives_korean:
  - 역병
  - 질병
  - 죽음
  lexicon: HALOT
  rationale: 히브리어 דבר은 심판 문맥에서 전염성 재앙을 가리키는 경우가 많아, 현대 한국어로는 ‘전염병’이 가장 분명합니다.
- source_word: למשפט
  english_pob_choice: for judgment
  chosen_korean: 심판을 위하여
  alternatives_korean:
  - 판단을 위하여
  - 정의를 위하여
  - 형벌을 위하여
  lexicon: HALOT
  rationale: משפט는 여기서 법정적 판결/심판의 의미가 자연스럽고, 번역문에서는 목적 표현 ‘위하여’로 유연하게 살렸습니다.
- source_word: נוצרו
  english_pob_choice: were created
  chosen_korean: 지음받았습니다
  alternatives_korean:
  - 창조되었습니다
  - 만들어졌습니다
  lexicon: HALOT
  rationale: 피동 완료형을 살리면서도 하나님의 행위성을 드러내기 위해 ‘지음받았습니다’를 택했습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행본문의 마지막 절 의미 차이
  chosen_reading: 본문은 히브리어의 ‘심판을 위하여’를 따르되, 그리스어가 가진 더 강한 ‘보복/형벌’의 뉘앙스는 각주로 보존합니다.
  alternative_readings:
  - 보복을 위하여
  - 형벌을 위하여
  rationale: 현존 히브리어 본문이 ראשונית witness이므로 이를 주본문으로 채택하되, 그리스어가 해석을 강화한 흔적을 지우지 않기 위해 대안 의미를 각주로 남깁니다.
  doctrine_reference: 'Translation philosophy: Original-language primacy over translation tradition; Preserve theological tension rather than resolve it.'
