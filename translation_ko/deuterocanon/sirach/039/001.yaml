  text: But the one who gives himself over to it and meditates on the law of the Most High will seek out the wisdom of all the ancients[b][a], and will occupy himself with prophecies.
  footnotes:
  - marker: a
    text: Or 'the one who devotes himself' for 'the one who gives himself over to it'; the Greek literally speaks of giving over his soul/self.
    reason: lexical_alternative
  - marker: b
    text: Or 'will devote himself to prophetic writings'; the Greek literally says 'will occupy himself with prophecies.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 지혜를 탐구하는 이와 지극히 높으신 이의 율법을 깊이 생각하는 이는 모든 옛사람들의 지혜를 찾아내며, 예언들에 전념하게 됩니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘지혜를 탐구하는 이’는 직역하면 ‘그의 혼/자신을 내어주는 이’에 해당하는 말로, 강한 자기 헌신을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘예언들’은 문자적으로는 예언 자체를 가리키며, 경우에 따라 ‘예언서들’ 또는 ‘예언적 글들’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πλὴν
  english_pob_choice: But
  chosen_korean: 그러나
