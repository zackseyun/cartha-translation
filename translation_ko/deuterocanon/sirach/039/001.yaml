translation:
  language: ko
  text: 그러나 자신을 내맡기고 지극히 높으신 분의 율법을 깊이 묵상하는 이는 모든 옛사람들의 지혜를 찾아 구하며, 예언들에 힘쓰게 됩니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘자신을 내맡기고’는 직역하면 ‘자기 자신의 혼/자신을 내어 맡기고’라는 뜻입니다. 그 대상은 그리스어 본문에서 명시되지 않습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘예언들’은 문자적으로 예언들을 가리킵니다. 문맥에 따라 ‘예언서들’ 또는 ‘예언적 글들’로 이해할 수도 있습니다.
    reason: lexical_alternative
