  source_fidelity: 개정이 필요합니다. 초안의 ‘지혜를 탐구하는 이’는 τοῦ ἐπιδιδόντος τὴν ψυχὴν αὐτοῦ(‘자기 자신/혼을 내어 맡기는 이’)를 ‘지혜를 탐구하다’로 바꾸어 번역한 것으로, 원문에 없는 대상을 명시하고 뒤의 ‘지혜를 찾아 구할 것이다’와도 의미가 중복됩니다. 원문의 목적어 생략은 유지해야 합니다. 또한 ἐκζητήσει는 ‘찾아내다’보다 ‘찾아 구하다/샅샅이 찾다’가 적절합니다.
  naturalness: ‘자신을 내맡기고 … 깊이 묵상하는 이는’은 현대 표준 한국어의 격식 있는 성경 문체로 자연스럽고, 한 사람이 두 행동을 하는 원문의 병렬 participle 구조도 충실히 드러냅니다. ‘예언들에 전념하게 됩니다’도 자연스러우나, ‘힘쓰게 됩니다’가 ἀσχοληθήσεται의 관여·몰두 의미를 간결하게 전달합니다.
  terminology: Ὑψίστου는 신적 칭호로 ‘지극히 높으신 분’, νόμος는 ‘율법’, προφητείαις는 해석을 과도하게 좁히지 않고 ‘예언들’로 유지했습니다. ψυχή는 여기서 기술적 영혼론을 뜻한다고 단정하지 않고 ‘자기 자신’으로 옮겼습니다.
