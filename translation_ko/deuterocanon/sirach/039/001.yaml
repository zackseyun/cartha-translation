  lexicon: LSJ
  rationale: 앞절과의 대조를 자연스럽게 살리면서도, 본문의 반전·전환 기능을 간결하게 전달합니다.
- source_word: τοῦ ἐπιδιδόντος τὴν ψυχὴν αὐτοῦ
  english_pob_choice: the one who gives himself over to it
  chosen_korean: 지혜를 탐구하는 이
  alternatives_korean:
