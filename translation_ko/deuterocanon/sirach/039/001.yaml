  rationale: ψυχή를 직역해 ‘혼’으로 두기보다, 문맥상 한 사람의 전 존재를 바치는 강한 헌신을 한국어로 자연스럽게 살려 냈습니다.
- source_word: ἐν προφητείαις ἀσχοληθήσεται
  english_pob_choice: will occupy himself with prophecies
  chosen_korean: 예언들에 전념하게 됩니다
  alternatives_korean:
  - 예언들로 바쁘게 지내게 됩니다
  - 예언들에 몰두하게 됩니다
  - 예언서들에 전념하게 됩니다
  lexicon: LSJ
  rationale: ἀσχολέομαι의 ‘몰두하다/전념하다’는 뜻을 살리되, 한국어로는 ‘전념하게 됩니다’가 문어적이면서도 자연스럽습니다.
theological_decisions:
- issue: Ὑψίστου의 신적 호칭 번역
  chosen_reading: 지극히 높으신 이
  alternative_readings:
  - 지극히 높으신 분
  - 가장 높으신 분
  rationale: 직역형 호칭을 유지하여 본문의 경건한 어조를 살리면서도, 한국어에서 자연스러운 하나님 지칭으로 처리했습니다.
  doctrine_reference: 하나님 호칭의 문체적 등가성
- issue: νόμῳ의 번역과 지혜문학적 맥락
  chosen_reading: 율법
  alternative_readings:
  - 법
  - 가르침
  - 교훈
  rationale: 여기서 νόμος는 지혜문학 안에서도 하나님의 규범을 가리키므로, 프로젝트 기본어인 ‘율법’을 유지하는 것이 가장 투명합니다.
  doctrine_reference: '어휘 일관성: νόμος → 율법'
