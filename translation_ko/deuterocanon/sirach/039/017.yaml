  text: At his word the waters pile up like a heap[a], and at the utterance of his mouth are storehouses of water.
  footnotes:
  - marker: a
    text: Hebrew reads tersely, 'and at the utterance of his mouth, his storehouse'; the Greek witness has 'storehouses of waters,' which clarifies the sense and is followed here.
    reason: alternative_reading
translation:
  language: ko
  text: 그의 말씀에 물들이 무더기처럼 쌓이고, 그의 입의 말로 물의 창고가 됩니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 ‘그의 입의 말로, 그의 창고’라고 간결하게 되어 있으나, 그리스어 증거는 ‘물의 창고들’이라고 읽어 의미를 분명히 합니다.
    reason: textual_variant
lexical_decisions:
- source_word: בדברו
  english_pob_choice: At his word
  chosen_korean: 그의 말씀에
  alternatives_korean:
  - 그의 말씀으로
  - 그가 말씀하실 때
  lexicon: HALOT
  rationale: בְּ + דָּבָר은 수단과 때를 함께 내포할 수 있으므로, ‘그의 말씀에’는 간결하게 원문의 동사적 행위를 살리면서도 ‘at/by’의 양가적 뉘앙스를 유지합니다.
- source_word: יעריך
  english_pob_choice: pile up
  chosen_korean: 무더기처럼 쌓이고
  alternatives_korean:
  - 쌓이고
  - 무더기로 쌓이고
  - 정돈되고
  lexicon: HALOT
  rationale: ערך의 기본뜻은 ‘배열하다/정돈하다’이지만, 물을 묘사하는 문맥과 그리스어의 ‘heap’ 이미지를 따라 결과를 드러내는 ‘무더기처럼 쌓이다’가 가장 자연스럽습니다.
- source_word: כנד מים
  english_pob_choice: like a heap
  chosen_korean: 무더기처럼
  alternatives_korean:
  - 언덕처럼
  - 더미처럼
  lexicon: HALOT
  rationale: נד는 쌓인 덩어리, 무더기를 가리키므로, 한국어에서도 물의 형태를 구체적으로 보이게 하는 ‘무더기처럼’이 적절합니다.
- source_word: ובמוצא פיו
  english_pob_choice: and at the utterance of his mouth
  chosen_korean: 그의 입의 말로
  alternatives_korean:
  - 그의 입에서 나오는 말로
  - 그의 입의 발화로
  lexicon: HALOT
  rationale: מוצא는 문자적으로 ‘나옴, 발화’이므로 ‘입의 말’로 옮겨 입에서 나오는 선언의 성격을 살렸습니다. ‘utterance’의 시적 간결성도 유지합니다.
- source_word: אוצרו
  english_pob_choice: are storehouses of water
  chosen_korean: 물의 창고가 됩니다
  alternatives_korean:
  - 물의 저장소가 됩니다
  - 그의 창고가 됩니다
  - 물의 곳간이 됩니다
  lexicon: HALOT
  rationale: 히브리어는 본문상 압축되어 있으나, 그리스어는 ‘물의 저장고들’로 풀어 줍니다. 따라서 ‘물의 창고’로 옮겨, 원문의 저장 공간 이미지를 살리되 의미를 분명하게 했습니다.
theological_decisions:
- issue: ‘his’가 가리키는 대상
  chosen_reading: 문맥상 창조주 하나님을 가리키는 것으로 두되, 본문에는 이름을 덧붙이지 않았습니다.
  alternative_readings:
  - 비인칭적 창조 묘사로만 읽는 해석
  - 본문에 ‘하나님’/‘주님’을 명시적으로 보충하는 해석
  rationale: 집회서 39장의 찬양 문맥에서 대명사들은 자연스럽게 하나님을 가리키지만, 본문 자체의 압축성을 보존하기 위해 해설적 보충은 하지 않았습니다.
  doctrine_reference: 창조주 하나님의 말씀의 권능
