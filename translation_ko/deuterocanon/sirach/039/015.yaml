base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/039/015.yaml
  text: With the service of harp and instruments of music[c][b][a], so you shall speak with a shout of praise.
  footnotes:
  - marker: a
    text: Or 'lyre' for 'harp'; the Hebrew names an ancient stringed instrument whose exact modern equivalent is uncertain.
    reason: lexical_alternative
  - marker: b
    text: Or simply 'with a shout' or 'with acclamation'; the Hebrew term can denote a loud cry of rejoicing, and in some contexts a trumpet-like blast.
    reason: lexical_alternative
  - marker: c
    text: The Greek parallel for this verse is considerably fuller, explicitly calling for blessing the Lord and giving greatness to his name; the Hebrew witness here preserves only the musical-and-acclamatory portion.
    reason: textual_variant
translation:
  language: ko
  text: 수금과 여러 악기의 연주에 맞추어, 이렇게 환호하며 말하십시오.[a] [b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘수금’은 고대 현악기를 가리키며, 그 정확한 현대 악기 대응은 불확실합니다. ‘리라’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 תרועה는 ‘외침’, ‘함성’, 또는 환호를 뜻할 수 있으며, 일부 문맥에서는 나팔 같은 울림을 가리키기도 합니다.
    reason: lexical_alternative
  - marker: c
    text: 그리스어 평행문은 이 절을 훨씬 더 길게 전합니다. 그 본문은 주님을 그 모든 일로 송축하고 그 이름에 위대함을 돌리라고 명시하며, 입술의 노래와 수금으로 찬양 가운데 그렇게 말하라고 합니다. 여기의 히브리어 본문은 음악과 환호에 관한 부분만 보존합니다.
    reason: textual_variant
lexical_decisions:
- source_word: בשירות
  english_pob_choice: With the service of
  chosen_korean: 연주로
  alternatives_korean:
  - 예배로
  - 섬김으로
  - 음악으로
  lexicon: HALOT
  rationale: 히브리어 שירות은 여기서 단순한 ‘노래’보다 악기와 결부된 수행/연주의 성격을 띠므로, 한국어로는 문맥에 맞게 간결한 ‘연주로’가 가장 자연스럽습니다.
- source_word: נבל
  english_pob_choice: harp
  chosen_korean: 수금
  alternatives_korean:
  - 하프
  - 리라
  lexicon: HALOT
  rationale: 히브리어 נבל은 고대 현악기를 가리키며, 한국어 성경 전통에서 널리 통용되는 ‘수금’이 가장 적절합니다.
- source_word: כלי מינים
  english_pob_choice: instruments of music
  chosen_korean: 여러 악기
  alternatives_korean:
  - 악기들
  - 다양한 악기
  - 음악 악기
  lexicon: HALOT
  rationale: כלי מינים은 종류가 다른 여러 악기를 뜻하므로, 한국어에서는 의미를 살리면서도 자연스러운 ‘여러 악기’로 옮기는 것이 좋습니다.
- source_word: בתרועה
  english_pob_choice: with a shout of praise
  chosen_korean: 환호의 외침으로
  alternatives_korean:
  - 외침으로
  - 함성으로
  - 나팔 소리로
  lexicon: HALOT
  rationale: תרועה는 기쁨의 함성, 외침, 혹은 나팔 같은 울림까지 포함할 수 있어, 본문 문맥상 찬양의 성격을 드러내는 동시에 범위를 좁히지 않는 ‘환호의 외침’이 적절합니다.
theological_decisions:
- issue: 히브리어 본문의 간결한 표현과 그리스어 평행문의 더 긴 찬양 문구 사이의 차이
  chosen_reading: 히브리어가 보존한 악기 연주와 환호의 외침을 본문 중심으로 따르되, 찬양의 예배적 분위기는 한국어 표현 안에서 자연스럽게 드러내었습니다.
  alternative_readings:
  - 그리스어를 따라 ‘야훼를 송축하고 그 이름을 높이며…’를 덧붙이는 번역
  - 악기 언급만 두고 단순한 외침으로 옮기는 번역
  rationale: 이 절은 히브리어 증거가 더 짧고 그리스어는 상당히 확장되어 있으므로, 본문 주증거인 히브리어를 우선하면서도 전체 문맥이 예배적 찬양임을 반영해야 합니다.
  doctrine_reference: 'Sirach textual history: Hebrew primary witness with Greek parallel as contextual support'
