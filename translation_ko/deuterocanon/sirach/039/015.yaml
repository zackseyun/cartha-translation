  naturalness: 기존의 ‘그리하여 여러분은 … 말할 것입니다’는 한국어에서 다소 직역투이며, ‘환호의 외침’은 의미가 중복됩니다. ‘이렇게 환호하며 말하십시오’는 문맥과 합쇼체에 자연스럽습니다.
