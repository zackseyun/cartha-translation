    rationale: ‘회중이 그의 찬양을 선언할 것입니다’는 원문의 ‘그에 대한 칭송을 공적으로 알리다’라는 뜻을 한국어에서 다소 부자연스럽게 재현합니다. ‘모인 공동체는 그를 칭송할 것입니다’가 자연스럽고 정확합니다.
  revised_text: 민족들이 그의 지혜를 전할 것이며, 회중[a]은 그를 칭송할 것입니다.
