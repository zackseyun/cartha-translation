  - marker: a
    text: Or 'the congregation will declare his praise.' The Greek ἐκκλησία denotes the gathered community or assembly.
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 지혜를 여러 민족이 전할 것이며, 회중은 그의 찬양을 선포할 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘회중이 그의 찬양을 선언할 것입니다.’ ἐκκλησία는 모인 공동체나 회중을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔθνη
  english_pob_choice: Nations
  chosen_korean: 여러 민족
  alternatives_korean:
  - 나라들
  - 민족들
  - 열방
  lexicon: BDAG
  rationale: LXX와 지혜문맥에서 ἔθνη는 이스라엘/이방 대조보다 넓게 ‘민족들’을 가리키므로, ‘여러 민족’이 가장 자연스럽고 시대착오가 적습니다.
- source_word: διηγήσονται
  english_pob_choice: will recount
  chosen_korean: 전할 것입니다
  alternatives_korean:
  - 이야기할 것입니다
  - 자세히 전할 것입니다
  - 기억해 말할 것입니다
  lexicon: BDAG
  rationale: 공적 증언의 뉘앙스를 살리면서도 한국어에서 과도하게 설명적인 ‘자세히 전하다’보다 간결한 서술로 옮겼습니다.
- source_word: ἐκκλησία
  english_pob_choice: assembly
  chosen_korean: 회중
  alternatives_korean:
  - 모임
  - 집회
  - 교회
  lexicon: BDAG
  rationale: 이 유대 지혜문맥에서는 제도교회가 아니라 모인 공동체를 뜻하므로, ‘회중’이 ‘assembly’의 의미를 가장 직접적으로 드러냅니다.
- source_word: ἐξαγγελεῖ
  english_pob_choice: will proclaim
  chosen_korean: 선포할 것입니다
  alternatives_korean:
  - 공표할 것입니다
  - 선언할 것입니다
  - 알릴 것입니다
  lexicon: BDAG
  rationale: 공적이고 높은 어조의 발표를 나타내므로, ‘선포하다’가 ‘proclaim’의 격식을 잘 반영합니다.
- source_word: ἔπαινον
  english_pob_choice: praise
  chosen_korean: 찬양
  alternatives_korean:
  - 찬사
  - 칭송
  - 칭찬
  lexicon: BDAG
  rationale: 하나님께 돌리는 공적 찬미의 맥락이므로, 현대 한국어에서 예배적·공적 뉘앙스가 살아 있는 ‘찬양’이 적절합니다.
theological_decisions:
- issue: ἐκκλησία의 번역을 ‘교회’로 둘지 여부
  chosen_reading: 회중
  alternative_readings:
  - 교회
  - 공동체
  rationale: 본문은 그리스도교 제도교회 이전의 유대 지혜문학이므로, ‘교회’는 시대착오를 낳습니다. ‘회중’은 모인 백성의 의미를 보존하면서도 신학적 오독을 줄입니다.
  doctrine_reference: 'DOCTRINE.md: source meaning over tradition; avoid anachronism'
