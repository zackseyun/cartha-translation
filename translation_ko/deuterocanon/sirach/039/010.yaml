review_pass:
  verdict: revise
  source_fidelity: 그리스어의 미래 시제, ‘민족들’, 지혜, 그리고 ἐκκλησία의 단수 주어는 대체로 충실히 반영되었습니다. 다만 ἔπαινον은 지혜로운 사람에 대한 공적 칭송/찬사를 뜻하며, 이를 ‘찬양’으로 옮기면 한국어에서 하나님께 드리는 예배적 찬양으로 이해될 여지가 있습니다. 또한 ‘여러 민족’의 ‘여러’는 원문에 없는 한정을 더합니다.
  naturalness: ‘민족들이 그의 지혜를 전할 것이며, 회중은 그를 칭송할 것입니다’는 현대 표준어 합쇼체로 자연스럽고, 두 절의 병행도 잘 드러냅니다.
  terminology: ἐκκλησία는 시대착오적인 ‘교회’ 대신 ‘회중’으로 유지할 수 있습니다. ἔπαινος는 이 문맥에서 ‘찬양’보다 ‘칭송’이 더 중립적이고 정확합니다. 각주 대안도 본문의 의미와 일치하도록 고쳤습니다.
