  rationale: ‘찬양’을 ‘칭송’으로 바꾸어 지혜로운 사람에 대한 ἔπαινος의 공적 칭찬이라는 의미를 보존하고, 원문에 없는 ‘여러’를 제거했습니다. 각주는 ἐκκλησία에만 직접 연결하고, 제도적 교회라는 시대착오를 피하면서도 본문의 어휘 대안을 제시합니다.
