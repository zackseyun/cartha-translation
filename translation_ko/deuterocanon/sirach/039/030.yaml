base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/039/030.yaml
  text: The teeth of wild beasts, and scorpions and vipers, and a sword that takes vengeance to destroy the wicked— all these were created for their purpose, and they are kept in store until the time they are appointed.
  footnotes:
  - marker: a
    text: Or 'adders' or 'asps'; the Hebrew names a venomous snake, and the exact species is uncertain. The Greek parallel has a general term for viper/snake.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'to destroy'; the verb can also carry the stronger sense 'to devote to destruction' or 'to exterminate.'
    reason: lexical_alternative
  - marker: c
    text: Or 'they are in the storehouse, and at the appointed time they are summoned.' The final clause is somewhat compressed in Hebrew; the sense is that these forces are reserved until their time of deployment.
    reason: alternative_reading
translation:
  language: ko
  text: 맹수의 이빨과 전갈과 독사, 그리고 악인들을 멸하려는 복수의 칼이 있습니다. 이 모든 것은 그것들의 용도를 위해 창조되었으며, 지정된 때까지 저장되어 있습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘독사’는 히브리어 פתן의 정확한 종을 특정하지 않으며, 전갈/독사류의 위험한 뱀을 넓게 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘저장되어 있습니다’는 히브리어 באוצר ולעת יפקדו의 압축된 표현을 풀어 옮긴 것으로, ‘창고에 보관되어 있으며 정해진 때에 불려 나옵니다’ 정도의 의미가 가능합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: חית שן
  english_pob_choice: The teeth of wild beasts
  chosen_korean: 맹수의 이빨
  alternatives_korean:
  - 들짐승의 이빨
  - 야생 동물의 이빨
  lexicon: HALOT
  rationale: חית은 단순한 동물보다 위험한 야생 짐승을 가리키므로 ‘맹수’로 옮기고, שן은 여기서 집합적으로 쓰여 ‘이빨’이 자연스럽습니다.
- source_word: עקרב
  english_pob_choice: scorpions
  chosen_korean: 전갈
  alternatives_korean:
  - 전갈들
  - 전갈 한 마리
  lexicon: HALOT
  rationale: 문맥상 열거되는 위험한 존재들의 목록이므로 단수형이지만 집합적 의미를 살려 한국어에서는 일반명사 ‘전갈’로 옮겼습니다.
- source_word: פתן
  english_pob_choice: vipers
  chosen_korean: 독사
  alternatives_korean:
  - 살무사
  - 독있는 뱀
  lexicon: HALOT
  rationale: 정확한 종은 불확실하지만, 핵심은 독이 있는 뱀이라는 점이므로 ‘독사’가 가장 간명하고 현대적인 대응입니다.
- source_word: חרב נקמות
  english_pob_choice: a sword that takes vengeance
  chosen_korean: 복수의 칼
  alternatives_korean:
  - 보복하는 칼
  - 원수 갚는 칼
  lexicon: HALOT
  rationale: 히브리어의 목적적/특징적 소유 구조를 한국어 명사구로 압축해, 칼의 성격이 ‘복수에 속한 칼’임을 드러냈습니다.
- source_word: להחרים רשעים
  english_pob_choice: to destroy the wicked
  chosen_korean: 악인들을 멸하려는
  alternatives_korean:
  - 악인들을 멸망시키려는
  - 악인들을 진멸하려는
  lexicon: HALOT
  rationale: להחרים은 ‘멸하다/진멸하다’의 강한 의미를 가질 수 있으나, 본문은 지혜문맥이므로 동작의 방향을 분명히 하면서도 지나치게 기술적인 ‘진멸’은 피했습니다.
- source_word: לצורכם נבראו
  english_pob_choice: were created for their purpose
  chosen_korean: 그것들의 용도를 위해 창조되었으며
  alternatives_korean:
  - 그것들의 목적을 위해 지음받았으며
  - 그것들의 쓰임을 위해 창조되었으며
  lexicon: HALOT
  rationale: לצורכם을 ‘목적’보다 조금 더 직접적인 ‘용도’로 옮겨, 파괴적 존재들도 창조 질서 안에서 특정 기능을 가진다는 점을 살렸습니다.
- source_word: באוצר ולעת יפקדו
  english_pob_choice: kept in store until the time they are appointed
  chosen_korean: 지정된 때까지 저장되어 있습니다
  alternatives_korean:
  - 창고에 보관되어 있으며 정해진 때에 불려 나옵니다
  - 저장되어 있으며 때가 되면 소집됩니다
  lexicon: HALOT
  rationale: באוצר는 ‘창고/보물고’의 이미지를 담지만 한국어에서는 ‘저장’이 가장 압축적이며, ולעת יפקדו의 ‘정해진 때’를 분명히 드러냈습니다.
theological_decisions:
- issue: 파괴적 존재들도 창조와 섭리 안에 포함된다는 진술을 어떻게 처리할 것인가
  chosen_reading: 본문의 ‘창조되었으며’와 ‘지정된 때까지 저장되어 있습니다’를 그대로 살려, 하나님이 파괴적 수단까지도 주권 아래 두신다는 긴장을 약화시키지 않았습니다.
  alternative_readings:
  - 자연 관찰로만 완화해 읽기
  - ‘창조되었다’를 ‘생겨났다’로 완화하기
  rationale: 히브리어는 이 존재들을 단순한 자연현상이 아니라 목적을 가진 창조물로 말하므로, 번역도 그 신학적 긴장을 보존해야 합니다.
  doctrine_reference: 'DOCTRINE.md: Preserve theological tension rather than resolve it.'
