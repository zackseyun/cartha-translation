translation:
  language: ko
  text: 이제 온 마음으로 기뻐 노래하고, 거룩하신 분의 이름을 찬송하십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 병행본문은 ‘주님의 이름’이라고 읽습니다. 히브리어 증인은 ‘거룩하신 분’을 읽습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: עתה
  english_pob_choice: Now
  chosen_korean: 이제
  alternatives_korean:
  - 지금
  - 그리고 이제
  lexicon: HALOT
  rationale: 장면을 마무리하는 시간 표지를 자연스러운 한국어로 옮기되, 불필요한 접속 의미는 덜어냈습니다.
- source_word: בכל לב
  english_pob_choice: with all your heart
  chosen_korean: 온 마음으로
  alternatives_korean:
  - 마음을 다해
  - 온전히 마음을 다하여
  lexicon: HALOT
  rationale: 히브리어 관용구의 전인적·전심적 의미를 한국어 관용으로 압축해 살렸습니다.
- source_word: הרנינו
  english_pob_choice: sing for joy
  chosen_korean: 기뻐 노래하고
  alternatives_korean:
  - 기쁨으로 노래하고
  - 환호하며 노래하고
  lexicon: HALOT
  rationale: שורש רנן의 환성·기쁨의 발화를 살리면서, 단순한 감정 표현보다 ‘노래’가 드러나도록 옮겼습니다.
- source_word: הקדוש
  english_pob_choice: the Holy One
  chosen_korean: 거룩하신 분
  alternatives_korean:
  - 거룩하신 이
  - 거룩한 분
  lexicon: HALOT
  rationale: 히브리어 본문이 לֹא ‘주’가 아니라 ‘거룩하신’이라는 호칭을 주므로, 신적 칭호를 유지하면서 한국어에서 자연스러운 존칭형으로 옮겼습니다.
theological_decisions:
- issue: '마지막 칭호의 본문 차이: 히브리어 הקדוש 대 그리스어 Κυρίου'
  chosen_reading: 거룩하신 분의 이름
  alternative_readings:
  - 주님의 이름
  rationale: 이 책은 살아남은 히브리어 본문을 우선하므로, 주요 본문은 ‘거룩하신 분’으로 따르고 그리스어의 ‘주님’은 주석으로만 반영하는 것이 원문 증거에 가장 충실합니다.
  doctrine_reference: 'PHILOSOPHY.md: Sirach는 보존된 히브리어를 우선하고, 그리스어 병행본문은 대조 증거로 사용'
