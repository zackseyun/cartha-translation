  text: So also his wrath will dispossess nations, and he will turn their drink into brine.
  footnotes:
  - marker: a
    text: 'Greek: ''his wrath will inherit nations.'' The Hebrew likely means ''will dispossess nations,'' which better fits the judgment context.'
    reason: alternative_reading
  - marker: b
    text: Greek reads 'waters' where the Hebrew has a broader term meaning 'drink' or 'what is drunk.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그분의 분노도 마찬가지로 민족들을 빼앗아 가고, 그들의 마실 것을 소금물로 바꾸십니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 יוריש는 이 문맥에서 ‘(민족들을) 빼앗아 가다/박탈하다’의 뜻으로 이해하는 편이 자연스럽습니다. 영어 POB도 이 점을 반영합니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어 משקה는 ‘마실 것/음료’를 뜻할 수 있어, 영어 POB의 ‘drink’에 맞춰 특정한 ‘물’로 좁히지 않았습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כן
  english_pob_choice: So also
  chosen_korean: 마찬가지로
  alternatives_korean:
  - 그렇게
  - 이와 같이
  lexicon: HALOT
  rationale: 앞뒤 문맥의 비교·대응 관계를 자연스럽게 살리되, 과도하게 직역하지 않기 위해 ‘마찬가지로’를 택했습니다.
- source_word: זעמו
  english_pob_choice: his wrath
  chosen_korean: 그분의 분노
  alternatives_korean:
  - 그분의 진노
  - 그분의 노여움
  lexicon: HALOT
  rationale: 심판 맥락의 강도를 유지하면서도 현대 한국어에서 자연스러운 표준어 표현으로 옮겼습니다.
- source_word: גוים
  english_pob_choice: nations
  chosen_korean: 민족들을
  alternatives_korean:
  - 나라들을
  - 열방을
  lexicon: HALOT
  rationale: 심판의 대상인 집단을 가리키는 복수 집합명사로서 ‘민족들’이 가장 직접적이며, ‘열방’보다 중립적입니다.
- source_word: יוריש
  english_pob_choice: will dispossess
  chosen_korean: 빼앗아 가고
  alternatives_korean:
  - 쫓아내고
  - 빼앗아 버리고
  lexicon: HALOT
  rationale: 히필형 ירש의 ‘점유하게 하다/빼앗다’ 긴장을 살리면서, 문맥상 심판에 의해 소유를 상실하게 한다는 뜻을 한국어 동작으로 풀었습니다.
- source_word: משקה
  english_pob_choice: their drink
  chosen_korean: 그들의 마실 것
  alternatives_korean:
  - 그들의 물
  - 그들의 음료
  lexicon: HALOT
  rationale: 히브리어가 특정한 ‘물’보다 더 넓은 ‘마실 것’을 가리킬 수 있으므로, 영어 본문처럼 범위를 과도하게 좁히지 않았습니다.
theological_decisions:
- issue: 히브리어 יוריש의 의미를 ‘소유하게 하다’로 볼지, 심판 맥락의 ‘빼앗다’로 볼지
  chosen_reading: ‘빼앗아 가고’로 옮겨, 민족들이 하나님의 심판 아래서 상속/점유를 상실하는 뜻을 드러냈습니다.
  alternative_readings:
  - ‘물려주고’
  - ‘소유하게 하고’
  rationale: 이 구절은 분노가 민족들을 향한 심판이라는 흐름에 있으므로, 긍정적 상속보다 상실·박탈의 의미가 문맥에 더 잘 맞습니다.
  doctrine_reference: translation philosophy §1, 원어 우선과 문맥적 의미 보존
