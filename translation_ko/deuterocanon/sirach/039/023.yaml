translation:
  language: ko
  text: 이와 같이 그분의 분노는 민족들을 내쫓으며[a], 그분은 그들이 마실 것을[b] 소금물로 바꾸십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 ‘그분의 분노가 민족들을 상속할 것이다’라고 읽습니다. 히브리어 יוריש는 여기서 심판의 문맥에 따라 ‘내쫓다’ 또는 ‘소유를 빼앗다’로 이해될 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 그리스어는 ‘물들’이라고 읽습니다. 히브리어 משקה는 더 넓게 ‘마실 것’ 또는 ‘음료’를 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כן
  english_pob_choice: So also
  chosen_korean: 마찬가지로
  alternatives_korean:
  - 그렇게
  - 이와 같이
  lexicon: HALOT
  rationale: 앞뒤 문맥의 비교·대응 관계를 자연스럽게 살리되, 과도하게 직역하지 않기 위해 ‘마찬가지로’를 택했습니다.
- source_word: זעמו
  english_pob_choice: his wrath
  chosen_korean: 그분의 분노
  alternatives_korean:
