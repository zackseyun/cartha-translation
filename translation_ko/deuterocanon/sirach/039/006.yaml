  yaml_path: translation/deuterocanon/sirach/039/006.yaml
  text: If the great Lord wills[a], he will be filled with a spirit of understanding; he himself will pour forth words of wisdom like rain[b], and in prayer he will give thanks to the Lord.
  footnotes:
  - marker: a
    text: Or 'he will rain down words of wisdom.' The Greek verb uses rain imagery.
    reason: lexical_alternative
  - marker: b
    text: Or 'he will confess/acknowledge the Lord.' The Greek verb can carry those senses, though here the prayer context favors 'give thanks.'
    reason: alternative_reading
translation:
  language: ko
  text: 만일 위대하신 주님께서 뜻하시면, 그는 통찰의 영으로 가득 채워질 것이며, 그가 친히 지혜의 말을 비처럼 쏟아낼 것입니다.[a] 그리고 기도 가운데 주님께 감사드릴 것입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그는 지혜의 말을 비 내리듯 쏟아낼 것입니다.’ 그리스어 동사는 비의 이미지를 담고 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘주님을 고백하거나 인정할 것입니다.’ 이 동사는 그런 뜻도 지닐 수 있으나, 여기서는 기도 문맥상 ‘감사드리다’가 더 자연스럽습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐὰν Κύριος ὁ μέγας θελήσῃ
  english_pob_choice: If the great Lord wills
  chosen_korean: 만일 위대하신 주께서 원하시면
  alternatives_korean:
  - 만일 크신 주께서 뜻하시면
  - 만일 위대한 주께서 원하시면
  lexicon: LSJ
  rationale: 조건절의 volitional 의미를 살려 ‘원하시면’로 옮기고, ὁ μέγας는 단순 크기보다 위엄을 드러내는 수식으로 보아 ‘위대하신’으로 처리했습니다.
- source_word: πνεύματι συνέσεως
  english_pob_choice: a spirit of understanding
  chosen_korean: 이해의 영
  alternatives_korean:
  - 분별의 영
  - 깨달음의 영
  lexicon: LSJ
  rationale: συνέσις는 단순 지식보다 ‘이해/분별’의 뜻을 가지므로, 문맥상 가장 직접적인 ‘이해의 영’이 적절합니다.
- source_word: ἀνομβρήσει ῥήματα σοφίας αὐτός
  english_pob_choice: he himself will pour forth words of wisdom like rain
  chosen_korean: 그 자신이 지혜의 말들을 비처럼 쏟아낼 것이고
  alternatives_korean:
  - 그가 지혜의 말들을 비처럼 내릴 것이고
  - 그 자신이 지혜의 말을 비처럼 흘려보낼 것이고
  lexicon: LSJ
  rationale: 희귀한 동사의 비/소나기 이미지를 살리면서 한국어에서 자연스러운 ‘비처럼 쏟아내다’를 택했습니다. αὐτός의 강조도 ‘그 자신이’로 반영했습니다.
- source_word: ἐξομολογήσεται Κυρίῳ
  english_pob_choice: he will give thanks to the Lord
  chosen_korean: 주님께 감사드릴 것입니다
  alternatives_korean:
  - 주님을 찬양할 것입니다
  - 주님을 고백할 것입니다
  lexicon: LSJ
  rationale: 기도 문맥에서 ἐξομολογέομαι는 죄 고백보다 감사/찬양의 뜻이 자연스러워, POB의 감사 해석을 따라 ‘감사드리다’로 옮겼습니다.
theological_decisions:
- issue: ἐξομολογήσεται의 기도 문맥상 의미
  chosen_reading: 감사와 찬양의 표현
  alternative_readings:
  - 죄를 고백함
  - 주님을 인정함
  rationale: 문맥은 지혜의 말의 분출과 기도이며, 본절에는 회개나 죄 고백의 직접 표지가 없습니다. 따라서 신앙적 해석을 덧붙이지 않고 감사 표현을 유지했습니다.
  doctrine_reference: 'Translation philosophy: original-language primacy; preserve the source sense without importing absent doctrinal themes.'
