  text: Therefore from the beginning I took my stand[a], and I considered, and I set it down in writing.
  footnotes:
  - marker: a
    text: Greek has 'I was established' or 'I was strengthened' where the Hebrew reads 'I took my stand.' The main text follows the Hebrew as the primary witness here while keeping the Greek nuance in view.
    reason: alternative_reading
translation:
  language: ko
  text: 그러므로 처음부터 나는 자리를 잡고, 숙고한 뒤, 그것을 글로 남겼습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 ‘나는 세워졌다’ 또는 ‘나는 강하게 되었다’의 뜻을 가질 수 있지만, 히브리어는 ‘나는 자리를 잡았다’에 가깝습니다. 본문은 여기서 히브리어를 따릅니다.
    reason: alternative_reading
lexical_decisions:
- source_word: על כן
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 따라서
  - 이러므로
  lexicon: HALOT
  rationale: 앞 절의 성찰을 이어 주는 인과·결론 연결어로 자연스럽고, 원문의 논리적 전개를 분명하게 드러냅니다.
- source_word: מראש
  english_pob_choice: from the beginning
  chosen_korean: 처음부터
  alternatives_korean:
  - 처음에
  - 시작부터
  lexicon: HALOT
  rationale: 시간의 시작점을 가리키는 표현으로, 현대 한국어에서 가장 간결하고 분명합니다.
- source_word: התיצבתי
  english_pob_choice: I took my stand
  chosen_korean: 자리를 잡고
  alternatives_korean:
  - 굳게 섰고
  - 제자리를 정하고
  - 서 있게 되었고
  lexicon: HALOT
  rationale: 히트파엘형의 자기-배치/자기-입장을 살리되, 한국어에서 어색하지 않게 ‘스스로 입장을 정하다’는 뉘앙스를 전달합니다. 그리스어의 ‘세워지다/강화되다’ 가능성은 본문 주석에서 반영할 수 있으나, 본문은 히브리어를 따릅니다.
- source_word: והתבוננתי
  english_pob_choice: I considered
  chosen_korean: 숙고한 뒤
  alternatives_korean:
  - 생각했고
  - 깊이 생각했고
  - 주의 깊게 살폈고
  lexicon: HALOT
  rationale: 단순한 생각보다 주의 깊은 사유와 분별의 흐름을 드러내며, 앞뒤 동사들과 나란히 이어지는 지적 행위를 자연스럽게 표현합니다.
- source_word: ובכתב הנחתי
  english_pob_choice: I set it down in writing
  chosen_korean: 그것을 글로 남겼습니다
  alternatives_korean:
  - 글로 기록했습니다
  - 글로 적어 두었습니다
  - 기록으로 남겼습니다
  lexicon: HALOT
  rationale: 문자적 ‘쓰기’보다 내용을 문서로 보존했다는 의미를 살려, 히브리어와 그리스어 모두가 가리키는 ‘기록해 두다’의 뉘앙스를 한국어로 명료하게 옮깁니다.
theological_decisions:
- issue: 그리스어 병행본의 차이(‘세워지다/강화되다’ 대 ‘자리를 잡다’)를 본문에 어떻게 반영할지
  chosen_reading: 본문은 히브리어의 자발적 자기-입장 표현을 따라 ‘자리를 잡고’로 옮기고, 그리스어의 피동적/강화 의미는 주석 수준에서만 보존합니다.
  alternative_readings:
  - 굳게 서고
  - 세워지고
  - 강하게 되었고
  rationale: 이 절의 핵심은 지혜자가 처음부터 스스로 입장을 정하고 숙고하여 기록했다는 자의식에 있으므로, 히브리어를 주본문으로 삼는 번역이 문맥상 더 적절합니다.
  doctrine_reference: 본문비평/번역학 원리
