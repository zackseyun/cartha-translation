  text: The desire of his will succeeds[a], and there is no hindrance to his salvation.
  footnotes:
  - marker: a
    text: Or 'What pleases him prospers'; the Greek parallel reads, 'At his command is every good pleasure, and there is no one who will diminish his salvation.'
