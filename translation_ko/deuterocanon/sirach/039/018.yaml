translation:
  language: ko
  text: 그분이 원하시는 것은 이루어지며, 그분의 구원에는 아무런 방해도 없습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그분이 기뻐하시는 것은 이루어집니다’로 옮길 수 있습니다. 그리스어 평행본문은 ‘그분의 명령에 따라 그분이 기뻐하시는 모든 일이 이루어지며, 그분의 구원을 약화시킬 자가 없다’라고 읽습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תאות רצונו
  english_pob_choice: The desire of his will
  chosen_korean: 그분이 원하시는 것
  alternatives_korean:
  - 그분의 뜻의 소원
  - 그분의 뜻을 바라는 것
  - 그분의 의지의 소원
  lexicon: HALOT
  rationale: 히브리어는 ‘욕망/소원’(תאות)과 ‘그의 뜻/기쁨’(רצונו)을 겹쳐 말하는 관용적 표현이므로, 한국어에서는 뜻이 살아 있는 자연스러운 ‘원하시는 것’으로 옮겨 두 요소를 함께 담았습니다.
- source_word: יצליח
  english_pob_choice: succeeds
  chosen_korean: 다 이루어지며
  alternatives_korean:
  - 성공하며
  - 형통하며
  - 이루어지며
  lexicon: HALOT
  rationale: 힢힐 צלח은 단순한 성공보다 ‘효과적으로 성취되다/이루어지다’의 의미가 강하므로, 현대 한국어에서는 ‘다 이루어지며’가 문맥상 가장 직접적이고 자연스럽습니다.
- source_word: מעצור
  english_pob_choice: hindrance
  chosen_korean: 방해
  alternatives_korean:
  - 걸림
  - 장애
  - 저지
  lexicon: HALOT
  rationale: מַעֲצוֹר는 가로막는 것, 저지하는 것을 뜻하므로 ‘방해’가 가장 직관적입니다. ‘장애’보다 동적이며, 본문의 ‘아무런’과 결합해 절의 부정적 단정을 잘 살립니다.
- source_word: תשועתו
  english_pob_choice: his salvation
  chosen_korean: 그분의 구원
  alternatives_korean:
  - 그분의 구출
  - 그분의 구원하심
  - 그분의 구제
  lexicon: HALOT
  rationale: תשועה는 구원/구출을 뜻하며, 그리스어 σωτήριον도 이를 지지합니다. 한국어 성경어법에서는 ‘구원’이 가장 직접적이면서도 좁은 교리적 의미로만 한정되지 않습니다.
theological_decisions:
- issue: תשועתו를 ‘구원’으로 좁게 둘지, ‘구출’처럼 더 사건적 의미로 풀지
  chosen_reading: 그분의 구원
  alternative_readings:
  - 그분의 구출
  - 그분의 구원하심
  rationale: 지혜문학 맥락에서 이 구절은 하나님의 유효한 행위와 막을 수 없는 구원 능력을 일반적으로 말하므로, 본문이 지닌 넓은 구원 어휘를 그대로 살리는 편이 적절합니다.
  doctrine_reference: 'POB 원칙: 구절의 신학적 긴장을 임의로 축소하지 말고, 원어가 지닌 폭을 현대어로 보존한다.'
