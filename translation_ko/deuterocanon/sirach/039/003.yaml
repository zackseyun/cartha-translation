  lexicon: LSJ
  rationale: παροιμία는 지혜문학에서 잠언·격언류를 가리키므로, 한국어 성경 독자에게 가장 자연스럽고 직접적인 ‘잠언’으로 옮겼습니다.
- source_word: ἐκζητήσει
