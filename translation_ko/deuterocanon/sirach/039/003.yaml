  lexicon: LSJ
  rationale: ἐν은 단순한 동반보다 ‘그 영역 안에서/그 가운데서’의 활동 범위를 나타낼 수 있어, ἀναστραφήσεται의 지속적 관여를 살리는 방향으로 처리했습니다.
- source_word: ἀναστραφήσεται
  english_pob_choice: will occupy himself
  chosen_korean: 활동할 것입니다
  alternatives_korean:
  - 몸담을 것입니다
  - 오가며 지낼 것입니다
  - 몰두할 것입니다
  lexicon: LSJ
  rationale: 이 동사는 여기서 도덕적 행위가 아니라 어떤 분야 안에서의 지속적 왕래·관여를 뜻하므로, 자연스러운 현대 한국어로 ‘활동할 것입니다’라고 옮겼습니다.
theological_decisions:
- issue: 지혜문학의 난해한 표현을 해석어로 풀지 여부
  chosen_reading: 원문의 난해함을 유지하되, 한국어에서는 이해 가능한 어휘로만 최소한의 명료화를 했습니다.
  alternative_readings:
  - ‘잠언의 숨은 의미’처럼 해석을 더 분명히 드러내는 번역
  - ‘잠언의 비밀’처럼 더 강한 신비성을 주는 번역
  rationale: 원문은 ‘숨은 것들’과 ‘수수께끼/비유’의 병렬로 난해성과 탐구성을 드러내므로, 과도한 해석을 덧붙이지 않고도 독자가 그 긴장을 느끼게 하는 것이 적절합니다.
  doctrine_reference: '지혜문학 번역 원칙: 해석의 확정이 아닌 원문 난해성 보존'
