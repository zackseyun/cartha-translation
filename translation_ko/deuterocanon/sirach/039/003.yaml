  lexicon: LSJ
  rationale: Ἀπόκρυφα는 ‘숨겨진 것들’이라는 기본 뜻을 가지며, 문맥상 잠언 속에 감추어진 내용 전체를 가리키므로 ‘숨은 것들’이 원문에 가장 직접적입니다.
