  text: He will seek out the hidden things of proverbs[b][a], and will occupy himself with the riddles of parables.
  footnotes:
  - marker: a
    text: Or 'the hidden things of proverbs.' The Greek ἀπόκρυφα can refer more broadly to what is hidden or obscure, not only to 'meaning.'
    reason: lexical_alternative
  - marker: b
    text: Or 'will spend his time among the riddles of parables.' The Greek verb can suggest moving about in, associating with, or occupying oneself in a sphere.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 잠언의 숨은 것들을 찾아내고, 수수께끼와 비유의 수수께끼들 가운데서 활동할 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘잠언의 숨은 의미’입니다. ἀπόκρυφα는 단지 ‘숨은 것들’뿐 아니라 더 넓게 ‘가려진 것, 난해한 것’을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘비유의 수수께끼들 가운데서 시간을 보내며’입니다. ἐν은 ‘~속에서/~가운데서’라는 영역적 뉘앙스를 지녀, 지속적 관여를 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπόκρυφα
  english_pob_choice: the hidden things / the hidden meaning
  chosen_korean: 숨은 것들
  alternatives_korean:
