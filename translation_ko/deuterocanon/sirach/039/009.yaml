  text: Many will praise his understanding; it will not be blotted out forever. His remembrance will not depart[a], and his name will live for generations of generations.
  footnotes:
  - marker: a
    text: Or 'for generations and generations.' The Greek expression is an idiom for enduring through successive generations.
    reason: lexical_alternative
translation:
  language: ko
  text: 많은 사람이 그의 지혜를 찬양할 것이며, 그것은 영원히 지워지지 않을 것입니다. 그의 기억은 사라지지 않고, 그의 이름은 대대로 살아 있을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘세대와 세대에 걸쳐’. 이 그리스어 표현은 이어지는 여러 세대를 거쳐 지속됨을 나타내는 관용구입니다.
    reason: lexical_alternative
