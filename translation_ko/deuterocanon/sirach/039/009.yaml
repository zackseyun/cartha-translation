  lexicon: BDAG
  rationale: 히브리식 반복 강조 표현을 한국어 관용으로 압축해, 연속되는 세대에 걸친 지속성을 간결하게 전달합니다.
theological_decisions:
- issue: 지혜와 기억의 지속성을 추상화하지 않을지 여부
  chosen_reading: ‘지혜’, ‘기억’, ‘이름’의 구체적 이미지를 유지해, 인물의 명성과 영향이 세대 속에 남는다는 원문 수사를 보존했습니다.
  alternative_readings:
  - ‘유산’으로 추상화
  - ‘명성’ 중심으로 재구성
  rationale: 본문은 기억과 이름이 ‘살아 있다’는 의인화와 반복적 평행법을 사용하므로, 이를 추상어로 평탄화하지 않는 것이 원문의 힘을 살립니다.
  doctrine_reference: Translation philosophy §§1, 6
