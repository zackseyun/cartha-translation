  text: If he remains steadfast[a], he will leave behind a name beyond a thousand; and if he comes to rest[b], he still accomplishes them.
  footnotes:
  - marker: a
    text: Greek literally, 'he will leave behind a name than a thousand.' The sense is likely that his name surpasses that of a thousand others.
    reason: lexical_alternative
  - marker: b
    text: '''Comes to rest'' may also imply death here, while still allowing the broader sense of repose.'
    reason: alternative_reading
translation:
  language: ko
  text: 그가 계속 머문다면, 천 명보다 더 나은 이름을 남길 것이며, 그가 쉬게 되면 그것들을 이루어 냅니다.[a][b]
  philosophy: formal
  footnotes:
  - marker: a
    text: ‘천 명보다 더 나은’은 직역상 비교가 압축된 표현으로, 명성이나 가치가 천 명을 능가한다는 뜻으로 이해할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘쉬게 되면’은 여기서 죽음을 포함할 수 있지만, 더 넓게는 단순한 휴식을 가리킬 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐὰν ἐμμένῃ
  english_pob_choice: If he remains steadfast
  chosen_korean: 그가 계속 머문다면
  alternatives_korean:
  - 그가 굳게 서 있다면
  - 그가 변함없이 머문다면
  lexicon: μένω
  rationale: ἐμμένῃ는 단순한 지속보다 어떤 상태나 자리에서 ‘계속 머묾’의 뜻이 있어, 과도한 의역 없이 자연스럽게 옮겼습니다.
- source_word: ὄνομα καταλείψει
  english_pob_choice: he will leave behind a name
  chosen_korean: 이름을 남길 것이며
  alternatives_korean:
  - 이름을 남겨 두겠고
  - 이름을 남기리라
  lexicon: ὄνομα
  rationale: ὄνομα는 문자적으로 ‘이름’이지만, 여기서는 명성이나 기억을 포함할 수 있어 한국어에서도 기본어 ‘이름’을 살렸습니다.
- source_word: ἢ χίλιοι
  english_pob_choice: beyond a thousand
  chosen_korean: 천 명보다 더 나은
  alternatives_korean:
  - 천 명보다 뛰어난
  - 천 명을 능가하는
  lexicon: χίλιοι
  rationale: 비교 구조가 다소 압축되어 있어, ‘천 명보다 더’라는 비교를 분명히 하되 의미를 과장하지 않도록 조정했습니다.
- source_word: ἐὰν ἀναπαύσηται
  english_pob_choice: if he comes to rest
  chosen_korean: 그가 쉬게 되면
  alternatives_korean:
  - 그가 안식하게 되면
  - 그가 잠들게 되면
  lexicon: ἀναπαύω
  rationale: ἀναπαύσηται는 휴식과 죽음 가능성을 함께 열어 두므로, 본문은 중립적인 ‘쉬다’로 두고 부가적 함의는 각주로 처리했습니다.
theological_decisions:
- issue: ἀναπαύσηται의 의미 범위
  chosen_reading: ‘쉬게 되면’을 기본으로 두어 휴식과 죽음의 가능성을 함께 열어 둡니다.
  alternative_readings:
  - ‘죽게 되면’으로 좁혀 번역
  - ‘안식하게 되면’으로 종교적 뉘앙스를 강화
  rationale: 문맥상 생애의 마침이나 쉼을 모두 가리킬 수 있어, 특정 해석으로 단정하지 않고 원문의 여지를 보존하는 것이 적절합니다.
  doctrine_reference: 해석 보류; 문맥 주석 원칙
