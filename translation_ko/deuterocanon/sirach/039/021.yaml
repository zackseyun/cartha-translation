  text: One should not say[a], “Why this and why that?” For everything will prevail in its time.
  footnotes:
  - marker: a
    text: 'Greek: “for all things were created for their need/use.” The Hebrew reads, “for everything will prevail in its time.”'
    reason: alternative_reading
translation:
  language: ko
  text: 사람은「왜 이것이고 왜 저것인가?」라고 말해서는 안 됩니다. 모든 것은 제때에 그 힘을 드러냅니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 전승은 ‘모든 것은 그 필요를 위해 창조되었습니다’로 읽습니다. 히브리어는 ‘모든 것은 제때에 그 힘을 드러냅니다’입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אין לאמר
  english_pob_choice: One should not say
  chosen_korean: 사람은 …라고 말해서는 안 됩니다
  alternatives_korean:
  - 말해서는 안 됩니다
  - 그렇게 말할 수 없습니다
  lexicon: HALOT
  rationale: 히브리어의 무인칭 금지 표현을 한국어에서는 일반 주어를 둔 금지문으로 자연스럽게 옮기되, 명령조보다 간접적 금지의 뉘앙스를 살렸습니다.
- source_word: זה למה זה
  english_pob_choice: “Why this? And why that?”
  chosen_korean: 「왜 이것이고 왜 저것인가?」
  alternatives_korean:
  - 「왜 이것입니까? 왜 저것입니까?」
  - 「이것은 왜이고 저것은 왜입니까?」
  lexicon: HALOT
  rationale: 반복되는 זה와 למה의 수사적 질책/의문을 살려 두 개의 병렬 질문으로 유지했고, 한국어에서는 자연스럽게 ‘왜 이것이고 왜 저것인가?’로 재현했습니다.
- source_word: הכל
  english_pob_choice: everything
  chosen_korean: 모든 것은
  alternatives_korean:
  - 모든 것들은
  - 만물은
  lexicon: HALOT
  rationale: 범위를 넓게 포괄하는 הכל을 현대 한국어의 자연스러운 총칭 표현으로 옮겼습니다.
- source_word: בעתו
  english_pob_choice: in its time
  chosen_korean: 제때에
  alternatives_korean:
  - 그때에
  - 정해진 때에
  - 그 시기에
  lexicon: HALOT
  rationale: 각 사물마다 맞는 때가 있다는 지혜문학적 감각을 살리면서, ‘in its time’의 의미를 한국어 관용으로 압축했습니다.
- source_word: יגבר
  english_pob_choice: will prevail
  chosen_korean: 그 힘을 드러냅니다
  alternatives_korean:
  - 강해집니다
  - 우세해집니다
  - 이깁니다
  lexicon: HALOT
  rationale: גבר의 ‘강하다, 우세하다’라는 힘의 의미를 보존하되, 이 구절의 문맥상 ‘때가 오면 그 성격과 힘이 나타난다’는 뉘앙스를 담기 위해 ‘그 힘을 드러냅니다’로 옮겼습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행문의 차이
  chosen_reading: 본문은 현존 히브리어를 따라 ‘모든 것은 제때에 그 힘을 드러냅니다’로 옮기고, 그리스어의 ‘필요/용도에 따라 창조되었다’는 의미는 본문이 아니라 대조 전승으로만 남깁니다.
  alternative_readings:
  - 모든 것은 그 필요를 위해 창조되었습니다
  - 모든 것은 그 용도에 맞게 지음 받았습니다
  rationale: 이 단락은 히브리어와 그리스어가 실질적으로 다른 사유를 전합니다. 현존 히브리어가 높게 확실하므로 본문은 히브리어의 ‘때에 따른 힘의 발현’에 두고, 그리스어는 주석적 대안으로만 보존합니다.
  doctrine_reference: 'PHILOSOPHY.md: 현존 히브리어 우선, 그리스어 병행문은 검증용 대조 자료로 사용'
- issue: 수사적 질문의 어조
  chosen_reading: 질책적 질문을 유지해 ‘왜 이것이고 왜 저것인가?’로 살렸습니다.
  alternative_readings:
  - 직설적 금지형으로 ‘왜 이것인가, 왜 저것인가라고 말하지 마십시오’
  - 완화하여 ‘그런 질문을 해서는 안 됩니다’
  rationale: 원문의 반복적 질문은 단순 정보요청이 아니라 사물의 적절한 때를 문제 삼는 태도를 꾸짖는 표현이므로, 질문 형식을 유지하는 편이 원문 효과를 잘 보존합니다.
  doctrine_reference: 문맥상 지혜문학의 수사적 경고 표현
