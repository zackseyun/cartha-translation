  text: All the works of God are good[a], and for every need he provides in its time.
  footnotes:
  - marker: a
    text: 'Greek parallel: ''The works of the Lord are all very good, and every command will be fulfilled in its time.'' The Hebrew witness instead reads ''the works of God'' and speaks of provision for every need; the main text follows the extant Hebrew while keeping the Greek in view.'
    reason: alternative_reading
translation:
  language: ko
  text: 하나님의 모든 일은 선하며, 그분께서는 모든 필요를 제때에 채워 주십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '그리스어 병행본문: ‘주님의 모든 일은 모두 매우 좋으며, 모든 명령은 제때에 이루어질 것입니다.’ 히브리어 본문은 ‘하나님의 모든 일은 선하며, 그분께서는 모든 필요를 제때에 채워 주십니다’라고 읽습니다.'
    reason: alternative_reading
lexical_decisions:
- source_word: מעשי אל
  english_pob_choice: the works of God
  chosen_korean: 하나님의 모든 행사는
  alternatives_korean:
  - 하나님의 모든 일은
  - 하나님의 모든 작품은
  lexicon: HALOT
  rationale: מעשי는 하나님이 행하시는 ‘일/행사’를 가리키는 복수 구성으로, 문맥상 평가적 진술이므로 ‘행사’가 ‘works’의 의미를 가장 자연스럽게 살립니다. אל은 여기서 일반적인 신 칭호이므로 ‘하나님’으로 옮겼습니다.
- source_word: טובים
  english_pob_choice: good
  chosen_korean: 선하고
  alternatives_korean:
  - 좋고
  - 유익하고
  lexicon: HALOT
  rationale: טובים은 단순한 감정적 호감보다 도덕적·본질적 긍정을 담으므로, 한국어에서는 ‘선하다’가 가장 직접적입니다.
- source_word: לכל צורך
  english_pob_choice: for every need
  chosen_korean: 모든 필요에
  alternatives_korean:
  - 모든 필요를 위해
  - 모든 필요마다
  lexicon: HALOT
  rationale: צורך는 ‘필요’ 또는 ‘필요성’을 뜻하므로, 여기서는 공급의 대상으로 자연스럽게 드러나는 ‘모든 필요에’로 옮겼습니다.
- source_word: בעתו יספיק
  english_pob_choice: he provides in its time
  chosen_korean: 제때에 공급하십니다
  alternatives_korean:
  - 때맞추어 충분히 주십니다
  - 그때그때 채워 주십니다
  lexicon: HALOT
  rationale: יספיק은 ‘충분하게 하다/공급하다’의 뉘앙스를 가지며, 한국어에서는 하나님의 공급 행위를 드러내는 ‘공급하다’가 가장 직접적입니다. בעתו의 시기성을 ‘제때에’로 간결하게 살렸습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행본문의 차이
  chosen_reading: 본문은 히브리어에 따라 ‘하나님의 모든 행사는 선하고’와 ‘모든 필요에 제때에 공급하십니다’로 번역하되, 그리스어가 가진 ‘주님의 일들’과 ‘모든 명령’의 읽기는 본문 주석으로만 남깁니다.
  alternative_readings:
  - ‘주님의 모든 일은 매우 선하고, 모든 명령은 제때에 이루어질 것입니다’
  rationale: POB의 원문 우선 원칙에 따라 살아 있는 히브리어 증거를 본문으로 따르고, 그리스어는 대조 전통으로만 반영합니다. 그래서 ‘명령’이 아니라 히브리어의 ‘필요/공급’ 의미를 본문에 유지합니다.
  doctrine_reference: POB 원문 우선 원칙; 시라 39:16의 히브리어-그리스어 이중 전승
