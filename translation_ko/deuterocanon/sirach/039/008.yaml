translation:
  language: ko
  text: 그는 친히 자신의 가르침의 교훈을 밝힙니다.[a] 그리고 주님의 언약의 율법 안에서 자랑할 것입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘자신의 가르침의 훈련(또는 교육)을 밝힙니다.’ παιδεία는 교훈뿐 아니라 형성적 훈련이나 교육을 뜻할 수 있으며, ἐκφαίνει는 ‘밝히다, 분명히 드러내다’라는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘주님의 언약의 율법을 자랑할 것입니다.’
    reason: lexical_alternative
