translation:
  language: ko
  text: 그 자신이 자신의 가르침의 교훈을 드러내며, 주님의 언약의 율법 안에서 자랑할 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 가르침의 교훈을 드러낸다’. παιδεία와 διδασκαλία는 형성적 훈련과 분명하게 드러냄의 의미를 함께 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘주님의 언약의 율법을 자랑할 것입니다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτὸς
  english_pob_choice: He himself
  chosen_korean: 그 자신이
  alternatives_korean:
  - 그가
  - 그가 직접
  lexicon: LSJ
  rationale: 강조된 인칭대명사의 뉘앙스를 살리기 위해 단순한 ‘그가’보다 ‘그 자신이’로 옮겼습니다.
- source_word: ἐκφαίνει
  english_pob_choice: makes plain
  chosen_korean: 드러내며
  alternatives_korean:
  - 분명하게 하며
  - 밝히며
  - 드러냅니다
  lexicon: LSJ
  rationale: ‘드러내다’는 보이게 하여 분명해지게 한다는 뜻을 간결하게 담아, 단순한 공개보다 ‘명백하게 함’의 의미를 살립니다.
- source_word: παιδείαν διδασκαλίας
  english_pob_choice: instruction of his teaching
  chosen_korean: 자신의 가르침의 교훈
  alternatives_korean:
  - 자신의 가르침의 훈련
  - 자신의 가르침의 훈계
  - 자신의 가르침의 교육
  lexicon: LSJ
  rationale: παιδεία는 교훈·훈련·훈육의 폭이 있고 διδασκαλία는 가르침이므로, 서로 겹치면서도 약간 다른 교육적 의미를 한국어의 ‘교훈’과 ‘가르침’으로 대응시켰습니다.
- source_word: νόμῳ διαθήκης Κυρίου
  english_pob_choice: the law of the Lord’s covenant
  chosen_korean: 주님의 언약의 율법 안에서
  alternatives_korean:
  - 주님의 언약 율법 안에서
  - 주님의 언약의 법 안에서
  - 주님의 계약의 율법 안에서
  lexicon: LSJ
  rationale: νόμος는 본문 맥락상 ‘율법’이 가장 자연스럽고, διαθήκη는 ‘언약’으로 옮기는 것이 성경적 용례를 가장 잘 반영합니다. 전치사 ἐν은 장소적/영역적 의미를 살려 ‘안에서’로 처리했습니다.
- source_word: καυχήσεται
  english_pob_choice: he will boast
  chosen_korean: 자랑할 것입니다
  alternatives_korean:
  - 자부할 것입니다
  - 자랑하며 기뻐할 것입니다
  - 영광을 돌릴 것입니다
  lexicon: LSJ
  rationale: 중간태 미래형의 ‘자랑하다/기뻐하다’ 의미를 현대 한국어에서 가장 직접적으로 드러내는 표현을 택했습니다.
theological_decisions:
- issue: ‘주님’이 누구를 가리키는지
  chosen_reading: κύριος를 고유한 성경적 호칭으로 ‘주님’이라 옮겼습니다.
  alternative_readings:
  - 야훼
  - 주
  rationale: 이 절의 그리스어 본문은 직접적으로 κύριος를 사용하므로, 일반적인 신학적 구별을 위해 ‘주님’을 택하되, 인용문이 아니라는 점에서 ‘야훼’로 특정하지 않았습니다.
  doctrine_reference: 'Contested terms table: κύριος → 주님'
