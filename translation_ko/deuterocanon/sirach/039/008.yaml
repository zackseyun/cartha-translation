  rationale: 이 절의 그리스어 본문은 직접적으로 κύριος를 사용하므로, 일반적인 신학적 구별을 위해 ‘주님’을 택하되, 인용문이 아니라는 점에서 ‘야훼’로 특정하지 않았습니다.
  doctrine_reference: 'Contested terms table: κύριος → 주님'
