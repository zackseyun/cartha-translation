    rationale: ‘분명하게 드러냄’은 ἐκφαίνει의 의미이지 παιδεία와 διδασκαλία의 공통 의미가 아닙니다. 각주는 παιδεία의 ‘훈련·교육’ 의미와 ἐκφαίνει의 ‘밝힘’ 의미를 구별해야 합니다.
