  to: 그는 친히 자신의 가르침의 교훈을 밝힙니다.[a] 그리고 주님의 언약의 율법 안에서 자랑할 것입니다.[b]
  rationale: 강조의 αὐτός는 ‘그는 친히’로, ἐκφαίνει의 현재 서술은 ‘밝힙니다’로, καυχήσεται의 미래는 ‘자랑할 것입니다’로 분명히 옮겼습니다. ‘주님의 언약의 율법 안에서’는 그리스어 ἐν과 ‘율법-언약-주님’의 수식 관계를 보존합니다. 각주 a는 원어 단어들의 의미 영역을 정확히 구분하도록 바로잡고, 표지는 관련 어구 뒤로 옮겼습니다.
