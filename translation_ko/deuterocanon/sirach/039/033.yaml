translation:
  language: ko
  text: 하나님의 모든 일은 다 좋으며, 모든 필요를 그때에 채워 주십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 병행본문은 ‘주의 일들은 모두 좋다’고 읽습니다. 히브리어 본문은 여기서 ‘하나님’을 읽습니다.
    reason: textual_variant
lexical_decisions:
- source_word: מעשה
  english_pob_choice: works
  chosen_korean: 일
  alternatives_korean:
  - 일들
  - 행위
  - 사역
  lexicon: HALOT
  rationale: 히브리어 מעשה는 하나님의 행위들을 가리키는 집합적 표현이므로, 한국어에서는 자연스럽게 ‘일’로 옮겨 전체를 포괄하게 했습니다.
- source_word: אל
  english_pob_choice: God
  chosen_korean: 하나님
  alternatives_korean:
  - 주님
  - 하나님께서
  lexicon: HALOT
  rationale: 본문의 히브리어는 אל로, 인격명 야훼가 아니라 일반적인 신적 칭호이므로 ‘하나님’이 가장 직접적입니다.
- source_word: טובים
  english_pob_choice: good
  chosen_korean: 좋으며
  alternatives_korean:
  - 선하며
  - 좋습니다
  - 유익하며
  lexicon: HALOT
  rationale: טובים의 기본 뜻인 ‘좋다’를 평서문으로 살려, 하나님의 일을 총체적으로 긍정하는 문장을 유지했습니다.
- source_word: לכל צורך בעתו יספיק
  english_pob_choice: for every need he provides in its time
  chosen_korean: 모든 필요를 그때에 채워 주십니다
  alternatives_korean:
  - 모든 필요에 그때 맞게 공급하십니다
  - 모든 필요를 제때에 채우십니다
  - 모든 필요에 충분하십니다
  lexicon: HALOT
  rationale: צורך와 יספיק는 ‘필요’와 ‘충분히 채우다/공급하다’의 뜻을 가지므로, 한국어에서는 공급의 결과가 분명하게 드러나는 ‘채워 주십니다’로 옮겼습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행본문의 신적 칭호 차이
  chosen_reading: 본문은 ‘하나님’으로 두고, 그리스어의 ‘주’는 본문이 아니라 병행본문 차이로만 반영합니다.
  alternative_readings:
  - 주님
  - 주
  rationale: 히브리어 증거가 אל을 읽으므로 한국어 본문은 그것을 따르되, 그리스어 병행본문이 Κυρίου를 보존한다는 점은 주석적 차이로 남겨 두는 것이 원문 우선 원칙에 맞습니다.
  doctrine_reference: 원문 우선 원칙; 집합적 지혜문학에서 병행 전승 차이를 본문과 주석으로 구분하는 편집 원칙
