lexical_decisions:
- source_word: בצותו
  english_pob_choice: At his command
  chosen_korean: 그의 명령에 따라
  alternatives_korean:
  - 그가 명령하실 때
  - 그의 명령으로
  lexicon: HALOT
  rationale: ב + צוותו의 시간·상황적 뉘앙스를 한국어에서는 ‘~에 따라’로 자연스럽게 살렸습니다. 원문의 ‘명령’은 하나님의 지시권을 드러내므로, 합쇼체 본문에서 평이하면서도 직접적인 표현을 택했습니다.
- source_word: ישישו
  english_pob_choice: they rejoice
  chosen_korean: 그들은 기뻐하며
  alternatives_korean:
  - 그들은 즐거워하며
  - 그들은 환호하며
  lexicon: HALOT
  rationale: שוש/שיש의 기쁨과 환희를 ‘기뻐하다’로 옮기면 현대 한국어에서 가장 자연스럽고 문맥의 의인화된 순종과도 잘 맞습니다.
- source_word: ובחקם
  english_pob_choice: in their appointed order
  chosen_korean: 자기들에게 정해진 질서 안에서
  alternatives_korean:
  - 자기들에게 정해진 규례 안에서
  - 그들에게 지정된 순서대로
  - 그들의 정해진 법도 안에서
  lexicon: HALOT
  rationale: חק은 단순한 ‘법규’보다 피조물에 부여된 고정된 배치·질서를 가리킬 수 있으므로, 창조물의 기능적 질서를 드러내는 ‘정해진 질서’로 옮겼습니다.
- source_word: לא ימרו פיו
  english_pob_choice: they do not rebel against his word
  chosen_korean: 그의 말씀을 거스르지 않습니다
  alternatives_korean:
  - 그의 입을 거스르지 않습니다
  - 그의 말씀에 반역하지 않습니다
  - 그의 명령을 어기지 않습니다
  lexicon: HALOT
  rationale: מרה는 단순 불복종보다 반역/거스름의 뉘앙스가 있어 ‘거스르다’가 적절합니다. ‘입’의 직역은 가능하지만 한국어에서는 하나님의 발화 내용인 ‘말씀’이 더 정확한 수용 효과를 줍니다.
theological_decisions:
- issue: 히브리어 ‘입’(פיו)이라는 의인화의 처리
  chosen_reading: 그의 말씀
  alternative_readings:
  - 그의 입
  - 그의 말씀(각주로 ‘입’ 보존)
  rationale: 문맥상 하나님이 하신 명령/말씀을 뜻하므로 본문에는 의미를 드러내는 ‘말씀’을 두고, 의인화는 각주로 보완하는 편이 독자 이해에 더 충실합니다.
  doctrine_reference: 번역 철학 §6; 원문의 의인화를 훼손하지 않되 가독성 우선
- issue: 그리스어 병행문의 ‘정해진 때/필요에 맞는 준비’ 뉘앙스 반영
  chosen_reading: 자기들에게 정해진 질서 안에서
  alternative_readings:
  - 정해진 때에
  - 필요에 맞게 준비되어
  rationale: 히브리어 본문은 ‘정해진 질서’를 말하고, 그리스어는 피조물의 시기·용도에 따른 기능을 확장 설명합니다. 두 전승을 함께 고려할 때 ‘정해진 질서 안에서’가 가장 중립적입니다.
  doctrine_reference: 병행본문 조정 원칙; 의미 확장과 본문 충실성의 균형
