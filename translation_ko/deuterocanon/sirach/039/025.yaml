  text: Good is allotted to the good from the beginning; so too[a], for the wicked, good and evil.
  footnotes:
  - marker: a
    text: 'Greek parallel: ''Good things were created for the good from the beginning; likewise for sinners, evil things.'' The Hebrew witness preserved here reads more fully, ''for the wicked, good and evil.'''
    reason: alternative_reading
translation:
  language: ko
  text: 처음부터 선한 이들에게는 선한 것이 몫으로 주어지고, 악인들에게는 선과 악이 그러합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 평행본문은 “처음부터 선한 것들은 선한 이들을 위해 지어졌고, 마찬가지로 죄인들에게는 악한 것들”이라고 더 짧게 말합니다.
    reason: textual_variant
lexical_decisions:
- source_word: טוב
  english_pob_choice: good
  chosen_korean: 선한 것
  alternatives_korean:
  - 좋은 것
  - 유익
  - 복된 것
  lexicon: HALOT
  rationale: טוב은 사물/상황의 ‘좋음’뿐 아니라 도덕적·가치적 ‘선함’도 담으므로, 지혜문맥의 대조를 살려 ‘선한 것’으로 옮겼습니다.
- source_word: חלק
  english_pob_choice: is allotted
  chosen_korean: 몫으로 주어지고
  alternatives_korean:
  - 배당되고
  - 할당되고
  - 몫이 되고
  lexicon: HALOT
  rationale: חלק은 본래 ‘몫, 분깃’의 뜻이어서, 한국어에서는 분배의 결과를 자연스럽게 드러내는 ‘몫으로 주어지고’가 가장 간결합니다.
- source_word: מראש
  english_pob_choice: from the beginning
  chosen_korean: 처음부터
  alternatives_korean:
  - 처음에
  - 시초부터
  - 맨 처음부터
  lexicon: HALOT
  rationale: מראש는 시간적 기원을 나타내므로, 문어체 한국어에서 자연스럽고 압축적인 ‘처음부터’로 옮겼습니다.
- source_word: לרעים
  english_pob_choice: for the wicked
  chosen_korean: 악인들에게는
  alternatives_korean:
  - 악한 이들에게는
  - 사악한 자들에게는
  - 죄인들에게는
  lexicon: HALOT
  rationale: רעים은 도덕적으로 악한 사람들을 가리키므로, 지혜문학의 대조를 살리는 표준적 표현인 ‘악인들’이 적절합니다.
theological_decisions:
- issue: 끝 절의 병렬을 히브리어 본문대로 어떻게 드러낼 것인가
  chosen_reading: 악인들에게는 ‘선과 악’이 함께 주어지는 것으로 보존했습니다.
  alternative_readings:
  - 그리스어 평행본문처럼 ‘악한 것들만’으로 좁힐 수 있습니다.
  - ‘선은 의인에게, 악은 악인에게’로 대칭을 정리할 수 있습니다.
  rationale: 현존 히브리어는 악인에게 ‘선과 악’을 함께 말하므로, 그 긴장을 줄이지 않고 그대로 남겨야 본문 증거에 충실합니다. 그리스어 평행본문은 참고하되 히브리어를 대체하지 않습니다.
  doctrine_reference: 'Sirach source-priority policy: Hebrew primary where extant; Greek parallel used as control, not replacement.'
