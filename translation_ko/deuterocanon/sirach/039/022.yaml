base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/039/022.yaml
  text: Blessings overflowed like the Nile[b][a], and like a river they drenched the world.
  footnotes:
  - marker: a
    text: 'Hebrew: ''Blessings like the Nile overflowed''; the Hebrew form is plural, while the Greek parallel reads singular, ''his blessing.'''
    reason: alternative_reading
  - marker: b
    text: Or 'watered the world' / 'saturated the dry land'; the Greek parallel reads 'and like a flood it drenched the dry land.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 복이 나일강처럼 넘쳐흘렀고, 강처럼 땅을 흠뻑 적셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 복수형 ‘복들’에 가깝지만, 그리스어 병행 본문은 단수 ‘그의 복’을 읽습니다.
    reason: alternative_reading
  - marker: b
    text: ‘세계를 적셨습니다’ 또는 ‘마른 땅을 적셨습니다’로도 옮길 수 있습니다. 그리스어 병행 본문은 ‘마른 땅을 흠뻑 적셨다’는 이미지에 가깝습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ברכות
  english_pob_choice: Blessings / His blessing
  chosen_korean: 그의 복
  alternatives_korean:
  - 복들
  - 그의 복들
  lexicon: HALOT
  rationale: 히브리어는 복수형이지만, 문맥상 한 덩어리의 풍성한 은혜를 가리키므로 한국어에서는 집합적 단수인 ‘복’이 자연스럽습니다. 영어 POB의 ‘His blessing’ 선택도 이 방향을 지지합니다.
- source_word: כיאור
  english_pob_choice: like the Nile
  chosen_korean: 나일강처럼
  alternatives_korean:
  - 나일처럼
  - 나일강 같이
  lexicon: HALOT
  rationale: יאר는 성서 히브리어에서 보통 나일강을 가리키므로, 일반적인 ‘강’보다 ‘나일강’을 살려 이집트의 범람 이미지를 보존했습니다.
- source_word: הציפה
  english_pob_choice: overflowed
  chosen_korean: 넘쳐흘렀고
  alternatives_korean:
  - 범람했고
  - 덮쳤고
  lexicon: HALOT
  rationale: 동사는 물이 넘쳐 퍼지는 뜻이므로, ‘넘쳐흘렀고’가 원문의 범람 이미지를 가장 자연스럽게 담습니다.
- source_word: ריותה
  english_pob_choice: drenched / watered the world
  chosen_korean: 땅을 흠뻑 적셨습니다
  alternatives_korean:
  - 세계를 적셨습니다
  - 마른 땅을 적셨습니다
  lexicon: HALOT
  rationale: 땅이 물에 흠뻑 젖는 의미를 살리되, ‘세계’보다 한국어에서 더 직접적인 대상인 ‘땅’이 문맥상 자연스럽습니다. 영어 POB의 ‘watered the world / saturated the dry land’라는 뉘앙스를 함께 반영했습니다.
theological_decisions:
- issue: ‘복’의 수와 범위
  chosen_reading: 복수 개념을 살리되 한국어 본문에서는 집합적 단수 ‘복’으로 표기했습니다.
  alternative_readings:
  - ‘복들’로 직역
  - ‘그의 복들’로 더 문자적으로 번역
  rationale: 히브리어 복수형을 무시하지 않되, 이 절은 여러 축복의 총합을 한 폭의 홍수 이미지로 제시하므로 한국어에서는 집합적 단수가 의미를 가장 잘 드러냅니다.
  doctrine_reference: Translation philosophy §1, §5
- issue: 지시 대상의 명시
  chosen_reading: ‘그의’라는 대명사를 유지하고 하나님을 본문에 덧붙이지 않았습니다.
  alternative_readings:
  - ‘하나님의 복’
  - ‘주님의 복’
  rationale: 이 절 자체는 대명사만 제시하며 지시 대상을 직접 밝히지 않습니다. 문맥상 하나님을 가리킬 가능성이 크더라도, 본문 밖의 설명을 본문에 끼워 넣지 않기 위해 그대로 두었습니다.
  doctrine_reference: Translation philosophy §1, §3
