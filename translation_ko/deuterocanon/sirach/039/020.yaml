    rationale: 히브리어 ממנו는 문맥상 '그분에게/그분보다'의 관계를 나타내며, 그리스어 병행본의 '그 앞에'와 동일시하기 어렵습니다. 본문은 히브리어를 우선하므로 한국어도 '그분에게는'으로 옮기는 편이 안전합니다.
  - severity: low
