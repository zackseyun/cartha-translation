translation:
  language: ko
  text: 영원부터 영원까지 그분은 바라보십니다[a]. 그분에게는 너무 놀랍거나 너무 강한 것이 없습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 병행본은 ‘시대에서 시대로 그가 바라보았고, 그 앞에 경이로운 것은 아무것도 없다’고 읽습니다. 히브리어에 있는 ‘강한’에 해당하는 표현은 그리스어에는 없습니다.
    reason: textual_variant
lexical_decisions:
- source_word: מעולם ועד עולם
  english_pob_choice: From eternity to eternity
  chosen_korean: 영원에서 영원까지
  alternatives_korean:
  - 세세토록
  - 영원부터 영원까지
  - 태초부터 끝까지
  lexicon: HALOT
  rationale: 히브리어 관용구의 광범위한 시간대를 살리면서, POB의 ‘From eternity to eternity’를 자연스럽게 옮겼습니다.
- source_word: יביט
  english_pob_choice: he looks on
  chosen_korean: 지켜보십니다
  alternatives_korean:
  - 보십니다
  - 주시합니다
  - 바라보십니다
  lexicon: HALOT
  rationale: 단순한 ‘보다’보다 지속적이고 주의 깊은 시선을 나타내어, 지혜문맥에서 하나님의 포괄적 감찰을 드러냅니다.
- source_word: נפלא
  english_pob_choice: too wondrous
  chosen_korean: 너무 놀라운
  alternatives_korean:
  - 너무 경이로운
  - 너무 기이한
  - 너무 놀라운
  lexicon: HALOT
  rationale: 부정문 안에서 ‘하나님께 너무 놀라운 것은 없다’는 의미를 한국어 관용에 맞게 분명히 했습니다.
- source_word: חזק
  english_pob_choice: too strong
  chosen_korean: 너무 강한
  alternatives_korean:
  - 너무 힘센
  - 너무 강력한
  - 너무 능한
  lexicon: HALOT
  rationale: 히브리어 본문에만 분명히 남아 있는 ‘강함/힘’의 추가를 보존하여, 그 어떤 힘도 그분을 능가하지 못함을 드러냅니다.
theological_decisions:
- issue: 히브리어 본문의 추가 술어 ‘חזק’ 유지 여부
  chosen_reading: ‘너무 강한 것이 아무것도 없습니다’로 히브리어의 추가 의미를 본문에 반영했습니다.
  alternative_readings:
  - 그분 앞에는 아무것도 경이롭지 않습니다
  - 그분 앞에는 아무것도 놀랍지 않습니다
  rationale: 그리스어 병행본은 ‘경이로움’만 말하지만, 이 절의 히브리어는 ‘강함’도 덧붙입니다. POB의 히브리어 우선 원칙에 따라 두 증거의 차이를 지우지 않았습니다.
  doctrine_reference: '본문비평: 히브리어 우선, 병행 전승의 차이 보존'
