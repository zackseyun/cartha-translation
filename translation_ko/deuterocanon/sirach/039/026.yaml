translation:
  language: ko
  text: 인간의 삶에 필요한 기본적인 것들은 물과 불과 쇠와 소금이며, 밀가루[b]와 젖과 꿀이며, 포도의 피[a]와 기름과 옷입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘포도의 피’입니다. 이는 포도 음료, 포도주를 포함하여 넓게 가리킬 수 있지만, 번역은 원문의 이미지를 보존합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어의 ‘밀가루’에 해당하는 표현은 전승상 다소 난해하지만, 그리스어 평행본문은 ‘밀가루’ 또는 ‘고운 밀가루’의 뜻을 분명히 뒷받침합니다.
    reason: textual_variant
