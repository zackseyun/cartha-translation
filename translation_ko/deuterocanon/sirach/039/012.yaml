  yaml_path: translation/deuterocanon/sirach/039/012.yaml
  text: Thinking further[a], I will set forth instruction, and I was filled like the full moon.
  footnotes:
  - marker: a
    text: Or 'and like the mid-month moon I was made full.' The Greek term refers literally to the middle of the month and by extension to the full moon.
    reason: lexical_alternative
translation:
  language: ko
  text: 더 생각한 뒤에 저는 선택하겠습니다. 그리고 보름달처럼 가득 찼습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: διχομηνία는 문자적으로 '달의 한가운데'를 뜻하며, 여기서는 관용적으로 '보름달/보름 무렵'을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔτι διανοηθεὶς
  english_pob_choice: Thinking further
  chosen_korean: 더 생각한 뒤에
  alternatives_korean:
  - 더 깊이 생각하며
  - 더 숙고한 뒤에
  - 계속 생각하며
  lexicon: LSJ
  rationale: Ἔτι는 '더/추가로'의 계속성을, διανοηθεὶς는 숙고·반성을 나타내므로 한국어에서는 시간·행위의 자연스러운 연결을 살려 '더 생각한 뒤에'로 옮겼습니다.
- source_word: ἐκλογήσομαι
  english_pob_choice: I will set forth instruction
  chosen_korean: 저는 선택하겠습니다
  alternatives_korean:
  - 저는 택하겠습니다
  - 저는 골라내겠습니다
  - 저는 가르침을 제시하겠습니다
  lexicon: LSJ
  rationale: 형태상 미래 중간태의 선택 행위를 직접 드러내는 동사이므로, 영어 본문보다도 원문의 선택 의미를 우선해 '선택하겠습니다'로 번역했습니다.
- source_word: ὡς διχομηνία
  english_pob_choice: like the full moon
  chosen_korean: 보름달처럼
  alternatives_korean:
  - 한가운데 달처럼
  - 한 달의 한가운데처럼
  - 보름처럼
  lexicon: LSJ
  rationale: διχομηνία는 문자적으로 '달의 한가운데/보름 무렵'을 가리키므로, 한국어 관용에 맞는 '보름달'을 쓰되 비유 표지 '처럼'으로 원문의 비교를 살렸습니다.
- source_word: ἐπληρώθην
  english_pob_choice: I was filled
  chosen_korean: 가득 찼습니다
  alternatives_korean:
  - 채워졌습니다
  - 가득 차게 되었습니다
  - 충만해졌습니다
  lexicon: LSJ
  rationale: 수동태의 충만 상태를 자연스럽게 드러내기 위해 '가득 찼습니다'로 옮겼고, 지나치게 종교화된 '충만해졌습니다'는 피했습니다.
