  text: He will serve among great men[a], and will appear before a ruler; he will travel through the land of foreign nations, for he has tested good and evil among men.
  footnotes:
  - marker: a
    text: Or 'has experienced good and evil among people.' The Greek verb can denote testing by trial or learning through experience, and ἀνθρώποις can be rendered more inclusively as 'people' depending on translation philosophy.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 큰 사람들[a] 가운데서 섬기며, 한 통치자 앞에 나타날 것이며, 이방 민족들의 땅을 두루 다닐 것이니, 사람들 가운데서 선과 악을 시험해 보았기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘사람들 가운데서 선과 악을 경험해 보았다.’ 그리스어 동사는 시련을 통해 검증받는 뜻이나, 경험을 통해 배우는 뜻도 될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνὰ μέσον μεγιστάνων
  english_pob_choice: among great men
  chosen_korean: 큰 사람들 가운데서
  alternatives_korean:
  - 귀족들 가운데서
  - 유력자들 사이에서
  lexicon: LSJ
  rationale: ἐν/ἀνὰ μέσον의 사회적 위치 표현을 자연스럽게 살리면서, μεγιστάνων의 높은 지위와 남성 복수를 과도하게 기술적이지 않게 전달합니다.
- source_word: ὑπηρετήσει
  english_pob_choice: will serve
  chosen_korean: 섬기며
  alternatives_korean:
  - 봉사하며
  - 시중들며
  lexicon: BDAG
  rationale: 단순 노동이 아니라 상급자 곁에서의 봉역을 가리키므로, 종교적 뉘앙스를 덜고도 관계적·궁정적 성격을 담는 ‘섬기다’를 택했습니다.
- source_word: ἔναντι ἡγουμένου ὀφθήσεται
  english_pob_choice: will appear before a ruler
  chosen_korean: 한 통치자 앞에 나타날 것이며
  alternatives_korean:
  - 한 지도자 앞에 보일 것이며
  - 한 치리자 앞에 나타날 것이며
  lexicon: BDAG
  rationale: ὀφθήσεται의 ‘보이다/나타나다’와 ἡγουμένου의 통치·지도 역할을 함께 살려, 공적 면전의 장면으로 읽히게 했습니다.
- source_word: ἐν γῇ ἀλλοτρίων ἐθνῶν διελεύσεται
  english_pob_choice: he will travel through the land of foreign nations
  chosen_korean: 이방 민족들의 땅을 두루 다닐 것이며
  alternatives_korean:
  - 낯선 민족들의 땅을 지나갈 것이며
  - 외국 민족들의 땅을 통과할 것이며
  lexicon: LSJ
  rationale: ἐθνῶν의 복수성과 ἀλλοτρίων의 ‘타자성’을 살리면서, διελεύσεται를 ‘두루 다니다’로 옮겨 여행·순회·통과의 폭을 포괄했습니다.
- source_word: ἀγαθὰ καὶ κακὰ ἐν ἀνθρώποις ἐπείρασεν
  english_pob_choice: for he has tested good and evil among men
  chosen_korean: 사람들 가운데서 선과 악을 시험해 보았기 때문입니다
  alternatives_korean:
  - 사람들 가운데서 좋은 것과 나쁜 것을 경험해 보았기 때문입니다
  - 사람들 가운데서 선과 악을 겪어 보았기 때문입니다
  lexicon: BDAG
  rationale: ἐπείρασεν의 능동적 ‘시험하다/검증하다’ 뉘앙스를 살리고, ἀγαθά κακά를 윤리적 범주로 직역하되 한국어 문장으로는 ‘시험해 보았다’가 가장 자연스럽습니다.
theological_decisions:
- issue: ἀνθρώποις와 μεγιστάνων의 성별 표지
  chosen_reading: 주요 본문에서는 ‘사람들’, ‘큰 사람들’로 옮겨 남성형 복수의 사회적 표지를 과도하게 평탄화하지 않았습니다.
  alternative_readings:
  - 사람들 → 사람들/인간들
  - 큰 사람들 → 유력자들
  rationale: 시적·격언적 문맥에서 원문의 사회 계층과 남성 복수 감각을 보존하는 편이 문장 구조와 소리를 더 잘 전달합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
