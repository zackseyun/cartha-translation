  naturalness: ‘큰 사람들’은 현대 표준어에서 지위 높은 사람이라는 뜻으로 자연스럽지 않고, 신체적 크기로도 쉽게 읽힐 수 있습니다. ‘고관들’은 이 문맥의 공적·궁정적 위상을 간결하게 전달합니다. 본문의 ‘시험해 보았다’는 원문의 능동적 시험·탐구의 여지를 유지하며, 각주에서 경험의 의미를 보완할 수 있습니다.
