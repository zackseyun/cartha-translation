  text: He himself will direct his counsel and knowledge[a], and he will reflect on his hidden things.
  footnotes:
  - marker: a
    text: Or 'his secret things' or 'his hidden matters.' The Greek phrase is concise and may refer either to concealed teachings or to matters hidden within his own reflection.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 자기의 계획과 지식을 곧게 이끄시며, 자기의 숨겨진 것들에 대해 묵상하십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 비밀한 것들’, ‘그의 감추어진 사안들’로도 옮길 수 있습니다. 그리스어 표현은 간결하여 숨겨진 가르침이나 내면의 숙고 대상 둘 다를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτὸς
  english_pob_choice: he himself
  chosen_korean: 그는
  alternatives_korean:
  - 그 자신은
  - 그가 친히
  lexicon: LSJ
  rationale: 그리스어의 강조는 주어를 앞에 두어 살리되, 한국어에서는 ‘친히’보다 담백한 주어 표지가 자연스러워 ‘그는’으로 처리했습니다.
- source_word: κατευθυνεῖ
  english_pob_choice: will direct
  chosen_korean: 곧게 이끄시며
  alternatives_korean:
  - 인도하십니다
  - 바로잡으십니다
  - 이끄십니다
  lexicon: LSJ
  rationale: 직역의 ‘곧게 하다/바르게 하다’와 POB의 ‘direct’ 사이를 반영하여, 방향을 바로 세우는 느낌을 살린 ‘곧게 이끄시며’로 옮겼습니다.
- source_word: βουλήν
  english_pob_choice: counsel
  chosen_korean: 계획
  alternatives_korean:
  - 권고
  - 의도
  - 모의
  lexicon: LSJ
  rationale: 지혜문학 문맥에서 βουλή는 단순한 조언보다 내적 결심이나 구상을 가리킬 수 있어, 한국어로는 자연스러운 ‘계획’을 택했습니다.
- source_word: ἐπιστήμην
  english_pob_choice: knowledge
  chosen_korean: 지식
  alternatives_korean:
  - 지혜
  - 이해
  - 학식
  lexicon: LSJ
  rationale: 앞의 βουλήν과 병렬을 이루는 일반적 인식 능력을 그대로 살리기 위해 ‘지식’으로 옮겼습니다.
- source_word: ἐν τοῖς ἀποκρύφοις αὐτοῦ
  english_pob_choice: his hidden things
  chosen_korean: 자기의 숨겨진 것들에 대해
  alternatives_korean:
  - 자기의 숨은 일들에 대해
  - 자기의 비밀스러운 것들에 대해
  - 자기 안의 감추어진 일들을
  lexicon: LSJ
  rationale: ἀπόκρυφοις는 외부에 숨겨진 사물/사안을 뜻할 수 있으므로, ‘숨겨진 것들’로 직역하되 전치사구를 한국어답게 ‘~에 대해’로 풀었습니다.
- source_word: διανοηθήσεται
  english_pob_choice: will reflect on
  chosen_korean: 묵상하십니다
  alternatives_korean:
  - 생각하십니다
  - 깊이 생각하십니다
  - 되새기십니다
  lexicon: LSJ
  rationale: 중간태 미래의 내적 사유를 나타내므로 단순한 사고보다 더 사색적인 ‘묵상하다’를 택했습니다.
theological_decisions:
- issue: 숨겨진 것들의 성격
  chosen_reading: 본문은 ‘비밀 교리’로 특정하지 않고, 감추어진 것들 자체 또는 그에 대한 내적 숙고를 말하는 열린 표현으로 두었습니다.
  alternative_readings:
  - 숨겨진 가르침들로 이해할 수 있습니다.
  - 그의 마음속 감춰진 사안들로 이해할 수 있습니다.
  rationale: 그리스어가 간결하고 범위가 넓으므로, 본문이 허용하는 모호성을 유지하는 것이 더 충실합니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
