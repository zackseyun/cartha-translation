  rationale: 미래 시제와 αὐτὸς의 강조를 본문에 반영했습니다. ‘계획’과 ‘지식’ 및 ‘숨겨진 것들’은 유지하여 원문의 의미 범위와 모호성을 보존했고, 문맥상 과도하게 종교적이거나 교리적인 해석을 더하지 않도록 ‘깊이 생각하다’를 사용했습니다. 각주 표지는 본문에 한 번 정확히 연결되며, 각주도 원문의 열린 지시 범위를 유지합니다.
