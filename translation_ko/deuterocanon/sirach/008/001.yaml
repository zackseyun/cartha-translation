translation:
  language: ko
  text: 힘센 사람과 다투지 마십시오. 그의 손에 떨어질까 두렵습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 더 문자적으로 ‘왜 그의 손에 놓이게 되겠습니까’에 가깝지만, 그리스어 평행본문이 ‘그의 손에 떨어지지 말라’는 뜻을 분명히 보여 줍니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תָּרִיב
  english_pob_choice: Do not quarrel
  chosen_korean: 다투지 마십시오
  alternatives_korean:
  - 논쟁하지 마십시오
  - 말다툼하지 마십시오
  - 다투어서는 안 됩니다
  lexicon: HALOT
  rationale: ריב의 금지 표현은 단순한 의견 차이보다 갈등에 들어가는 일을 경고하므로, 현대 한국어에서 자연스럽고 경고의 뉘앙스를 살리는 ‘다투다’로 옮겼습니다.
- source_word: עִם אִישׁ גָּדוֹל
  english_pob_choice: with a powerful man
  chosen_korean: 힘센 사람
  alternatives_korean:
  - 권세 있는 사람
  - 큰 사람
  - 중요한 사람
  lexicon: HALOT
  rationale: גָּדוֹל의 직역인 ‘큰’보다, 문맥과 LXX의 δυνάστου가 가리키는 사회적 힘을 드러내는 표현으로 ‘힘센 사람’이 경고의 실질을 가장 분명하게 전달합니다.
- source_word: לָמָּה תִשּׁוֹם עַל יָדוֹ
  english_pob_choice: lest you fall into his hands
  chosen_korean: 그의 손에 떨어질까 두렵습니다
  alternatives_korean:
  - 왜 그의 손에 놓이겠습니까
  - 그의 손에 들어가게 될까 두렵습니다
  - 그의 손에 잡히지 않도록 하십시오
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 다소 어색하지만, 병행하는 그리스어가 ‘그의 손에 떨어지다’는 경고를 분명히 하므로, 한국어에서는 자연스러운 위협 진술인 ‘그의 손에 떨어질까 두렵습니다’로 풀었습니다.
theological_decisions:
- issue: 히브리어의 어색한 종결을 어떻게 처리할지
  chosen_reading: 본문의 경고 의도를 따라 위험 회피의 실용적 지혜로 옮겼습니다.
  alternative_readings:
  - 직역하여 ‘왜 그의 손에 놓이겠습니까’로 옮김
  - 그대로 ‘그의 손에 놓이게 될까’의 수동형을 유지함
  rationale: 이 구절은 교리적 쟁점보다 지혜문학의 실제적 경고가 핵심이며, 히브리어와 그리스어를 함께 볼 때 결과적 의미를 자연스럽게 전달하는 것이 우선입니다.
  doctrine_reference: 지혜문학의 권면 형식
- issue: ‘손’의 이미지 유지
  chosen_reading: ‘손’ 이미지를 유지했습니다.
  alternative_readings:
  - ‘권세’로 의미화하여 이미지 삭제
  - ‘세력 아래’로 의역
  rationale: 히브리어와 그리스어 모두 상대의 손에 들어가는 위험을 강조하므로, 이미지 자체를 보존하는 편이 원문의 힘을 더 잘 살립니다.
  doctrine_reference: 원문 이미지 보존 원칙
