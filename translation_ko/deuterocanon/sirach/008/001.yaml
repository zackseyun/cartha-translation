review_pass:
  verdict: revise
  source_fidelity: ‘다투지 마십시오’는 히브리어 אַל תָּרִיב 및 그리스어 διαμάχου의 금지·경고를 잘 반영합니다. 그러나 ‘힘센 사람’은 주로 신체적 힘을 뜻하여 사회적·정치적 권세를 가리키는 אִישׁ גָּדוֹל 및 δυνάστου의 문맥적 의미를 충분히 전달하지 못합니다. 또한 ‘두렵습니다’는 원문에 없는 화자의 감정 진술로 바꾸므로 결과 경고로 옮기는 것이 더 충실합니다.
  naturalness: 수정문은 현대 표준 한국어 합쇼체로 자연스럽습니다. ‘그의 손에 떨어질 수 있습니다’는 상대의 지배 아래 놓이는 위험을 경고하는 관용적 표현이며, 원문의 ‘손’ 이미지를 보존합니다.
  terminology: ‘권세 있는 사람’이 이 문맥에서 ‘힘센 사람’보다 사회적 영향력과 권력을 더 정확히 나타냅니다. ‘손에 떨어지다’는 그리스어의 ‘그의 손들 안으로 떨어지다’와도 자연스럽게 상응합니다.
  issues:
  - severity: medium
    issue: ‘힘센 사람’은 원문의 사회적·정치적 권세의 의미보다 신체적 강함을 우선적으로 암시합니다.
    rationale: אִישׁ גָּדוֹל은 이 지혜문학 문맥에서 영향력 있는 사람을 뜻하며, 그리스어 δυνάστου도 이를 뒷받침합니다.
  - severity: medium
    issue: ‘그의 손에 떨어질까 두렵습니다’는 원문의 경고를 화자의 심리 상태로 바꿉니다.
    rationale: 히브리어의 난해한 표현과 그리스어의 μή ποτε 이하 모두, 다툼의 결과로 상대의 손아귀에 떨어질 위험을 경고합니다. 한국어에서도 결과 가능성을 직접 진술하는 편이 적절합니다.
  - severity: low
    issue: 기존 각주는 그리스어를 ‘그의 손에 떨어지지 말라’로 서술합니다.
    rationale: 그리스어는 명령 자체라기보다 ‘그의 손에 떨어질까 하여/떨어지지 않도록’이라는 결과·목적 경고를 표현합니다.
