theological_decisions:
- issue: 히브리어 본문과 그리스어 평행문의 상이한 전승
  chosen_reading: 본문은 살아남은 히브리어 문장을 따라 번역하고, 그리스어의 전혀 다른 문장은 각주로 처리했습니다.
  alternative_readings:
  - '그리스어 전승: ‘너보다 강한 사람에게는 빌려주지 말라…’'
  rationale: 집회서는 히브리어 증거가 남아 있을 때 이를 본문으로 삼는 원칙이 적절합니다. 여기서는 그리스어가 단순한 변이 수준이 아니라 다른 속담이므로, 본문에 섞지 않고 별도 전승으로 보존했습니다.
  doctrine_reference: 'Sirach 번역 원칙: surviving Hebrew primary; divergent Greek tradition preserved as variant'
