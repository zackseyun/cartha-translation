  text: Do not despise hearing from those who have returned[b][a], who have heard from their fathers.
  footnotes:
  - marker: a
    text: 'Greek tradition reads: ''Do not lend to a man stronger than you, and if you do lend, regard it as lost.'' This appears to reflect a different textual tradition for this verse.'
    reason: textual_variant
  - marker: b
    text: Or 'those who repent' / 'returnees'; the Hebrew word can denote people who turn back, but its exact nuance here is uncertain.
    reason: lexical_alternative
translation:
  language: ko
  text: 돌아온 이들의 말을 듣는 것을 멸시하지 마십시오. 그들은 자기 아버지들에게서 들었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '그리스어 전승은 이렇게 읽습니다: ‘너보다 강한 사람에게는 빌려주지 말라. 그리고 만일 빌려주거든, 잃은 것으로 여기라.’ 이는 이 절의 다른 본문 전승을 반영하는 것으로 보입니다.'
    reason: textual_variant
  - marker: b
    text: 또는 ‘회개하는 이들’, ‘되돌아오는 이들’로도 옮길 수 있습니다. 히브리어 단어는 돌아오는 사람들을 가리킬 수 있지만, 여기서의 정확한 뉘앙스는 확실하지 않습니다.
    reason: lexical_alternative
