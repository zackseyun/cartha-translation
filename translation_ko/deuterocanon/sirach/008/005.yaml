base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/008/005.yaml
  text: Do not quarrel with a man of tongue[b][a], and do not put wood on the fire.
  footnotes:
  - marker: a
    text: 'Greek witness: ''Do not reproach a man who turns away from sin; remember that we all are subject to rebukes.'' The Hebrew preserved here instead warns against quarreling with a verbally dangerous person and against feeding the conflict.'
    reason: alternative_reading
  - marker: b
    text: '''A man of tongue'' is a Hebrew idiom for a person marked by harmful or contentious speech.'
    reason: lexical_alternative
translation:
  language: ko
  text: 말로 해를 끼치는 사람과 다투지 말고[b], 불에 나무를 더 넣지 마십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '그리스어 전승: ‘죄에서 돌아서는 사람을 책망하지 말라. 우리 모두가 책망받을 처지에 있음을 기억하라.’ 여기 보존된 히브리어는 말로 해를 끼치는 사람과 다투지 말고 분쟁을 키우지 말라고 경고합니다.'
    reason: textual_variant
  - marker: b
    text: 직역하면 ‘혀의 사람’입니다. 해로운 말이나 분쟁을 일으키는 말로 특징지어진 사람을 가리키는 히브리어 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּינָץ
  english_pob_choice: Do not quarrel
  chosen_korean: 다투지 말고
  alternatives_korean:
  - 시비를 벌이지 말고
  - 다툼을 하지 말고
  - 논쟁하지 말고
  lexicon: HALOT
  rationale: 금지형 권고를 자연스러운 합쇼체로 옮기면서, 지혜문학의 실제 상황에 맞는 ‘다투다’로 충돌의 의미를 살렸습니다.
- source_word: אִישׁ לָשׁוֹן
  english_pob_choice: a man of tongue
  chosen_korean: 말이 많은 사람
  alternatives_korean:
  - 혀를 가진 사람
  - 말 많은 사람
  - 말로 해를 끼치는 사람
  lexicon: HALOT
  rationale: 직역인 ‘혀의 사람’보다, POB 주석이 밝힌 관용구의 뜻—해로운 말이나 분쟁적 언사로 특징지어진 사람—을 한국어 관용 표현으로 드러냈습니다.
- source_word: וְאַל תִּתֵּן עַל אֵשׁ עֵץ
  english_pob_choice: and do not put wood on the fire
  chosen_korean: 불 위에 나무를 더 올리지 마십시오
  alternatives_korean:
  - 불에 장작을 더 넣지 마십시오
  - 불에 나무를 보태지 마십시오
  - 불길에 땔감을 더하지 마십시오
  lexicon: HALOT
  rationale: 비유의 핵심은 분쟁을 키우지 말라는 뜻이므로, ‘나무를 더 올리다’로 불을 키우는 이미지를 자연스럽게 살렸습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행본문의 차이
  chosen_reading: 본문은 현존 히브리어를 따라 ‘분쟁을 일으키는 말’과 ‘분쟁을 키우는 행위’를 경계하는 잠언으로 옮겼습니다.
  alternative_readings:
  - '그리스어: ‘죄에서 돌아서는 사람을 책망하지 말라; 우리는 모두 책망받을 처지에 있음을 기억하라.’'
  rationale: 시락서는 히브리어가 보존된 곳에서는 히브리어를 우선하고, 그리스어는 별도의 전승으로 주석적 참고만 제공하는 원칙에 따릅니다. 이 절은 두 전승의 내용이 실질적으로 다르므로, 그리스어는 각주로 남기는 것이 적절합니다.
  doctrine_reference: 'PHILOSOPHY.md: translate Sirach from Hebrew where it survives; preserve Greek parallel as alternative witness'
