translation:
  language: ko
  text: 금이 많은 사람을 망하게 하였고, 귀족들의 마음을 그릇된 길로 이끕니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '그리스어에는 이와 상당히 다른 독법이 있습니다: “배움이 없는 사람을 조롱하지 마십시오. 그러지 않으면 당신의 조상들이 수치를 당할 것입니다.”'
    reason: textual_variant
  - marker: b
    text: 히브리어 נְדִיבִים는 ‘귀족들’ 외에도 ‘관대한 사람들’로 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַבִּים
  english_pob_choice: many
  chosen_korean: 많은 사람
  alternatives_korean:
  - 많은 이들
  - 수많은 사람들
  lexicon: HALOT
  rationale: 히브리어 רַבִּים는 단순히 수량이 많은 대상을 가리키므로, 한국어에서도 간결하게 ‘많은 사람’으로 옮기는 것이 자연스럽습니다.
- source_word: הִפְחִיז
  english_pob_choice: has ruined
  chosen_korean: 망가뜨렸습니다
  alternatives_korean:
  - 파멸시켰습니다
  - 타락시켰습니다
  - 어지럽혔습니다
  lexicon: HALOT
  rationale: 동사가 난해하지만, 문맥상 금이 사람들을 해롭게 만들고 삶을 무너뜨리는 결과를 가리키므로 ‘망가뜨리다’가 결과 중심의 의미를 비교적 잘 드러냅니다.
- source_word: יַשְׂגֶּה
  english_pob_choice: leads astray
  chosen_korean: 그릇된 길로 이끕니다
  alternatives_korean:
  - 잘못 가게 합니다
  - 미혹합니다
  - 빗나가게 합니다
  lexicon: HALOT
  rationale: 히브리어는 ‘길을 벗어나게 하다/그릇되게 하다’의 의미를 가지므로, 지혜문학 문맥에 맞게 도덕적·실천적 방향 상실을 드러내는 표현을 택했습니다.
- source_word: נְדִיבִים
  english_pob_choice: nobles
  chosen_korean: 귀인들
  alternatives_korean:
  - 고귀한 사람들
  - 관대한 사람들
  - 왕족들
  lexicon: HALOT
  rationale: 명사 נְדִיבִים는 ‘귀인들, 제후들’뿐 아니라 ‘관대한 사람들’의 뜻도 가질 수 있으나, 문맥상 사회적 지위가 있는 사람들을 가리키는 해석이 더 자연스럽습니다. 다만 의미 범위는 주석으로 보존합니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행본문의 처리
  chosen_reading: 살아 있는 히브리어 본문을 본문으로 삼고, 그리스어의 현저히 다른 독법은 주석으로만 보존했습니다.
  alternative_readings:
  - '그리스어: “무식한 사람을 조롱하지 말라. 그렇지 않으면 조상들이 욕을 당할 것이다.”'
  rationale: 지혜서라 할지라도 이 절은 히브리어가 분명히 전승되므로, 본문 번역은 히브리어를 따르되 그리스어의 상이한 전승은 투명하게 드러내는 것이 적절합니다.
  doctrine_reference: 'PHILOSOPHY.md: 히브리어가 보존된 시락서는 히브리어 본문을 우선하고, 그리스어 평행본문은 대조 자료로 보존'
