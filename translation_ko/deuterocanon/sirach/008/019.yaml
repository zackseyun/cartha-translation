lexical_decisions:
- source_word: אִם אַכְזָרִי
  english_pob_choice: a cruel man
  chosen_korean: 잔인한 사람
  alternatives_korean:
  - 잔인한 남자
  - 무자비한 사람
  lexicon: HALOT
  rationale: אַכְזָרִי는 잔인하고 무자비한 사람을 가리키므로, 성별을 불필요하게 강조하지 않는 표준 한국어 표현으로 옮겼습니다.
- source_word: אַל תֵּלֵךְ
  english_pob_choice: Do not go with
  chosen_korean: 함께 가지 마십시오
  alternatives_korean:
  - 동행하지 마십시오
  - 따라가지 마십시오
  lexicon: HALOT
  rationale: הלך의 기본 뜻인 ‘가다/걷다’를 유지하면서, 지혜문맥의 ‘함께 다니다’라는 관계적 의미를 자연스럽게 살렸습니다.
- source_word: תַּכְבִּיד
  english_pob_choice: you add weight to
  chosen_korean: 더 무거워집니다
  alternatives_korean:
  - 무겁게 만듭니다
  - 짐을 더합니다
  lexicon: HALOT
  rationale: כבד의 ‘무겁게 하다’라는 비유를 살려, 영어 POB가 지킨 무게 이미지가 한국어에서도 유지되도록 했습니다.
- source_word: רָעָתֶךָ
  english_pob_choice: your own trouble
  chosen_korean: 당신의 재앙
  alternatives_korean:
  - 당신의 악
  - 당신의 해
  - 당신의 불행
  lexicon: HALOT
  rationale: 문맥상 도덕적 ‘악’보다 그 결과로 닥치는 해악/재난의 뜻이 더 분명하므로, 경고의 효과를 살리는 ‘재앙’을 택했습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행본문의 큰 차이
  chosen_reading: 히브리어를 본문으로 따르고, 그리스어의 전혀 다른 전승은 각주로 남겼습니다.
  alternative_readings:
  - '그리스어: “모든 사람에게 네 마음을 드러내지 말며, 그가 네게 호의를 갚게 하지 마라.”'
  rationale: 이 절은 단순한 표현 차이가 아니라 내용 자체가 크게 다르므로, 살아 있는 히브리어 증인을 본문으로 두되 다른 전승도 투명하게 보존해야 합니다.
  doctrine_reference: 'POB 번역 원칙: 히브리어가 남아 있으면 그것을 우선하고, 중대한 본문 차이는 숨기지 않는다'
