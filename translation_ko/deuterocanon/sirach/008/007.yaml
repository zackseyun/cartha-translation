    rationale: מִפֶּשֶׁע는 שָׁב에 연결되어 ‘범법으로부터 돌아서다’를 나타냅니다. ‘죄를 짓고’는 단지 죄를 지은 뒤 돌아왔다는 시간적 순서로 읽힐 수 있습니다.
  - severity: medium
