translation:
  language: ko
  text: 범법에서 돌아선 사람을 부끄럽게 하지 마십시오[a]. 기억하십시오. 우리 모두가 유죄입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 병행문은 “죽은 자를 보고 기뻐하지 마십시오. 기억하십시오. 우리 모두는 죽음을 맞습니다”라고 읽습니다. 이 절에서 히브리어 증거는 앞뒤 절반 모두 그리스어와 다르므로, 본문은 보존된 히브리어를 따르고 그리스어 독법은 대체 독법으로 제시합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תַּכְלִים
  english_pob_choice: Do not shame
  chosen_korean: 부끄럽게 하지 마십시오
  alternatives_korean:
  - 수치스럽게 하지 마십시오
  - 창피를 주지 마십시오
  - 모욕하지 마십시오
  lexicon: HALOT
  rationale: Hifil כלם의 핵심은 상대를 수치스럽게 하거나 부끄럽게 만드는 것입니다. 한국어에서는 ‘부끄럽게 하다’가 가장 자연스럽고 관계적 압박을 잘 살립니다.
- source_word: אִישׁ שָׁב
  english_pob_choice: a man who turns back
  chosen_korean: 죄를 짓고 돌아온 사람
  alternatives_korean:
  - 죄에서 돌아선 사람
  - 돌아온 사람
  - 회개한 사람
  lexicon: HALOT
  rationale: ‘שָׁב’는 단순히 돌아오는 동작을 가리키므로, 본문 맥락상 ‘죄를 짓고 돌아온 사람’으로 풀어 원문의 방향성을 살리되, 후대의 기술적 용어인 ‘회개한 사람’으로 좁히지 않았습니다.
- source_word: מִפֶּשֶׁע
  english_pob_choice: from transgression
  chosen_korean: 죄를 짓고
  alternatives_korean:
  - 범죄에서
  - 반역에서
  - 허물에서
  lexicon: HALOT
  rationale: פשע는 ‘범죄/반역/허물’의 결을 가지므로, 문맥에 맞게 동사구로 풀어 ‘죄를 짓고’라고 옮겨 전환의 의미를 자연스럽게 드러냈습니다.
- source_word: חַיָּבִים
  english_pob_choice: we all are guilty / are liable
  chosen_korean: 죄책 아래 있기 때문입니다
  alternatives_korean:
  - 우리 모두가 죄책이 있기 때문입니다
  - 우리 모두가 유죄이기 때문입니다
  - 우리 모두가 빚진 자이기 때문입니다
  lexicon: HALOT
  rationale: חַיָּבִים는 ‘유죄인/빚진/의무가 있는’의 폭이 있어, 한국어에서는 법정적·도덕적 압박을 함께 담는 ‘죄책 아래 있다’가 가장 오해를 적게 합니다. 이는 영어 POB의 ‘guilty/liable’ 긴장을 유지합니다.
theological_decisions:
- issue: 히브리 본문과 그리스어 병행문의 차이
  chosen_reading: 본문은 히브리어의 ‘죄책 아래 있음’에 따라 번역하고, 그리스어의 ‘우리가 모두 죽는다/우리 모두가 끝에 이른다’는 뜻은 본문 주석에서만 반영합니다.
  alternative_readings:
  - 우리가 모두 죽기 때문입니다
  - 우리 모두가 끝에 이르기 때문입니다
  rationale: 이 절은 살아 있는 히브리어 증거와 그리스어 병행문이 서로 다르므로, 본문은 히브리어를 따르되 그리스어의 해석적 중요성은 각주로 보존하는 것이 가장 투명합니다.
  doctrine_reference: '시락서 번역 원칙: 보존된 히브리어를 우선하고, 그리스어 병행은 대체독법으로 보존'
