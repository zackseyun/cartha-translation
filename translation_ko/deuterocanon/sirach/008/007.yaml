  verdict: revise
  source_fidelity: 첫 절의 ‘죄를 짓고 돌아온’은 מִפֶּשֶׁע(‘범법에서/범법으로부터’)와 שָׁב(‘돌아선’)의 방향을 충분히 드러내지 못합니다. 또한 ‘우리가 모두 죄책 아래 있기 때문입니다’는 זְכֹר(‘기억하십시오’)를 인과절로 바꾸고, חַיָּבִים의 서술을 다소 추상적으로 확장합니다.
  naturalness: ‘범법에서 돌아선 사람’과 ‘기억하십시오. 우리 모두가 유죄입니다’는 현대 표준 한국어의 합쇼체로 자연스럽고 간결합니다. 각주의 ‘대체로 보존합니다’는 무엇을 어떻게 보존하는지 불명확하여 직접적으로 고쳤습니다.
  terminology: פֶּשַׁע는 일반적인 ‘죄’보다 법적·도덕적 위반의 결이 있는 ‘범법’으로 옮겼습니다. חַיָּבִים는 문맥상 ‘유죄’가 가능한 대표적 의미이므로 이를 사용하되, 그리스어의 사망 독법은 각주에 유지했습니다.
  issues:
