  naturalness: ‘당신’의 반복은 한국어 일반 지혜 권면에서 다소 부자연스럽고, ‘빌려주셨다면’의 주체 높임은 원문의 일반적 청자에게 불필요한 존대를 더합니다. ‘자신보다’ 및 비존대 과거 조건형이 현대 합쇼체에 더 자연스럽습니다.
