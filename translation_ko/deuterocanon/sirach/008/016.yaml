base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/008/016.yaml
  text: Do not lend to a man stronger than you; and if you do lend[a], regard it as lost.
  footnotes:
  - marker: a
    text: 'The Greek witness here reads a different warning: ''Do not fight with a hot-tempered man, and do not travel through the wilderness with him ... where there is no help, he will strike you down.'' The surviving Hebrew instead warns against lending to someone stronger than you.'
    reason: textual_variant
translation:
  language: ko
  text: 당신보다 더 강한 사람에게는 돈을 빌려주지 마십시오. 그리고 만일 빌려주셨다면, 잃어버린 것으로 여기십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '그리스어 전승은 여기서 다른 경고를 전합니다: “성마른 사람과 싸우지 말고, 그와 함께 광야를 지나지 마십시오… 그의 눈에는 피가 아무것도 아니며, 도움의 손길이 없는 곳에서 그는 당신을 쓰러뜨릴 것입니다.” 현존 히브리어는 대신 자신보다 더 강한 사람에게 빌려주지 말라고 권고합니다.'
    reason: textual_variant
lexical_decisions:
- source_word: אַל תַּלְוֶה
  english_pob_choice: Do not lend
  chosen_korean: 돈을 빌려주지 마십시오
  alternatives_korean:
  - 빌려주지 마십시오
  - 대출해 주지 마십시오
  lexicon: HALOT
  rationale: 히브리어 לוה의 사역형은 금전적 ‘빌려주다’의 뜻이 가장 자연스럽고, 지혜문학의 금지문으로서 합쇼체 명령을 사용했습니다.
- source_word: אִישׁ חָזָק מִמְּךָ
  english_pob_choice: a man stronger than you
  chosen_korean: 당신보다 더 강한 사람
  alternatives_korean:
  - 당신보다 더 강한 남자
  - 당신보다 더 강한 자
  lexicon: HALOT
  rationale: 원문은 אִישׁ의 남성형을 가지지만, 한국어에서는 ‘사람’이 가장 자연스럽게 비교의 의미를 살리며 문맥상 성별을 과도하게 부각하지 않습니다.
- source_word: כִּמְאַבֵּד
  english_pob_choice: regard it as lost
  chosen_korean: 잃어버린 것으로 여기십시오
  alternatives_korean:
  - 잃은 것으로 여기십시오
  - 사라진 것으로 여기십시오
  lexicon: HALOT
  rationale: 비교 표지 כִּ의 함의를 살려, 회수 불가능한 것으로 ‘여기라’는 실용적 권면을 한국어로 분명하게 옮겼습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행본문의 차이
  chosen_reading: 본문은 히브리어의 ‘더 강한 사람에게 돈을 빌려주지 말라’는 경고를 따르고, 그리스어의 ‘성마른 사람과 다투지 말라’는 이문은 주석적 각주로 처리했습니다.
  alternative_readings:
  - 그리스어 문구를 본문에 반영하기
  - 두 전승을 절충해 일반적 경고로 만들기
  rationale: 이 절은 살아남은 히브리어가 재산/대출 경고를 주는 반면, 그리스어는 전혀 다른 잠언을 전하므로 본문에서 혼합하지 않고 차이를 보존하는 것이 स्रोत에 더 충실합니다.
  doctrine_reference: Sirach 본문 전승의 이본 처리 원칙
