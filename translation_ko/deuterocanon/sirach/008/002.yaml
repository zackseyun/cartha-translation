translation:
  language: ko
  text: 자기보다 더 강한 사람과 다투지 마십시오. 그의 손에 떨어질까 봐 두렵습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קָשֶׁה
  english_pob_choice: harder
  chosen_korean: 더 강한
  alternatives_korean:
  - 더 단단한
  - 더 거친
  - 더 힘센
  lexicon: קָשֶׁה
  rationale: 히브리어 קָשֶׁה는 문자적으로 ‘단단한/강한/가혹한’ 범위를 가질 수 있으나, 여기서는 다툼의 상대를 힘의 우위가 있는 사람으로 경계시키는 문맥이므로 ‘더 강한’이 자연스럽고 의미를 잘 드러냅니다.
- source_word: תָּרִיב
  english_pob_choice: quarrel
  chosen_korean: 다투지 마십시오
  alternatives_korean:
  - 말다툼하지 마십시오
  - 시비를 걸지 마십시오
  lexicon: ריב
  rationale: ריב의 기본값인 ‘다투다/논쟁하다’를 살려, 현대 한국어에서 가장 직접적이고 문맥에 맞는 표현으로 옮겼습니다.
- source_word: בְּיָדוֹ
  english_pob_choice: into his hand
  chosen_korean: 그의 손에 떨어질까 봐
  alternatives_korean:
  - 그의 손에 들어갈까 봐
  - 그의 손에 붙잡힐까 봐
  lexicon: יד
  rationale: 직역의 ‘손에’는 유지하되, 결과적으로 그의 지배·처분 아래 놓인다는 함의를 한국어 관용으로 풀어 ‘떨어질까 봐’로 옮겼습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행본의 차이
  chosen_reading: 본문은 히브리어의 ‘자기보다 더 강한 사람’과 ‘그의 손에 떨어짐’을 따랐습니다.
  alternative_readings:
  - 그리스어 병행본을 따라 ‘부유한 사람’으로 옮김
  - 그리스어의 ‘금’과 ‘왕들의 마음’ 관련 확장을 반영함
  rationale: 이 절의 확정 본문은 히브리어로 주어져 있으며, 그리스어는 병행·보완 전승이지만 내용이 크게 다르므로, 주본문은 히브리어에 맞추고 그리스어는 채택하지 않았습니다.
  doctrine_reference: 본문 비평 / 전승 비교
