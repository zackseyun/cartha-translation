  - 자주 어울리지 마십시오
  - 습관처럼 가까이하지 마십시오
  lexicon: HALOT
  rationale: רגל의 ‘습관이 되다/익숙해지다’ 뉘앙스를 살리면서, 현대 한국어에서 경고의 의미가 자연스럽게 드러나도록 옮겼습니다.
- source_word: אִישׁ אֱוִיל
  english_pob_choice: a foolish man
  chosen_korean: 어리석은 사람
  alternatives_korean:
  - 어리석은 남자
  - 우매한 사람
  - 어리석은 자
  lexicon: HALOT
  rationale: 히브리어는 남성 단수형이지만, 경구적 권고의 일반성을 살려 한국어에서는 포괄적인 ‘사람’으로 옮겼습니다.
- source_word: יָבוּז
  english_pob_choice: he show contempt
  chosen_korean: 업신여길 수 있습니다
  alternatives_korean:
