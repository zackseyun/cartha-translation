  lexicon: HALOT
  rationale: רגל의 ‘습관이 되다/익숙해지다’ 뉘앙스를 살리면서, 현대 한국어에서 경고의 의미가 자연스럽게 드러나도록 옮겼습니다.
- source_word: אִישׁ אֱוִיל
  english_pob_choice: a foolish man
  chosen_korean: 어리석은 사람
  alternatives_korean:
  - 어리석은 남자
  - 우매한 사람
  - 어리석은 자
  lexicon: HALOT
  rationale: 히브리어는 남성 단수형이지만, 경구적 권고의 일반성을 살려 한국어에서는 포괄적인 ‘사람’으로 옮겼습니다.
- source_word: יָבוּז
  english_pob_choice: he show contempt
  chosen_korean: 업신여길 수 있습니다
  alternatives_korean:
  - 경멸할 수 있습니다
  - 멸시할 수 있습니다
  - 무시할 수 있습니다
  lexicon: HALOT
  rationale: בוז의 핵심 의미인 ‘경멸/업신여김’을 한국어 관용으로 분명하게 전달했습니다.
- source_word: לִנְדִיבִים
  english_pob_choice: for nobles
  chosen_korean: 귀인들을
  alternatives_korean:
  - 고귀한 사람들을
  - 귀족들을
  - 높은 사람들을
  lexicon: HALOT
  rationale: נדיבים는 신분·지위가 높은 사람들을 가리킬 수 있어, 한국어에서는 계층적 뉘앙스를 살린 ‘귀인들’이 가장 간결합니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 평행본문의 차이
  chosen_reading: 본문은 현존 히브리어를 따라 ‘어리석은 사람과 친숙해지지 말라’로 번역하고, 그리스어의 다른 읽기는 각주로 노출했습니다.
  alternative_readings:
  - ‘늙은 사람을 업신여기지 마라, 우리도 모두 늙어 가고 있기 때문이다.’
  rationale: 지혜문학에서 이 절은 히브리어와 그리스어가 실질적으로 다르므로, 기본 본문은 히브리어를 따르되 대체 전승을 숨기지 않는 것이 투명합니다.
  doctrine_reference: 'POB 원칙: 현존 히브리어가 있으면 히브리어를 우선하고, משמעות 있는 그리스어 대조는 각주로 보존한다.'
