    rationale: פֶּן은 ‘~할까 하여/하지 않도록’의 경고를 이끌며, וְאָבָדְתָּ는 ‘네가 망하다’입니다. 히브리어의 정확한 관계가 난해하더라도, 이를 난해하다고 밝히면서 문법적으로 가능한 번역을 제시해야 합니다.
  - severity: low
    issue: ‘말 많은 사람’보다 ‘말이 많은 사람’이 표준적인 현대 한국어 관형 표현입니다.
