base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/008/003.yaml
  text: Do not quarrel with a man who has a sharp tongue, and do not pile wood on his fire.[a]
  footnotes:
  - marker: a
    text: The surviving Hebrew reads approximately, 'Do not plot against a man of no substance, lest he weigh your price and you be lost.' The Greek parallel instead reads, 'Do not quarrel with a sharp-tongued man, and do not pile wood on his fire.' Because the Hebrew here is difficult and the Greek forms a coherent proverb, the main text follows the Greek sense while preserving the Hebrew-based alternative.
    reason: alternative_reading
translation:
  language: ko
  text: 말이 많은 사람과 다투지 말고, 그가 지핀 불에 나무를 더 얹지 마십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 남아 있는 히브리어 본문은 대략 ‘재산이 없는 사람을 해치려고 꾀하지 말라. 그가 네 값을 달아 보고 네가 망할까 한다’로 읽히지만, 표현과 뜻이 난해합니다. 그리스어 병행본문은 ‘말이 많은 사람과 다투지 말고, 그가 지핀 불에 나무를 더 얹지 말라’고 하며, 일관된 속담 형태를 이룹니다. 따라서 본문은 그리스어의 뜻을 따르고, 히브리어에 따른 다른 읽기는 이 각주에 보존합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: μὴ διαμάχου
  english_pob_choice: Do not quarrel
  chosen_korean: 다투지 말고
  alternatives_korean:
  - 논쟁하지 말고
  - 시비하지 말고
  - 언쟁하지 말고
  lexicon: LSJ
  rationale: 그리스어 μὴ διαμάχου는 다투다/언쟁하다의 뜻이 자연스럽고, 뒤의 불-나무 비유와도 가장 잘 맞습니다.
- source_word: ἀνθρώπου γλωσσώδους
  english_pob_choice: with a man who has a sharp tongue
  chosen_korean: 말 많은 사람과
  alternatives_korean:
  - 혀가 날카로운 사람과
  - 수다스러운 사람과
  - 말이 거친 사람과
  lexicon: LSJ
  rationale: 직역보다 한국어 관용에 맞게 ‘말 많은 사람’으로 옮기면, 말로 갈등을 키우는 사람이라는 의미가 분명해집니다.
- source_word: μὴ ἐπιστοίβαζης ἐπὶ τὸ πῦρ αὐτοῦ ξύλα
  english_pob_choice: and do not pile wood on his fire
  chosen_korean: 그의 불에 나무를 더 얹지 마십시오
  alternatives_korean:
  - 그의 불에 장작을 더 쌓지 마십시오
  - 그의 불에 땔감을 더하지 마십시오
  lexicon: LSJ
  rationale: 이미 있는 분쟁을 더 격화시키지 말라는 이미지를 그대로 살리기 위해 ‘불에 나무를 더 얹다’라는 직역에 가까운 표현을 유지했습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행본문의 처리
  chosen_reading: 본문은 그리스어 병행본문의 ‘말 많은 사람/불에 나무를 더 얹지 말라’는 뜻을 따르고, 히브리어의 다른 가능성은 각주로 남겼습니다.
  alternative_readings:
  - 히브리어를 따라 ‘가난한 사람과 다투지 말라, 네 값을 그가 저울질하여 네가 망할까 한다’로 번역
  rationale: 이 절은 전승 차이가 크므로, 본문은 POB의 기존 영어 본문처럼 그리스어의 일관된 속담을 따르고, 히브리어는 대체 전승으로 투명하게 표시하는 것이 적절합니다.
  doctrine_reference: 본문 비평 / 전승사
