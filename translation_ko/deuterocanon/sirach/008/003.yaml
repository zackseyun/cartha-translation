review_pass:
  verdict: revise
  source_fidelity: 본문은 그리스어 병행본문의 두 명령(μὴ διαμάχου … μὴ ἐπιστοίβαζης … ξύλα)을 충실히 반영합니다. 다만 각주의 히브리어 대안은 אַל תַּחֲרֹשׁ의 기본 의미인 ‘꾀하다/모의하다’를 ‘다투다’로 바꾸었고, 마지막 절의 인과관계도 한국어로 부정확하게 표현했습니다.
  naturalness: 본문의 합쇼체와 문장 연결은 자연스럽습니다. ‘그의 불에 나무를 더 얹다’도 이해 가능하나, ‘그가 지핀 불’이라고 하면 소유격 αὐτοῦ와 비유의 대상을 한국어에서 더 또렷하게 드러낼 수 있습니다.
  terminology: γλωσσώδης는 ‘말이 많은’이 가장 직접적이며, ‘말 많은’도 가능하나 관형형으로는 ‘말이 많은 사람’이 더 표준적입니다. 히브리어 אִישׁ לֹא הוֹן은 전승 상태와 뜻이 불확실하므로 ‘실체가 없는 사람’처럼 확정적으로 번역하지 않고, ‘재산이 없는 사람’이라는 가능한 직역적 이해와 본문의 난해성을 밝혀야 합니다.
