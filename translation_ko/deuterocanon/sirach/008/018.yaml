translation:
  language: ko
  text: 재판관과 다투지 마십시오. 그는 자기 뜻대로 판결할 것이기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 전승에는 다른 말이 있습니다. “낯선 사람 앞에서는 비밀스러운 일을 하지 마십시오. 그것이 무엇을 낳을지 알지 못하기 때문입니다.” 이 절에는 히브리어가 남아 있으므로 본문은 히브리어 카이로 게니자 증인을 따랐습니다. 두 전승의 차이가 큽니다.
    reason: textual_variant
lexical_decisions:
- source_word: אַל תּשָּׁפֵט
  english_pob_choice: Do not contend
  chosen_korean: 다투지 마십시오
  alternatives_korean:
  - 판사와 논쟁하지 마십시오
  - 판사와 소송하지 마십시오
  - 심판을 다투지 마십시오
  lexicon: HALOT
  rationale: שפט가 여기서는 법정에서의 대결적 다툼을 가리키므로, 한국어에서는 자연스럽고 경고의 뉘앙스를 살리는 ‘다투다’로 옮겼습니다.
- source_word: עִם שׁוֹפֵט
  english_pob_choice: with a judge
  chosen_korean: 판사와
  alternatives_korean:
  - 재판관과
  - 심판과
  - 판사와 맞서
  lexicon: HALOT
  rationale: 문맥상 상대방은 ‘judge’이며, 한국어에서는 관계를 분명히 드러내는 ‘-와’ 구성이 가장 간결합니다.
- source_word: כִּרְצוֹנוֹ
  english_pob_choice: according to his own will
  chosen_korean: 자기 뜻대로
  alternatives_korean:
  - 자기 의지대로
  - 제 마음대로
  - 자기 소원대로
  lexicon: HALOT
  rationale: רָצוֹן의 핵심은 개인의 의지·판단이므로, ‘자기 뜻대로’가 원문의 경고를 가장 자연스럽게 전달합니다.
- source_word: יִשְׁפֹּט
  english_pob_choice: he will judge
  chosen_korean: 판결할 것입니다
  alternatives_korean:
  - 판정할 것입니다
  - 심판할 것입니다
  - 판단할 것입니다
  lexicon: HALOT
  rationale: 같은 어근 שפט를 살리되, 한국어에서는 법정 행위에 가장 가까운 ‘판결하다’를 택해 앞선 경고와 연결했습니다.
theological_decisions:
- issue: 속담형 지혜문장의 어조
  chosen_reading: 직설적 금지문으로 옮기되, 본문의 경고성을 살려 존댓말 명령형을 유지했습니다.
  alternative_readings:
  - 더 완곡한 권고문으로 풀어쓰기
