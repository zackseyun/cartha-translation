translation:
  language: ko
  text: 그에게서 당신은 지혜를 얻을 것이니, 필요할 때 한 말을 대답할 수 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '그리스어에는 이곳에 상당히 다른 읽기가 있습니다: ‘네 힘을 넘는 보증을 서지 말라. 그리고 만일 보증을 섰다면, 갚을 사람처럼 신중하라.’ 이 절은 히브리어 카이로 게니자 본문을 따라 본문 번역을 했으며, 두 본문의 차이는 큽니다.'
    reason: textual_variant
lexical_decisions:
- source_word: מִמֶּנּוּ
  english_pob_choice: from him
  chosen_korean: 그에게서
  alternatives_korean:
  - 그로부터
  - 그에게서부터
  lexicon: HALOT
  rationale: מִן + 인칭접미사는 출처를 나타내며, 문맥상 대상이 사람임을 반영해 자연스러운 한국어 조사구인 ‘그에게서’로 옮겼습니다.
- source_word: תִּקַּח
  english_pob_choice: you will gain
  chosen_korean: 당신은 ... 얻을 것이니
  alternatives_korean:
  - 당신은 ... 취할 것이니
  - 당신은 ... 받을 것이니
  lexicon: HALOT
  rationale: 지혜 문맥에서 ‘취하다’보다 ‘얻다’가 획득의 뜻을 더 자연스럽게 드러내므로, 본문의 습득 의미를 살렸습니다.
- source_word: שֶׂכֶל
  english_pob_choice: understanding
  chosen_korean: 지혜
  alternatives_korean:
  - 이해
  - 분별
  - 슬기
  lexicon: HALOT
  rationale: שֶׂכֶל은 단순 지적 이해보다 실천적 판단력을 가리키므로, 잠언적 맥락에서 한국어로는 ‘지혜’가 가장 적절하다고 보았습니다.
- source_word: לְהַשִׁיב פִּתְגָּם
  english_pob_choice: to answer a saying
  chosen_korean: 한 말을 대답할 수 있습니다
  alternatives_korean:
  - 말에 대답할 수 있습니다
  - 말 한마디에 응답할 수 있습니다
  - 격언에 답할 수 있습니다
  lexicon: HALOT
  rationale: פִּתְגָּם은 잠언적 발화나 말한 내용을 가리킬 수 있어, 지나치게 특정한 ‘격언’보다 넓은 ‘한 말’로 처리해 본문의 범위를 보존했습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 평행본문의 현저한 차이
  chosen_reading: 히브리어 본문을 따르되, 본문은 지혜를 얻고 필요할 때 응답할 수 있다는 뜻으로 옮겼습니다.
  alternative_readings:
  - 그리스어식으로 ‘네 힘을 넘는 보증을 서지 말라’로 옮길 수 있음
  - 그리스어를 본문으로 삼아 경계 명령으로 번역할 수 있음
  rationale: 이 절은 히브리어가 보존되어 있고 영어 POB도 히브리어 본문을 본문으로 채택하되 그리스어의 큰 차이를 주석으로 알리고 있습니다. 따라서 본문 번역은 히브리어를 따르고, 차이는 각주로 처리하는 것이 가장 투명합니다.
  doctrine_reference: 본문비평 / 사본 차이
