  verdict: revise
  source_fidelity: 전반절 ‘조롱하는 사람 앞에서 물러서지 마십시오’는 אַל תָּזוּחַ מִפְּנֵי לֵץ를 자연스럽고 충실하게 옮깁니다. 그러나 현 번역의 ‘그가 … 그를 앉히지 못하게 하십시오’는 히브리어의 난해한 부정사 לְהוֹשִׁיבוֹ를 ‘그가 하지 못하도록 막으라’는 별개의 사역·금지 구조로 바꾸므로 충실하지 않습니다. 후반절은 주어와 대명사 지시 대상이 확정되지 않는 난점을 본문과 각주에서 남겨야 합니다.
  naturalness: ‘조롱하는 사람’과 ‘물러서지 마십시오’는 현대 표준 한국어의 합쇼체로 자연스럽습니다. 후반절은 원문 자체가 난해하므로 어느 정도의 낯섦은 피할 수 없지만, ‘…못하게 하십시오’는 원문에 없는 방해 행위를 뜻하므로 삭제해야 합니다.
  terminology: לֵץ는 지혜문학의 경멸적 조롱꾼을 뜻하므로 ‘조롱하는 사람’은 적절합니다. אֹרֵב의 적대적 매복 이미지는 ‘매복하는 자’가 ‘숨어 기다리는 자’보다 간결하면서도 분명하게 전달합니다.
