  text: Do not move aside before a scoffer[a], lest he seat him as one lying in wait before you.
  footnotes:
  - marker: a
    text: The Hebrew of the second line is difficult. Literally, 'lest he seat him as one lying in wait before you.' The Greek parallel gives the broader sense of a dangerous, self-willed man acting against you.
    reason: textual_variant
translation:
  language: ko
  text: 조롱하는 사람 앞에서 물러서지 마십시오. 그가 당신 앞에서 매복하는 자처럼 그를 앉히는 일이 없도록 하십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 후반절은 난해합니다. 직역하면 ‘그를 당신 앞에서 매복하는 자처럼 앉히려고’입니다. 부정사의 주체와 ‘그를’의 지시 대상은 분명하지 않습니다. 그리스어 평행본문은 이 구절을 위험하고 제멋대로 행동하는 사람에 대한 경고로 다르게 전합니다.
    reason: source_note
lexical_decisions:
- source_word: אַל תָּזוּחַ
  english_pob_choice: Do not move aside
  chosen_korean: 물러서지 마십시오
  alternatives_korean:
  - 비키지 마십시오
  - 옆으로 물러나지 마십시오
  - 양보하지 마십시오
  lexicon: HALOT
  rationale: זוּח/זוח의 핵심은 상대 앞에서 자리를 내주며 물러나는 움직임이므로, 현대 한국어에서는 ‘물러서다’가 가장 자연스럽고 경계의 뉘앙스를 살립니다.
- source_word: מִפְּנֵי לֵץ
  english_pob_choice: before a scoffer
  chosen_korean: 조롱하는 사람 앞에서
  alternatives_korean:
  - 조롱꾼 앞에서
  - 비웃는 사람 앞에서
  - 희롱하는 사람 앞에서
  lexicon: HALOT
  rationale: לֵץ는 지혜문학에서 경멸적으로 남을 비웃는 사람을 가리키므로, ‘조롱하는 사람’이 문맥의 도덕적 색채를 가장 잘 드러냅니다.
- source_word: כְּאוֹרֵב
  english_pob_choice: one lying in wait
  chosen_korean: 숨어 기다리는 자처럼
  alternatives_korean:
  - 매복한 자처럼
  - 매복하는 자처럼
  - 복병처럼
  lexicon: HALOT
  rationale: אֹרֵב은 드러나지 않고 숨어 있다가 공격할 준비를 하는 자를 뜻하므로, ‘숨어 기다리는 자’가 이미지와 의미를 모두 보존합니다.
- source_word: לְהוֹשִׁיבוֹ
  english_pob_choice: lest he seat him
  chosen_korean: 그를 앉히지 못하게 하십시오
  alternatives_korean:
  - 그가 그를 앉히지 못하게 하십시오
  - 그를 자리잡게 하지 못하게 하십시오
  - 그가 당신을 앉히지 못하게 하십시오
  lexicon: HALOT
  rationale: 히브리어의 사역형과 목적격 접미사는 문자적으로 ‘그를 앉히다/앉히게 하다’의 이미지를 담으므로, 본문 난점을 평탄화하지 않고 한국어에서도 그 동작을 유지했습니다.
theological_decisions:
- issue: 히브리어 난해 구절의 처리
  chosen_reading: 히브리어 본문을 우선해 직역적 이미지를 유지하고, 의미는 문맥상 적대적 함의를 따라 읽었습니다.
  alternative_readings:
  - 그리스어 평행본문을 따라 더 풀어 ‘위험한 사람과 함께 길을 가지 마십시오’로 옮김
  - 히브리어를 매끈하게 수정해 적대적 경고로 재구성
  rationale: 시락서는 남아 있는 히브리어가 우선이며, 이 절의 후반부는 난해하지만 본문을 대체할 만큼 훼손되지는 않았습니다. 그래서 이미지는 살리고 전체 의미는 ‘매복’의 적대성으로 전달했습니다.
  doctrine_reference: 'PHILOSOPHY.md: 히브리어가 남아 있으면 이를 우선하고, 그리스어 평행본문은 보조 증거로 활용합니다.'
