base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/008/017.yaml
  text: Do not pledge yourself for one stronger than you; and if you have pledged yourself[a], act as one who must pay.
  footnotes:
  - marker: a
    text: 'Hebrew ''for one greater than you'' or ''for one beyond you''; the sense is someone whose obligation exceeds your capacity or standing. The Greek parallel reads differently: ''Do not take counsel with a fool, for he will not be able to keep a matter.'''
    reason: alternative_reading
translation:
  language: ko
  text: 더 큰 사람을 위하여 보증을 서지 마십시오. 그리고 만일 보증을 섰다면, 갚아야 하는 사람처럼 행동하십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 ‘당신보다 더 큰 사람’ 또는 ‘당신의 한계를 넘는 사람’으로도 읽을 수 있습니다. 헬라어 병행문은 다르게 ‘어리석은 사람과 상의하지 마라, 그는 말을 지킬 수 없기 때문이다’라고 합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תַּעֲרֹב
  english_pob_choice: Do not pledge yourself
  chosen_korean: 보증을 서지 마십시오
  alternatives_korean:
  - 남에게 보증 서지 마십시오
  - 보증인이 되지 마십시오
  - 책임을 대신 지지 마십시오
  lexicon: HALOT
  rationale: ערב의 이 문맥상 뜻은 타인을 위해 채무를 떠맡는 보증 행위이므로, 현대 한국어에서 법적·경제적 의미가 분명한 ‘보증을 서다’로 옮겼습니다.
- source_word: יָתֵר מִמְּךָ
  english_pob_choice: for one stronger than you
  chosen_korean: 더 큰 사람을 위하여
  alternatives_korean:
  - 당신보다 더 큰 사람을 위하여
  - 당신보다 능력이 큰 사람을 위하여
  - 당신의 감당을 넘는 사람을 위하여
  lexicon: HALOT
  rationale: יתר는 단순한 수량의 ‘더 큼’뿐 아니라 능력·지위의 초과를 가리킬 수 있어, 보증의 부담을 감당하기 어려운 상대라는 뜻을 자연스럽게 드러내는 표현을 택했습니다.
- source_word: וְאִם עָרַבְתָּ
  english_pob_choice: and if you have pledged yourself
  chosen_korean: 그리고 만일 보증을 섰다면
  alternatives_korean:
  - 그리고 만일 보증인이 되었다면
  - 그리고 만일 보증을 해 주었다면
  - 그리고 만일 책임을 떠맡았다면
  lexicon: HALOT
  rationale: 첫 절과 같은 동사를 반복하므로, 한국어도 같은 금융·법률적 행위를 일관되게 유지했습니다.
- source_word: כִּמְשַׁלֵּם
  english_pob_choice: act as one who must pay
  chosen_korean: 갚아야 하는 사람처럼 행동하십시오
  alternatives_korean:
  - 지불해야 하는 사람처럼 행동하십시오
  - 대금을 치러야 하는 사람처럼 행동하십시오
  - 빚을 갚는 사람처럼 여기십시오
  lexicon: HALOT
  rationale: 비교를 나타내는 כ를 살려, 실제로 갚을 책임이 있는 사람처럼 스스로를 인식하고 행동하라는 뜻을 분명하게 옮겼습니다.
