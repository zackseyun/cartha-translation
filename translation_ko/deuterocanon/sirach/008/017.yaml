  naturalness: ‘보증을 서다’와 ‘갚아야 할 사람처럼 행동하십시오’는 현대 표준 한국어 합쇼체로 자연스럽고 명료합니다. ‘자신보다 더 큰 사람’은 원문의 다의성을 보존하는 다소 직역적인 표현이지만, 각주가 그 의미 범위를 적절히 설명합니다.
