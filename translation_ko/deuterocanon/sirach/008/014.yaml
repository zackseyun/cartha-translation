review_pass:
  verdict: revise
  source_fidelity: 본문은 히브리어의 권고와 불의 비유를 대체로 충실히 따릅니다. 다만 ‘그렇지 않으면 … 될까 두렵습니다’는 원문의 화자가 두려워한다는 뜻처럼 들려 פֶּן의 경고 목적절을 부정확하게 처리합니다. ‘그의 불꽃’도 ‘그의 불에서 튄 불티/불꽃’이라는 원문의 소유 및 이미지가 다소 흐려집니다.
  naturalness: ‘악한 사람의 유산 안에서’는 한국어에서 다소 직역투입니다. ‘유산으로’가 해당 재산을 통해 번성하는 맥락을 자연스럽게 드러냅니다. 결과절은 ‘타버릴 수 있습니다’가 현대 합쇼체의 직접적인 경고로 자연스럽습니다.
  terminology: ‘악한 사람’, ‘유산’, ‘번성’은 적절합니다. 이 절의 헬라어 병행 본문은 히브리어와 실질적으로 다른 경구이므로 각주로 남겨야 합니다. 기존 각주의 ‘그들의 지위’는 헬라어 αὐτοῦ(그의)를 잘못 반영하므로 ‘그의 위신/지위’를 기준으로 고쳐야 합니다.
  issues:
