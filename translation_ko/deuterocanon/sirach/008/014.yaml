    issue: 결과절이 화자의 두려움으로 표현됨
    rationale: ‘타게 될까 두렵습니다’는 ‘내가 두렵다’라는 발화 태도를 덧붙입니다. פֶּן תְּבֹעַר는 독자가 불타는 결과를 피하도록 하는 경고이므로 객관적 가능성 또는 목적의 표현이 적절합니다.
