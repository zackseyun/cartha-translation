  text: Do not prosper in the inheritance of a wicked man[a], lest you be burned by the sparks of his fire.
  footnotes:
  - marker: a
    text: 'Greek witness (Swete/LXX) reads a different saying here: ''Do not litigate with a judge, for they will judge for him according to his standing.'' The Hebrew Cairo Geniza text instead warns against involvement in the inheritance of a wicked man.'
    reason: textual_variant
translation:
  language: ko
  text: 악한 사람의 유산 안에서 번성하지 마십시오. 그렇지 않으면 그의 불꽃에 타게 될까 두렵습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '헬라어 증인은 이곳을 다른 경구로 전합니다: ‘판사와 다투지 말라. 그들의 지위에 따라 그를 위해 판결할 것이기 때문이다.’ 히브리어 카이로 게니자 본문은 악한 사람의 유산과 연루되는 일을 경고합니다.'
    reason: textual_variant
lexical_decisions:
- source_word: אַל תִּצְלַח
  english_pob_choice: Do not prosper
  chosen_korean: 번성하지 마십시오
  alternatives_korean:
  - 성공하지 마십시오
  - 흥왕하지 마십시오
  lexicon: HALOT
  rationale: צָלַח은 문맥상 성공·번영을 뜻하므로, 한국어에서는 ‘번성하다’가 부자연스럽지 않으면서도 단순한 ‘성공하다’보다 경고의 뉘앙스를 잘 살립니다.
- source_word: בְּנַחֲלַת
  english_pob_choice: in the inheritance of
  chosen_korean: 유산 안에서
  alternatives_korean:
  - 상속 재산 안에서
  - 유업 안에서
  - 상속의 몫 안에서
  lexicon: HALOT
  rationale: נחלה는 상속된 소유, 유산, 재산을 가리키므로, 여기서는 사람의 소유·재산 영역에 깊이 관여하는 뜻을 살려 ‘유산 안에서’로 옮겼습니다.
- source_word: רָשָׁע
  english_pob_choice: a wicked man
  chosen_korean: 악한 사람
  alternatives_korean:
  - 악인
  - 사악한 사람
  lexicon: HALOT
  rationale: 히브리어 단수형을 반영해 단수로 옮겼고, 지혜문학의 경고문답체에 맞게 특정 종교 용어보다 직접적인 ‘악한 사람’을 택했습니다.
- source_word: פֶּן תְּבֹעַר
  english_pob_choice: lest you be burned
  chosen_korean: 그렇지 않으면 ... 타게 될까 두렵습니다
  alternatives_korean:
  - 그렇지 않으면 ... 타버릴 것입니다
  - 그렇지 않으면 ... 불타게 됩니다
  lexicon: HALOT
  rationale: פן은 경고의 목적절로 ‘~하지 않으면’ 또는 ‘~할까 두렵다’의 뉘앙스를 가지므로, 문장 흐름을 자연스럽게 하면서 경고성을 유지하는 표현을 선택했습니다.
- source_word: בִּשְׁבִיב אִשּׁוֹ
  english_pob_choice: by the sparks of his fire
  chosen_korean: 그의 불꽃에
  alternatives_korean:
  - 그의 불똥에
  - 그의 불길의 불똥에
  - 그의 불의 불티에
  lexicon: HALOT
  rationale: שביב는 ‘불꽃, 불티, 튀는 불’ 계열의 이미지이므로, 한국어에서는 독자가 즉시 위험을 느끼는 ‘불꽃’으로 간결하게 옮겨 원문의 비유적 경고를 살렸습니다.
theological_decisions:
- issue: 히브리어 본문과 헬라어 병행본문의 상이함
  chosen_reading: 본문은 현존 히브리어를 따라 번역하고, 헬라어의 다른 문장은 주석적 대안으로만 보존합니다.
  alternative_readings:
  - '헬라어: ‘판사와 다투지 말라…’'
  rationale: 집회서의 경우 히브리어가 남아 있을 때 이를 우선하는 프로젝트 원칙에 따랐습니다. 이 절은 헬라어가 전혀 다른 경구를 보이므로, 본문에 섞어 넣지 않고 번역 방향의 차이로만 인정하는 것이 가장 투명합니다.
  doctrine_reference: 'PHILOSOPHY.md: Hebrew primacy in Sirach where extant; preserve Greek divergence as textual variant.'
