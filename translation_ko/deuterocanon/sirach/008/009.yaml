base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/008/009.yaml
  text: Do not boast over one who is dying[b][a]; remember that all of us are being gathered.
  footnotes:
  - marker: a
    text: Hebrew 'are being gathered in,' a traditional metaphor for death; alternatively, 'all of us will die.'
    reason: lexical_alternative
  - marker: b
    text: The Greek parallel tradition for Sirach 8:9 differs substantially here and speaks instead about learning from the discourse of elders; the Hebrew Cairo Geniza witness is therefore followed as the primary text for this verse.
    reason: textual_variant
translation:
  language: ko
  text: 죽어 가는 이를 두고 자랑하지 마십시오.[a][b] 우리 모두가 거두어지고 있음을 기억하십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 죽음의 완곡어법으로 ‘거두어지다/모아지다’라는 표현을 사용합니다. 따라서 이를 단순히 ‘죽다’라고 풀어 옮기지 않고 은유를 살렸습니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어 병행 전승은 이 절과 상당히 다르며, 장로들의 말씀에서 배우는 내용입니다. 이 번역은 히브리어 카이로 게니자 증거를 본문으로 따릅니다.
    reason: textual_variant
lexical_decisions:
- source_word: אַל תִּתְהַלֵּל
  english_pob_choice: Do not boast / rejoice
  chosen_korean: 자랑하지 마십시오
  alternatives_korean:
  - 기뻐하지 마십시오
  - 우쭐대지 마십시오
  lexicon: HALOT
  rationale: hitpael הלל은 여기서 자기 우쭐거림이나 타인의 죽음 위에서의 승리감까지 포괄하므로, ‘자랑하다’가 그 자기고양과 경멸의 뉘앙스를 가장 간결하게 살립니다.
- source_word: עַל גֹּוֵעַ
  english_pob_choice: over one who is dying
  chosen_korean: 죽어 가는 자를 두고
  alternatives_korean:
  - 죽어 가는 사람 위에
  - 임종하는 이를 두고
  lexicon: HALOT
  rationale: עַל은 여기서 대상/상황의 ‘~을 두고’로 자연스럽게 드러나며, גֹּוֵעַ의 진행 중인 죽음 상태를 ‘죽어 가는 자’로 옮기면 현재분사의 지속성을 살릴 수 있습니다.
- source_word: זְכֹר כֻּלָּנוּ
  english_pob_choice: remember that all of us
  chosen_korean: 우리 모두가 … 있음을 기억하십시오
  alternatives_korean:
  - 우리 모두를 기억하십시오
  - 우리 모두가 … 됨을 기억하십시오
  lexicon: HALOT
  rationale: כֻּלָּנוּ의 포괄성을 ‘우리 모두’로 살리고, 명령형 זְכֹר 뒤에는 다음 절의 진술을 기억하라는 구조이므로 한국어에서는 ‘… 있음을 기억하십시오’로 연결하는 것이 자연스럽습니다.
- source_word: נֶאֱסָפִים
  english_pob_choice: are being gathered
  chosen_korean: 모여 들고 있음을
  alternatives_korean:
  - 모이고 있음을
  - 거두어지고 있음을
  - 모여 들 것임을
  lexicon: HALOT
  rationale: נאסף의 죽음 완곡어법을 직접 드러내되 과도하게 해설하지 않기 위해 ‘모여 들다’를 택했습니다. 이는 영어 POB의 ‘are being gathered’와 같은 은유를 한국어에서 유지합니다.
theological_decisions:
- issue: 죽음의 완곡어법을 직설로 풀어 쓸지 여부
  chosen_reading: 은유를 유지해 ‘모여 들고 있음을’로 옮겼습니다.
  alternative_readings:
  - 우리 모두가 죽을 것을 기억하십시오
  - 우리 모두가 조상들에게로 모인다는 것을 기억하십시오
  rationale: 히브리어는 মৃত্যু의 전통적 완곡어법인 ‘모으다/거두다’의 이미지를 사용하므로, 이를 직설적 명제로 바꾸면 문학적·신학적 결이 약해집니다. 반대로 ‘조상들에게로’는 본문에 없는 목적지를 덧붙입니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
