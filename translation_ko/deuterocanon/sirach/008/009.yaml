  verdict: revise
  source_fidelity: 첫 절의 ‘죽어 가는 이를 두고 자랑하지 마십시오’는 אַל תִּתְהַלֵּל עַל גֹּוֵעַ의 금지와 진행 중인 분사 גֹּוֵעַ를 충실히 반영합니다. 그러나 ‘모여 들고 있음을’은 자발적으로 한곳에 집결한다는 뜻이 강한 자동사 표현으로, 수동형 נֶאֱסָפִים(‘거두어지다/모아지다’)의 죽음 완곡어법을 충분히 반영하지 못합니다.
  naturalness: ‘거두어지고 있음을’은 일상적인 구어 표현은 아니지만, 죽음에 관한 히브리어 은유를 목적지를 보태지 않고 보존하는 문어적 번역으로 허용됩니다. 각주가 이 비일상적 은유를 적절히 안내합니다. ‘죽어 가는 이를 두고’는 현대 표준어 합쇼체 문맥에서 자연스럽습니다.
  terminology: ‘자랑하다’는 התהלל의 자기고양/과시 의미를 보존하며, 문맥상 타인의 죽음을 두고 우쭐대는 뜻을 전달합니다. ‘거두어지다’는 אסף의 수동적 죽음 완곡어법을 보존하고, ‘조상들에게로’처럼 본문에 없는 목적지를 첨가하지 않습니다. 그리스어 본문과의 큰 차이는 각주 b에서 정확히 밝혀야 합니다.
