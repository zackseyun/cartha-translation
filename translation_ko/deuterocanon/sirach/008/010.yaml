base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/008/010.yaml
  text: Do not abandon the discourse of the wise[b][a], and occupy yourself with their riddles.
  footnotes:
  - marker: a
    text: Or 'apply yourself to their riddles.' The Hebrew verb here is somewhat uncommon, but the sense is active engagement with the wise person's difficult sayings.
    reason: lexical_alternative
  - marker: b
    text: 'The Greek parallel for this verse reads instead: ''Do not kindle the coals of a sinner, lest you be burned in the fire of his flame.'' This reflects a substantially different textual tradition from the extant Hebrew.'
    reason: textual_variant
translation:
  language: ko
  text: 지혜로운 이들의 말을 버리지 말고, 그들의 수수께끼에 마음을 쓰십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 드문 동사형 때문에 뜻이 다소 불확실하며, ‘마음을 쓰십시오’는 적극적으로 관여하라는 뜻을 반영한 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어 병행본문은 “죄인의 숯불을 일으키지 말라…”로 달라, 현존 히브리어 본문과 상당히 다른 전승을 보입니다.
    reason: textual_variant
lexical_decisions:
- source_word: אַל תִּטֹּשׁ
  english_pob_choice: Do not abandon
  chosen_korean: 버리지 말고
  alternatives_korean:
  - 저버리지 말고
  - 떠나지 말고
  lexicon: HALOT
  rationale: נטש는 떠나다, 버리다, 저버리다의 뜻을 가지며, 여기서는 지혜로운 이들의 가르침을 의도적으로 외면하지 말라는 권면이므로 자연스러운 현대어로 ‘버리지 말고’가 적절합니다.
- source_word: שִׂיחַת חֲכָמִים
  english_pob_choice: the discourse of the wise
  chosen_korean: 지혜로운 이들의 말
  alternatives_korean:
  - 지혜자들의 담화
  - 현자들의 가르침
  - 지혜로운 이들의 담론
  lexicon: HALOT
  rationale: שִׂיחָה는 단순한 대화보다 지속적인 말, 담화, 숙고가 담긴 발화를 가리킬 수 있어, 지혜문학 문맥에서는 일상 대화보다 ‘말’로 옮겨도 충분히 원문의 무게를 살릴 수 있습니다.
- source_word: וּבְחִידֹתֵיהֶם
  english_pob_choice: with their riddles
  chosen_korean: 그들의 수수께끼에
  alternatives_korean:
  - 그들의 수수께끼 속에서
  - 그들의 난해한 말에
  - 그들의 수수께끼들에
  lexicon: HALOT
  rationale: חִידָה는 수수께끼, 난해한 말, 암호 같은 말을 뜻하므로, 지혜자의 깊은 말을 가리키는 문맥을 살려 ‘수수께끼’로 직역하는 편이 원문 긴장을 유지합니다.
- source_word: הִתְרַפֵּשׂ
  english_pob_choice: occupy yourself
  chosen_korean: 마음을 쓰십시오
  alternatives_korean:
  - 몰두하십시오
  - 자신을 내맡기십시오
  - 관여하십시오
  lexicon: HALOT
  rationale: 이 동사는 드문 용례로 의미가 다소 불확실하지만, 능동적으로 관여하고 붙드는 뉘앙스를 나타내므로, 합쇼체에서 과도하게 구어적이지 않으면서도 적극성을 살리는 ‘마음을 쓰다’가 적절합니다.
