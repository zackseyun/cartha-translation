  text: Do not abandon the discourse of the wise[b][a], and occupy yourself with their riddles.
  footnotes:
  - marker: a
    text: Or 'apply yourself to their riddles.' The Hebrew verb here is somewhat uncommon, but the sense is active engagement with the wise person's difficult sayings.
