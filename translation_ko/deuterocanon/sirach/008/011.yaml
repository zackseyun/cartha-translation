  terminology: ‘업신여기지 마십시오’는 תִבְזֶה를 적절히 옮깁니다. ‘통치자들 앞에 서는 데 필요한 가르침’은 לְהִתְיַצֵּב לִפְנֵי שָׂרִים 및 לֶקַח의 목적과 교훈적 의미를 유지합니다. 그리스어 각주는 본문과 실질적으로 다른 전승임을 계속 밝혀야 합니다.
