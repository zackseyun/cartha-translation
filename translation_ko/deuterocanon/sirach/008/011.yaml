translation:
  language: ko
  text: 그의 일상적인 대화마저도 업신여기지 마십시오. 그에게서 통치자들 앞에 서는 데 필요한 가르침을 배울 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '그리스어 병행본문: “무례한 사람 앞에서 일어나지 마십시오. 그가 당신의 입을 노리는 매복처럼 자리 잡지 않도록 하십시오.” 그리스어 전승은 여기서 현존 히브리어 본문과 내용이 상당히 다릅니다.'
    reason: alternative_reading
lexical_decisions:
- source_word: תִבְזֶה
  english_pob_choice: do not despise
  chosen_korean: 업신여기지 마십시오
