base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/008/008.yaml
  text: Do not shame an old man[a]; remember that you too will be numbered among the elders.
  footnotes:
  - marker: a
    text: 'Greek tradition reads instead: ''Do not disregard the discourse of the wise, and occupy yourself with their proverbs; for from them you will learn instruction and how to serve great men.'' The Hebrew witness here preserves a different admonition about honoring the aged.'
    reason: alternative_reading
translation:
  language: ko
  text: 늙은 사람을 수치스럽게 하지 마십시오. 당신도 장차 늙은이들 가운데 하나로 شمار될 것을 기억하십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '그리스어 전승은 여기서 다르게 읽습니다: “지혜로운 이들의 말을 무시하지 말고, 그들의 속담 속에 머무르라. 그들에게서 네가 훈계를 배우고 큰 사람들에게 섬기는 법도 배우게 되리니.” 히브리어 증인은 여기서 노인을 공경하라는 다른 권면을 보존합니다.'
    reason: textual_variant
lexical_decisions:
- source_word: אַל תְּבַיֵּשׁ
  english_pob_choice: Do not shame
  chosen_korean: 수치스럽게 하지 마십시오
  alternatives_korean:
  - 부끄럽게 하지 마십시오
  - 모욕하지 마십시오
  - 수치 주지 마십시오
  lexicon: HALOT
  rationale: 피엘형의 causative 의미를 살려 상대에게 수치와 망신을 안기지 말라는 금지로 옮겼습니다. 합쇼체로는 ‘수치스럽게 하지 마십시오’가 가장 직접적이고 자연합니다.
- source_word: אֱנוֹשׁ יָשִׁישׁ
  english_pob_choice: old man
  chosen_korean: 늙은 사람
  alternatives_korean:
  - 늙은이
  - 노인
  - 나이든 사람
  lexicon: HALOT
  rationale: 히브리어는 단수 남성형이지만, 한국어에서는 ‘늙은 사람’이 지나치게 구어적이지 않으면서도 직접적 의미를 잘 드러냅니다. ‘노인’은 다소 제도적·호칭적 뉘앙스가 있어 본문의 직설성을 약화할 수 있습니다.
- source_word: תִמָּנֶה
  english_pob_choice: will be numbered
  chosen_korean: 장차 … 가운데 하나로 شمار될
  alternatives_korean:
  - 장차 … 가운데 하나로 셀
  - 장차 … 가운데 포함될
  - 장차 … 가운데 하나로 계산될
  lexicon: HALOT
  rationale: 패시브형 ‘번호 매겨지다/헤아려지다’의 의미를 살리기 위해 ‘… 가운데 하나로 세어질/헤아려질’ 계열을 택했습니다. 본문에서는 공동체 안의 분류에 들어가게 된다는 뜻을 드러내기 위해 ‘가운데 하나로 شمار될’로 옮겼습니다.
- source_word: מִזְּקֵנִים
  english_pob_choice: among the elders
  chosen_korean: 늙은이들 가운데
  alternatives_korean:
  - 장로들 가운데
  - 어른들 가운데
  - 늙은 사람들 가운데
  lexicon: HALOT
  rationale: 히브리어는 나이든 이들을 가리키는 말로, 여기서는 제도적 ‘장로’보다 연령적 범주가 우선합니다. 따라서 ‘늙은이들 가운데’가 문맥상 가장 직접적입니다.
theological_decisions:
- issue: 히브리어 단수형의 한국어 처리
  chosen_reading: 히브리어의 단수 남성형을 한국어에서도 ‘늙은 사람’으로 구체적으로 유지하되, 뒤에서는 보편적 교훈이 되도록 ‘당신도’로 연결했습니다.
  alternative_readings:
  - 나이든 사람을 수치스럽게 하지 마십시오. 당신도 언젠가 늙을 것입니다.
  rationale: 원문은 한 사람을 직접 겨냥하는 윤리적 권면입니다. 성별·연령의 구체성을 지우지 않으면서도 독자가 자신에게 적용하도록 만드는 구조를 보존했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
- issue: 그리스어 전승과의 관계
  chosen_reading: 본문은 히브리어를 따르고, 그리스어의 다른 교훈은 본문에 섞지 않았습니다.
  alternative_readings:
  - 지혜로운 이들의 말을 무시하지 말고 그들의 속담에 머무르라.
  rationale: 이 절은 히브리어와 그리스어가 내용상 크게 다르므로, 주본문은 히브리어 증거를 따르고 그리스어 전승 차이는 주석적 위치에 남기는 것이 적절합니다.
  doctrine_reference: PHILOSOPHY.md 'What we are translating'
