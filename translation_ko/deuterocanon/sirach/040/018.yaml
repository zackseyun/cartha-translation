translation:
  language: ko
  text: 포도주와 독한 술은 삶을 달게 하지만, 그 둘보다 더 나은 것은 보물을 찾는 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 “포도주와 독한 술은 삶을 달게 하며, 그 둘을 넘어서는 것은 보물을 찾는 것이다”에 가깝습니다. 그리스어 평행본문도 “그 둘보다 위에 있는”이라는 비교의 뜻을 뒷받침합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יין
  english_pob_choice: wine
  chosen_korean: 포도주
  alternatives_korean:
  - 술
  - 와인
  lexicon: HALOT
  rationale: 히브리어 יין은 일반적으로 포도주를 가리키므로, 현대 한국어에서도 직접적이고 표준적인 대응인 포도주를 썼습니다.
- source_word: שכר
  english_pob_choice: strong drink
  chosen_korean: 독주
  alternatives_korean:
  - 진한 술
  - 강한 술
  - 취하게 하는 술
  lexicon: HALOT
  rationale: שכר는 포도주가 아닌 취하게 하는 주류를 넓게 가리키므로, 과도하게 특정하지 않으면서도 대비를 살리는 독주가 적절합니다.
- source_word: ימתקו
  english_pob_choice: sweeten
  chosen_korean: 달콤하게 하다
  alternatives_korean:
  - 달게 하다
  - 즐겁게 하다
  - 맛있게 하다
  lexicon: HALOT
  rationale: מתק의 기본 의미인 '달다/달게 하다'를 살려, 삶을 더 즐겁고 유쾌하게 만든다는 뉘앙스를 자연스럽게 옮겼습니다.
- source_word: ומשניהם
  english_pob_choice: but better than both
  chosen_korean: 그 둘보다 나은 것은
  alternatives_korean:
  - 둘보다 뛰어난 것은
  - 그 둘을 넘어서는 것은
  - 그 둘 위에 있는 것은
  lexicon: HALOT
  rationale: 히브리어의 비교적 의미와 그리스어 ὑπὲρ ἀμφότερα의 평행을 반영해, 단순한 병렬이 아니라 우위 비교로 풀어 옮겼습니다.
theological_decisions:
- issue: 시 40:18의 지혜격 비교문을 한국어에서 어떻게 처리할지
  chosen_reading: 포도주와 독주가 삶을 달콤하게 한다는 진술을 유지하되, 뒤 절의 보물 발견이 그것들을 능가한다는 비교를 분명히 했습니다.
  alternative_readings:
  - 포도주와 독주는 삶을 달게 합니다, 그러나 그 둘보다 더 좋은 것은 보물을 발견하는 것입니다.
  - 포도주와 독주는 삶을 즐겁게 하지만, 그 둘 위에 있는 것은 보물을 찾는 일입니다.
  rationale: 본문의 핵심은 음료의 긍정적 기능과 그보다 더 큰 가치의 대조이므로, 비교 구조를 흐리지 않으면서도 한국어 문장으로 자연스럽게 만들었습니다.
  doctrine_reference: 지혜문학의 비교·가치 판단 표현
