  text: 포도주와 독주는 삶을 달콤하게 하지만, 그 둘보다 나은 것은 보물을 찾는 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 “포도주와 독주는 삶을 달게 한다, 그리고 그 둘을 넘어서는 것은 보물을 찾는 것이다”에 가깝고, 그리스어 평행본문도 “그 둘보다 위에 있는” 비교를 뒷받침합니다.
    reason: lexical_alternative
