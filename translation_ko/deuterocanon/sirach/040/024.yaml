  text: A brother and a companion are for a time of trouble[a], but righteousness delivers more than both.
  footnotes:
  - marker: a
    text: 'Greek parallel: ''and almsgiving/mercy will rescue more than both.'' The Hebrew witness reads ''righteousness'' here.'
    reason: alternative_reading
translation:
  language: ko
  text: 형제와 동료는 어려운 때에 도움이 되지만, 의는 그 둘보다 더 잘 구해 냅니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 병행본문은 ‘자선 또는 긍휼은 그 둘보다 더 잘 구해 낼 것이다’라고 읽습니다. 히브리어 본문은 이곳에서 ‘의’를 읽습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אח
  english_pob_choice: brother
  chosen_korean: 형제
  alternatives_korean:
  - 친족
  - 동족
  - 형제자매
  lexicon: HALOT
  rationale: 히브리어 אח의 기본 의미를 살려 구체적으로 ‘형제’로 옮겼습니다. 문맥상 관계의 긴밀함은 있지만, 의미를 넓혀 일반적 친족으로 바꾸기보다 원의를 유지하는 것이 적절합니다.
- source_word: ושותף
  english_pob_choice: and a companion / partner
  chosen_korean: 한 동료
  alternatives_korean:
  - 한 साथी
  - 한 동반자
  - 한 동역자
  lexicon: HALOT
  rationale: שותף는 함께 몫을 나누는 사람, 공동으로 참여하는 이를 가리키므로 현대 한국어에서는 ‘동료’가 가장 자연스럽고 합쇼체 문장에서도 무난합니다. ‘동반자’는 관계의 정서성이, ‘동역자’는 종교적 색채가 더 강해 문맥을 좁힐 수 있습니다.
- source_word: לעת צרה
  english_pob_choice: for a time of trouble
  chosen_korean: 재난의 때를 위한
  alternatives_korean:
  - 곤란의 때를 위한
  - 환난의 때를 위한
  - 위기의 때를 위한
  lexicon: HALOT
  rationale: לעת צרה는 위기 상황에 유익하다는 뜻이므로 ‘재난의 때’가 현대 독자에게 가장 즉각적이고 넓은 위기감을 전달합니다. ‘환난’은 교회적 어감이 강해 보다 직접적인 표현을 택했습니다.
- source_word: צדק
  english_pob_choice: righteousness
  chosen_korean: 의
  alternatives_korean:
  - 의로움
  - 정의
  - 구제
  lexicon: HALOT
  rationale: 히브리어 צדק의 기본 의미를 한국어 신학 용어인 ‘의’로 간명하게 살렸습니다. 그리스어 병행본문의 ἐλεημοσύνη와의 차이는 주석적 긴장으로 남기되, 본문은 히브리어 증언을 따릅니다.
- source_word: מצלת
  english_pob_choice: delivers
  chosen_korean: 구해냅니다
  alternatives_korean:
  - 건져냅니다
  - 구원합니다
  - 빼냅니다
  lexicon: HALOT
  rationale: 동사는 위험에서 끌어내어 구출하는 뜻이므로 ‘구해냅니다’가 가장 자연스럽고, 구원론적 함의를 과도하게 덧씌우지 않습니다.
theological_decisions:
- issue: 히브리어 צדק과 그리스어 ἐλεημοσύνη의 차이
  chosen_reading: 본문은 히브리어의 ‘의’를 따르되, 그리스어 병행본문의 ‘자선/긍휼’ 대안을 각주로 보존합니다.
  alternative_readings:
  - 구제는 그 둘보다 더 많이 구해냅니다
  - 긍휼은 그 둘보다 더 많이 구해냅니다
  rationale: 살아 있는 히브리어 증언이 있는 지혜문학에서는 히브리어 본문을 우선하되, 그리스어가 윤리적 강조점을 다르게 제시하는 경우 그 차이를 지우지 말아야 합니다. 여기서는 ‘의’와 ‘구제/긍휼’의 긴장이 본문의 해석에 실제로 영향을 주므로 주석적으로 드러냅니다.
  doctrine_reference: 'PHILOSOPHY.md: extant Hebrew priority; DOCTRINE.md: preserve textual/theological tension transparently.'
