lexical_decisions:
- source_word: כל
  english_pob_choice: Everything
  chosen_korean: 모든 것은
  alternatives_korean:
  - 만물은
  - 모든 것이
  lexicon: HALOT
  rationale: 히브리어 כל은 제한 없는 총칭이므로, 사람에 국한하지 않는 중립적 총칭인 ‘모든 것’이 적절합니다.
- source_word: מארץ אל ארץ ישוב
  english_pob_choice: from the earth returns to the earth
  chosen_korean: 땅에서 땅으로 돌아가고
  alternatives_korean:
  - 땅에서 땅으로 돌아가며
  - 땅에서 나와 땅으로 돌아가고
  lexicon: HALOT
  rationale: 출발점과 귀착점을 그대로 살리면서 ‘돌아가다’로 שוב의 반환 의미를 자연스럽게 드러냈습니다.
- source_word: ואשר ממרום אל מרום
  english_pob_choice: and what is from above to what is above
  chosen_korean: 위에서 온 것은 위로 돌아갑니다
  alternatives_korean:
  - 위에서 온 것은 위에서 위로
  - 높은 데서 높은 데로
  lexicon: HALOT
  rationale: מרום의 반복적 수직 이미지를 유지하되, 한국어로는 다소 난해한 ‘위에서 위로’보다 ‘위에서 온 것’과 ‘위로 돌아가다’로 간결하게 살렸습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행문의 차이
  chosen_reading: 본문은 히브리어를 따라 ‘땅에서 땅으로… 위에서 온 것은 위로…’로 번역하고, 그리스어의 ‘물에서 바다로 돌아간다’는 전승은 각주로 처리합니다.
  alternative_readings:
  - 그리스어 병행을 따라 ‘물에서 바다로 돌아간다’로 옮김
  rationale: 이 단락은 사라흐의 현존 히브리어가 우선이며, 그리스어는 중요한 대안 전승이지만 본문을 대체할 정도로 우선시하지 않았습니다.
  doctrine_reference: 'PHILOSOPHY.md: Sirach는 현존 히브리어를 본문으로 번역하되, 그리스어 병행은 주석적 대안으로 보존'
