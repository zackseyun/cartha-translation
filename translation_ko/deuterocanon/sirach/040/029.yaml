base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/040/029.yaml
  text: A man who watches another’s table—his life is not to be counted as life[a]; he defiles his appetite with another man’s delicacies[b], but a man who knows inward restraint will beware.
  footnotes:
  - marker: a
    text: Hebrew 'another’s table'; the Greek likewise has 'a table belonging to another.' The point is dependence on someone else’s provisions, not necessarily a foreign ethnicity.
    reason: lexical_alternative
  - marker: b
    text: 'The Hebrew of the final line is difficult: literally something like ''a man knowing the secret of the inward parts.'' The Greek interprets it as ''a knowledgeable and educated man will guard himself,'' which supports the sense of inward discipline or prudent restraint.'
    reason: alternative_reading
translation:
  language: ko
  text: 남의 상을 바라보는 사람은 — 그의 생명은 생명으로 셈할 수 없습니다[a]. 그는 남의 음식으로 자기의 식욕을 더럽히지만[b], 속을 아는 사람은 스스로 조심할 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘남의 상’을, 그리스어도 ‘다른 이에게 속한 상’을 뜻합니다. 여기서 초점은 민족적 ‘외국인’이 아니라 남의 마련에 의존하는 상태입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 마지막 행은 난해하며, 문자적으로는 ‘내부의 비밀을 아는 사람’에 가깝습니다. 그리스어는 이를 ‘지식 있고 훈련된 사람은 자신을 지킨다’고 풀어 읽어, 내적 절제의 의미를 뒷받침합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: איש
  english_pob_choice: A man
  chosen_korean: 사람
  alternatives_korean:
  - 남자
  - 한 사람
  lexicon: HALOT
  rationale: 히브리어 איש의 대표적 일반인을 한국어 현대문체로 자연스럽게 옮기기 위해 ‘사람’을 택했습니다.
- source_word: שלחן זר
  english_pob_choice: another’s table
  chosen_korean: 남의 상
  alternatives_korean:
  - 다른 사람의 상
  - 낯선 이의 상
  - 외인의 상
  lexicon: HALOT
  rationale: זר의 핵심은 민족적 ‘이방’보다 소유가 다른 ‘남의’라는 점이므로, 지혜문맥에 맞게 ‘남의 상’으로 옮겼습니다.
- source_word: אין חייו למנות חיים
  english_pob_choice: his life is not to be counted as life
  chosen_korean: 그의 생명은 생명으로 셈할 수 없습니다
  alternatives_korean:
  - 그의 생명은 생명으로 치지 못합니다
  - 그는 생명다운 생명을 지니지 못합니다
  lexicon: HALOT
  rationale: ‘생명’ 반복을 살려 히브리어의 강조와 말맛을 유지하면서, 현대 한국어로도 자연스러운 부정 가능형으로 처리했습니다.
- source_word: מעוג לנפש מטעמו / ἐδέσμασιν ἀλλοτρίοις
  english_pob_choice: he defiles his appetite with another man’s delicacies
  chosen_korean: 남의 음식으로 자기의 식욕을 더럽히지만
  alternatives_korean:
  - 남의 진미로 자기의 욕구를 더럽히지만
  - 남의 음식으로 자기의 배를 더럽히지만
  lexicon: HALOT
  rationale: 히브리어와 그리스어가 모두 ‘남의 음식/진미’ 쪽을 가리키므로 이를 살리고, נפש는 식사 맥락에서 ‘식욕’으로 옮겨 과도한 영혼화 해석을 피했습니다.
- source_word: לאיש יודע סוד מעים
  english_pob_choice: a man who knows inward restraint will beware
  chosen_korean: 속을 아는 사람은 스스로 조심할 것입니다
  alternatives_korean:
  - 내면의 비밀을 아는 사람은 스스로 지킬 것입니다
  - 장부 속 사정을 아는 사람은 조심할 것입니다
  lexicon: HALOT
  rationale: 히브리어 구절이 난해하고 그리스어가 ‘지식 있고 훈련된 사람은 자신을 지킨다’고 해석하므로, ‘속을 아는’으로 내부 자각의 뜻을 살려 과도한 의역을 피했습니다.
theological_decisions:
- issue: נפש의 번역 범위
  chosen_reading: 여기서는 נפש를 ‘식욕’으로 옮겨 음식과 관련된 신체적/욕구적 의미를 드러냈습니다.
  alternative_readings:
  - ‘영혼’으로 옮기기
  - ‘자기 자신’으로 옮기기
  rationale: 문맥이 식탁과 음식이므로 נפש을 곧바로 영혼으로 좁히면 의미가 흐려집니다. POB의 영어도 appetite를 택해 이 긴장을 반영합니다.
  doctrine_reference: 문맥 우선의 의미역 원칙
- issue: 마지막 행의 난해한 히브리어 처리
  chosen_reading: ‘속을 아는 사람’으로 비교적 절제된 직역을 택해, 히브리어의 내부-자각 이미지를 보존했습니다.
  alternative_readings:
  - 그리스어를 따라 ‘분별 있는 사람은 조심할 것입니다’로 평준화하기
  - ‘내면 절제’를 명시적으로 삽입하기
  rationale: 본절은 히브리어와 그리스어가 서로 다른 뉘앙스를 가지므로, 한쪽을 완전히 지우지 않기 위해 중간 수준의 표현을 선택했습니다.
  doctrine_reference: 본문의 이중 전승 존중
