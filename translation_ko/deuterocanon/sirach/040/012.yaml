  text: Every gift and injustice will be wiped away[b][a], but faith will stand forever.
  footnotes:
  - marker: a
    text: Or 'faithfulness will stand forever.' The Greek word can denote either faith or faithfulness; the main text follows the project's default rendering for πίστις.
    reason: alternative_reading
  - marker: b
    text: The older Masada Hebrew witness appears to reflect a reading related to 'loan' where the Greek has 'gift.' The main text follows the Zone 1 Greek source (δῶρον), but the Hebrew evidence suggests an ancient variation in the underlying text.
    reason: textual_variant
translation:
  language: ko
  text: 모든 선물[b]과 불의는 지워질 것이지만, 믿음[a]은 영원히 설 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘신실함은 영원히 설 것입니다.’ 그리스어 πίστις는 ‘믿음’과 ‘신실함’을 모두 뜻할 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 더 오래된 마사다 히브리어 증언은 그리스어의 ‘선물’과 달리 ‘빌려 줌’과 관련된 읽기를 반영하는 것으로 보입니다. 본문은 그리스어 δῶρον을 따릅니다.
    reason: textual_variant
lexical_decisions:
- source_word: πᾶν δῶρον
  english_pob_choice: Every gift
  chosen_korean: 모든 선물
  alternatives_korean:
  - 모든 예물
  - 모든 증여
  - 모든 선물과 뇌물
  lexicon: LSJ
  rationale: πᾶν의 분배적 의미를 살려 ‘모든’으로 옮기고, δῶρον은 기본 의미인 ‘선물’이 가장 직접적이어서 이를 택했습니다. 이 문맥에서 ‘예물’은 종교적 뉘앙스를, ‘뇌물’은 원문에 없는 해석을 과도하게 더할 수 있습니다.
- source_word: ἀδικία
  english_pob_choice: injustice
  chosen_korean: 불의
  alternatives_korean:
  - 부정의
  - 불의함
  - 불법
  lexicon: LSJ
  rationale: 지혜문학 문맥에서 ἀδικία는 단순한 도덕적 잘못보다 올바름의 반대편에 있는 상태를 넓게 가리키므로, 한국어로는 간결하고 포괄적인 ‘불의’가 적절합니다.
- source_word: ἐξαλειφθήσεται
  english_pob_choice: will be wiped away
  chosen_korean: 지워질 것입니다
  alternatives_korean:
  - 말소될 것입니다
  - 닦여 없어질 것입니다
  - 지워질 것입니다
  lexicon: LSJ
  rationale: 이 동사는 제거·말소의 이미지를 가지며, 현대 한국어에서 자연스러운 ‘지워질 것입니다’가 그 소멸감을 잘 살립니다.
- source_word: πίστις
  english_pob_choice: faith
  chosen_korean: 믿음
  alternatives_korean:
  - 신실함
  - 신뢰
  - 믿음
  lexicon: LSJ
  rationale: 이 프로젝트의 기본어휘에 따라 πίστις는 मुख्य 본문에서 ‘믿음’으로 유지했습니다. ‘신실함’도 가능하지만, 본문은 별도 주석으로 그 대안을 남기는 편이 더 투명합니다.
- source_word: στήσεται
  english_pob_choice: will stand
  chosen_korean: 서 있을 것입니다
  alternatives_korean:
  - 굳게 설 것입니다
  - 남아 있을 것입니다
  - 서 있을 것입니다
  lexicon: LSJ
  rationale: στήσεται의 핵심 이미지는 ‘서다’이므로, 지속성과 견고함을 함께 담는 ‘서 있을 것입니다’를 택했습니다.
theological_decisions:
- issue: πίστις의 의미 범위
  chosen_reading: 본문은 ‘믿음’으로 번역하되, 의미상 ‘신실함’ 가능성은 각주로 남깁니다.
  alternative_readings:
  - 신실함
  - 신뢰
  rationale: 지혜문학의 일반적 덕목 맥락에서는 ‘신실함’이 자연스럽지만, 바탕 규정상 πίστις의 기본 대응어는 ‘믿음’입니다. 따라서 본문은 기본어를 따르고, 독자가 의미 폭을 확인할 수 있도록 대안을 주석에 표시합니다.
  doctrine_reference: 'DOCTRINE.md의 πίστις 기본 대응어: 믿음; 대안: 신실함, 신뢰'
