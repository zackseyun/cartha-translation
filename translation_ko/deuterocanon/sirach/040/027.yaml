  rationale: 이 절의 현존 히브리어 증거는 אֱלֹהִים('하나님')이며, 프로젝트 원칙상 사본이 남아 있는 원어 증거를 우선합니다. 그리스어 병행본문의 κύριος는 참고로만 반영했습니다.
