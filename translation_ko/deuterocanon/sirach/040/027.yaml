  text: The fear of God is like a garden of blessing[b][a], and it shelters more than any glory.
  footnotes:
  - marker: a
    text: Hebrew 'like Eden of blessing'; the Greek parallel reads 'like a paradise of blessing.' The translation uses 'garden' to convey the Eden/paradise image in clear English.
    reason: lexical_alternative
  - marker: b
    text: 'The final clause is difficult in concise Hebrew. The Greek parallel supports the sense of protective covering: ''and it covered him more than any glory.'''
    reason: alternative_reading
translation:
  language: ko
  text: 하나님을 두려워하는 것은 복의 동산 같고, 모든 영광보다 그를 덮어 줍니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 '복의 에덴'에 가깝고, 그리스어 병행본문은 '복의 낙원'으로 읽습니다. 한국어에서는 두 이미지를 함께 살리기 위해 '복의 동산'으로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 마지막 절은 히브리어 표현이 간결하여 난해하지만, 그리스어 병행본문은 보호적 '덮음'의 뜻을 분명히 보여 줍니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יִרְאַת אֱלֹהִים / φόβος Κυρίου
  english_pob_choice: the fear of God
  chosen_korean: 하나님을 두려워하는 것
  alternatives_korean:
  - 주님을 두려워하는 것
  - 하나님에 대한 경외
  lexicon: HALOT / LXX parallel
  rationale: 히브리어 본문은 אֱלֹהִים('하나님')을 직접 쓰므로 기본 번역도 그 표지를 살렸습니다. '두려워하는 것'은 성경적 관용구의 긴장을 유지하고, '경외'는 의미는 맞지만 두려움의 요소를 약화시킬 수 있습니다.
- source_word: כְּעֵדֶן בְּרָכָה
  english_pob_choice: like a garden of blessing
  chosen_korean: 복의 동산 같고
  alternatives_korean:
  - 복의 에덴 같고
  - 복의 낙원 같고
  lexicon: HALOT / Greek παράδεισος
  rationale: 히브리어 כעדן은 에덴/낙원의 이미지를 가리키며, 그리스어 параδεισος도 이를 뒷받침합니다. 한국어에서는 독자가 즉시 이미지와 의미를 잡도록 '동산'을 택하되, 원문의 에덴적 뉘앙스는 유지했습니다.
- source_word: וְעַל כָּל כָּבוֹד
  english_pob_choice: more than any glory
  chosen_korean: 모든 영광보다
  alternatives_korean:
  - 어떤 영광보다
  - 모든 영예보다
  lexicon: HALOT / Greek ὑπὲρ πᾶσαν δόξαν
  rationale: 비교적 '보다'로 옮겨 원문의 우월 비교를 자연스럽게 드러냈습니다. '영광'은 히브리어 כָּבוֹד과 그리스어 δόξα의 기본 대응을 유지합니다.
- source_word: חָפְתָה / ἐκάλυψαν αὐτόν
  english_pob_choice: it shelters / it covered him
  chosen_korean: 그를 덮어 줍니다
  alternatives_korean:
  - 그를 보호합니다
  - 그를 가려 줍니다
  lexicon: HALOT / Greek parallel
  rationale: 히브리어는 보호적 '덮음'의 이미지를, 그리스어는 '그를 덮었다'를 지지합니다. 한국어에서는 능동적으로 풀어 의미를 선명하게 하되, 물리적·상징적 보호의 이중 의미를 유지했습니다.
theological_decisions:
