  terminology: ‘뻔뻔한 사람’은 ἀναιδής의 도덕적 뉘앙스를 적절히 전달합니다. 각주 a는 히브리어의 난해함과 그리스어의 실제 표현을 보다 중립적이고 정확하게 밝혀야 하며, 각주 표지는 해당 어구 바로 뒤에 두는 것이 바람직합니다.
