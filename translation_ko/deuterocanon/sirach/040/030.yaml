  source_fidelity: 본문의 ‘뻔뻔한 사람’과 ‘구걸’은 난해한 히브리어를 그리스어 병행문에 비추어 이해한 영어 POB의 선택을 충실히 반영합니다. 다만 마지막 절의 ‘그 속에서는’은 선행 명사인 ‘구걸’을 받을 여지가 있어, 히브리어 בקרבו 및 그리스어 αὐτοῦ가 가리키는 사람의 내면을 명시하는 편이 정확합니다.
