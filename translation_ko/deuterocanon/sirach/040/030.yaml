  text: For a shameless man, begging is sweet, but within him it burns like fire.
  footnotes:
  - marker: a
    text: Hebrew literally, 'for a man of strong spirit/soul'; the Greek parallel reads 'in the mouth of a shameless person,' supporting the sense 'shameless man.'
    reason: alternative_reading
  - marker: b
    text: Or 'asking/requesting is sweet.' The Greek parallel more specifically suggests 'begging' or 'alms-seeking.'
    reason: lexical_alternative
translation:
  language: ko
  text: 뻔뻔한 사람에게는[a] 구걸이[b] 달게 느껴지지만, 그의 속에서 그것이 불처럼 타오릅니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘강한 영/혼의 사람’에 가깝습니다. 그리스어 병행문은 ‘뻔뻔한 사람의 입에서’라고 읽습니다.
    reason: source_note
  - marker: b
    text: 히브리어 שאלה는 ‘요청’ 또는 ‘묻기’를 뜻할 수도 있으나, 그리스어 병행문은 더 구체적으로 ‘구걸’ 또는 ‘구걸함’의 뜻을 지지합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לאיש עוז נפש
  english_pob_choice: for a shameless man
  chosen_korean: 뻔뻔한 사람에게는
  alternatives_korean:
  - 강한 사람에게는
  - 대담한 사람에게는
  - 담대한 사람에게는
  lexicon: HALOT
  rationale: 히브리어를 문자적으로 옮기면 ‘강한 영/혼의 사람’이지만, 병행하는 그리스어가 ‘뻔뻔한 사람의 입에서’로 읽혀 이 말의 뜻을 도덕적 뻔뻔함으로 이해하게 합니다.
- source_word: תמתיק שאלה
  english_pob_choice: begging is sweet
  chosen_korean: 구걸이 달게 느껴지지만
  alternatives_korean:
