  text: For a shameless man, begging is sweet, but within him it burns like fire.
  footnotes:
  - marker: a
    text: Hebrew literally, 'for a man of strong spirit/soul'; the Greek parallel reads 'in the mouth of a shameless person,' supporting the sense 'shameless man.'
    reason: alternative_reading
  - marker: b
    text: Or 'asking/requesting is sweet.' The Greek parallel more specifically suggests 'begging' or 'alms-seeking.'
    reason: lexical_alternative
translation:
  language: ko
  text: 뻔뻔한 사람에게는 구걸이 달게 느껴지지만, 그 속에서는 불처럼 타오릅니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘강한 영/혼의 사람’에 가깝지만, 그리스어 병행문은 ‘뻔뻔한 사람’으로 읽게 합니다.
    reason: source_note
  - marker: b
    text: 히브리어 שאלה는 ‘요청/묻기’도 뜻할 수 있으나, 그리스어 병행문은 더 구체적으로 ‘구걸’의 뜻을 지지합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לאיש עוז נפש
  english_pob_choice: for a shameless man
  chosen_korean: 뻔뻔한 사람에게는
  alternatives_korean:
  - 강한 사람에게는
  - 대담한 사람에게는
  - 담대한 사람에게는
  lexicon: HALOT
  rationale: 히브리어를 문자적으로 옮기면 ‘강한 영/혼의 사람’이지만, 병행하는 그리스어가 ‘뻔뻔한 사람의 입에서’로 읽혀 이 말의 뜻을 도덕적 뻔뻔함으로 이해하게 합니다.
- source_word: תמתיק שאלה
  english_pob_choice: begging is sweet
  chosen_korean: 구걸이 달게 느껴지지만
  alternatives_korean:
  - 요청이 달게 느껴지지만
  - 묻는 것이 달게 느껴지지만
  - 구걸이 달콤하지만
  lexicon: HALOT
  rationale: שאלה는 ‘요청/묻기’가 가능하지만, 그리스어 ἐπαίτησις가 가리키는 맥락상 ‘구걸’이 더 정확합니다. ‘달게 느껴지다’는 은유를 자연스럽게 살립니다.
- source_word: ובקרבו
  english_pob_choice: but within him
  chosen_korean: 그 속에서는
  alternatives_korean:
  - 그 안에서는
  - 내면에서는
  - 배 속에서는
  lexicon: HALOT
  rationale: קרב은 내면을 가리킬 수 있으며, 여기서는 겉으로 달게 여기는 태도와 대비되는 내부의 상태를 한국어로 자연스럽게 드러내는 표현이 적절합니다.
- source_word: תבער כמו אש
  english_pob_choice: it burns like fire
  chosen_korean: 불처럼 타오릅니다
  alternatives_korean:
  - 불같이 탑니다
  - 불처럼 활활 탑니다
  - 불처럼 타게 됩니다
  lexicon: HALOT
  rationale: 직유 ‘~처럼 אש’의 강한 이미지와 내부의 고통을 살리기 위해 ‘타오르다’를 택했습니다. ‘불같이’보다 현대어로 더 선명합니다.
theological_decisions:
- issue: לאיש עוז נפש의 의미를 ‘강한 사람’으로 볼지 ‘뻔뻔한 사람’으로 볼지
  chosen_reading: 병행 히브리어의 문자성보다, 그리스어 병행문의 해석을 따라 도덕적 뻔뻔함/대담한 구걸 태도로 읽었습니다.
  alternative_readings:
  - 강한 사람
  - 대담한 사람
  - 담대한 사람
  rationale: 이 속담은 구걸의 심리를 비판하는 문맥이므로, 긍정적 강인함보다 무례한 대담함이 더 적절합니다. 다만 히브리어 표면형의 난점을 숨기지 않기 위해 다른 가능성은 남겨 둡니다.
  doctrine_reference: 원문 우선 + 병행본문 보조 해석 원칙
