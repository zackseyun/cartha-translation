translation:
  language: ko
  text: 금과 은이 발을 든든하게 세워 줍니다[a]. 그러나 그 둘보다 더 나은 것은 좋은 조언입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로는 “금과 은이 발을 서게 한다, 그리고 그 둘보다 좋은 조언”에 가깝습니다. 그리스어 병행본도 “금과 은이 발을 세우고, 그 둘보다 지혜로운 조언…”의 뜻을 보강합니다.
    reason: lexical_alternative
