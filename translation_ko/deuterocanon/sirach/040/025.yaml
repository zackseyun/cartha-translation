translation:
  language: ko
  text: 금과 은은 발을 굳게 세워 줍니다[a]. 그러나 그 둘보다 더 나은 것은 좋은 조언입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 “금과 은이 발을 굳게 세우고, 그 둘보다 좋은 조언”이라고 합니다. 두 번째 절에는 동사가 생략되어 있습니다. 그리스어 병행본도 “금과 은이 발을 세우며, 그 둘보다 조언이 더 높이 평가된다”라고 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: זהב וכסף
  english_pob_choice: gold and silver
  chosen_korean: 금과 은
  alternatives_korean:
  - 황금과 은
  - 금과 은화
  lexicon: HALOT
  rationale: 히브리어의 상투적 재물 병렬을 자연스러운 현대 한국어로 옮기되, 원문의 두 재료 병렬을 그대로 보존했습니다.
- source_word: יעמידו רגל
  english_pob_choice: make the foot stand firm
  chosen_korean: 발을 든든하게 세워 줍니다
  alternatives_korean:
  - 발을 굳게 세워 줍니다
  - 발이 서게 합니다
  - 발을 안정되게 합니다
  lexicon: HALOT
  rationale: 직역하면 '발을 서게 하다'이지만, 한국어에서는 '든든하게 세우다'가 발의 안정과 지지라는 관용적 의미를 더 자연스럽게 전달합니다.
- source_word: ומשניהם
  english_pob_choice: but better than both
  chosen_korean: 그러나 그 둘보다 더 나은 것은
  alternatives_korean:
  - 그리고 그 둘보다 뛰어난 것은
  - 그 둘보다 더 좋은 것은
  lexicon: HALOT
  rationale: 히브리어의 비교 구문을 한국어에서 명시적으로 풀어, 금·은보다 우월한 대상이 뒤에 온다는 대비를 분명히 했습니다.
- source_word: עצה טובה
  english_pob_choice: sound counsel
  chosen_korean: 좋은 조언
  alternatives_korean:
  - 훌륭한 조언
  - 지혜로운 조언
  - 건전한 조언
  lexicon: HALOT
  rationale: טובה의 기본 의미인 '좋은'을 우선 살리면서, 잠언적 문맥에서 값비싼 재물보다 나은 실천적 조언을 담게 했습니다.
