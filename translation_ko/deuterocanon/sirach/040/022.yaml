base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/040/022.yaml
  text: Grace and beauty delight the eye[b][a], and better than both is the vegetation of the field.
  footnotes:
  - marker: a
    text: Hebrew 'form/appearance' with Greek parallel 'grace'; the line may be rendered 'Beauty and appearance delight the eye.'
    reason: lexical_alternative
  - marker: b
    text: The Hebrew says 'sprouts/growths of a field'; the Greek parallel reads 'green growth of seed/crop,' supporting the sense of fresh field vegetation rather than harvested produce.
    reason: alternative_reading
translation:
  language: ko
  text: 아름다움과 고운 용모는 눈을 즐겁게 하고, 둘보다 나은 것은 들의 푸른 싹입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘형태/모습’ 쪽 의미를 가질 수 있으며, 그리스어 평행구는 ‘은혜’에 해당하는 미적 매력을 보여 줍니다. 따라서 ‘아름다움과 고운 용모’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘밭의 싹/자람들’을 뜻하며, 그리스어 평행구도 수확물보다 신선한 들의 푸른 성장을 가리킵니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יפי
  english_pob_choice: beauty
  chosen_korean: 아름다움
  alternatives_korean:
  - 아리따움
  - 아름답움
  - 미모
  lexicon: HALOT
  rationale: 히브리어 יפי는 외모의 아름다움/매력을 가리키므로, 현대적이고 자연스러운 표준어인 ‘아름다움’으로 옮겼습니다.
- source_word: ותאר
  english_pob_choice: grace
  chosen_korean: 고운 용모
  alternatives_korean:
  - 은총
  - 형태
  - 외모
  lexicon: HALOT
  rationale: 문자적으로는 ‘모습/형태’ 쪽이지만, 본문 평행구와 영어 POB의 주석이 보여 주듯 미적 매력의 범주로 읽히므로, 지나치게 신학화하지 않고 ‘고운 용모’로 풀었습니다.
- source_word: יחמידו עין
  english_pob_choice: delight the eye
  chosen_korean: 눈을 즐겁게 하고
  alternatives_korean:
  - 눈이 탐내고
  - 눈이 바라보고
  - 눈을 끌고
  lexicon: HALOT
  rationale: חמד 동사의 ‘갈망하다’ 뉘앙스는 있으나, 지혜 문맥에서는 시각적 매력을 뜻하므로 ‘눈을 즐겁게 하다’가 한국어에서 가장 자연스럽고 의미도 잘 보존합니다.
- source_word: צמחי שדה
  english_pob_choice: the vegetation of the field / the green growth of a field
  chosen_korean: 들의 푸른 싹
  alternatives_korean:
  - 밭의 채소
  - 들의 식물
  - 들판의 푸른 초목
  lexicon: HALOT
  rationale: 히브리어는 ‘싹/자람’의 이미지를, 그리스어는 신선한 푸른 성장의 이미지를 지지하므로, 수확물보다 ‘푸른 싹’으로 옮겨 생기 있는 들의 초목 이미지를 살렸습니다.
