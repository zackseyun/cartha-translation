  english_pob_choice: the vegetation of the field / the green growth of a field
  chosen_korean: 들의 푸른 싹
  alternatives_korean:
  - 밭의 채소
  - 들의 식물
  - 들판의 푸른 초목
  lexicon: HALOT
  rationale: 히브리어는 ‘싹/자람’의 이미지를, 그리스어는 신선한 푸른 성장의 이미지를 지지하므로, 수확물보다 ‘푸른 싹’으로 옮겨 생기 있는 들의 초목 이미지를 살렸습니다.
