  lexicon: HALOT
  rationale: חמד 동사의 ‘갈망하다’ 뉘앙스는 있으나, 지혜 문맥에서는 시각적 매력을 뜻하므로 ‘눈을 즐겁게 하다’가 한국어에서 가장 자연스럽고 의미도 잘 보존합니다.
