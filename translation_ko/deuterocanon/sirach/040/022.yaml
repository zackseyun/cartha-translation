  lexicon: HALOT
  rationale: 문자적으로는 ‘모습/형태’ 쪽이지만, 본문 평행구와 영어 POB의 주석이 보여 주듯 미적 매력의 범주로 읽히므로, 지나치게 신학화하지 않고 ‘고운 용모’로 풀었습니다.
