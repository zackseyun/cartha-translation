  text: Grace and beauty delight the eye[b][a], and better than both is the vegetation of the field.
  footnotes:
  - marker: a
    text: Hebrew 'form/appearance' with Greek parallel 'grace'; the line may be rendered 'Beauty and appearance delight the eye.'
    reason: lexical_alternative
  - marker: b
    text: The Hebrew says 'sprouts/growths of a field'; the Greek parallel reads 'green growth of seed/crop,' supporting the sense of fresh field vegetation rather than harvested produce.
    reason: alternative_reading
translation:
  language: ko
  text: 아름다움과 용모[a]는 눈을 즐겁게 하고, 이 둘보다 나은 것은 밭의 푸른 초목[b]입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘형태/모습/용모’를 뜻할 수 있습니다. 그리스어 평행구는 ‘은혜/매력과 아름다움’으로 읽히므로, 이 표현은 넓게 미적 매력을 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘밭의 식물들/돋아나는 것들’을 뜻합니다. 그리스어 평행구도 수확한 산물보다는 씨 뿌린 밭의 신선한 푸른 초목을 가리킵니다.
    reason: alternative_reading
