base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/040/028.yaml
  text: My child[a], do not live the life of a beggar[b]; it is better to die than to beg.
  footnotes:
  - marker: a
    text: Hebrew reads literally something like 'the life of מכי מתן'; the expression is difficult, but the Greek parallel clarifies the sense as living by begging or alms-seeking.
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew ''to be gathered'' is an idiom for death; compare the Greek parallel, which states the sense explicitly: ''to die.'''
    reason: alternative_reading
translation:
  language: ko
  text: 내 아들아[a], 구걸로 연명하는 삶을 살지 마십시오.[b] 구걸하는 것보다 죽는 편이 더 낫습니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘내 아들아’는 현존 히브리어 본문에는 없으나, 그리스어 평행본문의 호격 ‘아이야’(τέκνον)에 근거합니다.
    reason: source_note
  - marker: b
    text: 히브리어의 ‘מכי מתן’은 해석이 어려운 표현입니다. 그리스어 평행본문은 이를 구걸하거나 구걸로 사는 것으로 분명히 이해합니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 ‘נאסף’는 문자적으로 ‘거두어지다’이지만, 여기서는 죽음을 가리키는 관용어입니다. 그리스어 평행본문도 ‘죽다’라고 명시합니다.
    reason: alternative_reading
