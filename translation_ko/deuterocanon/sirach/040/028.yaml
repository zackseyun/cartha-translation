  - 아들아
  - 내 아이야
  lexicon: BDAG
  rationale: 지혜문학의 직접 호명으로서 친밀하고 권면적인 호격을 살리되, 한국어에서는 자연스러운 대화체보다 문학적 호명인 ‘내 아들아’가 가장 근접합니다.
- source_word: זּוֹת? חיי
  english_pob_choice: the life of
  chosen_korean: 삶
  alternatives_korean:
