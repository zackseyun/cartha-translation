  - 인생
  - 생계
  lexicon: HALOT
  rationale: 구체적 삶의 방식이나 상태를 가리키는 표현이므로 단순한 ‘인생’보다 ‘삶’이 간결하고 원문의 조건적 의미를 잘 드러냅니다.
- source_word: מכי מתן / ἐπαιτήσεως
  english_pob_choice: beggar
  chosen_korean: 거지의 삶
  alternatives_korean:
  - 구걸하는 삶
  - 구걸로 사는 삶
  - 구걸하는 자의 삶
  lexicon: HALOT/Greek parallel
  rationale: 히브리어 표현이 난해하지만 그리스어 평행본문이 ‘구걸’의 의미를 분명히 하므로, 본문 전체의 관용적 의미를 살려 ‘거지의 삶’으로 옮겼습니다.
- source_word: נאסף
  english_pob_choice: to die
  chosen_korean: 죽는 편이 더 낫습니다
  alternatives_korean:
  - 죽는 것이 더 낫습니다
  - 죽는 것이 낫습니다
  - 죽는 편이 좋습니다
  lexicon: HALOT
  rationale: 직역하면 ‘모이다/거두어지다’이지만 이 표현은 죽음을 뜻하는 관용구이므로, 한국어에서는 관용적 의미를 풀어 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 죽음을 뜻하는 관용어의 처리
  chosen_reading: ‘거두어지다’의 문자성을 살리지 않고 ‘죽는 편이 더 낫습니다’로 의미 번역했습니다.
  alternative_readings:
  - 죽는 것이 더 낫습니다
  - 거두어지는 것이 더 낫습니다
  rationale: 이 구절의 강조점은 죽음 자체가 아니라 구걸로 사는 삶의 비참함과 그보다 나은 선택을 대비하는 데 있으므로, 한국어 독자가 즉시 이해할 수 있는 관용적 의미를 택했습니다.
  doctrine_reference: 잠언적 지혜문학의 수사와 의미 전달
