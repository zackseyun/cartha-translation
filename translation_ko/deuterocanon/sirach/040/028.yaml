  naturalness: ‘거지의 삶을 살지 말아라’는 ‘삶을 살다’의 중복감이 있고, ‘말아라’와 ‘낫습니다’가 한 절 안에서 합쇼체와 해라체를 혼용합니다. ‘구걸로 연명하는 삶을 살지 마십시오’는 현대 표준어 합쇼체로 자연스럽고 의미도 더 정확합니다.
