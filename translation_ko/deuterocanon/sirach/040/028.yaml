base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/040/028.yaml
  text: My child[a], do not live the life of a beggar[b]; it is better to die than to beg.
  footnotes:
  - marker: a
    text: Hebrew reads literally something like 'the life of מכי מתן'; the expression is difficult, but the Greek parallel clarifies the sense as living by begging or alms-seeking.
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew ''to be gathered'' is an idiom for death; compare the Greek parallel, which states the sense explicitly: ''to die.'''
    reason: alternative_reading
translation:
  language: ko
  text: 내 아들아, 거지의 삶을 살지 말아라. 구걸하는 것보다 죽는 편이 더 낫습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 난해한 표현은 그리스어 평행본문이 ‘구걸하다’는 뜻으로 분명하게 해석해 줍니다.
    reason: source_note
  - marker: b
    text: 히브리어 נאסף는 문자적으로는 ‘거두어지다’이지만, 이 문맥에서는 죽음을 뜻하는 관용어입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: τέκνον
  english_pob_choice: My child
  chosen_korean: 내 아들아
  alternatives_korean:
