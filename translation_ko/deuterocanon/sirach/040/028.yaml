  rationale: 이 구절의 강조점은 죽음 자체가 아니라 구걸로 사는 삶의 비참함과 그보다 나은 선택을 대비하는 데 있으므로, 한국어 독자가 즉시 이해할 수 있는 관용적 의미를 택했습니다.
