  language: ko
  text: 마치 시냇가에 심은 덤불처럼, 그들은 모든 비 앞에서 말라 버립니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 כקרדמות는 형태와 뜻이 불확실하며, 그리스어 평행본문은 물가의 연약한 식생이 쉽게 뽑히는 이미지를 보여 줍니다.
    reason: lexical_alternative
  - marker: b
    text: 이 지점은 마소라 계열 히브리어 전승과 그리스어 평행본문 사이에 표현 차이가 있어, 본문은 카이로 게니자 계열 히브리어를 따랐습니다.
    reason: textual_variant
