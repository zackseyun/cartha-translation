  - marker: b
    text: The older Masada witness appears to preserve a substantially different reading at this point than the Cairo Geniza Hebrew used here; because the Zone 1 Hebrew is our primary text and the surviving Masada excerpt is fragmentary in this prompt, the main translation follows the Cairo reading while acknowledging textual uncertainty.
    reason: textual_variant
translation:
  language: ko
  text: 마치 시냇가에 심긴 덤불처럼, 그들은 비가 내리기 전에 말라 버립니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 כקרדמות는 형태와 뜻이 불확실합니다. 그리스어 평행본문은 물가와 강둑의 식생이 쉽게 뽑히는 이미지를 보여 줍니다. 여기서 ‘덤불’은 정확한 식물 이름을 단정하지 않고 연약한 자생 식생의 이미지를 반영한 것입니다.
    reason: lexical_alternative
  - marker: b
    text: 이 지점에서 더 오래된 마사다 증인은 여기서 따르는 카이로 게니자 히브리어 본문과 상당히 다른 독법을 보이는 듯합니다. 그러나 마사다 단편은 불완전하므로, 본문은 카이로 게니자 계열 히브리어를 따르면서 이 본문상의 불확실성을 함께 밝힙니다.
    reason: textual_variant
