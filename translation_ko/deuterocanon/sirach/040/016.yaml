  text: Like brushwood on a streamside planting[b][a], before every rain they are dried up.
  footnotes:
  - marker: a
    text: Hebrew כקרדמות is uncertain; the Greek parallel has imagery of growth by water and a riverbank that is quickly pulled up. The translation 'brushwood' reflects fragile scrub growth rather than a precise plant identification.
    reason: lexical_alternative
  - marker: b
    text: The older Masada witness appears to preserve a substantially different reading at this point than the Cairo Geniza Hebrew used here; because the Zone 1 Hebrew is our primary text and the surviving Masada excerpt is fragmentary in this prompt, the main translation follows the Cairo reading while acknowledging textual uncertainty.
    reason: textual_variant
