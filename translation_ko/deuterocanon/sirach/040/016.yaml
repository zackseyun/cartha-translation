  text: Like brushwood on a streamside planting[b][a], before every rain they are dried up.
  footnotes:
  - marker: a
    text: Hebrew כקרדמות is uncertain; the Greek parallel has imagery of growth by water and a riverbank that is quickly pulled up. The translation 'brushwood' reflects fragile scrub growth rather than a precise plant identification.
