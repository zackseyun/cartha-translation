  chosen_korean: 친구
  alternatives_korean:
  - 벗
  - 동무
  - 친지
  lexicon: HALOT
  rationale: 앞의 עמית과 짝을 이루는 두 번째 관계어이므로, 보다 일반적이고 구별되는 한국어인 '친구'로 옮겼습니다.
- source_word: לעת
  english_pob_choice: for a time
  chosen_korean: 한때
  alternatives_korean:
  - 잠시
  - 한동안
  - 때에 맞게
  lexicon: HALOT
  rationale: 히브리어의 시간 제한성을 간결하게 살리되, 단순한 '때에 맞게'보다 지속 기간의 짧음을 드러내는 '한때'를 택했습니다.
- source_word: משניהם
  english_pob_choice: better than both
  chosen_korean: 그 둘보다 나은 것은
  alternatives_korean:
  - 둘 다보다 더 좋은 것은
  - 둘보다 더 낫습니다
  lexicon: HALOT
  rationale: 비교 우위를 명시적으로 드러내어, 본문의 대조 구조를 한국어에서 자연스럽게 재현했습니다.
- source_word: אשה משכלת
  english_pob_choice: an intelligent wife
  chosen_korean: 분별력 있는 아내
  alternatives_korean:
  - 지혜로운 아내
  - 슬기로운 아내
  - 총명한 아내
  lexicon: HALOT
  rationale: אשה는 여기서 결혼 관계를 가리키는 것으로 이해하는 영어 주석을 따르고, משכלת는 단순 지능보다 실천적 분별을 뜻하므로 '분별력 있는'으로 옮겼습니다.
theological_decisions:
- issue: אשה의 의미를 '여자'로 둘지 '아내'로 둘지
  chosen_reading: 아내
  alternative_readings:
  - 여자
  rationale: 히브리어만 보면 '여자'도 가능하지만, 병행하는 그리스어가 혼인 관계를 더 분명히 가리키므로 본문 의미를 따라 '아내'로 번역했습니다.
  doctrine_reference: 원어 우선과 병행본문 참조라는 번역 원칙
