  source_fidelity: ‘유익하지만’은 히브리어 ינהגו가 나타내는 관계의 행위·지속을 ‘유용함’이라는 가치 판단으로 구체화하여, 원문의 표현보다 해석적입니다. ‘한동안 함께하지만’은 관계를 이어 가는 뜻을 자연스럽게 나타내면서도 이 동사의 정확한 뉘앙스를 과도하게 확정하지 않습니다. ‘아내’는 히브리어 אשה의 가능한 의미이며, ‘여자와 남편/남자’라는 그리스어 병행본문의 결혼 맥락과도 잘 맞습니다.
  naturalness: ‘동무’는 현대 표준어 성인 독자에게 다소 시대적이거나 지역적으로 표지된 어감을 줄 수 있습니다. ‘동료와 친구’가 현대 한국어에서 더 자연스럽고, 서로 관련되지만 동일하지 않은 두 관계어의 병치도 유지합니다. 각주 표지는 해당 낱말 바로 뒤에 두어 읽기 흐름을 분명히 했습니다.
