  yaml_path: translation/deuterocanon/sirach/040/023.yaml
  text: A companion and a friend conduct themselves for a time, but better than both is an intelligent wife.
  footnotes:
  - marker: a
    text: Hebrew 'woman'; the Greek parallel points more specifically toward a marital sense, hence 'wife.'
    reason: lexical_alternative
  - marker: b
    text: Or 'for a season' / 'at the proper time.' The Hebrew לעת and Greek εἰς καιρόν both involve the idea of time, and the exact nuance may be either temporary duration or timely usefulness.
    reason: alternative_reading
translation:
  language: ko
  text: 동무와 친구는 한때 유익하지만, 그 둘보다 나은 것은 분별력 있는 아내입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 '여자'이지만, 그리스어 병행본문은 더 분명하게 혼인 관계를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: ‘한때’는 히브리어 לעת와 그리스어 εἰς καιρόν이 모두 지시하는 시간의 한정성을 반영합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: עמית
  english_pob_choice: companion
  chosen_korean: 동무
  alternatives_korean:
  - 동반자
  - 동료
  - 벗
  lexicon: HALOT
  rationale: 가까운 관계의 동반자를 가리키는 말로 이해하되, 현대 한국어에서 너무 제도적이지 않으면서도 관계성을 살릴 수 있는 표현을 택했습니다.
- source_word: רע
