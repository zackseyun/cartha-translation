base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/040/001.yaml
  text: Great toil is allotted[c][b][a], and a heavy burden upon the children of man—from the day they come forth from their mother’s womb until the day they return to the mother of all.
  footnotes:
  - marker: a
    text: 'Greek: ''a heavy yoke upon the sons of Adam.'' The Hebrew is more compressed here; ''heavy burden'' reflects the sense without forcing the exact metaphor into the main text.'
    reason: lexical_alternative
  - marker: b
    text: 'The Greek parallel expands the verse: ''from the day they come forth from their mother’s womb until the day of burial in the mother of all.'' The Hebrew witness here is shorter.'
    reason: alternative_reading
  - marker: c
    text: '''The mother of all'' is a figurative way of referring to the earth as the common destination of burial.'
    reason: cultural_note
translation:
  language: ko
  text: 사람들에게는 큰 수고가 몫으로 주어졌고, 그들 위에는 무거운 짐이 놓여 있습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עסק גדול
  english_pob_choice: Great toil
  chosen_korean: 큰 수고
  alternatives_korean:
  - 큰 노동
  - 큰 애씀
  - 큰 고역
  lexicon: HALOT
  rationale: עסק גדול은 분주함보다 고되고 짐스러운 노동의 뉘앙스가 강하므로, 합쇼체에서 자연스럽고도 무게감이 살아 있는 ‘큰 수고’로 옮겼습니다.
- source_word: חלק אל
  english_pob_choice: is allotted
  chosen_korean: 주어졌고
  alternatives_korean:
  - 할당되었고
  - 배정되었고
  - 하나님께서 정하셨고
  lexicon: HALOT
  rationale: 히브리어는 압축적이라 주체를 명시적으로 더하지 않는 편이 안전합니다. 영어 POB의 ‘is allotted’에 맞춰, 원문이 말하는 인간의 몫으로서 ‘주어졌고’로 처리했습니다.
- source_word: ועל כבד
  english_pob_choice: and a heavy burden
  chosen_korean: 무거운 짐
  alternatives_korean:
  - 무거운 멍에
  - 무거운 부담
  - 무거운 짐꾸러미
  lexicon: HALOT
  rationale: 히브리어는 생략된 표현이고, 그리스어 평행구절의 ζυγὸς βαρύς가 ‘무거운 멍에’를 보여 주지만, 본문 자체의 간결함을 살려 한국어에서는 더 직관적인 ‘무거운 짐’으로 옮겼습니다.
- source_word: על בני אדם
  english_pob_choice: upon the children of man
  chosen_korean: 사람의 자녀에게
  alternatives_korean:
  - 인간 위에
  - 아담의 자손 위에
  - 사람의 아들들 위에
  lexicon: HALOT
  rationale: בני אדם의 인류 지칭을 살리면서도, 남성 복수 표현을 너무 추상화하지 않기 위해 ‘사람의 자녀’로 옮겼습니다. 영어 POB의 ‘children of man’과도 대응됩니다.
theological_decisions:
- issue: 히브리어의 압축성과 그리스어 평행구절의 확장 사이의 처리
  chosen_reading: 본문에 제시된 히브리어의 핵심 진술만을 한국어 본문으로 옮기고, 출생-장례의 확장은 본문에 삽입하지 않았습니다.
  alternative_readings:
  - 그리스어 평행구절을 따라 ‘어머니의 태에서 나오는 날부터…’를 본문에 포함하기
  - 히브리어보다 그리스어를 우선하여 전체를 확장 번역하기
  rationale: 제공된 최종 English revision이 히브리어 본문에 맞춰 축약되었으므로, 한국어도 그 본문에 충실하게 맞추는 것이 일관됩니다. 그리스어 확장은 의미상 중요하지만, 여기서는 본문에 없는 내용을 넣지 않는 편이 source-grounded합니다.
  doctrine_reference: 'PHILOSOPHY.md: Sirach translated from Hebrew where it survives, with Greek parallel used alongside it'
