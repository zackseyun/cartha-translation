base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/040/006.yaml
  text: For a little while[a], like a moment, he is quiet in vain; then, from the terrors of his heart[b], he is shaken—like one fleeing from before a pursuer.
  footnotes:
  - marker: a
    text: Hebrew text is difficult in the latter half of the verse. The Cairo Geniza reading compares the sleeper to one fleeing a pursuer; the Greek parallel similarly has 'like one who has escaped from the face of war.'
    reason: textual_variant
  - marker: b
    text: 'The Hebrew witness continues with additional wording about a vision of the soul in some line divisions; the Greek parallel expands the thought with ''in dreams, as on a day of watch.'' The main translation follows the clearest shared sense: rest is brief, and inward terror quickly returns.'
    reason: alternative_reading
translation:
  language: ko
  text: 그는 잠깐, 거의 아무것도 아닌 듯이 잠잠해집니다[a]. 그리고 자기 마음의 두려움들로 인해 흔들립니다[b]—마치 쫓는 자 앞에서 도망치는 사람처럼.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 뒤쪽 절반이 난해합니다. 카이로 게니자 읽기는 잠자는 이를 추격자에게서 도망치는 자에 비유하고, 그리스어 평행본문도 ‘전쟁의 얼굴 앞에서 도망친 자처럼’이라고 유사한 이미지를 보입니다.
    reason: textual_variant
  - marker: b
    text: 히브리어 증거는 일부 행분에서 ‘영혼의 환상’에 관한 추가 표현을 이어 줍니다. 그리스어 평행본문은 ‘꿈속에서, 파수의 날처럼’이라는 문구로 뜻을 넓히지만, 본역은 가장 분명히 공통되는 의미인 ‘짧은 안식과 곧 돌아오는 내적 공포’를 따릅니다.
    reason: alternative_reading
lexical_decisions:
- source_word: מעט לריק כרגע ישקוט
  english_pob_choice: For a little while, like a moment, he is quiet in vain
  chosen_korean: 잠깐, 거의 아무것도 아닌 듯이 잠잠해집니다
  alternatives_korean:
  - 짧은 시간, 헛되이 잠잠해집니다
  - 잠시, 한순간처럼 잠잠해집니다
  lexicon: HALOT
  rationale: מעט과 כרגע의 짧음과 לריק의 공허함을 함께 살리되, 한국어에서는 자연스러운 시간 표현으로 압축했습니다.
- source_word: ומבין בהלות לבו
  english_pob_choice: then, from the terrors of his heart
  chosen_korean: 그리고 자기 마음의 두려움들로 인해
  alternatives_korean:
  - 그리고 그의 마음의 공포들로부터
  - 그런 뒤 마음속 두려움에서
  lexicon: HALOT
  rationale: בהלות는 단일한 공포보다 복수적·파동적인 두려움의 뉘앙스가 있어 ‘두려움들’로 옮기고, 원문의 내면 근원을 분명히 했습니다.
- source_word: נרעש
  english_pob_choice: he is shaken
  chosen_korean: 흔들립니다
  alternatives_korean:
  - 떨립니다
  - 동요합니다
  lexicon: HALOT
  rationale: נרעש은 감정적 동요와 신체적 떨림을 함께 가리킬 수 있어, 한국어에서는 두 의미를 아우르는 ‘흔들립니다’를 택했습니다.
- source_word: כשריד בורח מפני רודף
  english_pob_choice: like one fleeing from before a pursuer
  chosen_korean: 마치 쫓는 자 앞에서 도망치는 사람처럼
  alternatives_korean:
  - 마치 추격자 앞에서 달아나는 생존자처럼
  - 마치 पीछ는 자를 피해 도망하는 자처럼
  lexicon: HALOT
  rationale: שריד의 ‘남은 자/생존자’ 가능성이 있으나, 문맥상 핵심 이미지는 추격 앞의 공황적 도주이므로 보다 확실한 ‘도망치는 사람’으로 번역했습니다.
theological_decisions:
- issue: 내면의 공포와 외적 추격의 결합 이미지
  chosen_reading: 잠깐의 안식이 곧 마음의 두려움과 도주 이미지로 무너지는 인간의 불안정한 상태를 그대로 드러냅니다.
  alternative_readings:
  - 단순히 수면 중의 악몽으로 제한하는 읽기
  - 일반적 삶의 불안으로만 완화하는 읽기
  rationale: 히브리어와 그리스어 병행본문 모두 내면의 공포와 추격 이미지를 결합하므로, 이를 약화하지 않고 본문 그대로 유지했습니다.
  doctrine_reference: 인간의 연약함과 불안정성에 대한 지혜문학적 관찰
