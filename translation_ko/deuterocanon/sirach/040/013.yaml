base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/040/013.yaml
  text: From force to force[a], like a perennial wadi, and from a mighty channel[c][b], with a crash of sounds.
  footnotes:
  - marker: a
    text: The Greek parallel reads, 'The wealth of the unjust will dry up like a river, and it will resound like a great thunder in rain.' This reflects a markedly different textual form from the surviving Hebrew.
    reason: alternative_reading
  - marker: b
    text: The Hebrew text of this line is difficult, and the Masada fragment for this verse is too incomplete to settle the wording securely; the translation follows the Cairo Geniza Hebrew while keeping the Greek parallel in view.
    reason: textual_variant
  - marker: c
    text: Or 'an ever-flowing stream.' Hebrew נחל often refers to a wadi or torrent-bed, and איתן suggests enduring or perennial flow.
    reason: lexical_alternative
translation:
  language: ko
  text: 힘에서 힘으로, 영속하는 와디처럼, 그리고 웅장한 수로에서, 소리의 굉음과 함께.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 여기서 힘, 세력, 군대, 재물 등으로 넓게 읽힐 수 있지만, 문맥의 물 이미지와 반복 구조를 따라 ‘힘’으로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: נחל은 보통 와디나 급류골을 가리키며, איתן은 지속적이거나 영속적인 흐름을 뜻합니다.
    reason: lexical_alternative
  - marker: c
    text: 그리스어 병행본은 ‘악인의 재물은 큰 비처럼 말라버린다’는 매우 다른 본문 형태를 전합니다.
    reason: textual_variant
lexical_decisions:
- source_word: מחיל אל חיל
  english_pob_choice: from force to force
  chosen_korean: 힘에서 힘으로
  alternatives_korean:
  - 강함에서 강함으로
  - 능력에서 능력으로
  - 진에서 진으로
  lexicon: HALOT
  rationale: חיל은 이 문맥에서 힘, 세력, 능력, 군대 등으로 넓게 읽힐 수 있으나, 앞뒤의 수리적 이미지와 반복 구조를 살려 가장 직접적인 추상어인 ‘힘’을 택했습니다.
- source_word: נחל איתן
  english_pob_choice: a perennial wadi
  chosen_korean: 영속하는 와디
  alternatives_korean:
  - 항상 흐르는 와디
  - 끊임없이 흐르는 와디
  - 영원한 개울
  lexicon: HALOT
  rationale: נחל은 일반적인 강보다 와디/건천-급류골에 가깝고, איתן은 지속성·영속성을 나타내므로 ‘영속하는 와디’로 옮겨 지형적 이미지를 보존했습니다.
- source_word: אפיק אדיר
  english_pob_choice: a mighty channel
  chosen_korean: 웅장한 수로
  alternatives_korean:
  - 거대한 물길
  - 힘센 물도랑
  - 장대한 물길
  lexicon: HALOT
  rationale: אפיק은 수로, 물길, 골짜기 바닥을 가리키고 אדיר는 크고 위엄 있는 상태를 나타내므로, 단순한 ‘강’보다 구체적인 지형어인 ‘수로’를 선택했습니다.
- source_word: בחזיז קולות
  english_pob_choice: with a crash of sounds
  chosen_korean: 소리의 굉음과 함께
  alternatives_korean:
  - 천둥 같은 소리와 함께
  - 우레 같은 소리로
  - 소리의 요란한 울림과 함께
  lexicon: HALOT
  rationale: חזיז קולות은 드문 표현이라 단정적으로 ‘천둥’으로 고정하기보다, קולות의 기본 의미인 소리/울림을 살려 ‘소리의 굉음’으로 번역했습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행본의 차이
  chosen_reading: 본문은 현존 히브리어의 수리 이미지(힘—와디—수로—소리)를 따르되, 그리스어의 ‘악인의 재물’ 전통은 본문 외 대안 독법으로만 남깁니다.
  alternative_readings:
  - 그리스어를 따라 ‘악인의 재물은 큰 천둥처럼…’로 옮김
  - 히브리어와 그리스어를 절충한 혼합 번역
  rationale: 이 절은 두 전승이 상당히 다르므로, POB의 원칙대로 주본문은 채택한 히브리어 증거를 따라가고, 다른 전승은 본문을 덮어쓰지 않도록 구분해야 합니다.
  doctrine_reference: 본문 비평과 정경 내 전승 차이
- issue: ‘חזיז קולות’의 음향 묘사
  chosen_reading: ‘소리의 굉음’처럼 소리 자체의 폭발성을 살렸습니다.
  alternative_readings:
  - ‘천둥’으로 명시
  - ‘우레’로 의역
  rationale: 히브리어는 소리/울림을 직접 말하면서도 기상 현상으로 단정하지 않으므로, 의미를 과도하게 특정하지 않는 쪽이 더 안전합니다.
  doctrine_reference: 어휘 보존과 과잉 해석 방지
