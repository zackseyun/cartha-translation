base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/040/015.yaml
  text: The offspring of violence will not go unpunished[b][a], for the root of the godless is on a jagged crag.
  footnotes:
  - marker: a
    text: 'Greek parallel: ''The offspring of the ungodly will not multiply branches, and unclean roots are upon a sharply cut rock.'' This supports the image of corrupt growth but differs from the surviving Hebrew wording.'
    reason: alternative_reading
  - marker: b
    text: The final phrase is difficult Hebrew. Literally, it evokes a 'tooth' of rock—that is, a sharp rocky projection or crag.
    reason: lexical_alternative
translation:
  language: ko
  text: 폭력의 자손은 벌을 면하지 못합니다. 불경한 자의 뿌리는 뾰족한 바위 위에 있습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 평행본문은 “불경한 자들의 자손은 가지를 번성시키지 못하고, 더러운 뿌리들은 날카롭게 깎인 바위 위에 있다”라고 읽습니다. 이는 부패한 생장과 뿌리의 비유를 뒷받침하지만, 남아 있는 히브리어 표현과는 다릅니다.
    reason: alternative_reading
  - marker: b
    text: 마지막 구절은 의미가 어려운 히브리어입니다. 직역하면 바위의 ‘이빨’, 곧 날카로운 바위 돌출부나 절벽을 가리키는 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נוצר
  english_pob_choice: offspring
  chosen_korean: 난 것
  alternatives_korean:
  - 자손
  - 열매
  - 생겨난 것
  lexicon: HALOT
  rationale: 히브리어와 그에 대한 영어 POB의 해석은 ‘낳아진/생겨난 결과물’이라는 이미지를 가리키므로, 문맥상 자연스러운 ‘난 것’으로 옮겨 원인-결과의 비유를 살렸습니다.
- source_word: מחמס
  english_pob_choice: of violence
  chosen_korean: 폭력에서
  alternatives_korean:
  - 폭력의
  - 불의에서
  - 강탈에서
  lexicon: HALOT
  rationale: חמס는 폭력과 폭압을 뜻하므로, 출처를 분명히 드러내는 ‘폭력에서’로 옮겼습니다. 한국어에서 소유격보다 기원·출처 뉘앙스가 더 분명합니다.
- source_word: לא ינקה
  english_pob_choice: will not go unpunished
  chosen_korean: 벌을 면하지 못합니다
  alternatives_korean:
  - 무죄가 되지 않습니다
  - 깨끗함을 얻지 못합니다
  - 처벌을 피하지 못합니다
  lexicon: HALOT
  rationale: 부정형 נקה의 법정적 의미를 살려, 단순한 ‘깨끗함’보다 판결·책임의 뉘앙스가 분명한 ‘벌을 면하지 못합니다’로 옮겼습니다.
- source_word: שרש חנף
  english_pob_choice: the root of the godless
  chosen_korean: 그 악한 자의 뿌리
  alternatives_korean:
  - 그 경건하지 않은 자의 뿌리
  - 그 불경한 자의 뿌리
  - 그 위선자의 뿌리
  lexicon: HALOT
  rationale: חנף는 ‘경건하지 않은/불경한/사악한’ 뜻 범위를 가지며, 영어 POB의 ‘the godless’에 맞춰 도덕·종교적 결핍을 전달하는 ‘악한 자’로 옮겼습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 평행본문의 이미지 차이
  chosen_reading: 본문은 히브리어의 ‘폭력에서 난 것’과 ‘뿌리’를 따라 번역하고, 그리스어의 ‘불경한 자들’과 ‘가지’ 이미지는 채택하지 않았습니다.
  alternative_readings:
  - ‘경건하지 않은 자들의 자손은 가지를 번성시키지 못합니다’
  rationale: 시락서는 히브리어가 현존하는 경우 히브리어를 우선하되, 그리스어 평행본문은 검증용으로 활용합니다. 여기서는 첫 절의 ‘폭력’과 둘째 절의 ‘뿌리’가 히브리어 증거를 더 직접적으로 반영하므로 이를 본문으로 유지했습니다.
  doctrine_reference: 'PHILOSOPHY.md: translate from Hebrew where Sirach Hebrew survives; use Greek parallel as consistency check'
