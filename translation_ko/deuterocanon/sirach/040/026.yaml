theological_decisions:
- issue: יראת אלהים의 신학적 강도
  chosen_reading: ‘하나님을 경외함’으로 번역해 단순한 존중보다 더 깊은 경외와 순종의 뉘앙스를 유지했습니다.
  alternative_readings:
  - 하나님에 대한 경외
  - 하나님을 두려워함
  - 경건
  rationale: 지혜문학의 핵심 주제인 ‘경외’의 무게를 유지해야 하므로, 의미를 약화시키는 ‘경건’이나 단순한 존중으로는 옮기지 않았습니다.
