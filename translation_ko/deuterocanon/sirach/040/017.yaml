  text: Kindness will never be shaken[b][a], and righteousness will stand forever.
  footnotes:
  - marker: a
    text: 'Greek parallel: ''grace is like a paradise in blessings, and almsgiving endures forever.'' The Hebrew witness instead reads ''kindness ... and righteousness ...'''
    reason: alternative_reading
  - marker: b
    text: Masada preserves a differing Hebrew reading at this point from the Cairo Geniza text; the surviving excerpt is too fragmentary here to control the full translation with confidence.
    reason: textual_variant
translation:
  language: ko
  text: 인자와 의는 영원히 흔들리지 않으며, 영원히 굳게 서 있습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 병행본문은 ‘은혜가 축복들 가운데 낙원 같고, 구제/자선이 영원히 지속된다’고 읽습니다. 히브리어 증거는 여기서 ‘인자 … 의 …’로 읽습니다.
    reason: alternative_reading
  - marker: b
    text: 마사다 히브리어는 이 지점에서 카이로 게니자 본문과 다른 읽기를 보이며, 남아 있는 단편이 짧아 본문 전체를 확정하기에 충분하지 않습니다.
    reason: textual_variant
lexical_decisions:
- source_word: וחסד
  english_pob_choice: Kindness
  chosen_korean: 인자
  alternatives_korean:
  - 친절
  - 자비
  - 은혜
  lexicon: HALOT
  rationale: 히브리어 חסד는 단순한 친절보다 더 넓은 언약적·윤리적 선의를 가리킬 수 있으므로, 지혜문맥에서 의미를 충분히 살릴 수 있는 ‘인자’를 택했습니다.
- source_word: לעולם לא ימוט
  english_pob_choice: will never be shaken
  chosen_korean: 영원히 흔들리지 않으며
  alternatives_korean:
  - 영원히 무너지지 않으며
  - 영원히 옮겨지지 않으며
  - 영원히 흔들리지 않으며
  lexicon: HALOT
  rationale: ימוט는 흔들리다, 기울다, 무너지다의 뜻을 가질 수 있어, 지속성과 안정의 이미지를 살리는 ‘흔들리지 않으며’로 옮겼습니다.
- source_word: וצדקה
  english_pob_choice: righteousness
  chosen_korean: 의
  alternatives_korean:
  - 정의
  - 공의
  - 자선
  lexicon: HALOT
  rationale: צדקה는 여기서 히브리어 본문이 분명히 가리키는 도덕적·언약적 올바름을 나타내므로, 본문 기본어인 ‘의’를 사용했습니다.
- source_word: לעד תכון
  english_pob_choice: will stand forever
  chosen_korean: 영원히 굳게 서 있습니다
  alternatives_korean:
  - 영원히 세워져 있습니다
  - 영원히 확립되어 있습니다
  - 영원히 서 있습니다
  lexicon: HALOT
  rationale: כון은 ‘세우다, 굳게 하다, 확립하다’의 뜻이 있어, 상태의 지속과 견고함을 함께 담는 표현으로 옮겼습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행본문의 차이
  chosen_reading: 주본문은 히브리어의 ‘인자와 의’로 따르고, 그리스어의 ‘은혜와 자선/구제’ 계열 해석은 각주로만 드러냅니다.
  alternative_readings:
  - '그리스어 전통: ‘은혜가 복락동산 같고, 구제가 영원히 지속된다’'
  rationale: 이 절은 히브리어 증거가 분명하므로 그 본문을 우선하되, 그리스어 병행본문의 뚜렷한 해석 차이는 숨기지 않고 보존해야 합니다.
  doctrine_reference: 원문 우선 원칙; 본문 전통 간 긴장 보존
- issue: חסד의 번역 범위
  chosen_reading: ‘인자’는 단순한 감정적 친절이 아니라, 지속적 선의와 관계적 신실함까지 포괄하는 표현으로 사용했습니다.
  alternative_readings:
  - 친절
  - 자비
  - 은혜
  rationale: 한국어 교회어에서 흔한 ‘자비’나 ‘은혜’는 이 문맥에서 의미를 지나치게 좁히거나 신학적으로 옮길 수 있어, 더 넓은 윤리적 성격을 드러내는 표현을 선택했습니다.
  doctrine_reference: 지혜문학의 اخلاق적 덕목 표현
