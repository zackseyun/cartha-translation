  - 대금
  lexicon: HALOT
  rationale: 히브리어 חליל은 관악기를 가리키며, 한국어에서는 자연스럽고 고전적 음색을 살릴 수 있는 ‘피리’가 가장 무난합니다.
- source_word: נבל
