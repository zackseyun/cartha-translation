  - 기쁘게 하다
  lexicon: HALOT
  rationale: 소리가 ‘달게/즐겁게’ 된다는 뜻을 한국어 자연문장으로 풀어, 음악이 노래를 더욱 아름답게 한다는 의미를 살렸습니다.
- source_word: ברה
  english_pob_choice: pure
  chosen_korean: 깨끗한
  alternatives_korean:
  - 순수한
  - 맑은
  - 정결한
  lexicon: HALOT
  rationale: 히브리어 본문이 가진 도덕적·질적 ‘깨끗함’의 뉘앙스를 살리면서, 한국어에서 ‘혀’와 함께 자연스럽게 읽히는 표현으로 선택했습니다.
theological_decisions:
- issue: 히브리어 본문의 종결구와 그리스어 병행문의 차이
