    reason: alternative_reading
lexical_decisions:
- source_word: ועם כל בשר
  english_pob_choice: And with all flesh
  chosen_korean: 온갖 육체와 더불어
  alternatives_korean:
  - 모든 육체와 함께
  - 온갖 사람과 함께
  lexicon: HALOT
  rationale: בשר의 집합적 의미를 살려 인간만이 아니라 살아 있는 모든 육체를 포괄하는 표현으로 옮겼습니다. 한국어에서는 직역형 ‘모든 육체’도 가능하지만, 문맥의 시적 유연성을 살려 ‘온갖 육체와 더불어’로 다듬었습니다.
- source_word: דאגתם
  english_pob_choice: their anxiety
  chosen_korean: 그들의 근심
  alternatives_korean:
  - 그들의 불안
  - 그들의 걱정
  lexicon: HALOT
  rationale: דאג는 단순한 걱정보다 마음을 짓누르는 염려를 가리키므로, 지혜문학의 분위기에 맞는 ‘근심’을 선택했습니다.
- source_word: ועשרם
  english_pob_choice: and their wealth
  chosen_korean: 그들의 부가
  alternatives_korean:
  - 그들의 재물이
  - 그들의 부유함이
  lexicon: HALOT
  rationale: עֹשֶׁר의 기본 의미인 부·재물을 반영하되, 시구의 흐름을 살려 명사구 ‘그들의 부’로 옮겼습니다. 영어 POB의 ‘wealth’와도 대응합니다.
- source_word: מניד שנתם
  english_pob_choice: drives away their sleep
  chosen_korean: 그들의 잠을 쫓아냅니다
  alternatives_korean:
  - 그들의 잠을 방해합니다
  - 그들의 잠을 몰아냅니다
  lexicon: HALOT
  rationale: ניד/נוד 계열의 ‘흔들다, 몰아내다’라는 गत적 이미지를 살려, 잠이 단지 방해받는 수준이 아니라 실제로 떠밀려 나가는 느낌을 보존했습니다.
theological_decisions:
- issue: 히브리어 본문과 헬라어 병행본문의 관계
  chosen_reading: 주본문은 현존 히브리어 행을 따르고, 헬라어의 ‘죄인들에게는 이보다 일곱 배’라는 확장 구절은 주석 각주로 보존합니다.
  alternative_readings:
  - 헬라어 확장 구절을 본문에 합치기
  rationale: 집회서에서는 히브리어가 남아 있는 경우 그 증거를 우선하되, 헬라어의 더 긴 형태도 실제 전승으로서 중요하므로 본문을 침범하지 않는 각주로 처리했습니다.
  doctrine_reference: 'PHILOSOPHY.md: surviving Hebrew primacy with Greek parallel as audited witness'
