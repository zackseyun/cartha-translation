    reason: textual_variant
lexical_decisions:
- source_word: מעוטה צניף
  english_pob_choice: with a small turban
  chosen_korean: 작은 두건
  alternatives_korean:
  - 작은 터번
  - 작은 머리싸개
  - 소박한 두건
  lexicon: HALOT
  rationale: צניף는 머리 둘레를 감아 두르는 머리장식이므로, 한국어에서는 자연스럽고 간결한 ‘두건’으로 옮기되 ‘작은’으로 크기/소박함의 감각을 살렸습니다.
- source_word: וציץ
  english_pob_choice: and a flowered crown
  chosen_korean: 꽃장식 관
  alternatives_korean:
  - 꽃관
  - 화관
  - 장식 관
  lexicon: HALOT
  rationale: ציץ는 꽃/피어남의 뜻과 장식물의 뜻을 함께 가질 수 있어, 꽃의 이미지를 보존하면서도 머리장식임을 드러내는 ‘꽃장식 관’으로 옮겼습니다.
- source_word: ועד עוטה שמלת עור
  english_pob_choice: even to one wrapped in a garment of skin
  chosen_korean: 가죽옷을 두른 사람까지
  alternatives_korean:
  - 가죽옷을 입은 사람까지
  - 가죽으로 된 옷을 걸친 사람까지
  - 피혁옷을 입은 사람까지
  lexicon: HALOT
  rationale: שמלת עור는 문자적으로 ‘가죽/피의 옷’이지만, 한국어에서는 ‘가죽옷’이 가장 직접적이며 본문의 대비되는 수수함을 잘 드러냅니다. ‘두른’은 עוטה의 감싸는 동작을 반영합니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행본문의 의상 이미지 차이
  chosen_reading: 히브리어 본문을 따라 ‘두건/꽃장식 관/가죽옷’의 대비를 본문에 반영하고, 그리스어의 변이는 주석 없이 본문에 섞지 않았습니다.
  alternative_readings:
  - 그리스어를 따라 ‘푸른빛 옷/관/거친 리넨’으로 옮김
  - 두 본문의 이미지를 절충하여 혼합 번역
  rationale: 이 절은 사본 전승 사이에 구체적 의상 표현이 다르므로, 주본문은 선택된 히브리어 증거를 따르되 번역은 과도하게 해석하지 않도록 했습니다.
  doctrine_reference: Sirach textual transmission / source-critical practice
