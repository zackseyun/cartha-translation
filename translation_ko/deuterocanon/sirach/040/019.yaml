base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/040/019.yaml
  text: Children and the building of a city establish a name[b][a], but better than both is a blameless wife.
  footnotes:
  - marker: a
    text: Hebrew Cairo Geniza text reads approximately, 'and from both of them comes wisdom'; the Greek parallel instead reads, 'but better than both is a blameless wife.' The Hebrew of this colon appears textually uncertain, so the main text follows the clearer Greek-supported sense.
    reason: alternative_reading
  - marker: b
    text: The older Masada scroll is fragmentary here and does not preserve enough of the line to settle the final wording with confidence.
    reason: textual_variant
translation:
  language: ko
  text: 아이들과 도시를 세우는 일은 이름을 세웁니다[b][a]. 그러나 둘보다 더 나은 것은 흠 없는 아내입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 카이로 게니자 히브리어 본문은 대략 ‘둘에서 지혜가 나온다’로 읽히며, 그리스어 병행문은 ‘그러나 둘보다 더 나은 것은 흠 없는 아내’로 읽습니다. 이 절의 히브리어는 본문상 불확실하므로, 본문은 더 분명한 그리스어에 따른 의미를 따릅니다.
    reason: alternative_reading
  - marker: b
    text: 옛 마사다 두루마리는 이 구절이 파편적으로만 남아 있어, 마지막 표현을 확실하게 결정하기에 충분하지 않습니다.
    reason: textual_variant
lexical_decisions:
- source_word: ילד / τέκνα
  english_pob_choice: Children
  chosen_korean: 아이들
  alternatives_korean:
  - 자녀들
  - 어린이들
  lexicon: HALOT / SBLGNT parallel
  rationale: 집합적 의미의 복수 명사로 읽히므로 한국어에서는 자연스럽고 포괄적인 복수형인 ‘아이들’로 옮겼습니다.
- source_word: ועיר יעמידו שם / οἰκοδομὴ πόλεως στηρίζουσιν ὄνομα
  english_pob_choice: the building of a city establish a name
  chosen_korean: 도시를 세우는 일은 이름을 세웁니다
  alternatives_korean:
  - 도시를 건설하는 일은 이름을 세웁니다
  - 도시를 세우는 것은 명성을 세웁니다
  lexicon: HALOT / Greek parallel
  rationale: 히브리어의 עיר와 동사구를 그리스어 병행문의 ‘도시를 세움’과 맞추어, 관용구 ‘이름을 세우다’의 의미를 살려 번역했습니다.
- source_word: שם
  english_pob_choice: a name
  chosen_korean: 이름
  alternatives_korean:
  - 명성
  - 평판
  lexicon: HALOT
  rationale: ‘이름’은 히브리어 שם의 기본적 표면 의미이면서도 문맥상 명성·평판을 포함하므로, 직역을 유지해 비유적 함의를 보존했습니다.
- source_word: γυνὴ ἄμωμος
  english_pob_choice: a blameless wife
  chosen_korean: 흠 없는 아내
  alternatives_korean:
  - 책망할 데 없는 아내
  - 결점 없는 아내
  lexicon: BDAG
  rationale: 그리스어 ἄμωμος의 도덕적 흠 없음이 핵심이므로, 한국어에서는 압축적이고 자연스러운 ‘흠 없는’으로 옮겼습니다.
theological_decisions:
- issue: 히브리어와 그리스어 말미 구절의 긴장
  chosen_reading: 본문은 히브리어의 불안정한 마지막 구절보다 그리스어가 분명히 전하는 비교 구문—‘둘보다 더 나은 것은 흠 없는 아내’—을 따른 한국어 본문으로 정리했습니다.
  alternative_readings:
  - ‘둘에서 지혜가 나온다’로 히브리어를 직역
  rationale: 남아 있는 히브리어 마지막 절은 문맥과 대응이 불안정하므로, 병행 본문의 분명한 의미를 따라 지혜 격언의 대조 구조를 보존하는 것이 더 적절합니다.
  doctrine_reference: Sirach 40:19 textual-criticism decision; Greek parallel used as controlling witness where Hebrew is unstable
