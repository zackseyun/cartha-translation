base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/040/019.yaml
  text: Children and the building of a city establish a name[b][a], but better than both is a blameless wife.
  footnotes:
  - marker: a
    text: Hebrew Cairo Geniza text reads approximately, 'and from both of them comes wisdom'; the Greek parallel instead reads, 'but better than both is a blameless wife.' The Hebrew of this colon appears textually uncertain, so the main text follows the clearer Greek-supported sense.
    reason: alternative_reading
  - marker: b
    text: The older Masada scroll is fragmentary here and does not preserve enough of the line to settle the final wording with confidence.
    reason: textual_variant
translation:
  language: ko
  text: 자녀와 도시를 건설하는 일은 명성을 굳게 세웁니다[b][a]. 그러나 그 둘보다 더 나은 것은 나무랄 데 없는 아내입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 카이로 게니자 히브리어 본문은 대략 ‘그 둘에게서 지혜가 나온다’로 읽히며, 그리스어 병행본문은 ‘그러나 그 둘보다 더 나은 것은 나무랄 데 없는 아내’라고 전합니다. 이 절의 히브리어 말미는 본문상 불확실하므로, 본문은 더 분명한 그리스어가 지지하는 의미를 따릅니다.
    reason: alternative_reading
  - marker: b
    text: 옛 마사다 두루마리는 이 구절이 파편적으로만 남아 있어, 마지막 표현을 확실하게 결정하기에 충분하지 않습니다.
    reason: textual_variant
