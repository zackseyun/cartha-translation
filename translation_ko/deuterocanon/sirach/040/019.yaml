  lexicon: HALOT
  rationale: ‘이름’은 히브리어 שם의 기본적 표면 의미이면서도 문맥상 명성·평판을 포함하므로, 직역을 유지해 비유적 함의를 보존했습니다.
- source_word: γυνὴ ἄμωμος
  english_pob_choice: a blameless wife
  chosen_korean: 흠 없는 아내
  alternatives_korean:
  - 책망할 데 없는 아내
  - 결점 없는 아내
  lexicon: BDAG
  rationale: 그리스어 ἄμωμος의 도덕적 흠 없음이 핵심이므로, 한국어에서는 압축적이고 자연스러운 ‘흠 없는’으로 옮겼습니다.
theological_decisions:
- issue: 히브리어와 그리스어 말미 구절의 긴장
  chosen_reading: 본문은 히브리어의 불안정한 마지막 구절보다 그리스어가 분명히 전하는 비교 구문—‘둘보다 더 나은 것은 흠 없는 아내’—을 따른 한국어 본문으로 정리했습니다.
  alternative_readings:
  - ‘둘에서 지혜가 나온다’로 히브리어를 직역
  rationale: 남아 있는 히브리어 마지막 절은 문맥과 대응이 불안정하므로, 병행 본문의 분명한 의미를 따라 지혜 격언의 대조 구조를 보존하는 것이 더 적절합니다.
  doctrine_reference: Sirach 40:19 textual-criticism decision; Greek parallel used as controlling witness where Hebrew is unstable
