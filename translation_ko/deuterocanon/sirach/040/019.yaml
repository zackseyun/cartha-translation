  lexicon: HALOT / Greek parallel
  rationale: 히브리어의 עיר와 동사구를 그리스어 병행문의 ‘도시를 세움’과 맞추어, 관용구 ‘이름을 세우다’의 의미를 살려 번역했습니다.
- source_word: שם
  english_pob_choice: a name
  chosen_korean: 이름
  alternatives_korean:
  - 명성
