  text: Wine and strong drink gladden the heart, but better than both is the love of lovers.
translation:
  language: ko
  text: 포도주와 독주는 마음을 기쁘게 하지만, 그 둘보다 더 나은 것은 연인들의 사랑입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יין ושכר
  english_pob_choice: Wine and strong drink
  chosen_korean: 포도주와 독주
  alternatives_korean:
  - 술과 독주
  - 포도주와 술
  - 포도주와 독한 술
  lexicon: יין / שכר
  rationale: יין은 기본적으로 포도주로 옮기고, שכר는 일반적인 술보다 더 강한 알코올 음료를 가리키므로 독주로 옮겨 원문의 대비를 살렸습니다.
- source_word: יעליצו לב
  english_pob_choice: gladden the heart
  chosen_korean: 마음을 기쁘게 합니다
  alternatives_korean:
  - 마음을 즐겁게 합니다
  - 마음을 환하게 합니다
  - 마음을 기쁘게 만듭니다
  lexicon: יעליצו / לב
  rationale: 동사 יעליצו는 마음을 유쾌하게 하거나 기쁘게 한다는 뜻이므로, 현대 한국어에서 자연스러운 ‘마음을 기쁘게 하다’로 옮겼습니다.
- source_word: אהבת דודים
  english_pob_choice: the love of lovers
  chosen_korean: 연인들의 사랑
  alternatives_korean:
  - 사랑하는 이들의 사랑
  - 연정
  - 사랑하는 사람들의 사랑
  lexicon: אהבת / דודים
  rationale: דודים는 애정 관계의 연인들을 가리키는 표현으로, POB의 ‘lovers’를 반영해 ‘연인들’로 옮겼습니다. ‘연정’은 의미는 가깝지만 문맥의 관계성을 덜 직접적으로 드러냅니다.
theological_decisions:
- issue: 후반부 비교 구문의 의미
  chosen_reading: ‘그 둘보다 더 나은 것은…’으로 옮겨, 단순한 감정 묘사가 아니라 비교 우위를 분명히 드러냈습니다.
  alternative_readings:
  - ‘둘보다 뛰어난 것은…’
  - ‘그 둘 위에 있는 것은…’
  rationale: 히브리어의 비교 표현 ומשניהם는 두 항목을 넘어서는 가치를 말하므로, 한국어에서도 비교 관계를 분명히 해야 합니다.
  doctrine_reference: 문학적 지혜문학의 비교 진술
