  text: At the opening of his hands they will rejoice[b][a], but the transgressors will suddenly come to an end forever.
  footnotes:
  - marker: a
    text: The Hebrew first colon is difficult and may reflect a different reading, roughly involving 'people' and 'plundering.' The Greek reads, 'When he opens his hands, they rejoice.'
