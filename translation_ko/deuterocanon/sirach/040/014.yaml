base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/040/014.yaml
  text: At the opening of his hands they will rejoice[b][a], but the transgressors will suddenly come to an end forever.
  footnotes:
  - marker: a
    text: The Hebrew first colon is difficult and may reflect a different reading, roughly involving 'people' and 'plundering.' The Greek reads, 'When he opens his hands, they rejoice.'
    reason: alternative_reading
  - marker: b
    text: Masada preserves only a fragmentary reading here; the Cairo Geniza text and Greek diverge substantially in the first colon.
    reason: textual_variant
translation:
  language: ko
  text: 그가 손을 펴면 그들이 기뻐합니다. 그러나 범법자들은 갑자기, 영원히 끝이 납니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 첫 번째 행은 어렵고, ‘사람들’과 ‘약탈’이 관련된 다른 독법을 반영했을 가능성이 있습니다. 헬라어는 ‘그가 손을 펴면 그들이 기뻐합니다’라고 읽습니다.
    reason: alternative_reading
  - marker: b
    text: 마사다 본문은 이 부분이 단편적으로만 남아 있으며, 카이로 게니자 본문과 헬라어는 첫 번째 행에서 크게 다릅니다.
    reason: textual_variant
lexical_decisions:
- source_word: ἐν τῷ ἀνοῖξαι αὐτὸν χεῖρας / שאתו כפים
  english_pob_choice: When he opens his hands
  chosen_korean: 그가 손을 펴면
  alternatives_korean:
  - 그의 손을 펼 때
  - 그의 손을 여는 때
  lexicon: BDAG; HALOT
  rationale: 헬라어 병행본문의 ‘손을 펴다/여다’는 동작을 자연스러운 한국어로 옮기되, 본문이 시간절로 기능하는 점을 살려 ‘-면’ 구조로 처리했습니다.
- source_word: εὐφρανθήσεται
  english_pob_choice: they will rejoice
  chosen_korean: 그들이 기뻐합니다
  alternatives_korean:
  - 그들은 즐거워합니다
  - 그들이 환호합니다
  lexicon: BDAG
  rationale: 헬라어의 의미는 단순한 감정적 기쁨이므로 과장하지 않고 표준적인 ‘기뻐하다’를 택했습니다.
- source_word: οἱ παραβαίνοντες / יתם
  english_pob_choice: the transgressors will suddenly come to an end forever
  chosen_korean: 범법자들은 갑자기, 영원히 끝이 납니다
  alternatives_korean:
  - 죄를 범하는 자들은 갑자기 영원히 사라집니다
  - 율법을 어기는 자들은 갑자기 끝납니다
  lexicon: BDAG; HALOT
  rationale: 헬라어의 ‘범법하는 자들’을 살려 ‘범법자들’로 옮겼고, 종결의 급작스러움과 최종성을 ‘갑자기, 영원히 끝이 납니다’로 유지했습니다.
- source_word: פתאם / συντέλειαν
  english_pob_choice: suddenly / come to an end forever
  chosen_korean: 갑자기, 영원히
  alternatives_korean:
  - 순식간에, 영원히
  - 뜻밖에, 끝내
  lexicon: HALOT; BDAG
  rationale: 히브리어의 פתאם과 헬라어의 종결 표현을 함께 반영해 시간적 급박성과 완결성을 분리해 드러냈습니다.
theological_decisions:
- issue: 본문이 히브리어와 헬라어에서 크게 갈라지는 첫 번째 절
  chosen_reading: 주본문은 헬라어의 분명한 뜻을 따라 ‘그가 손을 펴면 그들이 기뻐합니다’로 옮기고, 히브리어의 불확실한 독법은 본문 밖으로 밀어내지 않았습니다.
  alternative_readings:
  - 히브리어를 따라 ‘사람들 사이에서 약탈이 있다’는 식으로 재구성하는 읽기
  rationale: 이 절은 히브리어가 난해하고 훼손 가능성이 커서, 더 분명한 헬라어를 실제 번역 입력으로 사용해야 한다는 편집 원칙에 따랐습니다.
  doctrine_reference: 원전 우선 번역 원칙과 본문 비평의 투명성
