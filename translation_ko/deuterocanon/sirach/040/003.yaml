translation:
  language: ko
  text: 높은 보좌에 앉아 있는 이로부터, 흙과 재로 돌아가는 이까지입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 병행본은 ‘영광 중에 보좌에 앉아 있는 이로부터 땅과 재 가운데 낮아진 이까지’라고 더 분명히 풀어 말합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: מיושב כסא לגבה
  english_pob_choice: from one seated on a lofty throne
  chosen_korean: 보좌에 앉아 있는 이로부터
  alternatives_korean:
  - 높은 보좌에 앉아 있는 이로부터
  - 높이 솟은 보좌에 앉아 있는 이로부터
  lexicon: HALOT
  rationale: מיושב는 출발점 ‘from’이 걸린 분사구로 보고, כסא는 왕권적 자리인 ‘보좌’로 옮겼습니다. לגבה의 ‘높음/높이’를 한국어에서는 자연스럽게 보좌의 위상을 드러내는 표현으로 처리했습니다.
- source_word: לשוב
  english_pob_choice: returning
  chosen_korean: 돌아가는
  alternatives_korean:
  - 돌아오는
  - 되돌아가는
  lexicon: HALOT
  rationale: 부정사 ל־가 끝점의 상태를 나타내므로, 단순한 동작보다 인간의 종착을 보이는 진행형 어감을 살려 ‘돌아가는’으로 옮겼습니다.
- source_word: עפר ואפר
  english_pob_choice: dust and ashes
  chosen_korean: 흙과 재
  alternatives_korean:
  - 먼지와 재
  - 티끌과 재
  lexicon: HALOT
  rationale: 히브리어 고정 결합어를 한국어에서도 짝으로 보존했습니다. ‘흙과 재’는 죽음과 비천함을 함께 드러내는 관용적 대응이며, 영어 POB의 ‘dust and ashes’와 같은 기능을 합니다.
theological_decisions:
- issue: Greek parallel의 ‘in glory / humbled’ 확장 여부
  chosen_reading: 본문에는 히브리어의 간결한 사회적 대비를 따라, 영광과 굴욕을 명시적으로 덧붙이지 않았습니다.
  alternative_readings:
  - 영광의 보좌에 앉아 있는 이로부터, 땅과 재 가운데 낮아진 이까지입니다.
  - 영광 중에 보좌에 앉아 있는 이로부터, 땅과 재에 엎드러진 이까지입니다.
  rationale: 그리스어 병행본은 의미를 풀어 설명하지만, 히브리어는 지위의 극대 대비와 인간의 필연적 종말을 더 압축적으로 말합니다. 본문은 히브리어의 직접 증언을 우선했습니다.
  doctrine_reference: 원어 우선 원칙; 시락서의 히브리어 본문 우선 번역 원칙
