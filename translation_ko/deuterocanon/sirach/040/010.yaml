translation:
  language: ko
  text: 악한 자들에게는 악이 창조되었고, 그들 때문에 재앙은 완성될 때에야 그칩니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 병행본문은 마지막 절을 “그들 때문에 홍수가 일어났다”로 읽습니다. 히브리어 본문과는 상당히 다릅니다.
    reason: textual_variant
lexical_decisions:
- source_word: על רשע
  english_pob_choice: For the wicked
  chosen_korean: 악한 자들에게는
  alternatives_korean:
  - 악인에게는
  - 악인들에 대하여는
  - 악한 자를 향하여는
  lexicon: HALOT
  rationale: על는 관계·대상·방향을 모두 가질 수 있으므로, 문맥상 ‘악한 자들에 대한/에게’의 관계를 자연스럽게 살려 주는 ‘-에게는’을 택했습니다. רשע는 단수형이지만 대표적·집합적 용법으로 보아 복수화해도 뜻이 흐려지지 않습니다.
- source_word: נבראה רעה
  english_pob_choice: evil was created
  chosen_korean: 악이 창조되었고
  alternatives_korean:
  - 재앙이 창조되었고
  - 재난이 창조되었고
  - 해악이 창조되었고
  lexicon: HALOT
  rationale: רעה는 도덕적 악과 재앙적 불행을 함께 가질 수 있지만, 여기서는 ‘창조되다’와 함께 가장 직접적인 의미인 ‘악’을 살렸습니다. ‘재앙’은 해석을 좁히므로 본문에는 두지 않았습니다.
- source_word: תמוש כלה
  english_pob_choice: will cease only when it is complete
  chosen_korean: 완성될 때에야 그칩니다
  alternatives_korean:
  - 완전히 그칩니다
  - 끝날 때 그칩니다
  - 완결될 때에야 멈춥니다
  lexicon: HALOT
  rationale: תמוש는 ‘떠나다/그치다’의 의미를 가지며, כלה는 ‘완성, 끝, 소멸’의 압축된 표현이어서 ‘완성될 때에야’로 종결성과 완료감을 살렸습니다. 영어의 해석적 요소를 그대로 따라가기보다 히브리어의 압축을 한국어로 풀어 옮겼습니다.
theological_decisions:
- issue: 시편적·지혜문학적 문맥에서 רעה를 도덕적 악으로 보느냐 재앙으로 보느냐
  chosen_reading: ‘악’으로 유지하되, 한국어 독자가 재앙적 결과도 함께 들을 수 있게 문맥을 열어 둠
  alternative_readings:
  - 재앙
  - 재난
  - 해악
  rationale: 히브리어 רעה는 의미 폭이 넓지만, 본문은 ‘창조’와 연결된 일반 진술이므로 가장 직접적인 ‘악’을 본문에 두고 과도한 협소화를 피했습니다.
  doctrine_reference: 원어 우선 번역 원칙, 의미 폭 보존
