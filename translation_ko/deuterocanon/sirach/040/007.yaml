base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/040/007.yaml
  text: Again he prepares for battle[a], and he wakes up, and there is no terror; then he finds rest.
  footnotes:
  - marker: a
    text: 'Hebrew: ''Again he arranges for battle, and he wakes up, and there is no terror; then he finds rest.'' The Greek parallel differs notably, with wording closer to ''at the time of his deliverance he was awakened, marveling that there was no fear.'' The main text follows the surviving Hebrew witness as the primary source for Sirach where extant.'
    reason: alternative_reading
translation:
  language: ko
  text: 또다시 그는 전쟁을 준비하고, 깨어납니다. 그러나 두려움은 없습니다. 그러고 나서 그는 쉼을 얻습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 ‘또다시 그는 전쟁을 준비하고, 깨어나며, 두려움이 없고, 쉼을 얻는다’는 흐름입니다. 그리스어 병행본은 ‘그의 구원의 때에 깨어나 두려움이 없음을 이상히 여기다’에 가까워 상당히 다릅니다.
    reason: source_note
lexical_decisions:
- source_word: עוד
  english_pob_choice: Again
  chosen_korean: 또다시
  alternatives_korean:
  - 다시
  - 또
  - 거듭
  lexicon: HALOT
  rationale: 반복되는 상황의 재개를 자연스럽게 드러내면서도, 본문이 말하는 ‘또 한 번’의 반복감을 살리기 위해 ‘또다시’를 택했습니다.
- source_word: עורך מלחמה
  english_pob_choice: prepares for battle
  chosen_korean: 전쟁을 준비하고
  alternatives_korean:
  - 전투를 준비하고
  - 전쟁을 정비하고
  - 전열을 갖추고
  lexicon: HALOT
  rationale: עורך는 ‘정리하다/준비하다/배열하다’의 뜻이 있어, 군사적 이미지를 살리되 한국어에서 자연스러운 ‘전쟁을 준비하고’로 옮겼습니다.
- source_word: ואימה אין
  english_pob_choice: and there is no terror
  chosen_korean: 그러나 두려움은 없습니다
  alternatives_korean:
  - 그리고 두려움은 없습니다
  - 그런데 공포는 없습니다
  - 두려움이 없습니다
  lexicon: HALOT
  rationale: 히브리어의 간결한 무동사 표현을 살리면서도, 앞뒤 장면의 반전이 분명하도록 ‘그러나’로 대비를 드러냈습니다. ‘אימה’는 문맥상 ‘두려움/공포’의 범위가 가능하지만, 과장되지 않은 ‘두려움’을 택했습니다.
- source_word: ומצא מנוח
  english_pob_choice: then he finds rest
  chosen_korean: 그러고 나서 그는 쉼을 얻습니다
  alternatives_korean:
  - 그리고 그는 쉼을 찾습니다
  - 마침내 그는 쉼을 얻습니다
  - 그리하여 그는 휴식을 얻습니다
  lexicon: HALOT
  rationale: מנוח는 단순한 휴식보다 ‘안식/쉼’의 정서를 포함하므로, 현대 문체에서 자연스럽고도 의미를 보존하는 ‘쉼을 얻습니다’를 사용했습니다.
theological_decisions:
- issue: 꿈/각성의 전개 속에서 두려움의 부재와 쉼의 획득을 어떻게 드러낼지
  chosen_reading: 겉으로는 전쟁 준비처럼 보였던 상황이 깨어난 뒤 아무 두려움이 아니었음이 드러나고, 그 결과 쉼에 이르는 흐름으로 읽었습니다.
  alternative_readings:
  - 전쟁이 실제로 끝난 뒤 두려움 없이 쉰다는 읽기
  - 단순한 생존/안전의 묘사로 보는 읽기
  rationale: 히브리어 본문은 꿈같은 전개를 압축적으로 제시하므로, 깨어남-두려움 없음-쉼의 순서를 그대로 살려 본문의 정서적 반전을 유지했습니다.
  doctrine_reference: 문학적/지혜문학적 해석
