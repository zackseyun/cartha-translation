base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/040/005.yaml
  text: Yet envy[a], anxiety, and fear, and the dread of death, bring contention in abundance; and at the time of his rest upon his bed[b], the sleep of night changes his misery.
  footnotes:
  - marker: a
    text: The Hebrew phrase rendered 'bring contention in abundance' is compressed and somewhat uncertain. The Greek parallel more explicitly lists additional disturbances such as anger and strife.
    reason: alternative_reading
  - marker: b
    text: Or 'changes his distress' or 'alters his trouble.' The Hebrew likely refers to the sufferer's afflicted condition, not moral evil.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 시기심과 걱정과 두려움, 죽음의 공포는 싸움을 많이 일으킵니다. 그리고 그가 자기 침상에서 쉴 때에는 밤의 잠이 그의 괴로움을 바꿔 놓습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 압축된 표현을 풀어 옮긴 것입니다. 그리스어 병행본문은 분노와 다툼 같은 추가적 불안을 더 분명히 보여 줍니다.
    reason: source_note
  - marker: b
    text: ‘괴로움’은 사람의 악함이 아니라 고통받는 상태를 가리키는 이해에 따른 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: קנאה
