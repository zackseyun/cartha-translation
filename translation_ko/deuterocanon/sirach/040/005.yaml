- source_word: תחרה ורב
  english_pob_choice: bring contention in abundance
  chosen_korean: 싸움을 많이 일으킵니다
  alternatives_korean:
  - 다툼을 크게 일으킵니다
  - 분쟁을 한껏 일으킵니다
  lexicon: HALOT
  rationale: 히브리어가 압축적이고 난해하므로, 그리스어의 ‘분노와 다툼’이 암시하는 갈등의 결과를 반영해 ‘싸움을 많이 일으킵니다’로 풀었습니다.
- source_word: רעתו
  english_pob_choice: his misery
  chosen_korean: 그의 괴로움
  alternatives_korean:
  - 그의 고통
  - 그의 비참함
  - 그의 악
  lexicon: HALOT
  rationale: 여기서 רעה는 도덕적 악이 아니라 고통받는 상태를 가리키므로, 문맥에 맞는 ‘괴로움’을 택했습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행본문의 관계
  chosen_reading: 본문은 살아 있는 히브리어를 따라 번역하되, 난해한 압축 표현인 ‘תחרה ורב’는 그리스어 병행본문이 보여 주는 다툼/분쟁의 뜻을 참고해 풀어 옮겼습니다.
  alternative_readings:
  - 히브리어를 매우 직역해 ‘경쟁하며 많다’처럼 모호하게 옮김
  - 그리스어를 따라 분노와 다툼을 항목별로 모두 확장함
  rationale: 시락서는 히브리어가 남아 있는 경우 히브리어를 우선하되, 병행 그리스어가 의미를 밝히는 보조 증거로 기능합니다. 이 절은 특히 압축적이어서 그리스어가 문맥 이해에 도움이 됩니다.
  doctrine_reference: 'PHILOSOPHY.md: translate from Hebrew where Sirach survives; use Greek parallel as actual input'
