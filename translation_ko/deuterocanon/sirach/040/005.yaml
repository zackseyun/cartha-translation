    rationale: 각주 a는 첫 문장의 난해 구절에, b는 ‘괴로움’에 붙여야 합니다. b 각주는 ‘고통’과 ‘곤경’이라는 가능한 번역을 밝혀 영어 감사 기록의 어휘적 불확실성을 보존해야 합니다.
