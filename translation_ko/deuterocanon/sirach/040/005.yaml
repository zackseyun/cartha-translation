revisions:
- from: 그러나 시기심과 걱정과 두려움, 죽음의 공포는 싸움을 많이 일으킵니다. 그리고 그가 자기 침상에서 쉴 때에는 밤의 잠이 그의 괴로움을 바꿔 놓습니다.[a][b]
