translation:
  language: ko
  text: 그가 어머니의 태에서 나오는 날부터, 모든 살아 있는 것의 어머니에게로 돌아가는 날까지입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘모든 살아 있는 것의 어머니에게’입니다. 이 표현은 시적 은유로, 문맥상 인간이 죽음에서 돌아가는 공통의 근원 또는 땅을 가리키는 것으로 이해됩니다. 그리스어 병행본문은 이를 ‘죽음의 날’로 더 분명히 드러냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מיום צאתו
  english_pob_choice: from the day he comes out
  chosen_korean: 그가 ... 나오는 날부터
  alternatives_korean:
  - 태어난 날부터
  - 나온 날부터
  lexicon: HALOT
  rationale: מן+יום의 시작점을 살려 기간의 출발점을 분명히 했고, צאתו는 출생 맥락에서 ‘나오는’으로 구체적 이미지를 유지했습니다.
- source_word: מרחם אמו
  english_pob_choice: from his mother's womb
  chosen_korean: 어머니의 태에서
  alternatives_korean:
  - 어머니의 자궁에서
  - 어머니의 품에서
  lexicon: HALOT
  rationale: רחם의 신체적이고 출생적인 이미지를 반영하기 위해 ‘태’를 택했습니다.
- source_word: עד יום שובו
  english_pob_choice: until the day he returns
  chosen_korean: '... 돌아가는 날까지'
  alternatives_korean:
  - '... 돌아오는 날까지'
  - '... 돌아갈 날까지'
  lexicon: HALOT
  rationale: שוב는 생명의 종착점으로의 ‘돌아감’을 나타내므로, 출생과 대구를 이루는 동사형으로 옮겼습니다.
- source_word: אל אם כל חי
  english_pob_choice: to the mother of all the living
  chosen_korean: 모든 살아 있는 것의 어머니에게
  alternatives_korean:
  - 모든 생명의 어머니에게
  - 만물의 어머니에게
  - 땅에게
  lexicon: HALOT
  rationale: 히브리어의 시적 은유를 본문에서 유지하여, 죽음의 장소를 직접 해석해 넣지 않고 ‘모든 살아 있는 것의 어머니’라는 표현을 살렸습니다.
theological_decisions:
- issue: ‘모든 살아 있는 것의 어머니’라는 은유의 처리
  chosen_reading: 본문에는 은유를 그대로 두고, 죽음을 노골적으로 풀어 쓰지 않았습니다.
  alternative_readings:
  - 땅에게
  - 무덤에게
  - 죽음으로
  rationale: 히브리어 원문의 시적 표현을 보존하는 것이 우선이며, 생명과 죽음의 경계를 상징적으로 드러내는 구절의 힘을 유지합니다.
  doctrine_reference: 원문 우선 번역 원칙; 해석 과잉 방지
