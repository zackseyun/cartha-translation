lexical_decisions:
- source_word: כָּל הַבָּא עָלֶיךָ
  english_pob_choice: whatever comes upon you
  chosen_korean: 네게 닥치는 모든 것
  alternatives_korean:
  - 네게 오는 모든 것
  - 네게 닥쳐오는 모든 것
  lexicon: HALOT
  rationale: 히브리어는 ‘네 위로 오는 모든 것’을 뜻하므로, 자연스러운 현대 한국어로는 ‘닥치는 모든 것’이 가장 직접적입니다.
- source_word: קַבֵּל
  english_pob_choice: accept
  chosen_korean: 받아들이고
  alternatives_korean:
  - 받아들이십시오
  - 수용하고
  lexicon: HALOT
  rationale: 명령형의 태도를 살리면서도, 고난의 상황을 거부하지 말고 수용하라는 뜻을 한국어로 자연스럽게 옮겼습니다.
- source_word: וּבְשִׁבְרְךָ
  english_pob_choice: in the changes of your humiliation
  chosen_korean: 굴욕 가운데서
  alternatives_korean:
  - 당신의 깨어짐 가운데서
  - 당신의 굴욕의 변화 속에서
  lexicon: HALOT
  rationale: 히브리어의 ‘깨짐/부서짐’과 그리스어 병행본문의 ‘굴욕/낮아짐’이 함께 주는 의미를 살려, ‘굴욕 가운데서’로 간결하게 반영했습니다.
- source_word: הַאֲרֵךְ רוּחַ
  english_pob_choice: be patient
  chosen_korean: 참으십시오
  alternatives_korean:
  - 인내하십시오
  - 오래 참으십시오
  lexicon: HALOT
  rationale: 직역된 ‘영을 길게 하다’보다 현대 한국어의 권고문에서 가장 분명한 대응은 ‘참으십시오’입니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 평행본문의 차이를 어떻게 반영할지
  chosen_reading: 본문은 히브리어의 기본 뜻을 따르되, ‘굴욕’이라는 상태를 중심으로 한국어를 정리했습니다.
  alternative_readings:
  - ‘당신의 깨어짐 가운데서’
  - ‘굴욕의 변화 속에서’
  rationale: 이 절은 히브리어가 다소 난해하고, 그리스어 평행본문이 ‘낮아짐/굴욕’의 상태를 분명히 하므로, 두 증인을 함께 고려한 중간형 번역이 적절합니다.
