  lexicon: HALOT
  rationale: 히브리어의 ‘깨짐/부서짐’과 그리스어 병행본문의 ‘굴욕/낮아짐’이 함께 주는 의미를 살려, ‘굴욕 가운데서’로 간결하게 반영했습니다.
- source_word: הַאֲרֵךְ רוּחַ
  english_pob_choice: be patient
  chosen_korean: 참으십시오
  alternatives_korean:
