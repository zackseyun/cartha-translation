  text: Woe to the faint of heart and the slack hands[a], and to the sinner of crooked ways.
  footnotes:
  - marker: a
    text: Hebrew literally, 'and to the wicked/sinner of crooked ways' or 'twisted paths'; the Greek parallel reads 'the sinner who walks on two paths,' which likely reflects the intended sense of divided or duplicitous conduct.
    reason: alternative_reading
translation:
  language: ko
  text: 마음이 약한 이들과 손이 늘어진 이들에게, 그리고 두 길을 걷는 죄인에게 화가 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘굽은 길의 죄인’ 또는 ‘삐뚤어진 길’로도 읽을 수 있으나, 그리스어 병행문은 ‘두 길을 밟는 죄인’으로 이해하게 합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אוֹי
  english_pob_choice: Woe
  chosen_korean: 화가 있습니다
  alternatives_korean:
  - 슬프다
  - 아아
  - 재앙이 있습니다
  lexicon: HALOT
  rationale: 예언적 경고와 탄식을 함께 담는 감탄사로서, 현대 한국어에서는 직접적인 저주·경고의 힘을 살리는 ‘화가 있습니다’가 가장 자연스럽습니다.
- source_word: לְרַכֵּי לֵב
  english_pob_choice: to the faint of heart
  chosen_korean: 마음이 약한 이들
  alternatives_korean:
  - 겁이 많은 이들
  - 소심한 이들
  - 연약한 마음의 이들
  lexicon: HALOT
  rationale: 직역보다 한국어 관용에 맞게 ‘마음이 약하다’로 옮기되, 부정적 의미의 두려움과 결단 부족을 드러내도록 했습니다.
- source_word: וּרְפֵה יָדָיִם
  english_pob_choice: and the slack hands
  chosen_korean: 손이 늘어진 이들
  alternatives_korean:
  - 힘없는 손들
  - 축 늘어진 손들
  - 무기력한 이들
  lexicon: HALOT
  rationale: 손의 힘과 결의가 풀린 상태를 구체적으로 살리기 위해, 완곡한 추상어보다 몸의 이미지를 유지하는 표현을 택했습니다.
- source_word: עִקֵּשׁ דְּרָכַיִם
  english_pob_choice: who walks on two paths
  chosen_korean: 두 길을 걷는 죄인
  alternatives_korean:
  - 굽은 길을 걷는 죄인
  - 삐뚤어진 길의 죄인
  - 두 마음으로 걷는 죄인
  lexicon: HALOT
  rationale: 히브리어는 난해하지만 병행하는 그리스어가 ‘두 길/두 길목’의 의미를 분명히 해 주므로, 분열된 행실과 우유부단함을 드러내는 방향으로 옮겼습니다.
theological_decisions:
- issue: 마지막 절구의 히브리어 난해함과 그리스어 병행문의 해석 관계
  chosen_reading: 본문에는 그리스어 병행문이 드러내는 ‘두 길을 걷는 죄인’의 의미를 반영했습니다.
  alternative_readings:
  - 굽은 길의 죄인
  - 삐뚤어진 길의 죄인
  rationale: 이 구절은 전승상 마지막 표현이 다소 어색하므로, 의미를 무리 없이 전달하는 병행문의 증거를 반영하되 히브리어의 길-이미지는 유지했습니다.
  doctrine_reference: 'PHILOSOPHY.md: 히브리어를 우선하되, 살아 있는 병행 증거로 의미를 보정하고 과도한 해석은 피함'
