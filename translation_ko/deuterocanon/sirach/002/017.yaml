translation:
  language: ko
  text: 야훼를 경외하는 이들은 마음을 준비하고, 그분 앞에서 그들의 영을 낮출 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 헬라어 병행 본문은 ‘그들의 혼(souls)’이라고 읽습니다. 본문은 히브리어 증언을 따라 ‘영’으로 옮겼습니다.
    reason: textual_variant
lexical_decisions:
- source_word: יִרְאֵי יְהֹוָה
  english_pob_choice: those who fear Yahweh
  chosen_korean: 야훼를 경외하는 이들
  alternatives_korean:
  - 야훼를 두려워하는 이들
  - 야훼를 공경하는 이들
  lexicon: HALOT
  rationale: 히브리어 관용구는 야훼를 향한 언약적 경외를 가리키므로, ‘경외하다’가 한국어에서 의미를 가장 안정적으로 전달합니다. POB의 ‘Yahweh’를 따라 야훼를 유지했습니다.
- source_word: יָכִינוּ לְבָבָם
  english_pob_choice: will prepare their hearts
  chosen_korean: 자기 마음을 준비하고
  alternatives_korean:
  - 자기 마음을 갖추고
  - 자기 마음을 세우고
  lexicon: HALOT
  rationale: כון의 히필은 ‘준비하다/갖추다’의 뜻이 자연스럽고, 지혜문맥에서 내적 태도를 가다듬는 의미를 살립니다. 한국어에서는 동사 반복을 피하면서도 명령적 준비가 아닌 미래적 결심을 드러내기 위해 ‘준비하고’로 옮겼습니다.
- source_word: לְבָבָם
  english_pob_choice: their hearts
  chosen_korean: 자기 마음
  alternatives_korean:
  - 그들의 마음
  - 그들의 속사람
  lexicon: HALOT
  rationale: 히브리어 לֵבָב은 생각과 의지를 포함한 내면을 뜻하므로, 한국어의 ‘마음’이 가장 자연스럽고 성경적입니다. 소유격은 문맥상 자기지시를 분명히 하기 위해 ‘자기’로 풀었습니다.
- source_word: וּלְפָנָיו
  english_pob_choice: before him
  chosen_korean: 그분 앞에서
  alternatives_korean:
  - 그 앞에서
  - 그분의 앞에서
  lexicon: HALOT
  rationale: 직역하면 ‘그 앞에서’이지만, 한국어에서는 대상을 분명히 드러내는 ‘그분’이 앞선 야훼를 가리키는 점을 명료하게 합니다. 위치관계와 태도 둘 다 살리기 위해 ‘앞에서’를 유지했습니다.
- source_word: יַכְנִיעוּ רוּחָם
  english_pob_choice: they will humble their spirits
  chosen_korean: 자기 영을 낮춥니다
  alternatives_korean:
  - 자기 영을 겸손하게 합니다
  - 자기 영을 낮추어야 합니다
  lexicon: HALOT
  rationale: 히브리어는 ‘영(ruach)’을 명시하므로 단순히 ‘자기 자신을 낮추다’로 일반화하지 않고, POB의 ‘spirits’를 반영해 ‘영’을 살렸습니다. ‘낮추다’는 ταπεινόω의 의미를 자연스럽게 담아내며, 문맥상 미래 서술을 한국어 현재형으로 옮겼습니다.
theological_decisions:
- issue: 야훼(YHWH) 신명 표기
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 히브리어 원문이 יְהֹוָה를 직접 사용하고 POB도 ‘Yahweh’를 채택하므로, 한국어 본문에서도 신명 자체를 보존해 언약적 호칭을 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
