base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/002/018.yaml
  text: Let us fall into the hand of Yahweh[a], and not into the hand of man, for as his greatness is[b], so also is his mercy.
  footnotes:
  - marker: a
    text: Greek has 'hands' in both clauses ('into the hands of the Lord ... not into the hands of men'), while the Hebrew witness reads singular 'hand.' The translation follows the Hebrew as the primary witness here.
    reason: textual_variant
  - marker: b
    text: Or 'his steadfast love.' Hebrew חֶסֶד can denote covenantal kindness or loyal love; the Greek parallel reads 'mercy.'
    reason: lexical_alternative
translation:
  language: ko
  text: 우리는 야훼의 손에 떨어지고 사람의 손에는 떨어지지 맙시다. 그분의 위대하심만큼 그분의 자비도 큽니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 두 절에서 모두 단수 ‘손’을 사용하지만, 그리스어 평행본문은 두 절에서 모두 복수 ‘손들’을 사용합니다. 본문은 히브리어 증언을 따릅니다.
    reason: textual_variant
  - marker: b
    text: 히브리어 חֶסֶד는 ‘자비’, ‘인자’, ‘언약적 사랑’ 등으로 옮길 수 있습니다. 그리스어 평행본문은 ‘자비’를 뜻하는 말을 사용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִפֹּל / ἐμπεσοῦμεθα
  english_pob_choice: Let us fall
  chosen_korean: 떨어져야지
  alternatives_korean:
  - 떨어집시다
  - 떨어지도록 합시다
  - 빠져들어야지
  lexicon: HALOT
  rationale: 히브리어 청유형과 그리스어 미래형의 권고적 힘을 살리되, 한국어에서는 자연스러운 권고 표현으로 옮겼습니다. '떨어지다'는 손에 들어가는 이미지도 보존합니다.
- source_word: בְּיַד / χεῖρας
  english_pob_choice: into the hand
  chosen_korean: 손에
  alternatives_korean:
  - 손 안에
  - 손으로
  - 권세 아래에
  lexicon: HALOT
  rationale: 히브리어 본문이 단수 '손'을 가지며, 영어 POB도 이를 따라 이미지성을 보존했습니다. 한국어도 관용적으로 '손에'가 가장 직접적입니다.
- source_word: יְהֹוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 프로젝트 기본값에 따라 신명기는 음역형 '야훼'로 옮겨, 원문이 드러내는 고유한 언약명 사용을 보존했습니다.
- source_word: כְּגָדְלוֹ
  english_pob_choice: as his greatness is
  chosen_korean: 그분의 위대하심이 그러하듯
  alternatives_korean:
  - 그의 위대함이 그러하듯
  - 그분의 크심이 그러하듯
  - 그의 عظ대하심만큼
  lexicon: HALOT
  rationale: 비교구문 כ...כן의 대응을 살려 '…이 그러하듯 …도 그러합니다'로 옮겼습니다. '위대하심'은 גָּדֹל의 품격과 규모를 함께 반영합니다.
- source_word: חַסְדּוֹ
  english_pob_choice: his mercy
  chosen_korean: 자애
  alternatives_korean:
  - 자비
  - 긍휼
  - 인자
  lexicon: HALOT
  rationale: 히브리어 חֶסֶד는 언약적 선의와 자비를 함께 가리키며, 여기서는 그리스어 ἔλεος와도 맞물립니다. 한국어 '자애'는 과도하게 교회화된 표현을 피하면서도 친절한 자비의 의미를 살립니다.
theological_decisions:
- issue: 야훼의 손과 사람의 손 사이의 대조
  chosen_reading: 하나님의 보호와 인간 의존의 대비가 아니라, 야훼의 처분 아래 자신을 두는 신뢰의 권고로 읽었습니다.
  alternative_readings:
  - 재난 속에서 더 덜 해로운 피해를 선택하는 실용적 충고
  - 단순한 운명론적 체념
  rationale: 문맥상 지혜문학적 권고이며, '사람의 손'보다 '야훼의 손'을 택하라는 신앙적 신뢰를 강조합니다. '떨어져야지'는 능동적 신뢰의 결단을 보여 줍니다.
  doctrine_reference: Sirach 2:18 문맥; 신뢰와 섭리의 권고 문장
- issue: חֶסֶד의 번역
  chosen_reading: 자애
  alternative_readings:
  - 자비
  - 인자
  - 언약적 사랑
  rationale: 이 절은 야훼의 גדולה와 חֶסֶד를 대응시키므로, 단순 감정으로서의 자비보다 넓은 선의와 호의가 드러나도록 했습니다. 동시에 전통적 교회어인 '인자'는 현대 한국어에서 의미가 흐려져 피했습니다.
  doctrine_reference: Sirach 2:18; חסד의 지혜문학적 용례
