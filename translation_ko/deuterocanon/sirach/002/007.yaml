translation:
  language: ko
  text: 야훼를 경외하는 이들아, 그의 자비를 기다리십시오. 넘어지지 않도록 곁길로 벗어나지 마십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 חסד는 문맥에 따라 언약적 신실함, 인애, 자비를 아우를 수 있습니다. 이 절은 그리스어 평행본문의 ἔλεος가 뒷받침하므로 본문에서는 ‘자비’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְאֵי יְהֹוָה / οἱ φοβούμενοι Κύριον
  english_pob_choice: You who fear Yahweh / the LORD
  chosen_korean: 야훼를 경외하는 이들아
  alternatives_korean:
  - 주를 두려워하는 이들아
  - 야훼를 두려워하는 이들아
  lexicon: HALOT; BDAG
  rationale: 히브리어 분사구와 그리스어 분사구가 모두 대상을 직접 부르므로, 한국어도 2인칭 호격으로 처리해 권면의 직접성을 살렸습니다. 유다/지혜문학 맥락에서 '경외하다'가 단순 공포보다 합당한 경건 반응을 더 정확히 드러냅니다.
- source_word: חַכּוּ / ἀναμείνατε
  english_pob_choice: wait for
  chosen_korean: 기다리십시오
  alternatives_korean:
  - 기다리세요
  - 기다리십시오
  - 기다리며 바라보십시오
  lexicon: HALOT; BDAG
  rationale: 명령형의 인내적 기대를 자연스러운 현대 한국어로 옮겼습니다. 목적어가 뒤따르는 구조를 유지하면서도 과도한 해석인 '바라보다'는 피했습니다.
- source_word: לְחַסְדּוֹ / τὸ ἔλεος αὐτοῦ
  english_pob_choice: his mercy
  chosen_korean: 그의 자비
  alternatives_korean:
  - 그의 긍휼
  - 그의 인자하심
  - 그의 자비와 사랑
  lexicon: HALOT; BDAG
  rationale: 히브리어 חסד의 폭이 있으나, 평행하는 그리스어 ἔλεος가 '자비' 쪽을 강하게 지지하므로 이 절에서는 '자비'가 가장 직접적입니다. 교회 전통어 '긍휼'도 가능하지만, 현대 문맥에서는 '자비'가 더 분명합니다.
- source_word: וְאַל תִּטּוּ / καὶ μὴ ἐκκλίνητε
  english_pob_choice: do not turn aside
  chosen_korean: 옆길로 벗어나지 마십시오
  alternatives_korean:
  - 벗어나지 마십시오
  - 옆으로 치우치지 마십시오
  - 길에서 벗어나지 마십시오
  lexicon: HALOT; BDAG
  rationale: 동사가 가리키는 '길에서 옆으로 비켜남'의 이미지를 살려 경고의 비유를 한국어로 구체화했습니다. 단순히 '떠나지 말라'보다 원문의 방향성 은유가 더 잘 보입니다.
- source_word: פֶּן תִּפֹלוּ / ἵνα μὴ πέσητε
  english_pob_choice: lest you fall
  chosen_korean: 그러면 넘어질까 합니다
  alternatives_korean:
  - 그리하면 넘어질 것입니다
  - 그렇지 않으면 넘어집니다
  - 넘어지지 않도록
  lexicon: HALOT; BDAG
  rationale: פן과 ἵνα μή가 가진 경고적 결과/목적 뉘앙스를 한국어의 예고형으로 옮겼습니다. 다만 한국어에서 'lest'의 고어성을 피하면서도 위협적 결과를 살리기 위해 완곡한 경계 표현을 사용했습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 이 프로젝트의 기본 원칙에 따라 히브리어 본문의 신명 표기를 '야훼'로 옮겼습니다. 그리스어 평행본문의 Κύριον도 본문 의미상 이 신명과 대응하므로, '주님'으로 일반화하지 않았습니다.
  doctrine_reference: 'PROJECT GLOSSARY: יהוה / YHWH → 야훼'
- issue: חסד와 ἔλεος의 공조
  chosen_reading: 자비
  alternative_readings:
  - 인애
  - 긍휼
  - 인자하심
  rationale: 히브리어 단독의 '언약적 사랑'으로 넓히기보다, 그리스어 평행의 ἔλεος가 제시하는 더 직접적인 의미를 따랐습니다. 따라서 이 절에서는 하나님의 베푸시는 긍휼을 뜻하는 '자비'가 가장 주석적으로 안전합니다.
  doctrine_reference: 'PROJECT GLOSSARY: χάρις/ἔλεος 관련 번역 원칙'
