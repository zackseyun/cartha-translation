translation:
  language: ko
  text: 야훼를 두려워하는 사람들은 그분의 은총을 구할 것이며, 그분을 사랑하는 사람들은 그분의 율법[b]을 배울 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '그리스어 평행문: ‘그분을 사랑하는 사람들은 율법으로 가득 차게 될 것입니다.’'
    reason: alternative_reading
  - marker: b
    text: 또는 ‘그분의 가르침’.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְאֵי יְהֹוָה
  english_pob_choice: those who fear Yahweh
  chosen_korean: 야훼를 두려워하는 사람들
  alternatives_korean:
  - 야훼를 경외하는 사람들
  - 야훼를 두려워하는 자들
  lexicon: HALOT
  rationale: 히브리어의 분사적 구성은 ‘~하는 사람들’로 자연스럽게 옮기되, פחד/ירא 계열의 경외·두려움의 긴장을 살리기 위해 ‘두려워하는’으로 두었습니다.
- source_word: רְצוֹנוֹ
  english_pob_choice: his favor
  chosen_korean: 그의 은총
  alternatives_korean:
  - 그의 호의
  - 그의 뜻
  - 그의 기쁨
  lexicon: HALOT
  rationale: 히브리어 רצון과 그리스어 εὐδοκία는 ‘호의/은총/기쁨’의 의미권을 가지므로, 현대 한국어에서 신적 호의를 가장 자연스럽게 드러내는 ‘은총’을 택했습니다.
- source_word: וְאֹהֲבָיו
  english_pob_choice: and those who love him
  chosen_korean: 그를 사랑하는 사람들
  alternatives_korean:
  - 그를 사랑하는 자들
  - 그의 사랑하는 이들
  lexicon: HALOT
  rationale: 소유격 접미사가 하나님을 가리키므로, 인격적 헌신을 드러내는 ‘그를 사랑하는 사람들’이 가장 सीधे합니다.
- source_word: תוֹרָתוֹ
  english_pob_choice: his law
  chosen_korean: 그의 율법
  alternatives_korean:
  - 그의 가르침
  - 그의 교훈
  - 그의 instruction
  lexicon: HALOT
  rationale: 토라의 율법적·언약적 무게를 살리기 위해 기본 번역은 ‘율법’으로 두었고, 영어 주석의 대안인 ‘instruction’은 본문보다는 주해적 선택에 가깝습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 평행문의 두 번째 절 차이
  chosen_reading: 본문은 히브리어를 따라 ‘그의 율법을 배울 것입니다’로 옮기고, 그리스어 평행문의 ‘율법으로 채워질 것입니다’는 각주로 보존합니다.
  alternative_readings:
  - 그리스어 평행문을 따라 ‘율법으로 채워질 것입니다’
  rationale: 시라서에서는 현존하는 히브리어가 우선이므로, 주 본문은 히브리어의 의미를 따르고 그리스어의 실질적 차이는 투명하게 각주로 남겨야 합니다.
  doctrine_reference: 'PHILOSOPHY.md: Sirach는 히브리어가 보존될 때 이를 우선하되, 주요 이문은 각주로 공개한다.'
