  text: Cling to him and do not turn away[a], so that you may be exalted in your latter end.
  footnotes:
  - marker: a
    text: Or 'so that you may grow great in your latter end.' The Hebrew says 'grow/become great,' while the Greek parallel has 'be increased.'
