  text: Cling to him and do not turn away[a], so that you may be exalted in your latter end.
  footnotes:
  - marker: a
    text: Or 'so that you may grow great in your latter end.' The Hebrew says 'grow/become great,' while the Greek parallel has 'be increased.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그에게 꼭 붙어 있으십시오. 그리고 떠나지 마십시오. 그러면 당신의 마지막에 커지실 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘커지다/위대해지다’의 뜻이고, 그리스어 평행문은 ‘증가하다’의 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִדָּבֵק
  english_pob_choice: Cling
  chosen_korean: 꼭 붙어 있으십시오
  alternatives_korean:
  - 굳게 붙으십시오
  - 달라붙으십시오
  - 붙드십시오
  lexicon: HALOT
  rationale: דבק의 핵심은 느슨한 접촉이 아니라 긴밀한 결속이므로, 현대 한국어에서 관계적 밀착을 자연스럽게 드러내는 ‘꼭 붙어 있으십시오’로 옮겼습니다.
- source_word: בּוֹ / αὐτῷ
  english_pob_choice: to him
  chosen_korean: 그에게
  alternatives_korean:
  - 그분에게
  - 그에게로
  lexicon: HALOT
  rationale: 히브리어와 그리스어의 남성 단수 대명사는 앞 문맥의 하나님을 가리키므로, 문맥상 자연스러운 인칭 대명사 ‘그에게’로 구체화했습니다.
- source_word: וְאַל תָּסוּר / μὴ ἀποστῇς
  english_pob_choice: and do not turn away
  chosen_korean: 그리고 떠나지 마십시오
  alternatives_korean:
  - 그리고 물러서지 마십시오
  - 그리고 돌아서지 마십시오
  - 그리고 벗어나지 마십시오
  lexicon: HALOT
  rationale: סור와 ἀποστῆς는 관계에서 벗어나거나 떠나는 의미를 가지므로, 단순한 방향 전환보다 관계적 이탈을 살린 ‘떠나지 마십시오’가 적절합니다.
- source_word: תִּגְדַּל / αὐξηθῇς
  english_pob_choice: you may be exalted
  chosen_korean: 커지실 것입니다
  alternatives_korean:
  - 크게 되실 것입니다
  - 높아지실 것입니다
  - 번성하실 것입니다
  lexicon: HALOT
  rationale: 히브리어 גדל은 ‘커지다/위대해지다’를 뜻하고, 그리스어도 ‘증가하다’의 뜻이므로, 보상적 결과를 과도하게 해석하지 않으면서 본래의 ‘커짐’ 이미지를 살렸습니다.
- source_word: בְּאַחֲרִיתֶךָ / ἐπʼ ἐσχάτων σου
  english_pob_choice: in your latter end
  chosen_korean: 당신의 마지막에
  alternatives_korean:
  - 당신의 마지막 때에
  - 당신의 끝에
  - 당신의 마지막 결과에
  lexicon: HALOT
  rationale: אַחֲרִית과 ἔσχατα는 단순한 시간표현보다 최종 결과와 결말을 가리키므로, 현대 한국어에서 간결하게 ‘당신의 마지막에’로 옮겼습니다.
theological_decisions:
- issue: 대상인 ‘그’의 정체
  chosen_reading: ‘그’는 앞 문맥의 하나님을 가리키는 직접적 호칭으로 읽었습니다.
  alternative_readings:
  - 지혜 또는 가르침을 가리키는 일반적 대상
  rationale: 히브리어와 그리스어 모두 새 선행사를 도입하지 않고 남성 단수 대명사를 사용하며, 문맥상 하나님을 향한 권면이 이어집니다.
  doctrine_reference: 문맥 우선 원칙
- issue: 마지막 보상의 성격
  chosen_reading: 마지막 결과에서의 ‘커짐’은 물질적 번영으로 축소하지 않고, 하나님이 주시는 최종적 고양/증가로 보존했습니다.
  alternative_readings:
  - 부귀 번성
  - 단순한 성장
  rationale: 히브리어 גדל과 그리스어 αὐξηθῇς는 둘 다 ‘증가/커짐’을 뜻하므로, 본문이 약속하는 종말적 결과의 폭을 좁히지 않도록 했습니다.
  doctrine_reference: '번역 철학 §3: 신학적 긴장을 해소하지 말고 보존한다'
