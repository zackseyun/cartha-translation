translation:
  language: ko
  text: 금은 불에서 시험을 받고[a], 받아들여진 사람들은 고난의 풀무에서 시험을 받습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 둘째 행의 표현은 해석하기 어렵습니다. 그리스어 병행본문은 ‘비천함의 풀무에서 받아들여진 사람들’로 읽습니다. 본문은 이 병행본문을 따라 ‘받아들여진 사람들’로 옮겼으며, ‘고난’은 히브리어와 그리스어가 가리킬 수 있는 시련과 비천함의 넓은 의미를 반영합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יִבָּחֵן
  english_pob_choice: is tested
  chosen_korean: 시험을 받습니다
  alternatives_korean:
  - 검증됩니다
  - 검사받습니다
  - 단련됩니다
  lexicon: HALOT
  rationale: בחן은 ‘시험하다/검증하다’의 뜻이므로, 금속과 사람을 함께 아우르는 문맥에서 ‘시험을 받다’가 가장 자연스럽고 원문의 능동적 검증 의미를 잘 드러냅니다.
- source_word: זָהָב
  english_pob_choice: gold
  chosen_korean: 금
  alternatives_korean:
  - 황금
  - 금속
  lexicon: HALOT
  rationale: 히브리어 זָהָב의 직접 대응어로 ‘금’이 가장 간결하고 정확합니다.
- source_word: בְּכוּר עֹנִי
  english_pob_choice: men who are accepted ... in the furnace of affliction
  chosen_korean: 고난의 용광로
  alternatives_korean:
  - 고난의 풀무
  - 환난의 용광로
  - 고난의 도가니
  lexicon: LSJ
  rationale: 히브리어 본문은 난점이 있지만 그리스어 병행본문의 καμίνῳ ταπεινώσεως가 ‘용광로/풀무’ 이미지를 분명히 보여 주므로, 시련의 이미지를 살려 ‘고난의 용광로’로 옮겼습니다.
- source_word: ἄνθρωποι δεκτοί / בְּנֵי אָדָם בְּכוּר
  english_pob_choice: men who are accepted
  chosen_korean: 사람은 시험을 받습니다
  alternatives_korean:
  - 받아들여진 사람은 시험을 받습니다
  - 인정받은 사람은 시험을 받습니다
  - 사람은 받아들여진 자로서 시험을 받습니다
  lexicon: HALOT
  rationale: 영어 POB가 히브리어의 난해한 표현을 그리스어 병행본문으로 안정화하고 있으므로, 본문 흐름상 두 번째 행의 주어를 일반적 인간으로 유지하되 ‘시험을 받습니다’를 반복해 병행성을 살렸습니다.
theological_decisions:
- issue: 히브리어 난구절을 그리스어 병행본문으로 보정하는 방식
  chosen_reading: 두 번째 행을 ‘사람은 고난의 용광로에서 시험을 받습니다’로 옮겨, 시련 속에서 사람의 판별이 이루어진다는 지혜문학적 평행을 살렸습니다.
  alternative_readings:
  - 히브리어를 더 직역하여 ‘사람은 고난의 풀무 안에 있습니다’로 옮김
  - ‘받아들여진 사람들’의 뉘앙스를 노골적으로 넣음
  rationale: 본문의 히브리어는 난해하지만, 프로젝트 지침상 살아 있는 히브리어를 기본으로 하면서 병행 그리스어를 실제 입력으로 활용할 수 있으므로, 의미를 분명히 하되 과도한 해석은 피했습니다.
  doctrine_reference: 'PHILOSOPHY.md: translate from Hebrew where it survives; use parallel Greek as actual translation input'
