  text: You who fear Yahweh[a], trust in him, and your reward will not be delayed.
  footnotes:
  - marker: a
    text: Hebrew literally, 'and he will not let your reward remain overnight,' an idiom that is difficult in English; the Greek parallel reads, 'and you will certainly not lose your reward.'
    reason: alternative_reading
translation:
  language: ko
  text: 야훼를 경외하는 이들아, 그를 신뢰하십시오. 그분은 너희의 보상을 하룻밤도 지체시키지 않으실 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어를 직역하면 “그는 너희의 보상을 밤새 머무르게 하지 않을 것이다”입니다. 이 표현은 보상이 하룻밤이라도 지체되지 않음을 뜻하는 것으로 이해될 수 있습니다. 그리스어 평행문은 “너희는 결코 너희의 보상을 잃지 않을 것이다”라고 읽습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יִרְאֵי יְהֹוָה
  english_pob_choice: You who fear Yahweh
  chosen_korean: 야훼를 두려워하는 이들아
  alternatives_korean:
  - 주님을 두려워하는 이들아
  - 야훼를 경외하는 이들아
  lexicon: BDB/HALOT
  rationale: 히브리어 분사 복수형은 직접 호소로 쓰였으므로 한국어도 호격으로 살렸고, יְהֹוָה는 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
- source_word: הַאֲמִינוּ בּוֹ
  english_pob_choice: trust in him
  chosen_korean: 그를 신뢰하십시오
  alternatives_korean:
  - 그를 믿으십시오
  - 그에게 의지하십시오
  lexicon: HALOT
  rationale: אמן + ב의 의미는 단순 지적 동의보다 의탁/신뢰에 가깝기 때문에, 권면체에서는 ‘신뢰하십시오’가 가장 자연스럽고 source-direct합니다.
- source_word: וְהוּא לֹא יָלִין
  english_pob_choice: and your reward will not be delayed
  chosen_korean: 그러면 … 늦어지지 않을 것입니다
  alternatives_korean:
  - 그리고 그는 너희의 보상을 밤새 머물게 하지 않을 것입니다
  - 그러면 너희의 보상은 사라지지 않을 것입니다
  lexicon: BDB/HALOT
  rationale: לין의 직역인 ‘밤새 머물다’는 한국어에서 어색하므로, 히브리어의 지연 이미지와 영어 POB의 의미 판단을 함께 반영해 ‘늦어지지 않다’로 옮겼습니다.
- source_word: שְׂכַרְכֶם
  english_pob_choice: your reward
  chosen_korean: 너희의 보상
  alternatives_korean:
  - 너희의 상급
  - 너희의 삯
  lexicon: HALOT
  rationale: 지혜문맥의 שכר는 ‘삯’도 가능하지만, 여기서는 하나님이 주시는 갚음의 의미가 두드러져 ‘보상’이 가장 무난합니다.
theological_decisions:
- issue: Tetragrammaton rendering in Sirach
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문은 יְהֹוָה를 직접 사용하므로 프로젝트 기본값에 따라 신명은 ‘야훼’로 보존했습니다. 시편/지혜문학의 경외 호소를 흐리지 않기 위해 국내 교회 전통어보다 स्रोत 직결형을 택했습니다.
  doctrine_reference: 'POB glossary: יהוה / YHWH → 야훼'
- issue: Final clause tension between Hebrew and Greek
  chosen_reading: 보상은 늦어지지 않을 것입니다
  alternative_readings:
  - 보상을 잃지 않을 것입니다
  - 보상을 밤새 머물게 하지 않을 것입니다
  rationale: 히브리어는 ‘밤에 머무르다’는 표상이 있고, 그리스어 평행문은 ‘잃지 않다’로 분명히 풀어줍니다. 본문은 두 증언 사이의 긴장을 지우지 않되, 한국어로는 의미를 가장 자연스럽게 전달하는 쪽을 채택했습니다.
  doctrine_reference: Source tension preserved; optimal-equivalence per English POB audit trail
