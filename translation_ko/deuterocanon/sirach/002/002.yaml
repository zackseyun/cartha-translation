translation:
  language: ko
  text: 마음을 준비하고, 강건하십시오. 그리고 재앙의 때에 당황하지 마십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 ‘환난의 때에 서두르지 마라’에 가깝습니다. 히브리어는 ‘당황하다/동요하다’에 더 무게를 둡니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הָכֵן
  english_pob_choice: Prepare your heart
  chosen_korean: 마음을 준비하고
  alternatives_korean:
  - 마음을 바로잡고
  - 마음을 정비하고
  - 마음을 정돈하고
  lexicon: HALOT
  rationale: הָכֵן은 ‘준비하다, 정하다, 바로 세우다’의 뜻이므로, 한국어에서는 직역적인 ‘준비하다’가 가장 자연스럽고 본문의 권면 성격도 잘 살립니다.
- source_word: לִבְּךָ
  english_pob_choice: your heart
  chosen_korean: 마음
  alternatives_korean:
  - 심장
  - 내면
  - 속사람
  lexicon: HALOT
  rationale: 히브리어 לֵב는 인지와 의지, 감정을 아우르는 내면을 가리키므로, 표준적인 성경 한국어인 ‘마음’이 가장 적절합니다.
- source_word: וְהִתְחַזֵּק
  english_pob_choice: be strong
  chosen_korean: 강건하십시오
  alternatives_korean:
  - 굳세십시오
  - 강해지십시오
  - 굳건하십시오
  lexicon: HALOT
  rationale: 히트파엘형의 자기-강화/견고함을 살리되, 합쇼체 권면 문맥에 맞게 ‘강건하십시오’로 옮겨 단순 감정이 아니라 지속적 견딤의 뉘앙스를 담았습니다.
- source_word: וְאַל תִּבָּהֵל
  english_pob_choice: do not be alarmed
  chosen_korean: 당황하지 마십시오
  alternatives_korean:
  - 두려워하지 마십시오
  - 놀라지 마십시오
  - 동요하지 마십시오
  lexicon: HALOT
  rationale: בהל은 ‘놀라다, 동요하다, 당황하다’의 폭을 가지므로, 재앙의 상황에서의 급작스러운 내적 흔들림을 드러내는 ‘당황하지 마십시오’가 가장 균형 잡힌 표현입니다.
- source_word: בְּיוֹם אֵד
  english_pob_choice: in a time of calamity
  chosen_korean: 재앙의 때
  alternatives_korean:
  - 재난의 날
  - 환난의 때
  - 멸망의 날
  lexicon: HALOT
  rationale: 직역하면 ‘재앙/파멸의 날’이지만, 한국어에서는 시간적 성격을 자연스럽게 드러내는 ‘재앙의 때’가 본문의 일반적 상황성을 잘 전달합니다.
theological_decisions:
- issue: 히브리어와 그리스어 병행 전승의 마지막 권면 어감
  chosen_reading: 본문은 히브리어의 ‘당황하지 마십시오’를 본문으로 두고, 그리스어가 시사하는 ‘재난/환난의 시기’라는 넓은 상황성은 표현 안에 반영했습니다.
  alternative_readings:
  - 재난의 때에 성급히 서두르지 마십시오
  - 환난의 때에 서두르지 마십시오
  rationale: 이 절은 히브리어가 ‘놀람/동요’에, 그리스어가 ‘서두름/성급함’에 무게를 두므로, 둘을 무리하게 하나로 합치기보다 히브리어를 본문으로 하되 그리스어의 상황 맥락을 보존하는 것이 적절합니다.
  doctrine_reference: 'PHILOSOPHY.md: surviving Hebrew is primary, Greek parallel is real input, preserve tension where present.'
