  text: Prepare your heart[a], and be strong; and do not be alarmed in a time of calamity.
  footnotes:
  - marker: a
    text: 'Greek: ''do not hurry in a time of affliction/visitation.'' The Hebrew emphasizes not being dismayed; the Greek highlights avoiding rash haste under trial.'
