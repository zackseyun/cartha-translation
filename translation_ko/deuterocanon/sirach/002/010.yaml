base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/002/010.yaml
  text: 'Look to the generations of old and see: who believed in Yahweh and was put to shame? Or who trusted in him and was abandoned? Or who called on him and was not answered?[a][b]'
  footnotes:
  - marker: a
    text: 'Greek: ''who remained in his fear and was abandoned?'' The extant Hebrew instead reads ''who trusted in him and was abandoned?'''
    reason: alternative_reading
  - marker: b
    text: 'Greek: ''who called on him, and he overlooked him?'' The Hebrew reads ''who called on him and was not answered?'''
    reason: lexical_alternative
translation:
  language: ko
  text: 옛 세대들을 살펴보십시오. 야훼를 믿고 수치를 당한 이가 누구입니까? 또는 그를 신뢰하고 버림받은 이가 누구입니까?[a] 또는 그에게 부르짖고 응답을 받지 못한 이가 누구입니까?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '그리스어: ‘그를 경외하는 가운데 머물렀으나 버림받은 이가 누구인가?’ 보존된 히브리어는 ‘그를 신뢰하고 버림받은 이가 누구인가?’라고 읽습니다.'
    reason: alternative_reading
  - marker: b
    text: '그리스어: ‘그를 불렀는데 야훼께서 그를 못 본 체하신 이가 누구인가?’ 히브리어는 ‘그에게 부르짖고 응답을 받지 못한 이가 누구인가?’라고 읽습니다.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבִּיטוּ לְדוֹרוֹת רִאשׂוֹנִים
  english_pob_choice: Look to the generations of old
  chosen_korean: 옛 세대들을 살펴보고 보십시오
  alternatives_korean:
  - 옛 세대들을 보십시오
  - 먼 옛 세대들을 살펴보십시오
  lexicon: HALOT
  rationale: 복수 명령형으로 청중에게 역사적 선례를 직접 보게 하는 뜻을 살리면서, 현대 한국어에서 자연스러운 ‘살펴보고 보십시오’로 강조를 유지했습니다.
- source_word: הֶאֱמִין בַּיהֹוָה
  english_pob_choice: believed in Yahweh
  chosen_korean: 야훼를 믿고
  alternatives_korean:
  - 야훼를 믿어
  - 야훼를 신뢰하고
  lexicon: HALOT
  rationale: אמן은 여기서 단순 지적 동의보다 신뢰와 의탁의 의미가 강하므로 ‘믿고’로 옮겼고, 본문의 야훼를 그대로 살렸습니다.
- source_word: וַיֵּבוֹשׁ
  english_pob_choice: was put to shame
  chosen_korean: 부끄러움을 당한
  alternatives_korean:
  - 수치를 당한
  - 망신당한
  lexicon: HALOT
  rationale: בוש의 결과 상태를 한국어의 수동·결과 표현으로 옮겨, 단순한 내적 감정이 아니라 공개적 수치와 좌절의 뉘앙스를 유지했습니다.
- source_word: בָּטַח בּוֹ
  english_pob_choice: trusted in him
  chosen_korean: 그를 신뢰하고
  alternatives_korean:
  - 그에게 의지하고
  - 그를 믿고
  lexicon: HALOT
  rationale: 첫 절의 אמן과 구별되는 בטח의 의탁 의미를 살리기 위해 ‘신뢰하다’를 선택했으며, 반복 구조도 자연스럽게 유지했습니다.
- source_word: וְנֶעֱזַב
  english_pob_choice: was abandoned
  chosen_korean: 버림받은
  alternatives_korean:
  - 버려진
  - 떠나버린
  lexicon: HALOT
  rationale: עזב의 피동 결과를 더 직접적으로 드러내는 표현으로, 하나님께서 책임 있게 돌보지 않으신 상태를 한국어로 분명히 전달합니다.
- source_word: וְלֹא נֶעֱנָה
  english_pob_choice: was not answered
  chosen_korean: 응답받지 못한
  alternatives_korean:
  - 대답받지 못한
  - 들려지지 않은
  lexicon: HALOT
  rationale: 공적·기도적 맥락에서 ‘응답하다’가 가장 정확하며, 신에게 올린 부르짖음이 성취되지 않았음을 자연스럽게 보여 줍니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 이 본문은 히브리어 텍스트에 직접 יְהוָה를 사용하므로, 프로젝트 기본값에 따라 언약 이름을 ‘야훼’로 옮겨 원문 표지를 보존했습니다.
  doctrine_reference: 'Project glossary: יהוה / YHWH → 야훼'
- issue: 히브리어 본문과 그리스어 병행본문의 차이
  chosen_reading: 주 본문은 히브리어를 따르고, 의미 있는 그리스어 차이는 각주로 보존
  alternative_readings:
  - 그리스어의 '주님을 두려워하는 가운데 머문 이'를 본문에 반영
  rationale: 지금 보존된 히브리어가 높게 신뢰되므로 본문은 히브리어를 따르되, 그리스어의 ‘경외 가운데 머물다’와 ‘그를 못 본 체하다’라는 차이는 각주로 드러내어 본문 간 긴장을 숨기지 않았습니다.
  doctrine_reference: 'PHILOSOPHY.md: translate from Hebrew where it survives; use Greek parallel as input'
