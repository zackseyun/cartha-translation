translation:
  language: ko
  text: 희망을 잃은 여러분에게 화가 있습니다! 야훼께서 찾아오실 때에 여러분은 어떻게 하겠습니까?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘찾아오심’은 야훼께서 주의를 기울여 개입하심을 뜻하며, 이 문맥에서는 심판의 의미를 띱니다. 그러나 본문은 이를 직접 ‘심판’이라고 한정하지 않습니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어 평행본문은 ‘희망을 잃은’ 대신 ‘인내’ 또는 ‘참음’을 잃은 이들(ὑπομονήν)이라고 읽습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אוֹי
  english_pob_choice: Woe to
  chosen_korean: 화가 있습니다
  alternatives_korean:
  - 슬프다
  - 화 있을 것입니다
  - 불행합니다
  lexicon: HALOT
  rationale: 히브리어 감탄사 אוֹי의 경고성과 탄식의 힘을 살리면서, 현대 한국어에서 자연스럽고 문어체적인 경고로 읽히도록 옮겼습니다.
- source_word: אוֹבְדֵי תִּקְוָה
  english_pob_choice: who have lost hope
  chosen_korean: 희망을 잃은 여러분
  alternatives_korean:
  - 희망을 잃어버린 사람들
  - 소망을 잃은 자들
  - 희망이 끊어진 여러분
  lexicon: HALOT
  rationale: 히브리어는 ‘희망이 사라진 사람들’을 가리키므로, 직역적이면서도 한국어에서 호소력이 있는 표현으로 정리했습니다. 2인칭 경고의 직접성을 살리기 위해 ‘여러분’을 사용했습니다.
- source_word: פְקוֹד
  english_pob_choice: visitation
  chosen_korean: 살피실 때
  alternatives_korean:
  - 돌보실 때
  - 방문하실 때
  - 심판하실 때
  lexicon: HALOT
  rationale: פקד는 돌봄과 심판의 양면을 지니므로, 본문의 경고성을 유지하면서도 의미를 한쪽으로 과도하게 좁히지 않도록 ‘살피실 때’로 옮겼습니다.
- source_word: יְהֹוָה
  english_pob_choice: the LORD
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 주
  - 여호와
  lexicon: HALOT
  rationale: 프로젝트 기본어를 따라 신명기 표기인 야훼를 사용했습니다. 본문이 하나님의 개입을 직접 지칭하므로 대체 호칭보다 원문 대응을 우선했습니다.
theological_decisions:
- issue: פקד의 의미를 ‘심판’으로 좁힐지, 더 넓은 ‘방문/살핌’으로 남길지
  chosen_reading: ‘살피실 때’로 번역해 경고의 문맥 안에서 심판 가능성을 열어 둠
  alternative_readings:
  - 야훼께서 심판하실 때에
  - 야훼께서 방문하실 때에
  rationale: 히브리어 פקד는 단순한 형벌만이 아니라 하나님의 개입 전체를 가리킬 수 있으므로, 본문의 위협을 유지하되 용어의 신학적 폭을 보존했습니다.
  doctrine_reference: 하나님의 ‘방문’ 언어의 이중성 보존
