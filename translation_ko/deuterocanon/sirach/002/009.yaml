translation:
  language: ko
  text: 야훼를 경외하는 이들아, 좋은 것을 바라십시오.[a] 영원한 기쁨과 자비도 바라십시오.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 ‘좋은 것들’로 읽으며 복수형입니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어 חֶסֶד은 ‘자비’ 외에도 ‘한결같은 사랑’이나 ‘친절’로 옮길 수 있으며, 그리스어도 ‘자비’를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְאֵי יְהֹוָה
  english_pob_choice: You who fear Yahweh
  chosen_korean: 야훼를 경외하는 이들아
  alternatives_korean:
  - 야훼를 두려워하는 이들아
  - 야훼를 경외하는 사람들아
  lexicon: HALOT
  rationale: 히브리어는 복수 분사에 호격이 붙은 직접 호칭이므로, 한국어도 명령을 받는 대상에게 직접 말하는 형태로 살렸습니다. '경외하다'는 source의 종교적·관계적 뉘앙스를 가장 잘 보존합니다.
- source_word: קַוּוּ לְטוֹב
  english_pob_choice: hope for good
  chosen_korean: 좋은 것들을 바라십시오
  alternatives_korean:
  - 선한 것을 바라십시오
  - 좋은 것을 소망하십시오
  - 좋은 일들을 기대하십시오
  lexicon: HALOT
  rationale: קוה는 단순 대기가 아니라 기대하며 바라는 행위를 뜻하므로 '바라십시오'로 옮겼습니다. 영어 POB의 각주처럼 히브리어보다 그리스어가 복수 뉘앙스를 보이므로, '좋은 것들'로 열어 두어 더 넓은 기대의 범위를 반영했습니다.
- source_word: וּלְשִׁמְחַת עוֹלָם
  english_pob_choice: for everlasting joy
  chosen_korean: 영원한 기쁨
  alternatives_korean:
  - 영원한 즐거움
  - 영원한 환희
  lexicon: HALOT
  rationale: שִׂמְחָה는 일반적 기쁨/즐거움을 가리키므로 '기쁨'이 가장 자연스럽습니다. עוֹלָם은 지속성을 나타내므로 '영원한'으로 옮겼습니다.
- source_word: וָחֶסֶד
  english_pob_choice: mercy
  chosen_korean: 자비
  alternatives_korean:
  - 인자
  - 은혜
  - 선하심
  lexicon: HALOT
  rationale: חֶסֶד은 문맥상 '긍휼/자비'의 뉘앙스로 읽히며, 영어 POB의 'mercy'와도 맞물립니다. '자비'는 한국어에서 본문 흐름에 자연스럽고 과도한 신학적 재지정이 없습니다.
theological_decisions:
- issue: YHWH의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 프로젝트 기본값에 따라 יהוה는 '야훼'로 옮겨 원문 고유성을 드러냈습니다. 본 절은 히브리어 본문이 명확하므로 LXX의 κύριον을 따로 일반화하지 않았습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה / YHWH → 야훼'
- issue: 히브리어 단수 '좋은 것'과 그리스어 복수 '좋은 것들'의 긴장
  chosen_reading: 좋은 것들을
  alternative_readings:
  - 좋은 것을
  - 좋은 것들
  rationale: 히브리어를 기본으로 하되, 영어 POB가 각주로 지적한 그리스어 복수 뉘앙스를 한국어 본문에 반영해 장래 독자가 두 전승의 차이를 놓치지 않도록 했습니다. 복수형은 '기대되는 선물들의 총체'라는 열린 의미를 유지합니다.
  doctrine_reference: 'PHILOSOPHY.md: translate from Hebrew where Sirach survives; use Greek alongside it'
