  text: Woe to the heart that does not trust[a], for it also will not stand.
  footnotes:
  - marker: a
    text: 'Greek: ''Woe to the slack heart, because it does not believe; therefore it will not be sheltered.'' The Hebrew reads ''heart'' and ''will not stand.'''
    reason: alternative_reading
translation:
  language: ko
  text: 화 있을진저, 믿지 않는 마음이여. 그것도 또한 굳게 서지 못할 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '그리스어: ‘나태한 마음에게 화가 있으니, 그것이 믿지 않기 때문입니다. 그러므로 그것은 보호받지 못할 것입니다.’ 히브리어는 ‘마음’과 ‘굳게 서지 못할 것입니다’로 읽습니다.'
    reason: textual_variant
lexical_decisions:
- source_word: אוֹי
  english_pob_choice: Woe
  chosen_korean: 화 있을진저
  alternatives_korean:
  - 아아
  - 슬프도다
  lexicon: HALOT
  rationale: 지혜문맥에서도 경고와 탄식을 함께 담는 강한 감탄사이므로, 고전적이되 과도하게 교회식으로 굳지 않은 ‘화 있을진저’를 택했습니다.
- source_word: לְלֵב
  english_pob_choice: to the heart
  chosen_korean: 마음이여
  alternatives_korean:
  - 마음에
  - 심장에게
  lexicon: HALOT
  rationale: 히브리어 לֵב은 단순 감정이 아니라 인격의 중심을 가리키므로 ‘마음’이 가장 자연스럽고, 호격을 드러내기 위해 ‘-이여’를 붙였습니다.
- source_word: אֲשֶׁר לֹא יַאֲמִין
  english_pob_choice: that does not trust
  chosen_korean: 믿지 않는
  alternatives_korean:
  - 신뢰하지 않는
  - 믿음이 없는
  lexicon: HALOT
  rationale: 본문의 אמן은 ‘믿다/신뢰하다’의 뜻이므로, 영어 POB의 선택과도 맞물리게 ‘믿지 않는’으로 옮겨 지혜문맥의 의지적 불신을 살렸습니다.
- source_word: וְאַף הוּא לֹא יָקוּם
  english_pob_choice: for it also will not stand
  chosen_korean: 그것도 또한 굳게 서지 못할 것입니다
  alternatives_korean:
  - 그것도 또한 서지 못할 것입니다
  - 그것도 또한 버티지 못할 것입니다
  lexicon: HALOT
  rationale: יָקוּם의 직역인 ‘서다’는 유지하되, 한국어에서 단순한 기립보다 ‘굳게 서다’가 지속·견고함을 더 잘 드러내므로 문맥상 적절하게 다듬었습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행본문의 차이(‘will not stand’ vs ‘will not be sheltered’)
  chosen_reading: 주본문은 히브리어의 ‘굳게 서지 못할 것입니다’를 따르고, 그리스어 차이는 각주로 밝혔습니다.
  alternative_readings:
  - ‘보호받지 못할 것입니다’
  - ‘피신하지 못할 것입니다’
  rationale: 주어진 원문은 히브리어가 우선이며, 그리스어는 ‘감싸다/보호하다’로 해석적 전개를 보입니다. 본문은 히브리어 어구를 보존하고, 독자가 중요한 본문 차이를 확인할 수 있도록 각주로 처리했습니다.
  doctrine_reference: 'DOCTRINE.md: source-first / textual plurality handling'
