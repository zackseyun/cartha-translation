base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/002/006.yaml
  text: Trust in him[a], and he will uphold you; make your ways straight[b], and hope in him.
  footnotes:
  - marker: a
    text: Or 'Believe him' or 'Have faith in him.' The Hebrew and Greek can express trusting reliance, not only mental assent.
    reason: lexical_alternative
  - marker: b
    text: The middle clause is rendered as an exhortation, 'make your ways straight,' following both the Hebrew and the Greek. Some translations instead take it as a promise, 'he will direct/straighten your ways.'
    reason: alternative_reading
translation:
  language: ko
  text: 그분을 신뢰하십시오[a]. 그러면 그분께서 당신을 붙드실 것입니다. 당신의 길을 곧게 하십시오[b]. 그리고 그분께 소망을 두십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그분을 믿으십시오’, ‘그분을 믿고 의지하십시오’로 옮길 수도 있습니다. 히브리어와 그리스어는 단지 지적으로 동의한다는 뜻만이 아니라, 신뢰하며 의지한다는 뜻도 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 이 가운데 절은 명령문으로 읽었습니다. 어떤 번역들은 이를 ‘그분이 당신의 길을 곧게 하실 것입니다’라는 약속으로 이해하기도 합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הַאֲמֵן בּוֹ / πίστευσον αὐτῷ
  english_pob_choice: Trust in him
  chosen_korean: 그분을 신뢰하십시오
  alternatives_korean:
  - 그분을 믿으십시오
  - 그분께 믿음을 두십시오
  lexicon: HALOT; BDAG
  rationale: 히브리어 אמן의 히필 명령형과 그리스어 πίστευσον은 단순한 지적 동의보다 의지적 신뢰를 가리킬 수 있으므로, 한국어에서는 ‘신뢰하다’가 문맥의 권면적 힘을 가장 자연스럽게 살립니다.
- source_word: יַחֲזִיק בְּךָ / ἀντιλήμψεται σου
  english_pob_choice: he will uphold you
  chosen_korean: 그분이 당신을 붙드실 것입니다
  alternatives_korean:
  - 그분이 당신을 도우실 것입니다
  - 그분이 당신을 지탱하실 것입니다
  lexicon: HALOT; BDAG; LSJ
  rationale: ‘붙들다’는 붙잡아 지지하고 지켜 주는 뉘앙스를 살리면서도, 원문의 ‘붙들어 돕다/지탱하다’의 이미지를 과도하게 풀지 않습니다.
- source_word: יַשֵּׁר אָרְחוֹתֶיךָ / εὐθύνας τὰς ὁδούς σου
  english_pob_choice: make your ways straight
  chosen_korean: 당신의 길을 곧게 하십시오
  alternatives_korean:
  - 당신의 길을 곧게 만드십시오
  - 당신의 행로를 바로 하십시오
  lexicon: HALOT; BDAG; LSJ
  rationale: 히브리어 ישר와 그리스어 εὐθύνω는 모두 ‘곧게 하다/바르게 하다’의 뜻이므로, 주체를 하나님으로 돌리는 대신 청자에게 주어지는 권면형을 그대로 살렸습니다. ‘길’은 지혜문학의 인생의 행로 비유를 자연스럽게 전달합니다.
- source_word: וְקַוֵּה אֵלָיו / καὶ ἔλπισον ἐπʼ αὐτόν
  english_pob_choice: and hope in him
  chosen_korean: 그리고 그분께 희망을 두십시오
  alternatives_korean:
  - 그리고 그분을 기다리십시오
  - 그리고 그분을 바라십시오
  lexicon: HALOT; BDAG
  rationale: קוה는 ‘기다리다’와 ‘희망을 두다’의 범위를 가지며, 그리스어 ἐλπίζω는 분명히 소망/희망의 방향을 가리키므로, ‘희망을 두다’가 두 언어를 함께 반영합니다.
theological_decisions:
- issue: 둘째 절 절반의 문장 주어와 의미
  chosen_reading: ‘당신의 길을 곧게 하십시오’는 하나님에 대한 서술이 아니라, 이어지는 권면으로서 청자에게 주어진 명령입니다.
  alternative_readings:
  - ‘그분이 당신의 길을 곧게 하실 것입니다’처럼 하나님이 길을 바로잡는 약속으로 이해할 수 있습니다.
  rationale: 히브리어 יַשֵּׁר와 그리스어 εὐθύνας는 명령형 흐름 안에 놓여 있어, 갑작스럽게 하나님 서술로 전환하기보다 청자에게 계속 호소하는 것으로 읽는 편이 원문 구조를 더 잘 보존합니다.
  doctrine_reference: 원문 우선과 긴장 보존; 전통적 관습보다 언어 형식을 우선함.
