  text: My son[a], if you draw near to serve Yahweh, prepare yourself for every trial.
  footnotes:
  - marker: a
    text: 'Or ''prepare your soul for trial''; Greek: ''prepare your soul for temptation/testing.'' The Hebrew and Greek both use a term that can denote testing, and the Greek word can also mean ''temptation'' depending on context.'
