translation:
  language: ko
  text: 내 아들아, 네가 야훼를 섬기려고 나아가거든, 모든 시험에 대비하여 네 자신을 준비하여라.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘시험’은 히브리어와 헬라어가 모두 가리킬 수 있는 검증·시련의 의미를 포함합니다. 헬라어는 문맥에 따라 ‘유혹’도 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנִי / Τέκνον
  english_pob_choice: My son
  chosen_korean: 내 아들아
  alternatives_korean:
  - 내 자녀야
  - 아들아
  lexicon: HALOT; LXX τέκνον
  rationale: 지혜문학의 훈계체를 살리기 위해 친자 관계의 호칭을 유지하되, 현대 한국어에서는 직접 호명형인 ‘내 아들아’가 가장 자연스럽습니다.
- source_word: תִּקְרַב / προσέρχῃ
  english_pob_choice: draw near
  chosen_korean: 나아가거든
  alternatives_korean:
  - 가까이 오거든
  - 다가가거든
  lexicon: HALOT; BDAG προσέρχομαι
  rationale: 하나님께 ‘다가감’의 예배적 뉘앙스를 살리면서도 문장 흐름이 자연스럽도록 ‘나아가거든’으로 옮겼습니다.
- source_word: לַעֲבוֹד / δουλεύειν
  english_pob_choice: serve
  chosen_korean: 섬기려고
  alternatives_korean:
  - 봉사하려고
  - 예배하려고
  lexicon: HALOT; LSJ δουλεύω
  rationale: 하나님을 대상으로 한 עבד/δουλεύειν은 단순 노동보다 신앙적 섬김을 포함하므로, 한국어에서도 그 범위를 담는 ‘섬기다’를 택했습니다.
- source_word: יְהֹוָה / Κυρίῳ
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: Tetragrammaton convention
  rationale: 원문이 여호와 명칭을 직접 사용하므로, 본 프로젝트 기본어인 ‘야훼’로 옮겨 고유성을 보존했습니다.
- source_word: נִסָּיוֹן / πειρασμόν
  english_pob_choice: trial
  chosen_korean: 시험
  alternatives_korean:
  - 시련
  - 유혹
  lexicon: HALOT; BDAG πειρασμός
  rationale: 지혜문맥에서는 죄로 유혹한다기보다 하나님을 섬기는 과정에서 겪는 검증과 시련이 핵심이므로, 의미 범위를 살린 ‘시험’을 사용했습니다.
- source_word: הָכֵן נַפְשְׁךָ / ἑτοίμασον τὴν ψυχήν σου
  english_pob_choice: prepare yourself
  chosen_korean: 네 자신을 준비하여라
  alternatives_korean:
  - 네 영혼을 준비하여라
  - 자신을 갖추어라
  lexicon: HALOT; BDAG ψυχή
  rationale: נפש와 ψυχή는 ‘영혼’으로만 좁히기보다 전인적 자기 자신을 가리키므로, 자연스러운 현대 한국어인 ‘네 자신을 준비하여라’로 풀었습니다.
theological_decisions:
- issue: YHWH의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 서지적으로 확인되는 히브리어 본문이 YHWH를 직접 쓰므로, 전통적 대체어보다 고유 신명 표기를 유지하는 편이 본문 의미를 더 직접적으로 드러냅니다.
  doctrine_reference: POB terminology standard for יְהֹוָה / YHWH
- issue: ‘시험’의 의미 범위
  chosen_reading: 외적 시련과 내적 유혹을 모두 포함할 수 있는 일반적 ‘시험’
  alternative_readings:
  - 시련만
  - 유혹만
  rationale: 히브리어 נִסָּיוֹן과 헬라어 πειρασμόν은 문맥에 따라 검증·시련 또는 유혹을 가리킬 수 있으므로, 여기서는 문맥상 가장 안전한 포괄 번역을 택했습니다.
  doctrine_reference: Preserve lexical tension rather than over-specify meaning
