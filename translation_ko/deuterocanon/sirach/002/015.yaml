  to: 야훼를 경외하는 이들은 그의 길들을 거역하지 않을 것이며, 그를 사랑하는 이들은 그의 길들을 지킬 것입니다.[a]
  rationale: 첫째 절의 부자연스러운 ‘길들에서 반역하다’를 ‘길들을 거역하다’로 고쳐, 히브리어 מרה의 강한 거역 의미와 그 대상인 ‘그의 길들’을 자연스러운 현대 한국어로 나타냈습니다. 둘째 절도 히브리어의 복수형과 두 절의 시적 대응을 보이도록 ‘길들을’로 통일했습니다. 각주는 그리스어의 ‘말들’ 읽기와 히브리어 본문 사이의 차이를 유지하되 문장을 다듬었습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T19:09:22Z'
