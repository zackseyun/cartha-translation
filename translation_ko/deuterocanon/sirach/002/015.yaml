translation:
  language: ko
  text: 야훼를 경외하는 이들은 그의 길들을 거역하지 않을 것이며, 그를 사랑하는 이들은 그의 길들을 지킬 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 평행본문은 ‘그의 말들에 불순종하지 않을 것이다’라고 읽습니다. 히브리어 카이로 게니자 증거가 우선이지만, 그리스어도 충실한 순종이라는 전반적인 의미를 뒷받침합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יִרְאֵי יְהֹוָה
  english_pob_choice: those who fear Yahweh
  chosen_korean: 야훼를 경외하는 이들
  alternatives_korean:
  - 야훼를 두려워하는 이들
  - 주를 경외하는 이들
  lexicon: HALOT
  rationale: יִרְאֵי는 명사구로서 ‘~를 경외하는/두려워하는 이들’이라는 집단 표지이며, Korean에서는 ‘경외하는’이 지혜문학적 경외의 뉘앙스를 가장 자연스럽게 살립니다. POB의 야훼를 따라 고유 신명사는 ‘야훼’로 옮겼습니다.
- source_word: לֹא יַמְרוּ בִּדְרָכָיו
  english_pob_choice: will not rebel against his ways
  chosen_korean: 그의 길들에서 반역하지 않을 것이며
  alternatives_korean:
  - 그의 길들에 거역하지 않을 것이며
  - 그의 길들에 불순종하지 않을 것이며
  lexicon: HALOT
  rationale: מרה는 단순한 ‘불순종’보다 더 강한 ‘반역/거역’의 의미가 있어 이를 살렸습니다. בְּ는 여기서 반역의 대상 방향을 나타내므로 ‘~에서 반역하다’보다 ‘~에 반역하다/거역하다’가 더 자연스럽지만, 시적 병행성과 문장 흐름을 위해 ‘그의 길들에서’로 옮겼습니다.
- source_word: וְאוֹהֲבָיו
  english_pob_choice: those who love him
  chosen_korean: 그를 사랑하는 이들은
  alternatives_korean:
  - 그의 사랑하는 이들은
  - 그를 사랑하는 사람들은
  lexicon: HALOT
  rationale: 사랑의 행위를 수행하는 사람들을 가리키는 분사구이므로 한국어에서는 ‘그를 사랑하는 이들/사람들’이 가장 직접적입니다. ‘이들’은 앞 절과 평행을 유지합니다.
- source_word: יִצְרוּ אָרְחוֹתָיו
  english_pob_choice: will keep his paths
  chosen_korean: 그의 길을 지킬 것입니다
  alternatives_korean:
  - 그의 길들을 지킬 것입니다
  - 그의 길을 지켜갈 것입니다
  - 그의 행로를 지킬 것입니다
  lexicon: HALOT
  rationale: נצר는 지혜문학에서 ‘지키다, 간직하다, 보존하다’의 뜻을 가지며, 여기서는 언약적 순종의 의미로 ‘지키다’가 적절합니다. אָרְחוֹתָיו는 직역하면 ‘그의 길들/통로들’이지만, 한국어에서 자연스러운 단수 보편 표현으로 ‘그의 길’을 택했습니다.
theological_decisions:
- issue: 야훼(יְהֹוָה)의 번역
  chosen_reading: 본 구절의 신명사는 ‘야훼’로 옮겼습니다.
  alternative_readings:
  - 주
  - 여호와
  rationale: POB의 신명사 원칙을 따라 히브리어 사신 tetragrammaton을 학술적 음역인 ‘야훼’로 보존했습니다. 이는 본문이 가리키는 언약의 이름을 가리는 완곡어보다 출처 충실도를 높입니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהֹוָה YHWH'
