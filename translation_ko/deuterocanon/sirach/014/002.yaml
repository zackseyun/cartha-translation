  text: Blessed is the man whom his soul has not reproached[a], and whose hope has not ceased.
  footnotes:
  - marker: a
    text: The Hebrew of the first clause is difficult in the extant Cairo Geniza witness; the Greek parallel reads 'whose soul has not condemned him,' which guides the rendering here. Possible nuances include 'reproached him' or 'shamed him.'
    reason: textual_variant
translation:
  language: ko
  text: 자신의 영혼이 그를 정죄하지 않고 그의 희망이 끊어지지 않은 사람은 복이 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 첫 절의 히브리어는 현존 카이로 게니자 전승에서 난해합니다. 그리스어 평행문은 ‘그의 영혼이 그를 정죄하지 않은’이라고 읽으며, 이 번역은 이를 보조적으로 따릅니다. ‘책망하지 않은’ 또는 ‘부끄럽게 하지 않은’이라는 뉘앙스일 수도 있습니다.
    reason: textual_variant
lexical_decisions:
- source_word: אַשְׁרֵי
  english_pob_choice: Blessed is
  chosen_korean: 복이 있습니다
  alternatives_korean:
  - 행복합니다
  - 복되도다
  lexicon: HALOT
  rationale: 지혜문학의 복 선언 형식을 살리면서도 현대 한국어 합쇼체에 자연스럽게 맞도록 옮겼습니다.
- source_word: אִישׁ
  english_pob_choice: the man
  chosen_korean: 사람
  alternatives_korean:
  - 그 사람
  - 남자
  lexicon: HALOT
  rationale: 히브리어는 남성 단수형이지만, 한국어에서는 대표적 인간 일반을 가리키는 지혜문구로 읽히므로 성별을 과도하게 드러내지 않는 ‘사람’이 자연스럽습니다.
- source_word: לֹא חִסַּדְתּוֹ נַפְשׁוֹ
  english_pob_choice: whose soul has not condemned him
  chosen_korean: 자신의 영혼이 그를 정죄하지 않은
  alternatives_korean:
  - 자신의 영혼이 그를 책망하지 않은
  - 자신의 마음이 그를 부끄럽게 하지 않은
  lexicon: HALOT
  rationale: 난해한 히브리어 표현이므로 그리스어 평행문의 κατέγνω(‘정죄하다’)를 반영하되, נֶפֶשׁ는 본문 어휘를 따라 ‘영혼’으로 유지했습니다.
- source_word: וְלֹא שָׁבְתָה תּוֹחַלְתּוֹ
  english_pob_choice: whose hope has not ceased
  chosen_korean: 그의 희망이 끊어지지 않은
  alternatives_korean:
  - 그의 희망이 그치지 않은
  - 그의 기대가 사라지지 않은
  lexicon: HALOT
  rationale: שׁבת의 ‘그치다/멈추다’ 의미를 한국어에서 가장 직접적으로 드러내기 위해 ‘끊어지지 않은’을 택했습니다. תּוֹחֶלֶת은 문맥상 ‘희망’이 적절합니다.
theological_decisions:
- issue: 난해한 첫 절의 히브리어와 그리스어 평행문의 관계
  chosen_reading: 첫 절은 ‘자신의 영혼이 그를 정죄하지 않은’으로 옮기되, 그리스어 평행문이 제시하는 의미를 보조적으로 반영했습니다.
  alternative_readings:
  - 자신의 영혼이 그를 책망하지 않은
  - 자신의 영혼이 그를 부끄럽게 하지 않은
  rationale: 현존 히브리어가 다소 불안정하므로, 텍스트의 뜻을 해치지 않는 범위에서 그리스어의 ‘정죄하다’ 의미로 안정화했습니다. 동시에 נַפְשׁוֹ를 ‘영혼’으로 유지해 원문 어휘를 지웠습니다.
  doctrine_reference: 'Sirach 번역 원칙: 히브리어가 보존된 곳에서는 히브리어를 우선하되, 평행 그리스어가 해석을 분명히 할 때는 보조 증거로 사용합니다.'
