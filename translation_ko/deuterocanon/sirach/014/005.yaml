base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/014/005.yaml
  text: If he is evil to himself[a], to whom will he do good? He will not enjoy his own good things.
  footnotes:
  - marker: a
    text: Literally, 'he will not see his good.' The Hebrew idiom likely means he will not experience or enjoy the good that is his; the Greek parallel makes this sense explicit with 'will not rejoice in his possessions.'
    reason: lexical_alternative
translation:
  language: ko
  text: 자기 자신에게 악한 사람[a]이 누구에게 선을 행하겠습니까? 그는 자기의 좋은 것을 누리지 못할 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘자기에게 악한 사람’입니다. 여기서 נפשׁ는 ‘영혼’보다 ‘자기 자신/자기 삶’의 뜻이 자연스럽습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַע לְנַפְשׁוֹ
  english_pob_choice: If he is evil to himself
  chosen_korean: 자기 자신에게 악한 사람
  alternatives_korean:
  - 자기 영혼에 악한 사람
  - 자기에게 해로운 사람
  lexicon: HALOT
  rationale: נפשׁ는 여기서 ‘영혼’보다 ‘자기 자신/자기 삶’의 뜻이 자연스러우며, רַע의 도덕적 뉘앙스를 살려 ‘악한’으로 옮겼습니다.
- source_word: לְמִי יֵיטִיב
  english_pob_choice: to whom will he do good?
  chosen_korean: 누구에게 선을 행하겠습니까?
  alternatives_korean:
  - 누구에게 좋게 하겠습니까?
  - 누구에게 유익을 주겠습니까?
  lexicon: HALOT
  rationale: יֵיטִיב는 단순히 ‘좋다’가 아니라 ‘선을 행하다/유익을 주다’의 뜻이므로, 한국어에서도 윤리적 대조가 드러나도록 옮겼습니다.
- source_word: וְלֹא יִרְאֶה בְּטוֹבָתוֹ
  english_pob_choice: He will not enjoy his own good things.
  chosen_korean: 그는 자기의 좋은 것을 누리지 못할 것입니다.
  alternatives_korean:
  - 그는 자기의 좋은 것을 보지 못할 것입니다.
  - 그는 자기의 좋은 것을 경험하지 못할 것입니다.
  lexicon: HALOT
  rationale: 히브리어 직역은 ‘보지 못하다’이지만, 문맥과 영어 POB의 해설대로 실제로는 그 선함/복리를 ‘경험하고 누리다’는 뜻이므로 한국어에서 자연스럽고도 원문 의미를 드러내는 ‘누리지 못하다’를 택했습니다.
theological_decisions:
- issue: 자기파괴적 삶과 윤리적 자기-해악의 강조
  chosen_reading: 이 구절은 단순한 자기관리 조언이 아니라, 악한 삶이 결국 자신에게도 선을 베풀 수 없게 만든다는 도덕적-지혜적 경고로 읽었습니다.
  alternative_readings:
  - 개인적 실용주의 조언
  - 재산을 아끼는 지혜
  rationale: 히브리어와 그리스어 병행 모두 인격의 도덕성과 그 결과를 강조하므로, 이를 약화시키지 않고 지혜문학적 경고로 보존했습니다.
  doctrine_reference: 지혜문학의 보응 원리
