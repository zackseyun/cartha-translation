base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/014/018.yaml
  text: 'Like the leaves budding on a luxuriant tree—one withers and another sprouts—so are the generations of flesh and blood: one dies and another is born[a].'
  footnotes:
  - marker: a
    text: Hebrew 'another matures' or similar is possible from גּוֹמֵל, but the Greek witness reads 'another is born,' which fits the comparison of successive generations and is followed here.
    reason: alternative_reading
translation:
  language: ko
  text: 무성한 나무에서 돋는 잎처럼, 한 잎은 시들고 다른 잎은 돋아납니다. 이와 같이 살과 피를 지닌 이들의 세대도, 하나는 죽고 다른 하나는 태어납니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 גּוֹמֵל은 ‘성숙하다’ 또는 ‘젖을 떼다’라는 뜻일 수도 있습니다. 그러나 그리스어 본문은 ‘태어나다’(γεννᾶται)로 읽으며, 세대가 이어지는 이 문맥에도 잘 맞습니다. 그래서 본문에서는 ‘태어납니다’로 옮겼습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: כְּפֶרַח עָלֶה / ὡς φύλλον θάλλον
  english_pob_choice: Like the leaves budding
  chosen_korean: 푸른 나무의 잎처럼
  alternatives_korean:
  - 잎이 돋는 것처럼
  - 무성한 나무의 잎처럼
  - 잎사귀가 피어나는 것처럼
  lexicon: HALOT; LXX parallel
  rationale: 히브리어의 압축된 비유와 그리스어의 ‘잎이 무성하게 자라는’ 이미지를 자연스러운 한국어로 옮기기 위해, ‘잎’과 ‘푸른’으로 생장·생기 이미지를 살렸습니다.
- source_word: עֵץ רַעֲנָן / δένδρου δασέος
  english_pob_choice: a luxuriant tree
  chosen_korean: 푸른 나무
  alternatives_korean:
  - 무성한 나무
  - 울창한 나무
  - 싱싱한 나무
  lexicon: HALOT
  rationale: רַעֲנָן은 단순한 색보다 생기와 무성함을 뜻하므로, ‘푸른’은 현대 한국어에서 자연스러운 생명력의 표현으로 기능합니다.
- source_word: שֶׁזֶּה נוֹבֵל וְאַחֵר צוֹמֵחַ
  english_pob_choice: one withers and another sprouts
  chosen_korean: 이것은 시들고 다른 것은 돋아납니다
  alternatives_korean:
  - 이것은 마르고 다른 것은 자랍니다
  - 이것은 시들고 다른 것은 자랍니다
  - 이것은 떨어지고 다른 것은 돋습니다
  lexicon: HALOT
  rationale: נוֹבֵל과 צוֹמֵחַ의 식물 비유를 그대로 살리면서도, 한국어에서 가장 자연스럽게 대조를 이루는 ‘시들고 / 돋아납니다’를 선택했습니다.
- source_word: בָּשָׂר וָדָם
  english_pob_choice: flesh and blood
  chosen_korean: 살과 피로 된
  alternatives_korean:
  - 혈육의
  - 인간의
  - 살과 피의
  lexicon: HALOT
  rationale: 관용구를 추상화하지 않고 문자적 감각을 살리기 위해 ‘살과 피’를 유지했습니다. 이는 인간의 유한성과 죽음을 강조하는 표현입니다.
- source_word: גֹּוֵעַ / גּוֹמֵל
  english_pob_choice: one dies / another is born
  chosen_korean: 하나는 죽고 다른 하나는 태어납니다
  alternatives_korean:
  - 하나는 죽고 다른 하나는 나옵니다
  - 하나는 죽고 다른 하나는 생깁니다
  - 하나는 죽고 다른 하나는 성장합니다
  lexicon: HALOT
  rationale: 히브리어 גּוֹמֵל은 ‘성숙하다/젖을 떼다’의 뉘앙스가 있으나, 본문의 세대 교체와 그리스어 γεννᾶται를 따라 ‘태어납니다’로 옮겼습니다.
theological_decisions:
- issue: 인간 세대의 유한성과 계속되는 생명 교체를 어떻게 표현할 것인가
  chosen_reading: 식물의 생장 비유와 ‘살과 피’의 관용구를 함께 유지해, 인간의 유한성과 세대의 연속성을 동시에 드러냈습니다.
  alternative_readings:
  - 인간은 죽고 또 다른 인간이 태어납니다
  - 인류는 사라지고 다시 생깁니다
  rationale: 이 절은 단순한 순환이 아니라 죽음과 탄생의 반복 속에서 인간 세대의 유한성을 말합니다. 비유를 약화시키지 않고 직설적으로 풀어 전달했습니다.
  doctrine_reference: Sirach 14:18; original-language primacy over flattening paraphrase
