base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/014/020.yaml
  text: Blessed is the man who meditates on wisdom[b][a], and who reflects with understanding.
  footnotes:
  - marker: a
    text: Or 'Happy is the man.' The Hebrew beatitude formula can denote flourishing or enviable blessedness, not merely an emotional state.
    reason: lexical_alternative
  - marker: b
    text: The Greek parallel reads, 'Blessed is the man who will come to an end in wisdom, and who will converse in his understanding,' reflecting a notably different wording in the first verb and second colon.
    reason: alternative_reading
translation:
  language: ko
  text: 지혜를 묵상하고 분별력을 깊이 생각하는 사람은 복이 있습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “행복한 사람은.” 히브리어 복 선언은 단순한 감정 상태만이 아니라 번영하거나 부러움을 받는 복됨을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어 병행 본문은 “지혜 가운데 생을 마치고 자기 분별력으로 논할 사람은 복이 있다”라고 하여, 첫째 동사와 둘째 행에서 히브리어와 현저히 다르게 읽습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אַשְׁרֵי
  english_pob_choice: Blessed is
  chosen_korean: 복이 있으며
  alternatives_korean:
  - 행복합니다
  - 복됩니다
  lexicon: HALOT
  rationale: 지혜문학의 선언형 축복 표현을 살려, 정서 상태보다 승인과 번영의 의미가 드러나는 ‘복이 있으며’로 옮겼습니다.
- source_word: אֱנוֹשׁ
  english_pob_choice: the man
  chosen_korean: 사람
  alternatives_korean:
  - 그 남자
  - 한 사람
  lexicon: HALOT
  rationale: 히브리어 남성 단수 형식을 고려하되, 한국어 문장에서는 격언체의 대표적 인간을 자연스럽게 드러내는 ‘사람’으로 옮겼습니다.
- source_word: יֶהְגֶּה
  english_pob_choice: meditates
  chosen_korean: 묵상하는
  alternatives_korean:
  - 생각하는
  - 숙고하는
  lexicon: HALOT
  rationale: 히브리어 הָגָה의 낮은 목소리의 읊조림·묵상 의미를 살려, 지혜를 대상으로 한 내적 반추를 드러내는 ‘묵상하는’으로 옮겼습니다.
- source_word: יִשְׁעֶה
  english_pob_choice: reflects
  chosen_korean: 숙고하는
  alternatives_korean:
  - 생각하는
  - 살피는
  - 의지하는
  lexicon: HALOT
  rationale: 이 동사는 주의를 기울여 생각하거나 향하는 뜻이 있어, 병행구의 ‘묵상’과 대응되면서도 더 능동적인 내적 사고를 나타내는 ‘숙고하는’으로 옮겼습니다.
theological_decisions:
- issue: 히브리어 병행법의 두 동사를 어떻게 구분할지
  chosen_reading: 첫 행은 지혜를 대상으로 한 내적 묵상, 둘째 행은 분별력에 근거한 숙고로 구분했습니다.
  alternative_readings:
  - 두 동사를 모두 ‘생각하는’으로 평준화함
  - 첫 행을 ‘말하는/읊조리는’ 쪽으로 옮김
  rationale: 영어 POB의 audit trail이 두 동사를 각각 ‘meditates’와 ‘reflects’로 구분하므로, 한국어에서도 반복을 피하면서도 의미 차이를 유지해야 합니다. 히브리어와 그리스어 병행이 모두 지적·내적 활동을 가리키므로, ‘묵상’과 ‘숙고’의 구분이 가장 적절합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
