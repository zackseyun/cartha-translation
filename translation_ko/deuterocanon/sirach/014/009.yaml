  text: In the eye of the greedy[a], his portion is too little, and by taking his neighbor’s share he destroys his own portion.
  footnotes:
  - marker: a
    text: Hebrew 'In the eye of ... his portion is little.' The Hebrew term rendered 'the greedy' is difficult in this manuscript tradition; the Greek parallel reads 'the eye of the greedy is not filled with a portion,' which supports this sense.
    reason: alternative_reading
translation:
  language: ko
  text: 탐욕한 사람의 눈에는 그 몫이 적을 뿐이며, 이웃의 몫을 빼앗아 가지면 자기의 몫을 잃어버립니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 난해하지만, 그리스어 평행본문은 ‘탐욕한 자의 눈은 몫으로 채워지지 않는다’는 뜻을 보여 주어 이 구절의 의미를 뒷받침합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּעֵין כּוֹשֵׁל
  english_pob_choice: In the eye of the greedy
  chosen_korean: 탐욕한 사람의 눈에는
  alternatives_korean:
  - 탐욕한 자의 눈에는
  - 탐욕한 사람에게는
  - 탐욕한 사람의 관점에서는
  lexicon: HALOT; Greek parallel πλεονέκτου
  rationale: 히브리어 본문은 난해하지만 그리스어 평행본문이 ‘탐욕한 자’의 눈을 분명히 가리키므로, 한국어도 사람의 내적 시각을 살려 ‘눈에는’으로 옮겼습니다.
- source_word: מְעַט הוּא חֶלְקוֹ
  english_pob_choice: his portion is too little
  chosen_korean: 그 몫이 적을 뿐이며
  alternatives_korean:
  - 그 몫은 너무 적습니다
  - 그 몫이 작다고 여기며
  - 그 몫은 충분하지 않습니다
  lexicon: HALOT
  rationale: 단순한 객관적 ‘작음’보다 만족하지 못하는 평가를 드러내는 문맥이므로, ‘적을 뿐’으로 불만족의 뉘앙스를 살렸습니다.
- source_word: וְלוֹקֵחַ חֵלֶק רֵעֵהוּ
  english_pob_choice: by taking his neighbor’s share
  chosen_korean: 이웃의 몫을 빼앗아 가지면
  alternatives_korean:
  - 이웃의 몫을 가져가면
  - 이웃의 몫을 취하면
  - 이웃의 몫을 취하여
  lexicon: HALOT
  rationale: לוֹקֵחַ는 단순한 취함보다 남의 것을 자기 것으로 삼는 행동을 강하게 시사하므로, ‘빼앗아 가지면’으로 도덕적 침해를 분명히 했습니다.
- source_word: מְאַבֵּד חֶלְקוֹ
  english_pob_choice: he destroys his own portion
  chosen_korean: 자기의 몫을 잃어버립니다
  alternatives_korean:
  - 자기의 몫을 망가뜨립니다
  - 자기 몫을 파멸시킵니다
  - 자기의 몫을 파괴합니다
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘멸하게 하다/파괴하다’의 강한 동사를 쓰지만, 속담의 종결로서는 결과를 자연스럽게 드러내는 ‘잃어버립니다’가 한국어에서 더 읽힙니다.
theological_decisions:
- issue: 난해한 히브리어 כּוֹשֵׁל의 처리와 그리스어 평행본문의 사용
  chosen_reading: 본문의 뜻을 ‘탐욕한 사람’의 불만족으로 읽었습니다.
  alternative_readings:
  - ‘비틀거리는 사람’으로 직역하기
  - ‘실패하는 사람’으로 옮기기
  rationale: 본 히브리어 전승은 불일치가 표시되어 있고, 그리스어 평행본문이 탐욕의 주제를 명확히 하므로, 본문 수용 가능한 범위 안에서 탐욕의 의미를 한국어 본문에 반영했습니다.
  doctrine_reference: 'PHILOSOPHY.md: 히브리어를 우선하되, 벤 시라에서는 그리스어 평행본문을 실제 입력으로 사용'
