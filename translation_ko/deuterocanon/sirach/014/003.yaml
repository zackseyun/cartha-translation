translation:
  language: ko
  text: 가난한 마음의 사람에게는 재물이 어울리지 않고, 악한 눈을 가진 사람에게는 재산이 어울리지 않습니다.
  philosophy: formal
lexical_decisions:
- source_word: לְלֵב קָטֹן
  english_pob_choice: small-hearted man
  chosen_korean: 가난한 마음의 사람
  alternatives_korean:
  - 마음이 작은 사람
  - 소심한 사람
  - 옹졸한 사람
  lexicon: לֵב / קָטֹן
  rationale: 직역식으로 ‘작은 마음’도 가능하지만, 문맥상 그릇이 좁고 속이 빈약한 사람을 가리키므로 한국어에서는 의미를 드러내는 ‘가난한 마음의 사람’으로 옮겨 POB의 도덕적 뉘앙스를 살렸습니다.
- source_word: עֹשֶׁר
  english_pob_choice: Wealth
  chosen_korean: 재물
  alternatives_korean:
  - 부
  - 부유함
  - 재산
  lexicon: עֹשֶׁר
  rationale: 첫 절의 עֹשֶׁר은 일반적 부를 가리키므로 ‘재물’이 가장 자연스럽고, 두 번째 절의 חָרוּץ와 대응을 위해 ‘재산’과 구별했습니다.
- source_word: אִישׁ רַע עַיִן
  english_pob_choice: a man with an evil eye
  chosen_korean: 악한 눈을 가진 사람
  alternatives_korean:
  - 악한 눈의 사람
  - 시기하는 사람
  - 질투하는 사람
  lexicon: רַע עַיִן
  rationale: 히브리어 관용구를 그대로 살려 ‘눈’ 이미지를 유지하되, 한국어 독자가 바로 이해하도록 ‘악한 눈을 가진 사람’으로 풀었습니다.
- source_word: חָרוּץ
  english_pob_choice: riches
  chosen_korean: 재산
  alternatives_korean:
  - 보물
  - 부지런히 모은 것
  - 금은보화
  lexicon: חָרוּץ
  rationale: 문맥과 그리스어 χρήματα의 의미를 따라 단순한 ‘보물’보다 넓은 ‘재산’으로 옮겨, 부의 범주를 첫 절의 עֹשֶׁר과 대응시키면서도 과도하게 특정화하지 않았습니다.
theological_decisions:
- issue: ‘small-hearted’의 도덕적 평가를 한국어에서 어떻게 드러낼지
  chosen_reading: 심리적 소심함보다 도덕적·인격적 협소함을 드러내는 표현으로 옮겼습니다.
  alternative_readings:
  - 마음이 작은 사람
  - 소심한 사람
  rationale: 지혜문학의 경구는 단순한 내향성보다 재물을 감당할 내적 그릇의 협소함을 말하므로, 독자가 경고의 성격을 놓치지 않게 했습니다.
  doctrine_reference: 지혜문학의 اخلاق적 권고
