translation:
  language: ko
  text: 내 아들아, 네게 재산이 있으면 네 자신에게 잘하라. 네게 무엇이 있으면 네 자신에게 선을 행하라.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 현존 히브리어는 대체로 ‘내 아들아, 네게 무엇이 있으면 네 자신에게 선을 행하라’의 형태로 읽힙니다. 그리스어 평행문에는 ‘주님께 합당한 제물을 바치라’는 문장이 더해져 있습니다.
    reason: textual_variant
lexical_decisions:
- source_word: בְּנִי
  english_pob_choice: My son
  chosen_korean: 내 아들아
  alternatives_korean:
  - 내 아이야
  - 내 자녀야
  lexicon: HALOT
  rationale: 히브리어의 직접 호격을 살려 친밀한 권면의 시작을 자연스러운 한국어 호격으로 옮겼습니다.
- source_word: אִם יֵשׁ לְךָ
  english_pob_choice: if you have
  chosen_korean: 네게 … 있으면
  alternatives_korean:
  - 네가 가지고 있으면
  - 네게 소유한 것이 있으면
  lexicon: HALOT
  rationale: 존재구문의 소유 의미를 한국어의 자연스러운 조건절로 옮겼습니다.
- source_word: שָׁרֵית נַפְשֶׁךָ
  english_pob_choice: the means
  chosen_korean: 재산
  alternatives_korean:
  - 여분
  - 남는 것
  - 여유
  lexicon: HALOT
  rationale: 히브리어 표현이 압축적이고 다소 난해하므로, 문맥상 자기 자신을 돌볼 수 있는 가용 자원을 가리키는 뜻을 한국어에서 가장 직접적으로 드러내는 '재산'을 택했습니다.
- source_word: הֵיטִיב לָךְ
  english_pob_choice: do good to yourself
  chosen_korean: 네 자신에게 잘하라 / 네 자신에게 선을 행하라
  alternatives_korean:
  - 스스로에게 유익하게 하라
  - 자신을 선하게 대하라
  lexicon: HALOT
  rationale: 동사 היטיב의 윤리적·실천적 뉘앙스를 살리기 위해 첫 절은 일상적 표현으로, 둘째 절은 보다 문자적인 '선을 행하라'로 병렬을 유지했습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 평행문의 차이
  chosen_reading: 히브리어에 있는 두 조건절만 본문에 반영했습니다.
  alternative_readings:
  - 그리스어의 '주님께 합당한 제물을 바치라'를 포함한다
  - 각주로만 처리한다
  rationale: 제공된 히브리어 본문이 더 직접적인 기준 본문이므로, 그리스어 평행문의 제사 구절은 본문에 넣지 않고 차이만 반영했습니다. 이는 사본 전승상의 변이를 해치지 않고 보존하는 선택입니다.
  doctrine_reference: '번역 원칙: 현존 히브리어 우선, 평행문은 변이 증거로 활용'
