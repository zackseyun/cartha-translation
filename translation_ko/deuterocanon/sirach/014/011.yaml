  naturalness: 초안의 ‘네 자신에게 잘하라/선을 행하라’는 한국어로 다소 직역투이며, 지시문도 요청된 현대 합쇼체가 아니라 해라체입니다. ‘자신을 잘 돌보십시오/자신에게 선을 베푸십시오’는 현대 표준어의 정중한 권면체로 자연스럽습니다.
  terminology: ‘내 아들아’는 남성 단수 호격을 보존하는 적절한 성서적 표현입니다. ‘주님’은 그리스어 Κύριος의 통상적 번역으로 적절합니다. 첫 구절의 불명확한 히브리어를 ‘재산’으로 고정하지 않고 ‘여유’로 처리했습니다.
