base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/014/013.yaml
  text: Before you die[a], do good to one you love, and according to what your hand attains[b], give to him.
  footnotes:
  - marker: a
    text: Or 'to your friend'; the Greek parallel reads 'do good to a friend.'
    reason: alternative_reading
  - marker: b
    text: Literally, 'the attainment of your hand'; that is, according to your means or ability.
    reason: lexical_alternative
translation:
  language: ko
  text: 죽기 전에 사랑하는 이에게[a] 선을 베풀고, 당신의 손에 닿는 만큼[b] 그에게 주십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘친구에게’. 그리스어 병행본문은 ‘친구에게 선을 행하라’고 읽습니다.
    reason: alternative_reading
  - marker: b
    text: 직역하면 ‘당신의 손의 닿음’이며, 곧 당신의 형편이나 능력에 따라라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּטֶרֶם / πρὶν
  english_pob_choice: Before you die
  chosen_korean: 죽기 전에
  alternatives_korean:
  - 죽기 앞서
  - 죽음을 맞기 전에
  lexicon: HALOT; LSJ
  rationale: 두 전승 모두 죽음 이전의 시점을 가리키므로, 현대 한국어에서 가장 직접적이고 자연스러운 시간 표지로 옮겼습니다.
- source_word: הֵיטִב / εὖ ποίει
  english_pob_choice: do good
  chosen_korean: 선을 베풀고
  alternatives_korean:
  - 좋은 일을 하고
  - 잘 대해 주고
  lexicon: HALOT
  rationale: 히필형의 benefactive 의미를 살려 단순한 ‘좋다’가 아니라 상대에게 유익을 주는 행위로 표현했습니다.
- source_word: לְאוֹהֵב / φίλῳ
  english_pob_choice: to one you love
  chosen_korean: 사랑하는 이에게
  alternatives_korean:
  - 친구에게
  - 사랑하는 사람에게
  lexicon: HALOT; LSJ
  rationale: 히브리어는 ‘사랑하는 사람’의 넓은 관계를, 그리스어는 ‘친구’의 뉘앙스를 지니므로, 둘을 포괄하는 자연스러운 표현을 택했습니다.
- source_word: וְהַשִּׂיגַת יָדְךָ / κατὰ τὴν ἰσχύν σου
  english_pob_choice: according to what your hand attains
  chosen_korean: 당신의 손이 미칠 수 있는 만큼
  alternatives_korean:
  - 당신의 형편에 따라
  - 당신의 능력이 닿는 만큼
  lexicon: HALOT; LXX parallel
  rationale: ‘손’의 비유와 ‘미침/닿음’의 감각을 유지하되, 한국어에서 이해 가능한 능력·형편의 의미를 함께 전달했습니다.
- source_word: תֶּן לוֹ / δὸς αὐτῷ
  english_pob_choice: give to him
  chosen_korean: 그에게 주십시오
  alternatives_korean:
  - 그에게 주어라
  - 그에게 주십시오만
  lexicon: HALOT
  rationale: 직접 명령의 권면을 합쇼체로 옮겨 지혜문맥의 권고성을 살렸습니다.
theological_decisions:
- issue: לְאוֹהֵב과 φίλῳ의 관계적 대상을 어떻게 살릴지
  chosen_reading: ‘사랑하는 이’로 넓게 유지해, 히브리어의 사랑받는 사람과 그리스어의 친구를 모두 포괄했습니다.
  alternative_readings:
  - 친구
  - 사랑하는 사람
  rationale: 이 절은 대상의 친밀한 관계를 강조하지만, 특정 사회적 호칭으로 좁히면 한 전승의 뉘앙스를 과도하게 우선할 수 있습니다.
  doctrine_reference: 원어 우선 원칙과 병행 전승의 긴장 보존
