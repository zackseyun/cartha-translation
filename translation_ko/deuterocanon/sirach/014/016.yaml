base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/014/016.yaml
  text: Give to a brother[a], and be gracious, and indulge yourself, for in Sheol there is no seeking pleasure. And whatever is good to do[b], do it before God.
  footnotes:
  - marker: a
    text: 'Greek: ''give and take, and deceive your soul,'' a difficult phrase that likely points to self-indulgent enjoyment; the Hebrew witness reads more clearly, ''pamper yourself.'''
    reason: alternative_reading
  - marker: b
    text: '''Sheol'' is the realm of the dead; alternatively, ''the grave'' or ''the underworld.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 형제에게 주고, 은혜를 베풀며, 자기 자신을 돌보십시오. 스올에서는 쾌락을 찾을 수 없기 때문입니다. 또한 하기에 좋은 일이라면 무엇이든 하나님 앞에서 하십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘스올’은 죽은 자의 영역을 가리키며, ‘무덤’이나 ‘음부’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘좋은’ 혹은 ‘알맞은’ 일을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵּן לְאָח
  english_pob_choice: Give to a brother
  chosen_korean: 형제에게 주고
  alternatives_korean:
  - 동료에게 주고
  - 가까운 이에게 주고
  - 친족에게 주고
  lexicon: HALOT
  rationale: אָח는 문자적으로 ‘형제’이므로, 공동체적 관계를 살리면서도 성중립적 풀어쓰기로 과도하게 완화하지 않기 위해 ‘형제’로 옮겼습니다.
- source_word: וְחֹנֵן
  english_pob_choice: be gracious
  chosen_korean: 은혜를 베풀며
  alternatives_korean:
  - 호의를 베풀며
  - 친절을 보이며
  - 관대하며
  lexicon: HALOT
  rationale: חנן은 단순한 물질적 관대함보다 호의와 은총의 태도를 가리키므로, 한국어에서는 윤리적·관계적 뉘앙스를 살려 ‘은혜를 베풀다’로 옮겼습니다.
- source_word: וּפַנֵּק נַפְשֶׁךָ
  english_pob_choice: pamper yourself
  chosen_korean: 자기 자신을 돌보십시오
  alternatives_korean:
  - 자신을 푸대접하지 마십시오
  - 자신을 만족시키십시오
  - 자신을 마음껏 누리십시오
  lexicon: HALOT
  rationale: פנק는 ‘아끼고 정성껏 대하다’와 동시에 유순하게 꾸며 주는 뉘앙스가 있어, 현대 한국어에서 노골적인 자기방종으로만 들리지 않도록 ‘자기 자신을 돌보다’로 절제해 옮겼습니다.
- source_word: כִּי אֵין בִּשְׁאוֹל
  english_pob_choice: for in Sheol there is no
  chosen_korean: 스올에서는
  alternatives_korean:
  - 무덤에서는
  - 음부에서는
  - 죽은 자의 세계에서는
  lexicon: HALOT
  rationale: שְׁאוֹל은 단순한 매장지가 아니라 죽은 자들의 영역을 가리키므로, 전통 용어를 지우지 않고 음역어 ‘스올’을 유지했습니다.
- source_word: לְבַקֵּשׁ תַּעֲנוּג
  english_pob_choice: seeking pleasure
  chosen_korean: 쾌락을 찾을 수 없기 때문입니다
  alternatives_korean:
  - 기쁨을 구할 수 없기 때문입니다
  - 즐거움을 찾을 수 없기 때문입니다
  - 향락을 추구할 수 없기 때문입니다
  lexicon: HALOT
  rationale: בקש + תענוג는 단순한 즐거움보다 쾌락/향락의 추구를 가리키므로, 문맥의 경고성을 살려 ‘쾌락을 찾다’로 옮겼습니다.
- source_word: וְכָל דָּבָר שֶׁיָּפֶה לַעֲשׂוֹת
  english_pob_choice: whatever is good to do
  chosen_korean: 하기에 좋은 일이라면 무엇이든
  alternatives_korean:
  - 마땅히 할 만한 일이라면 무엇이든
  - 하기에 알맞은 일이라면 무엇이든
  - 옳게 할 일이라면 무엇이든
  lexicon: HALOT
  rationale: יפה는 여기서 미적 ‘아름답다’보다 ‘좋다, 알맞다, 적절하다’의 뜻이므로, 자연스러운 현대어로 윤리적 적합성을 드러내는 표현을 택했습니다.
- source_word: לִפְנֵי אֱלֹהִים עֲשֶׂה
  english_pob_choice: do it before God
  chosen_korean: 하나님 앞에서 하십시오
  alternatives_korean:
  - 하나님 앞에서 행하십시오
  - 하나님의 면전에서 하십시오
  - 하나님 앞에 두고 하십시오
  lexicon: HALOT
  rationale: ‘before God’의 문자적·신학적 무게를 살리면서도 한국어에서 가장 자연스럽고 공적인 책임성의 표현인 ‘하나님 앞에서’를 택했습니다.
theological_decisions:
- issue: שְׁאוֹל의 처리
  chosen_reading: ‘스올’로 유지하여 죽은 자의 영역을 지칭하게 했습니다.
  alternative_readings:
  - 무덤
  - 음부
  - 저승
  rationale: 이 절은 죽음 이후의 한계를 경고하는 지혜문맥이므로, 개념을 평평하게 만들지 않고 고대 히브리어의 종말론적 범주를 보존하는 편이 더 충실합니다.
  doctrine_reference: Translation philosophy §3; contested terms policy
- issue: וּפַנֵּק נַפְשֶׁךָ의 완곡성
  chosen_reading: 노골적인 자기방종보다 절제된 자기돌봄의 뉘앙스를 살렸습니다.
  alternative_readings:
  - 자신을 방종하십시오
  - 자신을 즐기십시오
  - 자신을 마음껏 누리십시오
  rationale: 히브리어와 그리스어 평행문은 쾌락 추구를 경계하면서도, 표현 자체는 지혜문학 특유의 관용구를 사용합니다. 따라서 한국어는 도덕적 긴장을 지우지 않으면서도 과도하게 훈계조로 만들지 않도록 조정했습니다.
  doctrine_reference: Translation philosophy §1 and §3
