revisions:
- from: 형제에게 주고, 은혜를 베풀며, 자기 자신을 돌보십시오. 스올에서는 쾌락을 찾을 수 없기 때문입니다. 또한 하기에 좋은 일이라면 무엇이든 하나님 앞에서 하십시오.[a][b]
  to: 형제에게 주고 호의를 베풀며, 자신을 잘 대접하십시오.[a] 스올[b]에서는 즐거움을 구할 수 없기 때문입니다. 하기에 좋은 일이라면 무엇이든 하나님 앞에서 하십시오.[c]
  rationale: 히브리어를 우선하여 פנק의 자기 향유·후대의 의미를 ‘자신을 잘 대접하십시오’로 회복했습니다. חנן은 신학적으로 좁게 들릴 수 있는 ‘은혜’ 대신 일반적 호의를 뜻하는 표현으로 옮겼습니다. ‘스올’과 ‘하나님 앞에서’는 유지했으며, 각주 앵커를 해당 구절에 연결하고 그리스어 평행문의 난해한 이문을 투명하게 제시했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T19:10:17Z'
