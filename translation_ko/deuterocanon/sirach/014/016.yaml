  source_fidelity: ‘자기 자신을 돌보십시오’는 히브리어 וּפַנֵּק נַפְשֶׁךָ(자신을 잘 대하고 즐겁게 하다/사치스럽게 대하다)의 자기 향유·대접의 의미를 지나치게 약화합니다. 또한 원문의 ‘스올 안에는 즐거움을 구함이 없다’는 진술은 자연스러운 한국어로 유지할 수 있습니다. 그 밖에 ‘형제’, ‘스올’, ‘하나님 앞에서’는 히브리어 본문에 충실합니다.
  naturalness: 합쇼체는 대체로 적절합니다. 다만 ‘은혜를 베풀며’는 חנן의 일반적인 호의·친절의 뜻에 비해 한국어에서 신학적 ‘은혜’로 다소 좁게 들릴 수 있어 ‘호의를 베풀며’가 더 중립적이고 자연스럽습니다. 각주 표지는 해당 낱말이나 구절 바로 뒤에 두어야 합니다.
