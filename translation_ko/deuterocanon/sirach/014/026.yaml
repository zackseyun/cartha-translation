  terminology: ‘둥지’, ‘가지’, ‘깃들다’는 적절합니다. 히브리어 여성 단수 접미사가 가리키는 지혜/나무의 의인화는 한국어에서도 ‘그녀의’로 보존할 수 있습니다. 그리스어 σκέπη는 이 나무 비유에서는 ‘그늘’로 자연스럽게 옮길 수 있습니다.
