translation:
  language: ko
  text: 그는 그녀의 잎 무성한 곳에 자기 둥지를 틀고, 그녀의 가지들 사이에 깃듭니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 병행본문은 “그는 자기 자녀들을 그녀의 그늘에 두고, 그녀의 가지들 아래에 머문다”라고 읽습니다. 히브리어는 “자기 둥지”와 “그녀의 잎 무성한 곳”이라고 읽습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְיָשִׂים
  english_pob_choice: He sets
  chosen_korean: 두고
  alternatives_korean:
  - 놓고
  - 세우고
  - 둡니다
  lexicon: HALOT
  rationale: 나뭇가지에 둥지를 ‘set’한다는 동작을 한국어로 자연스럽게 옮기되, 과도하게 설명하지 않기 위해 ‘두다’ 계열을 택했습니다.
- source_word: קִנּוֹ
  english_pob_choice: his nest
  chosen_korean: 그 둥지
  alternatives_korean:
  - 그 보금자리
  - 그 집
  - 그 거처
  lexicon: HALOT
  rationale: 히브리어 קן은 문자적으로 ‘둥지’이므로, 이미지의 구체성을 살리기 위해 ‘둥지’로 옮겼습니다.
- source_word: בְעָפְיָהּ
  english_pob_choice: in her foliage
  chosen_korean: 그 나뭇잎 사이에
  alternatives_korean:
  - 그 잎사귀 속에
  - 그 잎들 사이에
  - 그 수풀에
  lexicon: HALOT
  rationale: עֹף/עָפִיָּהּ는 잎이 무성한 ‘잎사귀/엽리’를 가리키므로, 한국어에서는 ‘나뭇잎 사이에’로 자연스럽고 시각적으로 옮겼습니다.
- source_word: וּבַעֲנָפֶיהָ
  english_pob_choice: among her branches
  chosen_korean: 그 가지들 사이에
  alternatives_korean:
  - 그 가지들 속에
  - 그 가지 아래에
  - 그 가지들 밑에
  lexicon: HALOT
  rationale: ענף는 ‘가지’이므로 기본 의미를 유지했고, 전치사의 공간감을 살리기 위해 ‘사이에’를 선택했습니다.
- source_word: יִתְלוֹנָן
  english_pob_choice: lodges
  chosen_korean: 깃듭니다
  alternatives_korean:
  - 머뭅니다
  - 묵습니다
  - 밤을 보냅니다
  lexicon: HALOT
  rationale: 이 동사는 ‘묵다/머물다’의 뜻을 가지며, 새가 둥지와 가지에 ‘깃들다’는 한국어 관용이 문맥의 생생한 은유를 잘 살립니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행본문의 차이
  chosen_reading: 본문은 히브리어의 ‘그 둥지’와 ‘그 나뭇잎 사이에’를 따르고, 그리스어의 ‘그의 자녀들/그 덮개 아래’ 이미지는 각주로만 반영했습니다.
  alternative_readings:
  - 그의 자녀들을 그녀의 보호 아래 두고, 그 가지들 아래에 머문다
  rationale: 집회서에서는 히브리어가 존속하는 경우 히브리어 본문을 मुख्य 본문으로 삼는 원칙에 따라, 히브리어의 새 둥지 이미지가 문맥상 더 직접적이어서 이를 채택했습니다.
  doctrine_reference: 'PHILOSOPHY.md: translate from Hebrew where Sirach Hebrew survives; use Greek alongside it.'
