  footnotes:
  - marker: a
    text: The Hebrew witness also includes a bracketed clause, 'and do not withhold good from yourself,' but its wording is uncertain in the presented source and may be secondary; the Greek parallel instead reads, 'and do not let your share in a good desire pass you by.'
