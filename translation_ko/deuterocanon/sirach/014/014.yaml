revisions:
- from: 좋은 날을 스스로 빼앗기지 마십시오. 그리고 바람직한 몫이 지나가게 두지 마십시오.[a]
  to: 좋은 날을 자신에게서 빼앗지 마십시오[a]. 그리고 좋은 소망에서 얻을 몫을 놓치지 마십시오.
  rationale: 피동형을 능동·재귀적 표현으로 고쳐 첫째 절의 핵심 의미를 회복했습니다. 둘째 절은 후대의 영어 수정안인 ‘바람직한 몫’을 따르지 않고, 제시된 그리스어 평행문의 μερὶς ἐπιθυμίας ἀγαθῆς가 지닌 ‘좋은 소망’과 ‘몫’의 관계를 한국어로 보존했습니다. 각주는 불확실한 히브리어 보완절과 그리스어 평행문의 차이를 중립적으로 설명합니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T19:10:16Z'
review_pass:
  verdict: revise
  source_fidelity: 첫째 절의 히브리어 אַל תִּמְנַע מִטּוֹבַת יוֹם 및 그리스어 μὴ ἀφυστερήσῃς ἀπὸ ἀγαθῆς ἡμέρας는 자기 자신에게 좋은 날을 누릴 것을 박탈하지 말라는 권면입니다. 초안의 ‘스스로 빼앗기지 마십시오’는 피동형으로 읽혀 타인에게 빼앗기는 일을 금하는 뜻이 되므로 원문의 재귀적 의미를 전달하지 못합니다. 둘째 절은 제시된 그리스어의 ‘좋은 소망/바람의 몫’을 유지해야 하며, ‘바람직한 몫’은 ἐπιθυμίας(소망·바람)를 탈락시킵니다.
  naturalness: ‘좋은 날을 자신에게서 빼앗지 마십시오’는 현대 표준 한국어의 합쇼체로 자연스럽고, 주체가 자기 자신임을 분명히 합니다. ‘좋은 소망에서 얻을 몫’은 직역적인 ‘좋은 소망의 몫’보다 자연스럽지만, 소망과 몫의 관계를 보존합니다.
  terminology: ‘몫’은 μερὶς에 적절합니다. ἐπιθυμία는 여기서 성적 욕망이나 교리적 개념으로 좁힐 이유가 없으므로 ‘소망’으로 옮겨 긍정적 바람이라는 문맥을 살렸습니다. 불확실한 대괄호 히브리어 보완절은 본문에 넣지 않고 각주에서 정확히 알립니다.
  issues:
  - severity: high
    issue: ‘스스로 빼앗기지 마십시오’가 피동 의미로 읽힙니다.
    rationale: 원문과 영어 감사 기록은 자신이 자신에게 좋은 것을 박탈하지 말라는 뜻입니다. 현 번역은 ‘남에게 빼앗기지 말라’는 다른 의미를 낳습니다.
  - severity: medium
    issue: ‘바람직한 몫’이 그리스어 ἐπιθυμίας(바람·소망·욕구)를 생략합니다.
    rationale: 형용사 ‘바람직한’은 ἀγαθῆς만 대략 반영할 뿐, ‘좋은 소망의 몫’이라는 그리스어의 관계를 보존하지 못합니다.
  - severity: low
    issue: 각주가 그리스어 평행문의 실제 둘째 절 내용을 제시하지 않습니다.
    rationale: 대괄호 히브리어 보완절을 본문에서 제외한 근거를 독자가 확인할 수 있도록, 그리스어가 ‘좋은 소망의 몫’이라고 읽는다는 점을 밝혀야 합니다.
  revised_text: 좋은 날을 자신에게서 빼앗지 마십시오[a]. 그리고 좋은 소망에서 얻을 몫을 놓치지 마십시오.
