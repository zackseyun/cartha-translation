translation:
  language: ko
  text: 좋은 날을 자신에게서 빼앗지 마십시오[a]. 그리고 좋은 소망에서 얻을 몫을 놓치지 마십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 전승에는 대괄호로 표시된 불확실한 보완절, ‘그리고 좋은 것을 자신에게서 거두지 말라’가 있습니다. 본문은 이 보완절을 포함하지 않았으며, 그리스어 평행문은 ‘좋은 소망의 몫이 당신을 지나쳐 가지 않게 하라’고 읽습니다.
    reason: textual_variant
lexical_decisions:
- source_word: אַל תִּמְנַע / μὴ ἀφυστερήσῃς
  english_pob_choice: Do not deprive yourself of
  chosen_korean: 스스로 빼앗기지 마십시오
  alternatives_korean:
  - 자신에게서 거두지 마십시오
  - 스스로 빼앗아 버리지 마십시오
  lexicon: HALOT; BDAG
  rationale: 히브리어는 ‘막다/거두다’의 뜻이고, 그리스어는 ‘박탈하다’의 뉘앙스를 분명히 하므로, 자기 자신에게서 좋은 것을 빼앗지 말라는 금지를 살리기 위해 이렇게 옮겼습니다.
- source_word: מִטּוֹבַת יוֹם / ἀπὸ ἀγαθῆς ἡμέρας
  english_pob_choice: a good day
  chosen_korean: 좋은 날
  alternatives_korean:
  - 날의 선함
  - 오늘의 좋은 것
  lexicon: HALOT; LSJ
  rationale: 직역에 가깝지만 한국어로 자연스러운 표현을 택해, 현재 주어진 좋은 날의 향유라는 의미를 보존했습니다.
- source_word: μερὶς
  english_pob_choice: share
  chosen_korean: 몫
  alternatives_korean:
  - 분깃
  - 부분
  lexicon: BDAG; LSJ
  rationale: 그리스어의 ‘할당된 몫’이라는 의미를 살리면서 한국어로도 자연스럽게 읽히는 말을 선택했습니다.
- source_word: ἐπιθυμίας ἀγαθῆς
  english_pob_choice: a good desire
  chosen_korean: 바람직한
  alternatives_korean:
  - 좋은
  - 선한
  - 마땅한
  lexicon: BDAG; LSJ
  rationale: ‘선한 욕망’보다 한국어 문맥에서 덜 도덕화된 표현으로, 좋은/바람직한 바라는 것의 성격을 간결하게 드러냅니다.
- source_word: μὴ σε παρελθάτω
  english_pob_choice: do not let ... pass you by
  chosen_korean: 지나가게 두지 마십시오
  alternatives_korean:
  - 지나쳐 버리게 두지 마십시오
  - 놓치지 마십시오
  lexicon: BDAG; LSJ
  rationale: ‘지나가다/지나치다’의 동작상을 살려, 기회나 몫이 그대로 흘러가 버리는 이미지를 유지했습니다.
theological_decisions:
- issue: 둘째 행의 의미를 히브리어 보완절보다 그리스어 평행문에 더 의존할지 여부
  chosen_reading: 본문에는 안정적인 주절만 두고, 둘째 행은 그리스어의 ‘몫/좋은 욕구’ 구조를 따라 번역했습니다.
  alternative_readings:
  - 브래킷된 히브리어를 본문에 포함한다
  - 그리스어를 따라 ‘좋은 욕망의 몫’으로 더 직역한다
  rationale: 제시된 히브리어 보완절은 불확실하다고 표시되어 있으므로 본문에는 넣지 않고, 그리스어 평행문이 주는 의미를 한국어로 자연스럽게 반영했습니다.
  doctrine_reference: 시락서는 현전하는 히브리어를 우선하되, 불확실한 곳은 평행 전승으로 보정한다는 편집 원칙
- issue: ‘바람직한 몫’의 도덕적 색채
  chosen_reading: ‘좋은’보다 조금 더 판별적이지만 과도하게 신학화하지 않는 ‘바람직한’으로 처리했습니다.
  alternative_readings:
  - 좋은 몫
  - 선한 몫
  - 욕구의 몫
  rationale: 그리스어 ἐπιθυμία가 단순한 욕망인지 바람직한 갈망인지 열려 있으므로, 독자가 과도하게 육욕적으로 읽지 않도록 하면서도 의미의 긴장을 보존했습니다.
  doctrine_reference: 시락 14:14의 교훈적 권면 구조
