base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/014/025.yaml
  text: He pitches his tent beside her[b][a], and he lodges in a good dwelling-place.
  footnotes:
  - marker: a
    text: Literally, 'upon/by her hand,' an idiom for nearness; compare the Greek 'according to her hands.'
    reason: lexical_alternative
  - marker: b
    text: Or 'and he dwells in a pleasant lodging.' The Hebrew wording is compact, and the Greek parallel suggests the sense of lodging in a good place.
    reason: alternative_reading
translation:
  language: ko
  text: 그는 그녀의 곁에[a] 자기 천막을 치고, 좋은 거처에 머뭅니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘그녀의 손 위/곁에’이지만, 관용적으로는 가까움을 뜻합니다.
    reason: source_note
  - marker: b
    text: 그리스어 평행구는 ‘좋은 것들의 거처’ 또는 ‘좋은 곳에서 묵는 것’으로 이해될 수 있습니다.
    reason: cross_reference
lexical_decisions:
- source_word: וְנוֹטֶה אָהֳלוֹ
  english_pob_choice: He pitches his tent
  chosen_korean: 자기 천막을 치고
  alternatives_korean:
  - 자기 천막을 펴고
  - 자기 천막을 세우고
  lexicon: HALOT
  rationale: נטה와 אָהֶל의 결합은 천막을 ‘치다/펴다’는 구체적 이미지로 이해하는 것이 자연스럽고, 한국어에서도 이를 그대로 살리는 편이 본문의 장면을 잘 드러냅니다.
- source_word: עַל יָדָהּ
  english_pob_choice: beside her hand
  chosen_korean: 그녀의 곁에
  alternatives_korean:
  - 그녀의 손에
  - 그녀의 손곁에
  - 그녀의 가까이에
  lexicon: HALOT
  rationale: 직역하면 ‘그녀의 손 위/곁에’이지만, 히브리어 관용구가 근접을 뜻하므로 ‘곁에’로 옮겨 의미와 자연스러움을 함께 살렸습니다.
- source_word: וְשָׁכַן
  english_pob_choice: he lodges
  chosen_korean: 머뭅니다
  alternatives_korean:
  - 거합니다
  - 묵습니다
  - 머뭅니다
  lexicon: HALOT
  rationale: 이 동사는 단순한 장기 거주보다 현재의 체류·숙박 뉘앙스가 있어, 천막 이미지와 어울리는 ‘머무르다’가 적절합니다.
- source_word: שֹׁכֶן טוֹב
  english_pob_choice: a good dwelling-place
  chosen_korean: 좋은 거처
  alternatives_korean:
  - 좋은 주거지
  - 좋은 머묾
  - 편한 거처
  lexicon: HALOT; LSJ
  rationale: 히브리어가 압축되어 있고 그리스어 평행구가 ‘좋은 장소에서의 숙박’을 시사하므로, 과도하게 풀지 않고 ‘좋은 거처’로 간결하게 처리했습니다.
theological_decisions:
- issue: 지혜를 여성 인격으로 지칭하는 표현
  chosen_reading: ‘그녀’로 그대로 옮겨 지혜의 여성적 인격화를 유지했습니다.
  alternative_readings:
  - ‘그것’으로 바꾸어 비인격화함
  rationale: 문맥 전체가 지혜를 여성으로 의인화하므로, 한국어에서도 그 문학적·신학적 이미지가 보존되어야 합니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: 천막과 거처의 비유를 추상화할지 여부
  chosen_reading: 구체적 천막/거처 이미지를 유지했습니다.
  alternative_readings:
  - ‘지혜와 가까이 지낸다’처럼 추상화함
  rationale: 본문은 지혜와의 친밀함을 천막과 숙박의 생생한 이미지로 표현하므로, 이를 평이한 추상으로 바꾸지 않았습니다.
  doctrine_reference: Translation philosophy §1, §6
