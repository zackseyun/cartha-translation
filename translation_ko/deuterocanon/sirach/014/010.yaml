  text: An evil eye is stingy over bread[b][a], and there is meanness at his table.
  footnotes:
  - marker: a
    text: Hebrew 'evil eye' is an idiom for a grudging, stingy, or envious disposition. The Greek parallel likewise supports this sense.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew wording in the second clause is somewhat difficult; the Greek parallel reads in a way that supports the sense 'meanness' or 'miserliness at his table.'
    reason: alternative_reading
translation:
  language: ko
  text: 악한 눈은 빵을 내주기를 아까워하고[a], 그의 식탁에는 인색함이 있습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘악한 눈’은 인색함, 질투, 또는 남에게 내주기를 아까워하는 태도를 가리키는 관용구이며, 그리스어 병행구도 이 뜻을 지지합니다.
    reason: lexical_alternative
  - marker: b
    text: 둘째 절의 히브리어 표현은 다소 어렵습니다. 그리스어 병행구는 그의 식탁에 인색함 또는 빈약함이 있다는 의미를 뒷받침합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: עַיִן רַע / ὀφθαλμὸς πονηρός
  english_pob_choice: an evil eye
  chosen_korean: 악한 눈
  alternatives_korean:
  - 악한 눈초리
  - 구두쇠 같은 눈
  - 탐욕스러운 눈
  lexicon: HALOT; BDAG
  rationale: 히브리어와 그리스어의 관용구를 직역하되, 한국어에서는 익숙한 관용 표현보다 의미를 분명히 드러내는 ‘악한 눈’으로 옮겨 탐욕·질투·인색함의 함의를 살렸습니다.
- source_word: תָּעִיט / φθονερὸς
  english_pob_choice: is stingy
  chosen_korean: 아끼고
  alternatives_korean:
  - 인색하고
  - 구두쇠처럼 굴고
  - 시기하고
  lexicon: HALOT; BDAG
  rationale: POB가 포착한 핵심은 음식에 대한 인색함이므로, 한국어에서는 동작상 자연한 ‘아끼고’로 옮겨 관용구의 실제 의미를 전달했습니다.
- source_word: מְהוּמָה
  english_pob_choice: meanness
  chosen_korean: 인색함
  alternatives_korean:
  - 궁핍
  - 어수선함
  - 비천함
  lexicon: HALOT
  rationale: 본문의 두 번째 절은 그리스어 병행구가 시사하는 ‘meanness / miserliness’ 쪽이므로, 식탁의 상태를 나타내는 명사로 ‘인색함’을 택했습니다.
- source_word: שֻׁלְחָנוֹ / τράπεζα αὐτοῦ
  english_pob_choice: his table
  chosen_korean: 그 식탁에는
  alternatives_korean:
  - 그의 식탁에는
  - 그 상에는
  lexicon: HALOT; BDAG
  rationale: 식탁을 단순한 물건이 아니라 제공과 환대의 자리로 드러내기 위해, 한국어에서는 문맥상 자연한 ‘그 식탁에는’으로 표현했습니다.
theological_decisions:
- issue: 도덕적 경고의 어조 유지
  chosen_reading: 지혜문학의 짧은 경구로서, 판단적 설명을 덧붙이지 않고 인색함과 악한 눈의 대응을 직접적으로 제시했습니다.
  alternative_readings:
  - ‘악한 눈’을 ‘시기하는 눈’으로 풀어 설명하기
  - 두 번째 절을 더 해설적으로 재구성하기
  rationale: 본문은 원인-결과식 교훈을 압축적으로 말하므로, 한국어도 간결한 병렬 구조를 유지하는 것이 저자의 의도를 가장 잘 반영합니다.
  doctrine_reference: 지혜문학의 경구체, 잠언적 교육
