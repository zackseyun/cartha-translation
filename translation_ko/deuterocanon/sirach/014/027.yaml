    rationale: 히브리어 여성 접미사는 문맥의 지혜를 가리킵니다. 한국어에서는 성별을 표시하지 않는 ‘그 거처들’이 더 정확하고 자연스럽습니다.
  - severity: medium
    issue: ‘피난처들’은 מעונות의 기본 뜻 ‘거처들/거주처들’보다 해석을 더한 표현입니다.
    rationale: 보호의 문맥은 유지하되, 본문에서는 ‘거처들’로 번역하여 원어의 주거 의미를 보존하는 편이 안전합니다.
