translation:
  language: ko
  text: 그는 그 그늘 아래에서 더위를 피해 피신하고, 그 거처들 안에 머뭅니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '또는 그리스어 병행본문을 더 가깝게 따르면: “그는 뜨거운 열기로부터 그것의 보호를 받을 것이며, 그것의 영광 안에 머무를 것입니다.” 히브리어는 “그 거처들”이라고 읽는 반면, 그리스어는 “그것의 영광”이라고 읽습니다.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְחוֹסֶה
  english_pob_choice: He takes refuge
  chosen_korean: 더위를 피하는 이
  alternatives_korean:
  - 피난하는 이
  - 피신하는 이
  - 피난처를 찾는 이
  lexicon: HALOT חסה
  rationale: כָּסָה/חסה의 보호·피난 이미지를 살리되, 한국어에서는 목적어를 드러내는 직역보다 자연스러운 현재분사형으로 시적 일반 진술을 표현했습니다.
- source_word: בְּצִלָּהּ
  english_pob_choice: in its shade
  chosen_korean: 그늘 아래에서
  alternatives_korean:
  - 그의 그늘에서
  - 그늘 속에서
  - 그늘 아래
  lexicon: HALOT צל
  rationale: צֵל은 물리적 ‘그늘/그늘 아래’의 이미지를 지니므로, ‘아래에서’로 위치감을 살려 보호의 이미지를 자연스럽게 전달했습니다.
- source_word: מֵחֹרֶב
  english_pob_choice: from the heat
  chosen_korean: 더위를
  alternatives_korean:
  - 뜨거움에서
  - 무더위를
  - 작열하는 더위에서
  lexicon: HALOT חרב
  rationale: חרב는 더위와 건조함의 결합된 고통을 가리킬 수 있으나, 문맥상 ‘더위’가 가장 직접적이고 한국어 성경 문체에도 잘 맞습니다.
- source_word: וּבִמְעוֹנוֹתֶיהָ
  english_pob_choice: in its shelters
  chosen_korean: 그의 피난처들 안에서
  alternatives_korean:
  - 그의 거처들 안에서
  - 그의 거주처들에
  - 그의 피난처들에서
  lexicon: HALOT מעון
  rationale: מעונות는 ‘거처/살 곳’이지만 보호 기능이 강하므로 ‘피난처들’로 옮겨, 앞절의 그늘 이미지와 함께 안전한 거주를 강조했습니다.
- source_word: יִשְׁכֹּן
  english_pob_choice: he dwells
  chosen_korean: 거주합니다
  alternatives_korean:
  - 살 것입니다
  - 머뭅니다
  - 거처합니다
  lexicon: HALOT שכן
  rationale: שכן의 기본 뜻인 ‘거주하다’를 살리면서도, 지혜문학의 진술체에 맞게 현대적이고 격식 있는 표현으로 정리했습니다.
theological_decisions:
- issue: 의인화된 대상의 성별 표지 처리
  chosen_reading: 히브리어 여성 접미사를 한국어에서는 중립적 ‘그의’로 옮겼습니다.
  alternative_readings:
  - 그녀의 그늘
  - 그녀의 피난처들
  rationale: 원문은 문법상 여성형이지만, 여기서는 지혜의 의인화가 배경에 있어도 한국어 문맥에서는 대상의 기능(보호하는 그늘/피난처)이 더 중요하므로 중립화했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 6
- issue: 시적 일반 진술의 시제
  chosen_reading: 현재형을 사용해 보편적 진리를 표현했습니다.
  alternative_readings:
  - 피난할 것입니다
  - 거주할 것입니다
  rationale: 히브리어 분사·미완료형의 잠정적/상시적 성격을 한국어 현재형으로 반영하면 잠언적·교훈적 뉘앙스가 자연스럽게 살아납니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
