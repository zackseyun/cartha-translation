lexical_decisions:
- source_word: הַחוֹנֶה
  english_pob_choice: He who camps
  chosen_korean: 진을 치고
  alternatives_korean:
  - 천막을 치고
  - 장막을 치고
  - 주둔하고
  lexicon: HALOT
  rationale: חנה의 기본 뜻은 ‘진을 치다/캠프하다’이므로, 반복적·습관적 행위를 자연스럽게 드러내는 ‘진을 치고’로 옮겼습니다.
- source_word: סְבִיבוֹת
  english_pob_choice: around
  chosen_korean: 주위에
  alternatives_korean:
  - 둘레에
  - around
  lexicon: HALOT
  rationale: 히브리어는 집을 둘러싼 배치를 생생하게 나타내므로, 단순한 ‘가까이’보다 둘러싼 위치를 드러내는 ‘주위에’가 적절합니다.
- source_word: יְתֵדָיו
  english_pob_choice: his tent peg
  chosen_korean: 자기 말뚝
  alternatives_korean:
  - 자기 천막 말뚝
  - 자기 말뚝들
  - 자기 못
  lexicon: HALOT
  rationale: יתד는 진영 문맥에서 ‘말뚝/천막 말뚝’이므로, 한국어에서 자연스럽고 이미지가 살아 있는 ‘말뚝’으로 옮겼습니다.
- source_word: בְּקִירָהּ
  english_pob_choice: into her wall
  chosen_korean: 그녀의 성벽에
  alternatives_korean:
  - 그녀의 벽에
  - 그녀의 담에
  - 그녀의 벽 속에
  lexicon: HALOT
  rationale: קיר는 기본적으로 ‘벽’이지만, 앞의 천막 말뚝 이미지와 결합될 때 고정 대상이 되는 구조물을 가리키므로 문맥상 ‘성벽’이 더 구체적이고 자연스럽습니다.
