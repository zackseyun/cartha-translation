translation:
  language: ko
  text: 그녀의 집 주위에 진을 치고, 그녀의 성벽에 자기 말뚝을 박는 사람은—[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그녀의 집 가까이에 거주하며 그녀의 벽들에 말뚝을 고정하는 사람은’. 그리스어 병행문은 더 분명하게 ‘가까이’를 말하지만, 히브리어는 ‘주위에’라는 생생한 이미지를 사용합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הַחוֹנֶה
  english_pob_choice: He who camps
  chosen_korean: 진을 치고
  alternatives_korean:
  - 천막을 치고
  - 장막을 치고
  - 주둔하고
  lexicon: HALOT
  rationale: חנה의 기본 뜻은 ‘진을 치다/캠프하다’이므로, 반복적·습관적 행위를 자연스럽게 드러내는 ‘진을 치고’로 옮겼습니다.
- source_word: סְבִיבוֹת
  english_pob_choice: around
  chosen_korean: 주위에
  alternatives_korean:
  - 둘레에
  - around
  lexicon: HALOT
  rationale: 히브리어는 집을 둘러싼 배치를 생생하게 나타내므로, 단순한 ‘가까이’보다 둘러싼 위치를 드러내는 ‘주위에’가 적절합니다.
- source_word: יְתֵדָיו
  english_pob_choice: his tent peg
  chosen_korean: 자기 말뚝
  alternatives_korean:
  - 자기 천막 말뚝
  - 자기 말뚝들
  - 자기 못
  lexicon: HALOT
  rationale: יתד는 진영 문맥에서 ‘말뚝/천막 말뚝’이므로, 한국어에서 자연스럽고 이미지가 살아 있는 ‘말뚝’으로 옮겼습니다.
- source_word: בְּקִירָהּ
  english_pob_choice: into her wall
  chosen_korean: 그녀의 성벽에
  alternatives_korean:
  - 그녀의 벽에
  - 그녀의 담에
  - 그녀의 벽 속에
  lexicon: HALOT
  rationale: קיר는 기본적으로 ‘벽’이지만, 앞의 천막 말뚝 이미지와 결합될 때 고정 대상이 되는 구조물을 가리키므로 문맥상 ‘성벽’이 더 구체적이고 자연스럽습니다.
theological_decisions:
- issue: 여성 대명사의 지시 대상
  chosen_reading: ‘그녀’는 앞 문맥의 지혜를 의인화한 존재를 가리킵니다.
  alternative_readings:
  - 일반적인 여자나 가정의 주인
  - 추상적 지혜를 가리키는 비인격적 표현
  rationale: 바로 앞 문맥이 지혜를 찾고 지켜보는 흐름이므로, 이 절의 집·벽 이미지는 지혜의 의인화를 이어 가는 것으로 읽는 것이 가장 자연스럽습니다.
  doctrine_reference: 문맥적 인칭 지시
