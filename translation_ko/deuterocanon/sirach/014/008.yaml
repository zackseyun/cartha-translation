translation:
  language: ko
  text: 시기 어린 눈을 가진 사람은 악합니다.[a] 그는 얼굴을 돌리고 사람들을 멸시합니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘악한 눈을 가진 사람’입니다. 이 그리스어 관용구는 시기하거나 인색하고, 남에게 베풀기를 아까워하는 태도를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘목숨들’이나 ‘영혼들’입니다.
    reason: lexical_alternative
