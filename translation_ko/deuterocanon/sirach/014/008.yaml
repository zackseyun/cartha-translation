  naturalness: ‘시기하는 눈을 가진 사람’도 이해되지만 ‘시기 어린 눈을 가진 사람’이 현대 표준 한국어에서 더 자연스럽고, 그리스어 관용구의 정서적 뉘앙스도 잘 전달합니다. 각주 표지는 해당 어구 바로 뒤에 배치하는 편이 명확합니다.
