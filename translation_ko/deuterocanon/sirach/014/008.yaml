  lexicon: BDAG
  rationale: 문장 전체의 판정문 어조를 살리면서 도덕적 악성을 분명히 드러내기 위해 ‘악합니다’를 선택했습니다.
- source_word: ὁ βασκαίνων ὀφθαλμῷ
  english_pob_choice: the man with an envious eye
  chosen_korean: 시기하는 눈을 가진 사람
  alternatives_korean:
  - 악한 눈을 가진 사람
  - 질투의 눈을 가진 사람
  - 시기 어린 눈으로 보는 사람
  lexicon: BDAG
  rationale: 그리스어 관용구의 핵심은 눈의 이미지와 시기/인색함의 태도이므로, 직역보다 의미가 드러나는 ‘시기하는 눈을 가진 사람’으로 옮겼습니다.
- source_word: ἀποστρέφων πρόσωπον
  english_pob_choice: turning away his face
  chosen_korean: 얼굴을 돌리고
  alternatives_korean:
  - 그의 얼굴을 돌리고
  - 얼굴을 외면하고
  - 얼굴을 돌려
  lexicon: BDAG
  rationale: 행동의 구체적 이미지를 유지하되 한국어 문장 흐름에 맞게 간결하게 표현했습니다.
- source_word: ὑπερορῶν ψυχάς
  english_pob_choice: despising lives
  chosen_korean: 생명을 멸시합니다
  alternatives_korean:
  - 영혼들을 멸시합니다
  - 사람들을 멸시합니다
  - 생명들을 업신여깁니다
  lexicon: BDAG
  rationale: ψυχάς는 여기서 추상적 ‘영혼’보다 사람의 생명/삶을 가리키는 뜻이 강하므로 ‘생명’을 택해 구체성을 살렸습니다.
theological_decisions:
- issue: ψυχάς의 의미 범위
  chosen_reading: 생명으로 번역하여 사람의 삶 전체를 가리키게 함
  alternative_readings:
  - 영혼
  - 사람들
  rationale: 지혜문맥에서 ψυχή를 후기 신학 용어인 ‘영혼’으로 좁히지 않고, 본문이 겨냥하는 인간 생명에 대한 경멸을 드러내기 위해 ‘생명’으로 옮겼습니다.
  doctrine_reference: Translation philosophy §§1, 3
- issue: ὑπερορῶν의 태도 표현
  chosen_reading: 멸시합니다
  alternative_readings:
  - 업신여깁니다
  - 경멸합니다
  - 깔봅니다
  rationale: 단순한 무시보다 적극적 경멸을 드러내는 동사로 본문의 윤리적 강도를 보존했습니다.
  doctrine_reference: Translation philosophy §§1, 6
