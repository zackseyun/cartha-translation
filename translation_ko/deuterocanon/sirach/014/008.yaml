  - marker: b
    text: Or, 'souls' or 'persons.'
    reason: lexical_alternative
translation:
  language: ko
  text: 시기하는 눈을 가진 사람은 악합니다. 그는 얼굴을 돌리고 생명을 멸시합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘악한 눈을 가진 사람’입니다. 이 그리스어 관용구는 시기, 인색함, 아까워하는 태도를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘영혼들’이나 ‘사람들’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: πονηρὸς
  english_pob_choice: evil
  chosen_korean: 악합니다
  alternatives_korean:
  - 악한 사람입니다
  - 사악합니다
