translation:
  language: ko
  text: 창문 틈으로 들여다보며, 그 문들 곁에서 그는 엿듣습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그는 엿듣습니다’. 히브리어 동사는 가까이서 주의 깊게 듣는 뜻을 지니며, 그리스어 평행구는 ‘듣습니다’로 표현합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּשְׁקִיף
  english_pob_choice: One who looks in
  chosen_korean: 들여다보며
  alternatives_korean:
  - 엿보며
  - 안을 훔쳐보며
  - 내다보는 자
  lexicon: HALOT
  rationale: שׁקף의 ‘기울여 들여다보다/내다보다’ 뉘앙스를 살리되, 문맥상 창문으로 안을 훔쳐보는 동작이므로 자연스러운 동사구로 옮겼습니다.
- source_word: בְּעַד חֲלוֹנָה
  english_pob_choice: through her window
  chosen_korean: 창문 틈으로
  alternatives_korean:
  - 그녀의 창문으로
  - 창문을 통해
  - 그의 창문 너머로
  lexicon: HALOT
  rationale: בְּעַד의 공간적 의미인 ‘~을 통해’를 반영하면서, 문맥의 은밀한 엿봄을 한국어로 가장 생생하게 드러내는 표현을 택했습니다.
- source_word: וְעַל פְּתָחֶיהָ
  english_pob_choice: and at her doorway
  chosen_korean: 그 문들 곁에서
  alternatives_korean:
  - 그녀의 문들에서
  - 문간에서
  - 출입구에서
  lexicon: HALOT
  rationale: פתח의 복수형과 3인칭 여성형 접미사를 살리되, 한국어에서는 복수성을 유지하면서도 ‘곁에서’로 접근성과 은밀함을 함께 드러냈습니다.
- source_word: יְצוֹתֵת
  english_pob_choice: he will listen
  chosen_korean: 그는 엿듣습니다
  alternatives_korean:
  - 그는 듣습니다
  - 그는 귀를 기울입니다
  - 그는 몰래 듣습니다
  lexicon: HALOT
  rationale: 히브리어 동사의 ‘주의 깊게, 몰래 듣다’는 뜻을 반영해 단순한 ‘듣다’보다 더 분명한 한국어 동사 ‘엿듣다’를 선택했습니다. 이와 함께 영어 주석의 대안 번역도 잘 드러납니다.
theological_decisions:
- issue: 지혜의 여성적 의인화 유지
  chosen_reading: ‘그녀의 창문’, ‘그 문들’처럼 여성 인칭을 유지했습니다.
  alternative_readings:
  - 중성적 ‘그것의’로 바꾸기
  - 의인화를 약화해 일반 대명사로 처리하기
  rationale: 전후 문맥에서 지혜가 여인/집주인처럼 의인화되어 있으므로, 이를 평탄화하지 않고 원문의 이미지를 보존했습니다.
