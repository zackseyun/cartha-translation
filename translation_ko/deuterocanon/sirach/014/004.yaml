translation:
  language: ko
  text: 자기 자신을 아끼는 자는 다른 이를 위해 모으게 되며, 낯선 이들이 그의 재산을 누리게 됩니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 단수 ‘낯선 사람’을 쓰지만, 그리스어 병행본문은 복수 ‘다른 이들’을 읽습니다. 한국어는 이 일반적 복수 의미를 따랐습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: מוֹנֵעַ לְנַפְשׁוֹ
  english_pob_choice: He who deprives himself
  chosen_korean: 자기 자신을 아끼는 자
  alternatives_korean:
  - 자기 자신을 금하는 자
  - 자기 자신에게서 빼앗는 자
  - 자기 자신을 박탈하는 자
  lexicon: HALOT
  rationale: מנע는 ‘막다, 금하다, 빼앗다’의 뉘앙스를 가지지만, כאן은 자기 몫을 스스로 제한하는 역설적 표현이어서 자연스러운 한국어로는 ‘자기 자신을 아끼는 자’가 문맥을 가장 잘 살립니다.
- source_word: יִקְבֹּץ לְאַחֵר
  english_pob_choice: will gather for another
  chosen_korean: 다른 이를 위해 모으게 되며
  alternatives_korean:
  - 다른 이를 위해 모으게 되고
  - 다른 사람을 위해 모으게 되며
  - 남을 위해 쌓게 되며
  lexicon: HALOT
  rationale: קבץ는 ‘모으다, جمع하다’의 뜻으로, 소유를 축적했지만 결국 타인의 몫이 된다는 역설을 살려 ‘다른 이를 위해 모으게 되며’로 옮겼습니다.
- source_word: וּבְטוֹבָתוֹ
  english_pob_choice: in his goods
  chosen_korean: 그의 재산을
  alternatives_korean:
  - 그의 좋은 것들을
  - 그의 좋은 것 안에서
  - 그의 복리를
  lexicon: HALOT
  rationale: טוֹבָה는 여기서 추상적 ‘좋음’보다 실제 소유물과 재화를 가리키는 것으로 이해하는 편이 자연스럽고, 헬라어 ἐν τοῖς ἀγαθοῖς αὐτοῦ도 이를 뒷받침하므로 ‘재산’이 가장 간결합니다.
- source_word: זָר
  english_pob_choice: strangers
  chosen_korean: 낯선 이들
  alternatives_korean:
  - 낯선 사람들
  - 외인들
  - 타인들
  lexicon: HALOT
  rationale: 히브리어 단수 זָר는 일반적으로 ‘낯선 사람/외인’의 범주를 가리킬 수 있고, 헬라어 병행본문의 복수 ἕτεροι도 일반화된 복수 의미를 지지하므로 한국어에서는 집합적 복수인 ‘낯선 이들’로 옮겼습니다.
theological_decisions:
- issue: 지혜 문학의 역설적 인과 표현
  chosen_reading: 자기 절제처럼 보이는 행위가 실제로는 타인을 위한 축적이 된다는 역설을 그대로 살렸습니다.
  alternative_readings:
  - 도덕적 훈계로 완화하여 ‘아끼는 자’의 뉘앙스를 약하게 만드는 읽기
  - 단순한 경제적 조언으로 축소하는 읽기
  rationale: 본절은 소유를 움켜쥐는 삶의 공허함을 드러내는 지혜 문학의 역설을 담고 있으므로, 의미를 완화하지 않고 결과의 반전을 분명히 드러내야 합니다.
  doctrine_reference: 지혜 문학의 관찰적 교훈과 청지기적 재물 이해
