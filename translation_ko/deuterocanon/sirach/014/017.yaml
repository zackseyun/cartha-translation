  source_fidelity: 첫째 절의 ‘모든 육체’와 ‘옷처럼’은 히브리어 כָּל־הַבָּשָׂר, כַּבֶּגֶד를 충실히 반영합니다. 다만 יִבְלֶה는 ‘낡다/닳다’이지 반드시 ‘없어지다’까지 명시하지 않으므로, ‘닳아 없어지고’는 의미를 다소 확장합니다. 마지막 절은 히브리어가 난해하고 압축적이므로 반복 구조를 유지하되, 그리스어 평행본문의 해석적 성격은 주석에서 밝혀야 합니다.
  naturalness: ‘모든 육체’는 성서 문맥에서 자연스러운 문체입니다. ‘영원한 규정’은 이해할 수 있으나, 죽음의 보편적·고정적 질서를 가리키는 문맥에서는 ‘영원한 법칙’이 더 자연스럽고 분명합니다. ‘죽어 가는 자는 죽습니다’보다 복수형인 ‘죽어 가는 이들은 죽습니다’가 히브리어의 복수 동사와 한국어 문장 흐름에 더 잘 맞습니다.
  terminology: ‘육체’와 ‘옷’은 유지합니다. חֹק עוֹלָם은 특정 종교 교리의 ‘언약’으로 한정하지 않고 ‘영원한 법칙’으로 옮깁니다. גֹּוֵעַ יִגְוָעוּ의 반복성과 보편적 죽음의 뜻을 보존하며, 그리스어의 더 명시적인 표현을 본문에 과도하게 덧붙이지 않습니다.
