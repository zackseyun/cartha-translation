base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/014/017.yaml
  text: All flesh wears out like a garment[a], and the everlasting decree is, “Dying, they shall die.”
  footnotes:
  - marker: a
    text: Hebrew final clause literally reads something like “the dying die” or “one expiring, they expire,” a terse expression of universal mortality. The Greek parallel clarifies the sense as an age-old decree of death.
    reason: alternative_reading
translation:
  language: ko
  text: 모든 육체는 옷처럼 닳아 없어지고, 영원한 규정은 이렇습니다. “죽어 가는 자는 죽습니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 마지막 절은 문자적으로는 ‘죽어 가는 자는 죽는다’에 가까운 압축 표현입니다. 그리스어 평행본문도 죽음의 보편성을 확인합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: כָּל הַבָּשָׂר / πᾶσα σὰρξ
  english_pob_choice: All flesh
  chosen_korean: 모든 육체
  alternatives_korean:
  - 모든 사람
  - 모든 인류
  - 모든 생명체
  lexicon: HALOT; LXX πᾶσα σὰρξ
  rationale: 히브리어/그리스어의 관용적 표현을 살려 ‘육체’로 옮기면, 단순히 ‘사람들’보다 인간의 유한성과 소멸성을 더 직접적으로 드러낼 수 있습니다.
- source_word: כַּבֶּגֶד / ὡς ἱμάτιον
  english_pob_choice: like a garment
  chosen_korean: 옷처럼
  alternatives_korean:
  - 겉옷처럼
  - 의복처럼
  - 옷감처럼
  lexicon: HALOT; BDAG ἱμάτιον
  rationale: ‘옷’은 비유의 일상성과 소모성을 가장 자연스럽게 살리며, 한국어에서도 ‘닳아 없어지다’와 잘 맞습니다.
- source_word: יִבְלֶה / παλαιοῦται
  english_pob_choice: wears out
  chosen_korean: 닳아 없어지고
  alternatives_korean:
  - 낡아지고
  - 쇠해지고
  - 오래되어지고
  lexicon: HALOT; LSJ παλαιόω
  rationale: ‘בלה’와 그리스어의 ‘낡아지다/오래되다’는 의미를 한국어 동사구로 풀어, 소모와 노화를 함께 담았습니다.
- source_word: וְחֹק עוֹלָם / ἡ ... διαθήκη ἀπʼ αἰῶνος
  english_pob_choice: the everlasting decree
  chosen_korean: 영원한 규정
  alternatives_korean:
  - 영원한 법령
  - 옛적부터의 규정
  - 영원한 법도
  lexicon: HALOT חק; LXX διαθήκη
  rationale: חֹק은 고정된 규정·정해진 질서를 뜻하므로 ‘규정’이 가장 중립적입니다. ‘영원한’은 고정성과 지속성을 모두 살립니다.
- source_word: גֹּוֵעַ יִגְוָעוּ / Θανάτῳ ἀποθανῇ
  english_pob_choice: Dying, they shall die
  chosen_korean: 죽어 가는 자는 죽습니다
  alternatives_korean:
  - 죽어야 할 자는 죽습니다
  - 죽는 자는 반드시 죽습니다
  - 죽어 가며 죽습니다
  lexicon: HALOT; LXX interpretive parallel
  rationale: 히브리어의 난해한 중첩 표현과 그리스어의 죽음 강조를 함께 반영하기 위해, 한국어에서는 현재 진행적 감각과 확정성을 살린 반복 구조로 옮겼습니다.
theological_decisions:
- issue: 마지막 절의 난해한 죽음 표현을 어떻게 처리할지
  chosen_reading: ‘죽어 가는 자는 죽습니다’로 번역해, 보편적 죽음의 확정성을 드러내면서도 히브리어의 압축된 반복성을 유지했습니다.
  alternative_readings:
  - ‘죽는 자는 반드시 죽습니다’
  - ‘죽어 가며 죽습니다’
  - ‘죽어야 할 자는 죽습니다’
  rationale: 이 구절은 교리 논쟁보다 원문 난점이 핵심입니다. 따라서 직설적인 종결보다, 원문이 가진 압축성과 반복 효과를 한국어로 재현하는 쪽을 택했습니다.
  doctrine_reference: 'Sirach source handling: Hebrew as base text with Greek parallel used as interpretive support where the Hebrew is terse or difficult.'
