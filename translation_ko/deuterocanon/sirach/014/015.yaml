  source_fidelity: 히브리어의 수사 의문(긍정의 답을 예상함), ‘다른 이’, 재산, 그리고 제비/몫과 관련된 관용 표현을 대체로 반영합니다. 다만 초안의 ‘수고를 … 넘기고’는 수고라는 행위를 양도하는 뜻으로 읽혀, 문맥상 남겨지는 수고의 결실을 가리키는 의미를 한국어에서 충분히 전달하지 못합니다.
  naturalness: ‘아니, …겠습니까?’는 히브리어 הֲלֹא가 기대하는 긍정적 답변과 한국어의 일반적인 부정 반문 용법이 충돌할 수 있습니다. 또한 ‘당신의 수고를 몫을 나누는 이들에게’는 조사와 의미 연결이 어색합니다. ‘…남기게 되지 않겠습니까?’가 자연한 합쇼체 수사 의문입니다.
  terminology: ‘재산’, ‘다른 이’, ‘몫을 나누는 이들’은 적절합니다. לְיוֹדֵי גוֹרָל의 불확실하고 관용적인 성격은 본문에서 ‘몫을 나누는 이들’로 절제하여 옮기고, 각주에서 히브리어의 직역과 그리스어 병행 본문이 시사하는 분배 의미를 밝혀 두는 것이 좋습니다.
