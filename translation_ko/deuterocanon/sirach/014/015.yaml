translation:
  language: ko
  text: 당신의 재산은 다른 이에게 남기고, 당신이 수고하여 얻은 것은 몫을 나누는 이들에게[a] 넘기게 되지 않겠습니까?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어를 직역하면 ‘제비를 아는 이들에게’입니다. 이는 관용적인 표현으로 보이며, 그리스어 병행 본문은 상속 몫이나 배분의 분할을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  english_pob_choice: Will you not
  chosen_korean: 아니, …겠습니까?
  alternatives_korean:
  - …하지 않겠습니까?
  - 정말 …하시겠습니까?
  lexicon: HALOT
  rationale: 수사적 질문으로서 예상되는 대답을 압박하는 뉘앙스를 한국어의 반문형으로 살렸습니다.
- source_word: לְאַחֵר / ἑτέρῳ
  english_pob_choice: to another
  chosen_korean: 다른 이에게
  alternatives_korean:
  - 다른 사람에게
  - 남에게
  lexicon: HALOT
  rationale: 히브리어와 그리스어가 모두 ‘다른 사람’이라는 직접적 대상을 가리키므로, 간결하고 자연한 표준어로 옮겼습니다.
- source_word: חֵילֶךָ
  english_pob_choice: your wealth
  chosen_korean: 당신의 재산
  alternatives_korean:
  - 당신의 부
  - 당신의 소유
  - 당신의 재물
  lexicon: HALOT
  rationale: 지혜문학 문맥에서 물질적 소유를 가리키는 말로 보이며, 한국어에서는 ‘재산’이 가장 직설적이고 문맥상 자연합니다.
- source_word: וִיגִיעֲךָ / τοὺς κόπους σου
  english_pob_choice: your labor
  chosen_korean: 당신의 수고
  alternatives_korean:
  - 당신의 노동
  - 당신의 애씀
  - 당신의 노고
  lexicon: HALOT
  rationale: 히브리어의 ‘수고/노력’과 그리스어 κόποις의 뉘앙스를 함께 살리기 위해, 결과물보다 행위의 고단함을 드러내는 ‘수고’를 택했습니다.
- source_word: לְיוֹדֵי גוֹרָל / εἰς διαίρεσιν κλήρου
  english_pob_choice: to those who cast the lot
  chosen_korean: 몫을 나누는 이들에게
  alternatives_korean:
  - 제비를 뽑는 이들에게
  - 제비로 몫을 나누는 이들에게
  - 몫을 배분하는 이들에게
  lexicon: HALOT
  rationale: 히브리어의 관용적 표현과 그리스어의 ‘분배/몫’ 이미지를 함께 반영해, ‘제비’로만 좁히지 않고 상속 몫의 분배를 드러냈습니다.
theological_decisions:
- issue: 상속/몫 분배의 비유를 어떻게 옮길 것인가
  chosen_reading: 법적 유언 조항처럼 단정하지 않고, 재산이 결국 타인과 몫 분배의 대상이 된다는 경고로 번역했습니다.
  alternative_readings:
  - ‘상속자들에게’
  - ‘제비 뽑는 이들에게’
  rationale: 히브리어의 관용성과 그리스어 병행본문의 해석 여지를 유지해야 하므로, 특정 법적 절차를 과도하게 확정하지 않았습니다.
  doctrine_reference: 지혜문학의 수사적 권면과 소유의 무상성
