  yaml_path: translation/deuterocanon/sirach/014/007.yaml
  text: Even if he does good[a], he does it in forgetfulness, and in the end he reveals his evil.
  footnotes:
  - marker: a
    text: Or 'he does it forgetfully' or 'he does it as though forgotten'; the Greek phrase is literally 'in forgetfulness.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 비록 선을 행한다 해도, 그것을 잊은 듯이 행하며, 마침내 자신의 악을 드러냅니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘잊은 듯이’는 그리스어로는 직역하여 ‘망각 가운데서’입니다. ‘잊어버린 채로’ 또는 ‘마치 잊힌 것처럼’으로도 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: κἂν / εὖ ποιῇ
  english_pob_choice: Even if he does good
  chosen_korean: 그가 비록 선을 행하더라도
  alternatives_korean:
  - 그가 비록 잘하더라도
  - 선을 행한다 해도
  lexicon: LSJ
  rationale: κἂν은 양보를 나타내므로 ‘비록 … 하더라도’로 옮겼고, εὖ ποιῇ는 단순한 ‘잘하다’보다 도덕적 행위인 ‘선을 행하다’가 문맥에 더 가깝습니다.
- source_word: ἐν λήθῃ
  english_pob_choice: in forgetfulness
  chosen_korean: 망각 속에서
  alternatives_korean:
  - 잊어버린 채로
  - 망각 가운데서
  - 기억하지 못한 채로
  lexicon: LSJ
  rationale: 직역하면 ‘망각 안에서’이므로, POB의 ‘in forgetfulness’가 유지한 생경함을 살려 ‘망각 속에서’로 옮겼습니다.
- source_word: ἐπʼ ἐσχάτων
  english_pob_choice: in the end
  chosen_korean: 마침내
  alternatives_korean:
  - 끝내
  - 나중에
  - 결국
  lexicon: LSJ
  rationale: 시간 부사구로서 ‘마침내/결국’의 의미이므로 자연스러운 현대 한국어인 ‘마침내’로 옮겼습니다.
- source_word: ἐκφαίνει τὴν κακίαν αὐτοῦ
  english_pob_choice: reveals his evil
  chosen_korean: 자기의 악을 드러냅니다
  alternatives_korean:
  - 자기의 악을 밝힙니다
  - 자기의 악을 나타냅니다
  - 자기의 악행을 드러냅니다
  lexicon: LSJ
  rationale: ἐκφαίνει는 ‘드러내다/밝히 보이다’의 뜻이므로 ‘드러냅니다’가 적절하고, κακία는 단순한 악행보다 넓은 도덕적 악을 가리켜 ‘악’으로 옮겼습니다.
theological_decisions:
- issue: 양보절과 행위의 최종 노출이라는 경구적 구조
  chosen_reading: 선한 행동처럼 보이는 것이라도, 그 동기와 태도가 망각과 무관심 속에 있으며 끝내는 숨은 악이 드러난다는 경구로 읽었습니다.
  alternative_readings:
  - 단순히 ‘선을 행해도 소용없다’는 무력화된 표현으로 읽기
  - ‘망각’의 주체를 하나님으로 특정해 읽기
  rationale: 문장은 도덕적 관찰을 말하며, 본문 자체는 망각의 주체를 특정하지 않으므로 의미를 과도하게 신학화하지 않고 경구의 긴장을 살렸습니다.
  doctrine_reference: 집회서의 지혜 경구 문맥
- issue: κακία의 범위
  chosen_reading: ‘악’으로 번역해 악의 성향과 행위를 함께 포괄했습니다.
  alternative_readings:
  - ‘악행’으로 좁혀 읽기
  - ‘악의’로 내면적 적대감에 한정해 읽기
  rationale: κακία는 문맥상 단순 행위뿐 아니라 도덕적 품성의 악함까지 아우를 수 있으므로, 폭이 넓은 ‘악’이 가장 안전합니다.
  doctrine_reference: 집회서의 도덕적 지혜 표현
