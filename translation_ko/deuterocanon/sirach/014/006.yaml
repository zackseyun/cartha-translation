translation:
  language: ko
  text: 자기 자신에게 악한 사람보다 더 악한 사람은 없으며, 이것이 그의 악에 대한 보답입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 병행본은 이 표현을 ‘자기 자신에게 인색한 사람’ 또는 ‘자기 자신을 괴롭게 하는 사람’으로도 읽을 수 있게 합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: רַע לְנַפְשׁוֹ
  english_pob_choice: one who is evil to himself
  chosen_korean: 자기 자신에게 악한 사람
  alternatives_korean:
  - 자기 영혼에 악한 사람
  - 자기 자신을 해치는 사람
  - 자기 자신에게 인색한 사람
  lexicon: HALOT; Greek parallel τοῦ βασκαίνοντος ἑαυτόν
  rationale: 히브리어의 직설적 표현을 살리되 한국어로 자연스럽게 풀어, 자기 자신을 향한 악함이라는 도덕적 의미를 보존했습니다. 그리스어의 ‘자기 자신에게 인색함/시기함’ 뉘앙스는 본문에 과도하게 넣지 않고 대안으로만 남겼습니다.
- source_word: אֵין רַע מִמֶּנּוּ
  english_pob_choice: there is none more evil than he
  chosen_korean: 더 악한 사람은 없습니다
  alternatives_korean:
  - 그보다 더 악한 이는 없습니다
  - 그보다 더 사악한 사람은 없습니다
  lexicon: HALOT
  rationale: 비교 구문을 한국어에서 자연스럽게 재현하여, 같은 어근 רע의 반복이 주는 강한 수사성을 유지했습니다.
- source_word: תּשְלוּמַת
  english_pob_choice: repayment
  chosen_korean: 보답
  alternatives_korean:
  - 갚음
  - 보상
  - 되갚음
  lexicon: HALOT
  rationale: 의미상 ‘보답/되갚음’이 가능하지만, 여기서는 악행에 상응하는 결과라는 점을 담는 중립적 현대어인 ‘보답’을 택했습니다.
- source_word: רָעָתוֹ
  english_pob_choice: his evil
  chosen_korean: 그의 악
  alternatives_korean:
  - 그의 악행
  - 그의 사악함
  - 그의 잘못
  lexicon: HALOT
  rationale: 앞부분의 רע 반복을 한국어에서도 최대한 살리기 위해 ‘악’으로 대응했습니다. '잘못'은 도덕적 강도가 약해져 제외했습니다.
theological_decisions:
- issue: 히브리어 본문을 우선하되 그리스어 병행본의 미묘한 의미를 어떻게 처리할지
  chosen_reading: 본문은 히브리어의 ‘자기 자신에게 악한 사람’으로 번역하고, 그리스어의 ‘자기 자신에게 인색한/시기하는’ 뉘앙스는 본문 밖으로 빼지 않았습니다.
  alternative_readings:
  - 그리스어를 따라 ‘자기 자신에게 인색한 사람’으로 옮김
  - 두 의미를 합쳐 ‘자기 자신에게 인색하고 악한 사람’으로 옮김
  rationale: 이 절은 히브리어가 더 직접적이며, 그리스어는 해석적 확장을 담고 있으므로 본문에서 히브리어의 수사 구조를 보존하는 편이 source-grounded합니다.
  doctrine_reference: 본문비평 및 지혜문학 번역 원칙
