base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/014/001.yaml
  text: Happy is the man whose mouth has not caused him to stumble[b][a], and whose heart has not condemned him.
  footnotes:
  - marker: a
    text: Hebrew text is difficult in the first clause; literally it reads something like 'whose mouth has not forsaken him.' The Greek parallel supports the sense 'has not slipped by his mouth'—that is, has not stumbled in speech.
    reason: alternative_reading
  - marker: b
    text: Or 'whose heart has not reproached him with the grief of sin.' The Hebrew of this clause is also uncertain, and the Greek reads 'has not been pierced in the sorrow of sin.'
    reason: textual_variant
translation:
  language: ko
  text: 행복한 사람은 자기 입이 그를 넘어뜨리지 않았고, 자기 마음이 그를 정죄하지 않았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 첫째 행이 난해합니다. 직역하면 ‘그의 입이 그를 떠나지 않았다’는 식이 되지만, 그리스어 평행본문은 ‘그의 입에서 미끄러지지 않았다’는 뜻을 지지하여 ‘그를 넘어뜨리지 않았다’로 옮겼습니다.
    reason: textual_variant
  - marker: b
    text: 둘째 행의 히브리어도 본문 전승상 불확실합니다. 그리스어는 ‘죄의 슬픔 가운데 찔리지 않았다’는 뜻을 보이지만, 한국어 본문은 히브리어의 ‘마음의 정죄’라는 핵심을 살려 옮겼습니다.
    reason: textual_variant
lexical_decisions:
- source_word: אַשְׁרֵי
  english_pob_choice: Happy is
  chosen_korean: 행복한 사람은
  alternatives_korean:
  - 복된 사람은
  - 복이 있는 사람은
  lexicon: HALOT
  rationale: 지혜문학의 아쉬레י는 단순 감정형 ‘행복한’이 자연스럽고 현대적인 축복 선언으로 들리며, 여기서는 명시적 언약 축복보다 삶의 형편을 말하는 어조가 더 강합니다.
- source_word: לֹא עֲזָבוֹ פִיהוּ
  english_pob_choice: whose mouth has not caused him to stumble
  chosen_korean: 자기 입이 그를 넘어뜨리지 않았고
  alternatives_korean:
  - 자기 입이 그를 배반하지 않았고
  - 자기 입으로 죄짓지 않았고
  lexicon: HALOT
  rationale: 히브리어 직역은 난해하지만, 평행하는 그리스어가 ‘입에서 미끄러지지 않았다’는 뜻을 지지하므로 말이 도덕적 실족을 일으키지 않았다는 의미를 살려 자연스럽게 옮겼습니다.
- source_word: וְלֹא אָבַח עָלָיו דִּין לִבּוֹ
  english_pob_choice: whose heart has not condemned him
  chosen_korean: 자기 마음이 그를 정죄하지 않았습니다
  alternatives_korean:
  - 자기 마음이 그를 책망하지 않았습니다
  - 자기 양심이 그를 꾸짖지 않았습니다
  lexicon: HALOT
  rationale: ‘마음의 판단/정죄’라는 히브리어의 법정적 뉘앙스를 살리기 위해 ‘정죄하다’를 택했습니다. ‘양심’은 해석이 더 강해 본문어휘를 직접 드러내지 못합니다.
theological_decisions:
- issue: 첫 행의 축복 선언 어조
  chosen_reading: 행복한 사람은
  alternative_readings:
  - 복된 사람은
  - 복이 있는 사람은
  rationale: 이 구절은 지혜문학적 복 선언으로, 현대 한국어에서는 ‘행복한’이 원문의 상태적 복됨을 가장 자연스럽게 전달합니다.
  doctrine_reference: 'Translation philosophy: optimal-equivalence'
- issue: 불분명한 히브리어를 그리스어 평행본문으로 보정하는 문제
  chosen_reading: 입이 그를 넘어뜨리지 않았고 ... 마음이 그를 정죄하지 않았습니다
  alternative_readings:
  - 입으로 죄를 짓지 않았고 ... 마음이 그를 책망하지 않았습니다
  - 입이 그를 배반하지 않았고 ... 마음이 그를 꾸짖지 않았습니다
  rationale: 히브리어는 첫 행이 특히 난해하므로, 평행하는 그리스어의 뜻을 실제 번역 판단에 반영하되 문맥상 필요한 최소한의 보정만 했습니다.
  doctrine_reference: User task requirement on source + parallel source use
