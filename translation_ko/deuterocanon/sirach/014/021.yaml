translation:
  language: ko
  text: 그녀의 길들에 마음을 두고 그녀의 통찰들을 깊이 헤아리는 사람은[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 병행본에는 ‘그녀의 숨은 것들 안에서 이해하게 될 것이다’ 또는 ‘그녀의 비밀들 안에서’라고 되어 있습니다. 히브리어는 ‘그녀의 통찰들/이해들’을 말하므로, 본문은 히브리어를 따랐습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הַשָּׂם
  english_pob_choice: He who sets
  chosen_korean: 마음을 두고
  alternatives_korean:
  - 마음을 두는
  - 마음을 두는 사람은
  - 마음을 놓는
  lexicon: HALOT
  rationale: 히브리어 분사 הַשָּׂם은 주어를 설명하는 서술적 용법이므로, 한국어에서는 자연스러운 행위 표현인 ‘마음을 두고’로 옮겨 사유의 방향을 드러냈습니다.
- source_word: עַל דְרָכֶיהַ
  english_pob_choice: on her ways
  chosen_korean: 그 길들에
  alternatives_korean:
  - 그의 길들에
  - 그 길 위에
  - 그 길들에 마음을
  lexicon: HALOT
  rationale: דְרָכֶיהַ는 지혜를 인격화한 ‘그녀의 길들’이므로, ‘그 길들’로 옮겨 성별 인격화를 유지했습니다.
- source_word: לִבּוֹ
  english_pob_choice: his heart
  chosen_korean: 마음
  alternatives_korean:
  - 그의 마음
  - 마음을
  - 심장을
  lexicon: HALOT
  rationale: לב는 단순한 감정이 아니라 생각과 의지를 포함하므로, 한국어의 ‘마음’이 가장 자연스럽고 포괄적입니다.
- source_word: וּבִתְבוּנֹתֶיהַ
  english_pob_choice: and considers her insights
  chosen_korean: 그 지혜들을 살피는
  alternatives_korean:
  - 그 이해들을 살피는
  - 그 통찰들을 살피는
  - 그 숨은 것들을 살피는
  lexicon: HALOT
  rationale: תבונותיה는 ‘그녀의 통찰/이해들’이라는 의미이므로 ‘지혜들’로 옮겼고, 관련된 주의 깊은 숙고는 ‘살피는’으로 표현했습니다. 그리스어 병행본의 ‘숨은 것들/비밀들’ 뉘앙스는 본문보다 약하므로 본문에는 반영하지 않았습니다.
- source_word: יִתְבּוֹנָן
  english_pob_choice: considers
  chosen_korean: 살피는
  alternatives_korean:
  - 숙고하는
  - 생각하는
  - 헤아리는
  lexicon: HALOT
  rationale: hitbonen은 주의 깊게 헤아리며 이해하는 동작이므로, 간결하고 문맥에 맞는 ‘살피는’으로 옮겼습니다.
theological_decisions:
- issue: 지혜의 여성 인격화 유지
  chosen_reading: 그 길들 / 그 지혜들
  alternative_readings:
  - 그 길
  - 지혜의 길
  - 그것의 길
  rationale: 히브리어와 그리스어 모두 지혜를 여성형으로 인격화하므로, 한국어에서도 ‘그녀/그’의 지시를 유지해 문학적·신학적 질감을 보존했습니다.
  doctrine_reference: Translation philosophy §§3, 4, 5
- issue: 남성 단수 분사의 대표성
  chosen_reading: … 살피는 사람은
  alternative_readings:
  - 누구든지 살피는
  - 마음을 두는 이는
  - 그가 마음을 두면
  rationale: 히브리어의 남성 단수 분사를 한국어에서 특정 성별로 과도하게 고정하지 않으면서도, 대표적 주어로 읽히는 구조를 살렸습니다.
  doctrine_reference: Translation philosophy §4
