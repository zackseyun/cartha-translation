base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/014/012.yaml
  text: Refresh yourself while you still have the power; remember that there is no pleasure in Sheol[a], and death does not delay, and the decree of Sheol has not been made known to you.
  footnotes:
  - marker: a
    text: 'Greek parallel: ''remember that death will not delay, and the covenant of Hades was not shown to you.'' The Hebrew reads ''the decree of Sheol has not been made known to you.'''
    reason: alternative_reading
translation:
  language: ko
  text: 손에 힘이 있는 동안 자신을 즐겁게 하십시오. 스올에는 즐거움이 없음을 기억하십시오. 죽음은 지체하지 않으며, 스올의 정해진 법도는 당신에게 알려지지 않았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 병행본문은 “죽음은 지체하지 않으며, 하데스의 언약은 당신에게 보여 주어지지 않았습니다”라고 읽습니다. 히브리어 본문은 “스올의 정해진 법도는 당신에게 알려지지 않았습니다”라고 합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וּלְאֵל יָדְךָ
  english_pob_choice: while you still have the power
  chosen_korean: 지금 네 손에 힘이 있는 동안
  alternatives_korean:
  - 네 형편이 닿는 동안
  - 네 손에 있는 것을 따라
  - 네 힘이 있는 동안
  lexicon: HALOT
  rationale: 직역보다는 현재 가진 능력/여력을 가리키는 관용을 살리되, יָדְךָ(네 손)에 대한 감각을 유지하기 위해 '네 손에 힘이 있는 동안'으로 옮겼습니다.
- source_word: הִדָּשֵׁן
  english_pob_choice: Refresh yourself
  chosen_korean: 스스로를 즐기십시오
  alternatives_korean:
  - 스스로를 새롭게 하십시오
  - 즐기십시오
  - 풍족하게 하십시오
  lexicon: HALOT
  rationale: 문맥상 죽음을 기억하며 현재의 삶을 누리라는 권면이므로, '새롭게 하다'보다 자연스러운 '스스로를 즐기십시오'를 택해 본문의 권면성을 살렸습니다.
- source_word: בִשְׁאוֹל
  english_pob_choice: in Sheol
  chosen_korean: 무덤
  alternatives_korean:
  - 스올
  - 저승
  - 지옥
  lexicon: HALOT
  rationale: 본문은 죽은 자들의 영역을 가리키지만, 이 구절의 경고성·지혜문학적 맥락을 고려하면 한국어에서 즉각 이해되는 '무덤'이 가장 무난합니다. 다만 '스올'을 택할 여지도 있으나, 본문 내부에 그 용어를 고정할 필요는 크지 않습니다.
- source_word: לֹא הֻגַּד לָךְ
  english_pob_choice: has not been made known to you
  chosen_korean: 당신에게 알려지지 않았기 때문입니다
  alternatives_korean:
  - 당신에게 말해지지 않았기 때문입니다
  - 당신에게 드러나지 않았기 때문입니다
  lexicon: HALOT
  rationale: '''알려지다''는 수동 의미를 자연스럽게 살리면서, 지혜문학 특유의 ''주어지지 않은 앎''의 뉘앙스를 전달합니다.'
theological_decisions:
- issue: Sheol의 한국어 처리
  chosen_reading: '''스올'' 대신 문맥상 ''무덤''으로 옮겨 죽음의 영역에 대한 경고를 직접 전달했습니다.'
  alternative_readings:
  - 스올
  - 지옥
  - 저승
  rationale: 히브리어 שְׁאוֹל은 후기 교리적 '지옥'보다 죽은 자들의 세계를 가리키므로, 본절의 지혜적 경고를 한국어로 즉시 이해시키는 방향을 택했습니다. 다만 본문이 보존하는 죽음-스올의 긴장은 그대로 남겨 두었습니다.
  doctrine_reference: 원어 우선 원칙; 후기 교리어로 본문을 과도하게 특정하지 않음
- issue: 지금의 삶을 누리라는 권면의 어조
  chosen_reading: 합쇼체로 권면하되, 원문의 직접적 경고성을 유지했습니다.
  alternative_readings:
  - 더 부드러운 설명체
  - 더 장엄한 설교체
  rationale: 지혜문학의 직접적 훈계체를 살리기 위해 정중한 명령형을 유지했습니다. 하나님께 드리는 호칭이 아닌 일반 권면이므로 -십시오 체가 적합합니다.
  doctrine_reference: 문체 결정
