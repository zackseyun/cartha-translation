    rationale: 원문은 스올과 죽음을 구별하여 언급합니다. ‘무덤’ 역시 שְׁאוֹל의 의미 범위를 좁히므로 음역어를 유지하는 편이 충실합니다.
  - severity: medium
    issue: 마지막 절을 ‘~때문입니다’로 처리했습니다.
    rationale: 원문은 인과 접속이 아니라 죽음의 지체 없음 및 알려지지 않은 스올의 법도를 병렬로 진술합니다.
