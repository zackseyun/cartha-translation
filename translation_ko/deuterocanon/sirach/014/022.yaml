base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/014/022.yaml
  text: Go out after her in search[a], and lurk at all her entrances.
  footnotes:
  - marker: a
    text: Or, more sharply, 'lie in wait at all her entrances'; the Greek parallel has 'ambush/lie in wait' imagery.
    reason: lexical_alternative
translation:
  language: ko
  text: 그녀를 찾아 나서서 탐색하고, 그녀의 모든 들어가는 곳에서 엎드려 지켜보십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그녀의 모든 들어가는 곳에서 매복하십시오’에 가깝습니다. 그리스어 병행본문도 ‘매복하다/잠복하다’의 이미지를 보여 줍니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָצֵאת
  english_pob_choice: Go out
  chosen_korean: 나서서
  alternatives_korean:
  - 가서
  - 떠나서
  lexicon: HALOT
  rationale: 출가/이동의 명령형 뉘앙스를 한국어에서 자연스럽게 살리되, 지혜를 추구하는 행동의 개시를 드러내기 위해 ‘나서서’로 옮겼습니다.
- source_word: בְחֵקֶר
  english_pob_choice: in search
  chosen_korean: 탐색하고
  alternatives_korean:
  - 찾아
  - 수색하고
  - 조사하며
  lexicon: HALOT
  rationale: ‘탐색’은 사전적 의미의 searching/investigation을 비교적 직접적으로 반영하면서도 합쇼체 문장에 자연스럽습니다.
- source_word: מְבוֹאֶיהָ
  english_pob_choice: her entrances
  chosen_korean: 그녀의 모든 들어가는 곳
  alternatives_korean:
  - 그녀의 출입구에서
  - 그녀의 입구들에서
  - 그녀의 들어가는 지점들에서
  lexicon: HALOT
  rationale: 지혜의 ‘입구/들어가는 곳’이라는 구체적 공간 이미지를 유지하되, 한국어에서 과도하게 건축물 용어처럼 굳지 않도록 풀어 옮겼습니다.
- source_word: יְרַצֵּד
  english_pob_choice: lurk / keep watch
  chosen_korean: 엎드려 지켜보십시오
  alternatives_korean:
  - 매복하십시오
  - 숨어 지켜보십시오
  - 지켜보십시오
  lexicon: HALOT
  rationale: 히브리어 동사는 희귀하고 불확실하지만, 그리스어 ἐνέδρευε가 ‘매복/잠복’의 감각을 지지합니다. 다만 한국어 본문에서는 지나치게 음험한 뉘앙스를 조금 완화하면서도 긴장감을 살리기 위해 ‘엎드려 지켜보십시오’로 옮겼습니다.
theological_decisions:
- issue: 지혜의 여성 인격화
  chosen_reading: 여성 대명사와 인칭을 유지합니다.
  alternative_readings:
  - 지혜라고 반복하여 풀이함
  - 성별 중립적으로 바꿈
  rationale: 어미와 대명사가 가리키는 여성 단수 인칭을 보존해야 문학적·신학적 인격화의 결이 살아납니다.
  doctrine_reference: Translation philosophy 4
- issue: 마지막 동사의 강도
  chosen_reading: ‘엎드려 지켜보십시오’로 매복성과 관찰성을 함께 드러냅니다.
  alternative_readings:
  - ‘매복하십시오’
  - ‘숨어 기다리십시오’
  - ‘지켜보십시오’
  rationale: 그리스어 병행본은 분명히 잠복/매복 이미지를 가리키지만, 한국어에서 너무 노골적인 폭력성만 남기지 않도록 감시·주목의 의미를 함께 살렸습니다.
  doctrine_reference: Translation philosophy 3, 6
