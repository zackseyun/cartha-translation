translation:
  language: ko
  text: 그의 모든 일은 썩어 없어지고, 그의 손에서 한 일은 그 뒤를 따라 끌려갑니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 ‘그것을 행한 사람은 그것과 함께 떠나갈 것이다’라고 하여, 대상이 일에서 사람으로 옮겨집니다.
    reason: alternative_reading
lexical_decisions:
- source_word: כָּל מַעֲשָׂיו
  english_pob_choice: All his works
  chosen_korean: 그의 모든 일
  alternatives_korean:
  - 그의 모든 작품
  - 그가 한 모든 일
  lexicon: HALOT
  rationale: כָּל은 전부를 가리키고 מַעֲשָׂיו는 사람이 행한 것과 산출물을 넓게 가리키므로, ‘그의 모든 일’이 자연스럽고 포괄적으로 원문 의미를 살립니다.
- source_word: רָקוֹב יִרְקָבוּ
  english_pob_choice: rot away
  chosen_korean: 썩어 없어지고
  alternatives_korean:
  - 썩습니다
  - 부패하여 사라지고
  - 썩어 버리고
  lexicon: HALOT
  rationale: 히브리어는 어근 반복으로 부패의 강도를 강조하므로, 단순한 ‘썩다’보다 결과까지 드러내는 ‘썩어 없어지다’가 반복의 힘을 살립니다.
- source_word: וּפֹעַל יָדָיו
  english_pob_choice: the work of his hands
  chosen_korean: 그의 손에서 한 일
  alternatives_korean:
  - 그의 손의 일
  - 그의 손으로 만든 것
  lexicon: HALOT
  rationale: 직역적 ‘손의 일’도 가능하지만, 한국어에서는 ‘손에서 한 일’이 손의 행위와 산출을 함께 살리면서도 문맥상 자연스럽습니다.
- source_word: יִמָּשֵׁךְ אַחֲרָיו
  english_pob_choice: is dragged along behind him
  chosen_korean: 그 뒤를 따라 끌려갑니다
  alternatives_korean:
  - 그 뒤를 따라 이끌려갑니다
  - 그를 따라 끌려갑니다
  - 뒤에 끌려갑니다
  lexicon: HALOT
  rationale: נִפעל형의 수동적 뉘앙스와 אַחֲרָיו의 ‘뒤에/뒤따라’를 반영해, ‘끌려갑니다’로 끌림의 이미지를 보존했습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행문의 차이
  chosen_reading: 주 본문은 현존 히브리어를 따라 ‘그의 손에서 한 일은 그 뒤를 따라 끌려갑니다’로 옮기고, 그리스어의 인물 중심 표현은 본문에 흡수하지 않았습니다.
  alternative_readings:
  - ‘그 일을 한 사람도 그것과 함께 떠나갑니다’(그리스어에 더 가까운 읽기)
  rationale: 집회서에서는 히브리어가 보존된 경우 히브리어 증거를 우선하되, 의미상 큰 차이가 있는 경우만 주석에서 알립니다. 여기서는 대상이 ‘사람’에서 ‘일’로 바뀌므로 히브리어의 이미지가 본문상 더 적합합니다.
  doctrine_reference: 'PHILOSOPHY.md: Sirach는 히브리어 우선, 유의미한 차이는 주석 처리'
