  text: The fear of the Lord is glory and exultation[a], and gladness and a crown of rejoicing.
  footnotes:
  - marker: a
    text: Or 'The fear of the Lord is glory and exultation, and joy and a crown of jubilation.' The Greek piles up near-synonyms for honor and joy.
    reason: lexical_alternative
translation:
  language: ko
  text: 주님을 두려워함은 영광과 자랑이며, 기쁨과 환희의 관입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주님을 두려워함은 영광과 자랑이며, 기쁨과 환희의 면류관입니다.’ 그리스어는 명예와 기쁨을 나타내는 가까운 뜻의 표현들을 겹쳐 놓습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: φόβος
  english_pob_choice: fear
  chosen_korean: 두려워함
  alternatives_korean:
  - 경외
  - 두려움
  lexicon: SBLGNT / wisdom idiom
  rationale: 지혜문학의 관용구인 ‘주님을 두려워함’을 살리면서도, 명사형으로 자연스러운 한국어 표현인 ‘두려워함’을 택했습니다.
- source_word: δόξα
  english_pob_choice: glory
  chosen_korean: 영광
  alternatives_korean:
  - 존귀
  - 명예
  lexicon: BDAG
  rationale: δόξα의 존귀·명예 의미를 포괄하면서 한국어 성경 어휘에서 가장 직접적인 대응인 ‘영광’을 사용했습니다.
- source_word: καύχημα
  english_pob_choice: boasting
  chosen_korean: 자랑
  alternatives_korean:
  - 뽐냄
  - 자부
  lexicon: BDAG
  rationale: 이 단어는 여기서 부정적 허영보다 ‘기꺼이 내세울 만한 것’의 뜻이 강하므로, 한국어로는 ‘자랑’이 가장 자연스럽습니다.
- source_word: εὐφροσύνη
  english_pob_choice: gladness
  chosen_korean: 기쁨
  alternatives_korean:
  - 즐거움
  - 환희
  lexicon: BDAG
  rationale: 뒤의 ἀγαλλιάματος와의 구별을 위해 단순하고 폭넓은 ‘기쁨’을 택해, 앞뒤의 점층적 병렬을 유지했습니다.
- source_word: στέφανος ἀγαλλιάματος
  english_pob_choice: a crown of rejoicing
  chosen_korean: 환희의 관
  alternatives_korean:
  - 기쁨의 관
  - 즐거움의 관
  - 환호의 면류관
  lexicon: BDAG
  rationale: στέφανος는 수여된 월계관/관을 가리키므로 ‘관’으로 옮기고, ἀγαλλιάματος는 ‘환희’로 옮겨 병렬 구조와 시적 응축을 살렸습니다.
theological_decisions:
- issue: 지혜 격언의 핵심 구절인 φόβος κυρίου의 어조
  chosen_reading: ‘주님을 두려워함’으로 유지하여 경외만이 아니라 실제적인 두려움과 순종의 함의를 함께 드러냈습니다.
  alternative_readings:
  - 주님 경외
  - 주님에 대한 경외
  rationale: 이 문구는 지혜 전통의 정형 표현이므로, 뜻을 완화하는 ‘경외’만으로 좁히지 않고 원문의 긴장감을 보존하는 쪽이 더 충실합니다.
  doctrine_reference: 'DOCTRINE.md: Translation philosophy §§1, 5; wisdom terminology guidelines'
