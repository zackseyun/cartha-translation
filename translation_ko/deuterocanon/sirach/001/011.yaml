lexical_decisions:
- source_word: יִרְאַת יְהֹוָה
  english_pob_choice: the fear of Yahweh
  chosen_korean: 야훼를 경외하는 것
  alternatives_korean:
  - 야훼에 대한 두려움
  - 야훼를 두려워함
  lexicon: HALOT
  rationale: 지혜문학의 관용구를 살리되, 한국어에서는 ‘fear’의 정서적 뉘앙스를 그대로 옮긴 ‘경외’가 가장 자연스럽고 공경의 대상이 되는 여호와 이해도 유지합니다.
- source_word: כָּבוֹד
  english_pob_choice: glory
  chosen_korean: 영광
  alternatives_korean:
  - 영예
  - 광채
  lexicon: HALOT
  rationale: כָּבוֹד는 ‘무게/영예/영광’의 폭이 있지만, 이 병렬 목록에서는 격조 높은 명사로서 ‘영광’이 가장 مستقیم적입니다.
- source_word: וִיקָר
  english_pob_choice: honor
  chosen_korean: 존귀
  alternatives_korean:
  - 존중
  - 명예
  - 귀함
  lexicon: HALOT
  rationale: וִיקָר는 귀함·존귀의 뜻을 가질 수 있으므로, 이미 앞에 ‘영광’이 있는 병렬 구조에서 반복을 피하면서도 품격을 살리는 ‘존귀’가 적절합니다.
- source_word: וְעֲטֶרֶת תִּפְאָרֶת
  english_pob_choice: and a crown of splendor
  chosen_korean: 영광의 관
  alternatives_korean:
  - 찬란한 관
  - 아름다움의 관
  - splendor의 관
  lexicon: HALOT
  rationale: 직역하면 ‘관의 화려함’에 가깝지만 한국어에서는 ‘영광의 관’이 자연스럽고, תִּפְאָרֶת의 빛남과 장엄함을 충분히 담습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행본문의 의미 차이
  chosen_reading: 히브리어의 명사적 진술을 본문으로 두고, 그리스어의 ‘마음을 기쁘게 하고 기쁨과 즐거움과 장수를 준다’는 읽기는 주석적 대안으로만 남깁니다.
  alternative_readings:
  - ‘주를 경외하는 것은 마음을 기쁘게 하고, 즐거움과 기쁨과 장수를 줍니다.’
  rationale: 이 절은 현존 히브리어가 명사열을 제시하는 반면 그리스어는 동사적 약속을 제시하므로, 히브리어를 본문으로 따르되 본문 차이를 숨기지 않는 것이 स्रोत 충실성에 맞습니다.
  doctrine_reference: 'PHILOSOPHY.md: 히브리어가 남아 있는 곳에서는 히브리어를 본문으로, 그리스어는 보조 증거로 사용하고 차이는 투명하게 보존한다.'
