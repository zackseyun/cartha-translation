  alternative_readings:
  - '그리스어 전승의 질문문: ‘지혜의 뿌리가 누구에게 드러났으며…’'
  rationale: 제공된 히브리어는 그리스어 전승과 내용이 크게 다르므로, 이 기록은 입력된 히브리어 본문을 우선 반영했습니다. 다만 별도의 주석으로 전승 차이를 드러내는 것이 더 투명합니다.
  doctrine_reference: 'Sirach 본문 병행전승 처리 원칙: surviving Hebrew 우선, 그러나 주어진 히브리어가 해당 절과 현저히 불일치할 때는 명시적으로 그 차이를 반영한다.'
