    text: 여기에 보존된 카이로 게니자 히브리어 행은 ‘오직 한 분만이 두려우시며, 하나님께서 그 지혜의 모든 곳간을 다스리신다’는 뜻으로 읽힐 수 있으나, 이 절의 그리스어 전승과 크게 다릅니다. 따라서 본문은 그리스어 전승을 따라 번역했습니다.
    reason: textual_variant
lexical_decisions:
- source_word: אֶחָד הוּא נוֹרָא בִּלְבַדּוֹ
  english_pob_choice: One alone is fearsome
  chosen_korean: 오직 한 분만이 두려우신 분이시며
  alternatives_korean:
