  lexicon: BDB
  rationale: 모쉘은 단순한 소유가 아니라 주권적 통치를 뜻하므로, 문맥상 가장 직접적인 ‘다스리다’를 택했습니다.
- source_word: עַל כָּל אוֹצָרֶיהָ
