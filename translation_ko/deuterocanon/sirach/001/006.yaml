    text: 제공된 카이로 게니자 히브리어 행은 이 절의 그리스어 전승과 내용이 크게 다릅니다. 본문은 여기 제시된 히브리어를 따라 번역했습니다.
    reason: textual_variant
lexical_decisions:
- source_word: אֶחָד הוּא נוֹרָא בִּלְבַדּוֹ
  english_pob_choice: One alone is fearsome
  chosen_korean: 오직 한 분만이 두려우신 분이시며
  alternatives_korean:
  - 한 분만이 두려우십니다
  - 오직 한 분만이 경외로우십니다
  lexicon: BDB
  rationale: 히브리어는 ‘오직/한 분’의 유일성과 ‘두려우신/경외로우신’ 성격을 함께 말하므로, 이를 합쇼체로 자연스럽게 살려 옮겼습니다.
- source_word: אֱלֹהִים
  english_pob_choice: God
  chosen_korean: 하나님께서는
  alternatives_korean:
  - 하나님은
  - 하느님께서는
  lexicon: BDB
  rationale: 프로젝트 기본어인 ‘하나님’을 따르되, 서술어와의 연결을 살려 주어 표지를 붙였습니다.
- source_word: מוֹשֵׁל
  english_pob_choice: ruling
  chosen_korean: 다스리십니다
  alternatives_korean:
  - 통치하십니다
  - 주관하십니다
  lexicon: BDB
  rationale: 모쉘은 단순한 소유가 아니라 주권적 통치를 뜻하므로, 문맥상 가장 직접적인 ‘다스리다’를 택했습니다.
- source_word: עַל כָּל אוֹצָרֶיהָ
  english_pob_choice: over all her storehouses
  chosen_korean: 그분의 모든 곳간을
  alternatives_korean:
  - 그녀의 모든 저장고를
  - 그분의 모든 창고를
  lexicon: BDB
  rationale: אוֹצָר는 저장된 재물의 ‘곳간/창고’를 뜻하므로 ‘곳간’을 선택했습니다. 본문이 여성 대명사로 이어지는 점은 히브리어 문법을 따라 ‘그분의’로 자연화하되, 원문의 소유 표지는 살렸습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 전승의 불일치
  chosen_reading: 이 절의 본문은 제공된 히브리어를 따른 문장으로 번역했습니다.
  alternative_readings:
  - '그리스어 전승의 질문문: ‘지혜의 뿌리가 누구에게 드러났으며…’'
  rationale: 제공된 히브리어는 그리스어 전승과 내용이 크게 다르므로, 이 기록은 입력된 히브리어 본문을 우선 반영했습니다. 다만 별도의 주석으로 전승 차이를 드러내는 것이 더 투명합니다.
  doctrine_reference: 'Sirach 본문 병행전승 처리 원칙: surviving Hebrew 우선, 그러나 주어진 히브리어가 해당 절과 현저히 불일치할 때는 명시적으로 그 차이를 반영한다.'
