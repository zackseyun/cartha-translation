  text: She is a staff of strength and a support[a], praise and everlasting honor to everyone who walks after her.
  footnotes:
  - marker: a
    text: 'Greek parallel: ''The root of wisdom is to fear the Lord, and her branches are long life.'' The Hebrew witness here differs substantially from the Greek tradition.'
