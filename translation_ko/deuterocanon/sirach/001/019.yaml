translation:
  language: ko
  text: 그녀는 힘의 지팡이이며 의지할 버팀목이니, 그녀를 따르는 모든 이에게 칭송과 영원한 영예가 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '그리스어 평행본문: “지혜의 뿌리는 주님을 경외하는 것이고, 그 가지는 장수입니다.” 이 구절은 히브리어 본문과 상당히 다릅니다.'
    reason: textual_variant
lexical_decisions:
- source_word: מַטּהֵ עֹז
  english_pob_choice: a staff of strength
  chosen_korean: 힘의 지팡이
  alternatives_korean:
  - 강한 지팡이
  - 권능의 지팡이
  lexicon: HALOT
  rationale: מַטּה는 지팡이/막대기를 가리키고, עֹז는 힘·강함을 뜻하므로, 이미지성을 살리되 자연스러운 합쇼체 한국어로 압축해 옮겼습니다.
- source_word: מַשְׁעֵנָה
  english_pob_choice: a support
  chosen_korean: 의지할 버팀목
  alternatives_korean:
  - 버팀목
  - 의지처
  lexicon: HALOT
  rationale: ‘기대어 의지하는 것’이라는 뜻을 살리기 위해 단순한 ‘지지’보다 ‘의지할 버팀목’으로 옮겨, 앞의 ‘지팡이’와 병렬되는 보조 이미지를 유지했습니다.
- source_word: תְּהִלָּה
  english_pob_choice: praise
  chosen_korean: 찬양
  alternatives_korean:
  - 칭송
  - 영예
  lexicon: HALOT
  rationale: 문맥상 사람이 얻게 되는 평판이라기보다 가치 있는 것으로서의 ‘찬양’이 자연스럽고, 이어지는 ‘영원한 영예’와도 병렬을 이룹니다.
- source_word: כְבוֹד עוֹלָם
  english_pob_choice: everlasting honor
  chosen_korean: 영원한 영예
  alternatives_korean:
  - 영원한 영광
  - 지속되는 존귀
  lexicon: HALOT
  rationale: כָּבוֹד는 기본적으로 영광/존귀/영예의 폭이 있지만, 여기서는 인간 수혜자에게 주어지는 평가를 가리키므로 ‘영예’가 가장 직접적입니다.
- source_word: לְכָל הַהוֹלֵךְ אַחֲרֶיהָ
  english_pob_choice: to everyone who walks after her
  chosen_korean: 그분을 따르는 모든 이에게
  alternatives_korean:
  - 그분 뒤를 걷는 모든 이에게
  - 그분을 따라가는 모든 사람에게
  lexicon: HALOT
  rationale: הלך אחרי는 ‘뒤를 따라 걷다’라는 관용구지만, 한국어에서는 직역보다 ‘따르다’가 의미를 더 분명하게 전달하므로 본문 의미를 보존하면서 자연스럽게 처리했습니다.
theological_decisions:
- issue: 지혜의 의인화 유지
  chosen_reading: 지혜를 인칭 대명사처럼 받는 표현을 유지했습니다.
  alternative_readings:
  - 무생물적 ‘그것’으로 처리
  - 명시적으로 ‘지혜’ 반복
  rationale: 히브리어와 영어 POB 모두 지혜를 여성형 인칭으로 다루므로, 한국어에서도 ‘그분’과 ‘그분을’로 받아 의인화와 화자의 시적 균형을 살렸습니다.
  doctrine_reference: 'POB style: preserve personification where the source presents wisdom as a feminine figure.'
- issue: 히브리어 본문을 मुख्य 본문으로 채택
  chosen_reading: 히브리어 현전 본문을 본문으로 옮기고, 그리스어 상이 본문은 각주로 처리합니다.
  alternative_readings:
  - '그리스어: ‘지혜의 뿌리는 주님을 두려워하는 것이고, 그 가지는 장수이다’'
  - 본문 혼합
  rationale: 집회서는 히브리어가 보존된 곳에서는 그 본문을 우선 번역해야 하며, 여기서는 히브리어와 그리스어가 실질적으로 다르므로 차이를 숨기지 않고 각주로 남겨야 합니다.
  doctrine_reference: 'PHILOSOPHY.md: translate from Hebrew where it survives; preserve source uncertainty honestly.'
