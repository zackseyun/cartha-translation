  text: Until the right time he will conceal his words, and the lips of many will recount his understanding.[a]
  footnotes:
  - marker: a
    text: 'The extant Cairo Geniza Hebrew given here differs sharply from the Greek and reads approximately: ''He will place an everlasting crown upon him, and everlasting merit among the holy ones.'' Because the Hebrew witness is flagged as a major mismatch, the main text follows the Greek for this verse.'
    reason: alternative_reading
translation:
  language: ko
  text: 그가 말씀들을 감추실 때까지, 많은 이들의 입술이 그의 깨달음을 전할 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 현존하는 카이로 게니자 히브리어는 여기서 그리스어와 크게 다르며, 대략 ‘그가 그에게 영원한 면류관을 씌우며, 거룩한 이들 가운데 영원한 공로를 주실 것이다’로 읽힙니다. 이 본문은 주요 불일치로 표시되어 있으므로, 본문은 그리스어를 따릅니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἕως καιροῦ
  english_pob_choice: Until the right time
  chosen_korean: 때까지
  alternatives_korean:
  - 적절한 때까지
  - 정해진 때까지
  lexicon: LSJ
  rationale: καιρός의 ‘정해진/알맞은 때’ 뉘앙스를 살려, 한국어에서는 간결한 ‘때까지’로 옮기되 문맥상 지연의 의미가 드러나도록 했습니다.
- source_word: κρύψει
  english_pob_choice: he will conceal
  chosen_korean: 감추실 것입니다
  alternatives_korean:
  - 숨기실 것입니다
  - 가리실 것입니다
  lexicon: BDAG
  rationale: 문자적 ‘숨기다’보다 지혜문학에서의 절제된 보류를 자연스럽게 드러내는 ‘감추다’를 택했습니다.
- source_word: τοὺς λόγους αὐτοῦ
  english_pob_choice: his words
  chosen_korean: 말씀들을
  alternatives_korean:
  - 말들을
  - 말씀을
  lexicon: BDAG
  rationale: λόγοι는 단순 발화보다 내용이 있는 ‘말씀들’로도 읽힐 수 있어, 지혜의 진술이라는 문맥을 살려 복수형으로 옮겼습니다.
- source_word: σύνεσιν αὐτοῦ
  english_pob_choice: his understanding
  chosen_korean: 깨달음
  alternatives_korean:
  - 이해
  - 분별
  lexicon: BDAG
  rationale: σύνεσις의 지혜문학적 의미를 한국어에서 가장 자연스럽게 드러내는 말로 ‘깨달음’을 선택했습니다.
theological_decisions:
- issue: 그리스어 병행본문을 주본문으로 삼는 선택
  chosen_reading: 이 절은 히브리어 본문이 그리스어와 현저히 어긋난다고 표시되어 있으므로, 본문은 그리스어를 따라 번역하고 히브리어 차이는 주석으로 남겼습니다.
  alternative_readings:
  - 히브리어를 따라 ‘영원한 면류관… 거룩한 이들 가운데 영원한 공로…’로 옮김
  rationale: 제시된 히브리어는 사 1:23의 그리스어 내용과 일치하지 않으므로, 본문 번역은 신뢰 가능한 병행 증거인 그리스어를 기준으로 해야 합니다.
  doctrine_reference: 'PHILOSOPHY.md: 가장 원문에 가까운 증거를 우선하며, 주요 불일치는 숨기지 않고 보존한다.'
