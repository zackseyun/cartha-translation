  text: Do not disobey the fear of the Lord, and do not come to him with a divided heart.
translation:
  language: ko
  text: 주님을 두려워하는 것을 거스르지 말고, 그분께 분열된 마음으로 나아가지 마십시오.
  philosophy: formal
lexical_decisions:
- source_word: μὴ ἀπειθήσῃς
  english_pob_choice: Do not disobey
  chosen_korean: 거스르지 말고
  alternatives_korean:
  - 불순종하지 말고
  - 거역하지 말고
  lexicon: ἀπειθέω
  rationale: 핵심은 단순한 인지적 불신이 아니라 ‘듣지 않고 거역하는’ 불복종이므로, 보다 직접적으로 ‘거스르다’로 옮겨 명령의 뉘앙스를 살렸습니다.
- source_word: φόβῳ Κυρίου
  english_pob_choice: the fear of the Lord
  chosen_korean: 주님을 두려워하는 것
  alternatives_korean:
  - 주님을 경외하는 것
  - 주님에 대한 두려움
  lexicon: φόβος / κύριος
  rationale: 여기서는 하나님을 경외하는 태도 전체를 가리키므로, 한국어에서 자연스럽고 신학적으로도 균형 잡힌 ‘두려워하는 것’으로 유지했습니다.
- source_word: προσέλθῃς αὐτῷ
  english_pob_choice: come to him
  chosen_korean: 그분께 나아가
  alternatives_korean:
  - 그분께 다가가
  - 그분께 접근해
  lexicon: προσέρχομαι
  rationale: 하나님께 가까이 나아가는 예배적·관계적 동작을 반영하여, 단순 이동보다 예배 언어에 가까운 ‘나아가다’를 택했습니다.
- source_word: ἐν καρδίᾳ δισσῇ
  english_pob_choice: with a divided heart
  chosen_korean: 분열된 마음으로
  alternatives_korean:
  - 두 마음으로
  - 양다리의 마음으로
  lexicon: δίψυχος / καρδία
  rationale: 직역은 ‘두 마음’이지만, 본문의 문제는 내적 분열이므로 한국어에서 보다 투명한 ‘분열된 마음’으로 옮겼습니다.
theological_decisions:
- issue: Sirach 1:27의 주어와 대상이 MT/히브리어 전승과 LXX 사이에서 크게 다름
  chosen_reading: 본문은 영어 POB와 그리스어 전승을 따라 ‘주님을 두려워하는 것’과 ‘그분께 나아가지 말라’는 경고로 렌더링했습니다.
  alternative_readings:
  - 히브리어 전승을 따라 ‘하나님을 경외하는 자들아, 내 말을 들으라’는 지혜 교훈형 번역
  rationale: 제공된 최신 POB 개정이 그리스어 경고문을 최종 본문으로 확정하므로, 한국어도 그 흐름을 따라 불순종과 분열된 마음에 대한 경계로 유지했습니다.
  doctrine_reference: 본문비평 / 번역본문 선택
