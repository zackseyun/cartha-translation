    reason: alternative_reading
lexical_decisions:
- source_word: שֹׁרֶשׁ
  english_pob_choice: root
  chosen_korean: 뿌리
  alternatives_korean:
  - 근원
  - 기초
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘뿌리’이므로, 원천 이미지를 살리면서도 한국어에서 자연스러운 은유인 ‘뿌리’로 옮겼습니다.
- source_word: נִגְלָה
  english_pob_choice: has it been revealed
  chosen_korean: 드러났습니까
  alternatives_korean:
  - 계시되었습니까
  - 알려졌습니까
  lexicon: HALOT
  rationale: נגל의 수동 의미를 살리되, 문어체 합쇼체의 수사적 질문으로 자연스럽게 표현했습니다.
- source_word: מַעֲרֻמֶּיהָ
  english_pob_choice: her subtleties
  chosen_korean: 신묘한 속내
  alternatives_korean:
  - 그 미묘함
  - 그 숨은 깊이
  - 그 기묘한 책략
  lexicon: HALOT
  rationale: 문맥상 지혜의 내밀하고 파악하기 어려운 면을 가리키므로, 부정적 ‘책략’은 피하고 ‘신묘한 속내’로 긴장감을 보존했습니다.
- source_word: מִי יָדַע
  english_pob_choice: who has known
  chosen_korean: 누가 알았습니까
  alternatives_korean:
  - 누가 알았습니까요
  - 누가 이해했습니까
  lexicon: HALOT
  rationale: ידע의 기본 의미인 ‘알다’를 유지해, 해석을 덧붙이지 않고 수사적 질문의 힘을 살렸습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행문의 큰 차이
  chosen_reading: 본문은 현존 히브리어를 따르되, 그리스어 전통은 각주로 보존합니다.
  alternative_readings:
  - 지혜의 샘은 가장 높은 곳에 계신 하나님의 말씀이며, 그 길들은 영원한 명령들이다.
  rationale: 시락서의 경우 현존 히브리어가 본문 기준이지만, 그리스어는 단순 변이가 아니라 다른 전승이므로 본문에서 흡수하지 않고 각주로 투명하게 남깁니다.
  doctrine_reference: 원문 우선과 전승 간 긴장 보존; 번역 전통보다 현존 원문 증거를 우선함
