translation:
  language: ko
  text: 바다의 모래와 빗방울과 영원의 날들[a]을 누가 헤아릴 수 있겠습니까?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 עוֹלָם은 ‘영원’, ‘한 시대’, 또는 ‘옛날’을 뜻할 수 있습니다. 여기서는 헤아릴 수 없는 것들을 나열하는 문맥과 병행 그리스어에 따라 ‘영원’으로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חוֹל יַמִּים
  english_pob_choice: sand of the seas
  chosen_korean: 바다의 모래
  alternatives_korean:
  - 바다들의 모래
  - 바닷가의 모래
  lexicon: HALOT
  rationale: 히브리어는 다수의 바다를 가리키는 과장 표현이므로, 한국어에서는 자연스러운 관용으로 옮기되 복수 이미지를 잃지 않도록 ‘바다의 모래’로 간결하게 처리했습니다.
- source_word: נִטְפֵי מָטָר
  english_pob_choice: the drops of rain
  chosen_korean: 비의 물방울
  alternatives_korean:
  - 빗방울
  - 비방울
  lexicon: HALOT
  rationale: 직역상 ‘비의 물방울’이 가장 가깝고, 히브리어 구성어와 그리스어 병행구의 구체성을 드러냅니다. ‘빗방울’도 가능하지만 원문 형식을 조금 더 분명히 반영했습니다.
- source_word: וִימוֹת עוֹלָם
  english_pob_choice: the days of eternity
  chosen_korean: 영원의 날들
  alternatives_korean:
  - 세월의 날들
  - 옛날의 날들
  - 시대의 날들
  lexicon: HALOT
  rationale: 문맥상 인간이 헤아릴 수 없는 광대한 시간을 말하므로, 영어 POB의 ‘eternity’를 따라 ‘영원’으로 옮겼습니다. 다만 한국어에서는 ‘영원의 날들’이 다소 비유적이므로 그 과장성을 유지하는 쪽을 택했습니다.
- source_word: מִי יִמְנֶה
  english_pob_choice: Who can count
  chosen_korean: 누가 헤아릴 수 있겠습니까?
  alternatives_korean:
  - 누가 셀 수 있겠습니까?
  - 누가 헤아리겠습니까?
  lexicon: HALOT
  rationale: 수량을 세는 행위와 함께 경탄형 수사 의문을 살리기 위해 ‘헤아릴 수 있겠습니까’로 옮겼습니다. ‘셀 수 있겠습니까’도 가능하지만 한국어에서는 ‘헤아리다’가 더 넓은 수사적 불가능성을 담아냅니다.
theological_decisions:
- issue: עוֹלָם의 시간 의미를 한국어에서 어떻게 처리할지
  chosen_reading: ‘영원’으로 옮겨 무한한 지속을 드러냈습니다.
  alternative_readings:
  - ‘옛날’로 옮겨 고대성을 강조
  - ‘시대’로 옮겨 의미 폭을 넓게 유지
  rationale: 이 절은 계산 불가능한 것들을 나열하는 지혜문학적 과장입니다. 따라서 역사적 과거보다 무한한 시간의 감각을 살리는 번역이 본문 의도에 더 가깝습니다.
  doctrine_reference: 지혜문학의 수사적 과장을 보존하고, 어휘의 다의성을 불필요하게 단일화하지 않습니다.
