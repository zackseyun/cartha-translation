translation:
  language: ko
  text: 야훼를 경외하는 사람은 그 끝이 복될 것입니다[a]—그의 날들의 마지막에도 그는 복을 받을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '그리스어 사본 전승은 이 절을 상당히 다르게 전합니다: “지혜의 시작은 주님을 경외하는 것이며, 신실한 이들과는 함께 뱃속에서 그들을 위해 창조되었다.” 본문은 현존하는 히브리어 증거를 따르며, 본문 차이를 투명하게 보존합니다.'
    reason: textual_variant
lexical_decisions:
- source_word: יְרֵא יְהֹוָה
  english_pob_choice: One who fears Yahweh
  chosen_korean: 야훼를 경외하는 사람은
  alternatives_korean:
  - 야훼를 두려워하는 사람은
  - 주님을 경외하는 사람은
  lexicon: HALOT
  rationale: 히브리어 분사형 יְרֵא는 특정한 성향을 지닌 사람을 가리키는 실질적 표현이므로, 자연스러운 현대 한국어로 ‘경외하는 사람’이라 옮기되 하나님의 이름은 본문 원어에 따라 야훼로 유지했습니다.
- source_word: תִּיטַב אַחֲרִיתוֹ
  english_pob_choice: his end will be good
  chosen_korean: 그 끝이 복될 것입니다
  alternatives_korean:
  - 그의 마지막은 좋을 것입니다
  - 그의 결말은 좋을 것입니다
  - 그의 끝은 잘될 것입니다
  lexicon: HALOT
  rationale: אַחֲרִית는 단순한 시간적 ‘미래’보다 ‘끝, 최종 결과, 종말’을 가리키므로, ‘복될 것입니다’로 옮겨 결과의 선함과 문맥상의 축복 의미를 함께 살렸습니다.
- source_word: וּבְאַחֲרִית יָמָיו
  english_pob_choice: at the end of his days
  chosen_korean: 그의 날들의 마지막에도
  alternatives_korean:
  - 그의 날들의 끝에서
  - 그의 생애의 마지막에
  - 말년에
  lexicon: HALOT
  rationale: 앞절의 אַחֲרִית와 같은 어휘를 반복해 종결점을 강조하므로, 직역에 가까운 ‘그의 날들의 마지막에도’로 반복 구조를 드러냈습니다.
- source_word: יִתְבָּרָךְ
  english_pob_choice: he will be blessed
  chosen_korean: 그는 복을 받을 것입니다
  alternatives_korean:
  - 그는 복되게 될 것입니다
  - 그는 축복을 받을 것입니다
  - 그는 복받을 것입니다
  lexicon: HALOT
  rationale: 이 반사·수동형은 문맥상 축복을 받는 의미로 읽는 것이 가장 자연스러우며, 한국어에서는 능동적 자기축복보다 수동 표현이 원문의 의미를 더 분명히 드러냅니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행문의 큰 차이
  chosen_reading: 본문은 현존하는 히브리어를 따르고, 그리스어의 다른 전승은 각주로 투명하게 표시했습니다.
  alternative_readings:
  - 그리스어의 '지혜의 시작은 주님을 경외하는 것'을 본문으로 채택하기
  - 히브리어와 그리스어를 절충해 조화 번역하기
  rationale: 이 절은 히브리어와 그리스어가 실질적으로 다른 문장을 전하므로, 본문을 임의로 조화시키지 않고 히브리어 본문을 우선하되 전승 차이를 각주로 보존하는 것이 원천 충실성과 투명성에 부합합니다.
  doctrine_reference: 'PHILOSOPHY.md: 히브리어가 남아 있을 때는 이를 우선하되, 중대한 본문 차이는 숨기지 않고 주석으로 보존한다.'
