base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/001/004.yaml
  text: Before all these, wisdom was created[b][a], and true understanding is from eternity.
  footnotes:
  - marker: a
    text: The extant Hebrew reads more literally, 'More than all these wisdom is great,' while the Greek parallel reads, 'Before all things wisdom was created.' The main text follows the Greek sense because the Hebrew witness here appears divergent.
    reason: alternative_reading
  - marker: b
    text: The extant Hebrew second line reads, 'and truth has prevailed from eternity,' whereas the Greek reads, 'and understanding of prudence [is] from eternity.'
    reason: alternative_reading
translation:
  language: ko
  text: 모든 것보다 앞서 지혜가 창조되었고, 참된 이해는 영원부터 있습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 현존 히브리어는 더 문자적으로 ‘이 모든 것보다 지혜가 크다’에 가깝지만, 그리스어 평행문은 ‘모든 것보다 앞서 지혜가 창조되었다’라고 읽습니다. 본문은 그리스어의 의미를 따랐습니다.
    reason: alternative_reading
  - marker: b
    text: 현존 히브리어의 둘째 줄은 ‘그리고 진리는 영원부터 우세하였다’에 가깝지만, 그리스어는 ‘그리고 분별의 이해가 영원부터 있다’라고 읽습니다. 본문은 그리스어의 의미를 따랐습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: מִכָּל אֵלֶּה / προτέρα πάντων
  english_pob_choice: Before all these
  chosen_korean: 모든 것보다 앞서
  alternatives_korean:
  - 이 모든 것보다 먼저
  - 모든 것보다 이전에
  lexicon: HALOT; BDAG
  rationale: 히브리어 מן־כל אלה는 비교와 선행의 뉘앙스를 모두 가질 수 있고, 그리스어 προτέρα πάντων은 시간적 선행을 분명히 보여 주므로, 한국어는 ‘앞서/먼저’로 그 선행성을 살렸습니다.
- source_word: רַבָּה / ἔκτισται
  english_pob_choice: was created
  chosen_korean: 창조되었고
  alternatives_korean:
  - 지으심을 받았고
  - 만들어졌고
  lexicon: HALOT; BDAG
  rationale: 현존 히브리어 רבה는 ‘크다’의 뜻이지만, 그리스어 병행문 ἔκτισται가 ‘창조되다’이므로 본문 의미를 그에 맞추어 옮겼습니다.
- source_word: הַחָכְמָה
  english_pob_choice: wisdom
  chosen_korean: 지혜
  alternatives_korean:
  - 슬기
  - 현명함
  lexicon: HALOT
  rationale: חכמה의 기본 대응어로서 ‘지혜’가 가장 자연스럽고, 본문이 의인화된 지혜를 말하지만 한국어 본문에서는 대문자화가 필요하지 않습니다.
- source_word: σύνεσις φρονήσεως / הָאֱמֶת
  english_pob_choice: true understanding
  chosen_korean: 참된 이해
  alternatives_korean:
  - 진정한 깨달음
  - 분별의 이해
  lexicon: BDAG; HALOT
  rationale: 그리스어는 이해와 분별의 복합 표현이고, 히브리어는 ‘진리’를 말하여 두 전승이 엇갈리므로, 본문에서는 그리스어의 의미를 살리되 히브리어 אמת과의 긴장을 남기기 위해 ‘참된’으로 조정했습니다.
- source_word: מֵעוֹלָם / ἐξ αἰῶνος
  english_pob_choice: from eternity
  chosen_korean: 영원부터
  alternatives_korean:
  - 영원에서
  - 태초부터
  lexicon: HALOT; BDAG
  rationale: 두 전승 모두 선재성과 영원성을 가리키므로, 한국어에서는 자연스럽고 신학적으로도 무리 없는 ‘영원부터’를 택했습니다.
theological_decisions:
- issue: 히브리어와 그리스어 전승의 차이 처리
  chosen_reading: 본문은 그리스어의 구조와 핵심 의미를 따르되, 현존 히브리어의 어휘 흔적을 완전히 지우지 않도록 번역을 절제했습니다.
  alternative_readings:
  - ‘이 모든 것보다 지혜가 더 큽니다, 그리고 진리는 영원부터 지속되었습니다.’
  rationale: 이 절은 히브리어와 그리스어가 두 콜론 모두에서 실질적으로 다르므로, 본문은 하나의 전승을 독점하지 않고 POB의 주석 전통을 따라 교차 증거를 반영하는 쪽이 더 투명합니다.
  doctrine_reference: 'POB source policy: Hebrew where extant; Greek parallel as translation input; preserve divergence honestly.'
