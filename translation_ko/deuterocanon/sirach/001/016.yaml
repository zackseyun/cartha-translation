theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼로 직접 표기했습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본절은 사해·히브리 전승의 신명사 טetragrammaton을 직접 포함하므로, 프로젝트 기본값에 따라 음역형 ‘야훼’를 유지해 स्रोत의 고유성을 드러냈습니다.
  doctrine_reference: 'POB glossary: יהוה / YHWH → 야훼'
- issue: 히브리어 본문과 그리스어 병행본의 불일치
  chosen_reading: 히브리어 본문을 본문으로 따르고, 그리스어의 큰 차이를 각주로 남겼습니다.
  alternative_readings:
  - '그리스어 전승: ‘그녀가 그들의 온 집을 자기의 바람직한 것들로 채웠고, 창고들을 자기의 소출로 채웠다.’'
  rationale: 제시된 히브리어 본문이 본절의 기준 본문이며, 그리스어는 내용이 현저히 달라 별도 전승으로만 표시하는 것이 투명합니다.
  doctrine_reference: Source-grounding policy for deuterocanonical textual variants
