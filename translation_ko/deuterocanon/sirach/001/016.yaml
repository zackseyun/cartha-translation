translation:
  language: ko
  text: 지혜의 시작은 야훼를 경외하는 것이며, 그것은 풍성한 평안과 생명과 치유를 가져옵니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 증인은 이 절을 크게 다르게 전합니다. ‘그녀가 그들의 온 집을 자기의 바람직한 것들로 채웠고, 창고들을 자기의 소출로 채웠다.’
    reason: textual_variant
lexical_decisions:
- source_word: רֵאשִׁית
  english_pob_choice: beginning
  chosen_korean: 시작
  alternatives_korean:
