  - 첫째 부분
  lexicon: HALOT
  rationale: 지혜서 문맥에서 temporal/foundational 의미를 자연스럽게 살리면서도 현대 한국어로 읽히는 간결한 명사형으로 옮겼습니다.
- source_word: יִרְאַת יְהֹוָה
  english_pob_choice: fear of Yahweh
  chosen_korean: 야훼를 경외하는 것
  alternatives_korean:
  - 야훼에 대한 두려움
  - 주님을 두려워하는 것
  lexicon: HALOT
  rationale: יִרְאָה의 핵심인 경외를 살리되, 단순한 공포로 약화되지 않도록 ‘경외하는 것’으로 표현했습니다. 프로젝트 기준에 따라 יְהֹוָה는 야훼로 옮겼습니다.
- source_word: וּמַרְבָּה
  english_pob_choice: an abundance of / it brings abundant
  chosen_korean: 풍성한
  alternatives_korean:
  - 넘치는
  - 많은
  lexicon: HALOT
  rationale: 증가·풍성함의 뉘앙스를 살려 뒤의 목록 전체를 수식하는 형용사로 처리했습니다. 한국어에서 ‘풍성한 평안과 생명과 치유’가 가장 자연스럽습니다.
- source_word: שָׁלוֹם
  english_pob_choice: peace
  chosen_korean: 평안
  alternatives_korean:
  - 평화
  - 안녕
  lexicon: HALOT
  rationale: 히브리어 שָׁלוֹם의 전인적 번영을 단순 정치적 평화보다 넓게 담기 위해 ‘평안’을 선택했습니다.
- source_word: חַיִּים
  english_pob_choice: life
  chosen_korean: 생명
  alternatives_korean:
  - 삶
  - 목숨
  lexicon: HALOT
  rationale: 지혜 전통의 축복 항목으로서 생명력을 강조하는 맥락에 맞춰 ‘생명’으로 옮겼습니다.
- source_word: וּמַרְפֵּא
  english_pob_choice: healing
  chosen_korean: 치유
  alternatives_korean:
  - 회복
  - 건강
  lexicon: HALOT
  rationale: 활동적 회복의 의미를 살리면서 현대 독자가 이해하기 쉬운 표현으로 ‘치유’를 택했습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼로 직접 표기했습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본절은 사해·히브리 전승의 신명사 טetragrammaton을 직접 포함하므로, 프로젝트 기본값에 따라 음역형 ‘야훼’를 유지해 स्रोत의 고유성을 드러냈습니다.
  doctrine_reference: 'POB glossary: יהוה / YHWH → 야훼'
- issue: 히브리어 본문과 그리스어 병행본의 불일치
  chosen_reading: 히브리어 본문을 본문으로 따르고, 그리스어의 큰 차이를 각주로 남겼습니다.
  alternative_readings:
  - '그리스어 전승: ‘그녀가 그들의 온 집을 자기의 바람직한 것들로 채웠고, 창고들을 자기의 소출로 채웠다.’'
  rationale: 제시된 히브리어 본문이 본절의 기준 본문이며, 그리스어는 내용이 현저히 달라 별도 전승으로만 표시하는 것이 투명합니다.
  doctrine_reference: Source-grounding policy for deuterocanonical textual variants
