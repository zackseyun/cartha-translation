lexical_decisions:
- source_word: ἕως καιροῦ
  english_pob_choice: Until the appointed time
  chosen_korean: 정해진 때까지는
  alternatives_korean:
  - 때까지는
  - 마땅한 때까지는
  - 정해진 시간까지는
  lexicon: LSJ
  rationale: καιρός는 단순한 시간이 아니라 정해지거나 맞아떨어진 때를 가리키므로, ‘정해진 때’로 옮겨 그 뉘앙스를 살렸습니다.
- source_word: ἀνέξεται
  english_pob_choice: will endure
  chosen_korean: 견딜 것입니다
  alternatives_korean:
  - 인내할 것입니다
  - 버틸 것입니다
  - 참아낼 것입니다
  lexicon: BDAG
  rationale: 미래형의 ἀνέχω는 어려움을 견디고 버티는 뜻이므로, 문맥상 가장 자연스럽고 현대적인 ‘견딜 것입니다’로 옮겼습니다.
- source_word: μακρόθυμος
  english_pob_choice: the patient one
  chosen_korean: 인내하는 사람
  alternatives_korean:
  - 오래 참는 사람
  - 오래 참는 이
  - 인내한 사람
  lexicon: BDAG
  rationale: 형용사가 명사처럼 쓰였으므로 추상명사보다 ‘사람’으로 풀어 인칭성을 살렸고, 남성만을 가리키는 듯한 표현은 피했습니다.
- source_word: ἀναδώσει εὐφροσύνη
  english_pob_choice: joy will be repaid to him
  chosen_korean: 기쁨이 그에게 되돌려질 것입니다
  alternatives_korean:
  - 기쁨이 그에게 갚아질 것입니다
  - 그에게 기쁨이 보상으로 주어질 것입니다
  - 기쁨이 그에게 돌아올 것입니다
  lexicon: BDAG
  rationale: ἀναδίδωμι는 ‘되돌려 주다, 갚다’의 뜻이므로, 수동형으로 옮겨 보상받는 구조를 살리되 과도하게 신학화하지 않도록 했습니다.
