  alternative_readings:
  - 히브리어 전승을 그대로 따라 ‘그녀에게 가까이 가는 사람은 복되다’로 옮김
  rationale: 원자료에 major_mismatch가 표시되어 있고, 영어 POB도 그리스어 본문을 따르도록 수정되어 있으므로, 출처가 더 분명한 그리스어를 본문으로 삼는 것이 주석적으로 정직합니다.
  doctrine_reference: 'PHILOSOPHY.md: 히브리어가 보존되면 히브리어를, 그렇지 않으면 그리스어를 따른다'
