translation:
  language: ko
  text: 모든 지혜는 야훼에게서 나오며, 영원히 그와 함께 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 ‘야훼에게서’라고 하며, 그리스어 병행 본문은 ‘주에게서’라고 합니다. 이 번역은 히브리어 원문을 따라 본문에 ‘야훼’를 사용했습니다.
    reason: source_note
lexical_decisions:
- source_word: כָּל חָכְמָה
  english_pob_choice: All wisdom
  chosen_korean: 모든 지혜
  alternatives_korean:
  - 지혜마다
  - 온갖 지혜
  lexicon: HALOT
  rationale: 히브리어의 포괄적 표현을 한국어 자연스러운 총칭으로 옮겼습니다. '모든'은 그 범위를 분명히 드러내며, 지혜서의 일반적 진술에도 잘 맞습니다.
- source_word: מֵיהֹוָה
  english_pob_choice: from the Lord
  chosen_korean: 야훼에게서 나오며
  alternatives_korean:
  - 주에게서 나오며
  - 야훼로부터
  lexicon: HALOT
  rationale: 히브리어 본문은 여호와의 이름을 직접 사용하므로 기본 원칙에 따라 '야훼'로 옮겼습니다. '에게서 나오며'는 מקור/출처의 의미를 자연스럽게 드러내어 지혜의 근원이 하나님임을 살립니다.
- source_word: וִעמּוֹ הִיא
  english_pob_choice: and it is with him
  chosen_korean: 그와 함께
  alternatives_korean:
  - 그와 더불어
  - 그와 함께 있습니다
  lexicon: HALOT
  rationale: 히브리어의 'with him'을 간결하게 살리되, 앞절의 의미상 주어인 '지혜'를 이어 받아 한국어에서는 무리한 대명사 반복을 줄였습니다.
- source_word: לְעוֹלָמִים
  english_pob_choice: forever
  chosen_korean: 영원합니다
  alternatives_korean:
  - 영원히 있습니다
  - 세세토록 있습니다
  lexicon: HALOT
  rationale: 복수형의 지속성과 영속성을 현대 한국어의 공손한 서술형으로 옮겼습니다. 의미는 'forever'와 대응하며, 지혜가 하나님과 함께 영속함을 분명히 합니다.
theological_decisions:
- issue: 여호와/야훼의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 주
  - 여호와
  rationale: 본절의 히브리어 원문이 יהוה를 직접 쓰므로, 프로젝트 기본값에 따라 고유한 언약명 '야훼'를 유지했습니다. LXX 병행의 κύριος는 본문 의미를 보조하지만, 히브리어 증거를 우선했습니다.
  doctrine_reference: 'Project glossary: יהוה / YHWH → 야훼'
