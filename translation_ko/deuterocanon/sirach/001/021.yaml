translation:
  language: ko
  text: 복되다, 지혜에 대해 묵상하는 사람은 — 그것은 그에게 모든 보물보다 더 좋습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '그리스어 전승은 여기서 매우 다르게 읽습니다: ‘그의 분노의 기울어짐은 그에게는 몰락이다.’ 이는 현존 히브리어와 다른 본문 형태나 절 배열을 반영한 것일 가능성이 있습니다.'
    reason: textual_variant
  - marker: b
    text: 또는 ‘그녀를 숙고하는 사람은 복되다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁרֵי
  english_pob_choice: Happy is
  chosen_korean: 복되다
  alternatives_korean:
  - 행복합니다
  - 복이 있습니다
  lexicon: HALOT
  rationale: אַשְׁרֵי는 지혜문학의 축복 선언으로, 현대 한국어에서는 감탄형보다 서술형 「복되다」가 더 자연스럽고 간결합니다.
- source_word: יֶהְגֶּה בָּהּ
  english_pob_choice: meditates on her
  chosen_korean: 지혜에 대해 묵상하는 사람
  alternatives_korean:
  - 그녀를 묵상하는 사람
  - 그녀에 대해 생각하는 사람
  lexicon: HALOT
  rationale: הגה는 단순한 생각보다 지속적·숙고적 반추를 뜻하므로 「묵상하다」가 적절하며, 문맥상 여성형 대상은 인격화된 지혜로 이해하여 한국어에서는 의미를 분명히 했습니다.
- source_word: וְטוֹבָה הִיא לוֹ מִכָּל אוֹצָר
  english_pob_choice: and she is better for him than every treasure
  chosen_korean: 그것은 그에게 모든 보물보다 더 좋습니다
  alternatives_korean:
  - 그리고 그녀는 그에게 모든 보물보다 더 좋습니다
  - 그에게는 모든 보물보다 낫습니다
  lexicon: HALOT
  rationale: 비교 구문 מִכָּל은 「~보다 더」로 옮기고, 오צָר는 지혜문학의 재물/보물 일반을 가리키므로 「보물」이 가장 직접적입니다. 주어 대명사는 지혜의 인격화를 살리되 한국어에서 어색하지 않게 중성적 재지시로 처리했습니다.
theological_decisions:
- issue: 지혜의 인격화 유지
  chosen_reading: 지혜에 대해 묵상하는 사람 — 그것은 그에게…
  alternative_readings:
  - 그녀를 묵상하는 사람 — 그녀는 그에게…
  - 그것을 묵상하는 사람 — 그것은 그에게…
  rationale: 본문의 여성형 대명사는 지혜를 인격화합니다. 한국어에서는 성별 인칭 대명사 반복이 부자연스러워, 의미를 훼손하지 않는 범위에서 지혜를 분명히 하고 대명사는 중성적으로 처리했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 6
- issue: 축복 선언의 문체
  chosen_reading: 복되다
  alternative_readings:
  - 행복합니다
  - 복이 있습니다
  rationale: אַשְׁרֵי는 단순한 감정 상태보다 삶의 형통과 승인된 복을 선언하므로, 한국어에서 교리적 과장 없이도 그 의미를 살리는 「복되다」를 선택했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
