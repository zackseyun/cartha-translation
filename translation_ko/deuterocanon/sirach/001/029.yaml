  text: Love the fear of the LORD, and bless your heart in it; and do not fear.
translation:
  language: ko
  text: 야훼를 두려워하는 마음을 사랑하십시오. 그 안에서 마음을 복되게 하십시오. 그리고 두려워하지 마십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 יִרְאַת יְהֹוָה는 문자적으로 ‘야훼에 대한 두려움/경외’입니다.
    reason: source_note
lexical_decisions:
- source_word: יְהֹוָה / LORD
  english_pob_choice: the LORD
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: divine_name
  rationale: 히브리어 본문은 여호와의 이름을 가리키므로, POB의 원칙에 따라 고유 신명 형태인 야훼를 유지합니다. 영어 본문이 LORD로 되돌아갔어도 원어 기준 표기를 따릅니다.
- source_word: אֱהַב
  english_pob_choice: Love
  chosen_korean: 사랑하십시오
  alternatives_korean:
  - 사랑하세요
  - 사랑하라
  lexicon: אהב
  rationale: 히브리어 명령형을 현대 표준어의 공손한 명령으로 옮겨, 권면의 직접성을 살리면서도 합쇼체를 유지합니다.
- source_word: וְאַשֵּׁר בָּהּ לִבְּךָ
  english_pob_choice: bless your heart in it
  chosen_korean: 그 안에서 마음을 복되게 하십시오
  alternatives_korean:
  - 그 안에서 마음을 축복하십시오
  - 그 안에서 마음을 기쁘게 하십시오
  lexicon: אשר
  rationale: 영어 POB의 bless를 단순 감정적 '기쁘게 하다'로 약화하지 않고, 본문이 요구하는 능동적 축복 행위를 반영해 '복되게 하다'로 옮겼습니다.
- source_word: וְאַל תִּירָא
  english_pob_choice: and do not fear
  chosen_korean: 그리고 두려워하지 마십시오
  alternatives_korean:
  - 그리고 두려워하지 마세요
  - 그리고 겁내지 마십시오
  lexicon: ירא
  rationale: 마지막 금지는 일반적 불안이 아니라 경외의 반대편에 있는 두려움을 금하는 것으로 읽혀, 직설적 금지형을 유지했습니다.
theological_decisions:
- issue: “fear of the LORD”의 번역과 경외-두려움의 긴장
  chosen_reading: ‘야훼를 두려워하는 마음’으로 옮기되, 이어지는 ‘두려워하지 마십시오’와의 대비를 유지했습니다.
  alternative_readings:
  - ‘야훼 경외’
  - ‘주님을 두려워함’
  rationale: 히브리어 יִרְאָה는 경외와 두려움을 모두 포함할 수 있으므로, 본문이 의도하는 지혜문학적 긴장을 흐리지 않도록 ‘두려워하는 마음’과 ‘두려워하지 마십시오’를 함께 살렸습니다.
  doctrine_reference: 지혜문학의 경외 개념
