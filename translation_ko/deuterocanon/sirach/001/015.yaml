base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/001/015.yaml
  text: The fullness of wisdom is to fear the Lord, and it makes them drunk from its fruits[b][a].
  footnotes:
  - marker: a
    text: 'The extant Cairo Geniza Hebrew line at this location differs sharply: ''With people of truth she has been established from of old, and with their offspring his loyalty is faithful.'' The Hebrew is bracketed in the cited edition and marked as a major mismatch, so the Greek reading governs the main text here.'
    reason: textual_variant
  - marker: b
    text: Or 'from her fruits'; wisdom is grammatically feminine in Greek and often personified in Sirach.
    reason: lexical_alternative
translation:
  language: ko
  text: 지혜의 충만함은 주님을 두려워하는 것이며, 그 지혜는 그 열매들로 그들을 취하게 합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '현존 카이로 게니자 히브리어 이 구절은 본문과 크게 다릅니다: ''진실한 사람들과 함께 그녀는 옛적부터 세워졌고, 그들의 후손과 함께 그의 충실한 사랑은 신실하다.'' 인용판에서 이 히브리어는 괄호로 묶였고 ''major mismatch''로 표시되므로, 본문은 그리스어를 따릅니다.'
    reason: textual_variant
  - marker: b
    text: 또는 '그녀의 열매에서'. 그리스어에서 지혜는 문법적으로 여성형이며, 시락에서 종종 의인화됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: πλησμονὴ
  english_pob_choice: fullness
  chosen_korean: 충만함
  alternatives_korean:
  - 풍성함
  - 가득 참
  - 충만
  lexicon: LSJ
  rationale: 지혜의 양적·질적 충만을 함께 살리는 명사형으로 옮겼습니다. '풍성함'보다 본문의 선언적 리듬이 분명하고, '가득 참'보다 문체가 자연스럽습니다.
- source_word: φοβεῖσθαι τὸν κύριον
  english_pob_choice: to fear the Lord
  chosen_korean: 주님을 두려워하는 것
  alternatives_korean:
  - 주님을 경외하는 것
  - 주님을 두려워함
  lexicon: LSJ
  rationale: φοβεῖσθαι의 직접적 의미를 살려 '경외'로 완화하지 않고 '두려워하는 것'으로 옮겼습니다. κύριος는 POB 관례에 따라 '주님'으로 번역했습니다.
- source_word: μεθύσκει
  english_pob_choice: makes them drunk
  chosen_korean: 그들을 취하게 합니다
  alternatives_korean:
  - 그들을 술 취하게 합니다
  - 그들을 도취시킵니다
  - 그들을 취하게 만듭니다
  lexicon: LSJ
  rationale: 직역의 충격을 유지하되 한국어 독자에게 지나치게 물리적인 느낌만 남지 않도록 '취하게 합니다'를 선택했습니다. 비유적 강도를 과도하게 약화시키지 않기 위한 선택입니다.
- source_word: ἀπὸ τῶν καρπῶν αὐτῆς
  english_pob_choice: from its fruits
  chosen_korean: 그 열매들로
  alternatives_korean:
  - 그 열매들로부터
  - 그 열매에서
  - 그 열매들로부터
  lexicon: LSJ
  rationale: ἀπό의 'from'을 한국어 조사로 자연스럽게 풀어 '…로'를 사용했습니다. 지혜를 여성으로 의인화할 수 있다는 영어 주석은 본문에는 반영하지 않았습니다.
theological_decisions:
- issue: Greek primary sense versus bracketed Hebrew mismatch
  chosen_reading: 본문은 그리스어의 의미를 따라 '지혜의 충만함은 주님을 두려워하는 것'으로 옮기고, 히브리어의 심한 불일치는 각주로 보존했습니다.
  alternative_readings:
  - '''충실한 사람들과 함께 옛적부터 그녀는 세워졌으며…'''
  - '''진실한 사람들과 함께 옛부터 마련되었고…'''
  rationale: 이 위치의 히브리어는 괄호 처리된 채 major mismatch로 표시되어 있으므로, 본문 의미는 그리스어가 지배해야 합니다. 텍스트 비평상의 긴장을 지우지 않기 위해 각주로만 남겼습니다.
  doctrine_reference: 'PHILOSOPHY.md의 Sirach 번역 원칙: 히브리어가 온전히 보존되면 히브리어를 따르되, 여기처럼 현저히 불일치하는 경우 그리스어를 본문으로 채택하고 차이를 투명하게 기록합니다.'
