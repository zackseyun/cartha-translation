base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/001/015.yaml
  text: The fullness of wisdom is to fear the Lord, and it makes them drunk from its fruits[b][a].
  footnotes:
  - marker: a
    text: 'The extant Cairo Geniza Hebrew line at this location differs sharply: ''With people of truth she has been established from of old, and with their offspring his loyalty is faithful.'' The Hebrew is bracketed in the cited edition and marked as a major mismatch, so the Greek reading governs the main text here.'
    reason: textual_variant
  - marker: b
    text: Or 'from her fruits'; wisdom is grammatically feminine in Greek and often personified in Sirach.
    reason: lexical_alternative
translation:
  language: ko
  text: 지혜의 충만함은 주님을 두려워하는 것이며, 그 지혜는 자기 열매에서 그들을 취하게 합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '현존 카이로 게니자 히브리어의 이 구절은 본문과 크게 다릅니다: ‘진실한 사람들과 함께 그녀는 예로부터 마련되었고, 그들의 후손과 함께 그의 충성은 신실하다.’ 인용판에서 이 히브리어는 대괄호로 묶였고 ‘major mismatch’로 표시되므로, 본문은 그리스어를 따릅니다.'
    reason: textual_variant
  - marker: b
    text: 또는 ‘그녀의 열매에서’. 그리스어에서 ‘지혜’는 문법적으로 여성형이며, 시락에서 종종 의인화됩니다.
    reason: lexical_alternative
