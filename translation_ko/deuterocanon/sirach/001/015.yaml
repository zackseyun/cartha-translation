  - '''진실한 사람들과 함께 옛부터 마련되었고…'''
  rationale: 이 위치의 히브리어는 괄호 처리된 채 major mismatch로 표시되어 있으므로, 본문 의미는 그리스어가 지배해야 합니다. 텍스트 비평상의 긴장을 지우지 않기 위해 각주로만 남겼습니다.
  doctrine_reference: 'PHILOSOPHY.md의 Sirach 번역 원칙: 히브리어가 온전히 보존되면 히브리어를 따르되, 여기처럼 현저히 불일치하는 경우 그리스어를 본문으로 채택하고 차이를 투명하게 기록합니다.'
