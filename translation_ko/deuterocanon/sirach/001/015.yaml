  lexicon: LSJ
  rationale: 직역의 충격을 유지하되 한국어 독자에게 지나치게 물리적인 느낌만 남지 않도록 '취하게 합니다'를 선택했습니다. 비유적 강도를 과도하게 약화시키지 않기 위한 선택입니다.
- source_word: ἀπὸ τῶν καρπῶν αὐτῆς
  english_pob_choice: from its fruits
  chosen_korean: 그 열매들로
  alternatives_korean:
  - 그 열매들로부터
  - 그 열매에서
  - 그 열매들로부터
  lexicon: LSJ
  rationale: ἀπό의 'from'을 한국어 조사로 자연스럽게 풀어 '…로'를 사용했습니다. 지혜를 여성으로 의인화할 수 있다는 영어 주석은 본문에는 반영하지 않았습니다.
theological_decisions:
- issue: Greek primary sense versus bracketed Hebrew mismatch
  chosen_reading: 본문은 그리스어의 의미를 따라 '지혜의 충만함은 주님을 두려워하는 것'으로 옮기고, 히브리어의 심한 불일치는 각주로 보존했습니다.
