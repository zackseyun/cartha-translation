base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/001/014.yaml
  text: The beginning of wisdom is the fear of Yahweh[b][a], and with the faithful she was formed in the womb.
  footnotes:
  - marker: a
    text: 'Greek reads quite differently: ''Among men she nested as an eternal foundation, and with their offspring she will be entrusted.'' The Hebrew and Greek witnesses diverge substantially here.'
    reason: alternative_reading
  - marker: b
    text: Or possibly 'was preserved in the womb,' if the Hebrew verb is taken from a root meaning 'guard' rather than understood in a formation/birth sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 지혜의 시작은 야훼를 두려워하는 것이며, 신실한 이들과 함께 지혜는 태중에서 형성되었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '그리스어는 매우 다르게 읽습니다: ‘사람들 가운데서 그녀는 영원한 기초로 자리를 잡았고, 그들의 자손과 함께 그녀는 맡겨질 것이다.’ 히브리어와 그리스어 증언은 이 구절에서 크게 갈립니다.'
    reason: alternative_reading
  - marker: b
    text: 히브리어 동사는 ‘지키다/보존하다’ 계열로도 이해될 수 있어, ‘태중에서 보호되었다’로도 옮길 여지가 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֵאשִׁית חָכְמָה
  english_pob_choice: the beginning of wisdom
  chosen_korean: 지혜의 시작
  alternatives_korean:
  - 지혜의 첫 부분
  - 지혜의 근본
  lexicon: HALOT
  rationale: 히브리어 구성은 시간적·기원적 의미를 가장 자연스럽게 나타내므로, 한국어도 ‘지혜의 시작’으로 간결하게 옮겼습니다.
- source_word: יִרְאַת יְהֹוָה
  english_pob_choice: the fear of Yahweh
  chosen_korean: 야훼를 두려워하는 것
  alternatives_korean:
  - 야훼에 대한 경외
  - 야훼를 경외하는 것
  lexicon: HALOT
  rationale: 지혜문학의 고정 표현에서 פחד/יראה의 강한 감각을 살리기 위해 ‘두려워하는 것’을 유지했습니다. ‘경외’는 의미를 완화할 수 있어 기본 본문에서는 쓰지 않았습니다.
- source_word: נֶאֱמָנִים
  english_pob_choice: the faithful
  chosen_korean: 신실한 이들
  alternatives_korean:
  - 충실한 사람들
  - 신실한 사람들
  lexicon: HALOT
  rationale: 형용사를 명사적으로 써서 공동체적 대상을 드러내는 용법이므로, 한국어에서도 ‘이들’로 받았습니다.
- source_word: נוֹצְרָה
  english_pob_choice: was formed / was preserved
  chosen_korean: 형성되었습니다
  alternatives_korean:
  - 보호되었습니다
  - 보존되었습니다
  - 지켜졌습니다
  lexicon: HALOT
  rationale: 본문의 기본 이미지는 태중에서의 생성·형성으로 읽히므로 ‘형성되었습니다’가 가장 직접적입니다. 다만 히브리어 어근 가능성 때문에 POB의 보존/보호 뉘앙스를 배제하지 않도록 문맥상 열린 표현으로 두었습니다.
- source_word: בַּבָּטֶן
  english_pob_choice: in the womb
  chosen_korean: 태중에서
  alternatives_korean:
  - 배 속에서
  - 자궁에서
  lexicon: HALOT
  rationale: 지혜가 태전에서 이루어진다는 신체적 이미지를 표준 한국어로 가장 자연스럽게 살리는 표현입니다.
theological_decisions:
- issue: YHWH의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 프로젝트 기본 용례에 따라 신명기적 이름을 직접 보존해 번역했습니다. 지혜문학의 인격적·언약적 뉘앙스도 함께 유지됩니다.
  doctrine_reference: 'POB glossary: יהוה / YHWH'
- issue: 히브리어 본문과 그리스어 병행본문의 현격한 차이
  chosen_reading: 히브리어 본문을 본문으로 번역하고, 의미가 크게 다른 그리스어는 주석으로만 보존합니다.
  alternative_readings:
  - 그리스어를 본문으로 옮겨 ‘사람들 가운데서 영원한 기초로 자리를 잡았다…’로 번역
  - 본문에 두 전승을 절충한 혼합 번역
  rationale: 이 절은 두 전승이 상당히 다르므로, 살아 있는 히브리어 본문을 기본으로 하되 다른 전승의 존재를 숨기지 않는 방식이 가장 투명합니다.
  doctrine_reference: source-critical transparency policy
