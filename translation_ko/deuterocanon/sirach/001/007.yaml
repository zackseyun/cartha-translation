  text: He examined her and saw her and counted her[a], and he gave her to those who love him.
  footnotes:
  - marker: a
    text: 'Greek parallel witness: ''There is one who is wise, greatly fearsome, seated upon his throne.'' The surviving Hebrew here differs substantially from the Greek tradition.'
    reason: textual_variant
translation:
  language: ko
  text: 그는 그녀를 시험하시고 보시고 헤아리셨으며, 그녀를 그분을 사랑하는 이들에게 주셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 병행 전승은 ‘한 분이 지혜로우시며, 지극히 경외로우시고, 자기 보좌에 앉아 계십니다’라고 읽으며, 남아 있는 히브리어와 크게 다릅니다.
    reason: textual_variant
lexical_decisions:
- source_word: בְחָנָהּ
  english_pob_choice: examined her
  chosen_korean: 시험하시고
  alternatives_korean:
  - 살피시고
  - 검토하시고
  lexicon: HALOT
  rationale: בחן의 핵심 의미인 시험·검증을 살리되, 현대 한국어에서 자연스러운 동작 순서를 위해 ‘시험하시고’로 옮겼습니다.
- source_word: וְרָאָהּ
  english_pob_choice: saw her
  chosen_korean: 보시고
  alternatives_korean:
  - 살피시고
  - 목격하시고
  lexicon: HALOT
  rationale: ראה의 기본값인 ‘보다’를 간결하게 반영해 앞뒤 동사 연쇄를 유지했습니다.
- source_word: וְסְפָרָהּ
  english_pob_choice: counted her
  chosen_korean: 헤아리셨으며
  alternatives_korean:
  - 세셨으며
  - 수로 정하셨으며
  lexicon: HALOT
  rationale: ספר를 단순 산술의 ‘세다’보다 의미를 조금 넓게 담는 ‘헤아리다’로 옮겨, 지혜를 면밀히 측정·산정하시는 뉘앙스를 살렸습니다.
- source_word: לְאֹהֲבָיו
  english_pob_choice: to those who love him
  chosen_korean: 그분을 사랑하는 이들에게
  alternatives_korean:
  - 그를 사랑하는 자들에게
  - 그분을 사랑하는 사람들에게
  lexicon: HALOT
  rationale: 히브리어 남성 단수 접미사를 반영해 대상은 지혜가 아니라 하나님으로 읽고, 현대 한국어에서 자연스러운 존칭 대상을 위해 ‘그분’을 사용했습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행본문이 서로 크게 다른 전승을 보이는 문제
  chosen_reading: 본문은 현존 히브리어를 따라 번역하고, 그리스어 전승의 상이한 읽기는 주석 각주로만 표시했습니다.
  alternative_readings:
  - 그리스어에 따라 ‘한 분이 지혜로우시며, 몹시 두려우시고, 자기 보좌에 앉아 계십니다’로 옮김
  rationale: 서지상 히브리어가 주본문이므로 이를 우선하되, 본문 차이를 숨기지 않기 위해 그리스어 전승의 중대한 이형을 각주로 보존했습니다.
  doctrine_reference: '서사·지혜문학 번역 원칙: 현존 본문 우선, 주요 이문은 투명하게 표기'
- issue: לְאֹהֲבָיו의 지시 대상
  chosen_reading: 접미사의 문법형태에 따라 ‘그분’을 하나님으로 이해했습니다.
  alternative_readings:
  - 지혜를 ‘사랑하는 이들’로 조정해 읽음
  - ‘그녀를 사랑하는 이들에게’로 인격화된 지혜에 맞춤
  rationale: 히브리어는 남성 단수 접미사이므로, 문법적으로 가장 근접한 지시 대상은 하나님입니다. 지혜의 여성적 의인화와 문법 주체가 어긋나는 긴장은 그대로 두었습니다.
  doctrine_reference: 문법 우선 읽기와 의인화 긴장 보존
