lexical_decisions:
- source_word: μετὰ πάσης σαρκὸς
  english_pob_choice: among all flesh
  chosen_korean: 모든 육체 가운데에서
  alternatives_korean:
  - 모든 육체와 함께
  - 모든 인간 가운데에서
  - 모든 생물 가운데에서
  lexicon: LSJ
  rationale: μετά + 속격의 관계를 한국어의 ‘~가운데에서’로 옮겨, 분배의 범위를 살리면서도 ‘육체’라는 구체적 표현을 유지했습니다.
- source_word: κατὰ τὴν δόσιν αὐτοῦ
  english_pob_choice: according to his gift
  chosen_korean: 그의 주시는 바에 따라
  alternatives_korean:
  - 그의 선물에 따라
  - 그의 주심에 따라
  - 그가 주시는 것에 따라
  lexicon: LSJ
  rationale: δόσις는 ‘줌, 주어짐, 선물’의 뜻을 가지므로, 한국어에서는 동작성과 결과를 함께 드러내는 ‘주시는 바’로 자연스럽게 옮겼습니다.
- source_word: ἐχορήγησεν αὐτὴν
  english_pob_choice: granted her
  chosen_korean: 그는 그것을 ... 주셨습니다
  alternatives_korean:
  - 그는 그녀를 ... 공급하셨습니다
  - 그는 그것을 ... 마련해 주셨습니다
  - 그는 그녀를 ... 허락하셨습니다
  lexicon: LSJ
  rationale: χορηγέω는 넉넉히 공급하다, 마련해 주다, 주다의 뜻이므로, 본문 문맥에서 personified wisdom을 ‘그것’으로 받되 한국어에서는 가장 자연스러운 ‘주셨습니다’로 옮겼습니다.
- source_word: τοῖς ἀγαπῶσιν αὐτόν
  english_pob_choice: to those who love him
  chosen_korean: 그를 사랑하는 이들에게
  alternatives_korean:
  - 그를 사랑하는 사람들에게
  - 그를 사랑하는 자들에게
  - 그를 사랑하는 이들에게
  lexicon: LSJ
  rationale: 분사구는 수혜 대상을 나타내므로 ‘~에게’로 처리했고, αὐτόν은 문맥상 하나님을 가리키므로 그대로 ‘그를’로 유지했습니다.
theological_decisions:
- issue: 여성형 대명사 αὐτήν의 지시 대상
  chosen_reading: 여성형 대명사는 지혜를 가리키므로 한국어에서도 인격화의 흐름을 유지하되, 문장 자연성을 위해 ‘그것’을 사용했습니다.
  alternative_readings:
  - ‘그녀를’로 옮겨 지혜의 여성 인격화를 더 직접적으로 드러낼 수 있습니다.
  - ‘그것을’로 옮겨 비인격적 대상을 암시할 수 있습니다.
  rationale: 시락 1장 전체의 지혜 인격화는 보존해야 하지만, 한국어에서는 지혜를 ‘그녀’로 반복할 경우 부자연스러울 수 있어 문맥의 핵심인 수여 행위를 우선 살렸습니다.
  doctrine_reference: 문학적 인격화를 보존하되 한국어 문장성도 함께 유지해야 합니다.
