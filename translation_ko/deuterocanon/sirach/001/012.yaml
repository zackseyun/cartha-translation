  alternatives_korean:
  - 마음을 즐겁게 하고
  - 마음을 기쁘게 하며
  lexicon: HALOT
  rationale: 사역적 분사 구조를 한국어의 연결 표현으로 풀어, 원문의 인과적 효과를 자연스럽게 드러냈습니다.
- source_word: חֵן
  english_pob_choice: favor
  chosen_korean: 은총
  alternatives_korean:
  - 호의
  - 총애
  - 은혜
  lexicon: HALOT
  rationale: 지혜문맥의 후속 선물 목록에서 חֵן은 단순 호의보다 베푸시는 은혜로운 호의의 뉘앙스가 있어, 한국어에서는 '은총'이 가장 압축적이고 적절합니다.
- source_word: אֹרֶךְ יָמִים
  english_pob_choice: length of days
  chosen_korean: 장수의 날들
  alternatives_korean:
  - 날들의 길이
  - 오랜 날들
  - 장수
  lexicon: HALOT
  rationale: 히브리 관용구의 시간적 풍요를 살리면서도 한국어에서 바로 이해되도록 '장수의 날들'로 옮겼습니다.
theological_decisions:
- issue: 히브리 본문과 헬라어 병행문의 큰 차이
  chosen_reading: 본문에는 현존 히브리어를 따라 '두려워하는 것… 기쁨과 은총과 장수의 날들'로 옮기고, 헬라어의 다른 형태는 각주로만 제시합니다.
  alternative_readings:
  - 야훼를 두려워하는 자에게는 끝이 잘되고, 죽는 날에 복을 받는다
  rationale: 벤 시라에서 히브리어 전승이 살아 있는 경우 이를 본문으로 삼되, 본문 수준의 차이를 헐겁게 조화시키지 않고 헬라어의 독립된 전승을 각주로 보존해야 합니다.
  doctrine_reference: 'PHILOSOPHY.md: translate from Hebrew where it survives; preserve source uncertainty honestly.'
