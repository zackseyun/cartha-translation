  - 주님을 두려워함
  lexicon: HALOT
  rationale: 히브리어의 יִרְאָה는 단순한 공손함보다 실제 '두려움'의 무게를 포함하므로 이를 살리되, 주체를 목적격으로 풀어 자연스러운 현대 한국어 명사구로 옮겼습니다.
- source_word: מְשַׂמַּחַת
