translation:
  language: ko
  text: 지혜의 보물들에는 지식의 격언들이 있으나, 하나님을 경외하는 것은 죄인에게 가증한 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 현존하는 카이로 게니자 히브리어의 이 대목은 대략 ‘그는 그녀로 말미암아 기뻐하고, 그녀는 그로 말미암아 기뻐하며, 그를 영원토록 버리지 말라’로 읽힙니다. 이는 이 절의 그리스어 본문과 일치하지 않으므로, 본문 번역은 그리스어 전승을 따랐습니다.
    reason: textual_variant
  - marker: b
    text: 또는 ‘지식의 비유들’ 또는 ‘이해의 격언들’.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘경건’.
    reason: lexical_alternative
