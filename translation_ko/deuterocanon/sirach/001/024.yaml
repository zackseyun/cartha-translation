    reason: lexical_alternative
  - marker: c
    text: Or 'piety' for 'godliness.'
    reason: lexical_alternative
translation:
  language: ko
  text: 지혜의 보물들 안에는 지식의 비유들이 있으며, 경건은 죄인에게는 가증합니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 현존 카이로 게니자 히브리어의 이 대목은 대략 ‘그는 그녀 안에서 기뻐하고 그녀는 그 안에서 기뻐하며, 그를 영원무궁토록 버리지 말라’로 읽히며, 이 절의 그리스어와 일치하지 않으므로 본문은 그리스어 증거를 따랐습니다.
    reason: textual_variant
  - marker: b
    text: 또는 ‘지식의 비유들’ / ‘이해의 격언들’.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘경건’.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν θησαυροῖς
  english_pob_choice: In the treasures of
  chosen_korean: 지혜의 보물들 안에는
  alternatives_korean:
  - 지혜의 곳간들 안에는
  - 지혜의 창고들 안에는
  lexicon: LSJ
  rationale: θησαυροῖς는 보물의 저장소나 보물 자체를 가리킬 수 있으나, 한국어에서는 ‘보물들 안에’가 가장 자연스럽고 은유를 보존합니다.
- source_word: σοφίας
  english_pob_choice: wisdom
  chosen_korean: 지혜의
  alternatives_korean:
  - 지혜에서 나온
  - 지혜에 속한
  lexicon: LSJ
  rationale: 소유·귀속의 속격으로 보아 ‘지혜의’가 가장 직접적이며, 앞의 ‘보물들’과의 결합도 자연스럽습니다.
- source_word: παραβολαὶ ἐπιστήμης
  english_pob_choice: insightful sayings
  chosen_korean: 지식의 비유들
  alternatives_korean:
  - 지식의 비유들
  - 이해의 비유들
  - 지식의 격언들
  lexicon: LSJ
  rationale: παραβολαί는 이곳에서 복음서식 ‘비유’보다 지혜문학적 ‘비유/격언’의 폭을 가지며, ἐπιστήμης는 ‘지식’으로 옮기는 것이 원문 결을 가장 잘 살립니다.
- source_word: βδέλυγμα
  english_pob_choice: an abomination
  chosen_korean: 가증합니다
  alternatives_korean:
  - 가증합니다
  - 혐오스럽습니다
  - 역겹습니다
  lexicon: LSJ
  rationale: βδέλυγμα의 강한 종교·도덕적 혐오감을 한국어 성경 문체에서 가장 직접적으로 드러내는 표현은 ‘가증합니다’입니다.
- source_word: ἁμαρτωλῷ
  english_pob_choice: to a sinner
  chosen_korean: 죄인에게는
  alternatives_korean:
  - 죄인에게
  - 죄인의 눈에는
  lexicon: LSJ
  rationale: 여격은 죄인의 관점/대상 기준을 나타내므로, 비교 대조를 살린 ‘-에게는’이 문맥상 적절합니다.
theological_decisions:
- issue: 히브리어 대 그리스어 본문 불일치
  chosen_reading: 그리스어 본문을 본문 번역의 기준으로 삼고, 히브리어의 상이한 전승은 각주로 남겼습니다.
  alternative_readings:
  - 현존 히브리어 문장을 본문으로 번역하기
  rationale: 이 절의 히브리어는 그리스어와 의미가 현저히 어긋나므로, 본문은 그리스어에 따라 옮기고 본문 밖에서 전승 차이를 투명하게 보존하는 것이 원칙에 맞습니다.
  doctrine_reference: 'PHILOSOPHY.md: 본문이 보존된 언어를 우선하되, 상이 전승은 숨기지 말고 주석으로 드러낸다.'
