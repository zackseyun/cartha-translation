  - marker: a
    text: The extant Cairo Geniza Hebrew line in Kahana for this location reads approximately, 'He will rejoice in her and she will rejoice in him, and do not forsake him forever and ever,' which does not match the Greek wording here; the main translation therefore follows the Greek witness for this verse.
