translation:
  language: ko
  text: 하늘의 높이와 땅의 너비와 심연의 깊이—누가 그것들을 탐구해 낼 수 있겠습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 병행본은 ‘그리고 지혜’를 덧붙여, ‘하늘의 높이와 땅의 너비와 심연과 지혜—누가 그것들을 탐구해 낼 수 있겠습니까?’라고 읽습니다.
    reason: textual_variant
lexical_decisions:
- source_word: רוּם שָׁמַיִם
  english_pob_choice: the height of heaven
  chosen_korean: 하늘의 높이
  alternatives_korean:
  - 하늘의 높음
  - 하늘의 고도
  lexicon: HALOT
  rationale: ‘רוּם’은 여기서 추상적 ‘고귀함’보다 공간적 높이를 가리키므로, 측정 가능한 표현인 ‘높이’가 가장 자연스럽습니다.
- source_word: רֹחַב אָרֶץ
  english_pob_choice: the breadth of the earth
  chosen_korean: 땅의 너비
  alternatives_korean:
  - 땅의 넓이
  - 땅의 폭
  lexicon: HALOT
  rationale: ‘רֹחַב’은 폭넓음/가로의 크기를 뜻하므로, 한국어에서는 현대적이고 직접적인 ‘너비’가 대응이 좋습니다.
- source_word: עֹמֶק תְּהוֹם
  english_pob_choice: the depth of the abyss
  chosen_korean: 깊은 바다
  alternatives_korean:
  - 깊음의 바닥
  - 심연의 깊이
  - 깊은 심연
  lexicon: HALOT
  rationale: 히브리어는 ‘깊이/심연’의 결합이지만, 한국어에서 ‘깊은 바다’가 혼돈의 심연을 가장 자연스럽게 전달하며, 문맥상 우주적 깊이를 살립니다.
- source_word: מִי יַחֲקֹר
  english_pob_choice: who can search them out?
  chosen_korean: 누가 그것들을 찾아내겠습니까?
  alternatives_korean:
  - 누가 그것들을 샅샅이 살펴낼 수 있겠습니까?
  - 누가 그것들을 헤아려 찾아내겠습니까?
  lexicon: HALOT
  rationale: 수사적 질문의 불가능성을 살리기 위해 ‘누가…겠습니까?’를 사용했고, ‘יַחֲקֹר’의 철저한 탐색 의미는 ‘찾아내다’로 간결하게 옮겼습니다.
theological_decisions:
- issue: 히브리어 본문에 없는 그리스어 병행본의 ‘지혜’ 포함 여부
  chosen_reading: 주본문은 히브리어에 따라 ‘하늘/땅/깊은 바다’만 두고, ‘지혜’는 넣지 않았습니다.
  alternative_readings:
  - 그리스어 병행본처럼 ‘지혜’를 덧붙여 ‘…깊은 바다와 지혜’로 옮기는 방식
  rationale: 이 절에서는 현존 히브리어 증언이 직접적인 본문 आधार이며, 그리스어의 추가어는 의미 있는 변이로만 보존하는 편이 본문 투명성에 부합합니다.
  doctrine_reference: 원어 증언 우선 및 변이 보존 원칙
