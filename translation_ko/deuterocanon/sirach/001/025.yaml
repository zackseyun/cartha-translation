- from: 지혜를 사모하십시오. 계명을 지키십시오. 그러면 주님께서 그녀를 여러분에게 공급하실 것입니다.[a][b]
  to: 지혜를 사모하십시오. 계명들을 지키십시오. 그러면 주님께서 여러분에게 지혜를 베푸실 것입니다.[a][b]
