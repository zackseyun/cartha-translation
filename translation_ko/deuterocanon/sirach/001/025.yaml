theological_decisions:
- issue: 본문 기초가 되는 원전 선택
  chosen_reading: 이 절은 제공된 히브리어가 사복음서적/문맥적으로 현저히 불일치하므로, 고지된 그리스어 평행본문을 번역의 실제 आधार로 삼았습니다.
  alternative_readings:
  - 제공된 히브리어를 그대로 번역함
  rationale: POB의 감사 원칙에 따라 현존 증거를 솔직히 구분해야 하며, 이 경우 히브리어는 본 절의 텍스트로 기능하지 못하므로 그리스어를 바탕으로 번역하는 것이 타당합니다.
  doctrine_reference: 'PHILOSOPHY.md: 본문 불일치가 크면 사용 가능한 원전 증거를 명시하고, 실제로 대응하는 본문을 따라 번역한다.'
- issue: 지혜의 여성 인칭
  chosen_reading: 지혜를 여성 대명사로 반영했습니다.
  alternative_readings:
  - 지혜를 ‘그것’으로 처리함
  rationale: 원문의 αὐτήν과 지혜문학의 인격화된 지혜 전통을 보존해 문학적·신학적 색채를 흐리지 않기 위함입니다.
  doctrine_reference: DOCTRINE.md §4 Gender-accurate over gender-neutral
