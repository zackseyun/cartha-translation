  - 준수하십시오
  lexicon: BDAG
  rationale: 계명과 함께 쓰일 때는 단순 보유가 아니라 순종적 준수를 뜻하므로, 합쇼체 권면으로 자연한 ‘지키십시오’를 선택했습니다.
