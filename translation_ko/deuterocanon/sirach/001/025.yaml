  - 율법의 명령
  lexicon: BDAG
  rationale: 복수형의 뉘앙스를 담되 한국어에서는 집합명사 ‘계명’이 가장 자연스러워 본문 흐름을 간결하게 살렸습니다.
- source_word: χορηγήσει
  english_pob_choice: will supply
  chosen_korean: 공급하실 것입니다
  alternatives_korean:
  - 베푸실 것입니다
