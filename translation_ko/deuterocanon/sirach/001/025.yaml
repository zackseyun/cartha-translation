  text: Desire wisdom, keep the commandments, and the Lord will supply her[b][a] to you.
  footnotes:
  - marker: a
    text: The extant Hebrew line supplied for this verse does not match Sirach 1:25; the translation therefore follows the Greek witness here.
    reason: textual_variant
  - marker: b
    text: Or 'If you desire wisdom, keep the commandments, and the Lord will grant her to you.' The opening participle may be taken conditionally, and 'grant' is a possible alternative to 'supply.'
    reason: alternative_reading
translation:
  language: ko
  text: 지혜를 사모하십시오. 계명을 지키십시오. 그러면 주님께서 그녀를 여러분에게 공급하실 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 절에 제공된 히브리어 본문은 Sirach 1:25와 일치하지 않으므로, 번역은 그리스어 증거를 따랐습니다.
    reason: textual_variant
  - marker: b
    text: ἐπιθυμήσας는 문맥에 따라 ‘만일 여러분이 지혜를 사모한다면’으로도 옮길 수 있습니다.
    reason: alternative_reading
