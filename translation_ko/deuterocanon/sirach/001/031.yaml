base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/001/031.yaml
  text: My son[a], do not be false in the fear of Yahweh[b], and do not draw near to him with a divided heart.
  footnotes:
  - marker: a
    text: Hebrew witness reads, 'My son, do not be false in the fear of the LORD, and do not draw near to him with a divided heart.' The Greek parallel at this verse instead reads, 'He who repays acts of kindness remembers for what comes afterward, and in a time of falling he will find support.'
    reason: textual_variant
  - marker: b
    text: Literally, 'with heart and heart,' a Hebrew idiom for inner duplicity or a divided heart.
    reason: lexical_alternative
translation:
  language: ko
  text: 내 아들아, 야훼에 대한 두려움에서 거짓되지 말고, 마음과 마음으로 그에게 가까이 나아가지 마십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 증거는 “내 아들아, 야훼에 대한 두려움에서 거짓되지 말고, 마음과 마음으로 그에게 가까이 나아가지 마십시오”라고 읽습니다. 이 절의 그리스어 평행본은 “은혜를 갚는 자는 이후에 올 일을 기억하며, 넘어짐의 때에 지지를 찾을 것입니다”라고 달리 전합니다.
    reason: textual_variant
  - marker: b
    text: 직역하면 “마음과 마음”이며, 내적 분열이나 이중성을 가리키는 히브리어 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנִי
  english_pob_choice: My son
  chosen_korean: 내 아들아
  alternatives_korean:
