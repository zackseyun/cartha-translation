  lexicon: HALOT
  rationale: קרב의 '가까이 다가가다'를 살리되, 한국어에서 관계적·예배적 접근의 뉘앙스를 모두 담을 수 있도록 했습니다.
- source_word: בְּלֵב וָלֵב
  english_pob_choice: with a divided heart
  chosen_korean: 마음과 마음으로
  alternatives_korean:
  - 두 마음으로
  - 분열된 마음으로
  - 이중적인 마음으로
  lexicon: HALOT
  rationale: 직역인 '마음과 마음'을 본문에 두어 히브리어 관용구의 이미지를 보존하고, 분열·이중성의 해석은 바로 읽히도록 했습니다.
