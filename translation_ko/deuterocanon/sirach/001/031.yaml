  lexicon: HALOT
  rationale: 단순한 발화의 거짓말보다 야훼에 대한 태도와 삶의 진실성 전체를 겨냥한 표현이므로, '거짓되지 말고'로 넓은 윤리적 함의를 살렸습니다.
- source_word: בְּבְּיִרְאַת יְהֹוָה
  english_pob_choice: in the fear of Yahweh
  chosen_korean: 야훼에 대한 두려움에서
  alternatives_korean:
  - 야훼를 두려워하는 가운데
  - 야훼에 대한 경외 속에서
  lexicon: HALOT
  rationale: 히브리어의 יראה는 '두려움'과 '경외'를 함께 담지만, 여기서는 지혜 전승의 관용구를 유지하면서도 직역성을 위해 '야훼에 대한 두려움'으로 옮겼습니다.
- source_word: וְאַל תִּקְרַב אֵלָיו
  english_pob_choice: and do not draw near to him
  chosen_korean: 그에게 가까이 나아가지 마십시오
  alternatives_korean:
  - 그에게 다가가지 마십시오
  - 그에게 접근하지 마십시오
  lexicon: HALOT
  rationale: קרב의 '가까이 다가가다'를 살리되, 한국어에서 관계적·예배적 접근의 뉘앙스를 모두 담을 수 있도록 했습니다.
- source_word: בְּלֵב וָלֵב
  english_pob_choice: with a divided heart
  chosen_korean: 마음과 마음으로
  alternatives_korean:
  - 두 마음으로
  - 분열된 마음으로
  - 이중적인 마음으로
  lexicon: HALOT
  rationale: 직역인 '마음과 마음'을 본문에 두어 히브리어 관용구의 이미지를 보존하고, 분열·이중성의 해석은 바로 읽히도록 했습니다.
