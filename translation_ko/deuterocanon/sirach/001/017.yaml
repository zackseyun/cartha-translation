base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/001/017.yaml
  text: All her storehouses she fills with delight[b][a], and her granaries with her produce.
  footnotes:
  - marker: a
    text: Hebrew reads, 'Her whole storehouse fills with delight, and her granaries with her produce.' The Greek witness instead reads, 'The crown of wisdom is the fear of the Lord, blossoming with peace and healing health.'
    reason: textual_variant
  - marker: b
    text: Or 'preciousness,' 'pleasant things,' or 'desirable things' for 'delight.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그녀는 자신의 모든 창고를 기쁨[b]으로 채우고, 자신의 곳간들을 자신의 소출로 채웁니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 “그녀는 자신의 모든 창고를 기쁨으로 채우고, 자신의 곳간들을 자신의 소출로 채운다”라고 읽습니다. 그리스어 전승은 “지혜의 관은 주님을 경외함이니, 평화와 치유의 건강으로 꽃핀다”라고 읽습니다.
    reason: textual_variant
  - marker: b
    text: ‘기쁨’은 ‘귀한 것’, ‘바람직한 것’, ‘즐거운 것’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל אוֹצָרֶיהָ
  english_pob_choice: All her storehouses
  chosen_korean: 그녀의 모든 창고를
  alternatives_korean:
  - 그녀의 모든 곳간을
  - 그녀의 모든 저장고를
  lexicon: HALOT
  rationale: אוֹצָר은 보물창고보다 저장·보관의 의미가 강하므로, 앞의 곳간들과 병렬이 살아나는 ‘창고’를 택했습니다. כָּל은 ‘모든’으로 직접 반영했습니다.
- source_word: תְּמַלֵּא חֶמְדָּה
  english_pob_choice: she fills with delight
  chosen_korean: 기쁨으로 채우고
  alternatives_korean:
  - 즐거움으로 채우고
  - 사모할 만한 것들로 채우고
  - 귀한 것으로 채우고
  lexicon: HALOT
  rationale: חֶמְדָּה는 ‘기쁨, 바람직한 것, 귀한 것’의 범위를 가지므로, 본문 흐름상 긍정적 충만을 자연스럽게 드러내는 ‘기쁨’으로 옮겼습니다.
- source_word: וַאֲסָמֶיהָ בִּתְבוּאָתָהּ
  english_pob_choice: and her granaries with her produce
  chosen_korean: 그녀의 곳간들을 그 소출로 채웁니다
  alternatives_korean:
  - 그녀의 곳간들을 그녀의 수확으로 채웁니다
  - 그녀의 곡물창고들을 그 산물로 채웁니다
  lexicon: HALOT
  rationale: אָסָם은 곡물 저장고, 곳간의 뜻이므로 ‘곳간들’이 가장 자연스럽습니다. תְּבוּאָה는 수확물, 소출, 산물을 뜻하므로 농경적 이미지를 살리는 ‘소출’로 옮겼습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행문의 큰 차이
  chosen_reading: 히브리어 본문을 본문으로 번역하고, 그리스어 전승은 주석으로만 보존합니다.
  alternative_readings:
  - 그리스어를 따라 ‘지혜의 관은 주를 두려워함이니, 평강과 치유의 건강으로 꽃핀다’로 옮김
  rationale: 이 절은 히브리어와 그리스어가 내용상 크게 달라 통합 번역이 불가능합니다. 시락서는 살아 있는 히브리어 본문을 우선하되, 중대한 전승 차이는 숨기지 않고 주석으로 드러내는 것이 적절합니다.
  doctrine_reference: 'PHILOSOPHY.md: 살아 있는 히브리어 본문 우선, 중대한 본문 차이는 보존'
