base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/001/028.yaml
  text: Do not be hypocritical in the mouths of men[a], and watch your lips.
  footnotes:
  - marker: a
    text: Or, more idiomatically, 'before people' or 'among people.' The Greek literally says 'in the mouths of men.'
    reason: lexical_alternative
  - marker: b
    text: The extant Hebrew line in the supplied witness reads, 'Hear all my words and do them, and you will be written in the book of life,' which appears mismatched to this verse; the translation therefore follows the Greek text here.
    reason: textual_variant
translation:
  language: ko
  text: 사람들 앞에서 위선적이지 말고, 당신의 입술을 지키십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 좀 더 관용적으로는 '사람들 앞에서' 또는 '사람들 가운데서'로 옮길 수 있습니다. 그리스어는 문자적으로 '사람들의 입 안에서'라고 합니다.
    reason: alternative_reading
  - marker: b
    text: 제공된 히브리어 본문은 '내 모든 말을 듣고 행하라, 그러면 생명책에 기록될 것이다'로 읽히며, 이 절과 맞지 않아 그리스어 본문을 따랐습니다.
    reason: textual_variant
lexical_decisions:
- source_word: μὴ ὑποκριθῇς
  english_pob_choice: Do not be hypocritical
  chosen_korean: 위선적이지 말고
  alternatives_korean:
  - 위선자가 되지 말고
  - 가식적이지 말고
  - 위선하지 말고
  lexicon: BDAG
  rationale: ὑποκρίνομαι의 금지형으로, 겉과 속이 다른 태도와 꾸밈을 경계하는 뜻을 한국어의 자연스러운 형용사 표현으로 옮겼습니다.
- source_word: ἐν στόμασιν ἀνθρώπων
  english_pob_choice: in the mouths of men
  chosen_korean: 사람들 앞에서
  alternatives_korean:
  - 사람들의 입에서
  - 사람들 가운데서
  - 사람들의 말 속에서
  lexicon: LSJ
  rationale: 직역하면 '사람들의 입 안에서'이지만, 의미상 공개된 인간 관계와 말의 장면을 가리키므로 한국어에서는 자연스러운 관용으로 옮기되, 지나치게 평탄화하지는 않았습니다.
- source_word: πρόσεχε
  english_pob_choice: watch your lips
  chosen_korean: 당신의 입술을 지키십시오
  alternatives_korean:
  - 입술을 주의하십시오
  - 입술을 살피십시오
  - 입술을 지키십시오
  lexicon: BDAG
  rationale: πρόσεχε는 '주의하다/살피다'보다 경계하며 지키라는 뉘앙스가 있어, 뒤의 '입술'과 함께 말조심의 윤리를 분명히 드러내는 표현을 택했습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 본문의 불일치
  chosen_reading: 이 절은 주어진 히브리어 증언이 다른 구절과 맞지 않으므로, 이곳에서는 그리스어 본문을 따라 번역했습니다.
  alternative_readings:
  - 히브리어의 '내 모든 말을 듣고 행하라… 생명책에 기록될 것이다'를 따름
  rationale: 제공된 히브리어는 'major_mismatch'로 표시되어 있으며, 구체적 문구도 Sirach 1:28의 그리스어와 대응하지 않습니다. 따라서 본문 충실성과 투명성을 위해 그리스어를 기본 본문으로 삼는 것이 옳습니다.
  doctrine_reference: 'PHILOSOPHY.md: 히브리어가 온전할 때는 히브리어를 따르되, 이 구절처럼 히브리어가 불일치할 때는 그리스어를 따라야 합니다.'
