translation:
  language: ko
  text: 그분은 자신의 뜻대로 그것을 온갖 육체 위에 부어 주셨고, 그것을 자기를 사랑하는 이들에게 주셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 전승의 표면형은 '주셨다'에 가깝지만, 그리스어 병행본문이 '부어 내리다'를 지지하므로 여기서는 그 의미를 따랐습니다.
    reason: textual_variant
lexical_decisions:
- source_word: אֶל כָּל בָּשָׂר
  english_pob_choice: upon all flesh
  chosen_korean: 온갖 육체 위에
  alternatives_korean:
  - 모든 육체에
  - 모든 사람에게
  - 온갖 사람 위에
  lexicon: HALOT
  rationale: 히브리어 관용구의 범위를 살리면서도, POB가 영어에서 택한 'upon'의 이미지를 한국어에서 자연스럽게 반영하기 위해 '위에'를 썼습니다. '육체'는 'flesh'의 직역을 보존해 본문이 지닌 우주적·포괄적 뉘앙스를 흐리지 않습니다.
- source_word: כִּרְצוֹנוֹ
  english_pob_choice: according to his will
  chosen_korean: 자신의 뜻대로
  alternatives_korean:
  - 자신의 의지에 따라
  - 자신이 원하시는 대로
  - 자신의 마음대로
  lexicon: HALOT
  rationale: רָצוֹן은 뜻, 기쁨, 의지를 가리킬 수 있지만, 여기서는 신적 의도성을 드러내는 '뜻'이 가장 적절합니다. '자신의 뜻대로'는 과도하게 일상적이거나 자의적인 뉘앙스를 피하면서도 원문 의미를 분명히 전달합니다.
- source_word: נְתָנָהּ
  english_pob_choice: He poured her out
  chosen_korean: 부어 주셨고
  alternatives_korean:
  - 주셨고
  - 쏟아 주셨고
  - 퍼부으셨고
  lexicon: HALOT
  rationale: 히브리어 표면형은 '주다' 계열이지만, POB가 그리스어 병행본문의 '부어 내리다'를 따라 첫 절의 동사를 해석하므로 한국어도 그 이미지가 살아나야 합니다. 다만 문맥상 '그것'—지혜를 가리키는 여성형 대명사—를 자연스럽게 받게 하기 위해 '부어 주셨고'로 옮겼습니다.
- source_word: וַיִּתְּנָהּ
  english_pob_choice: and he gave her
  chosen_korean: 그것을 … 주셨습니다
  alternatives_korean:
  - 그것을 … 내주셨습니다
  - 그것을 … 허락하셨습니다
  - 그것을 … 베푸셨습니다
  lexicon: HALOT
  rationale: 두 번째 절은 히브리어 동사 '주다'를 직설적으로 반영하는 것이 가장 분명합니다. 영어 POB의 'gave'를 따라, 앞 절과의 대비를 살리되 한국어에서는 반복을 약간 정리해 문장을 매끄럽게 했습니다.
- source_word: לְאֹהֲבָיו
  english_pob_choice: to those who love him
  chosen_korean: 자기를 사랑하는 이들에게
  alternatives_korean:
  - 그를 사랑하는 이들에게
  - 그분을 사랑하는 이들에게
  - 자신을 사랑하는 자들에게
  lexicon: HALOT
  rationale: 히브리어 분사형은 단순한 감정이 아니라 관계적·언약적 사랑을 가리킵니다. 한국어에서는 '자기를 사랑하는 이들'이 가장 자연스럽고, 이어지는 수혜 대상을 부드럽게 드러냅니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행본문의 첫 절 동사 차이
  chosen_reading: 첫 절은 그리스어가 지지하는 '부어 주셨고'를 따르되, 둘째 절과 '육체' 표현은 히브리어 본문 구조를 유지했습니다.
  alternative_readings:
  - 그분은 자신의 뜻대로 그것을 온갖 육체 위에 주셨고, 그것을 자기를 사랑하는 이들에게 주셨습니다.
  rationale: 이 절은 전승상 불안정하므로, POB의 방침대로 히브리어가 남아 있는 구조는 보존하되 첫 동사는 그리스어 병행본문이 지지하는 의미를 반영하는 편이 더 정직합니다. 이렇게 하면 텍스트 불확실성을 지우지 않으면서도 지혜가 퍼져 나가는 이미지를 유지할 수 있습니다.
  doctrine_reference: 'PHILOSOPHY.md: translate from Hebrew where it survives; use parallel Greek as actual translation input; preserve source uncertainty honestly.'
