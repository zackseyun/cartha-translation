translation:
  language: ko
  text: 야훼를 경외하는 것이 지혜의 시작이며, 지혜는 자신의 풍성한 소출로 사람을 만족시킵니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 본문은 크게 달라서, “그는/그것은 지식과 통찰을 비처럼 쏟아 붓고, 그녀를 붙드는 이들의 영광을 높였다”라고 합니다.
    reason: textual_variant
lexical_decisions:
- source_word: רֵאשִׁית
  english_pob_choice: beginning
  chosen_korean: 시작
  alternatives_korean:
  - 처음
  - 첫머리
  - 근본
  lexicon: HALOT
  rationale: 지혜 격언의 정형구로서 ‘시작’이 자연스럽고, 단순한 시간적 개시를 넘어 지혜의 출발점이라는 뜻을 잘 드러냅니다.
- source_word: יִרְאַת יְהֹוָה
  english_pob_choice: the fear of Yahweh
  chosen_korean: 야훼를 경외하는 것
  alternatives_korean:
  - 야훼에 대한 두려움
  - 여호와를 경외하는 것
  - 주님을 경외하는 것
  lexicon: HALOT
  rationale: 히브리어의 관용구를 그대로 살리되, 단순한 공포보다 경외를 함께 담는 ‘경외하는 것’으로 옮겼습니다. POB의 ‘Yahweh’ 표기를 따라 ‘야훼’를 유지합니다.
- source_word: וּתְרַוֵּה
  english_pob_choice: she fills one / satisfies
  chosen_korean: 사람을 만족시킵니다
  alternatives_korean:
  - 충만하게 합니다
  - 흠뻑 적십니다
  - 채웁니다
  lexicon: HALOT
  rationale: 동사의 풍성하게 채우는 이미지를 한국어에서는 자연스러운 결과 표현인 ‘만족시킵니다’로 옮겼습니다. 원문의 충만함은 뒤의 ‘풍성함’으로 보존했습니다.
- source_word: בְּרֹב תְּבוּאָתָהּ
  english_pob_choice: with the abundance of her produce
  chosen_korean: 그 소출의 풍성함으로
  alternatives_korean:
  - 그 열매의 많음으로
  - 그 수확의 풍성함으로
  - 그 소출의 많음으로
  lexicon: HALOT
  rationale: ‘תְּבוּאָה’는 농경적 ‘소출/산출’에 가까워 ‘소출’로 옮겼고, 여성형 접미사는 앞의 의인화된 지혜를 가리키는 것으로 이해해 ‘그’로 처리했습니다.
theological_decisions:
- issue: 야훼 경외와 지혜의 관계
  chosen_reading: ‘경외하는 것’과 ‘시작’의 결합을 그대로 유지해, 지혜의 출발점이 하나님에 대한 올바른 경외라는 점을 분명히 했습니다.
  alternative_readings:
  - ‘야훼를 존경하는 것’으로 완화
  - ‘지혜의 근본 원리’로 의역
  rationale: 본문은 지혜의 기초를 단순한 태도나 교훈이 아니라 야훼를 향한 경외에 둡니다. 이를 약화시키지 않기 위해 관용구를 직역에 가깝게 보존했습니다.
  doctrine_reference: 지혜문학의 표준 명제(잠언 1:7 병행)
