  rationale: 문맥상 הספר הזה כולו는 책의 전체 범위를 가리키므로 ‘이 책 전체’가 가장 자연스럽고 원문의 총체성을 그대로 살립니다.
- source_word: מָלֵא מִמֶּנָּה
  english_pob_choice: is full of it
  chosen_korean: 그것으로 가득합니다
  alternatives_korean:
  - 그것이 가득합니다
  - 그것으로 충만합니다
  lexicon: BDB
  rationale: מלא + מן은 ‘~으로 가득하다’의 감각을 가지므로, 지시대명사 ‘그것’으로 앞선 지혜를 받게 하여 의미 관계를 분명히 했습니다.
- source_word: אֱנוֹשׁ יִשְׁמַע וְיַעֲשֶׂה
  english_pob_choice: the person who will hear and do
  chosen_korean: 주의를 듣고 행하는 사람
  alternatives_korean:
  - 듣고 행하는 사람
  - 들어 행하는 사람
  lexicon: BDB
  rationale: אֱנוֹשׁ는 일반적인 ‘사람’으로 옮기고, יִשְׁמַע וְיַעֲשֶׂה는 지혜문학의 표준적 반응인 ‘듣고 행하다’로 풀어 자연스러운 한국어 문장으로 만들었습니다.
- source_word: אַשְׁרֵי
  english_pob_choice: blessed is
  chosen_korean: 복됩니다
  alternatives_korean:
  - 복이 있습니다
  - 복되다
  lexicon: BDB
  rationale: אַשְׁרֵי의 선언적 복을 현대 합쇼체에서 간결하게 살리기 위해 ‘복됩니다’를 택했습니다.
theological_decisions:
- issue: 시편/지혜문학식 복 선언의 한국어 톤
  chosen_reading: ‘복됩니다’로 선언형 복을 유지했습니다.
  alternative_readings:
