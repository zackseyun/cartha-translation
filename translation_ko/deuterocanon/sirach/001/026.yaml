  rationale: אַשְׁרֵי는 단순 상태 진술보다 공동체에 대한 축복 선언의 힘이 있으므로, 현대 문체 안에서도 선언성을 유지했습니다.
  doctrine_reference: 지혜문학의 복 선언 표현
