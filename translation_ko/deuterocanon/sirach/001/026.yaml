translation:
  language: ko
  text: 지혜와 교훈은 주님을 경외함이며,[a] 그분이 기뻐하시는 것은 믿음과 온유함입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 현존하는 히브리어 전승은 이 절의 어구와 일치하지 않는 것으로 표시되어 있습니다. 따라서 본문은 그리스어 본문을 따릅니다.
    reason: textual_variant
  - marker: b
    text: 또는 ‘그분의 기쁨은 신실함과 온유함입니다.’ 그리스어 πίστις는 ‘신실함’ 또는 ‘신뢰’로도, πρᾳότης는 ‘온유함’ 또는 ‘부드러움’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַסֵּפֶר הַזֶּה כֻּלּוֹ
  english_pob_choice: This whole book
  chosen_korean: 이 책 전체
  alternatives_korean:
  - 이 책 모두
