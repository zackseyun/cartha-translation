translation:
  language: ko
  text: 그 뿌리는 영원하며, 그 가지는 장수입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 ‘성난 사람은 의롭다 하심을 받을 수 없습니다’라고 읽습니다. 이 절은 히브리어와 그리스어 전승이 크게 다릅니다.
    reason: textual_variant
  - marker: b
    text: ‘장수’는 ‘날들의 길이’의 관용적 의미입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁרְשֶׁיהָ
  english_pob_choice: its roots
  chosen_korean: 그 뿌리
  alternatives_korean:
  - 그 뿌리들
  - 그 근원
  lexicon: HALOT
  rationale: 3인칭 여성 단수 접미사가 붙은 ‘roots’를 한국어에서는 자연스럽게 ‘그 뿌리’로 옮겼습니다. 앞선 문맥의 지혜/여호와를 가리키는 여성형 연결을 굳이 한국어에서 드러내지 않고도 이미지가 유지됩니다.
- source_word: לְעוֹלָם
  english_pob_choice: forever
  chosen_korean: 영원하며
  alternatives_korean:
  - 영원히
  - 끝없이
  lexicon: HALOT
  rationale: 지속성과 영속성을 나타내는 표현으로, 시적 평행을 살리면서도 현대 한국어에서 자연스럽게 읽히는 ‘영원하며’를 택했습니다.
- source_word: וַעֲנָפֶיהָ
  english_pob_choice: and its branches
  chosen_korean: 그 가지는
  alternatives_korean:
  - 그 넓은 가지는
  - 그 가지들이
  lexicon: HALOT
  rationale: ענף는 가지/큰 가지를 뜻하므로, 뿌리와의 식물 이미지 평행을 살려 ‘가지’로 옮겼습니다.
- source_word: אֹרֶךְ יָמִים
  english_pob_choice: length of days
  chosen_korean: 장수
  alternatives_korean:
  - 날들의 길이
  - 오랜 생명
  lexicon: HALOT
  rationale: 직역하면 ‘날들의 길이’이지만, 한국어에서는 관용적 의미인 ‘장수’가 더 분명하게 시의 뜻을 전달합니다. 다만 이는 의미를 약화시키지 않는 범위의 자연화입니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행문의 중대한 불일치
  chosen_reading: 현존하는 히브리어의 시적 두 행을 본문으로 옮겼습니다.
  alternative_readings:
  - 그리스어를 따라 ‘성난 사람은 의롭다 하심을 받을 수 없습니다’로 옮김
  rationale: 이 절은 히브리어와 그리스어가 단순한 어순 차이가 아니라 서로 다른 문장을 전합니다. 시락서 번역 원칙상 살아 있는 히브리어 본문을 우선하되, 그리스어의 상이한 전승은 주석 각주로 투명하게 보존하는 것이 타당합니다.
  doctrine_reference: 'PHILOSOPHY.md: 히브리어가 보존된 곳에서는 히브리어를 우선하고, 중대한 전승 차이는 숨기지 않는다.'
