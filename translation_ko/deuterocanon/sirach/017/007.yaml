  lexicon: LSJ
  rationale: τίθημι의 구체적 동작감을 살리면서, 뒤의 목적절을 이끄는 연결을 자연스럽게 표현했습니다.
- source_word: τὸν ὀφθαλμὸν αὐτοῦ
