  - 자기 행적의 عظ대함
  - 자기 일들의 장엄함
  lexicon: LSJ
  rationale: μεγαλεῖον을 추상명사 ‘위대함’으로 옮겨 ‘works’와의 결합을 유지하고, ἔργα는 하나님의 행위를 넓게 가리키는 ‘행위들’로 번역했습니다.
theological_decisions:
- issue: 하나님에 대한 인체 비유를 얼마나 그대로 유지할지
  chosen_reading: ‘자기 눈을 그들의 마음 위에 두셔서’로 직역에 가깝게 유지했습니다.
  alternative_readings:
  - 그들의 마음을 살피셔서
  - 그들의 마음에 주의를 기울이셔서
  rationale: 원문은 단수 ‘눈’과 ‘두다’의 구체적 이미지를 사용하므로, 이를 추상화하면 의도된 인류학적·신학적 긴장이 약해집니다.
