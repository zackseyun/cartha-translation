- source_word: ἐπὶ τὰς καρδίας αὐτῶν
  english_pob_choice: upon their hearts
  chosen_korean: 그들의 마음 위에
  alternatives_korean:
  - 그들의 심장 위에
  - 그들의 마음에
  - 그들의 속사람 위에
  lexicon: LSJ
  rationale: καρδία의 내적 인간을 가리키는 의미를 ‘마음’으로 옮기되, ἐπί의 공간적 이미지를 살려 ‘위에’를 보존했습니다.
- source_word: τὸ μεγαλεῖον τῶν ἔργων αὐτοῦ
  english_pob_choice: the greatness of his works
  chosen_korean: 자기 행위들의 위대함
