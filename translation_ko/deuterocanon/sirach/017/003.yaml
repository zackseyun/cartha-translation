lexical_decisions:
- source_word: ἐνέδυσεν
  english_pob_choice: clothed
  chosen_korean: 입히셨고
  alternatives_korean:
  - 옷 입히셨고
  - 덧입히셨고
  - 둘러주셨고
  lexicon: LSJ
  rationale: 동사 ἐνέδυσεν의 기본 뜻인 ‘입히다/옷 입히다’를 살려, ‘힘’을 단순히 주었다고 평평하게 만들지 않고 은유를 유지했습니다.
- source_word: ἰσχύν
  english_pob_choice: strength
  chosen_korean: 힘
  alternatives_korean:
  - 강함
  - 능력
  - 강력
  lexicon: LSJ
  rationale: ἰσχύς는 문맥상 인간에게 입혀진 내적 역량을 가리키므로, 현대 한국어에서 가장 자연스럽고 포괄적인 ‘힘’으로 옮겼습니다.
- source_word: κατ᾿ εἰκόνα αὐτοῦ
  english_pob_choice: according to his image
  chosen_korean: 자신의 형상에 따라
  alternatives_korean:
  - 자신의 형상대로
  - 그의 형상 안에서
  - 그의 형상에 따라
  lexicon: LSJ
  rationale: κατά + 대격의 구조를 살려 ‘...에 따라’로 옮겼고, 창세기 창조 언어와의 연결을 드러내기 위해 ‘형상’을 유지했습니다.
- source_word: ἐποίησεν
  english_pob_choice: made
  chosen_korean: 만드셨습니다
  alternatives_korean:
  - 지으셨습니다
  - 창조하셨습니다
  - 만드셨습니다
  lexicon: LSJ
  rationale: ποιέω는 넓게 ‘만들다/하다’의 뜻이므로, 여기서는 과도한 신학적 특정화를 피하면서도 자연스러운 ‘만드셨습니다’를 택했습니다.
theological_decisions:
- issue: 창세기적 인간 형상 언어의 보존
  chosen_reading: ‘자신의 형상에 따라’로 옮겨, 인간이 하나님의 형상과 관련된 방식으로 지음 받았다는 연결을 드러냈습니다.
  alternative_readings:
  - ‘그의 형상 안에서’
  - ‘그의 형상대로’
  rationale: 본문은 창세기의 창조 언어를 분명히 반향하므로, 관계적 의미를 흐리지 않으면서도 κατά + 대격의 문법을 반영하는 번역이 가장 적절합니다.
  doctrine_reference: DOCTRINE.md §§1, 3, 6
