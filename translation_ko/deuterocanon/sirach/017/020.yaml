theological_decisions:
- issue: ἐπάνοδος의 신학적 범위
  chosen_reading: ‘돌아올 길’로 번역해 회개 응답의 방향성은 살리되, 그 길이 하나님께로의 귀환인지 혹은 회복인지 단정하지 않았습니다.
  alternative_readings:
  - 회복
  - 되돌아옴
  - 다시 돌아감
  rationale: 원문 자체가 짧고 압축적이어서, 문맥이 허용하는 의미의 폭을 유지하는 편이 사본과 해석의 긴장을 더 잘 보존합니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
- issue: ὑπομονήν과 παρακαλέω의 결합
  chosen_reading: ‘인내를 잃어가는 이들을 권면하셨습니다’로 옮겨, 인내가 권면의 내용인지 혹은 받는 이들의 상태인지 지나치게 확정하지 않았습니다.
  alternative_readings:
  - 인내하도록 권면하셨습니다
  - 인내 가운데 격려하셨습니다
  - 인내로써 위로하셨습니다
  rationale: 영문 POB도 이 구문을 여러 방식으로 읽을 수 있다고 주석하며, 헬라어 역시 압축되어 있어 한국어에서도 해석의 여지를 남기는 것이 적절합니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
