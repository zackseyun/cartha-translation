translation:
  language: ko
  text: 그러나 회개하는 이들에게는 돌아올 길을 주셨고, 인내를 잃어가는 이들을 권면하셨습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “인내하도록 권면하셨다.” 헬라어 표현이 매우 압축되어 있어, 이 부분은 여러 방식으로 이해될 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: “돌아올 길”은 “돌아감” 또는 “회복”으로도 이해할 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 이 구절의 헬라어 본문에는 소스 검증상 불일치가 표시되어 있으므로, 정확한 표현에는 다소 유보가 필요하지만 전체 의미는 분명합니다.
    reason: textual_variant
