theological_decisions:
- issue: 인간에게 부여된 피조물 통치의 표현
  chosen_reading: ‘다스리게 하셨습니다’로 옮겨 인간에게 주어진 권위를 분명히 드러냈습니다.
  alternative_readings:
  - ‘지배하게 하셨습니다’
  - ‘통치하게 하셨습니다’
  rationale: 문맥은 인간이 짐승과 새를 다스리도록 맡겨진 창조 질서를 말하므로, 과도하게 폭력적인 인상을 줄 수 있는 ‘지배하다’보다 성경적 문맥에 맞는 ‘다스리다’가 더 균형적입니다.
  doctrine_reference: DOCTRINE.md §Creation and humanity
