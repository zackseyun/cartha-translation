translation:
  language: ko
  text: 그는 그들을 분별의 지식으로 채우시고, 그들에게 선한 것과 악한 것을 보여 주셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘좋은 것들과 나쁜 것들’. 그리스어는 도덕적 범주 또는 유익한 것과 해로운 것을 가리킬 수 있으나, 문맥은 도덕적 분별을 더 강하게 시사합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιστήμην συνέσεως
  english_pob_choice: knowledge of understanding
  chosen_korean: 이해의 지식
  alternatives_korean:
  - 지혜의 지식
  - 깨달음의 지식
  - 분별의 지식
  lexicon: BDAG
  rationale: ἐπιστήμην과 συνέσεως를 분리된 두 항목으로 늘리기보다, 지식이 이해와 결합된 상태를 간결하게 살려서 '이해의 지식'으로 옮겼습니다.
- source_word: ἐνέπλησεν
  english_pob_choice: filled
  chosen_korean: 가득 채우시고
  alternatives_korean:
  - 채우셨고
  - 가득하게 하셨고
  lexicon: BDAG
  rationale: 완전한 충만을 나타내는 동사로서 '가득 채우시고'가 문맥상 가장 자연스럽고 강합니다.
- source_word: ἀγαθὰ καὶ κακὰ
  english_pob_choice: good and evil
  chosen_korean: 선한 것과 악한 것
  alternatives_korean:
  - 좋은 것과 나쁜 것
  - 선과 악
  lexicon: BDAG
  rationale: 문맥의 도덕적 분별을 살리되, 추상명사 '선과 악'보다 헬라어 중성 복수의 대상성을 반영하는 '선한 것과 악한 것'을 택했습니다.
- source_word: ὑπέδειξεν αὐτοῖς
  english_pob_choice: showed them
  chosen_korean: 그들에게 보여 주셨습니다
  alternatives_korean:
  - 그들에게 가리켜 보이셨습니다
  - 그들에게 나타내 보이셨습니다
  lexicon: BDAG
  rationale: ὑπέδειξεν의 '보여 주다, 가리키다'의 의미를 살리면서도 한국어에서 자연스러운 서술로 옮겼습니다.
theological_decisions:
- issue: ἀγαθὰ καὶ κακὰ를 도덕 범주로 읽을지, 유익/해로운 것들로 읽을지
  chosen_reading: 도덕적 분별로 읽어 '선한 것과 악한 것'으로 번역했습니다.
  alternative_readings:
  - 유익한 것과 해로운 것
  - 좋은 것과 나쁜 것
  rationale: 이 절은 하나님이 인간에게 분별 능력을 주셨다는 맥락이므로, 단순한 실용적 유익/해로움보다 도덕적 인식의 대비가 더 직접적입니다.
  doctrine_reference: 본문의 긴장을 유지하고, 원문이 허용하는 의미를 좁히지 않음
