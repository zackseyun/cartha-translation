translation:
  language: ko
  text: 그들의 눈은 장엄한 영광을 보았고, 그들의 귀는 그들의 음성의 영광을 들었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 전승된 그리스어는 문자적으로 ‘그들의 귀는 그들의 음성의 영광을 들었다’라고 읽습니다. 이 표현은 난해합니다. 문맥상 이를 하나님의 음성의 영광으로 이해할 수 있으나, 본문에는 전승된 소유격을 보존했습니다.
    reason: textual_variant
lexical_decisions:
- source_word: μεγαλεῖον δόξης
  english_pob_choice: majestic glory
  chosen_korean: 장엄한 영광
  alternatives_korean:
  - 위대한 영광
  - 찬란한 영광
  - 장대한 영광
  lexicon: LSJ
  rationale: μεγαλεῖον은 δόξης를 수식하는 형태로, 단순한 크기보다 위엄과 장엄함을 드러냅니다. '장엄한'은 한국어에서도 자연스럽고, 영광의 현현적 뉘앙스를 살립니다.
- source_word: οἱ ὀφθαλμοὶ αὐτῶν
  english_pob_choice: their eyes
  chosen_korean: 그들의 눈
  alternatives_korean:
  - 그 눈
  - 그들이
  lexicon: LSJ
  rationale: 원문이 신체 기관을 명시하므로, '그들의 눈'으로 직역적 대칭을 유지해 뒤의 '귀'와 병렬 구조를 살렸습니다.
- source_word: δόξαν φωνῆς αὐτῶν
  english_pob_choice: the glory of his voice
  chosen_korean: 그의 음성의 영광
  alternatives_korean:
  - 그 음성의 영광
  - 그 목소리의 영광
  - 영광스러운 음성
  lexicon: LSJ
  rationale: δόξα를 반복 보존하면서도 한국어에서 가장 자연스러운 소유격 구조로 옮겼습니다. EN POB의 판단처럼 문맥상 하나님의 음성으로 이해되는 점을 반영해 '그의'로 옮겼습니다.
- source_word: τὸ οὖς
  english_pob_choice: ears
  chosen_korean: 귀
  alternatives_korean:
  - 귀들
  - 한 귀
  lexicon: LSJ
  rationale: 그리스어 단수 '귀'를 한국어 관용에 맞게 복수 대상을 가리키는 '귀'로 옮겨, 눈/귀의 평행을 유지했습니다.
theological_decisions:
- issue: 마지막 절의 소유 대명사와 본문 난점
  chosen_reading: 문맥상 하나님의 음성으로 이해하여 '그의 음성의 영광'으로 번역하되, 원문 난점을 숨기지 않습니다.
  alternative_readings:
  - 그들의 음성의 영광
  - 그 음성의 영광
  rationale: 전승된 그리스어는 αὐτῶν이 두 번 반복되어 직역하면 어색합니다. 그러나 본문은 계시를 받는 장면이므로, 문맥상 하나님의 음성으로 읽는 해석을 본문에 반영하되, 해석상의 긴장을 유지했습니다.
  doctrine_reference: 본문 비평적 난점을 정직하게 보존하고, 문맥적 해석을 조심스럽게 반영합니다.
