  yaml_path: translation/deuterocanon/sirach/017/012.yaml
  text: Their eyes saw a majestic glory[a], and their ears heard the glory of his voice.
  footnotes:
  - marker: a
    text: 'Greek: ''their ears heard the glory of their voice.'' The transmitted text is difficult; the main rendering takes the sense to be God''s voice in context.'
