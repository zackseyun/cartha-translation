  - 임명된 때
  lexicon: LSJ
  rationale: καιρός의 핵심인 ‘배정되거나 정해진 시기’를 자연스러운 한국어로 옮겼습니다.
- source_word: ἐξουσίαν
  english_pob_choice: authority
  chosen_korean: 권한
  alternatives_korean:
  - 권세
  - 권위
  - 통치권
  lexicon: BDAG
  rationale: 단순한 힘보다 위임된 통제권과 권리를 드러내는 말로 ‘권한’을 선택했습니다.
- source_word: τῶν ἐπ᾿ αὐτῆς
  english_pob_choice: the things on it
  chosen_korean: 그 위에 있는 것들
  alternatives_korean:
  - 그 위의 것들
  - 그것 위에 있는 것들
  - 땅 위에 있는 것들
  lexicon: LSJ
  rationale: 앞선 절의 ‘땅’을 가리키는 암시를 살리되, 헬라어의 생략된 지시를 한국어에서도 과도하게 풀지 않기 위해 이렇게 옮겼습니다.
theological_decisions:
- issue: 인간에게 주어진 지배의 범위
  chosen_reading: 하나님이 인간에게 날수와 때를 정해 주시고, 그 위에 있는 것들에 대한 위임된 권한을 주신 것으로 읽습니다.
  alternative_readings:
  - 인간이 땅 자체를 절대적으로 소유한다는 뜻
  - 인간이 모든 지상 사물 위에 무제한의 통치를 가진다는 뜻
  rationale: 문맥은 창조 질서 안에서의 청지기적 권한을 말하며, 텍스트가 말하는 범위를 넘는 절대적 소유로 확장하지 않도록 했습니다.
  doctrine_reference: 창조 질서와 청지기직
