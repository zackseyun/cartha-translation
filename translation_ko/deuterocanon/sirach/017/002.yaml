  - marker: b
    text: Or 'an appointed time.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그분은 그들에게 정해진 수의 날들과 정해진 때[b]를 주셨고, 그들에게 그 위에 있는 것들[a]에 대한 권한을 주셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그 위에 있는 것들’입니다. 이 대명사는 앞 절에 나온 ‘땅’을 가리키는 것으로 이해하는 것이 가장 자연스럽습니다.
    reason: cross_reference
  - marker: b
    text: 또는 ‘정해진 시기’.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμέρας ἀριθμοῦ
  english_pob_choice: a fixed number of days
  chosen_korean: 날의 정해진 수
  alternatives_korean:
  - 정해진 수의 날들
  - 계산된 날들
  lexicon: LSJ
  rationale: 날들을 단순히 ‘많은 날’이 아니라 수가 정해진 한정된 기간으로 이해하게 하는 표현을 택했습니다.
- source_word: καιρὸν
