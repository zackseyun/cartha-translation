theological_decisions:
- issue: 인간에게 주어진 지배의 범위
  chosen_reading: 하나님이 인간에게 날수와 때를 정해 주시고, 그 위에 있는 것들에 대한 위임된 권한을 주신 것으로 읽습니다.
  alternative_readings:
  - 인간이 땅 자체를 절대적으로 소유한다는 뜻
  - 인간이 모든 지상 사물 위에 무제한의 통치를 가진다는 뜻
  rationale: 문맥은 창조 질서 안에서의 청지기적 권한을 말하며, 텍스트가 말하는 범위를 넘는 절대적 소유로 확장하지 않도록 했습니다.
  doctrine_reference: 창조 질서와 청지기직
