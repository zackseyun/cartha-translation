  - marker: b
    text: Or 'an appointed time.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그분은 그들에게 날의 정해진 수와 정해진 때를 주셨고, 그들에게 그 위에 있는 것들에 대한 권한을 주셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그 위에 있는 것들’입니다. 이 대명사는 앞 절에 나온 ‘땅’을 가리키는 것으로 이해하는 것이 가장 자연스럽습니다.
    reason: cross_reference
  - marker: b
    text: 또는 ‘정해진 때’.
    reason: lexical_alternative
