  text: Return to the Most High and turn away from unrighteousness[c][b][a], and hate what is abominable intensely.
  footnotes:
  - marker: a
    text: Or 'turn back to the Most High.' The Greek imperative can be rendered with either 'return' or 'turn back,' both expressing repentance and renewed orientation toward God.
    reason: lexical_alternative
  - marker: b
    text: '''Unrighteousness'' may also be rendered ''injustice'' or ''wrongdoing,'' depending on whether the emphasis is taken as broad moral evil or a more specific unjust act.'
    reason: lexical_alternative
  - marker: c
    text: The Greek text in this section of Sirach is the primary witness used here; source validation notes a mismatch in the transmission history of the verse, so the rendering stays closely tied to the extant Greek wording.
    reason: textual_variant
translation:
  language: ko
  text: 지극히 높으신 분께 돌아가고 불의에서 돌아서며, 혐오스러운 것을 몹시 미워하십시오.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘돌아가다’는 ‘돌아오다’나 ‘되돌아가다’로도 옮길 수 있으나, 여기서는 하나님께로의 회심과 방향 전환을 함께 드러내기 위해 선택했습니다.
    reason: lexical_alternative
  - marker: b
    text: ἀδικία는 문맥에 따라 ‘불의’, ‘불의한 행위’, ‘부정의’로도 옮길 수 있지만, 여기서는 지혜문학적 윤리 악을 가리키는 넓은 뜻으로 보았습니다.
    reason: lexical_alternative
  - marker: c
    text: 이 절의 그리스어 본문은 전승상 검증상 이슈가 보고된 구절이므로, 현존 그리스어 표현에 가깝게 번역했습니다.
    reason: textual_variant
lexical_decisions:
- source_word: ἐπάναγε ἐπὶ Ὕψιστον
  english_pob_choice: Return to the Most High
  chosen_korean: 지극히 높으신 분께 돌아가고
  alternatives_korean:
  - 지극히 높으신 분께 돌아서고
  - 지극히 높으신 분께 돌아오고
  lexicon: LSJ
  rationale: ἐπάναγε는 단순한 이동이 아니라 하나님께로의 회심을 부르는 명령이므로, ‘돌아가다’로 방향성과 회개 뉘앙스를 함께 살렸습니다. Ὕψιστον은 ‘지극히 높으신 분’으로 옮겨 칭호성을 유지했습니다.
- source_word: ἀπόστρεφε ἀπὸ ἀδικίας
  english_pob_choice: turn away from unrighteousness
  chosen_korean: 불의에서 돌아서며
  alternatives_korean:
  - 불의에서 멀어지며
  - 불의를 떠나며
  - 불의에서 돌아가며
  lexicon: LSJ
  rationale: ἀπόστρεφε는 지속적이고 윤리적인 방향 전환을 뜻하므로 ‘돌아서다’가 가장 직접적입니다. ἀδικία는 여기서 넓은 도덕적 악을 가리키므로 ‘불의’가 가장 자연스럽고 압축적입니다.
- source_word: σφόδρα μίσησον βδέλυγμα
  english_pob_choice: hate what is abominable intensely
  chosen_korean: 혐오스러운 것을 몹시 미워하십시오
  alternatives_korean:
  - 가증한 것을 극히 미워하십시오
  - 가증한 것을 매우 미워하십시오
  - 혐오할 것을 몹시 미워하십시오
  lexicon: LSJ
  rationale: βδέλυγμα의 강한 혐오·가증의 의미를 살리기 위해 ‘혐오스러운 것’으로 옮겼고, σφόδρα는 현대 한국어에서 자연스러운 강조인 ‘몹시’로 처리했습니다. μίσησον은 약화하지 않고 명령형 ‘미워하십시오’로 유지했습니다.
