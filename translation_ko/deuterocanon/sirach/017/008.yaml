  rationale: 장차의 찬양 행위를 분명하게 드러내는 동사로 옮겼고, 예배적 함의를 지닌 ‘찬양하다’를 택했습니다.
theological_decisions:
- issue: ἁγιασμοῦ의 의미를 ‘거룩함’/‘성결’/‘거룩한’ 중 어떻게 처리할지
  chosen_reading: 문장 전체를 ‘거룩한 이름’으로 읽어, 이름의 성격을 수식하는 형용사적 표현으로 번역했습니다.
  alternative_readings:
  - ‘거룩의 이름’
  - ‘성결의 이름’
  rationale: 영어 POB가 이미 ‘holy name’로 정리한 만큼, 한국어도 의미를 과잉 추상화하지 않고 직접적인 형용사구로 옮기는 것이 문맥상 가장 자연스럽습니다.
  doctrine_reference: 성호칭의 거룩성에 대한 일반 성서적 표현
