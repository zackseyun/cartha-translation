  source_fidelity: 그리스어의 강조된 주어 αὐτός, ‘하늘의 높은 곳의’(ὕψους οὐρανοῦ), ‘살피다’(ἐπισκέπτεται), 그리고 ‘흙과 재’(γῆ καὶ σποδός)는 대체로 충실히 반영되었습니다. δύναμιν을 집합적 천상 존재인 ‘군대/하늘의 군대’로 이해하는 것은 가능한 번역이며, 각주는 ‘권능’의 대안을 적절히 보존합니다.
  naturalness: ‘하늘의 높은 곳의 군대’는 소유격 ‘의’가 연속되어 다소 무겁고 현대 표준 한국어 문장으로 매끄럽지 않습니다. ‘하늘 높은 곳의 군대’가 같은 의미를 더 자연스럽게 전달합니다. αὐτός의 강조는 ‘그분 자신이’보다 ‘친히’가 간결하고 자연스럽습니다.
  terminology: ‘군대’는 성서적 천상 ‘host’를 옮길 수 있으나, 일상적 인간 군대의 뉘앙스를 줄이기 위해 각주에서 ‘천상적 군대’임을 명시하는 것이 좋습니다. ‘모든 사람’은 성별과 무관한 인류 전체를 자연스럽게 나타내며, ‘흙과 재’는 원문의 γῆ를 ‘티끌’로 동화하지 않아 적절합니다.
