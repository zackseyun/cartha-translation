revisions:
- from: 그분 자신이 하늘의 높은 곳의 군대를 살피시며, 모든 사람은 흙과 재입니다.[a][b]
  to: 그분께서 친히 하늘 높은 곳의 군대를 살피시며, 모든 사람은 흙과 재입니다.[a][b]
  rationale: 본문의 해석적 선택(δύναμις를 천상적 군대로 이해함)은 유지하되, 연속 소유격을 자연스러운 한국어 어순으로 조정하고 αὐτός의 강조를 ‘친히’로 간결하게 옮겼습니다. 각주는 δύναμις의 ‘권능/힘’ 의미 가능성과 천상적 집합 의미를 함께 밝혀 원문의 어휘적 여지를 보존합니다.
