base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/017/032.yaml
  text: He himself watches over the host of the height of heaven[b][a], and all men are earth and ashes.
  footnotes:
  - marker: a
    text: Or 'power of the height of heaven.' The Greek δύναμιν can mean 'power' or, in biblical usage, a heavenly 'host.'
    reason: lexical_alternative
  - marker: b
    text: '''All men'' here means all human beings.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그분 자신이 하늘의 높은 곳의 군대를 살피시며, 모든 사람은 흙과 재입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 여기서 δύναμις는 ‘권능’이 아니라 천상적 ‘군대’로도 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘모든 사람’은 모든 인간을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: δύναμιν
  english_pob_choice: host
  chosen_korean: 군대
  alternatives_korean:
  - 권능
  - 힘
  - 군중
  lexicon: LSJ
  rationale: 문맥이 하늘의 높은 곳에 속한 집합적 존재를 가리키므로, ‘권능’보다 천상적 무리를 드러내는 ‘군대’가 POB의 ‘host’ 의도를 더 자연스럽게 받습니다.
- source_word: ὕψους οὐρανοῦ
  english_pob_choice: the height of heaven
  chosen_korean: 하늘의 높은 곳
  alternatives_korean:
  - 하늘의 높음
  - 천상의 높은 곳
  lexicon: LSJ
  rationale: 속격 구조를 직역하되, ‘하늘의 높은 곳’으로 옮겨 하늘의 장엄한 공간성을 보존했습니다.
- source_word: ἐπισκέπτεται
  english_pob_choice: watches over
  chosen_korean: 살피시며
  alternatives_korean:
  - 돌보시며
  - 방문하시며
  - 감찰하시며
  lexicon: BDAG
  rationale: 하나님이 대상 위에 지속적으로 주의를 기울이신다는 뜻을 살리기 위해, 단발적 ‘방문’보다 ‘살피시다’를 선택했습니다.
- source_word: οἱ ἄνθρωποι πάντες
  english_pob_choice: all men
  chosen_korean: 모든 사람
  alternatives_korean:
  - 모든 남자
  - 모든 인간들
  lexicon: BDAG
  rationale: 그리스어의 남성 복수는 일반적 인류를 가리키는 용법이므로, 한국어에서는 대표적 의미를 분명히 하면서도 자연스러운 ‘모든 사람’으로 옮겼습니다.
- source_word: γῆ καὶ σποδός
  english_pob_choice: earth and ashes
  chosen_korean: 흙과 재
  alternatives_korean:
  - 땅과 재
  - 흙과 재더미
  lexicon: LSJ
  rationale: 직역상 ‘earth’는 ‘흙’이 더 자연스럽고, ‘ashes’는 ‘재’가 가장 직접적입니다. 관용구처럼 굳은 ‘티끌과 재’로 바꾸면 원문 어휘의 차이가 희미해집니다.
theological_decisions:
- issue: 하늘의 높은 곳의 ‘δύναμιν’ 의미
  chosen_reading: 천상 질서/무리를 가리키는 집합적 표현으로 이해하고 ‘군대’로 번역했습니다.
  alternative_readings:
  - 권능
  - 힘
  rationale: 이 구절은 하나님이 천상 영역 전체를 주관하신다는 대비를 만들며, 후반절의 인간 연약성과 맞물립니다. 그래서 추상적 ‘권능’보다 집합적 의미가 드러나는 번역을 택했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 5
- issue: οἱ ἄνθρωποι πάντες의 보편성
  chosen_reading: 인류 전체를 뜻하는 일반적 표현으로 보았습니다.
  alternative_readings:
  - 모든 남자
  - 모든 인간
  rationale: 그리스어 남성 복수는 여기서 대표적 포괄 의미를 지니므로, 한국어에서는 성별을 과도하게 드러내지 않으면서 보편적 뜻을 분명히 하는 것이 적절합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
