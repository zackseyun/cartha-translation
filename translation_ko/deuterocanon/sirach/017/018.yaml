  source_fidelity: 후반 절의 συντηρήσει는 능동태 미래 3인칭 단수입니다. 초안의 ‘보존될 것입니다’는 이를 수동태로 바꾸므로 원문의 문법과, 주어가 명시되지 않은 능동 표현의 여지를 모두 제대로 반영하지 못합니다. 한국어에서는 주어를 생략한 능동문으로 그 불확정성을 유지할 수 있습니다. 또한 ἀνδρός와 ἀνθρώπου의 구별을 ‘한 남자’와 ‘사람’으로 반영하는 것이 안전합니다.
  naturalness: ‘한 남자의 구제’와 ‘인장’은 현대의 격식 있는 한국어 성경 문체에서 자연스럽습니다. 주어 없는 ‘보존할 것입니다’는 한국어에서 가능하며, 문맥이 특정 주어를 강제하지 않는 원문의 상태를 보존합니다.
  terminology: ἐλεημοσύνη는 이 문맥에서 구체적인 자비의 베풂을 뜻하므로 ‘구제’가 ‘자선’보다 더 직접적입니다. σφραγίς는 ‘인장’, κόρη는 비유를 살린 ‘눈동자’로 옮길 수 있습니다. 각주 b의 영어 관용구 설명은 한국어 독자에게 직접적인 어휘 설명이 아니므로 그리스어 낱말의 문자적 뜻을 설명하도록 고칩니다.
