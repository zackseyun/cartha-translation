theological_decisions:
- issue: 후반 절의 미래 동사 συντηρήσει의 주어를 어떻게 드러낼지
  chosen_reading: 원문처럼 주어를 드러내지 않고, 일반적 미래로 ‘보존될 것입니다’라고 옮겼습니다.
  alternative_readings:
  - 그가 보존할 것입니다
  - 하나님이 보존하실 것입니다
  rationale: 그리스어는 주어를 명시하지 않으며, 속담적 문체에서 그 공백을 유지하는 편이 원문의 여지를 보존합니다. 영어 POB가 지적하듯 더 넓은 문맥에서 하나님을 암시할 수는 있지만, 이 절 자체는 그 주어를 확정하지 않습니다.
  doctrine_reference: 문맥 가능성은 인정하되, 절 자체의 문법적 불확정성을 유지합니다.
