  text: A man's almsgiving is like a seal with him[b][a], and he will preserve a person's kindness like the pupil of the eye.
  footnotes:
  - marker: a
    text: Or, 'God will preserve a person's kindness like the pupil of the eye.' The Greek verb has no explicit subject; the broader context may suggest God, but the clause itself leaves it unstated.
    reason: alternative_reading
  - marker: b
    text: Literally, 'like the pupil of the eye'; compare the English idiom 'like the apple of the eye.'
    reason: lexical_alternative
translation:
  language: ko
  text: 한 사람의 자선은 그와 함께 있는 인장과 같고, 사람의 친절은 눈동자처럼 보존될 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘사람의 친절을 눈동자처럼 하나님이 보존하실 것입니다.’ 그리스어 동사는 주어를 명시하지 않으므로, 더 넓은 문맥은 하나님을 시사할 수 있지만 절 자체는 주어를 밝히지 않습니다.
    reason: alternative_reading
  - marker: b
    text: 직역하면 ‘눈동자처럼’입니다. 영어 관용구 ‘the apple of the eye’에 해당하는 더 익숙한 표현이지만, 여기서는 신체 비유를 살려 옮겼습니다.
    reason: lexical_alternative
