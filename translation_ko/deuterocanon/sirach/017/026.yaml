lexical_decisions:
- source_word: οὐ γὰρ
  english_pob_choice: For not
  chosen_korean: 왜냐하면 … 않기 때문입니다
  alternatives_korean:
  - 그렇지 않기 때문입니다
  - 왜냐하면 … 없기 때문입니다
  lexicon: BDAG
  rationale: γάρ의 설명적 연결을 살리되, 한국어에서는 문장 첫머리의 인과 접속과 뒤의 이유절을 자연스럽게 살려 번역했습니다.
- source_word: ἐν ἀνθρώποις
