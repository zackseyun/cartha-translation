  yaml_path: translation/deuterocanon/sirach/017/026.yaml
  text: For not everything can be in human beings, because a son of man is not immortal.
  footnotes:
  - marker: a
    text: Or 'a human being is not immortal.' The Greek literally reads 'a son of man,' here a generic expression for a mortal human, not a title.
    reason: lexical_alternative
translation:
  language: ko
  text: 왜냐하면 사람들 가운데서는 모든 것이 가능하지 않기 때문입니다. 사람의 아들은 불멸하지 않기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘사람의 아들’입니다. 여기서는 특정 호칭이 아니라 죽을 수밖에 없는 인간을 가리키는 일반 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ γὰρ
  english_pob_choice: For not
  chosen_korean: 왜냐하면 … 않기 때문입니다
  alternatives_korean:
  - 그렇지 않기 때문입니다
  - 왜냐하면 … 없기 때문입니다
  lexicon: BDAG
  rationale: γάρ의 설명적 연결을 살리되, 한국어에서는 문장 첫머리의 인과 접속과 뒤의 이유절을 자연스럽게 살려 번역했습니다.
- source_word: ἐν ἀνθρώποις
  english_pob_choice: in human beings
  chosen_korean: 사람들 가운데서는
  alternatives_korean:
  - 인간들 안에는
  - 사람들 안에서는
  lexicon: BDAG
  rationale: ἐν + 여격의 범위/영역 감각을 한국어에서 자연스러운 ‘가운데서’로 옮겨, 단순한 내부 공간보다 ‘인간 영역 전체’의 한계를 드러냈습니다.
- source_word: πάντα
  english_pob_choice: everything
  chosen_korean: 모든 것이
  alternatives_korean:
  - 전부가
  - 모든 것들이
  lexicon: BDAG
  rationale: 중성 복수의 포괄성을 유지하기 위해 ‘모든 것이’로 간결하게 옮겼습니다.
- source_word: υἱὸς ἀνθρώπου
  english_pob_choice: a son of man
  chosen_korean: 사람의 아들
  alternatives_korean:
  - 한 사람
  - 인자
  - 한 인간
  lexicon: BDAG
  rationale: 여기서는 관용적·일반적 표현으로서의 인간을 가리키므로, 기독론적 호칭인 ‘인자’를 피하고 직역에 가까운 ‘사람의 아들’을 택했습니다.
theological_decisions:
- issue: υἱὸς ἀνθρώπου를 제목적 호칭으로 읽을지, 일반적 인간 표현으로 읽을지
  chosen_reading: 일반적 인간 표현으로 이해하여 ‘사람의 아들’로 유지했습니다.
  alternative_readings:
  - 인자
  - 한 인간
  - 사람
  rationale: 지혜문맥상 문장은 인간의 유한성과 죽을 운명을 논하며, 정관사도 없고 앞뒤 논증도 메시아 호칭을 요구하지 않습니다. 따라서 후대 기독론적 연상을 불러오는 번역은 피하고, 본문의 일반적 의미를 드러냈습니다.
  doctrine_reference: DOCTRINE.md §§3–4 (문맥 우선, 실제 의미의 모호성은 보존)
