  rationale: ἔναντι의 ‘~앞에, ~면전에’라는 뜻을 자연스러운 한국어로 살리기 위해 ‘주님 앞에’를 선택했습니다.
theological_decisions:
- issue: 하나님의 아시는 바가 단순한 인지인지, 심판적 노출인지
  chosen_reading: 본문의 이미지를 좁히지 않고, 죄와 불의가 주님 앞에서 가려지지 않은 상태로 놓여 있다는 뜻을 유지했습니다.
  alternative_readings:
  - ‘주님의 눈에 벗어나지 않았다’처럼 인지 중심으로 완화하는 번역
  rationale: 히브리/헬라 지혜문학의 표현은 단순 지식이 아니라 하나님 앞의 드러남과 책임성을 함께 시사하므로, 그 긴장을 보존했습니다.
  doctrine_reference: 하나님의 전지와 인간 책임의 동시 진술
