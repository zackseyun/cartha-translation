- source_word: νόμον ζωῆς
  english_pob_choice: the law of life
  chosen_korean: 생명의 율법
  alternatives_korean:
  - 생명에 관한 율법
  - 생명을 주는 율법
  - 생명 주는 율법
  lexicon: LSJ
  rationale: 그리스어의 명사구를 보존하면서도 한국어에서 자연스럽게 읽히도록 소유·관계격인 ‘-의’ 구조로 옮겼습니다. POB의 각주처럼 해석적 표현도 가능하지만, 본문은 더 직역적인 ‘생명의 율법’을 유지했습니다.
- source_word: ἐκληροδότησεν
  english_pob_choice: he bequeathed
  chosen_korean: 유산으로 주셨습니다
  alternatives_korean:
  - 상속으로 주셨습니다
  - 물려주셨습니다
  - 유업으로 주셨습니다
  lexicon: LSJ
  rationale: κληροδοτέω의 상속/유산 어감을 살리되, 현대 한국어에서 자연스럽고 품위 있게 들리도록 ‘유산으로 주셨습니다’로 풀었습니다. ‘물려주셨습니다’도 가능하지만, 본문의 엄숙한 선언체에는 ‘유산’이 더 적합합니다.
theological_decisions:
- issue: νόμον ζωῆς를 해석적으로 풀어 쓸지, 직역에 가깝게 유지할지
  chosen_reading: 생명의 율법
  alternative_readings:
  - 생명을 주는 율법
  - 생명에 관한 율법
  rationale: 그리스어는 비교적 პირდაპირ한 속격 구조이므로, 본문에서는 해석을 덧입히지 않고 ‘생명의 율법’을 유지했습니다. 이는 POB의 ‘law of life’와 같은 긴장을 보존합니다.
