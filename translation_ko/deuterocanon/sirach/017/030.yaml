  text: For not everything can be among human beings[a], because a son of man is not immortal.
  footnotes:
  - marker: a
    text: Greek 'a son of man,' a Hebrew-style expression meaning a mortal human being, not a messianic title in this context.
    reason: lexical_alternative
translation:
  language: ko
  text: 사람들 가운데에는 모든 것이 있을 수는 없습니다. 이는 인자도 불멸하지 않기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘인자’는 이 문맥에서 메시아 칭호가 아니라, 죽을 수밖에 없는 인간을 가리키는 히브리식 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ γὰρ δύναται
  english_pob_choice: For ... cannot
  chosen_korean: ~할 수는 없습니다
  alternatives_korean:
  - ~하지 못합니다
  - ~할 능력이 없습니다
  lexicon: BDAG
  rationale: 능력 부정을 자연스러운 현대 한국어로 옮기되, 일반 원칙 진술의 완곡한 논리를 살려 ‘~할 수는 없습니다’로 표현했습니다.
- source_word: πάντα εἶναι ἐν ἀνθρώποις
  english_pob_choice: everything can be in human beings
  chosen_korean: 사람들 가운데에는 모든 것이 있을 수는 없습니다
  alternatives_korean:
  - 사람들 안에는 모든 것이 있을 수는 없습니다
  - 인간에게는 모든 것이 있을 수는 없습니다
  lexicon: BDAG
  rationale: ἐν ἀνθρώποις는 단순한 ‘안에’보다 ‘가운데에/사이에’가 더 자연스러워, 인간 집단 전체를 가리키는 일반 진술로 옮겼습니다.
- source_word: υἱὸς ἀνθρώπου
  english_pob_choice: a son of man
  chosen_korean: 인자
  alternatives_korean:
  - 사람의 아들
  - 한 사람
  lexicon: BDAG
  rationale: 시락에서는 메시아 호칭이 아니라 히브리식 인유로서의 인간을 뜻하므로, 직역적 표현을 유지하되 한국어에서는 문맥상 가장 압축적인 ‘인자’로 옮겼습니다.
- source_word: οὐκ ἀθάνατος
  english_pob_choice: is not immortal
  chosen_korean: 불멸하지 않기 때문입니다
  alternatives_korean:
  - 죽지 않기 때문입니다
  - 영원히 살지 않기 때문입니다
  lexicon: LSJ
  rationale: ἀθάνατος의 핵심은 ‘죽지 않음’이므로, 문어체에서 간결하고 직접적인 ‘불멸하지 않다’를 사용했습니다.
theological_decisions:
- issue: υἱὸς ἀνθρώπου를 메시아 칭호로 오해하지 않게 할지 여부
  chosen_reading: 이 구절에서는 ‘인자’가 메시아 칭호가 아니라 유한한 인간 일반을 가리키는 표현으로 읽히도록 유지했습니다.
  alternative_readings:
  - 사람의 아들
  - 한 인간
  rationale: 본문은 인간의 한계를 설명하는 지혜 격언이므로, 후대의 칭호 연상을 피하면서도 원문의 어휘적 긴장을 보존하는 것이 적절합니다.
  doctrine_reference: Translation philosophy §§1, 3, 4
