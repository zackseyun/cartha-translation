  rationale: 유한한 인간 일반을 뜻하는 υἱὸς ἀνθρώπου를 한국어에서 칭호로 굳어진 ‘인자’ 대신 ‘사람’으로 관용적으로 번역했습니다. 이로써 원문의 비메시아적 일반 지칭과 논지를 보존하고, 불필요해진 설명 각주를 삭제했습니다. 첫 문장의 포괄적 인간 집단 지칭과 δεύτε 문장의 이유 제시는 유지했습니다.
