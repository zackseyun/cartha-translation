  text: The Lord created man from the earth[a], and returned him to it again.
  footnotes:
  - marker: a
    text: Or 'humankind' or 'a human being'; the Greek has singular ἄνθρωπον used representatively for humanity.
    reason: lexical_alternative
translation:
  language: ko
  text: 주님께서는 흙에서 사람을 지으셨고, 다시 그를 그것으로 돌려보내셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 여기서 ‘사람’은 개인 한 사람만이 아니라 대표적 인류를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Κύριος
  english_pob_choice: The Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주
  - 주께서
  lexicon: κύριος
  rationale: 본문의 주어는 언약적·창조적 주권을 가진 하나님을 가리키므로, 한국어에서는 경어적 호격이 아니라 서술문 안에서 자연스러운 ‘주님’이 적절합니다.
- source_word: ἔκτισεν
  english_pob_choice: created
  chosen_korean: 지으셨고
  alternatives_korean:
  - 창조하셨고
  - 만드셨고
  lexicon: κτίζω
  rationale: κτίζω의 창조 행위를 살리면서도, 한국어에서 ‘지으시다’가 사람을 빚어 만드신 창조의 행위를 문맥상 자연스럽게 전달합니다.
- source_word: ἐκ γῆς
  english_pob_choice: from the earth
  chosen_korean: 흙에서
  alternatives_korean:
  - 땅에서
  - 지에서
  lexicon: γῆ
  rationale: 인간의 물질적 기원을 드러내는 본문 흐름상 ‘흙’이 한국어 성경 독자에게 더 직접적으로 원재료와 유한성을 떠올리게 하므로 선택했습니다.
- source_word: ἄνθρωπον
  english_pob_choice: man
  chosen_korean: 사람
  alternatives_korean:
  - 인간
  - 한 사람
  lexicon: ἄνθρωπος
  rationale: 그리스어 단수는 대표적 인류를 가리키므로, 성중립적이면서도 개체성과 대표성을 함께 살리는 ‘사람’이 가장 무리 없습니다.
- source_word: ἀπέστρεψεν αὐτὸν εἰς αὐτήν
  english_pob_choice: returned him to it again
  chosen_korean: 다시 그를 그것으로 돌려보내셨습니다
  alternatives_korean:
  - 다시 그를 거기로 돌이키셨습니다
  - 다시 그를 그곳으로 되돌리셨습니다
  lexicon: ἀποστρέφω
  rationale: 핵심은 단순한 귀환보다 ‘그가 나온 원소로 되돌아감’입니다. ‘돌려보내셨습니다’가 능동적 원인과 방향을 함께 살립니다.
theological_decisions:
- issue: 인류 대표를 뜻하는 단수 ἄνθρωπον의 처리
  chosen_reading: 단수는 그대로 살리되 한국어에서는 ‘사람’으로 번역해 대표적 인류를 드러냈습니다.
  alternative_readings:
  - 인간
  - 한 인간
  rationale: 본문은 한 개인을 넘어 인간 전체의 기원을 말하지만, 단수 표현을 유지해야 창조-귀환의 대조가 선명합니다.
  doctrine_reference: 'DOCTRINE.md: singular representative rendering of אָדָם/ἄνθρωπος may be kept in Korean when contextually warranted.'
