  text: 죽은 이에게서는 — 마치 더 이상 존재하지 않는 사람에게서처럼 — 찬양이 사라집니다. 그러나 살아 있고 건강한 이는 주님을 찬양할 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
