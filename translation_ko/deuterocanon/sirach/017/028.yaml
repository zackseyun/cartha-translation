    text: 또는 '감사'로도 옮길 수 있습니다. 그리스어 명사는 '고백'도 뜻하지만, 여기서는 뒤의 '주님을 찬양할 것입니다'와의 평행 때문에 '찬양'의 뜻이 더 잘 맞습니다.
    reason: lexical_alternative
