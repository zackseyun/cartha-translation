  text: 죽은 이에게서는, 마치 존재하지 않는 이에게서처럼, 찬양은 끊어집니다.[a] 그러나 살아 있고 건강한 이는 주님을 찬양할 것입니다.
  philosophy: optimal-equivalence
  footnotes:
