  text: From the dead[a], as from one who no longer exists, praise perishes; but one who is alive and well will praise the Lord.
  footnotes:
  - marker: a
    text: Or 'thanksgiving perishes'; the Greek noun can also mean 'confession,' but here the parallel with 'will praise the Lord' favors the sense of praise or thanksgiving.
    reason: lexical_alternative
translation:
