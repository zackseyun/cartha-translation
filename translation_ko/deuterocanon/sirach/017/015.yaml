translation:
  language: ko
  text: 각 민족마다 그들을 다스릴 지도자를 세우셨고, 이스라엘은 주님의 몫입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 헬라어는 직역하면 '그리고 이스라엘은 주님의 몫이다'입니다. 영어 POB는 문맥상의 대비를 드러내기 위해 'but'을 사용했지만, 한국어 본문에서는 헬라어 접속사를 따라 '그리고'로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑκάστῳ ἔθνει
  english_pob_choice: for each nation
  chosen_korean: 각 민족마다
  alternatives_korean:
  - 각 나라에
  - 모든 민족에게
  lexicon: LSJ
  rationale: 여격의 분배적 의미를 한국어의 '-마다'로 자연스럽게 살려, 각 민족에 대한 개별적 지정이라는 뜻을 분명히 했습니다.
- source_word: κατέστησεν ἡγούμενον
  english_pob_choice: appointed a ruler
  chosen_korean: 그들을 다스릴 지도자를 세우셨고
  alternatives_korean:
  - 통치자를 임명하셨고
  - 다스리는 이를 세우셨고
  lexicon: LSJ
  rationale: ἡγούμενον은 단순한 선도자보다 통치·지배의 맥락이 있어 '다스릴 지도자'로 옮겼고, κατέστησεν의 임명/세움 의미는 '세우셨고'로 자연스럽게 반영했습니다.
- source_word: μερὶς Κυρίου
  english_pob_choice: the Lord’s own portion
  chosen_korean: 주님의 몫
  alternatives_korean:
  - 주님의 몫이십니다
  - 주님의 분깃
  lexicon: LSJ
  rationale: μερὶς는 '몫, 분깃, 몫으로 주어진 몫'의 뜻이므로, 성서적이면서도 현대적인 '몫'을 택해 소유와 할당의 뉘앙스를 살렸습니다.
theological_decisions:
- issue: 대조를 분명히 드러내는 접속 관계
  chosen_reading: 둘째 절은 '그리고'로 옮겨, 열방에 대한 통치자 배정과 이스라엘의 특별한 귀속을 나란히 제시했습니다.
  alternative_readings:
  - 그러나 이스라엘은 주님의 몫입니다
  - 그런데 이스라엘은 주님의 몫입니다
  rationale: 헬라어는 καί를 사용하지만, 문맥상 대조가 암시될 수 있어도 본문 자체의 연결을 과도하게 해석하지 않도록 중립적으로 처리했습니다.
  doctrine_reference: DOCTRINE.md §§1, 6
