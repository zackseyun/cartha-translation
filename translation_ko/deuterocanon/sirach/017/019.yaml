  text: After this he will rise up and repay them[b][a], and he will bring their repayment upon their head.
  footnotes:
  - marker: a
    text: Or 'he will arise.' The Greek verb is literally 'rise up,' portraying decisive action.
    reason: lexical_alternative
  - marker: b
    text: '''Upon their head'' is an idiom meaning the consequences of their actions return upon themselves.'
    reason: cultural_note
translation:
  language: ko
  text: 이 일 후에 그는 일어나서 그들에게 갚으시고, 그들의 보응을 그들 머리 위로 돌려주십니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘일어나서’는 단순히 기상한다는 뜻이 아니라, 결정적으로 행동하기 위해 일어서는 것을 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그들 머리 위로’는 그 행위의 결과가 자신들에게 되돌아오는 관용구입니다.
    reason: cultural_note
