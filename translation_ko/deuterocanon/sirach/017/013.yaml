    reason: lexical_alternative
lexical_decisions:
- source_word: Προσέχετε
  english_pob_choice: Watch yourselves against
  chosen_korean: 스스로를 경계하십시오
  alternatives_korean:
  - 주의하십시오
  - 조심하십시오
  - 스스로를 살피십시오
  lexicon: BDAG
  rationale: προσέχετε는 단순한 ‘주의’보다 경고와 경계의 뉘앙스가 강하므로, 반사적 의미를 살려 ‘스스로를 경계하십시오’로 옮겼습니다.
- source_word: ἀπὸ παντὸς ἀδίκου
  english_pob_choice: every injustice
  chosen_korean: 모든 불의에 대해
  alternatives_korean:
  - 모든 잘못에 대해
  - 모든 불의로부터
  - 모든 불의한 것에 대해
  lexicon: LSJ
  rationale: ἀδίκου는 여기서 윤리적·사회적 ‘불의’를 가리키므로, 추상적인 신학 용어보다 직접적인 ‘불의’를 택했고, ἀπό의 경계/회피 의미를 살려 ‘에 대해’로 처리했습니다.
- source_word: ἑκάστῳ
  english_pob_choice: each of them
  chosen_korean: 그들 각자에게
  alternatives_korean:
  - 각 사람에게
  - 각자에게
  - 그들 각각에게
  lexicon: BDAG
  rationale: 분배적 의미를 분명히 드러내기 위해 ‘그들 각자에게’로 옮겨, 명령이 집단이 아니라 개인별로 주어진다는 점을 살렸습니다.
- source_word: περὶ τοῦ πλησίον
  english_pob_choice: concerning his neighbor
  chosen_korean: 그의 이웃에 관하여
  alternatives_korean:
  - 이웃에 대하여
  - 그의 이웃에 대해
  - 동료에 관하여
  lexicon: BDAG
  rationale: πλησίον은 윤리 문맥에서 ‘이웃’이 가장 자연스럽고 성경적이므로 이를 유지했고, 단수형도 원문대로 보존했습니다.
