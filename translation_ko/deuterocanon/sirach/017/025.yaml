lexical_decisions:
- source_word: ὡς μεγάλη
  english_pob_choice: How great
  chosen_korean: 얼마나 큰지요
  alternatives_korean:
  - 얼마나 위대한지요
  - 참으로 큰지요
  lexicon: LSJ
  rationale: 감탄문으로서의 ὡς μεγάλη의 힘을 살려, 형식적이되 자연스러운 한국어 감탄 표현으로 옮겼습니다.
- source_word: ἐλεημοσύνη
  english_pob_choice: mercy
  chosen_korean: 자비
  alternatives_korean:
  - 긍휼
  - 은혜
  - 자애
  lexicon: BDAG/LSJ
  rationale: 주님에게 속한 ἐλεημοσύνη는 구제행위보다 자비로운 행동을 가리키므로, 한국어에서는 문맥상 가장 자연스러운 '자비'를 택했습니다.
- source_word: ἐξιλασμός
  english_pob_choice: atonement
  chosen_korean: 속죄
  alternatives_korean:
  - 화목
  - 속죄제
  - 화해
  lexicon: LSJ
  rationale: Ἐξιλασμός은 죄책을 제거하거나 속죄를 이루는 뜻이므로, 교리적 세부를 과도하게 규정하지 않으면서도 의미를 직접 드러내는 '속죄'를 선택했습니다.
- source_word: τοῖς ἐπιστρέφουσιν ἐπ᾿ αὐτόν
  english_pob_choice: for those who turn to him
  chosen_korean: 그에게 돌아오는 이들
  alternatives_korean:
  - 그에게 돌아가는 이들
  - 그에게로 향하는 이들
  - 그에게 돌이키는 이들
  lexicon: BDAG/LSJ
  rationale: ἐπιστρέφω의 기본 의미인 '돌아오다/돌이키다'를 살리되, 하나님께로의 관계적 귀환을 자연스럽게 드러내기 위해 '그에게 돌아오는 이들'로 옮겼습니다.
theological_decisions:
