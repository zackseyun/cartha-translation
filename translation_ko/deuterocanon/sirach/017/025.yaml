  - 속죄소적 의미
  - 보상
  rationale: 본문은 주님의 자비와 함께 죄의 제거/속죄를 병렬로 말하므로, '속죄'가 가장 सीधे적이고도 신학적 긴장을 과도하게 좁히지 않습니다.
