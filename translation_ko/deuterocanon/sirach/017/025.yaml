  source_fidelity: ὡς μεγάλη는 감탄적으로 ‘얼마나 큰지요’로 잘 옮겼고, ἐλεημοσύνη는 이 문맥에서 ‘자비’가 적절합니다. ἐξιλασμός은 ‘속죄’로 옮길 수 있으며, τοῖς ἐπιστρέφουσιν ἐπ᾿ αὐτόν은 ‘그분께 돌아오는 이들’로 자연스럽고 충실하게 표현됩니다. 다만 원문은 두 명사를 병렬로 놓으므로, 한국어에서도 두 항목 모두에 감탄의 범위가 걸리도록 문장을 다듬는 것이 더 분명합니다.
