  text: Return to the Lord and leave sins behind[b][a]; pray before his face and lessen stumbling.
  footnotes:
  - marker: a
    text: Or 'pray in his presence.' The Greek literally says 'pray before [the] face,' an idiom for approaching God directly.
    reason: lexical_alternative
  - marker: b
    text: Or 'lessen the stumbling block' or 'reduce what causes stumbling.' The Greek term can refer to an obstacle or cause of moral stumbling.
    reason: alternative_reading
translation:
  language: ko
  text: 주님께 돌아가 죄를 버리십시오. 그분의 얼굴 앞에서 간구하고[a] 걸림돌을 줄이십시오[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그분 앞에서 기도하십시오’ 또는 ‘그분의 임재 안에서 기도하십시오.’ 그리스어는 문자적으로 ‘얼굴 앞에서 간구하다’라고 하며, 하나님께 직접 나아가는 관용적 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘걸림을 줄이십시오’ 또는 ‘넘어지게 하는 것을 줄이십시오.’ 그리스어 πρόσκομμα는 장애물이나 도덕적으로 넘어지게 하는 원인을 가리킬 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐπίστρεφε
  english_pob_choice: Return
  chosen_korean: 돌아가십시오
  alternatives_korean:
  - 돌이키십시오
  - 회개하십시오
  lexicon: LSJ
  rationale: ἐπιστρέφω의 핵심 동작은 방향을 바꾸어 되돌아가는 것이므로, ‘돌아가다’가 가장 직접적입니다. ‘회개하다’는 의미를 더 넓게 확장할 수 있어 여기서는 피했습니다.
- source_word: ἀπόλειπε ἁμαρτίας
  english_pob_choice: leave sins behind
  chosen_korean: 죄를 남겨 두지 마십시오
  alternatives_korean:
  - 죄를 버리십시오
  - 죄를 떠나십시오
  lexicon: LSJ
  rationale: ἀπολείπω는 ‘뒤에 남기다/남겨 두다’의 뉘앙스가 있어, 죄와의 분리를 ‘남겨 두지 마십시오’로 옮겼습니다. POB의 ‘leave sins behind’에 맞추되 현대 한국어로 자연화했습니다.
- source_word: κατὰ πρόσωπον
  english_pob_choice: before his face
  chosen_korean: 그 얼굴 앞에서
  alternatives_korean:
  - 그 앞에서
  - 그 임재 가운데
  lexicon: LSJ
  rationale: 직역하면 ‘얼굴 앞에서’이며, 하나님께 직접 나아가는 생생한 관용을 살리기 위해 ‘그 얼굴 앞에서’로 옮겼습니다. ‘임재’는 관용적이지만 원문 이미지가 약해집니다.
- source_word: σμίκρυνον πρόσκομμα
  english_pob_choice: lessen stumbling
  chosen_korean: 걸림을 줄이십시오
  alternatives_korean:
  - 걸림돌을 줄이십시오
  - 실족하게 하는 것을 줄이십시오
  lexicon: LSJ
  rationale: πρόσκομμα는 문자적으로 ‘걸림/걸림돌’이지만, 여기서는 도덕적 넘어짐의 계기를 가리킬 수 있어 보다 추상적인 ‘걸림’으로 살렸습니다. POB의 해석 여지를 한국어에서도 유지했습니다.
theological_decisions:
- issue: κατὰ πρόσωπον의 인칭 보충
  chosen_reading: 바로 앞절의 ‘주님’을 받는 말로 이해하여 ‘그 얼굴 앞에서’라고 옮겼습니다.
  alternative_readings:
  - 주님 앞에서
  - 그 앞에서
  rationale: 그리스어는 목적어를 생략한 압축 표현이므로, 한국어에서는 지시대명사 ‘그’로 앞선 ‘주님’을 자연스럽게 받게 했습니다. 이는 새로운 해석을 덧붙이지 않고 문맥의 지시 대상을 명료화한 것입니다.
  doctrine_reference: 번역 원칙 §§1, 6
- issue: πρόσκομμα의 범위
  chosen_reading: 구체적인 ‘걸림돌’보다 추상적인 ‘걸림’으로 처리했습니다.
  alternative_readings:
  - 걸림돌
  - 실족의 원인
  rationale: 문맥은 회개, 기도, 악에서의 이탈을 병렬로 권면하므로, πρόσκoμμα를 특정 대상을 단정하기보다 도덕적 넘어짐의 가능성 전체로 보존하는 편이 원문에 가깝습니다.
  doctrine_reference: 번역 원칙 §§1, 5
