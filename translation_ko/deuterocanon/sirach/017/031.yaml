  text: What is brighter than the sun? Yet even this fails[b][a], and flesh and blood devises evil.
  footnotes:
  - marker: a
    text: Or 'and even this is eclipsed' or 'and this too disappears'; the Greek verb can denote failing, ceasing, or being eclipsed.
    reason: lexical_alternative
  - marker: b
    text: Literally 'flesh and blood,' an idiom for mortal human beings.
    reason: lexical_alternative
translation:
  language: ko
  text: 해님보다 더 밝은 것이 무엇이겠습니까? 그러나 이마저도 사라지고, 악한 자는 살과 피를 도모합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘사라지고’는 ἐκλείπει의 넓은 의미를 따른 번역입니다. 이 동사는 ‘사라지다’, ‘끝나다’, ‘가려지다’처럼 읽을 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘살과 피’는 문자적으로는 육체와 혈액이지만, 관용적으로는 죽을 수밖에 없는 인간을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τί φωτεινότερον ἡλίου
  english_pob_choice: What is brighter than the sun?
  chosen_korean: 해님보다 더 밝은 것이 무엇이겠습니까?
  alternatives_korean:
  - 태양보다 더 밝은 것이 무엇이겠습니까?
  - 해보다 더 밝은 것이 무엇이겠습니까?
  lexicon: LSJ
  rationale: 수사 의문문으로서 비교의 초점을 살리기 위해 ‘무엇이겠습니까?’를 택했고, φωτεινότερον은 자연스러운 비교급인 ‘더 밝은’으로 옮겼습니다.
- source_word: καὶ τοῦτο ἐκλείπει
  english_pob_choice: Yet even this fails
  chosen_korean: 그러나 이마저도 사라지고
  alternatives_korean:
  - 그러나 이마저도 사그라지고
  - 그러나 이마저도 가려지고
  - 그러나 이마저도 끝나고
  lexicon: LSJ
  rationale: ἐκλείπει는 ‘사라지다/끝나다/가려지다’의 넓은 뜻이 있어, 여기서는 해의 한계를 드러내는 문맥에 맞게 ‘사라지고’로 넓게 살렸습니다.
- source_word: πονηρὸς ἐνθυμήσεται
  english_pob_choice: flesh and blood devises evil
  chosen_korean: 악한 자는 … 도모합니다
  alternatives_korean:
  - 악한 사람은 … 생각합니다
  - 악한 자는 … 꾀합니다
  - 악한 사람은 … 계획합니다
  lexicon: LSJ
  rationale: ἐνθυμήσεται는 내적 숙고보다 ‘마음속으로 꾀함/도모함’의 뉘앙스가 있어, 악한 의도를 드러내는 동사로 ‘도모하다’를 선택했습니다.
- source_word: σάρκα καὶ αἷμα
  english_pob_choice: flesh and blood
  chosen_korean: 살과 피
  alternatives_korean:
  - 혈육
  - 혈과 육
  - 인간
  lexicon: LSJ
  rationale: 영어 POB가 관용구를 보존한 만큼, 한국어에서도 직역형인 ‘살과 피’를 유지해 유한한 인간 존재의 구체성을 살렸습니다.
theological_decisions:
- issue: σάρκα καὶ αἷμα의 관용구 처리
  chosen_reading: ‘살과 피’로 직역해 인간의 유한성과 도덕적 연약함을 함께 드러냈습니다.
  alternative_readings:
  - ‘인간은’으로 의미 번역
  - ‘혈육’으로 관용화
  rationale: 문맥은 해의 밝음과 대비되는 인간의 악한 궁리입니다. 관용구를 보존하면 본문의 신체적 이미지와 인류학적 긴장을 약화시키지 않습니다.
  doctrine_reference: 'DOCTRINE.md: preserve theological tension'
