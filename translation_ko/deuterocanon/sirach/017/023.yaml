  naturalness: 초안의 ‘살아 있는 이들 곧 감사하는 이들’은 ‘곧’ 때문에 원문의 병렬 구조가 축소됩니다. ‘살아 있으며 감사를 드리는 이들’은 현대 표준어로 자연스럽고, 문맥상 살아 있는 사람들의 감사와 찬양이라는 대비를 명료하게 나타냅니다. ‘지극히 높으신 분’도 존칭적 신적 칭호로 자연스럽습니다.
