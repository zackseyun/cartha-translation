translation:
  language: ko
  text: 그들의 모든 행위는 해처럼 그분 앞에 있으며, 그분의 눈은 그들의 길들을 끊임없이 살피십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직유는 단순히 ‘같다’는 뜻을 넘어서, 인간의 행위가 하나님 앞에서 완전히 드러난다는 뜻을 함축합니다.
    reason: theological_note
lexical_decisions:
- source_word: ἅπαντα τὰ ἔργα
  english_pob_choice: All their works
  chosen_korean: 그들의 모든 행위
  alternatives_korean:
  - 그들의 모든 일
  - 그들의 모든 작품
  - 그들의 모든 행동
  lexicon: LSJ
  rationale: ἔργα는 단순한 개별 행동보다 삶의 행위 전반을 가리킬 수 있어, 문맥상 더 자연스러운 ‘행위’로 옮기되 ἅπαντα의 총괄성을 ‘모든’으로 살렸습니다.
- source_word: ὡς ὁ ἥλιος
  english_pob_choice: like the sun
  chosen_korean: 해처럼
  alternatives_korean:
  - 해와 같이
  - 태양처럼
  - 태양과 같이
  lexicon: LSJ
  rationale: 직유 표지 ὡς를 그대로 살려 비교를 분명히 하되, 한국어에서는 ‘해처럼’이 가장 간결하고 자연스럽습니다.
- source_word: ἐναντίον αὐτοῦ
  english_pob_choice: before him
  chosen_korean: 그분 앞에
  alternatives_korean:
  - 그분의 면전에서
  - 그분 앞에서
  - 그분의 حضور 앞에
  lexicon: LSJ
  rationale: ἐναντίον은 ‘앞에/면전에서’의 뜻이므로, 시각적·법정적 노출의 뉘앙스를 유지하는 ‘그분 앞에’가 적절합니다.
- source_word: ἐνδελεχεῖς
  english_pob_choice: continually
  chosen_korean: 끊임없이 살피십니다
  alternatives_korean:
  - 늘 지켜보십니다
  - 항상 주시하십니다
  - 계속 살피십니다
  lexicon: LSJ
  rationale: 형용사 ἐνδελεχεῖς의 지속성은 한국어에서 서술적으로 풀어야 하므로, 하나님의 지속적 감시/주시를 드러내는 동사구로 옮겼습니다.
theological_decisions:
- issue: 하나님의 눈이라는 인격적 의인화
  chosen_reading: ‘그분의 눈은… 살피십니다’로 의인화를 유지했습니다.
  alternative_readings:
  - 그분의 시선은…
  - 그분은… 항상 보십니다
  rationale: 원문은 ‘눈’(ὀφθαλμοὶ)이라는 신체 이미지를 사용해 하나님의 전적 인지를 표현하므로, 이를 추상화하지 않고 유지했습니다.
  doctrine_reference: Translation philosophy §3, §6
- issue: ‘해처럼’의 비교가 주는 노출성
  chosen_reading: 직유를 보존하여 행위의 완전한 노출을 암시하도록 했습니다.
  alternative_readings:
  - 해처럼 드러나 있습니다
  - 환하게 드러나 있습니다
  rationale: 원문은 ‘밝다/드러나다’를 직접 말하지 않지만, 해와의 비교가 그런 함의를 강하게 전달하므로, 해석을 과도하게 덧붙이지 않으면서도 그 의미를 듣게 했습니다.
  doctrine_reference: Translation philosophy §1, §6
