  text: From the dead, as from one who no longer exists, thanksgiving perishes; but one who is alive and well will praise the Lord.
  footnotes:
  - marker: a
    text: Or 'confession'; the Greek noun can denote acknowledgment or thankful praise. Here 'thanksgiving' best fits the parallel with 'will praise.'
    reason: lexical_alternative
translation:
  language: ko
  text: 죽은 자에게서는, 마치 더는 존재하지 않는 이에게서처럼, 감사[a]가 사라집니다. 그러나 살아 있고 건강한 이는 주님을 찬양할 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘고백’. 이 그리스어 명사는 인정 또는 감사의 찬양을 가리킬 수 있으며, 여기서는 뒤의 ‘찬양할 것입니다’와의 평행 때문에 ‘감사’가 더 적절합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ νεκροῦ
  english_pob_choice: From the dead
  chosen_korean: 죽은 자에게서는
  alternatives_korean:
  - 죽은 자로부터
  - 죽은 자에게서
  lexicon: BDAG
  rationale: ἀπό + 속격은 여기서 출처를 나타내므로, 죽은 자에게서 감사가 나오지 않는다는 뜻을 자연스러운 한국어로 옮겼습니다.
- source_word: ὡς μηδὲ ὄντος
  english_pob_choice: as from one who no longer exists
  chosen_korean: 마치 더는 존재하지 않는 이에게서처럼
  alternatives_korean:
  - 마치 존재하지 않는 이에게서처럼
  - 마치 아무 존재도 아닌 이에게서처럼
  lexicon: BDAG
  rationale: 죽은 이를 ‘더는 존재하지 않는 이’로 비유하는 수사적 비교를 살리되, 형이상학적 단정으로 읽히지 않도록 했습니다.
- source_word: ἐξομολόγησις
  english_pob_choice: thanksgiving
  chosen_korean: 감사
  alternatives_korean:
  - 감사 찬양
  - 고백
  - 찬양
  lexicon: LEH
  rationale: LXX에서 이 명사는 감사의 찬양을 뜻할 수 있으며, 뒤의 ‘찬양할 것입니다’와 평행을 이루므로 ‘감사’로 옮겼습니다.
- source_word: αἰνέσει
  english_pob_choice: will praise
  chosen_korean: 찬양할 것입니다
  alternatives_korean:
  - 찬송할 것입니다
  - 기릴 것입니다
  lexicon: BDAG
  rationale: 미래형의 동작을 그대로 살려, 살아 있고 건강한 자가 주님께 드리는 적극적 찬양을 분명하게 표현했습니다.
theological_decisions:
- issue: 죽은 자의 상태를 어떻게 읽을 것인가
  chosen_reading: 이 구절을 죽은 자가 살아 있는 자처럼 하나님께 드리는 행위가 없다는 수사적 대조로 읽었습니다.
  alternative_readings:
  - 죽은 자의 존재론적 부재를 단정하는 문장으로 읽음
  - 사후 의식에 대한 교리 진술로 읽음
  rationale: 지혜문학의 문맥에서는 살아 있는 동안의 찬양 가능성을 강조하는 표현으로 보는 것이 가장 자연스럽고, 사후 존재론 전체를 규정하지 않도록 긴장을 보존해야 합니다.
  doctrine_reference: 지혜문학의 수사적 일반화
