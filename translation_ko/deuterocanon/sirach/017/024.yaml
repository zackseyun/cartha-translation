  text: From the dead, as from one who no longer exists, thanksgiving perishes; but one who is alive and well will praise the Lord.
  footnotes:
  - marker: a
    text: Or 'confession'; the Greek noun can denote acknowledgment or thankful praise. Here 'thanksgiving' best fits the parallel with 'will praise.'
    reason: lexical_alternative
translation:
  language: ko
  text: 죽은 자에게서는, 마치 더는 존재하지 않는 이에게서처럼, 감사가 사라집니다. 그러나 살아 있고 건강한 이는 주님을 찬양할 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘고백’. 이 그리스어 명사는 인정과 감사의 찬양을 모두 가리킬 수 있으며, 여기서는 뒤의 ‘찬양할 것입니다’와의 평행 때문에 ‘감사’가 더 적절합니다.
    reason: lexical_alternative
