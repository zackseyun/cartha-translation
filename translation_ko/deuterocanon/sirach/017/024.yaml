  - 사후 의식에 대한 교리 진술로 읽음
  rationale: 지혜문학의 문맥에서는 살아 있는 동안의 찬양 가능성을 강조하는 표현으로 보는 것이 가장 자연스럽고, 사후 존재론 전체를 규정하지 않도록 긴장을 보존해야 합니다.
  doctrine_reference: 지혜문학의 수사적 일반화
