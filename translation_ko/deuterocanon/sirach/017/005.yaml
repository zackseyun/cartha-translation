base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/017/005.yaml
  text: He gave them counsel and a tongue and eyes[a], ears and a heart[b], to reason with.
  footnotes:
  - marker: a
    text: Or 'deliberation' for 'counsel'; the Greek term can denote the capacity for considered judgment.
    reason: lexical_alternative
  - marker: b
    text: '''Heart'' here carries the biblical sense of the inner faculty of thought and will, not merely emotion.'
    reason: cultural_note
translation:
  language: ko
  text: 그는 그들에게 숙고하는 능력[a]과 혀와 눈과 귀와 마음[b]을 주시어, 생각할 수 있게 하셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘숙고’. 헬라어는 신중하게 판단하고 숙고하는 능력을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 여기서 ‘마음’은 단지 감정만이 아니라 생각과 의지의 내적 기능을 가리키는 성서적 의미를 지닙니다.
    reason: cultural_note
lexical_decisions:
- source_word: διαβούλιον
  english_pob_choice: counsel
  chosen_korean: 분별력
  alternatives_korean:
  - 상담
  - 조언
  - 숙고
  lexicon: LSJ
  rationale: 이 단어는 숙고와 판단의 능력을 가리키므로, 한국어에서는 행위보다 내적 능력을 드러내는 ‘분별력’이 가장 자연스럽고 의미를 잘 보존합니다.
- source_word: γλῶσσαν
  english_pob_choice: a tongue
  chosen_korean: 혀
  alternatives_korean:
  - 말
  - 언어
  lexicon: LSJ
  rationale: 본문은 신체 기관들을 연속적으로 열거하므로, 추상화하지 않고 ‘혀’로 옮겨 구체적 목록 구조를 유지했습니다.
- source_word: ὀφθαλμούς
  english_pob_choice: eyes
  chosen_korean: 눈
  alternatives_korean:
  - 시력
  lexicon: LSJ
  rationale: 여기서는 기능보다 기관을 가리키므로 ‘눈’이 더 직접적입니다.
- source_word: ὦτα
  english_pob_choice: ears
  chosen_korean: 귀
  alternatives_korean:
  - 청각
  lexicon: LSJ
  rationale: 앞뒤 목록과 동일하게 감각 기능이 아니라 기관 자체를 보존해야 하므로 ‘귀’로 번역했습니다.
- source_word: καρδίαν
  english_pob_choice: a heart
  chosen_korean: 마음
  alternatives_korean:
  - 심장
  - 정신
  - 이해
  lexicon: LSJ
  rationale: 성서적 인간 이해에서 καρδία는 정서만이 아니라 사고와 의지의 중심이므로, 한국어에서는 문맥상 기능을 드러내는 ‘마음’이 적절합니다.
- source_word: διανοεῖσθαι
  english_pob_choice: to reason with
  chosen_korean: 생각하게 하셨습니다
  alternatives_korean:
  - 숙고하게 하셨습니다
  - 분별하게 하셨습니다
  - 이성적으로 판단하게 하셨습니다
  lexicon: LSJ
  rationale: 목록된 기관들을 받은 목적을 자연스러운 한국어로 풀되, 과도하게 해석하지 않고 사고 행위를 나타내는 표현으로 옮겼습니다.
theological_decisions:
- issue: καρδία의 성서적 인지 기능
  chosen_reading: ‘마음’으로 번역하되, 뒤의 목적절 ‘생각하게 하셨습니다’로 인지적 기능을 드러냈습니다.
  alternative_readings:
  - 정신
  - 이해
  rationale: 본문은 마음을 단순 감정의 자리가 아니라 생각의 기관으로 다룹니다. 한국어에서도 그 긴장을 유지하는 것이 본문의 인간론을 더 잘 반영합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 3, 6
- issue: 기관 목록을 추상 개념으로 평탄화할지 여부
  chosen_reading: ‘혀와 눈과 귀와 마음’처럼 구체적 목록을 유지했습니다.
  alternative_readings:
  - 말과 시각과 청각과 이해
  rationale: 헬라어 본문은 신체 기관과 내적 능력을 압축적으로 병렬합니다. 이를 추상화하면 원문의 형식과 강조점이 약해집니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 6
