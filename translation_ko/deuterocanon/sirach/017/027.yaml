  lexicon: LSJ
  rationale: 동사의 예배적 뉘앙스를 살리되, 한국어에서는 ‘노래’ 요소를 본문에 직접 넣기보다 ‘찬양하다’로 간결하게 옮겼습니다.
- source_word: ἐν ᾅδου
  english_pob_choice: in Hades
  chosen_korean: 죽음의 땅에서
  alternatives_korean:
  - 하데스에서
  - 음부에서
  - 스올에서
  lexicon: LSJ
  rationale: 본문의 ᾅδης는 죽은 자들의 영역을 가리키므로, 독자에게는 이해되면서도 교리적 세부를 과도하게 특정하지 않는 표현을 택했습니다.
- source_word: ἀντὶ ζώντων καὶ διδόντων ἀνθομολόγησιν
  english_pob_choice: instead of the living who give thanks
  chosen_korean: 살아 있는 사람들 곧 감사하는 이들을 대신하여
  alternatives_korean:
  - 살아 있는 사람들 곧 감사하는 이들을 대신하여
  - 살아 있는 이들 대신에 감사하는 이들을 대신하여
  - 살아 있는 사람들 대신에 감사하는 이들을 대신하여
  lexicon: LSJ
  rationale: ἀντί의 대조·대신 의미를 ‘대신하여’로 살리고, ζώντων과 διδόντων ἀνθομολόγησιν의 병렬을 한국어 자연문으로 정리했습니다.
theological_decisions:
- issue: ᾅδης의 번역 범위
  chosen_reading: ‘죽음의 땅’으로 옮겨, 죽은 자들의 영역을 뜻하되 최후 심판의 지옥 개념으로 좁히지 않았습니다.
  alternative_readings:
  - 하데스
  - 스올
  - 음부
  rationale: 지혜문학의 수사적 대조는 ‘살아 있는 이들’과 ‘죽은 자들의 영역’을 대비하는 데 있으므로, 원문의 범위를 유지하는 번역이 적절합니다.
  doctrine_reference: 원어 우선 원칙에 따라 후대 교리 범주를 과잉 주입하지 않습니다.
