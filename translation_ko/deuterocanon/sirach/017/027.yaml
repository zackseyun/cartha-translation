  yaml_path: translation/deuterocanon/sirach/017/027.yaml
  text: Who will sing praise to the Most High in Hades[c][b][a], instead of the living who give thanks?
  footnotes:
  - marker: a
    text: Or 'praise' instead of 'sing praise.' The Greek verb means to praise; the English wording here reflects the verse's worshipful tone.
    reason: lexical_alternative
  - marker: b
    text: '''Hades'' here means the realm of the dead, not necessarily the place of final judgment. An alternative rendering is ''Sheol,'' reflecting the broader biblical concept behind the Greek usage.'
    reason: alternative_reading
  - marker: c
    text: The final phrase could also be rendered 'the living who offer thanksgiving.'
    reason: lexical_alternative
translation:
  language: ko
  text: 지극히 높으신 분께 누가 죽음의 땅에서, 살아 있는 사람들 곧 감사하는 이들을 대신하여 찬양하겠습니까?[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문의 αἰνέσει는 단순한 ‘찬양하다’보다 예배적 울림이 있는 표현으로도 읽을 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ἐν ᾅδου는 죽은 자들의 영역을 뜻하며, 여기서는 최종 형벌의 장소를 단정하지 않습니다.
    reason: theological_note
  - marker: c
    text: ἀνθομολόγησιν은 ‘감사’ 또는 ‘감사 표명’의 뜻으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑψίστῳ
  english_pob_choice: the Most High
  chosen_korean: 지극히 높으신 분께
  alternatives_korean:
  - 가장 높으신 분께
  - 지극히 높으신 이께
  lexicon: LSJ
  rationale: 하나님을 가리키는 칭호로서 ‘Most High’의 호칭성을 살리면서, 한국어에서도 직역보다 자연스러운 존칭 표현으로 옮겼습니다.
- source_word: αἰνέσει
  english_pob_choice: sing praise
  chosen_korean: 찬양하겠습니까
