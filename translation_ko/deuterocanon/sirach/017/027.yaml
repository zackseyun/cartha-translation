  source_fidelity: 수정이 필요합니다. 초안의 ‘죽음의 땅’은 ᾅδης의 뜻을 설명적으로 풀어낸 표현이지만, 그리스어의 직접적 용어인 ‘하데스’를 본문에서 대체합니다. 또한 ζώντων καὶ διδόντων ἀνθομολόγησιν은 ‘살아 있는 사람들 곧 감사하는 이들’이라는 동격보다는 ‘살아 있으면서 감사를 드리는 이들’이라는 병렬적 수식으로 옮기는 것이 더 충실합니다.
  naturalness: 수정문은 한국어 수사 의문의 어순에 자연스럽고, 현대 표준어 합쇼체를 유지합니다. ‘대신에’를 수식구 전체 뒤에 두어 대비 관계도 분명히 했습니다.
  terminology: Ὕψιστος는 ‘지극히 높으신 분’, ᾅδης는 ‘하데스’, αἰνέω는 ‘찬양하다’로 옮겼습니다. ‘하데스’에 관한 주석은 죽은 자들의 영역이라는 문맥적 범위를 설명하되 후대의 최종 형벌 교리로 한정하지 않습니다.
