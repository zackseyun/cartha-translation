  lexicon: BDAG
  rationale: 동사는 단순한 말하기보다 사실을 차례로 풀어 전하는 ‘recount’의 뉘앙스가 있어, 보고·서술의 성격을 살려 옮겼습니다.
- source_word: τὰ μεγαλεῖα
  english_pob_choice: the mighty deeds
  chosen_korean: 일의 위대함
  alternatives_korean:
  - 큰 일들
  - 위대한 일들
  - 능하신 일들
  lexicon: LSJ
  rationale: POB의 영어 사유와 달리, 그리스어 μεγαλεῖα는 ‘크고 놀라운 일들’의 성격과 함께 그 위대성을 가리킬 수 있어, 여기서는 ‘일의 위대함’으로 압축해 자연스러운 한국어를 택했습니다.
- source_word: τῶν ἔργων αὐτοῦ
  english_pob_choice: of his works
  chosen_korean: 그분의 일
  alternatives_korean:
  - 그분의 일들
  - 그분이 하신 일
  - 그분의 행적
  lexicon: BDAG
  rationale: ἔργα는 보통 ‘일/행위’이므로, ‘works’에 기계적으로 대응하기보다 한국어에서 가장 자연스러운 ‘일’로 옮겼습니다. 소유 대명사 αὐτοῦ는 문맥상 하나님을 가리키므로 ‘그분의’로 처리했습니다.
theological_decisions:
- issue: 서술 대상이 되는 하나님의 행위의 성격
  chosen_reading: 하나님의 ‘일의 위대함’을 사람들에게 말해 전하도록 하는 목적문으로 읽었습니다.
  alternative_readings:
  - ‘그분의 위대한 일들’로 구체화하는 읽기
  - ‘그분의 능하신 일들’로 더 전통적으로 옮기는 읽기
  rationale: 문맥에서 핵심은 하나님의 행위가 사람들 사이에서 선포·기억되도록 하는 목적이며, μεγαλεῖα는 단순한 양적 ‘큰 일’보다 그 위대함 자체를 강조할 수 있습니다. 그래서 행위와 위대함을 함께 드러내되 과도한 해석은 피했습니다.
  doctrine_reference: 시락 17:9 문맥상 하나님의 창조적·섭리적 행위의 선포
