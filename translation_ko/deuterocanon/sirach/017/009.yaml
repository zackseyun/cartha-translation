lexical_decisions:
- source_word: ἵνα
  english_pob_choice: so that
  chosen_korean: …하려는 것입니다
  alternatives_korean:
  - …하기 위함입니다
  - …하도록 하려는 것입니다
  lexicon: BDAG
  rationale: ἵνα는 목적을 나타내므로, 현대 한국어에서는 자연스러운 목적 표현으로 옮겼습니다. 문맥상 앞선 진술의 목적을 받는 형식이어서 종결을 부드럽게 처리했습니다.
- source_word: διηγῶνται
