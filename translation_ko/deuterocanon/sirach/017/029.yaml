  lexicon: LSJ
  rationale: ἐπιστρέφω의 회개적 ‘돌아옴’ 의미를 살리되, 한국어에서는 ‘돌아오다’가 가장 자연스럽고 문맥에도 잘 맞습니다.
theological_decisions:
