  lexicon: LSJ
  rationale: 영어 POB가 더 일반적인 ‘atonement’를 택한 점을 따라, 희생-화해의 의미를 담는 표준어 ‘속죄’로 옮겼습니다.
- source_word: τοῖς ἐπιστρέφουσιν ἐπʼ αὐτόν
  english_pob_choice: for those who turn to him
  chosen_korean: 그분께 돌아오는 이들에게
