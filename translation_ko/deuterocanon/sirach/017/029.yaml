lexical_decisions:
- source_word: ὡς μεγάλη
  english_pob_choice: How great
  chosen_korean: 얼마나 크며
  alternatives_korean:
  - 참으로 크며
  - 얼마나 위대한지요
  lexicon: LSJ
  rationale: ὡς + 형용사의 감탄을 한국어의 감탄 표현으로 옮겨, 단순 비교가 아니라 경탄의 뉘앙스를 살렸습니다.
- source_word: ἐλεημοσύνη
