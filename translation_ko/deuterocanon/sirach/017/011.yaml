translation:
  language: ko
  text: 그는 그들과 영원한[a] 언약을 세우셨고, 그들에게 그의 법도들[b]을 보여 주셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘영구한 언약’ 또는 ‘시대에 걸친 언약’.
    reason: αἰῶνος의 지속성과 시대적 범위를 반영하는 어휘적 대안입니다.
  - marker: b
    text: 또는 ‘그의 규례들’ 또는 ‘그의 법령들’.
    reason: κρίματα의 규범적·법적 의미 범위에 대한 어휘적 대안입니다.
lexical_decisions:
- source_word: διαθήκην
  english_pob_choice: covenant
  chosen_korean: 언약
  alternatives_korean:
  - 계약
  - 약정
  lexicon: BDAG
  rationale: διαθήκη는 성경 문맥에서 단순한 합의보다 언약의 의미가 강하므로, POB의 covenant에 맞춰 한국어도 언약으로 옮기는 것이 가장 직접적입니다.
- source_word: αἰῶνος
  english_pob_choice: everlasting
  chosen_korean: 영원한
  alternatives_korean:
  - 영속하는
  - 세세한
  lexicon: BDAG
  rationale: αἰῶνος는 지속성과 시대를 가리키며, 여기서는 언약의 지속성을 수식하므로 한국어에서는 관용적이고 자연스러운 영원한이 적절합니다.
- source_word: τὰ κρίματα αὐτοῦ
  english_pob_choice: his judgments
  chosen_korean: 자신의 법도들
  alternatives_korean:
  - 자신의 판단들
  - 자신의 규례들
  - 자신의 심판들
  lexicon: BDAG
  rationale: κρίματα는 문맥상 판결/판단뿐 아니라 규범적 명령의 뜻도 담을 수 있어, 본문이 언약과 병렬을 이루는 점을 살려 법도들로 옮겼습니다.
- source_word: ὑπέδειξεν
  english_pob_choice: showed
  chosen_korean: 보여 주셨습니다
  alternatives_korean:
  - 알려 주셨습니다
  - 가르쳐 주셨습니다
  - 지시하셨습니다
  lexicon: BDAG
  rationale: ὑποδείκνυμι는 드러내어 보이다, 가리켜 보이다의 뜻이므로, 관계를 분명히 드러내는 보여 주셨습니다가 가장 직접적입니다.
theological_decisions:
- issue: κρίματα의 한국어 범위 유지
  chosen_reading: 법도들
  alternative_readings:
  - 규례들
  - 판단들
  - 심판들
  rationale: 이 절은 언약 체결과 계시를 함께 말하므로, 지나치게 재판적이거나 추상적인 표현보다 규범성과 계시성을 함께 담는 법도들이 본문 흐름에 잘 맞습니다.
  doctrine_reference: Translation philosophy §§1, 5
