  text: There is a meticulous cunning[a], and this too is unjust[b]; and there is one who twists things in order to bring a judgment to light.
  footnotes:
  - marker: a
    text: Or 'There is a careful shrewdness, and it too is unjust.'
    reason: lexical_alternative
  - marker: b
    text: '''Judgment'' could also be rendered ''justice'' or ''verdict''; the Greek is broad enough to allow either nuance.'
    reason: alternative_reading
translation:
  language: ko
  text: 신중한 간교함도 있으니 — 이것도 불의합니다 — 그리고 어떤 이는 판단을 드러내려고 일을 비틉니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '신중한 간계'로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: '''판단''은 ''정의''나 ''판결''로도 옮길 수 있으며, 그리스어는 그 폭이 넓습니다.'
    reason: alternative_reading
lexical_decisions:
- source_word: πανουργία ἀκριβὴς
  english_pob_choice: a meticulous cunning
  chosen_korean: 신중한 간교함
  alternatives_korean:
  - 정밀한 간계
  - 꼼꼼한 교활함
  - 세심한 간교함
  lexicon: LSJ
  rationale: πανουργία의 부정적 뉘앙스를 살리기 위해 '간교함'을 택하고, ἀκριβὴς는 단순한 정확성이 아니라 빈틈없이 계산된 성격을 나타내므로 '신중한'으로 자연스럽게 풀었습니다.
- source_word: ἄδικος
  english_pob_choice: unjust
  chosen_korean: 불의합니다
  alternatives_korean:
  - 부당합니다
  - 의롭지 않습니다
  - 불공정합니다
  lexicon: LSJ
  rationale: 지혜문학 맥락에서 ἄδικος는 도덕적·법적 불의함을 가리키므로, 형식적인 '부당하다'보다 더 직접적인 '불의하다'를 선택했습니다.
- source_word: διαστρέφων
  english_pob_choice: twists things
  chosen_korean: 일을 비틉니다
  alternatives_korean:
  - 사실을 왜곡합니다
  - 것들을 비틀어 놓습니다
  - 말을 꼬아 놓습니다
  lexicon: LSJ
  rationale: 동사는 본래 궤도를 벗어나게 비트는 뜻이므로, 한국어에서는 구체적 목적어를 살리면서도 간결한 '일을 비틀다'가 가장 근접합니다.
- source_word: κρίμα
  english_pob_choice: judgment
  chosen_korean: 판단
  alternatives_korean:
  - 심판
  - 판결
  - 정의
  lexicon: LSJ
  rationale: κριμα는 '판결/심판/판단'까지 넓게 뻗을 수 있어, 문맥의 폭을 남기기 위해 비교적 넓은 '판단'을 선택했습니다.
theological_decisions:
- issue: 첫 절의 윤리적 평가
  chosen_reading: 이 구절은 능숙함 자체를 칭찬하지 않고, 정교하게 계산된 간교함을 불의한 것으로 규정합니다.
  alternative_readings:
  - '''신중함''에 가까운 중립적 재치로 읽을 수도 있습니다.'
  rationale: 뒤따르는 αὕτη ἄδικος가 앞 구를 직접 평가하므로, 한국어도 부정적 판정을 분명히 드러내는 쪽이 원문 흐름에 맞습니다.
  doctrine_reference: 지혜문학의 도덕적 평가를 보존합니다.
- issue: 마지막 구절의 κρίμα 범위
  chosen_reading: '''판단''으로 옮겨 법정적·윤리적 폭을 열어 둡니다.'
  alternative_readings:
  - '''정의'''
  - '''판결'''
  rationale: 원문은 하나의 단어로 심리·법정·윤리적 의미를 모두 열어 두므로, 특정한 교리적 의미로 좁히지 않는 것이 적절합니다.
  doctrine_reference: 의도적 의미 범위를 유지합니다.
