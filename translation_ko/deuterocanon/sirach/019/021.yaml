  source_fidelity: 원문의 πανουργία ἀκριβὴς는 단순히 신중한 태도라기보다 세밀하게 계산된 부정적 간교함을 가리킵니다. ‘치밀한 간교함’이 이를 더 정확히 반영합니다. διαστρέφων의 목적어는 생략되어 있으므로 ‘일을 왜곡하다’로 자연스럽게 보충하되, 특정 대상(사실·말 등)으로 한정하지 않았습니다. κρίμα는 ‘판단’으로 유지하여 판결·정의 등의 폭을 보존했습니다.
  naturalness: 기존의 ‘신중한 간교함도 있으니 — 이것도 불의합니다 — 그리고’는 연결과 대시 사용이 현대 한국어 합쇼체 문장으로 다소 부자연스럽습니다. 두 문장으로 나누고 ‘또’를 사용하면 원문의 병렬을 자연스럽게 살릴 수 있습니다. 각주 표지도 해당 어휘 바로 뒤에 배치하는 것이 명확합니다.
