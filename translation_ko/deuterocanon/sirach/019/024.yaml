  text: And if he is prevented from sinning by lack of strength[b][a], when he finds an opportunity he will do evil.
  footnotes:
  - marker: a
    text: Or 'through weakness' for 'by lack of strength.' The Greek phrase can denote deficient power or inability more generally.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'when he finds a time'; here 'time' means an opportune occasion.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 만일 그가 힘의 부족 때문에 죄짓지 못하게 되었다가, 기회를 찾으면 악을 행할 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘힘의 부족’은 ‘연약함으로 인해’로도 옮길 수 있으며, 그리스어는 더 넓게는 능력의 결핍이나 무능력을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘때를 찾으면’입니다. 여기서 ‘때’는 단순한 시간이 아니라 적절한 기회를 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπὸ ἐλαττώματος ἰσχύος
  english_pob_choice: by lack of strength
  chosen_korean: 힘의 부족 때문에
  alternatives_korean:
  - 연약함으로 인해
  - 능력이 부족해서
  - 힘이 모자라서
  lexicon: LSJ
  rationale: ὑπό + 속격은 원인/수단의 뜻을 띨 수 있고, ἐλαττῶμα ἰσχύος는 단순한 체력보다 ‘힘의 결핍’을 가리키므로, 원인 관계를 드러내는 자연스러운 한국어로 옮겼습니다.
- source_word: κωλυθῇ ἁμαρτεῖν
  english_pob_choice: is prevented from sinning
  chosen_korean: 죄짓지 못하게 되었다가
  alternatives_korean:
  - 죄를 짓지 못하도록 막히게 되었다가
  - 죄에서 막혀 있게 되다가
  - 죄짓는 것이 저지되었다가
  lexicon: BDAG
  rationale: κωλύω의 ‘막다/방해하다’의 뜻을 살려 외적·상황적 제약을 나타내되, 한국어에서는 ‘죄짓지 못하게 되다’가 가장 직접적으로 대응합니다.
- source_word: εὕρῃ καιρόν
  english_pob_choice: finds an opportunity
  chosen_korean: 기회를 찾으면
  alternatives_korean:
  - 적절한 때를 찾으면
  - 때를 만나면
  - 좋은 기회를 만나면
  lexicon: BDAG
  rationale: καιρός는 단순한 시간보다 ‘적절한 때, 호기’를 뜻하므로, POB의 의미를 따라 ‘기회’로 옮기되 행위의 가능성이 열리는 순간이라는 뉘앙스를 유지했습니다.
- source_word: κακοποιήσει
  english_pob_choice: he will do evil
  chosen_korean: 악을 행할 것입니다
  alternatives_korean:
  - 악하게 행할 것입니다
  - 악행을 저지를 것입니다
  - 악한 일을 할 것입니다
  lexicon: BDAG
  rationale: κακοποιέω의 일반적 의미인 ‘악을 행하다’를 직설적으로 살렸고, 앞의 ‘죄’와 구분되는 도덕적 악행의 결과를 드러내기 위해 ‘행하다’를 택했습니다.
theological_decisions:
- issue: 이 절이 드러내는 내적 상태와 행위의 관계
  chosen_reading: 이 사람은 참된 의로움 때문에 죄를 피하는 것이 아니라, 힘이 부족해서 일시적으로 죄를 못 짓는 상태로 묘사됩니다.
  alternative_readings:
  - 단순히 육체적 피로로 인해 죄를 못 짓는다는 뜻으로만 볼 수 있음
  - ‘힘의 부족’은 도덕적 연약함을 포괄하는 표현으로 읽을 수 있음
  rationale: 그리스어 본문은 ‘힘의 결핍’과 ‘기회를 찾으면 악을 행함’을 함께 놓아, 억제의 원인이 도덕적 개혁이 아니라 상황적 제약임을 보여 줍니다. 이 긴장을 완화하지 않고 그대로 살렸습니다.
  doctrine_reference: 원문 우선 원칙, 본문 내 도덕적 긴장 보존
