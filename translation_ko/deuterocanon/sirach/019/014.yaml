translation:
  language: ko
  text: 친구를 책망하십시오. 왜냐하면 종종 중상모략이 일어나기 때문이며, 모든 말을 다 믿지 마십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘모든 말을 다 믿지 마십시오’는 직역에 가깝지만, 문맥상 ‘모든 보고를 다 믿지 마십시오’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔλεγξον
  english_pob_choice: Reprove
  chosen_korean: 책망하십시오
  alternatives_korean:
  - 꾸짖으십시오
  - 권면하십시오
  - 바로잡으십시오
  lexicon: LSJ
  rationale: ἐλέγχω의 명령형은 잘못을 지적하고 책망하는 뜻이 강하므로, 관계를 완곡하게 만드는 표현보다 직접적인 ‘책망하십시오’가 원문 힘을 잘 살립니다.
- source_word: φίλον
  english_pob_choice: a friend
  chosen_korean: 친구를
  alternatives_korean:
  - 한 친구를
  - 당신의 친구를
  - 벗을
  lexicon: LSJ
  rationale: 관사 없는 단수는 일반적인 잠언식 표현이므로, 소유격을 덧붙이지 않고 보편적으로 읽히는 ‘친구를’로 옮겼습니다.
- source_word: διαβολή
  english_pob_choice: slander
  chosen_korean: 중상모략
  alternatives_korean:
  - 비방
  - 모함
  - 참소
  lexicon: LSJ
  rationale: διαβολή는 비방적 고발과 중상을 아우르므로, 현대 한국어에서 그 성격을 분명히 드러내는 ‘중상모략’이 적절합니다.
- source_word: μὴ παντὶ λόγῳ πίστευε
  english_pob_choice: do not believe every word
  chosen_korean: 모든 말을 다 믿지 마십시오
  alternatives_korean:
  - 모든 보고를 다 믿지 마십시오
  - 모든 말을 믿지 마십시오
  - 모든 진술을 다 믿지 마십시오
  lexicon: LSJ
  rationale: λόγος를 문맥상 ‘말/보고’로 이해할 수 있으나, 원문의 직설적 구조를 살리면서도 자연스럽게 ‘모든 말을 다 믿지 마십시오’로 옮겼습니다.
