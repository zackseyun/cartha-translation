review_pass:
  verdict: revise
  source_fidelity: The draft correctly renders the two imperatives, the generic singular ‘friend,’ the frequency marker πολλάκις, and the warning not to believe every λόγος. However, ‘중상모략’ can imply an actively devised plot or machination beyond διαβολή, which more directly denotes slander/defamation. The explanatory clause is also rendered with an unnecessarily cumbersome Korean causal construction.
  naturalness: ‘왜냐하면 … 때문이며’ is awkward and overly connective in a compact proverbial saying. A direct causal sentence in formal-polite Korean is clearer and more idiomatic.
  terminology: ‘책망하십시오’ is an acceptable rendering of ἔλεγξον. ‘중상’ more precisely and economically represents διαβολή than ‘중상모략.’ ‘모든 말을 다 믿지 마십시오’ properly preserves the lexical breadth of λόγος; the contextual ‘report’ alternative belongs in a note.
  issues:
  - severity: medium
    issue: ‘중상모략’ over-specifies διαβολή.
    rationale: The Greek means slander or defamation; ‘모략’ may add the notion of a deliberate scheme not expressed by the source.
  - severity: medium
    issue: The causal wording ‘왜냐하면 … 때문이며’ is unnatural in this proverb-like Korean sentence.
    rationale: It combines overlapping causal/connective expressions and weakens the concise formal register of the source.
  revised_text: 친구를 책망하십시오. 흔히 중상이 있기 때문입니다. 모든 말을 다 믿지 마십시오.[a]
  revised_footnotes:
