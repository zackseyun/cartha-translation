translation:
  language: ko
  text: 친구를 책망하십시오. 흔히 중상이 있기 때문입니다. 모든 말을 다 믿지 마십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘모든 말을 다 믿지 마십시오’는 직역에 가깝지만, 문맥상 ‘모든 보고를 다 믿지 마십시오’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔλεγξον
  english_pob_choice: Reprove
  chosen_korean: 책망하십시오
  alternatives_korean:
  - 꾸짖으십시오
  - 권면하십시오
  - 바로잡으십시오
  lexicon: LSJ
  rationale: ἐλέγχω의 명령형은 잘못을 지적하고 책망하는 뜻이 강하므로, 관계를 완곡하게 만드는 표현보다 직접적인 ‘책망하십시오’가 원문 힘을 잘 살립니다.
- source_word: φίλον
