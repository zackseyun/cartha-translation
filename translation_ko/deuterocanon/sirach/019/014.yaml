  alternative_readings:
  - 특정한 친구 관계에만 적용되는 조언
  - 공동체 내 분쟁 상황에 한정된 지시
  rationale: 관사 없는 단수와 일반적 금언 형식은 보편적 적용을 가리키므로, 적용 범위를 넓게 유지하는 편이 원문에 가깝습니다.
  doctrine_reference: 지혜문학의 일반적 권면
