  - 악한 일을 꾸미는
  lexicon: LSJ
  rationale: 단순한 성품 묘사보다 의도적으로 악을 꾸미는 동작성을 살리기 위해 ‘꾀하는’으로 옮겼습니다.
- source_word: συγκεκυφὼς μελανίᾳ
  english_pob_choice: bent low in gloom
  chosen_korean: 어둠 속에 웅크려 있고
  alternatives_korean:
  - 침울하게 굽어 있고
  - 우울 속에 몸을 낮추고
  - 검은 그늘에 숙여 있고
  lexicon: LSJ
  rationale: 신체적 굽음과 어두운 분위기의 중첩을 한국어에서 자연스럽게 전달하기 위해, 외적 자세와 내적 분위기를 함께 암시하는 표현을 택했습니다.
- source_word: τὰ ἐντὸς αὐτοῦ πλήρης δόλου
  english_pob_choice: inwardly he is full of deceit
  chosen_korean: 그의 내면은 속임수로 가득합니다
  alternatives_korean:
  - 그 속은 속임수로 가득합니다
  - 그 안에는 속임수가 가득합니다
  - 그의 속사람은 간계로 가득합니다
  lexicon: LSJ
  rationale: ‘τὰ ἐντὸς’의 내적 영역을 ‘내면’으로 자연스럽게 살리고, δόλος를 교회적 관용어보다 직설적인 ‘속임수’로 옮겨 의미를 분명히 했습니다.
theological_decisions:
- issue: 외적 침울함과 내적 악의의 긴장
  chosen_reading: 겉으로는 어둡고 움츠러든 모습이지만, 내면은 속임수로 가득한 사람을 묘사합니다.
  alternative_readings:
  - 단순히 우울하거나 낙담한 사람의 묘사로 읽을 수 있습니다.
  - 실제 자세보다 위선적 태도를 암시하는 표현으로 읽을 수 있습니다.
  rationale: 헬라어는 외적 굽음/어둠과 내적 deceit를 병치하므로, 한국어에서도 그 긴장을 유지하되 위선 여부는 단정하지 않았습니다.
  doctrine_reference: 인간의 외양과 내면을 함께 드러내는 지혜문학의 도덕적 통찰
