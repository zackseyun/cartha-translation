translation:
  language: ko
  text: 악을 꾀하는 자가 있으니, 그가 어둠 속에 웅크려 있고, 그의 내면은 속임수로 가득합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘어둠 속에 웅크려 있고’는 원문의 ‘굽은 자세’와 ‘검은/침울한 상태’의 이중 가능성을 함께 살린 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔστιν
  english_pob_choice: There is
  chosen_korean: ~하는 자가 있습니다
  alternatives_korean:
  - ~하는 사람이 있습니다
  - 어떤 이는 있습니다
  lexicon: LSJ
  rationale: 헬라어의 일반적 존재 진술을 한국어에서도 유형적 인물 소개로 살려, 특정 개인보다 ‘그런 부류의 사람’을 가리키게 했습니다.
- source_word: πονηρευόμενος
  english_pob_choice: who plots evil
  chosen_korean: 악을 꾀하는
  alternatives_korean:
