  yaml_path: translation/deuterocanon/sirach/019/017.yaml
  text: All wisdom is fear of the Lord[b][a], and in all wisdom there is the practice of the law.
  footnotes:
  - marker: a
    text: Or 'reverence for the Lord.' The Greek phrase traditionally rendered 'fear of the Lord' includes awe-filled reverence, but the main text keeps the stronger wording of the source expression.
    reason: lexical_alternative
  - marker: b
    text: Or 'and in all wisdom is observance of the law.' The Greek wording can be rendered more formally with 'doing' or 'observance' instead of 'practice.'
    reason: alternative_reading
translation:
  language: ko
  text: 모든 지혜는 주님을 두려워하는 것이며[a], 모든 지혜에는 율법을 행함이 있습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주님에 대한 경외.’ 그리스어 표현은 두려움과 경외가 함께 있는 뜻을 담지만, 본문은 원문의 더 강한 표현을 유지합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘율법의 실천.’ 그리스어 ποίησις는 더 문자적으로는 ‘행함’이나 ‘실행’으로도 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: Πᾶσα σοφία
  english_pob_choice: All wisdom
  chosen_korean: 모든 지혜
  alternatives_korean:
  - 각각의 지혜
  - 모든 지혜들
  lexicon: LSJ
  rationale: Πᾶσα는 총괄적 의미를 가지므로 한국어로는 자연스럽고 포괄적인 ‘모든’으로 옮기며, σοφία는 이 문맥에서 지혜의 일반 범주를 가리키므로 단수형 ‘지혜’가 적절합니다.
- source_word: φόβος Κυρίου
  english_pob_choice: fear of the Lord
  chosen_korean: 주님을 두려워하는 것
  alternatives_korean:
  - 주님에 대한 경외
  - 주님을 경외함
  lexicon: LSJ
  rationale: 전통적 표현인 ‘주님을 두려워하는 것’을 택해 φόβος의 긴장감 있는 뜻을 살리고, 단순한 존중으로 약화시키지 않았습니다.
- source_word: ἐν πάσῃ σοφίᾳ
  english_pob_choice: in all wisdom
  chosen_korean: 모든 지혜에는
  alternatives_korean:
  - 모든 지혜 안에는
  - 모든 지혜 속에는
  lexicon: LSJ
  rationale: 원문의 전치사구를 한국어 문맥에 맞게 풀어, 두 번째 절이 일반 원리로 들리도록 ‘~에는’ 구조를 사용했습니다.
- source_word: ποίησις νόμου
  english_pob_choice: there is the practice of the law
  chosen_korean: 율법을 행함
  alternatives_korean:
  - 율법의 실천
  - 율법 준행
  - 율법을 지킴
  lexicon: LSJ
  rationale: ποίησις는 ‘행함/실행’의 뜻이므로, νόμου와 결합한 의미를 직설적으로 드러내는 ‘율법을 행함’으로 옮겼습니다.
theological_decisions:
- issue: φόβος Κυρίου의 신학적 뉘앙스
  chosen_reading: ‘주님을 두려워하는 것’으로 유지하여 경외와 두려움의 긴장을 함께 보존했습니다.
  alternative_readings:
  - 주님에 대한 경외
  - 주님을 경외함
  rationale: 지혜 전통의 핵심 표현을 현대어로 지나치게 순화하지 않고, 원문이 지닌 경외·두려움의 복합 의미를 유지하는 것이 적절합니다.
  doctrine_reference: DOCTRINE.md §3 Preserve theological tension rather than resolve it
