theological_decisions:
- issue: 문맥상 ‘들음-경계-미움’의 진행을 어떻게 드러낼 것인가
  chosen_reading: 쉼표와 접속을 통해 두 번째 절의 결과적 전개를 살리고, 최종 미래형으로 적대의 도착점을 분명히 했습니다.
  alternative_readings:
  - ‘그는 당신을 들었고 당신을 지켜보았으며…’
  - ‘그는 당신을 들었고 당신에게 주의하였으며…’
  rationale: 지혜문학의 경고 어조를 살리되, 과도한 해석 없이 원문의 단계적 흐름을 한국어 문장 구조로 재현했습니다.
  doctrine_reference: 잠언적 경고 문맥; 원수/적대에 대한 지혜 전승의 일반적 권면
