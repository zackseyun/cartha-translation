  text: For he has heard you and has guarded himself against you[a], and in time he will hate you.
  footnotes:
  - marker: a
    text: Or 'has guarded you' / 'has observed you.' The Greek verb can denote guarding, keeping, or watching; here the context favors the idea that the hearer has taken note of you and will later turn against you.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 당신을 들었고 당신을 경계하였으며, 때가 되면 당신을 미워할 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신을 지켜보았다’ / ‘당신을 관찰하였다’. 그리스어 동사는 보호, 보존, 지켜봄의 뜻을 가질 수 있으며, 여기서는 문맥상 당신을 의식하고 경계했다는 뜻이 더 강합니다.
    reason: lexical_alternative
