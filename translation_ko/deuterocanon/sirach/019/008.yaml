    text: 또는 ‘당신을 지켜보았으며’ 또는 ‘당신을 지켜 주었으며’. 그리스어 동사는 ‘지키다’, ‘보호하다’, ‘주시하다’라는 뜻을 가질 수 있습니다. 여기의 중간태는 문맥상 당신을 경계하여 자신을 지킨다는 뜻으로도 이해될 수 있습니다.
