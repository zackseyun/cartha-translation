  text: Rot and worms will inherit him, and a bold soul will be taken away.
translation:
  language: ko
  text: 썩은 것과 구더기들이 그를 상속할 것이며, 대담한 영혼은 끌려가게 될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “상속하다”는 여기서 유산 상속의 긍정적 의미가 아니라, 죽은 뒤 썩은 것과 구더기가 사람을 차지한다는 역설적 표현입니다.
    reason: source_note
lexical_decisions:
- source_word: σήπη
  english_pob_choice: Rot
  chosen_korean: 썩은 것
  alternatives_korean:
  - 부패
  - 썩음
  lexicon: σῆψις/σήπω 의미역
  rationale: 문맥상 시체의 부패를 가리키므로, 한국어에서는 ‘썩은 것’이 자연스럽고 본문 이미지를 직접 살립니다.
- source_word: σκώληκες
  english_pob_choice: worms
  chosen_korean: 구더기들
  alternatives_korean:
  - 벌레들
  - 벌레
  - 구충들
  lexicon: σκώληξ
  rationale: 시체 부패와 결합된 표상으로서 ‘구더기들’이 가장 구체적이며, 독자가 즉시 장례/부패 이미지를 이해할 수 있습니다.
- source_word: κληρονομήσουσιν αὐτόν
  english_pob_choice: will inherit him
  chosen_korean: 그를 상속할 것이며
  alternatives_korean:
  - 그를 상속받을 것이며
  - 그를 차지할 것이며
  lexicon: κληρονομέω
  rationale: 헬라어의 상속 언어를 살려 ‘상속할 것이며’로 직역성을 유지했습니다. 죽음과 부패가 사람을 ‘유산처럼’ 차지한다는 역설을 보존합니다.
- source_word: ψυχὴ τολμηρά
  english_pob_choice: a bold soul
  chosen_korean: 대담한 영혼
  alternatives_korean:
  - 무모한 영혼
  - 무슨 일이든 감히 하는 영혼
  - 용감한 영혼
  lexicon: ψυχή + τολμηρός
  rationale: POB의 ‘bold’를 따라 갔으며, 원문의 도발적·위험 감수적 뉘앙스를 살리되 ‘무모한’으로 과도하게 도덕화하지 않았습니다.
- source_word: ἐξαρθήσεται
  english_pob_choice: will be taken away
  chosen_korean: 끌려가게 될 것입니다
  alternatives_korean:
  - 제거될 것입니다
  - 취해질 것입니다
  - 옮겨질 것입니다
  lexicon: ἐξαίρω
  rationale: 수동 미래의 제거/끌어감 의미를 반영하되, 문맥상 생명이나 혼이 외부로 ‘끌려감’처럼 느껴지도록 자연스럽게 옮겼습니다.
theological_decisions:
- issue: ‘대담한’의 윤리적 평가
  chosen_reading: 이 구절에서는 용기 자체를 칭찬하기보다, 죽음 앞에서 자만하거나 위험을 무릅쓰는 태도를 가리키는 경고적 표현으로 읽었습니다.
  alternative_readings:
  - 단순히 ‘용감한 영혼’으로 중립적으로 읽기
  - ‘무모한 영혼’으로 강하게 부정적 읽기
  rationale: English POB의 최종 선택이 ‘bold’로 복귀되었으므로, 한국어도 과도한 도덕판정 없이 원문의 긴장감을 남겨 두는 것이 적절합니다.
  doctrine_reference: 지혜문학의 경구적 경고 표현
- issue: ‘영혼’의 번역
  chosen_reading: ψυχή는 여기서 인격 전체를 가리키는 생명/혼의 의미로 ‘영혼’으로 옮겼습니다.
  alternative_readings:
  - 목숨
  - 생명
  - 혼
  rationale: 부패하는 육체 이미지와 대조되는 존재 단위를 나타내므로, 한국어에서 익숙하면서도 본문의 장중함을 유지하는 ‘영혼’이 가장 적절합니다.
  doctrine_reference: 헬라어 ψυχή의 문맥적 용례
