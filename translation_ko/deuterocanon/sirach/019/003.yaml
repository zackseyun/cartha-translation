  - severity: low
    issue: ‘상속할’의 현대 한국어 용법
    rationale: 사람이 유산을 받는 뜻에서는 ‘상속받다’가 자연스럽고 명확합니다. 원문의 상속 비유는 그대로 보존됩니다.
  - severity: medium
