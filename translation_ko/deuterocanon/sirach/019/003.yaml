review_pass:
  verdict: revise
  source_fidelity: 그리스어 σήπη는 ‘썩은 것’이라는 사물보다 ‘썩음/부패’라는 부패 상태를 뜻하므로 ‘썩음’이 더 정확합니다. κληρονομήσουσιν은 상속의 비유를 유지하여 ‘상속받을’로 옮기는 편이 적절합니다. ἐξαρθήσεται는 단순한 제거·거둠을 뜻하며, ‘끌려가게’가 더하는 강제 이동의 뉘앙스는 피하는 것이 좋습니다.
  naturalness: ‘썩음과 구더기가’는 한국어에서 자연스럽고, ‘상속받을’은 ‘상속할’보다 현대 표준어 용법에 맞습니다. 본문의 경구적 어조와 합쇼체를 유지했습니다.
  terminology: ‘구더기’는 부패한 시신의 문맥에서 σκώληκες의 구체적 이미지를 잘 전달합니다. ψυχὴ τολμηρά는 영어 POB의 ‘bold soul’ 및 원문의 평가를 확정하지 않는 표현을 따라 ‘대담한 영혼’으로 유지했습니다.
