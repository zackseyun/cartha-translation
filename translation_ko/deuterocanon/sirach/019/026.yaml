    text: ‘이의 웃음’은 원문의 직역을 따른 것으로, 실제 의미는 웃는 표정이나 이를 드러내는 미소를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 이 절의 그리스어는 표현이 다소 이례적이어서, 의미를 매끈하게 풀기보다 이미지 자체를 최대한 보존했습니다.
    reason: textual_variant
