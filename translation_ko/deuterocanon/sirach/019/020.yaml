translation:
  language: ko
  text: 분별이 부족하지만 두려움을 지닌 사람이, 신중함이 풍부하면서도 율법을 어기는 사람보다 낫습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘두려워하는 사람’으로 옮길 수 있습니다. 문맥상 경외를 뜻할 가능성도 있으나, 헬라어는 두려움의 대상을 밝히지 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: κρείττων
  english_pob_choice: Better is
  chosen_korean: 더 낫습니다
  alternatives_korean:
  - 더 좋습니다
  - 우월합니다
  lexicon: LSJ
  rationale: 잠언형 비교문으로서 한국어에서는 자연스럽고 품위 있게 ‘더 낫습니다’가 가장 직접적입니다.
- source_word: ἡττώμενος
  english_pob_choice: one who is lacking
  chosen_korean: 지혜가 없으면서도
  alternatives_korean:
  - 부족한
  - 뒤처진
  - 열등한
  lexicon: LSJ
  rationale: 문맥상 ἡττώμενος는 단순 빈곤보다 ‘결핍됨/모자람’의 뜻이 핵심이므로, 뒤의 대조를 살려 ‘지혜가 없으면서도’로 풀어 의미를 드러냈습니다.
- source_word: ἐν συνέσει ἔμφοβος
  english_pob_choice: with understanding and fear
  chosen_korean: 깨달음과 두려움을 지닌
  alternatives_korean:
  - 깨달음과 경외를 지닌
  - 이해와 두려움 가운데 있는
  lexicon: LSJ
  rationale: ἐν συνέσει는 ‘깨달음/분별’의 상태를, ἔμφοβος는 대상이 명시되지 않은 ‘두려움’을 뜻하므로, 합쳐서 상태 서술형으로 옮겨 본문의 모호성을 보존했습니다.
- source_word: περισσεύων ἐν φρονήσει
  english_pob_choice: one who abounds in prudence
  chosen_korean: 지혜를 넉넉히 지니고도
  alternatives_korean:
  - 분별에 넘치고도
  - 신중함이 풍부하고도
  lexicon: LSJ
  rationale: φρόνησις는 실천적 지혜·신중함을 가리키므로 ‘지혜를 넉넉히 지니고도’로 자연스럽게 옮기되, 앞의 συνέσις와 중복되지 않게 했습니다.
- source_word: παραβαίνων νόμον
  english_pob_choice: transgresses the law
  chosen_korean: 율법을 어기는 자
  alternatives_korean:
  - 율법을 범하는 자
  - 법을 어기는 자
  lexicon: LSJ
  rationale: Sirach의 νόμος는 일반적 ‘법’보다 토라적 ‘율법’이 적절하며, παραβαίνω는 규범을 ‘어기다/범하다’의 의미를 분명히 갖습니다.
theological_decisions:
- issue: ἔμφοβος의 두려움을 하나님/주님에 대한 경외로 특정할지 여부
  chosen_reading: 대상이 명시되지 않은 ‘두려움’으로 유지했습니다.
  alternative_readings:
  - 하나님을 경외하는
  - 주님을 두려워하는
  rationale: 헬라어 본문은 두려움의 대상을 밝히지 않으므로, 지혜문학적 맥락의 가능성은 열어 두되 본문 밖 내용을 덧붙이지 않았습니다.
  doctrine_reference: 본문의 신학적 긴장을 보존합니다.
