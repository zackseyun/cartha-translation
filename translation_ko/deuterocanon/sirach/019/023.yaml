  text: 그는 고개를 숙이고 듣지 못하는 체합니다. 그를 알아보는 이가 없는 곳에서는 당신보다 먼저 행동합니다[a].[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그는 당신을 앞지릅니다.’ 여기서 그리스어 동사는 누군가보다 먼저 나서거나 먼저 행동하여 유리한 위치를 차지하는 뜻을 가집니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어 본문은 간결하고 다소 난해합니다. 뜻은, 속이는 사람이 눈에 띄지 않거나 알아보지 못하는 틈을 이용해 먼저 행동하여 유리한 위치를 차지한다는 것입니다.
    reason: textual_variant
