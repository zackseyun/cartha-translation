  source_fidelity: 개정이 필요합니다. 초안은 전반적으로 헬라어의 자세와 기만의 뜻을 잘 반영하지만, 각주 a가 ‘듣지 못하는 체하다’에 붙어 있으면서 그 내용은 προφθάσει(‘먼저 행동하다/앞서다’)에 관한 것이므로 각주 표지가 원어의 해당 어휘와 맞지 않습니다. 또한 ‘알아보지 못하는 곳’은 누가 알아보지 못하는지 불분명하여 수동형 οὐκ ἐπεγνώσθη의 뜻을 더 자연스럽게 밝혀 줄 필요가 있습니다.
  naturalness: ‘얼굴을 숙이고’는 가능하나 ‘고개를 숙이고’가 한국어에서 자세를 나타낼 때 더 자연스럽습니다. ‘귀먹은 체하다’보다 ‘듣지 못하는 체하다’가 현대의 중립적이고 자연스러운 표현입니다. ‘그를 알아보는 이가 없는 곳에서는’은 ‘그가 인정되지 않는 곳’이라는 뜻으로 오해될 여지를 피하면서도 원문의 상황적 표현을 유지합니다.
  terminology: 신학적 전문 용어는 없습니다. 기만의 태도는 본문이 직접 묘사하는 범위 안에서만 표현하고, προφθάσει는 ‘당신보다 먼저 행동합니다’로 옮겨 ‘속여 이긴다’라는 과도한 해석을 피했습니다. ‘앞지릅니다’는 각주상의 가능한 대안으로 남깁니다.
