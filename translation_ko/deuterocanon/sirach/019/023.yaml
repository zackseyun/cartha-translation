  text: He stoops his face and pretends to be deaf[a]; where he is not recognized[b], he will outwit you.
  footnotes:
  - marker: a
    text: Or 'he will forestall you' / 'he will outstrip you.' The Greek verb means to come before someone or gain an advantage by acting first.
    reason: lexical_alternative
  - marker: b
    text: The Greek text of this verse is terse and somewhat difficult; the sense is that a deceptive person adopts a humble or unresponsive posture in order to gain advantage when unnoticed or unrecognized.
    reason: textual_variant
translation:
  language: ko
  text: 그는 얼굴을 숙이고 귀먹은 체합니다[a]. 알아보지 못하는 곳에서 그는 당신을 앞지릅니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그는 당신보다 먼저 행동합니다’ / ‘그는 당신을 앞지릅니다.’ 여기서 그리스어 동사는 누군가보다 먼저 나서거나 먼저 행동하여 유리한 위치를 차지하는 뜻을 가집니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어 본문은 간결하고 다소 난해합니다. 뜻은, 속이는 사람이 눈에 띄지 않거나 알아보지 못하는 틈을 이용해 유리한 위치를 차지한다는 것입니다.
    reason: textual_variant
lexical_decisions:
- source_word: συγκύφων πρόσωπον
  english_pob_choice: He stoops his face
