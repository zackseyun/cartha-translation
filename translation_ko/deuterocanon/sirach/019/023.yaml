  rationale: 각주 a를 προφθάσει의 번역어에 연결하도록 옮기고, οὐκ ἐπεγνώσθη의 수동적 의미를 자연스러운 한국어로 명료화했습니다. ‘당신보다 먼저 행동합니다’는 προφθάσει의 기본적인 선행·선점의 뜻을 보존하며, 문맥상 기만의 함의는 본문 전체와 각주에서만 제한적으로 드러냅니다. [b]는 절 전체의 난해성을 설명하는 주석이므로 문장 끝에 두었습니다.
