  lexicon: LSJ
  rationale: ‘συγκύφων’은 몸과 얼굴을 숙이는 자세를 가리키므로, 현대 한국어에서는 자연스럽게 ‘얼굴을 숙이고’로 옮겨 외형적 겸손을 드러냈습니다.
