  - 들키지 않는 곳에서
  lexicon: LSJ
  rationale: 수동형의 기본 의미를 살리면서도 문맥상 ‘눈치채지 못한 상태/장소’를 드러내기 위해 ‘알아보지 못하는 곳에서’로 옮겼습니다.
- source_word: προφθάσει
  english_pob_choice: he will outwit you
  chosen_korean: 그는 당신을 앞지릅니다
  alternatives_korean:
  - 그는 당신보다 먼저 행동합니다
  - 그는 당신을 능가합니다
  lexicon: LSJ
  rationale: 본문의 동사는 ‘먼저 도착하다/선수를 치다’의 뜻이므로, 영어 POB의 ‘outwit’가 드러내는 기만적 선점을 한국어에서는 ‘앞지릅니다’로 간결하게 재현했습니다.
theological_decisions:
- issue: 이 구절의 문맥상 기만과 선점의 관계
  chosen_reading: 겉으로는 몸을 낮추고 듣지 못하는 체하지만, 알아보지 못하는 틈을 타 상대보다 먼저 유리한 위치를 차지하는 사람을 묘사합니다.
  alternative_readings:
  - 단순히 서두르는 사람의 모습으로 읽기
  - 물리적 앞섬만 강조하기
  rationale: 헬라어 동사의 선택과 영어 POB 주석이 모두 ‘먼저 움직여 이득을 취하는 기만’이라는 뉘앙스를 가리키므로, 도덕적 함의를 살려 번역했습니다.
  doctrine_reference: 지혜문학의 경계적 경고 — 언행의 위선과 속임수에 대한 분별
