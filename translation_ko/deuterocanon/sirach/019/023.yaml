  lexicon: LSJ
  rationale: 희귀 동사의 핵심은 실제 청력 상태가 아니라 ‘듣지 못하는 척하는’ 기만적 태도이므로, 구어적이면서도 의미가 분명한 ‘귀먹은 체합니다’를 선택했습니다.
- source_word: οὐκ ἐπεγνώσθη
