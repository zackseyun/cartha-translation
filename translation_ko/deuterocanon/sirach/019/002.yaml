translation:
  language: ko
  text: 포도주와 여자들은 마음을 경솔하게 만들고, 대담한 영혼은 그 영혼의 주인을 멸망시킵니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '그리스어: ‘포도주와 여자들은 분별 있는 이들을 그릇된 길로 돌이키고, 창녀들에게 붙어 있는 사람은 더욱 무모해질 것입니다.’ 히브리어 증거는 둘째 행에서 상당히 다릅니다.'
    reason: textual_variant
lexical_decisions:
- source_word: יַיִן
  english_pob_choice: Wine
  chosen_korean: 포도주
  alternatives_korean:
  - 술
  - 와인
  lexicon: HALOT
  rationale: 히브리어 יַיִן의 기본 의미는 포도주이므로, 현대 한국어에서 자연스럽고 구체적인 ‘포도주’로 옮겼습니다.
- source_word: וְנָשִׁים
  english_pob_choice: women
  chosen_korean: 여자들
  alternatives_korean:
  - 여인들
  - 부인들
  - 아내들
  lexicon: HALOT
  rationale: 히브리어 복수형 נָשִׁים은 일반적으로 ‘여자들/여인들’이며, 본문은 아내들로 제한하지 않으므로 ‘여자들’이 가장 직접적입니다.
- source_word: יַפְחִיזוּ לֵב
  english_pob_choice: lead the heart astray
  chosen_korean: 마음을 그릇되게 하고
  alternatives_korean:
  - 마음을 빗나가게 하고
  - 마음을 미혹하고
  - 마음을 방황하게 하고
  lexicon: HALOT
  rationale: יַפְחִיזוּ는 마음을 경솔하고 빗나가게 만드는 뜻으로, 단순한 ‘미혹’보다 도덕적·내적 일탈을 드러내는 ‘그릇되게 하다’가 히브리어의 효과를 잘 살립니다.
- source_word: נֶפֶשׁ עָזָה
  english_pob_choice: a bold soul
  chosen_korean: 담대한 영혼
  alternatives_korean:
  - 무모한 영혼
  - 거친 영혼
  - 용감한 영혼
  lexicon: HALOT
  rationale: עָזָה는 기본적으로 ‘대담한/강한’의 뜻이지만 여기서는 경고문맥상 과도한 담대함의 뉘앙스가 있어 ‘담대한’으로 옮겼습니다.
- source_word: בְעָלֶיהָ
  english_pob_choice: its owner
  chosen_korean: 그 소유자
  alternatives_korean:
  - 그 주인
  - 그것을 소유한 사람
  lexicon: HALOT
  rationale: 히브리어 בעל의 소유·귀속 관계를 살리되, ‘영혼’의 여성형 접미사를 반영하면서도 한국어에서는 자연스럽게 ‘그 소유자’로 옮겼습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행본문의 관계
  chosen_reading: 본문은 현존하는 히브리어를 따라 번역하고, 그리스어의 더 구체적인 ‘창녀들’ 표현은 본문에 흡수하지 않았습니다.
  alternative_readings:
  - ‘포도주와 여자들은 지혜로운 자들을 돌아서게 하고, 창녀들과 결합한 자는 더 무모해질 것입니다’처럼 그리스어를 따라가는 읽기
  rationale: 집단적·일반적 경고를 주는 히브리어가 본문의 직접 증거이며, 그리스어는 둘째 행에서 상당히 다르므로 이를 주본문으로 덮어쓰지 않았습니다.
  doctrine_reference: 'PHILOSOPHY.md: surviving Hebrew is primary; Greek parallel is retained only as an audit aid.'
