translation:
  language: ko
  text: 한 사람의 차림새와 그의 이의 웃음, 그리고 한 사람의 걸음은 그에 관한 것을 드러냅니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στολισμὸς
  english_pob_choice: attire
  chosen_korean: 차림새
  alternatives_korean:
  - 옷차림
  - 장식
  - 의복
  lexicon: LSJ
  rationale: 외형적 단장이라는 뜻을 살리면서도, 도덕적 ‘겉모습’으로 과도하게 좁히지 않는 자연스러운 현대 한국어로 옮겼습니다.
- source_word: γέλως ὀδόντων
  english_pob_choice: the laughter of his teeth
  chosen_korean: 이의 웃음
  alternatives_korean:
  - 치아의 웃음
  - 입가의 웃음
  - 이를 드러내는 웃음
  lexicon: LSJ
  rationale: 그리스어의 직설적인 이미지를 완전히 풀어버리지 않으면서도 한국어에서 읽히는 표현으로 옮겼습니다. 문자적 이질감을 남겨 두어 원문의 관용적 표현성을 보존합니다.
- source_word: βήματα ἀνθρώπου
  english_pob_choice: a person's steps
  chosen_korean: 한 사람의 걸음
  alternatives_korean:
  - 사람의 발걸음
  - 한 사람의 걸음걸이
  - 그 사람의 걸음
  lexicon: LSJ
  rationale: βήματα의 ‘걸음/발걸음’ 의미를 직접 살리되, ἀνθρώπου가 ἀνδρός보다 더 일반적이므로 ‘한 사람의’로 유지했습니다.
- source_word: ἀναγγέλλει τὰ περὶ αὐτοῦ
  english_pob_choice: proclaim what is about him
  chosen_korean: 그에 관한 것을 드러냅니다
  alternatives_korean:
  - 그에 관한 것을 알립니다
  - 그에 대해 말해 줍니다
  - 그와 관련된 것을 드러냅니다
  lexicon: LSJ
  rationale: ἀναγγέλλει의 ‘알리다/드러내다’ 기능을 반영하면서, τὰ περὶ αὐτοῦ를 인물의 성품이나 평판으로 너무 한정하지 않기 위해 포괄적으로 옮겼습니다.
