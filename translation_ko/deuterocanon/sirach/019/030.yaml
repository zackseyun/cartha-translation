  source_fidelity: 그리스어의 첫 ἀνδρός는 남성 단수인데 초안의 ‘한 사람’은 이를 중성화합니다. 또한 γέλως ὀδόντων을 ‘그의 이의 웃음’으로 옮긴 것은 직역적 흔적은 있으나 현대 한국어에서 소유 관계가 불분명하고 부자연스럽습니다. βήματα의 복수·집합적 뜻은 ‘발걸음’으로 자연스럽게 반영할 수 있습니다.
  naturalness: ‘그의 이의 웃음’은 한국어 관용에 맞지 않아 의미 전달이 어렵습니다. ‘그의 이가 드러나는 웃음’은 원문의 치아 이미지와 웃음의 관계를 유지하면서도 자연스럽습니다. ‘알려 줍니다’는 합쇼체에 맞고 ἀναγγέλλει의 알림·공개의 뜻을 무리 없이 살립니다.
  terminology: στολισμός는 ‘차림새’가 적절합니다. ἀνδρός는 ‘남자’, ἀνθρώπου는 ‘한 사람’으로 구별하여 원문의 어휘상 전환을 보존했습니다. γέλως ὀδόντων의 다소 특이한 표현은 본문에서 절제하여 풀고 각주에 직역과 대안을 제시합니다.
