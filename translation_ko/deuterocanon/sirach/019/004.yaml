    text: 또는 ‘자기 자신에게’나 ‘자기에게 해롭게’; 그리스어는 ‘자기 영혼에’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ταχὺ ἐμπιστεύων
  english_pob_choice: He who trusts too quickly
  chosen_korean: 너무 빨리 믿는 사람
  alternatives_korean:
  - 서둘러 믿는 사람
  - 성급하게 믿는 사람
  lexicon: LSJ
  rationale: ταχὺ와 ἐμπιστεύων의 결합은 경솔한 신뢰를 가리키므로, ‘너무 빨리 믿는’으로 속도와 경솔함을 함께 살렸습니다.
- source_word: κοῦφος καρδίᾳ
  english_pob_choice: light of heart
  chosen_korean: 마음이 가볍고
  alternatives_korean:
  - 가벼운 마음이고
  - 마음이 경솔하고
  - 마음이 들떠 있고
  lexicon: LSJ
  rationale: κοῦφος의 핵심 이미지인 ‘가벼움’을 살리되, 한국어에서는 ‘마음이 가볍다’가 경솔함과 내면의 불안정성을 자연스럽게 드러냅니다.
- source_word: εἰς ψυχὴν αὐτοῦ
  english_pob_choice: against his own soul
  chosen_korean: 자기 영혼에
  alternatives_korean:
  - 자기 자신에게
  - 자기 생명에
  - 자기 자신을 해치며
  lexicon: LSJ
  rationale: ψυχή를 ‘영혼’으로 옮겨 원문의 도덕·인간론적 긴장을 보존했고, εἰς는 여기서 자기에게 향하는 손상을 나타내므로 조사 구문으로 처리했습니다.
- source_word: πλημμελήσει
  english_pob_choice: will go astray
  chosen_korean: 길을 잘못 갑니다
  alternatives_korean:
  - 잘못됩니다
  - 그릇된 길로 갑니다
  - 실수합니다
  lexicon: LSJ
  rationale: πλημμελέω의 결과적·도덕적 어긋남을 한국어에서 가장 자연스럽게 드러내는 표현으로 ‘길을 잘못 갑니다’를 택했습니다.
theological_decisions:
- issue: ψυχή의 의미 범위
  chosen_reading: 영혼
  alternative_readings:
  - 자기 자신
  - 생명
  rationale: 지혜문맥에서 ψυχή는 넓게 ‘자기’ 또는 ‘생명’을 뜻할 수 있지만, 여기서는 죄가 자기 존재 깊숙한 곳을 해친다는 의미를 보존하기 위해 ‘영혼’을 유지했습니다.
  doctrine_reference: 의미 범위를 평탄화하지 않고, 본문의 인간론적 긴장을 보존합니다.
