  yaml_path: translation/deuterocanon/sirach/019/007.yaml
  text: Do not tell it to friend or foe[a], and if it is not a sin for you, do not reveal it.
  footnotes:
  - marker: a
    text: Or, more literally, 'with a friend and with an enemy do not recount, and if it is not a sin for you, do not reveal.' The Greek clause is terse; the main text brings out the likely sense that disclosure is permitted only if silence would be sinful.
    reason: alternative_reading
