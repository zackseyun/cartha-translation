  yaml_path: translation/deuterocanon/sirach/019/007.yaml
  text: Do not tell it to friend or foe[a], and if it is not a sin for you, do not reveal it.
  footnotes:
  - marker: a
    text: Or, more literally, 'with a friend and with an enemy do not recount, and if it is not a sin for you, do not reveal.' The Greek clause is terse; the main text brings out the likely sense that disclosure is permitted only if silence would be sinful.
    reason: alternative_reading
translation:
  language: ko
  text: 친구에게도 원수에게도 말하지 마십시오. 그리고 그것이 당신에게 죄가 되지 않는다면, 드러내지 마십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘친구와 원수 사이에서 말하지 말라’에 가깝습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν φίλῳ καὶ ἐν ἐχθρῷ
  english_pob_choice: to friend or foe
  chosen_korean: 친구에게도 원수에게도
  alternatives_korean:
  - 친구와 원수에게
  - 친구든 원수든
  - 친구나 원수에게
  lexicon: LSJ
  rationale: 두 여격은 말의 대상이 되는 상대를 가리키므로, 한국어에서는 ‘-에게도 … -에게도’로 대조를 살려 간결하게 옮겼습니다.
- source_word: μὴ διηγοῦ
  english_pob_choice: Do not tell it
  chosen_korean: 말하지 마십시오
  alternatives_korean:
  - 이야기하지 마십시오
  - 전하지 마십시오
  - 자세히 말하지 마십시오
  lexicon: BDAG
  rationale: 문맥상 어떤 일을 남에게 말하거나 전하는 뜻이므로, 현대 한국어에서 자연스럽고 직설적인 ‘말하지 마십시오’로 옮겼습니다.
- source_word: καὶ εἰ μή ἐστίν σοι ἁμαρτία
  english_pob_choice: and if it is not a sin for you
  chosen_korean: 그것이 당신에게 죄가 되지 않는다면
  alternatives_korean:
  - 당신에게 죄가 아니라면
  - 당신에게 죄가 되지 않는 한
  - 당신에게 죄가 아니면
  lexicon: LSJ
  rationale: 헬라어가 간결하고 다소 생략적이므로, 한국어에서는 조건절을 자연스럽게 풀어 ‘죄가 되지 않는다면’으로 옮겨 윤리를 분명히 했습니다.
- source_word: μὴ ἀποκάλυπτε
  english_pob_choice: do not reveal it
  chosen_korean: 드러내지 마십시오
  alternatives_korean:
  - 드러내지 마십시오
  - 밝히지 마십시오
  - 폭로하지 마십시오
  lexicon: BDAG
  rationale: ἀποκαλύπτω는 숨은 것을 드러내는 뜻이므로, 과장되지 않으면서도 비밀의 공개를 잘 나타내는 ‘드러내다’를 선택했습니다.
theological_decisions:
- issue: 가정형 절제와 예외 조건의 처리
  chosen_reading: ‘죄가 되지 않는다면’으로 옮겨, 말하지 말라는 금지와 필요한 경우의 예외 가능성을 함께 살렸습니다.
  alternative_readings:
  - 절대적 비밀 유지로 읽기
  - ‘죄가 아니라면’으로 더 문자적으로 옮기기
  rationale: 지혜문학의 간명한 경고를 살리되, 헬라어의 조건문이 갖는 윤리적 긴장을 평평하게 만들지 않도록 예외 가능성을 한국어에서도 남겼습니다.
  doctrine_reference: 'Translation philosophy §3: preserve theological tension rather than resolve it'
