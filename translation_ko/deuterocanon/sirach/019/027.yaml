  verdict: revise
  source_fidelity: 그리스어 συγκύφων πρόσωπον은 ‘얼굴을 숙이고’로 자연스럽게 옮길 수 있고, ἑτεροκωφῶν은 의도적으로 못 듣는 체하는 행동을 가리킵니다. ὅπου οὐκ ἐπεγνώσθη는 그가 알아보이지 않는 상황/곳이라는 뜻이므로, 기존의 ‘알아보이지 않는 곳’은 한국어에서 다소 부자연스럽고 주체 관계가 흐립니다. 이를 ‘자신을 알아보는 사람이 없는 곳에서는’으로 명확히 했습니다. προφθάσει의 ‘앞서게 됩니다’는 기본 의미를 보존합니다.
  naturalness: ‘얼굴을 낮추고’보다 ‘얼굴을 숙이고’가 현대 표준어에서 자연스럽습니다. 또한 ‘듣지 못하는 체하는’보다 ‘못 들은 척하는’이 일상적이면서도 원문의 가장한 태도를 정확히 전달합니다. 삽입 대시는 불필요하게 문장을 끊으므로 쉼표와 조건절로 정리했습니다.
  terminology: 신학적 전문 용어는 없습니다. ‘당신’과 합쇼체 종결은 원문의 단수 수신자와 요청된 현대적 격식을 유지합니다. 각주 a와 b는 각각 해당 어구 뒤에 붙여 어휘 대안을 명확히 가리키도록 배치했습니다.
