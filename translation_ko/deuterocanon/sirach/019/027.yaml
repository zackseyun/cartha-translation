  text: One who lowers his face and pretends not to hear—where he is not recognized, he will get ahead of you.
  footnotes:
  - marker: a
    text: Or 'acts deaf' for 'pretends not to hear'; the Greek participle depicts someone feigning deafness or turning a deaf ear.
    reason: lexical_alternative
  - marker: b
    text: Or 'he will outstrip you' / 'he will anticipate you'; the Greek verb means to come before someone, here likely in the sense of gaining advantage.
    reason: lexical_alternative
translation:
  language: ko
  text: 얼굴을 숙이고 못 들은 척하는 사람은[a] 자신을 알아보는 사람이 없는 곳에서는 당신보다 앞서게 됩니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘귀먹은 체하는’으로 옮길 수 있습니다. 그리스어 분사는 실제 청각 장애라기보다 의도적으로 못 들은 척하는 태도를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘당신보다 앞지를 것입니다’로 옮길 수 있습니다. 그리스어 동사는 여기서 먼저 나아가 우위를 점한다는 뜻을 띱니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: συγκύφων πρόσωπον
  english_pob_choice: lowers his face
  chosen_korean: 얼굴을 낮추고
  alternatives_korean:
  - 얼굴을 숙이고
  - 고개를 숙이고
  - 얼굴을 떨어뜨리고
  lexicon: LSJ
  rationale: 동작 자체는 ‘숙이다/낮추다’ 계열이지만, 한국어에서는 ‘얼굴을 낮추고’가 부자연스럽지 않으면서도 외형상의 비굴한 자세를 잘 드러냅니다.
- source_word: ἑτεροκωφῶν
  english_pob_choice: pretends not to hear
  chosen_korean: 듣지 못하는 체하는
  alternatives_korean:
  - 귀먹은 체하는
  - 못 들은 척하는
  - 귀를 닫는
  lexicon: LSJ
  rationale: 이 희귀 분사는 의도적으로 듣지 않는 시늉을 뜻하므로, 현대 한국어에서는 ‘듣지 못하는 체하는’이 가장 직접적이고 사회적 위선을 분명히 드러냅니다.
- source_word: οὐκ ἐπεγνώσθη
  english_pob_choice: he is not recognized
  chosen_korean: 알아보이지 않는 곳에서
  alternatives_korean:
  - 알려지지 않은 곳에서
  - 인정받지 못하는 곳에서
  - 그를 알아보지 못하는 곳에서
  lexicon: LSJ
  rationale: 수동형 ἐπεγνώσθη는 ‘알아보다/인식하다’의 의미를 가지므로, 장소 부사절 안에서 ‘알아보이지 않는 곳’으로 옮겨 사회적 미인식 상태를 살렸습니다.
- source_word: προφθάσει
  english_pob_choice: he will get ahead of you
  chosen_korean: 당신보다 앞서게 됩니다
  alternatives_korean:
  - 당신을 앞지르게 됩니다
  - 당신보다 먼저 가게 됩니다
  - 당신보다 앞서서 이깁니다
  lexicon: LSJ
  rationale: 직역의 ‘앞서다’는 προφθάνω의 핵심인 ‘먼저 도착하다/앞지르다’를 유지하면서, 본문이 말하는 기민한 우위 확보를 자연스럽게 전달합니다.
theological_decisions:
- issue: 잠언적 경계의 어조와 현대 한국어 문체
  chosen_reading: 직설적 진술로 옮기되, 경구의 비판적 뉘앙스를 살려 ‘듣지 못하는 체하는’처럼 위선을 드러내는 표현을 유지했습니다.
  alternative_readings:
  - 더 완곡한 경구체로 다듬기
  - 도덕적 교훈을 덧붙여 설명하기
  rationale: 시락의 교훈문은 독자가 사람의 위선적 처세를 즉시 알아차리도록 하는 것이 핵심이므로, 설명을 덧붙이기보다 관찰적 진술을 보존하는 편이 본문 의도에 가깝습니다.
  doctrine_reference: 지혜문학의 경계와 분별(시락 19장 맥락)
