lexical_decisions:
- source_word: μηδέποτε
  english_pob_choice: Never
  chosen_korean: 절대로
  alternatives_korean:
  - 결코
  - 아예
  - 한번도
  lexicon: LSJ
  rationale: 강한 부정 명령을 자연스러운 현대 한국어로 살리기 위해, 단순한 '아니'보다 금지의 강도를 드러내는 '절대로'를 선택했습니다.
- source_word: δευτερώσῃς λόγον
  english_pob_choice: repeat a word
  chosen_korean: 말을 되풀이하다
  alternatives_korean:
  - 말을 다시 하다
  - 한 말을 반복하다
  - 말을 두 번 하다
  lexicon: LSJ
  rationale: δευτερόω는 '두 번째로 하다/되풀이하다'의 뜻이며, λόγον은 여기서 '말' 또는 '말한 것'으로 읽히므로, 직역의 딱딱함을 피하면서도 반복 금지를 분명히 드러내는 표현을 택했습니다.
