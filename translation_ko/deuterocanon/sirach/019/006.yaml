  english_pob_choice: nothing
  chosen_korean: 아무것도
  alternatives_korean:
  - 아무 일도
  - 그 어떤 것도
  lexicon: LSJ
  rationale: 문맥상 '잃는 것'의 대상이 되는 전면 부정을 한국어 관용 표현인 '아무것도'로 옮겼습니다.
- source_word: οὐ μὴ ἐλαττονωθῇ
  english_pob_choice: will be taken from you
  chosen_korean: 잃지 않을 것입니다
  alternatives_korean:
  - 감해지지 않을 것입니다
  - 줄어들지 않을 것입니다
  - 빼앗기지 않을 것입니다
  lexicon: LSJ
  rationale: 강한 부정 οὐ μή와 수동형 ἐλαττονωθῇ는 '감해지다/줄어들다'의 의미이지만, 여기서는 결과적으로 '잃지 않는다'는 약속을 한국어로 가장 자연스럽게 전달했습니다.
theological_decisions:
- issue: 격언적 금지문의 어조
  chosen_reading: 직설적 권면으로 옮겨, 반복 발화가 가져올 손해를 경고하는 지혜문학의 톤을 유지했습니다.
  alternative_readings:
  - 완곡한 조언조로 약화
  - 도덕 훈계처럼 일반화
  rationale: 시락의 지혜 격언은 명령형과 약속형을 함께 써 청자를 직접 겨냥하므로, 이를 무디게 하지 않고 그대로 살리는 것이 본문의 기능에 맞습니다.
  doctrine_reference: 지혜문학의 격언체/훈계체
- issue: οὐ μὴ의 강한 부정
  chosen_reading: '''잃지 않을 것입니다''로 옮겨, 단순한 미래 부정이 아니라 확정적 보장을 드러냈습니다.'
  alternative_readings:
  - '''잃지 않습니다'''
  - '''감해지지 않습니다'''
  rationale: οὐ μή는 헬라어에서 강한 확정 부정이므로, 한국어에서도 미래형 보장을 분명히 나타내는 표현이 적절합니다.
  doctrine_reference: 헬라어 부정법의 강조 용법
