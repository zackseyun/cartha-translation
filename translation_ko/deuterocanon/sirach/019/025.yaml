  text: 사람은 그의 모습으로 알아볼 수 있고, 분별 있는 사람은 얼굴의 표정으로 알아볼 수 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 헬라어는 문자적으로 ‘얼굴의 만남/마주침으로부터’입니다. 이 말은 사람과 마주할 때 얼굴에 드러나는 인상을 가리키는 것으로 보입니다.
    reason: lexical_alternative
