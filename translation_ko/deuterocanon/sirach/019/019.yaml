  text: There is a wickedness that is also an abomination[a], and there is a fool lacking in wisdom.
  footnotes:
  - marker: a
    text: Or 'there is a fool lacking wisdom' or 'a fool diminished in wisdom.' The Greek participle can express deficiency more literally than the smoother English 'falls short.'
    reason: lexical_alternative
translation:
  language: ko
  text: 악한 일 중에서도 가증한 것이 있습니다. 또 어리석은 사람은 지혜가 부족합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘지혜가 부족한 어리석은 사람’으로도 옮길 수 있습니다. 그리스어 분사 ἐλαττούμενος는 단순히 ‘모자란다’보다 ‘결핍되다/부족하다’에 가깝습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: πονηρία
  english_pob_choice: wickedness
  chosen_korean: 악한 일
  alternatives_korean:
  - 악함
  - 악독함
  - 사악함
  lexicon: BDAG
  rationale: 여기서는 추상적 성향보다 실제로 드러나는 악한 행위를 가리키는 문맥이므로, 도덕적 판단을 살린 ‘악한 일’로 옮겼습니다.
- source_word: βδέλυγμα
  english_pob_choice: abomination
  chosen_korean: 가증한 것
  alternatives_korean:
  - 가증함
  - 혐오스러운 것
  - 역겨운 것
  lexicon: LEH
  rationale: 지혜문학에서 강한 혐오와 도덕적 배격을 나타내므로, 성경 한국어에서 널리 쓰이는 ‘가증한 것’이 가장 자연스럽고 무게도 유지합니다.
- source_word: ἄφρων
  english_pob_choice: fool
  chosen_korean: 어리석은 사람
  alternatives_korean:
  - 우매한 사람
  - 미련한 사람
  - 무분별한 사람
  lexicon: BDAG
  rationale: 단순한 지적 부족이 아니라 지혜의 범주에서의 어리석음을 가리키므로, 인격적 표현인 ‘어리석은 사람’으로 옮겼습니다.
- source_word: ἐλαττούμενος σοφίᾳ
  english_pob_choice: lacking in wisdom
  chosen_korean: 지혜가 부족합니다
  alternatives_korean:
  - 지혜에 미치지 못합니다
  - 지혜가 모자랍니다
  - 지혜에서 결핍되어 있습니다
  lexicon: LSJ
  rationale: 분사 ἐλαττούμενος는 ‘부족한/결여된’ 의미를 강하게 지니므로, 영어 POB의 ‘lacking in wisdom’에 맞춰 직설적으로 ‘지혜가 부족합니다’로 풀었습니다.
theological_decisions:
- issue: 지혜 부족을 단순 지적 한계가 아니라 도덕적·영적 상태로 보아야 하는지
  chosen_reading: 어리석은 사람은 지혜가 부족하다는 진술로 유지하되, 문맥상 이는 지혜문학의 도덕적 평가를 담는 표현으로 읽게 했습니다.
  alternative_readings:
  - 단순히 지적인 미숙함
  - 성격적 성급함에 대한 진술
  rationale: Sirach의 ‘어리석은 사람’은 정보 부족이 아니라 하나님의 지혜에 부합하지 않는 삶의 상태를 가리키는 표현입니다.
  doctrine_reference: 지혜문학의 도덕적 분별, 잠언/집회서의 어리석음 개념
