  text: There is a wickedness that is also an abomination[a], and there is a fool lacking in wisdom.
  footnotes:
  - marker: a
    text: Or 'there is a fool lacking wisdom' or 'a fool diminished in wisdom.' The Greek participle can express deficiency more literally than the smoother English 'falls short.'
