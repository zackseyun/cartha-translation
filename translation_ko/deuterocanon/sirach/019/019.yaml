  source_fidelity: 첫 절의 πονηρία는 ‘악한 일 중에서도’라는 범주 표현이 아니라 ‘악함/사악함’ 자체입니다. 또한 καὶ αὕτη는 그 악함을 다시 가리켜 ‘이것도 가증한 것이다’라고 말합니다. 현 번역은 이를 ‘악한 일 중에서도 가증한 것’으로 바꾸어 원문의 지시와 서술 관계를 바꿉니다. δεύτε 절은 ‘지혜가 부족한 어리석은 사람’으로 적절히 옮길 수 있습니다.
  naturalness: 수정문은 현대 표준 한국어의 합쇼체를 유지하면서도 원문의 병렬 구조를 자연스럽게 드러냅니다. ‘악함’은 추상 명사로 다소 문어적이지만, 이 문맥에서는 πονηρία의 도덕적 추상성을 보존하는 데 알맞습니다.
  terminology: βδέλυγμα는 ‘가증한 것’으로 유지하여 성경적 도덕적 혐오의 강도를 보존했습니다. ἄφρων은 ‘어리석은 사람’, σοφία는 ‘지혜’로 일관되게 옮겼습니다. 각주에는 ἐλαττούμενος의 ‘부족함’ 및 더 직역적인 ‘미치지 못함’의 여지를 반영했습니다.
