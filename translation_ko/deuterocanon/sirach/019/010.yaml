  text: A fool will suffer pangs at the sight of a word[a], like a woman in labor at the sight of a baby.
  footnotes:
  - marker: a
    text: 'Literally, ''from the face/presence of a word ... as from the face/presence of a baby.'' The Greek idiom expresses cause: the fool is seized with pain on account of a word, as a woman giving birth is on account of the baby.'
    reason: lexical_alternative
translation:
  language: ko
  text: 어리석은 자는 말 한마디 때문에[a] 진통을 겪습니다. 이는 아기 때문에 진통을 겪는 해산하는 여인과 같습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘말의 얼굴/앞에서 … 아기의 얼굴/앞에서’입니다. 이 그리스어 표현은 여기서 원인 또는 계기를 나타내므로, 두 경우 모두 ‘~ 때문에’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ προσώπου
  english_pob_choice: because of / at the sight of
  chosen_korean: ~때문에
  alternatives_korean:
  - ~앞에서
  - ~을 보고
  - ~의 현존 앞에서
  lexicon: LSJ
  rationale: 직역하면 ‘~의 얼굴/앞에서’이지만, 문맥상 원인·계기의 뜻을 나타내므로 한국어에서는 자연스럽게 원인 표지 ‘~때문에’로 옮기는 것이 가장 분명합니다.
- source_word: λόγου
