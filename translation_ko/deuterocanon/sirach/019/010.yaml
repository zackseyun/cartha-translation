  chosen_korean: 한 마디 말
  alternatives_korean:
  - 말 한 마디
  - 한 말
  - 한 소식
  lexicon: LSJ
  rationale: λόγος는 여기서 단일한 말/발화를 가리키므로, 짧고 격언적인 뉘앙스를 살리는 ‘한 마디 말’이 가장 적절합니다.
- source_word: ὠδινήσει
  english_pob_choice: will suffer pangs
  chosen_korean: 진통을 겪습니다
  alternatives_korean:
  - 산고를 겪습니다
  - 심한 고통을 겪습니다
  - 몸부림칩니다
  lexicon: LSJ
  rationale: 출산 진통의 이미지를 직접 살리면서도, 뒤의 비교절과 대응되게 ‘진통을 겪다’로 옮겼습니다.
- source_word: ἡ τίκτουσα
  english_pob_choice: a woman in labor
  chosen_korean: 아이를 낳는 여인
  alternatives_korean:
  - 해산하는 여인
  - 출산하는 여인
  - 애를 낳는 여인
  lexicon: LSJ
  rationale: 직역에 가까운 ‘낳는 여인’으로 출산 행위를 분명히 드러내면서, 현대 한국어에서 자연스럽게 읽히도록 했습니다.
theological_decisions:
- issue: 지혜문학의 비유 강도와 어조
  chosen_reading: 어리석은 자가 ‘말’ 하나에 진통하듯 반응하는 과장된 지혜 격언으로 읽었습니다.
  alternative_readings:
  - 단순히 ‘몹시 괴로워한다’는 일반적 진술로 완화하는 읽기
  - ‘말씀’으로 좁혀 종교적 발화로 한정하는 읽기
  rationale: 본문은 출산 진통의 강한 비유를 통해 어리석음의 과민성과 취약성을 드러내므로, 이를 약화하지 않고 그대로 살렸습니다.
  doctrine_reference: 지혜문학 해석 원리
- issue: ‘말’의 범위
  chosen_reading: λόγος를 특정한 ‘말씀’이 아니라 일반적인 ‘말/한 마디 말’로 옮겼습니다.
  alternative_readings:
  - 예언적 ‘말씀’으로 번역하는 읽기
  - ‘사건’이나 ‘소문’으로 확장하는 읽기
  rationale: 원문은 단수 ‘λόγου’로서 어떤 발화나 한 마디 말이 유발하는 반응을 가리키므로, 문맥을 넘어서 종교적 전문어로 고정하지 않았습니다.
  doctrine_reference: 문맥 우선 번역 원칙
