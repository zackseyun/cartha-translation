  text: Question a friend[a], perhaps he did not do it; and if he did do something, so that he may not add to it.
  footnotes:
  - marker: a
    text: Or, 'Reprove a friend … lest he add to it.' The opening verb can mean 'reprove' or 'confront,' and the final clause may be understood more sharply as a warning against repeating or increasing the act.
    reason: lexical_alternative
translation:
  language: ko
  text: 친구를 따져 보십시오[a]. 혹시 그가 그 일을 하지 않았을지도 모릅니다. 그가 그 일을 했다면, 다시는 그 일을 하지 않도록 하십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘친구를 책망하십시오’ 또는 ‘친구를 대면하여 따져 보십시오.’ 시작 동사는 ‘책망하다’, ‘드러내다’, 또는 사실을 확인하기 위해 따져 묻는다는 뜻일 수 있습니다. 끝 절은 문자적으로 ‘더하지 않도록’이며, 그 일을 더 행하거나 되풀이하지 말라는 뜻으로 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔλεγξον
  english_pob_choice: Question
  chosen_korean: 따져 보십시오
  alternatives_korean:
  - 질문하십시오
  - 책망하십시오
  - 대면하십시오
  lexicon: LSJ
  rationale: 이 명령형은 단순한 질책보다 사실 여부를 확인하는 대면의 뉘앙스를 가지므로, 문맥상 ‘따져 보십시오’가 조사와 경계의 힘을 함께 살립니다.
- source_word: μή ποτε
  english_pob_choice: perhaps
  chosen_korean: 혹시
  alternatives_korean:
  - 아마
  - 혹은
  - 만에 하나
  lexicon: LSJ
  rationale: 여기서는 금지적 ‘~하지 않도록’보다 가능성의 유보를 나타내므로, 현대 한국어에서 자연스럽게 불확실성을 드러내는 ‘혹시’가 적절합니다.
- source_word: ἐποίησεν
  english_pob_choice: he did it / did do something
  chosen_korean: 그것을 하지 않았을지도 모릅니다 / 무엇인가를 했다면
  alternatives_korean:
  - 그 일을 하지 않았을지도 모릅니다
  - 무언가를 했다면
  - 그 일을 했다면
  lexicon: LSJ
  rationale: 첫 절의 미확정된 행위를 ‘그것’으로 받고, 둘째 절의 τι는 특정 행위가 아니라 ‘무엇인가’로 옮겨 대조를 보존했습니다.
- source_word: προσθῇ
  english_pob_choice: add to it
  chosen_korean: 그것을 더하지 않도록 하십시오
  alternatives_korean:
  - 그 일을 반복하지 않도록 하십시오
  - 그것에 덧붙이지 않도록 하십시오
  - 더 나아가지 않도록 하십시오
  lexicon: LSJ
  rationale: προστίθημι의 기본 이미지인 ‘더하다’를 유지하되, 윤리적 문맥에서의 ‘계속해서 늘리다/덧붙이다’라는 의미가 드러나도록 자연스럽게 표현했습니다.
theological_decisions:
- issue: 마지막 절의 경계 표현
  chosen_reading: 행위를 더하지 않도록 하는 경고로 읽었습니다.
  alternative_readings:
  - 그 행동을 반복하지 않도록 하는 경고
