  source_fidelity: 원문의 ὀλισθάνων은 여기서 일반적인 실수·과오를 가리키며, οὐκ ἀπὸ ψυχῆς는 문맥상 고의성의 부정을 나타냅니다. 초안의 ‘영혼에서 비롯되지 않은 사람’은 수식 관계가 부자연스럽고 ‘넘어지다’의 은유적 의미도 충분히 드러나지 않습니다. 수정문은 비고의적 실수라는 본문 뜻을 본문에서 자연스럽게 제시하고, 직역상 표현은 각주에서 보존합니다.
  naturalness: ‘의도하지 않고 실수하는 사람’과 ‘죄를 지은 적이 없는 사람이 누구이겠습니까?’는 현대 표준 한국어 합쇼체의 경구적 문맥에 자연스럽습니다. ‘자기 혀로’는 원문의 신체 은유를 유지하면서도 어색하지 않습니다.
  terminology: ἁμαρτάνω는 도덕적 무게를 보존하여 ‘죄를 짓다’로 옮겼습니다. ψυχή는 이 문맥에서 단순한 ‘영혼’이라는 한국어 신학 용어로 본문에 직역하기보다 ‘의도하지 않고’로 뜻을 옮기고, 각주에서 ‘영혼/자기 자신’의 문자적 표현을 밝혔습니다.
