  lexicon: LSJ
  rationale: 속담형 문맥에서 ὀλισθάνων은 문자 그대로의 물리적 추락보다 도덕적·언어적 실수의 은유로 읽히므로, 한국어에서는 간결하게 ‘넘어지되’로 풀어 자연스러운 경구체를 살렸습니다.
- source_word: οὐκ ἀπὸ ψυχῆς
  english_pob_choice: not mean it
  chosen_korean: 영혼에서 비롯되지 않은
  alternatives_korean:
  - 의도하지 않은
  - 마음에서 우러나지 않은
  - 진심에서 나온 것이 아닌
  lexicon: LSJ
  rationale: 본문은 직역하면 ‘영혼/자기 자신에서부터가 아닌’이므로, POB가 해석한 ‘not mean it’의 뜻을 완전히 평탄화하기보다 출발점의 뉘앙스를 살려 ‘영혼에서 비롯되지 않은’으로 옮겼습니다.
- source_word: τίς οὐχ ἥμαρτεν ἐν τῇ γλώσσῃ αὐτοῦ
  english_pob_choice: who has not sinned with his tongue
  chosen_korean: 자기 혀로 죄를 짓지 않은 사람이 누구이겠습니까?
  alternatives_korean:
  - 자기 혀로 죄를 범하지 않은 사람이 누구이겠습니까?
  - 말로 죄짓지 않은 사람이 누구이겠습니까?
  lexicon: LSJ
  rationale: ἁμαρτάνω의 도덕적 무게를 살리기 위해 ‘죄를 짓다’를 택했고, ἐν τῇ γλώσσῃ αὐτοῦ는 신체 은유를 유지하면서 한국어에서는 ‘자기 혀로’가 가장 자연스럽습니다.
