  verdict: revise
  source_fidelity: Ἔλεγξον은 이 문맥에서 사실을 확인하기 위해 친구에게 따져 묻는 뜻과, 사실일 경우 바로잡기 위해 책망하는 뜻을 모두 가질 수 있습니다. 기존의 ‘친구를 따져 보십시오’는 친구 자체를 평가·검토한다는 뜻으로도 읽혀, 말한 사실을 확인한다는 문맥을 충분히 드러내지 못합니다. 또한 ‘반복하지 못하게’는 원문의 목적절보다 다소 강한 물리적 저지의 뉘앙스를 낼 수 있습니다.
  naturalness: ‘친구에게 따져 물어보십시오’는 현대 표준어 합쇼체로 자연스럽고, 이어지는 ‘그가 그런 말을 하지 않았을 수도 있으니’와 잘 연결됩니다. ‘다시 그런 말을 하지 않게 하십시오’도 조건이 충족될 때의 교정 목적을 자연스럽게 표현합니다.
  terminology: 특별한 신학 용어는 없습니다. Ἔλεγξον의 의미 범위는 본문에서 조사적 표현을 택하되, 각주의 대안에 ‘꾸짖으십시오’를 포함하여 보존하는 것이 적절합니다. 기존 각주의 ‘친구를 질문하십시오’는 한국어 결합상 부자연스러우므로 ‘친구에게 물어보십시오’로 고칩니다.
