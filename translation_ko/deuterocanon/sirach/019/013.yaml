  text: Reprove a friend[a], lest perhaps he did not say it; and if he did say it, so that he may not repeat it.
  footnotes:
  - marker: a
    text: Or, 'Reprove a friend'; the Greek imperative can carry either an investigatory sense ('question/examine') or a corrective sense ('reprove'). The following clause favors first verifying the matter.
    reason: lexical_alternative
translation:
  language: ko
  text: 친구를 따져 보십시오.[a] 그가 그런 말을 하지 않았을 수도 있으니, 만일 그가 실제로 말했다면 다시 반복하지 못하게 하십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘친구를 질문하십시오/조사하십시오’; Ἔλεγξον은 문맥에 따라 ‘따지다’보다 조사하는 뜻을 띨 수 있으며, 뒤 절이 먼저 사실을 확인하라고 암시합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔλεγξον
  english_pob_choice: Reprove / Question
  chosen_korean: 따져 보십시오
  alternatives_korean:
  - 질책하십시오
  - 꾸짖으십시오
  - 물어보십시오
  lexicon: LSJ
  rationale: ἐλέγχω는 문맥에 따라 드러내다, 조사하다, 책망하다의 범위를 가지며, 뒤의 절이 먼저 사실 확인을 요구하므로 ‘따져 보십시오’가 조사와 책망의 긴장을 함께 살립니다.
- source_word: τὸν φίλον
  english_pob_choice: a friend
  chosen_korean: 친구를
  alternatives_korean:
  - 한 친구를
  - 그 친구를
  lexicon: LSJ
  rationale: 격언적 문맥에서 φίλος는 특정 인물보다 관계적 대상 일반을 가리키므로, 자연스러운 한국어로 ‘친구를’이라고 옮겼습니다.
- source_word: μή ποτε
  english_pob_choice: perhaps / lest perhaps
  chosen_korean: 그런 말을 하지 않았을 수도 있으니
  alternatives_korean:
  - 혹시 그가 말하지 않았을 수도 있으니
  - 만일 그가 말하지 않았을지도 모르니
  lexicon: LSJ
  rationale: μή ποτε는 여기서 경고적 가능성을 도입하므로, 단순한 ‘혹시’보다 문맥상 분명한 추정 표현으로 풀어 사실 확인의 뉘앙스를 살렸습니다.
- source_word: ἵνα μὴ δευτερώσῃ
  english_pob_choice: so that he may not repeat it
  chosen_korean: 다시 반복하지 못하게 하십시오
  alternatives_korean:
  - 그것을 다시 말하지 못하게 하십시오
  - 그가 그것을 재차 말하지 않게 하십시오
  lexicon: LSJ
  rationale: δευτερόω는 ‘두 번째로 하다/말하다’의 뜻이므로, 발화 맥락에서 ‘다시 반복하다’가 가장 자연스럽고 목적절의 기능도 분명히 드러냅니다.
theological_decisions:
- issue: 훈계/검증의 순서
  chosen_reading: 본문은 친구를 성급히 단정적으로 책망하기보다, 먼저 사실 여부를 확인한 뒤 필요한 경우 바로잡으라고 권합니다.
  alternative_readings:
  - 처음부터 단순히 책망하는 권면
  - 오류를 먼저 확인하는 조사적 권면
  rationale: 뒤 절의 '그가 그런 말을 하지 않았을 수도 있으니'가 앞 명령의 의미를 제한하므로, 책망과 조사 중 조사적 선행을 본문 흐름에 맞게 드러냈습니다.
  doctrine_reference: 지혜문학의 권면 해석 원칙
- issue: 직접화법의 공손한 명령형
  chosen_reading: 직접적 권면이므로 합쇼체 명령형('...하십시오')을 유지했습니다.
  alternative_readings:
  - 완곡한 청유형
  - 더 강한 명령형
  rationale: 독자에게 주는 교훈적 문장으로서 현대 표준어 합쇼체가 적절하며, 본문의 훈계성을 과도하게 약화시키지 않습니다.
  doctrine_reference: Korean style policy
