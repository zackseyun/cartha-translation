    reason: source_note
lexical_decisions:
- source_word: פּוֹעֵל
  english_pob_choice: A worker
  chosen_korean: 종사하는 사람
  alternatives_korean:
  - 일하는 사람
  - 일꾼
  - 노동자
  lexicon: פעל
  rationale: 히브리어 פּוֹעֵל은 단순 직업명보다 ‘어떤 일에 종사하는 자’라는 지속적 행위를 가리키므로, 문맥상 자연스럽고 중립적인 ‘종사하는 사람’으로 옮겼습니다.
- source_word: זֹאת
  english_pob_choice: in this
  chosen_korean: 이 일에
  alternatives_korean:
  - 이것에
  - 이 일에서
  - 이것을
  lexicon: זאת
  rationale: 지시대명사 זֹאת는 바로 앞뒤 문맥에서 암시되는 특정 행위를 가리키므로, 한국어에서는 ‘이 일에’로 풀어 주어 의미 연결을 분명히 했습니다.
- source_word: מְעוּטִים
  english_pob_choice: small things
  chosen_korean: 작은 것들
  alternatives_korean:
  - 적은 것들
  - 하찮은 것들
  - 미미한 것들
  lexicon: מעט
  rationale: מְעוּטִים은 수량이 적거나 사소한 것들을 뜻하므로, 가치 절하의 뉘앙스를 살리되 과도한 해석을 피하는 ‘작은 것들’이 적절합니다.
- source_word: יִתְעַרְעָר
  english_pob_choice: will be ruined
  chosen_korean: 점점 무너집니다
  alternatives_korean:
  - 망할 것입니다
  - 무너질 것입니다
  - 흔들릴 것입니다
  lexicon: ערער
  rationale: 동사 יִתְעַרְעָר는 단번의 파멸보다 불안정해져 붕괴되는 과정을 나타내므로, ‘점점 무너집니다’로 점진성을 드러냈습니다.
theological_decisions:
- issue: 속담적 경고문의 어조
  chosen_reading: 지혜문학의 일반 경고로 읽고, 미래형 예언보다 보편 진술의 현재적 효력을 살려 번역했습니다.
  alternative_readings:
  - 직설적 미래 경고로 번역
  - 도덕적 권고문으로 완화
  rationale: 이 절은 특정 사건 예고가 아니라 삶의 원리를 말하는 지혜 격언이므로, 합쇼체로 평이하게 진술하되 경고의 강도는 유지하는 것이 본문 의도에 부합합니다.
  doctrine_reference: 지혜문학의 격언적 일반화
- issue: ‘작은 것들’을 업신여기는 태도
  chosen_reading: 단순히 ‘소액’을 무시하는 경제적 발언이 아니라, 사소해 보이는 것의 가치를 경시하는 태도로 이해했습니다.
  alternative_readings:
  - 가난한 사람들을 경시하는 뜻
  - 재물의 작은 부분을 경시하는 뜻
  rationale: 히브리어와 그리스어 모두 ‘작은 것들’을 경멸하는 자세를 말하므로, 의미를 좁혀 특정 계층 비판으로 만들지 않고 본문이 허용하는 일반 윤리를 살렸습니다.
  doctrine_reference: 지혜문학 윤리
