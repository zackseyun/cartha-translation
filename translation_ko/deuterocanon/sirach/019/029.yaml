lexical_decisions:
- source_word: ἀπὸ ὁράσεως
  english_pob_choice: from appearance
  chosen_korean: 외모로
  alternatives_korean:
  - 겉모습으로
  - 보이는 모습으로
  - 겉보기로
  lexicon: LSJ
  rationale: 보이는 바를 가리키는 간결한 속담 표현으로 자연스럽고, 단순한 '보기' 행위가 아니라 사람의 드러난 외형을 가리킨다는 점을 살렸습니다.
- source_word: ἐπιγνωσθήσεται
  english_pob_choice: will be recognized
  chosen_korean: 알려집니다
  alternatives_korean:
  - 알려질 것입니다
  - 인정받습니다
  - 알아봅니다
  lexicon: BDAG
  rationale: 수동형의 외적 식별 의미를 한국어 속담체로 자연스럽게 옮기기 위해 '알려집니다'를 택했습니다.
- source_word: ἀπαντήσεως προσώπου
  english_pob_choice: the expression of the face
  chosen_korean: 얼굴의 표정
  alternatives_korean:
  - 얼굴의 마주침
  - 낯의 태도
  - 얼굴의 기색
  lexicon: LSJ
  rationale: 문맥상 얼굴에 드러나는 태도와 표정을 가리키므로, 현대 한국어에서 뜻이 분명한 '얼굴의 표정'으로 옮겼습니다.
- source_word: νοήμων
  english_pob_choice: one who has understanding
  chosen_korean: 깨달음이 있는 사람
  alternatives_korean:
  - 분별이 있는 사람
  - 이해력이 있는 사람
  - 통찰력이 있는 사람
  lexicon: LSJ
  rationale: 지혜문학의 성격을 살려 단순 지능보다 분별과 이해를 함께 담는 표현으로 옮겼습니다.
theological_decisions:
- issue: 잠언적 진술의 일반성
  chosen_reading: 이 절을 보편적 관찰 진술로 유지하여, 외모와 얼굴 표정이 사람의 성향을 드러낸다는 속담적 의미를 살렸습니다.
  alternative_readings:
  - 도덕적 판단을 강하게 부각하는 해석
  - 사회적 위계 판단으로 좁히는 해석
  rationale: 문맥은 교리 진술이 아니라 지혜문학의 관찰형 격언이므로, 일반적이고 절제된 표현이 원문 의도를 가장 잘 반영합니다.
  doctrine_reference: 지혜문학의 격언적 일반화
