review_pass:
  verdict: revise
  source_fidelity: 첫 절의 ἀνήρ는 속담적 단수 남성명사이므로 ‘사람’보다 ‘한 남자’가 원문의 형태를 더 잘 보존합니다. ἐπιγνωσθήσεται의 외적 식별 의미는 한국어에서 ‘알려지다’보다 ‘알아볼 수 있다’가 더 정확하고 자연스럽습니다. δεύτε clause의 νοήμων은 영적·체험적 ‘깨달음’보다 판단력과 통찰을 뜻하므로 ‘분별 있는 사람’이 적절합니다.
  naturalness: ‘한 남자는 외모로 알아볼 수 있고, 분별 있는 사람은 얼굴 표정으로 알아볼 수 있습니다’는 현대 표준 한국어 합쇼체로 자연스럽고, 격언의 일반적 진술도 유지합니다.
  terminology: ‘외모’는 ὁράσεως의 보이는 모습이라는 뜻을 무리 없이 반영합니다. ‘얼굴 표정’은 ἀπαντήσεως προσώπου의 관용적 의미를 잘 전달하며, 각주에서는 ‘얼굴의 태도’라는 대안을 제시할 수 있습니다. νοήμων에는 ‘분별 있는’이 가장 알맞습니다.
  issues:
  - severity: medium
    issue: ‘깨달음이 있는 사람’
    rationale: νοήμων은 이해력·분별력·통찰력을 뜻하며, ‘깨달음’은 종교적 또는 체험적 각성의 뉘앙스를 더하여 어휘 의미를 좁힐 수 있습니다.
  - severity: medium
    issue: ‘알려집니다’
    rationale: 원문의 ἐπιγνωσθήσεται는 타인이 외적 단서를 통해 식별하거나 알아본다는 뜻입니다. ‘알려지다’는 단순히 널리 알려지거나 드러나는 뜻으로도 읽히므로 ‘알아볼 수 있다’가 더 분명합니다.
  - severity: low
    issue: 첫 절의 ‘사람’
    rationale: ἀνήρ의 단수 남성형을 반영하려면 격언적 용법 안에서도 ‘한 남자’가 더 충실합니다.
  revised_text: 한 남자는 외모로 알아볼 수 있고, 분별 있는 사람은 얼굴 표정[a]으로 알아볼 수 있습니다.
