- from: 외모로 사람은 알려지고, 얼굴의 표정으로 깨달음이 있는 사람도 알려집니다.[a]
  to: 한 남자는 외모로 알아볼 수 있고, 분별 있는 사람은 얼굴 표정[a]으로 알아볼 수 있습니다.
  rationale: 원문의 병행 구조와 외적 식별의 의미를 유지하면서, νοήμων의 지혜문학적 의미를 ‘분별 있는’으로 바로잡았습니다. 각주는 ἀπαντήσεως προσώπου의 가능한 대안적 표현만 간결하게 제시하도록 앵커와 범위를 정리했습니다.
