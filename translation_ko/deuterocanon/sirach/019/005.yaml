  text: Whoever rejoices in heart will be condemned[b][a], and whoever hates talk is lessened by evil.
  footnotes:
  - marker: a
    text: Greek λαλιάν can also be rendered 'talkativeness' or 'babbling'; the sense is likely excessive or idle speech rather than speech in general.
    reason: lexical_alternative
  - marker: b
    text: 'The Greek text is terse in the second clause: ''is diminished by evil'' could also be understood as ''is reduced through wickedness'' or, less likely, ''is diminished in evil.'''
    reason: alternative_reading
translation:
  language: ko
  text: 마음으로 기뻐하는 사람은 정죄될 것이며, 말을 싫어하는 사람은 악으로 인해 더 줄어듭니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
