lexical_decisions:
- source_word: ὁ εὐφραινόμενος καρδίᾳ
  english_pob_choice: Whoever rejoices in heart
  chosen_korean: 마음으로 기뻐하는 사람
  alternatives_korean:
  - 마음에 기뻐하는 사람
  - 속으로 즐거워하는 사람
  lexicon: LSJ
  rationale: 보편적 잠언 표현으로 옮기되 καρδίᾳ를 한국어 관용에 맞게 ‘마음으로’ 처리하여 내적 상태를 살렸습니다.
- source_word: καταγνωσθήσεται
  english_pob_choice: will be condemned
  chosen_korean: 정죄될 것이며
  alternatives_korean:
  - 유죄 판결을 받을 것이며
  - 정죄받을 것이며
  lexicon: LSJ
  rationale: 판결적·사법적 뉘앙스를 살리면서도 한국어 합쇼체 문맥에서 자연스럽게 읽히는 ‘정죄될’로 옮겼습니다.
- source_word: ὁ μισῶν λαλιάν
  english_pob_choice: whoever hates talk
  chosen_korean: 말을 싫어하는 사람
  alternatives_korean:
  - 말하기를 싫어하는 사람
  - 수다를 싫어하는 사람
  lexicon: LSJ
  rationale: λαλιὰν의 핵심이 일반적 ‘말’이라기보다 쓸데없는 말의 성향일 수 있으나, 본문 자체의 간결성을 살려 우선 ‘말’을 택하고 과도한 해석은 피했습니다.
- source_word: ἐλαττονοῦται κακίᾳ
  english_pob_choice: is lessened by evil
  chosen_korean: 악으로 인해 더 줄어듭니다
  alternatives_korean:
  - 악 때문에 더 작아집니다
  - 악으로 말미암아 줄어듭니다
  lexicon: LSJ
  rationale: 수동적 ‘감소됨’과 원인의 여격 κακίᾳ를 함께 살려, 악이 그 사람을 실제로 약화시키는 결과를 드러내는 방향으로 옮겼습니다.
theological_decisions:
- issue: 지혜 문학의 경고적 진술을 직설적 미래형으로 보존할지 여부
  chosen_reading: ‘정죄될 것이며’로 옮겨 도덕적 경고이자 사법적 선언의 톤을 유지했습니다.
  alternative_readings:
  - ‘책망받을 것입니다’
  - ‘유죄로 드러날 것입니다’
  rationale: καταγνωσθήσεται는 단순한 꾸지람보다 판결·유죄 선고의 의미가 강하므로, 본문의 경고성을 약화시키지 않는 번역을 택했습니다.
  doctrine_reference: 잠언적 지혜의 경고와 심판 언어
