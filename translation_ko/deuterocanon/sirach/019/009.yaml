  text: Have you heard a word? Let it die with you[a]; take courage[b], it will not burst you open.
  footnotes:
  - marker: a
    text: Or 'a matter' or 'a report' for 'a word' (λόγον).
    reason: lexical_alternative
  - marker: b
    text: 'The Greek image is vivid: ''it will not burst you open,'' meaning the secret will not destroy you if you keep it.'
    reason: cultural_note
translation:
  language: ko
  text: 말을 들으셨습니까? 그것은 당신과 함께 죽게 하십시오[a]. 용기를 내십시오[b]. 그것이 당신을 터뜨려 놓지는 못할 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘사연’, ‘보고’로도 옮길 수 있습니다(λόγον).
    reason: lexical_alternative
  - marker: b
    text: 그리스어의 이미지는 매우 생생합니다. 곧 ‘당신을 터뜨려 놓지 않는다’는 뜻으로, 비밀을 지키면 그것이 당신을 무너뜨리지 않는다는 말입니다.
    reason: cultural_note
lexical_decisions:
- source_word: ἀκήκοας λόγον
  english_pob_choice: Have you heard a word?
  chosen_korean: 말을 들으셨습니까?
  alternatives_korean:
  - 하나의 말을 들으셨습니까?
  - 어떤 말을 들으셨습니까?
  lexicon: BDAG
  rationale: ἀκήκοας는 완료형의 현재 관련성을 살리고, λόγον은 여기서 단순한 ‘말’보다 ‘들은 내용/사연’까지 포괄할 수 있어 간결한 ‘말’로 옮겼습니다.
- source_word: συναποθανέτω σοι
  english_pob_choice: Let it die with you
  chosen_korean: 그것은 당신과 함께 죽게 하십시오
  alternatives_korean:
  - 그것은 당신과 함께 죽게 하십시오
  - 당신과 함께 사라지게 하십시오
  lexicon: LSJ
  rationale: 직역하면 ‘함께 죽게 하라’는 뜻으로, 비밀을 밖으로 퍼뜨리지 말라는 비유적 명령을 한국어에서도 생생하게 유지했습니다.
- source_word: θάρσει
  english_pob_choice: take courage
  chosen_korean: 용기를 내십시오
  alternatives_korean:
  - 마음을 굳게 하십시오
  - 담대하십시오
  lexicon: BDAG
  rationale: 권면의 어조를 살리면서도 현대 한국어에서 자연스럽고 공손한 합쇼체 명령으로 다듬었습니다.
- source_word: ῥήξει
  english_pob_choice: will not burst you open
  chosen_korean: 당신을 터뜨려 놓지는 못할 것입니다
  alternatives_korean:
  - 당신을 찢어 놓지는 못할 것입니다
  - 당신을 터뜨리지는 못할 것입니다
  lexicon: LSJ
  rationale: ῥήγνυμι의 물리적·강렬한 이미지를 약화하지 않기 위해 추상적 ‘해치다’ 대신 파열의 이미지를 살렸습니다.
theological_decisions:
- issue: 비밀을 지키라는 권면의 비유적 표현
  chosen_reading: ‘그것은 당신과 함께 죽게 하십시오’와 ‘터뜨려 놓지 못할 것입니다’로, 비밀을 붙들고 있어도 그것이 사람을 무너뜨리지는 않는다는 수사적 긴장을 유지했습니다.
  alternative_readings:
  - ‘그것을 잊어버리십시오’처럼 완화하기
  - ‘상처 주지 않을 것입니다’처럼 추상화하기
  rationale: 본문은 단순한 보안 조언이 아니라, 비밀이 사람을 ‘찢어/터뜨리’지 못한다는 과장된 속담적 이미지가 핵심이므로 그 충격을 보존했습니다.
  doctrine_reference: 문학적 비유와 잠언적 권면의 수사 이해
- issue: 말씀/사연의 의미 범위
  chosen_reading: λόγον을 ‘말’로 두어, 특정한 보고·사연까지 포함 가능한 넓은 의미를 열어 두었습니다.
  alternative_readings:
  - ‘사연’
  - ‘보고’
  - ‘소식’
  rationale: 본문의 지시 대상이 좁게 특정되지 않으므로, 한국어에서도 과도한 구체화 없이 의미 범위를 보존하는 쪽을 택했습니다.
  doctrine_reference: 어휘 의미 범위 보존
