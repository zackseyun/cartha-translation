  source_fidelity: 그리스어의 수사적 질문, ‘당신과 함께 죽게 하라’는 비유적 명령, 강한 부정의 미래 표현을 대체로 충실히 반영했습니다. 다만 ‘터뜨려 놓지는 못할 것입니다’의 ‘못할’은 원문의 단순하고 강한 부정 미래(οὐ μή … ῥήξει)를 능력·가능의 부정으로 다소 바꾸며, ‘터뜨려 놓다’도 현대 한국어에서 부자연스럽습니다.
  naturalness: ‘그 말은 당신과 함께 죽게 하십시오’는 원문의 비유를 유지하면서 자연스럽습니다. 마지막 절은 ‘그것이 당신을 터뜨리지는 않을 것입니다’로 고치면 파열의 생생한 이미지를 보존하면서도 기존 문장보다 간결하고 자연스럽습니다.
