  source_fidelity: 원문의 조건 구조와 핵심 어휘는 대체로 충실합니다. 다만 εὕρῃ는 ‘기회를 찾으면’보다 ‘기회를 얻으면/만나면’처럼 우연히 또는 마침 기회를 발견하는 뜻으로 옮기는 것이 적절합니다. 또한 ἐὰν의 단순 조건은 ‘되더라도’보다 ‘된다면’으로 표현하는 편이 정확합니다.
