base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/019/028.yaml
  text: And if he is prevented from sinning by lack of strength[a], when he finds an opportunity, he will do evil.
  footnotes:
  - marker: a
    text: Or 'he will do harm'; the Greek verb can denote doing evil generally or harming others more specifically.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그가 힘이 부족하여 죄를 짓지 못한다면, 기회를 얻을 때 악을 행할 것입니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘해를 끼칠 것입니다’. 그리스어 동사는 일반적인 악행이나 더 구체적으로 남에게 해를 끼치는 행위를 모두 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπὸ ἐλαττώματος ἰσχύος
  english_pob_choice: by lack of strength
  chosen_korean: 힘이 부족하여
  alternatives_korean:
  - 능력이 부족하여
  - 힘의 결핍 때문에
  - 연약하여
  lexicon: LSJ
  rationale: ὑπό + 속격은 원인·사유를 나타내므로, 원문의 인과를 자연스럽게 살려 ‘힘이 부족하여’로 옮겼습니다. ‘연약하여’는 내적 성향으로 좁아질 수 있어 피했습니다.
- source_word: κωλυθῇ ἁμαρτεῖν
  english_pob_choice: is prevented from sinning
  chosen_korean: 죄를 짓지 못하게 되더라도
  alternatives_korean:
  - 죄에서 막히더라도
  - 죄를 짓는 데 제지되더라도
  - 죄를 범하지 못하도록 방해받더라도
  lexicon: LSJ
  rationale: 수동 접속법의 외적 저지를 살리되, 한국어에서 자연스럽고 문맥상 죄행의 불가능 상태를 드러내기 위해 ‘죄를 짓지 못하게 되더라도’로 풀었습니다.
- source_word: καιρὸν
  english_pob_choice: an opportunity
  chosen_korean: 기회를
  alternatives_korean:
  - 적절한 때를
  - 때를
  - 좋은 기회를
  lexicon: LSJ
  rationale: καιρός는 단순한 시간보다 유리한 계기를 가리키므로, 현대 한국어에서 그 뉘앙스를 가장 간결하게 전달하는 ‘기회’를 선택했습니다.
- source_word: κακοποιήσει
  english_pob_choice: he will do evil
  chosen_korean: 악을 행할 것입니다
  alternatives_korean:
  - 해를 끼칠 것입니다
  - 악행을 할 것입니다
  - 악을 저지를 것입니다
  lexicon: LSJ
  rationale: κακοποιέω는 악행과 해악 모두를 아우를 수 있으므로, 영어 POB의 도덕적 폭을 유지하면서도 한국어 성경 문체에 맞는 ‘악을 행하다’로 옮겼습니다.
theological_decisions:
- issue: 죄를 못 짓는 상태와 의로움의 구분
  chosen_reading: 외적 제약 때문에 죄를 짓지 못하는 것과 실제로 선하게 되는 것은 같지 않다는 점을 드러내는 번역을 유지했습니다.
  alternative_readings:
  - ‘죄에서 벗어나면’처럼 긍정적 상태로 완화하는 읽기
  - ‘해를 끼칠 것입니다’로 좁혀 피해 행위만 강조하는 읽기
  rationale: 원문은 능력 부족이 도덕적 선함이 아님을 대비시키므로, 그 긴장을 약화하지 않고 보존하는 것이 적절합니다.
  doctrine_reference: '번역 원칙: 해석으로 긴장을 해소하지 말고, 원문의 도덕 판단을 그대로 드러낼 것.'
