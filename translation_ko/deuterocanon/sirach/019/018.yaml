  yaml_path: translation/deuterocanon/sirach/019/018.yaml
  text: And the knowledge of evil is not wisdom[a], and where the counsel of sinners is, there is no understanding.
  footnotes:
  - marker: a
    text: Or “there is no wisdom in expertise at wickedness.” The Greek contrasts σοφία (“wisdom”), ἐπιστήμη (“knowledge”), and φρόνησις (“understanding/prudence”).
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 악을 아는 지식은 지혜가 아니며, 죄인들의 조언이 있는 곳에는 이해가 없습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “악에 대한 전문 기술에는 지혜가 없다.” 그리스어는 σοφία(“지혜”), ἐπιστήμη(“지식”), φρόνησις(“이해/분별”)를 서로 구별합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: σοφία
  english_pob_choice: wisdom
  chosen_korean: 지혜
  alternatives_korean:
  - 슬기
  - 현명함
  lexicon: LSJ
  rationale: 지혜문학의 핵심 대조어이므로 ‘지혜’로 옮겨 도덕적·인식론적 의미를 그대로 살렸습니다.
- source_word: ἐπιστήμη πονηρίας
  english_pob_choice: knowledge of evil
  chosen_korean: 악을 아는 지식
  alternatives_korean:
  - 악에 대한 지식
  - 악의 지식
  lexicon: LSJ
  rationale: ἐπιστήμη와 σοφία를 구별하기 위해 ‘지식’을 유지하고, πονηρίας는 가장 자연스러운 한국어로 ‘악’을 택해 소유격보다 행위 대상을 드러냈습니다.
- source_word: βουλὴ ἁμαρτωλῶν
  english_pob_choice: counsel of sinners
  chosen_korean: 죄인들의 조언
  alternatives_korean:
  - 죄인들의 계책
  - 죄인들의 의논
  lexicon: LSJ
  rationale: βουλή는 의도적 판단과 조언의 뉘앙스를 함께 가지므로, 문맥상 공동의 계획보다 ‘조언’이 더 직접적이고 읽기 쉽습니다.
- source_word: φρόνησις
  english_pob_choice: understanding
  chosen_korean: 이해
  alternatives_korean:
  - 분별
  - 통찰
  lexicon: LSJ
  rationale: 여기서는 지혜·지식과 병렬되는 실제적 판단력을 가리키므로, 현대 한국어에서 간결하고 중립적인 ‘이해’로 옮겼습니다.
theological_decisions:
- issue: 악을 위한 지식이 지혜로 불릴 수 있는지
  chosen_reading: 본문은 악에 관한 지식을 지혜로 인정하지 않으며, 죄인들의 조언에는 참된 이해가 없다고 단정합니다.
  alternative_readings:
  - 악한 기술이 단지 지혜와 구별될 뿐이라는 약한 진술로 읽을 수 있습니다.
  rationale: 두 번의 부정(οὐκ ἔστιν)이 강하게 병렬되므로, 지혜문학의 도덕적 평가를 약화하지 않고 그대로 반영했습니다.
  doctrine_reference: 집회서의 지혜-분별 구분, 번역 원칙 §§1, 3, 6
