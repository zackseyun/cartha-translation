  text: Rebuke your neighbor before you threaten[a], and give place to the law of the Most High.
  footnotes:
  - marker: a
    text: Or 'make room for the law of the Most High,' that is, yield your response to its guidance rather than escalating to threats.
    reason: lexical_alternative
translation:
  language: ko
  text: 이웃을 위협하기 전에 책망하고, 지극히 높으신 이의 율법에 자리를 내어 주십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “지극히 높으신 이의 율법에 여지를 두십시오”, 곧 위협으로 맞서기보다 그 지침에 따라 응답하라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγξον
  english_pob_choice: Rebuke
  chosen_korean: 책망하고
  alternatives_korean:
  - 꾸짖고
  - 질책하고
  - 경고하고
  lexicon: BDAG
  rationale: 명령형으로서 잘못을 분명히 드러내어 바로잡는 뜻이므로, 비교적 직접적이면서도 표준적인 ‘책망하다’가 적절합니다.
- source_word: τὸν πλησίον σου
  english_pob_choice: your neighbor
  chosen_korean: 이웃을
  alternatives_korean:
  - 가까운 사람을
  - 당신의 이웃을
  - 곁의 사람을
  lexicon: BDAG
  rationale: 지혜문맥에서 윤리적 대상인 ‘이웃’이 가장 자연스럽고, 한국어에서도 관계적·도덕적 범주를 분명히 드러냅니다.
- source_word: δὸς τόπον
  english_pob_choice: give place
  chosen_korean: 자리를 내어 주십시오
  alternatives_korean:
  - 자리를 양보하십시오
  - 여지를 두십시오
  - 자리를 내주십시오
  lexicon: BDAG
  rationale: 직역적 ‘give place’의 비유를 살리되, 한국어에서는 ‘자리를 내어 주다’가 더 자연스럽게 ‘양보/수용’의 뉘앙스를 전달합니다.
- source_word: νόμῳ Ὑψίστου
  english_pob_choice: the law of the Most High
  chosen_korean: 지극히 높으신 이의 율법
  alternatives_korean:
  - 지극히 높으신 분의 법
  - 가장 높으신 이의 법
  - 지극히 높으신 하나님의 율법
  lexicon: BDAG
  rationale: Ὑψίστου는 유대교적 신칭호로서 ‘지극히 높으신 이’가 자연스럽고, νόμος는 여기서 하나님의 규범을 가리키므로 ‘율법’이 적합합니다.
theological_decisions:
- issue: δὸς τόπον νόμῳ Ὑψίστου의 의미 범위
  chosen_reading: 위협으로 넘어가기보다 하나님의 규범에 자신을 내어 맡기고, 그 기준 아래서 행동하라는 권고로 읽습니다.
  alternative_readings:
  - 법에 따라 대응하라는 뜻
  - 더 이상의 보복이나 위협을 자제하라는 뜻
  - 하나님의 율법이 개입할 자리를 마련하라는 뜻
  rationale: 문맥상 개인적 위협으로의 격화를 멈추고, 지극히 높으신 이의 율법을 행동의 기준으로 삼으라는 대비가 핵심입니다. ‘자리를 내어 주다’는 이 대비를 살립니다.
  doctrine_reference: 지혜문학의 윤리적 권면과 하나님의 율법의 우선성
