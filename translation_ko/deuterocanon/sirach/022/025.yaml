  lexicon: LSJ
  rationale: σ κεπάζω의 핵심은 단순히 덮는 것이 아니라 보호·감싸 줌의 의미도 담으므로, 문맥상 ‘친구를 보호하는 일’로 옮겨 보호의 뉘앙스를 살렸습니다.
- source_word: ἀπὸ προσώπου αὐτοῦ
  english_pob_choice: from his presence
  chosen_korean: 그의 얼굴 앞에서
  alternatives_korean:
  - 그의 উপস্থিতությունից
  - 그의 존재 앞에서
  - 그의 면전에서
  lexicon: LSJ
  rationale: πρόσωπον은 문자적으로 ‘얼굴’이지만, 이 관용구는 상대 앞/면전이라는 관계적 의미를 갖습니다. 한국어에서는 ‘얼굴 앞에서’로 옮겨 직역성과 관계적 긴장을 함께 살렸습니다.
- source_word: οὐ μὴ κρυβῶ
  english_pob_choice: I will certainly not hide myself
  chosen_korean: 결코 숨지 않겠습니다
  alternatives_korean:
  - 반드시 숨지 않겠습니다
  - 결코 몸을 숨기지 않겠습니다
  - 숨지 않을 것입니다
  lexicon: LSJ
  rationale: οὐ μή의 강한 부정은 ‘결코’로, κρυβῶ는 문맥상 수동보다는 자기 숨김의 의미가 자연스러워 ‘숨지 않겠습니다’로 옮겼습니다.
