translation:
  language: ko
  text: 나는 친구를 보호하는 것을 부끄러워하지 않으며, 그를 피하여 결코 몸을 숨기지 않겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그의 얼굴/면전으로부터 결코 숨기지 않겠다’입니다. ‘그를 피하여 몸을 숨기지 않겠다’라는 뜻으로 이해할 수 있으며, 헬라어 κρυβῶ는 ‘내가 숨겨지지 않겠다’로도 읽힐 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: φίλον
  english_pob_choice: a friend
  chosen_korean: 친구
  alternatives_korean:
