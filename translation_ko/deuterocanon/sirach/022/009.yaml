base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/022/009.yaml
  text: Weep over the dead[a], for the light has failed; and weep over the fool[b], for understanding has failed.
  footnotes:
  - marker: a
    text: Or, 'the light is gone out.' The Greek keeps the image of light rather than stating 'life' directly.
    reason: lexical_alternative
  - marker: b
    text: 'The saying is proverbial: the fool is lamented because understanding has failed, not because the text explicitly states physical death here.'
    reason: cultural_note
translation:
  language: ko
  text: 죽은 이를 두고 우십시오. 빛이 사라졌기 때문입니다. 그리고 어리석은 이를 두고도 우십시오. 이해력이 사라졌기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 여기서는 ‘생명’으로 풀기보다, 그리스어가 유지하는 ‘빛’의 이미지를 살렸습니다.
    reason: lexical_alternative
  - marker: b
    text: 이 말은 문자 그대로의 죽음만이 아니라, 이해력이 사라진 어리석은 사람을 두고 하는 지혜문학적 경구입니다.
    reason: cultural_note
lexical_decisions:
- source_word: ἐπὶ νεκρῷ κλαῦσον
  english_pob_choice: Weep over the dead
  chosen_korean: 죽은 이를 두고 우십시오
  alternatives_korean:
  - 죽은 자를 두고 우십시오
  - 죽은 사람을 두고 우십시오
  - 죽은 이를 슬퍼하십시오
  lexicon: LXX/BDAG
  rationale: ἐπί + dative는 여기서 애도 대상 위에/두고라는 관용적 용법이며, κλαῦσον은 단순한 슬픔보다 소리 내어 우는 행위를 가리키므로 ‘우십시오’가 직접적입니다.
- source_word: ἐξέλιπεν γὰρ φῶς
  english_pob_choice: for the light has failed
  chosen_korean: 빛이 사라졌기 때문입니다
  alternatives_korean:
  - 빛이 꺼졌기 때문입니다
  - 빛이 다했기 때문입니다
  - 생명이 끝났기 때문입니다
  lexicon: BDAG
  rationale: φῶς는 본문에서 생명 자체로 풀기보다 ‘빛’ 이미지를 유지하는 것이 원문에 가깝고, ἐξέλιπεν은 ‘사라지다/다하다’의 뜻이므로 ‘빛이 사라졌습니다’가 자연스럽습니다.
- source_word: ἐπὶ μωρῷ κλαῦσον
  english_pob_choice: weep over the fool
  chosen_korean: 어리석은 이를 두고도 우십시오
  alternatives_korean:
  - 바보를 두고도 우십시오
  - 우매한 이를 두고도 우십시오
  - 어리석은 사람을 두고도 우십시오
  lexicon: BDAG
  rationale: μωρός는 지혜문학에서 도덕적·지적 분별이 무너진 인물을 가리키므로, 현대 표준어에서 지나치게 속어처럼 들리는 표현보다 ‘어리석은 이’가 품위를 유지하면서도 범주를 보존합니다.
- source_word: σύνεσιν
  english_pob_choice: understanding
  chosen_korean: 이해력
  alternatives_korean:
  - 분별력
  - 지각
  - 통찰
  lexicon: BDAG
  rationale: σύνεσις는 단순 지식보다 이해·분별 능력을 뜻하므로, 지혜문학의 대조를 살리기 위해 ‘이해력’으로 옮겼습니다.
theological_decisions:
- issue: 죽음의 표현과 빛의 은유
  chosen_reading: ‘빛이 사라졌다’고 옮겨, 본문이 말하는 은유를 그대로 유지했습니다.
  alternative_readings:
  - ‘생명이 끝났다’
  - ‘그의 빛이 꺼졌다’
  rationale: 원문은 φῶς를 사용하며 ζωή를 쓰지 않으므로, 죽음을 직접 설명하기보다 빛의 소멸 이미지를 보존하는 것이 본문의 압축성과 시적 힘을 더 잘 드러냅니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: 어리석은 이를 애도하라는 역설적 지혜 격언
  chosen_reading: ‘어리석은 이’를 그대로 두어 지혜문학의 날카로운 대조를 유지했습니다.
  alternative_readings:
  - ‘우매한 사람’
  - ‘분별 없는 사람’
  rationale: 이 말씀은 단순한 무지를 뜻하는 것이 아니라, 이해가 사라진 인물을 지혜 전통의 범주로 규정하는 경구이므로, 완화하지 않는 편이 원문의 경구성을 보존합니다.
  doctrine_reference: Translation philosophy §1, §6
