- from: 어리석은 자와는 말을 많이 나누지 마십시오. 무지한 사람에게는 가까이 가지 마십시오. 그에게서 멀리하십시오. 그러면 수고를 겪지 않고 그의 소란에 더럽혀지지도 않을 것입니다. 그에게서 돌아서십시오. 그러면 안식을 얻을 것이며, 그의 광기 때문에 지치지도 않을 것입니다.[a]
  to: 어리석은 자와는 말을 많이 나누지 마십시오. 분별 없는 사람에게는 가까이 가지 마십시오. 그를 멀리하십시오. 그러면 수고를 겪지 않고 그의 요동[a]으로 더럽혀지지도 않을 것입니다. 그에게서 돌아서십시오. 그러면 안식을 얻을 것이며, 그의 광기 때문에 지치지도 않을 것입니다.
  rationale: ἀσύνετος의 의미를 ‘분별 없는 사람’으로 바로잡고, 자연스럽지 않은 거리두기 표현을 다듬었습니다. ἐντιναγμός의 불확실성을 보존하기 위해 비교적 절제된 ‘요동’을 사용하고, 해당 단어 직후에 설명 각주를 배치했습니다. 나머지 반복 명령, 조건적 결과, ‘안식’, ‘광기’의 강도는 원문의 구조와 의미를 유지했습니다.
