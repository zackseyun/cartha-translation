  source_fidelity: 전반적인 명령과 결과의 구조는 그리스어 원문에 충실합니다. 그러나 ἀσύνετος를 ‘무지한 사람’으로 옮기면 교육·지식의 부족이라는 현대적 의미로 좁혀져, 원문의 ‘분별 또는 이해가 없는 사람’이라는 뜻을 충분히 반영하지 못합니다. 또한 ἐντιναγμός는 희귀하고 의미가 불확실하므로, ‘소란’처럼 일반화한 표현에는 해당 불확실성을 밝히는 각주를 바로 붙여야 합니다.
  naturalness: 합쇼체는 일관되며 대체로 자연스럽습니다. ‘그에게서 멀리하십시오’보다 ‘그를 멀리하십시오’가 현대 표준 한국어에서 더 자연스럽습니다. ‘그의 요동으로 더럽혀지다’는 원문의 낯선 이미지를 보존하되 각주로 어려움을 안내하는 절충 표현입니다.
