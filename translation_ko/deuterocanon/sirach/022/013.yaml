base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/022/013.yaml
  text: Do not multiply words with a fool[a], and do not go to an unintelligent man. Keep away from him, so that you may not have trouble and may not be defiled by his shaking-off. Turn aside from him, and you will find rest, and you will not grow weary because of his madness.
  footnotes:
  - marker: a
    text: The Greek term rendered 'his shaking-off' is rare and difficult; it may refer more broadly to the fool's disruptive outbursts or the contaminating effect of his behavior.
    reason: lexical_alternative
translation:
  language: ko
  text: 어리석은 자와는 말을 많이 나누지 마십시오. 분별 없는 사람에게는 가까이 가지 마십시오. 그를 멀리하십시오. 그러면 수고를 겪지 않고 그의 요동[a]으로 더럽혀지지도 않을 것입니다. 그에게서 돌아서십시오. 그러면 안식을 얻을 것이며, 그의 광기 때문에 지치지도 않을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 ἐντιναγμός는 드문 단어로 뜻이 분명하지 않습니다. ‘요동’으로 옮겼으나, 어리석은 자의 난폭한 흔듦이나 그로 인한 오염·혼란을 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ ἄφρονος
  english_pob_choice: with a fool
  chosen_korean: 어리석은 자와는
  alternatives_korean:
  - 어리석은 사람과는
  - 우매한 자와는
  lexicon: BDAG
  rationale: ἄφρων은 지혜문학에서 도덕적·실천적으로 어리석은 사람을 가리키므로, 자연스럽고 범주를 잘 드러내는 ‘어리석은 자’를 택했습니다.
- source_word: μὴ πληθύνῃς λόγον
  english_pob_choice: do not multiply words
  chosen_korean: 말을 많이 나누지 마십시오
  alternatives_korean:
  - 말을 늘리지 마십시오
  - 말을 길게 하지 마십시오
  lexicon: BDAG
  rationale: 직역적 이미지인 ‘말을 많이 하다/늘리다’를 살리면서도 한국어 속담체처럼 매끄럽게 전달되도록 옮겼습니다.
- source_word: πρὸς ἀσύνετον μὴ πορεύου
  english_pob_choice: do not go to an unintelligent man
  chosen_korean: 무지한 사람에게는 가까이 가지 마십시오
  alternatives_korean:
  - 이해 없는 사람에게는 가지 마십시오
  - 분별 없는 사람에게는 가까이 가지 마십시오
  lexicon: BDAG
  rationale: πορεύου의 ‘가다’는 대상을 향해 접근하는 뉘앙스를 가지므로, POB의 개정처럼 ‘가까이 가지 마십시오’로 풀어 움직임을 살리면서도 한국어로 자연스럽게 했습니다.
- source_word: ἐν τῷ ἐντιναγμῷ αὐτοῦ
  english_pob_choice: by his shaking-off
  chosen_korean: 그의 소란
  alternatives_korean:
  - 그의 휘두름
  - 그의 털어냄
  lexicon: LSJ
  rationale: 희귀어 ἐντιναγμός는 정확한 단정이 어렵지만, 문맥상 주변을 어지럽히고 더럽히는 부정적 작용을 가리키므로 과도한 해석을 피하면서도 의미가 드러나는 ‘소란’을 택했습니다.
- source_word: οὐ μὴ ἀκηδιάσῃς ἐν τῇ ἀπονοίᾳ αὐτοῦ
  english_pob_choice: you will not grow weary because of his madness
  chosen_korean: 그의 광기 때문에 지치지도 않을 것입니다
  alternatives_korean:
  - 그의 어리석음 때문에 지치지도 않을 것입니다
  - 그의 무모함 때문에 지치지도 않을 것입니다
  lexicon: LSJ
  rationale: ἀπόνοια는 단순한 어리석음보다 강한 ‘광기/무모한 망동’의 뉘앙스를 가지므로, 본문의 강도를 살려 ‘광기’로 옮겼습니다.
