review_pass:
  verdict: revise
  source_fidelity: 'The draft correctly renders the prudent/wise daughter, the idiomatic sense of κληρονομήσει ἄνδρα, and the resulting grief. However, ‘그를 낳은 이’ reverses the referent: 그를 means ‘the one who bore him,’ whereas the Greek γεννήσαντος is masculine singular and refers to the daughter’s father.'
  naturalness: The first clause is natural in modern formal Korean. In the second clause, explicitly restating ‘딸’ improves coherence, and ‘그녀를 낳은 아버지’ is clear and natural enough in this context.
  terminology: ‘슬기로운’ suitably conveys φρονίμη as practical wisdom. ‘수치를 안겨 주는’ preserves the active force of καταισχύνουσα. ‘아버지’ accurately retains the masculine singular reference of γεννήσαντος without the erroneous maternal implication of Korean 낳다 when no male noun is supplied.
  issues:
  - severity: high
    issue: The phrase ‘그를 낳은 이’ has the wrong pronoun referent and does not preserve the source’s masculine parent.
    rationale: The verse concerns a daughter, so the dependent pronoun must be 그녀를/자신을, not 그를. Moreover, γεννήσαντος is masculine singular (‘the one who fathered [her]’); the draft’s bare ‘낳은 이’ fails to identify him as male and readily suggests a mother in Korean.
  revised_text: 슬기로운 딸은 남편을 얻을 것입니다[a]. 그러나 수치를 안겨 주는 딸은 그녀를 낳은 아버지에게 슬픔이 됩니다.
  revised_footnotes:
  - marker: a
    text: 헬라어 원문은 직역하면 ‘그녀의 남편을 상속할 것이다’이지만, 문맥상 혼인을 통해 남편을 얻게 된다는 관용적 뜻을 반영하여 ‘남편을 얻을 것입니다’로 옮겼습니다.
    reason: lexical_alternative
  revision_rationale: Second-clause referents and the father’s masculine identity have been corrected. The footnote is retained and adjusted to reflect the explicit αὐτῆς (‘her’) in the Greek while explaining the idiomatic Korean rendering.
