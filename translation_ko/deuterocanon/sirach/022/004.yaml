translation:
  language: ko
  text: 지혜로운 딸은 남편을 얻을 것입니다[a]. 그러나 수치를 끼치는 자는 그를 낳은 이에게 슬픔이 됩니다.
  philosophy: optimal-equivalence
  footnotes:
