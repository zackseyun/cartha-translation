    text: 헬라어 원문은 직역하면 ‘남편을 상속할 것이다’이지만, 문맥상 혼인 관계를 얻게 된다는 관용적 뜻을 반영하여 ‘남편을 얻을 것입니다’로 옮겼습니다.
    reason: lexical_alternative
