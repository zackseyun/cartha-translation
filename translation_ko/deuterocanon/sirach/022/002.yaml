  source_fidelity: 핵심 비유와 손을 터는 결과는 잘 반영합니다. 다만 ‘그를 들어 올리는’은 사람을 물리적으로 들어 올리는 뜻으로 강하게 읽혀, 똥덩이를 집어 드는 비유적 장면을 충분히 드러내지 못합니다. 그리스어 αὐτόν은 남성 단수이나, 앞선 비유의 대상인 똥덩이를 가리키는 문맥적 표현으로 한국어에서는 ‘그것을’로 자연스럽게 받을 수 있습니다.
  naturalness: ‘똥덩이와 같고’도 이해되지만, συνεβλήθη의 비교 의미를 ‘똥덩이에 비길 만하니’로 명시하면 현대 한국어 잠언 문체에서 더 자연스럽고 분명합니다. ‘집어 들면’은 ‘들어 올리는’보다 이 문맥에 알맞습니다.
  terminology: ‘게으른 사람’과 ‘똥덩이’는 ὀκνηρός 및 βολβίτῳ κοπρίων의 노골적이고 경멸적인 비유를 적절히 보존합니다. ‘손을 털 것입니다’는 ἐκτινάξει χεῖρα의 단수 ‘손’과 미래의 의미를 자연스럽게 반영합니다.
  issues:
