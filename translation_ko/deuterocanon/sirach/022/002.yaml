    rationale: ἀναιρούμενος αὐτόν은 문법상 남성 대명사를 쓰지만, 바로 앞의 똥덩이 비유를 이어 ‘집어 드는’ 행위를 묘사합니다. 한국어에서는 ‘그것을 집어 들면’이 비유의 장면과 뒤따르는 손을 터는 행동을 명확히 연결합니다.
