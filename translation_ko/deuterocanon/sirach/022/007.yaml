translation:
  language: ko
  text: 어리석은 사람을 가르치는 것은 깨진 그릇 조각을 붙이는 것과 같고, 깊은 잠에서 잠든 사람을 깨우는 것과 같습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 명시적으로 ‘같다’라고 하지 않고, 분사구를 병렬하여 비교를 나타냅니다.
    reason: source_note
lexical_decisions:
- source_word: συγκολλῶν
  english_pob_choice: gluing
  chosen_korean: 본드를 바르는 것
  alternatives_korean:
  - 붙이는 것
  - 접합하는 것
  - 접착하는 것
  lexicon: LSJ
  rationale: 동사는 무엇인가를 서로 달라붙게 만드는 물리적 행위를 가리키므로, 한국어에서도 손으로 무언가를 붙여 보려는 무익한 동작이 드러나도록 구체적으로 옮겼습니다.
- source_word: ὄστρακον
  english_pob_choice: a potsherd / potsherds
  chosen_korean: 깨진 그릇 조각
  alternatives_korean:
  - 옹기 조각
  - 질그릇 조각
  - 토기 조각
  lexicon: LSJ
  rationale: ὄστρακον은 깨진 토기류 조각을 뜻하므로, 독자가 곧바로 이미지에 들어가도록 자연스러운 현대어로 풀어 옮겼습니다.
- source_word: μωρόν
  english_pob_choice: a fool
  chosen_korean: 미련한 사람
  alternatives_korean:
  - 어리석은 사람
  - 우둔한 사람
  - 바보
  lexicon: LSJ
  rationale: 지혜문학의 μωρός는 단순한 지적 부족보다 도덕적·실천적 어리석음을 가리키므로, 한국어에서도 경멸적 과격함을 줄이면서 의미를 살린 표현을 택했습니다.
- source_word: ἐκ βαθέος ὕπνου
  english_pob_choice: from a deep sleep
  chosen_korean: 깊은 잠에서
  alternatives_korean:
  - 깊은 잠으로부터
  - 깊이 잠든 상태에서
  - 깊은 잠에서부터
  lexicon: LSJ
  rationale: 직역 구조를 유지하되 한국어에서 가장 자연스러운 출발점 표현으로 정리하여, 잠의 깊이를 강조하는 대비가 선명하게 드러나도록 했습니다.
theological_decisions:
- issue: 그리스어 분사구의 비교 방식
  chosen_reading: 명시적 '같다'를 보태기보다, 한국어에서 '...과 같습니다'로 풀어 비교 관계를 자연스럽게 드러냈습니다.
  alternative_readings:
  - '''...하는 이는 ...를 붙이는 것입니다''처럼 분사 구조를 더 직역하는 방식'
  - 명시적 비유어를 생략하고 병렬 이미지로만 두는 방식
  rationale: 원문은 분사구들을 통해 비유를 구성하므로, 한국어에서는 독서 흐름을 해치지 않으면서도 비교의 힘을 유지하는 방식이 가장 적절합니다.
  doctrine_reference: 시락 22:7의 지혜문학적 비유 구조
- issue: '''깊은 잠''의 이미지'
  chosen_reading: 후반부도 과장 없이 직관적인 심리·상태 이미지로 살렸습니다.
  alternative_readings:
  - '''혼곤한 잠'''
  - '''깊이 잠든 사람'''
  rationale: 원문은 지혜 교훈의 무익함을 생생한 일상 이미지로 제시하므로, 지나치게 문어적인 표현보다 즉각적으로 이해되는 표현이 적합합니다.
  doctrine_reference: 지혜문학의 수사적 과장과 대비
