  source_fidelity: 개정이 필요합니다. 현재의 ‘깨진 그릇 조각에 본드를 바르는 것’은 συγκολλῶν ὄστρακον의 ‘토기 조각을 붙이는’ 행위보다 접착제를 표면에 바르는 행위로 의미가 좁아집니다. 또한 καθεύδοντα(잠든 사람)가 번역문에서 명시되지 않았습니다.
  naturalness: 현 문장은 ‘…것과 같고, …것과 같습니다’라는 병렬이 다소 불균형합니다. 두 비교구를 대칭으로 처리하면 현대 표준 한국어 합쇼체에서 더 자연스럽고 분명합니다. ‘본드’는 구어적이고 특정 접착제 명칭처럼 들릴 수 있어 격식 있는 본문에는 ‘붙이는 것’이 적절합니다.
  terminology: μωρόν은 지혜문학의 관용적 표현인 ‘어리석은 사람’으로 옮기는 것이 자연스럽고 의미 범위에도 잘 맞습니다. ὄστρακον은 일반 독자에게 ‘깨진 그릇 조각’으로 충분하며, 원문의 단수를 유지할 수 있습니다.
  issues:
