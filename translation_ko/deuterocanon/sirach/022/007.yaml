  text: Teaching a fool is like gluing a potsherd[a], like waking one from a deep sleep.
  footnotes:
  - marker: a
    text: Or, more formally, 'He who teaches a fool is gluing a potsherd, waking one from deep sleep.' The Greek uses participial comparisons rather than an explicit 'is like.'
