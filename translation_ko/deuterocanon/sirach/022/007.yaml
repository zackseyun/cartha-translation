    issue: ‘본드를 바르는 것’은 συγκολλῶν의 행위와 정확히 일치하지 않습니다.
    rationale: συγκολλάω는 접합하거나 붙이는 행위를 뜻합니다. 조각에 접착제를 바르는 것은 그 행위의 한 단계일 뿐이며, ‘본드’는 현대적·구어적 어감도 지닙니다.
  - severity: medium
