    rationale: ‘…것과 같고, …것과 같습니다’보다 두 항목을 동일한 ‘…것과 같습니다’ 형식으로 병렬하는 편이 문법적으로 매끄럽습니다.
  revised_text: 어리석은 사람을 가르치는 것은 깨진 그릇 조각을 붙이는 것과 같고, 깊은 잠에서 잠든 사람을 깨우는 것과 같습니다.[a]
