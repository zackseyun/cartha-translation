  source_fidelity: 핵심 비교와 공적 망신에 대한 조롱의 반응은 대체로 충실합니다. 다만 ἐπὶ τῇ ἀτιμίᾳ의 관계를 옮긴 ‘그의 수치에 대고’는 한국어에서 부자연스럽고 뜻도 다소 불분명합니다. ‘그의 불명예를 두고’가 해당 대상을 더 정확히 드러냅니다.
  naturalness: ‘비견되고’와 특히 ‘수치에 대고 휘파람을 불 것입니다’는 현대 표준 한국어 합쇼체에서 다소 어색합니다. ‘비유됩니다’, ‘불명예를 두고 조롱하며 휘파람을 불 것입니다’가 자연스럽고 원문의 구체적 소리 이미지를 보존합니다.
  terminology: ἀτιμία는 여기서 개인의 내면적 수치감보다는 공개적 불명예·치욕을 가리키므로 ‘불명예’가 적합합니다. ἐκσυριεῖ의 조롱성은 본문에서 ‘조롱하며’로 명시하고, 각주에서 ‘야유하다’라는 가능성을 보충합니다.
