base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/022/001.yaml
  text: A lazy man is compared to a filthy stone[b][a], and everyone will whistle at his disgrace.
  footnotes:
  - marker: a
    text: Or 'A lazy man has been likened to a dirty/befouled stone.' The rare Greek participle for the stone's condition is difficult, but it clearly carries a negative sense of being soiled.
    reason: lexical_alternative
  - marker: b
    text: The Greek verb can also suggest 'hiss at' in derision, not only 'whistle at.'
    reason: lexical_alternative
translation:
  language: ko
  text: 게으른 사람은 더러운 돌에 비견되고, 누구나 그의 수치에 대고 휘파람을 불 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 희귀한 분사 ἠρδαλωμένῳ는 돌이 ‘더럽혀진/때묻은’ 상태라는 뜻을 강하게 지니므로, ‘더러운’은 그 부정적 의미를 압축한 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: ἐκσυριεῖ는 조롱의 휘파람뿐 아니라 ‘쉿’ 하며 야유하는 소리도 포함할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Λίθῳ ἠρδαλωμένῳ
  english_pob_choice: a filthy stone
  chosen_korean: 더러운 돌
  alternatives_korean:
  - 추한 돌
  - 더럽혀진 돌
  - 오염된 돌
  lexicon: LSJ
  rationale: 희귀한 분사 ἠρδαλωμένῳ의 핵심은 돌이 ‘더럽혀진/때묻은’ 상태라는 점이므로, 간결한 현대 한국어로 그 부정적 이미지를 직접 살렸습니다.
- source_word: συνεβλήθη
  english_pob_choice: is compared to
  chosen_korean: 비견되고
  alternatives_korean:
  - 비교되고
  - 비유되고
  - 견주어지고
  lexicon: LSJ
  rationale: 문맥상 물리적 결합이 아니라 속담식 비교를 뜻하므로, ‘비견되다’로 원문의 평가적 비교를 자연스럽게 옮겼습니다.
- source_word: ὀκνηρός
  english_pob_choice: lazy man
  chosen_korean: 게으른 사람
  alternatives_korean:
  - 게으른 자
  - 게으른 남자
  - 게으름뱅이
  lexicon: LSJ
  rationale: 그리스어는 남성 단수 형용사를 명사처럼 쓰지만, 한국어에서는 성별을 과도하게 드러내지 않는 ‘사람’이 속담체에 가장 자연스럽습니다.
- source_word: ἐκσυριεῖ
  english_pob_choice: will whistle at
  chosen_korean: 휘파람을 불 것입니다
  alternatives_korean:
  - 비웃으며 휘파람을 불 것입니다
  - 혀를 차며 야유할 것입니다
  - 쉿 소리를 낼 것입니다
  lexicon: LSJ
  rationale: 동사는 조롱의 휘파람/쉬익거림을 가리키므로, 기본 이미지를 유지하되 한국어에서 통하는 ‘휘파람을 불다’로 옮겼습니다. 다만 조롱의 뉘앙스는 문맥이 보완합니다.
- source_word: ἀτιμίᾳ
  english_pob_choice: disgrace
  chosen_korean: 수치
  alternatives_korean:
  - 불명예
  - 치욕
  - 수치스러움
  lexicon: LSJ
  rationale: 공적 망신과 조롱의 상황에 맞게, ‘disgrace’의 사회적 수치감을 가장 직접적으로 드러내는 ‘수치’를 선택했습니다.
theological_decisions:
- issue: 속담적 남성형 ὀκνηρός의 한국어 처리
  chosen_reading: 게으른 사람
  alternative_readings:
  - 게으른 남자
  - 게으른 자
  rationale: 본문은 남성형 어휘를 쓰지만, 지혜문학 속 일반적 경구로서 독자에게는 대표적 인간상을 제시합니다. 한국어에서는 성별보다 유형성을 살려 ‘사람’으로 옮기는 것이 오독을 줄입니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
