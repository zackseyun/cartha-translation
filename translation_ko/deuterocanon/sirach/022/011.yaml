    rationale: πονῆρος는 ‘악한’뿐 아니라 해롭고 비참하며 나쁜 상태를 가리킬 수 있습니다. 한국어 본문의 ‘악한 삶’은 주로 윤리적으로 악한 삶을 뜻하므로, 비교 경구의 넓은 평가를 충분히 살리기 어렵습니다.
