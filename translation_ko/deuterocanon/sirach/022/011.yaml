  verdict: revise
  source_fidelity: 그리스어의 대조(δὲ), ‘어리석은 사람’(μωρός), 죽음과의 비교(ὑπὲρ θάνατον)는 정확히 반영되어 있습니다. 다만 πονηρά는 한국어 ‘악한’만으로는 도덕적 악행의 뜻으로 다소 좁게 들릴 수 있습니다. ‘삶은 죽음보다 더 나쁩니다’는 원문의 평가적 비교를 자연스럽게 유지하면서 악함·비참함의 폭을 보존합니다.
  naturalness: ‘어리석은 사람에게는 악한 삶이 죽음보다 더 나쁩니다’는 주제와 소유 관계가 다소 부자연스럽고, ‘악한 삶’과 ‘더 나쁩니다’의 결합도 한국어 경구로는 무겁습니다. ‘어리석은 사람의 삶은 죽음보다 더 나쁩니다’가 자연스럽고 명료합니다.
  terminology: ‘어리석은 사람’은 지혜문학의 μωρός에 알맞은 절제된 현대어입니다. πονηρά는 본문에서 ‘나쁩니다’로 옮기고 각주에서 ‘악한’ 및 ‘비참한’ 가능성을 밝혀, 도덕적·고통스러운 뉘앙스를 어느 한쪽으로 확정하지 않습니다.
