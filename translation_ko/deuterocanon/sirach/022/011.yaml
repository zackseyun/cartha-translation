    reason: lexical_alternative
lexical_decisions:
- source_word: μωροῦ
  english_pob_choice: a fool
  chosen_korean: 어리석은 사람
  alternatives_korean:
  - 바보
  - 미련한 사람
  - 어리석은 자
  lexicon: LSJ
  rationale: μωρός는 지혜문학에서 분별이 없는 사람을 가리키므로, 현대 한국어에서는 비하가 지나치지 않으면서도 의미를 살리는 ‘어리석은 사람’이 적절합니다.
- source_word: τοῦ δὲ
  english_pob_choice: But for
  chosen_korean: 그러나 …에게는
  alternatives_korean:
  - 그리고 …에게는
  - 하지만 …에게는
  - 그런데 …에게는
  lexicon: LSJ
  rationale: δὲ의 약한 대조를 한국어 접속사 ‘그러나’로 자연스럽게 살려 앞절과의 대비를 분명하게 했습니다.
- source_word: ζωὴ πονηρά
  english_pob_choice: an evil life
  chosen_korean: 악한 삶
  alternatives_korean:
  - 악한 생명
  - 비참한 삶
  - 나쁜 삶
  lexicon: LSJ
  rationale: πονηρά는 도덕적 악함과 참담한 상태를 함께 열 수 있으므로, 영어 POB의 ‘evil life’를 따라 ‘악한 삶’으로 옮겨 그 긴장을 유지했습니다.
- source_word: ὑπὲρ θάνατον
  english_pob_choice: worse than death
  chosen_korean: 죽음보다 더 나쁩니다
  alternatives_korean:
  - 죽음보다 더 심합니다
  - 죽음보다 못합니다
  - 죽음보다 더 괴롭습니다
  lexicon: LSJ
  rationale: ὑπέρ의 비교 용법을 한국어 비교구문으로 자연스럽게 풀어, 단순한 ‘~보다’가 아니라 평가적 비교인 ‘더 나쁩니다’로 전달했습니다.
theological_decisions:
- issue: πονηρά의 의미 범위
  chosen_reading: ‘악한’으로 번역해 도덕적 악함과 비참함의 여운을 함께 남겼습니다.
  alternative_readings:
  - 비참한
  - 가련한
  - 불행한
  rationale: 지혜문학의 경구는 형식상 단정적 도덕판결과 삶의 질적 참담함을 동시에 울릴 수 있으므로, 어느 한쪽으로만 좁히지 않았습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 3
