  alternative_readings:
  - ‘부끄러움을 당할 것입니다’
  - ‘멸시를 받을 것입니다’
  rationale: 본문의 핵심은 단순한 감정 표현이 아니라 공동체적 명예 훼손과 그에 대한 응보적 귀결이므로, 같은 장르의 어휘로 유지했습니다.
