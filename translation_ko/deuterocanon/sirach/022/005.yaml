theological_decisions:
- issue: 수치와 명예의 반복 구조
  chosen_reading: 첫 절의 ‘수치’와 끝 절의 ‘욕을 당하다’로 대응시켜, 행위가 가족 명예를 훼손하고 그에게 다시 수치가 돌아오는 구조를 보존했습니다.
  alternative_readings:
  - ‘부끄러움을 당할 것입니다’
  - ‘멸시를 받을 것입니다’
  rationale: 본문의 핵심은 단순한 감정 표현이 아니라 공동체적 명예 훼손과 그에 대한 응보적 귀결이므로, 같은 장르의 어휘로 유지했습니다.
  doctrine_reference: 지혜문학의 명예-수치 관습
