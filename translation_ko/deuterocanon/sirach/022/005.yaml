  language: ko
  text: 뻔뻔한 여인은 아버지와 남편에게 수치를 가져오며, 그 둘에게서 모두 욕을 당할 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문의 ἡ θρασεῖα는 ‘뻔뻔한 여인’뿐 아니라 ‘대담한 여인’, ‘방자한 여인’으로도 옮길 수 있으나, 여기서는 문맥상 부정적 도덕성의 강조를 따랐습니다.
    reason: lexical_alternative
