  text: 뻔뻔한 여인은 아버지와 남편에게 수치를 안기며, 그 두 사람에게서 수치를 당할 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문의 ἡ θρασεῖα는 ‘뻔뻔한 여인’ 외에 ‘방자한 여인’, ‘무례한 여인’, 또는 ‘대담한 여인’으로도 옮길 수 있습니다. 여기서는 문맥상 칭찬할 만한 대담함이 아니라 부정적인 뻔뻔함을 가리킵니다.
    reason: lexical_alternative
