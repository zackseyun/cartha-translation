  - 생각하는 이해
  - 통찰의 이해
  lexicon: LSJ
  rationale: διανοία와 σύνεσις의 중첩된 사고·분별 의미를 한 번에 살리되, 반복을 피하면서도 지혜문학의 맥락에 맞는 표현으로 정리했습니다.
- source_word: κόσμος ψαμμωτὸς τοίχου ξυστοῦ
  english_pob_choice: a plastered wall with a sanded finish
  chosen_korean: 사포질한 벽의 마감
  alternatives_korean:
  - 모래를 섞어 마감한 벽
  - 문질러 다듬은 벽의 장식
  - 사포 같은 마감의 벽
  lexicon: LSJ
  rationale: 원문의 압축된 건축 비유를 유지하기 위해 표면 처리와 마감을 드러내는 표현으로 옮겼습니다. κόσμος는 장식보다 ‘마감’이, ψαμμωτός/ξυστός는 ‘사포질한’이 기능적으로 가깝습니다.
