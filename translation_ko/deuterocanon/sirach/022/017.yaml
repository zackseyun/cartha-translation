  text: 지혜로운 이해에 굳게 선 마음은, 사포질한 벽의 마감과 같습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문의 건축 이미지는 압축적이며, 정확한 표면 용어의 세부 뉘앙스는 다소 불확실하지만, 핵심은 안정성과 올바른 구성입니다.
    reason: source_note
lexical_decisions:
- source_word: καρδία
  english_pob_choice: heart
  chosen_korean: 마음
