  source_fidelity: 개정이 필요합니다. ‘지혜로운 이해’는 διανοίας συνέσεως가 지닌 생각·분별의 결합을 다소 일반적인 ‘지혜’로 바꾸며, ‘사포질한’은 고대 건축 표면 처리를 현대의 사포 작업으로 특정합니다. 또한 원문은 모래 관련 수식과 매끈하게 다듬은 벽이라는 이미지를 압축적으로 결합하므로, 이를 구별하여 옮기는 편이 낫습니다.
  naturalness: ‘분별 있는 생각에 굳게 세워진 마음’과 ‘매끈하게 다듬은 벽의 모래 섞인 마감’은 현대 표준어의 격식 있는 문장으로 자연스럽습니다. 쉼표는 비유의 두 항을 구분하는 데 도움이 됩니다.
  terminology: καρδία는 ‘마음’, ἠδρασμένη는 결과 상태를 보이는 ‘굳게 세워진’, διανοίας συνέσεως는 ‘분별 있는 생각’으로 옮깁니다. ψαμμωτός와 ξυστός의 정확한 건축 기술적 의미는 확정하기 어려우므로, 본문은 ‘모래 섞인’과 ‘매끈하게 다듬은’을 보수적으로 구분하고 각주에서 불확실성을 밝힙니다.
