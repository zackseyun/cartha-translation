  lexicon: LSJ
  rationale: 완료된 안정 상태를 나타내는 뉘앙스를 살리면서, 현대 한국어에서 문장 흐름이 자연스럽도록 ‘굳게 선’으로 옮겼습니다.
- source_word: διανοίας συνέσεως
  english_pob_choice: thoughtful understanding
  chosen_korean: 지혜로운 이해
  alternatives_korean:
