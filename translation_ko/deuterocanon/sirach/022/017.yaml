translation:
  language: ko
  text: 분별 있는 생각에 굳게 세워진 마음은, 매끈하게 다듬은 벽의 모래 섞인 마감과 같습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문의 건축 이미지는 압축되어 있습니다. 직역하면 ‘분별의 생각 위에 굳게 세워진 마음은, 매끈하게 다듬은 벽의 모래 섞인 마감과 같다’는 뜻입니다. 벽 표면을 가리키는 용어들의 정확한 기술적 뉘앙스는 다소 불확실하지만, 비유는 안정성과 튼튼하게 잘 지어진 구조를 나타냅니다.
    reason: source_note
