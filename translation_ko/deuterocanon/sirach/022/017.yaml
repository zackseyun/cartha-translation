  rationale: 지혜문학의 καρδία는 감정만이 아니라 생각과 의지의 중심을 가리키므로, 한국어에서는 자연스러운 인격 중심 표현인 ‘마음’이 적합합니다.
- source_word: ἠδρασμένη
