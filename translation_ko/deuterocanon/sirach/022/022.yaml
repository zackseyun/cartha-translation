  yaml_path: translation/deuterocanon/sirach/022/022.yaml
  text: If you open your mouth against a friend[a], do not be afraid, for there can be reconciliation—except in the case of insult and arrogance and the revealing of a secret and a treacherous blow; in these things every friend will flee.
  footnotes:
  - marker: a
    text: Or, 'do not be afraid.' The Greek verb can denote fear or caution, but the context favors not giving up hope because reconciliation remains possible.
    reason: lexical_alternative
translation:
  language: ko
  text: 친구를 거슬러 입을 연다면, 두려워하지 마십시오. 화해할 길이 있기 때문입니다. 다만 모욕과 오만과 비밀을 드러내는 일과 기만적인 타격은 예외입니다. 이런 일들 때문에 어느 친구든 달아날 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘망설이지 마십시오.’ 그리스어 동사는 두려워하다 또는 조심하다라는 뜻을 지닐 수 있습니다. 여기서는 화해의 가능성이 언급되므로, 희망을 버리거나 물러서지 말라는 뜻으로도 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπὶ φίλον
  english_pob_choice: against a friend
  chosen_korean: 친구를 향해
  alternatives_korean:
  - 친구에게
  - 친구에 대하여
  lexicon: LSJ
  rationale: ἐπί + 대격이 대상을 향한 발화, 곧 친구를 향한 말이라는 뜻을 나타내므로, 한국어에서도 관계의 방향성을 살려 「친구를 향해」로 옮겼습니다.
- source_word: μὴ εὐλαβηθῇς
  english_pob_choice: do not be afraid
  chosen_korean: 두려워하지 마십시오
  alternatives_korean:
  - 겁내지 마십시오
  - 염려하지 마십시오
  - 망설이지 마십시오
  lexicon: LSJ
  rationale: 여기서는 단순한 공포보다 화해 가능성 앞에서 물러서지 말라는 권면이므로, 자연스러운 합쇼체로 「두려워하지 마십시오」를 택했습니다.
- source_word: διαλλαγή
  english_pob_choice: reconciliation
  chosen_korean: 화해
  alternatives_korean:
  - 화목
  - 회복
  - 재결합
  lexicon: LSJ
  rationale: 관계가 다시 좋아지는 의미를 가장 직접적으로 드러내는 현대 한국어는 「화해」입니다.
- source_word: μυστηρίου ἀποκαλύψεως
  english_pob_choice: the revealing of a secret
  chosen_korean: 비밀의 드러냄
  alternatives_korean:
  - 비밀의 폭로
  - 숨은 일의 공개
  - 비밀의 밝혀짐
  lexicon: LSJ
  rationale: μυστήριον은 여기서 신학적 ‘신비’가 아니라 맡겨진 비밀을 가리키므로, 그 긴장을 살려 「비밀의 드러냄」으로 옮겼습니다.
- source_word: πληγῆς δολίας
  english_pob_choice: a treacherous blow
  chosen_korean: 속임수의 상처
  alternatives_korean:
  - 배신의 타격
  - 기만적인 상처
  - 배반의 일격
  lexicon: LSJ
  rationale: δολία는 속임수/기만의 성격을 드러내며, πληγή는 상처·타격을 뜻하므로 문자적이면서도 자연스러운 표현인 「속임수의 상처」를 선택했습니다.
theological_decisions:
- issue: 화해 가능성의 표현
  chosen_reading: 「화해가 있기 때문입니다」로 옮겨, 친구를 향한 말 뒤에도 관계 회복의 가능성이 남아 있음을 분명히 했습니다.
  alternative_readings:
  - 화해할 수 있기 때문입니다
  - 관계가 회복될 수 있기 때문입니다
  rationale: 본문의 논지는 잘못된 말 이후에도 곧바로 절망할 필요가 없다는 데 있으므로, 가능성을 직접적으로 드러내는 번역이 적절합니다.
  doctrine_reference: 지혜문학의 관계 회복 권면
