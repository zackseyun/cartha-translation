base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/022/023.yaml
  text: Gain faith with your neighbor in poverty[a], so that in his good things you may be filled together. In a time of distress remain with him[b], so that you may inherit along with him in his inheritance.
  footnotes:
  - marker: a
    text: Or 'Gain trust with your neighbor in poverty'; πίστις here may carry the relational sense of trust or faithfulness, not only faith in an abstract sense.
    reason: lexical_alternative
  - marker: b
    text: '''His good things'' may also be understood as ''his prosperity'' or ''his goods.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 가난할 때 이웃과 신뢰를 쌓으십시오.[a] 그러면 그의 좋은 것들로 함께 배부르게 될 것입니다.[b] 환난의 때에 그 곁을 지키십시오. 그러면 그의 유산을 그와 함께 상속받게 될 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘신뢰’는 ‘믿음’ 또는 ‘신실함’으로도 옮길 수 있습니다. πίστις는 여기서 추상적 신앙만이 아니라 이웃과의 관계에서 생기는 신뢰나 충실성을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘좋은 것들’은 ‘재물’, ‘번영’, 또는 ‘복된 것들’로도 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστιν κτῆσαι
  english_pob_choice: Gain faith
  chosen_korean: 믿음을 얻으십시오
  alternatives_korean:
  - 신뢰를 얻으십시오
  - 믿음의 관계를 맺으십시오
  lexicon: BDAG
  rationale: κτῆσαι는 ‘얻다/획득하다’의 뜻이므로 능동적 요청형으로 옮겼고, πίστις는 이 문맥에서 단순한 추상 명사보다 이웃 사이의 신뢰 관계까지 포함할 수 있어 ‘믿음’을 유지하되 자연스러운 한국어로 ‘얻으십시오’라고 표현했습니다.
- source_word: ἐν πτωχείᾳ
  english_pob_choice: in poverty
  chosen_korean: 가난한 가운데서도
  alternatives_korean:
  - 가난 속에서
  - 빈곤 가운데서
  lexicon: BDAG
  rationale: ἐν πτωχείᾳ는 상태를 나타내므로 ‘가난’으로 옮기되, 문맥상 이웃과의 관계를 강조하기 위해 ‘가난한 가운데서도’라고 자연스럽게 풀었습니다.
- source_word: ἐν τοῖς ἀγαθοῖς αὐτοῦ
  english_pob_choice: in his good things
  chosen_korean: 그의 좋은 것들 안에서
  alternatives_korean:
  - 그의 재물 안에서
  - 그의 복된 것들 안에서
  lexicon: BDAG
  rationale: ἀγαθά는 재물에만 한정되지 않고 좋은 것들, 이익, 혜택을 포괄하므로, 의미 범위를 넓게 살린 ‘좋은 것들’로 두었습니다.
- source_word: διάμενε αὐτῷ
  english_pob_choice: remain with him
  chosen_korean: 그와 함께 머무르십시오
  alternatives_korean:
  - 그 곁에 머무르십시오
  - 그와 함께 남아 있으십시오
  lexicon: BDAG
  rationale: διαμένω는 단순한 동행보다 지속적이고 변함없는 동반을 뜻하므로, 명령형으로 ‘머무르십시오’가 가장 직접적입니다.
- source_word: συνκληρονομήσῃς
  english_pob_choice: inherit along with him
  chosen_korean: 그와 함께 상속받게 될 것입니다
  alternatives_korean:
  - 그와 함께 유업을 받게 될 것입니다
  - 그와 더불어 상속받게 될 것입니다
  lexicon: BDAG
  rationale: συν- 접두어가 ‘함께/더불어’의 뜻을 분명히 하므로, ‘함께 상속받다’로 옮겨 공동 상속의 의미를 살렸습니다.
theological_decisions:
- issue: πίστις의 관계적 의미를 한국어로 어떻게 살릴 것인가
  chosen_reading: ‘믿음’을 유지하되 이웃 사이의 신뢰 관계를 포함하는 표현으로 옮겼습니다.
  alternative_readings:
  - ‘신뢰’로 단독 번역
  - ‘신실함’으로 번역
  rationale: 본문은 지혜 문맥에서 상호 우정과 충성을 말하므로, 신앙 교리 용어로만 좁히지 않고 관계적 신뢰를 포함하도록 번역하는 것이 문맥에 더 적합합니다. 다만 표제어 대응성을 위해 ‘믿음’을 기본으로 두었습니다.
  doctrine_reference: 'DOCTRINE.md: πίστις default ‘faith’; contextually may include trust/faithfulness'
- issue: 공동 상속의 뉘앙스를 ‘함께’로 드러낼 것인가
  chosen_reading: ‘그와 함께 상속받게 될 것입니다’로 공동 상속을 분명히 했습니다.
  alternative_readings:
  - ‘그와 더불어 상속받게 될 것입니다’
  - ‘그와 함께 유업을 받게 될 것입니다’
  rationale: συνκληρονομήσῃς는 단순한 상속이 아니라 ‘함께 상속받음’을 뜻하므로, 결과절에서도 공동성의 뉘앙스를 유지하는 것이 원문에 충실합니다.
  doctrine_reference: Greek compound verb συνκληρονομέω
