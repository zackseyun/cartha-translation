  text: A father’s shame is the birth of an undisciplined son[b][a], and a daughter is born for loss.
  footnotes:
  - marker: a
    text: Greek literally, 'A father’s shame is the begetting of an undisciplined [male child].' The noun 'son' is implied by the masculine adjective.
    reason: lexical_alternative
  - marker: b
    text: Or 'for diminution' or 'to her father’s loss'; the Greek phrase points to reduction or loss, and the exact nuance is compressed.
    reason: alternative_reading
translation:
  language: ko
  text: 아들은 아버지의 수치요, 훈련되지 않은 아들의 출생이며, 딸은 감소를 위해 태어납니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 문자적으로는 ‘훈련되지 않은 [남자 아이]의 출생’에 가깝습니다. 첫 절의 남성형 형용사가 아들을 함축합니다.
    reason: lexical_alternative
  - marker: b
    text: ἐπʼ ἐλαττώσει는 ‘감소를 위해’, ‘손실을 위해’, 또는 ‘아버지의 손실로’까지도 가능하며, 정확한 뉘앙스는 압축되어 있습니다.
    reason: alternative_reading
