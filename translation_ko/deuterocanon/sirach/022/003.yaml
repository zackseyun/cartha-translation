  text: A father’s shame is the birth of an undisciplined son[b][a], and a daughter is born for loss.
  footnotes:
  - marker: a
    text: Greek literally, 'A father’s shame is the begetting of an undisciplined [male child].' The noun 'son' is implied by the masculine adjective.
    reason: lexical_alternative
  - marker: b
    text: Or 'for diminution' or 'to her father’s loss'; the Greek phrase points to reduction or loss, and the exact nuance is compressed.
    reason: alternative_reading
translation:
  language: ko
  text: 훈육받지 못한 아들의 출생[a]은 아버지의 수치이며, 딸은 손실을 위하여 태어납니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 문자적으로 ‘훈육받지 못한 [남자 아이]의 출생(또는 낳음)’이라고 합니다. 첫 절의 남성형 형용사가 아들을 함축합니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어 ἐπʼ ἐλαττώσει는 ‘감소를 위하여’, ‘손실을 위하여’, 또는 ‘아버지의 손실로’로도 옮길 수 있습니다. 이 표현은 목적과 결과의 뉘앙스가 압축되어 있습니다.
    reason: alternative_reading
