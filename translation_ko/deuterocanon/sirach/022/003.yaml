theological_decisions:
- issue: 성별이 분명한 잠언 표현을 중성화할지 여부
  chosen_reading: 아버지, 아들, 딸의 성별 표현을 그대로 유지했습니다.
  alternative_readings:
  - 부모와 자녀로 중성화하기
  - 아이로 일반화하기
  rationale: 그리스어 원문은 아버지와 딸을 직접 말하고, 첫 절의 남성형 형용사는 아들을 함축합니다. 사회적 전제까지 지우지 않고 원문의 대조를 보존하는 것이 적절합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
- issue: 딸에 대한 평가를 완화할지 여부
  chosen_reading: 두 번째 절을 완화하지 않고 '감소'의 의미를 그대로 남겼습니다.
  alternative_readings:
  - 아버지의 수치를 가져온다로 의역하기
  - 가정의 어려움을 뜻하는 일반 표현으로 바꾸기
  rationale: 본문은 고대의 가부장적 사회 감각을 반영하므로, 교리적으로 순화하지 않고 원문이 말하는 축소·손실의 의미를 드러내는 것이 옳습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 3
