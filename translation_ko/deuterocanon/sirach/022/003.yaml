  source_fidelity: 현 번역은 첫 절의 문장 관계를 뒤집어 ‘아들’ 자체가 ‘아버지의 수치’라고 한 뒤 ‘훈련되지 않은 아들의 출생’을 병렬로 덧붙입니다. 원문은 ‘훈육받지 못한 아들의 출생/낳음’이 아버지의 수치라는 구조입니다. 이를 바로잡아야 합니다.
  naturalness: ‘아들은 아버지의 수치요, 훈련되지 않은 아들의 출생이며’는 한국어 문장으로도 비문에 가깝고 의미 관계가 불명확합니다. ‘…아들의 출생은 아버지의 수치이며’로 고치면 현대 표준 한국어의 간결한 잠언체가 됩니다. ‘손실을 위하여’는 다소 직역적이나 원문의 압축된 목적·결과 관계를 보존합니다.
  terminology: αἰσχύνη는 ‘수치’, ἀπαίδευτος는 문맥상 ‘훈육받지 못한’, θυγάτηρ는 ‘딸’로 적절합니다. ἐπʼ ἐλαττώσει는 특정한 손실의 종류를 단정하지 않고 ‘손실을 위하여’로 옮기며 각주에서 ‘감소/손실/아버지의 손실’의 가능성을 밝혀야 합니다.
