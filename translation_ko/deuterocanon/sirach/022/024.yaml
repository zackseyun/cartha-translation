    rationale: 원어는 화덕·가마·용광로를 포괄할 수 있는 일반적 고열 시설을 뜻하므로 ‘화덕’이 문맥상 더 중립적입니다.
  - severity: medium
    issue: ‘비방’은 λοιδορία의 모욕적이고 공격적인 발화를 충분히 드러내지 못합니다.
