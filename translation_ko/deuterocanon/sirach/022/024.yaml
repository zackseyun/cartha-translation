  - marker: b
    text: The Greek literally says 'bloods,' an idiom for bloodshed or violent acts.
    reason: lexical_alternative
translation:
  language: ko
  text: 불이 나기 전에는 화덕의 김과 연기가 있고, 이와 같이 유혈이 있기 전에는 모욕하는 말이 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 문자적으로 ‘피들’이라고 하지만, 관용적으로 유혈이나 폭력 행위를 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸ
  english_pob_choice: before
  chosen_korean: ~ 앞에는
  alternatives_korean:
  - ~ 전에
  - ~ 앞서
  lexicon: LSJ
  rationale: 두 절 모두에서 시간적 선행을 나타내므로, 자연스러운 현대 한국어의 ‘~ 앞에는’으로 대응했습니다.
- source_word: ἀτμὶς καμίνου
  english_pob_choice: the furnace’s vapor
  chosen_korean: 용광로의 증기
  alternatives_korean:
  - 화덕의 김
  - 용광로의 김
  - 화로의 증기
  lexicon: LSJ
  rationale: ἀτμίς는 ‘증기/김’을 뜻하고 καμίνος는 강한 열의 용광로 이미지를 주므로, 문맥상 ‘용광로의 증기’가 가장 정확하고 생생합니다.
- source_word: καπνός
  english_pob_choice: smoke
  chosen_korean: 연기
  alternatives_korean:
  - 매연
  - 그을음
  lexicon: LSJ
  rationale: ἀτμὶς와 짝을 이루는 시각적 선행 징후로서 ‘연기’가 가장 직접적입니다.
- source_word: αἱμάτων
  english_pob_choice: bloodshed
  chosen_korean: 피 흘림
  alternatives_korean:
  - 피
  - 유혈
  - 살인
  lexicon: LSJ
  rationale: 그리스어 복수형 ‘피들’은 문자적 혈액보다 폭력적 유혈 행위를 가리키는 관용이므로, 그 의미를 살려 ‘피 흘림’으로 옮겼습니다.
- source_word: λοιδορία
  english_pob_choice: abuse
  chosen_korean: 비방
  alternatives_korean:
  - 모욕
  - 욕설
  - 욕됨
  lexicon: LSJ
  rationale: 말로 남을 헐뜯고 험담하는 의미를 간결하게 드러내는 표준어로 ‘비방’을 택했습니다.
theological_decisions:
- issue: 말의 악과 폭력의 선행 관계
  chosen_reading: 이 절은 비방이 피 흘림 앞에 온다는 경구적 순서를 말하며, 이를 결정론적 인과로 과도하게 확장하지 않았습니다.
  alternative_readings:
  - 비방이 살인의 전조이다
  - 모욕이 폭력과 함께 나타난다
  rationale: 반복된 πρὸ가 자연스럽게 ‘~ 전에’라는 선행 관계를 형성하므로, 경고의 힘은 살리되 의미를 넘어서지 않도록 했습니다.
  doctrine_reference: 번역 원칙 §§1, 3, 6
