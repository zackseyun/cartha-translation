  verdict: revise
  source_fidelity: 반복된 πρὸ는 두 절에서 시간적 선행을 나타내며, ‘유혈이 있기 전에는’으로 명확히 반영하는 것이 적절합니다. καμίνος를 현대 산업 시설인 ‘용광로’로 한정하는 것은 원문의 일반적인 화덕·가마 이미지를 과도하게 좁힙니다. λοιδορία는 단순한 험담이나 중상에 치우친 ‘비방’보다 모욕적·학대적인 말을 가리키므로 이를 드러내야 합니다.
  naturalness: ‘불 앞에는’보다 ‘불이 나기 전에는’이 현대 한국어에서 시간 관계를 더 자연스럽고 분명하게 나타냅니다. ‘화덕의 김과 연기’ 및 ‘모욕하는 말’은 합쇼체 경구 문맥에 자연스럽습니다.
  terminology: καμίνος는 ‘화덕’으로, ἀτμίς와 καπνός는 각각 ‘김’과 ‘연기’로 옮겼습니다. αἱμάτων의 관용적 복수는 ‘유혈’로, λοιδορία는 말의 성격을 보존하여 ‘모욕하는 말’로 옮겼습니다. 각주 그리스어 표기도 αἱμάτων으로 바로잡았습니다.
