base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/022/008.yaml
  text: Telling a story to one who is drowsy is like telling it to a fool[a], and at the end he will say, “What was it?”
  footnotes:
  - marker: a
    text: 'The Greek text is somewhat awkward in form, repeating ''the one telling'' (διηγούμενος ... ὁ διηγούμενος). The sense is comparative: telling something to a drowsy person is like telling it to a fool.'
    reason: textual_variant
translation:
  language: ko
  text: 졸린 사람에게 이야기를 들려주는 것은 어리석은 사람에게 들려주는 것과 같으며, 끝에 이르러서는 그는 「무엇입니까?」라고 말할 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 본문은 ‘이야기하는 이’라는 말을 반복하여 다소 어색한 형태를 보입니다(διηγούμενος … ὁ διηγούμενος). 뜻은 졸린 사람에게 이야기를 들려주는 것이 어리석은 사람에게 들려주는 것과 같다는 비교입니다.
    reason: textual_variant
lexical_decisions:
- source_word: διηγούμενος
  english_pob_choice: telling a story
  chosen_korean: 이야기를 들려주는 것
  alternatives_korean:
  - 이야기를 전하는 것
  - 말을 전하는 것
  - 서술하는 것
  lexicon: LSJ
  rationale: διηγέομαι 계열은 내용을 자세히 전하거나 이야기하다의 뜻이므로, 한국어에서는 자연스러운 「이야기를 들려주는」으로 옮겨 반복되는 분사를 비교구문처럼 살렸습니다.
- source_word: νυστάζοντι
  english_pob_choice: to one who is drowsy
  chosen_korean: 졸린 사람에게
  alternatives_korean:
  - 졸음이 오는 사람에게
  - 꾸벅꾸벅 졸고 있는 사람에게
  - 잠이 덜 깬 사람에게
  lexicon: LSJ
  rationale: νυστάζω는 졸리다, 졸음을 느끼다의 뜻이므로, 읽기 자연성을 살리면서도 주의가 흐트러진 상태를 드러내는 「졸린 사람」으로 옮겼습니다.
- source_word: μωρῷ
  english_pob_choice: a fool
  chosen_korean: 어리석은 사람
  alternatives_korean:
  - 우둔한 사람
  - 미련한 사람
  - 바보
  lexicon: LSJ
  rationale: 지혜문학에서 μωρός는 단순 지능 부족보다 도덕적·실천적 어리석음을 가리키므로, 일상적 비하보다 의미를 살린 「어리석은 사람」을 택했습니다.
- source_word: Τί ἐστιν;
  english_pob_choice: What is it?
  chosen_korean: 무엇입니까?
  alternatives_korean:
  - 무엇이었습니까?
  - 이게 무슨 말입니까?
  - 무엇입니까
  lexicon: LSJ
  rationale: 직역하면 「무엇입니까?」이며, 문맥상 방금 들은 내용을 이해하지 못한 반응을 간결하게 드러냅니다. 화자 인용 안에서는 현대적 정중체를 유지했습니다.
theological_decisions:
- issue: 반복 분사구의 비교 의미
  chosen_reading: 「졸린 사람에게 이야기를 들려주는 것은 … 와 같습니다」로, 반복된 διηγούμενος를 비교적 구문으로 처리했습니다.
  alternative_readings:
  - 「졸린 사람에게 이야기하는 자는 …」
  - 「졸린 사람에게 말해 주는 것은 …」
  rationale: 그리스어는 ‘the one telling … the one telling’의 어색한 반복으로 비교를 형성하므로, 한국어에서도 단순 진술이 아니라 ‘~와 같음’의 비유 구조를 분명히 했습니다.
  doctrine_reference: 본문의 지혜적 교훈 방식 보존
- issue: 인용문 안의 문체
  chosen_reading: 끝의 인용문은 「무엇입니까?」로 정중체를 유지했습니다.
  alternative_readings:
  - 「뭐요?」
  - 「무엇이오?」
  rationale: 서술자는 합쇼체를 사용하고, 인용된 말은 원문의 짧은 반응을 현대 독자에게 자연스럽게 전달하되, 문장 전체의 공손한 서술 톤과 충돌하지 않도록 했습니다.
  doctrine_reference: 직접화법의 한국어 문체 일관성
