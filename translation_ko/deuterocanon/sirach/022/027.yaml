  yaml_path: translation/deuterocanon/sirach/022/027.yaml
  text: Who will set a guard over my mouth, and a shrewd seal over my lips, so that I may not fall because of it, and my tongue destroy me?
translation:
  language: ko
  text: 누가 내 입 위에 수문을, 내 입술 위에 슬기로운 인장을 두어, 내가 그것 때문에 넘어지지 않고 내 혀가 나를 멸망시키지 않게 해 주겠습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “수문/파수”에 가깝습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τίς δώσει μοι
  english_pob_choice: Who will set
  chosen_korean: 누가 … 두어
  alternatives_korean:
  - 누가 … 놓겠습니까
  - 누가 … 세우겠습니까
  lexicon: τίς; δίδωμι
  rationale: 요청문의 수사적 질문을 살리면서, 대상 위에 무언가를 ‘두다/놓다’는 한국어로 가장 자연스럽게 옮겼습니다.
- source_word: φυλακήν
  english_pob_choice: a guard
  chosen_korean: 수문
  alternatives_korean:
  - 경계
  - 보초
  - 파수꾼
  lexicon: φυλακή
  rationale: 입을 지키는 ‘감시/보호 장치’라는 뜻을 살려 단순 인물보다 기능 중심의 표현으로 옮겼습니다.
- source_word: σφραγῖδα πανοῦργον
  english_pob_choice: a shrewd seal
  chosen_korean: 슬기로운 인장
  alternatives_korean:
  - 간교한 인장
  - 영리한 인장
  - 재치 있는 인장
  lexicon: σφραγίς; πανοῦργος
  rationale: πανοῦργος의 핵심을 ‘교활함’보다 문맥상 말조심을 돕는 ‘슬기로움’으로 살려, 입술을 막는 인장의 기능을 자연스럽게 드러냈습니다.
- source_word: ἵνα μὴ πέσω ἀπʼ αὐτῆς
  english_pob_choice: so that I may not fall because of it
  chosen_korean: 내가 그것 때문에 넘어지지 않게
  alternatives_korean:
  - 내가 그것으로 말미암아 넘어지지 않게
  - 내가 그 일로 쓰러지지 않게
  lexicon: πέσω ἀπʼ αὐτῆς
  rationale: ‘떨어지다/넘어지다’의 이미지와 원인 관계를 함께 살려, 발화의 실수가 화를 부른다는 뜻을 보존했습니다.
- source_word: ἡ γλῶσσά μου ἀπολέσῃ με
  english_pob_choice: my tongue destroy me
  chosen_korean: 내 혀가 나를 멸망시키지 않게
  alternatives_korean:
  - 내 혀가 나를 파멸시키지 않게
  - 내 혀가 나를 망하게 하지 않게
  lexicon: ἀπόλλυμι; γλῶσσα
  rationale: 직역의 강도를 유지하되, 한국어에서 자연스럽고 문학적인 종결로 ‘멸망시키다’를 선택했습니다.
theological_decisions:
- issue: 입과 혀를 지키는 기도문의 요청 어조
  chosen_reading: 지혜문학의 자기-절제 기도로 이해하여, 직접적 기도체가 아니라 수사적 탄원형 질문으로 옮겼습니다.
  alternative_readings:
  - 도덕적 권면문처럼 평서형으로 옮기는 방식
  - 개인 탄식으로 완화하는 방식
  rationale: 원문은 하나의 지혜 격언이 아니라, 말의 위험을 인식한 화자의 간청을 드러내므로 질문형 구조를 유지하는 것이 더 충실합니다.
  doctrine_reference: 지혜문학의 자기 훈련과 말의 책임
- issue: πανοῦργος의 윤리적 뉘앙스
  chosen_reading: ‘교활한’보다 ‘슬기로운’으로 옮겨, 지혜를 구하는 맥락에서 말조절의 지혜를 강조했습니다.
  alternative_readings:
  - 교활한 인장
  - 간사한 인장
  rationale: 문맥상 악의적 교활함을 권장하는 것이 아니라, 말실수를 막기 위한 실천적 분별을 가리키므로 과도한 부정성은 피했습니다.
  doctrine_reference: 지혜와 절제에 대한 시락의 교훈
