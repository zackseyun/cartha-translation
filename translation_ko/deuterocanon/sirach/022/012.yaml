  yaml_path: translation/deuterocanon/sirach/022/012.yaml
  text: Mourning for the dead is seven days[a], but for a fool and an ungodly man, all the days of his life.
  footnotes:
  - marker: a
    text: Or 'for a fool and an ungodly person.' The Greek uses masculine singular forms generically in this wisdom saying.
    reason: lexical_alternative
translation:
  language: ko
  text: 죽은 이를 위한 애도는 일곱 날 동안입니다. 그러나 어리석고 불경한 자를 위한 애도는 그가 사는 모든 날 동안 계속됩니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘어리석은 자와 불경한 자를 위한’으로 옮길 수 있습니다. 그리스어는 이 지혜 격언에서 남성 단수형을 일반적으로 사용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: πένθος
  english_pob_choice: mourning
  chosen_korean: 애도
  alternatives_korean:
  - 슬픔
  - 곡
  lexicon: LSJ
  rationale: 죽은 이를 둘러싼 장례적 슬픔을 가리키므로, 감정 상태인 ‘슬픔’보다 장례 맥락이 드러나는 ‘애도’가 자연스럽고 정확합니다.
- source_word: νεκροῦ
  english_pob_choice: the dead
  chosen_korean: 죽은 이
  alternatives_korean:
  - 죽은 사람
  - 고인
  lexicon: LSJ
  rationale: 그리스어 속격은 ‘죽은 자로 인한/죽은 이를 위한’이라는 관계를 나타내므로, 한국어에서는 간결하게 ‘죽은 이’를 사용해 의미를 살렸습니다.
- source_word: μωροῦ
  english_pob_choice: a fool
  chosen_korean: 어리석은 자
  alternatives_korean:
  - 우매한 자
  - 바보
  lexicon: LSJ
  rationale: 지혜문학의 도덕적·실천적 어리석음을 가리키므로, 일상적 비하어인 ‘바보’보다 범주를 유지하는 ‘어리석은 자’가 적절합니다.
- source_word: ἀσεβοῦς
  english_pob_choice: an ungodly man
  chosen_korean: 불경한 자
  alternatives_korean:
  - 경건하지 않은 자
  - 하나님을 두려워하지 않는 자
  lexicon: LSJ
  rationale: 하나님께 대한 경외가 없는 사람을 뜻하므로, 교회적 상투어보다 원어의 도덕·종교적 긴장을 직접 드러내는 ‘불경한 자’로 옮겼습니다.
theological_decisions:
- issue: 그리스어 남성 단수의 대표적 지시를 한국어에서 어떻게 반영할지
  chosen_reading: ‘어리석은 자와 불경한 자… 그의 생애’로 남성 단수형을 유지했습니다.
  alternative_readings:
  - 어리석은 사람과 불경한 사람… 그들의 생애
  - 어리석은 자들과 불경한 자들…
  rationale: 본문은 지혜 격언에서 남성 단수형을 일반적 인간 범주로 사용합니다. 한국어에서도 그 대표성을 흐리지 않도록 단수 표현과 ‘그의’로 맞췄습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
