revisions:
- from: 죽은 이를 위한 애도는 일곱 날입니다. 그러나 어리석은 자와 불경한 자에게는 그의 생애의 모든 날이 그렇습니다.[a]
  to: 죽은 이를 위한 애도는 일곱 날 동안입니다. 그러나 어리석고 불경한 자를 위한 애도는 그가 사는 모든 날 동안 계속됩니다.[a]
  rationale: 둘째 절에 생략된 ‘애도’를 반복하고 ‘계속됩니다’를 사용하여, 죽은 이를 위한 애도는 칠 일인 데 비해 어리석고 불경한 자를 위한 애도는 그의 일생 내내 지속된다는 원문의 대조를 자연스러운 현대 한국어로 명확히 했습니다. 각주는 영어 감사 기록의 대안적 병렬 읽기 및 대표적 남성 단수 설명을 유지합니다.
