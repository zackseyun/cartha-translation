    text: 헬라어는 압축된 잠언형 표현입니다. 더 직역하면, ‘납보다 더 무거워질 것이 무엇이겠습니까? 그리고 그의/그것의 이름이 어리석은 자 외에 무엇이겠습니까?’에 가깝습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπὲρ μόλυβον
  english_pob_choice: heavier than lead
  chosen_korean: 납보다 무거운
  alternatives_korean:
