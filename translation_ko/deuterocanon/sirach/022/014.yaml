  lexicon: LSJ
  rationale: ὑπέρ + 비교 대상은 비교 구문으로 읽는 것이 자연스러우므로, 직역적이면서도 한국어 관용에 맞는 ‘납보다 무거운’으로 옮겼습니다.
- source_word: τί βαρυνθήσεται
  english_pob_choice: What is heavier
  chosen_korean: 무엇이 … 무겁습니까
  alternatives_korean:
  - 무엇이 더 무거워집니까
  - 무엇이 무거워질 것입니까
  lexicon: BDAG
  rationale: 미래형이지만 잠언적 수사에서는 현재적 일반 진술로 기능하므로, ‘무겁습니까’로 압축해도 의미가 살아납니다.
- source_word: τί αὐτῷ ὄνομα
  english_pob_choice: what name does such a one have
  chosen_korean: 그런 자의 이름은 무엇이겠습니까
  alternatives_korean:
  - 그의 이름은 무엇입니까
  - 그런 자의 이름이 무엇입니까
  lexicon: LSJ
  rationale: αὐτῷ를 단순한 ‘그의’보다 문맥상 인물 지시가 드러나는 ‘그런 자의’로 풀어, 압축된 격언체를 한국어에서도 자연스럽게 보존했습니다.
- source_word: μωρός
  english_pob_choice: fool
  chosen_korean: 어리석은 자
  alternatives_korean:
  - 바보
  - 미련한 자
  lexicon: BDAG
  rationale: 지혜문학에서 μωρός는 도덕적·지혜적 판단을 포함한 ‘어리석은 자’가 적절하며, ‘바보’보다 문체가 공적이고 ‘미련한 자’보다 현대 독자에게 분명합니다.
