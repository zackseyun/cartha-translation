translation:
  language: ko
  text: 납보다 무거운 것이 무엇입니까? 그리고 그런 자의 이름은 무엇이겠습니까? ‘어리석은 자’밖에 없습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 헬라어는 압축된 잠언형 표현으로, 보다 직역하면 ‘납보다 더 무거워질 것이 무엇이겠습니까? 그리고 그의/그것의 이름이 어리석은 자 외에 무엇이겠습니까?’에 가깝습니다.
    reason: lexical_alternative
