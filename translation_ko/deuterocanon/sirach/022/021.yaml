  text: If you draw a sword against a friend[a], do not despair[b], for there can be a return.
  footnotes:
  - marker: a
    text: Or, 'If you unsheathe a sword against a friend.' The Greek verb literally means 'draw' or 'pull.'
    reason: lexical_alternative
  - marker: b
    text: Or, 'for there is a way back' or 'for restoration is possible.' The Greek says literally, 'for there is a return.'
    reason: lexical_alternative
translation:
  language: ko
  text: 네가 친구를 향해 칼을 빼더라도[a], 절망하지 마십시오[b]. 돌아올 길이 있기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘네가 친구를 향해 칼집에서 칼을 뽑더라도.’ 그리스어 동사 σπάσῃς는 문자적으로 ‘뽑다/당기다’를 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘돌아갈 길이 있기 때문입니다’ 혹은 ‘회복이 가능하기 때문입니다.’ 그리스어는 문자적으로 ‘돌아옴이 있기 때문이다’라고 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπὶ φίλον
  english_pob_choice: against a friend
  chosen_korean: 친구를 향해
  alternatives_korean:
  - 친구에게 대하여
  - 친구를 거슬러
  lexicon: LSJ
  rationale: ἐπί + 대격은 적대적 방향을 나타낼 수 있으므로, 한국어에서는 관계의 표적을 자연스럽게 드러내는 ‘친구를 향해’로 옮겼습니다.
- source_word: ἐὰν σπάσῃς
  english_pob_choice: if you draw
  chosen_korean: 칼을 빼더라도
  alternatives_korean:
  - 칼을 뽑더라도
  - 칼을 빼내더라도
  lexicon: LSJ
  rationale: σπάω는 ‘당기다/뽑다’의 뜻이지만 ῥομφαία와 함께 쓰일 때는 무기를 꺼내드는 관용적 표현이므로, 현대 한국어에서 자연스러운 ‘칼을 빼다’로 표현했습니다.
- source_word: ῥομφαίαν
  english_pob_choice: a sword
  chosen_korean: 칼
  alternatives_korean:
  - 검
  - 큰 칼
  lexicon: LSJ
  rationale: ῥομφαία는 칼/검을 가리키지만 이 절에서는 과도한 구체화보다 무기 이미지를 분명히 하는 것이 중요하므로, 중립적이고 읽기 쉬운 ‘칼’을 택했습니다.
- source_word: ἔστιν γὰρ ἐπάνοδος
  english_pob_choice: for there can be a return
  chosen_korean: 돌아올 길이 있기 때문입니다
  alternatives_korean:
  - 다시 돌아올 수 있기 때문입니다
  - 회복의 가능성이 있기 때문입니다
  lexicon: LSJ
  rationale: ἐπάνοδος는 문자적으로 ‘돌아옴/복귀’이므로, 단순한 가능성만이 아니라 관계의 복귀 가능성을 드러내는 한국어 관용 표현으로 옮겼습니다.
theological_decisions:
- issue: 무력 행위 후 관계 회복 가능성의 범위
  chosen_reading: 본문은 친구를 향한 폭력적 전환이라는 심각한 파괴에도 불구하고 ‘돌아올 길’이 남아 있음을 말합니다.
  alternative_readings:
  - 단순히 ‘되돌아갈 길’이라는 일반적 의미로만 읽을 수 있습니다.
  - 실제 화해보다 상징적 회복 가능성을 가리킬 수 있습니다.
  rationale: 그리스어는 구체적 무기 이미지와 추상 명사 ἐπάνοδος를 함께 사용하므로, 본문이 말하는 회복 가능성을 살리되 그 정확한 범위를 지나치게 좁히지 않도록 했습니다.
  doctrine_reference: 관계 회복, 회개와 화해의 가능성
