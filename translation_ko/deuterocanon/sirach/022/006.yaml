  text: Music during mourning is an untimely discourse[b][a], but beatings and discipline are wisdom at all times.
  footnotes:
  - marker: a
    text: Or 'an ill-timed discourse' for 'an untimely speech.'
    reason: lexical_alternative
  - marker: b
    text: The Greek says 'beatings and discipline ... wisdom,' a compressed proverbial expression that may also mean 'belong to wisdom' or 'are fitting in wisdom.'
    reason: lexical_alternative
translation:
  language: ko
  text: 장례 중의 음악은 시기적절하지 않은 말이지만, 매질과 훈육은 언제나 지혜입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘시기상조인 말’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어는 ‘매질과 훈육… 지혜’라는 압축된 잠언식 표현으로, ‘지혜에 속한다’ 또는 ‘지혜에 합당하다’는 뜻일 수도 있습니다.
    reason: lexical_alternative
