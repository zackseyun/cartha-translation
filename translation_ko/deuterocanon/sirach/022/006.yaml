  chosen_korean: 장례 중의
  alternatives_korean:
  - 애도 중의
  - 상중의
  - 슬퍼하는 동안의
  lexicon: LSJ
  rationale: 애도 상황의 시간적·상황적 배경을 자연스러운 한국어로 드러내기 위해 ‘장례 중의’로 옮겼습니다.
- source_word: ἄκαιρος διήγησις
  english_pob_choice: an untimely discourse
  chosen_korean: 시기적절하지 않은 말
  alternatives_korean:
  - 때에 맞지 않는 말
  - 부적절한 담화
  - 시기상조인 담론
  lexicon: LSJ
  rationale: διήγησις의 일반적인 ‘말/진술’ 기능을 살리되, 문어체이면서도 현대 한국어에서 자연스러운 표현으로 옮겼습니다.
- source_word: μάστιγες καὶ παιδεία
  english_pob_choice: beatings and discipline
  chosen_korean: 매질과 훈육
  alternatives_korean:
  - 채찍질과 훈계
  - 매와 훈련
  - 매질과 징계
  lexicon: LSJ
  rationale: μάστιγες의 신체적 의미를 약화하지 않으면서, παιδεία를 단순한 ‘가르침’이 아니라 교정적 훈육으로 반영했습니다.
theological_decisions:
- issue: 매질과 훈육을 지혜의 영역으로 진술하는 잠언적 압축
  chosen_reading: 본문의 직설적 진술을 유지해, 신체적 교정과 훈육이 지혜와 관련된다는 압축된 잠언 형식을 그대로 살렸습니다.
  alternative_readings:
  - ‘지혜에 합당합니다’처럼 완화하기
  - ‘지혜에 속합니다’로 풀어쓰기
  rationale: 그리스어는 ‘매질과 훈육… 지혜’라는 압축법을 사용하므로, 도덕적 불편함을 이유로 신체적 의미를 약화하지 않았습니다.
  doctrine_reference: 번역 철학 §§1, 3, 6
