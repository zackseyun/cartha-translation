  alternative_readings:
  - ‘지혜에 합당합니다’처럼 완화하기
  - ‘지혜에 속합니다’로 풀어쓰기
  rationale: 그리스어는 ‘매질과 훈육… 지혜’라는 압축법을 사용하므로, 도덕적 불편함을 이유로 신체적 의미를 약화하지 않았습니다.
  doctrine_reference: 번역 철학 §§1, 3, 6
