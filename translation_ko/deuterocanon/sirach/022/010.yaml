  yaml_path: translation/deuterocanon/sirach/022/010.yaml
  text: Weep more sweetly over the dead[a], because he has found rest,
  footnotes:
  - marker: a
    text: Or 'weep more pleasantly/better over the dead'; the Greek comparative adverb ἥδιον literally carries the idea of 'more sweetly' or 'more pleasantly,' but in context it likely means more moderately or gently.
    reason: lexical_alternative
translation:
  language: ko
  text: 죽은 이를 두고는 더 부드럽게 울십시오[a]. 그가 쉬었기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘더 달콤하게/더 즐겁게’에 가깝지만, 애도 문맥에서는 ‘더 부드럽게’ 또는 ‘더 완만하게’라는 뜻으로 이해됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἥδιον
  english_pob_choice: more gently / more sweetly
  chosen_korean: 더 부드럽게
  alternatives_korean:
  - 더 달콤하게
  - 더 기쁘게
  - 더 온화하게
  lexicon: LSJ
  rationale: ἥδιον은 문자적으로는 ‘더 달콤하게/더 즐겁게’이지만, 애도 문맥에서는 부당하게 밝은 뉘앙스를 피하면서 비교급의 완곡함을 살리는 ‘더 부드럽게’가 가장 자연스럽습니다.
- source_word: κλαῦσον
  english_pob_choice: weep
  chosen_korean: 울십시오
  alternatives_korean:
  - 우십시오
  - 통곡하십시오
  - 애도하십시오
  lexicon: LSJ
  rationale: κλαίω의 직접 명령형으로, 기본 의미인 ‘울다’를 살리는 것이 가장 가까우므로 현대 합쇼체에서는 ‘울십시오’가 적절합니다.
- source_word: ἐπὶ νεκρῷ
  english_pob_choice: over the dead
  chosen_korean: 죽은 이를 두고
  alternatives_korean:
  - 죽은 이를 위하여
  - 죽은 자를 위하여
  - 시신 위에
  lexicon: LSJ
  rationale: ἐπί + 여격은 애도 대상/상황을 나타내므로, 한국어에서는 관용적으로도 자연스러운 ‘~을 두고’로 옮겨 애도의 대상성을 살렸습니다.
- source_word: ἀνεπαύσατο
  english_pob_choice: has found rest
  chosen_korean: 쉬었기 때문입니다
  alternatives_korean:
  - 안식했기 때문입니다
  - 쉬게 되었기 때문입니다
  - 잠들었기 때문입니다
  lexicon: LSJ
  rationale: 중간태의 ‘쉬다, 휴식하다’라는 뜻을 살리면서도, 본문이 죽음에 대한 지혜문학적 표현이라는 점을 과도하게 신학화하지 않기 위해 ‘쉬었기 때문입니다’로 옮겼습니다.
theological_decisions:
- issue: 죽음을 ‘쉼’으로 말하는 지혜문학적 표현
  chosen_reading: ‘쉬었기 때문입니다’로 옮겨 죽음을 쉼으로 비유하되, 그 너머의 교리를 덧붙이지 않았습니다.
  alternative_readings:
  - 안식했기 때문입니다
  - 잠들었기 때문입니다
  rationale: 헬라어는 죽음을 쉼으로 표현하지만, 여기서 중간 상태나 부활 교리를 명시하지는 않으므로, 본문의 비유적 표현을 유지하는 것이 가장 충실합니다.
  doctrine_reference: 본문의 비유를 보존하고 신학적 과잉 해석을 피합니다.
