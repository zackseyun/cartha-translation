  yaml_path: translation/deuterocanon/sirach/022/019.yaml
  text: One who pricks an eye brings forth tears[b][a], and one who pricks a heart reveals feeling.
  footnotes:
  - marker: a
    text: Or 'will cause tears'; the Greek literally speaks of bringing tears down.
    reason: lexical_alternative
  - marker: b
    text: Or 'reveals perception' or 'makes feeling known'; the Greek noun can refer to perception, sensation, or inner sensibility.
    reason: lexical_alternative
translation:
  language: ko
  text: 눈을 찌르는 이는 눈물을 흘리게 하고, 마음을 찌르는 이는 느낌을 드러냅니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘눈물을 일으킬 것이다’. 그리스어는 문자적으로 눈물을 ‘내려오게/끌어내게’ 한다고 말합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘지각을 드러낸다’ 혹은 ‘감각을 드러낸다’. 그리스어 명사는 지각, 감각, 내적 감수성을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ νύσσων
  english_pob_choice: one who pricks
  chosen_korean: 찌르는 이는
  alternatives_korean:
  - 찔러대는 이는
  - 찌른 이는
  - 꿰뚫는 이는
  lexicon: LSJ
  rationale: 현재분사로 된 일반적 행위자를 한국어에서 자연스럽게 풀어, 속담형 경구의 보편성을 살렸습니다. '찌르다'가 'prick'의 구체성과 비유성을 가장 잘 유지합니다.
- source_word: ὀφθαλμόν
  english_pob_choice: an eye
  chosen_korean: 눈을
  alternatives_korean:
  - 한 눈을
  - 그 눈을
  lexicon: LSJ
  rationale: 단수 무관사 표현은 일반 진술이므로 한국어에서는 자연스럽게 보통명사 '눈'으로 옮겼습니다.
- source_word: κατάξει δάκρυα
  english_pob_choice: brings forth tears
  chosen_korean: 눈물을 흘리게 하고
  alternatives_korean:
  - 눈물을 끌어내고
  - 눈물을 떨어뜨리게 하고
  - 눈물을 나오게 하고
  lexicon: LSJ
  rationale: '''bring down''의 직유적 이미지보다 한국어에서 자연스럽고 관용적인 결과 표현인 ''눈물을 흘리게 하다''를 택해, 원문의 생생한 인과성을 유지했습니다.'
- source_word: αἴσθησιν
  english_pob_choice: feeling
  chosen_korean: 느낌을
  alternatives_korean:
  - 감각을
  - 지각을
  - 인식을
  lexicon: LSJ
  rationale: 문맥상 'heart'와 결합해 내적 반응이나 감응을 가리키므로, 지나치게 인지적인 '지각/인식'보다 감정과 감응을 함께 담는 '느낌'이 적절합니다.
