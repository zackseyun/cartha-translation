base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/022/016.yaml
  text: A wooden binding fastened into a building will not be loosened in an earthquake[c][b][a]; so a heart made firm by deliberate counsel will not lose courage in time of trouble.
  footnotes:
  - marker: a
    text: Or 'will not come undone' for 'will not be loosened.' The Greek verb can denote being broken up or falling apart; the chosen rendering follows the fastening/building image.
    reason: lexical_alternative
  - marker: b
    text: The phrase rendered 'by deliberate counsel' is compressed in Greek and may also be understood as 'upon thoughtful purpose' or 'on considered planning.'
    reason: lexical_alternative
  - marker: c
    text: Literally 'in time'; the context suggests a time of testing or crisis.
    reason: lexical_alternative
translation:
  language: ko
  text: 나무로 된 결박이 건물 안에 단단히 고정되어 있으면 지진이 나도 풀리지 않습니다. 그와 같이 사려 깊은 충고로 굳어진 마음은 때가 와도 두려워하지 않습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '''풀리지 않습니다''는 구조적 결속이 끊어지지 않는다는 뜻을 살린 번역입니다. 그리스어 동사는 ''헐거워지다/풀리다''와 ''무너지다/흩어지다''의 뉘앙스를 둘 다 가질 수 있습니다.'
    reason: lexical_alternative
  - marker: b
    text: '''사려 깊은 충고''는 διανοήματος βουλῆς의 압축된 표현을 한국어로 풀어 옮긴 것입니다. ''신중한 계획'' 또는 ''숙고된 뜻''으로도 이해할 수 있습니다.'
    reason: lexical_alternative
  - marker: c
    text: '''때''는 문자적으로는 단순히 ''시기''를 뜻하지만, 문맥상 시험이나 곤란의 순간을 가리킬 수 있습니다.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἱμάντωσις ξυλίνη
  english_pob_choice: wooden binding
  chosen_korean: 나무로 된 결박
  alternatives_korean:
  - 나무 결박
  - 목재 결속
  - 나무로 된 묶음
  lexicon: LSJ
  rationale: ἱμάντωσις는 끈으로 묶은 결박·고정을 가리키므로, 건축적 이미지를 살리되 자연스러운 한국어로 '결박'을 택했습니다. ξυλίνη는 재질 형용사이므로 '나무로 된'으로 옮겼습니다.
- source_word: ἐνδεδεμένη εἰς οἰκοδομήν
  english_pob_choice: fastened into a building
  chosen_korean: 건물 안에 단단히 고정되어 있으면
  alternatives_korean:
  - 건물에 고정되어 있으면
  - 건물 속에 묶여 있으면
  - 건축물 안에 붙들려 있으면
  lexicon: LSJ
  rationale: 완료 분사는 이미 단단히 묶인 상태를 나타내므로 '단단히 고정되어'로 처리했고, εἰς οἰκοδομήν의 건축적 목적지를 자연스럽게 드러내기 위해 '건물 안에'를 사용했습니다.
- source_word: ἐν συσσεισμῷ
  english_pob_choice: in an earthquake
  chosen_korean: 지진이 나도
  alternatives_korean:
  - 지진 속에서도
  - 흔들림 가운데서도
  - 지진 가운데서도
  lexicon: LSJ
  rationale: συσσεισμός는 강한 지진적 흔들림이므로 '지진'이 가장 직접적입니다. 부정문과 함께 한국어 문맥상 '지진이 나도'가 구조적 견고함을 더 분명히 전달합니다.
- source_word: ἐπὶ διανοήματος βουλῆς
  english_pob_choice: by deliberate counsel
  chosen_korean: 사려 깊은 충고
  alternatives_korean:
  - 신중한 계획
  - 숙고된 뜻
  - 고려된 조언
  lexicon: LSJ
  rationale: διανόημα와 βουλή는 생각·의도·숙의·충고의 의미권을 이루므로, 지나치게 좁히지 않으면서도 인격적 권고의 뉘앙스를 살린 '사려 깊은 충고'로 옮겼습니다.
- source_word: ἐν καιρῷ
  english_pob_choice: in time of trouble
  chosen_korean: 때가 와도
  alternatives_korean:
  - 적절한 때에도
  - 위기의 때에도
  - 시련의 때에도
  lexicon: LSJ
  rationale: καιρός는 단순한 시각이 아니라 정해진 때·상황을 가리키므로, 원문의 비유를 살리되 한국어에서는 시험의 상황을 과도하게 덧붙이지 않는 '때가 와도'를 택했습니다.
theological_decisions:
- issue: 마음(καρδία)의 인류학적 의미
  chosen_reading: '''마음''을 중심으로 내적 안정과 용기를 표현했습니다.'
  alternative_readings:
  - '''마음'' 대신 ''생각'''
  - '''속사람'''
  - '''정신'''
  rationale: 이 절은 사고력보다 내적 중심의 안정과 용기를 말하므로, 성서적 인류학을 보존하는 '마음'이 가장 적절합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 6
