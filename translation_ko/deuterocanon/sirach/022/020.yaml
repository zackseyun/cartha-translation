  source_fidelity: 첫 절의 πετεινά와 αὐτά는 복수이므로 ‘새들을 … 새들을’로 분명히 나타내는 것이 원문에 더 충실합니다. ὀνειδίζων은 단순한 훈계나 꾸지람보다 상대에게 비난·책망을 가하는 뜻이므로 ‘꾸짖는’보다 ‘비난하는’이 적절합니다. διαλύσει의 미래형은 한국어 격언체 현재형으로 자연스럽게 유지할 수 있습니다.
  naturalness: 기존의 ‘그것들을’은 살아 있는 새를 가리키는 말로 다소 부자연스럽고 선행사와의 호응도 약합니다. ‘새들을 쫓아내고’라고 반복하면 간결하고 자연스럽습니다.
  terminology: ‘우정’은 φιλίαν의 적절한 번역입니다. 신학적 전문 용어 문제는 없습니다.
