  - severity: medium
    issue: ὀνειδίζων의 의미 범위
    rationale: ‘꾸짖다’는 윗사람의 교정적 훈계라는 뉘앙스를 띨 수 있습니다. 원문의 비난·책망·모욕적 비난의 사회적 뉘앙스에는 ‘비난하다’가 더 중립적이고 충실합니다.
  revised_text: 새들을 향해 돌을 던지는 사람은 새들을 쫓아내고, 친구를 비난하는 사람은 우정을 깨뜨립니다.
