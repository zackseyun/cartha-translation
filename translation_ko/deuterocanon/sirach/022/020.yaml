  yaml_path: translation/deuterocanon/sirach/022/020.yaml
  text: One who throws a stone at birds drives them away[b][a], and one who reproaches a friend will break up friendship.
  footnotes:
  - marker: a
    text: Or 'scares them away.' The Greek verb denotes driving off or causing to flee.
    reason: lexical_alternative
  - marker: b
    text: Or 'insults a friend.' The Greek verb can carry the sense of reproaching or heaping scorn on someone.
    reason: lexical_alternative
translation:
  language: ko
  text: 새들을 향해 돌을 던지는 사람은 새들을 쫓아내고, 친구를 비난하는 사람은 우정을 깨뜨립니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βάλλων λίθον ἐπὶ πετεινὰ
  english_pob_choice: One who throws a stone at birds
  chosen_korean: 새에게 돌을 던지는 사람
  alternatives_korean:
  - 새들을 향해 돌을 던지는 사람
  - 새를 향해 돌을 던지는 사람
  lexicon: BDAG
  rationale: 현재분사 βάλλων은 잠언형 일반 진술이므로 ‘-하는 사람’으로 옮겼고, πετεινά는 이 문맥에서 자연스럽게 ‘새’로 옮겼습니다.
- source_word: ἀποσοβεῖ αὐτά
  english_pob_choice: drives them away
  chosen_korean: 그것들을 쫓아버리고
  alternatives_korean:
  - 그것들을 쫓아내고
  - 그것들을 놀라 달아나게 하고
  lexicon: LSJ
  rationale: 동사는 단순히 놀라게 하는 것보다 몰아내거나 쫓아버리는 의미가 강하므로, 짧고 관용적인 ‘쫓아버리다’로 반영했습니다.
- source_word: ὀνειδίζων φίλον
  english_pob_choice: one who reproaches a friend
  chosen_korean: 친구를 꾸짖는 사람
  alternatives_korean:
  - 친구를 책망하는 사람
  - 친구를 모욕하는 사람
  lexicon: BDAG
  rationale: ὀνειδίζων은 책망·비난·수치 줌의 범위를 가지므로, 도덕적 비난의 뉘앙스를 살리면서도 과도하게 강한 ‘모욕’은 피했습니다.
- source_word: διαλύσει φιλίαν
  english_pob_choice: will break up friendship
  chosen_korean: 우정을 깨뜨립니다
  alternatives_korean:
  - 우정을 끊습니다
  - 친분을 무너뜨립니다
  lexicon: BDAG
  rationale: φιλίαν은 관계로서의 우정을 가리키므로, 현대 한국어에서 자연스럽고 관계 해체의 결과를 분명히 보여 주는 ‘우정을 깨뜨리다’로 옮겼습니다.
theological_decisions:
- issue: 잠언형 일반 진술의 문체
  chosen_reading: 직설적 교훈을 살리기 위해 일반 진술을 현재형으로 번역했습니다.
  alternative_readings:
  - 미래형으로 옮기기
  - 명령형처럼 보이게 옮기기
  rationale: 그리스어 현재분사와 미래동사는 격언적 경구로 기능하므로, 한국어에서도 현재형 서술이 가장 자연스럽고 원문의 교훈성을 유지합니다.
  doctrine_reference: 지혜문학의 격언체
