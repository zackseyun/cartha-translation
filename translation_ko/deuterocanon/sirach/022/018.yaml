base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/022/018.yaml
  text: Stakes set on a height opposite the wind will never hold out[a]; so a timid heart, set on a foolish thought[b], will never hold out against any fear.
  footnotes:
  - marker: a
    text: Or 'facing the wind' / 'against the wind.' The Greek image is of stakes exposed directly to the wind.
    reason: lexical_alternative
  - marker: b
    text: The Greek uses an emphatic negation ('will certainly not endure').
    reason: lexical_alternative
translation:
  language: ko
  text: 높은 곳에 세워져 바람을 마주한 말뚝들은 결코 버티지 못합니다[a]. 이와 같이 어리석은 생각 위에 놓인 겁쟁이 마음도 어떤 두려움 앞에서도 결코 버티지 못합니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘바람을 마주한’은 헬라어 κατέναντι ἀνέμου의 직역적 공간 이미지를 반영한 것입니다.
    reason: lexical_alternative
  - marker: b
    text: 헬라어의 οὐ μή는 단순한 미래 부정보다 훨씬 강한 ‘결코…않다’의 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρακες
  english_pob_choice: stakes
  chosen_korean: 말뚝들
  alternatives_korean:
  - 기둥들
  - 말뚝
  - 울타리 말뚝들
  lexicon: LSJ
  rationale: χάρακες는 뾰족한 말뚝이나 기둥을 가리키므로, 비유의 구체성을 살리기 위해 표준적이고 자연스러운 ‘말뚝들’로 옮겼습니다.
- source_word: ἐπὶ μετεώρου κείμενοι
  english_pob_choice: set on a height
  chosen_korean: 높은 곳에 세워져
  alternatives_korean:
  - 공중에 놓여
  - 높이 놓여
  - 높은 지대에 세워져
  lexicon: LSJ
  rationale: 직역의 ‘떠 있는’ 이미지는 피하고, 노출되고 불안정한 위치라는 뜻을 살려 ‘높은 곳에 세워져’로 표현했습니다.
- source_word: οὐ μὴ ὑπομείνωσιν / οὐ μὴ ὑπομείνῃ
  english_pob_choice: will never hold out
  chosen_korean: 결코 버티지 못합니다
  alternatives_korean:
  - 결코 견디지 못합니다
  - 반드시 버티지 못합니다
  - 결코 남아 있지 못합니다
  lexicon: BDAG/LSJ
  rationale: οὐ μή의 강한 부정을 한국어에서도 분명히 드러내기 위해 ‘결코’와 ‘버티지 못합니다’를 사용했습니다.
- source_word: καρδία δειλή
  english_pob_choice: a timid heart
  chosen_korean: 겁쟁이 마음
  alternatives_korean:
  - 소심한 마음
  - 두려움 많은 마음
  - 비겁한 마음
  lexicon: LSJ
  rationale: δειλή는 단순한 감정적 겁을 넘는 약함을 포함하므로, 비유적이고 인물화된 표현인 ‘겁쟁이 마음’이 문맥에 가장 직접적입니다.
- source_word: ἐπὶ διανοήματος μωροῦ
  english_pob_choice: set on a foolish thought
  chosen_korean: 어리석은 생각 위에 놓인
  alternatives_korean:
  - 어리석은 계획에 기대는
  - 어리석은 생각에 고정된
  - 어리석은 분별에 의지한
  lexicon: LSJ
  rationale: διανόημα는 생각·의도·계획을 아우르므로, 의미 범위를 보존하는 ‘생각’으로 두고, ἐπί의 지탱 이미지에 맞춰 ‘위에 놓인’으로 옮겼습니다.
- source_word: παντὸς φόβου
  english_pob_choice: against any fear
  chosen_korean: 어떤 두려움 앞에서도
  alternatives_korean:
  - 모든 두려움 앞에서도
  - 어느 두려움에도
  - 어떤 공포 앞에서도
  lexicon: LSJ
  rationale: 분배적 의미를 살리면서도 한국어 경구체에 자연스럽게 들리도록 ‘어떤 두려움 앞에서도’로 표현했습니다.
theological_decisions:
- issue: 반복되는 οὐ μή의 강조
  chosen_reading: 두 번 모두 ‘결코 버티지 못합니다’로 반복해 강한 부정을 드러냈습니다.
  alternative_readings:
  - ‘절대로 견디지 못합니다’
  - 첫 절은 ‘버티지 못합니다’, 둘째 절은 ‘견디지 못합니다’
  rationale: 이 속담형 문장은 단순한 미래 부정이 아니라 강한 확실성의 부정이므로, 반복을 통해 경고의 힘을 보존했습니다.
  doctrine_reference: 잠언적 경고의 수사적 강조
- issue: 마음과 생각의 관계
  chosen_reading: ‘마음’과 ‘생각’을 분리해, 내적 취약성과 그 기반이 되는 어리석음을 함께 드러냈습니다.
  alternative_readings:
  - ‘겁쟁이 마음, 어리석은 생각에 기대는 마음’
  - ‘소심한 마음, 어리석은 계획 위에 놓인’
  rationale: 원문은 심리 상태(καρδία)와 그 지지대(διανόημα)를 병치하므로, 둘의 구분을 살리는 편이 원문의 교훈 구조에 더 충실합니다.
  doctrine_reference: 지혜문학의 인과적 비유
