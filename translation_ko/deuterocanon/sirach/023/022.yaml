  lexicon: LSJ
  rationale: καταλιποῦσα의 단순한 떠남을 살리되, ‘버리다’보다 강한 도덕적 색채를 덧입히지 않도록 ‘떠나’로 옮겼습니다.
- source_word: ἐξ ἀλλοτρίου
  english_pob_choice: by another man / from another man
  chosen_korean: 다른 사람에게서
  alternatives_korean:
  - 다른 남자에게서
  - 낯선 사람에게서
  - 외부인에게서
  lexicon: LSJ
  rationale: ἐξ ἀλλοτρίου의 ‘~에게서/~로부터’라는 출처 개념을 반영하면서, 혼인 밖의 출산이라는 함의를 문맥상 자연스럽게 드러내는 표현으로 옮겼습니다.
theological_decisions:
- issue: 문장이 직접적인 비난 호칭을 붙이지 않고 행위와 결과를 말하는 방식
  chosen_reading: 본문 자체의 표현대로 ‘남편을 떠나 다른 사람에게서 상속자를 내는 여자’라고 옮기고, 본문에 없는 ‘음행한 여자’ 같은 평가는 덧붙이지 않았습니다.
  alternative_readings:
  - 음행한 여자가 남편을 떠나...
  - 남편을 버린 여자가...
  rationale: 헬라어는 행위와 결과를 서술할 뿐, 이 절 자체에서 도덕적 칭호를 명시하지 않습니다. 따라서 원문의 수위를 넘지 않도록 했습니다.
  doctrine_reference: 원문 우선 번역 원칙; 본문이 말하지 않는 판단을 본문에 주입하지 않음.
