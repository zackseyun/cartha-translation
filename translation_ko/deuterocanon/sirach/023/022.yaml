    text: 또는 ‘다른 이에게서’. 헬라어 ἐξ ἀλλοτρίου는 문자적으로 ‘다른 이에게서’를 뜻하며, 이 문맥에서는 남편이 아닌 다른 남자를 가리킵니다.
    reason: lexical_alternative
