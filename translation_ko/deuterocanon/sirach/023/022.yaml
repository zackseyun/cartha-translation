  - 아내
  lexicon: LSJ
  rationale: 문맥에 남편이 이미 제시되어 있으므로 관계를 중복해 ‘아내’로 고정하기보다, 일반 명사 ‘여자’가 원문의 보편 진술을 더 직접적으로 드러냅니다.
- source_word: καταλιποῦσα τὸν ἄνδρα
  english_pob_choice: who leaves her husband
  chosen_korean: 남편을 떠나
  alternatives_korean:
  - 남편을 버리고
