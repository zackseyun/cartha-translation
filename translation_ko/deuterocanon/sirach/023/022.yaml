translation:
  language: ko
  text: 이와 같이, 남편을 떠나 다른 사람에게서 상속자를 내는 여자도 마찬가지입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘다른 남자에게서’. 헬라어 ἐξ ἀλλοτρίου는 혼인 밖의 사람, 곧 다른 남자를 가리키므로 그 뜻을 분명히 했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως καὶ
  english_pob_choice: So also
  chosen_korean: 이와 같이, ...도 마찬가지입니다
  alternatives_korean:
  - 그와 같이, ...도 그렇습니다
  - 그와 같이 또한
  lexicon: LSJ
  rationale: 앞선 비교를 이어 주는 연결어로서 ‘So also’의 비교·귀결 관계를 자연스럽게 살리면서도 문어체 흐름을 유지합니다.
- source_word: γυνή
  english_pob_choice: a woman
