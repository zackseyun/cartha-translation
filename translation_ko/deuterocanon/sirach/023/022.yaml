  text: So also a woman who leaves her husband and presents an heir by another man;[a]
  footnotes:
  - marker: a
    text: Or 'from a stranger.' The Greek ἐξ ἀλλοτρίου refers to someone outside the marriage; 'by another man' makes that sense explicit in English.
