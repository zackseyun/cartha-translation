  lexicon: LSJ
  rationale: ἐξ ἀλλοτρίου의 ‘~에게서/~로부터’라는 출처 개념을 반영하면서, 혼인 밖의 출산이라는 함의를 문맥상 자연스럽게 드러내는 표현으로 옮겼습니다.
