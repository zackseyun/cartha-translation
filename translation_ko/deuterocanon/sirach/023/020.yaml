  text: Before all things were created[a], it was known to him; so also after they are completed.
  footnotes:
  - marker: a
    text: Or, 'Before all things were created, he knew it; likewise after completion.' The Greek form ἔγνωσται can be represented in more than one way in English, though the sense of complete prior knowledge is clear.
    reason: lexical_alternative
translation:
  language: ko
  text: 모든 것이 창조되기 전에 그분께는 이미 알려져 있었고, 모든 것이 완성된 뒤에도 그렇습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, '모든 것이 창조되기 전에, 그가 그것을 아셨고; 마찬가지로 완성된 뒤에도.' 그리스어 ἔγνωσται는 영어로 여러 방식으로 옮길 수 있으나, 완전한 사전 지식이라는 뜻은 분명합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὶν ἢ
  english_pob_choice: Before
  chosen_korean: -기 전에
  alternatives_korean:
  - 보다 먼저
  - 이전에
  lexicon: LSJ
  rationale: 시간적 우선성을 자연스러운 한국어 관용으로 옮기되, 앞선 시점을 분명히 드러내기 위해 '-기 전에'를 사용했습니다.
- source_word: κτισθῆναι τὰ πάντα
  english_pob_choice: were created / all things
  chosen_korean: 모든 것이 창조되기 전에
  alternatives_korean:
  - 만물이 지어지기 전에
  - 모든 것이 만들어지기 전에
  lexicon: LSJ
  rationale: κτίζω의 수동적 의미를 살려 '창조되다'로 옮겼고, τὰ πάντα는 포괄성을 유지하기 위해 '모든 것'으로 렌더링했습니다.
- source_word: ἔγνωσται αὐτῷ
  english_pob_choice: it was known to him
  chosen_korean: 그분께는 이미 알려져 있었고
  alternatives_korean:
  - 그분께는 이미 알려졌고
  - 그분은 이미 아셨고
  lexicon: LSJ
  rationale: 완료 수동형의 상태적 의미를 살리기 위해 '알려져 있었다'로 옮겼고, dative αὐτῷ는 문맥상 하나님을 가리키므로 공손한 지시어 '그분께'로 처리했습니다.
- source_word: οὕτως καὶ
  english_pob_choice: so also
  chosen_korean: 그리고 … 뒤에도 그렇습니다
  alternatives_korean:
  - 그와 같이 또한
  - 그처럼 또한
  lexicon: LSJ
  rationale: 전반부와 후반부의 평행을 한국어 문장 구조 안에서 자연스럽게 이어 주는 연결로 처리했습니다.
- source_word: μετὰ τὸ συντελεσθῆναι
  english_pob_choice: after they are completed
  chosen_korean: 모든 것이 완성된 뒤에도
  alternatives_korean:
  - 완결된 뒤에도
  - 다 끝난 뒤에도
  lexicon: LSJ
  rationale: 완료를 뜻하는 συντελέω의 의미를 '완성되다'로 옮겨 앞 절의 '창조되기'와 대구를 이루게 했습니다.
theological_decisions:
- issue: αὐτῷ의 지시 대상과 신학적 명시 여부
  chosen_reading: 문맥상 하나님을 가리키지만, 본문에는 '그분께'로만 옮겨 명시적 주어를 덧붙이지 않았습니다.
  alternative_readings:
  - '''하나님께''라고 풀어 써서 지시 대상을 명시하는 방식'
  - 대상을 완전히 생략하여 더 불특정하게 번역하는 방식
  rationale: 지혜문학적 진술의 압축성을 유지하면서도, 과도한 해석을 본문에 끼워 넣지 않기 위해 문맥적 지시만 남겼습니다.
  doctrine_reference: 문맥이 지시하는 하나님 이해를 보존하되, 본문이 직접 말하지 않은 내용을 확정적으로 삽입하지 않음
