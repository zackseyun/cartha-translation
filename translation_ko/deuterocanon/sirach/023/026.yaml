  source_fidelity: 그리스어의 미래 시제와 병렬 구조, ‘기억/저주/치욕/지워지지 않음’의 핵심 의미는 대체로 충실히 반영했습니다. 그러나 ‘자신의 기억’은 한국어에서 그녀가 지닌 기억 능력이나 자기 자신의 기억으로도 읽힐 수 있어, τὸ μνημόσυνον αὐτῆς가 뜻하는 ‘그녀에 대한 기억’으로 명확히 해야 합니다.
  naturalness: 합쇼체 문장은 자연스럽지만, ‘그녀의 치욕’보다 ‘그녀가 받은 치욕’이 아니므로 원문의 소유 구조를 유지한 ‘그녀의 치욕’도 가능하나 현행 표현은 충분히 자연스럽습니다. ‘저주가 되게’는 결과를 나타내면서도 ‘저주거리’보다 문어적이고 중립적인 표현입니다.
