  text: She will leave her memory for a curse, and her disgrace will not be wiped away.
translation:
  language: ko
  text: 그녀는 자신의 기억을 저주거리로 남길 것이며, 그녀의 치욕은 지워지지 않을 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘저주거리로’는 εἰς κατάραν의 결과적 의미를 살린 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘지워지지 않을 것입니다’는 ‘닦여 없어지지 않을 것입니다’라는 문자적 비유를 현대 한국어로 옮긴 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: καταλείψει
  english_pob_choice: will leave
  chosen_korean: 남길 것이며
  alternatives_korean:
  - 떠날 것이며
  - 버릴 것이며
  - 남겨 둘 것입니다
  lexicon: BDAG
  rationale: καταλείπω의 미래형으로서 ‘뒤에 남기다’의 뜻을 살려, 단순히 떠난다는 의미보다 결과로 남는 상태를 나타내는 ‘남기다’를 택했습니다.
- source_word: εἰς κατάραν
  english_pob_choice: for a curse
  chosen_korean: 저주거리로
  alternatives_korean:
  - 저주로
  - 저주가 되도록
  - 저주로서
  lexicon: BDAG
  rationale: εἰς + 대격은 결과를 나타내므로, 그녀의 기억이 ‘저주의 대상/저주거리’가 된다는 결과적 의미를 한국어로 자연스럽게 옮겼습니다.
- source_word: τὸ μνημόσυνον αὐτῆς
  english_pob_choice: her memory
  chosen_korean: 자신의 기억
  alternatives_korean:
  - 그녀의 기억
  - 그녀의 회상
  - 그녀의 기념
  lexicon: BDAG
  rationale: 여기서는 물리적 기념물이 아니라 사람에 대한 지속적 기억이나 명성을 가리키므로, ‘기억’으로 옮기되 자연스러운 한국어 흐름을 위해 소유 표현을 조정했습니다.
- source_word: τὸ ὄνειδος αὐτῆς
  english_pob_choice: her disgrace
  chosen_korean: 치욕
  alternatives_korean:
  - 수치
  - 불명예
  - 모욕
  lexicon: BDAG
  rationale: ὄνειδος는 공적 수치와 비난의 뉘앙스를 가지므로, 현대 한국어에서 그 사회적·도덕적 무게를 잘 드러내는 ‘치욕’을 택했습니다.
- source_word: οὐκ ἐξαλειφθήσεται
  english_pob_choice: will not be wiped away
  chosen_korean: 지워지지 않을 것입니다
  alternatives_korean:
  - 지워지지 않을 것입니다
  - 닦여 없어지지 않을 것입니다
  - 지워 없어지지 않을 것입니다
  lexicon: BDAG
  rationale: ἐξαλείφω의 문자적 비유인 ‘지워지다/닦여 없어지다’를 보존하면서도, 현대 독자가 바로 이해할 수 있는 표현으로 옮겼습니다.
theological_decisions:
- issue: 지혜문학의 엄중한 결과 진술을 완화할지 여부
  chosen_reading: 추가 해석 없이 지속되는 수치와 저주의 결과를 그대로 유지했습니다.
  alternative_readings:
  - 일반적인 평판 하락으로 완화
  - 하나님의 직접적 심판 언어를 덧붙여 확대
  rationale: 본문은 기억, 저주, 치욕의 지속을 말할 뿐 더 넓은 신학적 설명을 붙이지 않습니다. 따라서 경고의 강도를 유지하되, 본문 밖의 판단을 덧붙이지 않았습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
