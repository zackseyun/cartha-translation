  text: Who will set whips over my thoughts[a], and the discipline of wisdom over my heart, so that they may not spare me for my ignorances, and may not overlook their sins?
  footnotes:
  - marker: a
    text: 'Greek: ''their sins.'' The wording is difficult in context after ''my ignorances''; some would understand the sense as ''my sins'' or otherwise smooth the pronoun.'
    reason: alternative_reading
translation:
  language: ko
  text: 누가 내 생각 위에 채찍을, 내 마음 위에 지혜의 훈계를 두어서, 내 무지로 인한 일들 때문에 나를 아끼지 않게 하고, 그들의 죄를 눈감아 주지 않게 하겠습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 본문은 ‘그들의 죄’라고 읽습니다. 앞의 ‘내 무지로 인한 일들’ 뒤에서 문맥상 난해하여, 일부는 ‘내 죄’로 이해하거나 인칭을 완화해 읽기도 합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπιστήσει ἐπὶ
  english_pob_choice: will set ... over
  chosen_korean: 위에 두어서
  alternatives_korean:
  - 위에 세워서
  - 위에 놓아서
  - 맡겨서
  lexicon: LSJ
  rationale: ἐπὶ의 지배적 이미지를 한국어에서 가장 자연스럽게 살리면서, 외적이고 강한 제재가 내면 위에 ‘놓이는’ 느낌을 유지합니다.
- source_word: μάστιγας
  english_pob_choice: whips
  chosen_korean: 채찍을
  alternatives_korean:
  - 매를
  - 채찍질을
  - 채찍들
  lexicon: LSJ
  rationale: 직접적이고 고통스러운 징계의 이미지를 보존하려면 완곡한 ‘매’보다 ‘채찍’이 더 स्रोत에 가깝습니다.
- source_word: παιδείαν σοφίας
  english_pob_choice: the discipline of wisdom
  chosen_korean: 지혜의 훈계
  alternatives_korean:
  - 지혜의 징계
  - 지혜의 교육
  - 지혜의 단련
  lexicon: LSJ
  rationale: παιδεία는 단순한 교육보다 징계·훈육의 성격이 강하므로 ‘훈계’로 풀어, 지혜에 속한 교정적 훈련의 뉘앙스를 살렸습니다.
- source_word: ἀγνοήμασίν μου
  english_pob_choice: my ignorances
  chosen_korean: 내 무지로 인한 일들
  alternatives_korean:
  - 내 무지들
  - 내 무지한 잘못들
  - 내 알지 못하고 저지른 일들
  lexicon: LSJ
  rationale: 명사형을 그대로 ‘무지들’로 옮기면 어색하므로, ‘무지로 인한 일들’로 풀어 사과의 대상이 되는 과실이라는 의미를 유지했습니다.
- source_word: τὰ ἁμαρτήματά αὐτῶν
  english_pob_choice: their sins
  chosen_korean: 그들의 죄
  alternatives_korean:
  - 그 죄
  - 내 죄
  - 그들의 잘못
  lexicon: LSJ
  rationale: 그리스어의 인칭 대명사 문제를 회피하지 않고, POB의 주석처럼 난해성을 드러내기 위해 본문에는 그대로 ‘그들의 죄’를 유지했습니다.
theological_decisions:
- issue: 징계와 지혜의 관계
  chosen_reading: 지혜는 부드러운 안내가 아니라 내면을 교정하는 고통스러운 징계로 묘사했습니다.
  alternative_readings:
  - 완곡하게 ‘절제’나 ‘인도’로 약화시키기
  - 도덕적 교훈으로 일반화하기
  rationale: 본문은 자기 징계를 구하는 탄원문이므로, 고통의 요소를 약화하면 잠언적·지혜문학적 긴장이 사라집니다.
  doctrine_reference: Translation philosophy §§1, 6
- issue: 마지막 절의 인칭 불일치
  chosen_reading: ‘그들의 죄’라는 전승을 본문에 보존하고, 독자가 난점을 인지하도록 번역했습니다.
  alternative_readings:
  - ‘내 죄’로 매끄럽게 정리하기
  - 문맥에 따라 해석을 결론짓기
  rationale: 현전하는 그리스어 본문을 임의로 수정하지 않고, 난해한 인칭을 그대로 드러내는 것이 감사 가능한 번역 원칙에 부합합니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
