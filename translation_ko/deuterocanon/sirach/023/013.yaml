  text: Do not accustom your mouth to crude ignorance, for in it there is a word of sin.
translation:
  language: ko
  text: 입이 천박한 무지에 익숙해지도록 하지 마십시오. 그 안에는 죄가 되는 말이 있기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπαιδευσίαν
  english_pob_choice: crude ignorance
  chosen_korean: 무례한 무지
  alternatives_korean:
  - 거친 무지
  - 천박한 무지
  - 미숙한 무지
  lexicon: ἀπαιδευσία
  rationale: 단순한 ‘무지’보다 교육되지 않아 거칠고 예의 없는 상태를 함께 드러내기 위해 ‘무례한’으로 옮겼습니다. POB의 crude는 물리적 거침보다 품성의 조잡함을 포함합니다.
- source_word: μὴ συνεθίσῃς τὸ στόμα σου
  english_pob_choice: Do not accustom your mouth
  chosen_korean: 입에 ... 익숙하게 하지 마십시오
  alternatives_korean:
  - 입을 ... 익히지 마십시오
  - 입에 ... 습관들이지 마십시오
  lexicon: συνεθίζω + στόμα
  rationale: ‘입’을 직접 목적어로 두어 말의 습관 형성을 경계하는 원문의 비유를 살리고, 한국어에서는 자연스러운 합쇼체 명령형으로 다듬었습니다.
- source_word: λόγος ἁμαρτίας
  english_pob_choice: a word of sin
  chosen_korean: 죄의 말
  alternatives_korean:
  - 죄에 속한 말
  - 죄의 한 마디
  lexicon: λόγος + ἁμαρτία
  rationale: ‘λόγος’를 여기서는 단순한 ‘단어’보다 실제로 입에서 나오는 ‘말’로 이해하는 것이 자연스럽고, 원문의 소유/관계 표현도 그대로 반영합니다.
theological_decisions:
- issue: 입과 말의 도덕적 책임을 직접적으로 경고하는 표현
  chosen_reading: 원문의 경고를 완화하지 않고, 말의 습관이 죄로 이어질 수 있음을 직설적으로 살렸습니다.
  alternative_readings:
  - ‘무례한 무지’를 ‘어리석은 말버릇’처럼 완곡하게 처리
  - ‘죄의 말’을 ‘죄를 부르는 말’로 해석적 확장
  rationale: 지혜문학의 훈계를 약화시키지 않기 위해, 원문의 도덕적 긴장과 경고성을 유지하는 방향을 택했습니다.
  doctrine_reference: 잠언적 훈계와 말의 책임(잠 18:7; 마 12:36)
