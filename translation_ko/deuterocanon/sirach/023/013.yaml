review_pass:
  verdict: revise
  source_fidelity: 원문의 명령(‘당신의 입을 …에 익숙하게 하지 말라’)과 이유절을 유지합니다. 다만 ἀπαιδευσίαν ἀσυρῆ는 ‘무례한 무지’보다 ‘천박한 무지’가 ‘교육되지 않음/교양 없음’과 ‘거침·상스러움’의 결합을 더 잘 반영합니다. λόγος ἁμαρτίας는 한국어에서 자연스럽게 ‘죄가 되는 말’로 옮기되, 원문의 단수성과 죄 관련성을 보존했습니다.
  naturalness: 초안의 ‘입에 무례한 무지를 익숙하게 하다’는 조사 결합과 의미 관계가 부자연스럽습니다. ‘입이 …에 익숙해지도록 하지 마십시오’로 고쳐 원문의 입의 비유를 보존하면서 현대 표준 한국어의 자연스러운 합쇼체가 되게 했습니다.
  terminology: ‘천박한 무지’는 ἀπαιδευσίαν ἀσυρῆ의 거칠고 교양 없는 성격을 비교적 직역적으로 드러냅니다. ‘죄가 되는 말’은 ‘죄의 말’보다 현대 한국어에서 명료하지만, 죄를 유발한다는 인과관계로 과도하게 확장하지 않고 죄에 속하는 말을 가리킵니다.
  issues:
  - severity: medium
    issue: ‘입에 무례한 무지를 익숙하게 하지 마십시오’가 비자연스럽고 의미 연결이 불명확합니다.
    rationale: στόμα를 συνεθίσῃς의 목적어로 하는 원문의 비유를 한국어 어순과 조사에 맞추어 옮길 필요가 있습니다.
  - severity: low
    issue: ‘무례한 무지’와 ‘죄의 말’은 현대 한국어에서 어색하거나 의미가 다소 불투명합니다.
    rationale: ἀσυρής의 조잡하고 천박한 뉘앙스에는 ‘천박한’이 더 적합하며, λόγος ἁμαρτίας는 ‘죄가 되는 말’로 해야 자연스럽습니다.
  revised_text: 입이 천박한 무지에 익숙해지도록 하지 마십시오. 그 안에는 죄가 되는 말이 있기 때문입니다.
