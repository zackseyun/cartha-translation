  to: 입이 천박한 무지에 익숙해지도록 하지 마십시오. 그 안에는 죄가 되는 말이 있기 때문입니다.
  rationale: 문법적으로 어색한 ‘입에 … 익숙하게 하다’를 자연스러운 사역·허용 표현으로 바로잡고, 핵심 어휘를 현대 한국어 관용에 맞게 조정했습니다. 본문의 모호한 명사구는 해석적으로 특정 말의 종류로 좁히지 않았으며, 영어 감사본의 ‘crude ignorance’와도 부합합니다.
