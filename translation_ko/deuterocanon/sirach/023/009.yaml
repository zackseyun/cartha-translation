  text: Do not accustom your mouth to an oath[a], and do not become accustomed to invoking the Holy One by name.
  footnotes:
  - marker: a
    text: Or 'do not become accustomed to invoking the holy name.' The Greek ὀνομασίᾳ τοῦ ἁγίου can be understood as naming or invoking the Holy One, with the sense of reverent misuse of the divine name in view.
    reason: lexical_alternative
translation:
  language: ko
  text: 맹세에 너의 입을 익숙하게 하지 말고, 거룩하신 분의 이름을 부르는 일에도 익숙해지지 마십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘거룩한 이름을 부르는 일에 익숙해지지 마십시오.’ ελλην어 ὀνομασίᾳ τοῦ ἁγίου는 ‘거룩하신 분을 이름으로 부르는 일’ 또는 ‘거룩한 이름을 부르는 일’로 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅρκῳ
  english_pob_choice: to an oath
  chosen_korean: 맹세에
  alternatives_korean:
  - 맹세로
  - 맹세에 대하여
  - 서약에
  lexicon: BDAG
  rationale: 여격은 ἐθίζω가 요구하는 습관화의 대상이므로, 한국어에서도 ‘맹세에’로 두어 반복적 습관의 방향을 살렸습니다.
- source_word: μὴ ἐθίσῃς
  english_pob_choice: Do not accustom
  chosen_korean: 익숙하게 하지 말고
  alternatives_korean:
  - 습관들이지 말고
  - 익숙해지게 하지 말고
  - 훈련시키지 말고
  lexicon: LSJ
  rationale: ‘ἐθίζω’의 핵심은 습관화이므로, 현대 한국어에서 자연스럽고 직접적인 ‘익숙하게 하다’로 옮겼습니다.
- source_word: ὀνομασίᾳ τοῦ ἁγίου
  english_pob_choice: invoking the Holy One by name
  chosen_korean: 거룩하신 분의 이름을 부르는 일
  alternatives_korean:
  - 거룩하신 분을 이름으로 부르는 일
  - 거룩한 분의 이름을 부르는 일
  - 거룩한 이름을 부르는 일
  lexicon: LSJ
  rationale: ὀνομασίᾳ는 단순한 ‘언급’보다 이름을 통한 호칭/호명 행위를 가리킬 수 있어, POB의 해석을 반영하되 본문이 허용하는 범위 안에서 ‘이름을 부르는 일’로 옮겼습니다.
- source_word: τοῦ ἁγίου
  english_pob_choice: the Holy One
  chosen_korean: 거룩하신 분
  alternatives_korean:
  - 거룩한 이
  - 거룩한 분
  - 성자
  lexicon: LSJ
  rationale: 직역하면 ‘거룩한 이’이지만, 문맥상 하나님을 가리키는 경외적 호칭이므로 한국어에서 자연스러운 존칭형 ‘거룩하신 분’을 택했습니다.
theological_decisions:
- issue: τοῦ ἁγίου의 지시 대상과 표현 방식
  chosen_reading: 하나님을 가리키는 경외적 호칭으로 읽어 ‘거룩하신 분’으로 번역했습니다.
  alternative_readings:
  - ‘거룩한 이름’으로 메타니미적으로 이해하기
  - 더 일반적으로 ‘거룩한 것’으로 옮기기
  rationale: 본문은 맹세와 이름 부름의 습관화를 경고하므로, 지시 대상을 본문이 암시하는 신적 호칭으로 유지하는 편이 원문과 POB의 긴장을 더 잘 보존합니다.
  doctrine_reference: Original-language primacy over translation tradition
- issue: 경고의 범위
  chosen_reading: 모든 맹세를 절대 금지한다기보다, 맹세와 거룩한 이름 사용을 습관적으로 만드는 태도를 금합니다.
  alternative_readings:
  - 모든 형태의 맹세를 전면 금지하기
  rationale: 두 동사 모두 습관화/익숙해짐을 가리키므로, 번역도 ‘익숙하게’와 ‘익숙해지지’의 반복을 살려 행위의 상습성을 강조해야 합니다.
  doctrine_reference: Preserve theological tension rather than resolve it
