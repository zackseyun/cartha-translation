  yaml_path: translation/deuterocanon/sirach/023/007.yaml
  text: Hear instruction of the mouth[a], children[b], and the one who keeps it will certainly not be caught.
  footnotes:
  - marker: a
    text: Or 'Hear discipline of the mouth' or 'Hear instruction about speech.' The Greek expression is compact and can be rendered more formally or more idiomatically.
    reason: lexical_alternative
  - marker: b
    text: '''Will certainly not be caught'' translates an emphatic Greek negation; alternatively, ''will by no means be taken.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 자녀들아, 말에 관한 훈계[a]를 들으십시오. 그것을 지키는 자는 결코 잡히지 않을 것입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘입의 훈계’, ‘입에 대한 훈계’로도 옮길 수 있습니다. 헬라어 표현은 매우 압축되어 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘결코 잡히지 않을 것입니다’는 헬라어의 강한 부정을 옮긴 것입니다. 또는 ‘결코 붙잡히지 않을 것입니다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Παιδείαν
  english_pob_choice: instruction
  chosen_korean: 훈계
  alternatives_korean:
  - instruction을 따른 ‘교훈’
  - 훈련
  - 가르침
  lexicon: BDAG
  rationale: 지혜문맥에서 παιδεία는 단순 정보 전달보다 말에 대한 훈육과 교정을 포함하므로, 한국어로는 ‘훈계’가 의미의 형성과 경계성을 함께 살립니다.
- source_word: στόματος
  english_pob_choice: of the mouth
  chosen_korean: 입술의
  alternatives_korean:
  - 입의
  - 말의
  - 입에 관한
  lexicon: BDAG
  rationale: 직역하면 ‘입의’이지만, 한국어에서는 ‘입술’이 발화와 언어 습관을 더 자연스럽게 가리켜 원문의 말하기 윤리를 잘 드러냅니다.
- source_word: ὁ φυλάσσων
  english_pob_choice: the one who keeps it
  chosen_korean: 그것을 지키는 자
  alternatives_korean:
  - 그것을 지키는 사람
  - 그것을 간수하는 자
  - 그것을 지키는 이
  lexicon: BDAG
  rationale: φυλάσσω는 단순 보존보다 주의 깊게 지키는 뜻이 강하므로, 지혜문맥에 맞게 ‘지키는 자’로 옮겼습니다.
- source_word: οὐ μὴ ἁλῷ
  english_pob_choice: will certainly not be caught
  chosen_korean: 결코 잡히지 않을 것입니다
  alternatives_korean:
  - 반드시 잡히지 않을 것입니다
  - 결코 붙잡히지 않을 것입니다
  - 결코 걸려들지 않을 것입니다
  lexicon: BDAG
  rationale: οὐ μή는 강한 부정을 나타내므로 ‘결코’로 처리했고, ἁλῷ는 문자적 ‘잡히다’와 비유적 ‘걸려들다’가 가능하지만 여기서는 더 넓고 자연스러운 ‘잡히다’를 택했습니다.
theological_decisions:
- issue: ‘입술의 훈계’의 의미 범위
  chosen_reading: 말과 발화 습관에 대한 훈계로 이해했습니다.
  alternative_readings:
  - 말에 관한 훈계
  - 입에 대한 훈련
  rationale: 문맥상 지혜문학의 말 윤리 경구로 읽히며, ‘입술’은 발화의 행위를 한국어로 선명하게 지시합니다.
  doctrine_reference: Sirach 23:7 지혜문맥
- issue: 결말의 강한 부정
  chosen_reading: ‘결코 잡히지 않을 것입니다’로 강한 확실성을 살렸습니다.
  alternative_readings:
  - 결코 붙잡히지 않을 것입니다
  - 반드시 붙잡히지 않을 것입니다
  rationale: οὐ μή의 emphatic negation을 약화시키지 않으면서, 경구의 경고성을 현대 한국어로 분명하게 전달합니다.
  doctrine_reference: '헬라어 부정법: οὐ μή + aorist subjunctive/optative'
