review_pass:
  verdict: revise
  source_fidelity: The draft correctly reflects the future passive public presentation (ἐξαχθήσεται), the communal setting of ἐκκλησία, and the deliberately noncommittal official examination/visitation sense of ἐπισκοπή. ‘회중 앞에’ is contextually defensible for εἰς ἐκκλησίαν, but ‘회중 앞으로’ more naturally conveys presentation before the gathered body. ‘끌려’ may imply coercion more strongly than the Greek itself requires.
  naturalness: The sentence is generally clear and in an appropriate formal-polite register. However, ‘그 여자는’ can sound unnecessarily blunt in this formal literary context, and ‘자기 자녀들에 대해서는’ is less direct and natural than ‘그녀의 자녀들에 대한’.
  terminology: ‘회중’ appropriately avoids an anachronistic institutional ‘교회,’ and ‘조사’ suitably renders the official-review sense without deciding that punishment is meant. The footnote’s literal-sounding ‘자녀들 위에 방문’ is unnatural Korean and may misleadingly suggest an ordinary social visit; it should express the alternative sense as a visitation that comes upon the children.
  issues:
  - severity: low
    issue: ‘그 여자는’ is stylistically blunt.
    rationale: For a referenced woman in formal biblical Korean, ‘그 여인은’ is more natural and dignified without weakening the contextual reference.
  - severity: low
    issue: ‘끌려 나오게 될’ may overstate compulsion.
    rationale: ἐξαχθήσεται is passive ‘will be brought/led out’ and need not explicitly imply forcible dragging. ‘이끌려 나올’ preserves passive public presentation more neutrally.
  - severity: low
    issue: The footnote’s ‘방문’ is potentially misleading.
    rationale: In contemporary Korean, ‘방문’ commonly denotes a social visit. The alternative meaning of ἐπισκοπή should be framed as ‘방문하심/임함’ or an official punitive visitation.
  revised_text: 그 여인은 회중 앞으로 이끌려 나올 것이며, 그녀의 자녀들에 대한 조사가 있을 것입니다.[a]
  revised_footnotes:
  - marker: a
    text: 또는 ‘그녀의 자녀들에게 방문하심이 있을 것이다’로도 옮길 수 있으며, 이는 단순한 조사뿐 아니라 사법적 처벌을 위한 개입을 암시할 수도 있습니다.
    reason: alternative_reading
  revision_rationale: The revision retains the source’s future passive construction, public communal setting, and ambiguity of ἐπισκοπή, while improving formal Korean style and replacing an unnatural footnote rendering with one that communicates the possible judicial-punitive sense of ‘visitation.’
