  text: She will be brought out before the assembly[a], and there will be an inspection concerning her children.
  footnotes:
  - marker: a
    text: Or 'there will be a visitation upon her children,' possibly implying judicial punishment rather than only examination.
    reason: alternative_reading
translation:
  language: ko
  text: 그 여자는 회중 앞에 끌려 나오게 될 것이며, 자기 자녀들에 대해서는 조사가 있을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 자녀들 위에 방문이 있을 것이다’로도 옮길 수 있으며, 경우에 따라 사법적 처벌을 암시할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: αὕτη
  english_pob_choice: She
  chosen_korean: 그 여자는
  alternatives_korean:
  - 그 여자
  - 그 여인
  - 그 여자에게
  lexicon: LSJ
  rationale: 문맥상 앞서 언급된 간음한 여자를 가리키므로, 자연스러운 지시 표현으로 옮겼습니다.
- source_word: ἐκκλησίαν
  english_pob_choice: assembly
  chosen_korean: 회중
  alternatives_korean:
  - 모임
  - 집회
  - 교회
  lexicon: LSJ
  rationale: 시락에서의 ἐκκλησία는 후대의 제도적 ‘교회’가 아니라 공개적으로 모인 공동체를 가리키므로, ‘회중’이 가장 직접적입니다.
- source_word: ἐπισκοπὴ
  english_pob_choice: inspection
  chosen_korean: 조사
  alternatives_korean:
  - 점검
  - 심문
  - 방문
  lexicon: LSJ
  rationale: 이 단어는 ‘방문’이나 ‘감독’보다 여기서의 공식적·법정적 검토 성격을 드러내는 ‘조사’가 더 적절합니다.
- source_word: ἐπὶ τὰ τέκνα αὐτῆς
  english_pob_choice: concerning her children
  chosen_korean: 자기 자녀들에 대해서는
  alternatives_korean:
  - 자기 자녀들에게
  - 자기 자녀들 위에
  - 자기 자녀들을 향한
  lexicon: LSJ
  rationale: ἐπί의 방향성을 한국어에서 자연스럽게 풀어, 자녀들이 조사 대상이 됨을 드러냈습니다.
theological_decisions:
- issue: ἐπισκοπὴ의 강도
  chosen_reading: ‘조사’로 옮겨 본문이 말하는 공식적 검토를 유지하고, 징벌 의미는 본문 자체에서 단정하지 않습니다.
  alternative_readings:
  - 징계
  - 심판
  - 방문
  rationale: 그리스어는 여기서 반드시 처벌을 뜻한다고까지는 말하지 않으므로, 문맥의 긴장감을 보존했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy, preserve theological tension rather than resolve it
