  text: Her children will not take root[a], and her branches will not bear fruit;
  footnotes:
  - marker: a
    text: Or 'Her children will not take root.' The Greek literally says 'will not spread out into a root,' an idiomatic botanical image for failing to become established.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 여자의 자녀들은 뿌리를 내리지 못하고, 그 가지들은 열매를 맺지 못할 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 여자의 자녀들은 뿌리를 내리지 못할 것입니다.’ 그리스어는 문자적으로 ‘뿌리로 퍼져 들어가지 못할 것입니다’라고 말하며, 정착하지 못함을 나타내는 관용적 식물 이미지입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ τέκνα αὐτῆς
  english_pob_choice: Her children
  chosen_korean: 그 여자의 자녀들
  alternatives_korean:
  - 그 여자의 아이들
  - 그 여자의 후손들
  lexicon: LSJ
  rationale: τέκνα는 문맥상 자녀 또는 후손을 뜻하지만, 한국어에서는 ‘자녀들’이 가족적 비유를 가장 자연스럽고 분명하게 살립니다.
- source_word: οὐ διαδώσουσιν ... εἰς ῥίζαν
  english_pob_choice: will not take root
  chosen_korean: 뿌리를 내리지 못하고
  alternatives_korean:
  - 뿌리로 퍼져 가지 못하고
  - 뿌리로 뻗지 못하고
  lexicon: LSJ
  rationale: 직역하면 ‘뿌리 안으로 퍼지다’이지만, 한국어 관용에서는 식물이 정착하지 못한다는 뜻을 ‘뿌리를 내리지 못하다’로 가장 분명하게 전달할 수 있습니다.
- source_word: οἱ κλάδοι αὐτῆς
  english_pob_choice: her branches
  chosen_korean: 그 가지들은
  alternatives_korean:
  - 그 큰가지들은
  - 그 뻗은 가지들은
  lexicon: LSJ
  rationale: κλάδοι는 가지/새순의 일반적 표현이므로, 앞의 식물 은유를 유지하는 가장 सीधे한 대응으로 ‘가지들’을 택했습니다.
- source_word: οὐ δώσουσιν καρπόν
  english_pob_choice: will not bear fruit
  chosen_korean: 열매를 맺지 못할 것입니다
  alternatives_korean:
  - 열매를 주지 못할 것입니다
  - 열매를 생산하지 못할 것입니다
  lexicon: LSJ
  rationale: 카르포스의 농업적 비유는 한국어에서도 ‘열매를 맺다’가 가장 자연스럽고, 결과의 부정도 분명하게 드러냅니다.
theological_decisions:
- issue: 식물 은유를 도덕적 해설로 풀어 쓸지 여부
  chosen_reading: 본문의 심판적 뉘앙스는 유지하되, 자녀와 가지, 열매의 식물 은유 자체를 그대로 살려 문장 안에서만 의미가 드러나게 했습니다.
  alternative_readings:
  - ‘후손이 정착하지 못한다’처럼 결과를 설명하는 번역
  - ‘자손이 번성하지 못한다’처럼 의미를 해석해 확장하는 번역
  rationale: 그리스어 본문은 결과를 은유적으로 말하므로, 해설을 덧붙이기보다 이미지와 진술 자체를 보존하는 편이 원문에 더 가깝습니다.
  doctrine_reference: 번역 원칙 §§1, 3, 6
