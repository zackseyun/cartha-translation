  to: 그리하여 내 무지에서 비롯된 잘못들이 불어나지 않고[a], 내 죄들이 늘어나지 않으며, 내가 내 대적들 앞에 쓰러지지 않고, 내 원수가 나를 두고 기뻐하지 않게 하소서.[b]
