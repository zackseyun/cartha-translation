  text: so that my ignorances may not multiply[a], and my sins may not increase, and I may fall before my adversaries[b], and my enemy may rejoice over me.
  footnotes:
  - marker: a
    text: Or 'my errors' or 'my acts of ignorance.' The Greek distinguishes these from 'my sins' in the next clause.
    reason: lexical_alternative
  - marker: b
    text: '''May rejoice over me'' can also be rendered ''may gloat over me,'' highlighting the enemy''s malicious triumph.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그래서 내 무지들이 불어나지 않고, 내 죄들이 더 늘어나지 않으며, 내가 내 대적들 앞에 쓰러지지 않고, 내 원수가 나를 두고 기뻐하지 않게 하소서.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘무지들’은 ‘오류들’ 또는 ‘알지 못한 일들’로도 옮길 수 있으나, 여기서는 뒤의 ‘죄들’과의 구별을 살리기 위해 직역에 가깝게 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘나를 두고 기뻐하지 않게 하소서’는 악의적 승리감을 드러내는 말로, ‘나를 두고 비웃지 않게 하소서’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: αἱ ἄγνοιαι μου
  english_pob_choice: my ignorances
  chosen_korean: 내 무지들
  alternatives_korean:
  - 내 오류들
  - 내 알지 못한 일들
  lexicon: LSJ
  rationale: ἄγνοια는 ‘무지, 알지 못함’의 복수형으로, 뒤의 ‘죄들’과 구별되는 대목이므로 한국어에서도 복수성을 살린 ‘무지들’로 옮겼습니다.
- source_word: μὴ πληθύνωσιν / πλεονάσωσιν
  english_pob_choice: may not multiply / may not increase
  chosen_korean: 불어나지 않고 / 더 늘어나지 않으며
  alternatives_korean:
  - 증가하지 않고 / 증대하지 않으며
  - 많아지지 않고 / 더욱 많아지며
  lexicon: LSJ
  rationale: 두 동사는 모두 ‘많아지다, 증가하다’의 뜻이므로 한국어에서도 반복을 살려 첫째는 ‘불어나지 않고’, 둘째는 ‘더 늘어나지 않으며’로 구분해 자연스럽게 표현했습니다.
- source_word: ἔναντι τῶν ὑπεναντίων
  english_pob_choice: before my adversaries
  chosen_korean: 내 대적들 앞에
  alternatives_korean:
  - 내 विरोध자들 앞에서
  - 내 맞서는 자들 앞에
  lexicon: LSJ
  rationale: ἔναντι는 ‘~앞에/면전에서’의 뜻이고, ὑπεναντίων은 ‘대적자들, 반대하는 자들’이므로 간결하게 ‘내 대적들 앞에’로 옮겼습니다.
- source_word: ἐπιχαρεῖταί μοι ὁ ἐχθρός μου
  english_pob_choice: my enemy may rejoice over me
  chosen_korean: 내 원수가 나를 두고 기뻐하지 않게 하소서
  alternatives_korean:
  - 내 원수가 나를 보고 기뻐하지 않게 하소서
  - 내 원수가 나를 두고 환호하지 않게 하소서
  lexicon: LSJ
  rationale: ἐπιχαρεῖσθαι는 ‘~를 두고 기뻐하다’로, 문맥상 악의적 승리를 암시하므로 본문은 직역을 유지하되 한국어 관용에 맞게 ‘나를 두고 기뻐하지 않게 하소서’로 처리했습니다.
theological_decisions:
- issue: ἄγνοιαι와 ἁμαρτίαι의 구별 유지
  chosen_reading: ‘무지들’과 ‘죄들’을 분리해, 무지에서 비롯된 잘못과 일반적 죄를 구별했습니다.
  alternative_readings:
  - 둘 다 ‘죄’로 일반화하는 번역
  - ‘무지로 인한 죄들’로 해석을 확정하는 번역
  rationale: 본문은 두 범주를 나란히 놓아 구별하고 있으므로, 한국어에서도 그 긴장을 지우지 않는 것이 가장 충실합니다.
  doctrine_reference: Translation philosophy §3, §5
- issue: ἐπιχαρεῖταί μοι의 악의적 뉘앙스
  chosen_reading: 주본문에서는 ‘기뻐하지 않게 하소서’로 두고, 악의적 승리의 뉘앙스는 ‘원수’와 문맥이 드러내게 했습니다.
  alternative_readings:
  - ‘나를 두고 기뻐하소서/기뻐하다’로 강하게 번역
  - ‘나를 두고 비웃지 않게 하소서’로 해석 강화
  rationale: 동사는 본래 ‘기뻐하다’이므로 본문은 과도하게 해석하지 않고, 적대적 문맥이 의미를 충분히 보완하도록 했습니다.
  doctrine_reference: Translation philosophy §1, §6
