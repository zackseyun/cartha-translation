base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/023/017.yaml
  text: To a promiscuous man every bread is sweet[b][a]; he will not stop until he comes to his end.
  footnotes:
  - marker: a
    text: Or, 'every kind of bread is sweet.' The image likely suggests indiscriminate appetite rather than bread alone.
    reason: lexical_alternative
  - marker: b
    text: Or, 'until he dies.' The Greek can refer specifically to death, though 'comes to his end' also preserves the broader sense of final ruin.
    reason: alternative_reading
translation:
  language: ko
  text: 음행하는 남자에게는 모든 빵[a]이 달콤합니다. 그는 끝에 이르기까지[b] 그치지 않을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘모든 종류의 빵.’ 이 이미지는 빵 자체보다 무분별한 욕망을 가리키는 것으로 보입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는, ‘죽을 때까지.’ 그리스어는 구체적으로 죽음을 가리킬 수도 있지만, ‘끝에 이르기까지’는 더 넓은 최종적 끝의 의미를 보존합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἄνθρωπῳ πόρνῳ
  english_pob_choice: a promiscuous man
  chosen_korean: 음행하는 사람
  alternatives_korean:
  - 난잡한 사람
  - 성적으로 문란한 사람
  - 음란한 사람
  lexicon: BDAG
  rationale: πόρνῳ는 단순히 매춘만이 아니라 성적 문란 전체를 가리키므로, 한국어에서는 의미를 좁히지 않으면서도 문맥의 도덕적 평가를 드러내는 ‘음행하는 사람’이 적절합니다.
- source_word: πᾶς ἄρτος
  english_pob_choice: every bread
  chosen_korean: 모든 빵
  alternatives_korean:
  - 모든 떡
  - 모든 음식
  - 모든 종류의 빵
  lexicon: LSJ
  rationale: 그리스어의 빵 이미지를 그대로 살려, 비유를 평이하게 풀어버리지 않고 ‘모든 빵’으로 직역에 가깝게 옮겼습니다.
- source_word: ἡδύς
  english_pob_choice: sweet
  chosen_korean: 달콤합니다
  alternatives_korean:
  - 맛있습니다
  - 즐겁습니다
  - 달게 느껴집니다
  lexicon: BDAG
  rationale: ἡδύς의 감각적 이미지를 살려 ‘달콤합니다’로 옮기면, 부정한 욕망을 미각의 비유로 표현한 아이러니가 유지됩니다.
- source_word: οὐ μὴ κοπάσῃ
  english_pob_choice: he will not stop
  chosen_korean: 멈추지 않을 것입니다
  alternatives_korean:
  - 그는 그치지 않을 것입니다
  - 그는 쉬지 않을 것입니다
  - 그는 그만두지 않을 것입니다
  lexicon: BDAG
  rationale: οὐ μή + 접속법의 강한 부정을 한국어의 미래 부정으로 자연스럽게 옮겨, 지속적이고 단호한 부정의 힘을 유지했습니다.
- source_word: ἕως ἂν τελευτήσῃ
  english_pob_choice: until he comes to his end
  chosen_korean: 끝에 이르기까지
  alternatives_korean:
  - 죽을 때까지
  - 종말에 이를 때까지
  - 마침내 끝날 때까지
  lexicon: BDAG
  rationale: τελευτήσῃ는 죽음을 포함할 수 있지만 더 넓게 ‘끝/종말’의 뉘앙스를 갖기 때문에, POB의 폭넓은 읽기를 따라 ‘끝에 이르기까지’로 옮겼습니다.
theological_decisions:
- issue: βο울(빵) 이미지를 성적 대상이나 일반 음식으로 명시적으로 풀지 여부
  chosen_reading: 주어진 비유 이미지를 보존한 채, 본문에는 ‘모든 빵’으로 남겼습니다.
  alternative_readings:
  - ‘모든 종류의 음식’
  - ‘모든 여자가 달콤하다’
  rationale: 원문은 빵 이미지를 사용하며, 성적 대상은 문맥상 추론되더라도 본문이 직접 말하지는 않습니다. 따라서 의미를 과잉해석하지 않고 비유를 보존하는 편이 원문 충실도에 맞습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
- issue: τελευτήσῃ를 ‘죽다’로 좁힐지, 더 넓은 ‘끝/종말’로 둘지
  chosen_reading: ‘끝에 이르기까지’로 넓게 옮겼습니다.
  alternative_readings:
  - ‘죽을 때까지’
  - ‘파멸할 때까지’
  rationale: 지혜문학의 경고는 문자적 죽음과 도덕적 파멸을 함께 열어 두는 편이 더 자연스럽습니다. 따라서 의미를 한쪽으로만 고정하지 않았습니다.
  doctrine_reference: Translation philosophy §3
