base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/023/010.yaml
  text: For just as a slave being constantly examined will not be spared bruises[a], so also one who swears and names the Name continually will never be cleansed from sin.
  footnotes:
  - marker: a
    text: Or 'and invoking the name continually.' The Greek likely refers to repeated use of the divine name in oath-taking or irreverent speech.
    reason: lexical_alternative
translation:
  language: ko
  text: 끊임없이 조사받는 종이 멍을 면하지 못하듯, 맹세하고 그 이름을 끊임없이 부르는 사람도 죄에서 결코 깨끗해지지 못합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘끊임없이 맹세하고 이름을 부르는 사람’으로 옮길 수 있습니다. 이 그리스어는 맹세할 때 하나님의 이름을 반복해 부르거나 그 이름을 무례하게 사용하는 행위를 가리킬 가능성이 큽니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰκέτης
  english_pob_choice: slave
  chosen_korean: 종
  alternatives_korean:
  - 노예
  - 하인
  lexicon: BDAG
  rationale: 가정 소속을 뜻할 수 있어도, 문맥상 계속되는 감시와 징벌 아래 있는 종속 상태를 강조하므로 한국어는 '종'으로 옮겨 지나친 완곡화를 피했습니다.
- source_word: ἐξεταζόμενος ἐνδελεχῶς
  english_pob_choice: under constant examination
  chosen_korean: 계속해서 살피면
  alternatives_korean:
  - 끊임없이 조사하면
  - 지속적으로 점검받으면
  lexicon: BDAG
  rationale: 반복적·지속적 감시의 뉘앙스를 살려, 매질과 연결되는 처지의 지속성을 자연스럽게 드러냈습니다.
- source_word: ἀπὸ μώλωπος οὐκ ἐλαττωθήσεται
  english_pob_choice: will not be spared bruises
  chosen_korean: 매질을 면하지 못합니다
  alternatives_korean:
  - 멍이 줄어들지 않습니다
  - 타박상을 피하지 못합니다
  lexicon: LSJ
  rationale: μώλωψ는 멍/혹은 매질로 생긴 상처를 가리키므로, 결과를 한국어 관용에 맞게 '매질을 면하지 못합니다'로 풀어 문맥의 징벌성을 살렸습니다.
- source_word: ὁ ὀμνύων καὶ ὀνομάζων διὰ παντός
  english_pob_choice: one who swears and names the Name continually
  chosen_korean: 맹세하고 그 이름을 계속 부르는 사람
  alternatives_korean:
  - 늘 맹세하며 이름을 부르는 사람
  - 맹세하고 이름을 계속 사용하는 사람
  lexicon: BDAG
  rationale: ὀνομάζω는 이 문맥에서 신적 이름을 입에 올리는 행위를 가리키므로, 영어 POB의 의도를 따라 '그 이름을 계속 부르는'으로 옮겨 암시적 신성모독/맹세의 뉘앙스를 유지했습니다.
- source_word: ἀπὸ ἁμαρτίας οὐ μὴ καθαρισθῇ
  english_pob_choice: will never be cleansed from sin
  chosen_korean: 죄에서 결코 깨끗하게 되지 못합니다
  alternatives_korean:
  - 죄에서 결코 정결하게 되지 못합니다
  - 죄에서 절대로 씻기지 못합니다
  lexicon: BDAG
  rationale: καθαρίζω의 도덕·종교적 정결 의미를 살리되, 한국어에서는 '깨끗하게 되다'가 가장 자연스럽고 본문의 종교적 오염을 충분히 전달합니다.
theological_decisions:
- issue: ‘그 이름’의 대상과 맹세 행위의 함의
  chosen_reading: 하나님의 이름을 함부로 거론하거나 맹세에 끌어다 쓰는 행위를 암시하는 것으로 보되, 본문에 없는 '하나님'을 본문에 직접 삽입하지는 않았습니다.
  alternative_readings:
  - 일반적인 이름 부르기
  - 단순한 욕설적 발화
  rationale: 문맥이 맹세와 연결되어 있어 신적 이름을 가리키는 것으로 읽는 것이 가장 자연스럽지만, 원문의 여백을 보존하기 위해 해석을 과도하게 확정하지 않았습니다.
  doctrine_reference: '원문 우선 원칙: 해석 가능성은 주석과 어휘 결정을 통해 설명하되, 본문은 원문의 긴장을 유지해야 합니다.'
