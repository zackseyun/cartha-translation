  text: For just as a slave being constantly examined will not be spared bruises[a], so also one who swears and names the Name continually will never be cleansed from sin.
  footnotes:
  - marker: a
    text: Or 'and invoking the name continually.' The Greek likely refers to repeated use of the divine name in oath-taking or irreverent speech.
    reason: lexical_alternative
translation:
  language: ko
  text: 사람이 종을 계속해서 살피면 매질을 면하지 못하듯, 맹세하고 그 이름을 계속 부르는 사람도 죄에서 결코 깨끗하게 되지 못합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘계속해서 이름을 부르며(혹은 이름을 부르짖으며)’로 옮길 수 있습니다. 이 그리스어는 맹세할 때 하나님의 이름을 반복해 부르거나, 무례하게 사용하는 행위를 가리킬 가능성이 큽니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰκέτης
  english_pob_choice: slave
  chosen_korean: 종
  alternatives_korean:
