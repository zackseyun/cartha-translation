  - 하인
  lexicon: BDAG
  rationale: 가정 소속을 뜻할 수 있어도, 문맥상 계속되는 감시와 징벌 아래 있는 종속 상태를 강조하므로 한국어는 '종'으로 옮겨 지나친 완곡화를 피했습니다.
- source_word: ἐξεταζόμενος ἐνδελεχῶς
  english_pob_choice: under constant examination
  chosen_korean: 계속해서 살피면
  alternatives_korean:
