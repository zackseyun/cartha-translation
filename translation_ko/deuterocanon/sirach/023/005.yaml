lexical_decisions:
- source_word: ἐπιθυμίαν
  english_pob_choice: desire
  chosen_korean: 욕망
  alternatives_korean:
  - 욕구
  - 갈망
  - 정욕
  lexicon: BDAG
  rationale: 이 단어는 문맥상 윤리적으로 부정적인 강한 내적 욕구를 가리킬 수 있으므로, 중립적인 ‘욕구’보다 경고성과 내적 충동의 힘을 드러내는 ‘욕망’을 택했습니다. 다만 영어 POB의 ‘desire’처럼 성적 의미로 과도하게 좁히지는 않았습니다.
- source_word: ἀπόστρεψον
  english_pob_choice: turn away
  chosen_korean: 돌려 주십시오
  alternatives_korean:
  - 돌이켜 주십시오
  - 물러가게 해 주십시오
  - 돌려보내 주십시오
  lexicon: LSJ
  rationale: 명령형이 하나님의 능동적 개입을 구하므로, 대상이 화자에게서 떨어져 나가게 하는 동작을 자연스럽게 나타내는 ‘돌려 주십시오’를 선택했습니다.
- source_word: ἀπʼ ἐμοῦ
  english_pob_choice: from me
  chosen_korean: 제게서
  alternatives_korean:
  - 제게서부터
  - 저에게서
  - 내게서
  lexicon: BDAG
  rationale: 전치사구가 화자로부터의 분리를 나타내므로, 한국어에서는 조사 ‘-에서’를 써서 ‘제게서’로 옮겨 분리의 방향을 간결하게 살렸습니다.
- source_word: καὶ
  english_pob_choice: and
  chosen_korean: 그리고
  alternatives_korean:
  - 또
  - 또한
  - 그리고는
  lexicon: BDAG
  rationale: 이 절은 앞선 기도의 연속이므로, 문맥을 잇는 기본 접속사 ‘그리고’가 가장 자연스럽습니다.
theological_decisions:
- issue: ἐπιθυμία의 도덕적 강도
  chosen_reading: ‘욕망’으로 넓게 옮겨, 문맥이 주는 부정적 뉘앙스를 살리되 성적 욕망으로 한정하지 않았습니다.
  alternative_readings:
  - 정욕
  - 갈망
  rationale: 원어는 폭넓은 강한 욕구를 뜻할 수 있어, 본문 자체가 말하는 내적 욕망의 제거를 드러내면서도 의미 범위를 과도하게 좁히지 않는 번역이 적절합니다.
  doctrine_reference: '원어 우선 원칙: 문맥이 요구하지 않는 한 어휘 범위를 협소화하지 않습니다.'
