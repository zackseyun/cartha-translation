translation:
  language: ko
  text: 그의 입술 때문에 죄인은 붙잡힐[a] 것이며, 남을 모욕하는 자와 교만한 자는 그 입술 때문에 넘어질 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 입술 안에 죄인이 남겨질 것입니다.’ 그리스어 동사는 더 문자적으로 ‘남겨지다’ 또는 ‘버려지다’를 뜻할 수 있지만, 문맥에서는 자기 말 때문에 붙잡히거나 무너지는 뜻일 가능성이 큽니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τοῖς χείλεσιν αὐτοῦ
  english_pob_choice: By his lips
  chosen_korean: 그의 입술로
  alternatives_korean:
  - 그의 입술 안에
  - 그의 입술로써
  - 그의 입으로
  lexicon: BDAG
  rationale: ἐν의 도구적 뉘앙스를 살려 원인의 수단을 나타내는 ‘-로’로 옮겼고, ‘입술’을 유지해 말의 구체적 이미지를 보존했습니다.
- source_word: καταλειφθήσεται
  english_pob_choice: will be caught
  chosen_korean: 붙들리고
  alternatives_korean:
  - 남겨지고
  - 버려지고
  - 덫에 걸리고
  lexicon: LSJ
  rationale: 직역하면 ‘남겨지다’이지만, 문맥상 자기 말에 의해 허망하게 잡히거나 무너지는 뜻이므로 한국어에서는 결과를 드러내는 ‘붙들리다’가 가장 자연스럽습니다.
- source_word: λοίδορος καὶ ὑπερήφανος
  english_pob_choice: the reviler and the proud
  chosen_korean: 비방하는 자와 교만한 자
  alternatives_korean:
  - 모욕하는 자와 교만한 자
  - 비난하는 자와 거만한 자
  - 욕하는 자와 오만한 자
  lexicon: BDAG
  rationale: λοίδορος는 단순한 말다툼이 아니라 험담·모욕을 일삼는 사람을 가리키므로 ‘비방하는 자’로, ὑπερήφανος는 품성의 교만함을 살려 ‘교만한 자’로 옮겼습니다.
- source_word: σκανδαλισθήσονται ἐν αὐτοῖς
  english_pob_choice: will stumble by them
  chosen_korean: 그것들 때문에 넘어집니다
  alternatives_korean:
  - 그것들로 인해 실족합니다
  - 그것들에 걸려 넘어집니다
  - 그것들로 넘어집니다
  lexicon: BDAG
  rationale: 말들(입술/혀의 발화)로 인한 넘어짐이라는 비유를 유지하되, 한국어에서는 원인-결과를 분명히 하는 ‘때문에 넘어집니다’가 독자에게 가장 분명합니다.
theological_decisions:
- issue: 지혜문학의 ‘넘어짐’ 표현을 신학적 실족 개념으로 과잉 해석할지 여부
  chosen_reading: 도덕적·지혜문학적 붕괴를 가리키는 일반적 ‘넘어짐’으로 유지했습니다.
  alternative_readings:
  - 영적 실족으로 해석하기
  - 구원 상실의 교리적 진술로 읽기
  rationale: 본문은 말의 죄가 낳는 자기파괴적 결과를 경고하는 지혜 격언이므로, 후대의 기술적 신학 용례를 덧씌우지 않고 비유적 붕괴로 유지하는 것이 원문 의도에 더 가깝습니다.
  doctrine_reference: 잠언적 경고 / 지혜문학의 도덕적 인과
- issue: καταλειφθήσεται의 직역 가능성과 문맥상 해석 사이의 긴장
  chosen_reading: ‘붙들리고’로 옮겨 직역의 여운보다 문맥상의 의미를 우선했습니다.
  alternative_readings:
  - ‘남겨집니다’로 더 직역하기
  - ‘버려집니다’로 옮기기
  rationale: 영어 POB도 ‘left behind/abandoned’의 문자적 의미를 각주로 남기고 본문은 ‘caught’를 택했듯, 한국어도 본문에서는 문맥적 의미를 살리고 문자적 가능성은 각주로 보완하는 편이 균형적입니다.
  doctrine_reference: 사전적 의미와 문맥적 의미의 긴장
