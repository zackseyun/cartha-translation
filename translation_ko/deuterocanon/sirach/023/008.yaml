  source_fidelity: 개정이 필요합니다. καταλειφθήσεται의 문맥적 ‘붙잡히다/덫에 걸리다’ 해석과 각주의 문자적 대안은 유지할 수 있습니다. 다만 δεύτε clause의 αὐτοῖς는 앞의 ‘입술’을 가리키므로 한국어 대명사 ‘그것들’보다 그 지시 대상을 밝혀야 합니다. λοίδορος도 단순한 ‘비방하는 자’보다 모욕적·악의적인 말을 하는 사람이라는 뜻을 드러내는 편이 정확합니다.
  naturalness: ‘그것들 때문에’는 한국어 성경 문체에서 지시 대상이 불분명하고 어색합니다. ‘그 입술 때문에’로 명시하고, 두 미래 동사를 ‘-것이며/-것입니다’로 맞추면 현대 표준어 합쇼체로 더 자연스럽습니다.
  terminology: ‘죄인’, ‘교만한 자’, ‘넘어질 것입니다’는 적절합니다. λοίδορος는 ‘남을 모욕하는 자’가 ‘비방하는 자’보다 원문의 욕설·모욕 행위의 초점을 더 잘 보존합니다.
