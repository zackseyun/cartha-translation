  text: By his lips the sinner will be caught[a], and the reviler and the proud will stumble by them.
  footnotes:
  - marker: a
    text: Or 'In his lips the sinner will be left behind'; the Greek verb can more literally mean 'will be left' or 'will be abandoned,' but in context it likely means being trapped or undone by one's own speech.
