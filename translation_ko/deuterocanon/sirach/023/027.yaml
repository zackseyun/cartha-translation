  text: And those who are left behind will know that nothing is better than the fear of the Lord, and nothing is sweeter than paying attention to the commandments of the Lord.
  footnotes:
  - marker: a
    text: Or 'the survivors' or 'those left.' The Greek literally says 'those who have been left.'
    reason: lexical_alternative
  - marker: b
    text: Or 'than heeding the commandments of the Lord.' The Greek verb suggests attentive, responsive regard.
    reason: lexical_alternative
translation:
  language: ko
  text: 남겨진 이들[a]은 야훼를 경외하는 것보다 더 나은 것이 없고, 야훼의 계명들에 주의를 기울이는 것[b]보다 더 달콤한 것이 없음을 알게 될 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘남아 있는 이들’ 또는 ‘남은 이들’. 그리스어는 문자적으로 ‘남겨진 이들’이라고 말합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘야훼의 계명들을 귀 기울여 따르는 것’. προσέχω는 주의를 기울이는 것뿐 아니라 주의 깊게 듣고 그에 응답하는 태도를 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ καταλειφθέντες
  english_pob_choice: those who are left behind
  chosen_korean: 뒤에 남은 자들
  alternatives_korean:
  - 남겨진 자들
  - 생존자들
  - 남은 자들
  lexicon: LSJ
  rationale: 수동 분사의 ‘남겨짐’ 의미를 살리되, 한국어에서 자연스럽고 간결한 표현으로 옮겼습니다. ‘생존자들’은 구체적 해석을 더하고, ‘남은 자들’은 남겨진 상태를 덜 분명하게 만듭니다.
- source_word: φόβου Κυρίου
  english_pob_choice: the fear of the Lord
  chosen_korean: 야훼를 두려워하는 것
  alternatives_korean:
  - 야훼를 경외하는 것
  - 주님을 두려워하는 것
  lexicon: LSJ
  rationale: 지혜문학의 관용구를 고려하되, 본문이 말하는 ‘두려움’의 직접성을 살리기 위해 직역에 가깝게 옮겼습니다. ‘경외’는 의미를 다소 완화할 수 있습니다.
- source_word: οὐδὲν κρεῖττον
  english_pob_choice: nothing is better
  chosen_korean: 더 나은 것이 없고
  alternatives_korean:
  - 더 좋은 것이 없고
  - 더 뛰어난 것이 없고
  lexicon: BDAG
  rationale: 절대적 비교 표현을 한국어에서 자연스럽게 살리기 위해 평서형 비교를 사용했습니다. 문맥상 지혜 격언의 단정성을 유지합니다.
- source_word: τοῦ προσέχειν
  english_pob_choice: paying attention to / heeding
  chosen_korean: 주의를 기울이는 것
  alternatives_korean:
  - 귀를 기울이는 것
  - 명심하는 것
  - 새겨듣는 것
  lexicon: BDAG
  rationale: προσέχω의 ‘주의를 돌리다, 주의를 기울이다’라는 수동적 관심이 아니라 의식적 응답을 담는 의미를 반영했습니다. ‘새겨듣다’는 청각 비유가 강하고, ‘명심하다’는 결과를 강조합니다.
- source_word: ἐντολαῖς Κυρίου
  english_pob_choice: the commandments of the Lord
  chosen_korean: 야훼의 계명들
  alternatives_korean:
  - 주님의 계명들
  - 야훼의 명령들
  lexicon: BDAG
  rationale: ἐντολή의 기본 의미를 ‘계명’으로 옮겨 성경적 어휘를 유지했습니다. 복수형을 살려 지혜 교훈의 다중성을 반영했습니다.
theological_decisions:
- issue: κύριος의 한국어 처리
  chosen_reading: 본문의 Κυρίου를 ‘야훼’로 옮겼습니다.
  alternative_readings:
  - 주님
  - 주
  rationale: 헬라어 본문이 야훼를 가리키는 지혜문학 문맥이므로, 프로젝트 기본 원칙에 따라 신명칭을 직접 반영했습니다.
  doctrine_reference: 'DOCTRINE.md: κύριος가 구약 야훼를 가리킬 때 ‘야훼’ 사용'
- issue: ‘야훼를 두려워하는 것’의 의미
  chosen_reading: 전통적 표현을 ‘경외’로 완화하지 않고 ‘두려워하는 것’으로 유지했습니다.
  alternative_readings:
  - 야훼를 경외하는 것
  - 야훼를 경외함
  rationale: 지혜문학의 핵심 구절이지만, 본문 자체의 강한 정서적·윤리적 긴장을 흐리지 않기 위해 직접적인 표현을 유지했습니다.
  doctrine_reference: 지혜문학의 ‘여호와/야훼를 경외함’ 표현 유지 원칙
