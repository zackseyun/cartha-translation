  source_fidelity: 그리스어의 미래형 ἐπιγνώσονται, 비교 표현 οὐδὲν κρεῖττον/γλυκύτερον, 그리고 두 부정 병렬 구조는 충실히 반영되어 있습니다. 다만 οἱ καταλειφθέντες는 수동분사이므로 ‘뒤에 남은 자들’보다 ‘남겨진 이들’이 원문의 남겨짐을 더 정확히 드러냅니다.
  naturalness: ‘뒤에 남은 자들’은 시간적·공간적으로 뒤에 남았다는 뜻으로도 읽혀 자연스럽지 않습니다. ‘남겨진 이들’이 현대 표준 한국어에서 더 자연스럽고 문맥을 과도하게 특정하지 않습니다. 지혜문학의 관용적 표현에서는 ‘야훼를 경외하는 것’이 ‘야훼를 두려워하는 것’보다 자연스러우면서도 φόβος의 경외와 순종의 의미를 보존합니다.
