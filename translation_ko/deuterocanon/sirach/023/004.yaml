lexical_decisions:
- source_word: Κύριε
  english_pob_choice: Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주인
  - 주여
  lexicon: LSJ
  rationale: 기도문에서의 직접 호격으로, POB의 Lord를 표준적인 신앙 언어인 ‘주님’으로 옮기되 문어적 품위를 유지했습니다.
- source_word: πάτερ
  english_pob_choice: Father
  chosen_korean: 아버지
  alternatives_korean:
  - 아빠
  - 아버님
  lexicon: LSJ
  rationale: 하나님께 드리는 직접 호칭이므로 기본어 ‘아버지’를 택했고, 합쇼체 흐름에 맞게 조사와 결합해 자연스럽게 처리했습니다.
- source_word: θεὲ ζωῆς μου
  english_pob_choice: God of my life
  chosen_korean: 제 생명의 하나님
  alternatives_korean:
  - 저의 삶의 하나님
  - 제 삶을 주시는 하나님
  lexicon: LSJ
  rationale: 속격구를 비교적 직역해 ‘생명의 하나님’으로 두어, 하나님이 생명의 근원이시라는 밀도를 살렸습니다.
- source_word: μετεωρισμὸν ὀφθαλμῶν
  english_pob_choice: haughty eyes
  chosen_korean: 거만한 눈
  alternatives_korean:
  - 오만한 눈
  - 높은 눈
  - 눈의 들뜸
  lexicon: LSJ
  rationale: 본문의 이미지는 문자적 눈의 움직임보다 눈에 드러난 교만한 태도를 가리키므로, POB의 해석을 따라 ‘거만한 눈’으로 옮겼습니다.
- source_word: μὴ δῷς μοι
  english_pob_choice: do not give me
  chosen_korean: 제게 주지 마소서
  alternatives_korean:
  - 저에게 허락하지 마소서
  - 제게 허락하지 마십시오
  lexicon: LSJ
  rationale: 부정 기원문으로서 직설적인 ‘주지 마소서’가 가장 간결하고 원문의 청원형을 잘 보존합니다.
theological_decisions:
- issue: 호격 기도문의 한국어 높임말 처리
  chosen_reading: 하나님께 직접 드리는 청원으로서 ‘주님… 아버지… 하나님이시여’의 합쇼체를 사용했습니다.
  alternative_readings:
  - ‘주여… 아버지… 하나님이시여’
  - ‘주님… 아버지… 제 생명의 하나님’
  rationale: 원문의 세 겹 호칭을 살리면서 한국어 기도체의 자연스러운 존대를 유지해야 하므로, 직접 호칭은 높임말로 처리하고 청원 동사는 ‘-소서’형을 사용했습니다.
  doctrine_reference: 기도 언어의 경어 체계
- issue: ‘μετεωρισμὸν ὀφθαλμῶν’의 의미
  chosen_reading: 교만하게 치켜든 눈이라는 윤리적 의미로 이해했습니다.
  alternative_readings:
  - 눈의 들뜸
  - 눈의 불안정함
  - 시선의 방황
  rationale: 지혜문맥에서 이 표현은 외적 시선의 물리적 움직임보다 교만의 표지로 읽는 것이 더 자연스럽고, POB의 ‘haughty eyes’와도 맞습니다.
  doctrine_reference: 잠언적 윤리 이미지
