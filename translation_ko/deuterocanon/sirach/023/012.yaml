base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/023/012.yaml
  text: There is a word wrapped in death; may it not be found in the inheritance of Jacob. For all these things will depart from the godly, and they will not wallow in sins.
  footnotes:
  - marker: a
    text: Or 'clothed with death' or 'surrounded by death.' The Greek image is of a kind of speech enveloped in death.
    reason: lexical_alternative
translation:
  language: ko
  text: 죽음에 싸인 말이 있습니다. 야곱의 유업 가운데서 그런 말이 발견되지 않기를 바랍니다. 이런 것들은 모두 경건한 사람에게서 떠나고, 그들은 죄들 속에 뒹굴지 않을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘죽음에 싸인’은 본문의 이미지를 옮긴 것으로, 영어 POB의 ‘wrapped in death’에 해당합니다. ‘죽음으로 둘러싸인’, ‘죽음에 입은’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέξις
  english_pob_choice: word
  chosen_korean: 말
  alternatives_korean:
  - 말씀
  - 언어
  - 발언
  lexicon: LSJ
  rationale: 여기서는 단일한 발화 단위를 가리키므로, 문맥상 자연스러운 ‘말’이 가장 직접적입니다.
- source_word: ἀντιπεριβεβλημένη θανάτῳ
  english_pob_choice: wrapped in death
  chosen_korean: 죽음에 싸인
  alternatives_korean:
  - 죽음으로 둘러싸인
  - 죽음에 입은
  - 죽음으로 감싼
  lexicon: LSJ
  rationale: 죽음에 둘러싸인 비유를 살리면서도 한국어로는 ‘싸인’이 가장 간결하게 이미지와 문법을 전달합니다.
- source_word: ἐν κληρονομίᾳ Ἰακώβ
  english_pob_choice: in the inheritance of Jacob
  chosen_korean: 야곱의 유업 가운데서
  alternatives_korean:
  - 야곱의 유업 안에서
  - 야곱의 상속 가운데서
  - 야곱의 기업 가운데서
  lexicon: LSJ
  rationale: ‘κληρονομία’는 단순 재산보다 언약적 몫을 내포하므로, 교회 전통어인 ‘기업’도 가능하지만 더 직관적인 ‘유업’을 택했습니다.
- source_word: ἐγκυλισθήσονται
  english_pob_choice: will not wallow
  chosen_korean: 뒹굴지 않을 것입니다
  alternatives_korean:
  - 뒹굴어들지 않을 것입니다
  - 빠져들지 않을 것입니다
  - 파묻히지 않을 것입니다
  lexicon: LSJ
  rationale: 동사가 ‘구르다/뒹굴다’의 이미지를 지니므로, 죄에 적극적으로 몸을 굴리는 뉘앙스를 살려 ‘뒹굴다’로 옮겼습니다.
theological_decisions:
- issue: ‘야곱의 유업’의 범위
  chosen_reading: 야곱/이스라엘로 대표되는 언약 공동체를 가리키는 표현으로 유지합니다.
  alternative_readings:
  - 민족적 이스라엘만을 가리키는 것으로 축소
  - 의인 일반을 뜻하는 상징어로 확장
  rationale: 본문의 언약적 표현을 풀어쓰지 않고 유지하여, 적용 범위를 단정적으로 좁히지 않았습니다.
  doctrine_reference: 유대-지혜문학의 언약 언어를 보존
- issue: 권고/축원형 어조
  chosen_reading: ‘발견되지 않기를 바랍니다’로 축원형 뉘앙스를 살렸습니다.
  alternative_readings:
  - ‘발견되지 않게 하십시오’
  - ‘있어서는 안 됩니다’
  rationale: μὴ εὑρεθήτω의 금지·소망 혼합 어조를 현대 한국어에서 가장 자연스럽게 나타냅니다.
  doctrine_reference: 명령법의 기도적·권면적 기능 보존
