  - 언어
  - 발언
  lexicon: LSJ
  rationale: 여기서는 단일한 발화 단위를 가리키므로, 문맥상 자연스러운 ‘말’이 가장 직접적입니다.
- source_word: ἀντιπεριβεβλημένη θανάτῳ
  english_pob_choice: wrapped in death
  chosen_korean: 죽음에 싸인
  alternatives_korean:
