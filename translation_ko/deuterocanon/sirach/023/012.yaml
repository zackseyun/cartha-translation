review_pass:
  verdict: revise
  source_fidelity: 핵심 어휘와 문장 흐름은 대체로 그리스어에 충실합니다. 다만 εὐσεβῶν은 복수이므로 ‘경건한 이들’로 옮기는 편이 정확하며, ταῦτα πάντα의 주어와 뒤의 ‘그들’(경건한 이들)을 한국어에서 분명히 구별할 필요가 있습니다. ἐν ἁμαρτίαις의 복수는 한국어 관용상 ‘죄 가운데서’로 자연스럽게 처리하되, ‘뒹굴다’의 강한 비유는 유지했습니다.
  naturalness: ‘이런 것들은 모두 경건한 사람에게서 떠나고, 그들은’은 단수·복수의 호응과 지시 대상이 다소 불분명합니다. ‘이 모든 것은 경건한 이들에게서 떠나며, 그들은…’으로 하면 현대 표준 한국어의 문장 연결이 자연스럽고 원문의 대조 구조도 살아납니다. ‘죽음에 싸인’은 자연스럽고 비유를 보존합니다.
  terminology: ‘말’, ‘야곱의 유업’, ‘경건한 이들’, ‘죄 가운데서 뒹굴다’는 문맥과 합쇼체에 적절합니다. ‘유업’은 κληρονομία의 언약적·공동체적 함의를 과도하게 해석하지 않고 전달합니다.
  issues:
