    rationale: 각주 표지는 설명 대상인 ‘죽음에 싸인’ 바로 뒤에 놓여야 독자가 그 적용 범위를 오해하지 않습니다.
  - severity: low
    issue: ‘경건한 사람’은 εὐσεβῶν의 복수와 맞지 않고, 이어지는 ‘그들은’의 선행사가 다소 모호합니다.
    rationale: ‘경건한 이들’로 고치고 앞 절의 주어를 ‘이 모든 것’으로 명시하면 그리스어의 구문과 한국어의 호응을 함께 보존합니다.
