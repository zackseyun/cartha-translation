  yaml_path: translation/deuterocanon/sirach/023/012.yaml
  text: There is a word wrapped in death; may it not be found in the inheritance of Jacob. For all these things will depart from the godly, and they will not wallow in sins.
  footnotes:
  - marker: a
    text: Or 'clothed with death' or 'surrounded by death.' The Greek image is of a kind of speech enveloped in death.
    reason: lexical_alternative
translation:
  language: ko
  text: 죽음에 싸인[a] 말이 있습니다. 야곱의 유업 가운데서 그런 말이 발견되지 않기를 바랍니다. 이 모든 것은 경건한 이들에게서 떠나며, 그들은 죄 가운데서 뒹굴지 않을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘죽음에 싸인’은 죽음에 둘러싸이거나 죽음을 입은 듯한 말이라는 비유적 이미지를 옮긴 것입니다. ‘죽음으로 둘러싸인’ 또는 ‘죽음을 입은’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέξις
  english_pob_choice: word
  chosen_korean: 말
  alternatives_korean:
