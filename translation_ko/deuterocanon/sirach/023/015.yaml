  text: A man accustomed to words of reproach will never be disciplined all his days[a][b].
  footnotes:
  - marker: a
    text: Or 'insulting words' or 'words of abuse' for 'words of reproach.'
    reason: lexical_alternative
  - marker: b
    text: The Greek says literally 'will certainly not be disciplined,' using an emphatic negation.
    reason: lexical_alternative
translation:
  language: ko
  text: 비난의 말에 익숙해진 사람은 평생토록 결코 징계를 받지 않습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문의 ὀνειδισμοῦ는 ‘비난’ 외에도 ‘모욕’ 또는 ‘능욕’으로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: οὐ μὴ와 접속법의 결합은 원문에서 ‘결코 …하지 않을 것이다’라는 강한 부정을 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄνθρωπος
  english_pob_choice: A man
  chosen_korean: 사람은
  alternatives_korean:
  - 한 사람은
  - 인간은
  lexicon: LSJ
  rationale: 그리스어 ἄνθρωπος는 여기서 일반적인 인간을 가리키는 대표적 단수이므로, 한국어에서는 성별을 과도하게 드러내지 않는 ‘사람’으로 자연스럽게 옮겼습니다.
- source_word: συνεθιζόμενος
  english_pob_choice: who becomes accustomed
  chosen_korean: 익숙해진
  alternatives_korean:
  - 습관이 든
  - 길들여진
  - 익숙해지는
  lexicon: LSJ
  rationale: 반복을 통해 형성된 습관의 의미를 살리면서도 한국어 문장으로는 ‘익숙해진’이 가장 자연스럽고 간결합니다.
- source_word: λόγοις ὀνειδισμοῦ
  english_pob_choice: words of reproach
  chosen_korean: 꾸지람의 말
  alternatives_korean:
  - 모욕의 말
  - 비난의 말
  - 치욕의 말
  lexicon: LSJ
  rationale: λόγοις는 ‘말’, ὀνειδισμός는 ‘꾸지람/모욕/비난’의 뜻이므로, 문맥상 훈계적·비판적 뉘앙스를 살리는 ‘꾸지람의 말’로 옮겼습니다.
- source_word: οὐ μὴ παιδευθῇ
  english_pob_choice: will never be disciplined
  chosen_korean: 결코 징계를 받지 못합니다
  alternatives_korean:
  - 결코 교정받지 못합니다
  - 결코 훈련받지 못합니다
  - 반드시 징계를 받지 않습니다
  lexicon: LSJ
  rationale: οὐ μή의 강한 부정을 한국어에서 ‘결코’로 살렸고, παιδεύω는 지혜문맥에서 도덕적 교정의 의미가 강하므로 ‘징계를 받다’가 가장 적절합니다.
theological_decisions:
- issue: emphatic negation in οὐ μὴ
  chosen_reading: ‘결코 … 못합니다’로 강한 부정을 드러냈습니다.
  alternative_readings:
  - ‘절대로 …하지 않습니다’
  - ‘반드시 …하지 못합니다’
  rationale: 본문의 οὐ μή는 단순 부정이 아니라 강조된 확정 부정이므로, 한국어에서도 그 강도를 약화시키지 않도록 처리했습니다.
  doctrine_reference: 지혜문학의 인과적·훈계적 경고 표현
