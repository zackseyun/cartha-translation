  - 죄악을
  lexicon: LSJ
  rationale: 헬라어 복수는 의미상 여러 죄를 가리키지만, 한국어에서는 본문 흐름상 자연스러운 집합적 표현인 ‘죄를’로 처리했습니다.
- source_word: ὀργήν
