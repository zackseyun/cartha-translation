  - 불어나게 하고
  lexicon: LSJ
  rationale: 동사는 단순한 증가보다 ‘수나 정도가 늘어남’을 강하게 나타내므로, 죄가 더 많아지는 결과를 드러내는 표현으로 옮겼습니다.
- source_word: ἁμαρτίας
