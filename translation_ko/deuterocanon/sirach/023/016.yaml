lexical_decisions:
- source_word: Δύο εἴδη
  english_pob_choice: Two kinds
  chosen_korean: 두 가지
  alternatives_korean:
  - 두 종류
  - 두 부류
  - 두 가지 종류
  lexicon: LSJ
  rationale: εἴδη는 여기서 사물의 외형이 아니라 범주·종류를 가리키므로, 현대 한국어에서는 자연스러운 ‘두 가지’가 가장 간결하게 대응합니다.
- source_word: πληθύνουσιν
