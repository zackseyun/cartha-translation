base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/023/011.yaml
  text: A man who swears many oaths will be filled with lawlessness[a], and the whip will not depart from his house. If he stumbles, his sin is upon him; and if he disregards it, he has sinned doubly. And if he swore in vain, he will not be justified[d][c][b], for his house will be filled with afflictions.
  footnotes:
  - marker: a
    text: Or 'the scourge will not depart from his house.' The Greek μάστιξ can denote a literal whip or, figuratively, a scourge of punishment.
    reason: lexical_alternative
  - marker: b
    text: Or 'if he ignores it, he has sinned twice over.' The sense is that treating the offense lightly compounds the guilt.
    reason: lexical_alternative
  - marker: c
    text: Or 'if he swore falsely' / 'if he took an empty oath.' The Greek literally speaks of swearing 'through emptiness.'
    reason: lexical_alternative
  - marker: d
    text: The final term is difficult; it likely means imposed troubles or punitive afflictions coming upon the household.
    reason: textual_variant
translation:
  language: ko
  text: 맹세를 많이 하는 사람은 불법으로 가득 차게 되며, 그의 집에서 채찍은 떠나지 않을 것입니다. 그가 잘못하면 그의 죄가 그에게 있고, 그것을 무시하면 그는 두 배로 죄를 지은 것입니다. 그리고 헛되이 맹세하면 그는 의롭다 함을 받지 못할 것이니, 그의 집이 재앙으로 가득 차게 될 것이기 때문입니다.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 집에서 징벌은 떠나지 않을 것입니다.’ μάστιξ는 문자적인 채찍일 수도 있고, 비유적으로는 징벌을 뜻할 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그것을 무시하면 그는 두 배로 죄를 지은 것입니다.’ 이 뜻은 잘못을 가볍게 여기는 것이 죄책을 더한다는 것입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘헛되이 맹세하면’ / ‘빈 맹세를 하면’. 헬라어는 문자적으로 ‘헛됨을 통해 맹세하다’라고 말합니다.
    reason: lexical_alternative
  - marker: d
    text: 마지막 말은 어렵습니다. 아마도 집에 임하는 부과된 환난이나 징벌적 불행을 가리키는 것 같습니다.
    reason: textual_variant
lexical_decisions:
- source_word: πολύορκος
  english_pob_choice: who swears many oaths
  chosen_korean: 맹세를 많이 하는 사람
  alternatives_korean:
  - 많은 맹세를 하는 사람
  - 여러 번 맹세하는 사람
  - 맹세가 잦은 사람
  lexicon: LSJ
  rationale: 많은 맹세를 하는 습관적 인물을 뜻하므로, 형용사적 압축보다 한국어에서는 설명형 명사구가 자연스럽습니다.
- source_word: πλησθήσεται ἀνομίας
  english_pob_choice: will be filled with lawlessness
  chosen_korean: 불법으로 가득 차게 되며
  alternatives_korean:
  - 무법으로 가득 차게 되며
  - 악행으로 가득 차게 되며
  - 불의로 가득 차게 되며
  lexicon: LSJ
  rationale: ἀνομία의 핵심인 율법/질서의 위반을 살리기 위해 ‘불법’을 택했습니다.
- source_word: μάστιξ
  english_pob_choice: the whip
  chosen_korean: 채찍
  alternatives_korean:
  - 회초리
  - 징벌
  - 채찍질
  lexicon: LSJ
  rationale: 문자적 도구 이미지를 살리면서도 한국어에서 가장 직관적인 표현인 ‘채찍’이 적절합니다.
- source_word: πλημμελήσῃ
  english_pob_choice: he stumbles
  chosen_korean: 그가 잘못하면
  alternatives_korean:
  - 그가 실수하면
  - 그가 범하면
  - 그가 죄를 지으면
  lexicon: LSJ
  rationale: 이 동사는 의도하지 않은 과실과 도덕적 실패를 모두 포괄할 수 있어, 과도하게 법정화하지 않는 ‘잘못하면’이 무난합니다.
- source_word: ὑπερίδῃ
  english_pob_choice: he disregards it
  chosen_korean: 그것을 무시하면
  alternatives_korean:
  - 그것을 간과하면
  - 그것을 업신여기면
  - 그것을 간과하고도
  lexicon: LSJ
  rationale: 여기서는 잘못을 가볍게 여기는 태도를 가리키므로, 직접적이고 읽기 쉬운 ‘무시하면’이 적합합니다.
- source_word: οὐ δικαιωθήσεται
  english_pob_choice: he will not be justified
  chosen_korean: 의롭다 함을 받지 못할 것이니
  alternatives_korean:
  - 의롭다 하심을 받지 못할 것이니
  - 무죄 판결을 받지 못할 것이니
  - 정당하다 인정받지 못할 것이니
  lexicon: LSJ
  rationale: 지혜문맥이지만 법정적 판정을 유지해야 하므로, ‘의롭다 함을 받지 못하다’로 번역해 선언적·심판적 뉘앙스를 살렸습니다.
- source_word: ἐπαγωγῶν
  english_pob_choice: afflictions
  chosen_korean: 재앙
  alternatives_korean:
  - 환난
  - 고통
  - 재난
  lexicon: LSJ
  rationale: 가문에 임하는 징벌적 불행을 가리키므로, 너무 내면화된 ‘고통’보다 외부적 타격을 드러내는 ‘재앙’이 더 가깝습니다.
theological_decisions:
- issue: οὐ δικαιωθήσεται의 법정적 의미
  chosen_reading: 단순한 도덕평가가 아니라, 죄책에 대한 판정/무죄 선언의 부정으로 읽었습니다.
  alternative_readings:
  - 의롭게 되지 못할 것이다
  - 정당화되지 못할 것이다
  rationale: 문맥이 맹세의 죄와 그 결과를 다루므로, ‘의롭다 함을 받지 못할 것’이 원문의 심판적 성격을 가장 잘 보존합니다.
  doctrine_reference: 'DOCTRINE.md: source-level judicial language should be preserved without importing later dogmatic debates'
