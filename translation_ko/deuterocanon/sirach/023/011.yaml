  source_fidelity: 전반적으로 원문의 절 구조와 핵심 어휘를 충실히 옮겼습니다. 다만 πλημμελήσῃ는 단순히 ‘잘못하면’보다 ‘잘못을 저지르면’이 더 분명하며, ὑπερίδῃ의 목적어는 앞의 잘못을 가리키도록 밝혀 주는 편이 원문의 논리 전개를 보존합니다. ἥμαρτεν δισσῶς는 ‘두 배로 죄를 지은 것입니다’보다 조건절과 자연스럽게 연결되는 ‘두 겹으로 죄를 짓는 것입니다’로 옮길 수 있습니다.
