  text: A man transgressing from his bed says in his soul[a], “Who sees me?”
  footnotes:
  - marker: a
    text: Or, more explicitly in context, 'A man who leaves his marriage bed.' The Greek says literally 'a man transgressing/straying from his bed,' a euphemistic expression in this context of sexual sin.
    reason: lexical_alternative
translation:
  language: ko
  text: 침상에서 벗어나며 속으로 말하는 사람은 “누가 나를 봅니까?”라고 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 문맥상 더 분명하게는 ‘자기 결혼 침상에서 떠나는 사람’ 또는 성적 불충실을 암시하는 표현으로 이해할 수 있습니다. 그리스어는 문자적으로 ‘자기 침상에서 벗어나는 사람’이라고 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄνθρωπος
  english_pob_choice: A man
  chosen_korean: 사람은
  alternatives_korean:
  - 한 남자는
  - 한 사람은
  lexicon: LSJ
  rationale: 그리스어 단수 인칭을 살리면서도 이 절이 특정 개인의 대표적 예를 드는 문맥이므로, 자연스러운 현대 한국어로는 ‘사람’이 가장 무난합니다.
- source_word: παραβαίνων ἀπὸ τῆς κλίνης αὐτοῦ
  english_pob_choice: transgressing from his bed
  chosen_korean: 침상에서 벗어나며
  alternatives_korean:
  - 자기 침상에서 벗어나며
  - 침상에서 떠나며
  - 자기 침실을 벗어나며
  lexicon: LSJ
  rationale: παραβαίνων의 ‘넘어가다/어기다’ 뉘앙스를 단순한 이동보다 ‘벗어나다’로 옮기고, κλίνη를 문자 그대로 ‘침상’으로 두어 원문의 완곡표현을 보존했습니다.
- source_word: λέγων ἐν τῇ ψυχῇ αὐτοῦ
  english_pob_choice: says in his soul
  chosen_korean: 속으로 말하는
  alternatives_korean:
  - 영혼 속에서 말하는
  - 자기 속으로 말하는
  - 마음속으로 말하는
  lexicon: LSJ
  rationale: ψυχή를 기계적으로 ‘영혼’으로 고정하기보다, 내적 발화를 뜻하는 관용을 한국어로 자연스럽게 옮기되 원문의 내적 영역을 유지했습니다.
- source_word: Τίς με ὁρᾷ;
  english_pob_choice: Who sees me?
  chosen_korean: “누가 나를 봅니까?”
  alternatives_korean:
  - “누가 나를 봅니까?”
  - “누가 나를 봅니까?”
  - “누가 나를 볼 수 있습니까?”
  lexicon: LSJ
  rationale: 현재형 질문의 직접성을 살려 ‘봅니까?’로 옮겼고, 숨기려는 화자의 태도를 드러내기 위해 직설적인 질문형을 유지했습니다.
theological_decisions:
- issue: 원문의 완곡한 성적 함의를 본문에서 얼마나 분명히 드러낼지
  chosen_reading: 주본문은 ‘침상에서 벗어나며’로 완곡성을 유지하고, 구체적 성적 의미는 주석 없이 본문 안에서 과잉 명시하지 않았습니다.
  alternative_readings:
  - 자기 결혼 침상에서 떠나며
  - 간음하는 사람이
  rationale: 시락 23장의 문맥상 성적 죄의 암시는 분명하지만, 이 절 자체는 간접어법을 사용하므로 본문에서 그보다 더 구체적으로 단정하지 않는 편이 원문에 더 가깝습니다.
  doctrine_reference: '번역 원칙: 본문이 말하는 것 이상으로 단정하지 말고, 문맥이 주는 긴장과 함의를 보존한다.'
