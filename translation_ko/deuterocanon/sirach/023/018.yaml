  text: A man transgressing from his bed says in his soul[a], “Who sees me?”
  footnotes:
  - marker: a
    text: Or, more explicitly in context, 'A man who leaves his marriage bed.' The Greek says literally 'a man transgressing/straying from his bed,' a euphemistic expression in this context of sexual sin.
    reason: lexical_alternative
translation:
  language: ko
  text: 자기 침상을 저버리고 속으로 말하는 사람은 “누가 나를 봅니까?”라고 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 문맥상 더 분명하게는 ‘자기 결혼 침상을 저버리는 사람’ 또는 성적 불충실을 암시하는 표현으로 이해할 수 있습니다. 그리스어는 문자적으로 ‘자기 침상에서 벗어나며/침상을 저버리며’라고 합니다.
    reason: lexical_alternative
