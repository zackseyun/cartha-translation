  source_fidelity: 핵심 경고의 흐름은 대체로 반영되었으나, ‘큰 사람들’은 μεγιστάνων(사회적으로 높은 지위·권세를 지닌 사람들)을 정확히 드러내지 못하며 한국어에서도 ‘성인들’ 또는 단순히 체격이 큰 사람들로 오해될 수 있습니다. 또한 마지막 ‘저주하지 않도록 하십시오’는 앞선 결과 연쇄 전체를 포괄하는 μήποτε 경고로 명확히 처리하는 편이 좋습니다.
  naturalness: ‘당신의 습관으로 어리석게 되며’와 ‘태어나지 않았더라면 하고 바라며’는 직역투로 다소 부자연스럽습니다. ‘몸에 밴 습관 때문에’, ‘태어나지 않았기를 바라며’로 다듬으면 현대 표준 한국어 합쇼체에서 자연스럽습니다.
  terminology: μεγιστάνων은 ‘유력자들’로 옮기는 것이 사회적 위상이라는 뜻을 명료하게 전달합니다. ἐπιλαθῇ의 문법적·문맥적 불확실성은 본문에서 수동적으로 ‘잊히고’를 유지하고, 해당 위치에 각주를 붙여 ‘자신을 잊고’라는 대안을 보존합니다.
  issues:
  - severity: medium
    issue: ‘큰 사람들’은 μεγιστάνων의 사회적 지위 의미를 충분히 전달하지 못합니다.
    rationale: ‘큰 사람’은 현대 한국어에서 고위층·유력자를 뜻하는 관용적 표현이 아니며, 원문의 권세 있고 높은 신분의 남성 집단이라는 문맥을 흐립니다.
