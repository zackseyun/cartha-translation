    rationale: 대안 독해는 ‘그들 앞에서 잊히고’에 관한 것이므로 해당 어구에 표지를 두어 각주 앵커를 정확히 해야 합니다.
  - severity: low
    issue: 결과 연쇄의 한국어 표현과 종속 범위가 다소 불명확합니다.
