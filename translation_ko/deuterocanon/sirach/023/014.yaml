base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/023/014.yaml
  text: Remember your father and your mother[a], for you sit in the midst of great men; lest you be forgotten before them, and by your habit become foolish, and wish that you had not been born[b], and curse the day of your birth.
  footnotes:
  - marker: a
    text: Or, 'lest you forget yourself before them,' that is, lose proper restraint in their presence. The Greek form can be understood in more than one way here.
    reason: alternative_reading
  - marker: b
    text: '''Great men'' renders a masculine term for socially powerful or high-ranking men; alternatives include ''nobles'' or ''great ones.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 아버지와 어머니를 기억하십시오. 당신은 유력자들 가운데 앉아 있기 때문입니다. 그들 앞에서 잊히고[a], 몸에 밴 습관 때문에 어리석게 되며, 태어나지 않았기를 바라며, 자신이 태어난 날을 저주하게 되지 않도록 하십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들 앞에서 자신을 잊고’, 곧 그들 앞에서 절제를 잃는다는 뜻으로도 이해할 수 있습니다. 여기의 그리스어 형태는 두 가지로 이해될 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: μνήσθητι
  english_pob_choice: Remember
  chosen_korean: 기억하십시오
  alternatives_korean:
  - 기억하라
  - 마음에 두십시오
  lexicon: BDAG
  rationale: 단호한 권면의 아오리스트 명령형을 현대 합쇼체로 자연스럽게 살렸습니다.
- source_word: πατρὸς καὶ μητρός σου
  english_pob_choice: your father and your mother
  chosen_korean: 아버지와 어머니를
  alternatives_korean:
  - 부모를
  - 당신의 부모를
  lexicon: BDAG
  rationale: 두 부모를 각각 지칭하는 구조를 살려 ‘부모’로 뭉개지 않고 구체적으로 옮겼습니다.
- source_word: μεγιστάνων
  english_pob_choice: great men
  chosen_korean: 큰 사람들
  alternatives_korean:
  - 귀인들
  - 유력자들
  - 높은 사람들
  lexicon: LSJ
  rationale: 남성 복수의 사회적 지위 표현을 살리면서도 한국어에서 자연스럽고 과도하게 해석적이지 않게 옮겼습니다.
- source_word: ἐπιλαθῇ ἐνώπιον αὐτῶν
  english_pob_choice: you be forgotten before them
  chosen_korean: 그들 앞에서 잊히고
  alternatives_korean:
  - 그들 앞에서 스스로를 잊고
  - 그들 앞에서 눈밖에 나고
  lexicon: BDAG
  rationale: 형태상 수동적 읽기를 따라 ‘잊히고’로 옮기되, 문맥상 예절 상실의 뉘앙스는 뒤의 결과절들이 드러내도록 했습니다.
- source_word: τῷ ἐθισμῷ σου
  english_pob_choice: by your habit
  chosen_korean: 당신의 습관으로
  alternatives_korean:
  - 당신의 익숙한 버릇으로
  - 당신의 관습 때문에
  lexicon: LSJ
  rationale: 도구/원인의 여격을 반영해, 몸에 밴 행동이 어리석음으로 이어지는 흐름을 간결하게 살렸습니다.
theological_decisions:
- issue: μὴ καταράσῃ의 종속 절 기능
  chosen_reading: ‘저주하지 않도록 하십시오’로 경고의 종속절을 살렸습니다.
  alternative_readings:
  - ‘그리고 저주하지 마십시오’
  - ‘저주하게 되지 않도록 하십시오’
  rationale: 그리스어의 μή + 접속법/명령형 계열 경고 구조를 한국어의 목적/결과 방지 표현으로 자연스럽게 옮겼습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 3
- issue: μεγιστάνων의 남성 사회층 지칭
  chosen_reading: ‘큰 사람들’로 옮겨 성별이 드러나는 사회적 위계성을 유지했습니다.
  alternative_readings:
  - ‘유력자들’
  - ‘귀인들’
  - ‘중요한 사람들’
  rationale: 본문의 남성형 사회적 지칭을 무성별화하지 않되, 한국어에서 독자가 이해할 수 있는 수준으로만 옮겼습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
