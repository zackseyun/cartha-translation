- from: 아버지와 어머니를 기억하십시오[a]. 당신이 큰 사람들 가운데 앉아 있기 때문입니다. 그들 앞에서 잊히고, 당신의 습관으로 어리석게 되며, 태어나지 않았더라면 하고 바라며, 당신의 출생일을 저주하지 않도록 하십시오.
  to: 아버지와 어머니를 기억하십시오. 당신은 유력자들 가운데 앉아 있기 때문입니다. 그들 앞에서 잊히고[a], 몸에 밴 습관 때문에 어리석게 되며, 태어나지 않았기를 바라며, 자신이 태어난 날을 저주하게 되지 않도록 하십시오.
  rationale: ‘유력자들’로 κοινων적 위계의 의미를 명확히 하고, 습관 및 후회의 표현을 자연스러운 현대 한국어로 다듬었습니다. ἐπιλαθῇ의 수동적 읽기는 본문에 유지하되 대안적 재귀 읽기를 바로 그 어구의 각주로 보존했습니다. 마지막 문장은 원문의 경고·결과 연쇄가 모두 ‘~하지 않도록’의 범위 안에 있음을 드러냅니다.
