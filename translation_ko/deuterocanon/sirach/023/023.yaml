  yaml_path: translation/deuterocanon/sirach/023/023.yaml
  text: For first[a], she disobeyed the law of the Most High; and second, she committed an offense against her husband; and third, in sexual immorality she committed adultery and presented children from another man.
  footnotes:
  - marker: a
    text: Or, more dynamically, 'bore children by another man.' The Greek more literally says 'presented children from another man.'
    reason: lexical_alternative
translation:
  language: ko
  text: 첫째, 그녀는 지극히 높으신 이의 율법을 거역하였고, 둘째, 자기 남편에게 잘못을 저질렀으며, 셋째, 음행 가운데서 간음을 저지르고 다른 남자에게서 자녀들을 낳았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, 더 직역하면 ‘다른 남자에게서 난 자녀들을 내세웠습니다.’ 그리스어는 문자적으로 ‘다른 남자에게서 자녀들을 제시했습니다’라고 말합니다.
    reason: lexical_alternative
