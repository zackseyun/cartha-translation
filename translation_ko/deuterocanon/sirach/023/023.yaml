review_pass:
  verdict: revise
  source_fidelity: 수정이 필요합니다. ἑαυτῆς와 동사 형태가 가리키는 대상은 여성인데, 초안의 ‘그는’은 통상 남성 지시로 읽힙니다. 또한 τέκνα는 복수이며, παρέστησεν의 ‘내세우다/제시하다’ 뉘앙스는 각주에서 정확히 제시하는 편이 좋습니다. 세 가지 죄목의 구분, ‘지극히 높으신 이’, 그리고 πορνείᾳ와 μοιχεύω의 구별은 유지할 수 있습니다.
  naturalness: ‘그녀는’으로 여성 지시를 분명히 하고, 각 열거 항목을 합쇼체 과거형으로 일관되게 조정했습니다. ‘다른 남자에게서 자녀들을 낳았습니다’는 본문에서 자연스럽고 문맥상 분명하며, 더 직역적인 표현은 각주에 보존했습니다.
  terminology: ‘지극히 높으신 이의 율법’, ‘음행’, ‘간음’은 적절합니다. δεύτερον의 πλημμελέω는 다음 간음죄와 성급히 동일시하지 않도록 ‘남편에게 잘못을 저질렀으며’로 옮겼습니다. 이는 ‘죄를 지었습니다’보다 원문의 과오·위반이라는 폭넓은 의미를 더 자연스럽게 보존합니다.
  issues:
  - severity: high
    issue: ‘그는’의 성별 지시
    rationale: 원문의 ἑαυτῆς는 여성 소유대명사입니다. 한국어 ‘그는’은 현대 표준어에서 보통 남성을 가리키므로 ‘그녀는’ 또는 무주어 처리로 고쳐야 합니다.
  - severity: medium
    issue: 합쇼체 종결 및 연결의 불일치
    rationale: ‘거역하였고, ... 지었으며’와 마지막 ‘낳았습니다’가 혼용되어 있습니다. 병렬 열거에서는 ‘거역하였고, ... 저질렀으며, ... 낳았습니다’가 일관되고 자연스럽습니다.
  - severity: medium
    issue: 각주가 본문과 동일한 대안을 반복함
    rationale: 초안의 각주는 본문과 같은 ‘다른 남자의 자녀를 낳았습니다’를 동적 번역으로 제시하여 실질적 대안이 되지 않습니다. παρέστησεν의 직역적 ‘내세우다/제시하다’를 별도 대안으로 제시해야 합니다.
  - severity: low
    issue: τέκνα의 복수 미반영
    rationale: 그리스어 τέκνα는 복수이므로 ‘자녀들을’로 옮기는 것이 직접적 대응을 더 잘 보존합니다.
