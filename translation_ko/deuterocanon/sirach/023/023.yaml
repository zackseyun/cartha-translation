  alternatives_korean:
  - 간음을 하였고 다른 남자의 자녀를 드러냈습니다
  - 간음하였으며 다른 남자의 자녀를 내었습니다
  lexicon: BDAG/LSJ
  rationale: ἐμοιχεύθη의 명시적 간음과 παρίστημι의 ‘내다/제시하다’ 계열 의미를 함께 살리되, 한국어에서는 출산 결과를 자연스럽게 ‘낳았습니다’로 표현했습니다.
theological_decisions:
- issue: 세 가지 죄목의 구분과 점층성
  chosen_reading: 율법에 대한 불순종, 남편에 대한 죄, 음행 중의 간음과 타인의 자녀 출산을 각각 구분해 번역했습니다.
  alternative_readings:
  - 두 번째와 세 번째 항목을 단순히 혼인불성실로 합치는 번역
  rationale: 원문은 죄책을 세 단계로 분명히 나열하므로, 한국어에서도 그 긴장을 유지해야 본문의 수사와 도덕적 누적이 살아납니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 3, 5
- issue: Ὑψίστου의 신적 칭호 처리
  chosen_reading: ‘지극히 높으신 이’로 옮겨 하나님의 칭호를 분명히 했습니다.
  alternative_readings:
  - ‘가장 높으신 이’
  - ‘지극히 높으신 하나님’
  rationale: 본문에 없는 ‘하나님’을 덧붙이지 않으면서도, 지극히 높으신 분이 율법의 근원이라는 신학적 지시를 유지하기 위함입니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 2
