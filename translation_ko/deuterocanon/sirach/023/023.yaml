  text: For first[a], she disobeyed the law of the Most High; and second, she committed an offense against her husband; and third, in sexual immorality she committed adultery and presented children from another man.
  footnotes:
  - marker: a
    text: Or, more dynamically, 'bore children by another man.' The Greek more literally says 'presented children from another man.'
    reason: lexical_alternative
translation:
  language: ko
  text: 첫째, 그는 지극히 높으신 이의 율법을 거역하였고, 둘째, 자기 남편에게 죄를 지었으며, 셋째, 음행 가운데서 간음을 저지르고 다른 남자의 자녀를 낳았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 동적으로, ‘다른 남자의 자녀를 낳았습니다.’ 그리스어는 문자적으로 ‘다른 남자의 자녀를 제시했습니다’라고 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: πρῶτον μὲν ... καὶ δεύτερον ... καὶ τὸ τρίτον
  english_pob_choice: For first ... and second ... and third
  chosen_korean: 첫째 ... 둘째 ... 셋째
  alternatives_korean:
  - 첫 번째 ... 두 번째 ... 세 번째
  - 먼저 ... 다음으로 ... 마지막으로
  lexicon: LSJ
  rationale: 그리스어의 세 단계 열거를 한국어의 자연스러운 서열 표현으로 보존해, 죄목의 점층 구조를 살렸습니다.
- source_word: ἐν νόμῳ Ὑψίστου
  english_pob_choice: the law of the Most High
  chosen_korean: 지극히 높으신 이의 율법
  alternatives_korean:
  - 가장 높으신 이의 율법
  - 지존자의 율법
  lexicon: LSJ
  rationale: Ὑψίστου를 직역해 하나님의 칭호를 드러내되, 한국어 성경문맥에서 자연스러운 존칭형으로 옮겼습니다.
- source_word: ἐπλημμέλησεν
  english_pob_choice: committed an offense
  chosen_korean: 죄를 지었습니다
  alternatives_korean:
  - 잘못을 저질렀습니다
  - 범하였습니다
  - 허물을 저질렀습니다
  lexicon: LSJ
  rationale: 남편에 대한 행위를 단순 간음으로 미리 평면화하지 않고, 원문의 단계적 도덕 판단을 살리기 위해 포괄적 표현을 택했습니다.
- source_word: ἐν πορνείᾳ
  english_pob_choice: in sexual immorality
  chosen_korean: 음행 가운데서
  alternatives_korean:
  - 성적 부도덕 가운데서
  - 음란 중에
  - 음행으로
  lexicon: BDAG
  rationale: πορνεία의 넓은 성적 타락 의미를 현대 한국어에서 바로 이해되는 ‘음행’으로 옮겼습니다.
- source_word: ἐμοιχεύθη ... τέκνα παρέστησεν
  english_pob_choice: she committed adultery and presented children from another man
  chosen_korean: 간음을 저지르고 다른 남자의 자녀를 낳았습니다
  alternatives_korean:
  - 간음을 하였고 다른 남자의 자녀를 드러냈습니다
  - 간음하였으며 다른 남자의 자녀를 내었습니다
  lexicon: BDAG/LSJ
  rationale: ἐμοιχεύθη의 명시적 간음과 παρίστημι의 ‘내다/제시하다’ 계열 의미를 함께 살리되, 한국어에서는 출산 결과를 자연스럽게 ‘낳았습니다’로 표현했습니다.
theological_decisions:
- issue: 세 가지 죄목의 구분과 점층성
  chosen_reading: 율법에 대한 불순종, 남편에 대한 죄, 음행 중의 간음과 타인의 자녀 출산을 각각 구분해 번역했습니다.
  alternative_readings:
  - 두 번째와 세 번째 항목을 단순히 혼인불성실로 합치는 번역
  rationale: 원문은 죄책을 세 단계로 분명히 나열하므로, 한국어에서도 그 긴장을 유지해야 본문의 수사와 도덕적 누적이 살아납니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 3, 5
- issue: Ὑψίστου의 신적 칭호 처리
  chosen_reading: ‘지극히 높으신 이’로 옮겨 하나님의 칭호를 분명히 했습니다.
  alternative_readings:
  - ‘가장 높으신 이’
  - ‘지극히 높으신 하나님’
  rationale: 본문에 없는 ‘하나님’을 덧붙이지 않으면서도, 지극히 높으신 분이 율법의 근원이라는 신학적 지시를 유지하기 위함입니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 2
