  text: Do not let the appetite of the belly and sexual intercourse overtake me[b][a], and do not give me over to a shameless soul.
  footnotes:
  - marker: a
    text: Or 'sexual relations'; the Greek term can denote sexual union more neutrally, but here the surrounding prayer against vice supports the rendering 'sexual indulgence.'
    reason: lexical_alternative
  - marker: b
    text: Or 'do not hand me over to a shameless self.' The Greek literally reads 'a shameless soul.'
    reason: lexical_alternative
translation:
  language: ko
  text: 배의 욕구와 성관계[a]가 저를 사로잡지 못하게 하시고, 수치심 없는 영혼[b]에게 저를 넘기지 마십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘성적 결합’ 또는 ‘성적 관계’. 그리스어는 성적 결합을 비교적 중립적으로 가리킬 수도 있으나, 여기서는 악덕과 욕망을 경계하는 기도라는 문맥이 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘수치심 없는 자아’. 그리스어는 문자적으로 ‘수치심 없는 영혼’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: κοιλίας ὄρεξις
  english_pob_choice: the appetite of the belly
  chosen_korean: 배의 욕구
  alternatives_korean:
  - 복의 욕망
  - 배의 식욕
  - 위장의 욕구
  lexicon: LSJ
  rationale: κοιλία와 ὄρεξις의 결합은 단순한 식사보다 육체적 욕구를 가리키므로, 한국어에서는 자연스럽되 육체적 욕망이 드러나는 ‘배의 욕구’로 옮겼습니다.
- source_word: συνουσιασμός
  english_pob_choice: sexual intercourse
  chosen_korean: 성적 결합
  alternatives_korean:
  - 성관계
  - 성적 교합
  - 성적 관계
  lexicon: LSJ
  rationale: 이 단어는 문자적으로 성적 결합/동침을 가리키지만, 문맥상 윤리적 경고가 있으므로 너무 중립적이거나 기술적인 표현보다 의미를 드러내는 ‘성적 결합’을 선택했습니다.
- source_word: καταλαβέτωσάν με
  english_pob_choice: Do not let ... overtake me
  chosen_korean: 저를 사로잡지 못하게 하시고
  alternatives_korean:
  - 저를 따라잡지 못하게 하시고
  - 저를 붙잡지 못하게 하시고
  - 저를 덮치지 못하게 하시고
  lexicon: LSJ
  rationale: καταλαμβάνω는 붙잡다/사로잡다/덮치다의 뜻이 있어, 여기서는 욕망에 압도되는 뉘앙스를 살리는 ‘사로잡다’가 가장 자연스럽습니다.
- source_word: ψυχὴ ἀναιδεῖ
  english_pob_choice: a shameless soul
  chosen_korean: 뻔뻔한 혼
  alternatives_korean:
  - 수치심 없는 혼
  - 뻔뻔한 영혼
  - 무례한 혼
  lexicon: LSJ
  rationale: ψυχή를 인격의 내면으로 보아 ‘혼’으로 옮기고, ἀναιδής의 도덕적 수치를 살려 ‘뻔뻔한’으로 번역했습니다.
theological_decisions:
- issue: ψυχή의 번역을 ‘self’로 완화할지 여부
  chosen_reading: 본문의 인류학적 표현을 살려 ‘혼’으로 유지했습니다.
  alternative_readings:
  - 자기
  - 자아
  - 내면
  rationale: 그리스어가 분명히 ψυχή를 사용하므로, 현대적 매끈함 때문에 인격/영혼의 층위를 지우지 않도록 ‘혼’을 택했습니다.
  doctrine_reference: 'Translation philosophy: readable modern Korean while preserving source texture.'
- issue: 성적 표현의 윤리적 색채
  chosen_reading: συνουσιασσμός를 중립적 ‘성관계’보다 윤리적 경고가 드러나는 ‘성적 결합’으로 옮겼습니다.
  alternative_readings:
  - 성관계
  - 성적 관계
  rationale: 지혜문학 맥락은 욕망의 절제를 기도하는 문맥이므로, 의미상 중립적 표현은 경고의 힘을 약화시킬 수 있습니다.
  doctrine_reference: 'Translation philosophy: source-direct without euphemizing moral warning.'
