  source_fidelity: 핵심 구문은 대체로 충실합니다. 그러나 συνουσιασμός의 ‘성적 결합’은 한국어에서 다소 부자연스럽고, ψυχὴ ἀναιδεῖ의 ‘뻔뻔한 혼’은 현대 표준 한국어의 성서적·문어적 용례에서 어색합니다. 여격 구조는 ‘…에게 저를 넘기지 마십시오’로 명시하는 편이 원문에 더 충실합니다.
  naturalness: ‘성관계’는 현대 한국어에서 자연스럽고 원문의 기본 의미를 과도하게 강화하지 않습니다. ‘영혼’은 ‘혼’보다 표준어 성서 문맥에서 훨씬 자연스럽습니다. 각주 표지는 해당 어구 바로 뒤에 배치해야 합니다.
  terminology: κοιλίας ὄρεξις는 ‘배의 욕구’로 유지할 수 있습니다. συνουσιασμός는 문맥의 절제 기도가 그 부정적 함의를 제공하므로 본문에서는 중립적이되 직접적인 ‘성관계’로 옮깁니다. ψυχή는 ‘영혼’으로, ἀναιδής는 ‘수치심 없는’으로 옮겨 원문의 표현을 보존합니다.
