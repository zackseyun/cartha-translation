  source_fidelity: 전반적으로 원문에 충실합니다. οὗτος의 남성 단수 지시와 ἐκδικηθήσεται의 수동적 징벌, πιασθήσεται의 체포·붙잡힘을 적절히 보존했습니다. 다만 οὐχ ὑπενόησεν은 어떤 ‘장소’를 의심하지 않았다는 뜻이라기보다 그곳에서의 붙잡힘을 전혀 예상하거나 짐작하지 못했다는 뜻이므로, ‘의심하지 않았던 곳’은 한국어 의미 연결이 부자연스럽고 오해의 여지가 있습니다.
  naturalness: ‘성읍의 넓은 거리들’은 이해 가능하나 한국어에서는 복수 표지가 다소 무겁습니다. ‘성읍의 넓은 거리’는 πλατείαι의 일반적·공개적 장소라는 복수 개념을 자연스럽게 전달합니다. 핵심적으로 ‘그가 예상하지 못한 곳’이 문맥과 현대 표준어에 더 자연스럽습니다.
  terminology: ‘성읍’, ‘벌을 받게 되고’, ‘붙잡히게 될 것입니다’는 현대의 격식 있는 성경 문체에 적절합니다. ‘벌’은 여기서 공적 응보·징벌이라는 문맥적 의미를 무리 없이 전달하며, 특정 교리적 해석을 덧붙이지 않습니다.
