base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/023/021.yaml
  text: This man will be punished in the streets of the city[a], and where he did not suspect it[b], he will be caught.
  footnotes:
  - marker: a
    text: Or 'in the city squares'; the Greek literally refers to the broad/open places of the city, emphasizing public exposure.
    reason: lexical_alternative
  - marker: b
    text: Or 'where he did not expect it' or 'where he did not imagine it.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이 사람은 성읍의 넓은 거리들에서 벌을 받게 되고[a], 그가 의심하지 않았던 곳에서 붙잡히게 될 것입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘성읍의 광장들에서’. 헬라어는 문자적으로 성읍의 넓고 열린 장소들을 가리켜, 공개적 노출을 강조합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그가 예상하지 않았던 곳에서’ 또는 ‘그가 짐작하지 않았던 곳에서’.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτος
  english_pob_choice: This man
  chosen_korean: 이 사람은
  alternatives_korean:
  - 이 자는
  - 그 사람은
  lexicon: LSJ
  rationale: 문맥상 앞선 간음한 남자를 가리키는 지시어이므로, 자연스러운 한국어로 대상 인물을 분명히 드러내는 ‘이 사람은’을 선택했습니다.
- source_word: ἐν πλατείαις πόλεως
  english_pob_choice: in the streets of the city
  chosen_korean: 성읍의 넓은 거리들에서
  alternatives_korean:
  - 도성의 거리들에서
  - 성읍의 시내 광장들에서
  lexicon: LSJ
  rationale: πλατεῖαι는 문자적으로 ‘넓은 곳/넓은 거리’의 뜻이므로, 공개적 노출의 뉘앙스를 살리면서도 직역에 갇히지 않게 ‘성읍의 넓은 거리들에서’로 옮겼습니다.
- source_word: ἐκδικηθήσεται
  english_pob_choice: will be punished
  chosen_korean: 벌을 받게 되고
  alternatives_korean:
  - 징벌을 받게 되고
  - 보복을 당하게 되고
  lexicon: LSJ
  rationale: 이 수동형은 개인적 복수보다 공개적 징벌을 뜻하므로, 문맥에 맞게 ‘벌을 받다’로 옮겨 심판의 의미를 분명히 했습니다.
- source_word: οὐχ ὑπενόησεν
  english_pob_choice: he did not suspect it
  chosen_korean: 그가 의심하지 않았던
  alternatives_korean:
  - 그가 예상하지 않았던
  - 그가 짐작하지 않았던
  lexicon: LSJ
  rationale: ὑπονοέω는 ‘짐작하다, 의심하다, 추측하다’의 뜻이 있어, 예상 밖의 상황이라는 뉘앙스를 살리는 ‘의심하지 않았던’을 택했습니다.
theological_decisions:
- issue: 공개적 징벌의 성격
  chosen_reading: 이 절의 ἐκδικηθήσεται는 사적 복수보다 공적이고 가시적인 징벌을 가리키는 것으로 읽었습니다.
  alternative_readings:
  - 그에게 복수될 것이다
  - 그에게 정의가 집행될 것이다
  rationale: 문맥은 간음한 남자의 폭로와 수치를 말하며, 한국어에서도 ‘벌을 받다’가 가장 직접적으로 공적 심판의 성격을 전달합니다.
  doctrine_reference: DOCTRINE.md §1 원문 우선
- issue: 지시어의 성별 보존
  chosen_reading: οὗτος의 남성 지시를 살려 앞선 간음한 남자를 가리키는 표현으로 번역했습니다.
  alternative_readings:
  - 이 사람
  - 그
  rationale: 앞뒤 문맥이 남성 인물을 특정하므로, 성별이 흐려지지 않도록 ‘이 사람은’으로 유지했습니다.
  doctrine_reference: DOCTRINE.md §4 성별 정확성 우선
