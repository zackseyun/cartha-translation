translation:
  language: ko
  text: 사방에서 에워싸며 숨 막히게 하는 불에서, 또 내가 지피지 않은 불 한가운데에서[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 현존 히브리어 본문은 이 절에서 그리스어와 크게 다르며 난해합니다. 특히 후반부는 자구상 대략 ‘깊음의 태에서, 나의 어머니에게서’로 옮길 수 있으나 문맥에서 뜻이 분명하지 않습니다. 본문은 의미가 분명한 그리스어 병행문의 ‘내가 지피지 않은 불 한가운데에서’를 따랐습니다.
    reason: textual_variant
lexical_decisions:
- source_word: ἀπὸ πνιγμοῦ πυρᾶς κυκλόθεν
  english_pob_choice: from a choking fire all around
  chosen_korean: 소용돌이치는 불 속에서
  alternatives_korean:
  - 질식시키는 불 속에서
  - 숨 막히는 불길 가운데서
  lexicon: BDAG; HALOT
  rationale: 히브리어 본문은 이 대목이 불확실하므로, 의미가 분명한 그리스어 병행문의 '질식/압박' 이미지를 살려 자연스러운 현대 한국어로 옮겼습니다.
- source_word: κυκλόθεν
  english_pob_choice: all around
  chosen_korean: 소용돌이치는
  alternatives_korean:
  - 사방의
  - 둘레의
  lexicon: BDAG
  rationale: 직역적 부사보다 문맥상 불이 사방에서 에워싼다는 감각을 한국어로 살아 있게 전달하는 표현을 택했습니다.
- source_word: ἐκ μέσου πυρὸς
  english_pob_choice: from the midst of a fire
  chosen_korean: 불 한가운데에서
  alternatives_korean:
  - 불의 한가운데에서
  - 불 가운데서
  lexicon: BDAG
  rationale: 그리스어의 장소 표지를 평이하게 살려, 단순히 '불에서'가 아니라 중심 내부를 드러내는 표현으로 옮겼습니다.
- source_word: οὗ οὐκ ἐξέκαυσα
  english_pob_choice: that I did not kindle
  chosen_korean: 내가 지피지 않은
  alternatives_korean:
  - 내가 붙이지 않은
  - 내가 불붙이지 않은
  lexicon: BDAG
  rationale: ἐκκαίω의 능동형은 '지피다/불붙이다'의 의미이므로, 수동적 '타지 않았다'보다 화자가 책임을 지지 않은 불이라는 점을 분명히 했습니다.
theological_decisions:
- issue: 히브리어 본문의 난점과 그리스어 병행문의 사용
  chosen_reading: 주 본문은 의미가 분명한 그리스어 병행문을 따라 옮기되, 히브리어의 불 이미지 자체는 보존했습니다.
  alternative_readings:
  - 히브리어 자구를 따라 불명확한 어구를 그대로 반영하는 번역
  rationale: 이 절의 히브리어는 현존 형태가 매우 불안정하여 문맥상 매끄럽지 않으므로, POB의 방침대로 그리스어를 실제 번역 입력으로 삼아도 본문의 핵심 이미지는 유지됩니다.
  doctrine_reference: 'PHILOSOPHY.md: 히브리어가 불충분할 때는 그리스어 병행문을 실제 번역 입력으로 사용하되, 원문 불확실성은 정직하게 드러낸다.'
