translation:
  language: ko
  text: 목을 그녀의 멍에 아래에 들이밀고, 여러분의 영이 그녀의 짐을 지십시오. 그녀는 그녀를 찾는 이들에게 가깝고, 자기 자신을 내어주는 사람은 그녀를 찾아냅니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 평행본문은 ‘여러분의 영이 훈련을 받게 하십시오’로 읽습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְצַוְּארֵיכֶם
  english_pob_choice: your neck
  chosen_korean: 목을
  alternatives_korean:
  - 여러분의 목을
  - 목덜미를
  lexicon: HALOT
  rationale: 복수형 어미가 붙은 ‘여러분의 목들’의 직역보다, 한국어에서는 공동 권면에서 단수·복수 구분이 약한 ‘목을’이 관용적이며 몸의 이미지를 자연스럽게 살립니다.
- source_word: בְּעֻלָּהּ
  english_pob_choice: under her yoke
  chosen_korean: 그녀의 멍에 아래에
  alternatives_korean:
  - 그녀의 멍에 안에
  - 그녀의 멍에 아래로
  lexicon: HALOT
  rationale: 히브리어와 그리스어 평행본문의 멍에 이미지를 따라, 지혜의 훈육에 복종하는 뜻을 한국어의 ‘멍에 아래에’로 옮겼습니다.
- source_word: וּמַשָּׂאָהּ תִּשָּׂא נַפְשְׁכֶם
  english_pob_choice: let your soul bear her burden
  chosen_korean: 여러분의 영이 그녀의 짐을 지십시오
  alternatives_korean:
  - 여러분의 혼이 그녀의 짐을 지십시오
  - 여러분 자신이 그녀의 짐을 지십시오
  lexicon: HALOT
  rationale: 히브리어의 ‘נֶפֶשׁ’은 여기서 단순한 감정이 아니라 사람 전체를 가리키는 생명/존재를 뜻하므로, 현대 한국어에서는 ‘영이’로 옮겨 주체성과 내적 실재를 살렸습니다.
- source_word: וְנוֹתֵן נַפְשׁוֹ
  english_pob_choice: the one who gives himself
  chosen_korean: 자기 자신을 내어주는 사람
  alternatives_korean:
  - 자기 생명을 내어주는 사람
  - 자기 영혼을 내어주는 사람
  lexicon: HALOT
  rationale: 직역하면 ‘자기 영혼/생명을 주는 자’이지만, 문맥상 지혜를 향한 전적 헌신을 뜻하므로 한국어에서는 ‘자기 자신을 내어주는’으로 자연스럽게 살렸습니다.
theological_decisions:
- issue: 지혜의 인격화된 여성 지시
  chosen_reading: ‘그녀/그녀의’로 지혜를 끝까지 여성 인칭으로 유지했습니다.
  alternative_readings:
  - ‘그것/그의’로 비인격적 지혜를 표현
  rationale: 히브리어 문법과 문맥이 지혜를 여성으로 의인화하므로, 그 형상을 추상화하지 않고 보존하는 것이 원문 충실성에 더 가깝습니다.
  doctrine_reference: 원문 우선 번역 원칙; 의인화 보존
- issue: 히브리어 본문과 그리스어 병행본문의 차이
  chosen_reading: 본문은 히브리어의 ‘짐을 지다’ 이미지를 따르고, 그리스어의 ‘훈련/가르침을 받다’ 의미는 각주로 보존합니다.
  alternative_readings:
  - ‘여러분의 영이 훈련을 받게 하십시오’
  rationale: 이 단락은 히브리어가 현존하며 본문으로 읽을 수 있으므로, 주번역은 히브리어를 따르되 중요한 그리스어 전승을 소거하지 않고 각주로 남깁니다.
  doctrine_reference: 서바이랄/외경 본문 번역 원칙; 현존 히브리어 우선, 그리스어 병행 전승 보존
