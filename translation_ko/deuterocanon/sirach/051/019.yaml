lexical_decisions:
- source_word: חַשְׁקָה נַפְשִׁי בָּהּ
  english_pob_choice: My soul clung to her
  chosen_korean: 내 마음이 그녀에게 사로잡혔으며
  alternatives_korean:
  - 내 영혼이 그녀에게 매달렸으며
  - 내 마음이 그녀를 갈망했으며
  lexicon: נפשׁ
  rationale: POB의 ‘clung’는 단순한 감정적 욕망보다 대상에 붙들려 떨어지지 않는 상태를 드러내므로, 한국어에서는 ‘사로잡혔으며’로 원문의 강한 결속감을 살렸습니다.
- source_word: בָּהּ
  english_pob_choice: to her
  chosen_korean: 그녀에게
  alternatives_korean:
  - 그녀를 향해
  - 그녀 안에
  lexicon: בְּ + pronominal suffix
  rationale: 전치사 ב + 대명사 접미사는 관계의 방향을 분명히 하므로, 자연스러운 여격인 ‘그녀에게’로 옮겼습니다.
- source_word: וּפָנַי לֹא אַהֲפֹך מִמֶּנָּה
  english_pob_choice: and I did not turn my face away from her
  chosen_korean: 나는 그녀에게서 얼굴을 돌리지 않았습니다
  alternatives_korean:
  - 나는 그녀에게서 얼굴을 돌리지 않았습니다
  - 나는 그녀를 외면하지 않았습니다
  lexicon: פנים / הפך
  rationale: ‘얼굴을 돌리다’는 히브리어 관용구의 직역에 가깝고, POB의 ‘turn my face away’도 같은 방향이므로, 외면의 의미를 유지하면서도 한국어로 자연스럽게 표현했습니다.
theological_decisions:
- issue: ‘clung’의 심리적·영적 강도
  chosen_reading: ‘사로잡혔으며’로 번역해, 단순 호감보다 거의 집착에 가까운 결속을 드러냈습니다.
  alternative_readings:
  - ‘매달렸으며’
  - ‘갈망했으며’
  rationale: 히브리어 חָשַׁק은 강한 애착·붙들림을 가리킬 수 있어, 본문이 말하는 내적 강도를 약화시키지 않는 방향을 택했습니다.
  doctrine_reference: 본문 문맥 존중; 어휘 강도 유지
