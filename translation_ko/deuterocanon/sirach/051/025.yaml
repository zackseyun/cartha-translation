    reason: lexical_alternative
lexical_decisions:
- source_word: פִּי פָתַחְתִּי
  english_pob_choice: I opened my mouth
  chosen_korean: 제가 입을 열어
  alternatives_korean:
  - 제가 입을 열고
  - 제가 말을 시작해
  - 제가 입을 열었습니다
  lexicon: HALOT
  rationale: 히브리어 관용구를 자연스럽게 살리되, 직접적인 발화 시작을 분명히 드러내기 위해 ‘입을 열어’로 옮겼습니다.
- source_word: וְדִבַּרְתִּי בָהּ
  english_pob_choice: and spoke of her
  chosen_korean: 그에 대해 말했습니다
  alternatives_korean:
  - 그에 대해 말했고
  - 그녀에 대해 말했습니다
  - 그것에 대해 말했습니다
  lexicon: HALOT
  rationale: 여성형 대명사의 지시 대상인 지혜를 한국어에서 과도하게 의인화하지 않으면서도, 원문의 지시 관계와 담화 주제를 보존했습니다.
- source_word: קְנוּ לָכֶם חָכְמָה
  english_pob_choice: acquire wisdom for yourselves
  chosen_korean: 스스로를 위하여 지혜를 얻으십시오
  alternatives_korean:
  - 자기들을 위하여 지혜를 사십시오
  - 지혜를 사서 가지십시오
  - 지혜를 얻으십시오
  lexicon: HALOT
  rationale: קנה의 ‘사다’라는 상업적 뉘앙스를 완전히 지우지 않으면서도, 현대 한국어에서 지혜와의 결합이 자연스러운 ‘얻으십시오’를 택했습니다.
- source_word: בְּלֹא כָסֶף
  english_pob_choice: without silver
  chosen_korean: 은전 없이
  alternatives_korean:
  - 돈 없이
  - 은화 없이
  - 값을 치르지 말고
  lexicon: HALOT
  rationale: 히브리어와 그리스어의 구체적 경제 이미지를 따라 일반적인 ‘돈’보다 더 물질적인 ‘은전’을 유지했습니다.
theological_decisions:
- issue: ‘בָהּ’의 지시 대상과 여성형 표현
  chosen_reading: 지혜를 가리키는 여성형 지시로 이해하되, 한국어에서는 ‘그에 대해’로 절제해 옮겼습니다.
  alternative_readings:
  - ‘그녀에 대해’로 더 직접적으로 의인화할 수 있습니다.
  - ‘그것에 대해’로 더 비인칭적으로 옮길 수 있습니다.
  rationale: 시락 51장은 지혜를 여성형으로 다루는 문맥이므로 원문의 수사적 인격화를 지우지 말아야 하지만, 한국어에서는 불필요한 성별 표지를 강제하지 않는 방식이 가장 균형적입니다.
  doctrine_reference: 문학적 의인화와 문법적 성별을 구분하여 보존
- issue: ‘לָכֶם’의 재귀적 뉘앙스
  chosen_reading: ‘스스로를 위하여’로 옮겨 수혜자-행위자의 자기지향성을 살렸습니다.
  alternative_readings:
  - ‘너희를 위하여’
  - ‘여러분을 위해’
  rationale: 직역형 ‘너희를 위하여’도 가능하지만, 지혜를 적극적으로 ‘자기 몫으로 삼으라’는 권면의 성격이 더 분명히 드러나도록 했습니다.
  doctrine_reference: 권면의 수사 유지
