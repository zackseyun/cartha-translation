translation:
  language: ko
  text: 야훼께서 제 입술의 보상을 제게 주셨습니다[a]. 그러므로 저는 그녀를 좋은 소유로 얻었습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 ‘주님께서 제게 제 보상으로 혀를 주셨고, 그것으로 제가 그분을 찬양하겠습니다’라고 읽습니다.
    reason: alternative_reading
  - marker: b
    text: ‘그녀’는 주변 문맥에서 지혜를 가리킵니다.
    reason: cross_reference
lexical_decisions:
- source_word: יְהֹוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 주
  lexicon: HALOT
  rationale: POB 기본값에 따라 신적 이름을 야훼로 옮겨 히브리어 고유 지시를 드러냅니다.
- source_word: שְׂכַר
  english_pob_choice: reward
  chosen_korean: 보상
  alternatives_korean:
  - 상
  - 삯
  - 보수
  lexicon: HALOT
  rationale: 문맥상 긍정적 보답의 의미를 살려 ‘보상’으로 옮겼습니다.
- source_word: שִׂפְתוֹתָי
  english_pob_choice: my lips
  chosen_korean: 제 입술
  alternatives_korean:
  - 제 말
  - 제 입에서 나온 말
  - 제 입술의 말
  lexicon: HALOT
  rationale: 직역에 가깝게 ‘입술’을 유지해 히브리어 관용구의 구체성을 보존했습니다.
- source_word: קְנִיתִיהָ / קִנְיָן טוֹב
  english_pob_choice: I acquired her / a good possession
  chosen_korean: 그녀를 좋은 소유로 얻었습니다
  alternatives_korean:
  - 그녀를 좋은 소유로 취했습니다
  - 그녀를 훌륭한 소유로 얻었습니다
  lexicon: HALOT
  rationale: ‘얻다’로 קנה의 취득 의미를 살리고, ‘좋은 소유’로 קִנְיָן의 명사적 결을 보존했습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 평행문의 차이
  chosen_reading: 본문은 현존하는 히브리어를 따라 ‘야훼께서 제 입술의 보상을 제게 주셨습니다’로 두고, 그리스어의 ‘혀를 주셔서 그로 그분을 찬양하겠다’는 독법은 각주로 보류했습니다.
  alternative_readings:
  - 그리스어처럼 ‘주님께서 제게 혀를 보상으로 주셨고, 그것으로 제가 그분을 찬양하겠습니다’
  rationale: 시락서는 히브리어가 남아 있는 곳에서는 그것을 मुख्य 본문으로 삼는 원칙에 따르되, 그리스어의 의미 차이도 지워지지 않도록 합니다.
  doctrine_reference: 'PHILOSOPHY.md: translate Sirach from Hebrew where it survives; use Greek in view as parallel input.'
