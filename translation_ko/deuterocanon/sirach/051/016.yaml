translation:
  language: ko
  text: 나는 조금 귀를 기울여 그것을 받아들였고, 나를 위해 많은 교훈을 얻었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘훈육’, ‘훈련’, ‘교육’일 수 있습니다. 그리스어 παιδεία는 넓게는 교정과 형성을 포함하는 가르침을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔκλινα ὀλίγον τὸ οὖς μου
  english_pob_choice: I inclined my ear a little
  chosen_korean: 나는 조금 귀를 기울여
  alternatives_korean:
  - 나는 조금 내 귀를 기울여
  - 나는 조금 귀를 낮추어
  lexicon: LSJ
  rationale: ‘귀를 기울이다’는 ‘귀를 굽히다/기울이다’의 비유를 자연스럽게 살리면서도 현대 한국어에서 즉시 이해됩니다. ‘조금’은 ὀλίγον의 작은 정도를 그대로 반영합니다.
- source_word: ἐδεξάμην
  english_pob_choice: received it
  chosen_korean: 그것을 받아들였고
  alternatives_korean:
  - 그것을 받았고
  - 그것을 받아들였고
  lexicon: LSJ
  rationale: 직접 목적어가 그리스어에서 암시되므로 한국어에서는 문맥상 ‘그것’을 보충했습니다. ‘받다’보다 ‘받아들이다’가 지혜/훈계의 수용을 더 분명히 드러냅니다.
- source_word: πολλὴν ... παιδείαν
  english_pob_choice: much instruction
  chosen_korean: 많은 교훈을
  alternatives_korean:
  - 많은 훈육을
  - 많은 교육을
  - 많은 훈련을
  lexicon: LSJ
  rationale: παιδεία는 훈육, 훈련, 교육까지 아우를 수 있지만, 지혜문맥에서는 형성적 가르침의 뜻이 가장 자연스럽습니다. 따라서 ‘교훈’을 택하되, 본문 의미의 폭은 결정문과 주석에서 보존합니다.
- source_word: εὗρον ἐμαυτῷ
  english_pob_choice: I found for myself
  chosen_korean: 나를 위해 ... 얻었습니다
  alternatives_korean:
  - 나 자신을 위해 ... 찾았습니다
  - 제게 ... 발견했습니다
  lexicon: LSJ
  rationale: 반사대명사적 여격 ἐμαυτῷ는 ‘자기 자신에게 유익이 되도록’이라는 개인적 획득의 뉘앙스를 가집니다. 한국어에서는 ‘나를 위해’로 그 방향성을 살렸습니다.
theological_decisions:
- issue: παιδεία의 의미 범위
  chosen_reading: ‘교훈’으로 번역하되, 단순 정보가 아니라 형성적 훈련과 교정까지 포함할 수 있는 지혜의 교육으로 읽습니다.
  alternative_readings:
  - 훈육
  - 훈련
  - 교육
  rationale: 이 구절은 지혜를 받아들이는 태도의 결과를 말하므로, 징벌적 뉘앙스만 강한 표현은 피하고 형성적 의미를 유지하는 것이 적절합니다.
  doctrine_reference: 지혜문학의 교육/훈련 개념
- issue: 수동적 청취가 아니라 능동적 수용
  chosen_reading: ‘귀를 기울여’와 ‘받아들였다’를 함께 써서, 단순히 들은 것이 아니라 내면적으로 수용한 행위를 드러냅니다.
  alternative_readings:
  - 들었습니다
  - 들어보았습니다
  rationale: 그리스어의 비유적 동작과 수용 동사를 함께 보존해야, 본문의 자기반성적 지혜 체험이 약화되지 않습니다.
  doctrine_reference: 본문의 수사적 구조
