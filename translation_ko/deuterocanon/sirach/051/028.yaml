base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/051/028.yaml
  text: Many heard my instruction in my youth[b][a], and they acquired silver and gold by me.
  footnotes:
  - marker: a
    text: 'Greek parallel: ''Receive instruction for a great amount of silver, and acquire much gold by it.'' The Hebrew witness here is declarative rather than imperative.'
    reason: alternative_reading
  - marker: b
    text: Or 'by me' / 'in me.' The Hebrew phrase is compact; the rendering 'through me' takes the speaker's instruction as the means by which others gained wealth.
    reason: lexical_alternative
translation:
  language: ko
  text: 많은 사람이 내 젊은 시절의 교훈을 들었고, 은과 금을 나를 통해 얻었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 병행문은 ‘많은 은값으로 교훈을 받으십시오, 그 안에서 많은 금을 얻으십시오’라는 명령형입니다. 히브리어 증거는 여기서 서술형입니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어 בִּי는 ‘나를 통해/나로 말미암아’라는 수단·매개의 뜻으로 읽을 수 있습니다. POB 영어는 이를 ‘by me / through me’로 설명합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַבִּים
  english_pob_choice: Many
  chosen_korean: 많은 사람이
  alternatives_korean:
  - 많은 이들이
  - 무리가
  lexicon: HALOT
  rationale: 양을 나타내는 פשוט한 형용사이므로 자연스러운 현대 한국어로 ‘많은 사람이’가 가장 무난합니다.
- source_word: שָׁמְעוּ לִמּוּדִי
  english_pob_choice: heard my instruction
  chosen_korean: 내 … 교훈을 들었고
  alternatives_korean:
  - 내 가르침을 들었고
  - 내 훈계를 들었고
  lexicon: HALOT
  rationale: לִמּוּדִי는 지혜문학 맥락의 교육/훈련을 가리키므로 ‘교훈’이 내용과 톤을 함께 살립니다.
- source_word: בִּנְעֻרוֹתָי
  english_pob_choice: in my youth
  chosen_korean: 내 젊은 시절의
  alternatives_korean:
  - 내 청년 시절의
  - 젊었을 때의
  lexicon: HALOT
  rationale: וער not abstractly ‘청춘’보다 시간 구간을 드러내는 표현이 자연스러워 ‘젊은 시절의’로 옮겼습니다.
- source_word: וְכֶסֶף וְזָהָב
  english_pob_choice: silver and gold
  chosen_korean: 은과 금
  alternatives_korean:
  - 은돈과 금
  - 은과 황금
  lexicon: HALOT
  rationale: 본문의 구체적 금속 이미지를 그대로 보존하기 위해 통용되는 ‘은과 금’을 유지했습니다.
- source_word: בִּי
  english_pob_choice: by me / through me
  chosen_korean: 나를 통해
  alternatives_korean:
  - 나로 말미암아
  - 나를 통하여
  lexicon: HALOT
  rationale: 히브리어 전치사 בּ + 1인칭 접미는 수단/매개를 나타내므로, 문맥상 교훈이 부를 얻는 매개였다는 뜻을 가장 분명하게 드러내는 ‘나를 통해’를 선택했습니다.
theological_decisions:
- issue: 히브리어 본문은 서술문인데 그리스어 병행문은 명령형입니다
  chosen_reading: 주 본문은 히브리어의 서술문을 따라 번역하고, 명령형 뉘앙스는 본문이 아니라 대조 자료로만 보존합니다.
  alternative_readings:
  - 그리스어처럼 ‘교훈을 받으십시오, 많은 은과 함께…’로 옮기기
  - 본문을 명령형으로 재구성하지 않고 서술형을 유지하기
  rationale: 존재하는 히브리어 증거가 이 절에서는 서술문이므로, 본문은 히브리어를 우선하고 그리스어는 주해적 보조로만 취급하는 것이 사본 증거를 가장 충실하게 반영합니다.
  doctrine_reference: 'PHILOSOPHY.md: translate from Hebrew where it survives; use Greek parallel as actual input without displacing the more original extant witness.'
