base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/051/017.yaml
  text: In her I made progress, and I will give glory to the one who gives me wisdom[b][a].
  footnotes:
  - marker: a
    text: Hebrew witness is difficult here and differs notably from the Greek. The Cairo Geniza Hebrew reads approximately, 'It was honor for me ... and to my teacher(s) I will give thanks,' while the Greek reads, 'In her I made progress; to the one giving me wisdom I will give glory.'
    reason: textual_variant
  - marker: b
    text: Or 'I will give thanks' if following the Hebrew wording more closely.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 안에서 나는 진보했습니다. 그리고 나에게 지혜를 주시는 이에게 영광을 드리겠습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 전승은 이곳이 불분명하며, 그리스어는 ‘그 안에서 진보가 나에게 생겼다’는 뜻으로 읽힙니다.
    reason: textual_variant
  - marker: b
    text: 히브리어 쪽 의미를 더 따를 경우 ‘감사’로 옮길 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: προκοπὴ ἐγένετό μοι ἐν αὐτῇ
  english_pob_choice: In her I made progress
  chosen_korean: 그 안에서 나는 진보했습니다
  alternatives_korean:
  - 그녀 안에서 나는 진보했습니다
  - 그 안에서 나에게 전진이 있었습니다
  - 그 안에서 나는 발전했습니다
  lexicon: BDAG; HALOT
  rationale: 그리스어 병행문의 προκοπή/ἐν αὐτῇ를 따라 ‘진보했습니다’로 옮겨, 여성 대명사가 가리키는 지혜를 ‘그 안에서’라는 표현으로 살렸습니다.
- source_word: τῷ διδόντι μοι σοφίαν
  english_pob_choice: the one who gives me wisdom
  chosen_korean: 나에게 지혜를 주시는 이
  alternatives_korean:
  - 나에게 지혜를 주신 이
  - 나를 가르치시는 이
  - 나에게 지혜를 주는 분
  lexicon: BDAG
  rationale: 그리스어가 ‘지혜를 주는’ 단수 주체를 명시하므로, 히브리어의 ‘나의 스승들’ 가능성을 바로 풀지 않고 문맥상 자연스러운 현재형으로 옮겼습니다.
- source_word: δόξαν
  english_pob_choice: glory
  chosen_korean: 영광
  alternatives_korean:
  - 감사
  - 찬양
  - 존귀
  lexicon: BDAG
  rationale: 그리스어 δόξαν을 따라 ‘영광’을 유지하여, 감사 표현으로 완전히 평면화하지 않도록 했습니다.
theological_decisions:
- issue: 지혜를 주시는 이의 정체
  chosen_reading: 하나님을 가리킬 가능성을 열어 둔 채, 본문 자체는 ‘이’로 유지했습니다.
  alternative_readings:
  - 인간 스승 또는 스승들
  rationale: 지혜를 주는 단수 주체는 문맥상 하나님일 가능성이 크지만, 히브리어 전승은 ‘나의 스승들’ 쪽으로도 읽힐 수 있어 모호성을 보존했습니다.
  doctrine_reference: 본문의 전승 차이를 해소하기보다 유지합니다.
