theological_decisions:
- issue: 히브리어 본문과 그리스어 병행문의 처리
  chosen_reading: 히브리어 현존 본문을 मुख्य 본문으로 따르고, 그리스어의 ‘기도 중에 공개적으로 지혜를 구했다’는 차이는 본문 밖으로 넘기지 않았습니다.
  alternative_readings:
  - 그리스어를 따라 ‘젊었을 때, 내가 길을 벗어나기 전에, 나는 기도 중에 지혜를 구했다’로 옮김
  rationale: 이 단락은 히브리어가 보존된 경우 그 증거를 우선하는 편집 원칙에 따라, 서술의 중심을 ‘젊은 시절부터 지혜를 배운 사람’이라는 히브리어의 자기 증언으로 유지했습니다.
  doctrine_reference: 'PHILOSOPHY.md: Hebrew Sirach is translated from the Hebrew where it survives; parallel Greek is used as actual input but does not override the Hebrew witness.'
- issue: אֲדֹנָי의 한국어 호칭 처리
  chosen_reading: ‘주님’으로 옮겨 직접 호칭은 유지하되, 지나친 전통 문구인 ‘오 주여’는 쓰지 않았습니다.
  alternative_readings:
  - 오 주님
  - 주여
  rationale: 합쇼체 본문 안에서 직접 부름을 살리면서도, 현대 독자에게 자연스럽고 공적 낭독에 적합한 호칭으로 조정했습니다.
  doctrine_reference: Korean liturgical register guidance for modern formal-polite Bible style
