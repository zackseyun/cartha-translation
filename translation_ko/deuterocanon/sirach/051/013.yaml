base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/051/013.yaml
  text: I was young[a], and I loved wisdom; I desired her and sought her out. In faithfulness my foot walked; from my youth, O Lord[b], I learned wisdom.
  footnotes:
  - marker: a
    text: Hebrew 'In faithfulness'; alternatively, 'In truth my foot walked.'
    reason: lexical_alternative
  - marker: b
    text: 'The Greek parallel differs notably: ''While I was still young, before I went astray, I sought wisdom openly in my prayer.'' The main text follows the surviving Hebrew witness.'
    reason: alternative_reading
translation:
  language: ko
  text: 저는 젊었고, 지혜를 사랑했습니다. 저는 그녀를 갈망했고, 그녀를 찾아 구했습니다. 성실함 안에서 제 발이 걸었고, 제 젊은 시절부터, 주님, 저는 지혜를 배웠습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘성실함 안에서’; 다른 가능성으로는 ‘진리 안에서’가 있습니다.
    reason: lexical_alternative
  - marker: b
    text: '그리스어 평행문은 크게 다릅니다: ‘내가 아직 젊었을 때, 내가 길을 벗어나기 전에, 나는 내 기도 가운데 공개적으로 지혜를 구했습니다.’ 본문은 보존된 히브리어 증거를 따릅니다.'
    reason: alternative_reading
lexical_decisions:
- source_word: נַעַר
  english_pob_choice: young
  chosen_korean: 젊었고
  alternatives_korean:
  - 젊었습니다
  - 어렸고
  - 소년이었고
  lexicon: HALOT
  rationale: 첫 절의 자기 진술을 자연스러운 현대 한국어로 옮기되, 연령의 젊음을 분명히 살렸습니다.
- source_word: וָאוֹהַב חָכְמָה
  english_pob_choice: I loved wisdom
  chosen_korean: 지혜를 사랑했습니다
  alternatives_korean:
  - 지혜를 좋아했습니다
  - 지혜를 사랑하였습니다
  lexicon: HALOT
  rationale: חכמה를 사람처럼 대상화하는 문맥이므로 ‘사랑했습니다’가 POB의 ‘I loved wisdom’과 가장 가깝고 자연스럽습니다.
- source_word: וְחָפַצְתִּי בָהּ וּבִקַּשְׁתִיהָ
  english_pob_choice: I desired her and sought her out
  chosen_korean: 그녀를 갈망했고, 그녀를 찾아 구했습니다
  alternatives_korean:
  - 그녀를 원했고, 그녀를 찾았습니다
  - 그녀를 기뻐했고, 그녀를 찾았습니다
  lexicon: HALOT
  rationale: חפץ는 단순한 선호보다 강한 열망을 담으므로 ‘갈망하다’로, בקש의 적극성을 살리기 위해 ‘찾아 구하다’로 옮겼습니다.
- source_word: בַּאֲמִתָּהּ
  english_pob_choice: In faithfulness
  chosen_korean: 성실함 안에서
  alternatives_korean:
  - 진실함 안에서
  - 진리 안에서
  - 신실함 안에서
  lexicon: HALOT
  rationale: 문맥상 אמת는 추상적 ‘진리’보다 삶의 태도인 성실·신실의 뜻이 더 적절하므로, 한국어에서도 윤리적 지속성을 드러내는 표현을 택했습니다.
- source_word: דָּרְכָה רַגְלִי
  english_pob_choice: my foot walked
  chosen_korean: 제 발이 걸었고
  alternatives_korean:
  - 제 발이 걸어갔고
  - 제 발이 디뎠고
  - 제가 걸었고
  lexicon: HALOT
  rationale: 히브리어의 구체적 관용구를 살려 ‘제 발’ 주어를 유지했고, 한국어에서는 ‘걸었습니다’보다 ‘걸었고’가 앞뒤 절과의 연결이 자연스럽습니다.
- source_word: מִנְּעוּרַי
  english_pob_choice: from my youth
  chosen_korean: 제 젊은 시절부터
  alternatives_korean:
  - 제 어린 시절부터
  - 젊은 시절부터
  - 제 청년기부터
  lexicon: HALOT
  rationale: 시간의 시작점을 분명히 하는 표현으로, 본문 전체의 평생적 지혜 추구를 드러내는 자연스러운 한국어입니다.
- source_word: אֲדֹנָי
  english_pob_choice: O Lord
  chosen_korean: 주님
  alternatives_korean:
  - 오 주님
  - 주여
  lexicon: HALOT
  rationale: 직접 호칭이지만 합쇼체 서술 속에서는 한국어 기도체의 과장 없이 단정하게 ‘주님’으로 처리해도 문맥이 유지됩니다.
- source_word: לָמַדְתִּי
  english_pob_choice: I learned
  chosen_korean: 배웠습니다
  alternatives_korean:
  - 배웠습니다
  - 익혔습니다
  - 공부했습니다
  lexicon: HALOT
  rationale: 단순한 학문 행위보다 지혜를 체득한 의미가 있어 ‘배웠습니다’가 가장 넓고 자연스럽습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행문의 처리
  chosen_reading: 히브리어 현존 본문을 मुख्य 본문으로 따르고, 그리스어의 ‘기도 중에 공개적으로 지혜를 구했다’는 차이는 본문 밖으로 넘기지 않았습니다.
  alternative_readings:
  - 그리스어를 따라 ‘젊었을 때, 내가 길을 벗어나기 전에, 나는 기도 중에 지혜를 구했다’로 옮김
  rationale: 이 단락은 히브리어가 보존된 경우 그 증거를 우선하는 편집 원칙에 따라, 서술의 중심을 ‘젊은 시절부터 지혜를 배운 사람’이라는 히브리어의 자기 증언으로 유지했습니다.
  doctrine_reference: 'PHILOSOPHY.md: Hebrew Sirach is translated from the Hebrew where it survives; parallel Greek is used as actual input but does not override the Hebrew witness.'
- issue: אֲדֹנָי의 한국어 호칭 처리
  chosen_reading: ‘주님’으로 옮겨 직접 호칭은 유지하되, 지나친 전통 문구인 ‘오 주여’는 쓰지 않았습니다.
  alternative_readings:
  - 오 주님
  - 주여
  rationale: 합쇼체 본문 안에서 직접 부름을 살리면서도, 현대 독자에게 자연스럽고 공적 낭독에 적합한 호칭으로 조정했습니다.
  doctrine_reference: Korean liturgical register guidance for modern formal-polite Bible style
