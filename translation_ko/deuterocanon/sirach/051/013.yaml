- source_word: וְחָפַצְתִּי בָהּ וּבִקַּשְׁתִיהָ
  english_pob_choice: I desired her and sought her out
  chosen_korean: 그녀를 갈망했고, 그녀를 찾아 구했습니다
  alternatives_korean:
