base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/051/006.yaml
  text: My soul came near to death[b][a], and my life to the depths of Sheol.
  footnotes:
  - marker: a
    text: Or 'my soul touched death.' The Hebrew verb is literally 'touched/reached,' but here likely means 'came near,' as reflected by the Greek parallel 'drew near to death.'
    reason: lexical_alternative
  - marker: b
    text: '''Sheol'' is the Hebrew term for the realm of the dead; the Greek parallel has ''Hades below.'''
    reason: alternative_reading
translation:
  language: ko
  text: 제 영혼이 죽음에 가까이 이르렀고[a], 제 생명은 스올의 깊은 곳에 이르렀습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘제 영혼이 죽음에 닿았다’ 또는 ‘죽음을 만졌다.’ 히브리어 동사는 문자적으로 ‘닿다/만지다’를 뜻하지만, 여기서는 ‘죽음에 가까이 이르다’라는 뜻으로 이해하는 것이 자연스럽습니다. 그리스어 병행본문도 ‘죽음에 가까이 왔다’고 합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘스올’은 죽은 자들의 영역을 가리키는 히브리어 용어입니다. 그리스어 병행본문은 ‘아래의 하데스’라고 합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּגַּע לַמָּוֶת
  english_pob_choice: came near to death
  chosen_korean: 죽음에까지 이르고
  alternatives_korean:
  - 죽음을 만지고
  - 죽음에 닿고
  - 죽음에 가까이 가고
  lexicon: HALOT
  rationale: נגע는 문자적으로는 ‘닿다/만지다’이지만, כאן은 ‘죽음’과 결합해 실제 접촉보다 임박함을 나타내므로, 자연스러운 합쇼체로 ‘죽음에까지 이르다’가 의미를 가장 잘 살립니다.
- source_word: נַפְשִׁי
  english_pob_choice: my soul
  chosen_korean: 제 영혼
  alternatives_korean:
  - 제 생명
  - 제 자신
  lexicon: HALOT
  rationale: 첫 절의 נַפְשִׁי는 뒤의 חַיָּתִי와 평행을 이루므로, 둘을 같은 말로 평준화하지 않고 ‘영혼’으로 옮겨 시적 대구를 보존했습니다.
- source_word: חַיָּתִי
  english_pob_choice: my life
  chosen_korean: 제 생명
  alternatives_korean:
  - 제 삶
  - 제 살아 있는 존재
  lexicon: HALOT
  rationale: חַיָּתִי는 생명력/생명을 가리키며, 한국어에서는 ‘제 생명’이 가장 간결하고 시적 평행도 자연스럽게 드러냅니다.
- source_word: לִשְׁאוֹל תַּחְתִּיּוֹת
  english_pob_choice: to the depths of Sheol
  chosen_korean: 스올의 깊은 곳에
  alternatives_korean:
  - 음부의 깊은 곳에
  - 죽은 자들의 세계의 깊은 곳에
  - 무덤의 깊은 곳에
  lexicon: HALOT
  rationale: שְׁאוֹל은 본문 세계의 히브리 개념을 살려 음역한 ‘스올’로 두고, תַּחְתִּיּוֹת는 ‘깊은 곳’으로 옮겨 ‘스올의 깊은 곳’이라는 압축된 표현을 유지했습니다.
theological_decisions:
- issue: שְׁאוֹל의 번역 방식
  chosen_reading: 히브리어 고유 개념을 살려 ‘스올’로 음역합니다.
  alternative_readings:
  - 음부
  - 무덤
  - 저승
  rationale: 이 절은 히브리 본문이 분명하므로, 그리스어 병행본문의 ᾅδης를 곧바로 대체하기보다 히브리어 세계관을 드러내는 ‘스올’을 유지하는 편이 원문 충실도가 높습니다.
  doctrine_reference: original-language primacy over translation tradition
