base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/051/010.yaml
  text: 'And I will exalt you: O Yahweh[a], you are my Father, for you are the mighty one of my salvation. Do not let me grow weak in the day of distress[b], in the day of ruin and desolation.'
  footnotes:
  - marker: a
    text: 'Greek: ''I called upon the Lord, the father of my lord.'' The Hebrew reads, ''O LORD, you are my Father.'''
    reason: alternative_reading
  - marker: b
    text: Greek has 'do not abandon me in days of affliction,' while the Hebrew reads more literally, 'do not let me fall slack' or 'do not let me grow weak.'
    reason: lexical_alternative
translation:
  language: ko
  text: 제가 주님을 높이겠습니다. 「야훼여, 당신은 제 아버지이십니다. 당신은 제 구원의 용사이시기 때문입니다.」 저를 무기력해지지 않게 하소서. 환난의 날, 파멸과 황폐의 날에.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 「야훼여, 당신은 제 아버지이십니다」라고 읽습니다. 그리스어는 「제가 주님을 불렀습니다. 제 주님의 아버지여」로 다릅니다.
    reason: alternative_reading
  - marker: b
    text: 그리스어는 「고난의 날에 저를 버리지 마소서」에 가깝지만, 히브리어는 더 문자적으로 「저를 무기력하게 하지 마소서」라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲרוֹמֵם
  english_pob_choice: And I will exalt you
  chosen_korean: 제가 주님을 높이겠습니다
  alternatives_korean:
  - 제가 당신을 찬양하겠습니다
  - 제가 당신을 높이겠습니다
  lexicon: HALOT
  rationale: רומם의 ‘높이다/존귀하게 하다’ 뜻을 살리면서, 한국어에서는 예배적 자연스러움이 있는 ‘높이다’로 옮겼습니다. 청유가 아니라 서원형 선언이므로 미래형으로 처리했습니다.
- source_word: יְהֹוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: HALOT
  rationale: POB 기본 용례에 따라 신적 고유명사를 음역한 ‘야훼’를 유지했습니다. 본문에서 하나님 호칭과 구별되는 직접 호명으로 드러내기 위함입니다.
- source_word: גִּבּוֹר יִשְׁעִי
  english_pob_choice: the mighty one of my salvation
  chosen_korean: 제 구원의 용사이시기 때문입니다
  alternatives_korean:
  - 제 구원의 능력이시기 때문입니다
  - 제 구원의 강한 분이시기 때문입니다
  lexicon: HALOT
  rationale: גִּבּוֹר은 단순한 ‘힘센’ 형용사보다 명사적 ‘용사/능력자’ 뉘앙스가 강해 한국어에서도 명사형으로 살렸습니다. יִשְׁעִי는 ‘구원’으로 두어 구속적 의미를 유지했습니다.
- source_word: אַל תַּרְפֵּנִי
  english_pob_choice: Do not let me grow weak
  chosen_korean: 저를 무기력해지지 않게 하소서
  alternatives_korean:
  - 저를 약해지지 않게 하소서
  - 저를 놓지 말아 주소서
  lexicon: HALOT
  rationale: 히브리어 רפה의 핵심은 ‘풀어지다, 느슨해지다, 약해지다’이므로 영어의 abandonment보다 약화 이미지를 따랐습니다. 현대 한국어에서는 ‘무기력해지다’가 그 slackening을 자연스럽게 전달합니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 평행본문의 호칭 차이
  chosen_reading: 본문은 히브리어의 직접 호명인 「야훼여, 당신은 제 아버지이십니다」를 따랐습니다.
  alternative_readings:
  - 그리스어의 「주님을 불렀습니다. 제 주님의 아버지여」
  rationale: 시락서는 히브리어가 보존된 경우 이를 우선하는 POB 원칙을 따랐습니다. 그리스어는 중요한 대조 증거이므로 본문에 흡수하지 않고 해석 차이로 남겨 두는 것이 더 투명합니다.
  doctrine_reference: 'Sirach translation policy: Hebrew priority where extant; preserve significant Greek divergences in notes'
- issue: אַל תַּרְפֵּנִי의 의미
  chosen_reading: ‘버리지 마소서’보다 ‘무기력해지지 않게 하소서’로 옮겨 히브리어의 slackening 이미지를 살렸습니다.
  alternative_readings:
  - 저를 버리지 마소서
  - 저를 떠나지 마소서
  rationale: 그리스어 ἐγκαταλιπεῖν의 ‘버리다/떠나다’는 의미는 의미 있는 대안이지만, मुख्य 본문은 살아 있는 히브리어 동사 רפה를 반영해야 합니다. 이를 통해 본문의 긴박한 힘 빠짐의 이미지를 보존합니다.
  doctrine_reference: original-language primacy; preserve lexical tension rather than harmonize
