translation:
  language: ko
  text: 저는 제 길을 더 낫게 하려고 마음먹었고, 되돌아서지 않겠습니다. 그것을 찾을 것이기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 “내가 그것을 하기로 결심했고, 선한 것을 열심히 추구했으며, 결코 부끄러워하지 않을 것이다”로 읽습니다. 이는 현존 히브리어와 상당히 다른 본문 형태입니다.
    reason: textual_variant
lexical_decisions:
- source_word: חָשַׁבְתִּי
  english_pob_choice: I planned
  chosen_korean: 생각했으며
  alternatives_korean:
  - 계획했으며
  - 결심했으며
  - 생각하였고
  lexicon: HALOT
  rationale: 이 동사는 단순한 사색보다 의도적인 마음먹음을 나타내므로, 문맥상 결심의 뉘앙스를 살리되 한국어에서는 자연스러운 합쇼체로 ‘생각했으며’라고 옮겼습니다.
- source_word: לְהִיטֶיב [דַּרְכִּי]
  english_pob_choice: to improve my way
  chosen_korean: 내 길을 더 좋게
  alternatives_korean:
  - 내 길을 고치려
  - 내 행실을 바로잡으려
  - 내 길을 개선하려
  lexicon: HALOT
  rationale: 히브리어 ‘좋게 하다/개선하다’는 대상이 ‘내 길’이므로, 도덕적 삶의 방향을 자연스럽게 드러내는 ‘더 좋게’로 옮겼습니다.
- source_word: וְלֹא אַהֲפֹךְ
  english_pob_choice: and I will not turn back
  chosen_korean: 돌이키지 않으리니
  alternatives_korean:
  - 되돌아가지 않으리니
  - 돌아서지 않으리니
  - 방향을 바꾸지 않으리니
  lexicon: HALOT
  rationale: 본문의 קשה한 동사는 여기서 선택한 길을 거슬러 되돌아가지 않겠다는 뜻으로 이해하는 것이 가장 자연스러워 ‘돌이키지 않다’로 옮겼습니다.
- source_word: כִּי אֶמְצָאֶנּוּ
  english_pob_choice: for I will find it
  chosen_korean: 그것을 찾을 것이기 때문입니다
  alternatives_korean:
  - 그것을 얻게 될 것이기 때문입니다
  - 그것을 발견할 것이기 때문입니다
  - 그를 찾을 것이기 때문입니다
  lexicon: HALOT
  rationale: מצא는 ‘찾다/얻다’의 뜻이 있으나, 앞선 ‘내 길’을 바로잡는 문맥에서 대상은 지혜 또는 선한 삶의 성취로 읽히므로 중성적 ‘그것’을 유지했습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행문의 결말 차이
  chosen_reading: 히브리어 본문을 따라 ‘돌이키지 않으리니 그것을 찾을 것이기 때문입니다’로 번역했습니다.
  alternative_readings:
  - '그리스어 전통: ‘선을 열심히 추구했고, 결코 부끄러워하지 않을 것이다’'
  rationale: 집회서에서는 현존 히브리어가 있을 때 그것을 우선하되, 그리스어 전통의 의미 차이는 각주로 투명하게 남기는 것이 본 프로젝트 원칙에 맞습니다.
  doctrine_reference: 'PHILOSOPHY.md: Hebrew-primary with transparent Greek parallel for Sirach where witness diverges.'
