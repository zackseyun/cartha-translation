  text: I prayed for her in my youth[a], and I found much knowledge.
  footnotes:
  - marker: a
    text: 'Greek parallel: ''Before the temple I asked for her, and to the end I will seek her.'' The Hebrew witness instead reads, ''I prayed in my youth, and I found much knowledge.'''
    reason: alternative_reading
translation:
  language: ko
  text: 저는 젊은 시절에 기도했고, 많은 지식을 얻었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 평행본문은 “성전 앞에서 나는 그녀를 얻기를 청했고, 끝까지 그녀를 찾겠습니다”라고 읽습니다. 히브리어 증거는 여기서 “저는 젊은 시절에 기도했고, 많은 지식을 얻었습니다”라고 읽습니다.
    reason: textual_variant
lexical_decisions:
- source_word: וָאֶתְפַּלֵּל תְּפִלָּה
  english_pob_choice: I prayed
  chosen_korean: 기도드렸고
  alternatives_korean:
  - 기도했고
  - 기도를 드렸고
  - 기도하였고
  lexicon: HALOT
  rationale: 히브리어의 동사-목적어 결합(‘기도하다 기도’)을 한국어에서는 자연스럽게 압축해 ‘기도드리다’로 옮기되, 서술의 힘은 유지했습니다.
- source_word: בִּנְעֻרוֹתָי
  english_pob_choice: in my youth
  chosen_korean: 젊은 시절에
  alternatives_korean:
  - 내 젊은 때에
  - 내 청년 시절에
  - 젊었을 때에
  lexicon: HALOT
  rationale: 청년기라는 시간대를 가리키므로, 현대 한국어에서 가장 자연스러운 시간 표현인 ‘젊은 시절’로 옮겼습니다.
- source_word: הַרְבֵּה
  english_pob_choice: much
  chosen_korean: 많은
  alternatives_korean:
  - 풍성한
  - 크게
  - 충분한
  lexicon: HALOT
  rationale: 뒤따르는 ‘지혜’와의 결합에서는 양적 풍성함을 드러내는 ‘많은’이 가장 सीधे하고, 과도한 해석을 덧붙이지 않습니다.
- source_word: דֵעָה
  english_pob_choice: knowledge
  chosen_korean: 지혜
  alternatives_korean:
  - 지식
  - 앎
  - 이해
  lexicon: HALOT
  rationale: 히브리어 표면형은 ‘지식/앎’이지만, 본문 전체의 지혜문학적 문맥과 그리스어 평행본문이 지혜를 가리키는 점을 반영해 POB의 ‘knowledge’에 대응되는 더 넓은 지혜 어휘로 옮겼습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 평행본문의 긴장
  chosen_reading: 본문은 히브리어의 ‘젊은 시절에 기도했고, 많은 지혜를 얻었다’를 본문으로 유지하되, 그리스어가 암시하는 지혜 추구의 긴장은 본절의 지혜문맥 안에서 간접적으로만 반영했습니다.
  alternative_readings:
  - 나는 젊은 시절에 그 여인을 위해 기도했습니다.
  - 성전 앞에서 그녀를 구했으며, 끝까지 그녀를 찾겠습니다.
  rationale: 히브리어 증거가 명백히 살아 있으므로 그 구조를 우선해야 합니다. 다만 이 장의 문맥은 지혜를 찾는 기도이므로, 그리스어의 보다 명시적인 대상어를 본문에 강제로 넣기보다 히브리어 중심 번역을 유지하는 편이 증거 균형에 맞습니다.
  doctrine_reference: 'PHILOSOPHY.md: 살아 있는 히브리어 본문을 우선하되 평행본문의 긴장은 보존한다.'
