translation:
  language: ko
  text: 언제까지 여러분은 이것저것이 부족하겠습니까? 여러분의 영혼은 몹시 목마를 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘언제까지 너희는 이것들과 이것들에서 부족할 것이며, 너희의 영혼은 매우 목마를 것이다’입니다. ‘이것들과 이것들’은 문맥상 정확한 지시 대상이 분명하지 않은 반복 표현입니다. 그리스어 평행문은 ‘너희가 이것들 안에서 부족하다고 말하면서, 너희의 영혼들이 몹시 목마르다’라고 읽습니다. 본문은 히브리어를 우선하여 ‘말하다’를 본문에 넣지 않았습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: עַד מָתַי
  english_pob_choice: How long
  chosen_korean: 언제까지
  alternatives_korean:
  - 얼마나 더
  - 언제까지나
  lexicon: HALOT
  rationale: 시간적 책망의 물음으로 쓰인 관용구이므로, 현대 한국어에서도 자연스럽고 압박감을 살리는 ‘언제까지’로 옮겼습니다.
- source_word: תַחְסְרוּן מִן אֵלּוּ וְאֵלּוּ
  english_pob_choice: will you lack these things
  chosen_korean: 이리저리 이것저것에서 부족하다고 하시렵니까
  alternatives_korean:
  - 이것저것에서 계속 부족하십니까
  - 이것저것이 모자라십니까
  lexicon: HALOT
  rationale: חסר는 단순한 결핍보다 ‘부족함/모자람’의 상태를 나타내므로, ‘부족하다’로 의미를 살렸고, מִן אֵלּוּ וְאֵלּוּ의 다소 어색한 반복은 본문의 분산된 결핍감을 드러내는 표현으로 풀었습니다.
- source_word: וְנַפְשְׁכֶם
  english_pob_choice: your soul
  chosen_korean: 여러분의 영혼
  alternatives_korean:
  - 여러분의 생명
  - 여러분 자신
  lexicon: HALOT
  rationale: נפש는 생명/자기 자신도 뜻하지만, 여기서는 ‘목마르다’와 결합한 내적 갈망의 주체이므로 한국어 성경 문체에 맞는 ‘영혼’이 가장 직접적입니다.
- source_word: צְמֵאָה מְאֹד תִּהְיֶה
  english_pob_choice: is very thirsty
  chosen_korean: 매우 목마를 것입니다
  alternatives_korean:
  - 몹시 목마를 것입니다
  - 극도로 목마를 것입니다
  lexicon: HALOT
  rationale: 히브리어 미래형을 따라 ‘목마를 것입니다’로 옮기되, מְאֹד의 강도를 ‘매우’로 보존했습니다.
theological_decisions:
- issue: נפש의 인류학적 뉘앙스
  chosen_reading: ‘영혼’으로 유지하여 내적 갈망과 결핍의 감각을 살렸습니다.
  alternative_readings:
  - 생명
  - 자신
  rationale: 지혜문학의 책망 문맥에서 단순 생리적 갈증이 아니라 존재론적 갈망을 드러내므로, 독자의 감각을 평탄화하지 않는 번역이 적절합니다.
  doctrine_reference: '번역 원칙 §4: 소스의 긴장과 무게를 유지하고, 관용적 의미를 지나치게 축소하지 않습니다.'
