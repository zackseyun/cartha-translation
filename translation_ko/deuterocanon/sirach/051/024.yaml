  yaml_path: translation/deuterocanon/sirach/051/024.yaml
  text: How long will you lack these things[a], while your soul is very thirsty?
  footnotes:
  - marker: a
    text: 'Hebrew: ''How long will you lack from these and these, and your soul will be very thirsty?'' The Greek parallel reads more idiomatically, ''How long do you say that you are lacking in these things, while your souls thirst greatly?'' The main text follows the Hebrew as primary while using the Greek to clarify the sense.'
