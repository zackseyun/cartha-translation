translation:
  language: ko
  text: 주께서는 저의 비틀거림을 노리는 자들의 올무에서, 또 제 목숨을 찾는 자들의 손에서 저를 건져 주셨습니다. 많은 환난에서 저를 구원하셨고, 사방에 이는 불의 고통에서도 저를 구해 주셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘비틀거림’은 ‘넘어짐’이나 ‘절뚝거림’으로도 옮길 수 있는 관용적 표현입니다. 히브리어는 다소 불확실합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘사방에 이는 불의 고통’이라고 읽히며, 이 지점의 그리스어 병행본은 상당히 다르게 전개됩니다.
    reason: textual_variant
lexical_decisions:
- source_word: מִמּוֹקֵשׁ / צוֹפֵי צַלְעִי
  english_pob_choice: from the snare of those watching for my stumbling
  chosen_korean: 저의 비틀거림을 노리는 자들의 올무에서
  alternatives_korean:
  - 저의 넘어짐을 노리는 자들의 올무에서
  - 저의 절뚝거림을 엿보는 자들의 올무에서
  lexicon: HALOT
  rationale: צוֹפֵי צַלְעִי의 감시·대기 이미지를 살리되, 한국어에서는 ‘비틀거림’을 택해 함정에 빠뜨리려는 적대적 대기를 자연스럽게 전달했습니다.
- source_word: וּמִּיַד מְבַקְשֵׁי נַפְשִׁי
  english_pob_choice: and from the hand of those seeking my life
  chosen_korean: 또 제 목숨을 찾는 자들의 손에서
  alternatives_korean:
  - 또 제 생명을 찾는 자들의 손에서
  - 또 제 영혼을 찾는 자들의 손에서
  lexicon: HALOT
  rationale: נפשׁ는 이 문맥에서 ‘영혼’보다 ‘목숨/생명’이 맞으므로, 위협의 관용구를 보존하면서도 한국어에서 직접적으로 들리게 했습니다.
- source_word: מֵרַבּוֹת צָרוֹת
  english_pob_choice: from many troubles
  chosen_korean: 많은 환난에서
  alternatives_korean:
  - 많은 고난에서
  - 큰 환난에서
  lexicon: HALOT
  rationale: רַבּוֹת를 수량감 있는 ‘많은’으로 옮기고, צָרוֹת는 시적·종교적 맥락에 맞는 ‘환난’으로 번역했습니다.
- source_word: וּמִמְּצוּקוֹת שַׁלְהֶבֶת מִסָּבִיב
  english_pob_choice: and from the distress of a flame all around
  chosen_korean: 사방에 이는 불의 고통에서도
  alternatives_korean:
  - 사방에 이는 불길의 환난에서도
  - 둘레를 에운 불의 압박에서도
  lexicon: HALOT
  rationale: 미묘하게 불확실한 히브리어 결합을 한국어에서 과잉 해석하지 않기 위해, 불의 이미지와 압박/고통을 함께 살리는 표현으로 옮겼습니다.
theological_decisions:
- issue: ‘seek my life’의 신학적·문법적 의미
  chosen_reading: 제 목숨을 찾는 자들
  alternative_readings:
  - 제 영혼을 찾는 자들
  - 저를 죽이려는 자들
  rationale: 원문의 נפשׁ는 여기서 존재론적 ‘영혼’이 아니라 생명에 대한 위협을 뜻하므로, 의미를 직역하는 대신 관용적 한국어로 보존했습니다.
  doctrine_reference: 원문 의미 보존과 불필요한 영혼론 유입 방지
- issue: 마지막 절의 ‘불’ 이미지
  chosen_reading: 사방에 이는 불의 고통
  alternative_readings:
  - 사방의 불길
  - 사방으로 둘러싼 불의 환난
  rationale: 히브리어는 문자적 불길과 비유적 압박을 모두 열어 두므로, 그 긴장을 풀어 버리지 않고 불의 이미지와 고통을 함께 남겼습니다.
  doctrine_reference: 원문 긴장 보존, 번역 전통의 과도한 해석 회피
