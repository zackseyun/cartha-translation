base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/051/030.yaml
  text: Do your work in righteousness[a], and he will give you your reward in its time. Blessed is Yahweh forever, and praised is his name from generation to generation.
  footnotes:
  - marker: a
    text: Or 'in due time' or 'at his time'; the Hebrew בְּעִתּוֹ and Greek ἐν καιρῷ αὐτοῦ can be understood as the proper time for the reward, and some hear the pronoun as referring to God rather than to the reward.
    reason: lexical_alternative
translation:
  language: ko
  text: 여러분은 일을 의로이 하십시오[a]. 그러면 그분께서 때가 되면 여러분의 상을 주실 것입니다. 영원히 야훼는 복되시며, 그의 이름은 대대로 찬양받으십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘정한 때에’ ‘그의 때에’로도 옮길 수 있습니다. 히브리어 בְּעִתּוֹ와 그리스어 ἐν καιρῷ αὐτοῦ는 상을 받을 적절한 때를 가리키며, 그 ‘때’가 상의 때인지 하나님 자신의 때인지도 문맥상 다르게 들릴 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַעֲשֵׂיכֶם עֲשׂוּ / ἐργάξεσθε τὸ ἔργον ὑμῶν
  english_pob_choice: Do your work
  chosen_korean: 일을 하십시오
  alternatives_korean:
  - 행위를 하십시오
  - 일을 행하십시오
  - 여러분의 일을 하십시오
  lexicon: HALOT; LXX parallel ἐργάξεσθε τὸ ἔργον ὑμῶν
  rationale: 히브리어의 명령형과 명사구가 실제 행동을 촉구하는 관용 표현이므로, 자연스러운 현대 한국어로 압축해 ‘일을 하십시오’로 옮겼습니다.
- source_word: בִצְדָקָה
  english_pob_choice: in righteousness
  chosen_korean: 의로이
  alternatives_korean:
  - 의 안에서
  - 의롭게
  - 정의롭게
  lexicon: HALOT
  rationale: ב + צְדָקָה는 행위의 방식과 상태를 나타내므로, 핵심 용어 ‘의’를 살리면서도 한국어 부사형으로 자연스럽게 표현했습니다.
- source_word: שְׂכַרְכֶם / μισθὸν ὑμῶν
  english_pob_choice: your reward
  chosen_korean: 여러분의 상
  alternatives_korean:
  - 여러분의 보상
  - 여러분의 삯
  - 여러분의 보수
  lexicon: HALOT; LSJ
  rationale: שכר와 μισθός는 ‘삯’도 가능하지만, 지혜문학의 맥락과 하나님의 주시는 응답을 살려 ‘상’으로 옮기는 것이 가장 자연스럽고 문맥에 맞습니다.
- source_word: בְּעִתּוֹ / ἐν καιρῷ αὐτοῦ
  english_pob_choice: in its time
  chosen_korean: 때가 되면
  alternatives_korean:
  - 적절한 때에
  - 그때에
  - 정한 때에
  lexicon: HALOT; LSJ
  rationale: 히브리어와 그리스어 모두 ‘정해진/알맞은 때’를 뜻할 수 있어, 본문이 말하는 적절한 시점을 한국어로 간결하게 드러냈습니다.
- source_word: יְהֹוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: SBLGNT/LXX alignment; project glossary
  rationale: 여기서는 신약 인용이 아니라 히브리어 본문의 직접 표기이므로, 프로젝트 기본 원칙에 따라 신명기 이름을 ‘야훼’로 옮겼습니다.
- source_word: מְשֻׁבָּח
  english_pob_choice: praised
  chosen_korean: 찬양받으십니다
  alternatives_korean:
  - 찬양받습니다
  - 칭송받으십니다
  - 찬미받으십니다
  lexicon: HALOT
  rationale: 수동 분사형의 지속적 찬양을 한국어에서 가장 자연스럽게 드러내기 위해 ‘찬양받으십니다’로 옮겼습니다.
theological_decisions:
- issue: 인칭 대명사와 축복 형식의 종결 방식
  chosen_reading: 마지막 두 행을 선언적 축복으로 처리하고, ‘야훼는 복되시며’처럼 경건한 도치 구조를 유지했습니다.
  alternative_readings:
  - ‘야훼를 영원히 찬송합니다’처럼 기원형으로 옮기는 방식
  - ‘복되신 야훼’로 형용사구화하는 방식
  rationale: 본문은 축복 선언과 찬양의 병행문으로 끝나므로, 한국어에서도 선언형을 유지해야 시편적/지혜문학적 doxology의 힘이 살아납니다.
  doctrine_reference: Sirach 51:30 doxological closing parallelism
- issue: 성호(이름)와 찬양의 지속성
  chosen_reading: ‘그의 이름은 대대로 찬양받으십니다’로 옮겨 세대 간 지속적 찬양을 나타냈습니다.
  alternative_readings:
  - ‘대대로 그의 이름이 찬양을 받습니다’
  - ‘세세대대로 그의 이름을 찬양합니다’
  rationale: לְדֹר וָדֹר는 관용적으로 ‘대대로/세세대대로’의 지속성을 뜻하므로, 시간의 연속성과 피동적 찬양을 함께 살렸습니다.
  doctrine_reference: Poetic parallelism in Sirach 51:30
