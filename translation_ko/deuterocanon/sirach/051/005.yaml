  text: from lips of wickedness and from those who smear lies[a], and from the arrows of a deceitful tongue.
  footnotes:
  - marker: a
    text: The Greek parallel reads, 'from an unclean tongue and a false word,' rather than 'from lips of wickedness ... and the arrows of a deceitful tongue.' Since Hebrew survives for this verse, the main text follows the Hebrew witness; the Greek is preserved here because the difference is substantial.
    reason: alternative_reading
translation:
  language: ko
  text: 악한 입술과 거짓을 바르는 자들, 그리고 속이는 혀의 화살에서입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 평행본은 ‘더러운 혀와 거짓된 말’로 읽습니다. 현존 히브리어가 이 절의 주된 증거이므로 주본문은 히브리어를 따랐습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: מִשִׂפְתֵי זִמָּה
  english_pob_choice: from lips of wickedness
  chosen_korean: 악한 입술에서
  alternatives_korean:
  - 악의 입술에서
  - 패역한 입술에서
  - 사악한 입술에서
  lexicon: HALOT
  rationale: מִן+שִׂפְתֵי는 출처를 나타내는 ‘~에서’로 살리고, זִמָּה는 문맥상 성적 의미보다 도덕적 악을 가리키므로 ‘악한’으로 옮겼습니다.
- source_word: וְטֹפְלֵי שֶׁקֶר
  english_pob_choice: and from those who smear lies
  chosen_korean: 거짓을 바르는 자들
  alternatives_korean:
  - 거짓을 붙이는 자들
  - 거짓을 꾸며내는 자들
  - 거짓을 덧바르는 자들
  lexicon: HALOT
  rationale: טפל의 ‘바르다/칠하다’라는 비유를 살려, 거짓을 만들어 퍼뜨리는 사람들을 한국어에서도 이미지가 살아 있는 표현으로 옮겼습니다.
- source_word: וְחִצֵּי לְשוֹן מִרְמָה
  english_pob_choice: and from the arrows of a deceitful tongue
  chosen_korean: 그리고 속이는 혀의 화살에서
  alternatives_korean:
  - 그리고 속임수의 혀가 쏘는 화살에서
  - 그리고 속이는 혀가 쏘는 화살에서
  - 그리고 거짓된 혀의 화살에서
  lexicon: HALOT
  rationale: ‘혀’와 ‘화살’의 시적 병치를 유지하고, מִרְמָה는 형용사적으로 기능하므로 자연스러운 한국어 어순으로 ‘속이는 혀’라고 옮겼습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 평행본의 차이
  chosen_reading: 주본문은 현존 히브리어 본문을 따르고, 그리스어의 ‘더러운 혀’와 ‘거짓된 말’은 각주로 보존합니다.
  alternative_readings:
  - 그리스어를 따라 ‘더러운 혀와 거짓된 말’로 옮김
  - 두 본문을 절충하여 혼합 번역
  rationale: 집회서 51:5는 히브리어가 남아 있는 본문이므로, POB의 주본문은 히브리어를 따르되 그리스어 차이는 훼손하지 않고 기록하는 편이 원문 증거에 가장 충실합니다.
  doctrine_reference: 본문 비평 및 사본 증거 우선 원칙
- issue: 전치사 반복의 생략 여부
  chosen_reading: ‘from’의 반복을 한국어에서도 두드러지게 드러내기보다 시적 열거로 자연화했습니다.
  alternative_readings:
  - 모든 항목마다 ‘~에서’를 반복
  - 첫 항목만 ‘~에서’로 두고 나머지는 생략
  rationale: 히브리어는 연쇄 구조로 위험의 출처를 묶고 있으므로, 한국어에서는 중복을 줄이되 ‘에서’와 ‘그리고’를 통해 흐름을 보존했습니다.
  doctrine_reference: 히브리어 시가의 평행법과 한국어 운율
