  to: 악한 입술에서와 거짓을 꾸며 내는 자들에게서, 또 속이는 혀의 화살에서입니다.[a]
  rationale: 히브리어의 첫 전치사 מִן이 열거 전체에 미치는 구조를 한국어 조사로 명확히 드러냈습니다. טפל의 비유를 문자적으로 재현한 표현은 현대 한국어에서 불투명하므로, 거짓을 조작하거나 만들어 내는 행위라는 문맥상 핵심 의미를 ‘거짓을 꾸며 내는 자들’로 옮겼습니다. 그리스어 평행본의 대폭 다른 읽기와 앞 절과의 연결은 각주에 보존했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T19:30:21Z'
