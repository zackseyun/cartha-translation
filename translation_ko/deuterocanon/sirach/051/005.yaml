    text: The Greek parallel reads, 'from an unclean tongue and a false word,' rather than 'from lips of wickedness ... and the arrows of a deceitful tongue.' Since Hebrew survives for this verse, the main text follows the Hebrew witness; the Greek is preserved here because the difference is substantial.
