translation:
  language: ko
  text: 내 속이 그녀를 바라보는 동안 오븐처럼 타올랐습니다. 그러므로 나는 그녀를 버리지 않겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 ‘그러므로 나는 좋은 소유를 얻었습니다’라고 읽습니다.
    reason: textual_variant
lexical_decisions:
- source_word: מֵעַי
  english_pob_choice: my inward parts
  chosen_korean: 내 속이
  alternatives_korean:
  - 내 내장
  - 내 배
  - 내 중심
  lexicon: HALOT
  rationale: מֵעַי는 문자적으로 내장/창자를 가리키지만, 여기서는 강한 내적 감정을 드러내는 관용 표현이므로 한국어에서는 자연스럽고 직역에 가까운 ‘내 속이’로 옮겼습니다.
- source_word: יֵחַמּוּ
  english_pob_choice: burned
  chosen_korean: 타올랐습니다
  alternatives_korean:
  - 불탔습니다
  - 달아올랐습니다
  - 뜨거워졌습니다
  lexicon: HALOT
  rationale: ‘오븐처럼’과 결합된 열의 이미지를 살리기 위해 단순한 감정 표현보다 강한 ‘타오르다’를 선택했습니다.
- source_word: כַּתַּנּוּר
  english_pob_choice: like an oven
  chosen_korean: 오븐처럼
  alternatives_korean:
  - 화덕처럼
  - 화로처럼
  - 가마처럼
  lexicon: HALOT
  rationale: תנור는 일반적인 ‘oven’이므로 가장 직접적인 현대어 표현인 ‘오븐’으로 옮겼습니다.
- source_word: לְהַבִּיט בָּהּ
  english_pob_choice: as I looked toward her
  chosen_korean: 그녀를 바라보는 동안
  alternatives_korean:
  - 그녀를 바라볼 때
  - 그녀를 바라보며
  - 그녀를 보면서
  lexicon: HALOT
  rationale: 히브리어의 ‘~하는 동안’이라는 진행 배경을 살리면서, ב의 방향성을 한국어 동사 ‘바라보다’에 자연스럽게 담았습니다.
- source_word: לֹא אֶעֶזְבֶנָּה
  english_pob_choice: I will not forsake her
  chosen_korean: 나는 그녀를 버리지 않겠습니다
  alternatives_korean:
  - 나는 그녀를 떠나지 않겠습니다
  - 나는 그녀를 저버리지 않겠습니다
  - 나는 그녀를 버리지 않을 것입니다
  lexicon: HALOT
  rationale: עזב는 ‘떠나다/버리다/저버리다’의 범위를 가지며, 맥락상 지혜를 향한 지속적 충실함을 표현하므로 현대 한국어에서 가장 직접적인 ‘버리다’를 선택했습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행본의 마지막 절구 차이
  chosen_reading: 주 본문은 히브리어의 ‘그러므로 나는 그녀를 버리지 않겠습니다’를 따르고, 그리스어의 다른 읽기는 각주로 투명하게 제시합니다.
  alternative_readings:
  - '그리스어: ‘그러므로 나는 좋은 소유를 얻었습니다.’'
  rationale: 이 구절은 히브리어와 그리스어가 의미상 크게 갈라지므로, 현존하는 히브리어 증거를 본문으로 두되 대조본을 숨기지 않는 것이 번역 원칙에 맞습니다.
  doctrine_reference: 'PHILOSOPHY.md: 히브리어가 보존된 경우 히브리어를 우선하되, 중대한 이문은 각주로 보존'
