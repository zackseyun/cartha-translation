  yaml_path: translation/deuterocanon/sirach/051/027.yaml
  text: See with your own eyes that I was young[b][a], and I stood by her and found her.
  footnotes:
  - marker: a
    text: Hebrew has feminine suffixes here ('in/by her' ... 'found her'), likely referring to Wisdom personified; the main text renders them more idiomatically as 'it.'
    reason: lexical_alternative
  - marker: b
    text: Greek reads, 'See with your own eyes that I labored little and found for myself much rest,' reflecting a notably different textual form.
    reason: alternative_reading
translation:
  language: ko
  text: 여러분의 눈으로 보십시오. 내가 미미하였고, 그 곁에 서서 그것을 찾았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어에는 ‘그 안에/그 곁에’와 ‘그것을/그녀를’에 여성형 접미사가 쓰였습니다. 이는 의인화된 지혜를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어는 “너희 눈으로 보라. 내가 조금 수고했고 나 자신을 위해 많은 안식을 얻었다”로 읽으며, 히브리어와 현저히 다른 본문 형태를 반영합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: רְאוּ / ἴδετε
  english_pob_choice: See
  chosen_korean: 눈으로 직접 보십시오
  alternatives_korean:
  - 보십시오
  - 직접 보십시오
  - 눈여겨보십시오
  lexicon: HALOT / LSJ
  rationale: 복수 명령형의 직접적 관찰 요청을 살리면서, בְעֵינֵיכֶם의 강조를 함께 드러내기 위해 ‘눈으로 직접 보십시오’로 옮겼습니다.
- source_word: בְעֵינֵיכֶם
  english_pob_choice: with your own eyes
  chosen_korean: 눈으로 직접
  alternatives_korean:
  - 자기 눈으로
  - 여러분의 눈으로
  - 직접
  lexicon: HALOT
  rationale: 관용적으로 ‘직접 확인함’을 뜻하므로, ‘눈으로 직접’이 현대 한국어에서 가장 자연스럽고 강조도 분명합니다.
- source_word: קָטֹן
  english_pob_choice: small
  chosen_korean: 작았으나
  alternatives_korean:
  - 작았으나
  - 보잘것없었으나
  - 어렸으나
  lexicon: HALOT
  rationale: 히브리어는 크기나 지위의 ‘작음/미미함’을 가리키므로, 영어의 ‘small’을 따라 ‘작았으나’로 두어 겸손한 시작을 살렸습니다.
- source_word: וְעָמַדְתִּי בָהּ
  english_pob_choice: and I stood by her/it
  chosen_korean: 그 안에 머물러 있었고
  alternatives_korean:
  - 그 곁에 섰고
  - 그 안에 서 있었고
  - 그녀 곁에 섰고
  lexicon: HALOT
  rationale: עמד는 여기서 단순한 ‘서다’보다 지속적 견지·머묾의 뜻이 강하므로, 현대 한국어에서 그 의미를 가장 잘 드러내는 ‘머물러 있었고’로 풀었습니다.
- source_word: וּמְצָאתִיהָ
  english_pob_choice: and found it/her
  chosen_korean: 그것을 얻었습니다
  alternatives_korean:
  - 그것을 찾았습니다
  - 그녀를 찾았습니다
  - 그것을 발견했습니다
  lexicon: HALOT
  rationale: מצא는 단순 발견보다 ‘획득하다/얻다’의 결과를 포함할 수 있어, 지혜를 얻는 결말을 분명히 하는 ‘얻었습니다’로 옮겼습니다.
theological_decisions:
- issue: 바로 앞의 여성형 대명사(בָהּ, מְצָאתִיהָ)의 처리
  chosen_reading: 주본문은 ‘그것’으로 두어 지혜/가르침을 가리키는 중성적 표현을 유지하되, 여성 인격화 가능성을 과도하게 전면화하지 않았습니다.
  alternative_readings:
  - 그녀를 붙들고 있었고 그녀를 얻었습니다
  - 그 안에 머물러 있었고 그녀를 얻었습니다
  rationale: 지혜가 여성으로 의인화되는 맥락은 인정되지만, 이 절만으로는 한국어 본문에서 ‘그녀’가 반드시 필요하지 않습니다. 따라서 POB의 투명성을 유지하면서도 현대 한국어 자연성을 살려 중성형을 택했습니다.
  doctrine_reference: Sirach의 지혜 의인화 및 번역 투명성 원칙
- issue: 히브리어 본문과 그리스어 병행문의 차이
  chosen_reading: 현존 히브리어 본문을 본문으로 따르고, 그리스어의 현저한 다른 뜻은 각주로만 처리하지 않았습니다.
  alternative_readings:
  - ‘나는 조금 수고했고, 나 자신을 위해 큰 안식을 얻었다’로 옮김
  - 그리스어를 본문 의미로 반영
  rationale: 이 절은 히브리어와 그리스어가 상당히 다른 본문 전승을 보이므로, 살아남은 히브리어를 우선하고 별도 주석을 과잉 추가하지 않는 것이 본문 충실성과 가독성에 더 적합합니다.
  doctrine_reference: Hebrew Sirach primary-text policy
