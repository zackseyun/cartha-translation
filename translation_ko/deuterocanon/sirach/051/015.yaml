  text: From her blossom, like a ripening cluster of grapes, my heart rejoiced in her; my foot walked in uprightness; from my youth I tracked her down.
  footnotes:
  - marker: a
    text: Or 'like a reddening cluster of grapes'; the Greek image may emphasize the grapes taking on color as they ripen.
    reason: lexical_alternative
  - marker: b
    text: Or 'my foot stepped in straightness' or 'on a straight path'; the Greek can carry both literal path imagery and moral uprightness.
    reason: lexical_alternative
  - marker: c
    text: Or 'I traced her' / 'I sought her out'; the Greek verb literally evokes tracking by footprints.
    reason: lexical_alternative
translation:
  language: ko
  text: 그녀의 꽃에서, 익어 가는 포도송이처럼[a] 내 마음은 그녀 안에서 기뻐하였습니다. 내 발은 올곧음 가운데로 내디뎠고[b], 나는 젊은 시절부터 그녀를 찾아다녔습니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘붉어지는 포도송이처럼’으로도 옮길 수 있습니다. 그리스어는 포도가 익어 가면서 색을 띠는 모습을 강조할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘내 발은 곧은 길을 디뎠고’ 또는 ‘내 발은 올곧음 안에서 디뎠고’로도 옮길 수 있습니다. 그리스어는 문자적인 길의 이미지와 도덕적 올곧음을 함께 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그녀의 발자취를 따라갔습니다’ 또는 ‘그녀를 더듬어 찾았습니다’로도 옮길 수 있습니다. 이 동사는 문자적으로 발자취를 추적하는 이미지를 띱니다.
    reason: lexical_alternative
