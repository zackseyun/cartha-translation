  yaml_path: translation/deuterocanon/sirach/051/015.yaml
  text: From her blossom, like a ripening cluster of grapes, my heart rejoiced in her; my foot walked in uprightness; from my youth I tracked her down.
  footnotes:
  - marker: a
    text: Or 'like a reddening cluster of grapes'; the Greek image may emphasize the grapes taking on color as they ripen.
    reason: lexical_alternative
  - marker: b
    text: Or 'my foot stepped in straightness' or 'on a straight path'; the Greek can carry both literal path imagery and moral uprightness.
    reason: lexical_alternative
  - marker: c
    text: Or 'I traced her' / 'I sought her out'; the Greek verb literally evokes tracking by footprints.
    reason: lexical_alternative
translation:
  language: ko
  text: 그녀의 꽃망울에서, 익어 가는 포도송이처럼 내 마음이 그녀 안에서 기뻐했습니다. 내 발은 올곧음 속을 걸었고, 나는 내 젊은 시절부터 그녀를 찾아다녔습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘붉어지는 포도송이처럼’으로도 옮길 수 있습니다. 그리스어는 포도가 익어 색을 띠는 모습을 강조할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘곧은 길에서’로도 옮길 수 있습니다. 그리스어는 문자적 길 이미지와 도덕적 올곧음을 함께 담을 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘발자취를 따라갔습니다’ / ‘찾아냈습니다’로도 옮길 수 있습니다. 동사는 문자적으로 발자취를 추적하는 이미지를 띱니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξ ἄνθους
  english_pob_choice: From her blossom
  chosen_korean: 그녀의 꽃망울에서
  alternatives_korean:
  - 그녀의 꽃에서
  - 꽃에서
  lexicon: LSJ
  rationale: ἄνθος는 꽃이나 꽃망울을 뜻하므로, 앞뒤 문맥의 지혜 personification을 살려 ‘그녀의 꽃망울’로 옮겼습니다.
- source_word: ὡς περκάζουσης σταφυλῆς
  english_pob_choice: like a ripening cluster of grapes
  chosen_korean: 익어 가는 포도송이처럼
  alternatives_korean:
  - 붉어지는 포도송이처럼
  - 덜 익어 가며 붉어지는 포도송이처럼
  lexicon: LSJ
  rationale: περκάζουσης는 포도가 익으며 색이 도는 모습을 가리킬 수 있으므로, 자연스러운 현대 한국어로 ‘익어 가는 포도송이’라고 옮겨 농경적 이미지를 살렸습니다.
- source_word: ἐν εὐθύτητι
  english_pob_choice: in uprightness
  chosen_korean: 올곧음 속을
  alternatives_korean:
  - 곧은 길 위를
  - 올바름 가운데
  lexicon: LSJ
  rationale: εὐθύτης는 직선성뿐 아니라 도덕적 바름을 뜻할 수 있어, ‘올곧음’으로 옮겨 길 이미지와 윤리적 의미를 함께 담았습니다.
- source_word: ἴχνευον
  english_pob_choice: I tracked her down
  chosen_korean: 찾아다녔습니다
  alternatives_korean:
  - 발자취를 더듬었습니다
  - 추적했습니다
  - 그녀를 추적했습니다
  lexicon: LSJ
  rationale: 이 동사는 발자취를 따라 추적하는 뉘앙스를 가지지만, 한국어에서는 자연스러운 독서성을 위해 ‘찾아다녔습니다’로 옮기되 추구의 지속성을 보존했습니다.
theological_decisions:
- issue: 지혜의 여성 인칭 유지
  chosen_reading: 지혜를 가리키는 대상을 ‘그녀’로 유지했습니다.
  alternative_readings:
  - ‘그것’으로 중성화
  - 인칭을 생략하여 추상화
  rationale: 시락 전체의 지혜 의인화를 따라, 원문의 여성 대명사 흐름을 한국어에서도 보존하는 편이 본문 의도를 더 잘 드러냅니다.
  doctrine_reference: 원문 우선 원칙과 지혜의 의인화 유지
