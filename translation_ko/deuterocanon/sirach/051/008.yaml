base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/051/008.yaml
  text: And I remembered the mercies of Yahweh[a], and his acts of covenant faithfulness from of old, who delivers those who take refuge in him[b], and redeems them from every evil.
  footnotes:
  - marker: a
    text: Or, 'his steadfast love from everlasting.' The Hebrew phrase can be read with stronger emphasis on enduring divine loyalty across all time.
    reason: lexical_alternative
  - marker: b
    text: The Greek parallel reads, 'your mercy, Lord, and your work from of old,' and continues, 'you deliver those who wait for you and save them from the hand of nations.' The Hebrew witness here instead has 'those who take refuge in him' and 'from every evil.'
    reason: alternative_reading
translation:
  language: ko
  text: 저는 야훼의 긍휼과, 옛적부터 있는 그의 언약적 신실하심을 기억하였습니다. 그분은 자신에게 피하는 이들을 구원하시고, 모든 악에서 그들을 속량하십니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘옛적부터 있는 그의 변함없는 사랑’으로도 옮길 수 있습니다. 히브리어 חסד는 문맥에 따라 언약적 충실성과 사랑을 함께 담습니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어 병행본문은 ‘주님, 당신의 자비와 옛적부터의 당신의 일’을 읽으며, 이어서 ‘당신을 기다리는 이들을 건지시고 민족들의 손에서 그들을 구원하신다’고 말합니다. 그러나 히브리어 증거는 여기서 ‘그에게 피하는 이들’과 ‘모든 악’으로 전합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: רַחֲמֵי יְהֹוָה
  english_pob_choice: the mercies of Yahweh
  chosen_korean: 야훼의 긍휼
  alternatives_korean:
  - 야훼의 자비
  - 야훼의 자애
  lexicon: HALOT
  rationale: רַחֲמֵי는 복수형으로 하나님의 자비로운 행위들을 가리키므로, 단수적 추상어보다 ‘긍휼’이 가장 직접적이며 간결합니다.
- source_word: וַחֲסָדָיו
  english_pob_choice: his acts of covenant faithfulness
  chosen_korean: 그의 언약적 신실하심
  alternatives_korean:
  - 그의 인애
  - 그의 변함없는 사랑
  - 그의 언약적 사랑
  lexicon: HALOT
  rationale: חסד는 단순한 친절보다 언약적 충실성을 띠므로, 한국어에서는 ‘언약적 신실하심’으로 그 신학적 무게를 살렸습니다.
- source_word: אֲשֶׁר מֵעוֹלָם
  english_pob_choice: from of old
  chosen_korean: 옛적부터 있는
  alternatives_korean:
  - 영원부터 있는
  - 태초부터 있는
  lexicon: HALOT
  rationale: מֵעוֹלָם은 문맥상 ‘영원’이라기보다 오래전부터 이어져 온 지속성을 강조하므로, 과도한 형이상학적 확대 없이 ‘옛적부터 있는’으로 옮겼습니다.
- source_word: חוֹסֵי בוֹ
  english_pob_choice: those who take refuge in him
  chosen_korean: 자신에게 피하는 이들
  alternatives_korean:
  - 그에게 피신하는 이들
  - 그를 의지하는 이들
  lexicon: HALOT
  rationale: חסה ב는 단순한 믿음보다 보호처를 찾아 숨는 구체적 이미지를 가지므로, ‘피하다’ 계열 표현으로 은유를 보존했습니다.
- source_word: וַיִּגְאָלֵם
  english_pob_choice: he redeems them
  chosen_korean: 그들을 속량하십니다
  alternatives_korean:
  - 그들을 구속하십니다
  - 그들을 구원하십니다
  lexicon: HALOT
  rationale: גאל은 단순 구출보다 친족 구속자의 행위를 떠올리게 하므로, 구원과 구별되는 ‘속량’이 가장 적절합니다.
theological_decisions:
- issue: יהוה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문은 히브리어 원문에서 신명 יְהֹוָה를 직접 사용하므로, POB 기본 방침에 따라 음역형 ‘야훼’를 유지했습니다.
  doctrine_reference: POB glossary / source-direct rendering
- issue: חסד의 신학적 범위
  chosen_reading: 언약적 신실하심
  alternative_readings:
  - 인애
  - 사랑
  - 자비
  rationale: 이 절은 하나님의 오래된 구원 행위를 회상하므로, חסד를 단순 감정이 아니라 언약에 충실한 구원 행위로 읽는 것이 문맥에 가장 잘 맞습니다.
  doctrine_reference: Translation philosophy §1, §5
