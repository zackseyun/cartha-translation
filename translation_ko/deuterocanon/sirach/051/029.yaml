translation:
  language: ko
  text: 늙은 날에 내 마음이 기뻐하고, 내 노래로 너희가 수치를 당하지 않기를 바랍니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 병행본문은 “그의 자비 안에서 너희의 마음이 기뻐하고, 그의 찬양 안에서 너희가 수치를 당하지 않기를”이라고 읽습니다. 히브리어 증인은 “내 마음,” “내 늙은 날,” “내 노래”로 읽습니다.
    reason: textual_variant
lexical_decisions:
- source_word: תִּשְׂמַח נַפְשִׁי
  english_pob_choice: May my soul rejoice
  chosen_korean: 내 마음이 기뻐하고
  alternatives_korean:
  - 내 영혼이 기뻐하고
  - 내 혼이 기뻐하고
  lexicon: HALOT
  rationale: 히브리어의 נפשׁ는 여기서 내적 자아를 가리키므로, 한국어에서는 자연스럽고 현대적인 표지인 ‘내 마음’으로 풀어도 원뜻을 유지할 수 있습니다.
- source_word: בְּשֵׂיבָתִי
  english_pob_choice: in my old age
  chosen_korean: 늙은 날에
  alternatives_korean:
  - 내 늙은 머리카락에
  - 내 노년에
  - 내 흰머리 때에
  lexicon: HALOT
  rationale: שֵׂיבָה는 문자적으로 흰머리/노년을 가리키지만, 한국어에서는 관용적으로 ‘늙은 날’ 또는 ‘노년에’가 가장 자연스럽습니다.
- source_word: וְלֹא תֵבוֹשוּ
  english_pob_choice: and may you not be put to shame
  chosen_korean: 너희가 수치를 당하지 않기를 바랍니다
  alternatives_korean:
  - 너희가 부끄러움을 당하지 않기를 바랍니다
  - 부끄러워하지 않기를 바랍니다
  - 수치를 당하지 않기를 바랍니다
  lexicon: HALOT
  rationale: בוש의 핵심은 단순한 내적 감정보다 ‘수치를 당함’에 가깝기 때문에, 수동적 뉘앙스를 살려 옮겼습니다. 영어 POB처럼 2인칭 복수를 유지하기 위해 ‘너희’로 처리했습니다.
- source_word: בְּשִׁירָתִי
  english_pob_choice: by my song / in my song
  chosen_korean: 내 노래로
  alternatives_korean:
  - 내 노래에서
  - 내 노래 안에서
  - 내 찬송으로
  lexicon: HALOT
  rationale: 히브리어는 ‘내 노래’가 가장 직접적이므로 이를 유지하되, 한국어에서는 원인·매개를 함께 드러내는 조사 ‘-로’가 자연스럽습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행본문의 차이
  chosen_reading: 주본문은 현존하는 히브리어를 따라 ‘내 마음 … 늙은 날 … 내 노래’로 옮기고, 그리스어의 ‘그의 자비/그의 찬양’ 차이는 각주로 남깁니다.
  alternative_readings:
  - 그의 자비 안에서
  - 그의 찬양 안에서
  rationale: 시락서는 현존 히브리어가 있을 때 이를 우선하되, 그리스어 병행본문이 실제로 다른 전승을 보여 주는 경우 그 차이를 가려 두어야 합니다.
