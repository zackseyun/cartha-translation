base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/051/001.yaml
  text: I will praise you[a], God of my salvation; I will give thanks to you, God of my father. I will declare your name, the stronghold of my life[c][b], for you have redeemed my soul from death.
  footnotes:
  - marker: a
    text: Or, 'I will recount your name as the stronghold of my life.' The Hebrew phrase may be read appositionally ('your name, the stronghold of my life') or with a slightly more explicit verbal link.
    reason: lexical_alternative
  - marker: b
    text: '''My soul'' may also be rendered ''my life'' or ''my self''; the Hebrew nephesh can carry any of these senses depending on context.'
    reason: lexical_alternative
  - marker: c
    text: The Greek parallel begins, 'I will give thanks to you, Lord King, and I will praise you, God my savior,' reflecting a somewhat different opening formulation than the extant Hebrew.
    reason: textual_variant
translation:
  language: ko
  text: 나는 나의 구원의 하나님이신 주님을 찬양합니다. 나는 나의 아버지의 하나님이신 주님께 감사드립니다. 나는 당신의 이름, 내 삶의 견고한 요새를 선포하겠습니다〔a〕. 당신이 내 영혼을 죽음에서 구속하셨기 때문입니다〔b〕.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신의 이름, 내 삶의 견고한 요새를 이야기하겠습니다.’ 히브리어 구문은 병치적으로도, 동사 연결을 더 분명히 해서도 읽을 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘영혼’은 여기서 ‘생명’이나 ‘자기 자신’으로도 옮길 수 있습니다. 히브리어 נפש는 문맥에 따라 여러 의미를 가집니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲהַלְלֶךָּ
  english_pob_choice: I will praise you
  chosen_korean: 찬양합니다
  alternatives_korean:
  - 높이 찬양합니다
  - 기리겠습니다
  lexicon: HALOT
  rationale: הלל의 기본 의미를 살리되, 서술형 문맥에서 자연스럽고 예배적인 한국어로 옮겼습니다.
- source_word: אֱלֹהֵי יִשְׁעִי
  english_pob_choice: God of my salvation
  chosen_korean: 나의 구원의 하나님
  alternatives_korean:
  - 내 구원의 하나님
  - 구원하시는 하나님
  lexicon: HALOT
  rationale: 히브리어 소유격 구조를 한국어에서도 자연스럽게 보존하면서, ‘구원’의 명사적 의미를 분명히 드러냈습니다.
- source_word: אֱלֹהֵי אָבִי
  english_pob_choice: God of my father
  chosen_korean: 나의 아버지의 하나님
  alternatives_korean:
  - 내 아버지의 하나님
  - 내 조상의 하나님
  lexicon: HALOT
  rationale: 단수 ‘아버지’를 직접 반영하여 일반화하지 않았습니다.
- source_word: אֲסַפְּרָה שִׁמְךָ מָעוֹז חַיַּי
  english_pob_choice: I will declare your name, the stronghold of my life
  chosen_korean: 당신의 이름, 내 삶의 견고한 요새를 선포하겠습니다
  alternatives_korean:
  - 당신의 이름을, 내 삶의 피난처를 선포하겠습니다
  - 당신의 이름은 내 삶의 요새입니다
  lexicon: HALOT
  rationale: POB가 보존한 apposition을 살려 ‘이름’과 ‘내 삶의 견고한 요새’를 병치했고, מָעוֹז는 ‘피난처’보다 ‘견고한 요새’가 이미지의 힘을 더 잘 살립니다.
- source_word: פָדִיתָ
  english_pob_choice: you have redeemed
  chosen_korean: 구속하셨기 때문입니다
  alternatives_korean:
  - 속량하셨기 때문입니다
  - 건져내셨기 때문입니다
  lexicon: HALOT
  rationale: פדה의 구속/속량 의미를 유지하면서, 찬양의 이유를 신학적으로도 충분히 드러내는 한국어를 선택했습니다.
- source_word: נַפְשִׁי
  english_pob_choice: my soul
  chosen_korean: 내 영혼
  alternatives_korean:
  - 내 생명
  - 나 자신
  lexicon: HALOT
  rationale: 시적 문맥에서 נפש의 인격적 생명 전체를 가리키는 뜻을 반영하기 위해 ‘영혼’을 택했습니다.
theological_decisions:
- issue: 시편적 감사 선언에서 פדה를 어떻게 신학적으로 옮길 것인가
  chosen_reading: 구속하셨기 때문입니다
  alternative_readings:
  - 구원하셨기 때문입니다
  - 속량하셨기 때문입니다
  rationale: 단순한 구조적 ‘구출’보다 구속/속량의 신학적 두께를 살리되, 문맥상 과도한 교리화는 피했습니다.
  doctrine_reference: Translation philosophy §1, §5
- issue: אֲסַפְּרָה שִׁמְךָ מָעוֹז חַיַּי의 구문 처리
  chosen_reading: 당신의 이름, 내 삶의 견고한 요새를 선포하겠습니다
  alternative_readings:
  - 당신의 이름이 내 삶의 견고한 요새입니다
  - 당신의 이름을 선포하겠습니다, 내 삶의 요새를
  rationale: 히브리어의 병치적 표현을 유지해, 하나님의 ‘이름’이 단순한 호칭이 아니라 보호와 힘의 실재를 담는다는 점을 드러냈습니다.
  doctrine_reference: Translation philosophy §3, §6
