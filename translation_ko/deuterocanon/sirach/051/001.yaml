- source_word: אֲסַפְּרָה שִׁמְךָ מָעוֹז חַיַּי
  english_pob_choice: I will declare your name, the stronghold of my life
  chosen_korean: 당신의 이름, 내 삶의 견고한 요새를 선포하겠습니다
