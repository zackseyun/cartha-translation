    그분의 성읍과 성소를 세우시는 이께 감사하여라. 그분의 인자하심은 영원하다.

    다윗의 집을 위하여 뿔을 돋게 하시는 이께 감사하여라. 그분의 인자하심은 영원하다.

    사독의 자손을 택하여 제사장으로 삼으시는 이께 감사하여라. 그분의 인자하심은 영원하다.

    아브라함의 방패이신 이께 감사하여라. 그분의 인자하심은 영원하다.

    이삭의 반석이신 이께 감사하여라. 그분의 인자하심은 영원하다.

    야곱의 능하신 이께 감사하여라. 그분의 인자하심은 영원하다.

    시온을 택하시는 이께 감사하여라. 그분의 인자하심은 영원하다.

    왕들의 왕이신 왕께 감사하여라. 그분의 인자하심은 영원하다.


    그분께서 자기 백성을 위하여 뿔을 높이셨으니, 그분의 모든 신실한 이들, 곧 그분께 가까운 백성인 이스라엘 자손에게 찬양이 있도다. 할렐루야.'
