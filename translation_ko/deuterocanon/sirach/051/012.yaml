base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/051/012.yaml
  text: For he redeemed me from every evil[a], and delivered me in the day of trouble.
  footnotes:
  - marker: a
    text: 'Greek parallel: ''For you saved me from destruction, and delivered me from an evil time.'' The Hebrew reads ''from every evil'' and ''in the day of trouble.'''
    reason: alternative_reading
translation:
  language: ko
  text: 그분께서는 나를 온갖 악에서 구속하시고, 환난의 날에 건져 주셨습니다. 그러므로 나는 감사하고 찬양하며, 야훼의 이름을 찬송하겠습니다. 야훼께 감사하여라. 그분은 선하시며, 그분의 인자하심은 영원합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 헬라어 병행본문은 ‘파멸에서 저를 구원하셨고, 악한 때에서 저를 건지셨습니다’에 가깝습니다. 히브리어는 ‘온갖 악에서’와 ‘환난의 날에’라고 읽습니다.
    reason: textual_variant
lexical_decisions:
- source_word: וַיִּפְדֵּנִי
  english_pob_choice: redeemed me
  chosen_korean: 구속하시고
  alternatives_korean:
  - 속량하시고
  - 구해 주셨습니다
  lexicon: HALOT
  rationale: פדה는 단순한 구조보다 대가를 치르고 풀어 주는 ‘속량/구속’의 뉘앙스가 있어, POB의 ‘redeemed me’를 살려 ‘구속하시고’로 옮겼습니다.
- source_word: מִכָּל רָע
  english_pob_choice: from every evil
  chosen_korean: 온갖 악에서
  alternatives_korean:
  - 모든 악에서
  - 온갖 해악에서
  lexicon: HALOT
  rationale: רָע는 문맥상 도덕적 악과 재앙적 해악을 함께 열어 두므로, 좁히지 않고 ‘온갖 악’으로 번역해 범위를 유지했습니다.
- source_word: וַיְמַלְּטֵנִי
  english_pob_choice: delivered me
  chosen_korean: 건져 주셨습니다
  alternatives_korean:
  - 구출해 주셨습니다
  - 벗어나게 해 주셨습니다
  lexicon: HALOT
  rationale: מלט는 위기에서 안전한 곳으로 빼내는 구출의 뜻이므로, ‘구속하시고’와 구별되는 살림의 동작을 드러내는 ‘건져 주셨습니다’를 택했습니다.
- source_word: בְּיוֹם צָרָה
  english_pob_choice: in the day of trouble
  chosen_korean: 환난의 날에
  alternatives_korean:
  - 고난의 날에
  - 곤경의 날에
  lexicon: HALOT
  rationale: צָרָה는 압박과 위기의 때를 가리키므로, 한국어 성경 문맥에서 자연스럽고 밀도 있게 읽히는 ‘환난의 날’로 옮겼습니다.
theological_decisions:
- issue: 히브리어 본문과 헬라어 병행본문의 우선순위
  chosen_reading: 본문은 현존하는 히브리어를 따라 ‘온갖 악에서 / 환난의 날에’로 옮기고, 헬라어의 ‘파멸/악한 때’ 의미는 본문을 바꾸지 않았습니다.
  alternative_readings:
  - ‘파멸에서 건져 주셨습니다’
  - ‘악한 때에서 건져 주셨습니다’
  rationale: 이 절은 히브리어가 분명하게 남아 있으므로 히브리어를 본문으로 삼되, 헬라어는 의미 점검용으로만 사용해야 합니다. 그래서 POB의 영어 각주처럼 이질적이지만 관련된 헬라어 전승은 본문이 아니라 주석적 배경으로 남겨 두었습니다.
  doctrine_reference: 'PHILOSOPHY.md: 히브리어가 존속하는 집회서/집회 지혜서는 히브리어 본문 우선, 헬라어는 대조본문'
- issue: 12절의 감정 반응과 찬양 전환
  chosen_reading: ‘그러므로 나는 감사하고 찬양하며, 야훼의 이름을 찬송하겠습니다’로 감사·찬양·축복 동사를 분리해, 구원의 결과로 이어지는 응답을 분명히 했습니다.
  alternative_readings:
  - ‘그리하여 나는 감사하며 그분을 찬양하고, 야훼의 이름을 복되다 하겠습니다’
  - ‘그래서 나는 감사드리며 찬양하고, 야훼의 이름을 송축하겠습니다’
  rationale: 히브리어의 הוֹדֵיתִי / אֲהַלְלָה / אֲבָרְכָה는 서로 다른 찬양 동작을 연속적으로 보여 주므로, 한국어에서도 세 동작을 구분해 의미의 밀도를 보존했습니다.
  doctrine_reference: '문학적-신학적 응답 구조: 구원 → 감사 → 찬양 → 이름 송축'
