review_pass:
  verdict: revise
  source_fidelity: 수정이 필요합니다. 초안은 그리스어 병행 본문 및 영어 POB의 짧은 문장에는 부합하지만, 이 검토의 우선 원전으로 제시된 카이로 게니자 히브리어 본문에는 없는 내용을 대폭 생략합니다. 히브리어는 구덩이와 스올에서의 구출, 백성과 비방하는 혀의 중상으로부터의 구원, 대적자들 앞에서의 도움, 풍성한 חסד을 모두 진술합니다. 영어 POB는 그리스어 병행 본문의 짧은 형태를 따른 것으로 보이나, 원전 우선 원칙상 이를 근거로 히브리어 본문을 압축할 수 없습니다.
  naturalness: ‘당신’은 현대 표준 한국어의 하나님께 드리는 기도·감사 고백에서 다소 어색하거나 대립적으로 들릴 수 있습니다. 문맥상 기도 대상인 하나님을 ‘주님’으로 부르고, 합쇼체의 자연스러운 감사 고백으로 다듬었습니다.
  terminology: ‘스올’은 히브리어 שְׁאוֹל을 음역하여 보존하고 주석으로 설명했습니다. שַׁחַת는 ‘구덩이’로, חֶסֶד는 하나님의 지속적 호의를 뜻하는 ‘한결같은 사랑’으로 옮겼습니다. ‘혀의 비방이라는 채찍’은 직역적 이미지를 보존하되 한국어 문장 안에서 이해되도록 처리했습니다.
  issues:
  - severity: high
    issue: 히브리어 원전의 핵심 구출 서술이 전면 생략되었습니다.
    rationale: 초안은 ‘이름에 감사’와 ‘피난처·도우심’만 번역하여, 제시된 히브리어의 구덩이, 스올, 비방, 거짓말하는 자들, 대적자들, 풍성한 חסד의 내용을 전달하지 못합니다.
  - severity: medium
    issue: ‘도우심’은 βοηθός/‘도우는 이’의 인칭 명사보다 추상 명사에 가깝습니다.
    rationale: 영어 병행 본문만을 따를 경우에도 ‘도우시는 분’ 또는 원전의 동사 서술로 옮기는 편이 행위자 의미를 더 분명히 합니다.
  revised_text: 주님께서는 제 몸을 구덩이에서 건져 주셨고, 스올의 손에서 제 발을 구해 내셨습니다.[a] 주님께서는 백성의 비방과 비방하는 혀의 채찍과 거짓을 말하는 자들의 입술에서 저를 구해 내셨습니다. 저를 대적하여 일어난 자들에 맞서 제 편이 되어 주셨고, 주님의 풍성한 한결같은 사랑을 따라 저를 도와주셨습니다.
  revised_footnotes:
  - marker: a
    text: 스올은 죽은 이들의 영역을 가리키는 히브리어 표현입니다.
    reason: שְׁאוֹל을 단순히 ‘무덤’이나 특정 교리적 사후 세계로 한정하지 않고, 원문의 폭넓은 의미를 보존하기 위해 음역과 간략한 설명을 제공합니다.
  revision_rationale: 제시된 히브리어 본문을 우선하여 생략된 모든 구출과 도움의 진술을 복원했습니다. 영어 POB 및 그리스어 병행 본문의 짧은 독법은 감사 고백의 방향을 확인하는 데 참고하되, 히브리어와 충돌하는 축약을 유지하지 않았습니다. ‘혀의 비방이라는 채찍’은 מִשּׁוֹט דִּבַּת לָשׁוֹן의 채찍 비유를 보존하며, ‘제 편이 되어’는 נֶגֶד קָמַי הָיִיתָה לִּי를 자연스럽게 반영합니다.
