translation:
  language: ko
  text: 당신의 이름에 감사를 드립니다. 당신께서 제게 피난처와 도우심이 되셨기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξομολογοῦμαι τῷ ὀνόματί σου
  english_pob_choice: I give thanks to your name
  chosen_korean: 당신의 이름에 감사를 드립니다
  alternatives_korean:
  - 당신의 이름을 찬양합니다
  - 당신의 이름을 고백합니다
  lexicon: ἐξομολογοῦμαι
  rationale: 이 동사는 ‘감사하다/찬양하다’와 ‘고백하다’의 뜻이 함께 가능하지만, POB의 영어가 ‘I give thanks’로 확정되어 있어 감사의 의미를 중심으로 옮겼습니다.
- source_word: σκεπαστὴς
  english_pob_choice: shelter
  chosen_korean: 피난처
  alternatives_korean:
  - 보호자
  - 덮개
  - 피난처가 되셨습니다
  lexicon: σκεπαστής
  rationale: 영어 POB의 ‘shelter’를 자연스러운 한국어 신앙어로 옮기되, 원문이 비유하는 보호의 의미를 분명히 하기 위해 ‘피난처’로 번역했습니다.
- source_word: βοηθὸς
  english_pob_choice: helper
  chosen_korean: 도우심
  alternatives_korean:
  - 도움
  - 도우시는 분
  - 조력자
  lexicon: βοηθός
  rationale: 명사적 ‘helper’를 그대로 살리면서 한국어 문맥상 자연스럽게 ‘도우심’으로 표현해, 하나님이 실제로 도우시는 분이시라는 뜻을 유지했습니다.
- source_word: ἐγένου μοι
  english_pob_choice: you became my
  chosen_korean: 당신께서 제게 … 되셨습니다
  alternatives_korean:
  - 당신은 제게 …가 되셨습니다
  - 당신이 제 편이 되셨습니다
  lexicon: γίνομαι
  rationale: 과거 완료적 변화의 뉘앙스를 살려 ‘되셨습니다’로 옮겼고, 소유격 구조를 한국어 자연문장으로 풀어 표현했습니다.
theological_decisions:
- issue: 시편식 감사 고백인지, 구원 행위 서술인지
  chosen_reading: 전체를 하나님께 대한 감사 고백으로 유지했습니다.
  alternative_readings:
  - 구체적 구출 사건의 서술로 확장하기
  - 과거의 여러 구원 행위를 나열하기
  rationale: 최종 POB 영어가 감사와 피난처/도우심의 고백으로 정리되어 있으므로, 히브리 본문의 더 विस्तृत한 서술을 본문에 확장하지 않고 감사 고백으로 압축했습니다.
  doctrine_reference: 문맥 우선 번역 원칙
