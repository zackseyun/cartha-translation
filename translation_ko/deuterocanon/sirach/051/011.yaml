lexical_decisions:
- source_word: אָז
  english_pob_choice: Then
  chosen_korean: 그때
  alternatives_korean:
  - 그런 다음
  - 그리하여
  lexicon: HALOT
  rationale: 앞선 서원과 찬양 뒤에 이어지는 응답의 시점을 자연스럽게 표시하는 시간 부사로, 현대 한국어에서는 ‘그때’가 가장 간결하고 문맥에 잘 맞습니다.
- source_word: שָׁמַע קוֹלִי
  english_pob_choice: heard my voice
  chosen_korean: 내 음성을 들으시고
  alternatives_korean:
  - 내 목소리를 들으시고
  - 내 부르짖음을 들으시고
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘내 음성’을 말하므로 이를 직접 살렸습니다. ‘부르짖음’은 가능하지만 원문이 요구하는 강도를 넘길 수 있어 보류했습니다.
- source_word: יְהֹוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 개인적 고유명사인 Tetragrammaton을 한국어 관례보다 원문 지향적으로 옮겨 ‘야훼’를 사용했습니다.
- source_word: וַיַּאֲזִין אֶל תַּחֲנוּנָי
  english_pob_choice: listened to my supplications
  chosen_korean: 내 간구에 귀를 기울이셨습니다
  alternatives_korean:
  - 내 탄원에 귀를 기울이셨습니다
  - 내 애원에 귀를 기울이셨습니다
  lexicon: HALOT
  rationale: ‘귀를 기울이다’는 שׁמע보다 더 적극적인 주의를 나타내는 וַיַּאֲזִין의 뉘앙스를 잘 살리며, תַּחֲנוּנִים의 간청적 기도를 ‘간구’로 옮겼습니다.
theological_decisions:
- issue: 이 절에서 하나님의 이름과 응답의 이중 동사 사용을 어떻게 살릴지
  chosen_reading: ‘야훼께서 내 음성을 들으시고, 내 간구에 귀를 기울이셨습니다’로 옮겨, 먼저 들으심과 그보다 더 적극적인 귀 기울이심의 점증을 보존했습니다.
  alternative_readings:
  - ‘야훼께서 내 음성을 들으셨고, 내 간구를 들으셨습니다’
  - ‘주님께서 내 기도를 들으시고 응답하셨습니다’
  rationale: 원문은 שׁמע와 אזן을 나란히 두어 단순 청취와 주의 깊은 경청을 구분합니다. 이를 평준화하면 시편적 병렬과 응답의 긴밀성이 약해집니다.
  doctrine_reference: 히브리어 시적 병행과 기도 응답의 점증
