base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/051/007.yaml
  text: I turned around[a], and there was no one to help me; I looked for support, and there was none.
  footnotes:
  - marker: a
    text: 'Hebrew: ''I looked for support''; the Greek parallel reads more explicitly, ''looking for help from men, and there was none.'' The translation follows the Hebrew while allowing the Greek to confirm the sense of sought human assistance.'
    reason: alternative_reading
translation:
  language: ko
  text: 내가 사방을 둘러보았으나 나를 도와줄 이가 없었습니다. 도움을 찾았으나 아무 도움도 없었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘도움을 찾았으나, 없었다’라고 합니다. 여기서 ‘도움’은 직역하면 ‘붙들어 주는 것’ 또는 ‘붙들어 줄 이’로도 이해할 수 있습니다. 그리스어 병행본은 ‘사람들에게서 도움을 바라보았으나, 없었다’라고 더 분명히 말합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וָאֶפְנֶה סָבִיב
  english_pob_choice: I turned around
  chosen_korean: 내가 사방을 둘러보았으나
  alternatives_korean:
  - 내가 돌아보았으나
  - 내가 돌아서 사방을 살폈으나
  lexicon: HALOT
  rationale: פנה와 סָבִיב의 결합은 단순한 회전보다 사방을 두리번거리며 찾는 동작을 나타내므로, 현대 한국어에서는 ‘사방을 둘러보다’가 가장 자연스럽고 원문상의 탐색 뉘앙스를 살립니다.
- source_word: עוֹזֵר
  english_pob_choice: to help
  chosen_korean: 나를 도와줄 이
  alternatives_korean:
  - 도와줄 사람
  - 돕는 이
  lexicon: HALOT
  rationale: 분사형 ‘도와주는 자’의 인격적 의미를 살리되, 한국어 문맥에서는 ‘이’가 가장 간결하고 현대적입니다.
- source_word: וַאֲצַפֶּה
  english_pob_choice: I looked for
  chosen_korean: 내가 도움을 바라보았으나
  alternatives_korean:
  - 내가 도움을 찾아보았으나
  - 내가 도움을 기다렸으나
  lexicon: HALOT
  rationale: צפה는 ‘바라보다/기다리다/살피다’의 폭이 있지만, 병행구와 문맥상 적극적으로 도움을 기대하며 찾는 의미가 핵심이어서 ‘바라보다’로 옮겼습니다.
- source_word: סוֹמֵךְ
  english_pob_choice: support
  chosen_korean: 도움
  alternatives_korean:
  - 붙들어 줄 것
  - 지탱해 줄 이
  - 받침
  lexicon: HALOT
  rationale: 히브리어 분사는 ‘붙들어 주는 것/사람’의 뜻을 가질 수 있으나, 그리스어 ἀντίλημψις도 ‘도움/원조’의 추상적 의미를 뒷받침하므로 한국어는 자연스러운 ‘도움’이 적절합니다.
- source_word: וְאָיִן
  english_pob_choice: there was none
  chosen_korean: 아무도 없었습니다
  alternatives_korean:
  - 없었습니다
  - 그런 이는 없었습니다
  lexicon: HALOT
  rationale: 히브리어의 간결한 부정을 한국어에서는 서술적으로 풀어, 앞의 ‘도와줄 이’와 호응하는 자연스러운 종결을 만들었습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행본의 의미 범위
  chosen_reading: 본문은 히브리어의 ‘사방을 둘러보았으나’와 ‘도움/지탱’을 기본으로 하되, 그리스어가 암시하는 ‘사람들에게서 도움’을 배경 참고로만 유지했습니다.
  alternative_readings:
  - 그리스어를 따라 ‘사람들에게서 도움을 찾았으나’로 더 명시적으로 옮김
  - 히브리어만 따라 완전히 비인격적으로 ‘지탱해 줄 것’으로 옮김
  rationale: POB의 영어 본문이 히브리어를 따르면서도 그리스어를 주석적으로 확인하는 방식이므로, 한국어도 본문은 히브리어의 이미지와 간결성을 살리고, 그리스어의 인격적 ‘도움’ 뉘앙스는 과도하게 전면화하지 않았습니다.
  doctrine_reference: 본문비평/번역 원칙
