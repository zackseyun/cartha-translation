  source_fidelity: 첫째 절의 ‘사방을 둘러보았으나, 나를 도와줄 이가 없었습니다’는 וָאֶפְנֶה סָבִיב와 עוֹזֵר를 잘 반영합니다. 그러나 ‘도움을 바라보았으나’는 וַאֲצַפֶּה의 적극적으로 찾는 뜻을 한국어에서 다소 부자연스럽게 전달합니다. ‘도움을 찾았으나’가 히브리어와 그리스어 병행본문의 의미를 더 정확히 살립니다. סוֹמֵךְ는 인격적 ‘붙들어 줄 이’와 추상적 ‘도움’ 사이에 여지가 있으므로, 본문에서는 자연스러운 추상 명사로 유지하되 주석에서 직역 가능성을 밝혔습니다.
  naturalness: ‘도움을 바라보다’는 현대 표준 한국어에서 도움을 기대한다는 뜻으로는 가능하지만, 여기서는 도움을 찾아 살피는 행위를 충분히 드러내지 못합니다. ‘도움을 찾았으나 아무 도움도 없었습니다’는 합쇼체 문체에 자연스럽고 간결합니다.
