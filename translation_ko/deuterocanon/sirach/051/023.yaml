base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/051/023.yaml
  text: Turn to me[a], you who are simple[b], and lodge in the house of my instruction.
  footnotes:
  - marker: a
    text: Or 'Draw near to me'; the Greek parallel reads 'Draw near to me, you who are untrained, and lodge in the house of instruction.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'you who are unlearned'; alternatively, 'you fools' or 'you simple ones.' The Greek parallel favors the sense of those lacking instruction rather than a purely moral insult.
    reason: alternative_reading
translation:
  language: ko
  text: 저에게로 향하십시오[a], 배우지 못한 이들[b]아. 그리고 내 가르침의 집에 묵으십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘저에게 가까이 오십시오’. 그리스어 평행구는 ‘저에게 가까이 오십시오, 훈련받지 못한 이들아. 그리고 교훈의 집에 묵으십시오’라고 읽습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘배우지 못한 이들’을 뜻할 수 있습니다. 다른 가능성으로는 ‘어리석은 이들’ 또는 ‘단순한 이들’이 있습니다. 그리스어 평행구는 단순한 도덕적 비난보다는 교육이나 훈련을 받지 못한 이들을 가리키는 뜻을 지지합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: פְּנוּ אֵלַי
  english_pob_choice: Turn to me
  chosen_korean: 저에게로 돌아오십시오
  alternatives_korean:
  - 저에게로 향하십시오
  - 저에게로 오십시오
  - 저를 향해 돌이키십시오
  lexicon: HALOT
  rationale: 히브리어 פנה의 명령형은 ‘돌이키다/향하다’의 뜻을 가지며, 초청의 뉘앙스를 살리기 위해 ‘돌아오십시오’로 옮겼습니다. 단순한 이동보다 방향 전환과 응답의 의미를 드러냅니다.
- source_word: סְכָלִים
  english_pob_choice: you who are unlearned
  chosen_korean: 배우지 못한 사람들
  alternatives_korean:
  - 어리석은 사람들
  - 단순한 사람들
  - 미숙한 사람들
  lexicon: HALOT
  rationale: 문맥과 그리스어 ἀπαίδευτοι가 가리키는 교육 부족의 뉘앙스를 반영하여, 도덕적 비난으로만 들리는 ‘어리석은’보다 ‘배우지 못한 사람들’을 택했습니다.
- source_word: וְלִינוּ
  english_pob_choice: and lodge
  chosen_korean: 머무르십시오
  alternatives_korean:
  - 묵으십시오
  - 잠시 머무르십시오
  - 하룻밤 묵으십시오
  lexicon: HALOT
  rationale: לין은 문자적으로 ‘묵다/밤을 지내다’의 뜻이지만, 지혜 교육의 초청에서 지속적인 체류를 강조하므로 자연스러운 현대어 ‘머무르십시오’로 옮겼습니다.
- source_word: בְּבֵית מִדְרָשִׁי
  english_pob_choice: in the house of my instruction
  chosen_korean: 내 교훈의 집
  alternatives_korean:
  - 내 배움의 집
  - 내 학문의 집
  - 내 가르침의 집
  lexicon: HALOT
  rationale: מדרש는 여기서 학문 기관의 고유명사라기보다 가르침을 받는 장소를 가리키므로, 그리스어 οἴκῳ παιδείας의 의미와 함께 ‘교훈의 집’으로 옮겨 원뜻을 살렸습니다.
theological_decisions:
- issue: 수사적 초청에서 סכלים을 ‘어리석은 자’로 강하게 규정할지, ‘배우지 못한 사람들’로 교육적 뉘앙스를 살릴지
  chosen_reading: 배우지 못한 사람들
  alternative_readings:
  - 어리석은 사람들
  - 단순한 사람들
  rationale: 이 구절은 꾸짖음보다 지혜 학교로의 초청에 가깝고, 그리스어 평행구가 ‘훈련받지 못한 사람들’의 뜻을 지지하므로, 더 완곡하지만 본문 맥락에 맞는 표현을 택했습니다.
  doctrine_reference: 'Translation philosophy: source-plain-sense priority; preserve pedagogical context over moralized paraphrase.'
