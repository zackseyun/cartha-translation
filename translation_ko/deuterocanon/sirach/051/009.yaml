base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/051/009.yaml
  text: And I raised my voice from the earth[b][a], and from the gates of Sheol I cried out.
  footnotes:
  - marker: a
    text: Or 'from the land.' The Hebrew reads 'from the earth/land,' while the Greek parallel reflects 'upon the earth,' indicating a minor divergence in the witnesses.
    reason: textual_variant
  - marker: b
    text: '''Sheol'' is the Hebrew term for the realm of the dead; alternatively, ''the grave'' or ''the underworld.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 땅에서 내 목소리를 높였고, 스올의 문들에서 나는 부르짖었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘땅’ 또는 ‘땅 위’로도 옮길 수 있습니다. 히브리어는 ‘땅/땅에서’에 가깝고, 그리스어 평행문은 ‘땅 위에서’로 읽혀 본문 전승 사이에 작은 차이가 있습니다.
    reason: textual_variant
  - marker: b
    text: ‘스올’은 죽은 자들의 영역을 가리키는 히브리어 용어로, ‘무덤’이나 ‘저승’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָרִים / קוֹלִי
  english_pob_choice: I raised my voice
  chosen_korean: 내 목소리를 높였고
  alternatives_korean:
  - 내 목소리를 들어 올렸고
  - 내 소리를 높였고
  lexicon: HALOT
  rationale: רום의 사역적 용법을 한국어의 자연스러운 ‘목소리를 높이다’로 옮겨, ‘my voice’를 유지하면서도 고통의 외침이라는 문맥을 과장 없이 살렸습니다.
- source_word: מֵאֶרֶץ
  english_pob_choice: from the earth
  chosen_korean: 땅에서
  alternatives_korean:
  - 땅으로부터
  - 땅에서부터
  lexicon: HALOT
  rationale: 문맥상 출발점을 나타내는 מן + אֶרֶץ를 현대 한국어의 간결한 ‘땅에서’로 옮겼습니다. ‘땅/지면’보다 시적이면서도 원문 범위를 무리 없이 보존합니다.
- source_word: שְׁאוֹל
  english_pob_choice: Sheol
  chosen_korean: 스올
  alternatives_korean:
  - 음부
  - 무덤
  - 저승
  lexicon: HALOT
  rationale: 히브리어 고유 개념을 보존하기 위해 음역 ‘스올’을 유지했습니다. ‘무덤’이나 ‘저승’은 범위를 좁히거나 후대 개념을 덧씌울 수 있습니다.
- source_word: שִׁוַּעְתִּי
  english_pob_choice: I cried out
  chosen_korean: 부르짖었습니다
  alternatives_korean:
  - 소리쳤습니다
  - 간청했습니다
  - 도와 달라고 외쳤습니다
  lexicon: HALOT
  rationale: שוע의 탄원적 외침을 한국어의 성경적이면서도 현대적인 ‘부르짖다’로 옮겼습니다. 영어의 ‘cried out’와 대응하면서도 도움을 구하는 절박함을 자연스럽게 전달합니다.
theological_decisions:
- issue: 스올의 의미를 어떻게 처리할지
  chosen_reading: ‘스올’을 음역으로 보존해 죽은 자들의 영역을 구체적이면서도 해석을 열어 둔 표현으로 남겼습니다.
  alternative_readings:
  - 무덤
  - 저승
  - 음부
  rationale: 본문은 사후 세계의 범주를 단정하기보다 시적·신학적 긴장을 유지합니다. 음역은 독자가 히브리어 개념 자체를 접하도록 하면서도 후대 교리적 축소를 피합니다.
  doctrine_reference: 'DOCTRINE.md: preserve theological tension rather than resolve it'
