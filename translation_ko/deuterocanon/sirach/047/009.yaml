base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/047/009.yaml
  text: With songs in the gardens he made preparation before the altar[b][a], and he arranged the sound of psalm and harps.
  footnotes:
  - marker: a
    text: Hebrew 'with songs in the gardens' is uncertain. The Greek parallel reads, 'he stationed singers opposite the altar, and by their sound to sweeten melodies,' suggesting a different underlying text or a corrupt Hebrew phrase.
    reason: textual_variant
  - marker: b
    text: Or 'lyres' for 'harps'; the Hebrew term denotes a stringed instrument.
    reason: lexical_alternative
translation:
  language: ko
  text: 뜰의 노래로[a] 그는 제단 앞에서 준비를 갖추었고, 시편과 수금[b]의 소리를 정돈하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 전승된 히브리어의 ‘뜰의 노래’는 불확실합니다. 그리스어 평행문은 ‘그는 제단 맞은편에 노래하는 이들을 세우고, 그들의 소리로 선율을 부드럽게 하였다’고 하므로, 다른 저본이나 훼손된 히브리어를 가리킬 수 있습니다.
    reason: textual_variant
  - marker: b
    text: ‘수금’은 현악기를 가리키는 말로, ‘하프’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בגינות שיר
  english_pob_choice: With songs in the gardens
  chosen_korean: 뜰의 노래로
  alternatives_korean:
  - 정원의 노래로
  - 노래와 함께
  lexicon: HALOT
  rationale: 전승된 히브리어 구문이 난해하므로, 본문 표면의 בגינות를 살려 ‘뜰/정원’ 계열로 옮기되, 문맥상 음악적 표현임을 드러내도록 ‘노래로’를 붙였습니다.
- source_word: הכין
  english_pob_choice: made preparation
  chosen_korean: 준비를 갖추었고
  alternatives_korean:
  - 준비하였고
  - 마련하였고
  - 갖추었고
  lexicon: HALOT
  rationale: 단순한 ‘준비하다’보다 의례적·조직적 뉘앙스를 살리기 위해 ‘준비를 갖추다’로 옮겼습니다.
- source_word: מזמור
  english_pob_choice: psalm
  chosen_korean: 시편의 소리
  alternatives_korean:
  - 시의 소리
  - 찬송의 소리
  - 노래의 소리
  lexicon: HALOT
  rationale: מזמור은 예배적 노래를 가리키므로, 한국어에서도 전례적 울림이 있는 ‘시편’으로 옮기되, 이어지는 קול과 결합해 ‘소리’로 자연스럽게 풀었습니다.
- source_word: ונבלים
  english_pob_choice: and harps
  chosen_korean: 수금들을
  alternatives_korean:
  - 하프들을
  - 거문고들을
  - 현악기들을
  lexicon: HALOT
  rationale: נבלים는 현악기를 가리키며, 한국어 성경 전통에서 가장 널리 통용되는 ‘수금’을 채택했습니다. 단수보다 복수형이 원문의 복수 접속을 잘 반영합니다.
theological_decisions:
- issue: 히브리어 난구와 그리스어 평행문의 관계
  chosen_reading: 본문은 전승된 히브리어를 따라 ‘뜰의 노래’와 ‘제단 앞’ 표현을 유지하고, 그리스어가 제시하는 ‘성가대 배치’ 의미는 각주로만 드러냅니다.
  alternative_readings:
  - 그는 제단 맞은편에 노래하는 이들을 세우고, 그들의 소리로 선율을 부드럽게 하였습니다.
  rationale: 시락 47:9는 히브리어와 그리스어가 상당히 어긋나므로, 한쪽을 무의식적으로 조화시키지 않고 원전 증거의 긴장을 보존하는 것이 번역 원칙에 부합합니다.
  doctrine_reference: 'PHILOSOPHY.md: 원전 우선성과 본문 불확실성의 투명한 표기'
