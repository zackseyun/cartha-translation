    text: 그리스어 평행본문은 “당신의 이름이 먼 섬들에 이르렀고, 당신은 당신의 평화 가운데서 사랑을 받으셨습니다”라고 전합니다. 이는 현존 히브리어와 상당히 다른 본문형입니다.
    reason: textual_variant
