translation:
  language: ko
  text: 당신은 지혜로 땅을 덮으셨고, 높은 곳들을 찬양의 노래로 채우셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 평행본문은 “당신의 이름이 먼 섬들에 이르렀고, 당신은 당신의 평강 안에서 사랑받으셨습니다”라고 전합니다. 이는 현존 히브리어와 상당히 다른 본문형입니다.
    reason: textual_variant
lexical_decisions:
- source_word: כסית
  english_pob_choice: covered
  chosen_korean: 덮으셨고
  alternatives_korean:
  - 가리셨고
  - 뒤덮으셨고
  lexicon: HALOT
  rationale: כסה의 기본 의미인 ‘덮다’를 살려, 지혜가 땅 전체에 널리 미친다는 이미지를 자연스럽게 옮겼습니다.
- source_word: בחכמתך
  english_pob_choice: with your wisdom
  chosen_korean: 당신의 지혜로
  alternatives_korean:
  - 당신의 지혜로써
  - 당신의 지혜로 말미암아
  lexicon: HALOT
  rationale: 전치사 ב의 도구·수단적 의미를 한국어 자연문으로 반영해 ‘~로’로 옮겼습니다.
- source_word: ותקלס
  english_pob_choice: you filled
  chosen_korean: 채우셨습니다
  alternatives_korean:
  - 울려 퍼지게 하셨습니다
  - 장식하셨습니다
  - 찬양하셨습니다
  lexicon: HALOT
  rationale: 히브리어 동사 형태가 난해하고, 바로 뒤의 ‘노래’와 결합할 때 공간을 채우는 이미지가 가장 무리 없이 맞아떨어집니다.
- source_word: שירה
  english_pob_choice: song of praise
  chosen_korean: 찬양의 노래
  alternatives_korean:
  - 노래
  - 찬양 노래
  - 찬송
  lexicon: HALOT
  rationale: 시구의 문맥상 단순한 ‘노래’보다 찬양의 성격을 분명히 드러내되, 전통 교회어보다 원문에 가까운 중립적 표현을 택했습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 평행본문의 차이
  chosen_reading: 본문은 현존하는 히브리어를 따르고, 그리스어는 대조용 이본으로만 보존합니다.
  alternative_readings:
  - 그리스어에 따라 ‘당신의 이름이 먼 섬들에 이르렀고, 당신은 당신의 평강 안에서 사랑받으셨습니다’로 옮기는 방식
  rationale: 이 단락은 히브리어와 그리스어의 내용이 크게 다르므로, 남아 있는 히브리어 본문을 본문으로 채택하되 차이는 주석으로 투명하게 남기는 것이 본 프로젝트 원칙에 맞습니다.
  doctrine_reference: 'Sirach 본문 정책: 현존 히브리어 우선, 그리스어 평행본문은 검증 자료로 사용'
