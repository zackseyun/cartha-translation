base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/047/002.yaml
  text: As the fat is set apart from the sacred offering[b][a], so was David from Israel.
  footnotes:
  - marker: a
    text: Or, more explicitly, 'As the fat set apart from the offering of well-being, so David was set apart from among the sons of Israel.' The Greek reads 'from the offering of well-being' and makes the separative sense explicit.
    reason: alternative_reading
  - marker: b
    text: The Hebrew wording is terse at 'from the sacred offering'; the Greek parallel helps clarify the sacrificial comparison.
    reason: textual_variant
translation:
  language: ko
  text: 마치 제사에서 따로 떼어 놓은 기름과 같이, 다윗도 이스라엘 가운데서 그러하였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘제사에서’처럼 압축되어 있고, 그리스어 평행본문은 ‘구원의 제물에서’라고 좀 더 분명히 말합니다.
    reason: textual_variant
  - marker: b
    text: 이 비유는 제의적으로 떼어 놓은 몫의 분리됨을 가리키므로, ‘기름’은 문자적 성분이면서도 동시에 선택된 몫의 이미지를 드러냅니다.
    reason: source_note
lexical_decisions:
- source_word: כחלב
  english_pob_choice: as the fat
  chosen_korean: 제사에서 따로 떼어 놓은 기름
  alternatives_korean:
  - 기름처럼
  - 선별된 기름처럼
  - 제물의 기름처럼
  lexicon: HALOT
  rationale: חֵלֶב은 문자적으로 ‘기름’이며, 문맥상 제사적 비유이므로 추상화하기보다 제의적 구체성을 살려 옮겼습니다.
- source_word: מורם
  english_pob_choice: set apart
  chosen_korean: 따로 떼어 놓은
  alternatives_korean:
  - 들어 올린
  - 구별된
  - 분리된
  lexicon: HALOT
  rationale: רום의 제의적 용례는 ‘들어 올리다/구별하여 떼어 두다’의 뜻을 가지므로, 현대 한국어에서 자연스럽고 분리의 의미가 드러나는 표현을 택했습니다.
- source_word: מקדש
  english_pob_choice: from the sacred offering
  chosen_korean: 제사에서
  alternatives_korean:
  - 거룩한 제물에서
  - 성물에서
  - 성소의 제물에서
  lexicon: HALOT
  rationale: 히브리어가 압축되어 있어 제의적 출처를 분명히 하되, 본문의 핵심은 성소 건물이 아니라 제사 제물의 몫이라는 점을 반영해 넓게 옮겼습니다.
- source_word: כן דוד מישראל
  english_pob_choice: so was David from Israel
  chosen_korean: 다윗도 이스라엘 가운데서 그러하였습니다
  alternatives_korean:
  - 다윗도 이스라엘에서 그러하였습니다
  - 다윗도 이스라엘 가운데서 구별되었습니다
  - 다윗도 이스라엘 중에서 그러하였습니다
  lexicon: HALOT
  rationale: 히브리어와 그리스어 병행 전승이 다윗의 구별됨을 시사하지만, 본문 자체는 ‘선택되었다’고 직접 말하지 않으므로 그 긴장을 유지하는 방향으로 번역했습니다.
theological_decisions:
- issue: 다윗의 택함을 얼마나 직접적으로 드러낼 것인가
  chosen_reading: ‘구별/분리’의 비유를 살리되, ‘하나님이 택하셨다’는 설명은 본문에 덧붙이지 않았습니다.
  alternative_readings:
  - 하나님이 이스라엘 가운데서 다윗을 택하신 것처럼
  - 다윗은 이스라엘에서 선택되어
  rationale: 이 절은 제의적 비유로 다윗의 탁월함과 구별을 암시하지만, 명시적 신학 진술까지는 하지 않으므로 본문이 말하는 만큼만 옮겼습니다.
  doctrine_reference: 본문이 직접 말하지 않는 교리적 확장을 피하고, 문맥의 함의를 보존합니다.
