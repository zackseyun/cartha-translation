base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/047/002.yaml
  text: As the fat is set apart from the sacred offering[b][a], so was David from Israel.
  footnotes:
  - marker: a
    text: Or, more explicitly, 'As the fat set apart from the offering of well-being, so David was set apart from among the sons of Israel.' The Greek reads 'from the offering of well-being' and makes the separative sense explicit.
    reason: alternative_reading
  - marker: b
    text: The Hebrew wording is terse at 'from the sacred offering'; the Greek parallel helps clarify the sacrificial comparison.
    reason: textual_variant
translation:
  language: ko
  text: 거룩한 제물에서 따로 떼어 놓은 기름처럼, 다윗도 이스라엘 자손 가운데서 그러하였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘거룩한 것에서’라는 표현을 압축하여 사용합니다. 그리스어 평행본문은 이를 ‘화목제물에서’라고 더 분명히 말합니다.
    reason: textual_variant
  - marker: b
    text: 이 비유는 제의적으로 따로 떼어 놓은 몫을 가리킵니다. 따라서 ‘기름’은 문자적인 제물의 성분인 동시에 구별된 몫의 이미지를 드러냅니다.
    reason: source_note
