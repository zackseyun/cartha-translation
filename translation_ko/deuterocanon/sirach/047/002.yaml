theological_decisions:
- issue: 다윗의 택함을 얼마나 직접적으로 드러낼 것인가
  chosen_reading: ‘구별/분리’의 비유를 살리되, ‘하나님이 택하셨다’는 설명은 본문에 덧붙이지 않았습니다.
  alternative_readings:
  - 하나님이 이스라엘 가운데서 다윗을 택하신 것처럼
  - 다윗은 이스라엘에서 선택되어
  rationale: 이 절은 제의적 비유로 다윗의 탁월함과 구별을 암시하지만, 명시적 신학 진술까지는 하지 않으므로 본문이 말하는 만큼만 옮겼습니다.
  doctrine_reference: 본문이 직접 말하지 않는 교리적 확장을 피하고, 문맥의 함의를 보존합니다.
