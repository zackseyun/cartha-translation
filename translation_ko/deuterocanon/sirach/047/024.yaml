theological_decisions:
- issue: Sirach 47:24의 압축된 히브리어와 그리스어 병행본문의 관계
  chosen_reading: 히브리어에 남아 있는 르호보암/여로보암 비판을 본문으로 두되, 그리스어가 분명히 지지하는 ‘조언으로 백성을 이탈하게 함’의 의미를 본문에 반영했습니다.
  alternative_readings:
  - 히브리어 단편을 더 문자적으로 따라 불완전한 구문으로 옮기는 방식
  - 그리스어의 ‘에브라임에게 죄의 길을 주었다’까지 본문에 포함하는 방식
  rationale: 현존 히브리어가 압축·불안정하므로, 두 전승이 공유하는 핵심 판단을 드러내면서도 확인되지 않은 그리스어 확장을 과잉 이식하지 않았습니다.
  doctrine_reference: 'Sirach 번역 원칙: 히브리어를 우선하되, 보존된 그리스어 병행본문은 실제 해석 자료로 사용하고, 불확실성은 숨기지 않습니다.'
