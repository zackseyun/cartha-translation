revisions:
- from: 그에게서 난 씨 가운데에는 어리석음의 백성과 이해가 모자란 르호보암이 남았고, 그는 자기 계략으로 백성을 반역하게 하였으며, 또 일어나—그를 기억하지 못하게 하소서—느밧의 아들 여로보암이 있었으니, 그는 죄를 짓고 이스라엘로 죄를 짓게 하였습니다.[a][b]
  to: 어리석음이 크고 분별이 부족했던 르호보암은[a] 자기 정책으로 백성이 이탈하게 하였습니다.[b] 그러다가 느밧의 아들 여로보암이 일어났으니—그의 기억이 남지 않기를 바랍니다—그는 죄를 짓고 이스라엘을 죄짓게 하였습니다.
  rationale: 그리스어의 더 긴 문맥에서 유래한 ‘그에게서 난 씨 가운데에는 … 남았고’를 삭제하여 현존 히브리어의 압축된 본문과 공유 핵심에 머물렀습니다. 르호보암에 대한 ‘어리석음이 크고 분별이 부족함’이라는 평가, 정책으로 인한 백성의 이탈, 여로보암의 죄 및 이스라엘을 죄짓게 한 사역 행위는 보존했습니다. ‘그의 기억이 남지 않기를 바랍니다’는 אל יהי לו זכר의 기원형을 자연스럽게 옮긴 것이며, 그 적용 대상의 전승상 불확실성을 본문 밖에서 단정하지 않았습니다.
