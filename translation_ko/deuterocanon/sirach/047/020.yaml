translation:
  language: ko
  text: 그대는 그대의 명예에 흠을 내고 그대의 침상을 더럽혀[a], 그대의 자손에게 분노를 불러오고 그대의 잠자리에 탄식을 가져왔습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 ‘그대의 침상’ 대신 ‘그대의 씨’를 읽습니다.
    reason: textual_variant
  - marker: b
    text: 그리스어는 마지막을 ‘그대의 어리석음에 대한 괴로움’으로 읽습니다.
    reason: textual_variant
lexical_decisions:
- source_word: ותתן מום / ἔδωκας μῶμον
  english_pob_choice: You put a blemish
  chosen_korean: 명예에 흠집을 내고
  alternatives_korean:
  - 명예에 흠을 내고
  - 명예를 더럽혀
  lexicon: HALOT; LXX μῶμος
  rationale: Hebrew의 ‘mûm’과 그리스어 ‘mōmos’는 결함·흠·오점을 뜻하므로, 한국어에서는 형식적인 ‘흠집을 내다’가 본문의 비난조와 자연스러운 관용을 함께 살립니다.
- source_word: בכבודך / ἐν τῇ δόξῃ σου
  english_pob_choice: on your honor
  chosen_korean: 명예
  alternatives_korean:
  - 영광
  - 존귀
  lexicon: HALOT
  rationale: 이 문맥에서는 개인적·왕적 체면과 존엄을 가리키므로, 교회 용어의 ‘영광’보다 ‘명예’가 더 직접적으로 대응합니다.
- source_word: ותחלל את יצועיך
  english_pob_choice: and profaned your bed
  chosen_korean: 당신의 침상을 더럽혀
  alternatives_korean:
  - 당신의 잠자리를 더럽혀
  - 당신의 침대를 더럽혀
  lexicon: HALOT
  rationale: חלל의 ‘더럽히다/속되게 하다’라는 강한 종교·도덕적 뉘앙스를 살리기 위해 ‘더럽히다’를 택했고, יצועיך는 성적 함의를 지닌 ‘침상’으로 옮겼습니다.
- source_word: להביא אף על צאצאיך
  english_pob_choice: bringing wrath on your offspring
  chosen_korean: 당신의 자손에게 분노를 불러들였습니다
  alternatives_korean:
  - 당신의 후손에게 진노를 가져왔습니다
  - 당신의 자손 위에 분노를 끌어왔습니다
  lexicon: HALOT
  rationale: 부정적 결과를 나타내는 부정사 구문이므로 ‘불러들였습니다’로 옮겨 결과성을 드러냈고, צאצאים은 혈통적 범위를 포함하는 ‘자손’이 적절합니다.
- source_word: ואנחה על משכבך
  english_pob_choice: and groaning on your couch
  chosen_korean: 당신의 잠자리에 탄식을
  alternatives_korean:
  - 당신의 침상에 탄식을
  - 당신의 자리 위에 신음
  lexicon: HALOT
  rationale: אנחה는 ‘탄식/신음’의 뜻이므로 ‘탄식’으로 옮겼고, משכב은 ‘누운 자리’의 의미를 살려 ‘잠자리’로 옮겨 앞의 ‘침상’과의 반복을 피했습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 본문의 마지막 절 차이
  chosen_reading: 본문은 히브리어의 ‘침상/잠자리’ 이미지를 따라 번역하되, 그리스어 전승의 ‘네 어리석음’이라는 변이를 반영한 대조는 각주로 남기지 않고 본문 의미를 우선했습니다.
  alternative_readings:
  - 그리스어처럼 ‘당신의 어리석음 위에 탄식’으로 옮길 수 있습니다.
  rationale: 이 절은 성적·언약적 배반의 결과를 육체적/가정적 공간 이미지로 연결하는 구조가 분명하므로, 현존 히브리어를 주본문으로 따르는 것이 독자에게 가장 투명합니다.
  doctrine_reference: 본문비평 / 지혜문학의 보응 구조
