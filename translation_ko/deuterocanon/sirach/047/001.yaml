translation:
  language: ko
  text: 그의 뒤를 이어 나단이 일어나 다윗 앞에 섰습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '그리스어 병행문: ‘나단이 일어나 다윗 시대에 예언했습니다.’ 히브리어는 ‘다윗 앞에 서다’라고 합니다.'
    reason: alternative_reading
lexical_decisions:
- source_word: וגם אחריו
  english_pob_choice: And after him
  chosen_korean: 그 뒤에
  alternatives_korean:
  - 그리고 그 뒤에
  - 그의 뒤를 이어
  lexicon: HALOT
  rationale: 앞선 인물 다음의 연속성을 한국어에서 자연스럽게 드러내면서도, 단순한 시간 부사 이상의 계승 관계를 유지합니다.
- source_word: עמד
  english_pob_choice: arose
  chosen_korean: 일어나
  alternatives_korean:
  - 섰습니다
  - 등장했습니다
  - 나섰습니다
  lexicon: HALOT
  rationale: 히브리어 기본 의미는 ‘서다’이지만, 여기서는 새 인물이 앞장서 나타나는 서술로 읽히므로 ‘일어나’가 영어 POB의 ‘arose’와 함께 동작의 개시를 잘 살립니다.
- source_word: להתיצב לפני דוד
  english_pob_choice: to stand before David
  chosen_korean: 다윗 앞에 섰습니다
  alternatives_korean:
  - 다윗 앞에 자신을 내세웠습니다
  - 다윗 앞에 나아갔습니다
  lexicon: HALOT
  rationale: 히트파엘의 ‘자기를 세우다/서다’라는 뉘앙스를 유지하면서, 궁정 또는 예언자적 출현을 한국어로 간결하게 표현합니다.
- source_word: נתן
  english_pob_choice: Nathan
  chosen_korean: 나단
  alternatives_korean:
  - 나다
  - 나탄
  lexicon: standard transliteration
  rationale: 성경 인명으로 널리 쓰이는 현대 한국어 표기를 따릅니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행문의 차이(‘다윗 앞에 서다’ vs ‘다윗 시대에 예언하다’)
  chosen_reading: 본문은 히브리어를 따라 ‘다윗 앞에 섰습니다’로 두고, 그리스어의 해석적 확장은 본문에 넣지 않습니다.
  alternative_readings:
  - 다윗 시대에 예언했습니다
  - 다윗 때에 나타났습니다
  rationale: 이 절에서는 히브리어가 살아 있는 본문이므로 주 본문은 히브리어를 따르고, 그리스어는 해석 차이로만 보존하는 편이 출처 투명성에 맞습니다.
  doctrine_reference: 'Sirach source policy: translate from extant Hebrew when available; preserve Greek parallel as audit context'
