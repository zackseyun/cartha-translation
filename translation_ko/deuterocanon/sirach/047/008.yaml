base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/047/008.yaml
  text: In all his work he gave thanks to God Most High with words of glory[a]; with all his heart he loved his Maker[b], and every day he gave thanks to him with songs.
  footnotes:
  - marker: a
    text: 'Hebrew: ''with words of glory''; Greek similarly, ''with a word of glory.'''
    reason: lexical_alternative
  - marker: b
    text: The Hebrew reads 'and every day he gave thanks to him with songs.' The Greek parallel instead reads, 'he sang praise and loved the one who made him,' lacking the explicit 'every day' phrase.
    reason: alternative_reading
translation:
  language: ko
  text: 그의 모든 일에서 그는 지극히 높으신 하나님께 영광의 말로[a] 감사하였으며, 온 마음으로 그를 지으신 분을 사랑하였고[b], 날마다 그분께 노래로 감사하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘영광의 말’이며, 그리스어도 ‘영광의 한 말/말씀’과 유사합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 이어서 ‘날마다 그에게 노래로 감사하였다’고 말하지만, 그리스어 평행본문은 ‘그를 찬양하고 그를 만드신 분을 사랑하였다’고 하며 ‘날마다’라는 표현이 없습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: בכל מעשהו
  english_pob_choice: In all his work
  chosen_korean: 그의 모든 일에서
  alternatives_korean:
  - 그의 모든 행위에서
  - 그가 한 모든 일에서
  lexicon: HALOT
  rationale: 히브리어의 포괄적 표현을 한국어로 자연스럽게 살려, 한 사람의 삶과 행위 전체를 가리키는 의미를 유지했습니다.
- source_word: נתן הודות
  english_pob_choice: he gave thanks
  chosen_korean: 감사하였으며
  alternatives_korean:
  - 감사를 드렸으며
  - 찬양하였으며
  lexicon: HALOT
  rationale: 직역보다 자연스럽게 감사의 행위를 표현하되, 단순한 찬양보다 히브리어 הודות의 감사 의미를 유지했습니다.
- source_word: לאל עליון
  english_pob_choice: to God Most High
  chosen_korean: 지극히 높으신 하나님께
  alternatives_korean:
  - 가장 높으신 하나님께
  - 지극히 높으신 분께
  lexicon: HALOT
  rationale: ‘Most High’를 표준적인 경어형으로 풀어 ‘지극히 높으신 하나님’으로 옮겨, 하나님 호칭의 위격성과 높음을 함께 드러냈습니다.
- source_word: באמרי כבוד
  english_pob_choice: with words of glory
  chosen_korean: 영광의 말로[a]
  alternatives_korean:
  - 영광의 말들로
  - 영광의 말씀으로
  lexicon: HALOT
  rationale: אמרי는 ‘말/어구’의 복수적 성격이 있으나, 한국어에서는 관용적으로 ‘영광의 말로’가 더 자연스럽고, English POB의 주석처럼 본문 어휘의 직역 가능성을 각주로 남겼습니다.
- source_word: עשהו
  english_pob_choice: his Maker
  chosen_korean: 그를 지으신 분
  alternatives_korean:
  - 그의 창조자
  - 그를 만드신 분
  lexicon: HALOT
  rationale: ‘Maker’를 한국어에서 가장 관계적으로 살릴 수 있는 표현으로 ‘그를 지으신 분’을 택해, 창조 행위와 인격적 관계를 함께 전달했습니다.
- source_word: הודה לו בזמירות
  english_pob_choice: he gave thanks to him with songs
  chosen_korean: 그분께 노래로 감사하였습니다
  alternatives_korean:
  - 그분께 찬송으로 감사하였습니다
  - 그분께 시로 감사하였습니다
  lexicon: HALOT
  rationale: זמירות는 노래/찬가의 의미이므로 ‘노래로’가 가장 직접적이며, 히브리어의 감사-찬양 결합을 한국어로 무리 없이 전달합니다.
theological_decisions:
- issue: '히브리어 본문과 그리스어 평행본문의 차이: ‘날마다’'
  chosen_reading: 히브리어 본문을 따라 ‘날마다’(every day)를 본문에 포함했습니다.
  alternative_readings:
  - 그리스어 평행본문을 따라 ‘날마다’ 없이 읽기
  - ‘계속해서’로 완화하기
  rationale: POB의 본문 우선 원칙에 따라 히브리어 전승의 명시적 표현을 본문에 두고, 그리스어는 각주로 차이를 설명하는 편이 가장 투명합니다.
  doctrine_reference: 'DOCTRINE.md: Source primacy; document divergences rather than smoothing them away.'
