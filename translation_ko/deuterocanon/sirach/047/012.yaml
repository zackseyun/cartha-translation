translation:
  language: ko
  text: 그로 말미암아 그의 뒤를 이어 총명한 아들이 일어났고, 그는 안전하게 살았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 “그 뒤에 총명한 아들이 일어났고, 그로 말미암아 그는 넓은 곳에 정착했습니다”라고 읽습니다. 히브리어 증인은 “그는 안전하게 살았습니다”라고 읽습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וּבַעֲבוּרוֹ
  english_pob_choice: Because of him
  chosen_korean: 그 때문에
  alternatives_korean:
  - 그를 위해
  - 그의 덕분에
  - 그로 말미암아
  lexicon: HALOT
  rationale: עֲבוּר/בַּעֲבוּרוֹ는 원인·연관을 나타내므로, 문맥에 맞게 인과를 분명히 하는 한국어로 옮겼습니다.
- source_word: עָמַד אַחֲרָיו
  english_pob_choice: there stood up after him
  chosen_korean: 그 뒤를 이어 … 일어났고
  alternatives_korean:
  - 그 뒤에 일어났고
  - 그를 이어 일어났고
  - 그 뒤를 이어 섰고
  lexicon: HALOT
  rationale: עָמַד는 직역하면 ‘서다’이지만, 계승 문맥에서는 ‘일어나다/나타나다’의 뜻이 적절하므로, 뒤를 잇는 흐름을 살려 표현했습니다.
- source_word: בֵּן מַשְׂכִּיל
  english_pob_choice: an intelligent son
  chosen_korean: 지혜로운 아들
  alternatives_korean:
  - 총명한 아들
  - 분별력 있는 아들
  - 이해력 있는 아들
  lexicon: HALOT
  rationale: מַשְׂכִּיל은 단순 지능보다 분별과 통찰을 지닌 사람을 가리키므로, 한국어 성경에서 자연스럽고 의미가 넓은 ‘지혜로운’으로 옮겼습니다.
- source_word: שׁוֹכֵן לָבֶטַח
  english_pob_choice: who lived in security
  chosen_korean: 안전하게 살았습니다
  alternatives_korean:
  - 안전하게 거주했습니다
  - 평안히 살았습니다
  - 안전하게 거했습니다
  lexicon: HALOT
  rationale: שׁוֹכֵן לָבֶטַח는 안전한 거주 상태를 뜻하므로, 현대 한국어에서 가장 자연스럽게 그 상태를 전달하는 ‘안전하게 살았습니다’를 선택했습니다.
theological_decisions:
- issue: 후대 아들의 번영이 선대 인물과 맺는 관계
  chosen_reading: 본문은 아들이 그 뒤를 이어 일어나고 안전하게 살게 된 것이 ‘그 때문에’라는 인과로 연결된다고만 말하며, 그 이상의 해석은 덧붙이지 않았습니다.
  alternative_readings:
  - 왕조적 승계의 축복을 더 강하게 드러내는 표현으로 읽을 수 있습니다.
  - 칠십인역의 ‘넓은 곳/넓음’ 이미지를 반영해 번영의 공간성을 강조할 수도 있습니다.
  rationale: 히브리어와 그리스어 모두 선대 인물과 후대 아들의 상태를 연결하지만, 본문이 말하지 않는 역사적·신학적 세부는 확정하지 않고 보존했습니다.
  doctrine_reference: 본문의 인과 관계를 유지하되 과잉 해석을 피함.
