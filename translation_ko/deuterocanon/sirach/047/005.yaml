translation:
  language: ko
  text: 그가 지극히 높으신 하나님께 부르짖으니, 하나님께서 그의 오른손에 능력을 주셔서 전쟁에 능한 자를 물리치고 이스라엘의 뿔을 높이게 하셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘뿔’은 성경에서 힘, 영예, 권세를 가리키는 상징입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘그의 오른손에 능력을 주셨다’는 표현을 사용합니다.
    reason: source_note
lexical_decisions:
- source_word: כי קרא אל אל עליון / ἐπεκαλέσατο γὰρ Κύριον τὸν ὕψιστον
  english_pob_choice: called on God Most High / the Lord Most High
  chosen_korean: 지극히 높으신 하나님께 부르짖으니
  alternatives_korean:
  - 지극히 높으신 하나님을 불렀으니
  - 주님, 지극히 높으신 분께 부르짖으니
  lexicon: HALOT; LXX parallel
  rationale: 히브리어의 אל עליון과 그리스어의 Κύριον τὸν ὕψιστον 사이의 차이를 반영하되, 본문은 ‘부르짖다/부르다’의 간구 의미를 살려 자연스럽게 옮겼습니다.
- source_word: ויתן בימינו עז
  english_pob_choice: he gave strength to his right hand
  chosen_korean: 하나님께서 그의 오른손에 능력을 주셔서
  alternatives_korean:
  - 그의 오른손에 힘을 주셔서
  - 그의 오른손에 강함을 주셔서
  lexicon: HALOT
  rationale: 직역의 손 이미지와 함께 전투를 위한 능력 부여라는 관용적 의미를 보존했습니다.
- source_word: להדוף את איש יודע מלחמות
  english_pob_choice: to drive back a man skilled in war
  chosen_korean: 전쟁에 능한 자를 물리치고
  alternatives_korean:
  - 전쟁을 아는 사람을 밀어내고
  - 전투에 익숙한 사람을 격퇴하고
  lexicon: HALOT
  rationale: ‘알다’의 직역보다 군사적 숙련을 드러내는 한국어가 더 분명하여, 과도한 해석 없이 ‘물리치다’로 옮겼습니다.
- source_word: ולְהרים את קרן ישראל
  english_pob_choice: and to raise up the horn of Israel
  chosen_korean: 이스라엘의 뿔을 높이게 하셨습니다
  alternatives_korean:
  - 이스라엘의 뿔을 들어 올리게 하셨습니다
  - 이스라엘의 권세를 높이게 하셨습니다
  lexicon: HALOT
  rationale: ‘뿔’은 성경적 상징을 유지해야 하므로 이미지 자체를 살리고, 의미는 문맥상 높임과 권세의 회복으로 전달했습니다.
theological_decisions:
- issue: אל עליון의 신명 표현과 LXX의 κύριος 병행
  chosen_reading: 지극히 높으신 하나님
  alternative_readings:
  - 지극히 높으신 주님
  - 지극히 높으신 하나님이신 주님
  rationale: 히브리어 본문의 ‘하나님 Most High’를 우선하되, 그리스어 병행본문의 ‘주/주님’ 뉘앙스를 훼손하지 않도록 ‘지극히 높으신’이라는 수식으로 공통 의미를 살렸습니다.
  doctrine_reference: Original-language primacy; contested divine-title renderings
- issue: ‘이스라엘의 뿔’의 상징성 보존
  chosen_reading: 이스라엘의 뿔
  alternative_readings:
  - 이스라엘의 힘
  - 이스라엘의 권세
  rationale: 전형적 성경적 은유를 유지해야 하므로 의미를 풀어쓰기보다 이미지를 보존하는 쪽이 원문 의도에 더 가깝습니다.
  doctrine_reference: Biblical metaphor preservation; lexical transparency
