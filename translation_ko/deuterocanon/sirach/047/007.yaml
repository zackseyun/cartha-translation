base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/047/007.yaml
  text: He gave cities among the Philistines[b][a], and to this day he has broken their horn.
  footnotes:
  - marker: a
    text: Or possibly, 'cities from the Philistines' or 'in Philistia.' The Hebrew expression is compressed; the Greek parallel makes clear that the sense is David's lasting defeat of the Philistines.
    reason: alternative_reading
  - marker: b
    text: '''Horn'' is a biblical image for strength or power.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 블레셋 사람들 가운데에 성읍들을 주었고, 오늘날까지 그들의 뿔을 꺾었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 표현은 압축되어 있어 ‘블레셋 사람들 가운데’, ‘블레셋에서’, 또는 ‘블레셋 땅에서’로도 읽을 수 있습니다. 그리스어 병행 본문은 이 구절을 블레셋 세력의 지속적인 패배로 이해하게 합니다.
    reason: alternative_reading
  - marker: b
    text: ‘뿔’은 성경에서 힘이나 권세를 가리키는 상징입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ויתן
  english_pob_choice: he gave
  chosen_korean: 주셨고
  alternatives_korean:
  - 주었고
  - 내어주셨고
  - 두셨고
  lexicon: HALOT
  rationale: נתן의 기본 의미를 살리되, 문맥상 다윗의 행위를 높이는 서술이므로 평서형보다 존대 서술인 ‘주셨고’로 옮겼습니다.
- source_word: בפלשתים
  english_pob_choice: among the Philistines
  chosen_korean: 블레셋 사람들 가운데에
  alternatives_korean:
  - 블레셋 사람들 가운데
  - 블레셋에서
  - 블레셋 땅에서
  lexicon: HALOT
  rationale: 히브리어의 압축된 ב+민족명 표현을 직역하되, 영어 POB의 해석처럼 블레셋 영역/관계 안에 놓인 성읍들임을 살려 ‘가운데에’로 옮겼습니다.
- source_word: ערים
  english_pob_choice: cities
  chosen_korean: 성읍들
  alternatives_korean:
  - 도시들
  - 마을들
  lexicon: HALOT
  rationale: 군사·정치적 맥락에서 עיר는 단순한 ‘마을’보다 ‘성읍’이 더 적절하며, 한국어 성경어휘에서도 자연스럽습니다.
- source_word: שבר קרנם
  english_pob_choice: has broken their horn
  chosen_korean: 그들의 뿔을 꺾으셨습니다
  alternatives_korean:
  - 그들의 뿔을 깨뜨리셨습니다
  - 그들의 힘을 꺾으셨습니다
  - 그들의 권세를 꺾으셨습니다
  lexicon: HALOT
  rationale: ‘뿔’은 히브리어와 그리스어 κέρας가 함께 지지하는 상징을 보존해야 하므로 본문에는 은유를 유지하고, 한국어 관용에 맞게 동작 동사 ‘꺾다’로 권세의 꺾임을 드러냈습니다.
theological_decisions:
- issue: ‘뿔’의 상징성과 지속 완료 표현
  chosen_reading: ‘오늘날까지’와 함께 ‘그들의 뿔을 꺾으셨습니다’로 번역해, 지속된 패배와 권세의 상실이라는 역사적·상징적 의미를 함께 드러냈습니다.
  alternative_readings:
  - 그들의 힘을 꺾으셨습니다
  - 그들의 권세를 무너뜨리셨습니다
  rationale: 히브리어와 그리스어 모두 ‘뿔’ 이미지를 유지하므로, 이를 평면적인 ‘힘/권세’로 바꾸면 본문의 시적·상징적 긴장이 약해집니다. 다만 한국어 자연성을 위해 동사는 관용적으로 ‘꺾다’를 택했습니다.
  doctrine_reference: 원문 우선 원칙; 시적 은유 보존
