  text: You were called by the honored name, the one invoked over Israel; and you amassed gold like iron, and multiplied silver like lead.
  footnotes:
  - marker: a
    text: Or 'the name called over Israel.' The Hebrew idiom can denote a name invoked upon, belonging to, or resting over someone; the Greek parallel likewise supports this sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 너는 존귀한 이름으로 불렸습니다. 곧 이스라엘 위에 불린 그 이름입니다. 그리고 금을 철같이 모으고, 은을 납같이 많게 하셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 '이스라엘 위에 불린 이름'이라는 뜻으로, 이름이 누구에게 속하거나 그 위에 머무는 관용적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נקראת בשם הנכבד
  english_pob_choice: You were called by the honored name
  chosen_korean: 존귀한 이름으로 불렸습니다
  alternatives_korean:
  - 영예로운 이름으로 불렸습니다
  - 존귀하신 이름으로 불렸습니다
  lexicon: HALOT
  rationale: 수동형 '불렸습니다'로 소명/호칭의 뉘앙스를 살리고, הנכבד는 '존귀한'으로 옮겨 이름의 무게와 존엄을 드러냈습니다.
- source_word: הנקרא על ישראל
  english_pob_choice: the one invoked over Israel
  chosen_korean: 이스라엘 위에 불린 그 이름입니다
  alternatives_korean:
  - 이스라엘 위에 불려진 그 이름입니다
  - 이스라엘에 대하여 불린 그 이름입니다
  lexicon: HALOT
  rationale: '''הנקרא על''의 관용구를 직역에 가깝게 ''위에 불린''으로 옮겨, 이름이 이스라엘에 속하거나 덮이는 의미를 보존했습니다.'
- source_word: כברזל זהב
  english_pob_choice: gold like iron
  chosen_korean: 금을 철같이
  alternatives_korean:
  - 금을 철처럼
  - 철같이 금을
  lexicon: HALOT
  rationale: 히브리어의 비교문을 간명하게 살려 금의 풍성함을 철처럼 흔한 것으로 대비했습니다.
- source_word: וכעפרת הרבית כסף
  english_pob_choice: and multiplied silver like lead
  chosen_korean: 은을 납같이 많게 하셨습니다
  alternatives_korean:
  - 은을 납처럼 많게 하셨습니다
  - 은을 납같이 불리셨습니다
  lexicon: HALOT
  rationale: עפרת를 그리스어 μόλιβος와 맞추어 '납'으로, הרבית는 '많게 하셨습니다'로 옮겨 축적의 의미를 자연스럽게 드러냈습니다.
theological_decisions:
- issue: 이스라엘 위에 불린 이름의 의미
  chosen_reading: 이 표현은 이스라엘에 속하거나 이스라엘을 덮는 하나님의 이름을 가리키되, 그 정확한 신학적 메커니즘은 단정하지 않았습니다.
  alternative_readings:
  - 이스라엘이 하나님의 이름으로 불린다는 뜻
  - 솔로몬/이스라엘 위에 여호와의 이름이 선포되었다는 뜻
  rationale: 히브리어 관용구와 그리스어 병행본문이 모두 '이름이 위에 불림'을 지지하지만, 본문은 그 관계를 더 풀어 설명하지 않으므로 긴장을 보존했습니다.
  doctrine_reference: 해석을 확정하지 않고 관용구의 여운을 유지합니다.
