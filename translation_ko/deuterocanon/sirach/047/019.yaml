translation:
  language: ko
  text: 그대는 여자들에게 그대의 힘을 내주었고, 그들이 그대의 몸을 지배하게 하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 כסלך는 뜻이 확실하지 않습니다. 그리스어 병행구는 ‘그대의 허리’를 뜻하는 τὰς λαγόνας σου를 읽어, 이 구절의 신체적·성적 의미를 분명히 합니다.
    reason: source_note
lexical_decisions:
- source_word: כסלך
  english_pob_choice: your strength
  chosen_korean: 당신의 힘
  alternatives_korean:
  - 당신의 허리
  - 당신의 기력
  - 당신의 어리석음
  lexicon: HALOT
  rationale: 히브리어 כסלך는 난해하지만, 문맥상 여성들에게 성적·신체적 힘을 내어준다는 책망이므로 ‘힘’이 영어 POB의 의도를 가장 자연스럽게 반영합니다. ‘허리’는 히브리어/그리스어의 육체적 뉘앙스를 살리지만 한국어에서는 지나치게 해부학적일 수 있어 본문에서는 덜 직접적인 ‘힘’을 택했습니다.
- source_word: ותתן לנשים
  english_pob_choice: You gave ... to women
  chosen_korean: 여자들에게 ... 내주었고
  alternatives_korean:
  - 여자들에게 ... 주었고
  - 여자들에게 ... 넘겨주었고
  - 여자들을 위해 ... 주었고
  lexicon: HALOT
  rationale: נתן의 직접적 의미를 살리되, 여기서는 단순한 ‘주다’보다 통제권을 양도하는 뉘앙스가 강하므로 ‘내주다’가 더 적합합니다. 전반의 책망조를 유지하면서도 한국어로 자연스럽습니다.
- source_word: ותמשילם
  english_pob_choice: let them rule
  chosen_korean: 그들이 ... 지배하게 하였습니다
  alternatives_korean:
  - 그들이 ... 다스리게 하였습니다
  - 그들에게 ... 지배권을 주었습니다
  - 그들이 ... 군림하게 하였습니다
  lexicon: BDB
  rationale: המשיל은 ‘다스리게 하다/지배하게 하다’의 사역적 의미이므로, 주체가 여성들에게 권한을 넘긴 상황을 드러내는 ‘지배하게 하다’가 적절합니다. ‘군림하다’는 비난의 색채는 강하지만 현대 한국어에서 다소 문어적이어서 본문은 보다 مستقیم한 표현을 택했습니다.
- source_word: בגויתך
  english_pob_choice: over your body
  chosen_korean: 당신의 몸을
  alternatives_korean:
  - 당신의 몸 위에
  - 당신의 육체를
  - 당신의 몸에서
  lexicon: HALOT
  rationale: גויה는 ‘몸/신체’를 뜻하며, 그리스어 병행구의 σῶμα도 같은 방향을 가리킵니다. 한국어에서는 ‘지배하게 하다’와 결합할 때 목적어형 ‘당신의 몸을’이 가장 자연스럽습니다.
theological_decisions:
- issue: 히브리어 난해어 כסלך를 성적·신체적 문맥으로 읽을 것인가
  chosen_reading: ‘당신의 힘’으로 번역하되, 그 힘이 여성들에게 양도된 것으로 읽히는 책망의 흐름을 살렸습니다.
  alternative_readings:
  - ‘당신의 허리’로 더 직접적인 신체 이미지를 살리는 읽기
  - ‘당신의 어리석음’으로 추상적 도덕 비난으로 읽는 해석
  rationale: 시락 47장의 문맥은 솔로몬의 여성 관계로 인한 타락을 비난하는 대목이며, 그리스어 병행구가 ‘허리’와 ‘몸’을 명시하여 신체적/성적 뉘앙스를 분명히 합니다. 따라서 추상화된 ‘어리석음’보다는 신체적 힘의 양도라는 이해가 본문 전체에 더 부합합니다.
  doctrine_reference: Sirach 47:19 parallel witness (LXX) and source-critical handling of difficult Hebrew
- issue: 그리스어 병행구의 ἐν τῷ σώματί σου를 한국어에서 어떻게 처리할 것인가
  chosen_reading: ‘당신의 몸을 지배하게 하였습니다’로 옮겨, 단순한 ‘몸 안에서’가 아니라 지배/통제의 관계를 드러냈습니다.
  alternative_readings:
  - ‘당신의 몸 안에서’
  - ‘당신의 몸 위에’
  - ‘당신의 몸에서’
  rationale: 그리스어는 몸에 대한 지배를 강하게 시사하며, 히브리어 גם/ב 구조보다 관계적 의미가 더 중요합니다. 한국어에서는 목적어와 사역을 결합해 지배의 성격을 분명히 해야 본문 경고의 힘이 살아납니다.
  doctrine_reference: Source-text alignment with Hebrew base text informed by Greek parallel
