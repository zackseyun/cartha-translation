base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/047/010.yaml
  text: He gave splendor[a], beauty, and glory to the festivals year after year; when they praised his holy name[b], before morning the court resounded.
  footnotes:
  - marker: a
    text: The final clause is difficult in the surviving Hebrew. The Greek parallel reads, 'and from early morning the sanctuary resounded,' which likely preserves the intended sense of the line.
    reason: textual_variant
  - marker: b
    text: Or, more literally from the Hebrew honor-cluster, 'majesty, beauty, and honor.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 해마다 절기들에 영화와 아름다움과 영예를 주셨습니다[a]. 사람들이 그의 거룩한 이름을 찬양할 때[b], 이른 아침부터 성소가 울려 퍼졌습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 마지막 행은 보존된 히브리어가 난해하므로, 그리스어 병행문은 ‘이른 아침부터 성소가 울려 퍼졌다’는 뜻을 지지합니다.
    reason: textual_variant
  - marker: b
    text: 히브리어의 명예어군을 더 직역하면 ‘위엄과 아름다움과 영예’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ויתן
  english_pob_choice: He gave
  chosen_korean: 주셨습니다
  alternatives_korean:
  - 주었습니다
  - 베푸셨습니다
  - 부여하셨습니다
  lexicon: HALOT
  rationale: נתן의 기본 뜻인 ‘주다’를 살리되, 문맥상 절기들에 명예를 더하시는 행위를 자연스럽게 나타내기 위해 공손한 서술형 ‘주셨습니다’를 택했습니다.
- source_word: הוד פאר וכבוד
  english_pob_choice: splendor, beauty, and glory
  chosen_korean: 영화와 아름다움과 영예
  alternatives_korean:
  - 장엄함과 아름다움과 영예
  - 영광과 아름다움과 존귀
  - 위엄과 아름다움과 영예
  lexicon: HALOT
  rationale: 히브리어의 명예-찬란함 어군을 한쪽으로만 평준화하지 않고, הוד/פאר/כבוד의 중첩을 ‘영화, 아름다움, 영예’로 각각 드러내어 원문의 밀도를 유지했습니다.
- source_word: בהללו את שם קדשו
  english_pob_choice: when they praised his holy name
  chosen_korean: 사람들이 그의 거룩한 이름을 찬양할 때
  alternatives_korean:
  - 그의 거룩한 이름을 찬양하면서
  - 그의 거룩한 이름을 찬양할 때에
  - 그들이 그의 거룩한 이름을 찬양할 때
  lexicon: HALOT
  rationale: בהללו를 시간 부사절로 읽는 해석을 따르며, ‘his holy name’은 한국어에서 가장 자연스러운 경배 표현인 ‘거룩한 이름’으로 옮겼습니다.
- source_word: לפני בקר ירן משפט
  english_pob_choice: before morning the court resounded
  chosen_korean: 이른 아침부터 성소가 울려 퍼졌습니다
  alternatives_korean:
  - 새벽부터 성소가 울려 퍼졌습니다
  - 아침이 되기 전에 법정이 울려 퍼졌습니다
  - 이른 아침부터 뜰이 울려 퍼졌습니다
  lexicon: HALOT
  rationale: 히브리어 말미는 난해하므로, 그리스어 병행구의 ἀπὸ πρωῒ ἠχεῖν τὸ ἁγίασμα를 따라 ‘이른 아침부터’와 ‘성소가 울려 퍼졌습니다’로 옮겨, 예배의 소리가 성전에서 시작된다는 뜻을 살렸습니다.
theological_decisions:
- issue: 난해한 마지막 행의 처리
  chosen_reading: 히브리어 본문을 기본으로 하되, 그리스어 병행문이 보여 주는 성전 예배의 의미를 따라 마지막 구절을 해석적으로 정리했습니다.
  alternative_readings:
  - 히브리어를 더 문자적으로 따라 ‘아침 전에 심판/법도가 울려 퍼졌다’고 옮기는 방식
  rationale: 이 절은 보존된 히브리어가 압축·훼손된 흔적을 보이므로, 본문 의미를 보강하는 병행 그리스어를 반영하는 것이 독자가 이해할 핵심 의미를 더 잘 보존합니다.
  doctrine_reference: Sirach 47:10의 히브리어-그리스어 병행 본문 처리 원칙
