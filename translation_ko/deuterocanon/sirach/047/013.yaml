  text: Solomon reigned in days of peace[a], and God gave him rest on every side, so that he might build a house for his name and prepare a sanctuary forever.
  footnotes:
  - marker: a
    text: 'The extant Hebrew line is shorter: ''Solomon reigned in days of peace, and God gave him rest on every side.'' The Greek parallel adds the purpose clause about building a house for God''s name and preparing a sanctuary forever.'
    reason: textual_variant
translation:
  language: ko
  text: 솔로몬은 평화의 날들에 다스렸고[a], 하나님은 그에게 사방에 휴식을 주셔서, 그가 하나님의 이름을 위한 집을 짓고 영원한 성소를 준비하게 하셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 현존 히브리어 본문은 더 짧으며, “솔로몬은 평화의 날들에 다스렸고, 하나님은 그에게 사방에 휴식을 주셨다”까지를 전합니다. 그리스어 병행본문은 “그가 하나님의 이름을 위한 집을 짓고 영원한 성소를 준비하게 하셨다”는 목적절을 덧붙입니다.
    reason: textual_variant
lexical_decisions:
- source_word: שְׁלֹמֹה / Σαλωμὼν
  english_pob_choice: Solomon
  chosen_korean: 솔로몬
  alternatives_korean:
  - 솔로몬왕
  lexicon: 고유명사 표기
  rationale: 통용되는 성경 고유명사 형태를 따랐습니다.
- source_word: מלך / ἐβασίλευσεν
  english_pob_choice: reigned
  chosen_korean: 다스렸고
  alternatives_korean:
  - 통치하였고
  - 왕으로 있었습니다
  lexicon: HALOT; LSJ
  rationale: 단순 신분보다 왕으로서의 행위를 드러내는 동사를 택해 ‘reigned’의 동작성과 자연스러움을 살렸습니다.
- source_word: בימי שלוה / ἐν ἡμέραις εἰρήνης
  english_pob_choice: in days of peace
  chosen_korean: 평화의 날들에
  alternatives_korean:
  - 평화로운 날들에
  - 평강의 날들에
  lexicon: HALOT; LSJ
  rationale: 시간 구문을 그대로 살리되, ‘평화’로 전쟁의 부재라는 뜻을 분명히 했습니다.
- source_word: ו... הניח לו מסביב / κατέπαυσεν κυκλόθεν
  english_pob_choice: gave him rest on every side
  chosen_korean: 사방에 휴식을 주셔서
  alternatives_korean:
  - 사방에 안식을 주셔서
  - 둘레에서 그를 쉬게 하셔서
  lexicon: HALOT; LSJ
  rationale: ‘rest on every side’를 자연스러운 한국어로 옮기되, 사방의 안전과 평정을 함께 드러내기 위해 ‘사방에’와 ‘휴식’을 결합했습니다.
- source_word: עַל שֵׁם / ἐπʼ ὀνόματι αὐτοῦ
  english_pob_choice: for his name
  chosen_korean: 하나님의 이름을 위한
  alternatives_korean:
  - 하나님의 이름을 위해
  - 그의 이름을 위한
  lexicon: LSJ; 성서 히브리어 관용구
  rationale: 성전 건축의 목적을 나타내는 관용구로서 ‘이름을 위한’ 구문을 직역해 유지했습니다.
- source_word: הֵיכָל / οἶκον ... ἁγίασμα
  english_pob_choice: a house ... a sanctuary
  chosen_korean: 집
  alternatives_korean:
  - 성전
  - 전
  lexicon: LSJ
  rationale: 그리스어 οἶκον을 우선 반영해 ‘집’으로 두어, 뒤의 ‘성소’와 병렬되는 목적절의 구조를 보존했습니다.
- source_word: ἁγίασμα
  english_pob_choice: sanctuary
  chosen_korean: 성소
  alternatives_korean:
  - 성역
  - 거룩한 곳
  lexicon: LSJ
  rationale: ἁγίασμα의 성스러운 장소 의미를 한국어 성서어휘 ‘성소’로 옮겼습니다.
theological_decisions:
- issue: 히브리어 본문이 더 짧지만 그리스어 병행본문의 성전 목적절을 본문에 포함할지 여부
  chosen_reading: 그리스어의 목적절까지 본문에 포함했습니다.
  alternative_readings:
  - 히브리어에 보존된 부분만 번역해 ‘솔로몬은 평화의 날들에 다스렸고 하나님은 그에게 사방에 휴식을 주셨습니다’로 끝맺을 수 있습니다.
  rationale: 이 절은 히브리어 전승이 짧지만, 주어진 작업 지침과 POB의 대조 전통에 따라 그리스어 병행본문의 연속 구절을 본문에 반영하는 편이 의미를 더 온전히 드러냅니다. 대신 각주로 히브리어의 짧은 독법을 투명하게 표시했습니다.
  doctrine_reference: Sir 47:13의 히브리어/그리스어 병행 본문 처리 원칙
