  source_fidelity: 그리스어 병행본문은 솔로몬이 평화의 시대에 통치했고 하나님께서 그에게 사방의 쉼을 주셔서, 하나님의 이름을 위하여 집을 세우고 영원히 있을 성소를 마련하게 하셨다는 뜻입니다. 초안의 ‘사방에 휴식을 주셔서’는 ‘사방에서/사방의’라는 범위와 ‘그에게 쉼을 주다’라는 구문을 부자연스럽게 결합합니다. 또한 στήσῃ는 여기서 ‘짓다’보다 ‘세우다’가 더 가깝습니다.
  naturalness: ‘평화의 날들’과 ‘사방에 휴식을 주셔서’는 현대 표준어 합쇼체 성경 문장으로 다소 어색합니다. ‘평화로운 시대에’, ‘사방에서 평안을 누리게 하셔서’로 옮기면 뜻과 문체가 자연스럽습니다. 목적절은 ‘~하도록 하셨습니다’로 처리하여 원문의 목적 관계를 분명히 했습니다.
