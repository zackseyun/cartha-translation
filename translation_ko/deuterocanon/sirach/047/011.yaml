base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/047/011.yaml
  text: Yahweh also passed over his transgression[a], and exalted his horn forever; he gave him a decree of kingship[b], and established his throne in Jerusalem.
  footnotes:
  - marker: a
    text: 'Greek: ''The Lord removed his sins.'' The Hebrew more literally says ''passed over his transgression.'''
    reason: lexical_alternative
  - marker: b
    text: 'Greek: ''and gave him a covenant of kings, and a throne of glory in Israel.'' The Hebrew reads ''a statute of kingship'' and ''established his throne as far as Jerusalem.'''
    reason: alternative_reading
translation:
  language: ko
  text: 야훼께서도 그의 죄과를 지나쳐 주시고[a], 그의 뿔을 영원히 높이셨습니다. 그에게 왕권의 법령을 주시고[b], 그의 왕좌를 예루살렘까지 굳게 세우셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '그리스어: “주님께서 그의 죄들을 없애셨다.” 히브리어 העביר פשעו는 문자적으로 그의 죄과를 ‘지나가게 하다/지나쳐 주다’라는 표현입니다.'
    reason: lexical_alternative
  - marker: b
    text: 히브리어 חוק ממלכת는 문자적으로 “왕권의 법령/규례”입니다. 또한 히브리어는 그의 왕좌를 “예루살렘까지” 굳게 세우셨다고 읽습니다. 그리스어는 “왕들의 언약”과 “이스라엘 안에 영광의 왕좌”로 다르게 읽습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יהוה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  - 하나님
  lexicon: 프로젝트 기본 용례
  rationale: 사역 대상이 되는 신명은 프로젝트 기본값에 따라 야훼로 옮겨, 히브리어 원문성과 주석 가능성을 함께 살렸습니다.
- source_word: העביר
  english_pob_choice: passed over
  chosen_korean: 지나쳐 주시고
  alternatives_korean:
  - 지나가게 하시고
  - 없애 주시고
  - 용서하시고
  lexicon: HALOT
  rationale: 히브리어의 ‘지나가다/지나치다’ 이미지를 살리면서도, 문맥상 죄과에 대한 용서의 의미가 드러나도록 옮겼습니다.
- source_word: פשעו
  english_pob_choice: his transgression
  chosen_korean: 그의 죄과
  alternatives_korean:
  - 그의 죄
  - 그의 범죄
  - 그의 반역
  lexicon: HALOT
  rationale: פשע는 단순한 일반어 ‘죄’보다 책임 있는 위반의 뉘앙스가 있어, 보다 구체적인 ‘죄과’로 옮겼습니다.
- source_word: חוק ממלכת
  english_pob_choice: a decree/statute of kingship
  chosen_korean: 왕권의 법령
  alternatives_korean:
  - 왕권의 칙령
  - 왕권의 규례
  - 왕권의 조약
  lexicon: HALOT
  rationale: 히브리어 חוק의 법적·규범적 힘을 살리면서, ממלכת를 ‘왕권’으로 풀어 왕의 통치 부여라는 뜻을 드러냈습니다.
theological_decisions:
- issue: 히브리어 전승과 그리스어 병행 전승의 차이
  chosen_reading: 본문은 살아 있는 히브리어 증거를 따라 ‘죄과를 지나쳐 주시고’와 ‘왕권의 법령’을 본문으로 두었습니다.
  alternative_readings:
  - 그의 죄를 제거하셨습니다
  - 왕들의 언약을 주셨습니다
  rationale: 그리스어 병행본의 표현과 차이가 있지만, 살아 있는 히브리어 본문이 보존하는 의미를 우선하여 번역하되, 본문 의미를 훼손하지 않는 선에서 문맥상 자연스럽게 처리했습니다.
  doctrine_reference: 원어 우선 원칙과 병행 전승의 긴장 보존
- issue: עד ירושלים의 방향성
  chosen_reading: ‘그의 왕좌를 예루살렘에 세우셨습니다’로 옮겨 문맥상 왕좌의 확립 장소를 자연스럽게 제시했습니다.
  alternative_readings:
  - 예루살렘까지 세우셨습니다
  - 예루살렘에 이르기까지 세우셨습니다
  rationale: 히브리어 עד는 문자적으로 ‘~까지’이지만, 왕좌의 설치를 말하는 문맥에서는 장소를 가리키는 표현으로 한국어 자연성을 살리는 것이 적절합니다.
  doctrine_reference: 문맥상 관용 표현의 의미 우선
