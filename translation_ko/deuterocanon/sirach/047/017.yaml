  text: With song[a], proverb, riddle, and saying[b], you astounded the peoples.
  footnotes:
  - marker: a
    text: 'Greek: ''in songs and proverbs and parables and in interpretation, lands marveled at you.'' This supports the sense of widespread astonishment and preserves ''interpretation'' as an alternative to ''eloquent saying.'''
    reason: alternative_reading
  - marker: b
    text: The Hebrew verb is difficult here; the translation follows the Hebrew wording while taking account of the Greek parallel's clearer sense, 'marveled at you.'
    reason: textual_variant
translation:
  language: ko
  text: 노래와 잠언과 수수께끼와 말로, 당신은 그 백성들을 놀라게 하셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 평행본문은 “노래들, 잠언들, 비유들, 그리고 해석 가운데”라고 읽으며, 히브리어의 ‘말’보다 더 설명적인 의미를 시사합니다.
    reason: cross_reference
  - marker: b
    text: 히브리어 동사형은 다소 난해하지만, 그리스어 평행본문은 ‘당신을 사람들이 경탄했습니다’라는 뜻을 분명히 합니다.
    reason: textual_variant
lexical_decisions:
- source_word: בשיר
  english_pob_choice: With song
  chosen_korean: 노래와
  alternatives_korean:
  - 노래로
  - 노래 안에서
  lexicon: HALOT
  rationale: ב의 수단/영역 감각을 한국어에서는 자연스러운 병렬 표현인 ‘-와’로 옮겨, 뒤의 여러 문학적 형식들과 함께 묶었습니다.
- source_word: משל
  english_pob_choice: proverb
  chosen_korean: 잠언
  alternatives_korean:
  - 속담
  - 비유
  lexicon: HALOT
  rationale: 지혜문맥의 משל은 ‘잠언’이 가장 정확하고, 한국어 성경 어휘와도 잘 맞습니다.
- source_word: חידה
  english_pob_choice: riddle
  chosen_korean: 수수께끼
  alternatives_korean:
  - 난해한 말
  - 수수문
  lexicon: HALOT
  rationale: חידה의 기본 의미인 수수께끼/난해한 말 가운데, 현대 한국어에서는 ‘수수께끼’가 가장 직접적입니다.
- source_word: ומליצה
  english_pob_choice: saying / eloquent saying
  chosen_korean: 말
  alternatives_korean:
  - 말함
  - 수사적인 말
  - 말씀
  lexicon: HALOT
  rationale: מליצה는 수사적으로 다듬어진 말, 또는 설명적 발화를 가리킬 수 있어 ‘말’로 간결하게 옮기되, 시적·수사적 뉘앙스는 문맥 전체가 유지합니다.
- source_word: הסערתה
  english_pob_choice: you astounded the peoples
  chosen_korean: 그 백성들을 놀라게 하셨습니다
  alternatives_korean:
  - 그 백성들을 뒤흔드셨습니다
  - 그 백성들을 경탄하게 하셨습니다
  lexicon: HALOT
  rationale: 히브리어 סער의 문자적 ‘소란케 하다/뒤흔들다’보다, 여기서의 병행 그리스어가 보여 주는 결과 의미인 ‘놀라게 하다’가 더 분명하므로 그 의미를 본문에 반영했습니다.
theological_decisions:
- issue: 히브리어와 그리스어 병행의 의미 조정
  chosen_reading: 히브리어의 난해한 סער형을 그대로 직역하기보다, 본문이 의도하는 ‘백성들의 놀라움’을 전면에 드러냈습니다.
  alternative_readings:
  - 백성들을 뒤흔드셨습니다
  - 백성들에게 소란을 일으키셨습니다
  rationale: 병행 본문 그리스어가 ‘놀라다/경탄하다’의 방향을 분명히 보여 주므로, 독자가 저자의 수사적 의도를 바로 이해하도록 ‘놀라게 하셨습니다’로 정리했습니다.
  doctrine_reference: 본문비평/평행본문 해석
