  source_fidelity: 히브리어의 문학 형식 열거와 난해한 동사형을 전반적으로 잘 반영했지만, מליצה를 단순히 ‘말’로 옮기면 수사적·문학적 성격이 지나치게 약화됩니다. 또한 עמים는 문맥상 ‘그 백성들’보다 ‘뭇 민족’ 또는 ‘민족들’이 더 자연스럽고 정확합니다. 동사는 그리스어 평행본문의 ‘경탄하다’를 고려하여 ‘놀라게 하였습니다’로 옮길 수 있으나, 난해함은 각주에서 유지해야 합니다.
  naturalness: ‘당신은 … 하셨습니다’는 한국어에서 대립적이거나 직접적인 인상이 있고, 역사적 인물에게 바치는 시적 호칭으로도 다소 어색합니다. ‘그대는 … 하였습니다’가 직접 호격을 보존하면서 현대 문어체 합쇼체에 더 자연스럽습니다. 각주 b의 ‘당신을 사람들이 경탄했습니다’도 어순과 결합이 부자연스러워 고쳐야 합니다.
