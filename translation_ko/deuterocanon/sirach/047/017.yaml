revisions:
- from: 노래와 잠언과 수수께끼와 말로, 당신은 그 백성들을 놀라게 하셨습니다.[a][b]
  to: 노래와 잠언과 수수께끼와 유려한 말[a]로, 그대는 뭇 민족을 놀라게 하였습니다.[b]
  rationale: 문학 형식의 열거를 유지하면서 מליצה의 수사적 성격을 ‘유려한 말’로 드러냈습니다. עמים의 일반 복수 의미는 ‘뭇 민족’으로 옮겼습니다. 히브리어 동사의 불확실성은 본문에서 과도한 직역을 피하되 각주 b에 명시하고, 그리스어의 상이한 주어(‘나라들’)와 ‘그대를 경탄하다’라는 표현도 정확히 제시했습니다. 직접 호격은 ‘그대’로 유지하여 원문의 수사적 호칭을 보존했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T19:21:37Z'
