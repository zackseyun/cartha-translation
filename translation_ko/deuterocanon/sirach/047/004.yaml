base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/047/004.yaml
  text: In his youth he struck down a warrior and removed everlasting disgrace[a]; when he raised his hand with the sling[b], he shattered the glory of Goliath.
  footnotes:
  - marker: a
    text: 'Greek: ''and removed reproach from the people.'' The Hebrew reads ''removed everlasting disgrace.'''
    reason: alternative_reading
  - marker: b
    text: Greek explicitly says 'giant' and speaks of casting down 'the boast/pride of Goliath,' clarifying that the verse refers to David's defeat of Goliath.
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 젊은 시절에 그는 전사 하나를 쳐서 넘어뜨리고 영원한 수치를 없앴으며[a], 손에 돌팔매를 들고 손을 들어 올렸을 때[b] 골리앗의 영광을 산산이 부수었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '그리스어: ‘백성에게서 수치를 제거하였다.’ 히브리어는 ‘영원한 수치’를 읽습니다.'
    reason: alternative_reading
  - marker: b
    text: 그리스어는 ‘돌팔매의 돌’과 ‘골리앗의 자랑/거만’을 더 분명히 말하여, 이 구절이 다윗의 골리앗 격퇴를 가리킴을 밝혀 줍니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בנעוריו
  english_pob_choice: In his youth
  chosen_korean: 그의 젊은 시절에
  alternatives_korean:
  - 그의 청년기에
  - 젊었을 때
  lexicon: HALOT
  rationale: 소년기보다 넓은 청년기의 시간대를 자연스럽게 살리면서, 다윗의 어린 시절을 가리키는 시간 부사로 읽히도록 했습니다.
- source_word: הכה גבור
  english_pob_choice: he struck down a warrior
  chosen_korean: 전사 하나를 쳐서 넘어뜨리고
  alternatives_korean:
  - 용사 하나를 쳐서
  - 거인 하나를 쓰러뜨리고
  lexicon: HALOT
  rationale: 히브리어의 גבור는 기본적으로 ‘용사/전사’의 뜻이므로 이를 살렸고, 결과를 암시하는 ‘쳐서 넘어뜨리고’로 전투의 종결을 자연스럽게 표현했습니다.
- source_word: ויסר חרפת עולם
  english_pob_choice: and removed everlasting disgrace
  chosen_korean: 영원한 수치를 없앴으며
  alternatives_korean:
  - 영원한 치욕을 제거하였으며
  - 세상의 수치를 없앴으며
  lexicon: HALOT
  rationale: עולם을 ‘영원한’으로, חרפה를 ‘수치’로 옮겨 히브리어의 직설성을 유지했습니다. POB의 영어가 지닌 ‘disgrace’의 의미도 함께 반영했습니다.
- source_word: בהניפו ידו על קלע
  english_pob_choice: when he raised his hand with the sling
  chosen_korean: 손에 돌팔매를 들고 손을 들어 올렸을 때
  alternatives_korean:
  - 손을 들어 돌팔매를 겨눴을 때
  - 돌팔매를 들고 손을 치켜들었을 때
  lexicon: HALOT
  rationale: 히브리어는 ‘손을 들어 올리다’와 ‘קלע(돌팔매)’의 결합으로, 던지기 직전의 동작을 가리킵니다. 한국어에서는 도구와 동작을 분명히 드러내기 위해 이렇게 풀었습니다.
- source_word: וישבר תפארת גלית
  english_pob_choice: he shattered the glory of Goliath
  chosen_korean: 골리앗의 영광을 산산이 부수었습니다
  alternatives_korean:
  - 골리앗의 자랑을 꺾었습니다
  - 골리앗의 영화(榮華)를 무너뜨렸습니다
  lexicon: HALOT
  rationale: תפארת는 ‘영광/아름다움/위엄’의 폭을 가지므로, 여기서는 패배를 통한 수치화의 뉘앙스를 살려 ‘영광’을 택했습니다. ‘산산이’는 파괴의 강도를 보강하는 한국어 표현입니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행본문의 차이(‘전사’ vs. ‘거인’, ‘영원한 수치’ vs. ‘백성의 수치’)
  chosen_reading: 주 본문은 살아 있는 히브리어 본문을 따라 ‘전사’와 ‘영원한 수치’를 유지했습니다.
  alternative_readings:
  - 거인 하나를 쳐서
  - 백성의 수치를 없앴으며
  rationale: 집회서는 히브리어가 보존된 경우 히브리어를 우선하되, 그리스어는 다윗-골리앗 문맥을 확인하는 보조 증거로 활용하는 것이 타당합니다. 따라서 본문은 히브리어의 어휘를 유지하고, 그리스어의 해석적 확장은 각주로 처리했습니다.
  doctrine_reference: 'PHILOSOPHY.md: translate from Hebrew where Sirach Hebrew survives; use Greek parallel as actual input while keeping Hebrew primary.'
