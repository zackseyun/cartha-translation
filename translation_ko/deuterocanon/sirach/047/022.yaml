base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/047/022.yaml
  text: But God will not abandon mercy[a], nor let any of his words fall to the ground. He will not cut off offspring and posterity from his chosen one[b], and he will not destroy the seed of the one who loved him.
  footnotes:
  - marker: a
    text: 'Greek parallel: ''But the Lord will certainly not abandon his mercy, and he will certainly not destroy any of his works.'' The Hebrew here instead reads, ''nor let any of his words fall to the ground.'''
    reason: textual_variant
  - marker: b
    text: Hebrew 'his chosen one' may be read from a form that could be taken as plural ('his chosen ones'), but the Greek parallel supports the singular.
    reason: alternative_reading
translation:
  language: ko
  text: 그러나 하나님은 자비를 버리지 않으시며, 그의 말씀들 가운데 하나도 땅에 떨어지게 하지 않으십니다. 그는 그의 선택받은 이의 후손과 자손을 끊지 않으시며, 그를 사랑한 이의 씨를 멸망시키지 않으십니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 병행본은 “주님은 결코 그의 자비를 버리지 않으시며, 결코 그의 일들 가운데 어떤 것도 무너뜨리지 않으실 것입니다”라고 읽습니다. 반면 히브리어는 “그의 말씀들 가운데 하나도 땅에 떨어지게 하지 않으신다”라고 합니다.
    reason: textual_variant
  - marker: b
    text: 히브리어의 표기는 단수로도, 복수로도 읽힐 여지가 있으나, 그리스어 병행본은 단수 “그의 선택받은 이”를 지지합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אל
  english_pob_choice: God
  chosen_korean: 하나님
  alternatives_korean:
  - 주님
  lexicon: HALOT
  rationale: 히브리어 본문의 אל은 여호와 표기가 아니라 일반적인 신 칭호이므로, POB의 영어처럼 한국어도 ‘하나님’으로 직접 옮기는 것이 원문에 가장 가깝습니다.
- source_word: חסד
  english_pob_choice: mercy
  chosen_korean: 자비
  alternatives_korean:
  - 인자
  - 은총
  - 인애
  lexicon: HALOT
  rationale: 이 문맥에서는 하나님이 언약적으로 베푸시는 긍휼을 가리키므로 ‘자비’가 자연스럽고, 영어 POB의 ‘mercy’와도 잘 대응합니다.
- source_word: ולא יפיל מדבריו ארצה
  english_pob_choice: nor let any of his words fall to the ground
  chosen_korean: 그의 말씀들 가운데 하나도 땅에 떨어지게 하지 않으시며
  alternatives_korean:
  - 그의 말씀들 중 하나도 땅에 떨어지게 하지 않으시며
  - 그의 말씀이 헛되게 되지 않게 하시며
  lexicon: HALOT
  rationale: 히브리어 관용구를 그대로 살려, 하나님의 말씀이 실패하거나 무효가 되지 않는다는 뜻을 한국어 관용에 너무 풀어쓰지 않고 보존했습니다.
- source_word: לבחיריו
  english_pob_choice: from his chosen one
  chosen_korean: 그의 선택받은 이의
  alternatives_korean:
  - 그의 선택받은 자의
  - 그의 선택자들의
  lexicon: HALOT
  rationale: 히브리어 형태는 단수/복수 해석 여지가 있으나, 영어 POB가 단수로 확정한 점과 문맥상 왕조적 약속을 따라 ‘선택받은 이’로 옮겼습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행본의 첫 절 어휘 차이
  chosen_reading: 히브리어 본문의 ‘하나님’과 ‘자비’를 본문에 반영했습니다.
  alternative_readings:
  - 그리스어 병행본을 따라 ‘주님’과 ‘긍휼/자비하심’을 전면화하는 읽기
  rationale: 이 절은 히브리어가 주된 본문 증거이므로, 그리스어 병행본의 Κυριος를 본문화하지 않고 히브리어의 אל과 חסד를 우선 반영했습니다. 다만 번역 전통의 긴장을 지우지 않도록 의미는 자비로 유지했습니다.
  doctrine_reference: 'POB 원칙: 원어 우선, 병행 전승은 주해적 보조 자료로 사용'
- issue: ‘선택받은 이’의 단수/복수 해석
  chosen_reading: 단수로 이해하여 ‘그의 선택받은 이’로 옮겼습니다.
  alternative_readings:
  - ‘그의 선택받은 이들’로 복수화하는 읽기
  rationale: 문맥은 다윗 계열의 한 왕조적 대표를 가리키며, 영어 POB도 그리스어 병행본을 근거로 단수 해석을 채택합니다. 따라서 한국어 본문도 단수로 유지하는 편이 원문 의도에 더 가깝습니다.
  doctrine_reference: '본문 비평: 병행 본문이 해석 방향을 지지하는 경우, 문맥에 따른 단수 해석을 우선'
