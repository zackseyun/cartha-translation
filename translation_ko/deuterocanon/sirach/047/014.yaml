translation:
  language: ko
  text: 그의 이름을 위하여 집을 준비하고, 성소를 영원히 세웠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 병행본문으로 제공된 구절은 ‘네가 젊었을 때 어떻게 지혜로워졌는지, 그리고 강물처럼 분별력으로 가득 찼는지’로 되어 있어, 여기의 히브리어 본문과 다른 행을 반영합니다.
    reason: textual_variant
lexical_decisions:
- source_word: אשר הכין
  english_pob_choice: who prepared
  chosen_korean: 준비하고
  alternatives_korean:
  - 마련하고
  - 예비하고
  - 세우고
  lexicon: HALOT
  rationale: 히브리어 הכין은 ‘준비하다, 마련하다’의 뜻이므로, 건축 자체보다 목적을 위해 갖추는 행위를 살려 ‘준비하고’로 옮겼습니다.
- source_word: בית
  english_pob_choice: house
  chosen_korean: 집
  alternatives_korean:
  - 성전
  - 집안
  - 전당
  lexicon: HALOT
  rationale: 원문은 문자적으로 ‘집’이므로, POB의 ‘house’에 맞춰 한국어도 과도한 해석을 피한 ‘집’으로 옮겼습니다.
- source_word: לשמו
  english_pob_choice: for his name
  chosen_korean: 그의 이름을 위하여
  alternatives_korean:
  - 그 이름을 위하여
  - 이름을 위해
  - 주님의 이름을 위하여
  lexicon: HALOT
  rationale: 히브리어 관용구를 직역해 ‘이름’ 표현을 보존했으며, 성전이 하나님의 이름에 속한 곳이라는 신학적 뉘앙스를 살렸습니다.
- source_word: ויצב לעד
  english_pob_choice: established forever
  chosen_korean: 영원히 세웠습니다
  alternatives_korean:
  - 영구히 세웠습니다
  - 영속하게 세웠습니다
  - 끝없이 세웠습니다
  lexicon: HALOT
  rationale: יצב의 ‘세우다, 굳게 세우다’와 לעד의 지속성을 함께 반영해, 현대 한국어에서 자연스러운 ‘영원히 세웠습니다’로 옮겼습니다.
- source_word: מקדש
  english_pob_choice: the sanctuary
  chosen_korean: 성소
  alternatives_korean:
  - 성전
  - 성역
  - 거룩한 곳
  lexicon: HALOT
  rationale: מקדש는 성스러운 구역/성소를 가리키므로, 문맥상 ‘성전’보다 원어의 공간적·신성한 성격을 덜 좁게 드러내는 ‘성소’가 적절합니다.
theological_decisions:
- issue: ‘집을 그의 이름을 위하여’라는 성전 표현의 보존
  chosen_reading: ‘성전’으로 풀어 쓰지 않고 ‘그의 이름을 위하여 집을’이라는 원문 관용구를 유지했습니다.
  alternative_readings:
  - 그를 위한 성전을
  - 주님의 이름을 위해 성전을
  rationale: 하나님의 이름이 거하는 곳이라는 성전 신학을 보존하면서, 본문이 말하는 방식 자체를 드러내기 위해 관용구를 유지했습니다.
  doctrine_reference: Translation philosophy §§1, 5
- issue: ‘לעד’의 영속성
  chosen_reading: ‘영원히’로 옮겼습니다.
  alternative_readings:
  - 항상
  - 오래도록
  - 영구히
  rationale: 본문의 찬양적·기념비적 어조를 살리면서, 성전의 역사적 파괴와 본문 표현 사이의 긴장을 본문 자체의 수사로 남겨두기 위해 직설적으로 번역했습니다.
  doctrine_reference: Translation philosophy §3
