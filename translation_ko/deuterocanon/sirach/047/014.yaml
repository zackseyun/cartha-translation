  source_fidelity: 히브리어 אשר הכין בית לשמו ויצב לעד מקדש는 솔로몬을 받는 관계절로서 ‘[하나님의] 이름을 위하여 집을 마련하고 성소를 영원히 세운 [이]’라는 뜻입니다. 초안은 핵심 동사와 영속성, 성소 표현을 대체로 충실히 반영하지만, ‘그의 이름’은 한국어에서 솔로몬의 이름으로도 읽힐 수 있어 원문의 지시 대상(하나님)을 충분히 드러내지 못합니다.
