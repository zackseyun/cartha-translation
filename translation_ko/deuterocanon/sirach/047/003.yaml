base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/047/003.yaml
  text: He played with young lions as with a kid[b][a], and with bears as with calves of Bashan.
  footnotes:
  - marker: a
    text: 'Greek: ''and with bears as with lambs of sheep,'' making the second comparison more explicit than the Hebrew ''the young of Bashan.'''
    reason: alternative_reading
  - marker: b
    text: Bashan was known for its strong, well-fed livestock; the Hebrew likely evokes tame young animals by that regional image.
    reason: cultural_note
translation:
  language: ko
  text: 그는 어린 사자들 사이에서 새끼 염소와 놀듯이 놀았고, 바산의 송아지들과는 곰들 사이에서 놀았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '그리스어: ‘양의 어린 것들처럼’으로 되어 있어, 히브리어의 ‘바산의 어린 것들’보다 두 번째 비교를 더 분명하게 풀이합니다.'
    reason: alternative_reading
  - marker: b
    text: 바산은 기름지고 힘센 가축으로 유명한 지역이어서, 본문은 순한 어린 가축의 이미지를 불러일으킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: לכפירים
  english_pob_choice: with young lions
  chosen_korean: 어린 사자들 사이에서
  alternatives_korean:
  - 젊은 사자들과
  - 새끼 사자들과
  lexicon: HALOT
  rationale: כפירים는 사자 일반보다 어린 사자, 곧 새끼 사자를 가리키므로 이를 살려 번역했고, 전치 ל는 시구의 비교·동반 관계를 자연스럽게 드러내는 ‘사이에서’로 옮겼습니다.
- source_word: שחק
  english_pob_choice: played
  chosen_korean: 놀았고
  alternatives_korean:
  - 장난쳤고
  - 희롱했고
  - 뛰놀았고
  lexicon: HALOT
  rationale: 동사는 위험한 맹수 앞에서도 두려움 없이 유희하듯 행동하는 뜻이므로, 현대 한국어에서 가장 직접적이고 과장되지 않은 ‘놀다’를 택했습니다.
- source_word: כגדי
  english_pob_choice: as with a kid
  chosen_korean: 새끼 염소와 놀듯이
  alternatives_korean:
  - 어린 염소처럼
  - 염소 새끼처럼
  lexicon: HALOT
  rationale: גדי는 어린 염소를 뜻하므로 ‘새끼 염소’로 옮겨, 비교 구문을 반복되는 동사와 함께 자연스럽게 살렸습니다.
- source_word: כבני בשן
  english_pob_choice: as with calves of Bashan / the young of Bashan
  chosen_korean: 바산의 송아지들과는
  alternatives_korean:
  - 바산의 어린 것들과는
  - 바산의 새끼들과는
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘바산의 아들들/어린 것들’이지만, 문맥상 잘 먹고 기른 가축의 이미지를 가리키는 지역명 표현으로 이해되어 ‘송아지들’로 옮겼습니다. 그리스어가 이를 더 분명히 풀어 읽는 점도 이 해석을 뒷받침합니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행본문이 두 번째 비교 대상을 다르게 풀어주는 문제
  chosen_reading: 히브리어를 본문으로 따르되, 그리스어가 암시하는 ‘순한 어린 짐승’의 뜻은 ‘바산의 송아지들’로 자연스럽게 반영했습니다.
  alternative_readings:
  - 그리스어처럼 ‘양의 어린 것들’로 옮김
  - 히브리어를 직역해 ‘바산의 어린 것들’로 둠
  rationale: 이 절은 남아 있는 히브리어가 우선이지만, 그리스어는 그 표현을 목축 이미지로 해석해 분명하게 해주므로, 본문은 히브리어의 형식을 유지하면서 의미는 그리스어가 보여 주는 안전한 어린 가축의 대비를 드러내는 쪽이 가장 균형적입니다.
  doctrine_reference: 'Sirach 번역 원칙: 보존된 히브리어를 본문 우선으로 하되, 그리스어 병행본문은 의미 확인과 해석 보조로 사용'
