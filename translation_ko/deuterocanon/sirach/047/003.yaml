  naturalness: 수정문은 현대 표준 한국어 합쇼체로, 두 절의 병행과 비교를 자연스럽고 분명하게 재현합니다. ‘새끼 염소와 놀듯이’, ‘바산의 어린 짐승들과 놀듯이’는 각각 비교 대상과 행동 대상을 혼동하지 않게 합니다.
