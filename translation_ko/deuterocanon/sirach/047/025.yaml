- from: 그는 에브라임에게 걸림돌을 주어 그들을 그들의 땅에서 몰아내게 하였으며, 그의 죄는 매우 크게 불어났고, 그는 온갖 악에 자신을 팔았습니다.[a]
  to: 그는 에브라임에게 걸림돌을 주어 그들을 그들의 땅에서 몰아내었으며, 그의 죄가 매우 커졌고, 그는 온갖 악에 자신을 팔았습니다.[a]
  rationale: 히브리어 본문의 단수 주어와 핵심 은유는 유지하되, 한국어 사역 구문의 불필요한 행위자 함의를 제거했습니다. 또한 그리스어 병행문의 보복 주체를 원문보다 좁게 특정한 각주 표현을 삭제하고, 그리스어의 복수 및 더 긴 독법을 정확히 보존했습니다.
