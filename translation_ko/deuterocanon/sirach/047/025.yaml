translation:
  language: ko
  text: 그는 에브라임에게 걸림돌을 주어 그들을 그들의 땅에서 몰아내게 하였으며, 그의 죄는 매우 크게 불어났고, 그는 온갖 악에 자신을 팔았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '그리스어: “그들의 죄가 매우 크게 불어났고 … 그들은 야훼께서 그들에게 내리실 보복이 올 때까지 온갖 악을 찾아다녔습니다.” 히브리어 증거는 여기서 더 단수적이고 짧습니다.'
    reason: textual_variant
lexical_decisions:
- source_word: ויתן
  english_pob_choice: He gave
  chosen_korean: 주어
  alternatives_korean:
  - 주셨습니다
  - 넘겨주어
  lexicon: HALOT
  rationale: 히브리어 단순 동사는 여기서 해를 끼치는 결과를 낳는 ‘줌’의 의미로 쓰였으므로, 문맥상 자연스럽게 ‘주어’로 옮기되 과도한 해석은 피했습니다.
- source_word: מכשול
  english_pob_choice: a stumbling block
  chosen_korean: 걸림돌
  alternatives_korean:
  - 장애물
  - 넘어지게 하는 것
  lexicon: HALOT
  rationale: 직역성 있는 한국어 표현으로 메타포를 살리며, 뒤따르는 ‘몰아내게 하다’와도 잘 연결됩니다.
- source_word: להדיחם
  english_pob_choice: to drive them
  chosen_korean: 몰아내게
  alternatives_korean:
  - 내쫓게
  - 추방하게
  lexicon: HALOT
  rationale: 동사의 핵심인 ‘몰아냄/떠밀어 냄’을 자연스러운 현대 한국어로 살렸습니다.
- source_word: ולכל רעה התמכר
  english_pob_choice: he sold himself to every evil
  chosen_korean: 온갖 악에 자신을 팔았습니다
  alternatives_korean:
  - 온갖 악에 몸을 내맡겼습니다
  - 모든 악에 자신을 넘겼습니다
  lexicon: HALOT
  rationale: 히브리어의 자기매매 은유를 보존해 도덕적 타락의 강도를 드러냈고, ‘자신을 팔다’라는 표현으로 원문의 비유를 살렸습니다.
theological_decisions:
- issue: 히브리어 본문의 단수 표현과 그리스어 병행문의 복수 표현 차이
  chosen_reading: 본문은 히브리어 단수인 ‘그의 죄’를 따르고, 그리스어 복수 읽기는 본문 밖에서만 참고했습니다.
  alternative_readings:
  - 그들의 죄가 매우 크게 불어났습니다
  rationale: 현존 히브리어 증거를 우선하되, 병행 그리스어가 다른 공동체적 독법을 반영할 수 있다는 점은 훼손하지 않기 위해 본문을 단수로 유지했습니다.
  doctrine_reference: 원문 우선 원칙; 사본 차이를 본문과 별개로 보존
