  lexicon: HALOT
  rationale: 히브리어 단순 동사는 여기서 해를 끼치는 결과를 낳는 ‘줌’의 의미로 쓰였으므로, 문맥상 자연스럽게 ‘주어’로 옮기되 과도한 해석은 피했습니다.
