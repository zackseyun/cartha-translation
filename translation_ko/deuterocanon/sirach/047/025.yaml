translation:
  language: ko
  text: 그는 에브라임에게 걸림돌을 주어 그들을 그들의 땅에서 몰아내었으며, 그의 죄가 매우 커졌고, 그는 온갖 악에 자신을 팔았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '그리스어: “그들의 죄가 매우 크게 늘어났고 … 그들을 그들의 땅에서 몰아내기 위해, 그들은 보복이 그들에게 이를 때까지 온갖 악을 추구했습니다.” 히브리어 증거는 여기서 더 단수적이고 짧습니다.'
    reason: textual_variant
