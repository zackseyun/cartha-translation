  text: He gave Ephraim a stumbling block[a], to drive them from their land; and his sin grew very great, and he sold himself to every evil.
  footnotes:
  - marker: a
    text: 'Greek: ''their sins multiplied greatly ... and they sought out every wickedness, until vengeance came upon them.'' The Hebrew witness here is more singular and shorter.'
