  - 한 후계자
  - 한 자손
  lexicon: HALOT
  rationale: 히브리어 형태가 불확실하므로, 왕조적 연속성을 드러내면서도 특정 관계를 과도하게 못 박지 않는 가장 넓은 표현을 선택했습니다.
theological_decisions:
- issue: 다윗 집의 지속을 ‘뿌리’로 번역하는 문제
  chosen_reading: 메시아적 해석을 직접 부가하지 않고, 다윗 가문의 이어짐이라는 문자적 의미를 그대로 살렸습니다.
  alternative_readings:
  - 메시아적 뿌리
  - 자손
  - 왕조의 계보
  rationale: 본문 자체는 다윗 왕조의 보존을 말하며, 후대 메시아적 연상을 번역문에 앞질러 넣을 필요는 없습니다. 원문이 지닌 상징적 긴장을 유지하는 것이 적절합니다.
  doctrine_reference: 원문 우선 원칙; 구속사적 연상은 주석에서 다루고 본문에서는 절제
