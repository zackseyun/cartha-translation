  lexicon: HALOT; BDAG
  rationale: 죽음을 가리키는 관용구를 자연스러운 현대 한국어로 옮기되, 공동조상과 함께한 매장/죽음의 관습적 표현을 유지했습니다.
- source_word: מנון
