  lexicon: HALOT; BDAG
  rationale: 히브리어와 그리스어 모두 문자적으로 ‘뿌리’를 뜻하므로, 해석을 덧붙이기보다 이미지 자체를 한국어로 보존했습니다.
- source_word: וישכב ... / ἀνεπαύσατο
  english_pob_choice: lay down with his fathers
  chosen_korean: 조상들과 함께 누웠고
  alternatives_korean:
