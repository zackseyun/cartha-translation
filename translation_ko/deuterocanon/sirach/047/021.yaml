  text: to divide the people into two tribes[b][a], and from Ephraim a lawless kingdom.
  footnotes:
  - marker: a
    text: 'Greek: ''for rule to become divided, and from Ephraim to begin a disobedient kingdom.'' The Hebrew more explicitly says ''to divide the people into two tribes.'''
    reason: alternative_reading
  - marker: b
    text: Or 'a violent kingdom' or 'a rebellious kingdom.' Hebrew חמס can denote violence or wrongdoing; the Greek parallel emphasizes disobedience/rebellion.
    reason: lexical_alternative
translation:
  language: ko
  text: 백성을 두 지파로 나누게 하시고, 에브라임에서는 불법한 왕국이 일어나게 하셨습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לחלק העם לשני שבטים
  english_pob_choice: to divide the people into two tribes
  chosen_korean: 백성을 두 지파로 나누게 하시고
  alternatives_korean:
  - 사람들을 두 지파로 나누게 하시고
  - 백성을 둘로 갈라 놓게 하시고
  lexicon: HALOT
  rationale: 히브리어 לחלק는 분열을 일으키는 의미이고, העם과 לשני שבטים는 공동체의 정치적 분열을 직접 가리키므로 ‘백성을 두 지파로 나누게 하시고’가 본문 구조를 가장 자연스럽게 드러냅니다.
- source_word: ומאפרים
  english_pob_choice: and from Ephraim
  chosen_korean: 에브라임에서는
  alternatives_korean:
  - 에브라임에서
  - 에브라임으로부터
  lexicon: HALOT
  rationale: מן의 공간적·출처적 뉘앙스를 살리면서도, 다음 절의 통치권 출현을 한국어에서 자연스럽게 잇기 위해 ‘에서는’로 옮겼습니다.
- source_word: ממלכת חמס
  english_pob_choice: a lawless kingdom
  chosen_korean: 불법한 왕국
  alternatives_korean:
  - 악한 왕국
  - 폭력의 왕국
  - 반역한 왕국
  lexicon: HALOT
  rationale: חמס는 폭력뿐 아니라 부정과 불의를 넓게 가리키며, 그리스어 ἀπειθῆ의 ‘불순종/반항’도 함께 비추므로, ‘불법한’이 도덕적·정치적 부당성을 함께 보존합니다.
- source_word: γενέσθαι δίχα τυραννίδα / ἄρξαι βασιλείαν ἀπειθῆ
  english_pob_choice: to divide the people into two tribes / a lawless kingdom
  chosen_korean: 백성을 두 지파로 나누게 하시고, 에브라임에서는 불법한 왕국이 일어나게 하셨습니다.
  alternatives_korean:
  - 통치가 둘로 나뉘게 하시고, 에브라임에서는 불법한 왕국이 시작되게 하셨습니다.
  - 지배가 둘로 갈라지게 하시고, 에브라임에서는 불법한 왕국이 일어나게 하셨습니다.
  lexicon: BDAG
  rationale: 그리스어 평행본문은 통치의 분열과 불순종하는 왕국의 성립을 말하지만, 히브리어가 더 분명히 ‘백성’과 ‘두 지파’를 말하므로 본문은 히브리어를 따르고 그리스어의 역사적 의미는 결과 구절 전체에서 반영합니다.
theological_decisions:
- issue: 에브라임에서 나온 왕국의 성격
  chosen_reading: 불법한 왕국
  alternative_readings:
  - 폭력한 왕국
  - 반역한 왕국
  - 불순종하는 왕국
  rationale: 히브리어 חמס와 그리스어 ἀπειθῆ가 서로 다른 결을 주므로, 하나로 단순화하지 않고 ‘불법한’으로 옮겨 정치적 정당성의 결여와 윤리적 타락을 함께 드러냈습니다.
  doctrine_reference: 문맥의 긴장을 보존하고 단일 의미로 과도하게 평탄화하지 않음
