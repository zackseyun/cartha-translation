    rationale: 원문의 רבבה는 문자적으로 ‘만/수만’의 수적 표현입니다. 일반적 다수 표현보다 ‘수만 명 가운데서’가 원문의 어휘 정보를 더 잘 보존합니다.
  - severity: medium
    issue: 각주 표지가 모두 문장 끝에 배치됨
    rationale: b는 ‘딸들이 그에게 대답하였다’에 관한 문화 주석이고 a는 צניף 및 그리스어의 관 이미지에 관한 대안 읽기입니다. 해당 단어·구절에 각각 붙여야 주석의 지시 대상이 분명해집니다.
  - severity: low
    issue: 그리스어 대안 주석에서 관이 그에게 가져와진 때라는 절이 생략됨
