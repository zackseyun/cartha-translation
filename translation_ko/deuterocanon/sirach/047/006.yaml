base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/047/006.yaml
  text: Therefore the daughters answered him[a], and acclaimed him among the myriads. When he put on the turban, he fought[b], and all around he subdued the foe.
  footnotes:
  - marker: a
    text: 'Greek: ''he glorified him in myriads, and praised him with the Lord''s blessings, when a diadem of glory was brought to him.'' This preserves a more explicitly royal image than the Hebrew ''turban.'''
    reason: alternative_reading
  - marker: b
    text: '''The daughters answered him'' likely refers to women responding in song or celebration after victory.'
    reason: cultural_note
translation:
  language: ko
  text: 그러므로 딸들이 그에게 대답하여, 수많은 무리 가운데서 그를 찬양하였습니다. 그가 터번을 쓸 때 그는 싸웠고, 사방에서 그 대적을 굴복시켰습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 ‘그를 수많은 무리 가운데서 영화롭게 하고, 주님의 복으로 그를 찬양하였다’고 하며, 그가 영광의 관을 받는 왕권적 이미지를 더 분명히 드러냅니다.
    reason: alternative_reading
  - marker: b
    text: ‘딸들이 그에게 대답하였다’는 승리 뒤의 노래나 환호를 가리킬 가능성이 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: על כן
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 그래서
  - 그런 까닭에
  lexicon: HALOT
  rationale: 앞선 서술과의 인과·결론 관계를 자연스러운 현대 한국어로 살렸습니다.
- source_word: ענו לו / בנות
  english_pob_choice: answered him / the daughters
  chosen_korean: 딸들이 그에게 대답하여
  alternatives_korean:
  - 여인들이 그에게 응답하여
  - 처녀들이 그에게 노래하여
  lexicon: HALOT
  rationale: ענה는 기본적으로 ‘대답하다/응답하다’이므로 본문어를 따라가되, celebratory한 장면은 과잉해석하지 않도록 했습니다.
- source_word: ויכנוהו ברבבה
  english_pob_choice: acclaimed him among the myriads
  chosen_korean: 수많은 무리 가운데서 그를 찬양하였습니다
  alternatives_korean:
  - 수많은 무리 가운데서 그를 칭송하였습니다
  - 만군 가운데서 그를 높였습니다
  lexicon: HALOT
  rationale: בירבבה의 수많음과 공적 찬양의 뜻을 함께 살리기 위해 ‘수많은 무리 가운데서’와 ‘찬양하였습니다’를 택했습니다.
- source_word: בעטותו צניף
  english_pob_choice: When he put on the turban
  chosen_korean: 그가 터번을 쓸 때
  alternatives_korean:
  - 그가 관을 쓸 때
  - 그가 머리에 두른 터번을 쓸 때
  lexicon: HALOT
  rationale: צניף은 기본적으로 머리에 두르는 머리쓰개이므로 ‘터번’으로 옮겼고, 동작은 자연스러운 한국어로 표현했습니다.
- source_word: נלחם
  english_pob_choice: he fought
  chosen_korean: 그는 싸웠고
  alternatives_korean:
  - 그는 전쟁하였고
  - 그는 전투하였고
  lexicon: HALOT
  rationale: 직접적이고 일반적인 전투 동사이므로 간결하게 ‘싸웠고’로 옮겼습니다.
- source_word: ומסביב הכניע צר
  english_pob_choice: and all around he subdued the foe
  chosen_korean: 사방에서 그 대적을 굴복시켰습니다
  alternatives_korean:
  - 사방에서 그 적을 굴복시켰습니다
  - 사방으로 적을 무릎꿇게 하였습니다
  lexicon: HALOT
  rationale: מסביב은 포위·주변 전체를 가리키므로 ‘사방에서’로, צר는 단수 집합적 의미를 살려 ‘대적’으로 옮겼습니다.
theological_decisions:
- issue: 히브리어 본문의 ‘터번’과 그리스어 병행문의 왕권적 이미지(‘영광의 관/diadem’)의 관계
  chosen_reading: 본문은 히브리어 증거를 따라 ‘터번’을 유지하고, 왕권적 해석은 본문에 과장해 넣지 않았습니다.
  alternative_readings:
  - 관
  - 영광의 관
  - 왕관
  rationale: 이 단락은 현존 히브리어 본문을 우선하되, 그리스어는 대안 전승으로만 반영하는 편이 사료에 더 충실합니다.
  doctrine_reference: Translation philosophy §1, §3
