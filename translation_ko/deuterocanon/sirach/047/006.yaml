- from: 그러므로 딸들이 그에게 대답하여, 수많은 무리 가운데서 그를 찬양하였습니다. 그가 터번을 쓸 때 그는 싸웠고, 사방에서 그 대적을 굴복시켰습니다.[a][b]
  to: 그러므로 딸들이 그에게 대답하였고[b], 수만 명 가운데서 그를 칭송하였습니다. 그가 터번을 쓸 때[a], 그는 싸웠고 사방에서 대적을 굴복시켰습니다.
  rationale: 히브리어 본문을 우선하여 צניף는 ‘터번’으로 유지하고, 그리스어의 ‘영광의 관’은 대안 읽기 각주로 한정했습니다. רבבה의 수적 뉘앙스를 살리고, 각주 표지를 해당 본문 구절에 재배치했으며, 그리스어 병행문의 시간 절을 보완했습니다.
