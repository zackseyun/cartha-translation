  text: He also mentioned Job[a], who upheld all the ways of righteousness.
  footnotes:
  - marker: a
    text: 'Greek parallel: ''and did good to those who make straight paths.'' The Hebrew witness instead reads ''who maintained all the ways of righteousness.'''
    reason: alternative_reading
translation:
  language: ko
  text: 그는 또한 욥을 언급했으니, 욥은 의의 모든 길을 붙들고 있었기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 병행본에는 '길을 곧게 하는 이들에게 선을 베풀었다'라고 되어 있습니다. 히브리어 증언은 '의의 모든 길을 붙들고 있었다'라고 읽습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וגם
  english_pob_choice: He also
  chosen_korean: 그는 또한
  alternatives_korean:
  - 또 그는
  - 그리고 또한
  lexicon: HALOT
  rationale: 추가 인물을 덧붙이는 연결어이므로, 한국어에서는 담담한 첨가를 나타내는 '또한'이 가장 자연스럽습니다.
- source_word: הזכיר
  english_pob_choice: mentioned
  chosen_korean: 언급했으니
  alternatives_korean:
  - 기억했으니
  - 말했으니
  lexicon: HALOT
  rationale: 히브리어 הזכיר는 '말하다/언급하다/상기시키다'의 범위가 있어, 문맥상 인물을 열거하는 흐름을 살려 '언급하다'로 옮겼습니다.
- source_word: ומכלכל
  english_pob_choice: who maintained
  chosen_korean: 붙들고 있었기 때문입니다
  alternatives_korean:
  - 유지하고 있었기 때문입니다
  - 지탱하고 있었기 때문입니다
  - 지켜 나가고 있었기 때문입니다
  lexicon: HALOT
  rationale: כלכל의 '지탱하다, 부양하다, 유지하다'는 뜻을 살리되, '의의 모든 길'과 결합할 때 행위의 지속성과 충실함을 드러내는 표현으로 옮겼습니다.
- source_word: כל דרכי צדק
  english_pob_choice: all the ways of righteousness
  chosen_korean: 의의 모든 길
  alternatives_korean:
  - 모든 의로운 길
  - 의로움의 모든 길
  - 정의의 모든 길
  lexicon: HALOT
  rationale: דרך는 '길'의 이미지가 핵심이므로 보존했고, צדק은 여기서 윤리적·언약적 '의'의 의미가 자연스러워 '의'로 옮겼습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행본의 차이
  chosen_reading: 본문은 현존 히브리어를 따라 '의의 모든 길을 붙들고 있었기 때문입니다'로 옮기고, 그리스어의 다른 전통은 각주로만 제시합니다.
  alternative_readings:
  - '''길을 곧게 하는 이들에게 선을 베풀었다'' (그리스어 병행본 반영)'
  rationale: 집회서에서는 보존된 히브리어 본문이 우선이며, 여기서는 그리스어가 의미 있게 다르므로 본문을 히브리어에 두고 대안 전통을 각주로 보존하는 것이 가장 투명합니다.
  doctrine_reference: Sirach source-priority principle
