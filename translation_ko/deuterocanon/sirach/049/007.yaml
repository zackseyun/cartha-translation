  text: to uproot and to tear down and to destroy[a], to overthrow[b]; and likewise to build and to plant and to raise high.
  footnotes:
  - marker: a
    text: The Hebrew ends with an additional positive verb, likely meaning 'to raise high,' 'to set on high,' or 'to make secure.' The Greek parallel is shorter here, ending with 'to build and to plant.'
    reason: textual_variant
  - marker: b
    text: This line deliberately echoes Jeremiah's prophetic commission in Jeremiah 1:10, though Sirach's Hebrew wording is not identical.
    reason: cross_reference
translation:
  language: ko
  text: 무너뜨리고, 허물고, 멸하고, 뒤엎기 위해서입니다[a][b]; 또한 세우고, 심고, 높이 올리기 위해서입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 그리스어 평행본문보다 하나의 긍정 동사가 더 길게 이어지며, 그 뜻은 ‘높이 올리다’, ‘세우다’, 또는 ‘견고하게 하다’일 수 있습니다.
    reason: textual_variant
  - marker: b
    text: 이 문장은 예레미야 1:10의 예언적 소명 표현을 의도적으로 떠올리게 하지만, 시락서의 히브리어 표현은 정확히 동일하지는 않습니다.
    reason: cross_reference
lexical_decisions:
- source_word: לנתוש
  english_pob_choice: to uproot
  chosen_korean: 무너뜨리고
  alternatives_korean:
  - 뿌리째 뽑고
  - 뽑아내고
  lexicon: HALOT
  rationale: נתש의 핵심은 뿌리째 뽑는다는 뜻이지만, 한국어에서는 앞의 파괴 동사들과 자연스럽게 이어지는 ‘무너뜨리다’가 전체 파괴열을 살리면서도 문맥을 매끄럽게 만듭니다.
- source_word: לנתוץ
  english_pob_choice: to tear down
  chosen_korean: 허물고
  alternatives_korean:
  - 무너뜨리고
  - 헐고
  - 부수고
  lexicon: HALOT
  rationale: 구조물을 내려뜨리는 נתץ의 구체적 파괴감을 살리기 위해 ‘허물다’를 택했습니다.
- source_word: ולהאביד
  english_pob_choice: to destroy
  chosen_korean: 멸하고
  alternatives_korean:
  - 파멸시키고
  - 없애고
  lexicon: HALOT
  rationale: האביד의 인과적 파괴 의미를 압축적으로 드러내는 말로 ‘멸하다’가 적절합니다.
- source_word: להרוס
  english_pob_choice: to overthrow
  chosen_korean: 뒤엎기 위해서입니다
  alternatives_korean:
  - 엎어뜨리기 위해서입니다
  - 전복하기 위해서입니다
  - 무너뜨리기 위해서입니다
  lexicon: HALOT
  rationale: הרס는 앞의 파괴 동사들과 겹치므로, 예언적 파견의 뉘앙스를 살리면서 반복을 피하는 ‘뒤엎다’를 택했습니다.
- source_word: ולהשגיב
  english_pob_choice: to raise high
  chosen_korean: 높이 올리기 위해서입니다
  alternatives_korean:
  - 높이 세우기 위해서입니다
  - 들어 높이기 위해서입니다
  - 견고하게 하기 위해서입니다
  lexicon: HALOT
  rationale: שגב의 상승·고양 의미를 너무 단정적으로 좁히지 않으면서, 긍정적 대구를 살리는 표현으로 옮겼습니다.
theological_decisions:
- issue: 예레미야 1:10과의 간접적 공명 유지
  chosen_reading: 파괴 동사군과 건설 동사군의 대구를 그대로 살려, 예레미야적 소명 공식이 연상되도록 했습니다.
  alternative_readings:
  - 예레미야 1:10의 한국어 표현을 더 직접적으로 맞추는 번역
  - 반복을 줄여 단순히 ‘파괴하고 세우고’로 평준화하는 번역
  rationale: 시락서의 히브리어는 예레미야를 직접 인용하지는 않지만 강한 상호본문성을 지니므로, 문장 리듬과 대비 구조를 보존하는 것이 중요합니다.
  doctrine_reference: Translation philosophy §§1, 5
- issue: 마지막 긍정 동사의 본문 반영
  chosen_reading: 히브리어의 추가 동사 ‘높이 올리기’를 본문에 포함하고, 그 어휘적 개방성을 유지했습니다.
  alternative_readings:
  - 마지막 동사를 생략하고 ‘심기 위해서입니다’로 끝맺는 번역
  - ‘견고하게 하기 위해서입니다’처럼 의미를 더 좁히는 번역
  rationale: 현존 히브리어 증언을 우선하되, 어휘를 지나치게 확정하지 않아 그리스어 평행본문의 짧은 형태와도 긴장 없이 공존하게 했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
