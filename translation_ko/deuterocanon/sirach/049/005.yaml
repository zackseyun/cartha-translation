  text: And they gave their horn backward[b][a], and their glory to a foolish foreign nation.
  footnotes:
  - marker: a
    text: Hebrew reads an unusual form here ('backward' or similar), but the Greek parallel supports the sense 'to others.'
    reason: textual_variant
  - marker: b
    text: Or 'their strength' for 'their horn'; the Hebrew and Greek both preserve the horn metaphor for power.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 그들의 뿔을 다른 이들에게 넘기고, 그들의 영광을 어리석은 외국 민족에게 주었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 이곳에서 다소 특이한 형태를 보이지만, 그리스어 병행본문은 ‘다른 이들에게’라는 뜻을 지지합니다.
    reason: textual_variant
  - marker: b
    text: ‘뿔’은 문자적 동물의 뿔이라기보다 힘과 권세를 가리키는 성서적 비유일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: קרנם / κέρας
  english_pob_choice: their horn
  chosen_korean: 그들의 뿔
  alternatives_korean:
  - 그들의 힘
  - 그들의 권세
  lexicon: HALOT; LXX κέρας
  rationale: 히브리어와 그리스어가 함께 보존하는 상징어를 살려 문자적 이미지를 유지했습니다. 한국어에서도 ‘뿔’은 힘과 권세의 비유로 읽힐 수 있어 해석을 덜어내지 않습니다.
- source_word: לאחור / ἑτέροις
  english_pob_choice: to others
  chosen_korean: 다른 이들에게
  alternatives_korean:
  - 뒤로
  - 뒤쪽으로
  lexicon: HALOT; Greek parallel
  rationale: 히브리어 형태는 다소 불규칙하지만 그리스어 병행본문이 ‘다른 이들에게’라는 뜻을 분명히 뒷받침하므로, 한국어 본문도 그 의미를 따랐습니다.
- source_word: כבודם / δόξα
  english_pob_choice: their glory
  chosen_korean: 그들의 영광
  alternatives_korean:
  - 그들의 명예
  - 그들의 존귀
  lexicon: HALOT
  rationale: כָּבוֹד는 ‘영광/존귀/명예’ 범위를 가지지만, 시적·예언적 문맥과 그리스어 δόξα에 맞추어 ‘영광’을 택했습니다.
- source_word: גוי נבל נכרי / ἔθνει ἀλλοτρίῳ
  english_pob_choice: a foolish foreign nation
  chosen_korean: 어리석은 외국 민족
  alternatives_korean:
  - 어리석은 이방 민족
  - 어리석은 낯선 민족
  lexicon: HALOT; LXX ἀλλότριος
  rationale: גּוֹי와 ἔθνος는 집합체를 가리키므로 ‘민족’이 자연스럽습니다. נָבָל의 도덕적 어조는 ‘어리석은’으로, נָכְרִי/ἀλλότριος는 ‘외국’으로 옮겼습니다.
theological_decisions:
- issue: ‘뿔’ 비유의 처리
  chosen_reading: ‘뿔’을 본문에 그대로 두어 힘과 권세의 상징을 유지했습니다.
  alternative_readings:
  - 힘
  - 권세
  rationale: 이 구절은 단순 정보 전달보다 상실의 이미지를 강조하므로, 해석어로 평탄화하지 않고 성서적 상징을 보존하는 편이 원문 의도에 더 가깝습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 5
- issue: 히브리어와 그리스어의 미세한 차이
  chosen_reading: 의미상으로는 ‘다른 이들에게’를 본문으로 채택했습니다.
  alternative_readings:
  - 뒤로
  - 뒤쪽으로
  rationale: 히브리어만 기계적으로 따르면 독자가 오해할 수 있고, 그리스어 병행본문이 의미를 보정해 주므로 가능한 한 재구성된 본래 뜻을 따랐습니다.
  doctrine_reference: 'PHILOSOPHY.md: Hebrew Sirach translated from Hebrew where it survives, with Greek kept in view'
