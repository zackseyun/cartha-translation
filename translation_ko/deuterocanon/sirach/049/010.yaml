review_pass:
  verdict: revise
  source_fidelity: 현존 히브리어 본문은 앞 절반뿐 아니라 결구에서도 ‘야곱을 치유하고 그를 … 높였다’는 단수 목적어를 보입니다. 초안은 ‘치유했다’는 히브리어 동사와 ‘그들을 구해냈다’는 그리스어 결구를 본문 안에서 결합하여, 주요 증거본문 불일치를 충분히 보존하지 못합니다. 히브리어를 본문으로 따르고 그리스어 이문을 각주로 제시하는 편이 안전합니다.
  naturalness: ‘열두 예언자들의 뼈가 … 싹트기를 바랍니다’는 시적 기원법을 현대 한국어 합쇼체로 자연스럽게 옮깁니다. 난해한 히브리어의 ‘그들 아래에서’는 본문에서 보존하되 각주가 독해를 안내하도록 했습니다.
  terminology: ‘열두 예언자들’, ‘뼈’, ‘야곱’은 원문의 구체성과 고유명을 잘 살립니다. באמונת תקוה는 과도한 교리적 확장을 피하여 ‘신실한 희망으로’로 옮겼습니다. וישגבהו는 히브리어의 단수 목적어를 따라 ‘그를 높였습니다’로 처리했습니다.
  issues:
  - severity: high
    issue: 본문이 히브리어와 그리스어의 서로 다른 결구를 혼합합니다.
    rationale: 초안의 ‘그들이 야곱을 치유했고’는 히브리어 החלימו를 따르지만, ‘그를 … 구해냈기’는 그리스어 ἐλυτρώσατο αὐτούς를 부분적으로 따른 것입니다. 현존 히브리어를 우선한다는 번역 원칙 및 단수 목적어 וישגבהו를 고려하면, 본문은 히브리어 독법을 유지하고 그리스어 독법은 각주로 제시해야 합니다.
  - severity: medium
    issue: 각주 a의 앵커가 ‘열두 예언자들’ 뒤에 놓여 있으나, 각주 내용은 뼈와 그 장소에 관한 이문입니다.
    rationale: 각주 앵커를 해당 구절인 ‘그들 아래에서 다시 싹트기를’ 뒤로 옮기면 독자가 이문의 적용 범위를 정확히 알 수 있습니다.
  - severity: low
    issue: ‘있던 자리에서’는 그리스어의 명료한 독법을 본문에 채택하면서 히브리어의 난해한 공간 표현을 평탄화합니다.
    rationale: 이 절은 원문 증거가 크게 갈리므로, 히브리어 우선 원칙 아래에서는 ‘그들 아래에서’를 본문에 남기고 그리스어 ‘그들의 자리에서’를 각주에 밝혀 불확실성을 보존하는 것이 더 충실합니다.
  revised_text: 열두 예언자들의 뼈가 그들 아래에서 다시 싹트기를 바랍니다[a]. 그들은 야곱을 치유하고[b], 신실한 희망으로 그를 높였습니다[c].
