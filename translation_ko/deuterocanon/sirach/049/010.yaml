base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/049/010.yaml
  text: And as for the twelve prophets[a], may their bones flourish from where they lie[c][b]; for they healed Jacob and delivered them by faithful hope.
  footnotes:
  - marker: a
    text: 'Greek: ''may their bones flourish from their place.'' The Hebrew phrase is more difficult, literally something like ''flourish from beneath them.'''
    reason: textual_variant
  - marker: b
    text: Greek reads 'comforted Jacob' where the Hebrew reads 'healed Jacob.'
    reason: alternative_reading
  - marker: c
    text: The closing line differs between witnesses. Hebrew may suggest 'exalted him in faithful hope,' while Greek reads 'delivered them in faith of hope.'
    reason: textual_variant
translation:
  language: ko
  text: 열두 예언자들에 관해서는, 그들의 뼈가 있던 자리에서 다시 싹트기를 바랍니다[a][c][b]. 그들이 야곱을 치유했고, 그를 충실한 희망으로 구해냈기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 ‘그들의 자리에서 뼈가 다시 싹트기를’이라고 읽습니다. 히브리어는 더 어려워 직역하면 ‘그들 아래에서 싹트기를’과 비슷합니다.
    reason: textual_variant
  - marker: b
    text: 그리스어는 ‘야곱을 위로했다’고 읽는 반면, 히브리어는 ‘야곱을 치유했다’고 읽습니다.
    reason: alternative_reading
  - marker: c
    text: 마지막 행은 증거본문마다 다릅니다. 히브리어는 ‘충실한 희망으로 그를 높였다’는 뜻을, 그리스어는 ‘믿음의 희망 안에서 그들을 구해냈다’는 뜻을 시사할 수 있습니다.
    reason: textual_variant
lexical_decisions:
- source_word: שנים עשר הנביאים / τῶν ιβʹ προφητῶν
  english_pob_choice: the twelve prophets
  chosen_korean: 열두 예언자들
  alternatives_korean:
  - 열두 소예언자들
  lexicon: HALOT / LSJ
  rationale: 원문은 단순히 ‘열두 예언자들’이라고 하므로, 후대 분류명인 ‘소예언자들’은 본문에 없는 해석어라서 피했습니다.
- source_word: עצמתם / τὰ ὀστᾶ
  english_pob_choice: their bones
  chosen_korean: 그들의 뼈
  alternatives_korean:
  - 그들의 유해
  lexicon: HALOT / LSJ
  rationale: 히브리어와 그리스어 모두 문자적으로 ‘뼈’를 가리키므로, 죽은 뒤의 명예와 기억을 살리는 구체적 이미지를 유지했습니다.
- source_word: מתחתם / ἐκ τοῦ τόπου αὐτῶν
  english_pob_choice: from where they lie
  chosen_korean: 있던 자리에서
  alternatives_korean:
  - 그들이 누운 자리에서
  - 그들의 자리에서
  lexicon: HALOT / LSJ
  rationale: 그리스어의 ‘그들의 장소에서’와 시체 관련 히브리어의 어려운 표현을 함께 반영해, 장례적 문맥을 자연스럽게 살리는 표현으로 옮겼습니다.
- source_word: באמונת תקוה / ἐν πίστει ἐλπίδος
  english_pob_choice: by faithful hope
  chosen_korean: 충실한 희망으로
  alternatives_korean:
  - 믿음의 희망으로
  - 희망의 믿음으로
  - 믿음과 희망으로
  lexicon: HALOT / LSJ / Louw-Nida
  rationale: ‘faith/πίστις’와 ‘hope/ἐλπίς’가 압축된 구문이므로, 둘의 결합을 풀어내되 과도하게 해석하지 않기 위해 ‘충실한 희망’으로 옮겼습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 본문이 서로 다르게 읽히는 결구를 어떻게 반영할지
  chosen_reading: 앞부분과 핵심 동사는 히브리어를 따르되, 마지막 구절은 그리스어의 공동체적 구원을 살려 ‘구해냈기 때문입니다’로 처리했습니다.
  alternative_readings:
  - 더 히브리어에 가깝게는 ‘그를 충실한 희망으로 높이셨기 때문입니다’
  - 더 그리스어에 가깝게는 ‘그들을 믿음의 희망 안에서 구해냈기 때문입니다’
  rationale: 지혜문학에서 보존된 히브리어를 우선하되, 이 절은 두 증거본문의 차이가 커서 의미를 무너뜨리지 않도록 그리스어를 보조적으로 반영해야 합니다.
  doctrine_reference: 'PHILOSOPHY.md: Sirach에서는 보존된 히브리어 우선, 그러나 중대한 불일치가 있으면 그리스어 병행본을 해석 보조로 사용'
