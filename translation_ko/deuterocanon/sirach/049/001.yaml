  - 향기로운 향 같고
  lexicon: HALOT
  rationale: קטורת은 향, סמים은 향료/향신료이므로 ‘향료를 섞은 향’으로 조제된 성격을 드러냈습니다.
- source_word: מעשה רוקח
  english_pob_choice: the work of a perfumer
  chosen_korean: 향수 조제공의 솜씨와도 같습니다
