base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/049/001.yaml
  text: The name of Josiah is like blended incense[a], the work of a perfumer; his memory is sweet as honey to the mouth[b], and like music at a banquet of wine.
  footnotes:
  - marker: a
    text: 'Greek: ''The remembrance of Josiah is for a blending of incense, prepared by the work of a perfumer; in every mouth it will be sweet as honey, and like music at a banquet of wine.'' The Hebrew foregrounds ''name'' in the first clause, while the Greek foregrounds ''remembrance.'''
    reason: alternative_reading
  - marker: b
    text: Or 'like a song at a banquet of wine.' The Hebrew מזמור can mean a song, but the Greek parallel supports the broader sense 'music.'
    reason: lexical_alternative
translation:
  language: ko
  text: 요시야의 이름[a]은 향료를 섞어 만든 향, 곧 향료 조제공이 만든 것과 같습니다. 그에 대한 기억은 입안에서 꿀처럼 달며, 포도주 잔치의 음악[b]과도 같습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 첫째 절을 ‘이름’으로 시작하지만, 그리스어 병행본문은 ‘기억’ 또는 ‘기념’으로 시작합니다.
    reason: source_note
  - marker: b
    text: 히브리어 מזמור는 ‘노래’로도 옮길 수 있지만, 그리스어 병행본문의 μουσικά는 더 넓은 뜻의 ‘음악’이라는 번역을 뒷받침합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שם
  english_pob_choice: The name of Josiah
  chosen_korean: 요시야의 이름
  alternatives_korean:
  - 요시야의 기억
  - 요시야의 명성
  lexicon: HALOT
  rationale: 히브리어 שם의 기본값은 ‘이름’이므로 이를 살리되, 뒤의 ‘기억’ 이미지가 보완되도록 문맥을 유지했습니다.
- source_word: כקטורת סמים
  english_pob_choice: like blended incense
  chosen_korean: 향료를 섞은 향 같고
  alternatives_korean:
  - 섞인 향 같고
  - 향기로운 향 같고
  lexicon: HALOT
  rationale: קטורת은 향, סמים은 향료/향신료이므로 ‘향료를 섞은 향’으로 조제된 성격을 드러냈습니다.
- source_word: מעשה רוקח
  english_pob_choice: the work of a perfumer
  chosen_korean: 향수 조제공의 솜씨와도 같습니다
  alternatives_korean:
  - 조향사의 작품과도 같습니다
  - 향료를 짜는 이의 일과도 같습니다
  lexicon: HALOT
  rationale: רוקח은 향과 연고를 조제하는 사람을 가리키므로, 현대 한국어로는 ‘향수 조제공’이 기능을 가장 분명히 전달합니다.
- source_word: כמזמור
  english_pob_choice: like music
  chosen_korean: 음악과도 같습니다
  alternatives_korean:
  - 노래와도 같습니다
  - 찬가와도 같습니다
  lexicon: HALOT
  rationale: 히브리어 מזמור은 노래이면서 음악적 연주를 포함할 수 있어, 그리스어 μουσικά와도 맞물리는 넓은 의미의 ‘음악’이 적절합니다.
