  lexicon: HALOT
  rationale: 히브리어 שם의 기본값은 ‘이름’이므로 이를 살리되, 뒤의 ‘기억’ 이미지가 보완되도록 문맥을 유지했습니다.
- source_word: כקטורת סמים
  english_pob_choice: like blended incense
  chosen_korean: 향료를 섞은 향 같고
  alternatives_korean:
