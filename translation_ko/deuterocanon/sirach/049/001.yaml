  - 향료를 짜는 이의 일과도 같습니다
  lexicon: HALOT
  rationale: רוקח은 향과 연고를 조제하는 사람을 가리키므로, 현대 한국어로는 ‘향수 조제공’이 기능을 가장 분명히 전달합니다.
- source_word: כמזמור
