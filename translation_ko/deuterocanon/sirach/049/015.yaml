base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/049/015.yaml
  text: Like Joseph[a], a man was born[b]; and even his body was cared for.
  footnotes:
  - marker: a
    text: 'Greek parallel: ''But Joseph became a man, leader of his brothers, support of the people, and his bones were cared for.'' The Hebrew witness here is shorter.'
    reason: alternative_reading
  - marker: b
    text: The phrase 'his body was cared for' likely refers to the later honoring and burial of Joseph's remains; compare the tradition reflected in Exodus 13:19 and Joshua 24:32.
    reason: cross_reference
translation:
  language: ko
  text: 요셉처럼, 한 사람이 태어났습니다[a]. 그리고 그의 몸도 보살핌을 받았습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 평행문은 ‘그러나 요셉은 한 사람이 되어 형제들의 지도자요 백성의 버팀목이 되었으며, 그의 뼈도 보살핌을 받았다’로 더 길게 전합니다. 히브리어 증언은 이보다 짧습니다.
    reason: alternative_reading
  - marker: b
    text: 이 표현은 요셉의 유해가 훗날 존중 속에 장사된 전승을 가리키는 것으로 보입니다. 출애굽기 13:19, 여호수아 24:32를 비교해 보십시오.
    reason: cross_reference
lexical_decisions:
- source_word: כיוסף
  english_pob_choice: Like Joseph
  chosen_korean: 요셉처럼
  alternatives_korean:
  - 요셉과 같이
  - 요셉과 같이도
  lexicon: HALOT
  rationale: 접두 כ의 비교 의미를 살려, 요셉을 기준으로 한 비유를 자연스러운 현대 한국어로 압축해 옮겼습니다.
- source_word: אם נולד גבר
  english_pob_choice: a man was born
  chosen_korean: 한 사람이 태어났습니다
  alternatives_korean:
  - 한 남자가 태어났습니다
  - 한 사람이 태어났습니다
  lexicon: HALOT
  rationale: נולד גבר의 직설적 의미를 유지하되, גבר를 단순히 ‘남자’로만 좁히기보다 문맥상 인물 탄생을 담는 ‘한 사람’으로 옮겨 한국어 표현을 더 자연스럽게 했습니다.
- source_word: גויתו
  english_pob_choice: his body
  chosen_korean: 그의 몸
  alternatives_korean:
  - 그의 시신
  - 그의 유해
  lexicon: HALOT
  rationale: 죽은 뒤의 몸을 가리키는 말이지만, 본문이 ‘돌봄을 받았다’는 표현을 쓰므로 지나치게 장례 용어로 고정하기보다 원문의 포괄성을 살렸습니다.
- source_word: נפקדה
  english_pob_choice: was cared for
  chosen_korean: 돌봄을 받았습니다
  alternatives_korean:
  - 보살핌을 받았습니다
  - 돌봄을 입었습니다
  - 돌보아졌습니다
  lexicon: HALOT
  rationale: פקד의 수동형이 지닌 ‘찾아보다/돌보다/처리하다’의 뜻을 문맥에 맞게 살려, 후대의 장례적 सम्मान을 암시하면서도 본문 자체의 일반적 표현을 유지했습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 평행문의 분량 차이
  chosen_reading: 본문은 현존 히브리어의 짧은 표현을 그대로 따르고, 더 긴 그리스어 평행문의 내용은 본문에 넣지 않았습니다.
  alternative_readings:
  - 그리스어의 ‘형제들의 지도자, 백성의 버팀목’까지 본문에 포함한다
  rationale: 이 단락은 히브리어 증거가 우선이므로, 그리스어의 찬양 확장은 주석적 정보로만 남기고 본문은 히브리어의 간결한 진술을 보존했습니다.
  doctrine_reference: 'PHILOSOPHY.md: 현존 히브리어 시락은 히브리어에서 번역하며, 평행 그리스어는 대조·확인 자료로 사용함.'
