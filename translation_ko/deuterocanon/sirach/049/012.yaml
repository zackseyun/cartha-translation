translation:
  language: ko
  text: 그렇듯 여호사닥의 아들 여호수아는[a] 자기 시대에 거룩한 성전을 세워 올렸고, 영원한 영광을 위하여 견고하게 세웠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '히브리어 본문에는 불확실한 괄호절이 함께 전해집니다: “그는 환난 중에 제단을 세웠다.” 그러나 그리스어 평행본문에는 이 절이 없습니다.'
    reason: textual_variant
lexical_decisions:
- source_word: גם
  english_pob_choice: So also
  chosen_korean: 그렇듯
  alternatives_korean:
  - 또한
  - 이와 같이
  lexicon: HALOT
  rationale: 이 인물을 앞선 회고의 흐름 안에 다시 연결하는 도입부이므로, 단순한 부가보다 문맥 연결을 살리는 ‘그렇듯’이 적절합니다.
- source_word: יהושע בן יהוצדק
  english_pob_choice: Yehoshua son of Jehozadak
  chosen_korean: 여호사닥의 아들 여호수아
  alternatives_korean:
  - 예호수아는
  - 여호수아, 여호사닥의 아들
  lexicon: 고유명사 표기 정책
  rationale: 히브리어 인명을 현대 한국어 음역으로 옮기되, 아버지 이름 관계를 분명히 드러내기 위해 ‘여호사닥의 아들 여호수아’로 처리했습니다.
- source_word: וירימו / ἀνύψωσαν
  english_pob_choice: they raised up
  chosen_korean: 세워 올렸고
  alternatives_korean:
  - 높여 세웠고
  - 들어 올렸고
  lexicon: HALOT / LXX
  rationale: 문맥상 성전 건축을 가리키므로, 단순한 물리적 ‘들어 올림’보다 건립의 결과를 보이는 ‘세워 올리다’가 원문의 상승·건축 뉘앙스를 함께 살립니다.
- source_word: היכל קדש
  english_pob_choice: a holy temple
  chosen_korean: 거룩한 성전
  alternatives_korean:
  - 거룩한 궁전
  - 성스러운 성전
  lexicon: HALOT
  rationale: היכל은 예배 공간으로서 ‘성전’이 가장 자연스럽고, קדש는 그 성전의 거룩함을 형용사로 살리는 것이 적절합니다.
- source_word: ומכונן
  english_pob_choice: established
  chosen_korean: 견고하게 세웠습니다
  alternatives_korean:
  - 설립했습니다
  - 기초를 놓았습니다
  lexicon: HALOT
  rationale: 완결된 상태를 나타내는 단어로, 단순 건축이 아니라 안정적으로 자리 잡게 한 뜻을 살려 ‘견고하게 세우다’로 옮겼습니다.
- source_word: לכבוד עולם
  english_pob_choice: for everlasting glory
  chosen_korean: 영원한 영광을 위하여
  alternatives_korean:
  - 영원한 영예를 위하여
  - 세세한 영광을 위하여
  lexicon: HALOT
  rationale: כבוד는 ‘영광/존귀’의 범위가 있으나, 이 문맥에서는 성전의 지속적 영예를 말하므로 ‘영원한 영광’이 가장 자연스럽습니다.
theological_decisions:
- issue: 본문에 포함된 히브리어 괄호절의 처리
  chosen_reading: 주본문은 확실한 공통 핵심인 성전 건립과 영원한 영광의 진술을 따르고, 알타르를 세웠다는 괄호절은 각주에 보존합니다.
  alternative_readings:
  - 괄호절까지 본문에 포함하여 ‘환난 중 제단을 세웠다’고 번역
  - 괄호절을 완전히 생략
  rationale: 제시된 히브리어 전승에서는 해당 절이 괄호로 불확실하게 표시되고, 그리스어 평행본문에는 나타나지 않으므로 본문을 공유되는 안정된 의미에 맞추되, 이질 전승은 각주로 투명하게 남깁니다.
  doctrine_reference: original-language primacy with honest preservation of source uncertainty
