base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/049/004.yaml
  text: Except for David[a], Hezekiah, and Josiah, all of them acted corruptly; the kings of Judah abandoned the law of the Most High[b], until they came to an end.
  footnotes:
  - marker: a
    text: Or, 'all of them committed offense' (following the Greek more closely); the Hebrew says literally that they 'corrupted' or 'ruined.'
    reason: lexical_alternative
  - marker: b
    text: The final phrase is terse in the Hebrew ('until completion/end'); the Greek reads, 'the kings of Judah came to an end/failed.'
    reason: alternative_reading
translation:
  language: ko
  text: 다윗과 히즈기야와 요시야를 제외하면, 모두 부패하게 행하였습니다.[a] 유다의 왕들은 지극히 높으신 분의 율법을 버리고 끝에 이르렀습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘망치다/부패시키다’의 뜻을 담고 있으며, 헬라어는 이에 대응하는 ‘범죄하다/잘못하다’ 계열의 표현을 사용합니다.
    reason: lexical_alternative
  - marker: b
    text: 마지막 구절은 히브리어가 매우 간결하며, 헬라어는 ‘유다의 왕들이 끝나 버렸다/쇠하였다’는 뜻으로 풀어 옮깁니다.
    reason: alternative_reading
lexical_decisions:
- source_word: לבד מדויד / παρὲξ Δαυεὶδ
  english_pob_choice: Except for David
  chosen_korean: 다윗을 제외하고는
  alternatives_korean:
  - 다윗 외에는
  - 다윗을 빼고는
  lexicon: HALOT / BDAG
  rationale: 히브리어 לבד와 헬라어 παρὲξ는 모두 예외를 표시하므로, 현대 한국어에서는 ‘-을 제외하고는’이 가장 분명하고 문맥에도 자연스럽습니다.
- source_word: השחיטו / πλημμελίαν ἐπλημμέλησαν
  english_pob_choice: acted corruptly
  chosen_korean: 타락하였습니다
  alternatives_korean:
  - 부패하였습니다
  - 악을 저질렀습니다
  - 죄를 지었습니다
  lexicon: HALOT / BDAG
  rationale: 어근 שחת의 ‘망치다/부패시키다’ 뉘앙스를 살리면서, 왕들에 대한 총평적 비판을 한국어로 간결하게 옮기기 위해 ‘타락하다’를 택했습니다.
- source_word: תורת עליון / τὸν νόμον τοῦ ὑψίστου
  english_pob_choice: the law of the Most High
  chosen_korean: 지극히 높으신 이의 율법
  alternatives_korean:
  - 가장 높으신 이의 율법
  - 가장 높으신 분의 율법
  - 지극히 높으신 분의 율법
  lexicon: HALOT / BDAG
  rationale: ‘עליון/ὕψιστος’는 하나님의 칭호이므로, 한국어에서는 자연스럽고 경건한 표현인 ‘지극히 높으신 이’로 옮겨 신적 호칭을 유지했습니다.
- source_word: עד תמם / ἐξέλιπον
  english_pob_choice: until they came to an end
  chosen_korean: 마침내 끝에 이르렀습니다
  alternatives_korean:
  - 끝나고 말았습니다
  - 소멸하였습니다
  - 끝장났습니다
  lexicon: HALOT / BDAG
  rationale: 히브리어의 간결한 종결 표현과 헬라어의 ‘끝나다/쇠하다’ 뉘앙스를 함께 반영하되, 직역투를 피하면서도 결말의 비극성을 살렸습니다.
theological_decisions:
- issue: 왕들에 대한 최종 진술을 어떻게 한국어로 담을지
  chosen_reading: ‘타락하였습니다’와 ‘마침내 끝에 이르렀습니다’로, 도덕적 붕괴와 그 결과를 함께 드러내었습니다.
  alternative_readings:
  - ‘죄를 지었습니다… 마침내 끝났습니다’처럼 더 설명적인 표현
  - ‘부패하였습니다… 사라졌습니다’처럼 강한 결과 중심 표현
  rationale: 히브리어와 헬라어 모두 도덕적 실패와 종결을 함께 전하므로, 둘을 분리하지 않고 한 문장 안에서 연결해 본문의 경고성을 보존했습니다.
  doctrine_reference: 원문 우선 원칙; 히브리어 간결성과 LXX의 해석적 뉘앙스를 함께 반영
