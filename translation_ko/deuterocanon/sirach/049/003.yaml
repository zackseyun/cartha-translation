  - 하나님을 향하여
  lexicon: HALOT; LXX parallel
  rationale: 히브리어의 ‘to God’를 본문으로 따르되, 방향성을 드러내는 조사 ‘-께로’로 원문의 ‘toward’ 뉘앙스를 유지했습니다.
- source_word: ובימי חמס
  english_pob_choice: in days of violence
  chosen_korean: 폭력의 날들에는
  alternatives_korean:
  - 폭력의 날에는
  - 불법의 날들에는
  - 포악한 날들에는
  lexicon: HALOT; LXX ἐν ἡμέραις ἀνόμων
  rationale: חמס의 사회적·도덕적 강도를 살려 ‘폭력’으로 옮겼고, 복수형의 시간을 그대로 반영해 ‘날들에는’으로 처리했습니다.
- source_word: עשה חסד
  english_pob_choice: showed loyalty
  chosen_korean: 충성을 보였습니다
  alternatives_korean:
  - 인애를 행했습니다
  - 친절을 보였습니다
  - 자비를 베풀었습니다
  - 신실함을 보였습니다
  lexicon: HALOT; LXX εὐσέβειαν / κατίσχυσεν
  rationale: 히브리어 חסד의 언약적 충성/인애를 살리면서도, 그리스어가 경건/경외 쪽으로 해석한 긴장을 무디게 하지 않도록 ‘충성’을 택했습니다.
theological_decisions:
- issue: 마지막 절구를 대인적 자비로 볼지, 하나님께 향한 신앙적 충성으로 볼지
  chosen_reading: 하나님께 향한 신실한 충성
  alternative_readings:
  - 그는 친절을 베풀었습니다
  - 그는 경건을 굳게 지켰습니다
  rationale: 히브리어 חסד은 문맥상 언약적 충성을 뜻할 수 있고, 그리스어는 이를 경건/경외의 방향으로 더 명시합니다. 본문은 둘 사이의 긴장을 유지하면서, 요시야/히스기야 계열의 신실함을 찬양하는 문맥에 맞게 번역했습니다.
  doctrine_reference: 원문 우선 원칙과 병행본문 참고 원칙을 함께 적용하며, 의미의 긴장을 해소하지 않고 보존합니다.
