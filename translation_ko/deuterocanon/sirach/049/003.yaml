    reason: lexical_alternative
lexical_decisions:
- source_word: ויתם / κατεύθυνεν
  english_pob_choice: directed
  chosen_korean: 마음을 …로 돌렸고
  alternatives_korean:
  - 마음을 …로 향하게 했고
  - 마음을 …로 바로잡았고
  - 마음을 …로 정하였고
  lexicon: HALOT; LXX κατεύθυνεν
  rationale: 히브리어 본문은 다소 불확실하지만, 그리스어의 ‘향하게 하다/곧게 하다’에 맞춰 마음의 방향을 하나님께로 돌리는 동작을 자연스러운 현대 한국어로 살렸습니다.
- source_word: אל אל / πρὸς Κύριον
  english_pob_choice: to God
  chosen_korean: 하나님께로
  alternatives_korean:
  - 주님께로
