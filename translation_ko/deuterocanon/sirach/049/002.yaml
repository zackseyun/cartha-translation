base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/049/002.yaml
  text: For he had compassion on our backsliding[c][b][a], and removed the abominations of vanity.
  footnotes:
  - marker: a
    text: Or, following the Greek parallel more closely, 'For he set the people right in their return' or 'in the people's repentance.' The Hebrew reads 'our backsliding,' while the Greek reflects a more positive 'turning/return.'
    reason: alternative_reading
  - marker: b
    text: '''Abominations of emptiness'' likely refers to idolatrous abominations; compare the Hebrew use of ''emptiness/vanity'' as a polemical term for idols.'
    reason: lexical_alternative
  - marker: c
    text: The Greek parallel reads 'and he removed the abominations of lawlessness,' differing from the Hebrew 'abominations of emptiness.'
    reason: textual_variant
translation:
  language: ko
  text: 그는 우리의 배교를 불쌍히 여기셨고,[a] 허무의 가증한 것들을 없애셨습니다.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 병행본문은 ‘그는 백성의 돌아섬에서 잘 이끌렸고’ 또는 ‘백성이 돌아오는 일에서 형통했고’에 가깝게 읽힙니다. 현존 히브리어는 ‘우리의 배교’를 말합니다.
    reason: alternative_reading
  - marker: b
    text: ‘허무’는 문자적으로 ‘헛됨/공허’이며, 우상 숭배를 가리키는 논박적 표현일 가능성이 큽니다.
    reason: lexical_alternative
  - marker: c
    text: 그리스어 병행본문은 ‘불법의 가증한 것들’을 말하여, 히브리어의 ‘허무의 가증한 것들’과 다릅니다.
    reason: textual_variant
lexical_decisions:
- source_word: נחל
  english_pob_choice: had compassion
  chosen_korean: 긍휼을 베푸셨고
  alternatives_korean:
  - 불쌍히 여기셨고
  - 자비를 베푸셨고
  - 측은히 여기셨고
  lexicon: HALOT
  rationale: 히브리어 동사는 문맥상 회복을 향한 자비로운 반응을 가리키므로, POB의 ‘had compassion’을 따라 ‘긍휼을 베푸셨고’로 옮겨 복원적 뉘앙스를 살렸습니다.
- source_word: על משובתינו
  english_pob_choice: on our backsliding
  chosen_korean: 우리의 배교를
  alternatives_korean:
  - 우리의 돌아섬을
  - 우리의 타락을
  - 우리의 회개를
  lexicon: HALOT
  rationale: משובה는 보통 ‘되돌아감’보다 ‘배교/되빔’의 부정적 의미가 강하므로, 히브리어 어감을 살려 ‘배교’로 옮겼습니다.
- source_word: וישבת
  english_pob_choice: and removed
  chosen_korean: 없애셨습니다
  alternatives_korean:
  - 그치게 하셨습니다
  - 치워 버리셨습니다
  - 없애 버리셨습니다
  lexicon: HALOT
  rationale: 대상인 ‘가증한 것들’에 대해 중단시키고 제거하는 뜻이므로, 자연스러운 현대 한국어로 ‘없애셨습니다’가 가장 적절합니다.
- source_word: תועבות הבל
  english_pob_choice: the abominations of vanity
  chosen_korean: 허무의 가증한 것들
  alternatives_korean:
  - 헛됨의 가증한 것들
  - 무가치함의 가증한 것들
  - 우상의 가증한 것들
  lexicon: HALOT
  rationale: הבל은 문자적으로 ‘허무/헛됨’을 뜻하며 우상 숭배를 암시할 수 있지만, 본문에 ‘우상’이 직접 나오지는 않으므로 ‘허무’로 보존했습니다. ‘תועבות’는 강한 종교적 혐오 표현이어서 ‘가증한 것들’로 옮겼습니다.
theological_decisions:
- issue: 히브리어 משובה의 부정적 의미와 그리스어 ἐπιστροφή의 긍정적 의미를 어떻게 처리할지
  chosen_reading: 본문에는 히브리어의 ‘배교’를 유지했습니다.
  alternative_readings:
  - 돌아섬
  - 회개
  - 백성의 회복
  rationale: 현존 히브리어 본문을 우선하되, 그리스어 병행본문이 제시하는 ‘돌아섬’의 긍정적 해석 가능성은 본문 밖에서 보존하는 것이 번역의 긴장을 가장 잘 유지합니다.
  doctrine_reference: 원어 우선 원칙; 본문 변이를 평탄화하지 않고 주석으로 보존
