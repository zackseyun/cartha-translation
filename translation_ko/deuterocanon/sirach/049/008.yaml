translation:
  language: ko
  text: 에스겔은 환상을 보고 전차의 여러 종류를[a] 설명하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '그리스어 평행본문: “그룹들의 전차 위에서 그에게 보이신 영광의 환상을 본 에스겔.” 히브리어는 더 짧으며, ‘전차의 여러 종류’에 해당하는 표현은 압축되어 있거나 본문상 불확실할 수 있습니다.'
    reason: alternative_reading
lexical_decisions:
- source_word: וחזקאל
  english_pob_choice: Ezekiel
  chosen_korean: 에제키엘
  alternatives_korean:
  - 에스겔
  - 에제키엘 선지자
  lexicon: 표준 음역
