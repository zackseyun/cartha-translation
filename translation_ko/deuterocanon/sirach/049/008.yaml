  english_pob_choice: a vision
  chosen_korean: 환상
  alternatives_korean:
  - 환시
  - 시현
  - 보임
  lexicon: HALOT
  rationale: 예언 문맥의 מראה는 단순한 시각적 ‘보기’보다 신적 계시로서의 ‘환상’을 가리키므로, 한국어에서도 그 계시적 성격이 드러나게 했습니다.
- source_word: ויגד
  english_pob_choice: described
  chosen_korean: 설명하였습니다
  alternatives_korean:
  - 말하였습니다
  - 전하였습니다
  - 알렸습니다
  lexicon: HALOT
  rationale: 대상인 מרכבה의 ‘종류들/형태들’을 풀어 말한다는 점을 살려, 단순한 보고보다 내용을 풀어 밝히는 ‘설명하다’를 택했습니다.
- source_word: זני
  english_pob_choice: the kinds of
  chosen_korean: 여러 종류를
  alternatives_korean:
  - 종류를
  - 형태들을
  - 양상을
  lexicon: HALOT
  rationale: 전승된 히브리어의 זני를 가능한 한 직접 반영하면서도, 어색함을 줄이기 위해 복수성을 드러내는 ‘여러 종류’를 사용했습니다.
- source_word: מרכבה
  english_pob_choice: the chariot
  chosen_korean: 전차
  alternatives_korean:
  - 병거
  - 전차-보좌
  - 수레
  lexicon: HALOT
  rationale: 히브리어 מרכבה의 기본 의미는 ‘전차/병거’이므로, 원문을 직접 살리되 문맥상 상징성을 과도하게 덧붙이지 않는 ‘전차’를 선택했습니다.
theological_decisions:
- issue: 히브리어 본문이 짧고, 그리스어 평행본문은 더 긴 ‘영광의 환상’과 ‘그룹의 전차’를 제시합니다.
  chosen_reading: 주본문은 히브리어의 압축된 형식을 따르고, 그리스어가 암시하는 보다 구체적인 환시 이미지는 본문에 확장하지 않았습니다.
  alternative_readings:
  - 에제키엘은 영광의 환상을 보았고, 그룹의 전차 위에서 그에게 보인 것을 묘사하였습니다.
  rationale: 이 절은 히브리어 전승이 비교적 짧고, 해당 부분의 어휘가 불확실하므로, 본문에서는 과잉해석을 피하고 평행본문은 의미 확인 자료로만 반영하는 편이 원문 지향성에 더 부합합니다.
  doctrine_reference: 'Sirach source policy: surviving Hebrew takes priority; Greek parallel informs but does not override an extant Hebrew reading.'
