    reason: alternative_reading
  - marker: b
    text: 히브리어는 ‘길들’ 또는 ‘길목들’에 가깝지만, 도시 문맥에서는 ‘거리들’이 뜻을 더 잘 드러냅니다.
    reason: lexical_alternative
  - marker: c
