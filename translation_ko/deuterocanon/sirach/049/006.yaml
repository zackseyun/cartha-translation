base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/049/006.yaml
  text: They set the holy city on fire[a], and made its streets desolate, by the hand of Yirmeyahu; for they afflicted him[c][b], though he had been formed in the womb as a prophet.
  footnotes:
  - marker: a
    text: Or 'through Yirmeyahu,' that is, in connection with his prophetic ministry or warning. The Hebrew idiom 'by the hand of' is retained in the main text; the syntax here is compressed.
    reason: alternative_reading
  - marker: b
    text: Hebrew 'paths/ways'; in the context of a city, 'streets' conveys the sense.
    reason: lexical_alternative
  - marker: c
    text: The line echoes Yirmeyahu's calling from the womb; compare Jeremiah 1:5.
    reason: cross_reference
translation:
  language: ko
  text: 그들은 거룩한 성에 불을 질렀고[a], 그 성의 거리들을 황폐하게 했습니다[b] — 그것은 예레미야의 손으로 한 일이었습니다. 그들이 그를 괴롭혔기 때문입니다[c]. 그는 태에서부터 예언자로 지음 받았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘예레미야를 통해’. 여기서는 히브리어의 ‘~의 손으로’를 본문에 유지했습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어는 ‘길들/길목들’에 가깝지만, 도시 문맥에서는 ‘거리들’이 뜻을 더 잘 드러냅니다.
    reason: lexical_alternative
  - marker: c
    text: 예레미야의 소명이 태에서부터 있었다는 표현은 예레미야 1:5를 떠올리게 합니다.
    reason: cross_reference
lexical_decisions:
- source_word: ויציתו
  english_pob_choice: they set ... on fire
  chosen_korean: 불을 질렀고
  alternatives_korean:
  - 불태웠고
  - 불을 붙였고
  lexicon: HALOT
  rationale: 성읍을 대상으로 한 파괴 행위이므로 자연스럽고 직접적인 한국어로 옮겼습니다. 단순한 ‘점화’보다 문맥상 파괴성을 분명히 드러냅니다.
- source_word: קרית קדש
  english_pob_choice: the holy city
  chosen_korean: 거룩한 성
  alternatives_korean:
  - 성스러운 성
  - 거룩한 도시
  lexicon: HALOT
  rationale: 직역에 가까우면서도 한국어 성서 문맥에서 자연스러운 표현으로, ‘성’과 ‘거룩함’의 결합을 그대로 살렸습니다.
- source_word: ארחתיה
  english_pob_choice: its streets
  chosen_korean: 그 성의 거리들
  alternatives_korean:
  - 그 성의 길들
  - 그 성의 통로들
  lexicon: HALOT
  rationale: 도시 문맥에서 ‘paths/ways’보다 실제 보행 공간인 ‘거리들’이 뜻을 더 잘 드러냅니다.
- source_word: ביד ירמיהו
  english_pob_choice: by the hand of Yirmeyahu
  chosen_korean: 예레미야의 손으로 한 일이었습니다
  alternatives_korean:
  - 예레미야를 통해 한 일이었습니다
  - 예레미야의 손에 의해
  lexicon: HALOT
  rationale: 히브리어 관용구를 완전히 풀지 않고 유지하되, 한국어에서는 ‘손으로 한 일’로 받아 의미가 드러나도록 했습니다. 본문의 압축성을 보존하는 선택입니다.
- source_word: כי ענוהו
  english_pob_choice: for they afflicted him
  chosen_korean: 그들이 그를 괴롭혔기 때문입니다
  alternatives_korean:
  - 그들이 그를 학대했기 때문입니다
  - 그들이 그를 괴롭히고 압박했기 때문입니다
  lexicon: HALOT
  rationale: 문맥상 예언자에게 가해진 부당한 가해를 넓게 담는 말로 ‘괴롭혔기 때문입니다’를 택했습니다. ‘afflicted’의 고통과 압박을 과도하게 특정하지 않습니다.
- source_word: מרחם נוצר נביא
  english_pob_choice: had been formed in the womb as a prophet
  chosen_korean: 태에서부터 예언자로 지음 받았습니다
  alternatives_korean:
  - 모태에서 예언자로 빚어졌습니다
  - 태에서 예언자로 만들어졌습니다
  lexicon: HALOT
  rationale: 예레미야 1:5를 떠올리게 하는 선재적 소명 표현을 살리면서, 현대 한국어에서 자연스러운 수동 표현으로 옮겼습니다.
- source_word: ירמיהו
  english_pob_choice: Yirmeyahu
  chosen_korean: 예레미야
  alternatives_korean:
  - 예리미야
  - 예레미야후
  lexicon: project proper-name convention
  rationale: 성경 인명으로 이미 널리 정착된 한국어 형태를 사용했습니다.
theological_decisions:
- issue: ‘ביד ירמיהו’의 관계를 어떻게 드러낼 것인가
  chosen_reading: 본문에는 ‘예레미야의 손으로 한 일이었습니다’라고 두고, 뒤이어 ‘그들이 그를 괴롭혔기 때문입니다’로 이어지게 했습니다.
  alternative_readings:
  - ‘예레미야를 통해’로 풀어 쓰기
  - ‘예레미야가 경고한 결과로’처럼 더 해석적으로 옮기기
  rationale: 히브리어와 그리스어 병행본문 모두 압축된 관용구를 보존합니다. 너무 매끈하게 풀기보다, 예언자의 사역과 그에 대한 박해가 함께 걸려 있음을 독자가 느끼도록 했습니다.
  doctrine_reference: 'DOCTRINE.md: Preserve theological tension rather than resolve it.'
