  rationale: 성읍을 대상으로 한 파괴 행위이므로 자연스럽고 직접적인 한국어로 옮겼습니다. 단순한 ‘점화’보다 문맥상 파괴성을 분명히 드러냅니다.
- source_word: קרית קדש
