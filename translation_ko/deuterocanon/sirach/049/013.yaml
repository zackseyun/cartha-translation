    rationale: וירפא는 문자적으로 ‘치유했다’이며, הריסתינו는 파괴·황폐의 상태를 가리킵니다. ‘황폐함을 치유하고’는 의인화된 은유를 보존하면서도 한국어 문맥상 이해됩니다.
