base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/049/013.yaml
  text: Nehemiah—may his memory be honored—who raised up our ruins[a], and healed our destruction[b], and set up doors and bars.
  footnotes:
  - marker: a
    text: 'Greek parallel: ''who raised up for us fallen walls, and set up gates and bars, and rebuilt our dwellings/sites.'' The Hebrew witness instead reads more broadly ''our ruins'' and ''our wreckage,'' with a healing metaphor.'
    reason: alternative_reading
  - marker: b
    text: The opening phrase is a benedictory expression about Nehemiah's remembrance, not merely a statement that he is remembered.
    reason: lexical_alternative
translation:
  language: ko
  text: 느헤미야는—그의 기억이 기려지기를—우리의 폐허를 다시 세우고, 우리의 황폐함을 치유하고, 문들과 빗장을 설치한 사람입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 단순히 ‘기억된다’는 뜻이 아니라, 느헤미야의 기억이 기려지기를 바라는 축복적 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘치유하고’는 히브리어의 치유 은유를 살린 표현입니다. 그리스어 병행 본문은 ‘무너진 성벽을 세우고, 성문들과 빗장을 세우며, 우리의 거처들을 재건한’ 것으로 더 구체적으로 표현합니다.
    reason: source_note
lexical_decisions:
- source_word: יאדר זכרו
  english_pob_choice: may his memory be honored
  chosen_korean: 그의 기억이 기리어지기를
  alternatives_korean:
  - 그의 기억이 영광스럽게 되기를
  - 그의 기억이 존귀하게 되기를
  - 그의 기억이 칭송되기를
  lexicon: HALOT
  rationale: 히브리어는 단순한 회상이 아니라 느헤미야의 기억을 축복하는 표현이므로, 합쇼체에서 자연스러운 기원형으로 옮겼습니다.
- source_word: המקים
  english_pob_choice: who raised up
  chosen_korean: 일으키고
  alternatives_korean:
  - 세우고
  - 회복하고
  - 건축하고
  lexicon: HALOT
  rationale: 무너진 것을 다시 일으키는 이미지를 살리기 위해 ‘일으키다’를 택했고, 뒤의 파괴 회복과 평행을 이루게 했습니다.
- source_word: חרבתינו / הריסתינו
  english_pob_choice: our ruins / our destruction
  chosen_korean: 우리의 무너진 곳 / 우리의 파괴
  alternatives_korean:
  - 우리의 폐허 / 우리의 황폐
  - 우리의 무너진 성벽 / 우리의 허물어짐
  - 우리의 폐허들 / 우리의 파괴된 것들
  lexicon: HALOT
  rationale: 본문의 두 명사는 모두 황폐함을 가리키지만 뉘앙스가 같지 않으므로, 첫째는 장소성 있는 ‘무너진 곳’, 둘째는 보다 포괄적인 ‘파괴’로 구분해 중복을 줄였습니다.
- source_word: וירפא
  english_pob_choice: and healed
  chosen_korean: 고치고
  alternatives_korean:
  - 치유하고
  - 수리하고
  - 회복하고
  lexicon: HALOT
  rationale: 히브리어의 치유 은유를 살리되, 한국어에서 도시와 성벽의 수리를 자연스럽게 떠올리게 하는 ‘고치다’를 사용했습니다.
- source_word: דלתים ובריח
  english_pob_choice: doors and bars
  chosen_korean: 문들과 빗장
  alternatives_korean:
  - 문들과 바리
  - 성문들과 빗장
  - 문과 빗장
  lexicon: HALOT
  rationale: 성벽 문맥의 सुरक्षा 장치라는 뜻을 반영하면서, 현대 한국어에서 이해되는 ‘빗장’을 택해 문과 함께 도시 방어를 떠올리게 했습니다.
theological_decisions:
- issue: 느헤미야를 기리는 문장의 어조
  chosen_reading: ‘그의 기억이 기리어지기를’이라는 축복형으로 옮겨, 단순 서술이 아니라 느헤미야의 기억을 기리는 문맥을 드러냈습니다.
  alternative_readings:
  - 그의 기억이 존귀하게 되기를
  - 그의 기억이 찬양되기를
  rationale: 히브리어 יאדר זכרו는 기억 자체를 높이는 축복적 표현이므로, 서술형보다 기원형이 본문 의도를 더 잘 드러냅니다.
  doctrine_reference: 문맥상 인물 기념의 축복문
- issue: ‘고치다’의 은유 보존
  chosen_reading: ‘고치고’로 번역해 폐허를 향한 회복의 은유를 유지했습니다.
  alternative_readings:
  - 수리하고
  - 회복하고
  rationale: 본문은 파괴된 성읍을 치유하듯 회복하는 이미지를 담고 있어, 너무 기술적인 ‘수리하다’보다 은유가 남는 표현을 선택했습니다.
  doctrine_reference: 예언/지혜문학의 의인화된 회복 표현
