base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/049/011.yaml
  text: How shall we praise Zerubbabel? He was like a signet ring on the right hand[a][b].
  footnotes:
  - marker: a
    text: Or 'How shall we magnify Zerubbabel?' The Greek parallel has 'magnify,' while the Hebrew wording supports 'praise' or 'extol.'
    reason: lexical_alternative
  - marker: b
    text: Or 'like a seal' or 'like a signet.' The image likely evokes honor and special value; compare the prophetic use of 'signet' imagery in Haggai 2:23.
    reason: cross_reference
translation:
  language: ko
  text: 스룹바벨을 어찌 찬양하겠습니까? 그는 오른손에 있는 인장 반지와 같았습니다[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘우리가 스룹바벨을 높이겠습니까?’ 히브리어는 ‘찬양하다/칭송하다’의 뉘앙스를, 그리스어 병행문은 ‘크게 하다, 높이다’의 뉘앙스를 보입니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘인장’ 혹은 ‘도장’. 여기서는 손에 끼는 값진 표지를 가리키는 비유로 이해할 수 있으며, 학개 2:23의 ‘인장 반지’ 이미지와도 이어집니다.
    reason: cross_reference
lexical_decisions:
- source_word: מה נהללה
  english_pob_choice: How shall we praise
  chosen_korean: 어찌하여 우리가 … 찬양하겠습니까?
  alternatives_korean:
  - 어찌하여 우리가 … 높이겠습니까?
  - 어찌하여 우리가 … 칭송하겠습니까?
  lexicon: HALOT
  rationale: 히브리어 수사 의문문은 단순 정보 요청이 아니라 경탄을 담은 찬양의 물음이므로, 현대 합쇼체에서는 ‘찬양하겠습니까?’가 자연스럽고도 원문의 수사성을 살립니다.
- source_word: זרבבל
  english_pob_choice: Zerubbabel
  chosen_korean: 스룹바벨
  alternatives_korean:
  - 제룹바벨
  lexicon: 고유명사 관례
  rationale: 한국어 성경에서 널리 정착된 형태를 따랐습니다.
- source_word: כחותם
  english_pob_choice: like a signet ring
  chosen_korean: 인장 반지와 같았습니다
  alternatives_korean:
  - 도장과 같았습니다
  - 인장과 같았습니다
  - 인장 반지와 같았습니다
  lexicon: HALOT
  rationale: חותם은 ‘인장/도장’이지만, 오른손 이미지와 결합된 비유이므로 손에 끼는 물건임을 드러내는 ‘인장 반지’가 가장 구체적입니다.
- source_word: על יד ימין
  english_pob_choice: on the right hand
  chosen_korean: 오른손에
  alternatives_korean:
  - 오른편에
  - 오른손 위에
  lexicon: HALOT
  rationale: 직역하면 ‘오른손 위/에’이지만 한국어에서는 자연스럽게 ‘오른손에’로 옮기면 손과 인장 반지의 결합이 더 분명해집니다.
theological_decisions:
- issue: 수사적 질문의 뉘앙스
  chosen_reading: ‘어찌하여 우리가 … 찬양하겠습니까?’로 옮겨 경탄과 공적 찬양의 뉘앙스를 살렸습니다.
  alternative_readings:
  - ‘어찌하여 우리가 … 높이겠습니까?’
  - ‘어찌하여 우리가 … 칭송하겠습니까?’
  rationale: 본문은 단순한 평가가 아니라 공동체의 찬양을 이끌어내는 수사적 질문입니다. 따라서 의미를 약화시키지 않는 범위에서 찬양 표현을 유지했습니다.
  doctrine_reference: 수사적 기능 보존
- issue: 인장 반지 비유
  chosen_reading: 비유를 본문 안에서 그대로 유지하고, 상징적 의미는 과잉 설명하지 않았습니다.
  alternative_readings:
  - 그는 오른손의 인장과 같았습니다
  - 그는 오른손의 도장과 같았습니다
  rationale: 본문은 스룹바벨의 존귀함과 선택됨을 암시하지만 그 의미를 직접 해설하지는 않습니다. 본문 차원의 비유를 보존하는 것이 더 충실합니다.
  doctrine_reference: 본문의 비유를 해설로 대체하지 않음
