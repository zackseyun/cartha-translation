    text: 히브리어 본문은 ‘그들의 영광’이라고 읽습니다. 그리스어 병행본은 아담을 언급하며, 아담이 모든 피조물보다 영광을 받았다고 읽습니다.
    reason: textual_variant
lexical_decisions:
- source_word: וְשֵׁם וְשֵׁת וְאֱנוֹשׁ
  english_pob_choice: Shem and Seth
  chosen_korean: 셈과 셋
  alternatives_korean:
