  lexicon: 고유명사
  rationale: 히브리어 본문에는 에노스가 포함되지만, 영어 POB는 본문 전승 판단에 따라 셈과 셋만 본문으로 두었으므로 한국어도 그 결정을 따릅니다.
- source_word: נִפְקְדוּ
