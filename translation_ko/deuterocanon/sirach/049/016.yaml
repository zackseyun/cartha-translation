  lexicon: פָּקַד 계열
  rationale: 단순한 ‘기억하다’보다 위상을 높이 평가받는 의미를 살려, POB의 ‘were honored’를 자연스럽게 옮겼습니다.
- source_word: תִּפְאָרֶת
