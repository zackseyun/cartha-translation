translation:
  language: ko
  text: 셈과 셋과 에노스는 존귀하게 여겨졌고,[a] 모든 살아 있는 것들보다 그들의 영광이 뛰어났습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 병행본에는 에노스가 없습니다.
    reason: textual_variant
