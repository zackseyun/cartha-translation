base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/049/014.yaml
  text: Few have been created on earth like Enoch, and he too was taken from the earth.
  footnotes:
  - marker: a
    text: 'Hebrew: ''Few have been created on earth like Enoch, and he too was taken …'' The final Hebrew word is difficult here; the Greek parallel reads ''from the earth,'' which is followed in the main text.'
    reason: textual_variant
  - marker: b
    text: Greek has the stronger wording 'not even one was created like Enoch on the earth.' The Hebrew witness reads 'few' rather than an absolute 'no one.'
    reason: alternative_reading
  - marker: c
    text: Or 'was taken up.' The wording recalls the tradition of Enoch's removal by God (compare Gen 5:24).
    reason: lexical_alternative
translation:
  language: ko
  text: 에녹처럼 땅 위에 지음 받은 이는 드물며[b], 그도 땅에서 데려가졌습니다[a][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문의 마지막 말은 여기서 난해합니다. 그리스어 평행본문은 ‘땅에서’를 읽으며, 본문은 이를 따릅니다.
    reason: textual_variant
  - marker: b
    text: 그리스어는 더 강하게 ‘에녹과 같은 이는 땅 위에 하나도 지음 받지 않았다’고 말합니다. 히브리어 본문은 절대 부정이 아니라 ‘드물다’를 읽습니다.
    reason: alternative_reading
  - marker: c
    text: 또는 ‘취해졌습니다’, ‘위로 들려 올라갔습니다’. 이 표현은 에녹이 옮겨진 전승을 떠올리게 합니다(창 5:24 참조).
    reason: lexical_alternative
lexical_decisions:
- source_word: מעט
  english_pob_choice: Few
  chosen_korean: 거의 없으며
  alternatives_korean:
  - 소수이며
  - 몇 되지 않으며
  lexicon: HALOT
  rationale: Hebrew의 מעט은 절대 부정이 아니라 수량의 적음을 가리키므로, 한국어에서도 과장된 ‘없다’보다 ‘거의 없다’로 완화하지 않게 옮겼습니다.
- source_word: נוצרו
  english_pob_choice: have been created
  chosen_korean: 만들어진
  alternatives_korean:
  - 지음 받은
  - 창조된
  lexicon: HALOT
  rationale: 본문의 비교 구조상 사람에 대한 생성/형성의 의미를 살리면서도, 한국어에서는 ‘창조된’보다 자연스러운 ‘만들어진’이 직역적 긴장을 유지합니다.
- source_word: נלקח
  english_pob_choice: was taken
  chosen_korean: 데려가졌습니다
  alternatives_korean:
  - 취해졌습니다
  - 옮겨졌습니다
  - 들려 올라갔습니다
  lexicon: HALOT
  rationale: 에녹의 특별한 제거를 암시하는 동사를 단순 수동으로만 풀지 않고, 하나님에 의해 ‘데려가졌다’는 의미를 드러내어 본문의 관용적 표현과 서사적 뉘앙스를 함께 살렸습니다.
- source_word: פנים / Greek ἀπὸ τῆς γῆς
  english_pob_choice: from the earth
  chosen_korean: 땅에서
  alternatives_korean:
  - 땅으로부터
  - 땅 위에서
  lexicon: HALOT
  rationale: 히브리어 말미는 난해하지만 그리스어 평행본문이 ‘땅으로부터’라고 분명히 하므로, 본문 의미를 따라 ‘땅에서’로 간명하게 옮겼습니다.
theological_decisions:
- issue: 에녹의 이동/제거를 어떻게 표현할지
  chosen_reading: 에녹도 역시 땅에서 데려가졌습니다
  alternative_readings:
  - 에녹도 역시 땅에서 취해졌습니다
  - 에녹도 역시 위로 들려 올라갔습니다
  rationale: 이 절은 에녹이 하나님의 특별한 처분 아래에서 지상에서 हट겨졌음을 말하지만, 본문 자체는 그 방식이나 목적지를 상세히 설명하지 않으므로, 해석을 과도하게 확장하지 않는 표현을 택했습니다.
  doctrine_reference: 본문이 말하는 범위를 넘어서지 않고 에녹 전승의 신학적 긴장을 보존함
