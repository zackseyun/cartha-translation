  text: Do not probe into what is beyond you[b][a], for what is too great for you has been shown to you.
  footnotes:
  - marker: a
    text: Or, 'Do not investigate things greater than you.' The Hebrew verb is difficult, and the Greek parallel reads, 'Do not be over-curious in your many works.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew could also be read, 'for you have seen many things beyond you,' but the Greek parallel supports, 'what is too great for you has been shown to you.'
    reason: alternative_reading
translation:
  language: ko
  text: 여러분보다 더 큰 일에 대해 탐구하지 마십시오[ [a] ], 이는 여러분에게 더 큰 것이 보여졌기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘여러분보다 더 큰 것들을 조사하지 마십시오.’ 히브리어 동사는 어려우며, 헬라어 평행본문은 ‘여러 일들에서 지나치게 호기심을 내지 마십시오’라고 읽습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיוֹתֵר מִמְּךָ
  english_pob_choice: what is beyond you
  chosen_korean: 여러분보다 더 큰 일
  alternatives_korean:
  - 여러분을 넘어서는 것
  - 여러분보다 지나치게 큰 것
  - 여러분의 분수 밖의 일
  lexicon: HALOT
  rationale: 비교·초과의 의미를 살려, 지혜문맥에 맞게 능력과 분수를 넘어서는 사안을 자연스럽게 옮겼습니다.
- source_word: אַל תַּמֵּר
  english_pob_choice: do not probe into
  chosen_korean: 탐구하지 마십시오
  alternatives_korean:
  - 캐묻지 마십시오
  - 들여다보지 마십시오
  - 연구하지 마십시오
  lexicon: HALOT
  rationale: 문맥상 경계하는 것은 지나친 호기심 섞인 조사이므로, 현대 한국어에서 가장 무리 없는 직접적 금지 표현으로 옮겼습니다.
- source_word: הָרְאֵיתָ
  english_pob_choice: has been shown to you
  chosen_korean: 보여졌기 때문입니다
  alternatives_korean:
  - 보게 되었기 때문입니다
  - 보이도록 해주셨기 때문입니다
  - 여러분이 보았기 때문입니다
  lexicon: HALOT
  rationale: 히브리어 자음형의 능동 가능성보다, 영어 POB의 주석과 평행하는 헬라어 수동형을 따라 ‘보여졌다’는 뜻을 반영했습니다.
theological_decisions:
- issue: 히브리어 פעול형/자음형의 능동 가능성과 헬라어 수동 의미의 조화
  chosen_reading: 수동적 의미인 ‘보여졌기 때문입니다’로 읽었습니다.
  alternative_readings:
  - 능동적으로 ‘여러분이 보았기 때문입니다’
  - ‘여러분에게 더 큰 것이 드러났기 때문입니다’
  rationale: 지혜문학의 권면은 이미 주어진 계시와 분량을 인정하고 분수를 넘는 탐구를 삼가라는 방향으로 읽는 것이 자연스럽습니다. 헬라어 평행본문의 ὑπεδείχθη σοι가 그 의미를 분명히 지지합니다.
  doctrine_reference: 'PHILOSOPHY.md: 히브리어가 남아 있는 경우에도 평행 헬라어를 실제 번역 입력으로 사용하여 의미를 확정함'
- issue: ‘여러분보다 더 큰 일’의 범위
  chosen_reading: 추상적 사물보다 ‘일’로 옮겨, 탐구 대상의 성격을 한국어로 분명히 했습니다.
  alternative_readings:
  - 여러분보다 큰 것
  - 여러분을 넘어서는 것
  rationale: 히브리어 표현은 단순한 대상보다 인간의 분수와 능력을 넘는 사안을 가리키므로, 한국어에서는 ‘일’이 지혜적 경고의 어감을 가장 자연스럽게 전달합니다.
  doctrine_reference: 시라크 3:23의 지혜문학적 격언 구조
