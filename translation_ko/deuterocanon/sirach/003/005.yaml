  source_fidelity: 히브리어 본문은 בִּבְנוֹ, 곧 ‘그의 아들’이라는 단수를 읽습니다. 초안의 ‘자기 아들들’은 그리스어 평행본문의 복수형을 본문으로 채택하여 히브리어 주본문의 수를 바꿉니다. 또한 יִשְׂמַח은 이 격언적 약속에서 미래 표현이 더 충실합니다. 기도의 수동적 결과와 ‘들음과 응답’의 두 요소는 보존되어야 합니다.
  naturalness: ‘기도는 들려 응답받습니다’도 이해되지만, 미래의 약속을 명확히 하고 한국어의 자연스러운 결합을 위해 ‘기도는 들리고 응답을 받을 것입니다’가 더 좋습니다. 합쇼체 격식도 일관되게 유지합니다.
  terminology: ‘아버지를 공경하는 사람’은 מְכַבֵּד אָבִיו에 적절합니다. ‘응답을 받다’는 하나님을 명시하지 않으면서 기도에 대한 응답이라는 의미를 자연스럽게 전달합니다.
