base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/003/005.yaml
  text: Whoever honors his father will rejoice in his children[b][a], and his prayer will be heard and answered.
  footnotes:
  - marker: a
    text: Greek has 'will rejoice through children' rather than the Hebrew singular 'in his son.'
    reason: alternative_reading
  - marker: b
    text: The Greek parallel reads only 'will be heard' at the end; the Hebrew witness adds 'and answered.'
    reason: alternative_reading
translation:
  language: ko
  text: 아버지를 공경하는 사람은 자기 아들들로 인해 기뻐하고, 그의 기도는 들려 응답받습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 단수 ‘그의 아들’을 읽지만, 그리스어 평행본문은 ‘자녀들’로 되어 있습니다.
    reason: alternative_reading
  - marker: b
    text: 그리스어 평행본문은 끝부분에 ‘응답받는다’보다 단순히 ‘들려진다’에 가깝습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: מְכַבֵּד אָבִיו
  english_pob_choice: honors his father
  chosen_korean: 아버지를 공경하는 사람
  alternatives_korean:
  - 아버지를 존중하는 사람
  - 아버지를 영화롭게 하는 사람
  - 아버지에게 무게를 두는 사람
  lexicon: HALOT
  rationale: כבד의 기본 뜻은 ‘무게를 두다’이지만, 한국어에서는 ‘공경하다’가 그 윤리적 요구를 가장 자연스럽고 분명하게 드러냅니다.
- source_word: יִשְׂמַח
  english_pob_choice: will rejoice
  chosen_korean: 기뻐하고
  alternatives_korean:
  - 기뻐할 것입니다
  - 즐거워할 것입니다
  - 환희할 것입니다
  lexicon: HALOT
  rationale: 지혜문학의 격언적 약속을 살리되, 앞절과 자연스럽게 이어지도록 현재적 서술의 흐름으로 옮겼습니다.
- source_word: בִּבְנוֹ
  english_pob_choice: in his son / in his children
  chosen_korean: 자기 아들들로 인해
  alternatives_korean:
  - 자기 아들로 인해
  - 자기 자녀로 인해
  - 그의 아들 안에서
  lexicon: HALOT
  rationale: 히브리어 본문은 단수 ‘그의 아들’을 두지만, 문맥상 자손으로 인한 기쁨의 뜻이므로 한국어에서는 원문의 형식을 크게 해치지 않는 범위에서 관계를 분명히 했습니다.
- source_word: וּתְפִלָתוֹ יִשְׁמַע וְיַעֲנֶה
  english_pob_choice: his prayer will be heard and answered
  chosen_korean: 그의 기도는 들려 응답받습니다
  alternatives_korean:
  - 그의 기도는 들리고 응답받습니다
  - 그의 기도는 들을 것이며 응답할 것입니다
  - 그의 기도는 들어지고 응답됩니다
  lexicon: HALOT
  rationale: ‘들려 응답받다’는 수동적 의미를 살리면서도 한국어에서 자연스럽고, 영어 POB가 보존한 ‘heard and answered’의 두 요소를 함께 반영합니다.
theological_decisions:
- issue: 기도가 ‘들려 응답받는다’는 표현의 주어 문제
  chosen_reading: 본문이 명시하지 않는 하나님의 행위 주어를 덧붙이지 않고, 수동 표현으로 유지했습니다.
  alternative_readings:
  - ‘하나님께서 그의 기도를 들으시고 응답하십니다’처럼 명시적으로 옮기기
  rationale: 히브리어는 하나님을 직접 언급하지 않으므로, 지혜문학의 일반적 약속으로서 본문의 명시 수준을 보존했습니다.
  doctrine_reference: 본문의 명시성 유지
