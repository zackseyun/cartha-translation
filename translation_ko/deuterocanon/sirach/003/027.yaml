translation:
  language: ko
  text: 눈동자가 없으면 빛이 부족하고, 지식이 없으면 지혜가 부족합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '현존 그리스어 증인은 이곳에서 다른 격언을 전합니다: “굳은 마음은 고통에 눌리고, 죄인은 죄 위에 죄를 더할 것입니다.”'
    reason: textual_variant
lexical_decisions:
- source_word: בְּאֵין
  english_pob_choice: without
  chosen_korean: ~이 없으면
  alternatives_korean:
  - ~이 없을 때
  - ~이 없이는
  lexicon: HALOT
  rationale: 부재를 나타내는 בְּאֵין을 한국어의 조건문형 ‘~이 없으면’으로 옮겨, 속담처럼 대구를 이루는 구조를 자연스럽게 살렸습니다.
- source_word: אִישׁוֹן
  english_pob_choice: pupil
  chosen_korean: 눈동자
  alternatives_korean:
  - 동공
  - 눈알
  lexicon: HALOT
  rationale: 현대 한국어에서 ‘pupil’의 표준 해부학 용어는 ‘눈동자’가 가장 자연스럽고, 속담적 이미지를 해치지 않습니다.
- source_word: יֶחְסַר / תֶּחְסַר
  english_pob_choice: is lacking
  chosen_korean: 부족하고
  alternatives_korean:
  - 모자라고
  - 결핍되고
  lexicon: HALOT
  rationale: חסר의 기본 의미인 결핍/부족을 두 절에 동일하게 반영해 반복 구조를 살렸습니다.
- source_word: דַעַת
  english_pob_choice: knowledge
  chosen_korean: 지식
  alternatives_korean:
  - 앎
  - 이해
  lexicon: HALOT
  rationale: 지혜와 병렬을 이루는 חסר-계열 표현에서 דַעַת는 인지적 ‘지식’이 가장 직접적이어서, ‘지혜’와의 구분이 분명해집니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 증인의 대조
  chosen_reading: 본문은 현존 히브리어 문장을 따르고, 그리스어의 다른 속담은 각주로만 알립니다.
  alternative_readings:
  - '그리스어: ‘굳은 마음은 고통에 눌리고, 죄인은 죄 위에 죄를 더할 것입니다.’'
  rationale: 이 절은 히브리어와 그리스어가 실질적으로 다른 격언을 전하므로, 히브리어가 보존된 경우 이를 본문으로 두는 번역 원칙에 따라 처리했습니다.
  doctrine_reference: 'PHILOSOPHY.md: translate Sirach from Hebrew where it survives; use Greek in view'
