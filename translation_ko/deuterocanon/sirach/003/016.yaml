translation:
  language: ko
  text: 아버지를 업신여기는 자는 거만하고, 어머니를 저주하는 자는 자기의 창조주를 괴롭게 합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 מֵזִיד는 ‘거만하고/오만하고’의 뉘앙스를 가지며, 그리스어 평행본문은 이를 ‘신성모독자’로 강하게 표현합니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어 평행본문은 두 번째 절을 ‘주님께 저주받은 자’로 옮깁니다. 이 본문은 히브리어의 ‘자기의 창조주’를 따릅니다.
    reason: alternative_reading
lexical_decisions:
- source_word: מֵזִיד / בּוֹזֶה
  english_pob_choice: is insolent / despises
  chosen_korean: 거만하고
  alternatives_korean:
  - 오만하고
  - 불손하고
  - 무례하고
  lexicon: HALOT
  rationale: מֵזִיד는 단순한 ‘의도적’보다 오만하고 뻔뻔한 태도를 가리키므로, 첫 절은 성경적 훈계문맥에 맞는 ‘거만하고’로 옮겼습니다. בּוֹזֶה의 contempt 의미는 앞의 동사성 표현에 포함시켜 자연스럽게 처리했습니다.
- source_word: אָבִיו
  english_pob_choice: his father
  chosen_korean: 아버지를
  alternatives_korean:
  - 그의 아버지를
  - 아비를
  lexicon: HALOT
  rationale: אָבִיו의 소유격은 한국어에서 목적격에 자연스럽게 반영하여 ‘아버지를’로 옮겼습니다. 문맥상 부자 관계의 경멸을 직접 드러내는 것이 중요합니다.
- source_word: וּמַכְעִיס
  english_pob_choice: one who provokes
  chosen_korean: 괴롭게 합니다
  alternatives_korean:
  - 분노하게 하는 자는
  - 격분하게 하는 자는
  - 화를 돋우는 자는
  lexicon: HALOT
  rationale: הִפְעִיל 분사인 מַכְעִיס는 단순 감정 표현보다 상대를 화나게 하여 괴롭히는 적극적 행위를 뜻하므로, 한국어에서는 문장 전체의 판정형을 살려 ‘괴롭게 합니다’로 옮겼습니다.
- source_word: בּוֹרְאוֹ
  english_pob_choice: his Creator
  chosen_korean: 자기의 창조주를
  alternatives_korean:
  - 그를 지으신 분을
  - 그의 창조주를
  - 만드신 분을
  lexicon: HALOT
  rationale: 히브리어 본문은 Greek parallel의 ‘주’보다 더 직접적으로 ‘그의 창조주’를 말하므로, 신학적 초점을 보존해 ‘자기의 창조주’를 유지했습니다. POB의 번역 전통도 이 항을 핵심 신학 표현으로 다룹니다.
- source_word: מְקַלֵּל אִמּוֹ
  english_pob_choice: is cursed by his Creator / one who curses his mother
  chosen_korean: 어머니를 저주하는 자는
  alternatives_korean:
  - 어머니를 저주하는 사람은
  - 어머니를 욕하는 자는
  - 어머니를 저주하는 자는
  lexicon: HALOT
  rationale: מְקַלֵּל은 단순 모욕보다 ‘저주하다’가 강도가 맞으며, 모친에 대한 불경을 직접적으로 드러내는 표현을 택했습니다. 주어 구조를 유지해 뒤의 결과 진술인 ‘창조주를 괴롭게 합니다’와 대응시켰습니다.
theological_decisions:
- issue: 두 번째 절의 행위 주체와 결과를 어떻게 반영할지
  chosen_reading: ‘어머니를 저주하는 자는 자기의 창조주를 괴롭게 합니다’로, 행위와 그로 인한 하나님에 대한 도전을 함께 드러냈습니다.
  alternative_readings:
  - ‘어머니를 저주하는 자는 저주를 받습니다’
  - ‘어머니를 저주하는 자는 주님께 저주를 받습니다’
  rationale: 히브리어는 어머니 저주와 창조주를 격분시키는 행위를 병렬로 제시합니다. Greek parallel의 ‘주님께 저주받음’은 해석적 강화이므로, 히브리어의 명시적 ‘창조주’를 우선하면서도 하나님 모독의 무게를 살렸습니다.
  doctrine_reference: Original-language primacy; preserve source tension between Hebrew and Greek parallel
