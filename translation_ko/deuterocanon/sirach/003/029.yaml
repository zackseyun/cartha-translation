base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/003/029.yaml
  text: The heart of the wise understands the sayings of the wise[b][a], and an attentive ear rejoices in wisdom.
  footnotes:
  - marker: a
    text: Hebrew 'sayings' could also be rendered 'proverbs' or 'parables'; the Greek parallel has 'parable' in the singular.
    reason: lexical_alternative
  - marker: b
    text: The Greek parallel differs in the second line, reading approximately 'and the ear of a hearer is the desire of a wise man,' while the extant Hebrew reads 'and an attentive ear rejoices in wisdom.' The translation follows the Hebrew as the primary witness here.
    reason: textual_variant
translation:
  language: ko
  text: 지혜로운 자의 마음은 지혜로운 이들의 말씀을 이해하고, 주의 깊게 듣는 귀는 지혜로 기뻐합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 מִשְׁלֵי는 여기서 ‘말씀’으로 옮겼지만, 문맥상 ‘잠언’, ‘비유’, ‘격언’으로도 옮길 수 있습니다. 그리스어 평행본문은 단수 형태의 ‘비유’에 가깝습니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어 평행본문은 둘째 줄에서 대체로 ‘듣는 자의 귀는 지혜로운 이의 소망’처럼 다르게 읽습니다. 이 번역은 이 자리에서는 현존 히브리어 본문을 따라갑니다.
    reason: textual_variant
lexical_decisions:
- source_word: לֵב חָכָם
  english_pob_choice: the heart of the wise
  chosen_korean: 지혜로운 자의 마음
  alternatives_korean:
  - 지혜자의 마음
  - 현자의 마음
  - 지혜로운 이의 심장
  lexicon: HALOT
  rationale: לֵב는 히브리어에서 감정만이 아니라 이해와 판단의 중심을 가리키므로, 한국어에서는 자연스럽고 성경적인 ‘마음’이 원문의 내적 인지 기능을 가장 잘 살립니다.
- source_word: מִשְׁלֵי חֲכָמִים
  english_pob_choice: the sayings of the wise
  chosen_korean: 지혜로운 이들의 말씀
  alternatives_korean:
  - 지혜로운 이들의 격언
  - 지혜로운 이들의 잠언
  - 지혜로운 이들의 비유
  lexicon: HALOT
  rationale: משל은 ‘잠언’이나 ‘비유’까지 포괄할 수 있지만, 여기서는 지혜 전승의 발화를 넓게 가리키므로 ‘말씀’이 장르를 지나치게 좁히지 않으면서도 영어 POB의 ‘sayings’에 대응합니다.
- source_word: אֹזֶן מַקְשֶׁבֶת
  english_pob_choice: an attentive ear
  chosen_korean: 주의 깊게 듣는 귀
  alternatives_korean:
  - 귀를 기울이는 귀
  - 경청하는 귀
  - 주의 깊은 귀
  lexicon: HALOT
  rationale: מַקְשֶׁבֶת는 ‘귀 기울여 듣는’ 능동적 태도를 나타내므로, 형용사적 표현보다 동작성을 살린 ‘주의 깊게 듣는 귀’가 원문 이미지를 잘 드러냅니다.
- source_word: לְחָכְמָה תִּשְׂמָח
  english_pob_choice: rejoices in wisdom
  chosen_korean: 지혜로 기뻐합니다
  alternatives_korean:
  - 지혜 안에서 기뻐합니다
  - 지혜를 기뻐합니다
  - 지혜를 즐거워합니다
  lexicon: HALOT
  rationale: לְ는 여기서 기쁨의 대상/방향을 나타낼 수 있으므로, 한국어에서는 의미를 자연스럽게 풀어 ‘지혜로 기뻐합니다’라고 옮겨 원문의 즐거움과 대상성을 함께 살렸습니다.
