translation:
  language: ko
  text: 높고 이름난 사람들이 많지만, 비밀들은 온유한 이들에게 드러납니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘온순한 이들’, ‘겸손한 이들’로 옮길 수 있습니다. 그리스어 πραέσιν은 성향상 온화하고 부드러우며 온유한 사람들을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  english_pob_choice: Many
  chosen_korean: 많은 이들
  alternatives_korean:
  - 많은 사람들
  - 많은 자들
  lexicon: LSJ
  rationale: 서술적 격언 문맥에서 무정한 ‘많은’보다 주어성을 살린 ‘많은 이들’이 자연스럽고, 영어 POB의 간결함도 유지합니다.
- source_word: ὑψηλοὶ
  english_pob_choice: lofty
  chosen_korean: 높은
  alternatives_korean:
  - 고귀한
  - 높이 올라간
  lexicon: LSJ
  rationale: 직역의 ‘높은’이 사회적 지위의 높음과 자기 고양의 뉘앙스를 모두 담아, 뒤의 ‘이름난’과 병렬을 이룹니다.
- source_word: ἐπίδοξοι
  english_pob_choice: renowned
  chosen_korean: 이름난
  alternatives_korean:
  - 유명한
  - 명성 있는
  - 평판 좋은
  lexicon: LSJ
  rationale: 공적으로 알려진 명망을 나타내는 말로 ‘이름난’이 가장 직접적이며, ‘높은’과 함께 명예/지위의 이중 강조를 살립니다.
- source_word: πραέσιν
  english_pob_choice: the gentle
  chosen_korean: 온유한 이들
  alternatives_korean:
  - 온유한 사람들
  - 온유한 자들
  - 온순한 이들
  lexicon: LSJ
  rationale: πραΰς의 핵심 의미를 ‘온유한’으로 살리되, 격언의 대비 구조를 분명히 하기 위해 사람을 받치는 ‘이들’을 보완했습니다.
- source_word: μυστήρια
  english_pob_choice: mysteries
  chosen_korean: 비밀들
  alternatives_korean:
  - 신비들
  - 감추어진 일들
  lexicon: LSJ
  rationale: 한국어에서 ‘비밀들’이 문맥상 더 바로 이해되며, 복수형의 다발성을 유지하면서도 종교적 전문용어로 굳어지지 않게 합니다.
theological_decisions:
- issue: πραέσιν의 품성 표현을 ‘온유한’으로 둘지 ‘겸손한/온순한’으로 둘지
  chosen_reading: 온유한 이들
  alternative_readings:
  - 겸손한 이들
  - 온순한 이들
  rationale: 본문 대조는 사회적 고위층과 비자기주장의 태도 사이에 있으므로, 성서적 어휘 전통과 현대 가독성을 함께 살리는 ‘온유한’이 가장 적절합니다.
  doctrine_reference: Sirach 3:19의 지혜 문맥
