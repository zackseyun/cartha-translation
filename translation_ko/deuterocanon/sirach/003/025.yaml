base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/003/025.yaml
  text: A heavy heart will come to ruin in the end[b][a], and one who loves good things will be led by them.
  footnotes:
  - marker: a
    text: 'Greek parallel: ''a hard heart will be afflicted at the last.'' The Hebrew reads literally ''a heavy heart will become foul at its end.'''
    reason: alternative_reading
  - marker: b
    text: Or 'will become foul'—the Hebrew verb is more literally 'to stink' or 'to become rotten,' here expressing a disastrous outcome.
    reason: lexical_alternative
translation:
  language: ko
  text: 무거운 마음[a]은 마침내 파멸에 이르고[b], 좋은 것들을 사랑하는 사람은 그것들에 이끌립니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '그리스어 병행본문: ‘굳은 마음은 마지막에 고통을 당할 것이다.’ 히브리어는 문자적으로 ‘무거운 마음은 그 끝에서 썩게 된다’라고 읽힙니다.'
    reason: alternative_reading
  - marker: b
    text: 히브리어 동사는 문자적으로는 ‘썩다/악취가 나다’의 뜻으로, 여기서는 파멸적인 결말을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵב כָּבֵד
  english_pob_choice: a heavy heart
  chosen_korean: 무거운 마음
  alternatives_korean:
  - 굳은 마음
  - 완고한 마음
  lexicon: HALOT
  rationale: 히브리어의 직역인 ‘heavy heart’를 살려 심리적 슬픔보다도 내면의 무겁고 뒤틀린 상태를 드러내었습니다. 그리스어 병행본문의 ‘hard heart’는 주석에서 대안으로 남겼습니다.
- source_word: תִּבְאַשׁ
  english_pob_choice: will come to ruin
  chosen_korean: 마침내 망하고
  alternatives_korean:
  - 썩어 버리고
  - 악취가 나고
  - 불행을 당하고
  lexicon: HALOT
  rationale: 어근의 기본 의미는 ‘썩다/악취가 나다’이지만, 문맥상 결말의 파멸을 가리키므로 한국어에서는 결과를 드러내는 ‘망하다’를 택했습니다.
- source_word: אַחֲרִיתוֹ
  english_pob_choice: in the end
  chosen_korean: 마침내
  alternatives_korean:
  - 그 끝에
  - 마지막에
  lexicon: HALOT
  rationale: ‘후말/결말’의 뜻을 자연스럽게 살리기 위해 서술어와 결합한 부사형으로 옮겼습니다.
- source_word: וְאֹוהֵב טוֹבוֹת
  english_pob_choice: one who loves good things
  chosen_korean: 좋은 것들을 사랑하는 사람
  alternatives_korean:
  - 복된 것들을 사랑하는 사람
  - 좋은 것들을 좋아하는 사람
  - 좋은 것들을 사랑하는 자
  lexicon: HALOT
  rationale: טוֹבוֹת의 의미 범위를 넓게 보존하기 위해 ‘좋은 것들’로 옮겼고, 속담의 일반성을 살리기 위해 ‘사람’을 사용했습니다.
- source_word: יִנְהַג בָּהֶם
  english_pob_choice: will be led by them
  chosen_korean: 그것들에 이끌립니다
  alternatives_korean:
  - 그것들을 따라갑니다
  - 그것들에 의해 이끌립니다
  - 그것들 가운데서 행합니다
  lexicon: HALOT
  rationale: נהג의 ‘이끌다/몰다’라는 의미를 반영해 수동적 귀결을 살렸습니다. 한국어에서는 자연스러운 현재적 서술형으로 정리했습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행본문의 차이(‘무거운 마음’ vs ‘굳은 마음’)
  chosen_reading: 본문에는 히브리어의 ‘무거운 마음’을 유지하고, 그리스어는 주석으로 남깁니다.
  alternative_readings:
  - 굳은 마음
  - 완고한 마음
  rationale: 집회서에서는 현존 히브리어 증거를 우선해야 하므로, 그리스어는 해석적 대안으로만 보존했습니다. 이렇게 해야 본문의 긴장과 전승 차이를 지울 수 있습니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: 보편 속담의 주어 처리
  chosen_reading: ‘사람’을 사용해 일반적 주어로 처리했습니다.
  alternative_readings:
  - 그는
  - 누구든지
  rationale: 히브리어의 일반적 격언 구조를 한국어에서 자연스럽게 살리기 위한 선택입니다. 성별을 특정하지 않으면서도 문장의 경구성을 유지합니다.
  doctrine_reference: Translation philosophy §4
