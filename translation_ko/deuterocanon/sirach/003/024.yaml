  rationale: 희귀한 עֶשְׁתּוֹנֵי의 의미를 한국어의 중립적이면서도 경계의 뉘앙스가 있는 ‘생각들’로 옮기고, 앞의 רַבִּים을 문장 구조로 자연스럽게 반영했습니다.
- source_word: בְּנֵי אָדָם
  english_pob_choice: the sons of man
  chosen_korean: 사람들
  alternatives_korean:
