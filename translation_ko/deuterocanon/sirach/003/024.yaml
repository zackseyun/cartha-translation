  - 인생들
  - 사람의 아들들
  lexicon: HALOT
  rationale: 히브리어 관용구를 의미상으로 풀어, 이 구절이 남성표지 어구가 아니라 인류 일반을 가리킨다는 점을 한국어에서 자연스럽게 드러냈습니다.
- source_word: דִמְיוֹנוֹת רָעוֹת
  english_pob_choice: evil imaginings
  chosen_korean: 악한 상상들
  alternatives_korean:
  - 악한 생각들
  - 나쁜 상상들
  - 사악한 상상들
  lexicon: HALOT
  rationale: דִמְיוֹנוֹת의 심상/상상이라는 뜻을 살리면서, רָעוֹת의 도덕적 성격을 ‘악한’으로 보존했습니다.
- source_word: מַתְעוֹת
  english_pob_choice: lead astray
  chosen_korean: 미혹합니다
  alternatives_korean:
  - 길을 잃게 합니다
  - 그릇되게 합니다
  - 속입니다
  lexicon: HALOT
  rationale: 단순한 ‘오류’보다 적극적으로 사람을 잘못된 길로 이끄는 의미를 살려, POB의 ‘lead astray’에 대응하는 표현으로 선택했습니다.
theological_decisions:
