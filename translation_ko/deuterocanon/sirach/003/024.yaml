base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/003/024.yaml
  text: For many are the speculations of the sons of man[b][a], and evil imaginings lead astray.
  footnotes:
  - marker: a
    text: Or 'human beings' or 'people.' The Hebrew literally says 'the sons of man,' a generic expression for humanity.
    reason: lexical_alternative
  - marker: b
    text: The rare Hebrew term rendered 'speculations' may also be understood as 'thoughts,' 'reasonings,' or 'assumptions.' The Greek parallel has 'their supposition/opinion,' which supports the sense of self-formed notions.
    reason: alternative_reading
translation:
  language: ko
  text: 많은 사람의 생각들은 많고, 악한 상상들은 사람들을 미혹합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 직역은 ‘사람의 아들들’이지만, 여기서는 인류 일반을 가리키는 관용구입니다.
    reason: lexical_alternative
  - marker: b
    text: 희귀한 히브리어 עֶשְׁתּוֹנֵי는 ‘생각들’, ‘궁리들’, ‘추측들’, ‘가정들’로도 이해할 수 있습니다. 그리스어 병행구는 ‘그들의 추정/의견’이라는 뜻을 지지합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: רַבִּים עֶשְׁתּוֹנֵי
  english_pob_choice: many ... speculations
  chosen_korean: 생각들은 많고
  alternatives_korean:
