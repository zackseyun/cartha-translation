base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/003/003.yaml
  text: Whoever honors his father makes atonement for his sins[b][a], and whoever honors his mother stores up treasure.
  footnotes:
  - marker: a
    text: Hebrew has 'his sin' in the singular; the Greek parallel reads 'sins,' which is likely collective in sense. The translation follows the collective sense.
    reason: lexical_alternative
  - marker: b
    text: Or 'lays up treasure.' The image is of storing away reward like wealth in reserve.
    reason: lexical_alternative
translation:
  language: ko
  text: 아버지를 공경하는 사람은 자신의 죄에 대해 속죄를 받으며, 어머니를 공경하는 사람은 보화를 쌓아 둡니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘자신의 죄’가 단수로 되어 있으나, 그리스어 평행본문은 복수 ‘죄들’로 읽습니다. 번역은 이 집합적 의미를 따랐습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘보화를 쌓아 둡니다’입니다. 여기서 ‘보화’는 공로의 축적을 비유합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְכַבֵּד
  english_pob_choice: honors
  chosen_korean: 공경하는
  alternatives_korean:
  - 존경하는
  - 존귀하게 여기는
  lexicon: HALOT
  rationale: כבד의 피엘 분사로서 ‘마땅한 무게와 가치를 부여하여 예를 갖추는’ 뜻을 살려, 한국어에서는 가족 윤리 문맥에 자연스러운 ‘공경하다’가 가장 적절합니다.
- source_word: אָב
  english_pob_choice: father
  chosen_korean: 아버지
  alternatives_korean:
  - 부모
  lexicon: HALOT
  rationale: 히브리어는 단수 ‘아버지’이며, 다음 행의 ‘어머니’와 평행을 이루므로 ‘부모’로 일반화하지 않고 구체적으로 옮겼습니다.
- source_word: תְּכֻפַּר חַטָּאתוֹ
  english_pob_choice: makes atonement for his sins
  chosen_korean: 자신의 죄에 대해 속죄를 받으며
  alternatives_korean:
  - 자신의 죄가 속죄되며
  - 자신의 죄를 속죄하며
  lexicon: HALOT
  rationale: כפר와 그리스어 ἐξιλάσεται의 속죄/화해 의미를 살리면서도, 주어가 ‘공경하는 사람’인 문장 흐름에 맞게 한국어에서는 결과를 드러내는 수동형으로 옮겼습니다.
- source_word: וְגוֹנֵז אוֹצָר
  english_pob_choice: stores up treasure
  chosen_korean: 보화를 쌓아 둡니다
  alternatives_korean:
  - 보화를 저장합니다
  - 보화를 간직합니다
  lexicon: HALOT
  rationale: גנז와 אוצר가 지시하는 ‘저장해 두는’ 이미지를 살리되, 한국어에서 자연스럽고 긍정적인 어감의 ‘쌓아 두다’로 옮겼습니다.
- source_word: אִמּוֹ
  english_pob_choice: his mother
  chosen_korean: 어머니
  alternatives_korean:
  - 그의 어머니
  lexicon: HALOT
  rationale: 히브리어의 소유격은 평행법상 첫 행의 ‘아버지’와 짝을 이루므로, 한국어에서는 반복을 줄이면서도 의미를 보존하는 ‘어머니’로 자연화했습니다.
theological_decisions:
- issue: 속죄 언어의 유지
  chosen_reading: 도덕적 유익으로 약화하지 않고 ‘속죄를 받다’라는 직접적 속죄 언어를 유지했습니다.
  alternative_readings:
  - 죄가 용서된다
  - 죄책이 덮인다
  rationale: 히브리어 כפר와 그리스어 ἐξιλάσεται가 모두 속죄/화해의 강한 의미를 가지므로, 지혜문학 문맥이라도 이를 완화하지 않고 그대로 드러내는 편이 원문 의도를 더 정확히 전달합니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
- issue: 부모 일반화 여부
  chosen_reading: ‘부모’로 묶지 않고 ‘아버지’와 ‘어머니’를 각각 유지했습니다.
  alternative_readings:
  - 부모를 공경하는 사람은
  - 양친을 공경하는 사람은
  rationale: 본문의 평행 구조가 남성과 여성의 양쪽을 각각 지목하므로, 성별과 역할을 지운 일반화는 원문 수사와 강조점을 약화시킵니다.
  doctrine_reference: Translation philosophy §4
