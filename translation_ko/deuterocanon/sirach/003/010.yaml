translation:
  language: ko
  text: 아버지의 수치로 스스로를 높이지 마십시오.[a] 그것은 당신에게 영예가 아닙니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘아버지의 수치 가운데서 스스로를 높이지 마십시오’이며, 문맥에 따라 ‘아버지의 수치를 통하여’라는 뜻도 될 수 있습니다. 히브리어 재귀 동사는 자기 명예를 추구하는 뜻을 띱니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל / μὴ
  english_pob_choice: Do not
  chosen_korean: …마십시오
  alternatives_korean:
  - …하지 마십시오
  - …하지 말십시오
  lexicon: HALOT; SBLGNT/Greek parallel
  rationale: 지혜문학의 금지 명령을 현대 표준어의 공손한 금지형으로 옮겼습니다.
- source_word: תִּתְכַּבֵּד / δόξαζε
  english_pob_choice: glorify yourself / honor yourself
  chosen_korean: 스스로를 높이지
  alternatives_korean:
  - 스스로를 영화롭게 하지
  - 스스로를 영광스럽게 하지
  - 스스로를 자랑하지
  lexicon: HALOT
  rationale: 히트파엘의 재귀적 뉘앙스를 살려 ‘스스로를 높이다’로 옮기면, 단순한 칭찬이 아니라 자기 명예를 추구하는 행동이 드러납니다.
- source_word: בְּקְלוֹן אָבִיךָ / ἐν ἀτιμίᾳ πατρός σου
  english_pob_choice: in your father's disgrace
  chosen_korean: 아버지의 수치를 빌려
  alternatives_korean:
  - 아버지의 수치 속에서
  - 아버지의 수치를 통해
  - 아버지의 불명예 가운데
  lexicon: HALOT
  rationale: ב 전치사는 여기서 원인·수단의 의미를 띨 수 있어, 한국어에서는 ‘빌려’로 처리해 ‘아버지의 수치를 이용하여’라는 함의를 살렸습니다.
- source_word: לֹא כָבוֹד הוּא לָךְ / οὐ γάρ ἐστίν σοι δόξα
  english_pob_choice: for it is no honor to you
  chosen_korean: 그것은 당신에게 영예가 아닙니다
  alternatives_korean:
  - 그것은 당신에게 명예가 아닙니다
  - 그것은 당신에게 영광이 아닙니다
  - 그것은 당신의 영예가 되지 않습니다
  lexicon: HALOT; LXX δόξα
  rationale: כָבוֹד/δόξα의 기본 의미인 ‘영예, 명예, 영광’ 가운데 문맥상 도덕적 평가를 살려 ‘영예’로 옮겼습니다.
theological_decisions:
- issue: 아버지의 수치를 이용해 자기 명예를 얻으려는 행위의 윤리적 강조
  chosen_reading: 본문은 단순히 타인의 불행을 언급하는 것이 아니라, 그 불행을 발판 삼아 자기 영광을 추구하는 것을 금지합니다.
  alternative_readings:
  - 아버지의 수치 속에 있을 때 스스로를 내세우지 말라는 일반적 권면
  - 아버지의 불명예를 자랑하지 말라는 제한된 경고
  rationale: 히브리어 재귀 동사와 헬라어 평행본문 모두 자기 명예 추구의 뉘앙스를 지지하므로, 윤리적 초점을 분명히 드러냈습니다.
  doctrine_reference: 지혜문학의 부모 공경 윤리
