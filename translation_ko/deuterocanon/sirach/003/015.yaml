base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/003/015.yaml
  text: In the day of distress it will be remembered for your benefit; like heat upon frost[a], your sins will be blotted out.
  footnotes:
  - marker: a
    text: Or, following the Greek more closely, 'like fair weather upon frost, so your sins will be dissolved.' The Hebrew reads 'heat upon frost,' while the Greek parallel has 'fair weather upon frost.' Both convey the image of frost disappearing.
    reason: alternative_reading
translation:
  language: ko
  text: 곤경의 날에 그것이 당신에게 유익하게 기억될 것입니다. 서리 위의 열기처럼, 당신의 죄가 사라질 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 ‘서리 위의 열기’를, 그리스어 평행본문은 ‘서리 위의 맑은 날씨’를 말합니다. 둘 다 서리가 녹아 사라지는 이미지를 전달합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּיוֹם צָרָה
  english_pob_choice: In the day of distress
  chosen_korean: 곤경의 날에
  alternatives_korean:
  - 환난의 날에
  - 고난의 날에
  lexicon: HALOT
  rationale: צָרָה는 ‘곤경, 환난, 고통스러운 상황’의 뜻이므로, 현대 한국어에서 자연스럽고 긴박한 뉘앙스를 살릴 수 있는 ‘곤경’으로 옮겼습니다. בְּיוֹם은 관용적으로 ‘~의 날에’로 처리했습니다.
- source_word: תִּזָּכֵר לָךְ
  english_pob_choice: it will be remembered for your benefit
  chosen_korean: 그것이 당신을 위해 기억될 것입니다
  alternatives_korean:
  - 당신을 위해 기억될 것입니다
  - 당신에게 기억될 것입니다
  lexicon: HALOT
  rationale: נזכר의 수동적 의미를 살리면서, לָךְ를 ‘당신을 위해’로 옮겨 단순한 간접목적어보다 유익/관계의 뉘앙스를 드러냈습니다. 영어 POB의 ‘for your benefit’에 해당하는 해석을 한국어로 자연스럽게 반영했습니다.
- source_word: כְּחֹם עַל כְּפוֹר
  english_pob_choice: like heat upon frost
  chosen_korean: 마치 서리 위의 더위처럼
  alternatives_korean:
  - 서리 위의 열기처럼
  - 얼음 위의 더위처럼
  lexicon: HALOT
  rationale: 히브리어의 구체적 이미지인 ‘חֹם(더위/열기)’과 ‘כְּפוֹר(서리)’를 직접 반영했습니다. 영어 주석의 ‘fair weather’보다 히브리어 본문이 우선이므로, 감각적 대비가 살아나는 ‘서리 위의 더위’로 옮겼습니다.
- source_word: לְהַשְׁבִּית עֲוֹנֶיךָ
  english_pob_choice: your sins will be blotted out / your sins will melt away
  chosen_korean: 당신의 죄가 사라질 것입니다
  alternatives_korean:
  - 당신의 죄가 없어질 것입니다
  - 당신의 죄가 소멸될 것입니다
  lexicon: HALOT
  rationale: לְהַשְׁבִּית는 ‘사라지게 하다, 그치게 하다, 없애다’의 뜻이므로, 서리의 비유를 따라 죄가 ‘사라지다’로 번역했습니다. ‘죄’는 עָוֹן의 의미 범위를 읽기 쉽게 옮긴 것이며, 영어 POB의 이미지 중심 처리와도 부합합니다.
theological_decisions:
- issue: 죄의 제거를 어떤 신학적 범주로 좁힐 것인가
  chosen_reading: 본문의 연결 자체—기억됨과 죄의 사라짐—를 유지하고, 공로론이나 단순 비유로 축소하지 않았습니다.
  alternative_readings:
  - 선행이 직접적으로 속죄한다는 더 강한 공로적 읽기
  - 그저 상징적 위로에 불과하다는 약화된 읽기
  rationale: 지혜문학의 문맥은 하나님 앞에서의 기억과 죄의 제거를 함께 말하지만, 본문은 그 기제를 체계적으로 설명하지 않습니다. 따라서 긴장을 보존하는 번역이 가장 충실합니다.
  doctrine_reference: DOCTRINE.md § Preserve theological tension rather than resolve it
