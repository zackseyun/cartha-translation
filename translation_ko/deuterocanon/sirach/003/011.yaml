base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/003/011.yaml
  text: For a man's honor is the honor of his father, and one who dishonors his mother multiplies sin.
  footnotes:
  - marker: a
    text: Or, 'one who curses his mother multiplies sin.' The Hebrew verb can specifically mean 'curse,' though here the honor/shame parallel and the Greek witness support the broader sense 'dishonor.'
    reason: lexical_alternative
  - marker: b
    text: The Greek parallel reads, 'for a man's glory is from the honor of his father, and a mother in disgrace is a reproach to her children,' reflecting a somewhat different second line than the extant Hebrew.
    reason: alternative_reading
translation:
  language: ko
  text: 한 사람의 영광은 그의 아버지의 영광이며, 자기 어머니를 욕되게 하는 자는 죄를 늘립니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 ‘저주하다’까지도 뜻할 수 있지만, 여기서는 명예-수치 대구와 헬라어 평행본문이 ‘욕되게 하다’ 쪽을 지지합니다.
    reason: lexical_alternative
  - marker: b
    text: 헬라어 평행본문은 ‘한 사람의 영광은 아버지의 존귀에서 나온다’에 가깝고, 둘째 행도 ‘어머니는 자녀들에게 불명예’라고 읽습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: כְּבוֹד / δόξα
  english_pob_choice: honor / glory
  chosen_korean: 영광
  alternatives_korean:
  - 존귀
  - 명예
  lexicon: HALOT; BDAG
  rationale: 지혜문맥의 כבוד는 사회적 명예를 가리키기도 하지만, 이 절은 아버지와 아들의 연관을 대칭적으로 진술하며 헬라어도 δόξα를 사용하므로 한국어에서는 보다 직접적인 ‘영광’이 원문의 울림을 잘 살립니다.
- source_word: אִישׁ
  english_pob_choice: a man
  chosen_korean: 한 사람
  alternatives_korean:
  - 남자
  - 사람
  lexicon: HALOT
  rationale: 히브리어는 남성 단수이지만 잠언적 일반성을 띠므로, 한국어에서는 자연스러우면서도 대표성을 유지하는 ‘한 사람’으로 옮겼습니다.
- source_word: מְקַלֵּל
  english_pob_choice: one who dishonors his mother
  chosen_korean: 욕되게 하는 자
  alternatives_korean:
  - 저주하는 자
  - 모욕하는 자
  lexicon: HALOT
  rationale: Piel קלל은 ‘저주하다’와 ‘가볍게 여기다/욕되게 하다’의 뜻을 모두 가질 수 있습니다. 여기서는 명예-수치 대구와 헬라어의 ‘수치/불명예’ 계열을 반영하여 더 넓은 의미의 ‘욕되게 하다’를 택했습니다.
- source_word: חֵטְא
  english_pob_choice: sin
  chosen_korean: 죄
  alternatives_korean:
  - 죄책
  - 과오
  lexicon: HALOT
  rationale: 윤리적 훈계 문맥에서 חטא는 일반적인 ‘죄’가 가장 직접적이며, ‘늘립니다’와의 결합도 자연스럽습니다.
theological_decisions:
- issue: 첫 행의 כבוד를 ‘영광’으로 둘지 ‘명예’로 둘지
  chosen_reading: ‘한 사람의 영광은 그의 아버지의 영광’
  alternative_readings:
  - ‘한 사람의 명예는 그의 아버지의 명예’
  - ‘한 사람의 존귀는 그의 아버지의 존귀’
  rationale: 이 절은 혈연 관계 안에서 명예가 전가·공유된다는 지혜문학적 진술이며, 헬라어 병행본문의 δόξα도 고려할 때 ‘영광’이 원문의 고상하고 공적 성격을 더 잘 드러냅니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 3, 5
- issue: מְקַלֵּל을 ‘저주하는 자’로 좁히지 않고 ‘욕되게 하는 자’로 옮길지
  chosen_reading: ‘자기 어머니를 욕되게 하는 자’
  alternative_readings:
  - ‘자기 어머니를 저주하는 자’
  - ‘자기 어머니를 모욕하는 자’
  rationale: 본문의 핵심 대조는 ‘영광/수치’이며, 그리스어 평행본문도 저주보다 불명예를 말합니다. 따라서 한국어에서는 좁은 욕설 행위보다 더 넓은 수치 부여를 포괄하는 표현이 더 source-direct합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 3, 5
