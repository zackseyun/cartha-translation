translation:
  language: ko
  text: 무거운 마음[a]의 고통은 더욱 많아지고, 경솔하게 행동하는[b] 자는 죄에 죄를 더합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '그리스어 병행본문: “굳은 마음은 마침내 괴로움을 당할 것이며, 굳은 마음은 마침내 무거워질 것이다.”'
    reason: alternative_reading
  - marker: b
    text: ‘경솔하게 행동하는’으로 옮긴 히브리어는 뜻이 어려우며, 거칠게 행동함, 자기기만, 또는 과장된 자만을 암시할 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵב כָּבֵד
  english_pob_choice: a heavy heart
  chosen_korean: 무거운 마음
  alternatives_korean:
  - 무거운 심장
  - 굳은 마음
  - 완고한 마음
  lexicon: HALOT
  rationale: 히브리어 직역 이미지를 살리면서도 한국어에서 자연스러운 표현으로 옮겼습니다. POB의 ‘heavy heart’는 감정적 부담과 내적 무게를 함께 담으므로 ‘무거운 마음’이 가장 직접적입니다.
- source_word: יִרְבּוּ מַכְאֹבָיו
  english_pob_choice: multiplies its pains
  chosen_korean: 그 고통을 더하고
  alternatives_korean:
  - 그 고통을 늘리고
  - 그 아픔을 더하고
  - 고통을 배가하고
  lexicon: HALOT
  rationale: ‘늘리다/더하다’는 증가의 동사를 살리되, 한국어에서는 목적어를 자연스럽게 받아 ‘그 고통을 더하다’로 정리했습니다. ‘pains’는 맥락상 내적 고통까지 포괄할 수 있어 ‘고통’이 무난합니다.
- source_word: וּמִתְהוֹלֵל
  english_pob_choice: one who behaves recklessly
  chosen_korean: 함부로 행동하는 자
  alternatives_korean:
  - 난폭하게 구는 자
  - 자기기만에 빠진 자
  - 허세 부리는 자
  lexicon: HALOT
  rationale: 히브리어 동사는 난해하므로, POB가 잡은 핵심 뜻인 무절제하고 위험한 행동을 한국어로 옮겼습니다. 지나치게 좁은 해석 대신 도덕적 경계의 의미를 보존했습니다.
- source_word: עָוֹן עַל עָוֹן
  english_pob_choice: sin upon sin
  chosen_korean: 죄에 죄를 더합니다
  alternatives_korean:
  - 죄 위에 죄를 쌓습니다
  - 죄를 거듭합니다
  - 죄 위에 죄
  lexicon: HALOT
  rationale: 반복과 누적의 이미지를 한국어에서 자연스럽게 살리기 위해 ‘죄에 죄를 더하다’로 옮겼습니다. ‘upon’의 중첩 감각을 직접 전달합니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행본문의 첫 절구 차이
  chosen_reading: 본문은 히브리어의 ‘무거운 마음’과 ‘고통을 더하다’를 따르고, 그리스어의 ‘굳은 마음… 마침내’ 계열은 본문에 넣지 않았습니다.
  alternative_readings:
  - 굳은 마음은 마침내 괴로움을 당합니다
  - 굳은 마음은 마침내 무거워집니다
  rationale: 이 절은 히브리어와 그리스어가 상당히 다르며, 자료도 이를 중대한 불일치로 표시합니다. 따라서 본문은 현존 히브리어를 우선하되, 그리스어 계열은 별도 각주 없이 번역 본문에 섞지 않아 출처 구분을 분명히 했습니다.
  doctrine_reference: 'PHILOSOPHY.md: surviving Hebrew is primary; Greek parallel is preserved as an honest alternate witness.'
