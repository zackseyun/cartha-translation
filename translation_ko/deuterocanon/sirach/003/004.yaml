  source_fidelity: 원문의 비교 구문(ὡς)과 두 현재분사(‘어머니를 공경하는 자’, ‘보물을 쌓아 두는 이’)의 관계를 충실히 반영합니다. ‘공경하는’은 이 문맥의 δοξάζων에 적절하며, 보물이 무엇을 뜻하는지는 규정하지 않아 원문의 열린 비유를 보존합니다.
