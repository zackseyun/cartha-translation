  yaml_path: translation/deuterocanon/sirach/003/004.yaml
  text: And whoever honors his mother is like one who stores up treasure.
translation:
  language: ko
  text: 그리고 자기 어머니를 공경하는 자는, 보물을 쌓아 두는 이와 같습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δοξάζων
  english_pob_choice: honors
  chosen_korean: 공경하는
  alternatives_korean:
  - 존경하는
  - 영광 돌리는
  lexicon: BDAG
  rationale: 이 지혜문맥에서는 어머니에게 마땅한 존중과 예우를 표하는 뜻이므로, 예배적 뉘앙스가 강한 표현보다 ‘공경하는’이 가장 자연스럽고 정확합니다.
- source_word: ἀποθησαυρίζων
  english_pob_choice: stores up treasure
  chosen_korean: 보물을 쌓아 두는
  alternatives_korean:
  - 보화를 쌓아 두는
  - 창고에 쌓아 두는
  lexicon: LSJ
  rationale: 동사는 실제로 저장해 두는 이미지를 가지므로, ‘보물’을 직역하기보다 한국어에서 자연스러운 ‘보물을 쌓아 두는’으로 처리해 비유의 구체성을 살렸습니다.
- source_word: ὡς
  english_pob_choice: is like
  chosen_korean: —와 같습니다
  alternatives_korean:
  - —와 같으니
  - —처럼 됩니다
  lexicon: BDAG
  rationale: 비유를 분명히 드러내기 위해 한국어의 비교 구문으로 옮겼습니다.
- source_word: μητέρα αὐτοῦ
  english_pob_choice: his mother
  chosen_korean: 자기 어머니
  alternatives_korean:
  - 그의 어머니
  - 자기 자신의 어머니
  lexicon: BDAG
  rationale: 속담형 교훈의 일반성을 살리면서도 원문의 단수 남성형 소유 대명사를 반영하기 위해 ‘자기 어머니’로 옮겼습니다.
theological_decisions:
- issue: 보물 비유의 의미 범위
  chosen_reading: 어머니를 공경하는 행위를 ‘보물을 쌓아 두는 것’에 비유하되, 그 보물이 물질적 번영인지 하늘의 상급인지 특정하지 않았습니다.
  alternative_readings:
  - 물질적 축복
  - 하늘의 상급
  - 도덕적 유익
  rationale: 원문은 비유만 제시하고 보물의 성격을 규정하지 않으므로, 신학적 의미를 과도하게 좁히지 않고 열린 상태로 두었습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
