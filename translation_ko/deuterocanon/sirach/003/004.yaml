  terminology: ‘공경하다’는 부모에 대한 마땅한 존중을 나타내는 적절한 용어이고, ‘보물을 쌓아 두다’는 ἀποθησαυρίζω의 축적·저장 이미지를 자연스럽게 전달합니다. ‘자기 어머니’는 원문의 단수 소유 관계를 무리 없이 나타냅니다.
