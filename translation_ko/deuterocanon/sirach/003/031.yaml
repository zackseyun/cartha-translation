  text: One who does good will be called blessed for his ways[a], and at the time of his stumbling he will find support.
  footnotes:
  - marker: a
    text: 'Greek: ''The one who repays favors remembers for what comes afterward''; the Greek first line differs substantially from the extant Hebrew, though both agree in the second line that support is found in a time of falling.'
    reason: alternative_reading
translation:
  language: ko
  text: 선을 행하는 사람은 그의 길들 때문에 복되다고 불릴 것이며, 그가 넘어지는 때에는 의지가 되는 것을 찾을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '그리스어: ‘은혜를 갚는 사람은 이후를 기억합니다’; 그리스어 첫 행은 현존 히브리어와 상당히 다르지만, 두 본문은 둘째 행에서 ‘넘어짐의 때에 지지/버팀’을 함께 말합니다.'
    reason: alternative_reading
lexical_decisions:
- source_word: פועל טוב
  english_pob_choice: One who does good
  chosen_korean: 선을 행하는 사람
  alternatives_korean:
  - 선을 행하는 이
  - 선행하는 사람
  - 선한 일을 하는 사람
  lexicon: HALOT
  rationale: 히브리어 הפעול형 표현은 ‘선을 행하는’이라는 행위 중심의 뜻을 담으므로, 한국어도 행위를 드러내는 표현으로 옮겼습니다. 성중립을 유지하면서도 원문의 일반적 지시를 살리기 위해 ‘사람’을 사용했습니다.
- source_word: יקראנו
  english_pob_choice: will be called blessed
  chosen_korean: 복되다고 불릴 것이며
  alternatives_korean:
  - 복되다고 일컬어질 것이며
  - 복을 받았다고 불릴 것이며
  - 복되다고 칭송받을 것이며
  lexicon: HALOT
  rationale: 동사 형태와 문맥상 단순한 호칭이 아니라 그 삶이 공적으로 복된 것으로 평가되는 뜻이므로, 수동적 표현인 ‘복되다고 불릴’로 옮겼습니다.
- source_word: בדרכיו
  english_pob_choice: for his ways
  chosen_korean: 그의 길들 때문에
  alternatives_korean:
  - 그의 길에서
  - 그의 행실 때문에
  - 그의 길로 인해
  lexicon: HALOT
  rationale: ‘길’은 지혜문학에서 삶의 행실을 가리키는 상징적 표현이므로, 은유를 살리면서 원인의 의미를 분명히 하기 위해 ‘때문에’를 붙였습니다.
- source_word: בעת מוטו
  english_pob_choice: at the time of his stumbling
  chosen_korean: 그가 넘어지는 때에는
  alternatives_korean:
  - 그가 넘어질 때에는
  - 그가 쓰러지는 때에는
  - 그의 걸음이 미끄러지는 때에는
  lexicon: HALOT
  rationale: מוט은 미끄러짐, 비틀거림, 넘어짐의 의미를 가지므로, 현대 한국어에서 자연스럽고 은유도 보존하는 ‘넘어지는 때’로 옮겼습니다.
- source_word: משען
  english_pob_choice: support
  chosen_korean: 의지가 되는 것을
  alternatives_korean:
  - 지지할 것을
  - 버팀목을
  - 도움이 되는 것을
  lexicon: HALOT
  rationale: משען은 기대어 의지하는 물건이나 지지를 뜻하므로, 문자적이면서도 자연스러운 ‘의지가 되는 것’을 택했습니다. 지나치게 교회적이거나 관용적인 ‘버팀목’보다 원의가 넓습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행문의 관계
  chosen_reading: 본문은 히브리어를 따르고, 그리스어의 이탈은 주석으로만 남깁니다.
  alternative_readings:
  - 첫 절을 그리스어에 따라 ‘은혜를 갚는 자는…’로 옮김
  - 두 본문을 절충해 혼합 번역
  rationale: 시락서는 현존 히브리어가 있는 경우 히브리어를 우선하는 것이 본 프로젝트의 원칙이므로, 첫 절의 그리스어 차이는 본문에 흡수하지 않고 의미 차이를 투명하게 보존합니다.
  doctrine_reference: PHILOSOPHY.md §What we are translating; Sirach Hebrew-primacy policy
- issue: 성별이 있는 단수형 표현의 보존
  chosen_reading: ‘One who does good’를 한국어로 성중립적이되 단수형으로 유지했습니다.
  alternative_readings:
  - 복수화하여 일반적 진리로 완화
  - 추상화하여 ‘선행’으로 처리
  rationale: 히브리어는 남성 단수형을 사용하지만 지혜문학의 일반 진술로 기능합니다. 한국어에서는 성별을 과도하게 부각하지 않되, 단수 일반론의 힘은 유지하는 방식이 가장 투명합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
