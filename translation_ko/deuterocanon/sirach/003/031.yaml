- from: 선을 행하는 사람은 그의 길들 때문에 복되다고 불릴 것이며, 그가 넘어지는 때에는 의지가 되는 것을 찾을 것입니다.[a]
  to: 선을 행하는 사람은 그의 행실 때문에 복되다고 불릴 것이며, 그가 넘어질 때에는 버팀목을 찾을 것입니다.[a]
