review_pass:
  verdict: revise
  source_fidelity: 히브리어 본문을 따른 본문의 기본 의미는 정확합니다. 다만 בדרכיו의 지혜문학적 의미는 ‘그의 길들 때문에’보다 ‘그의 행실 때문에’가 한국어에서 더 분명하고 자연스럽습니다. משען은 기대어 지탱하는 대상을 뜻하므로 ‘버팀목’이 ‘의지가 되는 것’보다 원의와 문맥을 더 정확히 드러냅니다.
  naturalness: 초안의 ‘그의 길들 때문에’와 ‘의지가 되는 것을’은 현대 표준 한국어에서 다소 직역투이고 어색합니다. ‘그의 행실 때문에’와 ‘버팀목을 찾을 것입니다’로 고치면 합쇼체를 유지하면서도 자연스러워집니다. ‘그가 넘어질 때에는’도 진행형처럼 들리는 ‘넘어지는 때’보다 자연스럽습니다.
  terminology: ‘선을 행하는 사람’, ‘복되다고 불릴 것이다’는 지혜문학의 일반적 진술과 원문의 칭송 의미를 잘 전달합니다. ‘버팀목’은 신학적으로 특정 교파의 용례를 강요하지 않으면서 משען의 구체적·비유적 의미를 모두 살립니다. 각주에서는 그리스어 첫 행의 실질적 이탈과 둘째 행의 공통점을 더 정확하고 자연스럽게 밝혔습니다.
  issues:
