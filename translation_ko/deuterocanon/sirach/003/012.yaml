  lexicon: HALOT
  rationale: 히트파엘 명령형의 자기-강화 뉘앙스를 살리되, 한국어에서는 행위 영역을 연결하는 ‘굳세어지고’가 가장 자연스럽습니다.
- source_word: בִּכִּבּוּד
  english_pob_choice: in honoring
  chosen_korean: 아버지를 공경하는 일에
  alternatives_korean:
