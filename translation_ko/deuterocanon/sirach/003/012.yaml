  - 존경하는 가운데
  - 공경하면서
  lexicon: HALOT
  rationale: ב + 명사 כיבוד의 관용적 결합을 ‘~하는 일에’로 풀어, 단순 감정이 아니라 지속적 실천을 뜻하게 했습니다.
- source_word: וְאַל תַּעַזְבֵהוּ
  english_pob_choice: and do not forsake him
  chosen_korean: 그를 저버리지 마십시오
  alternatives_korean:
  - 그를 버리지 마십시오
  - 그를 떠나지 마십시오
  - 그를 외면하지 마십시오
  lexicon: HALOT
  rationale: עזב의 핵심 의미인 ‘버리다/저버리다’를 살려 도덕적·관계적 의무의 무게를 드러냈습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행본문의 차이
  chosen_reading: 본문은 히브리어를 따라 ‘아버지를 공경하는 일에 굳세어지고, 평생 그를 저버리지 말라’로 옮겼습니다.
  alternative_readings:
  - 그리스어를 따라 ‘늙으신 아버지를 도와드리고, 그 생애 동안 그를 슬프게 하지 말라’로 옮길 수 있습니다.
  rationale: 이 절은 히브리어가 보존된 곳에서는 히브리어를 우선하는 편집 원칙에 따릅니다. 다만 그리스어는 노년 부양과 정서적 상처를 분명히 하므로, 그 차이를 주석적 대안으로 남겨야 합니다.
  doctrine_reference: 'PHILOSOPHY.md: 히브리어가 남아 있으면 그 본문을 우선하고, 그리스어 병행본문은 중요한 대조 증거로 기록한다.'
