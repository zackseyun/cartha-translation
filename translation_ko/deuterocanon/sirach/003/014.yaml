translation:
  language: ko
  text: 아버지의 의는 지워지지 않으며, 죄들 대신 그것은 심겨집니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '그리스어: “아버지의 자선은 잊히지 않을 것이며, 죄들 대신 그것은 너를 위해 세워질 것이다.” 그리스어는 ‘자선’과 ‘세워지다’로 다르게 읽습니다.'
    reason: alternative_reading
lexical_decisions:
- source_word: צִדְקַת אָב
  english_pob_choice: a father's righteousness
  chosen_korean: 아버지의 의
  alternatives_korean:
  - 아버지의 자비
  - 아버지의 자선
  - 아버지에게서 나오는 의
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘아버지의 의’이며, 영어 POB도 히브리 본문을 우선해 넓은 도덕적 의미를 살렸습니다. 한국어도 ‘의’로 옮겨 원문의 범주를 유지했습니다.
- source_word: לֹא תִּמָּחֶה
  english_pob_choice: will not be wiped away
  chosen_korean: 지워지지 않으며
  alternatives_korean:
  - 없어지지 않으며
  - 말소되지 않으며
  - 지워져 버리지 않으며
  lexicon: HALOT
  rationale: נמחה의 수동적 소거 이미지를 현대 한국어에서 자연스럽게 살리면서, 기록에서 사라지는 뉘앙스를 유지했습니다.
- source_word: וּתְמוּר
  english_pob_choice: and in place of
  chosen_korean: 죄들 대신
  alternatives_korean:
  - 죄들에 맞서
  - 죄들 대신에
  - 죄를 대신하여
  lexicon: HALOT
  rationale: תמור는 교환·대체의 뜻이므로, ‘대신’으로 옮겨 대치 관계를 분명하게 했습니다.
- source_word: הִיא תְּנַתֵּעַ
  english_pob_choice: it will be planted
  chosen_korean: 그것은 심겨집니다
  alternatives_korean:
  - 그것은 세워집니다
  - 그것은 뿌리내립니다
  - 그것은 심어집니다
  lexicon: HALOT
  rationale: 히브리어 본문은 נטע 계열의 ‘심다’ 이미지를 지니므로 이를 따랐습니다. 영어 각주가 제시하는 그리스어의 ‘세워지다’는 대조 자료로만 남기고 본문은 히브리어를 반영했습니다.
theological_decisions:
- issue: ‘죄들 대신’과 ‘심겨집니다’가 만드는 보상/대치의 의미
  chosen_reading: 본문의 교환 표현을 그대로 살려, 행위의 도덕적 결과가 죄를 덮거나 상쇄하는 지혜문학적 긴장을 유지했습니다.
  alternative_readings:
  - 죄를 용서받는다는 뜻으로 완화하기
  - 구원 공로의 교리로 구체화하기
  - 단순한 기억 보존으로 약화하기
  rationale: 집회서의 문맥은 강한 도덕적 상응 언어를 사용하므로, 이를 설명적으로 풀어 신학적 체계를 미리 결론내리지 않았습니다.
  doctrine_reference: DOCTRINE.md §3 Preserve theological tension rather than resolve it
