  source_fidelity: 히브리어의 금지, 상처·치유 비유, 그리고 마지막 절의 전승상 복수형을 본문에 보존하는 방향은 적절합니다. 다만 ‘고치다’보다 רפוא/רפואה의 치유 어휘를 일관되게 반영하는 ‘치료하다’가 더 정확합니다. 마지막 절의 복수 ‘그들은’은 선행하는 단수 ‘조롱하는 자’와의 불일치를 그대로 드러내므로 유지합니다.
  naturalness: ‘상처를 고치려고’와 ‘그것은 낫지 않기 때문입니다’는 일상적으로는 이해되지만, 상처를 치료하는 행위와 치료 가능성에 관한 원문의 반복 어휘를 충분히 살리지 못합니다. ‘치료하려고’ 및 ‘치료할 방법이 없기’가 현대 표준 한국어 합쇼체에서 더 자연스럽고 명료합니다. ‘악한 심기’는 원문의 의도적인 식재 비유와 어색한 반복을 최소한의 한국어로 보존합니다.
  terminology: לֵץ는 ‘조롱하는 자’로 적절합니다. רפא/רפואה는 ‘치료하다/치료할 방법’으로 통일합니다. נטע의 식재 이미지는 ‘심기’로 유지하며, 그리스어의 ‘악의 식물이 그 안에 뿌리내림’은 본문을 조화시키지 않고 각주에 둡니다.
