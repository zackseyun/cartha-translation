translation:
  language: ko
  text: 조롱하는 자의 상처를 고치려고 서두르지 마십시오. 그것은 낫지 않기 때문입니다. 그들은 악한 심음에서 심겨졌기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 평행본문은 “그에게 악의 식물이 뿌리내렸기 때문입니다”에 가까우며, 히브리어 마지막 절은 복수형으로 다소 어색합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תָּרוּץ
  english_pob_choice: Do not hurry
  chosen_korean: 서두르지 마십시오
  alternatives_korean:
  - 급히 달려가지 마십시오
  - 서두르지 마십시오
  lexicon: HALOT
  rationale: רוץ는 문자적으로 ‘달리다’이지만, 금지형에서는 성급한 행동을 뜻하므로 ‘서두르다’가 한국어에서 가장 자연스럽고 뜻을 살립니다.
- source_word: לְרַפְּאוֹת מַכַּת
  english_pob_choice: to heal the wound
  chosen_korean: 상처를 고치려고
  alternatives_korean:
  - 상처를 치료하려고
  - 상처를 낫게 하려고
  lexicon: HALOT
  rationale: רפא/מכה의 상처-치유 이미지를 살리되, 합쇼체 문장에서 자연스러운 동사로 ‘고치다’를 택했습니다.
- source_word: לֵץ
  english_pob_choice: a scoffer
  chosen_korean: 조롱하는 자
  alternatives_korean:
  - 비웃는 자
  - 조롱꾼
  lexicon: HALOT
  rationale: 지혜문학에서 לץ는 단순한 농담꾼이 아니라 교정을 거부하는 경멸적 인물을 가리키므로, 기능적으로 ‘조롱하는 자’로 옮겼습니다.
- source_word: מִנֶּטַע רַע נִטְעוֹ
  english_pob_choice: from an evil planting / they were planted
  chosen_korean: 악한 심음에서 심겨졌기 때문입니다
  alternatives_korean:
  - 악한 심기에서 심겨졌기 때문입니다
  - 악한 나무심음에서 심겨졌기 때문입니다
  lexicon: HALOT
  rationale: נטע의 식물/심음 이미지를 유지하고, 전승된 히브리어의 복수형 어감을 반영해 ‘심겨졌기 때문입니다’로 마무리했습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 평행본문의 마지막 절 처리
  chosen_reading: 본문은 히브리어 전승을 따라 복수 어미의 어색함을 드러내되, 그리스어가 제시하는 더 매끄러운 단수적 ‘뿌리내림’ 이미지를 한국어 본문에는 과도하게 조화시키지 않았습니다.
  alternative_readings:
  - 그에게 악한 식물이 뿌리내렸기 때문입니다
  - 그 안에 악의 나무가 뿌리내렸기 때문입니다
  rationale: 시락 3:28의 히브리어는 전승상 다소 거칠지만, POB 원칙상 가용한 히브리어를 우선하고 그 불일치를 숨기지 않는 것이 더 충실합니다.
  doctrine_reference: 'POB source-priority policy for Sirach: Hebrew primacy where extant, with Greek parallel used for audit and footnote-level transparency.'
