translation:
  language: ko
  text: 아버지를 공경하는 이는 오래 살 것이며, 어머니를 공경하는 이는 하나님께 보답하는 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '그리스어 병행: ‘주님께 순종하는 이는 그의 어머니에게 안식을 줍니다.’ 히브리어와 그리스어는 둘째 행에서 상당히 다릅니다.'
    reason: alternative_reading
lexical_decisions:
- source_word: מְכַבֵּד
  english_pob_choice: honors
  chosen_korean: 공경하는
  alternatives_korean:
  - 존경하는
  - 영화롭게 하는
  lexicon: HALOT
  rationale: 가족 관계와 계명 전통을 살리면서도 현대 한국어에서 자연스럽고 격식을 갖춘 대응으로 옮겼습니다.
- source_word: יִרְבּוּ יָמָיו
  english_pob_choice: will have long days
  chosen_korean: 오래 살 것이며
  alternatives_korean:
  - 그의 날들이 많아질 것이며
  - 긴 날들을 누릴 것이며
  lexicon: HALOT
  rationale: 직역의 이미지보다 한국어에서 의미가 분명한 결과 표현을 택하되, 장수를 약속하는 원뜻은 유지했습니다.
- source_word: וּגְמוּל אֱלֹהִים עַל
  english_pob_choice: is repaying God
  chosen_korean: 하나님께 보답하는 것입니다
  alternatives_korean:
  - 하나님께 보상하는 것입니다
  - 하나님께 갚는 것입니다
  lexicon: HALOT
  rationale: 히브리어의 압축된 표현이 ‘하나님께 대한 보답/보상’의 의미를 띠므로, 한국어에서는 결과 서술로 풀어 자연스럽게 만들었습니다.
- source_word: אִמּוֹ
  english_pob_choice: his mother
  chosen_korean: 어머니를
  alternatives_korean:
  - 그의 어머니를
  - 자기 어머니를
  lexicon: HALOT
  rationale: 히브리어의 인칭 접미사는 앞절과의 평행성 안에서 이미 충분히 드러나므로, 한국어에서는 반복을 줄여 간결하게 처리했습니다.
theological_decisions:
- issue: ‘보답하는 것입니다’의 신학적 방향성
  chosen_reading: 어머니를 공경하는 행위를 하나님께 대한 보답으로 진술했습니다.
  alternative_readings:
  - 어머니에게 평안을 주는 것으로 옮김
  - 하나님의 보상을 받는다고 옮김
  rationale: 히브리어 본문은 어머니 공경과 하나님께 대한 보답을 연결하며, 이를 도덕적/언약적 책임의 언어로 유지하는 것이 본문의 힘을 보존합니다.
  doctrine_reference: 'PHILOSOPHY.md: source-first rendering; DOCTRINE.md: preserve lexical/theological tension in Sirach'
- issue: 히브리어 본문과 그리스어 병행문의 차이
  chosen_reading: 히브리어 본문을 본문역으로 따르되, 본문 내에서는 그 차이를 중화하지 않았습니다.
  alternative_readings:
  - 그리스어 병행에 따라 ‘주님께 순종하는 이는 어머니에게 안식을 줍니다’로 옮김
  rationale: 전승 차이는 본문의 중요한 자료이므로, 히브리어가 남아 있는 곳에서는 그것을 주본문으로 번역하고 다른 전승은 각주로 보존하는 원칙을 따랐습니다.
  doctrine_reference: 'PHILOSOPHY.md: translate from Hebrew where it survives; DOCTRINE.md: preserve theological tension rather than resolve it silently'
