  source_fidelity: 히브리어 פְּלָאוֹת מִמְּךָ는 단순히 이상하거나 기묘한 것을 뜻하기보다, 수신자의 범위나 능력을 넘어서는 경이로운 일을 가리킵니다. 초안의 ‘너무 기이하여 네가 감당할 수 없는 것’은 그 의미를 대체로 전달하지만, 인과관계와 ‘감당’의 뜻을 다소 강하게 풀어 썼습니다. ‘네 능력을 넘어서는 놀라운 것’은 히브리어의 경이로움과 מִמְּךָ의 한계 표지를 함께 더 간결하게 반영합니다. 둘째 행의 ‘숨겨진 것’ 및 탐구 금지는 원문에 충실합니다.
