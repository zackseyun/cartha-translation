base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/003/021.yaml
  text: Do not seek what is too wondrous for you[a], and do not search out what is hidden from you.
  footnotes:
  - marker: a
    text: 'Or, following the Greek parallel more closely: ''Do not seek what is harder than you, and do not examine what is stronger than you.'' The Hebrew emphasizes what is too wondrous and hidden; the Greek emphasizes what exceeds your capacity.'
    reason: alternative_reading
translation:
  language: ko
  text: 네 능력을 넘어서는 놀라운 것을 찾지 마시고, 네게 숨겨진 것에 깊이 파고들지 마십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘네게 너무 경이로운 것’과 ‘네게 숨겨진 것’을 말합니다. 그리스어 평행본문은 ‘너보다 더 어려운 것’과 ‘너보다 더 강한 것’으로 표현하여, 인간의 능력을 넘어서는 대상이라는 뜻을 더 분명히 드러냅니다.
    reason: alternative_reading
lexical_decisions:
- source_word: פְּלָאוֹת
  english_pob_choice: what is too wondrous for you
  chosen_korean: 너무 기이하여 네가 감당할 수 없는 것
  alternatives_korean:
  - 기이한 것
  - 너무 놀라운 것
  - 네게 너무 신비한 것
  - 네 능력을 넘는 것
  lexicon: HALOT
  rationale: פּלא의 핵심은 단순한 ‘신기함’이 아니라 사람의 분별과 능력을 넘어서는 경외로운 것들이므로, 한국어에서도 ‘기이하여 감당할 수 없는 것’으로 그 초월성과 한계를 함께 살렸습니다.
- source_word: אַל תִּדְרוֹשׁ
  english_pob_choice: do not seek
  chosen_korean: 찾지 말고
  alternatives_korean:
  - 구하지 말고
  - 추구하지 말고
  - 묻지 말고
  lexicon: HALOT
  rationale: דרש는 찾다, 구하다, 캐묻다의 폭이 있으나 여기서는 과도한 탐색을 금하는 권고이므로 가장 자연스러운 합쇼체 금지형인 ‘찾지 말고’를 택했습니다.
- source_word: וּמְכֻסֶּה
  english_pob_choice: what is hidden
  chosen_korean: 네게 숨겨진 것
  alternatives_korean:
  - 숨겨진 것
  - 가려진 것
  - 감추어진 것
  lexicon: HALOT
  rationale: כסה는 덮다, 가리다, 숨기다의 뜻이 있어, 문맥상 단순한 비밀보다 ‘네게 숨겨진 것’이 원문의 거리감과 수동적 은폐를 더 분명히 드러냅니다.
- source_word: אַל תַּחְקוֹר
  english_pob_choice: do not search out
  chosen_korean: 파헤치지 마십시오
  alternatives_korean:
  - 캐내지 마십시오
  - 조사하지 마십시오
  - 뒤지지 마십시오
  lexicon: HALOT
  rationale: חקר는 단순한 질문이 아니라 깊이 캐고 조사하는 행위를 가리키므로, 한국어에서는 탐구의 강도를 살리는 ‘파헤치지 마십시오’가 가장 적절합니다.
theological_decisions:
- issue: 이 절이 지혜의 경계 설정인지, 모든 신학적 탐구의 전면 금지인지
  chosen_reading: 사람에게 감당되지 않도록 감추어진 것까지 넘보지 말라는 지혜의 경고로 읽었습니다.
  alternative_readings:
  - 모든 신비에 대한 탐구 금지
  - 오만한 추측만 금지
  rationale: 히브리어의 ‘너무 기이한 것’과 ‘네게 숨겨진 것’은 단순한 호기심이 아니라 인간의 한계를 넘어선 대상을 가리키므로, 번역에서도 경외와 절제를 유지했습니다.
  doctrine_reference: 'Translation philosophy §3: preserve theological tension rather than resolve it'
