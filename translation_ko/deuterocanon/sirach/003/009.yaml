translation:
  language: ko
  text: 아버지의 복은 뿌리를 세우지만, 어머니의 저주는 식물을 뿌리째 뽑아버립니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 병행문은 “아버지의 복은 자녀의 집들을 굳게 하지만, 어머니의 저주는 기초들을 뿌리 뽑는다”라고 읽습니다. 히브리어 증인은 본문에서 ‘뿌리’와 ‘식물’의 농경 이미지를 사용합니다.
    reason: cross_reference
lexical_decisions:
- source_word: בִּרְכַת אָב
  english_pob_choice: father's blessing
  chosen_korean: 아버지의 복
  alternatives_korean:
  - 아버지의 축복
  - 아버지가 하는 축복
  lexicon: HALOT
  rationale: בִּרְכַת은 문맥상 사람을 위한 благословение이므로 한국어에서는 교회 용례의 ‘축복’보다 간결한 ‘복’이 속담의 힘을 살리며, 소유격 구조도 자연스럽게 반영합니다.
- source_word: תְּיַסֵּד שֹׁרֶשׁ
  english_pob_choice: establishes roots
  chosen_korean: 뿌리를 세우지만
  alternatives_korean:
  - 뿌리를 굳게 하지만
  - 기초를 놓지만
  - 뿌리를 든든히 하지만
  lexicon: HALOT
  rationale: יסד의 ‘세우다/기초를 놓다’ 의미를 살리되, Hebrew의 ‘뿌리’ 이미지를 그대로 유지하기 위해 ‘뿌리를 세우다’로 옮겼습니다.
- source_word: וְקִלְלַת אֵם
  english_pob_choice: but a mother's curse
  chosen_korean: 어머니의 저주는
  alternatives_korean:
  - 그리고 어머니의 저주는
  - 어머니의 저주는
  lexicon: HALOT
  rationale: 대조적 평행구조이므로 접속을 단순한 ‘그리고’보다 반전 대비가 분명한 문맥으로 처리하되, 본문에는 자연스러운 한국어 어순으로 제시했습니다.
- source_word: תִּנְתּשׁ נֶטַע
  english_pob_choice: uproots a plant
  chosen_korean: 식물을 뿌리째 뽑아버립니다
  alternatives_korean:
  - 식물을 뽑아냅니다
  - 한 그루를 뿌리째 뽑습니다
  - 심은 것을 뽑아버립니다
  lexicon: HALOT
  rationale: נטש의 강한 제거 이미지를 살리기 위해 ‘뿌리째 뽑아버립니다’로 옮겼고, נֶטַע는 구체적인 ‘식물’로 두어 농경적 비유를 보존했습니다.
theological_decisions:
- issue: 히브리어 본문의 농경 이미지와 그리스어 병행문의 이미지 차이
  chosen_reading: 본문에는 히브리어의 ‘뿌리/식물’ 이미지를 따르되, 그리스어의 다른 형상은 본문을 대체하지 않도록 했습니다.
  alternative_readings:
  - 그리스어처럼 ‘자녀의 집들 / 기초들’로 옮기기
  rationale: 집성된 히브리어 사본이 고신뢰이므로, 번역 본문은 히브리어를 우선하고 그리스어는 대조적 병행 전승으로만 존중하는 것이 원문 충실성에 맞습니다.
  doctrine_reference: Sirach 원문 우선 원칙; 히브리어가 보존된 집성본을 기본 본문으로 삼는 번역 방침
