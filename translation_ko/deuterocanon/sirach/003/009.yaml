  source_fidelity: 히브리어 본문은 분명히 ‘아버지의 복—뿌리’와 ‘어머니의 저주—심은 것/식물’이라는 농경 비유를 대조합니다. 초안은 이 대조와 저주가 ‘뽑아 냄’이라는 동작을 충실히 보존합니다. 다만 ‘식물’은 이 격언 문맥에서 다소 학술적·기술적으로 들리며, נֶטַע의 ‘심은 것’이라는 명사적 이미지를 더 자연스럽게 옮길 수 있습니다.
