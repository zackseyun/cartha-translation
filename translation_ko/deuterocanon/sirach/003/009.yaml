  terminology: ‘복’과 ‘저주’는 본문의 짧고 격언적인 어조에 알맞으며, ‘축복’보다 원문의 명사 대조를 간결하게 드러냅니다. 그리스어 병행문은 히브리어와 다른 ‘자녀의 집들/기초’ 이미지를 가리키므로, 이를 대체 본문이 아닌 대안 전승으로 명시하는 편이 정확합니다.
