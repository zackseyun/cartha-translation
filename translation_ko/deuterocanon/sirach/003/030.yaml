  lexicon: HALOT
  rationale: 동사는 불을 끄는 구체적 행위를 뜻하므로, 비유를 유지하면서도 직관적인 ‘끕니다’를 선택했습니다.
- source_word: צדקה
  english_pob_choice: almsgiving
  chosen_korean: 자선
  alternatives_korean:
  - 구제
  - 의
  - 자비
  lexicon: HALOT
  rationale: 히브리어 צדקה는 넓게는 ‘의’이지만, 여기서는 그리스어 ἐλεημοσύνη가 가리키는 구제 행위가 문맥상 더 분명하므로 ‘자선’으로 옮겼습니다.
- source_word: תכפר חטאת
  english_pob_choice: makes atonement for sin
  chosen_korean: 죄를 속합니다
  alternatives_korean:
  - 죄를 속죄합니다
  - 죄에 대해 속죄합니다
  - 죄를 대속합니다
  lexicon: HALOT
  rationale: כפר의 속죄/속화 의미를 살리되, 현대 한국어에서 자연스럽게 읽히는 ‘속합니다’를 택해 ‘자선이 죄에 대한 속죄 작용을 한다’는 진술을 보존했습니다.
theological_decisions:
- issue: צדקה의 의미를 ‘의’로 일반화할지, 구제 행위로 구체화할지
  chosen_reading: 문맥과 그리스어 병행구를 따라 ‘자선’으로 구체화했습니다.
  alternative_readings:
  - ‘의’
  - ‘공의’
  rationale: 이 절은 불과 물의 비유 뒤에 구제와 속죄를 연결하는 잠언형 진술이므로, 추상적 덕목보다 실제 자선 행위를 가리키는 쪽이 본문의 신학적 무게를 더 정확히 드러냅니다.
  doctrine_reference: Ben Sira 3:30의 구제-속죄 진술; 히브리어-그리스어 병행본문에 근거한 의미 결정
