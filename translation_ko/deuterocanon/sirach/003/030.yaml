theological_decisions:
- issue: צדקה의 의미를 ‘의’로 일반화할지, 구제 행위로 구체화할지
  chosen_reading: 문맥과 그리스어 병행구를 따라 ‘자선’으로 구체화했습니다.
  alternative_readings:
  - ‘의’
  - ‘공의’
  rationale: 이 절은 불과 물의 비유 뒤에 구제와 속죄를 연결하는 잠언형 진술이므로, 추상적 덕목보다 실제 자선 행위를 가리키는 쪽이 본문의 신학적 무게를 더 정확히 드러냅니다.
  doctrine_reference: Ben Sira 3:30의 구제-속죄 진술; 히브리어-그리스어 병행본문에 근거한 의미 결정
