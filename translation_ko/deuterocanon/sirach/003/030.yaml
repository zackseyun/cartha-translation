  lexicon: HALOT
  rationale: אש לוהטת는 단순한 불이 아니라 격렬하게 타오르는 불을 가리키므로, 한국어에서는 자연스럽고 강도를 살리는 ‘맹렬한 불’로 옮겼습니다.
- source_word: יכבו
