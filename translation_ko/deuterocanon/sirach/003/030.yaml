  text: Water extinguishes a blazing fire[b][a]; so almsgiving makes atonement for sin.
  footnotes:
  - marker: a
    text: Or 'charity'; Hebrew צדקה can also mean 'righteousness,' but the Greek parallel reads 'almsgiving' (ἐλεημοσύνη), which likely reflects the intended sense here.
    reason: lexical_alternative
  - marker: b
    text: Greek has 'sins' (plural). The Hebrew 'sin' may be understood generically.
    reason: alternative_reading
translation:
  language: ko
  text: 맹렬한 불을 물이 끄듯이, 자선은 죄를 속합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 צדקה는 넓게는 ‘의’를 뜻할 수 있으나, 여기서는 그리스어 병행본문 ἐλεημοσύνη가 가리키는 ‘자선/구제’의 뜻을 따랐습니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어는 ‘죄들’(복수)로 되어 있습니다. 히브리어는 단수 ‘죄’로 읽을 수 있어, 한국어에서는 일반적 표현으로 처리했습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אש לוהטת
  english_pob_choice: a blazing fire
  chosen_korean: 맹렬한 불
  alternatives_korean:
