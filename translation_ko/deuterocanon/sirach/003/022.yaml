translation:
  language: ko
  text: 명령받은 바를 생각하십시오. 그리고 숨은 일들에는 관여하지 마십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘허락받은/승인받은 바’로도 읽힐 수 있으나, 그리스어 평행본문은 ‘명령받은 것’을 가리킵니다.
    reason: alternative_reading
lexical_decisions:
- source_word: בַּמֶּה שֶׁהוּרְשֵׁיתָ / ἃ προσετάγη σοι
  english_pob_choice: what you have been commanded
  chosen_korean: 명령받은 바
  alternatives_korean:
  - 부여받은 바
  - 허락받은 바
  - 맡겨진 바
  lexicon: HALOT; SBLGNT parallel
  rationale: 히브리어는 ‘허락/승인받다’로도 읽힐 수 있지만, 그리스어 평행본문이 분명히 ‘명령받다’로 읽으므로 본문이 요구하는 책임의 뉘앙스를 살려 ‘명령받은 바’로 옮겼습니다.
- source_word: הִתְבּוֹנֵן
  english_pob_choice: consider
  chosen_korean: 생각하십시오
  alternatives_korean:
  - 숙고하십시오
  - 생각해 보십시오
  - 깊이 살피십시오
  lexicon: HALOT
  rationale: 지혜문학의 권면으로서 자연스러운 현대 한국어 명령형을 택해, 사유를 요구하는 뜻을 간결하게 드러냈습니다.
- source_word: וְאֵין לְךָ עֵסֶק
  english_pob_choice: you have no business
  chosen_korean: 관여하지 마십시오
  alternatives_korean:
  - 상관하지 마십시오
  - 다룰 일이 아닙니다
  - 관심 둘 일이 아닙니다
  lexicon: HALOT
  rationale: ‘עסק’의 관여/관련의 뜻을 살려, 단순한 필요 부재보다 ‘그 일에 끼어들지 말라’는 권면의 힘을 살렸습니다.
- source_word: בְּנִסְתָּרוֹת
  english_pob_choice: hidden things
  chosen_korean: 숨은 일들
  alternatives_korean:
  - 비밀스러운 일들
  - 감추어진 일들
  - 신비한 것들
  lexicon: HALOT
  rationale: ‘숨은 것들’은 인간의 접근 밖에 있는 비가시적 사안을 가리키므로, 과도한 신학적 함의를 덜기 위해 ‘숨은 일들’로 옮겼습니다.
theological_decisions:
- issue: 히브리어 ‘허락/승인’ 가능성과 그리스어 ‘명령’의 병존
  chosen_reading: 주된 권면을 ‘명령받은 바’로 두되, 히브리어의 잠재적 허가/승인 뉘앙스는 번역 본문보다 주석적 판단에 남깁니다.
  alternative_readings:
  - 부여받은 바를 생각하십시오
  - 허락받은 바를 생각하십시오
  rationale: 이 절은 본문 자체가 지혜문학적 경계선 설정을 하고 있으며, 병행 그리스어가 ‘명령’으로 분명히 읽히므로 독자에게 책임 범위를 분명히 전달하는 쪽이 더 충실합니다.
  doctrine_reference: '서신/지혜문학의 병행 전승 처리 원칙: 보존 가능한 본문 간 긴장을 숨기지 않고, 더 분명한 평행어의 의미를 본문에 반영하되 대안은 기록한다.'
