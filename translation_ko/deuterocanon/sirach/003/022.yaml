  source_fidelity: 본문의 ‘명령받은 바’는 그리스어 평행본문(προσετάγη σοι, ‘명령되었다’)을 반영하며, 히브리어 הוּרְשֵׁיתָ의 ‘허락받다/승인받다’ 가능성은 각주로 보존되어 있습니다. ‘숨은 일들’과 ‘관여하지 마십시오’도 히브리어의 숨겨진 사안 및 그 사안이 독자의 영역이 아니라는 뜻을 충실히 전달합니다.
