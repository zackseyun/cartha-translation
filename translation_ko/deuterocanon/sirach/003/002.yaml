base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/003/002.yaml
  text: For Yahweh honored the father above the children[b][a], and he established the mother's authority over her children.
  footnotes:
  - marker: a
    text: Or 'confirmed the mother's right over her children.' Hebrew mishpat can mean 'judgment,' 'justice,' or a legal 'right/claim'; here it likely refers to the mother's rightful authority within the family.
    reason: lexical_alternative
  - marker: b
    text: The Greek parallel reads 'sons' in the second line, while the extant Hebrew has 'her children.' The translation follows the Hebrew as the primary witness here.
    reason: textual_variant
translation:
  language: ko
  text: 야훼께서는 아버지를 자녀들 앞에서 높이셨고, 어머니의 권리를 그녀의 자녀들 위에 확립하셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘어머니의 자녀들에 대한 권리를 확립하셨습니다.’ 히브리어 mishpat는 ‘판결’, ‘정의’, ‘법적 권리/주장’을 뜻할 수 있으며, 여기서는 가족 안에서 어머니의 정당한 권위를 가리키는 것으로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהֹוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 주
  lexicon: HALOT
  rationale: 이 프로젝트 기본값에 따라 신명은 학문적 음역인 야훼로 옮겨, 히브리어 מקור을 직접 반영했습니다.
- source_word: כִּבֵּד
  english_pob_choice: honored
  chosen_korean: 높이셨고
  alternatives_korean:
  - 존귀하게 하셨고
  - 영광스럽게 하셨고
  - 공경하셨고
  lexicon: HALOT
  rationale: כבד의 기본 의미인 ‘무겁게 하다/존중하다’를 한국어 동사 ‘높이다’로 옮기면 위상과 존중의 뉘앙스를 함께 살릴 수 있습니다.
- source_word: מִשְׁפַּט
  english_pob_choice: authority / right
  chosen_korean: 권리
  alternatives_korean:
  - 권한
  - 정당한 권리
  - 판결
  lexicon: HALOT
  rationale: 문맥상 משפט은 사법적 ‘판결’보다 가족 내에서 어머니에게 부여된 정당한 권리·주장을 가리키므로, 한국어에서는 ‘권리’가 가장 직접적입니다.
- source_word: עַל יְלָדֶיהָ
  english_pob_choice: over her children
  chosen_korean: 그녀의 자녀들 위에
  alternatives_korean:
  - 그녀의 자녀들에 대하여
  - 그녀의 자녀들에 대한
  - 그녀의 자녀들 위로
  lexicon: HALOT
  rationale: עַל의 지배·관할 뉘앙스를 살려 ‘~위에’로 옮겼고, 소유 접미사는 ‘그녀의 자녀들’로 반영했습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행본문의 자녀/아들 차이
  chosen_reading: ‘자녀들’로 옮겨 히브리어의 ‘그녀의 자녀들’을 따릅니다.
  alternative_readings:
  - ‘아들들’
  - ‘아들들/자녀들’ 이중 표기
  rationale: 이 절의 주 본문은 현존 히브리어이며, 그리스어는 'sons'를 보이지만 본문 증거가 더 직접적인 히브리어를 따르는 것이 POB 원칙에 부합합니다.
  doctrine_reference: textual-criticism principle in project translation policy
- issue: ‘מִשְׁפַּט הָאֵם’의 사회-법적 힘
  chosen_reading: ‘어머니의 권리’
  alternative_readings:
  - ‘어머니의 권한’
  - ‘어머니의 판결’
  - ‘어머니의 정당한 주장’
  rationale: 본문은 부모 공경의 일반 윤리를 넘어 어머니에게도 하나님이 հաստատ하신 정당한 지위가 있음을 말하므로, ‘권리’가 가장 압축적이면서도 법적 함의를 보존합니다.
  doctrine_reference: 'DOCTRINE.md §Translation philosophy #4'
