revisions:
- from: 야훼께서는 아버지를 자녀들 앞에서 높이셨고, 어머니의 권리를 그녀의 자녀들 위에 확립하셨습니다.[a]
  to: 야훼께서는 자녀들보다 아버지를 높이셨고, 어머니가 자녀들에 대해 지닌 권위를 굳게 세우셨습니다.[a][b]
  rationale: 첫 행은 히브리어 לִפְנֵי와 그리스어 ἐπὶ가 함께 시사하는 아버지의 관계적 우선성을 ‘자녀들보다’로 옮겼습니다. 둘째 행은 ‘권리를 자녀들 위에’라는 직역투를 피하면서도 משפט의 사회·법적 힘과 על의 관계적 용법을 보존하도록 다듬었습니다. 병행 그리스어의 ‘아들들’ 읽기도 각주로 명시했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T19:09:56Z'
review_pass:
  verdict: revise
  source_fidelity: 히브리어 כִּבֵּד와 לִפְנֵי הַבָּנִים의 관계적 우선성은 ‘자녀들보다 아버지를 높이셨고’로 자연스럽게 반영할 수 있습니다. מִשְׁפַּט הָאֵם은 단순한 개인적 ‘권리’보다 어머니가 자녀에 대해 지닌 정당한 권위·권리의 범위를 가리키므로, 본문에서는 ‘권위’가 더 자연스럽고 적절합니다. עַל יְלָדֶיהָ의 소유와 관계도 ‘어머니가 자녀들에 대해 지닌’으로 보존했습니다.
  naturalness: ‘그녀의 자녀들 위에 확립하셨습니다’는 한국어에서 불필요한 대명사와 부자연스러운 공간적 표현을 사용합니다. ‘어머니가 자녀들에 대해 지닌 권위를 굳게 세우셨습니다’가 현대 표준 한국어의 격식 있는 합쇼체에 맞고 의미도 분명합니다.
  terminology: 신명 ‘야훼’는 초안의 프로젝트 선택을 유지했습니다. משפט은 본문에서 ‘권위’로, 가능한 법적 의미인 ‘권리’는 각주에서 제시했습니다. 그리스어 병행 본문의 ‘아들들’과 히브리어의 ‘그녀의 자녀들’ 차이를 별도 본문비평 각주로 보완했습니다.
  issues:
