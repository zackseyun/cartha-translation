    rationale: על은 여기서 어머니의 자녀에 대한 권위의 범위를 나타냅니다. 한국어에서는 ‘자녀들에 대해 지닌 권위’를 굳게 세운다고 표현하는 것이 자연스럽고 정확합니다.
  - severity: low
    issue: 그리스어 병행 본문의 ‘아들들’이라는 이문 정보가 한국어 각주에 반영되어 있지 않습니다.
    rationale: 주 본문은 히브리어 ‘그녀의 자녀들’을 따르되, 영어 POB 감사 기록에 있는 병행 본문상의 차이는 독자가 확인할 수 있도록 각주로 제시하는 것이 좋습니다.
