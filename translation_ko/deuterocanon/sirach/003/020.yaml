base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/003/020.yaml
  text: For the mercies of God are many[b][a], and to the humble he reveals his secret.
  footnotes:
  - marker: a
    text: 'Greek parallel: ''For great is the dominion of the Lord, and he is glorified by the humble.'' The Hebrew witness here differs substantially from the Greek.'
    reason: alternative_reading
  - marker: b
    text: Or 'his counsel.' The Hebrew word can mean a secret shared in intimate confidence, not only hidden information.
    reason: lexical_alternative
translation:
  language: ko
  text: 하나님의 자비는 매우 많고, 겸손한 이들에게는 그의 비밀을 드러내십니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '그리스어 평행본문: ‘주의 권세는 크고, 겸손한 이들에게서 영광을 받으십니다.’ 히브리어 증거는 이와 상당히 다릅니다.'
    reason: alternative_reading
  - marker: b
    text: 또는 ‘그의 뜻깊은 비밀’이라는 뉘앙스로도 볼 수 있습니다. 히브리어 סוד는 단순한 숨은 정보보다 친밀한 신적 비밀이나 내밀한 뜻을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַבִּים רַחֲמֵי אֱלֹהִים
  english_pob_choice: the mercies of God are many
  chosen_korean: 하나님의 자비는 매우 많고
  alternatives_korean:
  - 하나님의 긍휼은 많고
  - 하나님의 자비가 풍성하고
  lexicon: HALOT
  rationale: 히브리어의 복수형 רַחֲמֵי는 단순한 추상명사보다 반복적·충만한 자비의 뉘앙스를 띠므로, 한국어에서는 자연스럽게 ‘자비는 매우 많고’로 옮겨 수량성과 풍성함을 살렸습니다.
- source_word: וְלַעֲנָוִים
  english_pob_choice: to the humble
  chosen_korean: 겸손한 이들에게는
  alternatives_korean:
  - 겸비한 이들에게는
  - 온유한 이들에게는
  lexicon: HALOT
  rationale: 지혜문학의 ענוים는 도덕적 태도와 사회적 자세를 함께 포함하므로, 현대 한국어에서 가장 직관적인 ‘겸손한 이들’을 택했습니다.
- source_word: יְגַלֶּה סוֹדוֹ
  english_pob_choice: he reveals his secret
  chosen_korean: 그의 비밀을 드러내십니다
  alternatives_korean:
  - 그의 비밀을 밝히십니다
  - 그의 친밀한 뜻을 알려 주십니다
  lexicon: HALOT
  rationale: סוד는 ‘비밀’과 ‘친밀한 신적 의논/내밀한 뜻’을 모두 가질 수 있으므로, 본문에서는 직접적인 ‘비밀’을 두고 그 함의를 과도하게 풀지 않았습니다.
- source_word: אֱלֹהִים
  english_pob_choice: God
  chosen_korean: 하나님
  alternatives_korean:
  - 하느님
  lexicon: Korean biblical convention
  rationale: 본문의 אֱלֹהִים은 일반 명칭으로, 프로젝트 기본값에 따라 ‘하나님’을 사용했습니다.
theological_decisions:
- issue: 그리스어 평행본문과 히브리어 본문의 차이
  chosen_reading: 주본문은 히브리어를 따라 ‘하나님의 자비는 매우 많고, 겸손한 이들에게는 그의 비밀을 드러내십니다’로 옮기고, 그리스어의 다른 전승은 각주로 보존합니다.
  alternative_readings:
  - ‘주의 권세는 크고, 겸손한 이들에게서 영광을 받으십니다’(그리스어 평행본문)
  rationale: 집회서에서는 히브리어 증거가 살아 있는 경우 그 본문을 우선하되, 그리스어 전승의 실질적 차이는 삭제하지 않고 독자가 확인할 수 있도록 남겨야 합니다.
  doctrine_reference: 'PHILOSOPHY.md: Hebrew priority where extant; DOCTRINE.md: preserve textual/theological tension.'
