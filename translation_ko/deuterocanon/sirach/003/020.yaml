  terminology: ‘자비’, ‘겸손한 이들’, ‘비밀’은 적절합니다. סוֹדוֹ의 각주 대안은 ‘뜻깊은 비밀’보다 ‘의논’ 또는 ‘은밀한 뜻’이 원어의 친밀한 의논·기밀이라는 의미 범위를 더 정확히 반영합니다. 그리스어 평행본문의 ‘영광을 받으십니다’는 능동적으로 풀어 ‘영광을 돌립니다’로 제시하는 것이 자연스럽습니다.
