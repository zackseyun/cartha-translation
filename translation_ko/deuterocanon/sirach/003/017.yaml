  text: My son[a], in your prosperity walk in humility, and you will be loved more than one who gives gifts.
  footnotes:
  - marker: a
    text: 'Greek parallel: ''Child, conduct your works in meekness, and you will be loved by an acceptable person.'' The Hebrew witness instead reads, ''My son, in your prosperity walk in humility, and you will be loved more than a giver of gifts.'''
    reason: alternative_reading
translation:
  language: ko
  text: 내 아들아, 네가 부유할 때에도 겸손하게 처신하십시오. 그러면 선물을 주는 사람보다 더 사랑받을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 평행본문은 ‘자녀야, 온유하게 네 일을 행하십시오. 그러면 인정받는 사람에게 사랑받을 것입니다’로 읽습니다. 히브리어 증거는 ‘내 아들아, 네가 부유할 때에도 겸손하게 처신하십시오. 그러면 선물을 주는 사람보다 더 사랑받을 것입니다’로 읽습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּנִי
  english_pob_choice: My son
  chosen_korean: 내 아들아
  alternatives_korean:
  - 내 자녀야
  - 내 아들
  lexicon: HALOT
  rationale: 히브리어의 직접 호칭인 בְּנִי를 반영하여 친밀한 권면의 어조를 살렸습니다. 본문이 남성 단수 호칭이므로 ‘내 아들아’가 가장 자연스럽고 원문에 가깝습니다.
- source_word: בְּעָשְׁרְךָ
  english_pob_choice: in your prosperity
  chosen_korean: 네 부유함 가운데
  alternatives_korean:
  - 네 재물 가운데
  - 네 번영 가운데
  - 네 부요함 가운데
  lexicon: HALOT
  rationale: עֹשֶׁר의 핵심 의미는 ‘부유함/재물’이므로, 영어의 ‘prosperity’보다 원문에 더 밀착해 ‘부유함 가운데’로 옮겼습니다.
- source_word: הִתְהַלֵּךְ בַּעֲנָוָה
  english_pob_choice: walk in humility
  chosen_korean: 겸손히 행하여라
  alternatives_korean:
  - 겸손히 걸어라
  - 겸손 가운데 행하여라
  - 겸손히 살아가라
  lexicon: HALOT
  rationale: 히트파엘 형태의 관용적 윤리 표현을 한국어 자연어로 풀어 ‘행하다’로 옮겼습니다. ‘walk’의 비유를 완전히 없애기보다 삶의 태도를 드러내는 동사로 처리했습니다.
- source_word: וְתֵאָהֵב מִנּוֹתֵן מַתָּנוֹת
  english_pob_choice: and you will be loved more than one who gives gifts
  chosen_korean: 그러면 너는 선물들을 주는 사람보다 더 사랑받을 것이다
  alternatives_korean:
  - 그러면 너는 선물을 베푸는 사람보다 더 사랑받을 것이다
  - 그러면 너는 선물을 주는 사람보다 더 사랑받을 것이다
  - 그러면 너는 선물 주는 이보다 더 사랑받을 것이다
  lexicon: HALOT
  rationale: 비교 구문 מן + נותן מַתָּנוֹת의 의미를 살려, 단순히 ‘선물하는 사람’이 아니라 지속적 행위자를 드러내는 표현으로 옮겼습니다. 영어 POB의 ‘more than one who gives gifts’를 반영하되 한국어에서는 자연스럽게 복수형 ‘선물들을’로 처리했습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 평행본문의 차이
  chosen_reading: 본문은 히브리어를 따라 ‘부유함 가운데 겸손히 행하라’와 ‘선물들을 주는 사람보다 더 사랑받을 것이다’로 옮겼습니다.
  alternative_readings:
  - 그리스어 평행본문에 따른 ‘온유함 가운데 네 일들을 진행하라, 그러면 호의받는 사람보다 사랑받을 것이다’
  rationale: 집회서에서는 현존하는 히브리어 증거를 मुख्य 본문으로 삼고 그리스어는 대조 자료로 다룹니다. 여기서는 두 전승이 의미상 크게 달라서, 본문에는 히브리어를 따르고 차이는 보존하는 편이 더 투명합니다.
  doctrine_reference: 'PHILOSOPHY.md: 히브리어가 존속할 때 이를 우선 번역하고, 전승 차이를 숨기지 않는다.'
