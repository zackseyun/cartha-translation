  source_fidelity: 그리스어의 강한 비교(‘주인들처럼’)와 미래형 ‘섬길 것입니다’는 대체로 충실합니다. 다만 ἐν τοῖς γεννήσασιν αὐτόν은 ‘그를 낳은 이들에게’라는 뜻인데, 한국어 ‘자신을 낳은’은 선행사 ‘그’와의 관계가 문법적으로 다소 불분명합니다.
  naturalness: ‘그리고’는 문맥 없이 절을 시작할 때 다소 어색하므로 ‘그는’으로 시작하는 편이 자연스럽습니다. ‘자신을 낳은 이들’은 재귀 표현 때문에 현대 한국어에서 모호하게 읽힐 수 있습니다.
  terminology: ‘주인들’은 δεσπόταις의 강한 권위 비유를 적절히 보존합니다. 대안 ‘주들처럼’은 현대 표준 한국어에서 자연스럽지 않고, 원어의 ‘주인’ 의미보다 신적·정치적 연상을 불필요하게 일으킬 수 있으므로 각주 대안으로 적절하지 않습니다.
