translation:
  language: ko
  text: 그리고 그는 자신을 낳은 이들에게 주인들처럼 섬길 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주들처럼’입니다. 이 그리스어는 완전한 권위를 행사하는 사람을 가리키며, 여기서는 부모를 공경해야 한다는 강한 비유로 사용됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: δεσπόταις
  english_pob_choice: masters
  chosen_korean: 주인들
  alternatives_korean:
  - 주들
  - 군주들
  - 상전들
  lexicon: BDAG
  rationale: δεσπότης는 권위와 소유권을 함께 떠올리게 하는 강한 표현이므로, 부모에 대한 강한 비유를 살리기 위해 ‘주인들’로 옮겼습니다.
- source_word: δουλεύσει
  english_pob_choice: will serve
  chosen_korean: 섬길 것입니다
  alternatives_korean:
  - 노예처럼 섬길 것입니다
  - 봉사할 것입니다
  - 시중들 것입니다
  lexicon: BDAG
  rationale: 미래형 δουλεύω의 핵심은 종속된 상태에서의 섬김이지만, 한국어에서는 문맥상 과도하게 노예화하지 않으면서도 복종의 강도를 유지하는 ‘섬기다’가 가장 자연스럽습니다.
- source_word: ἐν τοῖς γεννήσασιν αὐτόν
  english_pob_choice: those who begot him
  chosen_korean: 자신을 낳은 이들에게
  alternatives_korean:
  - 그를 낳은 부모에게
  - 그를 낳아 준 이들에게
  - 그의 부모에게
  lexicon: BDAG
  rationale: γεννήσασιν은 문자적으로 ‘낳은/출생시킨’ 이들이므로, 해석어인 ‘부모’보다 출생의 직접성을 살린 표현을 택했습니다.
theological_decisions:
- issue: 부모 공경을 강한 종속 비유로 표현하는 문제
  chosen_reading: ‘주인들처럼 섬길 것입니다’라는 강한 비교를 유지해, 단순한 예절이나 존중으로 약화시키지 않았습니다.
  alternative_readings:
  - 예의 바르게 대할 것입니다
  - 정중히 섬길 것입니다
  - 부모를 공경할 것입니다
  rationale: 본문은 δεσπόταις와 δουλεύσει를 사용해 의도적으로 강한 복종의 이미지를 만들고 있으므로, 그 긴장을 보존하는 번역이 필요합니다.
  doctrine_reference: 'DOCTRINE.md: 원어 우선과 원문의 수사적 강도 보존 원칙'
