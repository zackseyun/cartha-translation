base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/003/013.yaml
  text: Even if a man lacks understanding[a], be patient with him[b], and do not shame him all the days of his life.
  footnotes:
  - marker: a
    text: 'Greek: ''and do not dishonor him in all your strength.'' The Hebrew reads ''all the days of his life.'' The main text follows the Hebrew primary witness for this verse; the Greek likely reflects a different Vorlage or interpretive rendering.'
    reason: textual_variant
  - marker: b
    text: Or 'make allowance for him' / 'forbear with him.' The Hebrew expression is clarified by the Greek parallel as a call to patient forbearance.
    reason: lexical_alternative
translation:
  language: ko
  text: 비록 어떤 사람이 이해가 부족하더라도, 그에게서 참아 주십시오[a]. 그리고 그가 살아 있는 모든 날 동안 그를 부끄럽게 하지 마십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 ‘그를 당신의 온 힘으로 욕되게 하지 말라’고 읽습니다. 주 본문은 이 절에서 ‘그가 살아 있는 모든 날 동안’이라고 하는 히브리어를 따랐으며, 그리스어는 다른 바탕본문이나 해석적 옮김을 반영한 것으로 보입니다.
    reason: textual_variant
lexical_decisions:
- source_word: וְגַם / κἂν
  english_pob_choice: Even if
  chosen_korean: 비록 …더라도
  alternatives_korean:
  - 그리고 또한
  - 또한
  lexicon: HALOT
  rationale: 히브리어 וְגַם과 그리스어 κἂν은 단순한 추가가 아니라 양보적 조건을 나타내므로, 한국어에서는 ‘비록 …더라도’로 자연스럽게 옮겼습니다.
- source_word: יֶחְסַר מַדָּעוֹ / σύνεσιν
  english_pob_choice: lacks understanding
  chosen_korean: 이해가 부족하더라도
  alternatives_korean:
  - 분별이 부족하더라도
  - 지혜가 모자라더라도
  - 지식이 부족하더라도
  lexicon: HALOT
  rationale: 본문의 핵심은 지식의 결핍보다 분별과 이해의 부족에 있으며, 그리스어 σύνεσις도 이를 뒷받침하므로 ‘이해가 부족하다’로 옮겼습니다.
- source_word: עֲזָב לוֹ / συγγνώμην ἔχε
  english_pob_choice: be patient with him
  chosen_korean: 그에게서 참아 주십시오
  alternatives_korean:
  - 그를 너그러이 봐 주십시오
  - 그에게서 너그럽게 대하십시오
  - 그를 참고 견디십시오
  lexicon: HALOT
  rationale: 히브리어 동사만 보면 ‘내버려 두다/놓아 주다’의 뉘앙스가 있으나, 그리스어 συγγνώμην ἔχε가 ‘용서하며 참다, 관대히 대하다’의 뜻을 분명히 하므로 한국어에서는 관계적 의미가 드러나는 ‘참아 주십시오’로 번역했습니다.
- source_word: וְאַל תַּכְלִים / μὴ ἀτιμάσῃς
  english_pob_choice: do not shame him
  chosen_korean: 그를 부끄럽게 하지 마십시오
  alternatives_korean:
  - 그를 수치스럽게 하지 마십시오
  - 그를 욕되게 하지 마십시오
  - 그를 모욕하지 마십시오
  lexicon: HALOT
  rationale: 히브리어와 그리스어 모두 상대를 공적으로 수치스럽게 하거나 명예를 훼손하는 뜻을 가지므로, 현대 한국어에서 직접적이고 자연스러운 ‘부끄럽게 하다’로 옮겼습니다.
- source_word: כָּל יְמֵי חַיָיו
  english_pob_choice: all the days of his life
  chosen_korean: 그가 살아 있는 모든 날 동안
  alternatives_korean:
  - 그의 삶의 모든 날 동안
  - 그가 사는 동안 내내
  - 평생
  lexicon: HALOT
  rationale: 히브리어 직역인 ‘그의 삶의 모든 날’은 한국어에서 어색하므로, 의미를 그대로 유지하면서 자연스럽게 ‘그가 살아 있는 모든 날 동안’으로 다듬었습니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행문의 차이
  chosen_reading: 주 본문은 히브리어의 ‘그가 살아 있는 모든 날 동안’을 따르고, 그리스어의 ‘모든 힘으로 그를 불명예스럽게 하지 말라’는 읽기는 본문 각주로 처리하지 않았습니다.
  alternative_readings:
  - 그를 당신의 온 힘으로 욕되게 하지 마십시오
  - 그를 결코 모욕하지 마십시오
  rationale: 이 절은 히브리어가 생애 전기간을, 그리스어가 태도 강도를 강조하는 서로 다른 전승을 보이므로, 본문은 히브리어를 따르되 의미 충돌을 만들지 않도록 평이한 문장으로 유지했습니다.
  doctrine_reference: 본문비평 / 지혜문학 전승
