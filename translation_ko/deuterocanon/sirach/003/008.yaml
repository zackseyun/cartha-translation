translation:
  language: ko
  text: 내 아들아, 말과 행실로 네 아버지를 공경하여라. 그러면 모든 복이 네게 미칠 것이다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 병행본은 ‘그에게서’(παρ᾽ αὐτοῦ)라고 하여, 복의 출처를 아버지에게 더 분명히 연결합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּנִי
  english_pob_choice: My son
  chosen_korean: 내 아들아
  alternatives_korean:
  - 내 자녀야
  - 내 아이야
  lexicon: HALOT
  rationale: 직접 호칭인 남성 단수 ‘My son’을 살려, 지혜문학의 권면 어조를 자연스러운 한국어 호격으로 옮겼습니다.
- source_word: בְּמַאֲמָר וּבְמַעֲשֶׂה
  english_pob_choice: in word and deed
  chosen_korean: 말과 행실로
  alternatives_korean:
  - 말과 행동으로
  - 말과 일로
  lexicon: HALOT
  rationale: מאמר/מעשה의 병렬을 한국어의 익숙한 윤리적 대구 ‘말과 행실’로 옮겨, 말과 행동의 일치를 분명히 했습니다.
- source_word: כַּבֵּד
  english_pob_choice: honor
  chosen_korean: 공경하여라
  alternatives_korean:
  - 존중하여라
  - 영예롭게 하여라
  lexicon: HALOT
  rationale: 부모에게 ‘무게를 두어 대하다’는 뜻을 살리면서, 효 윤리 문맥에서 가장 직접적인 ‘공경’으로 옮겼습니다.
- source_word: כֹּל בְּרָכוֹת
  english_pob_choice: all blessings
  chosen_korean: 모든 복
  alternatives_korean:
  - 온갖 복
  - 모든 축복
  lexicon: HALOT
  rationale: 복수형 ‘모든 복들’을 한국어에서는 집합적으로 ‘모든 복’으로 자연스럽게 표현했습니다.
theological_decisions:
- issue: 복의 출처를 본문에서 어떻게 처리할지
  chosen_reading: 히브리어 본문을 따라 복의 출처를 명시하지 않고, 공경의 결과로 ‘모든 복이 네게 미칠 것이다’라고 번역했습니다.
  alternative_readings:
  - 네 아버지에게서 오는 복
  - 하나님께서 주시는 복
  rationale: 히브리어는 출처를 분명히 밝히지 않으므로, 본문이 허용하는 범위를 보존했습니다. 그리스어 병행본의 ‘그에게서’ 뉘앙스는 주석 없이 본문에 끼워 넣지 않았습니다.
  doctrine_reference: 원문 우선 원칙; 이차 전승의 의미는 본문 밖에서 추적
