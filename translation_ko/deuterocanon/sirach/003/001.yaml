  text: Listen[a], children, to a father's instruction, and do so that you may live.
  footnotes:
  - marker: a
    text: 'Greek: ''Listen to me, your father ... so that you may be saved.'' The Hebrew witness reads more generically, ''to a father''s instruction ... so that you may live.'''
