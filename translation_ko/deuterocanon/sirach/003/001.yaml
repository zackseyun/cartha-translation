translation:
  language: ko
  text: 자녀들아, 아버지의 가르침을 들으십시오. 여러분이 살도록 그것을 행하십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '그리스어: ‘자녀들아, 너희 아버지인 내 말을 들어라. 그렇게 행하여 너희가 구원받도록 하라.’ 히브리어 증인은 더 일반적으로 ‘아버지의 가르침 … 너희가 살도록’이라고 읽습니다.'
    reason: alternative_reading
lexical_decisions:
- source_word: שִׁמְעוּ
  english_pob_choice: Listen
  chosen_korean: 들으십시오
  alternatives_korean:
  - 들으라
  - 귀를 기울이십시오
  - 들으세요
  lexicon: HALOT
  rationale: 청중을 향한 복수 명령으로서, 현대 합쇼체에서 가장 자연스럽게 ‘주의 깊게 듣다’의 뉘앙스를 살립니다.
- source_word: בָנִים
  english_pob_choice: children
  chosen_korean: 자녀들아
  alternatives_korean:
  - 자식들아
  - 아들들아
  - 아이들아
  lexicon: HALOT
  rationale: 형식상 남성 복수이지만 지혜문학의 대표적 호칭이므로, 성별을 과도하게 좁히지 않는 ‘자녀들아’가 적절합니다.
- source_word: מִשְׁפַט אָב
  english_pob_choice: a father's instruction
  chosen_korean: 아버지의 가르침
  alternatives_korean:
  - 아버지의 훈계
  - 아버지의 명령
  - 아버지의 규례
  lexicon: HALOT
  rationale: מִשְׁפַט은 이 문맥에서 법정적 ‘판결’이 아니라 권위 있는 지시/훈계를 가리키므로, 한국어로는 지혜문학적 자연성을 살려 ‘가르침’으로 옮겼습니다.
- source_word: וַעֲשׂוּ
  english_pob_choice: do / act accordingly
  chosen_korean: 그렇게 하여
  alternatives_korean:
  - 행하십시오
  - 실행하십시오
  - 그대로 행하십시오
  lexicon: HALOT
  rationale: 히브리어의 פשוט한 ‘하고, 실행하다’는 뜻을 반영하되, 앞의 ‘들으십시오’와 목적절을 매끄럽게 잇는 표현으로 처리했습니다.
- source_word: תִּחְיוּ
  english_pob_choice: you may live
  chosen_korean: 살 것입니다
  alternatives_korean:
  - 생명을 얻게 될 것입니다
  - 살게 될 것입니다
  - 생존할 것입니다
  lexicon: HALOT
  rationale: 히브리어는 구체적으로 ‘살다’(חיה)를 말하므로, Greek의 ‘구원받다’보다 본문을 따라 생명 유지의 의미를 직접적으로 반영합니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행본문의 종결어휘 차이
  chosen_reading: 주본문은 히브리어의 ‘살 것입니다’를 따르고, 그리스어의 ‘구원받게 되다’는 본문에는 들이지 않았습니다.
  alternative_readings:
  - ‘구원받을 것입니다’
  - ‘살게 될 것입니다’
  rationale: 이 책은 사역 가능한 히브리어 본문이 보존된 경우 이를 우선하므로, 의미상 중요한 변이를 주석으로 남기되 본문은 히브리어를 따릅니다.
  doctrine_reference: 'PHILOSOPHY.md: Hebrew primacy where extant; DOCTRINE.md: preserve textual tension rather than flatten it.'
