    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπορεύοντο
  english_pob_choice: they were going
  chosen_korean: 지나가고 있었는데
  alternatives_korean:
  - 가고 있었는데
  - 진행하고 있었는데
  lexicon: LSJ
  rationale: 미완료 과거의 진행성을 살리면서 한국어 서술문에 자연스럽게 맞추기 위해 ‘-고 있었는데’로 옮겼습니다.
- source_word: ἐν τῷ αὐλῶνι
  english_pob_choice: through the courtyard
  chosen_korean: 안뜰을
  alternatives_korean:
  - 뜰 안을
  - 마당을 지나
  lexicon: LSJ
  rationale: ἐν과 이동 동사가 함께 쓰여 공간 안을 통과하는 흐름이므로, 한국어에서는 ‘안뜰을’로 잡아 이동감을 살렸습니다.
- source_word: εἰς εὐθεῖαν
  english_pob_choice: straight ahead
  chosen_korean: 곧장
  alternatives_korean:
  - 똑바로
  - 직선으로
  lexicon: LSJ
  rationale: ‘일직선으로, 곧바로’라는 부사적 의미를 간결하게 살리기 위해 ‘곧장’을 선택했습니다.
- source_word: προφυλακὴ τῶν Ἀσσυρίων
  english_pob_choice: an Assyrian advance guard
  chosen_korean: 아시리아의 전위대
  alternatives_korean:
  - 아시리아 군의 선발대
  - 아시리아의 경계대
  lexicon: LSJ
  rationale: προφυλακή는 앞서 배치된 경비·선봉 부대를 뜻하므로, 문맥상 고정된 장소보다 부대를 가리키는 ‘전위대’가 가장 직접적입니다.
theological_decisions:
- issue: 주어가 복수(그들)에서 단수 목적어(그녀)로 좁혀지는 서술 초점
  chosen_reading: ‘그들은’으로 이동을 말하되, ‘그녀를 만났습니다’로 전환하여 이야기의 초점이 유딧에게 모이는 구조를 보존했습니다.
  alternative_readings:
  - 전위대가 그들을 만났습니다
  - 전위대가 그들 앞에 나타났습니다
  rationale: 그리스어는 앞절의 복수 동작과 달리 목적어를 단수 αὐτῇ로 바꾸어 유딧 개인에게 서술 시선을 좁힙니다. 한국어에서도 이 초점을 유지하는 것이 본문 구조에 충실합니다.
  doctrine_reference: 서사 초점 보존
