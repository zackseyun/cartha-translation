  text: And she gave her maid a skin of wine and a flask of oil[a], and she filled a bag with barley meal and cakes of pressed figs and clean loaves; then she wrapped up all her vessels and placed them on her.
  footnotes:
  - marker: a
    text: Or 'ritually clean loaves' or 'pure bread.' The Greek may imply food prepared in keeping with purity concerns.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그녀는 하녀에게 포도주 한 가죽부대와 기름 한 병[a]을 주었으며, 보리 가루와 눌러 만든 무화과 떡과 깨끗한 빵을 담은 자루를 채웠습니다. 그런 다음 그녀의 모든 그릇을 싸서 그녀에게 얹었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘정결한 빵’ 또는 ‘순수한 빵’으로 옮길 수 있습니다. 그리스어는 정결 규범에 맞게 준비된 음식을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἅβρᾳ
  english_pob_choice: maid
  chosen_korean: 하녀
  alternatives_korean:
  - 여종
  - 시녀
  - 여자 종
  lexicon: LSJ
  rationale: 주어진 관계가 Judith의 여성 수행원을 가리키므로, 현대 한국어에서 자연스럽고 인물 관계를 과도하게 강조하지 않는 ‘하녀’로 옮겼습니다.
- source_word: ἀσκοπυτίνην οἶνον
  english_pob_choice: a skin of wine
  chosen_korean: 포도주 한 가죽부대
  alternatives_korean:
  - 포도주 가죽부대 하나
  - 가죽부대에 담은 포도주
  - 포도주 한 물통
  lexicon: LSJ
  rationale: 복합어가 가죽 재질의 용기를 뜻하므로, 내용물과 용기를 함께 드러내는 ‘포도주 한 가죽부대’가 가장 직접적입니다.
- source_word: ἀλφίτων
  english_pob_choice: barley meal
  chosen_korean: 보리 가루
  alternatives_korean:
  - 보릿가루
  - 보리 가루(볶은 곡식 가루)
  - 보리쌀가루
  lexicon: LSJ
  rationale: POB의 최신 정정에 따라 ἀλφίτων을 meal 계열로 보고, 한국어에서는 조리된 곡물 가루를 자연스럽게 가리키는 ‘보리 가루’로 옮겼습니다.
- source_word: ἄρτων καθαρῶν
  english_pob_choice: clean loaves
  chosen_korean: 깨끗한 빵
  alternatives_korean:
  - 정결한 빵
  - 깨끗한 빵들
  - 순수한 빵
  lexicon: LSJ
  rationale: καθαρῶν은 단순한 물리적 청결보다 식용·예식적 적합성을 시사할 수 있으나, 본문은 그 뉘앙스를 과도하게 특정하지 않으므로 기본 의미를 살린 ‘깨끗한 빵’으로 두었습니다.
- source_word: τὰ ἄγγη αὐτῆς
  english_pob_choice: her vessels
  chosen_korean: 그녀의 모든 그릇
  alternatives_korean:
  - 그녀의 용기들
  - 그녀의 그릇들
  - 그녀의 용기
  lexicon: LSJ
  rationale: ἄγγη는 포괄적인 용기/그릇을 뜻하므로, 목록의 물품들을 담는 용도를 살려 ‘그녀의 모든 그릇’으로 번역했습니다.
theological_decisions:
- issue: ἄρτων καθαρῶν의 purity nuance
  chosen_reading: ‘깨끗한 빵’으로 옮겨, 본문이 암시할 수 있는 정결/식용 적합성의 뉘앙스를 열어 둡니다.
  alternative_readings:
  - 정결한 빵
  - 제의적으로 깨끗한 빵
  - 순수한 빵
  rationale: 본문은 준비된 식량에 대한 서술이므로, 더 기술적인 제의 언어로 고정하지 않고 source가 허용하는 범위 안에서 정결성의 가능성을 보존하는 번역이 적절합니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
