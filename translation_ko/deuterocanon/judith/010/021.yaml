    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναπαυόμενος
  english_pob_choice: reclining
  chosen_korean: 누워 쉬고 있었습니다
  alternatives_korean:
  - 기대고 있었습니다
  - 기대어 쉬고 있었습니다
  lexicon: LSJ
  rationale: 이 분사는 침상 위에서 휴식 중인 자세를 가리키므로, 한국어에서는 자연스러운 상태묘사인 ‘누워 쉬고 있었습니다’로 옮겨 자세와 정황을 함께 살렸습니다.
- source_word: κλίνη
  english_pob_choice: bed
  chosen_korean: 침대
  alternatives_korean:
  - 상
  - 긴 의자
  lexicon: LSJ
  rationale: 사적인 침실 장면과 이어지는 휘장 묘사를 고려하면, 여기서는 ‘상’보다 현대어 ‘침대’가 가장 직접적입니다.
- source_word: κωνώπιον
  english_pob_choice: canopy
  chosen_korean: 휘장
  alternatives_korean:
  - 모기장
  - 침대커튼
  lexicon: LSJ
  rationale: 이 단어는 모기장이나 드리운 덮개를 가리킬 수 있으므로, 장식적 천막·덮개라는 폭넓은 의미를 살려 본문에는 ‘휘장’으로 두고 각주에서 대안을 밝혔습니다.
- source_word: καθυφασμένων
  english_pob_choice: woven with
  chosen_korean: 짜인
  alternatives_korean:
  - 엮인
  - 수놓인
  lexicon: LSJ
  rationale: 열거된 재료가 천에 통합되어 있는 상태를 나타내므로, 직조의 결과를 간결하게 드러내는 ‘짜인’이 가장 적절합니다.
