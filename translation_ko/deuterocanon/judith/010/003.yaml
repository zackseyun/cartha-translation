revisions:
- from: 그리고 그녀는 입고 있던 자루옷을 벗어 버리고, 과부의 옷을 벗어 놓았습니다. 몸을 물로 씻고 진한 향유로 자신에게 기름을 바르고, 머리카락을 빗어 정돈한 뒤 머리에 미트라를 얹고, 전처럼 남편 므낫세가 살아 있던 날들에 입던 기쁜 옷을 입었습니다.[a][b]
  to: 그리고 그녀는 입고 있던 자루옷을 벗고, 과부의 옷도 벗었습니다. 몸을 물로 씻고 진한 향유를 몸에 바르고, 머리카락을 정돈한 뒤 머리에 미트라를 쓰고, 남편 므낫세가 살아 있던 날들에 자신을 단장할 때 입던 기쁜 옷을 입었습니다.[a][b]
  rationale: 원문의 의미 범위를 보존하면서 불필요하게 구체적인 ‘빗어’를 ‘정돈한’으로 고쳤습니다. 또한 단순한 탈의 동사는 자연스럽게 ‘벗었습니다’로 옮겼고, 마지막 관계절에 ‘자신을 단장할 때’를 보충하여 ἐστολίζετο의 의미를 반영했습니다. 미트라의 정확한 형태는 확정하지 않고 음역과 각주를 유지했습니다.
  reviewer_model: gpt-5.6-terra
