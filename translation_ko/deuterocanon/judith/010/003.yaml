review_pass:
  verdict: revise
  source_fidelity: 원문의 동작 순서와 애도 복식에서 단장 복식으로의 전환은 대체로 충실합니다. 다만 ‘빗어’는 διέταξε(정돈하였다)를 ‘빗었다’로 지나치게 구체화하며, ‘벗어 놓았습니다’는 단순히 벗었다는 뜻에 불필요한 완료·처치의 뉘앙스를 더합니다. 마지막 관계절도 ‘입던’만으로는 ἐστολίζετο(자신을 단장하였다)의 뜻이 충분히 드러나지 않습니다.
  naturalness: ‘벗어 놓았습니다’보다 ‘벗었습니다’가 자연스럽고, ‘머리카락을 정돈하고’가 현대 표준어로 자연스럽습니다. ‘미트라’는 불확정적인 고대 머리 장식을 음역으로 보존하되 각주로 가능한 의미를 밝혀 두는 방식이 적절합니다.
  terminology: ‘자루옷’, ‘과부의 옷’, ‘향유’, ‘미트라’, ‘므낫세’는 문맥과 관용에 무리가 없습니다. 다만 ‘과부의 옷’은 원문의 ‘과부 됨의 옷들’을 간결하게 옮긴 표현임을 유지하고, ‘기쁜 옷’은 εὐφροσύνης의 기쁨·경축의 성격을 보존합니다.
  issues:
  - severity: medium
    issue: ‘머리카락을 빗어 정돈한’이 원문의 의미를 과도하게 특정합니다.
    rationale: διέταξε는 머리카락을 배열·정돈했다는 뜻이며, 빗질이라는 특정 방법은 본문에 명시되지 않습니다.
  - severity: low
    issue: ‘과부의 옷을 벗어 놓았습니다’의 ‘놓았습니다’가 원문에 없는 뉘앙스를 더합니다.
