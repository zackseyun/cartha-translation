  - severity: medium
    issue: 마지막 관계절에서 ‘자신을 단장하던’ 의미가 약화되어 있습니다.
    rationale: ἐν αἷς ἐστολίζετο는 그 옷들로 자신을 단장하곤 했다는 뜻입니다. 단순히 그 옷을 ‘입던’ 것으로만 옮기면 동사의 장식·단장 의미가 희미해집니다.
  - severity: low
