base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/010/003.yaml
  text: And she took off the sackcloth that she had been wearing[a], and removed the garments of her widowhood. She washed her body with water and anointed herself with rich perfume, arranged the hair of her head, put a headband on it, and put on her festive garments, with which she used to adorn herself during the days of her husband Manasseh’s life[c][b];
  footnotes:
  - marker: a
    text: Or 'anointed herself with rich ointment.' The Greek phrase can denote perfumed ointment, with the adjective suggesting richness or thickness.
    reason: lexical_alternative
  - marker: b
    text: Or 'put on a turban/headdress.' The Greek term refers to a head covering or ornamental band.
    reason: lexical_alternative
  - marker: c
    text: Literally, 'during the days of the life of her husband Manasseh.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그녀는 입고 있던 자루옷을 벗고, 과부의 옷도 벗었습니다. 몸을 물로 씻고 진한 향유를 몸에 바르고, 머리카락을 정돈한 뒤 머리에 미트라를 쓰고, 남편 므낫세가 살아 있던 날들에 자신을 단장할 때 입던 기쁜 옷을 입었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘미트라’는 머리덮개나 장식용 머리띠를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그녀의 남편 므낫세의 생명의 날들에’입니다.
    reason: lexical_alternative
