  rationale: 문맥상 예루살렘 교회 조직이 아니라 베툴리아 성읍의 행정적·사회적 지도층을 가리키므로, 교회 용어로 전이하지 않았습니다.
  doctrine_reference: 구약 외경 문맥의 공동체 지도자 호칭
