translation:
  language: ko
  text: 그들은 성읍 베툴리아의 성문으로 나갔고, 그곳에서 우찌야와 성읍의 장로들인 차브리스와 차르미스를 보았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 헬라어는 ‘그 위에/거기에 서 있는’이라는 뜻으로, 성문을 기준으로 우찌야가 그 자리에서 맞이하고 있음을 나타냅니다.
    reason: lexical_alternative
