base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/010/009.yaml
  text: And she said to them[a], “Order the gate of the city to be opened for me, and I will go out for the fulfillment of the words that you spoke with me.” So they instructed the young men to open it for her, just as she had said.
  footnotes:
  - marker: a
    text: 'Greek: ''just as they spoke.'' The wording is less explicit than the English and may refer either to what Judith had said or to what they had discussed with her.'
    reason: alternative_reading
translation:
  language: ko
  text: 그녀가 그들에게 말했습니다. “성문을 열도록 명령하십시오. 그러면 저는 여러분이 저와 나눈 말들을 이루기 위해 나가겠습니다.” 그래서 그들은 젊은이들에게 그녀를 위해 그 성문을 열도록 지시했습니다. 그들이 말한 대로였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 문자적으로 “그들이 말한 대로”입니다. 이 표현이 앞서 언급된 유딧의 요청을 가리키는지, 또는 그들이 유딧과 나눈 말과 관련되는지는 문맥상 분명하지 않습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐπιτάξατε
  english_pob_choice: Order
  chosen_korean: 명령하십시오
  alternatives_korean:
  - 지시하십시오
  - 명하십시오
  lexicon: BDAG
  rationale: 두 번째 인물들에게 향한 분명한 권위적 요청이므로, 현대 합쇼체에서는 ‘명령하십시오’가 힘을 가장 잘 드러냅니다.
- source_word: ἀνοῖξαί μοι τὴν πύλην τῆς πόλεως
  english_pob_choice: the gate of the city to be opened for me
  chosen_korean: 성문을 열라고
  alternatives_korean:
  - 도시의 문을 열어 달라고
  - 성읍의 문을 열어 달라고
  lexicon: BDAG
  rationale: τῆς πόλεως는 도시 전체의 문이라는 뜻이므로 한국어 성서 문맥에서 자연스러운 ‘성문’을 택했고, 수동 부정사 구조는 간결하게 명령문으로 옮겼습니다.
- source_word: εἰς τελείωσιν τῶν λόγων
  english_pob_choice: for the fulfillment of the words
  chosen_korean: 말들의 성취를 위해
  alternatives_korean:
  - 말들의 완성을 위해
  - 말씀의 성취를 위해
  lexicon: BDAG
  rationale: τελείωσις의 핵심은 ‘완성/성취’이므로 이를 살리되, λόγοι를 지나치게 해석해 ‘계획’으로 바꾸지 않고 ‘말들’로 남겨 원문의 긴장을 보존했습니다.
- source_word: ὧν ἐλαλήσατε μετʼ ἐμοῦ
  english_pob_choice: that you spoke with me
  chosen_korean: 여러분이 저와 함께 말한
  alternatives_korean:
  - 저에게 말한
  - 저와 논의한
  lexicon: BDAG
  rationale: μετʼ ἐμοῦ는 단방향 발화보다 상호 대화를 시사하므로, ‘저와 함께 말한’으로 관계성을 살렸습니다.
- source_word: καθὼς ἐλάλησαν
  english_pob_choice: just as she had said
  chosen_korean: 그녀가 말한 대로
  alternatives_korean:
  - 그들이 말한 대로
  - 그들이 말한 그대로
  lexicon: BDAG
  rationale: 그리스어는 문맥상 Ἰουδίθ의 직전 요청을 가리킬 가능성이 크지만, 원문이 덜 명시적이므로 본문에서는 자연스럽게 처리하고, 더 문자적인 독해는 주석으로 여지를 남깁니다.
theological_decisions:
- issue: 직접화법 속 권위 표현의 강도
  chosen_reading: ‘명령하십시오’로 옮겨, 지도자들에게 요구하는 Judith의 단호함을 드러냈습니다.
  alternative_readings:
  - ‘지시하십시오’로 약화
  - ‘명하시오’로 고전식 표현
  rationale: 이 장면은 협상 종결과 출입 허가를 요구하는 맥락이므로, 권위의 강도를 줄이지 않는 것이 원문 효과에 더 가깝습니다.
  doctrine_reference: 서사 해석 / 인물 발화의 화용론
- issue: καθὼς ἐλάλησαν의 지시 대상
  chosen_reading: 본문은 ‘그녀가 말한 대로’로 처리하고, 원문의 모호성은 그대로 과도하게 단정하지 않았습니다.
  alternative_readings:
  - ‘그들이 말한 대로’
  - ‘그들이 그녀와 말한 대로’
  rationale: 원문은 누구의 말을 가리키는지 덜 분명하므로, 해석을 본문에 주입하지 않고 자연스러운 서술로 옮기는 것이 더 충실합니다.
  doctrine_reference: 본문 비평 / 서사적 모호성 보존
