  lexicon: LSJ
  rationale: ὡς + 부정과거는 시간 절을 이루고, δέ는 약한 전환을 나타내므로 한국어에서는 자연스러운 ‘-았을 때’로 옮기되 문맥의 흐름을 살렸습니다.
- source_word: ἦν ἠλλοιωμένον τὸ πρόσωπον αὐτῆς
  english_pob_choice: her face had been changed
  chosen_korean: 그녀의 얼굴은 달라져 있었고
  alternatives_korean:
  - 그녀의 얼굴은 바뀌어 있었고
  - 그녀의 용모는 달라져 있었고
  lexicon: LSJ
  rationale: ἠλλοιωμένον은 변화/변형을 뜻하므로 ‘달라져 있었고’로 옮겨 얼굴의 외형적 변화를 간결하게 드러냈습니다. ‘용모’는 넓어지므로 εδώ의 τὸ πρόσωπον에 더 가까운 ‘얼굴’을 택했습니다.
- source_word: τὴν στολὴν μεταβεβληκυῖαν
  english_pob_choice: her clothing altered
  chosen_korean: 옷도 바뀌어 있었으며
  alternatives_korean:
  - 의복도 바뀌어 있었으며
