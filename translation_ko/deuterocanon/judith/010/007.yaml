  text: 그들이 그녀를 보았을 때, 그녀의 얼굴은 달라져 있었고 옷도 바뀌어 있었으며, 그들은 그녀의 아름다움에 매우 크게 놀랐습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡς δὲ εἶδον αὐτήν
  english_pob_choice: But when they saw her
  chosen_korean: 그들이 그녀를 보았을 때
  alternatives_korean:
  - 그리고 그들이 그녀를 보았을 때
  - 그런데 그들이 그녀를 보았을 때
  lexicon: LSJ
  rationale: ὡς + 부정과거는 시간 절을 이루고, δέ는 약한 전환을 나타내므로 한국어에서는 자연스러운 ‘-았을 때’로 옮기되 문맥의 흐름을 살렸습니다.
- source_word: ἦν ἠλλοιωμένον τὸ πρόσωπον αὐτῆς
  english_pob_choice: her face had been changed
  chosen_korean: 그녀의 얼굴은 달라져 있었고
  alternatives_korean:
  - 그녀의 얼굴은 바뀌어 있었고
  - 그녀의 용모는 달라져 있었고
  lexicon: LSJ
  rationale: ἠλλοιωμένον은 변화/변형을 뜻하므로 ‘달라져 있었고’로 옮겨 얼굴의 외형적 변화를 간결하게 드러냈습니다. ‘용모’는 넓어지므로 εδώ의 τὸ πρόσωπον에 더 가까운 ‘얼굴’을 택했습니다.
- source_word: τὴν στολὴν μεταβεβληκυῖαν
  english_pob_choice: her clothing altered
  chosen_korean: 옷도 바뀌어 있었으며
  alternatives_korean:
  - 의복도 바뀌어 있었으며
  - 겉옷도 바뀌어 있었으며
  lexicon: LSJ
  rationale: στολή는 옷/의복/차림을 가리킬 수 있으나, 여기서는 변경된 외적 차림을 말하므로 한국어에서는 가장 자연스러운 ‘옷’으로 옮겼습니다. ‘도’는 앞절과 병렬된 변화의 대조를 살립니다.
- source_word: ἐπὶ πολὺ σφόδρα
  english_pob_choice: very greatly
  chosen_korean: 매우 크게
  alternatives_korean:
  - 극도로
  - 지극히
  lexicon: LSJ
  rationale: ἐπὶ πολὺ σφόδρα는 이중 강조이므로 한국어에서도 강한 부사를 중첩해 ‘매우 크게’로 옮겨 놀람의 강도를 드러냈습니다.
