  - 그녀를 보는 어떤 남자들의 눈을 속이도록
  lexicon: LSJ
  rationale: ἀπάτησις의 목적 의미를 직접 살리고, ‘눈’ 이미지를 유지하되 한국어에서는 과도한 반복을 피했습니다.
theological_decisions:
- issue: 장식의 목적에 담긴 도덕적 긴장
  chosen_reading: 이 절은 그녀가 남자들의 눈을 속이기 위해 자신을 매우 아름답게 꾸몄다고 분명히 말합니다.
  alternative_readings:
  - 단순히 시선을 끌기 위해 꾸몄다고 완화할 수 있습니다.
  - 유혹적 연출로만 순화할 수 있습니다.
  rationale: ἀπάτησις는 ‘속임/기만’의 뜻이므로, 서술의 전략성과 도덕적 긴장을 완화하지 않고 그대로 드러내는 것이 원문에 충실합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 3
