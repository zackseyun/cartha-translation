  text: And she put sandals on her feet[a], and put on her anklets and bracelets and rings and earrings and all her jewelry; and she made herself very beautiful[b], to deceive the eyes of any men who might see her.
  footnotes:
  - marker: a
    text: Or 'all her adornment' or 'all her finery' for 'all her jewelry.' The Greek κόσμος here means ornamentation or adornment.
    reason: lexical_alternative
  - marker: b
    text: Or 'all the men who might see her.' The Greek expression is indefinite and general.
    reason: lexical_alternative
translation:
  language: ko
  text: 그녀는 발에 샌들을 신고 발목 장식과 팔찌와 반지와 귀고리와 모든 장신구[a]를 걸쳤으며, 자신을 매우 아름답게 꾸며, 그녀를 보는 어떤 남자들의 눈도 속이려고 했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그녀의 모든 장식물’ 또는 ‘그녀의 모든 치장품’으로 옮길 수 있습니다. 여기서 κόσμος는 ‘세상’이 아니라 장식물 또는 치장을 뜻합니다.
    reason: lexical_alternative
