  - ‘전정’
  - ‘은등불’
  rationale: 본문은 단순 이동이 아니라 의례적/궁정적 등장 장면을 보여 주므로, 한국어에서도 그 격식을 유지하는 것이 독자 이해에 유익합니다.
  doctrine_reference: 서사적 장면 묘사
