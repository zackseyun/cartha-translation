  text: And they reported her to him[a], and he came out into the forecourt[b], with silver lamps going before him.
  footnotes:
  - marker: a
    text: Or 'torches' for 'lamps'; the Greek term can refer to either, though the mention of silver favors a ceremonial lighting fixture here.
    reason: lexical_alternative
  - marker: b
    text: The Greek term rendered 'forecourt' refers to the area in front of the main tent or audience space; 'vestibule' or 'tent-front' are possible alternatives.
    reason: lexical_alternative
translation:
  language: ko
  text: 사람들이 그 여인에 관하여 그에게 알리자, 그는 천막 앞뜰[b]로 나왔고, 은으로 된 등불들[a]이 그를 앞서 가고 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘λαμπάδες’는 ‘등불’이나 ‘횃불’을 가리킬 수 있습니다. ‘은으로 된’이라는 수식 때문에 여기서는 의례용 조명기구로 이해하여 ‘등불’로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘προσκήνιον’은 주요 천막이나 접견 공간 앞의 구역을 가리킵니다. ‘전정’, ‘현관’, 또는 ‘천막 앞’으로도 옮길 수 있습니다.
    reason: lexical_alternative
