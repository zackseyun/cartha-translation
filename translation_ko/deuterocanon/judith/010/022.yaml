  yaml_path: translation/deuterocanon/judith/010/022.yaml
  text: And they reported her to him[a], and he came out into the forecourt[b], with silver lamps going before him.
  footnotes:
  - marker: a
    text: Or 'torches' for 'lamps'; the Greek term can refer to either, though the mention of silver favors a ceremonial lighting fixture here.
    reason: lexical_alternative
  - marker: b
    text: The Greek term rendered 'forecourt' refers to the area in front of the main tent or audience space; 'vestibule' or 'tent-front' are possible alternatives.
    reason: lexical_alternative
translation:
  language: ko
  text: 사람들이 그에 관하여 그에게 알리자, 그는 안쪽 뜰로 나왔고, 은빛 등불들이 그 앞에서 가고 있었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘λαμπάδες’는 ‘등불’이나 ‘횃불’ 모두를 가리킬 수 있습니다. 여기서는 ‘은빛’이라는 수식이 있어 의례용 조명기구로 보는 번역을 택했습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘προσκήνιον’은 본문의 군막/접견 공간 앞쪽을 가리키는 말로, ‘전정’이나 ‘뜰 앞’도 가능하지만 여기서는 ‘안쪽 뜰’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνήγγειλαν
  english_pob_choice: reported
  chosen_korean: 알리자
  alternatives_korean:
  - 보고하자
  - 전하자
  - 보고하였습니다
  lexicon: BDAG
  rationale: 궁정 서술의 문맥에서 단순한 정보 전달을 나타내므로, 지나치게 격식적인 ‘보고하다’보다 자연스러운 ‘알리다’를 택했습니다.
- source_word: προσκήνιον
  english_pob_choice: forecourt
  chosen_korean: 안쪽 뜰
  alternatives_korean:
  - 뜰
  - 전정
  - 현관 앞
  lexicon: LSJ
  rationale: 주요 천막이나 접견 공간 앞의 구역을 가리키므로, 한국어로는 군막/궁정 분위기를 살리면서도 오해를 줄이는 ‘안쪽 뜰’이 적절합니다.
- source_word: λαμπάδες ἀργυραῖ
  english_pob_choice: silver lamps
  chosen_korean: 은빛 등불
  alternatives_korean:
  - 은등불
  - 은촛대
  - 은빛 횃불
  lexicon: LSJ
  rationale: ‘λαμπάδες’는 횃불과 등불을 모두 가리킬 수 있지만, ‘은빛’이 붙어 있어 의례용 조명기구의 이미지를 살려 ‘은빛 등불’로 옮겼습니다.
- source_word: προάγον
  english_pob_choice: going before
  chosen_korean: 그 앞에서 가고
  alternatives_korean:
  - 그 앞서 가고
  - 그를 앞서며
  - 그 앞에 서고
  lexicon: BDAG
  rationale: 행렬에서 앞서 이동하는 지속적 동작을 드러내기 위해, 분사적 뉘앙스를 살린 ‘그 앞에서 가고 있었습니다’로 옮겼습니다.
theological_decisions:
- issue: 의례적 장면의 묘사에서 현대 한국어의 자연스러움과 원문의 궁정적 분위기 유지
  chosen_reading: 직역에 치우치지 않고, 그러나 장면의 위엄을 약화시키지 않도록 ‘안쪽 뜰’과 ‘은빛 등불’로 표현했습니다.
  alternative_readings:
