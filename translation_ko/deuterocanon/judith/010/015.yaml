  text: And they said to her[a], “You have saved your life by hurrying down into the presence of our lord. And now come to his tent[b], and some from among us will escort you until they hand you over into his hands.”
  footnotes:
  - marker: a
    text: Or “You have saved your life.” The Greek idiom literally says “You have saved your soul/life.”
    reason: lexical_alternative
  - marker: b
    text: “Into his hands” is a Greek idiom meaning into his control or custody.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 그녀에게 말했습니다. 「당신은 서둘러 내려와 우리 주인 앞에 나아감으로써 당신의 목숨을 구했습니다[a]. 이제 그의 천막으로 오십시오. 우리 가운데 몇 사람이 당신을 호위하여 그의 손에 넘길 때까지[b] 데려갈 것입니다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “당신의 생명을 구했습니다.” 그리스어는 문자적으로 “당신의 영혼/생명을 구했습니다”라고 합니다.
    reason: lexical_alternative
  - marker: b
    text: “그의 손에”는 어떤 사람의 권세나 통제 아래로 넘겨짐을 뜻하는 그리스어 관용 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Σέσωκας τὴν ψυχήν σου
  english_pob_choice: You have saved your life
  chosen_korean: 당신은 당신의 생명을 구했습니다
  alternatives_korean:
  - 당신은 당신의 생명을 살렸습니다
  - 당신은 당신의 목숨을 건졌습니다
  lexicon: LSJ
  rationale: ψυχή를 여기서는 직역적 의미인 ‘생명’으로 옮기되, 완결된 구문은 한국어에서 자연스러운 ‘생명을 구했습니다’로 처리했습니다.
- source_word: σπεύσασα καταβῆναι
  english_pob_choice: by hurrying down
  chosen_korean: 서둘러 내려가므로
  alternatives_korean:
  - 급히 내려가므로
  - 서둘러 내려감으로
  lexicon: LSJ
  rationale: 분사구는 결과가 아니라 방법/상황을 나타내므로, 원문의 행위 방식이 드러나도록 ‘서둘러 내려가므로’로 옮겼습니다.
- source_word: εἰς πρόσωπον τοῦ κυρίου ἡμῶν
  english_pob_choice: into the presence of our lord
  chosen_korean: 우리 주 앞에 서려고
  alternatives_korean:
  - 우리 주의 앞에
  - 우리 주의 면전에
  lexicon: LSJ
  rationale: πρόσωπον의 관용적 의미를 ‘앞/면전’으로 살리되, 한국어에서는 ‘서다’가 포함된 표현이 가장 자연스럽고 경어적 압박도 유지합니다.
- source_word: προπέμψουσίν σε
  english_pob_choice: will escort you
  chosen_korean: 호위하여 데려갈 것입니다
  alternatives_korean:
  - 호송할 것입니다
  - 배웅하여 갈 것입니다
  lexicon: LSJ
  rationale: προπέμπω의 ‘동행하여 이끌다/호위하다’ 의미를 군사적 맥락에 맞게 ‘호위하여 데려가다’로 옮겼습니다.
