  source_fidelity: 초안의 ‘우리 주 앞에 서려고’는 εἰς πρόσωπον τοῦ κυρίου ἡμῶν(‘우리 주인 앞에/앞으로’)에 목적 의미와 ‘서다’를 보태며, ‘서둘러 내려가므로’는 완료 동작과 수단의 관계를 다소 부자연스럽게 처리합니다. 또한 마지막 절에서 ‘몇 사람’과 ‘그들이’의 지시 대상이 일치하지 않습니다. 수정문은 σπεύσασα καταβῆναι의 수단적 뉘앙스, 인간 상관을 뜻하는 κύριος, 그리고 παραδῶσίν … εἰς χεῖρας αὐτοῦ의 ‘넘겨주다’ 관용구를 보존합니다.
  naturalness: ‘서둘러 내려와 … 앞에 나아감으로써’는 현대 표준 한국어의 합쇼체에서 자연스럽고 원문의 동작 관계를 분명히 합니다. ‘우리 가운데 몇 사람이’가 뒤의 동사를 계속 주도하도록 하여 문장 흐름과 지시 관계를 정리했습니다.
  terminology: ψυχή는 이 문맥에서 ‘목숨’으로 자연스럽게 옮기고 각주에서 ‘영혼/생명’이라는 직역 가능성을 밝혔습니다. 인간 지배자를 가리키는 κύριος는 신적 호칭을 피하여 ‘우리 주인’으로 옮겼습니다. σκηνή는 군사 문맥에 맞게 ‘천막’, προπέμπω는 ‘호위하다’, εἰς χεῖρας는 ‘손에’로 유지했습니다.
