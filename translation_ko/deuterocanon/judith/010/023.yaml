    issue: 원문에 없는 ‘이제’가 첨가되었습니다.
    rationale: ὡς δέ는 여기서 ‘~하자/때’의 연결을 나타내며, 명시적 시간 부사 ‘이제’를 요구하지 않습니다.
  - severity: medium
