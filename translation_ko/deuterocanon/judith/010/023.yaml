revisions:
- from: 이제 유딧이 그의 앞과 그의 시종들 앞에 이르자, 그들은 모두 그녀의 얼굴의 아름다움에 놀랐습니다. 그리고 그녀가 얼굴을 땅에 대고 엎드려 그에게 경배하자, 그들은 그녀를 일으켜 세웠습니다.[a]
  to: 유딧이 그와 그의 시종들 앞에 나아가자, 그들은 모두 그녀의 얼굴이 아름다운 것을 보고 감탄했습니다. 유딧이 엎드려 그에게 절하자[a], 그들이 그녀를 일으켜 세웠습니다.
  rationale: 원문에 없는 담화 표지 ‘이제’를 제거하고, 유딧이 호로페르네스와 그의 시종들 앞에 나아간 구문을 자연스럽게 재구성했습니다. 아름다움에 대한 감탄을 명확히 했으며, 인간 통치자를 향한 προσκυνέω를 종교적 의미가 강한 ‘경배하다’ 대신 원문의 신체적 복종 행위를 보존하는 ‘절하다’로 옮겼습니다. 각주 표지도 해당 동사 바로 뒤로 옮겨 주석 대상이 분명하도록 했습니다.
