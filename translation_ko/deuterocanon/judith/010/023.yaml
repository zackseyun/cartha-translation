  text: Now when Judith came before him and his attendants[a], they all marveled at the beauty of her face; and falling on her face, she bowed down to him, and they raised her up.
  footnotes:
  - marker: a
    text: Or 'paid homage to him.' The Greek verb can also mean 'worship,' but here it is used for reverence shown to a human ruler.
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 유딧이 그의 앞과 그의 시종들 앞에 이르자, 그들은 모두 그녀의 얼굴의 아름다움에 놀랐습니다. 그리고 그녀가 얼굴을 땅에 대고 엎드려 그에게 경배하자, 그들은 그녀를 일으켜 세웠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 동사는 문맥상 인간 통치자에게 보이는 공경을 뜻할 수 있으며, 여기서는 종교적 예배가 아니라 예우의 몸짓으로 이해됩니다.
    reason: theological_note
lexical_decisions:
- source_word: κατὰ πρόσωπον αὐτοῦ
  english_pob_choice: before him
  chosen_korean: 그의 앞
  alternatives_korean:
  - 그의 면전으로
  - 그의 앞에
  lexicon: LSJ
  rationale: 궁정 장면에서 이 관용구는 물리적 ‘얼굴 맞대기’보다 ‘그의 앞/면전’이라는 출현 장소를 가리키므로, 자연스러운 현대 한국어로 옮겼습니다.
- source_word: θεραπόντων
  english_pob_choice: attendants
  chosen_korean: 시종들
  alternatives_korean:
  - 종들
  - 수종들
  - 하인들
  lexicon: LSJ
  rationale: θεράπων은 여기서 호로페르네스의 궁정 주변 인물들을 가리키므로, ‘종’보다 궁정적 뉘앙스가 살아 있는 ‘시종들’을 택했습니다.
- source_word: ἐθαύμασαν ... ἐπὶ τῷ κάλλει τοῦ προσώπου
  english_pob_choice: marveled at the beauty of her face
  chosen_korean: 그녀의 얼굴의 아름다움에 놀랐습니다
  alternatives_korean:
  - 그녀의 얼굴의 아름다움에 경탄했습니다
  - 그녀의 얼굴의 아름다움을 보고 놀랐습니다
  lexicon: LSJ
  rationale: ἐθαύμασαν은 단순한 ‘놀람’보다 감탄을 동반한 놀라움이므로 ‘놀랐습니다’로 옮기되, ἐπὶ τῷ κάλλει τοῦ προσώπου의 초점은 ‘얼굴의 아름다움’으로 유지했습니다.
- source_word: προσεκύνησεν
  english_pob_choice: bowed down to him
  chosen_korean: 그에게 경배하자
  alternatives_korean:
  - 그에게 절하자
  - 그에게 경의를 표하자
  - 그에게 엎드려 절하자
  lexicon: LSJ
  rationale: 동사가 인간 통치자를 향해 쓰인 경우라도 본문은 실제로 엎드려 절하는 예를 묘사하므로, 동작과 경의를 함께 드러내는 ‘경배하다’를 택했습니다. 다만 한국어의 종교적 오해 가능성은 문맥 전체와 각주로 보완했습니다.
theological_decisions:
- issue: προσκυνέω/προσκυνέω 계열 동사의 인간 통치자 대상 사용
  chosen_reading: 여기서는 예배가 아니라 인간 권력자에게 보이는 예우로 이해하되, 한국어 본문은 ‘경배하다’로 옮겨 동사의 강한 외형을 살렸습니다.
  alternative_readings:
  - 예배하다
  - 절하다
  - 경의를 표하다
  rationale: 그 대상이 하나님이 아니라 호로페르네스이므로 의미상 종교적 예배로 제한하면 안 되지만, 원어의 강한 몸짓을 약화시키지 않기 위해 본문에서는 직접적 제스처를 유지하고, 의미 해설은 각주로 처리합니다.
  doctrine_reference: 'DOCTRINE.md: Preserve theological tension rather than resolve it; translate according to source-context plain sense.'
