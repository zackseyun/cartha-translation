  source_fidelity: 수정이 필요합니다. 본문의 ‘이제’는 원문의 ὡς δέ가 명시하는 ‘이제’에 해당하지 않으므로 삭제하는 것이 좋습니다. 또한 κατὰ πρόσωπον αὐτοῦ καὶ τῶν θεραπόντων αὐτοῦ는 유딧이 ‘그와 그의 시종들 앞에’ 나아간 것으로 옮겨야 하며, 초안의 ‘그의 앞과 그의 시종들 앞에’는 어색하게 반복됩니다. προσκυνέω는 이 인간 통치자 앞의 문맥에서 종교적 ‘경배’보다 몸을 낮추어 ‘절하다/경의를 표하다’라는 뜻입니다.
  naturalness: ‘그와 그의 시종들 앞에 나아가자’, ‘그녀의 얼굴이 아름다운 것을 보고 모두 감탄했습니다’, ‘엎드려 그에게 절하자’는 현대 표준 한국어 합쇼체에 자연스럽고 원문의 동작 순서도 보존합니다.
  terminology: ‘시종들’은 θεράποντες의 궁정·수행원 문맥에 적절합니다. ‘경배하다’는 현대 한국어에서 종교 예배의 의미가 강하여 이 문맥에는 부적절하므로 ‘절하다’로 고쳤습니다. 각주는 προσκυνέω의 가능한 넓은 의미를 설명하되 본문 의미를 흐리지 않도록 조정했습니다.
  issues:
