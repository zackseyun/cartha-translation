  - severity: high
    issue: ‘경배하다’가 인간 통치자에게 한 προσκυνέω를 종교적 예배로 오해하게 합니다.
    rationale: 이 문맥의 προσκυνέω는 엎드려 보이는 신하의 예우 또는 절을 가리킵니다. ‘절하다’는 실제 몸짓과 비종교적 문맥을 함께 자연스럽게 전달합니다.
