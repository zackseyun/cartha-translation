  text: 그리고 저는 당신들의 군대의 최고사령관 오로페르네스의 앞으로 가서 진리의 말들을 알리려 합니다. 또 그 앞에서 그가 지나가며 온 산지 전체를 차지할 길을 보여 주겠습니다. 그리고 그의 사람들 가운데 한 몸도, 생명의 숨결도 하나도 빠지지 않을 것입니다.[a]
  philosophy: optimal-equivalence
