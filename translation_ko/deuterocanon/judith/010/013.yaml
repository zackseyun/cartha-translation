    rationale: ‘오로페르네스의 앞으로’는 어색하며, 인명도 한국어 성서에서 널리 쓰이는 ‘홀로페르네스’와 일치시키는 것이 적절합니다.
  - severity: medium
    issue: 목적 표현 ‘알리려 합니다’
    rationale: τοῦ ἀναγγεῖλαι는 의도·희망의 완곡 표현보다 방문의 목적을 나타냅니다. ‘알리기 위해 ... 갑니다’가 더 직접적입니다.
  - severity: low
    issue: 각주 위치와 내용
    rationale: 영어 감사 기록의 각주는 종결절의 σάρξ 관련 어휘 선택을 다룹니다. 초안처럼 인명에 붙인 음역 각주보다 해당 종결절에 붙여야 합니다.
