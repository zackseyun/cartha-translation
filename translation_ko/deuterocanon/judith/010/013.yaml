    text: Or 'not one body of his men, nor a breath of life,' preserving the Greek's vivid bodily idiom.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 저는 진실한 말씀을 알리기 위해 당신들의 군대의 최고사령관 홀로페르네스 앞에 갑니다. 또 제가 그 앞에서 그가 나아가 온 산지 전체를 차지할 길을 보여 주겠습니다. 그의 부하들 가운데 한 몸도, 생명의 숨결 하나도 빠지지 않을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘한 몸’은 그리스어 σὰρξ(‘살, 육체’)의 문자적 신체 표현을 반영합니다. 달리 옮기면 ‘그의 부하들 가운데 한 육체도, 생명의 숨결도’가 됩니다.
    reason: lexical_alternative
