- from: 그리고 저는 당신들의 군대의 최고사령관 오로페르네스의 앞으로 가서 진리의 말들을 알리려 합니다. 또 그 앞에서 그가 지나가며 온 산지 전체를 차지할 길을 보여 주겠습니다. 그리고 그의 사람들 가운데 한 몸도, 생명의 숨결도 하나도 빠지지 않을 것입니다.[a]
  to: 그리고 저는 진실한 말씀을 알리기 위해 당신들의 군대의 최고사령관 홀로페르네스 앞에 갑니다. 또 제가 그 앞에서 그가 나아가 온 산지 전체를 차지할 길을 보여 주겠습니다. 그의 부하들 가운데 한 몸도, 생명의 숨결 하나도 빠지지 않을 것입니다.[a]
  rationale: 문장의 목적 관계와 이동 경로를 원문에 맞게 명확히 하고, 자연스러운 현대 표준어 합쇼체로 다듬었습니다. 종결절은 ‘부하들 가운데’가 두 병렬 항목에 모두 걸리도록 처리하여, 한 사람의 몸이나 생명의 숨결도 결원으로 남지 않는다는 원문의 수사적 표현을 보존했습니다.
