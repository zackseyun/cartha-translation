  text: And when the men heard her words and observed her face[b][a], she was exceedingly marvelous in beauty before them.
  footnotes:
  - marker: a
    text: Or 'looked closely at her face' for 'observed her face'; the Greek verb suggests attentive notice.
    reason: lexical_alternative
  - marker: b
    text: Literally 'she was before them marvelous in beauty exceedingly,' an idiom expressing that she appeared to them as extraordinarily beautiful.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 그녀의 말을 듣고 그녀의 얼굴을 살펴보니, 그녀는 그들이 보기에 아름다움이 심히 놀라웠습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡς δὲ ἤκουσαν
  english_pob_choice: And when they heard
  chosen_korean: 그들이 ... 듣고
  alternatives_korean:
  - 그리고 그들이 들었을 때
  - 그들이 듣자
  lexicon: BDAG
  rationale: ὡς + aorist의 시간적 관계를 자연스럽게 옮겨 서술의 흐름을 살렸습니다.
- source_word: κατενόησαν τὸ πρόσωπον αὐτῆς
  english_pob_choice: observed her face
  chosen_korean: 그녀의 얼굴을 살펴보니
  alternatives_korean:
  - 그녀의 얼굴을 주의 깊게 보니
  - 그녀의 얼굴을 관찰하니
  lexicon: BDAG
  rationale: κατανοέω는 단순히 보는 것보다 주의 깊게 알아차리는 뜻이 있어, 얼굴을 향한 집중적 시선을 ‘살펴보니’로 옮겼습니다.
- source_word: ἦν ἐναντίον αὐτῶν θαυμάσιον τῷ κάλλει σφόδρα
  english_pob_choice: she was exceedingly marvelous in beauty before them
  chosen_korean: 그들 앞에서 아름다움이 심히 놀라울 정도였습니다
  alternatives_korean:
  - 그들 앞에서 매우 아름다워 보였습니다
  - 그들 앞에서 그 아름다움이 대단히 놀라웠습니다
  lexicon: BDAG
  rationale: 직역하면 ‘그들 앞에서 아름다움에 대하여 매우 놀라운 상태였다’는 관용적 구문이므로, 자연스러운 한국어로 풀되 ‘아름다움’과 ‘놀라울 정도’의 긴장을 유지했습니다.
