base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/010/020.yaml
  text: And those attending Holofernes came out[a], and all his servants, and they brought her into the tent.
  footnotes:
  - marker: a
    text: Or 'those sleeping beside Holofernes' / 'those lying near Holofernes.' The Greek participle can be read more literally as denoting those who slept or lay near him, but here it likely refers to those in close attendance on him.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 홀로페르네스 곁에 있던 사람들과 그의 모든 종들이 나와 그녀를 천막으로 데려갔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘홀로페르네스 곁에서 자던 사람들’ / ‘홀로페르네스 곁에 누워 있던 사람들’. 그리스어 분사는 더 문자적으로는 그와 가까이 자거나 누워 있던 사람들을 뜻할 수 있지만, 여기서는 가까이 시중드는 사람들을 가리키는 것으로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ παρακαθεύδοντες Ὀλοφέρνῃ
  english_pob_choice: those attending Holofernes
  chosen_korean: 홀로페르네스 곁에 있던 사람들
  alternatives_korean:
  - 홀로페르네스 옆에서 자던 사람들
  - 홀로페르네스 곁에 누워 있던 사람들
  - 홀로페르네스를 시중들던 사람들
  lexicon: LSJ
  rationale: παρακαθεύδω의 문자적 뉘앙스는 ‘곁에서 자다/눕다’이지만, 영어 POB의 판단처럼 문맥상 ‘가까이 붙어 시중드는 사람들’의 기능이 더 분명하므로, 한국어에서는 그 기능을 살리되 문자적 거리감도 남기는 표현으로 옮겼습니다.
- source_word: θεράποντες
  english_pob_choice: servants
  chosen_korean: 종들
  alternatives_korean:
  - 하인들
  - 시종들
  - 종자들
  lexicon: LSJ
  rationale: θεράπων은 단순한 ‘일꾼’보다 주인 곁에서 봉사하는 사람을 가리킬 수 있어, 가장 직접적이고 위계가 드러나는 ‘종들’로 옮겼습니다.
- source_word: ἐξῆλθον
  english_pob_choice: came out
  chosen_korean: 나왔습니다
  alternatives_korean:
  - 나갔습니다
  - 밖으로 나왔습니다
  lexicon: BDAG
  rationale: 동사의 방향성을 간명하게 살리면서도 한국어 서술문에 자연스럽게 맞는 기본형으로 번역했습니다.
- source_word: σκηνήν
  english_pob_choice: the tent
  chosen_korean: 천막
  alternatives_korean:
  - 텐트
  - 장막
  lexicon: LSJ
  rationale: 군영 맥락의 σκηνή는 현대 한국어에서 가장 직접적으로 이해되는 ‘천막’이 적절하며, ‘장막’보다 구체적입니다.
theological_decisions:
- issue: 홀로페르네스 주변 인물들의 성격을 얼마나 문자적으로 드러낼지
  chosen_reading: ‘곁에 있던 사람들’로 번역해, 잠자리 동반자라는 노골적 이미지는 줄이되 근접한 시종/경호의 뉘앙스는 유지했습니다.
  alternative_readings:
  - ‘곁에서 자던 사람들’
  - ‘곁에 누워 있던 사람들’
  - ‘시중들던 사람들’
  rationale: 이 절은 서술상 정보 전달이 핵심이므로, 독자가 불필요하게 성적인 연상을 먼저 하도록 하기보다 문맥상 기능을 드러내는 쪽이 본문의 진행을 더 정확하게 전달합니다.
  doctrine_reference: 서사 문맥의 명료성 및 원문 어휘의 기능적 등가
