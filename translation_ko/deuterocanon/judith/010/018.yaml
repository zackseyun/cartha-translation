revisions:
- from: 그리고 진영 안에는 소란이 일어났습니다. 그녀가 온 일이 천막들 사이에 퍼졌기 때문입니다. 그래서 사람들이 와서 그녀가 홀로페르네스의 천막 밖에 서 있는 동안 그녀를 둘러쌌고, 마침내 그에게 그녀에 관해 알렸습니다.[a]
  to: 그리고 진영 안에 사람들이 한데 몰려들었습니다.[a] 그녀가 왔다는 소식이 천막들 사이로 퍼졌기 때문입니다. 그들은 와서 홀로페르네스의 천막 밖에 서 있는 그녀를 둘러쌌고, 그에게 그녀에 관한 소식을 알릴 때까지 그렇게 하였습니다.
  rationale: 원문의 συνδρομή가 가리키는 갑작스러운 집단적 몰려듦을 본문에 명시하고, παρουσία와 διεβοήθη의 관계를 ‘그녀가 왔다는 소식이 … 퍼졌다’로 자연스럽게 재구성했습니다. 또한 ἕως προσήγγειλαν αὐτῷ περὶ αὐτῆς의 시간적 한계를 ‘그에게 그녀에 관한 소식을 알릴 때까지’로 보존했으며, 각주 표지를 해당 어휘 뒤로 옮겼습니다.
