    rationale: συνδρομή는 ‘함께 달려듦/몰려듦, 집결’의 의미가 중심입니다. 소음이나 정서적 소동으로만 읽힐 수 있는 ‘소란’보다 ‘사람들이 한데 몰려들었습니다’가 문맥과 어휘 의미를 더 정확히 전달합니다.
