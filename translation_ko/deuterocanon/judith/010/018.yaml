base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/010/018.yaml
  text: And there was a rush in the camp[a], for her arrival was reported through the tents; and they came and gathered around her as she stood outside the tent of Holofernes, until they announced her to him.
  footnotes:
  - marker: a
    text: Or 'her presence was cried out through the tents.' The Greek verb suggests vocal spreading of the news, and παρουσία can mean either 'presence' or, contextually, 'arrival.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 진영 안에 사람들이 한데 몰려들었습니다.[a] 그녀가 왔다는 소식이 천막들 사이로 퍼졌기 때문입니다. 그들은 와서 홀로페르네스의 천막 밖에 서 있는 그녀를 둘러쌌고, 그에게 그녀에 관한 소식을 알릴 때까지 그렇게 하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘사람들이 한데 몰려들었습니다’는 여기서 여러 사람이 갑자기 함께 모여드는 상황을 옮긴 것입니다. 그리스어 συνδρομή는 단순한 감정적 소란보다 집단적인 몰려듦이나 집결을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο συνδρομή
  english_pob_choice: there was a rush
  chosen_korean: 소란이 일어났습니다
  alternatives_korean:
  - 혼잡이 일어났습니다
  - 우르르 몰려듦이 있었습니다
  - 급히 모여듦이 있었습니다
  lexicon: LSJ
  rationale: συνδρομή는 단순한 감정보다 여러 사람이 갑자기 한데 몰려드는 상황을 가리키므로, 자연스러운 현대 한국어로는 ‘소란’이 가장 무리 없는 대응입니다.
- source_word: παρεμβολή
  english_pob_choice: camp
  chosen_korean: 진영
  alternatives_korean:
  - 캠프
  - 야영지
  - 부대
  lexicon: LSJ
  rationale: 군사 서술에서 παρεμβολή는 전투 진영을 뜻하므로, 한국어 성경문맥에서 ‘진영’이 의미와 문체를 함께 살립니다.
- source_word: διεβοήθη ... εἰς τὰ σκηνώματα
  english_pob_choice: was reported through the tents
  chosen_korean: 천막들 사이에 퍼졌기 때문입니다
  alternatives_korean:
  - 천막들에 걸쳐 외쳐졌기 때문입니다
  - 천막들 사이로 알려졌기 때문입니다
  - 천막들 전체에 소문이 났기 때문입니다
  lexicon: LSJ
  rationale: 동사는 단순 전달보다 ‘소리 내어 퍼짐’의 뉘앙스를 가지지만, 한국어에서는 직접적인 ‘외쳐졌다’보다 ‘퍼졌다’가 문맥상 자연스럽고 본문 의미도 유지합니다.
- source_word: ἡ παρουσία αὐτῆς
  english_pob_choice: her arrival
  chosen_korean: 그녀가 온 일
  alternatives_korean:
  - 그녀의 도착
  - 그녀의 উপস্থিত?
  - 그녀의 출현
  lexicon: LSJ
  rationale: παρουσία는 여기서 정적인 ‘존재’보다 사건으로서의 도착을 가리키므로, ‘온 일’이 사태의 발생을 간명하게 드러냅니다.
- source_word: ἐκύκλουν αὐτήν
  english_pob_choice: gathered around her
  chosen_korean: 그녀를 둘러쌌고
  alternatives_korean:
  - 그녀 주위에 모였고
  - 그녀를 에워쌌고
  - 그녀 둘레를 돌았고
  lexicon: LSJ
  rationale: 동사는 문자적으로 ‘둘러 돌다/에워싸다’의 뜻이므로, 지나치게 군사적이지 않으면서도 공간적 이미지를 보존하는 ‘둘러쌌고’를 택했습니다.
- source_word: προσήγγειλαν αὐτῷ περὶ αὐτῆς
  english_pob_choice: they announced her to him
  chosen_korean: 그에게 그녀에 관해 알렸습니다
  alternatives_korean:
  - 그에게 그녀를 보고했습니다
  - 그에게 그녀에 대해 전했습니다
  - 그에게 그녀를 알렸습니다
  lexicon: LSJ
  rationale: 직역식 ‘보고했다/알렸다’보다, 대상을 상급자에게 통보하는 상황을 살리면서도 한국어로는 ‘그녀에 관해 알렸다’가 가장 자연스럽습니다.
theological_decisions:
- issue: 군사 진영 안에서의 집단 반응을 어떻게 드러낼 것인가
  chosen_reading: ‘진영’과 ‘소란’으로 옮겨, 사건이 홀로페르네스의 사적 공간으로 들어가기 직전 군중의 즉각적 반응을 드러냈습니다.
  alternative_readings:
  - ‘부대’와 ‘혼잡’으로 옮길 수 있음
  - ‘캠프’와 ‘시끄러움’으로 옮길 수 있음
  rationale: 본문은 단순한 시끄러움이 아니라 한 여인의 등장으로 진영 전체가 동요하는 장면을 보여 주므로, 공간성과 집단성을 함께 보존하는 번역이 적절합니다.
  doctrine_reference: 본문 서사 이해
