- from: 그들이 그녀를 붙잡고 물었습니다. 「당신은 누구입니까, 어디에서 오고 있습니까, 그리고 어디로 가고 있습니까?」 그러자 그녀가 말했습니다. 「나는 히브리 사람들의 딸입니다. 나는 그들 앞에서 달아나고 있습니다. 그들이 곧 당신들에게 넘겨져 먹잇감이 될 것이기 때문입니다.」[a][b][c]
  to: 그들이 그녀를 붙잡고 물었습니다. 「당신은 누구의 사람입니까?[a] 어디에서 오고 있습니까? 어디로 가고 있습니까?」 그러자 그녀가 말했습니다. 「나는 히브리 사람들의 딸입니다.[b] 나는 그들 앞에서 달아나고 있습니다. 그들이 곧 당신들에게 먹히도록 넘겨질 것이기 때문입니다.[c]」
