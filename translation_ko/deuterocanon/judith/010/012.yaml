  naturalness: 합쇼체는 전반적으로 자연스럽습니다. 다만 ‘누구의 사람입니까?’는 심문 장면에서 자연스럽고 원문의 소속 질문도 보존합니다. ‘그들 앞에서 달아나고 있습니다’도 ἀπὸ προσώπου αὐτῶν의 관용적 표현을 무리 없이 반영합니다.
  terminology: ‘히브리 사람들의 딸’은 θυγάτηρ τῶν Ἑβραίων의 가족적·민족적 자기표현을 잘 보존합니다. ‘먹히도록’은 κατάβρωμα의 강한 이미지를 유지하되 불필요한 해석을 더하지 않습니다.
