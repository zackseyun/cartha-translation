base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/010/012.yaml
  text: And they seized her and asked her[a], “Who are you, and where are you coming from, and where are you going?” And she said, “I am a daughter of the Hebrews, and I am fleeing from before them[c][b], because they are about to be given over to you for consumption.”
  footnotes:
  - marker: a
    text: Or, “Who do you belong to?” The Greek literally asks, “Whose are you?” and may refer to ethnic or political allegiance.
    reason: lexical_alternative
  - marker: b
    text: Or, “I am a Hebrew woman.” The Greek literally reads, “I am a daughter of the Hebrews.”
    reason: lexical_alternative
  - marker: c
    text: 'Or, “to be consumed” or “as food.” The phrase is vivid: “for devouring.”'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 그녀를 붙잡고 물었습니다. 「당신은 누구의 사람입니까?[a] 어디에서 오고 있습니까? 어디로 가고 있습니까?」 그러자 그녀가 말했습니다. 「나는 히브리 사람들의 딸입니다.[b] 나는 그들 앞에서 달아나고 있습니다. 그들이 곧 당신들에게 먹히도록 넘겨질 것이기 때문입니다.[c]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, “당신은 누구에게 속해 있습니까?” 원문은 문자적으로 “당신은 누구의 사람입니까?”에 가깝고, 소속이나 편을 묻는 말일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는, “히브리 여인입니다.” 원문은 문자적으로 “히브리 사람들의 딸입니다.”라고 되어 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는, “먹어 치워지도록” 또는 “먹을 것으로.” κατάβρωμα는 “먹어 치움/포식”의 생생한 표현입니다.
    reason: lexical_alternative
