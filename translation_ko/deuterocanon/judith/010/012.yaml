    rationale: 영어 감사 기록과 원문 모두 ‘Whose are you?’라는 속격 질문의 의미를 중시합니다. 각주만이 아니라 본문에서도 ‘누구의 사람입니까?’로 반영하는 것이 최적 등가 원칙에 맞습니다.
