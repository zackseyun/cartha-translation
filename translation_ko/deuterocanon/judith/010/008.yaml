base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/010/008.yaml
  text: And they said to her, “May the God of our fathers grant you favor, and bring your undertakings to completion for the boasting of the sons of Israel and the exaltation of Jerusalem.” And she bowed down to God.
  footnotes:
  - marker: a
    text: Or “grant you grace” / “grant you acceptance.” The Greek phrase literally says “give you into favor,” an idiom for granting favorable reception or success.
    reason: lexical_alternative
  - marker: b
    text: Or “your plans” or “your pursuits.” The Greek term can refer broadly to one’s undertakings or course of action.
    reason: lexical_alternative
  - marker: c
    text: Or “for the glory of the Israelites and the honor of Jerusalem.”
    reason: alternative_reading
  - marker: d
    text: Or “she worshiped God” or “she prostrated herself before God.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 그녀에게 말했습니다. “우리 조상들의 하나님께서 당신에게 은혜를 주시고, 당신의 일들을 완성하게 하셔서 이스라엘 자손의 자랑과 예루살렘의 높임이 되게 하시기를 바랍니다.” 그리고 그녀는 하나님께 엎드려 절했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δῴη σε εἰς χάριν
  english_pob_choice: grant you favor
  chosen_korean: 당신에게 은혜를 주시고
  alternatives_korean:
  - 당신에게 호의를 주시고
  - 당신을 받아 주시고
  - 당신에게 은총을 주시고
  lexicon: LSJ
  rationale: δώη의 기원문 기도체를 살리되, εἰς χάριν은 한국어에서 가장 자연스러운 축복 표현인 ‘은혜를 주시고’로 옮겨, 단순한 감정적 호의보다 실제적 호의/성공의 뉘앙스를 담았습니다.
- source_word: τελειῶσαι τὰ ἐπιτηδεύματά σου
  english_pob_choice: bring your undertakings to completion
  chosen_korean: 당신의 일들을 완성하게 하셔서
  alternatives_korean:
  - 당신의 계획들을 이루게 하셔서
  - 당신의 소망들을 성취하게 하셔서
  - 당신의 과업들을 끝까지 이루게 하셔서
  lexicon: LSJ
  rationale: τελειῶσαι는 ‘완성하다, 끝내다’의 목적을 분명히 하므로 ‘완성하게 하셔서’로 옮겼고, τὰ ἐπιτηδεύματά σου는 범위가 넓은 ‘undertakings’에 맞게 너무 좁히지 않고 ‘일들’로 처리했습니다.
- source_word: εἰς καύχημα υἱῶν Ἰσραὴλ
  english_pob_choice: for the glory of the sons of Israel
  chosen_korean: 이스라엘 자손의 자랑이 되게 하시기를
  alternatives_korean:
  - 이스라엘 자손의 영광이 되게 하시기를
  - 이스라엘 자손이 자랑할 이유가 되게 하시기를
  - 이스라엘 자손의 기쁨이 되게 하시기를
  lexicon: LSJ
  rationale: καύχημα는 ‘자랑거리/자랑의 근거’의 의미가 핵심이므로, POB의 영어 재번역 취지에 맞게 한국어에서도 ‘자랑’으로 살려 공적 명예의 뉘앙스를 보존했습니다.
- source_word: ὕψωμα Ἰερουσαλήμ
  english_pob_choice: the exaltation of Jerusalem
  chosen_korean: 예루살렘의 높임이 되게 하시기를
  alternatives_korean:
  - 예루살렘의 높아짐이 되게 하시기를
  - 예루살렘의 높임과 영광이 되게 하시기를
  - 예루살렘의 높임이 되게 하시기를
  lexicon: LSJ
  rationale: ὕψωμα는 높임/높아짐의 이미지를 가지므로, 추상적 ‘영광’보다 원문 은유를 보존하는 ‘높임’이 더 직접적입니다.
- source_word: προσεκύνησεν τῷ θεῷ
  english_pob_choice: she bowed down to God
  chosen_korean: 그녀는 하나님께 엎드려 절했습니다
  alternatives_korean:
  - 그녀는 하나님께 경배했습니다
  - 그녀는 하나님께 엎드렸습니다
  - 그녀는 하나님께 절했습니다
  lexicon: LSJ
  rationale: προσκυνέω의 신체적 동작을 살리기 위해 ‘엎드려 절했습니다’로 옮겼습니다. ‘경배했습니다’는 의미는 맞지만 동작성이 약해집니다.
theological_decisions:
- issue: καύχημα의 공적 명예/자랑 뉘앙스
  chosen_reading: 이스라엘 자손의 자랑
  alternative_readings:
  - 이스라엘 자손의 영광
  - 이스라엘 자손의 자랑거리
  rationale: 이 구절은 개인적 자랑이 아니라 공동체의 공적 명예를 가리키므로, ‘자랑’이라는 말을 유지하되 한국어 문맥상 오해를 줄이기 위해 축복문 전체로 공적 의미를 분명히 했습니다.
  doctrine_reference: Translation philosophy §§1, 5
- issue: προσκυνέω의 번역을 동작 중심으로 유지
  chosen_reading: 엎드려 절했습니다
  alternative_readings:
  - 경배했습니다
  - 절했습니다
  rationale: 본문은 즉각적 서술로 예배 행위의 몸짓을 제시하므로, 신앙적 해석어보다 몸짓을 드러내는 표현을 택해 서사의 사실성을 보존했습니다.
  doctrine_reference: Translation philosophy §§1, 6
