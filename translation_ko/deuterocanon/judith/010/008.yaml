  source_fidelity: ‘은혜를 주시고’는 εἰς χάριν의 가능한 뜻이지만, 이 문맥의 ‘호의/호의를 입게 함’보다 신학적으로 더 특정된 ‘grace’로 들릴 수 있습니다. 또한 ‘당신의 일들을 완성하게 하셔서’는 하나님이 유딧으로 하여금 일을 완성하게 하신다는 사역 구문이 되어, 하나님이 그 일들을 완수하시기를 비는 τελειῶσαι의 직접 목적어 구문을 다소 흐립니다.
