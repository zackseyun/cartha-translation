- from: 그들이 그녀에게 말했습니다. “우리 조상들의 하나님께서 당신에게 은혜를 주시고, 당신의 일들을 완성하게 하셔서 이스라엘 자손의 자랑과 예루살렘의 높임이 되게 하시기를 바랍니다.” 그리고 그녀는 하나님께 엎드려 절했습니다.
  to: 그들이 그녀에게 말했습니다. “우리 조상들의 하나님께서 당신에게 호의를 베푸시고, 당신의 일들을 완수하시어 이스라엘 자손에게 자랑이 되고 예루살렘이 높임을 받게 하시기를 빕니다.” 그러고서 그녀는 하나님께 엎드려 절했습니다.
  rationale: 축복 기원의 합쇼체를 ‘하시기를 빕니다’로 자연스럽게 유지했습니다. εἰς χάριν은 문맥상 ‘호의’로, τελειῶσαι는 하나님이 유딧의 일들을 완수하신다는 구조가 드러나도록 고쳤습니다. καύχημα와 ὕψωμα의 공적 명예 및 고양의 뜻은 각각 ‘자랑’과 ‘높임을 받게’로 보존했으며, 마지막 동작은 원문처럼 구체적으로 유지했습니다.
