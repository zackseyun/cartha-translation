  text: And it happened, when she stopped crying out to the God of Israel and finished all these words,
translation:
  language: ko
  text: 그녀가 이스라엘의 하나님께 부르짖기를 그치고 이 모든 말을 마쳤을 때,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ ἐγένετο
  english_pob_choice: And it happened
  chosen_korean: …했을 때
  alternatives_korean:
  - 그리고 일이 있었다
  - 그리고 그것은 일어났습니다
  - 그러자
  lexicon: SBLGNT narrative formula / LXX style
  rationale: 헬라어 서사 전환 공식을 한국어에서 가장 자연스럽게 살리기 위해 시간절 종결형으로 처리했습니다. 직역적 ‘그리고 일이 있었다’는 어색하고, ‘그러자’는 원문의 서사적 틀을 약화시킵니다.
- source_word: ὡς ἐπαύσατο
  english_pob_choice: when she stopped
  chosen_korean: 부르짖기를 그치고
  alternatives_korean:
  - 부르짖다가 멈추고
  - 부르짖기를 멈추고
  - 외쳐 부르다가 그치고
  lexicon: BDAG
  rationale: ἐπαύσατο는 단순히 멈추다/그치다의 뜻이므로, 기도적 호소의 강도를 살려 ‘부르짖기를 그치고’로 옮겼습니다. POB의 ‘stopped crying out’을 반영하되 한국어에서 가장 매끄럽게 조정했습니다.
- source_word: πρὸς τὸν θεὸν Ἰσραήλ
  english_pob_choice: to the God of Israel
  chosen_korean: 이스라엘의 하나님께
  alternatives_korean:
  - 이스라엘의 하나님께
  - 이스라엘 하나님께
  - 이스라엘의 하나님에게
  lexicon: BDAG
  rationale: 관용적 성경 표현인 ‘이스라엘의 하나님’을 유지해 언약적 호칭을 살렸습니다. 여기서 πρὸς는 대상 지시이므로 여격 조사 ‘-께’로 자연스럽게 처리했습니다.
- source_word: πάντα τὰ ῥήματα ταῦτα
  english_pob_choice: all these words
  chosen_korean: 이 모든 말을
  alternatives_korean:
  - 이 모든 말들을
  - 이 모든 말씀을
  - 이 모든 이야기들을
  lexicon: BDAG
  rationale: ῥήματα는 여기서 그녀가 실제로 한 발화 내용을 가리키므로 ‘말’을 택했습니다. ‘말씀’은 신적 발화가 아닌 일반 발화에 비해 의미를 과도하게 높일 수 있어 피했습니다.
theological_decisions:
- issue: 기도 행위의 동사 선택
  chosen_reading: ‘부르짖다’로 기도의 절박함을 드러냈습니다.
  alternative_readings:
  - ‘외치다’로 완화함
  - ‘기도하다’로 일반화함
  rationale: 본문은 단순한 말하기가 아니라 하나님께 향한 절박한 호소를 묘사하므로, 기도적 긴장과 정서를 보존하는 표현이 필요합니다.
  doctrine_reference: Judith의 서사적 기도 표현을 평이한 기도 용어로 약화하지 말 것.
