  source_fidelity: Καὶ ἐγένετο ὡς의 서사적·시간적 연결을 ‘…했을 때,’로 자연스럽게 반영했으며, ἐπαύσατο βοῶσα(부르짖기를 그치고), πρὸς τὸν θεὸν Ἰσραήλ(이스라엘의 하나님께), συνετέλεσεν πάντα τὰ ῥήματα ταῦτα(이 모든 말을 마쳤을 때)를 충실히 옮겼습니다. 원문 자체가 다음 절의 주절로 이어지는 종속적 문장 구조이므로, 쉼표로 끝낸 형태도 적절합니다.
