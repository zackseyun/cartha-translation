  terminology: ‘이스라엘의 하나님’은 원문의 신명 호칭을 정확히 보존하며, 인간 화자의 ῥήματα에 ‘말’을 사용한 것은 ‘말씀’보다 적절합니다. ‘부르짖기’도 기도의 절박한 호소라는 본문의 뉘앙스를 잘 살립니다.
