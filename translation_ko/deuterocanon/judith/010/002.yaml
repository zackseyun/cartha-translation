  yaml_path: translation/deuterocanon/judith/010/002.yaml
  text: And she rose from her prostration and called her maid Abra[a], and went down into the house in which she stayed during the days of her Sabbaths and during her festivals[b],
  footnotes:
  - marker: a
    text: Or 'from her fall.' The Greek noun can denote a fall, but here likely refers to Judith's prostrate posture in prayer or mourning.
    reason: lexical_alternative
  - marker: b
    text: The Greek literally says 'during the days of her Sabbaths,' preserving a plural form that may reflect repeated Sabbath observance rather than a single Sabbath day.
    reason: cultural_note
translation:
  language: ko
  text: 그녀는 엎드려 있던 데서 일어나 자기 여종 아브라를 불러, 안식일들과 자기 절기들에 머물던 집으로 내려갔습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘넘어진 상태에서’. 그리스어 명사 πτῶσις는 ‘넘어짐’도 뜻하지만, 여기서는 기도나 애도 중의 엎드린 자세를 가리킬 가능성이 큽니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어는 직역하면 ‘안식일들의 날들에’입니다. 복수형은 한 번의 안식일이 아니라 반복되는 안식일 준수를 가리킬 수 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: ἀνέστη ἀπὸ τῆς πτώσεως
  english_pob_choice: rose from her prostration
  chosen_korean: 엎드린 자리에서 일어나다
  alternatives_korean:
  - 넘어졌던 자리에서 일어나다
  - 엎드림에서 일어나다
  lexicon: LSJ / BDAG
  rationale: πτῶσις는 문자적으로는 ‘넘어짐’이지만, 문맥상 기도나 애도의 자세로 엎드려 있던 상태를 가리키므로 ‘엎드린 자리’로 옮겨 자세의 의미를 살렸습니다.
- source_word: τὴν Ἄβραν αὐτῆς
  english_pob_choice: her maid Abra
  chosen_korean: 자기의 여종 아브라
  alternatives_korean:
  - 자기의 시녀 아브라
  - 아브라라는 여종
  lexicon: BDAG
  rationale: Ἄβρα는 고유명사 아브라이며, αὐτῆς는 소유를 나타냅니다. ‘여종’은 여성 하인 관계를 자연스럽게 드러내는 표준어입니다.
- source_word: ἐν ταῖς ἡμέραις τῶν σαββάτων
  english_pob_choice: during the days of her Sabbaths
  chosen_korean: 안식일의 날들에
  alternatives_korean:
  - 안식일 날들에
  - 자기 안식일의 날들에
  lexicon: BDAG
  rationale: 그리스어가 복수형을 유지하므로 단수 ‘안식일에’로 평평하게 만들지 않고, ‘안식일의 날들’이라는 형태를 살려 반복적 준수의 뉘앙스를 남겼습니다.
- source_word: ἐν ταῖς ἑορταῖς αὐτῆς
  english_pob_choice: during her festivals
  chosen_korean: 자기 절기들에
  alternatives_korean:
  - 자기 축제들에
  - 자기 명절들에
  lexicon: BDAG
  rationale: ἑορταί는 종교 달력상의 절기이므로, 현대 한국어에서 문맥을 가장 정확히 전달하는 ‘절기’로 옮겼습니다.
theological_decisions:
- issue: ἀπὸ τῆς πτώσεως의 신체 자세 의미
  chosen_reading: ‘넘어짐’보다 기도·애도 중의 엎드림을 반영한 표현을 채택했습니다.
  alternative_readings:
  - 자기의 fall에서
  - 넘어졌던 자리에서
  rationale: 바로 앞뒤 문맥이 경건한 자세와 이동을 보여 주므로, 우발적 추락보다 예배적·애도적 엎드림의 의미를 유지하는 편이 본문 의도에 더 가깝습니다.
