  text: And they did so. Then Judith went out[a], she and her maid with her; and the men of the city kept watching her until she went down the mountain, until she passed through the valley, and they could no longer see her.
  footnotes:
  - marker: a
    text: Or “ravine” or “mountain pass” for “valley” (Greek αὐλών).
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그들은 그렇게 했습니다. 그러자 유딧은 자기와 함께한 하녀와 함께 나갔습니다. 성읍의 남자들은 그녀가 산을 내려가고, 골짜기를 지나갈 때까지 계속 지켜보다가, 더 이상 그녀를 볼 수 없었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘골짜기’는 그리스어 αὐλών의 넓은 의미를 따른 번역입니다. 문맥상 ‘협곡’ 또는 ‘산길/고갯길’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐποίησαν οὕτως
  english_pob_choice: they did so
  chosen_korean: 그들은 그렇게 했습니다
  alternatives_korean:
  - 그들은 그리하였습니다
  - 그들은 그렇게 하였습니다
  lexicon: LSJ
  rationale: 서술의 확인을 자연스러운 현대 한국어로 옮기되, 원문의 응답·수행 의미를 분명히 유지했습니다.
- source_word: Ἰουδεὶθ ... αὐτὴ καὶ ἡ παιδίσκη αὐτῆς μετʼ αὐτῆς
  english_pob_choice: Judith went out, she and her maid with her
  chosen_korean: 유딧은 자기와 함께한 하녀와 함께 나갔습니다
  alternatives_korean:
  - 유딧은 자기 하녀와 함께 나갔습니다
  - 유딧은 자기와 함께한 시녀와 함께 나갔습니다
  lexicon: LSJ
  rationale: ἡ παιδίσκη를 문맥상 여성 종속 신분을 드러내는 ‘하녀’로 옮기고, μετʼ αὐτῆς의 동행을 중복 없이 반영했습니다.
- source_word: ἀπεσκόπευον
  english_pob_choice: kept watching
  chosen_korean: 계속 지켜보다가
  alternatives_korean:
  - 계속 바라보다가
  - 계속 관찰하다가
  lexicon: LSJ
  rationale: 미완료 과거의 지속성을 살리기 위해 단순 과거보다 진행성을 띠는 표현을 선택했습니다.
- source_word: ἄνδρες τῆς πόλεως
  english_pob_choice: the men of the city
  chosen_korean: 성읍의 남자들은
  alternatives_korean:
  - 그 성읍의 남자들은
  - 도시의 남자들은
  lexicon: LSJ
  rationale: 직역성을 유지하면서도 한국어 문장 흐름에 맞게 간결하게 옮겼습니다.
- source_word: ἕως οὗ κατέβη τὸ ὄρος ... ἕως διῆλθεν τὸν αὐλῶνα
  english_pob_choice: until she went down the mountain, until she passed through the valley
  chosen_korean: 그녀가 산을 내려가고, 골짜기를 지나갈 때까지
  alternatives_korean:
  - 그녀가 산을 내려오고, 골짜기를 통과할 때까지
  - 그녀가 산에서 내려와 골짜리를 지나갈 때까지
  lexicon: LSJ
  rationale: 두 개의 ἕως 절을 반복 구조로 살리면서, αὐλών의 넓은 의미를 ‘골짜기’로 옮겨 본문 흐름을 자연스럽게 했습니다.
- source_word: οὐκ ἔτι ἐθεώρουν αὐτήν
  english_pob_choice: they could no longer see her
  chosen_korean: 더 이상 그녀를 볼 수 없었습니다
  alternatives_korean:
  - 더 이상 그녀를 보지 못했습니다
  - 그녀를 더는 볼 수 없었습니다
  lexicon: LSJ
  rationale: ἐθεώρουν의 시각적 의미와 οὐκ ἔτι의 중단을 함께 반영했습니다.
theological_decisions:
