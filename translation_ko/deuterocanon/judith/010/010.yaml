  chosen_reading: 직접적인 내러티브 보고로 처리하고, 유딧과 하녀의 동행을 장식 없이 간명하게 드러냈습니다.
  alternative_readings:
  - ‘시녀’처럼 더 고전적인 궁정어휘를 쓰는 방식
  - ‘나섰습니다’처럼 보다 의역적인 동사로 바꾸는 방식
  rationale: 본 절은 신학적 해석보다 서술 진행이 핵심이므로, 원문의 관찰·이동 구조를 흐리지 않는 번역이 적절합니다.
  doctrine_reference: 서사문 직역 원칙
