  text: And they did so. Then Judith went out[a], she and her maid with her; and the men of the city kept watching her until she went down the mountain, until she passed through the valley, and they could no longer see her.
  footnotes:
  - marker: a
    text: Or “ravine” or “mountain pass” for “valley” (Greek αὐλών).
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그들은 그렇게 했습니다. 그러자 유딧은 자기 하녀와 함께 나갔습니다. 성읍의 남자들은 유딧이 산을 내려갈 때까지, 또 골짜기[a]를 지나갈 때까지 계속 지켜보았으나, 그 뒤에는 더 이상 유딧을 볼 수 없었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘골짜기’로 옮긴 그리스어 αὐλών은 문맥에 따라 ‘협곡’ 또는 ‘산길/고갯길’을 뜻할 수도 있습니다.
    reason: lexical_alternative
