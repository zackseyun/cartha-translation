  text: And they marveled at her beauty[a], and because of her they marveled at the sons of Israel; and each said to his neighbor, “Who would despise this people, who have such women among them? For it is not good to leave even one man from among them[b], because those who are left would be able to outwit the whole earth.”
  footnotes:
  - marker: a
    text: 'Or, “the Israelites.” Greek: “the sons of Israel.”'
    reason: lexical_alternative
  - marker: b
    text: Or, “those left alive would be able to outwit the whole world.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 그녀의 아름다움에 감탄했고, 그녀 때문에 이스라엘 자손[a]에게도 감탄했습니다. 각 사람은 자기 이웃에게 말했습니다. 「이 백성을 누가 업신여기겠습니까? 그들 가운데 이런 여자들이 있으니 말입니다. 그들 중에서 남자 한 사람이라도 남겨 두는 것은 좋지 않습니다. 남아 있는 자들이 온 땅을 교묘한 꾀로 이길 수 있기 때문입니다.[b]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '또는 “이스라엘 사람들.” 그리스어: “이스라엘의 아들들.”'
    reason: lexical_alternative
  - marker: b
    text: 또는 “남아 있는 자들은 온 세상을 꾀로 이길 수 있기 때문입니다.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τοὺς υἱοὺς Ἰσραήλ
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
