  text: And they marveled at her beauty[a], and because of her they marveled at the sons of Israel; and each said to his neighbor, “Who would despise this people, who have such women among them? For it is not good to leave even one man from among them[b], because those who are left would be able to outwit the whole earth.”
  footnotes:
  - marker: a
    text: 'Or, “the Israelites.” Greek: “the sons of Israel.”'
    reason: lexical_alternative
  - marker: b
    text: Or, “those left alive would be able to outwit the whole world.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그들은 그녀의 아름다움에 놀랐고, 그녀 때문에 이스라엘 자손을 놀라워했습니다. 그리고 각 사람이 자기 이웃에게 말했습니다. 「이 백성을 누가 업신여기겠습니까? 그들 가운데 그런 여자들이 있으니 말입니다. 참으로 그들 중에서 남자 하나라도 남겨 두는 것은 좋지 않습니다. 남아 있는 자들은 온 땅을 능히 꾀로 이길 수 있기 때문입니다.」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '또는 “이스라엘 사람들.” 그리스어: “이스라엘의 아들들.”'
    reason: lexical_alternative
  - marker: b
    text: 또는 “남아 있는 자들은 온 세상을 꾀로 이길 수 있기 때문입니다.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τοὺς υἱοὺς Ἰσραήλ
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘의 아들들
  lexicon: LSJ
  rationale: 그리스어의 남성형 집합 표현을 살리면서도 한국어에서 자연스럽고 성경적인 집합명사로 옮겼습니다.
- source_word: ἐθαύμαζον
  english_pob_choice: they marveled
  chosen_korean: 놀랐고 / 놀라워했습니다
  alternatives_korean:
  - 경탄했고
  - 감탄했고
  lexicon: BDAG
  rationale: 반복된 미완료 시제의 놀라움과 감탄의 뉘앙스를 살리기 위해 같은 동사를 두 번 반복해 표현했습니다.
- source_word: καταφρονήσει
  english_pob_choice: would despise
  chosen_korean: 업신여기겠습니까
  alternatives_korean:
  - 멸시하겠습니까
  - 하찮게 여기겠습니까
  lexicon: BDAG
  rationale: καταφρονέω의 경멸·경시의 뜻을 한국어에서 가장 직접적으로 드러내는 표현으로 옮겼습니다.
- source_word: δυνήσονται κατασοφίσασθαι
  english_pob_choice: would be able to outwit
  chosen_korean: 능히 꾀로 이길 수 있기 때문입니다
  alternatives_korean:
  - 능히 속일 수 있기 때문입니다
  - 능히 지혜로 이길 수 있기 때문입니다
  lexicon: LSJ
  rationale: κατασοφίζομαι의 ‘교묘하게 이기다/꾀로 넘어뜨리다’는 뜻을 살리면서, 전투적 맥락에 맞게 자연스럽게 표현했습니다.
theological_decisions:
- issue: 이스라엘을 가리키는 남성형 집합 표현의 처리
  chosen_reading: 이스라엘 자손
  alternative_readings:
  - 이스라엘 사람들
  - 이스라엘 백성
  rationale: 원문의 남성형 집합 표현을 평탄화하지 않고, 한국어 성경에서 널리 쓰이는 전통적이면서도 직역에 가까운 표현을 유지했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
- issue: 남성 단수 ἄνδρα ἕνα의 성별 보존
  chosen_reading: 남자 하나라도
  alternative_readings:
  - 사람 하나라도
  - 한 사람이라도
  rationale: 본문은 전쟁 상황에서 남성 생존자를 가리키는 말이므로, 그리스어의 성별 표지를 흐리지 않도록 남성형을 유지했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
