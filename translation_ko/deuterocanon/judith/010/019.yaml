  - 이스라엘의 아들들
  lexicon: LSJ
  rationale: 그리스어의 남성형 집합 표현을 살리면서도 한국어에서 자연스럽고 성경적인 집합명사로 옮겼습니다.
- source_word: ἐθαύμαζον
  english_pob_choice: they marveled
  chosen_korean: 놀랐고 / 놀라워했습니다
  alternatives_korean:
  - 경탄했고
  - 감탄했고
  lexicon: BDAG
  rationale: 반복된 미완료 시제의 놀라움과 감탄의 뉘앙스를 살리기 위해 같은 동사를 두 번 반복해 표현했습니다.
- source_word: καταφρονήσει
  english_pob_choice: would despise
  chosen_korean: 업신여기겠습니까
  alternatives_korean:
  - 멸시하겠습니까
  - 하찮게 여기겠습니까
  lexicon: BDAG
  rationale: καταφρονέω의 경멸·경시의 뜻을 한국어에서 가장 직접적으로 드러내는 표현으로 옮겼습니다.
- source_word: δυνήσονται κατασοφίσασθαι
  english_pob_choice: would be able to outwit
  chosen_korean: 능히 꾀로 이길 수 있기 때문입니다
  alternatives_korean:
  - 능히 속일 수 있기 때문입니다
  - 능히 지혜로 이길 수 있기 때문입니다
  lexicon: LSJ
  rationale: κατασοφίζομαι의 ‘교묘하게 이기다/꾀로 넘어뜨리다’는 뜻을 살리면서, 전투적 맥락에 맞게 자연스럽게 표현했습니다.
