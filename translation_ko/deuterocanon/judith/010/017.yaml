translation:
  language: ko
  text: 그들은 그들 가운데에서 백 명의 남자를 선발하여, 그녀와 그녀의 하녀를 호위하게 하고, 그들을 오로페르네스의 천막으로 데려갔습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπέλεξαν ἐξ αὐτῶν
  english_pob_choice: selected one hundred men from among them
  chosen_korean: 그들 가운데에서 백 명의 남자를 선발하여
  alternatives_korean:
  - 그들 중에서 백 명의 남자를 골라
  - 그들 가운데 백 명의 남자를 택하여
  lexicon: LSJ
  rationale: ἀπέλεξαν은 단순히 고르는 것이 아니라 집단에서 가려 뽑는 뜻이므로, partitive sense를 드러내는 ‘그들 가운데에서’와 ‘선발하다’를 함께 살렸습니다.
- source_word: παρέζευξαν
  english_pob_choice: escorted
  chosen_korean: 호위하게 하고
  alternatives_korean:
  - 동행하게 하고
  - 호송하게 하고
  - 에스코트하게 하고
  lexicon: LSJ
  rationale: 문맥상 Judith와 그녀의 하녀를 보호·동반하는 공식적 수행을 가리키므로, 자연스러운 현대 한국어로는 ‘호위하다’가 가장 가까우며, 단순 동행보다 기능이 분명합니다.
- source_word: τῇ ἄβρᾳ αὐτῆς
  english_pob_choice: her maid
  chosen_korean: 그녀의 하녀
  alternatives_korean:
  - 그녀의 여종
  - 그녀의 시녀
  - 그녀의 여자종
  lexicon: LSJ
  rationale: ἄβρα는 Judith 문맥에서 여성 종속 하인을 가리키므로, 현대 한국어에서 가장 직관적인 ‘하녀’를 택하되 신분 종속성을 유지했습니다.
- source_word: σκηνὴν
  english_pob_choice: tent
  chosen_korean: 천막
  alternatives_korean:
  - 텐트
  - 장막
  - 막사
  lexicon: LSJ
  rationale: 군사적·야영용 거처를 가리키는 일반어로 ‘천막’이 문맥에 잘 맞고, ‘장막’보다 덜 의례적이며 현대어로도 자연스럽습니다.
