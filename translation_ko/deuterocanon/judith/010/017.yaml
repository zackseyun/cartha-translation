  source_fidelity: 그리스어의 선택, 호위, 인도라는 사건 순서는 대체로 충실합니다. 그러나 마지막 목적어 αὐτάς는 여성 두 사람을 명시하므로, 한국어의 ‘그들을’은 앞의 백 명까지 가리킬 수 있어 해소하는 편이 안전합니다.
  naturalness: ‘호위하게 하고’는 자연스럽지만, ‘그들을’은 한국어에서 지시 대상이 모호합니다. ‘그 두 여자를’으로 명시하면 현대 서술문으로도 훨씬 분명합니다.
  terminology: ἄβρα를 ‘하녀’, σκηνή를 ‘천막’으로 옮긴 것은 적절합니다. Ὀλοφέρνης의 통용 한국어 음역은 ‘홀로페르네스’이므로, ‘오로페르네스’는 수정하는 것이 좋습니다.
  issues:
