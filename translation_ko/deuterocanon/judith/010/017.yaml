    rationale: 원문의 αὐτάς는 유딧과 그녀의 하녀, 즉 여성 두 사람만을 가리킵니다. 한국어 ‘그들’은 직전의 ‘백 명의 남자’까지 포함하는 것으로 읽힐 수 있습니다.
  - severity: medium
