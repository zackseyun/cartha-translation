base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/015/004.yaml
  text: And Uzziah sent men to Bethomesthaim and Choba and Chola, and to all the territory of Israel, to report what had happened, and that all should rush out against the enemies for their destruction.
  footnotes:
  - marker: a
    text: Greek literally, 'that all might be poured out against the enemies,' an idiom for people streaming out en masse to attack.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 오지야는 베이토마스타임과 코바와 코라, 그리고 이스라엘의 온 경계에 사람들을 보내어, 일어난 일을 알리게 하고, 또 모든 사람이 적들에게 쏟아져 나가 그들을 멸하게 하였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὀζίας
  english_pob_choice: Uzziah
  chosen_korean: 오지야
  alternatives_korean:
  - 웃시야
  - 우지야
  lexicon: 고유명사 음역
  rationale: 그리스어 형태 Ὀζίας를 따라 현대 표기법에 맞게 음역했고, 통용되는 성경식 형태와도 크게 어긋나지 않게 했습니다.
- source_word: Βαιτομασθαΐμ
  english_pob_choice: Bethomesthaim
  chosen_korean: 베이토마스타임
  alternatives_korean:
  - 베토메스타임
  - 벳오메스타임
  lexicon: 고유명사 음역
  rationale: 헬라어 지명형을 직접 옮겨, 확정된 관용형이 불분명한 경우에도 원형에 가까운 소리를 유지했습니다.
- source_word: πᾶν ὅριον Ἰσραήλ
  english_pob_choice: all the territory of Israel
  chosen_korean: 이스라엘의 온 경계
  alternatives_korean:
  - 이스라엘의 모든 지역
  - 이스라엘의 모든 영토
  lexicon: BDAG
  rationale: ὅριον은 여기서 단순한 경계선보다 영토 전체를 가리키므로, ‘온 경계’로 넓은 범위를 살리되 원문의 공간적 이미지를 보존했습니다.
- source_word: τοὺς ἀπαγγέλλοντας
  english_pob_choice: to report / messengers
  chosen_korean: 사람들을 보내어, ... 알리게 하고
  alternatives_korean:
  - 전령들을 보내어
  - 보고하는 자들을 보내어
  lexicon: BDAG
  rationale: 분사구가 사람들의 신분과 임무를 함께 나타내므로, 한국어에서는 자연스럽게 ‘사람들을 보내어 ... 알리게’로 풀어 전달했습니다.
- source_word: ἵνα πάντες ἐκχυθῶσιν
  english_pob_choice: that all should rush out
  chosen_korean: 모든 사람이 ... 쏟아져 나가
  alternatives_korean:
  - 모든 사람이 ... 달려나가
  - 모든 사람이 ... 물밀듯 나가
  lexicon: LSJ
  rationale: 직역하면 ‘쏟아지다’이지만, 군사적 문맥에서는 대규모로 몰려 나가는 관용적 표현이므로 한국어에서도 그 역동성을 살렸습니다.
- source_word: εἰς τὴν ἀναίρεσιν αὐτῶν
  english_pob_choice: for their destruction
  chosen_korean: 그들을 멸하게
  alternatives_korean:
  - 그들을 죽이게
  - 그들을 멸망시키게
  lexicon: BDAG
  rationale: ἀναίρεσις는 이 문맥에서 적의 제거·파괴를 뜻하므로, 완곡하게 약화하지 않고 목적절로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 군사적 폭력 목적 표현
  chosen_reading: ‘그들을 멸하게’로 옮겨, 본문의 적대적·파괴적 목적을 그대로 드러냈습니다.
  alternative_readings:
  - ‘그들을 죽이게’
  - ‘그들을 없애게’
  rationale: 원문은 적에 대한 실제적인 제거 의도를 숨기지 않으므로, 한국어도 그 강도를 유지하되 과잉 설명은 피했습니다.
  doctrine_reference: 원어 우선 원칙; 본문이 말하는 폭력성을 완화하거나 증폭하지 않음
