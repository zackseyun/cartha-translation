  text: 이스라엘의 모든 여인이[a] 그 여인을 보려고 함께 달려왔고, 그들은 그 여인을 축복했으며, 그 여인을 위하여 자기들 가운데에서 춤을 추었습니다. 그 여인은 손에 티르소스들을[b] 들고, 자기와 함께 있던 여인들에게 그것들을 주었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 ‘모든 이스라엘 여인’이라는 집합적 단수 표현을 사용합니다.
    reason: alternative_reading
  - marker: b
    text: ‘티르소스’는 축제 행렬과 관련된 의례용 막대 또는 지팡이입니다.
    reason: cultural_note
