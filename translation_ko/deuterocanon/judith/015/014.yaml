  text: 이스라엘의 모든 여인이 그녀를 보려고 함께 달려와 그녀를 축복하고, 그들 가운데서 춤을 그녀를 위해 만들었습니다. 그리고 그녀는 손에 쓰르시를 들고, 자기와 함께한 여자들에게 그것을 주었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이스라엘의 모든 여인’은 그리스어의 집합적 단수 표현을 자연스럽게 풀어 쓴 것입니다.
    reason: alternative_reading
  - marker: b
    text: ‘쓰르시’는 축제 행렬에서 쓰이는 의례용 막대 또는 지팡이를 가리킵니다.
    reason: cultural_note
