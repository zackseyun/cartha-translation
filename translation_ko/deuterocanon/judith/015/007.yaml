  source_fidelity: ‘남은 자들’은 중성 복수형 τῶν λοιπῶν을 사람으로 한정하므로, 사람과 사물을 아우를 수 있는 원문의 지시 범위를 보존하도록 ‘남은 것들’로 고쳐야 합니다. 또한 마지막 ‘그 수’는 전리품의 양을 가리키므로 ‘전리품이 매우 많았기 때문입니다’로 명시하는 편이 원문 πλῆθος πολὺ σφόδρα에 더 충실합니다.
