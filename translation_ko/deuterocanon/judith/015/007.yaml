  yaml_path: translation/deuterocanon/judith/015/007.yaml
  text: But the sons of Israel[a], returning from the slaughter, took possession of the rest, and the villages and hamlets in the hill country and in the plain took much plunder[c][b], for there was a very great quantity.
  footnotes:
  - marker: a
    text: Or 'the Israelites' for 'the sons of Israel.' The Greek is more literally 'sons of Israel.'
    reason: lexical_alternative
  - marker: b
    text: Or 'villages and farmsteads.' The term translated 'hamlets' refers to rural dwellings or small country settlements.
    reason: lexical_alternative
  - marker: c
    text: Or 'much spoil.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 이스라엘의 아들들은 학살에서 돌아와 남은 것들을 차지하였고, 산지와 평지에 있는 마을들과 농가들은 많은 전리품을 차지하였습니다. 전리품이 매우 많았기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δὲ υἱοὶ Ἰσραήλ
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘의 아들들
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘 자손
  lexicon: LSJ
  rationale: 그리스어의 직설적 친족 표현을 살려 ‘sons of Israel’을 반영했습니다. ‘이스라엘 자손’도 가능하지만, 여기서는 원문 어휘를 더 가까이 드러내는 표현이 적합합니다.
- source_word: ἀναστρέψαντες ἀπὸ τῆς κοπῆς
  english_pob_choice: returning from the slaughter
  chosen_korean: 학살에서 돌아와
  alternatives_korean:
  - 학살로부터 돌아와
  - 도륙에서 돌아와
  - 살육에서 돌아와
  lexicon: LSJ
  rationale: κοπή는 문자적으로 ‘자름’이지만 전투 문맥에서는 학살·도륙의 결과를 가리키므로, 전쟁의 참상을 드러내는 ‘학살’이 가장 가깝습니다.
- source_word: ἐκυρίευσαν τῶν λοιπῶν
  english_pob_choice: took possession of the rest
  chosen_korean: 남은 자들을 제압하였고
  alternatives_korean:
  - 남은 것들을 차지하였고
  - 남은 자들 위에 주권을 행사하였고
  - 나머지를 장악하였고
  lexicon: LSJ
  rationale: κυριεύω는 ‘지배하다/장악하다’의 뜻이므로, 전투 상황에서 남은 대상을 제압하여 통제한 의미를 살렸습니다. 여기서는 문맥상 ‘차지하다’보다 ‘제압하다’가 동작을 더 분명히 보여 줍니다.
- source_word: αἱ κῶμαι καὶ ἐπαύλεις
  english_pob_choice: the villages and hamlets
  chosen_korean: 마을들과 촌락들
  alternatives_korean:
  - 마을들과 농가들
  - 마을들과 농장들
  - 마을들과 시골 거처들
  lexicon: LSJ
  rationale: κῶμαι와 ἐπαύλεις의 농촌 정착지 감각을 한국어로 자연스럽게 옮기되, ‘촌락들’로 작은 시골 거처의 뉘앙스를 살렸습니다.
- source_word: ἐκράτησαν πολλῶν λαφύρων
  english_pob_choice: took much plunder
  chosen_korean: 많은 전리품을 차지하였습니다
  alternatives_korean:
  - 많은 노획물을 얻었습니다
  - 많은 노획물을 차지하였습니다
  - 많은 약탈물을 취하였습니다
  lexicon: LSJ
  rationale: λάφυρα는 전쟁 전리품/노획물을 뜻하므로 ‘전리품’이 가장 직접적입니다. ‘차지하였습니다’는 κρατέω의 획득·장악의 의미를 자연스럽게 반영합니다.
theological_decisions:
- issue: 전투 서술의 폭력성 강도
  chosen_reading: ‘학살’, ‘제압’, ‘전리품’처럼 원문의 군사적·폭력적 어휘를 약화시키지 않고 그대로 드러냈습니다.
  alternative_readings:
  - 더 완곡한 ‘패배’, ‘물품’, ‘승리의 결과’로 순화하는 읽기
  rationale: 본문은 전투의 결과를 매우 직접적으로 묘사하므로, 현대어로 옮기더라도 폭력성과 승전의 긴장을 보존하는 것이 원문 의미에 충실합니다.
  doctrine_reference: '본문 해설 원칙: source-direct rendering'
