  yaml_path: translation/deuterocanon/judith/015/016.yaml
  text: And Judith kept bringing forth this confession in all Israel[a], and all the people echoed this praise; and Judith said[b],
  footnotes:
  - marker: a
    text: Or 'thanksgiving' or 'praise' for 'confession' (ἐξομολόγησιν); the Greek term can denote public acknowledgment or thanksgiving in biblical usage.
    reason: lexical_alternative
  - marker: b
    text: 'The verb rendered ''echoed'' suggests a responsive or antiphonal reply: ''responded with this praise'' is also possible.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 유디트는 온 이스라엘 가운데서 이 고백을 계속 전하였고[a], 모든 백성은 이 찬양에 응답하였습니다. 그리고 유디트가 말하였습니다[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘감사’, ‘찬양’으로도 옮길 수 있습니다. ἐξομολόγησιν은 성경 그리스어에서 공개적 인정이나 감사의 뜻으로도 쓰입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘응답하였다’는 반응적·대응적 발화를 나타냅니다. ‘되받아 말하였다’, ‘화답하였다’로도 옮길 수 있습니다.
    reason: lexical_alternative
