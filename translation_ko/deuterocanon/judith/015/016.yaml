  - 둘 다 ‘감사’로 통일
  rationale: 그리스어는 인접 절에서 서로 다른 명사를 사용하므로, 이를 합쳐 버리면 수사적 대비가 사라집니다. 본문은 하나님에 대한 공개적 인정과 백성의 응답 찬양을 함께 보여 줍니다.
