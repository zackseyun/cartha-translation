  lexicon: LSJ
  rationale: 여기서는 백성이 보인 응답의 성격이 분명한 찬양이므로, 한국어 예배 문맥에서 자연스러운 ‘찬양’으로 옮겼습니다.
theological_decisions:
- issue: ἐξομολόγησιν과 αἴνεσιν의 관계를 어떻게 살릴 것인가
  chosen_reading: ‘고백’과 ‘찬양’을 구별해 병기하지 않고 문장 안에서 각각의 기능을 유지했습니다.
  alternative_readings:
  - 둘 다 ‘찬양’으로 통일
  - 둘 다 ‘감사’로 통일
  rationale: 그리스어는 인접 절에서 서로 다른 명사를 사용하므로, 이를 합쳐 버리면 수사적 대비가 사라집니다. 본문은 하나님에 대한 공개적 인정과 백성의 응답 찬양을 함께 보여 줍니다.
