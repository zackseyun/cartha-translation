theological_decisions:
- issue: ἐξομολόγησιν과 αἴνεσιν의 관계를 어떻게 살릴 것인가
  chosen_reading: ‘고백’과 ‘찬양’을 구별해 병기하지 않고 문장 안에서 각각의 기능을 유지했습니다.
  alternative_readings:
