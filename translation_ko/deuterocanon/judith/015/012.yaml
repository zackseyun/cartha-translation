  source_fidelity: 그리스어 문장의 모든 핵심 요소를 충실히 옮겼습니다. ‘온 백성’은 πᾶς ὁ λαός, ‘진’은 군사적 맥락의 τὴν παρεμβολήν, ‘삼십 일 동안’은 ἐφʼ ἡμέρας τριάκοντα에 정확히 대응합니다. ‘약탈하였습니다’는 ἐλαφύρευσεν의 전쟁 전리품 획득이라는 의미를 자연스럽게 보존합니다.
  naturalness: ‘그리고 온 백성이 진을 삼십 일 동안 약탈하였습니다’는 현대 표준 한국어의 정중한 문체로 자연스럽고 간결합니다. ‘진을 약탈하다’는 군사 서술에서 무리 없는 결합입니다.
  terminology: ‘진’과 ‘약탈’은 성경적 군사 맥락에 적합하며, 불필요하게 집단을 군인으로 한정하거나 교리적으로 해석하지 않습니다. 각주는 ‘전리품’의 어휘적 뉘앙스를 적절히 설명합니다.
