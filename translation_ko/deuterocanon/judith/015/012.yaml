translation:
  language: ko
  text: 그리고 온 백성이 진을 삼십 일 동안 약탈하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘삼십 일 동안 그 진을 전리품으로 삼았다.’ 그리스어 동사는 전쟁 전리품을 취하는 뜻을 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλαφύρευσεν
  english_pob_choice: plundered
  chosen_korean: 약탈하였습니다
  alternatives_korean:
  - 노략질하였습니다
  - 전리품으로 취하였습니다
  lexicon: LSJ
  rationale: 전쟁에서 패한 적의 소유를 빼앗는 뜻을 살리기 위해 ‘약탈하다’를 택했습니다. ‘전리품으로 취하다’는 의미는 더 분명하지만 문장이 길어집니다.
- source_word: πᾶς ὁ λαός
  english_pob_choice: all the people
  chosen_korean: 온 백성이
  alternatives_korean:
  - 모든 백성이
  - 백성 전체가
  lexicon: LSJ
  rationale: 전체 집단을 가리키는 표현이므로 자연스러운 합쇼체 문맥에 맞게 ‘온 백성’으로 옮겼습니다.
- source_word: τὴν παρεμβολήν
  english_pob_choice: the camp
  chosen_korean: 진을
  alternatives_korean:
  - 진영을
  - 야영지를
  lexicon: LSJ
  rationale: 군사적 맥락의 παρεμβολή를 한국어 성경 문체에서 익숙한 ‘진’으로 옮겨, 적의 야영 상태를 간결하게 드러냈습니다.
- source_word: ἐφʼ ἡμέρας τριάκοντα
  english_pob_choice: for thirty days
  chosen_korean: 삼십 일 동안
  alternatives_korean:
  - 서른 날 동안
  - 삼십일 동안
  lexicon: LSJ
  rationale: 지속 기간을 자연스럽게 나타내는 현대 한국어 표현으로 옮겼습니다.
theological_decisions:
- issue: 전리품을 뜻하는 동사 뉘앙스
  chosen_reading: 이 동사는 단순한 ‘점유’가 아니라 전쟁 승리 후 적의 물자를 빼앗는 행위를 가리키므로, ‘약탈하였습니다’로 전투 맥락을 분명히 했습니다.
  alternative_readings:
  - 점령하였습니다
  - 가져갔습니다
  rationale: 영어 POB도 ‘plundered’와 각주에서 전리품(seizure of war booty) 의미를 밝혔으므로, 한국어에서도 그 군사적·약탈적 의미를 약화하지 않아야 합니다.
  doctrine_reference: 본문 의미 보존 원칙
- issue: ‘온 백성’의 범위
  chosen_reading: 본문은 특정 계층이 아니라 공동체 전체의 행동을 말하므로, 주어를 확대·축소하지 않고 ‘온 백성’으로 유지했습니다.
  alternative_readings:
  - 모든 군인
  - 백성 전체
  rationale: 그리스어 πᾶς ὁ λαός의 직접 대응을 유지해 서술 범위를 임의로 군대로 한정하지 않았습니다.
  doctrine_reference: 본문 의미 보존 원칙
