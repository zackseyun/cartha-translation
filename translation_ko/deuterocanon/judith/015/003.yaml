translation:
  language: ko
  text: 그리고 베툴리아 주위의 산지에 진을 친 자들은 도망쳤습니다[b]. 그러자 이스라엘의 아들들[a], 곧 전사인 모든 남자가 그들을 향해 쏟아져 나갔습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이스라엘 사람들’; 그리스어는 ‘이스라엘의 아들들’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘도망쳤습니다’; 문자적으로는 ‘도주로 돌아섰습니다’입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그들에게 몰려나갔습니다’; 문자적으로는 ‘그들에게 쏟아져 나갔습니다’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ παρεμβεβληκότες
  english_pob_choice: those encamped
  chosen_korean: 진을 친 자들
  alternatives_korean:
  - 캠프한 자들
  - 주둔한 자들
  lexicon: BDAG
  rationale: 전투 상황의 수동적 주둔이 아니라 이미 진을 친 집단을 가리키므로, 자연스럽고 군사적 뉘앙스를 살린 ‘진을 친 자들’로 옮겼습니다.
- source_word: ἐν τῇ ὀρεινῇ
  english_pob_choice: in the hill country
  chosen_korean: 산지에
  alternatives_korean:
  - 고지대에
  - 산악 지역에
  lexicon: LSJ
  rationale: ὀρεινή는 단일 산이 아니라 산지·고지대를 뜻하므로, 간결한 표준어 표현인 ‘산지’가 가장 직접적입니다.
- source_word: οἱ υἱοὶ Ἰσραήλ
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘의 아들들
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘 백성
  lexicon: LSJ
  rationale: 원문의 친족·언약적 표현을 평준화하지 않고 그대로 살리기 위해 ‘이스라엘의 아들들’로 옮겼습니다.
- source_word: πᾶς ἀνὴρ πολεμιστής
  english_pob_choice: every man who was a warrior
  chosen_korean: 전쟁하는 모든 남자
  alternatives_korean:
  - 모든 전사
  - 싸우는 모든 사람
  lexicon: BDAG
  rationale: ἀνήρ의 남성 표지와 πολεμιστής의 전사 의미를 함께 반영하기 위해, 직역적이면서도 한국어로 읽히는 ‘전쟁하는 모든 남자’로 처리했습니다.
- source_word: ἐξέχυθησαν ἐπʼ αὐτούς
  english_pob_choice: poured out against them
  chosen_korean: 그들을 향해 쏟아져 나갔습니다
  alternatives_korean:
  - 그들에게 몰려나갔습니다
  - 그들을 향해 쏟아졌습니다
  lexicon: BDAG
  rationale: ‘쏟아지다’는 원문의 유출·분출 이미지를 보존하고, ‘향해’는 ἐπʼ αὐτούς의 공격적 방향성을 드러냅니다.
theological_decisions:
- issue: 성별이 드러나는 군사·민족 표현을 중립화할지 여부
  chosen_reading: ‘이스라엘의 아들들, 전쟁하는 모든 남자’처럼 원문의 성별 표지를 유지했습니다.
  alternative_readings:
  - 이스라엘 사람들, 모든 전사
  - 이스라엘 백성, 모든 전투원
  rationale: 원문은 υἱοὶ와 ἀνήρ를 통해 명시적으로 남성적·전통적 표현을 사용하므로, 이를 중립화하면 स्रोत의 형식을 약화시킵니다. 이 절에서는 그런 평준화보다 원문의 형태를 보존하는 편이 더 충실합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
