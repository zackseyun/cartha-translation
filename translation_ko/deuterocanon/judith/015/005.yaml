base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/015/005.yaml
  text: But when the sons of Israel heard[a], they all together fell upon them and kept striking them down as far as Choba. Likewise, those from Jerusalem and from all the hill country also arrived, for the things that had happened in the camp of their enemies had been reported to them; and those in Gilead and those in Galilee outflanked them with a great slaughter[c][b], until they had passed Damascus and its borders.
  footnotes:
  - marker: a
    text: Or 'the Israelites.' The Greek reads literally 'the sons of Israel.'
    reason: lexical_alternative
  - marker: b
    text: '''Outflanked them'' renders a military verb that can also suggest getting beyond them or cutting them off during pursuit.'
    reason: lexical_alternative
  - marker: c
    text: Or 'with a severe blow' / 'with a great stroke.' In this battle context the phrase likely refers to heavy slaughter.
    reason: lexical_alternative
translation:
  language: ko
  text: 이스라엘 자손이 이것을 듣자, 모두 한마음으로 그들에게 달려들어 카보아에 이를 때까지 그들을 쳐 죽였습니다. 또한 예루살렘에서 온 사람들과 온 산지의 사람들도 도착했는데, 그들의 적진에서 일어난 일들이 그들에게 알려졌기 때문입니다. 또 길르앗에 있는 사람들과 갈릴리에 있는 사람들은 큰 살육으로 그들을 우회하여 쳐서, 그들이 다마스쿠스와 그 경계들을 지나갈 때까지 그렇게 하였습니다.[a][b][c]
  philosophy: formal
  footnotes:
  - marker: a
    text: ‘이스라엘 자손’은 그리스어의 문자적 표현을 따른 것입니다.
    reason: source_note
  - marker: b
    text: ‘우회하여’는 추격 중 적을 돌아서거나 차단하는 군사 동사를 옮긴 것입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘큰 살육’은 전투 문맥에서 ‘큰 타격/큰 공격’보다 결과를 더 분명히 드러냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ υἱοὶ Ἰσραήλ
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘의 아들들
  - 이스라엘 사람들
  lexicon: LSJ
  rationale: 그리스어의 혈연적 표현을 살리되, 한국어 성경에서 널리 통용되는 ‘자손’으로 자연스럽게 옮겼습니다.
- source_word: ὁμοθυμαδόν
  english_pob_choice: all together
  chosen_korean: 모두 한마음으로
  alternatives_korean:
  - 다 함께
  - 일제히
  lexicon: BDAG
  rationale: 단순한 동시성을 넘어 공동의 의지와 결집을 드러내는 뜻을 살리기 위해 ‘한마음으로’로 옮겼습니다.
- source_word: ἐπέπεσον ἐπʼ αὐτούς / ἔκοπτον αὐτούς
  english_pob_choice: fell upon them / kept striking them down
  chosen_korean: 그들에게 달려들어 ... 쳐 죽였습니다
  alternatives_korean:
  - 그들에게 덮쳐 ... 계속 쳐서 쓰러뜨렸습니다
  - 그들을 공격하여 ... 계속 쳐부수었습니다
  lexicon: LSJ
  rationale: 전투적 관용구의 급박함과 반복 동작을 살리기 위해 ‘달려들어’와 ‘쳐 죽였습니다’를 결합했습니다.
- source_word: ὑπερεκέρασαν αὐτούς
  english_pob_choice: outflanked them
  chosen_korean: 그들을 우회하여 쳐서
  alternatives_korean:
  - 그들을 포위하여
  - 그들보다 앞질러
  lexicon: LSJ
  rationale: 군사적 추격 문맥에서 단순한 ‘이기다’보다 전술적으로 돌아서서 차단하는 뉘앙스를 살렸습니다.
- source_word: πληγῇ μεγάλῃ
  english_pob_choice: with a great slaughter
  chosen_korean: 큰 살육으로
  alternatives_korean:
  - 큰 타격으로
  - 심한 타격으로
  lexicon: LSJ
  rationale: 이 문맥에서는 ‘πληγή’의 결과가 단순한 타격이 아니라 많은 사람의 죽음이므로 ‘살육’이 가장 분명합니다.
theological_decisions:
- issue: 전투 서술의 폭력적 어휘 강도
  chosen_reading: 원문의 군사적·살육적 강도를 약화시키지 않고 그대로 드러냈습니다.
  alternative_readings:
  - 더 순화된 ‘공격하다/물리치다’로 완화하는 번역
  - ‘큰 타격’처럼 결과를 추상화하는 번역
  rationale: 이 절은 승전 보고가 아니라 전투의 실재를 말하므로, 원문의 폭력성과 승리의 무게를 지우지 않는 것이 본문 의미에 더 충실합니다.
  doctrine_reference: 본문 내 서술 강도 보존 원칙
- issue: 지명 종결 범위(다마스쿠스와 그 경계들)
  chosen_reading: ‘다마스쿠스와 그 경계들을 지나갈 때까지’로 범위를 유지했습니다.
  alternative_readings:
  - ‘다마스쿠스와 그 경계까지’
  - ‘다마스쿠스를 넘어 그 영토까지’
  rationale: ἕως οὗ παρῆλθον은 단순 도달이 아니라 통과·초과를 뜻하므로, 추격의 범위를 분명히 드러냈습니다.
  doctrine_reference: 지리·서사 정확성
