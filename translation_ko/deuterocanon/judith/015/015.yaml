base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/015/015.yaml
  text: And they crowned her with an olive wreath[a], she and the women with her. And she went before all the people in the dance, leading all the women, and every man of Israel followed, armed[b], with wreaths and with hymns in their mouths.
  footnotes:
  - marker: a
    text: Literally, 'they crowned the olive on her'; the Greek likely means they adorned her with an olive wreath, a festive or victory garland.
    reason: lexical_alternative
  - marker: b
    text: Or 'with dancing' / 'in a dance procession'; the Greek χορεία can refer to dancing as an activity or to an organized choral dance.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그들은 그녀와 함께한 여자들과 함께 그에게 올리브 화환을 씌웠습니다. 그녀는 모든 백성 앞에 춤 가운데서 나아가며 모든 여자들을 이끌었고, 이스라엘의 모든 남자는 머리에 화환을 쓰고 입에는 찬송을 담은 채 무장한 모습으로 뒤따랐습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그들에게 올리브를 씌웠다’에 가깝지만, 이 문맥에서는 축제용 올리브 화환을 뜻하는 것으로 이해하는 것이 자연스럽습니다.
    reason: lexical_alternative
  - marker: b
    text: χορεία는 ‘춤’이나 ‘춤 행렬’ 모두를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐστεφανώσαντο τὴν ἐλαίαν
  english_pob_choice: they crowned her with an olive wreath
  chosen_korean: 그에게 올리브 화환을 씌웠습니다
  alternatives_korean:
  - 그녀에게 올리브 관을 씌웠습니다
  - 그녀에게 올리브 월계관을 씌웠습니다
  - 그녀를 올리브로 관을 씌웠습니다
  lexicon: LSJ
  rationale: στεφανόω는 ‘관을 씌우다/화환을 걸다’의 뜻이고, ἐλαία는 이 축제 문맥에서 올리브 화환을 가리키므로, 자연스럽고 문맥에 맞게 ‘올리브 화환을 씌우다’로 옮겼습니다.
- source_word: ἐν χορείᾳ
  english_pob_choice: in the dance
  chosen_korean: 춤 가운데서
  alternatives_korean:
  - 춤에서
  - 춤으로
  - 무용 행진 가운데서
  lexicon: LSJ
  rationale: χορεία는 단순한 동작으로서의 춤과 행렬적 합창춤의 뉘앙스를 함께 지니므로, 너무 기술적으로 좁히지 않으면서도 장면을 살리는 ‘춤 가운데서’로 옮겼습니다.
- source_word: ἐνωπλισμένοι
  english_pob_choice: armed
  chosen_korean: 무장한 모습으로
  alternatives_korean:
  - 무장한 채
  - 무기를 갖춘 채
  - 전투 태세로
  lexicon: LSJ
  rationale: 형용사적 분사로서 ‘무장한’의 상태를 나타내므로, 뒤따르는 행렬의 모습을 분명히 드러내는 ‘무장한 모습으로’가 가장 자연스럽습니다.
- source_word: ὕμνων ἐν τῷ στόματι αὐτῶν
  english_pob_choice: with hymns in their mouths
  chosen_korean: 입에는 찬송을 담은 채
  alternatives_korean:
  - 입에는 찬송을 품은 채
  - 입에는 찬송을 가진 채
  - 입에 찬송을 두고
  lexicon: LSJ
  rationale: 원문은 매우 구체적인 표현으로 ‘입 안에 찬송이 있다’는 이미지를 주므로, 이를 살리되 한국어로 어색하지 않게 ‘입에는 찬송을 담은 채’로 옮겼습니다.
theological_decisions:
- issue: 공적 행렬의 묘사에서 여성-남성의 역할 구분
  chosen_reading: 그녀가 모든 여자들을 이끌고, 이스라엘의 모든 남자가 뒤따르는 행렬적 구조를 그대로 살렸습니다.
  alternative_readings:
  - 보다 평탄하게 ‘사람들이 모두 따랐다’로 완화할 수 있음
  rationale: 원문은 Judith가 여성들을 선도하고 남자들이 뒤따르는 질서를 분명히 드러내므로, 이 구조를 유지해 공동체적 승리 행렬의 긴장을 보존했습니다.
  doctrine_reference: 서사 문맥 보존
