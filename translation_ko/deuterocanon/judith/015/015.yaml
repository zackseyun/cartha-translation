revisions:
- from: 그리고 그들은 그녀와 함께한 여자들과 함께 그에게 올리브 화환을 씌웠습니다. 그녀는 모든 백성 앞에 춤 가운데서 나아가며 모든 여자들을 이끌었고, 이스라엘의 모든 남자는 머리에 화환을 쓰고 입에는 찬송을 담은 채 무장한 모습으로 뒤따랐습니다.[a][b]
  to: 그리고 그들은 그녀와 그녀와 함께한 여자들에게 올리브 화환을 씌웠습니다.[a] 그녀는 모든 백성 앞에서 춤을 추며[b] 모든 여자들을 이끌고 나아갔으며, 이스라엘의 모든 남자는 무장하고 화환을 쓰고 입에 찬송을 담은 채 뒤따랐습니다.
  rationale: 대명사 오류와 첫 절의 관계 혼동을 바로잡고, 올리브 화환 및 춤의 각주를 해당 낱말에 연결했습니다. ‘춤을 추며’는 χορεία의 춤 의미를 자연스럽게 살리면서도 행렬적 뉘앙스는 각주로 보존합니다. 남성들이 무장하고 화환을 쓰며 찬송하는 원문의 병렬적 묘사도 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T18:59:06Z'
