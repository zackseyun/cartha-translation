- source_word: οἱ ἐν τοῖς σκηνώμασιν ὄντες
  english_pob_choice: those who were in the tents
  chosen_korean: 장막 안에 있던 사람들
  alternatives_korean:
  - 장막들 안에 있던 사람들
  - 진영 안에 있던 사람들
  lexicon: LSJ
  rationale: 직역 구조를 유지하되 한국어로 자연스럽게 다듬었습니다. σκηνώμασιν은 군사적 맥락의 tents/encampments이지만, 본문이 특정 성별을 밝히지 않으므로 ‘사람들’로 포괄했습니다.
- source_word: ἐξέστησαν
  english_pob_choice: were astonished
  chosen_korean: 놀랐습니다
  alternatives_korean:
  - 경악했습니다
  - 넋을 잃었습니다
  - 몹시 놀랐습니다
  lexicon: LSJ
  rationale: 이 동사는 충격·경탄·당혹을 아우를 수 있으나, 여기서는 사건에 대한 즉각적 놀람을 가장 무리 없이 전달하는 표현을 택했습니다.
- source_word: ἐπὶ τὸ γεγονός
  english_pob_choice: at what had happened
  chosen_korean: 일어난 일에
  alternatives_korean:
  - 일어난 사건에
  - 그 일에
  - 발생한 일에
  lexicon: LSJ
  rationale: γεγονός의 완료된 사건성을 살리되, 한국어에서 가장 자연스러운 ‘일어난 일’로 옮겼습니다.
