theological_decisions:
- issue: Κύριος의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 주
  rationale: 이 장면에서 주어는 이스라엘을 위해 행하신 하나님이므로, 프로젝트 기본 원칙에 따라 κύριος를 야훼로 옮겼습니다.
  doctrine_reference: 'POB 기본 용례: LXX 인용/야훼 표기 원칙'
- issue: οἱ κατοικοῦντες ἐν Ἰερουσαλήμ의 수식 범위
  chosen_reading: 예루살렘에 거주하는 이들
  alternative_readings:
  - 예루살렘에 살던 원로회
  - 예루살렘에 거주하던 자들
  rationale: 문법상 가장 가까운 선행사인 원로회를 수식하는 것으로 읽히므로, 거주지를 밝히는 수식구를 한국어에서도 그 방향으로 유지했습니다.
  doctrine_reference: 문맥-통사 우선 원칙
