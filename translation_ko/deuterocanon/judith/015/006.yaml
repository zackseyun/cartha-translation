base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/015/006.yaml
  text: But the rest[a], those living in Bethulia, fell upon the camp of Assyria[c][b], and they pursued them and plundered it greatly.
  footnotes:
  - marker: a
    text: Or 'the Assyrian camp.' The Greek reads literally 'the camp of Assyria.'
    reason: lexical_alternative
  - marker: b
    text: The Greek expression literally says 'they went after them'; in this battle context it means 'they pursued them.'
    reason: lexical_alternative
  - marker: c
    text: The final clause could also be rendered 'and they plundered it very much' or 'and they took a great amount of spoil from it.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 베툴리아에 살던 나머지 사람들은 아수르의 진영[a]을 덮쳐들어 그들을 추격하고 크게 약탈했습니다[c][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘아시리아의 진영’. 그리스어는 문자적으로 ‘아수르의 진영’이라고 말합니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어 표현은 문자적으로 ‘그들을 따라갔다’이지만, 이 전투 문맥에서는 ‘추격했다’는 뜻입니다.
    reason: lexical_alternative
  - marker: c
    text: 마지막 절은 ‘그것을 매우 많이 약탈했다’ 또는 ‘그곳에서 많은 전리품을 취했다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ λοιποὶ
  english_pob_choice: But the rest
  chosen_korean: 그러나 … 나머지 사람들은
  alternatives_korean:
  - 그리고 … 남은 사람들은
  - 그런데 … 나머지 사람들은
  lexicon: BDAG
  rationale: δέ의 대조·전환을 살려 ‘그러나’로 시작했고, οἱ λοιποί는 자연스럽게 ‘나머지 사람들’로 옮겼습니다.
- source_word: οἱ κατοικοῦντες Βαιτυλουὰ
  english_pob_choice: those living in Bethulia
  chosen_korean: 베툴리아에 살던
  alternatives_korean:
  - 베툴리아에 거주하던
  - 베툴리아 주민인
  lexicon: BDAG
  rationale: κατοικοῦντες는 거주를 뜻하므로 문맥에 맞는 현대적 표현인 ‘살던’으로 옮겨 참여분사의 상태를 살렸습니다.
- source_word: ἐπέπεσαν
  english_pob_choice: fell upon
  chosen_korean: 덮쳐들어
  alternatives_korean:
  - 급습하여
  - 공격하여
  lexicon: BDAG
  rationale: 갑작스럽고 공격적인 동작을 나타내므로, 단순한 ‘공격했다’보다 ‘덮쳐들다’가 원문의 생생함을 더 잘 드러냅니다.
- source_word: τῇ παρεμβολῇ Ἀσσούρ
  english_pob_choice: the camp of Assyria
  chosen_korean: 아수르의 진영
  alternatives_korean:
  - 아수르 진영
  - 아시리아의 진영
  lexicon: BDAG
  rationale: παρεμβολή는 군사적 ‘진영’에 해당하고, Ἀσσούρ는 본문 형태를 따라 ‘아수르’로 음역했습니다. 정관적 소유 표현은 한국어에서 자연스럽게 ‘~의’로 처리했습니다.
- source_word: ἐπορεύοντο αὐτούς
  english_pob_choice: they pursued them
  chosen_korean: 그들을 추격하고
  alternatives_korean:
  - 그들을 뒤쫓고
  - 그들을 따라가며
  lexicon: BDAG
  rationale: 직역하면 ‘그들에게로/그들을 향해 갔다’이지만 전투 문맥상 ‘추격하다’가 의미를 정확히 전달합니다.
- source_word: ἐλούτησαν σφόδρα
  english_pob_choice: plundered it greatly
  chosen_korean: 크게 약탈했습니다
  alternatives_korean:
  - 몹시 약탈했습니다
  - 엄청나게 노획했습니다
  lexicon: BDAG
  rationale: ἐλούτησαν은 전리품을 취하며 약탈하는 의미이므로 ‘약탈하다’로 옮겼고, σφόδρα는 강도를 나타내는 부사로 ‘크게’로 반영했습니다.
theological_decisions:
- issue: 전투 서술의 동사 강도와 연속성
  chosen_reading: ‘덮쳐들어 그들을 추격하고 크게 약탈했습니다’로, 급습-추격-약탈의 연속 동작을 유지했습니다.
  alternative_readings:
  - ‘공격하여 그들을 뒤쫓고 많은 전리품을 취했습니다’
  - ‘습격하여 그들을 추격하고 많은 노획물을 얻었습니다’
  rationale: 본문은 단순한 승리 보고가 아니라 신속한 군사 행동의 흐름을 보여 주므로, 세 동작의 긴장을 보존하는 것이 중요합니다.
  doctrine_reference: 서사 문맥 보존
