  yaml_path: translation/deuterocanon/judith/015/010.yaml
  text: You have done all these things by your hand[a]; you have done good things for Israel, and God has been pleased with them[b]. May you be blessed by the Almighty Lord forever.
  footnotes:
  - marker: a
    text: Or 'you have done good things with Israel.' The Greek phrase may be read more literally with 'with,' but here it likely means acting for Israel's benefit.
    reason: lexical_alternative
  - marker: b
    text: Or 'God was pleased with them,' referring either to the good things done or, less likely, to the people of Israel.
    reason: alternative_reading
translation:
  language: ko
  text: 당신은 이 모든 일을 당신의 손으로 이루셨습니다. 당신은 이스라엘을 위해[a] 좋은 일들을 행하셨고, 하나님께서는 그 일들을 기뻐하셨습니다[b]. 전능하신 주님께서 당신에게 영원히 복 주시기를 바랍니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신은 이스라엘과 함께 좋은 일들을 행하셨습니다.’ μετά Ἰσραήλ은 문자적으로는 ‘이스라엘과 함께’이지만, 여기서는 이스라엘의 유익을 위하여 행했다는 뜻으로 읽을 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘하나님께서는 그 일들을 기뻐하셨습니다’ 또는, 덜 가능하게, ‘하나님께서는 이스라엘을 기뻐하셨습니다.’ 여기서 ‘그들을/그것들을’ 뜻하는 대명사는 앞의 좋은 일들이나 이스라엘 백성을 가리킬 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐποίησας πάντα ταῦτα
  english_pob_choice: you have done all these things
  chosen_korean: 당신은 이 모든 일을 이루셨습니다
  alternatives_korean:
  - 당신은 이 모든 일을 하셨습니다
  - 당신은 이 모든 것들을 행하셨습니다
  lexicon: BDAG
  rationale: 완료된 공적 행위를 자연스러운 현대 한국어로 옮기면서, ‘이루셨습니다’로 결과가 드러나는 찬양·축복의 뉘앙스를 살렸습니다.
- source_word: ἐν χειρί σου
  english_pob_choice: by your hand
  chosen_korean: 당신의 손으로
  alternatives_korean:
  - 당신의 손을 통해
  - 당신의 손에 의해
  lexicon: BDAG
  rationale: 도구적 표현을 직역하되 한국어에서 가장 자연스러운 ‘손으로’로 처리해, 행위의 주체성과 도구성을 함께 드러냈습니다.
- source_word: μετὰ Ἰσραήλ
  english_pob_choice: for Israel
  chosen_korean: 이스라엘을 위해
  alternatives_korean:
  - 이스라엘과 함께
  - 이스라엘에게
  lexicon: BDAG
  rationale: 이 구절은 ‘with Israel’의 표면형보다 이스라엘의 유익을 뜻하는 문맥이 분명하므로, POB의 축약된 의미를 따라 ‘위해’로 옮겼습니다.
- source_word: εὐδόκησεν ἐπʼ αὐτοῖς ὁ θεός
  english_pob_choice: God has been pleased with them
  chosen_korean: 하나님께서는 그것들에 기뻐하셨습니다
  alternatives_korean:
  - 하나님께서는 그것들을 좋게 여기셨습니다
  - 하나님께서는 그 일들에 만족하셨습니다
  lexicon: BDAG
  rationale: ἐπʼ αὐτοῖς의 지시 대상을 앞선 ‘좋은 일들’로 보고, ‘기뻐하셨습니다’로 하나님의 승인과 호의를 자연스럽게 표현했습니다.
- source_word: παντοκράτωρ κύριος
  english_pob_choice: the Almighty Lord
  chosen_korean: 전능하신 주님
  alternatives_korean:
  - 전능하신 주
  - 만군의 주님
  lexicon: BDAG
  rationale: παντοκράτωρ는 ‘전능하신’으로, κύριος는 프로젝트 기본어인 ‘주님’으로 옮겨 축복문에서의 신적 칭호를 유지했습니다.
theological_decisions:
- issue: 축복문 형식의 εὐλογημένη γίνου
  chosen_reading: 복 주시기를 바랍니다
  alternative_readings:
  - 복을 받으십시오
  - 복되게 되십시오
  rationale: 직설 명령처럼 들릴 수 있는 형식을 한국어 축복어법에 맞게 의지·기원형으로 처리해, 저자의 축복 선언 기능을 살렸습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy: readable modern Korean, preserve source sense'
- issue: θεός와 κύριος의 병치
  chosen_reading: 하나님… 전능하신 주님
  alternative_readings:
  - 주 하나님… 전능하신 주님
  - 하나님… 전능하신 하나님
  rationale: 문맥상 하나님(θεός)과 주님(κύριος)을 구분해 두어, 헬라어 원문이 가진 두 호칭의 병치를 한국어에서도 유지했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: Θεός → 하나님; κύριος → 주님'
