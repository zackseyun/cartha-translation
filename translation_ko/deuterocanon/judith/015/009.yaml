  text: And when they entered to her[a], they all with one accord blessed her and said to her, “You are the exaltation of Jerusalem, you are the great boast of Israel[b], you are the great glory of our people.”
  footnotes:
  - marker: a
    text: Or 'the height of Jerusalem' for 'the exaltation of Jerusalem'; the Greek term evokes being lifted high.
    reason: lexical_alternative
  - marker: b
    text: Or 'the great cause for boasting of our people' for 'the great glory of our people.' The Greek noun can also be rendered 'boast.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 그녀에게 들어가자, 모두가 한마음으로 그녀를 찬송하며 그녀에게 말했습니다. 「당신은 예루살렘의 높아짐이요, 이스라엘의 큰 자랑이요, 우리의 민족의 큰 영광입니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문의 πρὸς는 단순한 ‘왔다’보다 ‘~에게/향하여 들어가다’의 방향성을 지닙니다.
    reason: source_note
lexical_decisions:
- source_word: εἰσῆλθον πρὸς αὐτήν
  english_pob_choice: entered to her
  chosen_korean: 그녀에게 들어가자
  alternatives_korean:
  - 그녀에게 왔을 때
  - 그녀에게 들어가자마자
  - 그녀에게 나아가자
  lexicon: LSJ
  rationale: πρὸς의 방향성을 살려 단순한 ‘왔다’보다 ‘들어가다/나아가다’ 계열을 택했고, 장면상 그녀의 면전으로 들어가는 공적 접근을 자연스럽게 옮겼습니다.
- source_word: εὐλόγησαν
  english_pob_choice: blessed
  chosen_korean: 찬송하며
  alternatives_korean:
  - 복을 빌며
  - 축복하며
  - 칭송하며
  lexicon: LSJ
  rationale: 이 문맥의 εὐλόγησαν은 단순 칭찬보다 공적 축복·찬양의 뉘앙스를 가지므로, 현대 한국어에서 의례적 높임과 공적 찬양을 함께 살리는 ‘찬송하다’로 옮겼습니다.
- source_word: ὕψωμα
  english_pob_choice: the exaltation
  chosen_korean: 높아짐
  alternatives_korean:
  - 고양
  - 높이
  - 영광
  lexicon: LSJ
  rationale: ‘높이 들어 올려진 상태’라는 핵심 이미지를 직접 살리기 위해 추상적인 ‘영광’보다 ‘높아짐’을 택해 lifted-high metaphor를 보존했습니다.
- source_word: γαυρίαμα μέγα
  english_pob_choice: the great boast
  chosen_korean: 큰 자랑
  alternatives_korean:
  - 큰 보람
  - 큰 자부심
  - 큰 영광
  lexicon: LSJ
  rationale: γaυρίαμα의 ‘자랑/자랑거리’ 의미를 살려, 공동체가 그녀를 두고 크게 자랑한다는 뜻이 드러나는 ‘큰 자랑’으로 옮겼습니다.
- source_word: καύχημα μέγα
  english_pob_choice: the great glory
  chosen_korean: 큰 영광
  alternatives_korean:
  - 큰 자랑
  - 큰 자랑거리
  - 큰 영예
  lexicon: LSJ
  rationale: 앞의 γαυρίαμα와 동일화하지 않고, 마지막 칭송의 정점을 이루는 명예·존귀의 의미를 살려 ‘큰 영광’으로 옮겼습니다.
theological_decisions:
- issue: Judith에 대한 삼중 병렬 칭송의 강도
  chosen_reading: 세 칭호를 완화하지 않고 공적 찬양의 직설적 병렬로 유지했습니다.
  alternative_readings:
  - 예루살렘의 자랑
  - 이스라엘의 영광
  - 우리 민족의 자랑
  rationale: 본문은 유다 공동체가 유딧을 통해 경험한 구원을 기념하는 공개적 찬가이므로, 수사적 강도를 낮추지 않고 그대로 병렬 구조를 살렸습니다.
  doctrine_reference: 번역 원칙 §§1, 6
