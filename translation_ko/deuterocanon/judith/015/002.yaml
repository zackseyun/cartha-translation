  yaml_path: translation/deuterocanon/judith/015/002.yaml
  text: And terror and fear fell upon them[a], and no man remained standing before his neighbor any longer; but, scattering in all directions[b], they fled along every road of the plain and of the hill country.
  footnotes:
  - marker: a
    text: Or 'dispersing' or more literally 'being poured out'; the Greek pictures the troops breaking apart in panic.
    reason: lexical_alternative
  - marker: b
    text: '''With one accord'' is a possible rendering of the adverb, but here it likely means they fled all together or all at once rather than in harmonious unity.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들에게 공포와 두려움이 덮쳤으며, 그 이웃 앞에 더 이상 서서 머무는 사람은 없었습니다. 오히려 사방으로 흩어져, 평야와 산지의 온갖 길로 달아났습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘덮쳤으며’는 헬라어 ἐπέπεσεν의 직역적 ‘내려옴/닥쳐옴’과 영어 POB의 ‘fell upon’이 지닌 갑작스러운 충격성을 함께 반영한 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: ὁμοθυμαδόν은 보통 ‘한마음으로’로 옮길 수 있으나, 여기서는 칭찬이 아니라 패주하는 무리의 동시적 붕괴를 가리킵니다.
    reason: theological_note
lexical_decisions:
- source_word: ἐπέπεσεν
  english_pob_choice: fell upon
  chosen_korean: 덮쳤으며
  alternatives_korean:
  - 내렸으며
  - 엄습했으며
  - 덮쳐왔으며
  lexicon: LSJ
  rationale: 갑작스럽게 위로부터 닥쳐오는 느낌을 살리기 위해, 단순한 상태 진술보다 동적이고 압도적인 ‘덮치다’를 선택했습니다.
- source_word: τρόμος καὶ φόβος
  english_pob_choice: terror and fear
  chosen_korean: 공포와 두려움
  alternatives_korean:
  - 전율과 두려움
  - 공포와 공포심
  - 전율과 공포
  lexicon: LSJ
  rationale: 두 명사의 병렬을 살리되, 군사적 혼란 속 심리 상태를 자연스럽게 드러내는 표준어 표현으로 옮겼습니다.
- source_word: οὐκ ἦν ἄνθρωπος μένων κατὰ πρόσωπον τοῦ πλησίον ἔτι
  english_pob_choice: no man remained standing before his neighbor any longer
  chosen_korean: 그 이웃 앞에 더 이상 서서 머무는 사람은 없었습니다
  alternatives_korean:
  - 이웃 앞에 더 이상 남아 있는 사람은 없었습니다
  - 이웃 앞에 더 이상 버티고 서 있는 사람은 없었습니다
  lexicon: LSJ
  rationale: μένω의 ‘머무르다/남다’와 문맥상의 ‘서 있다’를 함께 반영해, 단순한 도주보다 전열 붕괴를 분명하게 드러냈습니다.
- source_word: ἐκχυθέντες
  english_pob_choice: scattering in all directions
  chosen_korean: 사방으로 흩어져
  alternatives_korean:
  - 쏟아져 흩어져
  - 흩뿌려지며
  - 사방으로 퍼져
  lexicon: LSJ
  rationale: ‘부어지다/쏟아지다’의 이미지는 있지만, 패주하는 군중의 장면에서는 ‘사방으로 흩어지다’가 원문의 비유적 힘을 가장 자연스럽게 전달합니다.
- source_word: ὁμοθυμαδόν
  english_pob_choice: together / all at once
  chosen_korean: 사방으로 흩어져
  alternatives_korean:
  - 한마음으로
  - 일제히
  - 함께
  lexicon: LSJ
  rationale: 여기서는 긍정적 ‘일치’가 아니라 동시적·집단적 도주를 뜻하므로, 한국어에서는 직전 절의 ‘흩어져’와 결합해 ‘함께 도주함’이 아닌 패주 양상을 드러내도록 처리했습니다.
theological_decisions:
- issue: 전장 패주 장면의 동시성/집단성 표현
  chosen_reading: ὁμοθυμαδόν을 긍정적 ‘한마음으로’가 아니라, 공황 속에서 한꺼번에 무너져 달아나는 집단 행동으로 읽었습니다.
  alternative_readings:
  - 한마음으로
  - 일제히
  - 함께
  rationale: 문맥상 합의나 화합이 아니라 공포에 의한 동시적 붕괴이므로, 한국어에서도 신학적 오해를 피하고 서사적 의미를 유지해야 합니다.
  doctrine_reference: 문맥 우선의 서사 해석; 집단 공황의 묘사
