theological_decisions:
- issue: 전장 패주 장면의 동시성/집단성 표현
  chosen_reading: ὁμοθυμαδόν을 긍정적 ‘한마음으로’가 아니라, 공황 속에서 한꺼번에 무너져 달아나는 집단 행동으로 읽었습니다.
  alternative_readings:
  - 한마음으로
  - 일제히
  - 함께
  rationale: 문맥상 합의나 화합이 아니라 공포에 의한 동시적 붕괴이므로, 한국어에서도 신학적 오해를 피하고 서사적 의미를 유지해야 합니다.
  doctrine_reference: 문맥 우선의 서사 해석; 집단 공황의 묘사
