  text: Therefore you gave their rulers over to slaughter, and their bed, which was ashamed of their deceit, was deceived into blood; and you struck slaves against princes, and princes upon their thrones.
translation:
  language: ko
  text: 그러므로 주께서는 그들의 통치자들을 살육에 넘기시고, 그들의 침상은 그들의 속임수에 수치스러워하다가 속임을 당하여 피에 잠기게 하셨으며, 노예들을 지배자들에 맞서게 하시고 지배자들을 그들의 왕좌에 치셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ὧν은 앞 절의 그들의 상태/행위 전체를 받는 인과적 연결로, ‘그러므로’는 문맥상 도입입니다.
    reason: source_note
lexical_decisions:
- source_word: ἔδωκας ἄρχοντας αὐτῶν εἰς φόνον
  english_pob_choice: you gave their rulers over to slaughter
  chosen_korean: 그들의 통치자들을 살육에 넘기시고
  alternatives_korean:
  - 그들의 통치자들을 학살에 넘기시고
  - 그들의 통치자들을 도륙에 넘기시고
  lexicon: ἄρχοντας → 통치자들; φόνον → 살육
  rationale: ἄρχοντας는 단순한 ‘지도자’보다 권세를 가진 통치층을 가리키므로 통치자로 옮겼고, εἰς φόνον은 처형보다 더 넓은 폭력적 살육을 가리켜 살육에 넘기셨다고 했습니다.
- source_word: τὴν στρωμνὴν αὐτῶν
  english_pob_choice: their bed
  chosen_korean: 그들의 침상은
  alternatives_korean:
  - 그들의 침대는
  - 그들의 잠자리는
  lexicon: στρωμνή
  rationale: 문맥상 실제 침구라기보다 성적/가정적 수치의 상징으로 쓰이므로, 현대 한국어에서도 상징성을 유지하는 침상으로 옮겼습니다.
- source_word: ᾐδέσατο τὴν ἀπάτην αὐτῶν ἀπατηθεῖσαν εἰς αἷμα
  english_pob_choice: which was ashamed of their deceit, was deceived into blood
  chosen_korean: 그들의 속임수에 수치스러워하다가 속임을 당하여 피에 잠기게 하셨으며
  alternatives_korean:
  - 그들의 속임수를 부끄러워하다가 피로 속아 들어가게 하셨으며
  - 그들의 기만을 부끄러워하다가 피로 물들게 하셨으며
  lexicon: ᾐδέσατο / ἀπάτη / ἀπατηθεῖσαν / αἷμα
  rationale: 원문의 중첩된 의인화와 말장난(속임수/속임 당함)을 살리기 위해 ‘수치스러워하다/속임을 당하다’의 대응을 유지했고, εἰς αἷμα는 결과 상태를 드러내는 피에 잠기게로 옮겼습니다.
- source_word: δούλους ... δυνάσταις καὶ δυνάστας
  english_pob_choice: slaves against princes, and princes upon their thrones
  chosen_korean: 노예들을 지배자들에 맞서게 하시고 지배자들을 그들의 왕좌에 치셨습니다
  alternatives_korean:
  - 종들을 통치자들에 맞서게 하시고 통치자들을 그들의 보좌에 치셨습니다
  - 노예들을 권세자들에 맞서게 하시고 권세자들을 그들의 보좌에 치셨습니다
  lexicon: δούλους → 노예; δυνάσταις / δυνάστας → 지배자들
  rationale: 영 POB가 slaves를 택해 신분의 예속성을 드러내므로 노예로 보존했고, δυνάσται는 단순한 ‘통치자’보다 권력 행사자를 가리켜 지배자로 옮겼습니다.
theological_decisions:
- issue: 신적 주체의 행위 연쇄와 심판적 역전
  chosen_reading: 주께서 통치자들을 살육에 넘기시고 노예들을 지배자들에 맞서게 하시는 심판의 역전을 그대로 유지했습니다.
  alternative_readings:
  - 완곡하게 ‘벌하시고’로 일반화하는 방식
  - 도덕적 교훈문으로 바꾸어 역전의 폭력을 약화하는 방식
  rationale: 이 절은 하나님의 주권적 심판이 권력 질서를 뒤집는다는 점을 강하게 드러내므로, 폭력성과 역전의 이미지가 흐려지지 않도록 직역에 가깝게 유지했습니다.
  doctrine_reference: 하나님의 심판과 권력의 역전(유딧기의 서사적 신학)
