base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/009/002.yaml
  text: And she said[a], “O Lord, God of my father Simeon, to whom you gave a sword in his hand for vengeance against foreigners, who loosed a virgin’s womb for defilement and bared the thigh for shame and profaned the womb for disgrace—though you said, ‘It shall not be so’[c][b]; but they did it.”
  footnotes:
  - marker: a
    text: Or, more explicitly, “who violated the virgin’s womb.” The Greek expression is euphemistic but clearly refers to sexual violation.
    reason: lexical_alternative
  - marker: b
    text: “Bared the thigh” is a sexual-shame idiom; compare similar biblical uses of uncovering nakedness or thigh imagery for humiliation and violation.
    reason: cultural_note
  - marker: c
    text: The prayer alludes to the Simeon-Dinah episode in Genesis 34, interpreting Simeon’s violence as vengeance for the outrage committed.
    reason: cross_reference
translation:
  language: ko
  text: 그리고 그녀가 말했습니다. “주님, 제 아버지 시므온[c]의 하나님, 당신께서 이방인들에게 보복하도록 그의 손에 칼을 주셨습니다. 그들은 처녀의 태를 풀어[a] 더럽히고, 허벅지를 드러내어[b] 수치를 안기고, 태를 욕되게 하여 치욕을 안겼습니다. 당신께서는 ‘그렇게 되어서는 안 된다’고 말씀하셨지만, 그들은 그렇게 하였습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘처녀의 태를 풀다’는 완곡한 표현이지만, 문맥상 성적 침해를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: ‘허벅지를 드러내다’는 성적 수치와 모욕을 나타내는 관용적 이미지입니다.
    reason: cultural_note
  - marker: c
    text: 이 기도는 창세기 34장의 시므온과 디나 사건을 떠올리게 합니다. 여기서는 시므온의 폭력이 그 수치에 대한 보복으로 언급됩니다.
    reason: cross_reference
lexical_decisions:
- source_word: Κύριε
  english_pob_choice: O Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주
  - 주인이신 분
  lexicon: LSJ
  rationale: 기도문의 직접 호칭이므로 관용적으로 자연스러운 ‘주님’을 쓰되, 문맥상 하나님께 드리는 호칭으로 유지했습니다.
- source_word: ὁ θεὸς τοῦ πατρὸς μου Συμεών
  english_pob_choice: God of my father Simeon
  chosen_korean: 제 아버지 시므온의 하나님
  alternatives_korean:
  - 제 아버지 시므온의 하나님
  - 시므온 제 아버지의 하나님
  lexicon: LSJ
  rationale: 소유·관계 구조를 한국어로 자연스럽게 옮기면서도, 시므온을 ‘아버지’로 규정하는 친족 표지를 보존했습니다.
- source_word: ἔδωκας ἐν χειρὶ ῥομφαίαν
  english_pob_choice: you gave a sword in his hand
  chosen_korean: 그의 손에 칼을 주셨는데
  alternatives_korean:
  - 그의 손에 칼을 주셨는데
  - 그 손에 칼을 주셨는데
  lexicon: LSJ
  rationale: ‘손에’라는 구체적 관용을 살리면서 한국어에서 가장 자연스러운 서술형으로 정리했습니다.
- source_word: οἳ ἔλυσαν μήτραν παρθένου
  english_pob_choice: who loosened a virgin’s womb
  chosen_korean: 처녀의 태를 풀어
  alternatives_korean:
  - 처녀의 태를 열어
  - 처녀의 태를 더럽혀
  lexicon: LSJ
  rationale: ἔλυσαν의 ‘풀다’라는 동사를 살려 원문의 은유를 유지했고, 문맥상 성적 침해의 의미는 뒤의 표현들과 함께 드러나도록 했습니다.
- source_word: ἐγύμνωσαν μηρὸν εἰς αἰσχύνην
  english_pob_choice: bared the thigh for shame
  chosen_korean: 허벅지를 드러내어 수치를 당하게
  alternatives_korean:
  - 허벅지를 드러내어 수치를 당하게
  - 허벅지를 벗겨 수치를 주게
  lexicon: LSJ
  rationale: ‘드러내다’로 노출의 이미지를 보존하고, αἰσχύνη를 현대어 ‘수치’로 옮겨 공개적 모욕의 뉘앙스를 살렸습니다.
- source_word: ἐβεβήλωσαν μήτραν εἰς ὄνειδος
  english_pob_choice: profaned the womb for disgrace
  chosen_korean: 태를 더럽혀 치욕이 되게 하였습니다
  alternatives_korean:
  - 태를 더럽혀 치욕이 되게 하였습니다
  - 태를 욕되게 하여 수치를 끼쳤습니다
  lexicon: LSJ
  rationale: βεβηλόω의 ‘속되게 하다/더럽히다’ 의미를 살리면서, ὄνειδος의 공적 수치를 ‘치욕’으로 옮겼습니다.
- source_word: Οὐχ οὕτως ἔσται
  english_pob_choice: It shall not be so
  chosen_korean: ‘그렇게 되어서는 안 된다’
  alternatives_korean:
  - ‘그렇게 되어서는 안 된다’
  - ‘그리되지 않을 것이다’
  lexicon: LSJ
  rationale: 하나님의 선언을 한국어 구어로도 분명하게 전달하되, 금지·거절의 어조를 살렸습니다.
theological_decisions:
- issue: 원문의 성적 폭력과 수치-모욕 표현을 얼마나 직접적으로 드러낼지
  chosen_reading: ‘처녀의 태를 풀어’, ‘허벅지를 드러내어 수치를 당하게’, ‘태를 더럽혀 치욕이 되게’처럼 은유를 유지하되 의미는 분명히 드러내는 방식으로 옮겼습니다.
  alternative_readings:
  - ‘처녀를 강간하여’처럼 단일한 해석어로 압축
  - ‘모욕하였다’처럼 완화
  rationale: 원문은 세 개의 서로 다른 표현을 겹쳐 사용해 침해, 수치, 더러움의 차원을 각각 강조하므로, 하나의 현대어로 압축하면 수사와 신학적 중량이 약해집니다.
  doctrine_reference: 번역 철학 §§1, 3, 6
- issue: ἀλλογενῶν의 범주를 어떻게 옮길지
  chosen_reading: ‘이방인들’로 옮겼습니다.
  alternative_readings:
  - 외국인들
  - 이민족들
  rationale: 유대교 문맥에서 경계 밖 사람들을 가리키는 표지로 기능하므로, 한국어 성서 독자에게 익숙하면서도 범주적 대비를 보존하는 ‘이방인들’이 가장 균형적입니다.
  doctrine_reference: 번역 철학 §§1, 6
