base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/009/004.yaml
  text: And you gave their wives as plunder[a], and their daughters into captivity, and all their spoils for division among the sons beloved by you, who also were zealous with your zeal and abhorred the defilement of their blood and called on you for help. O God, my God, hear me[b], the widow.
  footnotes:
  - marker: a
    text: Or 'your beloved sons.' The Greek is literally 'sons beloved by you.'
    reason: lexical_alternative
  - marker: b
    text: The phrase 'the defilement of their blood' may also be rendered 'their blood-pollution'; it refers to blood as a source of ritual or moral impurity.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들의 아내들을 약탈물로, 딸들을 포로로, 또 그들의 모든 전리품을 당신께 사랑받는 아들들이 나누어 갖도록 주셨습니다[a]. 그들은 또한 당신의 열심으로 열심을 내며, 그들의 피의 부정함을 혐오하고, 당신께 도움을 청하였습니다[b]. 하나님, 나의 하나님이시여, 과부인 저의 말을 들어 주십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신의 사랑하신 아들들’. 그리스어는 문자적으로 ‘당신께 사랑받는 아들들’입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그들의 피의 부정함’은 ‘그들의 피로 인한 오염’ 또는 ‘그들의 피의 오염’으로도 옮길 수 있습니다. 그리스어는 피와 관련된 예식적 또는 도덕적 부정을 가리키며, 속격 관계에는 다소의 모호성이 있습니다.
    reason: lexical_alternative
lexical_decisions:
