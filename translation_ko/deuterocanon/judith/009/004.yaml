base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/009/004.yaml
  text: And you gave their wives as plunder[a], and their daughters into captivity, and all their spoils for division among the sons beloved by you, who also were zealous with your zeal and abhorred the defilement of their blood and called on you for help. O God, my God, hear me[b], the widow.
  footnotes:
  - marker: a
    text: Or 'your beloved sons.' The Greek is literally 'sons beloved by you.'
    reason: lexical_alternative
  - marker: b
    text: The phrase 'the defilement of their blood' may also be rendered 'their blood-pollution'; it refers to blood as a source of ritual or moral impurity.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들의 아내들을 약탈물로, 딸들을 포로로, 그리고 당신께서 사랑하신 아들들 가운데 나눌 모든 전리품을 주셨습니다[a]. 그들은 또한 당신의 열심으로 열심을 품고, 자기들의 피의 더러움을 혐오하며, 당신께 도움을 청하였습니다. 오 하나님, 나의 하나님, 이 과부인 저를 들으소서[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신의 사랑하신 아들들’. 그리스어는 문자적으로 ‘당신께 사랑받는 아들들’입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘내가 과부입니다’라는 뜻을 더 직접적으로 드러낼 수도 있습니다. 본문은 기도하는 여인으로서의 자기 호칭을 유지합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: προνομὴν
  english_pob_choice: plunder
  chosen_korean: 약탈물
  alternatives_korean:
  - 전리품
  - 노략물
  lexicon: LSJ
  rationale: 전쟁에서 빼앗은 물건이라는 의미를 자연스럽게 살리면서, 다음의 σκῦλα와의 평행도 유지합니다.
- source_word: αἰχμαλωσίαν
  english_pob_choice: captivity
  chosen_korean: 포로로
  alternatives_korean:
  - 포로 생활로
  - 사로잡힘으로
  lexicon: LSJ
  rationale: εἰς αἰχμαλωσίαν의 결과 상태를 한국어로 간결하게 옮기기 위해 ‘포로로’라고 했습니다.
- source_word: υἱῶν ἠγαπημένων ὑπὸ σοῦ
  english_pob_choice: the sons beloved by you
  chosen_korean: 당신께서 사랑하신 아들들
  alternatives_korean:
  - 당신이 사랑하신 아들들
  - 당신의 사랑받는 아들들
  lexicon: LSJ
  rationale: 본문이 분명히 남성 복수인 ‘sons’를 말하므로 아들들로 옮기고, ὑπὸ σοῦ의 수동적 뉘앙스는 ‘사랑하신’으로 반영했습니다.
- source_word: ἐζήλωσαν τὸν ζῆλόν σου
  english_pob_choice: were zealous with your zeal
  chosen_korean: 당신의 열심으로 열심을 품고
  alternatives_korean:
  - 당신의 열심으로 열심을 내고
  - 당신의 열심에 열심히 응답하고
  lexicon: LSJ
  rationale: 반복 구조를 매끈하게 풀어 쓰되, 동일 어근의 강조를 ‘열심/열심을 품고’로 살렸습니다.
- source_word: μίασμα αἵματος αὐτῶν
  english_pob_choice: the defilement of their blood
  chosen_korean: 자기들의 피의 더러움
  alternatives_korean:
  - 그들의 피의 부정함
  - 피의 더러움
  lexicon: LSJ
  rationale: μίασμα의 예식적·도덕적 오염 뉘앙스를 ‘더러움’으로 살리고, αἵματος의 속격 관계는 직역에 가깝게 유지했습니다.
- source_word: τῆς χήρας
  english_pob_choice: the widow
  chosen_korean: 이 과부인 저
  alternatives_korean:
  - 과부인 저
  - 저 과부
  lexicon: LSJ
  rationale: 기도문의 자기 지칭을 한국어로 자연스럽게 만들기 위해 ‘이 과부인 저’로 풀되, 자기 호칭은 유지했습니다.
theological_decisions:
- issue: 지칭 반복과 직설적 탄원 유지
  chosen_reading: “오 하나님, 나의 하나님, 이 과부인 저를 들으소서”로 기도의 급박한 호소를 직설적으로 유지했습니다.
  alternative_readings:
  - “오 하나님, 나의 하나님, 저의 기도를 들으소서”
  - “오 하나님, 나의 하나님, 과부인 저를 들으시옵소서”
  rationale: 본문의 마지막 호소는 자기 정체성을 드러내는 기도문이므로, 매끈한 일반화보다 ‘과부’ 표지를 보존하는 쪽이 원문 효과를 더 잘 살립니다.
  doctrine_reference: DOCTRINE.md §3 Preserve theological tension rather than resolve it
