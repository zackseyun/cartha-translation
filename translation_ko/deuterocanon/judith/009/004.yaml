revisions:
- from: 그들의 아내들을 약탈물로, 딸들을 포로로, 그리고 당신께서 사랑하신 아들들 가운데 나눌 모든 전리품을 주셨습니다[a]. 그들은 또한 당신의 열심으로 열심을 품고, 자기들의 피의 더러움을 혐오하며, 당신께 도움을 청하였습니다. 오 하나님, 나의 하나님, 이 과부인 저를 들으소서[b].
  to: 그들의 아내들을 약탈물로, 딸들을 포로로, 또 그들의 모든 전리품을 당신께 사랑받는 아들들이 나누어 갖도록 주셨습니다[a]. 그들은 또한 당신의 열심으로 열심을 내며, 그들의 피의 부정함을 혐오하고, 당신께 도움을 청하였습니다[b]. 하나님, 나의 하나님이시여, 과부인 저의 말을 들어 주십시오.
  rationale: 원문의 전리품 분배 목적과 수혜자를 명확히 하고, 동계어로 된 ‘열심’의 강조를 자연스러운 현대 한국어로 유지했습니다. 또한 영어 POB 감사 기록에 따라 피의 부정함에 관한 각주를 올바른 원문 표현에 연결했습니다. ‘아들들’과 ‘과부’라는 원문의 성별·자기 호칭은 보존했습니다.
