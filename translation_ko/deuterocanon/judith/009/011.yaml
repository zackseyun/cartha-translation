  text: For your power is not in a multitude[a], nor is your dominion among the strong; rather, you are God of the lowly, helper of the lesser, supporter of the weak, shelter of the forsaken[b], savior of those without hope.
  footnotes:
  - marker: a
    text: Or 'the desperate' for 'the forsaken'; the Greek can denote people given up for lost or in despair.
    reason: lexical_alternative
  - marker: b
    text: Or 'deliverer' for 'savior.'
    reason: lexical_alternative
translation:
  language: ko
  text: 당신의 권세는 많은 무리에게 있는 것이 아니며, 당신의 통치권도 강한 자들 가운데 있는 것이 아닙니다. 오히려 당신은 낮은 이들의 하나님이시고, 더 약한 이들의 도움이시며, 힘없는 이들의 붙드심이시고, 버림받은 이들의 피난처이시며, 희망이 끊긴 이들의 구원자이십니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘버림받은 이들’은 ‘절망한 이들’로도 옮길 수 있습니다. 그리스어는 포기당한 상태와 절망의 상태를 모두 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘구원자’는 ‘구해 주시는 분’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: πλήθει
  english_pob_choice: a multitude
  chosen_korean: 많은 무리
  alternatives_korean:
  - 무리
  - 대중
  - 큰 무리
  lexicon: LSJ
  rationale: πλῆθος는 다수의 사람들/무리를 가리키므로, 한국어에서는 추상적인 ‘수’보다 구체적인 ‘많은 무리’가 문맥의 병렬성과 힘의 대비를 살립니다.
- source_word: ταπεινῶν
  english_pob_choice: the lowly
  chosen_korean: 낮은 이들
  alternatives_korean:
  - 겸손한 이들
  - 비천한 이들
  - 낮추어진 이들
  lexicon: LSJ
  rationale: ταπεινός는 내면의 겸손보다 사회적·상태적 낮아짐을 가리킬 수 있으므로, ‘낮은 이들’이 POB의 ‘lowly’를 가장 직접적으로 옮깁니다.
- source_word: ἐλαττόνων
  english_pob_choice: the lesser
  chosen_korean: 더 약한 이들
  alternatives_korean:
  - 더 작은 이들
  - 더 못한 이들
  - 더 적은 이들
  lexicon: LSJ
  rationale: ἐλάττων은 비교급으로 ‘덜한/작은/약한’의 폭이 있으나, 앞뒤의 취약성 목록과 맞추어 관계적 약함을 드러내는 ‘더 약한 이들’이 자연합니다.
- source_word: ἀντιλήμπτωρ
  english_pob_choice: supporter
  chosen_korean: 붙드심
  alternatives_korean:
  - 붙드시는 분
  - 도우심
  - 지탱하심
  lexicon: LSJ
  rationale: 이 희귀 명사는 ‘붙들어 주는 도움’의 이미지를 가지므로, 명사형 술어로 ‘붙드심’이라 옮겨 앞의 ‘도움’과 구별되는 지지의 뉘앙스를 살렸습니다.
- source_word: ἀπεγνωσμένων
  english_pob_choice: the forsaken
  chosen_korean: 버림받은 이들
  alternatives_korean:
  - 절망한 이들
  - 포기된 이들
  - 살길이 끊긴 이들
  lexicon: LSJ
  rationale: ἀπεγνωσμένος는 ‘포기당한/가망 없다고 여겨진’ 뜻이 있어, 내적 심정보다 외적 상태를 드러내는 ‘버림받은 이들’이 영어 POB의 ‘forsaken’과 잘 맞습니다.
- source_word: σωτήρ
  english_pob_choice: savior
  chosen_korean: 구원자
  alternatives_korean:
  - 구세주
  - 구원하시는 분
  - 구해 주시는 분
  lexicon: LSJ
  rationale: σωτήρ는 구출자·구원자를 뜻하며, 한국어에서는 종교적 고유호칭의 과잉을 피하면서도 본문의 술어성을 살리는 ‘구원자’가 가장 직접적입니다.
theological_decisions:
- issue: 히브리/헬라어 기도문에서 하나님의 성격을 연속된 명사적 술어로 유지할지 여부
  chosen_reading: ‘당신은 낮은 이들의 하나님이시고, 더 약한 이들의 도움이시며…’처럼 명사적 술어를 연쇄하여 유지했습니다.
  alternative_readings:
  - ‘낮은 이들을 도우시고 더 약한 이들을 붙드십니다’처럼 동사문으로 풀어쓰기
  rationale: 그리스어는 설명문보다 칭호의 연쇄에 가깝기 때문에, 동사화하면 수사적 밀도와 예배적 선언성이 약해집니다.
  doctrine_reference: 'DOCTRINE.md: source-first, preserve compact theological predicates and rhetorical force.'
