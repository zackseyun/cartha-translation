  rationale: 본문은 유대 전승의 기도문 안에서 하나님을 직접 호칭하는 문맥이므로, 한국어 독자에게 자연스럽고 경배적 울림이 있는 ‘주님’을 택했습니다.
  doctrine_reference: 'POB contested terms: κύριος → 주님'
