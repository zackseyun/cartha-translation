base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/009/007.yaml
  text: For behold[a], the Assyrians have multiplied in their strength; they have been exalted on horse and rider; they have boasted in the arm of foot soldiers; they have hoped in shield and spear and bow and sling, and they have not known that you are the Lord[b], the one who shatters wars.
  footnotes:
  - marker: a
    text: Or 'have trusted in shield and spear and bow and sling.' The Greek verb can carry the sense of hoping in or trusting in.
    reason: lexical_alternative
  - marker: b
    text: Or 'who ends wars.' Literally, 'the one who shatters wars.'
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오. 아시리아 사람들은 자기들의 힘으로 크게 불어났고, 말과 기병을 의지하여 높아졌으며, 보병의 팔을 자랑했고, 방패와 창과 활과 돌팔매를 믿었습니다. 그러나 그들은 당신이 전쟁을 깨뜨리시는 주님이신 줄 알지 못했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ γὰρ
  english_pob_choice: For behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 여기 보십시오
  lexicon: LSJ
  rationale: 문두의 주의 환기 표현을 현대 한국어의 직접적인 촉구형으로 옮겨, 경탄과 경고의 수사적 힘을 살렸습니다.
- source_word: ἐπληθύνθησαν ἐν δυνάμει αὐτῶν
  english_pob_choice: have multiplied in their strength
  chosen_korean: 자기들의 힘으로 크게 불어났고
  alternatives_korean:
  - 자기들의 힘 안에서 많아졌고
  - 자기들의 힘으로 증가했고
  lexicon: LSJ
  rationale: ἐπληθύνθησαν의 증가와 δυναμις의 힘을 함께 살리되, 한국어에서 자연스러운 군사적 과시의 뉘앙스를 위해 ‘크게 불어났다’로 옮겼습니다.
- source_word: ἤλπισαν ἐν ἀσπίδι καὶ ἐν γαίσῳ καὶ τόξῳ καὶ σφενδόνῃ
  english_pob_choice: have hoped in shield and spear and bow and sling
  chosen_korean: 방패와 창과 활과 돌팔매를 믿었습니다
  alternatives_korean:
  - 방패와 창과 활과 돌팔매에 희망을 두었습니다
  - 방패와 창과 활과 돌팔매를 의지했습니다
  lexicon: LSJ
  rationale: ἐλπίζω의 ‘희망하다/의지하다’ 범위를 한국어에서 군사적 신뢰의 의미로 자연스럽게 드러내기 위해 ‘믿었습니다’를 선택했습니다.
- source_word: συντρίβων πολέμους
  english_pob_choice: the one who shatters wars
  chosen_korean: 전쟁을 깨뜨리시는
  alternatives_korean:
  - 전쟁을 부수시는
  - 전쟁을 깨트리시는
  lexicon: LSJ
  rationale: συντρίβων의 강한 파괴 이미지를 보존해 ‘끝내시는’처럼 완화하지 않고, 동사의 현재 분사적 성격을 살려 ‘깨뜨리시는’으로 옮겼습니다.
