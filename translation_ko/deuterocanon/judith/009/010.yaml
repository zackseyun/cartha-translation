  text: Strike slave against ruler with the deceit of my lips[a], and ruler against his attendant; shatter their arrogance by the hand of a woman.
  footnotes:
  - marker: a
    text: Or 'shatter their uprising' or 'their insolence'; the Greek noun is rare and may denote either their proud exaltation or their rising up.
    reason: lexical_alternative
translation:
  language: ko
  text: 거짓된 내 입술의 꾀로 노예를 통치자에게, 통치자를 그의 시종에게 치게 하시고, 여자의 손으로 그들의 오만을 산산이 부수소서.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 일어섬’이나 ‘그들의 봉기’로 볼 수 있습니다. 희귀한 그리스어 명사는 그들의 교만한 고양이나 일어섬을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: δοῦλον
  english_pob_choice: slave
  chosen_korean: 노예
  alternatives_korean:
  - 종
  - 시종
  lexicon: LSJ
  rationale: 원문의 κοινωνική 위계가 뚜렷하므로, 완화된 ‘종’보다 신분 종속을 더 직접 드러내는 ‘노예’가 영어 POB의 선택과 대응합니다.
- source_word: ἐκ χειλέων ἀπάτης μου
  english_pob_choice: with the deceit of my lips
  chosen_korean: 거짓된 내 입술의 꾀로
  alternatives_korean:
  - 내 입술의 속임수로
  - 거짓된 내 입술로
  lexicon: LSJ
  rationale: 직역적 소유구문을 살리되, 한국어에서 자연스럽게 원인·수단을 나타내는 조사 ‘-로’를 써서 입술에서 나온 기만의 수단성을 보존했습니다.
- source_word: θεράποντι
  english_pob_choice: attendant
  chosen_korean: 시종
  alternatives_korean:
  - 종
  - 수행원
  lexicon: LSJ
  rationale: δοῦλος와 구별되는 개인 수행/시중의 뉘앙스를 살리기 위해 ‘시종’을 택했습니다.
- source_word: τὸ ἀνάστεμα
  english_pob_choice: their arrogance
  chosen_korean: 그들의 오만
  alternatives_korean:
  - 그들의 일어섬
  - 그들의 봉기
  - 그들의 교만
  lexicon: LSJ
  rationale: 희귀어의 가능한 ‘일어섬/봉기’ 의미를 인정하되, 문맥상 적대자들의 교만한 고양을 가리키므로 본문에는 ‘오만’으로 옮기고 의미의 폭은 각주로 남겼습니다.
- source_word: ἐν χειρὶ θηλείας
  english_pob_choice: by the hand of a woman
  chosen_korean: 여자의 손으로
  alternatives_korean:
  - 한 여인의 손으로
  - 여성의 손으로
  lexicon: LSJ
  rationale: 성별 표지를 지우지 않고, 한국어에서 자연스러운 행위자 표현으로 ‘여자의 손으로’를 유지했습니다.
theological_decisions:
- issue: 여성의 행위 주체성 보존
  chosen_reading: 여자의 손으로
  alternative_readings:
  - 한 여인의 손으로
  - 여성의 손으로
  rationale: θηλείας는 여성성을 분명히 표지하므로, 본문에서 여성 주체성을 희석하지 않고 그대로 드러내는 쪽을 택했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
