  terminology: ‘노예’와 ‘시종’은 δοῦλος와 θεράπων의 차이를 적절히 유지합니다. ‘통치자’, ‘오만’, ‘여자’도 문맥과 원어의 의미 범위에 부합합니다. ἀνάστεμα의 드문 어휘와 가능한 ‘일어섬/봉기’ 의미는 각주에 보존합니다.
