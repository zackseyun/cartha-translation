  source_fidelity: 수정이 필요합니다. 현행 ‘노예를 통치자에게 … 치게 하시고’는 ‘노예를 치게 하다’로도 읽혀 두 대상을 누가 치는지 문법적으로 불분명합니다. 그리스어의 사회적 역전, 즉 종속자가 통치자를 치고 통치자가 자신의 수행원을 치게 된다는 기도를 한국어에서 명확히 드러내야 합니다. ‘제 입술의 속임수로’는 ἐκ χειλέων ἀπάτης μου의 수단성과 1인칭 소유를 자연스럽게 보존합니다.
