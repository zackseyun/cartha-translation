  rationale: 첫 두 절을 ‘노예가 통치자를 치게 하시고, 통치자가 그의 시종을 치게 하시며’로 고쳐 그리스어의 대조적 병렬과 사회적 역전이 한국어 문법상 분명히 드러나도록 했습니다. 또한 ‘제 입술의 속임수로’로 다듬어 원문의 1인칭 속임수와 입술에서 나오는 수단이라는 뜻을 보존했습니다. ἀνάστεμα의 해석상 불확실성은 본문 ‘오만’과 각주의 대안으로 유지했습니다.
