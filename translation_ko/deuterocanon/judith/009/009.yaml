  text: Look upon their arrogance; send your wrath upon their heads; give power to what I have planned by the hand of me[a], a widow.
  footnotes:
  - marker: a
    text: Or, 'Give power into my hand, I who am a widow, for what I have planned.' The Greek final clause is syntactically compressed and may be construed in more than one closely related way.
    reason: alternative_reading
translation:
  language: ko
  text: 그들의 교만을 굽어보시고, 당신의 분노를 그들의 머리 위에 보내시며, 내가 과부인 이 몸으로 생각한 것을 이루도록 내 손에 힘을 주십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문의 ἐν χειρί μου τῆς χήρας는 압축된 구문으로, ‘내 손에’ 또는 ‘내 손을 통해’로 이해될 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: βλέψον εἰς
  english_pob_choice: Look upon
  chosen_korean: 굽어보시고
  alternatives_korean:
  - 보시고
  - 살펴보시고
  lexicon: LSJ
  rationale: 하나님께 드리는 간구의 높임말로, 단순한 시선보다 자비와 판단을 포함한 ‘굽어보다’가 원문의 청원적 뉘앙스를 잘 살립니다.
- source_word: ὑπερηφανίαν
  english_pob_choice: arrogance
  chosen_korean: 교만
  alternatives_korean:
  - 오만
  - 거만함
  lexicon: LSJ
  rationale: 원문의 overbearing pride를 한국어 성서 문맥에서 가장 자연스럽고 분명하게 드러내는 말은 ‘교만’입니다.
- source_word: ὀργήν
  english_pob_choice: wrath
  chosen_korean: 분노
  alternatives_korean:
  - 진노
  - 노여움
  lexicon: LSJ
  rationale: 하나님의 심판적 분노를 가리키므로 ‘진노’도 가능하지만, 현대 합쇼체에서 지나치게 교회적·전통적 어감을 피하면서도 강도를 살리기 위해 ‘분노’를 택했습니다.
- source_word: εἰς κεφαλὰς αὐτῶν
  english_pob_choice: upon their heads
  chosen_korean: 그들의 머리 위에
  alternatives_korean:
  - 그들의 머리에
  - 그들 머리 위로
  lexicon: LSJ
  rationale: 심판이 되돌아오는 관용구를 한국어에서 가장 직역에 가깝게 살리기 위해 ‘머리 위에’로 옮겼습니다.
- source_word: ἐν χειρί μου τῆς χήρας
  english_pob_choice: by the hand of me, a widow
  chosen_korean: 내 손에
  alternatives_korean:
  - 과부인 내 손에
  - 과부인 나의 손으로
  - 과부인 이 몸으로
  lexicon: LSJ
  rationale: 원문의 압축된 구문은 손을 통한 도구성/수단성을 지시하므로 기본은 ‘내 손에’로 두고, 뒤의 ‘과부’는 자기 규정으로 살려 문맥의 강조를 반영했습니다.
- source_word: ὃ διενοήθην
  english_pob_choice: what I have planned
  chosen_korean: 내가 생각한 것
  alternatives_korean:
  - 내가 계획한 것
  - 내가 꾀한 것
  - 내가 의도한 것
  lexicon: LSJ
  rationale: διανοέομαι는 계획하거나 마음에 품는 뜻이므로, 지나치게 계산적이거나 부정적 뉘앙스를 피하면서도 현재 완료적 소망을 살려 ‘생각한 것’으로 옮겼습니다.
theological_decisions:
- issue: Judith가 자기 정체를 ‘과부’로 강조하는 방식
  chosen_reading: 문장 안에 ‘내가 과부인 이 몸’이라고 넣어, 청원하는 자의 약함과 하나님의 도우심 요청을 함께 드러냈습니다.
  alternative_readings:
  - ‘과부인 나에게’처럼 부사적으로 처리
  - 각주로만 widowhood를 설명
  rationale: 원문은 τῆς χήρας를 압축적으로 붙여 Judith의 과부 정체성을 강조하므로, 본문에서 그 긴장을 드러내는 것이 더 충실합니다.
  doctrine_reference: 문맥적 자기표현 보존
