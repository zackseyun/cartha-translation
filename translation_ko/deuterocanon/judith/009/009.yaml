  source_fidelity: 앞의 두 청원은 대체로 충실합니다. 그러나 마지막 청원에서 ‘생각한 것’은 διενοήθην의 계획·의도 형성의 뜻을 충분히 드러내지 못하며, ‘과부인 이 몸으로’는 원문의 ‘손’ 표현을 본문상 약화합니다. ‘힘을 주십시오’는 κράτος에 적절합니다.
  naturalness: ‘그들의 교만을 굽어보시고’와 ‘머리 위에 보내시며’는 기도문으로 이해 가능하나, 현대 한국어에서는 ‘살펴보시고’와 ‘보내시고’가 더 자연스럽습니다. 마지막 절은 ‘제 손에 … 이룰 힘을’으로 다듬으면 합쇼체 기도문으로 자연스럽습니다.
  terminology: ὑπερηφανίαν은 ‘교만’, ὀργήν은 ‘분노’, κράτος는 ‘힘’으로 옮길 수 있습니다. 다만 διανοέομαι는 단순히 생각하는 것보다 ‘계획하다’가 더 정확합니다. τῆς χήρας는 ‘과부인 제’로 본문에 유지해야 합니다.
