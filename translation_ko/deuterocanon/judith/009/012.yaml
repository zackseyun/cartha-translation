  text: 네, 네, 오, 제 아버지의 하나님, 이스라엘의 유업의 하나님[a], 하늘들과 땅의 주재자[b], 물들의 창조자, 당신의 온 창조의 왕이시여, 당신께서 제 간구를 들어 주소서.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이스라엘의 유산의 하나님’. 이 표현은 ‘이스라엘의 유업이신 하나님’으로 이해될 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘주재자’는 그리스어 데스포테스(despotēs)를 옮긴 것으로, 퀴리오스(‘주님’)보다 절대적 권위와 소유의 뉘앙스가 강합니다.
    reason: lexical_alternative
