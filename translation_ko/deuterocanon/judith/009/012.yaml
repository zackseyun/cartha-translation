translation:
  language: ko
  text: 네, 네, 제 아버지의 하나님이시요 이스라엘의 유업의 하나님이신 하나님, 하늘과 땅의 주재자이시며 물들의 창조자이시고, 주님의 모든 창조물의 왕이신 주님, 주님은 제 기도를 들으소서.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ναὶ ναὶ
  english_pob_choice: Yes, yes
  chosen_korean: 네, 네
  alternatives_korean:
  - 진실로, 진실로
  - 예, 예
  lexicon: LSJ
  rationale: 겹친 긍정은 간절한 호소의 반복을 살리기 위해 한국어에서도 그대로 반복하여 옮겼습니다.
- source_word: δέσποτα
  english_pob_choice: Master
  chosen_korean: 주재자
  alternatives_korean:
  - 주님
  - 주인
  lexicon: BDAG
  rationale: κύριος와 구별되는 강한 지배·소유 뉘앙스를 살리기 위해, 통상적인 ‘주님’보다 ‘주재자’를 선택했습니다.
- source_word: τῶν οὐρανῶν καὶ τῆς γῆς
  english_pob_choice: of the heavens and of the earth
  chosen_korean: 하늘과 땅의
  alternatives_korean:
  - 하늘들과 땅의
  - 하늘과 땅의
  lexicon: LSJ
  rationale: 그리스어 복수형 οὐρανῶν을 가능하면 반영하되, 한국어 기도문으로는 ‘하늘과 땅’이 가장 자연스러워 이를 유지했습니다.
- source_word: κτίστα τῶν ὑδάτων
  english_pob_choice: Creator of the waters
  chosen_korean: 물들의 창조자이시며
  alternatives_korean:
  - 물의 창조자이시며
  - 물을 지으신 분이시며
  lexicon: LSJ
  rationale: ὑδάτων의 복수성을 살려 ‘물들’로 옮기고, κτίστα는 직접적으로 ‘창조자’로 번역했습니다.
- source_word: βασιλεῦ πάσης κτίσεώς σου
  english_pob_choice: King of all your creation
  chosen_korean: 주님의 모든 창조물의 왕이신
  alternatives_korean:
  - 주님의 온 창조의 왕이신
  - 주님의 모든 피조물의 왕이신
  lexicon: LSJ
  rationale: κτίσις는 여기서 우주적 ‘창조’/‘창조물’ 모두 가능하지만, 문맥상 전체 창조 질서를 가리키므로 ‘모든 창조물’로 옮겼습니다.
- source_word: σὺ εἰσάκουσον τῆς δεήσεώς μου
  english_pob_choice: you—hear my prayer
  chosen_korean: 주님은 제 기도를 들으소서
  alternatives_korean:
  - 주님, 제 기도를 들으소서
  - 주님은 제 간구를 들으소서
  lexicon: BDAG
  rationale: εἰσακούω는 단순 청취가 아니라 응답을 염두에 둔 ‘들으시다’의 기도문 표현으로 자연스럽게 살렸고, δεήσις는 문맥상 ‘기도’가 가장 적절합니다.
theological_decisions:
- issue: δέσποτα의 강한 권위 표지
  chosen_reading: ‘주재자’로 번역하여 절대적 통치와 소유의 뉘앙스를 살렸습니다.
  alternative_readings:
  - ‘주님’
  - ‘주인’
  rationale: 본문은 일반적 호칭 κύριος가 아니라 δέσποτα를 사용하므로, 평준화하지 않고 더 강한 주권 표현을 유지하는 것이 원문 충실성에 맞습니다.
  doctrine_reference: Original-language primacy; contested-title distinction between δέσποτα and κύριος
