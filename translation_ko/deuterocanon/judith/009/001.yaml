base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/009/001.yaml
  text: But Judith fell on her face[a], and put ashes on her head, and uncovered the sackcloth she had been wearing. And at that very time the evening incense was being offered in Jerusalem in the house of God, and Judith cried out with a loud voice to the Lord[b],
  footnotes:
  - marker: a
    text: Or 'laid bare the sackcloth she had been wearing.' The Greek indicates that she exposed the sackcloth rather than necessarily removing it.
    reason: lexical_alternative
  - marker: b
    text: That is, the incense offering appointed for the evening at the Jerusalem sanctuary.
    reason: cultural_note
translation:
  language: ko
  text: 그러자 유딧은 얼굴을 땅에 대고 엎드렸고, 머리에 재를 얹었으며, 자기가 입고 있던 베옷을 드러냈습니다. 그리고 바로 그때 예루살렘에서 하나님의 집에 저녁 향이 바쳐지고 있었는데, 유딧은 큰 소리로 주님께 부르짖었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 베옷 자체를 반드시 벗었다기보다, 이미 입고 있던 베옷이 드러나게 했음을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 곧 예루살렘 성소에서 저녁에 정해진 분향을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: ἔπεσεν ἐπὶ πρόσωπον
  english_pob_choice: fell on her face
  chosen_korean: 얼굴을 땅에 대고 엎드렸고
  alternatives_korean:
  - 얼굴을 바닥에 대고 엎드렸고
  - 낯을 땅에 대고 엎드렸고
  lexicon: LSJ
  rationale: 그리스어 관용구가 드러내는 굴복·애통·간구의 자세를 살리면서 한국어로 자연스럽게 표현했습니다.
- source_word: ἐπέθετο σποδὸν ἐπὶ τὴν κεφαλὴν αὐτῆς
  english_pob_choice: put ashes on her head
  chosen_korean: 머리에 재를 얹었으며
  alternatives_korean:
  - 머리에 재를 올렸으며
  - 머리에 재를 덮었으며
  lexicon: LSJ
  rationale: 애도 행위를 가리키는 표준적 표현으로, singular σποδόν의 재를 한국어에서는 자연스럽게 ‘재’로 옮겼습니다.
- source_word: ἐγύμνωσεν ὃν ἐνεδεδύκει σάκκον
  english_pob_choice: uncovered the sackcloth she had been wearing
  chosen_korean: 자기가 입고 있던 베옷을 드러냈습니다
  alternatives_korean:
  - 자기가 입고 있던 베옷을 드러내 보였습니다
  - 자기가 입고 있던 베옷을 벗겨 보였습니다
  lexicon: LSJ
  rationale: 핵심은 벗는 행위보다 ‘드러냄’이므로, POB의 해석을 따라 착용 중이던 베옷이 보이게 된 상황을 반영했습니다.
- source_word: τὸ θυμίαμα τῆς ἑσπέρας
  english_pob_choice: the evening incense
  chosen_korean: 저녁 향
  alternatives_korean:
  - 저녁 분향
  - 저녁 향연
  lexicon: LSJ
  rationale: θυμίαμα를 ‘향’으로 옮겨 향내/향을 통한 제의적 제시를 간결하게 살리고, 시간표현은 ‘저녁’으로 직역했습니다.
- source_word: πρὸς Κύριον
  english_pob_choice: to the Lord
  chosen_korean: 주님께
  alternatives_korean:
  - 주께
  - 주 하나님께
  lexicon: LSJ
  rationale: 기도의 수신자를 가리키는 방향성을 한국어 여격으로 자연스럽게 옮기되, κύριος는 프로젝트 관례대로 ‘주님’으로 렌더링했습니다.
theological_decisions:
- issue: οἶκος τοῦ θεοῦ의 번역
  chosen_reading: 하나님의 집
  alternative_readings:
  - 하나님의 성전
  - 하나님의 전
  rationale: 그리스어의 직설적 표현을 유지해 예루살렘 성소를 암시하되, 본문이 실제로 말하는 ‘집’의 어휘를 보존했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §5
- issue: 기도 중 호칭의 격식
  chosen_reading: 주님께
  alternative_readings:
  - 주께
  - 주 하나님께
  rationale: 서술문은 합쇼체를 유지하되, 하나님께 직접 드리는 호칭은 한국어 경건체를 과장하지 않는 범위에서 자연스럽게 처리했습니다.
  doctrine_reference: Korean target style guidance
