  source_fidelity: 전반적으로 원문에 충실합니다. 다만 εἰς τὸν οἶκον τοῦ θεοῦ와 ἦν ἄρτι προσφερόμενον의 제의적·시간적 관계는 ‘예루살렘에서 하나님의 집에 … 바쳐지고’보다 ‘예루살렘의 하나님의 집에서 … 막 드려지고’로 옮기는 편이 더 정확하고 자연스럽습니다.
  naturalness: ‘저녁 향이 바쳐지고’는 향이라는 물질과 바치다의 결합이 다소 부자연스럽습니다. 제의 문맥에서는 ‘저녁 분향이 드려지고’가 현대 표준 한국어에서 명확하고 자연스럽습니다. 또한 각주 표지는 해당 어구 바로 뒤에 두는 것이 앵커 관계를 분명히 합니다.
  terminology: ‘유딧’, ‘베옷’, ‘하나님의 집’, ‘주님’은 적절합니다. θυμίαμα에는 ‘분향’을 사용하여 향 자체와 향을 피우는 제의 행위를 혼동하지 않도록 했습니다.
