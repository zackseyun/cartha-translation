revisions:
- from: 그러자 유딧은 얼굴을 땅에 대고 엎드렸고, 머리에 재를 얹었으며, 자기가 입고 있던 베옷을 드러냈습니다. 그리고 바로 그때 예루살렘에서 하나님의 집에 저녁 향이 바쳐지고 있었는데, 유딧은 큰 소리로 주님께 부르짖었습니다.[a][b]
  to: 그러자 유딧은 얼굴을 땅에 대고 엎드려 머리에 재를 얹고, 자기가 입고 있던 베옷을 드러냈습니다.[a] 바로 그때 예루살렘의 하나님의 집에서 저녁 분향이 막 드려지고 있었고,[b] 유딧은 큰 소리로 주님께 부르짖었습니다.
  rationale: 원문의 ‘바로 그때’(ἄρτι), 예루살렘 하나님의 집에서 드려지는 저녁 분향, 그리고 베옷을 벗기보다 드러낸 행위를 명확히 했습니다. 의미를 추가하지 않고, 제의 용어와 문장 연결을 현대 합쇼체 문체에 맞게 다듬었습니다.
