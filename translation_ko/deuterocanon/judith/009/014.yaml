  source_fidelity: 초안은 기도문의 청원성과 하나님의 유일한 보호자 되심을 대체로 충실히 옮겼습니다. 그러나 ‘주의 온 백성과 모든 지파 위에 인식을 일으키셔서’는 ἐπὶ ... ἐπίγνωσιν의 관계를 한국어에서 부자연스럽게 처리하며, ‘위에 인식을 일으키다’는 의미가 불명확합니다. 수혜 대상을 ‘에게’로 처리하고 ‘깨달음’을 주는 청원으로 옮기는 것이 원문의 사역적 요청과 목적절을 더 명료하게 보존합니다.
