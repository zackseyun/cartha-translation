translation:
  language: ko
  text: 또한 주님의 온 백성과 모든 지파에게 깨달음[a]을 주시어, 그들이 주님께서 모든 능력과 권세의 하나님[b]이심을 알게 하시고, 이스라엘 민족을 지키시는 분은 주님 외에는 아무도 없음을 알게 하소서.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 ἐπίγνωσιν은 여기서 단순한 지식보다 ‘인식’, ‘알아봄’, 또는 ‘깨달음’을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘모든 능력과 권세의 하나님’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ποίησον ἐπὶ πᾶν τὸ ἔθνος σου καὶ πάσης φυλῆς ἐπίγνωσιν
  english_pob_choice: bring about, upon all your nation and every tribe, recognition
  chosen_korean: 주의 온 백성과 모든 지파 위에 인식을 일으키셔서
  alternatives_korean:
  - 주의 온 민족과 모든 지파에게 인식을 주셔서
  - 주의 온 백성과 모든 지파에 대해 인식을 이루셔서
  - 주의 온 백성과 모든 지파를 알게 하셔서
  lexicon: LSJ
  rationale: ποιέω의 사역적 용법을 살려 단순한 ‘주다’보다 결과를 만들어 내는 ‘일으키다/이루다’로 옮겼고, ἐπί + 대격의 방향성을 ‘위에’로 반영했습니다. ἐπίγνωσιν은 문맥상 단순 지식보다 ‘인식’이 자연스럽습니다.
- source_word: ὁ θεὸς πάσης δυνάμεως καὶ κράτους
  english_pob_choice: the God of all power and might
  chosen_korean: 모든 능력과 권세의 하나님
  alternatives_korean:
  - 모든 힘과 능력의 하나님
  - 모든 능력과 권능의 하나님
  - 모든 힘과 권세의 하나님
  lexicon: LSJ
  rationale: δύναμις와 κράτος의 중첩된 강세를 한국어의 ‘능력과 권세’로 대응시켜, 하나님의 압도적 주권과 힘을 함께 살렸습니다.
- source_word: τοῦ γένους Ἰσραήλ
  english_pob_choice: the people of Israel
  chosen_korean: 이스라엘 민족
  alternatives_korean:
  - 이스라엘 백성
  - 이스라엘 종족
  - 이스라엘 사람들
  lexicon: LSJ
  rationale: γένος는 혈연·민족 집단을 가리킬 수 있어, 현대 한국어에서 가장 직접적인 ‘민족’을 택해 집단적 소속감을 드러냈습니다. POB의 ‘people of Israel’과도 의미상 일치합니다.
- source_word: ὑπερασπίζων
  english_pob_choice: defends
  chosen_korean: 지키는 이
  alternatives_korean:
  - 보호하는 이
  - 변호하는 이
  - 방어하는 이
  lexicon: LSJ
  rationale: 군사적·보호적 뉘앙스를 자연스럽게 살리기 위해 동사형 ‘지키는’으로 옮겼습니다. ‘방어하는’보다 기도문 맥락에서 더 유려합니다.
theological_decisions:
- issue: 기도문 말미의 직접 청원 형식
  chosen_reading: ‘알게 하소서’로 끝나는 간구형을 유지했습니다.
  alternative_readings:
  - 서술형으로 평서화
  - 청원성을 완화한 표현
  rationale: 히브리/그리스어 원문의 기도적 요청을 보존하기 위해 종결을 청원형으로 처리했습니다. 번역이 서술문처럼 평탄해지지 않도록 했습니다.
  doctrine_reference: Source-register preservation; prayer discourse
- issue: 하나님의 유일한 구원·방어자 되심
  chosen_reading: ‘오직 주님뿐’으로 배타적 유일성을 드러냈습니다.
  alternative_readings:
  - 주님이 가장 먼저 지키시는 분
  - 주님만 특별히 지키십니다
  rationale: εἰ μὴ σύ의 배타성을 약화하지 않도록, 다른 존재를 배제하는 유일성 표현을 유지했습니다.
  doctrine_reference: Divine exclusivity in deliverance
