  yaml_path: translation/deuterocanon/judith/009/013.yaml
  text: And make my words and deceit become their wound and bruise[b][a], they who have devised harsh things against your covenant and your sanctified house and the summit of Zion and the house possessed by your sons.
  footnotes:
  - marker: a
    text: Or 'my speech and deception into injury and bruise for them.' The Greek wording is compact and may emphasize either the means Judith uses or the result inflicted on her enemies.
    reason: lexical_alternative
  - marker: b
    text: The phrase 'the house possessed by your sons' is difficult. It may mean 'the dwelling/inheritance of your sons,' referring to the land or sanctuary belonging to God's people.
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 제 말과 속임수를 그들의 상처와 멍이 되게 하소서[a]. 그들은 당신의 언약과 당신의 거룩하게 하신 집과 시온의 정상과 당신의 아들들이 소유한 집을 거슬러 가혹한 일을 꾀하였습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘제 말과 속임수를 그들의 상처와 멍으로 주소서’입니다. 그리스어 표현은 압축적이어서, 유딧이 사용하는 수단을 강조하는 것으로도, 적들에게 가해질 결과를 강조하는 것으로도 이해할 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘당신의 아들들이 소유한 집’은 난해한 표현입니다. 하나님의 백성에게 속한 거처 또는 유산을 가리킬 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: δὸς
  english_pob_choice: make / give
  chosen_korean: 되게 하소서
  alternatives_korean:
  - 주십시오
  - 허락하소서
  - 주시고 이루어지게 하소서
  lexicon: LSJ
  rationale: εἰς와 함께 결과를 나타내는 구문이므로 단순한 ‘주십시오’보다 ‘되게 하소서’가 결과적 뉘앙스를 더 잘 살립니다.
- source_word: λόγον μου
  english_pob_choice: my words
  chosen_korean: 제 말
  alternatives_korean:
  - 제 말들
  - 제 말씀
  - 제 언어
  lexicon: LSJ
  rationale: 문맥상 유딧의 발화 전체를 가리키므로 자연스러운 현대 한국어인 ‘제 말’이 가장 직접적이며, 단수 λόγον의 넓은 의미도 유지합니다.
- source_word: ἀπάτην
  english_pob_choice: deceit
  chosen_korean: 속임수
  alternatives_korean:
  - 기만
  - 속임
  - 사기
  lexicon: LSJ
  rationale: 이 단어는 도덕적으로 긴장된 ‘기만/속임’의 의미를 가지므로, 본문의 불편한 긴장을 약화하지 않으면서도 한국어로 분명한 ‘속임수’를 택했습니다.
- source_word: οἴκου κατασχέσεως υἱῶν σου
  english_pob_choice: the house possessed by your sons
  chosen_korean: 당신의 아들들이 소유한 집
  alternatives_korean:
  - 당신의 아들들의 소유의 집
  - 당신의 아들들이 차지한 집
  - 당신의 아들들의 유산의 집
  lexicon: LSJ
  rationale: 구문이 난해하므로, 소유/보유의 뜻을 드러내는 직역형을 취해 본문의 모호성을 보존했습니다.
theological_decisions:
- issue: 유딧이 하나님께 자신의 속임수를 사용해 달라고 요청하는 긴장
  chosen_reading: 본문의 ἀπάτην을 완곡하게 바꾸지 않고 ‘속임수’로 직역했습니다.
  alternative_readings:
  - 기만
  - 지략
  - 계책
  rationale: 본문은 도덕적 긴장을 숨기지 않고 그대로 제시하므로, 한국어에서도 그 긴장을 유지하는 것이 원문에 충실합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 3
- issue: διαθήκης의 번역
  chosen_reading: ‘언약’으로 옮겼습니다.
  alternative_readings:
  - 계약
  - 협정
  rationale: 이 단어는 단순한 합의가 아니라 하나님-백성 관계의 언약적 무게를 지니므로, 성서적 관용을 살리는 ‘언약’이 적절합니다.
  doctrine_reference: DOCTRINE.md §Contested terms / covenantal usage principles
