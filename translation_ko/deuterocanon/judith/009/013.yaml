  rationale: σκληρά 및 ἐβουλεύσαντο의 의미와 현대 한국어의 자연스러운 결합을 반영하여 ‘가혹한 일을 꾀하였습니다’로 고쳤습니다. 각주 a는 동일 문구의 반복을 제거하고, δὸς와 εἰς 구문의 압축성과 가능한 강조점의 차이를 실질적으로 설명하도록 수정했습니다. 난해한 οἴκου κατασχέσεως υἱῶν σου는 본문에서 직역형을 유지하고 각주에서만 가능한 지시 대상을 제시했습니다.
