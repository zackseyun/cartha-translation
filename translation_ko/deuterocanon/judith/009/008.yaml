base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/009/008.yaml
  text: Lord is your name[a]; you, shatter their strength in your power, and break their might in your wrath; for they planned to profane your holy things, to defile the tabernacle, the resting place of your glorious name[b], and to cast down with the sword the horn of your altar.
  footnotes:
  - marker: a
    text: Or, more literally, 'with iron.' The Greek likely uses 'iron' as a metonym for an iron weapon, hence 'with the sword' in the main text.
    reason: lexical_alternative
  - marker: b
    text: '''Your holy things'' may refer broadly to sacred objects or holy precincts, not only to the sanctuary building itself.'
    reason: lexical_alternative
translation:
  language: ko
  text: 주님이십니다. 주님께서 당신의 권능으로 그들의 힘을 부수시고, 당신의 진노로 그들의 세력을 꺾으소서. 그들이 당신의 거룩한 것들을 더럽히고, 당신의 영광스러운 이름이 머무는 천막을 더럽히며, 당신의 제단의 뿔을 칼로 무너뜨리려고 꾀하였기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘주님이십니다’는 헬라어의 ‘주님이 당신의 이름입니다’라는 선언을 한국어답게 압축한 번역입니다.
    reason: korean_style_note
  - marker: b
    text: ‘칼로’는 문자적 ‘철로’의 환유적 의미를 드러내는 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Κύριος ὄνομά σοι
  english_pob_choice: Lord is your name
  chosen_korean: 주님이십니다
  alternatives_korean:
  - 주님이 이름이십니다
  - 주님은 당신의 이름이십니다
  lexicon: LSJ
  rationale: 직역하면 ‘주님이 당신의 이름입니다’에 가깝지만, 한국어에서는 주어-서술 관계를 자연스럽게 압축해 주님의 정체를 선포하는 형식으로 옮기는 것이 가장 직접적입니다.
- source_word: ῥάξον ... ἰσχὺν
  english_pob_choice: shatter ... strength
  chosen_korean: 그들의 힘을 부수시고
  alternatives_korean:
  - 그들의 힘을 산산이 부수시고
  - 그들의 힘을 깨뜨리시고
  lexicon: LSJ
  rationale: ῥάξον의 파괴적 동작을 살리면서도 합쇼체 기도문에 어울리게 ‘부수시고’로 옮겼습니다.
- source_word: κατάξον τὸ κράτος αὐτῶν
  english_pob_choice: break their might
  chosen_korean: 그들의 세력을 꺾으소서
  alternatives_korean:
  - 그들의 권세를 무너뜨리소서
  - 그들의 위세를 꺾으소서
  lexicon: LSJ
  rationale: κράτος은 단순한 힘보다 ‘세력/권세’의 뉘앙스가 있어, 힘과 중복되지 않도록 ‘세력’을 택했습니다.
- source_word: τὰ ἅγιά σου
  english_pob_choice: your holy things
  chosen_korean: 당신의 거룩한 것들
  alternatives_korean:
  - 당신의 거룩한 물건들
  - 당신의 성물들
  lexicon: LSJ
  rationale: 복수 중성의 범위를 유지하기 위해 특정 건물로 좁히지 않고, 제의적 대상 전체를 포괄하는 표현을 택했습니다.
- source_word: τὸ σκήνωμα τῆς καταπαύσεως τοῦ ὀνόματος τῆς δόξης σου
  english_pob_choice: the tabernacle, the resting place of your glorious name
  chosen_korean: 당신의 영광스러운 이름이 머무는 천막
  alternatives_korean:
  - 당신의 영광스러운 이름의 안식처
  - 당신의 이름의 영광이 머무는 천막
  lexicon: LSJ
  rationale: σκήνωμα와 καταπαύσεως를 함께 살리기 위해 ‘천막’과 ‘머무는’으로 번역해, 거룩한 처소의 구체성을 유지했습니다.
- source_word: σιδήρῳ κέρας
  english_pob_choice: with the sword ... the horn
  chosen_korean: 칼로 무너뜨리려고
  alternatives_korean:
  - 철로 무너뜨리려고
  - 칼로 쳐부수려고
  lexicon: LSJ
  rationale: σιδήρῳ는 문자적으로 ‘철로’이나, 전투 맥락에서 무기를 가리키는 환유로 이해되어 ‘칼로’가 한국어에서 가장 자연스럽습니다.
theological_decisions:
- issue: 거룩한 것들과 성막 이미지의 구체성 유지
  chosen_reading: ‘당신의 거룩한 것들’, ‘당신의 영광스러운 이름이 머무는 천막’, ‘당신의 제단의 뿔’로 구체적 제의 이미지를 살렸습니다.
  alternative_readings:
  - ‘성소’, ‘성전’, ‘제단의 장식’ 등으로 일반화하는 번역
  rationale: 본문은 추상적 경건어보다 실제로 더럽혀질 수 있는 거룩한 대상과 처소를 강조하므로, 이미지를 구체적으로 유지해야 기도의 긴장이 살아납니다.
  doctrine_reference: DOCTRINE.md §§1, 5, 6
