    rationale: ἐβουλεύσω는 2인칭 단수로 읽히며, 이어지는 σου 및 본문의 하나님을 향한 직접 호칭과도 일치합니다. 1인칭으로 옮기면 화자가 바뀌어 원문 의미를 훼손합니다.
