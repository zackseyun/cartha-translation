  text: And what I planned stood ready[a], and they said, ‘Behold, we are here; for all your ways are prepared, and your judgment is in foreknowledge.’
  footnotes:
  - marker: a
    text: Or, 'your judgment is according to foreknowledge' or 'your judgment is in your foreknowledge.' The Greek phrase is compact and may express that God's judicial decision rests within or accords with his prior knowledge.
    reason: alternative_reading
translation:
  language: ko
  text: 주님께서 계획하신 일들이 준비되어 있었고, 그들이 말했습니다. “보십시오, 우리가 여기 있습니다. 주님의 모든 길은 준비되어 있으며, 주님의 심판은 예지 안에 있습니다[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “주님의 심판은 예지에 따라 있습니다” 또는 “주님의 심판은 주님의 예지 안에 있습니다.” 그리스어 ἐν προγνώσει는 간결한 표현으로, 심판이 미리 아심 안에 있는지 또는 미리 아심에 따른 것인지를 명시적으로 한정하지 않습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: παρέστησαν
  english_pob_choice: stood ready
  chosen_korean: 서 있었습니다
  alternatives_korean:
  - 준비되어 있었습니다
  - 곁에 있었습니다
  - 대기하고 있었습니다
  lexicon: LSJ
  rationale: 계획이나 마련된 일들이 이미 실행 가능한 상태에 놓였다는 뜻을 살려, 단순한 위치보다 ‘서 있다’의 결과 상태로 옮겼습니다.
- source_word: ἃ ἐβουλεύσω
  english_pob_choice: what I planned
  chosen_korean: 내가 계획한 것
  alternatives_korean:
  - 내가 꾀한 것
  - 내가 의도한 것
  - 내가 작정한 것
  lexicon: LSJ
  rationale: βουλεύω의 숙고·계획 의미를 살리면서, 현대 한국어에서 자연스러운 ‘계획한 것’으로 옮겼습니다.
- source_word: ἕτοιμοι
  english_pob_choice: are prepared
  chosen_korean: 준비되어 있고
  alternatives_korean:
  - 준비되어 있으며
  - 마련되어 있고
  - 예비되어 있고
  lexicon: LSJ
  rationale: 하나님의 길들이 이미 갖추어져 있다는 결과 상태를 분명히 드러내기 위해 ‘준비되어 있다’를 사용했습니다.
- source_word: πρόγνωσις
  english_pob_choice: foreknowledge
  chosen_korean: 미리 아심
  alternatives_korean:
  - 예지
  - 미리 아신 지식
  - 전지
  lexicon: LSJ
  rationale: 추상명사 ‘foreknowledge’를 직역하기보다, 하나님께 속한 ‘아심’을 살린 ‘미리 아심’으로 표현해 문맥의 신적 주체성을 유지했습니다.
theological_decisions:
- issue: ἐν προγνώσει의 관계를 한국어로 어떻게 드러낼지
  chosen_reading: ‘당신의 심판은 미리 아심 안에 있습니다’로 옮겨, 심판과 예지의 관계를 열어 둡니다.
  alternative_readings:
  - ‘당신의 심판은 미리 아심에 따라 있습니다’
  - ‘당신의 심판은 당신의 미리 아심에 있습니다’
  rationale: 그리스어의 압축된 관계를 한 가지로 단정하지 않고, 심판이 하나님의 미리 아심과 긴밀히 관련됨을 본문 수준에서만 드러냈습니다.
  doctrine_reference: 하나님의 주권적 판단과 전지의 관계를 과도하게 설명하지 않고 보존합니다.
