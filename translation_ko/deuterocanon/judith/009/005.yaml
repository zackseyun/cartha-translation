  source_fidelity: 수정이 필요합니다. 초안은 τὰ πρότερα ἐκείνων을 ‘그들보다 앞선 것들’로 대체로 보존했지만, 이어지는 독립된 시간 항목 ἐκεῖνα(‘그것들/그것들 자체’)를 누락했습니다. 또한 뒤의 열거는 ‘그 뒤에 올 것들’보다는 원문의 병렬성과 지시의 불명확성을 살린 ‘그것들과 그 뒤의 것들’이 더 충실합니다.
  naturalness: 초안의 합쇼체는 자연스럽습니다. 다만 ‘그들보다’는 비인격 사물 지시어와 연결될 때 다소 어색하므로 ‘그것들보다’가 더 자연스럽고, 열거를 모두 명시하면 문장 구조도 원문에 더 가깝습니다.
  terminology: ‘만드셨고’는 ἐποίησας에 적절합니다. διενοήθης와 ἐνενοήθης는 의도적 숙고를 나타낼 수 있으므로 ‘계획하셨으며/계획하신 것들’은 문맥상 안전합니다. 특정 교리 체계를 덧붙이지 않으며, ‘주님’이라는 호칭은 기도 문맥의 한국어 존대 표현으로 자연스럽습니다.
