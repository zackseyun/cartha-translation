  text: For you made those things before them, and those things and the things afterward and the things now and the things to come you planned[a][b], and what you planned came to be.
  footnotes:
  - marker: a
    text: Or 'you considered' / 'you purposed' for 'you planned' (διενοήθης).
    reason: lexical_alternative
  - marker: b
    text: 'The Greek piles up temporal expressions: ''the things before,'' ''those,'' ''the things afterward,'' ''the things now,'' and ''the things to come,'' stressing God''s rule over all times.'
    reason: cultural_note
translation:
  language: ko
  text: 주님께서는 그들보다 앞선 것들을 만드셨고, 그 뒤에 올 것들과 지금 있는 것들과 앞으로 올 것들을 생각하셨으며[a][b], 생각하신 것이 이루어졌습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘계획하셨으며’ / ‘의도하셨으며’로 옮길 수 있습니다. (διενοήθης)
    reason: lexical_alternative
  - marker: b
    text: 그리스어는 ‘그들보다 앞선 것들’, ‘뒤에 올 것들’, ‘지금 있는 것들’, ‘앞으로 올 것들’을 차례로 쌓아, 모든 시간에 대한 하나님의 통치를 강조합니다.
    reason: cultural_note
lexical_decisions:
- source_word: ἐποίησας
  english_pob_choice: made
  chosen_korean: 만드셨고
  alternatives_korean:
  - 하셨고
  - 지으셨고
  lexicon: BDAG
  rationale: ποιέω는 여기서 단순한 행위보다 어떤 것을 있게 하거나 만들어 내는 뜻이므로, ‘만드셨고’가 가장 자연스럽게 대응합니다.
- source_word: τὰ πρότερα ἐκείνων
  english_pob_choice: those things before them
  chosen_korean: 그들보다 앞선 것들
  alternatives_korean:
  - 그것들보다 이전의 것들
  - 그 앞선 것들
  lexicon: BDAG
  rationale: ἐκείνων의 비교 대상을 살려 ‘그들보다 앞선 것들’로 옮기면, 원문의 비교적·시간적 관계를 유지하면서도 한국어가 자연스럽습니다.
- source_word: τὰ μετέπειτα / τὰ νῦν / τὰ ἐπερχόμενα
  english_pob_choice: the things afterward / the things now / the things to come
  chosen_korean: 그 뒤에 올 것들과 지금 있는 것들과 앞으로 올 것들
  alternatives_korean:
  - 뒤에 올 것들과 현재의 것들과 장차 올 것들
  - 뒤따를 것들과 지금의 것들과 올 것들
  lexicon: BDAG
  rationale: 세 개의 시간 표지를 병렬로 살려, 과거-현재-미래의 전면성을 드러내는 표현으로 옮겼습니다.
- source_word: διενοήθης / ἃ ἐνενοήθης
  english_pob_choice: you planned / what you planned
  chosen_korean: 생각하셨으며 / 생각하신 것이
  alternatives_korean:
  - 계획하셨으며 / 계획하신 것이
  - 뜻하셨으며 / 뜻하신 것이
  lexicon: BDAG
  rationale: 이 동사들은 단순한 인지보다 의도와 구상을 포함하지만, 본문이 명시적으로 ‘계획’ 용어를 강요하지 않으므로 ‘생각하셨으며’로 옮겨 사유와 의도의 중첩을 보존했습니다.
theological_decisions:
- issue: 하나님의 시간 주권을 어떻게 한국어로 드러낼 것인가
  chosen_reading: 과거·현재·미래의 시간 항목을 나열한 다음, 그 모든 것이 하나님의 생각과 실현으로 연결된다는 구조를 그대로 살렸습니다.
  alternative_readings:
  - 시간 범주를 하나로 묶어 ‘모든 시대를’로 의역
  - ‘미리 정하셨으며’로 신학 용어를 강화
  rationale: 본문의 핵심은 철학적 설명보다 하나님이 모든 시간대를 포괄해 일하신다는 점이므로, 원문의 열거 구조를 보존하는 편이 더 직접적입니다.
  doctrine_reference: 하나님의 주권과 섭리
