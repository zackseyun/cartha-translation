  text: And Ozias said to her[a], “Everything you have said, you have spoken with a good heart, and there is no one who will oppose your words.”
  footnotes:
  - marker: a
    text: Greek literally, 'with a good heart,' expressing upright or sincere intent rather than merely speaking effectively.
    reason: lexical_alternative
translation:
  language: ko
  text: 오지야스가 그녀에게 말했습니다. “당신이 말한 것은 모두 선한 마음으로 말한 것입니다. 그리고 당신의 말에 맞설 자는 아무도 없습니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘선한 마음으로’입니다. 이는 단순히 말을 잘했다는 뜻이 아니라, 진실하고 바른 의도에서 말했음을 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάντα ὅσα εἶπας
  english_pob_choice: Everything you have said
  chosen_korean: 당신이 말한 것은 모두
  alternatives_korean:
  - 당신이 말한 모든 것
  - 당신이 한 말은 모두
  lexicon: LSJ
  rationale: 전체성을 드러내는 표현으로 옮기되, 한국어에서 자연스러운 선행 요약형을 사용했습니다.
- source_word: ἀγαθῇ καρδίᾳ
  english_pob_choice: with a good heart
  chosen_korean: 선한 마음으로
  alternatives_korean:
  - 좋은 마음으로
  - 선한 심정으로
  - 올바른 마음으로
  lexicon: LSJ
  rationale: 직역의 ‘마음’을 유지하면서도 한국어에서 도덕적·내적 상태를 자연스럽게 드러내는 표현으로 옮겼습니다.
- source_word: ἐλάλησας
  english_pob_choice: you have spoken
  chosen_korean: 말한 것입니다
