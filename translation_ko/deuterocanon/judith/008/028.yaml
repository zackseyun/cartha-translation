  - 말해 왔습니다
  lexicon: LSJ
  rationale: 현재에 연결된 완료적 뉘앙스를 과도하게 강조하지 않으면서, 오지야스의 평가 진술로 자연스럽게 표현했습니다.
- source_word: ἀντιστήσεται
  english_pob_choice: will oppose
  chosen_korean: 맞설 자는 아무도 없습니다
