translation:
  language: ko
  text: 오지아스가 그녀에게 말했습니다. “당신이 하신 모든 말씀은 선한 마음으로[a] 하신 말씀입니다. 당신의 말에 맞설 사람은 아무도 없을 것입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘선한 마음으로’입니다. 이는 단순히 말을 잘했다는 뜻이 아니라, 진실하고 바른 의도에서 말했음을 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάντα ὅσα εἶπας
