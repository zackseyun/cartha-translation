  - 대적할 자는 아무도 없습니다
  lexicon: LSJ
  rationale: 말에 대한 반박·저항의 뜻을 한국어에서 가장 자연스럽게 드러내는 방향으로 풀었습니다.
- source_word: Ὀζείας
