  - severity: high
    issue: ‘그녀의 과부 신분의 옷이 그녀에게 있었습니다’
    rationale: ἦν ἐπʼ αὐτῆς의 ‘그녀 위에 있었다’, 곧 ‘입고 있었다’라는 정태적 의미를 한국어답게 전달하지 못하며 표현도 부자연스럽습니다.
