  - 자루천
  - 애도용 베옷
  lexicon: LSJ
  rationale: σάκκος의 통상적 성경적 의미는 애도와 겸손의 표지인 거친 천이므로, 한국어에서는 이해가 쉬운 ‘베옷’이 가장 자연스럽습니다.
- source_word: τὰ ἱμάτια τῆς χηρεύσεως αὐτῆς
  english_pob_choice: the garments of her widowhood
  chosen_korean: 그녀의 과부 신분의 옷
  alternatives_korean:
  - 그녀의 과부의 옷
  - 과부 됨의 옷
  - 과부 신분을 나타내는 옷
  lexicon: LSJ
  rationale: χηρεύσεως는 단순 감정이 아니라 ‘과부 됨’이라는 상태를 가리키므로, ‘과부 신분’으로 옮겨 상태 표지를 살렸습니다.
theological_decisions:
- issue: 과부의 옷이 ‘그녀에게 있었습니다’라는 종결의 상태 표현
  chosen_reading: ‘옷이 그녀에게 있었습니다’로 상태 지속을 살려, 단순한 착용 묘사보다 그녀의 애도 정체성이 계속 유지됨을 드러냈습니다.
  alternative_readings:
  - ‘그녀는 과부의 옷을 입고 있었습니다’
  - ‘그녀는 과부의 옷을 걸치고 있었습니다’
  rationale: 헬라어 ἦν ἐπʼ αὐτῆς는 정태적 표현이므로, 동작보다 상태를 강조하는 번역이 원문의 뉘앙스를 더 잘 보존합니다.
  doctrine_reference: 문맥상 금식·애도·겸비의 표지에 관한 서술
