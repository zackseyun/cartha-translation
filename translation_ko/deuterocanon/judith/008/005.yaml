  verdict: revise
  source_fidelity: ‘자기만의’는 원문의 αὐτῇ(‘자신을 위하여’)보다 배타적인 의미를 더합니다. 또한 세 동사의 시제·상 관계상 ‘두르며’보다 완료된 서술인 ‘둘렀습니다’가 적절합니다. 마지막 절의 ἦν ἐπʼ αὐτῆς는 과부의 옷을 입고 있는 지속 상태를 뜻합니다.
  naturalness: ‘그녀의 과부 신분의 옷이 그녀에게 있었습니다’는 현대 표준 한국어로 매우 부자연스럽고, 합쇼체 서술에도 맞지 않습니다. ‘과부의 옷을 입고 있었습니다’가 자연스럽고 원문의 상태성을 충실히 전달합니다.
  terminology: σκηνή는 ‘장막’, σάκκος는 ‘베옷’으로 옮길 수 있습니다. τὰ ἱμάτια τῆς χηρεύσεως는 ‘과부의 옷’이 자연스럽고 의미상 충분합니다. 각주 표지는 해당 어구 바로 뒤에 배치해야 합니다.
