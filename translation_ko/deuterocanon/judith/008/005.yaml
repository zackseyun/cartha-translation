translation:
  language: ko
  text: 그리고 그녀는 집 지붕 위에[a] 자신을 위하여 장막을 만들고, 허리에 베옷을 둘렀으며[b], 과부의 옷을 입고 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: δώμα는 이 문맥에서 집의 평평한 지붕 공간을 가리킵니다. ‘옥상’ 또는 ‘지붕 위’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: σάκκος는 고대 근동과 성경에서 애도, 슬픔, 또는 굴욕의 표지로 사용한 거친 천입니다.
    reason: cultural_note
lexical_decisions:
- source_word: σκηνὴν
  english_pob_choice: tent
  chosen_korean: 장막
