  text: And she made for herself a tent on the roof of her house[a], and put sackcloth around her waist[b], and the garments of her widowhood were upon her.
  footnotes:
  - marker: a
    text: Or 'on the rooftop' or 'on the housetop'; the Greek refers to the flat roof area of the house.
    reason: lexical_alternative
  - marker: b
    text: Sackcloth was coarse cloth worn as a sign of mourning, grief, or humiliation.
    reason: cultural_note
translation:
  language: ko
  text: 그리고 그녀는 집 지붕 위에 자기만의 장막을 만들고, 자기 허리에 베옷을 두르며, 그녀의 과부 신분의 옷이 그녀에게 있었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: δώμα는 이 문맥에서 평평한 지붕 공간을 가리켜, ‘옥상’이나 ‘지붕 위’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: σάκκος는 고대 근동과 성경에서 애도, 슬픔, 굴욕의 표지로 입던 거친 천입니다.
    reason: cultural_note
lexical_decisions:
- source_word: σκηνὴν
  english_pob_choice: tent
  chosen_korean: 장막
  alternatives_korean:
  - 텐트
  - 천막
  - 초막
  lexicon: LSJ
  rationale: ἡ σκηνή는 임시 거처를 뜻하므로, 현대 한국어에서는 ‘장막’이 ‘텐트’보다 더 성경적이면서도 본문의 별도 거처 의미를 잘 살립니다.
- source_word: ἐπὶ τοῦ δώματος
  english_pob_choice: on the roof
  chosen_korean: 집 지붕 위에
  alternatives_korean:
  - 옥상에
  - 지붕 위에
  - 집의 지붕 위에
  lexicon: LSJ
  rationale: δώμα는 평평한 지붕 공간을 가리키므로, ‘집 지붕 위에’로 옮겨 건축적 의미를 분명히 했습니다.
- source_word: σάκκον
  english_pob_choice: sackcloth
  chosen_korean: 베옷
  alternatives_korean:
  - 굵은 베
  - 자루천
  - 애도용 베옷
  lexicon: LSJ
  rationale: σάκκος의 통상적 성경적 의미는 애도와 겸손의 표지인 거친 천이므로, 한국어에서는 이해가 쉬운 ‘베옷’이 가장 자연스럽습니다.
- source_word: τὰ ἱμάτια τῆς χηρεύσεως αὐτῆς
  english_pob_choice: the garments of her widowhood
  chosen_korean: 그녀의 과부 신분의 옷
  alternatives_korean:
  - 그녀의 과부의 옷
  - 과부 됨의 옷
  - 과부 신분을 나타내는 옷
  lexicon: LSJ
  rationale: χηρεύσεως는 단순 감정이 아니라 ‘과부 됨’이라는 상태를 가리키므로, ‘과부 신분’으로 옮겨 상태 표지를 살렸습니다.
theological_decisions:
- issue: 과부의 옷이 ‘그녀에게 있었습니다’라는 종결의 상태 표현
  chosen_reading: ‘옷이 그녀에게 있었습니다’로 상태 지속을 살려, 단순한 착용 묘사보다 그녀의 애도 정체성이 계속 유지됨을 드러냈습니다.
  alternative_readings:
  - ‘그녀는 과부의 옷을 입고 있었습니다’
  - ‘그녀는 과부의 옷을 걸치고 있었습니다’
  rationale: 헬라어 ἦν ἐπʼ αὐτῆς는 정태적 표현이므로, 동작보다 상태를 강조하는 번역이 원문의 뉘앙스를 더 잘 보존합니다.
  doctrine_reference: 문맥상 금식·애도·겸비의 표지에 관한 서술
