  rationale: ἡ σκηνή는 임시 거처를 뜻하므로, 현대 한국어에서는 ‘장막’이 ‘텐트’보다 더 성경적이면서도 본문의 별도 거처 의미를 잘 살립니다.
- source_word: ἐπὶ τοῦ δώματος
