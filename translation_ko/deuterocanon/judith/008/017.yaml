  source_fidelity: 초안은 διόπερ, 구원의 원천, 기다림, 도움을 위한 하나님께의 호소, 들으심, 그리고 하나님의 기쁘심에 따른 조건을 대체로 충실히 반영합니다. 다만 조건절을 문장 끝에 분리한 방식은 수식 범위가 다소 느슨하며, ‘그분 마음에 들면 말입니다’는 원문의 비인칭적 조건 표현과 격식 있는 문체에 비해 구어적입니다.
  naturalness: ‘우리에게 도움을 베풀어 주시도록 그분께 부르짖읍시다’는 현대 한국어에서 자연스럽게 기도적 호소를 나타냅니다. ‘그분 마음에 들면 말입니다’는 합쇼체 본문 안에서 대화체적이고 어색하므로 ‘그것이 그분께 기쁘다면’으로 고칩니다. 조건절을 ‘들으실 것입니다’ 바로 앞에 배치하여 의미 관계를 분명히 합니다.
  terminology: ‘구원’은 σωτηρία의 신학적 무게와 본문의 하나님의 구원 행위를 적절히 보존합니다. ‘목소리’는 φωνή의 문자적 의미를 유지합니다. 현행 각주 b는 본문과 동일한 표현을 다시 ‘직역’으로 제시할 뿐 실질적인 대안을 제공하지 않으므로 삭제합니다.
