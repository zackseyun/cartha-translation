translation:
  language: ko
  text: 그러므로 그분에게서 오는 구원을 기다리면서, 우리를 도우시도록 그분을 부르짖읍시다. 그러면 그분께서 우리의 목소리를 들으실 것입니다[b], 그것이 그분 마음에 들면 말입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 직역하면 ‘우리의 목소리를 들으실 것입니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: διόπερ
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 그러니까
  - 이러므로
  lexicon: LSJ
  rationale: 앞선 논지를 받아 결론을 이끄는 접속사이므로, 현대 한국어에서 가장 자연스럽고 격식 있는 ‘그러므로’로 옮겼습니다.
- source_word: ἀναμένοντες τὴν παρ' αὐτοῦ σωτηρίαν
  english_pob_choice: while we wait for the salvation that comes from him
  chosen_korean: 그분에게서 오는 구원을 기다리면서
  alternatives_korean:
  - 그분에게서 오는 спасение을 기다리며
  - 그분으로부터의 구원을 기다리면서
  lexicon: BDAG
  rationale: ἀναμένοντες의 진행 중인 기대를 ‘기다리면서’로 살리고, παρ' αὐτοῦ는 원천을 나타내므로 ‘그분에게서 오는’으로 직접 반영했습니다.
- source_word: ἐπικαλεσώμεθα αὐτὸν εἰς βοήθειαν ἡμῶν
  english_pob_choice: let us call on him to help us
  chosen_korean: 우리를 도우시도록 그분을 부르짖읍시다
  alternatives_korean:
  - 그분께 도움을 청합시다
  - 우리를 돕도록 그분께 부르짖읍시다
  lexicon: BDAG
  rationale: ἐπικαλεσώμεθα는 기도적 호소를 뜻하므로 ‘부르짖읍시다’로 살리고, εἰς βοήθειαν ἡμῶν은 목적을 드러내는 ‘우리를 도우시도록’으로 풀었습니다.
- source_word: εἰσακούσεται τῆς φωνῆς ἡμῶν
  english_pob_choice: he will hear our voice
  chosen_korean: 그분께서 우리의 목소리를 들으실 것입니다
  alternatives_korean:
  - 그분께서 우리의 소리를 들으실 것입니다
  - 그분께서 우리의 부르짖음을 들으실 것입니다
  lexicon: BDAG
  rationale: φωνή의 기본 의미인 ‘목소리’를 유지해 POB의 문자성을 따랐고, 기도 응답의 뉘앙스는 ‘들으실 것입니다’에 담았습니다.
- source_word: ἐὰν ἦν αὐτῷ ἀρεστόν
  english_pob_choice: if it is pleasing to him
  chosen_korean: 그것이 그분 마음에 들면 말입니다
  alternatives_korean:
  - 그것이 그분께 기쁘면 말입니다
  - 그분께서 좋게 여기시면 말입니다
  lexicon: BDAG
  rationale: ἀρεστόν은 ‘마음에 들다/기쁘다’의 뉘앙스를 가지므로, 하나님의 뜻에 대한 겸손한 조건문을 현대 한국어로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: σωτηρία의 번역어 선택
  chosen_reading: 구원
  alternative_readings:
  - 구출
  - 건짐
  rationale: 유딧서의 상황은 긴급한 구출이지만, 본문의 신학적 무게를 살리기 위해 ‘구원’을 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Translation philosophy §1, §5; contested terms principle'
