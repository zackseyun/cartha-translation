  text: Then Uzziah and the rulers said to her[a], “Go in peace, and may the Lord God go before you for vengeance on our enemies.”
  footnotes:
  - marker: a
    text: Or 'for avenging our enemies' / 'for vindication against our enemies.' The Greek term can denote avenging action or vindication, but here the wartime context favors 'vengeance.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 우찌야와 지도자들이 그녀에게 말했습니다. 「평안히 가십시오. 그리고 주 하나님께서 원수들에 대한 보복을 위하여 당신보다 앞서 가시기를 바랍니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘원수들에 대한 보복’ / ‘원수들에 대한 변호(혹은 변증)’. 그리스어 ἐκδίκησις는 응징과 변호의 의미를 모두 가질 수 있으나, 여기서는 전쟁 문맥상 ‘보복’이 더 적절합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὀζίας
  english_pob_choice: Uzziah
  chosen_korean: 우찌야
  alternatives_korean:
  - 웃시야
  - 오지아스
  lexicon: 고유명사 표기
  rationale: 그리스어형 Ozias보다 한국어 음역으로 옮기되, 유다 왕 이름으로 널리 알려진 전승형과의 혼동을 피하면서도 현대식 표기를 유지했습니다.
- source_word: οἱ ἄρχοντες
  english_pob_choice: the rulers
  chosen_korean: 지도자들
  alternatives_korean:
  - 통치자들
  - 관리들
  lexicon: BDAG
  rationale: 문맥상 공동체의 권위자들이며, 한국어에서는 ‘지도자들’이 직무를 과도하게 한정하지 않으면서도 자연스럽습니다.
- source_word: Πορεύου εἰς εἰρήνην
  english_pob_choice: Go in peace
  chosen_korean: 평안히 가십시오
  alternatives_korean:
  - 평안 가운데 가십시오
  - 평안히 가세요
  lexicon: BDAG
  rationale: 그리스어의 관용적 작별 인사를 한국어에서는 자연스러운 축복형 명령으로 옮겼습니다. ‘평안히’가 결과/상태를 함께 담아냅니다.
- source_word: Κύριος ὁ θεός
  english_pob_choice: the Lord God
  chosen_korean: 주 하나님
  alternatives_korean:
  - 주님 하나님
  - 주이신 하나님
  lexicon: BDAG
  rationale: κύριος와 θεός의 결합을 한국어의 통상적 경건 표현인 ‘주 하나님’으로 옮기되, 본문이 직접 제공하는 칭호를 유지했습니다.
- source_word: εἰς ἐκδίκησιν
  english_pob_choice: for vengeance
  chosen_korean: 보복을 위하여
  alternatives_korean:
  - 복수를 위하여
  - 원수 갚음을 위하여
  - 보응을 위하여
  lexicon: BDAG
  rationale: 전쟁 상황에서의 강한 응징 의미를 살리되, 한국어에서는 ‘보복’이 ‘전후의 공의로운 응징’보다 더 직접적으로 대응합니다. 다만 도덕적 정당화로 약화시키지 않도록 ‘위하여’를 살렸습니다.
- source_word: τῶν ἐχθρῶν ἡμῶν
  english_pob_choice: against our enemies
  chosen_korean: 원수들에 대한
  alternatives_korean:
  - 우리의 원수들에 대한
  - 원수들에 대하여
  lexicon: BDAG
  rationale: ἐκδίκησις의 목적 대상을 한국어에서는 ‘~에 대한’으로 자연스럽게 연결했습니다. ‘원수들’은 적대적 관계를 분명히 드러냅니다.
theological_decisions:
- issue: εἰς ἐκδίκησιν의 강도 보존
  chosen_reading: ‘보복’으로 번역해 군사적·심판적 뉘앙스를 유지했습니다.
  alternative_readings:
  - ‘징벌’
  - ‘보응’
  - ‘원수 갚음’
  rationale: 본문은 적대적 상황에서 하나님의 선행과 응징을 함께 말하므로, 의미를 누그러뜨리는 중립어보다 강한 어휘가 본문 의도를 더 정확히 전달합니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: divine vengeance / vindication'
