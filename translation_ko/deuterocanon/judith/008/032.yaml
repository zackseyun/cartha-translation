  verdict: revise
  source_fidelity: The draft accurately conveys Judith's speech, the prospective act, and its enduring reach. However, "그러면" can make Judith's future action sound conditional upon the audience's listening, whereas the Greek coordinates an imperative and a future declaration. The masculine plural υἱοῖς should be retained as "아들들에게" in the main text under the project's gender-accurate policy; its possible collective force can be explained in a note.
  naturalness: '"세대에서 세대로 미칠" is natural modern formal Korean and conveys the idiomatic long-term reach of εἰς γενεὰς γενεῶν. Removing "그러면" also produces a more direct and natural sequence of commands and declaration. Footnote markers should be attached to the words they explain, rather than all being placed after the closing quotation mark.'
  terminology: '"유디트," "민족," "일," and "행하겠습니다" are appropriate. "우리 민족의 아들들에게" is a source-transparent rendering of υἱοῖς τοῦ γένους ἡμῶν; the note preserves the possible collective sense without replacing the masculine wording in the text.'
  issues:
  - severity: medium
    issue: '"그러면" introduces a conditional or consequential relation not explicit in the Greek.'
    rationale: καὶ ... Ἀκούσατέ μου, καὶ ποιήσω simply joins the appeal to listen with Judith's declaration that she will act. Korean can preserve this without implying that their listening is a condition.
  - severity: medium
    issue: '"자손들에게" neutralizes the explicitly masculine plural υἱοῖς in the main text.'
    rationale: Although υἱοῖς may function collectively in context, the source wording is "sons." The collective possibility belongs in a footnote, while the main text should retain "아들들에게."
  - severity: low
