  yaml_path: translation/deuterocanon/judith/008/032.yaml
  text: And Judith said to them[a], “Listen to me[c][b], and I will do a deed that will reach to generation after generation among the sons of our people.”
  footnotes:
  - marker: a
    text: Or 'Hear me.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'to generations of generations,' an idiom meaning enduring impact across successive generations.
    reason: lexical_alternative
  - marker: c
    text: Or 'the children/descendants of our people.' The Greek reads 'sons,' which may function collectively.
    reason: lexical_alternative
translation:
  language: ko
  text: 유디트가 그들에게 말했습니다. 「내 말을 들으십시오[a]. 나는 우리 민족의 아들들에게[c] 세대에서 세대로[b] 미칠 일을 하나 행하겠습니다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내게 귀를 기울이십시오.’
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘세대들의 세대들’로, 잇따르는 세대들에 걸친 지속적인 영향을 나타내는 관용구입니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 ‘우리 민족의 아들들에게’입니다. 여기서 ‘아들들’은 집합적으로 우리 민족의 자손 또는 후손을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀκούσατέ μου
  english_pob_choice: Listen to me
  chosen_korean: 내 말을 들으십시오
  alternatives_korean:
  - 제 말을 들으십시오
  - 들으십시오
  lexicon: BDAG
  rationale: 직접 명령형의 청자를 향한 주의를 한국어 자연문으로 살리기 위해 ‘듣다’보다 ‘내 말을 들으십시오’를 택했습니다. 영어 POB의 ‘Listen to me’처럼 화자의 발화를 분명히 합니다.
- source_word: ποιήσω πρᾶγμα
  english_pob_choice: I will do a deed
  chosen_korean: 나는 … 일을 하나 행하겠습니다
  alternatives_korean:
  - 나는 … 한 일을 하겠습니다
  - 나는 … 행동을 하겠습니다
  lexicon: BDAG
  rationale: πρᾶγμα은 ‘일/사건/행위’ 범위가 넓으나, 여기서는 유디트가 실제로 행할 구체적 행동을 예고하므로 ‘일 하나 행하겠습니다’로 자연스럽고 목적성 있게 옮겼습니다.
- source_word: εἰς γενεὰς γενεῶν
  english_pob_choice: to generation after generation
  chosen_korean: 세대에서 세대로
  alternatives_korean:
  - 대대로
  - 세대의 세대로
  lexicon: LEH
  rationale: 반복을 강조하는 관용구를 한국어의 ‘세대에서 세대로’로 옮겨, 지속성과 연속성을 드러내면서도 원문의 반복감을 유지했습니다.
- source_word: υἱοῖς τοῦ γένους ἡμῶν
  english_pob_choice: the sons of our people
  chosen_korean: 우리 민족의 자손들에게
  alternatives_korean:
  - 우리 민족의 아들들에게
  - 우리 백성의 자손들에게
  lexicon: BDAG
  rationale: 문자적으로는 ‘아들들’이지만, 한국어에서는 집단 전체를 가리키는 문맥상 ‘자손들’이 더 자연스럽고, 영어 POB 주석이 인정한 집합적 의미를 살리면서도 성별 한정 느낌을 과도하게 만들지 않습니다.
theological_decisions:
- issue: 세대 누적 표현의 범위
  chosen_reading: ‘세대에서 세대로’로 장구한 지속성과 전승 효과를 표현했습니다.
  alternative_readings:
  - ‘대대로’
  - ‘세대의 세대로’
  rationale: 원문의 εἰς γενεὰς γενεῶν은 단순한 시간표현이 아니라 후대에까지 미치는 영향의 관용구이므로, 지속적 전승의 뉘앙스를 보존하는 표현을 택했습니다.
  doctrine_reference: DOCTRINE.md §3 Source transparency
- issue: 남성 복수 υἱοῖς의 처리
  chosen_reading: 집합적 의미를 살려 ‘자손들’로 옮겼습니다.
  alternative_readings:
  - ‘아들들’
  - ‘자녀들’
  rationale: 그리스어의 남성 복수 형태는 유지해야 하나, 한국어 본문에서는 독자가 자연스럽게 공동체 전체를 이해하도록 집합명사로 풀어 썼습니다. 이는 성별 정확성과 문맥 자연성을 함께 고려한 선택입니다.
  doctrine_reference: DOCTRINE.md §4 Gender-accurate over gender-neutral
