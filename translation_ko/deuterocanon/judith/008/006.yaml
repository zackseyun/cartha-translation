revisions:
- from: 그는 과부로 지내는 동안 모든 날에 금식하였는데, 안식일 전날과 안식일과 초하루 전날과 절기들과 이스라엘 집의 기쁨의 날들은 제외하였습니다.[a]
  to: 그녀는 과부로 지내는 모든 날에 금식하곤 하였습니다. 다만 안식일 전날들과 안식일들, 초하루 전날들, 절기들, 그리고 이스라엘 집의 기쁨의 날들에는 금식하지 않았습니다.[a]
  rationale: 여성 지시어를 바로잡고, 미완료 과거의 습관성을 ‘금식하곤 하였습니다’로 드러냈습니다. 또한 예외 목록을 금식하지 않은 날로 명시하여 χωρὶς의 배제 의미를 자연스럽고 정확하게 표현했습니다. 달력 관련 용어와 ‘이스라엘 집’이라는 성경적 표현은 유지했습니다.
