  lexicon: BDAG
  rationale: 과거의 습관적 행위를 자연스러운 서술로 옮기되, 반복 동작임을 드러내기 위해 ‘금식하였는데’로 처리했습니다.
- source_word: πάσας τὰς ἡμέρας τῆς χηρεύσεως αὐτῆς
  english_pob_choice: all the days of her widowhood
  chosen_korean: 과부로 지내는 동안 모든 날
  alternatives_korean:
  - 과부 생활의 모든 날
  - 과부 된 기간 내내
  lexicon: LSJ
  rationale: ‘widowhood’의 기간적 의미를 살려, 단순한 신분 표지가 아니라 과부로 지내는 전체 기간을 나타내도록 옮겼습니다.
- source_word: προσαββάτων
  english_pob_choice: the days before Sabbaths
  chosen_korean: 안식일 전날
  alternatives_korean:
  - 안식일들 앞의 날들
  - 안식일 전의 날들
  lexicon: LSJ
  rationale: 문자적으로는 ‘안식일 앞의 날들’이지만, 한국어에서 가장 자연스럽고 본문의 시간관계를 분명히 드러내는 표현으로 옮겼습니다.
- source_word: προνουμηνιῶν
  english_pob_choice: the days before new moons
  chosen_korean: 초하루 전날
  alternatives_korean:
  - 새달 전날
  - 삭일 전날
  lexicon: LSJ
  rationale: 달의 새 시작을 가리키는 표현을 한국어 성경 문맥에서 이해되기 쉬운 ‘초하루’로 옮기되, 전날이라는 시간관계를 유지했습니다.
- source_word: χαρμοσυνῶν
  english_pob_choice: celebrations
  chosen_korean: 기쁨의 날들
  alternatives_korean:
  - 즐거운 날들
  - 경축일들
  lexicon: LSJ
  rationale: 명사의 뉘앙스가 단순한 행사보다 ‘기쁨/환희의 때’를 가리키므로, 절기들과 병렬되는 별도 항목으로 ‘기쁨의 날들’이라 옮겼습니다.
theological_decisions:
- issue: 금식 예외의 성격
  chosen_reading: 본문은 유딧이 과부로 지내는 동안 금식하는 삶을 살았지만, 공동체의 안식일·초하루·절기 같은 거룩하고 기쁜 날에는 그 금식이 중지되었다고 읽었습니다.
  alternative_readings:
  - 열거된 날들도 금식의 대상이라고 볼 가능성
  - ‘제외하였습니다’를 느슨하게 읽어 단순 병치를 보는 해석
  rationale: χωρὶς의 배제 의미와 열거된 절기적 맥락을 따라, 금식의 일반 규칙과 예외를 분명히 구분했습니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: 달력 용어의 번역 방식
  chosen_reading: 후대의 기술적 예식 용어를 덧씌우지 않고, 본문이 말하는 ‘안식일 전날’과 ‘초하루 전날’로 직접 옮겼습니다.
  alternative_readings:
  - ‘준비일’과 같은 기술 용어 사용
  - 유대 절기 용어를 음차 위주로 처리
  rationale: 그리스어의 복합형이 가리키는 시간적 관계를 드러내는 것이 우선이므로, 한국어 독자가 즉시 이해할 수 있는 설명적 번역을 택했습니다.
  doctrine_reference: Translation philosophy §1, §6
