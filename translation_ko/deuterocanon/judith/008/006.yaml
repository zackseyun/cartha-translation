  text: And she fasted all the days of her widowhood[a], except the days before Sabbaths and Sabbaths and the days before new moons and festivals and celebrations of the house of Israel.
  footnotes:
  - marker: a
    text: Or, more literally, “apart from the days before Sabbaths and Sabbaths and the days before new moons.” The Greek uses prepositional compounds for the days preceding those observances.
    reason: lexical_alternative
translation:
  language: ko
  text: 그녀는 과부로 지내는 모든 날에 금식하곤 하였습니다. 다만 안식일 전날들과 안식일들, 초하루 전날들, 절기들, 그리고 이스라엘 집의 기쁨의 날들에는 금식하지 않았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면, “안식일 전날들과 안식일들, 초하루 전날들을 제외하고”입니다. 그리스어는 안식일과 초하루에 앞선 날들을 가리키는 전치사 결합형을 사용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνήστευε
  english_pob_choice: she fasted
  chosen_korean: 금식하였는데
  alternatives_korean:
