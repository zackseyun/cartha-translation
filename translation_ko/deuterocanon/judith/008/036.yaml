  lexicon: LSJ
  rationale: 이 분사형은 주동사보다 앞선 동작을 나타내므로, 한국어에서는 자연스럽게 선행 동작을 보여 주는 ‘돌아서서’로 옮겼습니다.
- source_word: σκηνῆς
