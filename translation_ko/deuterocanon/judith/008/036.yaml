  - 장막
  lexicon: LSJ
  rationale: 문맥상 예배용 ‘장막’이 아니라 일반적인 거처/임시 공간을 가리키므로, 현대 한국어에서 가장 자연스럽고 직접적인 ‘천막’이 적절합니다.
