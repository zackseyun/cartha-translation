  lexicon: LSJ
  rationale: διατάξις는 배열·질서·지정된 위치를 아우를 수 있으며, 여기서는 사람들의 정해진 위치로 돌아감을 가리키므로 ‘지정된 자리’가 가장 무리 없습니다.
