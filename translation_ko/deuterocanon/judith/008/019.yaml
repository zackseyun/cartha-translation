review_pass:
  verdict: revise
  source_fidelity: ‘큰 참상을 당해 쓰러졌습니다’는 전쟁의 비극을 전달하지만, πτῶμα μέγα가 가리키는 대규모 죽임/전사라는 뜻이 ‘참상’에서는 다소 넓고 약해집니다. ‘큰 살육을 당해 쓰러졌습니다’가 ἔπεσον과 πτῶμα μέγα의 전장 죽음 이미지를 더 충실히 보존합니다. 그 밖에 수동형 ‘넘겨졌고’, 인과 표현, ‘우리 원수들 앞에서’는 원문에 충실합니다.
  naturalness: 수정문은 현대 표준 한국어 합쇼체로 자연스럽습니다. ‘큰 살육을 당해 쓰러졌습니다’는 다소 엄숙한 성서 문체이나, 전쟁 서술과 본문의 격식에 적절합니다.
  terminology: ‘칼과 약탈에 넘겨졌고’는 εἰς ῥομφαίαν καὶ εἰς διαρπαγήν의 병렬과 수동성을 잘 살립니다. ‘우리 조상들’은 한국어에서 역사적 집단을 자연스럽게 가리키며, ‘우리 원수들’도 ἐχθρῶν에 적합합니다.
  issues:
  - severity: medium
    issue: πτῶμα μέγα의 ‘큰 참상’ 번역이 죽임/시체의 집단적 의미를 충분히 특정하지 않습니다.
    rationale: πτῶμα는 문맥상 단순한 재난이나 참상보다 쓰러져 죽은 이들의 큰 무리, 곧 대규모 살육을 나타냅니다. ‘참상’은 파괴·고난 일반도 뜻할 수 있으므로 전사(戰死)의 의미가 약해집니다.
  revised_text: 이 때문에 우리 조상들은 칼과 약탈에 넘겨졌고, 우리 원수들 앞에서 큰 살육을 당해 쓰러졌습니다.
  revised_footnotes:
  - marker: a
    text: 그리스어 πτῶμα μέγα는 직역하면 ‘큰 쓰러짐’ 또는 ‘큰 시체 더미’에 가까운 압축된 표현으로, 여기서는 많은 사람이 죽임을 당한 큰 살육을 가리킵니다.
    reason: lexical_alternative
  revision_rationale: ‘큰 참상’을 ‘큰 살육’으로 고쳐 πτῶμα μέγα의 대규모 죽음이라는 의미를 분명히 했습니다. 각주에서는 그리스어 표현의 압축성과 가능한 직역적 뉘앙스를 밝혀, 본문을 부자연스럽게 직역하지 않으면서도 해석의 범위를 투명하게 제시했습니다.
