translation:
  language: ko
  text: 이 때문에 우리 조상들은 칼과 약탈에 넘겨졌고, 우리 원수들 앞에서 큰 참상을 당해 쓰러졌습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὧν χάριν
  english_pob_choice: For this reason
  chosen_korean: 이 때문에
  alternatives_korean:
  - 그러므로
  - 이런 까닭에
  lexicon: LSJ
  rationale: 원인의 연결 표현을 현대 한국어로 자연스럽게 옮기되, 앞선 문맥의 결과라는 인과성을 분명히 살렸습니다.
- source_word: ἐδόθησαν εἰς ῥομφαίαν καὶ εἰς διαρπαγήν
  english_pob_choice: were handed over to the sword and to plundering
  chosen_korean: 칼과 약탈에 넘겨졌고
  alternatives_korean:
  - 칼에 넘겨졌고 약탈에 넘겨졌으며
  - 칼과 노략질에 넘겨졌고
  lexicon: LSJ
  rationale: ἐδόθησαν의 수동적 ‘넘겨짐’과 전쟁·심판의 맥락을 살려 직역성을 유지했습니다. διαρπαγήν은 ‘약탈’로 옮겨 반복 구조를 간결하게 살렸습니다.
- source_word: οἱ πατέρες ἡμῶν
  english_pob_choice: our fathers
  chosen_korean: 우리 조상들은
  alternatives_korean:
  - 우리 아버지들은
  - 우리 선조들은
  lexicon: LSJ
  rationale: 문맥상 개별 아버지들보다 언약사적 선조를 가리키므로, 한국어에서는 자연스러운 역사적 표현인 ‘조상들’로 옮겼습니다.
- source_word: πτῶμα μέγα
  english_pob_choice: in a great slaughter
  chosen_korean: 큰 참상을 당해 쓰러졌습니다
  alternatives_korean:
  - 큰 살육 속에 쓰러졌습니다
  - 큰 학살로 쓰러졌습니다
  - 큰 시체떼처럼 쓰러졌습니다
  lexicon: LSJ
  rationale: 그리스어는 문자적으로는 매우 압축된 관용구이므로, 전투에서 대규모로 죽임을 당했다는 뜻을 드러내는 한국어로 풀어 옮겼습니다. ‘참상’은 비극성과 집단적 피해를 함께 전달합니다.
- source_word: ἐνώπιον τῶν ἐχθρῶν ἡμῶν
  english_pob_choice: before our enemies
  chosen_korean: 우리 원수들 앞에서
  alternatives_korean:
  - 우리 원수들 면전에서
  - 우리 적들 앞에서
  lexicon: LSJ
  rationale: ἐνώπιον의 공간적·대면적 의미를 자연스럽게 살려 ‘앞에서’로 번역했습니다.
theological_decisions:
- issue: 전쟁과 심판의 수동 표현
  chosen_reading: ‘넘겨졌고’로 번역해 외적 폭력만이 아니라 허용/내맡김의 뉘앙스를 보존했습니다.
  alternative_readings:
  - ‘주어졌고’로 단순화
  - ‘패배했으며’로 의역
  rationale: δίδωμι 수동은 단순한 전달이 아니라 적대 세력에게 내맡겨진 상황을 시사하므로, 전쟁 서술의 심판성까지 드러내는 표현을 택했습니다.
  doctrine_reference: DOCTRINE.md §1 Original-language primacy
- issue: πτῶμα μέγα의 해석
  chosen_reading: ‘큰 참상을 당해 쓰러졌습니다’로 대규모 전사/학살의 뜻을 한국어 관용으로 옮겼습니다.
  alternative_readings:
  - ‘큰 시체떼가 되었습니다’
  - ‘큰 살육이 되었습니다’
  rationale: 직역은 한국어에서 어색하고 의미가 흐려질 수 있어, 본문이 말하는 집단적 참사를 드러내면서도 지나친 해석을 피했습니다.
  doctrine_reference: DOCTRINE.md §6 Readable modern English
