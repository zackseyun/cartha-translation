  text: And she heard the evil words of the people against the ruler[a], because they had lost heart over the shortage of water; and she heard all the words that Ozias had spoken to them, that he had sworn to hand over the city to the Assyrians after five days.
  footnotes:
  - marker: a
    text: Or 'to surrender the city to the Assyrians.' The Greek literally says 'to hand over the city.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그녀는 백성들이 통치자에게 쏟아낸 악한 말들을 들었습니다. 그들은 물이 부족하여 낙심해 있었습니다. 또한 그녀는 오지아스가 그들에게 한 모든 말을 들었습니다. 그는 닷새 뒤에 그 도시를 앗수르 사람들에게 넘기겠다고 맹세했기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 본문의 ‘넘기다’는 그리스어 παραδώσειν의 문자적 의미를 살린 표현입니다. 문맥상 ‘도시를 항복시키다/인도하다’의 뜻으로 읽을 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ῥήματα ... τὰ πονηρά
  english_pob_choice: the evil words
  chosen_korean: 악한 말들
  alternatives_korean:
  - 악한 말
  - 나쁜 말
  - 악한 발언
  lexicon: BDAG
  rationale: ῥήματα는 구체적인 ‘말들’이고, τὰ πονηρά는 그 발화의 도덕적 색채를 강하게 드러내므로 ‘악한 말들’이 원문의 평가를 잘 유지합니다.
- source_word: ἄρχοντα
  english_pob_choice: ruler
  chosen_korean: 통치자
  alternatives_korean:
  - 지도자
  - 관리
  - 지배자
  lexicon: BDAG
  rationale: 여기서 ἄρχων은 특정 직함보다 일반적인 정치적 권위를 가리키므로, ‘통치자’가 넓고 자연스럽게 대응합니다.
- source_word: ὠλιγοψύχησαν ἐπὶ τῇ σπάνει τῶν ὑδάτων
  english_pob_choice: they had lost heart over the shortage of water
  chosen_korean: 물이 부족하여 낙심해 있었습니다
  alternatives_korean:
  - 물 부족 때문에 기가 꺾여 있었습니다
  - 물의 부족 때문에 의기소침해 있었습니다
  - 물이 모자라 마음이 약해져 있었습니다
  lexicon: BDAG
  rationale: ὠλιγοψύχησαν은 ‘마음이 약해지다/낙심하다’의 뜻이어서, 현대 한국어에서는 ‘낙심하다’가 가장 자연스럽고, σπάνει는 ‘부족’으로 옮기는 것이 상황을 분명히 합니다.
- source_word: παραδώσειν τὴν πόλιν
  english_pob_choice: to hand over the city
  chosen_korean: 그 도시를 ... 넘기겠다고
  alternatives_korean:
  - 그 도시를 ... 인도하겠다고
  - 그 도시를 ... 넘겨주겠다고
  - 그 도시를 ... 항복시키겠다고
  lexicon: BDAG
  rationale: παραδίδωμι는 문자적으로 ‘넘겨주다/넘기다’이므로, POB의 ‘hand over’를 살려 기술적 ‘항복’보다 원문에 더 밀착한 표현을 택했습니다.
- source_word: μετὰ ἡμέρας πέντε
  english_pob_choice: after five days
  chosen_korean: 닷새 뒤에
  alternatives_korean:
  - 다섯 날 뒤에
  - 다섯 날 후에
  - 다섯 날이 지난 뒤에
  lexicon: BDAG
  rationale: μετά + 대격은 시간상 ‘...후에’가 자연스러우므로, 한국어 관용에 맞는 ‘닷새 뒤에’로 옮겼습니다.
theological_decisions:
- issue: 이중 주어 반복과 인칭 유지
  chosen_reading: 두 번째 절에서도 이름을 반복하지 않고, 한국어에서도 ‘그녀는 ... 또한 그녀는 ...’로 같은 주어를 이어 갑니다.
  alternative_readings:
  - 두 번째에 ‘유딧은’이라고 다시 명시한다
  - 문장을 나눠 반복을 줄인다
  rationale: 그리스어는 두 번째 절에서도 동일한 주어를 이어 가며, 영어 POB도 최종적으로 ‘she heard’로 정리했습니다. 한국어에서도 불필요한 이름 반복 없이 서술 흐름을 보존하는 것이 원문에 더 가깝습니다.
  doctrine_reference: 원문 우선 원칙; 서술상의 주어 연속성 보존
- issue: 앗수르 사람들
  chosen_reading: Ἀσσυρίοις를 ‘앗수르 사람들’로 옮겨 고유명사의 민족적 대상을 드러냅니다.
  alternative_readings:
  - 앗시리아 사람들
  - 아시리아 사람들
  - 앗수르인들
  rationale: 고대 문맥에서는 국가명보다 민족/집단을 가리키는 용법이 자연스러워, 한국어에서도 ‘사람들’로 풀어 군사적 상대를 분명히 했습니다.
  doctrine_reference: 역사 서술의 지시 대상 보존
