  yaml_path: translation/deuterocanon/judith/008/015.yaml
  text: For if he is not willing to help us within these five days[a], he himself has the authority, in whatever days he wishes, to shelter us[b], or even to destroy us before our enemies.
  footnotes:
  - marker: a
    text: Or 'to protect us.' The Greek verb literally has the sense of covering, here in the sense of protective shelter.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'before the face of our enemies.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 만일 이 다섯 날 안에 우리를 도우려 하지 않으면, 그 자신이 언제든지 원하는 날에 우리를 덮어 주시거나, 심지어 우리의 원수들 앞에서 우리를 멸하실 권한을 가지십니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원어상 직역하면 ‘덮다’이지만, 여기서는 보호적 보호막의 의미입니다.
    reason: lexical_alternative
  - marker: b
    text: 원어상 ‘우리의 원수들의 얼굴 앞에서’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν μὴ βούληται
  english_pob_choice: if he is not willing
  chosen_korean: 만일 … 도우려 하지 않으면
  alternatives_korean:
  - 만일 … 하기를 원하지 않으면
  - 만일 … 의지가 없으면
  lexicon: BDAG
  rationale: βούλομαι의 의지·원함을 한국어에서 가장 자연스럽게 드러내면서, 단순한 능력 부족이 아니라 의지의 부재라는 점을 살렸습니다.
- source_word: ἐν ταῖς πέντε ἡμέραις
  english_pob_choice: within these five days
  chosen_korean: 이 다섯 날 안에
  alternatives_korean:
  - 이 다섯 날 동안
  - 이 다섯 날 이내에
  lexicon: BDAG
  rationale: 정해진 기한 안이라는 뜻을 반영해, 한국어로는 ‘안에’가 가장 직설적이고 문맥상 자연스럽습니다.
- source_word: σκεπάσαι
  english_pob_choice: to shelter us
  chosen_korean: 우리를 덮어 주시거나
  alternatives_korean:
  - 우리를 보호해 주시거나
  - 우리를 감싸 주시거나
  lexicon: BDAG
  rationale: 동사의 문자적 의미인 ‘덮다’를 살리되, 본문 문맥에서 보호의 뉘앙스가 있으므로 ‘덮어 주시다’로 옮겼습니다. ‘보호하다’는 의미는 분명하지만 원어의 이미지가 약해집니다.
- source_word: πρὸ προσώπου τῶν ἐχθρῶν ἡμῶν
  english_pob_choice: before our enemies
  chosen_korean: 우리의 원수들 앞에서
  alternatives_korean:
  - 우리의 원수들 면전에서
  - 우리의 원수들 눈앞에서
  lexicon: LEH
  rationale: 직역하면 ‘원수들의 얼굴 앞에서’이지만, 한국어에서는 ‘앞에서’가 공개적·노출된 상황을 자연스럽게 전합니다.
theological_decisions:
- issue: 하나님의 구원과 멸망에 대한 주권
  chosen_reading: 본문은 하나님이 인간이 정한 다섯 날 안에 돕지 않으실 경우에도, 원하시는 날에 우리를 덮어 주실 권한과 더 나아가 멸하실 권한까지 가지신다고 말합니다.
  alternative_readings:
  - 하나님이 직접 멸하신다기보다 원수들을 통해 멸망을 허락하신다는 식으로 완화할 수 있습니다.
  rationale: 그리스어는 ἐξουσία를 하나님께 돌리고, ‘덮어 주다’와 ‘멸하다’를 같은 주권 아래 병렬합니다. 따라서 두 동사의 긴장을 약화하지 않고 그대로 보존했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 3
