  naturalness: ‘그 자신이 … 권한을 가지십니다’와 ‘언제든지 원하는 날에’는 현대 표준 한국어 합쇼체에서 다소 어색합니다. ‘그분 자신에게는 … 권한이 있으십니다’ 및 ‘원하시는 어느 날에든지’가 강조와 의미를 자연스럽게 전달합니다.
  terminology: ‘멸하다’는 ὀλεθρεῦσαι의 엄중한 뜻을 적절히 보존합니다. σκεπάσαι는 문맥상 ‘보호해 주시다’가 자연스럽고, ‘덮다’라는 어휘적 이미지는 각주로 보완하는 것이 좋습니다. 각주는 해당 어구 바로 뒤에 배치해야 합니다.
