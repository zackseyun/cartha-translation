  to: 그분께서 만일 이 다섯 날 안에 우리를 도우려 하지 않으시면, 그분 자신에게는 원하시는 어느 날에든지 우리를 보호해 주시거나[a], 심지어 우리 원수들 앞에서[b] 우리를 멸하실 권한이 있으십니다.
  rationale: 보호를 뜻하는 σκεπάσαι를 자연스러운 한국어로 명료하게 옮기되, ‘덮다’라는 원어의 이미지는 각주에 보존했습니다. αὐτός의 강조와 ἐξουσία의 의미는 ‘그분 자신에게는 … 권한이 있으십니다’로 살렸고, 각주 표지를 해당 어구에 직접 연결했습니다. 하나님의 보호와 멸망에 관한 본문의 긴장은 완화하지 않았습니다.
