base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/008/021.yaml
  text: For if we are captured like this[a], all Judea will be brought low, and our holy things will be plundered[d][c][b], and he will require their profanation from our blood.
  footnotes:
  - marker: a
    text: Or 'when we are taken thus.' The Greek opening is syntactically awkward, but the sense is that if they are captured in this condition, disaster follows.
    reason: alternative_reading
  - marker: b
    text: '''Will sit down'' may imply being brought low or left helpless; the translation preserves the image of the Greek verb.'
    reason: lexical_alternative
  - marker: c
    text: Or 'their profanation' or 'the desecration of them.' The sense is the violation of the sacred things.
    reason: lexical_alternative
  - marker: d
    text: The Greek leaves the subject of 'will require' unstated; context likely implies God will call for an accounting for the desecration, at the cost of their blood.
    reason: alternative_reading
translation:
  language: ko
  text: 만일 우리가 이렇게 붙잡히면, 온 유대는 주저앉을 것이며, 우리의 거룩한 것들은 노략될 것이고, 우리의 피로 말미암아 그들의 모독에 대한 책임을 요구하실 것입니다.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘붙잡히면’은 그리스어의 어색한 문장 구조를 문맥에 맞게 풀어 옮긴 것입니다. 직역하면 ‘우리가 이같이 잡히는 때에/에’에 가깝습니다.
    reason: alternative_reading
  - marker: b
    text: ‘주저앉을’은 문자적 ‘앉다’를 살리면서도, 문맥의 굴욕·무기력의 뜻을 드러냅니다.
    reason: lexical_alternative
  - marker: c
    text: ‘거룩한 것들’은 성소 하나만이 아니라 성스러운 물건들과 예배 관련 대상들을 포괄할 수 있습니다.
    reason: lexical_alternative
  - marker: d
    text: ‘모독에 대한 책임을 요구하실 것입니다’는 ‘그들의 모독’을 더 직접적으로 옮기기보다, 신성모독에 대한 심판적 요구를 드러낸 표현입니다.
    reason: theological_note
lexical_decisions:
- source_word: ἐπ' ἐν τῷ λημφθῆναι ἡμᾶς οὕτως
  english_pob_choice: For if we are captured like this
  chosen_korean: 만일 우리가 이렇게 붙잡히면
  alternatives_korean:
  - 우리가 이런 식으로 붙들릴 때
  - 우리가 이렇게 사로잡히면
  lexicon: LSJ
  rationale: 문맥상 조건의 뜻이 분명하므로 ‘만일’로 옮기고, 군사적 상황에 맞게 ‘붙잡히면’을 써서 자연스럽게 살렸습니다.
- source_word: καθήσεται
  english_pob_choice: will be brought low / will sit down
  chosen_korean: 주저앉을 것이며
  alternatives_korean:
  - 낮아질 것이며
  - 앉아 있을 것이며
  lexicon: LSJ
  rationale: 직역 이미지인 ‘앉다’를 완전히 지우지 않으면서, 한국어에서 문맥상 드러나는 무기력·굴욕의 뉘앙스를 살렸습니다.
- source_word: τὰ ἅγια ἡμῶν
  english_pob_choice: our holy things
  chosen_korean: 우리의 거룩한 것들은
  alternatives_korean:
  - 우리의 성물들은
  - 우리의 거룩한 물건들은
  lexicon: LSJ
  rationale: 복수 중성의 넓은 의미를 따라 특정 성전 하나로 좁히지 않고, ‘거룩한 것들’로 포괄적으로 옮겼습니다.
- source_word: ζητήσει τὴν βεβήλωσιν αὐτῶν
  english_pob_choice: he will require their profanation
  chosen_korean: 그들의 모독에 대한 책임을 요구하실 것입니다
  alternatives_korean:
  - 그들의 모독을 요구하실 것입니다
  - 그들의 더럽힘을 물으실 것입니다
  lexicon: LSJ
  rationale: βεβήλωσις는 단순한 훼손보다 성스러운 것의 모독·신성모독을 뜻하므로, 한국어에서 자연스러운 법정적 표현인 ‘책임을 요구하다’로 그 뉘앙스를 살렸습니다.
- source_word: ἐκ τοῦ αἵματος ἡμῶν
  english_pob_choice: from our blood
  chosen_korean: 우리의 피로 말미암아
  alternatives_korean:
  - 우리의 피에서
  - 우리 피의 대가로
  lexicon: LSJ
  rationale: 직역의 경직됨을 피하면서도, 희생과 대가의 의미를 드러내는 한국어 관용 표현으로 옮겼습니다.
theological_decisions:
- issue: ζητήσει의 암시된 주어
  chosen_reading: 주어를 직접 ‘하나님’으로 적지 않고, ‘요구하실 것입니다’로 처리해 문맥상 신적 심판 가능성을 열어 두었습니다.
  alternative_readings:
  - 하나님께서 요구하실 것입니다
  - 그가 요구할 것입니다
  rationale: 그리스어는 주어를 명시하지 않으므로, 본문에 없는 대상을 확정적으로 삽입하지 않으면서도 심판적 긴장을 보존하는 번역이 적절합니다.
  doctrine_reference: 본문의 암시를 살리되, 해석을 단정하지 않는 원칙
- issue: καθήσεται의 비유적 이미지
  chosen_reading: ‘주저앉을’로 옮겨 굴욕과 무기력의 이미지를 보존했습니다.
  alternative_readings:
  - ‘낮아질’로 의역
  - ‘붕괴될’로 의역
  rationale: 직역 가능한 동작 이미지를 지키면서도, 한국어 독자가 문맥상 의도한 패배·무기력의 뜻을 이해할 수 있게 했습니다.
  doctrine_reference: 이미지 보존과 의미 명료화의 균형
