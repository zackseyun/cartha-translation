  verdict: revise
  source_fidelity: The draft accurately renders the divine title, the rebuke expressed by ἐξετάζετε, the negated object, and the enduring force of ἕως τοῦ αἰῶνος. However, its connective ‘하지만’ introduces an adversative relation not expressed by the Greek καί (‘and’).
  naturalness: The wording is otherwise clear and appropriately formal-polite. Replacing ‘하지만’ with ‘있으며’ preserves the source coordination while reading naturally in modern Korean.
  terminology: ‘전능하신 주’ appropriately represents κύριον Παντοκράτορα. ‘시험하다’ is a defensible contextual rendering of ἐξετάζετε, though its broader sense is helpfully retained in the note. ‘영원히’ appropriately conveys the idiomatic force of ἕως τοῦ αἰῶνος.
  issues:
  - severity: medium
    issue: ‘하지만’ adds an adversative connective absent from καὶ.
    rationale: 'The Greek links the clauses with simple coordination: ‘and now ... and ...’. The Korean adversative can suggest that the second clause contrasts with the first rather than states the consequence or accompanying rebuke.'
