  text: And now you are testing the Lord Almighty[b][a], and you will never understand anything.
  footnotes:
  - marker: a
    text: Or 'you are testing' or 'you are examining' the Lord Almighty.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'until the age.' The phrase means 'forever' or 'for all time.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 너희는 전능하신 주를 시험하고 있지만, 너희는 영원히 아무것도 이해하지 못할 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문은 ‘시험하다/살피다/조사하다’의 뉘앙스를 지닙니다.
    reason: lexical_alternative
  - marker: b
    text: 헬라어 관용구 ‘until the age’로, ‘영원히’의 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριον Παντοκράτορα
  english_pob_choice: the Lord Almighty
  chosen_korean: 전능하신 주
  alternatives_korean:
  - 전능하신 하나님
  - 주님 전능자
  - 전능하신 주님
  lexicon: LEH
  rationale: κύριος는 이 절에서 신적 호칭이므로 기본값인 ‘주’를 따르고, Παντοκράτωρ는 ‘전능하신’으로 옮겨 합성 호칭의 힘을 살렸습니다.
- source_word: ἐξετάζετε
  english_pob_choice: are probing
  chosen_korean: 시험하고
  alternatives_korean:
  - 살피고
  - 탐구하고
  - 조사하고
  lexicon: BDAG
  rationale: 문맥상 하나님을 분별하려 들며 따져 묻는 행위를 꾸짖는 말이므로, ‘시험하고’가 과도한 기술적 뉘앙스 없이 도전적·검증적 행위를 드러냅니다.
- source_word: οὐθὲν
  english_pob_choice: nothing
  chosen_korean: 아무것도
  alternatives_korean:
  - 무엇도
  - 전혀 아무것도
  lexicon: BDAG
  rationale: 부정 목적어를 현대 한국어로 자연스럽게 살려 ‘아무것도’로 옮겼습니다.
- source_word: ἕως τοῦ αἰῶνος
  english_pob_choice: forever / for all time
  chosen_korean: 영원히
  alternatives_korean:
  - 세상 끝까지
  - 끝없이
  - 영원토록
  lexicon: LEH
  rationale: 관용구의 지속성과 종결 불가능성을 가장 자연스럽게 전달하는 표준어 표현으로 옮겼습니다.
theological_decisions:
- issue: 하나님에 대한 인간의 무분별한 추궁을 어떻게 드러낼지
  chosen_reading: ‘전능하신 주를 시험하고 있지만’으로 옮겨, 인간이 하나님을 검증 대상으로 삼는 부적절함을 유지했습니다.
  alternative_readings:
  - ‘전능하신 주를 살피고 있지만’
  - ‘전능하신 주를 탐구하고 있지만’
  rationale: 본문은 단순한 지적 탐색이 아니라 하나님을 넘어 판단하려는 태도를 책망하므로, 한국어에서도 그 긴장을 약화시키지 않는 표현을 택했습니다.
  doctrine_reference: DOCTRINE.md §Preserve theological tension rather than resolve it
- issue: ἕως τοῦ αἰῶνος의 시간감
  chosen_reading: ‘영원히’로 옮겨, 이해 불가능함의 지속을 절대적 기간으로 표현했습니다.
  alternative_readings:
  - ‘세세토록’
  - ‘끝까지’
  rationale: 문맥은 일시적 무지라기보다 끝없는 이해 불능을 말하므로, 자연스러운 현대어로 영구성을 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: temporal idioms'
