  - 강우를
  lexicon: LSJ
  rationale: ὑετός는 단순히 비를 뜻하므로, 가장 직접적이고 자연스러운 '비'로 옮겼습니다.
- source_word: τῶν λάκκων ἡμῶν
  english_pob_choice: our cisterns
  chosen_korean: 우리의 물독들
  alternatives_korean:
