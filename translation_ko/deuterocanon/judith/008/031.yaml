  - 우리의 저수동이들
  lexicon: LSJ
  rationale: λάκκος는 여기서 물을 저장하는 용기/구덩이로 이해되며, 한국어 독자에게는 기능이 분명한 '물독들'이 가장 가까운 대응입니다.
- source_word: οὐκ ἐκλείψομεν ἔτι
  english_pob_choice: we will not perish any longer
  chosen_korean: 우리는 더 이상 모자라지 않을 것입니다
  alternatives_korean:
  - 우리는 더 이상 끊기지 않을 것입니다
  - 우리는 더 이상 실패하지 않을 것입니다
  - 우리는 더 이상 기아에 빠지지 않을 것입니다
  lexicon: BDAG
  rationale: ἐκλείπω는 '부족하다, 떨어지다, 끊어지다'의 뜻을 가지며, 문맥상 물 부족의 해소를 가리키므로 POB의 의미 판단에 따라 '더 이상 모자라지 않을 것입니다'로 자연스럽게 살렸습니다.
