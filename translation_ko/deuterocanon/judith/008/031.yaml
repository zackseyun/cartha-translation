translation:
  language: ko
  text: 이제 우리를 위해 기도해 주십시오. 당신이 경건한 여인이기 때문입니다. 그러면 주께서 비를 보내셔서 우리의 물독들을 채우실 것이며, 우리는 더 이상 모자라지 않을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “우리는 더 이상 부족하지 않을 것입니다” 혹은 “우리는 더 이상 모자라지 않을 것입니다.” 헬라어는 문자적으로 ‘우리는 더 이상 실패하지 않을 것입니다’라고 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: δεήθητι περὶ ἡμῶν
  english_pob_choice: pray for us
  chosen_korean: 우리를 위해 기도해 주십시오
  alternatives_korean:
