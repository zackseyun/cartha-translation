revisions:
- from: 이제 우리를 위해 기도해 주십시오. 당신이 경건한 여인이기 때문입니다. 그러면 주께서 비를 보내셔서 우리의 물독들을 채우실 것이며, 우리는 더 이상 모자라지 않을 것입니다.[a]
  to: 이제 우리를 위해 기도해 주십시오. 당신은 경건한 여인이시니, 주께서 비를 보내 우리 저수조들을 채우실 것이고, 우리는 더 이상 궁핍하지 않을 것입니다.[a]
  rationale: The revision corrects the concrete referent of λάκκοι, makes the final clause idiomatic Korean while preserving its contextual sense, removes an added inferential connector, and revises the note to reflect the semantic range of ἐκλείπω without forcing an unwarranted meaning such as physical perishing.
