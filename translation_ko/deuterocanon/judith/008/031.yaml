  - 우리를 위해 기도하십시오
  lexicon: BDAG
  rationale: δεήθητι는 간청의 뉘앙스가 있는 기도 요청이므로, 현대 한국어에서 자연스럽고 중보의 뜻이 분명한 표현으로 옮겼습니다.
- source_word: γυνὴ εὐσεβὴς
  english_pob_choice: a devout woman
  chosen_korean: 경건한 여인
  alternatives_korean:
  - 독실한 여인
  - 경건한 여자
  lexicon: BDAG
  rationale: εὐσεβής는 하나님을 향한 경건함을 가리키므로, 교회적 상투어보다 원뜻이 드러나는 '경건한 여인'을 택했습니다.
- source_word: τὸν ὑετόν
  english_pob_choice: rain
  chosen_korean: 비
  alternatives_korean:
