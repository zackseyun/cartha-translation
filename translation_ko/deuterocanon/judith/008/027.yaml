  text: For he did not test us by fire, as he did them, to examine their hearts; nor has he taken vengeance on us. Rather, the Lord scourges those who draw near to him for admonition.
  footnotes:
  - marker: a
    text: Or 'For he did not burn us as he did them, to test their hearts.' The Greek keeps the imagery of fire while using it in the sense of testing.
    reason: lexical_alternative
  - marker: b
    text: Or 'the Lord disciplines/chastens those who draw near to him.' The Greek verb is literally 'scourges,' preserving the severity of the corrective image.
    reason: lexical_alternative
translation:
  language: ko
  text: 그분은 그들을 하듯이 우리를 불로 시험하여 그들의 마음을 살피지 않으셨고, 우리에게는 복수를 행하지 않으셨습니다. 오히려 주님께서는 그분께 가까이 나아가는 이들을 훈계하십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘채찍질하다’입니다. 원문은 실제 폭력을 완곡하게 바꾸지 않고, 징계의 강도를 유지합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπύρωσεν
  english_pob_choice: tested ... by fire
  chosen_korean: 불로 시험하여
  alternatives_korean:
  - 불로 태워
  - 불로 연단하여
  - 불로 시련을 주어
  lexicon: LSJ
  rationale: 불의 이미지는 살리되, 문맥상 파괴적 소각이 아니라 시험의 의미이므로 ‘시험하다’로 옮겼습니다.
- source_word: εἰς ἔτασμόν τῆς καρδίας αὐτῶν
  english_pob_choice: to examine their hearts
  chosen_korean: 그들의 마음을 살피지 않으셨고
  alternatives_korean:
  - 그들의 마음을 시험하지 않으셨고
  - 그들의 마음을 살펴보지 않으셨고
  - 그들의 마음을 검증하지 않으셨고
  lexicon: LSJ
  rationale: ἔτασμός의 평가·조사 의미를 자연스러운 한국어 ‘살피다’로 반영하고, ‘마음’으로 ἡ καρδία의 내면성을 유지했습니다.
- source_word: ἐξεδίκησεν
  english_pob_choice: has he taken vengeance on
  chosen_korean: 복수를 행하지 않으셨습니다
  alternatives_korean:
  - 보복하지 않으셨습니다
  - 원수를 갚지 않으셨습니다
  - 징벌하지 않으셨습니다
  lexicon: LSJ
  rationale: 문맥의 대조가 ‘징계’가 아니라 ‘복수/보복’과의 대비이므로, ‘복수’로 강도를 유지했습니다.
- source_word: μαστιγοῖ
  english_pob_choice: scourges
  chosen_korean: 훈계하십니다
  alternatives_korean:
  - 채찍질하십니다
  - 매질하십니다
  - 징계하십니다
  lexicon: LSJ
  rationale: 직역의 잔혹성을 살릴 수 있으나 한국어 문장에서는 주된 목적어인 ‘ἐγγίζοντας αὐτῷ’와 결합할 때 ‘훈계하다’가 교정 목적을 분명히 드러내면서도 지나친 물리적 오해를 줄입니다.
- source_word: τοὺς ἐγγίζοντας αὐτῷ
  english_pob_choice: those who draw near to him
  chosen_korean: 그분께 가까이 나아가는 이들
  alternatives_korean:
  - 그분께 나아가는 이들
  - 그분께 다가오는 이들
  - 그분께 가까이 오는 자들
  lexicon: LSJ
  rationale: 하나님께 접근하는 종교적·관계적 뉘앙스를 ‘가까이 나아가다’로 살렸습니다.
theological_decisions:
- issue: 마지막 절의 징계 이미지를 얼마나 직접적으로 옮길지
  chosen_reading: ‘훈계하십니다’로 옮겨, 심판적 복수와 교정적 목적의 대비를 살렸습니다.
  alternative_readings:
  - 채찍질하십니다
  - 징계하십니다
  - 교정하십니다
  rationale: 원문 μαστιγοῖ는 매우 강한 이미지이지만, 문맥의 핵심은 복수가 아니라 교정이라는 점입니다. 한국어에서는 ‘훈계하다’가 목적을 가장 분명히 전달합니다.
  doctrine_reference: DOCTRINE.md §§1, 3, 6
