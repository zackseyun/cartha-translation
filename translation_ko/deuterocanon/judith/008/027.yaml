  source_fidelity: 현 번역은 첫 절의 문장 관계를 바꾸어, ‘그들을 불로 태워 그들의 마음을 시험한 것처럼 우리에게 복수하지 않으셨다’는 대조를 ‘우리를 불로 시험하여 그들의 마음을 살피지 않으셨다’로 옮겼습니다. 또한 μαστιγοῖ의 구체적인 ‘채찍질하다’ 이미지를 ‘훈계하다’로 약화했고, εἰς νουθέτησιν(훈계를/교훈을 위하여)을 번역에서 누락했습니다.
  naturalness: 수정문은 긴 대조 구문을 한국어의 자연스러운 ‘~것처럼 ~한 것은 아닙니다’ 구조로 처리하고, 현대 표준어 합쇼체를 유지합니다. ‘그분께 가까이 나아가는 이들’은 종교적 접근의 의미를 자연스럽게 보존합니다.
  terminology: ἐπύρωσεν은 불의 이미지를 보존하여 ‘불로 태우셨던’으로, ἐξεδίκησεν은 ‘복수하신’으로 옮겼습니다. μαστιγοῖ는 완화하지 않고 ‘채찍질하십니다’로 옮기며, νουθέτησιν은 ‘훈계하시기 위해’로 명시했습니다. ‘주님’은 Κύριος에 알맞습니다.
