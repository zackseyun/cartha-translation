  to: 그러나 여러분은 주 우리 하나님의 계획을 담보로 잡지 마십시오.[a] 하나님은 사람이 아니시니 위협을 받으실 분이 아니시며, 사람의 아들이 아니시니 설득되실 분도 아니십니다.[b]
  rationale: 원문의 대조 접속사, ‘주 우리 하나님의’ 수식 관계, 담보 비유, 그리고 두 수동 부정사의 병렬을 보존하도록 고쳤습니다. ‘사람의 아들’은 원문의 표현을 유지하되, 주석으로 이 문맥에서의 관용적 의미를 밝혀 후대의 메시아적 독해를 강요하지 않았습니다.
