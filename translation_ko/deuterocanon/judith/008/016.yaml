base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/008/016.yaml
  text: But do not hold the plans of the Lord our God as security[a], for God is not like a man, to be threatened, nor like a son of man[b], to be persuaded.
  footnotes:
  - marker: a
    text: Or 'do not take the plans of the Lord our God as a pledge/collateral.' The Greek uses pledge-security imagery.
    reason: lexical_alternative
  - marker: b
    text: '''A son of man'' here is a Hebrew-style way of saying a human being, not a messianic title.'
    reason: cultural_note
translation:
  language: ko
  text: 그러므로 여러분은 우리 하나님 주님의 계획을 담보물처럼 여기지 마십시오. 하나님은 사람처럼 위협을 받으실 분이 아니고, 인자처럼 설득될 분도 아니십니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘담보물처럼 여기지 마십시오’는 문자적으로는 ‘담보/저당으로 잡지 마십시오’에 해당합니다. 그리스어는 보증·담보의 이미지를 사용합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘인자’는 여기서 메시아 칭호가 아니라, 히브리식 표현으로 ‘인간’ 일반을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: ἐνεχυράζετε
  english_pob_choice: hold ... as security
  chosen_korean: 담보물처럼 여기지 마십시오
  alternatives_korean:
  - 담보로 잡지 마십시오
  - 담보로 삼지 마십시오
  - 저당 잡지 마십시오
  lexicon: LSJ
  rationale: 보증·담보의 이미지를 살리되, 현대 한국어에서 문맥상 자연스럽게 들리도록 ‘담보물처럼 여기다’로 옮겼습니다.
- source_word: βουλὰς
  english_pob_choice: plans
  chosen_korean: 계획
  alternatives_korean:
  - 뜻
  - 방침
  - 목적
  lexicon: LSJ
  rationale: βουλή의 결의·의도·계획 가운데 여기서는 하나님의 진행 방향을 가리키므로 현대 독자가 바로 이해하는 ‘계획’이 적절합니다.
- source_word: ἀπειληθῆναι
  english_pob_choice: to be threatened
  chosen_korean: 위협을 받으실
  alternatives_korean:
  - 협박을 받으실
  - 위세에 눌리실
  - 위협당하실
  lexicon: LSJ
  rationale: 수동 부정사에 맞추어 하나님이 인간의 압박에 굴복하실 수 없다는 뜻을 직접적으로 드러내는 표현을 택했습니다.
- source_word: διαπεισθῆναι
  english_pob_choice: to be persuaded
  chosen_korean: 설득될
  alternatives_korean:
  - 마음을 바꾸실
  - 꾀임에 넘어가실
  - 동의하실
  lexicon: LSJ
  rationale: 병렬 구조를 살려 ‘위협을 받다’와 대응되는 수동 의미인 ‘설득되다’를 유지했습니다.
- source_word: υἱὸς ἀνθρώπου
  english_pob_choice: a son of man
  chosen_korean: 인자
  alternatives_korean:
  - 사람의 아들
  - 한 인간
  - 인간
  lexicon: LSJ
  rationale: 문자적으로는 ‘사람의 아들’이지만, 구약적·셈어적 관용구로서 인간 일반을 가리키는 표현이므로 한국어 성경에서 익숙한 ‘인자’를 사용했습니다.
theological_decisions:
- issue: 하나님과 인간의 대비를 어떻게 유지할 것인가
  chosen_reading: 하나님은 인간처럼 압박이나 설득의 대상이 될 수 없다는 대조를 그대로 살렸습니다.
  alternative_readings:
  - ‘하나님은 사람처럼 다뤄질 수 없다’로 더 의역하기
  - ‘하나님은 인간의 뜻에 굴복하지 않으신다’로 풀어쓰기
  rationale: 본문은 두 개의 수동 부정사를 통해 하나님과 인간의 본질적 차이를 강조하므로, 이를 완화하지 않고 직접적인 대조로 보존했습니다.
  doctrine_reference: 본문의 수사적 대조를 유지하는 원칙
