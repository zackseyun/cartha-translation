  naturalness: ‘그분 외에 다른 신을 인정한 적이 없습니다’와 ‘우리를, 또 우리 민족 가운데 누구도 외면하지 않으실 것’은 현대 표준 한국어의 격식 있는 합쇼체에서 자연스럽습니다. ‘무시하다’는 다소 일상적이고 의도적인 경멸의 뉘앙스가 강하므로, 문맥상 ‘외면하다’가 더 적절합니다.
