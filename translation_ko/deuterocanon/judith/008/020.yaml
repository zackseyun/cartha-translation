  yaml_path: translation/deuterocanon/judith/008/020.yaml
  text: But we have acknowledged no other god except him[a]; therefore we hope that he will not disregard us[c][b], nor our people.
  footnotes:
  - marker: a
    text: Or 'we have known' or 'we have recognized' no other god except him.
    reason: lexical_alternative
  - marker: b
    text: Or 'he will not overlook us.'
    reason: lexical_alternative
  - marker: c
    text: Greek 'our γένος,' meaning our lineage, stock, or people-group; 'our people' is a possible smoother rendering.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 우리는 그분 외에는 다른 하나님을 알지 못하였습니다[a]. 그러므로 그분께서 우리를 무시하지도[b] 않으시고, 우리 민족도 무시하지 않으실[c] 것으로 우리는 희망합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘우리가 알지 못하였습니다’, ‘우리가 인정하지 않았습니다’로도 옮길 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘우리를 외면하지도 않으시고’로도 옮길 수 있습니다.
    reason: alternative_reading
  - marker: c
    text: 그리스어 ‘우리 γένος’는 혈통, 씨족, 민족, 사람들을 뜻할 수 있으며, 여기서는 공동체 전체를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕτερον θεὸν ... πλὴν αὐτοῦ
  english_pob_choice: no other god except him
  chosen_korean: 그분 외에는 다른 하나님을 알지 못하였습니다
  alternatives_korean:
  - 그분 외에는 다른 신을 알지 못하였습니다
  - 그분 말고는 다른 하나님을 인정하지 않았습니다
  lexicon: LSJ; BDAG
  rationale: ἕτερον θεόν의 배타성을 살리되, 한국어에서 자연스러운 합쇼체로 ‘다른 하나님’을 두고, ἐπέγνωμεν은 단순 인지보다 신앙적 인식의 뉘앙스를 담는 ‘알지 못하였습니다’로 옮겼습니다.
- source_word: ἐπέγνωμεν
  english_pob_choice: have acknowledged
  chosen_korean: 알지 못하였습니다
  alternatives_korean:
  - 인정하지 않았습니다
  - 알아보지 않았습니다
  lexicon: BDAG
  rationale: 이 동사는 ‘알다/인식하다/인정하다’의 범위를 가지므로, 여기서는 독점적 충성을 나타내는 고백 문맥에 맞게 ‘알지 못하였습니다’로 간결하게 처리했습니다.
- source_word: ὑπερόψεται
  english_pob_choice: will not disregard
  chosen_korean: 무시하지도 않으시고
  alternatives_korean:
  - 돌보지 않으시고
  - 외면하지도 않으시고
  - 경시하지도 않으시고
  lexicon: LSJ
  rationale: 이 동사는 단순히 ‘보다’의 반대가 아니라 낮추어 대하거나 외면하는 뜻이 있어, 문맥상 ‘무시하다’가 가장 자연스럽고 강한 대응입니다.
- source_word: ἀπὸ τοῦ γένους ἡμῶν
  english_pob_choice: nor our people
  chosen_korean: 우리 민족도
  alternatives_korean:
  - 우리 사람들도
  - 우리 혈통도
  - 우리 백성도
  lexicon: LSJ
  rationale: γένος은 혈통·가문·민족·사람들 모두를 포괄할 수 있으나, 본문은 집단적 정체성을 가리키므로 현대 한국어에서 오해가 적은 ‘우리 민족’으로 옮겼습니다.
- source_word: ὅθεν
  english_pob_choice: therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 그래서
  - 그런 까닭에
  lexicon: LSJ
  rationale: 앞절의 배타적 신앙 고백에서 결론을 이끄는 연결어이므로, 논리 관계를 분명히 드러내는 ‘그러므로’가 적절합니다.
theological_decisions:
- issue: 하나님과 다른 신의 대비
  chosen_reading: ‘다른 하나님’으로 옮겨, 단순한 종교적 선호가 아니라 유일하신 하나님에 대한 배타적 인식을 드러냈습니다.
  alternative_readings:
  - ‘다른 신’으로 완화하여 번역할 수 있음
  - ‘다른 하나님’을 부자연스럽게 피할 수 있음
  rationale: 그리스어는 유일신 신앙의 경계선을 분명히 긋고 있으므로, 전통적 완곡어보다 본문이 지닌 배타성을 직접적으로 드러내는 번역이 더 적합합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 3
- issue: γένους의 범위
  chosen_reading: 문맥상 개인 가족이 아니라 공동체적 혈통/민족 집단을 가리키므로 ‘우리 민족’으로 옮겼습니다.
  alternative_readings:
  - 우리 백성
  - 우리 혈통
  - 우리 사람들
  rationale: 이 문장은 공동체 전체의 정체성을 말하는 고백이므로, 한국어에서 가장 직관적으로 그 집단성을 전달하는 표현을 선택했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 6
