    reason: lexical_alternative
lexical_decisions:
- source_word: δουλεία
  english_pob_choice: slavery
  chosen_korean: 노예 상태
  alternatives_korean:
  - 노예됨
  - 속박
  - 종살이
  lexicon: LSJ
  rationale: δουλεία는 단순한 봉사보다 속박된 신분을 가리키므로, 프로젝트 지침에 따라 더 강한 의미를 드러내는 ‘노예 상태’로 옮겼습니다.
- source_word: κατευθυνθήσεται εἰς χάριν
  english_pob_choice: will be turned to favor
  chosen_korean: 은혜로 향하지 못할 것입니다
  alternatives_korean:
  - 호의로 향하지 못할 것입니다
  - 은총으로 향하지 못할 것입니다
  - 은혜로 인도되지 못할 것입니다
  lexicon: LSJ
  rationale: 여기서 χάρις는 구원론적 ‘은혜’보다 사회적 호의에 가깝지만, 한국어에서는 ‘은혜로 향하다’가 문맥의 방향성을 가장 자연스럽게 살리므로 ‘향하지 못할 것입니다’로 표현했습니다.
- source_word: θήσει αὐτὴν εἰς ἀτιμίαν
  english_pob_choice: will make it a dishonor
  chosen_korean: 그것을 불명예로 삼으실 것입니다
  alternatives_korean:
  - 그것을 수치로 만드실 것입니다
  - 그것을 치욕으로 두실 것입니다
  - 그것을 불명예가 되게 하실 것입니다
  lexicon: LSJ
  rationale: τίθημι의 결과 상태를 살리되, ‘불명예로 삼다’는 한국어 표현으로 대상의 최종 상태를 직접적으로 전달했습니다.
- source_word: Κύριος ὁ θεὸς ἡμῶν
  english_pob_choice: the Lord our God
  chosen_korean: 주 우리 하나님
  alternatives_korean:
  - 우리 주 하나님
  - 주님 우리 하나님
  - 주 우리 하느님
  lexicon: LSJ
  rationale: κύριος는 프로젝트 기본어인 ‘주’로, ὁ θεὸς ἡμῶν은 표준 개신교 용례에 맞춰 ‘우리 하나님’으로 옮겼습니다.
theological_decisions:
- issue: δουλεία의 강도 유지
  chosen_reading: 노예 상태
  alternative_readings:
  - 종살이
  - 속박
  rationale: 이 구절은 이스라엘의 굴욕적 종속 상태를 말하므로, 완화된 ‘종’보다 더 강한 ‘노예 상태’가 본문의 사회적·정치적 긴장을 더 잘 드러냅니다.
  doctrine_reference: 'DOCTRINE.md: δοῦλος/δουλεία 관련 contested terms table'
- issue: χάρις의 번역
  chosen_reading: 은혜
  alternative_readings:
  - 호의
  - 은총
  rationale: 문맥상 사회적 호의라는 의미가 강하지만, 한국어 본문에서는 ‘은혜로 향하지 못할 것’이 방향성과 대조를 간결하게 살려 줍니다. 다만 의미 범위는 주석에서 ‘호의’와 대응됨을 암시합니다.
  doctrine_reference: 'DOCTRINE.md: optimal-equivalence and lexical tension preservation'
