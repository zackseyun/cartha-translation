  source_fidelity: 원문의 ἀνήρ αὐτῆς는 문맥상 ‘남편’으로, Μανασσης는 ‘마나세’로, φυλή와 πατριά는 서로 다른 혈연·사회 단위를 가리키는 표현으로 적절히 파악했습니다. 다만 ‘그녀의 지파와 그녀의 가족 계통에서 난 사람’은 πατριά가 가리키는 소속 집단을 ‘계통’이라는 추상적 표현으로 옮겨 다소 부자연스럽고, ‘그녀 자신의’ 두 소속이라는 뜻도 ‘그녀와 같은’으로 명료하게 드러내는 편이 좋습니다.
  naturalness: ‘그녀와 같은 지파와 가문 출신’은 현대 표준 한국어에서 자연스럽고, 지파와 그보다 좁은 가문이라는 원문의 구별도 유지합니다. ‘보리 추수 때’도 자연스럽고 정확합니다.
