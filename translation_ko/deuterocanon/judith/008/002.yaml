translation:
  language: ko
  text: 그리고 그녀의 남편 마나세는 그녀와 같은 지파와 가문 출신이었으며, 그는 보리 추수 때에 죽었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그녀와 같은 지파와 조상 집안 출신’. 그리스어는 φυλή(‘지파’)와 πατριά(더 좁은 친족 집단)를 구분합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνήρ ... αὐτῆς
  english_pob_choice: husband
  chosen_korean: 남편
  alternatives_korean:
  - 남자
  - 남편 사람
  lexicon: BDAG
  rationale: 소유 대명사 αὐτῆς가 붙어 있어 단순한 ‘남자’가 아니라 관계상 ‘남편’으로 읽는 것이 자연스럽습니다.
- source_word: φυλή
