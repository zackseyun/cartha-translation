  text: And her husband Manasseh was from her own tribe and her own family line[a]; and he died in the days of the barley harvest.
  footnotes:
  - marker: a
    text: Or 'from her own tribe and her own ancestral house.' The Greek distinguishes φυλή ('tribe') from πατριά, a narrower kinship group.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그녀의 남편 마나세는 그녀의 지파와 그녀의 가족 계통에서 난 사람이었으며, 그는 보리 추수 때에 죽었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그녀의 지파와 그녀의 조상 집안에서 난 사람’. 그리스어는 φυλή(‘지파’)와 πατριά(더 좁은 친족 집단)를 구분합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνήρ ... αὐτῆς
  english_pob_choice: husband
  chosen_korean: 남편
  alternatives_korean:
  - 남자
  - 남편 사람
  lexicon: BDAG
  rationale: 소유 대명사 αὐτῆς가 붙어 있어 단순한 ‘남자’가 아니라 관계상 ‘남편’으로 읽는 것이 자연스럽습니다.
- source_word: φυλή
  english_pob_choice: tribe
  chosen_korean: 지파
  alternatives_korean:
  - 부족
  - 족속
  lexicon: LSJ
  rationale: 이스라엘 족보·혈통 문맥에서 φυλή는 표준적으로 ‘지파’가 가장 직접적이고 익숙한 대응입니다.
- source_word: πατριά
  english_pob_choice: family line
  chosen_korean: 가족 계통
  alternatives_korean:
  - 가문
  - 족속
  - 조상 집안
  lexicon: LSJ
  rationale: φυλή보다 더 좁은 친족 집단이라는 차이를 살리면서, 현대 한국어에서 혈연적 계보를 분명히 드러내는 표현으로 옮겼습니다.
- source_word: θερισμοῦ κριθῶν
  english_pob_choice: the barley harvest
  chosen_korean: 보리 추수
  alternatives_korean:
  - 보리 수확
  - 보리 베는 때
  lexicon: LSJ
  rationale: 곡물과 추수 시점을 간결하게 드러내는 표현으로, 원문의 농경적 시간 표지를 자연스럽게 전달합니다.
theological_decisions:
- issue: 족보적 진술의 반복 강조
  chosen_reading: ‘그녀의 지파와 그녀의 가족 계통’이라는 이중 표현을 유지해 혈통상 소속을 분명히 드러냈습니다.
  alternative_readings:
  - 둘 중 하나만 번역해 간단화함
  - ‘가문’으로 통합함
  rationale: 원문은 φυλή와 πατριά를 구분해 말하므로, 한국어에서도 두 층위를 지워 버리지 않고 함께 살리는 편이 본문 의도에 더 충실합니다.
  doctrine_reference: 본문 이해의 정확성 및 족보/혈통 구분
