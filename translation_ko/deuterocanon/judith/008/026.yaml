base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/008/026.yaml
  text: Remember what he did with Abraham[a], and how he tested Isaac, and what happened to Jacob in Mesopotamia of Syria while he was shepherding the sheep of Laban[b], his mother's brother.
  footnotes:
  - marker: a
    text: Or 'tried Isaac.' The Greek verb can mean 'test,' 'try,' or in some contexts 'tempt'; here the sense is a proving test, not an enticement to evil.
    reason: lexical_alternative
  - marker: b
    text: '''Mesopotamia of Syria'' is the Greek geographical expression; it may also be rendered ''Syrian Mesopotamia.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 아브라함에게 하신 일을 기억하십시오[a]. 또한 이삭을 시험하신 일과, 시리아의 메소포타미아에서 그의 어머니의 형제 라반의 양 떼를 치고 있을 때 야곱에게 일어난 일을 기억하십시오[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이삭을 시험하신.’ 그리스어 동사는 ‘시험하다’, ‘시도하다’ 또는 문맥에 따라 ‘유혹하다’를 뜻할 수 있으나, 여기서는 악으로의 유혹이 아니라 증명하는 시험의 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘시리아의 메소포타미아’는 그리스어 지리 표현을 따른 번역입니다. ‘시리아 메소포타미아’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: μνήσθητε
  english_pob_choice: Remember
  chosen_korean: 기억하십시오
  alternatives_korean:
  - 기억하세요
  - 기억하시오
  lexicon: BDAG
  rationale: 부드럽지만 분명한 명령형으로 공동체에 과거의 하나님의 행위를 상기시키는 촉구를 자연스럽게 살렸습니다.
- source_word: ὅσα ἐποίησεν μετʼ Ἀβραάμ
  english_pob_choice: what he did with Abraham
  chosen_korean: 아브라함에게 하신 일
  alternatives_korean:
  - 아브라함과 함께 하신 일
  - 아브라함과 하신 일
  lexicon: BDAG
  rationale: μετὰ+속격의 관계를 한국어에서는 자연스럽게 ‘~에게 하신 일’로 풀어, 하나님과 아브라함 사이의 행위를 드러내되 과도한 해석은 피했습니다.
- source_word: ἐπείρασεν
  english_pob_choice: tested
  chosen_korean: 시험하신
  alternatives_korean:
  - 테스트하신
  - 시험해 보신
  lexicon: BDAG
  rationale: 문맥상 이삭을 향한 하나님의 검증 행위를 가리키므로, 유혹의 뜻을 피하면서도 ‘시험하다’의 성경적 의미를 유지했습니다.
- source_word: ἐν Μεσοποταμίᾳ τῆς Συρίας
  english_pob_choice: in Mesopotamia of Syria
  chosen_korean: 시리아의 메소포타미아에서
  alternatives_korean:
  - 시리아 메소포타미아에서
  - 시리아의 메소포타미아 지방에서
  lexicon: LSJ
  rationale: 그리스어 지리 표현을 그대로 살리되, 한국어 어순에서는 소유격보다 관형격을 써서 더 읽기 쉽게 옮겼습니다.
- source_word: ποιμαίνοντι τὰ πρόβατα
  english_pob_choice: while he was shepherding the sheep
  chosen_korean: 양 떼를 치고 있을 때
  alternatives_korean:
  - 양을 치고 있을 때
  - 양 떼를 돌보는 동안
  lexicon: BDAG
  rationale: ποιμαίνω의 목양적 행위를 한국어의 ‘치다’로 자연스럽게 옮기면서, πρόβατα는 단수적 이미지보다 집합적 맥락을 살려 ‘양 떼’로 번역했습니다.
theological_decisions:
- issue: 아브라함과 이삭에 대한 하나님의 행동을 어떻게 드러낼지
  chosen_reading: 본문의 주체를 문맥상 하나님으로 이해해 ‘하신’과 ‘시험하신’으로 옮겼습니다.
  alternative_readings:
  - 주어를 생략한 채 더 중립적으로 옮기기
  - ‘하나님’이라고 명시하기
  rationale: 헬라어는 주어를 드러내지 않지만, 한국어는 서술의 주체를 드러내는 편이 자연스럽습니다. 다만 본문 수준에서는 ‘하나님’을 덧붙여 과잉 명시하지 않았습니다.
  doctrine_reference: 원문 우선과 본문 내 절제된 명시성
- issue: ἐπείρασεν의 의미 범위
  chosen_reading: ‘시험하신’으로 옮겨, 검증/입증의 의미를 살렸습니다.
  alternative_readings:
  - ‘유혹하신’
  - ‘시도하신’
  rationale: 이삭에 대한 언급은 악으로의 유혹이 아니라 믿음의 검증을 가리키므로, 신학적으로 오해를 낳는 번역은 피했습니다.
  doctrine_reference: 창세기 22장의 시험 내러티브와 일치하는 의미 보존
