  text: Remember what he did with Abraham[a], and how he tested Isaac, and what happened to Jacob in Mesopotamia of Syria while he was shepherding the sheep of Laban[b], his mother's brother.
  footnotes:
  - marker: a
    text: Or 'tried Isaac.' The Greek verb can mean 'test,' 'try,' or in some contexts 'tempt'; here the sense is a proving test, not an enticement to evil.
    reason: lexical_alternative
  - marker: b
    text: '''Mesopotamia of Syria'' is the Greek geographical expression; it may also be rendered ''Syrian Mesopotamia.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 아브라함과 함께 하신 모든 일과 이삭을 시험하신 일을 기억하십시오[a]. 또 시리아의 메소포타미아에서[b], 어머니의 형제인 라반의 양을 치고 있을 때 야곱에게 일어난 모든 일을 기억하십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이삭을 시험해 보신.’ 그리스어 동사는 ‘시험하다’, ‘시도하다’, 또는 문맥에 따라 ‘유혹하다’를 뜻할 수 있습니다. 그러나 여기서는 악으로 이끄는 유혹이 아니라 입증을 위한 시험을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: ‘시리아의 메소포타미아’는 그리스어의 지리 표현을 따른 번역입니다. ‘시리아 메소포타미아’로도 옮길 수 있습니다.
    reason: lexical_alternative
