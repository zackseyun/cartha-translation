theological_decisions:
- issue: 아브라함과 이삭에 대한 하나님의 행동을 어떻게 드러낼지
  chosen_reading: 본문의 주체를 문맥상 하나님으로 이해해 ‘하신’과 ‘시험하신’으로 옮겼습니다.
  alternative_readings:
  - 주어를 생략한 채 더 중립적으로 옮기기
  - ‘하나님’이라고 명시하기
  rationale: 헬라어는 주어를 드러내지 않지만, 한국어는 서술의 주체를 드러내는 편이 자연스럽습니다. 다만 본문 수준에서는 ‘하나님’을 덧붙여 과잉 명시하지 않았습니다.
  doctrine_reference: 원문 우선과 본문 내 절제된 명시성
- issue: ἐπείρασεν의 의미 범위
  chosen_reading: ‘시험하신’으로 옮겨, 검증/입증의 의미를 살렸습니다.
  alternative_readings:
  - ‘유혹하신’
  - ‘시도하신’
  rationale: 이삭에 대한 언급은 악으로의 유혹이 아니라 믿음의 검증을 가리키므로, 신학적으로 오해를 낳는 번역은 피했습니다.
  doctrine_reference: 창세기 22장의 시험 내러티브와 일치하는 의미 보존
