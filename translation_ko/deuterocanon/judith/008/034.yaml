translation:
  language: ko
  text: 그러나 너희는 내 행동을 조사해서는 안 됩니다. 나는 내가 하는 일이 완성될 때까지 너희에게 말하지 않겠습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξερευνήσετε
  english_pob_choice: investigate
  chosen_korean: 조사해서는 안 됩니다
  alternatives_korean:
  - 살펴서는 안 됩니다
  - 캐묻지는 말아야 합니다
  - 탐색해서는 안 됩니다
  lexicon: LSJ
  rationale: 철저히 파고드는 의미를 살리되, 현대 한국어에서 자연스럽고 공식적인 금지 표현으로 옮겼습니다.
- source_word: τὴν πρᾶξίν μου
  english_pob_choice: my action
  chosen_korean: 내 행동
  alternatives_korean:
  - 내 행위
  - 내 일
  - 내 계획
  lexicon: LSJ
  rationale: 명사형을 유지하면서도 문맥상 단일한 행위라기보다 진행 중인 행동을 가리키므로, 자연스러운 현대 한국어로 옮겼습니다.
- source_word: οὐ γὰρ ἐρῶ ὑμῖν
  english_pob_choice: for I will not tell you
  chosen_korean: 나는 … 너희에게 말하지 않겠습니다
  alternatives_korean:
  - 나는 … 너희에게 말해 주지 않겠습니다
  - 나는 … 너희에게 일러주지 않겠습니다
  lexicon: LSJ
  rationale: ἐρῶ가 여기서는 단순 발화보다 정보를 전하는 뜻이므로, 한국어에서는 ‘말하다’로 처리해 의미를 보존했습니다.
- source_word: ἕως τοῦ τελεσθῆναι
  english_pob_choice: until ... has been completed
  chosen_korean: …이 완성될 때까지
  alternatives_korean:
  - …이 끝날 때까지
  - …이 마쳐질 때까지
  - …이 이루어질 때까지
  lexicon: LSJ
  rationale: 수동 부정과 종결 지점을 함께 드러내기 위해, 완료된 상태에 이르는 시점을 한국어의 ‘완성되다’로 표현했습니다.
