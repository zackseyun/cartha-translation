base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/008/022.yaml
  text: and the slaughter of our brothers[a], and the captivity of the land, and the desolation of our inheritance, will return upon our own heads among the nations where we will serve as slaves there[b]; and we will become a stumbling block and a reproach before those who possess us.
  footnotes:
  - marker: a
    text: Or, 'it will return upon our heads.' The Greek verb is singular, but the subject is not explicitly stated in the clause.
    reason: alternative_reading
  - marker: b
    text: Or, 'wherever we serve there.' The Greek verb can mean simply 'serve,' but in this context of captivity it likely carries the sense of forced service or slavery.
    reason: lexical_alternative
translation:
  language: ko
  text: 우리 형제들의 살육과, 이 땅의 포로 됨과, 우리 기업의 황폐함이, 우리가 그곳에서 종으로 섬기게 될 나라들 가운데에서 우리 머리 위로 되돌아올 것이며, 우리는 우리를 차지한 자들 앞에서 걸림돌과 수치가 될 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘우리 머리 위로 돌아올 것이다.’ 그리스어 동사는 단수이지만, 이 절에는 주어가 분명히 드러나지 않습니다.
    reason: alternative_reading
  - marker: b
    text: 또는, ‘그곳에서 우리가 섬길 곳마다.’ 그리스어 동사는 단순히 ‘섬기다’일 수도 있지만, 포로 상태의 문맥에서는 강제적 예속의 뜻이 더 강합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: φόνον
  english_pob_choice: slaughter
  chosen_korean: 살육
  alternatives_korean:
  - 학살
  - 죽임
  - 살해
  lexicon: LSJ
  rationale: 전쟁 맥락에서 φόνος의 폭력성을 살리되, 법정적 뉘앙스가 강한 ‘살해’보다 더 광범위한 집단적 폭력을 나타내는 ‘살육’이 적절합니다.
- source_word: αἰχμαλωσίαν
  english_pob_choice: captivity
  chosen_korean: 포로 됨
  alternatives_korean:
  - 포로됨
  - 포로 생활
  - 노예 됨
  lexicon: LSJ
  rationale: 이 표현은 단순한 이주보다 적대 세력에 의해 붙잡힌 상태를 가리키므로, 상태를 직접 드러내는 ‘포로 됨’이 자연스럽습니다.
- source_word: ἐρήμωσιν τῆς κληρονομίας ἡμῶν
  english_pob_choice: the desolation of our inheritance
  chosen_korean: 우리 기업의 황폐함
  alternatives_korean:
  - 우리 기업의 황폐
  - 우리 유산의 황폐함
  - 우리 상속분의 황폐함
  lexicon: LSJ
  rationale: κληρονομία는 단순 재산보다 언약적 기업의 뉘앙스가 있어 ‘기업’으로 옮기고, ἐρήμωσις는 ‘황폐함’으로 자연스럽게 살렸습니다.
- source_word: ἐπιστρέψει εἰς κεφαλὴν ἡμῶν
  english_pob_choice: will return upon our own heads
  chosen_korean: 우리 머리 위로 되돌아올 것이며
  alternatives_korean:
  - 우리 머리 위로 돌아올 것이며
  - 우리의 머리 위에 돌아올 것이며
  - 우리 위로 되돌아올 것이며
  lexicon: LSJ
  rationale: 심판/보응의 관용구를 한국어에서도 알아듣기 쉬운 형태로 유지하기 위해 ‘머리 위로 되돌아올’로 옮겼습니다.
- source_word: δουλεύσωμεν
  english_pob_choice: serve as slaves
  chosen_korean: 종으로 섬기게 될
  alternatives_korean:
  - 노예로 섬기게 될
  - 종노릇하게 될
  - 종으로 봉사하게 될
  lexicon: LSJ
  rationale: δουλεύω의 예속적 성격을 드러내되, 문맥상 강제 노역의 의미를 살려 ‘종으로 섬기게 될’로 번역했습니다.
- source_word: κτωμένων ἡμᾶς
  english_pob_choice: those who possess us
  chosen_korean: 우리를 차지한 자들
  alternatives_korean:
  - 우리를 소유한 자들
  - 우리를 소유하는 자들
  - 우리의 소유자가 된 자들
  lexicon: LSJ
  rationale: κτάομαι는 ‘획득하다/소유하다’의 의미가 있어, 소유·지배의 관계를 드러내는 동시에 현대 한국어에서 지나치게 물건화되지 않도록 ‘차지한 자들’로 옮겼습니다.
theological_decisions:
- issue: ἐπιστρέψει의 주어가 문장에 명시되지 않음
  chosen_reading: 주어를 따로 명시하지 않고 결과 진술형으로 옮겼습니다.
  alternative_readings:
  - ‘그가 우리 머리 위로 되돌릴 것입니다’로 옮김
  - ‘그것이 우리 머리 위로 돌아올 것입니다’로 옮김
  rationale: 그리스어는 단수 동사만 있고 명시적 주어가 없으므로, 한국어에서는 주어를 억지로 보충하지 않고 보응의 결과를 드러내는 방식이 가장 본문에 충실합니다.
  doctrine_reference: 본문의 문법적 긴장을 그대로 유지합니다.
