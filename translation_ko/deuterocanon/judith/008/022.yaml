  lexicon: LSJ
  rationale: κληρονομία는 단순 재산보다 언약적 기업의 뉘앙스가 있어 ‘기업’으로 옮기고, ἐρήμωσις는 ‘황폐함’으로 자연스럽게 살렸습니다.
- source_word: ἐπιστρέψει εἰς κεφαλὴν ἡμῶν
  english_pob_choice: will return upon our own heads
  chosen_korean: 우리 머리 위로 되돌아올 것이며
  alternatives_korean:
  - 우리 머리 위로 돌아올 것이며
  - 우리의 머리 위에 돌아올 것이며
  - 우리 위로 되돌아올 것이며
  lexicon: LSJ
  rationale: 심판/보응의 관용구를 한국어에서도 알아듣기 쉬운 형태로 유지하기 위해 ‘머리 위로 되돌아올’로 옮겼습니다.
- source_word: δουλεύσωμεν
  english_pob_choice: serve as slaves
  chosen_korean: 종으로 섬기게 될
  alternatives_korean:
  - 노예로 섬기게 될
  - 종노릇하게 될
  - 종으로 봉사하게 될
  lexicon: LSJ
  rationale: δουλεύω의 예속적 성격을 드러내되, 문맥상 강제 노역의 의미를 살려 ‘종으로 섬기게 될’로 번역했습니다.
- source_word: κτωμένων ἡμᾶς
  english_pob_choice: those who possess us
  chosen_korean: 우리를 차지한 자들
  alternatives_korean:
  - 우리를 소유한 자들
  - 우리를 소유하는 자들
  - 우리의 소유자가 된 자들
  lexicon: LSJ
  rationale: κτάομαι는 ‘획득하다/소유하다’의 의미가 있어, 소유·지배의 관계를 드러내는 동시에 현대 한국어에서 지나치게 물건화되지 않도록 ‘차지한 자들’로 옮겼습니다.
theological_decisions:
- issue: ἐπιστρέψει의 주어가 문장에 명시되지 않음
  chosen_reading: 주어를 따로 명시하지 않고 결과 진술형으로 옮겼습니다.
  alternative_readings:
  - ‘그가 우리 머리 위로 되돌릴 것입니다’로 옮김
  - ‘그것이 우리 머리 위로 돌아올 것입니다’로 옮김
  rationale: 그리스어는 단수 동사만 있고 명시적 주어가 없으므로, 한국어에서는 주어를 억지로 보충하지 않고 보응의 결과를 드러내는 방식이 가장 본문에 충실합니다.
  doctrine_reference: 본문의 문법적 긴장을 그대로 유지합니다.
