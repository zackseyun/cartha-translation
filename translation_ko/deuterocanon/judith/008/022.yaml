- source_word: ἐρήμωσιν τῆς κληρονομίας ἡμῶν
  english_pob_choice: the desolation of our inheritance
  chosen_korean: 우리 기업의 황폐함
  alternatives_korean:
  - 우리 기업의 황폐
  - 우리 유산의 황폐함
