  text: And there was no one who brought an evil word against her, because she feared God greatly.
translation:
  language: ko
  text: 그리고 그녀를 향해 악한 말을 한 사람은 아무도 없었습니다. 이는 그녀가 하나님을 크게 두려워하였기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπήνεγκεν αὐτῇ ῥῆμα πονηρόν
  english_pob_choice: brought an evil word against her
  chosen_korean: 악한 말을 퍼붓지 못하였는데
  alternatives_korean:
  - 악한 말을 가져다 대지 못하였는데
  - 악한 말을 하여 대항하지 못하였는데
  - 악한 말을 전하지 못하였는데
  lexicon: ἐπιφέρω + ῥῆμα πονηρόν
  rationale: 영어 POB의 ‘brought an evil word against her’를 따라, 단순 발화보다 그녀를 향해 해를 끼치려는 비난·공격의 방향을 드러내는 한국어로 옮겼습니다.
- source_word: οὐκ ἦν ὃς
  english_pob_choice: there was no one who
  chosen_korean: 아무도 … 못하였는데
  alternatives_korean:
  - 그 누구도 … 못하였는데
  - 그런 사람이 없었는데
  - 아무도 … 없었는데
  lexicon: οὐκ ἦν ὃς
  rationale: 존재 부정의 관용구를 자연스러운 한국어로 풀어, ‘그런 자가 없었다’는 뜻을 분명히 했습니다.
- source_word: ἐφοβεῖτο τὸν θεὸν σφόδρα
  english_pob_choice: she feared God greatly
  chosen_korean: 그녀가 하나님을 크게 두려워하였기
  alternatives_korean:
  - 그녀가 하나님을 매우 두려워하였기
  - 그녀가 하나님을 깊이 경외하였기
  - 그녀가 하나님을 심히 두려워하였기
  lexicon: φοβέομαι + σφόδρα
  rationale: σφόδρα를 ‘크게’로 옮겨 강조를 살렸고, φοβέομαι는 문맥상 경외를 포함하지만 본문의 직접적 감정 표현을 유지하기 위해 ‘두려워하다’를 택했습니다.
- source_word: τὸν θεὸν
  english_pob_choice: God
  chosen_korean: 하나님
  alternatives_korean:
  - 하느님
  - 신
  lexicon: θεός
  rationale: 프로테스탄트 표준 용례에 따라 θεός는 ‘하나님’으로 옮겼습니다.
theological_decisions:
- issue: ἐφοβεῖτο의 의미 범위
  chosen_reading: ‘두려워하다’를 기본으로 하되, 경외의 함의를 배제하지는 않았습니다.
  alternative_readings:
  - ‘경외하다’로 완전히 정리하기
  - ‘하나님을 두려워했다’로만 직역하기
  rationale: 본문은 그녀의 내적 태도를 설명하는 서술이므로, 한국어에서는 직역성과 신앙적 뉘앙스를 함께 살리는 표현이 적절합니다.
  doctrine_reference: 잠언 1:7; 전도서 12:13
