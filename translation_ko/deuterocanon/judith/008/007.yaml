base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/008/007.yaml
  text: And she was very beautiful in appearance and lovely to behold[a]; and Manasseh her husband had left her gold and silver and male servants and female servants and livestock and fields[b], and she remained over them.
  footnotes:
  - marker: a
    text: Or 'male slaves and female slaves.' The Greek terms can denote household slaves/servants in an estate inventory.
    reason: lexical_alternative
  - marker: b
    text: Or 'she remained in charge of them' or 'she continued over them.' The Greek expression is slightly ambiguous about whether it emphasizes possession, management, or both.
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 그녀는 외모가 아름답고 보기에도 매우 아름다웠습니다[a]. 그리고 그녀의 남편 마나셋은 그녀에게 금과 은과 남자 종들과 여자 종들과 가축과 밭을 남겨 두었고[b], 그녀는 그것들 위에 머물고 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘남자 종들과 여자 종들.’ 헬라어 표현은 가구 재산 목록 안에서 가정 종속노동자를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그녀가 그것들을 맡아 관리하고 있었다’ 혹은 ‘그녀가 그것들 위에 계속 있었다.’ 헬라어 표현은 소유, 관리, 또는 둘 다를 약간 모호하게 가리킬 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: καλὴ τῷ εἴδει
  english_pob_choice: beautiful in appearance
  chosen_korean: 외모가 아름답고
  alternatives_korean:
  - 보기 좋고
  - 용모가 아름답고
  - 겉모습이 아름답고
  lexicon: LSJ
  rationale: τῷ εἴδει는 외적 형상/모습을 가리키므로, 도덕적 ‘좋음’이 아니라 시각적 아름다움을 분명히 하도록 옮겼습니다.
- source_word: ὡραία τῇ ὄψει
  english_pob_choice: lovely to behold
  chosen_korean: 보기에도 매우 아름다웠습니다
  alternatives_korean:
  - 보기에 사랑스러웠습니다
  - 보기에도 아름다웠습니다
  - 눈에 보기 좋았습니다
  lexicon: LSJ
  rationale: ‘보기에’는 ὄψις의 시각적 초점을 살리고, 앞 구절과의 평행을 유지하면서도 중복을 자연스럽게 처리합니다.
- source_word: παῖδας / παιδίσκας
  english_pob_choice: male servants and female servants
  chosen_korean: 남자 종들과 여자 종들
  alternatives_korean:
  - 남종들과 여종들
  - 남자 노예들과 여자 노예들
  - 남자 종들과 여자 종들
  lexicon: LSJ
  rationale: 이 절은 가정 재산 목록이지만, 헬라어의 성별 대조를 살리기 위해 ‘남자/여자 종들’로 옮겼습니다. 다만 문맥상 주 종속노동자라는 점도 함께 드러납니다.
- source_word: ἔμενεν ἐπʼ αὐτῶν
  english_pob_choice: she remained over them
  chosen_korean: 그것들 위에 머물고 있었습니다
  alternatives_korean:
  - 그것들을 맡고 있었습니다
  - 그것들의 위에 있었습니다
  - 그것들을 관리하고 있었습니다
  lexicon: LSJ
  rationale: ἐπʼ αὐτῶν의 직설적 구조를 보존해 소유·관리 둘 다 가능하게 남겨 두었습니다. ‘머물고 있었습니다’는 지속 상태를 자연스럽게 나타냅니다.
theological_decisions:
- issue: 가정 재산 목록의 παῖδας / παιδίσκας를 어떻게 사회적 지위로 옮길지
  chosen_reading: 남자 종들과 여자 종들
  alternative_readings:
  - 남자 노예들과 여자 노예들
  - 남종들과 여종들
  rationale: 이 문맥은 재산 목록이지만, 본문이 봉사자/종속 노동자를 함께 열거하는 점은 분명합니다. ‘종’은 고전적 종속 관계를 드러내면서도 현대 한국어에서 과도하게 해석을 덧붙이지 않습니다.
  doctrine_reference: 'DOCTRINE.md: Translation philosophy §1; Contested terms table on δοῦλος'
- issue: ἔμενεν ἐπʼ αὐτῶν의 의미를 소유/관리/거주 중 어디에 두는지
  chosen_reading: 그것들 위에 머물고 있었습니다
  alternative_readings:
  - 그것들을 관리하고 있었습니다
  - 그것들 위에 있었습니다
  - 그것들을 맡고 있었습니다
  rationale: 헬라어는 소유와 관리의 뉘앙스를 모두 열어 둡니다. 본문이 명시하지 않은 행정적 의미를 단정하지 않기 위해, 구조를 최대한 가깝게 옮기면서도 한국어로 매끄럽게 처리했습니다.
  doctrine_reference: 'DOCTRINE.md: Translation philosophy §3'
