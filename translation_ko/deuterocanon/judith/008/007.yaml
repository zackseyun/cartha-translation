revisions:
- from: 그리고 그녀는 외모가 아름답고 보기에도 매우 아름다웠습니다[a]. 그리고 그녀의 남편 마나셋은 그녀에게 금과 은과 남자 종들과 여자 종들과 가축과 밭을 남겨 두었고[b], 그녀는 그것들 위에 머물고 있었습니다.
  to: 그녀는 용모가 아름답고 보기에 매우 고왔습니다. 그녀의 남편 므낫세는 그녀에게 금과 은과 남자 종들과 여자 종들[a]과 가축과 밭을 남겨 두었고, 그녀는 그 모든 것을 계속 맡고 있었습니다[b].
  rationale: 각주 a를 해당하는 종속 노동자 표현에 연결하고, b를 마지막의 ἔμενεν ἐπʼ αὐτῶν에 연결했습니다. 인명 표기를 ‘므낫세’로 바로잡았으며, 두 미모 표현의 병렬과 강세는 자연스러운 한국어로 유지했습니다. 마지막 절은 직역 때문에 불명확해진 표현을 ‘계속 맡고 있었습니다’로 고치고, 소유·관리의 세부 의미는 각주에서 보존했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T18:56:19Z'
