revisions:
- from: 당신의 지혜가 오늘만 드러난 것이 아닙니다. 오히려 당신의 날들의 시작부터 모든 백성이 당신의 분별력을 알고 있었으니, 그것은 당신의 마음의 형성이 선하기 때문입니다.[a]
  to: 당신의 지혜가 오늘에만 드러난 것은 아닙니다. 오히려 당신의 삶의 처음부터 온 백성은 당신의 분별력을 알고 있었습니다. 이는 당신의 마음의 성향이 선하기 때문입니다.[a]
  rationale: 본문을 현대 표준어 합쇼체로 자연스럽게 다듬었습니다. ‘오늘에만’은 현재와 오랜 기간의 평판을 대조하는 원문의 부정을 보존하고, ‘삶의 처음부터’는 그리스어의 ‘당신의 날들의 시작부터’라는 관용 표현을 한국어답게 옮깁니다. πλάσμα는 본문에서 ‘성향’으로 번역하고, 문자적 형상은 각주에서 보존했습니다.
