  yaml_path: translation/deuterocanon/judith/008/029.yaml
  text: For your wisdom did not become evident only today; rather[a], from the beginning of your days all the people have known your understanding, because the disposition of your heart is good.
  footnotes:
  - marker: a
    text: Or 'the formation/inclination of your heart is good.' The Greek expression is somewhat literal and refers to the inward bent or shaping of one's heart.
    reason: lexical_alternative
translation:
  language: ko
  text: 당신의 지혜가 오늘에만 드러난 것은 아닙니다. 오히려 당신의 삶의 처음부터 온 백성은 당신의 분별력을 알고 있었습니다. 이는 당신의 마음의 성향이 선하기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신의 마음의 빚어짐이 선합니다.’ 그리스어 표현은 다소 문자적으로, 마음의 내적 성향이나 빚어진 상태를 가리킵니다.
    reason: πλάσμα의 문자적 ‘형성된 것/빚어짐’이라는 이미지를 보존하면서, 본문의 자연스러운 번역인 ‘마음의 성향’에 대한 대안을 제시합니다.
lexical_decisions:
- source_word: οὐκ ἐν τῇ σήμερον
  english_pob_choice: not only today
  chosen_korean: 오늘만 드러난 것이 아닙니다
  alternatives_korean:
  - 오늘이 아니라고만 할 수는 없습니다
  - 오늘에만 드러난 것은 아닙니다
  lexicon: LSJ
  rationale: 현재 시점에만 국한되지 않는다는 대비를 한국어에서 자연스럽게 살리기 위해 ‘오늘만’으로 옮겼습니다.
- source_word: ἡ σοφία σου πρόδηλός ἐστιν
  english_pob_choice: your wisdom has not become evident
  chosen_korean: 당신의 지혜가 드러난 것이 아닙니다
  alternatives_korean:
  - 당신의 지혜가 분명한 것이 아닙니다
  - 당신의 지혜가 나타난 것이 아닙니다
  lexicon: LSJ
  rationale: πρόδηλος의 ‘분명한/명백한’ 의미를 ‘드러나다’로 옮겨, 오늘에 새로 알려진 것이 아니라는 대비를 살렸습니다.
- source_word: τὴν σύνεσίν σου
  english_pob_choice: your understanding
  chosen_korean: 당신의 분별력
  alternatives_korean:
  - 당신의 이해력
  - 당신의 슬기
  lexicon: LSJ
  rationale: σύνεσις는 단순한 지식보다 상황을 꿰뚫는 이해와 분별을 가리키므로, 문맥상 ‘분별력’이 가장 자연스럽습니다.
- source_word: τὸ πλάσμα τῆς καρδίας σου
  english_pob_choice: the disposition of your heart
  chosen_korean: 당신의 마음의 형성
  alternatives_korean:
  - 당신의 마음의 성향
  - 당신의 마음의 짜임
  lexicon: LSJ
  rationale: πλάσμα는 ‘형성된 것/빚어진 것’의 뉘앙스를 가지므로, POB의 해석을 반영하되 한국어에서 낯설지 않게 ‘마음의 형성’으로 옮겼습니다.
theological_decisions:
- issue: ‘마음’의 인류학적 표현 유지
  chosen_reading: ‘마음’을 그대로 유지해 내적 성향과 판단의 중심을 가리키게 했습니다.
  alternative_readings:
  - ‘생각’으로 풀어 쓰기
  - ‘성품’으로 바꾸기
  rationale: 이 구절은 성경적 인류학에서 ‘마음’이 내적 분별과 도덕적 성향의 자리라는 점을 전제하므로, 원문의 이미지를 보존하는 편이 더 적절합니다.
  doctrine_reference: 'DOCTRINE.md: 원문 의미를 보존하고 허용되지 않는 재의역을 피함.'
