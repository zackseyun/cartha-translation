  text: For you will not find the depths of a man's heart[a], nor will you discern the words of his mind. So how will you search out God, who made all these things, and know his mind, and understand his thought? By no means, brothers[b], provoke the Lord our God.
  footnotes:
  - marker: a
    text: Or 'the depth of a human heart.' The Greek has a generic masculine singular ('of a man') used representatively for human beings.
    reason: lexical_alternative
  - marker: b
    text: Or 'brothers and sisters.' The Greek reads 'brothers,' which may address the group inclusively while using a masculine form.
    reason: lexical_alternative
translation:
  language: ko
  text: 사람의 마음의 깊은 곳은 찾지 못하고, 그의 생각의 말들도 분별하지 못할 것입니다. 그렇다면 이 모든 것을 만드신 하나님을 어떻게 찾아내며, 그의 마음을 알고 그의 생각을 이해할 수 있겠습니까? 결코 그럴 수 없습니다, 형제 여러분. 주 우리 하나님을 노엽게 하지 마십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek uses a masculine singular form representatively for human beings; the Korean main text renders this naturally as ‘사람의 마음.’
    reason: lexical_alternative
  - marker: b
    text: The Greek address is literally ‘brothers,’ and the Korean main text keeps a communal form without adding gendered expansion.
    reason: lexical_alternative
lexical_decisions:
- source_word: βάθος καρδίας ἀνθρώπου
  english_pob_choice: the depths of a man's heart
  chosen_korean: 사람의 마음의 깊은 곳
  alternatives_korean:
  - 한 사람의 마음의 깊은 곳
  - 인간의 마음의 깊은 곳
  lexicon: LSJ
  rationale: βάθος의 ‘깊음’과 καρδία의 내면성을 살리면서, 한국어에서는 ‘마음의 깊은 곳’이 가장 자연스럽고 ‘사람의’로 ἀνθρώπου의 대표성도 유지할 수 있습니다.
- source_word: λόγους τῆς διανοίας αὐτοῦ
  english_pob_choice: the words of his mind
  chosen_korean: 그의 생각의 말들
  alternatives_korean:
  - 그의 마음의 말들
  - 그의 이해의 말들
  - 그의 생각하는 바
  lexicon: LSJ
  rationale: λόγους와 διανοίας를 구분해 살리기 위해 단순히 ‘생각’으로 합치지 않고, 내면에서 형성된 말/표현이라는 이미지를 한국어로 옮겼습니다.
- source_word: διαλήμψεσθε
  english_pob_choice: you will discern
  chosen_korean: 분별하지 못할 것입니다
  alternatives_korean:
  - 가려내지 못할 것입니다
  - 분명히 깨닫지 못할 것입니다
  - 알아내지 못할 것입니다
  lexicon: LSJ
  rationale: 지각하여 구별해 내는 의미를 한국어의 ‘분별하다’로 옮기면 문맥의 인지적 한계가 잘 드러납니다.
- source_word: ἐρευνήσετε
  english_pob_choice: search out
  chosen_korean: 찾아내며
  alternatives_korean:
  - 샅샅이 찾아내며
  - 탐구하며
  - 뒤져내며
  lexicon: LSJ
  rationale: 하나님을 대상으로 한 철저한 탐색의 불가능성을 드러내기 위해 ‘찾아내다’를 썼고, 앞의 ‘찾지 못하고’와 호응하도록 했습니다.
- source_word: μηδαμῶς
  english_pob_choice: By no means
  chosen_korean: 결코 그럴 수 없습니다
  alternatives_korean:
  - 결코 아닙니다
  - 절대로 그렇지 않습니다
  - 도무지 그럴 수 없습니다
  lexicon: LSJ
  rationale: 강한 부정과 경고의 어조를 살리면서 한국어 공적 문체에 자연스럽게 들리도록 했습니다.
- source_word: ἀδελφοί
  english_pob_choice: brothers
  chosen_korean: 형제 여러분
  alternatives_korean:
  - 형제들
  - 형제자매 여러분
  - 여러분
  lexicon: LSJ
  rationale: 원문의 호칭을 유지하되, 한국어에서는 호소형의 공동체 خطاب을 자연스럽게 살리기 위해 ‘형제 여러분’으로 옮겼습니다.
- source_word: κύριον θεὸν ἡμῶν
  english_pob_choice: the Lord our God
  chosen_korean: 주 우리 하나님
  alternatives_korean:
  - 우리 주 하나님
  - 주 하나님
  - 우리의 주 하나님
  lexicon: LSJ
  rationale: κύριος와 θεός의 결합을 한국어의 익숙한 경어 질서로 옮기되, 직역적 질서를 지나치게 어색하게 만들지 않도록 했습니다.
theological_decisions:
- issue: 사람의 인지적 한계를 말하는 수사에서 ἀνθρώπου를 어떻게 처리할지
  chosen_reading: ‘사람의 마음의 깊은 곳’으로 옮겨 대표적 인간성을 유지했습니다.
  alternative_readings:
  - ‘한 사람의 마음의 깊은 곳’
  - ‘인간의 마음의 깊은 곳’
  rationale: 본문은 특정 남성 한 사람을 지칭하기보다 인간 일반의 한계를 말하므로, 한국어에서는 자연스러운 대표 표현으로 풀되 남성성만 과도하게 부각하지 않았습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
- issue: ἀδελφοί의 공동체 호칭을 한국어에서 어떻게 들리게 할지
  chosen_reading: ‘형제 여러분’으로 두어 공동체적 권면의 톤을 살렸습니다.
  alternative_readings:
  - ‘형제들’
  - ‘형제자매 여러분’
  rationale: 원문 형식은 남성 복수이지만 기능상 공동체적 호칭이므로, 과도한 중립화 없이 현대 한국어 권면체로 전달했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
