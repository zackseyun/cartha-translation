  source_fidelity: 수정이 필요합니다. μηδαμῶς는 앞선 수사 의문의 답인 ‘결코 그럴 수 없습니다’가 아니라 명령문 μὴ παροργίζετε를 강하게 수식합니다. 따라서 ‘결코 … 노엽게 하지 마십시오’로 옮겨야 합니다. 또한 ἐρευνήσετε는 하나님을 ‘찾아내다’보다 ‘탐구하다’가 원문의 철저한 탐구 의미와 한국어 용법에 더 맞습니다.
  naturalness: ‘그의 생각의 말들’은 현대 한국어에서 부자연스럽고 의미가 불명확합니다. ‘그가 마음속으로 하는 말들’은 λόγοι와 διάνοια의 구별, 곧 내면의 사유가 말의 형태를 띤다는 표현을 비교적 자연스럽게 보존합니다. 명령의 호칭은 ‘형제 여러분, 결코 … 하지 마십시오’가 합쇼체 권면문으로 자연스럽습니다.
  terminology: ‘마음’, ‘생각’, ‘주 우리 하나님’, ‘형제 여러분’은 문맥과 공적 성서 문체에 적절합니다. ἀνθρώπου의 대표적 단수는 ‘사람의’로, ἀδελφοί는 ‘형제 여러분’으로 보존하되 각주에서 원문의 형태와 번역 선택을 밝혔습니다.
