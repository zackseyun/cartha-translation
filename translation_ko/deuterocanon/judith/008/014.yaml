    rationale: μηδαμῶς는 μὴ παροργίζετε를 수식하는 강한 금지 부사입니다. 원문은 ‘결코 우리 주 하나님을 노엽게 하지 마십시오’라는 명령이지, 앞 문장에 대한 별도 답변이 아닙니다.
