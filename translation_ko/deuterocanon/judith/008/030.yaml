  text: But the people became very thirsty[a], and they compelled us to do as we had said to them, and to bring upon ourselves an oath that we will not break.
  footnotes:
  - marker: a
    text: Or, 'to bind ourselves by an oath.' The Greek literally says 'to bring upon ourselves an oath.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 백성은 매우 목이 말랐고, 그들이 우리에게 말한 대로 하도록 우리를 강요했으며, 우리가 깨뜨리지 않을 맹세를 우리에게 지우게 했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘맹세로 우리 자신을 묶게 했다.’ 그리스어는 문자적으로는 ‘우리 위에 맹세를 가져오다’라고 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδίψησεν σφόδρα
  english_pob_choice: became very thirsty
  chosen_korean: 매우 목이 말랐고
  alternatives_korean:
  - 몹시 목말랐고
  - 심히 목이 말랐고
  lexicon: LSJ
  rationale: σφόδρα는 강한 정도를 나타내므로, 현대 한국어에서 자연스러운 ‘매우 목이 말랐고’로 옮겨 강도를 살렸습니다.
- source_word: ἠνάγκασαν
  english_pob_choice: compelled
  chosen_korean: 강요했으며
  alternatives_korean:
  - 억지로 시켰으며
  - 강제했으며
  lexicon: LSJ
  rationale: 행동을 하도록 압박하고 몰아붙인 뜻을 살리되, 문맥상 지나치게 법률적이지 않은 ‘강요하다’를 택했습니다.
- source_word: ποιῆσαι ἡμᾶς καθὰ ἐλάλησαν αὐτοῖς
  english_pob_choice: to do as we had said to them
  chosen_korean: 그들이 우리에게 말한 대로 하도록
  alternatives_korean:
  - 우리가 그들에게 말한 대로 하도록
  - 우리가 그들에게 말했던 대로 하도록
  lexicon: LSJ
  rationale: 그리스어는 비문적이지만 문맥상 ‘우리가 그들에게 말해 둔 대로’라는 이전 약속을 가리키므로, 의미를 분명히 하면서도 과도하게 해석하지 않는 표현으로 옮겼습니다.
- source_word: ἐπαγαγεῖν ἐφʼ ἡμᾶς ὅρκον
  english_pob_choice: to bring upon ourselves an oath
  chosen_korean: 우리가 깨뜨리지 않을 맹세를 우리에게 지우게 했습니다
  alternatives_korean:
  - 우리에게 맹세를 얹게 했습니다
  - 우리 자신에게 맹세를 가져오게 했습니다
  - 우리에게 맹세를 씌우게 했습니다
  lexicon: LSJ
  rationale: 직역하면 ‘우리 위에 맹세를 가져오다’이지만 한국어로는 자연스럽지 않으므로, 맹세를 스스로 부담하게 만든다는 뜻을 살려 ‘지우다’로 풀었습니다.
- source_word: ὃν οὐ παραβησόμεθα
  english_pob_choice: that we will not break
  chosen_korean: 우리가 깨뜨리지 않을
  alternatives_korean:
  - 우리가 어기지 않을
  - 우리가 위반하지 않을
  lexicon: LSJ
  rationale: ὅρκος와 결합한 παραβαίνω는 맹세를 깨거나 어기는 뜻이므로, 관용적이고 이해하기 쉬운 ‘깨뜨리지 않을’을 선택했습니다.
theological_decisions:
- issue: 맹세를 ‘지우다’로 옮길지, ‘묶다/맺다’로 옮길지
  chosen_reading: 본문의 ‘bring upon ourselves an oath’는 자발적 구속을 강조하므로, ‘맹세를 우리에게 지우게 했다’로 표현했습니다.
  alternative_readings:
  - 맹세로 우리를 묶게 했다
  - 맹세를 우리에게 걸게 했다
  rationale: 그리스어는 맹세가 우리 위에 얹혀져 스스로 부담해야 하는 상황을 말하므로, 단순히 맹세를 ‘했다’보다 구속성과 책임을 드러내는 번역이 적절합니다.
  doctrine_reference: 서원/맹세의 구속력에 관한 일반 성경적 용례
