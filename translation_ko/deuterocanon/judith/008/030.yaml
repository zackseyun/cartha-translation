  source_fidelity: 수정이 필요합니다. 초안의 ‘그들이 우리에게 말한 대로’는 그리스어 구문의 문법적 표면과는 맞지만, 본문 문맥 및 영어 POB의 신중한 문맥적 해석(‘우리가 그들에게 말한 대로’)을 뒤집습니다. 또한 ἐπαγαγεῖν ἐφʼ ἡμᾶς ὅρκον은 백성이 우리에게 맹세를 직접 부과했다기보다, 백성이 우리로 하여금 우리 자신에게 맹세를 지우게 강요했다는 구조입니다.
  naturalness: ‘맹세를 우리에게 지우게 했다’는 행위 주체와 부담 주체가 불분명하고 다소 부자연스럽습니다. 두 부정사를 모두 ‘강요했습니다’에 걸어 주면 현대 표준어 합쇼체로 자연스럽고 원문의 통사도 잘 드러납니다.
  terminology: ‘목말라하다’, ‘강요하다’, ‘맹세를 지우다’, ‘맹세를 어기다’는 이 문맥에서 적절합니다. ‘깨뜨리다’보다 ‘어기다’가 한국어에서 맹세와 더 자연스럽게 결합합니다.
