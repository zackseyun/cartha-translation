- from: 그리고 그들이 그 여자에게 다가왔습니다. 그러자 그가 그들에게 말했습니다. "들으십시오, 베툴루아에 사는 사람들의 지도자들이여. 오늘 이 날에 당신들이 백성을 향해 말한 그 말은 옳지 않습니다. 당신들은 하나님과 당신들 사이에 당신들이 말한 그 맹세를 세워 두었고, 주께서 이 날들 안에 당신들을 도우려고 돌아오지 않으시면 그 도성을 우리의 원수들에게 넘겨 주겠다고 말했습니다."[a]
  to: 그들이 그녀에게 왔습니다. 그러자 그녀가 그들에게 말했습니다. “들으십시오, 베툴루아에 사는 사람들의 통치자들이여. 오늘 여러분이 백성 앞에서 말한 그 말은 옳지 않습니다. 여러분은 하나님과 여러분 자신들 사이에 말한 그 맹세를 정해 놓고, 주께서 그 기간 안에 여러분에게 도움을 돌려주시지 않으시면 그 도성을 우리의 원수들에게 넘겨주겠다고 말했습니다.”[a]
