  source_fidelity: 초안의 ‘그가’는 여성 단수인 αὐτή(유딧)를 남성으로 잘못 받았습니다. 또한 ἐν αὐταῖς는 원문에서 선행사가 명시되지 않은 여성 복수 대명사이므로, ‘이 날들’로 단정하기보다 문맥상 암시된 기간으로 번역하고 각주로 불확실성을 밝혀야 합니다. ἐναντίον τοῦ λαοῦ는 ‘백성을 향해’보다 기본적인 공간적 의미를 살린 ‘백성 앞에서’가 안전합니다.
  naturalness: ‘오늘 이 날에’는 현대 한국어에서 중복되며, ‘이 날들 안에’도 부자연스럽습니다. ‘오늘’, ‘그 기간 안에’로 다듬고, 호칭과 대명사를 ‘여러분’으로 통일하여 합쇼체의 자연스러운 공적 발화로 정리했습니다.
