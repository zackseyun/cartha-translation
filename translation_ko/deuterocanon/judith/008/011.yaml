  text: And they came to her[a], and she said to them, “Listen to me, rulers of those who dwell in Bethulia, for your word that you spoke against the people on this day is not right, and you have set up the oath that you spoke between God and yourselves, and said that you would hand over the city to our enemies if within these days the Lord does not turn back to help you.”
  footnotes:
  - marker: a
    text: Greek literally, 'if not in them'; the pronoun likely refers to the previously specified days of the oath.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그들이 그 여자에게 다가왔습니다. 그러자 그가 그들에게 말했습니다. "들으십시오, 베툴루아에 사는 사람들의 지도자들이여. 오늘 이 날에 당신들이 백성을 향해 말한 그 말은 옳지 않습니다. 당신들은 하나님과 당신들 사이에 당신들이 말한 그 맹세를 세워 두었고, 주께서 이 날들 안에 당신들을 도우려고 돌아오지 않으시면 그 도성을 우리의 원수들에게 넘겨 주겠다고 말했습니다."[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 문자적으로 ‘그들 안에서/그것들 안에서’에 가깝지만, 앞서 언급된 맹세의 기간을 가리키는 것으로 이해됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρχοντες
  english_pob_choice: rulers
  chosen_korean: 지도자들
  alternatives_korean:
  - 통치자들
  - 다스리는 자들
  lexicon: LSJ
  rationale: 권위를 행사하는 자들을 가리키므로, 문맥상 자연스럽고 의미가 분명한 ‘지도자들’로 옮겼습니다.
- source_word: τῶν κατοικούντων ἐν Βαιτυλουά
  english_pob_choice: of those who dwell in Bethulia
  chosen_korean: 베툴루아에 사는 사람들의
  alternatives_korean:
  - 베툴루아에 거주하는 사람들의
  - 베툴루아에 사는 이들의
  lexicon: LSJ
  rationale: κατοικούντων의 ‘거주하다/살다’라는 동사성을 살리면서도 한국어로는 자연스럽게 ‘사는 사람들’로 풀었습니다.
- source_word: οὐκ εὐθὺς ὁ λόγος ὑμῶν
  english_pob_choice: your word ... is not right
  chosen_korean: 당신들이 백성을 향해 말한 그 말은 옳지 않습니다
  alternatives_korean:
  - 당신들의 말은 곧지 않습니다
  - 당신들이 말한 그 말은 바르지 않습니다
  lexicon: LSJ
  rationale: εὐθύς의 직역인 ‘곧다’보다, 이 문맥의 도덕적·실천적 판단을 드러내는 ‘옳지 않습니다’가 적절합니다.
- source_word: ἐστήσατε τὸν ὅρκον
  english_pob_choice: you have set up the oath
  chosen_korean: 그 맹세를 세워 두었고
  alternatives_korean:
  - 그 맹세를 세웠고
  - 그 맹세를 확정했고
  lexicon: LSJ
  rationale: ‘세우다’로 ἵστημι의 이미지를 살리고, 결과 상태를 드러내기 위해 ‘세워 두었고’로 자연스럽게 처리했습니다.
- source_word: ἐὰν μὴ ἐν αὐταῖς
  english_pob_choice: if within these days
  chosen_korean: 이 날들 안에
  alternatives_korean:
  - 이 날들 동안
  - 그 기간 안에
  lexicon: LSJ
  rationale: 앞선 맹세에서 암시된 기간을 한국어로 분명하게 드러내되, 원문의 시간적 한정을 과도하게 확장하지 않도록 했습니다.
- source_word: ἐπιστρέψῃ ὁ κύριος βοήθειαν ὑμῖν
  english_pob_choice: the Lord does not turn back to help you
  chosen_korean: 주께서 이 날들 안에 당신들을 도우려고 돌아오지 않으시면
  alternatives_korean:
  - 주께서 돌아와 당신들을 도우지 않으시면
  - 주께서 도움을 가지고 돌아오지 않으시면
  lexicon: LSJ
  rationale: ἐπιστρέφω의 ‘돌아오다/되돌아가다’ 이미지를 살렸고, βοηθεία의 목적을 ‘도우려고’로 자연스럽게 풀었습니다.
