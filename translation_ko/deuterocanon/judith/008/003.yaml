  text: For he happened to be binding the sheaf in the field[a], and the hot wind came upon his head, and he fell onto his bed and died in Bethulia, his city. And they buried him with his fathers in the field between Dothaim and Balamon.
  footnotes:
  - marker: a
    text: Or 'the scorching heat came upon his head.' The Greek καύσων can refer either to burning heat or to a scorching hot wind.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 마침 들에서 이삭단을 묶고 있었는데[a], 그을리는 바람이 그의 머리에 닥쳤고, 그는 자기 침상에 쓰러져 베툴리아, 자기 성읍에서 죽었습니다. 그들은 그를 그의 조상들과 함께 도타임과 발라몬 사이에 있는 들에 묻었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 머리에 그을리는 더위가 닥쳤다’로 옮길 수 있습니다. 그리스어 καύσων은 불타는 더위나 그을리는 열풍을 가리킬 수 있습니다.
    reason: lexical_alternative
