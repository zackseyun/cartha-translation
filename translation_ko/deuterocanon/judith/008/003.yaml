  language: ko
  text: 그는 마침 들에서 이삭단을 묶고 있을 때, 뜨거운 바람[a]이 그의 머리 위로 불어왔고, 그는 자기 침상에 쓰러져 자기 성읍 베툴리아에서 죽었습니다. 그들은 그를 그의 조상들과 함께 도다임과 발라몬 사이에 있는 들에 묻었습니다.
  philosophy: optimal-equivalence
  footnotes:
