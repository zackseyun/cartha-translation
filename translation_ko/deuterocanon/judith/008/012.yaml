base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/008/012.yaml
  text: And now[a], who are you, that you have put God to the test this day[b], and have set yourselves above God among the sons of men?
  footnotes:
  - marker: a
    text: Or 'and speak for God among human beings.' The Greek phrase is compressed, and the preposition can also suggest acting on behalf of God.
    reason: alternative_reading
  - marker: b
    text: Literally, 'among the sons of men,' a Hebrew-style expression for mortal humanity.
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 너희가 누구이기에 오늘 하나님을 시험하고, 사람들 가운데서 하나님을 대신하느냐?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘사람의 아들들 가운데서’입니다. 이는 필멸의 인간을 가리키는 히브리식 표현입니다. 또한 ‘하나님을 대신하느냐’는 문맥상 이해한 번역이며, 압축된 원문은 ‘사람들 가운데서 하나님을 위하여 [말하거나 행동하느냐]’로도 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: τίνες ἐστὲ ὑμεῖς
  english_pob_choice: who are you
  chosen_korean: 너희는 누구이기에
  alternatives_korean:
  - 너희는 어떤 사람들이기에
  - 너희가 도대체 누구라고
  lexicon: BDAG
  rationale: 수사적 꾸짖음의 직설성을 살리면서도 한국어로 자연스럽게 물음을 형성하기 위해 ‘누구이기에’를 택했습니다.
- source_word: ἐπειράσατε
  english_pob_choice: have put God to the test
  chosen_korean: 하나님을 시험하였으며
  alternatives_korean:
  - 하나님을 시험하였으며
  - 하나님을 시험하였습니까
  lexicon: BDAG
  rationale: 여기서는 단순한 ‘시험하다’보다 함부로 하나님을 떠보는 뉘앙스가 있으므로, 한국어에서도 직역에 가까운 ‘시험하였으며’로 긴장감을 유지했습니다.
- source_word: ἐν τῇ ἡμέρᾳ τῇ σήμερον
  english_pob_choice: this day
  chosen_korean: 오늘
  alternatives_korean:
  - 이 날
  - 바로 오늘
  lexicon: BDAG
  rationale: 중복된 시간 표현의 강조는 문맥상 분명하지만, 한국어에서는 ‘오늘’이 가장 자연스럽고 직접적이어서 이를 채택했습니다.
- source_word: ὑπεῖρ τοῦ θεοῦ
  english_pob_choice: in place of God
  chosen_korean: 하나님 대신 서려
  alternatives_korean:
  - 하나님을 대신하여
  - 하나님보다 위에 서려
  - 하나님 편에서
  lexicon: LSJ
  rationale: ὑπέρ의 압축된 의미를 ‘하나님 대신’으로 드러내되, 단순 대리보다 월권의 뉘앙스를 살리기 위해 ‘서려’로 마무리했습니다.
- source_word: ἐν μέσῳ υἱῶν ἀνθρώπων
  english_pob_choice: among the sons of men
  chosen_korean: 사람의 아들들 한가운데서
  alternatives_korean:
  - 사람들 가운데서
  - 인간들 한가운데서
  lexicon: LSJ
  rationale: 히브리식 표현의 수사적 맛을 살리기 위해 ‘사람의 아들들’ 구조를 유지했고, 장소적 대비를 위해 ‘한가운데서’로 옮겼습니다.
theological_decisions:
- issue: ὑπέρ τοῦ θεοῦ의 의미 범위
  chosen_reading: 이 표현은 단순히 ‘하나님을 위해 말한다’는 뜻이 아니라, 하나님 자리에 서서 판단하거나 결정하려는 월권을 꾸짖는 말로 읽었습니다.
  alternative_readings:
  - 하나님을 대신하여 말한다
  - 하나님 편에서 말한다
  rationale: 문맥상 유딧은 청자들이 하나님께 마땅한 권위를 스스로 가로채고 있다고 질책하므로, 그 긴장을 약화시키지 않는 쪽으로 번역했습니다.
  doctrine_reference: 하나님만의 주권과 인간의 피조물성을 구분하는 성서적 전제
- issue: 직설적 책망의 말투
  chosen_reading: 수사적 질문의 날카로움을 유지하기 위해 문장 전체를 꾸짖음의 어조로 처리했습니다.
  alternative_readings:
  - 더 완곡한 진술문
  - 중립적인 질문문
  rationale: 원문은 논평이 아니라 책망이므로, 한국어에서도 그 긴장을 분명히 드러내는 것이 적절합니다.
  doctrine_reference: 본문의 수사적 기능 보존
