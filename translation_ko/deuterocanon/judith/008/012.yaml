  rationale: 수사적 책망의 현재적 병렬 구조를 ‘시험하고 … 대신하느냐’로 회복했습니다. 부자연스러운 직역 표현은 현대 한국어의 ‘사람들 가운데서’로 고치고, ‘사람의 아들들’의 문자적 형태와 관용적 의미를 각주에 보존했습니다. ὑπέρ의 문맥적 의미를 본문에서 과도하게 교리화하지 않으면서도 가능한 대안 해석을 각주로 제시했습니다.
