  text: Besides all this[a], let us give thanks to the Lord our God[b], who tests us just as he also tested our fathers.
  footnotes:
  - marker: a
    text: 'Or ''our ancestors.'' Greek: ''our fathers.'''
    reason: lexical_alternative
  - marker: b
    text: The verb can also mean 'tries' or, in some contexts, 'tempts'; here the sense is best taken as God proving his people.
    reason: lexical_alternative
translation:
  language: ko
  text: 이 모든 일에도 불구하고, 우리 하나님이신 주님께 감사합시다. 그분께서는 우리 조상들[a]을 시험하셨던 것처럼 우리도 시험하십니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘우리 아버지들.’ 그리스어는 문자적으로 ‘우리의 아버지들’입니다.
    reason: lexical_alternative
  - marker: b
    text: 이 동사는 문맥에 따라 ‘시험하다’, ‘검증하다’, ‘유혹하다’를 뜻할 수 있으나, 여기서는 하나님께서 백성을 시험하시는 의미가 가장 적절합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρὰ ταῦτα πάντα
