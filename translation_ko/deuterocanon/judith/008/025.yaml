  text: Besides all this[a], let us give thanks to the Lord our God[b], who tests us just as he also tested our fathers.
  footnotes:
  - marker: a
    text: 'Or ''our ancestors.'' Greek: ''our fathers.'''
    reason: lexical_alternative
  - marker: b
    text: The verb can also mean 'tries' or, in some contexts, 'tempts'; here the sense is best taken as God proving his people.
    reason: lexical_alternative
translation:
  language: ko
  text: 이 모든 일에도 불구하고, 우리 하나님 주님께 감사합시다. 그분은 우리를 시험하시는 분이시며, 또한 우리 조상들을 시험하신 것과 같습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘우리 아버지들.’ 그리스어는 문자적으로 ‘우리의 아버지들’입니다.
    reason: lexical_alternative
  - marker: b
    text: 이 동사의 뜻은 문맥에 따라 ‘시험하다’, ‘검증하다’, ‘유혹하다’일 수 있으나, 여기서는 하나님이 백성을 시험하시는 의미가 가장 적절합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρὰ ταῦτα πάντα
  english_pob_choice: Besides all this
  chosen_korean: 이 모든 일에도 불구하고
  alternatives_korean:
  - 이 모든 것 외에도
  - 이 모든 일 곁에서도
  - 이 모든 일에 더하여
  lexicon: LSJ
  rationale: 앞뒤 문맥의 곤란한 상황 속에서도 감사로 응답하라는 양보적 힘을 살리면서, 한국어로 자연스럽고 합쇼체에 맞게 옮겼습니다.
- source_word: εὐχαριστήσωμεν
  english_pob_choice: let us give thanks
  chosen_korean: 감사합시다
  alternatives_korean:
  - 감사드립시다
  - 감사합시다요
  - 감사하게 합시다
  lexicon: BDAG
  rationale: 첫인칭 복수 권면형을 현대 한국어의 공동 권유로 자연스럽게 살렸습니다.
- source_word: πειράζει
  english_pob_choice: who tests us
  chosen_korean: 우리를 시험하시는 분이시며
  alternatives_korean:
  - 우리를 테스트하시는 분이시며
  - 우리를 시험하시는 분이며
  - 우리를 유혹하시는 분이시며
  lexicon: BDAG
  rationale: 하나님의 행위로서의 πειράζω는 여기서 ‘유혹’이 아니라 ‘시험/검증’의 뜻이므로, 신학적 긴장을 보존하며 ‘시험하시는’으로 옮겼습니다.
- source_word: τοὺς πατέρας ἡμῶν
  english_pob_choice: our fathers
  chosen_korean: 우리 조상들을
  alternatives_korean:
  - 우리 아버지들을
  - 우리 선조들을
  lexicon: BDAG
  rationale: 본문은 남성형 표현이지만 한국어에서는 이 경우 공동체의 선대 전체를 가리키는 ‘조상들’이 가장 자연스럽고, POB 각주와도 부합합니다.
theological_decisions:
- issue: 하나님이 사람을 시험하신다는 표현의 신학적 긴장
  chosen_reading: 시험하시는 분
  alternative_readings:
  - 유혹하시는 분
  - 시련을 주시는 분
  rationale: 본문의 핵심은 하나님이 백성을 다루시는 방식의 ‘시험/검증’이지 도덕적 유혹이 아니므로, 그 긴장을 그대로 유지했습니다.
  doctrine_reference: 하나님의 주권적 시험과 유혹의 구별
- issue: τοὺς πατέρας ἡμῶν의 성별화된 표현
  chosen_reading: 우리 조상들
  alternative_readings:
  - 우리 아버지들
  - 우리 선조들
  rationale: 원문 형식은 남성형이지만, 여기서는 이스라엘의 전대 공동체 전체를 가리키는 집합적 의미가 분명하므로 한국어에서는 의미를 자연스럽게 드러냈습니다.
  doctrine_reference: 원문 형식과 한국어 관용의 균형
