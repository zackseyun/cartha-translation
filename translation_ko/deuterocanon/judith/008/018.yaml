  text: For in our generations no tribe or clan or people or city has arisen from among us that worships gods made by hands[a], as happened in former days; nor is there any even to this day.
  footnotes:
  - marker: a
    text: Or 'idols made by human hands.' The Greek reads literally 'gods made by hands,' using a polemical expression for idols.
    reason: lexical_alternative
translation:
  language: ko
  text: 우리 세대들 가운데서 우리에게서 나온 지파나 종족이나 백성이나 성읍으로, 손으로 만든 신들을 숭배하는 자는 한 번도 일어나지 않았습니다[a]. 이는 옛날에도 그러하지 않았습니다. 오늘날에도 그런 자는 하나도 없습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘사람 손으로 만든 우상들.’ 그리스어는 문자적으로 ‘손으로 만든 신들’이라고 하며, 우상을 가리키는 폄하적 표현입니다.
    reason: lexical_alternative
