theological_decisions:
- issue: θεοῖς χειροποιήτοις의 우상 비판을 어떻게 드러낼지
  chosen_reading: 본문에는 ‘손으로 만든 신들’로 직역성을 유지하고, 각주에서 이것이 우상을 가리키는 폄하 표현임을 설명했습니다.
  alternative_readings:
  - 본문에 ‘우상들’로 의역
  - 본문에 ‘사람 손으로 만든 우상들’
  rationale: 원문은 문자적으로 ‘손으로 만든 신들’이라고 말하며, 그 도발적 표현 자체가 신학적 강도를 형성합니다. 본문에서 이를 유지하고 보조설명으로 우상 의미를 밝혔습니다.
  doctrine_reference: 원어 우선, 폄하적 수사 보존
- issue: 기점 강조와 현재 강조를 나누어 표현할지
  chosen_reading: ‘우리 세대들 가운데서… 오늘날에도…’로 과거와 현재를 모두 분명히 나누었습니다.
  alternative_readings:
  - 한 문장으로 압축
  - 오늘날에도를 앞문장에 통합
  rationale: 헬라어는 과거의 사례와 오늘의 지속적 부재를 별도로 강조하므로, 한국어에서도 두 시점을 분리해 논지를 보존했습니다.
  doctrine_reference: 문장 구조의 수사적 대비 보존
