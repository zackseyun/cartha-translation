translation:
  language: ko
  text: 우리의 여러 세대에 걸쳐 우리 가운데서 손으로 만든 신들을 섬기는 지파나 씨족이나 백성이나 성읍이, 옛날에 있었던 것처럼, 생겨난 적이 없습니다[a]. 오늘날에도 그런 곳은 없습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘사람 손으로 만든 우상들.’ 그리스어는 문자적으로 ‘손으로 만든 신들’이라고 하며, 우상을 가리키는 논박적 표현입니다.
    reason: lexical_alternative
