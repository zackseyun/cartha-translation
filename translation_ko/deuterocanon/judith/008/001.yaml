translation:
  language: ko
  text: 그리고 그때에 유딧은 들었습니다. 메라리의 딸이요, 오크스의 아들, 요셉의 아들, 오지엘의 아들, 엘케이아의 아들, 엘리우의 아들, 헬키우스의 아들, 엘리아브의 아들, 나타나엘의 아들, 살라미엘의 아들, 사라사다이의 아들, 이스라엘의 후손입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 본문에 나오는 몇몇 이름은 히브리 전통에서 더 익숙한 형태와 대응될 수 있습니다. 본문은 히브리어 재구성보다 그리스어 증언을 따릅니다.
    reason: source_note
lexical_decisions:
- source_word: ἤκουσεν
  english_pob_choice: heard
  chosen_korean: 들었습니다
  alternatives_korean:
  - 들었습니다만
  - 들어 알게 되었습니다
  lexicon: BDAG
  rationale: 단순히 보고를 접했다는 의미를 직접 살리기 위해 ‘들었습니다’로 옮겼습니다. ‘알게 되었습니다’는 해석을 더하고, ‘들었습니다만’은 본문에 없는 대조를 덧붙입니다.
- source_word: ἐν ἐκείναις ταῖς ἡμέραις
  english_pob_choice: in those days
  chosen_korean: 그때에
  alternatives_korean:
  - 그날들에
  - 그 시절에
  lexicon: BDAG
  rationale: 서사적 시간표현을 현대 한국어에서 자연스럽게 살리면서도 원문의 시간 표지 기능을 유지하기 위해 ‘그때에’로 옮겼습니다.
- source_word: θυγάτηρ
  english_pob_choice: daughter
  chosen_korean: 딸
  alternatives_korean:
  - 여식
  - 자녀
  lexicon: BDAG
  rationale: 족보 형식의 직접 표현을 유지하기 위해 ‘딸’로 옮겼습니다.
- source_word: υἱοῦ
  english_pob_choice: son of
  chosen_korean: 아들
  alternatives_korean:
  - 후손
  - 자손
  lexicon: BDAG
  rationale: 반복되는 계보 형식을 보존하기 위해 각 단계에서 ‘아들’ 구조를 유지했습니다. ‘후손’은 의미를 완화해 계보의 형식을 흐릴 수 있습니다.
