  rationale: 이 절은 문학적 설명보다 족보 기록 자체가 핵심이므로, 반복 구조를 보존하는 편이 본문 의도를 더 정확히 드러냅니다.
  doctrine_reference: 성경 본문 형식 보존 원칙
- issue: 마지막 ‘Ἰσραήλ’의 처리를 어떻게 할지
  chosen_reading: ‘이스라엘의 후손입니다’로 마무리했습니다.
  alternative_readings:
