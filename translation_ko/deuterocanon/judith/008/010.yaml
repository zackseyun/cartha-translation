translation:
  language: ko
  text: 그리고 모든 소유물을 관리하는 자기 여종을 보내어, 하브리스와 카르미스, 곧 자기 도시의 장로들을 불러오게 했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
