    text: 그리스어 ἅβρα는 여성 수행인이나 여성 종을 가리킵니다. ‘시녀’ 또는 ‘하녀’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποστείλασα
  english_pob_choice: she sent
  chosen_korean: 보내어
  alternatives_korean:
  - 보냈고
  - 보낸 뒤
  lexicon: LSJ
  rationale: 부사적 분사로서 앞선 동작을 자연스럽게 이어 주는 연결형으로 옮겨, 뒤의 ‘불러오게 했습니다’와의 순서를 살렸습니다.
- source_word: ἅβραν
  english_pob_choice: maid
  chosen_korean: 여종
  alternatives_korean:
  - 시녀
  - 하녀
  lexicon: LSJ
  rationale: 여성 시종이라는 점을 분명히 하되, 현대 한국어에서 문맥상 가장 자연스럽고 과도한 생활감이 없는 표현으로 선택했습니다.
- source_word: τὴν ἐφεστῶσαν πᾶσιν τοῖς ὑπάρχουσιν αὐτῆς
  english_pob_choice: who was in charge of all that belonged to her
  chosen_korean: 자기의 모든 소유를 맡아보는
  alternatives_korean:
  - 자기의 모든 소유를 감독하는
  - 자기의 모든 재산을 관리하는
  lexicon: LSJ
  rationale: ἐφεστῶσαν의 ‘책임지고 맡아봄’과 τοῖς ὑπάρχουσιν αὐτῆς의 ‘소유물/재산’ 의미를 함께 살려, 관리·감독의 기능을 한국어로 자연스럽게 표현했습니다.
- source_word: ἐκάλεσεν
  english_pob_choice: summoned
  chosen_korean: 불러오게 했습니다
  alternatives_korean:
  - 소집했습니다
  - 불렀습니다
  lexicon: LSJ
  rationale: 단순 호출보다 목적을 가진 파견 지시의 뉘앙스를 살리기 위해, 여종을 통해 데려오게 한 의미로 옮겼습니다.
theological_decisions:
- issue: 도시의 장로들을 지칭하는 κοινωνικός/공적 호칭의 번역
  chosen_reading: τοὺς πρεσβυτέρους τῆς πόλεως αὐτῆς를 ‘자기 도시의 장로들’로 옮겨, 연장자 일반이 아니라 도시의 공적 지도층임을 드러냈습니다.
  alternative_readings:
  - 그 도시의 원로들
  - 그 도시의 장로들
  rationale: πρεσβύτεροι가 단순히 나이 많은 사람보다 시민 공동체의 공식적 장로를 뜻하므로, ‘장로들’로 유지하되 소속을 분명히 했습니다.
  doctrine_reference: 제2경전 서술에서의 공적 직분/공동체 질서
