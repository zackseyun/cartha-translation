- from: 그리고 자기 여종을 보내어, 자기의 모든 소유를 맡아보는 그 여종에게 하브린과 카르민, 곧 자기 도시의 장로들을 불러오게 했습니다.[a]
  to: 그리고 모든 소유물을 관리하는 자기 여종을 보내어, 하브리스와 카르미스, 곧 자기 도시의 장로들을 불러오게 했습니다.[a]
  rationale: 인명을 통용되는 한국어 음역으로 바로잡고, 여종의 관리 책임을 나타내는 관계절을 자연스러운 한국어 어순으로 조정했습니다. 여종을 보내고 장로들을 불러오게 한 동작의 순서와, 장로들이 그 도시의 공적 지도층이라는 의미는 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T18:56:15Z'
review_pass:
  verdict: revise
  source_fidelity: 여종이 유딧의 모든 소유를 관리했다는 관계와 도시의 공적 장로들이라는 뜻은 대체로 충실합니다. 다만 인명 Χαβρεὶν καὶ Χαρμεῖν은 그리스어 목적격 형태를 그대로 옮긴 ‘하브린과 카르민’보다, 통용되는 주격형 음역인 ‘하브리스와 카르미스’로 옮기는 것이 적절합니다.
  naturalness: ‘자기의 모든 소유를 맡아보는 그 여종’은 같은 명사가 반복되어 다소 무겁습니다. 관계절을 앞세워 ‘모든 소유물을 관리하는 여종을 보내어’라고 하면 현대 표준 한국어 합쇼체에서 더 자연스럽습니다.
  terminology: ‘여종’, ‘소유물’, ‘장로들’은 각각 여성 수행인, 소유물의 관리, 도시의 공적 원로라는 본문의 의미를 무리 없이 전달합니다. ‘장로들’은 교회 직분으로 한정하지 않고 시민 공동체의 지도층을 가리키는 문맥으로 읽혀야 합니다.
