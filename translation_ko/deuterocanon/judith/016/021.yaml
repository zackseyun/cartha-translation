  text: After these days[a], each one returned to his own inheritance, and Judith went away to Bethulia and remained on her own property[c][b], and in her time she became renowned throughout all the land.
  footnotes:
  - marker: a
    text: Or 'to his own allotted land' for 'to his own inheritance'; the Greek κληρονομία can denote an inherited portion or possession.
    reason: lexical_alternative
  - marker: b
    text: Or 'on her estate' for 'on her own property'; the Greek refers to Judith's own possessions or holding.
    reason: lexical_alternative
  - marker: c
    text: Or 'became honored' / 'became glorious' for 'became renowned'; the Greek emphasizes the honor attached to her name.
    reason: lexical_alternative
translation:
  language: ko
  text: 이 날들이 지난 뒤에 각 사람은 자기 상속지로 돌아갔습니다.[a] 유디트는 베툴리아로 가서 자기 소유지에 머물렀으며,[b] 그녀가 살던 때에 온 땅에서 명성을 얻었습니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘상속지’는 그리스어 κληρονομία의 상속받은 몫, 곧 분배받은 토지를 가리킬 수 있습니다. 또는 ‘자기 상속 몫’으로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘소유지’는 그리스어 ὕπαρξις가 가리키는 유디트 자신의 소유물 또는 보유지를 문맥에 맞게 옮긴 것입니다. 또는 ‘자기 재산’이나 ‘자기 소유’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘명성을 얻었습니다’는 그리스어 ἔνδοξος의 존경받음, 명예로움의 뜻을 반영합니다. 또는 ‘존귀하게 되었습니다’ 또는 ‘널리 알려졌습니다’로 옮길 수 있습니다.
    reason: lexical_alternative
