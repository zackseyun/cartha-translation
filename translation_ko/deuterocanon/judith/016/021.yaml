  lexicon: LSJ
  rationale: κλπρονομία의 분배된 몫·상속 토지를 살리기 위해 ‘유산’과 ‘몫’을 함께 써서 단순한 재산보다 할당된 몫의 의미를 드러냈습니다.
- source_word: ἐπὶ τῆς ὑπάρξεως αὐτῆς
  english_pob_choice: on her own property
  chosen_korean: 자기 소유지에
  alternatives_korean:
  - 자기 재산 위에
  - 자기 소유에
  lexicon: LSJ
  rationale: ὑπάρξις가 Judith의 소유·보유 자산을 가리키므로, 현대 한국어에서 가장 분명한 ‘소유지’로 옮겼습니다.
- source_word: ἔνδοξος
  english_pob_choice: became renowned
  chosen_korean: 존귀하게 되었습니다
  alternatives_korean:
  - 유명하게 되었습니다
  - 명성을 얻었습니다
  - 영광스러워졌습니다
  lexicon: LSJ
  rationale: ἐνδοξος의 ‘존중받는/존귀한 명성’의 결을 살리되, 단순한 대중적 유명세보다 명예의 부여를 더 잘 드러내는 표현을 택했습니다.
