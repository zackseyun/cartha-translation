  naturalness: ‘이런 날들 뒤에’, ‘자기의 몫인 유산으로’, ‘자기 시대에’는 현대 한국어 서사 문장으로 다소 직역투입니다. ‘이 날들이 지난 뒤에’, ‘자기 상속지로’, ‘그녀가 살던 때에’가 자연스럽고 합쇼체 문체에도 맞습니다. 각주 표지는 해당 어구 바로 뒤에 두는 편이 독자의 이해에 좋습니다.
