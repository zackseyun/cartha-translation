  lexicon: LSJ
  rationale: 시간 전환을 자연스럽게 살리면서도 ἡμέρας의 시간성을 유지하기 위해 ‘이런 날들 뒤에’로 옮겼습니다.
- source_word: ἀνέζευξεν ἕκαστος εἰς τὴν κληρονομίαν αὐτοῦ
  english_pob_choice: each one returned to his own inheritance
  chosen_korean: 각 사람은 자기의 몫인 유산으로 돌아갔고
