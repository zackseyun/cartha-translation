  text: The Persians shuddered at her boldness[a], and the Medes were shaken by her daring.
  footnotes:
  - marker: a
    text: 'Greek uses two near-synonymous terms for Judith''s fearsome courage: ''boldness'' (τόλμα) and ''daring/audacity'' (θράσος). The translation varies them in English to preserve the rhetorical parallel without sounding repetitive.'
    reason: lexical_alternative
translation:
  language: ko
  text: 페르시아인들은 그녀의 담대함에 몸서리쳤고, 메대인들은 그녀의 대담함에 흔들렸습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔφριξαν
  english_pob_choice: shuddered
  chosen_korean: 떨었고
  alternatives_korean:
  - 몸서리쳤고
  - 전율했고
  - 두려워했고
  lexicon: LSJ
  rationale: φρίσσω 계열의 즉각적이고 신체적인 공포 반응을 한국어의 자연스러운 ‘떨다’로 살렸습니다.
- source_word: τὴν τόλμαν
  english_pob_choice: her boldness
  chosen_korean: 그녀의 담대함
  alternatives_korean:
  - 그녀의 용기
  - 그녀의 대담함
  - 그녀의 무모함
  lexicon: LSJ
  rationale: τόλμα는 긍정적 용기와 부정적 무모함 사이의 긴장이 있어, 칭찬과 날카로움을 함께 담을 수 있는 ‘담대함’으로 옮겼습니다.
- source_word: τὸ θράσος
  english_pob_choice: her daring
  chosen_korean: 그녀의 대담함
  alternatives_korean:
  - 그녀의 무례함
  - 그녀의 오만함
  - 그녀의 무모함
  lexicon: LSJ
  rationale: θράσος의 도전적 뉘앙스를 살리되 한국어에서 과도하게 비난적으로 굳어지지 않도록 ‘대담함’으로 유지했습니다.
- source_word: ἐρράχθησαν
  english_pob_choice: were shaken
  chosen_korean: 흔들렸습니다
  alternatives_korean:
  - 요동쳤습니다
  - 동요했습니다
  - 충격을 받았습니다
  lexicon: LSJ
  rationale: 수동 aorist의 ‘흔들리다/동요하다’ 의미를 간결하게 반영해 앞 절의 ‘떨었다’와 평행을 이루게 했습니다.
theological_decisions:
- issue: τόλμα와 θράσος의 평행적 대비를 어떻게 한국어로 유지할지
  chosen_reading: 두 단어를 모두 비슷하되 완전히 같지는 않은 표현으로 옮겨, 반복을 피하면서도 수사적 평행성을 보존했습니다.
  alternative_readings:
  - 둘 다 ‘용기’로 통일
  - 둘 다 ‘무모함’으로 통일
  rationale: 본문은 의미상 근접한 두 명사를 병렬로 사용해 인물의 두려움 불러일으키는 결단을 강조하므로, 한국어에서도 약간의 결을 달리해 그 긴장을 드러내는 것이 좋습니다.
  doctrine_reference: 수사적 평행 구조 보존
