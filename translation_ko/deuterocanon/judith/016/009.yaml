  alternative_readings:
  - ‘끌어당겼다’나 ‘마음을 빼앗았다’처럼 부드러운 연애적 표현으로 완화함
  rationale: 이 절은 단순한 호감이 아니라, 눈과 영혼이 점령당하는 듯한 강한 시적 정복 언어를 사용합니다. 이를 완화하면 그리스어의 수사적 긴장이 사라집니다.
  doctrine_reference: 'DOCTRINE.md: Preserve theological tension rather than resolve it; original-language primacy'
