  lexicon: LSJ
  rationale: 포로로 끌려가는 전쟁 이미지를 살리기 위해 ‘포로로 삼다’ 구조를 유지했고, ψυχή는 문맥상 ‘영혼’이 가장 높고 시적인 대응입니다.
- source_word: τὸν τράχηλον αὐτοῦ
  english_pob_choice: his neck
  chosen_korean: 그의 목
  alternatives_korean:
  - 그의 목덜미
  - 그의 목구멍
