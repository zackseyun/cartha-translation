  text: He said he would set my mountains on fire[a], and kill my young men with the sword, and throw my nursing children to the ground, and give my infants as plunder, and despoil my virgins.
  footnotes:
  - marker: a
    text: Or 'ravish my virgins.' The Greek verb more literally means 'despoil' or 'strip,' but in this context of wartime violence it may imply sexual violation.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 내 산들을 불태우고, 내 청년들을 칼로 죽이며, 내 젖먹이들을 땅에 던지고, 내 갓난아이들을 전리품으로 넘기며, 내 처녀들을 유린하겠다고 말했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘유린하다’는 여기서 약탈의 뜻을 기본으로 하되, 전쟁 맥락에서는 성적 폭력을 암시할 수 있습니다.
    reason: theological_note
lexical_decisions:
- source_word: ἐμπρήσειν / τὰ ὅρη μου
  english_pob_choice: set my mountains on fire
  chosen_korean: 내 산들을 불태우고
  alternatives_korean:
  - 내 산들을 불에 태우고
  - 내 산지에 불을 지르고
  lexicon: LSJ
  rationale: ἐμπρήσειν은 단순히 ‘타다’보다 ‘불태우다/불을 지르다’의 적극적 방화를 뜻하며, τὰ ὅρη μου는 직역상 ‘내 산들’이 가장 가깝습니다.
- source_word: τοὺς νεανίσκους μου ἀνελεῖν ῥομφαίᾳ
  english_pob_choice: kill my young men with the sword
  chosen_korean: 내 청년들을 칼로 죽이며
  alternatives_korean:
  - 내 젊은이들을 칼로 죽이며
  - 내 청년들을 검으로 죽이며
  lexicon: BDAG / LSJ
  rationale: νεανίσκοι는 ‘청년들/젊은 남자들’이고, ῥομφαία는 큰 칼·칼날류의 무기이므로 한국어에서는 자연스럽게 ‘칼로’가 가장 직접적입니다.
- source_word: τὰ θηλάζοντά μου θήσει εἰς ἔδαφος
  english_pob_choice: throw my nursing children to the ground
  chosen_korean: 내 젖먹이들을 땅에 던지고
  alternatives_korean:
  - 내 젖먹이들을 땅바닥에 던지고
  - 내 젖먹이들을 땅에 내던지고
  lexicon: LSJ
  rationale: θηλάζοντά는 수유 중인 아기들을 가리키며, θήσει εἰς ἔδαφος는 ‘땅에 던지다/놓다’ 중 폭력을 띤 의미이므로 ‘땅에 던지고’로 옮겼습니다.
- source_word: τὰ νήπιά μου δώσει εἰς προνομὴν
  english_pob_choice: give my infants as plunder
  chosen_korean: 내 갓난아이들을 전리품으로 넘기며
  alternatives_korean:
  - 내 유아들을 약탈물로 넘기며
  - 내 아기들을 노획물로 넘기며
  lexicon: BDAG / LSJ
  rationale: νήπια는 아주 어린 아이들을 가리키며, προνομὴ는 전쟁의 노획물·전리품이므로 ‘전리품으로’가 의미를 가장 분명히 드러냅니다.
- source_word: τὰς παρθένους σκυλεῦσαι
  english_pob_choice: despoil my virgins
  chosen_korean: 내 처녀들을 유린하겠다고
  alternatives_korean:
  - 내 처녀들을 약탈하겠다고
  - 내 처녀들을 노략하겠다고
  lexicon: LSJ
  rationale: σκυλεῦσαι는 기본적으로 ‘약탈하다/벗겨 빼앗다’이지만, 이 전쟁 맥락에서는 성적 폭력의 함의를 가질 수 있어 한국어에서 그 긴장을 살릴 수 있는 ‘유린하다’로 옮겼습니다.
theological_decisions:
- issue: τὰς παρθένους σκυλεῦσαι의 성적 폭력 함의 처리
  chosen_reading: 본문에는 ‘유린하다’로 두어 약탈의 기본 뜻과 성적 폭력의 가능성을 함께 남겼습니다.
  alternative_readings:
  - 내 처녀들을 약탈하겠다고
  - 내 처녀들을 강간하겠다고
  rationale: 그리스어 동사 σκυλεῦσαι 자체는 명시적 성폭력 동사보다 넓은 의미이므로, 본문에서는 과잉해석을 피하면서도 문맥의 잔혹성을 보존해야 합니다.
  doctrine_reference: 본문의 폭력성을 완화하지 않되, 원문이 말하는 범위를 넘겨 단정하지 않음
