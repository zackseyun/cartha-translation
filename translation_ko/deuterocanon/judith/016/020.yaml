translation:
  language: ko
  text: 그리고 백성은 예루살렘에서 성소[a] 앞에서 석 달 동안 기뻐하고 있었으며, 유딧은 그들과 함께 머물러 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘거룩한 것들 앞에서’, 혹은 ‘거룩한 이들 앞에서’로 옮길 수 있습니다. 그리스어 구문은 문자적으로 ‘거룩한 [것들/이들] 앞에서’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐφραινόμενος
  english_pob_choice: were rejoicing
  chosen_korean: 기뻐하고 있었습니다
  alternatives_korean:
  - 즐거워하고 있었습니다
