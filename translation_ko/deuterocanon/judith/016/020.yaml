  text: And the people were rejoicing in Jerusalem before the sanctuary for three months[a], and Judith remained with them.
  footnotes:
  - marker: a
    text: Or 'before the holy things' or 'in the presence of the holy ones'; the Greek phrase is literally 'before the holy [things/ones].'
