  source_fidelity: 그리스어의 미완료형 구문(ἦν ... εὐφραινόμενος)은 ‘기뻐하고 있었습니다’로 지속적인 기쁨을 적절히 나타냅니다. ‘석 달 동안’은 ἐπὶ μῆνας τρεῖς를 정확하고 자연스럽게 옮기며, κατέμεινεν도 ‘그들과 함께 머물러 있었습니다’로 충실하게 반영합니다. κατὰ πρόσωπον τῶν ἁγίων은 예루살렘의 제의 문맥상 본문에서 ‘성소 앞에서’로 처리할 수 있고, 남는 어휘적 다의성은 각주가 보존합니다.
  naturalness: 전체 문장은 현대 표준 한국어 합쇼체로 자연스럽습니다. ‘예루살렘에서 성소 앞에서’는 장소를 중첩해 명시하지만 의미상 부자연스럽지 않으며, 원문의 ‘예루살렘에서’와 ‘성소 앞에서’를 모두 보존합니다.
  terminology: ‘성소’, ‘백성’, ‘유딧’은 문맥과 한국어 성서 번역 관행에 잘 맞습니다. ‘거룩한 것들/거룩한 이들’이라는 각주 대안도 원문의 형태상 가능한 범위를 무리 없이 제시합니다.
