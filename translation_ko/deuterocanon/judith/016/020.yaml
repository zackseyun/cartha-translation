  yaml_path: translation/deuterocanon/judith/016/020.yaml
  text: And the people were rejoicing in Jerusalem before the sanctuary for three months[a], and Judith remained with them.
  footnotes:
  - marker: a
    text: Or 'before the holy things' or 'in the presence of the holy ones'; the Greek phrase is literally 'before the holy [things/ones].'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 백성은 예루살렘에서 성소[a] 앞에서 석 달 동안 기뻐하고 있었으며, 유딧은 그들과 함께 머물러 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘거룩한 것들 앞에서’, 혹은 ‘거룩한 이들 앞에서’로 옮길 수 있습니다. 그리스어 구문은 문자적으로 ‘거룩한 [것들/이들] 앞에서’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐφραινόμενος
  english_pob_choice: were rejoicing
  chosen_korean: 기뻐하고 있었습니다
  alternatives_korean:
  - 즐거워하고 있었습니다
  - 환호하고 있었습니다
  - 잔치하고 있었습니다
  lexicon: BDAG
  rationale: 지속적이고 공동체적인 기쁨의 상태를 나타내므로, 한국어에서는 진행형으로 풀어 ‘기뻐하고 있었습니다’로 옮겼습니다.
- source_word: κατὰ πρόσωπον τῶν ἁγίων
  english_pob_choice: before the sanctuary
  chosen_korean: 성소 앞에서
  alternatives_korean:
  - 거룩한 것들 앞에서
  - 거룩한 이들 앞에서
  - 성소의 면전에서
  lexicon: LSJ
  rationale: 예루살렘의 성전적 문맥에서 공간 관계를 분명히 드러내는 표현이므로, 본뜻을 살려 ‘성소 앞에서’로 옮겼습니다.
- source_word: ἐπὶ μῆνας τρεῖς
  english_pob_choice: for three months
  chosen_korean: 석 달 동안
  alternatives_korean:
  - 세 달 동안
  - 세 달간
  lexicon: BDAG
  rationale: 시간 표현의 관용적이고 자연스러운 한국어로 ‘석 달 동안’을 택했습니다.
- source_word: κατέμεινεν
  english_pob_choice: remained
  chosen_korean: 머물러 있었습니다
  alternatives_korean:
  - 남아 있었습니다
  - 계속 함께 있었습니다
  lexicon: LSJ
  rationale: 단순한 체류의 의미를 살리면서, 앞선 공동체와의 동행 뉘앙스를 자연스럽게 드러내기 위해 ‘머물러 있었습니다’로 옮겼습니다.
theological_decisions:
- issue: τῶν ἁγίων의 지시 대상
  chosen_reading: 성소
  alternative_readings:
  - 거룩한 것들
  - 거룩한 이들
  rationale: 여기서는 ‘앞에서’라는 위치 표현과 예루살렘 배경이 함께 나오므로, 성전/성소를 가리키는 것으로 읽는 것이 가장 자연스럽습니다. 다만 원문의 표면적 다의성은 각주로 남겼습니다.
  doctrine_reference: 원문 우선 번역; 문맥이 강하게 지시하는 경우에만 해석을 본문에 반영하고 대안은 각주에 보존합니다.
