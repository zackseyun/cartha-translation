  chosen_korean: 성소 앞에서
  alternatives_korean:
  - 거룩한 것들 앞에서
  - 거룩한 이들 앞에서
  - 성소의 면전에서
  lexicon: LSJ
  rationale: 예루살렘의 성전적 문맥에서 공간 관계를 분명히 드러내는 표현이므로, 본뜻을 살려 ‘성소 앞에서’로 옮겼습니다.
- source_word: ἐπὶ μῆνας τρεῖς
