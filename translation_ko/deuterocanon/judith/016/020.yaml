  - 거룩한 이들
  rationale: 여기서는 ‘앞에서’라는 위치 표현과 예루살렘 배경이 함께 나오므로, 성전/성소를 가리키는 것으로 읽는 것이 가장 자연스럽습니다. 다만 원문의 표면적 다의성은 각주로 남겼습니다.
  doctrine_reference: 원문 우선 번역; 문맥이 강하게 지시하는 경우에만 해석을 본문에 반영하고 대안은 각주에 보존합니다.
