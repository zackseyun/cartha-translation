  text: And the house of Israel mourned for her seven days. And before she died, she divided her possessions among all who were nearest of kin to Manasseh her husband and to those nearest of kin of her family.
  footnotes:
  - marker: a
    text: Or 'to all her closest relatives of Manasseh her husband, and to the closest relatives of her own family.' The Greek phrase with 'nearest' is somewhat compressed, and the exact grouping of the relatives may be expressed slightly differently in English.
    reason: lexical_alternative
translation:
  language: ko
  text: 이스라엘 온 집은 그녀를 위하여 이레 동안 애도하였습니다. 그리고 그녀는 죽기 전에 자기 소유를 남편인 므낫세의 가장 가까운 친족들과 자기 집안의 가장 가까운 친족들 모두에게 나누어 주었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 ‘모든 가장 가까운 이들’이라는 표현을 남편 므낫세 쪽 친족과 그녀 자신의 집안 쪽 친족에 이어서 사용합니다. 이 압축된 표현은 ‘므낫세의 가장 가까운 친족들과 자기 집안의 가장 가까운 친족들 모두에게’로 이해할 수 있습니다.
    reason: lexical_alternative
