  text: And when they came to Jerusalem, they worshiped God; and when the people had been purified, they offered up their burnt offerings and their freewill offerings and their gifts.
translation:
  language: ko
  text: 그들이 예루살렘에 이르자 하나님께 경배하였고, 백성이 정결하게 되었을 때 그들은 그들의 번제와 자원제와 예물을 바쳤습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσεκύνησαν τῷ θεῷ
  english_pob_choice: they worshiped God
  chosen_korean: 하나님께 경배하였고
  alternatives_korean:
  - 하나님께 예배하였고
  - 하나님께 엎드려 경배하였고
  lexicon: LSJ
  rationale: τῷ θεῷ의 목적어를 따라 단순한 몸짓보다 예배 행위를 드러내기 위해 ‘경배하다’를 택했습니다.
- source_word: ἐκαθαρίσθη ὁ λαός
  english_pob_choice: the people had been purified
  chosen_korean: 백성이 정결하게 된 때에
  alternatives_korean:
  - 백성이 깨끗하게 된 때에
  - 백성이 정결함을 입은 때에
  lexicon: LSJ
  rationale: 문맥이 예루살렘에서의 제의와 제사이므로 도덕적 정화보다 제의적 정결을 드러내는 ‘정결하게 되다’가 적절합니다.
- source_word: ἀνήνεγκαν τὰ ὁλοκαυτώματα αὐτῶν καὶ τὰ ἑκούσια αὐτῶν καὶ τὰ δόματα
  english_pob_choice: they offered up their burnt offerings and their freewill offerings and their gifts
  chosen_korean: 그들은 자기의 번제와 서원제와 예물들을 바쳤습니다
  alternatives_korean:
  - 그들은 자기의 번제와 자원제와 예물들을 드렸습니다
  - 그들은 자기의 번제와 자유의 제물과 예물들을 바쳤습니다
  lexicon: LSJ
  rationale: ὁλοκαυτώματα는 표준 제의 용어인 ‘번제’로, ἑκούσια는 자원해 드리는 제사라는 점을 살려 ‘서원제’로 옮겼고, δόματα는 앞의 제사 용어와 구별되는 더 넓은 ‘예물’로 처리했습니다.
theological_decisions:
