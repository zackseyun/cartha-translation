  text: And there was no longer anyone to terrify the sons of Israel in the days of Judith, and for many days after she died. Amen.
translation:
  language: ko
  text: 유딧이 살아 있는 동안과 유딧이 죽은 뒤에도 여러 날 동안, 이스라엘 자손을 더 이상 두렵게 하는 이는 없었습니다. 아멘.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐκ ἦν ἔτι ὁ ἐκφοβῶν
  english_pob_choice: there was no longer anyone to terrify
  chosen_korean: 더 이상 두렵게 하는 이가 없었습니다
  alternatives_korean:
  - 더는 겁주던 자가 없었습니다
  - 더 이상 공포를 주는 자가 없었습니다
  lexicon: ἐκφοβέω
  rationale: 단순한 '없었다'보다 동사적 뉘앙스를 살려, 이스라엘 자손을 계속 위협하던 존재가 사라졌다는 뜻을 자연스러운 현대어로 옮겼습니다.
- source_word: τοὺς υἱοὺς Ἰσραὴλ
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘의 아들들
  - 이스라엘 백성
  lexicon: υἱοὶ Ἰσραήλ
  rationale: 성경의 상투적 표현을 유지하되, 한국어에서는 의미가 분명한 '이스라엘 자손'이 가장 직접적입니다.
- source_word: ἐν ταῖς ἡμέραις Ἰουδεὶθ
  english_pob_choice: in the days of Judith
  chosen_korean: 유다의 날들
  alternatives_korean:
  - 유딧의 날들
  - 유다 시대
  lexicon: ἐν ταῖς ἡμέραις
  rationale: 고유명사는 현대 한국어 독자에게 익숙한 '유다'를 택했고, 관용적으로는 '날들'이 아니라 '시대'도 가능하지만 원문의 시간표현을 살려 직역했습니다.
- source_word: μετὰ τὸ ἀποθανεῖν αὐτὴν ἡμέρας πολλάς
  english_pob_choice: and for many days after she died
  chosen_korean: 그가 죽은 뒤 오랜 날들 동안
  alternatives_korean:
  - 그녀가 죽은 뒤 오랜 날들 동안
  - 그의 죽음 후 여러 날 동안
  lexicon: μετὰ τὸ ἀποθανεῖν
  rationale: POB의 'after she died'를 반영해 죽음 이후의 지속을 살렸고, '오랜 날들 동안'으로 ἡμέρας πολλάς의 장기간을 전달했습니다.
theological_decisions:
- issue: 문장 종결의 '아멘' 보존
  chosen_reading: 설명 없이 '아멘'을 그대로 유지했습니다.
  alternative_readings:
  - 아멘을 생략
  - '''진실로 그렇습니다''로 의역'
  rationale: 본문 결말의 예전적/전례적 종결을 보존하는 것이 원문의 장르와 음성을 가장 잘 드러냅니다.
  doctrine_reference: 본문 말미의 전례적 결구
