lexical_decisions:
- source_word: οὐκ ἦν ἔτι ὁ ἐκφοβῶν
  english_pob_choice: there was no longer anyone to terrify
  chosen_korean: 더 이상 두렵게 하는 이가 없었습니다
  alternatives_korean:
  - 더는 겁주던 자가 없었습니다
  - 더 이상 공포를 주는 자가 없었습니다
  lexicon: ἐκφοβέω
  rationale: 단순한 '없었다'보다 동사적 뉘앙스를 살려, 이스라엘 자손을 계속 위협하던 존재가 사라졌다는 뜻을 자연스러운 현대어로 옮겼습니다.
- source_word: τοὺς υἱοὺς Ἰσραὴλ
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
