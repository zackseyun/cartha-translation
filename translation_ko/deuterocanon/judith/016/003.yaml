  text: 앗수르는 북쪽의 산들에서 왔습니다[a]. 그는 자기 군대의 만만한 무리와 함께 왔으니, 그들의 무리는 와디들[b]을 막아 버렸고 그들의 말은 언덕들을 덮었습니다.
