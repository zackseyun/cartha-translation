  text: Assyria came from the mountains out of the north[a]; he came with myriads of his forces, whose multitude blocked up the wadis[b], and their horses covered the hills.
  footnotes:
  - marker: a
    text: Or 'winter torrents' or 'streambeds' for 'wadis'; the Greek refers to seasonal watercourses.
    reason: lexical_alternative
  - marker: b
    text: Literally 'the horse of them covered hills'; the Greek likely uses a collective singular for the mounted force, hence 'their cavalry.'
