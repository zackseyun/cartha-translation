  text: 앗수르는 북쪽의 산들에서 왔습니다[a]. 그는 병력 수만을 거느리고 왔으니, 그 병력의 수가 와디들[b]을 막아 버렸고 그들의 말은 언덕들을 덮었습니다.
  philosophy: optimal-equivalence
  footnotes:
