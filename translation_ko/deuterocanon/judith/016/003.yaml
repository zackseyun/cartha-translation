    reason: source_note
  - marker: b
    text: ‘와디’는 계절에 따라 물이 흐르는 물길 또는 마른 물길을 가리킵니다. ‘겨울 물길’ 또는 ‘물길’로도 옮길 수 있습니다.
    reason: lexical_alternative
