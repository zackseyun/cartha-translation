    rationale: ‘만만한’은 현대어에서 ‘만만하다’(쉽다·만만치 않다 등)로 우선 해석되어 μυριάσι의 ‘수만/무수한 단위들’이라는 뜻을 전달하지 못합니다. ‘병력 수만’으로 고쳐야 합니다.
  - severity: medium
    issue: ‘그들의 무리는’의 선행사 불명확성
    rationale: 앞 절의 ‘군대의 … 무리’와 연결되지만, 복수 소유 표현 및 집합적 주어의 관계가 한국어에서 흐립니다. ‘그 병력의 수’가 원문의 ὧν τὸ πλῆθος αὐτῶν(그들의 수/무리)을 명료하게 옮깁니다.
