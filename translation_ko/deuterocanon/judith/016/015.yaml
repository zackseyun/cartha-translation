  text: For mountains will be shaken from their foundations with the waters[a], and rocks will melt like wax before your face; yet to those who fear you, you are gracious.
  footnotes:
  - marker: a
    text: Or, more idiomatically, “at your presence.” The Greek reads literally “before your face.”
    reason: lexical_alternative
translation:
  language: ko
  text: 산들은 그 기초에서 물과 함께 흔들릴 것이며, 바위들은 당신의 얼굴 앞에서 밀초처럼 녹을 것입니다. 그러나 당신을 두려워하는 이들에게는 당신께서 은혜를 베푸십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “당신의 얼굴 앞에서”입니다. 더 관용적으로는 “당신의 임재 앞에서”라고도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὄρη
  english_pob_choice: mountains
  chosen_korean: 산들은
  alternatives_korean:
  - 산들
  - 산맥들
  lexicon: LSJ
  rationale: cosmic 규모의 자연물 이미지이므로 ‘산들’이 가장 자연스럽고, 복수성을 살리기 위해 주격 복수로 옮겼습니다.
- source_word: ἐκ θεμελίων σὺν ὕδασιν
  english_pob_choice: from their foundations with the waters
  chosen_korean: 그 기초에서 물과 함께
  alternatives_korean:
  - 기초에서 물과 더불어
  - 기초로부터 물과 함께
  lexicon: LSJ
  rationale: ‘ἐκ θεμελίων’은 바닥/기초로부터의 요동을, ‘σὺν ὕδασιν’은 동반을 나타내므로 두 요소를 모두 살려 ‘그 기초에서 물과 함께’로 옮겼습니다.
- source_word: ἀπὸ προσώπου σου
  english_pob_choice: before your face
  chosen_korean: 당신의 얼굴 앞에서
  alternatives_korean:
  - 당신 앞에서
  - 당신의 임재 앞에서
  lexicon: LSJ
  rationale: 직역적이고 구체적인 인체적 표현을 보존해 원문의 ‘face/presence’ 이미지를 살렸습니다.
- source_word: εὐιλατεύεις
  english_pob_choice: you are gracious to them
  chosen_korean: 은혜를 베푸십니다
  alternatives_korean:
  - 자비를 베푸십니다
  - 호의를 보이십니다
  lexicon: LSJ
  rationale: 희귀 동사의 호의적·긍휼한 뜻을 한국어 성경 어법에서 가장 무리 없이 전달하는 표현으로 ‘은혜를 베푸십니다’를 택했습니다.
theological_decisions:
- issue: τοῖς φοβουμένοις σε의 번역
  chosen_reading: 당신을 두려워하는 이들에게
  alternative_readings:
  - 당신을 경외하는 이들에게
  - 당신을 공경하는 이들에게
  rationale: 성서적 관용구의 긴장을 유지하기 위해 ‘두려워하다’를 살렸습니다. 이는 단순한 존중이 아니라 하나님 앞의 경외와 두려움을 함께 드러냅니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 3, 6
- issue: ‘얼굴 앞에서’의 보존 여부
  chosen_reading: 당신의 얼굴 앞에서
  alternative_readings:
  - 당신의 임재 앞에서
  - 당신 앞에서
  rationale: 하나님의 현존을 추상화하지 않고, 원문의 인격적·감각적 표현을 그대로 드러내는 쪽이 본문의 힘을 잘 보존합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 3
