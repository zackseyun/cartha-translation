  yaml_path: translation/deuterocanon/judith/016/013.yaml
  text: I will sing to my God a new hymn[a]. Lord, you are great and glorious, marvelous in strength[b], unsurpassable.
  footnotes:
  - marker: a
    text: Or 'a new song.' The Greek has 'a new hymn' (ὕμνον καινόν), which more specifically denotes a song of praise.
    reason: lexical_alternative
  - marker: b
    text: Or 'invincible' / 'incomparable.' The Greek adjective ἀνυπέρβλητος means not surpassed or overcome.
    reason: lexical_alternative
translation:
  language: ko
  text: 제 하나님께 새 찬가를 부르겠습니다[a]. 주님, 크고 영화로우시며, 힘에 있어 놀라우시고 능가할 이가 없으십니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘새 노래’. 그리스어 ὕμνον καινόν은 더 구체적으로 찬양의 노래를 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘비길 수 없는’ 또는 ‘이길 수 없는’. 그리스어 ἀνυπέρβλητος는 능가되거나 이길 수 없다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμνήσω
  english_pob_choice: I will sing
  chosen_korean: 노래하겠습니다
  alternatives_korean:
  - 찬양하겠습니다
  - 찬가를 부르겠습니다
  lexicon: BDAG
  rationale: 미래형의 찬양 행위를 자연스러운 현대 한국어로 옮기되, 이어지는 ὕμνον과 함께 예배적 노래라는 성격을 살리기 위해 ‘노래하겠습니다’를 택했습니다.
- source_word: ὕμνον καινόν
  english_pob_choice: a new hymn
  chosen_korean: 새 찬가
  alternatives_korean:
  - 새 노래
  - 새 찬송
  lexicon: BDAG
  rationale: ὕμνος는 일반적 ‘노래’보다 찬양의 노래를 가리키므로, 교회적 전통어를 무리하게 고정하지 않으면서도 의미를 살리는 ‘찬가’로 옮겼습니다.
- source_word: Κύριε
  english_pob_choice: Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주여
  - 오 주님
  lexicon: BDAG
  rationale: 하나님께 직접 부르는 호격이므로 한국어 기도·찬양 문맥에 자연스러운 ‘주님’을 사용했고, 호격 ‘오’는 원문상 필수 요소가 아니므로 생략했습니다.
- source_word: ἀνυπέρβλητος
  english_pob_choice: unsurpassable
  chosen_korean: 능가할 이가 없으십니다
  alternatives_korean:
  - 비길 데 없으십니다
  - 훌륭함을 넘어서는 분이십니다
  - 막을 자 없으십니다
  lexicon: LSJ
  rationale: 형용사의 핵심은 ‘능가되거나 넘어지지 않음’이므로, 단순한 ‘무적’보다 의미 범위가 넓은 ‘능가할 이가 없으십니다’로 옮겨 비교 불가능성을 살렸습니다.
theological_decisions:
- issue: 하나님을 향한 직접 호칭에서의 존칭 처리
  chosen_reading: 주님
  alternative_readings:
  - 주여
  - 오 주님
  rationale: 원문 호격 Κύριε를 직접 호명하는 구조로 보고, 현대 합쇼체에서 자연스러운 직접 호칭인 ‘주님’으로 처리했습니다. 동반 호격 표지 ‘오’는 번역상 필수적이지 않아 제외했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: κύριος → Lord'
- issue: 찬양 대상과 행위의 예배적 성격
  chosen_reading: 새 찬가를 노래하겠습니다
  alternative_readings:
  - 새 노래를 부르겠습니다
  - 새 찬송을 드리겠습니다
  rationale: ὕμνον καινόν의 ‘찬양의 노래’라는 성격을 드러내기 위해 예배적 뉘앙스가 있는 표현을 택했습니다. 다만 원문의 ‘ὕμνος’가 주는 장르 감각을 유지하려고 ‘찬가’를 사용했습니다.
  doctrine_reference: 'Source-note: ὕμνος denotes praise-song rather than generic song'
