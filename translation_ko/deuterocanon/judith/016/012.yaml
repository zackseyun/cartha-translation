  text: The sons of maidens pierced them through[a], and wounded them like the children of deserters[b]; they perished before the battle line of my Lord.
  footnotes:
  - marker: a
    text: Or 'wounded them like children of deserters.' The Greek phrase with 'runaway/deserter' is difficult and may evoke weakness, instability, or disgrace.
    reason: lexical_alternative
  - marker: b
    text: Or 'they perished from the battle line of my Lord' / 'out of the battle array of my Lord.' The prepositional phrase is somewhat difficult in Greek.
