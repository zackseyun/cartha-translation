translation:
  language: ko
  text: 젊은 여인들의 아들들이 그들을 꿰찔렀으며, 탈주자들의 아이들처럼 그들에게 상처를 입혔습니다[a]. 그들은 나의 주님의 전열 앞에서 멸망했습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘탈주자들의 아이들처럼’이라는 표현은 ‘도망자들의 아이들처럼’으로 옮길 수 있습니다. 여기서 ‘탈주하다/이탈하다’에 해당하는 그리스어는 약함, 불안정, 또는 수치를 환기할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘나의 주님의 전열에서 그들이 멸망했습니다’ 또는 ‘나의 주님의 전투 배열에서 그들이 멸망했습니다.’ 그리스어 전치사구는 다소 어렵습니다.
    reason: alternative_reading
