  yaml_path: translation/deuterocanon/judith/016/022.yaml
  text: And many desired her[a], but no man knew her all the days of her life[b], from the day when Manasseh her husband died and was added to his people.
  footnotes:
  - marker: a
    text: Or, more explicitly, 'no man had relations with her.' The Greek says literally, 'no man knew her,' using a sexual euphemism.
    reason: lexical_alternative
  - marker: b
    text: Or 'was gathered to his people.'
    reason: lexical_alternative
translation:
  language: ko
  text: 많은 사람이 그녀를 원했으나, 그녀의 남편 마나셰가 죽은 날부터 그녀의 생애의 모든 날 동안 아무 남자도 그녀를 알지 못했습니다. 그는 자기 백성에게 더해졌습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘알다’는 여기서 성적 완곡어법입니다. 직역은 원문 표현을 보존합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘자기 백성에게 더해졌습니다’는 죽음을 가리키는 장례적 관용구입니다.
    reason: lexical_alternative
