theological_decisions:
- issue: οὐκ ἔγνω ἀνὴρ αὐτήν의 성적 완곡어법
  chosen_reading: 주본문에는 ‘아무 남자도 그녀를 알지 못했습니다’로 두어 완곡어법을 유지했습니다.
  alternative_readings:
  - 아무 남자도 그녀와 관계하지 않았습니다
  - 아무 남자도 그녀와 동침하지 않았습니다
  rationale: 원문이 노골적 표현이 아니라 관용적 완곡어법을 사용하므로, 이를 풀어 쓰기보다 그대로 살리는 것이 문체와 뉘앙스에 더 충실합니다.
  doctrine_reference: '번역 원칙: 원문이 허용하는 의미를 유지하고, 필요할 때만 각주로 풀어 설명합니다.'
- issue: προσετέθη πρὸς τὸν λαὸν αὐτοῦ의 장례 관용구
  chosen_reading: ‘자기 백성에게 더해졌습니다’로 직역하여 장례적 표현을 유지했습니다.
  alternative_readings:
  - 자기 백성에게 거두어졌습니다
  - 자기 백성에게 합해졌습니다
  rationale: 죽음을 둘러싼 관용구를 한국어 전통 관용으로 완전히 바꾸지 않고, 그리스어의 표현을 보존해 의미와 형식을 함께 드러냈습니다.
  doctrine_reference: 역사적·문학적 관용구는 해석을 과잉 고정하지 않고 투명하게 옮깁니다.
