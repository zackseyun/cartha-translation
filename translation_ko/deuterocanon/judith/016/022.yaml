  source_fidelity: 수정이 필요합니다. 현 초안은 ‘자기 백성에게 더해졌습니다’를 별도 문장으로 두면서 주어가 ‘그는’으로 바뀌고, 원문의 시간절(남편이 죽고 자기 백성에게 더해진 날부터)을 분리합니다. 또한 πολλοί의 문맥상 남성 복수와 두 관용구의 각주 연결을 더 정확히 반영해야 합니다.
  naturalness: ‘그녀의 생애의 모든 날 동안’과 뒤따르는 별도 문장은 다소 부자연스럽습니다. 시간절을 한 문장 안에 결합하고 ‘그녀가 살아 있는 모든 날 동안’으로 옮기면 현대 표준 한국어 합쇼체에서 자연스럽습니다.
  terminology: ‘마나셰’는 통용되는 한국어 성경식 표기이며 적절합니다. ‘알다’는 원문의 성적 완곡어법을 보존하되 각주로 뜻을 밝혀야 합니다. ‘자기 백성에게 더해지다’도 원문의 장례 관용구를 무리 없이 보존합니다.
