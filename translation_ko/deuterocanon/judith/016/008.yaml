  text: And she bound up her hair with a headband[a], and took a linen garment to deceive him.
  footnotes:
  - marker: a
    text: Or 'for his deception.' The Greek phrase can be rendered more literally, but the sense in context is that she took the garment in order to deceive him.
    reason: lexical_alternative
translation:
  language: ko
  text: 그녀는 머리카락을 미트라로 묶고, 그를 속이려고 아마 옷을 가져갔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 속임수를 위해’. 그리스어 구는 더 문자적으로 옮길 수 있으나, 문맥상 의미는 그녀가 그를 속이기 위해 그 옷을 가져갔다는 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδήσατο
  english_pob_choice: bound up
  chosen_korean: 묶고
  alternatives_korean:
  - 감고
  - 묶어 올리고
  - 동여매고
  lexicon: LSJ
  rationale: 중간태로 된 동작은 머리카락을 단정하게 고정하는 의미이므로, 한국어에서는 자연스럽게 ‘묶고’로 옮겨 원문의 행위를 간결하게 드러냅니다.
- source_word: τὰς τρίχας
  english_pob_choice: her hair
  chosen_korean: 머리카락을
  alternatives_korean:
  - 그녀의 머리카락을
  - 머리털을
  - 머리채를
  lexicon: LSJ
  rationale: 그리스어 복수형이지만 한국어에서는 집합적으로 ‘머리카락’을 쓰는 것이 자연스럽고, 문맥상 특정한 한 줌의 머리채보다 전체 머리 정돈의 의미를 잘 살립니다.
- source_word: μίτρᾳ
  english_pob_choice: headband
  chosen_korean: 미트라로
  alternatives_korean:
  - 머리띠로
  - 두건으로
  - 머리감개로
  lexicon: LSJ
  rationale: μίτρα는 여성용 머리감개나 띠를 가리키므로, 본문 어휘를 보존하기 위해 음역형 ‘미트라’를 택했습니다. 전통적 교회어 ‘관’이나 ‘미트레’는 문맥상 오해를 낳을 수 있습니다.
- source_word: στολὴν λινῆν
  english_pob_choice: a linen garment
  chosen_korean: 아마 옷을
  alternatives_korean:
  - 아마로 된 옷을
  - 아마옷을
  - 아마로 만든 겉옷을
  lexicon: LSJ
  rationale: στολή는 일반적인 ‘옷’보다 격식을 갖춘 의복을 가리키지만, 여기서는 과도하게 특정하지 않고 ‘옷’을 사용하되 λινή의 재질을 ‘아마’로 반영했습니다.
- source_word: εἰς ἀπάτην αὐτοῦ
  english_pob_choice: to deceive him
  chosen_korean: 그를 속이려고
  alternatives_korean:
  - 그의 속임수를 위해
  - 그를 속이기 위해
  - 그를 기만하려고
  lexicon: LSJ
  rationale: εἰς + 목적어가 목적을 나타내므로 한국어 목적 표현으로 옮겼습니다. ἀπάτη의 직접성을 유지하면서도 서술 문맥에 자연스러운 ‘속이려고’가 적절합니다.
theological_decisions:
- issue: 유딧의 행동을 평가하는 어조
  chosen_reading: 본문의 ἀπάτη 표현을 약화하지 않고, 단순히 ‘속이려고’라고 서술해 서사적 사실 진술을 유지했습니다.
  alternative_readings:
  - 기만하려고
  - 속이기 위한
  rationale: 원문은 전략적 기만을 노골적으로 말하며, 번역이 이를 도덕적으로 미화하거나 완화하면 서사의 긴장이 사라집니다.
