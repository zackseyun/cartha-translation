  text: And Judith dedicated to God all the equipment of Holofernes that the people had given her[b][a], and she gave to God as a dedicated offering the canopy that she had taken for herself from his bedchamber.
  footnotes:
  - marker: a
    text: Or 'mosquito net' or 'bed-curtain' for 'canopy' (Greek κωνώπιον).
    reason: lexical_alternative
  - marker: b
    text: The phrase 'as an offering' translates a term that can more specifically mean 'as a votive offering' or 'as a thing dedicated to God.'
    reason: lexical_alternative
translation:
  language: ko
  text: 유딧은 백성이 자기에게 준 홀로페르네스의 모든 물품을 하나님께 봉헌했고, 또 그의 침실에서 자신을 위해 가져온 침상 휘장[a]을 봉헌물[b]로 하나님께 드렸습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘침상 휘장’에 해당하는 κωνώπιον은 ‘모기장’이나 ‘침상 덮개’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: εἰς ἀνάθημα는 더 직역하면 ‘봉헌물로’ 또는 ‘봉헌된 것으로’라는 뜻입니다.
    reason: lexical_alternative
