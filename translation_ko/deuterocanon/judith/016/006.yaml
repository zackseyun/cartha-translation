  yaml_path: translation/deuterocanon/judith/016/006.yaml
  text: For their mighty one did not fall by the hands of young men[a], nor did sons of Titans strike him, nor did tall giants set upon him; but Judith daughter of Merari disabled him with the beauty of her face.
  footnotes:
  - marker: a
    text: Or 'paralyzed him.' The Greek verb can denote causing someone to become powerless or disabled, whether literally or figuratively.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들의 용사는 젊은이들의 손에 쓰러진 것이 아니며, 타이탄의 아들들도 그를 치지 않았고, 키 큰 거인들도 그에게 달려들지 않았습니다. 그러나 메라리의 딸 유딧이 그 얼굴의 아름다움으로 그를 무력하게 만들었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그를 마비시켰습니다.’ 그리스어 동사는 문자적 마비뿐 아니라 사람을 무력하게 만드는 뜻도 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δυνατὸς αὐτῶν
  english_pob_choice: their mighty one
  chosen_korean: 그들의 용사
  alternatives_korean:
  - 그들의 강한 사람
  - 그들의 ძლ력한 사람
  - 그들 가운데의 용사
  lexicon: LSJ
  rationale: δυνατός가 여기서는 실질적으로 집단의 강한 대표자를 가리키므로, 한국어에서는 자연스럽고 장엄한 ‘용사’로 옮겨 과도한 설명을 피했습니다.
- source_word: νεανίσκων
  english_pob_choice: young men
  chosen_korean: 젊은이들
  alternatives_korean:
  - 젊은 남자들
  - 청년들
  lexicon: LSJ
  rationale: 대조되는 상대가 신화적·초인적 존재들이므로, 평이한 현대어인 ‘젊은이들’이 연령 대비를 가장 자연스럽게 살립니다.
- source_word: ὑψηλοὶ γίγαντες
  english_pob_choice: tall giants
  chosen_korean: 키 큰 거인들
  alternatives_korean:
  - 키 큰 자이언트들
  - 높은 거인들
  - 거대한 거인들
  lexicon: LSJ
  rationale: ὑψηλοί의 문자적 높이/키를 살리면서 γίγαντες의 비현실적 이미지를 유지하기 위해 ‘키 큰 거인들’로 옮겼습니다.
- source_word: παρέλυσεν
  english_pob_choice: disabled him
  chosen_korean: 무력하게 만들었습니다
  alternatives_korean:
  - 그를 마비시켰습니다
  - 그를 무너뜨렸습니다
  - 그를 무기력하게 했습니다
  lexicon: LSJ
  rationale: 이 동사는 문자적 마비뿐 아니라 무력화도 뜻하므로, 문맥상 유딧의 아름다움이 적을 무기력하게 만든다는 뜻을 살려 ‘무력하게 만들었습니다’로 옮겼습니다.
theological_decisions:
- issue: 신화적 표현(티탄의 아들들, 거인들)의 처리
  chosen_reading: 신화적·초인적 표현을 완화하지 않고 그대로 유지했습니다.
  alternative_readings:
  - 그들을 단순히 ‘강한 자들’로 평준화함
  - 신화적 색채를 삭제함
  rationale: 본문은 유딧의 승리를 의도적으로 과장된 대비 속에 제시하므로, 신화적 표현을 평준화하면 수사적 긴장이 약해집니다.
  doctrine_reference: 'Translation philosophy: original-language primacy over domesticating paraphrase'
- issue: παρέλυσεν의 의미 강도
  chosen_reading: ‘무력하게 만들었습니다’로 번역해 비유적 무기력화를 살렸습니다.
  alternative_readings:
  - ‘마비시켰습니다’처럼 문자적 의미를 택함
  - ‘멸망시켰습니다’처럼 결과를 과도하게 확대함
  rationale: 문맥은 외적 패배보다 유딧의 아름다움이 적을 무기력하게 만든 장면이므로, 과도한 해석을 피하면서도 실제 효과를 드러내는 표현이 적절합니다.
  doctrine_reference: 'Translation philosophy: optimal equivalence; do not paraphrase beyond what the source warrants'
