  yaml_path: translation/deuterocanon/judith/016/023.yaml
  text: And she continued to prosper greatly[a], and she grew old in her husband's house for one hundred five years, and she set her maidservant free. Then she died in Bethulia[b], and they buried her in the cave of her husband Manasseh.
  footnotes:
  - marker: a
    text: Or 'she became very great indeed'; the Greek literally speaks of her 'advancing' or 'becoming great' with strong intensification.
    reason: lexical_alternative
  - marker: b
    text: The Greek term for the woman Judith freed denotes a female attendant or maid; because Judith 'set her free,' the verse implies a servile dependent status.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그녀는 크게 번성해 나갔고, 남편의 집에서 백오 년 동안 늙어 갔으며, 자기 하녀를 자유롭게 풀어 주었습니다. 그 뒤 그녀는 베툴리아에서 죽었고, 사람들은 그녀를 남편 므낫세의 동굴에 장사하였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 προβαίνω는 문자적으로는 ‘앞으로 나아가다’라는 뜻이며, 이 문맥에서는 번성과 위세의 증대를 가리킵니다.
    reason: source_note
  - marker: b
    text: ἅβρα는 일반적인 소유 관계의 하녀보다 의존적 지위에 있는 여성 보조를 가리키며, ‘자유롭게 풀어 주었다’는 표현이 그 종속 상태를 시사합니다.
    reason: source_note
lexical_decisions:
- source_word: προβαίνουσα μεγάλη σφόδρα
  english_pob_choice: continued to prosper greatly
  chosen_korean: 크게 번성해 나갔고
  alternatives_korean:
  - 계속 크게 번성했고
  - 매우 크게 나아갔고
  - 크게 전진했고
  lexicon: LSJ
  rationale: προβαίνω의 ‘앞으로 나아가다/진전하다’는 뜻을 한국어에서 자연스럽게 살리되, 문맥상 신분이나 이동이 아니라 삶의 형통과 위세의 증대를 가리키므로 ‘번성해 나가다’로 옮겼습니다.
- source_word: ἔτη ἑκατὸν πέντε
  english_pob_choice: for one hundred five years
  chosen_korean: 백오 년 동안
  alternatives_korean:
  - 백오 세 동안
  - 백오 년에 이르기까지
  - 백오 살까지
  lexicon: LSJ
  rationale: 그녀의 체류 기간이 아니라 생애의 길이를 나타내므로, 한국어에서는 연령·생애를 자연스럽게 드러내는 ‘백오 년 동안’으로 처리했습니다.
- source_word: ἀφῆκεν τὴν ἅβραν αὐτῆς ἐλευθέραν
  english_pob_choice: she set her maidservant free
  chosen_korean: 자기 하녀를 자유롭게 풀어 주었습니다
  alternatives_korean:
  - 자기 여종을 해방하였습니다
  - 자기 시녀를 풀어 주었습니다
  - 자기 여자 종을 자유롭게 하였습니다
  lexicon: LSJ
  rationale: ἅβρα는 일반적 ‘종’보다 가정 내 여성 보조를 가리키는 말이라 기본적으로 ‘하녀’로 옮기되, ἐλευθέραν과 함께 해방의 행위를 분명히 하기 위해 ‘자유롭게 풀어 주었습니다’를 붙였습니다.
- source_word: εἰς Βαιτυλουὰ
  english_pob_choice: in Bethulia
  chosen_korean: 베툴리아에서
  alternatives_korean:
  - 베툴리아 안에서
  - 베툴리아로
  lexicon: LSJ
  rationale: 죽음과 결합한 εἰς는 장소 의미로 자연스럽게 쓰이므로, 한국어 역시 사망 장소를 드러내는 ‘-에서’로 옮겼습니다.
- source_word: σπηλαίῳ τοῦ ἀνδρὸς αὐτῆς Μανασσῆ
  english_pob_choice: in the cave of her husband Manasseh
  chosen_korean: 남편 므낫세의 동굴에 장사하였습니다
  alternatives_korean:
  - 남편 므낫세의 굴에 묻었습니다
  - 남편 므낫세의 무덤 동굴에 안장하였습니다
  lexicon: LSJ
  rationale: σπήλαιον은 문자적으로 ‘동굴’이지만 장례 문맥이므로 ‘장사하다’로 기능을 살리고, 인명은 한국어 음역 관행에 따라 ‘므낫세’로 옮겼습니다.
theological_decisions:
- issue: 번역 어휘가 암시하는 여성 종속 신분의 강도
  chosen_reading: 본문에는 ‘하녀’로 두되, ‘자유롭게 풀어 주었습니다’로 해방 행위를 명시해 종속적 지위를 드러냈습니다.
  alternative_readings:
  - 여종
  - 여자 종
  - 시녀
  rationale: 본문의 ἅβρα는 공적 신분 용어라기보다 가정 내 여성 보조를 가리키지만, 곧바로 ‘풀어 주다/자유롭게 하다’가 뒤따르므로 단순한 고용인보다 의존적 관계가 있었음을 읽게 합니다. 한국어에서는 지나치게 법적·노예제적 뉘앙스를 고정하기보다 서술 흐름을 살리되, 해방 동작으로 그 긴장을 보존했습니다.
