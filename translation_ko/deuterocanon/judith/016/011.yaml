theological_decisions:
- issue: 마지막 절 ἀνετράπησαν의 지시 대상
  chosen_reading: 앞선 주어와 문법적으로 이어지는 표현을 유지하되, 적이 명시적으로 덧붙여졌다고 풀어 쓰지 않았습니다.
  alternative_readings:
  - 나의 낮은 이들이 무너졌습니다
  - 그들의 적이 무너졌습니다
  rationale: 그리스어는 압축적이며 이 절만으로는 마지막 패시브가 누구에게 직접 귀속되는지 약간의 긴장이 남습니다. 그래서 해석으로 긴장을 해소하지 않고, 현존 형태의 모호함을 그대로 보존했습니다.
  doctrine_reference: 원문 우선과 번역의 신학적 긴장 보존
