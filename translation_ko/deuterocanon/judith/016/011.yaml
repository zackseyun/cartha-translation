  lexicon: LSJ
  rationale: ἀσθενοῦντες는 ‘약한, 허약한’ 사람들을 가리키는 실질적 용법이므로, 자연스러운 현대 한국어로 ‘약한 이들’이라 옮겨 대비를 분명히 했습니다.
- source_word: ἐπτοήθησαν
