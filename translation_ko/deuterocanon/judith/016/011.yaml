  text: Then my lowly ones shouted[a], and my weak ones were afraid and panicked; they raised their voice[b], and they were overthrown.
  footnotes:
  - marker: a
    text: Or 'raised a war-cry' for 'shouted'; the Greek verb can denote a loud cry with martial force in context.
    reason: lexical_alternative
  - marker: b
    text: 'The final clause, ''and they were overthrown,'' is ambiguous in this Greek wording: it may continue referring to Judith''s ''lowly'' and ''weak'' ones, or it may imply their opponents were overthrown.'
    reason: alternative_reading
translation:
  language: ko
  text: 그때에 나의 낮은 이들이 소리쳤고, 나의 약한 이들은 두려워하며 당황하였으며, 그들은 목소리를 높였고 무너졌습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘소리쳤고’는 전투적 함성까지 포함할 수 있습니다. 문맥상 ‘전쟁 함성을 질렀고’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 마지막 절은 문법상 앞의 ‘나의 낮은 이들 / 나의 약한 이들’을 계속 가리킬 수도 있고, 그들의 적이 무너졌다는 뜻으로 암시될 수도 있습니다.
    reason: alternative_reading
