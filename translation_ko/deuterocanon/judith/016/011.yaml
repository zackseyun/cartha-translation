translation:
  language: ko
  text: 그때에 나의 비천한 이들이 외쳤고[a], 나의 약한 이들은 두려워하고 공포에 사로잡혔습니다. 그들은 목소리를 높였고, 쓰러졌습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘외쳤고’는 전투적 함성을 뜻할 수도 있습니다. 문맥상 ‘전쟁 함성을 질렀고’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 마지막 절의 ‘쓰러졌습니다’는 문법상 앞의 ‘나의 비천한 이들 / 나의 약한 이들’을 계속 가리킬 수도 있고, 그들의 적이 쓰러졌다는 뜻을 암시할 수도 있습니다.
    reason: alternative_reading
