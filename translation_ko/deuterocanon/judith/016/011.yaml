  source_fidelity: 그리스어의 사건 순서와 마지막 동사 ἀνετράπησαν의 불분명한 지시 대상은 대체로 보존했습니다. 그러나 ἐφοβήθησαν과 ἐπτοήθησαν은 각각 독립된 과거 동사인데, 초안의 ‘두려워하며 당황하였으며’는 앞 동사를 동시적 부사절처럼 약화합니다. 또한 ‘당황하다’는 ἐπτοήθησαν의 강한 공포·혼란의 어조를 충분히 나타내지 못합니다.
  naturalness: ‘나의 낮은 이들’은 현대 한국어에서 다소 부자연스럽습니다. 사회적으로 낮거나 비천한 처지를 뜻할 수 있는 ‘나의 비천한 이들’이 문맥상 더 자연스럽고, 도덕적 겸손으로 한정하지도 않습니다. 각주 표지는 해당 어구 바로 뒤에 두는 편이 독자에게 명확합니다.
  terminology: ταπεινοί는 ‘비천한 이들’로, ἀσθενοῦντες는 ‘약한 이들’로 옮겨 상태적 대비를 유지했습니다. ἐπτοήθησαν은 ‘공포에 사로잡혔습니다’로 옮겨 앞선 ‘두려워하였습니다’보다 심화된 반응을 살렸습니다. ἀνετράπησαν은 군사적 패배로 단정하지 않고 ‘쓰러졌습니다’로 두되, 지시 대상의 모호성은 각주에서 밝혔습니다.
