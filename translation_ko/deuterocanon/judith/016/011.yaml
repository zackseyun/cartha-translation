  lexicon: LSJ
  rationale: 이 동사는 단순한 두려움보다 더 강한 동요·혼란을 뜻하지만, 현대 한국어에서 과도하게 해석적이지 않으면서 다음 동작으로 이어지는 충격을 보존하려고 ‘당황하였으며’를 선택했습니다.
- source_word: ἀνετράπησαν
  english_pob_choice: they were overthrown
  chosen_korean: 무너졌습니다
  alternatives_korean:
