  source_fidelity: 첫 문장의 ‘저는’은 그리스어의 복수 명령형 Ἐξάρχετε와 맞지 않으며 삭제되어야 합니다. τύμπανον은 일반적인 ‘드럼’보다 손에 들고 치는 ‘탬버린’이 정확합니다. ἐναρμόσασθε는 단순한 찬송 행위보다 시편과 찬양을 조화롭게 마련하거나 배열하는 이미지를 지니므로 이를 유지했습니다. 마지막 두 동사는 모두 명령형이므로 연결형 ‘높이며’ 대신 병렬 명령으로 옮겼습니다.
  naturalness: ‘하나님께 드럼과 함께 노래를 시작하십시오’는 도구 표현과 높임의 결합이 다소 부자연스럽습니다. ‘하나님을 위하여 탬버린을 치며’ 및 ‘주님을 위하여 심벌즈를 치며’는 현대 표준어 예배 문맥에서 자연스럽습니다. 각주 표지도 해당 어구 바로 뒤로 옮겼습니다.
  terminology: θεός는 ‘하나님’, κύριος는 기존 결정에 따라 ‘주님’으로 유지했습니다. ψαλμός는 ‘시편’, αἶνος는 ‘찬양’으로 유지했습니다. τύμπανον은 ‘탬버린’, κύμβαλον은 ‘심벌즈’로 구별했습니다.
