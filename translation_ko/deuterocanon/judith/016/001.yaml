  yaml_path: translation/deuterocanon/judith/016/001.yaml
  text: Begin the song to my God with tambourines[a]; sing to the Lord with cymbals; fit to him a psalm and praise[b]; exalt and call upon his name.
  footnotes:
  - marker: a
    text: Or 'Lead off for my God with tambourines' or 'Strike up for my God with tambourines.' The opening imperative Ἐξάρχετε is a musical command to begin or lead a song.
    reason: lexical_alternative
  - marker: b
    text: The verb rendered 'fit to him' (ἐναρμόσασθε) can also mean 'sing in harmony to him' or 'arrange for him,' preserving the image of setting a psalm and praise in proper musical form.
    reason: lexical_alternative
translation:
  language: ko
  text: 나의 하나님을 위하여 탬버린을 치며 노래를 시작하십시오.[a] 주님을 위하여 심벌즈를 치며 노래하십시오. 그분께 시편과 찬양을 조화롭게 갖추어 드리십시오.[b] 그분을 높이고 그분의 이름을 부르십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘개시하라’, ‘선창하라’에 가깝습니다. 이 동사는 노래나 연주의 시작을 알리는 음악적 명령입니다.
    reason: lexical_alternative
  - marker: b
    text: ἐναρμόσασθε는 ‘조화롭게 맞추다’, ‘어울리게 배열하다’라는 뜻도 가질 수 있습니다. 여기서는 시편과 찬양을 하나님께 조화롭게 갖추어 드리는 음악적 형상을 살렸습니다.
    reason: lexical_alternative
