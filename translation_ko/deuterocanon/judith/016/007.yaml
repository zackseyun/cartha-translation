  text: For she took off her widow’s clothing for the lifting up of those who were afflicted in Israel,[a]
  footnotes:
  - marker: a
    text: Or 'for the exaltation of those who suffered in Israel.' The Greek phrase εἰς ὕψος is somewhat compressed, and 'lifting up' preserves the image while 'exaltation' is a possible alternative.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 자기의 과부 옷을 벗어 버린 것은 이스라엘의 고난받는 이들을 높이기 위함이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이스라엘에서 고난받는 이들을 높이심을 위함이었습니다.’ 그리스어 구문 εἰς ὕψος는 다소 압축되어 있어, ‘높이기’는 이미지를 살리고 ‘높이심/격상’은 가능한 대안입니다.
    reason: lexical_alternative
