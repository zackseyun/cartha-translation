  - ‘높임을 위해’
  - ‘격상을 위해’
  rationale: 영어 POB가 설명한 대로 이 구절의 그리스어는 압축적이어서, ‘높이기’는 은유를 보존하면서도 과도한 신학적 추상화를 피합니다.
  doctrine_reference: 본문의 문학적-수사적 의미 유지
- issue: 주어의 지시를 여성 인물로 분명히 드러낼지 여부
  chosen_reading: 문맥상 유디트의 행위를 가리키므로 ‘그가’로 시작했습니다.
  alternative_readings:
