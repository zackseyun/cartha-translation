theological_decisions:
- issue: εἰς ὕψος의 의미를 ‘exaltation’이 아니라 ‘lifting up’ 계열로 유지할지 여부
  chosen_reading: ‘높이기 위함’으로 옮겨, 물리적 상승 이미지와 회복/격상을 함께 보이게 했습니다.
  alternative_readings:
