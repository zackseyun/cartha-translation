base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/016/017.yaml
  text: Woe to the nations rising up against my people[a]; the Lord Almighty will take vengeance on them in the day of judgment, to put fire and worms in their flesh[b], and they will weep in pain forever.
  footnotes:
  - marker: a
    text: Or 'my kin' or 'my nation'; Greek 'my genos' refers to Judith's own people-group.
    reason: lexical_alternative
  - marker: b
    text: Greek 'in sensation/perception'; rendered 'in pain' here because the context is bodily punishment.
    reason: lexical_alternative
translation:
  language: ko
  text: 민족들아, 내 겨레를 거슬러 일어나는 자들에게 화가 있습니다[a]. 주 만군의 하나님께서 심판의 날에 그들에게 복수하셔서, 그들의 살에 불과 구더기를 두시고[b], 그들은 고통 속에서 영원히 울 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 genos는 여기서 ‘겨레’, ‘민족’, ‘백성’을 모두 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어는 문자적으로 ‘감각/지각 안에서’입니다. 여기서는 몸의 형벌 문맥에 따라 ‘고통 속에서’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐαί
  english_pob_choice: Woe
  chosen_korean: 화가 있습니다
  alternatives_korean:
  - 화 있을 것입니다
  - 불행합니다
  lexicon: BDAG
  rationale: 예언적·사법적 경고의 외침으로서, 현대 한국어에서 가장 직접적으로 그 긴장을 살리는 표현입니다.
- source_word: ἔθνεσιν
  english_pob_choice: the nations
  chosen_korean: 민족들
  alternatives_korean:
  - 나라들
  - 이방 민족들
  lexicon: BDAG
  rationale: 유다를 대적하는 외국 집단들을 가리키므로, 신약식 ‘이방인들’보다 ‘민족들’이 문맥에 더 자연스럽습니다.
- source_word: τῷ γένει μου
  english_pob_choice: my people
  chosen_korean: 내 겨레
  alternatives_korean:
  - 내 백성
  - 내 민족
  - 내 혈통
  lexicon: BDAG
  rationale: γένoς는 혈통·족속·민족공동체를 가리킬 수 있으므로, 유딧의 동일 집단성을 살리면서도 현대 한국어에서 이해하기 쉬운 ‘내 겨레’로 옮겼습니다.
- source_word: Κύριος Παντοκράτωρ
  english_pob_choice: the Lord Almighty
  chosen_korean: 주 만군의 하나님
  alternatives_korean:
  - 전능하신 주님
  - 주 전능자
  lexicon: BDAG
  rationale: Παντοκράτωρ의 절대 주권을 ‘만군의 하나님’으로 옮기되, κύριος는 ‘주’로 살려 경외적 호칭을 유지했습니다.
- source_word: ἐκδικήσει
  english_pob_choice: will take vengeance on
  chosen_korean: 복수하실
  alternatives_korean:
  - 보복하실
  - 원수를 갚으실
  - 심판하실
  lexicon: BDAG
  rationale: 문맥상 단순 처벌보다 보응·응징의 뉘앙스가 강하므로, 직접적이고 강한 ‘복수하실’이 본문 감정을 가장 잘 드러냅니다.
- source_word: ἐν ἡμέρᾳ κρίσεως
  english_pob_choice: in the day of judgment
  chosen_korean: 심판의 날에
  alternatives_korean:
  - 재판의 날에
  - 판결의 날에
  lexicon: BDAG
  rationale: 정해진 종말론적 사법 표현이므로, 한국어에서도 관용적으로 통하는 ‘심판의 날’이 가장 적절합니다.
- source_word: δοῦναι πῦρ καὶ σκώληκας εἰς σάρκας αὐτῶν
  english_pob_choice: to put fire and worms into their flesh
  chosen_korean: 그들의 살에 불과 구더기를 두시고
  alternatives_korean:
  - 그들의 살에 불과 벌레를 넣으시고
  - 그들의 몸에 불과 구더기를 넣으시고
  lexicon: BDAG
  rationale: εἰς σάρκας αὐτῶν의 물리적·신체적 이미지를 보존하기 위해 ‘살’과 ‘불과 구더기’를 직설적으로 유지했습니다.
- source_word: ἐν αἰσθήσει
  english_pob_choice: in pain
  chosen_korean: 고통 속에서
  alternatives_korean:
  - 감각 속에서
  - 느낌 속에서
  - 고통 가운데
  lexicon: LSJ
  rationale: αἴσθησις의 문자적 의미는 ‘감각/지각’이지만, 형벌 맥락에서는 체험되는 고통을 가리키므로 ‘고통 속에서’로 옮겼습니다.
- source_word: ἕως αἰῶνος
  english_pob_choice: forever
  chosen_korean: 영원히
  alternatives_korean:
  - 끝없이
  - 세세토록
  lexicon: BDAG
  rationale: 지속성을 강조하는 관용적 종결 표현이므로, 가장 자연스러운 한국어 ‘영원히’로 옮겼습니다.
theological_decisions:
- issue: 징벌의 강도와 지속성
  chosen_reading: 본문의 무게를 약화하지 않고, 육체적 형벌과 지속적 울음의 이미지를 그대로 살렸습니다.
  alternative_readings:
  - 완곡하게 ‘벌을 받다’로 낮추는 방식
  - ‘고통 가운데’ 대신 ‘느낌 속에서’처럼 해석을 비우는 방식
  rationale: 그리스어는 강한 보응과 신체적 형벌을 분명히 말하므로, 이를 완화하지 않고 독자가 즉시 감지하도록 번역했습니다. 동시에 αἴσθησις는 본문이 허용하는 범위 안에서 ‘고통’으로 처리해 과도한 교리화를 피했습니다.
  doctrine_reference: 본문 자체의 심판 언어와 고통 이미지를 보존하되, 체계신학적 세부를 덧씌우지 않습니다.
