base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/016/017.yaml
  text: Woe to the nations rising up against my people[a]; the Lord Almighty will take vengeance on them in the day of judgment, to put fire and worms in their flesh[b], and they will weep in pain forever.
  footnotes:
  - marker: a
    text: Or 'my kin' or 'my nation'; Greek 'my genos' refers to Judith's own people-group.
    reason: lexical_alternative
  - marker: b
    text: Greek 'in sensation/perception'; rendered 'in pain' here because the context is bodily punishment.
    reason: lexical_alternative
translation:
  language: ko
  text: 내 겨레[a]를 거슬러 일어나는 민족들에게 화가 있습니다. 전능하신 주님께서 심판의 날에 그들에게 복수하셔서, 그들의 살 속에 불과 구더기를 넣으시고, 그들은 고통[b] 속에서 영원히 울 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 genos는 여기서 ‘겨레’, ‘민족’, ‘백성’을 모두 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어는 문자적으로 ‘감각/지각 안에서’입니다. 여기서는 몸의 형벌 문맥에 따라 ‘고통 속에서’로 옮겼습니다.
    reason: lexical_alternative
