theological_decisions:
- issue: 징벌의 강도와 지속성
  chosen_reading: 본문의 무게를 약화하지 않고, 육체적 형벌과 지속적 울음의 이미지를 그대로 살렸습니다.
  alternative_readings:
  - 완곡하게 ‘벌을 받다’로 낮추는 방식
  - ‘고통 가운데’ 대신 ‘느낌 속에서’처럼 해석을 비우는 방식
  rationale: 그리스어는 강한 보응과 신체적 형벌을 분명히 말하므로, 이를 완화하지 않고 독자가 즉시 감지하도록 번역했습니다. 동시에 αἴσθησις는 본문이 허용하는 범위 안에서 ‘고통’으로 처리해 과도한 교리화를 피했습니다.
  doctrine_reference: 본문 자체의 심판 언어와 고통 이미지를 보존하되, 체계신학적 세부를 덧씌우지 않습니다.
