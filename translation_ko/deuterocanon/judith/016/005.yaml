  rationale: 본문의 신적 전능과 통치성을 살리되, 한국어에서 익숙한 ‘전능’ 직역보다 칭호의 울림을 살린 표현으로 옮겼습니다.
- source_word: ἠθέτησεν
  english_pob_choice: nullified
  chosen_korean: 무력화하셨습니다
  alternatives_korean:
  - 무효로 하셨습니다
