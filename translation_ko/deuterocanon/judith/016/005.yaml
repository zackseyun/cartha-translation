  - 무효화하셨습니다
  lexicon: BDAG
  rationale: ἐν χειρὶ θηλείας와 결합된 승리 맥락에서, 상대를 ‘무효로 만들다/좌절시키다’의 뜻을 자연스럽고 힘 있게 드러내는 표현으로 옮겼습니다.
- source_word: ἐν χειρὶ θηλείας
  english_pob_choice: by the hand of a woman
  chosen_korean: 한 여인의 손으로
  alternatives_korean:
  - 한 여인을 통해
  - 여인의 손을 통해
  lexicon: BDAG
  rationale: 히브리계 관용구인 ‘~의 손으로’를 보존해, 하나님이 뜻밖의 인간 도구를 통해 일하셨다는 점을 분명히 했습니다.
theological_decisions:
- issue: Παντοκράτωρ의 한국어 처리
  chosen_reading: ‘만군의 주’로 옮겨 하나님의 주권적 능력과 통치를 함께 드러냈습니다.
  alternative_readings:
  - 전능하신 주
  - 전능자
  rationale: 단순한 형용사화보다 칭호의 무게를 살리는 쪽이 본문의 찬양적·신학적 효과에 더 가깝습니다.
  doctrine_reference: 'DOCTRINE.md: titles of God should preserve force and dignity'
- issue: ‘여인의 손으로’의 도구성
  chosen_reading: ‘한 여인의 손으로’라는 관용을 살려 하나님이 예상 밖의 수단을 사용하셨다는 긴장을 유지했습니다.
  alternative_readings:
  - 한 여인을 통해
  rationale: 본문은 단순한 수단 설명을 넘어 역전의 표지를 주므로, 관용구를 보존하는 것이 신학적 강조를 더 잘 전달합니다.
  doctrine_reference: 'DOCTRINE.md: preserve theological tension rather than resolve it'
