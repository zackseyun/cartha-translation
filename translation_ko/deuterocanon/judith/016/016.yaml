theological_decisions:
- issue: 제사와 하나님 경외의 상대적 가치
  chosen_reading: 제물 자체의 가치는 작게 말하면서, 주님을 두려워하는 사람의 가치를 영원한 위대함으로 대조합니다.
  alternative_readings:
  - 제사 없이도 경외만이 참된 가치를 가진다는 뜻으로 확장해 읽을 수 있습니다.
  rationale: 그리스어는 희생제물의 ‘작음’과 경외하는 사람의 ‘위대함’을 직접 대조하므로, 반제사적 신학을 덧붙이지 않고 긴장을 보존했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
- issue: διὰ παντός의 범위
  chosen_reading: 영원히
  alternative_readings:
  - 항상
  - 늘
  rationale: 이 표현은 지속성 또는 영속성을 모두 가리킬 수 있으나, 격언적 대구에서 상태의 지속을 강조하므로 ‘영원히’가 가장 자연스럽습니다.
  doctrine_reference: 'Lexical ambiguity: continual duration vs enduring permanence'
