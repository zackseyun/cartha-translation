translation:
  language: ko
  text: 주님, 온 창조물이 주님을 섬기게 하십시오. 주님께서 말씀하셨으니 그것들이 생겨났습니다. 주님께서 주님의 영[a]을 보내셨고, 그 영이 그것들을 세웠습니다. 주님의 음성에 맞설 자는 아무도 없습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주님의 숨결’ 또는 ‘주님의 바람’으로 옮길 수 있습니다. 그리스어 단어는 창조 문맥에서 이 세 가지 뜻을 모두 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: δουλευσάτω
  english_pob_choice: serve
  chosen_korean: 섬기게 하십시오
  alternatives_korean:
  - 복종하게 하십시오
  - 종이 되게 하십시오
  lexicon: BDAG
  rationale: δουλεύω의 핵심은 섬김 또는 종속이지만, 무생물적 창조 전체를 주어로 삼는 이 시적 문맥에서는 ‘섬기다’가 가장 자연스럽고, 강한 예속 이미지는 과도하게 만들지 않습니다.
- source_word: πᾶσα ἡ κτίσις σου
  english_pob_choice: all your creation
  chosen_korean: 당신의 모든 창조물
  alternatives_korean:
  - 당신의 모든 피조물
  - 당신의 온 창조
  lexicon: LSJ
  rationale: κτίσις는 집합적 의미의 창조/피조 세계를 가리킬 수 있으므로, ‘모든 창조물’로 옮겨 전체성을 살리면서도 개별 피조물의 포괄을 유지했습니다.
- source_word: ἀπέστειλας τὸ πνεῦμά σου
  english_pob_choice: you sent out your Spirit
  chosen_korean: 당신의 영을 보내시니
  alternatives_korean:
  - 당신의 숨결을 보내시니
  - 당신의 바람을 보내시니
  lexicon: BDAG
  rationale: πνεῦμα는 창조 문맥에서 영/숨결/바람의 중의성을 가지지만, 본문은 하나님의 창조적 행위를 말하므로 मुख्य 본문은 ‘영’으로 두고 동사의 시상에 맞게 자연스럽게 옮겼습니다.
- source_word: ᾠκοδόμησεν
  english_pob_choice: formed them
  chosen_korean: 형성되었습니다
  alternatives_korean:
  - 지어졌습니다
  - 세워졌습니다
  lexicon: LSJ
  rationale: οἰκοδομέω의 문자적 뜻은 ‘짓다’이지만, 여기서는 창조 질서의 구성·형성을 가리키므로 한국어에서는 ‘형성되다’가 시적이면서도 의미를 가장 잘 반영합니다.
- source_word: τῇ φωνῇ σου
  english_pob_choice: your voice
  chosen_korean: 당신의 음성
  alternatives_korean:
  - 당신의 말씀
  - 당신의 소리
  lexicon: BDAG
  rationale: φωνή는 문자적으로 ‘음성/소리’이며, 추상화한 ‘말씀’보다 음성 이미지를 유지하는 편이 본문의 창조-명령 어조를 더 잘 드러냅니다.
theological_decisions:
- issue: πνεῦμα의 번역에서 영/숨결/바람의 중의성 처리
  chosen_reading: 본문은 ‘당신의 영’을 사용하고, 각주 없이 본문 의미를 우선합니다.
  alternative_readings:
  - 당신의 숨결
  - 당신의 바람
  rationale: 이 절은 창조 기사와 공명하면서도 하나님의 능동적 창조 행위를 강조하므로, POB의 영어 본문처럼 ‘영’이 가장 신학적으로 중심적인 읽기입니다. 다만 한국어 본문에서는 과도한 설명을 덧붙이지 않고 간결하게 유지했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 3
