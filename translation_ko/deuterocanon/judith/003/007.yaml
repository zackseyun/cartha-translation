  source_fidelity: 그리스어의 강조된 αὐτοὶ와 집합적 표현 πᾶσα ἡ περίχωρος αὐτῶν, 그리고 축제적 수반 요소를 대체로 반영했습니다. 다만 ‘온 지역’ 자체를 사람과 병렬 주어로 두면 한국어에서 지역이 직접 맞이한 듯하여 다소 부자연스럽습니다. ‘지역의 사람들’로 풀어 집합적 주체를 자연스럽게 드러내는 것이 안전합니다.
