theological_decisions:
- issue: 이 구절의 환영 행렬을 단순한 개인 환대가 아니라 공동체적 축제 의례로 어떻게 나타낼지
  chosen_reading: ‘그들 자신과 그들 주변의 온 지역’으로 옮겨, 중심 인물 한 사람의 접대가 아니라 지역 전체가 참여한 공개적 환영임을 드러냈습니다.
  alternative_readings:
  - ‘그들이 그를 맞이했습니다’처럼 단순화
  - ‘그들 주변의 모든 지방’처럼 더 행정적인 표현
  rationale: 본문은 춤과 소고까지 동반된 집단적 축제를 보여 주므로, 지역 전체가 가세한 공개 환영이라는 서술 효과를 보존하는 것이 중요합니다.
  doctrine_reference: 서사 문맥 보존 원칙
