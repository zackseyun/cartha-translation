  chosen_reading: 앞절의 복수 주어를 이어받는 군대의 이동 서술 속에서도 ἦν ἐκεῖ의 단수는 지휘자를 가리키는 것으로 살려 ‘그는’으로 옮겼습니다.
  alternative_readings:
