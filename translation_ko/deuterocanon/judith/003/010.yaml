base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/003/010.yaml
  text: And they encamped between Gaibai and the city of the Scythians[a], and he was there for a full month[c][b], to gather all the full complement of his forces.
  footnotes:
  - marker: a
    text: Or 'Scythopolis'; Greek literally, 'the city of Scythians.'
    reason: alternative_reading
  - marker: b
    text: Greek 'a month of days,' an idiomatic expression for a month.
    reason: lexical_alternative
  - marker: c
    text: Or 'all the equipment' or 'the complete number' of his forces; the Greek term can denote full military readiness or full complement.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그들은 가이바이와 스키드인들의 도성 사이에 진을 쳤습니다[a]. 그리고 그는 그곳에 한 달 동안 머물며[c][b] 자기 군대의 전력을 모두 모으려 했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘스키드폴리스’. 그리스어는 문자적으로 ‘스키드인들의 도성’입니다.
    reason: alternative_reading
  - marker: b
    text: 그리스어 ‘날들의 달’은 한 달을 뜻하는 관용적 표현입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘전력의 모든 완전한 편제’, 곧 군사력의 완전한 충원을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατεστρατοπέδευσαν
  english_pob_choice: encamped
  chosen_korean: 진을 쳤습니다
  alternatives_korean:
  - 야영했습니다
  - 캠프를 쳤습니다
  lexicon: LSJ
  rationale: 군사적 상황에서 στρατοπεδεύω 계열은 단순한 숙박이 아니라 군영을 설치하는 뜻이므로, ‘진을 치다’가 가장 자연스럽고 소스에 가깝습니다.
- source_word: Γαιβαὶ
  english_pob_choice: Gaibai
  chosen_korean: 가이바이
  alternatives_korean:
  - 가바이
  - 게바
  lexicon: 고유명사 음역
  rationale: 그리스어 형태를 그대로 옮겨 음역했습니다. 본문 자체가 다른 지명과의 조화를 요구하지 않으므로 표준 외래어 방식의 음역을 택했습니다.
- source_word: Σκυθῶν πόλεως
  english_pob_choice: the city of the Scythians
  chosen_korean: 스키드인들의 도성
  alternatives_korean:
  - 스키드인들의 성읍
  - 스키드폴리스
  lexicon: LSJ
  rationale: 그리스어는 문자적으로 ‘스키드인들의 도시’이므로, 본문에서는 투명한 직역을 유지했습니다. 전통적 지명인 ‘스키드폴리스’는 본문이 아니라 주석 가능 항목으로 남겨 두는 편이 소스에 충실합니다.
- source_word: μῆνα ἡμερῶν
  english_pob_choice: for a month of days
  chosen_korean: 한 달 동안
  alternatives_korean:
  - 한 달 동안의 날들로
  - 한 달의 날 동안
  lexicon: LSJ
  rationale: 직역하면 ‘날들의 달’이라는 셈어적 관용구이지만, 한국어에서는 이를 ‘한 달 동안’으로 옮겨 의미를 살리되 과도한 어색함은 피했습니다.
- source_word: ἀπαρτίαν
  english_pob_choice: the full complement
  chosen_korean: 전력을
  alternatives_korean:
  - 완전한 편제를
  - 만반의 준비를
  - 전체 병력을
  lexicon: LSJ
  rationale: 군사적 맥락에서 ἀπαρτία는 ‘완전한 갖춤’과 ‘전력의 충원’을 아우르므로, 뒤의 ‘군대’와 함께 읽힐 때 ‘전력’이 가장 포괄적입니다.
- source_word: δυνάμεως αὐτοῦ
  english_pob_choice: of his forces
  chosen_korean: 자기 군대의
  alternatives_korean:
  - 그의 군대의
  - 자기 힘의
  lexicon: LSJ
  rationale: 여기서 δύναμις는 추상적 ‘힘’이 아니라 군사력입니다. 한국어에서는 ‘군대’가 자연스럽고 문맥상 명확합니다.
