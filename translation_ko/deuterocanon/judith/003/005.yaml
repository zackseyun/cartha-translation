translation:
  language: ko
  text: 그리고 그 남자들이 오로페르네스에게 가서, 이 말들에 따라 그에게 보고했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘이 말들에 따라’로, 직전에 전해진 정확한 내용에 맞추어 보고했다는 뜻입니다. 한국어로는 더 자연스럽게 ‘이 말대로/이 말에 따라’로 옮길 수도 있습니다.
    reason: lexical_alternative
