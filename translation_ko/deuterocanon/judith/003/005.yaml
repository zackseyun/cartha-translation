  rationale: 앞선 문맥에서 파견된 인물들을 가리키는 복수 남성 표현이므로, 지시성을 살린 ‘그 남자들이’가 직접적입니다.
- source_word: ἀπήγγειλαν
  english_pob_choice: reported
  chosen_korean: 보고했습니다
  alternatives_korean:
  - 알렸습니다
  - 전했습니다
  - 말했습니다
  lexicon: BDAG
  rationale: 단순 발화보다 전달된 소식을 다시 전하는 의미가 강하므로, 임무 수행 맥락에 맞는 ‘보고했습니다’가 가장 잘 맞습니다.
- source_word: κατὰ τὰ ῥήματα ταῦτα
  english_pob_choice: according to these words
  chosen_korean: 이 말들에 따라
  alternatives_korean:
  - 이 말대로
  - 이 말에 따라
  - 이러한 말들에 따라
  lexicon: BDAG
  rationale: 헬라어의 직역 성격을 살리면서도 한국어에서 어색하지 않게, 직전 발화의 내용과 일치하여 보고했음을 나타내는 표현으로 옮겼습니다.
