    text: Or, more idiomatically, 'reported to him in these words.' The Greek more literally says 'according to these words,' likely pointing back to the exact message just delivered.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그 남자들이 홀로페르네스에게 가서 이 말대로 보고했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘이 말들에 따라’입니다. 이는 직전에 전해진 말의 내용에 맞추어 보고했다는 뜻입니다. 한국어로는 ‘이 말대로’라고 자연스럽게 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεγένοντο
  english_pob_choice: came
  chosen_korean: 가서
  alternatives_korean:
  - 왔습니다
  - 도착했습니다
  - 나아가
  lexicon: BDAG
  rationale: 서사 흐름에서 단순한 이동을 나타내므로, 과도하게 형식적인 ‘도착했습니다’보다 자연스럽고 간결한 ‘가서’가 적절합니다.
- source_word: οἱ ἄνδρες
