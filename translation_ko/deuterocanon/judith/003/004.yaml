translation:
  language: ko
  text: 보십시오, 우리의 성읍들과 그 안에 사는 사람들도 모두 당신의 노예입니다. 오셔서 그 성읍들을 당신 보시기에 좋은 대로 다루십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘종들’. 그리스어 단어는 둘 다 뜻할 수 있지만, 여기서는 정복 아래의 종속을 더 강하게 드러냅니다.
