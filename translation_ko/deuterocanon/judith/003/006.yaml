  text: And he and his force went down to the coast[a], and he garrisoned the high cities, and they took chosen men from them into alliance.
  footnotes:
  - marker: a
    text: Greek 'they took' is plural, though the surrounding narrative has singular verbs ('he went down,' 'he garrisoned'). The plural may refer to his forces acting under his command; some English renderings smooth this to 'he took.'
    reason: alternative_reading
translation:
  language: ko
  text: 그와 그의 군대는 해안으로 내려갔습니다. 그는 높은 도시들에 수비대를 배치했고, 그들은 그들 가운데서 선발된 남자들을 동맹에 받아들였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 ‘그들은 받아들였습니다’(ἔλαβον)는 복수형이지만, 앞의 서술은 ‘그가 내려갔습니다’, ‘그가 수비대를 배치했습니다’처럼 단수 동사로 이어집니다. 이 복수형은 그의 군대가 그의 지휘 아래 함께 행동한 것을 가리킬 수 있습니다.
    reason: source_note
lexical_decisions:
- source_word: κατέβη ἐπὶ τὴν παραλίαν
  english_pob_choice: went down to the coast
  chosen_korean: 해안으로 내려가고
  alternatives_korean:
  - 바닷가로 내려가고
  - 해변으로 내려가고
  - 해안 지역으로 내려가고
  lexicon: LSJ
  rationale: καταβαίνω의 방향성인 ‘내려가다’를 살리면서 παραλίαν을 자연스럽게 ‘해안’으로 옮겼습니다.
- source_word: ἡ δύναμις αὐτοῦ
  english_pob_choice: his force
  chosen_korean: 그의 군대
  alternatives_korean:
  - 그의 무력
  - 그의 병력
  - 그의 부대
  lexicon: LSJ
  rationale: 이 문맥의 δύναμις는 군사력/병력을 가리키므로, 한국어에서는 가장 분명한 ‘군대’로 옮겼습니다.
- source_word: ἐφρούρησε τὰς πόλεις τὰς ὑψηλάς
  english_pob_choice: he garrisoned the high cities
  chosen_korean: 높은 도시들을 주둔시켰으며
  alternatives_korean:
  - 높은 도시들을 지켰으며
  - 높은 도시들에 수비대를 두었으며
  - 높은 도시들을 경비했으며
  lexicon: LSJ
  rationale: ἐφρούρησε는 단순한 감시보다 군대를 배치해 통제하는 의미가 있어 ‘주둔시키다’가 가장 가깝습니다.
- source_word: ἔλαβον ἐξ αὐτῶν εἰς συμμαχίαν ἄνδρας ἐπιλέκτους
  english_pob_choice: they took chosen men from them into alliance
  chosen_korean: 그들은 그들로부터 선택된 사람들을 동맹으로 데려갔습니다
  alternatives_korean:
  - 그들은 그들 가운데서 선택된 사람들을 동맹으로 끌어갔습니다
  - 그들은 그들로부터 선택된 남자들을 동맹으로 받아들였습니다
  - 그들은 그들 중에서 선택된 사람들을 동맹을 위해 데려갔습니다
  lexicon: LSJ
  rationale: ἔλαβον의 복수형을 그대로 살렸고, εἰς συμμαχίαν은 ‘동맹으로’로 옮겨 결합/편입의 방향을 드러냈습니다.
theological_decisions:
- issue: 복수 동사의 보존과 서술 주체의 긴장
  chosen_reading: 마지막 절의 ἔλαβον은 복수로 처리해 ‘그들은’으로 옮겼습니다.
  alternative_readings:
  - 앞 절과 맞추어 ‘그가 데려갔습니다’로 매끈하게 통일
  - ‘그와 그의 군대가 데려갔습니다’로 풀어쓰기
  rationale: 원문은 앞의 단수 동사들 가운데서도 마지막에 복수형을 사용하므로, 서술의 어색함을 줄이더라도 수적 차이를 지우지 않는 편이 स्रोत에 더 충실합니다.
  doctrine_reference: 본문 비평/문법적 일치
