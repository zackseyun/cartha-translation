translation:
  language: ko
  text: 그는 에스드렐론 앞[a], 도타이아 가까이에 이르렀는데, 그곳은 유다의 큰 톱 같은 산줄기[b] 맞은편입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘에스드렐론 앞쪽에’, ‘에스드렐론을 마주하여’로도 옮길 수 있습니다. κατὰ πρόσωπον은 공간 관계를 조금 다르게 드러낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘유다의 큰 톱’입니다. 여기서는 산맥이나 능선을 가리키는 비유로 이해하는 것이 자연스럽습니다.
    reason: lexical_alternative
