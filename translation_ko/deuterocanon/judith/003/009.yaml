  text: And he came to the front of Esdrelon[a], near Dothaia, which is opposite the great ridge of Judea[b],
  footnotes:
  - marker: a
    text: Or 'before Esdrelon' or 'facing Esdrelon'; the Greek expression κατὰ πρόσωπον can be rendered in several closely related spatial ways.
