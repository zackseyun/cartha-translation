  - 메신저들
  - 천사들
  lexicon: BDAG
  rationale: 문맥상 천사들이 아니라 인간 전달자이므로, 한국어 성경에서 널리 쓰이는 ‘사자들’이 가장 간결하고 정확합니다.
- source_word: λόγοις εἰρηνικοῖς
  english_pob_choice: with peaceful words
  chosen_korean: 평화의 말로
  alternatives_korean:
  - 평화로운 말로
  - 화평의 말로
  - 평화의 언사로
  lexicon: BDAG
  rationale: λόγοις의 ‘말’과 εἰρηνικοῖς의 평화/화평 성격을 함께 살려, 단순 형용사형보다 ‘평화의 말’이 원문의 명사구적 뉘앙스를 잘 보존합니다.
- source_word: λέγοντες
  english_pob_choice: saying
  chosen_korean: …하며
  alternatives_korean:
  - 말하며
  - 이르며
  - 하고
  lexicon: BDAG
  rationale: 뒤따르는 발화 도입을 한국어 서술 흐름에 맞게 연결했습니다. 짧은 서사 구문이므로 ‘…하며’가 가장 간결합니다.
theological_decisions:
- issue: 평화 제의의 성격
  chosen_reading: 단순한 친절한 인사가 아니라, 협상 또는 화친 제의의 가능성을 열어 두는 표현으로 보았습니다.
  alternative_readings:
  - 그저 평화로운 인사말로만 이해하기
  - 공식적인 평화 조약 조건으로만 한정하기
  rationale: λόγοις εἰρηνικοῖς는 평화적·화해적 언사일 수도 있고, 평화 협정의 조건일 수도 있어 의미 범위를 좁히지 않는 것이 원문에 충실합니다.
  doctrine_reference: 문맥 주해 원칙
