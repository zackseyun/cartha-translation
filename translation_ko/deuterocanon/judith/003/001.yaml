lexical_decisions:
- source_word: ἀπέστειλαν
  english_pob_choice: sent
  chosen_korean: 보내며
  alternatives_korean:
  - 보냈습니다
  - 파견했습니다
  lexicon: BDAG
  rationale: 서술 진행 속에서 자연스러운 현대 한국어로 풀되, 단순한 ‘보냈습니다’보다 파송 행위를 덜 경직되게 드러냅니다.
- source_word: ἀγγέλους
  english_pob_choice: messengers
  chosen_korean: 사자들
