  - ‘놓여 있습니다’로 중립화
  rationale: 본문의 수사적 목적은 왕권에 대한 극도의 복종을 표현하는 데 있으므로, 한국어에서도 그 긴장을 유지하는 편이 원문 충실도에 맞습니다.
