revisions:
- from: 그리고 느부갓네살은 이 온 땅에 대해 크게 분노하였고, 자기의 왕좌와 자기의 왕국을 두고 맹세하며, 길리기아와 다마스쿠스와 시리아의 모든 경계를 반드시 벌하고, 그들을 칼로 죽이며, 모압에 사는 모든 사람들과 암몬 자손과 온 이두마야와 이집트에 있는 모든 사람들을 쳐서, 두 바다의 경계에 이르기까지 하겠다고 하였습니다.[a]
  to: 느부갓네살은 이 온 땅에 대하여 몹시 분노하였습니다. 그는 자기 왕좌와 왕국을 두고 맹세하며[a] 길리기아와 다마스쿠스와 시리아의 모든 지역에 반드시 보복하고, 그 지역들과 모압에 사는 모든 사람들과 암몬 자손과 온 이두메아와 이집트에 있는 모든 사람들을 두 바다의 경계에 이를 때까지 칼로 쳐서 멸하겠다고 하였습니다.[b]
  rationale: 보복의 의미를 분명히 하고, 칼로 멸하는 행위가 열거된 모든 대상에 걸리도록 문장을 재구성했습니다. 원문이 지닌 지명·집단의 열거와 ‘두 바다’의 불확정성은 유지했으며, 맹세 공식은 한국어에서 의미가 역전되지 않도록 강한 결의로 풀어 각주로 설명했습니다.
  reviewer_model: gpt-5.6-terra
