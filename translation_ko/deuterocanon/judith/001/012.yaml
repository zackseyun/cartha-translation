base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/001/012.yaml
  text: And Nebuchadnezzar became very angry with all this land[a], and he swore by his throne and his kingdom that he would surely avenge himself on all the territories of Cilicia and Damascus and Syria, and put them to the sword—along with all who lived in Moab and the Ammonites and all Idumea and all those in Egypt[b]—until one came to the borders of the two seas.
  footnotes:
  - marker: a
    text: Or, more literally, 'unless he avenges'; in this oath formula the Greek expresses a strong sworn resolve rather than a simple negative condition.
    reason: lexical_alternative
  - marker: b
    text: '''The two seas'' likely refers to the full extent of the region in view, expressed by its bounding seas.'
    reason: cultural_note
translation:
  language: ko
  text: 느부갓네살은 이 온 땅에 대하여 몹시 분노하였습니다. 그는 자기 왕좌와 왕국을 두고 맹세하며[a] 길리기아와 다마스쿠스와 시리아의 모든 지역에 반드시 보복하고, 그 지역들과 모압에 사는 모든 사람들과 암몬 자손과 온 이두메아와 이집트에 있는 모든 사람들을 두 바다의 경계에 이를 때까지 칼로 쳐서 멸하겠다고 하였습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 여기서 ‘…하지 않으면’에 해당하는 그리스어 맹세 형식은 단순한 조건을 뜻하기보다, 반드시 그렇게 하겠다는 강한 맹세의 결의를 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: ‘두 바다’가 어느 바다들을 구체적으로 가리키는지는 확정하기 어렵습니다. 이 표현은 여기서 언급된 지역의 경계를 나타내는 말로 보입니다.
    reason: cultural_note
lexical_decisions:
- source_word: ἐθυμώθη ... σφόδρα
  english_pob_choice: became very angry
  chosen_korean: 크게 분노하였고
  alternatives_korean:
  - 매우 화를 내었고
  - 몹시 격분하였고
  lexicon: LSJ
  rationale: 수동형으로 된 감정 동사는 ‘분노하다/격분하다’로 옮기는 것이 자연스럽고, σφόδρα의 강화를 ‘크게’로 살려 왕의 격한 분노를 드러냈습니다.
- source_word: κατὰ τοῦ θρόνου καὶ τῆς βασιλείας αὐτοῦ
  english_pob_choice: by his throne and his kingdom
  chosen_korean: 자기의 왕좌와 자기의 왕국을 두고
  alternatives_korean:
  - 자기의 왕좌와 왕국으로
  - 자기의 왕좌와 자기 왕국에 걸고
  lexicon: LSJ
  rationale: ὀμνύω와 함께 쓰인 κατά는 맹세의 매개를 나타내므로, ‘두고 맹세하다’로 옮겨 맹세 공식의 기능을 살렸습니다.
- source_word: εἰ μὴ ἐκδικήσει
  english_pob_choice: would surely avenge himself on
  chosen_korean: 반드시 벌하고
  alternatives_korean:
  - 반드시 복수하고
  - 반드시 원수를 갚고
  lexicon: LSJ
  rationale: 영어 본문이 드러내는 맹세적 결심을 반영하되, 한국어에서는 어색한 직역 조건문을 피하고 강한 단정으로 풀었습니다.
- source_word: ἀνελεῖν τῇ ῥομφαίᾳ
  english_pob_choice: put them to the sword
  chosen_korean: 칼로 죽이며
  alternatives_korean:
  - 칼로 치며
  - 칼에 의하여 멸하며
  lexicon: LSJ
  rationale: 관용구의 폭력성과 집단 살해의 뜻을 분명히 하면서도, 현대 한국어에서 자연스러운 표현으로 옮겼습니다.
- source_word: τοὺς υἱοὺς Ἀμμών
  english_pob_choice: the Ammonites
  chosen_korean: 암몬 자손
  alternatives_korean:
  - 암몬 사람들
  - 암몬 족속
  lexicon: LSJ
  rationale: 헬라어의 ‘아들들’ 표현을 너무 평탄화하지 않되, 한국어 성경에서 널리 통용되는 족속 표기를 사용했습니다.
- source_word: Ἰδουμαίαν
  english_pob_choice: Idumea
  chosen_korean: 이두마야
  alternatives_korean:
  - 이두메
  - 에돔
  lexicon: LSJ
  rationale: 그리스어의 헬라화된 지명을 직접 반영하여, 히브리어식 ‘에돔’으로 대체하지 않았습니다.
theological_decisions:
- issue: ὤμοσεν ... εἰ μὴ ἐκδικήσει의 맹세 공식
  chosen_reading: 조건문처럼 옮기지 않고, 강한 맹세적 결심으로 이해해 번역했습니다.
  alternative_readings:
  - ‘그가 보복하지 않으면’
  - ‘…하지 않는 한’
  rationale: 그리스어 맹세 공식의 관용적 기능을 살려 의미 역전을 막았습니다. 이 절은 문법적으로는 조건형처럼 보여도 실제로는 서약 내용의 강조입니다.
  doctrine_reference: DOCTRINE.md § Translation philosophy 1, 6
