lexical_decisions:
- source_word: ἀνέστρεψεν
  english_pob_choice: returned
  chosen_korean: 돌아갔으며
  alternatives_korean:
  - 되돌아갔으며
  - 돌아왔으며
  lexicon: LSJ
  rationale: 서술 문맥에서 ἀναστρέφω의 aorist는 방향 전환과 귀환을 뜻하므로, 자연스러운 합쇼체 서술인 ‘돌아갔으며’로 옮겼습니다.
- source_word: μετʼ αὐτῶν
  english_pob_choice: with them
  chosen_korean: 그의 군대와 함께
  alternatives_korean:
  - 그들과 함께
  - 그들과 동행하여
  lexicon: LSJ
  rationale: 전치사 μετά + 속격은 동반을 나타내며, 앞의 주어와 연결된 군사적 동행을 한국어로는 ‘~와 함께’가 가장 직접적입니다.
- source_word: αὐτὸς
  english_pob_choice: he himself
  chosen_korean: 그 자신
  alternatives_korean:
  - 그가 직접
  - 그도
  lexicon: LSJ
  rationale: 명시적 대명사는 지도자 본인의 동참을 강조하므로, ‘그 자신’으로 강조를 살렸습니다.
- source_word: ἡ δύναμις αὐτοῦ
  english_pob_choice: his force
  chosen_korean: 자기 군대
  alternatives_korean:
  - 자기 군사력
  - 자기 병력
  lexicon: LSJ
  rationale: δύναμις는 여기서 군사적 ‘병력/군대’를 가리키므로, 문맥상 자연스럽고 명료한 ‘자기 군대’로 옮겼습니다.
- source_word: ἐφʼ ἡμέρας ἑκατὸν εἴκοσι
  english_pob_choice: for one hundred twenty days
  chosen_korean: 백이십 일 동안
  alternatives_korean:
  - 일백이십 일 동안
  - 백이십일 동안
  lexicon: LSJ
  rationale: 기간 표현 ἐπί + 대격은 지속 기간을 나타내므로, 한국어 관용에 맞는 ‘~ 동안’을 사용했습니다.
