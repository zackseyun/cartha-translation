base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/001/006.yaml
  text: And all who lived in the hill country joined him[a], and all who lived along the Euphrates and the Tigris and the Hydaspes, and in the plain of Ariok king of the Elymaeans[c][b]. And many nations assembled for battle with the sons of Cheleoul.
  footnotes:
  - marker: a
    text: Greek συνήντησαν literally means 'met' or 'came to meet'; here it likely carries the sense of joining his side.
    reason: lexical_alternative
  - marker: b
    text: Ariok may also be rendered 'Arioch' in English transliteration.
    reason: lexical_alternative
  - marker: c
    text: '''Battle line'' translates a military term meaning battle array or formation.'
    reason: cultural_note
translation:
  language: ko
  text: 그리고 모든 산악 지방에 사는 사람들은 그에게 합류했고, 유프라테스와 티그리스와 히다스페스 강 연안에 사는 모든 사람들, 그리고 엘리마이인의 왕 아리옥의 평야에 사는 사람들도 그러했습니다. 또 많은 민족이 켈레울의 자손들과 전열을 갖추기 위해 모였습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 συνήντησαν은 문자적으로는 ‘만났다’ 또는 ‘다가왔다’는 뜻이지만, 여기서는 그의 편에 합류했다는 의미로 보입니다.
    reason: lexical_alternative
  - marker: b
    text: Ἀριὼχ은 영어 전통에서 ‘Arioch’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: παράταξις는 전투 진형, 곧 전열 또는 전투 대형을 가리키는 군사 용어입니다.
    reason: cultural_note
lexical_decisions:
- source_word: συνήντησαν πρὸς αὐτόν
  english_pob_choice: joined him
  chosen_korean: 그에게 합류했고
  alternatives_korean:
  - 그를 만나고
  - 그에게 와서
  lexicon: BDAG
  rationale: 직역하면 ‘만났다/다가왔다’이지만, 전투·정치적 문맥에서는 그의 편에 들어왔다는 뜻이 분명하므로 ‘합류했다’가 문맥을 가장 잘 드러냅니다.
- source_word: οἱ κατοικοῦντες τὴν ὀρεινήν
  english_pob_choice: those who lived in the hill country
  chosen_korean: 산악 지방에 사는 사람들
  alternatives_korean:
  - 산지에 사는 사람들
  - 산악 지역의 거주자들
  lexicon: LSJ
  rationale: τὴν ὀρεινήν은 명사화된 형용사로 ‘산지/산악 지방’의 뜻이므로, 자연스러운 현대 한국어로 지리적 의미를 살려 옮겼습니다.
- source_word: τὸν Εὐφράτην καὶ τὸν Τίγριν καὶ τὸν Ὑδάσπην
  english_pob_choice: the Euphrates and the Tigris and the Hydaspes
  chosen_korean: 유프라테스와 티그리스와 히다스페스 강
  alternatives_korean:
  - 유프라테스와 티그리스와 하이다스페스 강
  - 유프라테스 강과 티그리스 강과 히다스페스 강
  lexicon: LSJ
  rationale: 고유명사는 음역하되, 한국어에서는 강 이름임을 드러내기 위해 ‘강’을 덧붙였습니다.
- source_word: πεδίῳ Ἀριὼχ ὁ βασιλεὺς Ἐλυμαίων
  english_pob_choice: the plain of Ariok king of the Elymaeans
  chosen_korean: 엘리마이인의 왕 아리옥의 평야
  alternatives_korean:
  - 엘리마이인 왕 아리옥의 평야
  - 아리옥 왕이 다스리는 엘리마이인의 평야
  lexicon: LSJ
  rationale: 문장 구조상 ‘평야’가 아리옥과 연결되며, ὁ βασιλεὺς Ἐλυμαίων은 ‘엘리마이인의 왕’으로 붙는 것이 자연스럽습니다.
- source_word: εἰς παράταξιν
  english_pob_choice: for the battle line
  chosen_korean: 전열을 갖추기 위해
  alternatives_korean:
  - 전투 진형을 위해
  - 전열로
  lexicon: LSJ
  rationale: παράταξις는 군사적 ‘전열/배열’을 뜻하므로, 한국어에서는 목적 의미를 살려 ‘전열을 갖추기 위해’로 옮겼습니다.
- source_word: υἱῶν Χελεούλ
  english_pob_choice: the sons of Cheleoul
  chosen_korean: 켈레울의 자손들
  alternatives_korean:
  - 켈레울의 아들들
  - 케레울의 자손들
  lexicon: LSJ
  rationale: υἱοί plus 고유명사는 문자적으로는 ‘아들들’이지만, 한국어 성경 문맥에서는 집단·씨족 표지로 ‘자손들’이 더 자연스럽습니다.
theological_decisions:
- issue: 군사적 집결을 나타내는 συνήντησαν / συνῆλθον의 표현 강도
  chosen_reading: ‘합류했고… 모였습니다’로 옮겨, 단순한 만남이 아니라 세력의 결집을 드러냈습니다.
  alternative_readings:
  - ‘만났고… 함께 왔습니다’
  - ‘다가왔고… 모였습니다’
  rationale: 본문은 정치·군사적 연합의 흐름을 보여 주므로, 중립적 만남보다 편입·집결의 뉘앙스를 살리는 것이 원문 의도에 더 가깝습니다.
  doctrine_reference: 역사 서술의 문맥상 의미 보존 원칙
