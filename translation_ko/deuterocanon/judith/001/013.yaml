  text: And in the seventeenth year he drew up his forces for battle against King Arphaxad, and he prevailed in his war, and routed all the force of Arphaxad, all his cavalry, and all his chariots,
translation:
  language: ko
  text: 그리고 열일곱째 해에 그는 아르팍삿 왕을 상대로 자기 군대를 전열에 세웠고, 그의 전쟁에서 우세를 점하여 아르팍삿의 모든 군세와 그의 모든 기병과 그의 모든 전차를 무찔렀습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρετάξατο ἐν τῇ δυνάμει αὐτοῦ
  english_pob_choice: drew up his forces for battle / his forces
  chosen_korean: 자기 군대를 전열에 세웠고
  alternatives_korean:
  - 자기 군대를 배치했고
  - 자기 군대를 전투 대형으로 세웠고
  - 자기 군세를 전열에 세웠고
  lexicon: LSJ
  rationale: παρατάσσω의 군사적 용법을 살려 ‘전열에 세우다’로 옮기고, δύναμις를 여기서는 추상적 ‘힘’보다 군사적 ‘군대/군세’로 이해했습니다.
- source_word: ἐκραταιώθη
  english_pob_choice: he prevailed
  chosen_korean: 우세를 점하여
  alternatives_korean:
  - 그가 강해져서
  - 그가 우세했습니다
  - 그가 승세를 잡아
  lexicon: LSJ
  rationale: 문맥상 단순히 ‘강해졌다’보다 전투 결과의 우위를 드러내는 표현이 필요해, 전쟁 서술에 자연스러운 ‘우세를 점하여’로 옮겼습니다.
- source_word: ἀνέστρεψεν πᾶσαν τὴν δύναμιν Ἀρφαξὰδ καὶ πᾶσαν τὴν ἵππον αὐτοῦ καὶ πάντα τὰ ἅρματα αὐτοῦ
  english_pob_choice: routed all the force of Arphaxad, all his cavalry, and all his chariots
  chosen_korean: 아르팍삿의 모든 군세와 그의 모든 기병과 그의 모든 전차를 무찔렀습니다
  alternatives_korean:
  - 아르팍삿의 모든 군대를 패주시켰습니다
  - 아르팍삿의 모든 병력과 그의 모든 기병과 그의 모든 전차를 격파했습니다
  - 아르팍삿의 모든 군세와 그의 모든 말 탄 군사와 그의 모든 전차를 물리쳤습니다
  lexicon: LSJ
  rationale: ἀνέστρεψεν의 ‘되돌려 패주시키다/무찌르다’는 전투 결과를 분명히 하는 동사로 처리했고, ἵππος는 집합적 용법에 따라 ‘기병’, ἅρματα는 ‘전차’로 직역했습니다.
