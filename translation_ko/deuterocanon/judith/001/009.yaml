  yaml_path: translation/deuterocanon/judith/001/009.yaml
  text: and all those in Samaria and its cities[a], and beyond the Jordan as far as Jerusalem, and Batane and Chelous and Kadesh and the river of Egypt, and Taphnas and Rameses and all the land of Goshen[b],
  footnotes:
  - marker: a
    text: Or 'the wadi/brook of Egypt.' The Greek text here reads 'river of Egypt' (ποταμός), but the boundary name is rendered variously in English biblical tradition.
    reason: lexical_alternative
  - marker: b
    text: Taphnas is the Greek form of the place more commonly known in English as Tahpanhes.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 사마리아와 그 성읍들에 있는 모든 사람에게, 또 요르단 건너편에서 예루살렘과 바타네와 켈루스와 카데스와 이집트의 강[a]과 타프나스[b]와 라메세스와 게셈의 온 땅에 이르기까지 있는 모든 사람에게도,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이집트의 와디/시내’. 그리스어 본문은 ‘강’(ποταμός)이라고 읽지만, 이 경계 지명은 성경 번역 전통에서 다양하게 옮겨집니다.
    reason: lexical_alternative
  - marker: b
    text: ‘타프나스’는 영어 성경에서 더 흔히 ‘다바네스’ 또는 ‘다합느헤스’로 알려진 지명의 그리스어 형태입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντας τοὺς ἐν Σαμαρείᾳ καὶ ταῖς πόλεσιν αὐτῆς
  english_pob_choice: all those in Samaria and its cities
  chosen_korean: 사마리아와 그 성읍들에 있는 모든 사람
  alternatives_korean:
  - 사마리아와 그 도시들에 있는 모든 이
  - 사마리아와 그 성읍들 안에 있는 모든 자
  lexicon: LSJ
  rationale: 목록 문맥에서 συνολική 포함 대상을 한국어로 자연스럽게 풀되, 남성형 복수의 인격적 대상을 과도하게 축소하지 않도록 ‘모든 사람’으로 옮겼습니다.
- source_word: πέραν τοῦ Ἰορδάνου ἕως Ἰερουσαλήμ
  english_pob_choice: beyond the Jordan as far as Jerusalem
  chosen_korean: 요르단 건너편으로 예루살렘에 이르기까지
  alternatives_korean:
  - 요르단 너머 예루살렘까지
  - 요르단 건너편에서 예루살렘에 이르기까지
  lexicon: LSJ
  rationale: πέραν과 ἕως의 경계 감각을 살려 ‘건너편으로…이르기까지’로 옮겼습니다.
- source_word: Βαττανὴ καὶ Χελούς καὶ Κάδης καὶ τοῦ ποταμοῦ Αἰγύπτου
  english_pob_choice: Batane and Chelous and Kadesh and the river of Egypt
  chosen_korean: 바타네와 첼루스와 카데스와 이집트의 강
  alternatives_korean:
  - 바타네와 첼루스와 카데스와 이집트의 강/시내
  - 바타네와 켈루스와 카데스와 이집트의 강
  lexicon: LSJ
  rationale: 그리스어 고유지명은 음역을 유지하고, ποταμός를 본문에서는 직역하여 ‘강’으로 두었습니다.
- source_word: Τάφνας
  english_pob_choice: Taphnas
  chosen_korean: 탑나스
  alternatives_korean:
  - 타프나스
  - 다프나스
  lexicon: LSJ
  rationale: 그리스어 형태를 따른 음역을 본문에 반영했습니다. 통용형 ‘다프나스’보다 원형에 가까운 ‘탑나스’를 택했습니다.
- source_word: Ραμεσσὴ
  english_pob_choice: Rameses
  chosen_korean: 라메세스
  alternatives_korean:
  - 라암셋
  - 람세스
  lexicon: LSJ
  rationale: 그리스어 표기를 따라 음역하되, 성경 지명으로 널리 인지되는 형태와의 연결성을 유지했습니다.
- source_word: πᾶσαν γῆν Γέσεμ
  english_pob_choice: all the land of Goshen
  chosen_korean: 게셈의 온 땅
  alternatives_korean:
  - 고센의 온 땅
  - 게셈의 모든 땅
  lexicon: LSJ
  rationale: 본문의 그리스어 고유형 Γέσεμ을 그대로 반영해 음역했고, ‘πᾶσαν γῆν’은 경계 목록의 종결 표현으로 ‘온 땅’으로 옮겼습니다.
