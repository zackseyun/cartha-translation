  text: 그리고 아시리아의 왕 느부갓네살은 페르시아에 사는 모든 사람과 서쪽에 사는 모든 사람—즉 길리기아와 다마스쿠스에 사는 사람들, 레바논과 안티레바논, 그리고 해안가에 사는 모든 사람에게—보냈습니다.[a]
