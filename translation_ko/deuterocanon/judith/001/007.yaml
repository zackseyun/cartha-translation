theological_decisions:
- issue: 아시리아의 왕 느부갓네살이라는 역사·제국 표기
  chosen_reading: ‘아시리아의 왕 느부갓네살’로 직역해 본문의 서술 형식을 유지합니다.
  alternative_readings:
  - ‘앗수르 왕 느부갓네살’
  - ‘앗시리아 왕 느부갓네살’
  rationale: 유딧서의 현재 절은 본문 자체의 칭호를 그대로 전달하는 것이 중요하며, 기존 전통적 표현보다 현대 표준어 지명을 우선했습니다.
  doctrine_reference: 본문의 역사적·서사적 표기 원칙
- issue: ‘서쪽에 사는 모든 사람’과 주석 가능성
  chosen_reading: 본문에는 방향 표현을 살리고, 필요 시 주석으로 ‘서방 지역의 주민들’이라는 대안을 제시할 수 있습니다.
  alternative_readings:
  - ‘서방 지역에 사는 모든 사람’
  - ‘서쪽을 향해 사는 모든 사람’
  rationale: 그리스어가 고정 지명보다 방향을 말하므로, 본문은 방향성을 유지하고 의미 보완은 각주로 처리하는 것이 가장 투명합니다.
  doctrine_reference: 원문 방향 표현 보존 원칙
