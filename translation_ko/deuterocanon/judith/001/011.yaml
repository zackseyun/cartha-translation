base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/001/011.yaml
  text: And all who inhabited the whole land treated the word of Nebuchodonosor king of the Assyrians with contempt, and they did not join him for the war, because they did not fear him, but he was before them like an ordinary man, and they sent his messengers back empty, in dishonor, from before him.
  footnotes:
  - marker: a
    text: Or 'despised the message/command of Nebuchodonosor.' The Greek τὸ ῥῆμα can mean 'word,' 'message,' or 'command,' and ἐφαύλισαν conveys treating it as of little account.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'he was before them like a man equal.' The sense is that they regarded him as merely a man on their own level, not as one to be feared.
    reason: lexical_alternative
  - marker: c
    text: Or 'they turned back his envoys empty-handed, with disgrace, from his presence.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그 땅 온 지역의 모든 주민은 아시리아 왕 느부갓네살의 말씀을 업신여겼으며, 그와 함께 전쟁에 나서지 않았습니다. 그들이 그를 두려워하지 않았기 때문입니다. 오히려 그는 그들 앞에서 보통 사람과 같았고, 그들은 그의 사신들을 빈손으로, 수치스럽게, 그의 앞에서 되돌려 보냈습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘느부갓네살의 메시지/명령을 업신여겼다.’ 그리스어 τὸ ῥῆμα는 ‘말’, ‘전갈’, ‘명령’을 뜻할 수 있으며, 여기서는 왕의 요구를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그는 그들 앞에서 동등한 사람처럼 있었다’입니다. 뜻은 그들이 그를 두려워할 대상이 아니라 자기들과 같은 수준의 사람으로 여겼다는 것입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그의 사신들을 빈손으로, 수치 속에, 그의 면전에서 되돌려 보냈다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐφαύλισαν
  english_pob_choice: treated the word ... with contempt
  chosen_korean: 업신여겼으며
  alternatives_korean:
  - 경멸했으며
  - 하찮게 여겼으며
  - 무시했으며
  lexicon: LSJ
  rationale: 동사 ἐφαύλισαν은 어떤 것을 가볍고 하찮게 대하는 뜻이므로, 한국어에서는 ‘업신여기다’가 의미와 태도를 가장 압축적으로 드러냅니다.
- source_word: τὸ ῥῆμα
  english_pob_choice: the word
  chosen_korean: 말씀
  alternatives_korean:
  - 말
  - 명령
  - 전갈
  lexicon: LSJ
  rationale: 이 구절에서는 왕의 전달된 요구를 가리키므로 ‘말씀’이 내용 전달의 폭을 유지하면서도 왕적 발화의 성격을 살립니다. 다만 ‘명령’으로만 좁히지는 않았습니다.
- source_word: οὐ συνῆλθον αὐτῷ εἰς τὸν πόλεμον
  english_pob_choice: they did not join him for/in the war
  chosen_korean: 그와 함께 전쟁에 나서지 않았습니다
  alternatives_korean:
  - 그와 함께 전쟁에 모이지 않았습니다
  - 그와 함께 싸우러 가지 않았습니다
  lexicon: LSJ
  rationale: συνέρχομαι의 ‘함께 나아가다/합세하다’ 뉘앙스를 한국어의 자연스러운 군사 표현인 ‘전쟁에 나서다’로 옮겼습니다.
- source_word: ἀνέστρεψαν τοὺς ἀγγέλους αὐτοῦ κενοὺς ἐν ἀτιμίᾳ
  english_pob_choice: they sent his messengers back empty, in dishonor
  chosen_korean: 그의 사신들을 빈손으로, 수치스럽게, ... 되돌려 보냈습니다
  alternatives_korean:
  - 그의 사신들을 빈손으로, 모욕 중에, 되돌려 보냈습니다
  - 그의 사신들을 헛되이, 수치 속에, 되돌려 보냈습니다
  lexicon: LSJ
  rationale: ἀγγέλους는 문맥상 ‘천사’가 아니라 사절/사신이므로 ‘사신들’로 옮겼고, κενούς는 결과 없는 귀환의 뜻을 살려 ‘빈손으로’로 풀었습니다. ἐν ἀτιμίᾳ는 공개적 수치의 상태를 나타내어 ‘수치스럽게’가 적절합니다.
theological_decisions:
- issue: 왕권에 대한 태도와 ‘그는 ... 보통 사람과 같았다’의 해석
  chosen_reading: 그들은 느부갓네살을 두려운 군주가 아니라 자기들과 같은 보통 사람으로 여겼다는 뜻으로 옮겼습니다.
  alternative_readings:
  - 그는 그들 눈에 동등한 사람처럼 보였습니다
  - 그는 그들 앞에서 한 사람과 다르지 않았습니다
  rationale: ἦν ἐναντίον αὐτῶν ὡς ἀνὴρ ἴσος는 권위를 인정하지 않았다는 서술이므로, 한국어에서도 위압감의 상실을 분명히 드러내는 표현이 필요합니다.
  doctrine_reference: 본문 해석/서사 뉘앙스
