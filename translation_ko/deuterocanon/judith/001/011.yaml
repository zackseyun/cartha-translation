  rationale: 자연스럽지 않은 지리적 표현과 불필요한 존대 어감을 바로잡고, 느부갓네살을 동등한 사람으로 간주한 원문의 비교 의미를 명확히 했습니다. 마지막 절은 사신들이 빈손으로 수치를 당하여 왕에게 돌아가게 된 의미를 한국어 문맥에서 자연스럽게 표현했으며, 각주는 원문의 어휘적 대안과 전치사구의 직역 가능성을 보존합니다.
