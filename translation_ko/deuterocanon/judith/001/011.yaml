- from: 그리고 그 땅 온 지역의 모든 주민은 아시리아 왕 느부갓네살의 말씀을 업신여겼으며, 그와 함께 전쟁에 나서지 않았습니다. 그들이 그를 두려워하지 않았기 때문입니다. 오히려 그는 그들 앞에서 보통 사람과 같았고, 그들은 그의 사신들을 빈손으로, 수치스럽게, 그의 앞에서 되돌려 보냈습니다.[a][b][c]
