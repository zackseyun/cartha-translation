translation:
  language: ko
  text: 그는 라가우의 산지에서 아르팍삿을 사로잡고, 자기의 창들로 그를 제압하여, 그날까지 그를 멸망시켰습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘라게스’. 일부 전통 번역에서 더 익숙한 지명형이지만, 이 그리스어 증언은 Ῥαγαῦ를 읽습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔλαβε
  english_pob_choice: captured
  chosen_korean: 사로잡고
  alternatives_korean:
  - 붙잡고
  - 잡아오고
  lexicon: BDAG
  rationale: 전쟁 서술에서의 ἔλαβε는 단순한 ‘취하다’보다 적군을 붙잡아 전리품처럼 넘겨받는 뜻이므로, ‘사로잡고’가 자연스럽고도 정확합니다.
- source_word: ἐν τοῖς ὄρεσι
  english_pob_choice: in the mountains
  chosen_korean: 라가우의 산지에서
  alternatives_korean:
  - 라가우의 산들에서
  - 라가우의 산에서
  - 라가우의 산지 안에서
  lexicon: BDAG
  rationale: 복수 ‘산들’의 의미를 살리되 한국어에서는 지형 전체를 가리키는 ‘산지’가 자연스러워, 전투가 벌어진 장소감을 유지했습니다.
- source_word: σιβύναις
  english_pob_choice: javelins
  chosen_korean: 자기의 창들로
  alternatives_korean:
  - 자기의 재블린으로
  - 자기의 투창으로
  - 자기의 창으로
  lexicon: LSJ
  rationale: σιβύνη는 창보다 가벼운 투척용 무기이지만 한국어 성경 문맥에서는 낯선 외래어보다 ‘창’이 가장 전달력이 높아, 복수형으로 무기의 다발성을 살렸습니다.
- source_word: ἐξωλέθρευσεν
  english_pob_choice: destroyed
  chosen_korean: 멸망시켰습니다
  alternatives_korean:
  - 멸절시켰습니다
  - 완전히 파괴했습니다
  - 죽였습니다
  lexicon: BDAG
  rationale: 이 동사는 단순한 살해보다 완전한 파멸을 가리키므로, 결과의 강도를 살리는 ‘멸망시켰습니다’가 적절합니다.
theological_decisions:
- issue: ἕως τῆς ἡμέρας ἐκείνης의 시간표현
  chosen_reading: ‘그날까지’로 옮겨, 사건의 지속적 결과를 현재 서술자의 관점에서 유지했습니다.
  alternative_readings:
  - 그날까지
  - 오늘까지
  - 그때까지
  rationale: 문구는 연대기적 종결이라기보다 ‘그 시점까지도 이어진 결과’를 말하므로, 과도하게 해석을 덧붙이지 않는 중립적 표현을 택했습니다.
  doctrine_reference: 서술 시점과 결과 지속성
