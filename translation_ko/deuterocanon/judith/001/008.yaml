lexical_decisions:
- source_word: τοὺς ἐν τοῖς ἔθνεσι
  english_pob_choice: those among the nations
  chosen_korean: 여러 민족
  alternatives_korean:
  - 그 나라들 가운데 있는 사람들
  - 민족들 가운데 있는 자들
  lexicon: BDAG
  rationale: 이 구절은 지명 목록 안에서 집단들을 가리키는 표현이므로, ‘여러 민족’으로 옮겨 προσωπ적인 지시성과 ἔθνεσι의 넓은 의미를 살렸습니다.
- source_word: Καρμήλου
  english_pob_choice: Carmel
  chosen_korean: 카르멜
  alternatives_korean:
  - 갈멜
  - 갈멜산
  lexicon: LSJ
  rationale: 원문 지명을 음역해 유지하는 것이 적절하며, 본문에 ‘산’이 없으므로 ‘갈멜산’은 덧붙이지 않았습니다.
- source_word: τὴν ἄνω Γαλιλαίαν
  english_pob_choice: Upper Galilee
  chosen_korean: 위쪽 갈릴리
  alternatives_korean:
  - 상부 갈릴리
  - 위 갈릴리
  lexicon: LSJ
  rationale: ἄνω는 지리적 ‘위쪽/상부’의 뜻이므로 자연스러운 현대 한국어로 ‘위쪽 갈릴리’라 옮겼습니다.
- source_word: τὸ μέγα πεδίον Ἐσδρήμ
  english_pob_choice: the great plain of Esdraelon
  chosen_korean: 에스드렐론의 큰 평야
  alternatives_korean:
  - 에스드렐론의 큰 평원
  - 에스드렐론의 큰 들
  lexicon: LSJ
  rationale: πεδίον은 ‘평야/평원’의 의미가 있으나, 문맥상 널찍한 지역을 가리켜 ‘평야’가 가장 자연스럽습니다. POB의 ‘Esdraelon’에 맞춰 에스드렐론을 유지했습니다.
