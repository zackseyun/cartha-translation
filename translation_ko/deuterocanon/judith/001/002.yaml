  source_fidelity: 원문의 미완성 종결(καὶ τὸ)을 번역에서도 보존한 점은 적절합니다. 그러나 λίθων λελαξευμένων은 돌을 ‘네모난’ 것으로 한정하지 않고 ‘다듬은 돌’로 옮기는 것이 정확하며, 세 규빗과 여섯 규빗은 문맥상 돌 자체가 아니라 성벽의 치수로 표현해야 합니다.
  naturalness: 합쇼체는 대체로 자연스럽습니다. 다만 ‘그 돌들은’은 원문의 수식·치수 연결을 오해하게 하므로 성벽을 주어로 명시하는 편이 자연스럽고 정확합니다. 끊긴 본문은 ‘그’에서 멈추어 보존할 수 있습니다.
  terminology: ‘에크바타나’, ‘성벽’, ‘규빗’은 적절합니다. λελαξευμένων에는 ‘다듬은 돌’이 ‘네모난 돌’보다 충실합니다.
