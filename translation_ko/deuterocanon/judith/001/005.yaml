translation:
  language: ko
  text: 그리고 그 무렵에 느부갓네살 왕이 아르팍삿 왕과 맞서 큰 평야에서 전쟁을 일으켰습니다[a]. 곧 라가우의 경계 안입니다.
  philosophy: optimal-equivalence
  footnotes:
