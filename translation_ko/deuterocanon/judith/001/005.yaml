  source_fidelity: ‘전쟁을 일으켰습니다’는 전쟁을 새로 촉발했다는 뉘앙스를 더할 수 있으므로, 단순히 전쟁을 수행했다는 ἐποίησεν πόλεμον에는 ‘전쟁을 벌였습니다’가 더 충실합니다. 또한 πρὸς의 적대적 관계는 ‘아르팍삿 왕을 상대로’로 명확히 드러내는 것이 좋습니다. τοῦτʼ ἔστιν은 큰 평야를 라가우의 영토와 동일시·설명하므로 문장 안에서 직접 연결했습니다.
