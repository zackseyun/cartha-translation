lexical_decisions:
- source_word: ἐποίησεν πόλεμον
  english_pob_choice: made war
  chosen_korean: 전쟁을 일으켰습니다
  alternatives_korean:
  - 전쟁을 벌였습니다
  - 전쟁을 했습니다
  lexicon: LSJ
  rationale: 그리스어 관용구의 ‘전쟁을 하다/일으키다’ 의미를 살리면서도 한국어 문장으로 자연스럽게 옮겼습니다.
- source_word: πρὸς βασιλέα Ἀρφαξὰδ
  english_pob_choice: against King Arphaxad
  chosen_korean: 아르팍삿 왕과 맞서
  alternatives_korean:
  - 아르팍삿 왕에 대하여
  - 아르팍삿 왕을 향하여
  lexicon: LSJ
  rationale: πρός가 전쟁 문맥에서 적대적 방향을 나타내므로, 한국어에서는 ‘맞서’로 충돌 관계를 분명히 했습니다.
- source_word: ἐν τῷ πεδίῳ τῷ μεγάλῳ
  english_pob_choice: in the great plain
  chosen_korean: 큰 평야에서
  alternatives_korean:
  - 큰 들판에서
  - 넓은 평지에서
  lexicon: LSJ
  rationale: πεδίον은 전투 배경에 적합한 ‘평야/평지’의 뜻이므로, ‘평야’로 지형적 의미를 살렸습니다.
- source_word: τοῖς ὁρίοις Ῥαγαῦ
  english_pob_choice: in the territory of Ragae
  chosen_korean: 라가우의 경계 안
  alternatives_korean:
  - 라가우의 영토 안
  - 라가우의 경계들 안
  lexicon: LSJ
  rationale: ὅρια는 ‘경계, 영토’의 뜻이 있어, 장소 설명을 ‘경계 안’으로 옮겨 본문의 지리적 한정을 드러냈습니다.
theological_decisions:
