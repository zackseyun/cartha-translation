  text: 그리고 그 무렵에 느부갓네살 왕은 아르팍삿 왕을 상대로 큰 평야, 곧 라가우의 영토 안에서 전쟁을 벌였습니다[a].
  philosophy: optimal-equivalence
  footnotes:
