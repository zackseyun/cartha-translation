translation:
  language: ko
  text: 그는 그 도시의 기초를 육십 규빗 깊이로 놓고, 칠십 규빗 높이로 세워진 성문들을 만들었으며, 그 너비를 사십 규빗으로 하였습니다. 이는 그의 용사들의 군대가 출정하고 그의 보병들이 진형을 갖추도록 하기 위한 것이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그의 용사들의 군대의 출정들과 그의 보병들의 진형들을 위하여’입니다. 마지막 구는 군사적 표현으로 매우 압축되어 있으며, ‘출정들’은 ‘출격들’ 또는 ‘나아감들’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐθεμελίωσεν
  english_pob_choice: laid its foundation
  chosen_korean: 기초를 ... 놓고
