  text: He laid its foundation to a depth of sixty cubits[a], and he made its gates, gates raised to a height of seventy cubits, and its width forty cubits, for the departures of the force of his mighty men and the formations of his foot soldiers.
  footnotes:
  - marker: a
    text: Or 'for the sorties of the army of his mighty men and the ranks of his infantry.' The Greek of the final clause is military and somewhat compressed.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 그 성벽의 기초를 육십 규빗 깊이로 놓고, 칠십 규빗 높이로 솟아오른 문들을 만들었으며, 그 너비는 사십 규빗이었으니, 그의 강한 군사들의 출정과 그의 보병들의 대형을 위한 것이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그의 강한 자들의 군사력의 출정’에 가깝습니다. 이 절의 마지막 구는 군사적이고 매우 압축적입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐθεμελίωσεν
  english_pob_choice: laid its foundation
  chosen_korean: 기초를 ... 놓고
  alternatives_korean:
  - 기초를 세우고
  - 기반을 놓고
  lexicon: LSJ
  rationale: 건축의 ‘기초를 놓다’라는 뜻을 자연스럽게 살리되, 단순히 추상적으로 ‘세우다’로 약화하지 않도록 했습니다.
- source_word: εἰς πήχεις ἑξήκοντα
  english_pob_choice: to a depth of sixty cubits
  chosen_korean: 육십 규빗 깊이로
  alternatives_korean:
  - 육십 규빗에 이르도록
  - 육십 규빗의 깊이로
  lexicon: LSJ
  rationale: 기초의 치수를 나타내는 구문이므로 한국어에서는 ‘깊이로’가 가장 सीधे하고 문맥에 맞습니다.
- source_word: πύλας διεγειρμένας εἰς ὕψος πηχῶν ἑβδομήκοντα
  english_pob_choice: gates, gates raised to a height of seventy cubits
  chosen_korean: 칠십 규빗 높이로 솟아오른 문들
  alternatives_korean:
  - 칠십 규빗 높이로 들어올려진 문들
  - 칠십 규빗에 이르는 높은 문들
  lexicon: LSJ
  rationale: διεγειρμένας의 ‘들어 올려진/솟아오른’ 이미지를 살려, 단순한 형용사 ‘높은’보다 동작성을 반영했습니다.
- source_word: εἰς ἐξόδους δυνάμεως δυνατῶν αὐτοῦ
  english_pob_choice: for the departures of the force of his mighty men
  chosen_korean: 그의 강한 군사들의 출정
  alternatives_korean:
  - 그의 강한 군사들의 출병
  - 그의 용사들의 출정
  lexicon: LSJ
  rationale: ἐξόδους는 군사적 맥락에서 ‘출정/출격’의 뉘앙스를 띠므로, POB의 ‘departures’라는 직역적 긴장을 한국어에서는 ‘출정’으로 보존했습니다.
- source_word: διατάξεις τῶν πεζῶν αὐτοῦ
  english_pob_choice: the formations of his foot soldiers
  chosen_korean: 그의 보병들의 대형
  alternatives_korean:
  - 그의 보병들의 진형
  - 그의 보병들의 편성
  lexicon: LSJ
  rationale: διατάξεις는 군사적 배열·편제를 뜻하므로 전투 맥락에 맞는 ‘대형’이 가장 압축적이고 자연스럽습니다.
