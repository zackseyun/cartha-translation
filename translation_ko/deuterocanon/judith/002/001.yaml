  yaml_path: translation/deuterocanon/judith/002/001.yaml
  text: And in the eighteenth year[a], on the twenty-second day of the first month, a word came in the house of Nebuchodonosor king of the Assyrians, to take vengeance on all the land[c][b], just as he had spoken.
  footnotes:
  - marker: a
    text: Or 'in the palace/court of Nebuchodonosor.' The Greek says 'house,' which can also refer to a royal residence or court.
    reason: lexical_alternative
  - marker: b
    text: Or 'all the earth.' Greek γῆ can mean either 'land' or 'earth'; context here favors a territorial sense.
    reason: lexical_alternative
  - marker: c
    text: Or 'a decree was issued' / 'a matter was decided.' The Greek more literally says 'a word came to be.'
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 열여덟째 해, 첫째 달 스물둘째 날에, 느부갓네살[b] 앗수르 왕의 집[a]에서 온 땅[c]에 보복하려는 말[d]이 나왔습니다. 그가 말한 그대로였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘느부갓네살의 궁정/왕궁에서.’ 그리스어는 ‘집’이라고 하며, 왕의 거처나 궁정을 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 로마자 표기 원칙을 따르지 않은 문헌 전승형 고유명사로, 본문에서는 익숙한 한국어 성경형 ‘느부갓네살’을 사용했습니다.
    reason: korean_style_note
  - marker: c
    text: 또는 ‘온 세상.’ 그리스어 γῆ는 ‘땅’ 또는 ‘세상’을 뜻할 수 있으나, 문맥상 영토적 의미가 더 자연스럽습니다.
    reason: lexical_alternative
  - marker: d
    text: 또는 ‘결정이 내려졌습니다’ 또는 ‘조서가 내려졌습니다.’ 그리스어는 더 문자적으로 ‘말이 생겼다/나왔다’라고 하며, 공식 칙령인지 내부의 결정인지 명시하지 않습니다.
    reason: alternative_reading
