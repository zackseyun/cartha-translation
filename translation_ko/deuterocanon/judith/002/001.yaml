  lexicon: LSJ
  rationale: 연대 표지를 간결하게 살리되, 고어투를 피하고 문어체에서 자연스러운 서술로 옮겼습니다.
- source_word: δευτέρᾳ καὶ εἰκάδι τοῦ πρώτου μηνός
  english_pob_choice: on the twenty-second day of the first month
  chosen_korean: 첫째 달 스물둘째 날
  alternatives_korean:
  - 첫째 달 이십이일
  - 첫째 달 스물두째 날
  lexicon: LSJ
  rationale: δεύτερα καὶ εἰκάδι가 가리키는 날짜를 한국어 관용에 맞게 '스물둘째 날'로 옮겨, 날짜 정보가 분명히 드러나게 했습니다.
- source_word: ἐν οἴκῳ Ναβουχοδονοσὸρ
  english_pob_choice: in the house of Nebuchodonosor
  chosen_korean: 느부갓네살 왕의 집에서
  alternatives_korean:
  - 느부갓네살의 궁에서
  - 느부갓네살의 조정에서
  lexicon: LSJ
  rationale: οἶκος의 기본 의미를 따라 '집'을 살렸고, 왕의 거처/궁정이라는 가능성은 각주로 남겼습니다.
- source_word: ἐκδικῆσαι πᾶσαν τὴν γῆν
  english_pob_choice: to take vengeance on all the land
  chosen_korean: 온 땅에 보복하려는
  alternatives_korean:
  - 온 땅에 원수를 갚으려는
  - 온 땅을 향해 복수하려는
  lexicon: LSJ
  rationale: ἐκδικῆσαι는 단순한 '복수'보다 보복·응징의 뉘앙스가 있어 '보복하다'로 옮겼고, γῆ는 문맥상 '땅'으로 유지했습니다.
- source_word: καθὼς ἐλάλησεν
  english_pob_choice: just as he had spoken
  chosen_korean: 그가 이미 말한 그대로였습니다
  alternatives_korean:
  - 그가 말한 대로였습니다
  - 그가 전에 말했던 그대로였습니다
  lexicon: LSJ
  rationale: 앞선 발화와의 대응을 자연스럽게 드러내되, 원문의 비교절 의미를 유지했습니다.
theological_decisions:
- issue: ἐγένετο λόγος의 성격을 '말'로 둘지, 더 구체적인 행정 조치로 좁힐지
  chosen_reading: '''말이 일어났습니다''로 옮겨, 원문의 모호성을 유지했습니다.'
  alternative_readings:
  - '''조서가 내려졌습니다'''
  - '''결정이 내려졌습니다'''
  rationale: 그리스어는 반드시 공식 칙령을 뜻한다고 말하지 않으므로, 지나친 구체화 없이 사건의 발생을 열어 두는 번역이 더 충실합니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
