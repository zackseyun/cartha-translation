  text: But against those who disobey, your eye shall not spare; you shall give them over to slaughter and plunder throughout all your land.
translation:
  language: ko
  text: 그러나 불순종하는 자들에게는, 당신의 눈이 아끼지 않으시고, 그들을 살육과 약탈에 넘기셔서 당신의 온 땅에 두게 하십시오.
  philosophy: formal
lexical_decisions:
- source_word: τοὺς ἀπειθοῦντας
  english_pob_choice: those who disobey
  chosen_korean: 불순종하는 자들
  alternatives_korean:
  - 순종하지 않는 자들
  - 명령을 거역하는 자들
  lexicon: ἀπειθέω
  rationale: 단순한 ‘듣지 않음’보다 권위에 대한 거부를 드러내는 ‘불순종하다’가 원문의 도덕·법적 뉘앙스를 더 잘 살립니다.
- source_word: οὐ φείσεται ὁ ὀφθαλμός σου
  english_pob_choice: your eye shall not spare
  chosen_korean: 당신의 눈이 아끼지 않으시고
  alternatives_korean:
  - 당신의 눈이 불쌍히 여기지 않으시고
  - 당신의 눈이 봐주지 않으시고
  lexicon: φείδομαι / ὀφθαλμός
  rationale: ‘눈’은 인격화된 판단의 자리이므로 직역을 유지하되, 한국어에서는 ‘아끼다’로 긍휼 없는 판결의 이미지를 살렸습니다.
- source_word: δοῦναι αὐτοὺς εἰς φόνον καὶ ἁρπαγὴν
  english_pob_choice: you shall give them over to slaughter and plunder
  chosen_korean: 그들을 살육과 약탈에 넘기셔서
  alternatives_korean:
  - 그들을 죽임과 노략질에 넘기셔서
  - 그들을 도륙과 노획에 내주셔서
  lexicon: δίδωμι εἰς + φόνος / ἁρπαγή
  rationale: 주동적 ‘넘기다’는 헬라어 ‘~에 내주다’의 구문을 살리고, φόνος와 ἁρπαγή는 각각 ‘살육’과 ‘약탈’로 대응해 폭력성과 약탈성을 분명히 했습니다.
- source_word: ἐν πάσῃ τῇ γῇ σου
  english_pob_choice: throughout all your land
  chosen_korean: 당신의 온 땅에
  alternatives_korean:
  - 당신의 모든 땅에
  - 당신의 온 영토에
  lexicon: ἐν + πάσῃ τῇ γῇ
  rationale: POB의 개정된 ‘throughout all your land’를 자연스럽게 반영하되, 장소의 범위를 강조하는 ‘온 땅’으로 옮겼습니다.
theological_decisions:
- issue: 명령문에서의 주어와 존칭 처리
  chosen_reading: 문맥상 하느님께 드리는 직접 청유이므로 ‘하십시오’체를 사용해 청원형으로 옮겼습니다.
  alternative_readings:
  - 서술형으로 옮겨 ‘아끼지 않으십니다’로 처리
  - 명령형을 약화해 ‘아끼지 않게 하소서’로 처리
  rationale: 원문은 2인칭 단수에 대한 명령적 청유이므로, 한국어에서는 기도·청원의 형식에 맞는 공손한 명령형이 가장 직접적입니다.
  doctrine_reference: 기도/청원의 문체와 히브리-헬라 문헌의 명령형 수용
