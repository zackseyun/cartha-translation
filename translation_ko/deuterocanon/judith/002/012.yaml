    issue: ταῦτα의 복수성이 단수 ‘이 일/그것’으로 바뀌었습니다.
    rationale: 헬라어는 명시적으로 복수 ‘이것들/이 일들’을 사용합니다. 한국어에서도 ‘이 일들을’로 보존해야 합니다.
  - severity: medium
    issue: ‘내 왕국의 권세로 말하노니’가 맹세식 병렬 구문을 발화 수단으로 재해석합니다.
    rationale: ζῶν ἐγώ와 τὸ κράτος τῆς βασιλείας μου는 왕의 엄숙한 자기 확언을 이루는 병렬 요소입니다. ‘…을 두고 맹세하니’는 생략된 맹세 구문을 자연스럽게 드러내면서 ‘권세로 말하다’라는 불필요한 의미 이동을 피합니다.
  - severity: low
    issue: 각주 b의 문자적 풀이에 ‘내 손 안에서’가 포함됩니다.
    rationale: ἐν χειρί μου의 관용적 용법은 여기서 개인적 직접 실행을 가리킵니다. 한국어 독자에게는 ‘내 손으로/내 손에 의해’라고 설명하는 것이 혼동이 적습니다.
