  text: For as I live[a], and by the power of my kingdom, I have spoken[b], and I will do these things by my hand.
  footnotes:
  - marker: a
    text: Or 'and the might of my kingdom.' The Greek κράτος can denote power, might, or ruling strength.
    reason: lexical_alternative
  - marker: b
    text: Literally 'in my hand'; the phrase means 'by my hand,' expressing direct personal agency.
    reason: lexical_alternative
translation:
  language: ko
  text: “내가 살아 있는 것과 내 왕국의 권세를 두고 맹세하니, 내가 말한 이 일들을 내 손으로 행하겠습니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘권세’는 그리스어 κράτος의 가능한 번역입니다. 이 말은 힘, 위력, 또는 통치 권력을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘내 손으로’는 그리스어 표현을 옮긴 말로, 왕 자신이 직접 이 일들을 실행한다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι ζῶν ἐγώ
  english_pob_choice: For as I live
  chosen_korean: “내가 살아 있는 한”
  alternatives_korean:
  - “내가 살기에”
  - “나는 살아 있습니다”
  lexicon: BDAG
  rationale: 맹세문 서두의 관용적 힘을 살리기 위해 직역보다 한국어의 서약 표현인 ‘-ㄴ 한’ 구조를 사용했습니다.
- source_word: τὸ κράτος τῆς βασιλείας μου
  english_pob_choice: the power of my kingdom
  chosen_korean: “내 왕국의 권세”
  alternatives_korean:
  - “내 왕국의 힘”
  - “내 왕국의 통치력”
  lexicon: LSJ
  rationale: κράτος의 핵심 의미인 지배적 힘·권세를 반영해 ‘권세’로 옮겼고, βασιλεία는 여기서 통치 영역을 가리키므로 ‘왕국’으로 처리했습니다.
- source_word: λελάληκα
  english_pob_choice: I have spoken
  chosen_korean: “내가 말하였고”
  alternatives_korean:
  - “내가 말했고”
  - “내가 선언하였고”
  lexicon: BDAG
  rationale: 완료형의 결과 상태를 드러내면서도 한국어 문장에서는 자연스럽게 연결되도록 ‘말하였고’로 옮겼습니다.
- source_word: ἐν χειρί μου
  english_pob_choice: by my hand
  chosen_korean: “내 손으로”
  alternatives_korean:
  - “내 손에 의해”
  - “직접 내 손으로”
  lexicon: LSJ
  rationale: ‘ἐν 손’은 직접적 실행 주체를 나타내는 관용구이므로, 뜻을 분명히 하는 한국어 관용 표현 ‘내 손으로’가 가장 자연스럽습니다.
theological_decisions:
- issue: 왕의 자기 맹세와 행위 주체성의 보존
  chosen_reading: “내가 살아 있는 한… 내가 이 일을 말하였고 내 손으로 그것을 행하겠습니다”
  alternative_readings:
  - “내가 살고, 내 왕국의 권세가 있으니…”
  - “나는 살아 있고… 내가 직접 이것들을 하겠다”
  rationale: 히브리식/헬라식 맹세 어법의 단정성과 왕의 직접적 행위 주체성을 약화하지 않기 위해, 서두와 결말을 모두 1인칭 단수의 확언 구조로 유지했습니다.
  doctrine_reference: DOCTRINE.md § Translation philosophy 3, 6
