  text: And he cut down Phud and Lud[a], and he plundered all the sons of Rasses and the sons of Ishmael who were opposite the wilderness[c][b], toward the south of the Chaldeans.
  footnotes:
  - marker: a
    text: Or 'Phut and Lud,' reflecting more familiar biblical spellings of these names.
    reason: lexical_alternative
  - marker: b
    text: '''The sons of Ishmael'' could be rendered ''the Ishmaelites.'' The main text preserves the Greek''s genealogical wording.'
    reason: lexical_alternative
  - marker: c
    text: The location phrase is terse and may also be understood as 'who were in front of the wilderness, south of the Chaldeans.'
    reason: alternative_reading
translation:
  language: ko
  text: 그는 푸드와 루드를 쳐부수었고, 라세스의 모든 자손과 이스마엘의 자손들[a]을 약탈했습니다. 그들은 광야 맞은편에 있으며 갈대아 사람들의 남쪽을 향해 있었습니다[c][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이스마엘의 자손들’은 ‘이스마엘 사람들’로도 옮길 수 있으나, 본문은 그리스어의 족보적 표현을 유지합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘광야 맞은편’은 ‘광야 앞에’ 또는 ‘광야를 마주하여’로도 이해할 수 있습니다.
    reason: alternative_reading
  - marker: c
    text: ‘갈대아 사람들의 남쪽을 향해’는 압축된 지리 표현입니다. ‘갈대아 사람들 남쪽에’로 이해할 수도 있으나, 본문은 방향 관계인지 정확한 위치인지를 명확히 하지 않습니다.
    reason: alternative_reading
