  text: and to prepare earth and water[a], because I will go out against them in my wrath, and I will cover the whole face of the earth with the feet of my army, and I will give them over to plunder by them.
  footnotes:
  - marker: a
    text: '''Earth and water'' likely refers to tokens of submission demanded by a conquering king.'
    reason: cultural_note
translation:
  language: ko
  text: 그리고 땅과 물[a]을 준비하라. 내가 분노하여 그들을 치러 나가고, 내 군대의 발로 온 땅의 얼굴을 덮고, 그들을 내 군대에게 약탈물로 넘겨주겠다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘땅과 물’은 정복하는 왕에게 바치는 복종의 표지를 가리킬 가능성이 큽니다.
    reason: cultural_note
lexical_decisions:
- source_word: ἑτοιμάζειν
  english_pob_choice: to prepare
  chosen_korean: 준비하라
  alternatives_korean:
