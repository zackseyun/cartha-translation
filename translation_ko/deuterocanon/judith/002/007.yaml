  - 갖추라
  lexicon: BDAG
  rationale: 그리스어 부정사형 명령 흐름을 한국어 명령형으로 옮기되, 과도한 해석을 피하고 기본 의미를 유지했습니다.
- source_word: γῆν καὶ ὕδωρ
  english_pob_choice: earth and water
  chosen_korean: 땅과 물
  alternatives_korean:
