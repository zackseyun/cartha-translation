  lexicon: LSJ
  rationale: δυνάμις를 여기서는 군사력/군대의 뜻으로 읽어, 발로 짓밟는 침공 이미지를 한국어로 자연스럽게 살렸습니다.
- source_word: δώσω αὐτοὺς εἰς διαρπαγὴν αὐτοῖς
  english_pob_choice: I will give them over to plunder by them
  chosen_korean: 그들을 그들에게 약탈물로 넘겨주겠다
  alternatives_korean:
  - 그들을 그들의 약탈 대상이 되게 하겠다
  - 그들에게 약탈당하도록 넘겨주겠다
  lexicon: LSJ
  rationale: 그리스어의 이중 대명사와 수동적 의미를 살리면서, 한국어에서는 ‘약탈물로 넘겨주다’로 응축해 문법적 어색함을 줄였습니다.
