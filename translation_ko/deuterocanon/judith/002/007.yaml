translation:
  language: ko
  text: 그리고 땅과 물을 준비하라. 나는 내 분노로 그들을 치러 나가고, 내 군대의 발로 온 땅의 얼굴을 덮으며, 그들을 그들에게 약탈물로 넘겨주겠다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘땅과 물’은 정복한 왕에게 바치는 복종의 표지물을 가리킬 가능성이 큽니다.
    reason: cultural_note
lexical_decisions:
