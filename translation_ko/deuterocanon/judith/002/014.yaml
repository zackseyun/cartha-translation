  text: 그리고 홀로페르네스는 자기 주군 앞을 떠나 모든 귀족들과 장군들과 아시리아 군대의 감독들을 불렀습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπὸ προσώπου
  english_pob_choice: from the presence of
  chosen_korean: “앞에서”
  alternatives_korean:
  - “면전에서”
  - “존전에”
  - “곁을 떠나”
  lexicon: LEH
  rationale: 문어체로는 ‘~의 앞에서/면전에서’가 관용구의 궁정적 뉘앙스를 살리면서도 자연스럽습니다.
- source_word: τοῦ κυρίου αὐτοῦ
  english_pob_choice: his lord
  chosen_korean: “자기 주군”
  alternatives_korean:
  - “자기 주님”
  - “자기 주인”
  lexicon: LEH
  rationale: 여기서 κύριος는 신적 호칭이 아니라 인간 상관을 가리키므로, 관계의 위계를 드러내는 ‘주군’이 가장 적절합니다.
- source_word: δυνάστας
  english_pob_choice: nobles
  chosen_korean: “귀족들”
  alternatives_korean:
  - “유력자들”
  - “대인들”
  - “권세자들”
  lexicon: LEH
  rationale: 군사-궁정 맥락에서 지위가 높은 인물들을 가리키므로, 현대 한국어의 자연스러운 대응으로 ‘귀족들’을 택했습니다.
- source_word: ἐπιστάτας
  english_pob_choice: overseers
  chosen_korean: “감독들”
  alternatives_korean:
  - “감찰관들”
  - “관리들”
  - “총관들”
  lexicon: BDAG
  rationale: ἐπιστάτης의 감독·관리 의미를 살리되, 군대 조직의 상하 감독자를 뜻하는 말로 ‘감독들’이 가장 직접적입니다.
theological_decisions:
- issue: 인간 상관을 뜻하는 κύριος의 처리
  chosen_reading: ‘주군’으로 번역해 인간적 위계 관계를 드러냈습니다.
  alternative_readings:
  - ‘주님’
  - ‘주인’
  rationale: 본문의 κύριος는 여호와나 메시아 칭호가 아니라 홀로페르네스의 상관을 가리키므로, 신앙적 호칭으로 오해되지 않도록 문맥에 맞게 옮겼습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms table for κύριος; translate titles'
