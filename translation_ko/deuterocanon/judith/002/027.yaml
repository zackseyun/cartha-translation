  text: And he went down into the plain of Damascus in the days of the wheat harvest[a], and he set all their fields on fire; their flocks and herds he gave over to destruction, and he plundered their cities and stripped bare their plains, and struck down all their young men with the edge of the sword.
  footnotes:
  - marker: a
    text: Literally, 'with the mouth of the sword,' an idiom meaning death by the sword.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그는 다메섹 평원으로 내려가, 밀 추수 때에 그들의 모든 밭에 불을 질렀습니다. 그들의 양 떼와 소 떼는 멸망에 넘기고, 그들의 성읍들을 약탈하며 그들의 평원을 모조리 거두어 버렸고, 그들의 모든 젊은이들을 칼날로 쳐 죽였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 ‘칼의 입으로’라는 직역은 ‘칼날로/칼로 죽이다’라는 뜻의 관용적 표현입니다.
    reason: lexical_alternative
