  lexicon: LSJ
  rationale: 영어 POB가 보존한 성경적 관용구를 따라 ‘육체’로 옮겨, ‘모든 사람’으로 매끈하게 풀어 쓰며 원문 이미지와 긴장을 지우지 않았습니다.
- source_word: τῷ λόγῳ τοῦ στόματος αὐτοῦ
  english_pob_choice: the word of his mouth
  chosen_korean: 자기 입의 말
  alternatives_korean:
  - 그 입에서 나온 말씀
  - 그 입의 명령
  - 입에서 나온 말씀
  lexicon: BDAG
  rationale: λόγος를 단순히 ‘명령’으로 한정하기보다, 입으로 선포된 말을 가리키는 이미지를 살려 ‘입의 말’로 옮겼습니다. 한국어에서는 소유격을 자연스럽게 풀어 ‘자기 입의 말’로 표현했습니다.
- source_word: οἳ οὐκ ἠκολούθησαν
  english_pob_choice: who had not followed
  chosen_korean: 따르지 않은
  alternatives_korean:
  - 순종하지 않은
  - 뒤따르지 않은
  - 행하지 않은
  lexicon: BDAG
  rationale: 직역적 이미지인 ‘따르다’를 유지해 원문의 동사를 보존했고, 문맥상 불순종의 뜻을 독자에게 과도하게 미리 확정하지 않았습니다.
