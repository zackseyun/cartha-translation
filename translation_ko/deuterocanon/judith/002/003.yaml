    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그들도 자기 입의 말을 따르지 않은 모든 육체를 멸망시키기로 결정했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘모든 사람’, ‘모든 인류’일 수 있습니다. 그리스어는 여기서 성경적 관용구인 ‘모든 육체’를 사용합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그 입에서 나온 명령’, ‘그가 말한 명령’일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔκριναν
  english_pob_choice: decided
  chosen_korean: 결정했습니다
  alternatives_korean:
  - 판단했습니다
  - 정했습니다
  - 선고했습니다
  lexicon: BDAG
  rationale: 서술적 맥락에서 ‘판단하다’보다 의사결정의 결과를 자연스럽게 드러내며, 법정 판결처럼 과도하게 좁히지 않습니다.
- source_word: ὀλεθρεῦσαι
  english_pob_choice: to destroy
  chosen_korean: 멸망시키기로
  alternatives_korean:
  - 파멸시키기로
  - 없애기로
  - 진멸하기로
  lexicon: LSJ
  rationale: 강한 파괴 의도를 살리되, 본문의 수위를 넘는 추가 해석 없이 현대 한국어로 직접 표현했습니다.
- source_word: πᾶσαν σάρκα
  english_pob_choice: all flesh
  chosen_korean: 모든 육체
  alternatives_korean:
  - 모든 사람
  - 모든 인류
  lexicon: LSJ
  rationale: 영어 POB가 보존한 성경적 관용구를 따라 ‘육체’로 옮겨, ‘모든 사람’으로 매끈하게 풀어 쓰며 원문 이미지와 긴장을 지우지 않았습니다.
- source_word: τῷ λόγῳ τοῦ στόματος αὐτοῦ
  english_pob_choice: the word of his mouth
  chosen_korean: 자기 입의 말
  alternatives_korean:
  - 그 입에서 나온 말씀
  - 그 입의 명령
  - 입에서 나온 말씀
  lexicon: BDAG
  rationale: λόγος를 단순히 ‘명령’으로 한정하기보다, 입으로 선포된 말을 가리키는 이미지를 살려 ‘입의 말’로 옮겼습니다. 한국어에서는 소유격을 자연스럽게 풀어 ‘자기 입의 말’로 표현했습니다.
- source_word: οἳ οὐκ ἠκολούθησαν
  english_pob_choice: who had not followed
  chosen_korean: 따르지 않은
  alternatives_korean:
  - 순종하지 않은
  - 뒤따르지 않은
  - 행하지 않은
  lexicon: BDAG
  rationale: 직역적 이미지인 ‘따르다’를 유지해 원문의 동사를 보존했고, 문맥상 불순종의 뜻을 독자에게 과도하게 미리 확정하지 않았습니다.
theological_decisions:
- issue: πᾶσα σάρξ의 처리
  chosen_reading: ‘모든 육체’로 옮겨, 성경적 관용구를 유지했습니다.
  alternative_readings:
