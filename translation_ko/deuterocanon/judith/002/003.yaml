  - 모든 인류
  rationale: 이 구절의 σάρξ는 바울서신의 ‘육신/죄성’ 의미가 아니라 포괄적 대상 전체를 가리키는 관용구이므로, 원문 질감을 살리는 번역이 적절합니다.
  doctrine_reference: 'DOCTRINE.md: σάρξ 항목 및 관용구 처리 원칙'
