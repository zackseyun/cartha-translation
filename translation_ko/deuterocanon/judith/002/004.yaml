base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/002/004.yaml
  text: And it happened[a], when he had finished his plan, that Nebuchadnezzar king of the Assyrians called Holofernes, the commander-in-chief of his forces, who was second after him, and said to him[c][b],
  footnotes:
  - marker: a
    text: Or 'his counsel' or 'his purpose' for 'his plan' (τὴν βουλὴν αὐτοῦ).
    reason: lexical_alternative
  - marker: b
    text: Or 'the general' for 'the commander-in-chief' (ἀρχιστράτηγον), though the Greek suggests the highest military office.
    reason: lexical_alternative
  - marker: c
    text: Literally, 'being second after him,' indicating Holofernes' rank immediately below the king.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 일이 일어났습니다[a]. 그가 자기 계획을 마치자[b], 아시리아 왕 느부갓네살은 자기 군대의 최고 사령관이자 자기 다음 서열인[b][c] 홀로페르네스를 불러 그에게 말했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 계획’이 아니라 ‘그의 counsel/목적’으로도 옮길 수 있습니다(τὴν βουλὴν αὐτοῦ).
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그의 계획을 마치자’이며, 시간 연결을 나타내는 표현입니다.
    reason: source_note
  - marker: c
    text: 직역하면 ‘그 뒤에 둘째인’으로, 홀로페르네스가 왕 바로 아래의 서열임을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ἐγένετο
  english_pob_choice: And it happened
  chosen_korean: 그 일이 일어났습니다
  alternatives_korean:
  - 그리고 그렇게 되었습니다
  - 그리하여 일이 일어났습니다
  lexicon: BDAG
  rationale: 서사 도입 공식으로서의 자연스러운 현대 한국어를 쓰되, 원문의 사건 전환을 분명하게 살리기 위해 ‘일어났습니다’로 옮겼습니다.
- source_word: ὡς συνετέλεσεν τὴν βουλὴν αὐτοῦ
  english_pob_choice: when he had finished his plan
  chosen_korean: 그가 자기 계획을 마치자
  alternatives_korean:
  - 그가 자기 counsel을 끝내자
  - 그가 자기 목적을 이루자
  lexicon: BDAG
  rationale: βουλή는 이 문맥에서 단순한 ‘생각’보다 의도된 군사적·정책적 ‘계획’이 자연스럽고, ὡς + aorist의 시간 관계를 한국어 연결형으로 반영했습니다.
- source_word: ἀρχιστράτηγον τῆς δυνάμεως αὐτοῦ
  english_pob_choice: the commander-in-chief of his forces
  chosen_korean: 자기 군대의 최고 사령관
  alternatives_korean:
  - 자기 군대의 총사령관
  - 자기 병력의 지휘관
  lexicon: BDAG
  rationale: ἀρχιστράτηγος는 최고 군사 지휘관을 가리키므로, 위계를 드러내는 ‘최고 사령관’이 적절합니다. δύναμις는 여기서 군사력보다 ‘군대/병력’의 뜻이 분명합니다.
- source_word: δεύτερον ὄντα μετʼ αὐτόν
  english_pob_choice: who was second after him
  chosen_korean: 자기 다음 서열인
  alternatives_korean:
  - 그 다음인
  - 그에게 바로 이어지는
  lexicon: BDAG
  rationale: 직역보다 한국어에서 위계 관계가 선명하도록 ‘자기 다음 서열인’으로 옮겼으며, 인접한 직위 서열을 나타내는 원문의 의미를 보존했습니다.
theological_decisions:
- issue: 느부갓네살을 ‘아시리아 왕’으로 부르는 서술 유지
  chosen_reading: 본문의 역사적·서사적 호칭을 그대로 따라 ‘아시리아 왕 느부갓네살’로 옮겼습니다.
  alternative_readings:
  - 역사적 부조화를 완화해 설명하는 번역
  - 단순히 ‘느부갓네살 왕’으로 축약
  rationale: 유딧서의 서술 방식 자체를 지우지 않고, 원문이 제시하는 호칭을 독자에게 그대로 전달하는 편이 본문 이해에 더 충실합니다.
  doctrine_reference: 본문 충실성 및 정경 밖/외경 서술의 내적 일관성
