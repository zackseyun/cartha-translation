  naturalness: ‘그가 자신의 계획을 마쳤을 때’로 시간 관계를 자연스럽게 연결하고, ‘자신의 군대의 총사령관이며 왕 다음가는’으로 직위와 서열을 매끄럽게 표현했습니다. 현대 표준어 합쇼체를 유지했습니다.
  terminology: ‘아시리아 왕 느부갓네살’, ‘홀로페르네스’, ‘군대의 총사령관’을 유지했습니다. ‘계획’은 βουλή의 문맥상 적절한 번역이며, 대안 의미는 올바른 한국어 각주로 제시했습니다.
