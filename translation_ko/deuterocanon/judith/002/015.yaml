lexical_decisions:
- source_word: ἠρίθμησεν
  english_pob_choice: counted chosen men
  chosen_korean: 계수하였는데
  alternatives_korean:
  - 수효를 헤아렸는데
  - 세었는데
  - 모집하였는데
  lexicon: LSJ
  rationale: 군사적 맥락에서 단순히 ‘세다’보다 인원수를 공식적으로 헤아려 정리하는 뜻을 살리기 위해 ‘계수하다’를 택했습니다.
- source_word: ἐκλεκτοὺς ἄνδρας
  english_pob_choice: chosen men
  chosen_korean: 선택한 사람들
  alternatives_korean:
  - 뽑힌 남자들
  - 선발된 장정들
  - 선택한 장정들
  lexicon: LSJ
  rationale: ἄνδρας는 문자적으로 남성/사람들을 가리키지만, 한국어에서는 군대 인원 전체를 자연스럽게 드러내는 ‘선택한 사람들’이 가장 무리 없습니다.
- source_word: εἰς παράταξιν
  english_pob_choice: for battle formation
  chosen_korean: 전투 진형을 위해
  alternatives_korean:
  - 전열을 이루기 위해
  - 전투 대형을 위해
  - 전열로
  lexicon: LSJ
  rationale: παράταξις의 군사적 의미를 살려 ‘진형’으로 옮기되, 목적 구문을 자연스럽게 풀어 한국어 문장에 맞췄습니다.
- source_word: ὁ κύριος αὐτοῦ
  english_pob_choice: his lord
  chosen_korean: 그의 주인이
  alternatives_korean:
  - 그의 주께서
  - 그의 군주가
  - 그의 상전이
  lexicon: LSJ
  rationale: 여기서 κύριος는 하나님이 아니라 인간 상관을 가리키므로, 신적 ‘주님’ 대신 관계를 분명히 하는 ‘주인’으로 옮겼습니다.
theological_decisions:
