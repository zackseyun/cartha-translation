  alternative_readings:
  - 그의 주님
  - 그의 상전
  rationale: 유딧서 본문에서는 하느님 호칭이 아니라 상급 지휘관의 명령 관계이므로, 독자가 신적 의미를 덧씌우지 않도록 문맥 우선으로 처리했습니다.
