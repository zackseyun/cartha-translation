lexical_decisions:
- source_word: ἠρίθμησεν
  english_pob_choice: counted chosen men
  chosen_korean: 계수하였는데
  alternatives_korean:
  - 수효를 헤아렸는데
  - 세었는데
  - 모집하였는데
  lexicon: LSJ
  rationale: 군사적 맥락에서 단순히 ‘세다’보다 인원수를 공식적으로 헤아려 정리하는 뜻을 살리기 위해 ‘계수하다’를 택했습니다.
- source_word: ἐκλεκτοὺς ἄνδρας
  english_pob_choice: chosen men
  chosen_korean: 선택한 사람들
