- from: 그리고 그는 전투 진형을 위해 선택한 사람들을 계수하였는데, 이는 그의 주인이 그에게 명령한 대로였습니다. 곧 십이 만과, 말을 탄 궁수 이만입니다.[a]
  to: 그리고 그는 그의 주군이 그에게 명령한 대로, 전투 대형을 갖추도록 선발된 사람들의 수를 세었습니다. 곧 십이만 명과 말을 탄 궁수 만 이천 명이었습니다.[a]
  rationale: 그리스어의 두 수량을 각각 정확히 십이만과 만 이천으로 바로잡고, 각주도 원문의 수량 표현을 정확히 반영하도록 고쳤습니다. 군사적 문맥과 인간 상관을 가리키는 호칭을 자연스러운 현대 합쇼체로 다듬었습니다.
