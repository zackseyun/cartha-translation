  text: “이같이 말합니다. 위대한 왕이요 온 땅의 주인인 내가 말합니다. 보십시오, 너는 내 앞에서 나가야 하고, 너는 힘에 의지하는 사람들, 보병 십이만 명과 기병과 그 기병을 태운 말들의 큰 무리를 너와 함께 데리고 가야 합니다.”[a]
