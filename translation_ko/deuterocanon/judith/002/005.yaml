  source_fidelity: 수정이 필요합니다. 초안은 첫머리에서 왕의 칭호를 인용 공식과 중복하여 ‘내가 말합니다’로 바꾸었는데, 그리스어는 ‘위대한 왕, 온 땅의 주인이 이렇게 말한다’라는 3인칭 전령 공식입니다. 또한 마지막 ‘열두 마리아드’(십이만)는 기병을 태운 말들의 수를 가리키지만, 초안 본문에는 이 수량이 빠져 있습니다. ‘기병과 그 기병을 태운 말들’은 말과 기병의 관계도 부정확하게 표현합니다.
  naturalness: 수정문은 현대 한국어의 격식 있는 성경 문체를 유지하면서 왕의 선언과 단수 수신자에 대한 명령을 자연스럽게 표현합니다. ‘보라’는 ἰδού의 주의를 환기하는 선언적 기능과 왕의 권위 있는 발화를 간결하게 보존합니다.
  terminology: ‘온 땅의 주인’은 인간 왕의 과장된 지배권 주장을 적절히 나타내며, 신적 호칭으로 단정하지 않습니다. πεποιθότας ἐν ἰσχύι αὐτῶν은 ‘자기 힘을 믿는 사람들’로 옮겨 자기 힘에 대한 신뢰라는 의미를 보존했습니다. ‘기병을 태운 말’은 ἵππων σὺν ἀναβάταις를 충실히 반영합니다.
