translation:
  language: ko
  text: 그는 길리기아의 영토를 점령하고, 그에게 저항한 모든 사람을 쳐 죽였으며, 아라비아 맞은편 남쪽에 있는 야벳의 경계까지 이르렀습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 본문에는 ‘이아페트’(Ἰάφεθ)라고 되어 있습니다. 이 지명의 위치는 확실하지 않습니다. 이를 더 익숙한 지명과 동일시하려는 해석도 있지만, 여기서는 본문 전승을 보존했습니다.
    reason: alternative_reading
