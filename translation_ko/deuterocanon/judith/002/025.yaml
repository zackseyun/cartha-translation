  - 길리기아의 국경
  - 길리기아의 지역
  lexicon: LSJ
  rationale: ‘경계/국경’의 문자적 의미보다 문맥상 지배 범위를 가리키는 지리·정치적 표현이므로 ‘영토’로 옮겼습니다.
- source_word: κατέκοψε πάντας τοὺς ἀντιστάντας αὐτῷ
  english_pob_choice: cut down all who resisted him
  chosen_korean: 자신에게 저항한 모든 사람을 쳐죽였으며
  alternatives_korean:
  - 자신에게 맞선 모든 사람을 쳐부수었으며
  - 저항한 모든 이를 죽였으며
  - 그에게 대항한 모든 사람을 베었으며
  lexicon: LSJ
  rationale: κατέκοψε의 폭력성과 전쟁 서술의 잔혹함을 살리되, 한국어로는 ‘쳐죽이다’가 가장 직접적으로 대응합니다.
- source_word: Ἰάφεθ
  english_pob_choice: Japheth
  chosen_korean: 야페스
  alternatives_korean:
  - 야벳
  - 야페트
  - 야페스
  lexicon: transliteration
  rationale: 그리스어 전승의 지명을 보존하되, 한국어 독자에게 음가를 최대한 따라 적을 수 있도록 음역했습니다.
- source_word: τὰ πρὸς νότον
  english_pob_choice: to the south
  chosen_korean: 남쪽으로
  alternatives_korean:
  - 남쪽에
  - 남쪽을 향하여
  - 남쪽 편에
  lexicon: LSJ
  rationale: 방향을 나타내는 간결한 표현으로, 뒤의 지리적 관계를 자연스럽게 이어 주기 위해 ‘남쪽으로’로 옮겼습니다.
- source_word: κατὰ πρόσωπον τῆς Ἀραβίας
  english_pob_choice: opposite Arabia
  chosen_korean: 아라비아 맞은편에
  alternatives_korean:
  - 아라비아를 마주하여
  - 아라비아 앞에
  - 아라비아와 마주한 곳에
  lexicon: LSJ
  rationale: κατὰ πρόσωπον의 지리적 관용구를 ‘맞은편에’로 살려, 단순한 방향이 아니라 마주 보는 위치를 드러냈습니다.
