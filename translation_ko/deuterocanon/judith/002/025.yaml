  chosen_korean: 야페스
  alternatives_korean:
  - 야벳
  - 야페트
  - 야페스
  lexicon: transliteration
  rationale: 그리스어 전승의 지명을 보존하되, 한국어 독자에게 음가를 최대한 따라 적을 수 있도록 음역했습니다.
- source_word: τὰ πρὸς νότον
  english_pob_choice: to the south
  chosen_korean: 남쪽으로
  alternatives_korean:
