  lexicon: LSJ
  rationale: 영토를 대상으로 한 중립적이면서도 강제적 점유를 한국어로 자연스럽게 드러내기 위해 ‘점령하다’를 택했습니다.
- source_word: τὰ ὅρια τῆς Κιλικίας
