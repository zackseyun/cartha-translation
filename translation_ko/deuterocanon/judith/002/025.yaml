revisions:
- from: 그는 길리기아의 영토를 점령하고, 자신에게 저항한 모든 사람을 쳐죽였으며, 야페스의 경계까지, 남쪽으로 아라비아 맞은편에 이르렀습니다.[a]
  to: 그는 길리기아의 영토를 점령하고, 그에게 저항한 모든 사람을 쳐 죽였으며, 아라비아 맞은편 남쪽에 있는 야벳의 경계까지 이르렀습니다.[a]
  rationale: 원문의 지리적 수식 관계를 한국어 어순에 맞게 ‘아라비아 맞은편 남쪽에 있는 야벳의 경계’로 명확히 했습니다. 살해를 나타내는 κατέκοψε의 의미는 완화하지 않고, 공적 성서 문체에 맞게 ‘쳐 죽였으며’로 다듬었습니다. 불확실한 Ἰάφεθ는 본문에서 통용 표기 ‘야벳’으로 처리하되, 각주에 그리스어 형태와 지명 불확실성을 밝혀 비평적 모호성을 보존했습니다.
