  text: And he seized the territory of Cilicia[a], and cut down all who resisted him, and came as far as the borders of Japheth, to the south, opposite Arabia.
  footnotes:
  - marker: a
    text: Greek reads 'Japheth.' The location is uncertain; some interpreters connect it with a more familiar place-name, but the source text itself is preserved here without emendation.
