translation:
  language: ko
  text: 그는 길리기아의 영토를 점령하고, 자신에게 저항한 모든 사람을 쳐죽였으며, 야페스의 경계까지, 남쪽으로 아라비아 맞은편에 이르렀습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 본문은 ‘야페스’라고 읽습니다. 위치는 확실하지 않으며, 더 익숙한 지명과 연결하려는 해석도 있지만 여기서는 본문 전승을 그대로 보존했습니다.
    reason: textual_variant
