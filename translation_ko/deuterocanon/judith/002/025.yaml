  rationale: 그리스어 본문이 전하는 형태를 임의로 정정하지 않고, 위치 불확실성은 번역문 자체를 바꾸지 않고 보존하는 편이 소스 충실성에 부합합니다.
  doctrine_reference: 본문 비평/전승 보존 원칙
