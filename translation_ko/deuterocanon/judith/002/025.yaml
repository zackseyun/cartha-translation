  rationale: ‘경계/국경’의 문자적 의미보다 문맥상 지배 범위를 가리키는 지리·정치적 표현이므로 ‘영토’로 옮겼습니다.
- source_word: κατέκοψε πάντας τοὺς ἀντιστάντας αὐτῷ
  english_pob_choice: cut down all who resisted him
  chosen_korean: 자신에게 저항한 모든 사람을 쳐죽였으며
  alternatives_korean:
