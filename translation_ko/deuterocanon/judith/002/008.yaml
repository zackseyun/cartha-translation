translation:
  language: ko
  text: 그들의 부상자들이 그들의 골짜기들과 와디들을 채울 것이며, 넘쳐흐르는 강이 그들의 죽은 자들로 가득 찰 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “겨울 급류들” 혹은 “시내바닥들”로 옮길 수 있습니다. 여기의 그리스어는 계절성 급류가 흐르는 물길을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τραυματίαι
  english_pob_choice: wounded
  chosen_korean: 부상자들
  alternatives_korean:
  - 상처 입은 자들
  - 부상당한 사람들
  lexicon: LSJ
  rationale: τραυματίαι는 ‘부상당한 사람들’이므로, 전투 맥락에 맞고 현대 한국어에서 자연스러운 ‘부상자들’로 옮겼습니다.
- source_word: φάραγγας
  english_pob_choice: ravines
  chosen_korean: 골짜기들
  alternatives_korean:
  - 협곡들
  - 골짜기
  - 계곡들
  lexicon: LSJ
  rationale: 지형적으로 움푹 파인 통로를 가리키므로, 과도하게 장식적이지 않은 ‘골짜기들’이 한국어 독자에게 가장 분명합니다.
- source_word: χειμάρρους
  english_pob_choice: wadis
  chosen_korean: 와디들
  alternatives_korean:
  - 겨울 급류들
  - 개울바닥들
  - 시내들
  lexicon: LSJ
  rationale: χλεμάρρους는 계절성 급류가 흐르는 마른 물길을 뜻하므로, 지리적 의미를 살리는 ‘와디들’을 유지했습니다.
- source_word: ποταμὸς ἐπικλύζων
  english_pob_choice: a river overflowing
  chosen_korean: 넘쳐흐르는 강
  alternatives_korean:
  - 범람하는 강
  - 홍수처럼 불어나는 강
  lexicon: LSJ
  rationale: ‘넘쳐흐르는’은 ἐπικλύζων의 범람·침수 이미지를 직접 반영하며, ‘강’의 주어를 앞세워 한국어 어순도 자연스럽게 했습니다.
- source_word: τοῖς νεκροῖς
  english_pob_choice: with their dead
  chosen_korean: 그들의 죽은 자들로
  alternatives_korean:
  - 그들의 시체로
  - 죽은 자들로
  lexicon: LSJ
  rationale: νεκροί는 ‘죽은 사람들’과 ‘시체’ 모두 가능하지만, 전투 서술의 냉혹함을 살리면서도 문장이 지나치게 생경해지지 않도록 ‘죽은 자들’로 옮겼습니다.
