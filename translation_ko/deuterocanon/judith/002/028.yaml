  to: 그에 대한 두려움과 공포가 해안에 사는 사람들, 곧 시돈과 두로에 있는 사람들, 아수르와 오케이나에 사는 사람들, 그리고 얌니아에 사는 모든 사람들에게 덮쳤습니다.[b] 아조토스와 아스칼론에 사는 사람들은 그를 몹시 두려워했습니다.[a]
