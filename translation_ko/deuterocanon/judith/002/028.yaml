  rationale: 두 개의 명사 쌍이 강한 공포를 나타내므로, 문맥에 맞는 자연스러운 순서로 ‘두려움과 공포’라고 옮겼습니다.
- source_word: τοὺς κατοικοῦντας τὴν παραλίαν
  english_pob_choice: those living along the coast
  chosen_korean: 해변에 사는 사람들
