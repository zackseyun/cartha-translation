  text: And fear and dread of him fell upon those living along the coast—those in Sidon and Tyre[a], those living in Assur and Ocina, and all those living in Jamnia[b]; and those living in Azotus and Ascalon were very greatly afraid of him.
  footnotes:
  - marker: a
    text: Azotus is the Greek name for Ashdod; Ascalon is the Greek name for Ashkelon.
    reason: lexical_alternative
  - marker: b
    text: Some English renderings use 'fear and trembling' for the Greek pair 'fear and dread.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 두려움과 공포가 해변에 사는 사람들, 곧 시돈과 두로에 있는 사람들, 아수르와 오케이나에 사는 모든 사람들, 그리고 이엠나에 사는 모든 사람들에게 덮쳤고, 아조트와 아스칼론에 사는 사람들은 그를 몹시 두려워했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 아조트는 Ashdod의 그리스어 이름이고, 아스칼론은 Ashkelon의 그리스어 이름입니다.
    reason: lexical_alternative
  - marker: b
    text: 일부 번역은 그리스어의 ‘두려움과 공포’를 ‘두려움과 떨림’으로 옮깁니다.
    reason: lexical_alternative
lexical_decisions:
