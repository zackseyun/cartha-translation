  rationale: 본문이 그리스어 헬라어화 지명을 사용하므로, 원형을 따른 음역을 본문에 유지했습니다.
theological_decisions:
- issue: 감정 표현의 강도
  chosen_reading: ‘두려움과 공포’ 및 ‘그를 몹시 두려워했습니다’로 강한 공포를 분명히 드러냈습니다.
  alternative_readings:
  - ‘두려움과 떨림’
  - ‘그를 크게 두려워했습니다’
  rationale: 본문의 φόβος καὶ τρόμος와 σφόδρα는 단순한 두려움보다 훨씬 강한 반응을 가리키므로, 강도를 약화시키지 않도록 했습니다.
