  - 해안 지역에 거주하는 사람들
  - 바닷가에 사는 사람들
  lexicon: LSJ
  rationale: παραλία는 해안/연안을 가리키므로, 현대 한국어에서 곧바로 이해되는 ‘해변’으로 옮기되 거주 표현을 유지했습니다.
