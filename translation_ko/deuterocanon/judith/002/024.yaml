  naturalness: ‘아브로나 급류를 따라 있는’, ‘높은 성읍’ 및 ‘바다에 이를 때까지 나아갔습니다’는 현대 표준 한국어의 격식 있는 성경 번역 문체에 맞습니다. 각주 표지도 해당 어휘 바로 뒤에 두어 참조 관계를 분명히 했습니다.
