base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/002/024.yaml
  text: And he crossed the Euphrates and passed through Mesopotamia[a], and he tore down all the high cities along the torrent Abrona[b], until he came to the sea.
  footnotes:
  - marker: a
    text: Or 'broke through all the high cities'; the Greek verb literally means 'dug through' and may describe breaching or destroying cities in a military campaign.
    reason: lexical_alternative
  - marker: b
    text: The 'torrent Abrona' is a transliterated place-name in the Greek; its exact geographical identification is uncertain.
    reason: cultural_note
translation:
  language: ko
  text: 그리고 그는 유프라테스강을 건너 메소포타미아를 지나갔으며, 아브로나 급류[a]를 따라 있는 모든 높은 성읍을 파괴하고[b] 바다에 이를 때까지 나아갔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘아브로나’는 그리스어로 음역된 지명이며, 정확한 지리적 위치는 확정되지 않았습니다.
    reason: cultural_note
  - marker: b
    text: 그리스어 동사 διέσκαψε는 문자적으로 ‘파다’ 또는 ‘파헤치다’라는 뜻입니다. 성읍들을 대상으로 한 여기의 문맥에서는 성벽을 뚫거나 성읍을 허무는 군사적 행위를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρῆλθεν τὸν Εὐφράτην
  english_pob_choice: crossed the Euphrates
  chosen_korean: 유프라테스를 건너
  alternatives_korean:
  - 유프라테스를 지나
  - 유프라테스를 건넜으며
  lexicon: LSJ
  rationale: 목적어가 강이므로 단순한 통과보다 강을 ‘건너다’가 서술 상황을 가장 자연스럽게 반영합니다.
- source_word: διῆλθεν τὴν Μεσοποταμίαν
  english_pob_choice: passed through Mesopotamia
  chosen_korean: 메소포타미아를 지나갔으며
  alternatives_korean:
  - 메소포타미아를 통과했으며
  - 메소포타미아를 traversed
  lexicon: LSJ
  rationale: 지명 구를 따라 이동하는 의미이므로 ‘지나갔으며’가 현대 한국어에서 가장 자연스럽고 방향감을 살립니다.
- source_word: διέσκαψε
  english_pob_choice: dug through / tore down
  chosen_korean: 파괴하여
  alternatives_korean:
  - 무너뜨려
  - 허물어
  - 파내어
  lexicon: LSJ
  rationale: 문자적 이미지는 ‘파다’이지만, 성읍들을 대상으로 한 군사 서술에서는 실제 의미가 파괴·붕괴를 가리키므로 그 효과를 한국어로 드러냈습니다.
- source_word: χειμάρρου Ἀβρωνᾶ
  english_pob_choice: torrent Abrona
  chosen_korean: 브로나라는 급류 가
  alternatives_korean:
  - 아브로나라는 급류
  - 브로나 급류
  lexicon: LSJ
  rationale: χειμάρρος의 계절성 급류 이미지를 살려 ‘급류’로 옮기고, 고유명사는 음역하되 한국어 조사와 결합해 읽기 쉽게 처리했습니다.
theological_decisions:
- issue: 군사적 파괴 동사의 강도
  chosen_reading: διέσκαψε의 결과를 단순 이동이 아니라 성읍들의 파괴로 이해해 옮겼습니다.
  alternative_readings:
  - 직역하여 ‘파냈습니다’
  - 완곡하게 ‘지나갔습니다’
  rationale: 문맥상 정복 전쟁의 연속 동작이며, 도시를 대상으로 한 동사는 실제 파괴 행위를 가리키므로 의미를 약화하지 않았습니다.
  doctrine_reference: '본문 해석 원칙: 문맥 우선, 과도한 완곡화 지양'
