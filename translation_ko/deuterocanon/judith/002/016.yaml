  - …한 방식으로
  lexicon: LSJ
  rationale: 방식을 나타내는 관용구이므로 한국어에서는 자연스럽게 ‘…하는 방식으로’로 풀어 비교적 표현을 살렸습니다.
- source_word: πολέμου πλῆθος
  english_pob_choice: a multitude is drawn up for war
  chosen_korean: 전쟁을 위해 무리가 진을 치는
  alternatives_korean:
  - 전쟁을 위해 군중이 진을 치는
  - 전쟁을 위해 큰 무리가 전열을 갖추는
  - 전쟁을 위해 무리가 전열을 갖추는
  lexicon: LSJ
  rationale: πλῆθος는 ‘군대’보다 넓은 ‘무리/큰 무리’의 뜻이므로 그 범위를 유지했고, 군사적 배열은 ‘진을 치는’으로 옮겼습니다.
- source_word: συντάσσεται
  english_pob_choice: is drawn up
  chosen_korean: 진을 치는
  alternatives_korean:
  - 정렬되는
  - 전열을 갖추는
  - 배치되는
  lexicon: LSJ
  rationale: 군사 용법에서 전열로 ‘배치되다/진을 치다’의 뜻이므로, 자연스러운 군사 표현인 ‘진을 치는’으로 렌더링했습니다.
