  text: And he arranged them in the way a multitude is drawn up for war[a].
  footnotes:
  - marker: a
    text: Or, 'And he ordered them as a multitude is marshaled for war.' The Greek verb διέταξεν can emphasize either arranging or commanding, and συντάσσεται is a military term for being drawn up in formation.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그는 큰 무리가 전쟁을 위해 전열을 갖추는 방식으로 그들을 배치했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그는 큰 무리가 전쟁을 위해 전열을 갖추듯이 그들을 정렬했습니다.” 그리스어 διέταξεν은 ‘배치하다’ 또는 ‘명령하다’를 뜻할 수 있으며, συντάσσεται는 군사적으로 전열을 갖추는 것을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: διέταξεν
  english_pob_choice: arranged
  chosen_korean: 배치했습니다
  alternatives_korean:
  - 정렬했습니다
  - 명령했습니다
  - 조직했습니다
  lexicon: LSJ
  rationale: 전쟁 문맥에서 단순한 명령보다 군세를 전투 태세로 정렬·편제하는 의미가 두드러지므로, 결과 상태를 살리는 ‘배치했습니다’가 가장 적절합니다.
- source_word: ὃν τρόπον
  english_pob_choice: in the way
  chosen_korean: …하는 방식으로
  alternatives_korean:
