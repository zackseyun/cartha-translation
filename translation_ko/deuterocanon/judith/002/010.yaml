  verdict: revise
  source_fidelity: 수정이 필요합니다. 초안은 ‘나를 위해’(ἐμοί)가 ‘그들을 넘겨받고’에 걸리게 하여, 원문에 없는 ‘그들을 넘겨받다’라는 행위를 추가하고 있습니다. 원문은 먼저 그들의 영토를 ‘나를 위하여’ 선점하고, 이어 그들이 항복하며, 그들을 ‘나를 위하여’ 보전하라는/보전할 것이라는 세 동작을 말합니다.
  naturalness: ‘너는’과 미래적 서술을 유지한 문장은 현대 표준 한국어의 격식 있는 성경 문체로 자연스럽습니다. ‘보전하다’는 포로 또는 정복된 이들을 이후의 처분 때까지 유지한다는 διατηρήσεις의 넓은 뜻을 보존합니다.
  terminology: ‘영토를 미리 점령하다’, ‘스스로 너에게 항복하다’, ‘징벌의 날’은 각각 προκαταλήμψῃ, ἐκδώσουσίν σοι ἑαυτούς, εἰς ἡμέραν ἐλεγμοῦ αὐτῶν을 적절히 반영합니다. ἐλεγμός의 ‘책망/징계’ 가능성은 각주에 유지합니다.
