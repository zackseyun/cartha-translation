  text: But you[a], after going out, shall seize all their territory in advance for me, and they will surrender themselves to you; and you shall keep them for me until the day of their punishment.
  footnotes:
  - marker: a
    text: Or 'until the day of their rebuke' or 'until the day of their chastisement.' The Greek ἐλεγμός can denote rebuke, censure, or punitive correction.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 너는 나가서 그들의 모든 영토를 미리 점령하여 나를 위해 그들을 넘겨받고, 그들은 스스로 너에게 항복할 것이며, 너는 그들을 나를 위해 그들의 징벌의 날까지 지켜야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 책망의 날까지’, ‘그들의 징계의 날까지’. 그리스어 ἐλεγμός는 책망, 질책, 징벌적 교정을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθὼν
  english_pob_choice: after going out
  chosen_korean: 나가서
  alternatives_korean:
  - 나간 뒤에
  - 밖으로 나가
  lexicon: LSJ
  rationale: 부사적으로 앞선 동작을 나타내므로, 한국어에서는 간결한 연결어미 ‘-아서’로 시간적 선행을 자연스럽게 드러냈습니다.
- source_word: προκαταλήμψῃ
  english_pob_choice: shall seize ... in advance
  chosen_korean: 미리 점령하여
  alternatives_korean:
  - 미리 차지하여
  - 선점하여
  lexicon: LSJ
  rationale: 전쟁 맥락의 강한 점유 의미와 προ-의 선행성을 함께 살리기 위해 ‘미리 점령하다’를 택했습니다.
- source_word: πᾶν ὅριον αὐτῶν
  english_pob_choice: all their territory
  chosen_korean: 그들의 모든 영토
  alternatives_korean:
  - 그들의 모든 경계
  - 그들의 온 지역
  lexicon: LSJ
  rationale: ὅριον이 단순한 경계선보다 지배 아래 있는 땅 전체를 가리키는 문맥이므로, 현대 한국어에서는 ‘영토’가 가장 분명합니다.
- source_word: ἐκδώσουσίν σοι ἑαυτούς
  english_pob_choice: they will surrender themselves to you
  chosen_korean: 스스로 너에게 항복할 것이며
  alternatives_korean:
  - 자기들을 너에게 넘길 것이며
  - 스스로를 너에게 내줄 것이며
  lexicon: LSJ
  rationale: 재귀 대명사 ἑαυτούς의 자발적 굴복을 살리되, 군사적 상황에 맞는 자연스러운 한국어 표현으로 옮겼습니다.
- source_word: εἰς ἡμέραν ἐλεγμοῦ αὐτῶν
  english_pob_choice: until the day of their punishment
  chosen_korean: 그들의 징벌의 날까지
  alternatives_korean:
  - 그들의 책망의 날까지
  - 그들의 징계의 날까지
  - 그들의 처벌의 날까지
  lexicon: LSJ
  rationale: ἐλεγμός의 가능한 의미 가운데 이 문맥은 수치스러운 군사적 제압과 응징에 가깝기 때문에, ‘징벌’이 가장 적절합니다.
theological_decisions:
- issue: ἐλεγμός의 의미 범위 보존
  chosen_reading: 징벌
  alternative_readings:
  - 책망
  - 징계
  - 처벌
  rationale: 이 절은 예언적 훈계보다 정복 이후의 응징을 말하므로, 한국어 본문은 ‘징벌’로 하되 대안적 의미는 주석 가능성으로 남겨 둡니다.
  doctrine_reference: 문맥 우선 원칙; 다의어는 문맥에 따라 보존
