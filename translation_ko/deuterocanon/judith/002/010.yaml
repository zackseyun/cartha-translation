    rationale: ‘나를 위해’는 원문의 ἐμοί이며, προκαταλήμψῃ(미리 점령하다) 및 διατηρήσεις(보전하다)와 관련됩니다. ἐκδώσουσίν σοι ἑαυτούς는 ‘그들이 스스로 너에게 항복할 것이다’이지, 수신자가 그들을 ‘넘겨받는다’는 뜻이 아닙니다.
