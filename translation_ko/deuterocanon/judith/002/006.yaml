  text: And you shall go out to meet all the land toward the west[b][a], because they disobeyed the word of my mouth.
  footnotes:
  - marker: a
    text: Or 'toward the west' / 'westward.' The Greek phrase ἐπὶ δυσμᾶς can denote direction as well as region.
    reason: lexical_alternative
  - marker: b
    text: The expression 'the word of my mouth' is a literal rendering of a Greek phrase meaning a spoken command or decree.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 너는 서쪽의 모든 땅을 향해 나가서 맞서게 될 것이니, 이는 그들이 내 입의 말을 거역하였기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘서쪽의’는 ἐπὶ δυσμᾶς의 방향적 의미를 살린 표현이며, 지역명처럼도 읽힐 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘내 입의 말’은 직역에 가깝고, ‘내가 입으로 내린 명령’이라는 뜻을 함축할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελεύσῃ
