  source_fidelity: 원문의 군사 이동, 느부갓네살 왕보다 앞서 나아가는 목적, 서쪽을 향해 땅을 덮는다는 비유적 표현, 그리고 전차·기병·선발 보병의 수단을 모두 보존합니다. 다만 초안의 ‘덮으려 했습니다’는 목적 부정사 τοῦ ... καλύψαι를 단순한 의도로 약화하며, ‘서쪽을 향한 온 땅의 얼굴’은 수식 관계가 불분명합니다.
  naturalness: ‘자신과 자신의 모든 병력이 출정하여’ 및 ‘서쪽을 향해 온 땅의 표면을 덮기 위해’가 현대 표준 한국어 문장으로 더 자연스럽고, 원문의 목적과 방향을 명료하게 드러냅니다. ‘땅의 표면’은 직역적 이미지도 유지합니다.
  terminology: δύναμις는 군사 문맥에 맞게 ‘병력’으로, ἅρμασι·ἱππεῦσι·πεζοῖς ἐπιλέκτοις는 각각 ‘전차·기병·선발된 보병’으로 옮겼습니다. Ναβουχοδονοσὸρ는 통용 표기인 ‘느부갓네살’로 유지했습니다.
