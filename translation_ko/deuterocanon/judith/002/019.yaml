  text: And he himself and all his force set out on the march to go before King Nebuchadnezzar and to cover the whole face of the land toward the west with his chariots and horsemen and his chosen foot soldiers[a].
  footnotes:
  - marker: a
    text: Or 'the whole face of the earth.' The Greek γῆ can mean either 'land' or 'earth'; here 'land' is preferred because the context is a westward military advance across territories.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 자신과 그의 모든 병력이 출정하여, 느부갓네살 왕보다 앞서 나아가고 전차와 기병과 그의 선발된 보병으로 서쪽을 향해 온 땅의 표면을 덮기 위해 길을 떠났습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘온 땅의 표면을’. 그리스어 γῆ는 ‘땅’ 또는 ‘세계/땅’으로 옮길 수 있습니다. 여기서는 서쪽을 향한 군사적 진군이라는 문맥상 특정 지역을 가리키는 ‘땅’으로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθεν αὐτὸς
  english_pob_choice: he himself ... set out
  chosen_korean: 그는 ... 출정하여
  alternatives_korean:
  - 그는 ... 나가서
  - 그 자신이 ... 떠나
  lexicon: BDAG
  rationale: 군사적 문맥의 ἐξῆλθεν은 단순한 ‘나감’보다 출정/출발의 뉘앙스가 자연스럽고, αὐτὸς는 주체를 강조하므로 ‘그는’으로 두어도 충분히 드러납니다.
- source_word: πᾶσα ἡ δύναμις αὐτοῦ
  english_pob_choice: all his force
  chosen_korean: 자기의 모든 군사
  alternatives_korean:
  - 자기의 모든 병력
  - 자기의 모든 힘
  lexicon: BDAG
  rationale: δύναμις는 여기서 능력보다 군사력/병력을 가리키므로, 문맥에 맞게 ‘군사’로 옮겨 자연스럽게 했습니다.
- source_word: πρὸς δυσμαῖς
  english_pob_choice: toward the west
  chosen_korean: 서쪽을 향한
  alternatives_korean:
  - 서쪽으로
  - 서방을 향한
  lexicon: LSJ
  rationale: 방향을 나타내는 표현이므로 ‘서쪽을 향한’으로 처리해 전진 방향을 분명히 했습니다.
- source_word: πεζοῖς ἐπιλέκτοις
  english_pob_choice: chosen foot soldiers
  chosen_korean: 선발된 보병
  alternatives_korean:
  - 뽑힌 보병
  - 정예 보병
  lexicon: BDAG
  rationale: πεζοῖς는 보병, ἐπιλέκτοις는 선발된/뽑힌의 뜻이므로 두 요소를 모두 살리되 현대 군사어 ‘정예’는 피했습니다.
theological_decisions:
- issue: 왕 느부갓네살의 위치와 행렬의 방향을 서술하는 역사-군사 문장 처리
  chosen_reading: 직접적 서술 구조를 유지해, 느부갓네살 왕의 선행과 군대의 동행을 평이하게 드러냈습니다.
  alternative_readings:
  - 문장 순서를 바꾸어 더 한국어답게 풀어쓰기
  - ‘진군하다’로 더 강하게 재구성
  rationale: 원문은 목적구와 병렬 목록이 결합된 군사 이동 서술이므로, 의미를 약화하지 않으면서도 과도한 의역 없이 보존하는 것이 적절합니다.
  doctrine_reference: 서사 본문 번역 원칙
