  rationale: 직접 말로 풀어냈다는 점을 한국어 관용으로 자연스럽게 전달하며, ‘from his own mouth’의 직접성을 유지합니다.
theological_decisions:
- issue: μυστήριον의 의미 범주
  chosen_reading: 기술적 신학 용어가 아니라 궁정 정치의 은밀한 계획을 가리키는 ‘비밀’로 읽었습니다.
  alternative_readings:
  - ‘신비’로 옮겨 종교적 뉘앙스를 살리는 읽기
  - ‘비밀한 계획’으로 더 풀어 쓰는 읽기
  rationale: 헬라어와 영어 POB 둘 다 이 단어를 기술적 ‘mystery’가 아니라 비밀스러운 국정/정략의 내용으로 이해하므로, 한국어에서도 같은 긴장을 유지했습니다.
  doctrine_reference: 어휘·문맥 결정
