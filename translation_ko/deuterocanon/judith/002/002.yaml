    rationale: ἐκ τοῦ στόματος αὐτοῦ의 직접 발화 강조는 ‘자기 입으로’에 이미 반영되어 있습니다. ‘다 밝혔습니다’가 더 자연스럽고 선언·상술의 의미도 유지합니다.
