- from: 그리고 그는 자기의 모든 신하들과 자기의 모든 귀족들을 소집하여, 자기의 계획의 비밀을 그들 앞에 두었으며, 자기 입으로 그 땅의 모든 악을 말해 밝혔습니다.[a][b]
  to: 그리고 그는 자기의 모든 시종들과 자기의 모든 귀족들을 불러 모으고, 자기 계획의 비밀[a]을 그들 앞에 제시했으며, 자기 입으로 그 땅의 모든 악[b]을 다 밝혔습니다.
  rationale: 원문의 궁정 내 두 집단을 구별하기 위해 ‘신하들’을 ‘시종들’로 고쳤습니다. 문장의 자연스러움을 위해 ‘말해 밝혔습니다’를 ‘다 밝혔습니다’로 정리했고, 각주 표지를 각주가 설명하는 어구에 각각 배치했습니다. ‘그 땅의 모든 악’은 원문의 논쟁적·폭넓은 표현을 보존하고, 각주에서 가능한 다른 이해를 제시합니다.
