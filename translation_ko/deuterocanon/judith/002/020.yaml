  text: And a great mixed multitude went out with them[a], like locusts and like the sand of the earth, for there was no number because of their multitude.
  footnotes:
  - marker: a
    text: Or, 'for they were beyond counting because of their multitude.' The Greek expression is a literal way of saying they were innumerable.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 많은 잡다한 무리가 메뚜기처럼 그들과 함께 나갔고, 또 땅의 모래처럼 많아서, 그들의 수효는 셀 수 없었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘그들의 무리가 너무 많아 셀 수 없었습니다.’ 헬라어 표현은 문자적으로는 ‘셀 수 없음’을 말하는 관용적 방식입니다.
    reason: lexical_alternative
lexical_decisions:
