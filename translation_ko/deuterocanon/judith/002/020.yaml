  yaml_path: translation/deuterocanon/judith/002/020.yaml
  text: And a great mixed multitude went out with them[a], like locusts and like the sand of the earth, for there was no number because of their multitude.
  footnotes:
  - marker: a
    text: Or, 'for they were beyond counting because of their multitude.' The Greek expression is a literal way of saying they were innumerable.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 여러 부류의 큰 무리가 메뚜기처럼, 땅의 모래처럼 그들과 함께 나갔습니다. 그들의 수가 너무 많아 셀 수 없었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘그들이 너무 많아 수를 헤아릴 수 없었습니다.’ 헬라어는 문자적으로 ‘그들의 많음 때문에 수가 없었다’고 표현합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἐπίμικτος
  english_pob_choice: mixed multitude
  chosen_korean: 잡다한 무리
  alternatives_korean:
  - 섞인 무리
  - 혼합 무리
  - 혼성 무리
  lexicon: LSJ
  rationale: 본문은 전투 대열에 붙은 여러 부류의 사람들을 가리키는 집합적 표현이므로, 직역적이면서도 현대 한국어에서 자연스러운 ‘잡다한 무리’로 옮겼습니다.
- source_word: συνεξῆλθον αὐτοῖς
  english_pob_choice: went out with them
  chosen_korean: 그들과 함께 나갔고
  alternatives_korean:
  - 그들과 함께 출정했고
  - 그들과 함께 나가
  - 그들을 따라 나갔고
  lexicon: LSJ
  rationale: 동사의 핵심은 ‘동행하여 나감’이므로 군사적 뉘앙스를 과도하게 보태지 않고 ‘함께 나갔고’로 간결하게 옮겼습니다.
- source_word: ὡς ἀκρὶς
  english_pob_choice: like locusts
  chosen_korean: 메뚜기처럼
  alternatives_korean:
  - 메뚜기같이
  - 메뚜기 떼처럼
  lexicon: LSJ
  rationale: 압도적인 수의 비유를 살리기 위해 관용적으로 이해되는 ‘메뚜기처럼’을 사용했습니다.
- source_word: οὐ γὰρ ἦν ἀριθμὸς ἀπὸ πλήθους αὐτῶν
  english_pob_choice: for there was no number because of their multitude
  chosen_korean: 그들의 수효는 셀 수 없었습니다
  alternatives_korean:
  - 그들의 많음 때문에 셀 수 없었습니다
  - 그 수는 헤아릴 수 없었습니다
  - 그들의 무리 때문에 수가 없었습니다
  lexicon: LSJ
  rationale: 헬라어의 관용적 표현을 한국어의 자연스러운 부정 능력 표현으로 옮겨, ‘수효’와 ‘셀 수 없었습니다’로 무수함을 분명히 드러냈습니다.
