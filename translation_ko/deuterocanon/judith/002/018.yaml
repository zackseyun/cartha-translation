lexical_decisions:
- source_word: ἐπισιτισμὸν
  english_pob_choice: provisions
  chosen_korean: 식량
  alternatives_korean:
  - 보급품
  - 배급
  - 식량 공급
  lexicon: LSJ
  rationale: 이 단어는 공급된 먹거리나 생계용 식량을 뜻하므로, 문맥상 자연스럽고 과도하게 군사용 색채를 띠지 않는 ‘식량’으로 옮겼습니다.
- source_word: παντὶ ἀνδρὶ
  english_pob_choice: every man
  chosen_korean: 모든 사람에게
  alternatives_korean:
  - 모든 남자에게
  - 각 사람에게
  - 각 병사에게
  lexicon: LSJ
  rationale: 헬라어는 문자적으로 ‘각 남자에게’이지만, 한국어에서는 성별 표지를 굳이 살리면 어색해질 수 있어 대상의 분배성을 드러내는 ‘모든 사람에게’로 옮겼습니다. 다만 의미상 개별 분배를 유지했습니다.
- source_word: εἰς πλῆθος
  english_pob_choice: in abundance
  chosen_korean: 충분한
  alternatives_korean:
  - 풍성한
  - 많은
  - 넉넉한
  lexicon: LSJ
  rationale: 이 관용구는 양이 넉넉하다는 뜻이므로, 앞의 ‘식량’에 자연스럽게 붙는 수량 감각을 살려 ‘충분한’으로 처리했습니다.
- source_word: ἐξ οἴκου βασιλέως
  english_pob_choice: from the king’s house
  chosen_korean: 왕궁에서
  alternatives_korean:
  - 왕의 집에서
  - 왕실에서
  - 왕의 집안에서
  lexicon: LSJ
  rationale: 직역하면 ‘왕의 집에서’이지만, 한국어에서는 왕실의 근거지나 저장처를 자연스럽게 가리키는 ‘왕궁에서’가 문맥에 맞습니다. 본문의 출처가 왕실 소유임을 유지하면서도 읽기 흐름을 살렸습니다.
