  - marker: b
    text: Greek γῆ can mean 'land' or 'earth'; here 'earth' is chosen because the phrase 'to the ends' suggests a world-spanning claim.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 나는 그들의 포로들을 온 세상 끝까지 데려가겠습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들이 포로가 됨’. αἰχμαλωσίαν을 포로들 자체가 아니라 추상적인 의미로 이해할 경우 이렇게 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어 γῆ는 ‘땅’ 또는 ‘세상’을 뜻할 수 있습니다. 여기서는 ‘끝까지’라는 표현이 세계적 범위를 시사하므로 ‘세상’으로 옮겼습니다.
    reason: lexical_alternative
