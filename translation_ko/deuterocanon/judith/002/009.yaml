  text: And I will lead their captives to the ends of all the earth[a][b].
  footnotes:
  - marker: a
    text: Or 'their captivity,' if αἰχμαλωσίαν is taken abstractly rather than as referring to the captives themselves.
    reason: lexical_alternative
  - marker: b
    text: Greek γῆ can mean 'land' or 'earth'; here 'earth' is chosen because the phrase 'to the ends' suggests a world-spanning claim.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 나는 그들의 포로들을 온 땅의 끝까지 끌고 가겠습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 포로 상태’. αἰχμαλωσίαν을 추상적으로 이해하면 이렇게 옮길 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 그리스어 γῆ는 ‘땅’ 또는 ‘세상/땅’의 뜻을 가질 수 있습니다. 여기서는 ‘온 땅의 끝’이라는 표현이 세계적 범위를 암시하므로 ‘땅’으로 옮겼습니다.
    reason: lexical_alternative
