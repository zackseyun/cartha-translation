  source_fidelity: αἰχμαλωσίαν은 문맥상 ‘포로들/포로 무리’로 옮길 수 있으며, 각주로 추상적 ‘포로가 됨(포로 상태)’의 가능성을 보존하는 것은 적절합니다. 다만 ἄξω는 단순히 ‘이끌다/데려가다’이므로 ‘끌고 가다’가 덧붙이는 강제적 방식은 본문에 명시되지 않습니다. γῆ는 이 수사적으로 포괄적인 표현에서 ‘세상’으로 옮기는 것이 자연스럽습니다.
  naturalness: ‘온 땅의 끝까지’도 이해되지만, 현대 한국어에서는 ‘온 세상 끝까지’가 더 관용적이고 ‘πάσης τῆς γῆς’의 포괄성을 분명히 드러냅니다. ‘데려가겠습니다’는 합쇼체를 유지하면서도 원문의 동작을 과잉 규정하지 않습니다.
