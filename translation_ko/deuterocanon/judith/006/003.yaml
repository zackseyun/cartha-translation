  text: But we[a], his slaves, will strike them down as one man, and they will not withstand the might of our horses.
  footnotes:
  - marker: a
    text: Or 'like one man' or 'as a single man'; the Greek idiom emphasizes either unified action against them or how easily they will be overcome.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 우리는 그의 종들이므로 한 사람처럼 그들을 쳐부술 것이며, 그들은 우리의 말들의 위력을 감당하지 못할 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘한 사람처럼’입니다. 이 관용구는 적들이 하나의 사람처럼 쉽게 제압될 것이라는 뜻도, 우리 쪽의 단일한 공격 행동을 뜻할 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: δοῦλοι
  english_pob_choice: slaves
  chosen_korean: 종
  alternatives_korean:
  - 노예
  - 종들
  lexicon: BDAG
  rationale: 이 장면은 주인에게 대한 절대적 소속과 군사적 자기규정을 드러내므로, 한국어에서는 문맥상 자연하면서도 종속성을 보존하는 ‘종’을 택했습니다. ‘노예’도 가능한데, 본문 전체의 말투를 고려하면 여기서는 ‘종’이 과도하게 현대적 폭력을 전면화하지 않으면서도 종속 의미를 유지합니다.
- source_word: πατάξομεν
  english_pob_choice: will strike them down
  chosen_korean: 쳐부술 것입니다
  alternatives_korean:
  - 쳐서 죽일 것입니다
  - 칠 것입니다
  - 격파할 것입니다
  lexicon: LSJ
  rationale: 이 동사는 단순한 타격보다 전투적 파괴를 강하게 내포하므로, 현대 한국어에서 군사적 뉘앙스를 살리는 ‘쳐부술 것입니다’를 선택했습니다.
- source_word: ὡς ἄνθρωπον ἕνα
  english_pob_choice: as one man
  chosen_korean: 한 사람처럼
  alternatives_korean:
  - 한 사람으로서
  - 한 사람같이
  - 한 몸처럼
  lexicon: LSJ
  rationale: 그리스어 관용구의 핵심은 수적 정확성이 아니라 단일한 방식으로 상대를 압도한다는 뜻이므로, 자연스러운 한국어 관용인 ‘한 사람처럼’으로 옮겼습니다.
- source_word: τὸ κράτος τῶν ἵππων ἡμῶν
  english_pob_choice: the might of our horses
  chosen_korean: 우리의 말들의 위력
  alternatives_korean:
  - 우리 말들의 힘
  - 우리의 기병의 위력
  - 우리의 말들의 강력함
  lexicon: LSJ
  rationale: 본문은 riders가 아니라 ‘말들’을 직접 말하므로 이를 보존했습니다. κράτος는 전투에서 드러나는 힘을 가리키므로 ‘위력’이 가장 적절합니다.
theological_decisions:
- issue: δοῦλοι의 사회적 강도
  chosen_reading: ‘종’으로 번역해 주인에게 속한 절대적 소속과 전투적 자의식을 함께 드러냅니다.
  alternative_readings:
  - 노예
  - 하인
  - 종들
  rationale: 이 절은 단순한 봉사 관계가 아니라 주인에게 매인 소속을 과시하는 말이므로, 완곡한 ‘하인’은 의미를 약화합니다. 한국어 관습상 ‘종’이 본문의 종속성과 고대적 사회관계를 함께 전달합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms table for δοῦλος; Translation philosophy §1'
