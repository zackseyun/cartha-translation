  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πεσόντες
  english_pob_choice: fell down
  chosen_korean: 엎드려
  alternatives_korean:
  - 쓰러져
  - 무릎을 꿇고
  - 엎드렸습니다
  lexicon: BDAG
  rationale: 부사적으로 앞선 동작을 나타내는 분사이므로, 경외의 자세를 자연스럽게 살리는 ‘엎드려’가 원문의 신체적 동작과 문맥을 함께 반영합니다.
- source_word: ὁ λαός
  english_pob_choice: the people
  chosen_korean: 그 백성
  alternatives_korean:
  - 백성이
  - 사람들이
  - 무리가
  lexicon: BDAG
  rationale: 집합적 명사로서 특정 공동체를 가리키므로 ‘그 백성’이 자연스럽고, 이어지는 동작 주체를 분명히 드러냅니다.
- source_word: προσεκύνησαν τῷ θεῷ
  english_pob_choice: worshiped God
  chosen_korean: 하나님께 경배하고
  alternatives_korean:
  - 하나님을 예배하고
  - 하나님께 절하고
  - 하나님께 경배하였고
  lexicon: BDAG
  rationale: 여기서는 단순한 절보다 종교적 경배가 핵심이므로 ‘경배하다’가 원문의 예배적 의미를 가장 직접적으로 옮깁니다.
- source_word: ἐβόησαν λέγοντες
  english_pob_choice: cried out, saying
  chosen_korean: 외치며 말하였습니다
  alternatives_korean:
  - 부르짖으며 말하였습니다
  - 소리치며 말하였습니다
  - 외치며 이르되
  lexicon: BDAG
  rationale: ἐβόησαν의 긴박한 음성 행동은 ‘외치다’가 잘 살리고, λέγοντες는 한국어 문장 흐름상 ‘말하였습니다’로 자연스럽게 이어집니다.
theological_decisions:
- issue: 경배 동사의 한국어 선택
  chosen_reading: ‘예배하다’보다 ‘경배하다’를 사용해 엎드림과 예배 행위를 함께 보이게 했습니다.
  alternative_readings:
  - 하나님을 예배하고
  - 하나님께 절하고
  rationale: 원문 προσεκύνησαν은 신체적 굴복과 धार्मिक 경배를 함께 담으므로, 한국어에서도 ‘경배하다’가 동작과 의미를 함께 보존합니다.
  doctrine_reference: 공적 예배와 경배의 언어
