translation:
  language: ko
  text: 그리고 그는 그 도시의 모든 장로들을 함께 불러 모았습니다. 그들의 모든 청년들과 여자들이 그 모임으로 달려 모였습니다. 그들은 아히오르를 자기들의 모든 백성 한가운데에 세웠고, 오즈야는 그에게 일어난 일을 물었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πρεσβυτέρους
  english_pob_choice: elders
  chosen_korean: 장로들
  alternatives_korean:
  - 어른들
  - 노인들
  lexicon: BDAG
  rationale: 도시의 공적 지도층을 가리키므로 연령 묘사보다 공동체 지도자를 뜻하는 ‘장로들’이 가장 적절합니다.
- source_word: συνέδραμον
