  terminology: πρεσβυτέρους의 ‘장로들’은 도시의 공적 지도층이라는 문맥에 적절합니다. ἐκκλησίαν의 ‘회중’은 현대 한국어에서 기독교적 집단을 연상할 수 있어 ‘모임’으로 바꾸는 것이 좋습니다. 인명 ‘아히오르’, ‘오즈야’는 음역상 수용 가능합니다.
