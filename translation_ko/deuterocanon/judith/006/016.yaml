  text: 그리고 그는 그 도시의 모든 장로들을 함께 불러 모았고, 그들의 모든 청년들과 여자들이 회중으로 달려왔습니다. 그들은 아히오르를 자기들의 모든 백성 한가운데 세웠고, 오즈야는 그에게 일어난 일을 물었습니다.
