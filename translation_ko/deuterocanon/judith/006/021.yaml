  text: καὶ παρέλαβεν αὐτὸν Ὀζείας ἐκ τῆς ἐκκλησίας εἰς οἶκον ἑαυτοῦ, καὶ ἐποίησεν πότον τοῖς πρεσβυτέροις· καὶ ἐπεκαλέσαντο τὸν θεὸν Ἰσραὴλ εἰς βοήθειαν ὅλην τὴν νύκτα ἐκείνην.
