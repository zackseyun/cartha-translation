theological_decisions:
- issue: ἐκκλησία의 번역에서 교회 제도화 여부
  chosen_reading: 이곳의 ἐκκλησία는 후대 기독교 제도가 아니라 모인 공동체를 뜻하므로 ‘회중’으로 번역했습니다.
  alternative_readings:
