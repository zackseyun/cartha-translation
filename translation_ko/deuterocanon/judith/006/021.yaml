base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/006/021.yaml
  text: And Uzziah took him from the assembly into his house[a], and made a feast for the elders[b]; and they called on the God of Israel for help all that night.
  footnotes:
  - marker: a
    text: Greek ἐκκλησία means the gathered assembly or congregation here, not 'church' in a later Christian sense.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'made a drinking feast' or 'made drink'; the phrase refers to hosting a banquet.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 오즈야는 그를 회중에서 자기 집으로 데려가고, 장로들을 위해 잔치를 베풀었으며, 그들은 그 밤새도록 이스라엘의 하나님께 도움을 구하였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Greek ἐκκλησία here denotes the gathered assembly, not ‘church’ in a later institutional sense.
    reason: lexical_alternative
  - marker: b
    text: The Greek phrase is literally ‘made a drinking feast’; the Korean idiom ‘잔치를 베풀다’ communicates the banquet setting naturally.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρέλαβεν αὐτὸν
  english_pob_choice: took him
  chosen_korean: 그를 데려가고
  alternatives_korean:
  - 그를 데리고 가고
  - 그를 데려다가
  lexicon: BDAG
  rationale: ἐκκλησία에서 집으로 이동시키는 동작이므로 단순한 ‘받다’보다 동반 이동의 의미를 살려 ‘데려가다’로 옮겼습니다.
- source_word: ἐκκλησίας
  english_pob_choice: from the assembly
  chosen_korean: 회중에서
  alternatives_korean:
  - 모임에서
  - 집회에서
  - 교회에서
  lexicon: LEH
  rationale: 후대 교회 제도를 뜻하는 ‘교회’는 피하고, 이 문맥의 공적 집합체를 가리키는 ‘회중’을 택했습니다.
- source_word: ἐποίησεν πότον
  english_pob_choice: made a feast
  chosen_korean: 잔치를 베풀었으며
  alternatives_korean:
  - 연회를 베풀었으며
  - 마실 잔치를 차렸으며
  - 연락을 베풀었으며
  lexicon: LEH
  rationale: πότον의 직역은 ‘마시는 잔치’이지만 한국어에서는 자연스럽고 장면에 맞는 공공연한 식사/연회 표현인 ‘잔치를 베풀다’가 가장 무리 없습니다.
- source_word: τοῖς πρεσβυτέροις
  english_pob_choice: for the elders
  chosen_korean: 장로들을 위해
  alternatives_korean:
  - 원로들을 위해
  - 나이 많은 사람들을 위해
  lexicon: BDAG
  rationale: 문맥상 단순히 연장자가 아니라 공동체 지도층을 가리키므로 관직·역할 의미를 살려 ‘장로들’로 옮겼습니다.
- source_word: ἐπεκαλέσαντο τὸν θεὸν Ἰσραήλ εἰς βοήθειαν
  english_pob_choice: called on the God of Israel for help
  chosen_korean: 이스라엘의 하나님께 도움을 구하였습니다
  alternatives_korean:
  - 이스라엘의 하나님을 부르며 도움을 청하였습니다
  - 이스라엘의 하나님께 도움을 요청하였습니다
  lexicon: LEH
  rationale: 하나님께 기도하며 간구하는 의미를 살려 ‘도움을 구하다’로 자연스럽게 옮겼고, 대상격은 한국어 관용에 맞게 ‘께’로 표시했습니다.
- source_word: ὅλην τὴν νύκτα ἐκείνην
  english_pob_choice: all that night
  chosen_korean: 그 밤새도록
  alternatives_korean:
  - 온 그 밤을
  - 그날 밤 내내
  lexicon: BDAG
  rationale: 시간의 지속성을 간결하게 전달하는 한국어 관용구로 ‘밤새도록’을 택했습니다.
theological_decisions:
- issue: ἐκκλησία의 번역에서 교회 제도화 여부
  chosen_reading: 이곳의 ἐκκλησία는 후대 기독교 제도가 아니라 모인 공동체를 뜻하므로 ‘회중’으로 번역했습니다.
  alternative_readings:
  - 교회
  - 공동체
  rationale: 문맥이 공적 집합 장면이므로 제도적 교회 용어를 쓰면 시대착오가 생깁니다.
  doctrine_reference: 문맥적 용례 판단
- issue: 기도 동사의 공손한 대상 표기
  chosen_reading: 하나님께 대한 간구를 한국어 합쇼체로 유지하되, 직접 호칭이 아니므로 ‘구하였습니다’로 평서형 서술을 사용했습니다.
  alternative_readings:
  - 도움을 청하였습니다
  - 간구하였습니다
  rationale: 서술문 전체의 현대적 공손체를 유지하면서도 기도 행위의 진지함을 해치지 않도록 했습니다.
  doctrine_reference: 문체/등록 일관성
