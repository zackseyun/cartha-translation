  text: and then the iron of my army and the people of my servants will pass through your sides[a], and you will fall among their wounded when they return[c][b];
  footnotes:
  - marker: a
    text: Greek 'the iron of my army' likely uses 'iron' as a metonym for weaponry or armed force; alternatively, it could be rendered more interpretively as 'the swords of my army.'
    reason: lexical_alternative
  - marker: b
    text: The phrase 'your sides' could also be rendered 'your flanks' or 'your ribs,' depending on whether the addressee is heard more corporately or more personally.
    reason: lexical_alternative
  - marker: c
    text: The Greek text is vivid but somewhat compressed in 'you will fall among their wounded'; this likely means the addressee will be counted among those wounded by Holofernes' forces.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러면 내 군대의 쇠와 내 종들의 백성이 네 옆구리를 꿰뚫을 것이며, 그들이 돌아올 때 너는 그들의 부상자들 가운데서 쓰러질 것이다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ σίδηρος
  english_pob_choice: the iron
  chosen_korean: 쇠
  alternatives_korean:
  - 철
  - 무기
  lexicon: LSJ
  rationale: 직역하면 ‘쇠’이지만, 여기서는 전쟁 장비를 가리키는 환유이므로 한국어에서도 짧고 거친 이미지인 ‘쇠’를 살려 본문의 강도를 유지했습니다.
- source_word: τῆς στρατείας μου
  english_pob_choice: of my army
  chosen_korean: 내 군대의
  alternatives_korean:
  - 내 전쟁의
  - 내 원정대의
  lexicon: LSJ
  rationale: στρατεία는 문맥상 추상적 ‘전쟁’보다 군사 집단을 가리키므로, 한국어에서는 자연스럽게 ‘군대’로 옮겼습니다.
- source_word: ὁ λαὸς τῶν θεραπόντων μου
  english_pob_choice: the people of my attendants
  chosen_korean: 내 종들의 백성
  alternatives_korean:
  - 내 시종들의 무리
  - 내 시종들의 사람들
  lexicon: LSJ
  rationale: λαός의 ‘백성/무리’와 θεράπων의 ‘시종, 종속된 봉사자’의 관계를 함께 살리기 위해 ‘종들의 백성’으로 옮겨, 단순한 병력 표현으로 좁히지 않았습니다.
- source_word: τὰς πλευράς σου
  english_pob_choice: your sides
  chosen_korean: 네 옆구리를
  alternatives_korean:
  - 네 옆을
  - 네 갈비뼈를
  - 네 옆구리들을
  lexicon: LSJ
  rationale: πλευράς는 ‘옆, 옆구리, 갈빗대’ 범위를 가지지만, 위협적 신체 타격의 이미지로는 한국어 ‘옆구리’가 가장 직접적입니다.
- source_word: ἐν τοῖς τραυματίαις αὐτῶν
  english_pob_choice: among their wounded
  chosen_korean: 그들의 부상자들 가운데서
  alternatives_korean:
  - 그들의 상처 입은 자들 가운데서
  - 그들의 전상자들 가운데서
  lexicon: LSJ
  rationale: τραυματίας를 ‘부상자’로 옮겨 직접적인 상흔을 드러내되, ‘전상자’처럼 군사적 의미를 과도하게 한정하지 않았습니다.
theological_decisions:
- issue: 군사적 폭력의 직설성 유지
  chosen_reading: 본문의 위협적·폭력적 이미지를 완화하지 않고 ‘꿰뚫을 것이며’, ‘쓰러질 것이다’로 직역에 가깝게 유지했습니다.
  alternative_readings:
  - ‘가로지를 것이다’처럼 완곡하게 표현
  - ‘쓰러질 것이다’를 ‘죽을 것이다’로 구체화
  rationale: 헬라어 διελεύσεται와 πεσῇ가 주는 파괴적 긴장을 유지하는 것이 본문의 수사와 경고의 힘을 보존합니다.
  doctrine_reference: Judith 6:6 narrative rhetoric
