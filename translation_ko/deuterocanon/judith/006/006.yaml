  text: and then the iron of my army and the people of my servants will pass through your sides[a], and you will fall among their wounded when they return[c][b];
  footnotes:
  - marker: a
    text: Greek 'the iron of my army' likely uses 'iron' as a metonym for weaponry or armed force; alternatively, it could be rendered more interpretively as 'the swords of my army.'
    reason: lexical_alternative
  - marker: b
    text: The phrase 'your sides' could also be rendered 'your flanks' or 'your ribs,' depending on whether the addressee is heard more corporately or more personally.
    reason: lexical_alternative
  - marker: c
    text: The Greek text is vivid but somewhat compressed in 'you will fall among their wounded'; this likely means the addressee will be counted among those wounded by Holofernes' forces.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러면 내 군대의 쇠[a]와 내 시종들의 무리가 네 옆구리를[b] 관통할 것이며, 그들이 돌아올 때에 너는 그들의 부상자들[c] 가운데 쓰러질 것이다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 ‘내 군대의 쇠’는 문자적으로는 쇠를 뜻하지만, 여기서는 쇠로 된 무기나 무력을 가리키는 환유일 수 있습니다. ‘내 군대의 칼들’로 더 해석적으로 옮길 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어는 ‘네 옆들/옆구리들’입니다. 문맥에 따라 ‘네 측면’ 또는 ‘네 갈비뼈’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 그리스어 ‘그들의 부상자들 가운데’는 생생하면서도 압축된 표현입니다. 문맥상 그들의 군대가 입힌 부상자들 가운데 쓰러진다는 뜻일 수 있으나, 본문은 그 관계를 더 명시하지 않습니다.
    reason: lexical_alternative
