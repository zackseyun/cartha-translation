base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/006/010.yaml
  text: And Holofernes ordered his slaves[a], who were standing by in his tent[b], to seize Achior and take him back to Bethyloua and hand him over into the hands of the sons of Israel.
  footnotes:
  - marker: a
    text: Or 'Bethulia,' the more traditional English form of the place name.
    reason: lexical_alternative
  - marker: b
    text: '''The sons of Israel'' is a literal rendering of the Greek expression; it refers corporately to the people of Israel.'
    reason: lexical_alternative
translation:
  language: ko
  text: 홀로페르네스는 자기 종들[a]에게 명령하여, 자기 천막에 서 있던 그들에게 아키오르를 붙잡아 베툴루아로 데려가고, 이스라엘 자손[b]의 손에 넘기게 했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문의 δοῦλοι는 예속된 사람들을 가리킵니다. 영어 POB는 ‘slaves’를 따르지만, 한국어 본문에서는 문맥의 종속성을 살리면서 자연스러운 ‘종들’로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘이스라엘 자손’은 그리스어의 문자적 표현을 살린 말로, 이곳에서는 이스라엘 백성을 집합적으로 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῖς δούλοις
  english_pob_choice: his slaves
  chosen_korean: 자기 종들
  alternatives_korean:
  - 자기 노예들
  - 자기 하인들
  lexicon: LSJ
  rationale: δοῦλοι는 기본적으로 예속된 사람을 가리키지만, 한국어에서는 이 문맥에서 현대 독자가 이해할 수 있는 자연스러움과 원문의 종속성을 함께 살려 ‘종들’로 옮겼습니다. ‘노예들’은 사회적 예속을 더 강하게 드러내지만 한국어 본문 흐름이 지나치게 거칠어질 수 있어 본문에서는 완화했습니다.
- source_word: παρεστηκότες
  english_pob_choice: standing by
  chosen_korean: 서 있던
  alternatives_korean:
  - 대기하고 있던
  - 곁에 서 있던
  lexicon: LSJ
  rationale: 완료분사 παρεστηκότες는 그 자리에 대기하며 서 있는 상태를 뜻하므로, 간결하게 ‘서 있던’으로 옮겨 명령을 받는 대기 상태를 살렸습니다.
- source_word: συλλαβεῖν
  english_pob_choice: to seize
  chosen_korean: 붙잡아
  alternatives_korean:
  - 체포하여
  - 사로잡아
  lexicon: LSJ
  rationale: 이 동사는 강제로 붙잡는 행위를 나타내므로, 법적 절차를 암시하는 ‘체포하다’보다 직접적인 ‘붙잡다’를 택했습니다.
- source_word: ἀποκαταστῆσαι αὐτὸν εἰς Βετυλουὰ
  english_pob_choice: take him back to Bethyloua
  chosen_korean: 베툴루아로 데려가고
  alternatives_korean:
  - 베툴루아로 다시 데려가고
  - 베툴루아에 돌려보내고
  lexicon: LSJ
  rationale: 문맥상 ‘복구하다’가 아니라 그를 베툴루아로 다시 이동시키는 의미이므로, 자연스러운 서술형 한국어로 ‘데려가고’라고 옮겼습니다.
- source_word: υἱῶν Ἰσραήλ
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘의 아들들
  - 이스라엘 사람들
  lexicon: LSJ
  rationale: 원문은 문자적으로 ‘이스라엘의 아들들’이지만, 한국어 성서어법에서 집단 전체를 가리키는 표현으로 ‘이스라엘 자손’이 가장 직접적이고 익숙합니다. 남성형 어휘를 과도하게 중립화하지 않으면서도 한국어 가독성을 유지합니다.
theological_decisions:
- issue: δοῦλοι의 사회적 강도
  chosen_reading: ‘종들’로 번역하되, 본문의 예속 관계를 흐리지 않도록 보존했습니다.
  alternative_readings:
  - ‘노예들’로 번역해 예속성을 더 강하게 드러내는 방식
  - ‘하인들’로 완화하는 방식
  rationale: 이 장면은 전쟁 상황에서 홀로페르네스가 자기 휘하 인원에게 명령하는 맥락이므로 예속성이 분명합니다. 그러나 한국어 본문에서 지나치게 현대적·폭력적으로 들릴 수 있는 ‘노예들’ 대신, 원문의 종속성을 유지하면서도 문장 흐름이 자연스러운 ‘종들’을 택했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms table for δοῦλος; translation philosophy'
