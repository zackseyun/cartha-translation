review_pass:
  verdict: revise
  source_fidelity: 그리스어의 명령 구조와 주요 동작(붙잡다, 베툴루아로 돌려보내다, 이스라엘 자손의 손에 넘기다)은 대체로 반영되었습니다. 그러나 δοῦλοι는 이 군사·가신 관계에서 예속된 사람들을 뜻하므로 ‘종들’보다 ‘노예들’이 원문의 사회적 강도를 더 정확히 보존합니다. 또한 ἀποκαταστῆσαι의 ‘되돌려 보내다’라는 방향성을 ‘데려가고’만으로는 충분히 드러내지 못합니다.
  naturalness: 현 번역은 ‘자기 종들에게 명령하여, 자기 천막에 서 있던 그들에게’에서 동일한 대상을 반복하여 수식 관계가 어색합니다. 관계절을 ‘자기 천막 안에 서 있던 자기 노예들’에 직접 붙이고, 명령 내용을 ‘…하라고 명령했습니다’로 처리하면 현대 표준 한국어 합쇼체로 자연스럽습니다.
  terminology: ‘홀로페르네스’, ‘아키오르’, ‘베툴루아’, ‘이스라엘 자손’은 일관되고 적절합니다. ‘이스라엘 자손’은 υἱῶν Ἰσραήλ의 문자적·집합적 용법을 보존합니다. δοῦλοι는 완화하지 않고 ‘노예들’로 옮기는 것이 영어 POB 감사 기록 및 원문의 의미 범위에 부합합니다.
  issues:
  - severity: medium
    issue: δοῦλοι를 ‘종들’로 완화함
    rationale: δοῦλοι는 기본적으로 노예, 곧 예속된 사람들을 가리킵니다. 이 문맥에서 ‘종들’은 한국어에서 가신·시종 또는 종교적 용례로도 넓게 들릴 수 있어 예속의 사회적 현실을 약화합니다.
  - severity: medium
    issue: ‘명령하여 … 그들에게’의 중복되고 어색한 수식
    rationale: ‘자기 종들에게’와 ‘그들에게’가 같은 대상을 중복 지시하며, ‘자기 천막에 서 있던’이 문장 안에서 불필요하게 분리됩니다.
  - severity: low
    issue: ἀποκαταστῆσαι의 복귀 의미가 약함
    rationale: ‘데려가고’는 이동만 나타냅니다. 문맥상 아키오르를 베툴루아로 되돌려 보내는 행위를 나타내므로 ‘돌려보내어’가 더 충실합니다.
  revised_text: 홀로페르네스는 자기 천막 안에 서 있던 자기 노예들에게 아키오르를 붙잡아 베툴루아로 돌려보내어 이스라엘 자손의 손에 넘기라고 명령했습니다.
