  lexicon: LSJ
  rationale: 두 표현이 함께 가리키는 하강·하방 이동을 한국어에서는 자연스럽게 ‘산 아래로 내려간 뒤에’로 묶어, 행위의 순서를 살리면서도 과도하게 직역하지 않았습니다.
