  language: ko
  text: 그리고 그들은 산 아래로 내려간 뒤에 아키오르를 묶고, 그를 산의 뿌리 아래에 던져 둔 채로 남겨 두었으며, 자기들의 주인에게로 떠나갔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
