review_pass:
  verdict: revise
  source_fidelity: ὑπὸ τὴν ῥίζαν τοῦ ὄρους is a topographical idiom meaning the mountain’s base or foot; ‘산의 뿌리 아래’ is overly literal and can suggest a location beneath a literal root. The perfect passive ἐρριμμένον is best represented as Achior being left in a thrown-down condition, without unnecessarily recasting it as a separate active action by the soldiers.
  naturalness: ‘던져 둔 채로 남겨 두었으며’ is redundant and awkward in modern Korean. ‘던져진 채로 남겨 두었으며’ is natural, preserves the resultant state, and maintains formal-polite narrative style.
  terminology: ‘아키오르’ is appropriate. ‘그들의 주인’ adequately renders the human κύριος in this context; it is not capitalized or phrased as a divine title.
  issues:
  - severity: medium
    issue: ‘산의 뿌리 아래에’ is an unnatural overly literal rendering of the topographical idiom.
    rationale: In this context ῥίζα refers to the base/foot of the mountain. ‘산기슭에’ gives the intended location naturally and accurately.
  - severity: medium
    issue: ‘던져 둔 채로 남겨 두었으며’ redundantly expresses leaving and shifts the passive participle toward an explicit active throwing action.
    rationale: ἐρριμμένον denotes that Achior was in a thrown-down state when left. ‘던져진 채로 남겨 두었으며’ retains that state and reads idiomatically.
  - severity: low
    issue: The footnote’s quoted alternative, ‘내던져’, is grammatically incomplete and its anchor is placed at the end of the verse rather than at the relevant expression.
    rationale: The alternative should modify Achior’s state (‘내던져진 채로’), and the marker should immediately follow ‘던져진 채로’.
  revised_text: 그리고 그들은 산 아래로 내려가서 아키오르를 묶고, 그를 산기슭에 던져진 채로[a] 남겨 두었으며, 그들의 주인에게로 떠나갔습니다.
  revised_footnotes:
  - marker: a
    text: 또는 ‘내던져진 채로’로 옮길 수 있습니다. 그리스어 분사는 아키오르가 이미 던져진 상태로 남겨졌음을 나타냅니다.
    reason: lexical_alternative
  revision_rationale: 지형 관용구를 자연스러운 한국어로 바로잡고, 완료 수동 분사가 나타내는 결과 상태를 ‘던져진 채로’로 보존했습니다. 또한 각주 표현과 표지를 해당 어구에 맞게 정정했습니다.
