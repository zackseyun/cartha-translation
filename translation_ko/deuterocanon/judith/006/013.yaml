  text: And after going down below the mountain[a], they bound Achior and left him lying at the foot of the mountain, and they went away to their lord.
  footnotes:
  - marker: a
    text: Or 'cast down.' The Greek participle emphasizes that Achior was left in the condition of having been thrown down.
