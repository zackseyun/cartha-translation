  lexicon: LSJ
  rationale: 여기서 κύριος는 신적 칭호가 아니라 인간 상관을 가리키므로, 한국어에서는 관계를 분명히 하는 ‘주인’으로 옮겨 군사적 종속 관계를 드러냈습니다.
theological_decisions:
