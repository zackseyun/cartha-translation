    text: 또는 ‘내던져’로 옮길 수 있습니다. 그리스어 분사는 아키오르가 ‘던져진 상태’로 남겨졌음을 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑποδύσαντες / ὑποκάτω τοῦ ὄρους
  english_pob_choice: after going down below the mountain
  chosen_korean: 산 아래로 내려간 뒤에
