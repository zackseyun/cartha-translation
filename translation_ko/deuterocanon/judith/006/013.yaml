  lexicon: LSJ
  rationale: 완료·수동 분사로서 ‘이미 던져진 상태’를 나타내므로, 단순한 위치 묘사보다 ‘던져 둔 채로 남겨 두었으며’가 행위의 폭력성과 지속된 상태를 함께 드러냅니다.
- source_word: ὑπὸ τὴν ῥίζαν τοῦ ὄρους
  english_pob_choice: at the foot of the mountain
  chosen_korean: 산의 뿌리 아래에
  alternatives_korean:
  - 산기슭에
  - 산 아래에
  lexicon: LSJ
  rationale: ῥίζα를 관용적 지형 표현인 ‘산기슭’으로만 풀면 원문의 이미지가 약해지므로, 직역성을 살린 ‘산의 뿌리 아래에’를 채택했습니다.
- source_word: πρὸς τὸν κύριον αὐτῶν
