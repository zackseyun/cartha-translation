  lexicon: LSJ
  rationale: δέω의 구속 의미를 살리되, 한국어 서술 흐름에서는 ‘묶고’가 가장 간결하고 직접적입니다.
- source_word: ἐρριμμένον
  english_pob_choice: thrown down
  chosen_korean: 던져 둔 채로 남겨 두었으며
