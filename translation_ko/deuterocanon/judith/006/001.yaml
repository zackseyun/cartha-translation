  text: 'And when the uproar of the men around the council had ceased[a], Holofernes, commander-in-chief of the army of Asshur, said to Achior in the presence of all the assembly of foreigners:'
  footnotes:
  - marker: a
    text: Or 'Assyria.' The Greek has the proper name Asshour, which may be rendered as the personal/ethnic name 'Asshur' or as the kingdom name 'Assyria.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 군중의 소란이 공의회 주변의 남자들 사이에서 그쳤을 때, 아시리아 군대의 최고사령관 홀로페르네스가 모든 이방인 무리 앞에서 아키오르에게 말했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 아시리아라는 왕국명 대신, 그리스어 본문은 고유명사 형태 Ἀσσοὺρ을 사용합니다. 이는 개인/민족명 ‘아슈르’로도, 왕국명 ‘아시리아’로도 옮길 수 있습니다.
    reason: lexical_alternative
