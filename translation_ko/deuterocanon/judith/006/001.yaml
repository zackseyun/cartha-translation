  lexicon: BDAG/LSJ
  rationale: ἐναντίον은 공개된 자리라는 뜻이 강하므로 '앞에서'로, δήμος ἀλλοφύλων은 특정 제도 명칭보다 공개적으로 모인 이방인 집단이라는 점을 살려 '이방인 무리'로 옮겼습니다.
