  lexicon: LSJ/BDAG
  rationale: ἀρχιστράτηγος는 단순한 장군보다 상위 지휘권을 가리키므로 '최고사령관'으로 옮기고, δυνάμεως는 군사 문맥상 '군대'로 풀었습니다. Ἀσσοὺρ은 영어 POB의 각주 취지를 따라 지명화된 '아시리아'로 옮길 수도 있지만, 본문 가독성을 위해 왕국명을 택했습니다.
- source_word: ἐναντίον παντὸς τοῦ δήμου ἀλλοφύλων
