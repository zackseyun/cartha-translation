translation:
  language: ko
  text: 그리고 공의회 주위에 있던 사람들의 소란이 그쳤을 때, 아슈르 군대의 최고 사령관 홀로페르네스가 모든 이방인의 회중 앞에서 아키오르에게 말했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 본문은 고유명사 형태 Ἀσσοὺρ을 사용합니다. 이는 개인명 또는 민족명인 ‘아슈르’로 옮길 수도 있고, 왕국명인 ‘아시리아’로 옮길 수도 있습니다.
    reason: lexical_alternative
