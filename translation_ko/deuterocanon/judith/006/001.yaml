  - 아슈르 군대의 총사령관
  lexicon: LSJ/BDAG
  rationale: ἀρχιστράτηγος는 단순한 장군보다 상위 지휘권을 가리키므로 '최고사령관'으로 옮기고, δυνάμεως는 군사 문맥상 '군대'로 풀었습니다. Ἀσσοὺρ은 영어 POB의 각주 취지를 따라 지명화된 '아시리아'로 옮길 수도 있지만, 본문 가독성을 위해 왕국명을 택했습니다.
- source_word: ἐναντίον παντὸς τοῦ δήμου ἀλλοφύλων
  english_pob_choice: in the presence of all the assembly of foreigners
  chosen_korean: 모든 이방인 무리 앞에서
  alternatives_korean:
  - 모든 외국인들의 회중 앞에서
  - 모든 이방 민족의 모임 앞에서
  lexicon: BDAG/LSJ
  rationale: ἐναντίον은 공개된 자리라는 뜻이 강하므로 '앞에서'로, δήμος ἀλλοφύλων은 특정 제도 명칭보다 공개적으로 모인 이방인 집단이라는 점을 살려 '이방인 무리'로 옮겼습니다.
