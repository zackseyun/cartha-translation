  text: καὶ εἶπερ ἐλπίζεις τῇ καρδίᾳ σου ὅτι οὐ λημφθήσονται, μὴ συμπεσέτω σου τὸ πρόσωπον. ἐλά- λησα, καὶ οὐδὲν διαπεσεῖται τῶν ῥημάτων μου.
