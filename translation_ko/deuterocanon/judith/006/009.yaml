base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/006/009.yaml
  text: And if you hope in your heart that they will not be taken[a], do not let your face fall. I have spoken[b], and none of my words will fail.
  footnotes:
  - marker: a
    text: Or 'they will not be captured.' The Greek passive can naturally carry a military sense here.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'do not let your face fall,' an idiom for becoming dejected or downcast.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 만일 그들이 붙잡히지 않으리라고 당신 마음에 기대하고 있다면, 당신의 얼굴이 떨어지지 않게 하십시오. 내가 말했습니다. 그리고 내 말 가운데 아무것도 빗나가지 않을 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들이 사로잡히지 않으리라고’. 그리스어 수동태는 여기서 군사적으로 ‘붙잡히다/사로잡히다’의 뜻을 자연스럽게 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘당신의 얼굴이 떨어지지 않게 하십시오’입니다. 이는 낙담하거나 풀이 죽는 것을 가리키는 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπερ
  english_pob_choice: And if
  chosen_korean: 그리고 만일
  alternatives_korean:
  - 만일
  - 그리고 만약
  lexicon: LSJ
  rationale: 앞선 말과 이어지는 조건문으로 이해하고, 그 약한 강조를 한국어의 ‘그리고 만일’로 자연스럽게 살렸습니다.
- source_word: οὐ λημφθήσονται
  english_pob_choice: they will not be taken
  chosen_korean: 그들이 붙잡히지 않으리라고
  alternatives_korean:
  - 그들이 잡히지 않으리라고
  - 그들이 사로잡히지 않으리라고
  lexicon: BDAG
  rationale: 군사적 문맥에서 ‘taken’은 붙잡히다/사로잡히다의 뜻이 가능하므로, 더 직설적인 ‘붙잡히다’를 기본으로 두었습니다.
- source_word: μὴ συμπεσέτω σου τὸ πρόσωπον
  english_pob_choice: do not let your face fall
  chosen_korean: 당신의 얼굴이 떨어지지 않게 하십시오
  alternatives_korean:
  - 낙담하지 마십시오
  - 얼굴을 떨구지 마십시오
  lexicon: LSJ
  rationale: 몸짓의 관용구를 유지해 ‘얼굴이 떨어지다’로 옮기되, 현대 한국어에서 이해 가능한 형태로 다듬었습니다.
- source_word: οὐδὲν διαπεσεῖται
  english_pob_choice: none ... will fail
  chosen_korean: 아무것도 빗나가지 않을 것입니다
  alternatives_korean:
  - 아무것도 실패하지 않을 것입니다
  - 아무것도 어그러지지 않을 것입니다
  lexicon: LSJ
  rationale: 말씀이 성취되지 못함이 아니라 ‘빗나감’의 뉘앙스를 살려, 선언된 말의 확실성을 드러냈습니다.
theological_decisions:
- issue: 신뢰 선언 뒤의 권위 있는 보증
  chosen_reading: 내가 말했습니다. 그리고 내 말 가운데 아무것도 빗나가지 않을 것입니다.
  alternative_readings:
  - 내가 말하였으니 내 말은 결코 실패하지 않을 것입니다
  - 내가 말했으니 아무 말도 어긋나지 않을 것입니다
  rationale: 화자의 선언적 권위를 강조하는 구조를 유지하되, 종교적 관용어보다 원문의 확언적 힘이 드러나도록 옮겼습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 6
