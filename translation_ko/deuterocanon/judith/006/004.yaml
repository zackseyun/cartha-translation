base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/006/004.yaml
  text: For we will burn them up where they are[a], and their borders will be drenched with their blood, and their plains will be filled with their dead. The trace of their feet will not stand before us, but they will utterly perish, says King Nebuchadnezzar, lord of all the earth. For he said[b], ‘The words of his mouth will not prove empty.’
  footnotes:
  - marker: a
    text: Or, more literally, 'their borders will be made drunk with their blood.' The Greek uses a vivid metaphor of intoxication for bloodshed.
    reason: lexical_alternative
  - marker: b
    text: Or, 'Not even the trace of their feet will stand before us,' expressing that none of them will remain or withstand the attack.
    reason: lexical_alternative
translation:
  language: ko
  text: 우리는 그들을 그곳에서 불살라 버릴 것이며, 그들의 경계는 그들의 피에 취하고 그들의 평지는 그들의 죽은 자들로 가득 찰 것입니다. 그들의 발자취조차 우리 앞에 남아 있지 못할 것이나, 그들은 완전히 멸망할 것입니다. 이는 온 땅의 주인인 느부갓네살 왕이 말합니다. 그는 이렇게 말했습니다. 「그의 입의 말들은 헛되지 않을 것입니다.」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그들의 피에 취하게 될 것입니다’입니다. 원문은 땅과 경계를 피로 ‘술에 취한 것처럼’ 만들겠다는 강한 비유를 사용합니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그들의 발자취가 우리 앞에 서지 못할 것입니다’입니다. 곧 그들 가운데 아무도 남거나 버티지 못한다는 뜻을 드러냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατακαύσομεν
  english_pob_choice: we will burn them up
  chosen_korean: 불살라 버릴 것입니다
  alternatives_korean:
  - 불태울 것입니다
  - 완전히 불살라 버릴 것입니다
  lexicon: LSJ
  rationale: 미래 능동의 파괴적 힘을 살리면서도 한국어에서 자연스럽고 강한 표현으로 옮겼습니다.
- source_word: μεθυσθήσεται ἐν τῷ αἵματι αὐτῶν
  english_pob_choice: will be drenched with their blood
  chosen_korean: 그들의 피에 취할 것입니다
  alternatives_korean:
  - 그들의 피로 흠뻑 젖을 것입니다
  - 그들의 피에 만취될 것입니다
  lexicon: LSJ
  rationale: 원문의 ‘취하다’ 이미지를 유지해 피로 인한 유혈의 수사적 충격을 살렸습니다. 다만 한국어 문맥상 자연성을 위해 보충어 없이 본문에 그대로 반영했습니다.
- source_word: τὰ ὅρια / τὰ πεδία
  english_pob_choice: their borders / their plains
  chosen_korean: 그들의 경계 / 그들의 평지
  alternatives_korean:
  - 그들의 변경 / 그들의 들판
  - 그들의 국경 / 그들의 평야
  lexicon: LSJ
  rationale: ὅρια와 πεδία의 지리적 대비를 살려, 군사적 파괴 대상의 범위를 구체적으로 드러내는 표현으로 옮겼습니다.
- source_word: οὐκ ἀντιστήσεται τὸ ἴχνος τῶν ποδῶν αὐτῶν κατὰ πρόσωπον ἡμῶν
  english_pob_choice: The trace of their feet will not stand before us
  chosen_korean: 그들의 발자취조차 우리 앞에 남아 있지 못할 것입니다
  alternatives_korean:
  - 그들의 발자취가 우리 앞에 맞서 서지 못할 것입니다
  - 그들의 발자국 하나도 우리 앞에 남지 못할 것입니다
  lexicon: LSJ
  rationale: ‘발자취’는 원문의 이미지인 ‘발의 흔적’을 보존하면서, ‘남아 있지 못하다’로 존재/대항의 뉘앙스를 함께 살렸습니다.
- source_word: κύριος πάσης τῆς γῆς
  english_pob_choice: lord of all the earth
  chosen_korean: 온 땅의 주인
  alternatives_korean:
  - 온 땅의 주
  - 온 세상의 지배자
  lexicon: LSJ
  rationale: 여기서는 느부갓네살의 왕권 자칭이므로 신적 칭호가 아니라 인간 군주의 과장된 주장으로 읽히게 ‘주인’으로 옮겼습니다.
- source_word: οὐ ματαιωθήσεται τὰ ῥήματα τῶν λόγων αὐτοῦ
  english_pob_choice: The words of his mouth will not prove empty
  chosen_korean: 그의 입의 말들은 헛되지 않을 것입니다
  alternatives_korean:
  - 그의 입에서 나온 말들은 공허하지 않을 것입니다
  - 그의 말들은 무효가 되지 않을 것입니다
  lexicon: LSJ
  rationale: 겹말 구조를 한국어에서 자연스럽게 풀되, ‘헛되다’로 ματαιόω 계열의 공허함을 담았습니다.
theological_decisions:
- issue: 느부갓네살의 자칭 ‘κύριος’의 처리
  chosen_reading: 인간 왕의 과장된 통치 주장으로 읽히게 ‘온 땅의 주인’으로 번역했습니다.
  alternative_readings:
  - 온 땅의 주
  - 온 땅의 군주
  rationale: 문맥상 예배적 칭호가 아니라 제국적 지배를 과시하는 말이므로, 독자가 신적 ‘주’와 혼동하지 않도록 처리했습니다.
