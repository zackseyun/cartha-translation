base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/006/004.yaml
  text: For we will burn them up where they are[a], and their borders will be drenched with their blood, and their plains will be filled with their dead. The trace of their feet will not stand before us, but they will utterly perish, says King Nebuchadnezzar, lord of all the earth. For he said[b], ‘The words of his mouth will not prove empty.’
  footnotes:
  - marker: a
    text: Or, more literally, 'their borders will be made drunk with their blood.' The Greek uses a vivid metaphor of intoxication for bloodshed.
    reason: lexical_alternative
  - marker: b
    text: Or, 'Not even the trace of their feet will stand before us,' expressing that none of them will remain or withstand the attack.
    reason: lexical_alternative
translation:
  language: ko
  text: “우리는 그들을 그들이 있는 곳에서 불살라 버릴 것이며, 그들의 경계는 그들의 피에 취하게 될 것이고[a] 그들의 평지는 그들의 죽은 이들로 가득 찰 것입니다. 그들의 발의 흔적조차 우리 앞에 서지 못할 것이나[b], 그들은 완전히 멸망할 것입니다.” 온 땅의 주인인 느부갓네살 왕이 이렇게 말합니다. 그는 말했습니다. “그가 입으로 한 말들은 헛되지 않을 것입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그들의 피에 취하게 될 것입니다’입니다. 원문은 경계나 땅이 피로 술에 취한 듯하게 된다는 강한 비유를 사용합니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그들의 발의 흔적이 우리 앞에 서지 못할 것입니다’입니다. 이는 그들 가운데 아무도 남거나 공격에 맞서지 못한다는 뜻을 드러내는 표현입니다.
    reason: lexical_alternative
