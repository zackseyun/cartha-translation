  text: Then the sons of Israel came down from their city and confronted him[a]; and after untying him, they brought him to Bethyloua and brought him before the rulers of their city[c][b],
  footnotes:
  - marker: a
    text: Or 'the Israelites.' The Greek reads 'the sons of Israel,' a traditional biblical designation.
    reason: lexical_alternative
  - marker: b
    text: Or 'stood by him' / 'approached him.' The Greek verb can carry a range of senses depending on context.
    reason: lexical_alternative
  - marker: c
    text: That is, they brought him before the city authorities; the verb does not mean they appointed him as a ruler.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 이스라엘의 아들들[a]이 자기들의 도시에서 내려와 그에게 다가갔고[b], 그를 풀어 준 뒤 베툴루아로 데려가 자기들의 도시의 지도자들 앞에 세웠습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이스라엘 사람들’입니다. 그리스어는 전통적인 성서 표현인 ‘이스라엘의 아들들’이라고 되어 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그 곁에 서고’ / ‘그를 마주하고’입니다. 이 동사는 문맥에 따라 여러 의미를 가질 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 즉, 그를 도시의 지도자들 앞에 데려간 것이지, 그를 지도자로 임명한 것이 아닙니다.
    reason: lexical_alternative
