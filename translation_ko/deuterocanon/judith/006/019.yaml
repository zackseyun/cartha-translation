  text: Lord[a], God of heaven, look upon their arrogance, and have mercy on the humiliation of our people, and look upon the face of those sanctified to you on this day.
  footnotes:
  - marker: a
    text: Or 'those consecrated to you' or 'your holy ones.' The Greek says 'those sanctified to you.'
    reason: lexical_alternative
translation:
  language: ko
  text: 주님, 하늘의 하나님이시여, 그들의 교만을 굽어보시고, 우리 민족의 굴욕을 불쌍히 여기시며, 이 날에 주님께 성별된 이들의 얼굴을 굽어보소서.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주님께 구별된 이들’이나 ‘주님의 거룩한 이들’. 그리스어는 ‘주님께 성별된 이들’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Κύριε
  english_pob_choice: Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주
  - 주인이시여
  lexicon: SBLGNT/LSJ
  rationale: 하나님께 드리는 호격으로서 ‘Lord’에 해당하는 표준적 한국어 경어는 ‘주님’이며, 기도문 어조를 자연스럽게 살립니다.
- source_word: ὁ θεὸς τοῦ οὐρανοῦ
  english_pob_choice: God of heaven
  chosen_korean: 하늘의 하나님
  alternatives_korean:
  - 하늘의 하나님이시여
  - 하늘의 하나님
  - 하늘에 계신 하나님
  lexicon: LSJ
  rationale: 직역 구조를 유지하되 한국어에서 가장 자연스러운 속격 표현으로 옮겨, 하늘의 하나님이라는 칭호를 분명히 드러냅니다.
- source_word: κάτιδε
  english_pob_choice: look upon
  chosen_korean: 굽어보시고
  alternatives_korean:
  - 살펴보시고
  - 바라보시고
  - look upon의 직역인 바라보소서
  lexicon: LSJ
  rationale: 기도에서 하나님께 간절히 ‘살펴 주심’을 청하는 동작을 나타내며, 단순한 시각 동사가 아니라 응답을 기대하는 청원 뉘앙스를 살립니다.
- source_word: τὰς ὑπερηφανίας αὐτῶν
  english_pob_choice: their arrogance
  chosen_korean: 그들의 교만
  alternatives_korean:
  - 그들의 오만
  - 그들의 거만함
  - 그들의 교만 행위
  lexicon: LSJ
  rationale: 복수형이지만 한국어에서는 집합적으로 자연스럽게 ‘교만’으로 옮기는 것이 적절하며, 도덕적 비난의 핵심을 분명히 전달합니다.
- source_word: τὴν ταπείνωσιν τοῦ γένους ἡμῶν
  english_pob_choice: the humiliation of our people
  chosen_korean: 우리 민족의 굴욕
  alternatives_korean:
  - 우리 사람들의 비천함
  - 우리 백성의 낮아짐
  - 우리 민족의 수치
  lexicon: LSJ
  rationale: ταπείνωσις는 ‘낮아짐’과 ‘굴욕’의 범위를 가지며, 여기서는 원수에게 짓밟히는 상황의 수치와 비하를 함께 살리는 ‘굴욕’이 가장 적합합니다.
- source_word: τῶν ἡγιασμένων σοι
  english_pob_choice: those sanctified to you
  chosen_korean: 주님께 성별된 이들
  alternatives_korean:
  - 주님께 거룩하게 된 이들
  - 주님께 봉헌된 이들
  - 주님의 거룩한 이들
  lexicon: LSJ
  rationale: ἡγιασμένος는 ‘거룩하게 하다/구별하다’의 완료 수동 분사이므로, 결과 상태와 소속을 함께 드러내는 ‘성별된’이 본문에 가장 가깝습니다.
theological_decisions:
- issue: ἡγιασμένοι σοι의 신학적 뉘앙스
  chosen_reading: ‘성별된 이들’로 번역해 구별됨과 하나님께 속함을 함께 보존했습니다.
  alternative_readings:
  - ‘성결된 이들’
  - ‘봉헌된 이들’
  - ‘주님의 거룩한 이들’
  rationale: 본문은 단순한 도덕적 ‘거룩함’만이 아니라 하나님을 향해 따로 구별된 신분을 말하므로, 교회 전통어보다 원문 의미를 더 직접적으로 드러내는 표현을 택했습니다.
  doctrine_reference: 'DOCTRINE.md: Preserve theological tension rather than resolve it; consistency of key terms, or documented exception.'
