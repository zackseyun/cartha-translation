  text: And his slaves seized him and led him outside the camp into the plain, and they went up from the midst of the plain into the hill country, and they came to the springs that were below Bethulia.
translation:
  language: ko
  text: 그의 노예들이 그를 붙잡아 진영 밖 평지로 데리고 나갔으며, 평지 한가운데에서 산지로 올라갔고, 베툴리아 아래에 있는 샘들에 이르렀습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δοῦλοι
  english_pob_choice: slaves
  chosen_korean: 종들
  alternatives_korean:
  - 노예들
  - 하인들
  - 종
  lexicon: BDAG
  rationale: 여기서 δοῦλοι는 주인의 권위 아래 있는 종속 신분을 가리키므로, 영어 POB의 'slaves'가 드러내는 신분성을 살리되 한국어에서는 서술 흐름에 자연스러운 '종들'로 옮겼습니다.
- source_word: συνέλαβον
  english_pob_choice: seized
  chosen_korean: 붙잡아
  alternatives_korean:
  - 사로잡아
  - 잡아
  - 손을 대어
  lexicon: LSJ
  rationale: 동사는 물리적으로 붙드는 동작을 뜻하므로, 법적 뉘앙스를 덧씌우지 않는 '붙잡아'가 가장 간결하고 직접적입니다.
- source_word: ὀρεινήν
  english_pob_choice: hill country
  chosen_korean: 산지
  alternatives_korean:
  - 산악 지대
  - 고원지대
  - 산지 지방
  lexicon: LSJ
  rationale: 평지와 대비되는 지형적 이동을 살리기 위해 '산지'를 사용했습니다. 한국어에서 간결하면서도 지리적 구획을 잘 드러냅니다.
- source_word: πηγὰς ... ὑποκάτω Βετυλουά
  english_pob_choice: the springs that were below Bethulia
  chosen_korean: 베툴리아 아래에 있는 샘들
  alternatives_korean:
  - 베툴리아 아래의 샘들
  - 베툴리아 밑에 있는 샘들
  lexicon: LSJ
  rationale: πηγαί는 자연수원을 가리키므로 '샘들'이 적절합니다. ὑποκάτω는 위치 관계를 단순히 '아래에 있는'으로 살려 지형 정보를 보존했습니다.
theological_decisions:
- issue: δοῦλοι의 신분 표시
  chosen_reading: 관계상 '종들'로 번역해 종속성과 소유 관계를 드러냈습니다.
  alternative_readings:
  - 하인들
  - 시종들
  rationale: 이 문맥의 δοῦλοι는 단순한 예의상 시종이 아니라 주인에게 예속된 수행자들이므로, 신분적 긴장을 지우지 않는 표현이 필요했습니다.
  doctrine_reference: 사회적 신분/소유 관계를 드러내는 본문 어휘 처리 원칙
