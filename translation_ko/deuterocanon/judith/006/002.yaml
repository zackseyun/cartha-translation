base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/006/002.yaml
  text: And who are you[a], Achior, and the hirelings of Ephraim among all the sons of Moab, that you have prophesied among us as you did today, and said that one should not make war against the house of Israel because their God will defend them? And who is God except Nebuchadnezzar? He himself will send his force and destroy them from the face of the earth[c][b], and their God will not rescue them.
  footnotes:
  - marker: a
    text: Or 'mercenaries of Ephraim.' The Greek term denotes men serving for pay and may carry a contemptuous tone.
    reason: lexical_alternative
  - marker: b
    text: Or 'the people of Israel.' The Greek says 'the race/stock of Israel,' emphasizing ethnic lineage.
    reason: lexical_alternative
  - marker: c
    text: The speaker's 'who is god except Nebuchadnezzar?' is a boastful claim, not the narrator's endorsement.
    reason: cultural_note
translation:
  language: ko
  text: 아히오르와, 모압의 모든 아들들 가운데에 있는 에브라임의 품꾼들은 누구이기에, 오늘과 같이 우리 가운데서 예언하여 이스라엘 집에 대하여 싸우지 말라, 그들의 하나님이 그들을 변호하실 것이라고 말하였느냐? 또한 느부갓네살 외에 누가 하나님이냐? 그가 스스로 자기 군세를 보내어 그들을 땅의 얼굴에서 멸망시키겠고, 그들의 하나님은 그들을 구해 내지 못하리라.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘에브라임의 용병들’. 이 그리스어는 보수를 받고 섬기는 사람들을 가리키며, 경멸적 뉘앙스를 띨 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘이스라엘 백성’. 그리스어는 ‘이스라엘의 씨/혈통’을 가리켜 혈통적 함의를 강조합니다.
    reason: lexical_alternative
  - marker: c
    text: ‘누가 하나님이냐?’라는 말은 서술자의 신앙 고백이 아니라 발화자의 자만에 찬 주장입니다.
    reason: cultural_note
lexical_decisions:
- source_word: μισθωτοὶ
  english_pob_choice: hirelings
  chosen_korean: 품꾼들
  alternatives_korean:
  - 용병들
  - 고용인들
  lexicon: LSJ
  rationale: 보수 받고 섬기는 사람이라는 뜻을 살리면서도, 조롱조의 뉘앙스를 한국어에서 자연스럽게 드러내기 위해 ‘품꾼들’을 택했습니다.
- source_word: ἐπροφήτευσας
  english_pob_choice: have prophesied
  chosen_korean: 예언하여
  alternatives_korean:
  - 예언하였다고
  - 선지자처럼 말하여
  lexicon: LSJ
  rationale: 본문은 적대적 발화이지만 동사는 실제로 ‘예언하다’를 사용하므로, 이를 약화하지 않고 동사형으로 옮겼습니다.
- source_word: τὸ γένος Ἰσραήλ
  english_pob_choice: the race of Israel
  chosen_korean: 이스라엘 집
  alternatives_korean:
  - 이스라엘 족속
  - 이스라엘 민족
  - 이스라엘 백성
  lexicon: LSJ
  rationale: γένος의 혈통·가문·족속 의미를 살리되, 한국어에서 지나치게 직역적인 ‘race’ 대신 관계적·혈연적 함의를 유지하는 ‘집’을 선택했습니다.
- source_word: ὑπερασπιεῖ
  english_pob_choice: will defend
  chosen_korean: 변호하실 것이라고
  alternatives_korean:
  - 지키실 것이라고
  - 보호하실 것이라고
  lexicon: LSJ
  rationale: 전투 맥락의 ‘수호·방어’ 의미를 살리되, 문맥상 ‘그들을 위해 맞서다’의 법정적·대적적 색채도 있어 ‘변호하다’로 옮겼습니다.
- source_word: τὸ κράτος αὐτοῦ
  english_pob_choice: his force
  chosen_korean: 자기 군세
  alternatives_korean:
  - 자기 권세
  - 자기 힘
  - 자기 군대
  lexicon: LSJ
  rationale: 전쟁 맥락에서 κράτος는 추상적 ‘권세’보다 실제 투입되는 무력의 성격이 강하므로, ‘군세’로 구체화했습니다.
theological_decisions:
- issue: ‘누가 하나님이냐’라는 모욕적 자기신격화의 전달
  chosen_reading: 느부갓네살 외에 누가 하나님이냐?
  alternative_readings:
  - 느부갓네살 외에 누가 신이냐?
  - 느부갓네살 외에 누가 하나님이냐?
  rationale: 발화자의 오만한 주장이지 서술자의 신학적 선언이 아니므로, 문맥상 그대로 살리되 별도의 경구나 완곡어법으로 누그러뜨리지 않았습니다.
  doctrine_reference: '번역 원칙: 본문의 신학적 긴장을 유지하고, 화자의 발언을 서술자의 승인으로 오해하지 않게 합니다.'
