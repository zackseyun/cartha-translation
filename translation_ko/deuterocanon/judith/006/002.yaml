  source_fidelity: γένος Ἰσραήλ을 ‘이스라엘 집’으로 옮긴 것은 원문의 혈통·족속 의미를 충분히 반영하지 못합니다. 또한 ὑπερασπιεῖ는 전쟁 맥락에서 ‘변호하다’보다 ‘지키다/보호하다’가 적절합니다. τὸ κράτος αὐτοῦ는 군사적 맥락이 있으나 반드시 군대만을 뜻하지 않으므로 ‘군세’는 가능하되, ‘보내다’와의 결합을 자연스럽게 다듬었습니다. 화자의 느부갓네살 신격화 주장은 유지하되, 한국어에서는 이스라엘의 하나님과 구별하여 ‘신’으로 처리했습니다.
  naturalness: 현 번역의 첫 절은 ‘아히오르와 … 품꾼들은 누구이기에’라는 혼합된 호격·주격 구성이 다소 부자연스럽습니다. ‘아히오르야, 네가 누구이며 … 누구이기에’로 옮기면 원문의 도발적 반문과 복수 대상을 자연스럽게 살릴 수 있습니다. ‘땅의 얼굴에서’는 한국어 관용상 ‘땅 위에서’가 자연스럽습니다.
