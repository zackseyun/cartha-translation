  text: And in answer he reported to them the words of Holofernes’ council[a], and all the words that he had spoken in the midst of the rulers of the sons of Asshur[b], and whatever boastful things Holofernes had spoken against the house of Israel.
  footnotes:
  - marker: a
    text: Or 'the Assyrians.' Greek literally, 'the sons of Asshur.'
    reason: lexical_alternative
  - marker: b
    text: Or 'had boasted' / 'had spoken arrogantly.' The Greek verb denotes proud, boastful speech.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 대답하여 홀로페르네스의 회의의 말과, 앗수르의 지도자들 가운데서 그가 말한 모든 말과, 홀로페르네스가 이스라엘 집을 향하여 자랑스럽게 말한 모든 것을 그들에게 보고하였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘앗수르의 아들들’입니다. 문맥상 지배자/지도자 집단을 가리키는 표현으로 이해할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 이 동사는 단순한 ‘말하다’보다 자만스럽고 과장된 말을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς ἀπήγγειλεν
  english_pob_choice: in answer ... reported
  chosen_korean: 대답하여 ... 보고하였습니다
  alternatives_korean:
  - 대답해 ... 알렸습니다
  - 응답하여 ... 전했습니다
  lexicon: BDAG
  rationale: 응답의 연결과 회보의 성격을 함께 살리기 위해 ‘대답하여’와 ‘보고하였습니다’를 결합했습니다.
- source_word: τὰ ῥήματα τῆς συνεδρείας Ὀλοφέρνου
  english_pob_choice: the words of Holofernes’ council
  chosen_korean: 홀로페르네스의 회의의 말
  alternatives_korean:
  - 홀로페르네스의 회의의 발언
  - 홀로페르네스의 의논의 말
  lexicon: LSJ
  rationale: τῆς συνεδρείας를 단순한 ‘조언’보다 회의·협의의 장으로 보고, 반복되는 ‘말’의 구조를 유지했습니다.
- source_word: υἱῶν Ἀσσούρ
  english_pob_choice: the sons of Asshur
  chosen_korean: 앗수르의 지도자들
  alternatives_korean:
  - 앗수르의 아들들
  - 앗수르인들
  lexicon: LSJ
  rationale: 문맥상 ἀρχόντων과 결합해 ‘앗수르의 지도자들’로 옮겨, 직역의 낯섦을 줄이면서도 원문이 가리키는 집단 표현을 살렸습니다.
- source_word: ἐμεγαλορρημόνησεν
  english_pob_choice: boastful things ... spoken
  chosen_korean: 자랑스럽게 말한
  alternatives_korean:
  - 거만하게 말한
  - 큰소리친
  lexicon: LSJ
  rationale: 이 동사는 자만·허풍의 뉘앙스를 가지므로, 자연스러운 한국어로는 ‘자랑스럽게 말하다’가 그 과장된 자기과시를 가장 무난하게 드러냅니다.
- source_word: εἰς τὸν οἶκον Ἰσραήλ
  english_pob_choice: against the house of Israel
  chosen_korean: 이스라엘 집을 향하여
  alternatives_korean:
  - 이스라엘 집에 대하여
  - 이스라엘 집을 상대로
  lexicon: BDAG
  rationale: 전치사 εἰς의 방향성을 살리되, 적대적 맥락을 한국어에서 지나치게 해석하지 않도록 ‘향하여’로 옮겼습니다.
theological_decisions:
- issue: ἀρχόντων υἱῶν Ἀσσούρ의 집단 표현 처리
  chosen_reading: ‘앗수르의 지도자들’로 번역하여 ἀρχόντων의 지배자/지도자 의미를 드러냈습니다.
  alternative_readings:
  - ‘앗수르의 아들들’
  - ‘앗수르인들’
  rationale: 원문에는 ‘아들들’과 ‘지도자들’이 함께 있어, 단순 민족명보다 지배층을 지칭하는 표현으로 읽히므로 한국어에서는 그 기능을 드러냈습니다.
  doctrine_reference: 'translation philosophy: original-language primacy; source-semantic transparency'
