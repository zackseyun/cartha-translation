  text: And in answer he reported to them the words of Holofernes’ council[a], and all the words that he had spoken in the midst of the rulers of the sons of Asshur[b], and whatever boastful things Holofernes had spoken against the house of Israel.
  footnotes:
  - marker: a
    text: Or 'the Assyrians.' Greek literally, 'the sons of Asshur.'
    reason: lexical_alternative
  - marker: b
    text: Or 'had boasted' / 'had spoken arrogantly.' The Greek verb denotes proud, boastful speech.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 대답하여 홀로페르네스의 회의에서 오간 말들과, 홀로페르네스가 앗수르 자손들의 지도자들[a] 가운데에서 한 모든 말과, 홀로페르네스가 이스라엘 집을 거슬러 큰소리친[b] 모든 말을 그들에게 보고하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘앗수르의 아들들’입니다. ‘앗수르인들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 이 동사는 거만하게 말하거나 허풍을 떨다, 곧 자랑하며 큰소리치다를 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς ἀπήγγειλεν
  english_pob_choice: in answer ... reported
  chosen_korean: 대답하여 ... 보고하였습니다
  alternatives_korean:
