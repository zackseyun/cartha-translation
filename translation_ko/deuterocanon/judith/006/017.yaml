  lexicon: BDAG
  rationale: 응답의 연결과 회보의 성격을 함께 살리기 위해 ‘대답하여’와 ‘보고하였습니다’를 결합했습니다.
- source_word: τὰ ῥήματα τῆς συνεδρείας Ὀλοφέρνου
  english_pob_choice: the words of Holofernes’ council
  chosen_korean: 홀로페르네스의 회의의 말
  alternatives_korean:
  - 홀로페르네스의 회의의 발언
  - 홀로페르네스의 의논의 말
  lexicon: LSJ
  rationale: τῆς συνεδρείας를 단순한 ‘조언’보다 회의·협의의 장으로 보고, 반복되는 ‘말’의 구조를 유지했습니다.
- source_word: υἱῶν Ἀσσούρ
  english_pob_choice: the sons of Asshur
  chosen_korean: 앗수르의 지도자들
  alternatives_korean:
  - 앗수르의 아들들
  - 앗수르인들
  lexicon: LSJ
  rationale: 문맥상 ἀρχόντων과 결합해 ‘앗수르의 지도자들’로 옮겨, 직역의 낯섦을 줄이면서도 원문이 가리키는 집단 표현을 살렸습니다.
- source_word: ἐμεγαλορρημόνησεν
  english_pob_choice: boastful things ... spoken
  chosen_korean: 자랑스럽게 말한
  alternatives_korean:
  - 거만하게 말한
  - 큰소리친
  lexicon: LSJ
  rationale: 이 동사는 자만·허풍의 뉘앙스를 가지므로, 자연스러운 한국어로는 ‘자랑스럽게 말하다’가 그 과장된 자기과시를 가장 무난하게 드러냅니다.
- source_word: εἰς τὸν οἶκον Ἰσραήλ
  english_pob_choice: against the house of Israel
  chosen_korean: 이스라엘 집을 향하여
  alternatives_korean:
  - 이스라엘 집에 대하여
  - 이스라엘 집을 상대로
  lexicon: BDAG
  rationale: 전치사 εἰς의 방향성을 살리되, 적대적 맥락을 한국어에서 지나치게 해석하지 않도록 ‘향하여’로 옮겼습니다.
theological_decisions:
- issue: ἀρχόντων υἱῶν Ἀσσούρ의 집단 표현 처리
  chosen_reading: ‘앗수르의 지도자들’로 번역하여 ἀρχόντων의 지배자/지도자 의미를 드러냈습니다.
  alternative_readings:
