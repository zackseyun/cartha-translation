  - ‘앗수르인들’
  rationale: 원문에는 ‘아들들’과 ‘지도자들’이 함께 있어, 단순 민족명보다 지배층을 지칭하는 표현으로 읽히므로 한국어에서는 그 기능을 드러냈습니다.
  doctrine_reference: 'translation philosophy: original-language primacy; source-semantic transparency'
