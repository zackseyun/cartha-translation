lexical_decisions:
- source_word: οὐκ ἀπολῇ
  english_pob_choice: will not perish
  chosen_korean: 죽지 않을 것입니다
  alternatives_korean:
  - 멸망하지 않을 것입니다
  - 망하지 않을 것입니다
  lexicon: BDAG
  rationale: ἀπόλλυμι의 비능동적 의미를 살려 ‘죽다/죽지 않다’로 옮기면, 단순한 파괴가 아니라 생명 상실과 최종적 패망의 뉘앙스를 자연스럽게 담을 수 있습니다.
- source_word: ἕως οὗ
  english_pob_choice: until
  chosen_korean: 까지는
  alternatives_korean:
  - 때까지
  - 그때까지
  lexicon: BDAG
  rationale: 시간 경계의 의미를 간결하게 살려 한국어에서도 ‘-까지’로 직접 대응시켰습니다.
- source_word: ἐξολεθρευθῇς
  english_pob_choice: you are destroyed
  chosen_korean: 멸망하기
  alternatives_korean:
  - 철저히 멸망하기
  - 완전히 멸절되기
  lexicon: BDAG
  rationale: ἐξολεθρεύω의 강한 파멸/소멸 의미를 ‘멸망’으로 옮기되, 현대 한국어에서 자연스럽고 과도하게 해설적이지 않게 유지했습니다.
- source_word: μετʼ αὐτῶν
  english_pob_choice: with them
  chosen_korean: 너희와 함께
  alternatives_korean:
  - 그들과 함께
  - 그들 가운데
  lexicon: BDAG
  rationale: 문맥상 복수 대상을 가리키므로 ‘너희와 함께’로 옮겨 함께 파멸에 이르는 동반성을 분명히 했습니다.
theological_decisions:
- issue: 파멸의 강도 표현
  chosen_reading: ‘멸망하기’로 옮겨, 단순한 죽음보다 더 강한 공동 파멸의 뜻을 드러냈습니다.
  alternative_readings:
  - ‘완전히 멸망하기’
  - ‘철저히 멸절되기’
  rationale: ἐξολεθρεύω는 단순 사망보다 더 강한 소멸/제거를 나타내므로, 본문이 말하는 심판의 강도를 약화하지 않는 번역이 필요합니다.
  doctrine_reference: 심판과 멸망의 어휘적 강도 유지
