theological_decisions:
- issue: 파멸의 강도 표현
  chosen_reading: ‘멸망하기’로 옮겨, 단순한 죽음보다 더 강한 공동 파멸의 뜻을 드러냈습니다.
  alternative_readings:
  - ‘완전히 멸망하기’
  - ‘철저히 멸절되기’
  rationale: ἐξολεθρεύω는 단순 사망보다 더 강한 소멸/제거를 나타내므로, 본문이 말하는 심판의 강도를 약화하지 않는 번역이 필요합니다.
  doctrine_reference: 심판과 멸망의 어휘적 강도 유지
