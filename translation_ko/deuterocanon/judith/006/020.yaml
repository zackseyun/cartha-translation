  text: 그리고 그들은 아키오르를 격려하고[a] 그를 크게 칭찬했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘격려하고’는 문맥에 따라 ‘위로하고’, ‘권면하고’, 또는 ‘독려하고’로도 이해할 수 있습니다(παρεκάλεσαν).
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεκάλεσαν
  english_pob_choice: encouraged
  chosen_korean: 격려하고
  alternatives_korean:
  - 위로하고
  - 권면하고
  - 간청하고
  lexicon: BDAG
  rationale: παρακαλέω는 문맥에 따라 위로하다, 격려하다, 권면하다, 간청하다까지 넓게 쓰이는데, 여기서는 아키오르의 발언 이후에 그를 지지하는 반응이므로 ‘격려하다’가 가장 자연스럽고 원문의 뉘앙스를 잘 살립니다.
- source_word: Ἀχιὼρ
  english_pob_choice: Achior
  chosen_korean: 아키오르
  alternatives_korean:
  - 아히오르
  - 아키오르
  lexicon: 고유명사 표기 관행
  rationale: 고유명사는 현대 외래어 표기 관행에 따라 음역하고, 한국어 성경 독자에게도 비교적 통용되는 형태인 ‘아키오르’를 택했습니다.
- source_word: ἐπήνεσαν
  english_pob_choice: praised
  chosen_korean: 칭찬했습니다
  alternatives_korean:
  - 찬양했습니다
  - 칭송했습니다
  - 칭찬하였습니다
  lexicon: BDAG
  rationale: ἐπαινέω는 ‘칭찬하다/찬양하다’의 뜻이므로, 대상을 직접 높이는 서술에 맞게 ‘칭찬했습니다’로 옮겼습니다.
- source_word: σφόδρα
  english_pob_choice: greatly
  chosen_korean: 크게
  alternatives_korean:
  - 매우
  - 몹시
  - 대단히
  lexicon: LSJ
  rationale: σφόδρα는 동사를 강하게 강조하는 부사이므로, 한국어에서는 간결하게 ‘크게’로 처리해 칭찬의 강도를 드러냈습니다.
