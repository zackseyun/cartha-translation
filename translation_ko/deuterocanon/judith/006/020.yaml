  lexicon: BDAG
  rationale: παρακαλέω는 문맥에 따라 위로하다, 격려하다, 권면하다, 간청하다까지 넓게 쓰이는데, 여기서는 아키오르의 발언 이후에 그를 지지하는 반응이므로 ‘격려하다’가 가장 자연스럽고 원문의 뉘앙스를 잘 살립니다.
