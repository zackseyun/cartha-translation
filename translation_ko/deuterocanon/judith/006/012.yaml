  text: And when the men of the city saw them on the top of the mountain, they took up their weapons and went out of the city to the top of the mountain; and every man who used a sling held back their ascent and kept throwing stones at them.
  footnotes:
  - marker: a
    text: Greek σφενδονήτης more literally means 'slinger.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 성읍 사람들에 의해 산꼭대기에 있는 것이 보이자, 그들은 자기들의 무기를 들고 성읍 밖으로 나가 산꼭대기로 올라갔습니다. 그리고 그들 가운데 매마다 슬링을 쓰는 사람들은 그들의 올라감을 막고 그들에게 돌을 던지고 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 헬라어 σφενδονήτης는 더 문자적으로는 ‘슬링잡이’를 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ ἄνδρες τῆς πόλεως
  english_pob_choice: the men of the city
  chosen_korean: 성읍 사람들
  alternatives_korean:
  - 성읍의 남자들
  - 도시의 남자들
  lexicon: BDAG
  rationale: ἄνδρες의 문자적 성별 표지를 그대로 살리면 한국어에서 어색하고 장면의 기능이 흐려질 수 있어, 본문이 가리키는 성읍 주민 집단으로 자연스럽게 옮겼습니다.
- source_word: ἀνέλαβον τὰ ὅπλα αὐτῶν
  english_pob_choice: they took up their weapons
  chosen_korean: 자기들의 무기를 들고
  alternatives_korean:
  - 자기들의 무기를 집어 들고
  - 자기들의 무기를 취하고
  lexicon: BDAG
  rationale: ἀναλαμβάνω는 단순 소지보다 행동을 위한 ‘들어 올림/집어 듦’을 뜻하므로, 전투 동작이 드러나게 ‘들고’로 옮겼습니다.
- source_word: πᾶς ἀνὴρ σφενδονήτης
  english_pob_choice: every man who used a sling
  chosen_korean: 그들 가운데 매마다 슬링을 쓰는 사람들
  alternatives_korean:
  - 모든 슬링잡이
  - 매 사람의 슬링잡이
  lexicon: LSJ
  rationale: σφενδονήτης의 직업/기능상 의미를 살리되, 한국어에서 낯선 조어를 피하고 본문이 가리키는 ‘슬링을 쓰는 사람들’로 풀어 옮겼습니다.
- source_word: διεκράτησαν τὴν ἀνάβασιν αὐτῶν
  english_pob_choice: held back their ascent
  chosen_korean: 그들의 올라감을 막고
  alternatives_korean:
  - 그들의 등정을 저지하고
  - 그들의 올라옴을 붙들고
  lexicon: BDAG
  rationale: διεκρατέω는 단순 방해가 아니라 올라오는 움직임을 억제하는 뜻이므로, 군사적 맥락이 드러나는 ‘막고’로 번역했습니다.
- source_word: ἔβαλλον ἐν λίθοις ἐπʼ αὐτούς
  english_pob_choice: kept throwing stones at them
  chosen_korean: 그들에게 돌을 던지고 있었습니다
  alternatives_korean:
  - 그들에게 돌을 계속 던졌습니다
  - 그들에게 돌멩이들을 던졌습니다
  lexicon: BDAG
  rationale: 미완료 시제의 지속적·반복적 공격을 살려 ‘던지고 있었습니다’로 옮겼고, ἐν λίθοις는 한국어에서 자연스러운 도구격으로 처리했습니다.
theological_decisions:
- issue: σφενδονήτης의 사회적 기능을 어떻게 드러낼지
  chosen_reading: 단순히 ‘슬링을 쓰는 사람들’로 옮겨 기능을 드러내되, 직업명처럼 굳힌 번역은 피했습니다.
  alternative_readings:
  - ‘슬링잡이들’로 직역
  - ‘매서너’ 같은 조어 사용
  rationale: 본문은 전투 행동을 설명하는 역사 서술이므로, 독자가 장면을 바로 이해할 수 있도록 기능 중심 번역을 택했습니다.
  doctrine_reference: 번역 원칙상 본문의 역사적 의미 전달 우선
