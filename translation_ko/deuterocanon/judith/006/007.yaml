lexical_decisions:
- source_word: ἀνταποστήσουσίν
  english_pob_choice: will bring you back
  chosen_korean: 다시 데려가서
  alternatives_korean:
  - 되돌려 보내서
  - 돌려보내서
  - 다시 데려오고
  lexicon: LSJ
  rationale: 이 동사는 여기서 단순 반환이 아니라 이동의 방향을 살린 ‘다시 데려가서’가 가장 자연스럽고, 이어지는 목적지 표현과도 잘 맞습니다.
- source_word: οἱ δοῦλοί μου
  english_pob_choice: my slaves
  chosen_korean: 내 종들이
  alternatives_korean:
  - 내 노예들이
  - 내 하인들이
  - 내 시종들이
  lexicon: BDAG
  rationale: 도구적·예속적 하위 신분을 드러내면서도 한국어 문장 안에서의 수용성을 고려해 ‘종’으로 옮겼습니다. 영어 POB의 slave/servant 긴장은 본문상 예속성이 보이지만, 한국어에서는 ‘노예들’보다 ‘종들’이 문맥상 더 직접적입니다.
- source_word: εἰς τὴν ὀρεινήν
  english_pob_choice: to the hill country
  chosen_korean: 산지로
  alternatives_korean:
  - 산악 지대로
  - 높은 지역으로
  - 고원지대로
  lexicon: LSJ
  rationale: 지리적 범주를 간결하게 전달하는 현대적 표현으로 ‘산지’가 적절합니다.
- source_word: τῶν ἀναβάσεων
  english_pob_choice: of the mountain passes
  chosen_korean: 산지로 올라가는 길목
  alternatives_korean:
  - 오름길의 도시들
  - 산길의 고개들
  - 오르는 길들의 도시들
  lexicon: LSJ
  rationale: ἀνάβασις의 직역인 ‘올라감/상승’보다, 산지로 들어가는 지형적 기능을 드러내는 ‘올라가는 길목’이 본문의 의미를 더 분명히 전달합니다.
theological_decisions:
- issue: δοῦλος의 한국어 처리
  chosen_reading: ‘종들’로 번역해 예속적 소속관계를 드러내되, 한국어 독자에게 과도하게 현대적·법적 뉘앙스를 덧씌우지 않았습니다.
  alternative_readings:
  - ‘노예들’로 직역
  - ‘하인들’로 완화
  rationale: POB의 영어 전통은 예속성을 강조하지만, 한국어에서는 본문 의도와 수용성을 함께 고려해야 합니다. 이 절은 군사적/지배적 소속을 말하므로 ‘종들’이 가장 균형적입니다.
  doctrine_reference: δοῦλος 처리 원칙
- issue: τῶν ἀναβάσεων의 지리적 의미
  chosen_reading: ‘산지로 올라가는 길목’으로 옮겨 지형적 기능을 드러냈습니다.
  alternative_readings:
  - ‘오름들’
  - ‘산지의 승강로들’
  - ‘산지의 고개들’
  rationale: 본문은 단순한 추상적 ‘상승’이 아니라 산지로 접근하는 실제 경로를 가리키므로, 독자가 장소적 이미지를 즉시 이해하도록 풀어 썼습니다.
  doctrine_reference: 지리 은유의 직접성
