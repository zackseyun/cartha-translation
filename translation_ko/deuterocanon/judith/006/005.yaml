translation:
  language: ko
  text: 그런데 너, 아키오르, 암몬의 품꾼아, 네가 네 불의의 날에 이 말들을 말하였으니, 이제부터 내가 원수를 갚을 때까지는 다시는 내 얼굴을 보지 못할 것이다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘품꾼’은 μισθωτέ의 직역적 대안으로, ‘고용인’보다 경멸적 호칭의 뉘앙스를 더 분명하게 드러냅니다.
    reason: lexical_alternative
  - marker: b
    text: ‘네 불의의 날’은 ‘네 잘못의 날’ 또는 ‘네 불의한 날’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: μισθωτέ
