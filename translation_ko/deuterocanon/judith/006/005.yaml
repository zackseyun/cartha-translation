  lexicon: LSJ
  rationale: ἀδικία의 핵심 의미인 ‘불의/부정의’를 살리되, 한국어에서 자연스러운 소유격 표현으로 압축했습니다. POB의 ‘injustice’의 긴장을 유지하면서도 문맥상 비난의 어조를 보존합니다.
