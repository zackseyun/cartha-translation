translation:
  language: ko
  text: 그러나 암몬의 품꾼[a] 아키오르야, 네가 네 불의의 날[b]에 이 말들을 말하였으므로, 오늘부터 내가 복수할 때까지는 다시는 내 얼굴을 보지 못할 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘품꾼’(μισθωτέ)은 임금을 받고 일하는 사람을 뜻하며, ‘고용된 사람’ 또는 ‘삯군’으로도 옮길 수 있습니다. 이 호칭에는 멸시의 어조가 담겨 있을 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘네 불의의 날’은 ‘네 잘못의 날’ 또는 ‘네 불의의 때’로도 옮길 수 있습니다.
    reason: lexical_alternative
