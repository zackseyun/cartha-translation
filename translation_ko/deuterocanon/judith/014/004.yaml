  text: Then you and all who live within the whole territory of Israel[a], following after them[b], strike them down on their roads.
  footnotes:
  - marker: a
    text: Or 'pursuing them' for 'following after them'; the Greek participle can carry the sense of going after in pursuit.
    reason: lexical_alternative
  - marker: b
    text: Literally 'all who dwell all the territory of Israel'; the phrase is rendered idiomatically as 'all who live within the whole territory of Israel.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러면 여러분은 그들을 뒤따르면서, 이스라엘 온 지역에 사는 모든 사람과 함께, 그들이 가는 길에서 그들을 쓰러뜨리십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘이스라엘의 온 지역에 사는 모든 사람’입니다. 문맥상 주민 전체를 자연스럽게 묶어 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: ἐπακολουθήσαντες는 ‘뒤따르면서’ 외에 ‘추격하면서’의 뜻도 가질 수 있습니다.
    reason: lexical_alternative
