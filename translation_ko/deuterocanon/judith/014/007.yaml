base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/014/007.yaml
  text: And when they had taken him up[a], he fell at Judith’s feet and bowed before her, and he said, “Blessed are you in every dwelling of Judah and among every nation[b]; those who hear your name will be thrown into confusion.”
  footnotes:
  - marker: a
    text: Or 'in every tent of Judah.' The Greek σκηνώματι can mean 'tent' or more generally 'dwelling, habitation.'
    reason: lexical_alternative
  - marker: b
    text: The verb can also be rendered 'will be troubled' or 'will be shaken.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 그를 데리고 일으키자, 그는 유딧의 발 앞에 엎드려 얼굴을 땅에 대고 절하며 말했습니다. “유다의 모든 거처와 모든 민족 가운데서 당신은 복되십니다. 당신의 이름을 들을 자들은 모두 혼란에 빠질 것입니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 σκηνώματι는 ‘장막’ 또는 더 넓게는 ‘거처, 거주지’를 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 동사는 ‘혼란에 빠질 것입니다’ 외에도 ‘괴로워할 것입니다’, ‘흔들릴 것입니다’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέλαβον αὐτόν
  english_pob_choice: had taken him up
  chosen_korean: 그를 데리고 일으키자
  alternatives_korean:
  - 그를 들어 올리자
  - 그를 받아 올리자
  - 그를 받아 주자
  lexicon: LSJ
  rationale: aorist ἀναλαμβάνω는 여기서 사람을 부축해 일으키는 구체적 동작을 가리키므로, ‘데리고 일으키다’로 자연스럽게 옮겼습니다.
- source_word: προσέπεσεν τοῖς ποσὶν
  english_pob_choice: fell at Judith’s feet
  chosen_korean: 유딧의 발 앞에 엎드려
  alternatives_korean:
  - 유딧의 발에 엎드려
  - 유딧 앞에 엎드려
  - 유딧의 발 앞에 쓰러져
  lexicon: LSJ
  rationale: 발 앞에 몸을 던지는 겸손과 간구의 동작을 살리기 위해, 관용적으로 ‘발 앞에 엎드리다’를 선택했습니다.
- source_word: προσεκύνησεν τῷ προσώπῳ αὐτῆς
  english_pob_choice: bowed before her
  chosen_korean: 얼굴을 땅에 대고 절하며
  alternatives_korean:
  - 그녀 앞에 예를 표하며
  - 그녀에게 절하며
  - 그녀 앞에 몸을 굽히며
  lexicon: LSJ
  rationale: 인간에게 드리는 경배/경의의 행위를 과도한 종교적 ‘예배’로 오해하지 않도록 하면서도, ‘얼굴을 땅에 대고’라는 자세의 강도를 반영했습니다.
- source_word: Εὐλογημένη σὺ
  english_pob_choice: Blessed are you
  chosen_korean: 복되십니다
  alternatives_korean:
  - 복되십니다
  - 복을 받으셨습니다
  - 복되소서
  lexicon: LSJ
  rationale: 직접 칭송의 정형적 축복 표현을 한국어의 높임말로 자연스럽게 옮겼습니다.
- source_word: ἐν παντὶ σκηνώματι Ἰούδα
  english_pob_choice: in every dwelling of Judah
  chosen_korean: 유다의 모든 거처
  alternatives_korean:
  - 유다의 모든 장막
  - 유다의 모든 집
  - 유다의 모든 거주지
  lexicon: LSJ
  rationale: σκηνώμα는 ‘장막’도 가능하지만, 문맥상 유다의 거주지를 넓게 가리키므로 ‘거처’로 옮겨 장막 이미지와 일반적 거주 의미를 함께 열어 두었습니다.
- source_word: ἐν παντὶ ἔθνει
  english_pob_choice: among every nation
  chosen_korean: 모든 민족 가운데서
  alternatives_korean:
  - 모든 나라 가운데서
  - 모든 민족 안에서
  - 모든 민족에
  lexicon: LSJ
  rationale: ἐν + 여격의 범위감을 살려, 한국어에서는 ‘가운데서’가 가장 자연스럽고 포괄적입니다.
- source_word: ταραχθήσονται
  english_pob_choice: will be thrown into confusion
  chosen_korean: 혼란에 빠질 것입니다
  alternatives_korean:
  - 흔들릴 것입니다
  - 두려워할 것입니다
  - 당황할 것입니다
  lexicon: LSJ
  rationale: ταράσσω의 ‘동요·혼란’ 의미를 반영해, 단순한 공포보다 내적 동요를 드러내는 표현으로 옮겼습니다.
theological_decisions:
- issue: προσκυνέω를 유딧에게 행하는 몸짓으로 어떻게 구분할 것인가
  chosen_reading: ‘절하며’로 옮겨 인간 대상의 경의/경배 동작으로 나타냈습니다.
  alternative_readings:
  - 예배하며
  - 경배하며
  - 엎드려 경배하며
  rationale: 본문의 대상은 유딧이라는 인간이므로, 신적 예배로 오해될 수 있는 표현은 피하고 문맥에 맞는 공경의 몸짓으로 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: 문맥이 허용하는 범위에서 신학적 긴장을 보존하고, 인간 대상 행위를 신적 예배로 치환하지 않음.'
