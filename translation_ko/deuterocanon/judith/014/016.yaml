  terminology: ‘큰 소리’, ‘신음’, ‘자기 옷을 찢었습니다’는 적절합니다. ‘힘차게 부르짖다’는 βοῆς ἰσχυρᾶς의 강도를 유지하면서 자연스럽습니다.
