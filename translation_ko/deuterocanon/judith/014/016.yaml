translation:
  language: ko
  text: 그는 큰 소리로 외치며 울고 신음하고 힘차게 부르짖었으며, 자기 옷을 찢었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐβόησεν
  english_pob_choice: cried out
  chosen_korean: 외치며
  alternatives_korean:
  - 소리치며
  - 부르짖으며
  lexicon: BDAG
  rationale: βοάω는 단순 발성이 아니라 강한 외침을 뜻하므로, 서술 흐름에 맞게 ‘외치며’로 옮기되 과도한 해석을 피했습니다.
- source_word: φωνῇ μεγάλῃ
  english_pob_choice: with a loud voice
  chosen_korean: 큰 소리로
  alternatives_korean:
  - 큰 음성으로
  - 큰 목소리로
  lexicon: BDAG
  rationale: 헬라어 관용구를 자연스러운 한국어 부사구로 옮겨, 소리의 크기를 직접 드러내면서도 문장을 매끄럽게 했습니다.
- source_word: μετὰ κλαυθμοῦ καὶ στεναγμοῦ καὶ βοῆς ἰσχυρᾶς
  english_pob_choice: with weeping and groaning and a mighty cry
  chosen_korean: 울부짖음과 신음과 힘찬 외침을 섞어 하며
  alternatives_korean:
  - 울음과 탄식과 강한 외침으로
  - 우는 소리와 신음과 큰 외침과 함께
  lexicon: BDAG
  rationale: 세 개의 명사열을 한국어에서도 서로 구분되게 살리되, ‘μετά’의 동반 관계를 자연스럽게 드러내기 위해 ‘섞어 하며’로 처리했습니다.
- source_word: διέρρηξεν τὰ ἱμάτια αὐτοῦ
  english_pob_choice: he tore his garments
  chosen_korean: 자기 옷을 찢었습니다
  alternatives_korean:
  - 자기 겉옷을 찢었습니다
  - 자기 의복을 찢었습니다
  lexicon: BDAG
  rationale: ἱμάτια는 넓게 ‘옷/의복’을 가리키므로, 한국어에서는 가장 직접적이고 읽기 쉬운 ‘옷’을 기본으로 택했습니다.
theological_decisions:
- issue: 애도와 절망의 반복적 정서 표현을 어떻게 전달할 것인가
  chosen_reading: 명사열을 풀어 쓰되, 감정의 강도를 높이는 동사 ‘외치며’와 ‘찢었습니다’를 유지했습니다.
  alternative_readings:
  - 문자적으로 ‘울며 신음하며 큰 외침으로’
  - 더 축약하여 ‘크게 통곡하며’
  rationale: 본문은 단순한 울음이 아니라 울부짖음·신음·강한 외침이 겹친 극도의 애통을 묘사하므로, 감정의 밀도를 약화시키지 않는 방향을 택했습니다.
  doctrine_reference: 본문 서사 이해 및 애도 표현의 수사학
