  text: But when the sons of Asshur saw them, they sent word to their leaders; and they came to the generals and commanders of thousands and to every one of their rulers.
translation:
  language: ko
  text: 그런데 아시리아 사람들은 그들을 보고 자기 지도자들에게 전갈을 보냈습니다. 그러자 그 지도자들은 장군들과 천인대장들과 그들의 통치자 한 사람 한 사람에게 갔습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δὲ υἱοὶ Ἀσσοὺρ
  english_pob_choice: the sons of Asshur
  chosen_korean: 아시리아 사람들은
  alternatives_korean:
  - 아슈르의 아들들은
  - 아시리아인들은
  lexicon: LSJ
  rationale: 직역형인 “아슈르의 아들들”도 가능하지만, 여기서는 민족 집단을 가리키는 용법이므로 한국어에서는 자연스럽고 의미가 분명한 “아시리아 사람들”을 택했습니다.
- source_word: διεπέμψαν
  english_pob_choice: they sent word
  chosen_korean: 전령을 보냈습니다
  alternatives_korean:
  - 말을 전했습니다
  - 소식을 보냈습니다
  - 전갈을 보냈습니다
  lexicon: LSJ
  rationale: 동사는 넓게는 ‘보내다/전달하다’이지만, 여기서는 지휘관들에게 신속히 알리는 군사적 소통을 가리키므로 “전령을 보냈습니다”가 가장 자연스럽고 구체적입니다.
- source_word: στρατηγοὺς καὶ χιλιάρχους
  english_pob_choice: the generals and commanders of thousands
  chosen_korean: 장군들과 천인대장들과
  alternatives_korean:
  - 장군들과 천부장들과
  - 군장들과 천인대장들과
  lexicon: LSJ
  rationale: στρατηγοί는 군 지휘관인 ‘장군들’로, χιλίαρχοι는 문자 그대로 ‘천 명의 지휘관’이므로 한국어에서는 의미를 살린 “천인대장들”이 직역성을 유지합니다.
- source_word: ἐπὶ πάντα ἄρχοντα αὐτῶν
  english_pob_choice: to every one of their rulers
  chosen_korean: 자기 통치자들 가운데 모든 이에게
  alternatives_korean:
  - 그들의 모든 통치자에게
  - 자기 모든 통치자들에게
  lexicon: BDAG
  rationale: πᾶς + 단수는 분배적 의미가 있어 “모든 이에게”로 풀어, 원문의 각자에게 두루 간다는 뉘앙스를 살렸습니다.
theological_decisions:
- issue: 민족명과 인명/지명 처리
  chosen_reading: Ἀσσοὺρ는 고유명사적 민족 지칭으로 보고 ‘아시리아 사람들’로 옮겼습니다.
  alternative_readings:
  - ‘아슈르의 아들들’처럼 원형을 더 보존하는 번역
  - ‘아시리아인들’로 더 관용적인 번역
  rationale: 이 문맥은 혈통 선언이 아니라 적대 집단을 가리키는 서술이므로, 독자가 즉시 알아볼 수 있는 민족명 표현을 택하되 원문의 역사적 집단성은 유지했습니다.
  doctrine_reference: 성서 역사서의 서술 관례
