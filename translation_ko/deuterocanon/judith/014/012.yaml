  source_fidelity: 첫 문장의 민족 지칭은 적절합니다. 그러나 διεπέμψαν은 전달 내용이나 전달자를 명시하지 않으므로 ‘전령을 보냈습니다’는 전령이라는 대상을 삽입합니다. 또한 δεύτερον οἱ δὲ는 앞의 ‘지도자들’을 가리키는데, 초안의 ‘그들은’은 선행하는 아시리아 사람들과 혼동될 수 있습니다. ‘통치자들 가운데 모든 이에게 왔습니다’도 원문의 열거 구조와 도착 대상의 의미를 정확히 반영하지 못합니다.
  naturalness: ‘자기 통치자들 가운데 모든 이에게 왔습니다’는 현대 한국어로 부자연스럽고 의미 관계가 불명확합니다. ‘그 지도자들은 … 통치자 한 사람 한 사람에게 갔습니다’로 명시하면 자연스럽고 합쇼체 서술에도 맞습니다.
