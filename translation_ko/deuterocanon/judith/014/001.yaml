  chosen_reading: 유딧의 말은 현대 한국어 합쇼체로 유지하되, 인용문 안의 직접 명령은 강한 호격과 명령형으로 살렸습니다.
  alternative_readings:
  - 인용문까지 전부 평서체로 완화
