  text: And Judith said to them[a], “Listen to me, brothers, and take this head and hang it on the battlement of your wall.”
  footnotes:
  - marker: a
    text: Or “on the parapet of your wall.” The Greek term can denote a battlement or parapet atop a defensive wall.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 유딧이 그들에게 말했습니다. 「내 말을 들으십시오, 형제들이여. 이 머리를 가져다가 너희 성벽의 성가퀴 위에 매달으십시오.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘성가퀴’는 성벽 꼭대기의 방어 구조를 가리킵니다. ‘난간’ 또는 ‘파라펫’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀκούσατε δή μου
  english_pob_choice: Listen to me
  chosen_korean: 내 말을 들으십시오
  alternatives_korean:
  - 내 말을 들으세요
  - 나를 들으십시오
  lexicon: BDAG; LSJ
  rationale: Ἀκούσατε의 직접 명령형과 δή의 긴박감을 한국어 명령문으로 자연스럽게 살려, 'please' 같은 완화 없이 곧바로 청중의 주의를 요구하는 표현으로 옮겼습니다.
- source_word: ἀδελφοί
  english_pob_choice: brothers
  chosen_korean: 형제들이여
  alternatives_korean:
  - 형제들아
  - 형제 여러분
  lexicon: BDAG
  rationale: 남성 복수 직접 호칭을 반영하되, 고전적 ‘-아’보다 현대 문장 흐름에 맞는 호격인 ‘-이여’를 사용했습니다.
- source_word: τὴν κεφαλὴν ταύτην
  english_pob_choice: this head
  chosen_korean: 이 머리
  alternatives_korean:
  - 이 잘린 머리
  - 이 머리 하나
  lexicon: BDAG
  rationale: 그리스어 자체는 단순히 ‘머리’라고 말하므로, 절단 여부를 덧붙이지 않고 지시대명사만 살렸습니다.
- source_word: ἐπὶ τῆς ἐπάλξεως τοῦ τείχους ὑμῶν
  english_pob_choice: on the battlement of your wall
  chosen_korean: 너희 성벽의 성가퀴 위에
  alternatives_korean:
  - 너희 성벽의 난간 위에
  - 너희 성벽의 파라펫 위에
  lexicon: LSJ
  rationale: ἐπάλξις의 성채 상부 구조를 한국어 성곽 용어인 ‘성가퀴’로 옮겨, POB의 ‘battlement/parapet’ 구분을 반영했습니다.
