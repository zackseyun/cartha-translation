translation:
  language: ko
  text: 그리고 이들은 자기들의 군장을 취한 뒤 자기들의 진영으로 들어가서, 앗수르 군대의 지휘관들을 깨울 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναλαβόντες
  english_pob_choice: after taking up
  chosen_korean: 취한 뒤
  alternatives_korean:
  - 들고 난 뒤
  - 메고 난 뒤
  - 가져간 뒤
  lexicon: LSJ
  rationale: aorist participle가 주동사보다 선행하는 동작을 나타내므로, 한국어에서는 자연스럽게 ‘-한 뒤’로 순서를 드러냈습니다.
- source_word: πανοπλίας
  english_pob_choice: armor
  chosen_korean: 군장
  alternatives_korean:
  - 갑옷
  - 전신 갑주
  - 무장
  lexicon: LSJ
  rationale: 여기서는 단순한 갑옷 한 벌보다 전투를 위한 온전한 무장 상태를 가리키므로, 현대 한국어에서 군사적 준비를 넓게 담는 ‘군장’을 택했습니다.
- source_word: παρεμβολὴν
  english_pob_choice: camp
  chosen_korean: 진영
  alternatives_korean:
  - 캠프
  - 야영지
  - 진지
  lexicon: LSJ
  rationale: 군사 문맥의 παρεμβολή는 주둔지/진영을 뜻하므로, 한국어에서도 전투 배치의 뉘앙스를 살리는 ‘진영’이 적절합니다.
- source_word: στρατηγοὺς τῆς δυνάμεως
  english_pob_choice: the commanders of the army
  chosen_korean: 군대의 지휘관들
  alternatives_korean:
  - 군대의 장군들
  - 군사력의 지휘관들
  - 병력의 지휘관들
  lexicon: LSJ
  rationale: στρατηγός는 직역하면 장군이지만, 문맥상 계급을 과도하게 좁히지 않고 지휘 책임을 강조하는 ‘지휘관들’이 자연스럽습니다. δυνάμεως는 여기서 군사 집단 전체를 가리켜 ‘군대’로 옮겼습니다.
- source_word: Ἀσσούρ
  english_pob_choice: Assyria
  chosen_korean: 앗수르
  alternatives_korean:
  - 아시리아
  - 아수르
  lexicon: LSJ
  rationale: 문맥상 나라 이름을 가리키지만, 한국어 성경 전통과 고유명사 인지도를 고려해 ‘앗수르’를 채택했습니다.
