  to: 그러나 아무도 대답하지 않자, 그는 휘장을 젖히고 침실로 들어가 그가 침대 덮개[a] 위에 던져진 채 죽어 있는 것을 보았습니다. 그의 머리는 그에게서 제거되어 있었습니다.[b]
