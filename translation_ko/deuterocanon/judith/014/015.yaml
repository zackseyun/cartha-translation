base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/014/015.yaml
  text: But when no one answered[a], he drew aside the curtain and went into the bedroom, and found him lying dead on the canopy[b], and his head had been taken from him.
  footnotes:
  - marker: a
    text: Or 'upon the bed canopy' or possibly 'upon the netting/hanging' associated with the bed.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'his head had been taken away from him'; that is, he had been beheaded.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 아무도 대답하지 않자, 그는 휘장을 젖히고 침실로 들어가 그가 침대 덮개[a] 위에 던져진 채 죽어 있는 것을 보았습니다. 그의 머리는 그에게서 제거되어 있었습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘침대 캐노피 위에’로 옮길 수 있습니다. 이 말은 침대와 관련된 휘장, 그물 또는 덮개를 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그의 머리가 그에게서 제거되어 있었다’는 뜻입니다. 이는 그가 참수되었음을 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δʼ οὐθεὶς ἐπήκουσεν
  english_pob_choice: But when no one answered
  chosen_korean: 아무도 대답하지 않자
  alternatives_korean:
  - 아무도 응답하지 않자
  - 아무도 듣지 않자
  lexicon: LSJ
  rationale: ἐπακούω는 여기서 단순 청취보다 부름에 대한 응답의 부재를 가리키므로, 자연스러운 한국어로 ‘대답하다’가 가장 적절합니다.
- source_word: διαστείλας
  english_pob_choice: he drew aside the curtain
  chosen_korean: 휘장을 젖히고
  alternatives_korean:
  - 휘장을 치우고
  - 휘장을 걷고
  lexicon: LSJ
  rationale: 동사는 무언가를 가르거나 벌려 놓는 동작을 뜻하며, 침실 맥락에서는 휘장/막을 젖히는 장면이 가장 직접적입니다.
- source_word: κοιτῶνα
  english_pob_choice: bedroom
  chosen_korean: 침실
  alternatives_korean:
  - 침상방
  - 잠방
  lexicon: LSJ
  rationale: κοιτών은 잠자는 방, 곧 침실을 뜻하므로 현대 표준어로 자연스러운 ‘침실’이 적절합니다.
- source_word: ἐπὶ τῆς χελώνιδος
  english_pob_choice: upon the canopy
  chosen_korean: 캐노피 위에
  alternatives_korean:
  - 침대 캐노피 위에
  - 모기장 위에
  - 침대 덮개 위에
  lexicon: LSJ
  rationale: χελώνις는 여기서 침대를 덮거나 둘러싼 덮개/휘장 계열의 가구를 가리키므로, 본문 뜻을 보존하면서도 문맥상 가장 널리 이해되는 ‘캐노피’로 옮겼습니다.
- source_word: ἡ κεφαλὴ αὐτοῦ ἀφῄρητο ἀπʼ αὐτοῦ
  english_pob_choice: his head had been taken away from him
  chosen_korean: 그의 머리는 그에게서 떨어져 나가 있었습니다
  alternatives_korean:
  - 그의 머리는 그에게서 제거되어 있었습니다
  - 그는 목이 잘려 있었습니다
  lexicon: LSJ
  rationale: 헬라어는 문자적으로 ‘그에게서 머리가 제거되었다’는 진술이며, 이를 해석적으로 압축한 ‘목이 잘렸다’를 바로 쓰기보다 원문의 충격과 분리 상태를 살리는 표현을 택했습니다.
theological_decisions:
- issue: ἡ κεφαλὴ αὐτοῦ ἀφῄρητο ἀπʼ αὐτοῦ의 진술 방식
  chosen_reading: 직접적인 ‘참수’ 진술로 풀지 않고, 머리가 그에게서 분리되어 있음을 문장 그대로 드러냈습니다.
  alternative_readings:
  - 그는 목이 잘려 있었습니다
  - 그는 참수되어 있었습니다
  rationale: 본문은 결과를 서술하는 방식으로 참수 사실을 전달하므로, 해석을 과도하게 압축하기보다 서술적 긴장을 유지하는 편이 원문에 더 가깝습니다.
  doctrine_reference: 서사 본문의 문자적 서술 보존 원칙
