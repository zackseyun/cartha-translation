  source_fidelity: ‘그에게서 떨어져 나가 있었습니다’는 ἀφῄρητο ἀπʼ αὐτοῦ(‘그에게서 제거되어 있었다’)보다 우연히 떨어져 나간 듯한 뉘앙스를 줄 수 있습니다. 또한 χελώνις와 머리의 제거에 관한 각주 표지가 해당 본문어에 붙어 있지 않습니다. ἐρριμμένον의 ‘던져진’ 의미는 유지하는 것이 좋습니다.
  naturalness: ‘캐노피 위에 던져져’는 현대 한국어에서 다소 어색하므로, 불확실한 가구 명칭을 본문에서는 ‘침대 덮개’로 자연스럽게 옮기고 각주에서 가능한 의미 범위를 밝혔습니다. 문장을 둘로 나누어 합쇼체 서술도 매끄럽게 했습니다.
  terminology: κοιτών은 ‘침실’, διαστείλας는 ‘휘장을 젖히고’로 적절합니다. χελώνις는 정확한 지시 대상이 불확실하므로 특정 물건으로 단정하지 않고 ‘침대 덮개’와 대안 각주를 사용했습니다. ἀφῄρητο는 ‘제거되어’로 옮겨 원문의 서술 방식을 보존했습니다.
