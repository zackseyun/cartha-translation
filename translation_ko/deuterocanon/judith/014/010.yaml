  source_fidelity: 초안은 ἰδών의 선행 상황, 하나님의 행위 전체, πιστεύω의 믿음 언어, 그리고 이스라엘 공동체로의 편입을 대체로 충실히 옮겼습니다. 그러나 περιέτεμετο는 중간태이며 뒤의 직접목적어를 수반합니다. ‘자신의 포피 살을 베어 할례를 받았고’는 자르는 행위와 ‘할례를 받다’를 부자연스럽게 겹쳐 놓아 행위의 구문 관계를 흐립니다.
  naturalness: ‘하나님을 크게 믿었으며’와 ‘이스라엘 집에 더해졌습니다’는 원문의 강조와 성서적 표현을 보존하는 범위에서 사용할 수 있습니다. 다만 각주 표지는 해당 본문어 바로 뒤에 두어 독자가 대안이 적용되는 위치를 알 수 있게 해야 합니다. 할례 구절은 ‘포피의 살을 베어 할례를 행하였고’로 고치면 현대 한국어 문장으로도 자연스럽고 원문의 구체성을 유지합니다.
  terminology: ‘이스라엘의 하나님’, ‘믿다’, ‘할례’, ‘이스라엘 집’은 적절합니다. ‘포피’는 원문의 ἀκροβυστία를 정확하게 반영하는 의학적·중립적 용어입니다. ‘할례를 행하다’는 여기서 중간태의 자기 관련성을 과도하게 교리화하지 않으면서도 직접목적어 구문을 보존합니다.
