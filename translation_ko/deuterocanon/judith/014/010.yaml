base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/014/010.yaml
  text: And when Achior saw all that the God of Israel had done[a], he believed in God greatly, and he circumcised the flesh of his foreskin[b], and was joined to the house of Israel to this day.
  footnotes:
  - marker: a
    text: Or 'he trusted God greatly.' The Greek uses πιστεύω language, which can emphasize belief, faith, or trust depending on context.
    reason: lexical_alternative
  - marker: b
    text: Or 'was added to the house of Israel.' The phrase describes Achior's incorporation into the people of Israel.
    reason: alternative_reading
translation:
  language: ko
  text: 아키오르는 이스라엘의 하나님께서 하신 모든 일을 보고, 하나님을 크게 믿었으며[a], 자기 포피의 살을 베어 할례를 행하였고, 오늘까지 이스라엘 집에 더해졌습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그는 하나님을 크게 신뢰했습니다.’ 여기서 πιστεύω는 문맥에 따라 믿음이나 신뢰를 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘이스라엘 집에 더하여졌습니다.’ 이 표현은 아키오르가 이스라엘 백성 안으로 편입되었음을 나타냅니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδὼν ... πάντα ὅσα ἐποίησεν
  english_pob_choice: when Achior saw all that the God of Israel had done
  chosen_korean: 아키오르가 ... 하신 모든 일을 보고
  alternatives_korean:
  - 모든 일을 보았을 때
  - 보고 나서
  lexicon: SBLGNT/BDAG 대응
  rationale: aorist 분사와 완료적 결과를 자연스러운 한국어 서술로 옮기되, 하나님 행위의 총체를 ‘하신 모든 일’로 보존했습니다.
- source_word: ἐπίστευσεν τῷ θεῷ σφόδρα
  english_pob_choice: he believed in God greatly
  chosen_korean: 하나님을 크게 믿었으며
  alternatives_korean:
  - 하나님을 매우 신뢰했으며
  - 하나님을 크게 신뢰했으며
  lexicon: BDAG
  rationale: πιστεύω의 믿음/신뢰 의미를 살리면서, σφόδρα의 강화를 ‘크게’로 옮겨 과도한 신학적 확장 없이 강도를 드러냈습니다.
- source_word: περιέτεμετο τὴν σάρκα τῆς ἀκροβυστίας αὐτοῦ
  english_pob_choice: he circumcised the flesh of his foreskin
  chosen_korean: 자신의 포피 살을 베어 할례를 받았고
  alternatives_korean:
  - 자신의 포피 살을 잘라 할례를 받았고
  - 자신의 포피 살에 할례를 행했고
  lexicon: BDAG
  rationale: 중간태를 한국어에서는 자기 행위로 풀되, ‘할례를 받다’로 결과를 분명히 하고 ‘포피 살’을 통해 그리스어의 구체적 표현을 보존했습니다.
- source_word: προσετέθη πρὸς τὸν οἶκον Ἰσραήλ
  english_pob_choice: was joined to the house of Israel
  chosen_korean: 이스라엘 집에 더해졌습니다
  alternatives_korean:
  - 이스라엘 집에 합류했습니다
  - 이스라엘 집에 붙여졌습니다
  lexicon: BDAG
  rationale: προστίθημι의 공동체 편입 의미를 살리면서도 ‘더해지다’로 본문 이미지와 결합 관계를 유지했습니다.
theological_decisions:
- issue: πίστις/πιστεύω 계열의 번역
  chosen_reading: ‘하나님을 크게 믿었습니다’로 번역해 믿음 언어를 유지했습니다.
  alternative_readings:
  - 하나님을 크게 신뢰했습니다
  - 하나님께 큰 믿음을 가졌습니다
  rationale: 이 절은 회심과 편입의 흐름 속에서 πιστεύω의 직접적 믿음 표현이 중요하므로, 믿음-신뢰의 긴장을 유지하는 쪽을 택했습니다.
  doctrine_reference: 'DOCTRINE.md: contested terms table for πίστις; translation philosophy 1, 3'
- issue: 공동체 편입 표현
  chosen_reading: ‘이스라엘 집에 더해졌습니다’로 공동체 편입을 직역했습니다.
  alternative_readings:
  - 이스라엘 집에 합류했습니다
  - 이스라엘 집에 받아들여졌습니다
  rationale: 본문의 완료 상태와 προστίθημι의 수동형을 보존해, 단순한 사회적 합류보다 언약 백성 안으로의 편입을 드러냅니다.
  doctrine_reference: 'DOCTRINE.md: translation philosophy 1, 6'
