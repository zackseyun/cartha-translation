  yaml_path: translation/deuterocanon/judith/014/014.yaml
  text: And Bagoas went in and knocked on the curtain of the tent[b][a], for he assumed that he was sleeping with Judith.
  footnotes:
  - marker: a
    text: Or 'entered and struck the hanging of the tent.' The Greek uses terms that can be rendered more formally as 'struck' and 'hanging/door-curtain,' but the main text uses more natural English for the scene.
    reason: lexical_alternative
  - marker: b
    text: The clause 'for he assumed that he was sleeping with Judith' reflects Bagoas's inference about Holofernes; the Greek does not explicitly state more than that assumption.
    reason: cultural_note
translation:
  language: ko
  text: 바고아스가 들어가 천막의 휘장[a]을 두드렸습니다. 그는 홀로페르네스가 유딧과 함께 자고 있다고 생각했기 때문입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 αὐλαία는 ‘휘장’ 또는 ‘걸린 천’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘홀로페르네스가 유딧과 함께 자고 있다’는 것은 바고아스의 추정입니다. 그리스어 본문은 그 이상을 직접 말하지 않습니다.
    reason: cultural_note
