  terminology: ‘성읍’은 πόλις의 일반적 의미를 정확히 전달하며, ‘도성’이 암시할 수 있는 수도·왕도의 뉘앙스를 불필요하게 더하지 않습니다. ‘함성’은 εὐφρόσυνον φωνήν에 적절합니다.
