  text: And when she stopped speaking[a], the people shouted with a loud voice and raised a joyful cry in their city.
  footnotes:
  - marker: a
    text: Or 'cried out'; the Greek verb can denote a loud shout, at times even a battle cry, but here it is used for the people's celebratory outburst.
