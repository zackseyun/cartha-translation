lexical_decisions:
- source_word: ὡς δὲ ἐπαύσατο λαλούσα
  english_pob_choice: And when she stopped speaking
  chosen_korean: 그녀가 말을 마치자
  alternatives_korean:
  - 그녀가 말하던 것을 멈추자
  - 그녀가 말하기를 그치자
  lexicon: LSJ
  rationale: ἐπαύσατο λαλούσα는 ‘말하고 있던 행위가 멈추다’는 뜻이므로, 현대 한국어에서 자연스럽고 간결한 ‘말을 마치자’로 옮겼습니다.
- source_word: ἠλάλαξεν
  english_pob_choice: shouted
  chosen_korean: 외치며
  alternatives_korean:
  - 소리치며
  - 환호하며
  - 전쟁 함성을 지르며
  lexicon: LSJ
  rationale: 이 동사는 큰 소리의 외침을 뜻하며, 본문 문맥은 전투적 함성보다 집단적 환호에 가깝기 때문에 ‘외치며’로 처리했습니다.
- source_word: φωνῇ μεγάλῃ ... ἔδωκεν φωνὴν εὐφρόσυνον
  english_pob_choice: with a loud voice ... raised a joyful cry
  chosen_korean: 큰 소리로 외치며 ... 기쁜 함성을 올렸습니다
  alternatives_korean:
  - 큰 목소리로 ... 기쁜 외침을 올렸습니다
  - 크게 외치며 ... 기쁨의 소리를 냈습니다
  lexicon: LSJ
  rationale: ‘목소리’보다 ‘소리’가 φωνή의 반복적이고 관용적인 울림을 더 자연스럽게 살리며, ἔδωκεν φωνὴν은 한국어의 ‘함성을 올리다’가 가장 idiomatic합니다.
- source_word: ἐν τῇ πόλει αὐτῶν
  english_pob_choice: in their city
  chosen_korean: 자기들의 도성에서
  alternatives_korean:
  - 그들의 도시에서
  - 자기들의 성읍에서
  lexicon: LSJ
  rationale: αὐτῶν의 소유격을 살리면서도, 제2성전기 서술의 도시 맥락을 반영해 ‘도성’으로 옮겨 문맥상 장중함을 유지했습니다.
theological_decisions:
- issue: 집단의 반응을 묘사하는 어휘의 강도
  chosen_reading: 전투적 함성으로 과장하지 않고, 축하와 환호의 집단적 외침으로 번역했습니다.
  alternative_readings:
  - 전쟁 함성으로 옮길 수 있습니다.
  - 단순히 ‘소리쳤습니다’로 약화할 수 있습니다.
  rationale: ἠλάλαξεν은 용례상 전쟁 함성도 가능하지만, 여기서는 유딧의 발언 직후의 공동체적 환호이므로 문맥에 맞는 강도를 유지해야 합니다.
  doctrine_reference: 문맥적 의미 우선의 번역 원칙
