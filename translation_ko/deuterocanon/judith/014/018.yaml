  text: 노예들이 실패하였습니다. 한 히브리 여인이 느부갓네살 왕의 집에 수치를 가져왔습니다. 보십시오, 홀로페르네스가 땅에 쓰러져 있고 그의 머리는 그에게 붙어 있지 않습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δοῦλοι
  english_pob_choice: the slaves
  chosen_korean: 노예들
  alternatives_korean:
  - 종들
  - 종복들
  lexicon: BDAG
  rationale: POB가 δοῦλοι를 bonded-status가 분명한 경우 ‘slaves’로 잡은 점을 따라, 한국어도 완곡한 ‘종들’보다 ‘노예들’로 번역해 지위의 구속성을 드러냈습니다.
- source_word: Ἠθέτησαν
  english_pob_choice: have failed
  chosen_korean: 실패하였습니다
  alternatives_korean:
  - 실수를 저질렀습니다
  - 배신하였습니다
  - 의무를 저버렸습니다
  lexicon: LSJ
  rationale: 문맥상 홀로페르네스 측 수행자들의 치명적 실책을 꾸짖는 말이므로, 법적·언약적 뉘앙스를 과도하게 덧씌우지 않는 ‘실패하다’가 가장 직접적입니다.
- source_word: ἐποίησεν αἰσχύνην
  english_pob_choice: has brought shame
  chosen_korean: 수치를 가져왔습니다
  alternatives_korean:
  - 수치를 당하게 하였습니다
  - 망신을 끼쳤습니다
  - 치욕을 가져왔습니다
  lexicon: LSJ
  rationale: 직역하면 ‘수치를 행하다’이지만 한국어에서는 부자연스러워, 결과적 공개 수치의 의미를 살리는 ‘수치를 가져왔습니다’로 옮겼습니다.
- source_word: χαμαί
  english_pob_choice: lying on the ground
  chosen_korean: 땅에 쓰러져
  alternatives_korean:
  - 땅에 누워
