review_pass:
  verdict: revise
  source_fidelity: 대체로 충실합니다. οἱ δοῦλοι를 ‘노예들’로 옮긴 것은 본문과 POB의 어휘 방침에 부합하며, ‘한 히브리 여인’은 μία 및 τῶν Ἑβραίων의 강조를 보존합니다. 다만 ἡ κεφαλὴ οὐκ ἔστιν ἐπʼ αὐτῷ의 직역적이고 충격적인 표현은 한국어에서 ‘그에게 붙어 있지 않습니다’라고 하면 지시 대상이 불분명하고 다소 비문이 됩니다.
  naturalness: ‘수치를 가져왔습니다’는 뜻은 통하지만 한국어 관용으로는 다소 번역투입니다. ‘수치를 안겼습니다’가 현대 표준어에서 더 자연스럽고, ‘그의 머리는 그의 몸에 붙어 있지 않습니다’는 원문의 구체적인 이미지를 자연스럽게 전달합니다.
  terminology: 느부갓네살, 홀로페르네스, 히브리 여인, 노예들은 일관되고 적절합니다. ‘집’은 왕가/왕실을 뜻하지만, 본문의 οἶκος를 보존하여 그대로 둘 수 있습니다.
  issues:
  - severity: low
    issue: ‘느부갓네살 왕의 집에 수치를 가져왔습니다’가 다소 번역투입니다.
    rationale: ἐποίησεν αἰσχύνην εἰς τὸν οἶκον의 결과적 수치 의미는 ‘집에 수치를 안겼습니다’가 더 자연스럽게 표현합니다.
  - severity: medium
    issue: ‘그의 머리는 그에게 붙어 있지 않습니다’에서 ‘그에게’의 지시가 한국어에서 부자연스럽고 모호합니다.
    rationale: ἐπʼ αὐτῷ는 문자적으로 ‘그 위에/그에게’이지만, 여기서는 머리가 시신의 몸에 없다는 뜻입니다. ‘그의 몸에 붙어 있지 않습니다’는 의미를 명료하게 하되 참수라는 사건을 과도하게 의역하지 않습니다.
  revised_text: 노예들이 실패하였습니다. 한 히브리 여인이 느부갓네살 왕의 집에 수치를 안겼습니다. 보십시오, 홀로페르네스가 땅에 쓰러져 있고, 그의 머리는 그의 몸에 붙어 있지 않습니다.
