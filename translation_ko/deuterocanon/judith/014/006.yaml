  source_fidelity: 원문의 ἐκ τοῦ οἴκου는 단순히 ‘집에서’보다 밖으로 나오는 방향을 포함하므로 ‘집 밖으로’로 밝혔습니다. 또한 τοῦ λαοῦ는 ‘많은 사람’이 아니라 ‘백성’이므로 바로잡았습니다. ἀνδρὸς ἑνός의 명시적 단수도 ‘한 사람’으로 유지했습니다. 마지막 관용구는 신체적 쇠진·실신을 가리키되 직역적 ‘영’의 표현을 강요하지 않는 한국어 표현과 각주로 처리했습니다.
  naturalness: ‘백성의 모임 가운데 한 사람이 손에 들고 있는 … 머리’를 사용하여 수식 관계를 자연스럽게 했습니다. ‘얼굴을 땅에 대고 쓰러졌습니다’는 ἔπεσεν ἐπὶ πρόσωπον의 갑작스러운 엎어짐을 현대 한국어 합쇼체로 자연스럽게 드러냅니다.
  terminology: ἐκκλησία는 제도적 ‘교회’가 아닌 집합을 뜻하므로 ‘백성의 모임’으로 옮겼습니다. ‘회중’에 붙은 문화 각주는 번역문 자체가 이미 오해를 피하므로 불필요합니다. 인명 표기는 초안의 아키오르, 오지아, 홀로페르네스를 유지했습니다.
  issues:
