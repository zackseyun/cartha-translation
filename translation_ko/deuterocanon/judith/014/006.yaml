base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/014/006.yaml
  text: And they called Achior out of the house of Ozias. But when he came and saw the head of Holofernes in the hand of one man in the assembly of the people[a], he fell on his face, and his spirit failed.
  footnotes:
  - marker: a
    text: Or, 'his breath left him' / 'he lost consciousness.' The Greek says literally, 'his spirit failed,' an idiom for physical collapse or fainting.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그들은 아키오르를 오지아의 집에서 불러냈습니다. 그런데 그가 와서 많은 사람의 회중 가운데 한 사람의 손에 들린 홀로페르네스의 머리를 보자, 그는 얼굴을 땅에 대고 엎드렸으며 그의 영이 빠져나갔습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘회중’은 이 본문에서 후대의 교회 제도가 아니라, 모여 있는 사람들의 집회를 가리킵니다.
    reason: cultural_note
  - marker: b
    text: ‘그의 영이 빠져나갔습니다’는 직역적 표현으로, 관용적으로는 ‘그는 정신을 잃었습니다’ 또는 ‘기절했습니다’의 뜻이 될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκάλεσαν
  english_pob_choice: they called
  chosen_korean: 불러냈습니다
  alternatives_korean:
  - 불렀습니다
  - 소환했습니다
  lexicon: BDAG
  rationale: 단순한 호출이 아니라 안에서 밖으로 나오게 하는 장면이므로, ‘불러냈습니다’가 자연스럽고 서술 흐름을 잘 살립니다.
- source_word: ἐκ τοῦ οἴκου Ὀζεία
  english_pob_choice: out of the house of Ozias
  chosen_korean: 오지아의 집에서
  alternatives_korean:
  - 오지아의 집 밖으로
  - 오지아의 집에서 나와
  lexicon: BDAG
  rationale: οἶκος의 물리적 의미를 살리되, 한국어에서는 ‘집에서’가 가장 간결하고 자연스럽습니다.
- source_word: ἐν τῇ ἐκκλησίᾳ τοῦ λαοῦ
  english_pob_choice: in the assembly of the people
  chosen_korean: 많은 사람의 회중 가운데
  alternatives_korean:
  - 백성의 회중 가운데
  - 백성의 모임 가운데
  - 사람들의 모임 가운데
  lexicon: BDAG
  rationale: 이 구절의 ἐκκλησία는 교회 제도가 아니라 실제로 모여 있는 집회이므로 ‘회중’으로 옮기되, τοῦ λαοῦ는 문맥상 ‘많은 사람’으로 풀어 자연스러운 장면성을 살렸습니다.
- source_word: ἐξελύθη τὸ πνεῦμα αὐτοῦ
  english_pob_choice: his spirit failed
  chosen_korean: 그의 영이 빠져나갔습니다
  alternatives_korean:
  - 그의 영이 쇠했습니다
  - 그의 영이 꺾였습니다
  - 그는 정신을 잃었습니다
  lexicon: BDAG
  rationale: 영/기운의 소진을 뜻하는 관용 표현으로 보되, 영어 POB가 유지한 신체적 붕괴의 중첩 의미를 살리기 위해 ‘빠져나갔습니다’로 옮겼습니다.
theological_decisions:
- issue: ἐκκλησία의 번역어 선택
  chosen_reading: ‘회중’으로 번역했습니다.
  alternative_readings:
  - 교회
  - 집회
  rationale: 이 문맥은 후대의 제도적 교회가 아니라 사람들의 실제 집합을 말하므로, 한국 교회어의 오해를 피하기 위해 ‘회중’이 가장 적절합니다.
  doctrine_reference: 용어 구별과 문맥 우선 원칙
