  to: 그리고 그들은 아키오르를 오지아의 집 밖으로 불러냈습니다. 그가 와서 백성의 모임 가운데 한 사람이 손에 들고 있는 홀로페르네스의 머리를 보자, 그는 얼굴을 땅에 대고 쓰러졌으며 기운이 빠졌습니다.[a]
  rationale: 원문의 공간적 방향(‘집 밖으로’), 백성의 모임이라는 표현, 한 사람이라는 단수를 회복했습니다. 마지막 절은 한국어에서 오해될 수 있는 ‘영이 빠져나갔다’를 피하면서도, 그리스어 관용구의 직역 및 실신 가능성을 각주에 보존했습니다. 불필요한 문화 각주는 삭제하고, 남은 각주의 표지와 본문 표지를 일치시켰습니다.
