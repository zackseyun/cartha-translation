base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/014/002.yaml
  text: And it shall be[a], when dawn breaks and the sun rises upon the earth, each of you shall take up your weapons of war, and every mighty man shall go out beyond the city. You shall appoint a leader over them, as though going down to the plain against the advance guard of the sons of Asshur[b]; but you shall not go down.
  footnotes:
  - marker: a
    text: Or 'to the outpost of the Assyrians.' The Greek literally reads 'to/against the προφυλακή of the sons of Asshur,' where προφυλακή can mean an advance guard, outpost, or forward watch.
    reason: lexical_alternative
  - marker: b
    text: '''Sons of Asshur'' is a literal rendering of the Greek expression; it refers to the Assyrians.'
    reason: cultural_note
translation:
  language: ko
  text: 그리고 날이 밝아오고 해가 땅 위로 떠오를 때, 너희는 각각 전투 무기를 들고, 모든 힘센 남자는 성 밖으로 나가십시오. 너희는 그들 위에 지휘관 하나를 세우고, 마치 아수르의 전초대오를 향해 평지로 내려가는 것처럼 하되, 너희는 내려가지 마십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘전초대오’는 그리스어 προφυλακή의 가능한 번역 중 하나로, ‘전초’, ‘전위부대’, ‘전초 진지’의 뜻을 포함합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘아수르의 자손’은 그리스어의 직역이며, 여기서는 아시리아 사람들을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: διαφαύσῃ ὁ ὄρθρος
  english_pob_choice: dawn breaks
  chosen_korean: 날이 밝아오고
  alternatives_korean:
  - 새벽이 밝고
  - 동이 트고
  lexicon: LSJ
  rationale: 새벽의 시작을 자연스러운 현대 한국어로 살리면서, 시간 전환의 시작이라는 뉘앙스를 보존했습니다.
- source_word: ἐξέλθῃ ὁ ἥλιος ἐπὶ τὴν γῆν
  english_pob_choice: the sun comes out upon the earth
  chosen_korean: 해가 땅 위로 떠오를 때
  alternatives_korean:
  - 해가 땅 위에 나오고
  - 해가 땅 위로 솟을 때
  lexicon: LSJ
  rationale: ὁ ἥλιος의 ‘나옴/등장’ 이미지를 ‘떠오르다’로 자연스럽게 옮기되, 땅 위에 대한 전치사 표현도 유지했습니다.
- source_word: τὰ σκεύη τὰ πολεμικὰ
  english_pob_choice: your weapons of war
  chosen_korean: 전투 무기
  alternatives_korean:
  - 전쟁 무기
  - 전투 장비
  lexicon: LSJ
  rationale: σχεύη의 포괄적 ‘장비’보다, 이 문맥에서 실제로 손에 들 무기 준비를 강조하는 ‘전투 무기’가 가장 직접적입니다.
- source_word: πᾶς ἀνὴρ ἰσχύων
  english_pob_choice: every strong man
  chosen_korean: 모든 힘센 남자
  alternatives_korean:
  - 모든 강한 남자
  - 모든 용맹한 남자
  lexicon: LSJ
  rationale: ἀνήρ의 남성형을 유지하면서, ἰσχύων의 체력·전투 능력 뉘앙스를 ‘힘센’으로 담았습니다.
- source_word: δώσετε ἀρχηγὸν εἰς αὐτούς
  english_pob_choice: You shall appoint a leader over them
  chosen_korean: 지휘관 하나를 세우고
  alternatives_korean:
  - 그들 위에 지도자 하나를 임명하고
  - 그들 위에 우두머리 하나를 세우고
  lexicon: LSJ
  rationale: 전투 상황의 ἀρχηγός를 군사적 성격이 드러나는 ‘지휘관’으로 옮기고, 문맥상 지명 행위를 ‘세우다’로 표현했습니다.
- source_word: ὡς καταβαίνοντες ἐπὶ τὸ πεδίον
  english_pob_choice: as though going down to the plain
  chosen_korean: 마치 평지로 내려가는 것처럼 하되
  alternatives_korean:
  - 평지로 내려가는 듯이 하되
  - 마치 들판으로 내려가는 것처럼 하되
  lexicon: LSJ
  rationale: ὡς가 나타내는 가장성/가장된 행동을 ‘마치 …처럼’으로 분명히 살렸습니다.
- source_word: εἰς τὴν προφυλακὴν υἱῶν Ἀσσούρ
  english_pob_choice: against the advance guard of the sons of Asshur
  chosen_korean: 아수르의 전초대오를 향해
  alternatives_korean:
  - 아수르 자손의 전초대를 향해
  - 아수르의 전위부대를 향해
  lexicon: LSJ
  rationale: προφυλακή의 ‘전초/전위’ 뜻을 반영하되, 한국어 군사 문맥에서 자연스러운 ‘전초대오’로 정리했습니다.
theological_decisions:
- issue: 문체의 명령·지시 어조
  chosen_reading: 서술문이지만 실제 행동 지시이므로 한국어에서는 공손한 명령형으로 옮겼습니다.
  alternative_readings:
  - 직설적 미래형으로만 옮기기
  - 반말체 명령으로 옮기기
  rationale: 원문 미래형이 맥락상 지시/명령 기능을 하므로, 현대 합쇼체의 공손한 명령형이 가장 충실하고 읽기 자연스럽습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
