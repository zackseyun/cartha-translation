  rationale: 원문의 ‘아수르의 자손’을 본문에 복원하고, 두 각주를 각각 ‘전초 부대’와 ‘아수르 자손’에 직접 연결했습니다. 지휘관을 세우라는 지시와 가장된 하강 행동의 관계를 자연스러운 합쇼체 명령문으로 정리했으며, 실제로 내려가지 말라는 마지막 금지는 유지했습니다.
