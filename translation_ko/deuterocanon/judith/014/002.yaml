- from: 그리고 날이 밝아오고 해가 땅 위로 떠오를 때, 너희는 각각 전투 무기를 들고, 모든 힘센 남자는 성 밖으로 나가십시오. 너희는 그들 위에 지휘관 하나를 세우고, 마치 아수르의 전초대오를 향해 평지로 내려가는 것처럼 하되, 너희는 내려가지 마십시오.[a][b]
