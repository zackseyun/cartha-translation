base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/014/005.yaml
  text: But before you do these things[a], call Achior the Ammonite to me[c][b], so that he may see and recognize the one who has treated the house of Israel with contempt and has sent him to us as if to death.
  footnotes:
  - marker: a
    text: Or 'so that he may see and fully know/recognize.' The Greek uses two verbs, 'see' and 'recognize,' in sequence for emphasis.
    reason: lexical_alternative
  - marker: b
    text: 'The pronoun ''him'' most likely refers to Achior: the one who despised the house of Israel had sent Achior to them as though to death.'
    reason: alternative_reading
  - marker: c
    text: Or 'to his death.' The Greek more literally says 'as if to death,' which may imply being handed over as good as dead.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 이 일들을 하기 전에, 암몬 사람 아히오르를 내게 불러오십시오. 그가 이스라엘 집을 멸시하고 그를 마치 죽음에 내맡기듯 우리에게 보낸 자를 보고 알아보게 하십시오.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘보고 완전히 알게/인식하게.’ 그리스어는 ‘보다’와 ‘알아보다’를 연속하여 사용해 강조합니다.
    reason: lexical_alternative
  - marker: b
    text: 대명사 ‘그를’은 가장 자연스럽게 아히오르를 가리킵니다. 곧 이스라엘 집을 멸시한 자가 아히오르를 그들에게 보낸 것입니다.
    reason: alternative_reading
  - marker: c
    text: 또는 ‘죽음에 이르도록.’ 그리스어는 더 문자적으로 ‘죽음에 이르듯’이라고 하며, 사실상 죽은 사람처럼 넘겨졌다는 뜻을 담을 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸ δὲ τοῦ ποιῆσαι ταῦτα
  english_pob_choice: But before you do these things
  chosen_korean: 그러나 이 일을 하기 전에
  alternatives_korean:
  - 그리고 이 일을 하기 전에
  - 그러나 이렇게 하기 전에
  lexicon: LSJ
  rationale: 전치사 πρό + 부정사 구문은 시간적 선행을 나타내므로 한국어로는 자연스럽게 ‘~하기 전에’로 옮기고, δέ는 문맥 전환의 ‘그러나’로 반영했습니다.
- source_word: καλέσατέ μοι
  english_pob_choice: call ... to me
  chosen_korean: 내게 데려오십시오
  alternatives_korean:
  - 내게 부르십시오
  - 내게 불러오십시오
  - 내게 소집하십시오
  lexicon: LSJ
  rationale: 호출의 직접성은 살리되, 수령인에게 오게 하라는 뉘앙스를 한국어 동사구로 자연스럽게 표현했습니다.
- source_word: τὸν ἐκφαυλίσαντα τὸν οἶκον τοῦ Ἰσραήλ
  english_pob_choice: the one who has treated the house of Israel with contempt
  chosen_korean: 이스라엘 집을 멸시한 자
  alternatives_korean:
  - 이스라엘 집을 업신여긴 자
  - 이스라엘 집을 경멸한 자
  - 이스라엘 집을 천대한 자
  lexicon: LSJ
  rationale: ἐκφαυλίζω의 핵심은 ‘가볍게 여기다, 멸시하다’이므로 ‘멸시한 자’가 가장 직접적이며, ‘이스라엘 집’도 성서적 표현을 유지했습니다.
- source_word: ὡς εἰς θάνατον ἀποστείλαντα εἰς ἡμᾶς
  english_pob_choice: has sent him to us as if to death
  chosen_korean: 마치 죽음에 넘기듯 우리에게 그를 보낸 자
  alternatives_korean:
  - 마치 죽음으로 보내듯 우리에게 그를 보낸 자
  - 그를 우리에게 죽음에 이르도록 보낸 자
  - 그를 우리에게 사실상 죽음으로 보낸 자
  lexicon: LSJ
  rationale: ὡς εἰς θάνατον의 완곡성을 살려 ‘마치 …듯’으로 옮기고, ἀποστέλλω는 단순 파견보다 ‘넘기다/보내다’의 결과적 위험을 드러내도록 했습니다.
theological_decisions:
- issue: 지시대상 대명사 αὐτόν의 처리
  chosen_reading: ‘그를’로 두어, 멸시한 자가 아히오르를 우리에게 보낸 당사자임을 문맥상 드러내되 한국어 본문에서는 과도한 명시를 피했습니다.
  alternative_readings:
  - ‘그를’ 대신 ‘아히오르를’로 풀어 쓰기
  - 주어를 반복해 ‘그가 아히오르를 우리에게 보낸 자’를 쓰기
  rationale: 영어 POB 주석처럼 대명사 ‘him’은 아히오르를 가리키는 것이 가장 자연스럽지만, 본문은 그 지시 관계를 독자가 따라가도록 두는 편이 원문 결속을 더 잘 보존합니다.
  doctrine_reference: 문맥적 대명사 해석
- issue: ‘마치 죽음에 넘기듯’의 완곡성 유지
  chosen_reading: 직설적으로 ‘죽음으로 보냈다’고 단정하지 않고, 원문의 ὡς(‘~처럼’)를 반영해 ‘마치 …듯’으로 유지했습니다.
  alternative_readings:
  - ‘그를 죽음으로 보낸 자’
  - ‘사실상 죽게 한 자’
  rationale: 원문은 결과를 강하게 암시하지만 표현상 완곡함이 있으므로, 그 긴장을 풀지 않고 남겨 두는 것이 더 충실합니다.
  doctrine_reference: 서술적 수사 보존
