translation:
  language: ko
  text: 그리고 그는 유디트가 머물고 있던 천막에 들어갔으나, 그녀를 찾지 못했습니다. 그는 외치며 사람들에게로 뛰어나갔습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰσῆλθεν
  english_pob_choice: went into
