  text: And he went into the tent where Judith was staying[a], but he did not find her; and he rushed out to the people, crying out[b],
  footnotes:
  - marker: a
    text: Or 'was lodging.' The Greek participle καταλύουσα refers to staying or lodging in a place.
    reason: lexical_alternative
