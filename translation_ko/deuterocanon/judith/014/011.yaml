  text: Now when dawn came up, they hung the head of Holofernes from the wall, and every man of Israel took up his weapons and went out in companies to the mountain passes.
  footnotes:
  - marker: a
    text: Or 'on the wall'; the Greek literally says 'from the wall,' describing the place from which the head was hung for display.
    reason: lexical_alternative
  - marker: b
    text: Literally 'to the ascents'; this likely refers to the uphill approaches or mountain passes.
    reason: lexical_alternative
translation:
  language: ko
  text: 이튿날 새벽이 올라오자, 그들은 홀로페르네스의 머리를 성벽에서 매달았으며, 이스라엘의 모든 남자는 자기 무기를 들고 무리 지어 나가서 오름길들로 향했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘성벽에서’입니다. 그리스어는 머리가 어디에 걸렸는지보다, 성벽에서 매달아 전시한 위치를 말합니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘오름길들’입니다. 여기서는 언덕으로 올라가는 접근로 또는 고개들을 가리키는 것으로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἡνίκα δὲ ὁ ὄρθρος ἀνέβη
  english_pob_choice: Now when dawn came up
  chosen_korean: 이튿날 새벽이 올라오자
  alternatives_korean:
  - 새벽이 왔을 때
  - 동이 틀 무렵
  lexicon: LSJ
  rationale: Ἡνίκα는 시간 접속사이고 ὁ ὄρθρος ἀνέβη는 직역하면 ‘새벽이 올라오다’이므로, 자연스러운 합쇼체로 시간 전환과 상승 이미지를 함께 살렸습니다.
- source_word: ἐκρέμασαν τὴν κεφαλὴν Ὀλοφέρνου ἐκ τοῦ τείχους
  english_pob_choice: they hung the head of Holofernes from the wall
  chosen_korean: 그들은 홀로페르네스의 머리를 성벽에서 매달았으며
  alternatives_korean:
  - 성벽 위에 매달았으며
  - 성벽에 걸어 두었으며
  lexicon: LSJ
  rationale: ἐκ τοῦ τείχους의 ‘from the wall’을 살려 ‘성벽에서’로 옮기되, 공개 전시의 상황을 드러내기 위해 ‘매달다’를 사용했습니다.
- source_word: πᾶς ἀνὴρ Ἰσραήλ
  english_pob_choice: every man of Israel
  chosen_korean: 이스라엘의 모든 남자
  alternatives_korean:
  - 이스라엘의 모든 사람
  - 이스라엘의 모든 남성
  lexicon: LSJ
  rationale: 그리스어가 남성 단수 분배적 표현이므로, 성별 표지를 지우지 않고 ‘모든 남자’로 옮겼습니다.
- source_word: ἀνέλαβεν πᾶς ἀνὴρ Ἰσραήλ τὰ ὅπλα αὐτοῦ
  english_pob_choice: every man of Israel took up his weapons
  chosen_korean: 이스라엘의 모든 남자는 자기 무기를 들고
  alternatives_korean:
  - 이스라엘의 모든 남자는 자기 무기를 취하고
  - 이스라엘의 모든 남자는 자기 무기를 집어 들고
  lexicon: LSJ
  rationale: ἀνέλαβεν은 군사적 관용구로서 ‘들어 올리다/취하다’의 뉘앙스를 가지므로, 현대 한국어에서 자연스러운 ‘무기를 들고’로 옮겼습니다.
- source_word: ἐξήλθοσαν κατὰ σπείρας ἐπὶ τὰς ἀναβάσεις
  english_pob_choice: went out in companies to the ascents
  chosen_korean: 무리 지어 나가서 오름길들로 향했습니다
  alternatives_korean:
  - 부대별로 나가서 산길들로 향했습니다
  - 대오를 지어 나가서 산등성이들로 향했습니다
  lexicon: LSJ
  rationale: κατὰ σπείρας는 조직된 무리/대열을 뜻하므로 ‘무리 지어’로, ἀναβάσεις는 문자적으로 ‘오름길들’이어서 해석을 덧붙이지 않고 보존했습니다.
theological_decisions:
- issue: ἀναβάσεις의 지리적 의미를 너무 특정할지 여부
  chosen_reading: ‘오름길들’로 직역하여, 본문이 명시하지 않은 ‘산길/고개’의 해석을 본문 밖에서 덧붙이지 않았습니다.
  alternative_readings:
  - 산길들
  - 고개들
  - 산등성으로 가는 길들
  rationale: 영어 POB가 한때 ‘mountain passes’로 풀었으나, 최신 audit는 ‘to the ascents’로 되돌렸으므로, 해석보다 원문 이미지를 우선하는 것이 적절합니다.
  doctrine_reference: 본문 해석 원칙
