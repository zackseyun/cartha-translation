base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/014/019.yaml
  text: But when the commanders of the army of Assyria heard the words[a], they tore their tunics, and their souls were greatly troubled[b], and there arose a very great cry and outcry in the midst of the camp.
  footnotes:
  - marker: a
    text: Tearing one's tunic was a customary expression of grief, shock, or distress.
    reason: cultural_note
  - marker: b
    text: Or 'their spirit was greatly troubled.' The Greek literally says 'their soul was greatly troubled,' using a collective singular expression.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 아수르 군대의 지휘관들이 그 말을 듣자, 그들은 자기들의 속옷을 찢었고, 그들의 혼은 몹시 괴로워졌으며, 진영 한가운데에서 매우 큰 부르짖음과 외침이 일어났습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 겉옷을 찢는 것은 슬픔, 충격, 고통을 나타내는 관습적 행동입니다.
    reason: cultural_note
  - marker: b
    text: 또는 ‘그들의 영이 몹시 괴로워졌습니다.’ 그리스어는 문자적으로 ‘그들의 혼이 몹시 괴로워졌다’라고 되어 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ ἄρχοντες τῆς δυνάμεως Ἀσσούρ
  english_pob_choice: the commanders of the army of Assyria
  chosen_korean: 아수르 군대의 지휘관들
  alternatives_korean:
  - 아시리아 군대의 사령관들
  - 아수르의 군사 통치자들
  lexicon: BDAG
  rationale: ἄρχοντες는 군사적 문맥에서 지휘관들로 옮기는 것이 자연스럽고, δύναμις는 여기서 군대/무력을 가리키므로 한국어도 군대라고 풀었습니다. Ἀσσούρ은 인명보다 국가명 아수르로 이해하는 것이 적절합니다.
- source_word: τοὺς χιτῶνας αὐτῶν διέρρηξαν
  english_pob_choice: they tore their tunics
  chosen_korean: 자기들의 속옷을 찢었고
  alternatives_korean:
  - 자기들의 겉옷을 찢었고
  - 자기들의 옷을 찢었고
  lexicon: BDAG
  rationale: χιτών은 구체적으로 속옷/안쪽 옷에 해당하므로, 일반적인 ‘옷’보다 구체성을 살려 속옷으로 옮겼습니다. 옷을 찢는 행위는 슬픔과 충격의 관용적 표현입니다.
- source_word: ἐταράχθη αὐτῶν ἡ ψυχὴ σφόδρα
  english_pob_choice: their souls were greatly troubled
  chosen_korean: 그들의 혼은 몹시 괴로워졌으며
  alternatives_korean:
  - 그들의 영은 크게 흔들렸으며
  - 그들은 몹시 괴로워졌으며
  lexicon: BDAG
  rationale: 그리스어가 단수 ψυχή를 집합적으로 사용하므로 ‘혼’을 유지해 원문의 인류학적 표현을 살렸습니다. ‘몹시 괴로워졌으며’는 ἐταράχθη와 σφόδρα의 강도를 자연스럽게 전달합니다.
- source_word: ἐγένετο αὐτῶν κραυγὴ καὶ βοὴ μεγάλη σφόδρα
  english_pob_choice: there arose a very great cry and outcry
  chosen_korean: 매우 큰 부르짖음과 외침이 일어났습니다
  alternatives_korean:
  - 큰 통곡과 함성이 일어났습니다
  - 매우 큰 외침과 소란이 일어났습니다
  lexicon: BDAG
  rationale: κραυγή와 βοή의 이중 표현을 둘 다 살리기 위해 ‘부르짖음과 외침’으로 구분했습니다. ἐγένετο는 사건 발생을 나타내므로 ‘일어났습니다’가 무난합니다.
- source_word: ἐν μέσῳ τῆς παρεμβολῆς
  english_pob_choice: in the midst of the camp
  chosen_korean: 진영 한가운데
  alternatives_korean:
  - 진영 가운데
  - 캠프 한복판
  lexicon: BDAG
  rationale: παρεμβολή는 군사적 진영/야영지이므로 문맥상 ‘진영’이 적절합니다. ‘한가운데’는 전치사구의 공간 감각을 그대로 살립니다.
theological_decisions:
- issue: 슬픔·충격의 관용적 몸짓과 내적 반응을 어떻게 드러낼지
  chosen_reading: 겉옷을 찢는 장면과 혼의 격렬한 동요를 함께 살려, 외적 애도와 내적 충격이 동시에 나타나게 했습니다.
  alternative_readings:
  - 옷을 찢었다고만 옮겨 행위의 구체성을 낮추는 방식
  - 혼란스러워졌다고 완화해 내적 격동을 약하게 만드는 방식
  rationale: 본문은 단순한 감정 묘사가 아니라 집단적 공포와 굴욕의 반응을 강하게 드러내므로, 외적·내적 반응을 모두 보존하는 것이 원문의 힘에 더 가깝습니다.
  doctrine_reference: 본문 해석과 감정 표현의 충실성
