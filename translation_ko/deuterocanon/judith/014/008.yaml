  yaml_path: translation/deuterocanon/judith/014/008.yaml
  text: And now tell me what you have done in these days[a]. And Judith reported to him, in the midst of the people, all that she had done[b], from the day when she went out until the time when she was speaking to them.
  footnotes:
  - marker: a
    text: Or 'before the people' for 'in the midst of the people.' The Greek expression can emphasize either location among them or public setting before them.
    reason: lexical_alternative
  - marker: b
    text: Or 'until she spoke to them.' The Greek uses an imperfect verb ('was speaking'), which may either highlight the ongoing speech or simply function narratively.
    reason: lexical_alternative
translation:
  language: ko
  text: “이제 이 날들 동안 네가 한 모든 일을 내게 말해 주십시오.” 그러자 유디트는 백성 가운데서[a] 자기가 떠난 날부터 그들에게 말하고 있던 때까지[b] 자기가 한 모든 일을 그에게 보고했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘백성 가운데서’는 문자적으로 ‘백성의 한가운데서’입니다. 이 표현은 백성 가운데 있는 위치를 뜻할 수도 있고, 백성 앞에서 공개적으로 말하는 상황을 가리킬 수도 있습니다.
    reason: alternative_reading
  - marker: b
    text: 그리스어의 미완료형은 ‘말하고 있었다’라는 진행성을 나타낼 수 있으나, 서술의 흐름에서는 단순히 ‘말했다’로 이해될 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνάγγειλόν μοι
  english_pob_choice: tell me
  chosen_korean: 내게 말해 보십시오
  alternatives_korean:
  - 내게 알려 주십시오
  - 내게 보고해 주십시오
  lexicon: BDAG
  rationale: 직접적인 요청형이므로 자연스러운 구어적 청유를 살리되, 보고의 성격도 유지하도록 ‘말해 보십시오’를 택했습니다.
- source_word: ἐν ταῖς ἡμέραις ταύταις
  english_pob_choice: in these days
  chosen_korean: 이 며칠 동안
  alternatives_korean:
  - 이러한 날들에
  - 이 기간 동안
  lexicon: BDAG
  rationale: 문맥상 막 지난 짧은 기간을 가리키므로, 한국어에서는 ‘이 며칠 동안’이 더 자연스럽고 구체적입니다.
- source_word: ἐν μέσῳ τοῦ λαοῦ
  english_pob_choice: in the midst of the people
  chosen_korean: 백성들 가운데서
  alternatives_korean:
  - 백성들 한가운데서
  - 백성들 앞에서
  lexicon: BDAG
  rationale: ‘중간/가운데’의 공간적 뉘앙스를 살리면서도 한국어로 매끄럽게 읽히도록 ‘가운데서’로 옮겼습니다. ‘앞에서’는 청중 앞의 공적 장면으로 의미를 좁힐 수 있습니다.
- source_word: ἕως οὗ ἐλάλει αὐτοῖς
  english_pob_choice: until the time when she was speaking to them
  chosen_korean: 그들에게 말하고 있던 때까지
  alternatives_korean:
  - 그들에게 말했을 때까지
  - 그들에게 말하던 동안
  lexicon: BDAG
  rationale: 미완료 과거의 진행성을 반영하여 ‘말하고 있던’으로 옮겼습니다. 단순 과거보다 장면의 지속성을 더 잘 드러냅니다.
theological_decisions:
- issue: 유디트의 발화체와 보고 동사 선택
  chosen_reading: 직접인용 안에서는 공손한 명령형을 유지하고, 서술문에서는 ‘보고했습니다’로 공적 보고의 성격을 분명히 했습니다.
  alternative_readings:
  - 명령형을 완전히 평서문으로 완화하기
  - ‘말했습니다’로만 처리하기
  rationale: 이 절은 사적 대화와 공적 증언이 함께 나타나므로, 요청과 보고의 차이를 한국어에서도 분명히 구분하는 편이 원문의 장면성을 잘 살립니다.
  doctrine_reference: 문학적-서사적 정확성
