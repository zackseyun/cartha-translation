  to: “이제 이 날들 동안 네가 한 모든 일을 내게 말해 주십시오.” 그러자 유디트는 백성 가운데서[a] 자기가 떠난 날부터 그들에게 말하고 있던 때까지[b] 자기가 한 모든 일을 그에게 보고했습니다.
  rationale: 직접 인용문의 잘못 삽입된 1인칭 표현을 바로잡고, 시간 표현을 원문의 범위대로 유지했습니다. 또한 보고의 대상과 각주 연결 위치를 분명히 하면서, 미완료형의 해석 가능성은 각주에서 보존했습니다.
