  source_fidelity: 첫 직접 인용문의 ‘내가’는 원문의 2인칭 단수 소유·주어 관계(‘네가 한 일’)와 맞지 않아 삭제해야 합니다. 또한 ἐξῆλθεν은 ‘나온’보다 문맥상 중립적인 ‘떠난’으로 옮길 수 있으며, 보고의 수령자 αὐτῷ(그에게)를 명시하는 것이 원문에 충실합니다.
  naturalness: ‘이 며칠’은 원문의 ‘이 날들’보다 기간을 불필요하게 짧게 특정할 수 있습니다. 문장 성분을 재배열하고 중복된 ‘모두’를 제거하면 현대 한국어 합쇼체 문장으로 더 자연스럽습니다.
  terminology: ‘유디트’, ‘백성’, ‘보고했습니다’는 적절합니다. 직접 요청에는 ‘말해 주십시오’를 사용하여 현대의 정중한 합쇼체를 유지했습니다.
