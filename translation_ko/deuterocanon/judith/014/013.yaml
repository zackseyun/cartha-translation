  verdict: revise
  source_fidelity: 마지막 목적절(ἵνα ἐξολοθρευθῶσιν εἰς τέλος)은 ‘그들이 멸망하도록’이라는, 적대자들을 비꼬는 듯한 목적 표현입니다. 초안의 ‘멸망하게 하려는 것입니다’는 누군가가 그들을 멸망시키려 한다는 능동적 사역 의미를 더하여 원문의 수동형과 목적 주체의 모호성을 흐립니다.
  naturalness: ‘그의 모든 일 위에 있는 사람’은 한국어로 부자연스럽습니다. ‘그의 모든 일을 맡은 사람’이 현대 표준어 합쇼체 서사에 자연스럽습니다. 또한 주석 표지는 해당 어구 바로 뒤에 두는 것이 적절합니다.
  terminology: ‘홀로페르네스’, ‘장막’, ‘노예들’은 문맥과 원어에 충실합니다. 인간 지배자를 가리키는 κύριος는 ‘주인’으로 옮겨 신적 호칭과 구별했습니다.
  issues:
  - severity: medium
    issue: 목적절이 사역 의미로 번역됨
