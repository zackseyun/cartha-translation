  - severity: medium
    issue: 관리자를 가리키는 표현이 비문에 가까움
    rationale: ‘그의 모든 일 위에 있는 사람’은 그리스어 어순을 지나치게 직역한 표현입니다. ‘그의 모든 일을 맡은 사람’은 역할을 자연스럽게 전달하며, 주석에서 전승문의 특이성을 설명할 수 있습니다.
