  text: And they came to Holofernes’s tent[a], and said to the one over all his affairs, “Wake our lord at once, because the slaves have dared to come down against us for battle, so that they may be utterly destroyed.”
  footnotes:
  - marker: a
    text: Or “the one in charge of all that was his,” that is, Holofernes’s chief steward or attendant.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그들은 홀로페르네스의 장막에 이르러 그의 모든 일을 맡은 사람[a]에게 말하였습니다. “우리 주인을 당장 깨우십시오. 노예들이 감히 우리를 치러 내려왔습니다. 그들이 끝까지 완전히 멸망하도록 말입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그의 모든 것 위에 있는 사람’입니다. 전승문의 다소 특이한 표현으로, 홀로페르네스의 모든 일을 맡아 관리하던 최고 관리나 시종을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: σκηνή
  english_pob_choice: tent
  chosen_korean: 장막
  alternatives_korean:
  - 텐트
  - 막사
  lexicon: LSJ
  rationale: 전쟁 서사에서 Holofernes의 거처를 가리키므로, 현대어에서는 ‘장막’이 문맥상 자연스럽고 본문의 군사적 분위기를 살리면서도 과도하게 종교적 의미를 덧씌우지 않습니다.
- source_word: τῷ οὔτι ἐπὶ πάντων τῶν αὐτοῦ
  english_pob_choice: the one over all his affairs
  chosen_korean: 그의 모든 일 위에 있는 사람
  alternatives_korean:
  - 그의 모든 일을 맡은 사람
  - 그의 모든 것의 관리인
  lexicon: LSJ
  rationale: 그리스어의 다소 어색한 전승문을 그대로 살리되, 호로페르네스의 집사/관리자 역할을 드러내는 중립적 표현으로 옮겼습니다.
- source_word: δοῦλοι
  english_pob_choice: slaves
  chosen_korean: 노예들
  alternatives_korean:
  - 종들
  - 하인들
  lexicon: LSJ
  rationale: 경멸적·종속적 뉘앙스가 강한 자리이므로, 본문이 드러내는 지배-피지배의 긴장을 약화시키지 않기 위해 ‘노예들’로 옮겼습니다.
- source_word: ἵνα ἐξολοθρευθῶσιν εἰς τέλος
  english_pob_choice: so that they may be utterly destroyed
  chosen_korean: 그들이 끝까지 완전히 멸망하게 하려는 것입니다
  alternatives_korean:
  - 그들이 완전히 멸절되게 하려는 것입니다
  - 그들이 철저히 멸망하게 하려는 것입니다
  lexicon: LSJ
  rationale: ἐξολοθρευθῶσιν과 εἰς τέλος의 중첩된 완전성·전면성을 한국어에서 두 겹으로 드러내기 위해 ‘끝까지 완전히 멸망’이라는 표현을 사용했습니다.
theological_decisions:
- issue: δοῦλοι의 번역 강도 유지
  chosen_reading: ‘노예들’로 번역해 적대적 발화 속 경멸성과 종속성을 분명히 드러냈습니다.
  alternative_readings:
  - 종들
  - 하인들
  rationale: 이 절에서 δοῦλοι는 온건한 ‘섬김’이 아니라 적을 낮춰 부르는 말이므로, 본문의 수사적 힘을 보존하는 쪽이 더 적절합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms table for δοῦλος; Translation philosophy §1'
