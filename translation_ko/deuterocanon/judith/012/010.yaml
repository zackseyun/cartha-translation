  yaml_path: translation/deuterocanon/judith/012/010.yaml
  text: And on the fourth day[a], Holofernes gave a banquet for his slaves alone[b], and he did not invite any of those in attendance.
  footnotes:
  - marker: a
    text: Or 'for his servants alone.' The Greek uses doulos, which can mean either 'slave' or 'servant' depending on context; here 'slaves' was chosen to preserve the bonded status implied by the term.
    reason: lexical_alternative
  - marker: b
    text: The final clause likely refers to those occupied with practical service or official duties; the Greek expression is somewhat idiomatic.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 넷째 날[ᵃ], 홀로페르네스는 자기 종들만을 위해 잔치를 베풀었고, 자기 옆에서 일하는 자들 가운데서는 아무도 초대하지 않았습니다.[ᵇ][a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘넷째 날이 되자’.
    reason: alternative_reading
  - marker: b
    text: 헬라어 표현은 실무·시중에 종사하는 사람들을 가리키는 관용적 말로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ἐν τῇ ἡμέρᾳ τῇ τετάρτῃ
  english_pob_choice: on the fourth day
  chosen_korean: 넷째 날
  alternatives_korean:
  - 네 번째 날
  - 넷째 날이 되자
  lexicon: LSJ
  rationale: 서사 시간 표지이므로 자연스러운 한국어 시간 표현으로 옮기되, 원문의 간결한 시간 제시를 보존했습니다.
- source_word: ἐποίησεν ... πότον
  english_pob_choice: gave a banquet
  chosen_korean: 잔치를 베풀었고
  alternatives_korean:
  - 연회를 열었고
  - 술잔치를 벌였고
  lexicon: LSJ
  rationale: πότος는 단순한 음주가 아니라 손님을 위한 연회·잔치를 가리키므로, 현대 한국어에서 가장 자연스러운 ‘잔치를 베풀다’로 옮겼습니다.
- source_word: τοῖς δούλοις αὐτοῦ μόνοις
  english_pob_choice: for his slaves alone
  chosen_korean: 자기 종들만을 위해
  alternatives_korean:
  - 자기 노예들만을 위해
  - 자기 하인들만을 위해
  lexicon: BDAG
  rationale: 도구적·사회적 종속 관계를 드러내는 δοῦλοις는 기본적으로 ‘종’으로 옮기되, 본문에서 배타적으로 특정 집단만을 대상으로 한 점을 ‘만을 위해’로 살렸습니다.
- source_word: τῶν πρὸς ταῖς χρείαις
  english_pob_choice: those in attendance
  chosen_korean: 자기 옆에서 일하는 자들 가운데서는
  alternatives_korean:
  - 업무를 맡은 자들 가운데서는
  - 시중드는 자들 가운데서는
  lexicon: LSJ
  rationale: 이 관용구는 단순한 ‘동석자’가 아니라 실무·시중·봉사에 종사하는 이들을 가리키므로, 문맥상 가장 넓고 안전하게 ‘옆에서 일하는 자들’로 풀었습니다.
theological_decisions:
- issue: δούλοις의 사회적 강도 보존
  chosen_reading: ‘종들’로 옮겨 소속과 종속의 관계를 유지했습니다.
  alternative_readings:
  - ‘하인들’
  - ‘노예들’
  rationale: 영어 POB가 본문 전통의 bonded status를 살리기 위해 ‘slaves’를 선호한 점을 반영하되, 한국어에서는 문맥상 지나치게 현대적·직설적으로 들릴 수 있는 ‘노예들’보다 중립적이면서도 종속성을 남기는 ‘종들’을 택했습니다.
  doctrine_reference: '번역 원칙: 원문이 드러내는 사회적 현실 보존'
- issue: τῶν πρὸς ταῖς χρείαις의 관용성 처리
  chosen_reading: 직역보다 의미 중심으로 ‘자기 옆에서 일하는 자들’이라고 풀었습니다.
  alternative_readings:
  - ‘업무에 종사하는 자들’
  - ‘시중드는 자들’
  rationale: 표현이 관용적이어서, 문맥에 맞는 기능을 드러내되 특정 직함으로 과도하게 한정하지 않았습니다.
  doctrine_reference: '번역 원칙: 관용구의 의미 우선'
