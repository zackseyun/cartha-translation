  yaml_path: translation/deuterocanon/judith/012/008.yaml
  text: And when she went up[a], she was praying to the Lord God of Israel to direct her way for the exaltation of the sons of his people.
  footnotes:
  - marker: a
    text: Or 'for the exaltation' or 'for the restoration' of the sons of his people. The Greek noun is rare and can suggest a raising up in status or condition, not merely physical movement.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그녀가 올라갔을 때, 그녀는 이스라엘의 주 하나님께서 그분의 백성의 아들들을 높이시도록 자신의 길을 인도해 달라고 기도하고 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그분의 백성의 아들들을 일으켜 세우시도록’ 또는 ‘회복시키시도록’. 그리스어 ‘아나스테마’는 드문 명사로, 단순한 물리적 상승뿐 아니라 지위나 상태를 높이거나 회복시키는 뜻을 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέβη
  english_pob_choice: went up
  chosen_korean: 올라가자
  alternatives_korean:
  - 올라갔을 때
  - 올라갔습니다
  lexicon: LSJ
  rationale: ἀναβαίνω의 기본 의미를 따라 ‘올라가다’로 옮기되, 서술 흐름에 맞게 ‘-자’를 써서 동시성을 자연스럽게 드러냈습니다.
- source_word: ἐδέετο
  english_pob_choice: was praying
  chosen_korean: 기도하고 있었습니다
  alternatives_korean:
  - 간청하고 있었습니다
  - 간구하고 있었습니다
  lexicon: BDAG
  rationale: 대상이 ‘이스라엘의 주 하나님’이므로 단순한 간청보다 명시적인 기도의 행위를 드러내는 표현이 적절합니다.
- source_word: κυρίου θεοῦ Ἰσραήλ
  english_pob_choice: the Lord God of Israel
  chosen_korean: 이스라엘의 주 하나님
  alternatives_korean:
  - 주 하나님께
  - 이스라엘의 주, 하나님
  lexicon: LSJ
  rationale: κύριος는 본 프로젝트 기본값에 따라 ‘주’로, θεός는 ‘하나님’으로 옮기되 소유격 관계를 자연스럽게 정리했습니다.
- source_word: εἰς ἀνάστημα
  english_pob_choice: for the exaltation
  chosen_korean: 높임을 위하여
  alternatives_korean:
  - 들어올림을 위하여
  - 고양을 위하여
  - 회복을 위하여
  lexicon: LSJ
  rationale: ἀνάστημα의 희귀성과 ‘높이다/세우다’의 의미를 반영해, 물리적 상승을 넘는 상태의 고양을 암시하는 ‘높임’으로 옮겼습니다.
- source_word: τῶν υἱῶν τοῦ λαοῦ αὐτοῦ
  english_pob_choice: of the sons of his people
  chosen_korean: 그분의 백성의 아들들
  alternatives_korean:
  - 그분의 백성
  - 그분의 백성의 자녀들
  lexicon: BDAG
  rationale: υἱῶν의 남성 복수 형태를 보존하여 ‘아들들’로 옮겼고, 무성별화하지 않았습니다.
theological_decisions:
- issue: δεόμεθα/ἐδέετο의 기도 행위 표현
  chosen_reading: 기도하고 있었습니다
  alternative_readings:
  - 간청하고 있었습니다
  - 애원하고 있었습니다
  rationale: 문맥상 하나님을 향한 요청이므로 기도의 의미를 분명히 드러내되, 지속성을 나타내는 미완료상도 살렸습니다.
  doctrine_reference: 'Translation philosophy: source-directed narrative aspect'
- issue: ἀνάστημα의 의미 범위
  chosen_reading: 높임
  alternative_readings:
  - 들어올림
  - 회복
  - 고양
  rationale: 이 단어는 단순 이동이 아니라 지위나 상태의 상승을 시사할 수 있으므로, 특정 교리적 해석을 앞서지 않는 ‘높임’으로 보존했습니다.
  doctrine_reference: POB lexical policy on rare terms
