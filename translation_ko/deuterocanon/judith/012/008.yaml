  source_fidelity: 수정이 필요합니다. 원문의 주어는 유딧(‘그녀’)인데, 초안은 ‘그분은’으로 옮겨 기도하는 주체를 하나님으로 바꾸었습니다. 또한 εἰς ἀνάστημα은 문맥상 목적을 나타내므로 ‘…아들들을 높이시도록’으로 자연스럽게 연결하는 편이 원문 관계를 더 충실히 반영합니다.
