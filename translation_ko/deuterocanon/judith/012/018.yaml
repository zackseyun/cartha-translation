translation:
  language: ko
  text: 그러자 유디트가 말했습니다. 「지금 마시겠습니다, 주님. 오늘 제 생명이 제 안에서 태어난 날부터의 그 모든 날보다 더 크게 여겨졌기 때문입니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘제 생명이 오늘 제 안에서 제 태어난 날부터의 그 모든 날보다 더 크게 되었습니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Πίομαι δή
  english_pob_choice: I will drink now
  chosen_korean: 지금 마시겠습니다
  alternatives_korean:
  - 이제 마시겠습니다
  - 마시겠습니다, 지금
  lexicon: LSJ
  rationale: 미래형/중간형의 자발적 응답을 한국어 합쇼체로 자연스럽게 옮기되, δή의 즉시성을 ‘지금’으로 반영했습니다.
- source_word: κύριε
  english_pob_choice: my lord
  chosen_korean: 주님
  alternatives_korean:
  - 내 주인님
  - 주인이시여
  lexicon: LSJ
  rationale: 홀로페르네스를 향한 정중한 호칭이므로 ‘주님’으로 살렸고, 신적 호칭이 아니라는 점은 문맥으로 유지했습니다.
- source_word: ἐμεγαλύνθη τὸ ζῆν μου ἐν ἐμοὶ
  english_pob_choice: my life has been magnified within me
  chosen_korean: 제 생명이 제 안에서 … 더 크게 여겨졌기 때문입니다
  alternatives_korean:
  - 제 삶이 제 안에서 크게 되었습니다
  - 제 생명이 제 안에서 영화롭게 되었습니다
  lexicon: LSJ
  rationale: μεγαλύνω의 ‘크게 하다/크게 되다’ 계열 의미를 살리면서도 한국어에서는 ‘생명이 … 더 크게 여겨졌다’로 옮겨 높아진 생명의 감각과 수동형의 결을 함께 반영했습니다.
- source_word: παρὰ πάσας τὰς ἡμέρας τῆς γενέσεώς μου
  english_pob_choice: beyond all the days since my birth
  chosen_korean: 태어난 날부터의 그 모든 날보다
  alternatives_korean:
  - 제 출생 이후의 모든 날보다
  - 제 생일부터의 모든 날보다
  lexicon: LSJ
  rationale: παρά + 대격의 비교 의미를 ‘~보다’로 옮기고, γενέσεως μου는 ‘태어난 날부터’로 자연스럽게 풀어 한국어의 시간 비교 구조를 유지했습니다.
theological_decisions:
- issue: ‘생명이 크게 되었다’는 표현의 보존 여부
  chosen_reading: 기쁨이나 번영으로 평탄화하지 않고, 생명이 내부에서 ‘더 크게 여겨졌다’는 높아진 표현을 유지했습니다.
  alternative_readings:
  - 제 삶이 정말 좋아졌습니다
  - 저는 오늘 가장 행복합니다
  rationale: 본문은 단순한 감정 진술보다 생명의 확장·고양을 말하므로, 그 수사적 긴장을 보존하는 쪽이 원문에 더 충실합니다.
  doctrine_reference: 'DOCTRINE.md: 원문이 지닌 해석적 긴장을 보존하고, 번역 전통으로 이를 평탄화하지 말 것.'
