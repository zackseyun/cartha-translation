  text: And Holofernes ordered the bodyguards not to hinder her[a]. So she remained in the camp for three days, and went out at night into the valley of Bethulia[b], and washed herself at the spring of water by the camp.
  footnotes:
  - marker: a
    text: Or 'ravine' or 'gorge' for 'valley.'
    reason: lexical_alternative
  - marker: b
    text: The Greek verb here is the same root later used for 'baptize'; in this context it refers to washing or bathing, not Christian baptism.
    reason: lexical_alternative
