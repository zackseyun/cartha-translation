  lexicon: LSJ
  rationale: 직역에 가깝게 유지하되, 문맥상 ‘여행 중 지닌 물품’으로 읽히도록 일반적 표현을 택했습니다.
- source_word: δύναμιν
  english_pob_choice: provisions
  chosen_korean: 양식
  alternatives_korean:
  - 식량
  - 공급물
  - 보급품
  lexicon: LSJ
  rationale: δύναμις의 통상 의미와 달리 여기서는 문맥상 생존에 필요한 먹을거리/보급을 가리키므로, 한국어에서는 가장 자연스러운 ‘양식’으로 옮겼습니다.
- source_word: ἐκ τοῦ ἔθνους σου
  english_pob_choice: from your nation
  chosen_korean: 당신의 민족 사람 가운데
  alternatives_korean:
  - 당신의 나라에서
  - 당신의 백성 가운데
  - 당신의 민족에서
  lexicon: LSJ
  rationale: ἔθνος의 민족적 집단 의미를 살리면서, 문장 끝의 ‘우리와 함께 있는 사람이 없기 때문입니다’와 자연스럽게 이어지도록 다듬었습니다.
