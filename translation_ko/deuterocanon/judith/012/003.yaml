  yaml_path: translation/deuterocanon/judith/012/003.yaml
  text: And Holofernes said to her[a], “But if the things you have with you run out, from where shall we get for you provisions like them? For there is no one with us from your nation.”
  footnotes:
  - marker: a
    text: Or “food” or “supplies” for “provisions”; the Greek uses δύναμιν here in an unusual contextual sense, apparently referring to sustenance rather than power or strength.
    reason: lexical_alternative
translation:
  language: ko
  text: 홀로페르네스가 그녀에게 말했습니다. 「그러나 만일 당신이 가지고 있는 것들이 떨어지면, 우리가 어디에서 당신에게 그와 같은 양식을 구해 오겠습니까? 당신의 민족 사람 가운데는 우리와 함께 있는 사람이 없기 때문입니다」.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 여기서 δύναμις는 보통의 ‘힘’이 아니라 문맥상 ‘양식’ 또는 ‘보급품’에 가깝습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκλίπῃ
  english_pob_choice: run out
  chosen_korean: 떨어지면
  alternatives_korean:
  - 다 떨어지면
  - 없어지면
  - 고갈되면
  lexicon: LSJ
  rationale: 소지한 물품의 소진을 자연스럽게 풀면서도, 원문의 ‘fail/give out’ 의미를 유지합니다.
- source_word: τὰ μετὰ σοῦ ὄντα
  english_pob_choice: the things you have with you
  chosen_korean: 당신이 가지고 있는 것들
  alternatives_korean:
  - 당신과 함께 있는 것들
  - 당신이 지닌 물품들
  - 당신의 소지품
  lexicon: LSJ
  rationale: 직역에 가깝게 유지하되, 문맥상 ‘여행 중 지닌 물품’으로 읽히도록 일반적 표현을 택했습니다.
- source_word: δύναμιν
  english_pob_choice: provisions
  chosen_korean: 양식
  alternatives_korean:
  - 식량
  - 공급물
  - 보급품
  lexicon: LSJ
  rationale: δύναμις의 통상 의미와 달리 여기서는 문맥상 생존에 필요한 먹을거리/보급을 가리키므로, 한국어에서는 가장 자연스러운 ‘양식’으로 옮겼습니다.
- source_word: ἐκ τοῦ ἔθνους σου
  english_pob_choice: from your nation
  chosen_korean: 당신의 민족 사람 가운데
  alternatives_korean:
  - 당신의 나라에서
  - 당신의 백성 가운데
  - 당신의 민족에서
  lexicon: LSJ
  rationale: ἔθνος의 민족적 집단 의미를 살리면서, 문장 끝의 ‘우리와 함께 있는 사람이 없기 때문입니다’와 자연스럽게 이어지도록 다듬었습니다.
