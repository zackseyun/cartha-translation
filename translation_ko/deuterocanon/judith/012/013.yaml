base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/012/013.yaml
  text: And Bagoas went out from the presence of Holofernes and went in to her and said[a], “Let this beautiful young woman not hesitate to come to my lord, to be honored before him, and to drink wine with us in gladness[b], and to become on this day like one of the daughters of the Assyrians who stand in the house of Nebuchadnezzar.”
  footnotes:
  - marker: a
    text: Or 'maidservant' for 'girl' (ἡ παιδίσκη); the Greek term can denote a female servant or slave girl, but here it functions as flattering address.
    reason: lexical_alternative
  - marker: b
    text: Or 'who attend in the house of Nebuchadnezzar' for 'who stand in the house of Nebuchadnezzar.'
    reason: lexical_alternative
translation:
  language: ko
  text: 보가오스가 오홀로페르네스의 앞에서 나와 그녀에게 들어가 말했습니다. “이 아름다운 젊은 여인이 지체하지 말고 내 주께 와서 그의 앞에서 영예를 얻고, 우리와 함께 포도주로 즐거워하며, 오늘 이 날에 아시리아 사람들의 딸들 가운데 하나처럼, 곧 느부갓네살의 집에 서 있는 이들과 같아지게 하십시오.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하녀’로도 옮길 수 있습니다. ἡ παιδίσκη는 여성 종이나 노예 소녀를 가리킬 수 있으나, 여기서는 아첨하는 호칭으로 기능합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘느부갓네살의 집에서 시중드는 이들과’로 옮길 수 있습니다. παρεστηκυῖαι는 문자적으로 ‘곁에 서 있는’ 뜻이지만, 궁정 시종의 의미를 띱니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ προσώπου
  english_pob_choice: from the presence of
  chosen_korean: 앞에서
  alternatives_korean:
  - 앞으로부터
  - 면전에서
  lexicon: LSJ
  rationale: 궁정적 관용구인 ‘from the presence of’의 대면·이탈 뉘앙스를 한국어에서도 자연스럽게 살렸습니다.
- source_word: ὀκνήσῃς
  english_pob_choice: Let ... not hesitate
  chosen_korean: 지체하지 말고
  alternatives_korean:
  - 주저하지 말고
  - 망설이지 말고
  lexicon: BDAG
  rationale: 초청·권유의 문맥에서 ‘지체하지 말고’가 현대 한국어로 가장 자연스럽고, 단순한 시간 지연이 아니라 머뭇거림까지 포괄합니다.
- source_word: ἡ παιδίσκη ἡ καλὴ αὕτη
  english_pob_choice: this beautiful young woman
  chosen_korean: 이 아름다운 젊은 여인
  alternatives_korean:
  - 이 아름다운 소녀
  - 이 예쁜 하녀
  lexicon: LSJ
  rationale: παιδίσκη의 사회적 신분을 과도하게 부각하기보다, 본문에서 드러나는 아첨 섞인 호칭과 젊은 여성이라는 의미를 함께 살렸습니다.
- source_word: κατὰ πρόσωπον αὐτοῦ
  english_pob_choice: before him
  chosen_korean: 그의 앞에서 영예를 얻고
  alternatives_korean:
  - 그 앞에서 존귀를 얻고
  - 그의 면전에서 영광을 받고
  lexicon: LSJ
  rationale: δόξασθῆναι는 여기서 신학적 ‘영광’보다 ‘존귀를 얻다/예우를 받다’의 뜻이므로, 아첨하는 궁정 말투를 반영해 번역했습니다.
- source_word: εἰς εὐφροσύνην οἴνου
  english_pob_choice: in gladness of wine
  chosen_korean: 포도주로 즐거워하며
  alternatives_korean:
  - 포도주의 즐거움 가운데
  - 포도주 잔치의 기쁨 가운데
  lexicon: LSJ
  rationale: εὐφροσύνη와 οἶνος의 결합을 한국어에서 어색하지 않게 압축하되, 술자리의 축제적 분위기를 드러냈습니다.
- source_word: ὡς θυγάτηρ μία
  english_pob_choice: like one of the daughters
  chosen_korean: 딸들 가운데 하나처럼
  alternatives_korean:
  - 한 딸처럼
  - 딸들 중 하나처럼
  lexicon: LSJ
  rationale: ‘한 사람처럼’의 단순 비교보다, 아시리아 여성 집단에 편입되는 뉘앙스를 보존하기 위해 복수군 속 한 사람으로 옮겼습니다.
theological_decisions:
- issue: κύριος의 인간 상관 호칭 번역
  chosen_reading: 내 주
  alternative_readings:
  - 나의 주님
  - 내 주인
  rationale: 여기서 κύριος는 하나님이 아니라 홀로페르네스를 가리키는 궁정 호칭이므로, 신적 표제와 혼동되지 않도록 ‘내 주’로 옮겼습니다.
  doctrine_reference: 'DOCTRINE.md: κύριος의 문맥적 인간 호칭 사용'
- issue: δόξασθῆναι의 의미 범위
  chosen_reading: 영예를 얻고
  alternative_readings:
  - 영광을 받고
  - 영화롭게 되고
  rationale: 이 장면은 하나님께 대한 신학적 영광이 아니라 왕 앞에서의 예우·승격을 뜻하므로, 독자가 종교적 의미로 오해하지 않도록 조정했습니다.
  doctrine_reference: 'POB style guide: preserve lexical tension without ecclesial domestication'
