translation:
  language: ko
  text: 그녀는 그것을 받아 그 앞에서 자기 여종이 마련해 둔 것을 먹고 마셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘자기 여노예’. 그리스어는 ‘그녀의 여성 노예’(ἡ δούλη αὐτῆς)입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: λαβοῦσα
  english_pob_choice: taking it
  chosen_korean: 그것을 받아들여
  alternatives_korean:
  - 그것을 가지고
  - 그것을 받은 뒤
  lexicon: SBLGNT / BDAG
  rationale: 분사 λαβοῦσα는 앞선 동작을 나타내므로, 한국어에서도 뒤따르는 본동사 전에 놓아 자연스러운 선행 동작으로 살렸습니다. 문맥상 대상이 생략되어 있으므로 ‘그것’을 보충했습니다.
- source_word: κατέναντι αὐτοῦ
  english_pob_choice: before him
  chosen_korean: 그 앞에서
  alternatives_korean:
  - 그 앞에
  - 그와 마주하여
  lexicon: BDAG
  rationale: 연회 자리에서 홀로페르네스 앞이라는 공간 관계를 간결하게 드러내는 표현으로 옮겼습니다.
- source_word: ἃ ἡτοίμασεν
  english_pob_choice: what ... had prepared
  chosen_korean: 그것은 ... 마련해 둔 것이었습니다
  alternatives_korean:
  - 그녀가 준비한 것이었습니다
  - 그녀가 미리 마련한 것이었습니다
  lexicon: BDAG
  rationale: 관계대명사 ἃ는 앞서 가리킨 음식과 음료를 집합적으로 받으므로, 한국어에서는 지시 성분을 앞뒤로 분리하지 않고 뒤 문장으로 자연스럽게 풀었습니다. ἡτοίμασεν의 선행 완료성은 ‘마련해 둔’으로 살렸습니다.
- source_word: ἡ δούλη αὐτῆς
  english_pob_choice: her female slave
  chosen_korean: 그녀의 여종
  alternatives_korean:
  - 그녀의 여자 종
  - 그녀의 여노예
  lexicon: BDAG
  rationale: δούλη는 여성형 ‘종’으로, 이 문맥에서는 준비를 맡은 하인 여성이라는 의미가 분명하지만 한국어에서는 ‘여종’이 합쇼체 서술에 가장 자연스럽습니다. 다만 영어 POB의 ‘female slave’처럼 bonded status를 더 노출하는 대안도 가능함을 보존합니다.
theological_decisions:
- issue: δούλη의 사회적 강도 표현
  chosen_reading: ‘여종’으로 옮기되, 본문 의미는 여성 종속 신분을 유지합니다.
  alternative_readings:
  - ‘여노예’
  - ‘여자 종’
  rationale: 이 절은 서사적으로 식사 준비를 맡은 인물을 가리키며, 한국어에서 지나치게 거친 ‘노예’는 문체상 과도할 수 있습니다. 그러나 ‘여종’은 여성을 뜻하는 동시에 종속적 신분을 유지해 원문의 의미를 훼손하지 않습니다.
  doctrine_reference: 'DOCTRINE.md: δοῦλος/δούλη 기본 원칙과 문맥 적합성'
