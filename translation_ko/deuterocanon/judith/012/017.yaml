    reason: lexical_alternative
lexical_decisions:
- source_word: Πίε δὴ
  english_pob_choice: Do drink
  chosen_korean: 마시십시오
  alternatives_korean:
  - 드십시오
  - 한잔하십시오
  - 마시지요
  lexicon: LSJ
  rationale: 피에는 πίνω의 aorist 명령형으로, 여기서는 강한 권유를 담은 직접 명령입니다. 한국어에서는 어색한 강조 부사 없이 존대 명령형 ‘마시십시오’가 가장 자연스럽고 원문의 촉구를 잘 살립니다.
- source_word: δὴ
  english_pob_choice: Do
  chosen_korean: (명시 번역 없음)
  alternatives_korean:
  - 과연
  - 이제
  - 정녕
  lexicon: LSJ
  rationale: δή는 명령을 강조하거나 재촉하는 기능을 하므로, 한국어에서는 별도 부사 없이 문맥의 어조와 존대 명령으로 그 힘을 반영했습니다.
- source_word: γενήθητι μεθʼ ἡμῶν εἰς εὐφροσύνην
  english_pob_choice: join us in gladness
  chosen_korean: 우리와 함께 즐거워하십시오
  alternatives_korean:
  - 우리와 함께 기쁨 가운데 있으십시오
  - 우리와 함께 흥겨워하십시오
  - 우리와 함께 기쁜 자리에 합류하십시오
  lexicon: LSJ
  rationale: γενήθητι는 문자적으로 ‘되다’이지만, 여기서는 함께 잔치의 기쁨에 참여하라는 관용적 표현입니다. ‘즐거워하십시오’는 그 참여적 의미를 살리면서도 원문의 축제적 분위기를 자연스럽게 전달합니다.
- source_word: εὐφροσύνην
  english_pob_choice: gladness
  chosen_korean: 즐거움
  alternatives_korean:
  - 기쁨
  - 흥겨움
  - 잔치의 즐거움
  lexicon: LSJ
  rationale: εὐφροσύνη는 단순한 감정보다 잔치의 즐거움, 흥겨움을 뜻하므로 ‘즐거움’이 가장 무난하게 어울립니다. ‘기쁨’보다 이 장면의 연회 분위기를 더 잘 드러냅니다.
theological_decisions:
- issue: 연회 초대의 어조
  chosen_reading: 오로페르네스의 말은 단순한 친절이 아니라 술자리 참여를 재촉하는 유혹적 초대입니다.
  alternative_readings:
  - 중립적인 환대의 권유
  - 가벼운 사교적 초대
  rationale: 원문의 명령형과 δή의 강조는 초대의 강도를 높입니다. 한국어도 이를 완화하지 않고 재촉의 뉘앙스를 유지했습니다.
  doctrine_reference: 문맥 주해
