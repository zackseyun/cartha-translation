base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/012/005.yaml
  text: And Holofernes’s attendants brought her into the tent[a], and she slept until the middle of the night; then she rose at the morning watch[b],
  footnotes:
  - marker: a
    text: Or 'until midnight.' The Greek literally says 'until the night was in its middle.'
    reason: lexical_alternative
  - marker: b
    text: The 'morning watch' refers to an ancient night-watch division near dawn.
    reason: cultural_note
translation:
  language: ko
  text: 그리고 오홀리바르의 부하들이 그녀를 천막으로 데려갔고, 그녀는 밤의 한가운데까지 잠들어 있었으며, 그 뒤 새벽 경계에 일어났습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘자정까지.’ 그리스어는 문자적으로 ‘밤이 한가운데에 있을 때까지’라고 합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘새벽 경계’는 밤의 경계 구분 가운데 새벽 무렵을 가리키는 고대식 시간 표현입니다.
    reason: cultural_note
lexical_decisions:
- source_word: οἱ θεράποντες Ὁλοφέρνου
  english_pob_choice: Holofernes’s attendants
  chosen_korean: 오홀리바르의 부하들
  alternatives_korean:
  - 오홀로페르네스의 시종들
  - 홀로페르네스의 시종들
  - 홀로페르네스의 부하들
  lexicon: LSJ
  rationale: θεράποντες는 지위가 딸린 수행자·시종·부하를 아우를 수 있으므로, 전투·궁정 맥락을 살려 ‘부하들’로 옮겼습니다. 이름은 한국어 독자에게 더 자연스러운 음역인 오홀리바르를 택했습니다.
- source_word: εἰς τὴν σκηνήν
  english_pob_choice: into the tent
  chosen_korean: 천막으로
  alternatives_korean:
  - 텐트로
  - 장막으로
  - 천막 안으로
  lexicon: LSJ
  rationale: σκηνή는 이 문맥에서 군영의 천막을 뜻하므로, 현대 한국어에서 가장 분명한 ‘천막’으로 옮겼습니다.
- source_word: μέχρι μεσούσης τῆς νυκτός
  english_pob_choice: until the middle of the night
  chosen_korean: 밤의 한가운데까지
  alternatives_korean:
  - 자정까지
  - 밤중까지
  - 한밤중까지
  lexicon: LSJ
  rationale: 그리스어는 ‘밤이 한가운데에 이르기까지’라는 직역형 표현이므로, 의미는 분명하게 하되 ‘자정’으로 좁히지 않고 ‘밤의 한가운데까지’로 유지했습니다.
- source_word: πρὸς τὴν ἑωθινὴν φυλακήν
  english_pob_choice: at the morning watch
  chosen_korean: 새벽 경계에
  alternatives_korean:
  - 새벽 감시 때
  - 아침 경계에
  - 새벽 순찰 때
  lexicon: LSJ
  rationale: φυλακή는 밤의 경계·보초 시간을 가리킬 수 있으므로, 전통적 ‘새벽 경계’를 써서 고대의 야간 경계 구분을 살렸습니다. '경계'는 시간대와 보초 개념을 함께 담습니다.
theological_decisions:
- issue: 이동 동사의 서술 강도
  chosen_reading: ‘데려갔고’로 단순한 이동을 표현했습니다.
  alternative_readings:
  - 이끌고 갔고
  - 안으로 데려갔고
  - 데리고 들어갔고
  rationale: 원문은 단순한 인도 동사 ἤγαγον을 사용하므로, 과도한 해석을 피하고 사건의 진행만 드러내는 표현을 택했습니다.
  doctrine_reference: 원문 서술의 최소화 원칙
- issue: 야간 시간 표현의 해석
  chosen_reading: ‘밤의 한가운데까지’로 직역에 가까운 형태를 유지했습니다.
  alternative_readings:
  - 자정까지
  - 한밤중까지
  rationale: 영문 POB 주석이 밝히듯 이 표현은 곧바로 ‘자정’으로 환원되지 않으므로, 원문이 가진 시간표현의 여지를 보존했습니다.
  doctrine_reference: 본문 시간표현의 보존
