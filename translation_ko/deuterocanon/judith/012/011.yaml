  source_fidelity: 초안의 ‘데려오도록’은 τοῦ ἐλθεῖν πρὸς ἡμᾶς(‘우리에게 오도록’)보다 강한 이동·호송의 의미를 더합니다. 본문은 바고아스가 그 여인이 오도록 설득하라는 명령입니다. 이를 ‘우리에게 와서’로 바로잡았습니다. 관리 책임을 나타내는 ἐφεστηκὼς ἐπὶ πάντων τῶν αὐτοῦ는 ‘그의 모든 일을 맡아보던’으로 자연스럽게 유지할 수 있습니다.
  naturalness: 합쇼체 서술과 명령의 조합은 자연스럽습니다. ‘히브리 여자’도 현대 표준어에서 이해 가능하나, 본문의 격식을 살려 ‘히브리 여인’으로 다듬었습니다. 각주 표지는 해당 어휘 바로 뒤에 놓는 편이 독자에게 명확합니다.
