  text: And he said to Bagoas the eunuch[a], who was in charge of all that belonged to him[b], “Go now and persuade the Hebrew woman who is with you to come to us and eat and drink with us.”
  footnotes:
  - marker: a
    text: Or 'convince' or 'urge' for 'persuade' (Πεισὸν); the command is to induce her to come.
    reason: lexical_alternative
  - marker: b
    text: '''Eunuch'' can in some contexts mean a high court official, but the Greek word here is rendered literally.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 그의 모든 일을 맡아보던 내시[a] 바고아스에게 말했습니다. “이제 가서 너와 함께 있는 히브리 여인이 우리에게 와서 우리와 함께 먹고 마시도록 설득하십시오.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘내시’는 이 구절의 그리스어를 문자적으로 옮긴 것입니다. 이 말은 어떤 문맥에서는 궁정 관리를 가리키는 넓은 뜻으로도 쓰입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘설득하십시오’는 Πεισὸν의 기본 의미를 따른 것이며, ‘권하십시오’ 또는 ‘납득시키십시오’로도 옮길 수 있습니다.
    reason: lexical_alternative
