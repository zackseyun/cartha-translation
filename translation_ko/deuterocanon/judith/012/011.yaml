- from: 그리고 그는 자기의 모든 것을 맡아보던 바고아스 내시에게 말했습니다. “이제 가서 너와 함께 있는 히브리 여자를 우리에게 데려오도록 설득하여 우리와 함께 먹고 마시게 하십시오.”[a][b]
  to: 그는 그의 모든 일을 맡아보던 내시[a] 바고아스에게 말했습니다. “이제 가서 너와 함께 있는 히브리 여인이 우리에게 와서 우리와 함께 먹고 마시도록 설득하십시오.[b]”
  rationale: ‘데려오도록’을 ‘우리에게 와서’로 바꾸어 원문의 이동 동사와 설득 명령의 관계를 보존했습니다. 또한 각주 표지를 해당 낱말에 붙여 참조 대상을 명확히 했고, 나머지 핵심 용어와 합쇼체 문체는 유지했습니다.
