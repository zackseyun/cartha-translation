  yaml_path: translation/deuterocanon/judith/012/009.yaml
  text: And when she went in[a], she remained in the tent purified until she brought in her food toward evening.
  footnotes:
  - marker: a
    text: Or 'clean' or 'ritually clean.' The Greek adjective can denote purity in a general or ritual sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그녀는 들어가서 정결한 상태로 천막에 머물렀으며, 저녁 무렵에 자기 음식을 가져올 때까지 그곳에 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '깨끗한' 또는 '의례적으로 깨끗한.' 헬라어 형용사는 일반적인 깨끗함이나 의례적 정결을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσπορευομένη
  english_pob_choice: when she went in
  chosen_korean: 들어갈 때에는
  alternatives_korean:
  - 들어가면서
  - 들어가면
  - 들어갔을 때
  lexicon: BDAG
  rationale: 현재 분사의 시간적 용법을 한국어로 자연스럽게 풀어, 단순한 진입 동작과 시간 배경을 함께 살렸습니다.
- source_word: καθαρά
  english_pob_choice: purified
  chosen_korean: 깨끗한 상태로
  alternatives_korean:
  - 정결한 상태로
  - 깨끗하게
  - 정결하게
  lexicon: LSJ
  rationale: 본문의 καθαρά는 일반적 깨끗함과 의례적 정결을 모두 열어 두므로, 본문에 과도한 기술어를 넣지 않고 의미 범위를 보존했습니다.
- source_word: τῇ σκηνῇ
  english_pob_choice: in the tent
  chosen_korean: 천막에
  alternatives_korean:
  - 텐트에
  - 장막에
  - 천막 안에
  lexicon: LSJ
  rationale: σκηνή의 기본 의미를 직접 반영하되, 한국어 성경 문체에서 자연스러운 '천막'을 택했습니다.
- source_word: πρὸς ἑσπέραν
  english_pob_choice: toward evening
  chosen_korean: 저녁 무렵에
  alternatives_korean:
  - 저녁을 향하여
  - 저녁 때에
  - 해질 무렵에
  lexicon: LSJ
  rationale: πρός + 시간 표현의 접근성을 살리면서도, 한국어에서 어색하지 않은 '저녁 무렵에'로 옮겼습니다.
theological_decisions:
- issue: καθαρά의 정결/위생적 뉘앙스 처리
  chosen_reading: 본문에서는 '깨끗한 상태로'라고 하여 의례적 정결 가능성을 열어 두되, 본문 자체에 없는 '의례적으로'를 덧붙이지 않았습니다.
  alternative_readings:
  - 정결한 상태로
  - 의례적으로 깨끗한 상태로
  rationale: 유딧서의 정황상 정결 실천이 암시되지만, 헬라어 형용사 자체는 일반적/의례적 의미를 모두 가질 수 있으므로 과잉 특정화를 피했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
