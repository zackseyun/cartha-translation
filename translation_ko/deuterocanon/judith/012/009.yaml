- from: 그리고 그녀가 들어갈 때에는 깨끗한 상태로 천막에 머물렀다가, 저녁 무렵에 자기 음식을 가져올 때까지 그렇게 있었습니다.[a]
  to: 그리고 그녀는 들어가서 정결한 상태로 천막에 머물렀으며, 저녁 무렵에 자기 음식을 가져올 때까지 그곳에 있었습니다.[a]
