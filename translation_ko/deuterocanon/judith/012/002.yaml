  text: And Judith said[a], “I will not eat from them, lest it become a stumbling block; instead, provision will be made for me from the things that have accompanied me.”
  footnotes:
  - marker: a
    text: Or 'an offense' or 'a scandal.' The Greek σκάνδαλον can denote a cause of stumbling, offense, or downfall.
    reason: lexical_alternative
translation:
  language: ko
  text: 이에 유디트가 말했습니다. “나는 그것들을 먹지 않겠습니다. 그렇게 하면 걸림돌이 되지 않게 하려는 것입니다. 오히려 나와 함께 온 것들로부터 공급을 받겠습니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 σκάνδαλον은 ‘걸림돌’, ‘오해’, ‘추문’처럼 다양한 뜻을 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐ φάγομαι
  english_pob_choice: I will not eat
  chosen_korean: 나는 그것들을 먹지 않겠습니다
  alternatives_korean:
  - 나는 먹지 않겠습니다
  - 나는 그것들로부터 먹지 않겠습니다
  lexicon: LSJ
  rationale: 미래의 단순한 거절을 한국어의 자연스러운 부정 의지형으로 옮기되, 문맥상 이미 제시된 음식들을 가리키는 대상을 드러냈습니다.
- source_word: σκάνδαλον
  english_pob_choice: a stumbling block
  chosen_korean: 걸림돌
  alternatives_korean:
  - 장애물
  - 실족하게 하는 것
  - 스캔들
  lexicon: LSJ
  rationale: 비유적·도덕적 위험을 보존하려고 직역적 이미지인 ‘걸림돌’을 택했고, 단순한 사회적 추문으로 좁히지 않았습니다.
- source_word: ἐκ τῶν ἠκολουθηκότων μοι
  english_pob_choice: from the things that have accompanied me
  chosen_korean: 나와 함께 온 것들로부터
  alternatives_korean:
  - 나를 따라온 것들로부터
  - 내가 가져온 것들로부터
  - 함께 따라온 것들로부터
  lexicon: LSJ
  rationale: 완료분사 ἠκολουθηκότων의 ‘함께/따라온’ 이미지를 살리면서도, 한국어에서 자연스럽게 이해되도록 ‘나와 함께 온 것들’로 풀었습니다.
- source_word: χορηγηθήσεται
  english_pob_choice: will be made / will be provided
  chosen_korean: 공급을 받겠습니다
  alternatives_korean:
  - 공급될 것입니다
  - 제공받겠습니다
  - 마련될 것입니다
  lexicon: LSJ
  rationale: 수동 미래의 공급·조달 의미를 살려, 주체가 드러나지 않는 형태를 한국어에서 자연스럽게 표현했습니다.
