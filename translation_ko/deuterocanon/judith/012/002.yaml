  chosen_reading: ‘걸림돌’로 옮겨, 의례적 부정함과 도덕적 위험을 함께 암시하도록 했습니다.
  alternative_readings:
  - 오해
  - 추문
  - 실족
  rationale: 문맥은 단순한 체면 문제보다 하나님의 뜻 앞에서의 부정/위험을 피하려는 말로 읽히므로, 의미 범위를 너무 좁히지 않았습니다.
  doctrine_reference: 'DOCTRINE.md: Preserve theological tension rather than resolve it; consistency of key terms, or documented exception.'
