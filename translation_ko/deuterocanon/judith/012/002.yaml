  verdict: revise
  source_fidelity: 초안은 먹기를 거절한다는 뜻과 동반해 온 물품에서 공급받는다는 뜻을 대체로 보존합니다. 그러나 ἵνα μὴ γένηται σκάνδαλον은 목적/회피 절로 자연스럽게 연결되어야 하는데, ‘그렇게 하면 … 하려는 것입니다’는 조건과 의도를 부정확하고 어색하게 분리합니다. 또한 χορηγηθήσεται의 비인칭적 미래 수동은 ‘공급을 받겠습니다’보다 ‘필요한 것이 마련될 것입니다’가 더 충실합니다.
  naturalness: ‘그렇게 하면 걸림돌이 되지 않게 하려는 것입니다’는 현대 한국어 합쇼체 인용문으로 부자연스럽고, 무엇이 걸림돌이 되는지도 불명확합니다. ‘걸림돌이 되지 않도록’으로 절을 직접 연결하고, 마지막 절은 ‘나와 함께 온 것들로 내게 필요한 것이 마련될 것입니다’로 다듬는 것이 자연스럽습니다.
  terminology: σκάνδαλον의 비유를 ‘걸림돌’로 유지하는 것은 적절합니다. 다만 각주 대안인 ‘오해’는 이 문맥의 어휘 범위를 지나치게 약화하므로, ‘실족하게 하는 것’, ‘거리낌’, ‘추문’ 등으로 제시하는 편이 낫습니다.
  issues:
