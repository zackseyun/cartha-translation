    issue: ἵνα μὴ γένηται σκάνδαλον 절의 연결이 부정확하고 부자연스럽습니다.
    rationale: 그리스어는 ‘걸림돌이 되지 않도록/되지 않게 하려고’라는 회피 목적을 나타냅니다. 초안의 ‘그렇게 하면 … 하려는 것입니다’는 조건절처럼 들리고, 주절과의 문법적 연결도 매끄럽지 않습니다.
