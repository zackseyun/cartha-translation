    rationale: χορηγηθήσεται는 ‘공급될/마련될 것이다’라는 비인칭적 수동 표현입니다. ‘공급을 받겠습니다’는 화자의 능동적 수혜 진술로 바뀌며, 원문의 ‘내게’(μοι)와 공급의 근원을 더 명료하게 나타낼 필요가 있습니다.
