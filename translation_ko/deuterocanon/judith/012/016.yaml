base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/012/016.yaml
  text: And when she entered[a], Judith reclined, and the heart of Holofernes was beside itself over her; his soul was shaken. He was very eager to have relations with her[b], and he was watching for an opportunity to deceive her from the day he saw her.
  footnotes:
  - marker: a
    text: Or 'to seduce her' or 'to trick her.' The Greek says 'to deceive her,' which may include sexual manipulation in context.
    reason: lexical_alternative
  - marker: b
    text: '''Reclined'' reflects the banquet custom of dining while lying back at table.'
    reason: cultural_note
translation:
  language: ko
  text: 그리고 그가 들어가자, 유디트는 기대었습니다. 그러자 홀로페르네스의 마음이 그녀 때문에 어쩔 줄 몰라 했고, 그의 영이 흔들렸습니다. 그는 그녀와 관계를 맺고 싶어 몹시 간절해했으며, 그녀를 속일 기회를 그녀를 본 날부터 지켜보고 있었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문은 ‘속이다/기만하다’를 뜻하는 동사를 사용하지만, 문맥상 성적 유혹과 착취가 함께 암시됩니다.
    reason: source_note
  - marker: b
    text: ‘기대었습니다’는 고대 연회에서 식사할 때 몸을 비스듬히 기대는 관습을 반영한 번역입니다.
    reason: cultural_note
lexical_decisions:
- source_word: εἰσελθοῦσα
  english_pob_choice: when she entered
  chosen_korean: 들어가자
  alternatives_korean:
  - 들어간 뒤
  - 그가 들어가자
  lexicon: LSJ
  rationale: 부사절로 기능하는 분사 구조를 한국어의 자연스러운 시간 연결로 옮겼습니다. 문맥상 유디트의 입장 직후를 나타내므로 간결한 ‘들어가자’가 가장 적절합니다.
- source_word: ἀνέπεσεν
  english_pob_choice: reclined
  chosen_korean: 기대었습니다
  alternatives_korean:
  - 누웠습니다
  - 식탁에 기대었습니다
  lexicon: LSJ
  rationale: 연회 자리에서의 식사 관습을 반영하면서도 단순히 눕는 것으로 오해되지 않도록 했습니다. 한국어에서 ‘기대다’는 누워 앉는 자세를 자연스럽게 전달합니다.
- source_word: ἐξέστη ἡ καρδία Ὀλοφέρνου ἐπʼ αὐτῇ
  english_pob_choice: the heart of Holofernes was beside itself over her
  chosen_korean: 홀로페르네스의 마음이 그녀 때문에 어쩔 줄 몰라 했고
  alternatives_korean:
  - 홀로페르네스의 마음이 그녀에게서 벗어나 있었고
  - 홀로페르네스의 마음이 그녀 때문에 혼란스러웠고
  lexicon: LSJ
  rationale: 심장/마음의 의인화와 격한 동요를 살리되, 한국어에서 자연스러운 관용으로 옮겼습니다. ‘어쩔 줄 몰라 했다’는 과도한 해석 없이 동요의 강도를 전달합니다.
- source_word: ἐσαλεύθη ἡ ψυχὴ αὐτοῦ
  english_pob_choice: his soul was shaken
  chosen_korean: 그의 영이 흔들렸습니다
  alternatives_korean:
  - 그의 혼이 흔들렸습니다
  - 그의 마음이 흔들렸습니다
  lexicon: LSJ
  rationale: ψυχή의 내면 생명 언어를 평이한 ‘마음’으로 약화시키지 않기 위해 ‘영’을 사용했습니다. 다만 한국어 독자를 위해 ‘혼’보다 비교적 직접적인 ‘영’을 택했습니다.
- source_word: τοῦ συγγενέσθαι μετʼ αὐτῆς
  english_pob_choice: to have relations with her
  chosen_korean: 그녀와 관계를 맺고 싶어
  alternatives_korean:
  - 그녀와 잠자리를 함께하고 싶어
  - 그녀와 동침하고 싶어
  lexicon: LSJ
  rationale: 그리스어의 완곡한 성적 표현을 그대로 과도하게 노골화하지 않으면서도 의미를 분명히 했습니다. ‘관계를 맺다’는 본문의 의도를 드러내는 현대적 완곡어입니다.
- source_word: τοῦ ἀπατῆσαι αὐτὴν
  english_pob_choice: to deceive her
  chosen_korean: 그녀를 속일 기회를
  alternatives_korean:
  - 그녀를 기만할 기회를
  - 그녀를 속여 넘어뜨릴 기회를
  lexicon: LSJ
  rationale: 동사의 핵심 의미인 ‘속이다/기만하다’를 반영했습니다. 문맥상 성적 유인이 얽혀 있지만, 본문 자체의 동사는 더 넓은 ‘속임’이므로 그 범위를 유지했습니다.
theological_decisions:
- issue: 연회 자세를 나타내는 ἀνέπεσεν의 문화적 함의
  chosen_reading: ‘기대었습니다’로 옮겨 연회에서 비스듬히 기대어 식사하는 장면을 암시했습니다.
  alternative_readings:
  - ‘누웠습니다’
  - ‘식탁에 자리를 잡았습니다’
  rationale: 본문의 배경은 단순한 수면 자세가 아니라 고대 연회 관습입니다. 한국어에서도 그 문화적 배경이 드러나도록 하되, 설명을 과도하게 늘리지 않았습니다.
  doctrine_reference: source fidelity and cultural contextualization
