  to: 유디트가 들어와 자리에 기대어 앉자[b], 홀로페르네스의 마음은 그녀 때문에 넋을 잃었고, 그의 영혼이 흔들렸습니다. 그는 그녀와 관계를 맺기를 몹시 갈망했으며, 그녀를 속일[a] 기회를 그녀를 본 날부터 엿보고 있었습니다.
