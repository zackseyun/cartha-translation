  source_fidelity: 원문의 ἀπʼ αὐτῆς는 홀로페르네스의 기쁨이 그녀에게서 비롯되었음을 나타내며, ‘그녀로 인해’는 이를 적절히 반영합니다. 다만 초안의 ‘곧’과 분리된 ‘하루에 마신 것입니다’는 ὅσον … ἐν ἡμέρᾳ μιᾷ의 비교 범위를 불명료하게 합니다. 비교절을 음주 행위에 직접 연결해야 합니다.
