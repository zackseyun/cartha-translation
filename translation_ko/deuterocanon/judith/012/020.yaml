base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/012/020.yaml
  text: And Holofernes was delighted with her[a], and he drank a very great amount of wine—as much as he had never drunk in a single day since he was born.
  footnotes:
  - marker: a
    text: Or, 'because of her' or 'by her,' indicating that Judith was the cause of Holofernes's delight.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 홀로페르네스는 그녀로 인해 기뻐하였고, 태어난 이래 하루 동안 한 번도 마신 적이 없을 만큼 포도주를 아주 많이 마셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그녀에게서’입니다. 문맥상 그녀가 홀로페르네스의 기쁨의 원인 또는 계기였음을 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠυφράνθη
  english_pob_choice: was delighted
  chosen_korean: 기뻐하였고
  alternatives_korean:
  - 즐거워하였고
  - 흡족해하였고
  lexicon: LSJ
  rationale: 수동/중간형의 상태 변화를 자연스러운 합쇼체로 옮기되, 과장된 감정어를 피하고 원문의 ‘기쁨/즐거움’ 반응을 살렸습니다.
- source_word: ἀπʼ αὐτῆς
  english_pob_choice: with her
  chosen_korean: 그녀로 인해
  alternatives_korean:
  - 그녀 때문에
  - 그녀 때문에 생겨
  lexicon: LSJ
  rationale: 본문은 그녀가 기쁨의 원인임을 나타내므로, 한국어에서는 인과를 분명히 드러내는 표현이 원문의 의미를 가장 잘 반영합니다.
- source_word: ἔπιεν οἶνον πολὺν σφόδρα
  english_pob_choice: he drank a very great amount of wine
  chosen_korean: 포도주를 매우 많이 마셨습니다
  alternatives_korean:
  - 아주 많은 포도주를 마셨습니다
  - 포도주를 대단히 많이 마셨습니다
  lexicon: LSJ
  rationale: πολὺν σφόδρα의 강한 양적 강조를 살려 ‘매우 많이’로 옮겼고, 한국어에서 자연스러운 어순으로 재배열했습니다.
- source_word: ὅσον οὐκ ἔπιεν πώποτε
  english_pob_choice: as much as he had never drunk
  chosen_korean: 곧 태어난 이래 한 번도 마셔 본 적이 없는 양을
  alternatives_korean:
  - 평생 한 번도 마셔 보지 못한 만큼을
  - 지금껏 한 번도 마신 적 없는 만큼을
  lexicon: LSJ
  rationale: ‘한 번도… 없다’의 절대적 비교를 한국어 관용으로 풀어, 평생 누적 기준의 최상급 비교를 분명히 했습니다.
- source_word: ἀφʼ οὗ ἐγεννήθη
  english_pob_choice: since he was born
  chosen_korean: 곧 태어난 이래
  alternatives_korean:
  - 태어난 이후
  - 태어난 때부터
  lexicon: LSJ
  rationale: 출생 이후 전체 기간을 가리키는 시간표현이므로, 문맥상 자연스럽고 압축적인 ‘이래’를 선택했습니다.
theological_decisions:
- issue: the cause of delight in ἀπʼ αὐτῆς
  chosen_reading: 오로페르네스의 기쁨이 그녀에게서 비롯된 것으로 읽히는 인과 관계를 본문 그대로 드러냈습니다.
  alternative_readings:
  - 단순히 ‘그녀와 함께’로 완화하는 읽기
  - 관계적 친밀감만을 암시하는 읽기
  rationale: 그리스어 ἀπό는 이 문맥에서 원인/출처를 띠므로, 그녀가 그의 기쁨의 계기였다는 서술을 약화하지 않는 것이 본문 충실성에 부합합니다.
  doctrine_reference: 본문해석 원칙; 서사 문맥 보존
- issue: explicitly temporal excess in drinking
  chosen_reading: ‘하루에’와 ‘한 번도 마셔 본 적이 없는 양’으로 과도한 음주를 직설적으로 유지했습니다.
  alternative_readings:
  - 완곡하게 ‘많이 마셨습니다’로 축소하는 읽기
  - 도덕적 판단을 덧붙이는 읽기
  rationale: 원문은 단순한 과음 묘사를 넘어 생애 최다 음주라는 극단성을 강조하므로, 윤리적 평가는 덧붙이지 않되 서술 강도는 유지했습니다.
  doctrine_reference: 서사체의 사실 묘사 보존
