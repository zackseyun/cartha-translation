  text: For look[a], it would be shameful for us if we let such a woman go without speaking with her; for if we do not draw her in, she will laugh at us.
  footnotes:
  - marker: a
    text: Or 'if we do not entice her' or 'if we do not win her over.' The Greek verb can carry the sense of drawing someone to oneself, and here likely implies an attempt to attract or seduce her.
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오. 우리에게는 이처럼 한 여인을 아무 말도 하지 않고 그냥 보내는 것이 수치입니다. 그러니 우리가 그녀를 끌어들이지 않으면, 그녀는 우리를 비웃을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그녀를 유인하지’ 또는 ‘그녀를 설득하지’. 그리스어 동사는 ‘자기 쪽으로 끌어오다’는 뜻을 가질 수 있으며, 여기서는 유혹하거나 끌어들이려는 시사를 담을 가능성이 큽니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ γὰρ
  english_pob_choice: For look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보아라
  lexicon: LSJ
  rationale: 도입어의 강조를 살리되, 현대 한국어 합쇼체에서 자연스럽고 호소력 있게 시작하도록 옮겼습니다.
- source_word: αἰσχρὸν τῷ προσώπῳ ἡμῶν
  english_pob_choice: shameful for us
  chosen_korean: 우리에게는 … 수치입니다
  alternatives_korean:
  - 우리 얼굴에 부끄러운 일입니다
  - 우리 체면에 부끄럽습니다
  lexicon: LSJ
  rationale: 직역적인 ‘얼굴’보다 관용적으로 ‘수치’가 명예·체면의 의미를 더 정확히 전달합니다.
- source_word: παρήσομεν … οὐχ ὁμιλήσαντες αὐτῇ
  english_pob_choice: we let ... go without speaking with her
  chosen_korean: 아무 말도 하지 않고 그냥 보내는 것
  alternatives_korean:
  - 말도 하지 않은 채 지나가게 하는 것
  - 대화도 하지 않고 보내는 것
  lexicon: LSJ
  rationale: παρίημι의 ‘보내다/그냥 지나가게 하다’와 ὁμιλήσαντες의 ‘말하다’라는 요소를 함께 살려, 무언의 방임이라는 뜻을 자연스럽게 표현했습니다.
- source_word: ἐπισπάσωμεθα
  english_pob_choice: draw her in
  chosen_korean: 끌어들이지
  alternatives_korean:
  - 유인하지
  - 꼬드기지
  - 끌어당기지
  lexicon: LSJ
  rationale: 이 동사는 단순히 ‘말하다’보다 더 적극적인 유인·포섭의 뉘앙스를 가지므로, POB의 해석을 따라 ‘끌어들이다’로 옮겼습니다.
- source_word: καταγελάσεται ἡμῶν
  english_pob_choice: she will laugh at us
  chosen_korean: 우리를 비웃을 것입니다
  alternatives_korean:
  - 우리를 조롱할 것입니다
  - 우리를 비웃게 될 것입니다
  lexicon: LSJ
  rationale: 조롱·비웃음의 공개적 수치를 드러내는 표현으로, 문맥의 명예 손상을 분명하게 전달합니다.
theological_decisions:
- issue: 여인의 반응을 단순한 웃음이 아니라 수치와 조롱의 관계로 번역할지
  chosen_reading: ‘비웃을 것입니다’로 옮겨 공동체의 체면 손상을 드러냈습니다.
  alternative_readings:
  - ‘웃을 것입니다’
  - ‘조롱할 것입니다’
  rationale: 문맥이 명예-수치의 사회적 긴장을 다루므로, 단순한 웃음보다 타인을 깎아내리는 의미가 분명한 표현이 적절합니다.
  doctrine_reference: 성경 본문 내 사회적 명예-수치 문맥의 보존
