  - 끌어당기지
  lexicon: LSJ
  rationale: 이 동사는 단순히 ‘말하다’보다 더 적극적인 유인·포섭의 뉘앙스를 가지므로, POB의 해석을 따라 ‘끌어들이다’로 옮겼습니다.
- source_word: καταγελάσεται ἡμῶν
  english_pob_choice: she will laugh at us
  chosen_korean: 우리를 비웃을 것입니다
  alternatives_korean:
  - 우리를 조롱할 것입니다
  - 우리를 비웃게 될 것입니다
  lexicon: LSJ
  rationale: 조롱·비웃음의 공개적 수치를 드러내는 표현으로, 문맥의 명예 손상을 분명하게 전달합니다.
theological_decisions:
- issue: 여인의 반응을 단순한 웃음이 아니라 수치와 조롱의 관계로 번역할지
  chosen_reading: ‘비웃을 것입니다’로 옮겨 공동체의 체면 손상을 드러냈습니다.
  alternative_readings:
  - ‘웃을 것입니다’
  - ‘조롱할 것입니다’
  rationale: 문맥이 명예-수치의 사회적 긴장을 다루므로, 단순한 웃음보다 타인을 깎아내리는 의미가 분명한 표현이 적절합니다.
  doctrine_reference: 성경 본문 내 사회적 명예-수치 문맥의 보존
