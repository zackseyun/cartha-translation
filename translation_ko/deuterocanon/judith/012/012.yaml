  text: For look[a], it would be shameful for us if we let such a woman go without speaking with her; for if we do not draw her in, she will laugh at us.
  footnotes:
  - marker: a
    text: Or 'if we do not entice her' or 'if we do not win her over.' The Greek verb can carry the sense of drawing someone to oneself, and here likely implies an attempt to attract or seduce her.
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오, 우리가 이 같은 여인과 말을 나누지도 않고 그냥 보내 버린다면 우리에게 수치가 될 것입니다. 우리가 그 여인을 끌어들이지 않으면[a], 그 여인이 우리를 비웃을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 여인을 유인하지 않으면’ 또는 ‘그 여인을 자기편으로 끌어들이지 않으면’. 그리스어 동사는 ‘자기 쪽으로 끌어오다’라는 뜻을 가질 수 있으며, 이 문맥에서는 그 여인을 끌어당기거나 유혹하려는 뜻을 시사할 수도 있습니다.
    reason: lexical_alternative
