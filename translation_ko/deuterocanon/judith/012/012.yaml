  to: 보십시오, 우리가 이 같은 여인과 말을 나누지도 않고 그냥 보내 버린다면 우리에게 수치가 될 것입니다. 우리가 그 여인을 끌어들이지 않으면[a], 그 여인이 우리를 비웃을 것입니다.
