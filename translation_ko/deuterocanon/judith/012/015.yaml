revisions:
- from: 그리고 옷을 벗은 뒤, 그는 자기 옷과 온갖 여자 장식으로 몸을 꾸몄습니다. 그리고 그의 여종이 와서, 홀로페르네스 맞은편 바닥에, 바고스에게서 자기의 매일 쓰는 용도로 받았던 양털깔개들을 펴 놓았으니, 이는 그 위에 기대어 음식을 먹으며 눕게 하려는 것이었습니다.[a][b][c]
  to: 그리고 옷을 벗은 뒤,[a] 유딧은 자기 옷을 입고 여성의 모든 장신구로 몸을 꾸몄습니다. 그의 여종이 와서 홀로페르네스 맞은편 땅바닥에, 유딧이 매일 사용하도록 바고아스에게서 받은 양털깔개들을 펴 놓았습니다. 이는 유딧이 그 위에 기대어 음식을 먹을 수 있도록 하려는 것이었습니다.[b][c]
  rationale: 성별이 맞지 않는 대명사를 제거하고 유딧을 명시했습니다. 또한 장신구, 매일의 사용, 식사 때 기대는 자세를 현대 한국어로 자연스럽고 정확하게 다듬었으며, 여종의 예속적 신분과 διαστασᾶσα의 해석상 여지는 각주에서 보존했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T18:57:53Z'
review_pass:
  verdict: revise
  source_fidelity: 헬라어의 동작 순서와 주요 어휘는 대체로 반영되어 있으나, 주어를 남성 대명사 ‘그는/그의’로 처리한 것은 유딧을 가리키는 여성 단수 주어와 맞지 않습니다. 또한 마지막 목적 표현은 유딧이 식사할 때 양털깔개 위에 기대어 있도록 하기 위한 것임을 더 직접적으로 드러내는 편이 정확합니다.
  naturalness: ‘온갖 여자 장식’, ‘자기의 매일 쓰는 용도’, ‘눕게 하려는 것이었습니다’는 현대 표준 한국어에서 다소 어색하거나 지시 대상이 흐립니다. ‘여성의 모든 장신구’, ‘매일 사용하도록’, ‘기대어 음식을 먹을 수 있도록’이 자연스럽습니다.
  terminology: δοῦλη는 예속적 지위를 보존하는 ‘여종’으로 유지합니다. κώδια는 문맥상 펼쳐 식사 때 기대는 용도의 ‘양털깔개들’로 옮길 수 있습니다. Βαγώου는 그리스어 이름 형태에 맞추어 ‘바고아스’로 표기하는 것이 적절합니다.
  issues:
  - severity: high
    issue: 유딧을 남성 대명사 ‘그는/그의’로 지칭함
    rationale: ἐκοσμήθη 및 αὐτῆς는 여성 단수이며, 문맥상 유딧을 가리킵니다. 한국어 번역에서 남성 대명사를 쓰면 인물과 성별을 잘못 전달합니다.
  - severity: medium
    issue: 마지막 목적절의 주체와 행동이 불분명함
    rationale: εἰς τὸ ἐσθίειν κατακλινομένην ἐπʼ αὐτῶν은 유딧이 그것들 위에 기대어 식사하도록 한다는 뜻입니다. ‘눕게 하려는 것’은 누가 누구를 위한 것인지 흐리고, 식사 자세의 의미도 약해집니다.
  - severity: medium
    issue: ‘온갖 여자 장식’ 및 ‘매일 쓰는 용도’의 비자연스러운 표현
    rationale: κόσμος γυναικεῖος는 여성의 장신구·치장을 뜻하며, καθημερινὴ δίαιτα는 이 문맥에서 매일의 사용 또는 일상적 필요를 가리킵니다.
  - severity: low
    issue: 바고스의 이름 표기
    rationale: Βαγώου는 Βαγώας의 속격으로 보이며, 표준 음역상 ‘바고아스’가 그리스어 원형을 더 잘 반영합니다.
