base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/012/015.yaml
  text: And after disrobing[a], she adorned herself with her garments and with all her feminine adornment; and her female slave came and spread out for her on the ground opposite Holofernes the fleeces that she had received from Bagoas for her daily use[c][b], so that she might recline on them while eating.
  footnotes:
  - marker: a
    text: Or 'after changing clothes' or, more literally, 'after separating herself.' The Greek participle is somewhat unusual, and the context suggests preparation by removing previous attire before adorning herself.
    reason: lexical_alternative
  - marker: b
    text: '''Female slave'' translates the feminine form of the Greek word related to δοῦλος. ''Maidservant'' is a possible softer rendering.'
    reason: lexical_alternative
  - marker: c
    text: That is, she would recline in the customary posture for eating.
    reason: cultural_note
translation:
  language: ko
  text: 그리고 옷을 벗은 뒤,[a] 유딧은 자기 옷을 입고 여성의 모든 장신구로 몸을 꾸몄습니다. 그의 여종이 와서 홀로페르네스 맞은편 땅바닥에, 유딧이 매일 사용하도록 바고아스에게서 받은 양털깔개들을 펴 놓았습니다. 이는 유딧이 그 위에 기대어 음식을 먹을 수 있도록 하려는 것이었습니다.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘옷을 벗은 뒤’는 헬라어 분사 διαστασᾶσα를 문맥에 따라 옮긴 것입니다. 문자적으로는 ‘자신을 떼어낸 뒤’ 정도로도 이해될 수 있고, ‘옷을 갈아입은 뒤’라는 번역도 가능합니다. 여기서는 새로 단장하기에 앞서 이전 옷차림을 벗는 동작을 가리키는 것으로 보입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘여종’은 헬라어 여성형 δοῦλη가 지닌 예속적 신분의 의미를 살린 번역입니다. ‘하녀’나 ‘시녀’로도 옮길 수 있으나, 그 표현들은 이러한 의미를 약화시킬 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 고대의 식사 풍습에서 ‘기대어 먹다’는 식탁에 앉는 대신 비스듬히 기대어 식사하는 자세를 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: διαστασᾶσα
  english_pob_choice: after disrobing
  chosen_korean: 옷을 벗은 뒤
  alternatives_korean:
