  - 옷을 갈아입은 뒤
  lexicon: LSJ
  rationale: 문맥상 이전 복장을 벗고 새로 단장하는 동작이므로, 한국어에서는 자연스럽고 장면을 분명히 하는 '옷을 벗은 뒤'가 적절합니다.
- source_word: ἐκοσμήθη
  english_pob_choice: she adorned herself
  chosen_korean: 몸을 꾸몄습니다
  alternatives_korean:
  - 스스로를 단장했습니다
  - 장식했습니다
  lexicon: LSJ
  rationale: 단순한 착의보다 의도적인 치장을 가리키므로, '몸을 꾸몄습니다'가 꾸밈과 단장의 뉘앙스를 함께 살립니다.
- source_word: δούλη
  english_pob_choice: female slave
  chosen_korean: 여종
  alternatives_korean:
  - 여자 종
  - 하녀
  lexicon: LSJ
  rationale: 본문의 종속적 신분을 너무 약화시키지 않으면서도 한국어 문맥에서 읽기 자연스러운 표현으로 '여종'을 택했습니다.
- source_word: κώδια
  english_pob_choice: fleeces
  chosen_korean: 양털깔개들
  alternatives_korean:
  - 양털들
  - 털가죽들
  - 양가죽들
  lexicon: LSJ
  rationale: 침상처럼 펴 놓는 용도라는 문맥을 반영해, 단순한 '양털'보다 기능이 드러나는 '양털깔개들'로 옮겼습니다.
- source_word: κατακλινομένην
  english_pob_choice: recline
  chosen_korean: 눕게
  alternatives_korean:
  - 기대게
  - 비스듬히 눕게
  lexicon: LSJ
  rationale: 고대 식사의 눕는 자세를 가리키므로, '눕게 하려는 것'으로 옮겨 문화적 배경을 보존했습니다.
