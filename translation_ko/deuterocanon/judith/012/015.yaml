  rationale: 본문은 단순 보조인보다 소유·예속의 뉘앙스를 갖는 δοῦλη 계열을 사용하므로, 이를 약화시키지 않는 번역이 필요합니다.
  doctrine_reference: DOCTRINE.md의 δοῦλος/δοῦλη 처리 원칙
