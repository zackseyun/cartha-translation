  text: And she arose toward the morning watch[a], and sent to Holofernes, saying, “Let my lord now give orders to allow your servant to go out for prayer.”
  footnotes:
  - marker: a
    text: Or “your slave.” The Greek has the feminine form of doulos, which can denote either a servant or a slave depending on context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그녀는 새벽 경계 무렵에 일어나서, 홀로페르네스에게 보내어 말했습니다. 「내 주인이시여, 이제 당신의 종이 기도하러 나갈 수 있도록 허락해 주십시오.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “당신의 노예.” 그리스어에는 doulos의 여성형이 있으며, 문맥에 따라 종 또는 노예를 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸς τὴν ἑωθινὴν φυλακήν
  english_pob_choice: toward the morning watch
  chosen_korean: 새벽 경계 무렵에
  alternatives_korean:
  - 아침 경계로
  - 새벽 경계에
  lexicon: LSJ
  rationale: πρὸς는 방향/시점의 근접성을, ἑωθινή φυλακή는 이른 아침의 경계 시간을 가리키므로 ‘무렵에’로 시간의 근접성을 살렸습니다.
- source_word: ἀπέστειλεν πρὸς Ὁλοφέρνην
  english_pob_choice: sent to Holofernes
  chosen_korean: 홀로페르네스에게 보내어
  alternatives_korean:
  - 홀로페르네스에게 사람을 보내어
  - 홀로페르네스에게 전하여
  lexicon: BDAG
  rationale: 직접 ‘보내다’는 메시지/사람을 보내는 관용을 자연스럽게 반영하며, 뒤의 ‘말했습니다’가 통신문맥임을 분명히 합니다.
- source_word: ὁ κύριός μου
  english_pob_choice: my lord
  chosen_korean: 내 주인이시여
  alternatives_korean:
  - 내 주님이시여
  - 내 주인이여
  lexicon: BDAG
  rationale: 여기서 κύριος는 신적 호칭이 아니라 홀로페르네스에게 드리는 존칭이므로, 한국어에서도 상하관계를 나타내는 정중한 호칭으로 옮겼습니다.
- source_word: τὴν δούλην σου
  english_pob_choice: your servant
  chosen_korean: 당신의 종이
  alternatives_korean:
  - 당신의 노예가
  - 당신의 하인이
  lexicon: BDAG
  rationale: δούλη는 문자적으로는 ‘여종/노예’ 범주지만, 이 문맥에서는 궁정 예절의 자기 낮춤 표현이므로 ‘종’이 가장 무리 없는 대응입니다.
- source_word: ἐπὶ προσευχὴν ἐξελθεῖν
  english_pob_choice: to go out for prayer
  chosen_korean: 기도하러 나갈 수 있도록
  alternatives_korean:
  - 기도를 위해 나가도록
  - 기도하려고 나갈 수 있도록
  lexicon: BDAG
  rationale: ἐπὶ προσευχὴν은 목적을 나타내므로 ‘기도하러’로 자연스럽게 풀되, ἐξελθεῖν의 ‘나가다’를 유지했습니다.
theological_decisions:
- issue: δευτερεύον 호칭 κύριος의 번역에서 신적 ‘주님’과의 구별
  chosen_reading: 내 주인이시여
  alternative_readings:
  - 내 주님이시여
  - 주님
  rationale: 이 절의 κύριος는 야훼나 메시아에 대한 신앙 고백이 아니라 인간 상관에게 드리는 예법적 호칭이어서, 독자가 신적 의미로 오해하지 않도록 구별했습니다.
  doctrine_reference: 'DOCTRINE.md: κύριος는 문맥에 따라 인간 상관에게도 사용되며, 한국어에서는 신적 호칭과 구별해야 함'
- issue: δούλη의 자기 호칭을 ‘종’으로 둔 선택
  chosen_reading: 당신의 종
  alternative_readings:
  - 당신의 노예
  - 당신의 여종
  rationale: 본문의 핵심은 복종적 예의이며, 포박된 신분을 강조하는 문맥은 아니므로, ‘종’이 본문의 사회적 뉘앙스를 가장 잘 전달합니다.
  doctrine_reference: 'DOCTRINE.md: δοῦλος/δοῦλη는 문맥에 따라 종/노예로 옮기되, 본문 기능을 우선함'
