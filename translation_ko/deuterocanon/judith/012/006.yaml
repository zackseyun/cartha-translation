- from: 그녀는 새벽 경계 무렵에 일어나서, 홀로페르네스에게 보내어 말했습니다. 「내 주인이시여, 이제 당신의 종이 기도하러 나갈 수 있도록 허락해 주십시오.」[a]
  to: 그녀는 새벽 파수 때가 될 무렵 일어나 홀로페르네스에게 전갈을 보내어 말했습니다. “주인님, 이제 주인님의 여종[a]이 기도하러 나갈 수 있도록 명해 주십시오.”
  rationale: The revision retains the source's temporal proximity, message-sending idiom, deferential address, and purpose clause. It restores the ordering force of ἐπιταξάτω, represents the feminine δούλη in Korean, corrects the Greek-form explanation in the note, and places the note marker at its referent.
