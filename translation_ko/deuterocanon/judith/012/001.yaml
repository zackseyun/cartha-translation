  text: And he ordered that she be brought in where his silverware was kept[b][a], and he directed that food be prepared for her from his own dishes and that she drink from his wine.
  footnotes:
  - marker: a
    text: Or 'his silver vessels.' The Greek term can denote silver articles generally; in this banquet setting it likely refers to tableware or serving vessels.
    reason: lexical_alternative
  - marker: b
    text: Or 'that a table be spread for her from his delicacies.' The Greek verb and noun together can be rendered more formally as laying out his prepared dishes.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 그녀를 자신이 은그릇들을 보관해 두던 곳으로 들여오도록 명령하고, 자신의 요리들 가운데서 그녀를 위해 상을 차리고 그녀가 자신의 포도주를 마시도록 지시했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκέλευσεν
  english_pob_choice: he ordered
  chosen_korean: 명령하고
  alternatives_korean:
  - 지시하고
  - 명하고
  lexicon: BDAG
  rationale: κέλευω의 권위 있는 명령성을 자연스러운 현대 한국어로 옮기기 위해 '명령하다'를 사용했습니다.
- source_word: εἰσαγαγεῖν αὐτὴν
  english_pob_choice: that she be brought in
  chosen_korean: 그녀를 … 들여보내라고
  alternatives_korean:
  - 그녀를 … 데려오라고
  - 그녀를 … 인도해 들이라고
  lexicon: BDAG
  rationale: 부정사 구문이 ‘명령했다’에 종속되므로, 수동적 결과를 살려 하인들이 그녀를 안으로 들이는 뜻으로 옮겼습니다.
- source_word: τὰ ἀργυρώματα αὐτοῦ
  english_pob_choice: his silverware
  chosen_korean: 자기의 은그릇
  alternatives_korean:
  - 자기의 은기물
  - 자기의 은제품
  lexicon: LSJ
  rationale: 이 단어는 은으로 된 물건들을 가리키며, 잔치 문맥에서는 식기·용기 뉘앙스가 강하므로 '은그릇'이 가장 간결하고 문맥에 맞습니다.
- source_word: καταστρῶσαι αὐτῇ
  english_pob_choice: that food be prepared for her
  chosen_korean: 그녀 앞에 상을 차리게 하고
  alternatives_korean:
  - 그녀를 위해 음식을 준비하게 하고
  - 그녀에게 음식을 차려 내게 하고
  lexicon: LSJ
  rationale: καταστρῶσαι는 여기서 먹을 것을 차려 놓는 뜻이므로, 한국어에서는 잔치/식사 장면에 자연스러운 '상을 차리다'로 옮겼습니다.
- source_word: ἀπὸ τῶν ὀψοποιημάτων αὐτοῦ
  english_pob_choice: from his own dishes / provisions
  chosen_korean: 자기의 음식으로
  alternatives_korean:
  - 자기의 진수성찬으로
  - 자기의 마련한 음식으로
  lexicon: LSJ
  rationale: ὀψοποιήματα는 준비된 음식·요리들을 뜻하므로, 과도한 해석 없이 소유격을 살린 '자기의 음식'으로 옮겼습니다.
- source_word: τοῦ οἴνου αὐτοῦ πινεῖν
  english_pob_choice: that she drink from his wine
  chosen_korean: 자기의 포도주를 마시게 하라고
  alternatives_korean:
  - 자기의 포도주를 마시게 하게 하고
  - 자기의 포도주를 마시도록 하고
  lexicon: BDAG
  rationale: 목적 부정사 구조의 반복 명령을 살려, 잔치에서 제공되는 자신의 포도주를 마시게 하라는 뜻을 분명하게 했습니다.
theological_decisions:
- issue: 잔치 장면의 사회적 함의
  chosen_reading: 단순한 환대가 아니라, 권력자가 손님을 자기의 은그릇과 포도주로 대접하도록 명하는 장면으로 옮겼습니다.
  alternative_readings:
  - 중립적으로 '대접하다'만 강조하는 읽기
  - 식사 준비를 일반 서술로 완화하는 읽기
  rationale: 본문은 호의적 대접이면서도 권위와 위신을 드러내는 장면이므로, 그 긴장을 약화하지 않도록 표현했습니다.
  doctrine_reference: 서사 문맥의 인물 묘사
