base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/012/004.yaml
  text: And Judith said to him[a], “As your life lives, my lord[c][b], your slave will not use up what is with me until he has accomplished by my hand what he has planned.”
  footnotes:
  - marker: a
    text: Or more idiomatically, 'As surely as you live, my lord.' The Greek literally says, 'Your life lives.'
    reason: lexical_alternative
  - marker: b
    text: '''The things with me'' likely refers to Judith''s own provisions or food supplies.'
    reason: lexical_alternative
  - marker: c
    text: The subject of 'has accomplished' / 'has planned' is implicit in Greek; in context it is most naturally understood as God acting through Judith.
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 유디트가 그에게 말했습니다. 「당신의 생명이 살아 있듯이, 내 주님이여, 당신의 노예는 내게 있는 것을 다 쓰지 않을 것입니다. 그분이 내 손을 통해 계획하신 것을 이루실 때까지는 말입니다.」[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘당신의 생명이 살아 있듯이’는 문자적으로는 ‘당신의 생명이 산다’는 뜻의 맹세 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘내게 있는 것’은 유디트의 소지품이나 식량을 가리키는 것으로 보입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘그분’은 문맥상 가장 자연스럽게 하나님을 가리킵니다.
    reason: theological_note
lexical_decisions:
- source_word: Ζῇ ἡ ψυχή σου
  english_pob_choice: As your life lives
  chosen_korean: 당신의 생명이 살아 있듯이
  alternatives_korean:
  - 당신이 살아 계신 것처럼
  - 당신의 생명처럼
  lexicon: LSJ
  rationale: 그리스어의 생명-맹세 형식을 살리면서도 한국어로는 자연스럽고 장중하게 옮겼습니다.
- source_word: κύριέ μου
  english_pob_choice: my lord
  chosen_korean: 내 주님이여
  alternatives_korean:
  - 내 주인이여
  - 나의 주인이여
  lexicon: LSJ
  rationale: 홀로페르네스에 대한 정중한 호칭으로서 사회적 존칭을 유지했습니다.
- source_word: ἡ δούλη σου
  english_pob_choice: your slave
  chosen_korean: 당신의 노예는
  alternatives_korean:
  - 당신의 종은
  - 당신의 여종은
  lexicon: LSJ
  rationale: δούλη의 종속적 신분을 약화하지 않기 위해, 프로젝트 기본값에 따라 ‘노예’를 사용했습니다.
- source_word: τὰ ὄντα μετʼ ἐμοῦ
  english_pob_choice: what is with me
  chosen_korean: 내게 있는 것을
  alternatives_korean:
  - 내게 있는 것들을
  - 내가 가진 것을
  - 내게 있는 양식을
  lexicon: LSJ
  rationale: 직역하면 ‘나와 함께 있는 것들’이지만, 문맥상 유디트의 소지품/식량을 가리키므로 한국어에서는 간결하게 ‘내게 있는 것’을 택했습니다.
- source_word: ἕως ἄν ποιήσῃ ἐν χειρί μου ἃ ἐβουλεύσατο
  english_pob_choice: until he has accomplished by my hand what he has planned
  chosen_korean: 그분이 내 손을 통해 계획하신 것을 이루실 때까지는
  alternatives_korean:
  - 그분이 내 손으로 행하신 것을 마치실 때까지는
  - 내 손을 통해 계획하신 일을 이루실 때까지는
  lexicon: LSJ
  rationale: 주어가 문맥상 가장 자연스럽게 하나님으로 이해되는 점을 살리되, 본문이 직접 명시하지 않는 긴장을 유지했습니다. ‘이루실’은 ποιήσῃ의 완결성과 ἐβουλεύσατο의 의도성을 함께 반영합니다.
theological_decisions:
- issue: ποιήσῃ / ἐβουλεύσατο의 암시된 주어
  chosen_reading: 주어를 본문 맥락에 따라 ‘그분’으로 처리하여, 하나님이 유디트를 통해 이루실 계획을 가리키도록 했습니다.
  alternative_readings:
  - 주어를 아예 드러내지 않는 중립적 번역
  - ‘하나님’이라고 명시하는 번역
  rationale: 그리스어는 주어를 생략하지만, 유디트서 전체 문맥은 하나님이 행하시는 구원 계획을 가리키므로 과도한 해석 없이 자연스럽게 반영했습니다.
  doctrine_reference: 문맥적 주어 복원은 가능하되, 본문이 허용하는 범위를 넘지 않도록 유지합니다.
