  text: And Judith said to him[a], “And who am I to speak back to my lord? Whatever is pleasing in his eyes, I will quickly do, and this will be my joy until the day of my death.”
  footnotes:
  - marker: a
    text: Or “to oppose my lord” or “to answer back to my lord.”
    reason: lexical_alternative
translation:
  language: ko
  text: 이에 유딧이 그에게 말했습니다. “제가 어찌 제 주인님께 맞서 말하겠습니까[a]? 그분께서 좋게 여기시는 것은 무엇이든지 제가 서둘러 행하겠습니다. 이것이 제 죽는 날까지 저의 기쁨이 될 것입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “제 주인님께 거슬러 말하다” 또는 “제 주인님께 되받아 말하다.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀντειποῦσα
  english_pob_choice: to speak back
  chosen_korean: 맞서 말하다
  alternatives_korean:
  - 거슬러 말하다
  - 대답하여 반박하다
  - 맞서 대답하다
  lexicon: BDAG
  rationale: 상대에게 되받아 말하거나 반박하는 뉘앙스를 살리되, 유딧의 공손한 자기 낮춤과 궁정 상황을 해치지 않도록 ‘맞서 말하다’로 옮겼습니다.
- source_word: τῷ κυρίῳ μου
  english_pob_choice: to my lord
  chosen_korean: 제 주인님께
  alternatives_korean:
  - 제 주님께
  - 제 군주님께
  - 제 주인에게
  lexicon: BDAG
  rationale: 여기서는 신적 호칭이 아니라 홀로페르네스에 대한 사회적 존대 표현이므로, 위계와 복종의 뉘앙스를 분명히 하는 ‘주인님’으로 옮겼습니다.
- source_word: σπεύσασα
  english_pob_choice: quickly
  chosen_korean: 서둘러
  alternatives_korean:
  - 신속히
  - 재빨리
  - 급히
  lexicon: BDAG
  rationale: 동작의 신속함과 자발적 응답을 자연스러운 현대 한국어 동사구로 살리기 위해 ‘서둘러’로 처리했습니다.
- source_word: ἀγαλλίαμα
  english_pob_choice: joy
  chosen_korean: 기쁨
  alternatives_korean:
  - 즐거움
  - 환희
  - 기쁜 마음
  lexicon: BDAG
  rationale: 강한 기쁨이나 환희의 의미가 있으나, 문맥상 과장되지 않게도 충분히 울리는 기본어 ‘기쁨’을 택했습니다.
