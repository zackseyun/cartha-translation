translation:
  language: ko
  text: 이에 유딧이 그에게 말했습니다. “그리고 제가 어떻게 제 주인님께 맞서 말할 수 있겠습니까? 그의 눈에 좋게 보이는 것은 무엇이든지 제가 서둘러 행하겠습니다. 그리고 이것이 제 죽는 날까지 저의 기쁨이 될 것입니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “제 주인님께 맞서다” 혹은 “제 주인님께 되받아 말하다.”
    reason: lexical_alternative
