    rationale: ἐν πόνῳ καὶ πλίνθῳ는 그들이 부과한 고된 노동과 벽돌 만드는 일이 처우의 수단·영역임을 나타냅니다. ‘고된 노동과 벽돌 만드는 일로’가 더 자연스럽고 원문의 강제 노동 맥락을 잘 전달합니다.
