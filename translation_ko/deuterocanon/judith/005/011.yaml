  text: And the king of Egypt rose up against them[a], and they dealt shrewdly with them in toil and brickmaking; they humbled them and made them slaves.
  footnotes:
  - marker: a
    text: Or 'they outwitted them' / 'they dealt cunningly with them.' The Greek verb emphasizes crafty or calculated treatment.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 이집트 왕이 그들에게 맞서 일어났으며, 이집트인들은 고된 노동과 벽돌 만드는 일로 그들을 간계를 써서 다루었고, 그들을 낮추어 노예로 삼았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들을 교묘하게 속였습니다’ / ‘그들을 간계로 다루었습니다’. 이 동사는 상대를 향한 계산된 간계 또는 교묘한 처우를 강조합니다.
    reason: lexical_alternative
