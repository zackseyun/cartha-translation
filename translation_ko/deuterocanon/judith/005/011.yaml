  text: And the king of Egypt rose up against them[a], and they dealt shrewdly with them in toil and brickmaking; they humbled them and made them slaves.
  footnotes:
  - marker: a
    text: Or 'they outwitted them' / 'they dealt cunningly with them.' The Greek verb emphasizes crafty or calculated treatment.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 이집트 왕이 그들에게 맞서 일어났으며, 그들을 노동과 벽돌 만들기 가운데에서 간교하게 다루었고, 그들을 낮추어 노예로 삼았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들을 교묘하게 속였습니다’ / ‘그들을 간계로 다루었습니다’. 이 동사는 계산된 기만과 꾀를 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπανέστη
  english_pob_choice: rose up against
  chosen_korean: 맞서 일어났으며
  alternatives_korean:
  - 일어나 대항했으며
  - 거슬러 일어났으며
  - 맞서 일어섰으며
  lexicon: LSJ
  rationale: 단순한 ‘일어남’이 아니라 적대적으로 맞서 일어서는 뜻이므로, 대립의 방향을 살린 표현으로 옮겼습니다.
- source_word: κατεσοφίσαντο
  english_pob_choice: they dealt shrewdly with
  chosen_korean: 간교하게 다루었고
  alternatives_korean:
  - 교묘하게 다루었고
  - 꾀를 부려 다루었고
  - 지략으로 속였고
  lexicon: LSJ
  rationale: 상대에게 계산된 방식으로 대처하는 뉘앙스를 살리되, 단순한 ‘속이다’보다 본문이 지닌 정책적·기만적 어감을 유지했습니다.
- source_word: ἐν πόνῳ καὶ πλίνθῳ
  english_pob_choice: in toil and brickmaking
  chosen_korean: 노동과 벽돌 만들기 가운데에서
  alternatives_korean:
  - 고된 노역과 벽돌 작업 가운데에서
  - 수고와 벽돌 일 가운데에서
  - 노역과 벽돌 만들기 속에서
  lexicon: LSJ
  rationale: πόνῳ는 고된 노동, πλίνθῳ는 벽돌 자체보다 벽돌을 만드는 강제 노동의 맥락이므로, 자연스러운 한국어로 작업의 성격을 드러냈습니다.
- source_word: δούλους
  english_pob_choice: slaves
  chosen_korean: 노예로 삼았습니다
  alternatives_korean:
  - 종으로 삼았습니다
  - 종살이하게 했습니다
  - 노예가 되게 했습니다
  lexicon: BDAG
  rationale: 여기서는 강제 예속과 억압이 핵심이므로, 프로젝트 기본어인 ‘노예’를 사용해 상태의 가혹함을 분명히 했습니다.
theological_decisions:
- issue: 이집트 종살이의 강도 표현
  chosen_reading: ‘낮추어 노예로 삼았습니다’로, 모호한 완곡어를 피하고 강제 예속의 현실을 직접 드러냅니다.
  alternative_readings:
  - ‘종으로 삼았습니다’
  - ‘종살이하게 했습니다’
  rationale: 본문은 민족적 억압과 강제 노역을 말하므로, 사회적 하강과 예속을 약화시키지 않는 번역이 필요합니다.
