revisions:
- from: 그들은 조상들의 길에서 벗어나 하늘의 하나님을 경배하였으니, 곧 그들이 알게 된 하나님이셨습니다. 그리고 그들은 자기들의 신들 앞에서 쫓겨나 메소포타미아로 도망하였고, 거기서 여러 날 동안 나그네로 살았습니다.[a][b]
  to: 그들은 조상들의 길에서 벗어나, 그들이 알게 된 하나님, 곧 하늘의 하나님을 경배하였습니다.[a] 그리고 그들은 자기들의 신들 앞에서 그들을 쫓아내고,[b] 메소포타미아로 도망하여 거기서 여러 날 동안 나그네로 살았습니다.
  rationale: 능동형 ἐξέβαλον을 능동형 ‘쫓아내고’로 복원하여 원문 충실성을 확보했습니다. 지시 관계가 난해한 대명사 구문은 해설적으로 수동화하거나 특정 역사적 상황으로 단정하지 않고, 본문과 주석에서 그 압축성을 보존했습니다. 아울러 문장 종결을 현대 합쇼체에 맞게 정리하고 주석의 문자 혼입 오류를 고쳤습니다.
