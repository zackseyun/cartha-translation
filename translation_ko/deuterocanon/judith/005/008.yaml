base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/005/008.yaml
  text: They departed from the way of their fathers and worshiped the God of heaven[a], the God whom they had come to know. And they were driven out from before their gods, and fled to Mesopotamia[b], and lived there as foreigners for many days.
  footnotes:
  - marker: a
    text: Or 'the God whom they recognized.' The Greek may emphasize decisive recognition as well as knowledge.
    reason: lexical_alternative
  - marker: b
    text: The clause 'they drove them out from before their gods' is syntactically compressed in Greek; the sense is that they were expelled in connection with their former gods and then fled to Mesopotamia.
    reason: alternative_reading
translation:
  language: ko
  text: 그들은 조상들의 길에서 벗어나, 그들이 알게 된 하나님, 곧 하늘의 하나님을 경배하였습니다.[a] 그리고 그들은 자기들의 신들 앞에서 그들을 쫓아내고,[b] 메소포타미아로 도망하여 거기서 여러 날 동안 나그네로 살았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘알게 된’은 ‘알아본’ 또는 ‘인정한’으로도 옮길 수 있습니다. 그리스어는 단순히 아는 것뿐 아니라 결정적인 인식의 뉘앙스를 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어는 ‘그들은 자기들의 신들 앞에서 그들을 쫓아냈다’라고 압축하여 말합니다. 이 절에서 ‘그들’과 ‘자기들의 신들’이 각각 누구를 가리키는지는 문법상 매끄럽게 확정하기 어려우므로, 번역도 능동 구문과 대명사의 압축을 보존하였습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐξέβησαν ἐξ ὁδοῦ τῶν γονέων αὐτῶν
  english_pob_choice: They departed from the way of their fathers
  chosen_korean: 조상들의 길에서 벗어나
  alternatives_korean:
  - 조상들의 길을 떠나
  - 조상들의 길에서 돌아서
  lexicon: LSJ
  rationale: 관용구적으로 ‘길’이 조상들의 종교적/생활적 전통을 가리키므로, 직역의 이미지를 살리면서도 자연스러운 한국어로 옮겼습니다.
- source_word: προσεκύνησαν
  english_pob_choice: worshiped
  chosen_korean: 경배하였으니
  alternatives_korean:
  - 예배하였으니
  - 절하였으니
  lexicon: LSJ
  rationale: 이 문맥에서는 단순한 몸의 동작보다 종교적 숭배 행위가 핵심이므로, 한국어 성경에서 충분히 이해되면서도 격식 있는 ‘경배하다’를 택했습니다.
- source_word: τῷ θεῷ τοῦ οὐρανοῦ
  english_pob_choice: the God of heaven
  chosen_korean: 하늘의 하나님
  alternatives_korean:
  - 하늘 하나님
  - 하늘에 계신 하나님
  lexicon: LSJ
  rationale: 정형화된 성서 칭호를 유지하되 한국어에서는 자연스럽게 소유격으로 풀어 ‘하늘의 하나님’이라 옮겼습니다.
- source_word: παρῴκησαν ἐκεῖ ἡμέρας πολλάς
  english_pob_choice: lived there as foreigners for many days
  chosen_korean: 거기서 여러 날 동안 나그네로 살았습니다
  alternatives_korean:
  - 거기서 오랫동안 거류하였습니다
  - 거기서 여러 날 동안 머물렀습니다
  lexicon: LSJ
  rationale: παροικέω의 ‘외국인으로 거주하다’는 뉘앙스를 살리기 위해 단순한 ‘머무르다’보다 ‘나그네로 살다’를 선택했습니다.
theological_decisions:
- issue: ‘하늘의 하나님’과 조상들의 길을 버린 종교적 전환의 표현
  chosen_reading: 본문 자체의 범주를 따라 조상들의 길에서 벗어나 하늘의 하나님을 경배한 실제 전환을 드러내되, 후대의 교리적 용어(회심, 개종 등)는 덧붙이지 않았습니다.
  alternative_readings:
  - ‘조상들의 종교를 버리고’라고 더 해설적으로 옮길 수 있습니다.
  rationale: 그리스어는 ‘조상들의 길’을 떠나 ‘하늘의 하나님’을 경배했다고 말할 뿐이므로, 원문의 표현을 보존하는 것이 더 정확합니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
