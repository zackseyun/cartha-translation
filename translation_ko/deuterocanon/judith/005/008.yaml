  source_fidelity: 핵심 동사 ἐξέβαλον은 능동 복수형인데, 초안의 ‘쫓겨나’는 이를 수동으로 바꾸어 원문의 문법적 अस्पष्ट성과 행위 주체의 압축을 제거합니다. 목적어 αὐτούς와 ‘그들의 신들’의 지시 관계는 본문만으로 매끄럽게 확정하기 어려우므로, 능동 구문과 대명사의 압축을 보존해야 합니다.
  naturalness: ‘경배하였으니, 곧 … 하나님이셨습니다’는 한 문장 안에서 연결 어미와 종결 높임이 어색하게 결합됩니다. 문장을 자연스럽게 정리하고, 압축된 대명사 구문은 주석으로 설명하는 편이 좋습니다. 또한 주석 a의 ‘निर्ण적’은 비한국어 문자 혼입 오류입니다.
  terminology: ‘하늘의 하나님’, ‘경배하다’, ‘메소포타미아’, ‘나그네로 살다’는 적절합니다. ‘알게 된’은 ἐπέγνωσαν의 결정적 인식/알아봄의 가능성을 충분히 남기며, 주석에서 대안을 제시할 수 있습니다.
  issues:
