translation:
  language: ko
  text: 그리고 그는 몹시 분노하여 모압의 모든 통치자들과 암몬의 장수들과 해안 지방의 모든 사트라프들을 소집했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὠργίσθη θυμῷ σφόδρα
  english_pob_choice: became very angry
  chosen_korean: 매우 크게 분노하고
  alternatives_korean:
  - 매우 화가 나고
  - 몹시 격분하고
  lexicon: BDAG
  rationale: ὠργίσθη의 상태 진입과 θυμῷ σφόδρα의 강한 강조를 함께 살려, 자연스러운 현대 한국어로 강한 분노의 정도를 드러냈습니다.
- source_word: ἐκάλεσεν
  english_pob_choice: summoned
  chosen_korean: 불렀습니다
  alternatives_korean:
  - 소집했습니다
  - 불러 모았습니다
  lexicon: BDAG
  rationale: 통치자가 고위 인사들을 권위로 부르는 문맥이므로, 단순한 ‘전화하다’가 아니라 공식적으로 부르는 뜻을 살리되 과도한 관료체로 굳히지 않았습니다.
- source_word: ἄρχοντας / στρατηγοὺς / σατράπας
  english_pob_choice: rulers / generals / satraps
  chosen_korean: 통치자들 / 장수들 / 사트라프들
  alternatives_korean:
  - 지도자들 / 사령관들 / 총독들
  - 군주들 / 지휘관들 / 주지사들
  lexicon: BDAG; LSJ
  rationale: ἄρχοντας는 정치적 지배자, στρατηγοὺς는 군사 지휘관, σατράπας는 페르시아계 행정 관직이므로 각각 기능을 구분해 옮겼습니다. ‘사트라프들’은 역사적 색채를 보존하기 위해 음역을 유지했습니다.
- source_word: τῆς παραλίας
  english_pob_choice: of the coastland
  chosen_korean: 해안 지역의
  alternatives_korean:
  - 해안의
  - 연안 지역의
  - 해변 지방의
  lexicon: LSJ
  rationale: παραλία는 단순한 바닷가가 아니라 해안 지대를 가리키므로, ‘해안 지역’으로 옮겨 지리적 범위를 자연스럽게 드러냈습니다.
