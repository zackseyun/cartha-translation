base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/005/020.yaml
  text: And now[a], master lord, if indeed there is an offense in this people and they are sinning against their God, and if we ascertain that this stumbling block is among them, then we will go up and make war against them;
  footnotes:
  - marker: a
    text: Or 'error' or 'unwitting sin' for 'offense' (ἀγνόημα), highlighting possible ignorance in the wrongdoing.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 이제, 주인이신 주님, 만일 이 백성 가운데 어떤 잘못이 있고 그들이 자기들의 하나님께 죄를 짓고 있다면, 또 우리가 그들 가운데 이 걸림돌이 있음을 확인하면, 우리는 올라가서 그들과 싸우겠습니다;[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘오류’, ‘무지로 인한 죄’로도 옮길 수 있습니다. ἀγνόημα는 잘못을 뜻하되 무지의 뉘앙스를 포함할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: δέσποτα κύριε
  english_pob_choice: master lord
  chosen_korean: 주인이신 주님
  alternatives_korean:
  - 주님
  - 주인이신 주
  - 주인이시며 주님
  lexicon: LSJ
  rationale: δέσποτα와 κύριε의 이중 호칭을 한국어에서도 둘 다 살리기 위해, δέσποτα는 ‘주인’의 지배자 호칭으로, κύριε는 예배적 ‘주님’이 아니라 خطاب의 존칭으로 옮겼습니다.
- source_word: ἀγνόημα
  english_pob_choice: offense
  chosen_korean: 잘못
  alternatives_korean:
  - 오류
  - 무지로 인한 죄
  - 과실
  lexicon: LSJ
  rationale: 문맥상 형사적·군사적 판단을 앞두고 있는 발언이므로, 원문의 ‘잘못/오류’의 폭을 유지하면서도 한국어로 자연스러운 ‘잘못’을 선택했습니다.
- source_word: ἐπισκεψόμεθα
  english_pob_choice: we ascertain
  chosen_korean: 확인하면
  alternatives_korean:
  - 조사하면
  - 살펴보면
  - 판단하면
  lexicon: LSJ
  rationale: 미래 중간태의 ‘조사하여 판별하다’는 뜻을 한국어 조건문에 맞게 ‘확인하다’로 압축해, 사실 확인의 뉘앙스를 살렸습니다.
- source_word: σκάνδαλον
  english_pob_choice: stumbling block
  chosen_korean: 걸림돌
  alternatives_korean:
  - 함정
  - 넘어지게 하는 것
  - 실족하게 하는 것
  lexicon: LSJ
  rationale: 비유적 장애물을 가리키는 기본 이미지를 살리되, 한국어에서 가장 직관적인 대응어인 ‘걸림돌’을 택했습니다.
theological_decisions:
- issue: κύριε를 하나님의 호칭으로 오해하지 않도록 하는 처리
  chosen_reading: ‘주인이신 주님’으로 옮겨, 인간 지배자에게 향한 호칭임을 분명히 했습니다.
  alternative_readings:
  - 주님
  - 주인이시며 주님
  - 주여
  rationale: 본문은 홀로페르네스에게 말하는 장면이므로, 야훼에 대한 예배적 호칭으로 읽히지 않게 하면서도 원문의 격식 있는 이중 호칭을 보존해야 합니다.
  doctrine_reference: 'DOCTRINE.md: κύριος는 문맥에 따라 번역하며, 인물 خطاب에서는 신적 ‘주’와 구별'
