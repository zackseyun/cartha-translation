base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/005/003.yaml
  text: And he said to them, “Tell me, then, sons of Canaan, who is this people that dwells in the hill country, and which cities they inhabit, and the size of their military force, and in what their power and their strength consist, and who has risen over them as king, leading their army.”
  footnotes:
  - marker: a
    text: Or 'Canaanites.' The Greek reads literally 'sons of Canaan.'
    reason: lexical_alternative
  - marker: b
    text: Or 'that lives in the mountainous region.' The Greek literally says 'that is sitting in the hill country,' an idiom for dwelling there.
    reason: lexical_alternative
  - marker: c
    text: Or 'the number of their army' or 'the extent of their force.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 그들에게 말했습니다. 「이제 내게 말하시오, 가나안의 자손들아. 이 산지에 거주하는 이 백성이 누구인지, 그들이 사는 성읍들은 어떤 곳인지, 그들의 군사력의 규모는 어떠한지, 그들의 힘과 능력이 무엇에 있는지, 또 그들의 왕으로서 그들의 군대를 이끌며 그들 위에 일어난 자가 누구인지 말하시오.」[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘가나안의 아들들’입니다. 이곳은 민족을 부르는 호칭으로 이해할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘산지에 앉아 있는’입니다. 관용적으로는 ‘거주하는’의 뜻입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘군사력의 규모’는 ‘그들의 힘의 많음’ 또는 ‘그들의 군대의 수’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀναγγείλατέ δή μοι
  english_pob_choice: Tell me, then
  chosen_korean: 이제 내게 말하시오
  alternatives_korean:
  - 내게 알려 주시오
  - 보고하시오
  lexicon: BDAG
  rationale: ἀναγγέλλω의 직접적 보고 요청을 살리되, 군사적 심문 장면에 맞게 한국어 명령형으로 자연스럽게 옮겼습니다. δή는 내용을 더하지 않는 담화 표지이므로 ‘이제’로 처리했습니다.
- source_word: υἱοὶ Χαναάν
  english_pob_choice: sons of Canaan
  chosen_korean: 가나안의 자손들
  alternatives_korean:
  - 가나안 사람들
  - 가나안의 아들들
  lexicon: BDAG
  rationale: 그리스어의 직역은 ‘가나안의 아들들’이지만, 한국어에서는 혈연적 남성 표지를 완화하면서도 원문의 호칭성을 살리기 위해 ‘자손들’로 옮겼습니다. 민족 지칭이라는 함의도 유지됩니다.
- source_word: ὁ καθήμενος ἐν τῇ ὀρεινῇ
  english_pob_choice: that dwells in the hill country
  chosen_korean: 이 산지에 거주하는
  alternatives_korean:
  - 이 산에 앉아 있는
  - 산지에 사는
  lexicon: BDAG
  rationale: καθήμενος의 문자적 ‘앉아 있는’은 히브리적 관용으로 거주를 뜻하므로, 그 의미를 드러내는 ‘거주하는’으로 번역했습니다. ὀρεινή는 문맥상 ‘산지’가 가장 자연스럽습니다.
- source_word: τὸ πλῆθος τῆς δυνάμεως αὐτῶν
  english_pob_choice: the size of their military force
  chosen_korean: 그들의 군사력의 규모
  alternatives_korean:
  - 그들의 군대의 수
  - 그들의 힘의 많음
  lexicon: BDAG
  rationale: 전투 정찰 문맥이므로 δύναμις를 추상적 ‘힘’보다 ‘군사력’으로 구체화했습니다. πλῆθος은 수량적 크기를 가리키므로 ‘규모’가 잘 맞습니다.
- source_word: κράτος ... ἰσχύς
  english_pob_choice: power ... strength
  chosen_korean: 힘과 능력
  alternatives_korean:
  - 권세와 힘
  - 권능과 강함
  lexicon: BDAG
  rationale: 두 명사는 의미가 겹치지만 서로 다른 뉘앙스를 가지므로, 한국어에서도 병렬을 유지하되 ‘힘’과 ‘능력’으로 구분해 반복감을 살렸습니다.
theological_decisions:
- issue: 왕권과 군사 지휘를 함께 묘사하는 표현
  chosen_reading: ‘그들의 왕으로서 그들의 군대를 이끌며 그들 위에 일어난 자’로 옮겨, ἀνέστηκεν의 ‘일어나다/올라서다’ 이미지를 유지했습니다.
  alternative_readings:
  - 그들 위에 군림하는 왕
  - 그들을 다스리는 왕
  rationale: 본문은 단순히 통치만 말하지 않고, ‘일어난’이라는 상승 이미지를 사용해 권위의 부상을 그립니다. 이를 평평하게 만들면 원문의 수사적 힘이 약해집니다.
  doctrine_reference: 문예적·서술적 뉘앙스 보존
