review_pass:
  verdict: revise
  source_fidelity: 수정안은 ἐπιστρέψαντες의 하나님께 대한 귀환, ἀνέβησαν의 ‘올라옴’, 흩어짐의 장소에서의 귀환, 예루살렘의 확보, 산지 정착이라는 병렬 동작을 보존합니다. ὅτι ἦν ἔρημος는 여성형 선행사인 ‘산지’를 가리키는 것으로 보이므로, 이를 명시하여 한국어 대명사의 모호성을 제거했습니다.
  naturalness: 초안의 ‘디아스포라에서 올라와’와 ‘그들이 그곳에 흩어졌던 디아스포라’는 현대 한국어에서 장소 관계가 부자연스럽습니다. 또한 ‘그것이 황무지였기 때문에’는 무엇이 황무지였는지 분명하지 않습니다. 수정안은 자연스러운 합쇼체 문장으로 정리합니다.
  terminology: ἁγίασμα는 ‘성소’로 유지했습니다. κατέσχον은 군사적 함의를 불필요하게 강화할 수 있는 ‘점령했습니다’ 대신, 소유·확보의 뜻을 충실히 나타내는 ‘차지하고’로 옮겼습니다. ‘디아스포라’ 음역과 그 설명 각주는 본문 이해에 필요하지 않으며, 여기서는 ‘흩어져 있던 곳들’로 뜻을 직접 번역했습니다.
  issues:
  - severity: medium
    issue: ‘디아스포라에서’ 및 ‘그들이 그곳에 흩어졌던 디아스포라’의 결합이 부자연스럽습니다.
    rationale: διασπορά는 흩어져 있는 상태·집합을 가리키지만, 한국어에서 ‘디아스포라’는 흔히 사람들의 집단을 뜻하므로 ‘~에서 올라오다’와 결합할 때 출발 장소가 불명확해집니다. 원문의 흩어짐과 그 장소라는 의미는 ‘흩어져 있던 곳들에서’로 자연스럽게 전달할 수 있습니다.
  - severity: medium
    issue: ‘그것이 황무지였기 때문에’의 지시 대상이 모호합니다.
    rationale: 원문의 ἦν ἔρημος는 바로 앞의 ‘산지’를 받는 것으로 이해하는 것이 자연스럽습니다. 한국어에서는 ‘그것’이 성소·예루살렘·산지 중 어느 것을 가리키는지 불명확하므로 ‘그 산지가 사람이 살지 않는 곳이었기 때문에’라고 밝혀야 합니다.
  - severity: low
    issue: ‘점령했습니다’는 κατέσχον의 의미보다 군사 행동을 다소 강하게 특정합니다.
    rationale: 이 동사는 예루살렘을 확보하여 소유하게 된 뜻을 나타냅니다. ‘차지하고’는 그 의미를 유지하면서 전투·군사 점령을 명시하지 않습니다.
  revised_text: 이제 그들은 자기들의 하나님께 돌아와, 그들이 이곳저곳에 흩어져 있던 곳들에서 올라와 그들의 성소가 있는 예루살렘을 차지하고, 그 산지가 사람이 살지 않는 곳이었기 때문에 그곳에 정착했습니다.
