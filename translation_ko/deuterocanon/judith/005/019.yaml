    reason: lexical_alternative
  - marker: b
    text: Or 'because it was desolate' or 'because it was uninhabited.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 이제 그들의 하나님께로 돌아선 그들은, 그들이 그곳에 흩어졌던 디아스포라에서 올라와 예루살렘을 점령했습니다. 그곳에 그들의 성소가 있었고, 그것이 황무지였기 때문에 그들은 산지에 정착했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘디아스포라’는 ‘흩어짐’의 의미를 보존한 음역입니다.
    reason: korean_style_note
lexical_decisions:
- source_word: ἐπιστρέψαντες ἐπὶ τὸν θεὸν αὐτῶν
  english_pob_choice: having turned back to their God
  chosen_korean: 그들의 하나님께로 돌아선
  alternatives_korean:
  - 그들의 하나님께 돌아간
  - 그들의 하나님께 회심한
  lexicon: BDAG
  rationale: ‘돌아선’은 단순 이동이 아니라 하나님께 대한 충성의 방향 전환을 살리면서도, ‘회심한’처럼 후대적 교회 용어를 과도하게 덧씌우지 않습니다.
- source_word: ἐκ τῆς διασπορᾶς
  english_pob_choice: from the dispersion
  chosen_korean: 디아스포라에서
  alternatives_korean:
  - 흩어짐에서
  - 포로 생활에서
  lexicon: BDAG
  rationale: διασπορά의 집합적·명사적 성격을 살려 ‘디아스포라’로 옮겼고, 이는 ‘흩어짐’보다 본문이 말하는 상태를 더 직접적으로 드러냅니다.
- source_word: οὗ διεσπάρησαν ἐκεῖ
  english_pob_choice: where they had been scattered there
  chosen_korean: 그들이 그곳에 흩어졌던
  alternatives_korean:
  - 그들이 흩어졌던 곳에서
  - 그곳으로 흩어졌던
  lexicon: BDAG
  rationale: 그리스어의 중복된 장소 표현을 완전히 평준화하지 않고, ‘그곳에’로 남겨 강조를 어느 정도 반영했습니다.
- source_word: κατέσχον τὴν Ἰερουσαλήμ
  english_pob_choice: took possession of Jerusalem
  chosen_korean: 예루살렘을 점령했습니다
  alternatives_korean:
  - 예루살렘을 차지했습니다
  - 예루살렘을 장악했습니다
  lexicon: BDAG
  rationale: κατέσχον은 단순한 거주가 아니라 실제로 도시를 확보한 뜻이 강하므로, ‘점령했습니다’가 본문의 역사적·정복적 뉘앙스를 가장 분명히 드러냅니다.
- source_word: τὸ ἁγίασμα
  english_pob_choice: sanctuary
  chosen_korean: 성소
  alternatives_korean:
  - 성전
  - 성역
  lexicon: LEH
  rationale: ἁγίασμα는 거룩하게 구별된 장소를 가리키므로, 이 문맥에서는 ‘성소’가 가장 자연스럽고 정확합니다.
- source_word: ἐν τῇ ὀρεινῇ
  english_pob_choice: in the hill country
  chosen_korean: 산지에
  alternatives_korean:
  - 산악 지대에
  - 고지대에
  lexicon: LEH
  rationale: 지리적 표현으로서 ὀρεινή를 한국어 성경에서도 익숙한 ‘산지’로 옮겨, 본문의 정착 배경을 간결하게 살렸습니다.
theological_decisions:
- issue: ‘하나님께로 돌아섰다’의 회개/언약적 귀환 뉘앙스
  chosen_reading: ‘돌아선’으로 번역해 하나님을 향한 방향 전환과 언약적 충성을 함께 살렸습니다.
  alternative_readings:
  - ‘돌아갔다’로 중립적으로 번역
  - ‘회심했다’로 번역
  rationale: 이 구절은 새 신앙의 수용보다 자기 백성의 하나님께 대한 재귀향을 말하므로, 회개의 의미를 암시하되 후대 교리 용어로 고정하지 않는 번역이 적절합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 3
