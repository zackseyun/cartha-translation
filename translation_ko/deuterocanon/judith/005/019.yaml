revisions:
- from: 그리고 이제 그들의 하나님께로 돌아선 그들은, 그들이 그곳에 흩어졌던 디아스포라에서 올라와 예루살렘을 점령했습니다. 그곳에 그들의 성소가 있었고, 그것이 황무지였기 때문에 그들은 산지에 정착했습니다.[a]
  to: 이제 그들은 자기들의 하나님께 돌아와, 그들이 이곳저곳에 흩어져 있던 곳들에서 올라와 그들의 성소가 있는 예루살렘을 차지하고, 그 산지가 사람이 살지 않는 곳이었기 때문에 그곳에 정착했습니다.
  rationale: 원문의 병렬 구조를 한 문장 안에서 유지하되, 한국어에 부자연스러운 음역 명사와 중복된 장소 표현을 뜻 중심으로 옮겼습니다. ‘그 산지’와 ‘그곳’을 사용하여 ἔρημος의 선행사와 정착 장소를 명료하게 했습니다. 원문의 강조적·중복적 장소 표현은 ‘이곳저곳에 흩어져 있던 곳들’로 반영했습니다.
