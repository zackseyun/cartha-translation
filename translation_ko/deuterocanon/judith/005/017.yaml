    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 자기들의 하나님 앞에서 죄를 짓지 않는 동안에는 좋은 것들이 그들과 함께 있었으니,[a] 불의를 미워하시는 하나님께서 그들과 함께 계시기 때문입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘좋은 것들’입니다. 이 표현은 특정한 물질적 형통에 한정하지 않고 포괄적인 좋은 상태나 복리를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어 ἀδικία는 ‘불의’ 외에 문맥에 따라 ‘부정의’ 또는 ‘악행’을 뜻할 수 있습니다.
    reason: lexical_alternative
