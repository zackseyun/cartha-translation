base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/005/017.yaml
  text: And as long as they did not sin before their God[a], good things were with them[b], because a God who hates injustice is with them.
  footnotes:
  - marker: a
    text: Or 'good things were with them.' The Greek expression is more literal, while 'prosperity' renders the idiom in natural English.
    reason: lexical_alternative
  - marker: b
    text: Or 'a God who hates wrongdoing' or 'a God who hates unrighteousness.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 자기들의 하나님 앞에서 죄를 짓지 않는 동안에는 좋은 것들이 그들과 함께 있었으니, 악을 미워하시는 하나님이 그들과 함께 계셨기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘좋은 것들’입니다. 이 표현은 영어 POB의 설명처럼 번역어를 ‘형통’처럼 좁히지 않고, 문맥의 포괄적 복리를 남겨 둡니다.
    reason: lexical_alternative
  - marker: b
    text: ἀδικία는 이 문맥에서 ‘불의’뿐 아니라 더 넓게 ‘악/부정의’를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ἕως
  english_pob_choice: And as long as
  chosen_korean: ~하는 동안에는
  alternatives_korean:
  - ~할 때까지
  - ~하는 한
  lexicon: LSJ
  rationale: 지속되는 조건을 자연스럽게 살리면서, 종료 시점이 올 때까지의 범위를 한국어로 유연하게 표현했습니다.
- source_word: οὐχ ἥμαρτον
  english_pob_choice: they did not sin
  chosen_korean: 죄를 짓지 않는
  alternatives_korean:
  - 죄를 짓지 않았던
  - 죄를 범하지 않는
  lexicon: BDAG
  rationale: 문맥상 조건 절 안의 지속적 상태를 드러내기 위해 단순 과거보다 현재적 조건형으로 옮겼습니다.
- source_word: ἦν μετʼ αὐτῶν τὰ ἀγαθά
  english_pob_choice: good things were with them
  chosen_korean: 좋은 것들이 그들과 함께 있었으니
  alternatives_korean:
  - 복된 것들이 그들과 함께 있었으니
  - 형통함이 그들과 함께 있었으니
  lexicon: LSJ
  rationale: τὰ ἀγαθά의 직역적 의미를 유지해, 영어 POB가 지적한 바와 같이 의미를 너무 좁히지 않도록 했습니다.
- source_word: θεὸς μισῶν ἀδικίαν
  english_pob_choice: a God who hates injustice
  chosen_korean: 악을 미워하시는 하나님
  alternatives_korean:
  - 불의를 미워하시는 하나님
  - 부정의를 미워하시는 하나님
  lexicon: BDAG
  rationale: ἀδικία를 단순한 법적 '불의'보다 넓은 도덕적 악으로 받아들여, 서술의 문맥을 살린 표현을 택했습니다.
theological_decisions:
- issue: 문장 끝의 현재 시제(ἐστίν)를 한국어에서 어떻게 살릴 것인가
  chosen_reading: ‘계셨다’로 과거화하지 않고 ‘계십니다/계셨습니다’의 의미를 보존하되, 문장 전체는 과거 서술에 맞춰 정리했습니다.
  alternative_readings:
  - 모두 과거로 평탄화하여 ‘함께 있었다’로 처리
  - 현재형으로 직접 옮겨 ‘함께 계십니다’로 처리
  rationale: 본문은 앞절의 과거 진술에서 하나님의 성격을 설명하는 현재로 이동합니다. 한국어에서는 과도한 직역 어색함을 피하면서도 그 신학적 긴장을 유지하도록 했습니다.
  doctrine_reference: 보존된 시제 전환과 신학적 긴장
