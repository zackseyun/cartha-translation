    rationale: 원문은 ἦν(‘있었다’) 뒤에 현재형 ἐστίν(‘있다/계시다’)을 사용합니다. 초안의 ‘계셨기 때문입니다’는 이 전환을 평탄화합니다.
  - severity: medium
    issue: ἀδικία를 ‘악’으로 번역함
    rationale: ‘악’도 가능한 넓은 표현이지만, ἀδικία의 정의·도덕적 부정의 의미를 더 직접적으로 반영하는 ‘불의’가 본문 번역으로 적절합니다. ‘악’은 각주 대안으로 남길 수 있습니다.
  - severity: medium
    issue: 각주 표지가 문장 끝에 함께 배치됨
    rationale: a는 τὰ ἀγαθά의 번역을, b는 ἀδικία의 번역을 설명하므로 각각 ‘좋은 것들’과 ‘불의’ 바로 뒤에 배치해야 독자가 각주의 대상을 명확히 알 수 있습니다.
