theological_decisions:
- issue: 문장 끝의 현재 시제(ἐστίν)를 한국어에서 어떻게 살릴 것인가
  chosen_reading: ‘계셨다’로 과거화하지 않고 ‘계십니다/계셨습니다’의 의미를 보존하되, 문장 전체는 과거 서술에 맞춰 정리했습니다.
  alternative_readings:
