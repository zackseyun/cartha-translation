  source_fidelity: 마지막 절의 현재형 ἐστίν은 ‘계셨기 때문입니다’로 과거화되지 않아야 합니다. 또한 ἀδικία는 ‘악’보다 ‘불의’가 더 직접적이며, 각주 표지는 해당 표현 바로 뒤에 두는 것이 적절합니다.
  naturalness: ‘그들과 함께 계시기 때문입니다’는 과거 서술 안에서 그리스어의 현재형이 드러내는 성격적·지속적 진술을 자연스러운 합쇼체로 보존합니다. ‘좋은 것들’은 다소 직역적이나 τὰ ἀγαθά의 포괄성을 보존하는 데 무리가 없습니다.
  terminology: ‘하나님’, ‘죄를 짓다’, ‘불의’는 표준 한국어 성서 문체에 자연스럽고 원문의 의미 범위를 충실히 반영합니다. ‘불의’에 대한 대안 범위는 각주로 제시합니다.
