  yaml_path: translation/deuterocanon/judith/005/015.yaml
  text: And they lived in the land of the Amorites[a], and by their strength they destroyed all the Heshbonites; and after crossing the Jordan[b], they took possession of all the hill country.
  footnotes:
  - marker: a
    text: Or 'in their strength' or 'through their might.'
    reason: lexical_alternative
  - marker: b
    text: Or 'inherited all the hill country.' The Greek verb can carry the sense of receiving a possession, but here it refers to taking possession of territory after crossing the Jordan.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 아모리 사람들의 땅에 살았고, 그들의 힘으로[a] 모든 헤스본 사람들을 멸망시켰습니다. 그리고 요르단을 건너 모든 산지를 차지했습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘자신들의 힘으로’ 또는 ‘그들의 위력으로’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘모든 산지를 상속받았습니다.’ 그리스어 동사는 소유로 받는다는 뜻도 지닐 수 있지만, 여기서는 요르단을 건넌 뒤 영토를 차지한 것을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: γῇ Ἀμορραίων
  english_pob_choice: the land of the Amorites
  chosen_korean: 아모리 사람들의 땅
  alternatives_korean:
  - 아모리 족속의 땅
  - 아모리인의 땅
  lexicon: LSJ
  rationale: γῇ + 속격은 소유·연관의 땅을 뜻하므로, 현대 한국어에서 가장 자연스럽고 투명한 ‘아모리 사람들의 땅’으로 옮겼습니다.
- source_word: ἐξωλόθρευσαν
  english_pob_choice: destroyed
  chosen_korean: 멸망시켰습니다
  alternatives_korean:
  - 파괴했습니다
  - 없애 버렸습니다
  lexicon: LSJ
  rationale: 이 동사는 완전한 파멸을 가리키므로, 단순한 피해가 아니라 총체적 멸망을 드러내는 ‘멸망시켰습니다’가 적절합니다.
- source_word: πάντας τοὺς Ἐσεβωνείτας
  english_pob_choice: all the Heshbonites
  chosen_korean: 모든 헤스본 사람들
  alternatives_korean:
  - 모든 헤스본 주민들
  - 모든 헤스본인들
  lexicon: LSJ
  rationale: Ἐσεβωνείτας는 헤스본에 속한 사람들을 가리키는 집단명이라, 지명형을 살리되 한국어로는 사람 집단을 분명히 하는 표현이 가장 자연스럽습니다.
- source_word: ἐκληρονόμησαν πᾶσαν τὴν ὀρεινήν
  english_pob_choice: took possession of all the hill country
  chosen_korean: 모든 산지를 차지했습니다
  alternatives_korean:
  - 모든 산지를 상속받았습니다
  - 온 산지를 기업으로 받았습니다
  lexicon: LSJ
  rationale: 정복 문맥에서 κληρονομέω는 단순한 상속보다 ‘소유로 삼다/차지하다’의 뜻이 강하므로, 한국어로는 ‘차지했습니다’가 의미를 가장 잘 드러냅니다.
theological_decisions:
- issue: 정복과 상속의 의미를 함께 가진 κληρονομέω의 처리
  chosen_reading: ‘차지했습니다’로 번역하되, 정복 결과로 영토를 소유하게 된 뜻을 유지했습니다.
  alternative_readings:
  - ‘상속받았습니다’
  - ‘기업으로 받았습니다’
  rationale: 이 절은 출애굽·가나안 서사처럼 유업 언어를 떠올리게 하지만, 실제 문맥은 전쟁과 점령의 결과이므로 수동적 상속보다 적극적 점유를 드러내는 번역이 본문 의도에 더 가깝습니다.
  doctrine_reference: 서사 문맥의 유업 언어와 역사적 정복 진술의 구분
