base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/005/001.yaml
  text: And it was reported to Holofernes[a], the commander-in-chief of the forces of Assyria, that the sons of Israel had prepared for war, and had blocked the roads of the hill country and fortified every summit of every high mountain[b], and had set up obstacles in the plains.
  footnotes:
  - marker: a
    text: Or 'the Israelites' / 'the children of Israel.' The Greek reads literally 'the sons of Israel,' a standard ethnic designation.
    reason: lexical_alternative
  - marker: b
    text: Or 'traps' or 'barricades' for 'obstacles'; the Greek term can denote something that causes stumbling, but here it refers to physical impediments in a military setting.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그 소식이 아수르 군대의 최고 사령관 홀로페르네스에게 전해졌습니다. 곧 이스라엘의 자손이 전쟁을 위해 준비하였고, 산간 지방의 길들을 막았으며, 높은 산의 모든 봉우리를 요새화하였고, 평지에는 장애물을 두었다는 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이스라엘 사람들’ / ‘이스라엘의 자손들’입니다. 그리스어는 문자적으로 ‘이스라엘의 아들들’이라고 하며, 민족을 가리키는 관용적 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘덫’이나 ‘바리케이드’입니다. 그리스어는 넘어지게 하는 물건을 뜻할 수 있지만, 여기서는 군사적 상황의 물리적 방해물을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνηγγέλη
  english_pob_choice: it was reported
  chosen_korean: 전해졌습니다
  alternatives_korean:
  - 보고되었습니다
  - 알려졌습니다
  lexicon: BDAG
  rationale: 사역적 수동의 비인칭 전달을 한국어에서 자연스럽게 살리되, 누가 전했는지는 밝히지 않은 채 소식이 도달했다는 점을 유지합니다.
- source_word: ἀρχιστρατήγῳ δυνάμεως Ἀσσούρ
  english_pob_choice: the commander-in-chief of the forces of Assyria
  chosen_korean: 아수르 군대의 최고사령관
  alternatives_korean:
  - 아수르 군대의 총사령관
  - 아수르 군대의 대장
  lexicon: LSJ
  rationale: ἀρχιστρατηγός의 최고 지위를 드러내기 위해 ‘최고사령관’을 택했고, δύναμις는 군사적 문맥에서 ‘군대/군세’로 이해해 자연스럽게 옮겼습니다.
- source_word: οἱ υἱοὶ Ἰσραήλ
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘의 자손
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘의 아들들
  lexicon: LSJ
  rationale: 그리스어의 친족·민족 표지를 보존하면서도 한국어에서 통용되는 성경적 표현으로 읽히도록 했습니다.
- source_word: πᾶσαν κορυφὴν ὄρους ὑψηλοῦ
  english_pob_choice: every summit of every high mountain
  chosen_korean: 높은 산의 모든 봉우리
  alternatives_korean:
  - 모든 높은 산의 모든 꼭대기
  - 높은 산마다의 모든 정상
  lexicon: LSJ
  rationale: distributive한 뉘앙스를 살려 ‘모든 봉우리’로 옮기고, κορυφή의 산 정상 의미를 분명히 했습니다.
- source_word: σκάνδαλα
  english_pob_choice: obstacles
  chosen_korean: 장애물
  alternatives_korean:
  - 걸림돌
  - 덫
  - 방해물
  lexicon: BDAG
  rationale: 여기서는 신학적 ‘걸림돌’보다 군사·지형적 방해물을 뜻하므로, 물리적 장애를 나타내는 중립적 표현을 택했습니다.
theological_decisions:
- issue: σκάνδαλα의 의미를 신학적 ‘걸림돌’로 볼지, 군사적 장애물로 볼지
  chosen_reading: 평지에는 장애물을 두었다
  alternative_readings:
  - 평지에는 걸림돌을 놓았다
  - 평지에는 덫을 놓았다
  rationale: 본문은 적대적 방어 준비를 묘사하므로, 후대의 비유적 용례를 끌어오지 않고 지형적·군사적 의미를 유지하는 것이 문맥에 더 충실합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 6
- issue: ὑψηλοῦ와 κορυφή의 중첩 강조를 어떻게 반영할지
  chosen_reading: 높은 산의 모든 봉우리
  alternative_readings:
  - 모든 높은 산의 봉우리
  - 높은 산마다의 모든 정상
  rationale: ‘모든 봉우리’와 ‘높은 산’을 함께 두어, 반복적 강조와 분배적 의미를 한국어에서 과도하지 않게 반영했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 2
