review_pass:
  verdict: revise
  source_fidelity: 핵심 내용은 원문에 충실합니다. 다만 ‘나그네로 살다가 ... 머물렀습니다’는 παρῴκησαν의 한 동작을 중복하여 표현하고, ‘부양될 때까지’는 대상과 의미가 다소 불분명합니다. 이를 ‘양식을 공급받을 때까지 나그네로 살았습니다’로 고치면 거류와 수동형 διετράφησαν의 의미가 모두 더 분명해집니다.
  naturalness: 합쇼체는 일관되지만, 기존 문장의 ‘살다가 ... 머물렀습니다’는 연결과 서술어가 어색합니다. 또한 ‘가나안 땅의 얼굴을 덮었으므로’보다 ‘가나안 땅을 뒤덮었기 때문에’가 현대 표준어 문체에서 자연스럽고 원문의 포괄적 이미지를 유지합니다.
  terminology: ‘이집트로 내려가다’, ‘나그네로 살다’, ‘족속’은 본문의 역사적·계보적 문맥에 적절합니다. γένος는 현대적 인종 개념으로 한정하지 않고 ‘족속’으로 옮길 수 있으며, ‘그들의 족속의 수’라고 하여 원문의 ‘그들의 γένος의 수가 없었다’를 더 직접적으로 반영했습니다.
  issues:
  - severity: medium
    issue: ‘거기서 나그네로 살다가 그들이 부양될 때까지 머물렀습니다’의 중복·어색한 연결
    rationale: παρῴκησαν은 ‘나그네/타국인으로 거주했다’라는 하나의 서술인데, ‘살다가’와 ‘머물렀습니다’를 겹쳐 사용하면 원문에 없는 동작 구분처럼 들립니다. 또한 ‘부양되다’는 보통 특정 부양 주체를 요구해 문맥상 다소 부자연스럽습니다.
  - severity: low
    issue: ‘그들의 족속은 헤아릴 수 없게 되었습니다’의 통사적 불명확성
    rationale: 원문은 족속 자체가 아니라 그 수가 셀 수 없었다고 말합니다. ‘그들의 족속의 수는 헤아릴 수 없었습니다’가 원문 구조와 한국어 표현 모두에 더 가깝습니다.
  revised_text: 그들은 기근이 가나안 땅을 뒤덮었기 때문에 이집트로 내려갔고, 그곳에서 양식을 공급받을 때까지 나그네로 살았습니다. 그들은 այնտեղ서 매우 큰 무리가 되었고, 그들의 족속의 수는 헤아릴 수 없었습니다.
