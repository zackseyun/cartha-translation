  text: And they went down into Egypt[a], for a famine covered the face of the land of Canaan, and they lived there as sojourners until they were sustained; and there they became a very great multitude, and there was no number to their family line.
  footnotes:
  - marker: a
    text: Or 'there was no number of their stock/people'; the Greek γένος can denote lineage, kin-group, or people descended from a common ancestor.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 기근이 가나안 땅을 뒤덮었기 때문에 이집트로 내려갔고, 그곳에서 양식을 공급받을 때까지 나그네로 살았습니다. 그들은 այնտեղ서 매우 큰 무리가 되었고, 그들의 족속의 수는 헤아릴 수 없었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατέβησαν
  english_pob_choice: went down
  chosen_korean: 내려갔고
  alternatives_korean:
  - 갔고
  - 내려가고
  lexicon: LSJ
  rationale: 이집트로 향하는 관용적 방향성을 살리면서, 성경적 용례의 ‘내려가다’ 이미지를 자연스럽게 반영했습니다.
- source_word: παρῴκησαν
  english_pob_choice: lived there as sojourners
  chosen_korean: 거기서 나그네로 살다가
  alternatives_korean:
  - 거기서 거류하다가
  - 거기서 이방인으로 살다가
  lexicon: LSJ
  rationale: 단순 거주가 아니라 임시 체류와 타지인 신분을 드러내는 뜻을 살려 ‘나그네로 살다’로 옮겼습니다.
- source_word: μέχρις οὗ διετράφησαν
  english_pob_choice: until they were sustained
  chosen_korean: 그들이 부양될 때까지
  alternatives_korean:
  - 그들이 공급될 때까지
  - 그들이 먹여 살림을 받을 때까지
  lexicon: LSJ
  rationale: 수동태의 ‘먹고사는 데 필요한 지원을 받다’는 의미를 자연스러운 한국어로 풀어, 단순히 먹었다는 뜻으로 좁히지 않았습니다.
- source_word: οὐκ ἦν ἀριθμὸς τοῦ γένους αὐτῶν
  english_pob_choice: there was no number to their family line
  chosen_korean: 그들의 족속은 헤아릴 수 없게 되었습니다
  alternatives_korean:
  - 그들의 가문은 셀 수 없게 되었습니다
  - 그들의 민족은 셀 수 없게 되었습니다
  lexicon: LSJ
  rationale: γένος의 계보·혈통·친족 집단 의미를 반영하되, 현대의 ‘인종’ 뉘앙스를 피하면서도 집단의 계승적 정체성을 드러냈습니다.
theological_decisions:
- issue: 기근과 번성의 서술이 보여 주는 집단 정체성
  chosen_reading: 가나안의 기근 때문에 이집트로 내려간 조상들의 체류와 번성을 그대로 서술했습니다.
  alternative_readings:
  - 교훈적으로 풀어 말하는 방식
  - 더 신학적으로 요약하는 방식
  rationale: 본문의 역사적·서사적 흐름을 유지하는 것이 중요하므로, 의미를 일반화하지 않고 원문의 진행을 따라 옮겼습니다.
  doctrine_reference: Translation philosophy §1, §6
