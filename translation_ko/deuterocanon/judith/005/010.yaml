- from: 그들은 기근이 가나안 땅의 얼굴을 덮었으므로 이집트로 내려갔고, 거기서 나그네로 살다가 그들이 부양될 때까지 머물렀습니다. 그리고 거기서 매우 큰 무리가 되었고, 그들의 족속은 헤아릴 수 없게 되었습니다.
  to: 그들은 기근이 가나안 땅을 뒤덮었기 때문에 이집트로 내려갔고, 그곳에서 양식을 공급받을 때까지 나그네로 살았습니다. 그들은 այնտեղ서 매우 큰 무리가 되었고, 그들의 족속의 수는 헤아릴 수 없었습니다.
  rationale: 원문의 접속 관계와 서사 순서를 유지하면서, προσωρινή 거류를 나타내는 παρῴκησαν은 ‘나그네로 살았습니다’로, 먹여 살림을 받았다는 수동 의미의 διετράφησαν은 ‘양식을 공급받을 때까지’로 자연스럽고 명확하게 옮겼습니다. 마지막 절은 γένος의 계보·친족 집단 의미를 ‘족속’으로 유지하되, 무수함의 대상이 그 수임을 명시했습니다.
