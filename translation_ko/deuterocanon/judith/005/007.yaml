- from: 그리고 그들은 이전에 메소포타미아에서 나그네로 살았습니다[a]. 그것은 그들이 자기 조상들의 신들[b]—그 신들이 갈대아 사람들의 땅에 있었기 때문입니다—을 따르기를 원하지 않았기 때문입니다.
  to: 그리고 그들은 전에 메소포타미아에서 나그네로 살았습니다[a]. 이는 그들이 갈대아 사람들의 땅에 있던 자기 조상들의 신들[b]을 따르기를 원하지 않았기 때문입니다.
  rationale: 수정문은 ὅτι가 이끄는 인과관계를 ‘이는 … 원하지 않았기 때문입니다’로 정확히 보존하고, οἳ ἐγένοντο ἐν γῇ Χαλδαίων을 ‘신들’을 수식하는 관계절로 회복했습니다. ‘있던’은 본문의 다소 특이한 ἐγένοντο를 과도하게 해석하지 않는 자연스러운 본문 번역이며, 각주가 ‘있게 된’ 및 ‘생겨난’ 가능성을 함께 밝혀 텍스트의 모호성을 보존합니다.
