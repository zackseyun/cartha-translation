  yaml_path: translation/deuterocanon/judith/005/007.yaml
  text: And formerly they lived as sojourners in Mesopotamia[a], because they were not willing to follow the gods of their fathers[b], who were in the land of the Chaldeans.
  footnotes:
  - marker: a
    text: Or 'sojourned in Mesopotamia.' The Greek verb suggests residing there as foreigners or temporary residents.
    reason: lexical_alternative
  - marker: b
    text: The clause 'who had come to be in the land of the Chaldeans' may also be understood more smoothly as 'which were in the land of the Chaldeans' or 'who originated in the land of the Chaldeans.'
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 그들은 이전에 메소포타미아에서 나그네로 살았습니다[a]. 그것은 그들이 자기 조상들의 신들[b]—그 신들이 갈대아 사람들의 땅에 있었기 때문입니다—을 따르기를 원하지 않았기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘메소포타미아에 나그네로 머물렀습니다.’ 그리스어 동사는 그곳에 외국인이나 임시 거주자로 살았음을 시사합니다.
    reason: lexical_alternative
  - marker: b
    text: 이 절의 ‘그 신들’은 문맥상 조상들의 신들을 가리킵니다. ‘갈대아 사람들의 땅에 있었기 때문입니다’는 보다 매끄럽게 ‘갈대아 사람들의 땅에서 비롯된 것’으로도 이해될 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: παρῴκησαν
  english_pob_choice: lived as sojourners
  chosen_korean: 나그네로 살았습니다
  alternatives_korean:
  - 거류민으로 살았습니다
  - 소journ하였습니다
  - 임시로 살았습니다
  lexicon: BDAG
  rationale: παροικέω는 단순 거주보다 외국인·임시 거주자의 뉘앙스를 담으므로, 한국어에서는 ‘나그네로 살았습니다’가 외지인 신분과 거주 사실을 함께 살립니다.
- source_word: τὸ πρότερον
  english_pob_choice: formerly
  chosen_korean: 이전에
  alternatives_korean:
  - 옛적에
  - 전에는
  - 먼저
  lexicon: LSJ
  rationale: 이전 시점을 표시하는 부사이므로, 문맥에 자연스러운 ‘이전에’로 옮겼습니다.
- source_word: τοῖς θεοῖς τῶν πατέρων αὐτῶν
  english_pob_choice: the gods of their fathers
  chosen_korean: 자기 조상들의 신들
  alternatives_korean:
  - 그들의 아버지들의 신들
  - 조상신들
  - 선조들의 신들
  lexicon: LSJ
  rationale: 그리스어의 소유 관계와 혈통적 전승을 살리되, 한국어에서 자연스럽고 오해가 적은 ‘조상들의 신들’로 옮겼습니다.
- source_word: οἳ ἐγένοντο ἐν γῇ Χαλδαίων
  english_pob_choice: who had come to be in the land of the Chaldeans
  chosen_korean: —그 신들이 갈대아 사람들의 땅에 있었기 때문입니다—
  alternatives_korean:
  - —그 신들이 갈대아 사람들의 땅에서 생겨났기 때문입니다—
  - —그 신들이 갈대아 땅에 있었기 때문입니다—
  - —그 신들이 갈대아 사람들의 땅에 있게 되었기 때문입니다—
  lexicon: BDAG
  rationale: ἐγένοντο의 다소 특이한 용법을 무리하게 ‘생겨났다’로 단정하지 않고, 주어진 주석의 범위 안에서 ‘있었습니다’와 설명적 절을 결합해 의미를 보존했습니다.
theological_decisions:
- issue: 조상들의 신들을 따르지 않음의 표현 강도
  chosen_reading: ‘따르기를 원하지 않았기 때문입니다’로 번역해, 본문이 말하는 의지의 거부를 드러내면서도 ‘숭배를 거부했다’로 과도하게 강화하지 않았습니다.
  alternative_readings:
  - 숭배하기를 거부했기 때문입니다
  - 따르기를 거절했기 때문입니다
  rationale: 본문은 ‘예배하다’보다 ‘따르다’와 ‘원하지 않다’의 결합으로 말하므로, 그 어조를 유지하는 것이 더 source-direct합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 3, 4
