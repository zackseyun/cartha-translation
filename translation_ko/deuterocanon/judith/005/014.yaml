  text: And he led them onto the way of Sinai and Kadesh-barnea[a]; and they drove out all who were living in the wilderness[b],
  footnotes:
  - marker: a
    text: Or 'on the route to Sinai and Kadesh-barnea.' The Greek phrase 'the way of Sinai and Kadesh-barnea' may denote the route associated with or leading toward those places.
