  text: 그리고 그는 그들을 시내와 가데스-바르네아[a]의 길로 인도했으며, 그들은 광야에 살고 있던 모든 사람을 쫓아냈습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘시내와 가데스-바르네아로 가는 길’입니다. 그리스어 ‘시내와 가데스-바르네아의 길’은 그곳들과 관련되거나 그곳들로 향하는 경로를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘광야에 거주하던 모든 사람들’입니다. 그리스어는 문자적으로 ‘광야에 거주하는 모든 이들’이라는 분사구를 사용합니다.
    reason: lexical_alternative
