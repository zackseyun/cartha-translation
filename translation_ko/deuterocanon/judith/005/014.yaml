  terminology: ‘시내’, ‘가데스-바르네아’, ‘광야’는 한국어 성서 문맥에서 통용되는 지명·지리 용어입니다. ‘쫓아냈습니다’는 ἐξέβαλον의 강제적 축출 의미를 무리 없이 전달합니다.
