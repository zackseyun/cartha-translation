lexical_decisions:
- source_word: διὰ τί
  english_pob_choice: why
  chosen_korean: 어찌하여
  alternatives_korean:
  - 왜
  - 무슨 이유로
  lexicon: LSJ
  rationale: 직접적인 이유 질문을 자연스럽고 격식 있게 살리기 위해 ‘어찌하여’를 택했습니다.
- source_word: κατενωτίσαντο
  english_pob_choice: refuse
  chosen_korean: 거절하였습니까
  alternatives_korean:
  - 귀를 기울이지 않았습니까
  - 못 들은 체했습니까
  - 외면하였습니까
  lexicon: LSJ
  rationale: 어근상 ‘귀에 주의하다/듣다’의 뉘앙스가 있지만, 뒤의 부정 부정사 구조에서는 ‘오기를 거절하다’는 뜻이 분명하므로 현대 한국어에서는 ‘거절하였습니다’로 옮겼습니다.
- source_word: εἰς ἀπάντησίν μοι
  english_pob_choice: to meet me
  chosen_korean: 나를 맞으러
  alternatives_korean:
  - 나를 만나러
  - 나와 만나기 위해
  lexicon: LSJ
  rationale: ἀπάντησις의 ‘마중/대면’ 뉘앙스를 살려, 단순한 만남보다 ‘맞으러’가 더 직접적으로 대응합니다.
- source_word: παρὰ πάντας τοὺς κατοικοῦντας ἐν δυσμαῖς
  english_pob_choice: unlike all who dwell in the west
  chosen_korean: 서쪽에 사는 모든 사람들과 달리
  alternatives_korean:
  - 서쪽에 거주하는 모든 이들과 달리
  - 서방에 사는 모든 사람들과 달리
  lexicon: LSJ
  rationale: παρά + 대격의 대비 의미를 ‘-와 달리’로 자연스럽게 풀었고, δυσμαῖς는 지리적 방향인 ‘서쪽’으로 옮겼습니다.
