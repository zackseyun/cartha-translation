  text: And they cried out to their God[a], and he struck the land of Egypt with plagues for which there was no healing; and the Egyptians drove them out from before them.
  footnotes:
  - marker: a
    text: Or 'from their presence.' The Greek expression 'from before them' is a literal rendering of a Semitic idiom for expulsion.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 자기들의 하나님께 부르짖었고, 그분께서는 이집트 땅을 치유가 없는 재앙들로 치셨습니다. 그리고 이집트 사람들은 그들을 자기들 앞에서 내쫓았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 앞에서’. 그리스어 표현 ‘그들 앞에서’는 추방을 뜻하는 셈어식 관용구를 문자적으로 옮긴 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνεβόησαν
  english_pob_choice: cried out
  chosen_korean: 부르짖었으며
  alternatives_korean:
  - 외쳤으며
  - 소리쳤으며
  lexicon: LSJ
  rationale: 하나님께 드리는 절박한 호소라는 점을 살려 단순한 외침보다 간구의 뉘앙스가 있는 ‘부르짖다’를 택했습니다.
- source_word: ἐπάταξεν γῆν Αἴγυπτον πληγαῖς
  english_pob_choice: struck the land of Egypt with plagues
  chosen_korean: 이집트 땅에 낫지 않는 재앙들을 내리셨습니다
  alternatives_korean:
  - 이집트 땅을 재앙들로 치셨습니다
  - 이집트 땅에 재앙들을 치셨습니다
  lexicon: LSJ
  rationale: 문자적으로는 ‘치다/때리다’이지만, 문맥상 출애굽 재앙을 가리키므로 ‘재앙들을 내리셨습니다’로 옮겨 하나님의 직접적 행위를 자연스럽게 드러냈습니다.
- source_word: ἐν αἷς οὐκ ἦν ἴασις
  english_pob_choice: for which there was no healing
  chosen_korean: 낫지 않는
  alternatives_korean:
  - 치유가 없는
  - 고칠 수 없는
  lexicon: LSJ
  rationale: ‘ἴασις’의 핵심은 치유/회복이 없다는 뜻이므로, 간결하면서도 결과를 분명히 하는 ‘낫지 않는’으로 처리했습니다.
- source_word: ἀπὸ προσώπου αὐτῶν
  english_pob_choice: from before them
  chosen_korean: 자기들 앞에서
  alternatives_korean:
  - 그들의 앞에서
  - 그들의 존재 앞에서
  lexicon: LSJ
  rationale: POB 각주가 밝히듯 이 표현은 셈어식 관용구이므로, 직역의 어색함을 유지하기보다 한국어에서도 의미가 드러나도록 ‘앞에서’로 옮겼습니다.
theological_decisions:
- issue: 하나님 주어의 인칭과 문장 연결
  chosen_reading: 앞 절의 주어를 이어 받아 하나님을 주어로 분명히 드러내되, 한국어에서는 ‘그분은’으로 매끄럽게 연결했습니다.
  alternative_readings:
  - 직역하여 ‘그리고 그분이 이집트 땅을 치셨습니다’
  - 주어를 생략하여 문맥에 맡기는 방식
  rationale: 원문의 주체는 하나님이며, 한국어에서 이를 명시해야 의미가 분명해집니다. 동시에 원문의 연속 서술을 보존하기 위해 연결어 ‘그리고’를 유지했습니다.
  doctrine_reference: 서술문에서 주어 지시를 명확히 하되 원문의 역사 서술 성격을 보존
