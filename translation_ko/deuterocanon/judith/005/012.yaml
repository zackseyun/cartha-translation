  source_fidelity: 핵심 사건 순서와 주어는 대체로 충실합니다. 다만 ‘재앙들을 내리셨습니다’는 ἐπάταξεν(‘치셨습니다’)의 직접적인 표현을 약화하며, ‘그래서’는 원문의 단순 접속 καί보다 강한 인과를 보탭니다. ‘낫지 않는 재앙들’도 뜻은 통하지만, ἐν αἷς οὐκ ἦν ἴασις의 ‘치유가 없었다’를 더 명시적으로 옮기는 편이 좋습니다.
  naturalness: 수정문은 현대 표준어 합쇼체를 유지하면서도 ‘재앙들로 치셨습니다’와 ‘치유가 없는 재앙들’로 자연스럽고 명료하게 다듬었습니다. ‘자기들 앞에서 내쫓았습니다’는 이집트 사람들이 자신들의 면전/영역에서 이스라엘 사람들을 몰아냈다는 문맥상 뜻을 자연스럽게 드러냅니다.
  terminology: ‘하나님’, ‘부르짖다’, ‘재앙’, ‘치다’, ‘내쫓다’는 문맥과 한국어 성서 문체에 적절합니다. 마지막 관용구는 본문에서 문맥상 주된 이해를 반영하되, 각주에서 문자적 대안과 셈어식 관용성을 보존합니다.
