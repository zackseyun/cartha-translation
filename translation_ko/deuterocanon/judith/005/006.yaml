  lexicon: BDAG
  rationale: λαός는 집합적 ‘백성’을 가리키며, οὗτός의 지시성을 한국어의 ‘이’로 자연스럽게 살렸습니다. '이 사람들'도 가능하지만 집단적·민족적 뉘앙스는 '백성'이 더 잘 드러냅니다.
- source_word: ἀπόγονοι
  english_pob_choice: descendants
  chosen_korean: 후손
  alternatives_korean:
  - 자손
  - 자손들
  - 후예
  lexicon: BDAG
  rationale: γεν계적 출신을 말하는 말로서 '후손'이 현대 한국어에서 가장 분명하고 간결합니다. '자손'도 가능하지만 문맥상 ‘~의 후손’ 구성이 더 자연스럽습니다.
- source_word: Χαλδαίων
  english_pob_choice: the Chaldeans
  chosen_korean: 갈대아 사람들
  alternatives_korean:
  - 갈대아인들
  - 갈대아 족속
  - 갈대아
  lexicon: BDAG
  rationale: 민족/집단명으로 이해되는 표현이므로 '갈대아 사람들'로 옮겨 의미를 분명히 했습니다. 단순 음역 '갈대아인들'도 가능하지만 한국어 독자는 '사람들'이 더 즉각적으로 식별합니다.
