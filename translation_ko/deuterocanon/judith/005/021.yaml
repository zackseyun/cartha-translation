  text: But if there is no lawlessness in their nation[a], let my lord pass by, lest perhaps their Lord and their God defend them, and we become a reproach before all the earth.
  footnotes:
  - marker: a
    text: 'Greek: ''let the lord pass by.'' In context this is best understood as a respectful address to Holofernes (''my lord''), not a reference to God.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 만일 그들의 민족에게 불법이 없다면, 내 주께서는 지나가십시오. 혹시 그들의 주와 그들의 하나님께서 그들을 지켜 주셔서, 우리가 온 땅 앞에서 수치거리가 될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문의 첫 번째 ὁ κύριος는 하나님이 아니라 홀로페르네스를 높여 부르는 말로 이해하는 것이 문맥상 적절합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνομία
  english_pob_choice: lawlessness
  chosen_korean: 불법
  alternatives_korean:
  - 무법
  - 악행
  - 죄악
  lexicon: BDAG
  rationale: ἀνομία의 법 위반과 도덕적 무질서의 힘을 살리기 위해, 본문 문맥에서 가장 직접적인 ‘불법’으로 옮겼습니다.
- source_word: ἔθνος
  english_pob_choice: nation
  chosen_korean: 민족
  alternatives_korean:
  - 나라
  - 백성
  - 국민
  lexicon: BDAG
  rationale: 여기서는 이스라엘을 집합적·민족적 단위로 가리키므로, 정치적이고 집단적인 뉘앙스를 주는 ‘민족’이 적절합니다.
- source_word: παρελθέτω
  english_pob_choice: let my lord pass by
  chosen_korean: 내 주께서 그냥 지나가게 하십시오
  alternatives_korean:
  - 내 주께서 지나가십시오
  - 그가 지나가게 하십시오
  - 내 주께서 비켜 가십시오
  lexicon: BDAG
  rationale: 동사의 핵심은 ‘지나가다/그냥 지나치다’이므로 이를 살리고, 앞의 ὁ κύριος는 문맥상 홀로페르네스를 높여 부르는 말로 보아 ‘내 주’로 처리했습니다.
- source_word: ὑπερασπίσῃ
  english_pob_choice: defend
  chosen_korean: 변호하실
  alternatives_korean:
  - 지키실
  - 보호하실
  - 방패가 되실
  lexicon: LSJ
  rationale: 이 동사는 단순 보호보다 ‘옹호하다, 변호하다’의 공적·법정적 색채가 있어, 문맥의 수치/비난과 연결되는 ‘변호하실’이 적절합니다.
- source_word: πάσης τῆς γῆς
  english_pob_choice: all the earth
  chosen_korean: 온 땅
  alternatives_korean:
  - 온 세상
  - 전 세계
  - 온 나라
  lexicon: BDAG
  rationale: γῆ의 확장된 수사적 범위를 살리되 한국어에서 자연스럽게 들리도록 ‘온 땅’으로 옮겼습니다.
theological_decisions:
- issue: 첫 번째 κύριος와 두 번째 κύριος의 구분
  chosen_reading: 앞의 κύριος는 홀로페르네스에 대한 존칭 ‘내 주’로, 뒤의 κύριος는 이스라엘의 하나님을 가리키는 ‘주’로 번역했습니다.
  alternative_readings:
  - 둘 다 ‘주’로 옮겨 모호성을 남김
  - 첫 번째도 하나님의 주권으로 읽음
  rationale: 대화 맥락상 앞의 명령은 인간 통치자에게 하는 공손한 호칭이며, 뒤는 ‘그들의 하나님’과 병렬되어 신적 주어임이 분명하므로 구분하는 것이 본문 의도를 더 정확히 드러냅니다.
  doctrine_reference: κύριος의 의미는 문맥에 따라 구분한다
