base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/005/018.yaml
  text: But when they turned away from the path that he had appointed for them[a], they were utterly destroyed in many wars, to a very great extent[b], and they were taken captive into a land not their own, and the temple of their God was laid level with the ground, and their cities were seized by their adversaries.
  footnotes:
  - marker: a
    text: Or 'way' instead of 'path.' The Greek term can denote a literal road or, as here, a figurative course of life appointed by God.
    reason: lexical_alternative
  - marker: b
    text: The phrase 'to a very great extent' renders an intensive Greek expression that may emphasize the severity of their destruction.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 하나님이 그들에게 정해 주신 길에서 벗어나자[a], 그들은 여러 전쟁 속에서 아주 크게 멸망했고[b], 자기들의 땅이 아닌 곳으로 포로가 되었으며, 그들의 하나님 성전은 땅바닥으로 무너졌고, 그들의 성읍들은 대적들에게 점령당했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘길’ 대신 ‘도’로도 옮길 수 있습니다. 여기서는 하나님이 정하신 삶의 경로라는 비유적 의미를 반영합니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어의 강한 강조구 ἐπὶ πολὺ σφόδρα를 반영한 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστησαν ἀπὸ τῆς ὁδοῦ
  english_pob_choice: turned away from the path
  chosen_korean: 길에서 벗어나자
  alternatives_korean:
  - 길을 떠나자
  - 길을 버리자
  - 길에서 돌아서자
  lexicon: LSJ
  rationale: ὁδός는 문자적 ‘길’이면서도 문맥상 하나님이 정하신 삶의 경로를 가리키므로, 한국어에서는 ‘길에서 벗어나다’가 자연스럽고 비유적 의미를 함께 살립니다.
- source_word: διέθετο
  english_pob_choice: had appointed
  chosen_korean: 정해 주신
  alternatives_korean:
  - 지정하신
  - 명하신
  - 베푸신
  lexicon: LSJ
  rationale: 중간태의 의미를 살려 하나님이 그들에게 미리 정해 주신 삶의 길이라는 뜻을 드러내되, ‘임명하다’보다 문맥에 맞는 ‘정해 주다’로 옮겼습니다.
- source_word: ἐξωλεθρεύθησαν
  english_pob_choice: were utterly destroyed
  chosen_korean: 아주 크게 멸망했고
  alternatives_korean:
  - 완전히 멸망했고
  - 철저히 파괴되었고
  - 완전히 멸절되었고
  lexicon: LSJ
  rationale: 강한 소멸의 뜻을 유지하면서도, 한국어에서 전쟁과 연속되는 파국을 자연스럽게 표현하는 쪽으로 ‘아주 크게 멸망하다’를 택했습니다.
- source_word: ἐπὶ πολὺ σφόδρα
  english_pob_choice: to a very great extent
  chosen_korean: 아주 크게
  alternatives_korean:
  - 매우 크게
  - 지극히 심하게
  - 극도로
  lexicon: LSJ
  rationale: 이 강한 강조구는 단순한 시간표현이 아니라 파괴의 정도를 극대화하므로, 한국어에서는 중복 어색함 없이 강도를 살리는 ‘아주 크게’로 압축했습니다.
- source_word: ἐγενήθη εἰς ἔδαφος
  english_pob_choice: was laid level with the ground
  chosen_korean: 땅바닥으로 무너졌고
  alternatives_korean:
  - 땅과 평평하게 되었고
  - 흙바닥이 되도록 무너졌고
  - 완전히 허물어졌고
  lexicon: LSJ
  rationale: 관용구는 성전이 완전히 파괴되어 지면과 동일한 수준이 되었다는 뜻이므로, 건물 파괴 이미지를 선명하게 전달하는 표현으로 옮겼습니다.
- source_word: ὑπεναντίων
  english_pob_choice: adversaries
  chosen_korean: 대적들에게
  alternatives_korean:
  - 원수들에게
  - 적들에게
  - 반대자들에게
  lexicon: LSJ
  rationale: 문맥상 군사적 적대자들이므로, 한국어 성경에서 널리 이해되는 ‘대적’으로 옮겨 적대의 성격을 분명히 했습니다.
theological_decisions:
- issue: 재난의 원인과 하나님의 주권적 질서
  chosen_reading: 재난들은 하나님이 정해 주신 길을 그들이 벗어난 결과로 제시되지만, 각 재난의 직접적 행위 주체를 문법적으로 하나님으로 다시 명시하지는 않았습니다.
  alternative_readings:
  - 하나님이 각 재난의 직접 행위자임을 더 분명히 드러내는 번역
  - 원인-결과 연결을 약화시키는 중립적 번역
  rationale: 그리스어는 언약적 인과관계를 분명히 암시하지만, 수동태가 각 절마다 하나님의 직접 행위를 요구하지는 않습니다. 그래서 본문의 긴장과 책임 소재를 보존했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 3
