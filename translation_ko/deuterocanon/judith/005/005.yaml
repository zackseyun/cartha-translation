  yaml_path: translation/deuterocanon/judith/005/005.yaml
  text: And Achior[a], the leader of all the sons of Ammon, said to him, “Let my lord now hear a word from the mouth of your servant, and I will tell you the truth about the people who dwell in this hill country near you[b], and no falsehood will come from the mouth of your servant.”
  footnotes:
  - marker: a
    text: Or “of all the Ammonites.” The Greek literally says “of all the sons of Ammon.”
    reason: lexical_alternative
  - marker: b
    text: Or “from your servant’s mouth.” The Greek literally says “from the mouth of your servant.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 모든 암몬 자손의 지도자인 아히오르[a]가 그에게 말했습니다. “내 주여, 이제 당신의 종의 말을 들어 주십시오. 그러면 당신 가까이에 사는 이 산지의 백성에 관한 진실을 당신에게 알려 드리겠습니다. 당신의 종의 입에서는 어떤 거짓도 나오지 않을 것입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “모든 암몬 사람들의 지도자.” 그리스어는 문자적으로 “모든 암몬의 아들들의”이라고 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀχιὼρ
  english_pob_choice: Achior
  chosen_korean: 아히오르
  alternatives_korean:
  - 아치오르
  - 아키오르
  lexicon: 고유명사 음역
  rationale: 고유명사는 현대 한국어 음역으로 옮기되, 표준 외래어 표기법에 맞춰 자연스럽게 표기했습니다.
- source_word: ὁ ἡγούμενος
  english_pob_choice: the leader
  chosen_korean: 우두머리
  alternatives_korean:
  - 지도자
  - 통치자
  - 인도하는 자
  lexicon: LEH/BDB
  rationale: 문맥상 암몬 자손 전체를 이끄는 직함이므로, 격식은 유지하되 과도한 제도적 뉘앙스를 피하는 ‘우두머리’가 가장 직접적입니다.
- source_word: υἱῶν Ἀμμών
  english_pob_choice: of all the sons of Ammon
  chosen_korean: 모든 암몬의 아들들
  alternatives_korean:
  - 모든 암몬 사람들
  - 모든 암몬족
  lexicon: LEH
  rationale: 직역 구조를 살려 ‘아들들’이라는 히브리계 표현의 질감을 보존했습니다. 필요하면 문맥상 ‘암몬 사람들’로 이해될 수 있습니다.
- source_word: ἐκ στόματος τοῦ δούλου σου
  english_pob_choice: from the mouth of your servant
  chosen_korean: 당신의 종의 입에서 한 말
  alternatives_korean:
  - 당신의 종의 입에서
  - 당신의 종의 입에서 나오는 말
  lexicon: BDAG
  rationale: ‘입에서’라는 관용을 유지하면서 한국어에서는 자연스럽게 ‘한 말’까지 드러내어 발화 행위를 분명히 했습니다.
- source_word: ὀρεινὴν ταύτην
  english_pob_choice: this hill country
  chosen_korean: 이 산지
  alternatives_korean:
  - 이 산악 지방
  - 이 언덕 지방
  lexicon: LEH
  rationale: 지리적 표현인 ὀρεινή를 한국어 성경 문체에서 자연스러운 ‘산지’로 옮겼습니다.
- source_word: ψεῦδος
  english_pob_choice: falsehood
  chosen_korean: 거짓
  alternatives_korean:
  - 허위
  - 거짓말
  lexicon: BDAG
  rationale: 명사 ψεῦδος는 추상적 ‘거짓/허위’를 뜻하므로, 말 한 마디의 거짓말보다 포괄적인 ‘거짓’이 적절합니다.
theological_decisions:
- issue: δοῦλος의 한국어 처리
  chosen_reading: 종
  alternative_readings:
  - 노예
  - 종/종이 아닌 '종복'
  rationale: 이 절에서는 예속 신분을 드러내기보다 겸손한 자기호칭으로 기능하므로, 본문 내에서는 ‘종’을 택했습니다. 다만 ‘servant’의 완곡화를 피하려는 경우가 아니라는 점을 유지합니다.
  doctrine_reference: 'DOCTRINE.md: δοῦλος는 문맥에 따라 servant/slave를 구분하되, 의례적 자기비하 표현은 기능을 우선한다.'
- issue: κύριός μου의 한국어 처리
  chosen_reading: 내 주여
  alternative_readings:
  - 내 주님
  - 나의 주인이여
  rationale: 이 칭호는 인간 상관에게 드리는 존칭이므로, ‘주님’보다 관계적·궁정적 존칭인 ‘내 주여’가 더 자연스럽습니다. 합쇼체 본문과도 조화를 이룹니다.
  doctrine_reference: 'DOCTRINE.md: κύριος는 문맥에 따라 인간 호칭과 신적 칭호를 구분한다.'
