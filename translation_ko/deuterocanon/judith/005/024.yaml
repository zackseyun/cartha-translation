  text: Therefore we will indeed go up[a], and they will become food for all your army, master Holofernes.
  footnotes:
  - marker: a
    text: Or 'prey' or 'something to be devoured'; the Greek literally speaks of becoming 'for devouring' by the army.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 우리는 반드시 올라갈 것이며, 그들은 당신의 온 군대의 먹이가 될 것입니다[a], 홀로페르네스 주인님.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘먹을 것’이나 ‘삼켜질 것’으로 옮길 수 있습니다. 그리스어는 문자적으로 그들이 군대가 삼켜 버릴 대상이 된다는 뜻을 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ δὴ
  english_pob_choice: Therefore ... indeed
  chosen_korean: 그러므로 우리는 반드시
  alternatives_korean:
  - 그러므로 ... 정말로
  - 그리하여 우리는 반드시
  - 그러니 우리는 반드시
  lexicon: LSJ
  rationale: διό의 결론 표시와 δή의 강조를 함께 살려, 단순한 인과가 아니라 확신에 찬 결론임을 한국어 부사로 드러냈습니다.
- source_word: ἀναβησόμεθα
  english_pob_choice: we will ... go up
  chosen_korean: 올라갈 것이며
  alternatives_korean:
  - 올라가겠습니다
  - 쳐들어갈 것이며
  - 올라가리라
  lexicon: LSJ
  rationale: 군사적 이동의 상향 이미지를 유지하면서도 한국어에서 자연스러운 미래형으로 옮겼습니다.
- source_word: εἰς κατάβρωμα
  english_pob_choice: food
  chosen_korean: 먹이가 될 것입니다
  alternatives_korean:
  - 먹이가 되겠습니다
  - 삼킬 음식이 될 것입니다
  - 먹을 것이 될 것입니다
  lexicon: LSJ
  rationale: κατάβρωμα의 '먹혀 없어질 것'이라는 의미를 살려, 단순한 식량보다 더 강한 '먹이'로 옮겼습니다.
- source_word: πάσης τῆς στρατειᾶς σου
  english_pob_choice: for all your army
  chosen_korean: 모든 군대를 위한
  alternatives_korean:
  - 당신의 모든 군대를 위한
  - 온 군대의
  - 당신의 온 군대를 위한
  lexicon: LSJ
  rationale: πάσης τῆς στρατειᾶς σου를 직역적으로 살려 '모든 군대'로 표현했고, 전체 소속을 나타내기 위해 '위한'을 사용했습니다.
- source_word: δέσποτα
  english_pob_choice: master
  chosen_korean: 주인
  alternatives_korean:
  - 주인님
  - 지배자
  - 주
  lexicon: LSJ
  rationale: δέσποτα는 κύριος가 아니므로, 언약적 '주'보다 지배 관계를 드러내는 '주인'이 문맥상 더 적절합니다.
theological_decisions:
- issue: δέσποτα의 호칭 강도
  chosen_reading: '''주인''으로 옮겨, Holofernes에 대한 복종적이고 권위적인 호칭을 유지했습니다.'
  alternative_readings:
  - '''주''로 옮겨 더 익숙한 종교적 호칭을 쓰는 방식'
  - '''소버린''처럼 직역하는 방식'
  rationale: 본문은 신적 칭호가 아니라 인간 지휘관에게 쓰인 직접 호칭이므로, 한국어 교회 전통의 '주'가 주는 신학적 울림을 피하고 관계의 위계를 그대로 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md: Translate titles; preserve non-divine honorific distinctions'
