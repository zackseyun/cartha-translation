- from: 그러므로 우리는 반드시 올라갈 것이며, 그들은 모든 군대를 위한 먹이가 될 것입니다, 주인 오로페르네스여.[a]
  to: 그러므로 우리는 반드시 올라갈 것이며, 그들은 당신의 온 군대의 먹이가 될 것입니다[a], 홀로페르네스 주인님.
  rationale: The revision restores the singular possessive sense of ‘your whole army,’ uses a natural Korean form of direct address for δέσποτα, and corrects the footnote so that it supplies genuine lexical alternatives. It retains the emphatic conclusion, future tense, upward movement, and devouring metaphor of the Greek.
