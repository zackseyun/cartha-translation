  chosen_reading: 본문은 하나님께서 그들에게 떠나고 가라고 지시하신 것으로 옮겼습니다.
  alternative_readings:
  - 하나님께서 그들에게 명령하셨습니다
  - 하나님께서 그들에게 떠나라고 말씀하셨습니다
  rationale: 원문은 직접 명령형이 아니라 부정사 연쇄를 동반한 발화이므로, 명령의 강도를 과도하게 높이지 않고 지시적 발화로 처리했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 3, 6
