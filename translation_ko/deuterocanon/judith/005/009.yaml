base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/005/009.yaml
  text: And their God told them to go out from their sojourning and to go into the land of Canaan[a]; and they settled there[b], and became very wealthy in gold and silver and in very many livestock.
  footnotes:
  - marker: a
    text: Or 'from their dwelling as foreigners.' The Greek παροικία carries the sense of residing as an outsider or sojourner.
    reason: lexical_alternative
  - marker: b
    text: Or 'multiplied greatly in gold and silver and in exceedingly many livestock.' The Greek can emphasize great increase in possessions.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그들의 하나님께서 그들에게 그들의 나그네살이에서 나가 가나안 땅으로 들어가라고 말씀하셨습니다[a]. 그들은 거기에 정착했고[b], 금과 은과 매우 많은 가축이 크게 불어났습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '그들의 외국인 거주에서'. 그리스어 παροικία는 외지인이나 나그네로 거주하는 뜻을 가집니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '그들은 그곳에서 크게 불어났습니다.' 그리스어는 소유의 큰 증가를 강조할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν ὁ θεὸς αὐτῶν
  english_pob_choice: their God told them
  chosen_korean: 그들의 하나님께서 그들에게 말씀하셨습니다
  alternatives_korean:
  - 그들의 하나님께서 그들에게 이르셨습니다
  - 그들의 하나님께서 그들에게 명하셨습니다
  lexicon: LXX/BDAG
  rationale: εἶπεν 뒤에 부정사들이 이어져 지시적 발화의 성격이 강하므로, 과도하게 강한 '명하셨습니다'보다 중립적인 '말씀하셨습니다'가 원문과 잘 맞습니다.
- source_word: ἐκ τῆς παροικίας αὐτῶν
  english_pob_choice: from their sojourning
  chosen_korean: 그들의 나그네살이에서
  alternatives_korean:
  - 그들의 거류에서
  - 외국인으로 거주하던 곳에서
  lexicon: BDAG
  rationale: παροικία는 단순한 거주가 아니라 외지인/나그네로서의 거주를 가리키므로, 교회식의 평이한 '거주'보다 '나그네살이'가 그 이주성과 타자성을 더 잘 살립니다.
- source_word: γῆν Χανάαν
  english_pob_choice: the land of Canaan
  chosen_korean: 가나안 땅
  alternatives_korean:
  - 가나안의 땅
  - 가나안
  lexicon: BDAG
  rationale: γῆν의 땅 의미를 살리되, 한국어 성경에서 자연스러운 지리 표현인 '가나안 땅'을 사용했습니다.
- source_word: κατῴκησαν ἐκεῖ
  english_pob_choice: they settled there
  chosen_korean: 그들은 거기에 정착했습니다
  alternatives_korean:
  - 그들은 거기에 살았습니다
  - 그들은 거기에 거주했습니다
  lexicon: BDAG
  rationale: κατοικέω는 단순 존재가 아니라 거처를 잡아 사는 것을 뜻하므로, '정착했습니다'가 문맥상 가장 적절합니다.
- source_word: ἐπληθύνθησαν χρυσίῳ καὶ ἀργυρίῳ καὶ ἐν κτήνεσιν πολλοῖς σφόδρα
  english_pob_choice: became very wealthy in gold and silver and in very many livestock
  chosen_korean: 금과 은과 매우 많은 가축이 크게 불어났습니다
  alternatives_korean:
  - 금과 은과 매우 많은 가축으로 크게 늘어났습니다
  - 금과 은과 매우 많은 가축에서 크게 풍성해졌습니다
  lexicon: BDAG
  rationale: ἐπληθύνθησαν은 단순 인구 증가가 아니라 소유의 증대를 포함할 수 있으므로, '크게 불어났습니다'로 넓은 증가의 뉘앙스를 살렸습니다. κτήνεσιν은 특정 가축이 아니라 가축 전반이어서 '가축'으로 옮겼습니다.
theological_decisions:
- issue: '하나님의 말씀의 성격: 명령 vs 지시'
  chosen_reading: 본문은 하나님께서 그들에게 떠나고 가라고 지시하신 것으로 옮겼습니다.
  alternative_readings:
  - 하나님께서 그들에게 명령하셨습니다
  - 하나님께서 그들에게 떠나라고 말씀하셨습니다
  rationale: 원문은 직접 명령형이 아니라 부정사 연쇄를 동반한 발화이므로, 명령의 강도를 과도하게 높이지 않고 지시적 발화로 처리했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 3, 6
