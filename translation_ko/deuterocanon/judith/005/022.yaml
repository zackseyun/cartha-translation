  rationale: 현대 외래어 표기 감각에 맞추되, 기존 한국 교회 관용형보다 원음에 가까운 형태를 우선하여 본문의 역사적/문학적 거리감을 보존했습니다.
  doctrine_reference: 고유명사 음역 일관성 원칙
