  text: And it happened[a], when Achior had stopped speaking these words, that all the people around the tent and standing about began to grumble, and the nobles of Holofernes and all who lived by the seacoast and in Moab said to strike him down.
  footnotes:
  - marker: a
    text: Or 'to strike him down' or 'to kill him.' The Greek infinitive συγκόψαι is violent but does not specify the exact manner with complete precision.
    reason: lexical_alternative
translation:
  language: ko
  text: 아히오르가 이 말들을 마치자, 장막 둘레에 둘러서 있던 모든 백성이 투덜거리기 시작했고, 오로페르네의 귀족들과 해안가와 모압에 사는 모든 이가 그를 쳐 죽이라고 말했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그를 쳐 죽이라고’. 그리스어 συγκόψαι는 폭력적이지만, 정확한 방식까지는 완전히 특정하지 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ὡς
  english_pob_choice: And it happened, when
  chosen_korean: 아히오르가 이 말들을 마치자
  alternatives_korean:
  - 그리고 이 일이 일어났을 때
  - 아히오르가 이 말을 마치고
  lexicon: BDAG
  rationale: 서술 전환의 기능을 살리되 한국어에서는 관용적으로 자연스러운 시간 종속절로 풀어, 사건의 즉시성과 장면 전환을 함께 드러냈습니다.
- source_word: ἐγόγγυσεν
  english_pob_choice: began to grumble
  chosen_korean: 투덜거리기 시작했고
  alternatives_korean:
  - 중얼거리기 시작했고
  - 원망하기 시작했고
  lexicon: BDAG
  rationale: γογγύζω의 불만 섞인 웅성거림을 살리면서도, 군중의 적대적 반응을 현대 한국어로 자연스럽게 전달했습니다.
- source_word: οἱ μεγιστᾶνες Ὀλοφέρνου
  english_pob_choice: the nobles of Holofernes
  chosen_korean: 오로페르네의 귀족들
  alternatives_korean:
  - 오로페르네의 대신들
  - 오로페르네의 권세가들
  lexicon: LSJ
  rationale: μεγιστᾶνες는 단순한 신하보다 높은 지위의 유력자들을 가리키므로, 한국어에서는 위계감을 유지하는 ‘귀족들’이 가장 적절합니다.
- source_word: συγκόψαι αὐτόν
  english_pob_choice: to strike him down
  chosen_korean: 그를 쳐 죽이라고
  alternatives_korean:
  - 그를 쳐서 죽이라고
  - 그를 쓰러뜨리라고
  lexicon: LSJ
  rationale: συγκόψαι는 단순한 ‘치다’보다 치명적 폭력을 내포하므로, 최종 결과를 명시하는 ‘쳐 죽이다’가 문맥상 가장 자연스럽고도 강합니다.
theological_decisions:
- issue: 폭력적 명령의 강도
  chosen_reading: 말살 의도까지는 확정하지 않고, 직접적이고 치명적인 폭력 명령으로 옮겼습니다.
  alternative_readings:
  - 그를 쓰러뜨리라고
  - 그를 죽이라고
  rationale: 그리스어 συγκόψαι는 구체적 방법은 특정하지 않지만 매우 폭력적인 행위이므로, 의미를 약화시키지 않으면서도 과도한 해석은 피했습니다.
  doctrine_reference: '본문 주해 원칙: 어휘의 폭력성은 보존하되 세부 방식의 불확실성은 유지'
- issue: Ἀχιώρ와 Ὀλοφέρνης 고유명사
  chosen_reading: 아히오르, 오로페르네로 음역했습니다.
  alternative_readings:
