  lexicon: BDAG
  rationale: 서술 전환의 기능을 살리되 한국어에서는 관용적으로 자연스러운 시간 종속절로 풀어, 사건의 즉시성과 장면 전환을 함께 드러냈습니다.
- source_word: ἐγόγγυσεν
  english_pob_choice: began to grumble
  chosen_korean: 투덜거리기 시작했고
  alternatives_korean:
