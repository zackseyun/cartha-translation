  text: For we will not be helped by the sons of Israel; for look, they are a people in whom there is neither strength nor might for strong battle formation.
translation:
  language: ko
  text: 우리는 이스라엘 자손에게서 도움을 받지 못할 것입니다. 보십시오, 그들은 강한 전열을 갖춘 싸움에 나설 만한 힘도 능력도 없는 백성입니다.
  philosophy: formal
lexical_decisions:
- source_word: βοηθησόμεθα
  english_pob_choice: we will not be helped
  chosen_korean: 도움을 받지 못할 것입니다
  alternatives_korean:
  - 도움을 얻지 못할 것입니다
  - 도움이 되지 않을 것입니다
  lexicon: βοηθέω
  rationale: 수동 미래의 의미를 살려 ‘도움을 받다’로 옮겼고, 단순한 가능성보다 확정적 부정의 뉘앙스를 유지했습니다.
- source_word: υἱῶν Ἰσραήλ
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘의 아들들
  - 이스라엘 사람들
  lexicon: υἱοί
  rationale: 직역에 가까운 성서적 표현을 유지하되, 한국어에서는 관용적인 ‘이스라엘 자손’이 가장 자연스럽습니다.
- source_word: παράταξιν ἰσχυράν
  english_pob_choice: strong battle formation
  chosen_korean: 강한 전열을 갖춘 싸움
  alternatives_korean:
  - 강한 진형의 전투
  - 강력한 전투 대형
  lexicon: παράταξις
  rationale: παράταξις의 군사적 ‘전열/진형’ 의미를 살려, 단순히 ‘전투’가 아니라 맞서 싸우는 배치 상태를 드러냈습니다.
theological_decisions:
- issue: 이스라엘에 대한 폄하적 진술의 보존
  chosen_reading: 원문의 판단적 표현을 완화하지 않고, ‘힘도 능력도 없는 백성’으로 그대로 드러냈습니다.
  alternative_readings:
  - 그들은 약한 백성입니다
  - 그들에게는 싸울 힘이 없습니다
  rationale: 문맥상 적대 진영의 발언으로서 과장된 경멸을 담고 있으므로, 이를 부드럽게 중화하지 않고 원문의 평가를 보존하는 것이 적절합니다.
  doctrine_reference: 서술 화자/발화자의 관점 보존
