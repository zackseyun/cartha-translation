base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/013/020.yaml
  text: And may God make these things for you into everlasting exaltation[a], to visit you with good things, because you did not spare your life on account of the humiliation of our people, but went out against our fallen condition, having walked straight before our God. And all the people said, “Amen, amen.”
  footnotes:
  - marker: a
    text: 'Or “May it be, may it be” / “So be it, so be it.” Greek: “Γένοιτο, γένοιτο.”'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 하나님께서 이 모든 일이 당신에게 영원한 영예가 되게 하시고, 좋은 일로 당신을 돌보아 주시기를 빕니다. 당신은 우리 백성이 겪은 굴욕 때문에 자신의 목숨을 아끼지 않았고, 우리 하나님 앞에서 곧은 길을 걸으며 우리의 몰락에 맞서 나아갔기 때문입니다. 그러자 온 백성이 말했습니다. “아멘, 아멘.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 Γένοιτο, γένοιτο의 직역은 “그렇게 되기를, 그렇게 되기를” 또는 “그리되소서, 그리되소서”입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ποιήσαι σοι αὐτὰ ... εἰς ὕψος αἰώνιον
  english_pob_choice: make these things for you into everlasting exaltation
  chosen_korean: 당신에게 이것들을 영원한 높임으로 삼으시고
  alternatives_korean:
  - 당신을 영원한 높임이 되게 하시고
  - 당신에게 영원한 영광이 되게 하시고
  lexicon: LSJ
  rationale: εἰς ὕψος αἰώνιον의 높이/고양 이미지를 살리면서, 축복의 기원문답게 자연스러운 현대 한국어로 옮겼습니다.
- source_word: τοῦ ἐπισκέψασθαί σε ἐν ἀγαθοῖς
  english_pob_choice: to visit you with good things
  chosen_korean: 좋은 것들로 당신을 찾아오시기를
  alternatives_korean:
  - 복된 것들로 당신을 돌보시기를
  - 좋은 것들로 당신에게 임하시기를
  lexicon: LSJ
  rationale: ἐπισκέπτομαι의 ‘찾아오다/돌보다’ 의미를 살려, 단순히 ‘복 주다’로 평평하게 만들지 않고 하나님의 적극적 방문을 드러냈습니다.
- source_word: οὐκ ἐφείσω τῆς ψυχῆς σου
  english_pob_choice: you did not spare your life
  chosen_korean: 당신의 목숨을 아끼지 않고
  alternatives_korean:
  - 당신의 생명을 아끼지 않고
  - 당신 자신을 아끼지 않고
  lexicon: LSJ
  rationale: ψυχή를 이 문맥의 실제 위험을 가리키는 ‘목숨/생명’으로 이해하여, 희생의 강도를 자연스럽게 전달했습니다.
- source_word: διὰ τὴν ταπείνωσιν τοῦ γένους ἡμῶν
  english_pob_choice: on account of the humiliation of our people
  chosen_korean: 우리 백성의 수치를 때문에
  alternatives_korean:
  - 우리 민족의 굴욕 때문에
  - 우리 백성의 비천함 때문에
  lexicon: LSJ
  rationale: ταπείνωσις의 수치·굴욕 뉘앙스를 살렸고, γένος은 현대 한국어에서 가장 자연스러운 공동체 표현인 ‘백성’으로 옮겼습니다.
- source_word: ἐπεξῆλθες πτώματι ἡμῶν
  english_pob_choice: went out against our fallen condition
  chosen_korean: 우리의 무너짐을 맞섰기 때문입니다
  alternatives_korean:
  - 우리의 몰락을 향해 나아갔기 때문입니다
  - 우리의 쓰러짐에 맞서 나섰기 때문입니다
  lexicon: LSJ
  rationale: ἐπεξέρχομαι의 대항/맞섬의 뉘앙스를 살리면서, πτῶμα의 ‘넘어짐·붕괴’를 ‘무너짐’으로 옮겨 문맥의 비참한 상태를 분명히 했습니다.
- source_word: ἐπʼ εὐθεῖαν πορευθεῖσα
  english_pob_choice: having walked straight before our God
  chosen_korean: 우리 하나님 앞에서 곧게 걸어가며
  alternatives_korean:
  - 우리 하나님 앞에서 올곧게 걸어가며
  - 우리 하나님 앞에서 바른길로 걸어가며
  lexicon: LSJ
  rationale: 직선적 진행과 도덕적 곧음이 함께 드러나는 표현이어서, ‘곧게 걸어가며’로 간결하게 처리했습니다.
- source_word: Γένοιτο, γένοιτο
  english_pob_choice: Amen, amen
  chosen_korean: 아멘, 아멘
  alternatives_korean:
  - 그렇게 되기를, 그렇게 되기를
  - 그리되소서, 그리되소서
  lexicon: LSJ
  rationale: 공동체의 응답으로서의 예배적 힘을 살리기 위해 한국 교회에서 널리 통하는 ‘아멘’을 유지하고, 반복도 보존했습니다.
theological_decisions:
- issue: 공동체의 응답 Γένοιτο, γένοιτο의 예전적 뉘앙스
  chosen_reading: 아멘, 아멘
  alternative_readings:
  - 그렇게 되기를, 그렇게 되기를
  - 그리되소서, 그리되소서
  rationale: 문자적 동의의 뜻은 있으나, 이 구절은 백성의 집단적 동의와 찬동을 나타내므로 한국어 예전 용례에 맞는 ‘아멘’을 택했습니다.
  doctrine_reference: 공동체 응답과 예전적 수용을 자연스럽게 드러내는 번역 원칙
