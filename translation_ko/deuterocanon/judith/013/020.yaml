review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 보존했지만, 본문의 두드러진 문법 오류(‘수치를 때문에’)와 ‘무너짐을 맞섰다’의 부자연스럽고 불완전한 목적어 결합을 고쳐야 합니다. αὐτά의 복수와 ‘영원한 높임’의 고양 이미지는 ‘이 모든 일이 ... 영원한 영예가 되게’로 자연스럽게 살릴 수 있습니다. ἐπεξῆλθες πτώματι ἡμῶν의 난해한 여격은 특정한 해석을 단정하지 않으면서 ‘우리의 몰락에 맞서 나아갔다’로 옮깁니다.
  naturalness: 초안은 ‘좋은 것들로 당신을 찾아오시기를’, ‘우리 백성의 수치를 때문에’, ‘우리의 무너짐을 맞섰기’가 현대 표준 한국어 합쇼체 문장으로 부자연스럽거나 비문입니다. 수정문은 축원과 그 근거의 관계를 분명히 하고, 공적 축복 발화에 맞는 현대적 격식체를 사용합니다.
  terminology: ‘하나님’, ‘백성’, ‘목숨’, ‘아멘’은 적절합니다. ταπείνωσις는 문맥상 ‘굴욕’이 ‘수치’보다 명사 결합과 원문의 공적 굴욕 의미를 더 자연스럽게 드러냅니다. Γένοιτο의 ‘아멘, 아멘’은 영어 POB의 예전적 선택을 따르되, 직역 대안은 각주에 유지합니다.
  issues:
  - severity: high
    issue: ‘우리 백성의 수치를 때문에’는 조사 결합 오류입니다.
    rationale: 명사 ‘수치’에는 ‘때문에’를 직접 붙일 수 없으므로 ‘수치 때문에’ 또는 ‘수치를 겪었기 때문에’여야 합니다. 원문의 διὰ τὴν ταπείνωσιν은 원인·이유를 나타냅니다.
  - severity: high
    issue: ‘우리의 무너짐을 맞섰기’는 목적격과 ‘맞서다’의 결합이 어색하고 문장 성분이 불완전합니다.
    rationale: ‘맞서다’는 보통 ‘~에 맞서다’ 또는 ‘~에 맞서 나아가다’로 씁니다. 난해한 πτώματι 여격을 과도하게 확정하지 않으면서 ‘우리의 몰락에 맞서 나아갔다’로 처리할 수 있습니다.
  - severity: medium
    issue: ‘좋은 것들로 당신을 찾아오시기를’은 하나님이 주어인 축원문에서 다소 부자연스럽습니다.
    rationale: ἐπισκέπτομαι의 호의적 방문/돌봄 의미는 ‘좋은 일로 당신을 돌보아 주시기를’로 자연스럽게 전달됩니다.
  - severity: low
    issue: ‘영원한 높임’은 한국어에서 명사적 축복 표현으로 다소 어색합니다.
    rationale: ὕψος의 높임·고양 이미지를 유지하면서 ‘영원한 영예’로 옮기면 현대 한국어에서 자연스럽고 원문의 지속적인 존귀 의미를 보존합니다.
