- from: 멀리서 유딧이 성문을 지키는 이들에게 말했습니다. 「열어라, 열어라, 문을. 하나님, 우리의 하나님께서 우리와 함께 계십니다. 이스라엘 가운데서 아직도 힘을 나타내시고 우리 원수들에게 대하여 능력을 보이시려고 — 오늘 그분이 하신 것과 같이.」[a]
  to: 유딧이 멀리서 성문들을 지키는 이들에게 말했습니다. “문을 여십시오, 여십시오. 하나님, 우리의 하나님께서[a] 우리와 함께 계셔서, 오늘 하신 것처럼 이스라엘에서 다시 힘을 나타내시고 우리 원수들을 대적하여 능력을 보이실 것입니다.”
