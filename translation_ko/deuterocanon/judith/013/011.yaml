  text: And Judith said from a distance to those guarding the gates[a], “Open up, open up the gate, for God, our God, is with us, still to show strength in Israel and power against our enemies, just as he has done today.”
  footnotes:
  - marker: a
    text: 'Greek: ''God, God of us,'' an emphatic repetition meaning ''God, our God.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 유딧이 멀리서 성문들을 지키는 이들에게 말했습니다. “문을 여십시오, 여십시오. 하나님, 우리의 하나님께서[a] 우리와 함께 계셔서, 오늘 하신 것처럼 이스라엘에서 다시 힘을 나타내시고 우리 원수들을 대적하여 능력을 보이실 것입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 ‘하나님, 우리의 하나님’으로, θεός의 반복이 강조를 이룹니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: μακρόθεν
  english_pob_choice: from a distance
  chosen_korean: 멀리서
  alternatives_korean:
  - 먼 데서
  - 거리 두고
  lexicon: LSJ
  rationale: 공간적 거리를 나타내는 부사이므로, 현대 한국어에서 자연스러운 ‘멀리서’로 옮겨 화자의 위치를 분명히 했습니다.
- source_word: τοῖς φυλάσσουσιν ἐπὶ τῶν πυλῶν
  english_pob_choice: to those guarding the gates
  chosen_korean: 성문을 지키는 이들에게
  alternatives_korean:
  - 성문을 지키는 자들에게
  - 문들을 지키는 이들에게
  lexicon: LSJ
  rationale: 분사구를 한국어에서는 관계절적으로 풀어 ‘지키는 이들’로 옮겼고, ἐπὶ τῶν πυλῶν은 성문 경비의 상황을 드러내는 ‘성문’을 택했습니다.
- source_word: Ἀνοίξατε, ἀνοίξατε δὴ τὴν πύλην
  english_pob_choice: Open up, open up the gate
  chosen_korean: 열어라, 열어라, 문을
  alternatives_korean:
  - 문을 열어라, 문을 열어라
  - 열어라, 열어라, 성문을
  lexicon: LSJ
  rationale: 반복 명령의 긴박함을 그대로 살리되, 한국어에서 더 자연스러운 단문 명령형으로 옮겼습니다. δὴ의 즉시성은 반복과 어조로 반영했습니다.
- source_word: ὁ θεὸς ὁ θεὸς ἡμῶν
  english_pob_choice: God, our God
  chosen_korean: 하나님, 우리의 하나님
  alternatives_korean:
  - 우리의 하나님
  - 하나님, 하나님이신 우리의 하나님
  lexicon: LSJ
  rationale: θεός의 반복을 합쳐 버리지 않고, 감탄적·강조적 중복을 보이도록 ‘하나님, 우리의 하나님’으로 옮겼습니다.
- source_word: ἰσχὺν / κράτος
  english_pob_choice: strength / power
  chosen_korean: 힘 ... 능력
  alternatives_korean:
  - 권능 ... 권세
  - 힘 ... 힘
  lexicon: LSJ
  rationale: 두 명사가 함께 나오므로 같은 낱말로 평준화하지 않고, ‘힘’과 ‘능력’으로 약간의 의미 차이를 살렸습니다.
theological_decisions:
- issue: Judith의 선언에서 하나님이 현재도 자기 백성과 함께 계시며 군사적 구원을 계속 일으키신다는 의미
  chosen_reading: ‘우리와 함께 계십니다’와 ‘아직도 힘을 나타내시고’로 현재적 동행과 지속적 구원을 드러냈습니다.
  alternative_readings:
  - ‘우리와 함께 있으시다’
  - ‘오늘처럼 또 힘을 베푸시려고’
  rationale: 그리스어의 서술적 문장과 목적 의미를 살려, 이미 이루어진 오늘의 구원 행위가 앞으로도 이어질 수 있음을 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Preserve theological tension rather than resolve it; do not flatten divine action into generic encouragement'
