  rationale: 장면에서 시선과 공간을 두고 빠져나가는 움직임을 자연스럽게 살리되, 단순한 이탈보다 궁정/밀실 맥락에 어울리는 ‘물러가다’를 택했습니다.
- source_word: ἐκ προσώπου
  english_pob_choice: from his presence
  chosen_korean: 그의 앞에서
  alternatives_korean:
  - 그의 임재에서
  - 그의 얼굴 앞에서
  lexicon: LSJ
  rationale: 직역하면 ‘그의 앞에서/그 앞을 떠나’라는 뜻이므로, 문맥상 이해 가능한 한국어 관용으로 옮기되 ‘presence’의 거리감과 위치 관계를 유지했습니다.
- source_word: ἐν τῷ κοιτῶνι
  english_pob_choice: in the bedroom
  chosen_korean: 방 안에는
  alternatives_korean:
  - 침실에는
  - 침실 안에는
  lexicon: LSJ
  rationale: κοιτών은 잠자리가 있는 사적인 방을 가리키므로, 현대 독자가 바로 이해할 수 있는 ‘방 안’으로 옮겼습니다. ‘침실’도 가능하지만, 장면의 사적 공간성을 충분히 담습니다.
- source_word: ἀπὸ μικροῦ ἕως μεγάλου
  english_pob_choice: from the least to the greatest
  chosen_korean: 작은 사람부터 큰 사람까지
  alternatives_korean:
  - 가장 작은 사람부터 가장 큰 사람까지
  - 신분 낮은 사람부터 높은 사람까지
  lexicon: LSJ
  rationale: 이 표현은 모두를 빠짐없이 가리키는 범위의 관용구이므로, 한국어로는 포괄적 의미를 살리면서도 구어적으로 이해되는 표현을 사용했습니다. 다만 ‘least/greatest’의 계층적 폭은 주석 없이 완전히 고정하지는 않았습니다.
