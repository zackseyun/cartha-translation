  text: And when the men of her city heard her voice, they hurried down to the gate of their city and called together the elders of the city.
translation:
  language: ko
  text: 그녀의 성읍 사람들은 그녀의 목소리를 듣자, 자기네 성읍의 문으로 급히 내려가서 성읍의 장로들을 불러 모았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ἄνδρες는 문자적으로 ‘남자들’이지만, 한국어에서는 문맥상 공동체 구성원을 가리키는 집단 표현으로 옮겼습니다.
    reason: korean_style_note
lexical_decisions:
- source_word: οἱ ἄνδρες τῆς πόλεως αὐτῆς
  english_pob_choice: the men of her city
  chosen_korean: 그녀의 성읍 사람들
  alternatives_korean:
  - 그녀의 성읍의 남자들
  - 그녀의 성읍의 사람들
  lexicon: BDAG
  rationale: ἄνδρες는 문자적으로 ‘남자들’이지만, 한국어에서는 이 표현이 어색하고 군집의 주체를 자연스럽게 드러내기 어렵습니다. 본문이 특정 성별을 논점으로 삼지 않으므로, POB의 남성 표지를 유지하되 현대 한국어로는 집단 지칭인 ‘성읍 사람들’로 옮겼습니다.
- source_word: τὴν φωνὴν αὐτῆς
  english_pob_choice: her voice
  chosen_korean: 그녀의 목소리
  alternatives_korean:
  - 그녀의 음성
  - 그녀의 소리
  lexicon: BDAG
  rationale: φωνή는 ‘목소리/음성/소리’의 폭이 있지만, 여기서는 그녀가 말하는 것을 들었다는 뜻으로 이해하는 것이 가장 자연스럽습니다. ‘목소리’는 의미를 과도하게 해석하지 않으면서 한국어로도 명확합니다.
- source_word: ἐσπούδασαν τοῦ καταβῆναι
  english_pob_choice: they hurried down
  chosen_korean: 급히 내려가서
  alternatives_korean:
  - 서둘러 내려가서
  - 황급히 내려가서
  lexicon: BDAG
  rationale: ἐσπούδασαν은 서두름과 긴박성을 나타내므로 ‘급히’가 자연스럽습니다. τοῦ καταβῆναι의 ‘내려가다’는 문맥상 성읍의 문으로 향하는 이동을 그대로 살렸습니다.
- source_word: συνεκάλεσαν τοὺς πρεσβυτέρους τῆς πόλεως
  english_pob_choice: called together the elders of the city
  chosen_korean: 성읍의 장로들을 불러 모았습니다
  alternatives_korean:
  - 성읍의 장로들을 소집했습니다
  - 성읍의 원로들을 불러 모았습니다
  lexicon: BDAG
  rationale: συνεκάλεσαν은 단순히 ‘부르다’보다 함께 모이게 하다의 뜻이 강하므로 ‘불러 모았습니다’가 적절합니다. πρεσβύτεροι는 문맥상 도시의 지도자/원로를 가리키므로 교회 용어보다 일반적 ‘장로들’을 택했습니다.
theological_decisions:
- issue: τῆς πόλεως αὐτῶν과 αὐτῆς의 소유격 관계
  chosen_reading: ‘그녀의 성읍’과 ‘자기네 성읍’으로 구분해 관계를 드러냈습니다.
  alternative_readings:
  - 모두 ‘그 성읍’으로 평준화
  - 모두 ‘그들의 성읍’으로 통일
  rationale: 원문은 Judith에게 속한 성읍(αὐτῆς)과 그 성읍 사람들에게 속한 성읍(αὐτῶν)을 구분합니다. 한국어에서도 두 소유격을 분리해 인물 관계와 시점의 차이를 보존했습니다.
  doctrine_reference: DOCTRINE.md §Source transparency and referential clarity
