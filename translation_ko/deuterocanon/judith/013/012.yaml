  terminology: ‘성읍’, ‘성읍의 문’, ‘장로들’은 서사 및 시민 공동체 문맥에 적절합니다. 여기서 ‘장로들’은 교회 직분을 특정하지 않고 도시의 원로·지도자들을 가리킵니다.
