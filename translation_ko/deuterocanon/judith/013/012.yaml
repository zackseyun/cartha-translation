  source_fidelity: 원문의 ἄνδρες는 구체적으로 남성들을 가리키므로, 초안의 ‘성읍 사람들’은 성별 표지를 중화하여 원문과 영어 POB의 ‘men’을 충분히 반영하지 못합니다. 그 밖에 ‘목소리’, ‘급히 내려가서’, ‘불러 모았습니다’는 각각 φωνή, ἐσπούδασαν τοῦ καταβῆναι, συνεκάλεσαν에 충실합니다.
