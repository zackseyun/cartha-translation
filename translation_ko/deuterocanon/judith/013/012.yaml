  to: 그녀가 속한 성읍의 남자들은 그녀의 목소리를 듣자, 그들의 성읍의 문으로 급히 내려가서 성읍의 장로들을 불러 모았습니다.
  rationale: ἄνδρες의 남성 지시를 ‘남자들’로 명시하여 원문 및 영어 POB와 일치시켰습니다. αὐτῆς는 ‘그녀가 속한 성읍’으로, αὐτῶν은 ‘그들의 성읍’으로 구별하여 소유격 관계를 드러냈습니다. 성별 중화를 설명하던 각주는 원문 충실성을 해치고 수정 본문과도 맞지 않아 삭제했습니다.
