  - 이스라엘 하나님이시여
  lexicon: LSJ
  rationale: 직접 호격의 기도 어조를 살리기 위해 ‘-이시여’를 사용했고, 소유 관계는 한국어 관용에 맞게 ‘이스라엘의 하나님’으로 옮겼습니다.
theological_decisions:
- issue: 기도의 직접 호칭과 청원 어조
  chosen_reading: 하나님께 직접 드리는 호격 기도로 처리해 ‘이시여’와 종결형 ‘-하소서’를 유지했습니다.
  alternative_readings:
  - 서술형으로 ‘이스라엘의 하나님, 오늘 이 날에 저를 강하게 해 주십시오’
  - 더 평이한 청원형으로 ‘저를 강하게 해 주시기를 바랍니다’
  rationale: 그리스어의 직접 부름과 간구를 약화시키지 않기 위해, 현대 한국어에서도 기도문 체를 분명히 드러냈습니다.
