revisions:
- from: 그러자 온 백성이 크게 놀랐고, 몸을 굽혀 하나님께 경배하며 한마음으로 말했습니다. 「우리 하나님이시여, 오늘 당신 백성의 원수들을 무가치하게 만드신 당신은 찬양받으십니다」[a]
  to: 그러자 온 백성이 크게 놀랐고, 몸을 굽혀 하나님께 경배하고 한마음으로 말했습니다. 「우리 하나님, 바로 오늘 주의 백성의 원수들을 아무것도 아니게 하신 주께서는 찬송받으실 분이십니다.」[a]
  rationale: 원문의 강한 놀람, 몸을 낮춘 경배, 공동체의 일치된 발화를 유지했습니다. 승리의 맥락에서 ἐξουδενόω가 나타내는 적들의 무력화와 ‘바로 오늘’의 시간적 강조를 더 분명히 했으며, 직접 하나님께 드리는 송축의 형식을 현대 한국어의 격식 있는 예배 언어로 정리했습니다.
