  text: And all the people were greatly astonished[a], and bowing down they worshiped God and said with one accord, “Blessed are you, our God, who today have brought the enemies of your people to nothing.”
  footnotes:
  - marker: a
    text: Or 'have reduced the enemies of your people to nothing.' The Greek verb can express making someone of no account or bringing them to ruin.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 온 백성이 크게 놀랐고, 몸을 굽혀 하나님께 경배하고 한마음으로 말했습니다. 「우리 하나님, 바로 오늘 주의 백성의 원수들을 아무것도 아니게 하신 주께서는 찬송받으실 분이십니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주의 백성의 원수들을 무로 돌리신’으로 옮길 수 있습니다. 그리스어 동사 ἐξουδενόω는 누군가를 하찮게 여기다, 아무것도 아니게 하다, 또는 패망시키다라는 뜻을 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξέστη πᾶς ὁ λαὸς σφόδρα
  english_pob_choice: were greatly astonished
  chosen_korean: 온 백성이 크게 놀랐고
  alternatives_korean:
  - 온 백성이 몹시 놀랐고
  - 온 백성이 크게 경악했고
  lexicon: BDAG; LSJ
  rationale: ἐξίστημι의 강한 놀람을 살리되 σφόδρα의 강조를 자연스럽게 반영하기 위해 ‘크게 놀랐고’로 옮겼습니다.
- source_word: κύψαντες προσεκύνησαν
  english_pob_choice: bowing down they worshiped
  chosen_korean: 몸을 굽혀 하나님께 경배하며
  alternatives_korean:
  - 엎드려 하나님께 경배하며
  - 몸을 숙여 하나님께 경배하며
  lexicon: LSJ; BDAG
  rationale: κύψαντες는 몸을 낮추는 동작이고 προσεκύνησαν은 하나님께 드리는 경배이므로, 동작과 예배 행위를 함께 드러냈습니다.
- source_word: ὁμοθυμαδόν
  english_pob_choice: with one accord
  chosen_korean: 한마음으로
  alternatives_korean:
  - 한뜻으로
  - 일제히
  lexicon: BDAG
  rationale: 공동체의 일치와 합의된 찬양의 뉘앙스를 현대 한국어로 가장 자연스럽게 전달하는 표현으로 보았습니다.
- source_word: ἐξουδενώσας
  english_pob_choice: have brought ... to nothing
  chosen_korean: 무가치하게 만드신
  alternatives_korean:
  - 없어지게 하신
  - 아무것도 아니게 하신
  - 무로 돌리신
  lexicon: LSJ
  rationale: ἐξουδενόω의 ‘하찮게 여기다/무가치하게 만들다’는 뜻을 살려, 적들을 완전히 무력화한 승리의 의미를 유지했습니다.
- source_word: τοὺς ἐχθροὺς τοῦ λαοῦ σου
  english_pob_choice: the enemies of your people
  chosen_korean: 당신 백성의 원수들
  alternatives_korean:
  - 주의 백성의 원수들
  - 당신의 백성의 적들
  lexicon: BDAG
  rationale: λαός를 ‘백성’으로 옮겨 언약 공동체를 드러내고, ἐχθρούς는 시편적·예배적 맥락에 맞게 ‘원수들’로 옮겼습니다.
theological_decisions:
- issue: 감탄문 도입부와 직접 찬양의 호칭
  chosen_reading: ‘우리 하나님이시여’로 직접 주소를 분명히 하되, 뒤의 찬양은 ‘찬양받으십니다’로 한국어 경배문 체계를 살렸습니다.
  alternative_readings:
  - ‘우리 하나님’
  - ‘우리 하나님은 복되십니다’
  rationale: 그리스어의 δεύτε-person 직접 호칭과 축복 선포의 형식을 함께 보존하면서도, 현대 합쇼체 예배 언어로 자연스럽게 들리게 했습니다.
  doctrine_reference: 'DOCTRINE.md: direct address in doxology; preserve source force without archaizing.'
