lexical_decisions:
- source_word: εὐλογημένος
  english_pob_choice: blessed
  chosen_korean: 복되십니다
  alternatives_korean:
  - 복을 받으신 분이십니다
  - 찬양받으십니다
  lexicon: BDAG
  rationale: 축복 선언의 도치 구조를 살리기 위해 ‘복되십니다’를 택했습니다. 단순한 ‘찬양받으십니다’보다 경배·송영의 힘을 더 잘 드러냅니다.
- source_word: Κύριος ὁ θεὸς
  english_pob_choice: the Lord God
  chosen_korean: 야훼 하나님
  alternatives_korean:
  - 주 하나님
  - 주님 하나님
  lexicon: LEH
  rationale: 본 절의 κύριος는 יהוה를 가리키는 호칭으로 보아, 프로젝트 기본값에 따라 ‘야훼’로 옮기고 ὁ θεός는 ‘하나님’으로 병기했습니다.
- source_word: τοὺς οὐρανοὺς καὶ τὴν γῆν
  english_pob_choice: the heavens and the earth
  chosen_korean: 하늘들과 땅
  alternatives_korean:
  - 하늘과 땅
  - 하늘들와 땅
  lexicon: LEH
  rationale: 그리스어 복수형 οὐρανούς를 반영해 ‘하늘들’로 옮겼고, 창조 공식의 고전적 어감을 과도하게 평준화하지 않도록 했습니다.
- source_word: εἰς τραῦμα κεφαλῆς
  english_pob_choice: to wound/strike the head
  chosen_korean: 머리에 상처를 내도록
  alternatives_korean:
  - 머리를 치도록
  - 머리를 상하게 하도록
  lexicon: LEH
  rationale: εἰς τραῦμα의 직역을 그대로 두기보다, 한국어에서 자연스러운 결과 상태 표현인 ‘상처를 내도록’으로 옮겨 ‘상처/부상’의 의미를 보존했습니다.
