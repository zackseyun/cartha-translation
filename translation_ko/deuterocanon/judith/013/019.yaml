  source_fidelity: 그리스어의 핵심 의미, 곧 창조주이신 주 하나님을 송축하고 하나님께서 유딧을 원수들의 통치자의 머리에 상처를 입히도록 인도하셨다는 내용은 대체로 반영되었습니다. 그러나 Κύριος ὁ θεός를 근거 없이 고유명사화한 ‘야훼 하나님’은 원문의 호칭적 표현 및 영어 감사 번역의 ‘the Lord God’보다 좁은 해석입니다. 또한 οὐρανούς의 복수를 기계적으로 옮긴 ‘하늘들과 땅’은 한국어 창조 관용구에서 부자연스럽습니다.
  naturalness: ‘우리 원수들의 우두머리의 머리에 상처를 내도록’은 소유격이 연속되어 다소 무겁습니다. ‘우리 원수들의 통치자의 머리에 상처를 입히도록’으로 하면 격 관계와 현대 표준어 문장이 더 자연스럽습니다. ‘하늘과 땅’은 한국어에서 확립된 자연스러운 창조 표현입니다.
  terminology: Κύριος ὁ θεός는 ‘주 하나님’으로 옮기는 것이 원문의 호칭을 보존하며 특정한 신명 표기 선택을 강제하지 않습니다. ἄρχων은 문맥상 ‘우두머리’보다 ‘통치자’가 더 직접적이고 중립적입니다. τραῦμα의 명사적 의미는 ‘상처를 입히도록’으로 유지했습니다.
