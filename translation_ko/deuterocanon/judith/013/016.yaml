  text: And as the Lord lives, who guarded me on the way by which I went, my face deceived him to his destruction, and he did not commit sin with me, resulting in defilement and shame.
  footnotes:
  - marker: a
    text: Literally, 'my face deceived him'; the phrase refers to Judith's outward appearance misleading Holofernes.
    reason: lexical_alternative
translation:
  language: ko
  text: 주님께서 살아 계심을 두고 맹세합니다. 그분께서는 제가 걸어간 길에서 저를 지켜 주셨습니다. 제 얼굴이[a] 그를 속여 그의 파멸에 이르게 하였으며, 그는 저와 함께 더러움과 수치를 초래할 죄를 짓지 않았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘제 얼굴이 그를 속였다’입니다. 문맥상 이는 유딧의 외적인 용모가 홀로페르네스를 속였다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ζῇ Κύριος
  english_pob_choice: as the Lord lives
  chosen_korean: 주님께서 살아 계시니
  alternatives_korean:
  - 주님이 살아 계시니
  - 주님이 살아 계십니다
  lexicon: LSJ
  rationale: 서원/맹세의 관용구를 자연스러운 합쇼체로 옮기되, κύριος를 주님으로 유지했습니다.
- source_word: διεφύλαξέν με
  english_pob_choice: guarded me
  chosen_korean: 저를 지켜 주신
  alternatives_korean:
  - 저를 보호하신
  - 저를 보전하신
  lexicon: LSJ
  rationale: 보호·보전의 뜻을 살리면서 문맥상 하나님의 돌보심을 드러내는 한국어로 옮겼습니다.
- source_word: ἠπάτησεν αὐτὸν τὸ πρόσωπόν μου
  english_pob_choice: my face deceived him
  chosen_korean: 제 얼굴이 그를 속여
  alternatives_korean:
  - 제 모습이 그를 속여
  - 제 용모가 그를 속여
  lexicon: LSJ
  rationale: 직역의 ‘얼굴’을 유지해 원문의 표현을 살리되, 문맥상 외모가 속였다는 뜻이 자연스럽게 읽히도록 했습니다.
- source_word: εἰς ἀπώλειαν αὐτοῦ
  english_pob_choice: to his destruction
  chosen_korean: 그의 파멸로 이르게 하였고
  alternatives_korean:
  - 그의 멸망으로
  - 그의 파괴로
  lexicon: LSJ
  rationale: ἀπώλειαν의 결과를 한국어 동사구로 풀어, 목적·결과를 함께 드러냈습니다.
- source_word: εἰς μίασμα καὶ αἰσχύνην
  english_pob_choice: resulting in defilement and shame
  chosen_korean: 더러움과 수치에 이르지 않았습니다
  alternatives_korean:
  - 부정함과 수치에 이르지 않았습니다
  - 더럽힘과 수치에 이르지 않았습니다
  lexicon: LSJ
  rationale: μίασμα의 부정한 상태와 αἰσχύνη의 수치를 함께 살리되, 한국어에서 읽기 자연스럽게 정리했습니다.
theological_decisions:
- issue: κύριος를 맹세문에서 어떻게 옮길지
  chosen_reading: 주님께서 살아 계시니
  alternative_readings:
  - 주님이 살아 계시니
  - 주께서 살아 계시니
  rationale: 본문의 엄숙한 맹세를 살리면서, POB의 κύριος 기본값인 주님을 유지했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: κύριος → Lord'
- issue: ‘제 얼굴이 그를 속여’의 표현을 얼마나 직역할지
  chosen_reading: 제 얼굴이 그를 속여
  alternative_readings:
  - 제 모습이 그를 속여
  - 제 외모가 그를 속여
  rationale: 원문의 직설적인 표현을 보존해, 외적 모습이 홀로페르네스를 속였다는 긴장을 흐리지 않았습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §§1, 3, 6
