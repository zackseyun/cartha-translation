  text: And she struck his neck twice with all her strength[a], and removed his head, and rolled his body off the bed[b], and took the canopy down from the posts.
  footnotes:
  - marker: a
    text: Or, more explicitly, 'cut off his head.' The Greek says literally 'removed his head,' but the context makes clear that she beheaded him.
    reason: lexical_alternative
  - marker: b
    text: The Greek term can refer to a mosquito net or a bed-canopy.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그녀는 있는 힘을 다해 그의 목을 두 번 내리쳤습니다. 그리고 그의 머리를 떼어 내고[a], 그의 몸을 침상에서 굴려 내렸으며, 기둥들에서 모기장을 걷어 내렸습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 더 명시적으로는 ‘그의 머리를 잘라 내고’로 옮길 수 있습니다. 그리스어는 문자적으로 ‘그의 머리를 떼어 내다’라고 표현하지만, 문맥은 참수를 분명히 가리킵니다.
    reason: alternative_reading
  - marker: b
    text: 그리스어 κωνώπιον은 모기장 또는 침상 덮개를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπάταξεν εἰς τὸν τράχηλον αὐτοῦ
  english_pob_choice: struck his neck
  chosen_korean: 그의 목을 두 번 내리치고
  alternatives_korean:
  - 그의 목을 쳤고
  - 그의 목을 강타하고
  lexicon: LSJ
  rationale: τράχηλος는 ‘목’이며, ἐπάταξεν의 강한 타격 뉘앙스를 한국어 동사 ‘내리치다’로 살렸습니다. εἰς 구문은 한국어에서는 자연스럽게 목적어로 처리했습니다.
- source_word: δὶς
  english_pob_choice: twice
  chosen_korean: 두 번
  alternatives_korean:
  - 두 차례
  - 두 번이나
  lexicon: LSJ
  rationale: 부사적 숫자 표현을 직접적으로 옮겼습니다.
- source_word: ἐν τῇ ἰσχύϊ αὐτῆς
  english_pob_choice: with all her strength
  chosen_korean: 온 힘을 다해
  alternatives_korean:
  - 그녀의 힘으로
  - 힘껏
  lexicon: LSJ
  rationale: 직역의 ‘그녀의 힘으로’보다, 행위의 강도와 방식이 드러나는 한국어 관용 표현을 택했습니다.
- source_word: ἀφεῖλεν τὴν κεφαλὴν αὐτοῦ
  english_pob_choice: removed his head
  chosen_korean: 그의 머리를 제거하고
  alternatives_korean:
  - 그의 머리를 잘라 내고
  - 그의 머리를 베어 내고
  lexicon: LSJ
  rationale: ἀφαιρέω의 기본 의미인 ‘떼어 내다/제거하다’를 유지해 그리스어의 어휘 형태를 따라가되, 서술 문맥상 참수의 의미가 분명하게 드러나도록 했습니다.
- source_word: ἀπεκύλισεν τὸ σῶμα αὐτοῦ ἀπὸ τῆς στρωμνῆς
  english_pob_choice: rolled his body off the bed
  chosen_korean: 그의 몸을 침상에서 밀어 내렸으며
  alternatives_korean:
  - 그의 몸을 침상에서 굴려 내렸으며
  - 그의 몸을 침상에서 굴려 떨어뜨렸으며
  lexicon: LSJ
  rationale: ἀπεκύλισεν의 ‘굴리다/굴려 옮기다’ 의미와 στρωμνή의 ‘침상’을 살리되, 한국어에서는 실제 장면을 자연스럽게 전달하는 ‘밀어 내리다’로 옮겼습니다.
- source_word: τὸ κωνώπιον ἀπὸ τῶν στύλων
  english_pob_choice: took the canopy down from the posts
  chosen_korean: 기둥들에서 휘장을 치웠습니다
  alternatives_korean:
  - 기둥들에서 캐노피를 내렸습니다
  - 기둥들에서 모기장을 걷어 내렸습니다
  lexicon: LSJ
  rationale: κωνώπιον은 모기장 또는 침상 휘장을 가리킬 수 있으므로, 침실 문맥에 맞게 ‘휘장’으로 넓게 번역했습니다. στύλοι는 침대의 기둥들을 가리키는 것으로 보아 ‘기둥들’로 옮겼습니다.
theological_decisions:
- issue: 참수 표현의 직접성
  chosen_reading: 본문에는 ‘그의 머리를 제거하고’라고 두고, 맥락이 참수를 분명히 합니다.
  alternative_readings:
  - ‘그의 머리를 잘라 내고’로 명시적으로 번역함
  rationale: 그리스어 동사 ἀφεῖλεν은 문자적으로 ‘제거하다’이므로, 본문은 원문 어휘를 보존하고 서술 전체가 참수의 결과를 설명하도록 두었습니다.
  doctrine_reference: 원문 우선 원칙과 서술적 명시성의 균형
- issue: 침상 덮개/모기장 용어
  chosen_reading: ‘휘장’으로 번역해 기능을 넓게 담았습니다.
  alternative_readings:
  - ‘모기장’으로 구체화함
  - ‘캐노피’로 음역함
  rationale: κωνώπιον의 의미 범위가 넓고, 본문이 묘사하는 침실 장식/덮개를 한국어 독자가 자연스럽게 이해하도록 ‘휘장’을 택했습니다.
  doctrine_reference: 의미 범위 보존과 문맥 적합성
