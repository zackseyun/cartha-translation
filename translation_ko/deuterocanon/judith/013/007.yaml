translation:
  language: ko
  text: 그녀는 침상으로 다가가 그의 머리카락을 붙잡고 말했습니다. 「이스라엘의 하나님, 오늘 이 날에 저를 강하게 하십시오」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “강하게 하십시오”이며, 그리스어 κραταιόω의 힘을 더 직접적으로 드러냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγγίσασα
  english_pob_choice: went up to
  chosen_korean: 다가가
  alternatives_korean:
  - 가까이 가
  - 침상으로 올라가
  lexicon: LSJ
  rationale: ἐγγίζω의 핵심은 ‘가까이 가다/다가가다’이므로, 문맥상 침상을 향한 이동을 자연스럽게 살리면서도 과장되지 않게 옮겼습니다.
- source_word: τῆς κλίνης
  english_pob_choice: bed
  chosen_korean: 침상
  alternatives_korean:
  - 침대
  - 상
  lexicon: LSJ
  rationale: κλίνη는 단순한 침대보다 문학적·서사적 맥락에서 ‘침상’이 더 자연스럽고, 장면의 긴장감을 잘 유지합니다.
- source_word: ἐδράξατο
  english_pob_choice: seized
  chosen_korean: 붙잡고
  alternatives_korean:
  - 움켜쥐고
  - 잡고
  lexicon: LSJ
  rationale: 중간태 δράσσομαι는 단순 접촉이 아니라 단호하게 손에 쥐는 동작이므로, ‘붙잡고’가 힘을 드러내면서도 한국어로 지나치게 거칠지 않습니다.
- source_word: Κραταίωσόν με
  english_pob_choice: Strengthen me
  chosen_korean: 저를 강하게 하십시오
  alternatives_korean:
  - 저를 강하게 해 주십시오
  - 저에게 힘을 주십시오
  lexicon: LSJ
  rationale: 동사 κραταιόω의 직접적 의미를 살려 ‘강하게 하다’로 옮겼고, 기도체의 간청을 합쇼체 명령형으로 표현했습니다.
theological_decisions:
- issue: 하나님을 부르는 직접 기도문의 호칭과 어조
  chosen_reading: 「이스라엘의 하나님」을 직접 호명하는 기도문으로 유지하고, 끝맺음은 공손한 간청형으로 옮겼습니다.
  alternative_readings:
  - 「오 이스라엘의 하나님」
  - 「이스라엘의 하나님이여」
  rationale: 본문은 짧은 직접 기도이므로, 한국어에서도 설명을 덧붙이지 않고 호소의 긴급성과 언약적 호칭을 그대로 보존하는 것이 적절합니다.
