  yaml_path: translation/deuterocanon/judith/013/004.yaml
  text: And Judith told her female slave to stand outside her sleeping chamber and watch for her going out[a], as on previous days, for she said that she would go out for her prayer[b]; and she spoke to Bagoas according to these words.
  footnotes:
  - marker: a
    text: Or 'bedchamber' for 'sleeping chamber.'
    reason: lexical_alternative
  - marker: b
    text: The phrase 'as on the previous days' reflects Judith's established custom of going out to pray; more literally, 'as day by day.'
    reason: lexical_alternative
translation:
  language: ko
  text: 유딧은 자기 여종에게 자기 침실 밖에 서서 평소처럼[a] 자기가 나가는 것을 지켜보라고[b] 말했습니다. 그녀가 말하기를, 자기는 기도하러 나갈 것이라고 했기 때문입니다. 그리고 그녀는 이 말대로 바가오스에게 말했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘날마다’입니다. 여기서는 유딧이 이미 굳힌 반복적 습관을 드러내기 위해 자연스러운 표현으로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그녀의 나감을 지켜보다’입니다. 한국어에서는 목적어를 풀어 ‘자기가 나가는 것을 지켜보다’로 옮기는 것이 더 분명합니다.
    reason: lexical_alternative
