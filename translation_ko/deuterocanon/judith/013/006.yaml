base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/013/006.yaml
  text: And Judith stood beside his bed and said in her heart[a], “Lord, God of all power, look upon the works of my hands at this hour[b], for the exaltation of Jerusalem.”
  footnotes:
  - marker: a
    text: Or “said to herself.” The Greek literally says “said in her heart,” a biblical idiom for inward speech or prayer.
    reason: lexical_alternative
  - marker: b
    text: Or “for Jerusalem’s elevation” or “for the lifting up of Jerusalem.” The Greek expression speaks of Jerusalem being raised up or exalted.
    reason: alternative_reading
translation:
  language: ko
  text: 유디트는 그의 침상 곁에 서서 마음속으로 말했습니다[a]. “주님, 모든 능력을 지니신 하나님이시여, 이때 제 손의 일들을 굽어보소서. 예루살렘이 높아지도록 하소서[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “자기 자신에게 말했습니다.” 그리스어는 문자적으로 “자기 마음속에 말했습니다”라고 하며, 내적 발화나 기도를 뜻하는 성경적 관용구입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “예루살렘의 높아짐을 위하여” 또는 “예루살렘의 들어 올려짐을 위하여.” 그리스어 표현은 예루살렘이 높아지거나 높임을 받는 것을 가리킵니다.
    reason: alternative_reading
lexical_decisions:
- source_word: στᾶσα παρὰ τὴν κλίνην αὐτοῦ
  english_pob_choice: stood beside his bed
  chosen_korean: 그의 침상 곁에 서서
  alternatives_korean:
  - 그의 침대 곁에 서서
  - 그의 침상 옆에 서서
  lexicon: LSJ
  rationale: παρά + 대격은 ‘곁/옆’의 위치를 나타내며, κλίνη는 문맥상 침상/침대로 옮길 수 있습니다. ‘침상’은 다소 문어적이지만 본문의 정황과 맞고, 뒤의 내적 기도 장면과도 잘 어울립니다.
- source_word: εἶπεν ἐν τῇ καρδίᾳ ἑαυτῆς
  english_pob_choice: said in her heart
  chosen_korean: 마음속으로 말했습니다
  alternatives_korean:
  - 마음속에 말했습니다
  - 자기 자신에게 말했습니다
  lexicon: LSJ
  rationale: 직역하면 ‘자기 마음 안에서 말하다’이지만, 한국어에서는 ‘마음속으로 말하다’가 같은 내적 발화 관용구를 가장 자연스럽게 드러냅니다. ‘자기 자신에게’는 의미는 맞지만 성경적 심상인 ‘마음’의 표현을 약화합니다.
- source_word: ὕψωμα Ἰερουσαλήμ
  english_pob_choice: the exaltation of Jerusalem
  chosen_korean: 예루살렘의 높아짐
  alternatives_korean:
  - 예루살렘의 높임
  - 예루살렘의 영화
  lexicon: LSJ
  rationale: ὕψωμα는 문자적으로 ‘높임/높아짐/고양’의 뜻을 가지며, 여기서는 예루살렘의 신분과 명예가 ‘들어 올려짐’이라는 이미지를 보존하는 것이 중요합니다. 전통적 해석을 덧씌운 ‘영화’보다 원문의 상승 이미지를 더 직접적으로 반영합니다.
theological_decisions:
- issue: 하나님께 드리는 직접 호칭의 한국어 높임법
  chosen_reading: “주님, 모든 능력의 하나님이시여 … 하소서”
  alternative_readings:
  - “주여, … 하소서”
  - “주님, … 하십시오”
  rationale: 본문은 유디트의 기도문이므로 하나님께 대한 직접 호칭에서는 현대 합쇼체와 공경형 종결을 유지하는 것이 적절합니다. ‘하소서’는 한국어 기도체로 자연스럽고, 본문의 간청 성격을 보존합니다.
  doctrine_reference: DOCTRINE.md §§1, 6
- issue: εἰς ὕψωμα Ἰερουσαλήμ의 의미
  chosen_reading: 예루살렘의 높아짐을 위하게 하소서
  alternative_readings:
  - 예루살렘의 높임을 위하게 하소서
  - 예루살렘이 높여지게 하소서
  rationale: 원문은 예루살렘의 ‘exaltation/elevation’을 말하며, 여기에는 회복과 영예의 상승이 함께 담겨 있습니다. 따라서 결과를 직접 규정하는 해석어를 덧붙이기보다, ‘높아짐’으로 은유를 살려 두는 편이 원문에 가깝습니다.
  doctrine_reference: DOCTRINE.md §§1, 3, 5
