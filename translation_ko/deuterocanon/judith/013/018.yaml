lexical_decisions:
- source_word: καὶ εἶπεν αὐτῇ Ὀζίας
  english_pob_choice: And Uzziah said to her
  chosen_korean: 오지아스가 그녀에게 말했습니다
  alternatives_korean:
  - 우지야가 그녀에게 말했습니다
  - 오자스가 그녀에게 말했습니다
  lexicon: 고유명사 표기 관행
  rationale: Ὀζίας는 그리스어형 이름을 반영해 ‘오지아스’로 옮기되, 문맥상 자연스러운 서술체로 정리했습니다.
- source_word: Εὐλογητὴ σύ
  english_pob_choice: Blessed are you
  chosen_korean: 너는 복을 받은 자다
  alternatives_korean:
  - 복되다, 너는
  - 복을 받았습니다
  - 너는 복되십니다
  lexicon: LSJ / 성경 한국어 관용
  rationale: 직접적인 축복 선언의 힘을 살리되, 현대 한국어에서 자연스러운 평서형으로 옮겼습니다. 축복의 선언이지 단순 상태 묘사가 아니므로 ‘복을 받은 자다’를 택했습니다.
- source_word: τῷ θεῷ τῷ ὑψίστῳ
  english_pob_choice: by the Most High God
  chosen_korean: 지극히 높으신 하나님께서
  alternatives_korean:
  - 지극히 높으신 하나님 앞에서
  - 지극히 높으신 하나님에게서
  - 지극히 높으신 하나님으로부터
  lexicon: LSJ
  rationale: 여기서는 축복의 근거/출처를 나타내는 여격으로 보아, ‘~께서’로 자연스럽게 풀어 ‘하나님께서 복 주셨다’는 힘을 살렸습니다.
- source_word: παρὰ πάσας τὰς γυναῖκας τὰς ἐπὶ τῆς γῆς
  english_pob_choice: above all the women on the earth
  chosen_korean: 모든 여인보다
  alternatives_korean:
  - 땅 위의 모든 여인보다
  - 세상의 모든 여인보다
  - 온 땅의 모든 여인보다
  lexicon: LSJ
  rationale: παρά + 대격의 비교 의미를 직접 반영해 ‘보다’로 옮겼고, ‘ἐπὶ τῆς γῆς’는 한국어에서 중복감을 줄여 문맥상 생략했습니다.
theological_decisions:
- issue: τῷ θεῷ τῷ ὑψίστῳ의 여격 처리
  chosen_reading: 축복의 근거가 ‘지극히 높으신 하나님’에게 있음을 드러내는 선언으로 읽었습니다.
  alternative_readings:
  - ‘지극히 높으신 하나님 앞에서’라는 평가 기준으로 읽기
  - ‘지극히 높으신 하나님께’라는 간단한 여격 표지로 처리하기
  rationale: 문맥은 오히려 유딧의 복됨을 선포하는 말이므로, 한국어에서는 ‘하나님께서’의 능동적 뉘앙스로 풀어 축복의 실재를 분명히 했습니다.
  doctrine_reference: Translation philosophy §1, §3
