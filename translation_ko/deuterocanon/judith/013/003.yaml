  text: But Judith was left alone in the tent[a], and Holofernes had collapsed on his bed[b], for the wine had overwhelmed him.
  footnotes:
  - marker: a
    text: Or 'had fallen forward on his bed.' The Greek participle can be rendered more literally, but the context suggests drunken collapse.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'for the wine had been poured around him' or similar; the expression is idiomatic for being overcome by wine.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 유디트만 천막에 홀로 남아 있었고, 홀로페르네스는 자기 침상에 엎드러져 있었습니다. 이는 그가 포도주에 완전히 잠겨 있었기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘자기 침상에 앞으로 쓰러져’입니다. 문맥상 주취로 인한 붕괴 상태를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘포도주가 그에게 둘러 부어진/둘러싸인’에 가깝습니다. 관용적으로는 술에 완전히 제압된 상태를 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπελείφθη ... μόνη
  english_pob_choice: was left alone
  chosen_korean: 홀로 남아 있었습니다
  alternatives_korean:
  - 남겨져 있었습니다
  - 혼자 남아 있었습니다
  lexicon: LSJ
  rationale: ὑπελείφθη는 ‘남겨지다/남다’의 수동적 뉘앙스를 가지며, μόνη는 유디트의 단독 상태를 강조하므로 간결한 합쇼체로 ‘홀로 남아 있었습니다’가 가장 자연스럽습니다.
- source_word: σκηνῇ
  english_pob_choice: tent
  chosen_korean: 천막
  alternatives_korean:
  - 텐트
  - 장막
  lexicon: LSJ
  rationale: 군영 맥락의 σκηνή는 현대 한국어에서 ‘천막’이 가장 분명하고 자연스럽습니다. ‘장막’은 종교적·문학적 색채가 강해 여기서는 덜 적절합니다.
- source_word: προπεπτωκώς ἐπὶ τὴν κλίνην ἑαυτοῦ
  english_pob_choice: had collapsed on his bed
  chosen_korean: 자기 침상에 엎드러져 있었습니다
  alternatives_korean:
  - 자기 침상에 쓰러져 있었습니다
  - 자기 침상에 얼굴을 숙인 채 있었습니다
  lexicon: LSJ
  rationale: προπεπτωκώς는 단순히 ‘누워 있다’보다 이미 넘어져 엎드러진 상태를 나타내므로, 주취로 인한 상태를 살리면서도 자연스러운 ‘엎드러져 있었습니다’로 옮겼습니다.
- source_word: περικεχυμένος αὐτῷ ὁ οἶνος
  english_pob_choice: for the wine had overwhelmed him
  chosen_korean: 그가 포도주에 완전히 잠겨 있었기 때문입니다
  alternatives_korean:
  - 포도주가 그를 뒤덮었기 때문입니다
  - 포도주가 그를 압도했기 때문입니다
  lexicon: LSJ
  rationale: περικεχυμένος는 문자적으로는 ‘둘러 부어짐/뒤덮임’에 가까우나, 여기서는 관용적으로 술에 취해 제압된 상태를 가리키므로 ‘완전히 잠겨 있었습니다’로 그 상태를 살렸습니다.
theological_decisions:
- issue: 문장 내 결과 절의 의미와 주어 관계
  chosen_reading: ‘그가 포도주에 완전히 잠겨 있었기 때문입니다’로 옮겨, 원문의 ὁ οἶνος가 원인 주어임을 드러냈습니다.
  alternative_readings:
  - ‘포도주가 그를 뒤덮었기 때문입니다’
  - ‘그는 포도주에 취해 있었습니다’
  rationale: 그리스어는 ‘포도주’가 주어로서 그를 에워싸고 덮친 상태를 말하므로, 단순한 ‘취했다’보다 원문의 이미지와 인과를 함께 보존하는 표현이 적절합니다.
