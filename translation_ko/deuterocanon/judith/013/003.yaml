  terminology: ‘천막’, ‘유디트’, ‘홀로페르네스’, ‘침상’은 모두 문맥과 격식에 적절합니다. ‘침상 위에 쓰러져’는 κλίνη와 ἐπί의 관계를 무리 없이 반영합니다.
