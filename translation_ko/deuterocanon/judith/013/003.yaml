  source_fidelity: ‘그때’는 그리스어 본문에 없으므로 삭제하는 것이 좋습니다. προπεπτωκώς는 ‘이미 쓰러져 그 상태에 있다’를 뜻하지만, ‘엎드러져’는 얼굴을 아래로 향한 자세를 확정하여 원문보다 구체적입니다. περικεχυμένος αὐτῷ ὁ οἶνος는 포도주가 그를 압도한 상태라는 관용적 의미로 자연스럽게 옮길 수 있습니다.
