  yaml_path: translation/deuterocanon/judith/013/001.yaml
  text: When evening came[a], his slaves hurried to depart; and Bagoas shut the tent from outside and excluded those in attendance from the presence of his lord, and they went away to their beds.
  footnotes:
  - marker: a
    text: Or 'his servants.' The Greek has 'his slaves' (δοῦλοι), referring to members of his household retinue under his authority.
    reason: lexical_alternative
translation:
  language: ko
  text: 저녁이 되자 그의 노예들이 서둘러 물러나갔습니다.[a] 그리고 바고아스는 바깥에서 천막을 닫고, 자기 주인 앞에 있던 이들을 물러나게 하였으며, 그들은 각자 자기 잠자리에 갔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 종들’. 그리스어 δοῦλοι는 그의 권위 아래 있는 집안의 수행 인원을 가리키지만, 여기서는 신분상의 종속성을 살리기 위해 ‘노예들’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀψία
  english_pob_choice: When evening came
  chosen_korean: 저녁이 되자
  alternatives_korean:
  - 밤이 되자
  - 해질 무렵이 되자
  lexicon: LSJ
  rationale: ὀψία ἐγένετο의 자연스러운 시간 전환을 한국어의 서술형으로 옮겼습니다.
- source_word: οἱ δοῦλοι αὐτοῦ
  english_pob_choice: his slaves
  chosen_korean: 그의 노예들이
  alternatives_korean:
  - 그의 종들이
  - 그의 하인들이
  lexicon: BDAG
  rationale: 이 절에서 δοῦλοι는 주인의 권위 아래 있는 신분을 드러내므로, 약화된 '종/하인'보다 '노예'가 원문의 사회적 현실을 더 분명히 보존합니다.
- source_word: ἀναλύειν
  english_pob_choice: to depart
  chosen_korean: 물러나갔습니다
  alternatives_korean:
  - 떠났습니다
  - 물러났습니다
  lexicon: LSJ
  rationale: 밤을 맞아 자리를 거두고 나가는 뉘앙스를 살리면서도 한국어로는 자연스럽게 표현했습니다.
- source_word: ἀπέκλεισεν
  english_pob_choice: excluded
  chosen_korean: 내쫓았으며
  alternatives_korean:
  - 막았으며
  - 출입을 막았으며
  lexicon: LSJ
  rationale: 단순히 닫는 정도가 아니라 접근을 실제로 차단하는 동작을 드러내기 위해 강한 동사를 택했습니다.
- source_word: τοὺς παρεστῶτας
  english_pob_choice: those in attendance
  chosen_korean: 시중드는 이들
  alternatives_korean:
  - 곁에 서 있던 이들
  - 대기하던 이들
  lexicon: BDAG
  rationale: 문맥상 주인을 가까이 모시던 수행 인원이라는 뜻을 풀어 살리되, 지나치게 설명적으로 늘이지 않았습니다.
- source_word: ἐκ προσώπου τοῦ κυρίου αὐτοῦ
  english_pob_choice: from the presence of his lord
  chosen_korean: 그의 주인의 앞에서
  alternatives_korean:
  - 그의 주인의 얼굴에서
  - 그의 주인의 면전에서
  lexicon: BDAG
  rationale: ἔκ προσώπου의 관용적 의미를 한국어의 자연스러운 공간 표현으로 옮겼습니다. κύριος는 여기서 신적 칭호가 아니라 상관/주인입니다.
theological_decisions:
- issue: δοῦλοι의 번역에서 사회적 종속성을 얼마나 강하게 드러낼지
  chosen_reading: '''노예들''로 옮겨 본문의 권력 관계를 분명히 드러냈습니다.'
  alternative_readings:
  - '''종들'''
  - '''하인들'''
  rationale: 영어 POB가 'slaves'를 택한 이유와 일치하게, 본문이 말하는 가정/군사적 예속 상태를 흐리지 않는 번역이 필요합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — δοῦλος; Translation philosophy §1'
