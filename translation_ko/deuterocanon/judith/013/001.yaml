  to: 저녁이 되자 그의 노예들이 서둘러 물러나갔습니다.[a] 그리고 바고아스는 바깥에서 천막을 닫고, 자기 주인 앞에 있던 이들을 물러나게 하였으며, 그들은 각자 자기 잠자리에 갔습니다.
  rationale: ‘내쫓다’를 원문의 접근 차단 및 퇴거 문맥에 더 맞는 ‘물러나게 하다’로 조정하고, 바고아스와 그의 주인의 관계를 자연스러운 한국어 재귀 표현으로 명확히 했습니다. 나머지 시간 표현, 노예 신분의 번역, 천막을 바깥에서 닫는 동작, 그리고 각자의 잠자리로 가는 결말은 유지했습니다.
