  source_fidelity: 그리스어의 사건 순서와 핵심 의미는 대체로 충실합니다. 다만 ‘함께 달려왔습니다’는 συνέδραμον의 집결·급행의 뉘앙스를 충분히 담지만, ‘작은 자부터 큰 자까지’는 현대 한국어에서 다소 부자연스럽습니다. 또한 여성 복수 대명사 αὐτάς가 두 차례 나오므로, 주석 표지는 두 여인을 처음 가리키는 ‘그들을’에 직접 붙이는 편이 지시 대상과 주석의 연결을 더 정확히 드러냅니다.
  naturalness: ‘그들 가운데 있는 작은 자부터 큰 자까지’의 ‘있는’은 불필요하고, ‘작은 자/큰 자’는 현대 표준어 합쇼체 서사에서 다소 경직됩니다. ‘그들 가운데 가장 작은 이부터 가장 큰 이까지’가 원문의 포괄적 대구를 유지하면서 더 자연스럽습니다. ‘빛을 내게 한 뒤’보다 ‘빛을 밝히려고 불을 피운 뒤’가 목적 표현으로 자연스럽습니다.
  terminology: ‘맞아들였습니다’는 ἀπεδέξαντο의 호의적인 영접을 적절히 옮깁니다. ‘둘러섰습니다’는 περιεκύκλωσαν의 공간적 의미를 유지하면서 문맥에 없는 적대적 함의를 피합니다. 유딧의 동반자는 본문 앞 문맥상 여성 동반자이므로 주석에서 그렇게 밝히는 것이 적절합니다.
