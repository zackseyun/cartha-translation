  text: And they all ran together[a], from the least to the greatest among them, because it seemed astonishing to them that she had come; and they opened the gate and welcomed them. After lighting a fire for light, they gathered around them.
  footnotes:
  - marker: a
    text: The pronoun 'them' refers to Judith and her female companion.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 그들 가운데 있는 작은 자부터 큰 자까지 모두가 함께 달려왔습니다. 그녀가 온 것이 그들에게 놀라운 일이었기 때문입니다. 그들은 문을 열고 그들을 맞아들였습니다. 그리고 불을 피워 빛을 내게 한 뒤, 그들 주위에 둘러섰습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그들’은 유딧과 그녀의 여성 동반자를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνέδραμον
  english_pob_choice: ran together
  chosen_korean: 함께 달려왔습니다
  alternatives_korean:
  - 함께 모여왔습니다
  - 달려 모였습니다
  lexicon: LSJ
  rationale: 복합동사가 나타내는 급히 한데로 모이는 움직임을 살리기 위해, 단순한 ‘모이다’보다 ‘달려오다’를 택했습니다.
- source_word: ἀπὸ μικροῦ ἕως μεγάλου
  english_pob_choice: from the least to the greatest
  chosen_korean: 작은 자부터 큰 자까지
  alternatives_korean:
  - 가장 작은 자부터 가장 큰 자까지
  - 어린 자부터 늙은 자까지
  lexicon: LSJ
  rationale: 이 관용구의 전체성·포괄성을 한국어로 자연스럽게 옮기되, 영어 POB의 ‘least/greatest’에 맞춰 사회적 서열의 범위를 유지했습니다.
- source_word: παράδοξον ἦν αὐτοῖς τοῦ ἐλθεῖν αὐτήν
  english_pob_choice: it seemed astonishing to them that she had come
  chosen_korean: 그녀가 온 것이 그들에게 놀라운 일이었기 때문입니다
  alternatives_korean:
  - 그녀가 온 것이 그들에게 이상하게 여겨졌기 때문입니다
  - 그녀의 옴이 그들에게 놀라웠기 때문입니다
  lexicon: LSJ
  rationale: παράδοξον의 ‘예상 밖의 놀라움’을 반영해, 부정적 뉘앙스가 강한 ‘이상하다’보다 ‘놀라운 일’로 옮겼습니다.
- source_word: ἀπεδέξαντο αὐτάς
  english_pob_choice: welcomed them
  chosen_korean: 그들을 맞아들였습니다
  alternatives_korean:
  - 그들을 환영했습니다
  - 그들을 받아들였습니다
  lexicon: LSJ
  rationale: 문을 열고 받아들이는 장면이므로 단순한 ‘받다’보다 환대의 의미가 드러나는 ‘맞아들이다’가 더 정확합니다.
- source_word: ἅψαντες πῦρ εἰς φάσιν
  english_pob_choice: After lighting a fire for light
  chosen_korean: 불을 피워 빛을 내게 한 뒤
  alternatives_korean:
  - 빛을 위해 불을 지핀 뒤
  - 조명을 위해 불을 밝힌 뒤
  lexicon: LSJ
  rationale: εἰς φάσιν의 목적성을 살리되, 현대 한국어에서 자연스러운 표현으로 ‘빛을 내게 하다’를 선택했습니다.
- source_word: περιεκύκλωσαν αὐτάς
  english_pob_choice: they gathered around them
  chosen_korean: 그들 주위에 둘러섰습니다
  alternatives_korean:
  - 그들 주위를 에워쌌습니다
  - 그들 둘레에 모였습니다
  lexicon: LSJ
  rationale: 직역하면 ‘둘러싸다’이지만, 환대의 맥락에서 적대적 느낌을 줄이기 위해 중립적인 ‘둘러서다’로 옮겼습니다.
theological_decisions:
- issue: 여성 복수 대명사 αὐτάς의 지시 대상
  chosen_reading: ‘그들’은 유딧과 그녀의 여성 동반자를 가리킵니다.
  alternative_readings:
  - ‘그들’의 지시를 불특정 다수로 둘 수 있습니다.
  rationale: 영어 POB의 주석과 문맥상 여성 복수형은 두 여인을 가리키므로, 번역문은 그대로 두되 주해 차원의 지시 대상을 분명히 했습니다.
  doctrine_reference: 본문 문맥과 대명사 지시 대상에 대한 주해적 판단
