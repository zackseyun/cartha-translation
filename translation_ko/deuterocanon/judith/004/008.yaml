  text: 그들에게 산길들을 점거하라고 말했습니다[a]. 그 길들을 통해 유다로 들어가는 길이 있었고, 올라오는 자들을 막아 내기 쉬웠습니다[b]. 그 길목이 너무 좁아서 모든 사람이 두 사람씩밖에 갈 수 없었기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 문자적으로 '산지의 오름길들'을 뜻하며, 여기서는 산악 지형의 고개나 통로를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 마지막 그리스어 구문은 압축되어 있어 난해하지만, 문맥상 통로가 매우 좁아 사람들이 두 사람씩 나란히 진행할 수밖에 없다는 뜻으로 옮겼습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: διακατασχεῖν
