  text: telling them to seize the mountain passes[a], because through them was the entrance into Judea; and it was easy to hold them back as they came up[b], since the approach was narrow enough for all the men to go two abreast.
  footnotes:
  - marker: a
    text: Greek literally, 'the ascents of the mountainous region,' referring to the uphill routes or passes through the hill country.
    reason: lexical_alternative
  - marker: b
    text: The final Greek phrase is terse and difficult; the translation takes it to mean that the route was narrow enough for men to advance only two abreast.
    reason: alternative_reading
translation:
  language: ko
  text: 그들에게 산지의 길목들을 점거하라고 말했습니다[a]. 그곳들이 유다로 들어가는 통로였기 때문입니다. 또한 그들이 올라올 때 그들을 저지하기가 쉬웠습니다. 접근로가 매우 좁아서 사람들이 모두 두 명씩만 나란히 갈 수 있었기 때문입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 문자적으로 ‘산지의 오름길들’을 뜻하며, 여기서는 산악 지형을 지나는 고개나 전략적 통로를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 마지막 그리스어 구문은 압축되어 있어 해석이 다소 어렵습니다. 여기서는 문맥에 따라 접근로가 매우 좁아 사람들이 두 명씩만 나란히 진행할 수 있었다는 뜻으로 옮겼습니다.
    reason: alternative_reading
lexical_decisions:
