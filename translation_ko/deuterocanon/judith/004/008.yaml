- source_word: ἐπʼ ἄνδρας τοὺς πάντας δύο
  english_pob_choice: for all the men to go two abreast
  chosen_korean: 모든 사람이 두 사람씩밖에 갈 수 없었기 때문입니다
  alternatives_korean:
