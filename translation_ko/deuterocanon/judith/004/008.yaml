  - 사람들이 두 사람씩밖에 갈 수 없었기 때문입니다
  - 남자들 모두가 두 사람씩밖에 갈 수 없었기 때문입니다
  lexicon: LSJ
  rationale: 압축된 그리스어는 통로의 협소함을 가리키며, 영어 POB의 두 사람 나란히(두 줄) 뜻을 따라 한국어에서는 '두 사람씩밖에 갈 수 없었다'로 자연스럽게 풀었습니다.
