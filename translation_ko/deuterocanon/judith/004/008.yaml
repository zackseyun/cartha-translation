  - severity: low
    issue: 마지막 협로 묘사에서 병렬 이동의 뜻이 충분히 명시되지 않음
    rationale: 난해한 ἐπʼ ἄνδρας τοὺς πάντας δύο는 문맥상 두 사람만 나란히 이동할 수 있는 폭을 가리키는 것으로 이해됩니다. ‘두 명씩만 나란히’가 이 제한을 더 선명하게 전달하며, 각주로 본문의 압축성과 해석적 성격을 밝혀야 합니다.
