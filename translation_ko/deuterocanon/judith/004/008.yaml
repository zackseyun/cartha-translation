  rationale: 원문의 논리 관계를 한국어에서 자연스럽게 드러내도록 ‘유다로 들어가는 통로’로 다듬고, 복수의 산지 통로를 가리키는 표현을 ‘산지의 길목들’로 조정했습니다. 마지막 난해한 구문은 특정 교리적 해석을 더하지 않고, 영어 POB 감사 기록 및 문맥에 따른 ‘두 명씩 나란히’라는 제한적 이동의 이해를 유지했습니다. 각주 표지는 해당 어휘 선택과 난해한 최종 구문에 각각 유지했습니다.
