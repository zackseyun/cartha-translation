- source_word: διακωλῦσαι αὐτοὺς προσβαίνοντας
  english_pob_choice: to hold them back as they came up
  chosen_korean: 올라오는 자들을 막아 내기 쉬웠습니다
  alternatives_korean:
  - 올라오는 그들을 저지하기 쉬웠습니다
  - 올라오며 접근하는 자들을 막기 쉬웠습니다
