  to: 그리고 유다에 거주하던 이스라엘 자손들[a]은 아시리아 왕 느부갓네살의 최고 사령관 홀로페르네스가 민족들에게 행한 모든 일과, 그가 그들의 모든 성소[b]를 약탈하고 그것들을 파멸에 넘겨준 일을 들었습니다.
