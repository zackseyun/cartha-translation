base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/004/001.yaml
  text: And the sons of Israel who lived in Judea heard all that Holofernes[a], the commander-in-chief of King Nebuchadnezzar of the Assyrians, had done to the nations[b], and how he had plundered all their sanctuaries and given them over to destruction.
  footnotes:
  - marker: a
    text: Or 'the Israelites' or 'the children of Israel.' The Greek reads literally 'the sons of Israel.'
    reason: lexical_alternative
  - marker: b
    text: Or 'their temples' or 'their holy things'; the Greek can refer broadly to sacred places or sacred things.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 유다에 거주하던 이스라엘 자손들은, 아시리아 왕 느부갓네살의 최고 사령관 홀로페르네스가 이방 민족들에게 행한 모든 일과, 그가 그들의 모든 성소를 약탈하고 그것들을 파멸에 넘겨준 일을 들었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이스라엘 사람들’, ‘이스라엘의 자손들’. 그리스어는 문자적으로 ‘이스라엘의 아들들’이라고 되어 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들의 성전들’, ‘그들의 거룩한 것들’. 그리스어는 성소나 성스러운 물건들을 넓게 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ υἱοὶ Ἰσραήλ
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손들
  alternatives_korean:
  - 이스라엘의 아들들
  - 이스라엘 사람들
  lexicon: LSJ
  rationale: 그리스어의 직역 가능성을 유지하되, 한국어에서는 관용적이고 성경적인 집단명인 ‘이스라엘 자손들’이 가장 자연스럽습니다. 남성형 복수의 표지와 언약 공동체 지시도 무리 없이 보존됩니다.
- source_word: οἱ κατοικοῦντες ἐν τῇ Ἰουδαίᾳ
  english_pob_choice: who lived in Judea
  chosen_korean: 유다에 거주하던
  alternatives_korean:
  - 유다에 살던
  - 유다에 사는
  lexicon: LSJ
  rationale: 지속적 거주를 나타내는 분사이므로 ‘거주하던’이 무난합니다. 현대 한국어에서 자연스럽고 서술의 흐름도 매끈합니다.
- source_word: ὁ ἀρχιστράτηγος
  english_pob_choice: the commander-in-chief
  chosen_korean: 최고 사령관
  alternatives_korean:
  - 총사령관
  - 지휘관
  lexicon: LSJ
  rationale: ἀρχιστράτηγος는 단순한 장군보다 상위의 군사 지휘권을 가리키므로, 한국어에서는 ‘최고 사령관’이 위계와 긴박감을 잘 드러냅니다.
- source_word: τὰ ἱερὰ αὐτῶν
  english_pob_choice: their sanctuaries
  chosen_korean: 그들의 모든 성소
  alternatives_korean:
  - 그들의 성역
  - 그들의 성전들
  - 그들의 거룩한 것들
  lexicon: LSJ
  rationale: 이 표현은 성물만이 아니라 신성한 장소나 예배 공간까지 포함할 수 있어, 문맥상 ‘성소’가 가장 포괄적입니다. 영어 POB의 ‘sanctuaries’도 이 폭을 유지합니다.
- source_word: ἔδωκεν αὐτὰ εἰς ἀφανισμόν
  english_pob_choice: given them over to destruction
  chosen_korean: 파멸에 넘겨준
  alternatives_korean:
  - 멸망에 내준
  - 소멸하도록 넘겨준
  - 멸절에 넘겨준
  lexicon: LSJ
  rationale: ‘주다’의 동작성과 ἀφανισμός의 강한 파괴성을 함께 살리기 위해 ‘파멸에 넘겨준’으로 옮겼습니다. 기술적 용어처럼 굳히지 않고 문맥의 폭력을 드러냅니다.
theological_decisions:
- issue: ἔθνεσιν의 범주
  chosen_reading: 이방 민족들에게
  alternative_readings:
  - 민족들에게
  - 나라들에게
  rationale: 여기서는 이스라엘 밖의 정복 대상 집단을 가리키므로, 한국어에서 의미를 즉시 드러내는 ‘이방 민족들’이 적절합니다. 신학적 ‘이방인’ 용례로 과도하게 축소하지 않으면서도 문맥을 분명히 합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 6
