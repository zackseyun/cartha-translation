  text: 그 당시 예루살렘에 있던 대제사장[a] 요아킴은 베툴리아와 베토메스타임에 사는 사람들에게—이곳은 에스드렐론 맞은편, 도타임 근처의 평야를 마주하고 있었습니다—글을 썼습니다.
  philosophy: optimal-equivalence
  footnotes:
