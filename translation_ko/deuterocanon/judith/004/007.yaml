  text: And Joakim the high priest[a], who was in Jerusalem in those days, wrote to those living in Bethulia and Betomesthaim, which is opposite Esdraelon, facing the plain near Dothaim,
  footnotes:
  - marker: a
    text: Or, more idiomatically, 'the high priest.' The Greek reads literally 'the priest, the great.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 요아킴, 곧 예루살렘에 그때 있던 대제사장은 베툴리아와 베토메스타임에 사는 사람들에게—그곳은 에스드레론 맞은편, 도타임 근처 들판을 마주 보고 있는 곳입니다—글을 썼습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 관용적으로 ‘대제사장’. 그리스어는 문자적으로 ‘제사장, 곧 큰 자’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔγραψεν
  english_pob_choice: wrote
  chosen_korean: 글을 썼습니다
  alternatives_korean:
  - 썼습니다
  - 편지를 보냈습니다
  lexicon: BDAG
  rationale: γράψεν의 기본 의미는 ‘쓰다’이므로, 본문에 없는 ‘편지’는 덧붙이지 않고 자연스러운 한국어로 옮겼습니다.
- source_word: ἱερεὺς ὁ μέγας
  english_pob_choice: the high priest
  chosen_korean: 대제사장
  alternatives_korean:
  - 큰 제사장
  - 높은 제사장
  lexicon: LSJ
  rationale: 영어 POB가 관용적으로 ‘the high priest’로 정리한 점을 반영해, 한국어에서도 기능적으로 대응하는 ‘대제사장’을 사용했습니다.
- source_word: τοῖς κατοικοῦσι
  english_pob_choice: to those living
  chosen_korean: 사는 사람들에게
  alternatives_korean:
  - 거주하는 이들에게
  - 사는 이들에게
  lexicon: BDAG
  rationale: 분사 κατοικοῦσι는 거주자를 가리키므로, 현대 한국어에서는 간결하게 ‘사는 사람들’로 옮겨 주민 대상이라는 뜻을 살렸습니다.
- source_word: ἀπέναντι ... κατὰ πρόσωπον
  english_pob_choice: opposite ... facing
  chosen_korean: 맞은편, ...을 마주 보고 있는
  alternatives_korean:
  - 대하여 ... 마주한
  - 맞은편에 ... 마주한
  lexicon: LSJ
  rationale: 두 공간 표현이 모두 지리적 방향을 강조하므로, ‘맞은편’과 ‘마주 보고 있는’으로 중첩된 공간 관계를 살렸습니다.
theological_decisions:
- issue: ἱερεὺς ὁ μέγας의 직책 표현
  chosen_reading: ‘대제사장’으로 기능적 의미를 살리되, 본문에는 ‘글을 썼습니다’만 두고 직함을 자연스럽게 배치했습니다.
  alternative_readings:
  - ‘큰 제사장’처럼 문자적 표현을 살리는 방식
  - 영어 POB의 각주처럼 ‘고위 제사장’ 설명을 붙이는 방식
  rationale: 문자적으로는 ‘제사장, 곧 큰 자’에 가깝지만, 한국어 독자는 이 관용구를 직책명으로 이해하는 것이 가장 분명하므로 기능적 대응을 택했습니다. 다만 본문 의미를 훼손하지 않도록 평이한 문장 안에 배치했습니다.
  doctrine_reference: 'DOCTRINE.md: Translation philosophy #1 and #5'
