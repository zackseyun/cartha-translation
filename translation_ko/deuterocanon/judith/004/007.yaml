- from: 그리고 요아킴, 곧 예루살렘에 그때 있던 대제사장은 베툴리아와 베토메스타임에 사는 사람들에게—그곳은 에스드레론 맞은편, 도타임 근처 들판을 마주 보고 있는 곳입니다—글을 썼습니다.[a]
  to: 그 당시 예루살렘에 있던 대제사장[a] 요아킴은 베툴리아와 베토메스타임에 사는 사람들에게—이곳은 에스드렐론 맞은편, 도타임 근처의 평야를 마주하고 있었습니다—글을 썼습니다.
  rationale: 직책명 ‘대제사장’은 유지하되, 중복되고 모순적인 각주를 원문의 어휘 형태를 설명하는 각주로 교체했습니다. 지리적 삽입절은 원문의 단수 관계절이 어느 지명을 엄밀히 가리키는지 한국어 번역이 불필요하게 확정하지 않도록 ‘이곳’으로 처리하고, 서사 시제와 지형어를 바로잡았습니다.
