review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실합니다. 그러나 εἰς διαρπαγὴν의 대상 관계는 ‘노략질에 넘기다’보다 ‘약탈당하도록 내주다’가 더 명확하며, ὀνειδισμός은 단순한 ‘수치’보다 외부로부터의 ‘치욕/모욕’의 뜻을 포함합니다. 마지막 ἐπίχαρμα τοῖς ἔθνεσιν은 앞선 재앙 전체가 민족들의 적대적 기쁨의 대상이 되는 것을 뜻하므로 이를 자연스럽게 연결했습니다.
  naturalness: 현 번역의 ‘곧 … 해 달라는 것이었습니다’와 반복되는 ‘…에 넘기지 않으시고’는 다소 설명적이고 부자연스럽습니다. 기도 내용으로 직접 이어 주고, ‘내주다’와 ‘노획물로 넘기다’를 구별하면 현대 표준 한국어 합쇼체에서 더 자연스럽습니다.
  terminology: ‘제단’, ‘굵은 베’, ‘한마음으로 간절히’, ‘거룩한 것들’은 적절합니다. γυναῖκες는 집단 전체를 가리키므로 ‘여인들’을 유지할 수 있고, προνομή는 ‘노획물’로 옮기되 전쟁 포획의 뜻을 각주로 밝혀 두는 것이 좋습니다. κληρονομία는 ‘그들이 상속받은 성읍들’로 자연스럽게 옮겨 소유·상속의 의미를 보존했습니다.
  issues:
