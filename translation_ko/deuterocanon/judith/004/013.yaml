    issue: ὀνειδισμός을 ‘수치’로만 옮김
    rationale: ὀνειδισμός은 치욕, 모욕, 비방의 뜻을 지니므로, βεβήλωσις와 병렬되는 공적 훼손의 의미를 ‘치욕’으로 더 잘 드러낼 수 있습니다.
