base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/004/013.yaml
  text: And they covered the altar with sackcloth, and they cried out to the God of Israel together with fervor, that he might not give their little children over to plunder, and their women to spoil, and the cities of their inheritance to destruction, and the holy things to defilement and reproach, as something the nations would gloat over.
  footnotes:
  - marker: a
    text: Or 'their women as booty.' The Greek phrase 'their women to spoil' uses war-booty language.
    reason: lexical_alternative
  - marker: b
    text: Or 'a cause of rejoicing to the nations'; the sense is hostile triumph or gloating by the nations.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 제단을 굵은 베로 덮고, 이스라엘의 하나님께 한마음으로 간절히 부르짖었습니다. 그분께서 그들의 어린 자녀들을 약탈당하도록 내주지 않으시고, 그들의 여인들을 노획물로[a] 넘기지 않으시며, 그들이 상속받은 성읍들을 멸망에 내주지 않으시고, 그들의 거룩한 것들을 더럽힘과 치욕에 내주지 않으셔서, 그런 일이 민족들이 기뻐할 대상이 되지 않게 해 달라는 것이었습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘노획물’은 그리스어 προνομή의 전쟁 포획·약탈 어휘를 드러낸 표현입니다. ‘전리품’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘민족들이 기뻐할 대상’은 그리스어 ἐπίχαρμα τοῖς ἔθνεσιν을 옮긴 것입니다. 단순한 기쁨이 아니라 적대자들의 의기양양한 기쁨 또는 조소의 뉘앙스를 담습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ θυσιαστήριον
  english_pob_choice: the altar
  chosen_korean: 제단
  alternatives_korean:
  - 희생제단
  - 제단(제사의 자리)
  lexicon: LSJ
  rationale: θυσιαστήριον은 기본적으로 제단을 뜻하므로 가장 직접적인 한국어인 ‘제단’으로 옮겼습니다. 문맥상 성전 제의와 연결되지만, 원문이 요구하는 범위를 넘겨 ‘희생제단’으로 과잉특정하지 않았습니다.
- source_word: σάκκῳ περιέβαλλον
  english_pob_choice: covered ... with sackcloth
  chosen_korean: 굵은 베로 덮고
  alternatives_korean:
  - 베옷으로 두르고
  - 삼베로 덮고
  lexicon: LSJ
  rationale: περιβάλλω는 두르다/덮다의 의미가 있어 ‘덮고’가 자연스럽습니다. σάκκος는 애도와 회개의 자루천이므로 ‘굵은 베’로 옮겨 문맥의 통회성을 살렸습니다.
- source_word: ἐκτενῶς
  english_pob_choice: together with fervor
  chosen_korean: 간절히
  alternatives_korean:
  - 열심히
  - 절박하게
  lexicon: LSJ
  rationale: ὁμοθυμαδόν이 ‘한마음으로’의 공동성을, ἐκτενῶς가 간절하고 긴박한 강도를 더하므로 한국어에서는 ‘한마음으로 간절히’로 압축해 두 요소를 함께 드러냈습니다.
- source_word: εἰς διαρπαγὴν / εἰς προνομὴν
  english_pob_choice: over to plunder / to spoil
  chosen_korean: 노략질에 넘기지 않으시고 / 노획물에 넘기지 않으시며
  alternatives_korean:
  - 약탈당하게 하지 않으시고
  - 전리품으로 넘기지 않으시며
  lexicon: LSJ
  rationale: διαρπαγή와 προνομή는 전쟁 포획과 약탈의 어휘이므로, 각각 ‘노략질’과 ‘노획물’로 구분해 부모어휘의 폭력을 분명히 드러냈습니다. 동사구 ‘넘기다’는 하나님이 내주시는 수동적 위험을 잘 살립니다.
- source_word: τὰ ἅγια
  english_pob_choice: the holy things
  chosen_korean: 거룩한 것들
  alternatives_korean:
  - 성물
  - 거룩한 예물들
  lexicon: LSJ
  rationale: 복수 중성인 τὰ ἅγια는 단일한 건물보다 거룩한 대상들을 넓게 가리킬 수 있으므로 ‘거룩한 것들’로 옮겼습니다. ‘성물’도 가능하지만, 원문의 범위를 더 넓게 보존하는 표현을 택했습니다.
- source_word: ἐπίχαρμα τοῖς ἔθνεσιν
  english_pob_choice: a cause of rejoicing for the nations
  chosen_korean: 민족들의 기쁨거리가 되지 않게
  alternatives_korean:
  - 민족들이 기뻐할 일이 되지 않게
  - 민족들의 조롱거리가 되지 않게
  lexicon: LSJ
  rationale: ἐπίχαρμα는 단순한 기쁨보다 상대를 두고 생기는 승리감·희희낙락의 뉘앙스를 지니므로, 문맥에 맞게 ‘기쁨거리’로 처리하되 부정형으로 이어져 수치스러운 대상화가 되지 않도록 했습니다.
theological_decisions:
- issue: κληρονομία의 공동체-언약적 뉘앙스
  chosen_reading: 상속
  alternative_readings:
  - 기업
  - 유산
  rationale: κληρονομία는 단순 재산보다 공동체적·언약적 상속의 뉘앙스를 지니므로, 현대 한국어에서 가장 중립적이면서도 해당 의미장을 유지하는 ‘상속’을 택했습니다. 다만 ‘상속의 성읍들’은 다소 직역적이지만 원문의 구조를 보존합니다.
  doctrine_reference: Translation philosophy §1, §5
- issue: 민족들이 무엇을 하게 되는가에 대한 종결
  chosen_reading: 기쁨거리가 되지 않게
  alternative_readings:
  - 조롱거리가 되지 않게
  - 기뻐할 대상이 되지 않게
  rationale: 원문은 ἐπίχαρμα로 ‘열국의 적대적 기쁨’과 수치를 함께 내포하므로, 단순한 ‘조롱’보다 넓은 수치-승리의 감정을 담는 표현을 선택했습니다. 이로써 공적 수치가 되는 간구의 긴장이 유지됩니다.
  doctrine_reference: Translation philosophy §3
