lexical_decisions:
- source_word: καὶ προκατελάβοντο
  english_pob_choice: occupied
  chosen_korean: 미리 점거했습니다
  alternatives_korean:
  - 점령했습니다
  - 사전에 점거했습니다
  - 먼저 차지했습니다
  lexicon: LSJ
  rationale: προκατελάβοντο는 단순한 ‘차지하다’보다 앞서 점유해 전략적으로 확보한다는 뜻이 강하므로, 군사적 문맥을 살려 ‘미리 점거했습니다’로 옮겼습니다.
- source_word: πάσας
  english_pob_choice: all
  chosen_korean: 모든
  alternatives_korean:
  - 전부의
  - 각각의
  lexicon: LSJ
  rationale: 복수 목적어를 수식하는 포괄 표현으로 ‘모든’이 자연스럽고, 원문의 전면성을 그대로 드러냅니다.
- source_word: κορυφὰς
  english_pob_choice: summits
  chosen_korean: 봉우리들
  alternatives_korean:
  - 정상들
  - 꼭대기들
  lexicon: LSJ
  rationale: 산의 ‘top/peak’에 해당하는 κορυφή를 한국어에서는 ‘봉우리’가 가장 자연스럽게 대응하며, 복수형도 살릴 수 있습니다.
- source_word: ὑψηλῶν
  english_pob_choice: high
  chosen_korean: 높은
  alternatives_korean:
  - 높은 데의
  - 고지의
  lexicon: LSJ
  rationale: ὑψηλῶν은 산의 높이를 직접 수식하므로, 장식 없이 직설적인 ‘높은’으로 옮겼습니다.
theological_decisions:
- issue: 군사 동작의 전진성 표현
  chosen_reading: ‘미리 점거했습니다’로 옮겨, 단순한 점유가 아니라 방어적 선점의 의미를 드러냈습니다.
  alternative_readings:
  - 점령했습니다
  - 차지했습니다
  rationale: 문맥상 단순 소유가 아니라 높은 지점을 선제적으로 확보하는 군사적 행동이 핵심이므로, 원문의 동작상을 약화시키지 않는 표현을 택했습니다.
  doctrine_reference: 본문 의미 보존과 역사서적 서술의 서사적 정확성
- issue: 명시적 주어 보완
  chosen_reading: 한국어 문장에서는 앞선 문맥의 주어를 이어받아 ‘그들은’으로 자연스럽게 보완했습니다.
  alternative_readings:
  - 주어 생략
  rationale: 원문 접속사와 동사의 복수 어미가 이미 복수 주어를 전제하므로, 한국어 가독성을 위해 최소한의 주어를 밝혔습니다.
  doctrine_reference: 문맥적 주어 회복
