  text: And they fortified the villages among them[a], and they stored up food supplies in preparation for war, because their fields had been newly harvested.
  footnotes:
  - marker: a
    text: Or 'the villages in their midst.' The phrase 'among them' reflects the Greek expression without deciding a more specific geographical nuance.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 자기들 가운데 있는 마을들을 요새화하고, 전쟁에 대비하여 식량을 비축하였으니, 그들의 밭이 막 추수되었기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들 한가운데 있는 마을들’이라는 뜻일 수 있습니다. 여기서는 그리스어 표현의 공간적 뉘앙스를 특정하지 않고 ‘자기들 가운데 있는’으로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐτείχισαντο
  english_pob_choice: they fortified
  chosen_korean: 요새화하고
  alternatives_korean:
  - 성을 쌓고
  - 벽으로 둘러싸고
  - 방어시설을 갖추고
  lexicon: LSJ
  rationale: 중간태의 τειχίζω는 마을을 방어 가능하게 만드는 의미이므로, 구체적 공법을 단정하지 않는 ‘요새화하다’가 가장 무난합니다.
- source_word: τὰς ἐν αὐτοῖς κώμας
  english_pob_choice: the villages among them
  chosen_korean: 자기들 가운데 있는 마을들
  alternatives_korean:
  - 그들 가운데의 마을들
  - 그들 한가운데 있는 마을들
  - 그들 안에 있는 마을들
  lexicon: LSJ
  rationale: κῶμαι는 ‘마을들’이고, ἐν αὐτοῖς는 지리적 뉘앙스를 특정하지 않으므로 ‘가운데 있는’으로 관계성을 살렸습니다.
- source_word: παρέθεντο εἰς ἐπισιτισμὸν
  english_pob_choice: they laid in provisions / food supplies
  chosen_korean: 식량을 비축하였으니
  alternatives_korean:
  - 식량을 마련하였으니
  - 보급품을 쌓아 두었으니
  - 식량을 저장하였으니
  lexicon: LSJ
  rationale: ἐπισιτισμός는 전쟁 대비용 식량 공급/비축을 뜻하므로, 현대 한국어에서 자연스럽고 목적을 드러내는 ‘식량을 비축하다’로 옮겼습니다.
- source_word: προσφάτως ἦν τὰ πεδία αὐτῶν τεθερισμένα
  english_pob_choice: their fields had been newly harvested
  chosen_korean: 그들의 밭이 막 추수되었기 때문입니다
  alternatives_korean:
  - 그들의 밭이 최근에 수확되었기 때문입니다
  - 그들의 밭이 갓 거두어졌기 때문입니다
  - 그들의 밭이 새로 추수되었기 때문입니다
  lexicon: LSJ
  rationale: προσφάτως와 완전수동분사 τεθερισμένα의 결합을 살려, 최근 완료된 상태를 한국어의 ‘막 추수되었다’로 간결하게 표현했습니다.
