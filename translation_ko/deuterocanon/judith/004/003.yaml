  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 βεβήλωσις는 단순한 물리적 ‘더러움’보다 성전의 ‘더럽혀짐/모독됨’을 뜻하며, ἡγιασμένα는 제의 문맥에서 ‘거룩하게 구별되다’가 더 정확합니다. 또한 각주 표지가 해당 낱말에 붙어야 합니다.
  naturalness: ‘그릇들’과 ‘집’은 문맥상 다소 평범하거나 모호하게 들릴 수 있습니다. ‘기물’과 ‘그 집’을 사용하고 성전 지시를 각주로 밝히면 원문의 표현을 보존하면서 한국어 문장이 더 자연스럽습니다.
  terminology: ‘포로 생활’, ‘올라오다’, ‘유다의 모든 백성’, ‘제단’은 적절합니다. 성전 물품에는 ‘기물’, βεβήλωσις/ἁγιάζω의 대조에는 ‘더럽혀진 상태’와 ‘거룩하게 구별되다’를 권합니다.
