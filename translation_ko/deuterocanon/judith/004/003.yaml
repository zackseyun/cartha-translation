base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/004/003.yaml
  text: for they had only recently come up from the captivity[a], and all the people of Judea had only recently been gathered together[c][b], and the vessels and the altar and the house had been consecrated from the defilement.
  footnotes:
  - marker: a
    text: Or 'from exile' for 'from the captivity.'
    reason: lexical_alternative
  - marker: b
    text: Or 'had been consecrated after the desecration'; the Greek contrasts prior profanation with subsequent restoration to holiness.
    reason: lexical_alternative
  - marker: c
    text: '''The house'' refers to the temple.'
    reason: cultural_note
translation:
  language: ko
  text: 그들은 포로 생활에서[a] 이제 막 올라왔고, 유다의 모든 백성도 이제 막 함께 모였으며[c][b], 그릇들과 제단과 집은 더러움에서 거룩하게 되었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘포로에서’라고 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘더러움 뒤에 거룩하게 되었습니다’; 그리스어는 이전의 모독과 그 후의 회복을 대조합니다.
    reason: lexical_alternative
  - marker: c
    text: ‘집’은 성전을 가리키는 표현입니다.
    reason: cultural_note
lexical_decisions:
- source_word: προσφάτως / νεωστί
  english_pob_choice: only recently / had only recently
  chosen_korean: 이제 막
  alternatives_korean:
  - 최근에
  - 얼마 지나지 않아
  lexicon: LSJ
  rationale: 두 개의 시간 부사가 겹쳐 recency를 강하게 강조하므로, 한국어에서는 중복을 자연스럽게 살리면서도 간결한 ‘이제 막’으로 옮겼습니다.
- source_word: ἀναβεβηκότες ἐκ τῆς αἰχμαλωσίας
  english_pob_choice: had only recently come up from the captivity
  chosen_korean: 포로 생활에서[a] 이제 막 올라왔고
  alternatives_korean:
  - 포로에서 돌아왔고
  - 유배에서 올라왔고
  lexicon: LSJ
  rationale: ἀναβαίνω의 ‘올라오다’ 이미지를 살리면서, αἰχμαλωσία는 본문 맥락상 ‘포로 생활’로 풀어 자연스럽고 구체적으로 옮겼습니다. ‘유배’도 가능하지만, 포로 상태의 집단적 현실이 더 분명합니다.
- source_word: συνελέλεκτο τῆς Ἰουδαίας
  english_pob_choice: had only recently been gathered together
  chosen_korean: 유다의 모든 백성도 이제 막 함께 모였으며[c][b]
  alternatives_korean:
  - 유다의 모든 백성도 이제 막 모였으며
  - 유다의 모든 백성도 이제 막 집결되었으며
  lexicon: LSJ
  rationale: 수동 완료의 집합 상태를 드러내기 위해 ‘함께 모였으며’로 옮겼고, ‘모든 백성’은 공동체적 회복의 범위를 분명히 합니다.
- source_word: τὰ σκεύη καὶ τὸ θυσιαστήριον καὶ ὁ οἶκος
  english_pob_choice: the vessels and the altar and the house
  chosen_korean: 그릇들과 제단과 집
  alternatives_korean:
  - 성전과 제단과 그 집
  - 기물들과 제단과 집
  lexicon: LSJ
  rationale: σκεύη는 성전 문맥의 제의 기구를 가리키지만, 과잉 해석을 피하기 위해 기본어 ‘그릇들’을 택했습니다. ὁ οἶκος는 문자적으로 ‘집’이지만, 본문에서는 성전을 가리키는 말이므로 각주로 보완합니다.
- source_word: ἐκ τῆς βεβηλώσεως ἡγιασμένα ἦν
  english_pob_choice: had been consecrated from the defilement
  chosen_korean: 더러움에서 거룩하게 되었습니다
  alternatives_korean:
  - 더러움에서 구별되어 거룩하게 되었습니다
  - 더러움에서 봉헌되었습니다
  lexicon: LSJ
  rationale: ἐκ는 상태의 전환을 나타내므로 ‘에서’로 살리고, ἁγιάζω의 결과 상태를 한국어로 자연스럽게 ‘거룩하게 되었습니다’로 옮겼습니다. 예배 용어인 ‘봉헌’도 가능하지만, 본문의 정결-거룩 전환을 더 직접적으로 드러내기 위해 선택하지 않았습니다.
theological_decisions:
- issue: ὁ οἶκος의 성전 지시
  chosen_reading: 본문은 ‘집’이라고 번역하고, 각주로 성전을 가리키는 표현임을 밝힙니다.
  alternative_readings:
  - 성전
  - 하나님의 집
  rationale: 그리스어의 경건한 완곡어법을 유지하면서도, 문맥상 의미를 오해하지 않도록 주석으로 보완하는 것이 원문 우선의 번역에 더 가깝습니다.
  doctrine_reference: Translation philosophy §§1, 6
- issue: 정결과 거룩의 관계
  chosen_reading: ‘더러움에서 거룩하게 되었습니다’로 번역해, 오염 상태로부터의 회복과 헌납의 결과를 함께 드러냅니다.
  alternative_readings:
  - 더러움에서 정결하게 되었습니다
  - 더러움에서 성별되었습니다
  rationale: 본문의 ἐκ + βεβήλωσις + ἁγιάζω는 단순 세정이 아니라 이전의 속됨/더러움에서 거룩한 상태로 옮겨짐을 말하므로, 그 신학적 긴장을 약화하지 않는 표현을 택했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
