base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/004/014.yaml
  text: And the Lord heard their voice and looked upon their affliction[b][a], and the people were fasting for many days throughout all Judea and Jerusalem before the holy things of the Lord Almighty.
  footnotes:
  - marker: a
    text: Or 'their cry.' The Greek literally says 'their voice,' but in context of prayer and distress it can carry the sense of a plea for help.
    reason: lexical_alternative
  - marker: b
    text: Or 'before the sanctuary' / 'before the holy places.' The Greek reads 'before the holy things' in the plural, which may refer broadly to the sacred things or holy precincts associated with the Lord Almighty.
    reason: alternative_reading
translation:
  language: ko
  text: 주님께서 그들의 음성을 들으시고 그들의 고난을 살피셨습니다. 그리고 백성은 유다와 예루살렘 온 땅에서 여러 날 동안, 주 전능자의 거룩한 것들 앞에서 금식하고 있었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 부르짖음’입니다. 그리스어는 문자적으로 ‘그들의 음성’이라고 하며, 기도와 곤경의 문맥에서는 도움을 구하는 호소의 뜻이 될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘성소 앞에서’ / ‘거룩한 장소들 앞에서’입니다. 그리스어는 복수형인 ‘거룩한 것들’을 사용하여, 주 전능자와 관련된 성물이나 거룩한 구역들을 넓게 가리킬 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: εἰσήκουσεν Κύριος τῆς φωνῆς αὐτῶν
  english_pob_choice: heard their voice
  chosen_korean: 그들의 음성을 들으시고
  alternatives_korean:
  - 그들의 소리를 들으시고
  - 그들의 부르짖음을 들으시고
  lexicon: BDAG
  rationale: φωνή는 문자적으로 ‘음성’이므로 기본값을 살리되, 기도와 탄원의 문맥이어서 ‘들으시고’로 응답적 뉘앙스를 자연스럽게 담았습니다.
- source_word: ἐπεῖδεν τὴν θλίψιν αὐτῶν
  english_pob_choice: looked upon their affliction
  chosen_korean: 그들의 고난을 살피셨습니다
  alternatives_korean:
  - 그들의 고통을 보셨습니다
  - 그들의 환난을 돌아보셨습니다
  lexicon: BDAG
  rationale: ἐπεῖδεν은 단순히 ‘보았다’보다 주의 깊게 살피는 뜻이 있어 ‘살피셨습니다’로 옮겨 원문의 응시·돌봄의 뉘앙스를 유지했습니다.
- source_word: ἡμέρας πλείους
  english_pob_choice: for many days
  chosen_korean: 여러 날 동안
  alternatives_korean:
  - 많은 날 동안
  - 오랫동안
  lexicon: BDAG
  rationale: 복수 시간 표현의 지속성을 한국어에서 자연스럽게 드러내는 표현으로 ‘여러 날 동안’을 선택했습니다.
- source_word: ἐν πάσῃ τῇ Ἰουδαίᾳ καὶ Ἰερουσαλήμ
  english_pob_choice: throughout all Judea and Jerusalem
  chosen_korean: 유다와 예루살렘 온 땅에서
  alternatives_korean:
  - 유다와 예루살렘 전역에서
  - 유다와 예루살렘 곳곳에서
  lexicon: BDAG
  rationale: πάσῃ의 포괄성을 살려 지역과 도성을 아우르는 범위를 한국어로 자연스럽게 풀었습니다.
- source_word: κατὰ πρόσωπον τῶν ἁγίων
  english_pob_choice: before the holy things
  chosen_korean: 주 전능자의 거룩한 것들 앞에서
  alternatives_korean:
  - 주 전능자의 성물들 앞에서
  - 주 전능자의 성소 앞에서
  lexicon: BDAG
  rationale: ἁγίων의 복수형을 따라 ‘거룩한 것들’로 보존하고, 문맥상 소유격인 Κυρίου Παντοκράτορος를 함께 드러내 ‘주 전능자’의 거룩한 것들임을 분명히 했습니다.
