  source_fidelity: 원문의 세 동작(엎드림, 머리에 재를 뿌림, 베옷을 펼침)을 모두 보존하고 있으며, 성전과 주 앞이라는 두 방향 표현도 유지합니다. 다만 ἐσποδώσαντο는 애도의 관습상 단순히 재를 ‘얹는’ 것보다 머리에 재를 ‘뿌리는/뒤집어쓰는’ 동작으로 옮기는 편이 더 정확합니다. ἔπεσον κατὰ πρόσωπον의 엎드림도 얼굴을 땅에 대는 자세를 밝혀 주면 더 충실합니다.
  naturalness: 수정문은 현대 표준어 합쇼체의 자연스러운 서술 흐름을 유지합니다. ‘아이들’은 ‘어린이들’보다 이 열거 문맥에서 조금 더 자연스럽고, 연결 어미 뒤의 최종 과거형은 그리스어의 서사적 과거를 적절히 나타냅니다.
  terminology: ‘성전’, ‘재’, ‘베옷’, ‘주’는 적절합니다. ‘베옷’은 σάκκοι의 애도용 거친 옷이라는 의미를 과도한 해석 없이 전달합니다. 주석은 이례적인 ἐξέτειναν τοὺς σάκκους 표현의 물리적·자세적 양 가능성을 보존하도록 다듬었습니다.
