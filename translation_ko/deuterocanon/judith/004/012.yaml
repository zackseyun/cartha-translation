  text: And every man of Israel[a], and the women and the children, those dwelling in Jerusalem, fell on their faces before the temple, and put ashes on their heads, and spread out their sackcloth before the Lord,
  footnotes:
  - marker: a
    text: Or 'stretched out their sackcloth before the Lord.' The Greek expression is somewhat unusual, and the exact physical action may be either spreading out sackcloth garments or extending themselves in sackcloth as a sign of mourning and supplication.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 이스라엘의 모든 남자들과 여자들과 어린이들, 곧 예루살렘에 사는 이들이 성전 앞에 엎드리고, 머리에 재를 얹으며, 주 앞에 자기들의 베옷을 펼쳐 놓았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '''베옷을 펼쳐 놓았습니다''는 그리스어 표현의 동작상을 반영한 직역에 가깝습니다. 문맥상 베옷을 펼쳐 두거나, 베옷을 입은 채 몸을 펼치는 식의 애도·탄원 행위를 가리킬 수 있습니다.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς ἀνὴρ Ἰσραήλ
  english_pob_choice: every man of Israel
  chosen_korean: 이스라엘의 모든 남자들
  alternatives_korean:
  - 이스라엘의 모든 남자
  - 모든 이스라엘 사람들
  lexicon: LSJ
  rationale: ἀνήρ의 성별 표지가 뒤의 γυναῖκα와 παιδία와 함께 분명하므로, 한국어도 남성 집단을 드러내는 표현으로 옮겼습니다. '모든 이스라엘 사람들'은 성별 대조를 약화시킵니다.
- source_word: οἱ κατοικοῦντες ἐν Ἰερουσαλήμ
  english_pob_choice: those dwelling in Jerusalem
  chosen_korean: 예루살렘에 사는 이들
  alternatives_korean:
  - 예루살렘에 거하는 이들
  - 예루살렘 주민들
  lexicon: LSJ
  rationale: 분사구의 지속적 거주 뉘앙스를 자연스럽게 살리되, 현대 한국어에서 과도하게 문어적인 '거하다'보다 '살다'가 더 읽기 쉽습니다.
- source_word: ἔπεσον κατὰ πρόσωπον
  english_pob_choice: fell on their faces
  chosen_korean: 엎드리고
  alternatives_korean:
  - 얼굴을 땅에 대고 엎드리고
  - 얼굴을 땅에 붙이고
  lexicon: LSJ
  rationale: 관용적으로는 '엎드리다'가 의미를 잘 전달하지만, 원문의 prostration 동작이 분명하므로 앞의 '성전 앞에'와 결합해 경배/탄원의 자세를 드러냈습니다.
- source_word: ἐσποδώσαντο τὰς κεφαλὰς αὐτῶν
  english_pob_choice: put ashes on their heads
  chosen_korean: 머리에 재를 얹으며
  alternatives_korean:
  - 머리에 재를 뿌리며
  - 머리에 재를 뒤집어쓰며
  lexicon: LSJ
  rationale: 동사는 애도 행위로서 머리 위에 재를 두는 동작을 가리키므로, '얹다'가 가장 무난하게 대응합니다. '뿌리다'와 '뒤집어쓰다'는 동작상을 더 강하게 특정합니다.
- source_word: ἐξέτειναν τοὺς σάκκους αὐτῶν
  english_pob_choice: spread out their sackcloth
  chosen_korean: 자기들의 베옷을 펼쳐 놓았습니다
  alternatives_korean:
  - 자기들의 베옷을 펼쳤습니다
  - 자기들의 베옷을 늘어놓았습니다
  lexicon: LSJ
  rationale: 영어 POB가 지적하듯 동작이 다소 이례적이어서, '펼쳐 놓다'로 물리적 펼침과 제의적 표시를 함께 살렸습니다. '베옷'은 mourning sackcloth의 표준 한국어 대응입니다.
theological_decisions:
- issue: 공동체의 범위와 성별 열거
  chosen_reading: 남자들, 여자들, 어린이들을 차례로 구분해 번역해 원문의 열거 구조를 유지했습니다.
  alternative_readings:
  - 이스라엘의 모든 사람들
  - 온 회중
  rationale: 원문은 남자-여자-어린이의 순차적 나열로 전체 공동체의 포괄성과 절박함을 강조합니다. 이를 하나의 총칭으로 합치면 수사적 효과가 약해집니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
- issue: Κυρίου의 번역
  chosen_reading: 주
  alternative_readings:
  - 주님
  - 하나님
  rationale: 주 앞이라는 관용적 성경 표현을 유지하면서도, 여기서는 직접 화자가 아닌 서술문이므로 '주'가 가장 간결하고 원문 친화적입니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: κύριος'
