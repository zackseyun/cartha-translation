  text: 그들 자신과 그들의 아내와 어린 자녀와 가축, 또 그들 가운데 있는 거류민이든 품꾼이든 그들이 은으로 산 노예이든, 모두 굵은 베옷을 각자의 허리에 둘렀습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘거주 외국인’으로 번역할 수 있습니다.
