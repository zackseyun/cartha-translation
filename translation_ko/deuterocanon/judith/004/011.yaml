  source_fidelity: 그리스어의 포괄적 열거와 ‘은으로 사들인 노예’라는 소유·매매 신분은 대체로 충실히 반영했습니다. 다만 αὐτῶν은 마지막 항목의 노예가 ‘그들이 소유한’ 사람임을 특히 나타내므로 이를 본문에서 더 분명히 하는 것이 좋습니다. 또한 ‘까지도’는 원문에 없는 특별한 강조를 더할 수 있습니다.
  naturalness: 초안의 반복된 ‘그들의’와 대시 사이의 긴 삽입구는 현대 한국어 문장으로 다소 무겁습니다. 범주들을 ‘~이든’으로 정리하고 ‘각자의 허리’로 옮기면 자연스럽고, 사람과 가축을 포함한 전체 열거도 유지됩니다.
