theological_decisions:
- issue: 가축과 사람을 함께 열거하는 문장의 사회적 범위
  chosen_reading: 본문의 열거 순서를 유지해 가족, 가축, 거류민, 품꾼, 노예가 함께 금식·애도의 표지에 참여한 것으로 읽었습니다.
  alternative_readings:
  - 인간과 동물을 단순 병렬로 보는 읽기
  - 사회적 하층민만을 따로 강조하는 읽기
  rationale: 그리스어 원문은 집단 전체를 포괄하는 열거를 사용하므로, 한국어도 범주를 분리해 약화시키지 않고 그대로 반영해야 합니다.
  doctrine_reference: 원문 우선 원칙; 서술문의 열거 구조 보존
- issue: ἀργυρώνητος의 신분 노출
  chosen_reading: ‘노예’로 옮겨 소유·매매된 신분을 분명히 했습니다.
  alternative_readings:
  - 종
  - 하인
  rationale: 본문은 단순 고용 관계가 아니라 구매된 종속 상태를 가리키므로, 전통적으로 완곡한 ‘하인’보다 노예라는 신분 표지가 더 정확합니다.
  doctrine_reference: DOCTRINE.md의 bonded-status 용어 원칙
