  to: 그들 자신과 그들의 아내와 어린 자녀와 가축, 또 그들 가운데 있는 거류민이든 품꾼이든 그들이 은으로 산 노예이든, 모두 굵은 베옷을 각자의 허리에 둘렀습니다.[a][b][c]
  rationale: 수정문은 모든 집단이 베옷을 두른다는 원문의 포괄 범위를 유지하면서, 한국어 열거를 자연스럽게 다듬었습니다. ‘그들이 은으로 산 노예’로 αὐτῶν과 ἀργυρώνητος의 관계를 드러내고, 원문에 없는 강조가 될 수 있는 ‘까지도’를 제거했습니다. ‘굵은 베옷’은 σάκκους의 재질과 의례적 성격을 자연스럽게 전달합니다.
