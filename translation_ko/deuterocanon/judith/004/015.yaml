  text: And Joakim the high priest[a], and all who stood before the Lord—the priests and those ministering to the Lord, with sackcloth girded around their waists—were offering the regular whole burnt offering, and the prayers, and the freewill gifts of the people[b],
  footnotes:
  - marker: a
    text: Or 'the continual whole burnt offering'; the Greek term τοῦ ἐνδελεχισμοῦ carries the sense of something regular or continual.
    reason: lexical_alternative
  - marker: b
    text: Or 'the prayers,' though in this sacrificial context the Greek likely refers to vows or vowed offerings rather than prayer in general.
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 큰사제 요아킴과 주님 앞에 서 있던 모든 이들—곧 사제들과 주님께 봉사하는 이들이 허리에 굵은베를 두르고—는 규칙적인 번제와 사람들의 서원들과 자원 예물들을 드리고 있었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘계속되는 번제’; 그리스어 토머스 τοῦ ἐνδελεχισμοῦ는 규칙적이거나 지속적인 것을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘기도들’. 다만 이 제의적 문맥에서는 일반 기도보다 서원이나 서원물의 뜻일 가능성이 큽니다.
    reason: alternative_reading
