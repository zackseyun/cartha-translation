  text: 이스라엘 자손은 요아킴 대제사장과 예루살렘에 앉아 있던 이스라엘 온 백성의 회의가 그들에게 지시한 대로 행하였습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '이스라엘 사람들', '이스라엘의 자녀들'.
    reason: lexical_alternative
  - marker: b
    text: 또는 '명령한 대로', '지시하여'.
    reason: lexical_alternative
  - marker: c
    text: 그리스어는 '예루살렘에 앉아 있던 이스라엘 온 백성의 회의'로도 읽을 수 있어, 마지막 절이 회의를 수식할 가능성이 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ υἱοὶ Ἰσραὴλ
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘의 자녀들
  lexicon: LSJ
  rationale: 그리스어 관용구의 집합적·언약적 정체성을 살리면서도 한국어에서 자연스럽고 성경적인 표현으로 옮겼습니다.
- source_word: συνέταξεν
  english_pob_choice: instructed
  chosen_korean: 지시한 대로
  alternatives_korean:
  - 명령한 대로
  - 지시한 바대로
  - 명령하여
  lexicon: LSJ
  rationale: 권위 있는 지시라는 뜻을 반영하되, 영어 POB의 'instructed'처럼 지나치게 강한 명령 어조로만 고정하지 않도록 했습니다.
- source_word: Ἰωακεὶμ ὁ ἱερεὺς ὁ μέγας
  english_pob_choice: Joakim the high priest
  chosen_korean: 요아킴 대제사장
  alternatives_korean:
  - 요아킴 큰 제사장
  - 요아킴 대사제
  lexicon: LSJ
  rationale: 직함은 한국어 성경의 통용 표현인 '대제사장'으로 옮겨 직분을 분명히 했습니다.
- source_word: ἡ γερουσία παντὸς δήμου Ἰσραὴλ
  english_pob_choice: the council of the whole people of Israel
  chosen_korean: 이스라엘 온 백성의 회의
  alternatives_korean:
  - 이스라엘 온 백성의 원로회
  - 이스라엘 전체 백성의 의회
  lexicon: LSJ
  rationale: γερουσία의 원로 집단 성격과 δήμος의 공동체성을 함께 살리기 위해 '회의'로 옮기되, 주석 없이도 이해되도록 '온 백성'을 붙였습니다.
theological_decisions:
- issue: οἱ ἐκάθηντο ἐν Ἰερουσαλήμ의 수식 범위
  chosen_reading: 문맥상 '예루살렘에 앉아 있던'은 회의에 대한 설명으로 읽을 수 있으므로 이를 본문에 반영했습니다.
  alternative_readings:
  - '''그들''이 예루살렘에 앉아 있던 것으로 볼 수 있음'
  - '''회의가 예루살렘에 있었다''는 의미로만 제한할 수 있음'
  rationale: 그리스어 분사구가 회의 전체를 수식할 가능성이 있어, 영어 POB의 각주 취지를 따라 한국어 본문에서도 그 여지를 열어 두었습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 4, 5
