  text: 이스라엘 자손은 예루살렘에 자리하고 있던 요아킴 대제사장과 이스라엘 온 백성의 원로회가 그들에게 지시한 대로 행하였습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이스라엘 사람들’, ‘이스라엘의 자녀들’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘명령한 대로’, ‘지시한 바대로’.
    reason: lexical_alternative
  - marker: c
    text: 그리스어의 ‘예루살렘에 앉아 있던’이라는 복수 관계절은 요아킴과 원로회를 함께 가리킬 수 있으며, 원로회 구성원을 가리키는 것으로도 이해될 수 있습니다.
    reason: alternative_reading
