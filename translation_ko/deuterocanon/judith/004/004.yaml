  rationale: 본문과 영어 주석 모두 여러 지명의 정확한 동일시가 불확실함을 전제하므로, 추정적 해석을 덧붙이지 않고 원형을 보존하는 것이 가장 충실합니다.
  doctrine_reference: 본문 신뢰성 및 지리명 보존 원칙
