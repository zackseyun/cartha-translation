translation:
  language: ko
  text: 그리고 그들은 사마리아 전 지역[a]과 코나와 벧호론과 벨마임과 여리고와 초바와 아이소라와 살렘의 골짜기[b]에 전갈을 보냈습니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘사마리아의 모든 경계에’. 여기의 그리스어는 경계, 구역, 지역을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘살렘의 평지’. 그리스어 αὐλών은 골짜기, 협곡, 평지 같은 움푹한 지형을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 이 구절의 몇몇 지명은 그리스어 형태만으로는 정확히 어느 곳인지 확정하기 어려우므로 음역으로 보존했습니다.
    reason: cultural_note
lexical_decisions:
- source_word: ἀπέστειλαν
  english_pob_choice: they sent word
  chosen_korean: 사람을 보냈습니다
  alternatives_korean:
  - 전갈을 보냈습니다
  - 보냈습니다
  lexicon: BDAG
  rationale: 본문은 목적지들을 열거하므로, 단순한 ‘보냈습니다’보다 전갈을 실어 보낸 뜻이 드러나는 표현이 자연스럽습니다. 다만 영어의 ‘sent word’를 그대로 좇아 과도하게 해석하지 않도록 ‘사람을 보냈습니다’로 절제했습니다.
- source_word: εἰς πᾶν ὅριον Σαμαρίας
  english_pob_choice: into all the territory of Samaria
  chosen_korean: 사마리아의 온 경계
  alternatives_korean:
  - 사마리아의 온 지역
  - 사마리아의 모든 경계
  lexicon: LSJ
  rationale: ὅριον은 경계, 경역, 지역을 모두 가리킬 수 있어 ‘경계’와 ‘지역’ 사이의 긴장이 있습니다. 여기서는 영어 본문의 ‘territory’를 반영하되 경계 의미도 살려 ‘온 경계’로 옮겼습니다.
- source_word: Κωνὰ / Βαιθωρὼν / Βαιλμὰιν / Χωβὰ / Αἰσωρὰ
  english_pob_choice: Kona / Beth-horon / Belmaim / Choba / Aisora
  chosen_korean: 코나 / 벧호론 / 벨마임 / 초바 / 아이소라
  alternatives_korean:
  - 코나 / 베드호론 / 벨마임 / 호바 / 에소라
  lexicon: LSJ
  rationale: 지명들은 원형의 음가를 최대한 보존하는 방향으로 음역했습니다. ‘벧호론’은 성경 지명 관행을 따르되, 나머지는 헬라어 음역을 과잉 식별하지 않도록 근접 음역으로 처리했습니다.
- source_word: τὸν αὐλῶνα Σαλήμ
  english_pob_choice: the valley of Salem
  chosen_korean: 살렘의 골짜기
  alternatives_korean:
  - 살렘의 계곡
  - 살렘의 평지
  lexicon: LSJ
  rationale: αὐλών은 골짜기, 계곡, 움푹한 지형을 가리킬 수 있으며 영어 본문도 ‘valley’로 택했습니다. 한국어에서는 자연스럽고 지형적 함의를 유지하는 ‘골짜기’가 가장 적절합니다.
