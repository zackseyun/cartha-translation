  text: And they were very, very afraid because of him, and they were troubled about Jerusalem and the temple of the Lord their God.
translation:
  language: ko
  text: 그와 같은 사람으로 인해 그들은 매우, 매우 두려워하였고, 예루살렘과 그들의 하나님 주님의 성전 일로 마음이 동요되었습니다.
  philosophy: formal
lexical_decisions:
- source_word: ἐφοβήθησαν σφόδρα σφόδρα
  english_pob_choice: very, very afraid
  chosen_korean: 매우, 매우 두려워하였고
  alternatives_korean:
  - 몹시, 몹시 두려워하였고
  - 지극히 두려워하였고
  lexicon: φοβέομαι
  rationale: σφόδρα를 반복해 강조한 구조를 그대로 살려, 한국어에서도 반복 부사를 유지해 두려움의 강도를 직접 드러냈습니다.
- source_word: ἀπὸ προσώπου αὐτοῦ
  english_pob_choice: because of him
  chosen_korean: 그와 같은 사람으로 인해
  alternatives_korean:
  - 그 때문에
  - 그를 인하여
  lexicon: πρόσωπον
  rationale: 직역하면 '그의 얼굴 앞에서'이지만 여기서는 원인이 되는 인물에 대한 두려움을 뜻하므로, POB의 문맥적 의미를 반영해 원인 표현으로 옮겼습니다.
- source_word: περὶ Ἰερουσαλὴμ καὶ τοῦ ναοῦ
  english_pob_choice: about Jerusalem and the temple
  chosen_korean: 예루살렘과 그들의 하나님 주님의 성전 일로
  alternatives_korean:
  - 예루살렘과 주 그들의 하나님의 성전 때문에
  - 예루살렘과 그들의 하나님 주님의 성전에 대해
  lexicon: ναός
  rationale: περί + 속격이 여기서는 '…에 관해/…일로'의 근심 대상을 나타내므로, 단순 위치가 아니라 염려의 초점을 살렸습니다.
- source_word: Κυρίου θεοῦ αὐτῶν
  english_pob_choice: the Lord their God
  chosen_korean: 그들의 하나님 주님의
  alternatives_korean:
  - 그들의 주 하나님
  - 그들의 하나님 야훼의
  lexicon: κύριος
  rationale: 본문은 LXX 문맥의 '주님'과 '하나님'을 함께 지니므로 둘을 모두 보존하되, 한국어 어순상 성전 소유격을 앞쪽에 배치했습니다.
theological_decisions:
- issue: 두려움과 동요의 대상이 단순한 감정이 아니라 예루살렘과 성전의 위협이라는 점
  chosen_reading: 그들은 인물 자체를 두려워했을 뿐 아니라 예루살렘과 성전의 장래를 두고 마음이 흔들렸다고 읽었습니다.
  alternative_readings:
  - 단순한 공포 심리만 강조하는 읽기
  - 정치적 불안만 강조하는 읽기
  rationale: 문장은 개인적 공포와 공동체 성소에 대한 염려를 병렬로 제시하므로, 둘을 모두 드러내는 번역이 본문 의도를 더 잘 보존합니다.
  doctrine_reference: 성소/공동체 보존의 긴장
