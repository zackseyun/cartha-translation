  lexicon: BDAG
  rationale: δύναμις는 여기서 군사적 ‘힘’보다 지휘 아래 있는 병력의 뜻이 분명하므로, POB의 ‘force’를 한국어에서 자연스러운 군사 집합명사인 ‘군세’로 옮겼습니다.
