  naturalness: ‘군세’는 문어적이고 현대 한국어에서 다소 낯섭니다. ‘군대’가 자연스럽고, 상급자에게 말하는 상황에서는 ‘당신의’보다 ‘주인님의’를 쓰는 편이 공손한 위계 관계를 보존합니다. 3인칭 명령의 간청은 조건절을 사용하여 자연스럽게 옮겼습니다.
  terminology: δεσπότης는 문맥상 신적 호칭이 아니라 권위 있는 상관을 가리키므로 ‘우리 주인’으로 옮기고, ‘우리 주군’을 대안으로 각주에 제시합니다. δύναμις는 군사적 집단을 뜻하므로 ‘군대’로, θραῦσμα는 비유적인 군사적 손상이라는 폭을 유지하여 ‘균열’로 옮깁니다.
