  rationale: 직접 높임의 간청을 현대 표준 한국어 합쇼체에서 자연스럽게 표현하기 위해 조건절을 사용했습니다. 이는 ‘한 말씀을 들어 달라’는 요청과 ‘군대에 손상이 없게 하려는’ ἵνα 목적을 함께 보존합니다. ‘우리 주인/주인님의’은 원문의 상하 위계와 1·2인칭 소유 관계를 유지하면서, 신적 호칭으로 읽힐 수 있는 ‘주/주님’의 불필요한 함의를 피합니다.
