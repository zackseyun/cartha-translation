  lexicon: BDAG
  rationale: 3인칭 단수 명령형을 한국어의 정중한 권유형으로 옮기되, λόγον을 ‘한 말씀’으로 간결하게 처리해 원문의 간청성을 살렸습니다.
- source_word: ὁ δεσπότης ἡμῶν
