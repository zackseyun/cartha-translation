  - 균열
  - 구멍
  lexicon: LSJ
  rationale: 군대 안의 손상이나 붕괴를 가리키는 비유적 표현으로, 한국어에서는 ‘틈’이 가장 간결하게 ‘breach’의 깨짐과 허점을 함께 드러냅니다.
- source_word: ἐν τῇ δυνάμει σου
  english_pob_choice: in your force
  chosen_korean: 당신의 군세에
  alternatives_korean:
  - 당신의 군대에
