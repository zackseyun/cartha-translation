base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/007/007.yaml
  text: And he inspected the approaches to their city[a], and he took control of the springs of water and seized them, and he stationed camps of fighting men by them[c][b]; and he himself returned to his people.
  footnotes:
  - marker: a
    text: Or 'the ascents' or 'the ways up to their city.' The Greek emphasizes the uphill access routes to the city.
    reason: lexical_alternative
  - marker: b
    text: The verb rendered 'fortified' is rare; it may also be understood as 'secured' or 'blockaded' the water springs.
    reason: lexical_alternative
  - marker: c
    text: Or 'he broke camp and went up/back to his people.' The Greek verb may carry the nuance of striking camp before returning.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그는 그들의 성읍으로 올라가는 길들을[a] 살펴보고, 물의 샘들을 둘러싸고[b] 그것들을 선점하였으며, 그 곁에 전사들의 진영들을 배치했습니다. 그리고 그 자신은 자기 백성에게로 돌아갔습니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘오르막길들’ 또는 ‘그들의 성읍으로 오르는 길들’입니다. 그리스어는 성읍으로 향하는 오르막 접근로를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 이 드문 동사는 여기서 샘들 주위를 돌다 또는 둘러싸다로 이해할 수 있습니다. 이어지는 동사는 그 샘들을 선점하거나 점거했음을 나타냅니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘진을 걷고 자기 백성에게로 돌아갔다’입니다. 그리스어 동사는 진을 떠나 이동하는 뉘앙스를 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεσκέψατο
  english_pob_choice: inspected
  chosen_korean: 살펴보고
  alternatives_korean:
