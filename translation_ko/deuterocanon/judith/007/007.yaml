  - 접근로들
  lexicon: LSJ
  rationale: 직역하면 ‘올라감/오름’이지만, 성읍으로 이어지는 지형적 통로를 가리키므로 의미를 드러내는 ‘올라가는 길들’로 옮겼습니다.
- source_word: πηγὰς τῶν ὑδάτων
  english_pob_choice: the springs of water
  chosen_korean: 물 샘들
  alternatives_korean:
  - 물의 샘들
  - 샘들
  - 수원들
  lexicon: LSJ
  rationale: 구체적인 군사 목표가 물 공급원이라는 점을 살려, 간결하면서도 대상이 분명한 ‘물 샘들’로 번역했습니다.
- source_word: ἐφώδευεν καὶ προκατέλαβε
  english_pob_choice: took control of ... and seized them
  chosen_korean: 장악하여 점거하였으며
  alternatives_korean:
  - 통제하여 차지하였으며
  - 장악하고 빼앗았으며
  - 봉쇄하고 점유하였으며
  lexicon: LSJ
  rationale: 영어 POB의 수정 취지처럼 문자적 ‘요새화’보다 통제권 확보의 뉘앙스가 핵심이므로, 두 동사의 결합을 군사적으로 자연스러운 ‘장악하여 점거하였으며’로 묶었습니다.
- source_word: παρεμβολὰς ἀνδρῶν πολεμιστῶν
  english_pob_choice: camps of fighting men
  chosen_korean: 전투하는 사람들의 진
  alternatives_korean:
  - 전사들의 진
  - 군사들의 진
  - 전투 병사들의 진
  lexicon: LSJ
  rationale: παρεμβολή의 기본 뜻인 ‘진/야영지’를 살리고, ἀνδρῶν πολεμιστῶν의 반복적인 남성 전사 표지를 비교적 직역에 가깝게 보존했습니다.
- source_word: ἀνέζευξεν
  english_pob_choice: returned
  chosen_korean: 물러갔습니다
  alternatives_korean:
  - 돌아갔습니다
  - 철수하였습니다
  - 진을 걷고 돌아갔습니다
  lexicon: LSJ
  rationale: 문맥상 단순 귀환보다 군사 행동을 마치고 이동하는 뉘앙스가 있어, 본문에는 간결한 ‘물러갔습니다’를 두고 의미 범위를 유지했습니다.
theological_decisions:
- issue: 군사 서술의 동사 선택이 과도한 해석을 피해야 하는 문제
  chosen_reading: 본문의 동작을 ‘살펴보고—장악하여 점거하였으며—진을 세웠습니다—물러갔습니다’라는 순서로 평이하게 옮겨, 해설적 확장 없이 전술적 진행을 드러냈습니다.
  alternative_readings:
  - ‘요새화하고 점거하였으며’처럼 더 강한 방어 구축으로 읽는 번역
  - ‘봉쇄하고 점령하였다’처럼 완전히 재구성한 번역
  rationale: 원문은 접근로 조사, 샘 통제, 병력 배치, 복귀의 연속을 보여 주므로, 한국어도 그 단계성을 보존하는 것이 가장 충실합니다.
  doctrine_reference: 본문 서술의 역사·군사적 맥락 보존
