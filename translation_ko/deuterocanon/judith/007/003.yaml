translation:
  language: ko
  text: 그들은 베툴리아[a] 가까운 골짜기, 샘 곁에 진을 쳤으며, 너비로는 도타임을 향하여 벨바임까지, 길이로는 베툴리아에서 키아몬까지, 곧 에스드레론 맞은편까지 퍼졌습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 αὐλών은 어떤 문맥에서는 ‘뜰’이나 ‘마당’을 뜻할 수 있지만, 여기서는 지명들과 샘이 함께 나오는 지형 묘사이므로 ‘골짜기’로 옮겼습니다.
    reason: lexical_alternative
