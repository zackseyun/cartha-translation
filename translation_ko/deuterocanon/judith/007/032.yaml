  yaml_path: translation/deuterocanon/judith/007/032.yaml
  text: And he dispersed the people to their camp[a], and they went away to the walls and towers of their city, and he sent the women and children to their houses[b]; and they were in great humiliation in the city.
  footnotes:
  - marker: a
    text: Greek has a singular verb ('went away'), but the context points to the dispersed people as the ones moving to the walls and towers; the English renders the sense accordingly.
    reason: textual_variant
  - marker: b
    text: Or 'in great distress.' The Greek expression can denote being brought very low, whether in humiliation, affliction, or misery.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 백성을 자기 진영으로 흩어 놓았고, 그들은 그들의 도시의 성벽과 망루로 갔으며, 여자들과 아이들은 그들의 집으로 보내졌습니다. 그리고 그들은 그 도시 안에서 크게 낮아져 있었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 동사 형태가 단수로 되어 있지만, 앞선 ‘백성’이 분산되어 성벽과 망루로 이동하는 흐름이므로 의미상 복수를 반영했습니다.
    reason: textual_variant
  - marker: b
    text: 그리스어 표현은 ‘굴욕’뿐 아니라 ‘곤경’이나 ‘비참함’까지도 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσκόρπισεν
  english_pob_choice: dispersed
  chosen_korean: 흩어 놓았고
  alternatives_korean:
  - 흩었고
  - 흩뜨려 놓았고
  lexicon: BDAG
  rationale: 사람들을 넓게 퍼뜨리게 하는 동작을 자연스럽게 살리되, 단순한 흩어짐보다 행위자의 조치를 분명히 나타내기 위해서입니다.
- source_word: παρεμβολή
  english_pob_choice: camp
  chosen_korean: 진영
  alternatives_korean:
  - 군영
  - 캠프
  lexicon: BDAG
  rationale: 군사적 맥락에서 현대 한국어의 자연스러운 대응으로는 ‘진영’이 적절하며, ‘캠프’보다 문어적 성격도 유지됩니다.
- source_word: τείχη καὶ τοὺς πύργους
  english_pob_choice: walls and towers
  chosen_korean: 성벽과 망루
  alternatives_korean:
  - 성벽과 탑들
  - 담과 망루
  lexicon: BDAG
  rationale: 도시 방어 구조를 한국어로 분명하게 전달하기 위해 ‘성벽’과 ‘망루’를 택했습니다. ‘망루’는 πύργους의 군사·감시 기능을 드러냅니다.
- source_word: ἀπέστειλεν
  english_pob_choice: sent
  chosen_korean: 보내졌습니다
  alternatives_korean:
  - 보냈습니다
  - 돌려보냈습니다
  lexicon: BDAG
  rationale: 여자들과 아이들을 집으로 이동시키는 맥락을 반영해, 결과 중심의 수동 표현으로 자연스럽게 옮겼습니다.
- source_word: ἐν ταπεινώσει πολλῇ
  english_pob_choice: in great humiliation
  chosen_korean: 크게 낮아져 있었습니다
  alternatives_korean:
  - 큰 굴욕 가운데 있었습니다
  - 크게 수치스러운 상태였습니다
  - 심한 곤경에 있었습니다
  lexicon: BDAG
  rationale: ταπείνωσις의 핵심인 ‘낮아짐/굴욕’을 살리되, 한국어에서 너무 해석적으로 흐르지 않도록 ‘크게 낮아져 있었습니다’로 옮겼습니다.
theological_decisions:
- issue: ταπείνωσις의 정서적 범위
  chosen_reading: ‘크게 낮아져 있었습니다’는 굴욕과 곤경을 함께 포괄하는 표현으로 유지했습니다.
  alternative_readings:
  - ‘큰 굴욕 가운데 있었습니다’
  - ‘심한 고통 가운데 있었습니다’
  rationale: 본문은 단순한 감정 표현이 아니라 공동체가 공개적으로 낮아진 상태를 말하므로, 굴욕과 비참함을 동시에 열어 두는 번역이 원문의 긴장을 잘 보존합니다.
  doctrine_reference: '번역 원리: 어휘적 긴장 보존'
