  yaml_path: translation/deuterocanon/judith/007/032.yaml
  text: And he dispersed the people to their camp[a], and they went away to the walls and towers of their city, and he sent the women and children to their houses[b]; and they were in great humiliation in the city.
  footnotes:
  - marker: a
    text: Greek has a singular verb ('went away'), but the context points to the dispersed people as the ones moving to the walls and towers; the English renders the sense accordingly.
    reason: textual_variant
  - marker: b
    text: Or 'in great distress.' The Greek expression can denote being brought very low, whether in humiliation, affliction, or misery.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 백성을 자기 진영으로 흩어 보냈고, 그들은 자기 도시의 성벽과 망루로 갔습니다.[a] 또 그는 여자들과 아이들을 그들의 집으로 보냈습니다. 그들은 그 도시 안에서 큰 비참함 가운데 있었습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 이 절의 동사 형태가 단수이지만, 문맥상 앞서 흩어진 ‘백성’이 성벽과 망루로 가는 것을 가리킵니다. 따라서 한국어에서는 의미에 따라 복수로 옮겼습니다.
    reason: textual_variant
  - marker: b
    text: 그리스어 표현은 ‘큰 굴욕’으로도 옮길 수 있으며, 굴욕뿐 아니라 곤궁이나 비참함의 상태를 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
