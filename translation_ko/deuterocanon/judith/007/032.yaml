  lexicon: BDAG
  rationale: 여자들과 아이들을 집으로 이동시키는 맥락을 반영해, 결과 중심의 수동 표현으로 자연스럽게 옮겼습니다.
- source_word: ἐν ταπεινώσει πολλῇ
  english_pob_choice: in great humiliation
  chosen_korean: 크게 낮아져 있었습니다
  alternatives_korean:
  - 큰 굴욕 가운데 있었습니다
  - 크게 수치스러운 상태였습니다
  - 심한 곤경에 있었습니다
  lexicon: BDAG
  rationale: ταπείνωσις의 핵심인 ‘낮아짐/굴욕’을 살리되, 한국어에서 너무 해석적으로 흐르지 않도록 ‘크게 낮아져 있었습니다’로 옮겼습니다.
theological_decisions:
- issue: ταπείνωσις의 정서적 범위
  chosen_reading: ‘크게 낮아져 있었습니다’는 굴욕과 곤경을 함께 포괄하는 표현으로 유지했습니다.
  alternative_readings:
  - ‘큰 굴욕 가운데 있었습니다’
  - ‘심한 고통 가운데 있었습니다’
  rationale: 본문은 단순한 감정 표현이 아니라 공동체가 공개적으로 낮아진 상태를 말하므로, 굴욕과 비참함을 동시에 열어 두는 번역이 원문의 긴장을 잘 보존합니다.
  doctrine_reference: '번역 원리: 어휘적 긴장 보존'
