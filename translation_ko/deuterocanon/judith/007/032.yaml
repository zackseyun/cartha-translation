  rationale: 도시 방어 구조를 한국어로 분명하게 전달하기 위해 ‘성벽’과 ‘망루’를 택했습니다. ‘망루’는 πύργους의 군사·감시 기능을 드러냅니다.
- source_word: ἀπέστειλεν
  english_pob_choice: sent
