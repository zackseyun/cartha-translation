  lexicon: LSJ
  rationale: 직역하면 ‘충만함/가득 참’이지만, 여기서는 물이 ‘모자라지 않을 만큼’이라는 뜻이므로 문맥에 맞는 ‘충분히’로 간결하게 옮겼습니다.
- source_word: ἐν μέτρῳ
  english_pob_choice: by measure
  chosen_korean: 양을 재어
  alternatives_korean:
