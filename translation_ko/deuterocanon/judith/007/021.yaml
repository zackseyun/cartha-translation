  - 정량으로
  - 절제하여
  lexicon: LSJ
  rationale: ‘by measure’의 구체적 이미지를 살려, 물이 배급·배정되었음을 드러내는 ‘양을 재어’로 번역했습니다.
theological_decisions:
- issue: 포위 상황의 서술 방식
  chosen_reading: 문맥상의 긴박함을 유지하기 위해 과장 없이 수량 부족과 배급의 사실을 직접적으로 드러냈습니다.
  alternative_readings:
  - 의미를 완화해 ‘물을 조금밖에 마시지 못했다’로 풀기
  - 문학적으로 ‘물이 바닥나고 있었다’로 재구성하기
  rationale: 본문은 실제로 물 공급이 배급되었고 그 결과 하루 치도 충분하지 않았다는 상황을 전달하므로, 서술의 날카로움을 유지하는 것이 원문 의미에 가장 충실합니다.
  doctrine_reference: 본문 맥락 해석
