  text: And the cisterns were being emptied, and they did not have enough water to drink for even one day, because it was given to them to drink by measure.
  footnotes:
  - marker: a
    text: Or 'in measured amounts' or 'sparingly'; the Greek literally says 'by measure,' indicating rationed distribution of water.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 저수조들은 비어 가고 있었고, 그들에게는 하루 동안 충분히 마실 물도 없었습니다. 이는 그들에게 마실 물이 정량으로 주어졌기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘재어서’, ‘정해진 분량으로’. 그리스어는 문자적으로 ‘측량하여/재어서’를 뜻하며, 물이 정해진 양으로 배급되었음을 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: λάκκοι
  english_pob_choice: cisterns
  chosen_korean: 저장고들
  alternatives_korean:
