  text: And the cisterns were being emptied, and they did not have enough water to drink for even one day, because it was given to them to drink by measure.
  footnotes:
  - marker: a
    text: Or 'in measured amounts' or 'sparingly'; the Greek literally says 'by measure,' indicating rationed distribution of water.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 저장고들은 비어 가고 있었고, 그들은 하루도 마실 물을 충분히 가지지 못했는데, 그것이 그들에게 양을 재어 주어졌기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘양을 재어’, ‘절제하여’. 그리스어는 문자적으로 ‘측량하여/재어’ 주었다는 뜻으로, 배급된 분량의 물을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: λάκκοι
  english_pob_choice: cisterns
  chosen_korean: 저장고들
  alternatives_korean:
  - 물 저장 구덩이들
  - 물항아리들
  - 우물들
  lexicon: LSJ
  rationale: 전투·포위 상황에서 λάκκοι는 단순한 ‘구덩이’보다 물을 저장하는 시설을 가리키므로, 현대 한국어에서 기능을 드러내는 ‘저장고들’로 옮겼습니다.
- source_word: ἐξεκενοῦντο
  english_pob_choice: were being emptied
  chosen_korean: 비어 가고 있었고
  alternatives_korean:
  - 비워지고 있었고
  - 말라 가고 있었고
  - 다 비어 가고 있었고
  lexicon: LSJ
  rationale: 미완료 시상의 진행성을 살리면서, 한국어로 자연스럽게 수위가 줄어드는 과정을 드러내기 위해 ‘비어 가고 있었고’를 택했습니다.
- source_word: εἰς πλησμονὴν
  english_pob_choice: enough / their fill
  chosen_korean: 충분히
  alternatives_korean:
  - 배부를 만큼
  - 만족할 만큼
  - 흠뻑
  lexicon: LSJ
  rationale: 직역하면 ‘충만함/가득 참’이지만, 여기서는 물이 ‘모자라지 않을 만큼’이라는 뜻이므로 문맥에 맞는 ‘충분히’로 간결하게 옮겼습니다.
- source_word: ἐν μέτρῳ
  english_pob_choice: by measure
  chosen_korean: 양을 재어
  alternatives_korean:
  - 재어
  - 정량으로
  - 절제하여
  lexicon: LSJ
  rationale: ‘by measure’의 구체적 이미지를 살려, 물이 배급·배정되었음을 드러내는 ‘양을 재어’로 번역했습니다.
theological_decisions:
- issue: 포위 상황의 서술 방식
  chosen_reading: 문맥상의 긴박함을 유지하기 위해 과장 없이 수량 부족과 배급의 사실을 직접적으로 드러냈습니다.
  alternative_readings:
  - 의미를 완화해 ‘물을 조금밖에 마시지 못했다’로 풀기
  - 문학적으로 ‘물이 바닥나고 있었다’로 재구성하기
  rationale: 본문은 실제로 물 공급이 배급되었고 그 결과 하루 치도 충분하지 않았다는 상황을 전달하므로, 서술의 날카로움을 유지하는 것이 원문 의미에 가장 충실합니다.
  doctrine_reference: 본문 맥락 해석
