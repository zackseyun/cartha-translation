  rationale: 전투·포위 상황에서 λάκκοι는 단순한 ‘구덩이’보다 물을 저장하는 시설을 가리키므로, 현대 한국어에서 기능을 드러내는 ‘저장고들’로 옮겼습니다.
- source_word: ἐξεκενοῦντο
