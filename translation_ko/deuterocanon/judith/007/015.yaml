  text: And you will repay them with an evil recompense[b][a], because they rebelled and did not meet you in peace.
  footnotes:
  - marker: a
    text: Literally, 'repay them an evil repayment,' a cognate expression that intensifies the idea of requital.
    reason: lexical_alternative
  - marker: b
    text: Or 'did not go out to meet you in peace.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그들이 반역하였고 평화로 당신의 얼굴을 맞으러 나오지 않았으므로, 당신은 그들에게 악한 보응을 갚으실 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘악한 되갚음(보응)’이라는 뜻으로, 동족어 반복이 응보의 강도를 높입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘평화로 당신을 맞으러 나오지 않았으므로’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνταποδώσεις
