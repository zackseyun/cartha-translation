  - 되갚으실 것입니다
  lexicon: BDAG
  rationale: 미래형 보응 동사를 자연스러운 합쇼체로 옮기면서, 원문의 갚음/되갚음의 상호성도 살렸습니다.
- source_word: ἀνταπόδομα πονηρόν
