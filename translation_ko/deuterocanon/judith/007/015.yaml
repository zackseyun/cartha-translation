  lexicon: LEH
  rationale: 단순한 불복종보다 공동체적·정치적 적대의 뉘앙스가 강해 ‘반역’이 더 가깝습니다.
- source_word: οὐκ ἀπήντησαν τῷ προσώπῳ σου ἐν εἰρήνῃ
  english_pob_choice: did not meet you in peace
  chosen_korean: 평화로 당신의 얼굴을 맞으러 나오지 않았으므로
  alternatives_korean:
  - 평화 가운데 당신을 맞이하지 않았으므로
  - 평화롭게 당신에게 나아가지 않았으므로
  - 평화로 당신을 만나지 않았으므로
  lexicon: BDAG
  rationale: 직역의 ‘당신의 얼굴’은 관계적 대면을 드러내므로 살리되, 한국어 문장에서는 ‘맞으러 나오다’로 자연스럽게 풀었습니다.
theological_decisions:
- issue: 보응의 성격
  chosen_reading: 하나님께서 반역과 비평화적 거절에 대해 악한 보응을 갚으시는 직접적 심판 선언으로 옮겼습니다.
  alternative_readings:
  - 일반적인 보복 진술로 완화하는 번역
