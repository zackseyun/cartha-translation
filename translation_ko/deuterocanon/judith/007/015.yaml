    text: 직역하면 ‘악한 되갚음을 되갚으실 것이다’입니다. 동족어를 반복한 표현이 보응의 뜻을 강조합니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘평화 가운데 당신의 얼굴을 맞으러 나오지’입니다. 여기서 ‘당신의 얼굴’은 관용적으로 당신 자신, 곧 당신의 면전·임재를 가리킵니다.
    reason: lexical_alternative
