  source_fidelity: 핵심 군사 지시의 순서와 의미는 대체로 충실합니다. 다만 οἳ παρεγένοντο ἐπὶ τὴν συμμαχίαν αὐτοῦ는 ‘자기와 동맹을 맺으러’라기보다 그의 동맹에 가담하거나 그 동맹을 위해 온 사람들을 뜻하므로, 상호 동맹 체결이라는 뉘앙스는 피하는 편이 안전합니다. ἀναβάσεις의 지형적 의미는 ‘산지의 길목들’로 무리 없이 전달됩니다.
  naturalness: ‘그리고 다음 날’은 문두에서 다소 불필요하게 접속적이며, ‘이스라엘의 아들들’은 한국어 성서 문맥에서 지나치게 직역투입니다. ‘그다음 날’과 ‘이스라엘 자손들’이 현대의 격식 있는 한국어에서 더 자연스럽고, 후자는 전통적 집단 명칭도 보존합니다.
  terminology: ‘홀로페르네스’, ‘베툴리아’, ‘진을 거두고’, ‘전쟁을 하다’는 적절합니다. ‘이스라엘 자손들’은 원문의 전통적 친족 명칭을 한국어 성서 관용에 맞게 유지하며, 단순한 민족명인 ‘이스라엘 사람들’로 평준화하지 않습니다.
