base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/007/001.yaml
  text: On the next day Holofernes ordered all his army and all his people who had come for his alliance to break camp for Bethulia[a], to seize the passes of the hill country in advance[b], and to make war against the sons of Israel.
  footnotes:
  - marker: a
    text: Or “who had come as his allies.” The Greek literally says those who had come to his alliance.
    reason: lexical_alternative
  - marker: b
    text: Or “the Israelites.” The Greek reads “the sons of Israel,” preserving the traditional familial designation.
    reason: lexical_alternative
translation:
  language: ko
  text: 그다음 날, 홀로페르네스는 자기 군대 전체와 자기 동맹에 가담하러 온 모든 백성에게[a] 베툴리아를 향해 진을 거두고 산지의 길목들을 미리 점령하며[b] 이스라엘 자손들과 전쟁을 하라고 명령했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그의 동맹을 위해 온.” 그리스어는 문자적으로 “그의 동맹에 온 자들”이라고 합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “산지의 오르막길들.” 그리스어 ἀναβάσεις는 문자적으로 ‘오름길들’이지만, 군사적 맥락에서는 전략적 통로를 가리킬 수 있습니다.
    reason: lexical_alternative
