  yaml_path: translation/deuterocanon/judith/007/017.yaml
  text: And the camp of the sons of Ammon moved on[a], and with them five thousand sons of Asshur[c][b], and they encamped in the valley and seized the waters and the springs of water of the sons of Israel.
  footnotes:
  - marker: a
    text: Or 'Ammonites.' The Greek reads literally 'sons of Ammon.'
    reason: lexical_alternative
  - marker: b
    text: The Greek term rendered 'valley' can also mean a hollow, glen, or enclosed plain, depending on terrain.
    reason: lexical_alternative
  - marker: c
    text: Or 'occupied' or 'secured in advance'; the verb suggests strategic seizure of the water sources.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 암몬 자손들의 진영이 떠났고, 그들과 함께 앗수르 자손 오천 명이 있었으며, 그들은 골짜기[a]에 진을 치고 이스라엘 자손들의 물과 물샘들[b]을 선점하였습니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 αὐλών은 여기서 건축물의 ‘뜰’이 아니라 골짜기, 함몰지, 협곡 또는 둘러싸인 평지를 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘물과 물샘들’은 그리스어의 복수 표현을 반영합니다. 물 자체와 그 물의 근원인 샘들을 함께 가리킵니다.
    reason: source_note
  - marker: c
    text: 그리스어 προκατελάβοντο는 단순히 차지했다는 뜻보다 먼저 점거하여 전략적으로 장악했다는 뉘앙스를 지닙니다.
    reason: lexical_alternative
