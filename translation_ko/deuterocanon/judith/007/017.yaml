  lexicon: LSJ
  rationale: αὐλών은 이 군사·지형 문맥에서 건축물의 '뜰'이 아니라 골짜기, 함몰지, 협곡을 뜻하므로 '골짜기'로 옮기고, 군사적 설치를 '진을 치다'로 표현했습니다.
- source_word: προκατελάβοντο τὰ ὕδατα καὶ τὰς πηγὰς τῶν ὑδάτων
  english_pob_choice: seized the waters and the springs of water
  chosen_korean: 물과 물샘들을 점거하였습니다
  alternatives_korean:
  - 물과 물샘들을 점거하였습니다
  - 물과 물샘들을 차지하였습니다
  - 물과 물샘들을 먼저 점령하였습니다
  lexicon: LSJ
  rationale: προκατελάβοντο는 단순 점유보다 전략적으로 선점하여 장악하는 뜻이 강하므로 '점거하다'를 택해 군사적 성격을 드러냈습니다. '물'과 '물샘들'은 원문의 중복 표현을 살려 수자원과 그 근원을 함께 보존했습니다.
theological_decisions:
- issue: 민족 표지의 직역성 유지
  chosen_reading: '''암몬 자손'', ''아슈르 자손''으로 옮겨 원문의 ''sons of ...'' 구조를 보존했습니다.'
  alternative_readings:
  - '''암몬 사람들'', ''앗수르 사람들'''
  rationale: 이 구절은 이스라엘 자손과 병렬을 이루는 민족-혈통 표지를 반복하므로, 통상적 민족명보다 원문 구조가 드러나는 표현이 본문 이해에 더 중요합니다.
  doctrine_reference: 본문의 서술 구조와 민족 정체성 표지
