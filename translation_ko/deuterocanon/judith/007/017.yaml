  naturalness: 현행 문장은 이해 가능하지만 ‘암몬 자손의 진영’보다 복수 수식 관계를 드러내는 ‘암몬 자손들의 진영’이 자연스럽습니다. ‘물과 물샘들’은 원문의 반복을 보존하면서도 자연스럽지만, 각주 표지는 해당 어구에 직접 붙이는 편이 낫습니다.
