  - 앗수르 자손
  lexicon: LSJ
  rationale: 본문의 반복 구조인 '자손' 표현을 살려 원문의 친족-민족적 병렬을 유지했습니다. 영어 POB의 개정 방향이 'sons of Asshur' 쪽으로 돌아온 점도 반영했습니다.
- source_word: παρενέβαλον ἐν τῷ αὐλῶνι
  english_pob_choice: encamped in the valley
  chosen_korean: 골짜기에 진을 치고
  alternatives_korean:
  - 골짜기에 진을 치고
  - 골짜기에 진을 쳤으며
