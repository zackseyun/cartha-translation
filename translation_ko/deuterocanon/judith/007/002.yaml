translation:
  language: ko
  text: 그리고 그날, 그들의 모든 용사들이 진을 거두었습니다[a]. 전사들로 이루어진 그들의 병력은 보병 십칠만 명과 기병 만 이천 명이었으며, 그들 가운데 도보로 있던 사람들의 짐은 제외하고도 매우 큰 무리였습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘출발했습니다’, ‘진군했습니다’.
    reason: lexical_alternative
  - marker: b
    text: 그리스어의 ‘그들 가운데 도보로 있던 사람들의 짐’이라는 표현은 문법적 연결이 난해합니다. 앞서 셈한 전투 병력과 별도로, 짐 및 그것과 관련된 도보 동행자들의 매우 많은 무리를 가리킬 수 있습니다.
    reason: textual_variant
