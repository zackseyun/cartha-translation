  text: 그리고 그날에 그들의 모든 용사들이 진을 거두었습니다[a]. 그들의 전투력은 보병 십칠만 명과 기병 만이천 명이었고, 그들 가운데 함께 있던 보행자들의 행장까지 더하면, 매우 큰 무리였습니다[b].
  philosophy: optimal-equivalence
