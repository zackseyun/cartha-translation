  source_fidelity: 초안은 δόρασιν을 ‘창’으로, πέποιθαν을 ‘의지하다’로, 그리고 지형적 방어의 대조를 보존한 점에서 대체로 충실합니다. 그러나 ἐν οἷς αὐτοὶ ἐνοικοῦσιν ἐν αὐτοῖς의 관계절을 독립된 인과절(‘…때문입니다’)로 바꾸어 원문의 문장 관계를 변경했고, προσβῆναι의 ‘다가가다/오르다’라는 한 동작을 ‘올라가 접근하다’로 중복 번역했습니다.
  naturalness: ‘자기들의 산들의 높이’는 현대 표준어로 부자연스럽고, ‘산꼭대기에 올라가 접근하다’도 의미가 중복됩니다. ‘자기들의 산의 높은 곳’ 및 ‘산 정상에 오르기’가 자연스럽고 원문에 가깝습니다. 원문의 관계절과 이유절의 구분도 문장 구조에서 드러내는 것이 좋습니다.
  terminology: ‘백성’, ‘창’, ‘의지하다’, ‘산 정상’은 적절합니다. υἱῶν Ἰσραήλ은 원문의 남성 복수 표현을 보존하여 ‘이스라엘의 아들들’로 유지할 수 있으나, 한국어에서는 다소 직역투이므로 각주로 전통적 ‘이스라엘 자손’이라는 대안을 제시하는 것이 적절합니다.
