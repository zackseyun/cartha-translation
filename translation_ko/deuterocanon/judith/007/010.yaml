  yaml_path: translation/deuterocanon/judith/007/010.yaml
  text: For this people[a], the sons of Israel, do not rely on their spears, but on the heights of their mountains, in which they themselves dwell[b]; for it is not easy to approach the summits of their mountains.
  footnotes:
  - marker: a
    text: Or 'children of Israel' or 'Israelites.' The Greek reads literally 'sons of Israel.'
    reason: lexical_alternative
  - marker: b
    text: Or 'to go up to the summits of their mountains.' The Greek verb can carry the sense of moving up toward elevated ground.
    reason: lexical_alternative
translation:
  language: ko
  text: 이 백성, 곧 이스라엘의 아들들은 자기들의 창에 의지하지 않고, 그들 자신이 그곳에 살고 있는 자기들의 산의 높은 곳에 의지합니다.[a] 그들의 산 정상에 오르기는 쉽지 않기 때문입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이스라엘의 아들들’은 그리스어 υἱῶν Ἰσραήλ을 가깝게 옮긴 표현입니다. 전통적으로는 ‘이스라엘 자손’이라고도 합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘오르기’로 옮긴 그리스어 προσβῆναι는 ‘다가가다’ 또는 ‘접근하다’로도 번역될 수 있습니다. 여기서는 산 정상이라는 문맥상 올라가는 뜻이 두드러집니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ γὰρ λαὸς οὗτος
  english_pob_choice: For this people
  chosen_korean: 이 백성
  alternatives_korean:
  - 이 사람들
  - 이 민족
  lexicon: LEH
  rationale: λαός는 여기서 집단 전체를 가리키는 말이므로, 군사 담화의 흐름에 맞는 자연스러운 집합명사인 '백성'으로 옮겼습니다.
- source_word: τῶν υἱῶν Ἰσραήλ
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘의 아들들
  alternatives_korean:
  - 이스라엘의 자녀들
  - 이스라엘 사람들
  lexicon: LEH
  rationale: 그리스어의 직설적인 표현을 살려 '아들들'을 유지했고, 전통적 관용보다 원문 구조를 더 가깝게 반영했습니다.
- source_word: οὐ πέποιθαν ἐπὶ τοῖς δόρασιν αὐτῶν
  english_pob_choice: do not rely on their spears
  chosen_korean: 자기들의 창에 의지하지 않고
  alternatives_korean:
  - 자기들의 창을 신뢰하지 않고
  - 자기들의 무기에 의지하지 않고
  lexicon: BDAG
  rationale: πέποιθαν의 지속적 신뢰/의탁의 뉘앙스를 '의지하다'로 살렸고, δόρασιν은 일반 무기보다 구체적인 '창'으로 옮겼습니다.
- source_word: ἀλλʼ ἐπὶ τοῖς ὕψεσι τῶν ὀρέων αὐτῶν
  english_pob_choice: but on the heights of their mountains
  chosen_korean: 자기들의 산들의 높이에 의지합니다
  alternatives_korean:
  - 자기들의 산의 높은 곳에 의지합니다
  - 자기들의 산마루에 의지합니다
  lexicon: LEH
  rationale: ὕψεσι의 '높은 곳/높이'라는 감각을 유지하면서, 앞의 '의지하다'와 문법적으로 자연스럽게 연결했습니다.
- source_word: οὐ γὰρ ἔστιν εὐχερὲς προσβῆναι
  english_pob_choice: for it is not easy to approach
  chosen_korean: 또한 그들의 산꼭대기에 올라가 접근하는 일은 쉽지 않습니다
  alternatives_korean:
  - 그들의 산꼭대기에 다가가는 일은 쉽지 않습니다
  - 그들의 산꼭대기로 올라가는 일은 쉽지 않습니다
  lexicon: LEH
  rationale: εὐχερές와 προσβῆναι의 의미를 함께 살려, 접근의 난점과 '올라감'의 방향성을 모두 드러냈습니다.
theological_decisions:
- issue: 본문의 군사적 대비를 어떻게 한국어로 살릴 것인가
  chosen_reading: '''창에 의지하지 않고''와 ''산들의 높이에 의지합니다''의 대비를 그대로 유지했습니다.'
  alternative_readings:
  - '''무기에 의지하지 않고''로 일반화함'
