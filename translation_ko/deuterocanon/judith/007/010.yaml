  rationale: 유디트의 발화는 이스라엘의 지형적 방어와 군사적 자만/의탁의 대비를 말하므로, 구체적 무기와 지형을 보존하는 편이 원문 의도를 더 잘 드러냅니다.
  doctrine_reference: 문맥 주해 원칙
