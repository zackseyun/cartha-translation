base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/007/025.yaml
  text: And now there is no one to help us[a]; rather, God has delivered us into their hands[c][b], to be laid low before them in thirst and great destruction.
  footnotes:
  - marker: a
    text: Or 'has handed us over into their hands.' The Greek verb literally means 'has sold,' a stronger metaphor of being given over to enemy power.
    reason: lexical_alternative
  - marker: b
    text: Or 'to be overthrown before them' or 'to be struck down before them.'
    reason: lexical_alternative
  - marker: c
    text: The phrase 'in thirst and great destruction' may also be understood as 'by thirst and great ruin,' describing the means or condition of their downfall.
    reason: lexical_alternative
translation:
  language: ko
  text: 이제는 우리를 도와줄 이가 없습니다. 오히려 하나님께서 우리를 그들의 손에 팔아 넘기셨으니, 그들 앞에서 목마름과 큰 파멸 가운데 엎드러지게 하시려는 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘팔아 넘기셨다’는 그리스어 πέπρακεν의 직역적 뉘앙스를 살린 것으로, 단순히 ‘넘겨주셨다’보다 더 강한 인계·종속의 비유입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘엎드러지게 하시려는 것입니다’는 ‘to be laid low’에 해당하며, ‘뒤엎어지다’나 ‘쳐부수다’보다 굴욕적 패배를 강조합니다.
    reason: lexical_alternative
  - marker: c
    text: ‘목마름과 큰 파멸 가운데’는 전치사 ἐν의 상황·수단 의미를 반영한 표현으로, ‘목마름으로’ 또는 ‘목마름 때문에’로도 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἔστιν ὁ βοηθὸς ἡμῶν
  english_pob_choice: there is no one to help us
  chosen_korean: 우리를 도와줄 이가 없습니다
  alternatives_korean:
  - 우리의 도우미가 없습니다
  - 우리를 도울 사람이 없습니다
  lexicon: BDAG
  rationale: 보조적 의미의 βοηθός를 한국어의 자연스러운 인칭 표현으로 옮겨, 단순한 ‘도움’이 아니라 ‘도와줄 사람/이’의 부재를 드러냈습니다.
- source_word: πέπρακεν
  english_pob_choice: has sold
  chosen_korean: 팔아 넘기셨으니
  alternatives_korean:
  - 넘겨주셨으니
  - 내어주셨으니
  lexicon: LSJ
  rationale: πράσκω의 강한 상거래적 비유를 살려 ‘팔아 넘기다’로 옮겨, 단순한 인도나 허용보다 더 강한 인계의 뉘앙스를 유지했습니다.
- source_word: εἰς τὰς χεῖρας αὐτῶν
  english_pob_choice: into their hands
  chosen_korean: 그들의 손에
  alternatives_korean:
  - 그들의 권세에
  - 그들의 힘 아래에
  lexicon: BDAG
  rationale: 히브리적·헬라적 관용구를 그대로 살려 ‘손에’로 옮겨, 적대자의 통제 아래 놓였다는 이미지를 보존했습니다.
- source_word: τοῦ καταστρωθῆναι ἐναντίον αὐτῶν ἐν δίψει καὶ ἀπωλείᾳ μεγάλῃ
  english_pob_choice: to be laid low before them in thirst and great destruction
  chosen_korean: 그들 앞에서 목마름과 큰 파멸 가운데 엎드러지게 하시려는 것입니다
  alternatives_korean:
  - 그들 앞에서 목마름과 큰 파멸 속에 쓰러지게 하시려는 것입니다
  - 그들 앞에서 목마름과 큰 멸망 가운데 낮추어지게 하시려는 것입니다
  lexicon: LSJ
  rationale: καταστρωννύω 계열의 결과·목적 용법을 ‘엎드러지게 하다’로 옮겨 굴욕적 패배를 드러냈고, ἐν δίψει καὶ ἀπωλείᾳ μεγάλῃ는 ‘목마름과 큰 파멸 가운데’로 압축해 원문의 병렬 구조를 살렸습니다.
