  text: 그리고 에서우의 아들들의 모든 통치자들과 모압 백성의 모든 지도자들과 해안 지역의 군 지휘관들이 그에게 와서 말했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄρχοντες
  english_pob_choice: rulers
  chosen_korean: 통치자들
  alternatives_korean:
  - 군주들
  - 지도자들
  - 지배자들
  lexicon: BDAG
  rationale: ἄρχοντες는 단순한 지도자보다 권력과 통치의 성격이 더 분명하므로, ‘통치자들’로 옮겨 영어 POB의 ‘rulers’와 대응시켰습니다.
- source_word: υἱῶν Ἠσαῦ
  english_pob_choice: the sons of Esau
  chosen_korean: 에서우의 아들들
  alternatives_korean:
  - 에돔 사람들
  - 에서우 자손들
  lexicon: BDAG
  rationale: 그리스어의 직역 구조를 살려 족속 표지를 그대로 유지했습니다. ‘에돔 사람들’은 해석적 대응이므로 본문에는 두지 않았습니다.
- source_word: ἡγούμενοι
  english_pob_choice: leaders
  chosen_korean: 지도자들
  alternatives_korean:
  - 주관자들
  - 통솔자들
  - 인도자들
  lexicon: BDAG
  rationale: 앞의 ἄρχοντες와 같은 말로 겹치지 않도록, 보다 일반적인 ‘지도자들’로 옮겨 두 직분의 구분을 유지했습니다.
- source_word: στρατηγοὶ τῆς παραλίας
  english_pob_choice: generals of the seacoast
  chosen_korean: 해안 지역의 군 지휘관들
  alternatives_korean:
  - 해안의 장군들
  - 해안 지방의 군사령관들
  lexicon: LSJ
  rationale: στρατηγοί의 군사적 직함을 살리면서도, τῆς παραλίας를 단순 지형이 아니라 관할 지역으로 이해해 ‘해안 지역’으로 자연스럽게 풀었습니다.
