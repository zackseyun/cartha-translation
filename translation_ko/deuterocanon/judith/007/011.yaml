translation:
  language: ko
  text: 그리고 이제, 주인이시여, 그들과 맞서 전열을 갖춘 전투를 치르듯이 싸우지 마십시오. 그러면 당신의 백성 가운데 한 사람도 쓰러지지 않을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘전열을 갖춘 전투가 벌어질 때처럼’. 그리스어 표현은 진형을 갖춘 통상적 전투를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: δέσποτα
  english_pob_choice: master
  chosen_korean: 주인이시여
  alternatives_korean:
  - 주인님
  - 상전이시여
  - 주군이시여
  lexicon: BDAG
  rationale: δέσποτα는 κύριος와 구별되는 직접 호칭이므로, 인간 상급자에게 쓰는 공손한 호격인 ‘주인이시여’로 옮겨 구분을 살렸습니다.
- source_word: μὴ πολέμει πρὸς αὐτούς
  english_pob_choice: do not fight against them
  chosen_korean: 그들과 맞서 … 싸우지 마십시오
  alternatives_korean:
  - 그들과 싸우지 마십시오
  - 그들과 전쟁하지 마십시오
  - 그들을 상대로 싸우지 마십시오
  lexicon: LSJ
  rationale: πολεμέω의 금지 명령을 현대 한국어로 자연스럽게 살리기 위해 ‘맞서 … 싸우다’로 옮겼고, 단순한 충돌이 아닌 적대적 교전을 드러냈습니다.
- source_word: καθὼς γίνεται πόλεμος παρατάξεως
  english_pob_choice: as in a pitched battle
  chosen_korean: 전열을 갖춘 전투를 치르듯이
  alternatives_korean:
  - 전열을 갖춘 전투처럼
  - 진형을 갖춘 전투처럼
  - 조우전처럼
  lexicon: LSJ
  rationale: παράταξις는 ‘전열/진형을 갖춘 배치’를 가리키므로, 영어 POB의 ‘pitched battle’에 맞추되 군사적 형상은 유지하도록 ‘전열을 갖춘 전투’로 옮겼습니다.
- source_word: οὐ πεσεῖται ἐκ τοῦ λαοῦ σου ἀνὴρ εἷς
  english_pob_choice: not one man from your people will fall
  chosen_korean: 당신의 백성 가운데 한 사람도 쓰러지지 않을 것입니다
  alternatives_korean:
  - 당신의 백성 가운데 한 사람도 죽지 않을 것입니다
  - 당신의 백성 가운데 한 사람도 넘어지지 않을 것입니다
  - 당신의 백성 가운데 한 남자도 쓰러지지 않을 것입니다
  lexicon: BDAG
  rationale: πίπτω의 군사적 용법을 살리면서도 결과를 지나치게 단정하지 않기 위해 ‘쓰러지다’로 옮겼고, ἀνὴρ εἷς의 수사적 강조는 한국어에서 자연스러운 ‘한 사람도’로 반영했습니다.
theological_decisions:
- issue: 인간 상급자 호칭 δέσποτα의 어조
  chosen_reading: ‘주인이시여’로 공손한 직접 호칭을 유지하되, 신적 호칭과 섞지 않았습니다.
  alternative_readings:
  - 주님이시여
  - 주군이시여
  rationale: 이 장면의 청원자는 인간 지도자에게 말하고 있으므로, κύριος 계열의 ‘주님’보다 δέσποτα의 지배/소유 관계를 드러내는 공손한 호칭이 더 적절합니다.
  doctrine_reference: 'DOCTRINE.md: Translate titles; distinguish human and divine address'
