    issue: 접속사 καὶ의 의미를 ‘그러면’으로 옮김
    rationale: 원문은 ‘그리고/또한 … 한 사람도 쓰러지지 않을 것입니다’라고 접속할 뿐, 조건절의 결과를 문법적으로 표지하지 않습니다. ‘그러면’은 전략의 결과라는 해석을 본문에 더합니다.
  - severity: low
    issue: 각주 표지가 관련 어구에서 떨어져 있음
    rationale: 각주는 καθὼς γίνεται πόλεμος παρατάξεως의 번역 대안을 설명하므로, 문장 끝보다 ‘전열을 갖춘 전투를 치르듯이’에 붙이는 편이 앵커가 분명합니다.
