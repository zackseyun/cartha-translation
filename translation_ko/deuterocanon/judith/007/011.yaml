  source_fidelity: 대체로 충실합니다. δέσποτα, 전열을 갖춘 전투, ‘한 사람도 … 쓰러지지 않을 것’은 그리스어의 호칭, 군사적 대비, 부정 강조를 적절히 반영합니다. 다만 καὶ οὐ πεσεῖται는 단순 접속으로 이어지는데, 초안의 ‘그러면’은 조건·결과 관계를 명시적으로 강화합니다.
  naturalness: 현대 표준어 합쇼체로 자연스럽습니다. ‘전열을 갖춘 전투를 치르듯이 싸우다’는 다소 중첩되지만 의미가 명료하며 허용됩니다.
  terminology: ‘주인이시여’는 인간 상급자를 향한 δέσποτα를 ‘주님’과 구별하는 번역으로 가능하며, 본문 문맥에도 맞습니다. ‘쓰러지다’는 전사(戰死)를 단정하지 않고 πίπτω의 군사적 비유를 보존합니다.
  issues:
