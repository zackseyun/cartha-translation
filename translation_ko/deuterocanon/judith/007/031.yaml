  text: But if these days pass and no help comes upon us, I will do according to your words.
translation:
  language: ko
  text: 그러나 이 날들이 지나도 우리에게 도움이 오지 않으면, 나는 여러분의 말대로 하겠습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐὰν δὲ διέλθωσιν αὗται
  english_pob_choice: But if these days pass
  chosen_korean: 그러나 이 날들이 지나도
  alternatives_korean:
  - 그러나 이 날들이 흘러가도
  - 그런데 이 날들이 지나가도
  lexicon: ἐὰν + διέλθωσιν + αὗται
  rationale: 조건절의 시간 경과를 자연스럽게 살리되, 직역보다 한국어 흐름에 맞는 ‘지나도’로 간결하게 옮겼습니다.
- source_word: μὴ ἔλθῃ ἐφʼ ἡμᾶς βοήθεια
  english_pob_choice: no help comes upon us
  chosen_korean: 우리에게 도움이 오지 않으면
  alternatives_korean:
  - 우리에게 도움이 닥치지 않으면
  - 우리를 도울 도움이 오지 않으면
  lexicon: βοήθεια
  rationale: POB의 ‘upon us’를 반영해 도움이 우리 쪽에 ‘오다’라는 이동 표현으로 옮기고, 위기 상황의 절박함을 유지했습니다.
- source_word: ποιήσω κατὰ τὰ ῥήματα ὑμῶν
  english_pob_choice: I will do according to your words
  chosen_korean: 나는 여러분의 말대로 하겠습니다
  alternatives_korean:
  - 나는 여러분의 말에 따라 행동하겠습니다
  - 나는 여러분의 말대로 따르겠습니다
  lexicon: ποιήσω κατὰ τὰ ῥήματα ὑμῶν
  rationale: 히브리식/헬라어식 ‘말들’(ῥήματα)을 한국어에서 자연스러운 ‘말’로 옮기되, 맹세적 순응의 의미를 ‘말대로 하겠습니다’로 보존했습니다.
theological_decisions:
- issue: 보조 요청(βοήθεια)의 방향성과 위기성
  chosen_reading: ‘도움이 오지 않으면’으로 번역해, 도움이 화자에게 ‘임하는’ 상황을 드러냈습니다.
  alternative_readings:
  - ‘우리를 돕는 이가 오지 않으면’
  - ‘도움이 우리 위에 임하지 않으면’
  rationale: 본문의 ἐφʼ ἡμᾶς를 단순 소유가 아니라 위협 속에 닥치는 도움의 도착으로 이해하는 것이 POB의 ‘comes upon us’와 부합합니다.
  doctrine_reference: 본문 의미 보존 및 서사 맥락의 위기감 유지
- issue: 직접 화법의 결심 표현
  chosen_reading: ‘나는 여러분의 말대로 하겠습니다’로, 조건 성취 시의 결심을 분명한 1인칭 약속 형태로 옮겼습니다.
  alternative_readings:
  - ‘여러분의 말에 따라 하겠습니다’
  - ‘여러분이 말한 대로 하겠습니다’
  rationale: 헬라어 미래형 ποιήσω의 단호한 결의와 상대방 발화에 대한 종속을 한국어에서 가장 자연스럽게 나타냅니다.
  doctrine_reference: 서사적 화행의 보존
