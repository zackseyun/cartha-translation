translation:
  language: ko
  text: 이스라엘의 아들들이 자기들의 하나님 주님께 부르짖었습니다. 그들의 영이 기가 꺾였기 때문입니다. 곧 그들의 모든 원수들이 그들을 에워쌌고, 그들 가운데서 피할 길이 없었기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘이스라엘의 아들들’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들의 영이 낙심하였다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ υἱοὶ Ἰσραήλ
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘의 아들들
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘 자손
  lexicon: LSJ
  rationale: 그리스어의 직역적 가족 표현을 살리되 한국어에서 자연스럽게 읽히도록 ‘이스라엘의 아들들’로 옮겼습니다. ‘이스라엘 자손’은 전통적이지만, 여기서는 POB의 source-transparent 원칙에 맞춰 더 직접적인 표현을 택했습니다.
- source_word: ὠλιγοψύχησεν τὸ πνεῦμα αὐτῶν
  english_pob_choice: their spirit had grown faint
  chosen_korean: 그들의 영이 기가 꺾였기 때문입니다
  alternatives_korean:
  - 그들의 영이 약해졌기 때문입니다
  - 그들의 마음이 낙심했기 때문입니다
  - 그들의 기운이 빠졌기 때문입니다
  lexicon: LSJ
  rationale: 원문은 ‘영’(πνεῦμα)이 낙담 상태에 이르렀음을 말하므로, 단순한 감정 묘사보다 ‘영이 기가 꺾이다’가 원문의 비유를 비교적 직접적으로 반영합니다.
- source_word: Κύριον θεὸν αὐτῶν
  english_pob_choice: the Lord their God
  chosen_korean: 자기들의 하나님 주님
  alternatives_korean:
  - 그들의 주 하나님
  - 자기들의 주 하나님
  lexicon: LSJ
  rationale: κύριος를 주(主)/주님으로, θεός를 하나님으로 옮겨 관계를 유지했습니다. ‘하나님 주님’은 원문의 호칭 결합을 보존하면서도 한국어에서 기도/부르짖음 문맥에 자연스럽습니다.
- source_word: οὐκ ἦν διαφυγεῖν ἐκ μέσου αὐτῶν
  english_pob_choice: there was no escape from among them
  chosen_korean: 그들 가운데서 피할 길이 없었습니다
  alternatives_korean:
  - 그들 가운데서 도망할 수 없었습니다
  - 그들 가운데서 빠져나갈 길이 없었습니다
  - 그들 가운데서 도피할 수 없었습니다
  lexicon: LSJ
  rationale: 무정칭 표현을 한국어의 자연스러운 가능/불가능 진술로 풀었습니다. ‘피할 길’은 단순한 탈출 가능성의 부재와 포위 상황의 절박함을 함께 전달합니다.
theological_decisions:
- issue: ‘주님’과 ‘하나님’의 병렬 호칭
  chosen_reading: ‘자기들의 하나님 주님’으로 옮겨, 하나님께 대한 직접 부르짖음의 호칭 결합을 유지했습니다.
  alternative_readings:
  - ‘그들의 주 하나님’
  - ‘주 하나님’
  rationale: 원문은 κύριον θεὸν αὐτῶν으로 호칭을 겹쳐 사용합니다. 이를 하나로 평준화하면 절박한 기도적 호소의 밀도가 줄어들 수 있어, 두 호칭을 모두 드러내는 쪽을 택했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: κύριος → 주님 / Θεός → 하나님'
- issue: οἱ υἱοὶ Ἰσραήλ의 집합 명칭
  chosen_reading: ‘이스라엘의 아들들’로 유지해, 원문의 남성-가족적 표현을 그대로 드러냈습니다.
  alternative_readings:
  - ‘이스라엘 사람들’
  - ‘이스라엘 자손’
  rationale: 원문이 사용하는 표현의 성격을 지우지 않는 것이 source-grounded 원칙에 더 부합합니다. 이 문맥에서는 집합명사로 완화하기보다 직역적 표현이 더 충실합니다.
  doctrine_reference: DOCTRINE.md §4 Gender-accurate over gender-neutral
