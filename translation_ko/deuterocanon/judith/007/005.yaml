  source_fidelity: 그리스어의 행위 순서와 밤새 지속된 경계는 대체로 충실히 반영했습니다. 다만 τὰ σκεύη τὰ πολεμικά는 무기에만 한정되지 않을 수 있는 군사 장비 전반을 뜻하므로 ‘전쟁 무기’보다 ‘전투 장비’가 원문의 범위를 더 잘 보존합니다.
  naturalness: ‘자기 망루들’과 ‘파수하며 머물렀습니다’는 현대 표준 한국어에서 다소 어색합니다. ‘그들의 탑들’ 및 ‘계속 경계를 서고 있었습니다’가 합쇼체 서술문으로 더 자연스럽습니다.
  terminology: ‘전투 장비’는 σκεύη의 포괄성을 유지하며 군사 맥락을 분명히 합니다. πύργους는 본문상 특정 구조의 기능을 과도하게 해석하지 않고 ‘탑들’로 옮기는 것이 안전합니다.
