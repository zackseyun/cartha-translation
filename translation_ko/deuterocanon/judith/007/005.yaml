    rationale: ‘자기’가 복수 소유 대상과 결합한 표현은 어색하며, πύργοι를 ‘망루’로 특정하면 구조의 성격을 다소 좁힐 수 있습니다. 또한 ‘파수하며 머물렀습니다’보다 ‘계속 경계를 서고 있었습니다’가 지속적 경계 상태를 자연스럽게 나타냅니다.
