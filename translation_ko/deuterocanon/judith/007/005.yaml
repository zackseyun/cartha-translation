lexical_decisions:
- source_word: ἀναλαβόντες
  english_pob_choice: took up
  chosen_korean: 집어 들고
  alternatives_korean:
  - 들고
  - 챙기고
  lexicon: BDAG
  rationale: 준비 동작을 나타내는 분사로 보아, 전투 태세를 자연스럽게 드러내는 ‘집어 들고’로 옮겼습니다.
- source_word: τὰ σκεύη τὰ πολεμικὰ
  english_pob_choice: weapons of war
  chosen_korean: 전쟁 무기
  alternatives_korean:
  - 전투 장비
  - 무기
  lexicon: LSJ
  rationale: σκευή와 πολεμικά의 결합은 단순한 장비보다 군사적 무기를 가리키므로, 전쟁 성격을 살려 ‘전쟁 무기’로 옮겼습니다.
- source_word: ἀνακαύσαντες πυράς
  english_pob_choice: after kindling fires
  chosen_korean: 불을 피운 뒤
  alternatives_korean:
  - 불을 지핀 뒤
  - 횃불을 밝힌 뒤
  lexicon: LSJ
  rationale: 앞선 행위가 뒤의 주절보다 먼저 일어난다는 점을 살려, 한국어에서는 자연스러운 ‘-한 뒤’ 구조로 순서를 표시했습니다.
- source_word: ἔμενον φυλάσσοντες
  english_pob_choice: they remained on guard
  chosen_korean: 파수하며 머물렀습니다
  alternatives_korean:
  - 경계하며 있었습니다
  - 지키며 있었습니다
  lexicon: BDAG
  rationale: 계속되는 경계 상태를 나타내므로, ‘머물렀습니다’와 ‘파수하며’를 함께 써서 지속성과 경계의 동작을 모두 드러냈습니다.
theological_decisions:
- issue: 밤새 경계하는 군사적 묘사의 어조
  chosen_reading: 서술을 평이하게 유지해, 본문이 강조하는 긴박한 경계 태세를 직접 전달했습니다.
  alternative_readings:
  - 의역하여 ‘밤새도록 철통같이 지켰습니다’처럼 강화하는 방법
  rationale: 본문 자체가 이미 충분히 강한 군사적 긴장감을 담고 있으므로, 과장하지 않고 원문의 상태 서술을 보존하는 편이 더 적절합니다.
