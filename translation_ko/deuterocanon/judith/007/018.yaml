base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/007/018.yaml
  text: And the sons of Esau and the sons of Ammon went up and camped in the hill country opposite Dothaim[a], and they sent some of their men toward the south and east, opposite Egrebel, which is near Chous, which is on the wadi Mochmour. And the rest of the Assyrian army camped on the plain and covered the whole face of the land, and their tents and their baggage were encamped in a very great multitude[b], and they were exceedingly numerous.
  footnotes:
  - marker: a
    text: Or 'toward the south and toward the sunrise'; the Greek term for 'east' is literally related to the rising sun.
    reason: lexical_alternative
  - marker: b
    text: '''Wadi'' renders a Greek term for a seasonal torrent-bed or stream; alternatively ''brook'' or ''torrent.'''
    reason: cultural_note
translation:
  language: ko
  text: 그리고 에사우의 자손들과 암몬의 자손들이 올라와서 도타임 맞은편의 산지에 진을 쳤고[a], 그들 중 일부를 남쪽과 동쪽으로, 곧 에그레벨 맞은편에 있는, 초우스 근처의 모흐무르 시내 가에 보냈습니다. 그리고 남은 앗수르 군대는 평지에 진을 쳐서 땅의 온 얼굴을 덮었으며, 그들의 장막과 보급품도[b] 매우 큰 무리 가운데 진을 쳤고, 그 수는 매우 많았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘남쪽과 해 돋는 쪽으로’; 여기서 ‘동쪽’에 해당하는 그리스어는 문자적으로 해가 뜨는 방향과 관련됩니다.
    reason: lexical_alternative
  - marker: b
    text: ‘시내’는 계절성 물줄기나 하천 바닥을 가리키는 그리스어를 옮긴 것입니다. 달리 ‘개울’ 또는 ‘시내’로도 옮길 수 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: ἀνέβησαν
  english_pob_choice: went up
  chosen_korean: 올라와서
  alternatives_korean:
  - 올라갔고
  - 진군했고
  lexicon: LSJ
  rationale: 지형의 상승을 함께 드러내는 기본 의미를 살려 ‘올라와서’로 옮겼습니다. 군사적 이동이지만, 본문이 곧바로 산지에 위치를 밝히므로 과도하게 군사 용어로 좁히지 않았습니다.
- source_word: ἐν τῷ ὄρει
  english_pob_choice: in the hill country
  chosen_korean: 산지에
  alternatives_korean:
  - 산에
  - 산악 지대에
  lexicon: LSJ
  rationale: 단수 형식이지만 한 산봉우리보다 산악 지대를 가리키는 문맥이므로 ‘산지’가 가장 자연스럽고 정확합니다.
- source_word: ἀπέναντι Δωθαείμ
  english_pob_choice: opposite Dothaim
  chosen_korean: 도타임 맞은편의
  alternatives_korean:
  - 도타임 맞은편의
  - 도타임 건너편의
  lexicon: LSJ
  rationale: ἀπέναντι의 위치 관계를 그대로 살려 ‘맞은편의’로 옮겼습니다. 지리적 대조를 간결하게 드러냅니다.
- source_word: ἀπέστειλαν ἐξ αὐτῶν
  english_pob_choice: they sent some of their men
  chosen_korean: 그들 중 일부를 … 보냈습니다
  alternatives_korean:
  - 그들 중 일부를 보냈습니다
  - 그들 가운데 일부를 파견했습니다
  lexicon: LSJ
  rationale: 직역하면 ‘그들 가운데서’이지만, 문맥상 군사 분견대를 뜻하므로 한국어에서는 ‘그들 중 일부’를 택해 의미를 명확히 했습니다.
- source_word: πρὸς νότον καὶ ἀπηλιώτην
  english_pob_choice: toward the south and east
  chosen_korean: 남쪽과 동쪽으로
  alternatives_korean:
  - 남쪽과 해 돋는 쪽으로
  - 남쪽과 일출 방향으로
  lexicon: LSJ
  rationale: ἀπηλιώτης는 문자적으로 해 뜨는 쪽과 연결된 동쪽 방향이므로, 현대 한국어에서는 지리적 의미를 분명히 하는 ‘동쪽’이 적절합니다.
- source_word: χειμάρρου
  english_pob_choice: wadi
  chosen_korean: 시내 가
  alternatives_korean:
  - 와디
  - 개울
  lexicon: LSJ
  rationale: 근동 지명의 지형을 가리키는 계절성 물줄기라는 점을 살리면서도, 한국어 본문에서는 낯선 음역어보다 ‘시내 가’가 의미 전달에 유리합니다.
- source_word: ἡ λοιπὴ στρατεία τῶν Ἀσσυρίων
  english_pob_choice: the rest of the Assyrian army
  chosen_korean: 남은 앗수르 군대
  alternatives_korean:
  - 남은 앗수르 군대
  - 나머지 앗수르 군세
  lexicon: LSJ
  rationale: στρατεία는 여기서 군사력/군대를 가리키므로 ‘군대’가 자연스럽습니다. λοιπή는 ‘남은’으로 간단히 옮겼습니다.
- source_word: ἐκάλυψαν πᾶν τὸ πρόσωπον τῆς γῆς
  english_pob_choice: covered the whole face of the land
  chosen_korean: 땅의 온 얼굴을 덮었으며
  alternatives_korean:
  - 땅의 온 얼굴을 덮었으며
  - 온 땅을 덮었으며
  lexicon: LSJ
  rationale: 원문의 생생한 비유인 ‘얼굴’을 보존해, 단순한 ‘온 땅’보다 이미지가 살아나도록 했습니다.
- source_word: ἀποσκευαὶ
  english_pob_choice: baggage
  chosen_korean: 보급품
  alternatives_korean:
  - 짐
  - 군수품
  - 보급 물자
  lexicon: LSJ
  rationale: 문맥상 군대의 장막과 함께 거론되는 이동 보급을 가리키므로, 현대 한국어에서는 ‘보급품’이 가장 전달력이 높습니다.
- source_word: ἐν ὄχλῳ πολλῷ
  english_pob_choice: in a very great multitude
  chosen_korean: 매우 큰 무리 가운데
  alternatives_korean:
  - 매우 큰 무리 가운데
  - 아주 많은 군중 가운데
  lexicon: LSJ
  rationale: ὄχλος의 집합적 다수를 살려 ‘무리’로 옮겼고, πολλῷ를 ‘매우 큰’으로 강화했습니다.
- source_word: ἦσαν εἰς πλῆθος πολὺ σφόδρα
  english_pob_choice: they were exceedingly numerous
  chosen_korean: 그 수는 매우 많았습니다
  alternatives_korean:
  - 그 수는 매우 많았습니다
  - 그들은 지극히 많았습니다
  lexicon: LSJ
  rationale: 반복되는 다수 강조를 한국어에서 자연스럽게 한 번 더 압축해, 수적 규모를 분명히 드러냈습니다.
theological_decisions:
- issue: 지명 및 군사 배열의 시각적·지리적 묘사 유지
  chosen_reading: 본문의 지리 정보와 진영 배치를 직설적으로 유지해, 독자가 전장의 확장과 포위감을 그대로 느끼도록 했습니다.
  alternative_readings:
  - 지명과 방향을 더 일반화하여 읽는 방식
  - 군사적 의미를 약화한 서술 방식
  rationale: 이 절은 신학적 해설보다 전장 배치의 실제성을 보여 주는 데 초점이 있으므로, 지리·군사 묘사를 축소하지 않는 것이 원문 의도에 가깝습니다.
  doctrine_reference: 서사 본문 해석 원칙
- issue: ‘앞서’보다 ‘올라와서’ 선택
  chosen_reading: 상승 동작과 산지 진입을 함께 드러내는 ‘올라와서’를 택했습니다.
  alternative_readings:
  - 진군했고
  - 올라갔고
  rationale: 본문의 첫 동사는 지형적 상승을 포함하므로, 이를 평면적인 군사 진격어로만 바꾸지 않았습니다.
  doctrine_reference: 문맥 우선 번역 원칙
