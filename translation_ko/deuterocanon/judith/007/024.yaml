  rationale: ἀδικίαν μεγάλην의 법적·도덕적 무게를 살리기 위해 ‘불의’를 택했고, 동사는 한국어에서 자연스러운 ‘행하다’로 맞췄습니다.
- source_word: οὐ λαλήσαντες εἰρηνικὰ
  english_pob_choice: by not speaking peaceably
  chosen_korean: 평화롭게 말하지 않았기 때문입니다
