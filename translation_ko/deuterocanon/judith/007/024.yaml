translation:
  language: ko
  text: 하나님께서 여러분과 우리 사이를 판단하시기를 바랍니다. 여러분이 아수르의 자손들과 평화롭게 말하지 않음으로써 우리에게 큰 불의를 저질렀기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘아시리아인들과’. 그리스어는 문자적으로 ‘아수르의 자손들과’라고 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Κρῖναι ὁ θεὸς
