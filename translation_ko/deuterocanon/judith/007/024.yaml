  - 아시리아인들과
  lexicon: LEH
  rationale: 본문의 문자적 표현인 ‘아수르의 자손’을 살리되, 한국어 문맥에서는 ‘~과’로 자연스럽게 연결했습니다. 관습적 민족명으로 바꾸지 않았습니다.
theological_decisions:
- issue: 청원형 판정 표현의 화행
  chosen_reading: ‘하나님께서 … 판단하시기를 바라며’로 옮겨 판정자이신 하나님께 호소하는 말투를 유지했습니다.
  alternative_readings:
  - 직설적으로 ‘하나님께서 … 판단하십니다’
  - 명령형으로 ‘하나님께서 … 판단하소서’
  rationale: 본문은 신학 논설이 아니라 분쟁의 판정을 하나님께 맡기는 호소이므로, 서술형 단정이나 지나치게 강한 명령형보다 원문의 청원적 힘을 보존하는 번역이 적절합니다.
  doctrine_reference: 'DOCTRINE.md: preserve rhetorical force and theological tension without smoothing it away'
