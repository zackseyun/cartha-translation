  naturalness: 개정문은 현대 표준어 합쇼체를 유지하며, ‘젊은 남자들과 여자들과 아이들을 비롯한 온 백성’으로 열거의 포괄 관계를 자연스럽게 나타냅니다. ‘맞서 함께 모여’와 ‘맞서 말했습니다’는 공적 항의 장면을 과도하게 의역하지 않고 전달합니다.
