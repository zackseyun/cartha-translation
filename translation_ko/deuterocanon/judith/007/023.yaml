translation:
  language: ko
  text: 그러자 모든 백성이 오제야와 성읍의 지도자들, 곧 젊은 남자들과 여자들과 아이들에게 모여들어, 큰 소리로 외치며 장로들을 향해 말했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
