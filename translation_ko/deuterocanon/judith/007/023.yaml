  text: And all the people gathered against Oziah and the rulers of the city—the young men[a], the women, and the children—and they cried out with a loud voice and spoke against the elders,
  footnotes:
  - marker: a
    text: Or 'before Oziah and the rulers of the city' if ἐπὶ / ἐναντίον are taken less adversatively; the immediate context of public complaint favors 'against.'
    reason: alternative_reading
translation:
  language: ko
  text: 그러자 젊은 남자들과 여자들과 아이들을 비롯한 온 백성이 오제야와 성읍의 지도자들에게 맞서 함께 모여, 큰 소리로 외치고 장로들에게 맞서 말했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘오제야와 성읍의 지도자들에게 맞서’와 ‘장로들에게 맞서’로 옮긴 표현은 각각 그리스어 ἐπὶ와 ἐναντίον을 대립적으로 이해한 것입니다. 두 표현은 문맥에 따라 ‘오제야와 성읍의 지도자들 앞에’ 및 ‘장로들 앞에서’로도 이해할 수 있으나, 이어지는 공개적 외침과 발화는 항의의 뜻을 뒷받침합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπισυνήχθησαν
  english_pob_choice: gathered
  chosen_korean: 모여들어
  alternatives_korean:
  - 모였습니다
  - 함께 모였습니다
  lexicon: LSJ
  rationale: 집단이 자발적으로 한곳에 모이는 동작을 자연스럽게 살리면서도, 단순한 정적 상태가 아니라 사건의 진행을 드러냅니다.
- source_word: ἐπὶ Ὀζείαν
  english_pob_choice: against Oziah
  chosen_korean: 오제야와
  alternatives_korean:
  - 오제야를 향해
  - 오제야에게
  lexicon: LSJ
  rationale: 본문은 반대·대항의 뉘앙스가 강하지만, 한국어에서는 뒤의 동사들과 함께 긴장을 살리기 위해 목적어적 배열로 두고 문맥 전체에서 대립성을 드러냈습니다.
- source_word: τοὺς ἄρχοντας τῆς πόλεως
  english_pob_choice: the rulers of the city
  chosen_korean: 성읍의 지도자들
  alternatives_korean:
  - 성읍의 통치자들
  - 성읍의 관원들
  lexicon: LSJ
  rationale: ἄρχοντες의 공적 권위는 살리되, 한국어에서 지나치게 제도화된 느낌을 줄 수 있는 '관원'보다 넓고 자연스러운 '지도자들'을 택했습니다.
- source_word: ἐναντίον τῶν πρεσβυτέρων
  english_pob_choice: spoke against the elders
  chosen_korean: 장로들을 향해 말했습니다
  alternatives_korean:
  - 장로들에게 맞서 말했습니다
  - 장로들에게 반대하여 말했습니다
  lexicon: LSJ
  rationale: ἐναντίον은 대립의 방향을 가리키지만, 한국어에서는 직접적인 'against'보다 자연스러운 '향해'로 옮겨, 앞선 '큰 소리로 외치며'와 결합해 공적 항의의 장면을 보존했습니다.
theological_decisions:
- issue: 공적 집단 항의의 뉘앙스
  chosen_reading: 문장을 반항적 군중의 집합과 항의 발화로 읽어, '모여들어… 큰 소리로 외치며'로 긴장을 살렸습니다.
  alternative_readings:
  - 단순한 집회/소집으로 완화하는 읽기
  - 정상적인 의사표시로 중화하는 읽기
  rationale: 문맥상 이는 중립적 모임이 아니라 지도자들을 향한 공개적 불만 표출입니다. 따라서 대립성을 약화하지 않는 방향이 원문 의미에 더 충실합니다.
  doctrine_reference: 서사 문맥 해석
- issue: πᾶς ὁ λαός의 집합성
  chosen_reading: '''모든 백성''으로 공동체 전체의 집합성을 살렸습니다.'
  alternative_readings:
  - '''온 백성'''
  - '''백성 전체'''
  rationale: πᾶς ὁ λαός는 특정 집단의 일부가 아니라 공동체 전체가 움직였음을 강조하므로, 집합적 의미가 분명한 표현이 적절합니다.
  doctrine_reference: 서사 문맥 해석
