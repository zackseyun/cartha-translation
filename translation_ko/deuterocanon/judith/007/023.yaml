    text: ἐπὶ Ὀζείαν은 문맥상 '오제야를 향해' 또는 '오제야 앞에서'로도 읽을 수 있으나, 곧이어 나오는 항의적 발화 때문에 대립적 의미를 본문 본뜻으로 잡았습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπισυνήχθησαν
  english_pob_choice: gathered
  chosen_korean: 모여들어
  alternatives_korean:
  - 모였습니다
  - 함께 모였습니다
  lexicon: LSJ
  rationale: 집단이 자발적으로 한곳에 모이는 동작을 자연스럽게 살리면서도, 단순한 정적 상태가 아니라 사건의 진행을 드러냅니다.
- source_word: ἐπὶ Ὀζείαν
