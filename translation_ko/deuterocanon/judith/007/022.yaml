    rationale: 원문은 γυναῖκες(여자들)와 νεανίσκοι(젊은 남자들)를 나란히 구별합니다. 한국어 ‘젊은이들’은 성별 중립적으로도 읽히므로 ‘젊은 남자들’이 더 충실합니다.
  - severity: low
    issue: ‘목마름 때문에 지쳐 갔습니다’는 표현상 가능하나, 갈증으로 기력이 소진된 뜻을 다소 완곡하고 진행적으로 만듭니다.
    rationale: ἐξέλιπον은 기력이 다하거나 쇠진한 결과를 나타내며, ‘갈증 때문에 기력이 다했습니다’가 문맥과 한국어 관용에 더 잘 맞습니다.
