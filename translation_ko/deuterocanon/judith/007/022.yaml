  source_fidelity: 전반적으로 원문을 충실히 옮겼습니다. 그러나 νεανίσκοι는 앞의 γυναῖκες와 구별되어 남성을 가리키므로, 성별을 포괄할 수 있는 ‘젊은이들’보다 ‘젊은 남자들’이 정확합니다. 또한 ἐξέλιπον은 여기서 갈증으로 기력이 다해 가는 상태를 나타내므로 ‘갈증 때문에 기력이 다했습니다’가 한국어에서 더 직접적입니다.
