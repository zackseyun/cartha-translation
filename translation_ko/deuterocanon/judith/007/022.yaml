base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/007/022.yaml
  text: And their little children lost heart[a], and the women and the young men were failing from thirst, and they were falling in the squares of the city and in the passages of the gates[b], and there was no strength left in them.
  footnotes:
  - marker: a
    text: Or 'their infants became discouraged' or 'their young children grew faint.' The Greek τὰ νήπια can refer to very young children, including infants, and ἠθύμησεν can express discouragement or faintness of spirit.
    reason: lexical_alternative
  - marker: b
    text: Or 'in the broad streets of the city and in the gate passages.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들의 어린아이들은 낙심했고, 여자들과 젊은 남자들은 갈증 때문에 기력이 다했습니다. 그들은 성읍의 광장들과 성문 통로들에서 쓰러졌고, 그들 안에는 더 이상 기력이 남아 있지 않았습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἠθύμησεν
  english_pob_choice: lost heart
  chosen_korean: 낙심했고
  alternatives_korean:
  - 마음이 꺾였고
  - 의기소침했고
  - 기운을 잃었고
  lexicon: LSJ
  rationale: ἀθυμέω 계열의 정서적 무너짐을 살리면서, 단순한 육체적 쇠약으로만 좁히지 않기 위해 표준적이고 자연스러운 ‘낙심하다’를 택했습니다.
- source_word: τὰ νήπια
  english_pob_choice: little children
  chosen_korean: 어린아이들은
  alternatives_korean:
  - 유아들은
  - 어린아이들
  - 어린 자녀들은
  lexicon: LSJ
  rationale: νήπια는 아주 어린 아이들까지 포함할 수 있으나, 문맥상 도시의 위기 속 취약한 아동을 가리키므로 한국어로는 과도하게 좁지 않은 ‘어린아이들’이 적절합니다.
- source_word: ἐξέλιπον ἀπὸ τῆς δίψης
  english_pob_choice: were failing from thirst
  chosen_korean: 목마름 때문에 지쳐 갔습니다
  alternatives_korean:
  - 목마름으로 쇠하여 갔습니다
  - 목마름 때문에 쓰러져 갔습니다
  - 갈증으로 기운이 빠져 갔습니다
  lexicon: LSJ
  rationale: 미완료 과거의 진행성을 살리면서, δίψα를 자연스러운 현대 한국어인 ‘목마름’으로 옮겨 반복적·점진적 쇠약을 드러냈습니다.
- source_word: πλατείαις ... καὶ ἐν ταῖς διόδοις τῶν πυλῶν
  english_pob_choice: in the squares of the city and in the passages of the gates
  chosen_korean: 성읍의 광장들과 성문 통로들에서
  alternatives_korean:
  - 성읍의 넓은 거리들과 성문 통로들에서
  - 성읍의 광장들과 문들 사이의 통로들에서
  - 성읍의 넓은 공터들과 문 어귀들에서
  lexicon: LSJ
  rationale: πλατείαις는 도시의 넓은 공공 공간을 가리키므로 ‘광장들’이 가장 자연스럽고, διόδοις τῶν πυλῶν은 성문과 연결된 통로라는 점을 살려 ‘성문 통로들’로 옮겼습니다.
- source_word: κραταίωσις
  english_pob_choice: strength
  chosen_korean: 힘
  alternatives_korean:
  - 강인함
  - 기력
  - 강함
  lexicon: LSJ
  rationale: 이 문맥에서 κραταίωσις는 버틸 힘을 뜻하므로, 한국어에서는 가장 직접적이고 읽기 쉬운 ‘힘’으로 옮겼습니다.
