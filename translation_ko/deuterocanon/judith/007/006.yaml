  doctrine_reference: 성경 본문의 역사적·언약적 정체성 보존
- issue: 군사 행동의 묘사에서 과도한 해석을 피함
  chosen_reading: ἐξήγαγεν을 ‘끌고 나왔습니다’로 옮겨 단순한 행진 이상의 전개는 암시하되 세부 전술은 덧붙이지 않았습니다.
