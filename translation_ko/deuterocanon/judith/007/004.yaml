base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/007/004.yaml
  text: But the sons of Israel[a], when they saw their great number, were greatly troubled, and each said to his neighbor, “Now these men will lick up the whole face of the land[b], and neither the high mountains nor the ravines nor the hills will bear their weight.”
  footnotes:
  - marker: a
    text: Or, more interpretively, 'will consume'; the Greek verb literally means 'will lick up,' preserving the image of devouring spread across the land.
    reason: lexical_alternative
  - marker: b
    text: '''Face of the land'' is a literal idiom for the land''s surface or expanse.'
    reason: cultural_note
translation:
  language: ko
  text: 이스라엘 자손은 그들의 수많음을 보고 크게 불안해하며, 서로에게 말했습니다. 「이제 이 자들이 온 땅의 표면을 다 핥아 버릴 것입니다. 높은 산들도, 협곡들도, 언덕들도 그들의 무게를 감당하지 못할 것입니다」.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 동사는 문자적으로는 ‘핥아 먹다’에 가깝습니다. POB는 이 생생한 이미지를 살리되, 뜻으로는 ‘삼키다/먹어 치우다’의 뉘앙스도 함께 담고 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘온 땅의 표면’은 히브리어적 관용구를 그대로 옮긴 표현으로, 땅의 겉면이나 전역을 뜻합니다.
    reason: cultural_note
lexical_decisions:
- source_word: οἱ δὲ υἱοὶ Ἰσραήλ
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘의 아들들
  - 이스라엘인들
  lexicon: LSJ
  rationale: 그리스어의 직설적 혈연/언약 표현을 살리면서도 한국어 성경 문체에서 자연스럽게 읽히는 표현으로 옮겼습니다.
- source_word: ἐταράχθησαν σφόδρα
  english_pob_choice: were greatly troubled
  chosen_korean: 크게 불안해하며
  alternatives_korean:
  - 크게 troubled
  - 크게 동요하며
  - 몹시 두려워하며
  lexicon: LSJ
  rationale: ταράσσω의 핵심은 격한 동요이므로, 과도하게 ‘두려움’으로 좁히지 않고 정서적 흔들림을 드러냈습니다.
- source_word: Νῦν ἐκλείξουσιν οὗτοι
  english_pob_choice: Now these men will lick up
  chosen_korean: 이제 이 자들이 … 핥아 버릴 것입니다
  alternatives_korean:
  - 이제 이 사람들이 … 삼켜 버릴 것입니다
  - 이제 이 자들이 … 먹어 치울 것입니다
  lexicon: LSJ
  rationale: ἐκλείχω의 직유적 이미지인 ‘핥아 먹다/핥아 없애다’를 본문에서 유지해, POB의 해석상 주의점을 살렸습니다.
- source_word: τὸ πρόσωπον τῆς γῆς πάσης
  english_pob_choice: the whole face of the land
  chosen_korean: 온 땅의 표면
  alternatives_korean:
  - 땅의 온 얼굴
  - 온 땅의 얼굴
  lexicon: LSJ
  rationale: ‘얼굴’ 직역보다 한국어에서 의미가 분명한 ‘표면’을 택하되, 전체를 뒤덮는 확장 이미지는 유지했습니다.
- source_word: ὑποστήσονται τὸ βάρος αὐτῶν
  english_pob_choice: will bear their weight
  chosen_korean: 그들의 무게를 감당하지 못할 것입니다
  alternatives_korean:
  - 그들의 무게를 견디지 못할 것입니다
  - 그들의 무게를 떠받치지 못할 것입니다
  lexicon: LSJ
  rationale: ὑποστήσονται의 ‘지탱하다/견디다’ 의미를 자연스러운 한국어로 풀어, 지형이 군대의 압력을 버티지 못한다는 그림을 살렸습니다.
theological_decisions:
- issue: 지형의 의인화된 불가능성 표현
  chosen_reading: 산, 협곡, 언덕이 그들의 무게를 감당하지 못한다는 과장적 서술을 그대로 유지했습니다.
  alternative_readings:
  - 단순히 ‘그들을 막지 못한다’로 완화할 수 있음
  - ‘버티지 못할 것입니다’로 더 일반화할 수 있음
  rationale: 원문은 지형이 실제로 짓눌린다는 상상적 과장을 통해 군대의 압도적 규모를 강조하므로, 그 이미지를 약화시키지 않았습니다.
  doctrine_reference: 서사적 과장과 시적 이미지의 보존
- issue: ‘이스라엘 자손’ 표현의 보존
  chosen_reading: 유대-언약적 집단명을 ‘이스라엘 자손’으로 유지했습니다.
  alternative_readings:
  - ‘이스라엘인들’로 평이화
  - ‘이스라엘 백성’으로 의미화
  rationale: 그리스어의 문구가 가진 성경적·집합적 뉘앙스를 보존하는 편이 이 본문의 서사적 음성을 더 잘 드러냅니다.
  doctrine_reference: 성경적 집단 명칭의 번역 일관성
