  text: 진영에 머물러 있으면서, 당신의 군세에 속한 모든 사람을 지키고, 당신의 부하들이 산기슭에서 나오는 물샘을 장악하게 하십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
