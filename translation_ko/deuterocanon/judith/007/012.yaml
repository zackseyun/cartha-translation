  rationale: 군사적 집결지를 자연스럽게 드러내는 표준어로 ‘진영’을 택했습니다.
- source_word: οἱ παῖδές σου
  english_pob_choice: your servants
  chosen_korean: 당신의 종들
  alternatives_korean:
  - 당신의 부하들
  - 당신의 하인들
  - 당신의 사람들
  lexicon: LSJ
  rationale: παῖδες의 기본값인 종/부하 의미를 살리되, 문맥상 군사적 하위 지휘 대상을 염두에 두어 ‘종들’로 옮겼습니다.
- source_word: ῥίζης τοῦ ὄρους
