  rationale: 직역하면 ‘산의 뿌리’이지만, 영어 POB의 각주처럼 지형상 ‘기슭/밑’의 관용적 뜻이 있습니다. 본문에는 원형 이미지를 살리고, 한국어에서는 이를 유지했습니다.
theological_decisions:
- issue: 공동체 내부 지칭인 παῖδες의 처리
  chosen_reading: ‘당신의 종들’로 두어 지시 대상이 단순한 일반 민간인이 아니라 명령 아래 있는 하위 구성원임을 드러냈습니다.
  alternative_readings:
  - 당신의 사람들
  - 당신의 부하들
  rationale: 본절은 전쟁 지시문이므로 사회적 관계와 복종 구조를 희석하지 않는 번역이 적절합니다.
  doctrine_reference: 본문 문맥에 따른 의미 보존(서사/군사 문맥)
