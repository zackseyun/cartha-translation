  text: Remain by your camp, securing every man from your force, and let your servants gain control of the spring of water that comes out from the foot of the mountain,
  footnotes:
  - marker: a
    text: Or 'your men' for 'your servants' (οἱ παῖδές σου); the Greek term can denote servants, attendants, or subordinates in context.
    reason: lexical_alternative
  - marker: b
    text: Literally 'the root of the mountain,' an idiom for its base or foot.
    reason: lexical_alternative
translation:
  language: ko
  text: 당신의 진영 곁에 머물러 있으면서, 당신의 군세의 모든 사람을 지키고, 당신의 종들이 산의 뿌리에서 나오는 그 물샘을 장악하게 하십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘산의 뿌리’입니다. 지형상으로는 산기슭 또는 산의 밑을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνάμεινον
  english_pob_choice: Remain
  chosen_korean: 머물러 있으면서
  alternatives_korean:
  - 기다리십시오
  - 머물러 있으십시오
  - 남아 있으십시오
  lexicon: LSJ
  rationale: 군사적 지시에서 단순한 지연보다 그 자리에서 계속 머무는 뜻을 살려 ‘머물러 있으면서’로 옮겼습니다.
- source_word: παρεμβολῆς
