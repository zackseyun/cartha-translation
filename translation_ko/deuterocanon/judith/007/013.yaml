  rationale: ἐκδίδωμι는 전투 문맥에서 ‘넘겨주다/인도하다’의 뉘앙스를 가지므로, 항복의 결과를 드러내되 직역을 과도하게 군사화하지 않는 ‘넘겨주다’를 택했습니다.
- source_word: ἐπὶ τὰς πλησίον κορυφὰς τῶν ὀρέων
  english_pob_choice: to the nearby summits of the mountains
  chosen_korean: 산들의 가까운 꼭대기들로
  alternatives_korean:
