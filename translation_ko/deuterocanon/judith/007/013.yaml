  lexicon: BDAG
  rationale: δίψα는 단순한 느낌이 아니라 생명을 위협하는 결핍 상태이므로, 주어를 살려 ‘목마름이’로 하고 결과를 강하게 드러내는 ‘멸하다’로 옮겼습니다.
- source_word: ἐκδώσουσι τὴν πόλιν αὐτῶν
