  rationale: κορυφαί의 ‘꼭대기/봉우리’ 이미지를 살리면서 πλησίον의 ‘가까운’을 보존해 지형적 세부를 유지했습니다.
theological_decisions:
- issue: 서술의 행위자와 인과 관계
  chosen_reading: 목마름을 의인화된 행위자로 살려, 그들이 물을 길어 와야 하는 처지와 그 결과의 파멸을 한 문장 안에서 드러냈습니다.
  alternative_readings:
  - 그들은 물을 길어 오므로 목마름으로 멸망할 것입니다
  - 물이 없어서 그들이 죽게 될 것입니다
  rationale: 원문은 ‘그곳에서 물을 길어 와야 한다’는 현실과 ‘목마름이 그들을 멸할 것’이라는 위협을 병치합니다. 이 긴장을 약화하지 않도록 주어 관계를 유지했습니다.
  doctrine_reference: 본문의 수사적·서사적 긴장 유지
- issue: 지명 음역의 원문성
  chosen_reading: Βαιτυλουά를 원음에 가까운 바이트룰루아로 옮기고, 전통적 영어형을 본문에서 따르지 않았습니다.
  alternative_readings:
  - 베툴리아
  - 베이툴루아
  rationale: 이 본문은 전승된 관용형보다 그리스어 증거를 더 직접 반영하는 것이 적절하므로, 독자가 지명 형태 차이를 인지하도록 했습니다.
  doctrine_reference: 원문 근거를 우선하는 번역 원칙
