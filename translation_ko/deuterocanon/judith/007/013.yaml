translation:
  language: ko
  text: 이는 바이튈루아[a]에 사는 모든 사람이 그곳에서 물을 길어 오기 때문입니다. 갈증이 그들을 죽일 것이며, 그들은 자기들의 도시를 넘겨줄 것입니다. 그리고 우리와 우리 백성은 가까운 산봉우리들로 올라갈 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 전통적인 영어 번역본들은 이 지명을 흔히 ‘Bethulia’로 표기합니다. 그러나 여기의 그리스어 형태는 Βαιτυλουά이므로, 본문에서는 이를 더 직접적으로 반영하여 ‘바이튈루아’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκεῖθεν ὑδρεύονται
  english_pob_choice: draw water
  chosen_korean: 물을 길어 오기 때문입니다
  alternatives_korean:
  - 물을 길어 옵니다
  - 물을 긷기 때문입니다
  lexicon: BDAG
  rationale: ὑδρεύονται는 물을 길어 오는 행위를 가리키므로, 현대 한국어에서는 자연스럽고 구체적인 ‘물을 길어 오다’로 옮겼습니다.
- source_word: Βαιτυλουά
  english_pob_choice: Baithyloua
  chosen_korean: 바이트룰루아
  alternatives_korean:
  - 베툴리아
  - 베이툴루아
  lexicon: 고유명사 음역
  rationale: 그리스어 형태 Βαιτυλουά를 가능한 직접적으로 반영해 전통적 영어형보다 원문에 가까운 음역을 택했습니다.
- source_word: ἀνελεῖ αὐτοὺς ἡ δίψα
  english_pob_choice: thirst will destroy them
  chosen_korean: 목마름이 그들을 멸하고
  alternatives_korean:
  - 갈증이 그들을 파멸시키고
  - 목마름이 그들을 죽이고
  lexicon: BDAG
  rationale: δίψα는 단순한 느낌이 아니라 생명을 위협하는 결핍 상태이므로, 주어를 살려 ‘목마름이’로 하고 결과를 강하게 드러내는 ‘멸하다’로 옮겼습니다.
- source_word: ἐκδώσουσι τὴν πόλιν αὐτῶν
  english_pob_choice: they will surrender their city
  chosen_korean: 그들이 자기 성읍을 넘겨줄 것이며
  alternatives_korean:
  - 그들이 자기 성읍을 항복시킬 것이며
  - 그들이 자기 성읍을 내줄 것이며
  lexicon: BDAG
  rationale: ἐκδίδωμι는 전투 문맥에서 ‘넘겨주다/인도하다’의 뉘앙스를 가지므로, 항복의 결과를 드러내되 직역을 과도하게 군사화하지 않는 ‘넘겨주다’를 택했습니다.
- source_word: ἐπὶ τὰς πλησίον κορυφὰς τῶν ὀρέων
  english_pob_choice: to the nearby summits of the mountains
  chosen_korean: 산들의 가까운 꼭대기들로
  alternatives_korean:
  - 가까운 산꼭대기들로
  - 산들의 인근 봉우리들로
  lexicon: BDAG
  rationale: κορυφαί의 ‘꼭대기/봉우리’ 이미지를 살리면서 πλησίον의 ‘가까운’을 보존해 지형적 세부를 유지했습니다.
theological_decisions:
- issue: 서술의 행위자와 인과 관계
  chosen_reading: 목마름을 의인화된 행위자로 살려, 그들이 물을 길어 와야 하는 처지와 그 결과의 파멸을 한 문장 안에서 드러냈습니다.
  alternative_readings:
  - 그들은 물을 길어 오므로 목마름으로 멸망할 것입니다
  - 물이 없어서 그들이 죽게 될 것입니다
  rationale: 원문은 ‘그곳에서 물을 길어 와야 한다’는 현실과 ‘목마름이 그들을 멸할 것’이라는 위협을 병치합니다. 이 긴장을 약화하지 않도록 주어 관계를 유지했습니다.
  doctrine_reference: 본문의 수사적·서사적 긴장 유지
- issue: 지명 음역의 원문성
  chosen_reading: Βαιτυλουά를 원음에 가까운 바이트룰루아로 옮기고, 전통적 영어형을 본문에서 따르지 않았습니다.
  alternative_readings:
  - 베툴리아
  - 베이툴루아
  rationale: 이 본문은 전승된 관용형보다 그리스어 증거를 더 직접 반영하는 것이 적절하므로, 독자가 지명 형태 차이를 인지하도록 했습니다.
  doctrine_reference: 원문 근거를 우선하는 번역 원칙
