  text: for from there all who live in Baithyloua draw water[a], and thirst will destroy them, and they will surrender their city; and we and our people will go up to the nearby summits of the mountains,
  footnotes:
  - marker: a
    text: Traditional English versions often give the place name as 'Bethulia'; the Greek form here is Βαιτυλουά, rendered more directly as 'Baithyloua.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 그곳에서 바이트룰루아에 사는 모든 사람이 물을 길어 오기 때문입니다[a]. 목마름이 그들을 멸하고, 그들이 자기 성읍을 넘겨줄 것이며, 우리와 우리 백성은 산들의 가까운 꼭대기들로 올라갈 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 전통 영어 성경들은 이 지명을 흔히 ‘Bethulia’로 적지만, 여기의 그리스어 형태는 Βαιτυλουά이므로 더 직접적으로 ‘Baithyloua’에 해당합니다.
    reason: lexical_alternative
lexical_decisions:
