  source_fidelity: 초안은 포위 진영을 설치하여 성읍 밖으로 나가지 못하게 하고, 기근과 칼이 닥치기 전의 쓰러짐을 묘사하는 그리스어의 흐름을 대체로 충실히 반영합니다. 다만 τακήσονται는 기근 가운데 ‘쇠약해지다/소진되다’라는 진행적 표현이므로 ‘말라 죽다’는 결과를 다소 앞당겨 확정합니다. 또한 ‘자기 거주의 거리들’은 οἰκήσεως αὐτῶν의 뜻은 살리지만 현대 한국어로 부자연스럽습니다.
  naturalness: ‘그들이 사는 곳의 큰길들’은 원문의 ‘그들의 거처/거주지의 πλατεῖαι’를 자연스러운 한국어로 옮기면서도 거리와 광장 사이의 어휘적 여지를 각주로 보존합니다. ‘기근 속에서 쇠약해질 것입니다’도 합쇼체 문맥에서 자연스럽고 원문의 점진성을 유지합니다.
