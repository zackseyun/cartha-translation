  rationale: 본문은 적대적 포위가 가져올 파국을 의도적으로 강하게 묘사하므로, 한국어에서도 그 판단적·비극적 힘을 약화하지 않는 것이 중요합니다.
  doctrine_reference: 서술 본문 해석 원칙
