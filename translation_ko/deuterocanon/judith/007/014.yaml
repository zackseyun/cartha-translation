  rationale: λιμός는 일반적인 배고픔보다 집단적 기근을 가리키지만, 한국어에서는 상황을 자연스럽게 드러내는 ‘굶주림에’가 가장 직접적입니다.
- source_word: καταστρωθήσονται ἐν ταῖς πλατείαις τῆς οἰκήσεως αὐτῶν
  english_pob_choice: they will be laid low in the streets of their dwellings
  chosen_korean: 그들은 자기 거주의 거리들에 쓰러질 것입니다
  alternatives_korean:
  - 자기 거주의 광장들에 쓰러질 것입니다
  - 자기 거처의 넓은 곳들에 쓰러질 것입니다
  lexicon: LSJ
  rationale: πλατεῖαι는 거리와 광장 모두 가능하므로 POB의 ‘streets’에 맞추되, οἰκήσεως αὐτῶν은 ‘거주’의 형식을 살려 직역에 가깝게 유지했습니다.
