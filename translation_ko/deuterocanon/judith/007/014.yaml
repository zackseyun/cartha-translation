  text: And we will encamp against them as a guard[a], so that not one man may go out from the city. And they, and their wives, and their children, will waste away in the famine, and before the sword comes upon them, they will be laid low in the streets of their dwellings.
  footnotes:
  - marker: a
    text: Or 'they will be strewn in the squares of their habitation.' The Greek πλατεῖαι can mean broad streets or public squares, and καταστρωθήσονται can carry the sense of being thrown down or spread out.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 우리는 그들에 맞서 진을 쳐서, 도시에서 한 사람도 나가지 못하게 지킬 것입니다. 그러면 그들과 그들의 아내들과 그들의 자녀들은 굶주림에 말라 죽을 것이며, 칼이 그들에게 닥치기 전에 그들은 자기 거주의 거리들에 쓰러질 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 거주지의 광장들에 흩어질 것입니다.’ 그리스어 πλατεῖαι는 넓은 거리나 공공 광장을 뜻할 수 있고, καταστρωθήσονται는 ‘쓰러지다’보다 ‘펴지듯 흩어지다’의 뉘앙스도 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεμβαλοῦμεν
  english_pob_choice: we will encamp
  chosen_korean: 진을 칠 것입니다
  alternatives_korean:
  - 캠프를 칠 것입니다
  - 주둔할 것입니다
  lexicon: LSJ
  rationale: 군사적 포위 상황에서의 이동이 아니라 적 앞에 진지를 펴는 뜻이므로 ‘진을 치다’가 가장 자연스럽고 원문의 전투적 뉘앙스를 살립니다.
- source_word: εἰς προφυλακὴν
  english_pob_choice: as a guard
  chosen_korean: 지킬 것입니다
  alternatives_korean:
  - 경계할 것입니다
  - 보초 설 것입니다
  lexicon: LSJ
  rationale: 문맥상 성벽 밖에서의 차단·감시 목적이므로, 목적어를 직접 드러내는 ‘지키다’가 한국어로 가장 분명합니다.
- source_word: τοῦ μὴ ἐξελθεῖν ἐκ τῆς πόλεως ἄνδρα ἕνα
  english_pob_choice: so that not one man may go out from the city
  chosen_korean: 도시에서 한 사람도 나가지 못하게
  alternatives_korean:
  - 도시에서 아무도 나가지 못하게
  - 성읍에서 남자 하나도 나가지 못하게
  lexicon: LSJ
  rationale: ἄνδρα ἕνα의 문자성을 너무 약화하지 않되, 한국어에서는 성별을 굳이 반복하지 않아도 ‘한 사람도’로 예방 목적을 분명히 전달할 수 있습니다.
- source_word: τακήσονται
  english_pob_choice: will waste away
  chosen_korean: 말라 죽을 것이며
  alternatives_korean:
  - 쇠약해질 것이며
  - 소진될 것이며
  lexicon: LSJ
  rationale: 기근으로 인한 점진적 소멸을 나타내므로, 단순한 쇠약보다 결과를 드러내는 ‘말라 죽다’가 원문의 강도를 잘 옮깁니다.
- source_word: ἐν τῷ λιμῷ
  english_pob_choice: in the famine
  chosen_korean: 굶주림에
  alternatives_korean:
  - 기근 속에서
  - 배고픔 가운데
  lexicon: LSJ
  rationale: λιμός는 일반적인 배고픔보다 집단적 기근을 가리키지만, 한국어에서는 상황을 자연스럽게 드러내는 ‘굶주림에’가 가장 직접적입니다.
- source_word: καταστρωθήσονται ἐν ταῖς πλατείαις τῆς οἰκήσεως αὐτῶν
  english_pob_choice: they will be laid low in the streets of their dwellings
  chosen_korean: 그들은 자기 거주의 거리들에 쓰러질 것입니다
  alternatives_korean:
  - 자기 거주의 광장들에 쓰러질 것입니다
  - 자기 거처의 넓은 곳들에 쓰러질 것입니다
  lexicon: LSJ
  rationale: πλατεῖαι는 거리와 광장 모두 가능하므로 POB의 ‘streets’에 맞추되, οἰκήσεως αὐτῶν은 ‘거주’의 형식을 살려 직역에 가깝게 유지했습니다.
theological_decisions:
- issue: 전쟁·포위 서술의 강도 유지
  chosen_reading: 전략적 포위와 기근, 그리고 칼에 의한 죽음을 연속된 심판적 결과로 직설적으로 옮겼습니다.
  alternative_readings:
  - 완곡하게 ‘지치게 될 것입니다’처럼 약화할 수 있음
  - ‘길바닥에 쓰러질 것입니다’처럼 더 서사적으로 풀 수 있음
  rationale: 본문은 적대적 포위가 가져올 파국을 의도적으로 강하게 묘사하므로, 한국어에서도 그 판단적·비극적 힘을 약화하지 않는 것이 중요합니다.
  doctrine_reference: 서술 본문 해석 원칙
