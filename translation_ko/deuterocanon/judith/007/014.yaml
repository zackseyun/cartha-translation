  yaml_path: translation/deuterocanon/judith/007/014.yaml
  text: And we will encamp against them as a guard[a], so that not one man may go out from the city. And they, and their wives, and their children, will waste away in the famine, and before the sword comes upon them, they will be laid low in the streets of their dwellings.
  footnotes:
  - marker: a
    text: Or 'they will be strewn in the squares of their habitation.' The Greek πλατεῖαι can mean broad streets or public squares, and καταστρωθήσονται can carry the sense of being thrown down or spread out.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 우리는 그들에 대항하여 진을 치고, 성읍에서 한 사람도 나가지 못하게 경계할 것입니다. 그러면 그들과 그들의 아내들과 자녀들은 기근 속에서 쇠약해질 것이며, 칼이 그들에게 닥치기도 전에 그들이 사는 곳의 큰길들에 쓰러질 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들이 사는 곳의 광장들에 널브러질 것입니다.’ 그리스어 πλατεῖαι는 넓은 거리나 공공 광장을 뜻할 수 있으며, καταστρωθήσονται는 쓰러지다 또는 땅에 펼쳐지듯 널브러지다라는 뜻을 나타낼 수 있습니다.
    reason: lexical_alternative
