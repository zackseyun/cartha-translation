  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 Ὀζείας는 이 문맥 및 영어 감사본의 Uzziah에 따라 통용 성서 인명인 ‘웃시야’로 옮기는 편이 적절합니다. 또한 ἐπιστρέψει ... τὸ ἔλεος αὐτοῦ ἐφʼ ἡμᾶς는 하나님의 긍휼이 백성에게 다시 향하는 뜻이므로, 한국어에서는 ‘긍휼을 우리에게 돌리실’보다 ‘긍휼을 다시 우리에게 베푸실’이 뜻을 더 분명하고 자연스럽게 전달합니다.
