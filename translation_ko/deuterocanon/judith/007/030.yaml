  text: And Uzziah said to them[a], “Take courage, brothers; let us hold out for five more days, within which the Lord our God will turn his mercy toward us, for he will not abandon us forever.”
  footnotes:
  - marker: a
    text: Or, 'for he will not forsake us forever' / 'he will not utterly abandon us.' The Greek phrase 'to the end' can idiomatically express final or complete abandonment.
    reason: lexical_alternative
translation:
  language: ko
  text: 오지야가 그들에게 말했습니다. 「용기를 내십시오, 형제들이여. 우리가 다섯 날 더 견디도록 합시다. 그 기간 안에 주 우리 하나님께서 자신의 긍휼을 우리에게로 돌이키실 것이니, 그는 우리를 끝까지 버리시지 않을 것입니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘우리를 영원히 버리시지 않을 것입니다’; 헬라어의 εἰς τέλος는 문맥상 ‘끝까지’ 또는 ‘완전히/영원히’라는 뉘앙스를 가질 수 있습니다.
    reason: lexical_alternative
