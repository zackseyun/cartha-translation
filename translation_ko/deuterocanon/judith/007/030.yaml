  text: And Uzziah said to them[a], “Take courage, brothers; let us hold out for five more days, within which the Lord our God will turn his mercy toward us, for he will not abandon us forever.”
  footnotes:
  - marker: a
    text: Or, 'for he will not forsake us forever' / 'he will not utterly abandon us.' The Greek phrase 'to the end' can idiomatically express final or complete abandonment.
    reason: lexical_alternative
translation:
  language: ko
  text: 웃시야가 그들에게 말하였습니다. 「용기를 내십시오, 형제들이여. 우리가 다섯 날 더 견딥시다. 그 다섯 날 안에 주 우리 하나님께서 자신의 긍휼을 다시 우리에게 베푸실 것이니, 그분은 우리를 끝까지 버리시지 않을 것입니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘우리를 영원히 버리시지 않을 것입니다’ 또는 ‘우리를 완전히 버리시지 않을 것입니다’. 헬라어 εἰς τέλος는 문맥상 ‘끝까지’뿐 아니라 영구적 또는 완전한 버림을 뜻할 수도 있습니다.
    reason: lexical_alternative
