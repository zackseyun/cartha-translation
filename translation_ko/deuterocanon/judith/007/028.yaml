  source_fidelity: 초안은 하늘·땅·하나님을 증인으로 부르는 행위와 죄에 따른 신적 보응을 대체로 반영합니다. 그러나 ‘바랍니다’는 화자들의 희망을 명시하여 그리스어의 ἵνα 목적/경계 절을 다소 재해석하며, ‘그분은 … 분이시니’는 관계절을 독립적인 이유 절로 바꿉니다. 또한 ὑμῖν의 법정적 대립 문맥은 ‘여러분을 거슬러’로 명시하는 편이 영어 POB 감사 기록 및 문맥에 더 충실합니다.
  naturalness: ‘증인으로 부르며, 그분은 … 분이시니’는 문장 연결이 다소 무겁고, 마지막의 ‘바랍니다’도 앞의 엄숙한 법정적 호소와 어조가 맞지 않습니다. ‘증인으로 세웁니다’와 ‘… 않도록 하십시오’는 현대 표준어 합쇼체에서 자연스럽고, 원문의 호소/경계의 힘을 유지합니다.
  terminology: θεός와 κύριος는 ‘우리의 하나님과 우리 조상들의 주님’으로 유지했습니다. ἐκδικεῖ는 죄에 상응하는 징벌·보응을 가리키므로 ‘보응하시는’으로 옮겨 단순한 사적 보복이라는 오해를 피하면서도 법정적 보복/응보의 의미를 보존했습니다. ῥήματα는 앞선 발언들을 가리키므로 ‘이 말씀들’로 옮겼습니다.
