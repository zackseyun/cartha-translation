base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/007/028.yaml
  text: We call heaven and earth and our God and Lord of our fathers to witness against you[a], who avenges us according to our sins and according to the sins of our fathers[b], that he may not act according to these words today.
  footnotes:
  - marker: a
    text: Or, more literally, 'we testify to you'; the Greek likely has the sense of formally invoking heaven, earth, and God as witnesses against them.
    reason: lexical_alternative
  - marker: b
    text: The clause 'he who avenges us according to our sins' expresses divine retribution or repayment in view of sin; it could also be rendered 'he who punishes us for our sins.'
    reason: lexical_alternative
translation:
  language: ko
  text: 우리는 하늘과 땅과 우리의 하나님과 우리 조상들의 주님을 여러분을 거슬러 증인으로 세웁니다. 그분은 우리의 죄와 우리 조상들의 죄에 따라 우리에게 보응하시는 분이시니, 오늘 이 말씀들대로 행하지 않도록 하십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘우리는 여러분에게 증언합니다’에 가깝습니다. 그러나 여기서는 하늘과 땅과 하나님을 여러분을 거슬러 증인으로 공식 소환하는 법정적 표현으로 보입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘우리에게 보응하시는’은 죄에 따른 하나님의 응보 또는 징벌을 뜻합니다. κατὰ는 여기서 단순한 원인보다 죄에 상응하는 기준 또는 척도의 의미를 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: μαρτυρόμεθα ὑμῖν
  english_pob_choice: We call ... to witness against you
  chosen_korean: 우리는 ...을 증인으로 부르며
  alternatives_korean:
  - 우리는 ...에게 증언합니다
  - 우리는 ...을 증인으로 삼아 당신들에 대하여 말합니다
  lexicon: BDAG
  rationale: 이 표현은 단순한 ‘증언하다’보다 하늘·땅·하나님을 법정적 증인으로 소환하는 맥락이므로, 한국어도 ‘증인으로 부르며’로 그 공적 성격을 살렸습니다.
- source_word: τὸν θεὸν ἡμῶν καὶ κύριον τῶν πατέρων ἡμῶν
  english_pob_choice: our God and the Lord of our fathers
  chosen_korean: 우리의 하나님과 조상들의 주님
  alternatives_korean:
  - 우리 하나님과 조상들의 주인
  - 우리의 하나님과 우리 조상들의 주님
  lexicon: BDAG
  rationale: κύριος는 프로젝트 기본값에 따라 ‘주님’으로 옮기고, 조상들과 연결된 언약적 호칭을 살리기 위해 ‘조상들의 주님’으로 자연스럽게 연결했습니다.
- source_word: ἐκδικεῖ
  english_pob_choice: who avenges us
  chosen_korean: 벌하시는 분이시니
  alternatives_korean:
  - 원수를 갚으시는 분이시니
  - 보복하시는 분이시니
  lexicon: BDAG
  rationale: 문맥상 ἐκδικεῖ는 단순 감정적 복수보다 죄에 따른 신적 보응을 뜻하므로, 한국어에서는 ‘벌하시는’으로 공의로운 징벌의 뜻을 드러냈습니다.
- source_word: κατὰ τὰς ἁμαρτίας ἡμῶν καὶ κατὰ τὰ ἁμαρτήματα τῶν πατέρων ἡμῶν
  english_pob_choice: according to our sins and according to the sins of our fathers
  chosen_korean: 우리의 죄와 우리 조상들의 죄에 따라
  alternatives_korean:
  - 우리의 죄 때문에와 우리 조상들의 죄 때문에
  - 우리의 죄에 비례하여 우리 조상들의 죄에 비례하여
  lexicon: BDAG
  rationale: κατά + 대격의 대응/기준 의미를 살려 ‘에 따라’로 옮겼고, ἁμαρτίαι/ἁμαρτήματα는 여기서 동의어적으로 쓰이므로 둘 다 ‘죄’로 번역했습니다.
- source_word: κατὰ τὰ ῥήματα ταῦτα
  english_pob_choice: according to these words
  chosen_korean: 이 말들대로
  alternatives_korean:
  - 이 말에 따라
  - 이 말한 대로
  lexicon: LSJ
  rationale: 앞서 선포된 발화를 가리키는 ῥήματα를 한국어에서 가장 자연스럽게 받기 위해 ‘이 말들대로’로 간결하게 처리했습니다.
