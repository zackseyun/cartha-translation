lexical_decisions:
- source_word: ἐκκλησίας
  english_pob_choice: assembly
  chosen_korean: 회중
  alternatives_korean:
  - 모임
  - 집회
  - 교회
  lexicon: BDAG
  rationale: 이 문맥의 ἐκκλησία는 후대 제도적 의미의 ‘교회’가 아니라 모여 있는 공동체를 가리키므로, 자연스럽고 오해를 덜 주는 ‘회중’으로 옮겼습니다.
- source_word: κλαυθμὸς μέγας
  english_pob_choice: great weeping
  chosen_korean: 크게 울었으며
  alternatives_korean:
  - 큰 통곡이 있었으며
  - 크게 통곡하며
  - 큰 울음이 있었으며
  lexicon: BDAG
  rationale: κλαυθμός는 단순한 감정 설명보다 실제적인 울음을 뜻하므로, 서술형으로 자연스럽게 ‘크게 울었으며’로 옮겨 장면의 생동감을 살렸습니다.
- source_word: ὁμοθυμαδόν
  english_pob_choice: all together
  chosen_korean: 한마음으로
  alternatives_korean:
  - 모두 함께
  - 일제히
  - 한뜻으로
  lexicon: BDAG
  rationale: ὁμοθυμαδόν은 단순 동시성이 아니라 공동의 마음과 뜻을 강조하므로, 한국어로는 의미를 압축해 ‘한마음으로’가 가장 잘 드러냅니다.
- source_word: ἐβόησαν πρὸς Κύριον τὸν θεόν
  english_pob_choice: they cried out to the Lord God
  chosen_korean: 주 하나님께 큰 소리로 부르짖었습니다
  alternatives_korean:
  - 주 하나님께 외쳤습니다
  - 주 하나님께 소리 높여 부르짖었습니다
  - 주 하나님께 울부짖었습니다
  lexicon: BDAG
  rationale: ἐβόησαν은 단순 발화가 아니라 긴급한 호소를 뜻하므로 ‘부르짖었습니다’가 적절하고, ‘큰 소리로’는 φωνῇ μεγάλῃ의 강도를 자연스럽게 반영합니다.
theological_decisions:
- issue: ἐκκλησία의 번역어 선택
