  - 공동체
  rationale: 유다서/유딧의 역사 서술에서는 후대 기독교 제도인 ‘교회’보다, 실제로 모인 백성을 가리키는 ‘회중’이 원문의 사회적 장면을 더 정확히 전달합니다.
  doctrine_reference: original-language primacy over ecclesial tradition
