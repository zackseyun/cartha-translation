base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/007/027.yaml
  text: For it is better for us to become plunder for them[a]; for we will become slaves, and our lives will be spared, and we will not see with our own eyes the death of our little children[d][c][b], and our wives and our children breathing out their lives.
  footnotes:
  - marker: a
    text: Or 'spoil' or 'booty' for 'plunder.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'our soul will live'; the phrase means that their lives would be preserved.
    reason: lexical_alternative
  - marker: c
    text: Or 'before our eyes' for 'with our own eyes.'
    reason: lexical_alternative
  - marker: d
    text: The Greek may be rendered more literally 'our wives and our children having their lives fail away,' that is, dying before us.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들에게 노략거리가 되는 것이 우리에게 더 낫습니다. 우리는 종이 될 것이고 우리의 생명은 보존될 것입니다. 또한 우리는 우리 눈앞에서 어린아이들의 죽음을 보지 않을 것이며, 우리 아내들과 우리 자녀들이 생명을 잃어 가는 것도 보지 않을 것입니다.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘노략거리’는 전쟁에서 적에게 빼앗기는 전리품, 곧 약탈의 대상이 되는 것을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘우리의 영혼이 살 것이다’이지만, 여기서는 생명이 보존된다는 뜻입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘우리 눈앞에서’는 ‘우리의 눈으로’라는 뜻의 관용적 표현입니다.
    reason: lexical_alternative
  - marker: d
    text: 마지막 절은 문자적으로는 ‘우리 아내들과 우리 자녀들이 그들의 생명이 사라져 가는’에 가깝습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: κρεῖσσον
  english_pob_choice: better
