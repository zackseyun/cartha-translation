  lexicon: LSJ
  rationale: 비교급의 실질적 판단을 자연스러운 현대 한국어로 옮기되, 상황상 손익 비교의 긴박함을 유지했습니다.
- source_word: γενηθῆναι αὐτοῖς εἰς διαρπαγήν
  english_pob_choice: to become plunder
  chosen_korean: 그들에게 노략거리가 되는 것
  alternatives_korean:
  - 그들에게 노획물이 되는 것
  - 그들에게 약탈당하는 것
  lexicon: LSJ
  rationale: διαρπαγή의 전투·정복 맥락을 살려 ‘노략거리’로 옮겨, 단순 손실이 아니라 적의 전리품이 되는 뜻을 드러냈습니다.
- source_word: δούλους
  english_pob_choice: slaves
  chosen_korean: 종
  alternatives_korean:
  - 노예
  - 종살이하는 사람
  lexicon: BDAG
  rationale: 본문은 강제적 예속을 말하지만, 이 문맥에서 한국어 ‘종’이 가장 간결하고 본문 대조(생명 보존 vs. 예속)를 잘 살립니다. ‘노예’도 가능하나, POB 기본어휘와 문맥의 호흡을 고려해 ‘종’을 택했습니다.
- source_word: ἐκλειπούσας τὰς ψυχὰς αὐτῶν
  english_pob_choice: breathing out their lives
  chosen_korean: 생명을 잃어 가는 것도
  alternatives_korean:
  - 숨을 거두는 것도
  - 생명이 사라져 가는 것도
  lexicon: LSJ
  rationale: 직역하면 ‘그들의 생명이 소멸해 가는’ 뜻이므로, 임종 장면의 생생함을 유지하면서도 한국어로 자연스럽게 읽히는 표현으로 옮겼습니다.
theological_decisions:
- issue: ‘우리 아내들과 우리 자녀들’의 결말 표현
  chosen_reading: ‘생명을 잃어 가는 것도’로 묶어, 단순한 상태 묘사가 아니라 죽음의 진행을 직접적으로 드러냈습니다.
  alternative_readings:
  - ‘숨을 거두는 것도’
  - ‘죽어 가는 것도’
  rationale: 그리스어 분사구문은 생명이 사그라드는 과정을 묘사합니다. 이를 완곡하게 만들기보다, 본문의 비극성과 절박함이 전달되도록 유지했습니다.
  doctrine_reference: 문맥 충실 원칙 / 비극적 서사 표현
