translation:
  language: ko
  text: 그들의 말이 오로페르네스와 그 모든 시종의 눈에 좋게 여겨졌고, 그는 그들이 말한 대로 하라고 명령했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤρεσαν
  english_pob_choice: pleased
  chosen_korean: 좋게 여겨졌고
  alternatives_korean:
  - 마음에 들었고
  - 기쁘게 받아들여졌고
  lexicon: BDAG
  rationale: ἀρέσκω의 수동형은 단순한 감정 반응보다 제안이 호의적으로 받아들여졌다는 뜻을 담으므로, 자연스러운 현대어로 옮기되 평가적 뉘앙스를 살렸습니다.
- source_word: οἱ λόγοι αὐτῶν
  english_pob_choice: their words
  chosen_korean: 그들의 말
  alternatives_korean:
  - 그들의 말한 바
  - 그들의 제안
  lexicon: BDAG
  rationale: λόγοι는 문자적으로 ‘말들’이지만 문맥상 조언이나 제안의 내용이므로, 본문에 가까우면서도 한국어로 자연스러운 ‘그들의 말’을 택했습니다.
- source_word: θεραπόντων
  english_pob_choice: attendants
  chosen_korean: 시종
  alternatives_korean:
  - 수종들
  - 수행원
  lexicon: LSJ
  rationale: θεράπων은 단순한 노예라기보다 궁정·군사 환경의 시종/수행자를 가리키므로, 지위 과장을 피하면서도 장면에 맞는 ‘시종’을 사용했습니다.
- source_word: συνέταξε ποιεῖν καθὰ ἐλάλησαν
  english_pob_choice: he gave orders to do as they had said
  chosen_korean: 그들이 말한 대로 하라고 명령했습니다
  alternatives_korean:
  - 그들이 말한 대로 행하라고 지시했습니다
  - 그들이 말한 바를 하도록 명했습니다
  lexicon: BDAG
  rationale: συντάσσω는 여기서 단순 정리보다 권위 있는 명령을 뜻하므로 ‘명령했습니다’가 적절하며, ποιεῖν καθὰ ἐλάλησαν은 그 내용 그대로 옮겼습니다.
