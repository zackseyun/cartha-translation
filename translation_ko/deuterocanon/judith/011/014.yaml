    issue: ‘풀어 줌’이 ἄφεσις의 본문 번역으로 부자연스럽습니다.
    rationale: 현대 한국어에서 행정적·법적 결정을 가리키는 명사로 ‘풀어 줌’은 어색하고 대상도 불명확합니다. ‘해제’는 원문의 의도적으로 특정되지 않은 release의 의미를 더 자연스럽게 보존합니다.
