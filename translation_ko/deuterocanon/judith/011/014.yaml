  source_fidelity: 개정이 필요합니다. 현행문의 ‘그들 곁으로’는 αὐτοῖς의 ‘그들 가운데/그들과 함께’보다 공간적 근접을 뜻하며, ‘장로 회중’은 γερουσία의 시민·행정적 회의체를 교회적 집단처럼 들리게 합니다. 또한 ‘풀어 줌’은 현대 표준어에서 명사로 매우 부자연스럽습니다. 개정문은 κατοικοῦντες, ἐποίησαν ταῦτα, μετοικίσαντας αὐτοῖς 및 παρὰ τῆς γερουσίας의 관계를 보존합니다.
  naturalness: ‘전갈을 보내어 … 알렸습니다’는 ἀπεστάλακεν의 메시지 전달 용법을 자연스럽게 나타냅니다. ‘원로 회의가 내린 해제’는 원문의 ‘회의로부터의 해제’를 자연스러운 한국어로 표현하면서 해제의 대상이 본문에서 특정되지 않았음을 유지합니다.
  terminology: γερουσία는 ‘원로 회의’로 옮겨 장로들의 의결·통치 기구라는 뜻을 살렸습니다. ἄφεσις는 신학적 ‘용서’로 단정하지 않고 중립적인 ‘해제’로 번역했으며, 각주에서 가능한 다른 의미를 제시합니다.
  issues:
