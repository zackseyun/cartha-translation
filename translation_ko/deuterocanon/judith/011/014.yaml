    rationale: 여기서 αὐτοῖς는 이주자들이 그들 ‘가운데’ 또는 ‘그들과 함께’ 거주하게 된 관계를 나타내며, ‘곁’은 단지 가까운 장소를 암시합니다.
  - severity: medium
    issue: ‘장로 회중’은 γερουσία의 제도적 의미에 맞지 않을 수 있습니다.
