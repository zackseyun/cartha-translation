  text: And he sent word to Jerusalem that those living there also had done these things[a], granting to those who had settled among them the release from the council of elders.
  footnotes:
  - marker: a
    text: Or 'forgiveness' or 'remission' for 'the release.' The Greek ἄφεσις can carry either legal/social or moral-religious force; here the surrounding reference to the council of elders favors an administrative sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그는 예루살렘에 전갈을 보내어, 그곳에 사는 사람들도 이러한 일들을 행하고 그들 가운데 이주해 온 이들에게 원로 회의가 내린 해제를 허락하였다고 알렸습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘해제’에 해당하는 그리스어 ἄφεσις는 ‘용서’, ‘사면’, ‘면제’로도 옮길 수 있습니다. 여기서는 원로 회의와 관련되어 있으므로 행정적·사회적 의미가 더 적절해 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεστάλακεν
  english_pob_choice: sent word
  chosen_korean: 전하여
  alternatives_korean:
  - 보냈습니다
  - 소식을 보냈습니다
  lexicon: LSJ
  rationale: 여기에선 단순한 물리적 발송보다 메시지 전달의 의미가 드러나므로, 자연스러운 한국어 동사구인 ‘전하여’를 택했습니다.
- source_word: κατοικοῦντες
  english_pob_choice: those living there
  chosen_korean: 거기에 사는 사람들도
  alternatives_korean:
  - 거기에 거주하는 이들도
  - 거기 사는 자들도
  lexicon: LSJ
  rationale: 현재 분사로서 거주자들을 가리키므로, 현대 한국어에서 가장 자연스러운 ‘사는 사람들’로 옮겼습니다.
- source_word: τοὺς μετοικίσαντας αὐτοῖς
  english_pob_choice: those who had settled among them
  chosen_korean: 그들 곁으로 이주해 온 사람들
  alternatives_korean:
  - 그들 가운데 정착한 사람들
  - 그들 사이로 옮겨 와 살게 된 사람들
  lexicon: LSJ
  rationale: μετοικίζω 계열은 이동·이주를 뜻하므로, ‘정착’보다 원문의 이동성을 살리는 ‘이주해 온’이 더 직접적입니다.
- source_word: τὴν ἄφεσιν
  english_pob_choice: the release
  chosen_korean: 풀어 줌
  alternatives_korean:
  - 면제
  - 사면
  - 용서
  lexicon: LSJ
  rationale: 이 문맥은 종교적 ‘용서’보다 행정적·사회적 허가에 가깝기 때문에, ‘release’에 대응하는 비유적이지만 중립적인 ‘풀어 줌’을 선택했습니다.
- source_word: παρὰ τῆς γερουσίας
  english_pob_choice: from the council of elders
  chosen_korean: 장로 회중으로부터의
  alternatives_korean:
  - 장로 परिषद으로부터의
  - 원로회의로부터의
  lexicon: LSJ
  rationale: γερουσία는 연장자들로 이루어진 의결 기구를 가리키므로, 뜻을 풀어 ‘장로 회중’으로 옮겼습니다.
theological_decisions:
- issue: ἄφεσις의 의미를 종교적 사면으로 볼지 행정적 해제로 볼지
  chosen_reading: 행정적·사회적 허가/해제의 의미로 이해하여 ‘풀어 줌’으로 번역했습니다.
  alternative_readings:
  - 용서
  - 사면
  - 면제
  rationale: 직전 문맥이 장로 회의체의 결정과 연결되므로, 죄 사함의 신학적 의미를 앞세우기보다 공동체적·행정적 의미를 보존하는 것이 더 적절합니다.
  doctrine_reference: 'DOCTRINE.md: Preserve theological tension rather than resolve it; consistency of key terms, or documented exception.'
