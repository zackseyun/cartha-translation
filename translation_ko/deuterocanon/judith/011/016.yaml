base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/011/016.yaml
  text: Therefore I[a], your servant, having learned all these things, fled from before them, and God sent me to do with you things at which the whole earth will be astonished[c][b], whenever they hear of them.
  footnotes:
  - marker: a
    text: Or 'from their presence.' The Greek expression is literally 'from before them.'
    reason: lexical_alternative
  - marker: b
    text: Or 'to accomplish things with you.' The Greek phrase is broad and does not specify more precisely how Holofernes is involved.
    reason: lexical_alternative
  - marker: c
    text: Or 'the whole world' or, in a narrower sense, 'all the land.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 저는, 당신의 종인 제가, 이 모든 것을 알고 도망하여 그들 앞에서 물러났습니다. 그리고 하나님께서 저를 보내셔서 당신과 함께 행하실 일들을 이루게 하셨으니, 그것들을 들을 때 온 땅이 놀라게 될 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그들 앞에서’는 직역하면 ‘그들의 앞/얼굴로부터’에 해당하는 표현입니다.
    reason: source_note
  - marker: b
    text: ‘당신과 함께 행하실 일들’은 원문의 넓은 표현으로, 어떤 방식으로 그 일이 이루어지는지는 더 구체화하지 않습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘온 땅’은 문맥에 따라 ‘온 세상’ 또는 더 좁게는 ‘온 나라’의 의미로도 읽힐 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅθεν
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 이러므로
  - 그래서
  lexicon: LSJ
  rationale: 앞선 진술에서 이끌어지는 결론을 표하는 접속어이므로, 현대 한국어에서 가장 자연스러운 인과·추론 연결어인 ‘그러므로’를 택했습니다.
- source_word: ἡ δούλη σου
  english_pob_choice: your servant
  chosen_korean: 당신의 종인 제가
  alternatives_korean:
  - 당신의 노예인 제가
  - 당신의 시종인 제가
  lexicon: BDAG
  rationale: δούλη의 종속적 자기호칭을 살리되, 홀로페르네스를 향한 예의 있는 말투를 반영해 ‘종’으로 옮겼습니다. ‘노예’는 본절의 사회적 화용을 지나치게 거칠게 만들 수 있습니다.
- source_word: ἀπὸ προσώπου αὐτῶν
  english_pob_choice: from before them
  chosen_korean: 그들 앞에서 물러났습니다
  alternatives_korean:
  - 그들의 얼굴 앞에서
  - 그들의 존재 앞에서
  - 그들 앞에서 도망했습니다
  lexicon: LSJ
  rationale: 직역적 ‘얼굴/앞’의 셈어적 표현을 한국어에서 자연스럽게 풀어, ‘from before them’의 방향성과 긴박함을 살린 표현으로 옮겼습니다.
- source_word: ποιῆσαι μετὰ σοῦ πράγματα
  english_pob_choice: to do with you deeds
  chosen_korean: 당신과 함께 행하실 일들을 이루게
  alternatives_korean:
  - 당신과 함께 일들을 하게
  - 당신과 더불어 사건들을 이루게
  - 당신과 함께 행할 일들을
  lexicon: LSJ
  rationale: πράγματα를 단순한 추상적 ‘일’로만 만들지 않으면서도 한국어에서 의미가 통하도록 ‘일들’로 옮겼고, μετὰ σοῦ의 동반성을 ‘당신과 함께’로 반영했습니다.
- source_word: ἐκστήσεται πᾶσα ἡ γῆ
  english_pob_choice: the whole earth will be astonished
  chosen_korean: 온 땅이 놀라게 될 것입니다
  alternatives_korean:
  - 온 세상이 놀랄 것입니다
  - 온 땅이 경악하게 될 것입니다
  - 온 세상이 경이로워할 것입니다
  lexicon: BDAG
  rationale: 과장된 보편성은 ‘온 땅’으로, 강한 놀라움은 ‘놀라게 될 것입니다’로 살렸습니다. ‘경악’은 너무 강하고 ‘경이로워하다’는 어감이 다릅니다.
- source_word: ὅσο ἐὰν ἀκούσωσιν αὐτά
  english_pob_choice: whenever they hear of them
  chosen_korean: 그것들을 들을 때
  alternatives_korean:
  - 그것들을 들을 때마다
  - 그것들을 듣게 될 때
  - 그 일들에 대해 들을 때
  lexicon: BDAG
  rationale: ἀκούσωσιν αὐτά의 직접 목적어를 유지하면서도 한국어에서는 사건 보도를 듣는 의미가 자연스럽게 드러나도록 간결하게 옮겼습니다.
theological_decisions:
- issue: 하나님의 파견 선언을 직접 서술로 유지할지 여부
  chosen_reading: ‘하나님께서 저를 보내셔서’라고 직설적으로 옮겨, 유디트의 직접 발화를 그대로 드러냈습니다.
  alternative_readings:
  - ‘하나님이 저를 보내셨다고 말했습니다’처럼 간접화
  - ‘하나님께서 저를 보내신 것이라 여겨’처럼 완화
  rationale: 본문은 화자의 주장 자체를 직접 인용하므로, 번역이 그 주장을 약화하거나 해석적으로 우회하지 않도록 했습니다.
  doctrine_reference: 서술자의 신학적 평가를 덧씌우지 말고, 직접 발화의 주장으로 보존
