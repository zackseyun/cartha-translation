  lexicon: BDAG
  rationale: 과장된 보편성은 ‘온 땅’으로, 강한 놀라움은 ‘놀라게 될 것입니다’로 살렸습니다. ‘경악’은 너무 강하고 ‘경이로워하다’는 어감이 다릅니다.
- source_word: ὅσο ἐὰν ἀκούσωσιν αὐτά
  english_pob_choice: whenever they hear of them
  chosen_korean: 그것들을 들을 때
  alternatives_korean:
  - 그것들을 들을 때마다
  - 그것들을 듣게 될 때
  - 그 일들에 대해 들을 때
  lexicon: BDAG
  rationale: ἀκούσωσιν αὐτά의 직접 목적어를 유지하면서도 한국어에서는 사건 보도를 듣는 의미가 자연스럽게 드러나도록 간결하게 옮겼습니다.
theological_decisions:
- issue: 하나님의 파견 선언을 직접 서술로 유지할지 여부
  chosen_reading: ‘하나님께서 저를 보내셔서’라고 직설적으로 옮겨, 유디트의 직접 발화를 그대로 드러냈습니다.
  alternative_readings:
  - ‘하나님이 저를 보내셨다고 말했습니다’처럼 간접화
  - ‘하나님께서 저를 보내신 것이라 여겨’처럼 완화
  rationale: 본문은 화자의 주장 자체를 직접 인용하므로, 번역이 그 주장을 약화하거나 해석적으로 우회하지 않도록 했습니다.
  doctrine_reference: 서술자의 신학적 평가를 덧씌우지 말고, 직접 발화의 주장으로 보존
