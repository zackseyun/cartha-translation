  lexicon: LSJ
  rationale: πράγματα를 단순한 추상적 ‘일’로만 만들지 않으면서도 한국어에서 의미가 통하도록 ‘일들’로 옮겼고, μετὰ σοῦ의 동반성을 ‘당신과 함께’로 반영했습니다.
- source_word: ἐκστήσεται πᾶσα ἡ γῆ
  english_pob_choice: the whole earth will be astonished
  chosen_korean: 온 땅이 놀라게 될 것입니다
  alternatives_korean:
  - 온 세상이 놀랄 것입니다
  - 온 땅이 경악하게 될 것입니다
