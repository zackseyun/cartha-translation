  source_fidelity: 개정이 필요합니다. 초안은 νῦν(‘이제’)과 λέγε μοι의 간접목적어(‘내게’)를 빠뜨렸습니다. 또한 γάρ는 앞선 질문의 이유를 덧붙이는 설명인데, ‘…때문입니다’는 한국어에서 앞 문장을 원인으로 삼는 듯하여 관계를 흐립니다. εἰς σωτηρίαν은 목적/귀착을 나타내므로 ‘구원을 위해’가 원문의 범위와 문맥을 무리 없이 보존합니다.
  naturalness: ‘당신은 구원으로 왔기 때문입니다’는 현대 한국어에서 어색하며, 특히 ‘구원으로 오다’는 결합이 자연스럽지 않습니다. ‘당신은 구원을 위해 오신 것입니다’는 합쇼체의 격식과 문맥상 설명 기능을 자연스럽게 살립니다.
  terminology: σωτηρία는 이 장면에서 반드시 죄로부터의 구원이라는 교리적 뜻으로 한정되지 않습니다. 본문의 ‘구원’을 유지하되, 각주에서 ‘구출’을 대안으로 제시하여 폭을 보존합니다. ‘안전’은 문맥적 의역으로 가능하지만 본문에 채택할 필요는 없습니다.
