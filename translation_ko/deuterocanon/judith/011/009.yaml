  terminology: ‘평의회’는 συνεδρεία에 적합한 중립적 공적 용어입니다. ‘살려 두다’는 περιεποίησαντο의 문맥상 생명 보존 의미를 잘 전달하며, ‘전하다’는 ἀπήγγειλεν에 자연스럽습니다. 인명과 지명은 아히오르, 베툴리아로 유지합니다.
