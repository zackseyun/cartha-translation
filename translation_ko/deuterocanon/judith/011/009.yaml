base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/011/009.yaml
  text: And now[a], concerning the matter that Achior spoke in your council, we have heard his words, because the men of Bethulia spared him[b], and he reported to them everything that he had spoken from you.
  footnotes:
  - marker: a
    text: Or 'saved him' for 'spared him'; the Greek verb can denote preserving or keeping someone safe.
    reason: lexical_alternative
  - marker: b
    text: Literally 'everything that he had spoken from you,' likely meaning everything he had said in your presence or before you.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 이제 아히오르가 당신의 평의회에서 말한 일에 관하여, 우리는 그의 말을 들었습니다. 베툴리아 사람들이 그를 살려 두었고, 그가 당신 앞에서 말한 모든 것을 그들에게 전하였기 때문입니다[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘구해 주었기 때문입니다’. 그리스어 동사는 어떤 사람을 보존하거나 안전하게 지키는 뜻도 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘당신에게서 그가 말한 모든 것’입니다. 여기서는 ‘당신 앞에서’ 또는 ‘당신의 면전에서’라는 뜻으로 이해하는 것이 자연스럽습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: λόγος
  english_pob_choice: matter
  chosen_korean: 일
  alternatives_korean:
  - 말
  - 내용
  - 사연
  lexicon: LSJ
  rationale: 여기서 λόγος는 단순한 ‘한 마디’가 아니라 아히오르가 말한 사안 전체를 가리키므로, 현대 한국어에서 자연스러운 ‘일’로 옮겨 의미 범위를 살렸습니다.
- source_word: συνεδρείᾳ
  english_pob_choice: council
  chosen_korean: 회중
  alternatives_korean:
  - 의회
  - 평의회
  - 공의회
  lexicon: LSJ
  rationale: 본문의 συνεδρεία는 공식적인 협의 모임을 뜻하지만, 유다서 내 문맥에서는 한 집단의 모임/협의체를 가리키므로 ‘회중’이 가장 무난하면서도 독자에게 인물들의 집단적 논의를 전달합니다.
- source_word: περιεποίησαντο
  english_pob_choice: spared
  chosen_korean: 살려 두었기 때문입니다
  alternatives_korean:
  - 살려 주었기 때문입니다
  - 보존하였기 때문입니다
  - 구해 주었기 때문입니다
  lexicon: LSJ
  rationale: 이 동사는 단순한 ‘구원’보다 상대를 해치지 않고 생명을 보존한 뜻이 핵심이므로, 문맥에 맞게 ‘살려 두다’로 풀어 번역했습니다.
- source_word: παρὰ σοί
  english_pob_choice: from you
  chosen_korean: 당신 앞에서
  alternatives_korean:
  - 당신에게서
  - 당신으로부터
  - 당신의 면전에서
  lexicon: LSJ
  rationale: παρά + 여격은 여기서 발화의 출처보다 ‘당신 앞/면전에서’라는 공간적·상황적 뉘앙스가 강하므로, ‘당신 앞에서’로 옮겨 오해를 줄였습니다.
theological_decisions:
- issue: 아히오르의 발화가 누구를 향한 것인지와 재진술의 방향
  chosen_reading: ‘당신 앞에서 말한 모든 것’으로 옮겨, 그가 홀로페르네스의 면전에서 했던 발화를 다시 전하는 구조를 드러냈습니다.
  alternative_readings:
  - ‘당신에게서 말한 모든 것’
  - ‘당신으로부터 들은 모든 것’
  rationale: 그리스어 ἐξελάλησεν παρὰ σοί는 발화의 출처보다 청중 앞에서 한 말이라는 상황성을 강조하므로, 한국어에서도 면전/앞에서라는 관계를 살리는 편이 본문의 서술 의도를 더 잘 전달합니다.
  doctrine_reference: 문맥적 번역 원리
- issue: ‘살려 두었다’의 인도적 의미
  chosen_reading: 베툴리아 사람들이 아히오르를 죽이지 않고 생명을 보전해 준 것으로 이해해 번역했습니다.
  alternative_readings:
  - 그를 구해 주었다
  - 그를 보존하였다
  rationale: 본문의 관심은 추상적 구원론이 아니라 실제로 그를 해치지 않고 보호한 행위이므로, 서사적·물리적 의미를 분명히 드러냈습니다.
  doctrine_reference: 서사 문맥 해석
