  yaml_path: translation/deuterocanon/judith/011/012.yaml
  text: For when their food had run out and all water had become scarce[a], they decided to use their livestock, and they determined to consume everything that God had commanded them by his laws not to eat.
  footnotes:
  - marker: a
    text: Or 'to resort to their livestock.' The Greek idiom literally says 'to fall upon their livestock,' implying turning to the animals as food in desperation.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들의 음식이 다 떨어지고 모든 물이 부족해졌기 때문에, 그들은 가축을 붙잡아 그것을 이용하기로 결정했고, 하나님께서 자기의 율법으로 그들에게 먹지 말라고 명령하신 모든 것을 소비하기로 결심했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그들의 가축에 달려들다’라는 관용구입니다. 절박한 상황에서 가축을 식량으로 삼으려는 뜻을 담습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξέλειπεν αὐτοὺς τὰ βρώματα
  english_pob_choice: their food had run out
  chosen_korean: 그들의 음식이 다 떨어지고
  alternatives_korean:
  - 그들의 음식이 고갈되고
  - 그들의 양식이 다하고
  lexicon: LSJ
  rationale: 복수형 βρώματα는 특정 요리보다 식량 전반을 가리키므로, 자연스러운 현대 한국어로 ‘음식’과 ‘다 떨어지다’를 써서 식량의 고갈 상태를 살렸습니다.
- source_word: ἐσπανίσθη πᾶν ὕδωρ
  english_pob_choice: all water had become scarce
  chosen_korean: 모든 물이 부족해졌기 때문에
  alternatives_korean:
  - 모든 물이 희귀해졌기 때문에
  - 물 공급이 모두 끊겼기 때문에
  lexicon: LSJ
  rationale: ἐσπανίσθη는 완전한 소멸보다 부족함을 뜻하므로 ‘부족해지다’로 옮겨, 물이 전반적으로 모자라는 상황을 과장 없이 반영했습니다.
- source_word: ἐπιβαλεῖν τοῖς κτήνεσιν αὐτῶν
  english_pob_choice: to use their livestock
  chosen_korean: 가축을 붙잡아 그것을 이용하기로
  alternatives_korean:
  - 가축에 손을 대기로
  - 가축을 붙들어 그것에 의지하기로
  - 가축을 도살해 먹기로
  lexicon: LSJ
  rationale: 이 관용구는 절박함 속에서 가축을 식량으로 삼으려는 방향을 나타내므로, 직역의 충격은 살리되 한국어에서는 ‘이용하다’로 의미를 분명하게 했습니다.
- source_word: διέγνωσαν δαπανῆσαι
  english_pob_choice: they determined to consume
  chosen_korean: 소비하기로 결심했습니다
  alternatives_korean:
  - 먹어 치우기로 결심했습니다
  - 먹기로 결정했습니다
  - 다 써버리기로 결심했습니다
  lexicon: LSJ
  rationale: δαπανᾶν은 ‘소모하다/소비하다’의 뜻이 있어, 단순한 식사보다 절박하게 자원을 소진하는 느낌을 살려 ‘소비하다’를 선택했습니다.
theological_decisions:
- issue: 하나님이 금지하신 음식 규정의 표현
  chosen_reading: 하나님께서 자기의 율법으로 그들에게 먹지 말라고 명령하신 모든 것
  alternative_readings:
  - 하나님께서 율법에서 그들에게 먹지 말라고 금하신 모든 것
  - 하나님께서 자기 율법으로 그들에게 먹지 말라고 규정하신 모든 것
  rationale: 본문은 특정 토라 구절을 지목하지 않고, 하나님의 법적 명령을 일반적으로 상기시키므로, 금지의 근거를 ‘자기의 율법’에 둔 채 구체 절차법으로 좁히지 않았습니다.
  doctrine_reference: Translation philosophy §§1, 5
