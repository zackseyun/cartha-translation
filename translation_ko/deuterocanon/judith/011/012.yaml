  rationale: 가축에 관한 그리스어 관용구를 한국어의 자연스러운 관용 표현인 ‘가축에 손을 대다’로 옮기고, 각주를 해당 표현에 직접 연결했습니다. 금지된 것을 ‘소비하다’라는 추상적 표현 대신 ‘먹어 버리다’로 고쳐 본문의 식량·금지 음식 문맥과 δαπανῆσαι의 소진 의미를 살렸습니다. 하나님의 율법에 의한 금지라는 원문의 범위와 모호성은 유지했습니다.
