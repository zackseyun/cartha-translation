- from: 이는 당신의 여종이 하나님을 경외하며 밤낮으로 하늘의 하나님을 섬기기 때문입니다. 이제 저는 제 주인님 곁에 머물겠으며, 당신의 여종이 밤에 골짜기로 나가 하나님께 기도하면, 그분께서 그들이 언제 자기들의 죄를 범하였는지 저에게 말씀해 주실 것입니다.[a][b]
