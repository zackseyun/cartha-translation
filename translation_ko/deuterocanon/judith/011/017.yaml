  text: for your servant is God-fearing[a], and serves the God of heaven night and day. And now I will remain with you, my lord, and your servant will go out by night into the valley, and I will pray to God[b], and he will tell me when they have committed their sin.
  footnotes:
  - marker: a
    text: Or 'slave' for 'your servant' (Greek δούλη); the term can denote a female slave, but here it functions as deferential self-reference.
    reason: lexical_alternative
  - marker: b
    text: Or 'ravine' or 'gorge' for 'valley' (Greek φάραγξ).
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 당신의 여종이 하나님을 경외하며 밤낮으로 하늘의 하나님을 섬기기 때문입니다. 이제 저는 제 주인님 곁에 머물겠으며, 당신의 여종이 밤에 골짜기로 나가 하나님께 기도하면, 그분께서 그들이 언제 자기들의 죄를 범하였는지 저에게 말씀해 주실 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘노예’로도 옮길 수 있습니다(그리스어 δούλη). 여기서는 예의적 자기호칭이지만, 여성형 종속 신분의 뉘앙스가 남아 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘협곡’이나 ‘계곡’으로도 옮길 수 있습니다(그리스어 φάραγξ).
    reason: lexical_alternative
lexical_decisions:
- source_word: δούλη
  english_pob_choice: servant
  chosen_korean: 여종
  alternatives_korean:
  - 종
  - 노예
  - 하녀
  lexicon: BDAG
  rationale: 여기서는 자기 낮춤의 예의적 자기호칭이지만, 여성형 δούλη의 종속 상태도 완전히 지워지지 않도록 중립적이면서도 성별이 드러나는 ‘여종’으로 옮겼습니다.
- source_word: θεοσεβής
