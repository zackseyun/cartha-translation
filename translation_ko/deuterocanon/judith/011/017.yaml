  yaml_path: translation/deuterocanon/judith/011/017.yaml
  text: for your servant is God-fearing[a], and serves the God of heaven night and day. And now I will remain with you, my lord, and your servant will go out by night into the valley, and I will pray to God[b], and he will tell me when they have committed their sin.
  footnotes:
  - marker: a
    text: Or 'slave' for 'your servant' (Greek δούλη); the term can denote a female slave, but here it functions as deferential self-reference.
    reason: lexical_alternative
  - marker: b
    text: Or 'ravine' or 'gorge' for 'valley' (Greek φάραγξ).
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 당신의 여종[a]이 하나님을 경외하며 밤낮으로 하늘의 하나님을 섬기기 때문입니다. 이제 저는 주인님 곁에 머물겠으며, 이 여종은 밤에 골짜기[b]로 나가 하나님께 기도하겠습니다. 그러면 그분께서 그들이 언제 자기들의 죄를 범하였는지 저에게 말씀해 주실 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘노예’로 옮길 수 있습니다(그리스어 δούλη). 여기서는 예의적 자기호칭이지만, 여성 종속 신분을 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘협곡’이나 ‘계곡’으로 옮길 수 있습니다(그리스어 φάραγξ).
    reason: lexical_alternative
lexical_decisions:
- source_word: δούλη
  english_pob_choice: servant
  chosen_korean: 여종
  alternatives_korean:
  - 종
  - 노예
  - 하녀
  lexicon: BDAG
  rationale: 여기서는 자기 낮춤의 예의적 자기호칭이지만, 여성형 δούλη의 종속 상태도 완전히 지워지지 않도록 중립적이면서도 성별이 드러나는 ‘여종’으로 옮겼습니다.
- source_word: θεοσεβής
  english_pob_choice: God-fearing
  chosen_korean: 하나님을 경외하며
  alternatives_korean:
  - 하나님을 두려워하며
  - 경건하며
  - 하나님을 공경하며
  lexicon: LSJ
  rationale: 형용사의 핵심인 ‘하나님을 향한 경외’를 한국어에서 가장 직접적으로 드러내기 위해 ‘하나님을 경외하며’로 풀었습니다.
- source_word: θεραπεύουσα
  english_pob_choice: serves
  chosen_korean: 섬기기
  alternatives_korean:
  - 예배드리기
  - 시중들기
  - 섬기며
  lexicon: LSJ
  rationale: 문맥상 단순 노동보다 종교적·지속적 봉사를 뜻하므로, ‘예배’로 좁히지 않고 ‘섬기기’로 넓게 유지했습니다.
- source_word: τὸν θεὸν τοῦ οὐρανοῦ
  english_pob_choice: the God of heaven
  chosen_korean: 하늘의 하나님
  alternatives_korean:
  - 하늘 하나님
  - 하늘의 신
  - 천상의 하나님
  lexicon: LSJ
  rationale: 정관사 구조를 살리면서도 한국어에서 자연스럽게 읽히도록 ‘하늘의 하나님’으로 옮겼습니다.
- source_word: φάραγγα
  english_pob_choice: the valley
  chosen_korean: 골짜기
  alternatives_korean:
  - 계곡
  - 협곡
  - 산골짜기
  lexicon: LSJ
  rationale: φάραγξ는 골짜기/협곡/계곡을 모두 가리킬 수 있으나, 문맥상 지형의 대강을 드러내는 ‘골짜기’가 가장 무난합니다.
theological_decisions:
- issue: κύριε μου의 호칭 처리
  chosen_reading: 제 주인님
  alternative_readings:
  - 저의 주님
  - 제 주인
  - 나의 주인님
  rationale: 헬라어의 κύριε μου는 여기서 신적 칭호가 아니라 홀로페르네스에게 대한 신하적 존칭이므로, 예수/하나님께 쓰는 ‘주님’을 피하고 권력 관계를 드러내는 ‘주인님’으로 옮겼습니다.
  doctrine_reference: 'DOCTRINE.md— κύριος: 문맥에 따라 ‘주님’/사회적 존칭 구분'
