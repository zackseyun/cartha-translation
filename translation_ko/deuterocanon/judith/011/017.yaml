  chosen_korean: 하나님을 경외하며
  alternatives_korean:
  - 하나님을 두려워하며
  - 경건하며
  - 하나님을 공경하며
  lexicon: LSJ
  rationale: 형용사의 핵심인 ‘하나님을 향한 경외’를 한국어에서 가장 직접적으로 드러내기 위해 ‘하나님을 경외하며’로 풀었습니다.
- source_word: θεραπεύουσα
  english_pob_choice: serves
  chosen_korean: 섬기기
  alternatives_korean:
  - 예배드리기
  - 시중들기
  - 섬기며
  lexicon: LSJ
  rationale: 문맥상 단순 노동보다 종교적·지속적 봉사를 뜻하므로, ‘예배’로 좁히지 않고 ‘섬기기’로 넓게 유지했습니다.
- source_word: τὸν θεὸν τοῦ οὐρανοῦ
  english_pob_choice: the God of heaven
  chosen_korean: 하늘의 하나님
  alternatives_korean:
  - 하늘 하나님
  - 하늘의 신
  - 천상의 하나님
  lexicon: LSJ
  rationale: 정관사 구조를 살리면서도 한국어에서 자연스럽게 읽히도록 ‘하늘의 하나님’으로 옮겼습니다.
- source_word: φάραγγα
  english_pob_choice: the valley
  chosen_korean: 골짜기
  alternatives_korean:
  - 계곡
  - 협곡
  - 산골짜기
  lexicon: LSJ
  rationale: φάραγξ는 골짜기/협곡/계곡을 모두 가리킬 수 있으나, 문맥상 지형의 대강을 드러내는 ‘골짜기’가 가장 무난합니다.
theological_decisions:
- issue: κύριε μου의 호칭 처리
  chosen_reading: 제 주인님
  alternative_readings:
  - 저의 주님
  - 제 주인
  - 나의 주인님
  rationale: 헬라어의 κύριε μου는 여기서 신적 칭호가 아니라 홀로페르네스에게 대한 신하적 존칭이므로, 예수/하나님께 쓰는 ‘주님’을 피하고 권력 관계를 드러내는 ‘주인님’으로 옮겼습니다.
  doctrine_reference: 'DOCTRINE.md— κύριος: 문맥에 따라 ‘주님’/사회적 존칭 구분'
