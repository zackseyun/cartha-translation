  text: And now[a], if your people who live in the hill country had not treated me with contempt, I would not have raised my spear against them; but they themselves have brought these things on themselves.
  footnotes:
  - marker: a
    text: Or, 'had not slighted me' or 'had not insulted me.' The Greek verb conveys treating someone as of little account.
    reason: lexical_alternative
translation:
  language: ko
  text: 이제, 당신의 백성 곧 산지에 사는 그 백성이 나를 업신여기지 않았더라면, 나는 그들에게 내 창을 들어 올리지 않았을 것입니다. 그러나 그들 자신이 이런 일들을 자초했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘나를 업신여기지 않았더라면’의 뜻입니다. 헬라어 동사는 사람을 ‘하찮게 여기다’는 의미를 담고 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ λαός σου
  english_pob_choice: your people
  chosen_korean: 당신의 백성
  alternatives_korean:
  - 당신의 민족
  - 당신의 사람들
  lexicon: LSJ
  rationale: λαός는 집합적 ‘백성’의 뜻이 자연스럽고, 직접 화법에서 소속 관계를 분명히 드러냅니다.
- source_word: ὁ κατοικῶν τὴν ὀρεινήν
  english_pob_choice: who live in the hill country
  chosen_korean: 산지에 사는
  alternatives_korean:
  - 산간 지역에 사는
  - 고지대에 거주하는
  lexicon: LSJ
  rationale: 분사구가 앞의 ‘백성’을 수식하므로, 지리적 의미를 살리면서 현대 한국어로는 ‘산지에 사는’이 가장 자연스럽습니다.
- source_word: ἐφαύλισάν με
  english_pob_choice: treated me with contempt
  chosen_korean: 나를 업신여기지 않았더라면
  alternatives_korean:
  - 나를 경멸하지 않았더라면
  - 나를 하찮게 여기지 않았더라면
  - 나를 깔보지 않았더라면
  lexicon: LSJ
  rationale: ἐφαυλίζω는 ‘하찮게 여기다, 얕보다, 업신여기다’의 뉘앙스를 가지므로, 반의 조건문에서는 ‘업신여기다’가 가장 밀착합니다.
- source_word: ἦρα τὸ δόρυ μου
  english_pob_choice: I would not have raised my spear
  chosen_korean: 내 창을 들어 올리지 않았을 것입니다
  alternatives_korean:
  - 내 창을 치켜들지 않았을 것입니다
  - 내 창을 높이 들지 않았을 것입니다
  lexicon: LSJ
  rationale: δόρυ는 전투용 무기인 ‘창’이 적절하며, αἴρω는 무기를 ‘들어 올리다/치켜들다’의 뜻이므로 동작을 분명히 했습니다.
- source_word: ἀλλὰ αὐτοὶ ἑαυτοῖς ἐποίησαν ταῦτα
  english_pob_choice: but they themselves have brought these things on themselves
  chosen_korean: 그러나 그들 자신이 이런 일들을 자초했습니다
  alternatives_korean:
  - 그러나 그들 자신이 이런 일들을 자신들에게 가져왔습니다
  - 그러나 그들 자신이 이런 일들을 스스로 일으켰습니다
  lexicon: LSJ
  rationale: 반사대명사 ἑαυτοῖς는 자기 초래의 책임을 강조하므로, 한국어 관용에 맞는 ‘자초하다’가 원문의 책임 귀속을 잘 전달합니다.
theological_decisions:
- issue: 결과의 책임을 어디까지 명시할지
  chosen_reading: 마지막 절은 그들이 스스로 원인을 제공했다는 책임을 직접 말하고, 하나님의 심판이나 운명론은 덧붙이지 않았습니다.
  alternative_readings:
  - 그들이 하나님의 벌을 자초했습니다
  - 그들이 스스로 파멸을 불러왔습니다
  rationale: 헬라어 본문은 자초한 결과를 진술할 뿐이므로, 추가적인 신학적 해석으로 책임의 범위를 확장하지 않았습니다.
  doctrine_reference: 본문이 말하는 책임 귀속을 유지하고, 본문 밖의 신학적 설명은 보류합니다.
