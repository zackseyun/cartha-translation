    issue: 금지 표현의 한국어 문법과 각주 위치
    rationale: ‘누구도 … 허락되지 않습니다’보다 ‘어느 누구에게도 … 허락되지 않습니다’가 자연스럽습니다. 두 각주는 각각 해당 표현 바로 뒤에 두어 앵커가 가리키는 대상을 분명히 해야 합니다.
