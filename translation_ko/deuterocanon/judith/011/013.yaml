base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/011/013.yaml
  text: And the firstfruits of the grain and the tithes of the wine and of the oil[a], which they had set aside, having consecrated them for the priests who stand in Jerusalem before the face of our God—they have decided to consume[b], though it is not permitted for any of the people even to touch them with their hands.
  footnotes:
  - marker: a
    text: Or 'before our God.' The Greek more literally says 'before the face of our God,' a vivid expression for being in God's presence.
    reason: lexical_alternative
  - marker: b
    text: Or 'it is not lawful' or 'it is not fitting' for any of the people even to touch them with their hands.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 곡식의 첫 열매와 포도주의 십분의 일과 기름의 십분의 일, 곧 그것들을 거룩하게 구별하여 예루살렘에서 우리 하나님의 면전에서[a] 서 있는 제사장들을 위하여 보관해 둔 것을 소비하기로 결정했습니다. 그러나 백성 가운데 어느 누구에게도 그것들을 손으로 만지는 것조차 허락되지 않습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘우리 하나님의 얼굴 앞에서’입니다. 이는 우리 하나님의 임재 가운데 있다는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘허락되지 않습니다’는 원문을 달리 옮기면 ‘합당하지 않습니다’ 또는 ‘마땅하지 않습니다’가 될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπαρχὰς τοῦ σίτου
  english_pob_choice: the firstfruits of the grain
  chosen_korean: 밀의 첫 수확물
  alternatives_korean:
  - 곡식의 첫 열매
  - 곡식의 첫 수확분
  lexicon: LSJ
  rationale: ἀπαρχή는 제의적으로 먼저 떼어 바치는 첫 부분을 가리키므로, 한국어에서는 ‘첫 수확물’이 제의적 의미와 자연스러움을 함께 살립니다.
- source_word: δεκάτας τοῦ οἴνου καὶ τοῦ ἐλαίου
  english_pob_choice: the tithes of the wine and of the oil
  chosen_korean: 포도주의 십분의 일과 기름의 십분의 일
  alternatives_korean:
  - 포도주와 기름의 십일조
  - 포도주와 기름의 열의 하나
  lexicon: LSJ
  rationale: δεκάτη는 교회 용어 ‘십일조’가 익숙하지만, 원문의 수량 표현과 제의적 경제성을 드러내기 위해 ‘십분의 일’로 옮겼습니다.
- source_word: ἐφυλάξαν ἁγιάσαντες
  english_pob_choice: which they had set aside, having consecrated them
  chosen_korean: 그것들을 거룩하게 구별하여 … 보관해 둔 것이지만
  alternatives_korean:
  - 그것들을 따로 떼어 두고 거룩하게 한 것이지만
  - 그것들을 지켜 두고 성별한 것이지만
  lexicon: LSJ
  rationale: φυλάσσω의 ‘지키다/보관하다’와 ἁγιάζω의 ‘거룩하게 구별하다’를 함께 살려, 단순 보관이 아니라 성소적 분리를 분명히 했습니다.
- source_word: ἀπέναντι τοῦ προσώπου τοῦ θεοῦ ἡμῶν
  english_pob_choice: before the face of our God
  chosen_korean: 우리 하나님 앞
  alternatives_korean:
  - 우리 하나님 앞에
  - 우리 하나님 면전에서
  lexicon: LSJ
  rationale: 직역하면 ‘우리 하나님 얼굴 앞에서’이지만, 한국어에서는 ‘앞’으로 옮기되 그 긴장감은 본문에 남겨 두었습니다.
- source_word: ἐξαναλῶσαι
  english_pob_choice: to consume
  chosen_korean: 소모하기로
  alternatives_korean:
  - 먹어 치우기로
  - 다 써 버리기로
  lexicon: LSJ
  rationale: ἐξαναλίσκω는 완전히 써 버리거나 소비하는 뜻이어서, 제의적 재물을 음식처럼 처리하는 뉘앙스를 살리되 과도하게 속어화하지 않도록 ‘소모하다’를 택했습니다.
theological_decisions:
- issue: 거룩하게 구별된 제사장 몫의 절대적 금지
  chosen_reading: 본문은 예루살렘의 제사장들을 위해 거룩하게 구별된 제물을 평민이 손대는 것조차 금지된 것으로 제시합니다.
  alternative_readings:
  - 단지 관례적으로 따로 둔 물품이라는 약한 의미로 읽을 수 있습니다.
  rationale: ἁγιάσαντες와 ‘손으로 닿는 것조차 허락되지 않는다’는 진술이 결합되어, 단순한 임시 보관이 아니라 성별된 제의 재물의 성격을 강하게 요구합니다.
  doctrine_reference: 'DOCTRINE.md: Original-language primacy; Preserve theological tension rather than resolve it'
