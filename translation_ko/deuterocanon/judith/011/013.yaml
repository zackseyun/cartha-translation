revisions:
- from: 밀의 첫 수확물과 포도주의 십분의 일과 기름의 십분의 일은 — 그것들을 거룩하게 구별하여 예루살렘에 서 있는 우리 하나님 앞의 제사장들을 위해 보관해 둔 것이지만 — 그들은 그것들을 소모하기로 결정했습니다. 그러나 백성 가운데 누구도 손으로 그것들에 닿는 것조차 허락되지 않습니다.[a][b]
  to: 그들은 곡식의 첫 열매와 포도주의 십분의 일과 기름의 십분의 일, 곧 그것들을 거룩하게 구별하여 예루살렘에서 우리 하나님의 면전에서[a] 서 있는 제사장들을 위하여 보관해 둔 것을 소비하기로 결정했습니다. 그러나 백성 가운데 어느 누구에게도 그것들을 손으로 만지는 것조차 허락되지 않습니다.[b]
  rationale: ‘밀’을 ‘곡식’으로 바꾸어 σῖτος의 범위를 보존했고, 제사장들을 수식하는 장소·임재 표현의 관계를 명료하게 정리했습니다. 원문의 성별·보관·소비와 일반 백성의 접촉 금지를 모두 유지했으며, 각주 앵커를 해당 어구에 직접 배치했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T18:55:38Z'
review_pass:
  verdict: revise
  source_fidelity: 수정이 필요합니다. σῖτος는 문맥상 특정한 ‘밀’보다 포괄적인 ‘곡식’으로 옮기는 편이 안전합니다. 또한 τοῖς ἱερεῦσιν τοῖς παρεστηκόσιν ἐν Ἰερουσαλὴμ ἀπέναντι τοῦ προσώπου τοῦ θεοῦ ἡμῶν은 ‘예루살렘에서 우리 하나님의 면전에서 서 있는 제사장들’을 수식하므로, 기존 문장의 ‘우리 하나님 앞의 제사장들’은 수식 관계가 불명확합니다. κεκρίκασιν ἐξαναλῶσαι는 ‘소비하기로 결정했습니다’로 충실히 반영할 수 있습니다.
  naturalness: 기존 번역은 긴 삽입절과 ‘백성 가운데 누구도 … 허락되지 않습니다’라는 결합 때문에 다소 부자연스럽습니다. 주절을 먼저 두고 관계절을 ‘곧’으로 풀며, 금지 표현을 ‘어느 누구에게도 … 허락되지 않습니다’로 고치면 현대 표준 한국어 합쇼체로 자연스럽습니다.
  terminology: ‘첫 열매’, ‘십분의 일’, ‘거룩하게 구별하다’, ‘제사장’, ‘하나님의 면전’, ‘소비하다’는 원문의 제의적 의미를 과도한 교단 용어 없이 적절히 전달합니다. ‘면전’에는 각주를 붙여 원문의 ‘얼굴 앞’이라는 강조를 보존합니다.
  issues:
