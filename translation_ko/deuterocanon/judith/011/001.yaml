base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/011/001.yaml
  text: And Holofernes said to her[a], “Take courage, woman; do not be afraid in your heart[c][b], for I have harmed no man who has chosen to serve King Nebuchadnezzar of all the earth.”
  footnotes:
  - marker: a
    text: Or “do not fear in your heart.”
    reason: lexical_alternative
  - marker: b
    text: Or “who has preferred to serve.”
    reason: lexical_alternative
  - marker: c
    text: The phrase “king ... of all the earth” reflects the speaker’s imperial claim; “earth” could also be rendered “land” in other contexts.
    reason: cultural_note
translation:
  language: ko
  text: 그러자 홀로페르네스가 그녀에게 말했습니다. 「용기를 내십시오, 여인이여. 마음속으로 두려워하지 마십시오.[a] 내가 온 땅의 왕 느부갓네살을 섬기기로 선택한 사람을 해친 적이 없기 때문입니다.[b][c]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘마음으로 두려워하지 마십시오.’
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘섬기기를 선호한.’
    reason: lexical_alternative
  - marker: c
    text: ‘온 땅의 왕’은 화자의 제국적 주장을 반영합니다. 그리스어 γῆ는 다른 문맥에서는 ‘땅’ 또는 ‘영토’를 뜻할 수도 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: Θάρσησον
  english_pob_choice: Take courage
  chosen_korean: 용기를 내십시오
  alternatives_korean:
  - 담대하십시오
  - 마음을 내십시오
  - 용기를 가지십시오
  lexicon: LSJ
  rationale: 명령형으로 주는 격려의 힘을 살리면서, 현대 한국어에서 자연스럽고 정중한 표현으로 옮겼습니다.
- source_word: γύναι
  english_pob_choice: woman
  chosen_korean: 여인아
  alternatives_korean:
