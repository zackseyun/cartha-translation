  lexicon: LSJ
  rationale: 직접 호칭의 대상을 분명히 하되, 원문의 평이한 호격을 과도하게 미화하지 않도록 했습니다.
- source_word: μὴ φοβηθῇς τῇ καρδίᾳ σου
  english_pob_choice: do not be afraid in your heart
  chosen_korean: 마음으로 두려워하지 마십시오
  alternatives_korean:
  - 마음속으로 두려워하지 마십시오
  - 당신의 마음이 두려워하지 않게 하십시오
  - 마음에 두려워하지 마십시오
  lexicon: LSJ
  rationale: καρδία의 내면적 위치를 한국어의 ‘마음’으로 살리되, 직역 투의 어색함을 피하면서도 내부의 두려움을 유지했습니다.
- source_word: ἐκάκωσα
  english_pob_choice: have harmed
  chosen_korean: 해친 적이 없기 때문입니다
  alternatives_korean:
  - 해를 끼친 적이 없기 때문입니다
  - 해롭게 한 적이 없기 때문입니다
  - 괴롭힌 적이 없기 때문입니다
  lexicon: LSJ
  rationale: κακόω의 일반적 의미를 반영해 물리적 폭력보다 넓은 ‘해치다’로 옮겼습니다.
- source_word: ὅστις ἡρέτικεν δουλεύειν
  english_pob_choice: who has chosen to serve
  chosen_korean: 섬기기로 선택한
  alternatives_korean:
  - 섬기기로 정한
  - 섬기기를 택한
  - 섬기기로 마음먹은
  lexicon: LSJ
  rationale: ἡρέτικεν의 ‘선택하다’와 δουλεύειν의 정치적 복속 뉘앙스를 함께 살리되, 한국어에서는 ‘섬기다’가 가장 자연스럽고 본문의 맥락에 맞습니다.
- source_word: βασιλεῖ Ναβουχοδονόσορ πάσης τῆς γῆς
  english_pob_choice: King Nebuchadnezzar of all the earth
  chosen_korean: 온 땅의 왕 느부갓네살
  alternatives_korean:
  - 온 세상의 왕 느부갓네살
  - 온 땅을 다스리는 왕 느부갓네살
  - 온 땅의 느부갓네살 왕
  lexicon: LSJ
  rationale: 바로 뒤에 붙는 위세적 칭호를 살려 ‘온 땅’으로 옮겼고, 한국어 어순에 맞게 왕호를 앞세웠습니다.
