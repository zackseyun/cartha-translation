  - 온 땅을 다스리는 왕 느부갓네살
  - 온 땅의 느부갓네살 왕
  lexicon: LSJ
  rationale: 바로 뒤에 붙는 위세적 칭호를 살려 ‘온 땅’으로 옮겼고, 한국어 어순에 맞게 왕호를 앞세웠습니다.
