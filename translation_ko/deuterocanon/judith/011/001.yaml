  text: And Holofernes said to her[a], “Take courage, woman; do not be afraid in your heart[c][b], for I have harmed no man who has chosen to serve King Nebuchadnezzar of all the earth.”
  footnotes:
  - marker: a
    text: Or “do not fear in your heart.”
    reason: lexical_alternative
  - marker: b
    text: Or “who has preferred to serve.”
    reason: lexical_alternative
  - marker: c
    text: The phrase “king ... of all the earth” reflects the speaker’s imperial claim; “earth” could also be rendered “land” in other contexts.
    reason: cultural_note
translation:
  language: ko
  text: 그러자 오로페르네스가 그녀에게 말했습니다. 「용기를 내십시오, 여인아. 마음으로 두려워하지 마십시오. 내가 온 땅의 왕 느부갓네살에게 섬기기로 선택한 사람을 해친 적이 없기 때문입니다.」[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘마음으로 두려워하지 마십시오’도 가능합니다.
    reason: alternative_reading
  - marker: b
    text: ‘섬기기로 선택한’은 ‘섬기기를 선호한’으로도 옮길 수 있습니다.
    reason: alternative_reading
  - marker: c
    text: ‘온 땅’은 여기서 제국적 과장을 반영하며, 문맥에 따라 ‘땅’으로도 옮길 수 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: Θάρσησον
