translation:
  language: ko
  text: 그리고 제가 와서, 당신 앞에 길을 열어 드리면, 당신은 자기 모든 군세를 거느리고 나가게 될 것이며, 그들 가운데 당신을 대적할 자는 아무도 없을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘길’은 그리스어에 직접 나오지는 않지만, 영어 POB 주석처럼 문맥상 implied 된 대상을 한국어에서 보완한 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθοῦσα
  english_pob_choice: when I come
  chosen_korean: 제가 와서
  alternatives_korean:
  - 제가 오면
  - 제가 도착하면
  lexicon: LSJ
  rationale: 여성 단수 분사로 유디트 자신을 가리키며, 영어의 시간절처럼 한국어에서도 자연스럽게 사건의 선후를 드러내는 표현을 택했습니다.
- source_word: προανοίσω
  english_pob_choice: I will open the way before you
  chosen_korean: 당신 앞에 길을 열어 드리면
  alternatives_korean:
  - 당신 앞에 미리 열어 드리면
  - 당신 앞에서 미리 열어 드리면
  lexicon: LSJ
  rationale: 동사는 ‘미리/앞서 열다’의 뜻을 가지며, 영어 주석처럼 대상이 직접 드러나지 않는 점을 반영해 ‘길’을 자연스럽게 보완했습니다.
- source_word: σὺν πάσῃ τῇ δυνάμει σου
  english_pob_choice: with all your force
  chosen_korean: 자기 모든 군세를 거느리고
  alternatives_korean:
  - 자기 모든 힘으로
  - 자기 모든 병력과 함께
  lexicon: LSJ
  rationale: δύναμις는 여기서 단순한 개인적 ‘힘’보다 군사적 역량/전력을 가리키므로, 전투 맥락을 살려 ‘군세’를 선택했습니다.
- source_word: οὐκ ἔστιν ὃς ἀντιστήσεταί σοι
  english_pob_choice: there is none ... who will stand against you
  chosen_korean: 당신을 대적할 자는 아무도 없을 것입니다
  alternatives_korean:
  - 당신에게 맞설 자는 아무도 없을 것입니다
  - 당신 앞에 서서 막을 자는 아무도 없을 것입니다
  lexicon: LSJ
  rationale: ἀνθίστημι의 ‘맞서다/대적하다’ 의미를 살리면서, 한국어에서는 ‘대적할 자’가 가장 응축적이고 자연스럽습니다.
theological_decisions:
- issue: 유디트의 약속이 장차 있을 군사적 승리를 보증하는 방식
  chosen_reading: 본절은 단순한 이동 예고가 아니라, 그녀가 길을 열면 군대가 전진하고 아무도 저항하지 못하리라는 전략적 확언으로 옮겼습니다.
  alternative_readings:
  - 중립적으로 ‘나가게 될 것입니다’만 번역해 약속의 힘을 약화시키는 방식
  - ‘진격하게 될 것입니다’로 더 강하게 군사화하는 방식
  rationale: 문맥상 군사 작전의 성공을 약속하는 문장이라, 과장 없이도 전투적 뉘앙스가 드러나도록 정리했습니다.
  doctrine_reference: 문맥 신학/서사적 화법
