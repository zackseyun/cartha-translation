  text: And when I come[a], I will open the way before you, and you will go out with all your force, and there is none among them who will stand against you.
  footnotes:
  - marker: a
    text: Or, 'I will open beforehand for you.' The Greek verb can mean to open in advance; 'the way' is implied by context rather than stated explicitly.
