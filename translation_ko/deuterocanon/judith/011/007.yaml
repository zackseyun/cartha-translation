  lexicon: LSJ
  rationale: ψυχή를 영혼의 내적 실체로 제한하지 않고, POB 주석처럼 살아 있는 존재 전체를 가리키는 뜻을 한국어로 간결하게 옮겼습니다.
- source_word: διὰ σὲ δουλεύσουσιν αὐτῷ
  english_pob_choice: will serve him because of you
  chosen_korean: 당신 때문에 사람들뿐 아니라 ... 살아 있을 것입니다
  alternatives_korean:
