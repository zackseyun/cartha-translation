  alternatives_korean:
  - 온 땅의 왕 느부갓네살
  - 느부갓네살 왕, 온 땅의 왕
  lexicon: LSJ
  rationale: 원문의 왕호와 보편 지배 표현을 살리되, 한국어 문장 흐름에 맞게 왕호를 앞에 두었습니다.
- source_word: τὸ κράτος
  english_pob_choice: dominion
  chosen_korean: 통치
  alternatives_korean:
