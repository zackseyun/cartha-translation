base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/011/007.yaml
  text: For King Nebuchadnezzar[a], of all the earth, lives, and his dominion lives—he who sent you for the success of every living soul. For not only will men serve him because of you[c][b], but also the wild animals and the cattle and the birds of the sky will live under your strength for Nebuchadnezzar and all his house.
  footnotes:
  - marker: a
    text: Or 'for the accomplishment/prosperity of every person.' The Greek phrase 'every living soul' likely means every life or living being, not specifically the immaterial soul.
    reason: lexical_alternative
  - marker: b
    text: 'Traditional wording: ''the beasts of the field ... the birds of heaven.'''
    reason: lexical_alternative
  - marker: c
    text: The final clause is rhetorically compressed in Greek and may also be understood, 'will live for Nebuchadnezzar and all his house by your strength.'
    reason: alternative_reading
translation:
  language: ko
  text: 온 땅의 왕이신 느부갓네살 왕께서는 살아 계시고, 그의 권세도 살아 있습니다. 그분께서는 모든 생명체의 번영을 위하여 당신을 보내셨습니다. 사람들이 당신 때문에 그를 섬길 것뿐 아니라, 들의 짐승과 가축과 하늘의 새들도 당신의 힘으로 느부갓네살과 그의 온 집안을 위해 살아갈 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문의 ‘모든 생명체’에 해당하는 표현은 여기서 비물질적 영혼만을 뜻하기보다, 모든 생명 또는 살아 있는 존재를 가리킬 가능성이 큽니다.
    reason: lexical_alternative
  - marker: b
    text: '전통 번역: ‘들의 짐승들 … 하늘의 새들’.'
    reason: lexical_alternative
  - marker: c
    text: 앞의 ‘당신 때문에’는 διὰ + 대격으로 원인을 나타냅니다. 마지막 ‘당신의 힘으로’는 διὰ + 속격으로 수단을 나타냅니다. 마지막 절은 그리스어에서 수사적으로 압축되어, ‘당신의 힘으로 느부갓네살과 그의 온 집안을 위해 살 것이다’ 또는 ‘느부갓네살과 그의 온 집안을 위해 당신의 힘으로 살 것이다’로 이해될 수 있습니다.
    reason: alternative_reading
