  to: 온 땅의 왕이신 느부갓네살 왕께서는 살아 계시고, 그의 권세도 살아 있습니다. 그분께서는 모든 생명체의 번영을 위하여 당신을 보내셨습니다. 사람들이 당신 때문에 그를 섬길 것뿐 아니라, 들의 짐승과 가축과 하늘의 새들도 당신의 힘으로 느부갓네살과 그의 온 집안을 위해 살아갈 것입니다.[a][b][c]
  rationale: 원문에 없는 지명을 삭제하고, 사람들의 왕 섬김이라는 독립 절을 복원했습니다. 왕실 찬양의 과장된 ‘살아 계시고 … 살아 있습니다’ 구조는 유지하되, 한국어 문장 관계를 분명히 했습니다. ψυχή, 두 개의 διὰ 구문, 그리고 마지막 압축 구문의 의미 범위는 교리적으로 확정하지 않고 본문과 각주에서 보존했습니다.
