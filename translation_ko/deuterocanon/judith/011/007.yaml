  - 권세
  - 주권
  lexicon: LSJ
  rationale: 왕권의 효과적 शासन을 가리키는 말로, 추상적 '힘'보다 정치적 통치를 드러내는 표현을 택했습니다.
- source_word: πάσης ψυχῆς
  english_pob_choice: every living soul
  chosen_korean: 모든 생명
  alternatives_korean:
