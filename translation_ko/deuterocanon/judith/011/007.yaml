  - 당신을 통해 사람들은 그를 섬길 것입니다
  lexicon: LSJ
  rationale: διὰ + 대격의 원인 관계를 반영해 '때문에'로 옮겼고, δουλεύσουσιν은 지배적 예속보다 예의상 '섬기다'로 처리했습니다.
- source_word: τὰ θηρία τοῦ ἀγροῦ καὶ τὰ κτήνη καὶ τὰ πετεινὰ τοῦ οὐρανοῦ
  english_pob_choice: the wild animals and the cattle and the birds of the sky
  chosen_korean: 들의 짐승과 가축과 하늘의 새들
