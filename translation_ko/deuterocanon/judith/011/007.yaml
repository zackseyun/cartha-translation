  naturalness: 합쇼체의 격식은 유지하되, ‘온 땅의 왕이신 느부갓네살 왕께서는’ 및 ‘당신 때문에 사람들이 그를 섬길 것이며’로 문장 관계를 명료하게 했습니다. ‘그의 온 집안’은 한국어에서 자연스러우면서도 οἶκος의 가문·왕실·집안의 폭을 유지합니다.
