  chosen_korean: 외모
  alternatives_korean:
  - 모습
  - 겉모습
  - 용모
  lexicon: LSJ
  rationale: 눈에 보이는 형상을 가리키므로, ‘외모’가 현대 한국어에서 가장 직접적이고 읽기 쉽습니다.
- source_word: ἐν τοῖς λόγοις σου
  english_pob_choice: good in your words
  chosen_korean: 말도 좋습니다
  alternatives_korean:
  - 말씀도 좋습니다
  - 말도 훌륭합니다
  - 하시는 말도 좋습니다
  lexicon: LSJ
  rationale: λόγοις는 여기서 말과 발언을 뜻하므로, 칭찬의 병렬을 살리면서도 한국어로는 자연스럽게 ‘말도 좋습니다’로 옮겼습니다.
- source_word: ὁ θεός σου ἔσται μού θεός
  english_pob_choice: your god will be my god
  chosen_korean: 당신의 신은 나의 신이 될 것이며
  alternatives_korean:
  - 당신의 하나님은 나의 하나님이 될 것이며
  - 당신의 신은 내 신이 될 것이며
  lexicon: LSJ
  rationale: 헬라어 θεός에 정관적 구별이 없고, 발화자가 이방 군대 장수라는 점을 반영해 ‘하나님’보다 일반명사 ‘신’을 택했습니다.
- source_word: καθιῇ
  english_pob_choice: you will dwell
  chosen_korean: 살게 되고
  alternatives_korean:
  - 거하게 되고
  - 머물게 되고
  - 앉게 되고
  lexicon: LSJ
  rationale: 직역하면 ‘앉다’이지만, οἶκῳ와 함께 쓰여 거주를 뜻하므로 현대 한국어에서는 ‘살다’ 계열이 가장 자연스럽습니다.
- source_word: ὀνομαστὴ παρὰ πᾶσαν τὴν γῆν
  english_pob_choice: renowned throughout all the earth
  chosen_korean: 온 땅에 이름이 널리 알려질 것입니다
  alternatives_korean:
  - 온 땅에 유명해질 것입니다
  - 온 땅에 명성이 퍼질 것입니다
  - 온 땅에서 칭송받을 것입니다
  lexicon: LSJ
  rationale: ὀνομαστή는 ‘이름이 난, 유명한’의 뜻이므로, ‘이름이 널리 알려지다’가 명성과 범위를 함께 살립니다.
theological_decisions:
- issue: 이방 화자의 θεός를 ‘하나님’으로 높여 번역할지 여부
  chosen_reading: ‘신’으로 유지하여 화자의 이교적 발화를 반영했습니다.
  alternative_readings:
  - ‘하나님’으로 번역
  - 앞 절과 연결해 ‘당신의 하나님은 나의 하나님’으로 번역
  rationale: 이 구절은 느부갓네살 군대 장수의 수사적 맹세이므로, 한국어에서도 신학적 확정을 피하고 발화자의 관점을 드러내는 번역이 원문 긴장을 더 잘 보존합니다.
  doctrine_reference: 원문 우선 번역 원칙; 문맥상 화자의 종교적 태도와 서술자의 신앙 고백을 구별함
