translation:
  language: ko
  text: 만일 당신이 당신의 여종의 말을 따른다면, 하나님께서 당신과 함께 그 일을 온전히 이루실 것이며, 제 주인은 자기 계획에서 물러서지 않을 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
