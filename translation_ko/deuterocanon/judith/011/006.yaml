    reason: lexical_alternative
  - marker: b
    text: 또는 ‘제 주인은 자신의 계획에서 떠나지 않을 것입니다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατακολουθήσῃς
  english_pob_choice: follow
  chosen_korean: 따른다면
  alternatives_korean:
  - 순종한다면
  - 귀를 기울인다면
  lexicon: LSJ
  rationale: λόγοις에 대한 태도는 단순한 청취보다 실제적인 추종·수용을 뜻하므로, 한국어에서는 자연스럽게 ‘따르다’로 옮겼습니다.
- source_word: παιδίσκης
  english_pob_choice: servant girl
  chosen_korean: 여종
  alternatives_korean:
  - 시녀
  - 하녀
  - 종된 소녀
  lexicon: LSJ
  rationale: 이 단어는 젊은 여성 종을 가리키며, 한국어에서는 성별과 종속 관계를 함께 드러내는 ‘여종’이 가장 간결하고 원문에 가깝습니다.
- source_word: τελείως πρᾶγμα ποιήσει
  english_pob_choice: will fully accomplish the matter
  chosen_korean: 그 일을 온전히 이루실 것이며
  alternatives_korean:
  - 그 일을 완전히 이루실 것이며
  - 그 일을 끝까지 성취하실 것이며
  lexicon: LSJ
  rationale: πρᾶγμα는 구체적 사안·일을 가리키므로 ‘그 일’이 자연스럽고, τελείως는 과정의 완전성을 나타내어 ‘온전히’로 살렸습니다.
- source_word: οὐκ ἀποστεῖται ... τῶν ἐπιτηδευμάτων αὐτοῦ
  english_pob_choice: will not depart from his purposes
  chosen_korean: 자기 계획에서 물러서지 않을 것입니다
  alternatives_korean:
  - 자기 목적에서 떠나지 않을 것입니다
  - 자기 의도에서 벗어나지 않을 것입니다
  lexicon: LSJ
  rationale: ἀποστεῖται는 여기서 ‘떠나다/물러나다’의 의미로 읽히며, ἐπιτηδεύματα는 계획·의도·추진하려는 일들을 가리키므로 ‘계획에서 물러서다’가 문맥상 가장 분명합니다.
theological_decisions:
- issue: ὁ θεός와 ὁ κύριός μου의 지칭과 존칭 처리
  chosen_reading: 하나님은 신적 주어로, ὁ κύριός μου는 인간 상전에 대한 공손한 호칭으로 각각 ‘하나님’, ‘제 주인’으로 구분했습니다.
  alternative_readings:
  - ‘주님’으로 통일
  - ‘제 주인님’으로 과잉 존대
  rationale: 본문은 하나님과 홀로페르네스를 구별하므로, κύριος를 문맥에 따라 인간 상전으로 낮춰 번역해 신적 호칭과 혼동되지 않게 했습니다.
  doctrine_reference: 'DOCTRINE.md: κύριος의 referent에 따라 ‘주/주님/주인’ 구분'
