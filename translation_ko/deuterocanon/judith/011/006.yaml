translation:
  language: ko
  text: 만일 당신께서 이 여종의 말[a]을 따르신다면, 하나님께서 당신과 함께 그 일을 온전히 이루실 것이며, 제 주인은 자신의 계획에서 물러서지 않을 것입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
