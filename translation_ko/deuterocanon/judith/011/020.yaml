  text: And her words pleased Holofernes and all his attendants, and they marveled at her wisdom and said,
translation:
  language: ko
  text: '그녀의 말은 홀로페르네스와 그의 모든 시종들의 마음에 들었습니다. 그들은 그녀의 지혜에 감탄하고 말했습니다:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤρεσαν
  english_pob_choice: pleased
  chosen_korean: 마음에 들었고
  alternatives_korean:
  - 기쁘게 했고
  - 만족시켰고
  lexicon: BDAG
  rationale: ἀρέσκω의 아오리스트로서 상대에게 호감을 주고 받아들여졌다는 뜻을 살려, 한국어에서는 자연스럽고 과도하게 해석을 더하지 않는 ‘마음에 들었고’를 택했습니다.
- source_word: οἱ λόγοι αὐτῆς
  english_pob_choice: her words
  chosen_korean: 그녀의 말은
  alternatives_korean:
  - 그녀의 말들이
  - 그녀의 발언은
  lexicon: BDAG
  rationale: λόγοι는 여기서 개별 ‘말씀들’보다 발화 전체를 가리키므로, 현대 한국어에서 가장 자연스러운 ‘그녀의 말’로 옮겼습니다.
- source_word: θεραπόντων
  english_pob_choice: attendants
  chosen_korean: 시종들
  alternatives_korean:
  - 하인들
  - 수행원들
  - 종들
  lexicon: LSJ
  rationale: θεράπων은 궁정적·군사적 맥락의 수행자를 가리키므로, 단순한 노역 종속을 떠올리게 하는 표현보다 궁정 분위기를 살리는 ‘시종들’이 적절합니다.
- source_word: ἐθαύμασαν ἐπὶ τῇ σοφίᾳ αὐτῆς
  english_pob_choice: they marveled at her wisdom
  chosen_korean: 그들은 그녀의 지혜를 보고 놀라며
  alternatives_korean:
  - 그들은 그녀의 지혜에 놀라며
  - 그들은 그녀의 지혜를 보고 경탄하며
  lexicon: BDAG
  rationale: ἐθαύμασαν은 단순한 호기심보다 감탄과 놀라움을 포함하므로 ‘놀라며’로, ἐπί + 여격은 한국어에서 자연스럽게 ‘~를 보고’로 풀어 감탄의 근거를 드러냈습니다.
- source_word: καὶ εἶπαν
  english_pob_choice: and said,
  chosen_korean: 말했습니다.
  alternatives_korean:
  - 말하였습니다.
  - 말했습니다,
  - 그리고 말했습니다.
  lexicon: BDAG
  rationale: 다음 절로 이어지는 직접화법의 도입이지만, 본문 한 절만 제시하는 형식에 맞춰 문장 종결을 자연스럽게 처리했습니다.
theological_decisions:
- issue: 궁정 인물 호칭의 번역 톤
  chosen_reading: θεράπων을 교회적 ‘종’보다 궁정적 의미가 살아 있는 ‘시종들’로 옮겼습니다.
  alternative_readings:
  - 종들
  - 하인들
  rationale: 이 단락은 예배적·신학적 용례가 아니라 왕궁 장면이므로, 신분적 뉘앙스를 과도하게 주지 않으면서도 장면성을 보존하는 표현이 적절합니다.
  doctrine_reference: 번역학적 장면 적합성
- issue: 직접화법 도입의 처리
  chosen_reading: ‘말했습니다.’로 마침표를 찍어도 되지만, 다음 절의 발화가 이어진다는 점을 고려해 자연스러운 연결감을 유지했습니다.
  alternative_readings:
  - ‘말했습니다,’로 이어쓰기
  - ‘말했습니다’ 없이 콜론으로 처리
  rationale: 헬라어는 다음 절로 이어지는 인용 구조를 취하므로, 한국어에서도 문맥의 연속성을 해치지 않는 범위에서 처리했습니다.
  doctrine_reference: 본문 구조 보존
