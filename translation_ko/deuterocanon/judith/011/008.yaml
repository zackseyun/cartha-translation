- from: 우리가 당신의 지혜와 당신 영혼의 간교함을 들었기 때문입니다[a]. 또 당신만이 모든 왕국에서 선하시고, 지식에서는 능하시며, 전쟁의 군대들 가운데서 놀라우시다고 온 땅에 전해졌습니다[b][c].
  to: 우리가 당신의 지혜와 당신 마음의 간교함을 들었기 때문입니다[a]. 또 당신만이 온 왕국에서 선하시고, 지식에 능하시며, 전쟁의 군대들에 있어서는 놀라우시다고 온 땅에 전해졌습니다[b][c].
  rationale: 단수 βασιλεία를 ‘온 왕국’으로 바로잡고, 각주의 앵커·대안·설명이 각각 γῆ와 βασιλεία에 정확히 대응하도록 수정했습니다. ψυχή는 문맥상 ‘마음’으로 옮기되 ‘영혼’이라는 직역 가능성은 각주에 보존했습니다. 나머지 표현은 원문의 공손하고 과장된 칭송 어조 및 군사적 표현의 다소 중복된 특성을 유지했습니다.
