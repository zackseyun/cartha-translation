base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/011/008.yaml
  text: For we have heard of your wisdom and the cunning of your soul[a], and it has been reported throughout all the earth that you alone are good in all the kingdom, mighty in knowledge[c][b], and marvelous in the armies of war.
  footnotes:
  - marker: a
    text: Or "the cunning of your soul"; Greek ψυχή can mean "soul," "life," or the inner self, but here likely refers to the faculty of thought or intention.
    reason: lexical_alternative
  - marker: b
    text: Or "throughout all the land"; Greek γῆ may mean either "land" or "earth/world" depending on context.
    reason: lexical_alternative
  - marker: c
    text: Or "in the whole kingdom"; the singular likely refers to his realm, not to every kingdom universally.
    reason: lexical_alternative
translation:
  language: ko
  text: 우리가 당신의 지혜와 당신 영혼의 간교함을 들었기 때문입니다[a]. 또 당신만이 모든 왕국에서 선하시고, 지식에서는 능하시며, 전쟁의 군대들 가운데서 놀라우시다고 온 땅에 전해졌습니다[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “당신 영혼의 간교함”입니다. ψυχή는 “영혼”, “생명”, 또는 내면을 뜻할 수 있으며, 여기서는 사고와 의도의 기능을 가리키는 것으로 보입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “온 땅에”입니다. γῆ는 문맥에 따라 “땅” 또는 “세상”을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 “모든 왕국에서”입니다. 단수형은 보편적 모든 왕국이 아니라 그의 영역 전체를 가리킬 가능성이 큽니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠκούσαμεν
  english_pob_choice: we have heard
  chosen_korean: 우리가 ... 들었기 때문입니다
  alternatives_korean:
  - 우리가 ... 들었습니다
  - 우리는 ... 들었습니다
  lexicon: LSJ
  rationale: 청유적 변론 문맥에서 이미 알려진 평판을 근거로 삼는 뉘앙스를 살리기 위해, 단순 과거보다 현재까지 유효한 청취 결과를 자연스럽게 반영했습니다.
- source_word: πανουργεύματα
  english_pob_choice: cunning
  chosen_korean: 간교함
  alternatives_korean:
  - 교활함
  - 재치
  - 꾀
  lexicon: LSJ
  rationale: 본문의 감탄조 칭송 속에서도 지적 예리함과 약간의 책략성을 함께 담는 말로, 긍정 일변도의 '재치'보다 더 긴장감을 보존합니다.
- source_word: τῆς ψυχῆς σου
  english_pob_choice: of your soul
  chosen_korean: 당신 영혼의
  alternatives_korean:
  - 당신의 영혼의
  - 당신 마음의
  - 당신 내면의
  lexicon: LSJ
  rationale: ψυχή를 '영혼'으로 옮기되, 한국어에서 소유격 구조를 자연스럽게 만들어 내적 판단과 의도를 가리키는 표현으로 유지했습니다.
- source_word: πάσῃ τῇ γῇ
  english_pob_choice: throughout all the earth
  chosen_korean: 온 땅에
  alternatives_korean:
  - 온 세상에
  - 온 땅 전체에
  - 모든 땅에
  lexicon: LSJ
  rationale: γῆ의 '땅/지면/세계' 범위를 과장된 공적 보고의 표현으로 살리면서도, 한국어에서 가장 자연스러운 범위 표현인 '온 땅'을 택했습니다.
- source_word: ἐν πάσῃ βασιλείᾳ
  english_pob_choice: in all the kingdom
  chosen_korean: 모든 왕국에서
  alternatives_korean:
  - 온 왕국에서
  - 그 모든 왕국에서
  - 온 나라에서
  lexicon: LSJ
  rationale: 단수 βασιλείᾳ를 특정한 통치 영역으로 이해하되, 왕권·영역을 포괄하는 말로 '왕국'을 써서 평행절 구조를 유지했습니다.
- source_word: δυνατὸς ἐν ἐπιστήμῃ
  english_pob_choice: mighty in knowledge
  chosen_korean: 지식에서는 능하시며
  alternatives_korean:
  - 지식에서 강하시며
  - 지식에 능하시며
  - 이해력에서 뛰어나시며
  lexicon: LSJ
  rationale: ἐπιστήμη의 인지적·전문적 지식을 한국어의 '지식'으로 옮기고, '능하시며'로 힘의 수식 구조를 살려 수사적 칭송을 보존했습니다.
- source_word: θαυμαστὸς ἐν στρατεύμασιν πολέμου
  english_pob_choice: marvelous in the armies of war
  chosen_korean: 전쟁의 군대들 가운데서 놀라우시다고
  alternatives_korean:
  - 전쟁의 군대들 가운데서 경이로우시다고
  - 전쟁 군대들에서 놀라우시다고
  - 전투의 군대들 가운데서 놀라우시다고
  lexicon: LSJ
  rationale: 직역에 가까운 '군대들'과 '전쟁'의 중복을 너무 평이하게 풀지 않고, 수사적·군사적 분위기를 살리기 위해 '놀라우시다'를 택했습니다.
theological_decisions:
- issue: 영혼(ψυχή)과 간교함의 결합이 도덕적 평가를 흐릴 가능성
  chosen_reading: 본문의 칭송 맥락을 유지하면서도 ψυχή를 '영혼'으로 직역해, 인격의 내적 기획을 가리키는 표현으로 남겼습니다.
  alternative_readings:
  - '''마음의 간교함'''
  - '''내면의 교묘함'''
  rationale: 그리스어가 단순한 지적 능력보다 내적 의도와 계획을 가리키므로, 심리적 의미를 완화하지 않고 긴장을 보존하는 편이 원문에 가깝습니다.
  doctrine_reference: source semantics / lexical theology
- issue: πάσῃ τῇ γῇ의 범위 표현
  chosen_reading: '''온 땅''으로 넓게 옮겨, 과장된 국제적 평판을 살렸습니다.'
  alternative_readings:
  - '''온 나라'''
  - '''온 세상'''
  rationale: 이 장면은 특정 지역 내부가 아니라 널리 퍼진 소문을 강조하므로, 단순한 지역화보다 광범위한 공적 인식을 드러내는 번역이 적절합니다.
  doctrine_reference: narrative rhetoric
