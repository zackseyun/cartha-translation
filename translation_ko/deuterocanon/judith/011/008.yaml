  - 우리는 ... 들었습니다
  lexicon: LSJ
  rationale: 청유적 변론 문맥에서 이미 알려진 평판을 근거로 삼는 뉘앙스를 살리기 위해, 단순 과거보다 현재까지 유효한 청취 결과를 자연스럽게 반영했습니다.
