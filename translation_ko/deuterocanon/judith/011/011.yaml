base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/011/011.yaml
  text: And now[a], so that my lord may not become an outcast and ineffective, death will fall upon them, and sin has overtaken them[c][b], by which they provoke their God whenever they commit an offense.
  footnotes:
  - marker: a
    text: Or 'cast out and ineffective.' The Greek terms can emphasize being expelled and unable to accomplish anything.
    reason: lexical_alternative
  - marker: b
    text: Literally 'death will fall upon their face.' The expression is rendered idiomatically in English as 'death will fall upon them.'
    reason: lexical_alternative
  - marker: c
    text: Or 'whenever they commit impropriety/folly.' The Greek noun can denote conduct that is improper, absurd, or morally outrageous.
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 내 주인님께서 폐인처럼 되거나 무력하게 되지 않게 하려면, 죽음이 그들 위에 임하고, 그들이 자기 하나님을 격노하게 할 때마다 죄가 그들을 덮쳤습니다. 곧 그들이 패역한 일을 저지를 때입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ἔκβολος와 ἄπρακτος는 각각 ‘내쫓긴’과 ‘무력한/성과 없는’의 뜻을 지닐 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그들의 얼굴 위에’입니다. 한국어에서는 심판이 갑자기 덮친다는 뜻을 살려 자연스럽게 옮겼습니다.
    reason: lexical_alternative
  - marker: c
    text: ἀτοπίαν은 ‘부적절한 일, 기이한 일, 패역한 일’까지 아우를 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ κύριός μου
  english_pob_choice: my lord
  chosen_korean: 내 주인님
  alternatives_korean:
  - 내 주군
  - 내 주인
  lexicon: LSJ
  rationale: 인간 상관에게 하는 공손한 호칭이므로, 신적 칭호가 아닌 사회적 존칭으로 옮겼습니다. 다만 한국어에서 ‘주인님’은 종속성을 더 강하게 드러내므로, 문맥의 복종적 발화를 살리기 위해 선택했습니다.
- source_word: ἔκβολος
  english_pob_choice: an outcast
  chosen_korean: 폐인처럼 되거나
  alternatives_korean:
  - 내쫓긴 자가 되거나
  - 쫓겨난 처지가 되거나
  lexicon: LSJ
  rationale: 직역만 하면 한국어에서 어색하므로, ‘밖으로 밀려난 상태’와 ‘무너진 처지’를 함께 드러내는 표현을 택했습니다. 다만 본문의 배제/추방 뉘앙스는 ‘되거나’의 병렬로 보존했습니다.
- source_word: ἄπρακτος
  english_pob_choice: ineffective
  chosen_korean: 무력하게
  alternatives_korean:
  - 성과 없이
  - 아무 일도 못하게
  lexicon: LSJ
  rationale: 행동의 결과를 내지 못하는 상태를 가리키므로 ‘무력하게’로 옮겼습니다. 단순한 ‘실패’보다 ‘행하지 못함/힘을 쓰지 못함’의 의미를 더 잘 살립니다.
- source_word: ἐπιπεσεῖται θάνατος ἐπὶ πρόσωπον αὐτῶν
  english_pob_choice: death will fall upon them
  chosen_korean: 죽음이 그들 위에 임하고
  alternatives_korean:
  - 죽음이 그들에게 떨어지고
  - 죽음이 그들 얼굴 위에 떨어지고
  lexicon: LSJ
  rationale: ‘얼굴 위에’의 문자성보다, 갑작스러운 심판이 덮쳐 오는 이미지를 한국어로 자연스럽게 전달하는 것이 적절합니다. ‘임하다’는 예언적·심판적 도착을 잘 드러냅니다.
- source_word: παροργιοῦσιν
  english_pob_choice: provoke
  chosen_korean: 격노하게 할 때마다
  alternatives_korean:
  - 노하게 할 때마다
  - 분노를 일으킬 때마다
  lexicon: LSJ
  rationale: 대상인 ‘자기 하나님’과 결합할 때 단순한 화남보다 성경적 심판 맥락의 ‘격노’가 더 선명합니다. 동사의 반복상은 ‘할 때마다’로 살렸습니다.
- source_word: ἀτοπίαν
  english_pob_choice: an offense
  chosen_korean: 패역한 일
  alternatives_korean:
  - 부당한 일
  - 기이한 일
  - 무도한 일
  lexicon: LSJ
  rationale: 이 명사는 부적절함, 기이함, 도덕적 일탈을 아우르므로 문맥상 하나님을 격노하게 하는 행위를 가리키는 ‘패역한 일’이 가장 적절합니다. 너무 약한 ‘부적절한 일’보다 본문의 도덕적 강도를 보존합니다.
theological_decisions:
- issue: 주인공의 인간 상관에게 쓰인 κύριος를 어떻게 처리할 것인가
  chosen_reading: ‘내 주인님’으로 옮겨, 신적 호칭이 아닌 존대 관계를 분명히 했습니다.
  alternative_readings:
  - ‘내 주군’
  - ‘내 주인’
  rationale: 본문은 야훼나 메시아를 가리키는 용례가 아니라 유딧이 홀로페르네스에게 하는 예우 표현입니다. 한국어에서도 종교적 ‘주님’으로 오해되지 않도록 사회적 호칭을 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: κύριος는 문맥에 따라 인간 상관/신적 호칭을 구별하여 번역'
- issue: ἔκβολος와 ἄπρακτος를 결합해 어떤 상태를 보존할 것인가
  chosen_reading: 배제되어 무력해지는 상태를 함께 드러냈습니다.
  alternative_readings:
  - 단순히 ‘내쫓기고 실패한’ 상태
  - ‘버림받고 소용없는’ 상태
  rationale: 본문의 의도는 전장에서의 추방과 무능을 함께 경고하는 데 있습니다. 한국어에서도 두 요소를 나란히 제시해 결과의 강도를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: 어휘의 긴장과 중첩된 의미를 평탄화하지 말 것'
