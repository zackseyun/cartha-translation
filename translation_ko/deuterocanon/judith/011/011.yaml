  source_fidelity: 현 번역은 ἔκβολος를 ‘폐인처럼’으로 옮겨 추방·배제의 뜻을 잃었고, ἀτοπίαν이 가리키는 행위와 ‘죄’ 및 하나님을 노하게 함의 문장 관계를 바꾸었습니다. 또한 ‘죽음이 … 임하고’(미래)와 ‘죄가 … 덮쳤습니다’(과거)를 부자연스럽게 결합했습니다. 원문의 미래 진술과 완료된 상태를 한국어에서 분명히 구별할 필요가 있습니다.
