  terminology: 인간 상관을 향한 ὁ κύριός μου는 신적 ‘주님’이 아니라 ‘제 주군’으로 옮겼습니다. ἔκβολος/ἄπρακτος는 ‘내쫓기고 아무 성과도 거두지 못하는 처지’로 두 요소를 보존했습니다. παροργιοῦσιν은 ‘노하게 하다’로, ἀτοπίαν은 과도하게 교리화하지 않는 ‘그릇된 일’로 옮겼습니다.
