revisions:
- from: 이제 내 주인님께서 폐인처럼 되거나 무력하게 되지 않게 하려면, 죽음이 그들 위에 임하고, 그들이 자기 하나님을 격노하게 할 때마다 죄가 그들을 덮쳤습니다. 곧 그들이 패역한 일을 저지를 때입니다.[a][b][c]
  to: 이제 제 주군께서 내쫓기고 아무 성과도 거두지 못하는 처지가 되지 않도록[a], 죽음이 그들에게 닥칠 것이며[b], 그릇된 일을 저지를 때마다 자기들의 하나님을 노하게 하는 그 죄가 이미 그들을 사로잡았습니다[c].
  rationale: 원문의 어순과 의미 관계를 따라, 제 주군이 ‘내쫓기고’ ‘아무 성과도 거두지 못하는’ 상태가 되지 않게 하려는 목적을 보존했습니다. 이어지는 죽음의 미래 진술과 이미 그들을 사로잡은 죄를 구별했으며, 그 죄가 그릇된 행위를 저지를 때마다 하나님을 노하게 하는 죄라는 수식 관계를 한국어로 명료하게 드러냈습니다. ‘폐인’과 ‘패역’처럼 원문보다 강하거나 다른 의미를 더하는 표현은 피했습니다.
