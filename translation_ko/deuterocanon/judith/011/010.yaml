base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/011/010.yaml
  text: Therefore[a], master lord, do not disregard his word, but lay it up in your heart, because it is true; for our people are not avenged, nor does the sword prevail against them[c][b], unless they sin against their God.
  footnotes:
  - marker: a
    text: Or 'sovereign lord.' The Greek address uses two titles, δέσποτα and κύριε, both of which are represented in the translation.
    reason: lexical_alternative
  - marker: b
    text: Or 'our people.' Greek γένος can denote a people-group or nation.
    reason: lexical_alternative
  - marker: c
    text: Literally, 'if they do not sin against their God'; the sense in context is that no punishment or military success comes against them unless such sin occurs.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로, 주인 나으신 주님, 그의 말을 지나치지 마시고, 그것을 당신의 마음에 간직하십시오. 그것은 참된 말이기 때문입니다. 우리 겨레는 보복받지 않으며, 그들이 자기들의 하나님께 죄를 짓지 않는 한 칼도 그들 위에서 이기지 못합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 두 호칭 δέσποτα와 κύριε를 함께 살린 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: διό
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 그렇기 때문에
  - 그리하여
  lexicon: LSJ
  rationale: 앞선 진술에서 이어지는 논리적 결론을 표지하므로, 현대 한국어에서 자연스럽고 단정한 '그러므로'로 옮겼습니다.
- source_word: δέσποτα κύριε
  english_pob_choice: master lord
  chosen_korean: 주인 나으신 주님
  alternatives_korean:
  - 소버린 주님
  - 주인이신 주님
  - 주인 되신 주님
  lexicon: LSJ
  rationale: 두 호칭이 겹쳐 있는 점을 살리기 위해 권위성을 지닌 δέσποτα와 κύριε를 모두 반영했습니다. '주인'은 mastery를, '주님'은 lord를 살리되 합쇼체 문맥에 맞게 다듬었습니다.
- source_word: μὴ παρέλθῃς τὸν λόγον αὐτοῦ
  english_pob_choice: do not disregard his word
  chosen_korean: 그의 말을 지나치지 마시고
  alternatives_korean:
  - 그의 말씀을 무시하지 마시고
  - 그의 말을 넘어가지 마시고
  lexicon: LSJ
  rationale: παρέρχομαι + λόγον의 뜻인 '지나쳐 버리다/간과하다'를 살려, 한국어에서 과도한 해석 없이 현대적으로 표현했습니다.
- source_word: κατάθου αὐτὸν ἐν τῇ καρδίᾳ σου
  english_pob_choice: lay it up in your heart
  chosen_korean: 그것을 당신의 마음에 간직하십시오
  alternatives_korean:
  - 그것을 마음에 저장하십시오
  - 그것을 마음에 두십시오
  lexicon: LSJ
  rationale: 심장/마음 안에 두어 보존한다는 비유를 한국어에서 자연스럽게 드러내기 위해 '간직하다'를 택했습니다.
- source_word: ἐκδικάται
  english_pob_choice: are not avenged
  chosen_korean: 보복받지 않으며
  alternatives_korean:
  - 징벌받지 않으며
  - 원수 갚음을 당하지 않으며
  lexicon: LSJ
  rationale: 이 문맥에서 완전한 법정적 '복수'보다 외적 징벌이 가해지지 않는다는 뜻이 강하므로, 능동적·피동적 뉘앙스를 함께 살리는 '보복받다'를 사용했습니다.
- source_word: τὸ γένος ἡμῶν
  english_pob_choice: our people
  chosen_korean: 우리 겨레
  alternatives_korean:
  - 우리 민족
  - 우리 백성
  - 우리 민족 공동체
  lexicon: LSJ
  rationale: γένος가 혈통/민족/민족 집단을 가리킬 수 있으므로, 현대 한국어에서 집단 정체성과 공동체성을 모두 담는 '겨레'를 택했습니다.
- source_word: κατισχύει ῥομφαία ἐπʼ αὐτούς
  english_pob_choice: does the sword prevail against them
  chosen_korean: 칼도 그들 위에서 이기지 못합니다
  alternatives_korean:
  - 칼도 그들 위에서 우세하지 못합니다
  - 칼도 그들을 압도하지 못합니다
  lexicon: LSJ
  rationale: ῥομφαία의 군사적 이미지를 한국어의 직접적 표현인 '칼'로 옮기고, κατισχύω의 '이기다/우세하다' 의미를 간결하게 반영했습니다.
- source_word: ἐὰν μὴ ἁμάρτωσιν εἰς τὸν θεὸν αὐτῶν
  english_pob_choice: unless they sin against their God
  chosen_korean: 그들이 자기들의 하나님께 죄를 짓지 않는 한
  alternatives_korean:
  - 그들이 자기들의 하나님께 죄를 범하지 않는 한
  - 그들이 자기들의 하나님께 거역하지 않는 한
  lexicon: LSJ
  rationale: 조건절의 핵심인 '죄를 짓다'를 유지해 언약적 책임의 조건을 분명히 했습니다. '자기들의 하나님'은 소유격을 직접 반영합니다.
theological_decisions:
- issue: 피동적 징벌과 조건절의 긴장
  chosen_reading: 우리 겨레는 보복받지 않으며, 그들이 자기들의 하나님께 죄를 짓지 않는 한 칼도 그들 위에서 이기지 못합니다
  alternative_readings:
  - 우리 겨레는 징벌받지 않으며, 그들이 자기들의 하나님께 죄를 짓지 않는 한 칼도 그들 위에서 우세하지 못합니다
  - 우리 겨레는 보복받지 않으며, 오직 그들이 자기들의 하나님께 죄를 지을 때에만 칼이 그들을 이깁니다
  rationale: 본문은 군사적 패배를 단순한 정치 운이 아니라 하나님께 대한 죄와 연결합니다. 이 조건적 긴장을 풀지 않도록 '…하지 않는 한' 구조를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Preserve theological tension rather than resolve it.'
