  text: “용기를 내십시오. 오늘 밤과 그 이후에도 당신은 살아 있을 것입니다. 아무도 당신을 잘못 대하지 않을 것이며, 오히려 내 주 느부갓네살 왕의 종들[a]에게 행해지는 것처럼 당신을 잘 대해 줄 것입니다.”
