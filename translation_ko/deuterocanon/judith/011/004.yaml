translation:
  language: ko
  text: “용기를 내십시오. 오늘 밤과 그 이후에도 당신은 살아 있을 것입니다. 당신을 잘못 대할 사람은 아무도 없습니다. 오히려 내 주 느부갓네살 왕의 종들에게 행해지는 것처럼 당신을 잘 대할 것입니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 주 느부갓네살 왕의 노예들.’ 그리스어 단어는 문맥에 따라 종 또는 노예를 뜻할 수 있습니다.
    reason: lexical_alternative
