base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/011/022.yaml
  text: Holofernes said to her[a], “God has done well to send you ahead of the people, so that power might be in our hands[b]; but destruction is for those who have treated my lord with contempt.”
  footnotes:
  - marker: a
    text: Or 'did well by sending you before the people.' The Greek participial construction can be rendered more formally.
    reason: lexical_alternative
  - marker: b
    text: Or 'but for those who have despised my lord, there is destruction.' The Greek places 'destruction' first for emphasis.
    reason: lexical_alternative
translation:
  language: ko
  text: 홀로페르네스가 그녀에게 말했습니다. “하나님께서는 권세가 우리 손에 있게 하시려고 당신을 백성보다 앞서 보내신 일을 잘하셨습니다. 그러나 멸망은 내 주인을 업신여긴 자들에게 있습니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “하나님께서 당신을 백성 앞에 보내심으로 잘하셨습니다.” 그리스어의 분사구는 이렇게 더 직역적으로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 “그러나 내 주인을 업신여긴 자들에게는 멸망이 있습니다.” 그리스어는 ‘멸망’을 앞에 놓아 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὁλοφέρνης / εἶπεν πρὸς αὐτὴν
  english_pob_choice: Holofernes said to her
  chosen_korean: 홀로페르네스가 그녀에게 말했습니다
  alternatives_korean:
  - 홀로페르네스가 그 여자에게 말했습니다
  - 홀로페르네스가 말했습니다
  lexicon: 고유명사/서술동사
  rationale: 서술체는 자연스러운 현대 문어로 풀되, 대화 상대를 분명히 하기 위해 ‘그녀에게’로 옮겼습니다.
- source_word: Ὁ θεός
  english_pob_choice: God
  chosen_korean: 하나님께서
  alternatives_korean:
  - 하나님이
  - 신께서
  lexicon: 표준 신학 용어
  rationale: 서사 속 화자가 이스라엘의 하나님을 가리키므로 관례적 표준어인 ‘하나님’이 적절합니다.
- source_word: Εὖ ἐποίησεν ὁ θεὸς ἀποστεῖλας σε ἔμπροσθεν τοῦ λαοῦ
  english_pob_choice: God has done well to send you ahead of the people
  chosen_korean: 당신을 백성보다 앞서 보내신 것은 잘하신 일입니다
  alternatives_korean:
  - 백성보다 앞서 당신을 보내신 것은 하나님께서 잘하신 일입니다
  - 하나님께서 백성보다 앞서 당신을 보내신 것은 잘하신 일입니다
  lexicon: LSJ
  rationale: εὖ ἐποίησεν은 단순히 ‘잘하다’라기보다 행위에 대한 평가이므로, 한국어에서는 ‘잘하신 일입니다’로 자연스럽게 옮겼습니다.
- source_word: τοῦ γενήθηναι ἐν χερσὶν ἡμῶν κράτος
  english_pob_choice: so that power might be in our hands
  chosen_korean: 그래서 권세가 우리 손에 있게 하려는 것입니다
  alternatives_korean:
  - 그래서 권세가 우리 손에 있게 하려는 것입니다
  - 그리하여 권세가 우리 손 안에 있도록 하려는 것입니다
  lexicon: LSJ
  rationale: 목적/결과의 동사구를 한국어 목적 표현으로 살렸고, ἐν χερσίν의 관용적 의미를 ‘우리 손에’로 옮겼습니다.
- source_word: φαυλίσασι
  english_pob_choice: have treated my lord with contempt
  chosen_korean: 내 주인을 업신여긴 자들
  alternatives_korean:
  - 내 주인을 멸시한 자들
  - 내 주인을 깔본 자들
  lexicon: LSJ
  rationale: φαυλίζω는 단순한 무시보다 ‘천하게 여기다/업신여기다’의 뉘앙스가 강해, 경멸의 의미를 직접 드러냈습니다.
- source_word: τὸν κύριόν μου
  english_pob_choice: my lord
  chosen_korean: 내 주인
  alternatives_korean:
  - 나의 주님
  - 내 주군
  lexicon: LSJ
  rationale: 여기서는 신적 칭호가 아니라 인간 상관을 가리키므로, 한국어에서도 과도한 종교적 뉘앙스를 피한 ‘주인’이 적절합니다.
- source_word: ἀπώλεια
  english_pob_choice: destruction
  chosen_korean: 멸망
  alternatives_korean:
  - 파멸
  - 파괴
  lexicon: LSJ
  rationale: 심판적 결과를 나타내는 일반 명사로서 ‘멸망’이 문맥에 가장 자연스럽고 강합니다.
theological_decisions:
- issue: ὁ θεός의 번역에서 인물 화자의 관점 보존
  chosen_reading: 하나님께서
  alternative_readings:
  - 하나님이
  - 신께서
  rationale: 이 장면은 이방 장수의 입술을 통해서도 이스라엘의 하나님을 말하므로, 표준적인 ‘하나님’으로 일관성을 유지했습니다.
  doctrine_reference: 'POB 용어집: Θεός → 하나님'
- issue: κύριός μου를 인간 상관 칭호로 처리
  chosen_reading: 내 주인
  alternative_readings:
  - 나의 주님
  - 내 주군
  rationale: 문맥상 홀로페르네스가 자신의 인간 상관을 가리키는 말이므로, 신적 칭호로 오해되지 않도록 ‘주인’으로 옮겼습니다.
  doctrine_reference: 'POB 용어집: κύριος는 문맥에 따라 주/주님 또는 인간 상관 칭호로 구분'
