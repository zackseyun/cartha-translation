  text: And it will be that[a], when he reports it to them and they act, they will be given over to you for destruction on that day.
  footnotes:
  - marker: a
    text: Or 'as soon as he reports it to them and they do it.' The Greek ὡς ἂν with subjunctives can express an indefinite future condition, and ποιήσωσιν may be rendered more literally as 'do.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그가 그것을 그들에게 알리고 그들이 행하면,[a] 그날에 그들은 멸망을 당하도록 당신에게 넘겨질 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그가 그것을 그들에게 알리고 그들이 그것을 행하는 때에.” 헬라어 ὡς ἂν은 접속법과 함께 불특정한 미래의 조건이나 시점을 나타낼 수 있으며, ποιήσωσιν은 더 문자적으로 “하다”로 옮길 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔσται
  english_pob_choice: it will be
  chosen_korean: 그리고 … 것입니다
  alternatives_korean:
  - 그리고 … 되겠습니다
  - 그리고 … 일 것입니다
  lexicon: BDAG
  rationale: 미래 상황을 예고하는 서술형 표현이므로, 한국어에서도 자연스러운 미래 종결로 옮기되 원문의 예고 구조를 유지했습니다.
- source_word: ὡς ἂν ἀναγγείλῃ … καὶ ποιήσωσιν
  english_pob_choice: when he reports it to them and they act
  chosen_korean: 그가 그들에게 알리고 그들이 행하면
  alternatives_korean:
  - 그가 그들에게 보고하고 그들이 행하면
  - 그가 그들에게 알리자마자 그들이 행하면
  lexicon: BDAG
  rationale: ὡς ἂν + 접속법은 불특정한 미래 조건을 나타내므로, ‘~하면’으로 옮겨 조건의 개방성을 살렸습니다. ποιήσωσιν은 여기서 목적어 없이 반응을 실행하는 뜻으로 보아 ‘행하다’로 처리했습니다.
- source_word: δοθήσονταί σοι εἰς ὄλεθρον
  english_pob_choice: they will be given over to you for destruction
  chosen_korean: 그들은 당신에게 멸망을 위해 넘겨질 것입니다
  alternatives_korean:
  - 그들은 당신에게 파멸로 넘겨질 것입니다
  - 그들은 당신에게 멸망당하도록 넘겨질 것입니다
  lexicon: BDAG
  rationale: 수동 미래 δοθήσονταί의 수동성을 살려 ‘넘겨질 것입니다’로 옮겼고, εἰς ὄλεθρον은 결과 목적을 드러내는 ‘멸망을 위해’로 자연스럽게 표현했습니다.
- source_word: ἐν τῇ ἡμέρᾳ ἐκείνῃ
  english_pob_choice: on that day
  chosen_korean: 그날에
  alternatives_korean:
  - 그날
  - 그때에
  lexicon: BDAG
  rationale: 정형적인 시간 표현이므로 간결한 ‘그날에’로 옮겨 원문의 종결 시점을 분명히 했습니다.
theological_decisions:
- issue: 유딧서의 선언문에서 조건절과 결과절의 관계
  chosen_reading: 조건이 충족되면 그날에 심판적 결과가 온다는 서술로 읽었습니다.
  alternative_readings:
  - 단순한 예언적 미래 진술로만 읽기
  - 강한 필연성 표현으로 읽기
  rationale: ὡς ἂν + 접속법은 미래의 불특정 조건을 드러내므로, 본문은 특정 행위가 일어날 때 뒤따를 결과를 예고하는 방식으로 이해하는 것이 가장 직접적입니다.
  doctrine_reference: 본문-문맥 우선; 헬라어 조건법 해석
- issue: δοθήσονταί σοι의 수동 표현
  chosen_reading: 행위자보다는 ‘넘겨짐’이라는 결과와 심판의 수동성을 살렸습니다.
  alternative_readings:
  - 능동적으로 ‘그가 당신에게 줄 것입니다’로 의역
  - ‘당신의 손에 떨어질 것입니다’로 이미지화
  rationale: 본문은 결과를 수동태로 서술하여, 심판이 인간의 행위만이 아니라 주어지는 판결임을 드러냅니다. 이를 보존하기 위해 직설적 수동 표현을 택했습니다.
  doctrine_reference: 문법-수사 효과 보존
