revisions:
- from: 그리고 나는 너를 유다의 한가운데를 지나 예루살렘 맞은편에 이를 때까지 인도할 것이며, 네 전차를 그 한가운데에 두고, 너는 목자가 없는 양들처럼 그들을 몰아갈 것이요, 심지어 개도 네 앞에서 혀로 으르렁거리지 못할 것이다. 이는 이런 일들이 내 예지에 따라 나에게 말해졌고, 나에게 전해졌으며, 나는 너에게 알리도록 보내심을 받았기 때문이다.[a][b][c]
  to: 그리고 저는 당신을 유다의 한가운데를 지나 예루살렘 맞은편에 이를 때까지 인도할 것이며[a], 당신의 전차를 예루살렘 한가운데에 둘 것입니다. 그러면 당신은 목자 없는 양들처럼 그들을 몰아갈 것이며, 개 한 마리도 당신을 대하여 혀로 으르렁거리지 않을 것입니다.[b] 이는 이 일들이 내가 미리 알고 있던 바에 따라 제게 말해졌고 제게 알려졌으며[c], 저는 그것을 당신에게 알리도록 보내심을 받았기 때문입니다.
  rationale: 합쇼체를 일관되게 적용했습니다. ἀπέναντι의 위치 의미와 δίφρος, 목자 없는 양의 비유, γρύξει의 ‘으르렁거리다’를 유지했습니다. πρόγνωσις는 후대의 교리적 ‘예지’로 확정하지 않고, 화자의 사전 지식이라는 문맥상 의미를 자연스러운 한국어로 드러냈습니다. 각주 표지도 해당 표현 뒤로 옮겼습니다.
