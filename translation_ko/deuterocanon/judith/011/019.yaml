  source_fidelity: 그리스어의 주요 구조와 비유는 대체로 충실합니다. 그러나 대상 번역의 요구 register(현대 합쇼체)에 맞지 않게 본문이 하라체 종결을 사용하며, κατὰ πρόγνωσίν μου는 ‘내 예지에 따라’보다 ‘내가 미리 알고 있던 바에 따라’가 비기술적 의미를 더 분명하고 자연스럽게 보존합니다. 또한 αὐτῆς의 선행사를 예루살렘으로 명시하는 것이 필요합니다.
  naturalness: ‘유다의 한가운데를 지나’, ‘혀로 으르렁거리다’는 원문의 특색을 보존하면서 자연스럽습니다. 다만 종결을 합쇼체로 통일하고, ‘그 한가운데’를 ‘예루살렘 한가운데’로 풀어 지시 대상을 명료하게 해야 합니다.
  terminology: ‘전차’, ‘목자 없는 양들’, ‘보내심을 받았습니다’는 적절합니다. πρόγνωσις에 ‘예지’를 쓰면 현대 한국어에서 예언적·신학적 함의가 강해질 수 있으므로, 문맥상 일반적인 선행 지식을 나타내는 표현으로 조정했습니다. ‘으르렁거리지 않을 것입니다’는 γρύξει의 미래 부정을 충실히 반영하며 ‘못할 것이다’가 암시할 수 있는 능력 부재를 피합니다.
  issues:
  - severity: medium
    issue: 본문 종결이 하라체(‘것이며’, ‘것이다’, ‘때문이다’)입니다.
