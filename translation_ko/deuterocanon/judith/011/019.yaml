  - severity: medium
    issue: ‘내 예지에 따라’는 πρόγνωσις를 기술적 또는 예언적 의미로 읽게 할 수 있습니다.
    rationale: 이 문맥의 πρόγνωσις는 화자가 미리 알고 있던 정보라는 비기술적 뜻을 유지해야 하므로 ‘내가 미리 알고 있던 바에 따라’가 더 안전합니다.
  - severity: low
    issue: ‘그 한가운데’는 αὐτῆς가 가리키는 예루살렘을 한국어에서 불분명하게 만듭니다.
    rationale: 직전의 여성 단수 지명 Ἰερουσαλήμ을 받아 ‘예루살렘 한가운데’로 명시하면 원문의 지시 관계를 분명히 합니다.
