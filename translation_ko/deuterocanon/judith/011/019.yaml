base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/011/019.yaml
  text: And I will lead you through the midst of Judea until you come opposite Jerusalem[a], and I will set your chariot in her midst, and you will drive them like sheep that have no shepherd, and not even a dog will growl with its tongue against you; for these things were spoken to me according to my foreknowledge, and they were reported to me[c][b], and I was sent to tell you.
  footnotes:
  - marker: a
    text: Or 'before Jerusalem' / 'facing Jerusalem' for 'opposite Jerusalem.'
    reason: lexical_alternative
  - marker: b
    text: The Greek says 'not even a dog will growl with its tongue against you,' an idiom expressing complete lack of resistance.
    reason: cultural_note
  - marker: c
    text: '''Foreknowledge'' here likely means prior knowledge or advance awareness, not necessarily a technical theological claim.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 나는 너를 유다의 한가운데를 지나 예루살렘 맞은편에 이를 때까지 인도할 것이며, 네 전차를 그 한가운데에 두고, 너는 목자가 없는 양들처럼 그들을 몰아갈 것이요, 심지어 개도 네 앞에서 혀로 으르렁거리지 못할 것이다. 이는 이런 일들이 내 예지에 따라 나에게 말해졌고, 나에게 전해졌으며, 나는 너에게 알리도록 보내심을 받았기 때문이다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘맞은편’은 ‘앞에/마주하여’의 뜻으로도 읽을 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어 표현은 ‘개가 혀로 으르렁거린다’는 관용구로, 완전한 저항의 부재를 뜻합니다.
    reason: cultural_note
  - marker: c
    text: 여기서 ‘예지’는 기술적 신학 용어가 아니라 ‘미리 앎’에 가까운 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄξω
  english_pob_choice: I will lead
  chosen_korean: 인도할 것입니다
  alternatives_korean:
  - 데려갈 것입니다
  - 이끌 것입니다
  lexicon: BDAG
  rationale: ἄγω의 미래형으로, 단순 이동보다 길을 따라 직접 수행하는 의미를 살려 ‘인도하다’를 선택했습니다.
- source_word: διὰ μέσου τῆς Ἰουδαίας
  english_pob_choice: through the midst of Judea
  chosen_korean: 유다의 한가운데를 지나
  alternatives_korean:
  - 유다를 지나
  - 유다의 중심을 지나
  lexicon: BDAG
  rationale: 그리스어의 공간적 생생함을 살리면서도 한국어로 자연스럽게 들리는 표현을 택했습니다.
- source_word: ἕως τοῦ ἐλθεῖν ἀπέναντι Ἰερουσαλήμ
  english_pob_choice: until you come opposite Jerusalem
  chosen_korean: 예루살렘 맞은편에 이를 때까지
  alternatives_korean:
  - 예루살렘 앞에 이를 때까지
  - 예루살렘을 마주한 곳에 이를 때까지
  lexicon: BDAG
  rationale: ἀπέναντι의 ‘마주한/맞은편’ 의미를 보존하되, 위치 관계를 분명히 드러내는 한국어로 옮겼습니다.
- source_word: οὐ γρύξει κύων τῇ γλώσσῃ αὐτοῦ
  english_pob_choice: not even a dog will growl with its tongue
  chosen_korean: 심지어 개도 네 앞에서 혀로 으르렁거리지 못할 것이다
  alternatives_korean:
  - 심지어 개도 네 앞에서 짖지 못할 것이다
  - 심지어 개도 네 앞에서 혀로 으르렁대지 못할 것이다
  lexicon: LSJ
  rationale: γρύζω의 ‘으르렁거리다/불평하다’ 뉘앙스와 ‘혀로’라는 이례적 표현을 함께 살려, 완전한 무저항의 관용구임을 드러냈습니다.
- source_word: κατὰ πρόγνωσίν μου
  english_pob_choice: according to my foreknowledge
  chosen_korean: 내 예지에 따라
  alternatives_korean:
  - 내 미리 앎에 따라
  - 내 사전 인식에 따라
  lexicon: BDAG
  rationale: 여기서는 신학술어로 굳히기보다, 문맥상 ‘미리 앎/사전 인식’의 일반적 의미를 간결하게 드러내는 ‘예지’를 택했습니다.
theological_decisions:
- issue: πρόγνωσις의 의미를 신학적 예정론 용어로 읽을지 여부
  chosen_reading: 문맥상 유딧이 적에게 전달받은 선행 정보와 사전 인식을 주장하는 말로 두고, ‘예지’로 옮겼습니다.
  alternative_readings:
  - 예정에 따른 앎
  - 예언적 계시
  rationale: 이 장면은 유딧이 홀로페르네스에게 전략적 확신을 말하는 대목이므로, 후대 교리적 의미를 덧씌우지 않고 어휘의 직접 의미를 유지했습니다.
  doctrine_reference: 원어 우선, 문맥 우선; πρόγνωσις의 기술적 신학화 보류
