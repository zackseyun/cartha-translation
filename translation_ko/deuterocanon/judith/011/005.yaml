base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/011/005.yaml
  text: And Judith said to him[a], “Receive the words of your slave, and let your maidservant speak before you[b], and I will not tell a lie to my lord this night.”
  footnotes:
  - marker: a
    text: Or 'your servant' for 'your slave' (Greek δοῦλη). The Greek term can denote a female servant or slave; 'slave' is used here to preserve the stronger status language in Judith's self-humbling speech.
    reason: lexical_alternative
  - marker: b
    text: Or 'my master' for 'my lord' (Greek κυρίῳ μου), since the referent is a human superior, not God.
    reason: lexical_alternative
translation:
  language: ko
  text: 유딧이 그에게 말했습니다. “당신의 여종[a]의 말을 받아 주십시오. 당신의 시녀[b]가 당신 앞에서 말하게 해 주십시오. 저는 오늘 밤 제 주인께 거짓을 말하지 않겠습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘여종’은 헬라어 δοῦλη를 옮긴 말입니다. 이 말은 여성 종 또는 여성 노예를 가리키며, 여기서는 유딧이 궁정의 상급자 앞에서 자신을 낮추어 부르는 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘시녀’는 헬라어 παιδίσκη를 옮긴 말입니다. 이 말은 여성 종을 가리키며, 때로 젊은 여성이라는 뉘앙스를 지닙니다. 앞의 δοῦλη와는 다른 자기호칭입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Δέξαι τὰ ῥήματα
  english_pob_choice: Receive the words
  chosen_korean: 「…의 말을 받아 주십시오」
  alternatives_korean:
  - 「…의 말을 들어 주십시오」
  - 「…의 말을 받아들이십시오」
  lexicon: LSJ
  rationale: δέχομαι의 명령형은 단순 청취보다 ‘받아들이다/받아 주다’의 뉘앙스가 있어, 청자에게 말 자체를 수용해 달라는 요청을 한국어로 자연스럽게 옮겼습니다.
- source_word: τῆς δούλης σου
  english_pob_choice: your slave
  chosen_korean: 「당신의 종」
  alternatives_korean:
  - 「당신의 노예」
  - 「당신의 여종」
  lexicon: LSJ
  rationale: δοῦλη는 여성형이지만, 한국어에서 ‘노예’는 다소 급격한 직접성을 띠어 공손한 궁정 대화의 호칭으로는 무거울 수 있어, 본문의 자기를 낮추는 의미를 살리면서도 문장 흐름에 맞는 ‘종’으로 옮겼습니다.
- source_word: ἡ παιδίσκη σου
  english_pob_choice: your maidservant
  chosen_korean: 「당신의 여종」
  alternatives_korean:
  - 「당신의 시녀」
  - 「당신의 하녀」
  lexicon: LSJ
  rationale: παιδίσκη는 젊은 여자 종/하녀를 가리키므로, 앞의 δοῦλη와 구별되는 여성적·겸손한 자기칭을 살려 ‘여종’으로 옮겼습니다.
- source_word: κατὰ πρόσωπόν σου
  english_pob_choice: before you
  chosen_korean: 「당신 앞에서」
  alternatives_korean:
  - 「당신의 얼굴 앞에서」
  - 「당신 면전에서」
  lexicon: LSJ
  rationale: 관용구의 직접 뜻을 살리되 한국어로는 ‘앞에서’가 가장 자연스럽고, 군더더기 없이 예의 있는 대면 발화를 나타냅니다.
- source_word: οὐκ ἀναγγελῶ ψεῦδος
  english_pob_choice: I will not tell a lie
  chosen_korean: 「…거짓을 말하지 않겠습니다」
  alternatives_korean:
  - 「…거짓을 알리지 않겠습니다」
  - 「…거짓말을 하지 않겠습니다」
  lexicon: LSJ
  rationale: ἀναγγέλλω는 ‘알리다/전하다’이지만 여기서는 ψεῦδος와 결합해 발화 전체를 가리키므로, 한국어에서는 자연스럽게 ‘거짓을 말하다’로 풀었습니다.
theological_decisions:
- issue: 두 개의 여성 자기호칭(δοῦλη / παιδίσκη)을 어떻게 구별할지
  chosen_reading: 둘 다 자기비하적 호칭이지만, 첫 번째는 ‘종’, 두 번째는 ‘여종’으로 두어 반복을 살리면서도 한국어 어색함을 줄였습니다.
  alternative_readings:
  - 둘 다 ‘여종’으로 통일
  - 둘 다 ‘노예’로 통일
  rationale: 본문은 겸손한 청원 수사로서 서로 다른 어휘를 연달아 사용합니다. 한국어에서도 동일어 반복보다 약간의 변화를 두면 수사적 긴장이 보존됩니다.
  doctrine_reference: 'DOCTRINE.md: δοῦλος/δοῦλη는 문맥에 따라 종/노예를 구분하되, 공손한 자기비하 발화에서는 수사 기능을 우선하여 결정'
