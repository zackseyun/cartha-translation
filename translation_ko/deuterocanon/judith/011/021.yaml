  text: There is no woman like this one from one end of the earth to the other, in beauty of face and wisdom of speech.
  footnotes:
  - marker: a
    text: Or 'from one end of the land to the other.' The Greek γῆ can mean either 'earth' or 'land'; the broader sense fits the hyperbolic praise here.
    reason: lexical_alternative
  - marker: b
    text: Literally 'in a good/beautiful face and understanding of words.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이와 같은 여자는 세상 끝에서 세상 끝에 이르기까지 없습니다. 얼굴의 아름다움과 말의 지혜에서 그렇습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘세상의 끝에서 끝까지’ 또는 ‘땅 끝에서 끝까지’입니다. 여기서는 전 세계적 범위를 드러내는 과장법으로 이해했습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘좋은/아름다운 얼굴과 말의 이해(분별)’입니다. ‘말의 지혜’는 의미를 살린 자연스러운 표현입니다.
    reason: lexical_alternative
