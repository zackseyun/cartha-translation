  text: There is no woman like this one from one end of the earth to the other, in beauty of face and wisdom of speech.
  footnotes:
  - marker: a
    text: Or 'from one end of the land to the other.' The Greek γῆ can mean either 'earth' or 'land'; the broader sense fits the hyperbolic praise here.
    reason: lexical_alternative
  - marker: b
    text: Literally 'in a good/beautiful face and understanding of words.'
    reason: lexical_alternative
translation:
  language: ko
  text: 온 땅 끝에서 끝까지[a] 얼굴의 아름다움과 말의 지혜[b]에 있어서 이와 같은 여자는 없습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘세상 끝에서 끝까지’. 헬라어 γῆ는 ‘땅’ 또는 ‘세상’을 뜻할 수 있습니다. 여기서는 전 세계적 범위를 드러내는 과장된 찬사입니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘아름다운 얼굴과 말들의 이해(분별)’입니다. ‘말의 지혜’는 말하는 데 나타나는 지혜와 분별을 자연스럽게 옮긴 표현입니다.
    reason: lexical_alternative
