  text: הֲבֵ֤ל הֲבָלִים֙ אָמַ֣ר קֹהֶ֔לֶת הֲבֵ֥ל הֲבָלִ֖ים הַ/כֹּ֥ל הָֽבֶל׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/001/002.yaml
  text: Breath of breaths[a], says Qoheleth[b]; breath of breaths, all is mere breath.
translation:
  language: ln
  text: '**Mosakoli 1:2**


    “Mpema ya bapema[a],” alobi Kohelete[b], “mpema ya bapema; nyonso ezali kaka mpema.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Na Ebre, הֶבֶל (hevel) elakisi mpenzampenza “mpema” to “londende.” Na mokanda oyo, liloba yango ezongeli mbala mingi lokola elilingi ya eloko oyo eumelaka te, ekoki kosimbama te, mpe oyo mbala mingi esukaka ndenge moto azalaki kozela te. Liloba moko te ya Lingala esangisaka makanisi yango nyonso. Yango wana tobongoli yango na elilingi ya “mpema.” «Mpema ya bapema» ezali lolenge ya Ebre ya koloba ete ezali mpema na ndenge eleki nyonso, lokola «nzembo ya banzembo» to «Mosantu ya basantu.»
    reason: lexical_choice
  - marker: b
    text: Kohelete ezali titre to nkombo ya Ebre oyo banda kala ebongolamaka “Moteyi” to “Mosakoli.” Lokola mabongoli yango mokomoko ezali kokitisa mwa ndambo ya ntina na yango, tobateli nkombo yango na ndenge ya mongongo ya Lingala.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲבֵל / הָבֶל (hevel)
  choice: mpema / kaka mpema
  rationale: Liloba ya Ebre elakisi mpenzampenza mpema to londende, mpe awa ezali elilingi ya eloko oyo eumelaka te, ekoki kosimbama te, mpe mbala mingi ebimisaka makambo ndenge moto azalaki kozela te. «Mpema» ebateli elilingi wana; na eteni ya nsuka, «kaka» epesi nguya ya kokitisa motuya oyo maloba yango ezali na yango na esika ya kosala lokola ete nyonso esalemi na mpema.
- source_word: הֲבֵל הֲבָלִים
  choice: mpema ya bapema
  rationale: Lolenge «X ya ba-X» ebateli ebongiseli ya superlatif ya Ebre, lokola «nzembo ya banzembo» to «Mosantu ya basantu», mpe ezali komonisa mpema na ndenge eleki nyonso.
- source_word: אָמַר
  choice: alobi
  rationale: Atako verbe ya Ebre ezali na lolenge oyo ekoki kolimbolama lokola eleko eleká, na fraze ya kokotisa liloba ya bwanya ezali koloba na ndenge ya sikoyo mpe ya bomoi.
- source_word: קֹהֶלֶת
  choice: Kohelete
  rationale: Nkombo ya lokumu yango ekomami na ndenge oyo ebongi na mongongo mpe bokomi ya Lingala, kozanga kokata soki elingi koloba «Moteyi», «Mosakoli», to moto oyo ayanganisaka bato.
- source_word: הַכֹּל
  choice: nyonso
  rationale: «Nyonso» ezali Lingala ya polele mpe ya momesano oyo ebateli nguya ya liloba ya Ebre oyo esangisi biloko nyonso.
theological_decisions:
- issue: Ndenge ya kobongola הֶבֶל, motó ya likanisi oyo ezongelami mingi na mokanda
  choice: 'Kobatela elilingi ya «mpema»: «mpema ya bapema» mpe «kaka mpema».'
  alternative: mpamba; ezangi ntina; eumelaka te; ekoki kosimbama te
  rationale: 'Maloba ya makanisi lokola «ezangi ntina» ekoki kokotisa likanisi ya ete bomoi ezali na ntina ata moko te, nzokande Ebre ezali kotika esika mpo na makambo misato esangani: koumela te, kozala mpasi mpo na kosimba to kososola, mpe bokeseni kati na oyo moto azali kozela ná oyo esalemaka. Elilingi ya mpema ebateli bokono wana nyonso kozanga kokata ndimbola moko kaka.'
- issue: Ndenge ya komonisa קֹהֶלֶת
  choice: Kohelete
  alternative: Moteyi; Mosakoli; Moyanganisi
  rationale: Ntina ya titre yango ezali na bososoli ndenge na ndenge. Kokoma yango lokola nkombo ebateli polele te ya makomi ya Ebre mpe epengoli kokotisa mosala moko oyo ekoki kozala moke koleka ntina na yango.
translation_notes:
  register: Lingala ya mikolo oyo, ya lokumu mpe ya polele. Fraze ebateli bozongeli mpe bokasi ya maloba ya Ebre. «Kaka mpema» ezali idiome ya Lingala oyo emonisi kokitisama ya motuya kozanga koloba ete biloko nyonso esalemi mpenzampenza na mpema.
