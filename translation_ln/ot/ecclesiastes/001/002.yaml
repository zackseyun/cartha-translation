  terminology: '«Mpema» retains the concrete image of הֶבֶל rather than prematurely narrowing it to meaninglessness or futility. «Kohelete» is a sensible Lingala-adapted transliteration that preserves the source designation’s openness. Footnote markers are correctly attached: [a] to the first hevel expression and [b] to Kohelete.'
