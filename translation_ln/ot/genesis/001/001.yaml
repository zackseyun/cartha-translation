  text: בְּ/רֵאשִׁ֖ית בָּרָ֣א אֱלֹהִ֑ים אֵ֥ת הַ/שָּׁמַ֖יִם וְ/אֵ֥ת הָ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/001.yaml
  text: In the beginning, when God created the heavens and the earth[a]—
translation:
  language: ln
  text: Na ebandeli, ntango Nzambe akelaki likoló mpe mabele[a]—
  philosophy: optimal-equivalence
  footnotes: &id001
  - marker: a
    text: 'Na bonkɔkɔ, babongolaka yango lokola fraze mobimba: “Na ebandeli, Nzambe akelaki likoló mpe mabele.” Kasi na Liebele, בְּרֵאשִׁית ezangi artikle mpe elandi na verbe bָּרָא; yango ekoki kotángama lokola fraze ya ntango oyo etaleli oyo elandi, ndenge moko na Ebandeli 2:4b. Fraze ya ntina ezali na vɛrsɛ 3: “Nzambe alobaki: ‘Pole ezala.’”'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּרֵאשִׁית
  choice: Na ebandeli, ntango … azalaki kokela
  rationale: Ebongoli רֵאשִׁית lokola “ebandeli,” mpe emonisi ete maloba yango ezali fraze ya ntango oyo ekobi kino na likambo ya ntina oyo elandi.
- source_word: בָּרָא
  choice: azalaki kokela
  rationale: “Kokela” ezali liloba ya Lingala oyo elobaka polele mosala ya Nzambe ya kosala biloko ezala; lolenge “azalaki kokela” esungi fraze ya ntango kozala ya kokangama na oyo elandi, kozanga kolimbola lolenge oyo akelaki.
- source_word: אֱלֹהִים
  choice: Nzambe
  rationale: Atako אֱלֹהִים ezali na lolenge ya pluriel, verbe בָּרָא ezali singulier awa; yango wana elakisi Nzambe moko.
- source_word: אֵת
  choice: '[ebongolami na liloba moko te; elembo ya complément d’objet direct]'
  rationale: אֵת ezali elembo ya grammaire ya Liebele oyo ezangi liloba ya ndenge moko na Lingala; molɔngɔ ya maloba nde emonisi mosala na yango.
- source_word: הַשָּׁמַיִם
  choice: likoló
  rationale: Na Lingala ya lelo, “likoló” ezali lolenge ya momeseno mpe ya polele mpo na shamayim; elongo na “mabele,” ezali kolakisa biloko nyonso oyo ekelamá.
- source_word: הָאָרֶץ
  choice: mabele
  rationale: Na boyokani ya molɔ́ngɔ “likoló mpe mabele,” אָרֶץ elakisi mabele, kasi kaka mokili to etando moko te.
theological_decisions:
- issue: Sintakse ya fraze ya ebandeli
  choice: 'Fraze ya ntango oyo ekangami na oyo elandi: “Na ebandeli, ntango Nzambe azalaki kokela likoló mpe mabele—”'
  alternative: 'Fraze mobimba: “Na ebandeli, Nzambe akelaki likoló mpe mabele.”'
  rationale: בְּרֵאשִׁית ezangi article mpe elandi mbala moko na verbe בָּרָא; yango ekoki kotángama na lolenge ya bomoto lokola fraze ya ntango, ndenge moko na Ebandeli 2:4b mpe Hosea 1:2. Elembo ya tiret emonisi ete likanisi ezali kokoba. Lokola botángi ya bonkɔkɔ ekoki mpe, footnote ebateli yango kozanga kosilisa ntembe ya sintakse.
translation_notes:
  register: Lingala ya ekólo mobimba, ya lokumu mpe ya pete mpo na batángi ya lelo. “Likoló mpe mabele” ezali maloba ya bomoto na Lingala mpe ebateli merisme ya Liebele. Tiret ya nsuka emonisi ete fraze ekoki na vɛrsɛ oyo elandi.
