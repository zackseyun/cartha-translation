id: JHN.1.1
reference: John 1:1
language:
  code: ln
  name: Lingala
  native_name: Lingála
  variant: Standard Lingala
source:
  edition: SBLGNT
  text: Ἐν ἀρχῇ ἦν ὁ λόγος, καὶ ὁ λόγος ἦν πρὸς τὸν θεόν, καὶ θεὸς ἦν ὁ λόγος.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/001.yaml
  text: In the beginning was the Word[a], and the Word was with God[b], and the Word was God.
translation:
  language: ln
  text: Na ebandeli[b], Liloba azalaki; Liloba azalaki elongo na Nzambe, mpe Liloba azalaki Nzambe.[a]
  philosophy: optimal-equivalence
  footnotes: &id001
  - marker: a
    text: 'Ekoki mpe kobongolama: «Liloba azalaki na ezaleli ya Nzambe,» to «Ndenge Nzambe azali, Liloba mpe azalaki bongo.» Na fraze ya Greke, «Nzambe» na eteni ya nsuka ezangi article mpe ezali liboso ya verbe; yango ekoki kolakisa ezaleli ya Liloba, wana Liloba akeseni na Nzambe oyo balobeli na fraze oyo eleki.'
    reason: alternative_reading
  - marker: b
    text: Maloba «Na ebandeli» ezongisi makanisi na Ebandeli 1:1 mpe ekangisi Liloba na ebandeli ya bozalisi.
    reason: cross_reference
lexical_decisions:
- source_word: Ἐν ἀρχῇ
  choice: Na ebandeli
  rationale: Ezali lolenge ya Lingala ya momesano mpe ya polele, mpe ebateli boyokani ya maloba oyo na Ebandeli 1:1.
- source_word: ἦν
  choice: azalaki
  rationale: Imparfait ya εἰμί emonisi ete Liloba azalaki kala; «azalaki» ezali ya bomoto na Lingala mpe ebateli bozongeli ya verbe na molɔngɔ.
- source_word: ὁ λόγος
  choice: Liloba
  rationale: «Liloba» ebateli likanisi ya koloba mpe komimonisa, mpe esalelami awa lokola nkombo oyo elakisi moto. Yango wana boyokani ya moto «azalaki» esalelami.
- source_word: πρὸς τὸν θεόν
  choice: elongo na Nzambe
  rationale: Na esika oyo, πρός elakisi kozala pene mpe na boyokani na Nzambe. «Elongo na Nzambe» ezali Lingala ya bomoto mpe ebateli bokeseni kati na Liloba ná Nzambe oyo balobeli.
- source_word: θεὸς ἦν ὁ λόγος
  choice: Liloba azalaki Nzambe
  rationale: Lolenge oyo ezali polele mpe sembo na makasi ya θεός, oyo awa elakisi ezaleli ya Liloba. Ebongoli yango te na «nzambe moko» mpe ekitisaka yango te kaka na «ya bonzambe».
theological_decisions:
- issue: Ndenge ya kobongola θεός oyo ezangi article na fraze ya nsuka
  choice: Liloba azalaki Nzambe
  alternative: Liloba azalaki na bomoto ya Nzambe; Ndenge Nzambe azali, Liloba mpe azalaki bongo
  rationale: 'θεός oyo ezali liboso ya verbe ezali mingimingi ya kolakisa ezaleli: endimisi ete Liloba azali mpenza na bonzambe, kasi esangisi te Liloba ná Nzambe oyo balobeli na fraze oyo eleki lokola nde bazali moto moko. Maloba ya moboko ebateli makasi mpe mokakatano wana; note epesi ndimbola mosusu oyo emonisi nuance yango.'
translation_notes:
  register: Lingala ya lelo, ya lokumu mpe ya pete mpo na batángi mingi. «Liloba» ezwami lokola nkombo ya moto, yango wana «azalaki» esalelami. Ponktiasyo epesi cadence ya polele kozanga kobakisa ndimbola oyo ezali te na Greke.
