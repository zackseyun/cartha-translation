base_translation:
  language: en
  yaml_path: translation/ot/judges/002/013.yaml
  text: They abandoned Yahweh and served Baal and the Ashtoreths[a][b][c].
translation:
  language: hi
  text: उन्होंने याहवे को छोड़ दिया और बाल तथा अश्तारोतों[a] की सेवा की।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में ‘अश्तारोत’ बहुवचन है। यह अश्तोरेत (अश्तारता) नामक देवी के अनेक स्थानीय रूपों या उसकी प्रतिमाओं की ओर संकेत कर सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַזְבוּ
  choice: छोड़ दिया
  rationale: עזב का अर्थ छोड़ना या त्याग देना है। आधुनिक हिन्दी में ‘छोड़ दिया’ स्वाभाविक है और प्रसंग में निष्ठा त्यागने का भाव स्पष्ट रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिब्रू के व्यक्तिगत ईश्वरीय नाम יהוה को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से प्रस्तुत किया गया है, किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: וַיַּעַבְדוּ
  choice: सेवा की
  rationale: עבד के मूल अर्थ ‘सेवा करना’ को सुरक्षित रखा गया है; बाल और अश्तारोतों के संदर्भ से धार्मिक उपासना का आशय स्वतः स्पष्ट होता है।
- source_word: לַבַּעַל
  choice: बाल
  rationale: निर्देशक उपपद के बावजूद हिन्दी में देवता का नाम ‘बाल’ स्वाभाविक है; ‘उस बाल’ अनावश्यक रूप से शब्दशः और असहज होता।
- source_word: וְלָעַשְׁתָּרוֹת
  choice: अश्तारोतों
  rationale: עשתרות व्याकरणिक रूप से बहुवचन है। ‘अश्तारोतों’ उस बहुवचन को बनाए रखता है और विभक्ति सहित स्वाभाविक हिन्दी रूप देता है।
theological_decisions:
- issue: עשתרות के बहुवचन का अनुवाद
  choice: अश्तारोतों
  alternative: अश्तोरेत / अश्तारता
  rationale: मूल हिब्रू का बहुवचन सुरक्षित रखा गया है; इसे किसी एक देवी के एकवचन नाम में बदलकर संभावित स्थानीय स्वरूपों, प्रतिमाओं या देवी-समूह के प्रश्न को निर्णीत नहीं किया गया।
- issue: मूर्तिपूजक देवताओं के संदर्भ में עבד का धार्मिक अर्थ
  choice: सेवा की
  alternative: पूजा की
  rationale: ‘सेवा की’ हिब्रू क्रिया की व्यापक अर्थ-सीमा बचाती है, जबकि इस धार्मिक प्रसंग में उपासना का भाव भी समझ में आता है।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और गरिमापूर्ण रखी गई है। ‘छोड़ दिया’ तथा ‘सेवा की’ सामान्य पाठक के लिए सहज हैं; ‘अश्तारोतों’ मूल के वास्तविक बहुवचन और उसकी अस्पष्टता को बनाए रखता है।
