  text: וַ/יִּקְבְּר֤וּ אוֹת/וֹ֙ בִּ/גְב֣וּל נַחֲלָת֔/וֹ בְּ/תִמְנַת חֶ֖רֶס בְּ/הַ֣ר אֶפְרָ֑יִם מִ/צְּפ֖וֹן לְ/הַר גָּֽעַשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/009.yaml
  text: And they buried him within the territory of his inheritance[a], in Timnath-heres, in the hill country of Ephraim, north of Mount Gaash.
translation:
  language: hi
  text: और उन्होंने उसे उसके विरासत में मिले भू-भाग के भीतर, तिम्नत-हेरेस[a] में, एप्रैम के पहाड़ी प्रदेश में, गाश पर्वत के उत्तर में दफ़नाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहोशू 24:30 में इस स्थान का नाम ‘तिम्नत-सेरह’ है, जबकि यहाँ ‘तिम्नत-हेरेस’ है। समानांतर दफ़न-विवरणों में पाए जाने वाले स्थान-नाम के इस भेद को यहाँ सुरक्षित रखा गया है।
    reason: textual_variant
lexical_decisions:
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: और उन्होंने उसे ... दफ़नाया
  rationale: वय्यिक्तोल कथा को आगे बढ़ाता है; אוֹתוֹ का पुरुषवाचक एकवचन कर्म स्पष्ट रूप से यहोशू को सूचित करता है।
- source_word: בִּגְבוּל נַחֲלָתוֹ
  choice: उसके विरासत में मिले भू-भाग में
  rationale: גְּבוּל यहाँ केवल सीमा-रेखा नहीं, बल्कि क्षेत्र है; נַחֲלָה भूमि के रूप में मिले पैतृक/आवंटित अधिकार को सूचित करता है। यह रूप आधुनिक हिन्दी में अर्थ स्पष्ट करता है।
- source_word: בְּתִמְנַת חֶרֶס
  choice: तिम्नत-हेरेस में
  rationale: स्थान-नाम को स्रोत-पाठ के व्यंजनात्मक रूप के निकट देवनागरी में लिप्यंतरित किया गया है।
- source_word: בְּהַר אֶפְרָיִם
  choice: एप्रैम के पहाड़ी प्रदेश में
  rationale: इस भौगोलिक पदबंध में הַר किसी एक पहाड़ के बजाय विस्तृत पहाड़ी क्षेत्र को दर्शाता है।
- source_word: מִצְּפוֹן לְהַר גָּעַשׁ
  choice: गाश पर्वत के उत्तर में
  rationale: מִצְּפוֹן לְ स्थान-सापेक्ष दिशा बताता है; हिन्दी में ‘के उत्तर में’ स्वाभाविक है। גָּעַשׁ को स्थान-नाम के रूप में लिप्यंतरित किया गया है।
