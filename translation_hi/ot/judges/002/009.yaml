  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘विरासत में मिले भू-भाग’ भूमि-अधिकार का अर्थ सामान्य पाठक के लिए स्पष्ट करता है; भौगोलिक नामों को देवनागरी में स्रोत-सन्निकट रूप से दिया गया है।
