source:
  edition: WLC
  text: וְ/גַ֣ם אָמַ֔רְתִּי לֹֽא אֲגָרֵ֥שׁ אוֹתָ֖/ם מִ/פְּנֵי/כֶ֑ם וְ/הָי֤וּ לָ/כֶם֙ לְ/צִדִּ֔ים וֵ/אלֹ֣הֵי/הֶ֔ם יִהְי֥וּ לָ/כֶ֖ם לְ/מוֹקֵֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/003.yaml
  text: So I also said[a], ‘I will not drive them out from before you; they will become adversaries to you, and their gods will become a snare to you.’
translation:
  language: hi
  text: इसलिए मैंने भी कहा, ‘मैं उन्हें तुम्हारे सामने से नहीं निकालूँगा। वे तुम्हारे विरोधी बनेंगे[a], और उनके देवता तुम्हारे लिए फंदा बनेंगे।’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से “पहलू” या “बगलें” है। कुछ प्राचीन अनुवाद और समानांतर वचन इसे “तुम्हारे पहलुओं में काँटे” के अर्थ में पढ़ते या समझते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: וְגַם אָמַרְתִּי
  choice: इसलिए मैंने भी कहा
  rationale: וְגַם पिछले वचन की फटकार से इस घोषणा को जोड़ता है और परिणामात्मक बल भी रखता है; आधुनिक हिन्दी में ‘इसलिए...भी’ दोनों पहलुओं को स्वाभाविक रूप से व्यक्त करता है।
- source_word: לֹא אֲגָרֵשׁ אוֹתָם
  choice: मैं उन्हें ... नहीं निकालूँगा
  rationale: גרש का अर्थ बलपूर्वक निकालना या खदेड़ना है। ‘निकालूँगा’ विजय और देश से हटाए जाने के प्रसंग में स्पष्ट और सहज है।
- source_word: מִפְּנֵיכֶם
  choice: तुम्हारे सामने से
  rationale: यह इब्रानी स्थानवाचक मुहावरे के निकट है और केवल अमूर्त ‘तुम्हारी उपस्थिति से’ की अपेक्षा प्रसंग को अधिक स्पष्ट रखता है।
- source_word: לְצִדִּים
  choice: तुम्हारे विरोधी
  rationale: मसोरा-पाठ का शाब्दिक रूप ‘पहलू/बगलें’ कठिन और हिन्दी में अस्पष्ट है। प्रसंग में इससे शत्रुतापूर्ण निकटता या सताने वाले विरोध का बोध होता है; पाठगत कठिनाई को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: וֵאלֹהֵיהֶם
  choice: और उनके देवता
  rationale: मूर्तिपूजा के इस प्रसंग में אֱלֹהִים के बहुवचन और प्रत्यय का सीधा, मानक अनुवाद है।
- source_word: יִהְיוּ לָכֶם לְמוֹקֵשׁ
  choice: तुम्हारे लिए फंदा बनेंगे
  rationale: מוֹקֵשׁ शिकार के फंदे या जाल को दर्शाता है और यहाँ बहकावे तथा विनाशकारी आध्यात्मिक खतरे का रूपक है।
theological_decisions:
- issue: कठिन मसोरा-पाठ לְצִדִּים का अनुवाद
  choice: तुम्हारे विरोधी बनेंगे
  alternative: तुम्हारे पहलुओं में काँटे बनेंगे
  rationale: दिए गए इब्रानी पाठ में ‘काँटे’ शब्द नहीं, बल्कि शाब्दिक रूप से ‘पहलू/बगलें’ है। मुख्य पाठ में सहज हिन्दी द्वारा उसके प्रसंगगत शत्रुतापूर्ण अर्थ को व्यक्त किया गया है, जबकि प्राचीन पाठ-परंपरा और समानांतर वचनों से परिचित ‘काँटों’ वाले अर्थ को पादटिप्पणी में रखा गया है; इस प्रकार किसी पाठगत विकल्प को चुपचाप मूल में नहीं मिलाया गया।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘तुम्हारे सामने से’ और ‘फंदा’ मूल रूपकों को बनाए रखते हैं; कठिन पाठ לְצִדִּים को मुख्य वाक्य में बोधगम्य बनाया गया है और उसकी वास्तविक पाठगत अस्पष्टता पादटिप्पणी में स्पष्ट की गई है।
