source:
  edition: WLC
  text: וַ/יַּנַּ֤ח יְהוָה֙ אֶת הַ/גּוֹיִ֣ם הָ/אֵ֔לֶּה לְ/בִלְתִּ֥י הוֹרִישָׁ֖/ם מַהֵ֑ר וְ/לֹ֥א נְתָנָ֖/ם בְּ/יַד יְהוֹשֻֽׁעַ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/023.yaml
  text: So Yahweh left these nations[a], not driving them out quickly, and he did not give them into the hand of Joshua.
translation:
  language: hi
  text: इसलिए याहवे ने इन जातियों को रहने दिया[a], उन्हें शीघ्र नहीं निकाला, और उन्हें यहोशू के हाथ में नहीं सौंपा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “इन लोगों को रहने दिया”; इब्रानी क्रिया का अर्थ “रहने देना” या “वहीं छोड़ देना” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּנַּח
  choice: रहने दिया
  rationale: हिफ़ील रूप यहाँ किसी को बने रहने देना या न हटाना व्यक्त करता है; ‘रहने दिया’ आधुनिक हिन्दी में स्वाभाविक है और सन्दर्भ के अनुरूप है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चतुरक्षरीय परमेश्वर-नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित व्यक्तिगत नाम ‘यहोवा’ से व्यक्त किया गया है।
- source_word: הַגּוֹיִם הָאֵלֶּה
  choice: उन जातियों
  rationale: גּוֹיִם यहाँ कनान में बची हुई जातीय-राजनीतिक जनजातियों को सूचित करता है; हिन्दी बाइबिलीय और सामान्य प्रयोग में ‘जातियाँ’ उपयुक्त है। संकेतवाचक ‘उन’ पिछले सन्दर्भ की जातियों की ओर स्वाभाविक संकेत करता है।
- source_word: לְבִלְתִּי הוֹרִישָׁם
  choice: उसने उन्हें ... नहीं निकाला
  rationale: यह नकारात्मक क्रियार्थक रचना उद्देश्य अथवा परिणाम दोनों का आभास दे सकती है। हिन्दी में अलग मुख्य उपवाक्य अर्थ को स्पष्ट रखते हुए किसी एक सूक्ष्म संबंध को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: מַהֵר
  choice: शीघ्र
  rationale: क्रियाविशेषण का अर्थ जल्दी या शीघ्र है; ‘शीघ्र’ गरिमापूर्ण और सहज मानक हिन्दी है।
- source_word: וְלֹא נְתָנָם בְּיַד יְהוֹשֻׁעַ
  choice: और न उन्हें यहोशू के हाथ में सौंपा
  rationale: ‘हाथ में देना’ सामर्थ्य या अधिकार में सौंपने का इब्रानी मुहावरा है। ‘हाथ में सौंपा’ मूल बिम्ब और युद्ध-सन्दर्भ दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ व्यक्तिगत दिव्य नाम का प्रयोग करता है। हिन्दी पाठकों के लिए व्यापक रूप से पहचाने जाने वाले ‘यहोवा’ को अपनाकर नाम को ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित नहीं किया गया।
- issue: जातियों के बने रहने में यहोवा की भूमिका
  choice: यहोवा ने ... रहने दिया
  alternative: जातियाँ रह गईं
  rationale: मूल क्रिया यहोवा को कर्ता बनाती है; अनुवाद उसी दैवी सक्रिय अनुमति को बनाए रखता है और उसे केवल निष्क्रिय ऐतिहासिक घटना नहीं बनाता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथात्मक शैली रखी गई है। ‘शीघ्र’ और ‘हाथ में सौंपा’ मूल की औपचारिकता तथा बिम्ब को बनाए रखते हैं, जबकि वाक्य-संरचना सामान्य पाठक के लिए सहज है।
