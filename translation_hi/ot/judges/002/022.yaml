  text: לְמַ֛עַן נַסּ֥וֹת בָּ֖/ם אֶת יִשְׂרָאֵ֑ל הֲ/שֹׁמְרִ֣ים הֵם֩ אֶת דֶּ֨רֶךְ יְהוָ֜ה לָ/לֶ֣כֶת בָּ֗/ם כַּ/אֲשֶׁ֛ר שָׁמְר֥וּ אֲבוֹתָ֖/ם אִם לֹֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/022.yaml
  text: in order to test Israel by them[a], whether they would keep the way of Yahweh by walking in it, as their fathers kept it, or not.
translation:
  language: hi
  text: ताकि उन जातियों के द्वारा[a] इस्राएल को परखा जाए कि वे याहवे के मार्ग को मानते हुए उस पर चलते हैं या नहीं, जैसा उनके पुरखाओं ने माना था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उन जातियों के माध्यम से।” इब्रानी सर्वनाम का संकेत पिछले प्रसंग में देश में छोड़ी गई जातियों की ओर है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן נַסּוֹת
  choice: ताकि ... परीक्षा हो
  rationale: उद्देश्यसूचक לְמַעַן और נסה के जाँचने/परखने के भाव को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: בָּם
  choice: उन जातियों के द्वारा
  rationale: सर्वनाम का संकेत पिछले प्रसंग में देश में छोड़ी गई जातियों की ओर है; संज्ञा स्पष्ट करने से हिन्दी में संदर्भ सहज बनता है।
- source_word: הֲשֹׁמְרִים הֵם
  choice: कि वे ... पालन करते हैं या नहीं
  rationale: प्रश्नवाचक रचना परीक्षा की विषय-वस्तु बताती है; वर्तमानकालीन अभिव्यक्ति इब्रानी कृदन्त के चरित्रगत आचरण के भाव को बनाए रखती है।
- source_word: דֶּרֶךְ יְהוָה
  choice: यहोवा का मार्ग
  rationale: यह आज्ञापित जीवन-पद्धति के बाइबलीय रूपक को बनाए रखता है और ईश्वरीय नाम को शीर्षक से नहीं बदलता।
- source_word: לָלֶכֶת בָּם
  choice: मार्ग पर चलते हुए
  rationale: चलने के मूल रूपक को सुरक्षित रखते हुए हिन्दी में पालन करने के ढंग को स्वाभाविक रूप से स्पष्ट करता है।
- source_word: כַּאֲשֶׁר שָׁמְרוּ אֲבוֹתָם
  choice: जैसा उनके पुरखाओं ने किया था
  rationale: तुलना और पूर्वजों के पालन को व्यक्त करता है; हिन्दी में अनावश्यक पुनरुक्ति से बचने के लिए 'किया था' पहले आए 'पालन' की ओर संकेत करता है।
- source_word: אִם לֹא
  choice: या नहीं
  rationale: प्रश्नवाचक 'कि...या नहीं' रचना का स्वाभाविक हिन्दी समापन है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: व्यक्तिगत वाचा-नाम को पदवी से बदलने के बजाय हिन्दी में व्यापक रूप से पहचाने जाने वाले लिप्यंतरण 'यहोवा' से प्रस्तुत किया गया है।
- issue: אֲבוֹתָם में पूर्वजों का पुरुषवाचक उल्लेख
  choice: उनके पुरखा
  alternative: उनके पूर्वज
  rationale: '''पुरखा'' वंशगत पितृ-पूर्वजों के संदर्भ को स्वाभाविक हिन्दी में बनाए रखता है, जबकि सामान्य ''पूर्वज'' लिंग-सूचना को मंद कर सकता है।'
- issue: परीक्षा का कर्ता और माध्यम
  choice: उन जातियों के द्वारा इस्राएल की परीक्षा हो
  alternative: मैं उन जातियों के द्वारा इस्राएल की परीक्षा लूँ
  rationale: इस पद में परीक्षक कर्ता स्पष्ट रूप से व्यक्त नहीं है और वाक्य पिछले पद से जुड़ा है; अनकहे प्रथम पुरुष को जोड़ने के बजाय मूल की वाक्यगत निर्भरता और अस्पष्टता रखी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। 'मार्ग पर चलना' मूल रूपक को बनाए रखता है। पद पिछले वाक्य का उद्देश्यसूचक अंश है, इसलिए हिन्दी पाठ भी 'ताकि' से आरम्भ होता है।
