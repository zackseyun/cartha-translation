base_translation:
  language: en
  yaml_path: translation/ot/judges/002/010.yaml
  text: And all that generation also were gathered to their fathers[a], and another generation arose after them who did not know Yahweh[b], or even the work that he had done for Israel.
translation:
  language: hi
  text: और वह सारी पीढ़ी भी अपने पुरखों के पास जा मिली[a]। उनके बाद एक दूसरी पीढ़ी उठी, जो न तो यहोवा को जानती थी[b] और न उस काम को, जो उसने इस्राएल के लिए किया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “अपने पितरों के पास इकट्ठी की गई”; यह मरने और अपने पूर्वजों से जा मिलने का इब्रानी मुहावरा है।
    reason: cultural_note
  - marker: b
    text: या “यहोवा को स्वीकार नहीं करती थी”; यहाँ “जानना” केवल तथ्यात्मक जानकारी नहीं, बल्कि संबंधपरक या वाचा के आधार पर पहचानना भी सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם כָּל הַדּוֹר הַהוּא
  choice: और वह सारी पीढ़ी भी
  rationale: וְגַם के संयोजक और बलवाचक दोनों भाव रखे गए हैं; כָּל पूरे पीढ़ी-समूह को सूचित करता है।
- source_word: נֶאֶסְפוּ אֶל אֲבוֹתָיו
  choice: अपने पुरखों में जा मिली
  rationale: मृत्यु और पूर्वजों से जा मिलने के इब्रानी मुहावरे को स्वाभाविक हिन्दी में मुहावरे के रूप में सुरक्षित रखा गया है।
- source_word: וַיָּקָם דּוֹר אַחֵר אַחֲרֵיהֶם
  choice: उनके बाद एक दूसरी पीढ़ी उठी
  rationale: कालक्रम, नई पीढ़ी के उदय और उससे पहले की पीढ़ी से उसके भेद—तीनों को स्पष्ट रखता है।
- source_word: לֹא יָדְעוּ אֶת יְהוָה
  choice: जो न तो यहोवा को जानती थी
  rationale: יָדַע के तथ्यात्मक, अनुभवात्मक और संबंधपरक अर्थों को किसी एक अर्थ तक सीमित किए बिना ‘जानती थी’ में सुरक्षित रखा गया है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में प्रचलित व्यक्तिगत नाम-रूप ‘यहोवा’ मूल पाठ में आए परमेश्वर के नाम को उपाधि से प्रतिस्थापित नहीं करता।
- source_word: וְגַם אֶת הַמַּעֲשֶׂה
  choice: और न उस काम को
  rationale: नकारात्मक वाक्य में दूसरे कर्म को जोड़ने वाला וְגַם हिन्दी के स्वाभाविक ‘न तो... और न...’ विन्यास से व्यक्त हुआ है; מַעֲשֶׂה को सामूहिक अर्थ में ‘काम’ कहा गया है।
- source_word: אֲשֶׁר עָשָׂה לְיִשְׂרָאֵל
  choice: जो उसने इस्राएल के लिए किया था
  rationale: לְ को प्रसंगानुसार हितार्थक माना गया है और पूर्व में किए गए उद्धारकारी कार्य का कालगत संबंध ‘किया था’ से व्यक्त किया गया है।
theological_decisions:
- issue: ‘यहोवा को नहीं जानते थे’ का आशय
  choice: मुख्य पाठ में ‘यहोवा को जानती थी’ रखकर अर्थ को व्यापक छोड़ा गया
  alternative: ‘यहोवा को मानती/स्वीकार करती थी’ अथवा ‘यहोवा के विषय में नहीं जानती थी’
  rationale: יָדַע संबंधपरक या वाचागत पहचान के साथ तथ्यात्मक अथवा अनुभवात्मक ज्ञान भी सूचित कर सकता है। अगला वाक्यांश उसके काम के अज्ञान को जोड़ता है, इसलिए पाठ की धार्मिक और अर्थगत व्यापकता को संकुचित नहीं किया गया।
- issue: ईश्वरीय नाम יהוה का रूप
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: व्यक्तिगत नाम को व्यक्तिगत नाम के रूप में रखा गया है; ‘यहोवा’ आधुनिक हिन्दी बाइबलीय प्रयोग में व्यापक रूप से पहचाना जाने वाला रूप है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘अपने पुरखों में जा मिली’ मूल मुहावरे की पीढ़ीगत छवि बचाता है, जबकि पादटिप्पणी उसका शाब्दिक और सांस्कृतिक अर्थ स्पष्ट करती है। ‘न तो... और न...’ हिन्दी में दोनों अज्ञान-विषयों को स्वाभाविक रूप से जोड़ता है।
