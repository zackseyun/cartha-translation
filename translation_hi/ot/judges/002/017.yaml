  text: וְ/גַ֤ם אֶל שֹֽׁפְטֵי/הֶם֙ לֹ֣א שָׁמֵ֔עוּ כִּ֣י זָנ֗וּ אַֽחֲרֵי֙ אֱלֹהִ֣ים אֲחֵרִ֔ים וַ/יִּֽשְׁתַּחֲו֖וּ לָ/הֶ֑ם סָ֣רוּ מַהֵ֗ר מִן הַ/דֶּ֜רֶךְ אֲשֶׁ֨ר הָלְכ֧וּ אֲבוֹתָ֛/ם לִ/שְׁמֹ֥עַ מִצְוֺת יְהוָ֖ה לֹא עָ֥שׂוּ כֵֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/017.yaml
  text: Yet they did not listen even to their judges[a], for they prostituted themselves after other gods and bowed down to them. They quickly turned aside from the way in which their fathers had walked in obeying the commandments of Yahweh; they did not do so.
translation:
  language: hi
  text: फिर भी उन्होंने अपने न्यायियों की भी न सुनी, क्योंकि उन्होंने दूसरे देवताओं के पीछे वेश्यावृत्ति की[a] और उनके आगे दण्डवत् किया। वे शीघ्र ही उस मार्ग से हट गए जिस पर उनके पुरखे याहवे की आज्ञाओं का पालन करते हुए चले थे; उन्होंने वैसा नहीं किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उन्होंने दूसरे देवताओं के पीछे वेश्यावृत्ति की।” हिब्रू में मूर्तिपूजा और वाचा से विश्वासघात के लिए यौन-बेवफाई का रूपक प्रयुक्त हुआ है।
    reason: मूल के तीखे यौन-अविश्वासयोग्यता रूपक और उसके शाब्दिक विकल्प को स्पष्ट करना।
lexical_decisions:
- source_word: וְגַם
  choice: फिर भी ... भी
  rationale: यह पद पिछले प्रसंग से हल्का विरोध जोड़ते हुए इस बात पर बल देता है कि उन्होंने अपने न्यायियों तक की न सुनी।
- source_word: אֶל שֹׁפְטֵיהֶם לֹא שָׁמֵעוּ
  choice: उन्होंने अपने न्यायियों की भी न सुनी
  rationale: שׁמע के 'सुनना/मानना' अर्थ को स्वाभाविक हिन्दी मुहावरे में रखा गया है; प्रसंग में आज्ञा न मानना निहित है।
- source_word: שֹׁפְטֵיהֶם
  choice: अपने न्यायियों
  rationale: न्यायियों के काल के विशिष्ट अगुओं के लिए ऐतिहासिक पदनाम बनाए रखा गया है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह उनके न्यायियों की न सुनने का कारण प्रस्तुत करता है।
- source_word: זָנוּ אַחֲרֵי
  choice: पीछे व्यभिचारिणी की तरह चल पड़े
  rationale: मूल का यौन-बेवफाई का सशक्त रूपक सुरक्षित रहता है, जबकि हिन्दी में इसका मूर्तिपूजा और वाचा से विश्वासघात का आशय समझ में आता है।
- source_word: אֱלֹהִים אֲחֵרִים
  choice: दूसरे देवताओं
  rationale: यहोवा के अतिरिक्त अन्य देवताओं का सीधा और स्वाभाविक अनुवाद।
- source_word: וַיִּשְׁתַּחֲווּ לָהֶם
  choice: उनके आगे दण्डवत् किया
  rationale: यह झुककर उपासना करने की मूल शारीरिक छवि को बनाए रखता है।
- source_word: סָרוּ מַהֵר מִן הַדֶּרֶךְ
  choice: वे शीघ्र ही उस मार्ग से हट गए
  rationale: मार्ग से मुड़ जाने का रूपक और מַהֵר की शीघ्रता दोनों सुरक्षित हैं।
- source_word: אֲשֶׁר הָלְכוּ אֲבוֹתָם
  choice: जिस पर उनके पुरखे ... चले थे
  rationale: चलने और मार्ग की संयुक्त रूपकात्मक छवि को स्वाभाविक हिन्दी में रखा गया है।
- source_word: לִשְׁמֹעַ מִצְוֺת יְהוָה
  choice: यहोवा की आज्ञाओं का पालन करते हुए
  rationale: आज्ञाओं के साथ שׁמע का अर्थ पालन करना है; यह वाक्यांश बताता है कि पुरखे उस मार्ग पर किस प्रकार चले थे।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चार अक्षरों वाले परमेश्वर के व्यक्तिगत नाम को हिन्दी में प्रचलित लिप्यंतरण 'यहोवा' से व्यक्त किया गया है, किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: לֹא עָשׂוּ כֵן
  choice: उन्होंने वैसा नहीं किया
  rationale: मूल के संक्षिप्त, बलपूर्ण निष्कर्ष को सीधे रूप में बनाए रखा गया है।
theological_decisions:
- issue: זָנוּ में वाचा से विश्वासघात का यौन-बेवफाई रूपक
  choice: व्यभिचारिणी की तरह चल पड़े
  alternative: विश्वासघात करके दूसरे देवताओं के पीछे चल पड़े
  rationale: मूल पाठ मूर्तिपूजा को जानबूझकर यौन बेवफाई के तीखे रूपक में रखता है। इसे केवल 'विश्वासघात' कहना उस नैतिक और वाचागत तनाव को कम कर देता। स्त्रीलिंग रूपक को फुटनोट सहित रखना हिब्रू की सामूहिक छवि को सुरक्षित करता है।
- issue: יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: व्यक्तिगत ईश्वरीय नाम को नाम के रूप में ही रखा गया है। आधुनिक हिन्दी बाइबल-पाठकों के लिए 'यहोवा' अधिक पहचाना जाने वाला देवनागरी रूप है; 'प्रभु' नाम को उपाधि में बदल देता।
- issue: पुरखों के मार्ग और आज्ञापालन का संबंध
  choice: जिस पर उनके पुरखे यहोवा की आज्ञाओं का पालन करते हुए चले थे
  alternative: जिस पर उनके पुरखे चले थे, ताकि यहोवा की आज्ञाओं का पालन करें
  rationale: לִשְׁמֹעַ को यहाँ पुरखों के उस मार्ग पर चलने की विशेषता/रीति के रूप में लिया गया है। इससे मार्ग और आज्ञापालन का संबंध स्पष्ट रहता है, बिना अलग उद्देश्य-वाक्य थोपे।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए सुबोध रखी गई है। 'न्यायी', 'दण्डवत्' और 'यहोवा' जैसे बाइबलीय शब्द ऐतिहासिक तथा धार्मिक संदर्भ की सटीकता के लिए रखे गए हैं।
