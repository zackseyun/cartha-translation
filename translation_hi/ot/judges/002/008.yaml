base_translation:
  language: en
  yaml_path: translation/ot/judges/002/008.yaml
  text: And Joshua son of Nun[a], the servant of Yahweh, died at the age of one hundred and ten years.
translation:
  language: hi
  text: और नून के पुत्र यहोशू, जो याहवे के सेवक[a] थे, एक सौ दस वर्ष की आयु में मर गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘सेवक’ का अनुवाद ‘दास’ भी हो सकता है। इब्रानी शब्द के दोनों अर्थ हो सकते हैं, पर यहाँ यह यहोशू की सम्मानसूचक उपाधि है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: और ... मर गए
  rationale: Qal wayyiqtol कथा के अगले क्रमिक घटनाक्रम को बताता है। हिन्दी में आरंभिक וַ को ‘और’ तथा क्रिया को आदरसूचक बहुवचन ‘मर गए’ से स्वाभाविक रूप में व्यक्त किया गया है।
- source_word: יְהוֹשֻׁעַ בִּן נוּן
  choice: नून के पुत्र यहोशू
  rationale: בִּן נוּן वंश-संबंध बताने वाली रचना है। ‘नून के पुत्र यहोशू’ आधुनिक हिन्दी में स्पष्ट और प्रतिष्ठित बाइबलीय रूप है।
- source_word: עֶבֶד יְהוָה
  choice: यहोवा के सेवक
  rationale: עֶבֶד का अर्थ ‘सेवक’ या ‘दास’ हो सकता है। यहाँ यह यहोशू की सम्मानसूचक उपाधि है, इसलिए मुख्य पाठ में ‘सेवक’ संदर्भानुकूल है; वैकल्पिक अर्थ फुटनोट में सुरक्षित रखा गया है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: टेट्राग्रामटन को हिन्दी में प्रचलित व्यक्तिगत नाम ‘यहोवा’ से प्रस्तुत किया गया है, न कि किसी उपाधि से।
- source_word: בֶּן מֵאָה וָעֶשֶׂר שָׁנִים
  choice: एक सौ दस वर्ष की आयु में
  rationale: इब्रानी में आयु बताने का शाब्दिक मुहावरा ‘एक सौ दस वर्षों का पुत्र’ है। हिन्दी में ‘एक सौ दस वर्ष की आयु में’ वही अर्थ स्वाभाविक और ठीक रूप से देता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम का प्रयोग करता है। हिन्दी में व्यापक रूप से पहचाने जाने वाले ‘यहोवा’ को चुनकर नाम को उपाधि ‘प्रभु’ से नहीं बदला गया।
- issue: यहोशू की उपाधि में עֶבֶד का अर्थ
  choice: सेवक
  alternative: दास
  rationale: शब्द में सेवा और दासत्व दोनों अर्थ संभव हैं, पर यहाँ यहोशू के लिए सम्मानसूचक उपाधि के रूप में प्रयुक्त है। ‘सेवक’ इस कार्य को स्वाभाविक ढंग से व्यक्त करता है, जबकि ‘दास’ की वास्तविक शाब्दिक संभावना फुटनोट में दी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण कथा-शैली। यहोशू के प्रति सामान्य हिन्दी सम्मान के अनुसार ‘थे/मर गए’ का प्रयोग किया गया है। फुटनोट-चिह्न मुख्य पाठ में वाक्य के अंत में रखा गया है।
