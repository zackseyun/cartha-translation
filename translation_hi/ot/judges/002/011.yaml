source:
  edition: WLC
  text: וַ/יַּעֲשׂ֧וּ בְנֵֽי יִשְׂרָאֵ֛ל אֶת הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה וַ/יַּעַבְד֖וּ אֶת הַ/בְּעָלִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/011.yaml
  text: And the sons of Israel did what was evil in the sight of Yahweh[b][a], and they served the Baals.
translation:
  language: hi
  text: इस्राएलियों[a] ने वह किया जो याहवे की दृष्टि में बुरा था, और उन्होंने बाल देवताओं की सेवा की[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, ‘इस्राएल के पुत्रों’।
    reason: lexical_alternative
  - marker: b
    text: या, ‘बाल देवताओं की उपासना की’। यहाँ प्रयुक्त हिब्रू क्रिया उपासना के रूप में की जाने वाली सेवा का अर्थ भी दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: ने…किया
  rationale: עשה का सामान्य अर्थ ‘करना’ है; ‘वह किया जो…बुरा था’ हिब्रू मुहावरे को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: בְנֵי יִשְׂרָאֵל
  choice: इस्राएलियों
  rationale: शाब्दिक अर्थ ‘इस्राएल के पुत्र’ है, पर यहाँ यह पूरे इस्राएली समुदाय का प्रचलित सामूहिक नाम है; ‘इस्राएलियों’ आधुनिक हिन्दी में सहज और समावेशी है।
- source_word: אֶת הָרַע
  choice: वह…जो…बुरा था
  rationale: शाब्दिक ‘बुराई को किया’ के बजाय यह हिन्दी अभिव्यक्ति नैतिक मूल्यांकन को स्पष्ट रखते हुए स्वाभाविक है।
- source_word: בְּעֵינֵי יְהוָה
  choice: याहवे की दृष्टि में
  rationale: यह हिब्रू के ‘याहवे की आँखों में’ मुहावरे का स्वाभाविक हिन्दी रूप है और ईश्वरीय मूल्यांकन का भाव बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार अक्षरों वाले ईश्वरीय नाम को किसी उपाधि से बदलने के बजाय उसके प्रचलित ध्वन्यात्मक रूप में रखा गया है।
- source_word: וַיַּעַבְדוּ
  choice: सेवा करने लगे
  rationale: עבד सेवा और उपासना दोनों का बोध करा सकता है। ‘सेवा’ मूल शब्द की व्यापकता और अन्य देवताओं के प्रति निष्ठा के भाव को बनाए रखती है; आरंभिक वाव-क्रमिक रूप को प्रसंगानुकूल ‘करने लगे’ से व्यक्त किया गया है।
- source_word: הַבְּעָלִים
  choice: बाल देवताओं
  rationale: हिब्रू बहुवचन विभिन्न स्थानीय बाल-रूपों या बाल देवताओं की ओर संकेत करता है। हिन्दी में केवल ‘बालों’ भ्रामक होगा, इसलिए बहुवचन को स्पष्ट करने के लिए ‘बाल देवताओं’ कहा गया है।
theological_decisions:
- issue: वाचा के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम सीधे आया है। ‘याहवे’ नाम को सुरक्षित रखता है और उसे उपाधि में नहीं बदलता।
- issue: עבד को ‘सेवा करना’ या ‘उपासना करना’ कहना
  choice: सेवा करने लगे
  alternative: उपासना करने लगे
  rationale: मूर्ति-पूजा का प्रसंग ‘उपासना’ अर्थ को संभव बनाता है, पर ‘सेवा’ हिब्रू क्रिया की व्यापकता तथा याहवे की सेवा और पराए देवताओं की सेवा के बीच वाचागत विरोध को अधिक सीधे सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘याहवे’ को व्यक्तिगत नाम के रूप में तथा ‘बाल देवताओं’ को स्पष्ट बहुवचन के रूप में रखा गया है।
