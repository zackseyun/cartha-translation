source:
  edition: WLC
  text: וַ/יִּֽחַר אַ֤ף יְהוָה֙ בְּ/יִשְׂרָאֵ֔ל וַֽ/יִּתְּנֵ/ם֙ בְּ/יַד שֹׁסִ֔ים וַ/יָּשֹׁ֖סּוּ אוֹתָ֑/ם וַֽ/יִּמְכְּרֵ֞/ם בְּ/יַ֤ד אֽוֹיְבֵי/הֶם֙ מִ/סָּבִ֔יב וְ/לֹֽא יָכְל֣וּ ע֔וֹד לַ/עֲמֹ֖ד לִ/פְנֵ֥י אוֹיְבֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/014.yaml
  text: Then the anger of Yahweh burned against Israel[a], and he gave them into the hand of plunderers, who plundered them. He sold them into the hand of their enemies all around[c][b], so that they could no longer stand before their enemies.
translation:
  language: hi
  text: तब इस्राएल पर यहोवा का क्रोध भड़क उठा[a]। उसने उन्हें लूटने वालों के हाथ में कर दिया, और उन्होंने उन्हें लूटा। उसने उन्हें उनके चारों ओर के शत्रुओं के हाथ में बेच दिया[b], इसलिए वे फिर अपने शत्रुओं के सामने टिक न सके।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “इस्राएल के विरुद्ध यहोवा का नथुना जल उठा”; यह तीव्र क्रोध का हिब्रू मुहावरा है।
    reason: cultural_note
  - marker: b
    text: “हाथ में” यहाँ किसी के अधिकार या वश में होने को दर्शाता है।
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּחַר אַף
  choice: क्रोध भड़क उठा
  rationale: यह हिब्रू मुहावरे में क्रोध के जलने की सजीव छवि को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ के व्यक्तिगत ईश्वरीय नाम को हिन्दी में प्रचलित लिप्यंतरण द्वारा प्रस्तुत किया गया है, किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: וַיִּתְּנֵם בְּיַד
  choice: उन्हें ... के हाथ में कर दिया
  rationale: यह किसी दूसरे की सत्ता में सौंपे जाने के हिब्रू मुहावरे को हिन्दी में स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: שֹׁסִים / וַיָּשֹׁסּוּ
  choice: लूटनेवालों ... लूटा
  rationale: संज्ञा और उसी धातु से बने क्रिया-रूप के शब्द-संबंध को हिन्दी में भी सुरक्षित रखा गया है।
- source_word: וַיִּמְכְּרֵם
  choice: उन्हें ... बेच दिया
  rationale: शाब्दिक और कठोर 'बेचना' रूपक को बनाए रखा गया है; इसे सामान्य 'सौंप दिया' कहकर नरम नहीं किया गया।
- source_word: אֹיְבֵיהֶם מִסָּבִיב
  choice: चारों ओर के शत्रुओं
  rationale: यह आसपास या हर ओर उपस्थित शत्रुओं का अर्थ सहज हिन्दी में देता है।
- source_word: וְלֹא יָכְלוּ עוֹד לַעֲמֹד לִפְנֵי
  choice: फिर ... के सामने टिक न सके
  rationale: युद्ध में विरोधी के सामने ठहर या डटे न रह सकने का आशय आधुनिक हिन्दी में स्पष्ट करता है।
theological_decisions:
- issue: ईश्वरीय क्रोध के लिए मानव-सदृश रूपक
  choice: यहोवा का क्रोध भड़क उठा
  alternative: यहोवा इस्राएल पर क्रोधित हुआ
  rationale: मूल का सजीव 'क्रोध जलना' रूपक सुरक्षित रखा गया है और उसके बारे में कोई अतिरिक्त धर्मवैज्ञानिक व्याख्या नहीं जोड़ी गई।
- issue: וַיִּמְכְּרֵם में बेचने की न्याय-संबंधी छवि
  choice: उसने उन्हें ... बेच दिया
  alternative: उसने उन्हें ... के वश में कर दिया
  rationale: मूल क्रिया की ठोस और तनावपूर्ण छवि को बनाए रखा गया है, बिना यह निर्धारित किए कि रूपक के सभी आर्थिक पहलुओं को शाब्दिक माना जाए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। 'यहोवा', 'क्रोध भड़क उठा', 'हाथ में कर दिया' और 'बेच दिया' मूल की प्रमुख छवियों को सुरक्षित रखते हैं; 'टिक न सके' युद्ध-संदर्भ में स्वाभाविक हिन्दी है।
