reference: Judges 2:21
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: גַּם אֲנִי֙ לֹ֣א אוֹסִ֔יף לְ/הוֹרִ֥ישׁ אִ֖ישׁ מִ/פְּנֵי/הֶ֑ם מִן הַ/גּוֹיִ֛ם אֲשֶׁר עָזַ֥ב יְהוֹשֻׁ֖עַ וַ/יָּמֹֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/021.yaml
  text: I also will no longer continue to drive out before them any of the nations that Joshua left when he died[a].
translation:
  language: hi
  text: मैं भी अब आगे उन जातियों में से एक को भी उनके सामने से नहीं निकालूँगा, जिन्हें यहोशू छोड़ गया था जब वह मरा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं भी अब आगे उन जातियों में से एक को भी उनके सामने से नहीं निकालूँगा, जिन्हें यहोशू छोड़ गया था, और वह मर गया।” इब्रानी में शाब्दिक रूप से “और वह मर गया” है; मुख्य पाठ में इसे सहज हिन्दी के लिए कालगत अर्थ में व्यक्त किया गया है।
    reason: मूल इब्रानी के शाब्दिक समन्वय और मुख्य पाठ में अपनाए गए कालगत अर्थ—दोनों को सुरक्षित रखना।
lexical_decisions:
- source_word: גַּם אֲנִי
  choice: मैं भी
  rationale: גַּם के साथ स्वतंत्र सर्वनाम אֲנִי वक्ता पर बल देता है और पिछले कथन से निरंतरता जोड़ता है; ‘मैं भी’ आधुनिक हिन्दी में स्वाभाविक रूप से दोनों भाव रखता है।
- source_word: לֹא אוֹסִיף
  choice: अब ... नहीं ...ँगा
  rationale: निषेध के साथ יסף और अनन्त क्रिया किसी कार्य को आगे जारी न रखने का अर्थ देते हैं। हिन्दी में ‘अब ... नहीं’ इस समाप्ति को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: לְהוֹרִישׁ
  choice: निकालूँगा
  rationale: विजय और देश-अधिकार के प्रसंग में הורישׁ पहले से बसे लोगों को वहाँ से हटाने या निकालने को सूचित करता है। ‘उनके सामने से निकालना’ मूल बिंब को बनाए रखता है।
- source_word: אִישׁ מִן הַגּוֹיִם
  choice: उन जातियों में से एक को भी
  rationale: אִישׁ यहाँ व्यक्तिवाचक ‘पुरुष’ नहीं, बल्कि अंशवाचक और बलसूचक अर्थ में ‘एक भी’ है; מן הַגּוֹיִם के साथ इसका अर्थ उन जातियों में से एक को भी न निकालना है।
- source_word: מִפְּנֵיהֶם
  choice: उनके सामने से
  rationale: מן के साथ פנים किसी की उपस्थिति या सामने से हटाए जाने का मुहावरा है। हिन्दी का यह रूप मूल चित्र को स्पष्ट और स्वाभाविक रखता है।
- source_word: אֲשֶׁר עָזַב יְהוֹשֻׁעַ
  choice: जिन्हें यहोशू ... छोड़ गया था
  rationale: עזב का सामान्य अर्थ ‘छोड़ना/पीछे रहने देना’ है। सम्बन्धवाचक बहुवचन ‘जिन्हें’ का संकेत निकटतम संज्ञा ‘जातियों’ की ओर है।
- source_word: וַיָּמֹת
  choice: अपनी मृत्यु के समय
  rationale: शाब्दिक रूप ‘और वह मर गया’ है। मुख्य पाठ में कालगत सम्बन्ध को सहज हिन्दी में व्यक्त किया गया है, जबकि पादटिप्पणी शाब्दिक रचना और उसकी सम्भव अलग समझ सुरक्षित रखती है।
theological_decisions:
- issue: ईश्वरीय वक्ता की पहचान
  choice: प्रथम पुरुष ‘मैं’ को बिना विस्तार के रखा गया है।
  alternative: स्पष्टता के लिए ‘यहोवा’ या ‘प्रभु’ जोड़ना।
  rationale: इस पद के इब्रानी पाठ में वक्ता केवल प्रथम पुरुष में बोलता है; उसकी पहचान प्रसंग से स्पष्ट है। इसलिए ईश्वरीय नाम जोड़ना स्रोत में अनुपस्थित शब्द आयात करता।
- issue: וַיָּמֹת का यहोशू द्वारा छोड़ी गई जातियों से सम्बन्ध
  choice: मुख्य पाठ में इसे कालगत रूप से ‘अपनी मृत्यु के समय’ कहा गया है।
  alternative: ‘जिन्हें यहोशू छोड़ गया और मर गया’ के रूप में क्रमशः दो घटनाएँ रखना।
  rationale: इब्रानी व्याकरण शाब्दिक समन्वय को रहने देता है, पर प्रसंग में यहोशू की मृत्यु शेष छोड़ी गई जातियों की समय-सीमा बताती है। हिन्दी में सहज कालगत रूप मुख्य पाठ में है और शाब्दिक सम्भावना पादटिप्पणी में संरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल शैली अपनाई गई है। ‘जातियाँ’ न्यायियों के भू-राजनीतिक प्रसंग में גּוֹיִם के लिए परिचित और स्पष्ट है। ‘अब ... नहीं निकालूँगा’ अनावश्यक दोहराव से बचते हुए जारी कार्य के रुकने का भाव देता है।
