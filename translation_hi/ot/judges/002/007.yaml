source:
  edition: WLC
  text: וַ/יַּעַבְד֤וּ הָ/עָם֙ אֶת יְהוָ֔ה כֹּ֖ל יְמֵ֣י יְהוֹשֻׁ֑עַ וְ/כֹ֣ל יְמֵ֣י הַ/זְּקֵנִ֗ים אֲשֶׁ֨ר הֶאֱרִ֤יכוּ יָמִים֙ אַחֲרֵ֣י יְהוֹשׁ֔וּעַ אֲשֶׁ֣ר רָא֗וּ אֵ֣ת כָּל מַעֲשֵׂ֤ה יְהוָה֙ הַ/גָּד֔וֹל אֲשֶׁ֥ר עָשָׂ֖ה לְ/יִשְׂרָאֵֽל־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/007.yaml
  text: And the people served Yahweh all the days of Joshua[a], and all the days of the elders who lived on after Joshua, who had seen all the great work of Yahweh that he had done for Israel.
translation:
  language: hi
  text: लोग याहवे की सेवा यहोशू के जीवन भर और उन बुज़ुर्गों के जीवन भर करते रहे, जो यहोशू के बाद जीवित रहे और जिन्होंने याहवे के उस पूरे महान कार्य[a] को देखा था, जो उसने इस्राएल के लिए किया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘महान कार्य’ का अनुवाद ‘महान काम’ या ‘महान कृत्य’ भी किया जा सकता है।
    reason: मַעֲשֵׂה के स्वाभाविक हिन्दी विकल्पों और उसके सामूहिक एकवचन अर्थ को दर्शाने के लिए।
lexical_decisions:
- source_word: וַיַּעַבְדוּ
  choice: सेवा करते रहे
  rationale: עבד यहाँ याहवे के प्रति वाचा की निष्ठा और सेवा को व्यक्त करता है; इसमें उपासना सम्मिलित है, पर अर्थ केवल धार्मिक अनुष्ठान तक सीमित नहीं है।
- source_word: הָעָם
  choice: लोग
  rationale: यहाँ עם सामूहिक रूप से इस्राएली समुदाय को दर्शाता है; आधुनिक हिन्दी में ‘लोग’ स्वाभाविक है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय परमेश्वर-नाम को किसी उपाधि से बदलने के बजाय उसके नाम के हिन्दी लिप्यंतरण से प्रस्तुत किया गया है।
- source_word: כֹּל יְמֵי
  choice: के जीवन भर
  rationale: यह मुहावरा किसी व्यक्ति के जीवन अथवा उसके बने रहने की पूरी अवधि बताता है; ‘जीवन भर’ हिन्दी में उसका सहज समतुल्य है।
- source_word: הַזְּקֵנִים
  choice: पुरनियों
  rationale: यह पद केवल वृद्ध पुरुषों के लिए नहीं, बल्कि समुदाय के मान्य वरिष्ठ अगुओं के लिए प्रयुक्त है; ‘पुरनिये’ हिन्दी बाइबलीय संदर्भ में इस सामाजिक भूमिका को संक्षेप में बनाए रखता है।
- source_word: הֶאֱרִיכוּ יָמִים אַחֲרֵי
  choice: के बाद जीवित रहे
  rationale: शाब्दिक मुहावरा ‘के बाद अपने दिन लम्बे किए’ है; आशय यहोशू की मृत्यु के बाद भी जीवित रहने से है।
- source_word: רָאוּ
  choice: देखा था
  rationale: इन पुरनियों का पहले घटे कार्यों का प्रत्यक्ष अनुभव उनकी बाद की सेवा की पृष्ठभूमि है; हिन्दी का पूर्ण भूतकाल यह संबंध स्पष्ट करता है।
- source_word: כָּל מַעֲשֵׂה יְהוָה הַגָּדוֹל
  choice: याहवे का वह समूचा महान कार्य
  rationale: मַעֲשֵׂה एकवचन में सामूहिक अर्थ रखता है। ‘समूचा महान कार्य’ उस एकवचन और उसके व्यापक आशय दोनों को सुरक्षित रखता है।
- source_word: עָשָׂה לְיִשְׂרָאֵל
  choice: उसने इस्राएल के लिए किया था
  rationale: לְ यहाँ हितार्थक है और बताता है कि याहवे ने यह कार्य इस्राएल की भलाई के लिए किया।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम का प्रयोग करता है। ‘याहवे’ उस नाम का लिप्यंतरण है और उसे उपाधि ‘प्रभु’ से नहीं बदलता; ‘यहोवा’ परंपरागत रूप है, पर मूल उच्चारण को कम निकटता से दर्शाता है।
- issue: עבד का धार्मिक आशय
  choice: सेवा करते रहे
  alternative: उपासना करते रहे
  rationale: क्रिया में उपासना अवश्य समाहित हो सकती है, लेकिन यहाँ उसका आशय वाचा की व्यापक निष्ठा और आज्ञाकारिता भी है; इसलिए केवल ‘उपासना’ कहना अर्थ को संकुचित कर सकता है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। वाक्य की मूल कालगत संरचना सुरक्षित है, पर हिन्दी प्रवाह के लिए मुख्य क्रिया ‘सेवा करते रहे’ अंत में रखी गई है। ‘पुरनियों’ शब्द समुदाय के मान्य वरिष्ठ अगुओं का संकेत देता है।
