  naturalness: “अपनी आवाज़ें उठाईं और रोए” is clear, natural modern Hindi in a dignified narrative register while retaining the two actions.
  terminology: “याहवे” consistently represents the POB’s chosen rendering “Yahweh.” “दूत” appropriately preserves the lexical breadth of מַלְאָךְ; the footnote supplies “स्वर्गदूत” as an alternative. The literal masculine phrase and its idiomatic alternative remain properly anchored.
