source:
  edition: WLC
  text: וַ/יְהִ֗י כְּ/דַבֵּ֞ר מַלְאַ֤ךְ יְהוָה֙ אֶת הַ/דְּבָרִ֣ים הָ/אֵ֔לֶּה אֶֽל כָּל בְּנֵ֖י יִשְׂרָאֵ֑ל וַ/יִּשְׂא֥וּ הָ/עָ֛ם אֶת קוֹלָ֖/ם וַ/יִּבְכּֽוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/004.yaml
  text: And when the angel of Yahweh spoke these words to all the sons of Israel[b][a], the people raised their voices and wept.
translation:
  language: hi
  text: जब याहवे के दूत[a] ने इस्राएल के सभी पुत्रों[b] से ये बातें कहीं, तब लोगों ने अपनी आवाज़ें उठाईं और रोए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “याहवे के स्वर्गदूत।”
    reason: lexical_alternative
  - marker: b
    text: या, “सभी इस्राएलियों”; शाब्दिक रूप से, “इस्राएल के सभी पुत्रों।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּדַבֵּר
  choice: जब ... ने ... कहीं, तब
  rationale: यह रचना मुख्य घटना की समय-परिस्थिति बताती है। आधुनिक हिन्दी में ‘जब... तब...’ स्वाभाविक रूप से कथात्मक क्रम व्यक्त करता है, बिना ‘और ऐसा हुआ’ जैसी कृत्रिम शब्दशः अभिव्यक्ति के।
- source_word: מַלְאַךְ יְהוָה
  choice: यहोवा के दूत
  rationale: מַלְאַךְ का अर्थ ‘दूत’ या सन्दर्भानुसार ‘स्वर्गदूत’ हो सकता है। ‘दूत’ मूल शब्द की व्यापकता और इस पद में उपस्थित वास्तविक अर्थगत अस्पष्टता को बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चार अक्षरों वाले परमेश्वर के निज नाम को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है, किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: ये बातें
  rationale: דְּבָרִים यहाँ अभी कहे गए कथनों को सूचित करता है। हिन्दी में ‘ये बातें कहीं’ स्वाभाविक है और वाणी के सन्दर्भ को स्पष्ट रखता है।
- source_word: אֶל כָּל בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के सभी पुत्रों से
  rationale: यह मूल पदबंध की ‘इस्राएल के पुत्र’ संरचना और उसके पुरुषवाची रूप को सुरक्षित रखता है; अधिक मुहावरेदार ‘सभी इस्राएलियों से’ पादटिप्पणी में दिया गया है।
- source_word: וַיִּשְׂאוּ הָעָם אֶת קוֹלָם וַיִּבְכּוּ
  choice: लोगों ने ऊँचे स्वर से विलाप किया
  rationale: शाब्दिक मुहावरा ‘अपना स्वर उठाया और रोए’ हिन्दी में असहज है। ‘ऊँचे स्वर से विलाप किया’ आवाज़ उठाकर रोने की संयुक्त क्रिया को स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में निज नाम सीधे आया है। हिन्दी पाठकों के लिए स्थापित रूप ‘यहोवा’ नाम को उपाधि ‘प्रभु’ से बदले बिना सुरक्षित रखता है।
- issue: מַלְאַךְ יְהוָה की पहचान
  choice: यहोवा के दूत
  alternative: यहोवा के स्वर्गदूत
  rationale: ‘दूत’ मूल शब्द की अर्थ-सीमा को खुला रखता है और इस पात्र की प्रकृति या पहचान को इस पद की सूचना से आगे जाकर निश्चित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण कथात्मक शैली। ‘जब... तब...’ से कालगत सम्बन्ध स्वाभाविक बनाया गया है। ‘विलाप किया’ ऊँचे स्वर से रोने के अर्थ को संक्षिप्त रूप में व्यक्त करता है; पादटिप्पणियाँ मूल की प्रमुख शब्दगत सम्भावनाएँ सुरक्षित रखती हैं।
