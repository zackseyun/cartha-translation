source:
  edition: WLC
  text: וַ/יַּ֧עַל מַלְאַךְ יְהוָ֛ה מִן הַ/גִּלְגָּ֖ל אֶל הַ/בֹּכִ֑ים וַ/יֹּאמֶר֩ אַעֲלֶ֨ה אֶתְ/כֶ֜ם מִ/מִּצְרַ֗יִם וָ/אָבִ֤יא אֶתְ/כֶם֙ אֶל הָ/אָ֗רֶץ אֲשֶׁ֤ר נִשְׁבַּ֨עְתִּי֙ לַ/אֲבֹ֣תֵי/כֶ֔ם וָ/אֹמַ֕ר לֹֽא אָפֵ֧ר בְּרִיתִ֛/י אִתְּ/כֶ֖ם לְ/עוֹלָֽם־־־פ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/001.yaml
  text: Then the angel of Yahweh went up from Gilgal to Bochim and said[a], “I brought you up from Egypt and brought you into the land that I swore to your fathers, and I said[b], ‘I will never break my covenant with you.’”
translation:
  language: hi
  text: तब यहोवा का दूत[b] गिलगाल से बोकीम[a] तक चढ़ गया और उसने कहा, “मैं तुम्हें मिस्र से निकालकर उस देश में ले आया, जिसे देने की मैंने तुम्हारे पूर्वजों से शपथ खाई थी। मैंने कहा था, ‘मैं तुम्हारे साथ अपनी वाचा कभी नहीं तोड़ूँगा।’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘बोकीम’ नाम का सम्बन्ध सम्भवतः ‘रोने वालों’ या ‘रोने के स्थान’ से है।
    reason: स्थान-नाम के अर्थ और कथानक में उसके शब्द-संबंध को स्पष्ट करना।
  - marker: b
    text: ‘दूत’ का अनुवाद ‘स्वर्गदूत’ भी किया जा सकता है। इस पद में वह स्वयं यहोवा के कार्यों को प्रथम पुरुष में कहता है।
    reason: मूल शब्द की शाब्दिक सम्भावना और वक्ता की पहचान से जुड़ी वास्तविक अस्पष्टता सुरक्षित रखना।
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: यहोवा का दूत
  rationale: מַלְאַךְ का अर्थ ‘दूत’ या ‘स्वर्गदूत’ हो सकता है। ‘दूत’ इस अस्पष्टता को कुछ हद तक बनाए रखता है और प्रथम पुरुष में परमेश्वर के वचन बोलने वाले पात्र की पहचान को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत नाम יהוה को प्रचलित हिन्दी रूप ‘यहोवा’ से व्यक्त किया गया है, न कि उपाधि ‘प्रभु’ से।
- source_word: וַיַּעַל
  choice: गया
  rationale: עלה में ऊपर जाने का भाव है, पर हिन्दी में इन स्थानों के बीच यात्रा के लिए केवल ‘ऊपर गया’ अस्वाभाविक और भ्रामक हो सकता है; सहज कथन ‘गया’ दिशा को बिना अनावश्यक स्थलाकृतिक दावे के व्यक्त करता है।
- source_word: הַבֹּכִים
  choice: बोकीम
  rationale: स्थान-नाम को लिप्यंतरित किया गया है; उससे जुड़े ‘रोने वालों’ या ‘रोने का स्थान’ के अर्थ को पादटिप्पणी में रखा गया है।
- source_word: אַעֲלֶה אֶתְכֶם מִמִּצְרַיִם
  choice: मैं तुम्हें मिस्र से निकालकर
  rationale: रूप अपूर्ण काल जैसा दिख सकता है, किंतु प्रसंग में बीते उद्धार-कार्य का वर्णन है। हिन्दी में ‘मिस्र से निकालकर’ स्वाभाविक रूप से निर्गमन का अर्थ देता है।
- source_word: וָאָבִיא אֶתְכֶם אֶל הָאָרֶץ
  choice: उस देश में ले आया
  rationale: हिफ़ील क्रिया का प्रवेश कराने या ले आने का भाव स्पष्ट और सहज हिन्दी में रखा गया है।
- source_word: נִשְׁבַּעְתִּי לַאֲבֹתֵיכֶם
  choice: मैंने तुम्हारे पूर्वजों से शपथ खाई थी
  rationale: אָבוֹת का शाब्दिक अर्थ ‘पिता’ है, पर बहुवचन में यहाँ वाचा से जुड़े पितृपुरुषों/पूर्वजों का संकेत है; ‘पूर्वजों’ से आधुनिक पाठक को आशय स्पष्ट होता है।
- source_word: בְּרִיתִי אִתְּכֶם
  choice: तुम्हारे साथ बाँधी अपनी वाचा
  rationale: ‘वाचा’ बाइबिलीय covenant का स्थापित हिन्दी पद है; ‘साथ बाँधी’ सम्बन्ध की प्रकृति को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: לֹא אָפֵר ... לְעוֹלָם
  choice: कभी नहीं तोड़ूँगा
  rationale: הפר का वाचा के प्रसंग में अर्थ तोड़ना या रद्द करना है; नकार के साथ לְעוֹלָם का सहज हिन्दी समतुल्य ‘कभी नहीं’ है।
theological_decisions:
- issue: מַלְאַךְ יְהוָה की पहचान
  choice: ‘यहोवा का दूत’ रखा गया और वक्ता को प्रथम पुरुष में यहोवा के कार्य कहते रहने दिया गया।
  alternative: ‘यहोवा का स्वर्गदूत’, अथवा इसे प्रत्यक्ष ईश-प्रकटन के रूप में स्पष्ट करना।
  rationale: मूल पाठ दूत और स्वयं यहोवा की वाणी के बीच तनाव उत्पन्न करता है, पर उसकी पहचान निर्णायक रूप से नहीं समझाता। अनुवाद उस तनाव को सुरक्षित रखता है।
- issue: परमेश्वर के नाम יהוה का रूप
  choice: यहोवा
  alternative: प्रभु
  rationale: व्यक्तिगत नाम को उपाधि से बदलने के बजाय हिन्दी में व्यापक रूप से पहचाने जाने वाले लिप्यंतरण द्वारा प्रस्तुत किया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल रखी गई है। ‘वाचा’ जैसे आवश्यक बाइबिलीय पद को बनाए रखते हुए वाक्य-विन्यास सहज हिन्दी में रखा गया है। सभी पादटिप्पणी चिह्न मुख्य पाठ में उपस्थित हैं।
