id: JDG.2.2
reference: Judges 2:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/אַתֶּ֗ם לֹֽא תִכְרְת֤וּ בְרִית֙ לְ/יֽוֹשְׁבֵי֙ הָ/אָ֣רֶץ הַ/זֹּ֔את מִזְבְּחוֹתֵי/הֶ֖ם תִּתֹּצ֑וּ/ן וְ/לֹֽא שְׁמַעְתֶּ֥ם בְּ/קֹלִ֖/י מַה זֹּ֥את עֲשִׂיתֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/002.yaml
  text: And you were not to make a covenant with the inhabitants of this land; you were to tear down their altars[a]. But you have not listened to my voice. What is this you have done?
translation:
  language: hi
  text: और तुम्हें इस देश के निवासियों के साथ वाचा नहीं बाँधनी थी[a]; तुम्हें उनकी वेदियाँ ढा देनी थीं। पर तुमने मेरी बात नहीं मानी। यह तुमने क्या किया?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “वाचा काटना।”
    reason: lexical_alternative
lexical_decisions:
- source_word: תִכְרְתוּ בְרִית
  choice: वाचा बाँधनी
  rationale: इब्रानी मुहावरे में शाब्दिक क्रिया ‘काटना’ है, पर आधुनिक हिन्दी में ‘वाचा बाँधना’ स्वाभाविक है और בְּרִית की वाचागत शक्ति को बनाए रखता है; ‘संधि करना’ अर्थ को केवल राजनीतिक समझौते तक सीमित कर सकता है।
- source_word: לְיֹשְׁבֵי הָאָרֶץ הַזֹּאת
  choice: इस देश के निवासियों के साथ
  rationale: יֹשְׁבֵי का अर्थ वहाँ रहने वाले लोग है; ‘निवासी’ संक्षिप्त और सहज है, और ‘इस देश’ संकेतवाचक הַזֹּאת को सुरक्षित रखता है।
- source_word: מִזְבְּחוֹתֵיהֶם תִּתֹּצוּן
  choice: तुम्हें उनकी वेदियाँ ढा देनी थीं
  rationale: נתץ वेदियों या संरचनाओं को गिराने अथवा ढा देने के लिए प्रयुक्त होता है। ‘ढा देना’ आधुनिक हिन्दी में स्पष्ट और सजीव है। भूतकालीन दायित्व पूर्व में दी गई आज्ञा के स्मरण और वर्तमान फटकार के प्रसंग को व्यक्त करता है।
- source_word: וְלֹא שְׁמַעְתֶּם בְּקֹלִי
  choice: पर तुमने मेरी बात नहीं मानी
  rationale: שמע בְּקוֹל में सुनने के साथ आज्ञापालन का भाव है। ‘मेरी बात नहीं मानी’ हिन्दी में स्वाभाविक रूप से उसी आशय को व्यक्त करता है; ‘पर’ विरोधात्मक संबंध को स्पष्ट करता है।
- source_word: מַה זֹּאת עֲשִׂיתֶם
  choice: यह तुमने क्या किया?
  rationale: यह शब्दक्रम इब्रानी की विस्मय और फटकार को स्वाभाविक हिन्दी में बनाए रखता है और प्रश्न को ‘तुमने ऐसा क्यों किया?’ बनाकर उद्देश्य संबंधी अर्थ नहीं जोड़ता।
- source_word: וְאַתֶּם לֹא ... תִּכְרְתוּ ... תִּתֹּצוּן
  choice: तुम्हें ... नहीं बाँधनी थी; तुम्हें ... ढा देनी थीं
  rationale: ये अपूर्ण क्रियाएँ पहले दी गई आज्ञाओं को स्मरण कराती हैं और उनके बाद इस्राएल की विफलता पूर्ण क्रिया में आती है। हिन्दी में ‘नहीं ... थी’ और ‘... देनी थीं’ पूर्व दायित्व को स्वाभाविक ढंग से व्यक्त करते हैं।
theological_decisions:
- issue: देश के निवासियों के साथ निषिद्ध संबंध के लिए वाचागत शब्दावली
  choice: वाचा बाँधनी
  alternative: संधि करनी
  rationale: ‘वाचा’ बाइबिल के व्यापक वाचागत आशय को बनाए रखती है और संबंध को केवल राजनीतिक समझौते तक सीमित नहीं करती।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘वाचा’ और ‘वेदी’ जैसे प्रचलित बाइबिलीय शब्द बनाए गए हैं, जबकि वाक्य-रचना साधारण पाठक के लिए सहज रखी गई है।
