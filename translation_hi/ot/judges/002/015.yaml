source:
  edition: WLC
  text: בְּ/כֹ֣ל אֲשֶׁ֣ר יָצְא֗וּ יַד יְהוָה֙ הָיְתָה בָּ֣/ם לְ/רָעָ֔ה כַּֽ/אֲשֶׁר֙ דִּבֶּ֣ר יְהוָ֔ה וְ/כַ/אֲשֶׁ֛ר נִשְׁבַּ֥ע יְהוָ֖ה לָ/הֶ֑ם וַ/יֵּ֥צֶר לָ/הֶ֖ם מְאֹֽד׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/015.yaml
  text: Wherever they went out[a], the hand of Yahweh was against them for harm, just as Yahweh had spoken and just as Yahweh had sworn to them[b], and they were greatly distressed.
translation:
  language: hi
  text: वे जहाँ कहीं भी निकलते थे,[a] वहाँ यहोवा का हाथ उनके विरुद्ध उनकी हानि के लिए था, ठीक जैसा यहोवा ने कहा था और जैसा यहोवा ने उनसे शपथपूर्वक कहा था; और वे बहुत संकट में पड़ गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जब-जब वे निकलते थे”; यहाँ युद्ध या अभियान के लिए निकलने का भाव भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּכֹל אֲשֶׁר יָצְאוּ
  choice: वे जहाँ कहीं निकलते थे
  rationale: यह अभिव्यक्ति उनके सभी बाहर निकलने या अभियानों को समेटती है। संदर्भ में युद्ध सम्भव है, पर मूल पाठ उसे स्पष्ट रूप से सीमित नहीं करता।
- source_word: יַד יְהוָה
  choice: यहोवा का हाथ
  rationale: सक्रिय सामर्थ्य और हस्तक्षेप के इब्रानी रूपक को बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: ईश्वर के व्यक्तिगत नाम चतुरक्षर का प्रचलित हिन्दी लिप्यंतरण है, न कि उसके स्थान पर कोई उपाधि।
- source_word: הָיְתָה בָם לְרָעָה
  choice: उनकी हानि के लिए उनके विरुद्ध रहता था
  rationale: वाक्यांश यहोवा की प्रतिकूल कार्रवाई और उससे हुई विपत्ति व्यक्त करता है। 'हानि' नैतिक बुराई का अनावश्यक अर्थ जोड़े बिना רָעָה का प्रतिकूल भाव रखता है।
- source_word: כַּאֲשֶׁר דִּבֶּר יְהוָה
  choice: ठीक जैसा यहोवा ने कहा था
  rationale: पहले दी गई ईश्वरीय चेतावनी की ओर संकेत करने वाले पूर्ण क्रिया-रूप को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְכַאֲשֶׁר נִשְׁבַּע יְהוָה לָהֶם
  choice: और जैसा यहोवा ने उनसे शपथ खाई थी
  rationale: נשבע + ל को शपथ के संबोधन के रूप में रखता है; हिन्दी में 'उनसे शपथ खाई' स्वाभाविक है।
- source_word: וַיֵּצֶר לָהֶם מְאֹד
  choice: और वे बहुत संकट में पड़ गए
  rationale: इस मुहावरे में इस्राएल के तीव्र संकट का परिणाम व्यक्त होता है; 'बहुत' מְאֹד की तीव्रता बनाए रखता है।
theological_decisions:
- issue: वाचा के न्याय में ईश्वरीय विरोध का निरूपण
  choice: यहोवा का हाथ उनकी हानि के लिए उनके विरुद्ध रहता था
  alternative: यहोवा का हाथ उनके विरुद्ध विपत्ति लाता था
  rationale: यह अनुवाद न्याय में यहोवा की सक्रिय भूमिका को बनाए रखता है, पर רָעָה को नैतिक बुराई बताने का अतिरिक्त निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सहज किंतु गरिमापूर्ण है। 'यहोवा का हाथ' जैसे मूल रूपक को सुरक्षित रखा गया है और सम्भावित सैन्य अर्थ को मुख्य पाठ में अनावश्यक रूप से निश्चित न करके पादटिप्पणी में दिया गया है।
