  text: וַ/יִּֽחַר אַ֥ף יְהוָ֖ה בְּ/יִשְׂרָאֵ֑ל וַ/יֹּ֗אמֶר יַעַן֩ אֲשֶׁ֨ר עָבְר֜וּ הַ/גּ֣וֹי הַ/זֶּ֗ה אֶת בְּרִיתִ/י֙ אֲשֶׁ֣ר צִוִּ֣יתִי אֶת אֲבוֹתָ֔/ם וְ/לֹ֥א שָׁמְע֖וּ לְ/קוֹלִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/020.yaml
  text: So the anger of Yahweh burned against Israel[a], and he said, “Because this nation has transgressed my covenant that I commanded their fathers[b], and they have not listened to my voice,”
translation:
  language: hi
  text: तब इस्राएल पर याहवे का क्रोध भड़क उठा, और उसने कहा, “क्योंकि इस राष्ट्र ने मेरी उस वाचा का उल्लंघन किया है[a], जिसका पालन करने की आज्ञा मैंने उनके पूर्वजों को दी थी, और उन्होंने मेरी बात नहीं सुनी है[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मेरी वाचा तोड़ी है।” इब्रानी क्रिया का शाब्दिक अर्थ “पार करना” है और वाचा के संदर्भ में यह उसका अतिक्रमण या उल्लंघन करने का भाव रखती है।
    reason: lexical_alternative
  - marker: b
    text: या “उन्होंने मेरी आज्ञा नहीं मानी है।” इब्रानी मुहावरा “मेरी आवाज़ सुनना” प्रायः आज्ञापालन का भाव भी रखता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר אַף
  choice: क्रोध भड़क उठा
  rationale: यह इब्रानी मुहावरे में निहित आग या ताप के रूपक को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: व्यक्तिगत ईश्वरीय नाम को हिन्दी में प्रचलित लिप्यंतरण द्वारा प्रस्तुत किया गया है, किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: בְּיִשְׂרָאֵל
  choice: इस्राएल पर
  rationale: क्रोधसूचक क्रिया के साथ यह पूर्वसर्ग क्रोध के लक्ष्य को बताता है; हिन्दी में ‘पर’ स्वाभाविक है।
- source_word: יַעַן אֲשֶׁר
  choice: क्योंकि
  rationale: यह ईश्वरीय घोषणा का कारण प्रस्तुत करने वाला संक्षिप्त और सहज संयोजक है।
- source_word: עָבְרוּ
  choice: उल्लंघन किया है
  rationale: वाचा के संदर्भ में क्रिया का अर्थ सीमा लाँघकर वाचा का अतिक्रमण या उल्लंघन करना है; ‘उल्लंघन’ नैतिक-वाचागत भाव को सुरक्षित रखता है।
- source_word: הַגּוֹי הַזֶּה
  choice: इस जाति
  rationale: גוי के चिह्नित अर्थ ‘nation’ को ‘लोगों’ कहकर सामान्य बनाने के बजाय ‘जाति’ से व्यक्त किया गया है।
- source_word: בְּרִיתִי
  choice: मेरी ... वाचा
  rationale: ברית के लिए ‘वाचा’ परमेश्वर और इस्राएल के बंधन का मानक एवं सटीक हिन्दी पद है।
- source_word: צִוִּיתִי אֶת אֲבוֹתָם
  choice: जिसकी आज्ञा मैंने उनके पूर्वजों को दी थी
  rationale: संक्षिप्त इब्रानी रचना का आशय है कि यह वही वाचा थी जिसे परमेश्वर ने उनके पूर्वजों को मानने की आज्ञा दी थी; हिन्दी में यह रूप स्पष्ट और स्वाभाविक है।
- source_word: שָׁמְעוּ לְקוֹלִי
  choice: उन्होंने मेरी बात नहीं सुनी है
  rationale: यह सुनने के मूल बिंब को बनाए रखता है, जबकि संदर्भ में आज्ञापालन न करने का भाव भी निहित रहता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में चतुरक्षरीय व्यक्तिगत नाम सीधे आया है। हिन्दी पाठकों के लिए परिचित ‘यहोवा’ नाम को उपाधि ‘प्रभु’ से बदलने के बजाय रखा गया है।
- issue: वाचागत और न्यायिक भाषा को बनाए रखना
  choice: मेरी ... वाचा का उल्लंघन किया है ... मेरी बात नहीं सुनी है
  alternative: मेरी वाचा तोड़ी है ... मेरी आज्ञा नहीं मानी है
  rationale: चुना हुआ रूप वाचा के उल्लंघन और वाणी सुनने के मूल बिंबों को सुरक्षित रखता है तथा आज्ञाभंग के अर्थ को पूरी तरह परिभाषित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘क्रोध भड़क उठा’ मूल रूपक को, ‘जाति’ मूल के चिह्नित शब्द-चयन को, और ‘मेरी बात नहीं सुनी’ सुनने तथा मानने के बीच की अर्थगत व्यापकता को बनाए रखते हैं। पद अगले कथन की ओर बढ़ता है, इसलिए अंत में अल्पविराम रखा गया है।
