id: JDG.2.5
reference: Judges 2:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַֽ/יִּקְרְא֛וּ שֵֽׁם הַ/מָּק֥וֹם הַ/ה֖וּא בֹּכִ֑ים וַ/יִּזְבְּחוּ שָׁ֖ם לַֽ/יהוָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/005.yaml
  text: So they called the name of that place Bochim[a], and they sacrificed there to Yahweh.
translation:
  language: hi
  text: तब उन्होंने उस स्थान का नाम बोकीम[a] रखा और वहाँ यहोवा को बलिदान चढ़ाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘बोकीम’ इब्रानी शब्द से संबंधित है, जिसका अर्थ ‘रोने वाले’ या ‘जो रोते हैं’ है।
    reason: स्थान-नाम में निहित इब्रानी शब्द-संबंध को स्पष्ट करना।
lexical_decisions:
- source_word: וַיִּקְרְאוּ שֵׁם
  choice: नाम ... रखा
  rationale: शाब्दिक अर्थ ‘नाम पुकारा’ है, पर आधुनिक मानक हिन्दी में किसी स्थान का नाम निर्धारित करने के लिए ‘नाम रखा’ स्वाभाविक और अर्थनिष्ठ है।
- source_word: הַמָּקוֹם הַהוּא
  choice: उस स्थान
  rationale: निश्चयवाचक संकेत הַהוּא को ‘उस’ से स्पष्ट रूप से व्यक्त किया गया है।
- source_word: בֹּכִים
  choice: बोकीम
  rationale: यहाँ यह स्थान-नाम के रूप में प्रयुक्त है, इसलिए इसका लिप्यंतरण किया गया है; इसके रोने से जुड़े अर्थ का संकेत पादटिप्पणी में दिया गया है।
- source_word: וַיִּזְבְּחוּ
  choice: बलिदान चढ़ाए
  rationale: זבח का अर्थ बलिदान करना या चढ़ाना है। ‘बलिदान चढ़ाए’ वर्तमान हिन्दी में स्वाभाविक धार्मिक अभिव्यक्ति है।
- source_word: שָׁם
  choice: वहाँ
  rationale: यह क्रियाविशेषण अभी-अभी नाम दिए गए स्थान की ओर संकेत करता है।
- source_word: לַיהוָה
  choice: यहोवा को
  rationale: ल उपसर्ग बलिदान के प्राप्तकर्ता को दर्शाता है, और परमेश्वर के व्यक्तिगत नाम יהוה को ‘यहोवा’ के रूप में लिप्यंतरित किया गया है।
theological_decisions:
- issue: परमेश्वर के नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ में वाचा का व्यक्तिगत नाम स्पष्ट रूप से उपस्थित है; उसे किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित रूप ‘यहोवा’ से प्रस्तुत किया गया है।
- issue: בֹּכִים का अनुवाद या लिप्यंतरण
  choice: बोकीम
  alternative: रोनेवाले
  rationale: यह शब्द इस पद में स्थान-नाम है। इसलिए मुख्य पाठ में नाम को लिप्यंतरित किया गया है और उसका संभावित शाब्दिक संबंध पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘नाम रखा’ और ‘बलिदान चढ़ाए’ हिन्दी के स्वाभाविक प्रयोग हैं, जबकि ‘बोकीम’ तथा ‘यहोवा’ नामों को लिप्यंतरित रूप में सुरक्षित रखते हैं।
