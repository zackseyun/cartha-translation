base_translation:
  language: en
  yaml_path: translation/ot/judges/002/016.yaml
  text: Then Yahweh raised up judges[a], and they saved them from the hand of those who plundered them.
translation:
  language: hi
  text: तब याहवे ने न्यायियों को खड़ा किया, और उन्होंने उन्हें लूटने वालों के हाथ से बचाया।[क]
  philosophy: optimal-equivalence
  footnotes:
  - marker: क
    text: या, “उन्हें छुड़ाया।”
    reason: וַיּוֹשִׁיעוּם का वैकल्पिक, प्रसंगानुकूल हिन्दी अनुवाद।
lexical_decisions:
- source_word: וַיָּקֶם
  choice: खड़ा किया
  rationale: हिफ़ील रूप यहाँ यहोवा की पहल से अगुवों को उत्पन्न और नियुक्त करने का भाव देता है। ‘खड़ा किया’ इस ऐतिहासिक और दैवी पहल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ के व्यक्तिगत ईश्वरीय नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ द्वारा रखा गया है।
- source_word: שֹׁפְטִים
  choice: न्यायियों
  rationale: यह शब्द पुस्तक की विशिष्ट पदवी है। यद्यपि इन व्यक्तियों का कार्य न्याय करने से व्यापक था, ‘न्यायी’ पदवी को सुरक्षित रखता है और अगले क्रियापद से उनका उद्धारकारी कार्य स्पष्ट होता है।
- source_word: וַיּוֹשִׁיעוּם
  choice: उन्होंने उन्हें ... बचाया
  rationale: ישׁע यहाँ संकट और शत्रु के अधिकार से छुड़ाने का अर्थ देता है। ‘बचाया’ सामान्य आधुनिक हिन्दी में स्पष्ट है और अनावश्यक रूप से धर्मशास्त्रीय अर्थ नहीं जोड़ता।
- source_word: מִיַּד
  choice: के हाथ से
  rationale: मूल इब्रानी रूपक अधिकार या नियंत्रण को दर्शाता है। ‘के हाथ से’ हिन्दी में भी स्वाभाविक और अर्थगर्भित है।
- source_word: שֹׁסֵיהֶם
  choice: उन्हें लूटनेवालों
  rationale: यह शब्द हिंसक लूट और माल छीननेवालों को सूचित करता है। ‘लूटनेवाले’ उस विशिष्ट अर्थ को ‘सतानेवाले’ जैसे व्यापक विकल्प से बेहतर बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: पद में व्यक्तिगत वाचा-नाम सीधे आया है; इसलिए उसे उपाधि ‘प्रभु’ से प्रतिस्थापित नहीं किया गया।
- issue: שֹׁפְטִים की पदवी और उद्धारकारी भूमिका
  choice: मुख्य पाठ में ‘न्यायियों’ रखकर उनके कार्य को ‘बचाया’ से व्यक्त करना
  alternative: ‘उद्धारकों’ का प्रयोग करना
  rationale: 'मूल पाठ स्वयं पदवी और कार्य दोनों रखता है: वे ‘न्यायी’ कहलाते हैं और इस्राएल को बचाते हैं। दोनों को बनाए रखने से अर्थ को किसी एक भूमिका तक सीमित नहीं किया जाता।'
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘न्यायियों’ पुस्तक की पारंपरिक प्रमुख पदवी है; ‘खड़ा किया’ दैवी पहल को व्यक्त करता है। कोई पादटिप्पणी आवश्यक नहीं मानी गई, क्योंकि ‘छुड़ाया’ का संभावित अर्थ हिन्दी के ‘बचाया’ में पर्याप्त रूप से समाहित है और अंग्रेज़ी परत की दी हुई पादटिप्पणी वास्तव में अंग्रेज़ी पर्याय थी, मूल-पाठ की अलग पाठगत अस्पष्टता नहीं।
