source:
  edition: WLC
  text: וַ/יְשַׁלַּ֥ח יְהוֹשֻׁ֖עַ אֶת הָ/עָ֑ם וַ/יֵּלְכ֧וּ בְנֵֽי יִשְׂרָאֵ֛ל אִ֥ישׁ לְ/נַחֲלָת֖/וֹ לָ/רֶ֥שֶׁת אֶת הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/006.yaml
  text: Then Joshua sent the people away[a], and the sons of Israel went, each man to his inheritance, to take possession of the land.
translation:
  language: hi
  text: तब यहोशू ने लोगों को विदा किया, और इस्राएल के पुत्र[a] देश पर अधिकार करने के लिए, हर एक अपनी विरासत में चले गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘इस्राएली।’ मूल इब्रानी में ‘इस्राएल के पुत्र।’
    reason: इब्रानी वंश-पदबंध का शाब्दिक रूप और उसका स्वाभाविक सामूहिक अर्थ दोनों बताने के लिए।
lexical_decisions:
- source_word: וַיְשַׁלַּח
  choice: विदा किया
  rationale: इस प्रसंग में שׁלח का अर्थ लोगों को जाने देना या विदा करना है; ‘विदा किया’ स्वाभाविक हिंदी में इसके कारक भाव को व्यक्त करता है।
- source_word: הָעָם
  choice: लोगों
  rationale: इब्रानी में सामान्य संज्ञा ‘लोग’ है; संदर्भ से वे इस्राएली हैं, पर मुख्य पाठ में अनावश्यक विस्तार नहीं किया गया।
- source_word: בְנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्र
  rationale: यह चयन इब्रानी पदबंध के पुरुषवाची और वंश-संबंधी रूप को बनाए रखता है; अधिक मुहावरेदार विकल्प ‘इस्राएली’ पादटिप्पणी में दिया गया है।
- source_word: אִישׁ
  choice: हर एक
  rationale: यहाँ אִישׁ का प्रयोग वितरणात्मक है—समुदाय का प्रत्येक सदस्य अपने भाग में गया। ‘हर एक’ आधुनिक हिंदी में इस बल को स्पष्ट रखता है।
- source_word: לְנַחֲלָתוֹ
  choice: अपनी विरासत में
  rationale: נחלה इस्राएल को मिले वंशानुगत भू-भाग को दर्शाता है। ‘विरासत’ उसके वाचा-संबंधी और पैतृक अर्थ को बनाए रखती है।
- source_word: לָרֶשֶׁת
  choice: अधिकार करने के लिए
  rationale: यरश का क्रियार्थ यहाँ भूमि को अपने अधिकार में लेने और उस पर बसने का है; प्रयोजनसूचक रचना भी सुरक्षित है।
- source_word: הָאָרֶץ
  choice: देश
  rationale: इस बसावट-विजय प्रसंग में ארץ से कनान का निश्चित भू-प्रदेश अभिप्रेत है; ‘देश’ आधुनिक हिंदी में इस अर्थ को स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: इस्राएल के लिए लिंगसूचक वाचा-संबंधी पदनाम
  choice: इस्राएल के पुत्र
  alternative: इस्राएली
  rationale: मुख्य पाठ इब्रानी के पुरुषवाची वंश-पदबंध को बनाए रखता है, जबकि पादटिप्पणी स्पष्ट करती है कि यह सामूहिक नाम ‘इस्राएली’ के अर्थ में भी समझा जा सकता है।
- issue: भूमि के बँटवारे की शब्दावली
  choice: विरासत
  alternative: भाग / संपत्ति
  rationale: ‘विरासत’ इस्राएल को मिली भूमि के पैतृक और वाचा-संबंधी स्वर को सुरक्षित रखती है; इसे केवल सामान्य संपत्ति तक सीमित नहीं करती।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक है। ‘विदा किया’ तथा ‘अधिकार करने के लिए’ सामान्य पाठक के लिए सहज हैं। वितरणात्मक אִישׁ को ‘हर एक’ से स्पष्ट किया गया है, और पदक्रम को हिंदी की स्वाभाविकता के अनुसार व्यवस्थित किया गया है।
