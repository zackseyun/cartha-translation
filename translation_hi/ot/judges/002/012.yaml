source:
  edition: WLC
  text: וַ/יַּעַזְב֞וּ אֶת יְהוָ֣ה אֱלֹהֵ֣י אֲבוֹתָ֗/ם הַ/מּוֹצִ֣יא אוֹתָ/ם֮ מֵ/אֶ֣רֶץ מִצְרַיִם֒ וַ/יֵּלְכ֞וּ אַחֲרֵ֣י אֱלֹהִ֣ים אֲחֵרִ֗ים מֵ/אֱלֹהֵ֤י הָֽ/עַמִּים֙ אֲשֶׁר֙ סְבִיב֣וֹתֵי/הֶ֔ם וַ/יִּֽשְׁתַּחֲו֖וּ לָ/הֶ֑ם וַ/יַּכְעִ֖סוּ אֶת יְהוָֽה־׀׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/012.yaml
  text: And they abandoned Yahweh[a], the God of their fathers, who had brought them out from the land of Egypt, and went after other gods from among the gods of the peoples who were around them, and they bowed down to them and provoked Yahweh to anger.
translation:
  language: hi
  text: उन्होंने याहवे, अपने पुरखाओं के परमेश्वर को छोड़ दिया, जो उन्हें मिस्र देश से निकाल लाया था। वे दूसरे देवताओं के पीछे चल पड़े—अपने चारों ओर रहनेवाले लोगों के देवताओं में से[a]—और उनके सामने दण्डवत किया और याहवे को क्रोध दिलाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने चारों ओर के लोगों के देवताओं के पीछे।” इब्रानी वाक्यांश को अधिक सामान्य अर्थ में, अर्थात इस्राएल के आसपास के लोगों द्वारा पूजे जानेवाले देवताओं के विषय में, भी समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַזְבוּ
  choice: छोड़ दिया
  rationale: यहाँ עזב केवल शारीरिक रूप से चले जाने को नहीं, बल्कि निष्ठा त्यागने को व्यक्त करता है। ‘छोड़ दिया’ आधुनिक हिन्दी में स्वाभाविक है और प्रसंग में इस सम्बन्धपरक अर्थ को बनाए रखता है।
- source_word: יְהוָה
  choice: यहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में निकट लिप्यन्तरण के रूप में रखा गया है।
- source_word: אֱלֹהֵי אֲבוֹתָם
  choice: अपने पुरखाओं के परमेश्वर
  rationale: यह रचना पुरुषवाचक बहुवचन ‘पितरों/पुरखाओं’ को सूचित करती है। ‘पुरखाओं’ वर्तमान हिन्दी में सहज है और वाचा-सम्बन्धी ऐतिहासिक भाव बनाए रखता है।
- source_word: הַמּוֹצִיא אוֹתָם מֵאֶרֶץ מִצְרַיִם
  choice: जो उन्हें मिस्र देश से निकाल लाया था
  rationale: सवर्णित कृदन्त यहवे की पहचान निर्गमन के कार्य से कराता है। ‘निकाल लाया था’ पूर्व में पूर्ण हुए उस कार्य और कथात्मक क्रम को स्पष्ट करता है।
- source_word: וַיֵּלְכוּ אַחֲרֵי
  choice: पीछे चल पड़े
  rationale: यह मुहावरा अनुसरण और निष्ठा ग्रहण करने का भाव देता है; हिन्दी अभिव्यक्ति मूल की गति-छवि को स्वाभाविक रूप में बनाए रखती है।
- source_word: אֱלֹהִים אֲחֵרִים
  choice: दूसरे देवताओं
  rationale: אֲחֵרִים का सीधा अर्थ ‘दूसरे’ है; ‘पराए’ या ‘विदेशी’ कहना अनावश्यक व्याख्या जोड़ता।
- source_word: מֵאֱלֹהֵי הָעַמִּים אֲשֶׁר סְבִיבוֹתֵיהֶם
  choice: अपने चारों ओर रहनेवाले लोगों के देवताओं में से
  rationale: מִן को मुख्य पाठ में अंशवाचक मानकर ‘में से’ किया गया है। वाक्यांश यह बताता है कि जिन देवताओं का उन्होंने अनुसरण किया, वे आसपास के लोगों द्वारा पूजे जानेवाले देवताओं में से थे; अधिक सामान्य सम्भावना पादटिप्पणी में सुरक्षित है।
- source_word: וַיִּשְׁתַּחֲווּ לָהֶם
  choice: उनके आगे दण्डवत किया
  rationale: क्रिया का ठोस अर्थ झुकना या भूमि तक झुककर सम्मान देना है और इस प्रसंग में आराधना निहित है। ‘दण्डवत किया’ उस दृश्य क्रिया को बनाए रखता है।
- source_word: וַיַּכְעִסוּ אֶת יְהוָה
  choice: यहवे को क्रोध दिलाया
  rationale: כעס का हिफ़ील रूप क्रोध उत्पन्न करने या उकसाने का कारणवाचक भाव रखता है; ‘क्रोध दिलाया’ इसे संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम का सीधे प्रयोग करता है। लिप्यन्तरण नाम को नाम ही बनाए रखता है और उसे उपाधि में नहीं बदलता।
- issue: इस्राएल के धर्मत्याग का वाचा-सम्बन्धी स्वरूप
  choice: ‘छोड़ दिया’, ‘पीछे चल पड़े’, ‘दण्डवत किया’ और ‘क्रोध दिलाया’ के द्वारा मूल कथन को बिना विस्तार के सुरक्षित रखना
  alternative: मुख्य पाठ में इसे स्पष्टतः ‘वाचा तोड़ना’ कहना
  rationale: पद निष्ठा-त्याग और मूर्तिपूजा को प्रबल भाषा में दिखाता है, पर ‘वाचा तोड़ी’ शब्दशः नहीं कहता। इसलिए निहित धर्मवैज्ञानिक भार रखा गया है, अतिरिक्त व्याख्या नहीं जोड़ी गई।
- issue: מִן वाक्यांश का सम्बन्ध
  choice: 'अंशवाचक: आसपास के लोगों के देवताओं ‘में से’'
  alternative: 'अधिक सामान्य सम्बन्ध: ‘आसपास के लोगों के देवताओं का’'
  rationale: उपसर्ग מִן स्वाभाविक रूप से समूह में से चयन बता सकता है, किन्तु वाक्यांश को आसपास के लोगों द्वारा पूजे जानेवाले देवताओं के सामान्य वर्णन के रूप में भी समझा जा सकता है; विकल्प पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किन्तु गरिमापूर्ण कथात्मक रूप अपनाया गया है। ‘पुरखाओं’, ‘पीछे चल पड़े’ और ‘क्रोध दिलाया’ सामान्य पाठक के लिए स्पष्ट हैं; ‘दण्डवत’ मूल क्रिया की ठोस उपासना-मुद्रा को संक्षेप में सुरक्षित रखता है। मूल इब्रानी का लम्बा समन्वित वाक्य हिन्दी की पठनीयता के लिए तीन वाक्यों में बाँटा गया है, और ‘इस प्रकार’ अंतिम परिणाम को स्वाभाविक रूप से जोड़ता है।
