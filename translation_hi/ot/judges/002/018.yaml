id: JDG.2.18
reference: Judges 2:18
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/כִֽי הֵקִ֨ים יְהוָ֥ה לָ/הֶם֮ שֹֽׁפְטִים֒ וְ/הָיָ֤ה יְהוָה֙ עִם הַ/שֹּׁפֵ֔ט וְ/הֽוֹשִׁיעָ/ם֙ מִ/יַּ֣ד אֹֽיְבֵי/הֶ֔ם כֹּ֖ל יְמֵ֣י הַ/שּׁוֹפֵ֑ט כִּֽי יִנָּחֵ֤ם יְהוָה֙ מִ/נַּֽאֲקָתָ֔/ם מִ/פְּנֵ֥י לֹחֲצֵי/הֶ֖ם וְ/דֹחֲקֵי/הֶֽם־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/018.yaml
  text: Whenever Yahweh raised up judges for them[a], Yahweh was with the judge and saved them from the hand of their enemies all the days of the judge, for Yahweh was moved to pity by their groaning because of those who oppressed and afflicted them.
translation:
  language: hi
  text: जब-जब यहोवा उनके लिए न्यायियों को खड़ा करता था, तब यहोवा उस न्यायी के साथ रहता था और उस न्यायी के पूरे जीवनकाल में उन्हें उनके शत्रुओं के हाथ से बचाता था; क्योंकि उनके अत्याचारियों और उन्हें दबानेवालों के कारण उनकी कराह के कारण यहोवा को दया आती थी।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यहोवा अपना मन बदलता था” अथवा “यहोवा करुणा करता था”; इब्रानी क्रिया मनोभाव में बदलाव या करुणामय प्रतिक्रिया व्यक्त कर सकती है।
    reason: יִנָּחֵם की अर्थ-सीमा—विशेषकर मनोभाव में परिवर्तन और करुणामय प्रतिक्रिया—को सुरक्षित रखना।
lexical_decisions:
- source_word: וְכִי
  choice: जब-जब
  rationale: वर्णन में बार-बार घटनेवाली स्थिति व्यक्त है; ‘जब-जब’ इस आवृत्तिमूलक कालगत अर्थ को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: הֵקִים
  choice: खड़ा करता था
  rationale: नेताओं के लिए प्रयुक्त इब्रानी मुहावरे की चित्रात्मकता और परमेश्वर की पहल दोनों सुरक्षित रहती हैं।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी व्यक्तिवाचक वाचा-नाम को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से प्रस्तुत किया गया है, किसी उपाधि से नहीं बदला गया।
- source_word: שֹׁפְטִים
  choice: न्यायियों
  rationale: न्यायियों की पुस्तक में यह स्थापित और संदर्भानुकूल पद है; उद्धारकर्ता की भूमिका अगली क्रिया में अलग से व्यक्त होती है।
- source_word: וְהָיָה יְהוָה עִם הַשֹּׁפֵט
  choice: यहोवा उस न्यायी के साथ रहता
  rationale: यह सीधा अनुवाद परमेश्वर की उपस्थिति और सहायता बताता है, बिना अर्थ में अतिरिक्त व्याख्या जोड़े।
- source_word: וְהוֹשִׁיעָם
  choice: उन्हें ... बचाता था
  rationale: हिफ़ील रूप यहाँ शत्रुओं के अधिकार से छुड़ाने या बचाने का अर्थ देता है; ‘बचाता था’ सामान्य आधुनिक हिन्दी में स्पष्ट है।
- source_word: מִיַּד אֹיְבֵיהֶם
  choice: उनके शत्रुओं के हाथ से
  rationale: मूल का ठोस मुहावरा हिन्दी में भी सहज और बोधगम्य है तथा शत्रुओं के अधिकार की धारणा बनाए रखता है।
- source_word: כֹּל יְמֵי הַשּׁוֹפֵט
  choice: उस न्यायी के पूरे जीवनकाल में
  rationale: संदर्भ में आशय न्यायी के जीवित रहने की पूरी अवधि है; यह हिन्दी में ‘उस न्यायी के सब दिनों’ से अधिक स्वाभाविक है।
- source_word: יִנָּחֵם
  choice: मन दया से भर जाता था
  rationale: निफ़ाल रूप यहाँ पीड़ा देखकर उत्पन्न दयापूर्ण प्रतिक्रिया व्यक्त करता है; चुना हुआ वाक्यांश भावात्मक बल बनाए रखता है, जबकि ‘पछताया’ नैतिक भूल का भ्रामक संकेत दे सकता है।
- source_word: מִנַּאֲקָתָם
  choice: उनका कराहना सुनकर
  rationale: מִן कराहने को यहोवा की दयापूर्ण प्रतिक्रिया का अवसर या कारण बताता है; हिन्दी में ‘सुनकर’ प्रसंगसम्मत है, यद्यपि सुनने की क्रिया मूल में अलग से नहीं लिखी गई।
- source_word: לֹחֲצֵיהֶם וְדֹחֲקֵיהֶם
  choice: उन पर अत्याचार और ज़ोर-जबरदस्ती करनेवालों
  rationale: दोनों सक्रिय कृदंतों का भेद यथासंभव रखते हुए स्वाभाविक हिन्दी में लगातार दबाव, उत्पीड़न और कठोर व्यवहार व्यक्त किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: मूल पाठ व्यक्तिवाचक नाम का प्रयोग करता है। हिन्दी पाठकों में पहचाने जानेवाले ‘यहोवा’ से नाम को नाम ही रखा गया है, उपाधि में नहीं बदला गया।
- issue: יִנָּחֵם में परमेश्वर की प्रतिक्रियात्मक भावना
  choice: यहोवा का मन दया से भर जाता था
  alternative: यहोवा तरस खाता था / यहोवा पछताता था / यहोवा मान जाता था
  rationale: इब्रानी क्रिया मनोभाव में परिवर्तन, मान जाने या करुणामय प्रतिक्रिया का बोध दे सकती है। संदर्भ इस्राएल की कराह के उत्तर में दया पर बल देता है; मुख्य पाठ उसे व्यक्त करता है, जबकि पादटिप्पणी वास्तविक शाब्दिक व्यापकता सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सामान्य-पाठक-सुलभ रूप अपनाया गया है। आवृत्तिमूलक क्रियाओं के लिए ‘था’ संरचना रखी गई है। ‘न्यायी’, ‘कराहना’ और ‘शत्रुओं के हाथ से’ जैसे बाइबलीय पद मूल से निकटता रखते हुए आज भी समझ में आते हैं।
