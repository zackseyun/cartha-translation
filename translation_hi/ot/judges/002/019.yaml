source:
  edition: WLC
  text: וְ/הָיָ֣ה בְּ/מ֣וֹת הַ/שּׁוֹפֵ֗ט יָשֻׁ֨בוּ֙ וְ/הִשְׁחִ֣יתוּ מֵֽ/אֲבוֹתָ֔/ם לָ/לֶ֗כֶת אַֽחֲרֵי֙ אֱלֹהִ֣ים אֲחֵרִ֔ים לְ/עָבְדָ֖/ם וּ/לְ/הִשְׁתַּחֲוֺ֣ת לָ/הֶ֑ם לֹ֤א הִפִּ֨ילוּ֙ מִ/מַּ֣עַלְלֵי/הֶ֔ם וּ/מִ/דַּרְכָּ֖/ם הַ/קָּשָֽׁה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/019.yaml
  text: And when the judge died[a], they turned back and acted more corruptly than their fathers, going after other gods to serve them and to bow down to them. They did not drop any of their deeds or their stubborn way.
translation:
  language: hi
  text: जब न्यायी की मृत्यु हो जाती थी, तब वे फिर लौटकर अपने पूर्वजों से भी अधिक भ्रष्ट आचरण करते थे। वे दूसरे देवताओं के पीछे चलते, उनकी सेवा करते और उनके आगे दंडवत करते थे। उन्होंने अपने कामों और अपने हठीले मार्ग को तनिक भी नहीं छोड़ा[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उन्होंने अपने कामों में से या अपने हठीले मार्ग में से कुछ भी गिरने नहीं दिया।” अर्थात्, उन्होंने उन्हें बिल्कुल नहीं छोड़ा।
    reason: इब्रानी क्रिया के ‘गिरा देने’ वाले सजीव बिंब को सुरक्षित रखते हुए मुख्य पाठ के ‘न छोड़ना’ अर्थ को स्पष्ट करना।
lexical_decisions:
- source_word: וְהָיָה בְּמוֹת הַשּׁוֹפֵט
  choice: पर जब न्यायी मर जाता
  rationale: इब्रानी कथात्मक सूत्र को स्वाभाविक कालवाचक उपवाक्य में व्यक्त किया गया है। प्रसंग बार-बार दोहराए जाने वाले चक्र का है, इसलिए हिन्दी में अभ्यस्त क्रिया-रूप उपयुक्त है। שֹׁפֵט के लिए पुस्तक की प्रमुख पदावली बनाए रखने हेतु ‘न्यायी’ चुना गया है।
- source_word: יָשֻׁבוּ וְהִשְׁחִיתוּ מֵאֲבוֹתָם
  choice: वे फिर लौटकर अपने पुरखाओं से भी बढ़कर भ्रष्ट आचरण करने लगते थे
  rationale: שׁוּב यहाँ पहले के पापमय आचरण की ओर लौटने को दर्शाता है। מִן को तुलनात्मक अर्थ में लेकर यह स्पष्ट किया गया है कि उनका भ्रष्ट आचरण पिछली पीढ़ियों से भी बढ़ जाता था।
- source_word: לָלֶכֶת אַחֲרֵי אֱלֹהִים אֲחֵרִים
  choice: दूसरे देवताओं के पीछे चलते
  rationale: ‘पीछे चलना’ निष्ठा और अनुसरण के इब्रानी रूपक को बनाए रखता है; ‘दूसरे देवता’ यहोवा के अतिरिक्त देवताओं के सीधे अर्थ को सुरक्षित रखता है।
- source_word: לְעָבְדָם וּלְהִשְׁתַּחֲוֹת לָהֶם
  choice: उनकी सेवा करते और उनके आगे दंडवत करते थे
  rationale: עבד की सेवा और השתחוה की झुककर धार्मिक सम्मान देने की अलग-अलग छवियाँ सुरक्षित रखी गई हैं। ‘दंडवत करना’ शारीरिक झुकने और आराधनात्मक सम्मान दोनों को व्यक्त करता है।
- source_word: לֹא הִפִּילוּ מִמַּעַלְלֵיהֶם
  choice: उन्होंने अपने कामों ... को तनिक भी नहीं छोड़ा
  rationale: נפל के हिफ़ील रूप और מן की रचना का आशय किसी आचरण को छोड़ देना है। स्वाभाविक हिन्दी में ‘तनिक भी नहीं छोड़ा’ पूर्ण निषेध को स्पष्ट करता है, जबकि शाब्दिक बिंब पादटिप्पणी में दिया गया है।
- source_word: וּמִדַּרְכָּם הַקָּשָׁה
  choice: और अपने हठीले चाल-चलन को
  rationale: דֶּרֶךְ यहाँ जीवन-पद्धति या आचरण का रूपक है, और קָשֶׁה नैतिक कठोरता तथा हठ को दर्शाता है। ‘हठीला चाल-चलन’ आधुनिक हिन्दी में दोनों भावों को स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: אֱלֹהִים אֲחֵרִים का बहुदेववादी प्रसंग में अनुवाद
  choice: दूसरे देवता
  alternative: पराए देवता
  rationale: मूल पाठ मुख्यतः यहोवा के अतिरिक्त अन्य देवताओं के पीछे चलने का वाचा-संबंधी विरोध दिखाता है। ‘पराए’ अनावश्यक रूप से जातीय या विदेशी अर्थ जोड़ सकता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। न्यायियों 2 के बार-बार दोहराए जाने वाले ऐतिहासिक चक्र को व्यक्त करने के लिए अभ्यस्त भूतकाल का प्रयोग किया गया है। ‘न्यायी’, ‘दंडवत’ और ‘चाल-चलन’ जैसे शब्द पुस्तक की धार्मिक-ऐतिहासिक गंभीरता बनाए रखते हैं।
