base_translation:
  language: en
  yaml_path: translation/ot/judges/003/020.yaml
  text: Then Ehud came to him while he was sitting alone in his cool roof chamber[a], and Ehud said[c][b], “I have a word from God for you.” So he rose from his seat.
translation:
  language: hi
  text: तब एहूद उसके पास आया। उस समय वह उस ठंडी ऊपरी कोठरी[a] में अकेला बैठा था, जो केवल उसी के लिए थी। एहूद ने कहा, “मेरे पास आपके लिए परमेश्वर का एक संदेश[b] है।” तब वह अपने आसन[c] से उठ खड़ा हुआ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “छत पर बनी ठंडी कोठरी”; इब्रानी पद का ठीक वास्तु-संबंधी अर्थ अनिश्चित है।
    reason: lexical_alternative
  - marker: b
    text: या, “परमेश्वर का वचन।”
    reason: lexical_alternative
  - marker: c
    text: या, “कुर्सी” अथवा “सिंहासन।”
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּא
  choice: आया
  rationale: क्रिया का सामान्य अर्थ किसी के पास आना या पहुँच जाना है; “आया” बिना अनावश्यक विवरण जोड़े स्वाभाविक कथात्मक रूप देता है।
- source_word: יֹשֵׁב
  choice: बैठा था
  rationale: कृदंत यहाँ पृष्ठभूमि में जारी अवस्था बताता है, इसलिए “बैठा था” उपयुक्त है।
- source_word: עֲלִיַּת הַמְּקֵרָה
  choice: ठंडी ऊपरी कोठरी
  rationale: עֲלִיָּה ऊपरी कक्ष या छत पर बनी कोठरी को दर्शाता है, जबकि הַמְּקֵרָה संभवतः ठंडे या हवादार स्थान का संकेत देता है। मुख्य पाठ में सहज वास्तु और जलवायु-संबंधी अर्थ रखा गया है तथा विकल्प पादटिप्पणी में दिया गया है।
- source_word: אֲשֶׁר לוֹ לְבַדּוֹ
  choice: अपने लिए बनी … में अकेला
  rationale: यह पद कोठरी के निजी उपयोग और एग्लोन के अकेले होने—दोनों पर बल देता है; हिन्दी में दोनों भाव स्पष्ट रखे गए हैं।
- source_word: דְּבַר אֱלֹהִים
  choice: परमेश्वर का एक संदेश
  rationale: דָּבָר का अर्थ यहाँ कथन, वचन या संदेश हो सकता है। प्रसंग में “संदेश” स्वाभाविक है, जबकि अधिक शब्दानुरूप “वचन” पादटिप्पणी में सुरक्षित है।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: रूप बहुवचन जैसा होने पर भी यह पद सामान्यतः एकवचन परमेश्वर के लिए प्रयुक्त होता है; इस वाक्य में एकवचन अर्थ सबसे स्वाभाविक है।
- source_word: וַיָּקָם
  choice: उठ खड़ा हुआ
  rationale: यह अभिव्यक्ति बैठी हुई अवस्था से उठने की क्रिया को वर्तमान हिन्दी में स्पष्ट और स्वाभाविक ढंग से व्यक्त करती है।
- source_word: מֵעַל הַכִּסֵּא
  choice: अपने आसन से
  rationale: כִּסֵּא का अर्थ आसन, कुर्सी या सिंहासन हो सकता है। निजी कोठरी के प्रसंग में “आसन” अर्थ की व्यापकता बनाए रखता है और राजदरबार का दृश्य अनावश्यक रूप से नहीं जोड़ता।
theological_decisions:
- issue: एहूद के कथन में אֱלֹהִים का अर्थ
  choice: परमेश्वर
  alternative: देवता
  rationale: यद्यपि אֱלֹהִים का रूप बहुवचन है, इब्रानी में यह प्रायः इस्राएल के परमेश्वर के लिए एकवचन अर्थ में आता है। דְּבַר אֱלֹהִים और इस कथानक में “परमेश्वर” सबसे स्वाभाविक है। अनुवाद एहूद के कथन को केवल प्रस्तुत करता है, उसकी मंशा या धर्मवैज्ञानिक सत्यता पर अतिरिक्त निर्णय नहीं देता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण हिन्दी में रखी गई है। “कोठरी” सामान्य पाठक के लिए ऊपरी निजी कक्ष का ठोस चित्र देती है; “आसन” निजी परिवेश में उपयुक्त रहते हुए मूल शब्द की अर्थ-व्याप्ति बनाए रखता है। सम्मानसूचक “आपके” राजा से सीधे संबोधन को स्वाभाविक हिन्दी में व्यक्त करता है।
