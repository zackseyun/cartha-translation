source:
  edition: WLC
  text: וְ/אַחֲרָ֤י/ו הָיָה֙ שַׁמְגַּ֣ר בֶּן עֲנָ֔ת וַ/יַּ֤ךְ אֶת פְּלִשְׁתִּים֙ שֵֽׁשׁ מֵא֣וֹת אִ֔ישׁ בְּ/מַלְמַ֖ד הַ/בָּקָ֑ר וַ/יֹּ֥שַׁע גַּם ה֖וּא אֶת יִשְׂרָאֵֽל־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/031.yaml
  text: After him was Shamgar son of Anath[a], and he struck down six hundred Philistines with an ox goad[b]; he too saved Israel.
translation:
  language: hi
  text: उसके बाद अनात का पुत्र[a] शमगर था। उसने बैल हाँकने की नुकीली छड़ी[b] से छह सौ पलिश्तियों को मार गिराया; उसने भी इस्राएल को बचाया[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “अनात का पुत्र” पिता का नाम बता सकता है; संभव है कि यह कोई उपाधि रही हो। इसका सटीक आशय अनिश्चित है।
    reason: historical_ambiguity
  - marker: b
    text: यह पशुओं को हाँकने के लिए इस्तेमाल की जाने वाली नुकीली छड़ी थी।
    reason: cultural_note
  - marker: c
    text: या “इस्राएल को छुड़ाया।” इब्रानी क्रिया युद्ध के संदर्भ में बचाने या छुटकारा दिलाने का अर्थ दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחֲרָיו הָיָה
  choice: उसके बाद ... का समय आया
  rationale: यह पद पिछले उद्धारकर्ता के बाद शमगर का परिचय देता है। हिंदी में शाब्दिक ‘उसके बाद ... था’ अस्वाभाविक है; ‘का समय आया’ क्रम को स्वाभाविक ढंग से व्यक्त करता है, बिना पिछले व्यक्ति का नाम जोड़ने के।
- source_word: שַׁמְגַּר בֶּן־עֲנָת
  choice: अनात के पुत्र शमगर
  rationale: नामों का मानक हिंदी लिप्यंतरण किया गया है और ‘अनात का पुत्र’ शब्दशः रखा गया है; यह वास्तव में वंश-सूचक है या कोई उपाधि, इसे मुख्य पाठ में तय नहीं किया गया।
- source_word: וַיַּךְ
  choice: मार गिराया
  rationale: נכה युद्ध के संदर्भ में प्राणघातक रूप से प्रहार करने या धराशायी करने का अर्थ दे सकता है। ‘मार गिराया’ हिंसक पराजय और संभावित वध, दोनों को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: שֵׁשׁ מֵאוֹת אִישׁ ... פְּלִשְׁתִּים
  choice: छह सौ पलिश्तियों
  rationale: सैन्य संदर्भ में गिने गए लोगों को हिंदी में सामूहिक जाति-नाम के बहुवचन से स्वाभाविक रूप में व्यक्त किया गया है।
- source_word: בְּמַלְמַד הַבָּקָר
  choice: बैल हाँकने की छड़ी से
  rationale: यह पशुओं को हाँकने के नुकीले कृषि-उपकरण का स्पष्ट और आधुनिक हिंदी वर्णन है; ‘अंकुश’ की संभावित अस्पष्टता से बचा गया है।
- source_word: וַיֹּשַׁע גַּם־הוּא אֶת־יִשְׂרָאֵל
  choice: उसने भी इस्राएल को बचाया
  rationale: ‘भी’ शमगर को पिछले उद्धारकर्ताओं की शृंखला में रखता है। ‘बचाया’ ישׁע का सहज व्यापक अर्थ देता है और उद्धार की सीमा या अवधि के बारे में कुछ नहीं जोड़ता।
theological_decisions:
- issue: शमगर द्वारा इस्राएल को बचाने का स्वरूप
  choice: उसने भी इस्राएल को बचाया
  alternative: उसने भी इस्राएल को छुड़ाया
  rationale: मूल क्रिया सैन्य संकट से बचाव या छुटकारे को व्यक्त कर सकती है। ‘बचाया’ वास्तविक उद्धार को बनाए रखता है, पर उसके धार्मिक या ऐतिहासिक विस्तार को अनावश्यक रूप से निश्चित नहीं करता।
- issue: ‘अनात का पुत्र’ की पहचान
  choice: मुख्य पाठ में संबंध को शब्दशः रखना
  alternative: इसे निश्चित रूप से पिता का नाम या योद्धा-उपाधि मानना
  rationale: בֶּן־עֲנָת का रूप पितृनाम जैसा है, किंतु ‘अनात’ प्राचीन कनानी देवी का नाम भी था और संभवतः यह कोई पदवी हो सकती है। अनिश्चितता को टिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘बैल हाँकने की छड़ी’ सामान्य पाठक के लिए ‘अंकुश’ से अधिक तुरंत समझ आने वाला पद है। दो स्वतंत्र मुख्य वाक्यों को अर्धविराम से जोड़कर इब्रानी कथन का संक्षिप्त, क्रमिक बल बनाए रखा गया है।
