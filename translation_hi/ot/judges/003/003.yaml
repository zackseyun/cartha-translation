  register: आधुनिक मानक हिंदी में गरिमापूर्ण, सहज कथात्मक शैली अपनाई गई है। जातिनाम परिचित हिंदी बाइबलीय वर्तनी में रखे गए हैं। पद मूलतः पिछले वाक्य की सूची का अंश है, इसलिए हिंदी पाठ भी पूर्ण स्वतंत्र वाक्य के बजाय सूचीगत वाक्यांश के रूप में समाप्त होता है।
