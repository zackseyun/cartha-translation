source:
  edition: WLC
  text: חֲמֵ֣שֶׁת סַרְנֵ֣י פְלִשְׁתִּ֗ים וְ/כָל הַֽ/כְּנַעֲנִי֙ וְ/הַ/צִּ֣ידֹנִ֔י וְ/הַ֣/חִוִּ֔י יֹשֵׁ֖ב הַ֣ר הַ/לְּבָנ֑וֹן מֵ/הַר֙ בַּ֣עַל חֶרְמ֔וֹן עַ֖ד לְב֥וֹא חֲמָֽת׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/003.yaml
  text: the five rulers of the Philistines[a], and all the Canaanites, and the Sidonians, and the Hivites who lived in the hill country of Lebanon, from Mount Baal-hermon as far as Lebo-hamath.
translation:
  language: hi
  text: पलिश्तियों के पाँच शासक, सभी कनानी, सीदोनी और वे हिव्वी जो लबानोन के पहाड़ी प्रदेश में बाल-हेर्मोन पर्वत से लेकर लबो-हमात[a] तक रहते थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हमात के प्रवेश-स्थान तक।” इब्रानी पदबंध को स्थाननाम “लबो-हमात” या वर्णनात्मक अभिव्यक्ति—दोनों रूपों में समझा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: חֲמֵשֶׁת סַרְנֵי פְלִשְׁתִּים
  choice: पलिश्तियों के पाँच शासक
  rationale: सַרְנֵי पलिश्ती नगर-राज्यों के विशिष्ट राजनीतिक अगुओं को सूचित करता है; आधुनिक हिंदी में ‘शासक’ स्पष्ट है और ‘सरदार’ की संभावित जनजातीय छाया से बचता है।
- source_word: כָל הַכְּנַעֲנִי
  choice: सभी कनानी
  rationale: एकवचन जातिवाचक रूप यहाँ सामूहिक अर्थ रखता है; हिंदी में ‘सभी कनानी’ स्वाभाविक रूप से समुदाय को व्यक्त करता है।
- source_word: הַצִּידֹנִי
  choice: सीदोनी
  rationale: सामूहिक जातिवाचक संज्ञा को मानक हिंदी बाइबलीय जातिनाम के रूप में रखा गया है।
- source_word: הַחִוִּי
  choice: वे हिव्वी
  rationale: जातिवाचक सामूहिक रूप; ‘वे’ अगले संबंधवाचक उपवाक्य को केवल हिव्वियों से स्वाभाविक रूप से जोड़ता है।
- source_word: יֹשֵׁב
  choice: जो ... रहते थे
  rationale: एकवचन कृदंत सामूहिक हिव्वी समुदाय का वर्णन करता है; ऐतिहासिक कथन में बहुवचन भूतकाल सहज हिंदी है।
- source_word: הַר הַלְּבָנוֹן
  choice: लबानोन के पहाड़ी प्रदेश
  rationale: शाब्दिक ‘लबानोन का पर्वत’ यहाँ व्यापक पर्वतीय भूभाग को दर्शाता है; ‘पहाड़ी प्रदेश’ एक अकेली चोटी का भ्रम नहीं देता।
- source_word: מֵהַר בַּעַל חֶרְמוֹן
  choice: बाल-हेर्मोन पर्वत से
  rationale: स्थाननाम का लिप्यंतरण किया गया और הַר को स्पष्ट रूप से ‘पर्वत’ कहा गया है।
- source_word: עַד לְבוֹא חֲמָת
  choice: लबो-हमात तक
  rationale: ज्ञात भौगोलिक स्थाननाम के रूप में לְבוֹא חֲמָת का लिप्यंतरण मुख्य पाठ में रखा गया है, जबकि वर्णनात्मक अर्थ पादटिप्पणी में सुरक्षित है।
