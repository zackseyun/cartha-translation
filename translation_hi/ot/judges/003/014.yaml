  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज शैली। ‘इस्राएल के पुत्र’ स्रोत के सामूहिक, लिंग-सूचक मुहावरे को सुरक्षित रखता है; ‘के अधीन सेवा’ राजनीतिक दासता/अधीनता का प्रसंग स्पष्ट करते हुए मूल क्रिया के सेवा-संबंधी अर्थ को भी बनाए रखता है।
