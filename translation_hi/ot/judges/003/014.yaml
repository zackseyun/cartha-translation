  yaml_path: translation/ot/judges/003/014.yaml
  text: And the sons of Israel served Eglon king of Moab for eighteen years[a].
translation:
  language: hi
  text: इस्राएल के पुत्र अठारह वर्ष तक मोआब के राजा एग्लोन के अधीन सेवा करते रहे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַבְדוּ
  choice: के अधीन सेवा करते रहे
  rationale: עבד यहाँ किसी विदेशी राजा के प्रति राजनीतिक अधीनता और सेवा को व्यक्त करता है, आराधना को नहीं। यह रूप स्रोत के ‘सेवा’ भाव और प्रसंगगत अधीनता—दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: בְנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्र
  rationale: यह इब्रानी के लिंग-सूचक सामूहिक मुहावरे का निकट और हिन्दी में समझने योग्य रूप है।
- source_word: אֶת עֶגְלוֹן
  choice: एग्लोन
  rationale: אֶת निश्चित कर्म का चिह्न है और हिन्दी में अलग से अनूदित नहीं होता; व्यक्ति के नाम का लिप्यंतरण ‘एग्लोन’ किया गया है।
- source_word: מֶלֶךְ מוֹאָב
  choice: मोआब के राजा
  rationale: इब्रानी संबंध-वाक्यांश का स्वाभाविक हिन्दी रूप है; इसे नाम से पहले रखने पर हिन्दी वाक्य अधिक सहज बनता है।
- source_word: שְׁמוֹנֶה עֶשְׂרֵה שָׁנָה
  choice: अठारह वर्ष तक
  rationale: अवधि बताने वाले इब्रानी कर्मकारक को हिन्दी में ‘तक’ के साथ स्वाभाविक और स्पष्ट रूप से व्यक्त किया गया है।
