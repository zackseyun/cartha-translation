language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יְהִ֣י בְּ/בוֹא֔/וֹ וַ/יִּתְקַ֥ע בַּ/שּׁוֹפָ֖ר בְּ/הַ֣ר אֶפְרָ֑יִם וַ/יֵּרְד֨וּ עִמּ֧/וֹ בְנֵֽי יִשְׂרָאֵ֛ל מִן הָ/הָ֖ר וְ/ה֥וּא לִ/פְנֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/027.yaml
  text: And when he arrived[a], he blew the trumpet in the hill country of Ephraim, and the sons of Israel went down with him from the hill country[b], and he was before them.
translation:
  language: hi
  text: जब वह पहुँचा, तब उसने एप्रैम के पहाड़ी प्रदेश में नरसिंगा फूँका। तब इस्राएली उसके साथ पहाड़ी प्रदेश से नीचे उतरे, और वह उनके आगे था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי בְּבוֹאוֹ
  choice: जब वह पहुँचा, तब
  rationale: यह इब्रानी रचना कथा में समय और क्रम का संकेत देती है। आधुनिक हिन्दी में ‘जब...तब’ स्वाभाविक रूप से वही संबंध व्यक्त करता है; ‘और ऐसा हुआ’ जोड़ना अनावश्यक रूप से शब्दशः होता।
- source_word: וַיִּתְקַע בַּשּׁוֹפָר
  choice: उसने ... नरसिंगा फूँका
  rationale: שׁוֹפָר संकेत देने के लिए फूँका जाने वाला सींग था। ‘नरसिंगा’ हिन्दी बाइबलीय और ऐतिहासिक संदर्भ में उपयुक्त वाद्य-संज्ञा है तथा सामान्य आधुनिक पाठक के लिए ‘तुरही’ से अधिक सींगनुमा वाद्य का बोध कराती है।
- source_word: בְּהַר אֶפְרָיִם
  choice: एप्रैम के पहाड़ी प्रदेश में
  rationale: यहाँ הַר किसी एक पर्वत-शिखर के बजाय एप्रैम के ऊँचे पहाड़ी भूभाग को सूचित करता है।
- source_word: וַיֵּרְדוּ עִמּוֹ בְנֵי יִשְׂרָאֵל
  choice: इस्राएली उसके साथ ... नीचे उतरे
  rationale: בְנֵי יִשְׂרָאֵל का स्वाभाविक सामूहिक हिन्दी रूप ‘इस्राएली’ है। प्रसंग में वे युद्ध के लिए एकत्र लोग हैं; ‘इस्राएल के पुत्र’ आधुनिक हिन्दी में कृत्रिम और संभावित रूप से भ्रामक होता।
- source_word: מִן הָהָר
  choice: पहाड़ी प्रदेश से
  rationale: निर्दिष्ट הָהָר पहले उल्लिखित एप्रैम के पहाड़ी भूभाग की ओर लौटता है; समान पदावली रखने से यह संदर्भ स्पष्ट बना रहता है।
- source_word: וְהוּא לִפְנֵיהֶם
  choice: और वह उनके आगे था
  rationale: यह स्रोत के स्थानसूचक कथन को निकटता से रखता है और नेतृत्व का संभावित आशय निहित रहने देता है; ‘वह उनकी अगुवाई कर रहा था’ कहना अर्थ को अधिक स्पष्ट करके वास्तविक अस्पष्टता घटा देता।
theological_decisions:
- issue: בְנֵי יִשְׂרָאֵל का सामूहिक और लिंगसूचक अर्थ
  choice: इस्राएली
  alternative: इस्राएल के पुत्र
  rationale: यह पद जातीय-सामूहिक पहचान बताता है और इस प्रसंग में संभवतः युद्धदल को सूचित करता है। ‘इस्राएली’ स्रोत का सामूहिक आशय स्वाभाविक हिन्दी में देता है, बिना यह अनावश्यक दावा किए कि पद में प्रत्येक व्यक्ति के लिंग पर अलग से बल है।
- issue: वְהוּא לִפְנֵיהֶם में नेतृत्व का निहितार्थ
  choice: वह उनके आगे था
  alternative: वह उनकी अगुवाई कर रहा था
  rationale: इब्रानी पाठ सीधे स्थान बताता है, जिससे नेतृत्व का अर्थ निकल सकता है। मुख्य पाठ में दोनों आयाम खुले रखना व्याख्यात्मक तनाव को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक रखी गई है। ‘एप्रैम के पहाड़ी प्रदेश’ भौगोलिक क्षेत्र को स्पष्ट करता है। वाक्य-विन्यास इब्रानी क्रम को बनाए रखते हुए सहज हिन्दी में विभाजित किया गया है।
