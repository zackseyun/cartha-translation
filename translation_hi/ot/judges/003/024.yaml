base_translation:
  language: en
  yaml_path: translation/ot/judges/003/024.yaml
  text: When he had gone out[a], his servants came and looked, and behold, the doors of the upper room were locked. So they said, “Surely he is relieving himself in the cool inner room.”
translation:
  language: hi
  text: जब वह बाहर निकल गया, तब उसके सेवक आए और उन्होंने देखा कि ऊपरी कमरे के दरवाज़े बंद और ताला लगे हुए थे। इसलिए उन्होंने कहा, “निश्चय ही वह ठंडे भीतरी कमरे में शौच कर रहा है[a]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ, “अपने पाँव ढक रहा है”; यह शौच करने के लिए प्रयुक्त इब्रानी शिष्टोक्ति है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּא יָצָא
  choice: जब वह बाहर निकल गया
  rationale: इब्रानी कथानक में यह वाक्यांश एहूद के निकल जाने की ओर लौटकर सेवकों के आने की परिस्थिति बताता है; ‘जब’ स्वाभाविक रूप से काल-संबंध व्यक्त करता है।
- source_word: עֲבָדָיו
  choice: उसके सेवक
  rationale: राजकीय गृह के प्रसंग में यह राजा की सेवा करनेवालों को दर्शाता है; उनकी दासता की कानूनी स्थिति यहाँ मुख्य विषय नहीं है।
- source_word: וַיִּרְאוּ וְהִנֵּה
  choice: उन्होंने देखा कि
  rationale: यह रूप सेवकों द्वारा स्थिति पर ध्यान देने और अचानक सामने आई दशा को पहचानने का भाव देता है; आधुनिक हिन्दी में यह संयोजन स्वाभाविक है।
- source_word: דַּלְתוֹת הָעֲלִיָּה
  choice: ऊपरवाले कमरे के दरवाज़े
  rationale: עֲלִיָּה भवन के ऊपरी भाग में स्थित कमरे को दर्शाता है; यह साधारण पाठक के लिए स्पष्ट और वास्तु-संदर्भ के अनुकूल है।
- source_word: נְעֻלוֹת
  choice: बंद थे
  rationale: मूल शब्द ताला लगे या अन्दर से अड़े होने की स्थिति बता सकता है। हिन्दी में ‘बंद’ इस अस्पष्टता को बनाए रखता है और किसी आधुनिक ताले का अनावश्यक संकेत नहीं देता।
- source_word: אַךְ
  choice: निश्चय ही
  rationale: यहाँ यह अव्यय सेवकों के दृढ़ अनुमान को प्रकट करता है।
- source_word: מֵסִיךְ ... אֶת רַגְלָיו
  choice: शौच कर रहा है
  rationale: शाब्दिक अर्थ ‘अपने पाँव ढक रहा है’ है, पर यह मलत्याग के लिए इब्रानी शिष्टोक्ति है। मुख्य पाठ में आशय स्पष्ट किया गया है और मूल चित्र को पाद-टिप्पणी में रखा गया है।
- source_word: חֲדַר הַמְּקֵרָה
  choice: ठंडे भीतरी कमरे में
  rationale: यह पद ठंडक से जुड़े निजी या भीतरी कक्ष को सूचित करता है। ‘ठंडा भीतरी कमरा’ स्थान की निजता और शीतलता दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
