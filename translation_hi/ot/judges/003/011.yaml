  text: So the land had rest for forty years. Then Othniel son of Kenaz died.
translation:
  language: hi
  text: इस प्रकार देश में चालीस वर्ष तक शान्ति रही। फिर कनज का पुत्र ओत्नीएल मर गया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּשְׁקֹט
  choice: शान्ति रही
  rationale: क्रिया שׁקט यहाँ उत्पीड़न और युद्ध से मुक्ति के बाद देश के शान्त और निरुपद्रव रहने को व्यक्त करती है। ‘शान्ति रही’ स्वाभाविक हिन्दी है और पूर्ण समृद्धि का अनावश्यक अर्थ नहीं जोड़ती।
- source_word: הָאָרֶץ
  choice: देश
  rationale: न्यायियों के इस प्रसंग में אֶרֶץ से आशय इस्राएल का भूभाग/देश है, पूरी पृथ्वी नहीं। आधुनिक हिन्दी में ‘देश’ यहाँ सहज और सटीक है।
- source_word: אַרְבָּעִים שָׁנָה
  choice: चालीस वर्ष तक
  rationale: यह अवधि बताने वाला प्रयोग है; ‘तक’ उस अवधि को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: וַיָּמָת
  choice: फिर ... मर गया
  rationale: वाव-युक्त क्रिया कथा को आगे बढ़ाती है। ‘फिर’ क्रम को दर्शाता है, जबकि ‘मर गया’ मूल कथन को सीधे रखता है।
- source_word: עָתְנִיאֵל
  choice: ओत्नीएल
  rationale: इब्रानी नाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण।
- source_word: בֶּן קְנַז
  choice: कनज का पुत्र
  rationale: यह संबंधसूचक पद ओत्नीएल की वंश-पहचान देता है; हिन्दी में ‘कनज का पुत्र’ स्पष्ट और गरिमापूर्ण है।
