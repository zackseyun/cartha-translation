  source_fidelity: 'The draft accurately represents the Hebrew sequence and principal expressions: the Spirit of Yahweh upon Othniel, his judging Israel, going out to battle, Yahweh''s giving Cushan-rishathaim into his hand, and his subsequent predominance. ‘अराम’ and the transliterated personal name appropriately preserve the Hebrew names. The wording ‘हाथ में कर दिया,’ however, is not idiomatic Hindi for נתן ביד and should be replaced with ‘हाथ में दे दिया.’'
