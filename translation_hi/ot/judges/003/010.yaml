base_translation:
  language: en
  yaml_path: translation/ot/judges/003/010.yaml
  text: The Spirit of Yahweh came upon him[a], and he judged Israel. He went out to battle, and Yahweh gave Cushan-rishathaim king of Aram into his hand[b], and his hand prevailed over Cushan-rishathaim.
translation:
  language: hi
  text: याहवेह का आत्मा उस पर आया[a], और उसने इस्राएल का न्याय किया। वह युद्ध करने निकला, और याहवेह ने अराम के राजा कूशन-रिशातैम को उसके हाथ में दे दिया[b]; और उसका हाथ कूशन-रिशातैम पर भारी पड़ा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “याहवेह का आत्मा उस पर था।” इब्रानी मुहावरा स्थिर उपस्थिति भी व्यक्त कर सकता है, यद्यपि कथा का प्रसंग “उस पर आया” का समर्थन करता है।
    reason: lexical_alternative
  - marker: b
    text: अराम इब्रानी स्थाननाम है, जिसे कुछ पुराने अनुवादों में “सीरिया” कहा गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: וַתְּהִי עָלָיו רוּחַ יְהוָה
  choice: याहवेह का आत्मा उस पर आया
  rationale: היה על का यह प्रयोग किसी व्यक्ति पर परमेश्वर के आत्मा के आने अथवा उस पर बने रहने को व्यक्त कर सकता है। कथा में सामर्थ्य दिए जाने की शुरुआत होने के कारण गतिशील अनुवाद स्वाभाविक है, जबकि वैकल्पिक स्थिर अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: יְהוָה
  choice: याहवेह
  rationale: मूल पाठ के व्यक्तिगत ईश्वरीय नाम को उपाधि से बदलने के बजाय हिन्दी में लिप्यंतरित किया गया है।
- source_word: וַיִּשְׁפֹּט אֶת יִשְׂרָאֵל
  choice: उसने इस्राएल का न्याय किया
  rationale: שׁפט न्याय करने के साथ न्यायी के रूप में शासन और छुटकारे का व्यापक कार्य भी समेट सकता है। मूल पुस्तक की प्रमुख शब्दावली और अर्थगत विस्तार बनाए रखने के लिए ‘न्याय किया’ रखा गया है।
- source_word: וַיֵּצֵא לַמִּלְחָמָה
  choice: वह युद्ध करने निकला
  rationale: यह प्रचलित सैन्य मुहावरा है; चुना गया हिन्दी रूप स्वाभाविक और प्रसंगानुकूल है।
- source_word: וַיִּתֵּן יְהוָה בְּיָדוֹ
  choice: याहवेह ने ... उसके हाथ में कर दिया
  rationale: נתן ביד शत्रु को किसी के अधिकार या वश में देने का मुहावरा है। ‘हाथ में कर दिया’ स्रोत की देहात्मक छवि को समझने योग्य हिन्दी में बनाए रखता है।
- source_word: כּוּשַׁן רִשְׁעָתַיִם
  choice: कूशन-रिशातैम
  rationale: व्यक्तिवाचक नाम को अनूदित करने के बजाय हिन्दी में लिप्यंतरित किया गया है; योजक चिह्न संयुक्त रूप को स्पष्ट करता है।
- source_word: מֶלֶךְ אֲרָם
  choice: अराम का राजा
  rationale: אֲרָם मूल इब्रानी स्थाननाम है। परंपरागत ‘सीरिया’ की अपेक्षा ‘अराम’ स्रोत को अधिक सीधे दर्शाता है।
- source_word: וַתָּעָז יָדוֹ עַל
  choice: उसका हाथ ... पर प्रबल हुआ
  rationale: यह मुहावरा विरोधी पर शक्ति और प्रभुत्व व्यक्त करता है। चुना गया रूप इब्रानी रूपक और विजय का अर्थ दोनों सुरक्षित रखता है।
theological_decisions:
- issue: ईश्वरीय आत्मा वाले वाक्यांश का कालगत भाव
  choice: याहवेह का आत्मा उस पर आया
  alternative: याहवेह का आत्मा उस पर था
  rationale: इब्रानी पदबंध आगमन और विद्यमान उपस्थिति दोनों ढंग से समझा जा सकता है। कथा में ओत्नीएल के कार्य के लिए ईश्वरीय सामर्थ्य की शुरुआत प्रमुख लगती है, पर स्थिर अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: अֲרָם की भौगोलिक पहचान
  choice: अराम
  alternative: सीरिया
  rationale: मूल स्थाननाम को बनाए रखने से बाद की भौगोलिक शब्दावली अनावश्यक रूप से पाठ पर आरोपित नहीं होती।
- issue: שׁפט में ओत्नीएल की भूमिका
  choice: उसने इस्राएल का न्याय किया
  alternative: उसने न्यायी के रूप में इस्राएल का नेतृत्व किया
  rationale: ‘न्याय किया’ मूल क्रिया को सीधे रखता है और न्याय, शासन तथा छुटकारे से जुड़ी व्यापक भूमिका को किसी एक व्याख्या तक सीमित नहीं करता।
