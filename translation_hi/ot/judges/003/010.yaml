    issue: ‘उसके हाथ में कर दिया’ is an awkward Hindi rendering of ‘gave ... into his hand.’
    rationale: Although understandable, this construction is not idiomatic in modern standard Hindi. ‘उसके हाथ में दे दिया’ directly and naturally conveys the Hebrew idiom of handing an enemy over into someone’s power.
  - severity: low
    issue: ‘उसका हाथ ... पर प्रबल हुआ’ is overly literal and somewhat stiff.
    rationale: ‘उसका हाथ ... पर भारी पड़ा’ is a natural Hindi idiom that still retains the source text’s ‘hand’ metaphor and its sense of prevailing.
