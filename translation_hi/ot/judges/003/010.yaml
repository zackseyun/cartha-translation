  terminology: ‘याहवेह,’ ‘आत्मा,’ ‘इस्राएल,’ ‘अराम,’ and ‘कूशन-रिशातैम’ are consistent with the stated source-oriented terminology. ‘याहवेह का आत्मा’ is grammatically acceptable in standard Hindi, where ‘आत्मा’ is conventionally masculine. The footnotes faithfully preserve the static alternative for the opening clause and explain Aram without imposing an identification on the text.
