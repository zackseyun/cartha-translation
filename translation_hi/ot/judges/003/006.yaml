  edition: WLC
  text: וַ/יִּקְח֨וּ אֶת בְּנוֹתֵי/הֶ֤ם לָ/הֶם֙ לְ/נָשִׁ֔ים וְ/אֶת בְּנוֹתֵי/הֶ֖ם נָתְנ֣וּ לִ/בְנֵי/הֶ֑ם וַ/יַּעַבְד֖וּ אֶת אֱלֹהֵי/הֶֽם־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/006.yaml
  text: They took their daughters for themselves as wives[a], and they gave their daughters to their sons, and they served their gods.
translation:
  language: hi
  text: उन्होंने उन जातियों की बेटियों को अपनी पत्नियों के रूप में लिया, और अपनी बेटियों को उनके बेटों को दिया; और उन्होंने उनके देवताओं की सेवा की[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उनके देवताओं की उपासना की।”
    reason: עבד का देवताओं के साथ प्रयोग धार्मिक सेवा के साथ-साथ उपासना का अर्थ भी दे सकता है।
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: उन्होंने ... बनाया
  rationale: לקח का मूल अर्थ ‘लेना’ है, पर विवाह-संदर्भ में ‘पत्नी बनाना’ स्वाभाविक आधुनिक हिन्दी में वैवाहिक अर्थ को स्पष्ट करता है।
- source_word: בְּנוֹתֵיהֶם
  choice: उन जातियों की बेटियों
  rationale: प्रत्यय का संकेत पिछले संदर्भ में उल्लिखित जातियों की ओर है। हिन्दी में सर्वनाम-संदर्भ की उलझन से बचने के लिए संदर्भित समूह को स्पष्ट किया गया है।
- source_word: לָהֶם לְנָשִׁים
  choice: अपने लिए पत्नियाँ
  rationale: यह लाभार्थक ‘अपने लिए’ और वैवाहिक भूमिका ‘पत्नियाँ’—दोनों को बनाए रखता है।
- source_word: וְאֶת־בְּנוֹתֵיהֶם נָתְנוּ לִבְנֵיהֶם
  choice: और अपनी बेटियों को उनके बेटों को दिया
  rationale: पहला प्रत्यय इस्राएलियों और दूसरा उन जातियों की ओर संकेत करता है। ‘अपनी/उनके’ से यह अदला-बदली हिन्दी में स्पष्ट रहती है, जबकि נתן का ‘दिया’ औपचारिक रूप से सुरक्षित है।
- source_word: וַיַּעַבְדוּ
  choice: और उन्होंने ... सेवा की
  rationale: עבד देवताओं के साथ धार्मिक सेवा अथवा उपासना का अर्थ देता है। ‘सेवा की’ मूल क्रिया और धार्मिक निष्ठा की व्यापक छाया बनाए रखता है।
- source_word: אֱלֹהֵיהֶם
  choice: उनके देवताओं
  rationale: बहुवचन रूप आसपास की जातियों के देवताओं को दर्शाता है; यह हिन्दी में स्पष्ट और मानक अभिव्यक्ति है।
theological_decisions:
- issue: पराए देवताओं के प्रति עבד से व्यक्त धार्मिक निष्ठा
  choice: उनके देवताओं की सेवा की
  alternative: उनके देवताओं की उपासना की
  rationale: ‘सेवा की’ इब्रानी क्रिया के व्यापक अर्थ—धार्मिक सेवा और अधीन निष्ठा—को सुरक्षित रखता है; ‘उपासना की’ भी प्रसंगानुकूल है, पर अर्थ को केवल आराधनात्मक कार्यों की ओर अधिक सीमित कर सकती है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण। इब्रानी प्रत्ययों के बदलते संदर्भ को ‘उन जातियों/अपनी/उनके’ द्वारा स्पष्ट किया गया है। अनावश्यक पाद-टिप्पणी नहीं जोड़ी गई।
