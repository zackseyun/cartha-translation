base_translation:
  language: en
  yaml_path: translation/ot/judges/003/022.yaml
  text: The hilt also went in after the blade[a], and the fat closed over the blade, because he did not pull the sword out of his belly[b]; and the dung came out.
translation:
  language: hi
  text: मूठ भी तलवार के फल के पीछे-पीछे भीतर चली गई[a], और चर्बी ने फल को ढक लिया, क्योंकि उसने तलवार उसके पेट से बाहर नहीं खींची थी; और मल बाहर निकल आया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हत्था”; सम्भवतः “डंडा”।
    reason: lexical_alternative
  - marker: b
    text: जिस इब्रानी शब्द का अनुवाद “मल” किया गया है, वह दुर्लभ है और अधिक व्यापक अर्थ में विष्ठा या आँतों की सामग्री को भी दर्शा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנִּצָּב
  choice: मूठ
  rationale: तलवार के संदर्भ में यह उसके पकड़ने वाले भाग को दर्शाता है। ‘मूठ’ स्वाभाविक और सटीक हिन्दी शब्द है।
- source_word: הַלַּהַב
  choice: फल
  rationale: हथियार के संदर्भ में यह तलवार के धारदार धातु-भाग को दर्शाता है; ‘फल’ हिन्दी में तलवार के blade का सटीक शब्द है।
- source_word: וַיִּסְגֹּר ... בְּעַד
  choice: चारों ओर बंद हो गई
  rationale: क्रिया और संबंधबोधक पद मिलकर चर्बी द्वारा फल को घेर लेने का ठोस शारीरिक चित्र प्रस्तुत करते हैं।
- source_word: הַחֵלֶב
  choice: चर्बी
  rationale: यह संज्ञा शरीर की चर्बी को स्पष्ट रूप से दर्शाती है और मूल के चित्रात्मक वर्णन को बनाए रखती है।
- source_word: שָׁלַף
  choice: बाहर खींची
  rationale: शरीर में धँसी तलवार को निकालने के लिए यह स्वाभाविक आधुनिक हिन्दी अभिव्यक्ति है।
- source_word: מִבִּטְנוֹ
  choice: उसके पेट से
  rationale: ‘पेट’ मूल के साधारण, ठोस और गैर-चिकित्सकीय शरीर-संबंधी शब्द के अनुरूप है।
- source_word: הַפַּרְשְׁדֹנָה
  choice: मल
  rationale: यह दुर्लभ शब्द सामान्यतः मल अथवा आँतों से निकले पदार्थ के अर्थ में समझा जाता है। ‘मल’ स्पष्ट, गरिमापूर्ण और आधुनिक हिन्दी में सहज है; अनिश्चितता पादटिप्पणी में रखी गई है।
- source_word: וַיֵּצֵא
  choice: बाहर निकल आया
  rationale: यह निकलने की साधारण कथात्मक क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: גַם
  choice: भी
  rationale: यह जोर देता है कि केवल फल ही नहीं, बल्कि मूठ भी भीतर चली गई।
