base_translation:
  language: en
  yaml_path: translation/ot/judges/003/019.yaml
  text: But he himself turned back from the carved images that were near Gilgal and said[a], “I have a secret message for you, O king.” And he said[c][b], “Silence.” Then all who were standing by him went out from his presence.
translation:
  language: hi
  text: पर वह गिलगाल के पास की तराशी हुई प्रतिमाओं[a][b] से लौट आया और बोला, “हे राजा, मेरे पास आपके लिए एक गुप्त बात[c] है।” राजा ने कहा, “चुप!” तब उसके पास खड़े सभी लोग वहाँ से चले गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “देवमूर्तियों।” इब्रानी शब्द प्रायः उपासना में प्रयुक्त प्रतिमाओं के लिए आता है।
    reason: lexical_alternative
  - marker: b
    text: या “जो गिलगाल में थीं।” इब्रानी स्थानवाचक वाक्यांश संक्षिप्त है और गिलगाल के पास या गिलगाल में होने का संकेत दे सकता है।
    reason: lexical_alternative
  - marker: c
    text: या “एक गुप्त संदेश” अथवा “एक निजी विषय।”
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁב
  choice: लौट आया
  rationale: यह क्रिया वापस आने या मुड़कर लौटने को व्यक्त करती है; प्रसंग में एहूद पहले आगे जा चुका था और फिर राजा के पास लौट आया।
- source_word: הַפְּסִילִים
  choice: खुदी हुई मूर्तियों
  rationale: यह शब्द तराशकर बनाई गई प्रतिमाओं को सूचित करता है और प्रायः उपासना में प्रयुक्त मूर्तियों के लिए आता है। इस अनुवाद में ठोस शब्दार्थ रखा गया है, जबकि ‘मूरतों’ का विकल्प पादटिप्पणी में दिया गया है।
- source_word: אֲשֶׁר אֶת־הַגִּלְגָּל
  choice: गिलगाल के पास की
  rationale: संक्षिप्त इब्रानी स्थानवाचक रचना गिलगाल के संबंध में स्थिति बताती है; ‘के पास’ स्वाभाविक हिंदी है, पर ‘गिलगाल में’ भी संभव है।
- source_word: דְּבַר סֵתֶר
  choice: एक गुप्त बात
  rationale: דבר का अर्थ ‘बात’, ‘वचन’, ‘विषय’ या ‘संदेश’ हो सकता है और סתר गोपनीयता दर्शाता है। ‘गुप्त बात’ हिंदी में स्वाभाविक है और संदेश तथा निजी विषय, दोनों की संभावना खुली रखता है।
- source_word: לִי אֵלֶיךָ
  choice: मेरे पास आपके लिए
  rationale: इब्रानी में प्रथम पुरुष संबंध और राजा की ओर दिशा दोनों हैं; यह हिंदी प्रयोग उस मुहावरे का सहज अर्थ देता है।
- source_word: הַמֶּלֶךְ
  choice: हे राजा
  rationale: यह प्रत्यक्ष संबोधन है; ‘हे राजा’ औपचारिक और गरिमापूर्ण संबोधन को बनाए रखता है।
- source_word: הָס
  choice: चुप!
  rationale: यह मौन रहने का अत्यंत संक्षिप्त आदेश है। ‘चुप!’ उसकी अचानकता और तीखेपन को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: כָּל הָעֹמְדִים עָלָיו
  choice: उसके पास खड़े सभी लोग
  rationale: यह राजा के पास खड़े सेवकों या दरबारियों को सूचित करता है; अनुवाद मूल की दृश्यात्मक भाषा बनाए रखता है।
- source_word: מֵעָלָיו
  choice: उसके सामने से
  rationale: शाब्दिक स्थानवाचक भाव से राजा के निकट या उसकी उपस्थिति से हटना अभिप्रेत है; ‘उसके सामने से’ हिंदी में दरबारी प्रसंग के अनुकूल है।
