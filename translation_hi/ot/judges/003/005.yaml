  yaml_path: translation/ot/judges/003/005.yaml
  text: And the sons of Israel lived among the Canaanites[a], the Hittites, the Amorites, the Perizzites, the Hivites, and the Jebusites.
translation:
  language: hi
  text: और इस्राएल के वंशज[क] कनानियों, हित्तियों, एमोरियों, परिज्जियों, हिव्वियों और यबूसियों के बीच रहते थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: क
    text: इब्रानी में शाब्दिक रूप से, “इस्राएल के पुत्र।” इसे “इस्राएली” भी अनुवाद किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: इस्राएल के वंशज
  rationale: शाब्दिक अर्थ ‘इस्राएल के पुत्र’ है, पर यहाँ यह पूरे इस्राएली समुदाय का प्रचलित वंश-सूचक नाम है। ‘वंशज’ मूल की पारिवारिक धारणा बनाए रखते हुए आधुनिक हिन्दी में स्त्री-पुरुष दोनों को स्वाभाविक रूप से समेटता है।
- source_word: יָשְׁבוּ
  choice: रहने लगे
  rationale: क्रिया का अर्थ बैठना, बसना या रहना हो सकता है। इस प्रसंग में लोगों के बीच निवास करना अभिप्रेत है; हिन्दी में ‘रहने लगे’ कथानक की स्वाभाविक गति व्यक्त करता है, यद्यपि ‘रहते थे’ भी सम्भव है।
- source_word: בְּקֶרֶב
  choice: के बीच
  rationale: इस पदबंध का अर्थ किसी समूह के मध्य अथवा उनके बीच होना है। ‘के बीच’ वर्तमान हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: הַכְּנַעֲנִי
  choice: कनानियों
  rationale: इब्रानी में रूप एकवचन है, पर जाति का सामूहिक बोध कराता है; हिन्दी में बहुवचन जातिनाम अधिक स्वाभाविक है।
- source_word: הַחִתִּי
  choice: हित्तियों
  rationale: सामूहिक एकवचन जातिनाम को हिन्दी में बहुवचन रूप दिया गया है।
- source_word: הָאֱמֹרִי
  choice: एमोरियों
  rationale: सामूहिक जातिनाम का हिन्दी में प्रचलित बहुवचन रूप प्रयुक्त है।
- source_word: הַפְּרִזִּי
  choice: परिज्जियों
  rationale: सामूहिक जातिनाम को हिन्दी की ध्वनि और बहुवचन-रचना के अनुरूप प्रस्तुत किया गया है।
- source_word: הַחִוִּי
  choice: हिव्वियों
  rationale: सामूहिक जातिनाम को हिन्दी में बहुवचन रूप दिया गया है।
- source_word: הַיְבוּסִי
  choice: यबूसियों
  rationale: सामूहिक जातिनाम को हिन्दी में बहुवचन रूप दिया गया है।
