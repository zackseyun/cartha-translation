    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: भेंट किया
  rationale: हिफ़ील रूप यहाँ किसी वरिष्ठ शासक के सामने वस्तु प्रस्तुत करने का भाव देता है; ‘भेंट किया’ राजदरबार के प्रसंग में स्वाभाविक है।
- source_word: הַמִּנְחָה
  choice: कर
  rationale: न्यायियों 3 के राजनीतिक अधीनता वाले प्रसंग में यह शब्द विजेता शासक को चुकाए जाने वाले कर को सूचित करता है, यद्यपि सामान्यतः इसका अर्थ भेंट या अर्पण भी हो सकता है।
- source_word: לְעֶגְלוֹן מֶלֶךְ מוֹאָב
  choice: मोआब के राजा एग्लोन को
  rationale: हिन्दी में स्वाभाविक पदक्रम रखते हुए व्यक्ति, पदवी और प्राप्तकर्ता का संबंध स्पष्ट किया गया है।
- source_word: וְעֶגְלוֹן
  choice: एग्लोन
  rationale: इब्रानी वाव यहाँ वर्णनात्मक टिप्पणी आरम्भ करता है; हिन्दी में नया वाक्य बनाकर इसका प्रवचनात्मक कार्य स्वाभाविक रूप से व्यक्त होता है।
- source_word: אִישׁ
  choice: आदमी
  rationale: यह पुल्लिंग एकवचन शब्द विशेष रूप से एग्लोन के लिए प्रयुक्त है।
- source_word: בָּרִיא
  choice: मोटा
  rationale: इस प्रसंग में शब्द शारीरिक मोटापे को सीधे व्यक्त करता है, जो आगे के कथानक के लिए भी महत्त्वपूर्ण है।
- source_word: מְאֹד
  choice: बहुत
  rationale: यह सामान्य तीव्रतासूचक क्रियाविशेषण है; ‘बहुत’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
