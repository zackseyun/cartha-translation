source:
  edition: WLC
  text: וַ/יַּעֲשׂ֨וּ בְנֵי יִשְׂרָאֵ֤ל אֶת הָ/רַע֙ בְּ/עֵינֵ֣י יְהוָ֔ה וַֽ/יִּשְׁכְּח֖וּ אֶת יְהוָ֣ה אֱלֹֽהֵי/הֶ֑ם וַ/יַּעַבְד֥וּ אֶת הַ/בְּעָלִ֖ים וְ/אֶת הָ/אֲשֵׁרֽוֹת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/007.yaml
  text: And the sons of Israel did what was evil in the eyes of Yahweh[c][b][a], and they forgot Yahweh their God and served the Baals and the Asherahs.
translation:
  language: hi
  text: इस्राएलियों[a] ने वह किया जो याहवे की दृष्टि में बुरा था[b]। वे अपने परमेश्वर याहवे को भूल गए और बाल-देवताओं तथा अशेराओं[c] की सेवा की।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “इस्राएल के पुत्रों ने।” यह इब्रानी मुहावरा सामूहिक रूप से इस्राएलियों को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में, “याहवे की दृष्टि में बुरा।” यह उस काम के लिए प्रचलित अभिव्यक्ति है जिसे याहवे ने बुरा ठहराया।
    reason: lexical_alternative
  - marker: c
    text: इसका अनुवाद “अशेरा-स्तंभों” भी हो सकता है। इब्रानी शब्द अशेरा से जुड़ी पूजा-वस्तुओं या, अधिक व्यापक रूप से, अशेरा की उपासना की ओर संकेत कर सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: בְנֵי יִשְׂרָאֵל
  choice: इस्राएलियों
  rationale: शाब्दिक रूप ‘इस्राएल के पुत्र’ है, पर आधुनिक हिन्दी में पूरे समुदाय के लिए ‘इस्राएली’ अधिक स्वाभाविक और स्पष्ट है; शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: הָרַע בְּעֵינֵי יְהוָה
  choice: जो याहवे की दृष्टि में बुरा था
  rationale: यह इब्रानी का प्रचलित मूल्यांकन-सूत्र है। ‘दृष्टि में’ मूल मुहावरे को बनाए रखता है और स्पष्ट करता है कि यह याहवे का नैतिक निर्णय है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय आधुनिक हिन्दी में उसके प्रचलित लिप्यंतरण से प्रस्तुत किया गया है।
- source_word: וַיִּשְׁכְּחוּ
  choice: भूल गए
  rationale: मूल क्रिया का सीधा अर्थ ‘भूलना’ है। प्रसंग में निष्ठा छोड़ने का भाव निहित हो सकता है, पर उसे मुख्य पाठ में अधिक स्पष्ट करके अर्थ को सीमित नहीं किया गया।
- source_word: אֱלֹהֵיהֶם
  choice: अपने परमेश्वर
  rationale: सर्वनाम-संबंध को स्वाभाविक हिन्दी में ‘अपने’ से व्यक्त किया गया है; याहवे इसका एकवचन संदर्भ है।
- source_word: וַיַּעַבְדוּ
  choice: सेवा करने लगे
  rationale: עבד धार्मिक प्रसंग में सेवा और उपासना दोनों का बोध करा सकता है। ‘सेवा’ इस व्यापकता को बनाए रखता है।
- source_word: הַבְּעָלִים
  choice: बाल-देवताओं
  rationale: बहुवचन को हिन्दी में स्पष्ट रखा गया है। केवल ‘बालों’ कहने से आधुनिक हिन्दी में अनचाहा अर्थ-संदेह पैदा होता; ‘देवताओं’ से यहाँ उपास्य सत्ताओं का संदर्भ स्पष्ट होता है।
- source_word: הָאֲשֵׁרוֹת
  choice: अशेराओं
  rationale: लिप्यंतरित बहुवचन इस संभावना को खुला रखता है कि शब्द अशेरा से जुड़े स्थानीय रूपों अथवा पूजा-वस्तुओं की ओर संकेत करता है; संकीर्ण अर्थ पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम का प्रयोग करता है। ‘याहवे’ नाम को सुरक्षित रखता है, जबकि ‘प्रभु’ उसे उपाधि से बदल देता और ‘यहोवा’ भिन्न पारंपरिक स्वरूप है।
- issue: הָאֲשֵׁרוֹת से देवी, स्थानीय रूपों या पूजा-वस्तुओं में से किसका बोध है
  choice: अशेराओं
  alternative: अशेरा-स्तंभ; अशेरा की पूजा-वस्तुएँ
  rationale: इब्रानी बहुवचन का सटीक संकेत विवादित है। मुख्य पाठ में लिप्यंतरण वास्तविक अस्पष्टता को बनाए रखता है और पादटिप्पणी सामान्य वैकल्पिक अर्थ बताती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। ‘इस्राएलियों’ और ‘दृष्टि में’ सहज हिन्दी देते हैं, जबकि ‘याहवे,’ ‘बाल-देवताओं’ और ‘अशेराओं’ से मूल के नाम और बहुवचन सुरक्षित रहते हैं।
