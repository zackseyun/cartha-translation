  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יִּֽחַר אַ֤ף יְהוָה֙ בְּ/יִשְׂרָאֵ֔ל וַֽ/יִּמְכְּרֵ֗/ם בְּ/יַד֙ כּוּשַׁ֣ן רִשְׁעָתַ֔יִם מֶ֖לֶךְ אֲרַ֣ם נַהֲרָ֑יִם וַ/יַּעַבְד֧וּ בְנֵֽי יִשְׂרָאֵ֛ל אֶת כּוּשַׁ֥ן רִשְׁעָתַ֖יִם שְׁמֹנֶ֥ה שָׁנִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/008.yaml
  text: So the anger of Yahweh burned against Israel[a], and he sold them into the hand of Cushan-rishathaim king of Aram-naharaim[b]. And the sons of Israel served Cushan-rishathaim eight years.
translation:
  language: hi
  text: तब इस्राएल पर याहवे का क्रोध भड़क उठा, और उसने उन्हें अराम-नहरैम[a] के राजा कूशन-रिशातैम के हाथ बेच दिया। इस्राएलियों[b] ने आठ वर्ष तक कूशन-रिशातैम की सेवा की।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “अराम-नहरैम” का अर्थ परंपरागत रूप से “दो नदियों का अराम” समझा जाता है; इसे “मेसोपोटामिया” भी कहा जाता है।
    reason: स्थाननाम का पारंपरिक अर्थ और प्रचलित वैकल्पिक नाम बताने के लिए।
  - marker: b
    text: शाब्दिक हिब्रू अभिव्यक्ति है, “इस्राएल के पुत्र।”
    reason: मूल सामुदायिक पद का शाब्दिक रूप सुरक्षित रखने के लिए।
lexical_decisions:
- source_word: וַיִּחַר אַף
  choice: क्रोध भड़क उठा
  rationale: हिब्रू मुहावरे में क्रोध के जलने की छवि है। “भड़क उठा” उस छवि को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इसे उपाधि से बदलने के बजाय परमेश्वर के व्यक्तिगत नाम के रूप में लिप्यंतरित किया गया है।
- source_word: וַיִּמְכְּרֵם בְּיַד
  choice: उन्हें ... के हाथ बेच दिया
  rationale: “बेचना” और “हाथ” दोनों मूल पाठ की न्याय तथा अधीनता संबंधी सशक्त रूपकात्मक भाषा को सुरक्षित रखते हैं।
- source_word: כּוּשַׁן רִשְׁעָתַיִם
  choice: कूशन-रिशातैम
  rationale: व्यक्तिनाम को अनुवादित करने के बजाय हिन्दी ध्वनियों में लिप्यंतरित किया गया है; योजक-चिह्न इसे एक संयुक्त नाम के रूप में स्पष्ट करता है।
- source_word: אֲרַם נַהֲרָיִם
  choice: अराम-नहरैम
  rationale: स्थाननाम के हिब्रू रूप को मुख्य पाठ में सुरक्षित रखा गया है; उसका पारंपरिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: וַיַּעַבְדוּ
  choice: सेवा की
  rationale: क्रिया का सीधा अर्थ “सेवा करना” है; इस प्रसंग में यह राजनीतिक अधीनता और बाध्य सेवा को सूचित करती है, पर मुख्य पाठ उससे अधिक व्याख्या नहीं जोड़ता।
- source_word: בְנֵי יִשְׂרָאֵל
  choice: इस्राएली
  rationale: यह स्थिर हिब्रू सामुदायिक पद शाब्दिक रूप से “इस्राएल के पुत्र” है, पर आधुनिक हिन्दी में पूरे इस्राएली समुदाय के लिए “इस्राएली” अधिक स्वाभाविक और अर्थ-सटीक है; शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
- source_word: שְׁמֹנֶה שָׁנִים
  choice: आठ वर्ष तक
  rationale: समयावधि को स्वाभाविक हिन्दी में सीधे व्यक्त किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम है; “याहवे” उसे उपाधि में बदले बिना प्रस्तुत करता है।
- issue: בְנֵי יִשְׂרָאֵל का सामुदायिक अर्थ
  choice: इस्राएली
  alternative: इस्राएल के पुत्र
  rationale: यहाँ अभिव्यक्ति पूरे वाचा-समुदाय का पारंपरिक नाम है। “इस्राएली” आधुनिक हिन्दी में उसी सामूहिक अर्थ को स्पष्ट करता है और अनावश्यक रूप से केवल पुरुषों तक अर्थ सीमित नहीं करता; शाब्दिक रूप पादटिप्पणी में दिया गया है।
- issue: परमेश्वर द्वारा इस्राएल को “बेचना”
  choice: बेच दिया
  alternative: सौंप दिया
  rationale: “बेच दिया” न्याय और अधीनता के मूल रूपक को बनाए रखता है तथा पाठ में निहित कठोर धार्मिक तनाव को नरम नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। हिब्रू की “क्रोध भड़कने,” “बेचने” और “हाथ” की छवियाँ सुरक्षित हैं। व्यक्तिनाम और स्थाननाम लिप्यंतरित किए गए हैं।
