base_translation:
  language: en
  yaml_path: translation/ot/judges/003/016.yaml
  text: Ehud made himself a sword with two edges[a], a cubit in length[b], and strapped it on under his clothes on his right thigh.
translation:
  language: hi
  text: एहूद ने अपने लिए एक तलवार बनाई। उसकी दोनों ओर धार थी[a] और उसकी लंबाई एक गोमेद थी[b]। उसने उसे अपने कपड़ों के नीचे अपनी दाहिनी जाँघ पर बाँध लिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उसके दो मुँह थे”; यह दोनों ओर धार वाली तलवार के लिए इब्रानी अभिव्यक्ति है।
    reason: lexical_alternative
  - marker: b
    text: मूल इब्रानी में माप ‘गोमेद’ है। यह शब्द बहुत दुर्लभ है और इसकी ठीक लंबाई निश्चित नहीं है; सामान्यतः इसे लगभग एक हाथ या अग्रबाहु जितना माना जाता है।
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַשׂ לוֹ
  choice: अपने लिए ... बनाई
  rationale: לּוֹ से स्पष्ट है कि एहूद ने तलवार अपने उपयोग के लिए बनाई; यह हिन्दी में स्वाभाविक रूप से उद्देश्य और आत्म-संबंध दोनों व्यक्त करता है।
- source_word: חֶרֶב
  choice: तलवार
  rationale: यह इस सामान्य इब्रानी संज्ञा का सीधा अर्थ है। संदर्भ में हथियार छोटा हो सकता है, पर ‘कटार’ कहना मूल से अधिक विशिष्ट होता।
- source_word: וְלָהּ שְׁנֵי פֵיוֹת
  choice: उसकी दोनों ओर धार थी
  rationale: शाब्दिक रूप से ‘उसके दो मुँह थे’; हथियार के संदर्भ में यह दोनों ओर धार होने का इब्रानी मुहावरा है। चुना हुआ रूप हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: גֹּמֶד אָרְכָּהּ
  choice: वह एक हाथ लंबी थी
  rationale: גֹּמֶד एक दुर्लभ और अनिश्चित लंबाई-माप है, जिसे सामान्यतः लगभग एक हाथ अथवा अग्रबाहु की लंबाई माना जाता है। पाठ में परिचित हिन्दी माप रखा गया है और अनिश्चितता पादटिप्पणी में बताई गई है।
- source_word: וַיַּחְגֹּר אוֹתָהּ
  choice: उसे ... बाँध लिया
  rationale: חגר का अर्थ कमर या शरीर पर किसी वस्तु को बाँधना अथवा कसना है; हथियार को जाँघ पर लगाने के लिए यह सहज आधुनिक हिन्दी है।
- source_word: מִתַּחַת לְמַדָּיו
  choice: अपने कपड़ों के नीचे
  rationale: מַד यहाँ वस्त्रों को दर्शाता है। ‘कपड़ों’ से किसी विशेष प्रकार के परिधान का अनावश्यक अनुमान लगाए बिना अर्थ स्पष्ट रहता है।
- source_word: עַל יֶרֶךְ יְמִינוֹ
  choice: अपनी दाहिनी जाँघ पर
  rationale: יָרֵךְ जाँघ अथवा कूल्हे के क्षेत्र को दर्शाता है; यहाँ हथियार बाँधने की जगह के लिए ‘दाहिनी जाँघ पर’ सबसे सीधा अनुवाद है।
