translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक रखी गई है। ‘भेंट’ को दोनों स्थानों पर दोहराकर मूल की पुनरावृत्ति सुरक्षित रखी गई है; ‘कर’ को मुख्य पाठ में जोड़ने के बजाय संदर्भगत अर्थ पादटिप्पणी में दिया गया है।
