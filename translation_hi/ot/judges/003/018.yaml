  yaml_path: translation/ot/judges/003/018.yaml
  text: And when he had finished presenting the tribute[a], he sent away the people who were carrying the tribute.
translation:
  language: hi
  text: जब वह भेंट[a] प्रस्तुत कर चुका था, तब उसने भेंट ले जाने वाले लोगों को विदा कर दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “नज़राना” अथवा “अर्पण।” यहाँ इब्रानी शब्द का आशय संभवतः बलिदानी अर्पण के बजाय किसी शासक को दी जाने वाली कर-भेंट से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: जब
  rationale: इब्रानी कथात्मक सूत्र यहाँ अगली घटना का समय बताता है। आधुनिक हिन्दी में केवल ‘जब’ स्वाभाविक ढंग से वही संबंध व्यक्त करता है।
- source_word: כִּלָּה
  choice: चढ़ा चुका
  rationale: क्रिया कार्य की पूर्णता बताती है; ‘चुका’ यह स्पष्ट करता है कि लोगों को विदा करने से पहले भेंट प्रस्तुत करने का काम पूरा हो गया था।
- source_word: לְהַקְרִיב
  choice: चढ़ा
  rationale: हिफ़ील रूप का अर्थ किसी वस्तु को निकट लाना या प्रस्तुत करना है। ‘भेंट चढ़ाना’ हिन्दी में शासक को आदरपूर्वक भेंट प्रस्तुत करने के लिए स्वाभाविक है, यद्यपि इसका बलिदानी अर्थ भी हो सकता है; संदर्भ राजनीतिक है।
- source_word: הַמִּנְחָה
  choice: भेंट
  rationale: מִנְחָה उपहार, अर्पण अथवा अधीन शासक द्वारा दी गई कर-भेंट को सूचित कर सकता है। ‘भेंट’ अर्थ की व्यापकता और मूल की कुछ अस्पष्टता बनाए रखता है; पादटिप्पणी राजनीतिक संदर्भ स्पष्ट करती है।
- source_word: וַיְשַׁלַּח
  choice: विदा कर दिया
  rationale: यहाँ क्रिया का अर्थ साथ आए लोगों को वापस भेज देना है। ‘विदा कर दिया’ आधुनिक हिन्दी में सहज है।
- source_word: הָעָם
  choice: लोगों
  rationale: मूल शब्द सामान्यतः ‘लोग’ है और लिंग निर्दिष्ट नहीं करता; इसलिए ‘पुरुषों’ जैसा अनावश्यक विशेषीकरण नहीं किया गया।
- source_word: נֹשְׂאֵי הַמִּנְחָה
  choice: भेंट उठाकर लानेवाले
  rationale: सहभागी कृदंत उन लोगों को भेंट ढोनेवालों के रूप में पहचानता है। ‘उठाकर लानेवाले’ उनके वहन और पहुँचाने, दोनों की भूमिका को स्वाभाविक हिन्दी में व्यक्त करता है।
