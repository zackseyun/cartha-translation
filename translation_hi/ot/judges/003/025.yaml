  text: וַ/יָּחִ֣ילוּ עַד בּ֔וֹשׁ וְ/הְנֵּ֛ה אֵינֶ֥/נּוּ פֹתֵ֖חַ דַּלְת֣וֹת הָֽ/עֲלִיָּ֑ה וַ/יִּקְח֤וּ אֶת הַ/מַּפְתֵּ֨חַ֙ וַ/יִּפְתָּ֔חוּ וְ/הִנֵּה֙ אֲדֹ֣נֵי/הֶ֔ם נֹפֵ֥ל אַ֖רְצָ/ה מֵֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/025.yaml
  text: And they waited until they were embarrassed[a], and behold, he still was not opening the doors of the upper room. So they took the key and opened them, and behold, their master had fallen to the floor[c][b], dead.
translation:
  language: hi
  text: वे तब तक प्रतीक्षा करते रहे, जब तक उन्हें संकोच होने लगा[a]। और देखो, वह अब तक ऊपर के कमरे[b] के किवाड़ नहीं खोल रहा था। तब उन्होंने चाबी ली और किवाड़ खोल दिए। और देखो, उनका स्वामी[c] फर्श पर गिरा हुआ, मरा पड़ा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जब तक उन्हें लज्जा आने लगी।” इब्रानी अभिव्यक्ति लज्जा या सामाजिक संकोच, दोनों का भाव दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: या, “ऊपरी कक्ष” अथवा “ऊपर का कमरा।”
    reason: lexical_alternative
  - marker: c
    text: या, “उनका प्रभु।” यहाँ यह शब्द उनके मानवीय अधिकारी एग्लोन के लिए प्रयुक्त हुआ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּחִילוּ
  choice: प्रतीक्षा करते रहे
  rationale: यह क्रिया सेवकों के लगातार प्रतीक्षा करते रहने को व्यक्त करती है; हिन्दी में यह स्वाभाविक रूप से जारी क्रिया का भाव देती है।
- source_word: עַד בּוֹשׁ
  choice: जब तक उन्हें संकोच होने लगा
  rationale: यह पद लज्जा या सामाजिक असहजता की सीमा तक प्रतीक्षा करने का भाव दे सकता है। प्रसंग में ‘संकोच’ सेवकों की बढ़ती झिझक को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: וְהִנֵּה
  choice: और देखो
  rationale: दोनों स्थानों पर यह अभिव्यक्ति कथा में अचानक सामने आए दृश्य की ओर ध्यान खींचती है।
- source_word: אֵינֶנּוּ פֹתֵחַ
  choice: नहीं खोल रहा था
  rationale: निषेध के साथ कृदंत उस समय जारी गैर-क्रिया को दर्शाता है; यह हिन्दी रूप उस अपूर्ण पक्ष को बनाए रखता है।
- source_word: דַּלְתוֹת הָעֲלִיָּה
  choice: ऊपर के कमरे के किवाड़
  rationale: עֲלִיָּה भवन के ऊपरी भाग में स्थित कमरे को दर्शाता है और דַּלְתוֹת का बहुवचन ‘किवाड़’ से सुरक्षित रहता है।
- source_word: הַמַּפְתֵּחַ
  choice: चाबी
  rationale: आधुनिक मानक हिन्दी में इसका सीधा और स्वाभाविक अर्थ।
- source_word: אֲדֹנֵיהֶם
  choice: उनका स्वामी
  rationale: यहाँ शब्द सेवकों के मानवीय अधिपति एग्लोन के लिए है; ‘स्वामी’ सामाजिक संबंध को व्यक्त करता है और दिव्य उपाधि से अनावश्यक भ्रम नहीं पैदा करता।
- source_word: נֹפֵל אַרְצָה מֵת
  choice: भूमि पर गिरा हुआ मृत पड़ा था
  rationale: यह अनुवाद खोजे गए परिणामी दृश्य—नीचे गिरा पड़ा और मृत—को बनाए रखता है। ‘भूमि पर’ אַרְצָה का निकट अर्थ है, यद्यपि कमरे के भीतर ‘फर्श पर’ भी प्रसंगानुकूल समझा जा सकता है।
theological_decisions:
- issue: אֲדֹנֵיהֶם में मानवीय अधिकार-सूचक संबोधन
  choice: उनका स्वामी
  alternative: उनका प्रभु
  rationale: प्रसंग में एग्लोन अपने सेवकों का मानवीय स्वामी है। ‘प्रभु’ से ईश्वरीय उपाधि का भ्रम हो सकता है, इसलिए ‘स्वामी’ चुना गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक रखी गई है। ‘और देखो’ की पुनरावृत्ति मूल इब्रानी के दोनों दृश्यात्मक मोड़ों को सुरक्षित रखती है; ‘किवाड़’ बहुवचन और प्राचीन भवन-संदर्भ दोनों के अनुकूल है।
