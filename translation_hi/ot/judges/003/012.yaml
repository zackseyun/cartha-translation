source:
  edition: WLC
  text: וַ/יֹּסִ֨פוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל לַ/עֲשׂ֥וֹת הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה וַ/יְחַזֵּ֨ק יְהוָ֜ה אֶת עֶגְל֤וֹן מֶֽלֶךְ מוֹאָב֙ עַל יִשְׂרָאֵ֔ל עַ֛ל כִּֽי עָשׂ֥וּ אֶת הָ/רַ֖ע בְּ/עֵינֵ֥י יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/012.yaml
  text: And the sons of Israel again did what was evil in the eyes of Yahweh[a], and Yahweh strengthened Eglon king of Moab against Israel, because they had done what was evil in the eyes of Yahweh.
translation:
  language: hi
  text: इस्राएलियों[a] ने फिर याहवे की दृष्टि में बुरा किया। और याहवे ने मोआब के राजा एग्लोन को इस्राएल के विरुद्ध बलवान किया, क्योंकि उन्होंने याहवे की दृष्टि में बुरा किया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “इस्राएल के पुत्र”; अर्थात इस्राएली।
    reason: मूल इब्रानी की पारिवारिक अभिव्यक्ति और उसके सामूहिक अर्थ, दोनों को दिखाने के लिए।
lexical_decisions:
- source_word: וַיֹּסִפוּ ... לַעֲשׂוֹת
  choice: फिर ... किया
  rationale: यह इब्रानी मुहावरा किसी काम को दोबारा करने या जारी रखने का अर्थ दे सकता है। न्यायियों के आवर्ती कथानक में “फिर” पुनरावृत्ति को स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएली
  rationale: शाब्दिक रूप “इस्राएल के पुत्र” है, पर यहाँ यह पूरे इस्राएली समुदाय के लिए प्रचलित सामूहिक पद है। आधुनिक हिन्दी में “इस्राएली” स्वाभाविक है; शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: לַעֲשׂוֹת הָרַע
  choice: वही किया जो ... बुरा था
  rationale: यह रूप इब्रानी के निश्चित पद הָרַע और मूल्यांकनात्मक वाक्यांश को सहज हिन्दी में व्यक्त करता है, बिना बुराई की प्रकृति को अतिरिक्त रूप से परिभाषित किए।
- source_word: בְּעֵינֵי יְהוָה
  choice: याहवे की दृष्टि में
  rationale: “आँखों में” का शाब्दिक बिंब हिन्दी में अस्वाभाविक हो सकता है; “दृष्टि में” उसी मूल्यांकनात्मक मुहावरे और उसके अर्थ को सुरक्षित रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार अक्षरों वाले व्यक्तिगत दिव्य नाम को किसी उपाधि से बदलने के बजाय देवनागरी में “याहवे” रूप में प्रस्तुत किया गया है।
- source_word: וַיְחַזֵּק
  choice: बलवान किया
  rationale: पिएल रूप सक्रिय रूप से शक्तिशाली बनाने का अर्थ देता है। “बलवान किया” परमेश्वर की प्रत्यक्ष कर्तृता को बनाए रखता है और उसे केवल अनुमति देने के अर्थ में नरम नहीं करता।
- source_word: עַל יִשְׂרָאֵל
  choice: इस्राएल के विरुद्ध
  rationale: इस शत्रुतापूर्ण प्रसंग में עַל विरोध का संकेत देता है; इसलिए “के विरुद्ध” उपयुक्त है।
- source_word: עַל כִּי
  choice: क्योंकि
  rationale: यह संयुक्त पद याहवे की कार्रवाई का कारण प्रस्तुत करता है; “क्योंकि” आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत दिव्य नाम सीधे प्रयुक्त है। उसका लिप्यंतरण नाम और उपाधि के बीच के भेद को बनाए रखता है।
- issue: וַיְחַזֵּק יְהוָה אֶת עֶגְלוֹן में परमेश्वर की कर्तृता
  choice: याहवे ने ... एग्लोन को ... बलवान किया
  alternative: याहवे ने एग्लोन को बलवान होने दिया
  rationale: इब्रानी क्रिया याहवे को सक्रिय कर्ता बताती है। अनुवाद इस कठिन धर्मवैज्ञानिक तनाव को केवल दैवी अनुमति बनाकर हल नहीं करता।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। “इस्राएली” सामान्य पाठक के लिए स्वाभाविक है; “याहवे की दृष्टि में” मूल मुहावरे का अर्थ बनाए रखता है। दोनों समान दोष-वाक्यों में जानबूझकर लगभग एक जैसी शब्दावली रखी गई है, और “बलवान किया” दैवी कर्तृता को अस्पष्ट नहीं करता।
