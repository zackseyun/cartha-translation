revisions:
- from: परन्तु जब तक वे देर करते रहे, तब तक एहूद बच निकला। वह खुदी हुई मूर्तियों[a] के आगे निकल गया और भागकर सईरा पहुँच गया।
  to: परन्तु जब वे देर कर रहे थे, तब एहूद बच निकला; वह उन तराशी हुई प्रतिमाओं[a] के पास से आगे निकल गया और बचकर सईरा पहुँचा।
  rationale: The revision expresses the Hebrew temporal relation as contemporaneous delay, retains the repeated escape motif, and uses idiomatic Hindi for passing beyond the carved images. The footnote remains anchored to the relevant noun and offers lexical alternatives without overdetermining the objects’ cultic function.
