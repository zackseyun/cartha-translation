base_translation:
  language: en
  yaml_path: translation/ot/judges/003/026.yaml
  text: But Ehud escaped while they delayed[b][a], and he passed beyond the carved images and escaped to Seirah.
translation:
  language: hi
  text: परन्तु जब वे देर कर रहे थे, तब एहूद बच निकला; वह उन तराशी हुई प्रतिमाओं[a] के पास से आगे निकल गया और बचकर सईरा पहुँचा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘मूर्तियाँ’ अथवा ‘खोदी हुई प्रतिमाएँ’।
    reason: lexical_alternative
lexical_decisions:
- source_word: נִמְלַט / וַיִּמָּלֵט
  choice: बच निकला / भागकर ... पहुँच गया
  rationale: दोनों निफ़अल रूप सफलतापूर्वक बच निकलने को व्यक्त करते हैं। हिन्दी में एक ही क्रिया को अस्वाभाविक ढंग से दोहराने के बजाय पहले स्थान पर ‘बच निकला’ और दूसरे पर ‘भागकर ... पहुँच गया’ घटनाक्रम और अंतिम सुरक्षित पहुँच दोनों को स्पष्ट करते हैं।
- source_word: עַד הִתְמַהְמְהָם
  choice: जब तक वे देर करते रहे, तब तक
  rationale: 'עַד और हित्पएल रूप का समय-संबंध सुरक्षित रखा गया है: सेवकों के देर करते रहने की अवधि में एहूद निकल भागा। यह मूल के ‘जब तक’ अर्थ को ‘जबकि’ में समतल नहीं करता।'
- source_word: עָבַר אֶת הַפְּסִילִים
  choice: खुदी हुई मूर्तियों के आगे निकल गया
  rationale: עָבַר यहाँ किसी पहचाने हुए स्थल-चिह्न से आगे जाने को दर्शाता है। ‘आगे निकल गया’ गति और सीमा पार कर लेने, दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הַפְּסִילִים
  choice: खुदी हुई मूर्तियाँ
  rationale: פְּסִילִים तराशी या खोदी हुई प्रतिमाओं को दर्शाता है। ‘मूर्तियाँ’ cultic अर्थ की संभावना रखता है, जबकि ‘खुदी हुई’ शब्द की भौतिक व्युत्पत्ति को भी सामने रखता है; वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: הַשְּׂעִירָתָה
  choice: सईरा पहुँच गया
  rationale: दिशासूचक ה को हिन्दी में ‘पहुँच गया’ से व्यक्त किया गया है। स्थान-नाम को आधुनिक हिन्दी में पठनीय रूप ‘सईरा’ में लिप्यंतरित किया गया है।
- source_word: וְ
  choice: परन्तु
  rationale: पिछले दृश्य में सेवकों के प्रतीक्षा करते रहने और एहूद के निकल भागने के बीच कथात्मक विरोध को स्वाभाविक हिन्दी में प्रकट करता है।
