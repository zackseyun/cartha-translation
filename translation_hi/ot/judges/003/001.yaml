source:
  edition: WLC
  text: וְ/אֵ֤לֶּה הַ/גּוֹיִם֙ אֲשֶׁ֣ר הִנִּ֣יחַ יְהוָ֔ה לְ/נַסּ֥וֹת בָּ֖/ם אֶת יִשְׂרָאֵ֑ל אֵ֚ת כָּל אֲשֶׁ֣ר לֹֽא יָדְע֔וּ אֵ֖ת כָּל מִלְחֲמ֥וֹת כְּנָֽעַן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/001.yaml
  text: 'These are the nations that Yahweh left to test Israel by them[a], that is, all who had not known any of the wars of Canaan:'
translation:
  language: hi
  text: 'ये वे जातियाँ हैं जिन्हें याहवे ने उनके द्वारा इस्राएल को परखने के लिए रहने दिया था—अर्थात् इस्राएल के वे सभी लोग जिन्होंने कनान के किसी भी युद्ध का अनुभव नहीं किया था:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: ये वे ... हैं
  rationale: यह अभिव्यक्ति पिछले वर्णन से संबंध रखते हुए एक नई सूची आरम्भ करती है। हिन्दी में अलग कालवाचक शब्द जोड़े बिना यह स्वाभाविक परिचय है।
- source_word: הַגּוֹיִם
  choice: जातियाँ
  rationale: यहाँ अलग-अलग जातीय-राजनीतिक समुदाय अभिप्रेत हैं; न्यायियों के प्रसंग में ‘जातियाँ’ स्पष्ट और प्रचलित है।
- source_word: הִנִּיחַ
  choice: रहने दिया था
  rationale: हिफ़ील रूप का अर्थ यहाँ किसी को शेष रहने देना है। केवल ‘छोड़ दिया’ हिन्दी में त्याग देने का भ्रामक भाव दे सकता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित नामरूप ‘यहोवा’ रखा गया है।
- source_word: לְנַסּוֹת
  choice: परखने के लिए
  rationale: נסה का आशय जाँचने या परखने से है; ‘परखना’ प्रलोभन का अनावश्यक नकारात्मक अर्थ नहीं जोड़ता।
- source_word: בָּם
  choice: उनके द्वारा
  rationale: प्रत्यययुक्त पूर्वसर्ग उन जातियों को इस्राएल की परख का माध्यम बताता है।
- source_word: אֶת יִשְׂרָאֵל
  choice: इस्राएल को
  rationale: सीधा कर्म सूचक चिह्न और व्यक्तिवाचक नाम का सहज हिन्दी रूप।
- source_word: אֵת כָּל אֲשֶׁר לֹא יָדְעוּ
  choice: इस्राएल के वे सभी लोग जिन्होंने ... अनुभव नहीं किया था
  rationale: यह पदबंध इस्राएल की उस पीढ़ी को स्पष्ट करता है जो पहले के युद्धों से अपरिचित थी। ‘इस्राएल के’ जोड़ने से हिन्दी में संबंध स्पष्ट होता है, पर नया आशय नहीं जुड़ता।
- source_word: יָדְעוּ
  choice: अनुभव किया था
  rationale: ידע यहाँ युद्धों की जानकारी मात्र नहीं, बल्कि उनसे प्रत्यक्ष परिचय या अनुभव को दर्शाता है। हिन्दी में ‘युद्ध को जानना’ अस्वाभाविक और अस्पष्ट होता।
- source_word: אֵת כָּל מִלְחֲמוֹת כְּנָעַן
  choice: कनान के किसी युद्ध का
  rationale: शाब्दिक रूप ‘कनान के सभी युद्ध’ है, पर निषेध के अंतर्गत हिन्दी में ‘किसी युद्ध का अनुभव नहीं’ वही समष्टिगत अर्थ स्वाभाविक ढंग से व्यक्त करता है। ‘कनान के युद्ध’ मूल संबंध की सम्भावित व्यापकता बनाए रखता है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत नाम है। हिन्दी पाठकों के लिए प्रतिष्ठित और पहचाना हुआ लिप्यंतरण ‘यहोवा’ उपाधि के स्थान पर उसी नाम को बनाए रखता है।
- issue: परमेश्वर द्वारा इस्राएल की परख
  choice: उनके द्वारा इस्राएल को परखने के लिए
  alternative: उनके माध्यम से इस्राएल की परीक्षा लेने के लिए
  rationale: पाठ इन जातियों के रहने और इस्राएल की परख के बीच उद्देश्य-संबंध बताता है। अनुवाद इस धर्मवैचारिक तनाव को न तो नरम करता है, न उसका कारण पाठ से आगे समझाता है।
- issue: कनान के युद्धों को ‘जानने’ का आशय
  choice: अनुभव नहीं किया था
  alternative: नहीं जानते थे
  rationale: युद्ध के साथ ידע अनुभवजन्य परिचय सूचित करता है। चुना हुआ रूप अर्थ स्पष्ट करता है, जबकि वैकल्पिक शाब्दिक रूप हिन्दी में केवल बौद्धिक जानकारी का संकेत दे सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण और सहज रूप अपनाया गया है। पद अगले विवरण की भूमिका है, इसलिए अंत में द्विबिंदु रखा गया है। ‘जातियाँ’, ‘इस्राएल’ और ‘कनान’ जैसे बाइबिलीय शब्द सामान्य पाठक के लिए परिचित रूप में रखे गए हैं।
