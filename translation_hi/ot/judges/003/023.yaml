base_translation:
  language: en
  yaml_path: translation/ot/judges/003/023.yaml
  text: Then Ehud went out into the vestibule and shut the doors of the upper room behind him and locked them[a].
translation:
  language: hi
  text: तब एहूद बरामदे में निकल गया और उसने अपने पीछे ऊपरी कमरे के दरवाज़े बंद कर दिए और उनमें ताला लगा दिया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “ड्योढ़ी में,” “अग्रकक्ष में,” अथवा “स्तंभों वाले गलियारे में”; यहाँ प्रयुक्त इब्रानी शब्द दुर्लभ है और किसी संलग्न स्थापत्य-स्थान को सूचित करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: बाहर ... गया
  rationale: יצא का सामान्य आख्यानात्मक अर्थ बाहर निकलना है; ‘बाहर गया’ ऊपरी कमरे से दूर होने की गति को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הַמִּסְדְּרוֹנָה
  choice: बरामदे में
  rationale: מִסְדְּרוֹן एक दुर्लभ स्थापत्य-संज्ञा है, जो साथ लगे प्रवेश अथवा आवागमन-स्थान को सूचित करती है। ‘बरामदा’ सहज आधुनिक हिन्दी है, पर शब्द की अनिश्चितता पाद-टिप्पणी में सुरक्षित रखी गई है। अन्त का दिशासूचक ה उस स्थान की ओर अथवा उसमें गति बताता है।
- source_word: וַיִּסְגֹּר
  choice: बन्द करके
  rationale: סגר का सामान्य अर्थ बन्द करना है; अगले समन्वित कार्य के साथ हिन्दी में कृदन्तीय रचना स्वाभाविक है।
- source_word: דַּלְתוֹת
  choice: दरवाज़े
  rationale: דלת का बहुवचन सम्भवतः दो किवाड़ों अथवा द्वार-पटों को दर्शाता है; ‘दरवाज़े’ पाठक के लिए सहज है और स्रोत का बहुवचन बनाए रखता है।
- source_word: הָעֲלִיָּה
  choice: ऊपरी कमरे
  rationale: עֲלִיָּה भवन के ऊपरी भाग में स्थित कक्ष को दर्शाता है; ‘ऊपरी कमरा’ स्पष्ट और स्वाभाविक है।
- source_word: בַּעֲדוֹ
  choice: अपने पीछे
  rationale: 'बन्द करने की क्रिया के साथ בעד स्थानगत अर्थ देता है: एहूद के निकलने के बाद दरवाज़े उसके पीछे बन्द हुए।'
- source_word: וְנָעָל
  choice: उनमें ताला लगा दिया
  rationale: इस प्रसंग में נעל दरवाज़े को सुरक्षित रूप से बन्द या अवरुद्ध करने का अर्थ देता है। ‘ताला लगा दिया’ आधुनिक हिन्दी में स्वाभाविक है, जबकि ‘अन्दर से चिटकनी लगाई’ जैसी अनावश्यक विशिष्टता से बचता है।
