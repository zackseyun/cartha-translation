  text: וַ/יִּזְעֲק֣וּ בְנֵֽי יִשְׂרָאֵל֮ אֶל יְהוָה֒ וַ/יָּקֶם֩ יְהוָ֨ה לָ/הֶ֜ם מוֹשִׁ֗יעַ אֶת אֵה֤וּד בֶּן גֵּרָא֙ בֶּן הַ/יְמִינִ֔י אִ֥ישׁ אִטֵּ֖ר יַד יְמִינ֑/וֹ וַ/יִּשְׁלְח֨וּ בְנֵי יִשְׂרָאֵ֤ל בְּ/יָד/וֹ֙ מִנְחָ֔ה לְ/עֶגְל֖וֹן מֶ֥לֶךְ מוֹאָֽב־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/015.yaml
  text: Then the sons of Israel cried out to Yahweh[a], and Yahweh raised up for them a deliverer, Ehud son of Gera, a Benjaminite, a man hindered in his right hand. And the sons of Israel sent tribute by his hand to Eglon king of Moab.
translation:
  language: hi
  text: तब इस्राएल के पुत्रों ने याहवे को पुकारा, और याहवे ने उनके लिए एक छुड़ानेवाले को खड़ा किया—गेरा का पुत्र एहूद, जो बिन्यामीनी था और दाएँ हाथ से बाधित था। इस्राएल के पुत्रों ने एहूद के हाथ से मोआब के राजा एग्लोन को कर भेजा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּזְעֲקוּ
  choice: पुकारा
  rationale: यह क्रिया संकट में सहायता के लिए की गई पुकार को व्यक्त करती है; हिंदी में ‘पुकारा’ स्वाभाविक है और मूल में निहित सहायता की याचना को अनावश्यक रूप से स्पष्ट नहीं करती।
- source_word: בְנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों
  rationale: मूल इब्रानी मुहावरे और उसके लिंग-सूचक रूप को औपचारिक किंतु बोधगम्य हिंदी में सुरक्षित रखा गया है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम को किसी उपाधि से बदलने के बजाय हिंदी में प्रचलित लिप्यंतरण द्वारा व्यक्त किया गया है।
- source_word: וַיָּקֶם ... מוֹשִׁיעַ
  choice: एक छुड़ानेवाले को खड़ा किया
  rationale: यह न्यायियों में परमेश्वर द्वारा उद्धार के मानवीय साधन को नियुक्त करने का मुहावरा है; ‘खड़ा किया’ स्रोत की छवि और ‘छुड़ानेवाला’ तत्काल ऐतिहासिक भूमिका को बनाए रखते हैं।
- source_word: אֵהוּד בֶּן גֵּרָא
  choice: गेरा का पुत्र एहूद
  rationale: व्यक्तिगत नामों का मानक हिंदी लिप्यंतरण किया गया और संबंध को स्वाभाविक हिंदी क्रम में रखा गया है।
- source_word: בֶּן הַיְמִינִי
  choice: बिन्यामीनी
  rationale: यह पद गोत्रीय पहचान बताता है; ‘बिन्यामीनी’ उसका संक्षिप्त और स्वाभाविक हिंदी समतुल्य है।
- source_word: אִישׁ אִטֵּר יַד יְמִינוֹ
  choice: जिसका दायाँ हाथ बाधित था
  rationale: असामान्य इब्रानी अभिव्यक्ति दाएँ हाथ की किसी सीमा या रुकावट की ओर संकेत करती है। यह अनुवाद ‘बाएँ हाथ से काम करनेवाला’ अर्थ को मुख्य पाठ में निश्चित किए बिना मूल की अस्पष्टता बचाता है।
- source_word: וַיִּשְׁלְחוּ ... בְּיָדוֹ
  choice: उसी के हाथ ... भेजा
  rationale: इब्रानी में हाथ के माध्यम से भेजने की एजेंसी-सूचक छवि है; हिंदी का यह मुहावरा बताता है कि एहूद कर लेकर गया।
- source_word: מִנְחָה
  choice: कर
  rationale: राजनीतिक अधीनता के प्रसंग में यह अधिपति को दिया जाने वाला कर या भेंट है; ‘कर’ हिंदी में इस बाध्य राजनीतिक भुगतान को स्पष्ट रूप से व्यक्त करता है।
- source_word: לְעֶגְלוֹן מֶלֶךְ מוֹאָב
  choice: मोआब के राजा एग्लोन को
  rationale: नाम और राजकीय पद को स्वाभाविक हिंदी वाक्य-विन्यास में प्रस्तुत किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में ईश्वरीय वाचा-नाम सीधे प्रयुक्त है, इसलिए ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित नहीं किया गया। ‘यहोवा’ आधुनिक हिंदी बाइबल-पाठकों में व्यापक रूप से पहचाना जाने वाला लिप्यंतरण है।
- issue: אִטֵּר יַד יְמִינוֹ की व्याख्या
  choice: जिसका दायाँ हाथ बाधित था
  alternative: जो बाएँ हाथ से काम करता था
  rationale: मूल अभिव्यक्ति सीधे ‘बाएँ हाथ वाला’ नहीं कहती, इसलिए उसके संभावित शारीरिक या कार्यात्मक अर्थ को निर्णायक रूप से हल नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। ‘इस्राएल के पुत्रों’ और ‘उसी के हाथ’ जैसे स्रोत-समीप मुहावरों को हिंदी की पठनीयता के भीतर सुरक्षित रखा गया है। दाएँ हाथ वाली अभिव्यक्ति की वास्तविक अस्पष्टता मुख्य पाठ में ही बनाए रखी गई है, इसलिए फुटनोट आवश्यक नहीं समझा गया।
