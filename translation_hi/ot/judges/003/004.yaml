source:
  edition: WLC
  text: וַֽ/יִּהְי֕וּ לְ/נַסּ֥וֹת בָּ֖/ם אֶת יִשְׂרָאֵ֑ל לָ/דַ֗עַת הֲ/יִשְׁמְעוּ֙ אֶת מִצְוֺ֣ת יְהוָ֔ה אֲשֶׁר צִוָּ֥ה אֶת אֲבוֹתָ֖/ם בְּ/יַד מֹשֶֽׁה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/004.yaml
  text: And they were there to test Israel[a], to know whether they would listen to the commandments of Yahweh[c][b], which he commanded their fathers through Moses.
translation:
  language: hi
  text: और वे इस्राएल को उनके द्वारा परखने के लिए वहाँ रहे[a], यह जानने के लिए कि क्या वे यहोवा की उन आज्ञाओं को मानेंगे[b], जिन्हें उसने मूसा के द्वारा उनके पुरखों को दी थीं।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में स्पष्ट रूप से “उनके द्वारा” है; इसका संकेत देश में छोड़ी गई जातियों की ओर है, जिनके माध्यम से इस्राएल को परखा गया।
    reason: lexical_alternative
  - marker: b
    text: यहाँ “मानना” का मूल अर्थ “सुनना” है, अर्थात ध्यान देकर आज्ञा का पालन करना।
    reason: lexical_alternative
  - marker: c
    text: इब्रानी में “उनके पिताओं” है; आशय उनके पुरखों या पूर्वजों से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: और वे ... वहाँ रहे
  rationale: पिछले संदर्भ में देश में छोड़ी गई जातियाँ अभिप्रेत हैं। हिंदी में ‘वहाँ रहे’ उनकी निरंतर उपस्थिति को स्वाभाविक रूप से व्यक्त करता है।
- source_word: לְנַסּוֹת בָּם אֶת־יִשְׂרָאֵל
  choice: इस्राएल को उनके द्वारा परखने के लिए
  rationale: ‘परखना’ נסה का स्पष्ट आधुनिक अर्थ देता है, जबकि ‘उनके द्वारा’ בָּם को बनाए रखकर छोड़ी गई जातियों को परीक्षा का साधन बताता है।
- source_word: לָדַעַת
  choice: ताकि यह जाना जाए
  rationale: यह उद्देश्यसूचक infinitive है। यह अनुवाद ‘जानना’ का मूल भाव रखता है और यह नहीं बताता कि जानने वाला कौन है, क्योंकि इब्रानी में कर्ता स्पष्ट नहीं है।
- source_word: הֲיִשְׁמְעוּ
  choice: मानेंगे या नहीं
  rationale: आज्ञाओं के साथ שׁמע का अर्थ केवल सुनना नहीं, बल्कि ध्यान देकर पालन करना है। हिंदी में ‘आज्ञाओं को मानना’ यह अर्थ सहजता से देता है।
- source_word: מִצְוֺת יְהוָה
  choice: यहोवा की ... आज्ञाओं
  rationale: מִצְוֺת के लिए ‘आज्ञाएँ’ स्वाभाविक और वाचा-संबंधी संदर्भ के अनुरूप है; יְהוָה को परियोजना की नीति के अनुसार ‘यहोवा’ लिखा गया है।
- source_word: אֲבוֹתָם
  choice: उनके पुरखों
  rationale: ‘पुरखे’ पुरुषवाचक बहुवचन और पूर्वज पीढ़ियों के भाव को आधुनिक, सहज हिंदी में सुरक्षित रखता है।
- source_word: בְּיַד מֹשֶׁה
  choice: मूसा के द्वारा
  rationale: शाब्दिक ‘मूसा के हाथ से’ यहाँ माध्यम/प्रतिनिधित्व का मुहावरा है; ‘मूसा के द्वारा’ उसका अर्थ स्पष्ट रूप से देता है।
theological_decisions:
- issue: परीक्षा का उद्देश्य और साधन
  choice: छोड़ी गई जातियाँ इस्राएल की वाचा-संबंधी आज्ञाकारिता को परखने का साधन थीं।
  alternative: इसे केवल एक ऐतिहासिक निरीक्षण माना जाए, जिसमें ईश्वरीय उद्देश्य न हो।
  rationale: לְנַסּוֹת और לָדַעַת उद्देश्य प्रकट करते हैं। अनुवाद परीक्षा को बुराई के लिए प्रलोभन नहीं बनाता और न ही आगे बढ़कर उसके धर्मवैज्ञानिक रहस्य को सुलझाता है।
- issue: לָדַעַת में जानने वाले की पहचान
  choice: अव्यक्त रचना ‘ताकि यह जाना जाए’ रखी गई है।
  alternative: ‘ताकि वह जान ले’ या ‘ताकि वे जान लें।’
  rationale: इब्रानी infinitive में कर्ता व्यक्त नहीं है। अव्यक्त हिंदी रचना संभावित अर्थों में से किसी एक को अनावश्यक रूप से निश्चित नहीं करती।
- issue: ईश्वरीय नाम יְהוָה
  choice: यहोवा
  alternative: प्रभु
  rationale: व्यक्तिगत ईश्वरीय नाम को उपाधि से बदलने के बजाय हिंदी में प्रचलित लिप्यंतरण ‘यहोवा’ रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी में, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखी गई है। वाक्य की उद्देश्यसूचक संरचना और ‘उनके द्वारा’ का साधनार्थक भाव सुरक्षित है।
