  text: וַ/תִּכָּנַ֤ע מוֹאָב֙ בַּ/יּ֣וֹם הַ/ה֔וּא תַּ֖חַת יַ֣ד יִשְׂרָאֵ֑ל וַ/תִּשְׁקֹ֥ט הָ/אָ֖רֶץ שְׁמוֹנִ֥ים שָׁנָֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/030.yaml
  text: So Moab was subdued under the hand of Israel that day[c][b][a], and the land had rest for eighty years.
translation:
  language: hi
  text: इस प्रकार उस दिन मोआब इस्राएल के अधीन हो गया[a], और देश को अस्सी वर्ष तक विश्राम मिला।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक: “इस्राएल के हाथ के अधीन”; यह इब्रानी मुहावरा किसी के अधिकार या वश में होने का अर्थ देता है।'
    reason: cultural_note
lexical_decisions:
- source_word: וַתִּכָּנַע
  choice: अधीन हो गया
  rationale: निफ़अल रूप यहाँ परिणामस्वरूप सैन्य-राजनीतिक अधीनता व्यक्त करता है। यह अनुवाद न तो इसे केवल मनोभाव की दीनता बनाता है, न विनाश का अर्थ जोड़ता है।
- source_word: מוֹאָב
  choice: मोआब
  rationale: राष्ट्र के नाम का हिन्दी बाइबलीय रूप।
- source_word: בַּיּוֹם הַהוּא
  choice: उस दिन
  rationale: इब्रानी कालवाचक पदबंध और संकेतवाचक बल का स्वाभाविक हिन्दी रूप।
- source_word: תַּחַת יַד יִשְׂרָאֵל
  choice: इस्राएल के हाथ के अधीन
  rationale: इब्रानी मुहावरे की ठोस छवि बनाए रखते हुए इस्राएल के अधिकार और नियंत्रण का भाव व्यक्त करता है।
- source_word: וַתִּשְׁקֹט
  choice: विश्राम मिला
  rationale: שׁקט यहाँ संघर्ष और उपद्रव के थमने से प्राप्त शांति को सूचित करता है; न्यायियों के प्रसंग में 'देश को विश्राम मिला' स्वाभाविक और सटीक है।
- source_word: הָאָרֶץ
  choice: देश
  rationale: यहाँ क्षेत्र या इस्राएल की भूमि को समग्र रूप से दर्शाता है; आधुनिक हिन्दी में 'देश' इस वाक्य में सहज है।
- source_word: שְׁמוֹנִים שָׁנָה
  choice: अस्सी वर्ष तक
  rationale: अवधि को हिन्दी में स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: मोआब पर इस्राएल के प्रभुत्व का स्वरूप
  choice: पारंपरिक बाइबलीय मुहावरे में व्यक्त सैन्य-राजनीतिक अधीनता
  alternative: केवल रूपकात्मक दीनता अथवा पूर्ण विनाश
  rationale: मूल पाठ मोआब के अधीन किए जाने और उसके फलस्वरूप देश को मिले विश्राम की बात करता है; वह न संहार बताता है, न केवल भावनात्मक नम्रता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और कथात्मक शैली रखी गई है। 'हाथ के अधीन' मूल इब्रानी छवि को सुरक्षित रखता है, और पादटिप्पणी उसका मुहावरेदार अर्थ स्पष्ट करती है।
