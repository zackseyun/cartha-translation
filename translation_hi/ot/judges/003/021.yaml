  yaml_path: translation/ot/judges/003/021.yaml
  text: Then Ehud reached with his left hand[a], took the sword from his right thigh[b], and thrust it into his belly.
translation:
  language: hi
  text: तब एहूद ने अपना बायाँ हाथ बढ़ाया, अपनी दाहिनी जाँघ पर से तलवार निकाली और उसे एग्लोन के पेट में घोंप दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: हाथ बढ़ाया
  rationale: इस शारीरिक क्रिया के संदर्भ में क्रिया का अर्थ हाथ को आगे बढ़ाना है; यह स्वाभाविक हिंदी में अगले कार्य की तैयारी भी स्पष्ट करती है।
- source_word: יַד שְׂמֹאלוֹ
  choice: अपना बायाँ हाथ
  rationale: मूल पाठ में ‘हाथ’ स्पष्ट है और बाएँ हाथ पर कथानक का विशेष जोर है।
- source_word: וַיִּקַּח
  choice: निकाली
  rationale: शाब्दिक अर्थ ‘लिया’ है, पर जाँघ पर बँधे हथियार को लेने की क्रिया के लिए हिंदी में ‘निकाली’ अधिक स्वाभाविक और संदर्भ-सटीक है।
- source_word: הַחֶרֶב
  choice: तलवार
  rationale: यह इब्रानी का सामान्य शब्द ‘तलवार’ है; संदर्भ में हथियार छोटा हो सकता है, फिर भी ‘कटार’ कहना मूल शब्द को अनावश्यक रूप से संकीर्ण करेगा।
- source_word: מֵעַל יֶרֶךְ יְמִינוֹ
  choice: अपनी दाहिनी जाँघ पर से
  rationale: यह हथियार के दाहिनी जाँघ के ऊपर बँधे होने का ठोस स्थान सुरक्षित रखता है।
- source_word: וַיִּתְקָעֶהָ
  choice: उसे ... घोंप दिया
  rationale: क्रिया बलपूर्वक भीतर धँसाने या घोंपने को व्यक्त करती है; ‘घोंप दिया’ आधुनिक हिंदी में स्पष्ट और स्वाभाविक है।
- source_word: בְּבִטְנוֹ
  choice: एग्लोन के पेट में
  rationale: מִטֶּן पेट/उदर को दर्शाता है। इब्रानी सर्वनाम का संदर्भ एग्लोन है; हिंदी में अस्पष्टता से बचने के लिए नाम दोहराया गया है।
