  text: וַ/יִּזְעֲק֤וּ בְנֵֽי יִשְׂרָאֵל֙ אֶל יְהוָ֔ה וַ/יָּ֨קֶם יְהוָ֥ה מוֹשִׁ֛יעַ לִ/בְנֵ֥י יִשְׂרָאֵ֖ל וַ/יּֽוֹשִׁיעֵ֑/ם אֵ֚ת עָתְנִיאֵ֣ל בֶּן קְנַ֔ז אֲחִ֥י כָלֵ֖ב הַ/קָּטֹ֥ן מִמֶּֽ/נּוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/009.yaml
  text: 'Then the sons of Israel cried out to Yahweh[a], and Yahweh raised up a deliverer for the sons of Israel, who delivered them: Othniel son of Kenaz[c][b], Caleb’s younger brother.'
translation:
  language: hi
  text: तब इस्राएलियों[a] ने याहवे की दुहाई दी, और याहवे ने इस्राएलियों के लिए एक छुड़ाने वाले[b] को खड़ा किया, जिसने उन्हें छुड़ाया—कनज़ का पुत्र ओत्नीएल, जो कालेब का छोटा भाई था।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “इस्राएल के पुत्र।”
    reason: lexical_alternative
  - marker: b
    text: “छुड़ाने वाला” का अनुवाद “उद्धारकर्ता” या “बचाने वाला” भी हो सकता है। यहाँ हिब्रू शब्द परमेश्वर द्वारा इस्राएल को बचाने के लिए खड़े किए गए एक मानवीय व्यक्ति को दर्शाता है।
    reason: lexical_alternative
  - marker: c
    text: हिब्रू संबंध-वाक्यांश को “कालेब का भाई, जो उससे छोटा था” पढ़ा जा सकता है; इस समझ में ओत्नीएल कालेब का छोटा भाई है। वैकल्पिक रूप से इसे कनज़ के साथ जोड़कर “कालेब के छोटे भाई कनज़ का पुत्र ओत्नीएल” भी समझा गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּזְעֲקוּ
  choice: दुहाई दी
  rationale: यह क्रिया संकट में सहायता के लिए की गई तीव्र पुकार व्यक्त करती है; ‘दुहाई दी’ आधुनिक हिन्दी में इस भाव को स्वाभाविक रूप से प्रकट करती है।
- source_word: בְנֵי יִשְׂרָאֵל
  choice: इस्राएली
  rationale: शाब्दिक अर्थ ‘इस्राएल के पुत्र’ है, पर सामूहिक जनसमुदाय के लिए हिन्दी में ‘इस्राएली’ अधिक स्वाभाविक और स्पष्ट है; शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: יְהוָה
  choice: यहवे
  rationale: चार अक्षरों वाले ईश्वरीय नाम को उपाधि से बदलने के बजाय हिन्दी में उसके प्रचलित निकट लिप्यंतरण द्वारा व्यक्त किया गया है।
- source_word: וַיָּקֶם
  choice: खड़ा किया
  rationale: हिफ़ईल रूप यहाँ किसी व्यक्ति को विशेष उद्धारकारी भूमिका के लिए आगे लाने का अर्थ देता है; ‘खड़ा किया’ उस क्रियाशील पहल को बनाए रखता है।
- source_word: מוֹשִׁיעַ
  choice: छुड़ानेवाला
  rationale: न्यायियों के संदर्भ में यह परमेश्वर द्वारा खड़ा किए गए उस मानवीय साधन को दर्शाता है जो लोगों को उत्पीड़न से छुड़ाता है; ‘छुड़ानेवाला’ इस ठोस अर्थ को स्पष्ट रखता है।
- source_word: וַיּוֹשִׁיעֵם
  choice: जिसने उन्हें छुड़ाया
  rationale: यह उसी ישׁע धातु से है और उत्पीड़न से वास्तविक बचाव को बताता है; संबंधवाचक वाक्य हिन्दी में ओत्नीएल को छुड़ानेवाले के रूप में स्पष्ट करता है।
- source_word: עָתְנִיאֵל בֶּן־קְנַז
  choice: कनज का पुत्र ओत्नीएल
  rationale: नामों का हिन्दी लिप्यंतरण करते हुए हिब्रू वंश-संबंध को स्वाभाविक हिन्दी क्रम में रखा गया है।
- source_word: אֲחִי כָלֵב הַקָּטֹן מִמֶּנּוּ
  choice: जो कालेब का छोटा भाई था
  rationale: वाक्यांश का सर्वाधिक स्वाभाविक अर्थ है कि ओत्नीएल कालेब का भाई और उससे छोटा था; ‘सबसे छोटा’ कहना तुलनात्मक रूप से अधिक अर्थ जोड़ देता।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम का प्रयोग करता है। उसे उपाधि ‘प्रभु’ से प्रतिस्थापित न करके लिप्यंतरित किया गया है; ‘यहोवा’ एक वैकल्पिक पारंपरिक रूप है।
- issue: מוֹשִׁיעַ का अर्थ
  choice: छुड़ानेवाला
  alternative: उद्धारकर्ता; बचानेवाला
  rationale: यहाँ शब्द परमेश्वर द्वारा इस्राएल को शत्रु के उत्पीड़न से छुड़ाने के लिए खड़े किए गए मानवीय अगुए को बताता है। ‘छुड़ानेवाला’ बाद की धर्मवैज्ञानिक धारणाओं को अनावश्यक रूप से आरोपित किए बिना प्रसंगानुकूल अर्थ देता है।
- issue: אֲחִי כָלֵב הַקָּטֹן מִמֶּנּוּ की संरचना
  choice: ओत्नीएल कालेब का छोटा भाई था
  alternative: कालेब के छोटे भाई कनज का पुत्र ओत्नीएल
  rationale: हिब्रू संरचना व्याकरणतः संबंध में कुछ अस्पष्टता उत्पन्न कर सकती है, यद्यपि सामान्य और अधिक सीधा पाठ ओत्नीएल को कालेब का उससे छोटा भाई मानता है। वैकल्पिक संबंध को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के लिए सहज रखी गई है। ‘दुहाई दी’ संकटपूर्ण पुकार को, और ‘छुड़ानेवाला/छुड़ाया’ मूल की शब्द-पुनरावृत्ति को यथासंभव बनाए रखते हैं। ईश्वरीय नाम के लिए ‘यहवे’ का प्रयोग किया गया है।
