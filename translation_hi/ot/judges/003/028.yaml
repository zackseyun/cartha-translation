  text: וַ/יֹּ֤אמֶר אֲלֵ/הֶם֙ רִדְפ֣וּ אַחֲרַ֔/י כִּֽי נָתַ֨ן יְהוָ֧ה אֶת אֹיְבֵי/כֶ֛ם אֶת מוֹאָ֖ב בְּ/יֶדְ/כֶ֑ם וַ/יֵּרְד֣וּ אַחֲרָ֗י/ו וַֽ/יִּלְכְּד֞וּ אֶת מַעְבְּר֤וֹת הַ/יַּרְדֵּן֙ לְ/מוֹאָ֔ב וְ/לֹֽא נָתְנ֥וּ אִ֖ישׁ לַ/עֲבֹֽר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/028.yaml
  text: And he said to them[a], “Follow after me, for Yahweh has given your enemies, Moab, into your hand.” So they went down after him and captured the fords of the Jordan against Moab[c][b], and they did not allow anyone to cross over.
translation:
  language: hi
  text: उसने उनसे कहा, “मेरे पीछे आओ[a], क्योंकि याहवे ने तुम्हारे शत्रुओं—मोआब[b]—को तुम्हारे हाथ में दे दिया है।” तब वे उसके पीछे-पीछे नीचे उतरे और उन्होंने मोआब की ओर के यरदन के घाटों को अपने अधिकार में ले लिया[c]; उन्होंने किसी को भी पार नहीं जाने दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरे पीछे-पीछे बढ़ो।” इब्रानी क्रिया में ‘पीछा करने’ का भाव भी है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में, “तुम्हारे शत्रुओं, अर्थात् मोआब, को”; यहाँ “मोआब” ‘तुम्हारे शत्रुओं’ की पहचान बताता है।
    reason: lexical_clarification
  - marker: c
    text: या, “मोआब की दिशा में यरदन के घाटों को अपने अधिकार में ले लिया।” इब्रानी पूर्वसर्ग यहाँ दिशा या गंतव्य का भाव दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: רִדְפוּ אַחֲרַי
  choice: मेरे पीछे आओ
  rationale: רדף में ‘पीछा करना’ का भाव है, पर यहाँ एहूद अपने साथियों को अपने पीछे सैन्य कार्रवाई में आने की आज्ञा देता है। सहज हिन्दी में ‘मेरे पीछे आओ’ दिशा और नेतृत्व को स्पष्ट रखता है; पीछा करने का अधिक शाब्दिक भाव पादटिप्पणी में सुरक्षित है।
- source_word: נָתַן ... בְּיֶדְכֶם
  choice: तुम्हारे हाथ में कर दिया है
  rationale: यह इब्रानी मुहावरा किसी को दूसरे के अधिकार या वश में सौंप देने को व्यक्त करता है। हिन्दी में ‘हाथ में कर दिया है’ मूल बिंब और विजय की निश्चितता दोनों बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत नाम יהוה है; इसलिए उसे किसी उपाधि से बदलने के बजाय ‘याहवे’ के रूप में लिप्यंतरित किया गया है।
- source_word: אֹיְבֵיכֶם אֶת מוֹאָב
  choice: तुम्हारे शत्रुओं—मोआब—को
  rationale: ‘मोआब’ ‘तुम्हारे शत्रुओं’ का समानाधिकरण करते हुए उनकी पहचान बताता है। राष्ट्र के नाम को सामूहिक अर्थ में बनाए रखा गया है, न कि स्पष्ट जातिवाचक शब्द ‘मोआबियों’ में बदला गया है।
- source_word: וַיֵּרְדוּ אַחֲרָיו
  choice: वे उसके पीछे नीचे उतरे
  rationale: ירד का भौगोलिक अर्थ ‘नीचे उतरना’ है, जो पहाड़ी प्रदेश से यरदन घाटी की ओर गति को दर्शाता है; ‘उसके पीछे’ नेतृत्व का संबंध बनाए रखता है।
- source_word: מַעְבְּרוֹת הַיַּרְדֵּן
  choice: यरदन के घाटों
  rationale: מַעְבְּרוֹת नदी पार करने के स्थानों, विशेषतः उथले घाटों, को सूचित करता है। आधुनिक हिन्दी में ‘घाट’ इस सैन्य-भौगोलिक संदर्भ में संक्षिप्त और बोधगम्य है।
- source_word: לְמוֹאָב
  choice: मोआब की ओर के
  rationale: לְ दिशा, संबंध या लक्ष्य का भाव दे सकता है। ‘मोआब की ओर के’ घाटों की दिशा/स्थिति बताता है और ‘मोआब के विरुद्ध’ जैसी अधिक निश्चित व्याख्या को मुख्य पाठ में आरोपित नहीं करता।
- source_word: וְלֹא נָתְנוּ אִישׁ לַעֲבֹר
  choice: उन्होंने किसी को भी पार नहीं जाने दिया
  rationale: शाब्दिक रचना ‘किसी मनुष्य को पार करने नहीं दिया’ अनुमति रोकने का मुहावरा है। ‘किसी को भी’ पूर्ण निषेध को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: यहाँ मूल पाठ उपाधि नहीं बल्कि चतुरक्षरीय व्यक्तिगत नाम का प्रयोग करता है। ‘याहवे’ उसका प्रत्यक्ष लिप्यंतरण है और पाठ में नाम तथा उपाधि का अंतर बनाए रखता है।
- issue: מוֹאָב का सामूहिक राष्ट्रीय अर्थ
  choice: मोआब
  alternative: मोआबी लोग
  rationale: इब्रानी पाठ जातिवाचक संज्ञा के बजाय राष्ट्र का नाम देता है और उसे ‘तुम्हारे शत्रुओं’ के समानाधिकरण में रखता है। इसलिए राष्ट्रीय सामूहिकता और मूल की अभिव्यक्ति दोनों सुरक्षित रखी गई हैं।
- issue: לְמוֹאָב का संदर्भगत संबंध
  choice: मोआब की ओर के
  alternative: मोआब के विरुद्ध; मोआब की दिशा में जाने वाले
  rationale: पूर्वसर्ग לְ यहाँ दिशा, संबद्धता या विरोधी उद्देश्य में समझा जा सकता है। मुख्य पाठ ने न्यूनतम व्याख्यात्मक directional rendering चुना है और दूसरी संभावना पादटिप्पणी में रखी है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक रखी गई है। ‘नीचे उतरे’ से स्थलाकृतिक गति, ‘घाटों पर अधिकार कर लिया’ से सैन्य नियंत्रण, और ‘किसी को भी’ से पूर्ण निषेध स्पष्ट होता है। विराम-चिह्नों में दीर्घ डैश समानाधिकरण को सहज बनाता है।
