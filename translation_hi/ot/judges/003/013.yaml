base_translation:
  language: en
  yaml_path: translation/ot/judges/003/013.yaml
  text: He gathered to himself the Ammonites and Amalek[a], and he went and struck Israel[b], and they took possession of the City of Palms.
translation:
  language: hi
  text: उसने अम्मोनियों और अमालेक[a] को अपने पास इकट्ठा किया। फिर जाकर उसने इस्राएल पर प्रहार किया, और उन्होंने खजूर के पेड़ों के नगर[b] पर अधिकार कर लिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अमालेकियों।” इब्रानी में “अमालेक” नाम पूरे जाति-समुदाय के लिए सामूहिक रूप से प्रयुक्त हुआ है।
    reason: lexical_alternative
  - marker: b
    text: सम्भवतः यरीहो; तुलना करें व्यवस्थाविवरण 34:3 और 2 इतिहास 28:15।
    reason: cross_reference
lexical_decisions:
- source_word: וַיֶּאֱסֹף אֵלָיו
  choice: उसने ... को अपने साथ इकट्ठा किया
  rationale: यह प्रयोग एग्लोन द्वारा सहयोगी लोगों को अपने पास और अपने नेतृत्व में एकत्र करने का भाव व्यक्त करता है; ‘अपने साथ’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: בְּנֵי עַמּוֹן
  choice: अम्मोनियों
  rationale: यहाँ जाति-समुदाय का स्वाभाविक हिन्दी नाम उपयुक्त है; शाब्दिक ‘अम्मोन के पुत्रों’ से आशय अनावश्यक रूप से अस्पष्ट होता।
- source_word: עֲמָלֵק
  choice: अमालेक
  rationale: इब्रानी में जाति के लिए सामूहिक व्यक्तिवाचक नाम है। मूल रूप को मुख्य पाठ में रखा गया है और ‘अमालेकियों’ विकल्प को पादटिप्पणी में स्पष्ट किया गया है।
- source_word: וַיֵּלֶךְ
  choice: फिर उसने जाकर
  rationale: साधारण गति-सूचक क्रिया और कथा-क्रम दोनों सुरक्षित रहते हैं; ‘चढ़ाई की’ जैसा अतिरिक्त सैन्य अर्थ नहीं जोड़ा गया।
- source_word: וַיַּךְ אֶת יִשְׂרָאֵל
  choice: इस्राएल पर प्रहार किया
  rationale: नכה के ‘मारना/प्रहार करना’ भाव को निकटता से व्यक्त करता है और ‘हरा दिया’ जैसी परिणाम-प्रधान व्याख्या से बचता है।
- source_word: וַיִּירְשׁוּ
  choice: उन्होंने ... पर अधिकार कर लिया
  rationale: क्रिया बहुवचन है और विजय के फलस्वरूप किसी स्थान को अपने अधिकार में लेने का भाव देती है; कर्ता एग्लोन की संयुक्त सेनाएँ हैं।
- source_word: עִיר הַתְּמָרִים
  choice: खजूर के पेड़ों का नगर
  rationale: वर्णनात्मक इब्रानी पद की छवि बनाए रखी गई है; मुख्य पाठ में सीधे ‘यरीहो’ नहीं रखा गया।
theological_decisions:
- issue: עִיר הַתְּמָרִים की पहचान
  choice: मुख्य पाठ में ‘खजूर के पेड़ों का नगर’
  alternative: यरीहो
  rationale: इब्रानी पाठ यरीहो नाम स्पष्ट रूप से नहीं देता। इसलिए सम्भावित पहचान को मुख्य पाठ में निश्चित न बनाकर पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। वाक्य-विभाजन हिन्दी में कथा-क्रम स्पष्ट करता है। जाति-नाम प्रचलित हिन्दी बाइबलीय रूपों में हैं, जबकि ‘खजूर के पेड़ों का नगर’ मूल के वर्णनात्मक स्थान-नाम को सुरक्षित रखता है।
