source:
  edition: WLC
  text: רַ֗ק לְמַ֨עַן֙ דַּ֚עַת דֹּר֣וֹת בְּנֵֽי יִשְׂרָאֵ֔ל לְ/לַמְּדָ֖/ם מִלְחָמָ֑ה רַ֥ק אֲשֶׁר לְ/פָנִ֖ים לֹ֥א יְדָעֽוּ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/002.yaml
  text: only so that the generations of the sons of Israel might know[b][a], to teach them war—only those who formerly had not known it.
translation:
  language: hi
  text: केवल इसलिए कि इस्राएल के पुत्रों की पीढ़ियाँ[a] युद्ध को जानें[b], उन्हें युद्ध करना सिखाने के लिए—केवल वे ही जिन्होंने पहले उसे नहीं जाना था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “इस्राएलियों की पीढ़ियाँ।” मूलतः “इस्राएल के पुत्रों की पीढ़ियाँ”; यह पूरे इस्राएली समुदाय के लिए सामूहिक अभिव्यक्ति है।
    reason: lexical_alternative
  - marker: b
    text: या “युद्ध का अनुभव करें”; इसी प्रकार पद के अंत में, “जिन्होंने पहले युद्ध का अनुभव नहीं किया था।”
    reason: alternative_reading
lexical_decisions:
- source_word: רַק
  choice: केवल
  rationale: यह अव्यय उद्देश्य को सीमित करता है और पद में दो बार आया है; इसलिए दोनों स्थानों पर इसकी पुनरावृत्ति बनाए रखी गई है।
- source_word: לְמַעַן
  choice: इसलिए कि
  rationale: यह उद्देश्यसूचक प्रयोग है; आधुनिक हिन्दी में ‘इसलिए कि’ उसके प्रयोजनात्मक बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: דַּעַת
  choice: जानें
  rationale: मूल पाठ ידע (‘जानना’) से बना रूप रखता है। ‘जानें’ युद्ध से परिचय और उसके अनुभव—दोनों संभावित अर्थों को खुला छोड़ता है।
- source_word: דֹּרוֹת בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों की पीढ़ियाँ
  rationale: रचना-संबंध को सीधे रखा गया है। ‘आनेवाली’ संदर्भ से निहित है, पर मूल में स्पष्ट नहीं, इसलिए नहीं जोड़ा गया।
- source_word: לְלַמְּדָם מִלְחָמָה
  choice: उन्हें युद्ध करना सिखाया जाए
  rationale: למד के पिएल रूप का अर्थ ‘सिखाना’ है। हिन्दी में ‘युद्ध करना सिखाना’ स्वाभाविक है और सैन्य संदर्भ वस्तु ‘युद्ध’ से स्पष्ट होता है। कर्मवाच्य रूप पिछले बहुवचन समूह से संबंध साफ करता है।
- source_word: אֲשֶׁר לְפָנִים
  choice: वे जिन्होंने पहले
  rationale: यह पदबंध पूर्व समय की ओर संकेत करता है; ‘पहले’ सरल और वर्तमान हिन्दी के अनुकूल है।
- source_word: לֹא יְדָעוּם
  choice: उसे नहीं जाना था
  rationale: ידע की मूल शब्दावली को बनाए रखते हुए हिन्दी में ‘युद्ध’ के लिए एकवचन सर्वनाम ‘उसे’ रखा गया है; ‘अनुभव नहीं किया था’ अधिक व्याख्यात्मक है और पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל का सामूहिक, व्याकरणतः पुल्लिंग संबोधन
  choice: इस्राएल के पुत्र
  alternative: इस्राएली
  rationale: मूल इब्रानी अभिव्यक्ति को मुख्य पाठ में निकटता से रखा गया है, पर यह पूरे इस्राएली समुदाय का जातीय-सामूहिक नाम है, केवल पुरुषों का उल्लेख नहीं। अधिक मुहावरेदार विकल्प पादटिप्पणी में दिया गया है।
- issue: ‘युद्ध को जानने’ का अर्थ
  choice: युद्ध को जानें / उसे नहीं जाना था
  alternative: युद्ध का अनुभव करें / पहले युद्ध का अनुभव नहीं किया था
  rationale: मूल पाठ सामान्य क्रिया ‘जानना’ का प्रयोग करता है। उसी को रखने से युद्ध से परिचित होने और उसका प्रत्यक्ष अनुभव करने के बीच की अर्थगत व्यापकता अनावश्यक रूप से सीमित नहीं होती।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रखी गई है। मूल की दोहरी ‘केवल’ संरचना और ‘जानना’ क्रिया की अर्थगत अस्पष्टता सुरक्षित रखी गई है; ‘अर्थात’ खंड के व्याख्यात्मक संबंध को हिन्दी में स्पष्ट करता है।
