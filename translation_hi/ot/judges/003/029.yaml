translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध रखी गई है। इब्रानी की समानांतर रचना ‘हर ... और हर ...’ को बनाए रखा गया है, ताकि दोनों वर्णनों का संबंध अनावश्यक रूप से एक ही अर्थ में न समेटा जाए।
