  text: וַ/יַּכּ֨וּ אֶת מוֹאָ֜ב בָּ/עֵ֣ת הַ/הִ֗יא כַּ/עֲשֶׂ֤רֶת אֲלָפִים֙ אִ֔ישׁ כָּל שָׁמֵ֖ן וְ/כָל אִ֣ישׁ חָ֑יִל וְ/לֹ֥א נִמְלַ֖ט אִֽישׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/029.yaml
  text: And at that time they struck down about ten thousand men of Moab[a], every stout man and every man of valor[c][b]; not a man escaped.
translation:
  language: hi
  text: उस समय उन्होंने मोआब के लगभग दस हज़ार पुरुषों को मार गिराया[a]—हर हृष्ट-पुष्ट पुरुष[b] और हर वीर पुरुष[c]; एक भी पुरुष बच न निकला।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल इब्रानी में केवल ‘मोआब’ है; आगे ‘लगभग दस हज़ार पुरुष’ गिने जाने के कारण अनुवाद में स्पष्ट किया गया है कि आशय मोआब के पुरुषों से है।
    reason: lexical_alternative
  - marker: b
    text: या ‘हर बलिष्ठ पुरुष’। इब्रानी शब्द का शाब्दिक अर्थ ‘हर मोटा/हृष्ट-पुष्ट व्यक्ति’ है; यहाँ संभवतः आशय अच्छे पोषण वाले या बलवान पुरुषों से है, केवल शरीर के आकार से नहीं।
    reason: lexical_alternative
  - marker: c
    text: या ‘हर सामर्थी पुरुष’ अथवा ‘हर पराक्रमी पुरुष’।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכּוּ
  choice: उन्होंने ... मार गिराया
  rationale: युद्ध के प्रसंग में נכה प्राणघातक रूप से मारने या परास्त करने का भाव देता है। ‘मार गिराया’ हिंसक परिणाम को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אֶת מוֹאָב
  choice: मोआब के ... पुरुषों को
  rationale: मूल में सीधे ‘मोआब’ है, पर आगे ‘लगभग दस हज़ार पुरुष’ आने से स्पष्ट है कि आशय मोआबी पुरुषों से है। हिन्दी में इसे स्पष्ट किया गया है, जबकि ‘मोआब’ नाम भी सुरक्षित है।
- source_word: בָּעֵת הַהִיא
  choice: उस समय
  rationale: यह मानक कालवाचक अभिव्यक्ति है; ‘उस समय’ मूल के निकट और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: כַּעֲשֶׂרֶת אֲלָפִים אִישׁ
  choice: लगभग दस हज़ार पुरुषों
  rationale: उपसर्ग כ यहाँ अनुमान का बोध कराता है; इसलिए ‘लगभग’ उपयुक्त है।
- source_word: כָּל שָׁמֵן
  choice: हर हृष्ट-पुष्ट पुरुष
  rationale: שָׁמֵן का शाब्दिक अर्थ ‘मोटा/चर्बीदार’ है, किंतु इस युद्ध-संदर्भ में इससे संभवतः अच्छे पोषण वाले, बलिष्ठ पुरुषों का भाव है। ‘हृष्ट-पुष्ट’ ठोस शारीरिक भाव को बनाए रखते हुए अनावश्यक उपहास से बचता है।
- source_word: וְכָל אִישׁ חָיִל
  choice: और हर वीर योद्धा
  rationale: אִישׁ חַיִל किसी वीर, सामर्थी या युद्ध-कुशल पुरुष को दर्शा सकता है। इस युद्ध-संदर्भ में ‘वीर योद्धा’ स्वाभाविक और अर्थानुकूल है।
- source_word: וְלֹא נִמְלַט אִישׁ
  choice: एक भी पुरुष बच न निकला
  rationale: यह वाक्यांश पराजय की पूर्णता पर बल देता है। ‘एक भी ... न’ मूल के वितरणात्मक एकवचन और जोर दोनों को सहज हिन्दी में व्यक्त करता है।
