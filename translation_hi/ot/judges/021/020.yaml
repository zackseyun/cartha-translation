    reason: source_ambiguity
lexical_decisions:
- source_word: וַיְצַו
  choice: तब उसने … आज्ञा दी
  rationale: प्रस्तुत हिब्रू रूप पिएल वय्यिक़्तोल, तीसरा पुरुष पुल्लिंग एकवचन है; इसलिए बहुवचन ‘उन्होंने’ के बजाय एकवचन ‘उसने’ रखा गया। वाव को कथानक के स्वाभाविक क्रम में ‘तब’ से व्यक्त किया गया।
- source_word: אֶת בְּנֵי בִנְיָמִן
  choice: बिन्यामीन के पुत्रों को
  rationale: हिब्रू के वंश-संबंधी पदबंध को औपचारिक रूप से सुरक्षित रखा गया; प्रसंग में इसका अर्थ बिन्यामीन गोत्र के पुरुष हैं।
- source_word: לֵאמֹר
  choice: प्रत्यक्ष कथन के रूप में
  rationale: हिब्रू का प्रचलित उद्धरण-सूचक शब्द है। हिंदी में अलग से ‘यह कहते हुए’ जोड़ने के बजाय स्वाभाविक रूप से सीधे उद्धरण आरंभ किया गया।
- source_word: לְכוּ
  choice: जाओ
  rationale: הלך का बहुवचन आज्ञार्थक रूप है; संबोधन बिन्यामीन के पुत्रों से है।
- source_word: וַאֲרַבְתֶּם
  choice: और … घात लगाकर बैठो
  rationale: ארב का अर्थ छिपकर अवसर की प्रतीक्षा करना या घात लगाना है। पहले आज्ञार्थक के बाद यह रूप आदेश की निरंतरता व्यक्त करता है।
- source_word: בַּכְּרָמִים
  choice: दाख की बारियों में
  rationale: כֶּרֶם का बहुवचन ‘दाख की बारियाँ’ है; בְּ का स्थानवाचक अर्थ ‘में’ है।
