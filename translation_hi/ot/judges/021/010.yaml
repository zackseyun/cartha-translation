  text: וַ/יִּשְׁלְחוּ שָׁ֣ם הָ/עֵדָ֗ה שְׁנֵים עָשָׂ֥ר אֶ֛לֶף אִ֖ישׁ מִ/בְּנֵ֣י הֶ/חָ֑יִל וַ/יְצַוּ֨וּ אוֹתָ֜/ם לֵ/אמֹ֗ר לְ֠כוּ וְ/הִכִּיתֶ֞ם אֶת יוֹשְׁבֵ֨י יָבֵ֤שׁ גִּלְעָד֙ לְ/פִי חֶ֔רֶב וְ/הַ/נָּשִׁ֖ים וְ/הַ/טָּֽף־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/010.yaml
  text: So the assembly sent there twelve thousand men from the sons of valor, and they commanded them, saying, “Go and strike the inhabitants of Jabesh-gilead with the edge of the sword, including the women and the little ones.”
translation:
  language: hi
  text: तब सभा ने वीर योद्धाओं में से बारह हज़ार पुरुषों को वहाँ भेजा और उन्हें आज्ञा दी, “जाओ और याबेश-गिलाद के निवासियों को—स्त्रियों और बच्चों समेत—तलवार से मार डालो।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָעֵדָה
  choice: सभा
  rationale: यहाँ इस्राएल के एकत्रित समुदाय की निर्णय लेने वाली सभा अभिप्रेत है; ‘सभा’ प्रसंग में स्वाभाविक और स्पष्ट है।
- source_word: מִבְּנֵי הֶחָיִל
  choice: वीर योद्धाओं में से
  rationale: शाब्दिक रूप ‘पराक्रम के पुत्रों में से’ आधुनिक हिन्दी में अस्वाभाविक है; पदबंध युद्ध-सक्षम वीर पुरुषों को दर्शाता है।
- source_word: לְפִי חֶרֶב
  choice: तलवार से
  rationale: इब्रानी मुहावरे का अर्थ तलवार से घात करना है; हिन्दी में संक्षिप्त स्वाभाविक रूप चुना गया है।
- source_word: הַטָּף
  choice: बच्चों
  rationale: यह सामूहिक शब्द आश्रित छोटे बच्चों या बालकों को सूचित करता है; ‘बच्चों’ सहज है और मूल की सीमा से अधिक विशिष्ट नहीं बनाता।
theological_decisions:
- issue: हिंसक आदेश का वर्णन
  choice: आज्ञा को कथात्मक रूप में बिना नरमी के स्पष्ट रखा गया
  alternative: भाषा को नरम करके केवल ‘आक्रमण करो’ कहना
  rationale: पद स्वयं सभा द्वारा स्त्रियों और बच्चों समेत निवासियों को तलवार से मारने की आज्ञा का वर्णन करता है; अनुवाद न इसे अनुमोदन बनाता है, न इसकी कठोरता छिपाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठकों के लिए स्पष्ट। स्थान-नाम ‘याबेश-गिलाद’ रखा गया है।
