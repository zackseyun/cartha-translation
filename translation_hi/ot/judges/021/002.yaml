language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יָּבֹ֤א הָ/עָם֙ בֵּֽית אֵ֔ל וַ/יֵּ֤שְׁבוּ שָׁם֙ עַד הָ/עֶ֔רֶב לִ/פְנֵ֖י הָ/אֱלֹהִ֑ים וַ/יִּשְׂא֣וּ קוֹלָ֔/ם וַ/יִּבְכּ֖וּ בְּכִ֥י גָדֽוֹל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/002.yaml
  text: Then the people came to Bethel and sat there before God until evening[a], and they raised their voices and wept with great weeping.
translation:
  language: hi
  text: तब लोग बेतेल आए और वहाँ परमेश्वर के सामने शाम तक बैठे रहे। उन्होंने अपना स्वर ऊँचा किया और बहुत फूट-फूटकर रोए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא הָעָם
  choice: तब लोग ... आए
  rationale: בוא यहाँ किसी स्थान पर पहुँचने को व्यक्त करता है; आधुनिक हिन्दी में ‘आए’ स्वाभाविक है। הָעָם सामूहिक रूप से इस्राएली लोगों को दर्शाता है, न कि केवल सेना को।
- source_word: בֵּית אֵל
  choice: बेतेल
  rationale: यहाँ यह स्थान-नाम है, इसलिए इसका प्रचलित हिन्दी लिप्यंतरण रखा गया है; इसे ‘परमेश्वर का घर’ नहीं बनाया गया।
- source_word: וַיֵּשְׁבוּ שָׁם עַד הָעֶרֶב
  choice: वहाँ ... शाम तक बैठे रहे
  rationale: ישב का ठोस अर्थ ‘बैठना’ और प्रसंग का कालावधि-बोध दोनों ‘बैठे रहे’ से स्पष्ट होते हैं।
- source_word: לִפְנֵי הָאֱלֹהִים
  choice: परमेश्वर के सामने
  rationale: לִפְנֵי का सीधा उपस्थिति-सूचक अर्थ ‘के सामने’ है; הָאֱלֹהִים के लिए ‘परमेश्वर’ रखा गया है।
- source_word: וַיִּשְׂאוּ קוֹלָם
  choice: उन्होंने ऊँचे स्वर में विलाप किया
  rationale: शाब्दिक मुहावरा ‘अपनी आवाज़ उठाई’ यहाँ सुनाई देने वाले सामूहिक शोक को दर्शाता है; हिन्दी में ‘ऊँचे स्वर में विलाप किया’ उसका स्वाभाविक अर्थ देता है।
- source_word: וַיִּבְכּוּ בְּכִי גָדוֹל
  choice: फूट-फूटकर रोए
  rationale: क्रिया और उसी मूल की संज्ञा वाला हिब्रू प्रयोग रोने की तीव्रता बढ़ाता है। ‘फूट-फूटकर रोए’ आधुनिक हिन्दी में इस प्रबल विलाप को स्वाभाविक ढंग से व्यक्त करता है, बिना उसे केवल ‘कड़वाहट’ या केवल ‘तेज़ आवाज़’ तक सीमित किए।
theological_decisions:
- issue: आराधना-संदर्भ में הָאֱלֹהִים का अनुवाद
  choice: परमेश्वर
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में הָאֱלֹהִים है, יהוה नहीं। इसलिए आराधना का संदर्भ होने पर भी वाचा-नाम को पाठ में नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। हिब्रू की तीव्रतावाचक सजातीय रचना को कृत्रिम ‘बड़ा रोना रोए’ के बजाय ‘फूट-फूटकर रोए’ से व्यक्त किया गया है।
