  text: וּ/רְאִיתֶ֗ם וְ֠/הִנֵּה אִם יֵ֨צְא֥וּ בְנוֹת שִׁילוֹ֮ לָ/ח֣וּל בַּ/מְּחֹלוֹת֒ וִֽ/יצָאתֶם֙ מִן הַ/כְּרָמִ֔ים וַ/חֲטַפְתֶּ֥ם לָ/כֶ֛ם אִ֥ישׁ אִשְׁתּ֖/וֹ מִ/בְּנ֣וֹת שִׁיל֑וֹ וַ/הֲלַכְתֶּ֖ם אֶ֥רֶץ בִּנְיָמִֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/021.yaml
  text: Watch[a], and behold, when the daughters of Shiloh come out to dance in the dances, then come out from the vineyards and seize for yourselves, each man his wife from the daughters of Shiloh, and go to the land of Benjamin.
translation:
  language: hi
  text: 'नज़र रखना, और देखो: जब शीलो की बेटियाँ नाचने के लिए निकलें, तब दाख की बारियों में से निकल आना और तुम में से हर एक शीलो की बेटियों में से अपने लिए एक पत्नी छीन ले[a]; फिर बिन्यामीन के देश चले जाना।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘झपट लेना’ अथवा ‘उठा ले जाना’; हिब्रू क्रिया बलपूर्वक किसी को ले लेने का बोध कराती है।
    reason: हिब्रू חטף के बलात्मक और अचानक ले जाने वाले वैकल्पिक अर्थों को पारदर्शी रखना।
lexical_decisions:
- source_word: וּרְאִיתֶם
  choice: ताकते रहना
  rationale: शाब्दिक अर्थ ‘और तुम देखोगे’ है, पर निर्देशों की इस शृंखला में यह चौकसी से देखने की आज्ञा है; घात लगाकर प्रतीक्षा करने के प्रसंग में ‘ताकते रहना’ स्वाभाविक है।
- source_word: וְהִנֵּה
  choice: और देखो
  rationale: मूल के ध्यान आकर्षित करने वाले संकेत को छोड़ा नहीं गया; आधुनिक हिन्दी में ‘और देखो’ उसका सहज, गरिमापूर्ण रूप है।
- source_word: אִם
  choice: जब
  rationale: रूप की दृष्टि से यह शर्तसूचक है, किन्तु योजनाबद्ध घटना के समय को बताने वाले इस प्रसंग में ‘जब’ अधिक स्वाभाविक है और आशय को अनावश्यक अनिश्चित नहीं बनाता।
- source_word: בְנוֹת שִׁילוֹ
  choice: शीलो की बेटियाँ
  rationale: मूल के सामाजिक-पारिवारिक मुहावरे को बनाए रखता है और आयु के विषय में ‘युवतियाँ’ जैसी अतिरिक्त व्याख्या नहीं जोड़ता।
- source_word: לָחוּל בַּמְּחֹלוֹת
  choice: नाचने के लिए नृत्यों में
  rationale: क्रिया और बहुवचन संज्ञा, दोनों को अभिव्यक्त करते हुए मूल की पुनरुक्ति-सदृश बनावट को यथासंभव सुरक्षित रखा गया है।
- source_word: וִיצָאתֶם מִן הַכְּרָמִים
  choice: तुम दाख की बारियों में से निकलना
  rationale: यह दाख की बारियों में छिपे पुरुषों के वहाँ से बाहर आने का निर्देश है; ‘में से निकलना’ स्थानिक अर्थ स्पष्ट करता है।
- source_word: וַחֲטַפְתֶּם
  choice: बलपूर्वक पकड़ लेना
  rationale: क्रिया वेग और बल से किसी को पकड़ लेने या उठा ले जाने को सूचित करती है। ‘बलपूर्वक पकड़ लेना’ हिंसक अर्थ स्पष्ट करता है, पर मुख्य पाठ में आधुनिक कानूनी शब्द नहीं जोड़ता।
- source_word: לָכֶם אִישׁ אִשְׁתּוֹ
  choice: हर एक अपने लिए एक पत्नी
  rationale: 'हिब्रू की वितरणात्मक रचना का स्वाभाविक हिन्दी रूप है: प्रत्येक पुरुष को एक पत्नी लेनी है।'
- source_word: אֶרֶץ בִּנְיָמִן
  choice: बिन्यामीन के प्रदेश में
  rationale: אֶרֶץ यहाँ बिन्यामीनियों के भूभाग को सूचित करता है; ‘प्रदेश’ आधुनिक हिन्दी में स्पष्ट है।
theological_decisions:
- issue: कार्रवाई का नैतिक और हिंसक स्वरूप
  choice: बलपूर्वक पकड़ लेना
  alternative: अपहरण कर लेना / उठा ले जाना
  rationale: पाठ इस कार्रवाई का आदेश उद्धृत करता है; अनुवाद उसे नैतिक स्वीकृति में नहीं बदलता। मूल क्रिया की बलपूर्वक लेने की तीव्रता मुख्य पाठ में रखी गई है, जबकि अधिक व्याख्यात्मक विकल्प पाद-टिप्पणी में दिए गए हैं।
- issue: लिंग और वितरणात्मक अभिव्यक्ति
  choice: हर एक अपने लिए एक पत्नी
  alternative: हर पुरुष अपनी पत्नी
  rationale: मूल का आशय प्रत्येक पुरुष द्वारा एक स्त्री को पत्नी के रूप में लेने से है। हिन्दी में चुना गया रूप वितरणात्मक अर्थ को स्पष्ट रखता है और ‘अपनी पत्नी’ कहकर पूर्ववर्ती वैवाहिक संबंध का भ्रम उत्पन्न नहीं करता।
- issue: शर्तसूचक אִם का प्रसंगगत समयार्थ
  choice: जब
  alternative: यदि
  rationale: मूल में औपचारिक शर्तसूचकता मौजूद है, पर यहाँ प्रत्याशित अवसर के आने का समय बताया जा रहा है। ‘जब’ प्रसंगगत अर्थ देता है; ‘यदि’ वास्तविक अनिश्चितता पर अधिक बल देता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किन्तु सुबोध निर्देशात्मक रूप। ‘दाख की बारियाँ’, ‘शीलो की बेटियाँ’ और ‘बिन्यामीन का प्रदेश’ मूल की सांस्कृतिक तथा भौगोलिक बनावट बनाए रखते हैं। मुख्य पाठ में हिंसा को न तो नरम किया गया है, न आधुनिक कानूनी वर्गीकरण से अधिक निर्धारित।
