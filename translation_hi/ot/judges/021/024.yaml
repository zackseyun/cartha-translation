base_translation:
  language: en
  yaml_path: translation/ot/judges/021/024.yaml
  text: Then the sons of Israel departed from there at that time[a], each man to his tribe and to his family, and they went out from there[b], each man to his inheritance.
translation:
  language: hi
  text: उस समय इस्राएली वहाँ से चले गए—हर एक अपने गोत्र और अपने कुल[a] के पास। वे वहाँ से निकल गए, और हर एक अपनी विरासत[b] में चला गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ ‘कुल’ का अर्थ निकट परिवार से व्यापक वंश या नातेदारी-समूह भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: अर्थात वह भू-भाग जो उसे विरासत में मिला था।
    reason: lexical_clarification
lexical_decisions:
- source_word: וַיִּתְהַלְּכוּ
  choice: चल दिए
  rationale: हित्पएल रूप यहाँ पैदल चलने की रीति पर नहीं, बल्कि सभा-स्थल से प्रस्थान करके बिखर जाने पर बल देता है; ‘चल दिए’ स्वाभाविक और प्रसंगानुकूल है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएली
  rationale: शाब्दिक ‘इस्राएल के पुत्र’ की अपेक्षा ‘इस्राएली’ आधुनिक हिन्दी में स्वाभाविक है और पूरे समुदाय को ठीक रूप से व्यक्त करता है।
- source_word: בָּעֵת הַהִיא
  choice: उस समय
  rationale: यह इब्रानी काल-सूचक पद का सीधा और स्वाभाविक अनुवाद है।
- source_word: אִישׁ
  choice: हर एक
  rationale: यहाँ אִישׁ वितरणात्मक अर्थ में है; ‘हर एक’ हिन्दी में स्वाभाविक रहते हुए प्रत्येक व्यक्ति पर बल बनाए रखता है।
- source_word: לְשִׁבְטוֹ
  choice: अपने गोत्र ... के पास
  rationale: שֵׁבֶט के लिए ‘गोत्र’ इस्राएल की जनजातीय-सामाजिक संरचना का स्थापित हिन्दी बाइबलीय पद है; हिन्दी वाक्य-विन्यास के कारण संबंधबोधक पद दोनों संज्ञाओं के बाद रखा गया है।
- source_word: וּלְמִשְׁפַּחְתּוֹ
  choice: अपने कुल
  rationale: מִשְׁפָּחָה यहाँ निकट परिवार से व्यापक नातेदारी-समूह को सूचित कर सकता है; ‘कुल’ इस सामाजिक अर्थ को ‘परिवार’ से अधिक ठीक रखता है।
- source_word: וַיֵּצְאוּ
  choice: निकलकर ... चला गया
  rationale: יצא का ‘निकलना’ रूपक सुरक्षित रखा गया है, जबकि एकवचन वितरणात्मक वाक्यांश ‘हर एक’ के साथ ‘चला गया’ स्वाभाविक हिन्दी देता है।
- source_word: לְנַחֲלָתוֹ
  choice: अपनी विरासत में
  rationale: נַחֲלָה कानूनी विरासत के साथ विशेषतः पैतृक भू-भाग को दर्शाता है; ‘विरासत’ मूल अर्थ की व्यापकता बनाए रखती है और भू-क्षेत्र का स्पष्टीकरण पादटिप्पणी में दिया गया है।
