  yaml_path: translation/ot/judges/021/015.yaml
  text: And the people grieved for Benjamin, because the LORD had made a breach among the tribes of Israel.
translation:
  language: hi
  text: और लोगों को बिन्यामीन के लिए दुःख हुआ, क्योंकि यहोवा ने इस्राएल के गोत्रों में दरार डाल दी थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נִחָם לְבִנְיָמִן
  choice: बिन्यामीन के लिए दुःख हुआ
  rationale: यहाँ נִחָם संदर्भ में बिन्यामीन की दशा पर शोक या दुःख व्यक्त करता है; यह अनुवाद कृपा या पश्चाताप जैसे अधिक विशिष्ट अर्थ थोपे बिना भाव को स्वाभाविक हिन्दी में रखता है।
- source_word: פֶּרֶץ
  choice: दरार
  rationale: इस शब्द का मूल बिंब टूटने, फटने या बीच में खाली स्थान बन जाने का है। ‘दरार’ इस्राएल के गोत्रों की एकता में आए विनाशकारी विच्छेद को बनाए रखता है।
- source_word: עָשָׂה
  choice: डाल दी थी
  rationale: ‘दरार’ के साथ आधुनिक हिन्दी में ‘दरार डालना’ स्वाभाविक प्रयोग है और हिब्रू के ‘बनाया/किया’ का अर्थगत बल सुरक्षित रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: व्यक्तिगत दिव्य नाम को हिन्दी बाइबल परंपरा में प्रचलित रूप ‘यहोवा’ से प्रस्तुत किया गया है, न कि उसे केवल उपाधि में बदलकर।
theological_decisions:
- issue: इस्राएल के गोत्रों में आए विच्छेद के लिए यहोवा को कर्ता बताना
  choice: 'प्रत्यक्ष कर्तृत्व बनाए रखा: ‘यहोवा ने ... दरार डाल दी थी’'
  alternative: ‘इस्राएल के गोत्रों में दरार पड़ गई थी’
  rationale: मूल पाठ עָשָׂה יְהוָה में यहोवा को स्पष्ट व्याकरणिक कर्ता बनाता है। इसकी धर्मवैचारिक कठिनाई को निष्क्रिय वाक्य द्वारा नरम नहीं किया गया।
- issue: נִחָם का भाव
  choice: ‘दुःख हुआ’
  alternative: ‘दया आई’ या ‘पछतावा हुआ’
  rationale: संदर्भ शेष बचे गोत्र के प्रति शोक को प्रमुख बनाता है, जबकि मूल क्रिया की भावगत व्यापकता के कारण अत्यधिक विशिष्ट धर्मवैचारिक निष्कर्ष नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और कथात्मक शैली। वाक्य की कारणात्मक संरचना तथा मूल पाठ का कठोर धर्मवैचारिक तनाव सुरक्षित रखा गया है।
