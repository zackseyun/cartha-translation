source:
  edition: WLC
  text: וַ/אֲנַ֗חְנוּ לֹ֥א נוּכַ֛ל לָ/תֵת לָ/הֶ֥ם נָשִׁ֖ים מִ/בְּנוֹתֵ֑י/נוּ כִּֽי נִשְׁבְּע֤וּ בְנֵֽי יִשְׂרָאֵל֙ לֵ/אמֹ֔ר אָר֕וּר נֹתֵ֥ן אִשָּׁ֖ה לְ/בִנְיָמִֽן־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/018.yaml
  text: But we cannot give them wives from our daughters[a], because the sons of Israel have sworn, saying, ‘Cursed is the one who gives a wife to Benjamin.’
translation:
  language: hi
  text: 'पर हम अपनी बेटियों में से उन्हें पत्नियाँ नहीं दे सकते, क्योंकि इस्राएल के पुत्रों ने यह शपथ खाई थी: “जो कोई बिन्यामीन[a] को पत्नी देगा, वह शापित है।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात् बिन्यामीन के गोत्र को, या बिन्यामीन गोत्र के किसी व्यक्ति को; इब्रानी में सीधे गोत्रनाम ‘बिन्यामीन’ आया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנַחְנוּ
  choice: पर हम
  rationale: संयोजक और स्वतंत्र सर्वनाम मिलकर विचार में विरोधात्मक मोड़ तथा कर्ता पर बल देते हैं; आधुनिक हिन्दी में ‘पर हम’ इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: לֹא נוּכַל
  choice: नहीं दे सकते
  rationale: יכל सामर्थ्य या संभावना बताता है। यहाँ असमर्थता शपथ के कारण है, पर मूल पाठ ‘वैधानिक रूप से’ जैसा अर्थ स्पष्टतः नहीं जोड़ता।
- source_word: נָשִׁים מִבְּנוֹתֵינוּ
  choice: अपनी बेटियों में से ... पत्नियाँ
  rationale: נָשִׁים विवाह-संदर्भ में ‘पत्नियाँ’ है और מן स्रोत/समूह में से चयन दर्शाता है; हिन्दी में यह पदक्रम स्पष्ट और स्वाभाविक है।
- source_word: נִשְׁבְּעוּ בְנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों ने यह शपथ खाई थी
  rationale: निफ़अल क्रिया शपथ खाने का अर्थ देती है। ‘खाई थी’ पूर्व में ली गई और वर्तमान प्रसंग में प्रभावी शपथ को दिखाता है; ‘इस्राएल के पुत्र’ मूल के औपचारिक पुरुषवाचक पद को बनाए रखता है।
- source_word: אָרוּר נֹתֵן אִשָּׁה
  choice: जो कोई ... पत्नी देगा, वह शापित हो
  rationale: कृदन्त נֹתֵן सामान्य एकवचन कर्ता को दर्शाता है। हिन्दी की संबंधवाचक संरचना उसके सार्वत्रिक भाव को स्वाभाविक ढंग से रखती है, और אָרוּר के न्यायिक/शापसूचक बल को ‘शापित हो’ व्यक्त करता है।
- source_word: לְבִנְיָמִן
  choice: बिन्यामीन को
  rationale: मूल पाठ सीधे गोत्रनाम का प्रयोग करता है। संक्षिप्त रूप को मुख्य पाठ में बनाए रखा गया है और संभावित स्पष्टार्थ पादटिप्पणी में दिए गए हैं।
