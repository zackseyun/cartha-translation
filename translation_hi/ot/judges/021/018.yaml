translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज कथात्मक शैली अपनाई गई है। शपथ की औपचारिकता बनाए रखते हुए अनावश्यक कानूनी या सम्प्रदायगत अर्थ नहीं जोड़ा गया है। पादटिप्पणी-चिह्न उद्धरण के बाद रखा गया है क्योंकि वह ‘बिन्यामीन’ के सामूहिक अर्थ को स्पष्ट करता है।
