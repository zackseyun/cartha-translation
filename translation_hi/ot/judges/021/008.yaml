  edition: WLC
  text: וַ/יֹּ֣אמְר֔וּ מִ֗י אֶחָד֙ מִ/שִּׁבְטֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁ֛ר לֹֽא עָלָ֥ה אֶל יְהוָ֖ה הַ/מִּצְפָּ֑ה וְ֠/הִנֵּה לֹ֣א בָא אִ֧ישׁ אֶל הַֽ/מַּחֲנֶ֛ה מִ/יָּבֵ֥ישׁ גִּלְעָ֖ד אֶל הַ/קָּהָֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/008.yaml
  text: And they said[a], “Which one of the tribes of Israel did not go up to Yahweh at Mizpah?” And behold, not a man from Jabesh-gilead had come to the camp[b], to the assembly.
translation:
  language: hi
  text: तब उन्होंने कहा, “इस्राएल के गोत्रों में से कौन-सा गोत्र मिस्पा में यहवे के पास नहीं गया था?[a]” और देखो, याबेश-गिलाद से एक भी पुरुष[b] छावनी में, सभा में नहीं आया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मिस्पा में यहवे के सामने नहीं गया था?” इब्रानी वाक्यांश का अर्थ सभा-स्थल पर यहवे के सामने उपस्थित होना भी हो सकता है।
    reason: alternative_reading
  - marker: b
    text: इब्रानी में शाब्दिक रूप से “एक भी पुरुष”; एकवचन पुल्लिंग रूप इस बात पर बल देता है कि याबेश-गिलाद का कोई भी पुरुष उपस्थित नहीं था।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: तब उन्होंने कहा
  rationale: वय्यिक्तोल कथा को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में स्वाभाविक कथात्मक क्रम व्यक्त करता है।
- source_word: מִי אֶחָד מִשִּׁבְטֵי יִשְׂרָאֵל
  choice: इस्राएल के गोत्रों में से कौन-सा गोत्र
  rationale: מִן पूरे समूह में से एक इकाई के चयन को दर्शाता है। हिन्दी में गोत्र को दोहराने से प्रश्न स्पष्ट और स्वाभाविक रहता है।
- source_word: לֹא עָלָה
  choice: नहीं आया था
  rationale: עלה में ऊपर जाने का मूल भाव है, पर सभा-स्थल पर पहुँचने के इस प्रसंग में ‘आया’ सहज हिन्दी है; पूर्वकालिक संदर्भ के कारण ‘था’ रखा गया है।
- source_word: אֶל יְהוָה הַמִּצְפָּה
  choice: मिस्पा में यहवे के पास
  rationale: אֶל का सीधा दिशात्मक भाव ‘के पास’ से रखा गया है और הַמִּצְפָּה को सभा के स्थान के रूप में ‘मिस्पा में’ कहा गया है।
- source_word: וְהִנֵּה
  choice: और देखो
  rationale: यह कथावाचक की ओर से ध्यान खींचकर एक उल्लेखनीय तथ्य प्रकट करता है; इसे छोड़ा नहीं गया है।
- source_word: לֹא בָא אִישׁ
  choice: एक भी पुरुष नहीं आया था
  rationale: नकार के साथ एकवचन אִישׁ प्रत्येक व्यक्ति की अनुपस्थिति पर बल देता है; ‘एक भी पुरुष’ उस जोर और लिंग-सूचना दोनों को बनाए रखता है।
- source_word: מִיָּבֵישׁ גִּלְעָד
  choice: याबेश-गिलाद से
  rationale: מִן उद्गम को दर्शाता है; स्थान-नाम को हिन्दी लिप्यंतरण में रखा गया है।
- source_word: אֶל הַמַּחֲנֶה ... אֶל הַקָּהָל
  choice: छावनी में, सभा में
  rationale: दोनों समानांतर पदों को बनाए रखते हुए हिन्दी में गंतव्य/उपस्थिति को स्वाभाविक रूप से ‘में’ द्वारा व्यक्त किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में वाचा का विशिष्ट नाम सीधे आया है। ‘यहवे’ उसका आधुनिक हिन्दी लिप्यंतरण है और उसे किसी उपाधि में नहीं बदलता।
- issue: אֶל יְהוָה का संबंध
  choice: यहवे के पास
  alternative: यहवे के सामने
  rationale: मुख्य पाठ אֶל का दिशात्मक अर्थ बनाए रखता है, जबकि प्रसंग में यह यहवे के सामने सभा में उपस्थित होने का भाव भी दे सकता है; इस वास्तविक अस्पष्टता को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज शैली रखी गई है। ‘गोत्र’, ‘छावनी’ और ‘सभा’ प्रसंग के सामुदायिक-सांस्कृतिक स्वर को स्पष्ट रखते हैं; ‘और देखो’ मूल के ध्यानाकर्षक कथात्मक संकेत को सुरक्षित रखता है।
