  terminology: “इस्राएल के पुत्र,” “भाई,” and “गोत्र” appropriately preserve the source’s familial and tribal register. The footnote should not specify “अपने किए पर खेद,” since the lexical alternative of relenting does not itself require regret for one’s own action in this context.
  issues:
  - severity: low
    issue: 'Less natural wording: “शोकित हुए.”'
    rationale: Modern Hindi more naturally says “दुःखी हुए” (or “शोक किया”) in this context.
  - severity: medium
    issue: Footnote overdefines the alternative sense as “अपने किए पर खेद.”
    rationale: The verb may denote relenting or a change of disposition in other contexts; wording it as regret for one’s own deeds adds an element not inherent in the lexical alternative.
