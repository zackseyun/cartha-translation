base_translation:
  language: en
  yaml_path: translation/ot/judges/021/006.yaml
  text: And the sons of Israel grieved over Benjamin their brother[a], and they said, “Today one tribe has been cut off from Israel.”
translation:
  language: hi
  text: तब इस्राएल के पुत्र अपने भाई बिन्यामीन के लिए दुःखी हुए[a], और उन्होंने कहा, “आज इस्राएल में से एक गोत्र कट गया है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपने भाई बिन्यामीन पर दया की” अथवा “अपने भाई बिन्यामीन के लिए शोक किया।” इब्रानी क्रिया प्रसंग के अनुसार दुःख, दया, या मन बदलने का अर्थ दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּנָּחֲמוּ
  choice: शोकित हुए
  rationale: निफ़अल रूप यहाँ बिन्यामीन के लगभग नष्ट हो जाने पर दुःख या करुणा व्यक्त करता है। ‘शोकित हुए’ प्रसंग में स्वाभाविक है, जबकि अर्थ में करुणा या खेद की छाया भी संभव है और उसे पादटिप्पणी में रखा गया है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्र
  rationale: यह इब्रानी की पारिवारिक और सामूहिक अभिव्यक्ति को सुरक्षित रखता है तथा आधुनिक हिन्दी में समझने योग्य है।
- source_word: אֶל
  choice: के लिए
  rationale: נחם के साथ यह दुःख या करुणा के विषय को चिह्नित करता है; हिन्दी में ‘के लिए शोकित हुए’ स्वाभाविक संबंध व्यक्त करता है।
- source_word: בִּנְיָמִן אָחִיו
  choice: अपने भाई बिन्यामीन
  rationale: एकवचन प्रत्यय बहुवचन सामूहिक कर्ता के साथ बिन्यामीन को इस्राएलियों के जातीय भाई के रूप में प्रस्तुत करता है।
- source_word: נִגְדַּע
  choice: कट गया है
  rationale: यह גדע के काटे जाने के रूपक और उसकी गंभीरता को बनाए रखता है, बिना पूर्ण विनाश को आवश्यकता से अधिक स्पष्ट किए।
- source_word: הַיּוֹם
  choice: आज
  rationale: यह समय की तात्कालिकता को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: שֵׁבֶט אֶחָד
  choice: एक गोत्र
  rationale: ‘गोत्र’ इस्राएल की जनजातीय इकाई के लिए प्रचलित और संक्षिप्त बाइबिलीय हिन्दी शब्द है।
- source_word: מִיִּשְׂרָאֵל
  choice: इस्राएल में से
  rationale: यह अलगाव सूचक מִן को स्पष्ट करता है—एक गोत्र इस्राएल के सामूहिक निकाय में से कट गया है।
