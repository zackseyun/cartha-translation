  text: וְ/אִ֣ישׁ יִשְׂרָאֵ֔ל נִשְׁבַּ֥ע בַּ/מִּצְפָּ֖ה לֵ/אמֹ֑ר אִ֣ישׁ מִמֶּ֔/נּוּ לֹא יִתֵּ֥ן בִּתּ֛/וֹ לְ/בִנְיָמִ֖ן לְ/אִשָּֽׁה־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/001.yaml
  text: The men of Israel had sworn at Mizpah[a], saying, “No man among us shall give his daughter to Benjamin as a wife.”
translation:
  language: hi
  text: 'इस्राएल के पुरुषों ने मिस्पा में शपथ खाई थी: “हममें से कोई पुरुष अपनी बेटी बिन्यामीन[a] को पत्नी बनाने के लिए नहीं देगा।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में ‘बिन्यामीन को’ का अर्थ संभवतः ‘बिन्यामीन के गोत्र को’ या ‘किसी बिन्यामी व्यक्ति को’ है।
    reason: लְבִנְיָמִן नाम का प्रयोग यहाँ गोत्र के लिए अथवा उस गोत्र के किसी व्यक्ति के लिए हो सकता है; पादटिप्पणी मूल की इस संक्षिप्तता को स्पष्ट करती है।
lexical_decisions:
- source_word: וְאִישׁ יִשְׂרָאֵל
  choice: इस्राएल के पुरुषों ने
  rationale: रूप की दृष्टि से אִישׁ एकवचन है, पर यहाँ यह इस्राएली पुरुषों के समुदाय के लिए सामूहिक अर्थ में प्रयुक्त है। अध्याय के आरम्भ में וְ को अलग संयोजक शब्द से व्यक्त करना स्वाभाविक हिन्दी में आवश्यक नहीं।
- source_word: נִשְׁבַּע
  choice: शपथ खाई थी
  rationale: निफ़अल रूप का अर्थ ‘शपथ खाना’ है। पूर्वपूर्ण काल कथानक में इस शपथ के पहले लिए जा चुकने को स्पष्ट करता है।
- source_word: בַּמִּצְפָּה
  choice: मिस्पा में
  rationale: स्थानवाचक בְּ और नगरनाम का स्वाभाविक हिन्दी रूप ‘मिस्पा में’ है।
- source_word: לֵאמֹר
  choice: 'यह ... :'
  rationale: इब्रानी उद्धरण-सूचक को हिन्दी में ‘यह शपथ खाई थी:’ द्वारा स्वाभाविक रूप से समाहित किया गया है।
- source_word: אִישׁ מִמֶּנּוּ
  choice: हममें से कोई भी
  rationale: वाक्यांश का वितरणात्मक निषेध व्यक्त होता है; आधुनिक हिन्दी में यह स्पष्ट और स्वाभाविक है।
- source_word: לֹא יִתֵּן
  choice: नहीं देगा
  rationale: नकारयुक्त अपूर्ण क्रिया शपथ के भीतर भविष्य के लिए बाध्यकारी संकल्प व्यक्त करती है; उद्धरण का संदर्भ इसकी गंभीरता बनाए रखता है।
- source_word: בִּתּוֹ
  choice: अपनी बेटी
  rationale: कर्ता-सापेक्ष स्वामित्व के लिए हिन्दी में ‘अपनी’ स्वाभाविक है और इब्रानी एकवचन संबंध को सुरक्षित रखता है।
- source_word: לְבִנְיָמִן
  choice: किसी बिन्यामी को
  rationale: ‘बिन्यामीन’ यहाँ गोत्र के व्यक्ति या गोत्र को सामूहिक रूप से सूचित करता है। विवाह के व्यक्तिगत संदर्भ में ‘किसी बिन्यामी को’ आशय को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: לְאִשָּׁה
  choice: पत्नी के रूप में
  rationale: यह विवाह में देकर पत्नी बनाने की सामान्य इब्रानी अभिव्यक्ति है; हिन्दी रूप अर्थ और भूमिका दोनों बनाए रखता है।
