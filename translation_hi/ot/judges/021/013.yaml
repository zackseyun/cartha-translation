  text: Then the whole congregation sent word and spoke to the sons of Benjamin who were at the rock of Rimmon[a], and proclaimed peace to them.
translation:
  language: hi
  text: तब सारी सभा ने रिम्मोन की चट्टान पर ठहरे बिन्यामीनियों[a] के पास संदेश भेजकर उनसे बात की और उन्हें शांति का संदेश दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सेला-रिम्मोन में ठहरे बिन्यामीनियों”; इब्रानी पदबंध को वर्णनात्मक रूप में “रिम्मोन की चट्टान” अथवा एक स्थिर स्थान-नाम के रूप में समझा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁלְחוּ
  choice: संदेश भेजकर
  rationale: मूल क्रिया का सामान्य अर्थ ‘भेजना’ है; अगले पदबंध ‘उनसे बात की’ के साथ इसका आशय संवाद स्थापित करने के लिए भेजना है। ‘संदेश भेजकर’ हिन्दी में स्वाभाविक है और मूल में स्पष्ट न किए गए ‘दूतों’ को नहीं जोड़ता।
- source_word: כָּל הָעֵדָה
  choice: सारी सभा
  rationale: עֵדָה यहाँ इस्राएल के एकत्र समुदाय को दर्शाता है; ‘सारी सभा’ सामुदायिक और समष्टिगत अर्थ को सहज आधुनिक हिन्दी में रखता है।
- source_word: וַיְדַבְּרוּ אֶל
  choice: उनसे बात की
  rationale: דבר אל का सीधा अर्थ ‘से/को बात करना’ है। ‘उनसे बात की’ प्रसंग में स्वाभाविक हिन्दी है।
- source_word: בְּנֵי בִנְיָמִן
  choice: बिन्यामीनी
  rationale: शाब्दिक अर्थ ‘बिन्यामीन के पुत्र’ है, पर यहाँ यह गोत्र के लोगों के लिए जातिवाचक अभिव्यक्ति है। ‘बिन्यामीनी’ आधुनिक हिन्दी में स्पष्ट और संक्षिप्त है।
- source_word: אֲשֶׁר בְּסֶלַע רִמּוֹן
  choice: रिम्मोन की चट्टान पर ठहरे
  rationale: סֶלַע का अर्थ ‘चट्टान/शैल’ है और רִמּוֹן नामसूचक तत्व है। क्रिया का अध्याहार हिन्दी में ‘ठहरे’ से किया गया है; स्थान को स्थिर नाम ‘सेला-रिम्मोन’ मानना भी सम्भव है, इसलिए वैकल्पिक समझ पादटिप्पणी में रखी गई है।
- source_word: וַיִּקְרְאוּ לָהֶם שָׁלוֹם
  choice: उनके लिए शान्ति की घोषणा की
  rationale: קרא + ל + שׁלום औपचारिक रूप से शान्तिपूर्ण सम्बन्ध घोषित करने का भाव देता है। ‘शान्ति की घोषणा’ सार्वजनिक और घोषणात्मक बल को बनाए रखती है।
- source_word: שָׁלוֹם
  choice: शान्ति
  rationale: यहाँ अर्थ केवल कुशल-मंगल नहीं, बल्कि वैर की समाप्ति और शान्तिपूर्ण सम्बन्ध है; ‘शान्ति’ इस व्यापक अर्थ को बनाए रखता है।
