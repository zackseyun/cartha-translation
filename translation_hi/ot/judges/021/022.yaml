  text: וְ/הָיָ֡ה כִּֽי יָבֹ֣אוּ אֲבוֹתָ/ם֩ א֨וֹ אֲחֵי/הֶ֜ם ל/רוב אֵלֵ֗י/נוּ וְ/אָמַ֤רְנוּ אֲלֵי/הֶם֙ חָנּ֣וּ/נוּ אוֹתָ֔/ם כִּ֣י לֹ֥א לָקַ֛חְנוּ אִ֥ישׁ אִשְׁתּ֖/וֹ בַּ/מִּלְחָמָ֑ה כִּ֣י לֹ֥א אַתֶּ֛ם נְתַתֶּ֥ם לָ/הֶ֖ם כָּ/עֵ֥ת תֶּאְשָֽׁמוּ־׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/022.yaml
  text: And it shall be[a], when their fathers or their brothers come to contend with us, that we will say to them, ‘Show us favor concerning them, because we did not take for each man his wife in the battle; for you did not give them to them[e][d][c][b], at this time, so that you should incur guilt.’
translation:
  language: hi
  text: और जब उनके पिता या भाई हमसे विवाद करने आएँगे[a], तब हम उनसे कहेंगे, ‘इन स्त्रियों के विषय में हम पर दया कीजिए[b], क्योंकि युद्ध में हम हर एक पुरुष के लिए पत्नी नहीं ले सके थे[c]। क्योंकि तुमने इन्हें उन पुरुषों को नहीं दिया था[d], इसलिए अब तुम दोषी नहीं ठहरोगे[e]।’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “हमसे शिकायत करने” अथवा “हमारे विरुद्ध अपना मामला लेकर आने।”
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से “इनके विषय में हम पर अनुग्रह कीजिए”; निवेदन यह है कि स्त्रियों के मामले में वक्ताओं के साथ नरमी बरती जाए।
    reason: lexical_alternative
  - marker: c
    text: 'इब्रानी वाक्य बहुत संक्षिप्त है: “हमने युद्ध में हर पुरुष की पत्नी नहीं ली।” संभवतः आशय है कि युद्ध में बिन्यामीन के हर पुरुष के लिए पर्याप्त पत्नियाँ नहीं मिली थीं।'
    reason: cultural_note
  - marker: d
    text: इब्रानी में दो सर्वनाम संक्षेप में दोहराए गए हैं; अर्थ है, “तुमने उन स्त्रियों को उन पुरुषों को नहीं दिया था।”
    reason: lexical_alternative
  - marker: e
    text: अंतिम उपवाक्य का इब्रानी कठिन है। प्रसंग में संभवतः आशय यह है कि परिवारों ने स्त्रियों को विधिवत नहीं दिया था; इसलिए वे अपनी शपथ तोड़ने के दोषी नहीं माने जाते। इसे “नहीं तो अब तुम दोषी ठहरते” भी समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לָרִיב
  choice: हमसे विवाद करने
  rationale: ריב में झगड़ने, शिकायत करने या अपना पक्ष लेकर विवाद करने का भाव है। ‘विवाद करने’ उसके प्रतिकूल भाव को बनाए रखता है, पर अनावश्यक रूप से औपचारिक कानूनी मुकदमे का अर्थ नहीं जोड़ता।
- source_word: חָנּוּנוּ אוֹתָם
  choice: इन स्त्रियों के विषय में हम पर कृपा कीजिए
  rationale: חנן का बहुवचन आज्ञार्थक रूप, प्रथम-पुरुष बहुवचन प्रत्यय के साथ, शाब्दिक रूप से ‘हम पर कृपा कीजिए’ है; אוֹתָם उस कृपा का विषय बताता है। यह अनुग्रह की अपील और स्त्रियों से उसका संबंध दोनों सुरक्षित रखता है।
- source_word: לֹא לָקַחְנוּ אִישׁ אִשְׁתּוֹ בַּמִּלְחָמָה
  choice: युद्ध में हम हर एक पुरुष के लिए पत्नी नहीं ले पाए थे
  rationale: इब्रानी वाक्य संक्षिप्त और कठिन है। प्रसंग में आशय यह है कि युद्ध से हर बिन्यामीनी पुरुष के लिए पत्नी उपलब्ध नहीं हुई थी। ‘नहीं ले पाए थे’ इस अभाव को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि टिप्पणी में मूल की संक्षिप्तता बताई गई है।
- source_word: לֹא אַתֶּם נְתַתֶּם לָהֶם
  choice: तुमने स्वयं इन्हें उन पुरुषों को नहीं दिया था
  rationale: बलाघाती אַתֶּם को ‘स्वयं’ से व्यक्त किया गया है। ‘इन्हें’ स्त्रियों और ‘उन पुरुषों को’ बिन्यामीनियों को स्पष्ट करता है, जिससे इब्रानी के दो अलग सर्वनाम-संदर्भ हिन्दी में अस्पष्ट नहीं होते।
- source_word: כָּעֵת תֶּאְשָׁמוּ
  choice: नहीं तो अब तुम दोषी ठहरते
  rationale: अंतिम पदबंध कठिन है। प्रसंगगत तर्क यह है कि परिवारों ने स्त्रियाँ औपचारिक रूप से नहीं दीं, इसलिए उनकी शपथ के अनुसार उन पर दोष नहीं आता। ‘अब’ כָּעֵת का कालगत भाव और ‘दोषी ठहरते’ אשם का दोषभाव बनाए रखता है।
theological_decisions:
- issue: परिवारों के दोष और उनकी शपथ के बीच संबंध
  choice: 'अंतिम उपवाक्य को शर्त के विपरीत परिणाम के रूप में व्यक्त किया गया: ‘नहीं तो अब तुम दोषी ठहरते।’'
  alternative: ‘इस समय तुम दोषी ठहरोगे’ जैसा अधिक शाब्दिक, पर प्रसंग में भ्रामक पाठ।
  rationale: इब्रानी कठिन और अत्यंत संक्षिप्त है, पर प्रसंग में वक्ताओं का दावा है कि अपहरण परिवारों द्वारा विवाह में देने के समान नहीं था; अनुवाद इसी तर्क को व्यक्त करता है, उसे नैतिक अनुमोदन में नहीं बदलता।
- issue: स्त्रियों को पकड़ ले जाने की नैतिक स्थिति
  choice: वर्णन और पात्रों की दलील को बिना अतिरिक्त नैतिक अनुमोदन या निंदा जोड़े प्रस्तुत किया गया।
  alternative: पाठ में स्पष्ट अनुमोदन अथवा निंदा जोड़ना।
  rationale: यह पद पात्रों की प्रस्तावित सफाई बताता है; मूल पाठ यहाँ स्वयं कोई स्पष्ट नैतिक निर्णय नहीं सुनाता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज शैली रखी गई है। संवाद में बहुवचन ‘तुम’ मूल के संबोधन को स्वाभाविक रूप से व्यक्त करता है। कठिन इब्रानी को मुख्य पाठ में पठनीय बनाया गया है और वास्तविक अस्पष्टताएँ पादटिप्पणियों में सुरक्षित रखी गई हैं।
