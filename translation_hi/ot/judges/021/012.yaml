  text: וַֽ/יִּמְצְא֞וּ מִ/יּוֹשְׁבֵ֣י יָבֵ֣ישׁ גִּלְעָ֗ד אַרְבַּ֤ע מֵאוֹת֙ נַעֲרָ֣ה בְתוּלָ֔ה אֲשֶׁ֧ר לֹֽא יָדְעָ֛ה אִ֖ישׁ לְ/מִשְׁכַּ֣ב זָכָ֑ר וַ/יָּבִ֨יאוּ אוֹתָ֤/ם אֶל הַֽ/מַּחֲנֶה֙ שִׁלֹ֔ה אֲשֶׁ֖ר בְּ/אֶ֥רֶץ כְּנָֽעַן׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/012.yaml
  text: And from the inhabitants of Jabesh-gilead they found four hundred young women, virgins, who had not known a man by lying with a male; and they brought them to the camp at Shiloh, which is in the land of Canaan.
translation:
  language: hi
  text: उन्होंने याबेश-गिलाद के निवासियों में से चार सौ युवतियाँ पाईं, जो कुँवारियाँ थीं और जिन्होंने किसी पुरुष के साथ शयन करके उसे नहीं जाना था। वे उन्हें कनान देश में स्थित शीलो की छावनी में ले आए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִיּוֹשְׁבֵי יָבֵישׁ גִּלְעָד
  choice: याबेश-गिलाद के निवासियों में से
  rationale: מִן के स्रोत/समूह-सूचक अर्थ को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: נַעֲרָה בְתוּלָה
  choice: युवतियाँ ... जो कुँवारियाँ थीं
  rationale: दोनों संज्ञात्मक तत्वों—युवती और कुँवारी—को अलग-अलग व्यक्त करता है, बिना उन्हें एक ही विशेषण में समेटे।
- source_word: לֹא יָדְעָה אִישׁ לְמִשְׁכַּב זָכָר
  choice: जिन्होंने किसी पुरुष के साथ शयन करके उसे नहीं जाना था
  rationale: ידע के शाब्दिक 'जानना' और उसके यौन आशय, दोनों को मूल की स्पष्टकारी अभिव्यक्ति के साथ बनाए रखता है।
- source_word: הַמַּחֲנֶה
  choice: छावनी
  rationale: सैन्य/सामुदायिक पड़ाव के अर्थ को प्रसंगानुकूल और संक्षिप्त रूप में व्यक्त करता है।
- source_word: שִׁלֹה
  choice: शीलो
  rationale: स्थान-नाम का प्रचलित हिन्दी लिप्यंतरण।
theological_decisions:
- issue: ‘जानना’ के यौन मुहावरे का अनुवाद
  choice: शाब्दिक ‘जानना’ को ‘पुरुष के साथ शयन करके’ से स्पष्ट किया गया
  alternative: ‘जिनके किसी पुरुष से यौन-संबंध नहीं हुए थे’
  rationale: मूल इब्रानी की असामान्य और जोरदार दोहरी अभिव्यक्ति को सपाट व्याख्या में बदलने के बजाय उसकी संरचना और आशय दोनों सुरक्षित रखे गए हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी; वर्णनात्मक, गरिमापूर्ण और मूल की कठोर स्पष्टता को बिना नरम किए स्वाभाविक वाक्य-विन्यास में प्रस्तुत किया गया है।
