source:
  edition: WLC
  text: וַ/יֹּ֣אמְר֔וּ יְרֻשַּׁ֥ת פְּלֵיטָ֖ה לְ/בִנְיָמִ֑ן וְ/לֹֽא יִמָּחֶ֥ה שֵׁ֖בֶט מִ/יִּשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/017.yaml
  text: And they said[a], “There must be an inheritance for the survivors of Benjamin, so that a tribe may not be blotted out from Israel.”
translation:
  language: hi
  text: और उन्होंने कहा[a], “बिन्यामीन के बचे हुओं के लिए पैतृक भाग होना चाहिए, ताकि इस्राएल में से कोई गोत्र मिट न जाए।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बिन्यामीन के लिए बचा हुआ भाग” अथवा “बिन्यामीन के बचे हुओं का पैतृक भाग।” इब्रानी में “पैतृक भाग” और “बचे हुए/बचे लोग” संक्षेप में साथ रखे गए हैं, इसलिए दोनों का ठीक संबंध एक से अधिक प्रकार से व्यक्त किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: और उन्होंने कहा
  rationale: वय्यिक्तोल कथात्मक क्रम को सहज हिन्दी में बनाए रखता है और सामूहिक वक्ताओं का परिचय देता है।
- source_word: יְרֻשַּׁת
  choice: पैतृक भाग
  rationale: यह ירש से बना संज्ञा-रूप है और वंशानुगत संपत्ति अथवा हिस्से को सूचित करता है; भूमि और गोत्रीय निरंतरता के प्रसंग में ‘पैतृक भाग’ स्वाभाविक और स्पष्ट है।
- source_word: פְּלֵיטָה
  choice: बचे हुओं
  rationale: यह बच निकलने वाले जीवित लोगों अथवा शेष बचे समुदाय को दर्शाता है; यहाँ लगभग नष्ट हो चुके बिन्यामीन गोत्र के जीवित पुरुष अभिप्रेत हैं।
- source_word: לְבִנְיָמִן
  choice: बिन्यामीन के ... लिए
  rationale: लामेद को लाभार्थक अर्थ में व्यक्त किया गया है, जबकि ‘बचे हुओं’ के साथ संबंध भी हिन्दी वाक्य में स्पष्ट रहता है।
- source_word: וְלֹא יִמָּחֶה
  choice: ताकि ... मिट न जाए
  rationale: מחה के निफ़ाल का अर्थ मिटा दिया जाना या अस्तित्व से समाप्त होना है; प्रसंग में निहित उद्देश्य को ‘ताकि’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: שֵׁבֶט
  choice: कोई गोत्र
  rationale: इस्राएल की एक जनजातीय इकाई के लिए पारंपरिक और समझने योग्य हिन्दी शब्द ‘गोत्र’ है; निषेधात्मक वाक्य में अनिश्चित रूप को ‘कोई’ सहजता से दर्शाता है।
- source_word: מִיִּשְׂרָאֵל
  choice: इस्राएल में से
  rationale: वियोगसूचक מן को इस प्रकार व्यक्त करने से इस्राएल के समुदाय में से किसी गोत्र के लुप्त होने का भाव स्पष्ट रहता है।
theological_decisions:
- issue: יְרֻשַּׁת פְּלֵיטָה की संक्षिप्त और अस्पष्ट संज्ञा-रचना
  choice: बिन्यामीन के बचे हुओं के लिए पैतृक भाग
  alternative: बिन्यामीन के लिए बचा हुआ भाग; बिन्यामीन के बचे हुओं का पैतृक भाग
  rationale: इब्रानी में ‘पैतृक भाग’ और ‘बचे हुए/बचे लोग’ पास-पास रखे गए हैं और उनका सटीक व्याकरणिक संबंध संक्षिप्त है। मुख्य पाठ में प्रसंगानुकूल लाभार्थक अर्थ चुना गया है, पर पादटिप्पणी में वास्तविक विकल्प सुरक्षित रखे गए हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण कथात्मक रूप अपनाया गया है। ‘पैतृक भाग’ भूमि और वंशगत अधिकार दोनों के प्रसंग को स्पष्ट करता है; ‘मिट न जाए’ मूल की तीव्रता को स्वाभाविक हिन्दी में बनाए रखता है।
