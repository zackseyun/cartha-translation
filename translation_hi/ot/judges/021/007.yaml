  text: מַה נַּעֲשֶׂ֥ה לָ/הֶ֛ם לַ/נּוֹתָרִ֖ים לְ/נָשִׁ֑ים וַ/אֲנַ֨חְנוּ֙ נִשְׁבַּ֣עְנוּ בַֽ/יהוָ֔ה לְ/בִלְתִּ֛י תֵּת לָ/הֶ֥ם מִ/בְּנוֹתֵ֖י/נוּ לְ/נָשִֽׁים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/007.yaml
  text: What shall we do for them—for those who remain—to get wives? For we have sworn by Yahweh not to give them any of our daughters as wives.
translation:
  language: hi
  text: जो लोग बच गए हैं, उन्हें पत्नियाँ दिलाने के लिए हम क्या करें?[a] क्योंकि हमने याहवे की शपथ खाई है कि हम उन्हें अपनी बेटियों में से किसी को भी पत्नी के रूप में नहीं देंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से “पत्नियों के लिए”; यहाँ “दिलाने के लिए” प्रसंग में निहित अर्थ को स्पष्ट करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה נַּעֲשֶׂה
  choice: हम क्या करें?
  rationale: प्रश्नवाचक מַה और प्रथम पुरुष बहुवचन अपूर्ण क्रिया यहाँ विचार-विमर्श और भावी कार्यवाही का भाव देते हैं; हिंदी में “हम क्या करें?” इसका स्वाभाविक समतुल्य है।
- source_word: לָהֶם לַנּוֹתָרִים
  choice: जो लोग बच गए हैं, उन्हें
  rationale: לַנּוֹתָרִים बिन्यामीन के बचे हुए पुरुषों को दर्शाता है और לָהֶם उनके हित अथवा संबंध में की जाने वाली कार्यवाही को। हिंदी में आश्रित उपवाक्य के साथ यह संदर्भ स्पष्ट और स्वाभाविक रहता है।
- source_word: לְנָשִׁים
  choice: पत्नियाँ दिलाने के लिए
  rationale: पहला לְנָשִׁים शाब्दिक रूप से “पत्नियों के लिए” है, पर वाक्य में क्रिया निहित है। प्रसंग के अनुसार हिंदी में “पत्नियाँ दिलाने के लिए” उस निहित उद्देश्य को स्पष्ट करता है; शाब्दिक रूप पाद-टिप्पणी में दिया गया है।
- source_word: וַאֲנַחְנוּ נִשְׁבַּעְנוּ בַיהוָה
  choice: क्योंकि हमने याहवे की शपथ खाई है
  rationale: वाव यहाँ पूर्ववर्ती दुविधा का कारण बताता है, इसलिए “क्योंकि” उपयुक्त है। पूर्ण क्रिया का परिणाम अभी बाध्यकारी है। בַיהוָה शपथ के सूत्र में ईश्वरीय नाम के द्वारा शपथ खाने को व्यक्त करता है।
- source_word: לְבִלְתִּי תֵּת לָהֶם מִבְּנוֹתֵינוּ לְנָשִׁים
  choice: हम अपनी बेटियों में से किसी को भी उनकी पत्नी के रूप में नहीं देंगे
  rationale: לְבִלְתִּי תֵּת शपथ की निषेधात्मक विषयवस्तु है। מן का अंशवाचक बल “में से किसी को भी” से आता है, और दूसरा לְנָשִׁים विवाह की स्थिति को “पत्नी के रूप में” व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत वाचा-नाम सीधे आया है। “याहवे” उसे शीर्षक में बदलने के बजाय नाम के रूप में प्रस्तुत करता है; वैकल्पिक पारंपरिक रूपों को मुख्य पाठ में नहीं मिलाया गया।
translation_notes:
  register: आधुनिक मानक हिंदी; भाषा सहज किंतु गरिमापूर्ण रखी गई है। “बच गए हैं” सामान्य पाठक के लिए स्पष्ट है, जबकि “शेष जन” या “बचे हुए लोग” जैसे अधिक औपचारिक विकल्पों की अपेक्षा कम कृत्रिम लगता है।
