base_translation:
  language: en
  yaml_path: translation/ot/judges/021/004.yaml
  text: And the next day the people rose early[a], built an altar there, and offered burnt offerings and peace offerings.
translation:
  language: hi
  text: अगले दिन लोग तड़के उठे, वहाँ एक वेदी बनाई, और होमबलियाँ तथा मेलबलियाँ[a] चढ़ाईं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “शांति-बलियाँ,” “सहभागिता की बलियाँ,” अथवा “कुशल-क्षेम की बलियाँ।” इब्रानी शब्द ऐसी बलियों की श्रेणी को दर्शाता है जो शांति, कुशल-क्षेम और सामुदायिक सहभागिता से जुड़ी थीं।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי מִמָּחֳרָת
  choice: अगले दिन
  rationale: इब्रानी कथात्मक सूत्र का शाब्दिक अर्थ ‘और ऐसा हुआ कि अगले दिन’ है; स्वाभाविक आधुनिक हिन्दी में ‘अगले दिन’ समय-संबंध को पूरा व्यक्त करता है।
- source_word: וַיַּשְׁכִּימוּ
  choice: तड़के उठे
  rationale: क्रिया में सवेरे जल्दी उठने का स्पष्ट भाव है; ‘तड़के उठे’ इसे संक्षेप और स्वाभाविक ढंग से रखता है।
- source_word: הָעָם
  choice: लोग
  rationale: मूल में सामान्य संज्ञा ‘लोग/प्रजा’ है। संदर्भ में ये इस्राएली हैं, पर मूल यहाँ उनका नाम स्पष्ट रूप से नहीं देता।
- source_word: וַיִּבְנוּ שָׁם מִזְבֵּחַ
  choice: उन्होंने वहाँ एक वेदी बनाई
  rationale: यह सामान्य हिन्दी शब्दक्रम में सभी मूल तत्त्वों, विशेषकर स्पष्ट स्थानवाचक ‘वहाँ’, को सुरक्षित रखता है।
- source_word: וַיַּעֲלוּ
  choice: चढ़ाईं
  rationale: बलिदान-संबंधी प्रसंग में यह क्रिया अर्पण चढ़ाने के प्रचलित अर्थ में है; स्त्रीलिंग बहुवचन रूप ‘बलियाँ’ के अनुसार ‘चढ़ाईं’ स्वाभाविक है।
- source_word: עֹלוֹת
  choice: होमबलियाँ
  rationale: यह उस बलिदान का मानक हिन्दी पद है जो पूर्णतः जलाकर चढ़ाया जाता था।
- source_word: וּשְׁלָמִים
  choice: मेलबलियाँ
  rationale: यह स्थापित हिन्दी बाइबलीय पद है और इब्रानी शब्द में निहित शांति, कुशल और सहभागिता के संबंधपरक भाव को संक्षेप में व्यक्त करता है; अर्थ-विस्तार पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: बलिदानों की पारिभाषिक शब्दावली
  choice: होमबलियाँ और मेलबलियाँ
  alternative: पूरी तरह जलाई जाने वाली बलियाँ और शांति/सहभागिता की बलियाँ
  rationale: मूल पाठ दो सुविदित इस्राएली बलिदान-श्रेणियों के नाम देता है, उनका धर्मशास्त्रीय अर्थ नहीं खोलता। इसलिए संक्षिप्त पारिभाषिक पद रखे गए हैं और שְׁלָמִים की व्यापक अर्थ-छाया पादटिप्पणी में सुरक्षित की गई है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘तड़के’ सहज समय-सूचक है; ‘वेदी,’ ‘होमबलियाँ’ और ‘मेलबलियाँ’ प्रचलित धार्मिक शब्दावली हैं। मूल के क्रम और संक्षिप्त कथात्मक प्रवाह को बनाए रखते हुए हिन्दी में आवश्यक कर्ता ‘उन्होंने’ जोड़ा गया है।
