language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּ֣אמְר֔וּ לָ/מָ֗ה יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל הָ֥יְתָה זֹּ֖את בְּ/יִשְׂרָאֵ֑ל לְ/הִפָּקֵ֥ד הַ/יּ֛וֹם מִ/יִּשְׂרָאֵ֖ל שֵׁ֥בֶט אֶחָֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/003.yaml
  text: And they said[a], “Why, O Yahweh, God of Israel, has this happened in Israel[b], that today one tribe should be lacking from Israel?”
translation:
  language: hi
  text: और उन्होंने कहा, “हे याहवे, इस्राएल के परमेश्वर, इस्राएल में ऐसा क्यों हुआ कि आज इस्राएल में से एक गोत्र घट जाए?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: और उन्होंने कहा
  rationale: वय्यिक्तोल कथा के अगले क्रमिक कार्य को प्रस्तुत करता है; यह रूप स्वाभाविक हिंदी में कथात्मक प्रवाह बनाए रखता है।
- source_word: לָמָה
  choice: क्यों
  rationale: यह विलाप और प्रश्न व्यक्त करने वाला सीधा प्रश्नवाचक है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम को किसी उपाधि से बदलने के बजाय हिंदी में प्रचलित लिप्यंतरण द्वारा प्रस्तुत किया गया है।
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: इस्राएल के परमेश्वर
  rationale: सम्बन्धसूचक रचना का सीधा, मानक और स्पष्ट हिंदी रूप।
- source_word: הָיְתָה זֹּאת
  choice: ऐसा हुआ
  rationale: शाब्दिक अर्थ ‘यह हुआ/रहा’ है; घटना के संदर्भ में ‘ऐसा हुआ’ स्वाभाविक हिंदी मुहावरा है।
- source_word: בְּיִשְׂרָאֵל
  choice: इस्राएल में
  rationale: पूर्वसर्ग यहाँ स्थान अथवा सामुदायिक क्षेत्र को दर्शाता है।
- source_word: לְהִפָּקֵד
  choice: कम हो जाए
  rationale: निफ़अल रूप यहाँ पूरे समुदाय में से अनुपस्थित अथवा घट जाने का परिणाम बताता है; गोत्र के संदर्भ में ‘कम हो जाए’ सहज हिंदी है और अभाव का भाव सुरक्षित रखता है।
- source_word: הַיּוֹם
  choice: आज
  rationale: मूल पाठ के कालगत बल का सीधा आधुनिक हिंदी रूप।
- source_word: מִיִּשְׂרָאֵל
  choice: इस्राएल में से
  rationale: מִן बड़े राष्ट्रीय समुदाय से अलग होने या उसमें से घटने का भाव व्यक्त करता है।
- source_word: שֵׁבֶט אֶחָד
  choice: एक गोत्र
  rationale: यह इस्राएल की एक जनजातीय इकाई को सूचित करता है; बाइबलीय हिंदी में ‘गोत्र’ स्पष्ट और प्रतिष्ठित शब्द है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में चतुराक्षरी व्यक्तिगत नाम सीधे प्रयुक्त है। हिंदी पाठकों में पहचाने जाने वाले ‘यहोवा’ रूप द्वारा इसे उपाधि में बदले बिना सुरक्षित रखा गया है; ‘याहवे’ निकटतर वैकल्पिक लिप्यंतरण है।
- issue: לְהִפָּקֵד में अभाव का आशय
  choice: एक गोत्र कम हो जाए
  alternative: एक गोत्र लापता हो जाए
  rationale: संदर्भ में आशय किसी अस्थायी रूप से लापता समूह का नहीं, बल्कि इस्राएल की गोत्रीय पूर्णता में एक गोत्र के घट जाने का है। ‘कम हो जाए’ उस सामुदायिक क्षति को व्यक्त करता है और कारण या अंतिम परिणाम को अतिरिक्त रूप से निर्धारित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और मौखिक विलाप के अनुकूल रखी गई है। ‘हे’ संबोधन की गंभीरता को बनाए रखता है। वाक्य में मूल की पुनरुक्ति—‘इस्राएल में ... इस्राएल में से’—अर्थगत संरचना और राष्ट्रीय-सामुदायिक तनाव सुरक्षित रखने के लिए बरकरार है।
