base_translation:
  language: en
  yaml_path: translation/ot/judges/021/025.yaml
  text: In those days there was no king in Israel[a]; each man did what was right in his own eyes.
translation:
  language: hi
  text: उन दिनों इस्राएल में कोई राजा नहीं था; हर आदमी[क] वही करता था जो उसकी अपनी दृष्टि में सही था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: क
    text: या, “हर कोई वही करता था जो उसकी अपनी दृष्टि में सही था।” इब्रानी में वितरणात्मक अर्थ में पुल्लिंग एकवचन “हर आदमी” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיָּמִים הָהֵם
  choice: उन दिनों
  rationale: यह कथात्मक इब्रानी का सामान्य काल-सूचक सूत्र है; हिंदी में ‘उन दिनों’ स्वाभाविक है और पीछे मुड़कर किए गए वर्णन को बनाए रखता है।
- source_word: אֵין מֶלֶךְ בְּיִשְׂרָאֵל
  choice: इस्राएल में कोई राजा नहीं था
  rationale: अस्तित्व-निषेध אֵין और स्थान-सूचक पद का यह सहज हिंदी रूप है, जो राजनीतिक नेतृत्व के अभाव को सीधे व्यक्त करता है।
- source_word: אִישׁ
  choice: हर व्यक्ति
  rationale: एकवचन संज्ञा यहाँ वितरणात्मक अर्थ में प्रयुक्त है। आधुनिक हिंदी में ‘हर व्यक्ति’ पूरे समुदाय पर लागू उस भाव को स्वाभाविक रूप से व्यक्त करता है; ‘हर पुरुष’ अनावश्यक रूप से अर्थ को केवल वयस्क पुरुषों तक सीमित कर सकता है।
- source_word: הַיָּשָׁר
  choice: जो ... सही था
  rationale: सव्यंजक विशेषण यहाँ संज्ञार्थक है—‘सही बात/जो सही था’; चुना हुआ रूप नैतिक मूल्यांकन को सहज हिंदी में रखता है।
- source_word: בְּעֵינָיו
  choice: उसकी अपनी दृष्टि में
  rationale: यह व्यक्तिपरक निर्णय का इब्रानी मुहावरा है। ‘अपनी’ आत्मसंदर्भी बल को स्पष्ट करता है, जबकि ‘दृष्टि में’ गरिमापूर्ण और बोधगम्य हिंदी है।
- source_word: יַעֲשֶׂה
  choice: करता था
  rationale: रूपतः अपूर्ण क्रिया यहाँ अतीत की प्रचलित अथवा बार-बार होने वाली कार्रवाई का सार देती है; हिंदी का अभ्यस्त भूतकाल ‘करता था’ इसे ठीक व्यक्त करता है।
theological_decisions:
- issue: אִישׁ का पुल्लिंग एकवचन और वितरणात्मक अर्थ
  choice: हर व्यक्ति
  alternative: हर पुरुष / हर जन
  rationale: इब्रानी रूप पुल्लिंग एकवचन है, पर यहाँ उसका कार्य वितरणात्मक और प्रतिनिधिक है। ‘हर व्यक्ति’ अर्थ को पूरे समुदाय तक पहुँचाता है और हिंदी में लिंग-विशिष्ट सीमा जोड़ने से बचता है।
- issue: इस कथन में निहित मूल्यांकन
  choice: मूल कथन को बिना व्याख्यात्मक तीव्रता जोड़े रखना
  alternative: हर व्यक्ति जो चाहता था वही करता था
  rationale: संदर्भ इसे इस्राएल की अव्यवस्था पर नकारात्मक टिप्पणी के रूप में संकेत कर सकता है, किंतु पद स्वयं ‘अपनी दृष्टि में सही’ कहता है। अनुवाद उस तनाव को बनाए रखता है और ‘मनमानी’ जैसा अतिरिक्त निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी, संक्षिप्त, कथात्मक और गरिमापूर्ण रखी गई है। ‘इस्राएल’ प्रचलित बाइबलीय नाम-रूप है। अर्धविराम दोनों समांतर सार-वाक्यों के निकट संबंध को दिखाता है।
