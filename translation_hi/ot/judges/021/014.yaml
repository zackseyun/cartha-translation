  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण कथात्मक शैली रखी गई है। ‘बिन्यामीन’ को गोत्र के सामूहिक नाम के रूप में बनाए रखा गया है। अंतिम इब्रानी वाक्यांश की दीर्घवृत्तीयता को अर्थ-स्पष्ट हिंदी में प्रस्तुत किया गया है, बिना घटना का नैतिक या धर्मवैज्ञानिक मूल्यांकन जोड़े।
