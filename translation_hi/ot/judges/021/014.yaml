  text: וַ/יָּ֤שָׁב בִּנְיָמִן֙ בָּ/עֵ֣ת הַ/הִ֔יא וַ/יִּתְּנ֤וּ לָ/הֶם֙ הַ/נָּשִׁ֔ים אֲשֶׁ֣ר חִיּ֔וּ מִ/נְּשֵׁ֖י יָבֵ֣שׁ גִּלְעָ֑ד וְ/לֹֽא מָצְא֥וּ לָ/הֶ֖ם כֵּֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/014.yaml
  text: So Benjamin returned at that time[a], and they gave them the women whom they had kept alive from the women of Jabesh-gilead; but they did not find enough for them that way.
translation:
  language: hi
  text: उस समय बिन्यामीन लौट आया, और उन्होंने उन्हें वे स्त्रियाँ दे दीं जिन्हें उन्होंने याबेश-गिलाद की स्त्रियों में से जीवित रखा था; पर इस प्रकार उनके लिए पर्याप्त स्त्रियाँ नहीं मिलीं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, ‘पर उन्होंने उनके लिए ऐसा/इस प्रकार नहीं पाया।’ इब्रानी वाक्यांश संक्षिप्त है; संदर्भ में अर्थ है कि इस उपाय से उनके लिए पर्याप्त स्त्रियाँ नहीं मिलीं।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: लौट आया
  rationale: שׁוב का कथात्मक रूप यहाँ ‘लौटना’ व्यक्त करता है और जीवित बचे बिन्यामीनियों के समुदाय में वापस आने की ओर संकेत करता है।
- source_word: בִּנְיָמִן
  choice: बिन्यामीन
  rationale: एकवचन जातिनाम यहाँ पूरे गोत्र के लिए सामूहिक रूप से प्रयुक्त है; हिंदी में मूल नाम बनाए रखने से यह सामूहिक अर्थ संदर्भ से स्पष्ट रहता है।
- source_word: בָּעֵת הַהִיא
  choice: उस समय
  rationale: यह सामान्य कालसूचक पदबंध है; ‘उस समय’ स्वाभाविक और मूल के निकट है।
- source_word: וַיִּתְּנוּ לָהֶם
  choice: उन्होंने उन्हें ... दे दीं
  rationale: נתן का सीधा अर्थ ‘देना’ है। कर्ता संदर्भ में इस्राएली सभा है, पर इब्रानी की तरह हिंदी में भी उसे स्पष्ट नाम नहीं दिया गया।
- source_word: הַנָּשִׁים
  choice: स्त्रियाँ
  rationale: मूल संज्ञा का अर्थ ‘स्त्रियाँ’ है, ‘पत्नियाँ’ नहीं; विवाह का उद्देश्य संदर्भ से समझ में आता है।
- source_word: אֲשֶׁר חִיּוּ
  choice: जिन्हें उन्होंने ... जीवित रखा था
  rationale: חיה का पिएल रूप यहाँ वध के समय किसी को जीवित छोड़ने या रखने का कारणात्मक भाव देता है।
- source_word: מִנְּשֵׁי יָבֵשׁ גִּלְעָד
  choice: याबेश-गिलाद की स्त्रियों में से
  rationale: מן समूह के भीतर से चयन का भाव देता है; ‘में से’ इसे हिंदी में स्पष्ट और स्वाभाविक बनाता है।
- source_word: וְלֹא מָצְאוּ לָהֶם כֵּן
  choice: पर इस तरह भी उनके लिए पर्याप्त स्त्रियाँ नहीं मिलीं
  rationale: इब्रानी पदबंध संक्षिप्त और दीर्घवृत्तीय है। संदर्भ में आशय है कि इस उपाय से सभी के लिए पर्याप्त स्त्रियाँ उपलब्ध नहीं हुईं; अनुवाद उस निहित अर्थ को स्पष्ट करता है।
