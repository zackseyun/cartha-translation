language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/זֶ֥ה הַ/דָּבָ֖ר אֲשֶׁ֣ר תַּעֲשׂ֑וּ כָּל זָכָ֗ר וְ/כָל אִשָּׁ֛ה יֹדַ֥עַת מִשְׁכַּב זָכָ֖ר תַּחֲרִֽימוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/011.yaml
  text: 'And this is what you shall do: every male[a], and every woman who has known the bed of a male[b], you shall devote to destruction.'
translation:
  language: hi
  text: 'और यह वह बात है जो तुम्हें करनी है: हर पुरुष[a] और हर उस स्त्री को, जिसने पुरुष के साथ यौन-संबंध रखे हों, विनाश के लिए समर्पित कर देना।[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में ‘हर नर’; इसमें केवल वयस्क पुरुष ही नहीं, पुरुष-लिंग के सभी व्यक्ति सम्मिलित हो सकते हैं।
    reason: lexical_alternative
  - marker: b
    text: '‘विनाश के लिए समर्पित करना’ इब्रानी חרם का विशेष प्रयोग है: किसी को विनाश के लिए समर्पित करना, न कि केवल सामान्य अर्थ में मार डालना।'
    reason: cultural_note
lexical_decisions:
- source_word: וְזֶה הַדָּבָר אֲשֶׁר תַּעֲשׂוּ
  choice: और तुम्हें यह करना है
  rationale: हिब्रू के शाब्दिक रूप ‘और यह वह बात है जो तुम करोगे’ को स्वाभाविक आधुनिक हिन्दी में निर्देशात्मक बल सहित व्यक्त करता है और कथानक का संयोजक ‘और’ बनाए रखता है।
- source_word: כָּל זָכָר
  choice: हर पुरुष
  rationale: זָכָר पुरुष-लिंग को सूचित करता है। ‘हर पुरुष’ सामान्य हिन्दी में ‘हर नर’ से अधिक स्वाभाविक है; आयु के बारे में मूल की व्यापकता पादटिप्पणी में स्पष्ट की गई है।
- source_word: וְכָל אִשָּׁה
  choice: और हर उस स्त्री को
  rationale: אִשָּׁה के लिए ‘स्त्री’ उपयुक्त है और आगे आने वाले विशेषणात्मक वाक्यांश से सहज रूप से जुड़ता है।
- source_word: יֹדַעַת מִשְׁכַּב זָכָר
  choice: जिसने किसी पुरुष के साथ यौन-संबंध बनाए हों
  rationale: यह हिब्रू मुहावरा संभोग का संकेत देता है। शाब्दिक ‘पुरुष का बिछौना जानती हो’ आधुनिक हिन्दी में अस्पष्ट और अस्वाभाविक होगा, इसलिए आशय को स्पष्ट किंतु गरिमापूर्ण भाषा में रखा गया है।
- source_word: תַּחֲרִימוּ
  choice: विनाश के लिए अर्पित कर देना
  rationale: חרם का हिफ़ील रूप साधारण हत्या से अधिक, किसी को प्रतिबंध के अधीन विनाश के लिए सौंपने का तकनीकी भाव रखता है। यह चयन उस विशेष अर्थ को बनाए रखता है; पादटिप्पणी उसे स्पष्ट करती है।
theological_decisions:
- issue: युद्ध और न्याय के प्रसंग में חרם का अनुवाद
  choice: विनाश के लिए अर्पित कर देना
  alternative: पूरी तरह नष्ट कर देना; विनाश के प्रतिबंध के अधीन कर देना
  rationale: मूल शब्द केवल मार डालने का नहीं, बल्कि किसी व्यक्ति या वस्तु को प्रतिबंध के अंतर्गत विनाश के लिए अलग कर देने का धर्म-विधिक भाव रखता है। चुना हुआ रूप इस अतिरिक्त अर्थ को बनाए रखता है, जबकि पादटिप्पणी संभावित गलतफहमी दूर करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा स्वाभाविक, स्पष्ट और गरिमापूर्ण रखी गई है। यौन-संबंध के हिब्रानी संकेतार्थ को अनावश्यक शाब्दिक अस्पष्टता के बिना व्यक्त किया गया है, और חרם के तकनीकी धर्म-विधिक अर्थ को मुख्य पाठ तथा पादटिप्पणी दोनों में सुरक्षित रखा गया है।
