  text: וַ/יַּֽעֲשׂוּ כֵן֙ בְּנֵ֣י בִנְיָמִ֔ן וַ/יִּשְׂא֤וּ נָשִׁים֙ לְ/מִסְפָּרָ֔/ם מִן הַ/מְּחֹלְל֖וֹת אֲשֶׁ֣ר גָּזָ֑לוּ וַ/יֵּלְכ֗וּ וַ/יָּשׁ֨וּבוּ֙ אֶל נַ֣חֲלָתָ֔/ם וַ/יִּבְנוּ֙ אֶת הֶ֣/עָרִ֔ים וַ/יֵּשְׁב֖וּ בָּ/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/023.yaml
  text: So the sons of Benjamin did so[a], and took wives according to their number from the dancers whom they had seized. Then they went and returned to their inheritance, rebuilt the cities[c][b], and lived in them.
translation:
  language: hi
  text: तब बिन्यामीन के पुत्रों ने वैसा ही किया। उन्होंने नाचती हुई स्त्रियों में से अपनी संख्या के अनुसार उन्हें पत्नी के रूप में लिया, जिन्हें उन्होंने छीन लिया था। फिर वे वहाँ से चले गए और अपनी विरासत की भूमि में लौट आए। उन्होंने नगरों को दोबारा बनाया और उनमें रहने लगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲשׂוּ כֵן
  choice: वैसा ही किया
  rationale: यह स्वाभाविक हिन्दी कथात्मक अभिव्यक्ति है और पिछले पद में बताई गई योजना को पूरा करने का अर्थ देती है।
- source_word: בְּנֵי בִנְיָמִן
  choice: बिन्यामीन के पुत्रों
  rationale: इब्रानी की पारिवारिक-गोत्रीय अभिव्यक्ति को बनाए रखता है और इस प्रसंग में कार्य करने वाले पुरुष सदस्यों को दर्शाता है।
- source_word: וַיִּשְׂאוּ נָשִׁים לְמִסְפָּרָם
  choice: अपनी गिनती के अनुसार ... पत्नियाँ बना लेने के लिए
  rationale: לְמִסְפָּרָם से संख्या के अनुरूप स्त्रियाँ लिए जाने का भाव और נָשִׁים के वैवाहिक आशय—दोनों स्पष्ट होते हैं।
- source_word: מִן הַמְּחֹלְלוֹת
  choice: नाचनेवाली स्त्रियों में से
  rationale: स्त्रीलिंग बहुवचन कृदंत का अर्थ स्पष्ट रूप से व्यक्त करता है; केवल 'नाचनेवालों' कहने से हिन्दी में लिंग अस्पष्ट हो सकता था।
- source_word: אֲשֶׁר גָּזָלוּ
  choice: उन्हें बलपूर्वक उठा लिया
  rationale: גזל में निहित जबरन छीनने या उठा ले जाने की कठोरता को बिना नरम किए स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וַיֵּלְכוּ וַיָּשׁוּבוּ
  choice: वहाँ से चलकर ... लौट गए
  rationale: दोनों इब्रानी क्रियाओं का क्रम बनाए रखते हुए हिन्दी में अनावश्यक दोहराव से बचाता है।
- source_word: אֶל נַחֲלָתָם
  choice: अपनी विरासत में
  rationale: נחלה के गोत्रीय भूमि-अंश और वाचा-संबंधी अर्थ को सामान्य 'इलाके' की अपेक्षा बेहतर सुरक्षित रखता है।
- source_word: וַיִּבְנוּ אֶת הֶעָרִים
  choice: नगरों को फिर से बसाया
  rationale: मूल क्रिया का शाब्दिक अर्थ 'बनाया' है, पर पिछले विनाश के संदर्भ में पुनर्निर्माण और पुनर्बसाव का आशय है; हिन्दी में नगरों के लिए 'फिर से बसाया' स्वाभाविक है।
- source_word: וַיֵּשְׁבוּ בָּהֶם
  choice: उनमें रहने लगे
  rationale: बसने और लगातार निवास करने का प्रसंगानुकूल अर्थ सरल आधुनिक हिन्दी में देता है।
theological_decisions:
- issue: स्त्रियों को लिए जाने में גָּזָלוּ का नैतिक और बलपूर्वक भाव
  choice: बलपूर्वक उठा लिया
  alternative: ले लिया
  rationale: इब्रानी क्रिया हिंसक या जबरन छीने जाने का संकेत देती है। अनुवाद घटना का अनुमोदन नहीं करता और मूल की नैतिक कठोरता को नरम नहीं बनाता।
- issue: गोत्रीय भूमि के लिए נַחֲלָה
  choice: विरासत
  alternative: इलाका
  rationale: '''विरासत'' इस्राएल के गोत्रीय भूमि-अंश की धारणा सुरक्षित रखता है, जबकि ''इलाका'' उस अर्थ को सामान्य बना देता।'
- issue: וַיִּבְנוּ को संदर्भानुसार प्रस्तुत करना
  choice: फिर से बसाया
  alternative: बनाया
  rationale: इब्रानी केवल 'बनाया' कहता है, किंतु पहले नष्ट हुए नगरों के संदर्भ में पुनर्निर्माण अभिप्रेत है; फुटनोट मूल की अधिक शाब्दिक संभावना सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक रखी गई है। 'बिन्यामीन के पुत्रों' और 'विरासत' से मूल का गोत्रीय स्वर सुरक्षित है। स्त्रियों के बलपूर्वक अपहरण को किसी सौम्य वैवाहिक अभिव्यक्ति से नहीं ढका गया है।
