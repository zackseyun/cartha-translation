  yaml_path: translation/ot/judges/021/009.yaml
  text: And the people were mustered[a], and behold, there was not a man there from the inhabitants of Jabesh-gilead.
translation:
  language: hi
  text: तब लोगों की गिनती की गई, और देखो, याबेश-गिलाद के निवासियों में से वहाँ एक भी पुरुष[a] नहीं था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “याबेश-गिलाद के निवासियों में से वहाँ कोई भी नहीं था।” इब्रानी में अधिक शाब्दिक रूप से “वहाँ एक भी पुरुष नहीं था” है; यह पुल्लिंग भाषा सम्भवतः प्रतिनिधिक या सैनिक प्रसंग को दर्शाती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְפָּקֵד
  choice: गिनती की गई
  rationale: यहाँ פקד का रूप एकत्र लोगों की गणना अथवा नामावली जाँचे जाने को व्यक्त करता है। आधुनिक हिन्दी में ‘गिनती की गई’ स्वाभाविक है और प्रसंग में अनुपस्थित समूह का पता चलने से सीधे जुड़ता है।
- source_word: הָעָם
  choice: लोगों
  rationale: עָם का सामान्य अर्थ ‘लोग’ है। युद्ध-संबंधी प्रसंग होने पर भी ‘सेना’ कहना मूल से अधिक विशिष्ट होता।
- source_word: וְהִנֵּה
  choice: और देखो
  rationale: הִנֵּה अचानक सामने आए तथ्य की ओर ध्यान खींचता है; ‘और देखो’ उसकी कथात्मक सजीवता बनाए रखता है।
- source_word: אֵין שָׁם אִישׁ
  choice: वहाँ एक भी पुरुष नहीं था
  rationale: इब्रानी में अस्तित्वसूचक निषेध के साथ पुल्लिंग एकवचन אִישׁ है। ‘एक भी पुरुष’ मूल की लैंगिक अभिव्यक्ति और प्रतिनिधिक अथवा सैनिक प्रसंग को सुरक्षित रखता है।
- source_word: מִיּוֹשְׁבֵי
  choice: के निवासियों में से
  rationale: ישב का कृदन्त किसी स्थान में रहने वालों को दर्शाता है। ‘निवासियों में से’ हिन्दी में स्पष्ट और गरिमापूर्ण है।
- source_word: יָבֵשׁ גִּלְעָד
  choice: याबेश-गिलाद
  rationale: यह संयुक्त स्थान-नाम है; देवनागरी लिप्यंतरण और योजक-चिह्न इसे एक ही भौगोलिक नाम के रूप में स्पष्ट करते हैं।
