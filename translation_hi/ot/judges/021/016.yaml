  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּֽאמְר֨וּ זִקְנֵ֣י הָ/עֵדָ֔ה מַה נַּעֲשֶׂ֥ה לַ/נּוֹתָרִ֖ים לְ/נָשִׁ֑ים כִּֽי נִשְׁמְדָ֥ה מִ/בִּנְיָמִ֖ן אִשָּֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/016.yaml
  text: Then the elders of the congregation said[a], “What shall we do for wives for those who remain, since the women of Benjamin have been destroyed?”
translation:
  language: hi
  text: तब मण्डली के पुरनियों ने कहा, “जो पुरुष बचे हैं, उनके लिए पत्नियों का क्या प्रबन्ध करें? क्योंकि बिन्यामीन की स्त्रियाँ नष्ट हो गई हैं[a]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “बिन्यामीन में से स्त्री नष्ट हो गई है”; यहाँ एकवचन “स्त्री” का प्रयोग बिन्यामीन की स्त्रियों के लिए सामूहिक अर्थ में हुआ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: זִקְנֵי הָעֵדָה
  choice: मण्डली के पुरनिये
  rationale: यह पदबंध समुदाय की प्रतिनिधि सभा के अगुवों को दर्शाता है। ‘मण्डली’ उसके सामूहिक स्वरूप को और ‘पुरनिये’ प्राचीन इस्राएली नेतृत्व-पद को स्वाभाविक बाइबिलीय हिन्दी में व्यक्त करता है।
- source_word: מַה נַּעֲשֶׂה
  choice: क्या प्रबन्ध करें
  rationale: प्रथम पुरुष बहुवचन अपूर्ण क्रिया यहाँ आगे की सामूहिक कार्यवाही पर विचार-विमर्श प्रकट करती है। प्रसंग में प्रश्न केवल सामान्यतः ‘क्या करें’ नहीं, बल्कि शेष पुरुषों के लिए पत्नियाँ उपलब्ध कराने के उपाय का है।
- source_word: לַנּוֹתָרִים
  choice: जो पुरुष बचे हैं
  rationale: मूल में कृदन्त का अर्थ ‘बचे हुए लोग’ है। प्रसंग स्पष्ट करता है कि ये बिन्यामीन के बचे हुए पुरुष हैं; हिन्दी में ‘पुरुष’ जोड़ने से भाव स्वाभाविक और स्पष्ट होता है।
- source_word: לְנָשִׁים
  choice: उनके लिए पत्नियों
  rationale: נָשִׁים का रूप ‘स्त्रियाँ’ और ‘पत्नियाँ’ दोनों अर्थ दे सकता है; इस विवाह-संबंधी प्रसंग में ‘पत्नियाँ’ अपेक्षित अर्थ को ठीक व्यक्त करता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह अव्यय प्रश्न का कारण प्रस्तुत करता है; ‘क्योंकि’ उसका सीधा और स्वाभाविक हिन्दी समतुल्य है।
- source_word: נִשְׁמְדָה
  choice: नष्ट हो गई हैं
  rationale: שׁמד के निफ़अल रूप में विनाश या मिटा दिए जाने का गंभीर भाव है। सामूहिक स्त्री-वाचक कर्ता के कारण हिन्दी में बहुवचन क्रिया रखी गई है।
- source_word: מִבִּנְיָמִן אִשָּׁה
  choice: बिन्यामीन की स्त्रियाँ
  rationale: मूल में ‘बिन्यामीन में से स्त्री’ एकवचन सामूहिक अर्थ में प्रयुक्त है। सहज हिन्दी में बहुवचन ‘बिन्यामीन की स्त्रियाँ’ आशय स्पष्ट करता है, जबकि शाब्दिक विशेषता पादटिप्पणी में सुरक्षित है।
