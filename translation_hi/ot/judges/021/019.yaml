base_translation:
  language: en
  yaml_path: translation/ot/judges/021/019.yaml
  text: And they said[a], "Look, there is a feast of Yahweh in Shiloh from year to year, which is north of Bethel, east of the highway that goes up from Bethel to Shechem[b], and south of Lebonah."
translation:
  language: hi
  text: तब उन्होंने कहा, “देखो, शीलो में हर साल[a] याहवे का एक पर्व होता है। शीलो बेतेल के उत्तर में, बेतेल से शकेम को जानेवाले राजमार्ग के पूर्व में, और लबोना के दक्षिण में है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी मुहावरे का शाब्दिक रूप है, “दिनों से दिनों तक,” अर्थात् “हर साल।”
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: देखो
  rationale: यह स्वाभाविक आधुनिक हिन्दी में ध्यान आकर्षित करने वाले इब्रानी संकेतक का बल बनाए रखता है।
- source_word: חַג יְהוָה
  choice: याहवे का एक पर्व
  rationale: חַג धार्मिक पर्व या उत्सव को दर्शाता है; अनिश्चित रूप को हिन्दी में ‘एक’ से स्पष्ट किया गया है और परमेश्वर का व्यक्तिगत नाम लिप्यंतरित किया गया है।
- source_word: מִיָּמִים יָמִימָה
  choice: हर साल
  rationale: शाब्दिक रूप से ‘दिनों से दिनों तक’ वाला यह मुहावरा नियमित वार्षिक आयोजन का अर्थ देता है; ‘हर साल’ सहज और अर्थ-सटीक है।
- source_word: מִזְרְחָה הַשֶּׁמֶשׁ לִמְסִלָּה
  choice: राजमार्ग के पूर्व में
  rationale: ‘सूर्योदय की ओर’ यहाँ भौगोलिक दिशा ‘पूर्व’ बताता है; מְסִלָּה किसी प्रमुख मार्ग को सूचित करता है।
- source_word: הָעֹלָה מִבֵּית אֵל שְׁכֶמָה
  choice: बेतेल से शकेम को जानेवाले
  rationale: ‘ऊपर जाने’ का इब्रानी स्थलाकृतिक प्रयोग हिन्दी में मार्ग के गंतव्य को स्वाभाविक ढंग से व्यक्त करते हुए ‘जानेवाले’ किया गया है।
- source_word: וּמִנֶּגֶב לִלְבוֹנָה
  choice: और लबोना के दक्षिण में
  rationale: यह शीलो की स्थिति बताने वाली भौगोलिक सीमाओं में अंतिम दिशा है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल में वाचा का व्यक्तिगत नाम है; ‘याहवे’ उसका सीधा और प्रचलित विद्वत्तापूर्ण लिप्यंतरण है, न कि उसे किसी उपाधि से बदलना।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। लंबी इब्रानी भौगोलिक उपवाक्य-रचना को दो हिन्दी वाक्यों में बाँटा गया है, पर सभी दिशात्मक विवरण सुरक्षित हैं।
