  text: וַ/יֹּֽאמְרוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל מִ֠י אֲשֶׁ֨ר לֹא עָלָ֧ה בַ/קָּהָ֛ל מִ/כָּל שִׁבְטֵ֥י יִשְׂרָאֵ֖ל אֶל יְהוָ֑ה כִּי֩ הַ/שְּׁבוּעָ֨ה הַ/גְּדוֹלָ֜ה הָיְתָ֗ה לַ֠/אֲשֶׁר לֹא עָלָ֨ה אֶל יְהוָ֧ה הַ/מִּצְפָּ֛ה לֵ/אמֹ֖ר מ֥וֹת יוּמָֽת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/005.yaml
  text: And the sons of Israel said[a], “Who is there from all the tribes of Israel who did not come up to Yahweh in the assembly?” For the great oath had been made concerning whoever did not come up to Yahweh at Mizpah, saying[b], “He shall surely be put to death.”
translation:
  language: hi
  text: 'तब इस्राएल के पुत्रों ने कहा[a], “इस्राएल के सब गोत्रों में से कौन सभा में यहोवा के पास नहीं आया?” क्योंकि जो कोई मिस्पा में यहोवा के पास नहीं आया था, उसके विषय में बड़ी शपथ ली गई थी: “उसे निश्चय ही मार डाला जाएगा।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात् “इस्राएलियों ने कहा।”
    reason: हिब्रू के शाब्दिक ‘इस्राएल के पुत्र’ का स्वाभाविक सामुदायिक अर्थ स्पष्ट करना।
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों
  rationale: हिब्रू के लिंगसूचक सामूहिक मुहावरे को औपचारिक रूप से सुरक्षित रखता है; अधिक स्वाभाविक विकल्प ‘इस्राएलियों’ को पादटिप्पणी में दिया गया है।
- source_word: מִי אֲשֶׁר
  choice: कौन
  rationale: यह रचना उस व्यक्ति या समूह की पहचान पूछती है जो आगे बताए गए वर्णन पर खरा उतरता है; हिन्दी में ‘कौन’ स्वाभाविक और पर्याप्त है।
- source_word: לֹא עָלָה ... בַקָּהָל אֶל יְהוָה
  choice: यहोवा के सामने सभा में उपस्थित होने नहीं आया
  rationale: עלה का मूल भाव ‘ऊपर आना’ है, पर यहाँ सभा में सम्मिलित होने का आशय है। ‘उपस्थित होने आया’ आधुनिक हिन्दी में स्वाभाविक है; ‘यहोवा के सामने’ धार्मिक सभा की दिशा/उद्देश्य को व्यक्त करता है।
- source_word: הַשְּׁבוּעָה הַגְּדוֹלָה
  choice: यह बड़ी शपथ
  rationale: संज्ञा और विशेषण का सीधा अनुवाद है; ‘घोर’ या ‘गंभीर’ जोड़कर अर्थ को अनावश्यक रूप से व्याख्यायित नहीं किया गया।
- source_word: הָיְתָה לַאֲשֶׁר
  choice: उसके विषय में ... खाई गई थी
  rationale: हिब्रू निर्माण शपथ के उस व्यक्ति पर लागू होने को बताता है; हिन्दी में कर्मवाच्य वाक्य इसे स्वाभाविक और विधिक बल सहित व्यक्त करता है।
- source_word: הַמִּצְפָּה
  choice: मिस्पा में
  rationale: स्थाननाम को प्रचलित हिन्दी बाइबलीय रूप में रखा गया और प्रसंगानुसार अवस्थिति के लिए ‘में’ प्रयुक्त किया गया।
- source_word: מוֹת יוּמָת
  choice: उसे निश्चय ही मार डाला जाएगा
  rationale: infinitive absolute और passive imperfect मृत्यु-दंड की निश्चितता और कर्मवाच्य भाव देते हैं; हिन्दी वाक्य दोनों को सुरक्षित रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में परमेश्वर के व्यक्तिगत नाम YHWH का सुस्थापित लिप्यंतरण ‘यहोवा’ है; इसे उपाधि ‘प्रभु’ से नहीं बदला गया।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: मूल पाठ में टेट्राग्रामटन व्यक्तिगत नाम के रूप में है। आधुनिक हिन्दी के व्यापक बाइबलीय प्रयोग को ध्यान में रखते हुए ‘यहोवा’ चुना गया; ‘प्रभु’ नाम को उपाधि से बदल देता, जबकि ‘याहवे’ मूल उच्चारण का अधिक समीपी वैकल्पिक लिप्यंतरण है।
- issue: בְּנֵי יִשְׂרָאֵל का लिंगसूचक सामूहिक रूप
  choice: इस्राएल के पुत्रों
  alternative: इस्राएलियों
  rationale: मूल के औपचारिक, पुल्लिंग सामूहिक मुहावरे को मुख्य पाठ में रखा गया है, जबकि उसका स्वाभाविक सामुदायिक अर्थ पादटिप्पणी में स्पष्ट किया गया है।
- issue: אֶל יְהוָה में संबंध/दिशा
  choice: यहोवा के सामने
  alternative: यहोवा के पास / यहोवा के लिए
  rationale: शाब्दिक पूर्वसर्ग दिशासूचक है, पर सभा में आने का अर्थ उपासना-संबंधी उपस्थिति है। ‘सामने’ इसे सहज हिन्दी में व्यक्त करता है, बिना किसी विशेष संप्रदायगत व्याख्या के।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। न्यायिक निश्चितता के लिए ‘निश्चय ही मार डाला जाएगा’ और सभा में भागीदारी के लिए ‘उपस्थित होने आया’ चुना गया है। मुख्य पाठ में केवल [a] पादटिप्पणी-चिह्न है और उससे संबद्ध पादटिप्पणी दी गई है।
