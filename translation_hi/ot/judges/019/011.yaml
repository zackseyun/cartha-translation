source:
  edition: WLC
  text: הֵ֣ם עִם יְב֔וּס וְ/הַ/יּ֖וֹם רַ֣ד מְאֹ֑ד וַ/יֹּ֨אמֶר הַ/נַּ֜עַר אֶל אֲדֹנָ֗י/ו לְכָ/ה נָּ֛א וְ/נָס֛וּרָה אֶל עִֽיר הַ/יְבוּסִ֥י הַ/זֹּ֖את וְ/נָלִ֥ין בָּֽ/הּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/019/011.yaml
  text: When they were near Jebus[a], and the day was far spent, the young man said to his master, “Please come[c][b], let us turn aside to this city of the Jebusites and spend the night in it.”
translation:
  language: hi
  text: जब वे यबूस[a] के पास थे, तब दिन बहुत ढल चुका था। उस जवान[b] ने अपने स्वामी से कहा, “कृपया आइए, हम यबूसियों के इस नगर की ओर मुड़ें और इसमें रात बिताएँ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यबूस, यरूशलेम का पुराना नाम है।
    reason: cross_reference
  - marker: b
    text: इब्रानी शब्द का अर्थ प्रसंग के अनुसार “जवान,” “लड़का” या “सेवक-सहायक” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵם עִם יְבוּס
  choice: जब वे यबूस के पास थे
  rationale: यात्रा के प्रसंग में עִם स्थानवाचक निकटता बताता है; ‘के पास’ स्वाभाविक हिन्दी में यही अर्थ देता है।
- source_word: יְבוּס
  choice: यबूस
  rationale: मूल पाठ पुराने स्थान-नाम को रखता है; इसलिए उसे ‘यरूशलेम’ से प्रतिस्थापित नहीं किया गया।
- source_word: וְהַיּוֹם רַד מְאֹד
  choice: तब दिन बहुत ढल चुका था
  rationale: यह दिन के संध्या की ओर बहुत आगे बढ़ जाने का चित्र बनाए रखता है और आधुनिक हिन्दी में सहज है।
- source_word: הַנַּעַר
  choice: उस जवान
  rationale: נַעַר युवक, लड़का या सेवक-सहायक को सूचित कर सकता है। ‘जवान’ मूल की आयु-संबंधी व्यापकता रखता है, जबकि ‘अपने स्वामी’ से उसकी अधीनस्थ भूमिका स्पष्ट होती है।
- source_word: אֲדֹנָיו
  choice: अपने स्वामी से
  rationale: इस सामाजिक प्रसंग में אֲדוֹן किसी वरिष्ठ या मालिक के अर्थ में है; ‘स्वामी’ सम्मान और संबंध दोनों व्यक्त करता है।
- source_word: לְכָה נָּא
  choice: कृपया आइए
  rationale: आज्ञार्थक गति और נָא की विनम्र विनती दोनों को संक्षेप और स्वाभाविक रूप से व्यक्त करता है।
- source_word: וְנָסוּרָה
  choice: हम ... की ओर मुड़ें
  rationale: मार्ग छोड़कर नगर में जाने के सामूहिक प्रस्ताव को व्यक्त करता है।
- source_word: עִיר הַיְבוּסִי הַזֹּאת
  choice: यबूसियों के इस नगर
  rationale: जातिवाचक הַיְבוּסִי यहाँ सामूहिक है; यह अनुवाद लोगों से नगर का संबंध और संकेतवाचक ‘इस’ दोनों सुरक्षित रखता है।
- source_word: וְנָלִין בָּהּ
  choice: इसमें रात बिताएँ
  rationale: לוּן का अर्थ रात भर ठहरना है; यह वर्तमान हिन्दी में स्पष्ट और स्वाभाविक है।
