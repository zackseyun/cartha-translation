    text: प्राचीन निकट पूर्व में अतिथियों के पाँव धोना आतिथ्य की प्रचलित रीति थी।
    reason: cultural_note
lexical_decisions:
- source_word: וַיְבִיאֵהוּ
  choice: वह उसे अपने घर के भीतर ले आया
  rationale: हिफ़इल रूप किसी को आने देने या भीतर लाने का भाव व्यक्त करता है; यह चयन घर में प्रवेश की पूरी हुई गति को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: וַיָּבָול
  choice: चारा मिलाकर तैयार किया
  rationale: בלל का मूल अर्थ ‘मिलाना’ है और यहाँ पशुओं के लिए मिश्रित चारा तैयार करने के अर्थ में प्रयुक्त है; यह अनुवाद क्रिया के ठोस अर्थ को बनाए रखता है।
- source_word: לַחֲמוֹרִים
  choice: गधों के लिए
  rationale: חֲמוֹרִים का सीधा और आधुनिक हिन्दी समतुल्य ‘गधे’ है।
- source_word: וַיִּרְחֲצוּ רַגְלֵיהֶם
  choice: उन्होंने अपने पाँव धोए
  rationale: बहुवचन कर्ता अतिथियों या उनके दल की ओर संकेत करता है; ‘पाँव धोए’ आतिथ्य से जुड़ी क्रिया का सीधा अनुवाद है।
- source_word: וַיֹּאכְלוּ וַיִּשְׁתּוּ
  choice: खाया-पिया
  rationale: यह संक्षिप्त, क्रमिक इब्रानी कथन का सहज और गरिमापूर्ण हिन्दी रूप है।
