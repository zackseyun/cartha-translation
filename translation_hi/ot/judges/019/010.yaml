translation_notes:
  register: आधुनिक मानक हिन्दी में सहज किन्तु गरिमापूर्ण कथात्मक शैली रखी गई है। क्रमिक इब्रानी क्रियाओं को यथासंभव बनाए रखा गया है और स्थान-संबंधी अस्पष्टता को मुख्य पाठ तथा पादटिप्पणी में सुरक्षित रखा गया है।
