  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/לֹֽא אָבָ֤ה הָ/אִישׁ֙ לָ/ל֔וּן וַ/יָּ֣קָם וַ/יֵּ֗לֶךְ וַ/יָּבֹא֙ עַד נֹ֣כַח יְב֔וּס הִ֖יא יְרוּשָׁלִָ֑ם וְ/עִמּ֗/וֹ צֶ֤מֶד חֲמוֹרִים֙ חֲבוּשִׁ֔ים וּ/פִילַגְשׁ֖/וֹ עִמּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/019/010.yaml
  text: But the man was not willing to spend the night. He rose and went and came opposite Jebus (that is[a], Jerusalem), and with him were a pair of saddled donkeys and his concubine.
translation:
  language: hi
  text: परन्तु वह पुरुष रात बिताने को तैयार नहीं हुआ। वह उठा और चल दिया और यबूस के सामने तक[a] पहुँचा (अर्थात् यरूशलेम)। उसके साथ काठी कसे हुए दो गधे थे, और उसकी उपपत्नी भी थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद ‘यबूस के आस-पास तक’ या ‘यबूस के सम्मुख एक स्थान तक’ भी हो सकता है। इब्रानी अभिव्यक्ति नगर के सामने या उसके सम्मुख किसी स्थान को दर्शाती है; यह स्पष्ट नहीं करती कि वह नगर के भीतर पहुँच गया था।
    reason: lexical_alternative
lexical_decisions:
- source_word: אָבָה
  choice: तैयार नहीं हुआ
  rationale: यह क्रिया इच्छा या सहमति को व्यक्त करती है। ‘तैयार नहीं हुआ’ जानबूझकर सहमत न होने का भाव स्वाभाविक हिन्दी में रखता है।
- source_word: לָלוּן
  choice: रात बिताने
  rationale: यहाँ अर्थ विशेष रूप से रात भर ठहरने का है; ‘रात बिताने’ आधुनिक और सहज हिन्दी है।
- source_word: וַיָּקָם וַיֵּלֶךְ וַיָּבֹא
  choice: वह उठा और चल दिया और ... पहुँचा
  rationale: तीनों क्रमिक क्रियाओं को रखते हुए इब्रानी कथन की गति सुरक्षित की गई है, पर हिन्दी में ‘आया’ के स्थान पर गंतव्य के अनुकूल ‘पहुँचा’ रखा गया है।
- source_word: עַד נֹכַח
  choice: के सामने तक
  rationale: यह पद नगर के सामने या उसके सम्मुख किसी बिंदु तक पहुँचने को बताता है; इससे नगर में प्रवेश करना अनिवार्य रूप से व्यक्त नहीं होता।
- source_word: יְבוּס הִיא יְרוּשָׁלָם
  choice: यबूस ... (अर्थात् यरूशलेम)
  rationale: मूल पाठ यबूस के पुराने नाम की पहचान यरूशलेम के रूप में कराता है; कोष्ठक इस व्याख्यात्मक टिप्पणी को स्पष्ट रखते हैं।
- source_word: צֶמֶד חֲמוֹרִים
  choice: दो गधे
  rationale: צֶמֶד पशुओं की एक जोड़ी को सूचित करता है; हिन्दी में ‘दो गधे’ अधिक स्वाभाविक और समानार्थी है।
- source_word: חֲבוּשִׁים
  choice: काठी कसे हुए
  rationale: यात्रा के लिए तैयार गधों के संदर्भ में यह कृदन्त काठी या यात्रा-साज से सुसज्जित होने का भाव देता है।
- source_word: פִּילַגְשׁוֹ
  choice: उसकी उपपत्नी
  rationale: ‘उपपत्नी’ उस विशिष्ट सामाजिक संबंध को संक्षेप और गरिमापूर्वक व्यक्त करता है, बिना उसे सामान्य पत्नी मान लेने के।
