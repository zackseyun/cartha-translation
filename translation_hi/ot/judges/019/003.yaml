base_translation:
  language: en
  yaml_path: translation/ot/judges/019/003.yaml
  text: Then her husband arose and went after her to speak to her heart and bring her back[a]. His young servant was with him, along with a pair of donkeys. She brought him into her father’s house, and when the young woman’s father saw him[b], he rejoiced to meet him.
translation:
  language: hi
  text: तब उसका पति उठा और उसके पीछे गया, ताकि उसे समझाने-बुझाने के लिए उससे बात करे[a] और उसे वापस ले आए[b]। उसके साथ उसका जवान सेवक और दो गधे भी थे। वह उसे अपने पिता के घर ले गई। जब उस युवती के पिता ने उसे देखा, तो वह उससे मिलकर बहुत खुश हुआ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “उसके हृदय पर बात करे”; यह कोमलता से या उसे मनाने के लिए बात करने का मुहावरा है।
    reason: lexical_alternative
  - marker: b
    text: “वापस ले आए” में प्रयुक्त इब्रानी रूप पाठ की दृष्टि से कठिन है; प्रसंग से संकेत मिलता है कि वह उस स्त्री को वापस लाना चाहता था।
    reason: textual_variant
lexical_decisions:
- source_word: אִישָׁהּ
  choice: उसका पति
  rationale: शाब्दिक अर्थ ‘उसका पुरुष’ है, पर वैवाहिक संबंध के इस प्रसंग में ‘उसका पति’ स्वाभाविक और सटीक है।
- source_word: לְדַבֵּר עַל־לִבָּהּ
  choice: उससे प्यार से बात करे
  rationale: इब्रानी मुहावरे का शाब्दिक अर्थ ‘उसके हृदय से/पर बात करना’ है; यहाँ आशय कोमलता से या मनाने के लिए बात करना है। हिंदी में ‘प्यार से बात करना’ इसे सहज रूप में व्यक्त करता है, और शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
- source_word: ל/השיב/ו
  choice: उसे वापस ले आए
  rationale: संदर्भ में पति का उद्देश्य स्त्री को अपने साथ वापस लाना है। इब्रानी प्रत्यय पाठ की दृष्टि से कठिन है, इसलिए इस कठिनाई को पादटिप्पणी में बताया गया है।
- source_word: נַעֲרוֹ
  choice: उसका जवान सेवक
  rationale: נַעַר युवक अथवा सेवक/सहायक का अर्थ दे सकता है। यात्रा में साथ चलने की भूमिका के कारण ‘जवान सेवक’ आयु और कार्य दोनों को व्यक्त करता है।
- source_word: צֶמֶד חֲמֹרִים
  choice: दो गधे
  rationale: צֶמֶד एक जोड़ी को दर्शाता है। सहज हिंदी में ‘दो गधे’ वही संख्या स्पष्ट करता है, बिना यह अनावश्यक रूप से कहे कि वे जोते हुए थे।
- source_word: וַתְּבִיאֵהוּ
  choice: वह उसे ... ले गई
  rationale: क्रिया स्त्रीलिंग एकवचन है, इसलिए युवती कर्ता है; हिंदी में यह कथानक को स्पष्ट और स्वाभाविक रखता है।
- source_word: הַנַּעֲרָה
  choice: उस युवती
  rationale: यहाँ प्रयुक्त संज्ञा का अर्थ ‘युवती’ है। यह आधुनिक, सम्मानजनक और प्रसंगानुकूल हिंदी है।
- source_word: וַיִּשְׂמַח לִקְרָאתוֹ
  choice: वह उससे मिलकर बहुत खुश हुआ
  rationale: इब्रानी पद मिलने के अवसर पर आनंद व्यक्त करता है। यह हिंदी रूप भाव को सीधे और स्वाभाविक ढंग से संप्रेषित करता है।
