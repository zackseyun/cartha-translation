  text: וְ/הָיָ֣ה כָל הָ/רֹאֶ֗ה וְ/אָמַר֙ לֹֽא נִהְיְתָ֤ה וְ/לֹֽא נִרְאֲתָה֙ כָּ/זֹ֔את לְ/מִ/יּ֞וֹם עֲל֤וֹת בְּנֵֽי יִשְׂרָאֵל֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם עַ֖ד הַ/יּ֣וֹם הַ/זֶּ֑ה שִֽׂימוּ לָ/כֶ֥ם עָלֶ֖י/הָ עֻ֥צוּ וְ/דַבֵּֽרוּ־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/019/030.yaml
  text: And everyone who saw it said[a], “Nothing like this has happened or been seen from the day the sons of Israel came up from the land of Egypt until this day. Consider it, take counsel, and speak.”
translation:
  language: hi
  text: और जिसने भी इसे देखा, उसने कहा, “जिस दिन इस्राएल के पुत्र[a] मिस्र देश से निकलकर आए, उस दिन से आज तक न तो ऐसी कोई बात हुई और न ही देखी गई। इस पर ध्यान दो, परामर्श करो और बोलो।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “इस्राएली” अथवा “इस्राएल की संतान।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כָל הָרֹאֶה וְאָמַר
  choice: और ऐसा हुआ कि जिसने भी यह देखा, उसने कहा
  rationale: וְהָיָה परिणामस्वरूप उत्पन्न स्थिति का परिचय देता है; ‘और ऐसा हुआ कि’ उसके कथात्मक कार्य को बनाए रखता है। כָל הָרֹאֶה का सार्वभौमिक भाव ‘जिसने भी’ से और וְאָמַר की प्रतिक्रिया साधारण भूतकाल से व्यक्त हुई है।
- source_word: לֹא נִהְיְתָה וְלֹא נִרְאֲתָה כָּזֹאת
  choice: न तो ऐसी कोई बात हुई और न ही देखी गई
  rationale: दोनों निषेधों और दोनों क्रियाओं को अलग रखते हुए घटना के अभूतपूर्व होने पर दिया गया हिब्रू बल सुरक्षित रखा गया है।
- source_word: לְמִיּוֹם עֲלוֹת בְּנֵי יִשְׂרָאֵל מֵאֶרֶץ מִצְרַיִם
  choice: जिस दिन इस्राएल के पुत्र मिस्र देश से निकलकर आए, उस दिन से
  rationale: עֲלוֹת के निर्गमन-संदर्भ को स्वाभाविक हिन्दी में ‘निकलकर आए’ कहा गया है। בְּנֵי יִשְׂרָאֵל का निकट रूप ‘इस्राएल के पुत्र’ मुख्य पाठ में रखा गया है।
- source_word: עַד הַיּוֹם הַזֶּה
  choice: आज तक
  rationale: यह हिब्रू काल-सूचक मुहावरे का स्पष्ट और स्वाभाविक आधुनिक हिन्दी रूप है।
- source_word: שִׂימוּ לָכֶם עָלֶיהָ
  choice: इस पर ध्यान दो
  rationale: शाब्दिक रूप से अपने मन को किसी विषय पर लगाने वाला यह मुहावरा यहाँ गंभीरता से विचार करने का आह्वान है; ‘ध्यान दो’ उसी अर्थ को सहज हिन्दी में व्यक्त करता है।
- source_word: עֻצוּ
  choice: आपस में विचार करो
  rationale: बहुवचन आज्ञा सामूहिक परामर्श और विचार-विमर्श को व्यक्त करती है; ‘आपस में’ इस सामुदायिक भाव को स्पष्ट करता है।
- source_word: וְדַבֵּרוּ
  choice: और बोलो
  rationale: हिब्रू में कथन का विषय या कर्म अनकहा है। संक्षिप्त ‘और बोलो’ उसी खुलेपन और बल को बनाए रखता है।
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל का अनुवाद
  choice: इस्राएल के पुत्र
  alternative: इस्राएली; इस्राएल की संतान
  rationale: मुख्य पाठ में व्याकरणिक रूप के निकट ‘इस्राएल के पुत्र’ रखा गया है, जबकि यह पद एक प्रचलित जातिवाचक नाम भी है; इसलिए अधिक सहज सामूहिक विकल्प पादटिप्पणी में दिए गए हैं।
translation_notes:
  register: भाषा आधुनिक, गंभीर और सामान्य पाठक के लिए स्पष्ट रखी गई है। अंतिम तीन आज्ञाओं की संक्षिप्त, तीव्र लय तथा अंतिम क्रिया का अनिर्दिष्ट आशय सुरक्षित रखा गया है।
