base_translation:
  language: en
  yaml_path: translation/ot/judges/019/026.yaml
  text: The woman came as morning was dawning and fell at the entrance of the house of the man where her master was[b][a], until it was light.
translation:
  language: hi
  text: जब भोर होने लगी[a], वह स्त्री आई और उस आदमी के घर के द्वार पर, जहाँ उसका स्वामी[b] था, गिर पड़ी और उजाला होने तक वहीं रही।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “भोर की ओर” अथवा “भोर से पहले।” इब्रानी मुहावरा शाब्दिक रूप से सुबह के मुड़ने का संकेत देता है।
    reason: lexical_alternative
  - marker: b
    text: या “उसका प्रभु।” इब्रानी में “उसका स्वामी” है—यह अधिकार का सूचक पद है, न कि स्पष्ट रूप से “उसका पति।”
    reason: lexical_alternative
lexical_decisions:
- source_word: לִפְנוֹת הַבֹּקֶר
  choice: जब भोर होने लगी
  rationale: यह इब्रानी मुहावरा सुबह के मुड़ने या निकट आने का समय बताता है। यह अनुवाद उस आरंभिक उजाले को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है, बिना इसे केवल ‘भोर से पहले’ तक सीमित किए।
- source_word: וַתָּבֹא
  choice: आई
  rationale: בוא का सामान्य अर्थ ‘आना’ है। ‘लौटी’ कहना प्रसंग से संभव है, पर क्रिया में स्वयं वह अर्थ स्पष्ट नहीं है।
- source_word: וַתִּפֹּל
  choice: गिर पड़ी
  rationale: נפל का सीधा अर्थ ‘गिरना’ है। ‘ढह गई’ या ‘बेहोश होकर गिर पड़ी’ कारण या दशा को मूल से अधिक स्पष्ट कर देता।
- source_word: פֶּתַח בֵּית
  choice: घर के द्वार पर
  rationale: פֶּתַח घर के प्रवेश-स्थान या द्वार को दर्शाता है; ‘द्वार पर’ हिन्दी में संक्षिप्त, स्पष्ट और स्वाभाविक है।
- source_word: הָאִישׁ
  choice: उस आदमी
  rationale: אִישׁ का सामान्य अर्थ ‘आदमी’ है। प्रसंग में वह गृहस्वामी वृद्ध व्यक्ति है, पर मूल पद स्वयं केवल ‘आदमी’ कहता है।
- source_word: אֲדוֹנֶיהָ
  choice: उसका स्वामी
  rationale: אדון के साथ स्त्रीलिंग एकवचन प्रत्यय का अर्थ ‘उसका स्वामी/प्रभु’ है और यहाँ अधिकार-संबंध व्यक्त होता है। ‘पति’ संबंध को मूल शब्द की अपेक्षा अधिक निश्चित कर देगा।
- source_word: שָׁם
  choice: जहाँ ... था
  rationale: אֲשֶׁר के साथ שָׁם स्थानसूचक संबंध बनाता है; हिन्दी में ‘जहाँ उसका स्वामी था’ स्वाभाविक है।
- source_word: עַד הָאוֹר
  choice: उजाला होने तक वहीं पड़ी रही
  rationale: यह पद दिन का प्रकाश होने तक की अवधि बताता है। हिन्दी में ‘गिर पड़ी और ... पड़ी रही’ गिरने की घटना तथा उस अवस्था की अवधि दोनों को स्पष्ट रूप से व्यक्त करता है।
theological_decisions:
- issue: אֲדוֹנֶיהָ में स्त्री और लेवी के संबंध का वर्णन
  choice: स्वामी
  alternative: पति / प्रभु
  rationale: मूल शब्द अधिकार-संबंध बताता है, वैवाहिक पद को स्पष्ट रूप से नाम नहीं देता। ‘स्वामी’ इस तनाव को बनाए रखता है; पादटिप्पणी पाठक को शाब्दिक विकल्प से अवगत कराती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल और गरिमापूर्ण कथात्मक रूप रखा गया है। ‘गिर पड़ी’ मूल की कठोर संक्षिप्तता बनाए रखता है, जबकि ‘पड़ी रही’ עַד הָאוֹר से सूचित अवधि को हिन्दी में स्वाभाविक बनाता है।
