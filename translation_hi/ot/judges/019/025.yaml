source:
  edition: WLC
  text: וְ/לֹֽא אָב֤וּ הָ/אֲנָשִׁים֙ לִ/שְׁמֹ֣עַֽ ל֔/וֹ וַ/יַּחֲזֵ֤ק הָ/אִישׁ֙ בְּ/פִ֣ילַגְשׁ֔/וֹ וַ/יֹּצֵ֥א אֲלֵי/הֶ֖ם הַ/ח֑וּץ וַ/יֵּדְע֣וּ א֠וֹתָ/הּ וַ/יִּֽתְעַלְּלוּ בָ֤/הּ כָּל הַ/לַּ֨יְלָה֙ עַד הַ/בֹּ֔קֶר וַֽ/יְשַׁלְּח֖וּ/הָ ב/עלות הַ/שָּֽׁחַר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/019/025.yaml
  text: But the men were not willing to listen to him[a], so the man seized his concubine and brought her out to them. And they knew her and abused her all night until morning, and they let her go at the dawn.
translation:
  language: hi
  text: पर वे पुरुष उसकी बात सुनने को तैयार नहीं हुए। तब उस आदमी ने अपनी उपपत्नी को पकड़कर बाहर उनके पास निकाल दिया। उन्होंने उसके साथ बलात्कार किया[a] और रात भर भोर होने तक उसके साथ क्रूर दुर्व्यवहार करते रहे। पौ फटते समय उन्होंने उसे छोड़ दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “उन्होंने उसे जाना”; इस प्रसंग में यह बलपूर्वक यौन संबंध के लिए प्रयुक्त शिष्टोक्ति है।
    reason: इब्रानी मुहावरे के शाब्दिक रूप और इस हिंसक प्रसंग में उसके आशय को स्पष्ट करना।
lexical_decisions:
- source_word: אָבוּ ... לִשְׁמֹעַ לוֹ
  choice: उसकी बात सुनने को तैयार नहीं हुए
  rationale: यह अבה की अनिच्छा और שמע ל की किसी की बात मानने या सुनने की भाव-सीमा को स्वाभाविक हिन्दी में रखता है, बिना इसे केवल श्रवण या औपचारिक आज्ञापालन तक सीमित किए।
- source_word: וַיַּחֲזֵק
  choice: पकड़कर
  rationale: क्रिया यहाँ बलपूर्वक पकड़ने का संकेत देती है। प्रसंग और आगे का ‘निकाल दिया’ उस जबरदस्ती को स्पष्ट रखते हैं।
- source_word: פִּילַגְשׁוֹ
  choice: अपनी उपपत्नी
  rationale: ‘उपपत्नी’ सामाजिक श्रेणी को अपेक्षाकृत तटस्थ और गरिमापूर्ण ढंग से व्यक्त करता है; ‘रखैल’ अनावश्यक रूप से अपमानजनक होता।
- source_word: וַיֹּצֵא אֲלֵיהֶם הַחוּץ
  choice: बाहर उनके पास निकाल दिया
  rationale: हिफ़ील रूप का कारक अर्थ और הַחוּץ का ‘बाहर’ दोनों सुरक्षित हैं; ‘निकाल दिया’ उस स्त्री की इच्छा के विरुद्ध किए गए कार्य को भी स्वाभाविक हिन्दी में दिखाता है।
- source_word: וַיֵּדְעוּ אוֹתָהּ
  choice: उन्होंने उसके साथ बलात्कार किया
  rationale: शाब्दिक ‘उन्होंने उसे जाना’ हिन्दी में यौन अर्थ व्यक्त नहीं करता और भ्रामक होगा। हिंसक, सामूहिक और बलपूर्वक प्रसंग में ‘बलात्कार किया’ स्रोत के व्यंजित अर्थ को स्पष्ट करता है; शाब्दिक मुहावरा पादटिप्पणी में दिया गया है।
- source_word: וַיִּתְעַלְּלוּ בָהּ
  choice: उसके साथ क्रूर दुर्व्यवहार करते रहे
  rationale: हित्पएल रूप अपमानजनक और हिंसक दुर्व्यवहार बताता है। ‘क्रूर दुर्व्यवहार’ इसकी व्यापकता बनाए रखता है और इसे केवल एक प्रकार की हिंसा तक सीमित नहीं करता।
- source_word: כָּל הַלַּיְלָה עַד הַבֹּקֶר
  choice: रात भर भोर होने तक
  rationale: समय की पूरी अवधि और उसकी भयावह निरंतरता को सीधे व्यक्त करता है।
- source_word: וַיְשַׁלְּחוּהָ
  choice: उन्होंने उसे छोड़ दिया
  rationale: שלח यहाँ पकड़ से जाने देने या रिहा करने के अर्थ में है; ‘छोड़ दिया’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: בַּעֲלוֹת הַשַּׁחַר
  choice: पौ फटते समय
  rationale: यह ‘भोर के चढ़ने’ की इब्रानी छवि को प्रचलित और सजीव हिन्दी काल-वाक्यांश में व्यक्त करता है।
theological_decisions:
- issue: यौन हिंसा के लिए इब्रानी शिष्टोक्ति ידע का अनुवाद
  choice: मुख्य पाठ में ‘बलात्कार किया’ और पादटिप्पणी में शाब्दिक मुहावरा
  alternative: मुख्य पाठ में ‘उसे जाना’
  rationale: हिन्दी में ‘उसे जाना’ का यौन अर्थ नहीं निकलता। स्पष्ट अनुवाद हिंसा को छिपाता नहीं, जबकि पादटिप्पणी स्रोत की शिष्टोक्ति और उसकी वास्तविक अस्पष्टता का अभिलेख रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गंभीर, सीधा और गरिमापूर्ण रूप अपनाया गया है। वर्णन की भयावहता को न तो नरम किया गया है, न सनसनीखेज बनाया गया है। ‘उपपत्नी’ को तटस्थ सामाजिक पद के रूप में और ‘पौ फटते समय’ को स्वाभाविक समय-सूचक अभिव्यक्ति के रूप में चुना गया है।
