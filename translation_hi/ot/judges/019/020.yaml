base_translation:
  language: en
  yaml_path: translation/ot/judges/019/020.yaml
  text: The old man said[a], “Peace be to you. Only let all your needs be my responsibility; only do not spend the night in the open square.”
translation:
  language: hi
  text: वृद्ध पुरुष ने कहा, “तुम्हें शांति मिले! बस, तुम्हारी हर ज़रूरत पूरी करने की ज़िम्मेदारी मेरी है; केवल रात खुले चौक[a] में मत बिताना।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सड़क पर।” इब्रानी शब्द विशेष रूप से नगर के भीतर किसी खुले सार्वजनिक स्थान या चौक को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאִישׁ הַזָּקֵן
  choice: वृद्ध पुरुष
  rationale: यह मूल के संज्ञा और विशेषण दोनों को स्वाभाविक, गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: שָׁלוֹם לָךְ
  choice: तुम्हें शांति मिले
  rationale: यह आश्वासन और शुभकामना के सूत्र-वाक्य में शָׁלוֹם का मूल भाव बनाए रखता है, बिना उसे केवल ‘चिंता मत करो’ में सीमित किए।
- source_word: רַק
  choice: बस / केवल
  rationale: दोनों प्रयोग सीमा और बल व्यक्त करते हैं; हिन्दी में अनावश्यक पुनरुक्ति से बचते हुए उनकी समान भूमिका बनाए रखने के लिए निकटार्थी कण चुने गए हैं।
- source_word: כָּל מַחְסוֹרְךָ
  choice: तुम्हारी हर ज़रूरत पूरी करना
  rationale: מַחְסוֹר अभाव या आवश्यकता को दर्शाता है; प्रसंग में मेहमान की आवश्यकताओं की पूर्ति का भाव स्वाभाविक रूप से स्पष्ट किया गया है।
- source_word: עָלָי
  choice: ज़िम्मेदारी मेरी है
  rationale: शाब्दिक ‘मुझ पर’ यहाँ प्रबंध की व्यक्तिगत ज़िम्मेदारी लेने का मुहावरा है; हिन्दी में यह रूप अर्थ को साफ़ रखता है।
- source_word: בָּרְחוֹב
  choice: खुले चौक में
  rationale: רְחוֹב नगर के भीतर खुले सार्वजनिक स्थान या चौक को सूचित करता है, केवल आवागमन वाली सड़क को नहीं।
- source_word: אַל תָּלַן
  choice: रात ... मत बिताना
  rationale: לון का अर्थ रात भर ठहरना है; यह निषेध आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
