  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण कथात्मक लहजा रखा गया है। संबोधन एक व्यक्ति से है, इसलिए ‘तुम’ के रूप प्रयुक्त हुए हैं।
