  text: וַ/יֵּצֵ֣א אֲלֵי/הֶ֗ם הָ/אִישׁ֙ בַּ֣עַל הַ/בַּ֔יִת וַ/יֹּ֣אמֶר אֲלֵ/הֶ֔ם אַל אַחַ֖/י אַל תָּרֵ֣עוּ נָ֑א אַ֠חֲרֵי אֲשֶׁר בָּ֞א הָ/אִ֤ישׁ הַ/זֶּה֙ אַל בֵּיתִ֔/י אַֽל תַּעֲשׂ֖וּ אֶת הַ/נְּבָלָ֥ה הַ/זֹּֽאת־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/019/023.yaml
  text: Then the man[a], the master of the house, went out to them and said to them, “No, my brothers, please do not act wickedly. Since this man has come into my house, do not do this disgraceful thing.”
translation:
  language: hi
  text: तब घर का स्वामी बाहर उनके पास गया और उनसे कहा, “नहीं, मेरे भाइयो, कृपा करके बुराई मत करो। यह आदमी मेरे घर में आया है, इसलिए ऐसा लज्जाजनक काम[a] मत करो।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “ऐसा घृणित काम” अथवा “ऐसा निंदनीय कृत्य।” इब्रानी शब्द एक शर्मनाक और नैतिक रूप से अत्यंत घृणित कार्य को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּעַל הַבַּיִת
  choice: उस घर का स्वामी
  rationale: यह पद घर और गृहस्थी पर अधिकार रखने वाले पुरुष को दर्शाता है। ‘घर का स्वामी’ मूल मुहावरे और सामाजिक भूमिका दोनों को स्वाभाविक हिंदी में बनाए रखता है।
- source_word: אַחַי
  choice: मेरे भाइयो
  rationale: मूल का शाब्दिक संबोधन ‘मेरे भाइयो’ है; प्रसंग में यह नगर के पुरुषों को संबोधित करता है।
- source_word: תָּרֵעוּ
  choice: ऐसी बुराई मत करो
  rationale: רעע का यहाँ नैतिक अर्थ बुरा या दुष्ट आचरण करना है। अगले निषेध के साथ स्वाभाविक हिंदी प्रवाह के लिए ‘ऐसी बुराई मत करो’ चुना गया है।
- source_word: נָא
  choice: कृपा करके
  rationale: यह विनती और आग्रह का भाव जोड़ता है; ‘कृपा करके’ आधुनिक, सम्मानपूर्ण और तात्कालिक अनुरोध को व्यक्त करता है।
- source_word: אַחֲרֵי אֲשֶׁר בָּא הָאִישׁ הַזֶּה אֶל בֵּיתִי
  choice: यह पुरुष मेरे घर में आया है; इसलिए
  rationale: इस प्रसंग में रचना केवल कालक्रम नहीं, अतिथि के घर में आ जाने से उत्पन्न परिस्थिति और निषेध का आधार भी बताती है। ‘इसलिए’ उस संदर्भगत संबंध को स्वाभाविक हिंदी में व्यक्त करता है, बिना अतिथि-सुरक्षा की अवधारणा को मूल से अधिक स्पष्ट किए।
- source_word: הַנְּבָלָה הַזֹּאת
  choice: ऐसा लज्जाजनक काम
  rationale: נְבָלָה गंभीर रूप से शर्मनाक और नैतिक रूप से घृणित कृत्य को दर्शाता है। ‘लज्जाजनक काम’ साधारण पाठक के लिए स्पष्ट है और ‘मूर्खता’ की अपेक्षा इसकी गंभीरता बेहतर बनाए रखता है।
- source_word: וַיֵּצֵא אֲלֵיהֶם
  choice: बाहर उनके पास गया
  rationale: यह יצא के साधारण कथात्मक रूप और אֲלֵיהֶם की दिशा—उनके पास—दोनों को सुरक्षित रखता है।
theological_decisions:
- issue: घर में आने के आधार का संबंध
  choice: ‘यह पुरुष मेरे घर में आया है; इसलिए’ द्वारा परिस्थितिजन्य/कारणात्मक संबंध व्यक्त किया गया
  alternative: ‘जब से यह पुरुष मेरे घर में आया है’ या ‘इसके बाद कि यह पुरुष मेरे घर में आया है’
  rationale: אַחֲרֵי אֲשֶׁר यहाँ कालगत अर्थ रख सकता है, पर प्रसंग में वक्ता उसके अपने घर में आने को इस कृत्य के विरुद्ध विशेष आधार बनाता है। अनुवाद उस संबंध को रखता है, पर किसी विशिष्ट अतिथि-संहिता या धर्मवैधानिक सिद्धांत को नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी, सरल किंतु गरिमापूर्ण रखी गई है। ‘पुरुष’ मूल הָאִישׁ के लिंग और कथात्मक संदर्भ को स्पष्ट रखता है; ‘मेरे भाइयो’ पुरुष नगरवासियों के मूल संबोधन को सुरक्षित रखता है। पादटिप्पणी-चिह्न मुख्य पाठ में संबंधित पदबंध के बाद रखा गया है।
