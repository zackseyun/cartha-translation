base_translation:
  language: en
  yaml_path: translation/ot/judges/019/008.yaml
  text: He got up early in the morning on the fifth day to go[a], but the young woman's father said, “Please strengthen your heart with a morsel of food, and wait until the day declines.” So the two of them ate.
translation:
  language: hi
  text: पाँचवें दिन वह चलने के लिए भोर को जल्दी उठा, पर युवती के पिता ने कहा, “कृपया कुछ खाकर अपना जी सँभालो[a], और दिन ढलने तक ठहरे रहो।” तब उन दोनों ने खाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक अर्थ है, “अपने हृदय को सहारा दो।” यह भोजन करके फिर से शक्ति पाने का मुहावरा है।
    reason: मूल इब्रानी की हृदय-संबंधी छवि और उसके भोजन-संबंधी मुहावरेदार अर्थ, दोनों को स्पष्ट करना।
lexical_decisions:
- source_word: וַיַּשְׁכֵּם בַּבֹּקֶר
  choice: वह भोर को जल्दी उठा
  rationale: שׁכם के हिफ़ील रूप में जल्दी उठने या जल्दी आरम्भ करने का भाव है। ‘भोर को जल्दी उठा’ समय और क्रिया दोनों को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: בַּיּוֹם הַחֲמִישִׁי
  choice: पाँचवें दिन
  rationale: यह क्रमसूचक समय-सूचना का सीधा और सामान्य हिन्दी रूप है।
- source_word: לָלֶכֶת
  choice: चलने को हुआ
  rationale: הלך का मूल अर्थ ‘जाना/चलना’ है; प्रसंग में प्रस्थान की तैयारी है। ‘चलने को हुआ’ इस आशय को सहज कथात्मक हिन्दी में रखता है, बिना गन्तव्य जोड़ने के।
- source_word: אֲבִי הַנַּעֲרָה
  choice: युवती के पिता
  rationale: נַעֲרָה यहाँ विवाह-संबंधित प्रसंग में एक युवती को दर्शाता है। ‘युवती’ सम्मानजनक है और ‘लड़की’ की अपेक्षा इस प्रसंग में अधिक उपयुक्त है।
- source_word: סְעָד נָא לְבָבְךָ
  choice: कृपया कुछ खाकर अपना जी सँभालो
  rationale: शाब्दिक चित्र ‘अपने हृदय को सहारा/बल देना’ है और प्रसंग में भोजन से शक्ति पाने का मुहावरा है। ‘अपना जी सँभालो’ हृदय/भीतरी व्यक्ति की छवि को कुछ हद तक बनाए रखता है, जबकि ‘कुछ खाकर’ आशय स्पष्ट करता है।
- source_word: וְהִתְמַהְמְהוּ
  choice: और ... ठहरे रहो
  rationale: מהה का हित्पएल रूप देर करने या ठहरे रहने को दर्शाता है। बहुवचन रूप को हिन्दी के ‘ठहरे रहो’ में स्वाभाविक रूप से रखा गया है।
- source_word: עַד נְטוֹת הַיּוֹם
  choice: दिन ढलने तक
  rationale: נטה के साथ ‘दिन’ का प्रयोग दिन के झुकने या शाम की ओर बढ़ने का चित्र देता है। ‘दिन ढलने तक’ हिन्दी का स्वाभाविक मुहावरा है और मूल चित्र भी सुरक्षित रखता है।
- source_word: וַיֹּאכְלוּ שְׁנֵיהֶם
  choice: तब उन दोनों ने खाया
  rationale: שְׁנֵיהֶם दो व्यक्तियों पर स्पष्ट बल देता है। ‘तब’ पिता के आग्रह के परिणामस्वरूप हुई अगली क्रिया को दर्शाता है।
