source:
  edition: WLC
  text: וְ/גַם תֶּ֤בֶן גַּם מִסְפּוֹא֙ יֵ֣שׁ לַ/חֲמוֹרֵ֔י/נוּ וְ֠/גַם לֶ֣חֶם וָ/יַ֤יִן יֶשׁ לִ/י֙ וְ/לַֽ/אֲמָתֶ֔/ךָ וְ/לַ/נַּ֖עַר עִם עֲבָדֶ֑י/ךָ אֵ֥ין מַחְס֖וֹר כָּל דָּבָֽר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/019/019.yaml
  text: Yet there is both straw and fodder for our donkeys[a], and there is bread and wine for me, for your female servant, and for the young man with your servants[c][b]; there is no lack of anything.
translation:
  language: hi
  text: हमारे गधों के लिए भूसा भी है और चारा भी[a]; और मेरे लिए, आपकी दासी[b] के लिए, और उस युवक के लिए जो आपके सेवकों के साथ है, रोटी और दाखरस भी है। किसी भी चीज़ की कमी नहीं है[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में “भी” के अर्थ वाला शब्द बार-बार आया है, जिससे उपलब्ध प्रबंध की पर्याप्तता पर जोर पड़ता है।
    reason: lexical_note
  - marker: b
    text: “आपकी दासी” उस स्त्री के लिए विनम्र और आदरसूचक अभिव्यक्ति है जो उसके साथ यात्रा कर रही थी।
    reason: cultural_note
  - marker: c
    text: या, “हमें किसी भी चीज़ की कमी नहीं है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם ... גַם ... וְגַם
  choice: भी ... भी ... भी
  rationale: इब्रानी में दोहराए गए וְגַם/גַם की योगात्मक और बलाघाती भूमिका को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: תֶּבֶן
  choice: भूसा
  rationale: यह पशुओं के चारे या बिछावन में काम आने वाले सूखे डंठलों का सामान्य आधुनिक हिन्दी शब्द है।
- source_word: מִסְפּוֹא
  choice: चारा
  rationale: पशुओं के भोजन को दर्शाता है और मनुष्यों के लिए आगे बताई गई सामग्री से स्पष्ट भेद रखता है।
- source_word: לַחֲמוֹרֵינוּ
  choice: हमारे गधों के लिए
  rationale: बहुवचन और प्रथम पुरुष बहुवचन संबंधसूचक प्रत्यय, दोनों को स्पष्ट रूप से व्यक्त करता है।
- source_word: לֶחֶם וָיַיִן
  choice: रोटी और दाखमधु
  rationale: दोनों ठोस खाद्य-पदार्थों को व्यापक अर्थ वाले ‘भोजन’ में बदले बिना प्रस्तुत करता है; ‘दाखमधु’ יַיִן का सटीक और गरिमापूर्ण हिन्दी रूप है।
- source_word: יֶשׁ לִי
  choice: मेरे लिए ... है
  rationale: इब्रानी अस्तित्वसूचक रचना और उपलब्ध सामग्री पर उसके जोर को हिन्दी में सुरक्षित रखता है।
- source_word: אֲמָתֶךָ
  choice: आपकी दासी
  rationale: स्त्रीलिंग तथा वक्ता की विनम्र, आदरसूचक अभिव्यक्ति दोनों को बनाए रखता है।
- source_word: לַנַּעַר
  choice: उस जवान के लिए
  rationale: נַעַר के युवा पुरुष वाले व्यापक अर्थ को रखता है; अगला वाक्यांश उसकी संगति स्पष्ट करता है।
- source_word: עִם עֲבָדֶיךָ
  choice: जो आपके सेवकों के साथ है
  rationale: मसोरेटिक पाठ के द्वितीय पुरुष एकवचन संबंधसूचक अर्थ को सम्मानसूचक हिन्दी ‘आपके’ से सुरक्षित रखते हुए वाक्यांश को ‘जवान’ से जोड़ता है।
- source_word: אֵין מַחְסוֹר כָּל דָּבָר
  choice: किसी भी चीज़ की कमी नहीं है
  rationale: पूर्ण पर्याप्तता बताने वाले इब्रानी मुहावरे का निकट और स्वाभाविक हिन्दी रूप है।
theological_decisions:
- issue: עִם עֲבָדֶיךָ में ‘आपके सेवकों’ का संदर्भ
  choice: मसोरेटिक पाठ के अनुसार ‘आपके सेवकों’ रखा गया है
  alternative: ‘हमारे सेवकों’ या ‘हमारे साथ’
  rationale: प्राप्त इब्रानी पाठ में द्वितीय पुरुष एकवचन प्रत्यय है। संदर्भगत कठिनाई को पाठ बदलकर चुपचाप दूर नहीं किया गया; यह विनम्रतापूर्वक वक्ता के दल को संबोधित करने की शैली हो सकती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। संवाद में सम्मानसूचक ‘आप’ प्रयोग किया गया है। ‘दासी’ प्राचीन सामाजिक और विनम्र संबोधन को सटीक रूप से रखता है, जबकि बाकी वाक्यरचना आज के पाठक के लिए स्वाभाविक है।
