source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר לְ/נַעֲר֔/וֹ לְךָ֥ וְ/נִקְרְבָ֖ה בְּ/אַחַ֣ד הַ/מְּקֹמ֑וֹת וְ/לַ֥נּוּ בַ/גִּבְעָ֖ה א֥וֹ בָ/רָמָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/019/013.yaml
  text: He said to his young man[a], “Come, and let us draw near to one of these places[b], and spend the night in Gibeah or in Ramah.”
translation:
  language: hi
  text: उसने अपने सेवक[a] से कहा, “चलो, हम इन स्थानों में से किसी एक के निकट चलें और गिबा या रामा में रात बिताएँ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपने युवक” अथवा “अपने परिचारक”।
    reason: lexical_alternative
lexical_decisions:
- source_word: לְנַעֲרוֹ
  choice: अपने सेवक
  rationale: נַעַר का अर्थ युवक, सेवक या परिचारक हो सकता है। यहाँ वह लेवी के साथ यात्रा कर रहे पुरुष सहायक को सूचित करता है; आधुनिक हिन्दी में ‘सेवक’ प्रसंग को स्वाभाविक और स्पष्ट रखता है, जबकि वैकल्पिक मूल अर्थ फुटनोट में दिया गया है।
- source_word: לְךָ
  choice: चलो
  rationale: הלך का आदेशात्मक रूप शाब्दिक रूप से ‘जा’ है, पर अगले सहभावात्मक क्रियारूप के साथ यह मिलकर साथ आगे बढ़ने का आमंत्रण देता है; हिन्दी में ‘चलो’ यही भाव स्वाभाविक रूप से व्यक्त करता है।
- source_word: וְנִקְרְבָה
  choice: हम ... के पास चलें
  rationale: सहभावात्मक रूप संयुक्त प्रस्ताव या संकल्प व्यक्त करता है। ‘पास चलें’ קרב की निकट जाने की गति को सहज आधुनिक हिन्दी में बनाए रखता है।
- source_word: בְּאַחַד הַמְּקֹמוֹת
  choice: इन जगहों में से किसी एक के पास
  rationale: वाक्यांश निकटवर्ती संभावित पड़ावों में से एक को दर्शाता है, जिन्हें आगे गिबा और रामा के रूप में बताया गया है। ‘इन’ वक्ता के संकेतार्थ को स्वाभाविक बनाता है।
- source_word: וְלַנּוּ
  choice: रात बिताएँ
  rationale: לון का अर्थ रात भर ठहरना है; ‘रात बिताएँ’ साधारण आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: בַגִּבְעָה
  choice: गिबा में
  rationale: स्थान-नाम का हिन्दी लिप्यंतरण किया गया है; नगर में रात बिताने के लिए ‘में’ स्वाभाविक परसर्ग है।
- source_word: בָרָמָה
  choice: रामा में
  rationale: स्थान-नाम का हिन्दी लिप्यंतरण किया गया है और गिबा के समानांतर ‘में’ रखा गया है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘चलो’ तथा ‘हम ... चलें’ साथ यात्रा जारी रखने के आमंत्रण को व्यक्त करते हैं। अंग्रेज़ी परामर्श-पाठ में फुटनोट-चिह्नों की विषयवस्तु उलटी प्रतीत होती है; मूल इब्रानी के आधार पर נַעַר की अर्थगत विविधता के लिए [a] रखा गया है।
