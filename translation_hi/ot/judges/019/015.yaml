  text: They turned aside there to go in and spend the night at Gibeah[a]. He went in and sat down in the open square of the city[b], and there was no man gathering them into his house to spend the night.
translation:
  language: hi
  text: तब वे वहाँ मुड़कर गिबा में प्रवेश करने और रात बिताने के लिए गए। वह नगर में प्रवेश करके नगर के खुले चौक में बैठ गया, और कोई पुरुष उन्हें रात बिताने के लिए अपने घर में नहीं ले गया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּסֻרוּ
  choice: वे वहाँ से मुड़कर
  rationale: סור यात्रा के मार्ग से हटकर किसी स्थान की ओर मुड़ने को व्यक्त करता है; ‘मुड़कर’ इस गति को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: לָבוֹא לָלוּן
  choice: रात बिताने के लिए भीतर गए
  rationale: בוא प्रवेश करने और לון रात भर ठहरने को दर्शाते हैं; संयुक्त अनुवाद हिन्दी में उद्देश्य और गति दोनों स्पष्ट करता है।
- source_word: בַּגִּבְעָה
  choice: गिबा में
  rationale: स्थाननाम का हिन्दी लिप्यंतरण किया गया है; नगर में प्रवेश के संदर्भ में ‘में’ स्वाभाविक है।
- source_word: וַיָּבֹא וַיֵּשֶׁב
  choice: वह ... जाकर बैठ गया
  rationale: मूल में क्रियाएँ एकवचन हो जाती हैं और मुख्य यात्री को समूह के प्रतिनिधि के रूप में प्रस्तुत करती हैं।
- source_word: בִּרְחוֹב הָעִיר
  choice: नगर के खुले चौक में
  rationale: רְחוֹב चौड़ी सार्वजनिक जगह या चौक को दर्शा सकता है; यहाँ ‘खुला चौक’ उस सार्वजनिक स्थान का स्वाभाविक वर्णन है।
- source_word: וְאֵין אִישׁ
  choice: पर किसी पुरुष ने ... नहीं
  rationale: मूल का אִישׁ स्पष्टतः ‘पुरुष’ है; हिन्दी वाक्य-विन्यास में नकारात्मक कथन को क्रियात्मक रूप दिया गया है।
- source_word: מְאַסֵּף אוֹתָם הַבַּיְתָה
  choice: उन्हें ... अपने घर में नहीं ठहराया
  rationale: אסף का शाब्दिक अर्थ भीतर इकट्ठा करना या ले लेना है, पर इस आतिथ्य-संदर्भ में यात्रियों को घर में रात के लिए ठहराना अभिप्रेत है।
