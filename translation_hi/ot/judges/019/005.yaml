base_translation:
  language: en
  yaml_path: translation/ot/judges/019/005.yaml
  text: On the fourth day[a], they rose early in the morning, and he got up to go. But the young woman’s father said to his son-in-law, “Refresh your heart with a morsel of bread[b], and afterward you may go.”
translation:
  language: hi
  text: चौथे दिन वे भोर में जल्दी उठे, और वह जाने के लिए उठा। तब युवती के पिता ने अपने दामाद से कहा, “रोटी का एक टुकड़ा खाकर अपनी ताकत बढ़ा लो[a]; उसके बाद तुम लोग जा सकते हो[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक अर्थ है, “रोटी के एक टुकड़े से अपने हृदय को सहारा दो।” यह भोजन करके स्वयं को ताज़ा और समर्थ करने का मुहावरा है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में “जा सकते हो” बहुवचन है। पिता सीधे अपने दामाद से बात कर रहा है, पर संभवतः पूरे यात्री-दल को संबोधित कर रहा है।
    reason: alternative_reading
lexical_decisions:
- source_word: בַּיּוֹם הָרְבִיעִי
  choice: चौथे दिन
  rationale: यह सीधी कालवाचक अभिव्यक्ति है; ठहरने की अवधि जैसी कोई अतिरिक्त बात जोड़े बिना कथा का क्रम स्पष्ट रखती है।
- source_word: וַיַּשְׁכִּימוּ בַבֹּקֶר
  choice: वे भोर को जल्दी उठे
  rationale: बहुवचन क्रिया को बनाए रखता है और प्रस्थान के लिए जल्दी उठने पर इब्रानी बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וַיָּקָם לָלֶכֶת
  choice: वह जाने के लिए उठा
  rationale: एकवचन में आए कथानक के केंद्र-परिवर्तन को सुरक्षित रखता है और उद्देश्यवाचक infinitive का सहज अनुवाद करता है।
- source_word: אֲבִי הַנַּעֲרָה
  choice: युवती के पिता
  rationale: נַעֲרָה के लिए आधुनिक, आयु-संगत और गरिमापूर्ण हिन्दी अभिव्यक्ति।
- source_word: חֲתָנוֹ
  choice: अपने दामाद
  rationale: इस प्रसंग में संबंध का स्पष्ट और स्वाभाविक हिन्दी समतुल्य।
- source_word: סְעָד לִבְּךָ
  choice: अपना जी संभाल लो
  rationale: शाब्दिक रूप से ‘अपने हृदय को सहारा/बल दो’; भोजन करके स्वयं को ताज़ा या समर्थ करने के मुहावरे को ‘जी’ के देसी मुहावरे के साथ व्यक्त करता है।
- source_word: פַּת לֶחֶם
  choice: थोड़ी-सी रोटी खाकर
  rationale: रोटी के ठोस बिंब और अल्प मात्रा दोनों को रखता है; हिन्दी में क्रिया जोड़ने से भोजन द्वारा शक्ति पाने का आशय स्वाभाविक बनता है।
- source_word: וְאַחַר תֵּלֵכוּ
  choice: उसके बाद तुम लोग जा सकते हो
  rationale: इब्रानी की बहुवचन क्रिया को स्पष्ट रूप से सुरक्षित रखता है; पिता सीधे दामाद से बोल रहा है, पर विदा होने वाले पूरे यात्री-दल की ओर संकेत है।
