  text: When the man rose to leave with his concubine and his attendant, his father-in-law, the young woman’s father, said to him, “Look, the day is waning toward evening. Please stay the night. Look, the day is nearly over[a]. Spend the night here and let your heart be glad. Then rise early tomorrow for your journey[b], and go home[c].”
translation:
  language: hi
  text: जब वह पुरुष अपनी उपपत्नी और अपने सेवक के साथ जाने के लिए उठा, तो उसके ससुर, अर्थात उस युवती के पिता ने उससे कहा, “देखो, दिन शाम की ओर ढल रहा है। कृपया आज रात यहीं ठहर जाओ। देखो, दिन अब डेरा डाल रहा है[a]। आज रात यहीं रहो और तुम्हारा मन प्रसन्न हो। फिर कल तुम सब सवेरे उठकर प्रस्थान करना[b], और तुम अपने घर चले जाना[c]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “दिन डेरा डाल रहा है”; यह दिन के ठहरने या समाप्त होने का सजीव बिंब है।
    reason: source_image
  - marker: b
    text: “तुम सब सवेरे उठकर प्रस्थान करना” में “उठकर” इब्रानी में बहुवचन है और पूरे यात्री-दल को संबोधित करता है।
    reason: grammar
  - marker: c
    text: “तुम अपने घर चले जाना” इब्रानी में एकवचन है और उस पुरुष को संबोधित करता है। शाब्दिक रूप से, “अपने तम्बू को जाना,” अर्थात घर चले जाना।
    reason: grammar_and_lexical_alternative
lexical_decisions:
- source_word: הָאִישׁ
  choice: वह पुरुष
  rationale: सामान्य कथात्मक शब्द אִישׁ का सीधा और गरिमापूर्ण रूप; यहाँ ‘पति’ कहना मूल से अधिक विशिष्ट होता।
- source_word: פִילַגְשׁוֹ
  choice: अपनी उपपत्नी
  rationale: पाठ में वर्णित विशिष्ट सामाजिक संबंध को ‘पत्नी’ कहकर नरम नहीं किया गया।
- source_word: נַעֲרוֹ
  choice: अपने सेवक
  rationale: इस यात्रा-संदर्भ में נַעַר उस पुरुष के साथ चलने वाले सेवक अथवा परिचर को दर्शाता है; आयु पर बल नहीं है।
- source_word: חֹתְנוֹ אֲבִי הַנַּעֲרָה
  choice: उसके ससुर, अर्थात उस युवती के पिता
  rationale: संबंध और उसके बाद आने वाले व्याख्यात्मक पदबंध, दोनों सुरक्षित रखे गए हैं।
- source_word: רָפָה הַיּוֹם לַעֲרֹב
  choice: दिन ढलते-ढलते शाम हो रही है
  rationale: दिन के कमजोर पड़कर संध्या की ओर जाने का भाव सहज आधुनिक हिन्दी में व्यक्त होता है।
- source_word: לִינוּ נָא
  choice: कृपया आज रात यहीं ठहर जाओ
  rationale: बहुवचन आदेश को हिन्दी में समूह-संबोधित ‘जाओ’ से व्यक्त किया गया है; विनय-सूचक נָא को ‘कृपया’ दर्शाता है।
- source_word: חֲנוֹת הַיּוֹם
  choice: दिन अब डेरा डाल रहा है
  rationale: असामान्य इब्रानी बिंब को मुख्य पाठ में सुरक्षित रखा गया है और पादटिप्पणी में उसका आशय स्पष्ट किया गया है।
- source_word: וְיִיטַב לְבָבֶךָ
  choice: अपने मन को प्रसन्न होने दो
  rationale: ‘हृदय का अच्छा होना’ मुहावरे का आनंदित होने का भाव प्राकृतिक हिन्दी में रखा गया है।
- source_word: וְהִשְׁכַּמְתֶּם מָחָר לְדַרְכְּכֶם
  choice: कल तुम सब सवेरे उठकर अपनी यात्रा पर निकलना
  rationale: बहुवचन क्रिया द्वारा पूरे यात्री-दल को संबोधन स्पष्ट किया गया है।
- source_word: וְהָלַכְתָּ לְאֹהָלֶךָ
  choice: तुम अपने घर चले जाना
  rationale: शाब्दिक ‘अपने तम्बू को जाना’ यहाँ घर लौटने का प्रचलित कथन है; मूल अभिव्यक्ति पादटिप्पणी में दी गई है।
