  text: הִנֵּה֩ בִתִּ֨/י הַ/בְּתוּלָ֜ה וּ/פִֽילַגְשֵׁ֗/הוּ אוֹצִֽיאָה נָּ֤א אוֹתָ/ם֙ וְ/עַנּ֣וּ אוֹתָ֔/ם וַ/עֲשׂ֣וּ לָ/הֶ֔ם הַ/טּ֖וֹב בְּ/עֵינֵי/כֶ֑ם וְ/לָ/אִ֤ישׁ הַ/זֶּה֙ לֹ֣א תַעֲשׂ֔וּ דְּבַ֖ר הַ/נְּבָלָ֥ה הַ/זֹּֽאת־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/019/024.yaml
  text: Look[a], here are my virgin daughter and his concubine. Please let me bring them out. Violate them and do to them what is good in your eyes[c][b]. But to this man do not do this outrageous thing.
translation:
  language: hi
  text: देखो, मेरी कुँवारी बेटी और उसकी उपपत्नी यहाँ हैं। कृपया, मुझे उन्हें बाहर ले आने दो। तुम उनके साथ यौन हिंसा करो[a] और उनके साथ वही करो जो तुम्हारी दृष्टि में अच्छा हो[b]। लेकिन इस पुरुष के साथ यह जघन्य काम[c] मत करो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उनके साथ बलात्कार करो।’ यहाँ प्रयुक्त इब्रानी क्रिया इस प्रसंग में यौन हिंसा और अपमान का अर्थ दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से ‘जो तुम्हारी आँखों में अच्छा हो’; यह मुहावरा उस काम को दर्शाता है जो किसी को अच्छा या मनचाहा लगे।
    reason: cultural_note
  - marker: c
    text: या ‘यह घोर नीच काम’ अथवा ‘यह लज्जाजनक काम।’
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: देखो
  rationale: यह विस्मयादिबोधक शब्द तत्काल ध्यान खींचता है। ‘देखो’ आधुनिक हिन्दी में स्वाभाविक है और मूल की तात्कालिकता बनाए रखता है।
- source_word: בִתִּי הַבְּתוּלָה
  choice: मेरी कुँवारी बेटी
  rationale: यह बेटी की पहचान कुँवारी के रूप में करता है। ‘कुँवारी’ मूल के लैंगिक आशय को केवल ‘अविवाहित’ कहने की अपेक्षा अधिक ठीक रखता है।
- source_word: וּפִילַגְשֵׁהוּ
  choice: और उसकी उपपत्नी
  rationale: ‘उपपत्नी’ उस स्त्री की मान्य किन्तु पत्नी से निम्न सामाजिक-वैवाहिक स्थिति को ‘रखैल’ जैसे अधिक अवमाननापूर्ण आधुनिक शब्द से बेहतर व्यक्त करता है।
- source_word: אוֹצִיאָה נָּא
  choice: कृपया मुझे उन्हें बाहर ले आने दो
  rationale: कोहोर्टेटिव रूप और נָא मिलकर विनती तथा वक्ता की इच्छा व्यक्त करते हैं; यह हिन्दी रूप दोनों को बनाए रखता है।
- source_word: וְעַנּוּ אוֹתָם
  choice: तुम उनका यौन अपमान करो
  rationale: पिएल रूप इस प्रसंग में यौन हिंसा और अपमान का बोध देता है। ‘यौन अपमान’ उस भयावहता को स्पष्ट करता है, पर क्रिया को बिना टिप्पणी सीधे केवल एक विशिष्ट कानूनी अपराध तक सीमित नहीं करता।
- source_word: וַעֲשׂוּ לָהֶם הַטּוֹב בְּעֵינֵיכֶם
  choice: उनके साथ वही करो जो तुम्हारी दृष्टि में अच्छा हो
  rationale: यह मूल के ‘तुम्हारी आँखों में अच्छा’ मुहावरे को निकटता से रखता है और हिन्दी में समझने योग्य है।
- source_word: וְלָאִישׁ הַזֶּה
  choice: लेकिन इस पुरुष के साथ
  rationale: आरम्भ में रखे गए पदबंध का विरोधात्मक बल ‘लेकिन’ से व्यक्त होता है और स्त्रियों तथा पुरुष के बीच वक्ता द्वारा किए गए भेद को छिपाया नहीं जाता।
- source_word: דְּבַר הַנְּבָלָה הַזֹּאת
  choice: यह घोर नीच काम
  rationale: נְבָלָה सामान्य मूर्खता नहीं, बल्कि सामुदायिक और नैतिक मर्यादा तोड़ने वाले घृणित कृत्य को दर्शाता है। ‘घोर नीच काम’ आधुनिक हिन्दी में उसका कठोर नैतिक आकलन व्यक्त करता है।
theological_decisions:
- issue: यौन हिंसा को स्पष्ट करना, पर मूल क्रिया की अर्थ-सीमा को अनावश्यक रूप से संकुचित न करना
  choice: ‘उनका यौन अपमान करो’
  alternative: ‘उनके साथ बलात्कार करो’ अथवा ‘उन्हें अपमानित करो’
  rationale: प्रसंग निस्संदेह यौन हिंसा का है। चुना हुआ रूप इसे नरम नहीं करता, जबकि पादटिप्पणी अधिक स्पष्ट सम्भावना ‘बलात्कार’ बताती है; केवल ‘अपमानित’ कहना आधुनिक पाठक के लिए अत्यधिक अस्पष्ट होता।
- issue: נְבָלָה में निहित नैतिक निन्दा
  choice: ‘यह घोर नीच काम’
  alternative: ‘यह जघन्य काम’ अथवा ‘यह लज्जाजनक काम’
  rationale: शब्द यहाँ बौद्धिक मूर्खता के बजाय भयंकर नैतिक और सामाजिक उल्लंघन व्यक्त करता है। चुना हुआ रूप उसकी निन्दात्मक शक्ति को सहज हिन्दी में बनाए रखता है।
- issue: वक्ता के मूल्यांकन और कथा के नैतिक दृष्टिकोण में भेद
  choice: वक्ता के विरोधाभासी प्रस्ताव को बिना अनुमोदन जोड़े यथावत् रखना
  alternative: अनुवाद में स्त्रियों के विरुद्ध प्रस्ताव की स्पष्ट सम्पादकीय निन्दा जोड़ना
  rationale: पद स्वयं वक्ता की भयावह वाणी प्रस्तुत करता है। अनुवाद को उसे न तो उचित ठहराना चाहिए, न मूल में अनुपस्थित सम्पादकीय टिप्पणी जोड़कर कथात्मक तनाव मिटाना चाहिए।
translation_notes:
  register: भाषा आधुनिक, गंभीर और कथात्मक रखी गई है। यौन हिंसा को न तो शिष्टोक्ति से छिपाया गया है, न मूल से अधिक कानूनी विशिष्टता दी गई है। ‘उपपत्नी’ बाइबलीय-सांस्कृतिक पद के लिए गरिमापूर्ण मानक हिन्दी है।
