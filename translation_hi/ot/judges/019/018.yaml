source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֵלָ֗י/ו עֹבְרִ֨ים אֲנַ֜חְנוּ מִ/בֵּֽית לֶ֣חֶם יְהוּדָה֮ עַד יַרְכְּתֵ֣י הַר אֶפְרַיִם֒ מִ/שָּׁ֣ם אָנֹ֔כִי וָ/אֵלֵ֕ךְ עַד בֵּ֥ית לֶ֖חֶם יְהוּדָ֑ה וְ/אֶת בֵּ֤ית יְהוָה֙ אֲנִ֣י הֹלֵ֔ךְ וְ/אֵ֣ין אִ֔ישׁ מְאַסֵּ֥ף אוֹתִ֖/י הַ/בָּֽיְתָ/ה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/019/018.yaml
  text: He said to him[a], “We are passing through from Bethlehem in Judah to the remote parts of the hill country of Ephraim. I am from there, and I went to Bethlehem in Judah, and I am going to the house of Yahweh, but no man is taking me into his house.”
translation:
  language: hi
  text: उसने उससे कहा, “हम यहूदा के बेतलेहेम से एप्रैम के पहाड़ी प्रदेश के दूर-दराज़ भागों की ओर यात्रा कर रहे हैं। मैं वहीं का हूँ। मैं यहूदा के बेतलेहेम गया था, और मैं यहोवा के भवन जा रहा हूँ[a]; पर कोई आदमी मुझे अपने घर में नहीं ठहरा रहा है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और मैं अपने घर जा रहा हूँ” अथवा “घर जा रहा हूँ।” कुछ लोग यहाँ इब्रानी को मुहावरे के रूप में समझते हैं या मानते हैं कि यह किसी भिन्न पाठ को प्रतिबिंबित करता है, क्योंकि इस प्रसंग में “यहोवा के भवन” का उल्लेख अप्रत्याशित है।
    reason: वैकल्पिक पाठ/अर्थ
lexical_decisions:
- source_word: עֹבְרִים אֲנַחְנוּ
  choice: हम ... से होकर ... जा रहे हैं
  rationale: कृदंत और सर्वनाम यात्रा की जारी अवस्था बताते हैं। ‘से होकर ... जा रहे हैं’ עבר के पारगमन-भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מִבֵּית לֶחֶם יְהוּדָה
  choice: यहूदा के बेतलेहेम से
  rationale: यह स्थान-सूचक पद बेतलेहेम को यहूदा के क्षेत्र से संबद्ध करता है और दूसरे बेतलेहेम से अलग पहचानता है।
- source_word: יַרְכְּתֵי הַר אֶפְרַיִם
  choice: एप्रैम के पहाड़ी प्रदेश के दूर-दराज़ भागों
  rationale: יַרְכְּתֵי छोरों अथवा दूरस्थ भागों को दर्शाता है; הַר אֶפְרַיִם यहाँ एप्रैम का पहाड़ी प्रदेश है।
- source_word: מִשָּׁם אָנֹכִי
  choice: मैं वहीं का हूँ
  rationale: यह वक्ता के मूल स्थान का सीधा और स्वाभाविक हिन्दी कथन है।
- source_word: וָאֵלֵךְ עַד בֵּית לֶחֶם יְהוּדָה
  choice: मैं यहूदा के बेतलेहेम गया था
  rationale: הלך का वय्यिक्तोल रूप यहाँ बीती हुई यात्रा को बताता है; ‘गया था’ वर्तमान वापसी-यात्रा से उसका संबंध स्पष्ट करता है।
- source_word: וְאֶת בֵּית יְהוָה אֲנִי הֹלֵךְ
  choice: अब मैं यहोवा के भवन जा रहा हूँ
  rationale: मसोरेटी पाठ स्पष्टतः ‘यहोवा का भवन’ पढ़ता है। הֹלֵךְ जारी गमन व्यक्त करता है; ‘अब’ हिन्दी प्रवाह में वर्तमान चरण को स्पष्ट करता है, बिना गंतव्य बदलने के।
- source_word: יְהוָה
  choice: यहोवा
  rationale: व्यक्तिगत ईश्वरीय नाम को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से प्रस्तुत किया गया है, न कि किसी पदवी से।
- source_word: וְאֵין אִישׁ מְאַסֵּף אוֹתִי הַבָּיְתָה
  choice: पर कोई पुरुष मुझे अपने घर में नहीं ठहरा रहा
  rationale: इस आतिथ्य-संदर्भ में אסף का अर्थ घर में ग्रहण करना या ठहराना है। אִישׁ के पुल्लिंग एकवचन को ‘पुरुष’ से बनाए रखा गया है।
theological_decisions:
- issue: וְאֶת בֵּית יְהוָה אֲנִי הֹלֵךְ का कठिन पाठ
  choice: मैं यहोवा के भवन जा रहा हूँ
  alternative: मैं अपने घर जा रहा हूँ / मैं घर जा रहा हूँ
  rationale: मसोरेटी पाठ में स्पष्ट रूप से ‘यहोवा का भवन’ है। प्रसंग में यह असामान्य लगने पर भी मुख्य पाठ उसी को सुरक्षित रखता है; प्रासंगिक अथवा वैकल्पिक पाठ-समझ को पादटिप्पणी में दिया गया है।
- issue: אִישׁ का लिंग और वचन
  choice: कोई पुरुष
  alternative: कोई व्यक्ति / कोई भी
  rationale: मूल में पुल्लिंग एकवचन संज्ञा है और प्रसंग घर के पुरुष मुखिया द्वारा आतिथ्य देने का है; इसलिए उसका लिंग-सूचक रूप बनाए रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण कथात्मक रूप अपनाया गया है। ‘बेतलेहेम,’ ‘एप्रैम’ और ‘यहोवा’ परिचित बाइबलीय नाम-रूप हैं। मुख्य पाठ में कठिन मसोरेटी पाठ सुरक्षित है और वैकल्पिक समझ पादटिप्पणी में दी गई है।
