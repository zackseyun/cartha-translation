base_translation:
  language: en
  yaml_path: translation/ot/judges/019/001.yaml
  text: And it happened in those days[a], when there was no king in Israel, that a Levite man was dwelling in the remote parts of the hill country of Ephraim, and he took for himself a woman, a concubine[b], from Bethlehem in Judah.
translation:
  language: hi
  text: 'उन दिनों ऐसा हुआ[a]: इस्राएल में कोई राजा नहीं था। लेवी कुल का एक पुरुष एप्रैम के पहाड़ी प्रदेश के दूरस्थ भागों में रह रहा था; उसने यहूदा के बेतलेहेम की एक स्त्री को अपनी उपपत्नी के रूप में ग्रहण किया।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उन दिनों ऐसा हुआ जब इस्राएल में कोई राजा नहीं था।” इब्रानी में यहाँ समन्वयी उपवाक्य है, जिसे अलग कथन या समय-संबंधी पृष्ठभूमि—दोनों रूपों में समझा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: ऐसा हुआ
  rationale: इब्रानी कथा-सूत्र को सहज, आधुनिक हिन्दी में व्यक्त करता है और प्रसंग के आरम्भ का संकेत बनाए रखता है।
- source_word: בַּיָּמִים הָהֵם
  choice: उन दिनों
  rationale: यह न्यायियों में प्रयुक्त मानक काल-सूचक अभिव्यक्ति है और साहित्यिक आवृत्ति को सुरक्षित रखती है।
- source_word: וּמֶלֶךְ אֵין בְּיִשְׂרָאֵל
  choice: जब इस्राएल में कोई राजा नहीं था
  rationale: मूल में समन्वयी उपवाक्य है, पर यहाँ इसे कालगत पृष्ठभूमि के रूप में पढ़ना स्वाभाविक है; पादटिप्पणी स्वतंत्र कथन की सम्भावना सुरक्षित रखती है।
- source_word: אִישׁ לֵוִי
  choice: एक लेवी पुरुष
  rationale: मूल के 'पुरुष' और 'लेवी' दोनों घटकों को बनाए रखता है।
- source_word: גָּר
  choice: रह रहा था
  rationale: सहज आधुनिक हिन्दी है; मूल क्रिया में अस्थायी अथवा परदेशी निवासी का भाव सम्भव है, पर संदर्भ उसे निश्चित नहीं करता।
- source_word: בְּיַרְכְּתֵי
  choice: दूर-दराज़ भाग में
  rationale: भौगोलिक छोर, पिछला हिस्सा अथवा दुर्गम दूरस्थ क्षेत्र होने का भाव स्पष्ट करता है।
- source_word: הַר אֶפְרַיִם
  choice: एप्रैम के पहाड़ी प्रदेश
  rationale: यह किसी एक पर्वत के बजाय एप्रैम के पहाड़ी भूभाग का क्षेत्रीय नाम है।
- source_word: וַיִּקַּח לוֹ
  choice: अपनी ... बनाया
  rationale: स्त्री को अपने लिए ग्रहण करने और मान्य संबंध स्थापित करने का भाव स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אִשָּׁה פִילֶגֶשׁ
  choice: एक स्त्री को अपनी उपपत्नी
  rationale: '''स्त्री'' को बनाए रखते हुए उसकी विशिष्ट सामाजिक स्थिति ''उपपत्नी'' से स्पष्ट की गई है; इसे आकस्मिक यौन-संबंध के अर्थ में नहीं लिया गया।'
- source_word: מִבֵּית לֶחֶם יְהוּדָה
  choice: यहूदा के बेतलेहेम की
  rationale: स्थान को यहूदा के बेतलेहेम के रूप में पहचानता है और दूसरे समान नाम वाले स्थानों से अलग करता है।
theological_decisions:
- issue: इस्राएल में राजा न होने संबंधी न्यायियों का आवर्ती कथन
  choice: जब इस्राएल में कोई राजा नहीं था
  alternative: और इस्राएल में कोई राजा नहीं था
  rationale: इसे कथानक की पृष्ठभूमि के रूप में प्रस्तुत किया गया है, पर राजतंत्र के समर्थन या विरोध का कोई मूल्यांकन अनुवाद में नहीं जोड़ा गया; मूल की व्याकरणिक सम्भावना पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। कथा-सूत्र तथा न्यायियों के आवर्ती कथन को बनाए रखते हुए अनावश्यक पुरातनता से बचा गया है। 'उपपत्नी' के ऐतिहासिक-सामाजिक अर्थ को पादटिप्पणी में स्पष्ट किया गया है।
