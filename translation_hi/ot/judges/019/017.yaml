  text: וַ/יִּשָּׂ֣א עֵינָ֗י/ו וַ/יַּ֛רְא אֶת הָ/אִ֥ישׁ הָ/אֹרֵ֖חַ בִּ/רְחֹ֣ב הָ/עִ֑יר וַ/יֹּ֨אמֶר הָ/אִ֧ישׁ הַ/זָּקֵ֛ן אָ֥נָה תֵלֵ֖ךְ וּ/מֵ/אַ֥יִן תָּבֽוֹא־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/019/017.yaml
  text: He looked up and saw the traveler in the open square of the city[a], and the old man said, “Where are you going[b], and where do you come from?”
translation:
  language: hi
  text: उसने नज़र उठाकर नगर के चौक[b] में उस यात्री[a] को देखा। तब उस बूढ़े आदमी ने पूछा, “तुम कहाँ जा रहे हो और कहाँ से आए हो?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “राही” अथवा “अतिथि।” इब्रानी शब्द यात्रा करने वाले व्यक्ति को और आतिथ्य के संदर्भ में अतिथि को भी सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “नगर की चौड़ी सड़क पर।” इब्रानी शब्द विशेष रूप से किसी चौड़े सार्वजनिक स्थान या चौक को सूचित करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא עֵינָיו
  choice: उसने नज़र उठाकर
  rationale: इब्रानी मुहावरे का शाब्दिक अर्थ ‘उसने अपनी आँखें उठाईं’ है। ‘नज़र उठाकर’ आधुनिक हिन्दी में स्वाभाविक रहते हुए उसी क्रिया को व्यक्त करता है।
- source_word: וַיַּרְא
  choice: देखा
  rationale: मूल क्रिया सामान्य दृश्य-बोध को बताती है; ‘देखा’ इसका सीधा और अनिर्वचनात्मक अनुवाद है।
- source_word: הָאִישׁ הָאֹרֵחַ
  choice: उस यात्री
  rationale: אֹרֵחַ यहाँ यात्रा पर निकले, राह चलते व्यक्ति को सूचित करता है। ‘यात्री’ आधुनिक हिन्दी में स्पष्ट है और उसे पहले से मेहमान मान लेने से बचता है।
- source_word: בִּרְחֹב הָעִיר
  choice: नगर के चौक में
  rationale: רְחוֹב प्रायः नगर के चौड़े, खुले सार्वजनिक स्थान को दर्शाता है। ‘चौक’ हिन्दी में संक्षिप्त और स्वाभाविक समतुल्य है।
- source_word: הָאִישׁ הַזָּקֵן
  choice: उस बूढ़े आदमी
  rationale: यह पद वक्ता की पहचान एक वृद्ध पुरुष के रूप में करता है। ‘बूढ़ा आदमी’ कथा-भाषा में सीधा और सामान्य है।
- source_word: אָנָה תֵלֵךְ
  choice: तुम कहाँ जा रहे हो
  rationale: אָנָה गंतव्य पूछता है और अपूर्ण क्रिया तत्काल चल रही यात्रा के संदर्भ में है; हिन्दी का वर्तमान अपूर्ण रूप स्वाभाविक है।
- source_word: וּמֵאַיִן תָּבוֹא
  choice: और कहाँ से आए हो
  rationale: वाक्यांश यात्रा के आरंभ-स्थान के बारे में पूछता है। हिन्दी में ‘कहाँ से आए हो?’ इस संदर्भ में मूल अर्थ को सहज रूप से व्यक्त करता है।
