  yaml_path: translation/ot/judges/019/028.yaml
  text: He said to her[a], “Get up, and let us go.” But there was no answer. Then he put her on the donkey[c][b], and the man rose and went to his place.
translation:
  language: hi
  text: उसने उससे कहा, “उठ, और हम चलें।” पर कोई उत्तर न मिला।[a] तब उसने उसे उठाकर गधे पर रखा।[b] फिर वह पुरुष उठा और अपने स्थान पर चला गया।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी में शाब्दिक अर्थ: “कोई उत्तर देनेवाला न था” या “कोई उत्तर नहीं दे रहा था।”'
    reason: lexical_alternative
  - marker: b
    text: या, “तब उसने उसे गधे पर लिया।” इब्रानी क्रिया का शाब्दिक अर्थ “लेना” है; यहाँ प्रसंग में इसका अर्थ उसे पशु पर चढ़ाना या उस पर रखना हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: 'या, “अपने घर चला गया।” इब्रानी में: “अपने स्थान को/की ओर।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלֶיהָ
  choice: उसने उससे कहा
  rationale: आरंभिक वाव-क्रम को स्वाभाविक हिन्दी कथन-शैली में अलग से ‘और’ जोड़े बिना व्यक्त किया गया है। स्त्रीलिंग प्रत्यय का अर्थ ‘उससे’ में सुरक्षित है।
- source_word: קוּמִי
  choice: उठ
  rationale: यह קום का स्त्रीलिंग एकवचन आज्ञार्थक रूप है। ‘उठ’ आधुनिक हिन्दी में सीधा और स्वाभाविक आदेश है।
- source_word: וְנֵלֵכָה
  choice: और हम चलें
  rationale: प्रथम पुरुष बहुवचन cohortative का इच्छार्थक/प्रेरणार्थक भाव ‘हम चलें’ से स्पष्ट होता है।
- source_word: וְאֵין עֹנֶה
  choice: पर कोई उत्तर न मिला
  rationale: शाब्दिक अर्थ ‘कोई उत्तर देनेवाला नहीं’ या ‘कोई उत्तर नहीं दे रहा’ है। प्रसंग में प्रतिक्रिया के अभाव को स्वाभाविक हिन्दी में व्यक्त किया गया है; ‘पर’ विरोधी संबंध दिखाता है।
- source_word: וַיִּקָּחֶהָ עַל הַחֲמוֹר
  choice: तब उसने उसे उठाकर गधे पर रखा
  rationale: לקח का मूल अर्थ ‘लेना’ है, किंतु עַל הַחֲמוֹר के साथ यहाँ स्त्री को उठाकर पशु पर रखने की क्रिया अभिप्रेत है। अनुवाद क्रिया को स्पष्ट करता है, जबकि पादटिप्पणी शाब्दिक विकल्प सुरक्षित रखती है।
- source_word: וַיָּקָם הָאִישׁ
  choice: फिर वह पुरुष उठा
  rationale: קום को अगली क्रिया הלך से अलग रखा गया है। ‘पुरुष’ मूल पाठ के הָאִישׁ को बनाए रखता है।
- source_word: וַיֵּלֶךְ לִמְקֹמוֹ
  choice: और अपने स्थान को चला गया
  rationale: מקום का व्यापक अर्थ ‘स्थान’ है। प्रसंग में घर या निवासस्थान संभव है, पर मुख्य पाठ मूल की अस्पष्टता बनाए रखता है।
