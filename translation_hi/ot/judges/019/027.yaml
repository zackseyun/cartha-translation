source:
  edition: WLC
  text: וַ/יָּ֨קָם אֲדֹנֶ֜י/הָ בַּ/בֹּ֗קֶר וַ/יִּפְתַּח֙ דַּלְת֣וֹת הַ/בַּ֔יִת וַ/יֵּצֵ֖א לָ/לֶ֣כֶת לְ/דַרְכּ֑/וֹ וְ/הִנֵּ֧ה הָ/אִשָּׁ֣ה פִֽילַגְשׁ֗/וֹ נֹפֶ֨לֶת֙ פֶּ֣תַח הַ/בַּ֔יִת וְ/יָדֶ֖י/הָ עַל הַ/סַּֽף־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/019/027.yaml
  text: Her master got up in the morning and opened the doors of the house and went out to go on his way[a], and behold, the woman, his concubine, was lying at the entrance of the house, with her hands on the threshold.
translation:
  language: hi
  text: उसका स्वामी सुबह उठा, उसने घर के दरवाज़े खोले और अपनी राह पर जाने के लिए बाहर निकला। और देखो, वह स्त्री—उसकी उपपत्नी—घर के प्रवेश-द्वार पर गिरी पड़ी थी[a], और उसके हाथ देहरी पर थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पड़ी हुई थी।”
    reason: इब्रानी participle נֹפֶלֶת का अर्थ यहाँ गिरने के परिणामस्वरूप पड़ी अवस्था अथवा केवल लेटी/पड़ी अवस्था के रूप में समझा जा सकता है।
lexical_decisions:
- source_word: אֲדֹנֶיהָ
  choice: उसका स्वामी
  rationale: यह शब्द शाब्दिक रूप से ‘उसका स्वामी/प्रभु’ है और संबंध में निहित सामाजिक विषमता को बनाए रखता है; ‘पति’ कहने से मूल की विशिष्टता दब जाती।
- source_word: דַּלְתוֹת הַבַּיִת
  choice: घर के दरवाज़े
  rationale: मूल इब्रानी में ‘दरवाज़े’ बहुवचन है, इसलिए उसे बनाए रखा गया है।
- source_word: וַיֵּצֵא לָלֶכֶת לְדַרְכּוֹ
  choice: अपनी राह पर जाने के लिए बाहर निकला
  rationale: उद्देश्यसूचक infinitive और ‘अपनी राह’ की इब्रानी अभिव्यक्ति दोनों को स्वाभाविक हिन्दी में सुरक्षित रखा गया है।
- source_word: וְהִנֵּה
  choice: और देखो
  rationale: यह आकस्मिक और स्तब्धकारी दृश्य की ओर ध्यान खींचने वाला कथात्मक संकेत है; इसे साधारण ‘तब’ में समतल नहीं किया गया।
- source_word: הָאִשָּׁה פִילַגְשׁוֹ
  choice: वह स्त्री—उसकी उपपत्नी
  rationale: मूल की समानाधिकरण संरचना सुरक्षित है। ‘उपपत्नी’ פִילֶגֶשׁ का अपेक्षाकृत सटीक और गरिमापूर्ण हिन्दी रूप है; ‘रखैल’ अनावश्यक रूप से अपमानजनक हो सकता है।
- source_word: נֹפֶלֶת
  choice: गिरी पड़ी थी
  rationale: स्त्रीलिंग participle गिरने के परिणामस्वरूप बनी अवस्था को दर्शा सकता है। ‘गिरी पड़ी थी’ मूल के ‘गिरने’ और दृश्य में उसकी स्थिर मुद्रा, दोनों को व्यक्त करता है।
- source_word: פֶּתַח הַבַּיִת
  choice: घर के प्रवेश-द्वार पर
  rationale: פֶּתַח घर के प्रवेश या द्वार-स्थान को सूचित करता है; यह हिन्दी में स्पष्ट और दृश्यात्मक है।
- source_word: וְיָדֶיהָ עַל הַסַּף
  choice: और उसके हाथ देहरी पर थे
  rationale: मूल की क्रियारहित उपवाक्य-संरचना का अर्थ स्पष्ट करते हुए उसके सजीव दृश्य को बनाए रखा गया है।
