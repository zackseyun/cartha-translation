  text: וַ/יֶּחֱזַק בּ֤/וֹ חֹֽתְנ/וֹ֙ אֲבִ֣י הַֽ/נַּעֲרָ֔ה וַ/יֵּ֥שֶׁב אִתּ֖/וֹ שְׁלֹ֣שֶׁת יָמִ֑ים וַ/יֹּאכְלוּ֙ וַ/יִּשְׁתּ֔וּ וַ/יָּלִ֖ינוּ שָֽׁם־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/019/004.yaml
  text: And his father-in-law[a], the young woman's father, urged him to stay, and he remained with him three days; and they ate and drank, and spent the nights there.
translation:
  language: hi
  text: तब उसके ससुर ने, अर्थात उस युवती के पिता ने, उससे रुकने का बहुत आग्रह किया[a], और वह उसके साथ तीन दिन रहा। उन्होंने खाया-पिया और वहीं रातें बिताईं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उस पर जोर डाला,” “उसे रुकने के लिए दबाव डाला,” अथवा “उसे रोक लिया।” हिब्रू मुहावरा शाब्दिक रूप से कहता है कि उसका ससुर “उसके साथ/विरुद्ध दृढ़ हुआ।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּחֱזַק בּוֹ
  choice: उसे रुकने के लिए बहुत आग्रह किया
  rationale: हिब्रू मुहावरे का शाब्दिक भाव ‘उसके साथ/विरुद्ध दृढ़ हुआ’ है। संदर्भ में यह ठहरने के लिए जोरदार आग्रह दर्शाता है; ‘बहुत आग्रह किया’ सामाजिक दबाव को व्यक्त करता है, पर जबरन रोकने का अर्थ निश्चित नहीं करता।
- source_word: חֹתְנוֹ
  choice: उसके ससुर
  rationale: यह विवाह-संबंध के आधार पर उस पुरुष के ससुर को सूचित करता है और आधुनिक हिन्दी का स्वाभाविक संबंधवाची शब्द है।
- source_word: אֲבִי הַנַּעֲרָה
  choice: उस युवती के पिता
  rationale: यह समानाधिकरण पद ससुर की पहचान स्पष्ट करता है। वैवाहिक संदर्भ में נַעֲרָה के लिए ‘युवती’ स्वाभाविक है।
- source_word: וַיֵּשֶׁב אִתּוֹ
  choice: वह उसके साथ तीन दिन रहा
  rationale: ישב यहाँ बैठने के बजाय ठहरे या बने रहने का अर्थ देता है; ‘रहा’ सरल और प्रसंगानुकूल है।
- source_word: שְׁלֹשֶׁת יָמִים
  choice: तीन दिन
  rationale: समय की सीधी अभिव्यक्ति।
- source_word: וַיֹּאכְלוּ וַיִּשְׁתּוּ
  choice: उन्होंने खाया-पिया
  rationale: दोनों क्रियाओं को सीधे और मुहावरेदार हिन्दी में रखा गया है; ‘दावत की’ जैसा व्याख्यात्मक विस्तार नहीं जोड़ा गया।
- source_word: וַיָּלִינוּ שָׁם
  choice: वहीं रातें बिताईं
  rationale: לון रात बिताने या रात को ठहरने को दर्शाता है। बहुवचन ‘रातें’ तीन दिनों की अवधि में बार-बार रात बिताने का भाव स्पष्ट करता है।
