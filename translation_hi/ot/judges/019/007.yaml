  yaml_path: translation/ot/judges/019/007.yaml
  text: Then the man got up to go[a], but his father-in-law urged him, so he turned back and spent the night there.
translation:
  language: hi
  text: तब वह आदमी जाने के लिए उठा, पर उसके ससुर ने उससे बहुत आग्रह किया[a]; इसलिए वह वापस आ गया और वहीं रात ठहरा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उस पर दबाव डाला” अथवा “उसे बहुत मनाया”; इब्रानी क्रिया लगातार और ज़ोर देकर आग्रह करने का भाव व्यक्त करती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: उठा
  rationale: क़ूम का कथात्मक रूप किसी कार्य के लिए उठने को दर्शाता है; यहाँ यह प्रस्थान की तैयारी है।
- source_word: הָאִישׁ
  choice: वह पुरुष
  rationale: इब्रानी में सामान्य कथात्मक पद ‘पुरुष’ है; संदर्भ में यह लेवी है, पर स्रोत यहाँ संबंधसूचक या पदनाम नहीं देता।
- source_word: לָלֶכֶת
  choice: जाने के लिए
  rationale: हलख़ का क्रियार्थक रूप उद्देश्य बताता है—वह जाने के लिए उठा। यह ‘विदा होने’ जैसी व्याख्यात्मक वृद्धि से बचता है।
- source_word: וַיִּפְצַר בּוֹ
  choice: उससे बहुत आग्रह किया
  rationale: पात्सर लगातार और ज़ोर देकर मनाने या आग्रह करने का भाव रखता है; ‘बहुत आग्रह किया’ आधुनिक हिन्दी में उस तीव्रता को स्वाभाविक रूप से व्यक्त करता है।
- source_word: חֹתְנוֹ
  choice: उसके ससुर
  rationale: इस प्रसंग में विवाह-संबंध बताने वाला यह शब्द स्त्री के पिता, अर्थात उस पुरुष के ससुर, के लिए है।
- source_word: וַיָּשָׁב
  choice: वह लौट गया
  rationale: शूव का मूल भाव लौटना या वापस मुड़ना है; यहाँ जाने का इरादा छोड़कर फिर ठहरने की ओर लौटना अभिप्रेत है।
- source_word: וַיָּלֶן שָׁם
  choice: वहीं रात बिताई
  rationale: लून का अर्थ रात को ठहरना है; यह हिन्दी में स्पष्ट और स्वाभाविक अभिव्यक्ति है।
