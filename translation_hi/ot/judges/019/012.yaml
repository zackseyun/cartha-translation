    issue: No footnote anchor for the Hebrew ethnic expression
    rationale: The English audit trail supplies a lexical-alternative note for ‘sons of Israel.’ Anchoring a corresponding Hindi note at ‘इस्राएलियों’ preserves the relevant source-language transparency.
