    issue: Directional expression is awkward
    rationale: ‘किसी पराए नगर में नहीं मुड़ेंगे’ can sound as though the turning occurs once inside the city. Hebrew סור here means turning aside from the route toward the proposed lodging place; ‘नगर की ओर नहीं मुड़ेंगे’ expresses this clearly.
