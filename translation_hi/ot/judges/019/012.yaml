base_translation:
  language: en
  yaml_path: translation/ot/judges/019/012.yaml
  text: But his master said to him[a], “We will not turn aside into a foreign city, which is not of the sons of Israel; rather, we will go on as far as Gibeah.”
translation:
  language: hi
  text: पर उसके स्वामी ने उससे कहा, “हम किसी पराए नगर की ओर नहीं मुड़ेंगे, जो इस्राएलियों[a] का नहीं है; बल्कि हम गिबा तक आगे बढ़ेंगे।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू में शाब्दिक रूप से, “इस्राएल की संतानों में से।” यह इस्राएली लोगों के लिए प्रचलित जातीय अभिव्यक्ति है; “इस्राएलियों” इसका सहज हिंदी रूप है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָיו
  choice: उसके स्वामी
  rationale: कथा में यह मनुष्य और उसके सेवक के सामाजिक संबंध को दर्शाता है, ईश्वरीय उपाधि को नहीं; ‘स्वामी’ वर्तमान हिंदी में गरिमापूर्ण और स्पष्ट है।
- source_word: נָסוּר
  choice: हम ... नहीं मुड़ेंगे
  rationale: סור का दिशात्मक भाव बनाए रखते हुए यह मार्ग छोड़कर नगर में जाने का आशय स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: עִיר נָכְרִי
  choice: किसी पराए नगर
  rationale: נָכְרִי यहाँ इस्राएली समुदाय से बाहर के लोगों के नगर को चिह्नित करता है; ‘पराया नगर’ प्रसंग में ‘विदेशी नगर’ से अधिक स्वाभाविक है।
- source_word: אֲשֶׁר לֹא מִבְּנֵי יִשְׂרָאֵל הֵנָּה
  choice: जो इस्राएलियों का नहीं है
  rationale: हिब्रू वाक्यांश का आशय नगर को गैर-इस्राएली बताना है। ‘इस्राएलियों’ से मानक जातीय अभिव्यक्ति संक्षेप और सहज रूप में आती है, जबकि नगर के लिए प्रयुक्त सामूहिक स्त्रीलिंग बहुवचन सर्वनाम का अर्थ भी सुरक्षित रहता है।
- source_word: וְעָבַרְנוּ
  choice: बल्कि हम ... आगे बढ़ेंगे
  rationale: עבר यहाँ उपलब्ध पड़ाव को छोड़कर यात्रा जारी रखने का अर्थ देता है; ‘आगे बढ़ेंगे’ आधुनिक हिंदी में स्वाभाविक है।
- source_word: עַד גִּבְעָה
  choice: गिबा तक
  rationale: עַד यात्रा की सीमा या गंतव्य दर्शाता है; ‘तक’ इस भाव को ठीक रखता है।
