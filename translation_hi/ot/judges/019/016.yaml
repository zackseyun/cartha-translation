base_translation:
  language: en
  yaml_path: translation/ot/judges/019/016.yaml
  text: And behold[a], an old man was coming in from his work in the field at evening. The man was from the hill country of Ephraim, and he was staying in Gibeah[b], but the men of the place were Benjaminites.
translation:
  language: hi
  text: और देखो, शाम के समय एक बूढ़ा आदमी खेत में अपने काम से लौट रहा था। वह आदमी एप्रैम के पहाड़ी प्रदेश से था और गिबा में रहता था,[a] जबकि वहाँ के लोग बिन्यामीनी थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू क्रिया का अर्थ “रहता था,” “अस्थायी रूप से रहता था,” या “परदेशी के रूप में रहता था” भी हो सकता है; इससे संकेत मिलता है कि वह गिबा का मूल निवासी नहीं था।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: और देखो
  rationale: यह कथानक में एक उल्लेखनीय नए दृश्य की ओर ध्यान खींचने वाले हिब्रू संकेत को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: אִישׁ זָקֵן
  choice: एक बूढ़ा आदमी
  rationale: मूल के संज्ञा-विशेषण संयोजन का सीधा और सामान्य हिन्दी रूप।
- source_word: בָּא מִן מַעֲשֵׂהוּ מִן הַשָּׂדֶה
  choice: खेत में अपना काम करके लौट रहा था
  rationale: दो बार आए מִן को हिन्दी में यांत्रिक रूप से दोहराने के बजाय आगमन की दिशा और खेत के काम से लौटने का आशय स्पष्ट तथा स्वाभाविक ढंग से व्यक्त करता है।
- source_word: בָּעֶרֶב
  choice: शाम के समय
  rationale: समय-सूचक वाक्यांश का सहज आधुनिक हिन्दी रूप।
- source_word: מֵהַר אֶפְרַיִם
  choice: एप्रैम के पहाड़ी प्रदेश से
  rationale: यह भौगोलिक पद सामान्यतः किसी एक पर्वत के बजाय एप्रैम के पहाड़ी भूभाग को दर्शाता है।
- source_word: גָר בַּגִּבְעָה
  choice: गिबा में परदेशी होकर रहता था
  rationale: גור में निवास के साथ गैर-मूल निवासी अथवा प्रवासी होने की छाया है; यह रूप उस अर्थ को केवल 'रहता था' से अधिक स्पष्टता से बचाए रखता है।
- source_word: וְאַנְשֵׁי הַמָּקוֹם בְּנֵי יְמִינִי
  choice: जबकि उस स्थान के निवासी बिन्यामीनी थे
  rationale: हिब्रू का संयोजक यहाँ बूढ़े व्यक्ति की एप्रैमी उत्पत्ति और स्थानीय लोगों की बिन्यामीनी पहचान के बीच निहित विरोध दिखाता है। 'निवासी' पुरुषवाची 'लोगों' की तुलना में हिन्दी में अधिक स्वाभाविक है और सामूहिक स्थानीय जन को व्यक्त करता है।
