base_translation:
  language: en
  yaml_path: translation/ot/judges/019/006.yaml
  text: So the two of them sat down together and ate and drank. Then the young woman's father said to the man[a], "Please, be willing to stay the night, and let your heart be glad."
translation:
  language: hi
  text: तब वे दोनों साथ बैठे और उन्होंने खाया-पिया। फिर युवती के पिता ने उस पुरुष से कहा, “कृपया रात भर ठहरने के लिए राज़ी हो जाइए और आपका मन प्रसन्न हो।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “कृपया रात बिताने के लिए सहमत हो जाइए और आपका मन आनंदित हो।”
    reason: הוֹאֶל नָא और וְיִטַב לִבֶּךָ के अधिक शाब्दिक वैकल्पिक अनुवाद को दर्शाता है।
lexical_decisions:
- source_word: וַיֵּשְׁבוּ
  choice: बैठ गए
  rationale: ישׁב यहाँ भोजन से पहले की क्रमिक कथा-क्रिया है; ‘बैठ गए’ स्वाभाविक हिन्दी में इस भाव को व्यक्त करता है।
- source_word: שְׁנֵיהֶם יַחְדָּו
  choice: वे दोनों साथ
  rationale: ‘दोनों’ और ‘साथ’ रखकर इब्रानी के बलाघातपूर्ण युग्म को सुरक्षित रखा गया है।
- source_word: וַיֹּאכְלוּ וַיִּשְׁתּוּ
  choice: उन्होंने खाया-पिया
  rationale: दोनों क्रियाओं का सीधा और स्वाभाविक हिन्दी अनुवाद है; पेय का कोई कर्म नहीं जोड़ा गया।
- source_word: אֲבִי הַנַּעֲרָה
  choice: युवती के पिता
  rationale: נַעֲרָה के लिए ‘युवती’ आधुनिक, गरिमापूर्ण और संदर्भानुकूल है।
- source_word: הָאִישׁ
  choice: उस पुरुष
  rationale: व्यापक संदर्भ में उसकी भूमिका स्पष्ट है, पर इस पद में मूल पाठ केवल ‘पुरुष’ कहता है; इसलिए ‘पति’ नहीं जोड़ा गया।
- source_word: הוֹאֶל נָא
  choice: कृपया ... मान जाइए
  rationale: יאל की इच्छा या सहमति और נָא की विनम्र प्रार्थना—दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְלִין
  choice: आज रात यहीं ठहरने
  rationale: לון का अर्थ रात बिताना या रात भर ठहरना है; ‘यहीं’ आतिथ्य के प्रसंग में निहित स्थान को स्पष्ट और स्वाभाविक बनाता है।
- source_word: וְיִטַב לִבֶּךָ
  choice: अपने मन को प्रसन्न कीजिए
  rationale: शाब्दिक ‘तुम्हारा हृदय अच्छा हो’ आतिथ्य के इस प्रसंग में आनंदित या प्रसन्न होने का मुहावरा है; हिन्दी में ‘मन’ इस आंतरिक भाव का स्वाभाविक समतुल्य है।
