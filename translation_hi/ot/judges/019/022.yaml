  text: הֵמָּה֮ מֵיטִיבִ֣ים אֶת לִבָּ/ם֒ וְ/הִנֵּה֩ אַנְשֵׁ֨י הָ/עִ֜יר אַנְשֵׁ֣י בְנֵֽי בְלִיַּ֗עַל נָסַ֨בּוּ֙ אֶת הַ/בַּ֔יִת מִֽתְדַּפְּקִ֖ים עַל הַ/דָּ֑לֶת וַ/יֹּאמְר֗וּ אֶל הָ֠/אִישׁ בַּ֣עַל הַ/בַּ֤יִת הַ/זָּקֵן֙ לֵ/אמֹ֔ר הוֹצֵ֗א אֶת הָ/אִ֛ישׁ אֲשֶׁר בָּ֥א אֶל בֵּיתְ/ךָ֖ וְ/נֵדָעֶֽ/נּוּ־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/019/022.yaml
  text: While they were making their hearts merry[a], behold, the men of the city, worthless men, surrounded the house, pounding on the door. They said to the old man, the master of the house, “Bring out the man who came into your house[b], so that we may know him.”
translation:
  language: hi
  text: जब वे अपने मन को प्रसन्न कर रहे थे, और देखो, नगर के पुरुषों ने—जो अधम लोग[a] थे—घर को घेर लिया और द्वार को ज़ोर-ज़ोर से पीटने लगे। उन्होंने उस बूढ़े आदमी से, जो घर का स्वामी था, कहा, “जो आदमी तुम्हारे घर में आया है, उसे बाहर निकालो, ताकि हम उसे जानें[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप में, “निकम्मेपन के पुत्र”; अर्थात मर्यादाहीन या दुष्ट लोग।
    reason: lexical_alternative
  - marker: b
    text: यहाँ “जानना” यौन अर्थ में प्रयुक्त व्यंजना है; वे उसका यौन उत्पीड़न करना चाहते थे।
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵיטִיבִים אֶת לִבָּם
  choice: अपने मन को प्रसन्न कर रहे थे
  rationale: यह इब्रानी मुहावरे की ‘हृदय/मन को अच्छा या प्रसन्न करने’ वाली छवि को बनाए रखते हुए भोज के आनंद को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְהִנֵּה
  choice: तभी देखो
  rationale: यह अचानक आए भयावह मोड़ की ओर ध्यान खींचने वाले कथात्मक संकेत की तीव्रता बनाए रखता है।
- source_word: אַנְשֵׁי בְנֵי בְלִיַּעַל
  choice: अधम लोग
  rationale: यह पद नैतिक रूप से भ्रष्ट और मर्यादाहीन लोगों के लिए प्रयुक्त मुहावरा है। ‘अधम लोग’ आधुनिक, संक्षिप्त और गरिमापूर्ण हिन्दी है; अधिक शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: נָסַבּוּ אֶת הַבַּיִת
  choice: घर को घेर लिया
  rationale: क्रिया का सीधा अर्थ चारों ओर से घेरना है; यह हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: מִתְדַּפְּקִים עַל הַדָּלֶת
  choice: द्वार को ज़ोर-ज़ोर से पीटने लगे
  rationale: मध्यवाचक कृदंत बार-बार और आक्रामक ढंग से प्रहार करने का भाव देता है, जिसे ‘ज़ोर-ज़ोर से पीटना’ स्पष्ट करता है।
- source_word: בַּעַל הַבַּיִת
  choice: घर का स्वामी
  rationale: यह घर के अधिकारी और मेज़बान व्यक्ति को दर्शाता है; ‘स्वामी’ सामाजिक अधिकार को बनाए रखता है और प्रसंग में स्वाभाविक है।
- source_word: הוֹצֵא
  choice: बाहर निकालो
  rationale: आज्ञार्थक क्रिया अतिथि को घर से बाहर लाने की माँग व्यक्त करती है; यह सीधा आधुनिक हिन्दी रूप है।
- source_word: וְנֵדָעֶנּוּ
  choice: ताकि हम उसे जानें
  rationale: मुख्य पाठ में ‘जानना’ रखकर इब्रानी यौन व्यंजना और उत्पत्ति 19 से उसका साहित्यिक संबंध सुरक्षित रहता है; आशय को पादटिप्पणी स्पष्ट करती है।
theological_decisions:
- issue: וְנֵדָעֶנּוּ में यौन व्यंजना
  choice: मुख्य पाठ में ‘ताकि हम उसे जानें’ रखकर पादटिप्पणी में बलपूर्वक यौन आशय स्पष्ट किया गया है।
  alternative: ‘ताकि हम उसके साथ बलपूर्वक यौन संबंध बनाएँ’ अथवा ‘ताकि हम उसका यौन उत्पीड़न करें।’
  rationale: इब्रानी मूल जानबूझकर ‘जानना’ क्रिया को व्यंजना के रूप में प्रयोग करता है। इसे मुख्य पाठ में सुरक्षित रखना साहित्यिक प्रतिध्वनि और स्रोत की अभिव्यक्ति का सम्मान करता है, जबकि पादटिप्पणी पाठक को वास्तविक हिंसक आशय से अनभिज्ञ नहीं रहने देती।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, कथात्मक किंतु गरिमापूर्ण रखी गई है। ‘मन को प्रसन्न करना’ मूल मुहावरे की छवि बचाता है; ‘तभी देखो’ अचानक कथात्मक मोड़ को उभारता है। हिंसक यौन आशय को मुख्य पाठ की व्यंजना मिटाए बिना पादटिप्पणी में स्पष्ट किया गया है।
