id: JDG.19.2
reference: Judges 19:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/תִּזְנֶ֤ה עָלָי/ו֙ פִּֽילַגְשׁ֔/וֹ וַ/תֵּ֤לֶךְ מֵֽ/אִתּ/וֹ֙ אֶל בֵּ֣ית אָבִ֔י/הָ אֶל בֵּ֥ית לֶ֖חֶם יְהוּדָ֑ה וַ/תְּהִי שָׁ֕ם יָמִ֖ים אַרְבָּעָ֥ה חֳדָשִֽׁים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/019/002.yaml
  text: But his concubine was unfaithful to him[a], and she went away from him to her father's house, to Bethlehem in Judah, and was there for four months.
translation:
  language: hi
  text: पर उसकी उपपत्नी ने उसके प्रति बेवफ़ाई की[a] और उसे छोड़कर अपने पिता के घर, यहूदा के बेतलेहेम, चली गई। वह वहाँ चार महीने रही।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप से, “उसके विरुद्ध वेश्यावृत्ति की।” कुछ प्राचीन व्याख्याकारों ने इस वाक्यांश को अलग तरह से समझा है, जैसे “वह उससे नाराज़ हो गई” या “उससे झगड़ पड़ी।”
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּזְנֶה
  choice: विश्वासघात किया
  rationale: क्रिया זנה का सामान्य अर्थ यौन अनैतिकता या यौन बेवफाई है। यहाँ ‘विश्वासघात किया’ प्रसंगानुसार वैवाहिक/यौन निष्ठा भंग होने का संकेत देता है, पर वेश्यावृत्ति का व्यावसायिक अर्थ अनावश्यक रूप से नहीं जोड़ता।
- source_word: עָלָיו
  choice: उससे
  rationale: זנה के साथ על संबंध में किसी के प्रति बेवफाई को व्यक्त करता है। हिंदी में ‘उससे विश्वासघात किया’ स्वाभाविक है और संबंध-विरोधी भाव को बनाए रखता है।
- source_word: פִּילַגְשׁוֹ
  choice: उसकी उपपत्नी
  rationale: פִּילֶגֶשׁ ऐसी मान्य स्त्री-संगी को दर्शाता है जिसका वैवाहिक दर्जा मुख्य पत्नी से निम्न था। ‘उपपत्नी’ हिंदी बाइबिलीय प्रयोग में संक्षिप्त और परिचित समतुल्य है।
- source_word: וַתֵּלֶךְ מֵאִתּוֹ
  choice: उसे छोड़कर ... चली गई
  rationale: यह गति और उससे अलग हो जाने—दोनों को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: אֶל בֵּית אָבִיהָ
  choice: अपने पिता के घर
  rationale: यह पारिवारिक गृह के मूल भाव का सीधा और स्वाभाविक हिंदी रूप है।
- source_word: אֶל בֵּית לֶחֶם יְהוּדָה
  choice: यहूदा के बेतलेहेम में
  rationale: यह नगर को यहूदा-प्रदेश में स्थित बेतलेहेम के रूप में स्पष्ट करता है और हिंदी में भौगोलिक संबंध स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וַתְּהִי שָׁם
  choice: वह वहाँ ... रही
  rationale: शाब्दिक ‘वहाँ थी’ की अपेक्षा अवधि के साथ ‘रही’ आधुनिक हिंदी कथा में अधिक स्वाभाविक है और कोई अतिरिक्त अर्थ नहीं जोड़ता।
- source_word: יָמִים אַרְבָּעָה חֳדָשִׁים
  choice: चार महीने
  rationale: इब्रानी मुहावरे का आशय चार महीनों की अवधि है; हिंदी में ‘चार महीने’ स्पष्ट और सटीक है।
theological_decisions:
- issue: नैतिक रूप से संवेदनशील कथन וַתִּזְנֶה की व्याख्या
  choice: यौन/वैवाहिक बेवफाई के अर्थ में ‘विश्वासघात किया’
  alternative: ‘वेश्या जैसा आचरण किया’; अथवा कुछ प्राचीन व्याख्याओं के अनुसार ‘वह उससे नाराज़ हो गई’ या ‘उससे झगड़ पड़ी’
  rationale: मसोरेटिक स्वरांकन और זנה का सामान्य शब्दार्थ यौन बेवफाई का समर्थन करते हैं। फिर भी कुछ प्राचीन परंपराओं में कम आरोपात्मक अर्थ मिलता है; इसलिए उस तनाव को मुख्य पाठ में मिटाने के बजाय पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण, सहज कथात्मक शैली अपनाई गई है। ‘उपपत्नी’ सामाजिक दर्जे का संक्षिप्त पारंपरिक पद है। मुख्य पाठ संभावित यौन बेवफाई को स्पष्ट करता है, जबकि प्राचीन वैकल्पिक समझ को पादटिप्पणी में रखा गया है।
