  text: 'उसकी बुद्धिमान कुलीन स्त्रियाँ उसे उत्तर देती हैं; सच तो यह है कि वह स्वयं भी अपनी बातें अपने आप से दोहराती है:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חַכְמוֹת שָׂרוֹתֶיהָ
  choice: उसकी सबसे बुद्धिमान राजकुमारियाँ
  rationale: חַכְמוֹת को यहाँ गुणसूचक बहुवचन के रूप में और שָׂרוֹת को उच्च पद की स्त्रियों के अर्थ में लिया गया है; प्रसंग में सीसरा की माता के साथ उपस्थित कुलीन स्त्रियाँ अभिप्रेत हैं।
- source_word: תַּעֲנֶינָּה
  choice: उत्तर देती हैं
  rationale: अपूर्ण क्रिया का काव्यात्मक वर्तमान हिंदी में स्वाभाविक रूप से व्यक्त होता है।
- source_word: אַף הִיא
  choice: सच तो यह है कि वह स्वयं भी
  rationale: אַף कथन को बल देता है और הִיא का जोर ‘वह स्वयं’ से सुरक्षित रहता है।
- source_word: תָּשִׁיב אֲמָרֶיהָ לָהּ
  choice: अपनी बातों को अपने मन में दोहराती है
  rationale: शाब्दिक संरचना ‘अपनी बातें अपने को लौटाती है’ है; संदर्भ में यह स्वयं से वही बातें कहने अथवा दोहराने का भाव देता है। ‘अपने मन में’ सहज हिंदी में आत्म-संबोधन प्रकट करता है, पर इसे प्रत्यक्ष उत्तर के रूप में अनावश्यक रूप से निश्चित नहीं करता।
