base_translation:
  language: en
  yaml_path: translation/ot/judges/005/002.yaml
  text: When leaders took the lead in Israel, when the people volunteered, bless the LORD!
translation:
  language: hi
  text: 'जब इस्राएल में अगुवों ने अगुवाई की[a],

    जब लोगों ने स्वेच्छा से अपने आपको अर्पित किया,

    तब यहोवा को धन्य कहो!'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी पदबंध का अर्थ अनिश्चित है; इसका अनुवाद “जब इस्राएल में बाल खुले छोड़े गए” भी हो सकता है, संभवतः युद्ध के लिए समर्पण के संकेत के रूप में।
    reason: मूल के दुर्लभ पदबंध בִּפְרֹעַ פְּרָעוֹת की वास्तविक lexical ambiguity को प्रकट करना।
lexical_decisions:
- source_word: בִּפְרֹעַ פְּרָעוֹת
  choice: जब ... अगुवों ने अगुवाई की
  rationale: यह असामान्य और विवादित इब्रानी पदबंध है। संदर्भ में यह नेतृत्व के लिए आगे आने का भाव दे सकता है; हिन्दी में संज्ञा और संबंधित क्रिया द्वारा मूल की पुनरुक्ति को यथासंभव सुरक्षित रखा गया है।
- source_word: בְּהִתְנַדֵּב עָם
  choice: जब लोगों ने स्वेच्छा से अपने आपको अर्पित किया
  rationale: התנדב यहाँ केवल सामान्य रूप से ‘स्वयंसेवा करना’ नहीं, बल्कि युद्ध अथवा सामुदायिक कार्य के लिए स्वयं को इच्छापूर्वक प्रस्तुत करने का भाव रखता है।
- source_word: בָּרֲכוּ יְהוָה
  choice: यहोवा को धन्य कहो
  rationale: आज्ञार्थक बहुवचन को स्पष्ट रखा गया है और परमेश्वर के विशिष्ट नाम יהוה को ‘यहोवा’ के रूप में प्रस्तुत किया गया है।
theological_decisions:
- issue: पहली पंक्ति में नेतृत्व बनाम खुले/बिखरे बाल
  choice: मुख्य पाठ में ‘अगुवों ने अगुवाई की’
  alternative: ‘जब इस्राएल में बाल खुले छोड़े गए’ अथवा ‘जब योद्धाओं ने बाल खुले छोड़े’
  rationale: इब्रानी पदबंध का अर्थ अनिश्चित है। गीत के युद्ध-संदर्भ और समानांतर पंक्ति में लोगों के स्वेच्छा से प्रस्तुत होने के कारण नेतृत्व वाला अर्थ मुख्य पाठ में स्वाभाविक है, पर वैकल्पिक शाब्दिक समझ को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक, काव्यात्मक और गरिमापूर्ण हिन्दी। समानांतर पंक्तियों की लय बनाए रखी गई है; ‘अगुवों ने अगुवाई की’ मूल की शब्द-पुनरुक्ति को दर्शाता है।
