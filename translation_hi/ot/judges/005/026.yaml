base_translation:
  language: en
  yaml_path: translation/ot/judges/005/026.yaml
  text: She reached out her hand for the tent peg[a], her right hand for the workmen’s hammer; then she struck Sisera, she shattered his head[c][b], she smashed and pierced his temple.
translation:
  language: hi
  text: 'उसने अपना हाथ तम्बू की खूंटी की ओर बढ़ाया,

    और अपना दाहिना हाथ मज़दूरों के हथौड़े की ओर;

    उसने सीसरा को मारा, उसका सिर चकनाचूर कर दिया,

    उसकी कनपटी कुचल दी और आर-पार भेद दिया।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अन्तिम पंक्ति का अनुवाद यह भी हो सकता है: “उसने उसकी कनपटी कुचल दी और भेद दिया।” इब्रानी में लगातार कई प्रबल क्रियाएँ हैं; अन्तिम क्रिया में ‘पार निकलने’ या ‘आर-पार करने’ का भाव हो सकता है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָדָהּ ... תִּשְׁלַחְנָה
  choice: उसने अपना हाथ ... की ओर बढ़ाया
  rationale: हाथ को किसी वस्तु की ओर फैलाने की क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है और काव्यात्मक दृश्य बनाए रखता है।
- source_word: לַיָּתֵד
  choice: तम्बू की खूंटी
  rationale: न्यायियों 4 में याएल के प्रसंग से स्पष्ट है कि यह तम्बू गाड़ने की खूंटी है; ‘तम्बू की’ जोड़ने से संकेतक स्पष्ट होता है।
- source_word: וִימִינָהּ
  choice: अपना दाहिना हाथ
  rationale: पहली पंक्ति के ‘हाथ’ के साथ मूल समानांतरता को सुरक्षित रखता है।
- source_word: לְהַלְמוּת עֲמֵלִים
  choice: कारीगरों के हथौड़े
  rationale: यह असामान्य इब्रानी पदबंध प्रहार करने वाले औज़ार को दर्शाता है; ‘कारीगरों का हथौड़ा’ उसके संबंधवाचक रूप और संभावित अर्थ को सहज हिन्दी में रखता है।
- source_word: וְהָלְמָה
  choice: प्रहार किया
  rationale: मूल क्रिया का सीधा और गरिमापूर्ण अर्थ देता है, तथा अगले प्रबल क्रियापदों के लिए स्थान छोड़ता है।
- source_word: מָחֲקָה רֹאשׁוֹ
  choice: उसका सिर चकनाचूर कर दिया
  rationale: क्रिया के कुचलने या चूर करने के प्रबल अर्थ को काव्यात्मक और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וּמָחֲצָה
  choice: कुचलकर
  rationale: लगातार प्रयुक्त हिंसक क्रियाओं की तीव्रता बनाए रखते हुए पिछली क्रिया से अलग हिन्दी शब्द देता है।
- source_word: וְחָלְפָה רַקָּתוֹ
  choice: उसकी कनपटी ... आर-पार कर दी
  rationale: חלף यहाँ पार निकलने या भेदकर निकलने का भाव दे सकता है; ‘आर-पार कर दी’ उस गति को संक्षिप्त रूप में व्यक्त करता है।
- source_word: רַקָּתוֹ
  choice: उसकी कनपटी
  rationale: सिर के पार्श्व भाग के लिए सटीक और सामान्य आधुनिक हिन्दी शब्द है।
