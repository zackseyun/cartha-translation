  yaml_path: translation/ot/judges/005/027.yaml
  text: Between her feet he sank[a], he fell, he lay; between her feet he sank, he fell; where he sank[c][b], there he fell—destroyed.
translation:
  language: hi
  text: उसके पाँवों के बीच वह ढह गया[a], गिरा, पड़ा रहा; उसके पाँवों के बीच वह ढह गया, गिरा; जहाँ वह ढह गया, वहीं वह गिरा—नष्ट हुआ[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसके पाँवों के पास वह ढह गया।”
    reason: lexical_alternative
  - marker: b
    text: या “उजड़ा,” “पूरी तरह परास्त,” अथवा “मारा गया।” इब्रानी शब्द उजड़े, लुटे या पूरी तरह नष्ट किए हुए व्यक्ति का भाव दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּין רַגְלֶיהָ
  choice: उसके पाँवों के बीच
  rationale: यह इब्रानी स्थान-सूचक चित्र और उसकी पुनरावृत्ति को सीधे बनाए रखता है। ‘उसके पाँवों पर’ अधिक मुहावरेदार विकल्प है, पर मूल के ‘बीच’ को कम कर देता है।
- source_word: כָּרַע
  choice: वह झुका
  rationale: क्रिया घुटने मुड़ने, झुकने या नीचे धँसने को व्यक्त कर सकती है। ‘झुका’ मूल की शारीरिक गति को बनाए रखता है और स्वेच्छापूर्वक प्रणाम करने का अर्थ अनिवार्य नहीं करता।
- source_word: נָפַל
  choice: गिरा
  rationale: नפל का सीधा और स्वाभाविक समतुल्य; काव्यात्मक बल के लिए पुनरावृत्ति यथावत रखी गई है।
- source_word: שָׁכָב
  choice: पड़ा रहा
  rationale: मृत्यु-दृश्य में शׁכב की स्थिर अवस्था को स्वाभाविक हिन्दी में व्यक्त करता है और छोटे क्रियात्मक क्रम को बनाए रखता है।
- source_word: בַּאֲשֶׁר ... שָׁם
  choice: जहाँ ... वहीं
  rationale: स्थानवाचक संबंध और इब्रानी के ‘वहाँ’ पर दिए गए बल को सहज हिन्दी में व्यक्त करता है।
- source_word: שָׁדוּד
  choice: धराशायी
  rationale: यह निष्क्रिय विशेषण यहाँ पूरी तरह परास्त, उजड़ा अथवा विनष्ट पड़े व्यक्ति को दर्शाता है। ‘धराशायी’ मृत्यु-दृश्य में स्वाभाविक है, पर अंतिम शब्द की अर्थ-सीमा के कारण विकल्प पादटिप्पणी में दिए गए हैं।
