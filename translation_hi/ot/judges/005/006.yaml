  text: בִּ/ימֵ֞י שַׁמְגַּ֤ר בֶּן עֲנָת֙ בִּ/ימֵ֣י יָעֵ֔ל חָדְל֖וּ אֳרָח֑וֹת וְ/הֹלְכֵ֣י נְתִיב֔וֹת יֵלְכ֕וּ אֳרָח֖וֹת עֲקַלְקַלּֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/006.yaml
  text: In the days of Shamgar son of Anath[a], in the days of Jael, the highways were deserted[b], and travelers went by roundabout paths.
translation:
  language: hi
  text: अनात के पुत्र शमगर के दिनों में, याएल के दिनों में, मुख्य मार्गों पर आना-जाना बंद हो गया था[a], और राहगीर घुमावदार रास्तों से जाते थे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “मार्ग बंद हो गए”—अर्थात मुख्य रास्तों पर सामान्य आवागमन रुक गया था।
    reason: lexical_alternative
  - marker: b
    text: “घुमावदार रास्ते” संभवतः ऐसे अप्रत्यक्ष छोटे मार्ग थे जिन्हें लोग सुरक्षा के लिए अपनाते थे; यहाँ नैतिक कुटिलता की बात नहीं है।
    reason: cultural_note
lexical_decisions:
- source_word: בִּימֵי
  choice: के दिनों में
  rationale: यह समय-सूचक इब्रानी मुहावरे का स्वाभाविक और गरिमापूर्ण हिन्दी रूप है।
- source_word: שַׁמְגַּר בֶּן־עֲנָת
  choice: अनात के पुत्र शमगर
  rationale: व्यक्तिनामों का देवनागरी लिप्यंतरण किया गया है और בֶּן का अर्थ स्पष्ट रूप से ‘पुत्र’ दिया गया है।
- source_word: יָעֵל
  choice: याएल
  rationale: इब्रानी व्यक्तिनाम का निकट देवनागरी लिप्यंतरण।
- source_word: חָדְלוּ אֳרָחוֹת
  choice: मुख्य मार्गों पर आना-जाना बंद हो गया था
  rationale: शाब्दिक रूप से ‘मार्ग बंद हो गए/थम गए’; प्रसंग में सामान्य सार्वजनिक मार्गों का उपयोग रुक जाना अभिप्रेत है। यह रूप उस अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הֹלְכֵי נְתִיבוֹת
  choice: राहगीर
  rationale: शाब्दिक अर्थ ‘पथों पर चलने वाले’ है; ‘राहगीर’ हिन्दी में यात्रियों के लिए संक्षिप्त और स्वाभाविक पद है।
- source_word: יֵלְכוּ
  choice: जाते थे
  rationale: गीत के अतीतकालीन संदर्भ में अपूर्ण क्रिया आदतन या निरंतर व्यवहार बताती है।
- source_word: אֳרָחוֹת עֲקַלְקַלּוֹת
  choice: घुमावदार रास्तों से
  rationale: עֲקַלְקַלּוֹת टेढ़े, घूमते या अप्रत्यक्ष मार्गों को दर्शाता है। ‘घुमावदार’ नैतिक कुटिलता का अनचाहा अर्थ दिए बिना भौतिक मार्ग की छवि बनाए रखता है।
