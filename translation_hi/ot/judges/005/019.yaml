base_translation:
  language: en
  yaml_path: translation/ot/judges/005/019.yaml
  text: Kings came; they fought. Then the kings of Canaan fought at Taanach[a], by the waters of Megiddo; they took no plunder of silver.
translation:
  language: hi
  text: 'राजा आए, वे लड़े;

    तब कनान के राजा

    तानाक में, मगिद्दो के पानी के पास, लड़े;

    उन्होंने चाँदी की कोई लूट नहीं ली।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “चाँदी का लाभ” अथवा “चाँदी का मुनाफ़ा।” इब्रानी अभिव्यक्ति सामान्य भौतिक लाभ को भी सूचित कर सकती है, पर युद्ध के इस संदर्भ में “चाँदी की लूट” अधिक उपयुक्त है।
    reason: lexical_alternative
