  rationale: בֶּצַע लाभ, प्राप्ति या लूट को सूचित कर सकता है। युद्ध-संदर्भ में ‘लूट’ उपयुक्त है; לָקָחוּ के लिए ‘पाई’ स्वाभाविक हिंदी में यह भाव देता है कि उन्हें ऐसी लूट हासिल नहीं हुई।
