base_translation:
  language: en
  yaml_path: translation/ot/judges/005/017.yaml
  text: Gilead stayed beyond the Jordan[b][a]; and Dan—why did he sojourn by the ships? Asher sat by the seashore and stayed by his harbors.
translation:
  language: hi
  text: 'गिलाद यरदन के पार बसा रहा;


    और दान—वह क्यों जहाज़ों के पास ठहरा रहा?[a]


    आशेर समुद्र-तट पर बैठा रहा,


    और अपनी खाड़ियों के पास बसा रहा।[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह जहाज़ों के पास क्यों रहता रहा?” इब्रानी क्रिया का अर्थ ‘रहना’ या ‘परदेशी होकर ठहरना’ हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “अपने बंदरगाहों के पास।” इब्रानी शब्द का मूल भाव खुली जगहों या कटावों का है और इस तटीय प्रसंग में यह खाड़ियों, समुद्री प्रवेशिकाओं या बंदरगाहों को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: גִּלְעָד
  choice: गिलाद
  rationale: इब्रानी में भूभाग/गोत्र का नाम सीधे आया है; इसे व्याख्यात्मक रूप से ‘गिलादी लोग’ बनाने के बजाय नाम ही रखा गया है।
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: यरदन के पार
  rationale: यह वक्ता की दृष्टि से नदी के दूसरी ओर का स्वाभाविक और संक्षिप्त भौगोलिक वर्णन है।
- source_word: שָׁכֵן
  choice: बसा रहा
  rationale: क्रिया रहने या बसे रहने को बताती है; प्रसंग में युद्ध में न आने की निष्क्रियता भी सुनाई देती है, पर उसे अलग से जोड़ा नहीं गया।
- source_word: יָגוּר
  choice: ठहरा रहा
  rationale: גור का अर्थ परदेशी होकर रहना या कुछ समय ठहरना हो सकता है। ‘ठहरा रहा’ गीत की भर्त्सना और क्रिया की अस्थायी ध्वनि दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אֳנִיּוֹת
  choice: जहाज़ों
  rationale: बहुवचन समुद्री जलयानों के लिए है; ‘जहाज़’ आधुनिक हिन्दी में स्पष्ट और गरिमापूर्ण है।
- source_word: יָשַׁב
  choice: बैठा रहा
  rationale: शाब्दिक ‘बैठना/रहना’ में से ‘बैठा रहा’ निष्क्रियता का काव्यात्मक चित्र सुरक्षित रखता है।
- source_word: לְחוֹף יַמִּים
  choice: समुद्र-तट पर
  rationale: शाब्दिक रूप से ‘समुद्रों के तट’ है; हिन्दी में समुद्री तट का अर्थ स्वाभाविक रूप से देने के लिए एकवचन सामूहिक प्रयोग किया गया है।
- source_word: מִפְרָצָיו
  choice: अपनी खाड़ियों
  rationale: शब्द टूटे हुए तटीय भागों, प्रवेशिकाओं या खाड़ियों को सूचित कर सकता है। ‘खाड़ियों’ मूल आकृति को ‘बंदरगाहों’ की अपेक्षा कम व्याख्यात्मक ढंग से रखता है।
- source_word: יִשְׁכּוֹן
  choice: बसा रहा
  rationale: रहने/बसने की क्रिया है और पहले पद की समानांतर निष्क्रियता को बनाए रखती है।
