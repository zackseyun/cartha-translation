  text: מַ֥יִם שָׁאַ֖ל חָלָ֣ב נָתָ֑נָה בְּ/סֵ֥פֶל אַדִּירִ֖ים הִקְרִ֥יבָה חֶמְאָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/025.yaml
  text: He asked for water[a]; she gave milk[b]. In a bowl fit for nobles she brought him curds.
translation:
  language: hi
  text: उसने पानी माँगा; याएल ने उसे दूध दिया। रईसों के योग्य कटोरे में[b] वह उसके लिए दही[a] लाई।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मलाई” अथवा “मक्खन”; इब्रानी शब्द किसी गाढ़े, समृद्ध दुग्ध-पदार्थ को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: या “रईसों के कटोरे में”; शाब्दिक रूप से “रईसों के कटोरे में।”
    reason: lexical_alternative
lexical_decisions:
- source_word: מַיִם
  choice: पानी
  rationale: यह शब्द सामान्य अर्थ में जल को दर्शाता है और सीसरा की माँग तथा याएल द्वारा दिए गए दूध के बीच का अंतर बनाए रखता है।
- source_word: שָׁאַל
  choice: माँगा
  rationale: काल रूप पूर्ण क्रिया है और यहाँ किसी वस्तु की माँग करने का स्वाभाविक हिन्दी प्रयोग उपयुक्त है।
- source_word: חָלָב
  choice: दूध
  rationale: यह शब्द का सामान्य और संदर्भानुकूल अर्थ है।
- source_word: נָתָנָה
  choice: याएल ने उसे ... दिया
  rationale: इब्रानी स्त्रीलिंग क्रिया से देने वाली स्त्री स्पष्ट है; हिन्दी में दो लगातार 'उसने' से पैदा होने वाली कर्ता-संबंधी अस्पष्टता दूर करने के लिए संदर्भ से याएल का नाम दिया गया है।
- source_word: בְּסֵפֶל
  choice: कटोरे में
  rationale: סֵפֶל कटोरे अथवा पात्र को दर्शाता है; 'कटोरा' आधुनिक हिन्दी में स्वाभाविक और दृश्यात्मक है।
- source_word: אַדִּירִים
  choice: रईसों के योग्य
  rationale: बहुवचन रूप प्रतिष्ठित, सामर्थी या कुलीन व्यक्तियों को सूचित कर सकता है। यह चयन पात्र की भव्यता और उच्च प्रतिष्ठा से उसके संबंध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הִקְרִיבָה
  choice: लाई
  rationale: हिफ़ील रूप का मूल भाव पास लाना है; आतिथ्य के प्रसंग में 'लाई' सहज है और अनावश्यक बलिदानी अर्थ से बचता है।
- source_word: חֶמְאָה
  choice: दही
  rationale: यह किसी गाढ़े या संसाधित दुग्ध-पदार्थ—दही, मलाई या मक्खन—को सूचित कर सकता है। प्राचीन भोजन-संदर्भ में 'दही' सुबोध है, जबकि अन्य संभावनाएँ पाद-टिप्पणी में सुरक्षित हैं।
