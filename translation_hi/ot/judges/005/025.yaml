translation_notes:
  register: भाषा आधुनिक, काव्यात्मक और गरिमापूर्ण रखी गई है। छोटे समानांतर वाक्य मूल गीत की गति बनाए रखते हैं। स्त्रीलिंग इब्रानी क्रिया को हिन्दी में स्पष्ट करने के लिए दूसरे खंड में याएल का नाम और अगले खंड में स्त्रीलिंग 'लाई' प्रयुक्त है।
