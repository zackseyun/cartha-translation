reference: Judges 5:11
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: מִ/קּ֣וֹל מְחַֽצְצִ֗ים בֵּ֚ין מַשְׁאַבִּ֔ים שָׁ֤ם יְתַנּוּ֙ צִדְק֣וֹת יְהוָ֔ה צִדְקֹ֥ת פִּרְזֹנ֖/וֹ בְּ/יִשְׂרָאֵ֑ל אָ֛ז יָרְד֥וּ לַ/שְּׁעָרִ֖ים עַם יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/011.yaml
  text: From the sound of archers among the watering places[a], there they recount the righteous acts of Yahweh, the righteous acts of his villagers in Israel[c][b]. Then the people of Yahweh went down to the gates.
translation:
  language: hi
  text: पानी भरने के स्थानों के बीच तीरंदाज़ों की आवाज़ से[a], वहाँ वे याहवे के न्यायपूर्ण कार्यों का, इस्राएल में उसके गाँववासियों के न्यायपूर्ण कार्यों का[b] बखान करते हैं। तब याहवे के लोग नगर के फाटकों[c] की ओर उतर गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पानी भरने के स्थानों के पास तीरंदाज़ों की आवाज़ के समय।” आरम्भिक इब्रानी वाक्यांश कठिन है; कुछ इसे आवाज़ से अलग होने के बजाय उस स्थान या अवसर का वर्णन मानते हैं जहाँ यह बखान सुनाई देता है।
    reason: alternative_reading
  - marker: b
    text: “गाँववासियों” के लिए आया इब्रानी शब्द कठिन है। इसका अर्थ “बिना परकोटे वाली बस्तियाँ,” “ग्रामीण लोग,” या—कम सम्भावना से—“शासक” भी समझा गया है। इस वाक्यांश का अर्थ उनके लिए किए गए न्यायपूर्ण कार्य भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: नगर के फाटक सार्वजनिक सभा, न्याय, नागरिक जीवन और सुरक्षा के प्रमुख स्थान होते थे।
    reason: cultural_note
lexical_decisions:
- source_word: מִקּוֹל מְחַצְצִים
  choice: तीरंदाज़ों की आवाज़ से
  rationale: מִן को उसके सामान्य स्रोत/अपादान भाव ‘से’ के साथ रखा गया है। מְחַצְצִים का अर्थ संदर्भ में सम्भवतः तीर चलाने वाले, अर्थात् ‘तीरंदाज़’, है; फिर भी कठिन आरम्भिक वाक्यांश की दूसरी सम्भावना पादटिप्पणी में दी गई है।
- source_word: בֵּין מַשְׁאַבִּים
  choice: पानी भरने के स्थानों के बीच
  rationale: यह अनुवाद בֵּין के ‘बीच’ और מַשְׁאַבִּים के पानी खींचने/भरने के स्थानों के अर्थ को सीधे बनाए रखता है।
- source_word: יְתַנּוּ
  choice: वर्णन करते हैं
  rationale: पिएल रूप यहाँ बात को दोहराकर सुनाने या उसका बखान करने का भाव देता है। ‘वर्णन करते हैं’ गीत होने की सम्भावना को नकारे बिना मौखिक घोषणा का स्वाभाविक हिन्दी रूप है।
- source_word: צִדְקוֹת יְהוָה
  choice: याहवे के धर्ममय कामों
  rationale: צִדְקוֹת यहाँ अमूर्त धार्मिकता के बजाय ऐसे ठोस कार्यों को बताता है जो याहवे की धार्मिकता और न्याय को प्रकट करते हैं। ‘धर्ममय काम’ मूल शब्द से निकट रहते हुए उद्धार या विजय का अर्थ अनावश्यक रूप से निश्चित नहीं करता।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी लिपि में ‘याहवे’ लिखा गया है।
- source_word: צִדְקֹת פִּרְזֹנוֹ
  choice: उसके गाँववासियों के धर्ममय कामों
  rationale: פִּרְזוֹן कठिन और विवादित शब्द है। न्यायियों 5:7 के सम्बद्ध रूप के आधार पर इसे ग्रामीण लोगों से जोड़ना उचित है; प्रत्यय को ‘उसके’ के रूप में सुरक्षित रखा गया है और वैकल्पिक अर्थ पादटिप्पणी में दिए गए हैं।
- source_word: אָז יָרְדוּ לַשְּׁעָרִים
  choice: तब ... नगर के फाटकों की ओर उतर गए
  rationale: אָז का परिणामसूचक ‘तब’ और ירד का सामान्य गति-बोध ‘उतर गए’ रखा गया है। ‘नगर के’ से प्राचीन नगर के सार्वजनिक फाटकों का आशय हिन्दी पाठक के लिए स्पष्ट होता है।
- source_word: עַם יְהוָה
  choice: याहवे के लोग
  rationale: सम्बन्धवाचक रचना को सहज हिन्दी में रखा गया है और वाचा-सम्बन्धी पहचान सुरक्षित है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल में व्यक्तिगत नाम सीधे आया है; ‘याहवे’ उसे उपाधि से बदले बिना प्रस्तुत करता है।
- issue: विजय-गीत में צִדְקוֹת का अर्थ
  choice: धर्ममय काम
  alternative: उद्धार के काम / विजयें
  rationale: यह पद याहवे के न्यायपूर्ण और छुड़ाने वाले ठोस कार्यों की ओर संकेत कर सकता है। ‘धर्ममय काम’ मूल की व्यापकता बनाए रखता है और केवल विजय या उद्धार तक अर्थ को सीमित नहीं करता।
- issue: צִדְקֹת פִּרְזֹנוֹ में कर्मों और गाँववासियों का सम्बन्ध
  choice: उसके गाँववासियों के धर्ममय काम
  alternative: उसके गाँववासियों के लिए किए गए धर्ममय काम / उसकी बिना शहरपनाह वाली बस्तियों के धर्ममय काम
  rationale: रचना को सम्बन्धकारक रूप में रहने दिया गया है, जिससे कर्मों के कर्ता या लाभार्थी होने का प्रश्न अनावश्यक रूप से पूरी तरह हल नहीं किया जाता; शब्द की अनिश्चितता पादटिप्पणी में स्पष्ट है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, काव्यात्मक किन्तु सामान्य पाठक के लिए सुबोध रखी गई है। ‘धर्ममय काम’ गरिमापूर्ण है और मूल के धार्मिक-न्यायिक भाव को बचाता है। कठिन इब्रानी वाक्यांशों को मुख्य पाठ में अत्यधिक व्याख्यायित करने के बजाय पादटिप्पणियों में वास्तविक विकल्प दिए गए हैं।
