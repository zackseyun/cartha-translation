  register: आधुनिक, गरिमापूर्ण और काव्यात्मक हिन्दी। अंतिम खंड में मूल इब्रानी की संक्षिप्त समानांतर रचना और क्रिया का लोप बनाए रखा गया है; नप्ताली के लिए अलग से कोई क्रिया जोड़कर अर्थ को अनावश्यक रूप से निश्चित नहीं किया गया।
