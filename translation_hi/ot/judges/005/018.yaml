base_translation:
  language: en
  yaml_path: translation/ot/judges/005/018.yaml
  text: Zebulun was a people that risked its life to the death[a], and Naphtali also[b], on the heights of the field.
translation:
  language: hi
  text: जबूलून वह प्रजा थी जिसने मृत्यु तक अपने प्राणों की परवाह न की[a], और नप्ताली भी, मैदान की ऊँचाइयों पर[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ, “अपने प्राणों को मृत्यु तक तुच्छ जाना”; अर्थात अपने प्राणों की परवाह न करते हुए मृत्यु का जोखिम उठाया। इब्रानी में जबूलून के लिए सामूहिक एकवचन और ‘तुच्छ जानने’ का भाव देने वाली क्रिया है।
    reason: lexical_alternative
  - marker: b
    text: या “खुले मैदान की ऊँचाइयों पर।”
    reason: lexical_alternative
lexical_decisions:
- source_word: זְבֻלוּן
  choice: जबूलून
  rationale: गोत्र के नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: עַם
  choice: वह प्रजा
  rationale: एकवचन सामूहिक संज्ञा को बनाए रखता है और जबूलून को एक गोत्रीय समुदाय के रूप में प्रस्तुत करता है।
- source_word: חֵרֵף נַפְשׁוֹ
  choice: अपने प्राणों की परवाह न की
  rationale: शाब्दिक भाव ‘अपने प्राण को तुच्छ जाना’ है; युद्ध के प्रसंग में यह जान की परवाह न करते हुए स्वयं को संकट में डालने का स्वाभाविक हिन्दी रूप है।
- source_word: לָמוּת
  choice: मृत्यु तक
  rationale: ल उपसर्ग सहित क्रियारूप यहाँ जोखिम की चरम सीमा या परिणाम—मृत्यु तक—व्यक्त करता है।
- source_word: וְנַפְתָּלִי
  choice: और नप्ताली भी
  rationale: संयोजक नप्ताली को उसी प्रशंसा में सम्मिलित करता है; ‘भी’ समानांतरता स्पष्ट करता है।
- source_word: מְרוֹמֵי שָׂדֶה
  choice: मैदान की ऊँचाइयों पर
  rationale: ऊँचे भूभाग और खुले मैदान की स्थलाकृतिक छवि को बिना इसे स्पष्टतः ‘युद्धभूमि’ कहे बनाए रखता है।
