source:
  edition: WLC
  text: הֲ/לֹ֨א יִמְצְא֜וּ יְחַלְּק֣וּ שָׁלָ֗ל רַ֤חַם רַחֲמָתַ֨יִם֙ לְ/רֹ֣אשׁ גֶּ֔בֶר שְׁלַ֤ל צְבָעִים֙ לְ/סִ֣יסְרָ֔א שְׁלַ֥ל צְבָעִ֖ים רִקְמָ֑ה צֶ֥בַע רִקְמָתַ֖יִם לְ/צַוְּארֵ֥י שָׁלָֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/030.yaml
  text: ‘Are they not finding and dividing the spoil? A womb[a], two wombs for each man; spoil of dyed cloths for Sisera, spoil of dyed cloths, embroidered cloth, dyed cloth[b], two embroideries for the necks of the spoil.’
translation:
  language: hi
  text: ‘क्या वे लूट पा कर बाँट नहीं रहे होंगे? हर पुरुष के लिए एक गर्भ[a], दो गर्भ; सीसरा के लिए रंगे हुए कपड़ों की लूट, रंगे हुए कपड़ों की लूट, कढ़ाईदार कपड़ा, रंगा हुआ कपड़ा[b], दोहरी कढ़ाई—लूट की गर्दनों के लिए।’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “एक गर्भ, दो गर्भ।” यह युद्ध में यौन-लूट के रूप में पकड़ी गई स्त्रियों के लिए प्रयुक्त कठोर और अमानवीय लक्षणाप्रयोग है।
    reason: lexical_alternative
  - marker: b
    text: अंतिम इब्रानी वाक्यांश कठिन है। इसका अर्थ “बंदियों की गर्दनों के लिए” या “लूट में पकड़े गए लोगों की गर्दनों के लिए” भी हो सकता है। सम्भवतः यह लूट में पकड़ी गई स्त्रियों द्वारा पहने जाने वाले कढ़ाईदार कपड़ों की ओर संकेत करता है।
    reason: alternative_reading
lexical_decisions:
- source_word: הֲלֹא יִמְצְאוּ יְחַלְּקוּ שָׁלָל
  choice: क्या वे लूट पाकर उसे बाँट नहीं रहे होंगे?
  rationale: הֲלֹא का प्रश्नवाचक बल और सीसरा की माता की वर्तमान कल्पना सुरक्षित रखी गई है। हिन्दी में ‘रहे होंगे’ अपेक्षित, अनुमानित चल रही क्रिया को स्वाभाविक रूप से व्यक्त करता है; ‘पाकर’ और ‘बाँट’ दोनों क्रियाओं का क्रम भी बना रहता है।
- source_word: רַחַם רַחֲמָתַיִם
  choice: एक गर्भ, दो गर्भ
  rationale: शाब्दिक और जानबूझकर कठोर देह-सूचक रूपक को बनाए रखा गया है। इसे ‘स्त्री’ या ‘लड़की’ करने से युद्धबंदियों के अमानवीकरण की काव्यात्मक तीक्ष्णता घट जाती।
- source_word: לְרֹאשׁ גֶּבֶר
  choice: हर पुरुष के लिए
  rationale: शाब्दिक रूप ‘एक पुरुष के सिर के लिए’ वितरण का मुहावरा है। ‘हर पुरुष के लिए’ आधुनिक हिन्दी में प्रति व्यक्ति बँटवारे का अर्थ स्पष्ट करता है और גֶּבֶר का पुरुषवाची अर्थ रखता है।
- source_word: שְׁלַל צְבָעִים
  choice: रंगे हुए कपड़ों की लूट
  rationale: צְבָעִים रंगे या रंगीन वस्त्रों को सूचित करता है। ‘रंगे हुए कपड़े’ रंगाई की धारणा और लूट की सूची—दोनों को सहज हिन्दी में बनाए रखता है।
- source_word: רִקְמָה
  choice: कढ़ाईदार कपड़ा
  rationale: यह रंगे हुए वस्त्र का कढ़ाईयुक्त होना बताता है। संज्ञात्मक ‘कढ़ाई’ की अपेक्षा ‘कढ़ाईदार कपड़ा’ हिन्दी में सूची का आशय अधिक स्पष्ट करता है।
- source_word: צֶבַע רִקְמָתַיִם
  choice: रंगा हुआ कपड़ा, दोहरी कढ़ाई
  rationale: संक्षिप्त और कठिन इब्रानी पदक्रम को अत्यधिक समतल किए बिना रखा गया है। द्विवचन רִקְמָתַיִם को ‘दोहरी कढ़ाई’ से दर्शाया गया है; इसका अर्थ दो कढ़ाईदार टुकड़े भी समझा जा सकता है।
- source_word: לְצַוְּארֵי שָׁלָל
  choice: लूट की गर्दनों के लिए
  rationale: दुर्बोध इब्रानी संरचना का निकट और जानबूझकर असमाधित अनुवाद है। संभावित अर्थ—लूट में पकड़ी गई स्त्रियों की गर्दनें—पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: युद्ध में पकड़ी गई स्त्रियों के लिए प्रयुक्त רַחַם רַחֲמָתַיִם को नरम करना या नहीं
  choice: मुख्य पाठ में ‘एक गर्भ, दो गर्भ’ रखा गया।
  alternative: ‘एक स्त्री, दो स्त्रियाँ’ या ‘एक-दो लड़कियाँ’
  rationale: वचन सीसरा के घराने की क्रूर अपेक्षा दिखाता है, उसे अनुमोदित नहीं करता। मूल रूपक बनाए रखने से स्त्रियों को यौन-लूट की वस्तु समझने वाली दृष्टि का नैतिक आघात सुरक्षित रहता है।
- issue: अंतिम कठिन पद לְצַוְּארֵי שָׁלָל का अर्थ
  choice: मुख्य पाठ में निकट अनुवाद ‘लूट की गर्दनों के लिए’ रखा गया।
  alternative: ‘बंदिनी स्त्रियों की गर्दनों के लिए’ या ‘लूट में पकड़े गए लोगों की गर्दनों के लिए’
  rationale: इब्रानी वाक्यरचना संक्षिप्त और विवादित है। मुख्य पाठ में अनिश्चितता को दबाया नहीं गया और अधिक व्याख्यात्मक अर्थ पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण काव्यात्मक गद्य रखा गया है। युद्ध-लूट की क्रूर भाषा को शिष्ट बनाकर नरम नहीं किया गया। ‘गर्भ’ जानबूझकर चौंकाने वाला है और पादटिप्पणी उसका संदर्भ स्पष्ट करती है। अंतिम पद की वास्तविक अस्पष्टता मुख्य पाठ और पादटिप्पणी दोनों में सुरक्षित है।
