source:
  edition: WLC
  text: אָ֚ז יְרַ֣ד שָׂרִ֔יד לְ/אַדִּירִ֖ים עָ֑ם יְהוָ֕ה יְרַד לִ֖/י בַּ/גִּבּוֹרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/013.yaml
  text: Then the remnant came down against the nobles[b][a]; the people of Yahweh came down for me against the mighty.
translation:
  language: hi
  text: तब बचा हुआ दल प्रतापी जनों के विरुद्ध[a] उतर आया; याहवे की प्रजा मेरे लिए[b] वीर योद्धाओं के विरुद्ध[a] उतर आई।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह हिब्रू काव्य-पंक्ति कठिन है। इसका अनुवाद यह भी हो सकता है, “तब एक बचा हुआ व्यक्ति प्रतापी जनों के पास उतर आया।” पहले पद में संबंधबोधक का भाव “के पास,” “के लिए,” या “के साथ” भी हो सकता है; अंतिम पद में “वीर योद्धाओं के बीच” या “वीर योद्धाओं के साथ” भी संभव है।
    reason: alternative_reading
  - marker: b
    text: शाब्दिक रूप से “मेरे लिए”; संभवतः यह गीत में दबोरा का अपने लिए किया गया काव्यात्मक उल्लेख है।
    reason: cultural_note
lexical_decisions:
- source_word: אָז
  choice: तब
  rationale: यह कालवाचक क्रियाविशेषण गीत में अगली घटना आरंभ करता है; ‘तब’ संक्षिप्त और स्वाभाविक है।
- source_word: יְרַד / יְרַד
  choice: उतर आया / उतर आई
  rationale: दोनों स्थानों पर मूल क्रिया की पुनरावृत्ति बनाए रखते हुए, हिन्दी में कर्ता के लिंग के अनुसार रूप बदला गया है।
- source_word: שָׂרִיד
  choice: बचा हुआ दल
  rationale: यह शब्द किसी बचे हुए व्यक्ति या बचे हुए समूह को सूचित कर सकता है। युद्ध के सामूहिक संदर्भ में ‘दल’ स्वाभाविक है, जबकि वैकल्पिक एकवचन अर्थ पादटिप्पणी में रखा गया है।
- source_word: לְאַדִּירִים
  choice: प्रतापी जनों के विरुद्ध
  rationale: אַדִּירִים शक्तिशाली, प्रतिष्ठित या कुलीन व्यक्तियों को सूचित करता है। ‘प्रतापी जन’ इस व्यापकता को रखता है और גִּבּוֹרִים से भेद करता है; युद्ध-संदर्भ में לְ को विरोधसूचक समझा गया है।
- source_word: עָם יְהוָה
  choice: याहवे की प्रजा
  rationale: यह स्वाभाविक हिन्दी में प्रजा के याहवे से संबंध और उसके वाचाई स्वर को स्पष्ट रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ के व्यक्तिगत दिव्य नाम को किसी उपाधि से बदलने के बजाय हिन्दी लिपि में लिप्यंतरित किया गया है।
- source_word: לִי
  choice: मेरे लिए
  rationale: प्रथम पुरुष एकवचन प्रत्यय का सीधा अनुवाद है; संभवतः यह गीत में दबोरा का आत्म-संदर्भ है, पर ठीक भाव खुला रखा गया है।
- source_word: בַּגִּבּוֹרִים
  choice: वीर योद्धाओं के विरुद्ध
  rationale: גִּבּוֹרִים सामर्थी पुरुषों या योद्धाओं को सूचित करता है। युद्ध-संदर्भ और समानांतर पंक्ति के कारण בַּ को विरोधसूचक समझा गया है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: पद में चार-अक्षरी व्यक्तिगत नाम प्रत्यक्ष रूप से है; ‘याहवे’ उसे उपाधि से बदले बिना प्रस्तुत करता है।
- issue: दोनों काव्य-पंक्तियों में संबंधबोधक अव्ययों का भाव
  choice: 'विरोधसूचक: ‘के विरुद्ध’'
  alternative: 'दिशा, हित या साथ का भाव: ‘के पास’, ‘के लिए’, ‘के साथ/बीच’'
  rationale: विजय-गीत और युद्ध की निकटवर्ती पृष्ठभूमि विरोधसूचक अर्थ का समर्थन करती है, लेकिन हिब्रू काव्य-पंक्ति कठिन है; इसलिए दूसरे संभावित अर्थ पादटिप्पणी में सुरक्षित रखे गए हैं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और गायनात्मक रखी गई है। दोनों पंक्तियों में ‘उतर आया/आई’ की पुनरावृत्ति मूल की काव्यात्मक समानता को दर्शाती है। ‘प्रतापी जन’ और ‘वीर योद्धा’ अलग हिब्रू शब्दों का भेद बनाए रखते हैं।
