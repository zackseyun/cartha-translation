  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक रखी गई है। मूल की असामान्य छवि ‘पहाड़ बह निकले’ तथा आकस्मिक पदबंध ‘यह सीनै’ को सहज बनाने के नाम पर हटाया नहीं गया; दीर्घ विरामचिह्न समानाधिकरण ‘इस्राएल के परमेश्वर’ को स्पष्ट करता है।
