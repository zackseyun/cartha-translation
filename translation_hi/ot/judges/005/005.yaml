    text: ‘बह निकले’ वाली इब्रानी क्रिया का अर्थ ‘बहना’, ‘रिसना’ या ‘टपकना’ है; इस काव्यात्मक चित्र को ‘पिघल गए’ भी समझा जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרִים
  choice: पहाड़
  rationale: निर्धारित बहुवचन ‘पहाड़’ सीनै पर परमेश्वर के प्रकट होने की काव्यात्मक छवि के अनुरूप है।
- source_word: נָזְלוּ
  choice: बह निकले
  rationale: क्रिया נזל का मूल अर्थ बहना, रिसना या टपकना है। ‘बह निकले’ इस असामान्य काव्यात्मक चित्र को बनाए रखता है; ‘पिघल गए’ संभव व्याख्या है, पर अधिक अर्थानुवादी है।
- source_word: מִפְּנֵי
  choice: के सामने
  rationale: यह मुहावरा शाब्दिक रूप से किसी के मुख या उपस्थिति के सामने से होने का भाव देता है। सहज हिन्दी में ‘के सामने’ उस उपस्थिति को संक्षेप में व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में लिप्यंतरित किया गया है।
- source_word: זֶה סִינַי
  choice: यह सीनै
  rationale: मूल का संकेतवाचक और अकस्मात काव्यात्मक प्रयोग सुरक्षित रखा गया है; ‘पर्वत’ शब्द मूल में नहीं जोड़ा गया।
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: इस्राएल के परमेश्वर
  rationale: यह संबंधसूचक पद याहवे की पहचान इस्राएल के परमेश्वर के रूप में करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम है; ‘याहवे’ उसका सीधा लिप्यंतरण है और उसे उपाधि में नहीं बदलता।
- issue: נָזְלוּ में परमेश्वर-प्रकटन की काव्यात्मक छवि
  choice: पहाड़ बह निकले
  alternative: पहाड़ पिघल गए / पहाड़ काँप उठे
  rationale: ‘बह निकले’ क्रिया के मूल प्रवाह-संबंधी अर्थ को सुरक्षित रखता है। ‘पिघल गए’ इसी चित्र की संभव व्याख्या है, जबकि ‘काँप उठे’ व्यापक प्रसंग के अनुकूल होने पर भी इस क्रिया का प्रत्यक्ष अर्थ नहीं है।
