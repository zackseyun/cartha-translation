  text: पहाड़ याहवे के सामने बह निकले[a]; यह सीनै याहवे, इस्राएल के परमेश्वर, के सामने।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘के सामने’ का अधिक शाब्दिक रूप है, ‘उपस्थिति के सामने से।’
    reason: lexical_alternative
