lexical_decisions:
- source_word: אָז
  choice: तब
  rationale: यह कालवाचक क्रियाविशेषण गीत में अगले सजीव दृश्य को सामने लाता है; ‘तब’ स्वाभाविक और संक्षिप्त है।
- source_word: הָלְמוּ
  choice: धमधमाने लगे
  rationale: क्रिया बलपूर्वक प्रहार और उससे उत्पन्न ध्वनि व्यक्त करती है; खुरों के प्रसंग में यह हिंदी पद श्रव्य और गतिशील प्रभाव देता है।
- source_word: עִקְּבֵי סוּס
  choice: घोड़ों के खुर
  rationale: शाब्दिक अर्थ ‘घोड़े की एड़ियाँ’ हो सकता है, पर घोड़े के संदर्भ में आशय खुरों से है; एकवचन סוּס सामूहिक अर्थ में लिया गया है।
- source_word: מִדַּהֲרוֹת דַּהֲרוֹת
  choice: सरपट दौड़, सरपट दौड़ से
  rationale: מִן कारण अथवा स्रोत दर्शाता है और दहरोत की पुनरावृत्ति काव्यात्मक तीव्रता बढ़ाती है; हिंदी में पुनरुक्ति को बनाए रखा गया है।
- source_word: אַבִּירָיו
  choice: उसके बलवानों
  rationale: यह पद शक्तिशाली घोड़ों अथवा उनसे जुड़े वीर योद्धाओं की ओर संकेत कर सकता है; ‘बलवानों’ मूल की व्यक्ति/पशु-संबंधी अस्पष्टता को यथासंभव सुरक्षित रखता है।
theological_decisions:
- issue: אַבִּירָיו में तृतीय पुरुष एकवचन प्रत्यय और उसके संज्ञार्थ का संदर्भ
  choice: ‘उसके बलवानों’ कहकर संदर्भ को खुला रखा गया
  alternative: ‘उसके बलवान घोड़ों’ अथवा ‘उसके वीर योद्धाओं’
  rationale: काव्यात्मक प्रसंग शत्रु की सामर्थ्य को सामने रखता है, पर निकटवर्ती शब्द घोड़ों और सवार योद्धाओं—दोनों का बोध करा सकते हैं। अनुवाद मूल से अधिक निश्चित नहीं होता।
translation_notes:
  register: आधुनिक मानक हिंदी का सजीव, गरिमापूर्ण काव्यात्मक रूप अपनाया गया है। ‘धमधमाने’ युद्धगीत की ध्वन्यात्मक शक्ति देता है, जबकि विराम-चिह्न मूल की तीव्र पुनरावृत्ति को उभारता है।
