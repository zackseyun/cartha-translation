base_translation:
  language: en
  yaml_path: translation/ot/judges/005/021.yaml
  text: The torrent of Kishon swept them away— the ancient torrent[a], the torrent of Kishon. March on, my soul[b], with strength!
translation:
  language: hi
  text: 'कीशोन की प्रचंड धारा उन्हें बहा ले गई—

    वह प्राचीन धारा[a], कीशोन की धारा।

    हे मेरे प्राण, सामर्थ्य से आगे बढ़![b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “पुराने समय की धारा” अथवा “आदिकालीन धारा।” इब्रानी शब्द प्राचीनता का भाव दे सकता है; यहाँ यह केवल समय बताने के बजाय काव्यात्मक तीव्रता भी व्यक्त कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “हे मेरे प्राण, सामर्थ्य से पाँव बढ़ा!” अथवा “हे मेरे प्राण, पराक्रम से रौंद!” इब्रानी कथन संक्षिप्त और काव्यात्मक है; क्रिया में पैर रखने, आगे बढ़ने या रौंदने का भाव हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: נַחַל
  choice: प्रचंड धारा / धारा
  rationale: यह शब्द नदी-नाले, जलधारा या बाढ़ की उफनती धारा को सूचित कर सकता है। युद्ध के इस काव्यात्मक प्रसंग में पहली पंक्ति का ‘प्रचंड धारा’ शत्रुओं को बहा ले जाने वाली शक्ति स्पष्ट करता है; अगली आवृत्तियों में संक्षिप्त ‘धारा’ काव्यात्मक पुनरुक्ति बनाए रखता है।
- source_word: קִישׁוֹן
  choice: कीशोन
  rationale: जलधारा के इब्रानी व्यक्तिवाचक नाम का देवनागरी लिप्यंतरण।
- source_word: גְּרָפָם
  choice: उन्हें बहा ले गई
  rationale: क्रिया का अर्थ बलपूर्वक बहा या घसीट ले जाना है। ‘बहा ले गई’ जलप्रवाह की छवि और पुरुष-बहुवचन कर्मप्रत्यय, दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: נַחַל קְדוּמִים
  choice: वह प्राचीन धारा
  rationale: קְדוּמִים प्राचीन अथवा पुराने समय से संबंधित अर्थ दे सकता है। ‘प्राचीन धारा’ मूल की संक्षिप्त काव्यात्मक समानाधिकरण रचना को सुरक्षित रखता है, जबकि वैकल्पिक अर्थ पादटिप्पणी में दिए गए हैं।
- source_word: תִּדְרְכִי
  choice: आगे बढ़
  rationale: דרך का मूल भाव पैर रखना, रौंदना या बढ़ना है। यहाँ अपने प्राण को संबोधित स्त्रीलिंग एकवचन रूप संदर्भ में आत्म-उत्साहवर्धक आह्वान है; ‘आगे बढ़’ हिन्दी में स्वाभाविक है और अस्पष्ट गतिशीलता को अनावश्यक रूप से ‘रौंदने’ तक सीमित नहीं करता।
- source_word: נַפְשִׁי
  choice: हे मेरे प्राण
  rationale: נפש यहाँ वक्ता के अपने भीतरी व्यक्तित्व/स्व को सीधे संबोधित करता है। ‘मेरे प्राण’ हिन्दी की गरिमामय काव्यभाषा में इस आत्म-संबोधन को बनाए रखता है।
- source_word: עֹז
  choice: सामर्थ्य से
  rationale: शब्द शक्ति या पराक्रम को सूचित करता है। संक्षिप्त इब्रानी वाक्य में इसे क्रिया-विशेषणात्मक अर्थ में लेना सर्वाधिक सहज है, पर वाक्य की काव्यात्मक सघनता बनी रहती है।
