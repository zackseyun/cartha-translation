source:
  edition: WLC
  text: יִבְחַר֙ אֱלֹהִ֣ים חֲדָשִׁ֔ים אָ֖ז לָחֶ֣ם שְׁעָרִ֑ים מָגֵ֤ן אִם יֵֽרָאֶה֙ וָ/רֹ֔מַח בְּ/אַרְבָּעִ֥ים אֶ֖לֶף בְּ/יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/008.yaml
  text: They chose new gods[a]; then war was at the gates[b]. Was a shield or spear to be seen among forty thousand in Israel?
translation:
  language: hi
  text: इस्राएल के लोगों ने नए देवताओं को चुना[a]; तब नगर-द्वारों पर युद्ध हुआ[b]। क्या इस्राएल के चालीस हज़ार लोगों में एक भी ढाल या भाला दिखाई दिया?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शब्दशः: “उसने” या “किसी ने नए देवताओं को चुना।” इब्रानी क्रिया एकवचन है, पर यहाँ सामान्यतः उसका आशय इस्राएल के लोगों से सामूहिक रूप में समझा जाता है।'
    reason: alternative_reading
  - marker: b
    text: इस पंक्ति का इब्रानी पाठ कठिन है; इसका अनुवाद “तब नगर-द्वारों तक लड़ाई आ पहुँची” या इसी प्रकार भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יִבְחַר
  choice: उन्होंने ... चुन लिया
  rationale: क्रिया रूप की दृष्टि से एकवचन है, पर प्रसंग में इसका अनिश्चित अथवा सामूहिक कर्ता इस्राएल के लोग समझे जाते हैं। हिंदी में आदरसूचक नहीं, बल्कि सामूहिक बहुवचन ‘उन्होंने’ इस आशय को स्वाभाविक रूप से व्यक्त करता है; मूल का एकवचन पादटिप्पणी में सुरक्षित है।
- source_word: אֱלֹהִים חֲדָשִׁים
  choice: नए देवताओं
  rationale: यहाँ बहुवचन विदेशी देवताओं की ओर संकेत करता है। ‘नए देवता’ आधुनिक हिंदी में स्पष्ट है और पद के निंदात्मक बल को बनाए रखता है।
- source_word: אָז
  choice: तब
  rationale: यह छोटा कालवाचक शब्द चुनाव और उसके बाद आए संकट के क्रम को सीधे व्यक्त करता है।
- source_word: לָחֶם שְׁעָרִים
  choice: नगर-द्वारों तक युद्ध आ पहुँचा
  rationale: इब्रानी पदबंध संक्षिप्त और कठिन है। לָחֶם को ‘युद्ध/लड़ाई’ मानकर यह अनुवाद संघर्ष के नगर-द्वारों तक पहुँचने का स्वाभाविक हिंदी चित्र देता है; वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: מָגֵן
  choice: ढाल
  rationale: मानक सैन्य अर्थ और सामान्य आधुनिक हिंदी शब्द।
- source_word: אִם יֵרָאֶה
  choice: क्या ... दिखाई दिया?
  rationale: אִם यहाँ अलंकारिक प्रश्न का बल देता है, जिसका अपेक्षित उत्तर ‘नहीं’ है। हिंदी प्रश्न-विन्यास उस बल को सहज रूप में रखता है।
- source_word: וָרֹמַח
  choice: या भाला
  rationale: רֹמַח के लिए ‘भाला’ स्पष्ट और प्रचलित आधुनिक हिंदी पर्याय है।
- source_word: בְּאַרְבָּעִים אֶלֶף
  choice: चालीस हज़ार लोगों में
  rationale: בְּ यहाँ उस जनसमूह को दर्शाता है जिसके बीच हथियार खोजे जाने की बात है। स्पष्टता के लिए ‘लोगों’ जोड़ा गया है।
- source_word: בְּיִשְׂרָאֵל
  choice: इस्राएल के ... लोगों में
  rationale: राष्ट्रीय समुदाय का आशय हिंदी में स्वाभाविक ढंग से व्यक्त करने के लिए इसे संख्या के साथ जोड़ा गया है।
theological_decisions:
- issue: आरंभिक क्रिया का कर्ता
  choice: 'इस्राएल के लोग सामूहिक रूप से: ‘उन्होंने नए देवताओं को चुन लिया।’'
  alternative: ‘उसने/किसी ने नए देवताओं को चुना’; अथवा ‘परमेश्वर ने नई बातें चुनीं।’
  rationale: निकटवर्ती प्रसंग इस्राएल के धर्मत्याग और उसके बाद की विपत्ति की ओर संकेत करता है। ‘परमेश्वर’ को कर्ता और ‘नए देवताओं’ को कर्म मानना प्रसंग तथा वाक्य के निंदात्मक स्वर के प्रतिकूल है। फिर भी इब्रानी क्रिया के वास्तविक एकवचन रूप को पादटिप्पणी में स्पष्ट किया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। काव्यात्मक संक्षिप्तता को यथासंभव बनाए रखते हुए कठिन इब्रानी पदबंधों की वास्तविक अनिश्चितता पादटिप्पणियों में दी गई है। ‘नगर-द्वारों तक’ संघर्ष के नगरों के निकट पहुँचने का चित्र स्पष्ट करता है, और ‘एक भी’ अलंकारिक प्रश्न में निहित पूर्ण अभाव को स्वाभाविक हिंदी में व्यक्त करता है।
