  text: חָדְל֧וּ פְרָז֛וֹן בְּ/יִשְׂרָאֵ֖ל חָדֵ֑לּוּ עַ֤ד שַׁ/קַּ֨מְתִּי֙ דְּבוֹרָ֔ה שַׁ/קַּ֥מְתִּי אֵ֖ם בְּ/יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/007.yaml
  text: Village life ceased in Israel; it ceased until I[a], Deborah, arose—until I arose as a mother in Israel.
translation:
  language: hi
  text: इस्राएल में गाँवों का जीवन[a] थम गया था; वह तब तक थमा रहा, जब तक मैं, दबोरा, उठ खड़ी हुई—जब तक मैं इस्राएल में एक माता के रूप में उठी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “इस्राएल में गाँववाले नहीं रहे,” अथवा “इस्राएल की ग्रामीण आबादी नहीं रही।” यहाँ प्रयुक्त इब्रानी संज्ञा का अर्थ निश्चित नहीं है; यह गाँवों में रहनेवालों या व्यापक रूप से ग्रामीण जीवन को सूचित कर सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: חָדְלוּ / חָדֵלּוּ
  choice: थम गया / थमा रहा
  rationale: क्रिया חדל यहाँ समाप्ति या रुक जाने को व्यक्त करती है। हिंदी में ‘थम गया’ सामाजिक जीवन के बाधित हो जाने को स्वाभाविक ढंग से कहता है; दूसरी बार ‘थमा रहा’ उस अवस्था के दबोरा के उठने तक बने रहने का भाव स्पष्ट करता है और काव्यात्मक पुनरावृत्ति भी बनाए रखता है।
- source_word: פְרָזוֹן
  choice: गाँवों का जीवन
  rationale: यह दुर्लभ और कठिन संज्ञा संभवतः बिना शहरपनाह वाले ग्रामीण निवासियों अथवा ग्रामीण जीवन-व्यवस्था को सूचित करती है। ‘गाँवों का जीवन’ सामाजिक स्थिति को स्वाभाविक आधुनिक हिंदी में व्यक्त करता है, जबकि अन्य संभावनाएँ पादटिप्पणी में सुरक्षित रखी गई हैं।
- source_word: בְּיִשְׂרָאֵל
  choice: इस्राएल में
  rationale: בְּ का स्थानवाचक अर्थ यहाँ सीधा है; ‘इस्राएल में’ राष्ट्रीय और भौगोलिक प्रसंग के अनुकूल है।
- source_word: עַד
  choice: तब तक ... जब तक कि
  rationale: यह पहले वर्णित संकट की अवधि और दबोरा के उठ खड़े होने पर आए निर्णायक मोड़ को चिह्नित करता है।
- source_word: שַׁקַּמְתִּי
  choice: मैं ... उठ खड़ी न हुई / मैं ... न उठी
  rationale: קום का प्रथम पुरुष रूप स्वयं आगे बढ़कर कार्य करने का भाव देता है। स्त्री वक्ता के अनुरूप ‘उठ खड़ी हुई’ स्वाभाविक है; पुनरावृत्ति को दोनों खंडों में बनाए रखा गया है।
- source_word: דְּבוֹרָה
  choice: दबोरा
  rationale: व्यक्तिनाम का प्रचलित हिंदी बाइबलीय लिप्यंतरण रखा गया है।
- source_word: אֵם
  choice: एक माता
  rationale: यहाँ ‘माता’ संभवतः संरक्षण और नेतृत्व का रूपक अथवा सम्मानसूचक वर्णन है। ‘एक माता के रूप में’ हिंदी में इस भूमिकात्मक अर्थ को व्यक्त करता है और ‘इस्राएल की माता’ जैसा अधिक प्रबल स्वामित्वसूचक शीर्षक नहीं बनाता।
theological_decisions:
- issue: दबोरा का आत्मवर्णन אֵם בְּיִשְׂרָאֵל
  choice: इस्राएल में एक माता के रूप में
  alternative: इस्राएल की माता
  rationale: इब्रानी पाठ में ‘इस्राएल में माता’ है, ‘इस्राएल की माता’ नहीं। चुना हुआ रूप संरक्षणकारी और पोषणकारी नेतृत्व के रूपक को खुला रखता है, पर स्रोत से अधिक प्रबल पदवी आरोपित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक रखी गई है। ‘थम गया’ तथा दोहराए गए ‘उठी’ से गीत की पुनरावृत्ति और निर्णायक मोड़ सुनाई देता है। स्त्री वक्ता के अनुसार क्रियारूप रखे गए हैं; कठिन ग्रामीण संज्ञा की वास्तविक अनिश्चितता पादटिप्पणी में सुरक्षित है।
