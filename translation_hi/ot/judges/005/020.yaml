  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: מִן שָׁמַ֖יִם נִלְחָ֑מוּ הַ/כּֽוֹכָבִים֙ מִ/מְּסִלּוֹתָ֔/ם נִלְחֲמ֖וּ עִם סִיסְרָֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/020.yaml
  text: From heaven the stars fought[b][a]; from their courses they fought against Sisera.
translation:
  language: hi
  text: 'आकाश से तारे लड़े;

    अपने-अपने मार्गों से वे सीसरा के विरुद्ध लड़े।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִן שָׁמַיִם
  choice: आकाश से
  rationale: हिब्रू पदबंध का स्वाभाविक हिन्दी रूप; שָׁמַיִם का रूप व्याकरणतः बहुवचन है, पर यहाँ ‘आकाश’ सामान्य हिन्दी में अधिक सहज है।
- source_word: נִלְחָמוּ / נִלְחֲמוּ
  choice: लड़े
  rationale: दोनों क्रियारूप युद्ध करने का अर्थ देते हैं। एक ही शब्द दोहराने से मूल की काव्यात्मक पुनरावृत्ति सुरक्षित रहती है।
- source_word: הַכּוֹכָבִים
  choice: तारे
  rationale: यह כּוֹכָבִים का सीधा अर्थ है और मूल की ब्रह्मांडीय काव्य-छवि को बिना व्याख्यात्मक विस्तार के बनाए रखता है।
- source_word: מִמְּסִלּוֹתָם
  choice: अपने-अपने मार्गों से
  rationale: מְסִלּוֹתָם तारों के निर्धारित मार्गों अथवा पथों को सूचित कर सकता है। ‘अपने-अपने मार्गों से’ आधुनिक हिन्दी में स्वाभाविक है और मूल के बहुवचन तथा संबंधसूचक प्रत्यय को व्यक्त करता है।
- source_word: עִם סִיסְרָא
  choice: सीसरा के विरुद्ध
  rationale: עִם का सामान्य अर्थ ‘के साथ’ है, पर לחם के साथ युद्ध-संदर्भ में यह प्रतिपक्षी को दर्शाता है; इसलिए हिन्दी में ‘के विरुद्ध लड़े’ अर्थ को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: युद्ध में तारों की भागीदारी का स्वरूप
  choice: तारों के लड़ने वाली काव्यात्मक उक्ति को बिना व्याख्या के बनाए रखा गया है।
  alternative: इसे प्रत्यक्ष ब्रह्मांडीय हस्तक्षेप, स्वर्गदूतों की गतिविधि, या दैवी प्रबंध के अधीन प्राकृतिक शक्तियों का रूपक बताना।
  rationale: दबोरा का गीत यह नहीं बताता कि तारे किस रीति से लड़े। अनुवाद किसी एक धार्मिक या प्राकृतिक व्याख्या को थोपे बिना मूल की काव्यात्मक और धर्मवैचारिक अनिश्चितता सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। दो खंडों की समानांतर रचना और ‘लड़े’ की पुनरावृत्ति से हिब्रू कविता की लय तथा बल सुरक्षित हैं।
