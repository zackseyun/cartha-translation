source:
  edition: WLC
  text: א֣וֹרוּ מֵר֗וֹז אָמַר֙ מַלְאַ֣ךְ יְהוָ֔ה אֹ֥רוּ אָר֖וֹר יֹשְׁבֶ֑י/הָ כִּ֤י לֹֽא בָ֨אוּ֙ לְ/עֶזְרַ֣ת יְהוָ֔ה לְ/עֶזְרַ֥ת יְהוָ֖ה בַּ/גִּבּוֹרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/023.yaml
  text: Curse Meroz[a], said the angel of Yahweh; curse, utterly curse its inhabitants, because they did not come to the help of Yahweh[b], to the help of Yahweh against the mighty.
translation:
  language: hi
  text: “मेरोज़ को शाप दो,” यहोवा के दूत[a] ने कहा; “उसके निवासियों को कठोर शाप दो, क्योंकि वे यहोवा की सहायता करने नहीं आए—वीरों के विरुद्ध यहोवा की सहायता करने।”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “यहोवा का स्वर्गदूत।”
    reason: lexical_alternative
  - marker: b
    text: इब्रानी का शाब्दिक अर्थ है, “यहोवा की सहायता के लिए ... वीरों में/वीरों के बीच।” अंतिम पद का अर्थ “वीरों के विरुद्ध” या “वीर योद्धाओं के साथ” भी समझा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: א֣וֹרוּ / אֹ֥רוּ אָר֖וֹר
  choice: शाप दो / कठोर शाप दो
  rationale: ארר के आदेशात्मक रूप को ‘शाप दो’ से व्यक्त किया गया है। दूसरे आदेश के साथ आए infinitive absolute से उत्पन्न तीव्रता को स्वाभाविक हिन्दी में ‘कठोर शाप दो’ कहा गया है।
- source_word: מֵר֗וֹז
  choice: मेरोज़
  rationale: यह स्थान अथवा समुदाय का व्यक्तिवाचक नाम है; इसका लिप्यंतरण किया गया है।
- source_word: מַלְאַ֣ךְ יְהוָ֔ה
  choice: यहोवा का दूत
  rationale: מַלְאָךְ का अर्थ ‘दूत’ या ‘स्वर्गदूत’ हो सकता है। ‘दूत’ मूल की व्यापक अर्थ-सीमा और इस पात्र की पहचान से जुड़ी अस्पष्टता बनाए रखता है।
- source_word: יֹשְׁבֶ֑יהָ
  choice: उसके निवासी
  rationale: स्त्रीलिंग एकवचन प्रत्यय मेरोज़ की ओर संकेत करता है; आधुनिक हिन्दी में सामूहिक भाव को सहजता से व्यक्त किया गया है।
- source_word: כִּ֤י לֹֽא בָ֨אוּ֙
  choice: क्योंकि वे ... नहीं आए
  rationale: כִּי यहाँ शाप का कारण बताता है, इसलिए ‘क्योंकि’ उपयुक्त है।
- source_word: לְעֶזְרַ֣ת יְהוָ֔ה
  choice: यहोवा की सहायता करने
  rationale: इब्रानी संज्ञात्मक पदबंध का अर्थ स्पष्ट और स्वाभाविक हिन्दी में दिया गया है, जबकि उसकी पुनरावृत्ति बरकरार रखी गई है।
- source_word: בַּגִּבּוֹרִֽים
  choice: वीरों के विरुद्ध
  rationale: בְּ और גִּבּוֹרִים का संबंध संदिग्ध है। युद्ध-संदर्भ में ‘वीरों के विरुद्ध’ सम्भाव्य है, पर अन्य व्याकरणिक समझों को पाद-टिप्पणी में सुरक्षित रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल में आए व्यक्तिगत वाचा-नाम को शीर्षक में बदलने के बजाय हिन्दी में प्रचलित रूप ‘यहोवा’ से व्यक्त किया गया है।
- issue: מַלְאַךְ יְהוָה की पहचान
  choice: यहोवा का दूत
  alternative: यहोवा का स्वर्गदूत
  rationale: ‘दूत’ अनुवाद यह तय नहीं करता कि यह सृजित स्वर्गदूत, मानवीय संदेशवाहक या ईश्वरीय प्रकट रूप है; इस प्रकार मूल का धर्मवैचारिक तनाव बना रहता है।
- issue: בַּגִּבּוֹרִים का संबंध
  choice: वीरों के विरुद्ध
  alternative: वीरों के बीच; वीरों के साथ
  rationale: संदर्भ इसे युद्ध में यहोवा के शत्रु वीरों के विरुद्ध सहायता के रूप में पढ़ने का समर्थन करता है, लेकिन इब्रानी पूर्वसर्ग के कारण वास्तविक अस्पष्टता पाद-टिप्पणी में दी गई है।
translation_notes:
  register: भाषा आधुनिक, काव्यात्मक और गरिमापूर्ण रखी गई है। मूल की तीखी शाप-वाणी, समानांतर पुनरावृत्ति और अंतिम पद की व्याकरणिक अस्पष्टता को यथासंभव सुरक्षित रखा गया है।
