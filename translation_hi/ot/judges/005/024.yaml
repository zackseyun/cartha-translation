base_translation:
  language: en
  yaml_path: translation/ot/judges/005/024.yaml
  text: Most blessed among women is Jael[a], the wife of Heber the Kenite; among women in the tent[b], most blessed is she.
translation:
  language: hi
  text: स्त्रियों में सबसे धन्य है याएल[a], केनी हेबेर की पत्नी; तंबू की स्त्रियों में वह सबसे धन्य है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “स्त्रियों से बढ़कर धन्य है याएल … तंबू की स्त्रियों से बढ़कर।” हिब्रू की तुलनात्मक रचना का अनुवाद “में” अथवा “से बढ़कर” किया जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से “तंबू में”; हिब्रू में “तंबू” एकवचन है। यह तंबू से संबद्ध स्त्रियों की ओर संकेत कर सकता है।
    reason: cultural_note
lexical_decisions:
- source_word: תְּבֹרַךְ
  choice: सबसे धन्य ... हो
  rationale: पुअल रूप आशीषित या प्रशंसित होने का भाव देता है। מִן के तुलनात्मक प्रयोग के साथ ‘सबसे धन्य’ काव्यात्मक उत्कृष्टता व्यक्त करता है; अंतिम ‘हो’ हिब्रू रूप की आशीर्वादात्मक संभावना भी बनाए रखता है।
- source_word: מִנָּשִׁים
  choice: स्त्रियों में
  rationale: מִן यहाँ तुलना का सूचक है। ‘स्त्रियों में’ स्वाभाविक हिन्दी में समूह के भीतर सर्वोच्चता व्यक्त करता है, जबकि ‘स्त्रियों से बढ़कर’ भी सम्भव है।
- source_word: יָעֵל
  choice: याएल
  rationale: हिब्रू नाम का देवनागरी लिप्यंतरण।
- source_word: אֵשֶׁת חֶבֶר הַקֵּינִי
  choice: केनी हेबेर की पत्नी
  rationale: सम्बन्ध और जातीय पहचान बतानेवाली हिब्रू संबंध-श्रृंखला का संक्षिप्त, स्वाभाविक हिन्दी रूप।
- source_word: בָּאֹהֶל
  choice: तंबू में रहनेवाली
  rationale: शाब्दिक अर्थ ‘तंबू में’ है; सन्दर्भ में यह तंबू से जुड़ी या तंबू में रहनेवाली स्त्रियों को सूचित करता है। मुख्य पाठ में अर्थ स्पष्ट किया गया और पादटिप्पणी में एकवचन शाब्दिक रूप सुरक्षित रखा गया।
- source_word: תְּבֹרָךְ
  choice: वह सबसे धन्य हो
  rationale: दोहराए गए क्रियारूप को पंक्ति के अंत में दोहराकर हिब्रू की काव्यात्मक संरचना और बल बनाए रखा गया है।
