reference: Judges 5:4
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: יְהוָ֗ה בְּ/צֵאתְ/ךָ֤ מִ/שֵּׂעִיר֙ בְּ/צַעְדְּ/ךָ֙ מִ/שְּׂדֵ֣ה אֱד֔וֹם אֶ֣רֶץ רָעָ֔שָׁה גַּם שָׁמַ֖יִם נָטָ֑פוּ גַּם עָבִ֖ים נָ֥טְפוּ מָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/004.yaml
  text: O Yahweh[a], when you went out from Seir, when you marched from the field of Edom, the earth trembled; the heavens also dripped[b], the clouds also dripped water.
translation:
  language: hi
  text: 'हे याहवे, जब तू सेईर से निकला,

    जब तू एदोम के मैदान[a] से आगे बढ़ा,

    तब धरती[b] काँप उठी;

    आकाश से भी बूँदें टपकीं,

    बादलों से भी पानी टपका।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “एदोम के खुले प्रदेश।” इब्रानी का शाब्दिक अर्थ “एदोम का मैदान” है।
    reason: שׂדה के अर्थ-क्षेत्र में खेत, मैदान और खुला प्रदेश सम्मिलित हैं।
  - marker: b
    text: या, “देश काँप उठा।”
    reason: אֶרֶץ का अर्थ संदर्भ के अनुसार ‘धरती’ या ‘देश’ हो सकता है।
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी परमेश्वर के निज नाम को देवनागरी में सीधे लिप्यंतरित किया गया है; इसे किसी उपाधि से नहीं बदला गया।
- source_word: בְּצֵאתְךָ
  choice: जब तू ... निकला
  rationale: בְּ के साथ infinitive construct यहाँ समयसूचक है। एकवचन प्रत्यक्ष संबोधन और काव्यात्मक निकटता बनाए रखने के लिए ‘तू’ रखा गया है।
- source_word: מִשֵּׂעִיר
  choice: सेईर से
  rationale: सेईर स्थानवाचक नाम है और מִן का अर्थ ‘से’ है।
- source_word: בְּצַעְדְּךָ
  choice: जब तू ... आगे बढ़ा
  rationale: צעד कदम रखते हुए उद्देश्यपूर्ण ढंग से आगे बढ़ने को व्यक्त करता है। ‘आगे बढ़ा’ आधुनिक और स्वाभाविक है तथा अत्यधिक सैन्य अर्थ आरोपित नहीं करता।
- source_word: מִשְּׂדֵה אֱדוֹם
  choice: एदोम के मैदान से
  rationale: שׂדה का मूल बिंब ‘मैदान/खुला प्रदेश’ है। ‘मैदान’ उस बिंब को संक्षिप्त और सुबोध रूप में सुरक्षित रखता है।
- source_word: אֶרֶץ רָעָשָׁה
  choice: धरती काँप उठी
  rationale: आकाश और बादलों के समानांतर व्यापक ब्रह्मांडीय संदर्भ के कारण אֶרֶץ को ‘धरती’ समझना अधिक उपयुक्त है; רעש का कंपन ‘काँप उठी’ से स्वाभाविक रूप में व्यक्त होता है।
- source_word: גַּם שָׁמַיִם נָטָפוּ
  choice: आकाश से भी बूँदें टपकीं
  rationale: נטף के टपकने के बिंब को बचाया गया है। हिंदी में आकाश को कर्ता बनाकर ‘आकाश टपका’ कहना अस्वाभाविक होता, इसलिए अर्थ को स्वाभाविक रूप से व्यक्त करने के लिए ‘से बूँदें’ जोड़ा गया है।
- source_word: גַּם עָבִים נָטְפוּ מָיִם
  choice: हाँ, बादलों से भी पानी टपका
  rationale: גם की पुनरावृत्ति को ‘हाँ ... भी’ से उभारा गया है और נטף की पुनरावृत्ति ‘टपका’ से बनाए रखी गई है; ‘बरसा’ कहने से क्रिया का विशिष्ट बिंब बदल जाता।
theological_decisions:
- issue: परमेश्वर के निज नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार-अक्षरीय निज नाम प्रत्यक्ष रूप से है। ‘याहवे’ उसका स्रोत-संगत लिप्यंतरण है और उसे किसी उपाधि में नहीं बदलता।
- issue: परमेश्वर के लिए एकवचन संबोधन
  choice: तू
  alternative: आप
  rationale: इब्रानी में क्रियात्मक रूप और प्रत्यय द्वितीय पुरुष पुल्लिंग एकवचन हैं। काव्यात्मक प्रत्यक्ष संबोधन में ‘तू’ इस व्याकरण और निकटता को सुरक्षित रखता है; इसका आशय अनादर नहीं है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण काव्यात्मक हिंदी अपनाई गई है। समानांतर पंक्तियों और ‘भी’ की पुनरावृत्ति से मूल गीत की गति रखी गई है। ‘टपकना’ दोहराकर इब्रानी נטף की पुनरावृत्ति बचाई गई है, जबकि हिंदी की स्वाभाविकता के लिए संबंधवाचक ‘से’ का प्रयोग किया गया है।
