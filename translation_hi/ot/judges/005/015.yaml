reference: Judges 5:15
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/שָׂרַ֤/י בְּ/יִשָּׂשכָר֙ עִם דְּבֹרָ֔ה וְ/יִשָּׂשכָר֙ כֵּ֣ן בָּרָ֔ק בָּ/עֵ֖מֶק שֻׁלַּ֣ח בְּ/רַגְלָ֑י/ו בִּ/פְלַגּ֣וֹת רְאוּבֵ֔ן גְּדֹלִ֖ים חִקְקֵי לֵֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/015.yaml
  text: And the princes of Issachar were with Deborah[a]; and Issachar was likewise with Barak; into the valley they were sent at his feet[c][b]. Among the divisions of Reuben there were great searchings of heart.
translation:
  language: hi
  text: इस्साकार के प्रधान दबोरा के साथ थे[a], और इस्साकार भी बाराक के साथ था। घाटी में वे उसके पीछे-पीछे भेजे गए[b]। रूबेन के दलों में मन के बड़े विचार-विमर्श हुए[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “इस्साकार के मुखिया” अथवा “इस्साकार के अगुए।” इब्रानी पद काव्यात्मक है और शाब्दिक अधिकार-संबंध के बजाय मुहावरेदार अर्थ दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से “उसके पाँवों पर”; अर्थात वे उसके निकट पीछे चलते हुए उसका अनुसरण कर रहे थे।
    reason: lexical_alternative
  - marker: c
    text: या “मन के बड़े संकल्प” अथवा “मन की गहरी छानबीन।” इब्रानी पद कठिन है; संदर्भ में संभवतः रूबेन के काम करने के बजाय भीतर ही भीतर विचार करते रहने पर बल है।
    reason: alternative_reading
lexical_decisions:
- source_word: שָׂרַי בְּיִשָּׂשכָר
  choice: इस्साकार के प्रधान
  rationale: काव्यात्मक इब्रानी रूप में प्रथम पुरुष प्रत्यय है, पर यहाँ उसे शाब्दिक ‘मेरे प्रधान’ के बजाय मुहावरेदार रूप से इस्साकार के प्रधान/नेता समझना संदर्भानुकूल है। ‘प्रधान’ ऊँची काव्यात्मक शैली भी बनाए रखता है।
- source_word: עִם דְּבֹרָה
  choice: दबोरा के साथ
  rationale: עִם साधारण संगति और सहभागिता व्यक्त करता है।
- source_word: וְיִשָּׂשכָר כֵּן בָּרָק
  choice: और इस्साकार भी बाराक के साथ था
  rationale: כֵּן यहाँ अनुरूपता, ‘भी/उसी प्रकार’, दर्शाता है। इब्रानी वाक्य अर्धलुप्त है; स्वाभाविक हिन्दी के लिए ‘था’ जोड़ा गया है।
- source_word: בָּעֵמֶק
  choice: घाटी में
  rationale: उपसर्ग ב स्थान या गति-दिशा दोनों का संकेत दे सकता है। अगले निष्क्रिय क्रिया-रूप के साथ यह घाटी में युद्ध हेतु भेजे जाने को व्यक्त करता है; हिन्दी में ‘घाटी में’ स्वाभाविक है और दिशा को अत्यधिक निश्चित नहीं करता।
- source_word: שֻׁלַּח
  choice: वे ... भेजे गए
  rationale: रूप व्याकरणतः एकवचन है, पर काव्य में सामूहिक गोत्रीय कर्ता ‘इस्साकार’ के सैनिकों के लिए प्रयुक्त हो सकता है। हिन्दी में आशय स्पष्ट करने के लिए बहुवचन रखा गया है।
- source_word: בְּרַגְלָיו
  choice: उसके पीछे-पीछे
  rationale: शाब्दिक अर्थ ‘उसके पाँवों पर/पास’ है; सैन्य संदर्भ में इसका मुहावरेदार आशय बाराक के निकट पीछे चलते हुए उसका अनुसरण करना है। मुख्य पाठ में स्वाभाविक हिन्दी दी गई और शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
- source_word: בִּפְלַגּוֹת רְאוּבֵן
  choice: रूबेन के दलों में
  rationale: פְּלַגּוֹת विभाजनों, समूहों या गुटों को दर्शा सकता है। ‘दल’ गोत्र के भीतर के समूहों को स्वाभाविक हिन्दी में व्यक्त करता है, बिना यह तय किए कि वे औपचारिक कुल थे या परस्पर विभाजित गुट।
- source_word: גְּדֹלִים חִקְקֵי לֵב
  choice: मन के बड़े विचार-विमर्श
  rationale: यह कठिन काव्यात्मक पदबंध मन के भीतर जाँच, निश्चय या गहन विचार को सूचित कर सकता है। संदर्भ में रूबेन की हिचकिचाहट प्रमुख है, इसलिए ‘विचार-विमर्श’ आंतरिक ऊहापोह को व्यक्त करता है, जबकि वैकल्पिक अर्थ पादटिप्पणी में दिए गए हैं।
theological_decisions:
- issue: रूबेन की आंतरिक प्रतिक्रिया का स्वरूप
  choice: मन के बड़े विचार-विमर्श
  alternative: मन के बड़े संकल्प / मन की गहरी छानबीन
  rationale: इब्रानी חִקְקֵי לֵב अर्थ की दृष्टि से कठिन है। निकट संदर्भ रूबेन के ठहरकर सोचते रहने और युद्ध में न उतरने की ओर संकेत करता है, फिर भी पाठ को निश्चित रूप से केवल निंदा या केवल दृढ़ संकल्प नहीं बनाया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, गीतात्मक किंतु सहज शैली रखी गई है। ‘प्रधान’, ‘घाटी’, ‘दल’ और ‘विचार-विमर्श’ सामान्य पाठक के लिए बोधगम्य हैं। काव्य की अस्पष्टताओं को पादटिप्पणियों में सुरक्षित रखा गया है।
