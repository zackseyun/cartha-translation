  edition: WLC
  text: כֵּ֠ן יֹאבְד֤וּ כָל אוֹיְבֶ֨י/ךָ֙ יְהוָ֔ה וְ/אֹ֣הֲבָ֔י/ו כְּ/צֵ֥את הַ/שֶּׁ֖מֶשׁ בִּ/גְבֻרָת֑/וֹ וַ/תִּשְׁקֹ֥ט הָ/אָ֖רֶץ אַרְבָּעִ֥ים שָׁנָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/031.yaml
  text: So may all your enemies perish[a], O Yahweh, but may those who love him be like the rising of the sun in its strength[b]. And the land had rest forty years.
translation:
  language: hi
  text: '“हे याहवे, तेरे सभी शत्रु इसी प्रकार नाश हो जाएँ,


    परन्तु जो उससे प्रेम करते हैं,


    वे अपने पूरे प्रताप में उगते सूर्य के समान हों।”[a]


    फिर देश को चालीस वर्ष तक विश्राम मिला।[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “सूर्य के अपने पराक्रम में निकलने के समान।”
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में, “देश शान्त रहा।” न्यायियों की पुस्तक में यह अभिव्यक्ति प्रायः संघर्ष के बाद शान्ति और विश्राम की अवधि को दर्शाती है।
    reason: cross_reference
lexical_decisions:
- source_word: כֵּן יֹאבְדוּ
  choice: इसी प्रकार नाश हो जाएँ
  rationale: כֵּן पिछले वर्णन से निष्कर्षात्मक तुलना करता है, और अपूर्ण क्रिया यहाँ कामनासूचक है। यह अनुवाद दोनों भावों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: כָל אוֹיְבֶיךָ
  choice: तेरे सभी शत्रु
  rationale: द्वितीय पुरुष एकवचन प्रत्यय को सीधे सम्बोधन के रूप में रखा गया है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार-अक्षरीय इब्रानी व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में लिप्यंतरित किया गया है।
- source_word: וְאֹהֲבָיו
  choice: परन्तु जो उससे प्रेम करते हैं
  rationale: וְ यहाँ शत्रुओं और प्रेम करने वालों के बीच विरोध दर्शाता है। इब्रानी के तृतीय पुरुष प्रत्यय को ‘उससे’ द्वारा सुरक्षित रखा गया है, भले ही पिछला वाक्यांश सीधे परमेश्वर को सम्बोधित करता है।
- source_word: כְּצֵאת הַשֶּׁמֶשׁ בִּגְבֻרָתוֹ
  choice: उस सूर्य के समान हों जो अपने पूरे प्रताप में उदय होता है
  rationale: יצא का सूर्य के साथ प्रयोग उसके निकलने या उदय होने को दर्शाता है; גְּבוּרָה यहाँ उसकी प्रबल चमक और सामर्थ्य का चित्र प्रस्तुत करता है।
- source_word: וַתִּשְׁקֹט הָאָרֶץ
  choice: फिर देश को … विश्राम मिला
  rationale: न्यायियों में यह प्रचलित कथात्मक सूत्र युद्ध के बाद शान्ति और चैन की अवधि बताता है, केवल ध्वनि का अभाव नहीं।
- source_word: אַרְבָּעִים שָׁנָה
  choice: चालीस वर्ष तक
  rationale: अवधि को सहज आधुनिक हिन्दी में व्यक्त किया गया है।
theological_decisions:
- issue: יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत नाम है; ‘याहवे’ उसका निकट लिप्यंतरण है और उसे किसी उपाधि से नहीं बदलता।
- issue: וְאֹהֲבָיו में सर्वनाम का सन्दर्भ और पुरुष-परिवर्तन
  choice: ‘उससे’ याहवे की ओर संकेत करता है
  alternative: ‘तुझसे’ कहकर सीधे सम्बोधन को समान बनाए रखना
  rationale: इब्रानी पाठ ‘तेरे शत्रु’ के सीधे सम्बोधन से ‘उससे प्रेम करने वाले’ के तृतीय पुरुष में बदलता है। अनुवाद इस वास्तविक व्याकरणिक तनाव को सहज बनाए बिना सुरक्षित रखता है।
- issue: दूसरे खंड में कामनासूचक भाव
  choice: ‘के समान हों’
  alternative: ‘के समान हैं’
  rationale: पहले खंड की कामना निष्क्रिय वाक्यात्मक दूसरे खंड पर भी लागू होती है; ‘हों’ समानांतर आशीष/कामना को स्पष्ट करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। काव्यात्मक पंक्तियाँ अलग रखी गई हैं और अंतिम कथात्मक सूत्र पृथक अनुच्छेद में है। परमेश्वर के लिए सीधे सम्बोधन में ‘तेरे’ का प्रयोग मूल के एकवचन और गीतात्मक निकटता को दर्शाता है; तृतीय पुरुष ‘उससे’ को जानबूझकर सुरक्षित रखा गया है।
