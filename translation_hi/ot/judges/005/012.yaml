source:
  edition: WLC
  text: עוּרִ֤י עוּרִי֙ דְּבוֹרָ֔ה ע֥וּרִי ע֖וּרִי דַּבְּרִי שִׁ֑יר ק֥וּם בָּרָ֛ק וּֽ/שֲׁבֵ֥ה שֶׁבְיְ/ךָ֖ בֶּן אֲבִינֹֽעַם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/012.yaml
  text: Awake[a], awake, Deborah! Awake, awake, sing a song! Rise up, Barak, and take captive your captives[b], son of Abinoam.
translation:
  language: hi
  text: '“जाग उठ, जाग उठ, दबोरा!

    जाग उठ, जाग उठ, गीत सुना![a]

    उठ, बाराक! अपने बंदियों को बंदी बनाकर ले चल,[b]

    हे अबीनोअम के पुत्र!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “गीत बोल।” यहाँ सामान्यतः ‘गाने’ के लिए प्रयुक्त क्रिया के बजाय ‘बोलने’ की क्रिया है; यह गीत को स्वर देकर सुनाने का काव्यात्मक आह्वान हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “अपने बंदियों को बंदी बना।” यह विजय के बाद शत्रुओं को कैदी बनाकर ले जाने की इब्रानी काव्यात्मक अभिव्यक्ति है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עוּרִי
  choice: जाग उठ
  rationale: स्त्रीलिंग एकवचन आज्ञार्थक क्रिया चार बार दोहराई गई है। ‘जाग उठ’ आह्वान की तत्परता और काव्यात्मक पुनरावृत्ति को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: דְּבוֹרָה
  choice: दबोरा
  rationale: व्यक्तिनाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: דַּבְּרִי שִׁיר
  choice: गीत सुना
  rationale: मूल क्रिया का शाब्दिक अर्थ ‘बोल’ है, जबकि पूरा पदबंध गीत प्रस्तुत करने का आह्वान करता है। ‘गीत सुना’ हिन्दी में स्वाभाविक है और केवल ‘गा’ कहने की अपेक्षा बोलकर/गाकर प्रस्तुत करने की मूल काव्यात्मक व्यापकता को बेहतर बनाए रखता है; शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: קוּם
  choice: उठ
  rationale: बाराक को संबोधित पुल्लिंग एकवचन आज्ञा; संक्षिप्त रूप गीत की तीव्र लय के अनुकूल है।
- source_word: בָּרָק
  choice: बाराक
  rationale: व्यक्तिनाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: וּשֲׁבֵה
  choice: बंदी बनाकर ले चल
  rationale: क्रिया शत्रुओं को बंदी बनाने और विजय में साथ ले जाने का भाव रखती है। यह रूप सैनिक संदर्भ और गतिशील आज्ञा दोनों स्पष्ट करता है।
- source_word: שֶׁבְיְךָ
  choice: अपने बंदियों को
  rationale: संज्ञा सामूहिक रूप से बंदियों अथवा बंदी बनाए गए लोगों को सूचित कर सकती है। ‘अपने बंदियों’ से मूल की पुनरुक्तिपूर्ण विजय-अभिव्यक्ति बनी रहती है।
- source_word: בֶּן אֲבִינֹעַם
  choice: हे अबीनोअम के पुत्र
  rationale: वंशनामक संबोधन को औपचारिक रूप में रखा गया है; ‘हे’ हिन्दी में प्रत्यक्ष संबोधन स्पष्ट करता है।
