  text: רֹכְבֵי֩ אֲתֹנ֨וֹת צְחֹר֜וֹת יֹשְׁבֵ֧י עַל מִדִּ֛ין וְ/הֹלְכֵ֥י עַל דֶּ֖רֶךְ שִֽׂיחוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/010.yaml
  text: You who ride on white donkeys[a], you who sit on carpets[b], and you who walk on the road—speak!
translation:
  language: hi
  text: 'हे सफेद गधियों पर सवारी करने वालो,


    हे गलीचों पर बैठने वालो[a],


    और मार्ग पर चलने वालो—बोलो![b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जीनपोशों पर” अथवा “बिछौनों पर”; इब्रानी शब्द दुर्लभ है और उसका अर्थ अनिश्चित है।
    reason: lexical_alternative
  - marker: b
    text: या, “इसका वर्णन करो” अथवा “इसे कह सुनाओ”; इब्रानी क्रिया बोलने या किसी बात का वृत्तांत सुनाने का भाव व्यक्त कर सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹכְבֵי
  choice: सवार होनेवालो
  rationale: यह बहुवचन कर्तृवाचक कृदन्त यहाँ संबोधन के रूप में प्रयुक्त है; हिंदी में यह रूप काव्यात्मक पुकार को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: אֲתֹנוֹת
  choice: गधियों
  rationale: इब्रानी संज्ञा विशेष रूप से मादा गधों को दर्शाती है। हिंदी में ‘गधियों’ स्वाभाविक रहते हुए मूल की यह विशिष्टता बनाए रखता है।
- source_word: צְחֹרוֹת
  choice: सफेद
  rationale: विशेषण का सबसे सीधा अर्थ सफेदी या उजला रंग है; यह प्रतिष्ठित सवारी का चित्र प्रस्तुत करता है।
- source_word: יֹשְׁבֵי
  choice: बैठनेवालो
  rationale: यह भी संबोधन में प्रयुक्त बहुवचन कृदन्त है। इसके बाद बैठने की वस्तु आने की संभावना के कारण ‘बैठनेवालो’ उपयुक्त है।
- source_word: מִדִּין
  choice: गलीचों
  rationale: यह दुर्लभ और अनिश्चित शब्द है। सवारों और यात्रियों के संदर्भ में कीमती बिछावन अथवा बैठने के गलीचे का अर्थ सबसे संगत लगता है, पर अनिश्चितता पादटिप्पणी में रखी गई है।
- source_word: וְהֹלְכֵי
  choice: और ... चलनेवालो
  rationale: तीसरा संबोधनात्मक कृदन्त है, जो पद में संबोधित समूहों की समानांतर रचना पूरी करता है।
- source_word: דֶּרֶךְ
  choice: मार्ग
  rationale: यह सड़क, मार्ग या रास्ते के लिए सामान्य शब्द है; ‘मार्ग’ कविता के गरिमापूर्ण स्वर और वास्तविक यात्रा—दोनों के अनुकूल है।
- source_word: שִׂיחוּ
  choice: बोलो
  rationale: इस बहुवचन आज्ञार्थक क्रिया में बोलने, वर्णन करने अथवा मननपूर्वक कहने का अर्थ हो सकता है। ‘बोलो’ मूल की व्यापकता बनाए रखता है; अधिक विशिष्ट अर्थ पादटिप्पणी में दिया गया है।
