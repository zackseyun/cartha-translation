base_translation:
  language: en
  yaml_path: translation/ot/judges/005/028.yaml
  text: 'Through the window Sisera’s mother looked out and wailed through the lattice: “Why is his chariot so late in coming? Why do the hoofbeats of his chariots delay?”[a][b]'
translation:
  language: hi
  text: खिड़की से सीसरा की माँ ने बाहर झाँका और जाली से विलाप किया, “उसका रथ आने में देर क्यों कर रहा है? उसके रथों की आहट आने में देर क्यों हो रही है?”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: दुर्लभ हिब्रू क्रिया का अनुवाद “व्याकुल होकर पुकारा” भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक अर्थ “उसके रथों के कदम/पदचाप” है। “आहट” रथों के आने से जुड़ी ध्वनि को व्यक्त करता है, बिना उसे खुरों की टाप या पहियों की आवाज़ तक सीमित किए।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעַד הַחַלּוֹן
  choice: खिड़की से
  rationale: בְּעַד किसी खुले स्थान के आर-पार देखने का भाव देता है; आधुनिक हिन्दी में ‘खिड़की से’ स्वाभाविक रूप से वही स्थानिक अर्थ व्यक्त करता है।
- source_word: נִשְׁקְפָה
  choice: बाहर झाँका
  rationale: क्रिया खिड़की या ऊँचे स्थान से बाहर देखने को सूचित करती है; ‘बाहर झाँका’ दृश्य की उत्कंठा को बिना अनावश्यक विस्तार के व्यक्त करता है।
- source_word: וַתְּיַבֵּב
  choice: विलाप किया
  rationale: यह दुर्लभ क्रिया किसी व्याकुल पुकार या शोकपूर्ण आवाज़ का संकेत देती है; ‘विलाप किया’ सम्भावित भाव को व्यक्त करता है, जबकि वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: אֵם סִיסְרָא
  choice: सीसरा की माँ
  rationale: सम्बन्धवाचक हिब्रू संरचना का सहज और स्पष्ट हिन्दी रूप।
- source_word: בְּעַד הָאֶשְׁנָב
  choice: जाली के पीछे से
  rationale: אֶשְׁנָב जालीदार खिड़की या झरोखे को दर्शाता है; ‘जाली के पीछे से’ दृश्य की वास्तु-संबंधी और स्थानिक विशेषता स्पष्ट करता है।
- source_word: בֹּשֵׁשׁ רִכְבּוֹ לָבוֹא
  choice: उसका रथ आने में इतनी देर क्यों लगा रहा है
  rationale: בֹּשֵׁשׁ का अर्थ देर करना है; यह हिन्दी वाक्य माँ की व्याकुल प्रतीक्षा और मूल प्रश्न दोनों को स्वाभाविक ढंग से रखता है।
- source_word: פַּעֲמֵי מַרְכְּבוֹתָיו
  choice: उसके रथों के चलने की आहट
  rationale: פַּעֲמֵי का मूल अर्थ कदम, पदचाप या पड़ने वाली चोटें है। रथों के संदर्भ में ‘चलने की आहट’ सुनाई देने वाली गति का भाव रखती है और घोड़ों के खुरों या पहियों को अनिश्चित रूप से निर्दिष्ट नहीं करती।
- source_word: אֶחֱרוּ
  choice: आने में देर क्यों हो रही है
  rationale: बहुवचन क्रिया रथों की अपेक्षित आवाज़/गतियों के विलम्ब को व्यक्त करती है; हिन्दी में यह कथन सहज है।
