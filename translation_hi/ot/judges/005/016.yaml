base_translation:
  language: en
  yaml_path: translation/ot/judges/005/016.yaml
  text: Why did you sit among the sheepfolds[a], to hear the whistling for the flocks? For the divisions of Reuben there were great searchings of heart.
translation:
  language: hi
  text: 'तू भेड़ों के बाड़ों के बीच क्यों बैठा रहा,

    रेवड़ों के लिए बजाई जाने वाली सीटियाँ सुनने को?


    रूबेन के दलों[a] में

    मन के बड़े मंथन हुए।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “रूबेन की जलधाराओं के पास।” हिब्रू शब्द का अर्थ “दल/विभाग” या “जलधाराएँ” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָּה
  choice: क्यों
  rationale: सीधा प्रश्नवाचक शब्द रूबेन की निष्क्रियता का कारण पूछता है; ‘क्यों’ स्वाभाविक और सटीक है।
- source_word: יָשַׁבְתָּ
  choice: तू ... बैठा रहा
  rationale: क्रिया के ठोस ‘बैठने’ के बिंब और लगातार निष्क्रिय बने रहने के भाव, दोनों को बनाए रखता है।
- source_word: בֵּין הַמִּשְׁפְּתַיִם
  choice: भेड़ों के बाड़ों के बीच
  rationale: आगे रेवड़ों का उल्लेख होने के कारण पशुपालन-संबंधी पारंपरिक अर्थ संदर्भ के अनुकूल है; ‘बीच’ हिब्रू संबंध को सीधे व्यक्त करता है।
- source_word: לִשְׁמֹעַ
  choice: सुनने को
  rationale: उद्देश्यसूचक infinitive को संक्षिप्त, काव्यात्मक और स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: שְׁרִקוֹת עֲדָרִים
  choice: रेवड़ों के लिए बजने वाली सीटियाँ
  rationale: संभावित चरवाही-संकेत को स्पष्ट करता है, पर यह नहीं बताता कि सीटी कौन बजाता है; ‘रेवड़’ निकटवर्ती पशुपालन-संदर्भ के अनुकूल है।
- source_word: לִפְלַגּוֹת רְאוּבֵן
  choice: रूबेन के दलों में
  rationale: פְלַגּוֹת के ‘विभाग/दल’ अर्थ को चुनता है और לִ को प्रसंगानुसार स्थान/समूह-संबंध के रूप में व्यक्त करता है; ‘जलधाराएँ’ वाला वास्तविक वैकल्पिक अर्थ पाद-टिप्पणी में सुरक्षित है।
- source_word: גְּדוֹלִים חִקְרֵי לֵב
  choice: मन की गहरी जाँच-पड़ताल हुई
  rationale: हृदय के भीतर खोजने-जाँचने के काव्यात्मक रूपक को सहज हिंदी में रखता है; बहुवचन की यांत्रिक नकल से बचते हुए तीव्रता को ‘गहरी’ से व्यक्त किया गया है।
theological_decisions:
- issue: रूबेन की भीतरी प्रतिक्रिया का स्वरूप
  choice: ‘मन की गहरी जाँच-पड़ताल’—आत्ममंथन/विचार की सामान्य अभिव्यक्ति
  alternative: ‘मन के बड़े संकल्प’ या ‘दृढ़ निश्चय’
  rationale: חִקְרֵי का मूल भाव खोजने-जाँचने का है; इसे ‘संकल्प’ कहना उस विडंबना को पहले ही निर्णीत कर देगा जिसमें बहुत विचार हुआ, पर युद्ध में भागीदारी नहीं हुई।
translation_notes:
  register: आधुनिक मानक हिंदी में काव्यात्मक पंक्ति-विन्यास रखा गया है। रूबेन को संबोधित एकवचन के लिए ‘तू’ मूल की सीधी, तीखी फटकार को बनाए रखता है। भाषा गरिमापूर्ण है, पर ‘जाँच-पड़ताल’ जैसे परिचित पद से साधारण पाठक के लिए अर्थ सुलभ रहता है।
