source:
  edition: WLC
  text: לִבִּ/י֙ לְ/חוֹקְקֵ֣י יִשְׂרָאֵ֔ל הַ/מִּֽתְנַדְּבִ֖ים בָּ/עָ֑ם בָּרֲכ֖וּ יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/009.yaml
  text: My heart is with the leaders of Israel[a], who volunteered among the people. Bless Yahweh!
translation:
  language: hi
  text: मेरा मन इस्राएल के नेताओं[a] के साथ है, जो लोगों में स्वेच्छा से आगे आए। याहवे को धन्य कहो!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरा मन इस्राएल के विधि ठहरानेवालों के साथ है, जो लोगों में स्वेच्छा से आगे आए।”
    reason: חקק से बना शब्द विधि ठहरानेवालों, शासकों, या नेतृत्वकर्ताओं को सूचित कर सकता है।
lexical_decisions:
- source_word: לִבִּי
  choice: मेरा मन
  rationale: हिब्रू में शाब्दिक रूप से ‘मेरा हृदय’ है; आधुनिक हिन्दी में ‘मेरा मन’ आंतरिक लगाव, समर्थन और प्रशंसा का भाव स्वाभाविक रूप से व्यक्त करता है।
- source_word: לְחוֹקְקֵי
  choice: अगुओं के साथ
  rationale: חקק से बना यह रूप निर्णय करने या व्यवस्था ठहरानेवालों को सूचित कर सकता है। गीत के प्रसंग में ‘अगुए’ शासन अथवा नेतृत्व की जिम्मेदारी उठानेवालों के लिए स्पष्ट और स्वाभाविक है; मूल से जुड़ा ‘विधि ठहरानेवाले’ पादटिप्पणी में रखा गया है।
- source_word: יִשְׂרָאֵל
  choice: इस्राएल के
  rationale: यह अगुओं की पहचान इस्राएल से संबंधित लोगों के रूप में करता है।
- source_word: הַמִּתְנַדְּבִים
  choice: जिन्होंने स्वेच्छा से अपने आपको अर्पित किया
  rationale: हित्पाएल कृदन्त स्वेच्छापूर्वक स्वयं को प्रस्तुत करने का भाव रखता है। यह हिन्दी रूप केवल सामान्य सेवा देने के बजाय आत्म-समर्पण के मूल भाव को बनाए रखता है।
- source_word: בָּעָם
  choice: लोगों के बीच
  rationale: עַם का सामान्य अर्थ ‘लोग/प्रजा’ है। प्रसंग में ‘सेना के बीच’ संभव हो सकता है, पर वह मूल शब्द की अपेक्षा अधिक संकीर्ण होगा।
- source_word: בָּרֲכוּ
  choice: धन्य कहो
  rationale: ברך का बहुवचन आज्ञार्थक रूप है। परमेश्वर के संबंध में हिन्दी में ‘धन्य कहो’ स्वाभाविक है और ‘आशीष दो’ से उत्पन्न संभावित भ्रम से बचता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम יהוה को किसी उपाधि से बदलने के बजाय हिन्दी लिपि में ‘याहवे’ लिखा गया है।
theological_decisions:
- issue: יהוה परमेश्वर के नाम का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: पद में व्यक्तिगत दिव्य नाम सीधे आया है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और उसे केवल उपाधि ‘प्रभु’ से प्रतिस्थापित नहीं करता।
- issue: अगुओं के प्रति वक्ता के भाव का स्वरूप
  choice: मेरा मन ... के साथ है
  alternative: मेरा मन ... की ओर है
  rationale: हिब्रू वाक्य में स्पष्ट क्रिया नहीं है और לְ संबंध, समर्थन या अभिमुखता व्यक्त कर सकता है। ‘के साथ है’ वक्ता की हार्दिक एकजुटता दर्शाता है, पर किसी अतिरिक्त doctrinal अर्थ को नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, काव्यात्मक और गरिमापूर्ण रखी गई है। ‘अगुए’ बाइबलीय हिन्दी में परिचित होते हुए भी सामान्य पाठक के लिए समझने योग्य है। मूल की स्वैच्छिक आत्म-प्रस्तुति को स्पष्ट रखने के लिए ‘स्वेच्छा से अपने आपको अर्पित किया’ चुना गया है।
