id: JDG.5.3
reference: Judges 5:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: שִׁמְע֣וּ מְלָכִ֔ים הַאֲזִ֖ינוּ רֹֽזְנִ֑ים אָֽנֹכִ֗י לַֽ/יהוָה֙ אָנֹכִ֣י אָשִׁ֔ירָה אֲזַמֵּ֕ר לַֽ/יהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/003.yaml
  text: Hear[a], O kings; give ear, O rulers. I, to Yahweh[b], I will sing; I will make music to Yahweh, the God of Israel.
translation:
  language: hi
  text: हे राजाओ, सुनो[a]; हे शासको, ध्यान दो। मैं याहवे के लिए, मैं गाऊँगी; मैं इस्राएल के परमेश्वर याहवे के लिए संगीत गाऊँगी[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में “सुनो” और “ध्यान दो” दो निकटार्थी आज्ञाएँ हैं, जिनकी समानांतरता काव्यात्मक जोर देती है।
    reason: lexical_alternative
  - marker: b
    text: 'या “मैं याहवे की स्तुति गाऊँगी।” इब्रानी में यहाँ दो संबंधित, पर अलग क्रियाएँ हैं: “गाना” और “संगीत गाना।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ ... הַאֲזִינוּ
  choice: सुनो ... ध्यान दो
  rationale: दोनों बहुवचन आज्ञार्थक क्रियाओं का निकट-समानांतर काव्यात्मक बल रखते हुए आधुनिक और स्वाभाविक हिन्दी दी गई है।
- source_word: מְלָכִים ... רֹזְנִים
  choice: राजाओ ... शासको
  rationale: ये क्रमशः राजाओं और उच्च पदस्थ शासकों को संबोधित करते हैं; संबोधन-रूप हिन्दी कविता में स्पष्ट है।
- source_word: אָנֹכִי ... אָנֹכִי
  choice: मैं—हाँ, मैं
  rationale: स्वतंत्र सर्वनाम की पुनरावृत्ति वक्ता के दृढ़ आत्मघोष और काव्यात्मक जोर को व्यक्त करती है।
- source_word: לַיהוָה
  choice: यहोवा के लिए
  rationale: गीत-संबंधी क्रियाओं के साथ ל दिशा अथवा समर्पण दर्शा सकता है; 'के लिए' हिन्दी में स्वाभाविक रहते हुए समर्पण का भाव बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी पाठ में आए परमेश्वर के व्यक्तिगत वाचा-नाम को लिप्यंतरित रूप में रखा गया है।
- source_word: אָשִׁירָה
  choice: गाऊँगी
  rationale: रूप में संकल्प/इच्छा का भाव है। वक्ता दबोरा होने के कारण हिन्दी में स्त्रीलिंग स्वाभाविक है।
- source_word: אֲזַמֵּר
  choice: संगीत करूँगी
  rationale: यह זמר को पहले प्रयुक्त 'गाना' से अलग रखते हुए संगीत या स्तुति-गान करने का व्यापक अर्थ व्यक्त करता है।
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: इस्राएल के परमेश्वर
  rationale: संबंधवाची पदबंध का सीधा और प्रचलित हिन्दी अनुवाद है।
theological_decisions:
- issue: परमेश्वर के नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: प्रभु / याहवे
  rationale: मूल में वाचा-नाम स्पष्ट रूप से उपस्थित है; उसे सामान्य उपाधि में बदलने के बजाय हिन्दी में परिचित नाम-रूप से प्रस्तुत किया गया है।
- issue: पहले पुरुष की क्रियाओं का लिंग
  choice: 'स्त्रीलिंग: गाऊँगी, करूँगी'
  alternative: लिंग-अचिह्नित या पुल्लिंग रूप
  rationale: गीत की वक्ता दबोरा है (न्यायियों 5:1), और आधुनिक हिन्दी की भविष्यत्कालीन क्रियाओं में लिंग व्यक्त करना आवश्यक है; यह पाठ के साहित्यिक संदर्भ को दर्शाता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और गीतात्मक रखी गई है। संबोधन में 'हे' तथा 'मैं—हाँ, मैं' मूल की सार्वजनिक पुकार और emphatic पुनरावृत्ति को व्यक्त करते हैं; अनावश्यक पुरातन शब्दावली से बचा गया है।
