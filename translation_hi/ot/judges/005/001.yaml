  text: 'Then Deborah and Barak son of Abinoam sang on that day[a], saying:'
translation:
  language: hi
  text: 'उस दिन दबोरा और अबीनोअम के पुत्र बाराक ने गाया, यह कहते हुए:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתָּשַׁר
  choice: यह गीत गाया
  rationale: मूल क्रिया שׁיר का अर्थ ‘गाना’ है। हिन्दी में आगे आने वाले काव्य का स्वाभाविक परिचय देने के लिए ‘यह गीत गाया’ रखा गया है; स्त्रीलिंग एकवचन क्रिया दबोरा से मेल खाती है, जबकि बाराक बाद में संयुक्त होता है।
- source_word: דְּבוֹרָה
  choice: दबोरा
  rationale: व्यक्तिनाम का प्रचलित हिन्दी रूप।
- source_word: וּבָרָק
  choice: और ... बाराक
  rationale: संयोजक सहित व्यक्तिनाम का प्रचलित हिन्दी रूप।
- source_word: בֶּן אֲבִינֹעַם
  choice: अबीनोअम के पुत्र
  rationale: इब्रानी पितृनाम-संबंध को सहज और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: בַּיּוֹם הַהוּא
  choice: उस दिन
  rationale: निर्दिष्ट विजय-दिवस का समय-सूचक वाक्यांश; हिन्दी में संबंधबोधक अर्थ विभक्ति से स्वाभाविक रूप से व्यक्त होता है।
- source_word: לֵאמֹר
  choice: ':'
  rationale: इब्रानी उद्धरण-सूचक पद आगे आने वाले गीत का परिचय देता है। हिन्दी में ‘कहते हुए’ जोड़ना असहज होगा; द्विबिंदु उसी कार्य को स्पष्ट रूप से निभाता है।
