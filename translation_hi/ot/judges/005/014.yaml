base_translation:
  language: en
  yaml_path: translation/ot/judges/005/014.yaml
  text: From Ephraim those whose root was in Amalek[a]; after you, Benjamin, among your peoples. From Machir commanders came down[e][d][c][b], and from Zebulun those who wield the staff of the scribe.
translation:
  language: hi
  text: एप्रैम से वे, जिनकी जड़ अमालेक में थी[a]; तेरे पीछे, हे बिन्यामीन, तेरे लोगों के बीच[b]। माकीर से सेनानायक उतर आए[c][d], और जबूलून से वे जो लिपिक की छड़ी चलाते थे[e]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद ‘जिनकी जड़ अमालेक के विरुद्ध थी’ या ‘जिनकी जड़ अमालेक के पहाड़ी प्रदेश में थी’ भी हो सकता है। इब्रानी पंक्ति कठिन है और संभवतः काव्यात्मक भूगोल की ओर संकेत करती है।
    reason: alternative_reading
  - marker: b
    text: या, ‘बिन्यामीन तेरे पीछे अपने कुलों के साथ आया।’ ‘तेरे लोगों के बीच’ एक असामान्य इब्रानी अभिव्यक्ति का निकट अनुवाद है।
    reason: lexical_alternative
  - marker: c
    text: ‘माकीर’ मनश्शे गोत्र का एक प्रमुख कुल था; इसलिए कुछ अनुवाद यहाँ व्यापक गोत्रार्थ में ‘मनश्शे’ कहते हैं।
    reason: cultural_note
  - marker: d
    text: ‘सेनानायक’ के स्थान पर ‘शासक’ या ‘विधि देनेवाले’ भी संभव है। इब्रानी शब्द शासन करने या आदेश निर्धारित करने वालों को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: e
    text: या, ‘जो लिपिक की छड़ी खींचते थे’ अथवा ‘जो सेना जुटाने वाले अधिकारी की छड़ी धारण करते थे।’ यह इब्रानी अभिव्यक्ति दुर्लभ है और सैनिकों की गिनती व जुटान या अभिलेख रखने से संबंधित हो सकती है।
    reason: lexical_alternative
