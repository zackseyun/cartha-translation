base_translation:
  language: en
  yaml_path: translation/ot/judges/006/011.yaml
  text: Then the angel of Yahweh came and sat under the oak that was in Ophrah[a], which belonged to Joash the Abiezrite[c][b], while Gideon his son was beating out wheat in the winepress to hide it from Midian.
translation:
  language: hi
  text: तब यहोवा का दूत आया और उस बलूत के पेड़[a] के नीचे बैठ गया, जो ओप्रा में था और अबीएजेरी योआश का था। योआश का पुत्र गिदोन उस समय मिद्यानियों से गेहूँ छिपाने के लिए दाखरस के कुंड में उसे पीटकर दाने निकाल रहा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तेरेबिन्थ का पेड़।” हिब्रू में प्रयुक्त वृक्ष का ठीक प्रकार निश्चित नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: यहोवा का दूत
  rationale: מַלְאַךְ का मूल अर्थ ‘दूत’ है और इस प्रसंग में वह अलौकिक दूत है। ‘यहोवा का दूत’ स्वाभाविक हिन्दी में इस कथात्मक पदवी को बनाए रखता है और उसकी अंतिम पहचान का निर्णय नहीं करता।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है।
- source_word: וַיָּבֹא ... וַיֵּשֶׁב
  choice: आया और ... बैठ गया
  rationale: दोनों क्रमिक कथात्मक क्रियाओं को सरल और स्वाभाविक हिन्दी में अलग-अलग क्रियाओं के रूप में रखा गया है।
- source_word: הָאֵלָה
  choice: बलूत का पेड़
  rationale: यह शब्द किसी बड़े वृक्ष, प्रायः बलूत अथवा तेरेबिन्थ, को सूचित करता है। मुख्य पाठ में समझ में आने वाला ‘बलूत’ रखा गया है और वनस्पति-संबंधी अनिश्चितता पाद-टिप्पणी में दी गई है।
- source_word: בְּעָפְרָה
  choice: ओप्रा में
  rationale: स्थान-नाम का हिन्दी ध्वन्यात्मक लिप्यंतरण किया गया है।
- source_word: אֲשֶׁר לְיוֹאָשׁ
  choice: जो ... योआश का था
  rationale: हिब्रू के स्वामित्व-संबंध को संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: אֲבִי הָעֶזְרִי
  choice: अबीएजेरी
  rationale: यह योआश की कुल-संबंधी पहचान है; हिब्रू विशेषण का निकट लिप्यंतरण रखा गया है।
- source_word: חֹבֵט חִטִּים
  choice: गेहूँ को पीटकर दाने निकाल रहा था
  rationale: חבט अनाज को पीटकर उसके दाने निकालने की ठोस क्रिया बताता है। यह अनुवाद दाखरस के कुंड जैसे असामान्य स्थान में किए जा रहे काम की तस्वीर स्पष्ट रखता है।
- source_word: בַּגַּת
  choice: दाखरस के कुंड में
  rationale: גת अंगूर रौंदकर रस निकालने का कुंड है। ‘में’ हिब्रू संबंधबोधक और छिपकर काम करने की स्थिति दोनों को व्यक्त करता है।
- source_word: לְהָנִיס מִפְּנֵי מִדְיָן
  choice: मिद्यानियों से गेहूँ छिपाने के लिए
  rationale: शाब्दिक रूप से यह गेहूँ को मिद्यान के सामने से दूर करने का भाव देता है; प्रसंग में उद्देश्य उसे शत्रु की नज़र और कब्ज़े से बचाना है। हिन्दी में समुदाय के लिए ‘मिद्यानियों’ कहना स्वाभाविक है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु / याहवे
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम है। ‘यहोवा’ आधुनिक हिन्दी बाइबलीय प्रयोग में पहचाना जाने वाला लिप्यंतरण है और नाम को उपाधि में नहीं बदलता।
- issue: מַלְאַךְ יְהוָה में מַלְאַךְ का स्वरूप
  choice: यहोवा का दूत
  alternative: यहोवा का स्वर्गदूत
  rationale: कथा इस पात्र को अलौकिक रूप में प्रस्तुत करती है, पर केवल ‘दूत’ रखने से हिब्रू की शब्दगत व्यापकता और उसकी पहचान से जुड़ा धर्मवैचारिक तनाव सुरक्षित रहता है; ‘स्वर्गदूत’ कहकर अनावश्यक रूप से अधिक स्पष्ट नहीं किया गया।
- issue: मिद्यान का सामूहिक संदर्भ
  choice: मिद्यानियों से
  alternative: मिद्यान से
  rationale: हिब्रू में ‘मिद्यान’ एकवचन नाम सामूहिक शत्रु का प्रतिनिधित्व करता है। हिन्दी में आशय स्पष्ट करने के लिए लोगों को सूचित करने वाला रूप रखा गया है, बिना किसी अतिरिक्त धर्मवैचारिक निष्कर्ष के।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘दाखरस का कुंड’ साधारण पाठक के लिए ‘दाखरस निकालने का हौद’ से अधिक संक्षिप्त है और पारंपरिक बाइबलीय परिवेश बनाए रखता है। क्रिया ‘पीटकर दाने निकालना’ असामान्य स्थान में गिदोन के छिपकर किए जा रहे काम को दृश्यात्मक बनाती है।
