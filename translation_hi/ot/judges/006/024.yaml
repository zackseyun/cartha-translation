base_translation:
  language: en
  yaml_path: translation/ot/judges/006/024.yaml
  text: Then Gideon built an altar there to Yahweh and called it[a], “Yahweh Is Peace.” It remains there to this day in Ophrah of the Abiezrites.
translation:
  language: hi
  text: तब गिदोन ने वहाँ याहवे के लिए एक वेदी बनाई और उसका नाम “याहवे शांति है”[a] रखा। वह आज तक अबीएजेरियों के ओप्रा में है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी: ‘याहवे शालोम’; परम्परागत रूप से इसे ‘याहवे-शालोम’ लिखा जाता है।'
    reason: वेदी के नाम का मूल इब्रानी रूप और उसका प्रचलित लिप्यंतरण बताना।
lexical_decisions:
- source_word: וַיִּבֶן
  choice: बनाई
  rationale: वेदी के निर्माण के लिए בנה का स्वाभाविक और सटीक हिन्दी रूप।
- source_word: מִזְבֵּחַ
  choice: वेदी
  rationale: बलि और उपासना के स्थान के लिए प्रचलित बाइबिलीय हिन्दी शब्द।
- source_word: לַיהוָה
  choice: याहवे के लिए
  rationale: ל समर्पण अथवा उद्देश्य दर्शाता है; יְהוָה को उसके व्यक्तिगत वाचा-नाम ‘याहवे’ के रूप में रखा गया है।
- source_word: וַיִּקְרָא לוֹ
  choice: उसका नाम … रखा
  rationale: नामकरण के प्रसंग में קרא + ל का स्वाभाविक हिन्दी अनुवाद; सर्वनाम वेदी की ओर संकेत करता है।
- source_word: יְהוָה שָׁלוֹם
  choice: याहवे शान्ति है
  rationale: इब्रानी के क्रियारहित नाम-सूत्र का अर्थ स्पष्ट करने के लिए हिन्दी में ‘है’ जोड़ा गया है।
- source_word: שָׁלוֹם
  choice: शान्ति
  rationale: यहाँ संक्षिप्त वेदी-नाम में ‘शान्ति’ सर्वाधिक स्वाभाविक है, यद्यपि मूल शब्द में कुशलता और सम्पूर्ण कल्याण का भाव भी हो सकता है।
- source_word: עַד הַיּוֹם הַזֶּה עוֹדֶנּוּ
  choice: वह वेदी आज तक … है
  rationale: निरन्तर अस्तित्व और लेखक के समय तक बने रहने—दोनों भावों को सहज हिन्दी में व्यक्त करता है।
- source_word: בְּעָפְרָת אֲבִי הָעֶזְרִי
  choice: अबीएजेरी लोगों के ओप्रा में
  rationale: ओप्रा स्थान-नाम है और אֲבִי הָעֶזְרִי कुल/वंश से उसका सम्बन्ध बताता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु
  rationale: मूल पाठ दोनों स्थानों पर परमेश्वर का व्यक्तिगत वाचा-नाम יְהוָה प्रयोग करता है; लिप्यन्तरण इस भेद को सुरक्षित रखता है।
- issue: יְהוָה שָׁלוֹם में निहित सम्बन्ध
  choice: याहवे शान्ति है
  alternative: याहवे शान्ति देता है
  rationale: इब्रानी क्रियारहित वाक्य में केवल ‘याहवे’ और ‘शान्ति’ हैं। ‘है’ न्यूनतम व्याकरणिक पूर्ति है; ‘देता है’ जोड़ना अर्थ को अनावश्यक रूप से निश्चित कर देता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘वेदी’ तथा ‘शान्ति’ जैसे परिचित बाइबिलीय शब्द बनाए रखे गए हैं; वाक्य-संरचना साधारण पाठक के लिए स्वाभाविक है।
