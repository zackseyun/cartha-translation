    reason: lexical_alternative
  revision_rationale: The revision corrects the sole substantive lexical error by rendering the fleece as “ऊन की एक गदरी,” rather than a skin/hide. It also makes the agency conveyed by בְּיָדִי more transparent in idiomatic Hindi without losing the source’s hand imagery. The conditional structure, local contextual sense of “भूमि,” and existing lexical footnote are retained.
