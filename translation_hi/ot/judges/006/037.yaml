source:
  edition: WLC
  text: הִנֵּ֣ה אָנֹכִ֗י מַצִּ֛יג אֶת גִּזַּ֥ת הַ/צֶּ֖מֶר בַּ/גֹּ֑רֶן אִ֡ם טַל֩ יִהְיֶ֨ה עַֽל הַ/גִּזָּ֜ה לְ/בַדָּ֗/הּ וְ/עַל כָּל הָ/אָ֨רֶץ֙ חֹ֔רֶב וְ/יָדַעְתִּ֗י כִּֽי תוֹשִׁ֧יעַ בְּ/יָדִ֛/י אֶת יִשְׂרָאֵ֖ל כַּ/אֲשֶׁ֥ר דִּבַּֽרְתָּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/037.yaml
  text: Look[a], I am placing a fleece of wool on the threshing floor. If there is dew on the fleece alone, and dryness on all the ground, then I will know that you will save Israel by my hand, just as you have spoken.
translation:
  language: hi
  text: देख, मैं खलिहान में ऊन की एक गदरी रख रहा हूँ। यदि केवल उस गदरी पर ओस पड़े और सारी भूमि[a] सूखी रहे, तो मैं जान लूँगा कि तू मेरे हाथ के द्वारा इस्राएल को बचाएगा, जैसा तूने कहा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सारा देश” अथवा “सारी पृथ्वी”; इब्रानी शब्द स्थानीय धरती या अधिक व्यापक भूभाग के लिए प्रयुक्त हो सकता है। यहाँ सम्भवतः चिन्ह के आसपास की भूमि अभिप्रेत है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: देख
  rationale: यह शब्द ध्यान खींचकर गिदोन द्वारा प्रस्तावित चिन्ह को सामने रखता है। ‘देख’ आधुनिक, सीधा और प्रसंगानुकूल है।
- source_word: מַצִּיג
  choice: रख रहा हूँ
  rationale: אָנֹכִי के साथ वर्तमान कृदंत तत्काल या आरम्भ होने वाली क्रिया बताता है। ‘रख रहा हूँ’ स्वाभाविक हिन्दी में वस्तु को निश्चित स्थान पर रखने का भाव देता है।
- source_word: גִּזַּת הַצֶּמֶר
  choice: ऊन की कटी हुई खाल
  rationale: यह भेड़ से उतारे गए पूरे ऊनी आवरण अर्थात् fleece को दर्शाता है। यह प्रचलित और सामान्य पाठक के लिए समझने योग्य हिन्दी अभिव्यक्ति है।
- source_word: בַּגֹּרֶן
  choice: खलिहान में
  rationale: גֹּרֶן अनाज दाँवने या झाड़ने के तैयार स्थान को दर्शाता है; हिन्दी में इसका स्वाभाविक समतुल्य ‘खलिहान’ है।
- source_word: טַל יִהְיֶה
  choice: ओस पड़े
  rationale: इब्रानी में अस्तित्वसूचक अभिव्यक्ति है; हिन्दी में ओस के उपस्थित होने को ‘ओस पड़े’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: עַל הַגִּזָּה לְבַדָּהּ
  choice: केवल उस खाल पर
  rationale: לְבַדָּהּ का विशिष्टता-बोध ‘केवल’ से स्पष्ट रहता है।
- source_word: וְעַל כָּל הָאָרֶץ חֹרֶב
  choice: और सारी भूमि सूखी रहे
  rationale: חֹרֶב यहाँ सूखेपन को और הָאָרֶץ निकटवर्ती धरातल को दर्शाता है। हिन्दी में विशेषणात्मक वाक्य अधिक स्वाभाविक है।
- source_word: וְיָדַעְתִּי
  choice: तो मैं जान लूँगा
  rationale: शर्त पूरी होने के परिणाम को ‘तो’ स्पष्ट करता है; ‘जान लूँगा’ भावी निश्चित समझ को व्यक्त करता है।
- source_word: כִּי תוֹשִׁיעַ
  choice: कि तू ... बचाएगा
  rationale: יָשַׁע का हिफ़ील रूप बचाने या छुड़ाने का अर्थ देता है। ‘बचाएगा’ सीधा और प्रसंगानुकूल है।
- source_word: בְּיָדִי
  choice: मेरे हाथ से
  rationale: इब्रानी की साधन या माध्यम बताने वाली ‘हाथ’ की मूर्त उपमा को सुरक्षित रखा गया है।
- source_word: כַּאֲשֶׁר דִּבַּרְתָּ
  choice: जैसा तूने कहा है
  rationale: यह דִּבַּרְתָּ के सामान्य अर्थ ‘कहा/बोला’ को रखता है और ‘प्रतिज्ञा’ जैसा अधिक विशिष्ट धर्मवैचारिक अर्थ नहीं जोड़ता।
theological_decisions:
- issue: चिन्ह में הָאָרֶץ का दायरा
  choice: भूमि
  alternative: देश; पृथ्वी
  rationale: तात्कालिक प्रसंग में ऊन की खाल के साथ आसपास की धरती का विरोध किया गया है। ‘भूमि’ स्थानीय धरातल के अर्थ को संभव बनाती है, फिर भी इब्रानी शब्द के व्यापक अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथन रखा गया है। परमेश्वर के लिए प्रसंगानुकूल एकवचन ‘तू’ प्रयोग किया गया है। इब्रानी की ‘मेरे हाथ से’ उपमा सुरक्षित है, जबकि शर्त और परिणाम को स्वाभाविक हिन्दी में ‘यदि ... तो’ से स्पष्ट किया गया है।
