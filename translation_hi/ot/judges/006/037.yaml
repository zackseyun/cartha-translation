  to: देख, मैं खलिहान में ऊन की एक गदरी रख रहा हूँ। यदि केवल उस गदरी पर ओस पड़े और सारी भूमि[a] सूखी रहे, तो मैं जान लूँगा कि तू मेरे हाथ के द्वारा इस्राएल को बचाएगा, जैसा तूने कहा है।
