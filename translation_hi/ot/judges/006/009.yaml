id: JDG.6.9
reference: Judges 6:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וָ/אַצִּ֤ל אֶתְ/כֶם֙ מִ/יַּ֣ד מִצְרַ֔יִם וּ/מִ/יַּ֖ד כָּל לֹחֲצֵי/כֶ֑ם וָ/אֲגָרֵ֤שׁ אוֹתָ/ם֙ מִ/פְּנֵי/כֶ֔ם וָ/אֶתְּנָ֥/ה לָ/כֶ֖ם אֶת אַרְצָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/009.yaml
  text: And I delivered you from the hand of Egypt and from the hand of all your oppressors, and I drove them out from before you and gave you their land.
translation:
  language: hi
  text: और मैंने तुम्हें मिस्र के हाथ से और तुम्हारे सब सताने वालों के हाथ से छुड़ाया। मैंने उन्हें तुम्हारे सामने से खदेड़ दिया और उनका देश तुम्हें दे दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאַצִּל
  choice: मैंने...छुड़ाया
  rationale: नצל यहाँ किसी सत्ता या संकट से बचाने/छुड़ाने को व्यक्त करता है। ‘छुड़ाया’ आधुनिक हिन्दी में स्वाभाविक है और ‘हाथ से’ के साथ सुसंगत बैठता है।
- source_word: מִיַּד
  choice: के हाथ से
  rationale: यह सत्ता और नियंत्रण का ठोस इब्रानी मुहावरा है; हिन्दी में भी ‘के हाथ से छुड़ाया’ स्पष्ट और स्वाभाविक है।
- source_word: מִצְרַיִם
  choice: मिस्र
  rationale: स्थान और राष्ट्र के नाम का मानक हिन्दी रूप।
- source_word: כָּל לֹחֲצֵיכֶם
  choice: तुम्हारे सब सतानेवालों
  rationale: לֹחֲצִים दबाने, सताने या उत्पीड़ित करनेवालों को दर्शाता है। ‘सतानेवाले’ साधारण आधुनिक पाठक के लिए स्पष्ट है और व्यापक ‘शत्रु’ से अधिक सटीक है।
- source_word: וָאֲגָרֵשׁ
  choice: मैंने उन्हें...खदेड़ दिया
  rationale: גרש का अर्थ बलपूर्वक निकालना या दूर भगा देना है। ‘खदेड़ दिया’ भूमि से हटाए जाने की क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מִפְּנֵיכֶם
  choice: तुम्हारे सामने से
  rationale: शाब्दिक स्थानिक भाव ‘तुम्हारे मुख/उपस्थिति के सामने से’ है। ‘तुम्हारे सामने से’ इब्रानी बिंब को स्पष्ट हिन्दी में बनाए रखता है।
- source_word: וָאֶתְּנָה לָכֶם אֶת אַרְצָם
  choice: और उनका देश तुम्हें दे दिया
  rationale: यह נתן के प्रत्यक्ष और परोक्ष कर्म को अर्थानुसार सटीक तथा स्वाभाविक हिन्दी क्रम में प्रस्तुत करता है।
theological_decisions:
- issue: इस्राएल के छुटकारे और देश पाने में परमेश्वर की सक्रिय भूमिका
  choice: 'हर प्रमुख क्रिया में प्रथम पुरुष ‘मैंने’ को स्पष्ट रखा गया है: छुड़ाया, खदेड़ दिया और दे दिया।'
  alternative: क्रियाओं को निष्क्रिय रूप में या मानवीय साधनों पर अधिक बल देकर प्रस्तुत करना।
  rationale: इब्रानी की प्रथम-पुरुष क्रियाएँ वक्ता परमेश्वर की प्रत्यक्ष सक्रियता पर बल देती हैं। अनुवाद उस बल को बनाए रखता है, पर पाठ से परे कोई धार्मिक व्याख्या नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘के हाथ से’ मूल का सत्ता-संबंधी मुहावरा सुरक्षित रखता है; ‘खदेड़ दिया’ स्पष्ट और सजीव है। कोई पाद-टिप्पणी आवश्यक नहीं है।
