source:
  edition: WLC
  text: וְ/הָיָ֖ה אִם זָרַ֣ע יִשְׂרָאֵ֑ל וְ/עָלָ֨ה מִדְיָ֧ן וַֽ/עֲמָלֵ֛ק וּ/בְנֵי קֶ֖דֶם וְ/עָל֥וּ עָלָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/003.yaml
  text: And whenever Israel sowed[a], Midian and Amalek and the people of the East would come up against them.
translation:
  language: hi
  text: जब-जब इस्राएल बीज बोता था, तब मिद्यान, अमालेक और पूर्व के लोग उसके[a] विरुद्ध चढ़ आते थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल इब्रानी में एकवचन ‘उसके विरुद्ध’ है; यहाँ ‘इस्राएल’ को एक सामूहिक इकाई के रूप में देखा गया है।
    reason: मूल के सामूहिक एकवचन प्रयोग को स्पष्ट करना।
lexical_decisions:
- source_word: וְהָיָה אִם
  choice: जब-जब ... तब
  rationale: यह रचना किसी एक घटना के बजाय बार-बार घटने वाली परिस्थिति बताती है। हिंदी में ‘जब-जब ... तब’ उस पुनरावृत्त भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: זָרַע
  choice: बीज बोता था
  rationale: זרע का सीधा कृषि-संबंधी अर्थ ‘बीज बोना’ है; ‘था’ प्रसंग के अभ्यस्त भूतकाल को व्यक्त करता है।
- source_word: יִשְׂרָאֵל
  choice: इस्राएल
  rationale: यह लोगों/राष्ट्र का व्यक्तिवाचक नाम है; हिंदी में प्रचलित बाइबलीय रूप रखा गया है।
- source_word: וְעָלָה ... וְעָלוּ
  choice: चढ़ आते थे
  rationale: עלה सैन्य दल के किसी भूभाग की ओर बढ़ने के लिए प्रयुक्त है। ‘चढ़ आते थे’ दिशा, शत्रुतापूर्ण बढ़ाई और बार-बार होने की क्रिया—तीनों को संक्षेप में व्यक्त करता है।
- source_word: מִדְיָן
  choice: मिद्यान
  rationale: जातीय/भौगोलिक व्यक्तिवाचक नाम का प्रचलित हिंदी लिप्यंतरण।
- source_word: וַעֲמָלֵק
  choice: अमालेक
  rationale: मूल में जातिवाचक रूप के बजाय व्यक्तिवाचक नाम עֲמָלֵק है, इसलिए ‘अमालेकी’ के बजाय ‘अमालेक’ रखा गया है।
- source_word: וּבְנֵי קֶדֶם
  choice: पूर्व के लोग
  rationale: शाब्दिक अर्थ ‘पूर्व के पुत्र’ है, पर यह पूर्वी क्षेत्र के लोगों के लिए सामूहिक पद है। ‘पूर्व के लोग’ आधुनिक हिंदी में स्पष्ट और स्वाभाविक है।
- source_word: עָלָיו
  choice: उसके विरुद्ध
  rationale: प्रत्यय पुल्लिंग एकवचन है और सामूहिक ‘इस्राएल’ की ओर संकेत करता है। हिंदी में ‘उसके विरुद्ध’ स्रोत के एकवचन को बनाए रखते हुए शत्रुतापूर्ण भाव स्पष्ट करता है।
