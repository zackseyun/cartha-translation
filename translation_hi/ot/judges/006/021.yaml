id: JDG.6.21
reference: Judges 6:21
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֞ח מַלְאַ֣ךְ יְהוָ֗ה אֶת קְצֵ֤ה הַ/מִּשְׁעֶ֨נֶת֙ אֲשֶׁ֣ר בְּ/יָד֔/וֹ וַ/יִּגַּ֥ע בַּ/בָּשָׂ֖ר וּ/בַ/מַּצּ֑וֹת וַ/תַּ֨עַל הָ/אֵ֜שׁ מִן הַ/צּ֗וּר וַ/תֹּ֤אכַל אֶת הַ/בָּשָׂר֙ וְ/אֶת הַ/מַּצּ֔וֹת וּ/מַלְאַ֣ךְ יְהוָ֔ה הָלַ֖ךְ מֵ/עֵינָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/021.yaml
  text: Then the angel of Yahweh reached out the tip of the staff that was in his hand and touched the meat and the unleavened bread[a]. And fire went up from the rock and consumed the meat and the unleavened bread[c][b]. Then the angel of Yahweh went away from his sight.
translation:
  language: hi
  text: तब याहवे के दूत[a] ने अपने हाथ की लाठी का सिरा आगे बढ़ाकर मांस[b] और अख़मीरी रोटियों को छुआ। तब चट्टान से आग निकली और उसने मांस और अख़मीरी रोटियों को भस्म कर दिया। फिर याहवे का दूत उसकी आँखों के सामने से चला गया[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “याहवे का संदेशवाहक”; यहाँ प्रसंग एक अलौकिक दूत का है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में “देह” या “मांस”; यहाँ तैयार किए गए मांस का उल्लेख है।
    reason: lexical_alternative
  - marker: c
    text: इब्रानी में शाब्दिक रूप से “उसकी आँखों से चला गया,” अर्थात वह गिदोन को फिर दिखाई नहीं दिया।
    reason: idiom_clarification
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: याहवे का दूत
  rationale: מַלְאָךְ का अर्थ ‘दूत/संदेशवाहक’ हो सकता है और अलौकिक संदर्भ में ‘स्वर्गदूत’ भी। ‘दूत’ हिंदी में मूल पद की व्यापकता बनाए रखता है; יְהוָה को व्यक्तिगत नाम ‘याहवे’ के रूप में रखा गया है।
- source_word: קְצֵה הַמִּשְׁעֶנֶת
  choice: लाठी का सिरा
  rationale: קָצֶה किसी वस्तु के छोर या सिरे को और מִשְׁעֶנֶת सहारे की लाठी को दर्शाता है। यह हिंदी में स्वाभाविक और ठोस चित्र प्रस्तुत करता है।
- source_word: וַיִּשְׁלַח
  choice: आगे बढ़ाकर
  rationale: इस प्रसंग में क्रिया लाठी के सिरे को सामने की ओर बढ़ाने का बोध देती है, न कि उसे भेजने का।
- source_word: בָּשָׂר
  choice: मांस
  rationale: शब्द का मूल अर्थ ‘देह/मांस’ है; यहाँ वह तैयार किए गए भोजन अथवा भेंट के मांस को सूचित करता है।
- source_word: מַצּוֹת
  choice: अख़मीरी रोटियाँ
  rationale: बहुवचन מַצּוֹת खमीर के बिना बनी रोटियों को दर्शाता है। ‘अख़मीरी रोटियाँ’ आधुनिक हिंदी बाइबलीय प्रयोग में स्पष्ट है और बहुवचन भी बनाए रखता है।
- source_word: וַתַּעַל הָאֵשׁ מִן הַצּוּר
  choice: चट्टान से आग निकली
  rationale: עלה और מן मिलकर चट्टान से आग के ऊपर आने या निकलने का जीवंत चित्र देते हैं। ‘निकली’ सहज हिंदी में दिशा और उत्पत्ति दोनों व्यक्त करता है।
- source_word: וַתֹּאכַל
  choice: भस्म कर दिया
  rationale: आग के विषय में אָכַל का शाब्दिक भाव ‘खा जाना’ है; ‘भस्म कर दिया’ हिंदी में उसका स्वाभाविक और सटीक रूप है।
- source_word: הָלַךְ מֵעֵינָיו
  choice: उसकी आँखों के सामने से चला गया
  rationale: यह इब्रानी अभिव्यक्ति को निकटता से रखता है और केवल इतना बताता है कि दूत गिदोन को फिर दिखाई नहीं दिया; ‘अदृश्य हो गया’ जैसी आकस्मिकता नहीं जोड़ता।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का रूप
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और उसे किसी उपाधि से नहीं बदलता।
- issue: מַלְאַךְ की पहचान
  choice: दूत
  alternative: स्वर्गदूत / संदेशवाहक
  rationale: मूल शब्द की अर्थ-सीमा में सामान्य संदेशवाहक और स्वर्गीय दूत दोनों आते हैं। प्रसंग अलौकिक है, पर ‘दूत’ अनावश्यक रूप से उसकी प्रकृति को अधिक परिभाषित किए बिना हिंदी में दोनों संभावनाओं को पर्याप्त रूप से बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। घटनाओं की क्रमिकता दिखाने के लिए ‘तब’ और ‘फिर’ प्रयुक्त हैं। ‘अख़मीरी रोटियाँ’ परिचित बाइबलीय शब्दावली है; ‘भस्म कर दिया’ आग की क्रिया को स्वाभाविक हिंदी में व्यक्त करता है।
