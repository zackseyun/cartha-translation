source:
  edition: WLC
  text: וַ/יִּקַּ֨ח גִּדְע֜וֹן עֲשָׂרָ֤ה אֲנָשִׁים֙ מֵֽ/עֲבָדָ֔י/ו וַ/יַּ֕עַשׂ כַּ/אֲשֶׁ֛ר דִּבֶּ֥ר אֵלָ֖י/ו יְהוָ֑ה וַ/יְהִ֡י כַּ/אֲשֶׁ֣ר יָרֵא֩ אֶת בֵּ֨ית אָבִ֜י/ו וְ/אֶת אַנְשֵׁ֥י הָ/עִ֛יר מֵ/עֲשׂ֥וֹת יוֹמָ֖ם וַ/יַּ֥עַשׂ לָֽיְלָה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/027.yaml
  text: So Gideon took ten men from among his servants and did as Yahweh had spoken to him. But because he feared his father's household and the men of the city too much to do it by day[a], he did it at night.
translation:
  language: hi
  text: तब गिदोन ने अपने सेवकों में से दस पुरुषों को लिया और जैसा याहवे ने उससे कहा था, वैसा ही किया। परन्तु वह अपने पिता के घराने और नगर के पुरुषों से डरता था, इसलिए दिन में यह काम न कर सका[a] और उसने इसे रात में किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप में, “दिन में करने से”; आशय यह है कि भय ने उसे यह काम दिन में करने से रोका।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: लिया
  rationale: कथा के प्रसंग में לקח का सीधा और स्वाभाविक अर्थ ‘लेना’ है।
- source_word: עֲשָׂרָה אֲנָשִׁים
  choice: दस पुरुषों
  rationale: इब्रानी पाठ में स्पष्ट रूप से पुल्लिंग बहुवचन ‘पुरुष’ है, इसलिए इसे सामान्य ‘लोगों’ में नहीं बदला गया।
- source_word: מֵעֲבָדָיו
  choice: अपने सेवकों में से
  rationale: עֶבֶד सेवक या दास हो सकता है; यहाँ बंधुआ स्थिति पर बल नहीं है। ‘में से’ अंशसूचक מִן को व्यक्त करता है।
- source_word: וַיַּעַשׂ כַּאֲשֶׁר דִּבֶּר אֵלָיו יְהוָה
  choice: जैसा यहोवा ने उससे कहा था, वैसा ही किया
  rationale: यह आज्ञा और उसके पालन के बीच निकट संबंध को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: व्यक्तिगत ईश्वरीय नाम को उपाधि से बदलने के बजाय हिन्दी में प्रचलित नाम-रूप ‘यहोवा’ रखा गया है।
- source_word: בֵּית אָבִיו
  choice: अपने पिता के घराने
  rationale: ‘घराना’ यहाँ केवल भवन नहीं, बल्कि पिता के अधीन व्यापक पारिवारिक-सामाजिक इकाई को व्यक्त करता है।
- source_word: אַנְשֵׁי הָעִיר
  choice: नगर के पुरुषों
  rationale: यह स्रोत के पुरुषवाची पद और नगर-समुदाय के पुरुष सदस्यों के संदर्भ को सुरक्षित रखता है।
- source_word: מֵעֲשׂוֹת יוֹמָם
  choice: इसलिए दिन में यह काम न कर सका
  rationale: מִן सहित क्रियार्थक रूप भय के कारण दिन में कार्य न कर पाने या उससे रुक जाने का भाव देता है; मुख्य पाठ में इसे सहज हिन्दी में स्पष्ट किया गया है।
- source_word: וַיַּעַשׂ לָיְלָה
  choice: उसने इसे रात में किया
  rationale: यह दिन और रात के स्पष्ट विरोध को आधुनिक, स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में चतुरक्षरीय व्यक्तिगत नाम है। हिन्दी पाठकों के लिए व्यापक रूप से पहचाना जाने वाला ‘यहोवा’ नाम-रूप चुना गया, न कि ‘प्रभु’ जैसी उपाधि; ‘याहवे’ अधिक प्रत्यक्ष विद्वत् लिप्यंतरण है।
- issue: गिदोन के भय और आज्ञापालन का संबंध
  choice: भय के कारण उसने काम दिन में नहीं, रात में किया
  alternative: वह इतना डरता था कि दिन में यह काम न कर सका
  rationale: पाठ गिदोन के भय को छिपाता नहीं, पर यह भी बताता है कि उसने आज्ञा पूरी की। अनुवाद इस तनाव को बनाए रखता है और भय को पूर्ण अवज्ञा नहीं बनाता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज किंतु गरिमापूर्ण कथा-शैली रखी गई है। ‘घराना’ सामाजिक इकाई के लिए और ‘नगर के पुरुष’ स्रोत की लैंगिक विशिष्टता के लिए प्रयुक्त हैं। ‘परन्तु’ तथा ‘वैसा ही’ बाइबलीय गरिमा बनाए रखते हुए सामान्य पाठकों के लिए बोधगम्य हैं।
