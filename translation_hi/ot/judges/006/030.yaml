  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּ֨אמְר֜וּ אַנְשֵׁ֤י הָ/עִיר֙ אֶל יוֹאָ֔שׁ הוֹצֵ֥א אֶת בִּנְ/ךָ֖ וְ/יָמֹ֑ת כִּ֤י נָתַץ֙ אֶת מִזְבַּ֣ח הַ/בַּ֔עַל וְ/כִ֥י כָרַ֖ת הָ/אֲשֵׁרָ֥ה אֲשֶׁר עָלָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/030.yaml
  text: Then the men of the city said to Joash[a], “Bring out your son, that he may die, because he has torn down the altar of Baal and cut down the Asherah that was beside it.”
translation:
  language: hi
  text: तब नगर के पुरुषों ने योआश से कहा, “अपने पुत्र को बाहर ले आ, ताकि वह मर जाए, क्योंकि उसने बाल की वेदी ढा दी है और उसके पास की अशेरा[a] को काट डाला है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अशेरा-स्तंभ।” इब्रानी शब्द अशेरा से जुड़ी पूजाविषयक वस्तु के लिए भी प्रयुक्त हो सकता है; यहाँ प्रसंग देवी स्वयं की अपेक्षा उस वस्तु की ओर संकेत करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אַנְשֵׁי הָעִיר
  choice: नगर के पुरुषों
  rationale: शाब्दिक रूप से ‘नगर के पुरुष’; यह इब्रानी के पुल्लिंग रूप और सम्भवतः नगर के पुरुष नागरिकों के संदर्भ को बनाए रखता है।
- source_word: הוֹצֵא
  choice: बाहर ले आ
  rationale: हिफ़ील आज्ञार्थक का स्वाभाविक आधुनिक हिन्दी रूप, अर्थात किसी को बाहर आने के लिए लाना।
- source_word: וְיָמֹת
  choice: ताकि वह मर जाए
  rationale: संयोजक और इच्छार्थक क्रिया आज्ञा के अपेक्षित परिणाम को व्यक्त करते हैं; यह ‘मृत्युदंड देना’ जैसी अधिक स्पष्ट न्यायिक व्याख्या नहीं जोड़ता।
- source_word: נָתַץ
  choice: ढा दी है
  rationale: वेदी जैसी संरचना को गिराने या तोड़ डालने के लिए संक्षिप्त और स्वाभाविक हिन्दी।
- source_word: מִזְבַּח הַבַּעַל
  choice: बाल की वेदी
  rationale: इब्रानी संबंधसूचक रचना का स्पष्ट और सहज हिन्दी रूप।
- source_word: כָרַת
  choice: काट डाला है
  rationale: लकड़ी के पूजाविषयक चिह्न या वृक्ष-सदृश वस्तु को काट गिराने के संदर्भ में उपयुक्त।
- source_word: הָאֲשֵׁרָה
  choice: अशेरा
  rationale: इब्रानी पद देवी या उससे जुड़ी पूजाविषयक वस्तु का संकेत दे सकता है; यहाँ ‘काटना’ वस्तु की ओर संकेत करता है, पर लिप्यंतरण मूल की अस्पष्टता बचाता है।
- source_word: אֲשֶׁר עָלָיו
  choice: उसके पास की
  rationale: עַל यहाँ सम्भवतः वेदी के ऊपर होने के बजाय निकट स्थान या संबद्धता व्यक्त करता है; ‘पास की’ इस संभावित व्यवस्था को स्वाभाविक हिन्दी में बताता है।
theological_decisions:
- issue: इस्राएली धार्मिक विवाद के संदर्भ में אֲשֵׁרָה का अर्थ
  choice: अशेरा
  alternative: अशेरा-स्तंभ; देवी अशेरा
  rationale: क्रिया और प्रसंग किसी पूजाविषयक वस्तु की ओर संकेत करते हैं, फिर भी केवल ‘स्तंभ’ कहना उसकी बनावट को आवश्यकता से अधिक निश्चित करेगा और ‘देवी’ कहना संदर्भित वस्तु को देवी स्वयं मान लेगा। लिप्यंतरण तनाव बनाए रखता है और पादटिप्पणी सामान्य विकल्प स्पष्ट करती है।
- issue: וְיָמֹת का बल
  choice: ताकि वह मर जाए
  alternative: उसे मरने दो; उसे मार डाला जाए
  rationale: यह बाहर लाने की आज्ञा के बाद माँगा गया परिणाम व्यक्त करता है। चुना हुआ रूप मृत्यु की माँग को बनाए रखता है, पर मूल में निहित न होने वाली औपचारिक न्यायिक शब्दावली नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सहज कथात्मक शैली। प्रत्यक्ष कथन में एकवचन आज्ञा के अनुरूप ‘ले आ’ रखा गया है। ‘अशेरा’ का लिप्यंतरण मूल की वास्तविक अर्थगत अस्पष्टता को सुरक्षित रखता है।
