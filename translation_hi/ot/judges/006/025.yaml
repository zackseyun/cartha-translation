base_translation:
  language: en
  yaml_path: translation/ot/judges/006/025.yaml
  text: And it happened that night that Yahweh said to him[a], “Take your father’s bull and the second bull, seven years old, and tear down the altar of Baal that belongs to your father[b], and cut down the Asherah that is upon it.”
translation:
  language: hi
  text: उसी रात ऐसा हुआ कि याहवे ने उससे कहा, “अपने पिता का बैल और सात वर्ष का दूसरा बैल ले। फिर बाल की उस वेदी को, जो तेरे पिता की है, ढा दे और उस अशेरा[a] को काट डाल जो उस पर है[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अशेरा-खंभा” अथवा “पवित्र खंभा।” इब्रानी शब्द अशेरा से जुड़ी किसी पूजा-वस्तु को भी सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “जो उस पर है।” इसका अर्थ वेदी के ऊपर, उससे सटा हुआ या उसके साथ निकट रूप से जुड़ा हुआ हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַּלַּיְלָה הַהוּא
  choice: उसी रात ऐसा हुआ
  rationale: इब्रानी कथा-संक्रमण और समय-सूचक वाक्यांश दोनों को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: दिव्य नाम के चार इब्रानी व्यंजनों को किसी उपाधि से बदलने के बजाय प्रचलित लिप्यंतरण द्वारा प्रस्तुत करता है।
- source_word: קַח
  choice: ले
  rationale: प्रत्यक्ष आज्ञार्थक क्रिया का संक्षिप्त और स्वाभाविक अनुवाद।
- source_word: פַּר הַשּׁוֹר אֲשֶׁר לְאָבִיךָ
  choice: अपने पिता का बैल
  rationale: पिता से संबंधित बैल का अर्थ स्पष्ट करता है और कठिन इब्रानी संज्ञा-संयोजन को सहज हिन्दी में व्यक्त करता है।
- source_word: וּפַר הַשֵּׁנִי שֶׁבַע שָׁנִים
  choice: और सात वर्ष का दूसरा बैल
  rationale: וּ को समुच्चयबोधक मानते हुए दो बैलों का उल्लेख सुरक्षित रखता है और दूसरे बैल की आयु स्पष्ट करता है।
- source_word: וְהָרַסְתָּ
  choice: ढा दे
  rationale: वेदी को बलपूर्वक गिराने या नष्ट करने की आज्ञा के लिए स्वाभाविक हिन्दी अभिव्यक्ति।
- source_word: מִזְבַּח הַבַּעַל
  choice: बाल की वेदी
  rationale: इब्रानी संबंधवाचक रचना का सीधा, स्पष्ट अनुवाद।
- source_word: הָאֲשֵׁרָה
  choice: अशेरा
  rationale: यह पद देवी अशेरा से जुड़े वृक्ष, खंभे या पूजा-चिह्न को सूचित कर सकता है; लिप्यंतरण वस्तु की ठीक प्रकृति को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: אֲשֶׁר עָלָיו
  choice: उस पर खड़ी
  rationale: עַל का मूल स्थानिक भाव बनाए रखता है, जबकि हिन्दी में काटे जाने योग्य पूजा-वस्तु की स्थिति को स्वाभाविक ढंग से व्यक्त करता है; सटीक स्थानिक संबंध की अनिश्चितता पाद-टिप्पणी में रखी गई है।
- source_word: תִּכְרֹת
  choice: काट डाल
  rationale: लकड़ी की पूजा-वस्तु को काट गिराने की प्रबल आज्ञा को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: व्यक्तिगत दिव्य नाम को नाम के रूप में बनाए रखता है और उसे उपाधि में बदलने से बचता है।
- issue: הָאֲשֵׁרָה का अर्थ
  choice: अशेरा
  alternative: अशेरा-खंभा; पवित्र खंभा
  rationale: इब्रानी शब्द देवी, उससे जुड़े पूजा-चिह्न या लकड़ी की उपासना-वस्तु से संबंधित हो सकता है; लिप्यंतरण इस ऐतिहासिक और धार्मिक अस्पष्टता को सुरक्षित रखता है।
- issue: दो बैल या दूसरे बैल की विशेष पहचान
  choice: अपने पिता का बैल और सात वर्ष का दूसरा बैल
  alternative: अपने पिता का बैल, अर्थात सात वर्ष का दूसरा बैल
  rationale: इब्रानी וּ सामान्यतः ‘और’ है, इसलिए मुख्य पाठ में दो पशुओं का उल्लेख रखा गया है, यद्यपि संज्ञा-संयोजन कुछ कठिन है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक है। छोटे आज्ञार्थक रूपों—“ले,” “ढा दे,” और “काट डाल”—से मूल की प्रत्यक्षता बनी रहती है। “अशेरा” जैसे ऐतिहासिक पूजा-संबंधी शब्द को पाद-टिप्पणी सहित रखा गया है, ताकि पाठ सरल भी रहे और मूल की अनिश्चितता भी न मिटे।
