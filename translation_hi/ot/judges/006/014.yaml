language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יִּ֤פֶן אֵלָי/ו֙ יְהוָ֔ה וַ/יֹּ֗אמֶר לֵ֚ךְ בְּ/כֹחֲ/ךָ֣ זֶ֔ה וְ/הוֹשַׁעְתָּ֥ אֶת יִשְׂרָאֵ֖ל מִ/כַּ֣ף מִדְיָ֑ן הֲ/לֹ֖א שְׁלַחְתִּֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/014.yaml
  text: Then Yahweh turned to him and said[a], “Go in this strength of yours and save Israel from the hand of Midian[b]. Have I not sent you?”
translation:
  language: hi
  text: तब यहोवा उसकी ओर मुड़कर उससे कहा, “तू अपने इसी बल के साथ[a] जा और इस्राएल को मिद्यान के हाथ से छुड़ा[b]। क्या मैंने तुझे नहीं भेजा?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने इसी बल में।” इब्रानी पदबंध का अर्थ साधनात्मक या स्थानवाचक समझा जा सकता है; ‘इसी’ बलाघात देता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से “मिद्यान के हाथ से”; यह मिद्यान की शक्ति या नियंत्रण से छुटकारे का मुहावरा है।
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में परमेश्वर के वाचा-संबंधी व्यक्तिगत नाम का प्रचलित लिप्यंतरण; इसे पदवी से प्रतिस्थापित नहीं किया गया।
- source_word: וַיִּפֶן אֵלָיו
  choice: उसकी ओर मुड़ा
  rationale: פנה की दिशात्मक क्रिया और אֵלָיו दोनों को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: לֵךְ בְּכֹחֲךָ זֶה
  choice: तू अपने इसी बल के साथ जा
  rationale: आज्ञार्थक बल, בְּ का साधनात्मक अर्थ, और זֶה के बलाघात को व्यक्त करता है; ‘इसी’ इस विशिष्ट बल पर जोर देता है।
- source_word: וְהוֹשַׁעְתָּ
  choice: और ... छुड़ा
  rationale: पूर्ववर्ती आज्ञा के साथ जुड़ी आदेशात्मक निरंतरता के रूप में लिया गया; ישׁע का यहाँ स्वाभाविक हिन्दी अर्थ ‘छुड़ाना’ है।
- source_word: מִכַּף מִדְיָן
  choice: मिद्यान के हाथ से
  rationale: मूल इब्रानी बिंब को बनाए रखता है; यहाँ ‘हाथ’ सामर्थ्य अथवा नियंत्रण का मुहावरा है।
- source_word: הֲלֹא שְׁלַחְתִּיךָ
  choice: क्या मैंने ही तुझे नहीं भेजा?
  rationale: הֲלֹא के सकारात्मक उत्तर की अपेक्षा रखने वाले आलंकारिक प्रश्न को सुरक्षित रखता है; ‘ही’ वक्ता के अधिकार पर स्वाभाविक जोर देता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: नाम को ‘प्रभु’ जैसी पदवी से नहीं बदला गया। आधुनिक हिन्दी पाठकों के लिए ‘यहोवा’ अधिक पहचाना हुआ लिप्यंतरण है, जबकि मूल में विद्यमान व्यक्तिगत वाचा-नाम का स्वरूप बना रहता है।
- issue: गिदोन के ‘बल’ का आशय
  choice: अपने इसी बल के साथ
  alternative: अपने इसी बल में
  rationale: मूल בְּ दोनों प्रकार की छाया दे सकता है। मुख्य पाठ साधनात्मक अर्थ को स्वाभाविक हिन्दी में रखता है, पर बल का स्रोत या स्वरूप स्पष्ट करके पाठ की धार्मिक तनावशीलता को अनावश्यक रूप से नहीं सुलझाता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी। संबोधन में एकवचन ‘तू/तुझे’ मूल इब्रानी के एकवचन और प्रत्यक्ष ईश्वरीय आदेश को दर्शाता है। ‘इसी बल’ demonstrative emphasis को बनाए रखता है।
