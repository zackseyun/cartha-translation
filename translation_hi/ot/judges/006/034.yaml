  yaml_path: translation/ot/judges/006/034.yaml
  text: Then the Spirit of Yahweh clothed Gideon[a], and he blew the trumpet[c][b], and Abiezer was summoned after him.
translation:
  language: hi
  text: तब यहोवा की आत्मा ने गिदोन को मानो वस्त्र की तरह पहन लिया[a]। उसने शोफार[b] फूँका, और अबीएजेर का कुल उसके पीछे चलने के लिए बुलाया गया[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यहोवा की आत्मा गिदोन पर उतरी।” शाब्दिक रूप से, “यहोवा की आत्मा ने गिदोन को पहन लिया।”
    reason: lexical_alternative
  - marker: b
    text: 'इब्रानी: “शोफार,” संकेत देने के लिए फूँका जाने वाला सींग।'
    reason: cultural_note
  - marker: c
    text: या, “अबीएजेर का कुल उसके पीछे इकट्ठा हो गया,” या, “उसके पीछे चल पड़ा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרוּחַ יְהוָה
  choice: यहोवा के आत्मा
  rationale: रूआख यहाँ हवा या साँस नहीं, बल्कि गिदोन को सामर्थ्य देने वाले परमेश्वर के आत्मा को सूचित करता है। वाचा के व्यक्तिगत नाम יהוה को ‘यहोवा’ से व्यक्त किया गया है।
- source_word: לָבְשָׁה אֶת־גִּדְעוֹן
  choice: गिदोन को वस्त्र के समान ओढ़ लिया
  rationale: लावश का मूल बिंब ‘पहनना/ओढ़ना’ है; व्याकरण में आत्मा कर्ता और गिदोन कर्म है। ‘वस्त्र के समान’ जोड़ने से असामान्य किंतु महत्त्वपूर्ण इब्रानी रूपक सामान्य हिंदी में स्पष्ट रहता है।
- source_word: וַיִּתְקַע בַּשּׁוֹפָר
  choice: उसने नरसिंगा फूँका
  rationale: शोफार संकेत देने के लिए फूँका जाने वाला पशु-सींग था। ‘नरसिंगा’ हिंदी पाठक के लिए सुलभ है और आधुनिक धातु की तुरही की अपेक्षा मूल सांस्कृतिक वस्तु के निकट है।
- source_word: וַיִּזָּעֵק
  choice: बुलाया गया
  rationale: निफ़अल रूप यहाँ निष्क्रिय अर्थ रखता है—गिदोन के संकेत पर कुल को एकत्र होने के लिए बुलाया गया।
- source_word: אֲבִיעֶזֶר
  choice: अबीएजेर का कुल
  rationale: संदर्भ में व्यक्ति के नाम से उसके कुल के लोगों का बोध होता है; हिंदी में ‘का कुल’ इसे स्वाभाविक और स्पष्ट करता है।
- source_word: אַחֲרָיו
  choice: उसके पीछे चलने के लिए
  rationale: शाब्दिक दिशा ‘उसके पीछे’ के साथ समर्थन और नेतृत्व का अनुसरण करने का भाव भी सुरक्षित रहता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: प्रभु / याहवे
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम है; ‘यहोवा’ आधुनिक हिंदी बाइबल-पाठकों में परिचित नामरूप है और इसे सामान्य उपाधि ‘प्रभु’ में नहीं बदलता।
- issue: आत्मा और गिदोन के संबंध का रूपक
  choice: आत्मा ने गिदोन को वस्त्र के समान ओढ़ लिया
  alternative: आत्मा गिदोन पर उतरा / गिदोन ने आत्मा को ओढ़ लिया
  rationale: इब्रानी व्याकरण में आत्मा कर्ता है और गिदोन कर्म; इसलिए उलटा अर्थ नहीं अपनाया गया। रूपक को बनाए रखने से आत्मिक सामर्थ्य दिए जाने की असामान्य और सशक्त छवि सुरक्षित रहती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक रखी गई है। मुख्य पाठ में मूल इब्रानी का वस्त्र-वाला रूपक सुरक्षित है, जबकि उसकी अधिक परिचित व्याख्या पादटिप्पणी में दी गई है। ‘अबीएजेर’ को प्रसंगानुसार कुलनाम के रूप में स्पष्ट किया गया है।
