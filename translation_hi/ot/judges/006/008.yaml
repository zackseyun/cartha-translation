reference: Judges 6:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֧ח יְהוָ֛ה אִ֥ישׁ נָבִ֖יא אֶל בְּנֵ֣י יִשְׂרָאֵ֑ל וַ/יֹּ֨אמֶר לָ/הֶ֜ם כֹּה אָמַ֥ר יְהוָ֣ה אֱלֹהֵ֣י יִשְׂרָאֵ֗ל אָנֹכִ֞י הֶעֱלֵ֤יתִי אֶתְ/כֶם֙ מִ/מִּצְרַ֔יִם וָ/אֹצִ֥יא אֶתְ/כֶ֖ם מִ/בֵּ֥ית עֲבָדִֽים־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/008.yaml
  text: 'Then Yahweh sent a man[a], a prophet, to the sons of Israel, and he said to them, “Thus says Yahweh, the God of Israel: I brought you up from Egypt[b], and I brought you out from the house of slavery.”'
translation:
  language: hi
  text: 'तब यहोवा ने इस्राएलियों के पास एक पुरुष, एक नबी, भेजा। उसने उनसे कहा, “इस्राएल का परमेश्वर यहोवा यों कहता है: मैं ही तुम्हें मिस्र से ऊपर ले आया और दासों के घर से बाहर निकाल लाया।”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: तब ... भेजा
  rationale: वाव-क्रमागत कथा को आगे बढ़ाता है; आधुनिक हिन्दी में ‘तब’ घटनाक्रम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में प्रचलित लिप्यंतरण द्वारा परमेश्वर के व्यक्तिगत वाचा-नाम को शीर्षक से प्रतिस्थापित किए बिना रखा गया है।
- source_word: אִישׁ נָבִיא
  choice: एक नबी
  rationale: यहाँ אִישׁ के साथ נָבִיא व्यक्ति की पहचान बताता है। ‘एक नबी’ हिन्दी में स्वाभाविक है और आशय पूरा व्यक्त करता है; ‘एक पुरुष, एक नबी’ अनावश्यक रूप से अटपटा होता।
- source_word: אֶל בְּנֵי יִשְׂרָאֵל
  choice: इस्राएलियों के पास
  rationale: परंपरागत सामूहिक पदबंध का स्वाभाविक आधुनिक हिन्दी रूप; इसमें पूरी जाति सम्मिलित है।
- source_word: כֹּה אָמַר
  choice: यों कहता है
  rationale: भविष्यद्वक्ता के संदेश का मानक सूत्र वर्तमानकालीन प्रत्यक्षता के साथ सुरक्षित है।
- source_word: אָנֹכִי
  choice: मैं ही
  rationale: स्वतंत्र सर्वनाम אָנֹכִי के बलाघात को हिन्दी के ‘ही’ से स्वाभाविक रूप में व्यक्त किया गया है।
- source_word: הֶעֱלֵיתִי
  choice: ऊपर ले आया
  rationale: हिफ़ील क्रिया और निर्गमन के पारंपरिक ‘ऊपर लाने’ वाले स्थानिक बिंब को बनाए रखता है।
- source_word: וָאֹצִיא
  choice: बाहर निकाल लाया
  rationale: हिफ़ील का कारक भाव तथा छुटकारे की गति स्पष्ट करता है।
- source_word: מִבֵּית עֲבָדִים
  choice: दासों के घर से
  rationale: इब्रानी बहुवचन עֲבָדִים और ठोस ‘घर’ वाले रूपक को निकटता से सुरक्षित रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ के व्यक्तिगत वाचा-नाम को ‘प्रभु’ जैसे पद से नहीं बदला गया; ‘यहोवा’ आधुनिक हिन्दी बाइबलीय प्रयोग में व्यापक रूप से पहचाना जाता है।
- issue: בְּנֵי יִשְׂרָאֵל का सामूहिक अभिधान
  choice: इस्राएली
  alternative: इस्राएल के पुत्र
  rationale: यहाँ पदबंध पूरी वाचा-प्रजा का रूढ़ सामूहिक नाम है; ‘इस्राएली’ आधुनिक हिन्दी में स्पष्ट और समावेशी जातिनाम है, जबकि शाब्दिक विकल्प प्रसंग में केवल पुरुषों का भ्रम दे सकता है।
- issue: מִבֵּית עֲבָדִים का रूपक
  choice: दासों के घर से
  alternative: दासत्व के घर से
  rationale: मूल के ठोस बहुवचन ‘दासों’ को बनाए रखा गया है, यद्यपि वैकल्पिक अमूर्त हिन्दी अभिव्यक्ति अधिक सहज हो सकती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। भविष्यद्वाणी-सूत्र ‘यों कहता है’ और निर्गमन-संबंधी स्थानिक बिंब सुरक्षित हैं; अत्यधिक शाब्दिक किंतु अस्वाभाविक ‘एक पुरुष, एक नबी’ से बचा गया है।
