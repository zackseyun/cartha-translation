reference: Judges 6:26
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וּ/בָנִ֨יתָ מִזְבֵּ֜חַ לַ/יהוָ֣ה אֱלֹהֶ֗י/ךָ עַ֣ל רֹ֧אשׁ הַ/מָּע֛וֹז הַ/זֶּ֖ה בַּ/מַּֽעֲרָכָ֑ה וְ/לָֽקַחְתָּ֙ אֶת הַ/פָּ֣ר הַ/שֵּׁנִ֔י וְ/הַעֲלִ֣יתָ עוֹלָ֔ה בַּ/עֲצֵ֥י הָ/אֲשֵׁרָ֖ה אֲשֶׁ֥ר תִּכְרֹֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/026.yaml
  text: Then build an altar to Yahweh your God on the top of this stronghold[a], in orderly arrangement, and take the second bull and offer it up as a burnt offering with the wood of the Asherah that you cut down.
translation:
  language: hi
  text: फिर इस गढ़ की चोटी पर ठीक क्रम से अपने परमेश्वर याहवे के लिए एक वेदी बनाओ। दूसरा बैल लो और जिस अशेरा[a] को तुम काट डालोगे, उसकी लकड़ी से उस बैल को होमबलि के रूप में चढ़ाओ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अशेरा-खंभा।’ इब्रानी शब्द अशेरा से जुड़ी लकड़ी की किसी उपासना-वस्तु को सूचित कर सकता है।
    reason: אֲשֵׁרָה के सटीक भौतिक स्वरूप के विषय में शब्दार्थगत अनिश्चितता।
lexical_decisions:
- source_word: וּבָנִיתָ
  choice: फिर ... बनाओ
  rationale: संयोजक वाव के साथ पूर्ण क्रिया यहाँ क्रमिक निर्देश व्यक्त करती है; ‘फिर’ और आज्ञार्थक ‘बनाओ’ आधुनिक हिन्दी में इस क्रम को स्वाभाविक रूप से प्रकट करते हैं।
- source_word: מִזְבֵּחַ
  choice: एक वेदी
  rationale: बलि चढ़ाने की संरचना के लिए प्रचलित और सटीक हिन्दी शब्द।
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: अपने परमेश्वर याहवे के लिए
  rationale: लकार समर्पण का भाव देता है; ‘अपने परमेश्वर’ वाचा-संबंधी संबोधन को बनाए रखता है और יהוה को व्यक्तिगत नाम ‘याहवे’ के रूप में प्रस्तुत किया गया है।
- source_word: עַל רֹאשׁ הַמָּעוֹז הַזֶּה
  choice: इस गढ़ की चोटी पर
  rationale: רֹאשׁ का अर्थ ‘चोटी/ऊपरी भाग’ और מָעוֹז का अर्थ सुरक्षित या दृढ़ स्थान है; ‘गढ़’ संक्षिप्त और स्वाभाविक हिन्दी है।
- source_word: בַּמַּעֲרָכָה
  choice: ठीक क्रम से
  rationale: यह संज्ञा व्यवस्था या सुव्यवस्थित विन्यास का बोध कराती है। यह अनुवाद क्रमबद्ध तैयारी का भाव रखता है, पर पत्थरों या लकड़ियों जैसी किसी विशेष वस्तु को अनावश्यक रूप से नहीं जोड़ता।
- source_word: וְלָקַחְתָּ אֶת הַפָּר הַשֵּׁנִי
  choice: दूसरा बैल लो
  rationale: פַּר के सामान्य अर्थ ‘बैल’ और संदर्भ में पहले पशु से भेद करने वाले ‘दूसरा’ को सीधे रखा गया है।
- source_word: וְהַעֲלִיתָ עוֹלָה
  choice: उस बैल को होमबलि के रूप में चढ़ाओ
  rationale: עלה के हिफ़ील रूप और עֹלָה का मेल बलिदानी मुहावरा है; स्पष्ट सर्वनाम जोड़ने से हिन्दी में कर्म असंदिग्ध रहता है।
- source_word: בַּעֲצֵי הָאֲשֵׁרָה אֲשֶׁר תִּכְרֹת
  choice: जिस अशेरा को तुम काट डालोगे, उसकी लकड़ी से
  rationale: अशेरा को काटे जाने वाले लकड़ी के उपासना-विषय के रूप में रखते हुए उसकी निश्चित भौतिक आकृति नहीं बताई गई; सम्बन्धवाचक उपवाक्य मूल के भाव और भविष्यसूचक निर्देश को बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का रूप
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार-अक्षरी व्यक्तिगत नाम सीधे आया है। ‘याहवे’ उसे उपाधि में बदलने के बजाय नाम के रूप में बनाए रखता है।
- issue: אֲשֵׁרָה का अर्थ
  choice: अशेरा
  alternative: अशेरा-खंभा; अशेरा की लकड़ी की प्रतिमा
  rationale: यह शब्द अशेरा से जुड़े किसी काष्ठ-पूजा-विषय का संकेत कर सकता है, पर उसकी ठीक आकृति विवादित है। मुख्य पाठ में नाम को अक्षरांतरित करना उस अनिश्चितता को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सम्मानपूर्ण किन्तु सहज शैली अपनाई गई है। एक पुरुष को दिए गए इब्रानी निर्देशों को स्वाभाविक ‘तुम’ वाले आज्ञार्थक रूप में प्रस्तुत किया गया है। वाक्य-विन्यास को दो वाक्यों में बाँटने से क्रम स्पष्ट रहता है और मूल की सभी प्रमुख सूचनाएँ सुरक्षित रहती हैं।
