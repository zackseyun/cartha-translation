source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר גִּדְעוֹן֙ אֶל הָ֣/אֱלֹהִ֔ים אַל יִ֤חַר אַפְּ/ךָ֙ בִּ֔/י וַ/אֲדַבְּרָ֖ה אַ֣ךְ הַ/פָּ֑עַם אֲנַסֶּ֤ה נָּא רַק הַ/פַּ֨עַם֙ בַּ/גִּזָּ֔ה יְהִי נָ֨א חֹ֤רֶב אֶל הַ/גִּזָּה֙ לְ/בַדָּ֔/הּ וְ/עַל כָּל הָ/אָ֖רֶץ יִֽהְיֶה טָּֽל־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/039.yaml
  text: 'Then Gideon said to God[a], “Do not let your anger burn against me, and let me speak just this once. Please let me test just this once with the fleece: let there be dryness on the fleece alone[c][b], and on all the ground let there be dew.”'
translation:
  language: hi
  text: 'तब गिदोन ने परमेश्वर से कहा, “तेरा क्रोध मुझ पर न भड़के; मुझे बस इस बार बोलने दे। कृपा करके मैं ऊन से केवल इस बार परख लूँ[a]: केवल ऊन ही सूखी रहे, और सारी भूमि पर ओस हो[b]।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “कृपा करके मैं ऊन के द्वारा केवल इस बार जाँच कर लूँ।”
    reason: נסה और בַּגִּזָּה के सम्भव स्वाभाविक हिन्दी रूपों को दर्शाने के लिए।
  - marker: b
    text: “भूमि” से यहाँ ऊन के आसपास की ज़मीन का आशय है; इसका अनुवाद “धरती” या “ज़मीन” भी हो सकता है।
    reason: הָאָרֶץ की अर्थ-सीमा और स्थानीय प्रसंग स्पष्ट करने के लिए।
lexical_decisions:
- source_word: אַל יִחַר אַפְּךָ בִּי
  choice: तेरा क्रोध मुझ पर न भड़के
  rationale: यह हिब्रू के ‘क्रोध जलने’ वाले मुहावरे और उसकी तीव्रता को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: וַאֲדַבְּרָה אַךְ הַפָּעַם
  choice: मुझे बस इस बार और बोलने दे
  rationale: कोहोर्टेटिव विनम्र अनुमति की याचना व्यक्त करता है; ‘इस बार और’ प्रसंग में अंतिम सीमित निवेदन का भाव देता है।
- source_word: אֲנַסֶּה נָּא רַק הַפַּעַם בַּגִּזָּה
  choice: कृपा करके मैं ऊन के साथ केवल एक बार और परख लूँ
  rationale: נסה के ‘परखना/जाँचना’ अर्थ को बनाए रखते हुए נָא की विनम्रता तथा दोहराए गए सीमित आग्रह को व्यक्त किया गया है। ‘ऊन’ यहाँ काती जाने वाली भेड़ की उतारी हुई ऊन के अर्थ में है।
- source_word: יְהִי נָא חֹרֶב אֶל הַגִּזָּה לְבַדָּהּ
  choice: केवल ऊन ही सूखी रहे
  rationale: शाब्दिक ‘ऊन पर ही सूखापन हो’ की अपेक्षा यह हिन्दी में अधिक स्वाभाविक है और सूखेपन के केवल ऊन तक सीमित रहने का अर्थ सुरक्षित रखता है।
- source_word: וְעַל כָּל הָאָרֶץ יִהְיֶה טָּל
  choice: और सारी भूमि पर ओस पड़े
  rationale: इस प्रसंग में אֶרֶץ विश्व नहीं, ऊन के आसपास की भूमि को सूचित करता है; ‘ओस पड़े’ मानक हिन्दी प्रयोग है।
- source_word: הָאֱלֹהִים
  choice: परमेश्वर
  rationale: कथा में इस्राएल के परमेश्वर के लिए प्रयुक्त निश्चित संज्ञा का स्वाभाविक और प्रतिष्ठित हिन्दी रूप।
theological_decisions:
- issue: गिदोन द्वारा परमेश्वर को फिर परखने का स्वर
  choice: एक विनम्र किंतु स्पष्ट रूप से ‘परखने’ वाला अनुरोध
  alternative: इसे केवल एक निर्दोष पुष्टि की प्रार्थना कहना, या दुस्साहसी परीक्षा के रूप में अधिक नकारात्मक बनाना
  rationale: हिब्रू में गिदोन क्रोध न करने की विनती करता है और फिर एक बार परखने की अनुमति माँगता है। अनुवाद पाठ में निहित संकोच और तनाव दोनों रखता है, पर नैतिक निर्णय नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज कथात्मक शैली रखी गई है। परमेश्वर को प्रत्यक्ष संबोधन में एकवचन ‘तेरा/दे’ चुना गया है, जो हिन्दी बाइबलीय शैली में निकट और सीधा संबोधन है। ‘ऊन का गट्ठा’ जैसी व्याख्यात्मक वृद्धि से बचते हुए संक्षिप्त ‘ऊन’ रखा गया है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
