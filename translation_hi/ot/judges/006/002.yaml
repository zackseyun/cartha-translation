source:
  edition: WLC
  text: וַ/תָּ֥עָז יַד מִדְיָ֖ן עַל יִשְׂרָאֵ֑ל מִ/פְּנֵ֨י מִדְיָ֜ן עָשֽׂוּ לָ/הֶ֣ם בְּנֵ֣י יִשְׂרָאֵ֗ל אֶת הַ/מִּנְהָרוֹת֙ אֲשֶׁ֣ר בֶּֽ/הָרִ֔ים וְ/אֶת הַ/מְּעָר֖וֹת וְ/אֶת הַ/מְּצָדֽוֹת־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/002.yaml
  text: And the hand of Midian prevailed against Israel[a]. Because of Midian, the sons of Israel made for themselves the dens that are in the mountains, and the caves[b], and the strongholds.
translation:
  language: hi
  text: मिद्यान का हाथ इस्राएल पर प्रबल हो गया। मिद्यान के कारण इस्राएलियों[a] ने अपने लिए पहाड़ों में मांदें[b], गुफाएँ और गढ़ बना लिए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘इस्राएल के पुत्रों’।
    reason: lexical_alternative
  - marker: b
    text: यहाँ प्रयुक्त इब्रानी शब्द दुर्लभ है; इसका अर्थ ‘छिपने के स्थान’ या ‘सुरंगें’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּעָז
  choice: प्रबल हो गया
  rationale: क्रिया मिद्यान की बढ़ी हुई शक्ति और इस्राएल पर उसके प्रभावी प्रभुत्व को व्यक्त करती है; ‘प्रबल हो गया’ स्रोत के बलवती होने के भाव को स्वाभाविक हिन्दी में रखता है।
- source_word: יַד מִדְיָן
  choice: मिद्यान का हाथ
  rationale: ‘हाथ’ शक्ति और नियंत्रण का इब्रानी रूपक है। इसे बनाए रखने से स्रोत की सजीव छवि सुरक्षित रहती है और हिन्दी में अर्थ समझ में आता है।
- source_word: עַל יִשְׂרָאֵל
  choice: इस्राएल पर
  rationale: यहाँ עַל प्रभुत्व और दबाव का संबंध बताता है; ‘पर’ हिन्दी में ‘हाथ प्रबल होने’ के साथ स्वाभाविक है।
- source_word: מִפְּנֵי מִדְיָן
  choice: मिद्यान के कारण
  rationale: वाक्यांश मिद्यान की उपस्थिति और खतरे के कारण इस्राएलियों की प्रतिक्रिया बताता है; ‘के कारण’ इसका स्पष्ट और स्वाभाविक रूप है।
- source_word: עָשׂוּ לָהֶם
  choice: अपने लिए … बना लिए
  rationale: क्रिया और हितसूचक सर्वनाम दोनों को व्यक्त करता है और बताता है कि ये स्थान उन्होंने अपने बचाव के लिए तैयार किए।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएली
  rationale: शाब्दिक रूप ‘इस्राएल के पुत्र’ है, पर यहाँ यह पूरे जातीय समुदाय का सामान्य नाम है। ‘इस्राएली’ आधुनिक हिन्दी में अधिक स्वाभाविक है; शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: הַמִּנְהָרוֹת אֲשֶׁר בֶּהָרִים
  choice: पहाड़ों में मांदें
  rationale: दुर्लभ संज्ञा पहाड़ों के भीतर या उनमें बने आश्रय-स्थानों की ओर संकेत करती है। ‘मांदें’ पारंपरिक अर्थ को संक्षेप में रखता है, जबकि इसकी अनिश्चितता पादटिप्पणी में सुरक्षित है।
- source_word: הַמְּעָרוֹת
  choice: गुफाएँ
  rationale: यह सामान्य और सटीक हिन्दी पर्याय है।
- source_word: הַמְּצָדוֹת
  choice: गढ़
  rationale: यह सुरक्षित, रक्षात्मक और संभवतः किलेबंद स्थानों को दर्शाता है; ‘गढ़’ साधारण पाठक के लिए संक्षिप्त और स्पष्ट है।
