base_translation:
  language: en
  yaml_path: translation/ot/judges/006/018.yaml
  text: Please do not depart from here until I come to you and bring out my offering and set it before you." And he said[a], "I will stay until you return.
translation:
  language: hi
  text: “कृपया यहाँ से तब तक न जाइए, जब तक मैं आपके पास न आऊँ और अपनी भेंट[a] बाहर लाकर आपके सामने न रखूँ।” उसने कहा, “जब तक आप लौट न आएँ, मैं यहीं रहूँगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उपहार” अथवा “नजराना”; इब्रानी शब्द किसी को दी गई भेंट के लिए व्यापक रूप से प्रयुक्त हो सकता है और कुछ प्रसंगों में धार्मिक चढ़ावे को भी दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל נָא תָמֻשׁ מִזֶּה
  choice: कृपया यहाँ से तब तक न जाइए
  rationale: מוש का अर्थ इस संदर्भ में किसी स्थान से हटना या चले जाना है। विनम्र निवेदन נָא को ‘कृपया’ से व्यक्त किया गया है; सम्मानसूचक रूप संबोधन के स्वाभाविक भाव को दर्शाता है।
- source_word: עַד בֹּאִי אֵלֶיךָ
  choice: जब तक मैं आपके पास न आऊँ
  rationale: इनफिनिटिव रचना को स्वाभाविक हिन्दी की कालवाचक उपवाक्य-रचना में बदला गया है। ‘आऊँ’ मूल के בוא को सीधे व्यक्त करता है और अनावश्यक रूप से ‘लौटूँ’ नहीं जोड़ता।
- source_word: וְהוֹצֵאתִי
  choice: और ... बाहर लाकर
  rationale: יצא के हिफ़ील रूप का अर्थ किसी वस्तु को भीतर से बाहर लाना है। ‘बाहर लाकर’ आगे के ‘रखूँ’ से स्वाभाविक रूप से जुड़ता है।
- source_word: מִנְחָתִי
  choice: अपनी भेंट
  rationale: מִנְחָה उपहार, नजराना अथवा धार्मिक भेंट का संकेत दे सकता है। ‘भेंट’ इस व्यापकता और संभावित उपासना-संबंधी अर्थ दोनों को सुरक्षित रखता है, जबकि ‘अन्नबलि’ यहाँ अत्यधिक विशिष्ट होता।
- source_word: וְהִנַּחְתִּי לְפָנֶיךָ
  choice: आपके सामने न रखूँ
  rationale: यह वाक्यांश किसी वस्तु को दूसरे व्यक्ति की उपस्थिति में रखने को व्यक्त करता है। ‘सामने रखूँ’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: אָנֹכִי אֵשֵׁב
  choice: मैं यहीं रहूँगा
  rationale: ישב का मूल अर्थ ‘बैठना’ है, पर यहाँ आशय स्थान पर ठहरे रहने से है। ‘यहीं रहूँगा’ प्रसंगगत अर्थ को स्पष्ट करता है।
- source_word: עַד שׁוּבֶךָ
  choice: जब तक तुम लौट न आओ
  rationale: इनफिनिटिव रचना को हिन्दी के स्वाभाविक कालवाचक उपवाक्य के रूप में प्रस्तुत किया गया है। שׁוב का लौटने का भाव स्पष्ट रखा गया है।
theological_decisions:
- issue: गिदोन द्वारा प्रस्तुत מִנְחָה का अर्थ
  choice: भेंट
  alternative: उपहार / नजराना / अन्नबलि
  rationale: इस शब्द का अर्थ सामान्यतः प्रस्तुत किया गया उपहार या नजराना हो सकता है और धार्मिक संदर्भ में भेंट भी। कथा में आगे इसके धार्मिक अर्थ उभरते हैं, इसलिए ‘भेंट’ उस अनिश्चितता और धार्मिक अनुगूँज को बनाए रखता है, पर इसे विशेष रूप से ‘अन्नबलि’ घोषित नहीं करता।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी अपनाई गई है। गिदोन के निवेदन में सम्मानसूचक ‘आप’ और उत्तर में सामान्य ‘तुम’ प्रयुक्त है, जिससे संवाद स्वाभाविक रहता है और अनावश्यक पुरातनता से बचा जाता है।
