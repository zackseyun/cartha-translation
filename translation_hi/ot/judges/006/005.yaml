  register: आधुनिक मानक हिंदी में सहज किंतु गरिमापूर्ण शैली रखी गई है। मूल के अभ्यस्त भूतकाल, तंबुओं की सजीव लक्षणा, टिड्डियों की उपमा और अनगिनत ऊँटों पर दिए गए बल को सुरक्षित रखा गया है। सभी पादटिप्पणी-चिह्न संबंधित पदों के तुरंत बाद लगाए गए हैं।
