base_translation:
  language: en
  yaml_path: translation/ot/judges/006/005.yaml
  text: For they and their livestock would come up[a], and their tents would come like locusts in multitude; both they and their camels were without number[c][b], and they came into the land to destroy it.
translation:
  language: hi
  text: क्योंकि वे और उनके पशु चढ़ आते थे, और उनके तंबू टिड्डियों की बहुतायत के समान आते थे[b][a]; वे और उनके ऊँट अनगिनत थे, और वे उसे नष्ट करने के लिए उस देश में आते थे[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “टिड्डियों के समान अनगिनत” अथवा “टिड्डियों के झुंडों जैसे।”
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक रूप से “उनके तंबू आते थे”; यहाँ “तंबू” आक्रमणकारियों के पूरे पड़ावों को दर्शाते हैं।
    reason: cultural_note
  - marker: c
    text: या “उसे उजाड़ने के लिए।”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन में इस्राएल की दुर्दशा का कारण बताता है; इसलिए कारणसूचक संबंध स्पष्ट रखा गया है।
- source_word: הֵם וּמִקְנֵיהֶם יַעֲלוּ
  choice: वे और उनके पशु चढ़ आते थे
  rationale: भूतकाल में बार-बार होने वाली कार्रवाई को ‘आते थे’ से व्यक्त किया गया है; מִקְנֶה के व्यापक अर्थ के लिए ‘पशु’ चुना गया है।
- source_word: וְאָהֳלֵיהֶם יָבֹאוּ
  choice: और उनके तंबू भी आ जाते थे
  rationale: मूल की सजीव लक्षणा को बनाए रखा गया है, जिसमें आक्रमणकारियों के चलते-फिरते पड़ाव को उनके ‘तंबुओं’ के आने के रूप में कहा गया है।
- source_word: כְדֵי אַרְבֶּה לָרֹב
  choice: वे इतनी बड़ी संख्या में आते थे कि टिड्डियों के दल जैसे लगते थे
  rationale: यह आक्रमणकारियों की अपार संख्या की तुलना टिड्डियों से करता है; हिंदी में तुलना और बहुतायत दोनों स्वाभाविक ढंग से व्यक्त किए गए हैं।
- source_word: וְלָהֶם וְלִגְמַלֵּיהֶם אֵין מִסְפָּר
  choice: उनका और उनके ऊँटों का कोई हिसाब न था
  rationale: ‘कोई हिसाब न था’ इब्रानी के ‘कोई संख्या नहीं’ मुहावरे का स्वाभाविक हिंदी रूप है और मनुष्यों तथा ऊँटों, दोनों की अनगिनत संख्या पर बल देता है।
- source_word: וַיָּבֹאוּ בָאָרֶץ
  choice: वे देश में ... आते थे
  rationale: संदर्भ में बार-बार होने वाले आक्रमण को हिंदी के अभ्यस्त भूतकाल से व्यक्त किया गया है।
- source_word: לְשַׁחֲתָהּ
  choice: उसे नष्ट करने
  rationale: यह आक्रमण के उद्देश्य को बताता है; ‘नष्ट करना’ שׁחת का व्यापक और सीधा अर्थ देता है, जबकि ‘उजाड़ना’ भी संदर्भानुकूल विकल्प है।
