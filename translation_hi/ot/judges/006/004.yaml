  yaml_path: translation/ot/judges/006/004.yaml
  text: They would encamp against them and destroy the produce of the land as far as Gaza[a], and they would leave no sustenance in Israel, nor sheep, ox[b], or donkey.
translation:
  language: hi
  text: वे उनके विरुद्ध डेरा डालते और गाज़ा तक भूमि की उपज नष्ट कर देते थे। वे इस्राएल में जीवन-निर्वाह का कोई साधन नहीं छोड़ते थे—न भेड़ या बकरियाँ, न बैल, न गधे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּחֲנוּ עֲלֵיהֶם
  choice: वे उनके विरुद्ध आकर डेरा डालते थे
  rationale: חנה का अर्थ डेरा डालना है और עַל यहाँ विरोध का भाव देता है। प्रसंग में बार-बार होने वाली चढ़ाइयों के कारण हिन्दी का अभ्यस्त भूतकाल उपयुक्त है।
- source_word: וַיַּשְׁחִיתוּ אֶת יְבוּל הָאָרֶץ
  choice: भूमि की उपज नष्ट कर देते थे
  rationale: שׁחת के हिफ़ील रूप का सीधा अर्थ नष्ट या बरबाद करना है; יְבוּל खेती से मिलने वाली उपज को व्यापक रूप से व्यक्त करता है।
- source_word: עַד בּוֹאֲךָ עַזָּה
  choice: गाज़ा तक
  rationale: शाब्दिक रूप 'गाज़ा की ओर तुम्हारे पहुँचने तक' एक स्थान-संबंधी मुहावरा है। स्वाभाविक हिन्दी में 'गाज़ा तक' उसका आशय ठीक व्यक्त करता है।
- source_word: מִחְיָה
  choice: जीवन-निर्वाह का कोई साधन
  rationale: यह शब्द भोजन मात्र नहीं, बल्कि जीवित रहने और आजीविका चलाने के साधनों को भी समेटता है; इसलिए यह चयन उसके व्यापक अर्थ को सुरक्षित रखता है।
- source_word: וְשֶׂה וָשׁוֹר וַחֲמוֹר
  choice: न भेड़-बकरियाँ, न गाय-बैल, न गधे
  rationale: एकवचन पशु-संज्ञाएँ यहाँ सामूहिक अर्थ में हैं। हिन्दी में प्रचलित सामूहिक जोड़ियाँ שֶׂה और שׁוֹר की पशु-श्रेणियों को सहज और स्पष्ट बनाती हैं।
