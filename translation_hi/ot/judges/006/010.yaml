source:
  edition: WLC
  text: וָ/אֹמְרָ֣/ה לָ/כֶ֗ם אֲנִי֙ יְהוָ֣ה אֱלֹהֵי/כֶ֔ם לֹ֤א תִֽירְאוּ֙ אֶת אֱלֹהֵ֣י הָ/אֱמֹרִ֔י אֲשֶׁ֥ר אַתֶּ֖ם יוֹשְׁבִ֣ים בְּ/אַרְצָ֑/ם וְ/לֹ֥א שְׁמַעְתֶּ֖ם בְּ/קוֹלִֽ/י־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/010.yaml
  text: And I said to you[a], ‘I am Yahweh your God; do not fear the gods of the Amorites, in whose land you dwell[b]. But you have not listened to my voice.’
translation:
  language: hi
  text: और मैंने तुमसे कहा था, ‘मैं याहवे, तुम्हारा परमेश्वर हूँ। जिन एमोरियों के देश में तुम रहते हो, उनके देवताओं से मत डरना।[a] लेकिन तुमने मेरी बात नहीं मानी।’[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू में यह निषेधात्मक आज्ञा है; इसका अनुवाद ‘तुम उनके देवताओं से न डरना’ या ‘तुम्हें उनके देवताओं से नहीं डरना है’ भी किया जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘तुमने मेरी आवाज़ नहीं सुनी’; यहाँ सुनने का अर्थ बात मानना या आज्ञापालन करना भी है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמְרָה לָכֶם
  choice: और मैंने तुमसे कहा था
  rationale: वाक्य को पिछले प्रसंग से जोड़ने के लिए וָ का अनुवाद ‘और’ किया गया है। पूर्ण भूतकालीन प्रसंग को स्वाभाविक हिन्दी में व्यक्त करने के लिए ‘कहा था’ चुना गया।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम को किसी उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: אֱלֹהֵיכֶם
  choice: तुम्हारा परमेश्वर
  rationale: रूप बाहरी तौर पर बहुवचन जैसा है, पर यहाँ इस्राएल के परमेश्वर के लिए एकवचन अर्थ में प्रयुक्त हुआ है।
- source_word: לֹא תִירְאוּ
  choice: मत डरना
  rationale: नकार सहित अपूर्ण क्रिया यहाँ निषेध व्यक्त करती है। ‘मत डरना’ आधुनिक हिन्दी में सीधे और स्वाभाविक आदेश का रूप है।
- source_word: אֱלֹהֵי הָאֱמֹרִי
  choice: एमोरियों के देवता
  rationale: हिब्रू का जातिवाचक एकवचन सामूहिक अर्थ रखता है; हिन्दी में ‘एमोरियों’ स्वाभाविक बहुवचन है। אֱלֹהֵי यहाँ उन लोगों द्वारा पूजे जाने वाले अनेक देवताओं को दर्शाता है।
- source_word: אֲשֶׁר אַתֶּם יוֹשְׁבִים בְּאַרְצָם
  choice: जिन एमोरियों के देश में तुम रहते हो
  rationale: सम्बन्धवाचक उपवाक्य का आशय स्पष्ट रखते हुए हिन्दी की स्वाभाविक शब्द-व्यवस्था अपनाई गई है। ישׁב के बसे रहने के भाव को ‘रहते हो’ व्यक्त करता है।
- source_word: וְלֹא שְׁמַעְתֶּם בְּקוֹלִי
  choice: लेकिन तुमने मेरी बात नहीं मानी
  rationale: שׁמע בקול एक प्रचलित हिब्रू मुहावरा है जिसका अर्थ किसी की बात सुनकर उसका पालन करना है। ‘मेरी बात नहीं मानी’ इस आशय को स्वाभाविक हिन्दी में व्यक्त करता है; शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम सीधे आया है। ‘याहवे’ उसका लिप्यंतरण करके नाम और उपाधि के भेद को बनाए रखता है।
- issue: एमोरियों के देवताओं से ‘डरने’ का अर्थ
  choice: देवताओं से मत डरना
  alternative: देवताओं की उपासना मत करना
  rationale: मूल क्रिया ירא का सीधा अर्थ ‘डरना’ है। प्रसंग में भक्ति या श्रद्धा का भाव निहित हो सकता है, पर उसे मुख्य पाठ में ‘उपासना’ बनाना मूल की अर्थगत व्यापकता को अनावश्यक रूप से सीमित करता।
- issue: שׁמע בקול में सुनने और आज्ञापालन का सम्बन्ध
  choice: मेरी बात नहीं मानी
  alternative: मेरी आवाज़ नहीं सुनी
  rationale: यह हिब्रू मुहावरा सुनने के साथ आज्ञापालन का भाव रखता है। मुख्य पाठ में अर्थपरक हिन्दी रखी गई है, जबकि शाब्दिक बिंब पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। प्रत्यक्ष कथन में आज्ञा और आरोप की तीक्ष्णता बनी रहती है। हिन्दी की स्वाभाविकता के लिए सम्बन्धवाचक उपवाक्य को ‘देवताओं’ से पहले रखा गया है।
