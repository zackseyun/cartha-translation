base_translation:
  language: en
  yaml_path: translation/ot/judges/006/022.yaml
  text: Then Gideon saw that he was the angel of Yahweh[a], and Gideon said, “Ah, Lord GOD! For I have seen the angel of Yahweh face to face.”
translation:
  language: hi
  text: तब गिदोन ने देखा कि वह यहोवा का दूत[a] था। गिदोन ने कहा, “हाय, प्रभु यहोवा! क्योंकि मैंने यहोवा के दूत को आमने-सामने देखा है!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “यहोवा का स्वर्गदूत।” इब्रानी शब्द का अर्थ “दूत” या “स्वर्गदूत” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא ... כִּי
  choice: तब ... जान लिया कि
  rationale: ראה का मूल अर्थ ‘देखना’ है, पर כִּי के साथ इस प्रसंग में यह पहचान या बोध व्यक्त करता है। स्वाभाविक हिन्दी में ‘जान लिया कि’ इस आशय को स्पष्ट करता है।
- source_word: מַלְאַךְ יְהוָה
  choice: यहोवा का दूत
  rationale: מַלְאָךְ का अर्थ ‘दूत’ है और यह मानवीय या स्वर्गीय संदेशवाहक दोनों के लिए आ सकता है। ‘दूत’ मूल की व्यापकता बनाए रखता है; अलौकिक अर्थ की संभावना पादटिप्पणी में दी गई है।
- source_word: אֲהָהּ
  choice: हाय
  rationale: यह विस्मयादिबोधक भय और संकट-बोध व्यक्त करता है; ‘हाय’ आधुनिक हिन्दी में संक्षिप्त, स्वाभाविक और गरिमापूर्ण है।
- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा
  rationale: यह दोनों इब्रानी तत्वों—उपाधि אֲדֹנָי और निज नाम יְהוָה—को अलग-अलग बनाए रखता है।
- source_word: כִּי עַל כֵּן
  choice: मैंने तो
  rationale: यह वाक्य गिदोन के भय का कारण प्रबलता से सामने रखता है। हिन्दी का ‘तो’ उसकी व्याकुल प्रतिक्रिया और कारणात्मक बल को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: רָאִיתִי
  choice: देखा है
  rationale: इब्रानी पूर्ण क्रिया अभी-अभी हुई घटना के वर्तमान प्रभाव को व्यक्त करती है; हिन्दी पूर्ण वर्तमान इसके अनुकूल है।
- source_word: פָּנִים אֶל פָּנִים
  choice: आमने-सामने
  rationale: यह सीधे व्यक्तिगत साक्षात्कार का स्वाभाविक हिन्दी मुहावरा है और इब्रानी अभिव्यक्ति का अर्थ बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: ‘यहोवा’ आधुनिक हिन्दी बाइबलीय प्रयोग में व्यापक रूप से पहचाना जाने वाला निज नाम है और इसे केवल ‘प्रभु’ उपाधि से बदलने के बजाय मूल में उपस्थित व्यक्तिगत नाम को बनाए रखता है।
- issue: מַלְאַךְ יְהוָה की पहचान
  choice: यहोवा का दूत
  alternative: यहोवा का स्वर्गदूत
  rationale: ‘दूत’ शब्द मूल के संदेशवाहक-संबंधी अर्थ और उसकी वास्तविक अस्पष्टता को बनाए रखता है। प्रसंग अलौकिक प्रतिनिधि की ओर संकेत करता है, पर मुख्य पाठ उसकी प्रकृति को आवश्यकता से अधिक निश्चित नहीं करता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, कथात्मक और गरिमापूर्ण रखी गई है। गिदोन की घबराहट को ‘हाय’ और बलसूचक ‘तो’ से व्यक्त किया गया है। ईश्वरीय नाम को निज नाम के रूप में रखा गया है और מַלְאָךְ की शब्दार्थगत व्यापकता को मुख्य पाठ तथा पादटिप्पणी में सुरक्षित किया गया है।
