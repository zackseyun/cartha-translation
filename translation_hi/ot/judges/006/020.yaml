source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אֵלָ֜י/ו מַלְאַ֣ךְ הָ/אֱלֹהִ֗ים קַ֣ח אֶת הַ/בָּשָׂ֤ר וְ/אֶת הַ/מַּצּוֹת֙ וְ/הַנַּח֙ אֶל הַ/סֶּ֣לַע הַלָּ֔ז וְ/אֶת הַ/מָּרַ֖ק שְׁפ֑וֹךְ וַ/יַּ֖עַשׂ כֵּֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/020.yaml
  text: Then the angel of God said to him[a], “Take the meat and the unleavened bread, and set them on this rock, and pour out the broth.” And he did so.
translation:
  language: hi
  text: तब परमेश्वर के दूत[a] ने उससे कहा, “मांस और अख़मीरी रोटियाँ लेकर उन्हें इस चट्टान पर रख दे और शोरबा उँडेल दे।” उसने वैसा ही किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “परमेश्वर के स्वर्गदूत।” इब्रानी शब्द का अर्थ मनुष्य-दूत या अलौकिक दूत, दोनों हो सकता है; यहाँ प्रसंग अलौकिक दूत की ओर संकेत करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאַךְ הָאֱלֹהִים
  choice: परमेश्वर के दूत
  rationale: מַלְאַךְ का अर्थ ‘दूत’ या संदर्भानुसार ‘स्वर्गदूत’ हो सकता है। ‘परमेश्वर के दूत’ स्वाभाविक हिन्दी है और मूल शब्द की व्यापकता बनाए रखता है; प्रसंग इस दूत के अलौकिक स्वरूप का संकेत देता है।
- source_word: קַח
  choice: लेकर
  rationale: לקח का सीधा अर्थ ‘लेना’ है। अगले आदेश के साथ जोड़कर ‘लेकर ... रख दे’ आधुनिक हिन्दी में सहज है और अनावश्यक दिशात्मक अर्थ नहीं जोड़ता।
- source_word: הַבָּשָׂר
  choice: मांस
  rationale: भोजन के संदर्भ में בָּשָׂר के लिए ‘मांस’ सटीक और सामान्य हिन्दी शब्द है।
- source_word: הַמַּצּוֹת
  choice: अख़मीरी रोटियाँ
  rationale: מַצּוֹת बहुवचन में बिना खमीर की पकी हुई रोटियों को सूचित करता है। ‘अख़मीरी रोटियाँ’ अर्थ और बहुवचन दोनों को स्पष्ट रखता है।
- source_word: וְהַנַּח
  choice: रख दे
  rationale: נוח के हिफ़ील आदेश का यहाँ अर्थ किसी वस्तु को रख देना है। ‘रख दे’ सीधा, स्वाभाविक और आदेशात्मक है।
- source_word: אֶל־הַסֶּלַע הַלָּז
  choice: इस चट्टान पर
  rationale: סֶלַע चट्टान है और הַלָּז यहाँ संकेतवाचक ‘इस’ का भाव देता है। हिन्दी में रखने की क्रिया के साथ ‘पर’ स्वाभाविक संबंधबोधक है।
- source_word: הַמָּרַק
  choice: शोरबा
  rationale: מָרָק पकाने से बने तरल या broth को दर्शाता है; ‘शोरबा’ आधुनिक हिन्दी में स्पष्ट और प्रसंगानुकूल है।
- source_word: שְׁפֹוךְ
  choice: उँडेल दे
  rationale: שפך का आदेशात्मक रूप तरल को उँडेलने का भाव देता है। ‘उँडेल दे’ उसके खाली कर देने के पहलू को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וַיַּעַשׂ כֵּן
  choice: उसने वैसा ही किया
  rationale: यह संक्षिप्त वाक्य आदेश के ठीक अनुसार पालन को बताता है; ‘वैसा ही किया’ हिन्दी में इसी बल को सहजता से व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय दूत के लिए प्रयुक्त शब्द का अनुवाद
  choice: परमेश्वर के दूत
  alternative: परमेश्वर के स्वर्गदूत
  rationale: मूल מַלְאַךְ सामान्य ‘दूत’ और अलौकिक ‘स्वर्गदूत’ दोनों अर्थ रख सकता है। कथा का प्रसंग अलौकिक प्रतिनिधि की ओर संकेत करता है, पर ‘दूत’ मूल की शाब्दिक व्यापकता और ईश्वर-प्रकटन संबंधी कथात्मक तनाव को बिना समय से पहले सुलझाए बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘अख़मीरी’ व्यापक हिन्दी बाइबलीय प्रयोग के अनुरूप है; ‘दूत’ के साथ पाद-टिप्पणी मूल की अर्थगत गुंजाइश सुरक्षित रखती है।
