  yaml_path: translation/ot/judges/006/040.yaml
  text: And God did so that night[a], and there was dryness on the fleece alone, and on all the ground there was dew.
translation:
  language: hi
  text: 'और उस रात परमेश्वर ने वैसा ही किया: केवल ऊन का गट्ठा ही सूखा था, और सारी ज़मीन पर ओस पड़ी थी।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सारी भूमि पर ओस पड़ी थी।” इब्रानी אֶרֶץ का अर्थ “ज़मीन,” “भूमि” या “पृथ्वी” हो सकता है; यहाँ आशय गिदोन के चिह्न के आसपास की ज़मीन से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ אֱלֹהִים כֵּן
  choice: परमेश्वर ने वैसा ही किया
  rationale: यह पिछले पद में गिदोन द्वारा माँगे गए चिह्न की ओर संकेत करता है और इब्रानी की संक्षिप्त कथाशैली को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: בַּלַּיְלָה הַהוּא
  choice: उस रात
  rationale: यह समय की विशिष्टता को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: חֹרֶב אֶל הַגִּזָּה לְבַדָּהּ
  choice: केवल ऊन सूखा रहा
  rationale: חֹרֶב संज्ञा रूप में ‘सूखापन’ है, पर हिन्दी में ‘ऊन सूखा रहा’ अधिक स्वाभाविक है और परिणाम को स्पष्ट करता है। גִּזָּה यहाँ कतरकर उतारे गए ऊन को दर्शाता है।
- source_word: וְעַל כָּל הָאָרֶץ הָיָה טָל
  choice: और सारी भूमि पर ओस पड़ी थी
  rationale: אָרֶץ का आशय प्रसंग में आसपास की भूमि है; ‘भूमि’ उसकी अर्थगत व्यापकता बनाए रखता है, जबकि ‘ओस पड़ी थी’ स्वाभाविक हिन्दी प्रयोग है।
