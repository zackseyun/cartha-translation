source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יוֹאָ֡שׁ לְ/כֹל֩ אֲשֶׁר עָמְד֨וּ עָלָ֜י/ו הַ/אַתֶּ֣ם תְּרִיב֣וּ/ן לַ/בַּ֗עַל אִם אַתֶּם֙ תּוֹשִׁיע֣וּ/ן אוֹת֔/וֹ אֲשֶׁ֨ר יָרִ֥יב ל֛/וֹ יוּמַ֖ת עַד הַ/בֹּ֑קֶר אִם אֱלֹהִ֥ים הוּא֙ יָ֣רֶב ל֔/וֹ כִּ֥י נָתַ֖ץ אֶֽת מִזְבְּחֽ/וֹ־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/031.yaml
  text: But Joash said to all who stood against him[a], “Will you contend for Baal? Will you save him? Whoever contends for him shall be put to death by morning. If he is a god, let him contend for himself, because his altar has been torn down.”
translation:
  language: hi
  text: परन्तु योआश ने उन सब लोगों से, जो उसके विरुद्ध खड़े थे, कहा, “क्या तुम बाल का पक्ष लेकर विवाद करोगे? क्या तुम उसे बचाओगे? जो कोई उसका पक्ष लेकर विवाद करे, वह सुबह होने से पहले मार डाला जाए। यदि वह देवता है, तो वह अपने लिए स्वयं विवाद करे, क्योंकि उसकी वेदी ढा दी गई है।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा, “क्योंकि उसने उसकी वेदी ढा दी है,” जहाँ निहित कर्ता गिदोन समझा जाता है।
    reason: इब्रानी में נָתַץ सक्रिय पुल्लिंग एकवचन क्रिया है, पर उसका कर्ता स्पष्ट रूप से नहीं दिया गया है। मुख्य पाठ कर्ता को अनिर्दिष्ट रखता है; पादटिप्पणी निकटवर्ती संदर्भ के अनुसार सम्भव कर्तृवाच्य समझ दर्शाती है।
lexical_decisions:
- source_word: עָמְדוּ עָלָיו
  choice: उसके विरुद्ध खड़े थे
  rationale: संदर्भ में नगर के लोग योआश का विरोध करते हुए उसके सामने खड़े हैं; यह प्रयोग स्थान से अधिक विरोध का भाव व्यक्त करता है।
- source_word: תְּרִיבוּן / יָרִיב / יָרֶב
  choice: विवाद करोगे / विवाद करे / विवाद करे
  rationale: एक ही इब्रानी मूल ריב की पुनरावृत्ति पद की व्यंग्यपूर्ण तर्क-रचना को बाँधती है। ‘विवाद करना’ न्यायिक पक्ष लेने और झगड़ने—दोनों अर्थों की गुंजाइश रखता है।
- source_word: תּוֹשִׁיעוּן
  choice: बचाओगे
  rationale: हिफ़ील रूप का सीधा अर्थ सुरक्षित रखता है और इस विडंबना को स्पष्ट करता है कि मनुष्य अपने देवता को बचाने चलें।
- source_word: אֲשֶׁר יָרִיב לוֹ
  choice: जो कोई उसकी ओर से विवाद करे
  rationale: अनिश्चित संबंधवाचक अभिव्यक्ति को स्वाभाविक आधुनिक हिन्दी में सामान्य नियम के रूप में प्रस्तुत करता है।
- source_word: יוּמַת
  choice: मार डाला जाए
  rationale: होफ़ाल का कारक कर्मवाच्य अर्थ साधारण ‘मर जाए’ की अपेक्षा अधिक ठीक रूप से व्यक्त होता है।
- source_word: עַד הַבֹּקֶר
  choice: सुबह तक
  rationale: इब्रानी समय-सीमा को औपचारिक रूप से सुरक्षित रखता है; संदर्भ में आगामी सुबह अंतिम सीमा है।
- source_word: אֱלֹהִים הוּא
  choice: वह देवता है
  rationale: यहाँ אֱלֹהִים बाल के देवता होने के दावे को सूचित करता है, इस्राएल के परमेश्वर की पहचान को नहीं।
- source_word: כִּי נָתַץ אֶת מִזְבְּחוֹ
  choice: क्योंकि उसकी वेदी ढा दी गई है
  rationale: इब्रानी क्रिया पुल्लिंग एकवचन है, पर उसका कर्ता स्पष्ट नहीं है। हिन्दी कर्मवाच्य तथ्य पर ध्यान रखता है और गिदोन को अनकहे कर्ता के रूप में पाठ में नहीं जोड़ता।
- source_word: וַיֹּאמֶר
  choice: परन्तु योआश ने ... कहा
  rationale: संदर्भ में योआश आरोप लगानेवालों के विरुद्ध उत्तर देता है; ‘परन्तु’ इस कथात्मक मोड़ को स्वाभाविक ढंग से दिखाता है।
theological_decisions:
- issue: बाल के लिए אֱלֹהִים का अर्थ
  choice: ‘देवता’
  alternative: ‘परमेश्वर’
  rationale: योआश बाल के कथित देवत्व की परीक्षा प्रस्तुत कर रहा है, उसे सच्चा परमेश्वर घोषित नहीं कर रहा। ‘देवता’ मूल कथन के सशर्त और व्यंग्यपूर्ण भाव को बनाए रखता है।
- issue: अंतिम उपवाक्य में נָתַץ का कर्ता
  choice: कर्ताविहीन कर्मवाच्य—‘उसकी वेदी ढा दी गई है’
  alternative: ‘उसने उसकी वेदी ढा दी है,’ जहाँ निहित कर्ता गिदोन है
  rationale: इब्रानी में क्रिया का स्पष्ट कर्ता नहीं दिया गया। मुख्य पाठ अस्पष्टता को बनाए रखता है, जबकि सम्भव कर्तृवाच्य समझ को पादटिप्पणी में दर्ज किया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ריב की तीनों आवृत्तियों में ‘विवाद’ दोहराकर मूल की अलंकारिक एकता बचाई गई है। पादटिप्पणी-चिह्न विरोधी भीड़ वाले वाक्यांश के बाद रखा गया है, जैसा उपलब्ध परामर्श-पाठ में है, यद्यपि टिप्पणी अंतिम उपवाक्य की वैकल्पिक व्याख्या स्पष्ट करती है।
