reference: Judges 6:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יַּעֲשׂ֧וּ בְנֵי יִשְׂרָאֵ֛ל הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה וַ/יִּתְּנֵ֧/ם יְהוָ֛ה בְּ/יַד מִדְיָ֖ן שֶׁ֥בַע שָׁנִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/001.yaml
  text: And the sons of Israel did what was evil in the eyes of Yahweh[c][b][a], and Yahweh gave them into the hand of Midian for seven years.
translation:
  language: hi
  text: इस्राएलियों ने याहवे की दृष्टि में बुरा किया, और याहवे ने उन्हें सात वर्ष तक मिद्यान के हाथ में दे दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְנֵי יִשְׂרָאֵל
  choice: इस्राएलियों
  rationale: यह इब्रानी पदबंध शाब्दिक रूप से ‘इस्राएल के पुत्र’ है, पर यहाँ पूरे इस्राएली समुदाय का प्रचलित सामूहिक नाम है; ‘इस्राएलियों’ आधुनिक हिन्दी में स्वाभाविक और अर्थ-सटीक है।
- source_word: הָרַע
  choice: वह ... जो ... बुरा था
  rationale: עשה के साथ यह पदबंध नैतिक रूप से बुरा काम करने का अर्थ देता है; इस संरचना से इब्रानी का निश्चित और मूल्यांकनात्मक भाव बना रहता है।
- source_word: בְּעֵינֵי יְהוָה
  choice: यहोवा की दृष्टि में
  rationale: यह इब्रानी मूल्यांकन-सूचक मुहावरा है। ‘की दृष्टि में’ हिन्दी में स्वाभाविक है और मूल के ‘आँखों में’ वाले रूपक का आशय बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चतुरक्षरीय दिव्य नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित नामरूप ‘यहोवा’ से व्यक्त किया गया है।
- source_word: וַיִּתְּנֵם
  choice: उन्हें ... कर दिया
  rationale: अगले ‘हाथ में’ पदबंध के साथ נתן का अर्थ किसी दूसरे की सत्ता में सौंप देना है; हिन्दी वाक्यांश मूल मुहावरे की संरचना को स्वाभाविक ढंग से रखता है।
- source_word: בְיַד מִדְיָן
  choice: मिद्यान के हाथ में
  rationale: ‘हाथ’ यहाँ अधिकार या नियंत्रण का इब्रानी मुहावरा है। शाब्दिक बिंब हिन्दी के बाइबलीय प्रयोग में बोधगम्य है।
- source_word: מִדְיָן
  choice: मिद्यान
  rationale: व्यक्तिवाचक नाम का मानक हिन्दी लिप्यंतरण।
- source_word: שֶׁבַע שָׁנִים
  choice: सात वर्ष तक
  rationale: ‘तक’ अवधि को सहज हिन्दी में व्यक्त करता है और मूल के सात वर्षों की समयावधि को ठीक रखता है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में व्यक्तिगत वाचा-नाम है, इसलिए ‘प्रभु’ जैसी उपाधि नहीं रखी गई। ‘यहोवा’ आधुनिक हिन्दी बाइबल-पाठकों में अधिक परिचित रूप है; [a] में निकटतर वैकल्पिक लिप्यंतरण दिया गया है।
- issue: בְנֵי יִשְׂרָאֵל का सामूहिक अर्थ
  choice: इस्राएलियों
  alternative: इस्राएल के पुत्रों
  rationale: संदर्भ में पदबंध पूरे जातीय समुदाय को सूचित करता है। स्वाभाविक हिन्दी में सामूहिक अर्थ व्यक्त किया गया है, बिना इसे केवल पुरुष व्यक्तियों तक सीमित किए।
- issue: मिद्यान के हाथ में दिए जाने में दैवी कर्तृत्व
  choice: इसलिए यहोवा ने उन्हें ... कर दिया
  alternative: और यहोवा ने उन्हें ... कर दिया
  rationale: मूल का क्रम इस्राएल के बुरे काम और यहोवा के दंडात्मक सौंपने को जोड़ता है। ‘इसलिए’ निहित परिणाम-संबंध स्पष्ट करता है, पर कर्तृत्व या नैतिक तनाव को कम नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘मिद्यान के हाथ में’ मूल इब्रानी सत्ता-वाचक बिंब को सुरक्षित रखता है; अनावश्यक व्याख्या मुख्य पाठ में नहीं जोड़ी गई।
