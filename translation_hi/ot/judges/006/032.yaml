base_translation:
  language: en
  yaml_path: translation/ot/judges/006/032.yaml
  text: So on that day he called him Jerubbaal[a], saying, “Let Baal contend against him[b], because he tore down his altar.”
translation:
  language: hi
  text: उस दिन उसने उसका नाम यरुब्बाल[a] रखा और कहा, “बाल उससे मुक़दमा लड़े[b], क्योंकि उसने बाल की वेदी ढा दी थी।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘यरुब्बाल’ नाम इब्रानी क्रिया से जुड़ा है जिसका अर्थ ‘विवाद करना’ या ‘मुक़दमा लड़ना’ हो सकता है; इसकी व्याख्या है, ‘बाल उससे मुक़दमा लड़े।’
    reason: lexical_alternative
  - marker: b
    text: या, “बाल उससे मुक़दमा करेगा।” इब्रानी क्रिया को इच्छार्थक कथन के रूप में समझा जा सकता है; कुछ इसे विधानार्थक रूप में समझते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקְרָא לוֹ
  choice: उसने उसका नाम ... रखा
  rationale: קרא ל־ यहाँ किसी को नाम देने का अर्थ रखता है। हिंदी में ‘उसका नाम ... रखा’ स्वाभाविक है और इब्रानी के एकवचन कर्ता को बनाए रखता है।
- source_word: בַיּוֹם הַהוּא
  choice: उस दिन
  rationale: यह समय-सूचक पद का सीधा और स्वाभाविक हिंदी रूप है।
- source_word: יְרֻבַּעַל
  choice: यरुब्बाल
  rationale: व्यक्तिनाम का देवनागरी लिप्यंतरण किया गया है। इसके साथ जुड़ा ריב का शब्द-खेल अगले कथन और पाद-टिप्पणी में स्पष्ट किया गया है।
- source_word: לֵאמֹר
  choice: और कहा
  rationale: नामकरण के कारण को उद्धरण के रूप में प्रस्तुत करने के लिए आधुनिक हिंदी में यह स्वाभाविक कथात्मक रूप है।
- source_word: יָרֶב בּוֹ הַבַּעַל
  choice: बाल ही उससे वाद-विवाद करे
  rationale: 'अपूर्ण क्रिया के संभावित इच्छार्थक/आज्ञार्थक भाव को ‘करे’ से रखा गया है। ‘वाद-विवाद’ ריב के विरोध अथवा मुकदमे जैसे व्यापक भाव को व्यक्त करता और नाम के शब्द-खेल को संकेतित करता है। ‘ही’ प्रसंग का व्यंग्यात्मक जोर सामने लाता है: बाल स्वयं अपना पक्ष लड़े।'
- source_word: כִּי
  choice: क्योंकि
  rationale: यह नामकरण और कथन का कारण प्रस्तुत करता है।
- source_word: נָתַץ
  choice: ढा दी है
  rationale: נתץ वेदी जैसी संरचना को तोड़कर गिराने का बोध देता है। हिंदी में ‘वेदी ढा दी’ संक्षिप्त और स्वाभाविक है।
- source_word: אֶת מִזְבְּחוֹ
  choice: बाल की वेदी
  rationale: इब्रानी में सर्वनाम ‘उसकी’ है, जिसका निकटतम और स्वाभाविक पूर्वपद बाल है। हिंदी में संभावित सर्वनाम-संदेह से बचने के लिए पूर्वपद स्पष्ट किया गया है।
theological_decisions:
- issue: בַּעַל को इस मूर्तिपूजक और विवादात्मक प्रसंग में कैसे प्रस्तुत किया जाए
  choice: बाल
  alternative: स्वामी / प्रभु
  rationale: यहाँ בעל कनानी देवता का नाम/उपाधि है, सामान्य अर्थ ‘स्वामी’ नहीं। ‘बाल’ रखने से इस्राएल के परमेश्वर के लिए प्रयुक्त ‘प्रभु’ से भ्रम नहीं होता।
- issue: יָרֶב का विधार्थक या विधानार्थक भाव
  choice: बाल ही उससे वाद-विवाद करे
  alternative: बाल उससे वाद-विवाद करेगा
  rationale: इब्रानी रूप को इच्छार्थक/आज्ञार्थक रूप में सुनना प्रसंग के प्रत्युत्तर से अच्छी तरह मेल खाता है, पर विधानार्थक संभावना वास्तविक है और पाद-टिप्पणी में सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘वाद-विवाद करे’ नाम के इब्रानी शब्द-खेल और न्याय-विवाद के संभावित भाव दोनों को यथासंभव बनाए रखता है।
