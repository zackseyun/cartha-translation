  text: וַ/יֹּ֥אמֶר גִּדְע֖וֹן אֶל הָ/אֱלֹהִ֑ים אִם יֶשְׁ/ךָ֞ מוֹשִׁ֧יעַ בְּ/יָדִ֛/י אֶת יִשְׂרָאֵ֖ל כַּ/אֲשֶׁ֥ר דִּבַּֽרְתָּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/036.yaml
  text: Then Gideon said to God, “If you will save Israel by my hand, as you have spoken,”
translation:
  language: hi
  text: तब गिदोन ने परमेश्वर से कहा, “यदि तू अपने कहे के अनुसार मेरे हाथ से इस्राएल को बचाने वाला है—”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने कहा
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में उसके क्रमिक बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֶל הָאֱלֹהִים
  choice: परमेश्वर से
  rationale: संदर्भ में गिदोन इस्राएल के परमेश्वर को संबोधित कर रहा है; हिन्दी में ‘कहा’ के साथ ‘से’ स्वाभाविक है।
- source_word: אִם יֶשְׁךָ מוֹשִׁיעַ
  choice: यदि तू ... बचाने वाला है
  rationale: אִם शर्त आरम्भ करता है, जबकि יֵשׁ और कृदन्त का विन्यास भावी अभिप्राय या होने वाली क्रिया को दर्शाता है। यह रूप उस संभावना को बनाए रखता है और वाक्य को अगले पद में खुला छोड़ता है।
- source_word: בְּיָדִי
  choice: मेरे हाथ से
  rationale: एजेंसी व्यक्त करने वाले मूल इब्रानी मुहावरे और उसके ठोस बिंब को सुरक्षित रखा गया है।
- source_word: אֶת יִשְׂרָאֵל
  choice: इस्राएल को
  rationale: प्रत्यक्ष कर्म-चिह्न אֶת का अलग अनुवाद नहीं होता; हिन्दी में कर्म को ‘को’ से चिह्नित किया गया है।
- source_word: כַּאֲשֶׁר דִּבַּרְתָּ
  choice: अपने कहे के अनुसार
  rationale: यह परमेश्वर के पहले कहे हुए वचन का स्वाभाविक और गरिमापूर्ण हिन्दी संदर्भ देता है, बिना उसके आशय को विस्तृत किए।
theological_decisions:
- issue: אֱלֹהִים का संबोधन
  choice: परमेश्वर
  alternative: ईश्वर / वह परमेश्वर
  rationale: संदर्भ में संकेत इस्राएल के परमेश्वर की ओर है। ‘परमेश्वर’ स्पष्ट, प्रचलित और गैर-सांप्रदायिक बाइबलीय हिन्दी है।
- issue: गिदोन की शर्त का भाव
  choice: यदि तू ... बचाने वाला है
  alternative: यदि तू ... बचाएगा / यदि तू ... बचाने जा रहा है
  rationale: मूल की सशर्त और भावी-अभिप्राय वाली रचना को खुला रखा गया है; इसे न पूर्ण अविश्वास और न दृढ़ घोषणा के रूप में अतिरिक्त रूप से व्याख्यायित किया गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। परमेश्वर के लिए एकवचन आत्मीय संबोधन ‘तू’ रखा गया है। पद मूल की तरह अगले पद में जारी रहने वाली अधूरी शर्त है; अंतिम दीर्घ विराम-चिह्न इसी निरंतरता को दिखाता है।
