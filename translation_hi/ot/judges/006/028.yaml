source:
  edition: WLC
  text: וַ/יַּשְׁכִּ֜ימוּ אַנְשֵׁ֤י הָ/עִיר֙ בַּ/בֹּ֔קֶר וְ/הִנֵּ֤ה נֻתַּץ֙ מִזְבַּ֣ח הַ/בַּ֔עַל וְ/הָ/אֲשֵׁרָ֥ה אֲשֶׁר עָלָ֖י/ו כֹּרָ֑תָה וְ/אֵת֙ הַ/פָּ֣ר הַ/שֵּׁנִ֔י הֹֽעֲלָ֔ה עַל הַ/מִּזְבֵּ֖חַ הַ/בָּנֽוּי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/028.yaml
  text: When the men of the city rose early in the morning[a], behold, the altar of Baal had been torn down, and the Asherah that was on it had been cut down[b], and the second bull had been offered up on the altar that had been built.
translation:
  language: hi
  text: नगर के पुरुष सुबह तड़के उठे, तो उन्होंने देखा कि बाल की वेदी ढा दी गई थी, उस पर की अशेरा[a] काट डाली गई थी[b], और दूसरे बैल को उस बनाई गई वेदी पर बलि चढ़ाया गया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अशेरा का खंभा’; इब्रानी में ‘अशेरा।’
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक अर्थ ‘उस पर’ या ‘उसके ऊपर।’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכִּימוּ אַנְשֵׁי הָעִיר בַּבֹּקֶר
  choice: नगर के पुरुष सुबह तड़के उठे
  rationale: שׁכם के हिफ़ील रूप में जल्दी उठने का भाव है। ‘सुबह तड़के उठे’ इस समयगत बल को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; אַנְשֵׁי को उसके पुरुषवाचक अर्थ के अनुसार ‘पुरुष’ रखा गया है।
- source_word: וְהִנֵּה
  choice: तो उन्होंने देखा कि
  rationale: यह अचानक सामने आए दृश्य की ओर ध्यान खींचता है। हिन्दी कथन में ‘तो उन्होंने देखा कि’ उसी खोज और विस्मय को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: נֻתַּץ מִזְבַּח הַבַּעַל
  choice: बाल की वेदी ढा दी गई थी
  rationale: נתץ का निष्क्रिय रूप किसी वेदी को गिराने या ध्वस्त करने को दर्शाता है; ‘ढा दी गई थी’ सटीक और सहज है।
- source_word: הָאֲשֵׁרָה
  choice: अशेरा
  rationale: यह शब्द देवी अशेरा से संबद्ध उपासना-वस्तु या प्रतीक को सूचित कर सकता है। केवल ‘खंभा’ कहने से अर्थ अनावश्यक रूप से सीमित हो सकता है, इसलिए नाम का लिप्यंतरण रखा गया है।
- source_word: אֲשֶׁר עָלָיו
  choice: उसके पास की
  rationale: עַל का मूल अर्थ ‘पर/ऊपर’ है, पर इस उपासना-संदर्भ में अशेरा का वेदी के पास स्थित होना सम्भावित है। मुख्य पाठ में सहज सम्भावित अर्थ और पादटिप्पणी में शाब्दिक विकल्प सुरक्षित रखा गया है।
- source_word: כֹּרָתָה
  choice: काट डाली गई थी
  rationale: כרת का निष्क्रिय रूप यहाँ लकड़ी की उपासना-वस्तु को काट गिराने का अर्थ देता है।
- source_word: הַפָּר הַשֵּׁנִי
  choice: दूसरा बैल
  rationale: פַּר का सीधा अर्थ ‘बैल’ है और הַשֵּׁנִי पिछले प्रसंग में बताए गए दूसरे पशु की ओर संकेत करता है।
- source_word: הֹעֲלָה
  choice: बलि चढ़ा दिया गया था
  rationale: עלה का होफ़ाल रूप यहाँ वेदी पर बलि के रूप में चढ़ाए जाने को सूचित करता है। यह हिन्दी में यज्ञ-संबंधी भाव स्पष्ट करता है, बिना अनावश्यक doctrinal विस्तार के।
- source_word: הַמִּזְבֵּחַ הַבָּנוּי
  choice: उस बनाई गई वेदी
  rationale: निष्क्रिय कृदन्त वेदी को पहले बनाए जा चुके निर्माण के रूप में पहचानता है; ‘बनाई गई वेदी’ इसे सरल हिन्दी में बनाए रखता है।
theological_decisions:
- issue: אֲשֵׁרָה का आशय
  choice: अशेरा
  alternative: अशेरा का खंभा; पवित्र खंभा
  rationale: इब्रानी पद देवी, उससे संबद्ध प्रतीक, या उपासना-वस्तु को सूचित कर सकता है। ‘अशेरा’ मूल की व्यापकता और अस्पष्टता को सुरक्षित रखता है।
- issue: עָלָיו का स्थानगत अर्थ
  choice: उसके पास की
  alternative: उस पर स्थित; उसके ऊपर की
  rationale: शाब्दिक अर्थ ‘उस पर/ऊपर’ है, जबकि उपासना-स्थल के प्रसंग में ‘उसके पास’ सम्भावित व्यावहारिक अर्थ है। पादटिप्पणी शाब्दिक विकल्प देकर वास्तविक अस्पष्टता बनाए रखती है।
- issue: הֹעֲלָה का बलि-संबंधी अर्थ
  choice: बलि चढ़ा दिया गया था
  alternative: चढ़ा दिया गया था; होमबलि चढ़ाया गया था
  rationale: क्रिया बलि चढ़ाने का अर्थ देती है। ‘होमबलि’ निकट प्रसंग से सम्भव है, पर इस पद की क्रिया में संज्ञा स्पष्ट रूप से नहीं है, इसलिए मुख्य पाठ अधिक संयत रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथात्मक शैली अपनाई गई है। ‘बाल’ और ‘अशेरा’ प्रचलित बाइबलीय नामों के रूप में रखे गए हैं। सभी पादटिप्पणी-चिह्न संबंधित शब्द या वाक्यांश के साथ मुख्य पाठ में दिए गए हैं।
