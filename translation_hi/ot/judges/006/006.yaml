  text: וַ/יִּדַּ֧ל יִשְׂרָאֵ֛ל מְאֹ֖ד מִ/פְּנֵ֣י מִדְיָ֑ן וַ/יִּזְעֲק֥וּ בְנֵֽי יִשְׂרָאֵ֖ל אֶל יְהוָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/006.yaml
  text: So Israel became very poor because of Midian[c][b][a], and the sons of Israel cried out to Yahweh.
translation:
  language: hi
  text: मिद्यान के कारण इस्राएल बहुत ही दीन-दशा में पड़ गया[a], और इस्राएल के पुत्रों[b] ने याहवे[c] की दोहाई दी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बहुत निर्बल हो गया” अथवा “बहुत दरिद्र हो गया।” इब्रानी क्रिया दबाव में घटा दिए जाने, निर्बल होने या दीन दशा में पहुँचने का भाव दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से “इस्राएल के पुत्रों”; यह इस्राएल की प्रजा के लिए प्रयुक्त एक सामूहिक पदनाम है।
    reason: lexical_alternative
  - marker: c
    text: इब्रानी में YHWH, परमेश्वर का व्यक्तिगत नाम; इसे परंपरागत रूप से “यहोवा” या “प्रभु” भी लिखा जाता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּדַּל
  choice: दीन हो गया
  rationale: दलל मूल का यह क्रियारूप दबाव के कारण घटा दिए जाने, निर्बल होने या दरिद्र दशा में पहुँचने का भाव दे सकता है। संदर्भ में “दीन हो गया” आर्थिक अभाव और समग्र दुर्दशा—दोनों को खुला रखता है।
- source_word: מְאֹד
  choice: बहुत ही
  rationale: यह तीव्रता-सूचक क्रियाविशेषण है; “बहुत ही” आधुनिक हिन्दी में उसके जोर को स्वाभाविक रूप से व्यक्त करता है।
- source_word: מִפְּנֵי
  choice: के कारण
  rationale: 'यहाँ पूर्वसर्ग कारण बताता है: मिद्यान के उत्पीड़न से इस्राएल की दुर्दशा हुई।'
- source_word: מִדְיָן
  choice: मिद्यान
  rationale: व्यक्ति/जनसमूह के नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: וַיִּזְעֲקוּ
  choice: दोहाई दी
  rationale: זעק संकट में सहायता के लिए लगाई गई व्याकुल पुकार को दर्शाता है; “दोहाई दी” लक्ष्य की ओर की गई ऐसी पुकार को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: בְנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों
  rationale: इब्रानी पद का शाब्दिक रूप सुरक्षित रखा गया है; यहाँ वह सामूहिक रूप से इस्राएल की प्रजा को सूचित करता है।
- source_word: אֶל יְהוָה
  choice: याहवे की
  rationale: אֶל पुकार के लक्ष्य को दर्शाता है। हिन्दी मुहावरे “की दोहाई दी” में संबंधकारक उसी लक्ष्य को स्वाभाविक रूप से व्यक्त करता है; יְהוָה को व्यक्तिगत वाचा-नाम “याहवे” के रूप में रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम सीधे आया है। “याहवे” उसे उपाधि में बदले बिना प्रस्तुत करता है, जबकि पादटिप्पणी परंपरागत विकल्प बताती है।
- issue: בְנֵי יִשְׂרָאֵל का सामूहिक और पुल्लिंग रूप
  choice: इस्राएल के पुत्रों
  alternative: इस्राएली; इस्राएल के लोग
  rationale: मुख्य पाठ इब्रानी की स्पष्ट संज्ञा “पुत्रों” को सुरक्षित रखता है। पादटिप्पणी स्पष्ट करती है कि इस प्रसंग में यह पूरी इस्राएली प्रजा का सामूहिक पदनाम है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। “दीन” मूल की आर्थिक और व्यापक सामाजिक निर्बलता के बीच की अर्थगत गुंजाइश बनाए रखता है; “दोहाई दी” संकट में सहायता की व्याकुल पुकार का स्वाभाविक हिन्दी मुहावरा है।
