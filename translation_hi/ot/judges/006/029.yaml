  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। इब्रानी की क्रमिक क्रियाओं—कहना, पूछताछ करना, खोजबीन करना और फिर कहना—का भेद यथासंभव सुरक्षित रखा गया है।
