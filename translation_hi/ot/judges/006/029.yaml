  text: וַ/יֹּֽאמְרוּ֙ אִ֣ישׁ אֶל רֵעֵ֔/הוּ מִ֥י עָשָׂ֖ה הַ/דָּבָ֣ר הַ/זֶּ֑ה וַֽ/יִּדְרְשׁוּ֙ וַ/יְבַקְשׁ֔וּ וַ/יֹּ֣אמְר֔וּ גִּדְעוֹן֙ בֶּן יוֹאָ֔שׁ עָשָׂ֖ה הַ/דָּבָ֥ר הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/029.yaml
  text: And each man said to his neighbor[a], “Who has done this thing?” And they inquired and searched, and they said[b], “Gideon son of Joash has done this thing.”
translation:
  language: hi
  text: तब वे एक-दूसरे से कहने लगे[a], “यह काम किसने किया है?” उन्होंने पूछताछ और खोजबीन की, और कहा, “यह काम योआश के पुत्र गिदोन ने किया है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “एक पुरुष अपने साथी से।” यह इब्रानी मुहावरा लोगों के आपस में बात करने को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ אֶל־רֵעֵהוּ
  choice: वे एक-दूसरे से
  rationale: इब्रानी मुहावरा शाब्दिक रूप से ‘एक पुरुष अपने साथी से’ है और नगरवासियों के आपस में चर्चा करने का भाव देता है। ‘वे एक-दूसरे से’ आधुनिक हिन्दी में स्वाभाविक रूप से यही पारस्परिक अर्थ व्यक्त करता है।
- source_word: מִי
  choice: किसने
  rationale: यह कर्ता के विषय में पूछा गया सीधा प्रश्न है।
- source_word: עָשָׂה
  choice: किया है
  rationale: यहाँ क्रिया किसी पूरी हो चुकी, अभी-अभी सामने आई घटना को बताती है; हिन्दी का पूर्ण वर्तमान इस प्रसंग में स्वाभाविक है।
- source_word: הַדָּבָר הַזֶּה
  choice: यह काम
  rationale: דָּבָר यहाँ किसी कथन के बजाय किए गए कार्य को दर्शाता है। ‘यह काम’ व्यापक अर्थ को बनाए रखते हुए सहज हिन्दी है।
- source_word: וַיִּדְרְשׁוּ
  choice: पूछताछ की
  rationale: דרשׁ यहाँ जानकारी प्राप्त करने के लिए जाँचने और पूछने का भाव रखता है।
- source_word: וַיְבַקְשׁוּ
  choice: खोजबीन की
  rationale: בקשׁ का मूल भाव खोजने का है। ‘खोजबीन’ पहले आए ‘पूछताछ’ से भेद बनाए रखती है और दोषी का पता लगाने के सक्रिय प्रयास को व्यक्त करती है।
- source_word: גִּדְעוֹן בֶּן־יוֹאָשׁ
  choice: योआश के पुत्र गिदोन
  rationale: यह इब्रानी पितृनाम-सूचक रचना को स्पष्ट और स्वाभाविक हिन्दी क्रम में प्रस्तुत करता है।
- source_word: וַיֹּאמְרוּ
  choice: और कहा
  rationale: पाठ की साधारण कथन-क्रिया को ‘निष्कर्ष निकाला’ जैसे अधिक व्याख्यात्मक रूप में बदले बिना रखा गया है।
theological_decisions: []
