id: JDG.6.15
reference: Judges 6:15
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֵלָי/ו֙ בִּ֣י אֲדֹנָ֔/י בַּ/מָּ֥ה אוֹשִׁ֖יעַ אֶת יִשְׂרָאֵ֑ל הִנֵּ֤ה אַלְפִּ/י֙ הַ/דַּ֣ל בִּ/מְנַשֶּׁ֔ה וְ/אָנֹכִ֥י הַ/צָּעִ֖יר בְּ/בֵ֥ית אָבִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/015.yaml
  text: But he said to him[a], “Please, my lord, how can I save Israel? Look, my clan is the weakest in Manasseh[c][b], and I am the youngest in my father’s house.”
translation:
  language: hi
  text: पर उसने उससे कहा, “क्षमा कीजिए, मेरे स्वामी, मैं इस्राएल को कैसे बचा सकता हूँ? देखिए, मेरा कुल[a] मनश्शे में सबसे निर्बल[b] है, और मैं अपने पिता के घराने में सबसे छोटा[c] हूँ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से “मेरा हज़ार”; यह इब्रानी शब्द किसी गोत्रीय कुल या पारिवारिक समूह के लिए भी प्रयुक्त हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “सबसे निर्धन” अथवा “सबसे छोटा/तुच्छ।”
    reason: lexical_alternative
  - marker: c
    text: या “सबसे तुच्छ।”
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּי
  choice: क्षमा कीजिए
  rationale: यहाँ यह विनम्र निवेदन या आपत्ति प्रकट करने वाला संबोधन-सूचक अव्यय है; आधुनिक हिन्दी में “क्षमा कीजिए” गिदोन की संकोचपूर्ण विनम्रता को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֲדֹנָי
  choice: मेरे स्वामी
  rationale: यह सम्मानसूचक संबोधन हो सकता है और इस बिंदु पर अनिवार्य रूप से परमेश्वर के लिए प्रयुक्त उपाधि नहीं है। “मेरे स्वामी” कथा में वक्ता की पहचान से जुड़ी अस्पष्टता को बनाए रखता है।
- source_word: בַּמָּה
  choice: कैसे
  rationale: शाब्दिक अर्थ “किसके द्वारा/किस साधन से” है, पर प्रसंग में गिदोन अपनी सामर्थ्य और साधनों पर प्रश्न कर रहा है; “कैसे” स्वाभाविक हिन्दी समतुल्य है।
- source_word: אוֹשִׁיעַ
  choice: मैं ... बचा सकता हूँ
  rationale: हिफ़ील रूप का अर्थ बचाना या छुड़ाना है। प्रश्नवाचक प्रसंग में “बचा सकता हूँ” हिन्दी में क्षमता और साधन दोनों पर उठाए गए प्रश्न को व्यक्त करता है।
- source_word: הִנֵּה
  choice: देखिए
  rationale: आगे दिए जाने वाले कारण की ओर ध्यान खींचता है। “देखिए” आधुनिक, आदरसूचक और स्वाभाविक है।
- source_word: אַלְפִּי
  choice: मेरा कुल
  rationale: אֶלֶף का मूल संबंध “हज़ार” से है, पर गोत्रीय-सामाजिक संदर्भ में यह कुल या उपसमूह को सूचित कर सकता है। “कुल” यहाँ भ्रामक शाब्दिक संख्या से बचता है।
- source_word: הַדַּל
  choice: सबसे निर्बल
  rationale: דַּל निर्धनता, दुर्बलता या निम्न सामाजिक स्थिति व्यक्त कर सकता है। प्रसंग में “सबसे निर्बल” गिदोन की सामर्थ्यहीनता और नगण्य स्थिति के दावे को समेटता है, जबकि विकल्प पादटिप्पणी में दिए गए हैं।
- source_word: בִּמְנַשֶּׁה
  choice: मनश्शे में
  rationale: यह मनश्शे गोत्र का सीधा उल्लेख है; हिन्दी बाइबलीय नाम-परंपरा के अनुरूप रूप रखा गया है।
- source_word: הַצָּעִיר
  choice: सबसे छोटा
  rationale: शब्द का अर्थ आयु में छोटा, आकार में छोटा या हैसियत में नगण्य हो सकता है। पिता के घराने के संदर्भ में “सबसे छोटा” आयु और निम्न पारिवारिक हैसियत—दोनों की संभावित छाया बनाए रखता है।
- source_word: בְּבֵית אָבִי
  choice: अपने पिता के घराने में
  rationale: यह पैतृक परिवार या गृह-समुदाय का पारंपरिक इब्रानी पद है। “घराना” आधुनिक हिन्दी में केवल भवन के बजाय पारिवारिक इकाई स्पष्ट करता है।
theological_decisions:
- issue: गिदोन के संबोधन אֲדֹנָי का आशय
  choice: इसे सम्मानसूचक “मेरे स्वामी” के रूप में रखा गया है।
  alternative: इसे ईश्वरीय उपाधि मानकर “हे प्रभु” अनूदित किया जा सकता है।
  rationale: इस कथात्मक चरण में गिदोन के सामने बोलने वाले की पहचान पूरी तरह स्पष्ट नहीं हुई है। सम्मानसूचक अनुवाद उस धार्मिक और कथात्मक तनाव को समय से पहले समाप्त नहीं करता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, विनम्र और गरिमापूर्ण संवाद-शैली में रखी गई है। “क्षमा कीजिए” और “देखिए” आदरसूचक बहुवचन के अनुरूप हैं। “मेरे स्वामी” को ईश्वरीय नाम की तरह विशिष्ट रूप नहीं दिया गया, ताकि मूल कथात्मक अस्पष्टता बनी रहे।
