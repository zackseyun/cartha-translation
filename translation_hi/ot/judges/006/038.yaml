base_translation:
  language: en
  yaml_path: translation/ot/judges/006/038.yaml
  text: And it was so. He rose early the next day and squeezed the fleece[a], wringing dew from the fleece—a bowlful of water.
translation:
  language: hi
  text: और ऐसा ही हुआ। अगले दिन वह तड़के उठा और उसने ऊन के गट्ठे को दबाकर[a] उसमें से ओस निचोड़ी—एक कटोरा भर पानी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “ऊन के गट्ठे को निचोड़ा।” इब्रानी में लगातार दो क्रियाएँ हैं—पहली ऊन को दबाने या निचोड़ने की और दूसरी उसमें से ओस निकालने की क्रिया बताती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כֵן
  choice: और वैसा ही हुआ
  rationale: यह मुहावरेदार पुष्टि है कि गिदोन ने जैसा चिन्ह माँगा था, वैसा ही घटित हुआ।
- source_word: וַיַּשְׁכֵּם מִמָּחֳרָת
  choice: अगले दिन वह सुबह जल्दी उठा
  rationale: क्रिया का अर्थ प्रातः जल्दी उठना है और מִמָּחֳרָת अगले दिन को सूचित करता है।
- source_word: וַיָּזַר אֶת־הַגִּזָּה
  choice: उसने ऊन के गट्ठे को निचोड़ा
  rationale: यह क्रिया तरल निकालने के लिए ऊन को दबाने या निचोड़ने की क्रिया बताती है; 'निचोड़ा' सहज और सटीक है।
- source_word: וַיִּמֶץ טַל מִן־הַגִּזָּה
  choice: उसने उस ऊन के गट्ठे से ... ओस का पानी निकाला
  rationale: दूसरी क्रिया दबाकर तरल निकालने के परिणाम को व्यक्त करती है; हिंदी में इसे अलग उपवाक्य के रूप में रखना स्वाभाविक है।
- source_word: מְלֹא הַסֵּפֶל מָיִם
  choice: इतना ओस का पानी ... कि एक कटोरा भर गया
  rationale: इब्रानी पदबंध एक कटोरा भरने जितनी मात्रा बताता है; यह हिंदी में मात्रा और दृश्य दोनों को स्पष्ट रूप से व्यक्त करता है।
- source_word: הַסֵּפֶל
  choice: कटोरा
  rationale: यह कटोरे या छोटे पात्र के लिए प्रयुक्त शब्द है; 'कटोरा' सामान्य आधुनिक हिंदी में स्पष्ट है।
