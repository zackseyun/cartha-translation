id: JDG.6.16
reference: Judges 6:16
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֵלָי/ו֙ יְהוָ֔ה כִּ֥י אֶהְיֶ֖ה עִמָּ֑/ךְ וְ/הִכִּיתָ֥ אֶת מִדְיָ֖ן כְּ/אִ֥ישׁ אֶחָֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/016.yaml
  text: And Yahweh said to him[a], “Surely I will be with you, and you will strike Midian as one man.”
translation:
  language: hi
  text: तब याहवे ने उससे कहा, “निश्चय ही मैं तेरे साथ रहूँगा, और तू मिद्यान को ऐसे परास्त करेगा, जैसे वह एक ही आदमी हो।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “एक आदमी के समान।” अर्थात मिद्यान को मानो वह केवल एक ही आदमी हो; यह मुहावरा निर्णायक रूप से परास्त करने की छवि प्रस्तुत करता है।
    reason: हिब्रू मुहावरे का शाब्दिक रूप और उसकी सम्भावित अर्थ-सीमा स्पष्ट करता है, बिना ‘सहज’ विजय को निश्चित अर्थ के रूप में जोड़ने के।
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלָיו
  choice: तब ... ने उससे कहा
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है; आधुनिक हिन्दी में ‘तब’ स्वाभाविक कथात्मक प्रवाह देता है, बिना अनावश्यक कालगत अर्थ जोड़े।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम को किसी उपाधि से बदलने के बजाय हिन्दी लिपि में उसके प्रचलित विद्वतापूर्ण उच्चारण का लिप्यंतरण किया गया है।
- source_word: כִּי
  choice: निश्चय ही
  rationale: यहाँ यह पद गिदोन को आश्वासन देने वाला बल रखता है; ‘निश्चय ही’ उस बल को स्वाभाविक हिन्दी में व्यक्त करता है, यद्यपि इसका कारणसूचक अर्थ भी सम्भव है।
- source_word: אֶהְיֶה עִמָּךְ
  choice: मैं तेरे साथ रहूँगा
  rationale: היה का प्रथम पुरुष एकवचन अपूर्ण रूप इस प्रतिज्ञा के प्रसंग में भविष्यकालीन आश्वासन व्यक्त करता है। एकवचन सम्बोधन के लिए ‘तेरे’ मूल के व्याकरणिक रूप को स्पष्ट रखता है।
- source_word: וְהִכִּיתָ
  choice: और तू ... मार गिराएगा
  rationale: נכה के प्रहार करने के अर्थ और यहाँ अपेक्षित निर्णायक विजय—दोनों को ‘मार गिराएगा’ स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אֶת מִדְיָן
  choice: मिद्यान को
  rationale: मूल पाठ किसी विस्तारित ‘मिद्यानी लोगों’ के बजाय सामूहिक नाम ‘मिद्यान’ रखता है; वही रूप सुरक्षित रखा गया है।
- source_word: כְּאִישׁ אֶחָד
  choice: जैसे वह एक ही आदमी हो
  rationale: हिब्रू की एकवचन पुरुष-छवि को बनाए रखते हुए हिन्दी में यह स्पष्ट किया गया है कि समूचे मिद्यान पर विजय मानो एक व्यक्ति पर प्रहार करने जैसी होगी।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल में चार-अक्षरी व्यक्तिगत नाम है। ‘याहवे’ उसे उपाधि से प्रतिस्थापित किए बिना देवनागरी में प्रस्तुत करता है।
- issue: כְּאִישׁ אֶחָד मुहावरे का आशय
  choice: जैसे वह एक ही आदमी हो
  alternative: एक आदमी के समान; मानो एक ही व्यक्ति को
  rationale: यह रूप शत्रु-समूह के विरुद्ध निर्णायक अथवा सहज विजय की छवि रखता है और मूल के पुल्लिंग एकवचन को निष्प्रभावी नहीं करता; मुहावरे की सम्भावित व्याख्याएँ पादटिप्पणी में खुली रखी गई हैं।
- issue: כִּי का आश्वासनात्मक या कारणसूचक बल
  choice: निश्चय ही
  alternative: क्योंकि; सचमुच
  rationale: प्रसंग में यह गिदोन की आपत्ति के उत्तर में ईश्वरीय उपस्थिति का दृढ़ आश्वासन देता है। कारणसूचक सम्बन्ध सम्भव है, पर मुख्य पाठ में आश्वासनात्मक बल अधिक स्वाभाविक है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। एकवचन सम्बोधन ‘तू/तेरे’ मूल की प्रत्यक्षता और निकटता बनाए रखता है; ‘मार गिराएगा’ युद्ध-सन्दर्भ में נכה की शक्ति को स्वाभाविक ढंग से व्यक्त करता है।
