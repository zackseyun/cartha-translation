base_translation:
  language: en
  yaml_path: translation/ot/judges/006/012.yaml
  text: Then the angel of Yahweh appeared to him and said to him[a], “Yahweh is with you[b], mighty warrior.”
translation:
  language: hi
  text: तब यहोवा का दूत उसे दिखाई दिया और उससे कहा, “यहोवा तेरे साथ है, हे वीर योद्धा।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यहोवा का स्वर्गदूत।” इब्रानी शब्द का अर्थ “दूत” या “स्वर्गदूत” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרָא
  choice: दिखाई दिया
  rationale: ראה के निफ़अल रूप का यहाँ स्वाभाविक अर्थ किसी दृश्य प्रकटाव में ‘दिखाई दिया’ है; यह हिन्दी में सहज है और मूल की अभिव्यक्ति को बनाए रखता है।
- source_word: מַלְאַךְ יְהוָה
  choice: यहोवा का दूत
  rationale: מַלְאָךְ का मूल अर्थ ‘दूत/संदेशवाहक’ है और प्रसंग में यह स्वर्गीय दूत है। ‘दूत’ हिन्दी बाइबलीय भाषा में दोनों पहलुओं को समेटता है तथा अनावश्यक धर्मवैज्ञानिक पहचान नहीं जोड़ता।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चार अक्षरों वाले परमेश्वर के व्यक्तिगत नाम को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है, न कि किसी उपाधि से बदला गया है।
- source_word: וַיֹּאמֶר אֵלָיו
  choice: और उससे कहा
  rationale: मूल में केवल ‘उससे’ सर्वनाम है; गिदोन का नाम जोड़ना अनावश्यक विस्तार होता।
- source_word: יְהוָה עִמְּךָ
  choice: यहोवा तेरे साथ है
  rationale: क्रियारहित इब्रानी वाक्य को प्रसंगानुसार वर्तमानकालीन कथन माना गया है, आशीर्वादसूचक कामना नहीं। एक व्यक्ति के लिए प्रयुक्त एकवचन प्रत्यय को ‘तेरे’ से व्यक्त किया गया है।
- source_word: גִּבּוֹר הֶחָיִל
  choice: वीर योद्धा
  rationale: यह पदबंध सामर्थ्यवान, युद्ध में सक्षम और साहसी पुरुष को दर्शाता है। ‘वीर योद्धा’ आधुनिक हिन्दी में स्वाभाविक है और इसके सैनिक आशय को स्पष्ट रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम सीधे प्रयुक्त है। उसे उपाधि ‘प्रभु’ से बदलने के बजाय हिन्दी के परिचित लिप्यंतरण से सुरक्षित रखा गया है।
- issue: מַלְאַךְ יְהוָה की पहचान
  choice: यहोवा का दूत
  alternative: यहोवा का स्वर्गदूत
  rationale: ‘दूत’ मूल शब्द की व्यापक अर्थ-सीमा को बनाए रखता है और इस पात्र की कोई अधिक विशिष्ट धर्मवैज्ञानिक पहचान मुख्य पाठ में आरोपित नहीं करता।
- issue: יְהוָה עִמְּךָ का वाक्य-भाव
  choice: यहोवा तेरे साथ है
  alternative: यहोवा तेरे साथ रहे
  rationale: प्रसंग इसे गिदोन के विषय में घोषणा के रूप में प्रस्तुत करता है; फिर भी इब्रानी क्रियारहित वाक्य की संभावित आशीर्वादसूचक समझ को पादटिप्पणी में दर्ज किया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक रखी गई है। प्रत्यक्ष संबोधन में ‘तेरे’ मूल के एकवचन रूप और प्राचीन प्रसंग के अनुकूल है। ‘वीर योद्धा’ पारंपरिक लेकिन अब अस्वाभाविक ‘पराक्रमी शूरवीर पुरुष’ जैसे रूपों से अधिक सहज है।
