source:
  edition: WLC
  text: וּ/מַלְאָכִים֙ שָׁלַ֣ח בְּ/כָל מְנַשֶּׁ֔ה וַ/יִזָּעֵ֥ק גַּם ה֖וּא אַחֲרָ֑י/ו וּ/מַלְאָכִ֣ים שָׁלַ֗ח בְּ/אָשֵׁ֤ר וּ/בִ/זְבֻלוּן֙ וּ/בְ/נַפְתָּלִ֔י וַֽ/יַּעֲל֖וּ לִ/קְרָאתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/035.yaml
  text: And he sent messengers throughout all Manasseh[a], and it too was called out after him. He also sent messengers through Asher, Zebulun, and Naphtali, and they went up to meet them.
translation:
  language: hi
  text: उसने पूरे मनश्शे में दूत भेजे, और मनश्शे के लोग भी उसके पीछे इकट्ठे होने के लिए बुलाए गए। उसने आशेर, जबूलून और नप्ताली में भी दूत भेजे, और वे उनसे मिलने के लिए चढ़ आए।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “उनसे” का संकेत स्पष्ट नहीं है। संभवतः इसका आशय शत्रु सेनाओं से है; या इसका आशय गिदोन और उसके साथ के लोगों से हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: מַלְאָכִים
  choice: दूत
  rationale: इस सैन्य जुटान के प्रसंग में यह शब्द स्वर्गदूतों के लिए नहीं, बुलावा पहुँचाने वाले मानवीय संदेशवाहकों के लिए है।
- source_word: בְּכָל מְנַשֶּׁה
  choice: पूरे मनश्शे में
  rationale: पूर्वसर्ग और ‘पूरा’ मिलकर समूचे गोत्रीय क्षेत्र में दूत भेजे जाने का भाव देते हैं।
- source_word: וַיִזָּעֵק גַּם הוּא אַחֲרָיו
  choice: मनश्शे के लोगों को भी उसके पीछे चलने के लिए बुलाया गया
  rationale: निफ़अल क्रिया यहाँ सैन्य बुलावे पर जुटाए जाने का निष्क्रिय भाव रखती है। हिंदी में गोत्र के नाम को सीधे निष्क्रिय क्रिया का कर्ता बनाने के बजाय ‘मनश्शे के लोगों’ कहना अधिक स्वाभाविक और स्पष्ट है।
- source_word: בְּאָשֵׁר וּבִזְבֻלוּן וּבְנַפְתָּלִי
  choice: आशेर, जबूलून और नप्ताली में
  rationale: दोहराया गया पूर्वसर्ग उन गोत्रों अथवा उनके क्षेत्रों में दूत भेजे जाने को सूचित करता है।
- source_word: וַיַּעֲלוּ
  choice: चढ़ आए
  rationale: यह मूल क्रिया के ऊपर चढ़ने अथवा सैन्य रूप से आगे बढ़ने के भाव को हिंदी कथात्मक शैली में बनाए रखता है।
- source_word: לִקְרָאתָם
  choice: उनसे मिलने के लिए
  rationale: बहुवचन प्रत्यय को ‘उनसे’ के रूप में सुरक्षित रखा गया है और अस्पष्ट पूर्वपद को मुख्य पाठ में किसी एक पक्ष से नहीं जोड़ा गया।
theological_decisions:
- issue: לִקְרָאתָם में बहुवचन प्रत्यय का संदर्भ
  choice: मुख्य पाठ में अनिर्दिष्ट बहुवचन ‘उनसे’
  alternative: शत्रु सेनाओं का सामना करने के लिए; अथवा गिदोन और उसके साथ के लोगों से मिलने के लिए
  rationale: इब्रानी रूप बहुवचन है, पर उसका पूर्वपद स्पष्ट नहीं है। निकटवर्ती सैन्य प्रसंग शत्रु सेनाओं की ओर संकेत कर सकता है, जबकि गिदोन और उसके दल से मिलने का अर्थ भी प्रसंगगत रूप से संभव है; इसलिए मुख्य पाठ में अस्पष्टता रखी गई और टिप्पणी में दोनों संभावनाएँ दी गईं।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। गोत्रों के प्रचलित हिंदी बाइबलीय नाम अपनाए गए हैं। सैन्य जुटान का भाव स्पष्ट किया गया है, पर अंतिम बहुवचन सर्वनाम की वास्तविक अस्पष्टता को नहीं हटाया गया।
