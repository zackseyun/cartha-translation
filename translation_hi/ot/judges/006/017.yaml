base_translation:
  language: en
  yaml_path: translation/ot/judges/006/017.yaml
  text: And he said to him, “If now I have found favor in your eyes, then give me a sign that you are the one speaking with me.”
translation:
  language: hi
  text: उसने उससे कहा, “कृपा करके, यदि मैंने तेरी दृष्टि में अनुग्रह पाया है, तो मुझे एक चिन्ह दे कि तू ही मुझसे बात कर रहा है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: मुझ पर तेरी कृपा हुई है
  rationale: इब्रानी मुहावरे ‘तेरी आँखों में अनुग्रह पाया’ का स्वाभाविक आधुनिक हिन्दी रूप, जिसमें अनुकूल कृपा का भाव बना रहता है।
- source_word: וְעָשִׂיתָ לִּי אוֹת
  choice: तो मुझे एक चिन्ह दे
  rationale: शाब्दिक अर्थ ‘मेरे लिए एक चिन्ह कर’ है; हिन्दी में ‘चिन्ह दे’ अपेक्षित प्रमाण या अलौकिक संकेत के अर्थ को सहजता से व्यक्त करता है।
- source_word: שָׁאַתָּה מְדַבֵּר עִמִּי
  choice: कि तू ही मुझसे बात कर रहा है
  rationale: שָׁ का आशय ‘कि’ और אַתָּה का स्पष्ट बल ‘तू ही’ से व्यक्त किया गया है; वक्ता की पहचान की पुष्टि माँगने वाला भाव सुरक्षित है।
theological_decisions:
- issue: वक्ता की पहचान और माँगे गए चिन्ह का संबंध
  choice: ‘कि तू ही मुझसे बात कर रहा है’
  alternative: ‘कि तू मुझसे बात कर रहा है’
  rationale: स्वतंत्र सर्वनाम אַתָּה यहाँ पहचान पर बल देता है। अनुवाद यह तय नहीं करता कि गिदोन उस व्यक्ति के स्वभाव को कितना समझ चुका था; वह केवल उसी वक्ता से पुष्टि माँगता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी। संवाद की प्राचीन निकटता बनाए रखने के लिए एकवचन ‘तू/तेरी’ रखा गया है; इससे अनादर अभिप्रेत नहीं है।
