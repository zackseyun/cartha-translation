  yaml_path: translation/ot/judges/006/033.yaml
  text: Then all Midian and Amalek and the people of the East gathered together[a], crossed over, and camped in the Valley of Jezreel.
translation:
  language: hi
  text: तब सारा मिद्यान, अमालेक और पूर्व के लोग[a] इकट्ठे हुए। वे पार गए और यिज्रेल की घाटी में डेरा डाला।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘पूर्व के पुत्र’; यह पूर्व दिशा में रहने वाले समुदायों के लिए एक इब्रानी मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כָל מִדְיָן
  choice: पूरा मिद्यान
  rationale: इब्रानी में जातिनाम सामूहिक रूप से आया है। ‘पूरा मिद्यान’ मूल अभिव्यक्ति के निकट रहते हुए समूचे मिद्यानी दल का बोध कराता है।
- source_word: וַ/עֲמָלֵק
  choice: अमालेक
  rationale: जातिनाम यहाँ सामूहिक अर्थ में प्रयुक्त है; नाम को बिना अनावश्यक विस्तार के बनाए रखा गया है।
- source_word: וּ/בְנֵי קֶדֶם
  choice: पूर्व के लोग
  rationale: शाब्दिक अर्थ ‘पूर्व के पुत्र’ है, पर यह पूर्व दिशा में रहने वाले समुदायों के लिए इब्रानी मुहावरा है; स्वाभाविक हिन्दी में उसका आशय दिया गया है।
- source_word: נֶאֶסְפוּ יַחְדָּו
  choice: इकट्ठे हुए
  rationale: यह क्रिया और क्रियाविशेषण मिलकर एक साथ जमा होने का भाव देते हैं; हिन्दी में ‘इकट्ठे हुए’ स्वाभाविक और पर्याप्त है।
- source_word: וַ/יַּעַבְרוּ
  choice: पार जाकर
  rationale: עבר का मूल भाव पार जाने का है। मूल पाठ की तरह यह नहीं बताया गया कि उन्होंने विशेष रूप से किसे पार किया।
- source_word: וַֽ/יַּחֲנוּ
  choice: पड़ाव डाला
  rationale: सैन्य कथानक में חנה शिविर लगाने या पड़ाव डालने को व्यक्त करता है; ‘पड़ाव डाला’ सहज आधुनिक हिन्दी है।
- source_word: בְּ/עֵמֶק יִזְרְעֶאל
  choice: यिज्रेल की तराई में
  rationale: עמק घाटी अथवा विस्तृत निम्नभूमि को सूचित करता है। इस भौगोलिक प्रसंग में ‘तराई’ स्वाभाविक है और नाम ‘यिज्रेल’ को बनाए रखता है।
