  text: וַ/יֹּ֨אמֶר אֵלָ֤י/ו גִּדְעוֹן֙ בִּ֣י אֲדֹנִ֔/י וְ/יֵ֤שׁ יְהוָה֙ עִמָּ֔/נוּ וְ/לָ֥/מָּה מְצָאַ֖תְ/נוּ כָּל זֹ֑את וְ/אַיֵּ֣ה כָֽל נִפְלְאֹתָ֡י/ו אֲשֶׁר֩ סִפְּרוּ לָ֨/נוּ אֲבוֹתֵ֜י/נוּ לֵ/אמֹ֗ר הֲ/לֹ֤א מִ/מִּצְרַ֨יִם֙ הֶעֱלָ֣/נוּ יְהוָ֔ה וְ/עַתָּה֙ נְטָשָׁ֣/נוּ יְהוָ֔ה וַֽ/יִּתְּנֵ֖/נוּ בְּ/כַף מִדְיָֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/013.yaml
  text: Gideon said to him[a], “Please, my lord, if Yahweh is with us, why then has all this happened to us? And where are all his wonders that our fathers told us about, saying[c][b], ‘Did not Yahweh bring us up from Egypt?’ But now Yahweh has abandoned us and given us into the hand of Midian.”
translation:
  language: hi
  text: गिदोन ने उससे कहा, “कृपया, स्वामी[a], यदि याहवे हमारे साथ हैं, तो यह सब हमारे साथ क्यों हुआ? और उनके वे सब अद्भुत कार्य[b] कहाँ हैं, जिनका वर्णन हमारे पुरखों ने हमें यह कहकर किया था, ‘क्या याहवे हमें मिस्र से निकालकर नहीं लाए?’ पर अब याहवे ने हमें छोड़ दिया है और हमें मिद्यान के हाथ में सौंप दिया है[c]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “क्षमा कीजिए, स्वामी।” इब्रानी में यह आदर और विनम्रता से बात आरंभ करने का ढंग है।
    reason: lexical_alternative
  - marker: b
    text: या “उनके वे सब आश्चर्यकर्म” अथवा “उनके वे सब चमत्कार।”
    reason: lexical_alternative
  - marker: c
    text: इब्रानी में शाब्दिक रूप से “मिद्यान के हाथ में”; इसका अर्थ है मिद्यान की शक्ति या अधिकार के अधीन।
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּי אֲדֹנִי
  choice: क्षमा कीजिए, स्वामी
  rationale: בִּי विनम्र निवेदन या बोलने की अनुमति माँगने वाला पद है, और אֲדֹנִי यहाँ आदरसूचक संबोधन है। यह अनुवाद विनम्रता बनाए रखता है, पर इस चरण पर संबोधित व्यक्ति को स्पष्टतः परमेश्वर घोषित नहीं करता।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल में आए परमेश्वर के व्यक्तिगत नाम, चतुरक्षरी नाम, को उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: וְיֵשׁ יְהוָה עִמָּנוּ
  choice: यदि याहवे हमारे साथ हैं
  rationale: शाब्दिक संरचना ‘और याहवे हमारे साथ हैं’ है, पर गिदोन के अगले प्रश्न के साथ यह एक चुनौतीपूर्ण शर्त का भाव देती है। ‘यदि’ आधुनिक हिन्दी में उस तर्क को स्वाभाविक रूप से व्यक्त करता है।
- source_word: לָמָּה מְצָאַתְנוּ כָּל זֹאת
  choice: तो यह सब हमारे साथ क्यों हुआ?
  rationale: מצא यहाँ विपत्ति के किसी पर आ पड़ने या घटित होने के अर्थ में है। चुना हुआ रूप हिन्दी में सहज है और ‘तो’ शर्त से निकलने वाले निष्कर्ष को स्पष्ट करता है।
- source_word: נִפְלְאֹתָיו
  choice: उनके वे सब अद्भुत कार्य
  rationale: यह शब्द विस्मय उत्पन्न करने वाले असाधारण दैवी कार्यों को दर्शाता है। ‘अद्भुत कार्य’ अर्थ को बनाए रखता है और ‘चमत्कार’ की अपेक्षा कम संकीर्ण है।
- source_word: סִפְּרוּ לָנוּ אֲבוֹתֵינוּ
  choice: जिनके विषय में हमारे पूर्वज हमें बताया करते थे
  rationale: אֲבוֹתֵינוּ इस प्रसंग में इस्राएल की पूर्व पीढ़ियों और परंपरा सुनाने वालों को सूचित करता है। ‘पूर्वज’ आधुनिक हिन्दी में स्वाभाविक और समावेशी वंशगत अर्थ देता है।
- source_word: הֲלֹא מִמִּצְרַיִם הֶעֱלָנוּ יְהוָה
  choice: क्या याहवे हमें मिस्र से निकालकर नहीं लाए?
  rationale: प्रश्नवाचक रचना सकारात्मक उत्तर की अपेक्षा करती है। ‘मिस्र से निकालकर लाए’ निर्गमन के ऐतिहासिक उद्धार को सहज हिन्दी में व्यक्त करता है।
- source_word: נְטָשָׁנוּ
  choice: हमें छोड़ दिया है
  rationale: נטש त्याग देने या असहाय छोड़ देने का भाव रखता है। यह रूप गिदोन की शिकायत की भावात्मक तीव्रता को स्पष्ट आधुनिक हिन्दी में संप्रेषित करता है।
- source_word: וַיִּתְּנֵנוּ בְּכַף מִדְיָן
  choice: हमें मिद्यान के हाथ में सौंप दिया है
  rationale: ‘हाथ में’ मूल इब्रानी बिंब को बनाए रखता है, जबकि ‘सौंप दिया’ अधीन कर दिए जाने का आशय स्पष्ट करता है।
- source_word: מִדְיָן
  choice: मिद्यान
  rationale: इब्रानी जाति/प्रदेश के नाम का प्रचलित हिन्दी लिप्यंतरण।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: पद में व्यक्तिगत वाचा-नाम सीधे उपस्थित है। ‘याहवे’ उसका लिप्यंतरण है और उसे किसी उपाधि से प्रतिस्थापित नहीं करता।
- issue: गिदोन के संबोधन אֲדֹנִי का अभिप्राय
  choice: आदरसूचक मानवीय संबोधन ‘स्वामी’
  alternative: दैवी उपाधि ‘प्रभु’
  rationale: इस संवाद के इस बिंदु पर यह शब्द संदेशवाहक के प्रति सम्मानसूचक संबोधन के रूप में समझा जा सकता है। ‘स्वामी’ आदर को रखता है, पर संबोधित व्यक्ति की पहचान के विषय में प्रसंग से अधिक निष्कर्ष नहीं जोड़ता।
- issue: וְיֵשׁ की शर्तात्मक शक्ति
  choice: यदि याहवे हमारे साथ हैं
  alternative: और याहवे हमारे साथ हैं; क्योंकि याहवे हमारे साथ हैं
  rationale: रूपतः वाक्य ‘और’ से आरंभ होता है, लेकिन आगामी ‘तो क्यों’ वाला प्रश्न इसे संदिग्ध शर्त के रूप में प्रस्तुत करता है। ‘यदि’ गिदोन के प्रश्न की वास्तविक तार्किक और धार्मिक तनातनी बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, सहज किंतु गरिमापूर्ण रखी गई है। परमेश्वर के लिए आदरसूचक बहुवचन क्रिया-रूप ‘हैं/लाए’ और सर्वनाम ‘उनके’ प्रयुक्त हुए हैं। गिदोन की शिकायत को नरम नहीं किया गया, ताकि परमेश्वर की उपस्थिति के दावे और इस्राएल की वर्तमान दुर्दशा के बीच मूल धार्मिक तनाव बना रहे।
