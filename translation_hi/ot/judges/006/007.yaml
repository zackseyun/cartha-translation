reference: Judges 6:7
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יְהִ֕י כִּֽי זָעֲק֥וּ בְנֵֽי יִשְׂרָאֵ֖ל אֶל יְהוָ֑ה עַ֖ל אֹד֥וֹת מִדְיָֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/007.yaml
  text: And it happened that[a], when the sons of Israel cried out to Yahweh because of Midian[b],
translation:
  language: hi
  text: और ऐसा हुआ कि जब इस्राएलियों[a] ने मिद्यान के कारण[b] याहवे की दुहाई दी,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “इस्राएल के पुत्रों।”
    reason: मूल इब्रानी अभिव्यक्ति का अधिक शब्दशः रूप बताने के लिए।
  - marker: b
    text: या “मिद्यान के विषय में”; यहाँ भाव मिद्यान के कारण उत्पन्न संकट का है।
    reason: इब्रानी पदबंध की सम्भव शब्दार्थ-सीमा दिखाने के लिए।
lexical_decisions:
- source_word: וַיְהִי כִּי
  choice: और ऐसा हुआ कि जब
  rationale: यह संयोजन कथा में अगली घटना आरम्भ करता है और उसके साथ आने वाले कालवाचक उपवाक्य को जोड़ता है। यह रूप इब्रानी कथात्मक प्रवाह को बनाए रखते हुए आधुनिक हिन्दी में स्वाभाविक है।
- source_word: זָעֲקוּ
  choice: दुहाई दी
  rationale: क्रिया संकट में सहायता के लिए की गई तीव्र पुकार को व्यक्त करती है; ‘दुहाई दी’ हिन्दी में उसी विनतीपूर्ण तात्कालिकता को स्वाभाविक रूप से दर्शाता है।
- source_word: בְנֵי יִשְׂרָאֵל
  choice: इस्राएलियों
  rationale: शाब्दिक अभिव्यक्ति ‘इस्राएल के पुत्र’ है, पर यहाँ पूरे समुदाय का बोध है। ‘इस्राएली’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक सामुदायिक नाम है; शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: אֶל יְהוָה
  choice: याहवे की
  rationale: אֶל पुकार के सम्बोधन की दिशा बताता है। हिन्दी मुहावरे ‘किसी की दुहाई देना’ में यही सम्बन्ध षष्ठी कारक से स्वाभाविक रूप में व्यक्त होता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में परमेश्वर का विशिष्ट वाचा-नाम है; उसका लिप्यंतरण नाम को सामान्य उपाधि में बदलने के बजाय उसकी पहचान सुरक्षित रखता है।
- source_word: עַל אֹדוֹת
  choice: के कारण
  rationale: इस प्रसंग में पदबंध इस्राएल की पुकार का कारण बताता है। ‘के कारण’ स्पष्ट और सहज हिन्दी समतुल्य है।
- source_word: מִדְיָן
  choice: मिद्यान
  rationale: यह लोगों अथवा उनके क्षेत्र का पारंपरिक हिन्दी नाम है और प्रसंग में इस्राएल के संकट के स्रोत को सूचित करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: इब्रानी पाठ यहाँ चार अक्षरों वाला विशिष्ट ईश्वरीय नाम रखता है। ‘याहवे’ उसका निकट लिप्यंतरण है और नाम तथा उपाधि के बीच का भेद बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक रखी गई है। पद अगले वाक्य में पूर्ण होने वाला आश्रित खंड है, इसलिए अंत में अल्पविराम रखा गया है। ‘दुहाई दी’ संकट में सहायता की पुकार को साधारण ‘पुकारा’ से अधिक सटीक ढंग से व्यक्त करता है।
