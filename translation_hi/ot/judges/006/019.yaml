base_translation:
  language: en
  yaml_path: translation/ot/judges/006/019.yaml
  text: Then Gideon went in and prepared a young goat and unleavened bread from an ephah of flour[a]. He put the meat in a basket and the broth in a pot[b], and brought them out to him under the terebinth and presented them.
translation:
  language: hi
  text: तब गिदोन भीतर गया और उसने बकरी का एक बच्चा पकाया और एक एपा आटे से अखमीरी रोटियाँ बनाईं। उसने मांस को टोकरी में और शोरबे को हाँड़ी में रखा। फिर वह यह सब निकालकर उसके पास टेरिबिन्थ वृक्ष के नीचे ले आया और उसके सामने रख दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּא
  choice: भीतर गया
  rationale: संदर्भ में गिदोन अतिथि के पास से भोजन तैयार करने के स्थान की ओर जाता है; इसलिए केवल ‘आया’ की अपेक्षा ‘भीतर गया’ प्रसंगानुकूल है।
- source_word: וַיַּעַשׂ גְּדִי עִזִּים
  choice: बकरी का एक बच्चा पकाया
  rationale: भोजन के प्रसंग में עשה का अर्थ ‘तैयार करना’ है। हिन्दी में जीवित पशु को ‘तैयार किया’ कहना अस्वाभाविक होता, इसलिए ‘पकाया’ से भोजन की तैयारी स्वाभाविक रूप में व्यक्त होती है।
- source_word: אֵיפַת קֶמַח
  choice: एक एपा मैदा
  rationale: विशिष्ट प्राचीन माप ‘एपा’ को सामान्य ‘एक माप’ में नहीं बदला गया; קֶמַח के लिए भोजन-संदर्भ में सहज ‘मैदा’ चुना गया है।
- source_word: מַצּוֹת
  choice: अखमीरी रोटियाँ
  rationale: यह खमीर के बिना बने भोजन को दर्शाता है; ‘अखमीरी रोटियाँ’ हिन्दी बाइबलीय प्रयोग में स्पष्ट और स्वाभाविक है।
- source_word: הַבָּשָׂר
  choice: मांस
  rationale: भोजन के संदर्भ में यह सीधा और स्वाभाविक हिन्दी पर्याय है।
- source_word: סַּל
  choice: टोकरी
  rationale: यह वस्तुएँ रखने या ले जाने की टोकरी के लिए सामान्य और स्पष्ट शब्द है।
- source_word: הַמָּרַק
  choice: शोरबा
  rationale: शब्द पकाने से निकले तरल अथवा रसदार शोरबे को दर्शाता है; ‘शोरबा’ इस पाक-संदर्भ में सर्वाधिक उपयुक्त है।
- source_word: פָּרוּר
  choice: हाँड़ी
  rationale: यह पकाने अथवा तरल रखने के पात्र को दर्शाता है; ‘हाँड़ी’ आधुनिक हिन्दी में ठोस और प्रसंगानुकूल है।
- source_word: וַיּוֹצֵא אֵלָיו
  choice: यह सब निकालकर उसके पास ले आया
  rationale: हिब्रू में प्रत्यक्ष कर्म व्यक्त नहीं है। ‘यह सब’ मांस, शोरबे और रोटियों को सामूहिक रूप से समेटता है और हिन्दी में स्वाभाविक है।
- source_word: תַּחַת הָאֵלָה
  choice: पिस्ता-वृक्ष के नीचे
  rationale: אֵלָה सामान्यतः टेरिबिन्थ अथवा पिस्ता-कुल के वृक्ष को दर्शाता है। ‘पिस्ता-वृक्ष’ हिन्दी पाठक के लिए ‘टेरिबिन्थ’ से अधिक बोधगम्य है; पारंपरिक ‘बांज’ विकल्प को पादटिप्पणी में रखा गया है।
- source_word: וַיַּגַּשׁ
  choice: उसके सामने रख दिया
  rationale: क्रिया का मूल भाव पास लाना अथवा प्रस्तुत करना है। आतिथ्य के इस प्रसंग में ‘सामने रख दिया’ स्वाभाविक है और इसे समय से पहले बलिदान के रूप में नहीं बताता।
theological_decisions:
- issue: गिदोन के कार्य में संभावित बलिदानी भाव
  choice: आतिथ्य के रूप में भोजन सामने रखने की भाषा
  alternative: उसने उसे बलि के रूप में चढ़ाया
  rationale: इस पद में भोजन तैयार करने, बाहर लाने और पास रखने की क्रियाएँ हैं; बलिदान स्पष्ट रूप से नहीं कहा गया। आगे के घटनाक्रम में बलिदानी संकेत उभर सकते हैं, पर उन्हें इस पद में पहले से आरोपित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक रखी गई है। ‘एपा’ जैसी स्रोत-पाठ की विशिष्टता बनाए रखते हुए पादटिप्पणी से अर्थ-सहायता दी गई है। ‘अखमीरी’, ‘शोरबा’ और ‘हाँड़ी’ सामान्य हिन्दी पाठकों के लिए परिचित तथा प्रसंगानुकूल हैं।
