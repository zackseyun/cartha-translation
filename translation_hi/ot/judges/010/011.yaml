id: JDG.10.11
reference: Judges 10:11
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ֥/יֹּאמֶר יְהוָ֖ה אֶל בְּנֵ֣י יִשְׂרָאֵ֑ל הֲ/לֹ֤א מִ/מִּצְרַ֨יִם֙ וּ/מִן הָ֣/אֱמֹרִ֔י וּ/מִן בְּנֵ֥י עַמּ֖וֹן וּ/מִן פְּלִשְׁתִּֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/010/011.yaml
  text: And Yahweh said to the sons of Israel[a], “Was it not from Egypt, and from the Amorites, and from the Ammonites, and from the Philistines[b], that I delivered you?"
translation:
  language: hi
  text: और यहोवा ने इस्राएलियों[a] से कहा, “क्या मैंने तुम्हें मिस्र से, एमोरियों से, अम्मोनियों से और पलिश्तियों से नहीं छुड़ाया था?”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप से: “इस्राएल के पुत्रों।” यहाँ यह इस्राएली समुदाय के लिए प्रयुक्त है।'
    reason: lexical_alternative
  - marker: b
    text: 'इब्रानी वाक्य में ‘मैंने तुम्हें ... छुड़ाया था’ क्रिया स्पष्ट रूप से नहीं है; वह निकटवर्ती संदर्भ से समझी जाती है। शाब्दिक सूची है: “मिस्र से, एमोरियों से, अम्मोनियों से और पलिश्तियों से।”'
    reason: source_ellipsis
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: ने कहा
  rationale: कथात्मक क्रम में אמר का स्वाभाविक आधुनिक हिन्दी रूप ‘कहा’ है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है, किसी उपाधि से नहीं।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएलियों
  rationale: यहाँ शाब्दिक ‘इस्राएल के पुत्र’ एक जातीय समुदाय का मुहावरा है; आधुनिक हिन्दी में ‘इस्राएलियों’ अधिक स्वाभाविक और समावेशी है।
- source_word: הֲלֹא
  choice: क्या ... नहीं
  rationale: नकारात्मक प्रश्नवाचक कण का बल एक आलंकारिक प्रश्न के रूप में सुरक्षित रहता है।
- source_word: מִמִּצְרַיִם
  choice: मिस्रियों के हाथ से
  rationale: सूची में अन्य उत्पीड़क जातियों के समानांतर ‘मिस्र’ को लोगों के अर्थ में व्यक्त किया गया है; ‘के हाथ से’ מן के मुक्ति-स्रोत संबंध को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: הָאֱמֹרִי
  choice: एमोरियों
  rationale: इब्रानी एकवचन सामूहिक जातिनाम को हिन्दी बहुवचन जातिनाम से व्यक्त किया गया है।
- source_word: בְּנֵי עַמּוֹן
  choice: अम्मोनियों
  rationale: शाब्दिक ‘अम्मोन के पुत्र’ के स्थान पर मानक और स्वाभाविक जातिनाम चुना गया है।
- source_word: פְּלִשְׁתִּים
  choice: पलिश्तियों
  rationale: इब्रानी जातिनाम का हिन्दी में प्रचलित बाइबलीय रूप।
- source_word: '[संदर्भ से निहित क्रिया]'
  choice: मैंने तुम्हें ... छुड़ाया था
  rationale: इब्रानी पद अपने आप में अपूर्ण/लुप्तक्रियात्मक है; निकटवर्ती संदर्भ से उद्धार की क्रिया लेकर हिन्दी वाक्य को स्पष्ट किया गया है। ‘छुड़ाया’ न्यायियों की पुस्तक में शत्रुओं के अधिकार से बचाने का भाव देता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का रूप
  choice: यहोवा
  alternative: याहवे
  rationale: हिन्दी पाठकों में परिचित व्यक्तिगत नाम ‘यहोवा’ रखा गया है; इसे ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित नहीं किया गया।
- issue: בְּנֵי יִשְׂרָאֵל का शाब्दिक या मुहावरेदार अनुवाद
  choice: इस्राएलियों
  alternative: इस्राएल के पुत्रों
  rationale: यह पद समुदाय के जातीय नाम के रूप में प्रयुक्त है। ‘इस्राएलियों’ आधुनिक हिन्दी में स्वाभाविक है और पूरे संबोधित समुदाय को दर्शाता है; शाब्दिक रूप पादटिप्पणी में दिया गया है।
- issue: लुप्त क्रिया की पूर्ति
  choice: क्या मैंने तुम्हें ... नहीं छुड़ाया था?
  alternative: क्या मिस्र से, और एमोरियों से, और अम्मोनियों से, और पलिश्तियों से नहीं?
  rationale: मूल की अपूर्णता वास्तविक है, पर अकेले हिन्दी पद में अर्थ ग्रहण करने हेतु संदर्भगत क्रिया जोड़ी गई है। पादटिप्पणी इस संपादकीय पूर्ति को पारदर्शी बनाती है।
- issue: מִמִּצְרַיִם में स्थान या लोगों का संकेत
  choice: मिस्रियों के हाथ से
  alternative: मिस्र से
  rationale: आगे की तीन जातियों के समानांतर और शत्रुओं से छुड़ाने के संदर्भ में यहाँ मिस्र के लोगों/सत्ता का भाव संभावित है। फिर भी शाब्दिक ‘मिस्र से’ पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। आलंकारिक प्रश्न का स्वर सुरक्षित है। जातिनामों के लिए प्रचलित हिन्दी बाइबलीय रूप अपनाए गए हैं और मूल की लुप्तक्रियात्मकता पादटिप्पणी में स्पष्ट की गई है।
