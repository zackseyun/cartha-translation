source:
  edition: WLC
  text: וַ/יֹּאמְר֨וּ בְנֵי יִשְׂרָאֵ֤ל אֶל יְהוָה֙ חָטָ֔אנוּ עֲשֵׂה אַתָּ֣ה לָ֔/נוּ כְּ/כָל הַ/טּ֖וֹב בְּ/עֵינֶ֑י/ךָ אַ֛ךְ הַצִּילֵ֥/נוּ נָ֖א הַ/יּ֥וֹם הַ/זֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/010/015.yaml
  text: And the sons of Israel said to Yahweh[a], “We have sinned. Do to us according to all that is good in your eyes[c][b]. Only please deliver us this day.”
translation:
  language: hi
  text: तब इस्राएल के पुत्रों ने याहवे[a] से कहा, “हमने पाप किया है। तेरी दृष्टि में जो कुछ अच्छा हो[b], उसके अनुसार हमारे साथ कर; केवल आज ही, कृपा करके, हमें छुड़ा ले[c]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इस्राएलियों।”
    reason: lexical_alternative
  - marker: b
    text: 'शाब्दिक: “तेरी दृष्टि में जो कुछ अच्छा है, उसके अनुसार।” अर्थात् जैसा तुझे अच्छा लगे।'
    reason: lexical_alternative
  - marker: c
    text: या, “हमें बचा ले” या “हमारा उद्धार कर।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: तब ... ने कहा
  rationale: वय्यिक्तोल कथा को आगे बढ़ाता है; हिन्दी में ‘तब’ स्वाभाविक कथात्मक प्रवाह देता है, बिना समय-संबंध को अत्यधिक स्पष्ट किए।
- source_word: בְנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों
  rationale: यह स्रोत के ‘इस्राएल के पुत्र’ मुहावरे और उसके पुल्लिंग रूप को सुरक्षित रखता है; ‘इस्राएली’ अधिक सहज वैकल्पिक रूप होता।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चतुर्वर्णीय व्यक्तिगत नाम को उपाधि से बदलने के बजाय हिन्दी में प्रचलित नामरूप ‘यहोवा’ से व्यक्त किया गया है।
- source_word: חָטָאנוּ
  choice: हमने पाप किया है
  rationale: सम्पन्न स्वीकारोक्ति का पश्चात्तापपूर्ण बल वर्तमान-सम्बद्ध पूर्ण रूप से स्वाभाविक हिन्दी में आता है।
- source_word: עֲשֵׂה אַתָּה לָנוּ
  choice: वही हमारे साथ कर
  rationale: עשה עם ל का आशय उनके प्रति वैसा व्यवहार करना है; ‘हमारे साथ कर’ हिन्दी में स्वाभाविक रहते हुए समर्पण की तीक्ष्णता रखता है।
- source_word: כְּכָל הַטּוֹב בְּעֵינֶיךָ
  choice: जो कुछ तेरी दृष्टि में अच्छा हो
  rationale: यह ‘तेरी दृष्टि में अच्छा’ की इब्रानी छवि को रखता है और כְּכָל की व्यापकता को ‘जो कुछ’ से व्यक्त करता है।
- source_word: אַךְ
  choice: केवल
  rationale: यह पूर्ण समर्पण के बाद रखी गई एकमात्र विनती को सीमितकारी ढंग से व्यक्त करता है।
- source_word: הַצִּילֵנוּ
  choice: हमें छुड़ा ले
  rationale: נצל के हिफ़ील का अर्थ संकट से बचाना या छुड़ाना है; ‘छुड़ा ले’ तत्काल शत्रु-संकट के प्रसंग में स्वाभाविक है।
- source_word: נָא
  choice: विनती के भाव में ‘ले’
  rationale: नָא की विनम्र अनुनय-शक्ति हिन्दी की संयुक्त आज्ञार्थक अभिव्यक्ति ‘छुड़ा ले’ और पूरे वाक्य के विनतीपूर्ण प्रसंग से संप्रेषित होती है; अलग ‘कृपया’ यहाँ कम स्वाभाविक लगता है।
- source_word: הַיּוֹם הַזֶּה
  choice: आज
  rationale: शाब्दिक ‘इस दिन’ की तत्कालता आधुनिक हिन्दी में ‘आज’ से अधिक स्वाभाविक और पूर्णतः स्पष्ट होती है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का रूप
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम का प्रयोग करता है। हिन्दी पाठकों के लिए प्रतिष्ठित और पहचाना हुआ लिप्यंतरण ‘यहोवा’ चुना गया, न कि ‘प्रभु’ जैसी प्रतिस्थापन-उपाधि।
- issue: בְנֵי יִשְׂרָאֵל का प्रतिनिधित्व
  choice: इस्राएल के पुत्रों
  alternative: इस्राएलियों
  rationale: मूल की वंशपरक और व्याकरणतः पुल्लिंग अभिव्यक्ति को औपचारिक रूप से सुरक्षित रखा गया है, यद्यपि प्रसंग में यह समुदाय को सूचित करती है।
- issue: परमेश्वर के न्याय के प्रति समर्पण और उद्धार की विनती
  choice: जो कुछ तेरी दृष्टि में अच्छा हो, वही हमारे साथ कर; केवल आज हमें छुड़ा ले
  alternative: जैसा तुझे ठीक लगे, हमारे साथ कर, पर आज हमें बचा ले
  rationale: अनुवाद न्याय स्वीकार करने और साथ ही तत्काल छुटकारे की विनती के बीच मूल तनाव को बनाए रखता है; उसे पूर्ण पश्चात्ताप या किसी निश्चित दैवी उत्तर के रूप में नहीं समझाता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। प्रत्यक्ष वाणी में एकवचन ‘तेरी’ मूल के द्वितीय पुरुष एकवचन को स्पष्ट रखता है। अर्धविराम समर्पण और सीमित विनती के बीच संबंध दिखाता है।
