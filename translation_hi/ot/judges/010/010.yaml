  text: Then the sons of Israel cried out to the LORD, saying, “We have sinned against you, because we have forsaken our God and have served the Baals.”
translation:
  language: hi
  text: तब इस्राएलियों ने यहोवा को पुकारकर कहा, “हमने आपके विरुद्ध पाप किया है, क्योंकि हमने अपने परमेश्वर को छोड़ दिया और बाल देवताओं की सेवा की।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּזְעֲקוּ
  choice: दुहाई देकर कहा
  rationale: यह क्रिया संकट में सहायता के लिए ऊँचे स्वर से पुकारने का भाव रखती है; ‘दुहाई देकर कहा’ अगले לֵאמֹר के साथ स्वाभाविक हिंदी में दोनों भाव व्यक्त करता है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएलियों
  rationale: शाब्दिक ‘इस्राएल के पुत्रों’ के बजाय आधुनिक हिंदी में पूरे समुदाय के लिए स्वाभाविक सामूहिक पद।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ में आए परमेश्वर के विशिष्ट नाम को उपाधि से प्रतिस्थापित किए बिना हिंदी के प्रचलित रूप में रखा गया है।
- source_word: חָטָאנוּ לָךְ
  choice: हमने आपके विरुद्ध पाप किया है
  rationale: לְ यहाँ अपराध के लक्ष्य/संबंध को बताता है; ‘आपके विरुद्ध’ हिंदी में इसे स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: וְכִי
  choice: क्योंकि
  rationale: यह स्वीकारोक्ति के कारण अथवा स्पष्टीकरण का परिचय देता है।
- source_word: הַבְּעָלִים
  choice: बाल देवताओं
  rationale: बहुवचन रूप को सुरक्षित रखते हुए पाठकों को स्पष्ट किया गया है कि संदर्भ विभिन्न ‘बाल’ देवताओं/स्थानीय रूपों का है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: विशिष्ट व्यक्तिगत नाम और सामान्य उपाधि के बीच मूल पाठ का भेद बनाए रखा गया है।
- issue: הַבְּעָלִים का बहुवचन
  choice: बाल देवताओं
  alternative: बाल
  rationale: हिब्रू बहुवचन को स्पष्ट रखा गया है और किसी एक देवता तक अर्थ को सीमित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। संबोधन में ‘आपके’ से सामूहिक वक्ताओं की विनम्र प्रत्यक्ष प्रार्थना व्यक्त होती है; वाक्य की स्वीकारोक्तिपूर्ण गंभीरता सुरक्षित है।
