id: JDG.10.18
reference: Judges 10:18
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּאמְר֨וּ הָ/עָ֜ם שָׂרֵ֤י גִלְעָד֙ אִ֣ישׁ אֶל רֵעֵ֔/הוּ מִ֣י הָ/אִ֔ישׁ אֲשֶׁ֣ר יָחֵ֔ל לְ/הִלָּחֵ֖ם בִּ/בְנֵ֣י עַמּ֑וֹן יִֽהְיֶ֣ה לְ/רֹ֔אשׁ לְ/כֹ֖ל יֹשְׁבֵ֥י גִלְעָֽד־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/010/018.yaml
  text: And the people[a], the leaders of Gilead, said to one another, “Who is the man who will begin to fight against the sons of Ammon? He shall become head over all the inhabitants of Gilead.”
translation:
  language: hi
  text: और लोगों ने, अर्थात गिलाद के प्रधानों ने, एक-दूसरे से कहा, “वह कौन पुरुष है जो अम्मोनियों से लड़ना आरम्भ करेगा? वही गिलाद के सब निवासियों का मुखिया होगा।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָעָם שָׂרֵי גִלְעָד
  choice: लोगों ने, अर्थात गिलाद के प्रधानों ने
  rationale: दोनों पद बिना संयोजक के साथ रखे गए हैं; इन्हें समानाधिकरण मानकर वक्ताओं को ‘लोग’, यानी गिलाद के प्रधान, बताया गया है। इससे इब्रानी के दोनों तत्व सुरक्षित रहते हैं।
- source_word: אִישׁ אֶל־רֵעֵהוּ
  choice: एक-दूसरे से
  rationale: शाब्दिक अर्थ ‘हर पुरुष अपने साथी से’ है, पर यहाँ पारस्परिक बातचीत का स्वाभाविक हिन्दी रूप ‘एक-दूसरे से’ है।
- source_word: מִי הָאִישׁ
  choice: वह कौन पुरुष है
  rationale: स्रोत में स्पष्ट אִישׁ (‘पुरुष’) है और प्रसंग सैनिक नेतृत्व के लिए पुरुष की खोज का है; इसलिए इसे लिंग-निरपेक्ष नहीं किया गया।
- source_word: יָחֵל לְהִלָּחֵם
  choice: लड़ना आरम्भ करेगा
  rationale: יָחֵל का हिफ़ील रूप यहाँ ‘आरम्भ करना’ और לְהִלָּחֵם युद्ध करने को व्यक्त करता है; भावी नेतृत्व संबंधी प्रश्न के अनुसार भविष्यकाल रखा गया है।
- source_word: בִּבְנֵי עַמּוֹן
  choice: अम्मोनियों से
  rationale: शाब्दिक ‘अम्मोन के पुत्रों’ का आशय अम्मोन जाति से है; ‘अम्मोनी’ आधुनिक हिन्दी में स्वाभाविक जातिनाम है और ‘से लड़ना’ हिन्दी का प्रचलित प्रयोग है।
- source_word: יִהְיֶה לְרֹאשׁ
  choice: वही ... का मुखिया होगा
  rationale: רֹאשׁ का नेतृत्व-संबंधी रूपक ‘मुखिया’ से स्पष्ट और स्वाभाविक ढंग से व्यक्त होता है। ‘वही’ प्रश्न में बताए गए पुरुष को परिणामस्वरूप मिलने वाला पद रेखांकित करता है।
- source_word: לְכֹל יֹשְׁבֵי גִלְעָד
  choice: गिलाद के सब निवासियों का
  rationale: यह गिलाद में रहने वाले समस्त लोगों पर नेतृत्व के विस्तार को व्यक्त करता है।
theological_decisions:
- issue: नेतृत्व-चयन के प्रसंग में स्पष्ट पुल्लिंग शब्द אִישׁ का अनुवाद
  choice: ‘पुरुष’ को मुख्य पाठ में बनाए रखा गया
  alternative: ‘व्यक्ति’ या केवल ‘कौन’
  rationale: इब्रानी में पुल्लिंग संज्ञा स्पष्ट है और प्रसंग प्राचीन इस्राएल में सैनिक नेता के चयन का है; अतः स्रोत की लैंगिक विशिष्टता को सुरक्षित रखा गया।
- issue: יִהְיֶה לְרֹאשׁ में नेतृत्व की प्रकृति
  choice: ‘मुखिया होगा’
  alternative: ‘प्रधान बनेगा’ या ‘सिर होगा’
  rationale: ‘मुखिया’ नेतृत्व और अधिकार का भाव स्पष्ट करता है, जबकि शाब्दिक ‘सिर’ हिन्दी में इस संदर्भ में अस्वाभाविक होता। पाठ नेतृत्व के सटीक संस्थागत स्वरूप को परिभाषित नहीं करता, इसलिए कोई अधिक विशिष्ट पदवी नहीं जोड़ी गई।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘आरम्भ करेगा’ स्रोत के आरम्भकारी भाव को बनाए रखता है; ‘प्रधानों’ और ‘मुखिया’ से שָׂרִים तथा רֹאשׁ के अलग-अलग नेतृत्व-सूचक पदों का भेद भी बना रहता है।
