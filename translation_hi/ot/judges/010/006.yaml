  text: וַ/יֹּסִ֣פוּ בְּנֵ֣י יִשְׂרָאֵ֗ל לַ/עֲשׂ֣וֹת הָ/רַע֮ בְּ/עֵינֵ֣י יְהוָה֒ וַ/יַּעַבְד֣וּ אֶת הַ/בְּעָלִ֣ים וְ/אֶת הָ/עַשְׁתָּר֡וֹת וְ/אֶת אֱלֹהֵ֣י אֲרָם֩ וְ/אֶת אֱלֹהֵ֨י צִיד֜וֹן וְ/אֵ֣ת אֱלֹהֵ֣י מוֹאָ֗ב וְ/אֵת֙ אֱלֹהֵ֣י בְנֵי עַמּ֔וֹן וְ/אֵ֖ת אֱלֹהֵ֣י פְלִשְׁתִּ֑ים וַ/יַּעַזְב֥וּ אֶת יְהוָ֖ה וְ/לֹ֥א עֲבָדֽוּ/הוּ׀־־־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/010/006.yaml
  text: And the sons of Israel again did what was evil in the eyes of Yahweh[a], and they served the Baals and the Ashtoreths, and the gods of Aram, the gods of Sidon, the gods of Moab, the gods of the sons of Ammon, and the gods of the Philistines[b]. They forsook Yahweh and did not serve him.
translation:
  language: hi
  text: इस्राएलियों ने फिर वह किया जो याहवे[a] की दृष्टि में बुरा था। उन्होंने बाअलों, अश्तोरेतों, अराम के देवताओं, सीदोन के देवताओं, मोआब के देवताओं, अम्मोनियों के देवताओं और पलिश्तियों के देवताओं की सेवा की। उन्होंने याहवे को छोड़ दिया और उसकी सेवा नहीं की।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इस्राएली वही करते रहे जो याहवे की दृष्टि में बुरा था।” हिब्रू क्रिया दोबारा करने या करते रहने—दोनों भाव व्यक्त कर सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּסִפוּ
  choice: फिर वही किया
  rationale: יסף के साथ infinitive यहाँ दोहराव या निरंतरता व्यक्त कर सकता है। न्यायियों की आवर्ती कथा-शैली में ‘फिर वही किया’ चक्र के दोहराव को स्वाभाविक हिन्दी में व्यक्त करता है; दूसरा संभव अर्थ पादटिप्पणी में रखा गया है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएलियों
  rationale: शाब्दिक ‘इस्राएल के पुत्र’ की अपेक्षा आधुनिक हिन्दी में जातीय समुदाय के लिए ‘इस्राएली’ अधिक स्वाभाविक और स्पष्ट है।
- source_word: לַעֲשׂוֹת הָרַע בְּעֵינֵי יְהוָה
  choice: वही किया जो यहोवा की दृष्टि में बुरा था
  rationale: हिब्रू के मूल्यांकन-संबंधी मुहावरे ‘आँखों में’ को हिन्दी के समतुल्य गरिमापूर्ण मुहावरे ‘दृष्टि में’ से व्यक्त किया गया है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: टेट्राग्रामाटन को उपाधि से बदलने के बजाय हिन्दी में व्यापक रूप से पहचाने जाने वाले नाम-रूप ‘यहोवा’ से व्यक्त किया गया है।
- source_word: וַיַּעַבְדוּ / עֲבָדוּהוּ
  choice: सेवा करने लगे / सेवा नहीं की
  rationale: עבד का मूल अर्थ ‘सेवा करना’ है। दोनों खंडों में यही शब्द रखकर मूर्तियों की सेवा और यहोवा की सेवा न करने के बीच का आलंकारिक विरोध सुरक्षित रखा गया है।
- source_word: הַבְּעָלִים
  choice: बाल देवताओं
  rationale: बहुवचन स्थानीय बाल-रूपों या उनसे जुड़े देवताओं को सूचित करता है। हिन्दी में बहुवचन स्पष्ट करने के लिए ‘देवताओं’ जोड़ा गया है।
- source_word: הָעַשְׁתָּרוֹת
  choice: अश्तोरेत देवियों
  rationale: हिब्रू स्त्रीलिंग बहुवचन और बाल देवताओं के समानांतर cultic नाम को स्पष्ट हिन्दी बहुवचन में रखा गया है।
- source_word: אֱלֹהֵי אֲרָם / צִידוֹן / מוֹאָב / פְלִשְׁתִּים
  choice: अराम, सीदोन, मोआब ... तथा पलिश्तियों के देवताओं
  rationale: भौगोलिक और जातीय नामों को लिप्यंतरित रखते हुए construct श्रृंखला को सहज हिन्दी सूची में व्यक्त किया गया है।
- source_word: אֱלֹהֵי בְנֵי עַמּוֹן
  choice: अम्मोनियों के देवताओं
  rationale: शाब्दिक ‘अम्मोन के पुत्रों के देवता’ का आशय आधुनिक हिन्दी में स्वाभाविक जातिवाचक ‘अम्मोनियों के देवता’ से स्पष्ट होता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का रूप
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ के व्यक्तिगत वाचा-नाम को ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित नहीं किया गया। हिन्दी पाठकों में स्थापित और स्पष्ट नाम-रूप ‘यहोवा’ चुना गया; ‘याहवे’ अधिक प्रत्यक्ष शैक्षिक लिप्यंतरण है।
- issue: मूर्तिपूजा के प्रसंग में עבד का अर्थ
  choice: सेवा करना
  alternative: पूजा करना
  rationale: ‘सेवा करना’ मूल क्रिया की व्यापक निष्ठा और अधीनता को बनाए रखता है तथा अंतिम खंड में उसी क्रिया की पुनरावृत्ति से बना विरोध सुरक्षित करता है।
- issue: וַיֹּסִפוּ में दोहराव या निरंतरता
  choice: फिर वही किया
  alternative: बुरा करते रहे
  rationale: दोनों अर्थ व्याकरणतः संभव हैं। न्यायियों की आवर्ती सूत्रात्मक भाषा में पुनरावृत्ति मुख्य पाठ में स्वाभाविक है, जबकि निरंतरता की संभावना पादटिप्पणी में संरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, कथात्मक और सामान्य पाठकों के लिए सहज रूप। जातिवाचक नाम स्वाभाविक हिन्दी में हैं; प्रमुख धार्मिक नामों का लिप्यंतरण रखा गया है। सूची की पुनरुक्ति को कुछ संक्षिप्त किया गया है, पर सभी समूह और मूल का क्रम सुरक्षित हैं।
