base_translation:
  language: en
  yaml_path: translation/ot/judges/010/013.yaml
  text: But you have forsaken me and served other gods[a]; therefore I will no longer save you.
translation:
  language: hi
  text: परन्तु तुमने मुझे त्याग दिया और दूसरे देवताओं की सेवा की; इसलिए अब मैं तुम्हें नहीं बचाऊँगा[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘छुड़ाऊँगा’ अथवा ‘उद्धार करूँगा’। हिब्रू क्रिया शत्रुओं से छुटकारा देने के साथ-साथ व्यापक अर्थ में बचाने को भी व्यक्त कर सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתֶּם
  choice: परन्तु तुमने
  rationale: संयोजक के साथ स्पष्ट सर्वनाम प्रसंग में विरोध और बल व्यक्त करता है; आधुनिक हिन्दी में ‘परन्तु तुमने’ इसे स्वाभाविक रूप से प्रकट करता है।
- source_word: עֲזַבְתֶּם אֹתִי
  choice: मुझे त्याग दिया
  rationale: עזב का अर्थ छोड़ना या त्यागना है; ‘त्याग दिया’ सम्बन्ध और निष्ठा तोड़ने की गंभीरता बनाए रखता है।
- source_word: וַתַּעַבְדוּ אֱלֹהִים אֲחֵרִים
  choice: और दूसरे देवताओं की सेवा की
  rationale: देवताओं के सम्बन्ध में עבד धार्मिक सेवा और निष्ठा को दर्शाता है। ‘सेवा की’ मूल अभिव्यक्ति की व्यापकता रखता है और केवल किसी एक उपासना-विधि तक अर्थ को सीमित नहीं करता।
- source_word: לָכֵן
  choice: इसलिए
  rationale: यह उनके काम और उसके परिणामस्वरूप घोषित न्याय के बीच स्पष्ट कारणात्मक सम्बन्ध दिखाता है।
- source_word: לֹא אוֹסִיף לְהוֹשִׁיעַ אֶתְכֶם
  choice: अब मैं तुम्हें फिर नहीं बचाऊँगा
  rationale: नकार के साथ יסף आगे ऐसा न करने या पुनः न करने का भाव देता है। ישע बचाने, छुड़ाने या संकट से मुक्त करने को दर्शा सकता है; ‘बचाऊँगा’ आधुनिक हिन्दी में स्वाभाविक और पर्याप्त रूप से व्यापक है।
theological_decisions:
- issue: न्यायियों के प्रसंग में ישע द्वारा व्यक्त परमेश्वर का बचाव
  choice: बचाऊँगा
  alternative: छुड़ाऊँगा; उद्धार करूँगा
  rationale: तात्कालिक प्रसंग शत्रुओं और अत्याचार से छुटकारे का है, पर हिब्रू क्रिया का अर्थ इससे व्यापक भी हो सकता है। ‘बचाऊँगा’ दोनों आयामों के लिए खुला रहता है; पादटिप्पणी प्रसंगानुकूल विकल्प सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘परन्तु’, ‘त्याग दिया’ और ‘इसलिए’ वचन के विरोध, सम्बन्ध-विच्छेद और न्यायात्मक परिणाम को स्पष्ट रखते हैं। पादटिप्पणी का चिह्न उसी शब्द पर लगाया गया है जिसके लिए शाब्दिक विकल्प दिए गए हैं।
