  text: וַֽ/יְהִי ל֞/וֹ שְׁלֹשִׁ֣ים בָּנִ֗ים רֹֽכְבִים֙ עַל שְׁלֹשִׁ֣ים עֲיָרִ֔ים וּ/שְׁלֹשִׁ֥ים עֲיָרִ֖ים לָ/הֶ֑ם לָ/הֶ֞ם יִקְרְא֣וּ חַוֺּ֣ת יָאִ֗יר עַ֚ד הַ/יּ֣וֹם הַ/זֶּ֔ה אֲשֶׁ֖ר בְּ/אֶ֥רֶץ הַ/גִּלְעָֽד־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/010/004.yaml
  text: He had thirty sons, riding on thirty donkeys, and they had thirty towns. To this day they are called Havvoth-jair, which are in the land of Gilead.
translation:
  language: hi
  text: उसके तीस बेटे थे, जो तीस गधों पर सवार थे; और उनके पास तीस नगर थे। ये आज तक ‘हव्वोत-याईर’[a] कहलाते हैं, जो गिलाद देश में हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘हव्वोत-याईर’ का अर्थ संभवतः ‘याईर की बस्तियाँ’ या ‘याईर के डेरे/गाँव’ है।
    reason: इब्रानी स्थान-नाम का अर्थ बताना, साथ ही חַוּוֹת के सटीक अर्थ में मौजूद व्यापकता को बनाए रखना।
lexical_decisions:
- source_word: עֲיָרִים (पहला प्रयोग)
  choice: जवान गधों
  rationale: यहाँ शब्द नर गधों अथवा गधों के बच्चों को सूचित करता है; ‘जवान गधों’ आधुनिक हिन्दी में स्वाभाविक है और सवारी के योग्य पशुओं का भाव रखता है।
- source_word: עֲיָרִים (दूसरा प्रयोग)
  choice: नगर
  rationale: संदर्भ में इसका अर्थ बस्तियाँ/नगर है। ‘नगर’ मूल के तीस शासित स्थानों को संक्षेप और स्पष्ट रूप से व्यक्त करता है, साथ ही इब्रानी में पशुओं और नगरों के बीच मौजूद ध्वनि-साम्य अनुवाद में कृत्रिम शब्द-खेल बनाकर नहीं थोपा गया।
- source_word: לָהֶם
  choice: उनके अधिकार में
  rationale: शाब्दिक ‘उनके पास’ के बजाय यह भूमि-स्वामित्व अथवा नियंत्रण का आशय स्वाभाविक हिन्दी में देता है, बिना यह तय किए कि प्रत्येक पुत्र का ठीक एक नगर था।
- source_word: חַוֺּת יָאִיר
  choice: हव्वोत-याईर
  rationale: यह स्थान-समूह का पारंपरिक इब्रानी नाम है, इसलिए इसका लिप्यंतरण किया गया है; अर्थ पादटिप्पणी में दिया गया है।
- source_word: עַד הַיּוֹם הַזֶּה
  choice: आज तक
  rationale: इब्रानी मुहावरे का सहज आधुनिक हिन्दी रूप, जो कथावाचक के समय तक नाम बने रहने को दर्शाता है।
theological_decisions:
- issue: तीस पुत्रों, तीस गधों और तीस नगरों के संबंध की व्याख्या
  choice: वाक्य में समान संख्या को रखा, पर प्रत्येक पुत्र को एक निश्चित नगर बाँटने की बात नहीं जोड़ी
  alternative: हर एक पुत्र के पास एक गधा और एक नगर था
  rationale: मूल पाठ समानांतर संख्याएँ देता है, लेकिन स्पष्ट रूप से एक-एक का वितरण नहीं बताता; अनुवाद उस संभावित संकेत को व्याख्या बनाकर निश्चित नहीं करता।
translation_notes:
  register: आधुनिक, सरल और गरिमापूर्ण हिन्दी अपनाई गई है। ‘सवारी करते थे’ प्रतिष्ठा और संपन्नता के सांस्कृतिक संकेत को बिना अतिरिक्त व्याख्या के बनाए रखता है। ‘गिलाद देश’ परिचित बाइबलीय भौगोलिक अभिव्यक्ति है।
