source:
  edition: WLC
  text: וְ/צִידוֹנִ֤ים וַֽ/עֲמָלֵק֙ וּ/מָע֔וֹן לָחֲצ֖וּ אֶתְ/כֶ֑ם וַ/תִּצְעֲק֣וּ אֵלַ֔/י וָ/אוֹשִׁ֥יעָ/ה אֶתְ/כֶ֖ם מִ/יָּדָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/010/012.yaml
  text: The Sidonians[a], Amalek, and Maon oppressed you, and you cried out to me[b], and I saved you from their hand.
translation:
  language: hi
  text: और सीदोनियों, अमालेक और माओन[a] ने तुम पर अत्याचार किया। तब तुमने मेरी दोहाई दी, और मैंने तुम्हें उनके हाथ से बचाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “माओनियों।” इब्रानी पाठ में “माओन” है, जो संभवतः माओन से जुड़े किसी जनसमूह को सूचित करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: צִידוֹנִים
  choice: सीदोनियों
  rationale: यह बहुवचन जातिवाचक संज्ञा सीदोन के लोगों को सूचित करती है; ‘सीदोनियों’ संक्षिप्त, स्वाभाविक और नाम-संबंधी रूप को बनाए रखता है।
- source_word: עֲמָלֵק
  choice: अमालेक
  rationale: इब्रानी पाठ में जाति के विस्तृत रूप के बजाय व्यक्तिवाचक नाम ‘अमालेक’ है, जो यहाँ पूरे जनसमूह का प्रतिनिधित्व कर सकता है।
- source_word: מָעוֹן
  choice: माओन
  rationale: व्यंजनात्मक इब्रानी पाठ व्यक्तिवाचक नाम ‘माओन’ देता है; संभव जनसमूह-संदर्भ को स्पष्ट करने के लिए पादटिप्पणी दी गई है।
- source_word: לָחֲצוּ
  choice: अत्याचार किया
  rationale: क्रिया शत्रुतापूर्ण ढंग से दबाने, सताने या उत्पीड़ित करने को व्यक्त करती है; आधुनिक हिन्दी में ‘अत्याचार किया’ इस प्रसंग में सहज और स्पष्ट है।
- source_word: וַתִּצְעֲקוּ אֵלַי
  choice: तुमने मेरी दोहाई दी
  rationale: यह मुहावरा सहायता के लिए व्याकुल पुकार को व्यक्त करता है; ‘मेरी दोहाई दी’ भावात्मक तीव्रता और परमेश्वर की ओर की गई पुकार दोनों को रखता है।
- source_word: וָאוֹשִׁיעָה
  choice: मैंने तुम्हें ... बचाया
  rationale: यशׁע धातु बचाने या छुड़ाने का अर्थ देती है; ‘बचाया’ सामान्य पाठक के लिए सीधा और बाइबिलीय उद्धार-भाषा के अनुरूप है।
- source_word: מִיָּדָם
  choice: उनके हाथ से
  rationale: इब्रानी मुहावरे का अर्थ उनके अधिकार या नियंत्रण से है; शाब्दिक चित्र हिन्दी में भी समझ में आता है और स्रोत की अभिव्यक्ति बनाए रखता है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और मौखिक रूप से स्पष्ट प्रयोग किया गया है। जातीय नामों को अनावश्यक रूप से स्पष्ट किए बिना इब्रानी रूप के निकट रखा गया है। अंग्रेज़ी परामर्श-पाठ में पादटिप्पणी-चिह्नों का स्थान मूल शब्दों से असंगत प्रतीत होता है; इसलिए स्रोत-साक्ष्य के अनुसार केवल वास्तविक अस्पष्टता ‘माओन/माओनी’ पर पादटिप्पणी रखी गई है।
