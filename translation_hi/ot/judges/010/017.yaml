  text: Then the Ammonites were summoned and camped in Gilead[a], and the sons of Israel gathered together and camped at Mizpah.
translation:
  language: hi
  text: तब अम्मोनी बुलाए गए और गिलाद में डेरा डाला; और इस्राएली इकट्ठे हुए और मिस्पा में डेरा डाला।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּצָּעֲקוּ
  choice: बुलाकर इकट्ठे किए गए
  rationale: क्रिया צעק सामान्यतः पुकारने या चिल्लाने का अर्थ देती है, पर यहाँ निफ़अल रूप और तुरंत बाद सेना के डेरा डालने का उल्लेख युद्ध के लिए बुलाकर जुटाए जाने की ओर संकेत करता है। संभावित शाब्दिक अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: בְּנֵי עַמּוֹן
  choice: अम्मोनी
  rationale: शाब्दिक अर्थ ‘अम्मोन के पुत्र’ है, पर यह एक जनसमूह का प्रचलित नाम है; आधुनिक हिन्दी में ‘अम्मोनी’ स्पष्ट और स्वाभाविक है।
- source_word: וַיַּחֲנוּ
  choice: डेरा डाला
  rationale: חנה का अर्थ पड़ाव डालना या छावनी बनाना है। ‘डेरा डाला’ आधुनिक हिन्दी में स्वाभाविक है और सैन्य प्रसंग को बनाए रखता है।
- source_word: בַּגִּלְעָד
  choice: गिलाद में
  rationale: गिलाद एक क्षेत्र है, इसलिए בְּ का स्वाभाविक हिन्दी रूप ‘में’ है।
- source_word: וַיֵּאָסְפוּ
  choice: इकट्ठे हुए
  rationale: אסף का यहाँ सामूहिक रूप से एकत्र होने का अर्थ है। यह हिन्दी में सहजता से सैन्य जुटान व्यक्त करता है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएली
  rationale: शाब्दिक पद ‘इस्राएल के पुत्र’ पूरे जातीय-सामुदायिक समूह को दर्शाता है। ‘इस्राएली’ आधुनिक हिन्दी में उसका स्पष्ट और स्वाभाविक जनसमूह-सूचक रूप है।
- source_word: בַּמִּצְפָּה
  choice: मिस्पा में
  rationale: यह डेरा डालने के स्थान का नाम है; हिन्दी में ‘में’ स्वाभाविक स्थान-सूचक प्रयोग है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। दोनों दलों के जुटने और डेरा डालने की समानांतर कथात्मक संरचना स्पष्ट की गई है; ‘भी’ इस समानांतरता को स्वाभाविक हिन्दी में व्यक्त करता है।
