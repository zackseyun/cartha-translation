- source_word: וַיִּקָּבֵר
  choice: उसे दफ़नाया गया
  rationale: קבר के निफ़अल निष्क्रिय रूप को स्वाभाविक आधुनिक हिन्दी में स्पष्ट निष्क्रिय वाक्य-विन्यास से व्यक्त किया गया है।
- source_word: בְּקָמוֹן
  choice: कामोन में
  rationale: בְּ के स्थानवाचक अर्थ को ‘में’ से और स्थान-नाम को देवनागरी लिप्यंतरण से प्रस्तुत किया गया है।
