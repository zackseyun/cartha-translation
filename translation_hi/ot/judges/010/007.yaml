base_translation:
  language: en
  yaml_path: translation/ot/judges/010/007.yaml
  text: So Yahweh’s anger burned against Israel[c][b][a], and he sold them into the hand of the Philistines and into the hand of the Ammonites.
translation:
  language: hi
  text: तब इस्राएल के विरुद्ध याहवे का क्रोध भड़क उठा, और उसने उन्हें पलिश्तियों के हाथ में और अम्मोनियों के हाथ में बेच दिया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘बेच दिया’ न्यायियों की पुस्तक में बार-बार आने वाली अभिव्यक्ति है, जिसका अर्थ है कि याहवे ने न्याय के रूप में इस्राएल को शत्रुओं के अधिकार में कर दिया।
    reason: cross_reference
lexical_decisions:
- source_word: וַיִּחַר אַף
  choice: क्रोध भड़क उठा
  rationale: यह हिब्रू मुहावरा क्रोध के जलने या भड़कने का चित्र प्रस्तुत करता है। यह हिन्दी में स्वाभाविक रहते हुए मूल रूपक को बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी बाइबल परंपरा में परमेश्वर के व्यक्तिगत नाम के लिए प्रचलित और सुबोध लिप्यंतरण; इसे किसी उपाधि से नहीं बदला गया है।
- source_word: בְּיִשְׂרָאֵל
  choice: इस्राएल पर
  rationale: क्रोध के मुहावरे के साथ ב यहाँ क्रोध के लक्ष्य को दर्शाता है; हिन्दी में ‘पर’ स्वाभाविक है।
- source_word: וַיִּמְכְּרֵם
  choice: उसने उन्हें ... बेच दिया
  rationale: מכר का मूल अर्थ ‘बेचना’ है। न्यायियों में यह शत्रुओं के अधीन कर देने का आवर्ती न्याय-संबंधी रूपक है, इसलिए इसे नरम करके केवल ‘सौंप दिया’ नहीं किया गया।
- source_word: בְּיַד
  choice: के हाथ
  rationale: यह अधिकार या नियंत्रण का हिब्रू मुहावरा है। ‘के हाथ बेच दिया’ हिन्दी में समझ में आता है और मूल ठोस बिंब बनाए रखता है।
- source_word: פְּלִשְׁתִּים
  choice: पलिश्तियों
  rationale: इस जनसमूह का मानक हिन्दी नाम।
- source_word: בְּנֵי עַמּוֹן
  choice: अम्मोनियों
  rationale: शाब्दिक ‘अम्मोन के पुत्रों’ के स्थान पर इस जनसमूह का स्वाभाविक मानक हिन्दी नाम।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम है। हिन्दी पाठकों में व्यापक रूप से पहचाने जाने वाले ‘यहोवा’ को रखा गया है, न कि उसे ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित किया गया।
- issue: וַיִּמְכְּרֵם में ईश्वरीय न्याय और सक्रिय कर्तृत्व
  choice: उसने उन्हें ... बेच दिया
  alternative: उसने उन्हें ... के अधीन कर दिया
  rationale: मूल पाठ परमेश्वर को सक्रिय कर्ता बताता है और ‘बेचने’ का कठोर रूपक प्रयोग करता है। चुना हुआ पाठ इस तनाव तथा न्यायियों की आवर्ती अभिव्यक्ति को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए सुबोध रखी गई है। वाक्य की हिब्रू रूपकात्मकता—क्रोध का भड़कना, शत्रुओं के हाथ में बेचना—जहाँ स्वाभाविक थी, वहाँ सुरक्षित रखी गई है।
