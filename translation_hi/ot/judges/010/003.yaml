source:
  edition: WLC
  text: וַ/יָּ֣קָם אַחֲרָ֔י/ו יָאִ֖יר הַ/גִּלְעָדִ֑י וַ/יִּשְׁפֹּט֙ אֶת יִשְׂרָאֵ֔ל עֶשְׂרִ֥ים וּ/שְׁתַּ֖יִם שָׁנָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/010/003.yaml
  text: After him arose Jair the Gileadite[a], and he judged Israel twenty-two years.
translation:
  language: hi
  text: उसके बाद गिलादी याईर उठा[a] और उसने बाईस वर्ष तक इस्राएल का न्याय किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसके बाद गिलादी याईर आया।”
    reason: आरंभिक उत्तराधिकार-सूत्र में קום अगले अगुवे के ‘उठने’ या उसके बाद ‘आने’—दोनों भाव दे सकता है।
lexical_decisions:
- source_word: וַיָּקָם
  choice: उठा
  rationale: קום का मूल अर्थ ‘उठना’ है; यहाँ न्यायियों के क्रम में अगले अगुवे के प्रकट होने या कार्यभार सँभालने का भाव है। ‘उठा’ इस कथात्मक सूत्र को संक्षिप्त और औपचारिक रूप में बनाए रखता है।
- source_word: אַחֲרָיו
  choice: उसके बाद
  rationale: यह प्रत्यययुक्त संबंधबोधक पद पिछले न्यायी के बाद याईर के आने का स्पष्ट क्रम बताता है।
- source_word: יָאִיר
  choice: याईर
  rationale: इब्रानी नाम का देवनागरी में निकट ध्वन्यात्मक लिप्यंतरण किया गया है।
- source_word: הַגִּלְעָדִי
  choice: गिलादी
  rationale: यह क्षेत्रीय संबंध बताने वाला विशेषण है और याईर को गिलाद से संबंधित व्यक्ति के रूप में पहचानता है। हिंदी में ‘गिलादी’ इसकी विशेषणात्मक संक्षिप्तता बनाए रखता है।
- source_word: וַיִּשְׁפֹּט
  choice: उसने … का न्याय किया
  rationale: שפט न्यायियों की पुस्तक का आवर्ती शब्द है, जिसमें न्याय करने के साथ शासन या अगुवाई का व्यापक भाव भी हो सकता है। मूल शब्दावली और पुस्तक के साहित्यिक संबंध को बनाए रखने के लिए ‘न्याय किया’ चुना गया है।
- source_word: אֶת יִשְׂרָאֵל
  choice: इस्राएल का
  rationale: इब्रानी प्रत्यक्ष कर्म को स्वाभाविक हिंदी रचना ‘इस्राएल का न्याय किया’ में व्यक्त किया गया है; यहाँ इस्राएल से अभिप्राय लोग या राष्ट्र हैं।
- source_word: עֶשְׂרִים וּשְׁתַּיִם שָׁנָה
  choice: बाईस वर्ष तक
  rationale: अवधि को सहज आधुनिक हिंदी में व्यक्त किया गया है; ‘तक’ न्याय करने की अवधि स्पष्ट करता है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘न्याय किया’ पुस्तक की प्रमुख शब्दावली को सुरक्षित रखता है, जबकि संदर्भ में इसका अर्थ केवल अदालती निर्णय देना नहीं, बल्कि न्यायी के रूप में अगुवाई करना भी हो सकता है।
