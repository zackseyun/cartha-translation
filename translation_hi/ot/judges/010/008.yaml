source:
  edition: WLC
  text: וַֽ/יִּרְעֲצ֤וּ וַ/יְרֹֽצְצוּ֙ אֶת בְּנֵ֣י יִשְׂרָאֵ֔ל בַּ/שָּׁנָ֖ה הַ/הִ֑יא שְׁמֹנֶ֨ה עֶשְׂרֵ֜ה שָׁנָ֗ה אֶֽת כָּל בְּנֵ֤י יִשְׂרָאֵל֙ אֲשֶׁר֙ בְּ/עֵ֣בֶר הַ/יַּרְדֵּ֔ן בְּ/אֶ֥רֶץ הָ/אֱמֹרִ֖י אֲשֶׁ֥ר בַּ/גִּלְעָֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/010/008.yaml
  text: And they shattered and crushed the sons of Israel in that year[a]; for eighteen years they oppressed all the sons of Israel who were beyond the Jordan in the land of the Amorites[b], which is in Gilead.
translation:
  language: hi
  text: उस वर्ष उन्होंने इस्राएलियों को तोड़ डाला और कुचल दिया[a]। अठारह वर्ष तक वे यरदन के पार, गिलाद में स्थित एमोरियों के देश में रहने वाले सभी इस्राएलियों पर अत्याचार करते रहे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उन्होंने इस्राएलियों को तोड़कर दबा दिया।” हिब्रू में दो प्रबल, लगभग समानार्थी क्रियाएँ हैं, जो इस पीड़ा की कठोरता पर बल देती हैं।
    reason: lexical_alternative
  - marker: b
    text: 'हिब्रू की रचना संक्षिप्त है: “उस वर्ष … अठारह वर्ष।” दूसरे वाक्य में “अत्याचार करते रहे” पहली क्रियाओं की जारी रहने वाली क्रिया को स्पष्ट करता है।'
    reason: source_syntax
lexical_decisions:
- source_word: וַיִּרְעֲצוּ
  choice: तोड़ डाला
  rationale: क्रिया हिंसक रूप से तोड़ने या चकनाचूर करने का भाव रखती है। ‘तोड़ डाला’ आधुनिक हिन्दी में उसकी तीव्रता को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וַיְרֹצְצוּ
  choice: और कुचल दिया
  rationale: पहली क्रिया के साथ यह निकटार्थक, बलवर्धक जोड़ी बनाती है। ‘कुचल दिया’ मूल के सजीव और कठोर समानांतर भाव को बनाए रखता है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएलियों
  rationale: हिब्रू मुहावरे ‘इस्राएल के पुत्र’ का आशय इस्राएल समुदाय है। आधुनिक हिन्दी में ‘इस्राएली’ अधिक स्वाभाविक और समावेशी है; दोनों बार इसकी पुनरावृत्ति रखी गई है।
- source_word: בַּשָּׁנָה הַהִיא
  choice: उस वर्ष
  rationale: काल-सूचक वाक्यांश का सीधा और स्वाभाविक अनुवाद।
- source_word: שְׁמֹנֶה עֶשְׂרֵה שָׁנָה
  choice: अठारह वर्ष तक
  rationale: अवधि को हिन्दी में स्पष्ट करने के लिए ‘तक’ जोड़ा गया है।
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: यरदन के पार
  rationale: यह निकट और स्वाभाविक अनुवाद है तथा मूल की दिशात्मक दृष्टि को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: בְּאֶרֶץ הָאֱמֹרִי
  choice: एमोरियों के देश में
  rationale: एकवचन जातिवाचक ‘एमोरी’ को हिन्दी में समुदाय के रूप में ‘एमोरियों’ कहा गया है और क्षेत्रीय अभिव्यक्ति ‘देश’ के साथ सुरक्षित रखी गई है।
- source_word: אֲשֶׁר בַּגִּלְעָד
  choice: गिलाद में स्थित
  rationale: सम्बन्धवाचक उपवाक्य का आशय संक्षिप्त, स्पष्ट हिन्दी में व्यक्त करते हुए भूमि को गिलाद के भीतर स्थित बताया गया है।
