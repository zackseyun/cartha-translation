  text: וַ/יָּקָם֩ אַחֲרֵ֨י אֲבִימֶ֜לֶךְ לְ/הוֹשִׁ֣יעַ אֶת יִשְׂרָאֵ֗ל תּוֹלָ֧ע בֶּן פּוּאָ֛ה בֶּן דּוֹד֖וֹ אִ֣ישׁ יִשָּׂשכָ֑ר וְ/הֽוּא יֹשֵׁ֥ב בְּ/שָׁמִ֖יר בְּ/הַ֥ר אֶפְרָֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/010/001.yaml
  text: After Abimelech[a], Tola son of Puah, son of Dodo, a man of Issachar, arose to save Israel; and he lived in Shamir in the hill country of Ephraim.
translation:
  language: hi
  text: अबीमेलेक के बाद इस्राएल को बचाने के लिए तोला उठा। वह पूआ का पुत्र, दोदो का पुत्र, और इस्साकार गोत्र का व्यक्ति था। वह एप्रैम के पहाड़ी प्रदेश में शामीर में रहता था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקָם
  choice: उठा
  rationale: कथा में नए अगुवे के सामने आने को व्यक्त करता है; औपचारिक नियुक्ति का अर्थ जोड़े बिना इब्रानी क्रिया की छवि बनाए रखता है।
- source_word: אַחֲרֵי אֲבִימֶלֶךְ
  choice: अबीमेलेक के बाद
  rationale: कथात्मक क्रम में सीधा काल-सूचक वाक्यांश।
- source_word: לְהוֹשִׁיעַ אֶת־יִשְׂרָאֵל
  choice: इस्राएल को बचाने के लिए
  rationale: हिफ़ील रूप का अर्थ बचाना या छुड़ाना है; ‘बचाने’ से अर्थ केवल सैनिक मुक्ति तक सीमित नहीं होता।
- source_word: תּוֹלָע
  choice: तोला
  rationale: व्यक्तिवाचक नाम का प्रचलित हिंदी लिप्यंतरण।
- source_word: בֶּן־פּוּאָה
  choice: पूआ का पुत्र
  rationale: वंशावली संबंध को स्पष्ट और स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: בֶּן־דּוֹדוֹ
  choice: दोदो का वंशज
  rationale: लगातार आए दो בֶּן संबंधों में यह तोला को पूआ का पुत्र और दोदो का अगला वंशज बताता है; मसोराई स्वरांकन दोदो को व्यक्तिवाचक नाम मानता है। वैकल्पिक शब्दार्थ पादटिप्पणी में सुरक्षित है।
- source_word: אִישׁ יִשָּׂשכָר
  choice: इस्साकार गोत्र का व्यक्ति
  rationale: कबीलाई संबद्धता को साधारण आधुनिक हिंदी में स्पष्ट करता है।
- source_word: וְהוּא יֹשֵׁב
  choice: वह ... रहता था
  rationale: कृदन्तीय रचना उसके निवास-स्थान का वर्णन करती है; यह सहज और अनार्ष हिंदी है।
- source_word: בְּשָׁמִיר
  choice: शामीर में
  rationale: स्थान-नाम का हिंदी लिप्यंतरण।
- source_word: בְּהַר אֶפְרָיִם
  choice: एप्रैम के पहाड़ी प्रदेश में
  rationale: भौगोलिक क्षेत्र का अर्थ देता है और इसे किसी एक पर्वत के रूप में समझने से बचाता है।
