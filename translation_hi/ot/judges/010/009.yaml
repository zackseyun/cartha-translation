translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘एप्रैम का घराना’ मूल के בֵית אֶפְרָיִם को सुरक्षित रखता है, जबकि ‘बहुत बड़े संकट में पड़ गया’ साधारण पाठक के लिए अंतिम अवैयक्तिक इब्रानी वाक्य का स्वाभाविक हिन्दी रूप है।
