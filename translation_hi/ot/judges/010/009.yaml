source:
  edition: WLC
  text: וַ/יַּעַבְר֤וּ בְנֵֽי עַמּוֹן֙ אֶת הַ/יַּרְדֵּ֔ן לְ/הִלָּחֵ֛ם גַּם בִּ/יהוּדָ֥ה וּ/בְ/בִנְיָמִ֖ין וּ/בְ/בֵ֣ית אֶפְרָ֑יִם וַ/תֵּ֥צֶר לְ/יִשְׂרָאֵ֖ל מְאֹֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/010/009.yaml
  text: Then the Ammonites crossed the Jordan to fight also against Judah[a], Benjamin, and the house of Ephraim, and Israel was greatly distressed.
translation:
  language: hi
  text: तब अम्मोनियों ने यहूदा, बिन्यामीन और एप्रैम के घराने के विरुद्ध भी लड़ने के लिए यरदन को पार किया। और इस्राएल अत्यन्त संकट में पड़ गया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इस्राएल बहुत ही तंगी में था।”
    reason: मूल क्रिया और לְיִשְׂרָאֵל की अवैयक्तिक रचना को अधिक शाब्दिक ढंग से व्यक्त करने वाला वैकल्पिक अनुवाद।
lexical_decisions:
- source_word: וַיַּעַבְרוּ
  choice: पार करके ... आए
  rationale: क्रिया עבר और उसके कर्म ‘यरदन’ से नदी पार करने का ठोस अर्थ निकलता है। हिन्दी कथात्मक प्रवाह में ‘पार करके ... आए’ स्वाभाविक है और युद्ध के लिए पश्चिम की ओर बढ़ने का भाव व्यक्त करता है।
- source_word: בְּנֵי עַמּוֹן
  choice: अम्मोनी
  rationale: यह जातिसूचक पद है; आधुनिक हिन्दी में ‘अम्मोनी’ स्वाभाविक और संक्षिप्त रूप है।
- source_word: אֶת הַיַּרְדֵּן
  choice: यरदन
  rationale: यह यरदन नदी का प्रचलित बाइबलीय नाम है; संदर्भ में ‘नदी’ जोड़ना आवश्यक नहीं।
- source_word: לְהִלָּחֵם
  choice: लड़ने
  rationale: यह युद्ध में भिड़ने या लड़ाई करने को बताता है। ‘लड़ने’ सरल, सटीक और प्रसंगानुकूल है।
- source_word: גַּם
  choice: भी
  rationale: यह यरदन के पूर्व की पिछली लड़ाई के अतिरिक्त पश्चिमी क्षेत्रों पर आक्रमण के विस्तार को व्यक्त करता है।
- source_word: בִּיהוּדָה וּבְבִנְיָמִין וּבְבֵית אֶפְרָיִם
  choice: यहूदा, बिन्यामीन और एप्रैम के घराने से
  rationale: यद्यपि मूल पूर्वसर्ग का सामान्य अर्थ ‘में’ है, ‘लड़ने’ के साथ यह विरोधी पक्ष को सूचित करता है; इसलिए हिन्दी में ‘से’ स्वाभाविक है। בֵית को ‘घराने’ के रूप में रखा गया है ताकि व्यापक वंशीय या क्षेत्रीय इकाई का भाव बना रहे।
- source_word: וַתֵּצֶר לְיִשְׂרָאֵל מְאֹד
  choice: इससे इस्राएल बहुत बड़े संकट में पड़ गया
  rationale: मूल वाक्यरचना प्रभावित पक्ष इस्राएल के लिए अत्यन्त तंगी या संकट उत्पन्न होने को बताती है। हिन्दी में यह रूप स्वाभाविक है और किसी अनकहे कर्ता को नहीं जोड़ता।
