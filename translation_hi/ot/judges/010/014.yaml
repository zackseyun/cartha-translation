  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: לְכ֗וּ וְ/זַֽעֲקוּ֙ אֶל הָ֣/אֱלֹהִ֔ים אֲשֶׁ֥ר בְּחַרְתֶּ֖ם בָּ֑/ם הֵ֛מָּה יוֹשִׁ֥יעוּ לָ/כֶ֖ם בְּ/עֵ֥ת צָרַתְ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/010/014.yaml
  text: Go and cry out to the gods whom you have chosen[a]; let them save you in the time of your distress.
translation:
  language: hi
  text: जाओ और जिन देवताओं को तुमने चुना है, उन्हें पुकारो; तुम्हारे संकट के समय वे ही तुम्हें बचाएँ।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वे ही तुम्हें बचाएँगे।” इब्रानी क्रिया का अनुवाद साधारण भविष्यकाल में भी किया जा सकता है, पर इस प्रसंग में यह व्यंग्यात्मक चुनौती के रूप में प्रयुक्त हुई है।
    reason: alternative_reading
lexical_decisions:
- source_word: לְכוּ
  choice: जाओ
  rationale: बहुवचन आज्ञार्थक रूप है और यहाँ तीखी विदाई या झिड़की का भाव देता है; ‘जाओ’ सरल और स्वाभाविक है।
- source_word: וְזַעֲקוּ
  choice: और ... पुकारो
  rationale: זעק संकट में सहायता के लिए ऊँची और व्याकुल पुकार को दर्शाता है। ‘पुकारो’ प्रार्थना-सदृश निवेदन और तात्कालिकता दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אֶל הָאֱלֹהִים
  choice: देवताओं को
  rationale: אֱלֹהִים रूपतः कभी संदिग्ध हो सकता है, पर यहाँ विदेशी देवताओं का संदर्भ तथा आगे का बहुवचन सर्वनाम और क्रिया बहुवचन अर्थ को स्पष्ट करते हैं।
- source_word: אֲשֶׁר בְּחַרְתֶּם בָּם
  choice: जिन ... को तुमने चुना है
  rationale: בחר ב का आशय यहाँ चयन करना है। देवताओं के लिए ‘जिन ... को’ आधुनिक हिन्दी में स्वाभाविक और व्यक्तिवाचक है।
- source_word: הֵמָּה
  choice: वे ही
  rationale: स्वतंत्र बहुवचन सर्वनाम कर्ता पर बल देता है। ‘वे ही’ इस जोर को स्पष्ट और संक्षिप्त रूप से सुरक्षित रखता है।
- source_word: יוֹשִׁיעוּ
  choice: तुम्हें बचाएँ
  rationale: ישׁע के हिफ़ील का अर्थ बचाना या छुड़ाना है। प्रसंग में यह भविष्यवाणी नहीं, बल्कि व्यंग्यात्मक चुनौती है; सम्भावना/आज्ञार्थक ‘बचाएँ’ उस कथन-बल को व्यक्त करता है।
- source_word: בְּעֵת צָרַתְכֶם
  choice: तुम्हारे संकट के समय
  rationale: यह कालसूचक पद संकट या विपत्ति की घड़ी को दर्शाता है। ‘संकट के समय’ सहज, गरिमापूर्ण और मूल नामिक रचना के निकट है।
theological_decisions:
- issue: יוֹשִׁיעוּ का प्रसंगगत कथन-बल
  choice: व्यंग्यात्मक चुनौती के रूप में ‘वे ही तुम्हें बचाएँ’
  alternative: 'साधारण भविष्यकाल: ‘वे ही तुम्हें बचाएँगे’'
  rationale: यहोवा इस्राएल को पराए देवताओं की ओर मुड़ने के लिए उलाहना दे रहे हैं। इसलिए रूप को निश्चित भविष्यवाणी बनाने के बजाय चुनौती का भाव रखना प्रसंगानुकूल है; फिर भी वैकल्पिक व्याकरणिक सम्भावना पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सीधी, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रखी गई है। ‘वे ही’ से मूल के स्वतंत्र सर्वनाम का बल सुरक्षित है और अर्धविराम दो आज्ञार्थक खंडों के बीच तीखा संबंध दिखाता है।
