  yaml_path: translation/ot/judges/010/002.yaml
  text: He judged Israel twenty-three years. Then he died and was buried in Shamir.
translation:
  language: hi
  text: उसने तेईस वर्ष तक इस्राएल का न्याय किया। फिर वह मर गया और उसे शामीर में दफनाया गया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁפֹּט אֶת־יִשְׂרָאֵל
  choice: उसने … इस्राएल का न्याय किया
  rationale: न्यायियों की पुस्तक में שׁפט न्यायी के रूप में नेतृत्व और न्याय करने की गतिविधि को व्यक्त करता है। ‘न्याय किया’ पुस्तक की आवर्ती शब्दावली को सुरक्षित रखता है; अवधि के साथ ‘तक’ स्वाभाविक हिन्दी है।
- source_word: עֶשְׂרִים וְשָׁלֹשׁ שָׁנָה
  choice: तेईस वर्ष तक
  rationale: मूल पाठ की अवधि को ठीक-ठीक और आधुनिक हिन्दी की स्वाभाविक संख्या-रचना में व्यक्त करता है।
- source_word: וַיָּמָת
  choice: फिर वह मर गया
  rationale: वाव-क्रमिक कथा को अगले प्रसंग की ओर बढ़ाता है; ‘फिर’ घटनाक्रम को स्वाभाविक हिन्दी में स्पष्ट करता है, बिना कोई विरोधाभास जोड़े।
- source_word: וַיִּקָּבֵר
  choice: उसे … दफनाया गया
  rationale: निफ़अल रूप का कर्मवाच्य अर्थ सुरक्षित रहता है और दफनाने वाले व्यक्ति का उल्लेख नहीं जोड़ा जाता।
- source_word: בְּשָׁמִיר
  choice: शामीर में
  rationale: בְּ का स्थानवाचक अर्थ ‘में’ से और स्थान-नाम שָׁמִיר का निकट देवनागरी लिप्यंतरण ‘शामीर’ से व्यक्त किया गया है।
