  text: וַ/יָּסִ֜ירוּ אֶת אֱלֹהֵ֤י הַ/נֵּכָר֙ מִ/קִּרְבָּ֔/ם וַ/יַּעַבְד֖וּ אֶת יְהוָ֑ה וַ/תִּקְצַ֥ר נַפְשׁ֖/וֹ בַּ/עֲמַ֥ל יִשְׂרָאֵֽל־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/010/016.yaml
  text: So they removed the foreign gods from among them and served Yahweh[a], and he became impatient over the misery of Israel.
translation:
  language: hi
  text: तब उन्होंने अपने बीच से पराए देवताओं को हटा दिया और यहोवा की सेवा की। इस्राएल की दुर्दशा से उसका मन अधीर हो उठा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह इस्राएल की दुर्दशा को और अधिक सह न सका।” इब्रानी में शाब्दिक रूप से, “इस्राएल की दुर्दशा पर उसका प्राण छोटा हो गया,” जो अधीर हो जाने या आगे और सह न पाने का मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּסִירוּ
  choice: हटा दिया
  rationale: हिफ़ील रूप किसी वस्तु को दूर करने का अर्थ देता है; यह स्वाभाविक हिन्दी में मूर्तियों को अपने समुदाय से निकाल देने की ठोस क्रिया को बनाए रखता है।
- source_word: אֱלֹהֵי הַנֵּכָר
  choice: पराए देवताओं
  rationale: यह पद इस्राएल से बाहर के देवताओं के लिए प्रयुक्त है। ‘पराए देवता’ स्पष्ट, संक्षिप्त और प्रसंगानुकूल है।
- source_word: מִקִּרְבָּם
  choice: अपने बीच से
  rationale: मूल का अर्थ ‘उनके मध्य से’ है; ‘अपने बीच से’ सामुदायिक भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וַיַּעַבְדוּ אֶת־יְהוָה
  choice: यहोवा की सेवा करने लगे
  rationale: עבד में उपासना के साथ निष्ठा और आज्ञापालन का व्यापक भाव है; ‘सेवा’ उस विस्तार को सुरक्षित रखती है। प्रसंग में क्रिया का आरम्भिक पक्ष दिखाने के लिए ‘करने लगे’ चुना गया है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: परियोजना की रीति के अनुसार दिव्य नाम को हिन्दी के प्रचलित रूप ‘यहोवा’ में प्रस्तुत किया गया है।
- source_word: וַתִּקְצַר נַפְשׁוֹ
  choice: उसका जी व्याकुल हो उठा
  rationale: शाब्दिक मुहावरा ‘उसका प्राण छोटा हो गया’ है, जो अधीरता अथवा और अधिक सह न पाने को व्यक्त करता है। ‘जी व्याकुल हो उठा’ मूल की व्यक्तिगत और भावात्मक भाषा को हिन्दी में बनाए रखता है, जबकि अर्थ की पूरी सीमा पादटिप्पणी में दी गई है।
- source_word: בַּעֲמַל יִשְׂרָאֵל
  choice: इस्राएल के दुःख के कारण
  rationale: עָמָל यहाँ कष्ट, विपत्ति या दुःख को दर्शाता है। ‘दुःख’ साधारण आधुनिक हिन्दी में इस्राएल की दयनीय दशा को स्पष्ट करता है।
theological_decisions:
- issue: וַתִּקְצַר נַפְשׁוֹ में यहोवा का मानवीय भावों वाली भाषा में वर्णन
  choice: उसका जी व्याकुल हो उठा
  alternative: वह इस्राएल का दुःख और अधिक सह न सका
  rationale: मूल पाठ यहोवा की प्रतिक्रिया को सजीव व्यक्तिगत मुहावरे में रखता है। मुख्य पाठ उस भावात्मक तनाव को बनाए रखता है और इसे किसी अमूर्त धर्मवैज्ञानिक कथन में नहीं बदलता; वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण स्तर रखा गया है। ‘पराए देवता,’ ‘सेवा करने लगे’ और ‘जी व्याकुल हो उठा’ सामान्य पाठक के लिए बोधगम्य हैं; पादटिप्पणी मूल इब्रानी मुहावरे की अस्पष्ट अर्थ-सीमा को स्पष्ट करती है।
