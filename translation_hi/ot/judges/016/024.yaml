  edition: WLC
  text: וַ/יִּרְא֤וּ אֹת/וֹ֙ הָ/עָ֔ם וַֽ/יְהַלְל֖וּ אֶת אֱלֹהֵי/הֶ֑ם כִּ֣י אָמְר֗וּ נָתַ֨ן אֱלֹהֵ֤י/נוּ בְ/יָדֵ֨/נוּ֙ אֶת א֣וֹיְבֵ֔/נוּ וְ/אֵת֙ מַחֲרִ֣יב אַרְצֵ֔/נוּ וַ/אֲשֶׁ֥ר הִרְבָּ֖ה אֶת חֲלָלֵֽי/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/024.yaml
  text: When the people saw him, they praised their god, for they said, “Our god has given into our hand our enemy, the devastator of our land, the one who multiplied our slain.”
translation:
  language: hi
  text: जब लोगों ने उसे देखा, तो उन्होंने अपने देवता की स्तुति की, क्योंकि उन्होंने कहा, “हमारे देवता ने हमारे शत्रु को—हमारे देश को उजाड़ने वाले और हमारे मारे गए लोगों की संख्या बढ़ाने वाले को—हमारे हाथ में दे दिया है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהַלְלוּ
  choice: स्तुति की
  rationale: मूल क्रिया का अर्थ प्रशंसा या स्तुति करना है; धार्मिक संदर्भ में ‘स्तुति की’ स्वाभाविक और सटीक है।
- source_word: נָתַן ... בְיָדֵנוּ
  choice: हमारे हाथ में कर दिया है
  rationale: ‘हाथ में देना’ विजय और अधिकार सौंपने का हिब्रू मुहावरा है; हिन्दी में इसकी रूपकात्मकता बनाए रखी गई है।
- source_word: מַחֲרִיב אַרְצֵנוּ
  choice: जिसने हमारे देश को उजाड़ा
  rationale: מַחֲרִיב कृदन्त रूप में उजाड़ने या विनाश करने वाले को दर्शाता है; हिन्दी में संबंधवाचक उपवाक्य अधिक स्वाभाविक है।
- source_word: הִרְבָּה אֶת־חֲלָלֵינוּ
  choice: हमारे बहुत-से लोगों को मार डाला
  rationale: शाब्दिक अर्थ ‘हमारे मारे हुओं की संख्या बढ़ाई’ है। चुना गया रूप सामान्य हिन्दी में वही आशय स्पष्ट करता है, यद्यपि गणनात्मक रूपक को सहज भाषा में व्यक्त करता है।
theological_decisions:
- issue: पलिश्तियों के देवता के लिए אֱלֹהֵיהֶם / אֱלֹהֵינוּ का अनुवाद
  choice: अपने देवता / हमारे देवता
  alternative: अपने ईश्वर / हमारे ईश्वर
  rationale: संदर्भ एक जातीय देवता की आराधना का है; ‘देवता’ हिन्दी में इस भेद को स्वाभाविक रूप से व्यक्त करता है और कथन की दृष्टि को समर्थन दिए बिना सुरक्षित रखता है।
- issue: विजय का श्रेय देवता को देने वाले कथन का स्वर
  choice: प्रत्यक्ष कथन को बिना व्याख्यात्मक टिप्पणी के रखा गया
  alternative: कथावाचक की असहमति स्पष्ट करने वाली व्याख्या जोड़ना
  rationale: मूल पाठ इसे लोगों के कथन के रूप में प्रस्तुत करता है, न कि कथावाचक के अनुमोदन के रूप में; अतः तनाव को यथावत रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमामय किंतु सामान्य पाठक के लिए सहज। मूल की समानाधिकरणात्मक शृंखला को हिन्दी में संबंधवाचक वाक्य और डैश द्वारा स्वाभाविक बनाया गया है। कोई पाद-टिप्पणी आवश्यक नहीं मानी गई।
