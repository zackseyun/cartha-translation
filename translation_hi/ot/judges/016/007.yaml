  text: וַ/יֹּ֤אמֶר אֵלֶ֨י/הָ֙ שִׁמְשׁ֔וֹן אִם יַאַסְרֻ֗/נִי בְּ/שִׁבְעָ֛ה יְתָרִ֥ים לַחִ֖ים אֲשֶׁ֣ר לֹא חֹרָ֑בוּ וְ/חָלִ֥יתִי וְ/הָיִ֖יתִי כְּ/אַחַ֥ד הָ/אָדָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/007.yaml
  text: And Samson said to her[a], “If they bind me with seven fresh bowstrings that have not dried, then I will become weak and be like one of the men.”
translation:
  language: hi
  text: तब शिमशोन ने उससे कहा, “यदि वे मुझे धनुष की सात ऐसी ताज़ी डोरियों से बाँधें जो सूखी न हों, तो मैं निर्बल हो जाऊँगा और किसी साधारण आदमी जैसा हो जाऊँगा[a]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “किसी भी दूसरे आदमी जैसा।”
    reason: כְּאַחַד הָאָדָם का अधिक मुहावरेदार हिन्दी विकल्प।
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלֶיהָ שִׁמְשׁוֹן
  choice: तब शिमशोन ने उससे कहा
  rationale: कथात्मक wayyiqtol को स्वाभाविक हिन्दी क्रमसूचक ‘तब’ से व्यक्त किया गया है, बिना उससे अधिक कारणात्मक अर्थ जोड़े।
- source_word: יַאַסְרֻנִי
  choice: वे मुझे ... बाँधें
  rationale: तृतीय पुरुष बहुवचन यहाँ अनिश्चित कर्ता को सूचित करता है; ‘वे’ इस रूप को सहज हिन्दी में बनाए रखता है।
- source_word: יְתָרִים לַחִים
  choice: धनुष की ... ताज़ी डोरियों
  rationale: संदर्भ में יְתָרִים धनुष की डोरियाँ हैं और לַחִים उनके ताज़ा अथवा नम होने को बताता है; ‘ताज़ी’ अगले उपवाक्य ‘अभी तक सूखी न हों’ के साथ स्पष्ट है।
- source_word: אֲשֶׁר לֹא חֹרָבוּ
  choice: जो अभी तक सूखी न हों
  rationale: यह डोरियों की उस अवस्था को व्यक्त करता है जिसमें वे अब तक सूखी नहीं हैं।
- source_word: וְחָלִיתִי
  choice: तो मैं निर्बल हो जाऊँगा
  rationale: यहाँ חלה बीमारी के बजाय शक्ति खोकर निर्बल होने के अर्थ में है; ‘हो जाऊँगा’ अवस्था-परिवर्तन को व्यक्त करता है।
- source_word: כְּאַחַד הָאָדָם
  choice: आम आदमियों में से एक जैसा
  rationale: यह हिब्रू की ‘मनुष्यों/आदमियों में से एक’ वाली तुलना को बनाए रखते हुए संदर्भगत सामान्य मानवीय सामर्थ्य का बोध कराता है।
theological_decisions:
- issue: כְּאַחַד הָאָדָם में אָדָם का तुलनात्मक अर्थ
  choice: आम आदमियों में से एक जैसा
  alternative: किसी भी दूसरे आदमी जैसा
  rationale: मुख्य पाठ स्रोत की ‘एक में से’ संरचना और पुरुष-संदर्भ को बनाए रखता है; अधिक मुहावरेदार अर्थ पादटिप्पणी में दिया गया है, ताकि निहित तुलना को एक ही व्याख्या तक सीमित न किया जाए।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए स्पष्ट हिन्दी। ‘धनुष की डोरियाँ’ अपेक्षाकृत दुर्बोध ‘प्रत्यंचाएँ’ की तुलना में अधिक सहज है, जबकि मूल वस्तु का अर्थ भी सुरक्षित रखती है।
