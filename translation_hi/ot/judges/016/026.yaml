  yaml_path: translation/ot/judges/016/026.yaml
  text: Then Samson said to the young man who was holding his hand, “Let me rest, and guide me to the pillars on which the house stands, so that I may lean against them.”
translation:
  language: hi
  text: तब शिमशोन ने उस लड़के से, जो उसका हाथ पकड़े हुए था, कहा, “मुझे रहने दे, और मुझे उन खंभों को छू लेने दे जिन पर भवन टिका है, ताकि मैं उन पर झुक सकूँ।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַנִּיחָה אוֹתִי
  choice: मुझे ठहरने दे
  rationale: यह हिफ़ील रूप ‘मुझे छोड़ दे/विश्राम करने दे’ का भाव देता है। प्रसंग में स्वाभाविक हिंदी के लिए ‘ठहरने दे’ चुना गया, बिना इसे केवल ‘छूने दे’ अर्थ में बदलने के।
- source_word: ו/הימש/ני
  choice: और ... तक पहुँचा दे
  rationale: मसोरेटी पाठ का यह रूप असामान्य है, पर संदर्भ में मार्ग दिखाने या वहाँ तक ले जाने का भाव उपयुक्त है। ‘पहुँचा दे’ लड़के द्वारा अंधे शिमशोन का मार्गदर्शन किए जाने को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: הָעַמֻּדִים
  choice: खंभों
  rationale: भवन को थामने वाले स्तंभों के लिए सामान्य और स्पष्ट आधुनिक हिंदी शब्द।
- source_word: נָכוֹן עֲלֵיהֶם
  choice: जिन पर यह भवन टिका है
  rationale: נכון यहाँ भवन के खंभों पर दृढ़ता से स्थापित या टिके होने को दर्शाता है; ‘टिका है’ अर्थ और दृश्य दोनों को स्पष्ट रखता है।
- source_word: וְאֶשָּׁעֵן עֲלֵיהֶם
  choice: ताकि मैं उनका सहारा ले सकूँ
  rationale: क्रिया का अर्थ उन पर झुकना या उनसे सहारा लेना है। ‘सहारा ले सकूँ’ उद्देश्य और स्वाभाविक हिंदी दोनों व्यक्त करता है।
