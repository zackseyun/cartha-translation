base_translation:
  language: en
  yaml_path: translation/ot/judges/016/009.yaml
  text: The ambush was waiting for her in the inner room, and she said to him, “Philistines are upon you, Samson!” But he snapped the cords as a thread of tow snaps when it smells fire, and his strength was not discovered.
translation:
  language: hi
  text: घात में बैठा दल भीतरी कमरे में उसके लिए बैठा था। उसने उससे कहा, “शिमशोन, पलिश्ती तुम पर आ पड़े हैं!” पर उसने उन डोरियों को ऐसे तोड़ दिया, जैसे आग की गंध पाते ही सन के रेशे का धागा टूट जाता है; और उसकी शक्ति का पता न चला।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָאֹרֵב
  choice: घात लगानेवाला दल
  rationale: इब्रानी में यह एकवचन सामूहिक संज्ञा है; प्रसंग में छिपे हुए पलिश्ती पुरुषों के दल का बोध होता है।
- source_word: לָהּ
  choice: उसके लिए
  rationale: मूल के दत्तिवाचक रूप को जानबूझकर बनाए रखा गया है; इससे दल का दलीला के लिए तैयार या उसके पक्ष में उपस्थित होना व्यक्त होता है, बिना संबंध को अधिक स्पष्ट करके मूल की संक्षिप्तता मिटाए।
- source_word: הַיְתָרִים
  choice: डोरियों
  rationale: पिछले पद की ताज़ी धनुष-डोरियों का संदर्भ है; यहाँ सहज हिन्दी में संक्षिप्त पुनरुल्लेख किया गया है।
- source_word: פְּתִיל הַנְּעֹרֶת
  choice: सन का धागा
  rationale: नְעֹרֶת से सन के रेशे या टो का अर्थ निकलता है; 'सन का धागा' सामान्य पाठक के लिए स्पष्ट और उपमा के अनुकूल है।
- source_word: בַּהֲרִיחוֹ אֵשׁ
  choice: आग की गंध पाते ही
  rationale: मूल की सजीव और असामान्य 'आग सूँघने' वाली अभिव्यक्ति को सहज हिन्दी मुहावरे में यथासंभव सुरक्षित रखा गया है।
- source_word: וְלֹא נוֹדַע כֹּחוֹ
  choice: और उसकी शक्ति का पता न चला
  rationale: यह 'उसकी शक्ति जानी नहीं गई' का स्वाभाविक हिन्दी रूप है और प्रसंगानुसार उसकी शक्ति के रहस्य का उजागर न होना बताता है।
