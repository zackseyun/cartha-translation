  edition: WLC
  text: וַ/יִּקְרָ֥א שִׁמְשׁ֛וֹן אֶל יְהוָ֖ה וַ/יֹּאמַ֑ר אֲדֹנָ֣/י יֱהֹוִ֡ה זָכְרֵ֣/נִי נָא֩ וְ/חַזְּקֵ֨/נִי נָ֜א אַ֣ךְ הַ/פַּ֤עַם הַ/זֶּה֙ הָ/אֱלֹהִ֔ים וְ/אִנָּקְמָ֧ה נְקַם אַחַ֛ת מִ/שְּׁתֵ֥י עֵינַ֖/י מִ/פְּלִשְׁתִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/028.yaml
  text: Then Samson called to Yahweh and said[a], “Lord GOD, please remember me, and please strengthen me just this once, O God, so that I may take vengeance on the Philistines for my two eyes with one act of vengeance.”
translation:
  language: hi
  text: तब शिमशोन ने याहवे को पुकारा और कहा, “हे प्रभु याहवे, कृपा करके मुझे स्मरण कीजिए और, हे परमेश्वर, बस इस बार मुझे बल दीजिए, ताकि मैं पलिश्तियों से अपनी दोनों आँखों का एक ही बार में बदला ले सकूँ।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप में अंतिम वाक्यांश अत्यंत संक्षिप्त है: “पलिश्तियों से मेरी दोनों आँखों के लिए एक बदला।” इसका आशय पलिश्तियों द्वारा शिमशोन को अंधा किए जाने से है।'
    reason: मूल इब्रानी की संक्षिप्त और कुछ असामान्य रचना को स्पष्ट करना, बिना मुख्य पाठ में व्याख्या जोड़े।
lexical_decisions:
- source_word: וַיִּקְרָא שִׁמְשׁוֹן אֶל־יְהוָה
  choice: शिमशोन ने याहवे को पुकारकर कहा
  rationale: קרא אל का अर्थ किसी को पुकारना या सहायता के लिए दुहाई देना है। ‘पुकारकर कहा’ प्रार्थना की दिशा और अगले कथन, दोनों को स्वाभाविक हिन्दी में जोड़ता है।
- source_word: אֲדֹנָי יֱהוִה
  choice: हे प्रभु याहवे
  rationale: 'दोनों संबोधनों को अलग बनाए रखता है: אֲדֹנָי के लिए ‘प्रभु’ और יהוה के व्यक्तिगत नाम के लिए ‘याहवे’।'
- source_word: זָכְרֵנִי נָא
  choice: कृपा करके मुझे याद कर
  rationale: נָא विनती का भाव देता है। ‘याद कर’ यहाँ केवल स्मरण नहीं, बल्कि शिमशोन की ओर अनुग्रहपूर्वक ध्यान देने की प्रार्थना है; अनुवाद मूल रूपक को बनाए रखता है।
- source_word: וְחַזְּקֵנִי נָא אַךְ הַפַּעַם הַזֶּה
  choice: बस इस बार मुझे बल दे
  rationale: חזק का पिएल रूप बल प्रदान करने का अर्थ देता है और אַךְ वर्तमान अवसर तक आग्रह को सीमित करता है।
- source_word: וְאִנָּקְמָה
  choice: ताकि मैं ... बदला ले सकूँ
  rationale: कोहोर्टेटिव रूप शिमशोन के उद्देश्य और प्रबल इच्छा को व्यक्त करता है; ‘ताकि’ इस प्रयोजनात्मक संबंध को स्पष्ट करता है।
- source_word: נְקַם אַחַת
  choice: एक ही बार में बदला
  rationale: संज्ञा और संबंधित क्रिया बदले के विचार पर बल देते हैं, जबकि אַחַת एक ही अवसर या कृत्य की सीमा बताता है। हिन्दी में यह मूल की संक्षिप्त, कुछ असामान्य अभिव्यक्ति का स्वाभाविक समतुल्य है।
- source_word: מִשְּׁתֵי עֵינַי מִפְּלִשְׁתִּים
  choice: पलिश्तियों से अपनी दोनों आँखों का ... बदला
  rationale: נקם के साथ מן बदला लेने वाले पक्ष को ‘से’ द्वारा व्यक्त करता है। ‘दोनों आँखों का’ मूल के ‘मेरी दो आँखों’ को बनाए रखता है और अंधा किए जाने का विवरण पाठ में नहीं जोड़ता।
theological_decisions:
- issue: प्रार्थना में परमेश्वर के नाम और उपाधियों का अनुवाद
  choice: יְהוָה के लिए ‘याहवे’ और אֲדֹנָי יֱהוִה के लिए ‘प्रभु याहवे’
  alternative: ‘यहोवा’ अथवा दोनों स्थानों पर केवल ‘प्रभु’
  rationale: यह व्यक्तिगत दिव्य नाम और प्रभुत्व की उपाधि के बीच मूल पाठ का अंतर सुरक्षित रखता है तथा संबोधन को एक सामान्य उपाधि में नहीं मिलाता।
- issue: शिमशोन की बदले की प्रार्थना का नैतिक स्वर
  choice: उसकी प्रार्थना को वर्णनात्मक रूप से ज्यों का त्यों रखना
  alternative: बदले को न्याय या दंड के रूप में व्याख्यायित करना
  rationale: पद शिमशोन की अपनी इच्छा और प्रार्थना बताता है। अनुवाद उसे न तो नैतिक स्वीकृति में बदलता है, न उसकी कठोरता को कम करता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और प्रार्थनात्मक हिन्दी। ‘हे’ केवल प्रत्यक्ष संबोधनों में रखा गया है; ‘कृपा करके’ विनती का भाव देता है। ‘बदला’ सामान्य पाठक के लिए ‘प्रतिशोध’ से अधिक स्वाभाविक है, जबकि मूल की कठोरता भी बनाए रखता है।
