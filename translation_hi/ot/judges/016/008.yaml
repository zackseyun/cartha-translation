  text: וַ/יַּעֲלוּ לָ֞/הּ סַרְנֵ֣י פְלִשְׁתִּ֗ים שִׁבְעָ֛ה יְתָרִ֥ים לַחִ֖ים אֲשֶׁ֣ר לֹא חֹרָ֑בוּ וַ/תַּאַסְרֵ֖/הוּ בָּ/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/008.yaml
  text: So the Philistine rulers brought up to her seven fresh bowstrings that had not been dried[a], and she bound him with them.
translation:
  language: hi
  text: तब पलिश्ती शासक[a] उसके पास सात ताज़ी धनुष की डोरियाँ[b] ले आए, जो सुखाई नहीं गई थीं, और उसने उसे उनसे बाँध दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “पलिश्तियों के सरदार।” इब्रानी का यह पद पलिश्तियों के प्रमुख शासकीय अधिकारियों के लिए प्रयुक्त होता है।
    reason: lexical_alternative
  - marker: b
    text: या “डोरियाँ” या “रस्सियाँ।” इब्रानी शब्द का मूल अर्थ सामान्य डोरियाँ या रस्सियाँ हो सकता है; इस प्रसंग में इसे अक्सर धनुष की डोरियाँ समझा जाता है।
    reason: lexical_ambiguity
lexical_decisions:
- source_word: וַיַּעֲלוּ לָהּ
  choice: उसके पास ... ले आए
  rationale: עלה के ‘ऊपर लाने’ वाले मूल भाव को हिंदी में यांत्रिक ढंग से रखने के बजाय प्रसंगानुकूल गति और पहुँच को स्वाभाविक रूप से व्यक्त किया गया है; לָהּ का अर्थ ‘उसके पास/उसके लिए’ है।
- source_word: סַרְנֵי פְלִשְׁתִּים
  choice: पलिश्ती शासक
  rationale: סֶרֶן पलिश्तियों के मान्य प्रमुख शासकीय अधिकारियों की विशिष्ट उपाधि है। ‘शासक’ आधुनिक हिंदी में स्पष्ट है, जबकि फुटनोट पारंपरिक विकल्प बताता है।
- source_word: שִׁבְעָה יְתָרִים
  choice: सात ... धनुष-डोरियाँ
  rationale: יֶתֶר डोरी या रस्सी को सूचित कर सकता है और इस प्रसंग में सामान्यतः धनुष की डोरियों के रूप में समझा जाता है। मुख्य पाठ में संभावित वस्तु स्पष्ट की गई है और व्यापक अर्थ फुटनोट में सुरक्षित है।
- source_word: לַחִים אֲשֶׁר לֹא חֹרָבוּ
  choice: ताज़ी ... जो अभी सुखाई नहीं गई थीं
  rationale: לַחִים का अर्थ नम या ताज़ा है, और अगला उपवाक्य स्पष्ट करता है कि वे सूखी नहीं थीं। ‘अभी’ उनकी अनुपचारित अवस्था को सहज हिंदी में उभारता है।
- source_word: וַתַּאַסְרֵהוּ בָּהֶם
  choice: उसने उन्हीं से उसे बाँध दिया
  rationale: אסר का सीधा अर्थ बाँधना है और בָּהֶם साधन सूचित करता है। ‘उन्हीं से’ पूर्वोक्त सात डोरियों की ओर स्पष्ट संकेत करता है।
