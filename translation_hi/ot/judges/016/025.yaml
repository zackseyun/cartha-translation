base_translation:
  language: en
  yaml_path: translation/ot/judges/016/025.yaml
  text: And when their hearts were merry[a], they said, “Call for Samson, so that he may entertain us.” So they called for Samson from the prison house, and he entertained them[b]. And they made him stand between the pillars.
translation:
  language: hi
  text: जब उनका मन प्रसन्न था, तब उन्होंने कहा, “शिमशोन को बुलाओ, ताकि वह हमारा मनोरंजन करे।” तब उन्होंने शिमशोन को बंदीगृह[a] से बुलाया, और उसने उनके सामने प्रदर्शन किया[b]। फिर उन्होंने उसे स्तंभों के बीच खड़ा कर दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से ‘बंदियों के घर से’; अर्थात बंदीगृह या जेलखाने से।
    reason: lexical_alternative
  - marker: b
    text: इस क्रिया का अर्थ लोगों का मनोरंजन करना, उनके सामने प्रदर्शन करना, या उनके उपहास का पात्र बनना हो सकता है।
    reason: lexical_alternative
