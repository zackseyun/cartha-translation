source:
  edition: WLC
  text: וַ/תֹּ֤אמֶר דְּלִילָה֙ אֶל שִׁמְשׁ֔וֹן הִנֵּה֙ הֵתַ֣לְתָּ בִּ֔/י וַ/תְּדַבֵּ֥ר אֵלַ֖/י כְּזָבִ֑ים עַתָּה֙ הַגִּֽידָ/ה נָּ֣א לִ֔/י בַּ/מֶּ֖ה תֵּאָסֵֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/010.yaml
  text: Then Delilah said to Samson[a], “Look, you have mocked me and spoken lies to me. Now please tell me what you may be bound with.”
translation:
  language: hi
  text: तब दलीला ने शिमशोन से कहा, “देखो, तुमने मेरा मज़ाक उड़ाया[a] और मुझसे झूठी बातें कहीं। अब कृपया मुझे बताओ कि तुम्हें किस चीज़ से बाँधा जा सकता है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तुमने मुझे मूर्ख बनाया”; इब्रानी क्रिया छल करके किसी का मज़ाक बनाने या उसके साथ खिलवाड़ करने का भाव दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: तब ... ने ... कहा
  rationale: वाव-क्रमिक कथानक को आगे बढ़ाता है; ‘तब’ स्वाभाविक हिंदी में घटनाक्रम को स्पष्ट करता है।
- source_word: הִנֵּה
  choice: देखो
  rationale: यह दलीला के आरोप की ओर ध्यान खींचने वाला उद्गार है; ‘देखो’ आधुनिक और स्वाभाविक है।
- source_word: הֵתַלְתָּ בִּי
  choice: तुमने मेरा मज़ाक उड़ाया
  rationale: התל यहाँ छल के द्वारा किसी को उपहास या खिलवाड़ का पात्र बनाने का भाव देता है। मुख्य पाठ में संक्षिप्त स्वाभाविक अभिव्यक्ति रखी गई है और व्यापक अर्थ पादटिप्पणी में दिया गया है।
- source_word: וַתְּדַבֵּר אֵלַי כְּזָבִים
  choice: और मुझसे झूठी बातें कहीं
  rationale: यह मूल के ‘मुझसे झूठ बोले/झूठी बातें कहीं’ और बहुवचन כְּזָבִים को सहज हिंदी में व्यक्त करता है।
- source_word: עַתָּה
  choice: अब
  rationale: आरोप से नए अनुरोध की ओर संक्रमण को सीधे व्यक्त करता है।
- source_word: הַגִּידָה נָּא לִי
  choice: कृपया मुझे बताओ
  rationale: आज्ञार्थक रूप के साथ נָא विनती का भाव देता है, जिसे ‘कृपया’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: בַּמֶּה תֵּאָסֵר
  choice: तुम्हें किस चीज़ से बाँधा जा सकता है
  rationale: בַּמֶּה साधन पर केंद्रित है—‘किस चीज़ से’; निफ़अल रूप का कर्मवाच्य और प्रसंगगत संभाव्यता दोनों सुरक्षित रखे गए हैं।
