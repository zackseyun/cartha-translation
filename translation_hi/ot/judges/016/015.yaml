base_translation:
  language: en
  yaml_path: translation/ot/judges/016/015.yaml
  text: Then she said to him[a], “How can you say, ‘I love you,’ when your heart is not with me? These three times you have mocked me and have not told me in what your great strength lies.”
translation:
  language: hi
  text: तब उसने उससे कहा, “तुम कैसे कह सकते हो, ‘मैं तुमसे प्रेम करता हूँ,’ जबकि तुम्हारा मन मेरे साथ नहीं है? तुमने तीन बार मुझे छल किया है[a] और मुझे नहीं बताया कि तुम्हारी इतनी बड़ी शक्ति किस बात में है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मेरे साथ खेल करते रहे हो,” “मुझे धोखा देते रहे हो,” अथवा “मुझे मूर्ख बनाते रहे हो।” इब्रानी क्रिया में छलपूर्ण उपहास के द्वारा किसी के साथ खिलवाड़ करने का भाव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵיךְ
  choice: तुम कैसे कह सकते हो
  rationale: यह दलीला की अविश्वासभरी चुनौती को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אֲהַבְתִּיךְ
  choice: मैं तुमसे प्रेम करता हूँ
  rationale: प्रत्यक्ष कथन में इब्रानी पूर्ण रूप यहाँ शिमशोन के वर्तमान और निरंतर प्रेम-दावे को व्यक्त करता है।
- source_word: לִבְּךָ אֵין אִתִּי
  choice: तुम्हारा मन मेरे साथ नहीं है
  rationale: ‘हृदय’ के इब्रानी मुहावरे का आशय भीतरी निष्ठा और लगाव है; हिन्दी में ‘मन’ इसे सहज रूप से व्यक्त करता है और मूल तनाव बनाए रखता है।
- source_word: זֶה שָׁלֹשׁ פְּעָמִים
  choice: इन तीन बार
  rationale: तीन पिछली घटनाओं की ओर संकेत करने वाला स्वाभाविक हिन्दी रूप।
- source_word: הֵתַלְתָּ בִּי
  choice: मुझसे छल कर चुके हो
  rationale: क्रिया में धोखे के द्वारा किसी को खेल या उपहास का पात्र बनाने का भाव है; ‘छल करना’ प्रसंग में स्पष्ट और स्वाभाविक है, जबकि अन्य अर्थ पादटिप्पणी में सुरक्षित हैं।
- source_word: הִגַּדְתָּ לִּי
  choice: तुमने मुझे नहीं बताया
  rationale: बातचीत के इस प्रसंग में נגד का सरल और सीधा हिन्दी समतुल्य।
- source_word: בַּמֶּה כֹּחֲךָ גָדוֹל
  choice: तुम्हारी इतनी बड़ी शक्ति का रहस्य क्या है
  rationale: प्रश्न शिमशोन की असाधारण शक्ति के आधार या कारण के बारे में है; यह हिन्दी में उसका स्वाभाविक अर्थ देता है, यद्यपि ‘रहस्य’ संदर्भानुकूल स्पष्टता जोड़ता है।
