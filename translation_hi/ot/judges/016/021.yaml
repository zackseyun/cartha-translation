base_translation:
  language: en
  yaml_path: translation/ot/judges/016/021.yaml
  text: Then the Philistines seized him[a], gouged out his eyes, brought him down to Gaza, bound him with bronze shackles[b], and he was grinding in the prison house.
translation:
  language: hi
  text: तब पलिश्तियों ने उसे पकड़ लिया और उसकी आँखें निकाल डालीं[a]। वे उसे गाज़ा ले गए, उसे काँसे की बेड़ियों से जकड़ दिया, और वह बंदीगृह में[b] चक्की पीसता रहा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसकी आँखें फोड़ डालीं।” इब्रानी क्रिया आँखों को गोदकर शारीरिक रूप से नष्ट करने की हिंसक क्रिया बताती है।
    reason: lexical_alternative
  - marker: b
    text: या, “कारागार में।” शाब्दिक अर्थ, “बंदियों के घर में।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאחֲזוּהוּ
  choice: उसे पकड़ लिया
  rationale: אחז का मूल अर्थ किसी को पकड़ना या अपने कब्ज़े में लेना है। प्रसंग में ‘पकड़ लिया’ स्वाभाविक और बलपूर्ण है।
- source_word: פְלִשְׁתִּים
  choice: पलिश्तियों
  rationale: इस जनसमूह के लिए आधुनिक मानक हिन्दी में प्रचलित बाइबलीय नाम।
- source_word: וַיְנַקְּרוּ אֶת־עֵינָיו
  choice: उसकी आँखें फोड़ डालीं
  rationale: נקר यहाँ आँखों को शारीरिक रूप से नष्ट करने की ठोस और हिंसक क्रिया बताता है; यह अनुवाद केवल ‘अंधा कर दिया’ की अपेक्षा मूल की तीव्रता अधिक स्पष्ट रखता है।
- source_word: וַיּוֹרִידוּ אוֹתוֹ עַזָּתָה
  choice: वे उसे गाज़ा ले गए
  rationale: हिफ़ील रूप यहाँ नीचे अथवा उस दिशा में ले जाने का अर्थ देता है। हिन्दी में ‘गाज़ा ले गए’ स्वाभाविक है; स्थाननाम का दिशासूचक ה गंतव्य को दर्शाता है।
- source_word: וַיַּאַסְרוּהוּ בַּנְחֻשְׁתַּיִם
  choice: उसे काँसे की बेड़ियों से जकड़ दिया
  rationale: אסר बाँधने को और נְחֻשְׁתַּיִם धातु की बेड़ियों को दर्शाता है। ‘जकड़ दिया’ बंदी बनाने की क्रिया और बेड़ियों की दृढ़ता दोनों को सहज हिन्दी में व्यक्त करता है।
- source_word: וַיְהִי טוֹחֵן
  choice: वह … चक्की पीसता रहा
  rationale: यह रचना लगातार चलने वाली अवस्था या श्रम को दिखाती है। हिन्दी में ‘चक्की पीसता रहा’ उस क्रिया का स्वाभाविक मुहावरा है, यद्यपि ‘चक्की’ मूल में स्पष्ट कर्म के रूप में नहीं दिया गया।
- source_word: בְּבֵית הָאֲסִירִים
  choice: बंदीगृह में
  rationale: शाब्दिक पदबंध ‘बंदियों का घर’ है। ‘बंदीगृह’ आधुनिक, गरिमापूर्ण और सहज हिन्दी में उसी कारागार-संदर्भ को व्यक्त करता है।
