- source_word: וַיָּחֶל
  choice: लगे
  rationale: क्रिया आरम्भ होने का भाव देती है; ‘बढ़ने लगे’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: שְׂעַר רֹאשׁוֹ
  choice: उसके सिर के बाल
  rationale: इब्रानी रचना का पूरा भाव सुरक्षित रखता है और शिमशोन के सिर के बालों पर कथात्मक बल बनाए रखता है।
- source_word: לְצַמֵּחַ
  choice: फिर से बढ़ने
  rationale: צמח का मूल अर्थ ‘उगना/बढ़ना’ है; पहले बाल मूँडे जाने के प्रसंग के कारण ‘फिर से’ सन्दर्भगत भाव स्पष्ट करता है।
- source_word: כַּאֲשֶׁר
  choice: के बाद
  rationale: यहाँ समय-संबंध को सहज हिन्दी में व्यक्त करता है, यद्यपि ‘जब’ भी सम्भव है।
- source_word: גֻּלָּח
  choice: मूँडे जाने
  rationale: निष्क्रिय क्रिया का भाव रखता है; हिन्दी में यह बालों के मूँडे जाने को स्वाभाविक ढंग से व्यक्त करता है।
