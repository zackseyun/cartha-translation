base_translation:
  language: en
  yaml_path: translation/ot/judges/016/014.yaml
  text: Then she fastened it with the pin and said to him[a], “The Philistines are upon you[c][b], Samson!” And he awoke from his sleep and pulled away the pin of the loom and the web.
translation:
  language: hi
  text: तब उसने उसे खूंटी[a] से कस दिया और उससे कहा, “शिमशोन, पलिश्ती तुम पर चढ़ आए हैं!” वह नींद से जाग उठा और उसने करघे की खूंटी तथा बुने हुए कपड़े[b] को उखाड़ दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “कीलनुमा पिन।” इब्रानी शब्द खूंटी या पिन, दोनों के लिए प्रयुक्त हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “बुनी हुई सामग्री।” इब्रानी शब्द करघे पर बुनी गई वस्तु को सूचित करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּתְקַע בַּיָּתֵד
  choice: उसने उसे खूंटी से कस दिया
  rationale: תקע का मूल भाव गाड़ने या दृढ़ता से लगाने का है। बुनाई के प्रसंग में ‘खूंटी से कस दिया’ क्रिया के साधन और किसी वस्तु को स्थिर करने के निहित भाव, दोनों को स्वाभाविक हिन्दी में व्यक्त करता है; कर्म इब्रानी में अव्यक्त है, इसलिए हिन्दी का ‘उसे’ संदर्भगत रूप से रखा गया है।
- source_word: פְּלִשְׁתִּים עָלֶיךָ
  choice: पलिश्ती तुम पर चढ़ आए हैं
  rationale: यह शिमशोन-वृत्तांत में बार-बार आने वाली चेतावनी है। ‘तुम पर चढ़ आए हैं’ इब्रानी मुहावरे की तात्कालिकता और आक्रमण का भाव बनाए रखता है।
- source_word: וַיִּיקַץ מִשְּׁנָתוֹ
  choice: वह नींद से जाग उठा
  rationale: क्रिया और उसके साथ आए संबंधसूचक पदबंध का सीधा, स्वाभाविक और कथात्मक हिन्दी अनुवाद।
- source_word: וַיִּסַּע
  choice: उखाड़ दिया
  rationale: נסע यहाँ प्रस्थान करने के अर्थ में नहीं, बल्कि जमी या लगी हुई वस्तु को बलपूर्वक हटाने के अर्थ में है। ‘उखाड़ दिया’ इस भौतिक क्रिया को संक्षेप और स्पष्टता से व्यक्त करता है।
- source_word: יְתַד הָאֶרֶג
  choice: करघे की खूंटी
  rationale: יָתֵד खूंटी या कीलनुमा पिन हो सकती है; बुनाई के प्रसंग में ‘करघे की खूंटी’ सामान्य पाठक के लिए उपकरण का संबंध स्पष्ट करती है।
- source_word: הַמַּסָּכֶת
  choice: बुना हुआ कपड़ा
  rationale: यह शब्द करघे पर बनी हुई बुनी सामग्री को सूचित करता है। ‘बुना हुआ कपड़ा’ तकनीकी रूप से अधिक संकीर्ण ‘ताना’ की अपेक्षा अर्थ को खुला और सुबोध रखता है।
