  text: וַ/תֹּ֕אמֶר פְּלִשְׁתִּ֥ים עָלֶ֖י/ךָ שִׁמְשׁ֑וֹן וַ/יִּקַ֣ץ מִ/שְּׁנָת֗/וֹ וַ/יֹּ֨אמֶר֙ אֵצֵ֞א כְּ/פַ֤עַם בְּ/פַ֨עַם֙ וְ/אִנָּעֵ֔ר וְ/הוּא֙ לֹ֣א יָדַ֔ע כִּ֥י יְהוָ֖ה סָ֥ר מֵ/עָלָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/020.yaml
  text: And she said[a], “The Philistines are upon you, Samson!” And he awoke from his sleep and said, “I will go out as at other times and shake myself free.” But he did not know that Yahweh had departed from him.
translation:
  language: hi
  text: और उसने कहा, “शिमशोन, पलिश्ती तुम पर आ पड़े हैं!” वह अपनी नींद से जागा और बोला, “मैं पहले की बारों की तरह बाहर निकलूँगा और अपने को झटकूँगा[a]।” पर वह नहीं जानता था कि याहवे उससे हट गया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और अपने को झटककर मुक्त करूँगा।” संदर्भ में इसका भाव सम्भवतः पहले की तरह अपने को झटककर छुड़ा लेने का है।
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּלִשְׁתִּים עָלֶיךָ
  choice: पलिश्ती तुम पर चढ़ आए हैं
  rationale: शत्रुतापूर्ण कर्ता के साथ עַל आसन्न आक्रमण या धर-पकड़ का संकेत देता है। यह हिंदी मुहावरा मूल की तात्कालिकता और सजीवता को स्वाभाविक रूप से व्यक्त करता है।
- source_word: וַיִּקַץ מִשְּׁנָתוֹ
  choice: वह नींद से जागा
  rationale: क्रिया יקץ और מִשְּׁנָתוֹ का सीधा, सहज और गरिमापूर्ण हिंदी रूप।
- source_word: אֵצֵא
  choice: मैं ... बाहर निकलूँगा
  rationale: יצא का सामान्य अर्थ ‘बाहर निकलना’ है। आक्रमणकारियों का सामना करना संदर्भ में निहित हो सकता है, पर मूल पाठ उसे स्पष्ट नहीं करता।
- source_word: כְּפַעַם בְּפַעַם
  choice: पहले की तरह इस बार भी
  rationale: यह पदबंध पिछली बारों में बार-बार हुई घटनाओं की ओर संकेत करता है। चुना हुआ रूप शिमशोन की इस धारणा को स्वाभाविक हिंदी में व्यक्त करता है कि इस बार भी परिणाम पहले जैसा होगा।
- source_word: וְאִנָּעֵר
  choice: और अपने को झटककर छुड़ा लूँगा
  rationale: נער का निफ़अल रूप यहाँ स्वयं को झटककर बंधन या पकड़ से मुक्त करने का भाव दे सकता है। ‘छुड़ा लूँगा’ संदर्भगत परिणाम को व्यक्त करता है, जबकि पाद-टिप्पणी अधिक शाब्दिक विकल्प सुरक्षित रखती है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चतुराक्षरीय ईश्वरीय नाम को किसी उपाधि से बदलने के बजाय आधुनिक हिंदी में उसके नाम के लिप्यंतरण के रूप में रखा गया है।
- source_word: סָר מֵעָלָיו
  choice: उसके पास से हट गया था
  rationale: סור עם מֵעַל पीछे हटने या दूर हो जाने का भाव देता है। यह रूप ईश्वरीय प्रस्थान के कथन को बनाए रखता है, पर उसकी प्रकृति या स्थायित्व की अतिरिक्त व्याख्या नहीं करता।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु; यहोवा
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम सीधे आया है। ‘याहवे’ नाम को उपाधि में बदले बिना सुरक्षित रखता है।
- issue: याहवे के शिमशोन से हट जाने का स्वरूप
  choice: याहवे उसके पास से हट गया था
  alternative: याहवे की सामर्थ्य देने वाली उपस्थिति उससे हट गई थी; याहवे उसे छोड़ गया था
  rationale: पद ईश्वरीय प्रस्थान का कथन करता है, पर यह स्पष्ट नहीं करता कि इसका आशय केवल सामर्थ्य देने वाली उपस्थिति, वाचा-संबंधी अनुग्रह, या किसी अन्य धर्मवैज्ञानिक श्रेणी से है। इसलिए अनुवाद इस तनाव को बिना अतिरिक्त व्याख्या के बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी में, कथात्मक और गरिमापूर्ण रखी गई है। संवाद में तात्कालिकता के लिए ‘तुम पर चढ़ आए हैं’ और शिमशोन के आत्मविश्वास के लिए ‘पहले की तरह इस बार भी’ प्रयुक्त है। पाद-टिप्पणी चिह्न [a] उसी वाक्यांश के बाद रखा गया है जिससे वह संबंधित है।
