base_translation:
  language: en
  yaml_path: translation/ot/judges/016/023.yaml
  text: The rulers of the Philistines gathered to offer a great sacrifice to Dagon their god and to celebrate[a], and they said[b], “Our god has given Samson our enemy into our hand.”
translation:
  language: hi
  text: पलिश्तियों के शासक[a] अपने देवता दागोन को एक बड़ा बलिदान चढ़ाने और उत्सव मनाने के लिए इकट्ठे हुए। उन्होंने कहा, “हमारे देवता ने हमारे शत्रु शिमशोन को हमारे हाथ में[b] सौंप दिया है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “पलिश्तियों के अधिपति”।
    reason: lexical_alternative
  - marker: b
    text: मूल इब्रानी में “हमारे हाथ में”; यह किसी के अधिकार या नियंत्रण में कर देने का मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: סַרְנֵי
  choice: शासक
  rationale: यह शब्द पलिश्ती नगर-राज्यों के सर्वोच्च अधिकारियों को सूचित करता है। ‘शासक’ आधुनिक हिन्दी में स्पष्ट है और उनके शासन-संबंधी पद को व्यक्त करता है।
- source_word: נֶאֱסְפוּ
  choice: इकट्ठे हुए
  rationale: निफ़अल रूप यहाँ एक समूह के रूप में एकत्र होने का भाव देता है; ‘इकट्ठे हुए’ सहज और स्पष्ट हिन्दी है।
- source_word: לִזְבֹּחַ זֶבַח גָּדוֹל
  choice: एक बड़ा बलिदान चढ़ाने
  rationale: धातु और उसी मूल की संज्ञा का इब्रानी प्रयोग बलिदान के कार्य पर बल देता है। हिन्दी में अनावश्यक पुनरुक्ति से बचते हुए ‘एक बड़ा बलिदान चढ़ाने’ धार्मिक संदर्भ और बल दोनों को सुरक्षित रखता है।
- source_word: לְדָגוֹן אֱלֹהֵיהֶם
  choice: अपने देवता दागोन को
  rationale: दागोन बलिदान पाने वाला देवता है। ‘अपने देवता’ संबंध को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: וּלְשִׂמְחָה
  choice: और उत्सव मनाने के लिए
  rationale: שִׂמְחָה हर्ष और उत्सवी आनंद को दर्शाता है; विजय-समारोह के इस प्रसंग में यह स्वाभाविक उद्देश्यवाचक अनुवाद है।
- source_word: נָתַן ... בְּיָדֵנוּ
  choice: हमारे हाथ में कर दिया है
  rationale: यह मुहावरा किसी को दूसरे के अधिकार या नियंत्रण में सौंप देने का अर्थ रखता है। हिन्दी में ‘हाथ में कर दिया’ मूल बिंब को बनाए रखता है, और पादटिप्पणी उसका आशय स्पष्ट करती है।
- source_word: שִׁמְשׁוֹן
  choice: शिमशोन
  rationale: व्यक्तिनाम का रूप मूल इब्रानी उच्चारण के निकट देवनागरी लिप्यंतरण में दिया गया है।
- source_word: אוֹיְבֵינוּ
  choice: हमारे शत्रु
  rationale: रूपात्मक प्रत्यय बहुवचन स्वामित्व (‘हमारा’) का है, जबकि संज्ञा इस प्रसंग में एक ही व्यक्ति शिमशोन को सूचित करती है; ‘हमारे शत्रु’ हिन्दी में इस अर्थ को ठीक व्यक्त करता है।
theological_decisions:
- issue: पलिश्ती संदर्भ में אֱלֹהֵיהֶם / אֱלֹהֵינוּ का वचन
  choice: देवता / हमारे देवता
  alternative: देवताओं / हमारे देवताओं
  rationale: दोनों प्रयोग तत्काल प्रसंग में नामित दागोन की ओर संकेत करते हैं। इसलिए एकवचन पाठ के वाक्य-विन्यास और अर्थ के सबसे अनुकूल है तथा यहाँ अनावश्यक बहुदेववादी बहुवचन नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और सार्वजनिक पाठ के योग्य शैली रखी गई है। आरंभिक וְ को अलग से ‘अब’ नहीं बनाया गया, क्योंकि स्रोत में स्पष्ट कालसूचक ‘अब’ नहीं है। मूल के दो समन्वित खंड हिन्दी की स्वाभाविकता के लिए दो वाक्यों में दिए गए हैं। पादटिप्पणी-चिह्न अपने वास्तविक शब्दगत संदर्भों—‘शासक’ और ‘हमारे हाथ में’—पर लगाए गए हैं।
