  text: इसके बाद शिमशोन ने सोरेक की घाटी[a] में एक स्त्री से प्रेम किया, और उसका नाम दलीला था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सोरेक की वादी के पास।” इब्रानी शब्द נַחַל घाटी, जलधारा का तल या मौसमी जलमार्ग दर्शा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי כֵן
  choice: इसके बाद
  rationale: इब्रानी कथात्मक सूत्र का समय-संबंध स्वाभाविक आधुनिक हिन्दी में स्पष्ट करता है, बिना अनावश्यक शाब्दिक जड़ता के।
- source_word: וַיֶּאֱהַב
  choice: प्रेम किया
  rationale: क्रिया אָהַב का सीधा अर्थ सुरक्षित रखता है और ‘प्रेम में पड़ गया’ जैसी अतिरिक्त भावात्मक छाया नहीं जोड़ता।
- source_word: אִשָּׁה
  choice: एक स्त्री
  rationale: संदर्भ में विवाह का संकेत नहीं है; इसलिए ‘पत्नी’ की अपेक्षा तटस्थ ‘स्त्री’ उचित है।
- source_word: בְּנַחַל שֹׂרֵק
  choice: सोरेक की घाटी में
  rationale: נַחַל घाटी, जलधारा का तल या मौसमी जलमार्ग सूचित कर सकता है। मुख्य पाठ में ‘घाटी’ सहज भौगोलिक अर्थ देता है और पादटिप्पणी मूल की व्यापकता बताती है।
- source_word: וּשְׁמָהּ
  choice: उसका नाम ... था
  rationale: स्त्री के नाम का स्पष्ट परिचय देता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: דְּלִילָה
  choice: दलीला
  rationale: व्यक्तिवाचक नाम का हिन्दी में प्रचलित बाइबलीय लिप्यंतरण।
