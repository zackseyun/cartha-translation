source:
  edition: WLC
  text: וַ֠/יְהִי כִּֽי הֵצִ֨יקָה לּ֧/וֹ בִ/דְבָרֶ֛י/הָ כָּל הַ/יָּמִ֖ים וַ/תְּאַֽלֲצֵ֑/הוּ וַ/תִּקְצַ֥ר נַפְשׁ֖/וֹ לָ/מֽוּת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/016.yaml
  text: And it happened that[a], when she pressed him with her words all the days and urged him on, his soul grew short to the point of death.
translation:
  language: hi
  text: और ऐसा हुआ कि जब वह हर दिन अपनी बातों से उसे सताती रहती और उस पर ज़ोर डालती रहती, तब उसका जी मरने तक तंग आ गया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “उसका प्राण मरने तक छोटा हो गया।” यह मुहावरा अत्यन्त व्याकुलता, झुँझलाहट या थकावट व्यक्त करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּי
  choice: और ऐसा हुआ कि जब
  rationale: इब्रानी कथात्मक संक्रमण को बनाए रखते हुए आधुनिक और सहज हिन्दी में प्रस्तुत करता है।
- source_word: הֵצִיקָה לוֹ בִדְבָרֶיהָ
  choice: अपनी बातों से उसे सताती
  rationale: क्रिया द्वारा व्यक्त मानसिक कष्ट और लगातार डाले जा रहे मौखिक दबाव, दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: כָּל הַיָּמִים
  choice: हर दिन
  rationale: इब्रानी के शाब्दिक ‘सारे दिनों’ का स्वाभाविक हिन्दी रूप है और निरंतर दोहराव का भाव बनाए रखता है।
- source_word: וַתְּאַלֲצֵהוּ
  choice: उस पर ज़ोर डालती रही
  rationale: आग्रह से बढ़कर दबाव और विवश करने की कोशिश का भाव देता है तथा पहली क्रिया से अर्थगत वृद्धि बनाए रखता है।
- source_word: וַתִּקְצַר נַפְשׁוֹ
  choice: उसका जी ... तंग आ गया
  rationale: ‘प्राण छोटा हो गया’ वाले इब्रानी मुहावरे का हिन्दी में निकट, सजीव और बोधगम्य मुहावरेदार रूप है; ‘जी’ यहाँ भीतरी व्यक्ति और सहनशक्ति को व्यक्त करता है।
- source_word: לָמוּת
  choice: मरने तक
  rationale: चरम सीमा का भाव सुरक्षित रखता है, पर यह अनावश्यक रूप से निष्कर्ष नहीं निकालता कि शिमशोन ने मरने की स्पष्ट इच्छा व्यक्त की थी।
theological_decisions:
- issue: לָמוּת से शिमशोन की मानसिक दशा का आशय
  choice: ‘मरने तक’ द्वारा चरम व्यथा और असहनीयता व्यक्त की गई
  alternative: ‘वह मरना चाहता था’
  rationale: मूल पाठ चरम अवस्था बताता है, पर आत्महत्या की स्पष्ट इच्छा का कथन नहीं करता; इसलिए उस अर्थ को अनावश्यक रूप से नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘उसका जी तंग आ गया’ हिन्दी का स्वाभाविक मुहावरा है, जबकि पादटिप्पणी मूल इब्रानी चित्र को सुरक्षित रखती है।
