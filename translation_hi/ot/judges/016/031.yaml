source:
  edition: WLC
  text: וַ/יֵּרְד֨וּ אֶחָ֜י/ו וְ/כָל בֵּ֣ית אָבִי/הוּ֮ וַ/יִּשְׂא֣וּ אֹת/וֹ֒ וַֽ/יַּעֲל֣וּ וַ/יִּקְבְּר֣וּ אוֹת֗/וֹ בֵּ֤ין צָרְעָה֙ וּ/בֵ֣ין אֶשְׁתָּאֹ֔ל בְּ/קֶ֖בֶר מָנ֣וֹחַ אָבִ֑י/ו וְ/ה֛וּא שָׁפַ֥ט אֶת יִשְׂרָאֵ֖ל עֶשְׂרִ֥ים שָׁנָֽה־׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/031.yaml
  text: Then his brothers and all his father’s household came down[a], carried him away, brought him up, and buried him between Zorah and Eshtaol, in the tomb of Manoah his father. And he judged Israel twenty years.
translation:
  language: hi
  text: तब उसके भाई और उसके पिता के घराने के सब लोग नीचे आए, उसके शव को उठाकर ऊपर ले गए और सोरा और एश्ताओल के बीच, उसके पिता मानोह की कब्र में उसे दफ़ना दिया। उसने इस्राएल का न्याय बीस वर्ष तक किया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह इस्राएल का न्याय बीस वर्ष तक कर चुका था।” हिब्रू वाक्य को उसके जीवन का पीछे मुड़कर दिया गया सार भी समझा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּרְדוּ
  choice: नीचे आए
  rationale: क्रिया ירד नीचे की ओर गति व्यक्त करती है; कथा के दृष्टिकोण से ‘नीचे आए’ स्वाभाविक है और दिशात्मक अर्थ बनाए रखता है।
- source_word: אֶחָיו
  choice: उसके भाई
  rationale: אח का सामान्य अर्थ सगे या पारिवारिक भाई है; प्रसंग इसे व्यापक ‘कुटुम्बी’ अर्थ देने की माँग नहीं करता।
- source_word: כָל בֵּית אָבִיהוּ
  choice: उसके पिता के घराने के सब लोग
  rationale: ‘पिता का घर’ पैतृक परिवार या घराने की सामाजिक इकाई है; आधुनिक हिन्दी में यह अभिव्यक्ति अर्थ स्पष्ट करती है।
- source_word: וַיִּשְׂאוּ אֹתוֹ
  choice: उसके शव को उठाकर
  rationale: दफ़नाने के प्रसंग में נשא शरीर को उठाकर ले जाने का बोध देता है। हिन्दी में मृत्यु स्पष्ट करने के लिए ‘शव’ प्रसंग-संगत है, यद्यपि हिब्रू में सर्वनाम है।
- source_word: וַיַּעֲלוּ
  choice: ऊपर ले गए
  rationale: עלה ऊपर की ओर, सम्भवतः स्थलाकृतिक, गति दर्शाता है; पहले उल्लिखित शव को साथ ले जाना क्रिया-क्रम से निहित है।
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: उसे दफ़ना दिया
  rationale: קבר के लिए यह सामान्य, स्पष्ट और आधुनिक हिन्दी अभिव्यक्ति है।
- source_word: בֵּין צָרְעָה וּבֵין אֶשְׁתָּאֹל
  choice: सोरा और एश्ताओल के बीच
  rationale: दो स्थानों के बीच दफ़नाने का स्थान सीधे व्यक्त किया गया है; नामों को हिन्दी बाइबलीय रूपों में लिप्यंतरित किया गया है।
- source_word: בְּקֶבֶר מָנוֹחַ אָבִיו
  choice: उसके पिता मानोह की कब्र में
  rationale: קבר यहाँ कब्र अथवा पारिवारिक समाधि-स्थान हो सकता है; ‘कब्र’ सामान्य हिन्दी है और ‘उसके पिता’ का संबंध स्पष्ट रखती है।
- source_word: וְהוּא שָׁפַט אֶת־יִשְׂרָאֵל
  choice: उसने इस्राएल का न्याय किया
  rationale: न्यायियों में שפט पुस्तक की आवर्ती भूमिका-संबंधी क्रिया है; ‘न्याय किया’ उस शब्दावली को बनाए रखता है और ‘शासन किया’ जैसी व्याख्यात्मक संकीर्णता से बचता है।
- source_word: עֶשְׂרִים שָׁנָה
  choice: बीस वर्ष तक
  rationale: समयावधि का सीधा और स्वाभाविक हिन्दी रूप।
theological_decisions:
- issue: शिमशोन के न्याय-काल का समापन-सार
  choice: उसने इस्राएल का न्याय बीस वर्ष तक किया
  alternative: वह इस्राएल का न्याय बीस वर्ष तक कर चुका था
  rationale: दफ़नाने के वृत्तांत के बाद आया हिब्रू रूप साधारण भूतकालीन समापन-सार या पूर्वकालिक पुनरावलोकन, दोनों रूपों में समझा जा सकता है। मुख्य पाठ पुस्तक की आवर्ती सूत्रात्मक शैली रखता है; पादटिप्पणी दूसरी सम्भावना सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘नीचे आए/ऊपर ले गए’ से मूल की स्थलाकृतिक दिशाएँ सुरक्षित हैं। मुख्य पाठ में पुस्तक की पारंपरिक ‘न्याय करना’ शब्दावली रखी गई है और कालगत अस्पष्टता पादटिप्पणी में दर्शाई गई है।
