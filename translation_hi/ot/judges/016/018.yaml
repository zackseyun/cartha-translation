  text: וַ/תֵּ֣רֶא דְלִילָ֗ה כִּֽי הִגִּ֣יד לָ/הּ֮ אֶת כָּל לִבּ/וֹ֒ וַ/תִּשְׁלַ֡ח וַ/תִּקְרָא֩ לְ/סַרְנֵ֨י פְלִשְׁתִּ֤ים לֵ/אמֹר֙ עֲל֣וּ הַ/פַּ֔עַם כִּֽי הִגִּ֥יד ל/ה אֶת כָּל לִבּ֑/וֹ וְ/עָל֤וּ אֵלֶ֨י/הָ֙ סַרְנֵ֣י פְלִשְׁתִּ֔ים וַ/יַּעֲל֥וּ הַ/כֶּ֖סֶף בְּ/יָדָֽ/ם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/018.yaml
  text: When Delilah saw that he had told her all his heart[a], she sent and called for the Philistine rulers, saying, “Come up this time[c][b], for he has told her all his heart.” Then the Philistine rulers came up to her and brought the silver in their hands.
translation:
  language: hi
  text: जब दलीला ने देखा कि शिमशोन ने अपने मन की सारी बात दलीला को बता दी थी, तब उसने पलिश्तियों के सरदारों[a] को भेजकर बुलाया और कहा, “इस बार आ जाओ, क्योंकि उसने अपने मन की सारी बात उसे[b] बता दी है।” तब पलिश्तियों के सरदार उसके पास आए और चाँदी[c] अपने हाथों में लेकर आए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “पलिश्तियों के शासक।”
    reason: lexical_alternative
  - marker: b
    text: प्राप्त इब्रानी पाठ में यहाँ “उसे” है। प्रत्यक्ष कथन में “मुझे” अपेक्षित लग सकता है, पर अनुवाद में तृतीय पुरुष स्त्रीलिंग को सुरक्षित रखा गया है।
    reason: textual_variant
  - marker: c
    text: अर्थात भुगतान के रूप में दी जाने वाली चाँदी।
    reason: cultural_note
lexical_decisions:
- source_word: וַתֵּרֶא
  choice: जब ... ने देखा
  rationale: ראה के मूल अर्थ ‘देखना’ को रखते हुए कथा में इसके प्रसंगगत बोध और कालक्रम को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אֶת כָּל לִבּוֹ
  choice: अपने मन की सारी बात
  rationale: इब्रानी ‘उसका सारा हृदय’ पूर्ण आंतरिक भेद खोल देने का मुहावरा है; शाब्दिक ‘अपना सारा हृदय’ की अपेक्षा यह आधुनिक हिन्दी में अर्थ को स्पष्ट और स्वाभाविक ढंग से पहुँचाता है।
- source_word: וַתִּשְׁלַח וַתִּקְרָא
  choice: बुलवा भेजा
  rationale: दोनों क्रियाओं—भेजना और बुलाना—के संयुक्त अर्थ को सहज हिन्दी प्रयोग में समेटता है।
- source_word: סַרְנֵי פְלִשְׁתִּים
  choice: पलिश्तियों के सरदार
  rationale: סרן पलिश्ती उच्च शासकीय पदाधिकारी को दर्शाता है; ‘सरदार’ सामान्य पाठक के लिए स्पष्ट है और ‘प्रभु’ की अनचाही धार्मिक ध्वनि से बचाता है।
- source_word: עֲלוּ הַפַּעַם
  choice: इस बार आ जाओ
  rationale: הַפַּעַם का ‘इस बार’ और दलीला की ओर गति का ‘आ जाओ’ स्वाभाविक हिन्दी में सुरक्षित रहता है।
- source_word: כִּי הִגִּיד לָהּ אֶת כָּל לִבּוֹ
  choice: क्योंकि उसने अपने मन की सारी बात उसे बता दी है
  rationale: प्राप्त इब्रानी पाठ के तृतीय पुरुष स्त्रीलिंग ‘उसे’ को प्रत्यक्ष कथन की असामान्यता के बावजूद बिना संशोधन सुरक्षित रखा गया है।
- source_word: וַיַּעֲלוּ הַכֶּסֶף בְּיָדָם
  choice: चाँदी अपने हाथों में लेकर आए
  rationale: चाँदी को भुगतान के रूप में साथ लाने का अर्थ स्पष्ट करता है तथा ‘चाँदी’ और ‘अपने हाथों में’ दोनों स्रोत-तत्व रखता है।
