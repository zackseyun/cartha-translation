base_translation:
  language: en
  yaml_path: translation/ot/judges/016/002.yaml
  text: The Gazites were told[a], saying, “Samson has come here.” So they surrounded him and lay in wait for him all night at the city gate. They kept quiet all night, saying, “Until the light of morning[c][b], then we will kill him.”
translation:
  language: hi
  text: गाज़ा के लोगों को बताया गया[a], “शिमशोन यहाँ आया है।” तब उन्होंने उसे घेर लिया और सारी रात नगर के फाटक पर उसकी घात में बैठे रहे। वे सारी रात चुप रहे[b] और कहते रहे, “भोर का उजाला होते ही[c] हम उसे मार डालेंगे।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “गाज़ावासियों को बताया गया।”
    reason: lexical_alternative
  - marker: b
    text: या, “बिना हलचल किए रहे”; इब्रानी शब्द घात लगाते समय के मौन और गुप्त ढंग का संकेत देता है।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से, “सुबह के प्रकाश तक।”
    reason: lexical_alternative
lexical_decisions:
- source_word: לַעַזָּתִים
  choice: गाज़ा के लोगों को
  rationale: यह गाज़ा के निवासियों के लिए प्रयुक्त बहुवचन स्थानीय-संज्ञा है। आधुनिक हिन्दी में यह रूप स्वाभाविक और स्पष्ट है।
- source_word: לֵאמֹר
  choice: बताया गया
  rationale: मूल में शाब्दिक रूप से ‘कहते हुए’ है, पर प्रसंग समाचार पहुँचने का भाव देता है; हिन्दी में निष्क्रिय प्रयोग स्वाभाविक है।
- source_word: בָּא ... הֵנָּה
  choice: यहाँ आया है
  rationale: पूर्ण क्रिया आगमन को वर्तमान स्थिति से संबद्ध तथ्य के रूप में बताती है।
- source_word: וַיָּסֹבּוּ
  choice: उन्होंने उसे घेर लिया
  rationale: क्रिया का अर्थ चारों ओर जाना या घेरना है। मूल में कर्म व्यक्त नहीं है; प्रसंग के अनुसार ‘उसे’ सम्भावित पूर्ति है।
- source_word: וַיֶּאֶרְבוּ לוֹ
  choice: उसकी घात में बैठे रहे
  rationale: यह शत्रुतापूर्वक छिपकर अवसर की प्रतीक्षा करने का स्वाभाविक हिन्दी मुहावरा है।
- source_word: כָל הַלַּיְלָה
  choice: सारी रात
  rationale: पूरी अवधि को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בְּשַׁעַר הָעִיר
  choice: नगर के फाटक पर
  rationale: नगर से निकलने के रणनीतिक स्थान, फाटक-क्षेत्र, को स्पष्ट रूप से दर्शाता है।
- source_word: וַיִּתְחָרְשׁוּ
  choice: चुपचाप रहे
  rationale: हित्पएल रूप यहाँ मौन या बिना हलचल किए गुप्त ढंग से प्रतीक्षा करने का भाव देता है।
- source_word: עַד אוֹר הַבֹּקֶר
  choice: भोर का उजाला होने तक
  rationale: ‘सुबह के प्रकाश तक’ की मूल छवि को सहज आधुनिक हिन्दी में बनाए रखता है।
- source_word: וַהֲרְגְנֻהוּ
  choice: तब हम उसे मार डालेंगे
  rationale: पहले पुरुष बहुवचन और तृतीय पुरुष एकवचन कर्म को व्यक्त करता है; ‘तब’ प्रसंग में निहित समय-क्रम स्पष्ट करता है।
