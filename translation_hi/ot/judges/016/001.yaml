base_translation:
  language: en
  yaml_path: translation/ot/judges/016/001.yaml
  text: Samson went to Gaza[a], and there he saw a prostitute, and he went in to her.
translation:
  language: hi
  text: शिमशोन गाज़ा गया। वहाँ उसने एक वेश्या को देखा और वह उसके पास गया[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात, उसने उसके साथ यौन-संबंध बनाए। इब्रानी पदबंध का सामान्य अर्थ है, “वह उसके पास आया”; इस संदर्भ में यह यौन-संबंध के लिए प्रयुक्त एक प्रचलित संकेतात्मक अभिव्यक्ति है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: गया
  rationale: कथात्मक क्रम में הלך गति का सामान्य क्रिया-पद है; ‘गया’ सहज और सटीक है।
- source_word: שִׁמְשׁוֹן
  choice: शिमशोन
  rationale: इब्रानी नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: עַזָּתָה
  choice: गाज़ा
  rationale: स्थान-नाम के साथ लगा दिशासूचक ה नगर की ओर गति बताता है; हिन्दी में क्रिया ‘गया’ के साथ ‘गाज़ा’ स्वाभाविक रूप से गंतव्य व्यक्त करता है।
- source_word: וַיַּרְא שָׁם
  choice: वहाँ उसने ... देखा
  rationale: שָׁם का अर्थ ‘वहाँ’ है; यह शब्दक्रम आधुनिक हिन्दी में स्वाभाविक है।
- source_word: אִשָּׁה זוֹנָה
  choice: एक वेश्या
  rationale: זוֹנָה यहाँ देह-व्यापार करने वाली स्त्री को सूचित करता है। ‘वेश्या’ आधुनिक हिन्दी में संक्षिप्त और अर्थ-सटीक है।
- source_word: וַיָּבֹא אֵלֶיהָ
  choice: वह उसके पास गया
  rationale: यह पदबंध संदर्भ में यौन-संबंध का प्रचलित संकेतात्मक प्रयोग है। ‘उसके पास गया’ मूल की परोक्ष अभिव्यक्ति और उसकी संभावित सतही अस्पष्टता दोनों को बनाए रखता है।
theological_decisions:
- issue: וַיָּבֹא אֵלֶיהָ के यौनार्थ को मुख्य पाठ में स्पष्ट करना या इब्रानी संकेतात्मक भाषा को बनाए रखना
  choice: मुख्य पाठ में ‘वह उसके पास गया’ रखकर संकेतात्मक अभिव्यक्ति को बनाए रखा गया
  alternative: उसने उसके साथ यौन-संबंध बनाए / वह उसके साथ सोया
  rationale: संदर्भ यौन-संबंध का प्रबल संकेत देता है, पर इब्रानी स्पष्ट यौन क्रिया के बजाय परोक्ष पदबंध का प्रयोग करता है। मुख्य पाठ में उसी स्तर की स्पष्टता बनाए रखते हुए अर्थ को पादटिप्पणी में बताया गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘हरजाई’ जैसे पुराने शब्द से बचकर ‘वेश्या’ चुना गया है। पादटिप्पणी-चिह्न संबंधित संकेतात्मक वाक्यांश के बाद रखा गया है।
