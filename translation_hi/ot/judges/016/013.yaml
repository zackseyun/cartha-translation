  text: וַ/תֹּ֨אמֶר דְּלִילָ֜ה אֶל שִׁמְשׁ֗וֹן עַד הֵ֜נָּה הֵתַ֤לְתָּ בִּ/י֙ וַ/תְּדַבֵּ֤ר אֵלַ/י֙ כְּזָבִ֔ים הַגִּ֣ידָ/ה לִּ֔/י בַּ/מֶּ֖ה תֵּאָסֵ֑ר וַ/יֹּ֣אמֶר אֵלֶ֔י/הָ אִם תַּאַרְגִ֗י אֶת שֶׁ֛בַע מַחְלְפ֥וֹת רֹאשִׁ֖/י עִם הַ/מַּסָּֽכֶת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/013.yaml
  text: Then Delilah said to Samson[a], “Until now you have mocked me and told me lies. Tell me what you may be bound with.” And he said to her, “If you weave the seven locks of my head with the web.”
translation:
  language: hi
  text: तब दलीला ने शिमशोन से कहा, “अब तक तुम मेरा उपहास करते और मुझसे झूठ बोलते आए हो। मुझे बताओ कि तुम्हें किससे बाँधा जा सकता है।” उसने उससे कहा, “यदि तुम मेरे सिर की सातों लटों को करघे के ताने-बाने में बुन दो[a]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यदि तुम मेरे बालों की सातों चोटियों को बुने हुए कपड़े के साथ बुन दो।” यहाँ प्रयुक्त इब्रानी शब्द बुनाई से जुड़ा एक विशिष्ट शब्द है; उसका आशय करघे का ताना-बाना, बुना हुआ कपड़ा, या सम्भवतः करघा हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵתַ֤לְתָּ בִּי
  choice: तुम मेरा उपहास करते आए हो
  rationale: यह क्रिया किसी के साथ छलपूर्ण ढंग से खिलवाड़ करने या उसे उपहास का पात्र बनाने का भाव देती है। अगले वाक्यांश में झूठ का स्पष्ट उल्लेख होने के कारण यहाँ ‘उपहास’ दोनों भावों को अनावश्यक रूप से नहीं मिलाता।
- source_word: כְּזָבִים
  choice: झूठ
  rationale: बहुवचन अर्थ को स्वाभाविक आधुनिक हिन्दी में सामूहिक ‘झूठ’ से व्यक्त किया गया है।
- source_word: הַגִּידָה לִּי
  choice: मुझे बताओ
  rationale: आज्ञार्थक रूप का सीधा, स्वाभाविक और गरिमापूर्ण हिन्दी रूप।
- source_word: בַּמֶּה תֵּאָסֵר
  choice: तुम्हें किससे बाँधा जा सकता है
  rationale: ‘किससे’ इब्रानी के साधनवाचक भाव को सुरक्षित रखता है और कर्मवाच्य सम्भावना को भी व्यक्त करता है।
- source_word: תַּאַרְגִי
  choice: बुन दो
  rationale: ארג का मूल अर्थ बुनना है; स्त्रीलिंग एकवचन क्रिया का लक्ष्य दलीला है, जो हिन्दी संदर्भ से स्पष्ट है।
- source_word: שֶׁבַע מַחְלְפוֹת רֹאשִׁי
  choice: मेरे सिर की सातों लटों
  rationale: מחלפות बालों की लटों या चोटियों का संकेत दे सकता है। ‘लटों’ मूल की अस्पष्टता को अपेक्षाकृत सुरक्षित रखता और हिन्दी में स्वाभाविक है।
- source_word: עִם הַמַּסָּכֶת
  choice: बुने हुए कपड़े के साथ
  rationale: מַסָּכֶת यहाँ करघे पर बुने जा रहे ताने-बाने, कपड़े या उससे संबंधित उपकरण का विशिष्ट शब्द है। मुख्य पाठ में ‘बुने हुए कपड़े’ संदर्भानुकूल है, जबकि विकल्प पादटिप्पणी में रखे गए हैं।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, कथात्मक और गरिमापूर्ण रखी गई है। ‘उपहास करते और ... झूठ बोलते आए हो’ से अब तक जारी व्यवहार का भाव आता है। बुनाई संबंधी तकनीकी अस्पष्टता को मुख्य पाठ में सहज रूप देकर पादटिप्पणी में सुरक्षित रखा गया है।
