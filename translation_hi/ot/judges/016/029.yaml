source:
  edition: WLC
  text: וַ/יִּלְפֹּ֨ת שִׁמְשׁ֜וֹן אֶת שְׁנֵ֣י עַמּוּדֵ֣י הַ/תָּ֗וֶךְ אֲשֶׁ֤ר הַ/בַּ֨יִת֙ נָכ֣וֹן עֲלֵי/הֶ֔ם וַ/יִּסָּמֵ֖ךְ עֲלֵי/הֶ֑ם אֶחָ֥ד בִּ/ימִינ֖/וֹ וְ/אֶחָ֥ד בִּ/שְׂמֹאלֽ/וֹ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/029.yaml
  text: Then Samson grasped the two middle pillars on which the house stood[a], and he braced himself against them[b], one with his right hand and one with his left.
translation:
  language: hi
  text: तब शिमशोन ने बीच के उन दोनों खंभों[a] को कसकर पकड़ लिया, जिन पर भवन टिका हुआ था, और उनके सहारे अपने को जमा लिया[b]—एक को अपने दाहिने हाथ से और दूसरे को अपने बाएँ हाथ से।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “दोनों केंद्रीय खंभों।”
    reason: lexical_alternative
  - marker: b
    text: या, “उन पर झुक गया।” इब्रानी क्रिया का अर्थ किसी वस्तु पर झुकना या उसका सहारा लेना भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלְפֹּת
  choice: कसकर पकड़ लिया
  rationale: यह क्रिया दृढ़ता से पकड़ने या जकड़ने का भाव देती है। ‘कसकर पकड़ लिया’ आधुनिक हिन्दी में स्वाभाविक है और क्रिया की जानबूझकर की गई दृढ़ता को व्यक्त करती है।
- source_word: שְׁנֵי עַמּוּדֵי הַתָּוֶךְ
  choice: बीच के उन दोनों खंभों
  rationale: עַמּוּדֵי का अर्थ ‘खंभे’ और הַתָּוֶךְ का अर्थ ‘बीच/मध्य’ है। यह पदबंध भवन के मध्यवर्ती दो खंभों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אֲשֶׁר הַבַּיִת נָכוֹן עֲלֵיהֶם
  choice: जिन पर भवन टिका हुआ था
  rationale: נָכוֹן यहाँ स्थापित या सहारा पाए होने का भाव देता है। ‘टिका हुआ था’ स्पष्ट करता है कि भवन इन खंभों पर संरचनात्मक रूप से निर्भर था।
- source_word: וַיִּסָּמֵךְ עֲלֵיהֶם
  choice: उनके सहारे अपने को जमा लिया
  rationale: סמך का अर्थ किसी वस्तु पर झुकना, उसका सहारा लेना, या उसके विरुद्ध अपने शरीर को दृढ़ करना हो सकता है। प्रसंग में ‘अपने को जमा लिया’ आगामी बल लगाने के लिए शिमशोन की शारीरिक मुद्रा को व्यक्त करता है, जबकि पादटिप्पणी अधिक शाब्दिक विकल्प सुरक्षित रखती है।
- source_word: אֶחָד בִּימִינוֹ וְאֶחָד בִּשְׂמֹאלוֹ
  choice: एक को अपने दाहिने हाथ से और दूसरे को अपने बाएँ हाथ से
  rationale: אֶחָד ... וְאֶחָד का वितरणात्मक प्रयोग प्रत्येक ओर एक खंभे को दर्शाता है। ‘दाहिने हाथ’ और ‘बाएँ हाथ’ शारीरिक क्रिया को हिन्दी में स्पष्ट और सहज बनाते हैं।
- source_word: הַבַּיִת
  choice: भवन
  rationale: शब्द का मूल अर्थ ‘घर’ है, पर यहाँ वह बड़ी सार्वजनिक संरचना के लिए प्रयुक्त है। प्रसंग में ‘भवन’ अधिक स्वाभाविक है और किसी विशिष्ट धार्मिक स्थापत्य को अनावश्यक रूप से नहीं जोड़ता।
