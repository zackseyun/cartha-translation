  text: וַ/תִּקַּ֣ח דְּלִילָה֩ עֲבֹתִ֨ים חֲדָשִׁ֜ים וַ/תַּאַסְרֵ֣/הוּ בָ/הֶ֗ם וַ/תֹּ֤אמֶר אֵלָי/ו֙ פְּלִשְׁתִּ֤ים עָלֶ֨י/ךָ֙ שִׁמְשׁ֔וֹן וְ/הָ/אֹרֵ֖ב יֹשֵׁ֣ב בֶּ/חָ֑דֶר וַֽ/יְנַתְּקֵ֛/ם מֵ/עַ֥ל זְרֹעֹתָ֖י/ו כַּ/חֽוּט׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/012.yaml
  text: Then Delilah took new ropes and bound him with them[a], and said to him, “The Philistines are upon you, Samson!” Now the ambush was sitting in the inner room[c][b], but he snapped them from off his arms like a thread.
translation:
  language: hi
  text: तब दलीला ने नई रस्सियाँ[a] लेकर उसे उनसे बाँध दिया और उससे कहा, “शिमशोन, पलिश्ती तुम पर चढ़ आए हैं!” घात लगाने वाला भीतरी कमरे[c] में बैठा था[b]। और उसने उन रस्सियों को अपनी बाँहों पर से धागे की तरह तोड़ डाला।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “नई मोटी डोरियाँ।”
    reason: lexical_alternative
  - marker: b
    text: या “घात लगाए हुए लोग भीतरी कमरे में बैठे थे।” मूल इब्रानी में छिपकर प्रतीक्षा करने वाले के लिए एकवचन कृदन्त है, जिसे सामूहिक अर्थ में भी समझा जा सकता है।
    reason: lexical_alternative
  - marker: c
    text: “भीतरी कमरे” का अनुवाद “कक्ष” भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲבֹתִים
  choice: रस्सियाँ
  rationale: यह शब्द मोटी बाँधने वाली डोरियों या रस्सियों को दर्शाता है; ‘रस्सियाँ’ आधुनिक हिन्दी में स्वाभाविक है और अन्त के ‘धागा’ से स्पष्ट विरोध बनाता है।
- source_word: חֲדָשִׁים
  choice: नई
  rationale: विशेषण का सीधा अर्थ सुरक्षित रहता है और बताता है कि रस्सियाँ पहले इस्तेमाल की हुई या कमजोर नहीं थीं।
- source_word: וַתַּאַסְרֵהוּ
  choice: उसे उनसे बाँध दिया
  rationale: अर्थ को स्पष्ट रखते हुए मूल क्रिया אסר के बाँधने के भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: פְּלִשְׁתִּים עָלֶיךָ
  choice: पलिश्ती तुम पर चढ़ आए हैं
  rationale: यह चेतावनी की तात्कालिकता और निकट आक्रमण के इब्रानी मुहावरे को स्वाभाविक, गरिमापूर्ण हिन्दी में रखता है।
- source_word: וְהָאֹרֵב
  choice: घात लगाने वाला
  rationale: मूल में एकवचन कृदन्त है। इसे एकवचन व्यक्ति के रूप में रखने से सामूहिक ‘घात’ मान लेने के बजाय मूल की वास्तविक अस्पष्टता सुरक्षित रहती है।
- source_word: יֹשֵׁב
  choice: बैठा था
  rationale: यह मूल के ठोस ‘बैठने’ के अर्थ को बनाए रखता है, जबकि प्रसंग से प्रतीक्षा करना स्वतः स्पष्ट है।
- source_word: בֶּחָדֶר
  choice: भीतरी कमरे में
  rationale: חֶדֶר किसी निजी या भीतर के कक्ष को सूचित कर सकता है; ‘भीतरी कमरा’ छिपे होने के प्रसंग में सम्भावित अर्थ देता है।
- source_word: וַיְנַתְּקֵם
  choice: उन रस्सियों को ... तोड़ डाला
  rationale: क्रिया बलपूर्वक अलग कर देने या तोड़ने का भाव देती है; ‘तोड़ डाला’ तुलना के अनुरूप सहज हिन्दी है।
- source_word: מֵעַל זְרֹעֹתָיו
  choice: अपनी बाँहों पर से
  rationale: मूल की स्थानवाचक अभिव्यक्ति को स्पष्ट और स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: כַּחוּט
  choice: जैसे कोई धागा हो
  rationale: एकवचन उपमा और अत्यन्त आसानी से टूट जाने की सजीव छवि को बनाए रखता है।
