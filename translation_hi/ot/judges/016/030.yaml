  text: וַ/יֹּ֣אמֶר שִׁמְשׁ֗וֹן תָּמ֣וֹת נַפְשִׁ/י֮ עִם פְּלִשְׁתִּים֒ וַ/יֵּ֣ט בְּ/כֹ֔חַ וַ/יִּפֹּ֤ל הַ/בַּ֨יִת֙ עַל הַ/סְּרָנִ֔ים וְ/עַל כָּל הָ/עָ֖ם אֲשֶׁר בּ֑/וֹ וַ/יִּהְי֤וּ הַ/מֵּתִים֙ אֲשֶׁ֣ר הֵמִ֣ית בְּ/מוֹת֔/וֹ רַבִּ֕ים מֵ/אֲשֶׁ֥ר הֵמִ֖ית בְּ/חַיָּֽי/ו־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/030.yaml
  text: And Samson said[a], “Let me die with the Philistines.” Then he bent with all his strength, and the house fell on the rulers and on all the people who were in it[c][b]. So the dead whom he killed at his death were more than those whom he had killed during his life.
translation:
  language: hi
  text: तब शिमशोन ने कहा, “मैं पलिश्तियों के साथ मर जाऊँ।” फिर वह पूरी शक्ति से झुका, और भवन पलिश्ती शासकों[a] और उसमें मौजूद सभी लोगों पर गिर पड़ा। इस प्रकार, उसकी मृत्यु के समय उसके द्वारा मारे गए लोग उन लोगों से अधिक थे जिन्हें उसने अपने जीवनकाल में मारा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “पलिश्ती सरदार।” यह शब्द पलिश्तियों के प्रमुख शासकों की उपाधि है।
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּמוֹת נַפְשִׁי
  choice: मैं ... मर जाऊँ
  rationale: नֶפֶשׁ यहाँ व्यक्ति स्वयं के लिए मुहावरेदार प्रयोग है। हिन्दी में “मैं मर जाऊँ” इच्छासूचक भाव को स्वाभाविक रूप से व्यक्त करता है और शरीर से अलग ‘आत्मा’ की कोई अनावश्यक धारणा नहीं जोड़ता।
- source_word: עִם פְּלִשְׁתִּים
  choice: पलिश्तियों के साथ
  rationale: עִם का सीधा अर्थ ‘साथ’ है और यह शिमशोन के अपने शत्रुओं के साथ मरने की तत्परता व्यक्त करता है।
- source_word: וַיֵּט בְּכֹחַ
  choice: अपनी पूरी शक्ति लगाकर ज़ोर लगाया
  rationale: נטה का मूल भाव झुकने या एक ओर बल लगाने का हो सकता है। खम्भों पर दबाव डालने के प्रसंग में यह हिन्दी अभिव्यक्ति शारीरिक क्रिया को अत्यधिक विशिष्ट बनाए बिना प्रबल प्रयास स्पष्ट करती है।
- source_word: הַבַּיִת
  choice: भवन
  rationale: בַּיִת सामान्यतः ‘घर’ है, पर यहाँ बड़ी सभा वाली संरचना के लिए आधुनिक हिन्दी में ‘भवन’ अधिक स्वाभाविक है। ‘मन्दिर’ कहना प्रसंगानुकूल हो सकता है, पर मूल शब्द से अधिक व्याख्यात्मक होगा।
- source_word: הַסְּרָנִים
  choice: पलिश्ती शासक
  rationale: סְרָנִים पलिश्तियों के विशिष्ट प्रमुखों या शासकों को सूचित करता है। ‘शासक’ उनकी राजनीतिक हैसियत स्पष्ट करता है; पहचान स्पष्ट करने के लिए ‘पलिश्ती’ जोड़ा गया है।
- source_word: כָּל הָעָם אֲשֶׁר בּוֹ
  choice: उसमें मौजूद सभी लोग
  rationale: यह भवन के भीतर उपस्थित लोगों की सम्पूर्णता को संक्षिप्त और स्वाभाविक हिन्दी में रखता है।
- source_word: אֲשֶׁר הֵמִית בְּמוֹתוֹ
  choice: अपनी मृत्यु के समय मार डाला
  rationale: यह शिमशोन की अपनी मृत्यु और उसके द्वारा उसी घटना में कराई गई मौतों के समयगत सम्बन्ध को स्पष्ट रखता है।
- source_word: רַבִּים מֵאֲשֶׁר הֵמִית בְּחַיָּיו
  choice: अपने जीवनकाल में जितने लोगों को मारा था, उससे कहीं अधिक
  rationale: तुलनात्मक रचना को सहज हिन्दी में व्यक्त करता है। ‘कहीं अधिक’ רַבִּים की संख्यात्मक प्रचुरता और तुलना दोनों को दर्शाता है।
theological_decisions:
- issue: शिमशोन के अन्तिम कथन में נֶפֶשׁ का अनुवाद
  choice: मैं पलिश्तियों के साथ मर जाऊँ
  alternative: मेरी आत्मा पलिश्तियों के साथ मर जाए
  rationale: यहाँ נֶפֶשׁ शिमशोन स्वयं के लिए मुहावरा है। ‘आत्मा’ का शाब्दिक अनुवाद मूल कथन में निहित न होने वाला आत्मा-शरीर सम्बन्धी धार्मिक निष्कर्ष सुझा सकता है।
- issue: विनाशकारी घटना के वर्णन में नैतिक मूल्यांकन
  choice: घटना को बिना अनुमोदन या निन्दा जोड़े कथात्मक रूप में प्रस्तुत किया गया
  alternative: शिमशोन के कार्य को बलिदान, आत्महत्या अथवा दैवी न्याय के रूप में स्पष्ट करना
  rationale: इस पद में कथावाचक मुख्यतः घटना और मृतकों की संख्या बताता है; उसका नैतिक या सिद्धान्तगत वर्गीकरण अनुवाद में जोड़ना उचित नहीं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘ज़ोर लगाया’ बोलचाल में समझ आने वाला है, जबकि ‘भवन’, ‘शासक’ और ‘जीवनकाल’ वर्णन की गरिमा बनाए रखते हैं। मुख्य पाठ में फुटनोट चिह्न [a] सम्बद्ध शब्द के तुरन्त बाद दिया गया है।
