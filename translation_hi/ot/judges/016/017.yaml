  text: וַ/יַּגֶּד לָ֣/הּ אֶת כָּל לִבּ֗/וֹ וַ/יֹּ֤אמֶר לָ/הּ֙ מוֹרָה֙ לֹֽא עָלָ֣ה עַל רֹאשִׁ֔/י כִּֽי נְזִ֧יר אֱלֹהִ֛ים אֲנִ֖י מִ/בֶּ֣טֶן אִמִּ֑/י אִם גֻּלַּ֨חְתִּי֙ וְ/סָ֣ר מִמֶּ֣/נִּי כֹחִ֔/י וְ/חָלִ֥יתִי וְ/הָיִ֖יתִי כְּ/כָל הָ/אָדָֽם־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/017.yaml
  text: So he told her all his heart and said to her[a], “A razor has never come upon my head, for I have been a Nazirite of God from my mother’s womb. If I am shaved, then my strength will leave me[c][b], and I will become weak and be like every other man.”
translation:
  language: hi
  text: तब उसने अपने मन की सारी बात उसे बता दी[a] और उससे कहा, “मेरे सिर पर कभी उस्तरा नहीं चला, क्योंकि मैं अपनी माँ के गर्भ से ही परमेश्वर का नाज़ीर[b] हूँ। यदि मेरा सिर मुँड़ाया गया, तो मेरा बल मुझसे चला जाएगा; मैं निर्बल हो जाऊँगा और किसी भी अन्य मनुष्य के समान हो जाऊँगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “उसने अपना सारा हृदय उसे बता दिया”; अर्थात उसने उससे कुछ नहीं छिपाया।
    reason: lexical_alternative
  - marker: b
    text: “नाज़ीर” उस व्यक्ति के लिए एक विशेष पद है जो परमेश्वर के लिए विशेष रूप से समर्पित होता है।
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּגֶּד ... אֶת כָּל לִבּוֹ
  choice: उसने अपने मन की सारी बात उसे बता दी
  rationale: इब्रानी मुहावरे में ‘उसका सारा हृदय’ है और आशय पूर्ण रूप से मन की बात प्रकट करना है। यह हिन्दी रूप अर्थ और हृदय/मन की छवि दोनों को स्वाभाविक ढंग से रखता है।
- source_word: מוֹרָה לֹא עָלָה עַל רֹאשִׁי
  choice: मेरे सिर पर कभी उस्तरा नहीं चला
  rationale: ‘उस्तरा सिर पर चढ़ना’ की मूल छवि को शब्दशः रखने के बजाय हिन्दी का स्वाभाविक मुहावरा ‘उस्तरा चलना’ लिया गया है; निषेध का आजीवन भाव ‘कभी’ से स्पष्ट है।
- source_word: נְזִיר אֱלֹהִים
  choice: परमेश्वर का नाज़ीर
  rationale: ‘नाज़ीर’ विशेष समर्पण की तकनीकी संज्ञा है। लिप्यंतरण गिनती 6 और शिमशोन के बुलावे के बीच शास्त्रीय संबंध बनाए रखता है, जबकि ‘परमेश्वर का’ मूल संबंधसूचक रचना को सुरक्षित रखता है।
- source_word: מִבֶּטֶן אִמִּי
  choice: अपनी माँ के गर्भ से ही
  rationale: यह जन्म से आरम्भ हुए समर्पण का स्वाभाविक और निकट हिन्दी रूप है; ‘ही’ आरम्भ-बिंदु पर बल को व्यक्त करता है।
- source_word: אִם גֻּלַּחְתִּי
  choice: यदि मेरा सिर मुँड़ाया गया
  rationale: इब्रानी क्रिया कर्मवाच्य है, इसलिए यह नहीं कहा गया कि शिमशोन स्वयं सिर मुँड़ाएगा। प्रसंग में निहित ‘सिर’ हिन्दी में स्पष्ट किया गया है।
- source_word: וְסָר מִמֶּנִּי כֹחִי
  choice: मेरा बल मुझसे जाता रहेगा
  rationale: यह शक्ति के उससे दूर हो जाने की इब्रानी अभिव्यक्ति को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: וְחָלִיתִי
  choice: मैं निर्बल हो जाऊँगा
  rationale: प्रसंग में क्रिया बीमारी की अपेक्षा शक्ति खोने की दशा बताती है; ‘निर्बल’ उसी परिणाम को स्पष्ट करता है।
- source_word: כְּכָל הָאָדָם
  choice: हर दूसरे मनुष्य के समान
  rationale: शिमशोन अपनी असाधारण शक्ति की तुलना सामान्य मनुष्यों से करता है। ‘दूसरे’ हिन्दी में इस विरोध को स्वाभाविक रूप से स्पष्ट करता है, जबकि ‘मनुष्य’ אָדָם का उपयुक्त सामान्य अर्थ देता है।
theological_decisions:
- issue: शिमशोन के समर्पण के लिए נְזִיר का अनुवाद
  choice: परमेश्वर का नाज़ीर
  alternative: परमेश्वर को विशेष रूप से समर्पित व्यक्ति
  rationale: तकनीकी पद का लिप्यंतरण उसके व्यवस्थागत और कथात्मक संबंध को बनाए रखता है; पादटिप्पणी सामान्य पाठक के लिए उसका संक्षिप्त अर्थ देती है।
- issue: शक्ति और नाज़ीर समर्पण के संबंध को व्यक्त करना
  choice: मूल के अनुसार शिमशोन के कथन को बिना अतिरिक्त व्याख्या के रखा गया
  alternative: यह स्पष्ट जोड़ना कि बाल स्वयं शक्ति का जादुई स्रोत नहीं थे
  rationale: पद शिमशोन का कथन प्रस्तुत करता है, उसके धर्मवैज्ञानिक तंत्र की व्याख्या नहीं। अनुवाद को न तो बालों में स्वतंत्र जादुई शक्ति आरोपित करनी चाहिए, न इस पद में अनुपस्थित व्याख्या जोड़नी चाहिए।
- issue: כְּכָל הָאָדָם में אָדָם का दायरा
  choice: हर दूसरे मनुष्य के समान
  alternative: हर दूसरे पुरुष के समान
  rationale: यहाँ तुलना सामान्य मानव दशा से है। आधुनिक हिन्दी में ‘मनुष्य’ स्रोत के सामूहिक/सामान्य भाव को अधिक सहजता से रखता है और शिमशोन के पुरुष होने को मिटाता नहीं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक रखी गई है। ‘उस्तरा चला’, ‘सिर मुँड़ाया गया’ और ‘निर्बल हो जाऊँगा’ सामान्य हिन्दी में स्पष्ट हैं। ‘नाज़ीर’ तकनीकी शास्त्रीय पद के रूप में रखा गया है और पादटिप्पणी में समझाया गया है।
