source:
  edition: WLC
  text: וַ/יִּשְׁכַּ֣ב שִׁמְשׁוֹן֮ עַד חֲצִ֣י הַ/לַּיְלָה֒ וַ/יָּ֣קָם בַּ/חֲצִ֣י הַ/לַּ֗יְלָה וַ/יֶּאֱחֹ֞ז בְּ/דַלְת֤וֹת שַֽׁעַר הָ/עִיר֙ וּ/בִ/שְׁתֵּ֣י הַ/מְּזוּז֔וֹת וַ/יִּסָּעֵ/ם֙ עִֽם הַ/בְּרִ֔יחַ וַ/יָּ֖שֶׂם עַל כְּתֵפָ֑י/ו וַֽ/יַּעֲלֵ/ם֙ אֶל רֹ֣אשׁ הָ/הָ֔ר אֲשֶׁ֖ר עַל פְּנֵ֥י חֶבְרֽוֹן־׀־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/003.yaml
  text: And Samson lay until midnight[a]. Then he arose at midnight and seized the doors of the city gate and the two doorposts, and pulled them up with the bar[b]; he put them on his shoulders and carried them up to the top of the hill that is opposite Hebron.
translation:
  language: hi
  text: और शिमशोन आधी रात तक लेटा रहा। फिर वह आधी रात को उठा और उसने नगर के फाटक के दोनों किवाड़ों और उसके दोनों बाजू के खंभों को पकड़कर अर्गले समेत उखाड़ लिया। उसने उन्हें अपने कंधों पर रखा और उस पहाड़ी की चोटी पर ऊपर ले गया जो हेब्रोन के सामने है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: लेटा रहा
  rationale: שׁכב यहाँ लेटने की अवस्था बताता है; पाठ स्पष्ट रूप से यह नहीं कहता कि वह सोया था, इसलिए ‘लेटा रहा’ उस अनिश्चितता को बनाए रखता है।
- source_word: עַד חֲצִי הַלַּיְלָה / בַּחֲצִי הַלַּיְלָה
  choice: आधी रात तक / आधी रात को
  rationale: हिब्रू ‘रात के आधे’ का स्वाभाविक और स्पष्ट आधुनिक हिन्दी रूप।
- source_word: דַּלְתוֹת שַׁעַר הָעִיר
  choice: नगर के फाटक के दोनों किवाड़ों
  rationale: बहुवचन דלתות फाटक के जोड़ीदार पल्लों को सूचित करता है; ‘किवाड़’ स्थापत्य संदर्भ में स्वाभाविक है।
- source_word: וּבִשְׁתֵּי הַמְּזוּזוֹת
  choice: और दोनों चौखटों
  rationale: מְזוּזוֹת यहाँ फाटक के दोनों पार्श्व-स्तंभों या चौखटों को दर्शाता है; ‘चौखट’ सामान्य पाठक के लिए सहज है।
- source_word: וַיִּסָּעֵם עִם הַבְּרִיחַ
  choice: अर्गले समेत उखाड़ लिया
  rationale: נסע इस संदर्भ में अपने स्थान से निकालने या उखाड़ने का भाव देता है, और עִם बताता है कि अर्गला भी उनके साथ था।
- source_word: וַיָּשֶׂם עַל כְּתֵפָיו
  choice: अपने कंधों पर रखा
  rationale: हिब्रू वाक्यांश का सीधा, स्वाभाविक हिन्दी रूप।
- source_word: וַיַּעֲלֵם
  choice: ले गया
  rationale: पूर्ववर्ती ‘कंधों पर रखा’ से उठाकर ले जाने और ऊपर चढ़ने का प्रसंग स्पष्ट है; हिन्दी में ‘ले गया’ अनावश्यक विस्तार के बिना स्वाभाविक है।
- source_word: אֶל רֹאשׁ הָהָר
  choice: पहाड़ी की चोटी पर
  rationale: רֹאשׁ का अर्थ ‘शीर्ष’ और הָהָר का अर्थ पहाड़ या पहाड़ी हो सकता है; इस स्थल-संदर्भ में यह सहज हिन्दी अभिव्यक्ति है।
- source_word: אֲשֶׁר עַל פְּנֵי חֶבְרוֹן
  choice: जो हेब्रोन के सामने है
  rationale: עַל־פְּנֵי यहाँ हेब्रोन के सामने या उसकी ओर मुख किए होने का भौगोलिक संबंध व्यक्त करता है; ‘सामने’ अस्पष्टता को उचित रूप से बनाए रखता है।
