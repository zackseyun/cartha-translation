  text: וַ/תְּיַשְּׁנֵ֨/הוּ֙ עַל בִּרְכֶּ֔י/הָ וַ/תִּקְרָ֣א לָ/אִ֔ישׁ וַ/תְּגַלַּ֕ח אֶת שֶׁ֖בַע מַחְלְפ֣וֹת רֹאשׁ֑/וֹ וַ/תָּ֨חֶל֙ לְ/עַנּוֹת֔/וֹ וַ/יָּ֥סַר כֹּח֖/וֹ מֵ/עָלָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/019.yaml
  text: So she made him sleep on her knees[a], and she called for a man, and she shaved off the seven locks of his head. Then she began to afflict him[c][b], and his strength left him.
translation:
  language: hi
  text: तब उसने उसे अपने घुटनों पर सुला दिया[a] और एक आदमी को बुलाया। फिर उसने उसके सिर की सातों लटें[b] मुंडवा दीं। तब वह उसे सताने लगी, और उसका बल उससे चला गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपनी गोद में”; शाब्दिक अर्थ, “अपने घुटनों पर।”
    reason: lexical_alternative
  - marker: b
    text: या, “उसके सिर की सातों गूँथी चोटियाँ।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּיַשְּׁנֵהוּ
  choice: उसने उसे ... सुला दिया
  rationale: 'हिफ़ील रूप का कारणवाचक भाव स्पष्ट करता है: दलीला ने शिमशोन को सुला दिया; विधि को अनावश्यक रूप से निर्धारित नहीं करता।'
- source_word: עַל בִּרְכֶּיהָ
  choice: अपने घुटनों पर
  rationale: इब्रानी में शाब्दिक रूप से ‘उसके घुटनों पर’ है। हिन्दी में यह स्वाभाविक है; ‘गोद में’ अर्थगत विकल्प है, जिसे पादटिप्पणी में रखा गया है।
- source_word: וַתִּקְרָא לָאִישׁ
  choice: एक आदमी को बुलाया
  rationale: אִישׁ पर निश्चित उपपद नहीं है और ל के साथ क्रिया किसी आदमी को बुलाने का संकेत देती है। हिन्दी में यह रूप मूल की अनिश्चितता को सहज ढंग से रखता है।
- source_word: וַתְּגַלַּח
  choice: उसने ... मुंडवा दीं
  rationale: क्रिया स्त्रीलिंग एकवचन है और दलीला को व्याकरणिक कर्ता बनाए रखती है। पहले बुलाए गए आदमी की उपस्थिति के कारण हिन्दी का प्रेरणार्थक ‘मुंडवा दीं’ स्वाभाविक रूप से बताता है कि काम उसके आदेश पर हुआ, बिना कर्तृत्व को पुरुष पर स्थानांतरित किए।
- source_word: שֶׁבַע מַחְלְפוֹת רֹאשׁוֹ
  choice: उसके सिर की सातों लटें
  rationale: מַחְלְפוֹת बालों की लटों अथवा गूँथी चोटियों का द्योतक हो सकता है। ‘लटें’ व्यापक और स्वाभाविक है; वैकल्पिक अर्थ पादटिप्पणी में है।
- source_word: וַתָּחֶל לְעַנּוֹתוֹ
  choice: तब वह उसे सताने लगी
  rationale: וַתָּחֶל आरम्भसूचक है और ענה पिएल में सताने, दुःख देने या दबाने का व्यापक अर्थ रखता है। यह अनुवाद किसी विशेष रीति को आरोपित नहीं करता।
- source_word: וַיָּסַר כֹּחוֹ מֵעָלָיו
  choice: उसका बल जाता रहा
  rationale: इब्रानी मुहावरे का स्वाभाविक हिन्दी रूप है और बल के उससे दूर हो जाने को व्यक्त करता है। ‘जाता रहा’ तत्काल कथा-परिणाम के साथ ह्रास की अनुभूति भी बनाए रखता है।
theological_decisions:
- issue: शिमशोन के खोए हुए बल का स्वरूप
  choice: ‘उसका बल जाता रहा’—इस पद में केवल उसी बात को कहना जो इब्रानी पाठ कहता है।
  alternative: ‘यहोवा से मिला उसका बल जाता रहा’ अथवा ‘यहोवा का बल उसे छोड़ गया।’
  rationale: इस पद में यहोवा का स्पष्ट उल्लेख नहीं है। व्यापक प्रसंग बल को परमेश्वर की सामर्थ्य और शिमशोन की नाज़ीर स्थिति से जोड़ता है, पर उसे यहाँ जोड़ना मूल से अधिक व्याख्या करना होगा।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथात्मक शैली रखी गई है। ‘मुंडवा दीं’ प्रसंगानुकूल हिन्दी प्रेरणार्थक है, जो दलीला को मुख्य कर्ता रखते हुए बुलाए गए आदमी के माध्यम से कार्य कराए जाने की संभावना व्यक्त करता है। सभी पादटिप्पणी चिह्न मुख्य पाठ में दिए गए हैं।
