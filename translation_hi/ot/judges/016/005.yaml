base_translation:
  language: en
  yaml_path: translation/ot/judges/016/005.yaml
  text: Then the lords of the Philistines came up to her and said to her[a], “Entice him, and see in what his great strength lies, and by what means we may prevail against him, so that we may bind him to afflict him; and we will each give you eleven hundred pieces of silver.”
translation:
  language: hi
  text: तब पलिश्तियों के सरदार उसके पास आए और उससे कहा, “उसे फुसलाओ और पता लगाओ कि उसका बड़ा बल किस बात में है और हम किस तरह उस पर काबू पा सकें, ताकि हम उसे बाँधकर कष्ट दें। और हममें से हर एक तुझे चाँदी के ग्यारह सौ सिक्के[a] देगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल इब्रानी में शाब्दिक रूप से “ग्यारह सौ चाँदी” है। संभवतः आशय यह है कि हर पलिश्ती सरदार चाँदी के ग्यारह सौ सिक्के या शेकेल देगा।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲלוּ אֵלֶיהָ
  choice: उसके पास आए
  rationale: עלה אל यहाँ किसी व्यक्ति की ओर जाने या उसके पास पहुँचने को व्यक्त करता है; हिंदी में यह स्वाभाविक है और अनावश्यक भौगोलिक अर्थ नहीं जोड़ता।
- source_word: סַרְנֵי פְלִשְׁתִּים
  choice: पलिश्तियों के सरदार
  rationale: סרן पलिश्ती नगर-शासकों की विशिष्ट उपाधि है; ‘सरदार’ आधुनिक हिंदी में पद और सामूहिक नेतृत्व दोनों को सहज रूप से व्यक्त करता है।
- source_word: פַּתִּי
  choice: फुसलाकर
  rationale: पिएल आज्ञार्थक रूप छलपूर्ण रीति से भेद खुलवाने के लिए लुभाने या बहकाने का भाव रखता है; ‘फुसलाना’ अनावश्यक यौन अर्थ जोड़े बिना यह भाव देता है।
- source_word: וּרְאִי בַּמֶּה כֹּחוֹ גָדוֹל
  choice: पता लगा कि उसके महान बल का रहस्य क्या है
  rationale: במה बल के आधार या स्रोत के विषय में पूछता है। ‘रहस्य’ प्रसंगानुकूल निहितार्थ स्पष्ट करता है, जबकि ‘महान बल’ विशेषण को बनाए रखता है।
- source_word: וּבַמֶּה נוּכַל לוֹ
  choice: हम किस तरह उस पर काबू पा सकते हैं
  rationale: יכל ל किसी पर प्रबल होने या उसे वश में करने का मुहावरा है; ‘काबू पा सकते हैं’ शत्रुतापूर्ण आशय को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: וַאֲסַרְנֻהוּ לְעַנֹּתוֹ
  choice: ताकि हम उसे बाँधकर कष्ट दें
  rationale: क्रम और उद्देश्य दोनों सुरक्षित रहते हैं। ענה पिएल का व्यापक अर्थ पीड़ित या प्रताड़ित करना है; ‘कष्ट दें’ इसे किसी अधिक संकीर्ण प्रकार की यातना तक सीमित नहीं करता।
- source_word: וַאֲנַחְנוּ נִתַּן לָךְ אִישׁ אֶלֶף וּמֵאָה כָּסֶף
  choice: तब हममें से हर एक तुझे चाँदी के ग्यारह सौ सिक्के देगा
  rationale: איש यहाँ वितरणार्थक है—प्रत्येक सरदार। मूल पाठ में केवल ‘ग्यारह सौ चाँदी’ है; स्पष्ट हिंदी के लिए ‘सिक्के’ जोड़ा गया है और ‘शेकेल’ की संभावना पादटिप्पणी में रखी गई है।
