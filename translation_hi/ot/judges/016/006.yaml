source:
  edition: WLC
  text: וַ/תֹּ֤אמֶר דְּלִילָה֙ אֶל שִׁמְשׁ֔וֹן הַגִּֽידָ/ה נָּ֣א לִ֔/י בַּ/מֶּ֖ה כֹּחֲ/ךָ֣ גָד֑וֹל וּ/בַ/מֶּ֥ה תֵאָסֵ֖ר לְ/עַנּוֹתֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/006.yaml
  text: Then Delilah said to Samson[a], “Please tell me where your great strength lies, and how you could be bound to afflict you.”
translation:
  language: hi
  text: तब दलीला ने शिमशोन से कहा, “कृपया मुझे बताओ कि तुम्हारी बड़ी शक्ति किसमें है और तुम्हें किस तरह बाँधा जा सकता है, ताकि तुम्हें दबाया जा सके।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: तब ... ने कहा
  rationale: वाव-क्रमागत कथा को आगे बढ़ाता है; ‘तब’ हिन्दी में घटनाक्रम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: דְּלִילָה אֶל שִׁמְשׁוֹן
  choice: दलीला ने शिमशोन से
  rationale: व्यक्तिनामों का प्रचलित हिन्दी लिप्यंतरण किया गया है और אֶל को कथन के साथ स्वाभाविक ‘से’ द्वारा व्यक्त किया गया है।
- source_word: הַגִּידָה נָּא לִי
  choice: कृपया मुझे बताओ
  rationale: הגיד का अर्थ ‘बताना’ है और נָא विनम्र आग्रह प्रकट करता है।
- source_word: בַּמֶּה כֹּחֲךָ גָדוֹל
  choice: तुम्हारी इतनी बड़ी शक्ति का रहस्य क्या है
  rationale: शाब्दिक भाव ‘तुम्हारी शक्ति किसमें बड़ी है’ है; प्रसंग में दलीला उस शक्ति के आधार या रहस्य के विषय में पूछ रही है। यह हिन्दी में स्वाभाविक है, यद्यपि ‘रहस्य’ निहितार्थ को स्पष्ट करता है।
- source_word: וּבַמֶּה תֵאָסֵר
  choice: और तुम्हें किस तरह बाँधा जा सकता है
  rationale: दूसरा בַּמֶּה साधन पूछता है और נिफ़ाल תֵאָסֵר का अर्थ ‘बाँधा जाना’ है।
- source_word: לְעַנּוֹתֶךָ
  choice: ताकि तुम्हें वश में किया जा सके
  rationale: पिएल ענה के अर्थों में दुःख देना, दबाना, दीन करना और वश में करना शामिल हैं; इस प्रसंग में उद्देश्य शिमशोन पर काबू पाना है।
theological_decisions:
- issue: לְעַנּוֹתֶךָ का प्रसंगगत अर्थ
  choice: ताकि तुम्हें वश में किया जा सके
  alternative: ताकि तुम्हें सताया जा सके / दबाया जा सके
  rationale: क्रिया में पीड़ा देने या दीन करने का भाव संभव है, पर न्यायियों 16 के प्रसंग में बाँधने का लक्ष्य शिमशोन को काबू में करना है। चयन प्रसंगगत अर्थ देता है और किसी अतिरिक्त धर्मवैज्ञानिक निष्कर्ष को नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी; कथात्मक, गरिमापूर्ण और सामान्य पाठक के लिए सहज। संबोधन में निकटता के अनुरूप ‘तुम’ रखा गया है।
