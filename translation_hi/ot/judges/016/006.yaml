review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the narrative sequence, Delilah's polite request, Samson's great strength, and the possibility of binding him. However, “रहस्य” makes the question more explicitly about a secret than the Hebrew בַּמֶּה (“in what/by what means”) states. “वश में किया जा सके” is a plausible contextual interpretation of לְעַנּוֹתֶךָ, but it narrows a verb whose core sense includes afflicting, humbling, or oppressing; a closer broad Hindi rendering with a lexical note is preferable.
  naturalness: The Hindi is fluent, modern, and suitably narrative. “तुम्हारी बड़ी शक्ति किसमें है” is both natural and closer to the Hebrew than “तुम्हारी इतनी बड़ी शक्ति का रहस्य क्या है.” “ताकि तुम्हें दबाया जा सके” is natural in this context and preserves more of the source verb’s range than “वश में किया जा सके.”
  terminology: The established Hindi biblical forms “दलीला” and “शिमशोन” are appropriate. “बाँधा जा सकता है” accurately represents the passive Niphal verb. A footnote is warranted for लְעַנּוֹתֶךָ because the Hebrew admits several related senses and the context can support “वश में करना.”
  issues:
  - severity: medium
    issue: “रहस्य” adds an explicit ‘secret’ nuance to בַּמֶּה.
    rationale: The Hebrew asks in what Samson’s great strength consists. Although the narrative setting makes a concealed source likely, the word itself does not expressly say “secret.”
  - severity: medium
    issue: “वश में किया जा सके” presents one contextual interpretation of לְעַנּוֹתֶךָ as though it were exhaustive.
    rationale: The Piel of ענה can mean afflict, oppress, humble, or, contextually, subdue. The translation should retain the broader adverse-treatment sense and note the contextual alternative.
  revised_text: तब दलीला ने शिमशोन से कहा, “कृपया मुझे बताओ कि तुम्हारी बड़ी शक्ति किसमें है और तुम्हें किस तरह बाँधा जा सकता है, ताकि तुम्हें दबाया जा सके।”
