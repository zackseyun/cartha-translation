base_translation:
  language: en
  yaml_path: translation/ot/judges/016/027.yaml
  text: The house was full of men and women[a], and all the lords of the Philistines were there. And on the roof were about three thousand men and women watching Samson as he performed.
translation:
  language: hi
  text: इमारत पुरुषों और स्त्रियों से भरी हुई थी, और पलिश्तियों के सभी सरदार वहाँ उपस्थित थे। छत पर लगभग तीन हज़ार पुरुष और स्त्रियाँ थे, जो शिमशोन का खेल-तमाशा देख रहे थे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “जो शिमशोन को प्रदर्शन करते देख रहे थे”; अधिक शाब्दिक रूप में, “जो शिमशोन के खेल को देख रहे थे।” इब्रानी मूल שׂחק हँसने, खेलने, क्रीड़ा करने, तमाशा करने या मनोरंजन करने का भाव दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבַּיִת
  choice: वह भवन
  rationale: मूल शब्द का सामान्य अर्थ ‘घर/भवन’ है। प्रसंग में यह दागोन के मंदिर-परिसर की इमारत है, पर पद केवल ‘भवन’ कहता है; इसलिए ‘मंदिर’ जोड़कर अर्थ को अनावश्यक रूप से विशिष्ट नहीं किया गया।
- source_word: מָלֵא
  choice: भरा हुआ था
  rationale: यह स्थिति बताने वाला रूप है और आधुनिक हिन्दी में स्वाभाविक ढंग से मूल अर्थ व्यक्त करता है।
- source_word: הָאֲנָשִׁים וְהַנָּשִׁים
  choice: पुरुषों और स्त्रियों
  rationale: मूल में दोनों लिंग स्पष्ट रूप से बताए गए हैं; हिन्दी में भी यह भेद बनाए रखा गया है।
- source_word: כֹּל סַרְנֵי פְלִשְׁתִּים
  choice: पलिश्तियों के सभी सरदार
  rationale: סֶרֶן पलिश्ती शासकों की विशिष्ट पदवी है। ‘सरदार’ उनके उच्च राजनीतिक पद को सामान्य पाठक के लिए स्पष्ट और स्वाभाविक रूप में व्यक्त करता है।
- source_word: וְשָׁמָּה
  choice: वहाँ उपस्थित थे
  rationale: स्थान-सूचक भाव को स्पष्ट रखते हुए हिन्दी वाक्य में स्वाभाविक अभिव्यक्ति दी गई है।
- source_word: וְעַל הַגָּג
  choice: छत पर भी
  rationale: גָּג का अर्थ ‘छत’ है। संयोजक וְ को यहाँ हिन्दी के स्वाभाविक विस्तार-सूचक ‘भी’ से व्यक्त किया गया है।
- source_word: כִּשְׁלֹשֶׁת אֲלָפִים
  choice: लगभग तीन हज़ार
  rationale: उपसर्ग כְּ यहाँ अनुमान प्रकट करता है; ‘लगभग’ उसी अर्थ को स्पष्ट रूप से व्यक्त करता है।
- source_word: אִישׁ וְאִשָּׁה
  choice: पुरुष और स्त्रियाँ
  rationale: एकवचन संज्ञाएँ यहाँ सामूहिक/वितरणात्मक अर्थ में हैं; हिन्दी बहुवचन प्रसंगानुकूल है और दोनों लिंगों का उल्लेख सुरक्षित रखता है।
- source_word: הָרֹאִים בִּשְׂחוֹק שִׁמְשׁוֹן
  choice: जो शिमशोन का तमाशा देख रहे थे
  rationale: הָרֹאִים निरंतर देखने का भाव देता है। בִּשְׂחוֹק में हँसी, खेल, मनोरंजन या तमाशे का अर्थ हो सकता है; ‘तमाशा देख रहे थे’ अपमानजनक सार्वजनिक मनोरंजन के प्रसंग को सहज हिन्दी में व्यक्त करता है, जबकि अस्पष्टता को पादटिप्पणी में रखा गया है।
