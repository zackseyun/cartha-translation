id: JDG.16.11
reference: Judges 16:11
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֵלֶ֔י/הָ אִם אָס֤וֹר יַאַסְר֨וּ/נִי֙ בַּ/עֲבֹתִ֣ים חֲדָשִׁ֔ים אֲשֶׁ֛ר לֹֽא נַעֲשָׂ֥ה בָ/הֶ֖ם מְלָאכָ֑ה וְ/חָלִ֥יתִי וְ/הָיִ֖יתִי כְּ/אַחַ֥ד הָ/אָדָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/011.yaml
  text: He said to her[a], “If they bind me with new ropes that have never been used for work[b], then I will become weak and be like one of the men.”
translation:
  language: hi
  text: उसने उससे कहा, “यदि वे मुझे ऐसी नई रस्सियों से अच्छी तरह बाँध दें, जिनसे कभी कोई काम न लिया गया हो[a], तो मैं निर्बल हो जाऊँगा और किसी अन्य मनुष्य जैसा हो जाऊँगा[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “जिनसे कोई काम न किया गया हो।”
    reason: मूल की निष्क्रिय अभिव्यक्ति का अधिक शाब्दिक विकल्प।
  - marker: b
    text: या, “किसी भी मनुष्य के समान,” अर्थात असाधारण शक्ति से रहित एक सामान्य मनुष्य जैसा।
    reason: כְּאַחַד הָאָדָם के सम्भव स्वाभाविक अर्थ को स्पष्ट करता है।
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלֶיהָ
  choice: उसने उससे कहा
  rationale: इब्रानी कथात्मक रूप शिमशोन के उत्तर का परिचय देता है। हिन्दी में आरम्भिक ‘और’ के बिना यह स्वाभाविक और अर्थपूर्ण है।
- source_word: אִם אָסוֹר יַאַסְרוּנִי
  choice: यदि वे मुझे ... अच्छी तरह बाँध दें
  rationale: धातु के infinitive absolute और finite verb का मेल बाँधने की क्रिया पर बल देता है। ‘अच्छी तरह बाँध दें’ उस बल को स्वाभाविक हिन्दी में व्यक्त करता है, बिना किसी अलग प्रकार की गाँठ का संकेत दिए।
- source_word: בַּעֲבֹתִים חֲדָשִׁים
  choice: नई रस्सियों से
  rationale: עֲבֹתִים मोटी डोरियों या रस्सियों को सूचित करता है; प्रसंग में ‘रस्सियाँ’ आधुनिक हिन्दी का स्पष्ट शब्द है। חֲדָשִׁים का सीधा अर्थ ‘नई’ है।
- source_word: אֲשֶׁר לֹא נַעֲשָׂה בָהֶם מְלָאכָה
  choice: जिनसे कभी कोई काम न लिया गया हो
  rationale: यह उन रस्सियों के अब तक अप्रयुक्त होने का भाव स्वाभाविक हिन्दी में व्यक्त करता है और इब्रानी के ‘उनसे कोई काम नहीं किया गया’ वाले निष्क्रिय निर्माण के निकट रहता है।
- source_word: וְחָלִיתִי
  choice: तो मैं निर्बल हो जाऊँगा
  rationale: חלה यहाँ बीमार पड़ने के बजाय शक्ति खोकर निर्बल होने के अर्थ में है, जैसा कि शिमशोन के प्रसंग से स्पष्ट है।
- source_word: וְהָיִיתִי כְּאַחַד הָאָדָם
  choice: और मनुष्यों में से एक के समान हो जाऊँगा
  rationale: यह एक सामान्य मनुष्य की तरह हो जाने का भाव और मूल की ‘एक के समान’ संरचना दोनों बनाए रखता है।
theological_decisions:
- issue: כְּאַחַד הָאָדָם में הָאָדָם का आशय
  choice: मनुष्यों में से एक के समान
  alternative: किसी भी मनुष्य के समान; एक साधारण मनुष्य जैसा
  rationale: प्रसंग शिमशोन की असाधारण शक्ति और सामान्य मानव-शक्ति के बीच अंतर करता है। अनुवाद इस तुलना को रखता है, पर यह नहीं जोड़ता कि केवल पुरुषों की ही बात हो रही है।
- issue: אָסוֹר יַאַסְרוּנִי की बलात्मक रचना
  choice: अच्छी तरह बाँध दें
  alternative: बाँध दें; अवश्य बाँधें
  rationale: इब्रानी infinitive absolute क्रिया पर वास्तविक बल देता है। ‘अच्छी तरह’ उसे पठनीय हिन्दी में दर्शाता है; ‘कसकर’ सम्भव है, पर वह शारीरिक कसाव का अधिक विशिष्ट अर्थ ला सकता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘निर्बल’ प्रसंगानुकूल और सामान्य पाठकों के लिए स्पष्ट है। दोनों पादटिप्पणी-चिह्न संबंधित वाक्यांशों के तुरंत बाद मुख्य पाठ में दिए गए हैं।
