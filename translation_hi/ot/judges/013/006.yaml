source:
  edition: WLC
  text: וַ/תָּבֹ֣א הָ/אִשָּׁ֗ה וַ/תֹּ֣אמֶר לְ/אִישָׁ/הּ֮ לֵ/אמֹר֒ אִ֤ישׁ הָ/אֱלֹהִים֙ בָּ֣א אֵלַ֔/י וּ/מַרְאֵ֕/הוּ כְּ/מַרְאֵ֛ה מַלְאַ֥ךְ הָ/אֱלֹהִ֖ים נוֹרָ֣א מְאֹ֑ד וְ/לֹ֤א שְׁאִלְתִּ֨י/הוּ֙ אֵֽי מִ/זֶּ֣ה ה֔וּא וְ/אֶת שְׁמ֖/וֹ לֹֽא הִגִּ֥יד לִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/006.yaml
  text: Then the woman came and said to her husband[a], “A man of God came to me, and his appearance was like the appearance of an angel of God, very fearsome. I did not ask him where he was from[b], and he did not tell me his name.”
translation:
  language: hi
  text: तब वह स्त्री अपने पति के पास आई और बोली, “परमेश्वर का एक जन मेरे पास आया था। उसका रूप परमेश्वर के दूत[a] के रूप जैसा था—अत्यन्त भयप्रद[b]। मैंने उससे नहीं पूछा कि वह कहाँ का है, और उसने मुझे अपना नाम नहीं बताया।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “दूत” का अर्थ “सन्देशवाहक” भी हो सकता है। यहाँ पदबंध किसी विशिष्ट दिव्य दूत की ओर संकेत कर सकता है, पर स्त्री ने इस समय उसकी पहचान पूरी तरह की थी, यह आवश्यक नहीं।
    reason: alternative_reading
  - marker: b
    text: इसका अनुवाद “अत्यन्त विस्मयकारी” या “अत्यन्त भयानक” भी किया जा सकता है; इब्रानी शब्द गहरे विस्मय और भय, दोनों का भाव व्यक्त करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאִשָּׁה
  choice: वह स्त्री
  rationale: निश्चित पद और कथानक के अनुसार यह मनोह की पत्नी को सूचित करता है; ‘वह स्त्री’ इब्रानी अभिव्यक्ति को बनाए रखता है।
- source_word: לְאִישָׁהּ
  choice: अपने पति के पास
  rationale: वैवाहिक प्रसंग में אִישָׁהּ का स्वाभाविक अर्थ ‘उसका पति’ है; हिन्दी में कर्ता के साथ ‘अपने पति’ अधिक सहज है।
- source_word: אִישׁ הָאֱלֹהִים
  choice: परमेश्वर का एक जन
  rationale: यह इब्रानी में परमेश्वर से सम्बद्ध प्रतिनिधि के लिए प्रयुक्त मान्य पदवी है। ‘एक’ अनिश्चित उल्लेख को स्पष्ट करता है, जबकि ‘जन’ पदवी की गरिमा बनाए रखता है।
- source_word: וּמַרְאֵהוּ כְּמַרְאֵה
  choice: उसका रूप ... के रूप जैसा था
  rationale: मूल में מַרְאֶה की पुनरावृत्ति है; हिन्दी में ‘रूप’ को दोनों बार रखकर तुलना और बल सुरक्षित रहते हैं।
- source_word: מַלְאַךְ הָאֱלֹהִים
  choice: परमेश्वर के दूत
  rationale: מַלְאַךְ का मूल अर्थ दूत या सन्देशवाहक है। हिन्दी पदबंध लेख की वह निश्चितता थोपे बिना मूल की सम्भावित विशिष्टता और कथानकगत अस्पष्टता बनाए रखता है।
- source_word: נוֹרָא מְאֹד
  choice: अत्यन्त भयप्रद
  rationale: यह पद गहरे भय और विस्मय को जगानेवाले रूप का संकेत करता है। ‘अत्यन्त भयप्रद’ उस तीव्रता को आधुनिक, गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: אֵי מִזֶּה הוּא
  choice: वह कहाँ का है
  rationale: यह मूल के उद्गम या स्थान पूछनेवाले मुहावरे का स्वाभाविक हिन्दी रूप है।
- source_word: וְאֶת שְׁמוֹ לֹא הִגִּיד לִי
  choice: उसने मुझे अपना नाम नहीं बताया
  rationale: वार्तालाप के प्रसंग में הִגִּיד का सहज अर्थ ‘बताया’ है; ‘अपना नाम’ हिन्दी में स्वाभाविक सम्बन्ध व्यक्त करता है।
theological_decisions:
- issue: מַלְאַךְ הָאֱלֹהִים की निश्चितता और आगन्तुक की पहचान
  choice: परमेश्वर के दूत
  alternative: परमेश्वर के एक दूत; परमेश्वर के उस दूत
  rationale: मूल का रचना-संबंधी पदबंध विशिष्ट दूत की ओर संकेत कर सकता है, पर स्त्री की तुलना इस चरण पर पूर्ण पहचान को आवश्यक नहीं बनाती। बिना ‘एक’ या ‘उस’ जोड़े हिन्दी अनुवाद इस कथानकगत तनाव को सुरक्षित रखता है।
- issue: נוֹרָא में भय और श्रद्धामिश्रित विस्मय
  choice: अत्यन्त भयप्रद
  alternative: अत्यन्त विस्मयकारी; अत्यन्त भयानक
  rationale: चुना हुआ रूप भय के मूल तत्त्व को बनाए रखता है, जबकि पादटिप्पणी अर्थ की विस्मयकारी छाया भी बताती है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, कथात्मक और गरिमापूर्ण रखी गई है। ‘परमेश्वर का जन’ बाइबलीय पदवी को बनाए रखता है; शेष वाक्यरचना सामान्य पाठक के लिए सहज है।
