source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ מַלְאַ֨ךְ יְהוָ֜ה אֶל מָנ֗וֹחַ אִם תַּעְצְרֵ֨/נִי֙ לֹא אֹכַ֣ל בְּ/לַחְמֶ֔/ךָ וְ/אִם תַּעֲשֶׂ֣ה עֹלָ֔ה לַ/יהוָ֖ה תַּעֲלֶ֑/נָּה כִּ֚י לֹא יָדַ֣ע מָנ֔וֹחַ כִּֽי מַלְאַ֥ךְ יְהוָ֖ה הֽוּא־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/016.yaml
  text: And the angel of Yahweh said to Manoah[a], “If you detain me, I will not eat your food. But if you prepare a burnt offering[b], offer it up to Yahweh.” For Manoah did not know that he was the angel of Yahweh.
translation:
  language: hi
  text: तब यहोवा के दूत ने मानोह से कहा, “यदि तुम मुझे रोक लो, तो मैं तुम्हारा भोजन[a] नहीं खाऊँगा। लेकिन यदि तुम होमबलि[b] तैयार करो, तो उसे यहोवा को चढ़ाना।” क्योंकि मानोह नहीं जानता था कि वह यहोवा का दूत था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “तुम्हारी रोटी।” यहाँ “रोटी” से आशय सामान्यतः भोजन या भोज से है।
    reason: lexical_alternative
  - marker: b
    text: 'इसे इस प्रकार भी समझा जा सकता है: “यदि तुम होमबलि बनाओ, तो उसे यहोवा को चढ़ाना।” इब्रानी में बलि को बनाने या तैयार करने और उसे चढ़ाने के लिए दो अलग क्रियाएँ हैं।'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: यहोवा का दूत
  rationale: מַלְאַךְ का अर्थ ‘दूत’ या ‘स्वर्गदूत’ हो सकता है। ‘दूत’ मूल शब्द की व्यापकता बनाए रखता है, जबकि इस वृत्तांत का संदर्भ उसके अलौकिक स्वरूप को स्पष्ट करता है।
- source_word: תַּעְצְרֵנִי
  choice: तुम मुझे रोक भी लो
  rationale: עצר यहाँ किसी को जाने से रोककर ठहराए रखने के अर्थ में है। ‘रोक भी लो’ शर्त और निहित रियायत, दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לֹא אֹכַל בְּלַחְמֶךָ
  choice: मैं तुम्हारा भोजन नहीं खाऊँगा
  rationale: לֶחֶם का शाब्दिक अर्थ ‘रोटी’ है, पर यहाँ यह सामान्य भोजन के लिए प्रयुक्त है। संदर्भ में मानोह द्वारा तैयार किए जाने वाले पूरे भोजन की बात है।
- source_word: תַּעֲשֶׂה עֹלָה
  choice: तुम होमबलि तैयार करो
  rationale: עשה बलिदान के साथ ‘बनाना/तैयार करना’ दर्शाता है। ‘तैयार करो’ अगले क्रियापद, अर्थात उसे चढ़ाने, से इस क्रिया का भेद बनाए रखता है।
- source_word: עֹלָה
  choice: होमबलि
  rationale: यह उस बलिदान का प्रचलित हिन्दी नाम है जो पूर्णतः वेदी पर जलाया जाता और धुएँ में ऊपर उठता था।
- source_word: לַיהוָה תַּעֲלֶנָּה
  choice: उसे यहोवा को चढ़ाना
  rationale: עלה का हिफ़ील रूप यहाँ बलि को ऊपर चढ़ाने/अर्पित करने का बलिदानी अर्थ देता है। ‘चढ़ाना’ हिन्दी धार्मिक संदर्भ में स्वाभाविक है और स्त्रीलिंग कर्म-प्रत्यय को ‘उसे’ से व्यक्त करता है।
- source_word: כִּי לֹא יָדַע מָנוֹחַ
  choice: क्योंकि मानोह नहीं जानता था
  rationale: כִּי यहाँ कथावाचक की व्याख्या प्रस्तुत करता है; ‘क्योंकि’ पिछले कथन के पीछे का कारण स्पष्ट करता है।
- source_word: כִּי מַלְאַךְ יְהוָה הוּא
  choice: कि वह यहोवा का दूत था
  rationale: यह मानोह की उस समय की अनभिज्ञता बताता है और הוּא को स्वाभाविक हिन्दी सर्वनाम ‘वह’ से व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चार अक्षरों वाले परमेश्वर के व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से प्रस्तुत किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम יְהוָה है। ‘यहोवा’ उसे उपाधि ‘प्रभु’ से प्रतिस्थापित किए बिना स्पष्ट रूप से प्रस्तुत करता है।
- issue: מַלְאַךְ की पहचान
  choice: दूत
  alternative: स्वर्गदूत
  rationale: ‘दूत’ मूल शब्द की वास्तविक शाब्दिक व्यापकता को बनाए रखता है और पाठक पर पहले से कोई अधिक विशिष्ट वर्गीकरण नहीं थोपता; इस प्रसंग में उसका अलौकिक चरित्र कथा से प्रकट होता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘होमबलि’ स्थापित बाइबलीय-धार्मिक शब्द है। ‘रोक भी लो’ मूल शर्त की शक्ति को स्वाभाविक हिन्दी में व्यक्त करता है, और ‘दूत’ मूल पद की अर्थगत व्यापकता बनाए रखता है।
