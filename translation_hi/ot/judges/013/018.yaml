base_translation:
  language: en
  yaml_path: translation/ot/judges/013/018.yaml
  text: And the angel of Yahweh said to him[a], “Why do you ask my name, seeing it is wonderful?”
translation:
  language: hi
  text: तब याहवे के दूत ने उससे कहा, “तुम मेरा नाम क्यों पूछते हो? वह तो अद्भुत है[a]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद “समझ से परे,” “अगम्य,” या सम्भवतः “गुप्त” भी हो सकता है। इब्रानी शब्द किसी ऐसी असाधारण और विस्मयकारी बात को दर्शाता है जिसे पूरी तरह समझ पाना कठिन हो।
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: याहवे का दूत
  rationale: מַלְאַךְ का अर्थ ‘संदेशवाहक’ या ‘दूत’ हो सकता है; इस अलौकिक प्रकट होने के प्रसंग में हिन्दी का ‘दूत’ स्वाभाविक है और मूल शब्द की दूत-संबंधी व्यापकता भी बनाए रखता है। יְהוָה को व्यक्तिगत नाम ‘याहवे’ के रूप में रखा गया है।
- source_word: לָמָּה זֶּה
  choice: क्यों
  rationale: यह पदबंध आलंकारिक प्रश्न आरम्भ करता है; हिन्दी में ‘क्यों’ उसका सीधा और स्वाभाविक रूप है।
- source_word: תִּשְׁאַל לִשְׁמִי
  choice: तुम मेरा नाम क्यों पूछते हो
  rationale: שׁאל के साथ ל और ‘नाम’ का आशय किसी का नाम पूछना है; यह रूप वर्तमान हिन्दी में स्पष्ट और सीधा है।
- source_word: וְהוּא
  choice: वह तो
  rationale: सर्वनाम ‘वह’ का संबंध ‘मेरा नाम’ से है और ‘तो’ उत्तर की व्याख्यात्मक तथा बलात्मक छाया को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: פֶלִאי
  choice: अद्भुत
  rationale: यह शब्द असाधारण, विस्मयकारी और मानवीय समझ से परे होने का भाव रखता है। ‘अद्भुत’ मुख्य पाठ में संक्षिप्त अर्थ देता है, जबकि उसकी व्यापक अर्थ-छाया पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: פֶלִאי और याहवे के दूत की सम्भावित ईश्वर-प्रकाशन अथवा मसीह-संबंधी अर्थवत्ता
  choice: विशेषण का अनुवाद सामान्य रूप से ‘अद्भुत’ किया गया है और दूत की पहचान पर कोई अतिरिक्त निष्कर्ष नहीं जोड़ा गया।
  alternative: इसे ‘समझ से परे’, ‘अगम्य’ या किसी उपाधि के रूप में अधिक व्याख्यात्मक ढंग से प्रस्तुत करना।
  rationale: मूल पाठ गहरी धर्मवैज्ञानिक अर्थवत्ता की सम्भावना रखता है, पर स्वयं इस पद में दूत की पहचान को स्पष्ट रूप से परिभाषित नहीं करता। सीधा अनुवाद इस तनाव और अस्पष्टता को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। प्रश्न और उत्तर को दो वाक्यों में बाँटने से हिन्दी में संवाद स्वाभाविक बनता है; ‘अद्भुत’ मूल की संक्षिप्तता और धर्मवैज्ञानिक खुलापन बनाए रखता है।
