source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר לִ֔/י הִנָּ֥/ךְ הָרָ֖ה וְ/יֹלַ֣דְתְּ בֵּ֑ן וְ/עַתָּ֞ה אַל תִּשְׁתִּ֣י יַ֣יִן וְ/שֵׁכָ֗ר וְ/אַל תֹּֽאכְלִי֙ כָּל טֻמְאָ֔ה כִּֽי נְזִ֤יר אֱלֹהִים֙ יִהְיֶ֣ה הַ/נַּ֔עַר מִן הַ/בֶּ֖טֶן עַד י֥וֹם מוֹתֽ/וֹ־׀־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/007.yaml
  text: For he said to me[a], ‘Look, you will conceive and bear a son. So now, do not drink wine or strong drink, and do not eat anything unclean[b], for the boy will be a Nazirite of God from the womb until the day of his death.’
translation:
  language: hi
  text: और उसने मुझसे कहा, “देख, तू गर्भवती होगी[a] और एक पुत्र को जन्म देगी। अब तू न तो दाखमधु पीना, न मादक पेय, और न कोई अशुद्ध वस्तु खाना, क्योंकि वह बालक गर्भ ही से अपनी मृत्यु के दिन तक परमेश्वर का नाज़ीर[b] होगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शब्दशः, “देख, तू गर्भवती है और पुत्र जनेगी”; प्रसंग में इसे भावी घोषणा के रूप में भी समझा जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: “नाज़ीर” परमेश्वर के लिए विशेष रूप से अलग किए गए व्यक्ति का तकनीकी पद है।
    reason: technical_term
lexical_decisions:
- source_word: וַיֹּאמֶר לִי
  choice: और उसने मुझसे कहा
  rationale: इब्रानी में सामान्य संयोजक वाव है; ‘और’ स्रोत के क्रम और पत्नी द्वारा स्वर्गदूत के वचन सुनाने की शैली को सीधे व्यक्त करता है।
- source_word: הִנָּךְ הָרָה
  choice: देख, तू गर्भवती होगी
  rationale: शब्दशः वर्तमान अवस्था ‘देख, तू गर्भवती है’ संभव है, पर घोषणा के प्रसंग में भावी अर्थ स्वाभाविक है। पादटिप्पणी मूल की कालगत अस्पष्टता सुरक्षित रखती है।
- source_word: וְיֹלַדְתְּ בֵּן
  choice: और एक पुत्र को जन्म देगी
  rationale: यह आधुनिक हिन्दी में स्वाभाविक है और पुत्र के पुरुषलिंग को स्पष्ट रखता है।
- source_word: וְעַתָּה
  choice: इसलिए अब
  rationale: घोषणा से उसके फलस्वरूप दिए गए निर्देश की ओर संक्रमण को स्पष्ट करता है।
- source_word: יַיִן וְשֵׁכָר
  choice: दाखमधु या कोई और नशीला पेय
  rationale: יַיִן दाख से बने मद्य को और שֵׁכָר अन्य मादक पेय को सूचित करता है; यह अनुवाद दोनों को अलग रखते हुए आधुनिक पाठक के लिए अर्थ स्पष्ट करता है।
- source_word: כָּל טֻמְאָה
  choice: कोई अशुद्ध वस्तु
  rationale: शब्दशः ‘कोई अशुद्धता/अशुद्ध वस्तु’; खाने की क्रिया के साथ यह निषिद्ध खाद्य वस्तु का अर्थ स्वाभाविक रूप से देता है।
- source_word: נְזִיר אֱלֹהִים
  choice: परमेश्वर का नाज़ीर
  rationale: नָזִיר एक विशिष्ट धार्मिक पद है; लिप्यंतरण उस तकनीकी अर्थ को बचाता है और ‘परमेश्वर का’ समर्पण-संबंध को स्रोत के निकट रखता है।
- source_word: הַנַּעַר
  choice: वह बालक
  rationale: जन्म की घोषणा के प्रसंग में ‘बालक’ उपयुक्त है और पहले उल्लिखित पुत्र की ओर संकेत करता है।
- source_word: מִן הַבֶּטֶן
  choice: गर्भ ही से
  rationale: इब्रानी बिंब और आरंभिक समय दोनों को संक्षिप्त, स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: עַד יוֹם מוֹתוֹ
  choice: अपनी मृत्यु के दिन तक
  rationale: स्रोत की समय-सीमा का सीधा अनुवाद है; इसे केवल ‘जीवन भर’ कहकर संक्षिप्त नहीं किया गया।
theological_decisions:
- issue: नाज़ीर पद का अनुवाद
  choice: परमेश्वर का नाज़ीर
  alternative: परमेश्वर को समर्पित व्यक्ति
  rationale: लिप्यंतरण गिनती 6 से जुड़ी विशिष्ट नाज़ीर अवस्था को बनाए रखता है; सामान्य ‘समर्पित’ उस तकनीकी और विधान-संबंधी अर्थ को कम कर सकता है। पादटिप्पणी अर्थ समझाती है, पर मुख्य पाठ में पद सुरक्षित है।
- issue: गर्भधारण की घोषणा का कालगत बल
  choice: तू गर्भवती होगी
  alternative: तू गर्भवती है
  rationale: הָרָה रूपतः ‘गर्भवती’ है और वर्तमान अर्थ दे सकता है, किंतु न्यायियों 13 के घोषणा-प्रसंग में भावी कथन सहज है। मुख्य पाठ प्रसंगगत अर्थ देता है और पादटिप्पणी वास्तविक भाषिक विकल्प बचाती है।
- issue: नाज़ीर अवस्था की अवधि
  choice: गर्भ ही से अपनी मृत्यु के दिन तक
  alternative: जन्म से जीवन भर
  rationale: चुना हुआ रूप इब्रानी के गर्भ और मृत्यु-दिन संबंधी स्पष्ट शब्दों को बनाए रखता है तथा समर्पण की अवधि को न तो घटाता है, न उससे आगे कोई सिद्धांत जोड़ता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सम्मानपूर्ण किंतु सहज कथात्मक शैली। स्त्री से एकवचन संबोधन के लिए प्रसंगानुकूल ‘तू’ रखा गया है। ‘दाखमधु’ और ‘नशीला पेय’ स्रोत के दो पेय-वर्गों का भेद स्पष्ट करते हैं। सभी पादटिप्पणी-चिह्न संबंधित शब्दों के ठीक बाद मुख्य पाठ में दिए गए हैं।
