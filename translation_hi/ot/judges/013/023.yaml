reference: Judges 13:23
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/תֹּ֧אמֶר ל֣/וֹ אִשְׁתּ֗/וֹ לוּ֩ חָפֵ֨ץ יְהוָ֤ה לַ/הֲמִיתֵ֨/נוּ֙ לֹֽא לָקַ֤ח מִ/יָּדֵ֨/נוּ֙ עֹלָ֣ה וּ/מִנְחָ֔ה וְ/לֹ֥א הֶרְאָ֖/נוּ אֶת כָּל אֵ֑לֶּה וְ/כָ/עֵ֕ת לֹ֥א הִשְׁמִיעָ֖/נוּ כָּ/זֹֽאת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/023.yaml
  text: But his wife said to him, “If the LORD had intended to kill us, he would not have accepted from our hand a burnt offering and a grain offering, or shown us all these things, or now announced to us such a thing as this.”
translation:
  language: hi
  text: पर उसकी पत्नी ने उससे कहा, “यदि यहोवा हमें मार डालना चाहता, तो वह हमारे हाथ से होमबलि और अन्नबलि स्वीकार न करता, न हमें ये सब दिखाता, और न अब हमें ऐसी बात बताता।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חָפֵץ
  choice: चाहता
  rationale: यह क्रिया इच्छा या अभिप्राय व्यक्त करती है; शर्त-वाक्य में ‘चाहता’ सहज और अर्थ-सटीक है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ के व्यक्तिगत ईश्वरीय नाम को हिन्दी में प्रचलित लिप्यंतरण द्वारा रखा गया है।
- source_word: עֹלָה
  choice: होमबलि
  rationale: पूरी तरह वेदी पर चढ़ाई जाने वाली बलि के लिए स्थापित हिन्दी बाइबलीय पद।
- source_word: מִנְחָה
  choice: अन्नबलि
  rationale: इस बलिदानी संदर्भ में अन्न से चढ़ाई जाने वाली भेंट का स्पष्ट संकेत देता है।
- source_word: לָקַח מִיָּדֵנוּ
  choice: हमारे हाथ से ... स्वीकार करता
  rationale: ‘लेना’ यहाँ बलिदान को अनुग्रहपूर्वक ग्रहण करने के अर्थ में है; हिन्दी में ‘स्वीकार करना’ स्वाभाविक है।
- source_word: הִשְׁמִיעָנוּ
  choice: हमें ... सुनाता
  rationale: हिफ़ील रूप का मूल भाव ‘सुनवाना/सुनाना’ है; इससे दिव्य घोषणा का श्रव्य पक्ष सुरक्षित रहता है।
- source_word: כָזֹאת
  choice: ऐसी बात
  rationale: एकवचन संकेतवाचक अभिव्यक्ति को बनाए रखता है और पूर्ववर्ती घोषणा की ओर संकेत करता है।
theological_decisions:
- issue: यहोवा के इरादे के बारे में प्रतिकल्पित कथन
  choice: यदि यहोवा हमें मार डालना चाहता
  alternative: यदि यहोवा ने हमें मार डालने का निश्चय किया होता
  rationale: मूल חָפֵץ इच्छा/चाह को व्यक्त करता है; ‘निश्चय’ जोड़ने से आशय अधिक कठोर और निश्चित हो जाता।
- issue: बलि के ग्रहण किए जाने का अर्थ
  choice: स्वीकार न करता
  alternative: न लेता
  rationale: संदर्भ में पत्नी बलि की स्वीकृति को अनुग्रह का प्रमाण मानती है; फिर भी पाठ यह दावा उसके तर्क के रूप में ही प्रस्तुत करता है, कथावाचक की अलग धर्मवैज्ञानिक व्याख्या के रूप में नहीं।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। तीन समानांतर निषेधों—बलि स्वीकार करना, बातें दिखाना, और इस समय सुनाना—की मूल तर्क-रचना सुरक्षित है।
