  text: וְ/לֹא יָ֤סַף עוֹד֙ מַלְאַ֣ךְ יְהוָ֔ה לְ/הֵרָאֹ֖ה אֶל מָנ֣וֹחַ וְ/אֶל אִשְׁתּ֑/וֹ אָ֚ז יָדַ֣ע מָנ֔וֹחַ כִּֽי מַלְאַ֥ךְ יְהוָ֖ה הֽוּא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/021.yaml
  text: And the angel of Yahweh did not appear again to Manoah and to his wife[a]. Then Manoah knew that he was the angel of Yahweh.
translation:
  language: hi
  text: याहवे का स्वर्गदूत[a] फिर मानोह और उसकी पत्नी को दिखाई नहीं दिया। तब मानोह जान गया कि वह याहवे का स्वर्गदूत था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘याहवे का दूत।’ इब्रानी शब्द का अर्थ ‘दूत’ या ‘स्वर्गदूत’ हो सकता है; इस प्रसंग में यह एक अलौकिक हस्ती को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יָסַף עוֹד
  choice: फिर ... नहीं
  rationale: יָסַף के साथ עוֹד यहाँ आगे या दोबारा होने वाली क्रिया के रुक जाने को व्यक्त करता है; आधुनिक हिन्दी में ‘फिर ... नहीं’ स्वाभाविक और सटीक है।
- source_word: מַלְאַךְ יְהוָה
  choice: याहवे का स्वर्गदूत
  rationale: מַלְאַךְ का मूल अर्थ ‘दूत/संदेशवाहक’ हो सकता है, पर इस प्रसंग में अग्नि की ज्वाला में ऊपर जाने वाली अलौकिक हस्ती का उल्लेख है; इसलिए मुख्य पाठ में ‘स्वर्गदूत’ स्पष्ट और स्वाभाविक है, जबकि वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय परमेश्वर-नाम को उपाधि से बदलने के बजाय उसके प्रचलित हिन्दी लिप्यंतरण ‘याहवे’ से व्यक्त किया गया है।
- source_word: לְהֵרָאֹה
  choice: दिखाई दिया
  rationale: ראה के निफ़अल रूप का यहाँ अर्थ ‘प्रकट होना/दिखाई देना’ है; व्यक्ति के सामने आने के इस प्रसंग में ‘दिखाई दिया’ सहज हिन्दी है।
- source_word: אֶל מָנוֹחַ וְאֶל אִשְׁתּוֹ
  choice: मानोह और उसकी पत्नी को
  rationale: दोहराए गए אֶל को हिन्दी में एक ही ‘को’ से व्यक्त करना अर्थ को पूरा रखते हुए अनावश्यक कृत्रिमता से बचाता है।
- source_word: אָז יָדַע
  choice: तब मानोह जान गया
  rationale: אָז घटनाक्रम के बाद उत्पन्न पहचान को चिह्नित करता है और יָדַע यहाँ प्राप्त बोध को; ‘तब ... जान गया’ दोनों पहलुओं को स्वाभाविक ढंग से रखता है।
- source_word: כִּי מַלְאַךְ יְהוָה הוּא
  choice: कि वह याहवे का स्वर्गदूत था
  rationale: הוּא पहले दिखाई दी हुई व्यक्तिगत हस्ती की ओर संकेत करता है; ‘वह ... था’ इस संदर्भ को स्पष्ट रखते हुए पहचान-वाक्य की सीधी संरचना बनाए रखता है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में परमेश्वर का निजी वाचा-नाम सीधे आया है; ‘याहवे’ उसे किसी उपाधि से बदले बिना प्रस्तुत करता है।
- issue: מַלְאַךְ יְהוָה की पहचान
  choice: याहवे का स्वर्गदूत
  alternative: याहवे का दूत/संदेशवाहक
  rationale: आसपास का वर्णन इस हस्ती को अलौकिक दर्शाता है, इसलिए ‘स्वर्गदूत’ उपयुक्त है; फिर भी पद स्वयं उसकी प्रकृति या ईश्वरत्व की आगे व्याख्या नहीं करता, अतः पहचान-वाक्य को बिना अतिरिक्त धर्मवैज्ञानिक निष्कर्ष के रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए सहज रखी गई है। ‘मानोह’ पारंपरिक हिन्दी बाइबलीय नाम-रूप है। वाक्य-क्रम मूल के कथात्मक क्रम और दूसरे वाक्य में होने वाली पहचान को बनाए रखता है।
