source:
  edition: WLC
  text: וְ/עַתָּה֙ הִשָּׁ֣מְרִי נָ֔א וְ/אַל תִּשְׁתִּ֖י יַ֣יִן וְ/שֵׁכָ֑ר וְ/אַל תֹּאכְלִ֖י כָּל טָמֵֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/004.yaml
  text: Now please be careful[a], and do not drink wine or strong drink[c][b], and do not eat anything unclean.
translation:
  language: hi
  text: 'अब सावधान रहना: दाखमधु या कोई और मादक पेय न पीना, और कोई भी अशुद्ध वस्तु न खाना।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: इसलिए अब
  rationale: यह पद पिछले कथन के आधार पर आगे का निर्देश देता है। ‘अब’ काल/विमर्श-संकेत को और ‘इसलिए’ प्रसंगगत निष्कर्ष को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הִשָּׁמְרִי נָא
  choice: सावधान रहना
  rationale: निफ़अल रूप यहाँ स्त्री को स्वयं पर निगरानी रखने और सचेत रहने का निर्देश देता है। נָא आदेश को विनीत बनाता है; हिन्दी में संदर्भानुकूल अनौपचारिक निर्देश ‘रहना’ उस कोमल आग्रह को व्यक्त करता है, बिना अनावश्यक ‘कृपया’ जोड़े।
- source_word: וְאַל תִּשְׁתִּי
  choice: न तो ... पीना
  rationale: स्त्री को संबोधित निषेध है। आगे के समन्वित निषेध के साथ ‘न तो...न...और न...’ स्वाभाविक हिन्दी संरचना है।
- source_word: יַיִן
  choice: दाखमधु
  rationale: अंगूर से बने मद्य के लिए स्पष्ट, प्रतिष्ठित और सामान्य बाइबलीय हिन्दी शब्द।
- source_word: וְשֵׁכָר
  choice: कोई नशीला पेय
  rationale: यह दाखमधु के अतिरिक्त अन्य मादक पेयों की व्यापक श्रेणी है। ‘मदिरा’ कभी-कभी दाखमधु के समानार्थी समझी जा सकती है, जबकि ‘नशीला पेय’ भेद और व्यापकता दोनों स्पष्ट रखता है।
- source_word: וְאַל תֹּאכְלִי כָּל טָמֵא
  choice: और न कोई अशुद्ध वस्तु खाना
  rationale: כָּל के साथ विशेषण का संज्ञात्मक प्रयोग किसी भी अशुद्ध वस्तु, प्रसंगतः खाद्य वस्तु, को सूचित करता है। ‘अशुद्ध’ विधिक/अनुष्ठानिक श्रेणी को बनाए रखता है।
theological_decisions:
- issue: טָמֵא का स्वरूप
  choice: अशुद्ध
  alternative: अपवित्र
  rationale: यह प्रसंग तोराह की विधिक/अनुष्ठानिक शुद्धता की श्रेणी से जुड़ा है। ‘अशुद्ध’ इसे स्वच्छता या केवल नैतिक बुराई तक सीमित किए बिना सहज हिन्दी में सुरक्षित रखता है।
- issue: שֵׁכָר की सीमा
  choice: कोई नशीला पेय
  alternative: मदिरा
  rationale: शब्द दाखमधु से अलग अन्य मादक पेय को दर्शाता है। चुना हुआ अनुवाद किसी विशेष प्राचीन पेय तक अर्थ को संकीर्ण नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और मौखिक निर्देश की शैली। स्त्रीलिंग संबोधन मूल क्रियाओं में स्पष्ट है, पर हिन्दी के इस अनौपचारिक आज्ञार्थक रूप में लिंग-चिह्न स्वाभाविक रूप से व्यक्त नहीं होता।
