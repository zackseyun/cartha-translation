source:
  edition: WLC
  text: וַ/יִּקַּ֨ח מָנ֜וֹחַ אֶת גְּדִ֤י הָ/עִזִּים֙ וְ/אֶת הַ/מִּנְחָ֔ה וַ/יַּ֥עַל עַל הַ/צּ֖וּר לַֽ/יהוָ֑ה וּ/מַפְלִ֣א לַ/עֲשׂ֔וֹת וּ/מָנ֥וֹחַ וְ/אִשְׁתּ֖/וֹ רֹאִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/019.yaml
  text: So Manoah took the young goat and the grain offering[a], and offered them on the rock to Yahweh, and he did a wondrous thing while Manoah and his wife were watching.
translation:
  language: hi
  text: तब मनोह ने बकरी का बच्चा और अन्नबलि लेकर उन्हें याहवे के लिए चट्टान पर चढ़ाया। और उसने एक अद्भुत कार्य किया[a], जबकि मनोह और उसकी पत्नी देख रहे थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “याहवे के दूत ने एक अद्भुत कार्य किया।” इब्रानी वाक्य संक्षिप्त है और कर्ता को स्पष्ट रूप से दोबारा नहीं बताता, यद्यपि प्रसंग याहवे के दूत की ओर संकेत करता है।
    reason: alternative_reading
lexical_decisions:
- source_word: גְּדִי הָעִזִּים
  choice: बकरी का बच्चा
  rationale: यह आधुनिक हिन्दी में बकरी के छोटे बच्चे के लिए स्वाभाविक अभिव्यक्ति है और बलि के पशु का आशय स्पष्ट रखती है।
- source_word: הַמִּנְחָה
  choice: अन्नबलि
  rationale: बलिदान-संबंधी प्रसंग में מִנְחָה अन्न से जुड़ी भेंट को सूचित करता है; ‘अन्नबलि’ संक्षिप्त और प्रचलित बाइबिलीय हिन्दी है।
- source_word: וַיַּעַל עַל הַצּוּר לַיהוָה
  choice: उन्हें चट्टान पर याहवे को चढ़ाया
  rationale: बलिदान के प्रसंग में עלה का अर्थ चढ़ाना है। ‘उन्हें’ बकरी के बच्चे और अन्नबलि, दोनों को स्वाभाविक हिन्दी में समेटता है।
- source_word: לַיהוָה
  choice: याहवे को
  rationale: परमेश्वर के विशिष्ट इब्रानी नाम יהוה को लिप्यंतरित करके स्रोत-पाठ का नामात्मक भेद बनाए रखा गया है।
- source_word: וּמַפְלִא לַעֲשׂוֹת
  choice: और उसने एक अद्भुत काम किया
  rationale: यह פלא की अद्भुत कार्य करने की धारणा को स्वाभाविक हिन्दी में व्यक्त करता है और इब्रानी में निहित कर्ता को नाम देकर अत्यधिक स्पष्ट नहीं करता।
- source_word: רֹאִים
  choice: देख रहे थे
  rationale: कृदंत की जारी क्रिया को हिन्दी के अपूर्ण भूतकाल से व्यक्त किया गया है।
theological_decisions:
- issue: וּמַפְלִא לַעֲשׂוֹת का निहित कर्ता
  choice: मुख्य पाठ में ‘उसने’ रखा गया है, जो प्रसंग में याहवे के दूत की ओर संकेत करता है, पर उसका नाम स्पष्ट रूप से नहीं जोड़ा गया।
  alternative: ‘और याहवे के दूत ने एक अद्भुत काम किया’ अथवा ‘और एक अद्भुत घटना हुई।’
  rationale: इब्रानी वाक्य संक्षिप्त है और कर्ता को फिर से स्पष्ट नहीं करता। व्यापक प्रसंग दूत की ओर संकेत करता है, फिर भी मुख्य पाठ में केवल ‘उसने’ रखने से मूल की अस्पष्टता और कथानक का तनाव दोनों बचे रहते हैं।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘अन्नबलि’ और ‘चढ़ाया’ जैसे परिचित बलिदान-संबंधी शब्द प्रयुक्त हुए हैं। निहित कर्ता की वास्तविक अस्पष्टता को फुटनोट सहित सुरक्षित रखा गया है।
