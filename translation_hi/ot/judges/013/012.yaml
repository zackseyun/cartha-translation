  text: וַ/יֹּ֣אמֶר מָנ֔וֹחַ עַתָּ֖ה יָבֹ֣א דְבָרֶ֑י/ךָ מַה יִּֽהְיֶ֥ה מִשְׁפַּט הַ/נַּ֖עַר וּ/מַעֲשֵֽׂ/הוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/012.yaml
  text: Then Manoah said[a], “Now let your words come true[c][b]. What will be the rule for the boy and for his work?”
translation:
  language: hi
  text: तब मानोह ने कहा, “अब आपके वचन पूरे हों।[a] उस लड़के के लिए क्या नियम[b] होगा, और उसका काम[c] क्या होगा?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जब आपके वचन पूरे हों।” इब्रानी वाक्यांश को कामना (“आपके वचन पूरे हों”) या समय-सूचक मान्यता (“जब आपके वचन पूरे हों”)—दोनों रूपों में समझा जा सकता है।
    reason: alternative_reading
  - marker: b
    text: “लड़के के लिए नियम” का अनुवाद “लड़के के लिए रीति,” “विधान,” या “जीवन-पद्धति” भी किया जा सकता है।
    reason: lexical_alternative
  - marker: c
    text: या, “और उसे क्या करना होगा?” इब्रानी में शाब्दिक रूप से “और उसका काम” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने कहा
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में उसके क्रमिक बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: מָנוֹחַ
  choice: मानोह
  rationale: इब्रानी नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: עַתָּה
  choice: अब
  rationale: यह तत्काल प्रतिक्रिया और अपेक्षा को सूचित करता है।
- source_word: יָבֹא דְבָרֶיךָ
  choice: आपके वचन पूरे हों
  rationale: शाब्दिक भाव ‘आपके वचन आएँ/घटित हों’ है; हिन्दी में यह कामनासूचक अर्थ स्पष्ट और गरिमापूर्ण ढंग से व्यक्त करता है, जबकि कालवाचक सम्भावना पादटिप्पणी में रखी गई है।
- source_word: מַה יִּהְיֶה
  choice: क्या ... होगा
  rationale: भविष्य की व्यवस्था और कार्य के विषय में सीधे प्रश्न को व्यक्त करता है।
- source_word: מִשְׁפַּט
  choice: नियम
  rationale: यहाँ शब्द न्यायिक निर्णय से अधिक बालक पर लागू निर्धारित रीति या व्यवस्था को सूचित करता है; ‘नियम’ संक्षिप्त और सहज है।
- source_word: הַנַּעַר
  choice: उस लड़के
  rationale: अजन्मे पुरुष बालक की ओर संकेत करते हुए इब्रानी के लिंग-सूचक अर्थ को बनाए रखता है।
- source_word: וּמַעֲשֵׂהוּ
  choice: और उसका काम क्या होगा
  rationale: מַעֲשֶׂה के व्यापक अर्थ—काम, कार्य या गतिविधि—को सुरक्षित रखता है और हिन्दी में प्रश्न को स्वाभाविक बनाता है।
theological_decisions:
- issue: יָבֹא דְבָרֶיךָ का कामनासूचक या कालवाचक अर्थ
  choice: 'कामनासूचक: ‘आपके वचन पूरे हों’'
  alternative: 'कालवाचक: ‘जब आपके वचन पूरे हों’'
  rationale: क्रिया-रूप को कामना के रूप में पढ़ना सम्भव और प्रसंगानुकूल है, पर कालवाचक समझ भी वास्तविक भाषिक सम्भावना है; इसलिए उसे पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; आदर-सूचक ‘आपके’ स्वर्गदूत से मानोह के संबोधन के लिए स्वाभाविक है। वाक्य गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखा गया है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
