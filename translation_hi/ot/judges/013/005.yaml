reference: Judges 13:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּי֩ הִנָּ֨/ךְ הָרָ֜ה וְ/יֹלַ֣דְתְּ בֵּ֗ן וּ/מוֹרָה֙ לֹא יַעֲלֶ֣ה עַל רֹאשׁ֔/וֹ כִּֽי נְזִ֧יר אֱלֹהִ֛ים יִהְיֶ֥ה הַ/נַּ֖עַר מִן הַ/בָּ֑טֶן וְ/ה֗וּא יָחֵ֛ל לְ/הוֹשִׁ֥יעַ אֶת יִשְׂרָאֵ֖ל מִ/יַּ֥ד פְּלִשְׁתִּֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/005.yaml
  text: For behold[a], you are pregnant and will bear a son. No razor shall come upon his head, for the boy shall be a Nazirite of God from the womb, and he will begin to save Israel from the hand of the Philistines.
translation:
  language: hi
  text: क्योंकि देखो, तुम गर्भवती हो और एक पुत्र को जन्म दोगी। उसके सिर पर उस्तरा नहीं चलेगा, क्योंकि वह लड़का गर्भ ही से परमेश्वर का नाज़ीर[a] होगा; और वह इस्राएल को पलिश्तियों के हाथ से बचाना[b] आरम्भ करेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘नाज़ीर’ वह व्यक्ति था जो विशेष रूप से परमेश्वर के लिए अलग किया गया हो।
    reason: तकनीकी इब्रानी पद को समझाने के लिए।
  - marker: b
    text: या ‘छुड़ाना’। इब्रानी क्रिया का अर्थ प्रसंग के अनुसार ‘बचाना’ या ‘छुड़ाना’ हो सकता है।
    reason: मूल क्रिया के वास्तविक शाब्दिक विकल्प को सुरक्षित रखने के लिए।
lexical_decisions:
- source_word: הִנָּךְ
  choice: देख
  rationale: यह ध्यान खींचने वाली उद्घोषणात्मक अभिव्यक्ति है। ‘देख’ उसके बल को बनाए रखते हुए स्वाभाविक हिन्दी है।
- source_word: הָרָה
  choice: गर्भवती है
  rationale: यह भविष्य की क्रिया नहीं, वर्तमान अवस्था बताने वाला विधेय विशेषण है; इसलिए स्त्री को अभी गर्भवती बताया गया है।
- source_word: וְיֹלַדְתְּ בֵּן
  choice: एक पुत्र को जन्म देगी
  rationale: संदर्भ में यह आगामी जन्म बताता है और आधुनिक हिन्दी में स्पष्ट तथा स्वाभाविक है।
- source_word: מוֹרָה לֹא יַעֲלֶה עַל רֹאשׁוֹ
  choice: उसके सिर पर उस्तरा नहीं फिरेगा
  rationale: नाज़ीर-संदर्भ में מוֹרָה उस्तरे को सूचित करता है। हिन्दी मुहावरा निषेध और मूल सिर-सम्बन्धी चित्र दोनों बनाए रखता है।
- source_word: נְזִיר אֱלֹהִים
  choice: परमेश्वर का नाज़ीर
  rationale: तकनीकी पद ‘नाज़ीर’ को बनाए रखने से विशेष समर्पण की संस्था सामान्य ‘समर्पित व्यक्ति’ में नहीं घुलती।
- source_word: מִן הַבָּטֶן
  choice: गर्भ ही से
  rationale: यह मूल के स्पष्ट गर्भ-संबंधी बल को सुरक्षित रखता है और केवल ‘जन्म से’ कहने की अपेक्षा अधिक सटीक है।
- source_word: יָחֵל
  choice: आरम्भ करेगा
  rationale: क्रिया स्पष्ट रूप से आरम्भ करने का अर्थ देती है; इससे यह नहीं कहा जाता कि वह छुटकारे का कार्य पूरा कर देगा।
- source_word: לְהוֹשִׁיעַ
  choice: बचाना
  rationale: संदर्भ में इसका अर्थ बचाना या छुड़ाना दोनों हो सकता है; मुख्य पाठ में सरल और व्यापक ‘बचाना’ चुना गया है।
- source_word: מִיַּד פְּלִשְׁתִּים
  choice: पलिश्तियों के हाथ से
  rationale: यह मूल के ‘हाथ’ वाले रूपक को सुरक्षित रखता है, जहाँ हाथ सत्ता अथवा नियंत्रण को दर्शाता है।
theological_decisions:
- issue: शिमशोन के समर्पण का स्वरूप
  choice: गर्भ ही से परमेश्वर का नाज़ीर
  alternative: जन्म से परमेश्वर को समर्पित व्यक्ति
  rationale: इब्रानी में तकनीकी शब्द נְזִיר आया है और ‘गर्भ’ का स्पष्ट उल्लेख है। मुख्य पाठ दोनों को बनाए रखता है, बिना बाद की किसी विशिष्ट धर्मवैज्ञानिक धारणा को जोड़ने के।
- issue: इस्राएल को बचाने में शिमशोन की भूमिका की सीमा
  choice: बचाना आरम्भ करेगा
  alternative: बचाएगा
  rationale: יָחֵל आरम्भ को स्पष्ट करता है। इसे हटाने पर पाठ शिमशोन की भूमिका को पूर्ण उद्धार के रूप में बढ़ा-चढ़ाकर प्रस्तुत करेगा और कथात्मक तनाव मिट जाएगा।
- issue: לְהוֹשִׁיעַ का अर्थ-क्षेत्र
  choice: बचाना
  alternative: छुड़ाना
  rationale: दोनों अर्थ प्रसंगानुकूल हैं। मुख्य पाठ में सामान्य ‘बचाना’ रखा गया है और वास्तविक वैकल्पिक अर्थ को पादटिप्पणी में सुरक्षित किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और कथात्मक शैली रखी गई है। स्त्री से प्रत्यक्ष संबोधन के कारण ‘तू’ मूल के एकवचन निकट संबोधन को व्यक्त करता है। ‘नाज़ीर’ तकनीकी पद के रूप में रखा गया है और पादटिप्पणी में समझाया गया है।
