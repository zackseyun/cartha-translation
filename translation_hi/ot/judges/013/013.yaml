  edition: WLC
  text: וַ/יֹּ֛אמֶר מַלְאַ֥ךְ יְהוָ֖ה אֶל מָנ֑וֹחַ מִ/כֹּ֛ל אֲשֶׁר אָמַ֥רְתִּי אֶל הָ/אִשָּׁ֖ה תִּשָּׁמֵֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/013.yaml
  text: And the angel of Yahweh said to Manoah[a], “The woman must be careful to do everything that I said to her.”
translation:
  language: hi
  text: तब यहोवा के दूत[a] ने मानोह से कहा, “जो कुछ मैंने उस स्त्री से कहा है, उससे वह सावधान रहे।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “यहोवा के संदेशवाहक।” इब्रानी शब्द का अर्थ “दूत” या “संदेशवाहक,” दोनों हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने कहा
  rationale: वाव-क्रमिक कथा को स्वाभाविक आधुनिक हिन्दी में अगले कथन के रूप में प्रस्तुत करता है।
- source_word: מַלְאַךְ יְהוָה
  choice: यहोवा के दूत
  rationale: מַלְאַךְ का मूल अर्थ ‘दूत’ है और इस प्रसंग में स्वर्गीय दूत अभिप्रेत है; ‘दूत’ हिन्दी में अर्थ की दूत/स्वर्गदूत संबंधी व्यापकता बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चतुर्वर्णी दिव्य नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित नाम-रूप ‘यहोवा’ से व्यक्त किया गया है।
- source_word: אֶל מָנוֹחַ
  choice: मानोह से
  rationale: ‘कहा’ के साथ हिन्दी का स्वाभाविक संप्रदान-प्रयोग है और व्यक्तिनाम का निकट लिप्यंतरण रखता है।
- source_word: מִכֹּל אֲשֶׁר אָמַרְתִּי אֶל הָאִשָּׁה
  choice: जो कुछ मैंने उस स्त्री से कहा है, उन सब बातों का
  rationale: מִכֹּל की व्यापकता और मूल पाठ के स्पष्ट ‘उस स्त्री से’ को सुरक्षित रखते हुए हिन्दी में स्वाभाविक संरचना देता है।
- source_word: תִּשָּׁמֵר
  choice: वह ध्यान रखे
  rationale: שׁמר के निफ़अल रूप में सावधानी बरतने और दिए निर्देशों का पालन करने की भावना है; यह अनावश्यक रूप से ‘करने’ जैसी अनुपस्थित क्रिया जोड़े बिना आशय व्यक्त करता है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु / याहवे
  rationale: मूल में निजी दिव्य नाम है। हिन्दी पाठकों के लिए परिचित लिप्यंतरण ‘यहोवा’ नाम को उपाधि से प्रतिस्थापित नहीं करता।
- issue: מַלְאַךְ יְהוָה की पहचानगत व्यापकता
  choice: यहोवा के दूत
  alternative: यहोवा के स्वर्गदूत
  rationale: ‘दूत’ मूल शब्द की ‘संदेशवाहक/स्वर्गीय दूत’ संबंधी अर्थ-व्यापकता को बनाए रखता है और उसकी पहचान को पाठ से अधिक निश्चित नहीं करता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज मानक हिन्दी। ‘उस स्त्री’ मूल के הָאִשָּׁה को बनाए रखता है; ‘तुम्हारी पत्नी’ जैसी संदर्भगत व्याख्या नहीं जोड़ी गई।
