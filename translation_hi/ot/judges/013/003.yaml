  text: וַ/יֵּרָ֥א מַלְאַךְ יְהוָ֖ה אֶל הָ/אִשָּׁ֑ה וַ/יֹּ֣אמֶר אֵלֶ֗י/הָ הִנֵּה נָ֤א אַתְּ עֲקָרָה֙ וְ/לֹ֣א יָלַ֔דְתְּ וְ/הָרִ֖ית וְ/יָלַ֥דְתְּ בֵּֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/003.yaml
  text: And the angel of the LORD appeared to the woman and said to her, “Look, please—you are barren and have not borne children, but you will conceive and bear a son.”
translation:
  language: hi
  text: तब यहोवा का दूत उस स्त्री को दिखाई दिया और उससे कहा, “देख, तू बाँझ है और तूने किसी बच्चे को जन्म नहीं दिया है, पर तू गर्भवती होगी और एक पुत्र को जन्म देगी।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: यहोवा का दूत
  rationale: מַלְאַךְ का स्वाभाविक अर्थ ‘दूत’ है; יהוה को उसके व्यक्तिगत नाम ‘यहोवा’ से व्यक्त किया गया है।
- source_word: הִנֵּה נָא
  choice: देख
  rationale: הִנֵּה ध्यान खींचता है और נָא कथन को विनम्र या आग्रहपूर्ण रंग दे सकता है; इस प्रसंग में स्वाभाविक हिन्दी ‘देख’ दोनों के संयुक्त संवादात्मक प्रभाव को संक्षेप में व्यक्त करती है।
- source_word: עֲקָרָה
  choice: बाँझ
  rationale: यह स्त्री की संतान उत्पन्न न कर पाने की अवस्था के लिए सीधा और प्रचलित हिन्दी शब्द है।
- source_word: וְהָרִית וְיָלַדְתְּ בֵּן
  choice: पर तू गर्भवती होगी और एक पुत्र को जन्म देगी
  rationale: समन्वयक וְ यहाँ पूर्व स्थिति के विपरीत भाव देता है; दोनों क्रियाओं और ‘पुत्र’ को स्पष्ट रूप से बनाए रखा गया है।
theological_decisions:
- issue: מַלְאַךְ יְהוָה की पहचान
  choice: यहोवा का दूत
  alternative: यहोवा स्वयं / प्रभु का स्वर्गदूत
  rationale: पद दूत और यहोवा के बीच संबंध बताता है, पर उनकी पहचान को यहाँ स्पष्टतः परिभाषित नहीं करता; इसलिए स्रोत की धार्मिक अस्पष्टता सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी। प्राचीन प्रसंग तथा एकवचन स्त्रीलिंग संबोधन के अनुरूप ‘तू’ रखा गया है; वाक्य को अनावश्यक व्याख्या से मुक्त रखा गया है।
