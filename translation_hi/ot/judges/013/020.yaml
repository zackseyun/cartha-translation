source:
  edition: WLC
  text: וַ/יְהִי֩ בַ/עֲל֨וֹת הַ/לַּ֜הַב מֵ/עַ֤ל הַ/מִּזְבֵּ֨חַ֙ הַ/שָּׁמַ֔יְמָ/ה וַ/יַּ֥עַל מַלְאַךְ יְהוָ֖ה בְּ/לַ֣הַב הַ/מִּזְבֵּ֑חַ וּ/מָנ֤וֹחַ וְ/אִשְׁתּ/וֹ֙ רֹאִ֔ים וַ/יִּפְּל֥וּ עַל פְּנֵי/הֶ֖ם אָֽרְצָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/020.yaml
  text: And when the flame went up from the altar toward heaven[a], the angel of Yahweh went up in the flame of the altar, while Manoah and his wife were watching[b]; and they fell on their faces to the ground.
translation:
  language: hi
  text: जब वेदी पर से ज्वाला स्वर्ग की ओर उठ रही थी, तब यहोवा का दूत[a] वेदी की ज्वाला में ऊपर चढ़ गया। मनोह और उसकी पत्नी यह देख रहे थे, और वे मुँह के बल भूमि पर गिर पड़े।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘यहोवा का स्वर्गदूत।’ इब्रानी शब्द का अर्थ ‘दूत’ या ‘स्वर्गदूत’ दोनों हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַּעֲלוֹת
  choice: जब ... उठी, तब
  rationale: यह रचना समय-सूचक आश्रित वाक्य प्रस्तुत करती है; ‘जब ... तब’ हिन्दी में स्वाभाविक रूप से घटनाओं का क्रम बनाए रखता है।
- source_word: הַלַּהַב
  choice: ज्वाला
  rationale: לַהַב के ठोस अर्थ ‘ज्वाला/लपट’ को dignified और सहज हिन्दी में व्यक्त करता है।
- source_word: מֵעַל הַמִּזְבֵּחַ הַשָּׁמַיְמָה
  choice: वेदी पर से ... आकाश की ओर
  rationale: מֵעַל का ‘ऊपर से/पर से’ और दिशासूचक ה־ का ऊपर की दिशा वाला भाव दोनों सुरक्षित रहते हैं।
- source_word: מַלְאַךְ יְהוָה
  choice: यहोवा का दूत
  rationale: מַלְאָךְ का मूल अर्थ ‘दूत/संदेशवाहक’ है; प्रसंग में अलौकिक व्यक्ति स्पष्ट है, पर ‘दूत’ शब्द उसकी सटीक तात्त्विक पहचान को अनुवाद में तय नहीं करता।
- source_word: בְּלַהַב הַמִּזְבֵּחַ
  choice: वेदी की ज्वाला में
  rationale: בְּ को स्थानवाचक रूप में रखकर मूल का सजीव दृश्य और उसकी संभावित सूक्ष्मता सुरक्षित की गई है।
- source_word: וּמָנוֹחַ וְאִשְׁתּוֹ רֹאִים
  choice: मनोह और उसकी पत्नी यह देख रहे थे
  rationale: बहुवचन कृदंत की जारी और समकालिक क्रिया को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: וַיִּפְּלוּ עַל־פְּנֵיהֶם אָרְצָה
  choice: वे मुँह के बल भूमि पर गिर पड़े
  rationale: इब्रानी मुहावरे की शारीरिक मुद्रा और भूमि की ओर गति को स्पष्ट, स्वाभाविक हिन्दी में बनाए रखता है।
theological_decisions:
- issue: מַלְאַךְ יְהוָה की पहचान
  choice: ‘यहोवा का दूत’ लिखकर पात्र को पाठ के अपने पदनाम से प्रस्तुत किया गया है।
  alternative: ‘यहोवा का स्वर्गदूत’; अथवा इसे किसी विशिष्ट ईश-प्रकटन के रूप में व्याख्यायित करना।
  rationale: मूल पद ‘दूत/स्वर्गदूत’ दोनों अर्थ दे सकता है, किंतु स्वयं इस पद में उस पात्र की पूर्ण तात्त्विक पहचान निश्चित नहीं की गई; इसलिए मुख्य पाठ उसे अनावश्यक रूप से नहीं सुलझाता।
- issue: दिव्य नाम יְהוָה का रूप
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: ‘यहोवा’ हिन्दी बाइबलीय परंपरा में पहचाना जाने वाला व्यक्तिगत नाम है और मूल में उपस्थित दिव्य नाम को सामान्य उपाधि में नहीं बदलता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल किंतु गरिमापूर्ण कथात्मक शैली रखी गई है। ‘मुँह के बल भूमि पर गिर पड़े’ मूल मुद्रा को स्वाभाविक हिन्दी में स्पष्ट करता है।
