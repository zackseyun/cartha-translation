base_translation:
  language: en
  yaml_path: translation/ot/judges/013/001.yaml
  text: And the sons of Israel again did what was evil in the eyes of Yahweh[b][a], and Yahweh gave them into the hand of the Philistines for forty years.
translation:
  language: hi
  text: इस्राएलियों[a] ने फिर यहोवा की दृष्टि में बुरा किया। इसलिए यहोवा ने उन्हें चालीस वर्ष तक पलिश्तियों के हाथ में दे दिया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, ‘इस्राएल के पुत्र’; यहाँ यह इस्राएल की पूरी प्रजा का सामूहिक नाम है।
    reason: lexical_alternative
  - marker: b
    text: ‘पलिश्तियों के हाथ में’ एक मुहावरा है, जिसका अर्थ उनके अधिकार या नियंत्रण में है।
    reason: idiom_explanation
lexical_decisions:
- source_word: וַיֹּסִפוּ
  choice: फिर ... किया
  rationale: יסף के साथ क्रियार्थक रूप यहाँ पिछले बुरे आचरण की पुनरावृत्ति बताता है; न्यायियों के आवर्ती सूत्र में ‘फिर’ स्वाभाविक और स्पष्ट है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएलियों
  rationale: शाब्दिक अर्थ ‘इस्राएल के पुत्र’ है, पर यहाँ यह पूरी जाति के लिए सामूहिक पद है। आधुनिक हिन्दी में ‘इस्राएली’ उसी सामूहिक अर्थ को सहज रूप से व्यक्त करता है।
- source_word: לַעֲשׂוֹת הָרַע
  choice: वही किया जो ... बुरा था
  rationale: यह न्यायियों में प्रयुक्त मानक वाक्य-विन्यास है। ‘वही किया जो ... बुरा था’ हिन्दी में मूल्यांकनात्मक अर्थ को स्वाभाविक ढंग से बनाए रखता है।
- source_word: בְּעֵינֵי יְהוָה
  choice: यहोवा की दृष्टि में
  rationale: ‘आँखों में’ हिब्रू रूपक का शाब्दिक रूप होता, पर ‘दृष्टि में’ आधुनिक हिन्दी का प्रचलित और गरिमापूर्ण मुहावरा है तथा यहोवा के मूल्यांकन का भाव सुरक्षित रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी बाइबल परंपरा में इस दिव्य व्यक्तिगत नाम का स्थापित रूप ‘यहोवा’ है; इसे ‘प्रभु’ जैसे पद से प्रतिस्थापित नहीं किया गया।
- source_word: וַיִּתְּנֵם
  choice: उन्हें ... कर दिया
  rationale: נתן के साथ ‘हाथ में’ का प्रयोग किसी को दूसरे के अधिकार में सौंपने का भाव देता है। मुख्य पाठ में हिब्रू बिंब को रखते हुए सहज हिन्दी वाक्य बनाया गया है।
- source_word: בְּיַד פְּלִשְׁתִּים
  choice: पलिश्तियों के हाथ में
  rationale: ‘हाथ में’ मूल हिब्रू का सत्ता अथवा नियंत्रण सूचक मुहावरा है और हिन्दी में भी समझ में आता है।
- source_word: פְּלִשְׁתִּים
  choice: पलिश्ती
  rationale: यह इस प्राचीन जनसमूह के नाम का हिन्दी में प्रचलित रूप है।
- source_word: אַרְבָּעִים שָׁנָה
  choice: चालीस वर्ष तक
  rationale: ‘तक’ अवधि को स्पष्ट करता है और हिन्दी में स्वाभाविक है।
theological_decisions:
- issue: वाचा के नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में परमेश्वर का व्यक्तिगत नाम है। हिन्दी पाठकों के लिए स्थापित देवनागरी रूप ‘यहोवा’ चुना गया है; इसे ‘प्रभु’ उपाधि से नहीं बदला गया।
- issue: בְּנֵי יִשְׂרָאֵל का सामूहिक आशय
  choice: इस्राएली
  alternative: इस्राएल के पुत्र
  rationale: यह पद केवल पुरुष वंशजों को अलग से निर्दिष्ट नहीं करता, बल्कि इस्राएल की पूरी प्रजा का सामूहिक नाम है। ‘इस्राएली’ उस आशय को आधुनिक हिन्दी में बिना अनावश्यक लैंगिक संकुचन के व्यक्त करता है।
- issue: यहोवा द्वारा शत्रु के हाथ में दिया जाना
  choice: यहोवा ने उन्हें ... हाथ में कर दिया
  alternative: यहोवा ने उन्हें ... के अधिकार में सौंप दिया
  rationale: पाठ इस घटना को यहोवा की न्यायिक क्रिया के रूप में प्रस्तुत करता है। ‘हाथ में’ मूल की ठोस छवि और उसके सत्ता-संबंधी अर्थ दोनों को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण कथात्मक शैली। ‘इस्राएली’, ‘यहोवा’ और ‘पलिश्ती’ जैसे परिचित बाइबिलीय रूप रखे गए हैं। हिब्रू के ‘हाथ में’ मुहावरे को मुख्य पाठ में सुरक्षित रखकर पादटिप्पणी में उसका अर्थ स्पष्ट किया गया है।
