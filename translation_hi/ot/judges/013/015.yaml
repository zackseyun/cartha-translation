  text: Then Manoah said to the angel of the LORD, “Please let us detain you, and we will prepare a young goat for you.”
translation:
  language: hi
  text: तब मानोह ने यहोवा के दूत से कहा, “कृपया थोड़ी देर ठहरिए, और हम आपके लिए बकरी का एक बच्चा तैयार करें।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: यहोवा का दूत
  rationale: מַלְאַךְ का सामान्य अर्थ ‘दूत’ है; יהוה को उसके व्यक्तिगत नाम ‘यहोवा’ के रूप में रखा गया है।
- source_word: נַעְצְרָה נָּא אוֹתָךְ
  choice: कृपया हम आपको थोड़ी देर रोक लें
  rationale: ' cohortative रूप विनम्र आग्रह व्यक्त करता है। ‘थोड़ी देर’ हिन्दी में रोकने के आशय को स्वाभाविक बनाता है, बिना बलपूर्वक हिरासत का भाव दिए।'
- source_word: גְּדִי עִזִּים
  choice: बकरी का एक बच्चा
  rationale: यह पदबंध विशेष रूप से बकरी के बच्चे को दर्शाता है; आधुनिक हिन्दी में यही स्पष्ट और सहज अभिव्यक्ति है।
- source_word: לְפָנֶיךָ
  choice: आपके लिए
  rationale: शाब्दिक ‘आपके सामने’ यहाँ भोजन तैयार करके अतिथि को परोसने के आशय में है; हिन्दी में ‘आपके लिए’ अधिक स्वाभाविक है।
theological_decisions:
- issue: יהוה के नाम का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत नाम יהוה है; ‘यहोवा’ हिन्दी बाइबलीय परंपरा में परिचित है और नाम तथा उपाधि के बीच भेद बनाए रखता है।
- issue: दूत की पहचान
  choice: यहोवा का दूत
  alternative: यहोवा का स्वर्गदूत
  rationale: मूल מַלְאַךְ केवल ‘दूत’ कहता है। ‘स्वर्गदूत’ जोड़ने से पहचान को मूल की अपेक्षा अधिक निश्चित किया जाता, इसलिए अस्पष्टता सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक, सम्मानपूर्ण और सहज मानक हिन्दी। मानोह द्वारा दूत को रोककर आतिथ्य देने का विनम्र भाव रखा गया है; संबोधन में आदरसूचक ‘आप’ प्रयुक्त है।
