base_translation:
  language: en
  yaml_path: translation/ot/judges/013/008.yaml
  text: Then Manoah entreated Yahweh and said[a], “Please, Lord[c][b], let the man of God whom you sent come again to us and teach us what we should do for the boy who is to be born.”
translation:
  language: hi
  text: तब मानोह ने यहोवा से विनती की[a] और कहा, “हे प्रभु, कृपा करके परमेश्वर का वह जन[b], जिसे तूने भेजा था, फिर हमारे पास आए और हमें सिखाए कि जो लड़का जन्म लेने वाला है[c], उसके लिए हमें क्या करना चाहिए।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मन लगाकर प्रार्थना की” अथवा “गिड़गिड़ाकर विनती की”; इब्रानी क्रिया गंभीर याचना का भाव रखती है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से “परमेश्वर का जन”; मानोह यहाँ अपनी उस समय की समझ के अनुसार बोलता है और आगंतुक की पहचान इससे अधिक स्पष्ट नहीं करता।
    reason: alternative_reading
  - marker: c
    text: या “जो बालक जन्म लेने वाला है।” इब्रानी शब्द पुल्लिंग है और लड़के को सूचित करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּעְתַּר
  choice: विनती की
  rationale: यह क्रिया परमेश्वर से की गई गंभीर और प्रार्थनापूर्ण याचना व्यक्त करती है; ‘विनती की’ आधुनिक हिन्दी में स्वाभाविक रहते हुए उसकी तीव्रता बनाए रखती है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ के व्यक्तिवाचक दिव्य नाम को उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण द्वारा प्रस्तुत किया गया है।
- source_word: בִּי אֲדֹנָי
  choice: हे प्रभु, कृपा करके
  rationale: בִּי विनम्र आग्रह का सूचक है और אֲדֹנָי आदरपूर्ण संबोधन; यह रूप दोनों तत्वों को सहज हिन्दी में रखता है।
- source_word: אִישׁ הָאֱלֹהִים
  choice: परमेश्वर का वह जन
  rationale: ‘परमेश्वर का जन’ स्थापित हिन्दी बाइबलीय अभिव्यक्ति है; ‘वह’ उस पहले आए व्यक्ति की ओर संकेत स्पष्ट करता है और उसे समय से पहले स्वर्गदूत नहीं ठहराता।
- source_word: יָבוֹא נָא עוֹד אֵלֵינוּ
  choice: फिर हमारे पास आए
  rationale: आज्ञार्थक/कामनार्थक रूप और נָא की विनम्रता को निकटवर्ती ‘कृपा करके’ व्यक्त करता है, जबकि עוֹד का अर्थ ‘फिर’ से आता है।
- source_word: וְיוֹרֵנוּ
  choice: और हमें सिखाए
  rationale: हिफ़ील रूप यहाँ निर्देश देने या सिखाने का अर्थ रखता है; ‘सिखाए’ स्पष्ट और वर्तमान हिन्दी है।
- source_word: מַה נַּעֲשֶׂה
  choice: हमें क्या करना चाहिए
  rationale: यह भावी बच्चे के संबंध में व्यावहारिक मार्गदर्शन माँगने वाला विचारार्थक प्रश्न है।
- source_word: לַנַּעַר הַיּוּלָּד
  choice: जो लड़का जन्म लेनेवाला है, उसके लिए
  rationale: נַעַר की पुल्लिंग विशिष्टता ‘लड़का’ से सुरक्षित रहती है और passive participle का भाव ‘जन्म लेनेवाला है’ से स्वाभाविक रूप में आता है।
theological_decisions:
- issue: יְהוָה दिव्य नाम का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: यहाँ मूल में चतुरक्षरीय व्यक्तिवाचक नाम है; हिन्दी पाठकों में पहचाने जाने वाले ‘यहोवा’ से नाम और ‘प्रभु’ उपाधि के बीच भेद बना रहता है।
- issue: אִישׁ הָאֱלֹהִים की पहचान
  choice: परमेश्वर का वह जन
  alternative: परमेश्वर का दूत
  rationale: मानोह के वर्तमान कथन और कथा की पहचान-संबंधी तनाव को सुरक्षित रखने के लिए शाब्दिक अभिव्यक्ति रखी गई है; आगंतुक की पहचान को यहाँ पहले से निर्णीत नहीं किया गया।
- issue: לַנַּעַר में लिंग
  choice: लड़का
  alternative: बालक / बच्चा
  rationale: इब्रानी संज्ञा पुल्लिंग है और संदर्भ में प्रतिज्ञात पुत्र की बात है, इसलिए लिंग-विशिष्ट अर्थ सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में आदरपूर्ण, प्रार्थनात्मक शैली रखी गई है। परमेश्वर को संबोधित करते समय ‘तू’ मूल के एकवचन निकट संबोधन को दर्शाता है और पारंपरिक हिन्दी बाइबलीय गरिमा बनाए रखता है। ‘जन्म लेनेवाला’ को संयुक्त रूप में लिखा गया है।
