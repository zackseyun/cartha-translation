source:
  edition: WLC
  text: וַ/תָּ֨חֶל֙ ר֣וּחַ יְהוָ֔ה לְ/פַעֲמ֖/וֹ בְּ/מַחֲנֵה דָ֑ן בֵּ֥ין צָרְעָ֖ה וּ/בֵ֥ין אֶשְׁתָּאֹֽל־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/025.yaml
  text: And the Spirit of Yahweh began to stir him in Mahaneh-dan[b][a], between Zorah and Eshtaol.
translation:
  language: hi
  text: और याहवे का आत्मा उसे महने-दान[a] में, सोरा और एश्ताओल के बीच, प्रेरित करने लगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘महने-दान’ का अर्थ ‘दान का पड़ाव’ है; यहाँ यह एक स्थान का नाम है।
    reason: cultural_note
  - marker: b
    text: या, “उसे उद्वेलित करने लगा” अथवा “उसे गतिशील करने लगा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּחֶל
  choice: लगा
  rationale: यहाँ हिफ़ील रूप क्रिया के आरम्भ को व्यक्त करता है; संयुक्त अभिव्यक्ति ‘प्रेरित करने लगा’ हिन्दी में स्वाभाविक रूप से वही आरम्भिक भाव देती है।
- source_word: רוּחַ יְהוָה
  choice: यहवे का आत्मा
  rationale: न्यायियों के प्रसंग में यह पदबंध परमेश्वर की सामर्थ्य देने वाली सक्रिय उपस्थिति को सूचित करता है; ‘आत्मा’ इस अर्थ के अनुकूल है।
- source_word: יְהוָה
  choice: यहवे
  rationale: इब्रानी चार-अक्षरीय निज नाम को उपाधि से बदलने के बजाय आधुनिक हिन्दी में निकट लिप्यंतरण द्वारा प्रस्तुत किया गया है।
- source_word: לְפַעֲמוֹ
  choice: उसे प्रेरित करने
  rationale: פעם यहाँ किसी को उकसाने, चलाने या सक्रिय करने का भाव रखता है। ‘प्रेरित करने’ दैवी प्रवर्तन का भाव देता है, पर उसकी ठीक प्रकृति को अत्यधिक निर्धारित नहीं करता।
- source_word: בְּמַחֲנֵה דָן
  choice: महने-दान में
  rationale: यहाँ पदबंध स्थान-नाम के रूप में प्रयुक्त है, इसलिए उसका लिप्यंतरण किया गया है; उसके शाब्दिक अर्थ को टिप्पणी में रखा गया है।
- source_word: בֵּין צָרְעָה וּבֵין אֶשְׁתָּאֹל
  choice: सोरा और एश्ताओल के बीच
  rationale: भौगोलिक संबंध को सीधे और स्थान-नामों को हिन्दी लिप्यंतरण में प्रस्तुत किया गया है।
theological_decisions:
- issue: इस प्रसंग में רוּחַ יְהוָה का स्वरूप
  choice: यहवे का आत्मा—सामर्थ्य देने वाली दैवी सक्रिय उपस्थिति
  alternative: यहवे की हवा अथवा श्वास
  rationale: शिमशोन-वृत्तांत में यह पदबंध उसे कार्य के लिए सक्रिय और समर्थ करने वाली यहवे की उपस्थिति को दर्शाता है, न कि सामान्य हवा को; बाद की व्यवस्थित धर्मशास्त्रीय व्याख्या इसमें नहीं जोड़ी गई।
- issue: יְהוָה का अनुवाद
  choice: यहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में परमेश्वर का निज नाम है। ‘यहवे’ उसे उपाधि में बदलने के बजाय नाम के रूप में सुरक्षित रखता है।
translation_notes:
  register: आधुनिक, सरल और गरिमापूर्ण मानक हिन्दी। वाक्यक्रम हिन्दी की स्वाभाविकता के अनुसार रखा गया है। दोनों पादटिप्पणी-चिह्न मुख्य पाठ में संबद्ध शब्दों के तुरंत बाद दिए गए हैं।
