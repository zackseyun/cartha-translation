base_translation:
  language: en
  yaml_path: translation/ot/judges/013/011.yaml
  text: So Manoah arose and went after his wife[a], and came to the man and said to him, “Are you the man who spoke to the woman?” And he said[c][b], “I am.”
translation:
  language: hi
  text: तब मानोह उठा और अपनी पत्नी के पीछे[a] गया। वह उस आदमी के पास पहुँचा और उससे कहा, “क्या तुम वह आदमी हो जिसने उस स्त्री[b] से बात की थी?” उसने कहा, “मैं हूँ।”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: “अपनी पत्नी के पीछे।” अनुवाद “अपनी पत्नी का अनुसरण करते हुए” भी संभव है।'
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में “उस स्त्री” है, “मेरी पत्नी” नहीं।
    reason: lexical_alternative
  - marker: c
    text: इब्रानी में उत्तर केवल “मैं” है; इसका अनुवाद “मैं वही हूँ” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: उठा
  rationale: קום का सामान्य कथात्मक अर्थ ‘उठना’ है; यह स्वाभाविक आधुनिक हिन्दी में क्रिया की शुरुआत व्यक्त करता है।
- source_word: וַיֵּלֶךְ
  choice: गया
  rationale: הלך यहाँ सामान्य गति-सूचक क्रिया है; ‘चल पड़ा’ की अपेक्षा ‘गया’ स्रोत के समान अनिर्दिष्ट है।
- source_word: אַחֲרֵי אִשְׁתּוֹ
  choice: अपनी पत्नी के पीछे-पीछे
  rationale: אַחֲרֵי का मूल स्थानिक अर्थ ‘पीछे’ है। ‘पीछे-पीछे’ आधुनिक हिन्दी में पत्नी का अनुसरण करने का भाव सहजता से देता है।
- source_word: וַיָּבֹא אֶל הָאִישׁ
  choice: उस पुरुष के पास पहुँचा
  rationale: בוא אֶל को हिन्दी में ‘के पास पहुँचा’ स्वाभाविक रूप से व्यक्त करता है; ‘पुरुष’ स्रोत के אִישׁ को बनाए रखता है।
- source_word: הַאַתָּה הָאִישׁ
  choice: क्या तुम वही पुरुष हो
  rationale: प्रश्नवाचक הֲ और सर्वनाम אַתָּה का स्वाभाविक हिन्दी रूप ‘क्या तुम ... हो’ है; ‘वही’ उस व्यक्ति की पहचान पूछने का आशय स्पष्ट करता है।
- source_word: אֲשֶׁר דִּבַּרְתָּ אֶל הָאִשָּׁה
  choice: जिसने उस स्त्री से बात की थी
  rationale: संबंधवाचक उपवाक्य और אֶל के संबोधन-भाव को सहज हिन्दी में व्यक्त किया गया है। ‘उस स्त्री’ स्रोत के निश्चित הָאִשָּׁה को सुरक्षित रखता है।
- source_word: אָנִי
  choice: हाँ, मैं ही हूँ
  rationale: इब्रानी का संक्षिप्त सर्वनामात्मक उत्तर शाब्दिक रूप से ‘मैं’ है। प्रश्न के उत्तर में आधुनिक हिन्दी का ‘हाँ, मैं ही हूँ’ उसी आत्म-पहचान को स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: आगंतुक की पहचान
  choice: הָאִישׁ का अनुवाद ‘उस पुरुष’ किया गया है
  alternative: ‘स्वर्गदूत’ या ‘दूत’
  rationale: व्यापक प्रसंग में यह व्यक्ति यहोवा का दूत है, पर इस पद में उसे אִישׁ, अर्थात ‘पुरुष’, कहा गया है। यही शब्द रखना कथा में उसकी पहचान के क्रमिक उद्घाटन और वर्तमान पद के दृष्टिकोण को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक रखी गई है। ‘पुरुष’ तथा ‘उस स्त्री’ स्रोत की सतही शब्दावली और कथा के दृष्टिकोण को बनाए रखते हैं; संवाद में सहज हिन्दी का प्रयोग किया गया है।
