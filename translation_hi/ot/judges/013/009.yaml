id: JDG.13.9
reference: Judges 13:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יִּשְׁמַ֥ע הָ/אֱלֹהִ֖ים בְּ/ק֣וֹל מָנ֑וֹחַ וַ/יָּבֹ֣א מַלְאַךְ֩ הָ/אֱלֹהִ֨ים ע֜וֹד אֶל הָ/אִשָּׁ֗ה וְ/הִיא֙ יוֹשֶׁ֣בֶת בַּ/שָּׂדֶ֔ה וּ/מָנ֥וֹחַ אִישָׁ֖/הּ אֵ֥ין עִמָּֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/009.yaml
  text: And God listened to the voice of Manoah, and the angel of God came again to the woman while she was sitting in the field, and Manoah her husband was not with her.
translation:
  language: hi
  text: परमेश्वर ने मानोह की बात सुन ली। परमेश्वर का दूत फिर उस स्त्री के पास आया। उस समय वह खेत में बैठी थी, और उसका पति मानोह उसके साथ नहीं था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁמַע ... בְּקוֹל
  choice: की बात सुन ली
  rationale: यह इब्रानी मुहावरा ध्यान देकर सुनने और अनुकूल उत्तर देने का भाव रखता है। पिछले पद की प्रार्थना के संदर्भ में ‘सुन ली’ स्वाभाविक हिन्दी में उस प्रत्युत्तर को व्यक्त करता है; ‘आवाज़ सुनी’ यहाँ केवल ध्वनि सुनने का भ्रामक अर्थ दे सकता था।
- source_word: מָנוֹחַ
  choice: मानोह
  rationale: व्यक्तिवाचक नाम का ऐसा लिप्यंतरण मूल उच्चारण के निकट और हिन्दी में सहज है।
- source_word: מַלְאַךְ הָאֱלֹהִים
  choice: परमेश्वर का दूत
  rationale: מַלְאַךְ का मूल अर्थ ‘दूत/संदेशवाहक’ है और इस कथा में यह अलौकिक ईश्वरीय दूत है। ‘परमेश्वर का दूत’ हिन्दी बाइबलीय शैली में स्वाभाविक है और शब्द के संदेशवाहक वाले मूल भाव को भी बनाए रखता है।
- source_word: עוֹד
  choice: फिर
  rationale: यहाँ यह पहले घटित आगमन की पुनरावृत्ति दर्शाता है; ‘फिर’ संक्षिप्त और स्वाभाविक है।
- source_word: הָאִשָּׁה
  choice: उस स्त्री
  rationale: मूल में संबंधसूचक ‘पत्नी’ के बजाय ‘स्त्री’ है। ‘उस स्त्री’ कथा में पहले से परिचित पात्र की ओर संकेत करता है और मूल अभिव्यक्ति को बनाए रखता है।
- source_word: וְהִיא יוֹשֶׁבֶת בַּשָּׂדֶה
  choice: उस समय वह खेत में बैठी थी
  rationale: इब्रानी कृदंत आगमन के समय जारी पृष्ठभूमि की क्रिया बताता है। अलग हिन्दी वाक्य में ‘उस समय’ इस परिस्थितिजन्य संबंध को स्पष्ट और स्वाभाविक बनाता है।
- source_word: אִישָׁהּ
  choice: उसका पति
  rationale: אִישׁ का मूल अर्थ ‘पुरुष’ है, पर स्त्रीलिंग संबंधसूचक प्रत्यय और प्रसंग में इसका मुहावरेदार अर्थ ‘उसका पति’ है।
- source_word: אֵין עִמָּהּ
  choice: उसके साथ नहीं था
  rationale: नकारात्मक अस्तित्ववाचक रचना और עִם यहाँ उपस्थिति अथवा साथ होने को व्यक्त करते हैं।
theological_decisions:
- issue: הָאֱלֹהִים का अर्थ
  choice: परमेश्वर
  alternative: देवता
  rationale: रूप की दृष्टि से אֱלֹהִים बहुवचन दिखाई देता है, किंतु इस प्रसंग में यह एकवचन क्रिया के साथ इस्राएल के परमेश्वर के लिए प्रयुक्त हुआ है। इसलिए ‘परमेश्वर’ तत्काल व्याकरण और कथा-संदर्भ के अनुरूप है।
- issue: מַלְאַךְ को ‘दूत’ या ‘स्वर्गदूत’ कहना
  choice: परमेश्वर का दूत
  alternative: परमेश्वर का स्वर्गदूत
  rationale: कथा उस प्राणी को अलौकिक ईश्वरीय संदेशवाहक के रूप में प्रस्तुत करती है, पर मूल शब्द स्वयं व्यापक रूप से ‘दूत’ कहता है। ‘दूत’ मूल की शब्दार्थगत व्यापकता और कथा के रहस्यात्मक तनाव को अनावश्यक रूप से सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। लंबे इब्रानी समन्वित वाक्य को स्पष्ट हिन्दी प्रवाह के लिए तीन छोटे वाक्यों में बाँटा गया है, जबकि घटनाओं का क्रम और परिस्थितिजन्य संबंध सुरक्षित है। कोई पादटिप्पणी आवश्यक नहीं मानी गई।
