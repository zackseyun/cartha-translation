  text: וַ/יֹּ֧אמֶר מָנ֛וֹחַ אֶל אִשְׁתּ֖/וֹ מ֣וֹת נָמ֑וּת כִּ֥י אֱלֹהִ֖ים רָאִֽינוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/022.yaml
  text: And Manoah said to his wife[a], “We will surely die, because we have seen God.”
translation:
  language: hi
  text: तब मानोह ने अपनी पत्नी से कहा, “हम निश्चय ही मर जाएँगे, क्योंकि हमने परमेश्वर[a] को देखा है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “किसी देवता को” अथवा “किसी दिव्य प्राणी को।” इब्रानी शब्द אֱלֹהִים कुछ प्रसंगों में व्यापक अर्थ का हो सकता है, पर यहाँ प्रसंग “परमेश्वर” के अर्थ का समर्थन करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने कहा
  rationale: वाव-क्रमिक कथात्मक रूप को स्वाभाविक हिन्दी कथा-प्रवाह में व्यक्त करता है; ‘तब’ प्रसंग की अगली घटना को दिखाता है, बिना अतिरिक्त कारणात्मक अर्थ जोड़े।
- source_word: מָנוֹחַ
  choice: मानोह
  rationale: व्यक्तिवाचक नाम का स्रोत-आधारित देवनागरी लिप्यंतरण।
- source_word: אֶל אִשְׁתּוֹ
  choice: अपनी पत्नी से
  rationale: सम्बन्धसूचक प्रयोग का स्वाभाविक आधुनिक हिन्दी रूप; हिन्दी में कर्ता की अपनी पत्नी के लिए ‘अपनी’ उपयुक्त है।
- source_word: מוֹת נָמוּת
  choice: हम निश्चय ही मर जाएँगे
  rationale: क्रिया के साथ प्रयुक्त धात्वर्थक अनन्त रूप मृत्यु की निश्चितता पर बल देता है; ‘निश्चय ही’ उस तीव्र बल को स्पष्ट और स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यहाँ यह मानोह के भय और निष्कर्ष का कारण प्रस्तुत करता है।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: तात्कालिक प्रसंग में मानोह इस दर्शन को परमेश्वर के दर्शन के रूप में समझता है। फिर भी इब्रानी शब्द कुछ प्रसंगों में किसी देवता या दिव्य प्राणी के लिए भी प्रयुक्त हो सकता है; इस सम्भावना को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: רָאִינוּ
  choice: हमने ... देखा है
  rationale: पूर्ण क्रिया का यह हिन्दी रूप अभी-अभी हुए दर्शन और उसके वर्तमान परिणाम—मृत्यु के भय—के सम्बन्ध को स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: यहोवा के दूत के प्रकट होने के बाद मानोह के कथन में אֱלֹהִים का अर्थ
  choice: परमेश्वर
  alternative: कोई देवता; कोई दिव्य प्राणी
  rationale: न्यायियों 13 का निकट प्रसंग इस अनुभव को परमेश्वर से साक्षात्कार के रूप में प्रस्तुत करता है, और मानोह का मृत्यु-भय इसी समझ के अनुकूल है। फिर भी दूत और परमेश्वर की पहचान के बीच कथात्मक रहस्य को सिद्धान्तगत रूप से सुलझाया नहीं गया; शब्द की व्यापक सम्भावना पादटिप्पणी में दी गई है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘निश्चय ही’ मूल इब्रानी की प्रबल निश्चितता को व्यक्त करता है। पादटिप्पणी का चिह्न उसी शब्द ‘परमेश्वर’ पर लगाया गया है जिससे वह सम्बन्धित है।
