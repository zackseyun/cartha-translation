base_translation:
  language: en
  yaml_path: translation/ot/judges/013/024.yaml
  text: And the woman bore a son and called his name Samson. And the boy grew, and Yahweh blessed him.
translation:
  language: hi
  text: उस स्त्री ने एक पुत्र को जन्म दिया और उसका नाम शिमशोन रखा। वह बालक बड़ा हुआ, और याहवे ने उसे आशीष दी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֵּלֶד
  choice: जन्म दिया
  rationale: ילד के क़ाल रूप का प्रसव-संदर्भ में स्वाभाविक और सटीक हिन्दी रूप।
- source_word: הָאִשָּׁה
  choice: उस स्त्री ने
  rationale: इब्रानी में स्पष्टतः ‘स्त्री’ है; ‘उस’ पूर्व-संदर्भ में मनोह की पत्नी की ओर संकेत करता है, बिना इस पद में ‘पत्नी’ जोड़ने के।
- source_word: בֵּן
  choice: एक पुत्र को
  rationale: जन्म के संदर्भ में בן का मानक और गरिमापूर्ण हिन्दी रूप।
- source_word: וַתִּקְרָא אֶת־שְׁמוֹ
  choice: उसका नाम ... रखा
  rationale: शाब्दिक नाम-पुकार सूत्र का अर्थ आधुनिक हिन्दी के स्वाभाविक नामकरण-वाक्य से व्यक्त होता है।
- source_word: שִׁמְשׁוֹן
  choice: शिमशोन
  rationale: इब्रानी नाम का निकट देवनागरी लिप्यंतरण; प्रचलित हिन्दी बाइबल-रूप से भी मेल खाता है।
- source_word: וַיִּגְדַּל
  choice: बड़ा हुआ
  rationale: यहाँ גדל बालक की शारीरिक और आयु-संबंधी वृद्धि बताता है, न कि उसकी महानता।
- source_word: הַנַּעַר
  choice: वह बालक
  rationale: נער की व्यापक अर्थ-सीमा में तत्काल जन्म-वर्णन के बाद ‘बालक’ संदर्भानुकूल है।
- source_word: וַיְבָרְכֵהוּ
  choice: उसे आशीष दी
  rationale: ברך का धार्मिक अर्थ और परमेश्वर की कृपापूर्ण क्रिया दोनों सुरक्षित रहते हैं।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चतुरक्षरीय दिव्य नाम को हिन्दी में व्यापक रूप से पहचाने जाने वाले व्यक्तिगत नाम ‘यहोवा’ से प्रस्तुत किया गया है, न कि उपाधि ‘प्रभु’ से।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ के व्यक्तिगत दिव्य नाम को उपाधि से बदलने के बजाय नाम के रूप में रखा गया है। आधुनिक हिन्दी पाठकों में ‘यहोवा’ अधिक परिचित है; ‘याहवे’ मूल उच्चारण का वैकल्पिक विद्वत्तापूर्ण लिप्यंतरण है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण कथात्मक शैली। इब्रानी के क्रमिक वाव-वाक्यों को हिन्दी में सहज रूप से जोड़ा गया है और किसी अस्पष्टता पर अनावश्यक व्याख्या नहीं थोपी गई।
