  text: וַ/תְּמַהֵר֙ הָֽ/אִשָּׁ֔ה וַ/תָּ֖רָץ וַ/תַּגֵּ֣ד לְ/אִישָׁ֑/הּ וַ/תֹּ֣אמֶר אֵלָ֔י/ו הִנֵּ֨ה נִרְאָ֤ה אֵלַ/י֙ הָ/אִ֔ישׁ אֲשֶׁר בָּ֥א בַ/יּ֖וֹם אֵלָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/010.yaml
  text: So the woman hurried and ran and told her husband[a], and said to him, “Look, the man who came to me that day has appeared to me.”
translation:
  language: hi
  text: तब वह स्त्री जल्दी से दौड़ी और अपने पति को बताया। उसने उससे कहा, “देखो, वह पुरुष जो उस दिन[a] मेरे पास आया था, मुझे दिखाई दिया है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “कुछ दिन पहले।” हिब्रू अभिव्यक्ति का शाब्दिक अर्थ है, “जिस दिन वह मेरे पास आया,” और यह उसके पहले आगमन की ओर संकेत करती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּמַהֵר וַתָּרָץ
  choice: फुर्ती से दौड़कर
  rationale: दोनों क्रियाएँ उसकी तत्परता और वास्तविक रूप से दौड़ने को व्यक्त करती हैं। सहज हिन्दी में संयुक्त क्रियाविशेषणीय रूप पुनरुक्ति से बचते हुए दोनों भाव रखता है।
- source_word: וַתַּגֵּד לְאִישָׁהּ
  choice: अपने पति के पास गई और उसे बताया
  rationale: לְאִישָׁהּ घरेलू प्रसंग में स्वाभाविक रूप से ‘अपने पति को’ है; हिन्दी वाक्य में दौड़ने की दिशा स्पष्ट करने के लिए ‘पति के पास गई’ और फिर ‘उसे बताया’ कहा गया है।
- source_word: הִנֵּה
  choice: देखो
  rationale: यह ध्यान आकर्षित करने वाला उद्गार है; ‘देखो’ आधुनिक और स्वाभाविक है।
- source_word: נִרְאָה אֵלַי
  choice: मुझे फिर दिखाई दिया है
  rationale: निफ़अल रूप यहाँ ‘प्रकट/दिखाई देना’ व्यक्त करता है। प्रसंग में पहले आए व्यक्ति के दोबारा दिखाई देने के कारण ‘फिर’ निहित पुनरावृत्ति को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: הָאִישׁ
  choice: वह पुरुष
  rationale: स्त्री उस व्यक्ति को यहीं केवल ‘पुरुष’ कहती है; व्यापक प्रसंग की ‘यहोवा का दूत’ पहचान इस कथन में आरोपित नहीं की गई।
- source_word: אֲשֶׁר בָּא בַיּוֹם אֵלָי
  choice: जो उस दिन मेरे पास आया था
  rationale: शाब्दिक संरचना ‘जो दिन में/उस दिन मेरे पास आया’ पहले के आगमन की ओर संकेत करती है; ‘उस दिन’ हिन्दी में सहज और संदर्भानुकूल है।
theological_decisions:
- issue: स्त्री के कथन में הָאִישׁ की पहचान
  choice: वह पुरुष
  alternative: यहोवा का दूत / परमेश्वर का दूत
  rationale: यद्यपि व्यापक प्रसंग उस व्यक्ति को यहोवा का दूत बताता है, स्त्री इस पद में उसे केवल ‘पुरुष’ कहती है। अनुवाद उसके तत्काल कथन और कथात्मक तनाव को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण कथात्मक शैली। ‘फुर्ती से दौड़कर’ हिब्रू की दोहरी तात्कालिकता को स्वाभाविक हिन्दी में रखता है; ‘पुरुष’ मूल की पहचान-संबंधी संयमता बनाए रखता है।
