source:
  edition: WLC
  text: וַ/יְהִי֩ אִ֨ישׁ אֶחָ֧ד מִ/צָּרְעָ֛ה מִ/מִּשְׁפַּ֥חַת הַ/דָּנִ֖י וּ/שְׁמ֣/וֹ מָנ֑וֹחַ וְ/אִשְׁתּ֥/וֹ עֲקָרָ֖ה וְ/לֹ֥א יָלָֽדָה׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/002.yaml
  text: There was a certain man from Zorah[a], from the clan of the Danites, and his name was Manoah. His wife was barren and had not borne children.
translation:
  language: hi
  text: सोराह का एक पुरुष था, जो दानियों के कुल से था। उसका नाम मानोह था। उसकी पत्नी बाँझ थी और उसने किसी बच्चे को जन्म नहीं दिया था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: था
  rationale: यह रूप नए वृत्तांत-दृश्य का परिचय देता है। हिंदी में अस्तित्वसूचक वाक्य के अंत का ‘था’ स्वाभाविक रूप से यह कार्य करता है; स्रोत में स्पष्ट ‘अब’ न होने के कारण उसे नहीं जोड़ा गया।
- source_word: אִישׁ אֶחָד
  choice: एक पुरुष
  rationale: यह किसी विशेष, किंतु अभी परिचित न कराए गए व्यक्ति का संकेत करता है। ‘एक पुरुष’ आधुनिक हिंदी में स्वाभाविक है और अनावश्यक रूप से ‘एक निश्चित पुरुष’ जैसी कृत्रिम अभिव्यक्ति से बचता है।
- source_word: מִצָּרְעָה
  choice: सोराह नगर में
  rationale: מִן यहाँ व्यक्ति के स्थान/मूल को दर्शाता है। अस्तित्वसूचक हिंदी वाक्य में ‘सोराह नगर में ... एक पुरुष था’ स्वाभाविक है; ‘नगर’ जोड़ने से पाठक स्थान-नाम को सहज पहचानता है।
- source_word: מִמִּשְׁפַּחַת הַדָּנִי
  choice: दानियों के कुल का
  rationale: מִשְׁפָּחָה यहाँ बड़े गोत्रीय समुदाय के भीतर की रिश्तेदारी-इकाई है, इसलिए ‘कुल’ उपयुक्त है। הַדָּנִי को सामूहिक अर्थ में ‘दानियों’ कहा गया है।
- source_word: וּשְׁמוֹ מָנוֹחַ
  choice: उसका नाम मानोह था
  rationale: इब्रानी नामकरण-वाक्य का स्पष्ट और स्वाभाविक हिंदी रूप। नाम का लिप्यंतरण ‘मानोह’ स्रोत के उच्चारण के निकट है।
- source_word: וְאִשְׁתּוֹ
  choice: उसकी पत्नी
  rationale: संबंधवाचक प्रत्यय को स्पष्ट रखा गया है। पठनीयता के लिए इस उपवाक्य से नया वाक्य आरंभ किया गया है।
- source_word: עֲקָרָה
  choice: बाँझ थी
  rationale: यह शब्द स्त्री की संतान उत्पन्न करने में असमर्थता बताता है। ‘बाँझ’ संक्षिप्त, प्रचलित और इस बाइबिलीय जन्म-वृत्तांत के साहित्यिक स्वर के अनुरूप है।
- source_word: וְלֹא יָלָדָה
  choice: और उसने किसी बच्चे को जन्म नहीं दिया था
  rationale: יָלָדָה स्त्री कर्ता के साथ ‘जन्म देना’ बताता है। स्रोत में कोई स्पष्ट कर्म या बहुवचन नहीं है; ‘किसी बच्चे को ... नहीं’ स्वाभाविक हिंदी में उसी अभाव को व्यक्त करता है, बिना अनेक बच्चों का अर्थ आरोपित किए।
