source:
  edition: WLC
  text: וַ/יֹּ֧אמֶר מָנ֛וֹחַ אֶל מַלְאַ֥ךְ יְהוָ֖ה מִ֣י שְׁמֶ֑/ךָ כִּֽי יָבֹ֥א דברי/ך וְ/כִבַּדְנֽוּ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/017.yaml
  text: Then Manoah said to the angel of Yahweh[a], “What is your name, so that when your words come to pass, we may honor you?”
translation:
  language: hi
  text: तब मानोह ने याहवे के दूत[a] से कहा, “आपका नाम क्या है, ताकि आपकी बातें पूरी होने पर हम आपका सम्मान कर सकें?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “याहवे का स्वर्गदूत।”
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: यहवे के दूत
  rationale: מַלְאַךְ का अर्थ ‘दूत’ या ‘स्वर्गदूत’ हो सकता है। इस अलौकिक प्रसंग में ‘दूत’ सहज है और मूल शब्द की व्यापकता बनाए रखता है; יְהוָה को उसके व्यक्तिगत वाचा-नाम ‘यहवे’ से व्यक्त किया गया है।
- source_word: מִי שְׁמֶךָ
  choice: आपका नाम क्या है
  rationale: हिब्रू मुहावरा नाम पूछता है; आधुनिक हिन्दी में यह उसका स्वाभाविक और सम्मानसूचक रूप है।
- source_word: כִּי
  choice: ताकि ... तब
  rationale: यहाँ यह नाम पूछने के उद्देश्य को आगे होने वाली पूर्ति और सम्मान से जोड़ता है। हिन्दी में ‘ताकि ... तब’ इस संबंध को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: יָבֹא דְבָרֶיךָ
  choice: जब आपकी बातें पूरी हों
  rationale: דְבָרֶיךָ का बहुवचन ‘बातें’ के रूप में सुरक्षित है; ‘पूरी हों’ भविष्यवाणी के सच घटित होने का स्वाभाविक हिन्दी मुहावरा है।
- source_word: וְכִבַּדְנוּךָ
  choice: हम आपका सम्मान कर सकें
  rationale: כבד के पिएल रूप का अर्थ यहाँ सम्मान देना है। ‘कर सकें’ उद्देश्य/संभावना की छाया रखता है और ‘महिमा दें’ जैसी अधिक धर्मवैज्ञानिक अभिव्यक्ति से बचता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चतुरक्षरीय व्यक्तिगत नाम सीधे आया है। ‘यहवे’ उसे उपाधि में बदले बिना प्रस्तुत करता है।
- issue: מַלְאַךְ की पहचान
  choice: दूत
  alternative: स्वर्गदूत
  rationale: कथा इस व्यक्ति को अलौकिक रूप में प्रस्तुत करती है, फिर भी मूल शब्द का मूल अर्थ ‘संदेशवाहक/दूत’ है। मुख्य पाठ में ‘दूत’ मूल की अर्थगत व्यापकता और व्यक्ति की पहचान से जुड़ा कथात्मक तनाव बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सम्मानसूचक ‘आप’, और सरल किंतु गरिमापूर्ण वाक्य-विन्यास अपनाया गया है। ‘बातें’ द्वारा हिब्रू बहुवचन सुरक्षित रखा गया है।
