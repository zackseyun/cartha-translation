  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: מִ/כֹּ֣ל אֲשֶׁר יֵצֵא֩ מִ/גֶּ֨פֶן הַ/יַּ֜יִן לֹ֣א תֹאכַ֗ל וְ/יַ֤יִן וְ/שֵׁכָר֙ אַל תֵּ֔שְׁתְּ וְ/כָל טֻמְאָ֖ה אַל תֹּאכַ֑ל כֹּ֥ל אֲשֶׁר צִוִּיתִ֖י/הָ תִּשְׁמֹֽר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/014.yaml
  text: She must not eat anything that comes from the grapevine[a], and she must not drink wine or strong drink, and she must not eat anything unclean. She must keep all that I commanded her.
translation:
  language: hi
  text: वह दाखलता से निकलने वाली कोई भी चीज़ न खाए[a], और न दाखमधु या अन्य मादक पेय पिए, और न कोई अशुद्ध वस्तु खाए। मैंने उसे जो कुछ आज्ञा दी है, उसका वह पालन करे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: “दाखमधु की लता से निकलने वाली किसी भी चीज़ में से,” अर्थात् दाखलता से प्राप्त या बनी कोई भी चीज़।'
    reason: मूल इब्रानी की विशिष्ट अभिव्यक्ति और निषेध की व्यापकता स्पष्ट करना।
lexical_decisions:
- source_word: מִכֹּל אֲשֶׁר יֵצֵא מִגֶּפֶן הַיַּיִן
  choice: दाखलता से निकलने वाली कोई भी चीज़
  rationale: यह व्यापक वाक्यांश दाखलता से उत्पन्न या उससे बनी हर वस्तु को समेटता है। ‘निकलने वाली’ יֵצֵא की क्रियात्मक छवि को बनाए रखता है, जबकि ‘दाखलता’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: לֹא תֹאכַל
  choice: वह ... न खाए
  rationale: स्त्रीलिंग रूप और निषेधात्मक बल को स्वाभाविक आधुनिक हिन्दी में सुरक्षित रखता है।
- source_word: יַיִן
  choice: दाखमधु
  rationale: יַיִן के लिए स्पष्ट और गरिमापूर्ण हिन्दी शब्द, जो दाख से बने मादक पेय को दर्शाता है।
- source_word: שֵׁכָר
  choice: मदिरा
  rationale: दाखमधु से अलग अन्य मादक पेय के लिए व्यापक शब्द चुना गया है; इसे किसी एक पेय, जैसे बीयर, तक सीमित नहीं किया गया।
- source_word: אַל תֵּשְׁתְּ
  choice: न ... पिए
  rationale: אַל के निषेधात्मक आदेश और स्त्रीलिंग क्रिया को सहज हिन्दी में व्यक्त करता है।
- source_word: כָל טֻמְאָה
  choice: कोई अशुद्ध वस्तु
  rationale: व्यापक अनिश्चित अर्थ को बनाए रखते हुए ‘अशुद्ध’ व्यवस्था-संबंधी शुद्धता की बाइबलीय श्रेणी को सुरक्षित रखता है।
- source_word: כֹּל אֲשֶׁר צִוִּיתִיהָ
  choice: जो कुछ मैंने उसे आज्ञा दी है ... उस सबका
  rationale: समग्रता और स्त्रीलिंग कर्म-सर्वनाम दोनों को स्पष्ट रूप से व्यक्त करता है। हिन्दी में पूर्ण वर्तमान पूर्व में दी गई और अब भी लागू आज्ञा के लिए स्वाभाविक है।
- source_word: תִּשְׁמֹר
  choice: पालन करे
  rationale: यहाँ שׁמר का अर्थ निर्देशों को मानना या उनका पालन करना है; ‘पालन करे’ आधुनिक हिन्दी में ‘रखे’ की अपेक्षा अधिक स्पष्ट है।
theological_decisions:
- issue: दाखलता की उपज पर निषेध का विस्तार
  choice: वाक्यांश को दाखलता से निकलने वाली किसी भी चीज़ पर लागू व्यापक निषेध के रूप में प्रस्तुत किया गया है।
  alternative: इसे केवल खाने योग्य अंगूर या कुछ विशेष दाख-उत्पादों तक सीमित करना।
  rationale: इब्रानी अभिव्यक्ति ‘जो कुछ दाखमधु की लता से निकलता है’ जानबूझकर व्यापक है। प्रसंग अभिषेक-संबंधी प्रतिबंधों का है, पर मुख्य पाठ में बाद की तकनीकी शब्दावली जोड़े बिना मूल की व्यापकता रखी गई है।
- issue: טֻמְאָה का अनुवाद
  choice: अशुद्ध
  alternative: अपवित्र
  rationale: ‘अशुद्ध’ शुद्ध-अशुद्ध की तोराही और अनुष्ठानिक श्रेणी से अंतर्पाठीय संबंध बनाए रखता है तथा आधुनिक पाठक के लिए समझने योग्य है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण पर सहज शैली रखी गई है। स्त्रीलिंग क्रियाएँ संदर्भित स्त्री को स्पष्ट करती हैं। ‘दाखमधु’ और ‘मदिरा’ का युग्म יַיִן और שֵׁכָר के भेद को यथासंभव बनाए रखता है; ‘पालन करे’ आज्ञा मानने का अर्थ स्वाभाविक रूप से देता है।
