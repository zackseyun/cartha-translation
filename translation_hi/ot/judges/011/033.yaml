source:
  edition: WLC
  text: וַ/יַּכֵּ֡/ם מֵ/עֲרוֹעֵר֩ וְ/עַד בּוֹאֲ/ךָ֨ מִנִּ֜ית עֶשְׂרִ֣ים עִ֗יר וְ/עַד֙ אָבֵ֣ל כְּרָמִ֔ים מַכָּ֖ה גְּדוֹלָ֣ה מְאֹ֑ד וַ/יִּכָּֽנְעוּ֙ בְּנֵ֣י עַמּ֔וֹן מִ/פְּנֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/033.yaml
  text: And he struck them from Aroer as far as the entrance to Minnith[a], twenty cities, and as far as Abel-keramim, with a very great slaughter[d][c][b]. So the sons of Ammon were subdued before the sons of Israel.
translation:
  language: hi
  text: उसने उन्हें अरोएर से लेकर मिन्नीत के प्रवेश तक[a]—बीस नगरों तक—और आबेल-करामीम तक बहुत बड़ी मार दी। इस प्रकार अम्मोन के वंशज इस्राएल के वंशजों के सामने अधीन हो गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मिन्नीत तक,” अथवा “मिन्नीत के निकट पहुँचने के स्थान तक।” इब्रानी अभिव्यक्ति कठिन है और नगर के प्रवेश, उसके निकट पहुँचने के स्थान, या स्वयं नगर की ओर संकेत कर सकती है।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּכֵּם
  choice: उसने ... पराजित किया
  rationale: נכה का मूल भाव ‘मारना/प्रहार करना’ है; यहाँ युद्ध और उसके परिणाम के संदर्भ में ‘पराजित किया’ स्वाभाविक हिन्दी है, जबकि आगे का מַכָּה वाक्यांश प्रहार की भीषणता व्यक्त करता है।
- source_word: מֵעֲרוֹעֵר
  choice: अरोएर से
  rationale: यह स्थान-नाम है, इसलिए इसका लिप्यंतरण किया गया है।
- source_word: וְעַד בּוֹאֲךָ מִנִּית
  choice: मिन्नीत के प्रवेश तक[a]
  rationale: भौगोलिक संदर्भ में בואך किसी नगर के प्रवेश या उसके निकट पहुँचने के स्थान को सूचित कर सकता है। ‘प्रवेश तक’ इस कठिन अभिव्यक्ति का संक्षिप्त और स्वाभाविक रूप है; अस्पष्टता पादटिप्पणी में रखी गई है।
- source_word: עֶשְׂרִים עִיר
  choice: बीस नगरों को
  rationale: संख्या और संज्ञा का सीधा अनुवाद; हिन्दी में कर्म-संबंध स्पष्ट करने के लिए ‘को’ जोड़ा गया है।
- source_word: וְעַד אָבֵל כְּרָמִים
  choice: और आबेल-करामीम तक के क्षेत्र को
  rationale: आबेल-करामीम स्थान-नाम है और इसलिए लिप्यंतरित है। ‘के क्षेत्र को’ हिन्दी वाक्य में दूसरे भौगोलिक छोर को युद्ध की सीमा से स्वाभाविक रूप से जोड़ता है।
- source_word: מַכָּה גְדוֹלָה מְאֹד
  choice: बहुत बड़ी मार से
  rationale: מַכָּה का अर्थ ‘मार/प्रहार/पराजय’ हो सकता है। ‘बहुत बड़ी मार’ मूल की ठोस सैन्य छवि और तीव्रता को बनाए रखता है, बिना अनिवार्य रूप से सबके वध का दावा किए।
- source_word: וַיִּכָּנְעוּ
  choice: दब गए
  rationale: Niphal रूप सैन्य-राजनीतिक अधीनता या वश में आ जाने को व्यक्त करता है। ‘दब गए’ आधुनिक हिन्दी में संक्षिप्त और सुसंगत है।
- source_word: בְּנֵי עַמּוֹן
  choice: अम्मोन के वंशज
  rationale: शाब्दिक ‘अम्मोन के पुत्र’ की वंशगत सामूहिक भावना को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: מִפְּנֵי בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के वंशजों के सामने
  rationale: מִפְּנֵי का ‘के सामने’ संबंध और समानांतर वंशगत अभिव्यक्ति दोनों सुरक्षित रखे गए हैं।
