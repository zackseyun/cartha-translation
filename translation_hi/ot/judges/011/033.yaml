- from: उसने अरोएर से लेकर मिन्नीत के प्रवेश तक[a] बीस नगरों को, और आबेल-करामीम तक के क्षेत्र को, बहुत बड़ी मार से पराजित किया। इस प्रकार अम्मोन के वंशज इस्राएल के वंशजों के सामने दब गए।
  to: उसने उन्हें अरोएर से लेकर मिन्नीत के प्रवेश तक[a]—बीस नगरों तक—और आबेल-करामीम तक बहुत बड़ी मार दी। इस प्रकार अम्मोन के वंशज इस्राएल के वंशजों के सामने अधीन हो गए।
  rationale: Revision restores “them” as the object of the initial military action and treats the place names and twenty cities as boundaries or extent markers, rather than objects conquered. It also renders the decisive military outcome with “अधीन हो गए.” The footnote preserves the genuine ambiguity of the difficult expression concerning Minnith.
