source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יִפְתָּ֜ח אֶל זִקְנֵ֣י גִלְעָ֗ד אִם מְשִׁיבִ֨ים אַתֶּ֤ם אוֹתִ/י֙ לְ/הִלָּחֵם֙ בִּ/בְנֵ֣י עַמּ֔וֹן וְ/נָתַ֧ן יְהוָ֛ה אוֹתָ֖/ם לְ/פָנָ֑/י אָנֹכִ֕י אֶהְיֶ֥ה לָ/כֶ֖ם לְ/רֹֽאשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/009.yaml
  text: Jephthah said to the elders of Gilead[a], “If you bring me back to fight against the Ammonites, and Yahweh gives them before me[b], I will be your head.”
translation:
  language: hi
  text: यिप्तह ने गिलाद के बुज़ुर्गों से कहा, “यदि तुम मुझे अम्मोनियों से लड़ने के लिए वापस ले आओ और याहवे उन्हें मेरे सामने कर दे[a], तो मैं तुम्हारा मुखिया[b] होऊँगा।”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उन्हें मेरे सामने दे दे।” युद्ध के इस प्रसंग में यह याहवे द्वारा यिप्तह को उन पर विजय दिलाने का भाव व्यक्त करता है।
    reason: literal_rendering
  - marker: b
    text: या “प्रधान” अथवा “सरदार।” मूल शब्द का शाब्दिक अर्थ “सिर” है।
    reason: lexical_alternative
  - marker: c
    text: 'इस अंतिम वाक्य को प्रश्न के रूप में भी समझा जा सकता है: “तो क्या मैं तुम्हारा मुखिया होऊँगा?”'
    reason: alternative_reading
lexical_decisions:
- source_word: מְשִׁיבִים אַתֶּם אוֹתִי
  choice: तुम मुझे ... वापस ले आते हो
  rationale: שוב के हिफ़ील रूप का अर्थ किसी को लौटाकर लाना है। यिप्तह को पहले निकाल दिया गया था, इसलिए यह प्रयोग कारणवाचक अर्थ और प्रसंग दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לְהִלָּחֵם
  choice: लड़ने के लिए
  rationale: यहाँ निफ़ाल क्रियारूप युद्ध में उतरने को व्यक्त करता है; ‘लड़ने के लिए’ आधुनिक हिन्दी में स्पष्ट और सहज है।
- source_word: בִּבְנֵי עַמּוֹן
  choice: अम्मोनियों से
  rationale: शाब्दिक ‘अम्मोन के पुत्रों’ के स्थान पर प्रचलित जातिवाचक नाम ‘अम्मोनी’ अभिप्रेत जनसमूह को स्वाभाविक रूप से व्यक्त करता है; युद्ध के प्रसंग में בְּ का विरोधात्मक भाव ‘से’ द्वारा आया है।
- source_word: וְנָתַן יְהוָה אוֹתָם לְפָנַי
  choice: और यहोवा उन्हें मेरे सामने हरा देता है
  rationale: ‘मेरे सामने दे देता है’ हिब्रू संरचना के अधिक निकट है, पर हिन्दी में अस्पष्ट और अस्वाभाविक लगेगा। युद्ध के प्रसंग में यह विजय दिलाने का भाव रखता है; ‘मेरे सामने हरा देता है’ उस अर्थ को स्पष्ट करता है और ‘मेरे हाथ में’ नहीं जोड़ता, क्योंकि स्रोत में יָד नहीं है। शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में परमेश्वर के व्यक्तिगत नाम की स्थापित लिप्यंतरण-परंपरा ‘यहोवा’ है; इसे किसी उपाधि से नहीं बदला गया।
- source_word: לְרֹאשׁ
  choice: मुखिया
  rationale: רֹאשׁ का मूल अर्थ ‘सिर’ है, पर यहाँ रूपकतः समुदाय के प्रमुख या शासक का पद अभिप्रेत है। ‘मुखिया’ हिन्दी में इस राजनीतिक-सामुदायिक भूमिका को स्वाभाविक ढंग से व्यक्त करता है और सिर/मुख के रूपक से भी कुछ संबंध बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: पाठ में उपाधि नहीं, चार-अक्षरीय व्यक्तिगत नाम है। हिन्दी पाठकों के लिए सुस्थापित ‘यहोवा’ चुना गया, जबकि ‘याहवे’ अधिक प्रत्यक्ष विद्वत्तापूर्ण लिप्यंतरण है।
- issue: अंतिम वाक्यांश אָנֹכִי אֶהְיֶה לָכֶם לְרֹאשׁ का कथन या प्रश्न होना
  choice: 'कथन: ‘तो मैं तुम्हारा मुखिया होऊँगा’'
  alternative: 'प्रश्न: ‘तो क्या मैं तुम्हारा मुखिया होऊँगा?’'
  rationale: हिब्रू में प्रश्नवाचक चिह्न या कण नहीं है और व्याकरणतः यह कथन है। फिर भी वार्तालाप में इसे शर्त की पुष्टि माँगने वाला प्रश्न समझना संभव है; इस वास्तविक संवादगत अस्पष्टता को पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘पुरनियों’ बाइबलीय हिन्दी में समुदाय के मान्य वरिष्ठ अगुओं के लिए परिचित शब्द है; ‘मुखिया’ प्रशासनिक नेतृत्व को स्पष्ट करता है। शर्त के दोनों अंगों को ‘यदि ... और ... तो’ संरचना में रखा गया है।
