base_translation:
  language: en
  yaml_path: translation/ot/judges/011/001.yaml
  text: Jephthah the Gileadite was a mighty warrior[a], and he was the son of a prostitute[c][b]; and Gilead fathered Jephthah.
translation:
  language: hi
  text: गिलादी यिप्तह एक पराक्रमी योद्धा[a] था; वह एक वेश्या का बेटा था, और गिलाद[b] उसका पिता था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप से, “सामर्थ्यवान वीर पुरुष।”
    reason: lexical_alternative
  - marker: b
    text: यहाँ गिलाद यिप्तह के पिता का व्यक्तिगत नाम है, केवल उस क्षेत्र का नाम नहीं।
    reason: cultural_note
lexical_decisions:
- source_word: הַגִּלְעָדִי
  choice: गिलादी
  rationale: यह जातिवाचक/क्षेत्रवाचक विशेषण यिप्तह का गिलाद क्षेत्र से संबंध बताता है; ‘गिलादी’ संक्षिप्त है और इब्रानी रूप को बनाए रखता है।
- source_word: גִּבּוֹר חַיִל
  choice: एक पराक्रमी योद्धा
  rationale: इस प्रसंग में पदबंध सामर्थ्य, वीरता और युद्ध-कौशल व्यक्त करता है; यह आधुनिक हिन्दी में स्वाभाविक और गरिमापूर्ण है।
- source_word: בֶּן אִשָּׁה זוֹנָה
  choice: एक वेश्या का बेटा
  rationale: זוֹנָה का सीधा अर्थ ‘वेश्या’ है; यह न तो अर्थ को शिष्टोक्ति में छिपाता है, न अनावश्यक रूप से पुरातन भाषा अपनाता है।
- source_word: וַיּוֹלֶד
  choice: जन्म दिया था
  rationale: हिफ़ील रूप यहाँ पुरुष कर्ता के जैविक पितृत्व को व्यक्त करता है। हिन्दी में ‘गिलाद ने ... को जन्म दिया’ वंशावली की पारंपरिक और बोधगम्य अभिव्यक्ति है, हालांकि ‘उसका पिता था’ अधिक व्याख्यात्मक विकल्प है।
- source_word: גִּלְעָד
  choice: गिलाद
  rationale: यहाँ क्रिया का कर्ता होने के कारण गिलाद किसी व्यक्ति का नाम है, केवल क्षेत्र का नाम नहीं।
- source_word: וְ
  choice: और / वाक्य-विभाजन
  rationale: आरंभिक וְ को हिन्दी में अलग ‘अब’ जोड़कर नहीं दर्शाया गया; कथानक का संबंध स्वाभाविक वाक्य-प्रवाह से व्यक्त होता है। मध्यवर्ती וְ को वाक्य-विभाजन तथा ‘और’ से दर्शाया गया है।
