review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders Jephthah’s Gileadite affiliation, his status as a mighty warrior, and his being the son of a prostitute. However, “गिलाद ने यिप्तह को जन्म दिया था” is not idiomatic for a male father in modern Hindi and can suggest that Gilead physically gave birth. Rendering Gilead as Jephthah’s father conveys the Hebrew Hiphil’s paternal sense without that ambiguity.
  naturalness: “गिलादी यिप्तह,” “पराक्रमी योद्धा,” and “वेश्या का बेटा” are clear, natural modern Hindi. The revised final clause is substantially more natural and avoids an awkward male subject with “जन्म दिया.”
  terminology: The names “यिप्तह” and “गिलाद” are consistent with the draft’s Hebrew-oriented transliteration. “पराक्रमी योद्धा” appropriately represents גִּבּוֹר חַיִל in context. “वेश्या” is a direct, contemporary rendering of זוֹנָה. The note correctly distinguishes Gilead the person from the region.
  issues:
  - severity: medium
    issue: The clause “गिलाद ने यिप्तह को जन्म दिया था” is potentially misleading and unnatural with a male subject.
    rationale: Although it seeks to translate the causative paternal verb וַיּוֹלֶד, modern Hindi normally associates “जन्म देना” with the mother. “गिलाद यिप्तह का पिता था” naturally preserves the intended biological-paternal relationship.
  revised_text: गिलादी यिप्तह एक पराक्रमी योद्धा[a] था; वह एक वेश्या का बेटा था, और गिलाद[b] उसका पिता था।
