translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण कथात्मक शैली। नामों के रूप ‘यिप्तह’ और ‘गिलाद’ मूल इब्रानी उच्चारण के निकट रखे गए हैं। ‘बेटा’ सामान्य आधुनिक हिन्दी के लिए चुना गया है; ‘पुत्र’ अधिक औपचारिक विकल्प होता।
