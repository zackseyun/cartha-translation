  text: וַ/יְהִ֞י מִ/קֵּ֣ץ שְׁנַ֣יִם חֳדָשִׁ֗ים וַ/תָּ֨שָׁב֙ אֶל אָבִ֔י/הָ וַ/יַּ֣עַשׂ לָ֔/הּ אֶת נִדְר֖/וֹ אֲשֶׁ֣ר נָדָ֑ר וְ/הִיא֙ לֹא יָדְעָ֣ה אִ֔ישׁ וַ/תְּהִי חֹ֖ק בְּ/יִשְׂרָאֵֽל׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/039.yaml
  text: 'And at the end of two months she returned to her father[a], and he did to her according to his vow that he had vowed. Now she had not known a man[b]. And it became a statute in Israel:'
translation:
  language: hi
  text: 'दो महीने पूरे होने पर वह अपने पिता के पास लौट आई, और उसके पिता ने उसके साथ वैसा ही किया जैसा उसने मन्नत मानी थी[a]। उसने किसी पुरुष के साथ यौन सम्बन्ध नहीं रखे थे[b]। और यह इस्राएल में एक प्रथा बन गई:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात उसके पिता ने उसके साथ अपनी मानी हुई मन्नत के अनुसार किया। व्याख्याकारों में मतभेद है कि यिप्तह ने उसे होमबलि के रूप में चढ़ाया या आजीवन कौमार्य के लिए समर्पित किया; यहाँ हिब्रू शब्दावली स्वयं इस प्रश्न का स्पष्ट निर्णय नहीं करती।
    reason: alternative_reading
  - marker: b
    text: हिब्रू में शाब्दिक रूप से, “उसने किसी पुरुष को नहीं जाना था”; यह किसी पुरुष के साथ यौन सम्बन्ध न होने का मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקֵּץ שְׁנַיִם חֳדָשִׁים
  choice: दो महीने पूरे होने पर
  rationale: यह अभिव्यक्ति निर्धारित अवधि की समाप्ति को दर्शाती है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: וַתָּשָׁב אֶל אָבִיהָ
  choice: वह अपने पिता के पास लौट आई
  rationale: שׁוּב का सीधा अर्थ ‘लौटना’ है; ‘पिता के पास’ सम्बन्धसूचक गन्तव्य को स्पष्ट रखता है।
- source_word: וַיַּעַשׂ לָהּ אֶת נִדְרוֹ אֲשֶׁר נָדָר
  choice: उसने उसके साथ अपनी मानी हुई मन्नत के अनुसार किया
  rationale: यह हिन्दी अनुवाद עשה לָהּ की कठोर प्रत्यक्षता और נדר की पुनरुक्ति का भाव बनाए रखता है तथा मन्नत पूरी करने के स्वरूप को अनिर्णीत छोड़ता है।
- source_word: וְהִיא לֹא יָדְעָה אִישׁ
  choice: उसने किसी पुरुष के साथ शारीरिक सम्बन्ध नहीं बनाए थे
  rationale: यह हिब्रू मुहावरे का अर्थ साधारण आधुनिक हिन्दी में स्पष्ट करता है; ‘कुँवारी थी’ कहने की अपेक्षा क्रियात्मक कथन को बनाए रखता है।
- source_word: חֹק
  choice: प्रथा
  rationale: अगले पद में वर्णित वार्षिक सामुदायिक आचरण के सन्दर्भ में यहाँ स्थापित प्रथा का अर्थ अधिक उपयुक्त है, न कि अनिवार्यतः औपचारिक विधि का।
- source_word: וַתְּהִי חֹק בְּיִשְׂרָאֵל
  choice: यह इस्राएल में एक प्रथा बन गई
  rationale: וַתְּהִי किसी प्रचलन के आरम्भ को बताता है; ‘प्रथा बन गई’ इस कथात्मक विकास को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: यिप्तह द्वारा मन्नत पूरी करने का स्वरूप
  choice: मुख्य पाठ यह नहीं बताता कि उसने ठीक किस प्रकार अपनी मन्नत पूरी की; हिब्रू की प्रत्यक्षता और अस्पष्टता सुरक्षित रखी गई है।
  alternative: उसने अपनी बेटी को होमबलि चढ़ाया; अथवा उसे जीवन भर के कुँवारेपन/समर्पित सेवा के लिए अर्पित किया।
  rationale: हिब्रू केवल कहता है कि उसने ‘उसके साथ अपनी मन्नत के अनुसार किया’ और फिर उसके किसी पुरुष से सम्बन्ध न होने का उल्लेख करता है। इसलिए किसी एक विवादित व्याख्या को मुख्य पाठ में निश्चित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘मानी हुई मन्नत’ स्रोत की पुनरुक्ति का भाव देती है। ‘प्रथा’ अगले पद के वार्षिक आचरण के सन्दर्भ से मेल खाती है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में दिए गए हैं।
