base_translation:
  language: en
  yaml_path: translation/ot/judges/011/015.yaml
  text: 'And he said to him[a], “Thus says Jephthah: Israel did not take the land of Moab or the land of the sons of Ammon.”'
translation:
  language: hi
  text: 'और उसने उससे कहा, “यिप्तह यों कहता है: इस्राएल ने न तो मोआब की भूमि ली और न अम्मोनियों की भूमि[a]।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “अम्मोन के पुत्रों की भूमि।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר לוֹ
  choice: और उसने उससे कहा
  rationale: वाव-क्रमिक रूप अगले कथन को कथा-क्रम में प्रस्तुत करता है; यह हिन्दी में स्वाभाविक और मूल के निकट है।
- source_word: כֹּה אָמַר יִפְתָּח
  choice: यिप्तह यह कहता है
  rationale: दूत-संदेश के औपचारिक सूत्र को आधुनिक हिन्दी में स्पष्ट और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: לֹא לָקַח
  choice: न तो ... ली
  rationale: לקח का सामान्य अर्थ ‘लेना’ है; यहाँ अनावश्यक रूप से ‘छीनना’ या ‘कब्ज़ा करना’ जैसा अधिक तीखा भाव नहीं जोड़ा गया।
- source_word: אֶרֶץ
  choice: भूमि
  rationale: भौगोलिक और राजनीतिक दोनों अर्थों के लिए उपयुक्त है और हिब्रू की पुनरावृत्ति बनाए रखता है।
- source_word: מוֹאָב
  choice: मोआब
  rationale: नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: בְּנֵי עַמּוֹן
  choice: अम्मोनी
  rationale: यह हिब्रू में शाब्दिक रूप से ‘अम्मोन के पुत्र’ है, पर एक जातिनाम के रूप में आधुनिक हिन्दी में ‘अम्मोनी’ अधिक स्वाभाविक और अर्थ-सटीक है; शाब्दिक रूप पादटिप्पणी में दिया गया है।
