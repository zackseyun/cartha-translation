source:
  edition: WLC
  text: וַ/יַּעֲבֹ֥ר יִפְתָּ֛ח אֶל בְּנֵ֥י עַמּ֖וֹן לְ/הִלָּ֣חֶם בָּ֑/ם וַ/יִתְּנֵ֥/ם יְהוָ֖ה בְּ/יָדֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/032.yaml
  text: So Jephthah crossed over to the Ammonites to fight against them[a], and Yahweh gave them into his hand.
translation:
  language: hi
  text: तब यिप्तह अम्मोनियों से लड़ने के लिए उनके पास गया[a], और याहवे ने उन्हें उसके हाथ में दे दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप से: “अम्मोन के पुत्रों की ओर पार गया।” अर्थात यिप्तह अम्मोनियों से युद्ध करने के लिए उनके विरुद्ध गया।'
    reason: ‘पार गया’ के शाब्दिक गमनार्थ तथा ‘अम्मोन के पुत्रों’ के जातिसूचक अर्थ को स्पष्ट करता है।
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: उनकी ओर बढ़ा
  rationale: עבר का मूल अर्थ पार जाना या आगे जाना है; यहाँ युद्ध के प्रसंग में यह यिप्तह की अम्मोनियों की ओर सैन्य गति को स्वाभाविक हिन्दी में व्यक्त करता है, बिना क्रिया में ही विजय या आक्रमण का अतिरिक्त भाव जोड़ने के।
- source_word: אֶל בְּנֵי עַמּוֹן
  choice: अम्मोनियों से लड़ने के लिए उनकी ओर
  rationale: אֶל दिशा को व्यक्त करता है और בְּנֵי עַמּוֹן जातिसूचक मुहावरा है। हिन्दी में ‘अम्मोनियों’ स्पष्ट और स्वाभाविक है; ‘उनकी ओर’ पूर्वसर्ग के दिशात्मक अर्थ को बनाए रखता है।
- source_word: לְהִלָּחֶם בָּם
  choice: उनसे लड़ने के लिए
  rationale: לחם का निफ़अल रूप ב के साथ किसी के विरुद्ध युद्ध करने का अर्थ देता है। ‘लड़ने के लिए’ सहज, गरिमापूर्ण और स्रोत के अनुपात में है।
- source_word: וַיִּתְּנֵם ... בְּיָדוֹ
  choice: उन्हें उसके हाथ में कर दिया
  rationale: נתן और ‘हाथ में’ का संयोजन युद्ध में शत्रु को किसी के वश में देने का इब्रानी मुहावरा है। हिन्दी में यह स्रोत की छवि और विजय का अर्थ दोनों बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी बाइबल परंपरा में प्रचलित देवनागरी रूप ‘यहोवा’ परमेश्वर के व्यक्तिगत नाम को शीर्षक से प्रतिस्थापित किए बिना प्रस्तुत करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में चतुरक्षरीय व्यक्तिगत नाम सीधे आया है। ‘यहोवा’ आधुनिक हिन्दी पाठकों के लिए व्यापक रूप से पहचाना जाने वाला नामरूप है; इसे ‘प्रभु’ जैसे पद से बदलने पर मूल का व्यक्तिगत नाम लुप्त हो जाता।
- issue: विजय में यहोवा की भूमिका
  choice: यहोवा ने उन्हें उसके हाथ में कर दिया
  alternative: यहोवा ने उसे उन पर विजय दी
  rationale: चुना हुआ रूप मूल के ‘देना’ और ‘हाथ’ वाले मुहावरे को सुरक्षित रखता है तथा पाठ में कही गई ईश्वरीय क्रिया को न घटाता है, न उसके आगे कोई नैतिक या सिद्धान्तगत निष्कर्ष जोड़ता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘अम्मोन के पुत्र’ के स्थान पर जातिसूचक ‘अम्मोनी’ और सैन्य प्रसंग में स्वाभाविक ‘उनकी ओर बढ़ा’ प्रयुक्त हुआ है; ‘उसके हाथ में’ स्रोत की बाइबलीय छवि को बनाए रखता है।
