  text: וַ֠/יִּתֵּן יְהוָ֨ה אֱלֹהֵֽי יִשְׂרָאֵ֜ל אֶת סִיח֧וֹן וְ/אֶת כָּל עַמּ֛/וֹ בְּ/יַ֥ד יִשְׂרָאֵ֖ל וַ/יַּכּ֑וּ/ם וַ/יִּירַשׁ֙ יִשְׂרָאֵ֔ל אֵ֚ת כָּל אֶ֣רֶץ הָ/אֱמֹרִ֔י יוֹשֵׁ֖ב הָ/אָ֥רֶץ הַ/הִֽיא־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/021.yaml
  text: And Yahweh[a], the God of Israel, gave Sihon and all his people into the hand of Israel, and they struck them down. So Israel took possession of all the land of the Amorites who lived in that land.
translation:
  language: hi
  text: तब इस्राएल के परमेश्वर याहवे ने सीहोन और उसकी सारी प्रजा को इस्राएल के हाथ में कर दिया[a], और इस्राएलियों ने उन्हें मार गिराया। इस प्रकार इस्राएल ने उस देश में रहनेवाले एमोरियों के सारे भूभाग पर अधिकार कर लिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘इस्राएल के हाथ में दे दिया’; यह किसी के वश या अधिकार में कर देने का इब्रानी मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן ... בְּיַד יִשְׂרָאֵל
  choice: इस्राएल के हाथ में कर दिया
  rationale: यह इब्रानी युद्ध-वर्णन का मुहावरा है, जिसका अर्थ किसी को दूसरे के वश या अधिकार में कर देना है। अनुवाद में ‘हाथ’ की मूल छवि रखी गई है और अर्थ पादटिप्पणी में स्पष्ट किया गया है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम YHWH का प्रचलित हिन्दी लिप्यंतरण, ताकि मूल पाठ में प्रयुक्त नाम किसी उपाधि से न बदले।
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: इस्राएल के परमेश्वर
  rationale: मूल की संबंधवाचक संरचना का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: סִיחוֹן
  choice: सीहोन
  rationale: व्यक्तिवाचक नाम का मानक हिन्दी लिप्यंतरण।
- source_word: כָּל עַמּוֹ
  choice: उसकी सारी प्रजा
  rationale: עַם का मूल अर्थ ‘लोग/प्रजा’ है। राजा सीहोन के संदर्भ में ‘प्रजा’ स्वाभाविक है और इसे केवल सेना तक सीमित नहीं करती।
- source_word: וַיַּכּוּם
  choice: इस्राएलियों ने उन्हें मार गिराया
  rationale: נכה युद्ध के प्रसंग में प्रहार करके परास्त या मार गिराने का भाव देता है। स्पष्टता के लिए इब्रानी में निहित बहुवचन कर्ता को ‘इस्राएलियों’ के रूप में व्यक्त किया गया है।
- source_word: וַיִּירַשׁ
  choice: अधिकार कर लिया
  rationale: ירש यहाँ विजय के बाद भूमि पर कब्ज़ा और स्वामित्व स्थापित करने को दर्शाता है; ‘अधिकार कर लिया’ आधुनिक हिन्दी में इस परिणाम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: כָּל אֶרֶץ הָאֱמֹרִי
  choice: एमोरियों के सारे भूभाग
  rationale: मूल में ‘एमोरी’ सामूहिक एकवचन है; हिन्दी में जातिसमूह के लिए बहुवचन ‘एमोरियों’ अधिक स्वाभाविक है। ‘भूभाग’ क्षेत्रीय भूमि के अर्थ को स्पष्ट करता है।
- source_word: יוֹשֵׁב הָאָרֶץ הַהִיא
  choice: उस देश में रहनेवाले
  rationale: सक्रिय कृदंत का स्वाभाविक हिन्दी रूप, जो एमोरियों को उस देश के निवासी बताता है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पद में चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम सीधे आया है। ‘याहवे’ उसे उपाधि से बदलने के बजाय नाम के रूप में सुरक्षित रखता है।
- issue: विजय में परमेश्वर और इस्राएल की भूमिका
  choice: याहवे ने उन्हें इस्राएल के हाथ में किया, और इस्राएलियों ने उन्हें मार गिराया
  alternative: याहवे ने इस्राएल को विजय दी
  rationale: मूल पाठ ईश्वरीय सौंपे जाने और इस्राएल की सैन्य कार्रवाई—दोनों को साथ रखता है। संक्षिप्त व्याख्यात्मक रूप इस दोहरी अभिव्यक्ति को मिटा देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘प्रजा’ राजा के अधीन लोगों को दर्शाती है, जबकि ‘भूभाग’ विजय के बाद अधिकार में आए क्षेत्र को स्पष्ट करता है।
