source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יִפְתָּח֙ לְ/זִקְנֵ֣י גִלְעָ֔ד הֲ/לֹ֤א אַתֶּם֙ שְׂנֵאתֶ֣ם אוֹתִ֔/י וַ/תְּגָרְשׁ֖וּ/נִי מִ/בֵּ֣ית אָבִ֑/י וּ/מַדּ֜וּעַ בָּאתֶ֤ם אֵלַ/י֙ עַ֔תָּה כַּ/אֲשֶׁ֖ר צַ֥ר לָ/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/007.yaml
  text: Jephthah said to the elders of Gilead[a], “Did you not hate me and drive me out from my father’s house? So why have you come to me now, when you are in distress?”
translation:
  language: hi
  text: यिप्तह ने गिलाद के बुज़ुर्गों से कहा, “क्या तुम लोगों ने मुझसे घृणा करके मुझे मेरे पिता के घर से निकाल नहीं दिया था? तो फिर अब, जब तुम संकट में हो,[a] तुम मेरे पास क्यों आए हो?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “जब तुम मुसीबत में हो।” इब्रानी वाक्यांश का अर्थ तंगी या संकट में होना है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: ने ... कहा
  rationale: इब्रानी कथात्मक शैली में אמר का यह सामान्य प्रयोग है; आधुनिक हिन्दी में ‘ने ... कहा’ स्वाभाविक है।
- source_word: זִקְנֵי גִלְעָד
  choice: गिलाद के पुरनियों
  rationale: बहुवचन construct यहाँ समुदाय के मान्य अगुओं की संस्था को सूचित करता है; ‘पुरनियों’ बाइबलीय सामाजिक-पद को बनाए रखता है, केवल वृद्ध पुरुषों को नहीं।
- source_word: הֲלֹא
  choice: क्या ... नहीं
  rationale: यह सहमति की अपेक्षा करने वाला आलंकारिक प्रश्न है, जिसे हिन्दी में ‘क्या ... नहीं’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: שְׂנֵאתֶם אֹתִי
  choice: तुम लोगों ने मुझसे घृणा करके
  rationale: שׂנא का सीधा अर्थ घृणा करना है; ‘मुझसे घृणा’ संबंधगत वैर को बिना नरम किए व्यक्त करता है। कृदंत ‘करके’ अगले निष्कासन को उसी कर्ता और प्रसंग से सहजता से जोड़ता है।
- source_word: וַתְּגָרְשׁוּנִי
  choice: मुझे ... निकाल नहीं दिया था
  rationale: גרשׁ बलपूर्वक निष्कासन का बोध देता है; ‘निकाल दिया’ आधुनिक हिन्दी में स्वाभाविक है और ‘भेज दिया’ से अधिक प्रबल है।
- source_word: מִבֵּית אָבִי
  choice: मेरे पिता के घर से
  rationale: यह मूल रूपक और पारिवारिक-कानूनी परिवेश को बनाए रखता है, यद्यपि ‘घराना’ भी संभव है।
- source_word: וּמַדּוּעַ
  choice: फिर ... क्यों
  rationale: संयोजक पिछले आरोप से निष्कर्षात्मक प्रश्न जोड़ता है; ‘फिर ... क्यों’ हिन्दी में उस तर्कगत संबंध को स्पष्ट करता है।
- source_word: בָּאתֶם אֵלַי עַתָּה
  choice: अब ... मेरे पास क्यों आए हो
  rationale: ‘अब’ עַתָּה के समयगत बल को रखता है और पूर्ण क्रिया को प्रत्यक्ष संवाद में स्वाभाविक हिन्दी वर्तमान-पूर्ण अर्थ वाले ‘आए हो’ से व्यक्त किया गया है।
- source_word: כַּאֲשֶׁר צַר לָכֶם
  choice: जब तुम संकट में हो
  rationale: צַר לָכֶם तंगी, विपत्ति या संकट में होने को सूचित करता है; ‘संकट में हो’ संक्षिप्त और सहज है तथा कारण को आवश्यकता से अधिक विशिष्ट नहीं करता।
