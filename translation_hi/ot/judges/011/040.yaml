  text: מִ/יָּמִ֣ים יָמִ֗ימָ/ה תֵּלַ֨כְנָה֙ בְּנ֣וֹת יִשְׂרָאֵ֔ל לְ/תַנּ֕וֹת לְ/בַת יִפְתָּ֖ח הַ/גִּלְעָדִ֑י אַרְבַּ֥עַת יָמִ֖ים בַּ/שָּׁנָֽה׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/040.yaml
  text: From year to year the daughters of Israel would go to commemorate the daughter of Jephthah the Gileadite four days in the year[a].
translation:
  language: hi
  text: प्रतिवर्ष इस्राएल की बेटियाँ गिलादी यिप्तह की बेटी का स्मरण करने[a] जाती थीं—वर्ष में चार दिन।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “विलाप करने” अथवा “यिप्तह की बेटी के विषय में वर्णन करने।” यहाँ प्रयुक्त इब्रानी क्रिया दुर्लभ है और उसके अर्थ पर मतभेद है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מִיָּמִים יָמִימָה
  choice: प्रतिवर्ष
  rationale: यह इब्रानी मुहावरा नियमित वार्षिक पुनरावृत्ति बताता है; ‘प्रतिवर्ष’ आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: תֵּלַכְנָה
  choice: जाती थीं
  rationale: यहाँ अपूर्ण क्रिया भूतकाल की नियमित प्रथा व्यक्त करती है; हिन्दी का ‘जाती थीं’ उसी अभ्यस्त क्रिया को सहज रूप से प्रकट करता है।
- source_word: בְּנוֹת יִשְׂרָאֵל
  choice: इस्राएल की बेटियाँ
  rationale: यह मूल अभिव्यक्ति के निकट है और आयु या वैवाहिक स्थिति के बारे में अनावश्यक निष्कर्ष नहीं जोड़ती।
- source_word: לְתַנּוֹת
  choice: स्मरण करने
  rationale: यह दुर्लभ और विवादित क्रिया इस प्रसंग में किसी के विषय में वार्षिक स्मारक-पालन या वर्णन का संकेत दे सकती है। ‘स्मरण करने’ मुख्य पाठ में व्यापक अर्थ रखता है; ‘विलाप करने’ और ‘वर्णन करने’ की संभावनाएँ पादटिप्पणी में सुरक्षित हैं।
- source_word: לְבַת יִפְתָּח
  choice: यिप्तह की बेटी का
  rationale: यह संबंध और क्रिया के लक्ष्य को सीधे व्यक्त करता है; ‘यिप्तह’ नाम का स्रोत-निकट देवनागरी रूप है।
- source_word: הַגִּלְעָדִי
  choice: गिलादी
  rationale: यह जातिवाचक विशेषण यिप्तह को गिलाद से संबंधित व्यक्ति के रूप में स्वाभाविक हिन्दी में पहचानता है।
- source_word: אַרְבַּעַת יָמִים בַּשָּׁנָה
  choice: वर्ष में चार दिन
  rationale: यह वार्षिक पालन की अवधि को मूल के निकट और स्पष्ट हिन्दी में बताता है।
theological_decisions:
- issue: यिप्तह की बेटी के लिए वार्षिक पालन का स्वरूप
  choice: मुख्य पाठ में ‘स्मरण करने’
  alternative: ‘विलाप करने’ अथवा ‘उसके विषय में वर्णन करने’
  rationale: इब्रानी क्रिया दुर्लभ है और इसका अर्थ विवादित है। प्रसंग यिप्तह की मन्नत और उसकी बेटी के परिणाम से जुड़ा है, इसलिए किसी एक व्याख्या को निर्णायक बनाने के बजाय मुख्य पाठ में व्यापक ‘स्मरण’ रखा गया है और अन्य संभावनाएँ पादटिप्पणी में दी गई हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज वाक्य-विन्यास रखा गया है। ‘इस्राएल की बेटियाँ’ मूल की सांस्कृतिक अभिव्यक्ति को बनाए रखता है, जबकि डैश अंतिम कालावधि को स्पष्ट करता है।
