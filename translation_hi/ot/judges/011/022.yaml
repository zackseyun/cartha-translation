base_translation:
  language: en
  yaml_path: translation/ot/judges/011/022.yaml
  text: So they took possession of all the territory of the Amorites[a], from the Arnon as far as the Jabbok[c][b], and from the wilderness as far as the Jordan.
translation:
  language: hi
  text: इस प्रकार उन्होंने एमोरियों के पूरे क्षेत्र पर अधिकार कर लिया—अर्नोन से यब्बोक तक, और निर्जन प्रदेश से यरदन तक।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּירְשׁוּ
  choice: उन्होंने ... पर अधिकार कर लिया
  rationale: विजय और भूभाग के संदर्भ में ירשׁ यहाँ सक्रिय रूप से किसी क्षेत्र को अपने अधिकार में लेने का भाव देता है; यह हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: כָּל גְּבוּל
  choice: पूरे क्षेत्र
  rationale: כָּל की समग्रता और גְּבוּל के यहाँ सीमाओं के भीतर के भूभाग वाले अर्थ, दोनों को संक्षेप में व्यक्त करता है।
- source_word: הָאֱמֹרִי
  choice: एमोरियों के
  rationale: इब्रानी का एकवचन जातिवाचक है; आधुनिक हिन्दी में इस जनसमूह के लिए बहुवचन स्वाभाविक है।
- source_word: מֵאַרְנוֹן וְעַד הַיַּבֹּק
  choice: अर्नोन से यब्बोक तक
  rationale: पहली सीमा-जोड़ी को हिन्दी की स्वाभाविक 'से ... तक' संरचना में रखा गया है।
- source_word: וּמִן הַמִּדְבָּר
  choice: निर्जन प्रदेश से
  rationale: מִדְבָּר आवश्यक रूप से रेतीला मरुस्थल नहीं है; 'निर्जन प्रदेश' व्यापक भौगोलिक अर्थ को सुरक्षित रखता है।
- source_word: וְעַד הַיַּרְדֵּן
  choice: यरदन तक
  rationale: दूसरी सीमा-जोड़ी को संक्षिप्त और स्वाभाविक रूप में पूरा करता है; संदर्भ में यरदन नदी अभिप्रेत है।
