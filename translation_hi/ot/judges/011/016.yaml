source:
  edition: WLC
  text: כִּ֖י בַּ/עֲלוֹתָ֣/ם מִ/מִּצְרָ֑יִם וַ/יֵּ֨לֶךְ יִשְׂרָאֵ֤ל בַּ/מִּדְבָּר֙ עַד יַם ס֔וּף וַ/יָּבֹ֖א קָדֵֽשָׁ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/016.yaml
  text: For when they came up from Egypt[a], Israel went through the wilderness as far as the Red Sea and came to Kadesh.
translation:
  language: hi
  text: क्योंकि जब वे मिस्र से निकले, तब इस्राएल निर्जन प्रदेश से होकर लाल सागर[a] तक गया और कादेश पहुँचा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सरकंडों का सागर।”
    reason: יַם־סוּף का अधिक शाब्दिक अर्थ सम्भवतः ‘सरकंडों का सागर’ है, जबकि ‘लाल सागर’ पारंपरिक और प्रचलित अनुवाद है।
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह शब्द यिप्तह के ऐतिहासिक स्पष्टीकरण में पिछले कथन का कारण या आधार प्रस्तुत करता है; हिन्दी में ‘क्योंकि’ इस संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: בַּעֲלוֹתָם מִמִּצְרַיִם
  choice: जब वे मिस्र से निकले
  rationale: ב के साथ infinitive construct और बहुवचन प्रत्यय समयसूचक अर्थ देता है। עלה का शाब्दिक भाव ‘ऊपर आना’ है, पर निर्गमन के प्रसंग में आधुनिक हिन्दी का स्वाभाविक और स्पष्ट प्रयोग ‘मिस्र से निकलना’ है।
- source_word: וַיֵּלֶךְ יִשְׂרָאֵל בַּמִּדְבָּר
  choice: इस्राएल निर्जन प्रदेश से होकर ... गया
  rationale: הלך गति को और מִדְבָּר आबादी से दूर सूखे/वन्य क्षेत्र को दर्शाता है। ‘निर्जन प्रदेश से होकर गया’ मार्ग और गति दोनों को सहज हिन्दी में व्यक्त करता है; सामूहिक नाम ‘इस्राएल’ के साथ मूल के अनुसार एकवचन क्रिया रखी गई है।
- source_word: עַד יַם סוּף
  choice: लाल सागर तक
  rationale: עַד सीमा या पहुँच का बोध देता है। יַם־סוּף का परंपरागत और सर्वाधिक पहचाना जाने वाला हिन्दी रूप ‘लाल सागर’ है; अधिक शाब्दिक विकल्प पाद-टिप्पणी में दिया गया है।
- source_word: וַיָּבֹא קָדֵשָׁה
  choice: और कादेश पहुँचा
  rationale: בוא आगमन को बताता है और קָדֵשָׁה का दिशासूचक ה कादेश की ओर गति दर्शाता है। हिन्दी में ‘कादेश पहुँचा’ इसे संक्षिप्त और स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘निर्जन प्रदेश’ मִדְבָּר के अर्थ को प्राकृतिक हिन्दी में व्यक्त करता है। पद की कारणसूचक और समयसूचक संरचना दोनों सुरक्षित हैं।
