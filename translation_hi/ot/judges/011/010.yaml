source:
  edition: WLC
  text: וַ/יֹּאמְר֥וּ זִקְנֵֽי גִלְעָ֖ד אֶל יִפְתָּ֑ח יְהוָ֗ה יִהְיֶ֤ה שֹׁמֵ֨עַ֙ בֵּֽינוֹתֵ֔י/נוּ אִם לֹ֥א כִ/דְבָרְ/ךָ֖ כֵּ֥ן נַעֲשֶֽׂה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/010.yaml
  text: Then the elders of Gilead said to Jephthah[a], “Yahweh will be witness between us if we do not do according to your word.”
translation:
  language: hi
  text: तब गिलाद के बुज़ुर्गों ने यिप्तह से कहा, “यदि हम तुम्हारी बात के अनुसार वैसा न करें, तो याहवे हमारे बीच साक्षी[a] होगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक अनुवाद: “याहवे हमारे बीच सुनने वाला होगा”—अर्थात वह दोनों पक्षों के बीच साक्षी या न्याय करने वाले के रूप में सुनेगा।'
    reason: lexical_alternative
lexical_decisions:
- source_word: זִקְנֵי גִלְעָד
  choice: गिलाद के पुरनियों
  rationale: यह रचनात्मक संबंध गिलाद के मान्य अगुओं को दर्शाता है; ‘पुरनियों’ बाइबलीय संदर्भ में पद और समुदाय के वरिष्ठ अगुओं, दोनों का स्वाभाविक संकेत देता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ में आए परमेश्वर के व्यक्तिगत वाचा-नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण द्वारा रखा गया है।
- source_word: יִהְיֶה שֹׁמֵעַ בֵּינוֹתֵינוּ
  choice: हमारे बीच साक्षी होगा
  rationale: शाब्दिक अर्थ ‘हमारे बीच सुननेवाला होगा’ है, पर शपथ के प्रसंग में सुनना साक्षी या न्यायकारी की भूमिका व्यक्त करता है। मुख्य पाठ में भावार्थ रखा गया है और शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: אִם לֹא
  choice: यदि ... न करें
  rationale: यह शपथ से जुड़ी नकारात्मक शर्त को व्यक्त करता है, इसलिए इसे केवल बलसूचक ‘निश्चय’ के रूप में नहीं लिया गया।
- source_word: כִדְבָרְךָ כֵּן נַעֲשֶׂה
  choice: हम तुम्हारे कहे के अनुसार न करें
  rationale: ‘तुम्हारे वचन के अनुसार वैसा करें’ का आशय आधुनिक हिन्दी में सहज रूप से व्यक्त होता है और यिप्तह द्वारा रखी गई शर्तों की ओर संकेत करता है।
- source_word: וַיֹּאמְרוּ
  choice: तब ... ने कहा
  rationale: कथात्मक क्रम को आधुनिक हिन्दी में स्वाभाविक ढंग से आगे बढ़ाता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: पद में व्यक्तिगत ईश्वरीय नाम स्पष्ट रूप से उपस्थित है; उसे उपाधि से प्रतिस्थापित न करके हिन्दी में व्यापक रूप से पहचाना जाने वाला रूप रखा गया है।
- issue: ‘सुननेवाला’ की न्यायिक भूमिका
  choice: साक्षी
  alternative: सुननेवाला
  rationale: शपथ के इस प्रसंग में परमेश्वर को दोनों पक्षों के बीच सुनने और इस प्रकार साक्षी रहने के लिए पुकारा गया है। ‘साक्षी’ प्रसंगगत आशय देता है, जबकि मूल की वास्तविक शाब्दिक छवि पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक है। ‘पुरनियों’ तथा ‘साक्षी’ जैसे परिचित बाइबलीय शब्द साधारण पाठक के लिए बोधगम्य हैं; वाक्य-विन्यास हिन्दी की स्वाभाविक शर्तीय रचना के अनुसार रखा गया है।
