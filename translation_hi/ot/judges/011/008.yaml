  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּאמְרוּ֩ זִקְנֵ֨י גִלְעָ֜ד אֶל יִפְתָּ֗ח לָ/כֵן֙ עַתָּה֙ שַׁ֣בְנוּ אֵלֶ֔י/ךָ וְ/הָלַכְתָּ֣ עִמָּ֔/נוּ וְ/נִלְחַמְתָּ֖ בִּ/בְנֵ֣י עַמּ֑וֹן וְ/הָיִ֤יתָ לָּ֨/נוּ֙ לְ/רֹ֔אשׁ לְ/כֹ֖ל יֹשְׁבֵ֥י גִלְעָֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/008.yaml
  text: And the elders of Gilead said to Jephthah[a], “That is why we have now come back to you, so that you may go with us and fight against the Ammonites[b], and you will be head over all the inhabitants of Gilead.”
translation:
  language: hi
  text: गिलाद के बुज़ुर्गों ने यिप्तह से कहा, “इसीलिए अब हम तुम्हारे पास लौटकर आए हैं[a], ताकि तुम हमारे साथ चलो और अम्मोनियों[b] से युद्ध करो, और तुम हमारे—अर्थात् गिलाद के सभी निवासियों के—प्रधान होगे।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हम तुम्हारे पास लौट आए हैं।”
    reason: शाब्दिक विकल्प; मुख्य पाठ का ‘लौटकर आए हैं’ उसी इब्रानी क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है।
  - marker: b
    text: इब्रानी में “अम्मोन के पुत्र,” अर्थात् अम्मोनी।
    reason: मूल इब्रानी जातिनाम की शाब्दिक संरचना बताने के लिए।
lexical_decisions:
- source_word: זִקְנֵי גִלְעָד
  choice: गिलाद के पुरनियों
  rationale: यह समुदाय के मान्य वरिष्ठ अगुओं के सामाजिक-राजनीतिक पद को व्यक्त करता है; ‘पुरनियों’ बाइबलीय संदर्भ में स्वाभाविक और पद-सूचक है।
- source_word: לָכֵן עַתָּה
  choice: इसीलिए अब
  rationale: यह पिछले पद में यिप्तह की आपत्ति के उत्तर का निष्कर्ष और वर्तमान आग्रह की तात्कालिकता—दोनों बनाए रखता है।
- source_word: שַׁבְנוּ אֵלֶיךָ
  choice: हम तुम्हारे पास लौटकर आए हैं
  rationale: שׁוּב का मूल भाव ‘लौटना’ है; यहाँ पहले हुए तिरस्कार के बाद फिर यिप्तह के पास आने का संबंधपरक भाव है।
- source_word: וְהָלַכְתָּ עִמָּנוּ
  choice: तुम हमारे साथ चलो
  rationale: הלך के ‘जाना/चलना’ भाव को प्रत्यक्ष निवेदन में स्वाभाविक हिन्दी के साथ रखा गया है।
- source_word: וְנִלְחַמְתָּ בִּבְנֵי עַמּוֹן
  choice: अम्मोनियों से युद्ध करो
  rationale: ‘अम्मोन के पुत्र’ इब्रानी जातिनाम है; हिन्दी में ‘अम्मोनी’ वही अर्थ स्पष्ट और स्वाभाविक रूप से देता है।
- source_word: וְהָיִיתָ לָּנוּ לְרֹאשׁ
  choice: तुम ... प्रधान होगे
  rationale: רֹאשׁ का नेतृत्व और अधिकार का रूपक ‘प्रधान’ से व्यक्त होता है, जबकि वाक्य का भावी प्रतिज्ञात्मक स्वर बना रहता है।
- source_word: לְכֹל יֹשְׁבֵי גִלְעָד
  choice: गिलाद के सभी निवासियों के
  rationale: यह गिलाद में रहने वाले समस्त लोगों पर नेतृत्व के व्यापक दायरे को स्पष्ट करता है।
theological_decisions:
- issue: यिप्तह को दिए जाने वाले अधिकार का दायरा
  choice: गिलाद के सभी निवासियों पर व्यापक नागरिक-सैन्य प्रधानता
  alternative: केवल युद्ध की अवधि के लिए अस्थायी सैन्य नेतृत्व
  rationale: ‘गिलाद के सभी निवासियों के प्रधान’ युद्ध करने के अनुरोध से आगे बढ़कर पूरी आबादी पर नेतृत्व का संकेत देता है; फिर भी अनुवाद बाद की किसी विशिष्ट शासन-व्यवस्था को आरोपित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘पुरनियों’ और ‘प्रधान’ से ऐतिहासिक सामाजिक पद तथा व्यापक नेतृत्व सुरक्षित रहते हैं; वाक्य की कारण–उद्देश्य–प्रतिज्ञा संरचना भी बनी रहती है।
