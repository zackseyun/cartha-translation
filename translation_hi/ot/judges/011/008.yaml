  terminology: ‘यिप्तह,’ ‘गिलाद,’ and ‘अम्मोनियों’ are suitable established Hindi biblical forms. ‘प्रधान’ appropriately renders the leadership metaphor רֹאשׁ without imposing a later governmental title.
