  text: וְ/לֹ֣א שָׁמַ֔ע מֶ֖לֶךְ בְּנֵ֣י עַמּ֑וֹן אֶל דִּבְרֵ֣י יִפְתָּ֔ח אֲשֶׁ֥ר שָׁלַ֖ח אֵלָֽי/ו־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/028.yaml
  text: But the king of the Ammonites did not listen to the words of Jephthah that he sent to him.
translation:
  language: hi
  text: लेकिन अम्मोनियों के राजा ने यिप्तह की उन बातों पर ध्यान नहीं दिया जो यिप्तह ने उसे भेजी थीं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלֹא שָׁמַע
  choice: लेकिन ... ध्यान नहीं दिया
  rationale: שׁמע यहाँ केवल सुनने नहीं, संदेश को मानने या उस पर ध्यान देने का भाव रखता है; प्रसंग में राजा द्वारा यिप्तह की दलील अस्वीकार करना अभिप्रेत है।
- source_word: דִּבְרֵי יִפְתָּח
  choice: यिप्तह की उन बातों
  rationale: रचनात्मक संबंध को स्पष्ट और स्वाभाविक हिन्दी में रखा गया है; 'उन' अगले संबंधवाचक उपवाक्य से बातों को जोड़ता है।
- source_word: אֲשֶׁר שָׁלַח אֵלָיו
  choice: जो उसने उसके पास कहला भेजी थीं
  rationale: शाब्दिक रूप से यिप्तह ने 'बातें भेजीं'; हिन्दी में संदेशवाहकों के द्वारा वचन भेजने के लिए 'कहला भेजना' स्वाभाविक है। सर्वनामों की मूल अस्पष्टता बनी रहती है, यद्यपि प्रसंग से कर्ता यिप्तह और प्राप्तकर्ता राजा है।
