  edition: WLC
  text: וַ/תֵּ֧לֶד אֵֽשֶׁת גִּלְעָ֛ד ל֖/וֹ בָּנִ֑ים וַ/יִּגְדְּל֨וּ בְֽנֵי הָ/אִשָּׁ֜ה וַ/יְגָרְשׁ֣וּ אֶת יִפְתָּ֗ח וַ/יֹּ֤אמְרוּ ל/וֹ֙ לֹֽא תִנְחַ֣ל בְּ/בֵית אָבִ֔י/נוּ כִּ֛י בֶּן אִשָּׁ֥ה אַחֶ֖רֶת אָֽתָּה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/002.yaml
  text: And Gilead’s wife bore him sons. When the sons of the wife grew up, they drove Jephthah out and said to him, “You will not have an inheritance in our father’s house, for you are the son of another woman.”
translation:
  language: hi
  text: और गिलाद की पत्नी ने उसके पुत्रों को जन्म दिया। जब उस पत्नी के पुत्र बड़े हुए, तब उन्होंने यिप्तह को निकाल दिया और उससे कहा, “हमारे पिता के घराने में तुम्हें कोई विरासत नहीं मिलेगी, क्योंकि तुम दूसरी स्त्री के पुत्र हो।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵשֶׁת גִּלְעָד
  choice: गिलाद की पत्नी
  rationale: संबंधवाचक इब्रानी पदबंध का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: בְנֵי הָאִשָּׁה
  choice: उस पत्नी के पुत्र
  rationale: मूल पाठ के निश्चित पदबंध ‘उस/वह पत्नी के पुत्र’ को बनाए रखता है और उसे अनावश्यक रूप से ‘उसकी पत्नी’ नहीं बनाता।
- source_word: וַיְגָרְשׁוּ
  choice: निकाल दिया
  rationale: यहाँ क्रिया का अर्थ घर और परिवार से बलपूर्वक बाहर कर देना है; आधुनिक हिन्दी में यह सहज है।
- source_word: לֹא תִנְחַל
  choice: तुम्हें कोई विरासत नहीं मिलेगी
  rationale: इब्रानी क्रिया के उत्तराधिकार पाने के भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בְּבֵית אָבִינוּ
  choice: हमारे पिता के घराने में
  rationale: ‘घर’ यहाँ केवल भवन नहीं, बल्कि पिता का परिवार और संपत्ति-व्यवस्था भी सूचित करता है; ‘घराने’ से वह दायरा स्पष्ट रहता है।
- source_word: בֶּן אִשָּׁה אַחֶרֶת
  choice: दूसरी स्त्री के पुत्र
  rationale: मूल के अपमानसूचक पारिवारिक भेद को बिना अतिरिक्त व्याख्या के सुरक्षित रखता है।
theological_decisions:
- issue: यिप्तह के उत्तराधिकार से वंचित किए जाने का स्वरूप
  choice: “हमारे पिता के घराने में तुम्हें कोई विरासत नहीं मिलेगी”
  alternative: “तुम हमारे पिता के घराने में उत्तराधिकारी नहीं बनोगे”
  rationale: चुना हुआ रूप संपत्ति और पारिवारिक हिस्से दोनों की गुंजाइश बनाए रखता है तथा किसी विशिष्ट कानूनी या धर्मशास्त्रीय व्यवस्था को पाठ में नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण कथात्मक शैली। ‘उस पत्नी के पुत्र’ जानबूझकर रखा गया है ताकि मूल पाठ की असामान्य किन्तु अर्थपूर्ण निश्चित अभिव्यक्ति बनी रहे।
