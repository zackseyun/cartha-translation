base_translation:
  language: en
  yaml_path: translation/ot/judges/011/012.yaml
  text: Then Jephthah sent messengers to the king of the Ammonites[a], saying, “What is there between me and you, that you have come against me to fight in my land?”
translation:
  language: hi
  text: तब यिप्तह ने अम्मोनियों के राजा के पास दूत भेजकर कहलवाया, “मेरा तुमसे क्या वास्ता है[a] कि तुम मेरे देश में मुझसे लड़ने आए हो?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मुझे तुमसे क्या लेना-देना है?” इब्रानी मुहावरा दोनों पक्षों के बीच वैमनस्य या विवाद व्यक्त करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: तब ... भेजे
  rationale: वाव-क्रमिक कथानक को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में घटनाक्रम का स्वाभाविक क्रम व्यक्त करता है।
- source_word: יִפְתָּח
  choice: यिप्तह
  rationale: इब्रानी व्यक्तिगत नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: מַלְאָכִים
  choice: दूत
  rationale: यह राजनयिक प्रसंग मानवीय संदेशवाहकों का है, स्वर्गदूतों का नहीं।
- source_word: אֶל מֶלֶךְ בְּנֵי עַמּוֹן
  choice: अम्मोनियों के राजा के पास
  rationale: ‘अम्मोन की सन्तान’ यहाँ जातीय नाम है; ‘अम्मोनी’ हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: לֵאמֹר
  choice: भेजकर कहा
  rationale: प्रत्यक्ष कथन आरम्भ कराने वाले इब्रानी रूप को स्वाभाविक हिन्दी वाक्य-विन्यास में संयुक्त क्रिया द्वारा व्यक्त किया गया है।
- source_word: מַה לִּי וָלָךְ
  choice: मेरे और तुम्हारे बीच क्या बात है
  rationale: इब्रानी मुहावरा दोनों पक्षों के बीच विवाद या वैमनस्य व्यक्त करता है। यह रूप उसकी संरचना और तनाव दोनों को बनाए रखते हुए हिन्दी में बोधगम्य है; अधिक मुहावरेदार विकल्प पाद-टिप्पणी में दिया गया है।
- source_word: כִּי
  choice: कि
  rationale: यहाँ यह शिकायत की विषय-वस्तु अथवा व्याख्या प्रस्तुत करता है, इसलिए ‘कि’ स्वाभाविक है।
- source_word: בָאתָ אֵלַי
  choice: तुम ... मुझसे ... आए हो
  rationale: शाब्दिक अर्थ ‘मेरे पास आए हो’ है, पर युद्ध के प्रसंग में विरोधी भाव है; ‘मुझसे लड़ने आए हो’ उसे बिना अनावश्यक विस्तार के स्पष्ट करता है।
- source_word: לְהִלָּחֵם
  choice: लड़ने
  rationale: क्रिया युद्ध में संलग्न होने को दर्शाती है; ‘लड़ने’ सीधा और सामान्य हिन्दी रूप है।
- source_word: בְּאַרְצִי
  choice: मेरे देश में
  rationale: पूर्वसर्ग का मूल अर्थ ‘में’ है; ‘मेरे देश में’ स्थान और यिप्तह के दावे दोनों को स्पष्ट रूप से सुरक्षित रखता है।
