source:
  edition: WLC
  text: וְ/אָֽנֹכִי֙ לֹֽא חָטָ֣אתִי לָ֔/ךְ וְ/אַתָּ֞ה עֹשֶׂ֥ה אִתִּ֛/י רָעָ֖ה לְ/הִלָּ֣חֶם בִּ֑/י יִשְׁפֹּ֨ט יְהוָ֤ה הַ/שֹּׁפֵט֙ הַ/יּ֔וֹם בֵּ֚ין בְּנֵ֣י יִשְׂרָאֵ֔ל וּ/בֵ֖ין בְּנֵ֥י עַמּֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/027.yaml
  text: I have not sinned against you[a], but you are doing me wrong by making war against me. May Yahweh, the Judge, judge today between the sons of Israel and the sons of Ammon.
translation:
  language: hi
  text: मैंने तुम्हारे विरुद्ध पाप नहीं किया, पर तुम मेरे विरुद्ध युद्ध करके मेरे साथ अन्याय कर रहे हो। याहवे, जो न्यायी है, आज इस्राएल के पुत्रों और अम्मोन के पुत्रों के बीच न्याय करे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इस्राएलियों और अम्मोनियों के बीच।” इब्रानी में शाब्दिक रूप से “इस्राएल के पुत्रों और अम्मोन के पुत्रों के बीच” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: חָטָאתִי לָךְ
  choice: मैंने तुम्हारे विरुद्ध पाप नहीं किया
  rationale: חטא का मूल नैतिक और न्यायिक बल ‘पाप करना’ है; לָךְ के साथ ‘तुम्हारे विरुद्ध’ स्वाभाविक हिन्दी प्रयोग है।
- source_word: עֹשֶׂה אִתִּי רָעָה
  choice: मेरे साथ बुराई कर रहे हो
  rationale: यह पदबंध शाब्दिक अर्थ ‘मेरे साथ बुरा/बुराई करना’ व्यक्त करता है और पहले कथन के नैतिक-न्यायिक विरोध को बनाए रखता है।
- source_word: לְהִלָּחֶם בִּי
  choice: मुझसे युद्ध करके
  rationale: संदर्भ दो समुदायों के सशस्त्र संघर्ष का है; ‘युद्ध करके’ उस कार्य को बुराई करने के साधन के रूप में स्पष्ट करता है।
- source_word: יִשְׁפֹּט ... הַשֹּׁפֵט
  choice: जो न्यायी है ... न्याय करे
  rationale: שפט धातु की पुनरावृत्ति को ‘न्यायी’ और ‘न्याय करे’ के द्वारा बनाए रखा गया है; इच्छार्थक क्रिया अपील का भाव व्यक्त करती है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी लिपि में लिप्यंतरित किया गया है।
- source_word: הַיּוֹם
  choice: आज
  rationale: यह आधुनिक हिन्दी में समय की तात्कालिकता का सीधा और स्वाभाविक रूप है।
- source_word: בֵּין בְּנֵי יִשְׂרָאֵל וּבֵין בְּנֵי עַמּוֹן
  choice: इस्राएल के पुत्रों और अम्मोन के पुत्रों के बीच
  rationale: בְּנֵי के शाब्दिक और औपचारिक सामुदायिक रूप ‘पुत्रों’ को मुख्य पाठ में बनाए रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम का प्रयोग करता है; ‘याहवे’ उसे उपाधि से प्रतिस्थापित किए बिना प्रस्तुत करता है।
- issue: בְּנֵי का सामुदायिक, पुल्लिंग रूप
  choice: इस्राएल के पुत्रों ... अम्मोन के पुत्रों
  alternative: इस्राएली ... अम्मोनी; इस्राएल के लोग ... अम्मोन के लोग
  rationale: मुख्य पाठ इब्रानी की औपचारिक अभिव्यक्ति और व्याकरणिक लिंग को सुरक्षित रखता है, जबकि अधिक मुहावरेदार जातिनाम पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। राजनयिक-न्यायिक स्वर तथा ‘न्यायी/न्याय करे’ की मूल पुनरावृत्ति सुरक्षित है। पादटिप्पणी का चिह्न उसी वाक्यांश के बाद रखा गया है जिससे उसका विषय स्पष्ट होता है।
