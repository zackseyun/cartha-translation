  text: וַ/יֹּ֣אמֶר לֵ֔כִי וַ/יִּשְׁלַ֥ח אוֹתָ֖/הּ שְׁנֵ֣י חֳדָשִׁ֑ים וַ/תֵּ֤לֶךְ הִיא֙ וְ/רֵ֣עוֹתֶ֔י/הָ וַ/תֵּ֥בְךְּ עַל בְּתוּלֶ֖י/הָ עַל הֶ/הָרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/038.yaml
  text: And he said[a], “Go.” So he sent her away for two months, and she went, she and her companions, and wept over her virginity on the mountains.
translation:
  language: hi
  text: उसने कहा, “जा।” तब उसने उसे दो महीने के लिए जाने दिया। वह गई—वह और उसकी सहेलियाँ—और पहाड़ों पर अपने कुँवारेपन को लेकर[a] रोई।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपने कुँवारेपन के कारण।” इब्रानी पाठ स्पष्ट रूप से बताता है कि उसके विलाप का विषय उसका कुँवारापन था; व्यापक प्रसंग की व्याख्या में यह विवरण केंद्रीय है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵכִי
  choice: जा
  rationale: הלך के स्त्रीलिंग एकवचन आज्ञार्थक रूप को संक्षिप्त और स्वाभाविक प्रत्यक्ष आज्ञा के रूप में रखा गया है।
- source_word: וַיִּשְׁלַח אוֹתָהּ
  choice: उसने उसे ... जाने दिया
  rationale: यहाँ שׁלח उसे प्रस्थान की अनुमति देने अथवा विदा करने का भाव देता है। ‘जाने दिया’ प्रसंग के अनुरूप है और अस्वीकृति का अनावश्यक संकेत नहीं देता।
- source_word: שְׁנֵי חֳדָשִׁים
  choice: दो महीने के लिए
  rationale: यह पद दी गई अवधि बताता है; हिंदी में ‘के लिए’ इसे स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וַתֵּלֶךְ הִיא וְרֵעוֹתֶיהָ
  choice: वह गई—वह और उसकी सहेलियाँ—
  rationale: इब्रानी में הִיא की स्पष्ट पुनरुक्ति से मिलने वाले हल्के बल को डैशयुक्त संरचना द्वारा बचाया गया है।
- source_word: רֵעוֹתֶיהָ
  choice: उसकी सहेलियाँ
  rationale: स्त्रीलिंग बहुवचन रूप उसकी महिला साथियों को सूचित करता है। आधुनिक हिंदी में ‘सहेलियाँ’ स्वाभाविक और स्पष्ट है।
- source_word: וַתֵּבְךְּ
  choice: रोई
  rationale: בכה का मूल अर्थ रोना है। ‘रोई’ सरल, गंभीर और स्रोत के निकट है; ‘विलाप किया’ भाव को कुछ अधिक व्याख्यायित कर सकता है।
- source_word: עַל בְּתוּלֶיהָ
  choice: अपने कुँवारेपन पर
  rationale: पद उसके कुँवारेपन को उसके रोने का स्पष्ट विषय बनाता है। यह अनुवाद व्यापक कथा में मृत्यु, आजीवन अविवाहित अवस्था अथवा संतानहीनता से जुड़े विवाद को स्वयं हल नहीं करता।
- source_word: עַל הֶהָרִים
  choice: पहाड़ों पर
  rationale: עַל और הָרִים का निकट, दृश्यात्मक अनुवाद है; ‘पहाड़ों में’ भी संभव है, पर ‘पर’ स्रोत-संरचना को अधिक सीधे रखता है।
theological_decisions:
- issue: यिप्तह की बेटी के अपने कुँवारेपन पर रोने का आशय
  choice: मुख्य पाठ केवल वही स्पष्ट करता है जो इब्रानी कहता है—उसके रोने का विषय उसका कुँवारापन था।
  alternative: इसे आसन्न मानव-बलि पर शोक या आजीवन कुँवारी और संतानहीन रहने पर शोक के रूप में स्पष्ट कर देना।
  rationale: यह पद व्यापक कथा की व्याख्यात्मक बहस का निर्णायक समाधान नहीं देता। इसलिए अनुवाद किसी एक धर्मवैचारिक निष्कर्ष को मुख्य पाठ में नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिंदी का सरल किंतु गरिमापूर्ण कथात्मक रूप अपनाया गया है। ‘कुँवारापन’ सामान्य पाठक के लिए ‘कौमार्य’ से अधिक सहज है। स्त्री वक्ता के लिए प्रत्यक्ष आज्ञा ‘जा’ प्रसंगानुकूल और स्वाभाविक है।
