  text: וַ/יּ֥וֹסֶף ע֖וֹד יִפְתָּ֑ח וַ/יִּשְׁלַח֙ מַלְאָכִ֔ים אֶל מֶ֖לֶךְ בְּנֵ֥י עַמּֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/014.yaml
  text: Then Jephthah again sent messengers to the king of the Ammonites[a].
translation:
  language: hi
  text: तब यिप्तह ने फिर अम्मोनियों के राजा के पास दूत भेजे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיּוֹסֶף עוֹד
  choice: तब ... फिर
  rationale: यह इब्रानी मुहावरा किसी कार्य को दोहराने या जारी रखने का भाव देता है। ‘फिर’ पुनरावृत्ति को स्वाभाविक हिन्दी में व्यक्त करता है, और ‘तब’ कथानक के क्रम को दर्शाता है।
- source_word: יִפְתָּח
  choice: यिप्तह
  rationale: व्यक्तिनाम का इब्रानी उच्चारण के निकट देवनागरी लिप्यंतरण किया गया है।
- source_word: וַיִּשְׁלַח
  choice: भेजे
  rationale: इस प्रसंग में שׁלח का सामान्य और स्वाभाविक हिन्दी अर्थ ‘भेजना’ है। कर्ता के आदरसूचक एकवचन प्रयोग के अनुरूप ‘भेजे’ रखा गया है।
- source_word: מַלְאָכִים
  choice: दूत
  rationale: यह राजनयिक मानवीय संदर्भ है, इसलिए מַלְאָכִים का अर्थ स्वर्गदूत नहीं, संदेश ले जाने वाले दूत हैं।
- source_word: אֶל
  choice: के पास
  rationale: व्यक्तियों को दूत भेजने के संदर्भ में दिशासूचक אֶל का स्वाभाविक हिन्दी रूप ‘के पास’ है।
- source_word: מֶלֶךְ בְּנֵי עַמּוֹן
  choice: अम्मोनियों के राजा
  rationale: בְּנֵי עַמּוֹן एक जातिसूचक अभिव्यक्ति है, जिसका अर्थ अम्मोनी लोग है। ‘अम्मोनियों के राजा’ अर्थ को स्पष्ट और सहज हिन्दी में रखता है।
