id: JDG.11.30
reference: Judges 11:30
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יִּדַּ֨ר יִפְתָּ֥ח נֶ֛דֶר לַ/יהוָ֖ה וַ/יֹּאמַ֑ר אִם נָת֥וֹן תִּתֵּ֛ן אֶת בְּנֵ֥י עַמּ֖וֹן בְּ/יָדִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/030.yaml
  text: And Jephthah made a vow to Yahweh and said[a], “If you indeed give the Ammonites into my hand,”
translation:
  language: hi
  text: तब यिप्तह ने यहोवा से एक मन्नत मानी और कहा, “यदि तू सचमुच अम्मोनियों को मेरे हाथ में कर दे,”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּדַּר יִפְתָּח נֶדֶר
  choice: तब यिप्तह ने ... एक मन्नत मानी
  rationale: सजातीय क्रिया और संज्ञा का अर्थ स्वाभाविक आधुनिक हिन्दी के प्रचलित पदबंध ‘मन्नत मानना’ से व्यक्त किया गया है। वַ का कथात्मक क्रम ‘तब’ से प्रकट होता है।
- source_word: לַיהוָה
  choice: यहोवा से
  rationale: यहाँ ל उस व्यक्ति को चिह्नित करता है जिसके प्रति मन्नत मानी गई। हिन्दी में ‘यहोवा से मन्नत मानी’ स्वाभाविक है और परमेश्वर के व्यक्तिगत नाम को लिप्यंतरित रूप में सुरक्षित रखता है।
- source_word: אִם
  choice: यदि
  rationale: यह मन्नत की शर्त का आरम्भ करता है, जिसका परिणाम अगले पद में पूरा होता है।
- source_word: נָתוֹן תִּתֵּן
  choice: तू सचमुच ... कर दे
  rationale: अनन्त क्रियारूप और सीमित क्रिया का संयोजन बल देता है; ‘सचमुच’ उस बल को सहज हिन्दी में व्यक्त करता है। एकवचन संबोधन ‘तू’ यहोवा से सीधे संबोधन को बनाए रखता है।
- source_word: בְּנֵי עַמּוֹן
  choice: अम्मोनियों
  rationale: शाब्दिक ‘अम्मोन के पुत्रों’ के स्थान पर जातिवाचक अर्थ का स्वाभाविक हिन्दी रूप है।
- source_word: בְּיָדִי
  choice: मेरे हाथ में
  rationale: इब्रानी मुहावरे को बनाए रखता है, जिसका अर्थ किसी को दूसरे के अधिकार या वश में देना है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम सीधे आया है। हिन्दी बाइबलीय प्रयोग में व्यापक रूप से पहचाना जाने वाला ‘यहोवा’ नाम को उपाधि ‘प्रभु’ में बदलने के बजाय नाम के रूप में सुरक्षित रखता है।
- issue: यिप्तह की मन्नत की शर्त में बल
  choice: यदि तू सचमुच ... कर दे
  alternative: यदि तू ... कर दे
  rationale: נָתוֹן תִּתֵּן की व्याकरणिक बलवत्ता को व्यक्त किया गया है, बिना मन्नत के विवादास्पद स्वरूप या उसके परिणाम की व्याख्या इस पद में जोड़े।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। पद अगले वाक्यांश में जारी रहता है, इसलिए अंत में अल्पविराम रखा गया है।
