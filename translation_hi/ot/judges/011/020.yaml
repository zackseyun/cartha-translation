source:
  edition: WLC
  text: וְ/לֹא הֶאֱמִ֨ין סִיח֤וֹן אֶת יִשְׂרָאֵל֙ עֲבֹ֣ר בִּ/גְבֻל֔/וֹ וַ/יֶּאֱסֹ֤ף סִיחוֹן֙ אֶת כָּל עַמּ֔/וֹ וַֽ/יַּחֲנ֖וּ בְּ/יָ֑הְצָ/ה וַ/יִּלָּ֖חֶם עִם יִשְׂרָאֵֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/020.yaml
  text: But Sihon did not trust Israel to pass through his territory[a]. So Sihon gathered all his people, and they camped at Jahaz[c][b], and he fought against Israel.
translation:
  language: hi
  text: परन्तु सीहोन ने इस्राएल पर इतना भरोसा नहीं किया कि उसे अपने क्षेत्र से होकर जाने दे[a]। तब सीहोन ने अपने सभी लोगों को इकट्ठा किया[b]। उन्होंने यहस में पड़ाव डाला और उसने इस्राएल से युद्ध किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इस्राएल की बात पर विश्वास नहीं किया।” भाव यह है कि उसने इस्राएल पर इतना भरोसा नहीं किया कि उसे अपने क्षेत्र से होकर जाने देता।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में “अपने सभी लोगों को”; युद्ध का प्रसंग होने पर भी मूल पाठ स्पष्ट रूप से “सेना” नहीं कहता।
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶאֱמִין
  choice: भरोसा नहीं किया
  rationale: हिफ़ील रूप यहाँ किसी पर विश्वास या भरोसा रखने का भाव देता है। प्रसंग में सीहोन को इस्राएल पर सुरक्षित मार्ग देने जितना भरोसा नहीं था; केवल ‘जाने नहीं दिया’ कहना क्रिया के कारण के बजाय परिणाम बताता।
- source_word: עֲבֹר בִּגְבֻלוֹ
  choice: अपने क्षेत्र से होकर जाने दे
  rationale: עבר का infinitive और בִּגְבוּלוֹ मिलकर सीहोन के अधिकार वाले भूभाग से होकर गुजरने को व्यक्त करते हैं। ‘क्षेत्र’ यहाँ केवल सीमा-रेखा की अपेक्षा अधिक उपयुक्त है।
- source_word: וַיֶּאֱסֹף
  choice: इकट्ठा किया
  rationale: आसफ़ यहाँ लोगों को, सैन्य प्रसंग में, एकत्र करने का अर्थ देता है। यह सहज हिन्दी है और ‘सेना जुटाई’ कहकर मूल से अधिक विशिष्ट नहीं बनती।
- source_word: כָּל עַמּוֹ
  choice: अपने सभी लोगों को
  rationale: मूल में स्पष्टतः ‘उसके सभी लोग’ है, ‘सेना’ नहीं। युद्ध का प्रसंग सैन्य समूह का संकेत देता है, पर अनुवाद मूल की व्यापक अभिव्यक्ति बनाए रखता है।
- source_word: וַיַּחֲנוּ
  choice: उन्होंने ... पड़ाव डाला
  rationale: बहुवचन क्रिया एकत्र किए गए लोगों को कर्ता बनाती है। ‘पड़ाव डाला’ आधुनिक हिन्दी में सैन्य शिविर लगाने का स्वाभाविक रूप है।
- source_word: בְּיָהְצָה
  choice: यहस में
  rationale: स्थान-नाम יָהְצָה का हिन्दी लिप्यंतरण ‘यहस’ रखा गया है; בְּ स्थान को सूचित करता है।
- source_word: וַיִּלָּחֶם עִם
  choice: इस्राएल से युद्ध किया
  rationale: यद्यपि עִם का मूल अर्थ ‘साथ’ है, נלחם के साथ यह विरोधी पक्ष को दर्शाता है। हिन्दी में ‘से युद्ध किया’ स्वाभाविक है और शत्रुतापूर्ण अर्थ स्पष्ट रखता है।
