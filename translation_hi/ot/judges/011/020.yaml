  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘परन्तु’, ‘क्षेत्र’, ‘पड़ाव डाला’ और ‘युद्ध किया’ औपचारिकता तथा स्पष्टता का संतुलन रखते हैं। वाक्य-विभाजन से इब्रानी कथात्मक क्रम स्पष्ट रहता है।
