source:
  edition: WLC
  text: וַ/יָּבֹ֨א יִפְתָּ֣ח הַ/מִּצְפָּה֮ אֶל בֵּית/וֹ֒ וְ/הִנֵּ֤ה בִתּ/וֹ֙ יֹצֵ֣את לִ/קְרָאת֔/וֹ בְ/תֻפִּ֖ים וּ/בִ/מְחֹל֑וֹת וְ/רַק֙ הִ֣יא יְחִידָ֔ה אֵֽין ל֥/וֹ מִמֶּ֛/נּוּ בֵּ֖ן אוֹ בַֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/034.yaml
  text: Then Jephthah came to Mizpah[a], to his house, and behold, his daughter was coming out to meet him with tambourines and with dances. Now she was his only child[b]; besides her he had neither son nor daughter.
translation:
  language: hi
  text: तब यिप्तह मिस्पा में अपने घर आया। और देखो, उसकी बेटी डफ बजाती हुई और नाचती हुई उससे मिलने बाहर आ रही थी। वह उसकी इकलौती संतान थी[a]; उसके सिवा उसका न कोई बेटा था, न बेटी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से ‘वह उसकी इकलौती थी’; अगले वाक्य से स्पष्ट है कि आशय उसकी इकलौती संतान से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: तब … आया
  rationale: वाव-क्रमिक रूप कथा को आगे बढ़ाता है; ‘तब’ स्वाभाविक हिन्दी में घटनाक्रम व्यक्त करता है और ‘आया’ मूल गति-क्रिया को बनाए रखता है।
- source_word: הַמִּצְפָּה
  choice: मिस्पा में
  rationale: यह निश्चित उपपद के साथ आया स्थान-नाम है। हिन्दी में गन्तव्य के साथ ‘मिस्पा में आया’ स्वाभाविक है।
- source_word: אֶל בֵּיתוֹ
  choice: अपने घर
  rationale: ‘घर’ मूल के ठोस अर्थ को रखता है; कर्ता के अपने घर के लिए हिन्दी में ‘अपने’ अधिक स्वाभाविक है।
- source_word: וְהִנֵּה
  choice: और देखो
  rationale: यह अचानक सामने आए दृश्य और उसके नाटकीय प्रभाव को बनाए रखता है।
- source_word: יֹצֵאת לִקְרָאתוֹ
  choice: उससे मिलने बाहर आ रही थी
  rationale: कृदन्त उस समय जारी क्रिया का सजीव चित्र देता है; ‘आ रही थी’ इस अपूर्णतापरक भाव को व्यक्त करता है।
- source_word: בְתֻפִּים
  choice: डफ बजाते
  rationale: תֹּף उत्सव में बजाया जाने वाला हाथ का चौखटे वाला ढोल है; ‘डफ’ आधुनिक हिन्दी में संक्षिप्त और समझने योग्य समतुल्य है। वाद्य के साथ आने का आशय स्पष्ट करने के लिए ‘बजाते’ स्वाभाविक रूप से जोड़ा गया है।
- source_word: וּבִמְחֹלוֹת
  choice: और नाचते हुए
  rationale: बहुवचन संज्ञा उत्सवी नृत्य को सूचित करती है; हिन्दी में क्रियात्मक पदबंध अधिक सहज है।
- source_word: וְרַק הִיא יְחִידָה
  choice: वह उसकी इकलौती संतान थी
  rationale: יְחִידָה का शाब्दिक अर्थ ‘इकलौती’ है; अगला वाक्य स्पष्ट करता है कि आशय इकलौती संतान से है।
- source_word: אֵין לוֹ מִמֶּנּוּ בֵּן אוֹ בַת
  choice: उसके सिवा उसका न कोई बेटा था, न बेटी
  rationale: यह उसकी एकमात्र संतान होने की बात को पुष्ट करता है। ‘न … न …’ सम्पूर्ण निषेध को स्वाभाविक हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: यिप्तह की बेटी की स्थिति और आगे उसके साथ होने वाली घटना की व्याख्या
  choice: 'पद को केवल वर्णनात्मक रूप में रखा गया है: वह उसकी इकलौती संतान थी और उत्सव मनाते हुए उससे मिलने निकली।'
  alternative: कुछ पाठक इस बलाघात को आगे शाब्दिक बलिदान से जोड़ते हैं, जबकि अन्य इसे आजीवन कुँवारेपन या संतानहीनता से जोड़ते हैं।
  rationale: यह पद स्वयं उसके अंतिम भाग्य का निर्णय नहीं करता। इसलिए अनुवाद आसपास के विवादित प्रसंग का कोई निष्कर्ष इसमें नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, कथात्मक और गरिमापूर्ण रखी गई है। ‘और देखो’ मूल की नाटकीयता बनाए रखता है; ‘डफ बजाते और नाचते हुए’ सामान्य पाठक के लिए उत्सवी दृश्य को सहज रूप में व्यक्त करता है।
