source:
  edition: WLC
  text: הֲ/לֹ֞א אֵ֣ת אֲשֶׁ֧ר יוֹרִֽישְׁ/ךָ֛ כְּמ֥וֹשׁ אֱלֹהֶ֖י/ךָ אוֹת֥/וֹ תִירָ֑שׁ וְ/אֵת֩ כָּל אֲשֶׁ֨ר הוֹרִ֜ישׁ יְהוָ֧ה אֱלֹהֵ֛י/נוּ מִ/פָּנֵ֖י/נוּ אוֹת֥/וֹ נִירָֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/024.yaml
  text: Will you not possess what Chemosh your god causes you to possess? And all that Yahweh our God has dispossessed before us[b][a], that we will possess.
translation:
  language: hi
  text: क्या तू उस पर अधिकार नहीं करेगा, जिस पर तेरा देवता कमोश तुझे अधिकार दिलाता है? और जिन सबको हमारे परमेश्वर यहोवा ने हमारे सामने से बेदखल किया है, उन पर हम अधिकार करेंगे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में “अधिकार करना” और “बेदखल करना” के लिए एक ही मूल क्रिया ירשׁ के रूप आए हैं। प्रसंग में इसका अर्थ किसी भूभाग या उस पर रहने वालों पर अधिकार पाना है, जिसमें पहले के निवासियों को हटाने का भाव भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: क्या ... नहीं करेगा
  rationale: यह सहमति की अपेक्षा रखने वाला आलंकारिक प्रश्न है; भविष्यकालीन क्रिया के साथ यह हिन्दी में स्वाभाविक है।
- source_word: יוֹרִישְׁךָ
  choice: तुझे अधिकार दिलाता है
  rationale: हिफ़ील रूप किसी को दूसरों को हटाकर भूभाग का अधिकारी बनाने का भाव रखता है; यह चयन कारक और भू-स्वामित्व दोनों अर्थों को संक्षेप में व्यक्त करता है।
- source_word: כְּמוֹשׁ אֱלֹהֶיךָ
  choice: तेरा देवता कमोश
  rationale: कमोश नाम का लिप्यंतरण किया गया है और सम्बोधन में विपक्षी राजा के दावे को बिना समर्थन या व्यंग्य जोड़े सीधे रखा गया है।
- source_word: תִירָשׁ / נִירָשׁ
  choice: अधिकार करेगा / अधिकार करेंगे
  rationale: यहाँ ירשׁ का सन्दर्भ भूभाग अपने अधिकार में लेने और रखने से है; समान हिन्दी पदावली पुनरावृत्ति को बनाए रखती है।
- source_word: הוֹרִישׁ
  choice: निवासियों को ... बेदखल किया है
  rationale: सकर्मक हिफ़ील रूप पूर्व निवासियों को हटाने का अर्थ प्रमुखता से देता है। हिन्दी में कर्म स्पष्ट करने के लिए 'निवासियों को' जोड़ा गया है, जबकि जिस भूभाग पर अधिकार होता है वह כָּל אֲשֶׁר से समझा जाता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: दिव्य व्यक्तिगत नाम को हिन्दी में प्रचलित लिप्यंतरण 'यहोवा' से प्रस्तुत किया गया है, पदवी से प्रतिस्थापित नहीं किया गया।
- source_word: מִפָּנֵינוּ
  choice: हमारे सामने से
  rationale: यह स्थानवाचक मुहावरे का निकट और स्वाभाविक हिन्दी रूप है, जो इस्राएल के मार्ग या उपस्थिति से हटाए जाने का भाव रखता है।
theological_decisions:
- issue: यिप्तह की वाणी में कमोश को 'तेरा देवता' कहना
  choice: कथन को कूटनीतिक और आलंकारिक तर्क के रूप में सीधे अनूदित किया गया है।
  alternative: उद्धरण-चिह्न, 'कथित देवता', या व्यंग्यसूचक भाषा जोड़ना।
  rationale: इब्रानी पाठ विपक्षी के धार्मिक दावे के आधार पर तर्क प्रस्तुत करता है; अनुवाद न तो कमोश की वास्तविक दिव्यता स्वीकार करता है, न पाठ में अनुपस्थित खंडन जोड़ता है।
- issue: ירשׁ में अधिकार पाने और पूर्व निवासियों को बेदखल करने का संयुक्त भाव
  choice: पहले और अंतिम प्रयोग में 'अधिकार', तथा मध्य हिफ़ील में 'बेदखल' रखा गया है।
  alternative: तीनों प्रयोगों को केवल 'विरासत में पाना' या केवल 'अधिकार करना' कहना।
  rationale: इससे मूल की शब्द-पुनरावृत्ति का अर्थगत सम्बन्ध बना रहता है और मध्य क्रिया में स्पष्ट कारक-बेदखली का भाव भी सुरक्षित रहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, कूटनीतिक-मिलिटरी लहजा रखा गया है। राजा को प्रत्यक्ष एकवचन सम्बोधन के कारण 'तू/तेरा/तुझे' प्रयुक्त है। 'देश' को भूभाग के अर्थ में स्पष्टता हेतु जोड़ा गया है; दूसरी पंक्ति में 'निवासियों' का स्पष्ट उल्लेख हिन्दी में बेदखली के स्वाभाविक कर्म के रूप में किया गया है।
