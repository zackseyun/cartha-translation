base_translation:
  language: en
  yaml_path: translation/ot/judges/011/011.yaml
  text: So Jephthah went with the elders of Gilead[a], and the people made him head and commander over them[b]. And Jephthah spoke all his words before Yahweh at Mizpah.
translation:
  language: hi
  text: तब यिप्तह गिलाद के बुज़ुर्गों के साथ गया, और लोगों ने उसे अपना मुखिया और अधिकारी[a] नियुक्त किया। और यिप्तह ने मिस्पा में यहोवा के सामने अपनी सारी बातें कहीं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘उनके ऊपर मुखिया और शासक।’ ‘अधिकारी’ के लिए प्रयुक्त इब्रानी शब्द का अर्थ ‘शासक’ या ‘सेनानायक’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘यिप्तह ने अपनी सारी बातें दोहराईं।’ इब्रानी में शाब्दिक रूप से, ‘अपनी सारी बातें कहीं’ है।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּלֶךְ יִפְתָּח עִם זִקְנֵי גִלְעָד
  choice: तब यिप्तह गिलाद के पुरनियों के साथ गया
  rationale: क्रमिक कथन को स्वाभाविक हिन्दी में व्यक्त करता है; זִקְנֵי का प्रचलित बाइबलीय और सामुदायिक अर्थ ‘पुरनिये’ है।
- source_word: וַיָּשִׂימוּ הָעָם אוֹתוֹ עֲלֵיהֶם
  choice: लोगों ने उसे अपने ऊपर ... नियुक्त किया
  rationale: שׂים के साथ עַל यहाँ किसी को अधिकार-पद पर स्थापित करने का भाव देता है; ‘नियुक्त किया’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: לְרֹאשׁ וּלְקָצִין
  choice: प्रधान और सेनापति
  rationale: רֹאשׁ नेतृत्व के सर्वोच्च पद को और קָצִין शासकीय अथवा सैनिक अधिकारी को दर्शाता है; अम्मोन से आसन्न युद्ध के संदर्भ में ‘सेनापति’ उपयुक्त है।
- source_word: וַיְדַבֵּר יִפְתָּח אֶת כָּל דְּבָרָיו
  choice: यिप्तह ने ... अपनी सारी बातें कहीं
  rationale: मूल के शाब्दिक और व्यापक भाव को सुरक्षित रखता है और इसे केवल शर्तों की पुनरावृत्ति, प्रार्थना या विधिक पुष्टि तक सीमित नहीं करता।
- source_word: לִפְנֵי יְהוָה
  choice: यहोवा के सामने
  rationale: परमेश्वर की उपस्थिति में हुए गंभीर कथन का संकेत देता है और वाचा-नाम को लिप्यंतरित रूप में रखता है।
- source_word: בַּמִּצְפָּה
  choice: मिस्पा में
  rationale: स्थान-नाम का स्वाभाविक हिन्दी लिप्यंतरण और प्रसंगानुकूल परसर्ग।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: हिन्दी में व्यापक रूप से पहचाने जाने वाले नामरूप ‘यहोवा’ द्वारा चतुरक्षरीय वाचा-नाम को उपाधि में बदलने के बजाय नाम के रूप में रखा गया है।
- issue: यिप्तह द्वारा यहोवा के सामने अपनी बातें कहने का आशय
  choice: अपनी सारी बातें कहीं
  alternative: अपनी सारी शर्तें दोहराईं
  rationale: मूल वाक्यांश व्यापक है और औपचारिक पुष्टि, निवेदन या पूर्व वार्ता के कथनों का संकेत दे सकता है; चुना हुआ पाठ इस अस्पष्टता को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज कथात्मक रूप। ‘पुरनियों’ और ‘सेनापति’ जैसे परिचित बाइबलीय शब्द रखे गए हैं; किसी अनावश्यक व्याख्यात्मक विस्तार या सांप्रदायिक विशिष्टता को नहीं जोड़ा गया।
