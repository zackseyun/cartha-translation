source:
  edition: WLC
  text: וַ/תֹּ֨אמֶר֙ אֶל אָבִ֔י/הָ יֵעָ֥שֶׂה לִּ֖/י הַ/דָּבָ֣ר הַ/זֶּ֑ה הַרְפֵּ֨ה מִמֶּ֜/נִּי שְׁנַ֣יִם חֳדָשִׁ֗ים וְ/אֵֽלְכָה֙ וְ/יָרַדְתִּ֣י עַל הֶֽ/הָרִ֔ים וְ/אֶבְכֶּה֙ עַל בְּתוּלַ֔/י אָנֹכִ֖י ו/רעית/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/037.yaml
  text: 'And she said to her father[a], “Let this thing be done for me: leave me alone for two months, that I may go and wander on the mountains and weep over my virginity[b], I and my companions.”'
translation:
  language: hi
  text: 'तब उसने अपने पिता से कहा, “मेरे लिए यह बात होने दीजिए: मुझे दो महीने के लिए जाने दीजिए[a], ताकि मैं जाकर पहाड़ों में उतरकर घूमूँ और अपनी कुँवारी अवस्था पर रोऊँ[b]—मैं और मेरी सहेलियाँ।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मुझे दो महीने के लिए अकेली छोड़ दीजिए” या “मुझे दो महीने की अनुमति दीजिए।”
    reason: רפה מן मुहावरे का मूलतः छोड़ देने/मुक्त करने का भाव तथा प्रसंगानुसार अनुमति देने का अर्थ।
  - marker: b
    text: इब्रानी में शाब्दिक अर्थ “अपनी कुँवारी अवस्था पर रोऊँ” है। यहाँ उसके अविवाहित और निःसंतान रहने पर बल है; यह कथन व्यापक कथा की व्याख्या का प्रश्न स्वयं हल नहीं करता।
    reason: मूल अभिव्यक्ति का अर्थ और कथानक में उसकी वास्तविक व्याख्यात्मक अनिश्चितता स्पष्ट करना।
lexical_decisions:
- source_word: יֵעָשֶׂה לִּי הַדָּבָר הַזֶּה
  choice: मेरे लिए यह बात की जाए
  rationale: निफ़अल रूप के इच्छासूचक निष्क्रिय भाव ‘यह ... किया जाए’ को बनाए रखता है और ‘बात’ द्वारा הַדָּבָר का स्वाभाविक हिन्दी रूप देता है।
- source_word: הַרְפֵּה מִמֶּנִּי
  choice: मुझे ... अकेला छोड़ दीजिए
  rationale: רפה מן का मुहावरा यहाँ कुछ समय के लिए स्वतंत्र छोड़ने या जाने देने का अनुरोध व्यक्त करता है। स्त्री वक्ता के कारण ‘अकेला’ का रूप प्रयुक्त हुआ है।
- source_word: שְׁנַיִם חֳדָשִׁים
  choice: दो महीने के लिए
  rationale: समयावधि को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: וְאֵלְכָה וְיָרַדְתִּי עַל הֶהָרִים
  choice: ताकि मैं जाकर पहाड़ों पर घूमूँ
  rationale: दोनों समन्वित क्रियाओं की गतिशीलता को स्वाभाविक हिन्दी में समेटता है। यहाँ ‘उतरूँ’ का अक्षरशः रूप लक्ष्य-भाषा में भ्रामक हो सकता है; प्रसंग पहाड़ी क्षेत्र में विचरण का है।
- source_word: וְאֶבְכֶּה עַל בְּתוּלַי
  choice: अपने कुँवारेपन पर रोऊँ
  rationale: בכה על के विलाप-संबंधी भाव और בְּתוּלִים के अविवाहित/कुँवारी अवस्था के स्पष्ट उल्लेख को बिना व्याख्यात्मक विस्तार के सुरक्षित रखता है।
- source_word: אָנֹכִי וְרֵעוֹתָי
  choice: मैं और मेरी सहेलियाँ
  rationale: स्त्रीलिंग बहुवचन रूप उसकी स्त्री मित्रों या संगिनियों की ओर संकेत करता है; ‘सहेलियाँ’ आधुनिक हिन्दी में सहज और स्पष्ट है।
theological_decisions:
- issue: यिप्तह की बेटी के अपने कुँवारेपन पर विलाप का अर्थ
  choice: पद के स्पष्ट शब्दों के अनुसार ‘अपने कुँवारेपन पर रोऊँ’ रखा गया है।
  alternative: इसे आसन्न मृत्यु और निःसंतानता पर संयुक्त विलाप, अथवा आजीवन कुँवारे समर्पण पर विलाप के रूप में स्पष्ट करना।
  rationale: इस पद में मृत्यु का स्पष्ट उल्लेख नहीं है; मुख्य बल उसके कुँवारेपन पर है। अनुवाद व्यापक कथा के विवादित अर्थ को तय किए बिना मूल तनाव बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। पिता से संबोधन में आदरसूचक ‘दीजिए’ प्रयुक्त है। ‘कुँवारापन’ मूल के प्रमुख भाव को सीधे व्यक्त करता है, जबकि ‘सहेलियाँ’ स्त्रीलिंग संगिनियों को सामान्य पाठक के लिए स्पष्ट बनाता है।
