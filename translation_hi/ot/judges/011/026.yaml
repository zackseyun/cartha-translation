source:
  edition: WLC
  text: בְּ/שֶׁ֣בֶת יִ֠שְׂרָאֵל בְּ/חֶשְׁבּ֨וֹן וּ/בִ/בְנוֹתֶ֜י/הָ וּ/בְ/עַרְע֣וֹר וּ/בִ/בְנוֹתֶ֗י/הָ וּ/בְ/כָל הֶֽ/עָרִים֙ אֲשֶׁר֙ עַל יְדֵ֣י אַרְנ֔וֹן שְׁלֹ֥שׁ מֵא֖וֹת שָׁנָ֑ה וּ/מַדּ֥וּעַ לֹֽא הִצַּלְתֶּ֖ם בָּ/עֵ֥ת הַ/הִֽיא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/026.yaml
  text: While Israel has lived in Heshbon and its daughter towns[a], and in Aroer and its daughter towns, and in all the cities that are along the Arnon, for three hundred years[b], why did you not recover them during that time?
translation:
  language: hi
  text: जब इस्राएल हेशबोन और उसके अधीन नगरों[a] में, अरोएर और उसके अधीन नगरों में, और अर्नोन के किनारे के सभी नगरों में तीन सौ वर्ष से रहता आया है, तब तुमने उस अवधि में उन्हें क्यों नहीं छुड़ाया[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से “उसकी बेटियाँ”; अर्थात किसी बड़े नगर पर निर्भर छोटी बस्तियाँ या नगर।
    reason: cultural_note
  - marker: b
    text: या, प्रसंग के अनुसार, “उन्हें वापस क्यों नहीं लिया?” मूल क्रिया का अर्थ “छुड़ाना” या “बचाना” भी हो सकता है; यहाँ प्रसंग क्षेत्र को वापस लेने का है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּ/שֶׁבֶת
  choice: इस्राएल को ... रहते हुए ... वर्ष हो गए थे
  rationale: בְּ के साथ infinitive construct यहाँ समय और दीर्घ अवधि की परिस्थिति बताता है। यह हिंदी रचना तीन सौ वर्षों के निवास को स्वाभाविक ढंग से व्यक्त करती है।
- source_word: בְּנוֹתֶיהָ
  choice: उसके अधीन नगरों
  rationale: शाब्दिक अर्थ ‘उसकी बेटियाँ’ है, पर यह मुख्य नगर पर निर्भर छोटी बस्तियों या नगरों का इब्रानी मुहावरा है। मुख्य पाठ में अर्थ स्पष्ट रखा गया है और रूपक को पादटिप्पणी में बताया गया है।
- source_word: עַרְעוֹר
  choice: अरोएर
  rationale: स्थान-नाम का प्रचलित हिंदी लिप्यंतरण।
- source_word: עַל יְדֵי אַרְנוֹן
  choice: अर्नोन के किनारे बसे
  rationale: मुहावरे का अर्थ ‘अर्नोन के पास/साथ-साथ’ है; अनेक नगरों के भौगोलिक स्थान के लिए यह स्वाभाविक हिंदी है।
- source_word: שְׁלֹשׁ מֵאוֹת שָׁנָה
  choice: तीन सौ वर्ष
  rationale: इस्राएल के निवास की अवधि को सीधे व्यक्त करता है।
- source_word: וּמַדּוּעַ
  choice: फिर ... क्यों
  rationale: वाव को ‘फिर’ से व्यक्त करने पर पिछली समयावधि से जुड़ा तर्कपूर्ण आलंकारिक प्रश्न स्पष्ट होता है।
- source_word: הִצַּלְתֶּם
  choice: उन्हें ... छुड़ाया
  rationale: हिफ़ील रूप का मूल अर्थ ‘छुड़ाना/बचाना’ है। क्षेत्रीय विवाद में नगरों को पुनः अपने अधिकार में लेने का भाव निहित है, पर मुख्य पाठ मूल क्रिया की शब्दार्थगत व्यापकता बनाए रखता है।
- source_word: בָּעֵת הַהִיא
  choice: उस समय
  rationale: इब्रानी संकेतवाचक समय-वाक्यांश का निकट और स्वाभाविक अनुवाद।
theological_decisions:
- issue: הִצַּלְתֶּם का क्षेत्रीय विवाद में अर्थ
  choice: छुड़ाया
  alternative: फिर से अपने अधिकार में लिया
  rationale: मूल क्रिया सामान्यतः बचाने या छुड़ाने को व्यक्त करती है, जबकि प्रसंग भूमि वापस लेने का है। ‘छुड़ाया’ मूल की व्यापकता और प्रसंगगत तनाव दोनों बनाए रखता है; पादटिप्पणी क्षेत्रीय अर्थ स्पष्ट करती है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण और सुबोध शैली। ‘अधीन नगर’ प्राचीन नगर-व्यवस्था को सामान्य पाठक के लिए स्पष्ट करता है। अंतिम प्रश्न में ‘उस समय’ मूल בָּעֵת הַהִיא के संकेतवाचक बल को सुरक्षित रखता है।
