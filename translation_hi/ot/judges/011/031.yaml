source:
  edition: WLC
  text: וְ/הָיָ֣ה הַ/יּוֹצֵ֗א אֲשֶׁ֨ר יֵצֵ֜א מִ/דַּלְתֵ֤י בֵיתִ/י֙ לִ/קְרָאתִ֔/י בְּ/שׁוּבִ֥/י בְ/שָׁל֖וֹם מִ/בְּנֵ֣י עַמּ֑וֹן וְ/הָיָה֙ לַֽ/יהוָ֔ה וְ/הַעֲלִיתִ֖/הוּ עוֹלָֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/031.yaml
  text: then whatever comes out from the doors of my house to meet me when I return in peace from the Ammonites shall be Yahweh’s[a], and I will offer it up as a burnt offering.
translation:
  language: hi
  text: तब जो कुछ मेरे घर के दरवाज़ों से निकलकर मुझसे मिलने आएगा, जब मैं अम्मोनियों से सकुशल लौटूँगा, वह यहोवा का होगा[a], और मैं उसे होमबलि के रूप में चढ़ाऊँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह यहोवा का होगा, या मैं उसे होमबलि के रूप में चढ़ाऊँगा।” कुछ व्याख्याकार यहाँ इब्रानी संयोजक को विकल्पसूचक अर्थ में लेते हैं; इस प्रकार बाहर आनेवाले के अनुसार दो अलग परिणाम संभव होते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: הַיּוֹצֵא אֲשֶׁר יֵצֵא
  choice: जो कुछ ... निकलकर ... आएगा
  rationale: इब्रानी अभिव्यक्ति शाब्दिक रूप से ‘निकलनेवाला जो निकलेगा’ है और व्यक्ति अथवा पशु—दोनों की संभावना खुली रखती है। ‘जो कुछ’ इस महत्त्वपूर्ण अस्पष्टता को बनाए रखता है।
- source_word: מִדַּלְתֵי בֵיתִי
  choice: मेरे घर के दरवाज़ों से
  rationale: דַּלְתֵי बहुवचन संबंध-रूप है। यह अनुवाद मूल के बहुवचन को रखते हुए स्वाभाविक हिन्दी देता है।
- source_word: לִקְרָאתִי
  choice: मुझसे मिलने
  rationale: यह पद किसी की ओर जाकर उसका सामना या स्वागत करने के भाव को व्यक्त करता है; ‘मिलने’ प्रसंगानुकूल और स्वाभाविक है।
- source_word: בְּשׁוּבִי בְשָׁלוֹם
  choice: जब मैं ... कुशल से लौटूँगा
  rationale: שָׁלוֹם यहाँ युद्ध से सुरक्षित और सकुशल लौटने का भाव देता है। ‘कुशल से’ आधुनिक हिन्दी में इस व्यापक अर्थ को स्पष्ट करता है।
- source_word: מִבְּנֵי עַמּוֹן
  choice: अम्मोनियों के पास से
  rationale: शाब्दिक ‘अम्मोन के पुत्रों से’ के स्थान पर प्रचलित जातिनाम ‘अम्मोनी’ लिया गया है। ‘के पास से’ वापसी के आरंभ-बिंदु को व्यक्त करता है, जबकि युद्ध का प्रसंग आसपास के पदों से स्पष्ट है।
- source_word: וְהָיָה לַיהוָה
  choice: वह यहोवा का होगा
  rationale: यह वाक्यांश यहोवा के प्रति समर्पण या उसके अधिकार में होने को व्यक्त करता है और समर्पण की विधि को अलग से निर्धारित नहीं करता।
- source_word: לַיהוָה
  choice: यहोवा
  rationale: व्यक्तिगत ईश्वरीय नाम יהוה को हिन्दी में स्थापित रूप ‘यहोवा’ से दर्शाया गया है।
- source_word: וְהַעֲלִיתִהוּ עוֹלָה
  choice: और मैं उसे होमबलि के रूप में चढ़ाऊँगा
  rationale: עלה के हिफ़ील रूप के साथ עוֹלָה बलि चढ़ाने की मानक अभिव्यक्ति है। पुल्लिंग एकवचन प्रत्यय को ‘उसे’ कहना हिन्दी में व्यक्ति या पशु, दोनों के संदर्भ को खुला रखता है। सामान्य संयोजक अर्थ के अनुसार וְ का अनुवाद ‘और’ किया गया है।
theological_decisions:
- issue: क्या मन्नत एक संयुक्त परिणाम बताती है या दो वैकल्पिक परिणाम?
  choice: 'मुख्य पाठ में संयुक्त अर्थ: ‘यहोवा का होगा, और मैं उसे ... चढ़ाऊँगा।’'
  alternative: ‘यहोवा का होगा, या मैं उसे होमबलि के रूप में चढ़ाऊँगा।’
  rationale: וְ का सामान्य और यहाँ सर्वाधिक सहज अर्थ ‘और’ है। फिर भी इसे विकल्पसूचक ‘या’ मानने की व्याख्या प्रचलित है; इसलिए मुख्य पाठ के तनाव को बदले बिना उसे पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और मौखिक रूप से सहज शैली रखी गई है। ‘जो कुछ’ और ‘उसे’ के द्वारा मूल में व्यक्ति या पशु संबंधी अस्पष्टता सुरक्षित है। ‘होमबलि’ बाइबलीय बलिदान के लिए प्रचलित और संक्षिप्त पद है।
