source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ מֶ֨לֶךְ בְּנֵי עַמּ֜וֹן אֶל מַלְאֲכֵ֣י יִפְתָּ֗ח כִּֽי לָקַ֨ח יִשְׂרָאֵ֤ל אֶת אַרְצִ/י֙ בַּ/עֲלוֹת֣/וֹ מִ/מִּצְרַ֔יִם מֵ/אַרְנ֥וֹן וְ/עַד הַ/יַּבֹּ֖ק וְ/עַד הַ/יַּרְדֵּ֑ן וְ/עַתָּ֕ה הָשִׁ֥יבָ/ה אֶתְ/הֶ֖ן בְּ/שָׁלֽוֹם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/013.yaml
  text: And the king of the Ammonites said to Jephthah’s messengers, “Because Israel took my land when it came up from Egypt, from the Arnon as far as the Jabbok and as far as the Jordan, now restore them peacefully.”
translation:
  language: hi
  text: तब अम्मोनियों के राजा ने यिप्तह के दूतों से कहा, “इसलिए कि जब इस्राएल मिस्र से निकलकर आया, तब उसने अर्नोन से यब्बोक तक और यरदन तक मेरा देश ले लिया था। इसलिए अब उसे शान्तिपूर्वक लौटा दो।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: इसलिए कि
  rationale: यह उत्तर में आरोप का कारण प्रस्तुत करता है; कारणसूचक संबंध को स्पष्ट रखते हुए मूल की संरचना और अंग्रेज़ी परामर्श-पाठ के ‘Because’ को सुरक्षित रखा गया है।
- source_word: אַרְצִי
  choice: मेरा देश
  rationale: אֶרֶץ यहाँ राजा द्वारा दावा किए गए भूभाग के अर्थ में है; ‘देश’ सामान्य आधुनिक हिन्दी में स्वाभाविक है।
- source_word: בַּעֲלוֹתוֹ מִמִּצְרַיִם
  choice: जब इस्राएल मिस्र से निकलकर आया
  rationale: शाब्दिक ‘ऊपर आया’ हिन्दी में अस्वाभाविक होता; यह निर्गमन और यात्रा का स्वाभाविक वर्णन है, बिना अतिरिक्त व्याख्या के।
- source_word: הָשִׁיבָה אֶתְהֶן
  choice: उसे ... लौटा दो
  rationale: हिब्रू में स्त्रीलिंग बहुवचन सर्वनाम संभवतः पहले बताए गए भूभागों को सामूहिक रूप से संदर्भित करता है; हिन्दी में ‘देश’ के लिए एकवचन ‘उसे’ सहज और स्पष्ट है।
- source_word: בְּשָׁלוֹם
  choice: शान्तिपूर्वक
  rationale: शान्ति से, अर्थात बिना युद्ध के लौटाने की माँग को संक्षेप और स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: अम्मोनी राजा के भू-अधिकार के दावे की प्रस्तुति
  choice: दावे को वक्ता के अपने शब्दों में ‘मेरा देश’ के रूप में रखा गया
  alternative: ऐसा शब्द जोड़ना कि यह दावा झूठा या विवादित था
  rationale: पद स्वयं केवल राजा का आरोप देता है; कथावाचक की ओर से उसकी सत्यता या असत्यता का निर्णय जोड़ना मूल से आगे जाना होगा।
- issue: כִּי का कारणसूचक बल
  choice: ‘इसलिए कि’ द्वारा कारणसूचक वाक्य रखा गया
  alternative: ‘इस्राएल ने...’ से स्वतंत्र कथन आरम्भ करना
  rationale: मूल में राजा पिछले प्रश्न के उत्तर का आधार बता रहा है; कारणसूचक तनाव सुरक्षित रहना चाहिए।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। स्थान-नामों के प्रचलित हिन्दी बाइबलीय रूप—अर्नोन, यब्बोक, यरदन—रखे गए हैं। कोई पादटिप्पणी आवश्यक नहीं समझी गई।
