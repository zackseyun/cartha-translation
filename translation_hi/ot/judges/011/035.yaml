  text: וַ/יְהִי֩ כִ/רְאוֹת֨/וֹ אוֹתָ֜/הּ וַ/יִּקְרַ֣ע אֶת בְּגָדָ֗י/ו וַ/יֹּ֨אמֶר֙ אֲהָ֤הּ בִּתִּ/י֙ הַכְרֵ֣עַ הִכְרַעְתִּ֔/נִי וְ/אַ֖תְּ הָיִ֣יתְ בְּ/עֹֽכְרָ֑/י וְ/אָנֹכִ֗י פָּצִ֤יתִי פִ/י֙ אֶל יְהוָ֔ה וְ/לֹ֥א אוּכַ֖ל לָ/שֽׁוּב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/035.yaml
  text: And when he saw her[a], he tore his clothes and said, “Alas, my daughter! You have brought me very low, and you have become the cause of my trouble. For I have opened my mouth to Yahweh, and I cannot turn back.”
translation:
  language: hi
  text: जब उसने उसे देखा, तो उसने अपने कपड़े फाड़े और कहा, “हाय, मेरी बेटी! तूने मुझे पूरी तरह झुका दिया है, और तू भी मुझे संकट में डालने वालों में से एक हो गई है। मैंने याहवे के सामने अपना मुँह खोला है[a], और अब मैं पीछे नहीं हट सकता।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात्, “मैंने याहवे से मन्नत मानी है।” इब्रानी में शाब्दिक रूप से, “मैंने अपना मुँह याहवे की ओर खोला है।”
    reason: मूल इब्रानी मुहावरे का प्रसंगानुसार स्पष्ट अर्थ बताने और उसके दिशासूचक शाब्दिक रूप को सटीक रूप से दर्शाने के लिए।
lexical_decisions:
- source_word: וַיְהִי כִרְאוֹתוֹ אוֹתָהּ
  choice: जब उसने उसे देखा
  rationale: इब्रानी कथात्मक सूत्र को स्वाभाविक हिन्दी कालवाचक उपवाक्य के रूप में व्यक्त किया गया है; अलग से “ऐसा हुआ” जोड़ना यहाँ अनावश्यक रूप से शब्दशः होता।
- source_word: וַיִּקְרַע אֶת־בְּגָדָיו
  choice: उसने अपने कपड़े फाड़े
  rationale: यह शोक और गहरे व्याकुलता की प्रचलित इब्रानी अभिव्यक्ति है; “कपड़े” आधुनिक हिन्दी में स्वाभाविक है और क्रिया को यथावत रखता है।
- source_word: אֲהָהּ בִּתִּי
  choice: हाय, मेरी बेटी!
  rationale: “हाय” दुःख और स्तब्धता की पुकार को गरिमापूर्ण और सहज हिन्दी में व्यक्त करता है।
- source_word: הַכְרֵעַ הִכְרַעְתִּנִי
  choice: तूने मुझे पूरी तरह झुका दिया है
  rationale: धातु के साथ प्रयुक्त infinitive absolute तीव्रता प्रकट करता है। “पूरी तरह” उस बल को और “झुका दिया” मूल बिंब को बनाए रखता है, बिना इसे केवल अपमान या नैतिक दोष में बदलने के।
- source_word: וְאַתְּ הָיִיתְ בְּעֹכְרָי
  choice: तू भी मुझे संकट में डालनेवालों में से एक हो गई है
  rationale: रूप בְּעֹכְרָי का निकट अर्थ “मुझे संकट में डालनेवालों में” है। यह अनुवाद पुत्री को संकट का कारण बताने वाले भाव को रखता है, पर मूल के बहुवचन/समूह-संबंधी रूप को मिटाता नहीं।
- source_word: וְאָנֹכִי פָצִיתִי פִי אֶל־יְהוָה
  choice: मैंने याहवे के सामने अपना मुँह खोला है
  rationale: मूल का शाब्दिक और गंभीर मुहावरा रखा गया है; प्रसंग में यह मन्नत के लिए की गई प्रतिज्ञात्मक वाणी को सूचित करता है। स्पष्ट अर्थ पादटिप्पणी में दिया गया है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को हिन्दी देवनागरी में लिप्यंतरित किया गया है, शीर्षक से प्रतिस्थापित नहीं।
- source_word: וְלֹא אוּכַל לָשׁוּב
  choice: और अब मैं पीछे नहीं हट सकता
  rationale: שׁוב यहाँ कही हुई प्रतिज्ञा से लौटने का भाव देता है। “पीछे नहीं हट सकता” हिन्दी में स्वाभाविक है और जानबूझकर प्रतिज्ञा वापस लेने की व्याख्या को अत्यधिक स्पष्ट नहीं करता।
theological_decisions:
- issue: यिप्तह के कथन को मुख्य पाठ में स्पष्ट रूप से मन्नत कहना या मूल मुहावरा बनाए रखना
  choice: “मैंने याहवे के सामने अपना मुँह खोला है” मूल मुहावरे के रूप में रखा गया है।
  alternative: “मैंने याहवे से मन्नत मानी है” या “मैंने याहवे को वचन दिया है।”
  rationale: प्रसंग निस्संदेह मन्नत से संबंधित है, किंतु इब्रानी पाठ अधिक चित्रात्मक और गंभीर अभिव्यक्ति का उपयोग करता है। मुख्य पाठ में उसे बनाए रखना और स्पष्ट अर्थ पादटिप्पणी में देना अर्थ और रूप दोनों का सम्मान करता है।
- issue: यिप्तह के दुःख और अपनी बेटी पर लगाए गए आरोप की तीव्रता
  choice: “पूरी तरह झुका दिया” और “संकट में डालनेवालों में से एक” रखा गया है।
  alternative: “तूने मुझे बरबाद कर दिया” या “तू ही मेरे संकट का कारण बन गई है।”
  rationale: मूल में तीव्र व्यथा और बेटी को संकट से जोड़ना दोनों हैं, पर “बरबाद कर दिया” अंतिम विनाश या अधिक कठोर नैतिक आरोप सुझा सकता है। चुनी हुई भाषा भावनात्मक बल और मूल की संरचना को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली अपनाई गई है। पिता-पुत्री के सीधे संबोधन में “तू” मूल के एकवचन निकट संबोधन और भावनात्मक तीव्रता को व्यक्त करता है। पादटिप्पणी-चिह्न उसी वाक्यांश के बाद रखा गया है जिसे वह स्पष्ट करता है।
