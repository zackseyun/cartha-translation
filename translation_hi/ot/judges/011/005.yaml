base_translation:
  language: en
  yaml_path: translation/ot/judges/011/005.yaml
  text: And when the Ammonites fought against Israel[a], the elders of Gilead went to bring Jephthah from the land of Tob.
translation:
  language: hi
  text: और जब अम्मोनियों ने इस्राएल से युद्ध किया, तब गिलाद के पुरनिए यिप्तह को तोब देश से ले आने[a] के लिए गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘लेने’। इब्रानी क्रिया का सामान्य अर्थ ‘लेना’ है, पर यहाँ भाव यिप्तह को वहाँ से अपने साथ ले आने का है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: और जब
  rationale: यह इब्रानी कथात्मक सूत्र अगले घटनाक्रम का समय बताता है। ‘और जब’ इसके कालगत और क्रमिक भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: נִלְחֲמוּ
  choice: युद्ध किया
  rationale: यहाँ לחם का निफ़अल रूप युद्ध में भिड़ने का अर्थ देता है। ‘युद्ध किया’ वर्तमान मानक हिन्दी में स्पष्ट और प्रसंगानुकूल है।
- source_word: בְנֵי עַמּוֹן
  choice: अम्मोनियों
  rationale: यह अम्मोन जाति के लोगों के लिए प्रचलित जातिवाचक पद है; शाब्दिक ‘अम्मोन के पुत्रों’ की अपेक्षा ‘अम्मोनियों’ अधिक स्वाभाविक है।
- source_word: עִם יִשְׂרָאֵל
  choice: इस्राएल से
  rationale: עִם का मूल भाव ‘साथ’ है, पर נלחם के साथ यह उस पक्ष को सूचित करता है जिससे युद्ध किया जाता है। हिन्दी में ‘इस्राएल से युद्ध किया’ विरोधी संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: זִקְנֵי גִלְעָד
  choice: गिलाद के पुरनिए
  rationale: यह गिलाद के मान्य वरिष्ठ अगुवों की ओर संकेत करने वाली संबंध-रचना है। ‘पुरनिए’ आयु और सामुदायिक नेतृत्व दोनों भावों को बनाए रखता है।
- source_word: לָקַחַת
  choice: ले आने
  rationale: לקח सामान्यतः ‘लेना’ है, लेकिन यहाँ पुरनिए यिप्तह के पास जाकर उसे अपने साथ वापस लाने वाले हैं। ‘ले आने’ प्रसंगगत दिशा को स्वाभाविक हिन्दी में स्पष्ट करता है, जबकि अधिक शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: אֶת יִפְתָּח
  choice: यिप्तह को
  rationale: אֶת निश्चित कर्म का चिह्न है और יִפְתָּח व्यक्ति का नाम; हिन्दी में कर्मचिह्न ‘को’ के साथ नाम प्रस्तुत किया गया है।
- source_word: מֵאֶרֶץ טוֹב
  choice: तोब देश से
  rationale: אֶרֶץ यहाँ किसी भूभाग या प्रदेश को दर्शाता है। ‘तोब देश’ स्थाननाम को बनाए रखते हुए सहज हिन्दी देता है।
