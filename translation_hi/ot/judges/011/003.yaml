base_translation:
  language: en
  yaml_path: translation/ot/judges/011/003.yaml
  text: So Jephthah fled from his brothers and lived in the land of Tob[a], and worthless men gathered around Jephthah and went out with him.
translation:
  language: hi
  text: तब यिप्तह अपने भाइयों से भाग गया और तोब प्रदेश में रहने लगा। कुछ निकम्मे लोग[a] यिप्तह के पास इकट्ठे हो गए और उसके साथ निकल गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ “खाली लोग”; यह इब्रानी मुहावरा केवल निर्धन लोगों के लिए नहीं, बल्कि निकृष्ट चरित्र या निम्न सामाजिक प्रतिष्ठा वाले लोगों के लिए प्रयुक्त होता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבְרַח
  choice: भाग गया
  rationale: क्रिया ברח शत्रुता या संकट से भागने को व्यक्त करती है; आधुनिक हिन्दी में ‘भाग गया’ स्वाभाविक और सटीक है।
- source_word: מִפְּנֵי אֶחָיו
  choice: अपने भाइयों के सामने से
  rationale: यह मूल इब्रानी मुहावरे के स्थानिक रूप को बनाए रखता है और प्रसंग में भाइयों के कारण वहाँ से भागने का भाव स्पष्ट करता है।
- source_word: וַיֵּשֶׁב
  choice: रहने लगा
  rationale: ישב यहाँ निवास करने के अर्थ में है; ‘रहने लगा’ नए स्थान पर निवास आरम्भ करने का स्वाभाविक कथात्मक रूप है, पर स्थायी बसावट अनिवार्य नहीं बनाता।
- source_word: בְּאֶרֶץ טוֹב
  choice: तोब नामक प्रदेश में
  rationale: אֶרֶץ यहाँ भूभाग या प्रदेश को दर्शाता है; ‘नामक’ से आधुनिक पाठक के लिए स्पष्ट होता है कि तोब एक स्थान का नाम है।
- source_word: וַיִּתְלַקְּטוּ אֶל יִפְתָּח
  choice: यिप्तह के पास इकट्ठे हो गए
  rationale: हित्पएल रूप स्वयं एकत्र होने और אֶל किसी की ओर या उसके पास आने को व्यक्त करता है; यह हिन्दी में स्वाभाविक रहते हुए मूल दिशा-बोध को बनाए रखता है।
- source_word: אֲנָשִׁים רֵיקִים
  choice: निकम्मे लोग
  rationale: शाब्दिक अर्थ ‘खाली लोग’ है, पर यह मुहावरा निम्न चरित्र या प्रतिष्ठा वाले, अनुपयोगी समझे जाने वाले लोगों के लिए है। ‘निकम्मे’ इस निंदात्मक भाव को व्यक्त करता है, बिना उन्हें स्पष्टतः अपराधी ठहराए।
- source_word: וַיֵּצְאוּ עִמּוֹ
  choice: उसके साथ निकलते थे
  rationale: मूल में उनके बाहर जाने का उद्देश्य नहीं बताया गया। ‘निकलते थे’ साथ की गतिविधि का संकेत देता है, पर छापेमारी जैसी अनिर्दिष्ट बात नहीं जोड़ता।
