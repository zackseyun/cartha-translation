  text: וַ/תֹּ֣אמֶר אֵלָ֗י/ו אָבִ/י֙ פָּצִ֤יתָה אֶת פִּ֨י/ךָ֙ אֶל יְהוָ֔ה עֲשֵׂ֣ה לִ֔/י כַּ/אֲשֶׁ֖ר יָצָ֣א מִ/פִּ֑י/ךָ אַחֲרֵ֡י אֲשֶׁ֣ר עָשָׂה֩ לְ/ךָ֙ יְהוָ֧ה נְקָמ֛וֹת מֵ/אֹיְבֶ֖י/ךָ מִ/בְּנֵ֥י עַמּֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/036.yaml
  text: And she said to him[a], “My father, you have opened your mouth to Yahweh; do to me according to what has gone out from your mouth, since Yahweh has taken vengeance for you on your enemies[b], on the sons of Ammon.”
translation:
  language: hi
  text: उसने उससे कहा, “मेरे पिता, आपने याहवे के लिए अपना मुँह खोला है[a]; इसलिए जैसा आपके मुँह से निकला है, वैसा ही मेरे साथ कीजिए, क्योंकि याहवे ने आपके शत्रुओं, अर्थात् अम्मोनियों[b], से आपके लिए बदला लिया है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “याहवे के लिए अपना मुँह खोलना” एक इब्रानी मुहावरा है, जिसका अर्थ गंभीर रूप से बोलकर मन्नत बाँधना है।
    reason: cultural_note
  - marker: b
    text: शाब्दिक रूप से “अम्मोन के पुत्रों से”; यहाँ अम्मोनी लोग उन शत्रुओं की पहचान करते हैं जिनसे याहवे ने बदला लिया।
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּצִיתָה אֶת־פִּיךָ
  choice: अपना मुँह खोला है
  rationale: इब्रानी मुहावरे की ठोस छवि और उसके गंभीर स्वर को बनाए रखा गया है; संदर्भ और पादटिप्पणी स्पष्ट करते हैं कि इसका आशय गंभीर मौखिक मन्नत बाँधने से है।
- source_word: יְהוָה
  choice: याहवे
  rationale: उपाधि से प्रतिस्थापित करने के बजाय परमेश्वर के व्यक्तिगत नाम की प्रचलित हिंदी लिप्यंतरण-रूप में प्रस्तुति की गई है।
- source_word: עֲשֵׂה לִי
  choice: मेरे साथ कीजिए
  rationale: यह स्वाभाविक हिंदी में पुत्री द्वारा स्वयं को पिता की कही हुई बात के परिणाम के अधीन करने को व्यक्त करता है, पर मन्नत किस प्रकार पूरी होगी, यह निर्धारित नहीं करता।
- source_word: כַּאֲשֶׁר יָצָא מִפִּיךָ
  choice: जैसा आपके मुँह से निकला है
  rationale: मुँह से निकले वचन की बाध्यकारी शक्ति दिखाने वाली इब्रानी अभिव्यक्ति को बनाए रखा गया है और इसे पहले वाले ‘मुँह खोला’ से जोड़ा गया है।
- source_word: אַחֲרֵי אֲשֶׁר
  choice: क्योंकि
  rationale: यहाँ पदबंध मात्र कालक्रम नहीं, बल्कि पुत्री के कथन का कारण प्रस्तुत करता है।
- source_word: נְקָמוֹת
  choice: बदला लिया है
  rationale: बहुवचन इब्रानी संज्ञा प्रतिशोध के कार्यों को व्यक्त करती है; हिंदी में क्रियात्मक एकवचन अभिव्यक्ति अधिक स्वाभाविक रहते हुए प्रतिशोध का भाव बनाए रखती है।
- source_word: מֵאֹיְבֶיךָ
  choice: आपके शत्रुओं से
  rationale: इब्रानी संबंधसूचक अव्यय का ‘से’ द्वारा निकट और स्वाभाविक हिंदी प्रतिरूप दिया गया है।
- source_word: מִבְּנֵי עַמּוֹן
  choice: अम्मोनियों
  rationale: ‘अम्मोन के पुत्रों’ का अर्थ आधुनिक हिंदी में स्वाभाविक जातिनाम ‘अम्मोनी’ से स्पष्ट किया गया है; शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: यिप्तह की मन्नत का स्वरूप और पुत्री की स्वीकृति
  choice: पुत्री के शब्दों को इस तरह प्रस्तुत किया गया है कि वह पिता की मन्नत के परिणाम को स्वीकार करती है, लेकिन उसके पूरा होने का स्वरूप इस पद में निश्चित नहीं किया जाता।
  alternative: इसे या तो शाब्दिक बलिदान के लिए मृत्यु की स्वीकृति, या आजीवन कुँवारेपन/सेवा की स्वीकृति के रूप में स्पष्ट करना।
  rationale: यह पद स्वयं केवल मन्नत के अनुसार उसके साथ किए जाने की बात कहता है; वह मन्नत कैसे पूरी होगी, यह इस पंक्ति में निर्दिष्ट नहीं है। इसलिए विवादित व्याख्या को अनुवाद में नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिंदी का सहज, गरिमापूर्ण संबोधन रखा गया है। ‘आप’ और ‘कीजिए’ पुत्री द्वारा पिता को दिए गए सम्मान को व्यक्त करते हैं। इब्रानी के दोहराए हुए ‘मुँह’ वाले बिंब को जानबूझकर सुरक्षित रखा गया है, जबकि जातिनाम को पाठ में स्वाभाविक ‘अम्मोनियों’ किया गया है।
