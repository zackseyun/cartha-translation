source:
  edition: WLC
  text: וַ/תְּהִ֤י עַל יִפְתָּח֙ ר֣וּחַ יְהוָ֔ה וַ/יַּעֲבֹ֥ר אֶת הַ/גִּלְעָ֖ד וְ/אֶת מְנַשֶּׁ֑ה וַֽ/יַּעֲבֹר֙ אֶת מִצְפֵּ֣ה גִלְעָ֔ד וּ/מִ/מִּצְפֵּ֣ה גִלְעָ֔ד עָבַ֖ר בְּנֵ֥י עַמּֽוֹן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/029.yaml
  text: Then the Spirit of Yahweh came upon Jephthah[a], and he passed through Gilead and Manasseh. He passed through Mizpah of Gilead, and from Mizpah of Gilead he passed on to the Ammonites.
translation:
  language: hi
  text: तब याहवे का आत्मा यिप्तह पर आया। वह गिलाद और मनश्शे से होकर गया; फिर वह गिलाद के मिस्पा से होकर गया, और गिलाद के मिस्पा से अम्मोनियों की ओर बढ़ा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अम्मोनियों की ओर पार गया।” इब्रानी क्रिया का अर्थ प्रसंग के अनुसार किसी स्थान से होकर जाना, पार जाना या आगे बढ़ना हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּהִי עַל יִפְתָּח רוּחַ יְהוָה
  choice: तब याहवे का आत्मा यिप्तह पर आया
  rationale: यह इब्रानी मुहावरा कथा के इस प्रसंग में परमेश्वर द्वारा सामर्थ्य दिए जाने को व्यक्त करता है। ‘पर आया’ घटना के आरंभिक और गतिशील भाव को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: יִפְתָּח
  choice: यिप्तह
  rationale: व्यक्तिनाम के इब्रानी उच्चारण के निकट प्रचलित हिन्दी लिप्यंतरण।
- source_word: וַיַּעֲבֹר אֶת הַגִּלְעָד וְאֶת מְנַשֶּׁה
  choice: वह गिलाद और मनश्शे से होकर गया
  rationale: क्षेत्रों को कर्म के रूप में लेने पर עבר यहाँ उनके बीच से होकर जाने या उन्हें पार करने का बोध देता है; हिन्दी में ‘से होकर गया’ स्पष्ट और सहज है।
- source_word: מִצְפֵּה גִלְעָד
  choice: गिलाद का मिस्पा
  rationale: यह स्थाननाम है; इसलिए मूल अर्थ ‘पहरे की मीनार’ का अनुवाद करने के बजाय नाम का लिप्यंतरण किया गया है और संबंध-संरचना को ‘गिलाद का’ से व्यक्त किया गया है।
- source_word: עָבַר בְּנֵי עַמּוֹן
  choice: अम्मोनियों की ओर बढ़ा
  rationale: इस असामान्य संक्षिप्त रचना में עבר आगे जाने/पार जाने का और בני עמון गंतव्य अथवा विरोधी पक्ष का संकेत देता है। ‘की ओर बढ़ा’ सैन्य प्रसंग के अनुकूल है, पर तत्काल आक्रमण का अर्थ नहीं जोड़ता।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में वाचा का विशिष्ट नाम है। ‘याहवे’ उसे उपाधि से बदलने के बजाय नाम के रूप में प्रस्तुत करता है।
- issue: רוּחַ יְהוָה का स्वरूप
  choice: याहवे का आत्मा
  alternative: याहवे की वायु/श्वास
  rationale: न्यायियों के कथा-प्रसंग में यह पद नेता पर आने वाली ईश्वरीय सामर्थ्यकारी उपस्थिति को दर्शाता है। अनुवाद यह भाव रखता है, पर इससे आगे कोई व्यवस्थित धर्मवैज्ञानिक दावा नहीं जोड़ता।
- issue: अंतिम עָבַר का आशय
  choice: अम्मोनियों की ओर बढ़ा
  alternative: अम्मोनियों के पास पार गया; अम्मोनियों के विरुद्ध चढ़ गया
  rationale: मूल क्रिया गति को स्पष्ट करती है, किंतु अकेले अपने बल पर आक्रमण को अनिवार्य नहीं बनाती। मुख्य पाठ दिशा और प्रगति को व्यक्त करता है तथा पादटिप्पणी वास्तविक शाब्दिक विकल्प सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथा-शैली अपनाई गई है। दोहराए गए स्थाननामों को मूल की क्रमिक यात्रा स्पष्ट रखने के लिए बनाए रखा गया है। पादटिप्पणी-चिह्न उसी अंतिम वाक्यांश पर रखा गया है जहाँ עבר की वास्तविक अर्थगत अनिश्चितता आती है।
