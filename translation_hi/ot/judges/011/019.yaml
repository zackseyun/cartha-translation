source:
  edition: WLC
  text: וַ/יִּשְׁלַ֤ח יִשְׂרָאֵל֙ מַלְאָכִ֔ים אֶל סִיח֥וֹן מֶֽלֶךְ הָ/אֱמֹרִ֖י מֶ֣לֶךְ חֶשְׁבּ֑וֹן וַ/יֹּ֤אמֶר ל/וֹ֙ יִשְׂרָאֵ֔ל נַעְבְּרָה נָּ֥א בְ/אַרְצְ/ךָ֖ עַד מְקוֹמִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/019.yaml
  text: Then Israel sent messengers to Sihon king of the Amorites[a], king of Heshbon, and Israel said to him[b], “Please let us pass through your land to our place.”
translation:
  language: hi
  text: तब इस्राएल ने एमोरियों के राजा, हेशबोन के राजा सीहोन के पास दूतों[a] को भेजा। इस्राएल ने उससे कहा, “कृपया हमें अपने देश से होकर मेरे स्थान[b] तक जाने दें।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ “दूतों” का अर्थ राजनयिक प्रतिनिधियों से है; इसका अनुवाद “संदेशवाहकों” के रूप में भी किया जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: मूल इब्रानी में शाब्दिक रूप से “मेरे स्थान” है। यहाँ इस्राएल एक सामूहिक इकाई के रूप में एकवचन में बोल रहा हो सकता है; संदर्भ में “हमारे स्थान” भी समझा जा सकता है।
    reason: textual_ambiguity
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: भेजा
  rationale: इब्रानी आख्यान में यह क्रिया किसी को भेजने की सामान्य अभिव्यक्ति है; हिंदी में ‘भेजा’ स्वाभाविक और सटीक है।
- source_word: מַלְאָכִים
  choice: दूतों
  rationale: यहाँ राजनयिक संदर्भ में मनुष्य प्रतिनिधि अभिप्रेत हैं, स्वर्गदूत नहीं।
- source_word: מֶלֶךְ הָאֱמֹרִי מֶלֶךְ חֶשְׁבּוֹן
  choice: एमोरियों के राजा, हेशबोन के राजा
  rationale: दोनों उपाधियाँ रखी गई हैं, ताकि सीहोन की जातीय और राजकीय पहचान मूल पाठ के अनुसार बनी रहे।
- source_word: וַיֹּאמֶר לוֹ יִשְׂרָאֵל
  choice: इस्राएल ने उससे कहा
  rationale: मूल पाठ में ‘इस्राएल’ दोबारा स्पष्ट रूप से आता है; हिंदी में भी यह पुनरुक्ति सुरक्षित रखी गई है।
- source_word: נַעְבְּרָה נָּא
  choice: कृपया हमें ... जाने दे
  rationale: आग्रहसूचक क्रियारूप और נָא मिलकर विनम्र अनुमति-याचना व्यक्त करते हैं।
- source_word: בְאַרְצְךָ
  choice: अपने देश से होकर
  rationale: עבר के साथ यहाँ किसी भूभाग के भीतर से होकर आगे बढ़ने का अर्थ है। संबोधित राजा के लिए हिंदी का ‘अपने’ स्वाभाविक रूप से ‘तुम्हारे’ का अर्थ देता है।
- source_word: עַד מְקוֹמִי
  choice: मेरे स्थान तक
  rationale: मसोरेटिक पाठ में प्रथम पुरुष एकवचन प्रत्यय स्पष्ट है। सामूहिक इस्राएल के बहुवचन आग्रह के साथ उपस्थित इस एकवचन को सहज बनाने के लिए ‘हमारे’ नहीं किया गया।
theological_decisions:
- issue: सामूहिक ‘इस्राएल’ की वाणी में बहुवचन आग्रह और एकवचन अधिकारसूचक सर्वनाम
  choice: ‘हमें ... मेरे स्थान तक’ की मूल तनावपूर्ण रचना सुरक्षित रखी
  alternative: ‘हमें ... हमारे स्थान तक’
  rationale: מְקוֹמִי स्पष्ट रूप से ‘मेरा स्थान’ है। ‘हमारे’ अधिक सहज हिंदी होती, पर वह मूल पाठ की वास्तविक व्याकरणिक असंगति अथवा सामूहिक एकवचन को चुपचाप मिटा देती।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। राजकीय उपाधियों की पुनरावृत्ति और ‘हमें ... मेरे’ का तनाव मूल इब्रानी के कारण जानबूझकर सुरक्षित रखा गया है।
