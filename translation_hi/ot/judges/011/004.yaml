- source_word: בְּנֵי עַמּוֹן
  choice: अम्मोनियों
  rationale: शाब्दिक अर्थ ‘अम्मोन के पुत्र’ है, पर यहाँ यह अम्मोन नामक जाति के लोगों का प्रचलित जातिनाम है।
- source_word: עִם יִשְׂרָאֵל
  choice: इस्राएल से
  rationale: עִם का मूल अर्थ ‘के साथ’ है, किंतु לחם के युद्ध-संदर्भ में यह विरोधी पक्ष को चिह्नित करता है; हिन्दी में ‘से युद्ध किया’ स्वाभाविक रूप से यही संबंध बताता है।
