id: JDG.11.17
reference: Judges 11:17
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֣ח יִשְׂרָאֵ֣ל מַלְאָכִ֣ים אֶל מֶלֶךְ֩ אֱד֨וֹם לֵ/אמֹ֜ר אֶעְבְּרָה נָּ֣א בְ/אַרְצֶ֗/ךָ וְ/לֹ֤א שָׁמַע֙ מֶ֣לֶךְ אֱד֔וֹם וְ/גַ֨ם אֶל מֶ֧לֶךְ מוֹאָ֛ב שָׁלַ֖ח וְ/לֹ֣א אָבָ֑ה וַ/יֵּ֥שֶׁב יִשְׂרָאֵ֖ל בְּ/קָדֵֽשׁ׀־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/017.yaml
  text: Then Israel sent messengers to the king of Edom[a], saying, ‘Please let us pass through your land,’ but the king of Edom did not listen. And he also sent to the king of Moab, but he was unwilling[b], so Israel remained at Kadesh.
translation:
  language: hi
  text: तब इस्राएल ने एदोम के राजा के पास दूत भेजकर कहा, “कृपया मुझे अपने देश से होकर जाने दे[a]।” पर एदोम के राजा ने उसकी बात नहीं मानी। इस्राएल ने मोआब के राजा के पास भी दूत भेजे, पर वह राज़ी नहीं हुआ[b]। इसलिए इस्राएल कादेश में ही रहा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से “मुझे जाने दे” है; यहाँ इस्राएल एक पूरे समुदाय के रूप में एकवचन में बोल रहा है। कुछ अनुवाद “हमें जाने दे” कहते हैं।
    reason: lexical_alternative
  - marker: b
    text: या “उसने सहमति नहीं दी” अथवा “उसने इनकार कर दिया।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: भेजे
  rationale: सामान्य इब्रानी कथात्मक क्रिया को सरल भूतकाल में स्वाभाविक रूप से व्यक्त करता है।
- source_word: מַלְאָכִים
  choice: दूत
  rationale: यह राजनयिक मानवीय संदर्भ है; इसलिए यहाँ अर्थ संदेशवाहक या प्रतिनिधि है, स्वर्गदूत नहीं।
- source_word: אֶעְבְּרָה נָּא
  choice: कृपया मुझे ... होकर जाने दे
  rationale: प्रथम पुरुष एकवचन और נָא की विनम्र विनती को बनाए रखता है; इस्राएल यहाँ एक सामूहिक इकाई के रूप में बोल रहा है।
- source_word: בְאַרְצֶךָ
  choice: अपने देश से होकर
  rationale: यात्रा के संदर्भ में בְ और עבר मिलकर किसी भूभाग से होकर गुजरने का भाव देते हैं।
- source_word: וְלֹא שָׁמַע
  choice: उसकी बात नहीं मानी
  rationale: यहाँ שׁמע का अर्थ केवल सुनना नहीं, बल्कि अनुरोध पर ध्यान देकर उसे स्वीकार करना है।
- source_word: וְלֹא אָבָה
  choice: राज़ी नहीं हुआ
  rationale: אָבָה की इच्छा या सहमति न होने की अर्थ-छाया को सहज आधुनिक हिन्दी में व्यक्त करता है, बिना अनावश्यक कठोरता जोड़े।
- source_word: וַיֵּשֶׁב
  choice: में ही रहा
  rationale: यात्रा-वृत्तांत में लगातार उसी स्थान पर ठहरे रहने का भाव देता है और स्थायी बसावट का संकेत नहीं करता।
- source_word: בְּקָדֵשׁ
  choice: कादेश में
  rationale: स्थानवाचक नाम के साथ स्वाभाविक हिन्दी प्रयोग।
theological_decisions:
- issue: इस्राएल की सामूहिक वाणी में एकवचन
  choice: “मुझे” रखकर व्याकरणिक एकवचन सुरक्षित रखा गया
  alternative: “हमें”
  rationale: इब्रानी क्रिया प्रथम पुरुष एकवचन है और इस्राएल को एक सामूहिक इकाई के रूप में प्रस्तुत करती है; पादटिप्पणी आधुनिक पाठक के लिए इसे स्पष्ट करती है।
- issue: एदोम के राजा की प्रतिक्रिया
  choice: “उसकी बात नहीं मानी”
  alternative: “नहीं सुना”
  rationale: संदर्भ में बात सुनाई न देने के बजाय अनुरोध स्वीकार न करने का अर्थ है; अनुवाद इसी व्यावहारिक अर्थ को व्यक्त करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज कथात्मक शैली अपनाई गई है। “देश” राजकीय भूभाग के अर्थ में और “दूत” मानवीय राजनयिक प्रतिनिधियों के लिए प्रयुक्त है। सर्वनाम की संभावित अस्पष्टता घटाने के लिए दूसरे प्रेषण में “इस्राएल” दुबारा स्पष्ट किया गया है।
