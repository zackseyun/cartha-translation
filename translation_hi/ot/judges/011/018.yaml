  text: וַ/יֵּ֣לֶךְ בַּ/מִּדְבָּ֗ר וַ/יָּ֜סָב אֶת אֶ֤רֶץ אֱדוֹם֙ וְ/אֶת אֶ֣רֶץ מוֹאָ֔ב וַ/יָּבֹ֤א מִ/מִּזְרַח שֶׁ֨מֶשׁ֙ לְ/אֶ֣רֶץ מוֹאָ֔ב וַֽ/יַּחֲנ֖וּ/ן בְּ/עֵ֣בֶר אַרְנ֑וֹן וְ/לֹא בָ֨אוּ֙ בִּ/גְב֣וּל מוֹאָ֔ב כִּ֥י אַרְנ֖וֹן גְּב֥וּל מוֹאָֽב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/018.yaml
  text: Then he went through the wilderness and went around the land of Edom and the land of Moab[a], and came to the east side of the land of Moab, and they camped beyond the Arnon; but they did not enter the territory of Moab[b], for the Arnon was the border of Moab.
translation:
  language: hi
  text: तब वह वीराने से होकर गया और एदोम देश तथा मोआब देश का चक्कर लगाकर मोआब देश के पूर्व की ओर पहुँचा[a]। उन्होंने अर्नोन के पार डेरा डाला[b], लेकिन उन्होंने मोआब की सीमा में प्रवेश नहीं किया, क्योंकि अर्नोन मोआब की सीमा थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “सूर्योदय की ओर से मोआब देश की ओर आया,” अर्थात वह पूर्व की ओर से मोआब के पास पहुँचा।
    reason: lexical_alternative
  - marker: b
    text: या “अर्नोन की दूसरी ओर।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ בַּמִּדְבָּר
  choice: वह वीराने से होकर गया
  rationale: הלך का मूल अर्थ ‘जाना’ है और במדבר निर्जन, कम आबादी वाले भूभाग को दर्शाता है। ‘वीराने से होकर गया’ मार्ग का भाव स्वाभाविक हिंदी में व्यक्त करता है और इसे केवल रेतीला रेगिस्तान नहीं ठहराता।
- source_word: וַיָּסָב אֶת אֶרֶץ אֱדוֹם וְאֶת אֶרֶץ מוֹאָב
  choice: एदोम देश तथा मोआब देश का चक्कर लगाकर
  rationale: סבב यहाँ उन देशों के भीतर से जाने के बजाय उनके चारों ओर से रास्ता लेने का संकेत देता है। ‘चक्कर लगाकर’ इस भौगोलिक गति को संक्षिप्त और सहज ढंग से व्यक्त करता है।
- source_word: וַיָּבֹא מִמִּזְרַח שֶׁמֶשׁ לְאֶרֶץ מוֹאָב
  choice: मोआब देश के पूर्व की ओर पहुँचा
  rationale: शाब्दिक रूप ‘सूर्योदय की ओर से मोआब देश की ओर आया’ है। प्रसंग में यह मोआब की पूर्वी ओर से पहुँचने का संकेत देता है; मुख्य पाठ में स्वाभाविक भौगोलिक अभिव्यक्ति रखी गई और शाब्दिक रूप पाद-टिप्पणी में सुरक्षित है।
- source_word: וַיַּחֲנוּן
  choice: उन्होंने डेरा डाला
  rationale: חנה का अर्थ पड़ाव डालना या डेरा डालना है। इब्रानी में यहाँ एकवचन सामूहिक कर्ता से बहुवचन में परिवर्तन होता है, जिसे हिंदी में ‘उन्होंने’ द्वारा बनाए रखा गया है।
- source_word: בְּעֵבֶר אַרְנוֹן
  choice: अर्नोन के पार
  rationale: עבר किसी नदी या सीमा की दूसरी अथवा पार वाली ओर को दर्शाता है। ‘के पार’ दृष्टिकोण को अनावश्यक रूप से निश्चित किए बिना संक्षिप्त भौगोलिक अर्थ देता है।
- source_word: וְלֹא בָאוּ בִּגְבוּל מוֹאָב
  choice: वे मोआब की सीमा में प्रवेश नहीं किए
  rationale: גבול सीमा और उस सीमा से घिरे क्षेत्र—दोनों को सूचित कर सकता है। ‘सीमा में प्रवेश’ सीमा लाँघकर मोआबी भूभाग में जाने का व्यावहारिक अर्थ स्पष्ट करता है।
- source_word: כִּי אַרְנוֹן גְּבוּל מוֹאָב
  choice: क्योंकि अर्नोन मोआब की सीमा थी
  rationale: כי कारण बताता है और अंतिम नामवाचक वाक्य अर्नोन को मोआब की सीमा के रूप में पहचानता है। सरल हिंदी स्रोत की व्याख्यात्मक संरचना बनाए रखती है।
