translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। स्थलनामों को प्रचलित हिंदी बाइबल रूपों में रखा गया है। एकवचन ‘वह’ से बहुवचन ‘उन्होंने/वे’ में स्रोत-पाठ का बदलाव सुरक्षित रखा गया है।
