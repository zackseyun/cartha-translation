  yaml_path: translation/ot/judges/011/006.yaml
  text: And they said to Jephthah[a], “Come and be our commander, and let us fight against the Ammonites.”
translation:
  language: hi
  text: तब उन्होंने यिप्तह से कहा, “आओ, हमारे सेनापति बनो, और हम अम्मोनियों[a] से युद्ध करें।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से “अम्मोन के पुत्र”; यह अम्मोनियों के लिए प्रचलित जातीय संबोधन है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: तब उन्होंने कहा
  rationale: वय्यिक्तोल रूप कथा की अगली घटना को आगे बढ़ाता है; आधुनिक हिन्दी में ‘तब’ इस क्रम को सहज रूप से व्यक्त करता है।
- source_word: לְיִפְתָּח
  choice: यिप्तह से
  rationale: व्यक्तिनाम יִפְתָּח का निकट देवनागरी लिप्यंतरण किया गया है।
- source_word: לְכָה
  choice: आओ
  rationale: इस प्रत्यक्ष संबोधन में הלך का आज्ञार्थक रूप बुलावे या निमंत्रण के अर्थ में है।
- source_word: וְהָיִיתָה לָּנוּ לְקָצִין
  choice: हमारे सेनापति बनो
  rationale: शाब्दिक ‘हमारे लिए कात्सीन हो जाओ’ के स्थान पर यह स्वाभाविक हिन्दी है; युद्ध के तत्काल प्रसंग में קָצִין के सैन्य नेतृत्व का भाव स्पष्ट है।
- source_word: וְנִלָּחֲמָה
  choice: और हम ... युद्ध करें
  rationale: प्रथम पुरुष बहुवचन कोहोर्टेटिव को उसके आग्रहात्मक अर्थ सहित रखा गया है; ‘और’ मूल अनुक्रम को बनाए रखता है और अनिवार्य रूप से उद्देश्य-संबंध नहीं जोड़ता।
- source_word: בִּבְנֵי עַמּוֹן
  choice: अम्मोनियों से
  rationale: לחם के साथ ב युद्ध के विरोधी को चिह्नित करता है। ‘अम्मोनी’ मानक जातीय पद है; मूल इब्रानी अभिव्यक्ति का उल्लेख पादटिप्पणी में है।
