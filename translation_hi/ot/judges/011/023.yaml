source:
  edition: WLC
  text: וְ/עַתָּ֞ה יְהוָ֣ה אֱלֹהֵ֣י יִשְׂרָאֵ֗ל הוֹרִישׁ֙ אֶת הָ֣/אֱמֹרִ֔י מִ/פְּנֵ֖י עַמּ֣/וֹ יִשְׂרָאֵ֑ל וְ/אַתָּ֖ה תִּירָשֶֽׁ/נּוּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/023.yaml
  text: And now Yahweh[a], the God of Israel, has dispossessed the Amorites from before his people Israel; and are you to possess it?
translation:
  language: hi
  text: और अब इस्राएल के परमेश्वर याहवे ने अपने लोगों इस्राएल के सामने से एमोरियों को बेदखल कर दिया है; तो क्या तुम उस देश पर अधिकार करोगे?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसे अपने अधिकार में लोगे?” अथवा “उसे विरासत में पाओगे?” इब्रानी क्रिया भूमि को पाने या उस पर अधिकार करने—दोनों अर्थ दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: और अब
  rationale: यह पहले दिए गए तर्क से निष्कर्ष की ओर बढ़ाने वाला संवाद-सूचक है; ‘और अब’ संयोजकता और अलंकारिक संक्रमण दोनों बनाए रखता है।
- source_word: יְהוָה
  choice: यहवे
  rationale: चतुरक्षरीय दिव्य नाम को किसी उपाधि से बदलने के बजाय आधुनिक हिन्दी में उसके प्रचलित लिप्यंतरण से व्यक्त किया गया है।
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: इस्राएल के परमेश्वर
  rationale: यह संबंधवाचक पदबंध यहवे की पहचान इस्राएल के परमेश्वर के रूप में करता है; हिन्दी में यह सीधा और स्वाभाविक है।
- source_word: הוֹרִישׁ
  choice: बेदखल कर दिया है
  rationale: हिफ़ील रूप यहाँ किसी जाति को भूमि के अधिकार से हटाने का अर्थ देता है। ‘बेदखल’ भूमि-अधिकार का भाव ‘निकाल दिया’ से अधिक स्पष्ट रखता है।
- source_word: הָאֱמֹרִי
  choice: एमोरियों
  rationale: इब्रानी में एकवचन जातिवाचक रूप सामूहिक अर्थ में है; हिन्दी में जनसमूह के लिए बहुवचन स्वाभाविक है।
- source_word: מִפְּנֵי
  choice: के सामने से
  rationale: इब्रानी स्थानिक मुहावरे को सहज हिन्दी में रखते हुए इस्राएल की उपस्थिति और क्षेत्र से हटाए जाने का भाव व्यक्त करता है।
- source_word: עַמּוֹ יִשְׂרָאֵל
  choice: अपने लोगों, इस्राएल, के
  rationale: सर्वनाम यहवे की ओर संकेत करता है और ‘इस्राएल’ ‘अपने लोगों’ की समानाधिकरण पहचान है। विरामचिह्न इस संबंध को स्पष्ट करते हैं।
- source_word: וְאַתָּה
  choice: तो क्या तुम
  rationale: स्वतंत्र सर्वनाम का जोर और प्रश्न का चुनौतीपूर्ण स्वर ‘क्या तुम’ से सामने आता है; ‘तो’ पिछले कथन से निष्कर्षात्मक संबंध दिखाता है।
- source_word: תִּירָשֶׁנּוּ
  choice: उस देश पर अधिकार करोगे
  rationale: काल रूप अलंकारिक प्रश्न में दावेदारी/अधिकार ग्रहण करने का भाव देता है। एकवचन कर्म-प्रत्यय का आशय एमोरी लोग नहीं, उनके अधिकार वाला देश है; ‘उस देश’ हिन्दी में इसे स्वाभाविक रूप से स्पष्ट करता है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहवे
  alternative: यहोवा
  rationale: मूल पाठ में व्यक्तिगत दिव्य नाम सीधे आया है। ‘यहवे’ उसे ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित किए बिना प्रस्तुत करता है।
- issue: יִרַשׁ की भूमि-संबंधी अर्थ-व्याप्ति
  choice: अधिकार करना
  alternative: विरासत में पाना
  rationale: संदर्भ दो जातियों के भूक्षेत्र पर दावे का है। ‘अधिकार करना’ ग्रहण या कब्जा करने के अर्थ को रखता है, जबकि ‘विरासत’ अकेले चुनने पर पारिवारिक उत्तराधिकार का अनपेक्षित भाव प्रबल हो सकता है; विकल्प पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और मौखिक तर्क के अनुकूल रखी गई है। ‘बेदखल’ भूमि-अधिकार का सटीक कानूनी-सामाजिक भाव देता है, और अंतिम प्रश्न का चुनौतीपूर्ण बल बनाए रखा गया है।
