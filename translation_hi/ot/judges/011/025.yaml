source:
  edition: WLC
  text: וְ/עַתָּ֗ה הֲ/ט֥וֹב טוֹב֙ אַתָּ֔ה מִ/בָּלָ֥ק בֶּן צִפּ֖וֹר מֶ֣לֶךְ מוֹאָ֑ב הֲ/ר֥וֹב רָב֙ עִם יִשְׂרָאֵ֔ל אִם נִלְחֹ֥ם נִלְחַ֖ם בָּֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/025.yaml
  text: And now[a], are you really better than Balak son of Zippor, king of Moab? Did he ever contend with Israel[b], or did he ever fight against them?
translation:
  language: hi
  text: और अब, क्या तुम सचमुच सिप्पोर के पुत्र बालाक से बेहतर हो, जो मोआब का राजा था?[a] क्या उसने कभी इस्राएल से विवाद किया था,[b] या कभी उनके विरुद्ध युद्ध किया था?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्या तुम सिप्पोर के पुत्र बालाक से किसी तरह बेहतर हो, जो मोआब का राजा था?” हिब्रू में “अच्छा/बेहतर” शब्द की जोरदार पुनरावृत्ति है।
    reason: lexical_alternative
  - marker: b
    text: या, “क्या उसने कभी इस्राएल से झगड़ा किया था, या उनके विरुद्ध युद्ध किया था?” पहला क्रियापद कानूनी विवाद, दावे या झगड़े को सूचित कर सकता है, जबकि अगला क्रियापद विशेष रूप से युद्ध करने की बात कहता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: और अब
  rationale: यह वाक्य को पिछले तर्क से जोड़ते हुए यिप्तह की आलंकारिक चुनौती प्रस्तुत करता है; ‘और अब’ संयोजक और कालगत दोनों बल बनाए रखता है।
- source_word: הֲטוֹב טוֹב אַתָּה
  choice: क्या तुम ... सचमुच बेहतर हो?
  rationale: ‘טוֹב’ की पुनरावृत्ति तुलना पर जोर देती है। स्वाभाविक आधुनिक हिन्दी में ‘सचमुच बेहतर’ उस प्रबल आलंकारिक प्रश्न को व्यक्त करता है।
- source_word: מִבָּלָק בֶּן־צִפּוֹר מֶלֶךְ מוֹאָב
  choice: मोआब के राजा सिप्पोर के पुत्र बालाक से
  rationale: हिब्रू संबंधों को स्पष्ट और स्वाभाविक हिन्दी क्रम में रखा गया है और तुलना का ‘से’ सुरक्षित है।
- source_word: הֲרֹב רָב
  choice: क्या उसने कभी ... विवाद किया था
  rationale: ריב कानूनी दावे, झगड़े या व्यापक विवाद को सूचित कर सकता है। ‘विवाद किया’ इस व्यापकता को रखता है और अगले सैन्य क्रियापद से भेद बनाए रखता है; ‘कभी’ जोरदार आलंकारिक प्रश्न को सहज हिन्दी में व्यक्त करता है।
- source_word: עִם יִשְׂרָאֵל
  choice: इस्राएल से
  rationale: हिन्दी में ‘विवाद करना’ के साथ ‘से’ स्वाभाविक है और עִם के संबंधात्मक अर्थ को व्यक्त करता है।
- source_word: אִם
  choice: या
  rationale: यहाँ אִם आलंकारिक प्रश्न के दूसरे विकल्प को प्रस्तुत करता है, इसलिए हिन्दी में ‘या’ उपयुक्त है।
- source_word: נִלְחֹם נִלְחַם בָּם
  choice: कभी उनके विरुद्ध युद्ध किया था
  rationale: לחם की धातु-संबंधी पुनरावृत्ति जोर देती है। ‘युद्ध किया’ स्पष्ट सैन्य अर्थ देता है, ‘विरुद्ध’ विरोधी दिशा दिखाता है, और ‘कभी’ जोर को स्वाभाविक रूप से व्यक्त करता है।
