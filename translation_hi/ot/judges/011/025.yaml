translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज रूप अपनाया गया है। आलंकारिक प्रश्नों का जोर ‘सचमुच’ और ‘कभी’ से व्यक्त किया गया है। ‘विवाद’ और ‘युद्ध’ को अलग रखकर मूल के दो क्रियापदों का अर्थगत तनाव सुरक्षित रखा गया है।
