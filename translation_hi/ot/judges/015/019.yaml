  text: וַ/יִּבְקַ֨ע אֱלֹהִ֜ים אֶת הַ/מַּכְתֵּ֣שׁ אֲשֶׁר בַּ/לֶּ֗חִי וַ/יֵּצְא֨וּ מִמֶּ֤/נּוּ מַ֨יִם֙ וַ/יֵּ֔שְׁתְּ וַ/תָּ֥שָׁב רוּח֖/וֹ וַ/יֶּ֑חִי עַל כֵּ֣ן קָרָ֣א שְׁמָ֗/הּ עֵ֤ין הַקּוֹרֵא֙ אֲשֶׁ֣ר בַּ/לֶּ֔חִי עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/015/019.yaml
  text: Then God split open the hollow place that is at Lehi[a], and water came out from it. When he drank, his spirit returned and he revived. Therefore he called its name En-hakkore[b], which is at Lehi to this day.
translation:
  language: hi
  text: तब परमेश्वर ने लही में जो खोखला स्थान था, उसे चीरकर खोल दिया[a], और उसमें से पानी निकल आया। जब शिमशोन ने पानी पिया, तो उसका प्राण लौट आया और उसमें फिर से जान आ गई। इसलिए उसने उस सोते का नाम एन-हक्कोरे[b] रखा। वह आज तक लही में है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'वैकल्पिक समझ: “परमेश्वर ने जबड़े की हड्डी में बने खोखले भाग को चीरकर खोल दिया, और उसमें से पानी निकल आया।”'
    reason: alternative_reading
  - marker: b
    text: “एन-हक्कोरे” का सम्भावित अर्थ है “पुकारनेवाले का सोता” या “उसका सोता जिसने पुकारा”; यह परमेश्वर से शिमशोन की पुकार की ओर संकेत करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבְקַע
  choice: चीर दिया
  rationale: क्रिया बलपूर्वक फाड़ने या चीरकर खोलने का बोध देती है; ‘चीर दिया’ आधुनिक हिन्दी में ठोस क्रिया को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: कथा में इस्राएल के परमेश्वर प्रत्यक्ष कर्ता हैं; ‘परमेश्वर’ आधुनिक हिन्दी बाइबलीय भाषा में स्पष्ट और प्रतिष्ठित पद है।
- source_word: הַמַּכְתֵּשׁ
  choice: चट्टान का कटोरे जैसा गड्ढा
  rationale: संज्ञा सामान्यतः ओखली अथवा कटोरे जैसे खोखले स्थान को दर्शाती है। प्रसंग में यह लही का भू-आकृतिक गड्ढा है; ‘चट्टान’ प्रसंगगत रूप से निहित सतह को सहज बनाता है, जबकि आकार का बोध भी बचा रहता है।
- source_word: בַּלֶּחִי
  choice: लही में
  rationale: यहाँ לֶחִי स्थान-नाम के रूप में प्रयुक्त है, जैसा पद के अंतिम खंड से स्पष्ट होता है। मूल अर्थ ‘जबड़ा/जबड़े की हड्डी’ वाली वैकल्पिक समझ पादटिप्पणी में रखी गई है।
- source_word: וַיֵּצְאוּ מִמֶּנּוּ מַיִם
  choice: उसमें से पानी निकल आया
  rationale: हिब्रू क्रम और स्रोत-संबंध को बनाए रखते हुए यह स्वाभाविक हिन्दी अभिव्यक्ति है।
- source_word: וַתָּשָׁב רוּחוֹ
  choice: उसकी साँस लौट आई
  rationale: רוּחַ यहाँ साँस, प्राण या जीवन-शक्ति का संकेत दे सकता है। निकट-मूर्छा और पानी पीने के प्रसंग में ‘साँस’ स्वाभाविक है, पर अर्थ को केवल शारीरिक शक्ति तक सीमित नहीं करता।
- source_word: וַיֶּחִי
  choice: वह फिर से जी उठा
  rationale: यह मृत्यु से पुनरुत्थान नहीं, बल्कि जीवन-शक्ति लौटने का वर्णन है। ‘फिर से जी उठा’ सामान्य हिन्दी में पुनर्जीवन का भाव व्यक्त करता है।
- source_word: קָרָא שְׁמָהּ
  choice: उस सोते का नाम … रखा
  rationale: स्त्रीलिंग प्रत्यय सम्भवतः עֵין, अर्थात सोते, की ओर संकेत करता है। हिन्दी में नामकरण सूत्र को स्वाभाविक बनाने के लिए संदर्भित संज्ञा स्पष्ट की गई है।
- source_word: עֵין הַקּוֹרֵא
  choice: एन-हक्कोरे
  rationale: स्थान/सोते का नाम मुख्य पाठ में लिप्यंतरित है; कथा के लिए महत्वपूर्ण अर्थ पादटिप्पणी में दिया गया है।
- source_word: עַד הַיּוֹם הַזֶּה
  choice: आज तक
  rationale: हिब्रू काल-सूत्र का संक्षिप्त और प्रचलित हिन्दी समतुल्य।
theological_decisions:
- issue: בַּלֶּחִי का संकेत और पानी के स्रोत का स्थान
  choice: मुख्य पाठ में ‘लही’ को स्थान-नाम माना गया है।
  alternative: ‘जबड़े की हड्डी के गड्ढे में’—अर्थात पानी उसी हड्डी से निकला।
  rationale: तत्कालीन कथा-प्रसंग में लही स्थान-नाम के रूप में आता है, और अंतिम कथन ‘वह आज तक लही में है’ भौगोलिक अर्थ का प्रबल समर्थन करता है। फिर भी हिब्रू शब्द का शाब्दिक अर्थ ‘जबड़ा’ है, इसलिए वैकल्पिक दृश्य-पठन पादटिप्पणी में सुरक्षित रखा गया है।
- issue: רוּחַ का अर्थ
  choice: ‘साँस’
  alternative: ‘प्राण’, ‘आत्मा’ या ‘शक्ति’
  rationale: यह पद शिमशोन की शारीरिक जीवन-शक्ति लौटने का वर्णन करता है। ‘साँस’ प्रसंगानुकूल है, पर मूल शब्द की अर्थ-सीमा में अन्य सम्भावनाएँ भी रहती हैं।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘लही’ और ‘एन-हक्कोरे’ नामों को देवनागरी में लिप्यंतरित किया गया है। मुख्य पाठ भौगोलिक पठन अपनाता है, जबकि जबड़े की हड्डी वाला वास्तविक वैकल्पिक पठन पादटिप्पणी में सुरक्षित है।
