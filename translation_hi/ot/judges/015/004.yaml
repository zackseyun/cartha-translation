  choice: गया
  rationale: הלך के सामान्य क्रमिक कथात्मक रूप का सीधा और स्वाभाविक हिन्दी अनुवाद।
- source_word: שִׁמְשׁוֹן
  choice: शिमशोन
  rationale: इब्रानी नाम का देवनागरी लिप्यंतरण; पारंपरिक रूप ‘शिमशोन’ हिन्दी पाठकों में भी पहचाना जाता है।
- source_word: וַיִּלְכֹּד
  choice: पकड़ीं
  rationale: यहाँ לכד जीवित पशुओं को पकड़ने के अर्थ में है; ‘पकड़ीं’ सहज और सटीक है।
- source_word: שְׁלֹשׁ מֵאוֹת
  choice: तीन सौ
  rationale: संख्या का सीधा अनुवाद।
- source_word: שׁוּעָלִים
  choice: लोमड़ियाँ
  rationale: שׁוּעָל का सामान्य और पारंपरिक अर्थ ‘लोमड़ी’ है; ‘गीदड़’ की सम्भावना पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: לַפִּדִים / לַפִּיד
  choice: मशालें / मशाल
  rationale: जलती हुई लकड़ी या मशाल का बोध देने वाला स्पष्ट, वर्तमान हिन्दी शब्द।
- source_word: וַיֶּפֶן זָנָב אֶל זָנָב
  choice: लोमड़ियों को पूँछ से पूँछ मिलाकर रखा
  rationale: פנה का मूल भाव ‘मोड़ना/फेरना’ है; हिन्दी में यह वाक्यांश उनकी पूँछों को आमने-सामने व्यवस्थित करने का भाव स्वाभाविक ढंग से देता है और बाँधने की बात नहीं जोड़ता।
- source_word: וַיָּשֶׂם לַפִּיד אֶחָד
  choice: एक मशाल रख दी
  rationale: שׂים का सरल और स्वाभाविक कथात्मक अनुवाद।
- source_word: בֵּין שְׁנֵי הַזְּנָבוֹת בַּתָּוֶךְ
  choice: हर दो पूँछों के बीच में
  rationale: शाब्दिक ‘दो पूँछों के बीच, मध्य में’ को पुनरावृत्त जोड़ों के संदर्भ में स्पष्ट और सहज हिन्दी में व्यक्त करता है।
