base_translation:
  language: en
  yaml_path: translation/ot/judges/015/004.yaml
  text: So Shimshon went and caught three hundred foxes[a], and he took torches and turned them tail to tail, and put one torch between each pair of tails, in the middle.
translation:
  language: hi
  text: तब शिमशोन गया और उसने तीन सौ लोमड़ियाँ[a] पकड़ीं। उसने मशालें लीं, लोमड़ियों को पूँछ से पूँछ मिलाकर रखा, और हर दो पूँछों के बीच में एक मशाल रख दी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘गीदड़’। इब्रानी शब्द שׁוּעָלִים लोमड़ियों या उनसे मिलते-जुलते कुत्ते-कुल के पशुओं के लिए प्रयुक्त हो सकता है।
    reason: lexical_alternative
lexical_decisions:
