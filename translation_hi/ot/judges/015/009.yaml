- source_word: וַיִּנָּטְשׁוּ
  choice: फैलकर तैनात हो गए
  rationale: इस प्रसंग में क्रिया सेना के किसी क्षेत्र में फैलने या मोर्चा लेने का संकेत देती है; यह अनुवाद दोनों पहलुओं को स्वाभाविक हिन्दी में समेटता है।
- source_word: בַּלֶּחִי
  choice: लही में
  rationale: लही को स्थान-नाम मानते हुए ב के स्थानसूचक अर्थ को सीधे व्यक्त किया गया है।
