translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक रखी गई है। ‘अवश्य’ तथा ‘कदापि नहीं’ मूल के दो बलवाचक क्रियारूपों को स्पष्ट करते हैं। ‘उनके हाथ में’ इब्रानी बिंब को सुरक्षित रखता है, जबकि पादटिप्पणी उसका भावार्थ बताती है।
