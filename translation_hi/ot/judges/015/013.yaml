source:
  edition: WLC
  text: וַ/יֹּ֧אמְרוּ ל֣/וֹ לֵ/אמֹ֗ר לֹ֚א כִּֽי אָסֹ֤ר נֶֽאֱסָרְ/ךָ֙ וּ/נְתַנּ֣וּ/ךָ בְ/יָדָ֔/ם וְ/הָמֵ֖ת לֹ֣א נְמִיתֶ֑/ךָ וַ/יַּאַסְרֻ֗/הוּ בִּ/שְׁנַ֨יִם֙ עֲבֹתִ֣ים חֲדָשִׁ֔ים וַֽ/יַּעֲל֖וּ/הוּ מִן הַ/סָּֽלַע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/015/013.yaml
  text: They said to him[a], “No, but we will surely bind you and hand you over into their hand[b]; yet we will certainly not put you to death.” So they bound him with two new ropes and brought him up from the rock.
translation:
  language: hi
  text: उन्होंने उससे कहा, “नहीं, हम तुम्हें अवश्य बाँधेंगे और उनके हाथ में सौंप देंगे[a], लेकिन तुम्हें बिलकुल नहीं मारेंगे।” तब उन्होंने उसे दो नई रस्सियों से बाँधा और उस चट्टान[b] से ऊपर ले आए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उनके अधिकार में सौंप देंगे।” इब्रानी मुहावरे का शाब्दिक रूप है “उनके हाथ में सौंप देंगे।”
    reason: lexical_alternative
  - marker: b
    text: या “चट्टानी ऊँचाई” अथवा “कगार।” इब्रानी शब्द סלע केवल एक पत्थर ही नहीं, किसी चट्टानी स्थान या ऊँची कगार को भी सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא כִּי
  choice: नहीं, ... लेकिन
  rationale: यह रचना पहले बात का निषेध और फिर उसके स्थान पर सही बात स्पष्ट करती है। आधुनिक हिन्दी में यह विरोध स्वाभाविक ढंग से व्यक्त होता है।
- source_word: אָסֹר נֶאֱסָרְךָ
  choice: हम तुम्हें अवश्य बाँधकर
  rationale: क्रिया के साथ प्रयुक्त infinitive absolute बाँधने की निश्चितता पर बल देता है; ‘अवश्य’ उस बल को सहज हिन्दी में बनाए रखता है।
- source_word: וּנְתַנּוּךָ בְיָדָם
  choice: उनके हाथ में सौंप देंगे
  rationale: ‘हाथ में देना’ किसी के अधिकार या वश में सौंपने का इब्रानी मुहावरा है। हिन्दी में भी यह बिंब अर्थपूर्ण और बोधगम्य है।
- source_word: וְהָמֵת לֹא נְמִיתֶךָ
  choice: तुम्हें मारेंगे कदापि नहीं
  rationale: infinitive absolute और निषेध का संयोजन दृढ़ आश्वासन देता है। वाक्य के अंत में ‘कदापि नहीं’ रखने से मूल का प्रबल निषेध उभरता है।
- source_word: וַיַּאַסְרֻהוּ
  choice: उन्होंने उसे ... बाँधा
  rationale: पहले आए אסר के समान ‘बाँधना’ रखकर शब्दगत संगति बनाए रखी गई है।
- source_word: בִּשְׁנַיִם עֲבֹתִים חֲדָשִׁים
  choice: दो नई रस्सियों से
  rationale: עֲבֹתִים मोटी डोरियों या रस्सियों को सूचित करता है; ‘रस्सियाँ’ आधुनिक हिन्दी में स्पष्ट है और ‘नई’ कथानक की महत्त्वपूर्ण विशेषता को सुरक्षित रखता है।
- source_word: וַיַּעֲלֻהוּ מִן הַסָּלַע
  choice: चट्टान से ऊपर ले आए
  rationale: העלה का कारक अर्थ ‘ऊपर ले आना’ है। סלע चट्टान, शैल-स्थान या चट्टानी ऊँचाई का बोध करा सकता है; मुख्य पाठ में संक्षिप्त ‘चट्टान’ रखा गया है।
