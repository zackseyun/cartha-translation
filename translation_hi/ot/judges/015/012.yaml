  yaml_path: translation/ot/judges/015/012.yaml
  text: They said to him, “We have come down to bind you, to hand you over into the hand of the Philistines.” Samson said to them, “Swear to me that you yourselves will not attack me.”
translation:
  language: hi
  text: उन्होंने उससे कहा, “हम तुम्हें बाँधने और पलिश्तियों के हाथ में सौंपने के लिए नीचे आए हैं।” शिमशोन ने उनसे कहा, “मुझसे यह शपथ खाओ कि तुम स्वयं मुझ पर वार नहीं करोगे।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְתִתְּךָ בְּיַד פְּלִשְׁתִּים
  choice: पलिश्तियों के हाथ में सौंपने
  rationale: हिब्रू के ‘हाथ में देने’ मुहावरे को बनाए रखते हुए उसका स्वाभाविक हिन्दी अर्थ ‘अधीन/कब्ज़े में सौंपना’ व्यक्त करता है।
- source_word: תִּפְגְּעוּן בִּי
  choice: मुझ पर वार नहीं करोगे
  rationale: פגע यहाँ शत्रुतापूर्ण शारीरिक प्रहार के अर्थ में है; ‘वार करना’ प्रसंगानुकूल है और अस्पष्ट रूप से केवल ‘छूना’ नहीं कहता।
- source_word: אַתֶּם
  choice: तुम स्वयं
  rationale: 'स्वतंत्र सर्वनाम का बल सुरक्षित रखता है: शिमशोन विशेष रूप से यह शपथ चाहता है कि यहूदा के लोग स्वयं उसे हानि न पहुँचाएँ।'
- source_word: יָרַדְנוּ
  choice: नीचे आए हैं
  rationale: मूल के भौगोलिक क्रियापद ‘उतरना/नीचे आना’ को स्पष्ट रूप से बनाए रखता है।
theological_decisions:
- issue: शिमशोन की माँग में हिंसा की सीमा
  choice: तुम स्वयं मुझ पर वार नहीं करोगे
  alternative: तुम स्वयं मुझ पर टूट नहीं पड़ोगे
  rationale: पाठ यह नहीं कहता कि उसे पलिश्तियों को सौंपा न जाए; वह केवल अपने ही लोगों से प्रत्यक्ष प्रहार न करने की शपथ माँगता है। चुना हुआ पाठ इस तनाव को बिना व्याख्यात्मक विस्तार के सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संवाद स्वाभाविक, संक्षिप्त और गरिमापूर्ण रखा गया है। ‘पलिश्तियों के हाथ में’ मूल हिब्रू बिंब को बनाए रखता है, जबकि ‘सौंपने’ उसका अर्थ साफ करता है।
