  yaml_path: translation/ot/judges/015/007.yaml
  text: And Samson said to them, “If this is what you do, then I swear I will take vengeance on you, and after that I will stop.”
translation:
  language: hi
  text: शिमशोन ने उनसे कहा, “यदि तुम ऐसा करते हो, तो मैं निश्चय ही तुमसे बदला लूँगा; उसके बाद मैं रुक जाऊँगा।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִם תַּעֲשׂוּן כָּזֹאת
  choice: यदि तुम ऐसा करते हो
  rationale: शर्तसूचक אִם और संकेतवाचक כָּזֹאת को सीधे रखते हुए स्वाभाविक आधुनिक हिन्दी दी गई है; प्रसंग में इसका आशय उनके किए हुए काम पर प्रतिक्रिया से है।
- source_word: כִּי אִם
  choice: तो मैं शपथ खाता हूँ कि
  rationale: यहाँ यह संयोजन कथन को दृढ़ और शपथ-जैसा बल देता है; हिन्दी में उस प्रतिज्ञात्मक जोर को स्पष्ट किया गया है।
- source_word: נִקַּמְתִּי בָכֶם
  choice: मैं तुमसे बदला लूँगा
  rationale: נקם का सामान्य अर्थ प्रतिशोध लेना है; प्रथम पुरुष रूप को हिन्दी की स्वाभाविक भविष्यकालीन प्रतिज्ञा में व्यक्त किया गया है।
- source_word: וְאַחַר אֶחְדָּל
  choice: और उसके बाद ही रुकूँगा
  rationale: अर्थ है कि बदला लेने के बाद वह अपनी कार्रवाई बंद करेगा; ‘ही’ क्रम और दृढ़ता पर बल देता है, बिना यह तय किए कि रुकने का व्यापक आशय क्या है।
