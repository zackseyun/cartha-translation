  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण संवाद। ‘विरुद्ध चढ़ आए’ मूल के दिशात्मक और शत्रुतापूर्ण मुहावरे को सुरक्षित रखता है; ‘उसके साथ वैसा ही करें’ प्रतिशोध के भाव को बिना अनावश्यक व्याख्या के व्यक्त करता है।
