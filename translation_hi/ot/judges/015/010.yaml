  text: וַ/יֹּֽאמְרוּ֙ אִ֣ישׁ יְהוּדָ֔ה לָ/מָ֖ה עֲלִיתֶ֣ם עָלֵ֑י/נוּ וַ/יֹּאמְר֗וּ לֶ/אֱס֤וֹר אֶת שִׁמְשׁוֹן֙ עָלִ֔ינוּ לַ/עֲשׂ֣וֹת ל֔/וֹ כַּ/אֲשֶׁ֖ר עָ֥שָׂה לָֽ/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/015/010.yaml
  text: And the men of Judah said, “Why have you come up against us?” And they said, “We have come up to bind Samson, to do to him just as he did to us.”
translation:
  language: hi
  text: तब यहूदा के पुरुषों ने कहा, “तुम हमारे विरुद्ध क्यों चढ़ आए हो?” उन्होंने उत्तर दिया, “हम शिमशोन को बाँधने के लिए चढ़ आए हैं, ताकि उसके साथ वैसा ही करें जैसा उसने हमारे साथ किया है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִישׁ יְהוּדָה
  choice: यहूदा के पुरुषों
  rationale: אִישׁ रूप की दृष्टि से एकवचन है, पर बहुवचन क्रिया וַיֹּאמְרוּ के साथ यहाँ सामूहिक अर्थ देता है। ‘यहूदा के पुरुषों’ मूल की लिंग-सूचक सामूहिक अभिव्यक्ति और स्वाभाविक हिन्दी—दोनों को बनाए रखता है।
- source_word: לָמָה
  choice: क्यों
  rationale: कारण पूछने वाले सामान्य प्रश्नवाचक का सहज आधुनिक हिन्दी समतुल्य।
- source_word: עֲלִיתֶם עָלֵינוּ
  choice: तुम हमारे विरुद्ध क्यों चढ़ आए हो
  rationale: עלה עם עַל यहाँ शत्रुतापूर्ण दिशा में ‘विरुद्ध चढ़ आने’ का भाव देता है। यह अनुवाद दिशात्मक रूपक और विरोध—दोनों को रखता है, बिना इसे स्पष्ट ‘आक्रमण’ में बदलने के।
- source_word: לֶאֱסוֹר
  choice: बाँधने के लिए
  rationale: אָסַר का सीधा अर्थ बाँधना, जकड़ना या बंदी करना है; शिमशोन को पकड़ने के इस प्रसंग में ‘बाँधना’ सबसे सटीक है।
- source_word: עָלִינוּ
  choice: हम ... चढ़ आए हैं
  rationale: यह पिछले वाक्य के עלה को दोहराता है। हिन्दी में ‘चढ़ आए हैं’ इस शाब्दिक संबंध और संवाद की वर्तमान प्रासंगिकता को बनाए रखता है।
- source_word: לַעֲשׂוֹת לוֹ
  choice: ताकि उसके साथ ... करें
  rationale: עשה + ל यहाँ प्रतिशोधात्मक संदर्भ में किसी के साथ कुछ करने का अर्थ देता है। ‘उसके साथ ... करें’ स्वाभाविक हिन्दी है और अहितकारी आशय को संदर्भ पर छोड़ता है।
- source_word: כַּאֲשֶׁר עָשָׂה לָנוּ
  choice: वैसा ही ... जैसा उसने हमारे साथ किया है
  rationale: तुलना और प्रतिशोध की समरूपता को हिन्दी की स्वाभाविक ‘वैसा ही ... जैसा’ रचना स्पष्ट रूप से सुरक्षित रखती है।
- source_word: שִׁמְשׁוֹן
  choice: शिमशोन
  rationale: हिब्रू नाम का हिन्दी बाइबलीय परंपरा के अनुरूप लिप्यंतरण।
