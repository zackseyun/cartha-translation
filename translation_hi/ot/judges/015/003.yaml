base_translation:
  language: en
  yaml_path: translation/ot/judges/015/003.yaml
  text: And Samson said to them[b][a], “This time I am blameless with respect to the Philistines when I do them harm.”
translation:
  language: hi
  text: तब शिमशोन ने उनसे कहा, “इस बार मैं पलिश्तियों के संबंध में निर्दोष[a] हूँ, क्योंकि मैं उनके साथ बुरा[b] करूँगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पलिश्तियों से दोषमुक्त”; अर्थात पलिश्तियों के संबंध में दोष या उत्तरदायित्व से मुक्त।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “बुराई।” यहाँ संदर्भ में इसका अर्थ हानि या चोट पहुँचाना है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने कहा
  rationale: हिब्रू कथात्मक क्रम को स्वाभाविक आधुनिक हिन्दी में आगे बढ़ाता है; ‘तब’ प्रसंग के क्रम को व्यक्त करता है, बिना अनावश्यक अर्थ जोड़े।
- source_word: לָהֶם
  choice: उनसे
  rationale: पूर्वसर्ग और तृतीय पुरुष बहुवचन प्रत्यय का स्वाभाविक हिन्दी रूप; संदर्भ में यह शिमशोन के श्रोताओं की ओर संकेत करता है।
- source_word: שִׁמְשׁוֹן
  choice: शिमशोन
  rationale: नाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण।
- source_word: נִקֵּיתִי
  choice: मैं निर्दोष रहूँगा
  rationale: נקה यहाँ दोष या उत्तरदायित्व से मुक्त होने का दावा व्यक्त करता है। हिन्दी में आगामी प्रतिशोध के संदर्भ में ‘निर्दोष रहूँगा’ परिणामसूचक भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הַפַּעַם
  choice: इस बार
  rationale: संघर्ष के नए चरण को सूचित करने वाली कालवाचक अभिव्यक्ति का सीधा और स्वाभाविक अनुवाद।
- source_word: מִפְּלִשְׁתִּים
  choice: पलिश्तियों ... के विषय में
  rationale: נקה के बाद מן पलिश्तियों के संबंध में दोष से मुक्त होने का भाव देता है; ‘के विषय में’ इस संबंध को स्पष्ट रखता है और इसे केवल स्थानिक ‘से’ नहीं बनाता।
- source_word: כִּי
  choice: जब
  rationale: यहाँ आगामी कार्य की वह परिस्थिति प्रस्तुत होती है जिसमें शिमशोन स्वयं को निर्दोष मानता है। ‘जब’ हिन्दी में इस संबंध को स्वाभाविक रखता है, यद्यपि ‘क्योंकि’ भी व्याकरणतः संभव है।
- source_word: עֹשֶׂה אֲנִי
  choice: मैं ... पहुँचाऊँगा
  rationale: सहभागी रूप और स्पष्ट सर्वनाम निकट भविष्य या अभिप्रेत कार्य का संकेत दे सकते हैं; प्रसंग में हिन्दी भविष्यकाल स्वाभाविक है।
- source_word: עִמָּם רָעָה
  choice: उन्हें हानि पहुँचाऊँगा
  rationale: शाब्दिक रूप से ‘उनके साथ बुराई करना’; यहाँ प्रतिशोधात्मक चोट या नुकसान के अर्थ में स्वाभाविक हिन्दी अभिव्यक्ति चुनी गई है।
theological_decisions:
- issue: क्या शिमशोन का ‘निर्दोष’ होना कथाकार का निर्णय है या उसका अपना दावा?
  choice: वाक्य को शिमशोन के प्रथम-पुरुष दावे के रूप में रखा गया है।
  alternative: ऐसा अनुवाद जो उसे वस्तुगत रूप से निर्दोष घोषित करे।
  rationale: मूल पाठ यह बात शिमशोन के मुख से कहलाता है; अनुवाद उसके नैतिक दावे का अनुमोदन या खंडन नहीं करता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। हिन्दी की स्वाभाविक वाक्य-रचना के लिए परिस्थिति-वाचक उपवाक्य पहले रखा गया है। ‘निर्दोष’ शिमशोन के दावे को व्यक्त करता है, न कि अनुवादक की नैतिक स्वीकृति को।
