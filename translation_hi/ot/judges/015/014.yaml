source:
  edition: WLC
  text: הוּא בָ֣א עַד לֶ֔חִי וּ/פִלְשִׁתִּ֖ים הֵרִ֣יעוּ לִ/קְרָאת֑/וֹ וַ/תִּצְלַ֨ח עָלָ֜י/ו ר֣וּחַ יְהוָ֗ה וַ/תִּהְיֶ֨ינָה הָ/עֲבֹתִ֜ים אֲשֶׁ֣ר עַל זְרוֹעוֹתָ֗י/ו כַּ/פִּשְׁתִּים֙ אֲשֶׁ֣ר בָּעֲר֣וּ בָ/אֵ֔שׁ וַ/יִּמַּ֥סּוּ אֱסוּרָ֖י/ו מֵ/עַ֥ל יָדָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/015/014.yaml
  text: When he came as far as Lehi[a], the Philistines shouted as they came to meet him. Then the Spirit of Yahweh rushed upon him, and the ropes that were on his arms became like flax that has been burned in the fire, and his bonds melted off his hands.
translation:
  language: hi
  text: जब वह लही[a] तक पहुँचा, तब पलिश्ती उसका सामना करने को ललकार उठे। तब याहवे की आत्मा सामर्थ्य के साथ उस पर आ पड़ी, और उसकी बाँहों पर बँधी रस्सियाँ आग में जले हुए सन के समान हो गईं; उसके हाथों के बन्धन पिघलकर उतर गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: लही एक स्थान का नाम है; इब्रानी में यह शब्द ‘जबड़ा’ से भी संबंधित है, जो आसपास की कथा का एक महत्त्वपूर्ण शब्द-चित्र है।
    reason: स्थाननाम के रूप में मुख्य पाठ का अर्थ बनाए रखते हुए इब्रानी शब्द के ‘जबड़ा’ संबंधी कथात्मक संकेत को स्पष्ट करना।
lexical_decisions:
- source_word: לֶחִי
  choice: लही
  rationale: संदर्भ में यह स्थान का नाम है। इसका सामान्य अर्थ ‘जबड़ा’ भी है, जो आगे की कथा के शब्द-चित्र से जुड़ा है; इसलिए मुख्य पाठ में नाम और पादटिप्पणी में अर्थ दिया गया है।
- source_word: הֵרִיעוּ לִקְרָאתוֹ
  choice: उससे मिलने आते हुए ललकारने लगे
  rationale: क्रिया ऊँची, आक्रामक पुकार को व्यक्त करती है और לִקְרָאתוֹ सामना करने के लिए आगे आने का भाव रखता है। ‘ललकारने लगे’ युद्धघोष को अनावश्यक रूप से निश्चित किए बिना प्रसंग का टकराव दिखाता है।
- source_word: וַתִּצְלַח עָלָיו רוּחַ יְהוָה
  choice: यहोवा का आत्मा उस पर प्रबलता से उतरा
  rationale: צלח यहाँ अचानक और सामर्थ्यशाली दिव्य सशक्तीकरण बताता है। ‘प्रबलता से उतरा’ हिन्दी में स्वाभाविक रहते हुए उस बलपूर्ण गति को व्यक्त करता है।
- source_word: הָעֲבֹתִים
  choice: रस्सियाँ
  rationale: यह बन्धन में प्रयुक्त मोटी डोरियों या रस्सियों को सूचित करता है; ‘रस्सियाँ’ सहज आधुनिक हिन्दी है।
- source_word: זְרוֹעֹתָיו
  choice: उसकी बाँहों
  rationale: זְרוֹעַ सामान्यतः बाँह को दर्शाता है; ‘बाँहों’ को ‘अग्रबाहुओं’ जैसा अनावश्यक शारीरिक विशेषीकरण नहीं दिया गया।
- source_word: כַּפִּשְׁתִּים אֲשֶׁר בָּעֲרוּ בָאֵשׁ
  choice: जैसे आग में जला हुआ सन
  rationale: פִשְׁתִּים सन के रेशे हैं। उपमा आग से निर्बल होकर टूट जाने की दशा दिखाती है; हिन्दी में एकवचन द्रव्यवाचक ‘सन’ स्वाभाविक है।
- source_word: וַיִּמַּסּוּ אֱסוּרָיו מֵעַל יָדָיו
  choice: उसके बंधन उसके हाथों पर से गलकर गिर गए
  rationale: מסס का मूल चित्र गलने या विलीन होने का है। ‘गलकर गिर गए’ इस रूपक और बन्धनों के शरीर से अलग होने—दोनों परिणामों को स्पष्ट और स्वाभाविक ढंग से रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में चतुरक्षरीय निजी नाम है। प्रचलित आधुनिक हिन्दी बाइबलीय रूप ‘यहोवा’ पाठकों के लिए पहचाना हुआ है और इसे उपाधि ‘प्रभु’ से बदलने के बजाय नाम के रूप में बनाए रखता है; ‘याहवे’ उच्चारण की वैकल्पिक विद्वत्तापरक अभिव्यक्ति है।
- issue: शिमशोन पर आत्मा के आने का वर्णन
  choice: यहोवा का आत्मा उस पर प्रबलता से उतरा
  alternative: यहोवा का आत्मा उस पर झपट पड़ा
  rationale: यह चयन अचानक और शक्तिशाली सशक्तीकरण को सुरक्षित रखता है, पर ‘झपट पड़ा’ से उत्पन्न संभावित आक्रामक या प्रतिकूल अर्थ से बचता है। यह कथन बाद की धर्मवैज्ञानिक श्रेणियाँ आरोपित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘ललकारने लगे’, ‘प्रबलता से उतरा’ और ‘गलकर गिर गए’ मूल की गतिशीलता बनाए रखते हैं। मुख्य पाठ में पादटिप्पणी-सूचक [a] उपस्थित है।
