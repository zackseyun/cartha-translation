  edition: WLC
  text: וַֽ/יְהִי֙ כְּ/כַלֹּת֣/וֹ לְ/דַבֵּ֔ר וַ/יַּשְׁלֵ֥ךְ הַ/לְּחִ֖י מִ/יָּד֑/וֹ וַ/יִּקְרָ֛א לַ/מָּק֥וֹם הַ/ה֖וּא רָ֥מַת לֶֽחִי׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/015/017.yaml
  text: And when he had finished speaking[a], he threw the jawbone from his hand, and he called that place Ramath-lehi.
translation:
  language: hi
  text: जब वह बोलना समाप्त कर चुका था, तब उसने अपने हाथ से जबड़े की हड्डी फेंक दी और उस स्थान का नाम रामत-लही[a] रखा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “रामत-लही” का अर्थ संभवतः “जबड़े की पहाड़ी” या “जबड़े की ऊँची जगह” है। इस नाम में इब्रानी शब्द लही, अर्थात् “जबड़ा,” के साथ शब्द-क्रीड़ा है।
    reason: स्थान-नाम के संभावित अर्थ और मूल इब्रानी शब्द-क्रीड़ा को स्पष्ट करना।
lexical_decisions:
- source_word: כְּכַלֹּתוֹ לְדַבֵּר
  choice: जब वह बोल चुका
  rationale: כְּ के साथ כלה का क्रियार्थक संज्ञा-रूप और לְדַבֵּר मिलकर समयसूचक भाव देते हैं—‘जब वह बोल चुका।’ यह क्रम और पूर्ण हुई क्रिया दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וַיַּשְׁלֵךְ
  choice: फेंक दी
  rationale: क्रिया का अर्थ फेंकना या दूर कर देना है। स्त्रीलिंग कर्म ‘हड्डी’ के अनुसार ‘फेंक दी’ आधुनिक हिन्दी में स्वाभाविक है और अनावश्यक रूप से बलपूर्वक फेंकने का भाव नहीं जोड़ता।
- source_word: הַלְּחִי
  choice: जबड़े की हड्डी
  rationale: संदर्भ में यह गधे के उस जबड़े की हड्डी को सूचित करता है जिसे शिमशोन ने हथियार बनाया था। केवल ‘जबड़ा’ की अपेक्षा यह अधिक स्पष्ट है।
- source_word: מִיָּדוֹ
  choice: अपने हाथ से
  rationale: मूल का शाब्दिक भाव ‘उसके हाथ से’ है; हिन्दी में कर्ता से संबंध स्पष्ट करने के लिए ‘अपने हाथ से’ स्वाभाविक और अर्थनिष्ठ है।
- source_word: וַיִּקְרָא לַמָּקוֹם הַהוּא
  choice: उस स्थान का नाम … रखा
  rationale: קרא यहाँ किसी स्थान को नाम देने के अर्थ में है। ‘उस स्थान को … कहा’ भी संभव है, पर ‘नाम रखा’ आधुनिक हिन्दी में अधिक सहज है।
- source_word: רָמַת לֶחִי
  choice: रामत-लही
  rationale: स्थान-नाम को मूल उच्चारण के निकट देवनागरी में लिप्यंतरित किया गया है। नाम में לֶחִי (‘जबड़ा/जबड़े की हड्डी’) के साथ शब्द-क्रीड़ा है, जिसे पादटिप्पणी में सुरक्षित रखा गया है।
