base_translation:
  language: en
  yaml_path: translation/ot/judges/015/008.yaml
  text: And he struck them hip and thigh with a great slaughter[a], and he went down and stayed in the cleft of the rock of Etam.
translation:
  language: hi
  text: और उसने उन्हें बुरी तरह पराजित किया[a]। फिर वह नीचे उतरकर एताम की चट्टान की दरार में रहने लगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “जाँघ पर कूल्हा, एक बड़ी मार।” यह सम्भवतः बहुत बुरी या पूरी पराजय का मुहावरा है, पर इसका ठीक आशय निश्चित नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּךְ
  choice: वार करके उन्हें...पराजित किया
  rationale: נכה का मूल अर्थ ‘मारना/प्रहार करना’ है। युद्ध-संदर्भ में परिणाम को व्यक्त करने के लिए ‘वार करके...पराजित किया’ स्वाभाविक है, पर यह नहीं कहता कि प्रत्येक व्यक्ति मारा गया।
- source_word: שׁוֹק עַל יָרֵךְ
  choice: जाँघ और कूल्हे पर
  rationale: यह दुर्बोध इब्रानी मुहावरा है। मुख्य पाठ में उसके शारीरिक बिंब को बनाए रखा गया है; सम्भावित मुहावरेदार अर्थ पादटिप्पणी में दिया गया है।
- source_word: מַכָּה גְדוֹלָה
  choice: बुरी तरह पराजित किया
  rationale: מכה युद्ध के प्रसंग में भारी मार, संहार या करारी हार का बोध करा सकता है। हिन्दी में ‘बुरी तरह पराजित किया’ तीव्रता और परिणाम को स्वाभाविक ढंग से व्यक्त करता है, बिना निश्चित रूप से सर्वसंहार कहे।
- source_word: וַיֵּרֶד
  choice: नीचे उतरकर
  rationale: दिशासूचक अर्थ को सहज हिन्दी कथन में सुरक्षित रखता है।
- source_word: וַיֵּשֶׁב
  choice: रहने लगा
  rationale: ישב का अर्थ बैठना, रहना या निवास करना हो सकता है। इस शरण-स्थल के प्रसंग में ‘रहने लगा’ स्वाभाविक है और अवधि को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: בִּסְעִיף
  choice: दरार में
  rationale: סעיף यहाँ चट्टान की फटन, दरार या खोह-जैसे आश्रय को सूचित करता है; ‘दरार’ स्पष्ट और सामान्य हिन्दी है।
- source_word: סֶלַע
  choice: चट्टान
  rationale: סלע बड़ी चट्टान या शैल-रचना को दर्शाता है; इस स्थल-वर्णन में ‘चट्टान’ ‘पत्थर’ से अधिक उपयुक्त है।
- source_word: עֵיטָם
  choice: एताम
  rationale: स्थान-नाम का देवनागरी लिप्यंतरण।
