  text: And he found a fresh jawbone of a donkey[a], and he reached out his hand and took it, and with it he struck down a thousand men.
translation:
  language: hi
  text: तब उसे गधे के जबड़े की ताज़ी हड्डी[a] मिली। उसने हाथ बढ़ाकर उसे उठा लिया और उससे एक हज़ार पुरुषों को मार गिराया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “गधे के जबड़े की नई हड्डी।” हिब्रू विशेषण का अर्थ ताज़ा या हाल में उपलब्ध हुई वस्तु हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְצָא
  choice: उसे ... मिली
  rationale: מצא के साधारण कथात्मक भूतकाल को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: לְחִי חֲמוֹר
  choice: गधे के जबड़े की ... हड्डी
  rationale: לְחִי यहाँ हथियार के रूप में प्रयुक्त जबड़े की हड्डी को दर्शाता है; यह हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: טְרִיָּה
  choice: ताज़ी
  rationale: विशेषण उस हड्डी के सूखी या भुरभुरी न होकर ताज़ी होने का संभावित अर्थ देता है; 'नई' वैकल्पिक अर्थ है।
- source_word: וַיִּשְׁלַח יָדוֹ
  choice: उसने हाथ बढ़ाकर
  rationale: हिब्रू मुहावरे की ठोस छवि बनाए रखते हुए हिन्दी में स्वाभाविक क्रिया-क्रम देता है।
- source_word: וַיִּקָּחֶהָ
  choice: उसे उठा लिया
  rationale: स्त्रीलिंग प्रत्यय का संदर्भ जबड़े की हड्डी से है; भूमि पर मिली वस्तु के प्रसंग में 'उठा लिया' स्वाभाविक है।
- source_word: וַיַּךְ בָּהּ
  choice: उससे ... मार गिराया
  rationale: נכה का मूल भाव प्रहार करना है, और युद्ध-संदर्भ में परिणाम घातक है; 'मार गिराया' दोनों को संक्षेप में व्यक्त करता है।
- source_word: אֶלֶף אִישׁ
  choice: एक हज़ार पुरुषों
  rationale: युद्ध के संदर्भ में אִישׁ पुरुष योद्धाओं को सूचित करता है; संख्या को स्पष्ट रूप से रखा गया है।
