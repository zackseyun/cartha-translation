source:
  edition: WLC
  text: וַ/יִּצְמָא֮ מְאֹד֒ וַ/יִּקְרָ֤א אֶל יְהוָה֙ וַ/יֹּאמַ֔ר אַתָּה֙ נָתַ֣תָּ בְ/יַֽד עַבְדְּ/ךָ֔ אֶת הַ/תְּשׁוּעָ֥ה הַ/גְּדֹלָ֖ה הַ/זֹּ֑את וְ/עַתָּה֙ אָמ֣וּת בַּ/צָּמָ֔א וְ/נָפַלְתִּ֖י בְּ/יַ֥ד הָ/עֲרֵלִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/015/018.yaml
  text: And he became very thirsty[a], and he called to Yahweh and said, “You have given this great deliverance by the hand of your servant[c][b], and now shall I die from thirst and fall into the hand of the uncircumcised?”
translation:
  language: hi
  text: उसे बहुत प्यास लगी, और उसने याहवे को पुकारकर[a] कहा, “तूने अपने सेवक के हाथ से यह महान उद्धार[b] दिया है। अब क्या मैं प्यास से मर जाऊँ और खतनारहित लोगों[c] के हाथ में पड़ जाऊँ?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “याहवे की दुहाई दी।”
    reason: lexical_alternative
  - marker: b
    text: “महान उद्धार” का अनुवाद “महान विजय” या “महान छुटकारा” भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: यहाँ “खतनारहित लोग” विशेष रूप से पलिश्तियों को सूचित करता है। यह वाचा के चिह्न से रहित इस्राएल के शत्रुओं के लिए अर्थ-भार वाला संबोधन है।
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּצְמָא מְאֹד
  choice: उसे बहुत प्यास लगी
  rationale: यह צמא की तीव्र अवस्था को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; प्रसंग में प्यास लगने या अत्यधिक प्यास से पीड़ित होने का भाव है।
- source_word: וַיִּקְרָא אֶל יְהוָה
  choice: उसने याहवे को पुकारकर कहा
  rationale: קרא אל यहाँ सहायता के लिए प्रार्थनापूर्वक पुकारने को दर्शाता है। ‘पुकारकर’ मूल के भाव को बनाए रखते हुए हिन्दी में सहज है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत वाचा-नाम है; ‘याहवे’ उसका हिन्दी लिप्यंतरण है, किसी उपाधि से उसका स्थानापन्न नहीं।
- source_word: בְיַד עַבְדְּךָ
  choice: अपने सेवक के हाथ से
  rationale: ביד यहाँ माध्यम या साधन का बोध कराता है। यह रूप मूल की ‘हाथ’ वाली छवि को बनाए रखता है और हिन्दी में समझने योग्य है।
- source_word: הַתְּשׁוּעָה הַגְּדֹלָה הַזֹּאת
  choice: यह महान उद्धार
  rationale: תשועה में बचाव, छुटकारे और विजय—तीनों की अर्थ-छाया हो सकती है। ‘उद्धार’ तत्काल सैन्य छुटकारे और परमेश्वर द्वारा किए गए बचाव, दोनों को खुला रखता है।
- source_word: אָמ֣וּת בַּצָּמָא
  choice: क्या मैं प्यास से मर जाऊँ
  rationale: यद्यपि औपचारिक प्रश्नवाचक कण नहीं है, प्रसंग वाक्य को आलंकारिक प्रश्न बनाता है। בַּצָּמָא यहाँ कारण या परिस्थिति बताता है।
- source_word: וְנָפַלְתִּי בְּיַד
  choice: और ... के हाथ में पड़ जाऊँ
  rationale: נפל ביד किसी के वश या अधिकार में पड़ने का मुहावरा है। हिन्दी का समान मुहावरा मूल रूपक को स्वाभाविक ढंग से बनाए रखता है।
- source_word: הָעֲרֵלִים
  choice: खतनारहित लोगों
  rationale: शब्द का शाब्दिक अर्थ ‘जिनका खतना नहीं हुआ’ है। यह केवल जातीय नाम नहीं, बल्कि वाचागत और तिरस्कारसूचक अर्थ-भार वाला संबोधन है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल में सीधे चतुरक्षरीय वाचा-नाम है। ‘याहवे’ उसके संभावित उच्चारण का सीधा देवनागरी लिप्यंतरण है और नाम को उपाधि में नहीं बदलता।
- issue: הַתְּשׁוּעָה में छुटकारे और विजय का संबंध
  choice: महान उद्धार
  alternative: महान विजय / महान छुटकारा
  rationale: प्रसंग सैन्य विजय का है, पर शब्द परमेश्वर द्वारा बचाए जाने का व्यापक अर्थ भी रखता है। ‘उद्धार’ इस अर्थगत तनाव को संकीर्ण किए बिना बनाए रखता है।
- issue: הָעֲרֵלִים का वाचागत अर्थ-भार
  choice: खतनारहित लोग
  alternative: पलिश्ती
  rationale: पलिश्ती तत्काल संदर्भित समूह हैं, पर मूल लेखक ने जातीय नाम के बजाय वाचा के चिह्न के अभाव पर बल देने वाला शब्द चुना है। शाब्दिक रूप उसी अलंकारिक और धर्मवैचारिक बल को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और मौखिक पठन के अनुकूल रखी गई है। प्रार्थना में एकवचन ‘तू’ मूल इब्रानी के प्रत्यक्ष, निकट संबोधन को दर्शाता है और हिन्दी धार्मिक प्रयोग में अनादर का आशय नहीं रखता। ‘हाथ से’ और ‘हाथ में पड़ना’ मूल की दो अलग किन्तु संबंधित छवियों को जानबूझकर बनाए रखते हैं।
