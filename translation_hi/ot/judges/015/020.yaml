lexical_decisions:
- source_word: וַיִּשְׁפֹּט
  choice: न्याय किया
  rationale: न्यायियों की पुस्तक में שׁפט किसी न्यायी द्वारा न्याय करने के साथ व्यापक नेतृत्व का भी बोध करा सकता है। ‘न्याय किया’ पुस्तक की मुख्य शब्दावली और मूल की अभिव्यक्ति को बनाए रखता है।
- source_word: אֶת יִשְׂרָאֵל
  choice: इस्राएल का
  rationale: मूल में कर्म के रूप में जाति का उचित नाम ‘इस्राएल’ है। हिन्दी में ‘इस्राएल का न्याय किया’ स्वाभाविक है और मूल के अधिक निकट रहता है।
- source_word: בִּימֵי
  choice: के दिनों में
  rationale: यह इब्रानी कालवाचक मुहावरे का सीधा और हिन्दी में समझ में आने वाला रूप है।
- source_word: פְלִשְׁתִּים
  choice: पलिश्तियों
  rationale: यह इस जनसमूह के नाम का हिन्दी में प्रचलित बाइबलीय रूप है।
- source_word: עֶשְׂרִים שָׁנָה
  choice: बीस वर्ष तक
  rationale: ‘तक’ अवधि को स्वाभाविक हिन्दी में स्पष्ट करता है और बीस वर्ष की नेतृत्व-अवधि को व्यक्त करता है।
theological_decisions:
- issue: शिमशोन की भूमिका में שׁפט का आशय
  choice: ‘न्याय किया’ रखा गया है।
  alternative: ‘बीस वर्ष तक इस्राएल का नेतृत्व किया’ या ‘इस्राएल पर शासन किया।’
  rationale: यह चुनाव न्यायियों की पुस्तक की साहित्यिक और पारिभाषिक कड़ी को सुरक्षित रखता है। साथ ही पादटिप्पणी बताती है कि इब्रानी क्रिया केवल अदालत में निर्णय देने तक सीमित नहीं, बल्कि व्यापक नेतृत्व भी सूचित कर सकती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध शैली। मूल वाक्य के कालवाचक क्रम को यथासंभव रखा गया है, जबकि ‘तक’ जोड़कर अवधि को स्वाभाविक हिन्दी में व्यक्त किया गया है।
