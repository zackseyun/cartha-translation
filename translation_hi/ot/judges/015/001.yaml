base_translation:
  language: en
  yaml_path: translation/ot/judges/015/001.yaml
  text: And after some days[a], in the days of the wheat harvest, Samson visited his wife with a young goat. He said, “Let me go in to my wife, into the inner room.” But her father would not allow him to go in.
translation:
  language: hi
  text: कुछ समय बाद, गेहूँ की कटनी के दिनों में, शिमशोन बकरी का एक बच्चा लेकर अपनी पत्नी से मिलने गया। उसने कहा, “मुझे अपनी पत्नी के पास, भीतर के कमरे[a] में जाने दो।” पर उसकी पत्नी के पिता ने उसे भीतर जाने नहीं दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “कक्ष में।” इब्रानी शब्द संभवतः घर के भीतर के कमरे को दर्शाता है; इस प्रसंग में आशय पति-पत्नी के निजी कमरे से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי מִיָּמִים
  choice: कुछ समय बाद
  rationale: यह इब्रानी मुहावरा कथा में कुछ समय बीतने का संकेत देता है। यह हिंदी में स्वाभाविक है और अवधि को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: בִּימֵי קְצִיר חִטִּים
  choice: गेहूँ की कटनी के दिनों में
  rationale: मूल की काल-सूचक रचना और गेहूँ की कटनी के विशिष्ट मौसम—दोनों को बनाए रखता है।
- source_word: וַיִּפְקֹד
  choice: मिलने गया
  rationale: इस संदर्भ में פקד का अर्थ किसी से मिलने या उसकी सुधि लेने जाना है; यहाँ गिनती करना, नियुक्त करना या दंड देना अभिप्रेत नहीं है।
- source_word: בִּגְדִי עִזִּים
  choice: बकरी का एक बच्चा लेकर
  rationale: यह शिमशोन के साथ लाई हुई वस्तु को स्पष्ट और सामान्य आधुनिक हिंदी में व्यक्त करता है।
- source_word: אָבֹאָה אֶל אִשְׁתִּי
  choice: मुझे अपनी पत्नी के पास ... जाने दो
  rationale: यह रूप कथन की इच्छासूचक/आग्रहसूचक शक्ति को व्यक्त करता है और अगले वाक्य में पिता द्वारा रोके जाने से स्वाभाविक रूप से जुड़ता है।
- source_word: הֶחָדְרָה
  choice: भीतरी कमरे में
  rationale: दिशासूचक रूप किसी कमरे या कक्ष के भीतर जाने को बताता है। यह अनुवाद स्थानगत अर्थ बचाता है, पर मूल से अधिक निश्चित रूप से ‘शयनकक्ष’ नहीं कहता।
- source_word: וְלֹא נְתָנוֹ אָבִיהָ לָבוֹא
  choice: पर उसके पिता ने उसे भीतर जाने नहीं दिया
  rationale: यह पिता द्वारा सक्रिय रूप से प्रवेश रोकने का अर्थ और पिछले कथन के ‘जाने’ से शब्दगत संबंध बनाए रखता है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘अपनी पत्नी’ मूल संबंध-संज्ञा को बनाए रखता है, यद्यपि प्रसंग में वैवाहिक संबंध तनावपूर्ण है। निजी वैवाहिक आशय को स्पष्ट रूप से बढ़ाकर लिखने के बजाय मूल की संयत अभिव्यक्ति और संभावित अर्थ-परत को सुरक्षित रखा गया है।
