base_translation:
  language: en
  yaml_path: translation/ot/judges/015/006.yaml
  text: Then the Philistines said[a], “Who did this?” And they said, “Samson, the Timnite’s son-in-law[b], because he took his wife and gave her to his companion.” So the Philistines went up and burned her and her father with fire.
translation:
  language: hi
  text: तब पलिश्तियों ने पूछा, “यह किसने किया?” उन्होंने कहा, “तिम्नावासी का दामाद शिमशोन ने, क्योंकि उसने शिमशोन की पत्नी को ले लिया और उसे शिमशोन के साथी[a] को दे दिया था।” तब पलिश्ती चढ़ आए और उन्होंने उस स्त्री और उसके पिता को आग में जला दिया।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसके मित्र।” इब्रानी शब्द का अर्थ साथी या मित्र हो सकता है; विवाह के इस प्रसंग में कुछ लोग इसे दूल्हे के विशेष सहायक अथवा मुख्य साथी के अर्थ में समझते हैं।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “उसे और उसके पिता को आग से जला दिया।”
    reason: lexical_alternative
lexical_decisions:
- source_word: פְלִשְׁתִּים
  choice: पलिश्ती
  rationale: इस परिचित जाति-नाम का मानक और स्वाभाविक हिन्दी रूप।
- source_word: מִי עָשָׂה זֹאת
  choice: यह किसने किया?
  rationale: प्रत्यक्ष प्रश्न का सरल, स्वाभाविक और स्रोत के निकट अनुवाद।
- source_word: חֲתַן הַתִּמְנִי
  choice: तिम्नी के दामाद
  rationale: חָתָן दूल्हे अथवा विवाह-संबंधी पुरुष के अर्थ में आ सकता है; प्रसंग में शिमशोन तिम्नी की बेटी का पति है, इसलिए ‘दामाद’ संबंध को सबसे स्पष्ट रूप से व्यक्त करता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह शिमशोन को कर्ता बताने का कारण प्रस्तुत करता है; आधुनिक हिन्दी में ‘क्योंकि’ स्पष्ट और सहज है।
- source_word: לָקַח אֶת אִשְׁתּוֹ
  choice: तिम्नी ने शिमशोन की पत्नी लेकर
  rationale: इब्रानी में कर्ता और संबंधसूचक सर्वनाम संदर्भ से समझे जाते हैं। हिन्दी में अस्पष्ट सर्वनामों से बचने के लिए संदर्भानुसार तिम्नी को कर्ता और स्त्री को शिमशोन की पत्नी स्पष्ट किया गया है।
- source_word: וַיִּתְּנָהּ לְמֵרֵעֵהוּ
  choice: उसके साथी को दे दी थी
  rationale: מֵרֵעַ का अर्थ साथी या मित्र हो सकता है। ‘साथी’ विवाह-संबंधी किसी विशिष्ट भूमिका को अनावश्यक रूप से निश्चित किए बिना मूल की व्यापकता रखता है।
- source_word: וַיַּעֲלוּ
  choice: चढ़ आए
  rationale: आंदोलन-सूचक ‘ऊपर जाने’ के इब्रानी मुहावरे को स्वाभाविक हिन्दी कथन में बनाए रखता है।
- source_word: וַיִּשְׂרְפוּ אוֹתָהּ וְאֶת אָבִיהָ בָּאֵשׁ
  choice: उस स्त्री और उसके पिता को आग में जला दिया
  rationale: मूल में आग का स्पष्ट उल्लेख है। हिन्दी में यह अभिव्यक्ति स्वाभाविक रहते हुए उस बलाघात को सुरक्षित रखती है और ‘मार डाला’ जैसी अनुलिखित बात नहीं जोड़ती।
