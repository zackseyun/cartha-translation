source:
  edition: WLC
  text: וַ/יֵּרְד֡וּ שְׁלֹשֶׁת֩ אֲלָפִ֨ים אִ֜ישׁ מִֽ/יהוּדָ֗ה אֶל סְעִיף֮ סֶ֣לַע עֵיטָם֒ וַ/יֹּאמְר֣וּ לְ/שִׁמְשׁ֗וֹן הֲ/לֹ֤א יָדַ֨עְתָּ֙ כִּֽי מֹשְׁלִ֥ים בָּ֨/נוּ֙ פְּלִשְׁתִּ֔ים וּ/מַה זֹּ֖את עָשִׂ֣יתָ לָּ֑/נוּ וַ/יֹּ֣אמֶר לָ/הֶ֔ם כַּ/אֲשֶׁר֙ עָ֣שׂוּ לִ֔/י כֵּ֖ן עָשִׂ֥יתִי לָ/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/015/011.yaml
  text: Then three thousand men of Judah went down to the cleft of the rock of Etam and said to Samson[a], “Do you not know that the Philistines are ruling over us? What then is this that you have done to us?” And he said to them, “As they did to me, so I have done to them.”
translation:
  language: hi
  text: तब यहूदा के तीन हज़ार पुरुष एताम की चट्टान की दरार[a] तक उतर गए और शिमशोन से कहा, “क्या तू नहीं जानता कि पलिश्ती हम पर शासन कर रहे हैं? फिर तूने हमारे साथ यह क्या किया?” उसने उनसे कहा, “जैसा उन्होंने मेरे साथ किया, वैसा ही मैंने उनके साथ किया है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “एताम की चट्टान की फाँक।”
    reason: סְעִיף के लिए ‘दरार’ और ‘फाँक’ दोनों संभव स्थलाकृतिक अर्थ हैं।
lexical_decisions:
- source_word: וַיֵּרְדוּ
  choice: उतर गए
  rationale: क्रिया ירד नीचे की ओर जाने को व्यक्त करती है; ‘उतर गए’ स्वाभाविक हिन्दी में दिशात्मक अर्थ बनाए रखता है।
- source_word: שְׁלֹשֶׁת אֲלָפִים אִישׁ מִיהוּדָה
  choice: यहूदा के तीन हज़ार पुरुष
  rationale: यह गिनी हुई पुरुषों की टोली है और מִיהוּדָה उनके यहूदा से संबंध को बताता है।
- source_word: אֶל סְעִיף סֶלַע עֵיטָם
  choice: एताम की चट्टान की दरार तक
  rationale: סְעִיף यहाँ चट्टान की दरार या फटन का संकेत देता है; אֶל को ‘तक’ कहने से गंतव्य व्यक्त होता है, बिना यह अनावश्यक रूप से निश्चित किए कि वे दरार के भीतर गए।
- source_word: הֲלֹא יָדַעְתָּ
  choice: क्या तू नहीं जानता
  rationale: नकारात्मक प्रश्न आलंकारिक है और सामने वाले को एक प्रत्यक्ष तथ्य याद दिलाता है। एकवचन ‘तू’ इब्रानी संबोधन को बनाए रखता है।
- source_word: כִּי מֹשְׁלִים בָּנוּ פְּלִשְׁתִּים
  choice: कि पलिश्ती हम पर शासन कर रहे हैं
  rationale: מֹשְׁלִים कृदंत है और चल रहे राजनीतिक प्रभुत्व को व्यक्त करता है।
- source_word: וּמַה זֹּאת עָשִׂיתָ לָּנוּ
  choice: फिर तूने हमारे साथ यह क्या किया?
  rationale: यह प्रश्न उनके इस आरोप को बनाए रखता है कि शिमशोन के काम का परिणाम उन पर पड़ा है; ‘फिर’ पिछले आलंकारिक प्रश्न से संवाद का संबंध स्पष्ट करता है।
- source_word: כַּאֲשֶׁר עָשׂוּ לִי כֵּן עָשִׂיתִי לָהֶם
  choice: जैसा उन्होंने मेरे साथ किया, वैसा ही मैंने उनके साथ किया है
  rationale: यह अनुवाद इब्रानी की तुलनात्मक संरचना और प्रतिकार के संक्षिप्त कथन को बनाए रखता है।
theological_decisions:
- issue: शिमशोन के उत्तर में प्रतिकार का नैतिक मूल्यांकन
  choice: उसके कथन को बिना नैतिक टिप्पणी के सीधे प्रतिकार के रूप में प्रस्तुत किया गया है।
  alternative: इसे या तो न्यायोचित बदला अथवा निंदनीय निजी प्रतिशोध बताकर अधिक व्याख्यात्मक ढंग से अनूदित करना।
  rationale: पद शिमशोन का तर्क बताता है, पर उसका स्पष्ट नैतिक मूल्यांकन नहीं करता; इसलिए मूल पाठ का धार्मिक और नैतिक तनाव सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। संवाद में एकवचन ‘तू’ मूल इब्रानी के सीधे संबोधन और तनावपूर्ण प्रसंग के अनुकूल है; इसे असम्मान जोड़ने के लिए नहीं, बल्कि व्याकरणिक संख्या और प्रसंग को सुरक्षित रखने के लिए चुना गया है।
