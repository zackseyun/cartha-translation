base_translation:
  language: en
  yaml_path: translation/ot/judges/015/016.yaml
  text: Then Samson said[a], “With the jawbone of a donkey, a heap, two heaps; with the jawbone of a donkey I have struck down a thousand men.”
translation:
  language: hi
  text: 'तब शिमशोन ने कहा[a],


    “गधे के जबड़े की हड्डी से—ढेर, दो ढेर!

    गधे के जबड़े की हड्डी से मैंने एक हज़ार पुरुषों को मार गिराया।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'हिब्रानी में शब्द-क्रीड़ा है: ‘गधे’ और यहाँ ‘ढेर’ के लिए प्रयुक्त शब्दों की ध्वनियाँ बहुत मिलती-जुलती हैं। ‘ढेर, दो ढेर’ इस शब्द-क्रीड़ा और मूल की असामान्य अभिव्यक्ति को यथासंभव बनाए रखता है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने कहा
  rationale: वाव-क्रमिक रूप कथा को आगे बढ़ाता है; ‘तब’ स्वाभाविक हिन्दी में घटनाक्रम स्पष्ट करता है।
- source_word: שִׁמְשׁוֹן
  choice: शिमशोन
  rationale: हिब्रानी नाम Shimshon का प्रचलित हिन्दी बाइबलीय लिप्यंतरण।
- source_word: בִּלְחִי הַחֲמוֹר
  choice: गधे के जबड़े से
  rationale: לְחִי यहाँ हथियार के रूप में प्रयुक्त जबड़े की हड्डी को सूचित करता है; हिन्दी में ‘जबड़ा’ संक्षिप्त और स्वाभाविक है, और ‘से’ साधन का भाव देता है।
- source_word: חֲמוֹר חֲמֹרָתָיִם
  choice: ढेर, दो ढेर
  rationale: यह חֲמוֹר (‘गधा’) से ध्वन्यात्मक शब्द-क्रीड़ा वाला कठिन काव्यांश है। ‘ढेर, दो ढेर’ संख्या-रूप और वास्तविक अस्पष्टता को अधिक निकटता से रखता है; शब्द-क्रीड़ा पादटिप्पणी में बताई गई है।
- source_word: הִכֵּיתִי
  choice: मैंने ... मार गिराया
  rationale: נכה का मूल भाव प्रहार करना है, पर युद्ध-संदर्भ में परिणाम घातक है; ‘मार गिराया’ हिन्दी में दोनों पक्षों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֶלֶף אִישׁ
  choice: एक हज़ार पुरुषों
  rationale: אִישׁ यहाँ सामूहिक रूप से पुरुष योद्धाओं के लिए है; ‘पुरुषों’ मूल की लैंगिक और युद्ध-संदर्भगत विशेषता बनाए रखता है।
