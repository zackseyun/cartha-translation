  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सहज। कथन को विजय-गीत जैसी काव्यात्मक पंक्तियों में रखा गया है। ‘हज़ार’ का प्रचलित वर्तनी-रूप और ‘मार गिराया’ का स्वाभाविक युद्ध-संदर्भ अपनाया गया है।
