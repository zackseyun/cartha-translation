  yaml_path: translation/ot/judges/015/005.yaml
  text: He set fire to the torches and let them go into the standing grain of the Philistines[a], and burned up the shocks and the standing grain[b], and even the olive groves.
translation:
  language: hi
  text: उसने मशालों[a] को आग लगाई और उन्हें पलिश्तियों की खड़ी फसल में छोड़ दिया। उसने अनाज के ढेर से लेकर खड़ी फसल तक और जैतून के बाग तक जला डाला।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘आग के कुंदे’।
    reason: lexical_alternative
  - marker: b
    text: 'इब्रानी में शाब्दिक रूप से: ‘अनाज के ढेर से लेकर खड़ी फसल तक और जैतून के बाग तक।’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּבְעֶר אֵשׁ
  choice: आग लगा दी
  rationale: हिफ़ील क्रिया यहाँ किसी वस्तु को प्रज्वलित करने का अर्थ देती है; ‘आग लगा दी’ सहज और सटीक आधुनिक हिन्दी है।
- source_word: לַפִּידִים
  choice: मशालों
  rationale: यह शब्द जलती मशालों या आग लगाने वाले पलीतों को सूचित कर सकता है। मुख्य पाठ में ‘मशालों’ सर्वाधिक स्पष्ट है और वैकल्पिक अर्थ पाद-टिप्पणी में रखा गया है।
- source_word: וַיְשַׁלַּח
  choice: छोड़ दिया
  rationale: क्रिया का अर्थ ‘भेज देना’ या ‘खुला छोड़ देना’ है। पिछले पद के पशुओं के संदर्भ में ‘उन्हें ... छोड़ दिया’ स्वाभाविक है और इस पद में अनुपस्थित विवरण नहीं जोड़ता।
- source_word: בְּקָמוֹת
  choice: खड़ी फसल के बीच
  rationale: קָמָה खेत में जड़ पर खड़े, अभी न काटे गए अनाज को दर्शाता है; ‘खड़ी फसल’ कृषि-संबंधी भेद को बनाए रखती है।
- source_word: פְּלִשְׁתִּים
  choice: पलिश्तियों
  rationale: इस जातिनाम का प्रचलित और स्पष्ट हिन्दी रूप।
- source_word: מִגָּדִישׁ
  choice: अनाज के ढेरों
  rationale: גָּדִישׁ काटकर इकट्ठा या ढेर किए गए अनाज को दर्शाता है। यह चयन उसे खड़ी फसल से स्पष्ट रूप से अलग रखता है।
- source_word: מִגָּדִישׁ וְעַד קָמָה וְעַד כֶּרֶם זָיִת
  choice: अनाज के ढेरों से लेकर खड़ी फसल तक, और जैतून के बागों तक सब कुछ
  rationale: मूल की ‘से ... तक ... और ... तक’ विस्तार-संरचना को पठनीय हिन्दी में बनाए रखा गया है; ‘सब कुछ’ विनाश की पूरी परिधि को स्वाभाविक रूप से व्यक्त करता है।
- source_word: כֶּרֶם זָיִת
  choice: जैतून के बागों
  rationale: כֶּרֶם किसी व्यवस्थित रोपण-क्षेत्र को और זַיִת जैतून को निर्दिष्ट करता है; हिन्दी में ‘जैतून के बाग’ इसका स्वाभाविक रूप है।
- source_word: וַיַּבְעֵר
  choice: जला डाला
  rationale: यहाँ क्रिया आग से हुए विनाश का परिणाम बताती है; ‘जला डाला’ पूर्ण विनाश को सहज हिन्दी में व्यक्त करता है।
