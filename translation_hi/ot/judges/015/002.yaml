base_translation:
  language: en
  yaml_path: translation/ot/judges/015/002.yaml
  text: And her father said[a], “I really thought that you utterly hated her, so I gave her to your companion. Is not her younger sister better than she? Please let her be yours instead of her.”
translation:
  language: hi
  text: तब उसके पिता ने कहा, “मैंने सचमुच सोचा था कि तुम उससे पूरी तरह घृणा करते हो, इसलिए मैंने उसे तुम्हारे साथी[a] को दे दिया। क्या उसकी छोटी बहन उससे अच्छी नहीं है? कृपया उसकी छोटी बहन को उसके बदले अपने लिए ले लो।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “साथी” का अनुवाद “मित्र” भी हो सकता है। इब्रानी शब्द किसी मित्र, सहयोगी या सहचर के लिए व्यापक रूप से प्रयुक्त हो सकता है; इस विवाह के प्रसंग में कुछ लोग इसे शिमशोन के साथ उपस्थित विवाह-सहचर के रूप में समझते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: אָמֹר אָמַרְתִּי
  choice: मैंने सचमुच सोचा था
  rationale: इन्फिनिटिव एब्सोल्यूट और परफेक्ट का संयोजन कथन पर बल देता है; यह हिंदी में उस जोर को स्वाभाविक रूप से व्यक्त करता है।
- source_word: שָׂנֹא שְׂנֵאתָהּ
  choice: तुम उससे पूरी तरह घृणा करने लगे हो
  rationale: दोहराए गए क्रियारूप तीव्रता व्यक्त करते हैं। प्रसंग में पिता शिमशोन के संबंध-विच्छेद को स्थायी मान बैठा था; ‘पूरी तरह घृणा’ मूल के जोर को रखता है।
- source_word: וָאֶתְּנֶנָּה
  choice: इसलिए मैंने उसे ... दे दिया
  rationale: वाव यहाँ पिता के अनुमान के परिणाम को आगे बढ़ाता है; ‘इसलिए’ तर्क-संबंध को स्पष्ट और स्वाभाविक बनाता है।
- source_word: לְמֵרֵעֶךָ
  choice: तुम्हारे साथी को
  rationale: מֵרֵעַ मित्र, सहचर या सहयोगी के व्यापक अर्थ में आता है। ‘साथी’ विवाह-संबंधी किसी विशिष्ट भूमिका को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: אֲחֹתָהּ הַקְּטַנָּה
  choice: उसकी छोटी बहन
  rationale: भाई-बहन के प्रसंग में קְטַנָּה का स्वाभाविक हिंदी अर्थ ‘छोटी’ अर्थात कम आयु वाली है।
- source_word: טוֹבָה מִמֶּנָּה
  choice: उससे अच्छी
  rationale: טוֹבָה सामान्य श्रेष्ठता बताता है; ‘अधिक सुंदर’ कहना मूल से अधिक विशिष्ट होता।
- source_word: תְּהִי נָא לְךָ
  choice: कृपया ... इसे अपना लो
  rationale: जसिव के साथ נָא विनम्र आग्रह व्यक्त करता है। ‘अपना लो’ आधुनिक हिंदी में प्रस्ताव को सहज रूप देता है, बिना विवाह का शब्द स्पष्ट रूप से जोड़ने के।
- source_word: תַּחְתֶּיהָ
  choice: उसके बदले
  rationale: यहाँ תַּחַת प्रतिस्थापन व्यक्त करता है; ‘उसके बदले’ संक्षिप्त और स्पष्ट है।
