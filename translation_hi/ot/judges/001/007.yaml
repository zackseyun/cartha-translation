source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֲדֹֽנִי בֶ֗זֶק שִׁבְעִ֣ים מְלָכִ֡ים בְּֽהֹנוֹת֩ יְדֵי/הֶ֨ם וְ/רַגְלֵי/הֶ֜ם מְקֻצָּצִ֗ים הָי֤וּ מְלַקְּטִים֙ תַּ֣חַת שֻׁלְחָנִ֔/י כַּ/אֲשֶׁ֣ר עָשִׂ֔יתִי כֵּ֥ן שִׁלַּם לִ֖/י אֱלֹהִ֑ים וַ/יְבִיאֻ֥/הוּ יְרוּשָׁלִַ֖ם וַ/יָּ֥מָת שָֽׁם־׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/007.yaml
  text: And Adoni-bezek said[a], “Seventy kings, with the thumbs of their hands and their feet cut off, used to gather scraps under my table. As I have done, so God has repaid me.” And they brought him to Jerusalem[b], and he died there.
translation:
  language: hi
  text: अदोनी-बेजेक ने कहा, “सत्तर राजा, जिनके हाथों के अँगूठे और पैरों के बड़े अँगूठे काट दिए गए थे[a], मेरी मेज़ के नीचे बचे हुए टुकड़े बीनते थे। जैसा मैंने किया, वैसा ही परमेश्वर[b] ने मुझे प्रतिफल दिया है।” तब वे उसे यरूशलेम ले आए, और वह वहीं मर गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “उनके हाथों और पैरों के अँगूठे।”
    reason: मूल अभिव्यक्ति की संरचना बताने वाला शाब्दिक विकल्प।
  - marker: b
    text: इब्रानी शब्द אֱלֹהִים रूप की दृष्टि से बहुवचन है, पर यहाँ उसके साथ एकवचन क्रिया आई है; इसलिए “परमेश्वर,” न कि “देवताओं।”
    reason: व्याकरण के आधार पर चुने गए एकवचन अर्थ को स्पष्ट करना।
lexical_decisions:
- source_word: אֲדֹנִי בֶזֶק
  choice: अदोनी-बेजेक
  rationale: संदर्भ में यह वक्ता का व्यक्तिवाचक नाम है; इसलिए इसके संभावित अर्थ ‘बेजेक का स्वामी’ का अनुवाद करने के बजाय नाम का लिप्यंतरण किया गया है।
- source_word: בְּהֹנוֹת יְדֵיהֶם וְרַגְלֵיהֶם
  choice: उनके हाथों के अँगूठे और पैरों के बड़े अँगूठे
  rationale: בֹּהֶן हाथ के लिए अँगूठा और पैर के लिए बड़ा अँगूठा दर्शाता है। हिंदी में स्वाभाविक और शारीरिक रूप से स्पष्ट अभिव्यक्ति चुनी गई है।
- source_word: מְקֻצָּצִים
  choice: काट दिए गए थे
  rationale: קצץ का निष्क्रिय कृदंत अंगों को काटकर अलग किए जाने का अर्थ देता है।
- source_word: הָיוּ מְלַקְּטִים
  choice: बटोरा करते थे
  rationale: यह रचना अतीत में बार-बार होने वाली क्रिया बताती है; לקט का मूल भाव चुनना या बटोरना है।
- source_word: תַּחַת שֻׁלְחָנִי
  choice: मेरी मेज़ के नीचे से
  rationale: स्थान और वहाँ से टुकड़े बटोरने की क्रिया को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: כַּאֲשֶׁר עָשִׂיתִי כֵּן שִׁלַּם לִי
  choice: जैसा मैंने किया, वैसा ही ... ने मुझे बदला दिया है
  rationale: कथन में कर्म के अनुरूप प्रतिफल मिलने की तुलना सुरक्षित रखी गई है। ‘बदला दिया’ यहाँ प्रतिदान या किए का फल लौटाने के अर्थ में है।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: संज्ञा का रूप बहुवचन है, पर उससे जुड़ी क्रिया שִׁלַּם एकवचन है; इसलिए यहाँ एकवचन अर्थ उपयुक्त है।
- source_word: וַיְבִיאֻהוּ יְרוּשָׁלִַם וַיָּמָת שָׁם
  choice: तब वे उसे यरूशलेम ले आए, और वह वहीं मर गया
  rationale: क्रमिक कथात्मक क्रियाओं, बहुवचन कर्ता, एकवचन कर्म और मृत्यु के स्थान को स्पष्ट रूप से बनाए रखा गया है।
theological_decisions:
- issue: अदोनी-बेजेक के कथन में אֱלֹהִים का संदर्भ
  choice: परमेश्वर
  alternative: देवताओं
  rationale: אֱלֹהִים रूप की दृष्टि से बहुवचन हो सकता है, पर यहाँ क्रिया एकवचन है। अतः एकवचन ‘परमेश्वर’ स्रोत-पाठ के व्याकरण के अधिक अनुरूप है, जबकि वक्ता के विश्वास के विषय में पाठ से आगे कोई निष्कर्ष नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिंदी का सहज किंतु गरिमापूर्ण कथात्मक रूप रखा गया है। ‘बटोरा करते थे’ अभ्यस्त भूतकाल को और ‘हाथों के अँगूठे और पैरों के बड़े अँगूठे’ मूल शारीरिक भेद को सामान्य पाठक के लिए स्पष्ट करते हैं।
