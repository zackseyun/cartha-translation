  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֵּ֨שֶׁב֙ הָ/אָ֣שֵׁרִ֔י בְּ/קֶ֥רֶב הַֽ/כְּנַעֲנִ֖י יֹשְׁבֵ֣י הָ/אָ֑רֶץ כִּ֖י לֹ֥א הוֹרִישֽׁ/וֹ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/032.yaml
  text: So the Asherites lived among the Canaanites[a], the inhabitants of the land, because they did not drive them out.
translation:
  language: hi
  text: इसलिए आशेरवंशी उस देश के निवासियों, कनानियों[a], के बीच रहने लगे, क्योंकि उन्होंने उन्हें नहीं निकाला।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी में यहाँ सामूहिक एकवचन रूप हैं: शाब्दिक रूप से, “आशेरी … कनानी … उसने उसे बेदखल नहीं किया।” हिन्दी में अभिप्रेत सामूहिक अर्थ व्यक्त किया गया है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: रहने लगे
  rationale: ישׁב का अर्थ बैठना, बसना या रहना हो सकता है। यहाँ यह किसी दूसरे जनसमूह के बीच निवास करने की स्थिति बताता है; ‘रहने लगे’ आधुनिक हिन्दी में स्वाभाविक है और कथात्मक क्रम भी व्यक्त करता है।
- source_word: הָאָשֵׁרִי
  choice: आशेरवंशी
  rationale: सव्यवच्छेदक एकवचन रूप यहाँ पूरे गोत्र के लिए सामूहिक अर्थ में प्रयुक्त है। ‘आशेरवंशी’ हिन्दी में उस गोत्र के लोगों को स्वाभाविक रूप से दर्शाता है।
- source_word: בְּקֶרֶב
  choice: के बीच
  rationale: यह पद किसी समूह के मध्य रहने का भाव देता है; ‘के बीच’ संक्षिप्त और सहज हिन्दी है।
- source_word: הַכְּנַעֲנִי
  choice: कनानियों
  rationale: रूपतः एकवचन होने पर भी यह जातिसूचक सामूहिक संज्ञा है। आगे का बहुवचन कृदन्त भी सामूहिक अर्थ की पुष्टि करता है, इसलिए हिन्दी बहुवचन उपयुक्त है।
- source_word: יֹשְׁבֵי הָאָרֶץ
  choice: उस देश के निवासी
  rationale: यह पद कनानियों की समानाधिकरणीय पहचान देता है। ‘उस देश के निवासी’ प्रसंगानुकूल, स्पष्ट और स्वाभाविक है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यहाँ כִּי पिछले कथन का कारण प्रस्तुत करता है; ‘क्योंकि’ इस कारणात्मक सम्बन्ध को स्पष्ट रखता है।
- source_word: לֹא הוֹרִישׁוֹ
  choice: उन्होंने उन्हें वहाँ से नहीं निकाला
  rationale: न्यायियों में ירשׁ का हिफ़ील रूप प्रायः किसी भूमि के निवासियों को बेदखल करने या निकालने के अर्थ में आता है। ‘वहाँ से नहीं निकाला’ सामान्य हिन्दी में सहज है; सामूहिक कर्ता और कर्म के कारण बहुवचन सर्वनाम रखे गए हैं।
theological_decisions:
- issue: गोत्र और जाति के लिए सामूहिक एकवचन
  choice: आशेरवंशियों और कनानियों को सामूहिक बहुवचन अर्थ में प्रस्तुत किया गया—‘आशेरवंशी … कनानियों … उन्होंने उन्हें’।
  alternative: रूपगत एकवचन को ज्यों का त्यों रखना—‘आशेरी … कनानी … उसने उसे’।
  rationale: इब्रानी में गोत्रों और जातियों के लिए सामूहिक एकवचन सामान्य है। हिन्दी में कठोर एकवचन से एक व्यक्ति और एक कनानी का भ्रामक अर्थ निकल सकता है, जबकि प्रसंग पूरे गोत्र और देश के निवासियों से सम्बन्धित है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक रूप। जातिसूचक सामूहिक अर्थ को स्पष्ट रखते हुए इब्रानी की रूपगत विशेषता पादटिप्पणी में सुरक्षित की गई है।
