translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘अड़े रहे’ एमोरियों की दृढ़ता को, ‘हाथ भारी हो गया’ मूल बिंब को, और ‘बेगार’ बाध्य श्रम को सुरक्षित रखता है। स्थान-नामों के लिए सरल देवनागरी लिप्यंतरण अपनाया गया है।
