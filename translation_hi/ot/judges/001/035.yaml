base_translation:
  language: en
  yaml_path: translation/ot/judges/001/035.yaml
  text: But the Amorites persisted in dwelling in Mount Heres[a], in Aijalon, and in Shaalbim; then the hand of the house of Joseph grew heavy[b], and they became subject to forced labor.
translation:
  language: hi
  text: पर एमोरी लोग हेरेस पर्वत, अय्यालोन और शालबीम में बसे रहने पर अड़े रहे। तब यूसुफ के घराने का हाथ उन पर भारी हो गया[a], और उनसे बेगार कराई जाने लगी[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यूसुफ का घराना उन पर प्रबल हो गया।” इसका शाब्दिक अर्थ है, “यूसुफ के घराने का हाथ भारी हो गया।” यह इब्रानी मुहावरा बढ़ती हुई शक्ति या दबाव डालने वाली सत्ता व्यक्त कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “वे बेगार करनेवाले बन गए।” इब्रानी शब्द अनिवार्य श्रम-सेवा या श्रम-कर को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹאֶל ... לָשֶׁבֶת
  choice: बसे रहने पर अड़े रहे
  rationale: यहाँ יאל इच्छा, दृढ़ निश्चय या किसी काम पर आमादा होने का भाव देता है। प्रसंग में यह एमोरियों के उन स्थानों में बने रहने की दृढ़ता व्यक्त करता है।
- source_word: הָאֱמֹרִי
  choice: एमोरी लोग
  rationale: इब्रानी में रूप एकवचन है, पर यह जाति के लिए सामूहिक रूप से प्रयुक्त हुआ है; आगे का बहुवचन भी इसी की पुष्टि करता है।
- source_word: בְּהַר חֶרֶס
  choice: हेरेस पहाड़
  rationale: הַר का मूल अर्थ पहाड़ है और חֶרֶס यहाँ स्थान-नाम है। यह अनुवाद स्थल की पहचान बनाए रखता है, यद्यपि अभिव्यक्ति पहाड़ी क्षेत्र का संकेत भी दे सकती है।
- source_word: בְּאַיָּלוֹן
  choice: अय्यालोन
  rationale: स्थान-नाम का स्रोत-आधारित देवनागरी लिप्यंतरण।
- source_word: וּבְשַׁעַלְבִים
  choice: और शालबीम
  rationale: स्थान-नाम का स्रोत-आधारित देवनागरी लिप्यंतरण और संयोजक का संरक्षण।
- source_word: וַתִּכְבַּד יַד בֵּית יוֹסֵף
  choice: यूसुफ के घराने का हाथ उन पर भारी हो गया
  rationale: शाब्दिक बिंब ‘हाथ भारी हुआ’ को स्वाभाविक हिन्दी में रखा गया है; यह यूसुफ के घराने की बढ़ती और दबावकारी शक्ति को दर्शाता है। ‘उन पर’ प्रसंगगत संबंध स्पष्ट करता है।
- source_word: בֵּית יוֹסֵף
  choice: यूसुफ का घराना
  rationale: यह संबंध-राजनीतिक अभिव्यक्ति यूसुफ से जुड़े गोत्रों के सामूहिक समूह को सूचित करती है; ‘घराना’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: וַיִּהְיוּ לָמַס
  choice: उनसे बेगार कराई जाने लगी
  rationale: מַס अनिवार्य श्रम-सेवा या श्रम के रूप में दिए जाने वाले कर को दर्शाता है। ‘बेगार’ हिन्दी में इस बाध्य श्रम का संक्षिप्त और सटीक शब्द है।
