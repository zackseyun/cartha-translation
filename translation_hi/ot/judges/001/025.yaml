translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘नगर को ... मार गिराया’ में इब्रानी का नगर के लिए सामूहिक/लाक्षणिक प्रयोग बनाए रखा गया है; ‘परिवार’ की संभावित व्यापकता पादटिप्पणी में दी गई है। अंग्रेज़ी परामर्श-पाठ में पादटिप्पणी-चिह्नों का स्थान विषयवस्तु से असंगत था, इसलिए हिन्दी में तलवार-संबंधी टिप्पणी [a] को तलवार के बाद और परिवार-संबंधी टिप्पणी [b] को परिवार के बाद रखा गया है।
