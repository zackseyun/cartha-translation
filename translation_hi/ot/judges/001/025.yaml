  text: וַ/יַּרְאֵ/ם֙ אֶת מְב֣וֹא הָ/עִ֔יר וַ/יַּכּ֥וּ אֶת הָ/עִ֖יר לְ/פִי חָ֑רֶב וְ/אֶת הָ/אִ֥ישׁ וְ/אֶת כָּל מִשְׁפַּחְתּ֖/וֹ שִׁלֵּֽחוּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/025.yaml
  text: So he showed them the entrance to the city[a], and they struck the city with the edge of the sword[b]; but they let the man and all his family go.
translation:
  language: hi
  text: तब उसने उन्हें नगर में प्रवेश का मार्ग दिखाया। उन्होंने नगर को तलवार की धार से मार डाला[a], लेकिन उस आदमी और उसके सारे परिवार[b] को जाने दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप से: “तलवार के मुँह से”; यह तलवार से मार डालने का इब्रानी मुहावरा है।'
    reason: lexical_alternative
  - marker: b
    text: या “उसके सारे घराने” अथवा “उसके सारे कुल”।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְאֵם
  choice: उसने उन्हें ... दिखा दिया
  rationale: ראה का यह रूप यहाँ कारणवाचक अर्थ देता है—उस आदमी ने आक्रमणकारियों को प्रवेश का स्थान या मार्ग बता दिया।
- source_word: מְבוֹא הָעִיר
  choice: नगर में प्रवेश करने का रास्ता
  rationale: מָבוֹא नगर के प्रवेश, भीतर जाने के मार्ग या पहुँच को दर्शाता है। आधुनिक हिन्दी में यह वाक्यांश स्पष्ट और स्वाभाविक है।
- source_word: וַיַּכּוּ
  choice: मार गिराया
  rationale: נכה का अर्थ मारना, प्रहार करना या परास्त करना हो सकता है। तलवार वाले अगले वाक्यांश के साथ यहाँ घातक सैन्य कार्रवाई अभिप्रेत है।
- source_word: לְפִי חָרֶב
  choice: तलवार की धार से
  rationale: इब्रानी मुहावरे का शाब्दिक चित्र ‘तलवार के मुँह से’ है; ‘तलवार की धार से’ हिन्दी में अर्थ और चित्र दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: שִׁלֵּחוּ
  choice: जाने दिया
  rationale: संदर्भ में इसका अर्थ उस आदमी और उसके परिवार को न मारकर छोड़ देना और विदा कर देना है।
- source_word: כָּל מִשְׁפַּחְתּוֹ
  choice: उसके पूरे परिवार
  rationale: מִשְׁפָּחָה परिवार, घराने या व्यापक कुल को सूचित कर सकता है। ‘पूरा परिवार’ मुख्य पाठ में सहज है, जबकि व्यापक विकल्प पादटिप्पणी में सुरक्षित हैं।
- source_word: הָאִישׁ
  choice: उस आदमी
  rationale: निश्चित संज्ञा पिछले पद में उल्लिखित उसी व्यक्ति की ओर संकेत करती है; हिन्दी कथा-शैली में ‘उस आदमी’ यह संदर्भ स्पष्ट करती है।
