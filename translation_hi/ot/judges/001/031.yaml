source:
  edition: WLC
  text: אָשֵׁ֗ר לֹ֤א הוֹרִישׁ֙ אֶת יֹשְׁבֵ֣י עַכּ֔וֹ וְ/אֶת יוֹשְׁבֵ֖י צִיד֑וֹן וְ/אֶת אַחְלָ֤ב וְ/אֶת אַכְזִיב֙ וְ/אֶת חֶלְבָּ֔ה וְ/אֶת אֲפִ֖יק וְ/אֶת רְחֹֽב־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/031.yaml
  text: Asher did not drive out the inhabitants of Acco[a], or the inhabitants of Sidon, or Ahlab, or Achzib, or Helbah, or Aphek[b], or Rehob.
translation:
  language: hi
  text: आशेर ने अक्को[b] के निवासियों को नहीं निकाला[a], न सीदोन के निवासियों को, न अहलाब के निवासियों को, न अकज़ीब के निवासियों को, न हेलबा के निवासियों को, न अफीक के निवासियों को, और न रहोब के निवासियों को।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उन्हें उनके अधिकार से वंचित नहीं किया।” इब्रानी क्रिया का आशय पहले से बसे लोगों को भूमि के अधिकार से हटाना या उन्हें वहाँ से निकालना है।
    reason: lexical_alternative
  - marker: b
    text: अक्को प्राचीन समुद्रतटीय नगर था, जो बाद में एकर नाम से जाना गया।
    reason: cultural_note
lexical_decisions:
- source_word: הוֹרִישׁ
  choice: नहीं निकाला
  rationale: हिफ़ील रूप यहाँ पहले से बसे लोगों को भूमि के अधिकार से हटाने या बाहर निकालने का अर्थ देता है। ‘नहीं निकाला’ न्यायियों 1 के विजय-वर्णन में स्वाभाविक और स्पष्ट है; पादटिप्पणी ‘अधिकार से वंचित नहीं किया’ वाली अर्थछाया भी बताती है।
- source_word: יֹשְׁבֵי
  choice: के निवासी
  rationale: यह ישב का कृदंत रूप है और किसी स्थान में रहने वाले लोगों के सामूहिक समूह को सूचित करता है।
- source_word: עַכּוֹ
  choice: अक्को
  rationale: इब्रानी स्थान-नाम का देवनागरी लिप्यंतरण; बाद का नाम ‘एकर’ मुख्य पाठ में रखकर कालभ्रम उत्पन्न नहीं किया गया।
- source_word: צִידוֹן
  choice: सीदोन
  rationale: इब्रानी स्थान-नाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण।
- source_word: אַחְלָב
  choice: अहलाब
  rationale: स्थान-नाम का निकट देवनागरी लिप्यंतरण।
- source_word: אַכְזִיב
  choice: अकज़ीब
  rationale: स्थान-नाम का लिप्यंतरण, जिसमें ז की ध्वनि को ‘ज़’ से व्यक्त किया गया है।
- source_word: חֶלְבָּה
  choice: हेलबा
  rationale: इस पद के इब्रानी व्यंजनात्मक रूप के अनुरूप स्थान-नाम का लिप्यंतरण।
- source_word: אֲפִיק
  choice: अफीक
  rationale: मसोरेटिक उच्चारण के निकट देवनागरी लिप्यंतरण।
- source_word: רְחֹב
  choice: रहोब
  rationale: स्थान-नाम का प्रचलित और स्रोत के निकट लिप्यंतरण।
- source_word: וְ/אֶת ... וְ/אֶת
  choice: और न ... और न ... या
  rationale: नकारात्मक क्रिया के अधीन बार-बार आए संयोजक और कर्मचिह्न को हिन्दी में वितरणात्मक सूची के रूप में व्यक्त किया गया है। अंतिम ‘या’ सूची को स्वाभाविक हिन्दी देता है, जबकि सभी स्थानों पर निषेध लागू रहता है।
