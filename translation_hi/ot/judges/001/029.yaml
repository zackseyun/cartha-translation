source:
  edition: WLC
  text: וְ/אֶפְרַ֨יִם֙ לֹ֣א הוֹרִ֔ישׁ אֶת הַֽ/כְּנַעֲנִ֖י הַ/יּוֹשֵׁ֣ב בְּ/גָ֑זֶר וַ/יֵּ֧שֶׁב הַֽ/כְּנַעֲנִ֛י בְּ/קִרְבּ֖/וֹ בְּ/גָֽזֶר־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/029.yaml
  text: And Ephraim did not drive out the Canaanites who lived in Gezer[a], and the Canaanites lived among them in Gezer.
translation:
  language: hi
  text: और एप्रैम ने गेजेर में रहने वाले कनानियों को नहीं निकाला, और कनानी गेजेर में उनके बीच[a] बसे रहे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘उसके बीच’; एकवचन सर्वनाम एप्रैम को एक गोत्रीय इकाई के रूप में दर्शाता है। अनुवाद में सामूहिक अर्थ को ‘उनके बीच’ कहा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹרִישׁ
  choice: निकाला
  rationale: हिफ़इल रूप यहाँ पहले से बसे निवासियों को उस स्थान से हटाने या बेदखल करने का भाव देता है। ‘निकाला’ सहज आधुनिक हिन्दी में इस अर्थ को स्पष्ट रखता है।
- source_word: הַכְּנַעֲנִי
  choice: कनानियों / कनानी
  rationale: इब्रानी में रूप एकवचन है, पर यहाँ जातिसूचक सामूहिक अर्थ में प्रयुक्त हुआ है। पहले खंड में ‘कनानियों’ और दूसरे में सामूहिक ‘कनानी’ स्वाभाविक हिन्दी देते हैं।
- source_word: הַיּוֹשֵׁב
  choice: रहने वाले
  rationale: ישׁב का कृदन्त गेजेर में उनके लगातार निवास को बताता है; ‘रहने वाले’ वर्तमान हिन्दी में स्वाभाविक है।
- source_word: בְּגָזֶר
  choice: गेजेर में
  rationale: בְּ स्थानसूचक है और नगर के भीतर निवास के लिए ‘में’ उपयुक्त है।
- source_word: וַיֵּשֶׁב
  choice: बसे रहे
  rationale: यह कथानक को आगे बढ़ाते हुए कनानियों के वहीं बने रहने का परिणाम-सदृश, पर स्पष्ट रूप से केवल संयोजित, विवरण देता है। ‘बसे रहे’ निवास की निरंतरता को सहज ढंग से व्यक्त करता है।
- source_word: בְּקִרְבּוֹ
  choice: उनके बीच
  rationale: शाब्दिक रूप से प्रत्यय एकवचन है और एप्रैम को एक गोत्रीय इकाई मानकर संदर्भित करता है। हिन्दी में उस गोत्र के लोगों के सामूहिक अर्थ के लिए ‘उनके बीच’ अधिक स्वाभाविक है।
theological_decisions:
- issue: दोनों उपवाक्यों के बीच संबंध
  choice: और
  alternative: इसलिए
  rationale: इब्रानी וַ־ सामान्य संयोजक है। ‘इसलिए’ स्पष्ट कारण-परिणाम जोड़ देता, जो मूल में व्याकरणिक रूप से व्यक्त नहीं है; अतः ‘और’ मूल की खुली हुई कथात्मक कड़ी बनाए रखता है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। ‘निकाला’ तथा ‘बसे रहे’ सामान्य पाठकों के लिए स्पष्ट हैं; ‘और’ मूल इब्रानी के संयोजन को बिना अतिरिक्त कारणात्मक अर्थ जोड़े सुरक्षित रखता है।
