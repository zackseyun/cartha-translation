  text: נַפְתָּלִ֗י לֹֽא הוֹרִ֞ישׁ אֶת יֹשְׁבֵ֤י בֵֽית שֶׁ֨מֶשׁ֙ וְ/אֶת יֹשְׁבֵ֣י בֵית עֲנָ֔ת וַ/יֵּ֕שֶׁב בְּ/קֶ֥רֶב הַֽ/כְּנַעֲנִ֖י יֹשְׁבֵ֣י הָ/אָ֑רֶץ וְ/יֹשְׁבֵ֤י בֵֽית שֶׁ֨מֶשׁ֙ וּ/בֵ֣ית עֲנָ֔ת הָי֥וּ לָ/הֶ֖ם לָ/מַֽס־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/033.yaml
  text: Naphtali did not drive out the inhabitants of Beth-shemesh or the inhabitants of Beth-anath[a], so he lived among the Canaanites, the inhabitants of the land. And the inhabitants of Beth-shemesh and Beth-anath became forced labor for them.
translation:
  language: hi
  text: नप्ताली ने बेत-शेमेश और बेत-अनात के निवासियों को नहीं निकाला, और वह उस देश के निवासी कनानियों के बीच बस गया। बेत-शेमेश और बेत-अनात के निवासी उनके लिए बेगार करने लगे[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात उनसे अनिवार्य श्रम-सेवा कराई जाने लगी। इब्रानी शब्द מַס का आशय यहाँ केवल कर या भेंट चुकाना नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹרִישׁ
  choice: निकाला
  rationale: यहाँ ירש के हिफ़ील रूप का अर्थ पहले से बसे लोगों को उस क्षेत्र से निकालना है। ‘निकाला’ सहज आधुनिक हिन्दी में सैन्य और भू-अधिकार, दोनों संदर्भों के अनुकूल है।
- source_word: יֹשְׁבֵי
  choice: निवासियों
  rationale: ישב का कृदन्त किसी स्थान में रहने वालों को सूचित करता है; बार-बार आने वाली इस अभिव्यक्ति के लिए ‘निवासी’ संक्षिप्त और स्वाभाविक है।
- source_word: בֵית שֶׁמֶשׁ
  choice: बेत-शेमेश
  rationale: स्थान-नाम का अर्थानुवाद करने के बजाय उसका लिप्यंतरण किया गया है।
- source_word: בֵית עֲנָת
  choice: बेत-अनात
  rationale: स्थान-नाम को उसके इब्रानी उच्चारण के निकट देवनागरी में लिप्यंतरित किया गया है।
- source_word: וַיֵּשֶׁב בְּקֶרֶב
  choice: और वह … के बीच बस गया
  rationale: एकवचन क्रिया सामूहिक कबीलाई कर्ता ‘नप्ताली’ के अनुरूप रखी गई है। ‘के बीच’ בְּקֶרֶב का स्वाभाविक हिन्दी रूप है, और ‘बस गया’ भूमि में स्थायी निवास का भाव व्यक्त करता है।
- source_word: הַכְּנַעֲנִי
  choice: कनानियों
  rationale: इब्रानी में रूप एकवचन होते हुए भी यहाँ जातीय समूह के सामूहिक अर्थ में है, इसलिए हिन्दी में बहुवचन किया गया है।
- source_word: יֹשְׁבֵי הָאָרֶץ
  choice: उस देश के निवासी
  rationale: यह पद कनानियों की पहचान स्पष्ट करता है। मूल पाठ में उपस्थित इस समानाधिकरण पद को छोड़ा नहीं गया है।
- source_word: הָיוּ לָהֶם לָמַס
  choice: उनके लिए बेगार करने लगे
  rationale: מַס यहाँ केवल कर या भेंट नहीं, बल्कि अनिवार्य श्रम-सेवा को दर्शाता है। ‘बेगार’ आधुनिक हिन्दी में इस आशय को संक्षेप और स्पष्टता से व्यक्त करता है।
- source_word: לָהֶם
  choice: उनके लिए
  rationale: बहुवचन सर्वनाम नप्ताली गोत्र के सदस्यों की ओर संकेत करता है। इससे इब्रानी में सामूहिक एकवचन ‘नप्ताली’ और बाद के बहुवचन संदर्भ के बीच का परिवर्तन बना रहता है।
