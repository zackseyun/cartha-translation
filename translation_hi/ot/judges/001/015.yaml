  register: भाषा आधुनिक, आदरसूचक और कथात्मक रखी गई है। ‘उसने उससे’ मूल पाठ में व्यक्त सर्वनामों को अनावश्यक रूप से नामों में बदलने से बचाता है; कालेब का नाम वहीं दिया गया है जहाँ इब्रानी पाठ उसे स्पष्ट करता है।
