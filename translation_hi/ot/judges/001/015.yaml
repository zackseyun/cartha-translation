base_translation:
  language: en
  yaml_path: translation/ot/judges/001/015.yaml
  text: She said to him[a], “Please give me a blessing, because you have given me the land of the Negev[b]; give me also springs of water.” So Caleb gave her the upper springs and the lower springs.
translation:
  language: hi
  text: उसने उससे कहा, “कृपया मुझे एक आशीष दीजिए। आपने मुझे नेगेव की भूमि[a] दी है, इसलिए मुझे पानी के सोते[b] भी दीजिए।” तब कालेब ने उसे ऊपर के सोते और नीचे के सोते दे दिए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “दक्षिणी भूमि।” इब्रानी नेगेव किसी भौगोलिक क्षेत्र के नाम के रूप में, अथवा दक्षिणी या शुष्क भूभाग के अर्थ में प्रयुक्त हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी पद का अर्थ सोते, कुंड या अन्य जल-स्रोत हो सकता है; शुष्क क्षेत्र के इस प्रसंग में “सोते” उपयुक्त जान पड़ता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הָבָה לִי בְרָכָה
  choice: कृपया मुझे एक आशीष दीजिए
  rationale: הָבָה के आग्रहपूर्ण भाव को आदरसूचक और स्वाभाविक हिन्दी में ‘कृपया…दीजिए’ से व्यक्त किया गया है। בְרָכָה का मूल अर्थ ‘आशीष’ बनाए रखा गया है, यद्यपि प्रसंग में इससे लाभकारी भेंट या भूमि-अनुदान अभिप्रेत है।
- source_word: אֶרֶץ הַנֶּגֶב
  choice: नेगेव की भूमि
  rationale: נֶגֶב यहाँ भौगोलिक क्षेत्र का नाम भी हो सकता है और दक्षिणी अथवा शुष्क भूभाग का वर्णन भी; मुख्य पाठ में प्रचलित भौगोलिक नाम रखा गया और विकल्प पादटिप्पणी में दिया गया है।
- source_word: גֻּלֹּת מָיִם
  choice: पानी के सोते
  rationale: यह पद पानी के स्रोतों को सूचित करता है। शुष्क क्षेत्र के संदर्भ में ‘सोते’ उपयुक्त है, जबकि ‘कुंड’ या अन्य जल-स्रोत की संभावना पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: גֻּלֹּת עִלִּית
  choice: ऊपर के सोते
  rationale: עִלִּית का ऊपरी स्थानसूचक अर्थ सरल और स्वाभाविक हिन्दी में व्यक्त किया गया है तथा पहले प्रयुक्त ‘सोते’ को दोहराकर शब्दगत संगति रखी गई है।
- source_word: גֻּלֹּת תַּחְתִּית
  choice: नीचे के सोते
  rationale: תַּחְתִּית को ‘नीचे के’ रूप में प्रस्तुत किया गया है, जो ‘ऊपर के सोते’ के साथ स्पष्ट स्थानगत जोड़ी बनाता है।
- source_word: וַיִּתֶּן לָהּ כָּלֵב
  choice: तब कालेब ने उसे…दे दिए
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है; ‘तब’ अनुरोध के बाद कालेब की प्रतिक्रिया को सहज आधुनिक हिन्दी में व्यक्त करता है।
