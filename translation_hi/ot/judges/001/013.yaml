source:
  edition: WLC
  text: וַֽ/יִּלְכְּדָ/הּ֙ עָתְנִיאֵ֣ל בֶּן קְנַ֔ז אֲחִ֥י כָלֵ֖ב הַ/קָּטֹ֣ן מִמֶּ֑/נּוּ וַ/יִּתֶּן ל֛/וֹ אֶת עַכְסָ֥ה בִתּ֖/וֹ לְ/אִשָּֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/013.yaml
  text: Othniel son of Kenaz[a], Caleb’s younger brother, captured it, and he gave him his daughter Achsah as a wife.
translation:
  language: hi
  text: कनज के पुत्र ओत्नीएल[a], जो कालेब का छोटा भाई था, ने उस नगर को जीत लिया। तब कालेब ने अपनी बेटी अकसा का विवाह उससे कर दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या संभवतः, “कनज का पुत्र ओत्नीएल, जो कालेब का छोटा संबंधी था।” इब्रानी का सबसे स्वाभाविक अर्थ “कालेब का भाई, जो उससे छोटा था” है, पर कुछ लोग यहाँ “भाई” को व्यापक पारिवारिक अर्थ में समझते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּלְכְּדָהּ
  choice: उस नगर को जीत लिया
  rationale: לכד का अर्थ किसी नगर को युद्ध में अपने अधिकार में लेना है। स्त्रीलिंग प्रत्यय पिछले पद में आए नगर की ओर संकेत करता है; हिन्दी में संदर्भ स्पष्ट करने के लिए ‘उस नगर’ कहा गया है।
- source_word: עָתְנִיאֵל
  choice: ओत्नीएल
  rationale: इब्रानी व्यक्तिगत नाम का हिन्दी देवनागरी में निकट ध्वन्यात्मक लिप्यंतरण।
- source_word: בֶּן קְנַז
  choice: कनज के पुत्र
  rationale: सामान्य वंशसूचक रचना को सीधे रूप में रखा गया है।
- source_word: אֲחִי כָלֵב הַקָּטֹן מִמֶּנּוּ
  choice: जो कालेब का छोटा भाई था
  rationale: इब्रानी का सबसे स्वाभाविक अर्थ ‘कालेब का भाई, जो उससे छोटा था’ है। संबंधसूचक शब्द के व्यापक अर्थ की संभावना पादटिप्पणी में रखी गई है।
- source_word: וַיִּתֶּן לוֹ
  choice: तब कालेब ने ... उससे कर दिया
  rationale: इब्रानी में कर्ता सर्वनाम से निहित है, पर हिन्दी में दो पुरुष पात्रों के कारण अस्पष्टता से बचने हेतु संदर्भानुसार ‘कालेब’ स्पष्ट किया गया है।
- source_word: עַכְסָה
  choice: अकसा
  rationale: इब्रानी नाम का सरल और निकट ध्वन्यात्मक हिन्दी लिप्यंतरण।
- source_word: בִתּוֹ
  choice: अपनी बेटी
  rationale: यह बेटी कालेब की है; स्पष्ट कर्ता ‘कालेब’ के साथ हिन्दी का निजवाचक ‘अपनी’ स्वाभाविक है।
- source_word: לְאִשָּׁה
  choice: का विवाह उससे कर दिया
  rationale: ‘पत्नी के रूप में देना’ विवाह कराने का इब्रानी मुहावरा है; आधुनिक हिन्दी में यही अर्थ गरिमापूर्ण और स्वाभाविक ढंग से व्यक्त होता है।
theological_decisions:
- issue: ओत्नीएल और कालेब का पारिवारिक संबंध
  choice: मुख्य पाठ में ओत्नीएल को कालेब का छोटा भाई कहा गया है।
  alternative: ओत्नीएल को कालेब का छोटा संबंधी, संभवतः भतीजा, समझना।
  rationale: אֲחִי का सीधा अर्थ ‘का भाई’ है और הַקָּטֹן מִמֶּנּוּ का अर्थ ‘उससे छोटा’ है। व्यापक कुल-संबंध का अर्थ संभव है, इसलिए उसे बिना निर्णायक बनाए पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण कथात्मक शैली। दो पुरुष पात्रों के कारण सर्वनामों की संभावित अस्पष्टता दूर करने के लिए दूसरे वाक्य में ‘कालेब’ स्पष्ट किया गया है।
