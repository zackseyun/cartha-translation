  text: וַ/יָּ֨נָס֙ אֲדֹ֣נִי בֶ֔זֶק וַֽ/יִּרְדְּפ֖וּ אַחֲרָ֑י/ו וַ/יֹּאחֲז֣וּ אֹת֔/וֹ וַֽ/יְקַצְּצ֔וּ אֶת בְּהֹנ֥וֹת יָדָ֖י/ו וְ/רַגְלָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/006.yaml
  text: But Adoni-bezek fled[a], and they pursued him, seized him, and cut off his thumbs and big toes.
translation:
  language: hi
  text: परन्तु अदोनी-बेजेक भाग गया। तब उन्होंने उसका पीछा करके उसे पकड़ लिया और उसके हाथों के अंगूठे और पैरों के बड़े अंगूठे[a] काट दिए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “उसके हाथों और पैरों के अंगूठे,” अर्थात् उसके हाथों के अंगूठे और पैरों के बड़े अंगूठे।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּנָס
  choice: भाग गया
  rationale: נוּס का अर्थ यहाँ युद्धस्थल से भागना है; ‘भाग गया’ स्वाभाविक हिन्दी है और ‘बच निकला’ जैसी सफल पलायन की धारणा नहीं देता।
- source_word: אֲדֹנִי בֶזֶק
  choice: अदोनी-बेजेक
  rationale: सन्दर्भ में यह व्यक्ति का नाम अथवा उपाधि-नाम है, इसलिए इसके घटकों का अर्थानुवाद ‘बेजेक का प्रभु’ करने के बजाय लिप्यन्तरण रखा गया है।
- source_word: וַיִּרְדְּפוּ אַחֲרָיו
  choice: उन्होंने उसका पीछा किया
  rationale: רדף אחרי का सामान्य अर्थ किसी का पीछा करना है; हिन्दी में यह स्पष्ट और स्वाभाविक है।
- source_word: וַיֹּאחֲזוּ אֹתוֹ
  choice: उसे पकड़ लिया
  rationale: אחז बलपूर्वक पकड़ने या काबू में करने को व्यक्त करता है; ‘पकड़ लिया’ इस कथात्मक क्रम में स्वाभाविक रूप से गिरफ्तारी का भाव देता है।
- source_word: וַיְקַצְּצוּ
  choice: काट दिए
  rationale: קצץ यहाँ शरीर के अंगों को काटकर अलग करने के अर्थ में है; कर्म के साथ ‘काट दिए’ हिन्दी में इस परिणाम को स्पष्ट करता है।
- source_word: בְּהֹנוֹת יָדָיו וְרַגְלָיו
  choice: उसके हाथों के अँगूठे और पैरों के अँगूठे
  rationale: בֹּהֶן हाथ के अँगूठे और पैर के बड़े अँगूठे दोनों के लिए प्रयुक्त होता है। स्रोत की संरचना के निकट रहते हुए हिन्दी में दोनों को स्पष्ट किया गया है।
