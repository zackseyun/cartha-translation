base_translation:
  language: en
  yaml_path: translation/ot/judges/001/020.yaml
  text: They gave Hebron to Caleb[a], as Moses had said, and he drove out from there the three sons of Anak.
translation:
  language: hi
  text: जैसा मूसा ने कहा था, उन्होंने हेब्रोन कालेब को दे दिया; और उसने वहाँ से अनाक के तीन पुत्रों[a] को निकाल दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अनाक के तीन वंशजों” अथवा “अनाकी कुल के तीन लोगों।” इब्रानी में “अनाक के पुत्र” है; इसका संकेत सीधे पुत्रों के बजाय वंश या कुल के सदस्यों की ओर भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ לְכָלֵב אֶת חֶבְרוֹן
  choice: उन्होंने हेब्रोन कालेब को दे दिया
  rationale: נתן का सामान्य अर्थ ‘देना’ है; לְכָלֵב प्राप्तकर्ता को दर्शाता है। हिन्दी में कर्म और प्राप्तकर्ता का यह क्रम स्वाभाविक है। आरंभिक וַ को अलग से ‘और’ न बनाकर कथा-क्रम में स्वाभाविक रूप से व्यक्त किया गया है।
- source_word: כַּאֲשֶׁר דִּבֶּר מֹשֶׁה
  choice: जैसा मूसा ने कहा था
  rationale: כַּאֲשֶׁר का तुलनात्मक अर्थ ‘जैसा’ और דִּבֶּר का अर्थ ‘कहा/बोला’ है। ‘कहा था’ पूर्व कथन को स्वाभाविक हिन्दी में व्यक्त करता है, बिना ‘प्रतिज्ञा की थी’ जैसा अतिरिक्त अर्थ जोड़े।
- source_word: וַיּוֹרֶשׁ
  choice: उसने ... निकाल दिया
  rationale: यह ירש का हिफ़ील रूप है, जिसका यहाँ अर्थ वहाँ के निवासियों को बेदखल करना या निकाल देना है। ‘निकाल दिया’ आधुनिक सामान्य हिन्दी में स्पष्ट है।
- source_word: מִשָּׁם
  choice: वहाँ से
  rationale: यह हेब्रोन की ओर संकेत करता है और इब्रानी की स्थान-सूचक अभिव्यक्ति को सीधे बनाए रखता है।
- source_word: אֶת שְׁלֹשָׁה בְּנֵי הָעֲנָק
  choice: अनाक के तीन पुत्रों
  rationale: בְּנֵי का शाब्दिक अर्थ ‘पुत्र’ है। मुख्य पाठ में इस रूप को बनाए रखा गया है, जबकि वंशजों या कुल-सदस्यों की सम्भावना पाद-टिप्पणी में दी गई है।
