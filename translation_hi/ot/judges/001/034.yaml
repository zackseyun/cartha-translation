  text: וַ/יִּלְחֲצ֧וּ הָ/אֱמֹרִ֛י אֶת בְּנֵי דָ֖ן הָ/הָ֑רָ/ה כִּי לֹ֥א נְתָנ֖/וֹ לָ/רֶ֥דֶת לָ/עֵֽמֶק־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/034.yaml
  text: And the Amorites pressed the sons of Dan back into the hill country[a], because they did not allow them to go down into the valley.
translation:
  language: hi
  text: और एमोरियों ने दान के लोगों को पहाड़ी प्रदेश में धकेल दिया,[a] क्योंकि उन्होंने उन्हें घाटी में उतरने नहीं दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शब्दशः: “एमोरी ने दान के पुत्रों को पहाड़ी प्रदेश की ओर दबाया, क्योंकि उसने उसे घाटी में उतरने नहीं दिया।” इब्रानी में दोनों जनसमूहों के लिए सामूहिक एकवचन रूप आए हैं, जबकि प्रसंग में अर्थ बहुवचन है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלְחֲצוּ
  choice: दबाए रखा
  rationale: लָחַץ यहाँ शत्रुतापूर्वक दबाव डालकर किसी क्षेत्र में सीमित रखने का भाव देता है; आगे आने वाला कारण-वाक्य इसी अर्थ की पुष्टि करता है।
- source_word: הָאֱמֹרִי
  choice: एमोरियों
  rationale: रूप की दृष्टि से यह एकवचन है, पर जाति के लिए सामूहिक अर्थ में प्रयुक्त हुआ है; स्वाभाविक हिन्दी में बहुवचन उपयुक्त है।
- source_word: בְּנֵי דָן
  choice: दान के वंशजों
  rationale: इब्रानी के पारिवारिक-गोत्रीय पदबंध का अर्थ सुरक्षित रखते हुए यह आधुनिक हिन्दी में 'दान के पुत्रों' से अधिक स्वाभाविक है।
- source_word: הָהָרָה
  choice: पहाड़ी प्रदेश में ही
  rationale: दिशासूचक रूप पहाड़ी क्षेत्र की ओर या उसमें धकेले जाने का संकेत देता है। प्रसंग बताता है कि उन्हें वहीं सीमित रखा गया; 'ही' इस अवरोध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण प्रस्तुत करता है।
- source_word: לֹא נְתָנוֹ
  choice: उन्होंने उन्हें ... नहीं दिया
  rationale: मूल में सामूहिक एकवचन कर्ता और कर्म-सर्वनाम हैं, पर दोनों जनसमूहों के अर्थ को स्पष्ट और स्वाभाविक हिन्दी में बहुवचन से व्यक्त किया गया है।
- source_word: לָרֶדֶת
  choice: उतरने
  rationale: पहाड़ी प्रदेश से नीचे जाने की भौगोलिक गति को संक्षिप्त और स्वाभाविक रूप से व्यक्त करता है।
- source_word: לָעֵמֶק
  choice: घाटी में
  rationale: עֵמֶק पहाड़ी प्रदेश के विपरीत निचली घाटी या तराई को सूचित करता है; यहाँ 'घाटी' सीधा और सुसंगत विकल्प है।
