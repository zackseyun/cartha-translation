  text: וְ/אַחַ֗ר יָֽרְדוּ֙ בְּנֵ֣י יְהוּדָ֔ה לְ/הִלָּחֵ֖ם בַּֽ/כְּנַעֲנִ֑י יוֹשֵׁ֣ב הָ/הָ֔ר וְ/הַ/נֶּ֖גֶב וְ/הַ/שְּׁפֵלָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/009.yaml
  text: Afterward[a], the sons of Judah went down to fight against the Canaanites living in the hill country, the Negev, and the lowland.
translation:
  language: hi
  text: इसके बाद यहूदा के वंशज पहाड़ी प्रदेश, नेगेव और निचले प्रदेश[a] में रहने वाले कनानियों से लड़ने के लिए नीचे उतरे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “शफेला”—यहूदा के पहाड़ी प्रदेश और तटीय मैदान के बीच का पादप्रदेश।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחַר
  choice: इसके बाद
  rationale: यह आगामी घटना को पिछली घटना के क्रम में रखता है, बिना समय-अंतराल को अनावश्यक रूप से निश्चित किए।
- source_word: יָרְדוּ
  choice: नीचे उतरे
  rationale: यह ירד के दिशात्मक और स्थलाकृतिक भाव को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: בְּנֵי יְהוּדָה
  choice: यहूदा के वंशज
  rationale: शाब्दिक 'यहूदा के पुत्र' यहाँ सामूहिक रूप से गोत्र के सदस्यों को दर्शाता है; 'वंशज' आधुनिक हिन्दी में इस सामूहिक वंशगत अर्थ को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: לְהִלָּחֵם
  choice: लड़ने के लिए
  rationale: निफ़अल रूप का सीधा और सहज अर्थ युद्ध या संघर्ष करना है।
- source_word: בַּכְּנַעֲנִי
  choice: कनानियों से
  rationale: एकवचन रूप यहाँ जनसमूह के लिए सामूहिक है; हिन्दी बहुवचन इसे स्वाभाविक रूप से व्यक्त करता है, और 'से लड़ना' विरोधी संबंध स्पष्ट करता है।
- source_word: יוֹשֵׁב
  choice: में रहने वाले
  rationale: कृदंत उन क्षेत्रों में कनानियों के निरंतर निवास को दर्शाता है।
- source_word: הָהָר
  choice: पहाड़ी प्रदेश
  rationale: भौगोलिक सूची में यह किसी एक पहाड़ के बजाय ऊँचे पहाड़ी भूभाग को सूचित करता है।
- source_word: הַנֶּגֶב
  choice: नेगेव
  rationale: यहाँ भौगोलिक क्षेत्रों की सूची होने के कारण दक्षिण दिशा के सामान्य अर्थ के बजाय विशिष्ट नेगेव क्षेत्र अभिप्रेत है।
- source_word: הַשְּׁפֵלָה
  choice: निचला प्रदेश
  rationale: यह पहाड़ी प्रदेश और तटीय मैदान के बीच के अपेक्षाकृत नीचे स्थित यहूदी पादप्रदेश का सुलभ अर्थ देता है; तकनीकी नाम पादटिप्पणी में रखा गया है।
