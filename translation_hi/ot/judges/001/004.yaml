base_translation:
  language: en
  yaml_path: translation/ot/judges/001/004.yaml
  text: Then Judah went up[a], and Yahweh gave the Canaanites and the Perizzites into their hand[b], and they struck down ten thousand men at Bezek.
translation:
  language: hi
  text: तब यहूदा ऊपर चढ़ गया, और याहवे ने कनानियों और परिज्जियों[a] को उनके हाथ में दे दिया[b]। उन्होंने बेजेक में दस हज़ार पुरुषों को परास्त किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल इब्रानी में ‘कनानी’ और ‘परिज्जी’ एकवचन रूप में हैं, पर वे यहाँ उन जनसमूहों के लिए सामूहिक रूप से प्रयुक्त हुए हैं।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘उनके हाथ में’; यह ‘उनके अधिकार या वश में’ देने का इब्रानी मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: चढ़ाई करने गया
  rationale: עלה का मूल अर्थ ‘ऊपर जाना/चढ़ना’ है; युद्ध-वर्णन में यह आगे बढ़कर आक्रमण करने का संकेत देता है। हिंदी में ‘चढ़ाई करने गया’ प्रसंग को स्वाभाविक रूप से व्यक्त करता है, बिना किसी निश्चित भौगोलिक दिशा का दावा किए।
- source_word: יְהוּדָה
  choice: यहूदा
  rationale: यह गोत्र का नाम है और यहाँ सामूहिक कर्ता के रूप में प्रयुक्त हुआ है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: הַכְּנַעֲנִי וְהַפְּרִזִּי
  choice: कनानियों और परिज्जियों
  rationale: दोनों जातिवाचक शब्द इब्रानी में एकवचन रूप में हैं, पर यहाँ पूरे जनसमूहों के लिए सामूहिक अर्थ में प्रयुक्त हुए हैं; हिंदी बहुवचन इसी अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: בְּיָדָם
  choice: उनके हाथ में
  rationale: यह ‘उनके अधिकार/वश में’ देने का इब्रानी मुहावरा है। ‘हाथ में’ मूल बिंब को बनाए रखते हुए हिंदी में समझने योग्य है।
- source_word: וַיַּכּוּם
  choice: उन्होंने ... मार गिराया
  rationale: נכה का अर्थ प्रहार करना, मार गिराना या युद्ध में परास्त करना हो सकता है। युद्ध और गिने गए पुरुषों के प्रसंग में ‘मार गिराया’ क्रिया की हिंसक शक्ति को व्यक्त करता है, यद्यपि मूल क्रिया अपने आप में हर स्थिति में मृत्यु को अनिवार्य नहीं करती।
- source_word: בְּבֶזֶק
  choice: बेजेक में
  rationale: स्थानसूचक ב को हिंदी में युद्ध के स्थान के लिए स्वाभाविक ‘में’ से व्यक्त किया गया है।
- source_word: עֲשֶׂרֶת אֲלָפִים אִישׁ
  choice: दस हज़ार पुरुषों
  rationale: यह संख्या और איש का सीधा अर्थ है; ‘सैनिक’ कहना प्रसंगानुकूल होते हुए भी मूल से अधिक विशिष्ट होता।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम है; ‘याहवे’ उसे उपाधि में बदले बिना सुरक्षित रखता है।
- issue: ईश्वरीय और मानवीय कर्तृत्व
  choice: याहवे ने शत्रुओं को उनके हाथ में दिया, और उन्होंने उन्हें मार गिराया
  alternative: पूरे कार्य को केवल यहूदा या केवल याहवे के नाम करना
  rationale: इब्रानी पाठ विजय देने वाले के रूप में याहवे और युद्ध करने वालों के रूप में यहूदा की सामूहिक सेना—दोनों की भूमिका अलग-अलग रखता है।
- issue: एकवचन ‘यहूदा’ से बहुवचन क्रिया की ओर परिवर्तन
  choice: अंतिम खंड में ‘उन्होंने’
  alternative: हर खंड में एकवचन ‘उसने’
  rationale: मूल में ‘यहूदा’ सामूहिक गोत्र है और बाद में बहुवचन प्रत्यय आते हैं; ‘उन्होंने’ इस व्याकरणिक और अर्थगत तनाव को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिंदी पाठक के लिए सुबोध रखी गई है। ‘चढ़ाई करने गया’ सैन्य प्रसंग को स्वाभाविक बनाता है; ‘उनके हाथ में’ मूल इब्रानी बिंब को सुरक्षित रखता है।
