base_translation:
  language: en
  yaml_path: translation/ot/judges/001/018.yaml
  text: Judah captured Gaza and its territory[a], Ashkelon and its territory, and Ekron and its territory.
translation:
  language: hi
  text: यहूदा ने गाज़ा और उसके क्षेत्र[a] को, अश्कलोन और उसके क्षेत्र को, तथा एक्रोन और उसके क्षेत्र को जीत लिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हर बार आए ‘उसके क्षेत्र’ का अनुवाद ‘उसकी सीमा’ भी हो सकता है; हिब्रू शब्द सीमा अथवा उससे घिरे भूभाग—दोनों को दर्शा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלְכֹּד
  choice: जीत लिया
  rationale: लכד का अर्थ किसी नगर या स्थान को बलपूर्वक अपने अधिकार में लेना है। सैन्य प्रसंग में स्वाभाविक आधुनिक हिन्दी के लिए ‘जीत लिया’ उपयुक्त है।
- source_word: יְהוּדָה
  choice: यहूदा
  rationale: यह व्यक्तिवाचक नाम यहाँ सामूहिक रूप से गोत्र का प्रतिनिधित्व करता है; मूल पाठ में निहित न होने के कारण ‘यहूदा का गोत्र’ जोड़ना आवश्यक नहीं है।
- source_word: גְּבוּלָהּ
  choice: उसके क्षेत्र
  rationale: גְּבוּל सीमा अथवा उस सीमा के भीतर का क्षेत्र—दोनों दर्शा सकता है। नगरों की विजय-सूची में ‘उसके क्षेत्र’ आसपास के अधीन भूभाग को स्वाभाविक रूप से व्यक्त करता है; वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: עַזָּה
  choice: गाज़ा
  rationale: स्थान-नाम का हिन्दी में प्रचलित रूप।
- source_word: אַשְׁקְלוֹן
  choice: अश्कलोन
  rationale: हिब्रू स्थान-नाम का स्पष्ट और प्रचलित हिन्दी लिप्यंतरण।
- source_word: עֶקְרוֹן
  choice: एक्रोन
  rationale: हिब्रू स्थान-नाम का स्पष्ट हिन्दी लिप्यंतरण।
