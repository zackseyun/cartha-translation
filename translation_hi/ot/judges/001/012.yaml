  edition: WLC
  text: וַ/יֹּ֣אמֶר כָּלֵ֔ב אֲשֶׁר יַכֶּ֥ה אֶת קִרְיַת סֵ֖פֶר וּ/לְכָדָ֑/הּ וְ/נָתַ֥תִּי ל֛/וֹ אֶת עַכְסָ֥ה בִתִּ֖/י לְ/אִשָּֽׁה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/012.yaml
  text: And Caleb said[a], “Whoever strikes Kiriath-sepher and captures it, I will give him my daughter Achsah as a wife.”
translation:
  language: hi
  text: तब कालेब ने कहा[a], “जो कोई किर्यत-सेपेर पर चढ़ाई करके उसे जीत लेगा, उसे मैं अपनी बेटी अकसा उसकी पत्नी के रूप में दूँगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “जो किर्यत-सेपेर पर चढ़ाई करके उसे जीत लेगा।”
    reason: अֲשֶׁר को ‘जो कोई’ अथवा ‘जो’ दोनों रूपों में समझा जा सकता है; पहला खुली चुनौती के भाव को अधिक स्पष्ट करता है।
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने कहा
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है; आधुनिक हिन्दी में ‘तब’ स्वाभाविक रूप से क्रमसूचक बल व्यक्त करता है।
- source_word: כָּלֵב
  choice: कालेब
  rationale: व्यक्तिनाम का हिन्दी बाइबलीय लिप्यंतरण।
- source_word: אֲשֶׁר
  choice: जो कोई
  rationale: यह अनिश्चित संबंधवाचक खंड आरम्भ करता है और कालेब की खुली चुनौती को स्पष्ट रखता है।
- source_word: יַכֶּה
  choice: पर चढ़ाई करे
  rationale: नכה का हिफ़ील रूप सैन्य संदर्भ में प्रहार या आक्रमण को सूचित करता है; अगले क्रिया-पद से विजय अलग से व्यक्त होती है।
- source_word: קִרְיַת סֵפֶר
  choice: किर्यत-सेपेर
  rationale: स्थाननाम का निकट लिप्यंतरण; योजक चिह्न इब्रानी संयुक्त नाम को दर्शाता है।
- source_word: וּלְכָדָהּ
  choice: और उसे जीत ले
  rationale: לכד सैन्य संदर्भ में किसी नगर को अधिकार में लेने या जीतने का अर्थ देता है।
- source_word: וְנָתַתִּי לוֹ
  choice: उसे मैं ... दूँगा
  rationale: यह विजय की शर्त पर कालेब की प्रतिज्ञा है; हिन्दी शब्दक्रम प्राप्तकर्ता पर स्वाभाविक बल देता है।
- source_word: עַכְסָה
  choice: अकसा
  rationale: व्यक्तिनाम का स्रोत-सन्निकट हिन्दी लिप्यंतरण।
- source_word: בִתִּי
  choice: अपनी बेटी
  rationale: प्रथम पुरुष स्वामित्व को हिन्दी में कर्ता की ओर लौटने वाले स्वाभाविक ‘अपनी’ से व्यक्त किया गया है।
- source_word: לְאִשָּׁה
  choice: पत्नी के रूप में
  rationale: यह विवाह में देने के इब्रानी मुहावरे को स्पष्ट और गरिमापूर्ण आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण कथात्मक शैली। सैन्य क्रियाओं के बीच आक्रमण और सफल अधिकार का भेद बनाए रखा गया है; नामों का देवनागरी में स्रोत-सन्निकट लिप्यंतरण किया गया है।
