review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys Caleb’s speech, the open condition ('जो कोई'), the two-stage military action against Kiriath-sepher, and the promised marriage of Achsah. The sequential sense of the waw-consecutive is adequately represented by 'तब'.
  naturalness: The sentence is generally clear modern Hindi. However, 'अपनी बेटी अकसा पत्नी के रूप में दूँगा' leaves the recipient’s marital relation slightly implicit and is less idiomatic than explicitly saying that she will be given as that man’s wife.
  terminology: The renderings 'कालेब', 'किर्यत-सेपेर', and 'अकसा' are consistent source-near Devanagari transliterations. 'चढ़ाई करके' and 'जीत लेगा' appropriately retain the distinction between attacking and capturing the city.
  issues:
  - severity: low
    issue: The phrase 'पत्नी के रूप में दूँगा' does not explicitly identify whose wife Achsah will be.
    rationale: Hebrew לֹו ... לְאִשָּׁה means that Caleb will give Achsah to the successful man as his wife. Adding 'उसकी पत्नी के रूप में' makes this relation explicit without adding interpretation.
