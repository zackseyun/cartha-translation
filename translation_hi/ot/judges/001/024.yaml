source:
  edition: WLC
  text: וַ/יִּרְאוּ֙ הַ/שֹּׁ֣מְרִ֔ים אִ֖ישׁ יוֹצֵ֣א מִן הָ/עִ֑יר וַ/יֹּ֣אמְרוּ ל֗/וֹ הַרְאֵ֤/נוּ נָא֙ אֶת מְב֣וֹא הָ/עִ֔יר וְ/עָשִׂ֥ינוּ עִמְּ/ךָ֖ חָֽסֶד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/024.yaml
  text: The watchers saw a man coming out of the city[a], and they said to him, “Please show us the entrance to the city[b], and we will deal kindly with you.”
translation:
  language: hi
  text: निगरानी करने वालों ने एक आदमी को नगर से बाहर आते देखा। उन्होंने उससे कहा, “कृपया हमें नगर का प्रवेश-मार्ग दिखा दो[a], और हम तुम्हारे साथ भलाई करेंगे[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “नगर में जाने का रास्ता दिखा दो।”
    reason: lexical_alternative
  - marker: b
    text: 'इब्रानी: “हेसेद”; प्रसंग के अनुसार इसका अनुवाद “भलाई,” “निष्ठा” या “अटल प्रेम” भी किया जाता है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשֹּׁמְרִים
  choice: निगरानी करनेवाले
  rationale: यह שמר के कृदंत रूप का तटस्थ अनुवाद है। इससे निगाह रखने का भाव बना रहता है, पर उन्हें नगर के ‘पहरेदार’ या औपचारिक ‘गुप्तचर’ मानकर अर्थ को अनावश्यक रूप से सीमित नहीं किया जाता।
- source_word: אִישׁ
  choice: एक आदमी
  rationale: यहाँ एक पुरुष व्यक्ति का स्पष्ट उल्लेख है; इसलिए सरल और लिंग-सटीक अनुवाद चुना गया है।
- source_word: יוֹצֵא מִן־הָעִיר
  choice: नगर से बाहर आते
  rationale: कृदंत रूप नगर के भीतर से बाहर की ओर हो रही गति दिखाता है। देखनेवालों के दृष्टिकोण से ‘बाहर आते’ स्वाभाविक हिन्दी है।
- source_word: מְבוֹא הָעִיר
  choice: नगर का प्रवेश-मार्ग
  rationale: מְבוֹא प्रवेश, पहुँचने के मार्ग या प्रवेश-बिंदु को दर्शाता है। सैन्य संदर्भ में ‘प्रवेश-मार्ग’ ठोस अर्थ और संभावित छिपे रास्ते—दोनों के लिए पर्याप्त खुला है।
- source_word: נָא
  choice: कृपया
  rationale: यह आग्रह को नम्र बनानेवाला निपात है; आधुनिक हिन्दी में ‘कृपया’ इसका स्वाभाविक समतुल्य है।
- source_word: וְעָשִׂינוּ עִמְּךָ חָסֶד
  choice: तब हम तेरे साथ भलाई करेंगे
  rationale: इस लेन-देन के प्रसंग में חֶסֶד अनुकूल और दयापूर्ण व्यवहार का संकेत देता है। ‘भलाई करेंगे’ सम्बन्धपरक भाव बनाए रखता है और यहाँ अनावश्यक रूप से वाचा-संबंधी अर्थ नहीं जोड़ता।
theological_decisions:
- issue: חֶסֶד का अर्थ
  choice: भलाई/दयापूर्ण व्यवहार
  alternative: वाचा की निष्ठा; अटल प्रेम
  rationale: חֶסֶד में निष्ठा, करुणा और दृढ़ प्रेम के व्यापक अर्थ हो सकते हैं, पर यहाँ सूचना के बदले उस आदमी को अनुकूल व्यवहार देने की प्रतिज्ञा है। इसलिए वाचा-संबंधी अधिक गहन शब्दावली प्रसंग से अधिक अर्थ जोड़ सकती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘नगर’ बाइबिलीय आख्यान के अनुकूल है; संवाद में एक पुरुष से एकवचन संबोधन होने के कारण ‘दे’ और ‘तेरे’ स्वाभाविक हैं। अंग्रेज़ी परामर्श-पाठ में फुटनोट-चिह्नों का स्थान उनकी सामग्री से मेल नहीं खाता था; हिन्दी मसौदे में [a] को מְבוֹא और [b] को חֶסֶד के साथ सही स्थान पर रखा गया है।
