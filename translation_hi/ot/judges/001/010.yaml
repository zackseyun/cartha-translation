base_translation:
  language: en
  yaml_path: translation/ot/judges/001/010.yaml
  text: Then Judah went against the Canaanites living in Hebron (Hebron’s former name was Kiriath-arba)[a], and they struck down Sheshai, Ahiman[c][b], and Talmai.
translation:
  language: hi
  text: तब यहूदा ने हेब्रोन में रहने वाले कनानियों[a] पर चढ़ाई की—हेब्रोन का पुराना नाम किर्यत-अरबा था[b]—और उन्होंने शेशै, अहीमान और तल्मै को मार गिराया[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हेब्रोन में रहने वाले कनानी पर”; इब्रानी में ‘कनानी’ एकवचन रूप में है, जो यहाँ सामूहिक रूप से प्रयुक्त है।
    reason: lexical_alternative
  - marker: b
    text: या, “हेब्रोन पहले किर्यत-अरबा कहलाता था।”
    reason: lexical_alternative
  - marker: c
    text: “मार गिराया” का अनुवाद इस सैन्य प्रसंग में “हरा दिया” या “मार डाला” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ ... אֶל
  choice: पर चढ़ाई की
  rationale: शाब्दिक अर्थ ‘की ओर गया’ है, पर सैन्य प्रसंग में אֶל के साथ यह विरोध में आगे बढ़ने या आक्रमण करने का भाव देता है। ‘पर चढ़ाई की’ इस प्रसंगगत अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יְהוּדָה
  choice: यहूदा
  rationale: एकवचन जातिनाम यहाँ पूरे गोत्र या उसके लोगों के लिए सामूहिक रूप से प्रयुक्त है; आगे का बहुवचन ‘उन्होंने’ इस सामूहिक अर्थ को स्पष्ट करता है।
- source_word: הַכְּנַעֲנִי
  choice: कनानियों
  rationale: इब्रानी में रूप एकवचन है, पर यहाँ वह जाति के लिए सामूहिक एकवचन जान पड़ता है; सैन्य प्रसंग में हिन्दी बहुवचन अधिक स्वाभाविक है।
- source_word: הַיּוֹשֵׁב בְּחֶבְרוֹן
  choice: हेब्रोन में रहने वाले
  rationale: कृदन्त वहाँ स्थायी रूप से बसे होने का भाव देता है; यह चयन आधुनिक और सहज हिन्दी में वही अर्थ रखता है।
- source_word: וְשֵׁם חֶבְרוֹן לְפָנִים
  choice: हेब्रोन का पुराना नाम ... था
  rationale: לְפָנִים पहले के समय को सूचित करता है; हिन्दी में ‘पुराना नाम’ संक्षिप्त और स्पष्ट है।
- source_word: קִרְיַת אַרְבַּע
  choice: किर्यत-अरबा
  rationale: स्थान-नाम को अर्थानुवाद करने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: וַיַּכּוּ
  choice: मार गिराया
  rationale: נכה युद्ध के प्रसंग में प्रबल और निर्णायक प्रहार या पराजय को सूचित कर सकता है। ‘मार गिराया’ इसकी ठोस शक्ति बनाए रखता है, यद्यपि ‘हरा दिया’ भी संभव है।
- source_word: שֵׁשַׁי וְאֶת אֲחִימַן וְאֶת תַּלְמָי
  choice: शेशै, अहीमन और तल्मै
  rationale: व्यक्तिनामों को हिन्दी ध्वन्यात्मक रूप में लिप्यंतरित किया गया है।
