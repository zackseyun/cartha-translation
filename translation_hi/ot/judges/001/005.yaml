lexical_decisions:
- source_word: וַיִּמְצְאוּ
  choice: उन्होंने ... को पाया
  rationale: מצא का सामान्य कथात्मक अर्थ ‘पाना’ है; यह सीधा और स्वाभाविक अनुवाद है।
- source_word: אֲדֹנִי בֶזֶק
  choice: अदोनी-बेजेक
  rationale: संदर्भ में इसे व्यक्तिवाचक नाम मानकर लिप्यंतरित किया गया है, यद्यपि इसकी व्युत्पत्ति पदवी के रूप में भी समझी जा सकती है।
- source_word: בְּבֶזֶק
  choice: बेजेक में
  rationale: पूर्वसर्ग ב यहाँ स्थान सूचित करता है; ‘में’ नगर के संदर्भ में सहज है।
- source_word: וַיִּלָּחֲמוּ בּוֹ
  choice: उन्होंने उससे युद्ध किया
  rationale: לחם का निफ़अल रूप ב के साथ किसी के विरुद्ध लड़ने का अर्थ देता है; वर्तमान वाक्यांश हिंदी में स्वाभाविक रूप से विरोध का भाव व्यक्त करता है।
- source_word: וַיַּכּוּ
  choice: मार गिराया
  rationale: נכה सैन्य प्रसंग में प्रहार करके गिराने या परास्त करने का व्यापक भाव रखता है; ‘मार गिराया’ उसकी तीव्रता बनाए रखता है, बिना यह कहे कि प्रत्येक व्यक्ति तत्काल मारा गया।
- source_word: הַכְּנַעֲנִי
  choice: कनानियों
  rationale: एकवचन रूप यहाँ समुदायवाचक है; हिंदी बहुवचन जाति-समूह को स्पष्ट और सहज रूप से व्यक्त करता है।
- source_word: הַפְּרִזִּי
  choice: परिज्जियों
  rationale: यह एकवचन जातिनाम सामूहिक अर्थ में प्रयुक्त है, इसलिए हिंदी में बहुवचन किया गया है।
