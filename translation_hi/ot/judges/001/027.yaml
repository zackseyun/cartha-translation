  text: וְ/לֹא הוֹרִ֣ישׁ מְנַשֶּׁ֗ה אֶת בֵּית שְׁאָ֣ן וְ/אֶת בְּנוֹתֶי/הָ֮ וְ/אֶת תַּעְנַ֣ךְ וְ/אֶת בְּנֹתֶי/הָ֒ וְ/אֶת ישב ד֜וֹר וְ/אֶת בְּנוֹתֶ֗י/הָ וְ/אֶת יוֹשְׁבֵ֤י יִבְלְעָם֙ וְ/אֶת בְּנֹתֶ֔י/הָ וְ/אֶת יוֹשְׁבֵ֥י מְגִדּ֖וֹ וְ/אֶת בְּנוֹתֶ֑י/הָ וַ/יּ֨וֹאֶל֙ הַֽ/כְּנַעֲנִ֔י לָ/שֶׁ֖בֶת בָּ/אָ֥רֶץ הַ/זֹּֽאת־־־־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/027.yaml
  text: But Manasseh did not dispossess Beth-shean and its daughter towns[a], or Taanach and its daughter towns, or the inhabitants of Dor and its daughter towns, or the inhabitants of Ibleam and its daughter towns, or the inhabitants of Megiddo and its daughter towns[b]; and the Canaanites persisted in dwelling in this land.
translation:
  language: hi
  text: परन्तु मनश्शे ने बेत-शान और उसके अधीन नगरों[a] के लोगों को नहीं निकाला, न तानाक और उसके अधीन नगरों के लोगों को, न दोर और उसके अधीन नगरों के निवासियों को, न यिबलाम और उसके अधीन नगरों के निवासियों को, और न मगिद्दो और उसके अधीन नगरों के निवासियों को। कनानी इस देश में बसे रहने पर अड़े रहे।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘उसकी बेटियाँ’; अर्थात मुख्य नगर पर निर्भर छोटे नगर या बस्तियाँ।
    reason: cultural_note
  - marker: b
    text: अथवा, “कनानियों ने इस देश में बसे रहने का निश्चय किया।” इब्रानी क्रिया इच्छा या दृढ़ निश्चय का भाव व्यक्त कर सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹרִישׁ
  choice: लोगों को नहीं निकाला
  rationale: यहाँ ירשׁ का हिफ़ील रूप किसी को उसके अधिकार वाले क्षेत्र से बेदखल करने या निकालने का अर्थ देता है। हिन्दी में स्थानों के साथ आए कर्मों को स्पष्ट करने के लिए ‘लोगों को’ जोड़ा गया है।
- source_word: בְּנוֹתֶיהָ
  choice: उसके अधीन नगर
  rationale: शाब्दिक अर्थ ‘उसकी बेटियाँ’ है, पर यह मुख्य नगर पर निर्भर छोटे नगरों या बस्तियों के लिए प्राचीन मुहावरा है। ‘अधीन नगर’ सम्बन्ध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ישב דּוֹר / יוֹשְׁבֵי יִבְלְעָם / יוֹשְׁבֵי מְגִדּוֹ
  choice: दोर…यिबलाम…मगिद्दो के निवासियों
  rationale: ישׁב से बने ये रूप इन स्थानों में रहने वाले लोगों को सूचित करते हैं। सामूहिक आशय को हिन्दी बहुवचन ‘निवासियों’ से व्यक्त किया गया है।
- source_word: וַיּוֹאֶל
  choice: अड़े रहे
  rationale: יאל यहाँ इच्छा, तत्परता या दृढ़ निश्चय का भाव दे सकता है। प्रसंग में ‘अड़े रहे’ उनके लगातार वहीं रहने और दृढ़ता, दोनों को स्वाभाविक रूप से व्यक्त करता है, जबकि वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: הַכְּנַעֲנִי
  choice: कनानी
  rationale: इब्रानी में रूप एकवचन है, पर जाति के लिए सामूहिक अर्थ रखता है। हिन्दी ‘कनानी’ भी इसी प्रकार सामूहिक रूप में स्वाभाविक है।
- source_word: לָשֶׁבֶת בָּאָרֶץ הַזֹּאת
  choice: इसी देश में बसे रहने
  rationale: לָשֶׁבֶת निरन्तर निवास का कार्य बताता है और הַזֹּאת का संकेतात्मक बल ‘इसी देश’ से सुरक्षित रहता है।
- source_word: בֵּית שְׁאָן / תַּעְנַךְ / דּוֹר / יִבְלְעָם / מְגִדּוֹ
  choice: बेत-शान / तानाक / दोर / यिबलाम / मगिद्दो
  rationale: स्थान-नामों का मूल इब्रानी उच्चारण ध्यान में रखते हुए प्रचलित और पठनीय देवनागरी लिप्यंतरण किया गया है।
theological_decisions:
- issue: कनानियों के बने रहने में इच्छा या दृढ़ निश्चय का भाव
  choice: कनानी इसी देश में बसे रहने पर अड़े रहे
  alternative: कनानियों ने इसी देश में बसे रहने का निश्चय किया
  rationale: मूल क्रिया इच्छा, सहमति या दृढ़ निश्चय के बीच अर्थ-छाया रखती है। मुख्य पाठ प्रसंगगत दृढ़ता व्यक्त करता है, और पादटिप्पणी दूसरी सम्भावना को बनाए रखती है; किसी विशेष धर्मवैज्ञानिक कारण को इसमें नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। सूची की इब्रानी संरचना को हिन्दी में सहज बनाने के लिए ‘लोगों/निवासियों’ का प्रयोग किया गया है। ‘अड़े रहे’ बोलचाल में समझ आने वाला है, पर यहाँ पर्याप्त गम्भीर और प्रसंगानुकूल भी है।
