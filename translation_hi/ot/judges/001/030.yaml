  text: זְבוּלֻ֗ן לֹ֤א הוֹרִישׁ֙ אֶת יוֹשְׁבֵ֣י קִטְר֔וֹן וְ/אֶת יוֹשְׁבֵ֖י נַהֲלֹ֑ל וַ/יֵּ֤שֶׁב הַֽ/כְּנַעֲנִי֙ בְּ/קִרְבּ֔/וֹ וַ/יִּֽהְי֖וּ לָ/מַֽס־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/030.yaml
  text: Zebulun did not drive out the inhabitants of Kitron or the inhabitants of Nahalol[b][a], so the Canaanites lived among them and became forced laborers.
translation:
  language: hi
  text: जबूलून ने कित्रोन के निवासियों और नहलोल[a] के निवासियों को नहीं निकाला। इसलिए कनानी लोग जबूलून के बीच में रहते रहे और बेगार के लिए लगा दिए गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: संबंधित पदों और कुछ अनुवाद-परंपराओं में इस स्थान का नाम ‘नहलाल’ मिलता है।
    reason: alternative_reading
lexical_decisions:
- source_word: זְבוּלֻן
  choice: जबूलून
  rationale: गोत्र के नाम का आधुनिक हिंदी बाइबल-परंपरा के अनुरूप लिप्यंतरण।
- source_word: הוֹרִישׁ
  choice: निकाला
  rationale: हिफ़ील रूप यहाँ देश के पहले से बसे लोगों को वहाँ से हटाने या खदेड़ने का अर्थ देता है; ‘नहीं निकाला’ सहज और प्रसंगानुकूल है।
- source_word: יוֹשְׁבֵי
  choice: निवासियों
  rationale: स्थान में रहनेवाले लोगों के लिए संक्षिप्त, स्वाभाविक और गरिमापूर्ण हिंदी।
- source_word: קִטְרוֹן
  choice: कित्रोन
  rationale: इस पद में स्वरांकित इब्रानी रूप का देवनागरी लिप्यंतरण।
- source_word: נַהֲלֹל
  choice: नहलोल
  rationale: WLC में दिए गए स्वरांकन को सीधे प्रतिबिंबित करता है; अन्य संबंधित स्थानों पर ‘नहलाल’ रूप मिलता है।
- source_word: וַיֵּשֶׁב הַכְּנַעֲנִי בְּקִרְבּוֹ
  choice: कनानी उसके बीच में बसते रहे
  rationale: ‘कनानी’ इब्रानी में सामूहिक एकवचन है, जबकि एकवचन प्रत्यय जबूलून गोत्र को सामूहिक इकाई मानता है। हिंदी में ‘कनानी’ संख्या की अस्पष्टता बनाए रखता है और ‘उसके’ मूल एकवचन प्रत्यय को सुरक्षित रखता है।
- source_word: לָמַס
  choice: बेगार करनेवाले
  rationale: מַס यहाँ केवल धनरूपी कर नहीं, बल्कि अधीन लोगों से कराया जाने वाला अनिवार्य श्रम दर्शाता है। ‘बेगार’ इस बलपूर्वक श्रम को संक्षेप में व्यक्त करता है।
- source_word: וַיִּהְיוּ לָמַס
  choice: बेगार करनेवाले बन गए
  rationale: वाक्यांश कनानियों की परिणामी अधीन स्थिति बताता है; यह हिंदी में स्वाभाविक है और लोगों को श्रमिकों के रूप में व्यक्त करता है।
theological_decisions:
- issue: הַכְּנַעֲנִי का सामूहिक एकवचन और בְּקִרְבּוֹ का एकवचन प्रत्यय
  choice: ‘कनानी उसके बीच में’ रखकर सामूहिक जनसमूह और गोत्र के व्याकरणिक एकवचन को सुरक्षित रखा गया।
  alternative: ‘कनानी लोग उनके बीच में’
  rationale: मूल इब्रानी किसी एक व्यक्ति की नहीं, कनानी जनसमुदाय की बात करता है, पर जबूलून गोत्र को एक सामूहिक इकाई के रूप में एकवचन से संदर्भित करता है। मुख्य पाठ में यह तनाव बनाए रखा गया है और पादटिप्पणी अर्थ स्पष्ट करती है।
translation_notes:
  register: आधुनिक मानक हिंदी में सहज लेकिन गरिमापूर्ण शैली अपनाई गई है। ‘बेगार’ सामान्य पाठक के लिए बोधगम्य है और जबरन श्रम का ऐतिहासिक अर्थ बनाए रखता है। नामों को अनूदित नहीं, देवनागरी में लिप्यंतरित किया गया है।
