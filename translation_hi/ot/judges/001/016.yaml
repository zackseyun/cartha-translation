id: JDG.1.16
reference: Judges 1:16
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וּ/בְנֵ֣י קֵינִי֩ חֹתֵ֨ן מֹשֶׁ֜ה עָל֨וּ מֵ/עִ֤יר הַ/תְּמָרִים֙ אֶת בְּנֵ֣י יְהוּדָ֔ה מִדְבַּ֣ר יְהוּדָ֔ה אֲשֶׁ֖ר בְּ/נֶ֣גֶב עֲרָ֑ד וַ/יֵּ֖לֶךְ וַ/יֵּ֥שֶׁב אֶת הָ/עָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/016.yaml
  text: And the descendants of the Kenite[a], Moses’ father-in-law, went up from the City of Palms with the descendants of Judah into the wilderness of Judah, which is in the Negev of Arad[d][c][b]; then he went and settled with the people.
translation:
  language: hi
  text: मूसा के ससुर[a] केनी के वंशज, यहूदा के वंशजों के साथ खजूरों के नगर[b] से चलकर यहूदा के निर्जन प्रदेश में गए, जो अराद के नेगेव में है। फिर वह[c] जाकर उन लोगों के साथ[d] बस गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘मूसा के विवाह-संबंधी रिश्तेदार’; इब्रानी शब्द का अर्थ केवल ‘ससुर’ से अधिक व्यापक हो सकता है, यद्यपि यहाँ ‘ससुर’ उसका सबसे सामान्य अर्थ है।
    reason: lexical_alternative
  - marker: b
    text: ‘खजूरों का नगर’ सामान्यतः यरीहो माना जाता है।
    reason: cross_reference
  - marker: c
    text: 'इब्रानी पाठ यहाँ बहुवचन से एकवचन में आ जाता है: ‘फिर वह जाकर ... बस गया।’ यह केनी कुल को सामूहिक एकवचन के रूप में व्यक्त कर सकता है; कुछ व्याख्याकार इसे अर्थ की दृष्टि से बहुवचन समझते हैं।'
    reason: grammatical_ambiguity
  - marker: d
    text: या ‘उन लोगों के बीच।’ कुछ प्राचीन साक्ष्यों में ‘लोगों’ के स्थान पर ‘अमालेक’ मिलता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וּבְנֵי קֵינִי
  choice: केनी के वंशज
  rationale: בְּנֵי का शाब्दिक अर्थ ‘पुत्र’ है, पर जनजातीय संदर्भ में यह वंशजों अथवा कुल के सदस्यों को दर्शाता है। ‘वंशज’ आधुनिक हिन्दी में इस भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: חֹתֵן מֹשֶׁה
  choice: मूसा के ससुर
  rationale: חֹתֵן का यहाँ सबसे सामान्य और संभावित अर्थ ‘ससुर’ है; विवाह से बने किसी व्यापक रिश्ते की संभावना पाद-टिप्पणी में रखी गई है।
- source_word: עָלוּ
  choice: चलकर ... गए
  rationale: עלה मूलतः ‘ऊपर जाना/चढ़ना’ है। हिन्दी में इस यात्रा-वर्णन के लिए ‘चलकर ... गए’ स्वाभाविक है और गंतव्य तक गति को स्पष्ट करता है; स्थलाकृतिक ‘ऊपर’ को अनावश्यक रूप से थोपता नहीं।
- source_word: מֵעִיר הַתְּמָרִים
  choice: खजूरों के नगर से
  rationale: मूल पाठ के ‘खजूरों के नगर’ वाले वर्णनात्मक नाम को रखा गया है; यरीहो से इसकी सामान्य पहचान पाद-टिप्पणी में दी गई है।
- source_word: אֶת בְּנֵי יְהוּדָה
  choice: यहूदा के वंशजों के साथ
  rationale: यहाँ אֶת सहचर्यसूचक ‘के साथ’ है। בְּנֵי जनजातीय अर्थ में ‘वंशज’ अनूदित है।
- source_word: מִדְבַּר יְהוּדָה
  choice: यहूदा के निर्जन प्रदेश में
  rationale: מִדְבָּר अनिवार्यतः रेतीला मरुस्थल नहीं, बल्कि विरल आबादी वाला वन्य अथवा निर्जन क्षेत्र हो सकता है। ‘निर्जन प्रदेश’ आधुनिक हिन्दी में इस भौगोलिक भाव को व्यक्त करता है।
- source_word: אֲשֶׁר בְּנֶגֶב עֲרָד
  choice: जो अराद के नेगेव में है
  rationale: נֶגֶב यहाँ भौगोलिक क्षेत्र का नाम अथवा अराद से जुड़ा दक्षिणी इलाका हो सकता है। ‘नेगेव’ स्थान-नाम का स्वरूप और मूल की संक्षिप्तता बनाए रखता है।
- source_word: וַיֵּלֶךְ וַיֵּשֶׁב
  choice: फिर वह जाकर ... बस गया
  rationale: दोनों क्रियाएँ रूप की दृष्टि से एकवचन हैं। हिन्दी में ‘वह ... बस गया’ इस उल्लेखनीय बदलाव को बहुवचन में समतल किए बिना सुरक्षित रखता है।
- source_word: אֶת הָעָם
  choice: उन लोगों के साथ
  rationale: मसोरेटिक पाठ का अर्थ ‘लोगों/प्रजा के साथ’ है, पर उनका स्पष्ट परिचय नहीं दिया गया। ‘उन लोगों’ संदर्भगत अनिश्चितता बनाए रखता है; ‘अमालेक’ वाला प्राचीन पाठांतर पाद-टिप्पणी में है।
