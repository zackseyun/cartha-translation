- source_word: מִמַּעֲלֵה עַקְרַבִּים
  choice: अक्रब्बीम की चढ़ाई से
  rationale: מַעֲלֵה चढ़ाई या ऊपर जाने वाले मार्ग को दर्शाता है और עַקְרַבִּים ज्ञात स्थान-नाम का अंग है; मुख्य पाठ में नाम का लिप्यंतरण रखते हुए उसका शाब्दिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: מֵהַסֶּלַע
  choice: सेला से
  rationale: भौगोलिक प्रसंग में इसे स्थान-नाम ‘सेला’ समझना उचित है, यद्यपि इब्रानी रूप का अर्थ ‘चट्टान से’ भी हो सकता है; उस वास्तविक अस्पष्टता को पादटिप्पणी में रखा गया है।
- source_word: וָמָעְלָה
  choice: आगे ऊपर की ओर
  rationale: यह पद उस बिंदु से ऊपर अथवा आगे तक दिशा के जारी रहने को बताता है; यह हिन्दी वाक्यांश उस स्थानिक भाव को स्पष्ट और स्वाभाविक रूप में व्यक्त करता है।
- source_word: וּ
  choice: और
  rationale: संयोजक इस भौगोलिक सूचना को पिछले प्रसंग से जोड़ता है; ‘और’ इसका सीधा हिन्दी रूप है।
