  text: וַ/יֹּ֣אמֶר יְהוּדָה֩ לְ/שִׁמְע֨וֹן אָחִ֜י/ו עֲלֵ֧ה אִתִּ֣/י בְ/גוֹרָלִ֗/י וְ/נִֽלָּחֲמָה֙ בַּֽ/כְּנַעֲנִ֔י וְ/הָלַכְתִּ֧י גַם אֲנִ֛י אִתְּ/ךָ֖ בְּ/גוֹרָלֶ֑/ךָ וַ/יֵּ֥לֶךְ אִתּ֖/וֹ שִׁמְעֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/003.yaml
  text: And Judah said to Simeon his brother[a], “Come up with me into my allotted territory, and let us fight against the Canaanites; and I too will go with you into your allotted territory.” So Simeon went with him.
translation:
  language: hi
  text: यहूदा ने अपने भाई शिमोन से कहा, “मेरे साथ मेरे हिस्से में आए भूभाग में चलो, और हम कनानियों के विरुद्ध युद्ध करें; और मैं भी तुम्हारे साथ तुम्हारे हिस्से में आए भूभाग में चलूँगा।” और शिमोन उसके साथ गया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने ... कहा
  rationale: कथात्मक वय्यिक्तोल को स्वाभाविक हिन्दी में अगले घटनाक्रम के रूप में व्यक्त करता है, बिना समय-संबंध को आवश्यकता से अधिक निश्चित किए।
- source_word: יְהוּדָה
  choice: यहूदा
  rationale: यहाँ यह नाम व्यक्तित्व दिए गए गोत्र को सूचित करता है; प्रचलित हिन्दी लिप्यंतरण रखा गया है।
- source_word: לְשִׁמְעוֹן אָחִיו
  choice: अपने भाई शिमोन से
  rationale: मूल का स्पष्ट भाई-संबंध बनाए रखता है और गोत्रीय पारिवारिक संबंध को सामान्य ‘कुटुम्बी’ में नहीं बदलता।
- source_word: עֲלֵה אִתִּי
  choice: मेरे साथ ... चलो
  rationale: עלה में ऊपर जाने या आगे बढ़ने का भाव हो सकता है, पर इस प्रत्यक्ष निमंत्रण में हिन्दी का ‘मेरे साथ चलो’ स्वाभाविक है; संदर्भ में गन्तव्य आगे स्पष्ट है।
- source_word: בְּגוֹרָלִי
  choice: मेरे हिस्से के भूभाग में
  rationale: גּוֹרָל का शाब्दिक अर्थ ‘चिट्ठी’ है, पर यहाँ वह चिट्ठी डालकर मिले क्षेत्र का द्योतक है। अनुवाद अर्थ स्पष्ट करता है और पाद-टिप्पणी शाब्दिक रूप सुरक्षित रखती है।
- source_word: וְנִלָּחֲמָה
  choice: और हम ... युद्ध करें
  rationale: प्रथम पुरुष बहुवचन कोहोर्टेटिव के संयुक्त आग्रह और संकल्प को व्यक्त करता है।
- source_word: בַּכְּנַעֲנִי
  choice: कनानियों से
  rationale: एकवचन रूप यहाँ सामूहिक जनसमूह के अर्थ में है; हिन्दी में बहुवचन स्वाभाविक है।
- source_word: וְהָלַכְתִּי גַם אֲנִי אִתְּךָ
  choice: फिर मैं भी तुम्हारे साथ ... चलूँगा
  rationale: यह यहूदा के प्रत्युत्तर में साथ देने की प्रतिज्ञा है; ‘मैं भी’ גַם אֲנִי के बल को बनाए रखता है।
- source_word: בְּגוֹרָלֶךָ
  choice: तुम्हारे हिस्से के भूभाग में
  rationale: पहले आए समान पद के अनुरूप सुसंगत अनुवाद है।
- source_word: וַיֵּלֶךְ אִתּוֹ שִׁמְעוֹן
  choice: तब शिमोन उसके साथ गया
  rationale: शिमोन की सहमति और अगले कथात्मक घटनाक्रम को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: אָחִיו का संबंधसूचक अर्थ
  choice: अपने भाई
  alternative: अपने कुटुम्बी
  rationale: मूल पाठ स्पष्ट रूप से ‘भाई’ कहता है। यहूदा और शिमोन इस्राएल के पूर्वज-पुत्र और उनसे निकले गोत्र दोनों हैं; व्यापक शब्द चुनकर इस पारिवारिक भाषा को धुंधला नहीं किया गया।
- issue: विजय और भूमि-विभाजन के संदर्भ में גּוֹרָל
  choice: हिस्से का भूभाग
  alternative: चिट्ठी
  rationale: यहाँ शब्द उस भूभाग के लिए लाक्षणिक रूप से प्रयुक्त है जो चिट्ठी डालकर बाँटा गया था। मुख्य पाठ में संदर्भगत अर्थ स्पष्ट है, जबकि पाद-टिप्पणी शाब्दिक अभिव्यक्ति बताती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण कथात्मक रूप अपनाया गया है। ‘युद्ध करें’ कोहोर्टेटिव आग्रह को व्यक्त करता है; ‘चलो/चलूँगा’ पारस्परिक सैन्य सहयोग को सहज भाषा में रखता है।
