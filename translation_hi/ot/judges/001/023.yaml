  text: और यूसुफ के घराने ने बेतेल की टोह ली[a]; पहले उस नगर का नाम लूज़ था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बेतेल की जासूसी की” अथवा “बेतेल का पता लगाया।” इस प्रसंग में इब्रानी क्रिया टोह लेने या खोजबीन करने का भाव देती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּתִירוּ
  choice: टोह ली
  rationale: सैन्य प्रसंग में यह क्रिया किसी स्थान की जानकारी लेने या उसकी जासूसी करने का भाव देती है। ‘टोह ली’ आधुनिक हिन्दी में स्वाभाविक और संक्षिप्त है।
- source_word: בֵית יוֹסֵף
  choice: यूसुफ के घराने
  rationale: यह अनुवाद इब्रानी के वंशीय/कुलगत पदनाम को बनाए रखता है और उसके सटीक सामाजिक दायरे को अनावश्यक रूप से सीमित नहीं करता।
- source_word: בְּבֵית אֵל
  choice: बेतेल की
  rationale: पूर्ववर्ती क्रिया के साथ בְ लक्ष्य अथवा स्थान को सूचित करता है; हिन्दी में ‘बेतेल की टोह ली’ स्वाभाविक है।
- source_word: וְשֵׁם הָעִיר
  choice: उस नगर का नाम
  rationale: इब्रानी संरचना का अर्थ स्पष्ट रखते हुए हिन्दी में सहज अभिव्यक्ति। ‘उस’ से अभी उल्लिखित बेतेल की ओर संकेत स्पष्ट होता है।
- source_word: לְפָנִים
  choice: पहले
  rationale: यह किसी पूर्व अवस्था को दर्शाता है; ‘पहले’ सामान्य आधुनिक हिन्दी में सहज है।
- source_word: לוּז
  choice: लूज़
  rationale: स्थान-नाम का देवनागरी लिप्यंतरण मूल उच्चारण में दीर्घ ऊ ध्वनि और अंतिम व्यंजन को दर्शाता है।
