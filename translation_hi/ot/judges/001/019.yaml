base_translation:
  language: en
  yaml_path: translation/ot/judges/001/019.yaml
  text: And Yahweh was with Judah[a], and he took possession of the hill country; but he could not drive out the inhabitants of the valley, because they had iron chariots.
translation:
  language: hi
  text: याहवे यहूदा के साथ था, और यहूदा ने पहाड़ी प्रदेश पर अधिकार कर लिया; पर वह घाटी[a] के निवासियों को निकाल न सका, क्योंकि उनके पास लोहे के रथ थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘मैदान’ अथवा ‘निचला भूभाग’; इब्रानी शब्द विस्तृत निचले भूभाग को भी सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम YHWH को उसके प्रचलित विद्वतापूर्ण उच्चारण के निकट देवनागरी में प्रस्तुत किया गया है।
- source_word: אֶתּ יְהוּדָה
  choice: यहूदा के साथ
  rationale: यहाँ אֵת संगति सूचित करता है; ‘यहूदा’ से प्रसंगानुसार गोत्र अभिप्रेत है, पर मूल की संक्षिप्त अभिव्यक्ति बनाए रखी गई है।
- source_word: וַיֹּרֶשׁ
  choice: उसने ... पर अधिकार कर लिया
  rationale: पहाड़ी प्रदेश वस्तु होने के कारण यहाँ हिफ़ील रूप का अर्थ उस क्षेत्र पर अधिकार करना है; अगले खंड में इसी धातु को लोगों को निकालने के अर्थ में दिया गया है।
- source_word: הָהָר
  choice: पहाड़ी प्रदेश
  rationale: संदर्भ में यह किसी एक पहाड़ के बजाय ऊँचे पहाड़ी भूभाग को सूचित करता है।
- source_word: כִּי לֹא לְהוֹרִישׁ
  choice: पर वह ... निकाल न सका
  rationale: इब्रानी खंड संक्षिप्त और दीर्घवृत्तीय है। अगले कारणवाचक खंड के प्रकाश में असफलता या असमर्थता का भाव स्वाभाविक है; ‘पर’ पहले खंड की सफलता के साथ विरोध दिखाता है।
- source_word: יֹשְׁבֵי הָעֵמֶק
  choice: घाटी के निवासी
  rationale: कृदन्तीय पदबंध का यह स्वाभाविक आधुनिक हिन्दी रूप है।
- source_word: עֵמֶק
  choice: घाटी
  rationale: यह शब्द सामान्यतः घाटी को दर्शाता है, यद्यपि विस्तृत मैदानी अथवा निचले क्षेत्र का अर्थ भी संभव है; इसलिए विकल्प पादटिप्पणी में रखा गया है।
- source_word: רֶכֶב בַּרְזֶל לָהֶם
  choice: क्योंकि उनके पास लोहे के रथ थे
  rationale: לָהֶם द्वारा व्यक्त स्वामित्व और विफलता का कारण स्पष्ट, स्वाभाविक हिन्दी में सुरक्षित है।
theological_decisions:
- issue: दूसरे खंड में कर्ता और असमर्थता का निहितार्थ
  choice: ‘पर वह ... निकाल न सका’ को यहूदा की असमर्थता के रूप में प्रस्तुत किया गया है।
  alternative: अधिक शब्दशः ‘पर उसने घाटी के निवासियों को नहीं निकाला,’ जिससे असमर्थता कम स्पष्ट रहती।
  rationale: संक्षिप्त इब्रानी वाक्य-विन्यास और लोहे के रथों वाले कारणवाचक खंड से यहूदा की असफलता या असमर्थता सबसे स्वाभाविक अर्थ है। याहवे के यहूदा के साथ होने और फिर भी यहूदा के न निकाल सकने के बीच का धर्मवैचारिक तनाव बिना समाधान थोपे सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘यहूदा’ को गोत्र के लिए मूल के समान संक्षिप्त रूप में रखा गया है, और सर्वनाम ‘वह’ उसी सामूहिक इकाई की ओर संकेत करता है।
