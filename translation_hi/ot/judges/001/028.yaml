id: JDG.1.28
reference: Judges 1:28
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַֽ/יְהִי֙ כִּֽי חָזַ֣ק יִשְׂרָאֵ֔ל וַ/יָּ֥שֶׂם אֶת הַֽ/כְּנַעֲנִ֖י לָ/מַ֑ס וְ/הוֹרֵ֖ישׁ לֹ֥א הוֹרִישֽׁ/וֹ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/028.yaml
  text: And when Israel became strong[a], they put the Canaanites to forced labor[b], but they did not drive them out completely.
translation:
  language: hi
  text: और जब इस्राएल शक्तिशाली हो गया, तब उसने कनानियों से जबरन मज़दूरी कराई[a], परन्तु उन्हें पूरी तरह निकाल नहीं दिया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अनिवार्य श्रम कराया।” इब्रानी शब्द शासक शक्ति द्वारा थोपे गए श्रम को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक रूप से “उसे ... निकाल नहीं दिया” है; एकवचन सर्वनाम कनानी जनसमूह के लिए सामूहिक अर्थ में प्रयुक्त हुआ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּי
  choice: और जब
  rationale: यह इब्रानी कथात्मक सूत्र समय-संबंधी उपवाक्य आरम्भ करता है। ‘और जब’ प्रसंग का क्रम बनाए रखते हुए हिन्दी में स्वाभाविक है।
- source_word: חָזַק
  choice: शक्तिशाली हो गया
  rationale: यहाँ क्रिया इस्राएल के शक्ति प्राप्त करने या प्रभुत्व बढ़ने का भाव देती है; ‘हो गया’ उसके आरम्भिक अथवा परिणामी पक्ष को व्यक्त करता है।
- source_word: הַכְּנַעֲנִי
  choice: कनानियों
  rationale: इब्रानी शब्द रूप की दृष्टि से एकवचन है, पर यहाँ पूरी कनानी जनजाति के लिए सामूहिक अर्थ में प्रयुक्त हुआ है; हिन्दी में बहुवचन अधिक स्वाभाविक है।
- source_word: לָמַס
  choice: बेगार कराई
  rationale: מַס किसी शासक शक्ति द्वारा थोपा गया अनिवार्य श्रम दर्शाता है। ‘बेगार’ इस जबरन श्रम के अर्थ को संक्षिप्त और स्पष्ट रूप से व्यक्त करता है।
- source_word: וְהוֹרֵישׁ לֹא הוֹרִישׁוֹ
  choice: परन्तु उन्हें पूरी तरह निकाल नहीं दिया
  rationale: धातु के अनन्त रूप के साथ उसी धातु की समापिका क्रिया निषेध को बल देती है; ‘पूरी तरह ... नहीं’ इस बल को दर्शाता है। एकवचन सर्वनाम सामूहिक कनानी जनसमूह को सूचित करता है, इसलिए हिन्दी में ‘उन्हें’ रखा गया है।
theological_decisions:
- issue: कनानियों के साथ इस्राएल का व्यवहार
  choice: इस्राएल ने कनानियों को निकालने के बजाय उनसे बेगार कराई।
  alternative: इसे केवल कर या सामान्य भेंट की वसूली मानना।
  rationale: לָמַס में प्रभुत्वशाली सत्ता द्वारा थोपे गए श्रम का भाव है। अनुवाद इस बलपूर्वक व्यवहार को नरम करके केवल आर्थिक कर के रूप में प्रस्तुत नहीं करता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘बेगार’ बलपूर्वक कराए गए श्रम का प्रचलित और संक्षिप्त हिन्दी शब्द है। ‘इस्राएल’ के साथ एकवचन ‘उसने’ इब्रानी व्याकरण और हिन्दी के सामूहिक राष्ट्रवाचक प्रयोग दोनों के अनुरूप है।
