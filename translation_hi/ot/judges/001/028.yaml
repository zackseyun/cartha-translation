review_pass:
  verdict: revise
  source_fidelity: ‘बेगार’ usually carries the additional implication of unpaid labor. The Hebrew מַס denotes compelled labor/service, but does not itself explicitly specify that it was unpaid. ‘जबरन मज़दूरी’ conveys the coercive labor requirement without adding that implication. The temporal clause, Israel’s gaining strength, the collective reference to the Canaanites, and the emphatic failure to expel them completely are otherwise conveyed faithfully.
  naturalness: The draft is clear and reads naturally in modern formal Hindi. ‘कनानियों से जबरन मज़दूरी कराई’ is equally idiomatic and more transparent to a broad contemporary readership than ‘बेगार कराई.’
  terminology: ‘इस्राएल,’ ‘कनानी,’ and ‘निकाल देना’ are appropriate. ‘जबरन मज़दूरी’ is preferred over ‘बेगार’ here because it preserves coercion while avoiding an unwarranted assertion of nonpayment.
  issues:
  - severity: medium
    issue: ‘बेगार’ may imply that the compelled labor was unpaid.
    rationale: מַס refers to imposed labor/levy or corvée service. Although such service could be burdensome and coercive, the verse does not explicitly state nonpayment. ‘जबरन मज़दूरी’ retains the essential coercive sense without narrowing it.
  revised_text: और जब इस्राएल शक्तिशाली हो गया, तब उसने कनानियों से जबरन मज़दूरी कराई[a], परन्तु उन्हें पूरी तरह निकाल नहीं दिया[b]।
