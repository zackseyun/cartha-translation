base_translation:
  language: en
  yaml_path: translation/ot/judges/001/014.yaml
  text: And when she came[a], she urged him to ask her father for the field. Then she dismounted from the donkey, and Caleb said to her[c][b], “What do you want?”
translation:
  language: hi
  text: जब वह आई, तो उसने उसे प्रेरित किया[a] कि वह उसके पिता से वह खेत माँगे। फिर वह गधे पर से उतर गई[b]। कालेब ने उससे कहा, “तुम्हें क्या चाहिए?”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उकसाया,” “बहकाया।” इब्रानी क्रिया का अर्थ प्रेरित करने से लेकर उकसाने या बहकाने तक हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “वह गधे पर से नीचे उतरी” या “वह गधे पर से झटके से नीचे उतरी।” इब्रानी क्रिया नीचे उतरने या गिर पड़ने का बोध दे सकती है।
    reason: lexical_alternative
  - marker: c
    text: इब्रानी मुहावरे का शाब्दिक रूप है, “तुम्हें क्या है?” इसका अर्थ “तुम्हें क्या चाहिए?” या “क्या बात है?” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּבוֹאָהּ
  choice: जब वह आई
  rationale: בְּ के साथ infinitive construct और 3 स्त्रीलिंग एकवचन प्रत्यय समयसूचक है—‘उसके आने पर/जब वह आई।’ यह हिंदी में स्वाभाविक समयवाचक उपवाक्य है और आगमन की दिशा के विषय में अनावश्यक विस्तार नहीं जोड़ता।
- source_word: וַתְּסִיתֵהוּ
  choice: उसने अपने पति को उकसाया
  rationale: סות का अर्थ उकसाना, प्रेरित करना या बहकाना हो सकता है। ‘उकसाया’ मूल क्रिया की कुछ तीव्रता और संभावित नकारात्मक छाया को बचाता है; ‘अपने पति’ में ‘पति’ संदर्भ से स्पष्ट किया गया है, जबकि हिब्रू में केवल पुल्लिंग कर्मवाचक प्रत्यय ‘उसे’ है।
- source_word: לִשְׁאוֹל מֵאֵת אָבִיהָ הַשָּׂדֶה
  choice: कि वह उसके पिता से वह खेत माँगे
  rationale: שאל के साथ מֵאֵת माँग के स्रोत को दर्शाता है। निश्चित उपपद वाले הַשָּׂדֶה को ‘वह खेत’ कहना किसी विशिष्ट खेत का संकेत सुरक्षित रखता है।
- source_word: וַתִּצְנַח מֵעַל הַחֲמוֹר
  choice: वह गधे पर से उतर गई
  rationale: צנח यहाँ नीचे उतरने अथवा झटके से नीचे आने का बोध दे सकता है। मुख्य पाठ में आधुनिक, स्पष्ट ‘उतर गई’ रखा गया है और अधिक शाब्दिक संभावना पादटिप्पणी में दी गई है।
- source_word: מַה לָּךְ
  choice: तुम्हें क्या चाहिए?
  rationale: शाब्दिक मुहावरा ‘तुम्हारे लिए क्या है?’ प्रसंग में उसकी चिंता या माँग पूछता है। ‘तुम्हें क्या चाहिए?’ अनुरोध के प्रसंग में इसका स्वाभाविक हिंदी अर्थ है।
- source_word: כָּלֵב
  choice: कालेब
  rationale: व्यक्तिनाम का प्रचलित हिंदी बाइबलीय लिप्यंतरण अपनाया गया है।
