  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। कथात्मक प्रवाह के लिए छोटे, स्पष्ट वाक्य प्रयुक्त हैं। ‘उकसाया’ मूल शब्द की अर्थगत तीव्रता बचाता है, जबकि विकल्प पादटिप्पणी में दिए गए हैं। ‘अपने पति’ संदर्भगत स्पष्टता देता है, पर मूल में संबंधसूचक संज्ञा नहीं, केवल ‘उसे’ है।
