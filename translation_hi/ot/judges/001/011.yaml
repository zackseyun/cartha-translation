base_translation:
  language: en
  yaml_path: translation/ot/judges/001/011.yaml
  text: From there he went against the inhabitants of Debir[b][a]. (The former name of Debir was Kiriath-sepher.)
translation:
  language: hi
  text: वहाँ से वह दबीर के निवासियों के विरुद्ध गया।[a] दबीर का पुराना नाम किर्यत-सेपेर था।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “दबीर के निवासियों की ओर गया।” इब्रानी पूर्वसर्ग का अधिक शाब्दिक अर्थ “की ओर” है, पर यहाँ विजय-अभियान के प्रसंग में शत्रुतापूर्ण आगे बढ़ना अभिप्रेत है।
    reason: lexical_alternative
  - marker: b
    text: “किर्यत-सेपेर” का अर्थ संभवतः “पुस्तक का नगर” या “लेखक/लेखकों का नगर” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: वह गया
  rationale: הלך का सामान्य कथात्मक रूप है; सैन्य प्रसंग होने पर भी क्रिया अपने आप में ‘चढ़ाई की’ जितनी विशिष्ट नहीं है।
- source_word: מִשָּׁם
  choice: वहाँ से
  rationale: पहले बताए गए स्थान से आगे बढ़ने का सीधा संकेत।
- source_word: אֶל
  choice: के विरुद्ध
  rationale: मूल अर्थ ‘की ओर/के पास’ है, पर विजय-अभियान के इस प्रसंग में गति शत्रुतापूर्ण है; ‘के विरुद्ध’ इसे स्वाभाविक हिन्दी में व्यक्त करता है, जबकि विकल्प पादटिप्पणी में सुरक्षित है।
- source_word: יֹשְׁבֵי
  choice: के निवासी
  rationale: ישב का कृदन्त यहाँ किसी स्थान में रहने वाले लोगों के लिए संज्ञा के रूप में प्रयुक्त है।
- source_word: דְּבִיר
  choice: दबीर
  rationale: स्थान-नाम को हिन्दी में लिप्यंतरित किया गया है।
- source_word: וְשֵׁם דְּבִיר לְפָנִים
  choice: दबीर का पुराना नाम ... था
  rationale: आधुनिक हिन्दी में स्वाभाविक ढंग से उस स्थान के पहले प्रचलित नाम को व्यक्त करता है।
- source_word: קִרְיַת סֵפֶר
  choice: किर्यत-सेपेर
  rationale: स्थान-नाम को अनूदित करने के बजाय लिप्यंतरित किया गया है; उसके संभावित अर्थ पादटिप्पणी में दिए गए हैं।
