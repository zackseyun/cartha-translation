source:
  edition: WLC
  text: וַ/יֵּ֤לֶךְ יְהוּדָה֙ אֶת שִׁמְע֣וֹן אָחִ֔י/ו וַ/יַּכּ֕וּ אֶת הַֽ/כְּנַעֲנִ֖י יוֹשֵׁ֣ב צְפַ֑ת וַ/יַּחֲרִ֣ימוּ אוֹתָ֔/הּ וַ/יִּקְרָ֥א אֶת שֵׁם הָ/עִ֖יר חָרְמָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/017.yaml
  text: Then Judah went with Simeon his brother[a], and they struck down the Canaanites living in Zephath and devoted it to destruction[c][b]; so they called the name of the city Hormah.
translation:
  language: hi
  text: तब यहूदा अपने भाई शिमोन के साथ गया। उन्होंने सफात में रहने वाले कनानियों को मार गिराया और उस नगर को विनाश के लिए अर्पित कर दिया।[a] तब उसने नगर का नाम होर्मा रखा।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसे पूरी तरह नष्ट कर दिया” अथवा “उसे निषिद्ध ठहराया।” इब्रानी क्रिया का अर्थ किसी वस्तु को अपरिवर्तनीय रूप से अर्पित करना है, जो प्रायः उसके विनाश द्वारा किया जाता था।
    reason: alternative_reading
  - marker: b
    text: “होर्मा” नाम की ध्वनि उस इब्रानी शब्द से मिलती है जिसका अर्थ विनाश के लिए अर्पित की गई वस्तु है; इसी से नगर के नाम का संबंध समझाया गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ יְהוּדָה אֶת שִׁמְעוֹן אָחִיו
  choice: यहूदा अपने भाई शिमोन के साथ गया
  rationale: הלך का मूल अर्थ ‘गया’ है और यहाँ אֶת संगति बताता है। इसलिए ‘के साथ गया’ इब्रानी वाक्य-विन्यास का स्वाभाविक हिन्दी रूप है। ‘यहूदा’ को मूल पाठ की तरह रखा गया है; प्रसंग में यह नाम गोत्र का प्रतिनिधित्व कर सकता है।
- source_word: וַיַּכּוּ
  choice: उन्होंने ... मार गिराया
  rationale: נכה युद्ध-वर्णन में प्रहार करके परास्त करने या मार गिराने का भाव देता है। ‘मार गिराया’ सैन्य बल को बनाए रखता है और हिन्दी में स्वाभाविक है।
- source_word: הַכְּנַעֲנִי יוֹשֵׁב צְפַת
  choice: सफात में रहने वाले कनानियों
  rationale: एकवचन रूप הַכְּנַעֲנִי यहाँ समुदायवाचक है, जैसा कि बहुवचन क्रिया से भी स्पष्ट है। יוֹשֵׁב का वर्तमान कृदन्तीय भाव ‘में रहने वाले’ से व्यक्त होता है।
- source_word: וַיַּחֲרִימוּ אוֹתָהּ
  choice: उस नगर को विनाश के लिए अर्पित कर दिया
  rationale: חרם के हिफ़ील रूप में किसी वस्तु को अपरिवर्तनीय रूप से अर्पित करने का धार्मिक भाव है, जो प्रायः उसके विनाश द्वारा पूरा होता है। यह अनुवाद अर्पण और विनाश दोनों पहलुओं को बनाए रखता है। स्त्रीलिंग सर्वनाम का आशय नगर से स्पष्ट करने के लिए ‘उस नगर को’ कहा गया है।
- source_word: וַיִּקְרָא אֶת שֵׁם הָעִיר
  choice: उसने नगर का नाम ... रखा
  rationale: क्रिया इब्रानी में एकवचन है, इसलिए ‘उसने’ रखा गया है; इसका कर्ता यहूदा सामूहिक अथवा प्रतिनिधि रूप में हो सकता है। नाम रखने के इब्रानी सूत्र का स्वाभाविक हिन्दी रूप ‘नगर का नाम ... रखा’ है।
- source_word: חָרְמָה
  choice: होर्मा
  rationale: स्थान-नाम का लिप्यंतरण किया गया है। इसका חרם से शब्द-साम्य मुख्य पाठ में कृत्रिम ढंग से व्यक्त करने के बजाय पाद-टिप्पणी में समझाया गया है।
theological_decisions:
- issue: חרם का धार्मिक-युद्ध संबंधी अर्थ
  choice: विनाश के लिए अर्पित कर दिया
  alternative: उसका पूरी तरह विनाश कर दिया / उसे प्रतिबंध के अधीन कर दिया
  rationale: इब्रानी शब्द में विनाश और अपरिवर्तनीय धार्मिक अर्पण दोनों का तनाव मौजूद है। चुना हुआ रूप इसे केवल सैन्य संहार तक सीमित नहीं करता।
- issue: וַיִּקְרָא में एकवचन कर्ता
  choice: उसने ... नाम रखा
  alternative: उन्होंने ... नाम रखा
  rationale: मूल क्रिया रूप एकवचन है। ‘उसने’ इस व्याकरणिक तथ्य को सुरक्षित रखता है, भले ही यहूदा यहाँ गोत्र का सामूहिक प्रतिनिधि हो।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘विनाश के लिए अर्पित’ तकनीकी धार्मिक अर्थ को सामान्य पाठक के लिए बोधगम्य बनाता है। एकवचन ‘उसने’ मूल इब्रानी रूप को सुरक्षित रखता है और उसकी संभावित सामूहिकता को अनुवाद में चुपचाप बहुवचन नहीं बनाता।
