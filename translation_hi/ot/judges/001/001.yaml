source:
  edition: WLC
  text: וַ/יְהִ֗י אַחֲרֵי֙ מ֣וֹת יְהוֹשֻׁ֔עַ וַֽ/יִּשְׁאֲלוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל בַּ/יהוָ֖ה לֵ/אמֹ֑ר מִ֣י יַעֲלֶה לָּ֧/נוּ אֶל הַֽ/כְּנַעֲנִ֛י בַּ/תְּחִלָּ֖ה לְ/הִלָּ֥חֶם בּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/001.yaml
  text: And it happened after the death of Joshua that the sons of Israel asked Yahweh[a], saying[b], “Who will go up for us first against the Canaanites to fight against them?”
translation:
  language: hi
  text: यहोशू की मृत्यु के बाद ऐसा हुआ कि इस्राएल के पुत्रों[a] ने याहवे से पूछा, “कनानियों[b] से लड़ने के लिए हमारी ओर से सबसे पहले कौन चढ़ाई करेगा?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, ‘इस्राएल के पुत्र’; सामान्य अर्थ ‘इस्राएली’।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में ‘कनानी’ एकवचन रूप में है, पर यहाँ उसका अर्थ सामूहिक है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי מוֹת יְהוֹשֻׁעַ
  choice: यहोशू की मृत्यु के बाद
  rationale: इब्रानी कथात्मक आरंभ को स्वाभाविक आधुनिक हिन्दी में व्यक्त किया गया है। ‘ऐसा हुआ’ जोड़ना सम्भव है, पर यहाँ उससे अर्थ नहीं बढ़ता और वाक्य बोझिल होता।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों
  rationale: यह मूल के पुरुषवाचक बहुवचन और वंश-संबंधी अभिव्यक्ति को स्पष्ट रूप से बनाए रखता है; सामान्य अर्थ ‘इस्राएली’ है।
- source_word: וַיִּשְׁאֲלוּ בַּיהוָה
  choice: याहवे से पूछा
  rationale: שׁאל मार्गदर्शन माँगने के अर्थ में है। सन्दर्भ इस पूछने की धार्मिक प्रकृति स्पष्ट करता है; יְהוָה को उसके व्यक्तिवाचक वाचा-नाम ‘याहवे’ से दिया गया है।
- source_word: מִי יַעֲלֶה לָּנוּ
  choice: हमारी ओर से ... कौन चढ़ाई करेगा
  rationale: עלה युद्ध के लिए आगे बढ़ने या चढ़ाई करने को सूचित करता है; לָנוּ को ‘हमारी ओर से’ कहना प्रतिनिधिक सैन्य कार्य को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אֶל הַכְּנַעֲנִי
  choice: कनानियों से
  rationale: मूल में ‘कनानी’ व्याकरणतः एकवचन है, किन्तु सामूहिक अर्थ रखता है। युद्ध के प्रसंग में हिन्दी बहुवचन ‘कनानियों’ स्वाभाविक है।
- source_word: בַּתְּחִלָּה
  choice: सबसे पहले
  rationale: यह गोत्रों के युद्ध-क्रम में प्रथम स्थान को स्पष्ट और सहज हिन्दी में बताता है।
- source_word: לְהִלָּחֶם בּוֹ
  choice: से लड़ने के लिए
  rationale: निर्माण का अर्थ विरोधी के विरुद्ध लड़ना है। हिन्दी में ‘से लड़ना’ स्वाभाविक है; सर्वनाम को दोहराने की आवश्यकता नहीं।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में वाचा का व्यक्तिवाचक नाम सीधे आया है। ‘याहवे’ सम्भावित प्राचीन उच्चारण का निकट देवनागरी रूप है और नाम को उपाधि में नहीं बदलता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। सैन्य प्रसंग को स्पष्ट करने के लिए עלה का अनुवाद ‘चढ़ाई करेगा’ किया गया है, जबकि मूल का सामूहिक एकवचन पाद-टिप्पणी में सुरक्षित रखा गया है।
