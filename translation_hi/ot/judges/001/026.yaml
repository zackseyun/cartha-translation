    text: शाब्दिक रूप से, “उसका नाम लूज़ पुकारा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: गया
  rationale: הלך के सामान्य कथात्मक अर्थ को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: הָאִישׁ
  choice: वह पुरुष
  rationale: निश्चित एकवचन पुरुषवाचक संदर्भ को बनाए रखता है और पहले उल्लिखित व्यक्ति की ओर संकेत करता है।
- source_word: אֶרֶץ הַחִתִּים
  choice: हित्तियों के देश में
  rationale: मूल के जातीय-भौगोलिक पदबंध का निकट और सहज हिन्दी रूप है, बिना उस क्षेत्र की राजनीतिक प्रकृति निश्चित किए।
- source_word: וַיִּבֶן עִיר
  choice: एक नगर बसाया
  rationale: नगर के निर्माण या स्थापना के प्रसंग में בנה का स्वाभाविक हिन्दी अर्थ देता है; केवल भवन बनाने का संकीर्ण भाव नहीं लाता।
- source_word: וַיִּקְרָא שְׁמָהּ לוּז
  choice: उसका नाम लूज़ रखा
  rationale: इब्रानी मुहावरे ‘उसका नाम पुकारा’ को अर्थसंगत, स्वाभाविक हिन्दी में प्रस्तुत करता है। स्त्रीलिंग प्रत्यय का संदर्भ नगर से है।
- source_word: לוּז
  choice: लूज़
  rationale: स्थान-नाम का देवनागरी लिप्यंतरण है; दीर्घ ऊ और अंतिम ज़ ध्वनि को दर्शाता है।
- source_word: הוּא שְׁמָהּ
  choice: उसका नाम यही है
  rationale: सर्वनाम के संकेतात्मक और बलात्मक कार्य को हिन्दी में ‘यही’ से स्पष्ट एवं स्वाभाविक रूप से व्यक्त करता है।
- source_word: עַד הַיּוֹם הַזֶּה
  choice: आज तक
  rationale: इब्रानी कालवाचक अभिव्यक्ति का प्रचलित और संक्षिप्त हिन्दी समतुल्य है।
