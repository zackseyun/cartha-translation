source:
  edition: WLC
  text: וְ/אֶת הַ/יְבוּסִי֙ יֹשֵׁ֣ב יְרֽוּשָׁלִַ֔ם לֹ֥א הוֹרִ֖ישׁוּ בְּנֵ֣י בִנְיָמִ֑ן וַ/יֵּ֨שֶׁב הַ/יְבוּסִ֜י אֶת בְּנֵ֤י בִנְיָמִן֙ בִּ/יר֣וּשָׁלִַ֔ם עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/021.yaml
  text: But the sons of Benjamin did not drive out the Jebusites who were living in Jerusalem[a], so the Jebusites have lived with the sons of Benjamin in Jerusalem to this day.
translation:
  language: hi
  text: परन्तु बिन्यामीन के वंशजों ने यरूशलेम में रहने वाले यबूसियों[a] को नहीं निकाला। इसलिए यबूसी बिन्यामीन के वंशजों के साथ यरूशलेम में आज तक रहते आए हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से “यबूसी” एकवचन है; यहाँ यह पूरे जाति-समुदाय के लिए सामूहिक रूप में प्रयुक्त हुआ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיְבוּסִי
  choice: यबूसी / यबूसियों
  rationale: इब्रानी में रूप एकवचन है, पर यहाँ वह पूरे जाति-समुदाय के लिए सामूहिक अर्थ में प्रयुक्त हुआ है। पहले वाक्य में स्वाभाविक हिन्दी के लिए बहुवचन और दूसरे में जातिवाचक सामूहिक रूप रखा गया है।
- source_word: יֹשֵׁב יְרוּשָׁלַם
  choice: यरूशलेम में रहने वाले
  rationale: कृदन्त चल रहे निवास को व्यक्त करता है; यह हिन्दी में सहज और अर्थ की दृष्टि से सटीक है।
- source_word: הוֹרִישׁוּ
  choice: नहीं निकाला
  rationale: इस विजय और बसावट के संदर्भ में क्रिया का अर्थ किसी निवासी समुदाय को उसके स्थान से निकाल देना है।
- source_word: בְּנֵי בִנְיָמִן
  choice: बिन्यामीन के वंशजों
  rationale: शाब्दिक 'बिन्यामीन के पुत्रों' की वंशीय-गोत्रीय भावना को आधुनिक हिन्दी में स्पष्ट रूप से व्यक्त करता है।
- source_word: וַיֵּשֶׁב
  choice: रहते आए हैं
  rationale: '''आज तक'' के साथ यह अनुवाद अतीत से कथावाचक के वर्तमान तक जारी निवास को स्वाभाविक हिन्दी में व्यक्त करता है।'
- source_word: אֶת בְּנֵי בִנְיָמִן
  choice: बिन्यामीन के वंशजों के साथ
  rationale: यहाँ אֶת संगति अथवा सह-निवास का बोध देता है, प्रत्यक्ष कर्म का नहीं।
- source_word: עַד הַיּוֹם הַזֶּה
  choice: आज तक
  rationale: यह इब्रानी कालसूचक पद का सहज और प्रचलित हिन्दी रूप है।
- source_word: וְ
  choice: परन्तु
  rationale: संदर्भ में यह आसपास की विजय-सूचनाओं के विपरीत बिन्यामीन की असफलता प्रस्तुत करता है।
