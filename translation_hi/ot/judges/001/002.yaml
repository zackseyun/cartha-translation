  text: וַ/יֹּ֣אמֶר יְהוָ֖ה יְהוּדָ֣ה יַעֲלֶ֑ה הִנֵּ֛ה נָתַ֥תִּי אֶת הָ/אָ֖רֶץ בְּ/יָדֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/002.yaml
  text: And the LORD said, “Judah shall go up. Look, I have given the land into his hand.”
translation:
  language: hi
  text: यहोवा ने कहा, “यहूदा चढ़ाई करे। देखो, मैंने यह देश उसके हाथ में दे दिया है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत नाम को हिन्दी में प्रचलित लिप्यंतरण द्वारा व्यक्त किया गया है।
- source_word: יַעֲלֶה
  choice: चढ़ाई करे
  rationale: मूल क्रिया का शाब्दिक अर्थ ‘ऊपर जाए’ है, पर न्यायियों 1:1 के युद्ध-संदर्भ में यह शत्रु के विरुद्ध आगे बढ़ने को दर्शाती है; ‘चढ़ाई करे’ आधुनिक हिन्दी में यही भाव स्वाभाविक रूप से देता है।
- source_word: הִנֵּה
  choice: देखो
  rationale: यह ध्यान खींचने और अगले कथन पर बल देने वाला उद्गार है।
- source_word: הָאָרֶץ
  choice: यह देश
  rationale: संदर्भ में इससे कनान का भूभाग अभिप्रेत है; ‘देश’ हिन्दी में संदर्भानुकूल और स्वाभाविक है।
- source_word: בְיָדוֹ
  choice: उसके हाथ में
  rationale: मूल के अधिकार और विजय सौंपे जाने वाले रूपक को यथासंभव सुरक्षित रखा गया है।
theological_decisions:
- issue: भूमि दिए जाने का पूर्णतासूचक कथन
  choice: मैंने यह देश उसके हाथ में दे दिया है
  alternative: मैं यह देश उसके हाथ में दूँगा
  rationale: मूल में נָתַתִּי पूर्ण क्रियारूप है। आगामी विजय के संदर्भ के बावजूद कथन को भविष्यकाल बनाकर उसकी निश्चितता और तनाव को कम नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘यहूदा’ को यहाँ गोत्र/समुदाय के सामूहिक नाम के रूप में उसी रूप में रखा गया है; उसके लिए मूल के पुल्लिंग एकवचन सर्वनाम के अनुरूप ‘उसके’ प्रयुक्त हुआ है।
