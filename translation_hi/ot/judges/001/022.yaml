base_translation:
  language: en
  yaml_path: translation/ot/judges/001/022.yaml
  text: The house of Joseph also went up against Bethel[a], and Yahweh was with them.
translation:
  language: hi
  text: यूसुफ़ का घराना भी बेतेल पर चढ़ाई करने गया[a], और याहवे उनके साथ था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बेतेल की ओर ऊपर चढ़े।” इब्रानी क्रिया का शाब्दिक अर्थ “ऊपर चढ़ना” है, पर इस सैन्य प्रसंग में संभवतः नगर के विरुद्ध आगे बढ़ना अभिप्रेत है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: चढ़ाई करने गया
  rationale: עלה का मूल अर्थ ‘ऊपर जाना/चढ़ना’ है; यहाँ सैन्य प्रसंग में नगर की ओर शत्रुतापूर्वक बढ़ने का भाव है। ‘चढ़ाई करने’ से यह भाव स्पष्ट होता है, जबकि पादटिप्पणी शाब्दिक विकल्प सुरक्षित रखती है।
- source_word: בֵית יוֹסֵף
  choice: यूसुफ़ का घराना
  rationale: यह यूसुफ़ से संबद्ध जनजातीय समुदाय का पदनाम है। ‘घराना’ आधुनिक हिन्दी में सामूहिक वंशगत अर्थ को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: גַּם הֵם
  choice: भी
  rationale: यह वाक्य इस अभियान को पिछले जनजातीय अभियानों से जोड़ता है; हिन्दी में ‘भी’ इस संबंध और बल को सहज रूप से प्रकट करता है।
- source_word: בֵּית אֵל
  choice: बेतेल
  rationale: स्थान-नाम का प्रचलित हिन्दी लिप्यंतरण; सैन्य संबंध ‘पर चढ़ाई’ से व्यक्त है।
- source_word: וַיהוָה
  choice: यहोवा
  rationale: मूल पाठ के विशिष्ट वाचा-नाम יהוה को उपाधि से बदलने के बजाय हिन्दी में प्रचलित नामरूप ‘यहोवा’ से प्रस्तुत किया गया है।
- source_word: עִמָּם
  choice: उनके साथ था
  rationale: עם का सीधा अर्थ साथ/उपस्थिति है। यह अनुवाद दिव्य उपस्थिति और सहायता की संभावना बनाए रखता है, पर ‘उनकी ओर था’ कहकर अर्थ को अनावश्यक रूप से सीमित नहीं करता।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: यहाँ मूल में विशिष्ट नाम יהוה है। हिन्दी बाइबिलीय प्रयोग में व्यापक रूप से पहचाने जाने वाले ‘यहोवा’ को रखा गया है; ‘प्रभु’ करने से नाम और उपाधि का भेद मिट जाता।
- issue: ‘यहोवा उनके साथ था’ में दिव्य समर्थन का अर्थ
  choice: उनके साथ था
  alternative: उनकी ओर था
  rationale: मूल עִמָּם उपस्थिति तथा समर्थन दोनों का संकेत दे सकता है। सीधा रूप मूल की अर्थगत व्यापकता और theological tension को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘घराना’ जनजातीय-सामूहिक भाव देता है; एकवचन क्रिया ‘गया’ हिन्दी में सामूहिक कर्ता ‘घराना’ के अनुरूप है।
