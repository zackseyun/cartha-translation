  text: Then the sons of Judah fought against Jerusalem and captured it[a], and struck it with the edge of the sword[b], and they set the city on fire.
translation:
  language: hi
  text: तब यहूदा के पुत्रों ने यरूशलेम के विरुद्ध युद्ध किया[क] और उसे अपने अधिकार में ले लिया। उन्होंने उस पर तलवार की धार से प्रहार किया और नगर को आग लगा दी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: क
    text: या, ‘यरूशलेम में युद्ध किया’; पर आगे उसके पकड़े जाने और उस पर प्रहार किए जाने के कारण यहाँ ‘यरूशलेम के विरुद्ध’ अधिक संभावित है।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּלָּחֲמוּ בְנֵי יְהוּדָה בִּירוּשָׁלִַם
  choice: यहूदा के पुत्रों ने यरूशलेम के विरुद्ध युद्ध किया
  rationale: לחם के साथ ב यहाँ अगले कथनों—नगर को अधिकार में लेना और मारना—के कारण लक्ष्य के विरुद्ध युद्ध का बोध कराता है। בְנֵי יְהוּדָה का स्रोत-सापेक्ष पारिवारिक रूप ‘यहूदा के पुत्र’ रखा गया है; इसका सामूहिक संकेत यहूदा के गोत्र के लोगों की ओर है।
- source_word: וַיִּלְכְּדוּ אוֹתָהּ
  choice: उसे अपने अधिकार में ले लिया
  rationale: לכד सैन्य प्रसंग में किसी नगर को पकड़ने या जीतकर अधिकार में लेने का अर्थ देता है; यह हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: וַיַּכּוּהָ לְפִי חָרֶב
  choice: उन्होंने उसे तलवार की धार से मारा
  rationale: נכה के ‘मारना/प्रहार करना’ अर्थ और פִי חָרֶב की शाब्दिक छवि ‘तलवार की धार’ दोनों को बनाए रखा गया है। स्त्रीलिंग प्रत्यय का संदर्भ यरूशलेम से है।
- source_word: וְאֶת הָעִיר שִׁלְּחוּ בָאֵשׁ
  choice: नगर को आग लगा दी
  rationale: שלח באש आग के हवाले करने या जला देने का मुहावरा है; ‘आग लगा दी’ आधुनिक हिन्दी में स्वाभाविक रूप से वही क्रिया व्यक्त करता है।
