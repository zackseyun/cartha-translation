base_translation:
  language: en
  yaml_path: translation/ot/judges/017/002.yaml
  text: And he said to his mother[a], “The eleven hundred pieces of silver that were taken from you, about which you uttered a curse and also spoke in my hearing—look, the silver is with me; I took it.” And his mother said[b], “Blessed be my son by Yahweh.”
translation:
  language: hi
  text: उसने अपनी माँ से कहा, “चाँदी के वे ग्यारह सौ टुकड़े, जो तुम्हारे पास से ले लिए गए थे और जिनके विषय में तुमने शाप दिया था[a] और मेरे सुनते हुए भी कहा था—देखो, वह चाँदी मेरे पास है; मैंने ही उसे लिया था।” उसकी माँ ने कहा, “मेरा बेटा याहवे के द्वारा धन्य हो!”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुमने शपथ खाई थी”; हिब्रू क्रिया शपथ या शाप, दोनों को व्यक्त कर सकती है, पर यहाँ का प्रसंग “शाप” के अर्थ का समर्थन करता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “मेरा बेटा याहवे के लिए/द्वारा धन्य हो”; यह एक संक्षिप्त हिब्रू आशीर्वाद-सूत्र है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶלֶף וּמֵאָה הַכֶּסֶף
  choice: चाँदी के वे ग्यारह सौ टुकड़े
  rationale: मूल पाठ में भार की इकाई स्पष्ट नहीं है; इसलिए ‘शेकेल’ जोड़ने के बजाय स्वाभाविक हिन्दी में मात्रा और वस्तु दोनों सुरक्षित रखे गए हैं।
- source_word: לֻקַּח לָךְ
  choice: तुम्हारे पास से ले लिए गए थे
  rationale: לקח के कर्मवाच्य रूप का मूल अर्थ ‘ले लिए गए’ है। प्रसंग चोरी की ओर संकेत करता है, पर ‘चुरा लिए गए’ कहना मूल क्रिया से अधिक स्पष्ट व्याख्या जोड़ देता।
- source_word: וְאַתִּי אָלִית
  choice: तुमने शाप दिया था
  rationale: אָלָה शपथ या शाप, दोनों का बोध करा सकता है। खोई हुई चाँदी और माँ की तत्क्षण आशीष के प्रसंग में शाप अधिक संभावित है, जबकि वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: וְגַם אָמַרְתְּ בְּאָזְנַי
  choice: वह बात मेरे सुनते हुए भी कही थी
  rationale: ‘मेरे कानों में’ के हिब्रू मुहावरे को आधुनिक, स्वाभाविक हिन्दी में ‘मेरे सुनते हुए’ कहा गया है और גם का बल ‘भी’ से बनाए रखा गया है।
- source_word: הִנֵּה
  choice: देखो
  rationale: यह ध्यान खींचने वाला वार्तालाप-सूचक है; ‘देखो’ आधुनिक हिन्दी में उसके प्रत्यक्ष बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הַכֶּסֶף אִתִּי
  choice: वह चाँदी मेरे पास है
  rationale: यह हिब्रू संरचना ‘चाँदी मेरे साथ/पास है’ का निकट और सहज हिन्दी रूप है।
- source_word: אֲנִי לְקַחְתִּיו
  choice: मैंने ही उसे लिया था
  rationale: स्पष्ट सर्वनाम אֲנִי के बल को हिन्दी के ‘ही’ द्वारा व्यक्त किया गया है, जिससे स्वीकारोक्ति का जोर सुरक्षित रहता है।
- source_word: בָּרוּךְ בְּנִי לַיהוָה
  choice: मेरा बेटा याहवे की ओर से धन्य हो
  rationale: संक्षिप्त हिब्रू आशीर्वाद-वाक्य को हिन्दी में स्वाभाविक बनाया गया है। לַיהוָה में निहित संबंध अथवा कर्तृत्व को ‘याहवे की ओर से’ से व्यक्त किया गया है, पर उसकी संक्षिप्तता की टिप्पणी दी गई है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार अक्षरों वाले परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय हिन्दी लिप्यंतरण ‘याहवे’ द्वारा प्रस्तुत किया गया है।
theological_decisions:
- issue: אָלָה को शाप या शपथ के रूप में समझना
  choice: शाप दिया था
  alternative: शपथ खाई थी
  rationale: दोनों अर्थ शब्द की सीमा में हैं। इस कथा में धन के गायब होने पर कही गई बात और बाद में बेटे को दी गई आशीष ‘शाप’ के अर्थ को अधिक संभावित बनाते हैं; फिर भी वास्तविक शब्दगत अस्पष्टता पादटिप्पणी में सुरक्षित है।
- issue: בָּרוּךְ בְּנִי לַיהוָה में לַיהוָה का संबंध
  choice: याहवे की ओर से धन्य हो
  alternative: याहवे के लिए धन्य हो
  rationale: यह एक संक्षिप्त आशीर्वाद-सूत्र है। हिन्दी में ‘याहवे की ओर से’ आशीष के स्रोत/कर्ता का संभावित भाव सहजता से देता है, जबकि अधिक शाब्दिक संबंध पादटिप्पणी में बताया गया है।
- issue: ईश्वरीय नाम יְהוָה का रूप
  choice: याहवे
  alternative: यहोवा
  rationale: मूल पाठ में व्यक्तिगत नाम सीधे उपस्थित है; ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और उसे किसी उपाधि से प्रतिस्थापित नहीं करता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखी गई है। संवाद की तात्कालिकता के लिए ‘देखो’ और स्वीकारोक्ति के बल के लिए ‘मैंने ही’ प्रयुक्त हुए हैं। ‘चाँदी के टुकड़े’ कहकर मूल में अनुपस्थित भार-इकाई जोड़ने से बचा गया है।
