source:
  edition: WLC
  text: וַ/יּ֥וֹאֶל הַ/לֵּוִ֖י לָ/שֶׁ֣בֶת אֶת הָ/אִ֑ישׁ וַ/יְהִ֤י הַ/נַּ֨עַר֙ ל֔/וֹ כְּ/אַחַ֖ד מִ/בָּנָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/017/011.yaml
  text: So the Levite agreed to stay with the man[b][a], and the young man became like one of his sons to him.
translation:
  language: hi
  text: तब लेवी उस पुरुष के साथ रहने को राज़ी हो गया,[a] और वह युवक उसके पुत्रों में से एक जैसा हो गया।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उस पुरुष के साथ रहने को तैयार हो गया।”
    reason: lexical_alternative
  - marker: b
    text: 'इब्रानी में: “वह युवक उसके लिए उसके पुत्रों में से एक के समान हो गया,” अर्थात उस घर में उसके साथ पुत्र जैसा व्यवहार होने लगा।'
    reason: cultural_note
lexical_decisions:
- source_word: וַיּוֹאֶל
  choice: राज़ी हो गया
  rationale: हिफ़ील रूप यहाँ इच्छा, सहमति या तत्परता व्यक्त करता है। ‘राज़ी हो गया’ आधुनिक हिन्दी में स्वाभाविक है और मीका का प्रस्ताव स्वीकार करने का भाव रखता है।
- source_word: הַלֵּוִי
  choice: लेवी
  rationale: यह पहले से परिचित व्यक्ति के लिए प्रयुक्त निश्चित संज्ञा है; ‘लेवी’ हिन्दी बाइबलीय प्रयोग में इस गोत्र/वर्ग के सदस्य का मानक पद है।
- source_word: לָשֶׁבֶת
  choice: रहने
  rationale: ישׁב का अर्थ बैठना, बसना या रहना हो सकता है। इस प्रसंग में किसी के घर में निवास स्वीकार करना अभिप्रेत है, इसलिए ‘रहने’ स्पष्ट और स्वाभाविक है।
- source_word: אֶת הָאִישׁ
  choice: उस पुरुष के साथ
  rationale: ישׁב के साथ אֶת यहाँ संगति या साथ रहने का संबंध बताता है। निश्चितता को संदर्भानुसार ‘उस’ से व्यक्त किया गया है।
- source_word: וַיְהִי
  choice: हो गया
  rationale: यह परिणामी अवस्था या संबंध के विकसित होने को दर्शा सकता है; ‘हो गया’ उस परिवर्तन को सपाट ‘था’ की अपेक्षा बेहतर व्यक्त करता है।
- source_word: הַנַּעַר
  choice: वह जवान
  rationale: נַעַר की अर्थ-सीमा लड़के से जवान व्यक्ति तक है। यह लेवी स्वतंत्र रूप से यात्रा और सेवा कर रहा है, इसलिए ‘जवान’ उपयुक्त है; ‘वह’ संदर्भगत निश्चितता स्पष्ट करता है।
- source_word: כְּאַחַד מִבָּנָיו
  choice: उसके पुत्रों में से एक के समान
  rationale: כְּ तुलना को और מִבָּנָיו ‘उसके पुत्रों में से’ को व्यक्त करता है। यह रूप मूल उपमा और बहुवचन ‘पुत्रों’ दोनों को सुरक्षित रखता है।
theological_decisions:
- issue: लेवी का मीका के पुत्रों में से एक के समान होना
  choice: पारिवारिक-सदृश संबंध को मूल उपमा के रूप में रखा गया
  alternative: इसे स्पष्ट व्याख्या बनाकर ‘मीका ने उसे अपने परिवार का सदस्य माना’ कहना
  rationale: इब्रानी पाठ औपचारिक दत्तक ग्रहण या कानूनी पुत्रत्व स्पष्ट नहीं करता। शाब्दिक उपमा संबंध की निकटता दिखाती है और अनावश्यक धर्मवैधानिक निष्कर्ष से बचती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘पुरुष’ मूल הָאִישׁ को स्पष्ट रूप से दर्शाता है, जबकि ‘जवान’ נַעַר की प्रसंगानुकूल आयु और सामाजिक स्थिति को व्यक्त करता है। मूल वाक्य की तुलना और ‘उसके लिए’ का संबंध सुरक्षित रखा गया है।
