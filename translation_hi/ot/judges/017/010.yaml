  text: וַ/יֹּאמֶר֩ ל֨/וֹ מִיכָ֜ה שְׁבָ֣/ה עִמָּדִ֗/י וֶֽ/הְיֵה לִ/י֮ לְ/אָ֣ב וּ/לְ/כֹהֵן֒ וְ/אָנֹכִ֨י אֶֽתֶּן לְ/ךָ֜ עֲשֶׂ֤רֶת כֶּ֨סֶף֙ לַ/יָּמִ֔ים וְ/עֵ֥רֶךְ בְּגָדִ֖ים וּ/מִחְיָתֶ֑/ךָ וַ/יֵּ֖לֶךְ הַ/לֵּוִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/017/010.yaml
  text: Micah said to him[a], “Stay with me, and be a father and a priest to me, and I will give you ten pieces of silver a year, a set of clothes[c][b], and your living.” So the Levite went in.
translation:
  language: hi
  text: मीका ने उससे कहा, “मेरे साथ रहो और मेरे लिए पिता और याजक बनो। मैं तुम्हें हर वर्ष चाँदी के दस टुकड़े[a], एक जोड़ा कपड़े[b] और तुम्हारे जीवन-निर्वाह का प्रबंध दूँगा।” तब वह लेवी वहाँ गया[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से ‘दस चाँदी’ है; इकाई नहीं बताई गई। इसका अनुवाद प्रायः ‘चाँदी के दस शेकेल’ भी किया जाता है।
    reason: lexical_alternative
  - marker: b
    text: या “कपड़ों के लिए निर्धारित भत्ता।”
    reason: lexical_alternative
  - marker: c
    text: या “तब वह लेवी भीतर गया।” इब्रानी क्रिया सामान्यतः ‘गया’ है; प्रसंग में मीका के घर में प्रवेश करने का भाव हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁבָה עִמָּדִי
  choice: मेरे साथ रहो
  rationale: यह निवास करने या साथ बने रहने का निमंत्रण है; आधुनिक हिन्दी में यह स्वाभाविक और स्रोत के निकट है।
- source_word: לְאָב וּלְכֹהֵן
  choice: पिता और याजक
  rationale: ‘पिता’ यहाँ सम्मान और धार्मिक मार्गदर्शन की भूमिका का रूपक है, फिर भी स्रोत के स्पष्ट पारिवारिक रूपक को बनाए रखा गया है। כֹהֵן के लिए प्रचलित बाइबिलीय हिन्दी ‘याजक’ उपयुक्त है।
- source_word: עֲשֶׂרֶת כֶּסֶף
  choice: चाँदी के दस टुकड़े
  rationale: इब्रानी में संख्या और चाँदी का उल्लेख है, किंतु माप या सिक्के की इकाई नहीं दी गई; इसलिए मुख्य पाठ में ‘शेकेल’ नहीं जोड़ा गया।
- source_word: לַיָּמִים
  choice: हर वर्ष
  rationale: इस प्रसंग में यह मुहावरा वार्षिक भुगतान की अवधि बताता है।
- source_word: וְעֵרֶךְ בְּגָדִים
  choice: एक जोड़ा कपड़े
  rationale: वाक्यांश वस्त्रों की निर्धारित व्यवस्था या एक पहनावे की ओर संकेत करता है; सरल हिन्दी में यह ठोस अर्थ सहजता से व्यक्त होता है, जबकि वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: וּמִחְיָתֶךָ
  choice: तुम्हारे जीवन-निर्वाह का प्रबंध
  rationale: מִחְיָה भोजन तक सीमित न होकर जीविका या भरण-पोषण को दर्शा सकता है; यह चयन उस व्यापकता को बनाए रखता है।
- source_word: וַיֵּלֶךְ הַלֵּוִי
  choice: तब वह लेवी चला गया
  rationale: मूल क्रिया का सामान्य अर्थ ‘गया/चला गया’ है। प्रसंग में घर के भीतर जाने का भाव संभव है, पर उसे मुख्य पाठ में निश्चित नहीं किया गया।
theological_decisions:
- issue: अनियमित उपासना-स्थल के प्रसंग में ‘पिता’ का सम्मानसूचक प्रयोग
  choice: ‘पिता’ को ज्यों का त्यों बनाए रखना
  alternative: सलाहकार; धार्मिक मार्गदर्शक
  rationale: स्रोत पारिवारिक रूपक का स्पष्ट प्रयोग करता है। इसे बनाए रखने से सामाजिक-धार्मिक भूमिका व्यक्त होती है और बाद की किसी विशिष्ट कलीसियाई पदवी को पाठ में नहीं डाला जाता।
- issue: चाँदी की अनिर्दिष्ट इकाई
  choice: मुख्य पाठ में ‘चाँदी के दस टुकड़े’
  alternative: चाँदी के दस शेकेल
  rationale: इब्रानी पाठ कोई इकाई निर्दिष्ट नहीं करता; ‘शेकेल’ जोड़ना संभावित किंतु अनकहा विवरण होता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘याजक’ और ‘लेवी’ जैसे परिचित बाइबिलीय पद बनाए गए हैं। अस्पष्ट चाँदी की इकाई और अंतिम क्रिया के प्रसंगगत अर्थ को मुख्य पाठ में अनावश्यक रूप से निश्चित नहीं किया गया।
