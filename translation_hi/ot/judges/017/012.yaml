  yaml_path: translation/ot/judges/017/012.yaml
  text: So Micah ordained the Levite[a], and the young man became his priest and was in Micah’s house.
translation:
  language: hi
  text: तब मीका ने उस लेवी को याजक-पद पर नियुक्त किया[a], और वह युवक उसका याजक बन गया और मीका के घर में रहा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक अर्थ है, “उस लेवी का हाथ भर दिया”; यह किसी को याजकीय सेवा में स्थापित करने का मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמַלֵּא אֶת־יַד
  choice: याजक-पद पर नियुक्त किया
  rationale: शाब्दिक अर्थ ‘हाथ भरना’ है, पर याजकीय संदर्भ में यह किसी को पद पर स्थापित करने का मुहावरा है। हिंदी में ‘याजक-पद पर नियुक्त किया’ इसका कार्यगत अर्थ स्पष्ट करता है, जबकि शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
- source_word: הַלֵּוִי
  choice: उस लेवी को
  rationale: यह व्यक्ति की लेवी पहचान बताता है। पूर्ववर्ती संदर्भ में पहचाने हुए व्यक्ति के लिए ‘उस लेवी’ स्वाभाविक है।
- source_word: הַנַּעַר
  choice: वह युवक
  rationale: नַעַר आयु और संदर्भ के अनुसार लड़के, युवक या सेवक को सूचित कर सकता है। यहाँ स्वतंत्र याजकीय भूमिका निभाने वाले व्यक्ति के लिए ‘युवक’ उपयुक्त है।
- source_word: לְכֹהֵן
  choice: याजक
  rationale: लामेद भूमिका या कार्य को दर्शाता है; ‘उसका याजक बनकर’ हिंदी में इस संबंध और भूमिका को स्वाभाविक रूप से व्यक्त करता है।
- source_word: וַיְהִי לוֹ
  choice: उसका ... बनकर
  rationale: यह रचना मीका के लिए याजक की भूमिका ग्रहण करने का भाव देती है; ‘उसका याजक बनकर’ संक्रमण और संबंध दोनों स्पष्ट करता है।
- source_word: בְּבֵית מִיכָה
  choice: मीका के घर में रहने लगा
  rationale: मूल में ‘मीका के घर में था/रहा’ है। क्रमिक कथन के संदर्भ में ‘रहने लगा’ उस नई स्थिति को सहज हिंदी में व्यक्त करता है।
theological_decisions:
- issue: निजी और अनियमित उपासना-व्यवस्था में नियुक्ति को वैध ठहराए बिना प्रस्तुत करना
  choice: मीका ने उस लेवी को याजक-पद पर नियुक्त किया
  alternative: मीका ने उस लेवी का हाथ भर दिया / उसका अभिषेक किया
  rationale: मूल वाक्य मीका द्वारा लेवी को याजकीय सेवा में स्थापित करने का वर्णन करता है, पर उसकी ईश्वरीय स्वीकृति का दावा नहीं करता। ‘नियुक्त किया’ घटना बताता है, वैधता नहीं; ‘अभिषेक’ मूल में निहित न होने वाली विधि या धार्मिक स्वीकृति का आभास दे सकता है।
translation_notes:
  register: आधुनिक मानक हिंदी; भाषा सहज, गरिमापूर्ण और कथात्मक है। ‘याजक-पद पर नियुक्त किया’ मुहावरे का अर्थ खोलता है, और मूल इब्रानी चित्र पादटिप्पणी में रखा गया है।
