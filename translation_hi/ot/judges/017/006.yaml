  text: בַּ/יָּמִ֣ים הָ/הֵ֔ם אֵ֥ין מֶ֖לֶךְ בְּ/יִשְׂרָאֵ֑ל אִ֛ישׁ הַ/יָּשָׁ֥ר בְּ/עֵינָ֖י/ו יַעֲשֶֽׂה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/017/006.yaml
  text: In those days there was no king in Israel[a]; each man did what was right in his own eyes.
translation:
  language: hi
  text: उन दिनों इस्राएल में कोई राजा नहीं था; हर व्यक्ति वही करता था जो उसकी अपनी दृष्टि में सही था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּיָּמִים הָהֵם
  choice: उन दिनों
  rationale: यह इब्रानी कथात्मक समय-सूचक पद का स्वाभाविक और प्रचलित हिन्दी रूप है।
- source_word: אֵין מֶלֶךְ בְּיִשְׂרָאֵל
  choice: इस्राएल में कोई राजा नहीं था
  rationale: अस्तित्व के निषेध को सहज हिन्दी में सीधे व्यक्त करता है, बिना अतिरिक्त राजनीतिक या धर्मवैज्ञानिक अर्थ जोड़े।
- source_word: אִישׁ
  choice: हर व्यक्ति
  rationale: यहाँ एकवचन पुल्लिंग संज्ञा वितरणात्मक और प्रतिनिधिक अर्थ में है; ‘हर व्यक्ति’ आधुनिक हिन्दी में उस सार्वत्रिक आशय को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הַיָּשָׁר
  choice: जो ... सही था
  rationale: יָשָׁר के नैतिक-मूल्यांकनात्मक अर्थ ‘सही/सीधा’ को इस मुहावरे में ‘सही’ सबसे स्पष्ट रूप से व्यक्त करता है।
- source_word: בְּעֵינָיו
  choice: उसकी अपनी दृष्टि में
  rationale: इब्रानी मुहावरे के व्यक्तिनिष्ठ निर्णय को बनाए रखता है; ‘अपनी’ आत्म-संदर्भित बल को स्पष्ट करता है।
- source_word: יַעֲשֶׂה
  choice: करता था
  rationale: अपूर्ण क्रिया यहाँ बीते समय की प्रचलित या बार-बार होने वाली गतिविधि बताती है; हिन्दी का ‘करता था’ इस अभ्यस्त पक्ष को ठीक व्यक्त करता है।
theological_decisions:
- issue: इस्राएल की दशा पर कथावाचक का मूल्यांकन, पर राजतंत्र को अपने-आप में पूर्ण समाधान न ठहराना
  choice: वचन को सीधा वर्णनात्मक रूप दिया गया है, जबकि ‘अपनी दृष्टि में सही’ का मुहावरा अंतर्निहित नकारात्मक मूल्यांकन को बनाए रखता है।
  alternative: इसे केवल केंद्रीकृत शासन के अभाव की तटस्थ सूचना मानना, या इसे राजतंत्र की अनिवार्यता का स्पष्ट धर्मवैज्ञानिक दावा बनाना।
  rationale: न्यायियों में दोहराया गया यह कथन सामाजिक और धार्मिक अव्यवस्था का संकेत देता है, पर यह पद अकेले राजतंत्र को परम धर्मवैज्ञानिक आदर्श घोषित नहीं करता; अनुवाद इस तनाव को खुला रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सामान्य पाठक के लिए सहज। वाक्य-संरचना मूल के दो खंडों और उनके कारणात्मक-साहित्यिक तनाव को बनाए रखती है।
