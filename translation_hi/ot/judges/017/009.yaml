base_translation:
  language: en
  yaml_path: translation/ot/judges/017/009.yaml
  text: Micah said to him[a], “Where do you come from?” And he said to him, “I am a Levite from Bethlehem in Judah, and I am going to sojourn wherever I may find a place.”
translation:
  language: hi
  text: मीका ने उससे पूछा, “तुम कहाँ से आए हो?” उसने उत्तर दिया, “मैं यहूदा के बेतलेहेम का रहने वाला एक लेवी हूँ। मैं जहाँ मुझे जगह मिले, वहाँ अस्थायी रूप से रहने[a] जा रहा हूँ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल भाषा का क्रियापद किसी स्थान पर अस्थायी रूप से, प्रायः बाहरी या आश्रित निवासी के रूप में रहने का भाव भी रखता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵאַיִן תָּבוֹא
  choice: तुम कहाँ से आए हो?
  rationale: यह प्रश्न उसके आने के स्थान या मूल स्थान के बारे में है। वर्तमान प्रसंग में यह स्वाभाविक आधुनिक हिन्दी है।
- source_word: לֵוִי אָנֹכִי
  choice: मैं ... एक लेवी हूँ
  rationale: यह लेवी गोत्र या समुदाय की सदस्यता बताता है; हिन्दी में आत्म-परिचय के लिए ‘एक लेवी’ स्वाभाविक और स्पष्ट है।
- source_word: מִבֵּית לֶחֶם יְהוּדָה
  choice: यहूदा के बेतलेहेम का
  rationale: यह बेतलेहेम को यहूदा के क्षेत्र में स्थित नगर के रूप में पहचानता है और दूसरे समान नाम वाले स्थानों से भेद करता है।
- source_word: הֹלֵךְ
  choice: जा रहा हूँ
  rationale: कृदन्त जारी या निकटवर्ती गति को व्यक्त करता है; ‘जा रहा हूँ’ उसके वर्तमान प्रयाण को सहज हिन्दी में रखता है।
- source_word: לָגוּר
  choice: परदेशी की तरह रहने
  rationale: גור केवल सामान्य निवास नहीं, बल्कि प्रायः अपने पैतृक अधिकार-क्षेत्र से बाहर अस्थायी या आश्रित निवासी के रूप में रहने का भाव रखता है। मुख्य पाठ में यह सामाजिक अर्थ संक्षेप में सुरक्षित है।
- source_word: בַּאֲשֶׁר אֶמְצָא
  choice: जहाँ कहीं जगह मिले
  rationale: इब्रानी वाक्यांश में मिलने वाली वस्तु व्यक्त नहीं की गई है। स्वाभाविक हिन्दी के लिए ‘जगह’ जोड़ा गया है, जबकि ‘जहाँ कहीं’ अनिश्चित और खुले परिणाम को बनाए रखता है।
