base_translation:
  language: en
  yaml_path: translation/ot/judges/017/005.yaml
  text: The man Micah had a house of God[a], and he made an ephod and household idols, and he ordained one of his sons[b], and he became his priest.
translation:
  language: hi
  text: उस मीका नामक व्यक्ति के पास देवताओं का एक घर था[a]। उसने एक एपोद और गृह-देवताओं की मूर्तियाँ बनाईं, और अपने बेटों में से एक को याजक के रूप में नियुक्त किया[b], और वह उसका पुरोहित बन गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “एक निजी देवस्थान।” इब्रानी में शाब्दिक अर्थ “देवताओं का घर” है; कुछ इसे “ईश्वर का घर” भी समझते हैं।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “उसका हाथ भर दिया”; यह किसी को याजकीय सेवा में नियुक्त या प्रतिष्ठित करने का मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּית אֱלֹהִים
  choice: देव-स्थान
  rationale: शाब्दिक रूप से यह ‘ईश्वर/देवताओं का घर’ हो सकता है, पर इस प्रसंग में मीका के निजी उपासना-स्थल का बोध कराता है। ‘देव-स्थान’ मूल की संभावित बहुवचनता और अनधिकृत निजी धर्मस्थान—दोनों को खुला रखता है।
- source_word: אֵפוֹד
  choice: एपोद
  rationale: यह एक विशिष्ट प्राचीन धार्मिक वस्तु अथवा परिधान है जिसका सटीक हिन्दी पर्याय नहीं है; इसलिए लिप्यंतरण रखा गया है।
- source_word: תְרָפִים
  choice: गृह-देवताओं की मूर्तियाँ
  rationale: यह घरेलू उपासना में प्रयुक्त देव-मूर्तियों को सूचित करता है। यह अनुवाद आधुनिक पाठक को उनका स्वरूप और कार्य स्पष्ट करता है।
- source_word: וַיְמַלֵּא אֶת־יַד
  choice: अभिषेक किया
  rationale: ‘हाथ भरना’ याजकीय पद पर प्रतिष्ठित करने का मुहावरा है। ‘अभिषेक किया’ हिन्दी धार्मिक भाषा में नियुक्ति/प्रतिष्ठा का स्वाभाविक संकेत देता है; शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
- source_word: אַחַד מִבָּנָיו
  choice: अपने बेटों में से एक
  rationale: मूल के स्पष्ट पुल्लिंग बहुवचन और अंशवाचक रचना को बनाए रखता है।
- source_word: וַיְהִי לוֹ לְכֹהֵן
  choice: जो उसका पुरोहित बन गया
  rationale: यह अभिषेक का परिणाम बताता है और וַיְהִי की परिणामसूचक शक्ति को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְהָאִישׁ מִיכָה
  choice: उस मीका नामक व्यक्ति
  rationale: संज्ञा के साथ आए निश्चित पद और प्रसंग में पहले से परिचित व्यक्ति की पुनः पहचान को दर्शाता है; आरम्भ में ऐसा ‘अब’ नहीं जोड़ा गया जिसका मूल में स्वतंत्र कालवाचक आधार नहीं है।
theological_decisions:
- issue: בֵּית אֱלֹהִים को ऐसा कैसे प्रस्तुत किया जाए कि वैध यहोवा-उपासना स्वतः न मान ली जाए
  choice: देव-स्थान
  alternative: परमेश्वर का भवन / एक मंदिर
  rationale: एपोद, गृह-देवताओं की मूर्तियाँ और अपने पुत्र को पुरोहित बनाने का निकट संदर्भ एक निजी एवं अनियमित उपासना-स्थल दिखाता है। ‘देव-स्थान’ इसे वैध मंदिर घोषित किए बिना मूल की अर्थगत खुलावट बनाए रखता है।
- issue: मीका के पुत्र की याजकीय नियुक्ति का वर्णन
  choice: अभिषेक किया
  alternative: याजक ठहराया / हाथ भर दिया
  rationale: पाठ नियुक्ति की घटना बताता है, उसकी धार्मिक वैधता की पुष्टि नहीं करता। अनुवाद उसी वर्णनात्मक तटस्थता को बनाए रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। ‘पुरोहित’ को כֹּהֵן के लिए चुना गया है; ‘एपोद’ जैसे विशिष्ट प्राचीन धार्मिक पद का लिप्यंतरण रखा गया है।
