base_translation:
  language: en
  yaml_path: translation/ot/judges/017/003.yaml
  text: So he returned the eleven hundred pieces of silver to his mother[a], and his mother said, “I had solemnly dedicated the silver to Yahweh from my hand for my son, to make a carved image and a cast image[b]; so now I return it to you.”
translation:
  language: hi
  text: तब उसने चाँदी के वे ग्यारह सौ टुकड़े अपनी माँ को लौटा दिए। उसकी माँ ने कहा, “मैंने अपने हाथ से[a] अपने बेटे के लिए यह चाँदी याहवे को पूरी तरह समर्पित कर दी थी, ताकि एक तराशी हुई मूर्ति और एक ढली हुई मूर्ति बनाई जाए। इसलिए अब मैं इसे तुम्हें लौटा देती हूँ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ, “मेरे हाथ से”; यह मुहावरा निजी स्वामित्व, स्रोत, या व्यक्तिगत कर्तृत्व का भाव दे सकता है।
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּשֶׁב
  choice: लौटा दिए
  rationale: שׁוב के हिफ़ील रूप का अर्थ यहाँ ली हुई वस्तु को वापस करना है; यह चयन प्रतिपूर्ति का भाव स्वाभाविक हिन्दी में रखता है।
- source_word: אֶלֶף וּמֵאָה הַכֶּסֶף
  choice: चाँदी के वे ग्यारह सौ टुकड़े
  rationale: इब्रानी में माप की इकाई स्पष्ट रूप से नहीं दी गई है, इसलिए ‘शेकेल’ जोड़ने के बजाय सामान्य और सावधान अभिव्यक्ति रखी गई है।
- source_word: הַקְדֵּשׁ הִקְדַּשְׁתִּי
  choice: विधिपूर्वक समर्पित की थी
  rationale: क्रिया से पहले उसी धातु का infinitive absolute कथन पर बल देता है; ‘विधिपूर्वक’ समर्पण की गंभीर और धार्मिक प्रकृति को व्यक्त करता है।
- source_word: לַיהוָה
  choice: याहवे को
  rationale: व्यक्तिगत वाचा-नाम יהוה को शीर्षक से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: מִיָּדִי
  choice: अपने हाथ से
  rationale: मूल का ठोस मुहावरा बनाए रखा गया है; यह स्त्री के अपने अधिकार, स्रोत या व्यक्तिगत कृत्य की ओर संकेत कर सकता है।
- source_word: לִבְנִי
  choice: अपने बेटे के लिए
  rationale: ל यहाँ बेटे को समर्पण और आगामी निर्माण का अभिप्रेत लाभार्थी बताता है।
- source_word: פֶּסֶל
  choice: तराशी हुई मूर्ति
  rationale: यह चयन किसी तराशी या खोदकर बनाई गई प्रतिमा को ठोस, आधुनिक हिन्दी में व्यक्त करता है।
- source_word: וּמַסֵּכָה
  choice: और एक ढली हुई मूर्ति
  rationale: מַסֵּכָה प्रायः साँचे में ढाली गई, अक्सर धातु की, प्रतिमा को दर्शाता है; ‘ढली हुई’ निर्माण-विधि को स्पष्ट रखता है।
- source_word: אֲשִׁיבֶנּוּ לָךְ
  choice: अब मैं इसे तुझे लौटा देती हूँ
  rationale: संदर्भ में imperfect तत्काल होने वाले कार्य को व्यक्त करता है; वर्तमानकालीन हिन्दी कथन माँ के सीधे और निकटवर्ती कृत्य को स्वाभाविक ढंग से दर्शाता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: पद में वाचा-नाम सीधे आया है; ‘याहवे’ उसे उपाधि में बदले बिना सुरक्षित रखता है।
- issue: मूर्तियाँ बनवाने के लिए चाँदी का याहवे को समर्पण
  choice: समर्पण की धार्मिक भाषा और मूर्तियों के निर्माण—दोनों को यथावत रखना
  alternative: कथन को नरम करना या मूर्तियों को किसी अन्य उद्देश्य से जोड़ना
  rationale: मूल पाठ स्वयं इस धर्मवैचारिक तनाव को स्पष्ट किए बिना प्रस्तुत करता है; अनुवाद उसे न तो सुधारता है, न सामंजस्य बैठाकर हटाता है।
- issue: פֶּסֶל וּמַסֵּכָה में एक या दो वस्तुएँ
  choice: एक तराशी हुई मूर्ति और एक ढली हुई मूर्ति
  alternative: एक तराशी और ढली हुई मूर्ति
  rationale: संयोजक וְ दो संज्ञाओं को जोड़ता है और स्वाभाविक प्राथमिक पाठ दो वस्तुओं का है, पर समानांतर बाइबिलीय प्रयोग में दोनों पद एक ही प्रतिमा के निर्माण के दो पहलुओं को भी सूचित कर सकते हैं; इस वास्तविक अस्पष्टता को पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज कथात्मक रूप अपनाया गया है। माँ के संबोधन में ‘तुझे’ रखा गया है, जो माता-पुत्र के निकट संबंध और एकवचन इब्रानी प्रत्यय के अनुकूल है। धार्मिक तनाव को बिना व्याख्यात्मक समाधान के सुरक्षित रखा गया है।
