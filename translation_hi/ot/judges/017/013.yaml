source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר מִיכָ֔ה עַתָּ֣ה יָדַ֔עְתִּי כִּֽי יֵיטִ֥יב יְהוָ֖ה לִ֑/י כִּ֧י הָיָה לִ֛/י הַ/לֵּוִ֖י לְ/כֹהֵֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/017/013.yaml
  text: Then Micah said[a], “Now I know that Yahweh will do good to me, because I have a Levite as priest.”
translation:
  language: hi
  text: तब मीका ने कहा, “अब मैं जानता हूँ कि याहवे मेरा भला करेगा, क्योंकि मेरे पास याजक के रूप में एक लेवी[a] है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “याजक के रूप में वह लेवी।” इब्रानी में “लेवी” के साथ निश्चित उपपद है, जो पहले से परिचित उस लेवी की ओर संकेत कर सकता है; किंतु इस वाक्य-विन्यास में हिंदी में “एक लेवी” अधिक स्वाभाविक है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने कहा
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है; ‘तब’ स्वाभाविक हिंदी में घटनाक्रम स्पष्ट करता है।
- source_word: מִיכָה
  choice: मीका
  rationale: व्यक्तिनाम का प्रचलित हिंदी लिप्यंतरण।
- source_word: עַתָּה יָדַעְתִּי
  choice: अब मैं जानता हूँ
  rationale: पूर्ण क्रिया से प्राप्त वर्तमान बोध व्यक्त होता है; यह हिंदी में स्वाभाविक और स्रोत के निकट है।
- source_word: יֵיטִיב ... לִי
  choice: मेरा भला करेगा
  rationale: हिफ़ील रूप किसी के साथ भलाई करने का भाव देता है; ‘मेरा भला करेगा’ लाभार्थी अर्थ को सहज हिंदी में व्यक्त करता है और केवल आर्थिक समृद्धि तक सीमित नहीं करता।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चतुर्वर्णीय व्यक्तिगत ईश-नाम को उपाधि से बदलने के बजाय हिंदी में स्थापित लिप्यंतरण से प्रस्तुत किया गया है।
- source_word: הָיָה לִי
  choice: मेरे पास ... है
  rationale: शाब्दिक ‘मेरे लिए हुआ/है’ अधिकार या उपलब्धता व्यक्त करने वाला इब्रानी मुहावरा है।
- source_word: הַלֵּוִי
  choice: एक लेवी
  rationale: इब्रानी में निश्चित उपपद है, पर यहाँ मीका के तर्क में उस व्यक्ति की लेवी पहचान पर बल है; सहज हिंदी में वर्गगत अर्थ के लिए ‘एक लेवी’ उपयुक्त है।
- source_word: לְכֹהֵן
  choice: याजक के रूप में
  rationale: लामेद भूमिका या कार्य बताता है; यह पदबंध नियुक्त भूमिका को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: ईश-नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में व्यक्तिगत ईश-नाम है। हिंदी बाइबलीय प्रयोग में व्यापक रूप से पहचाने जाने वाले ‘यहोवा’ को रखा गया है, न कि उसे ‘प्रभु’ जैसी उपाधि से बदला गया।
- issue: मीका के विश्वास का मूल्यांकन
  choice: कथन को बिना संपादकीय अनुमोदन या निंदा के प्रस्तुत करना
  alternative: उसके निष्कर्ष को स्पष्टतः सही या अंधविश्वासी कहना
  rationale: पद केवल मीका का निष्कर्ष बताता है; अनुवाद उसके धार्मिक तर्क का अतिरिक्त मूल्यांकन नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिंदी; भाषा सरल, गरिमापूर्ण और कथात्मक है। ‘याजक’ और ‘लेवी’ जैसे स्थापित बाइबलीय पद बनाए गए हैं।
