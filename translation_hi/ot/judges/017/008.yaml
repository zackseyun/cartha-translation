  edition: WLC
  text: וַ/יֵּ֨לֶךְ הָ/אִ֜ישׁ מֵ/הָ/עִ֗יר מִ/בֵּ֥ית לֶ֨חֶם֙ יְהוּדָ֔ה לָ/ג֖וּר בַּ/אֲשֶׁ֣ר יִמְצָ֑א וַ/יָּבֹ֧א הַר אֶפְרַ֛יִם עַד בֵּ֥ית מִיכָ֖ה לַ/עֲשׂ֥וֹת דַּרְכּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/017/008.yaml
  text: And the man went from the city[a], from Bethlehem of Judah, to sojourn wherever he might find a place. And he came to the hill country of Ephraim, as far as the house of Micah, to continue his journey.
translation:
  language: hi
  text: वह व्यक्ति उस नगर—अर्थात् यहूदा के बेतलेहेम—से निकल पड़ा, ताकि जहाँ कहीं उसे जगह मिले वहाँ परदेशी की तरह रह सके। अपनी राह पर आगे बढ़ते हुए[a] वह एप्रैम के पहाड़ी प्रदेश में, मीका के घर तक, आ पहुँचा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपनी राह पर आगे बढ़ने के लिए” अथवा “अपनी यात्रा जारी रखने के लिए।” इब्रानी मुहावरे का शाब्दिक अर्थ है “अपना मार्ग बनाना।”
    reason: लַעֲשׂוֹת דַּרְכּוֹ का शाब्दिक मुहावरा यात्रा/आगे बढ़ने का अर्थ देता है; वाक्य में इसकी सटीक वाक्यगत भूमिका पर विकल्प बने रहते हैं।
lexical_decisions:
- source_word: וַיֵּלֶךְ הָאִישׁ
  choice: उस पुरुष ने…छोड़ दिया…चल पड़ा
  rationale: הלך की कथात्मक गति को स्वाभाविक हिन्दी में व्यक्त किया गया है; הָאִישׁ का सीधा अर्थ ‘उस पुरुष’ रखा गया है, यद्यपि पिछले पद से वह युवा लेवी जाना जाता है।
- source_word: מֵהָעִיר מִבֵּית לֶחֶם יְהוּדָה
  choice: यहूदा के बेतलेहेम नगर को छोड़ दिया
  rationale: עִיר के लिए ‘नगर’ निकट और सहज है। दोहरे स्रोत-वाक्यांश को हिन्दी में बिना अनावश्यक पुनरुक्ति के व्यक्त किया गया है।
- source_word: לָגוּר
  choice: प्रवासी बनकर रहने के लिए
  rationale: גור केवल सामान्य रूप से रहने का नहीं, बल्कि अपने स्थायी स्थान से बाहर निवासी या प्रवासी के रूप में रहने का भाव दे सकता है।
- source_word: בַּאֲשֶׁר יִמְצָא
  choice: जहाँ कहीं उसे जगह मिले
  rationale: मूल में ‘पाना’ का कर्म निहित है; हिन्दी में अपेक्षित ‘जगह’ जोड़ने से अर्थ स्पष्ट और स्वाभाविक होता है।
- source_word: הַר אֶפְרַיִם
  choice: एप्रैम का पहाड़ी प्रदेश
  rationale: यह पद सामान्यतः किसी एक पर्वत के बजाय एप्रैम के पहाड़ी भूभाग को दर्शाता है।
- source_word: עַד בֵּית מִיכָה
  choice: मीका के घर तक
  rationale: עַד यात्रा की पहुँची हुई सीमा या अंतिम बिंदु बताता है; ‘तक’ इसे संक्षेप में सुरक्षित रखता है।
- source_word: לַעֲשׂוֹת דַּרְכּוֹ
  choice: अपनी यात्रा करते हुए
  rationale: शाब्दिक मुहावरा ‘अपना मार्ग बनाना/करना’ यात्रा करने या मार्ग पर आगे बढ़ने का अर्थ देता है। प्रसंग में समकालिक अर्थ स्वाभाविक है, पर अन्य संभावित अर्थ पादटिप्पणी में रखे गए हैं।
