  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। इब्रानी की आरंभिक कथात्मक रचना को हिंदी में बिना अनावश्यक ‘अब’ जोड़े व्यक्त किया गया है। नाम-संबंधी पाद-टिप्पणी का चिह्न उसी नाम के बाद रखा गया है।
