  text: There was a man from the hill country of Ephraim[a], and his name was Mikayhu.
translation:
  language: hi
  text: एप्रैम के पहाड़ी प्रदेश का एक आदमी था, और उसका नाम मीकायहू[a] था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: परंपरागत रूप से इस नाम का अनुवाद ‘मीका’ किया जाता है। यहाँ इब्रानी रूप ‘मीकायहू’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: था
  rationale: यह रूप एक नए वृत्तांत-खंड का परिचय देता है। हिंदी वाक्य में सामान्य अस्तित्वसूचक रचना से इसका भाव स्वाभाविक रूप से व्यक्त होता है; स्रोत में स्पष्ट रूप से ‘अब’ नहीं है।
- source_word: אִישׁ
  choice: एक आदमी
  rationale: यहाँ शब्द किसी पुरुष व्यक्ति को सामान्य ढंग से प्रस्तुत करता है; ‘एक आदमी’ सहज और अर्थानुरूप है।
- source_word: מֵהַר אֶפְרָיִם
  choice: एप्रैम के पहाड़ी प्रदेश का
  rationale: यह पद एप्रैम से जुड़े ऊँचे पहाड़ी भूभाग को दर्शाता है, किसी एक पर्वत को नहीं। संबंधसूचक ‘का’ मूल के ‘से/का निवासी’ वाले भाव को संक्षेप और स्वाभाविक रूप से व्यक्त करता है।
- source_word: וּשְׁמוֹ
  choice: और उसका नाम ... था
  rationale: यह मूल की समन्वयी कथन-रचना को बनाए रखते हुए स्वाभाविक हिंदी देता है।
- source_word: מִיכָיְהוּ
  choice: मीकायहू
  rationale: यह लिप्यंतरण इस पद में प्रयुक्त विशिष्ट इब्रानी नामरूप को दर्शाता है; पारंपरिक संक्षिप्त रूप ‘मीका’ को मुख्य पाठ में रखने से मूल रूप का भेद मिट जाता।
