base_translation:
  language: en
  yaml_path: translation/ot/judges/017/004.yaml
  text: So he returned the silver to his mother[a], and his mother took two hundred pieces of silver and gave it to the silversmith, and he made it into a carved image and a cast image[c][b], and it was in the house of Micah.
translation:
  language: hi
  text: तब उसने चाँदी अपनी माँ को लौटा दी। उसकी माँ ने चाँदी के दो सौ[a] लिए और उन्हें चाँदी के कारीगर को दे दिया, और उसने उससे एक खुदी हुई मूर्ति और एक ढली हुई मूर्ति[b] बनाई। वह मीका के घर में थी[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: संभवतः “दो सौ शेकेल चाँदी”; इस पद के इब्रानी पाठ में माप की इकाई स्पष्ट रूप से नहीं दी गई है।
    reason: lexical_alternative
  - marker: b
    text: या, “एक खुदी हुई प्रतिमा और एक साँचे में ढली प्रतिमा।”
    reason: lexical_alternative
  - marker: c
    text: “खुदी हुई मूर्ति और ढली हुई मूर्ति” के बाद इब्रानी में क्रिया एकवचन है; संभवतः निर्मित वस्तु या पूरे समूह को एक इकाई माना गया है।
    reason: textual_syntax
lexical_decisions:
- source_word: וַיָּשֶׁב אֶת הַכֶּסֶף
  choice: उसने चाँदी ... लौटा दी
  rationale: שׁוב के हिफ़ील रूप में चाँदी को उसके पहले स्वामी के पास वापस करने का भाव है। यहाँ כֶּסֶף को निर्माण-सामग्री के संदर्भ के कारण ‘चाँदी’ कहना ‘धन’ से अधिक ठोस और उपयुक्त है।
- source_word: מָאתַיִם כֶּסֶף
  choice: चाँदी में से दो सौ
  rationale: मूल इब्रानी में संख्या के साथ चाँदी है, पर माप की इकाई इस पद में स्पष्ट नहीं है। हिंदी में ‘चाँदी में से दो सौ’ उस अपूर्णता को बनाए रखता है; संभावित ‘शेकेल’ पादटिप्पणी में दिया गया है।
- source_word: לַצּוֹרֵף
  choice: सुनार
  rationale: צֹרֵף धातु को शुद्ध करने या उससे वस्तु बनाने वाले कारीगर को दर्शाता है। चाँदी के प्रसंग में सामान्य आधुनिक हिंदी का ‘सुनार’ स्वाभाविक है, यद्यपि शब्द केवल सोने के कारीगर तक सीमित नहीं है।
- source_word: פֶּסֶל
  choice: एक खुदी हुई मूर्ति
  rationale: פֶּסֶל तराशकर या खोदकर बनाई गई प्रतिमा का द्योतक है। ‘मूर्ति’ के साथ ‘खुदी हुई’ निर्माण-विधि को व्यक्त करता है और सीधे ‘मूरत’ या अधिक व्याख्यात्मक ‘मूर्तिपूजक प्रतिमा’ कहने से बचता है।
- source_word: וּמַסֵּכָה
  choice: और एक ढली हुई मूर्ति
  rationale: מַסֵּכָה पिघली धातु को साँचे में ढालकर बनाई गई प्रतिमा को दर्शाता है। ‘ढली हुई मूर्ति’ आधुनिक और स्पष्ट हिंदी है।
- source_word: וַיְהִי בְּבֵית מִיכָיְהוּ
  choice: वह मीका के घर में रखी गई
  rationale: इब्रानी में क्रिया एकवचन है, यद्यपि ठीक पहले दो संज्ञाएँ आती हैं। ‘वह’ निर्मित वस्तु या संयुक्त मूर्ति-समूह को एक इकाई मानने वाली एकवचन रचना को बनाए रखता है; ‘रखी गई’ हिंदी में स्थानगत परिणाम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: מִיכָיְהוּ
  choice: मीका
  rationale: न्यायियों की पुस्तक में इस व्यक्ति के लिए प्रचलित हिंदी नामरूप ‘मीका’ है।
theological_decisions:
- issue: פֶּסֶל וּמַסֵּכָה को स्पष्ट निंदात्मक शब्दावली में प्रस्तुत करना
  choice: एक खुदी हुई मूर्ति और एक ढली हुई मूर्ति
  alternative: एक मूरत और एक ढली हुई मूरत; मूर्तिपूजा की दो प्रतिमाएँ
  rationale: व्यापक प्रसंग इन उपासना-वस्तुओं की समस्या स्पष्ट करता है, पर इस पद के संज्ञा-शब्दों को अतिरिक्त धर्मवैचारिक टिप्पणी के बिना उनकी निर्माण-विधि सहित अनूदित करना उचित है।
- issue: दो मूर्तियों के बाद एकवचन क्रिया का अर्थ
  choice: एकवचन ‘वह ... रखी गई’ बनाए रखना
  alternative: वे मीका के घर में रखी गईं
  rationale: मूल पाठ का וַיְהִי एकवचन है और संभवतः निर्मित वस्तु अथवा संयुक्त समूह को एक इकाई मानता है। बहुवचन करना हिंदी में सहज होता, पर मूल की वास्तविक व्याकरणिक तनाव को मिटा देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘सुनार’, ‘खुदी हुई मूर्ति’ और ‘ढली हुई मूर्ति’ परिचित शब्द हैं। अंतिम वाक्य में कुछ असामान्य लगने वाला एकवचन जानबूझकर रखा गया है, ताकि इब्रानी की संख्या-संबंधी अस्पष्टता बनी रहे।
