source:
  edition: WLC
  text: וַ/יְהִי נַ֗עַר מִ/בֵּ֥ית לֶ֨חֶם֙ יְהוּדָ֔ה מִ/מִּשְׁפַּ֖חַת יְהוּדָ֑ה וְ/ה֥וּא לֵוִ֖י וְ/ה֥וּא גָֽר שָֽׁם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/017/007.yaml
  text: There was a young man from Bethlehem in Judah[a], from the clan of Judah; and he was a Levite[b], and he was sojourning there.
translation:
  language: hi
  text: यहूदा के बेतलेहेम का एक युवक था, जो यहूदा के कुल[a] से था। वह लेवी था और वहाँ प्रवासी के रूप में रह रहा था[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘यहूदा के परिवार से।’ इब्रानी शब्द परिवार अथवा उससे बड़े कुल-समूह को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘वहाँ परदेशी की तरह रह रहा था’ अथवा ‘वहाँ अस्थायी रूप से रह रहा था।’ इब्रानी क्रिया प्रायः किसी स्थान पर बाहरी या अस्थायी निवासी के रूप में रहने का भाव देती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: था
  rationale: कथानक में एक नए पात्र का परिचय देता है। हिन्दी में अस्तित्वसूचक ‘था’ स्वाभाविक है; अलग से ‘अब’ या ‘तब’ जोड़ना आवश्यक नहीं।
- source_word: נַעַר
  choice: युवक
  rationale: संदर्भ में आयु और पुरुष की पहचान है, सेवक की भूमिका नहीं; इसलिए ‘युवक’ स्पष्ट और स्वाभाविक है।
- source_word: מִבֵּית לֶחֶם יְהוּדָה
  choice: यहूदा के बेतलेहेम का
  rationale: ‘यहूदा’ यहाँ बेतलेहेम की भौगोलिक पहचान स्पष्ट करता है। यह हिन्दी में संक्षिप्त और सहज स्थान-सूचक प्रयोग है।
- source_word: מִמִּשְׁפַּחַת יְהוּדָה
  choice: यहूदा के कुल से
  rationale: מִשְׁפָּחָה परिवार से बड़ा वंश-समूह या कुल दर्शा सकता है। ‘कुल’ इस सामूहिक अर्थ को व्यक्त करता है और ‘गोत्र’ की अपेक्षा कम व्याख्यात्मक है।
- source_word: לֵוִי
  choice: लेवी
  rationale: यह उस युवक की पहचान लेवी के रूप में करता है। संक्षिप्त रूप मूल पाठ में ‘यहूदा के कुल’ के साथ उपस्थित तनाव को बनाए रखता है।
- source_word: גָר שָׁם
  choice: वहाँ प्रवासी के रूप में रह रहा था
  rationale: גור अपने स्थायी पैतृक स्थान से बाहर रह रहे व्यक्ति के निवास को सूचित कर सकता है। ‘प्रवासी के रूप में रह रहा था’ आधुनिक हिन्दी में बाहरी अथवा अस्थायी निवासी का भाव रखता है, बिना किसी विशिष्ट कानूनी दर्जे को आरोपित किए।
theological_decisions:
- issue: युवक की यहूदा और लेवी से जुड़ी पहचान के बीच प्रत्यक्ष तनाव
  choice: मुख्य पाठ में ‘यहूदा के कुल से’ और ‘वह लेवी था’—दोनों कथनों को साथ रखा गया है।
  alternative: ‘यहूदा’ को केवल भौगोलिक या सामाजिक संबंध मानकर स्पष्ट करना, अथवा वाक्य को इस तरह बदलना कि तनाव समाप्त हो जाए।
  rationale: इब्रानी पाठ दोनों पहचानों को बिना स्पष्टीकरण साथ रखता है। अनुवाद उस वास्तविक अस्पष्टता और कथात्मक तनाव को हल नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण कथात्मक शैली रखी गई है। ‘युवक’, ‘कुल’ और ‘प्रवासी’ सामान्य पाठक के लिए बोधगम्य हैं। वाक्य-विभाजन हिन्दी की स्वाभाविक लय के लिए किया गया है, जबकि मूल के सभी मुख्य कथन और पहचान-संबंधी तनाव सुरक्षित हैं।
