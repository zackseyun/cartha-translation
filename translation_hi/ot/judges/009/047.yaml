  text: And it was reported to Abimelech that all the leaders of the tower of Shechem had gathered together.
translation:
  language: hi
  text: अबीमेलेक को यह समाचार दिया गया कि शकेम के गुम्मट के सभी अगुवे इकट्ठे हो गए थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֻּגַּד
  choice: यह समाचार मिला
  rationale: 'निफ़अल रूप का अवैयक्तिक भाव स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है: बात अबीमेलेक को बताई गई/उस तक समाचार पहुँचा।'
- source_word: בַּעֲלֵי
  choice: अगुवे
  rationale: यहाँ בַּעֲלֵי का आशय संभवतः नगर-समुदाय के प्रतिष्ठित या अधिकार रखने वाले पुरुषों से है; शाब्दिक ‘मालिक’ हिन्दी में भ्रामक होगा।
- source_word: מִגְדַּל שְׁכֶם
  choice: शकेम का गढ़
  rationale: מִגְדָּל मूलतः ‘मीनार’ हो सकता है, पर इस प्रसंग में यह शकेम से संबद्ध किलेबंद बस्ती/गढ़ का स्थाननाम या समुदाय सूचित करता है। ‘गढ़’ प्रसंगानुकूल है और अनावश्यक रूप से केवल एक मीनार तक अर्थ सीमित नहीं करता।
- source_word: הִתְקַבְּצוּ
  choice: इकट्ठे हो गए हैं
  rationale: हित्पएल पूर्ण रूप सामूहिक रूप से एकत्र होने को दर्शाता है; सूचना मिलने के समय तक पूरी हो चुकी स्थिति को हिन्दी में सहज ढंग से व्यक्त किया गया है।
