base_translation:
  language: en
  yaml_path: translation/ot/judges/009/038.yaml
  text: Then Zebul said to him[a], “Where is your mouth now, you who said, ‘Who is Abimelech, that we should serve him?’ Is this not the people whom you despised? Go out now and fight against them.”
translation:
  language: hi
  text: तब जबूल ने उससे कहा, “अब तुम्हारा वह मुँह कहाँ है[a]—तुमने ही तो कहा था, ‘अबीमेलेक कौन है कि हम उसकी सेवा करें?’ क्या ये वे लोग नहीं हैं जिन्हें तुमने तुच्छ समझा था? अब बाहर निकलो और उनसे लड़ो।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक अर्थ, “अब तुम्हारा मुँह कहाँ है?” यह उसकी पहले की बड़ी-बड़ी बातों का उपहास करने वाला मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אַיֵּה אֵפוֹא פִיךָ
  choice: अब तुम्हारा वह मुँह कहाँ है
  rationale: इब्रानी का सजीव शाब्दिक बिंब बनाए रखते हुए ‘अब’ से जबूल के व्यंग्यपूर्ण ताने को व्यक्त किया गया है; ‘वह’ पूर्व की डींग की ओर संकेत को स्वाभाविक बनाता है।
- source_word: אֲשֶׁר תֹּאמַר
  choice: जिससे तुमने कहा था
  rationale: सम्बन्धवाचक वाक्यांश को ‘मुँह’ से जोड़कर इब्रानी रचना और पूर्व कथन के स्पष्ट संकेत—दोनों को रखा गया है।
- source_word: מִי אֲבִימֶלֶךְ כִּי נַעַבְדֶנּוּ
  choice: अबीमेलेक कौन है कि हम उसकी सेवा करें?
  rationale: मूल के तिरस्कारपूर्ण आलंकारिक प्रश्न और ‘सेवा करना’ क्रिया को निकटता से सुरक्षित रखता है।
- source_word: הֲלֹא זֶה הָעָם
  choice: क्या ये वही लोग नहीं हैं
  rationale: הֲלֹא के आलंकारिक प्रश्न को बनाए रखा गया है। सामूहिक एकवचन ‘लोग’ के लिए स्वाभाविक हिन्दी में बहुवचन संकेत प्रयुक्त है।
- source_word: מָאַסְתָּה בּוֹ
  choice: जिन्हें तुमने तुच्छ समझा था
  rationale: מָאַס के अस्वीकार और अवमानना के भाव को प्रसंग के व्यंग्यपूर्ण स्वर में सहज हिन्दी देता है।
- source_word: צֵא נָא עַתָּה
  choice: अब बाहर निकलो
  rationale: आज्ञा और चुनौती की तात्कालिकता व्यक्त होती है; נָא को विनम्र ‘कृपया’ कहना इस ताने के प्रसंग में भ्रामक होता।
- source_word: וְהִלָּחֶם בּוֹ
  choice: और उनसे लड़ो
  rationale: בּוֹ व्याकरणतः सामूहिक ‘उससे’ है और उसका पूर्वपद הָעָם है; स्वाभाविक हिन्दी में ‘लोगों’ के अनुरूप ‘उनसे’ अर्थ को स्पष्ट रखता है।
