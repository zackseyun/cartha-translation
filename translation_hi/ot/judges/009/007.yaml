base_translation:
  language: en
  yaml_path: translation/ot/judges/009/007.yaml
  text: And they told Jotham[a], and he went and stood on the top of Mount Gerizim, and he lifted up his voice and called out and said to them, “Listen to me, leaders of Shechem[b], that God may listen to you.”
translation:
  language: hi
  text: उन्होंने योताम को यह बताया, तब वह गया और गरिज्जीम पर्वत की चोटी पर खड़ा हो गया। उसने अपना स्वर ऊँचा किया, पुकारा और उनसे कहा, “शकेम के अगुवो[a], मेरी सुनो, ताकि परमेश्वर तुम्हारी सुने[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “शकेम के स्वामियो” या “शकेम के मालिको।”
    reason: lexical_alternative
  - marker: b
    text: या, “और परमेश्वर तुम्हारी सुने।”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּגִּדוּ לְיוֹתָם
  choice: जब योताम को यह बताया गया
  rationale: नגד के हिफ़ील रूप का अर्थ यहाँ सूचना देना है। हिन्दी में कर्मवाच्य प्रयोग अज्ञात बहुवचन कर्ता को स्वाभाविक रूप से व्यक्त करता है।
- source_word: בְּרֹאשׁ הַר גְּרִזִים
  choice: गरिज्जीम पर्वत की चोटी पर
  rationale: रֹאשׁ का स्थलाकृतिक अर्थ ‘चोटी’ है; स्थान-नाम का प्रचलित हिन्दी लिप्यंतरण रखा गया है।
- source_word: וַיִּשָּׂא קוֹלוֹ וַיִּקְרָא וַיֹּאמֶר
  choice: उसने ऊँची आवाज़ में पुकारकर उनसे कहा
  rationale: ‘आवाज़ उठाना’ और ‘पुकारना’ सार्वजनिक रूप से ऊँचे स्वर में बोलने का संकेत देते हैं। यह हिन्दी रूप अर्थ और कथात्मक क्रम दोनों को स्वाभाविक ढंग से रखता है।
- source_word: שִׁמְעוּ אֵלַי
  choice: मेरी सुनो
  rationale: שמע के साथ אֶל का आशय ध्यान देकर सुनना है; ‘मेरी सुनो’ वर्तमान हिन्दी में सीधा और स्वाभाविक आग्रह है।
- source_word: בַּעֲלֵי שְׁכֶם
  choice: शकेम के अगुवो
  rationale: शाब्दिक अर्थ ‘शकेम के स्वामी/मालिक’ है, पर न्यायियों में यह पद नगर के अधिकार-संपन्न प्रमुख लोगों को सूचित करता है। ‘अगुवो’ इस सामाजिक भूमिका को सामान्य पाठक के लिए स्पष्ट करता है; शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: וְיִשְׁמַע אֲלֵיכֶם אֱלֹהִים
  choice: ताकि परमेश्वर भी तुम्हारी सुने
  rationale: आज्ञार्थक वाक्य के बाद वाव सहित अपूर्ण क्रिया को उद्देश्य/परिणाम के रूप में पढ़ा गया है। ‘भी’ सुनने की पारस्परिकता को हिन्दी में स्पष्ट करता है, और एकवचन क्रिया के कारण אֱלֹהִים को ‘परमेश्वर’ कहा गया है।
theological_decisions:
- issue: योताम के अंतिम वाक्यांश का बल
  choice: 'उद्देश्य/परिणाम: “ताकि परमेश्वर भी तुम्हारी सुने”'
  alternative: 'समन्वयी कामना: “और परमेश्वर तुम्हारी सुने”'
  rationale: इब्रानी וְיִשְׁמַע को आग्रह के परिणाम/उद्देश्य के रूप में या कामनासूचक कथन के रूप में समझा जा सकता है। मुख्य पाठ में पहले अर्थ को रखा गया है और वास्तविक व्याकरणिक अस्पष्टता को पादटिप्पणी में सुरक्षित किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज कथात्मक रूप अपनाया गया है। इब्रानी की पुनरुक्ति को अत्यधिक बोझिल बनाए बिना ‘ऊँची आवाज़ में पुकारकर ... कहा’ में सुरक्षित रखा गया है। संबोधन में बहुवचन ‘अगुवो’ प्रयोग किया गया है।
