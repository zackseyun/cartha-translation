base_translation:
  language: en
  yaml_path: translation/ot/judges/009/051.yaml
  text: But there was a strong tower in the middle of the city[a], and all the men and women and all the leaders of the city fled there and shut themselves in[b], and they went up onto the roof of the tower.
translation:
  language: hi
  text: परन्तु नगर के बीच एक सुदृढ़ मीनार[a] थी। सभी पुरुष और स्त्रियाँ तथा नगर के सभी प्रमुख लोग[b] भागकर वहाँ गए। उन्होंने अपने को भीतर बंद कर लिया और मीनार की छत पर चढ़ गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘किलेबंद मीनार’। इब्रानी में ‘मीनार’ के साथ ‘बल/दृढ़ता’ का शब्द जुड़ा है, जो उसकी रक्षात्मक मजबूती पर बल देता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘नगर के स्वामी/मालिक’। यहाँ यह नगर के प्रधान या प्रभावशाली लोगों के लिए प्रयुक्त मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מִגְדַּל עֹז
  choice: सुदृढ़ मीनार
  rationale: מִגְדַּל का अर्थ ‘मीनार’ और עֹז का अर्थ ‘बल/दृढ़ता’ है। ‘सुदृढ़ मीनार’ वास्तविक रक्षात्मक संरचना का स्वाभाविक और स्पष्ट हिन्दी वर्णन है।
- source_word: בְּתוֹךְ הָעִיר
  choice: नगर के बीच
  rationale: בְּתוֹךְ का स्थानवाचक अर्थ ‘बीच में’ है; यह केवल नगर की सीमा के भीतर होने से अधिक सटीक है।
- source_word: וַיָּנֻסוּ שָׁמָּה
  choice: भागकर वहाँ गए
  rationale: נוּס का मूल अर्थ संकट से भागना है। यह अभिप्रेत शरण को क्रिया में जोड़े बिना गति और दिशा दोनों स्पष्ट करता है।
- source_word: כָּל הָאֲנָשִׁים וְהַנָּשִׁים
  choice: सभी पुरुष और स्त्रियाँ
  rationale: इब्रानी पाठ पुरुषों और स्त्रियों का अलग-अलग उल्लेख करता है, इसलिए दोनों को स्पष्ट रखा गया है।
- source_word: וְכֹל בַּעֲלֵי הָעִיר
  choice: तथा नगर के सभी प्रमुख लोग
  rationale: בַּעֲלֵי का शाब्दिक अर्थ ‘स्वामी/मालिक’ है, पर नगर-संबंधी प्रयोग में यह नगर के प्रभावशाली या प्रधान लोगों को सूचित कर सकता है। ‘प्रमुख लोग’ इस भाव को सहज हिन्दी में व्यक्त करता है, जबकि संभावित व्यापक अर्थ फुटनोट में रखा गया है।
- source_word: וַיִּסְגְּרוּ בַעֲדָם
  choice: उन्होंने अपने को भीतर बंद कर लिया
  rationale: वाक्यांश का भाव है कि उन्होंने अपने पीछे मार्ग बंद करके स्वयं को सुरक्षित भीतर कर लिया; इब्रानी में स्पष्ट कर्म नहीं है, इसलिए अनावश्यक रूप से ‘दरवाज़ा’ नहीं जोड़ा गया।
- source_word: וַיַּעֲלוּ עַל גַּג הַמִּגְדָּל
  choice: मीनार की छत पर चढ़ गए
  rationale: עָלָה ऊपर जाने को और גַּג विशेष रूप से छत को दर्शाता है; ‘चढ़ गए’ वर्तमान प्रसंग में स्वाभाविक हिन्दी है।
