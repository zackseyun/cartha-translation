source:
  edition: WLC
  text: דַּבְּרוּ נָ֞א בְּ/אָזְנֵ֨י כָל בַּעֲלֵ֣י שְׁכֶם֮ מַה טּ֣וֹב לָ/כֶם֒ הַ/מְשֹׁ֨ל בָּ/כֶ֜ם שִׁבְעִ֣ים אִ֗ישׁ כֹּ֚ל בְּנֵ֣י יְרֻבַּ֔עַל אִם מְשֹׁ֥ל בָּ/כֶ֖ם אִ֣ישׁ אֶחָ֑ד וּ/זְכַרְתֶּ֕ם כִּֽי עַצְמֵ/כֶם וּ/בְשַׂרְ/כֶ֖ם אָנִֽי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/002.yaml
  text: 'Please speak in the hearing of all the leaders of Shechem: Which is better for you—that seventy men[a], all the sons of Jerubbaal, rule over you, or that one man rule over you? And remember that I am your bone and your flesh.'
translation:
  language: hi
  text: “तुम लोग शकेम के सभी अगुवों के सामने यह बात कहो, ‘तुम्हारे लिए क्या बेहतर है—यरुब्बाल के सभी सत्तर पुत्र तुम पर शासन करें, या एक पुरुष तुम पर शासन करे? और याद रखो कि मैं तुम्हारी हड्डी और तुम्हारा मांस हूँ[a]।’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी मुहावरा: “तुम्हारी हड्डी और तुम्हारा मांस”; अर्थात् “अपना ही रक्त-मांस” या निकट रक्त-संबंधी।'
    reason: मूल के ठोस संबंधसूचक मुहावरे को रखते हुए उसका आशय स्पष्ट करना।
lexical_decisions:
- source_word: דַּבְּרוּ נָא
  choice: कृपया … यह बात कहो
  rationale: बहुवचन आज्ञार्थक क्रिया के साथ נָא विनम्र आग्रह प्रकट करता है। यह हिंदी में स्वाभाविक ढंग से उस आग्रह को बनाए रखता है।
- source_word: בְּאָזְנֵי
  choice: के सुनते
  rationale: शाब्दिक रूप से ‘कानों में’ है, पर आशय ऐसी रीति से कहना है कि संबोधित लोग सुनें। ‘के सुनते’ सार्वजनिक रूप से उनके सामने बात रखने का भाव देता है।
- source_word: בַּעֲלֵי שְׁכֶם
  choice: शकेम के सभी अगुओं
  rationale: בַּעֲלֵי यहाँ नगर के प्रभावशाली पुरुषों, स्वामियों या नागरिक नेतृत्व को सूचित कर सकता है। ‘अगुओं’ राजनीतिक-सामाजिक भूमिका बताता है, पर किसी निश्चित औपचारिक पद का अनावश्यक दावा नहीं करता।
- source_word: מַה טּוֹב לָכֶם
  choice: तुम्हारे लिए क्या अच्छा है
  rationale: इसके बाद दो विकल्प दिए गए हैं, इसलिए वाक्य तुलनात्मक प्रश्न का काम करता है। फिर भी ‘क्या अच्छा है’ मूल की अभिव्यक्ति को बनाए रखता है और हिंदी में दोनों विकल्पों के कारण अर्थ स्पष्ट है।
- source_word: הַמְשֹׁל בָּכֶם … מְשֹׁל בָּכֶם
  choice: तुम पर शासन करें … तुम पर शासन करे
  rationale: מָשַׁל राजनीतिक अधिकार चलाने को दर्शाता है। दोनों स्थानों पर एक ही हिंदी क्रिया रखकर इब्रानी की पुनरावृत्ति सुरक्षित की गई है।
- source_word: שִׁבְעִים אִישׁ כֹּל בְּנֵי יְרֻבַּעַל
  choice: यरुब्बाल के सभी सत्तर पुत्र
  rationale: संदर्भ में गिने गए पुरुष यरुब्बाल के पुत्र हैं। हिंदी में ‘सत्तर पुत्र’ अधिक स्वाभाविक है और पुरुषवाचक संदर्भ को ठीक रखता है।
- source_word: אִישׁ אֶחָד
  choice: एक ही पुरुष
  rationale: यह सत्तर पुरुषों के विपरीत एक अकेले पुरुष पर बल देता है। ‘एक ही’ उस विरोध की अलंकारिक धार बनाए रखता है।
- source_word: וּזְכַרְתֶּם
  choice: और याद रखो
  rationale: रूप वाव-सहित पूर्ण क्रिया है, पर प्रसंग में आग्रह अथवा निर्देश का बल रखता है। ‘याद रखो’ आधुनिक हिंदी में सीधा और स्वाभाविक है।
- source_word: עַצְמֵכֶם וּבְשַׂרְכֶם
  choice: तुम्हारी हड्डी और तुम्हारा मांस
  rationale: मूल का ठोस संबंधसूचक मुहावरा सुरक्षित रखा गया है। इसका आशय निकट रक्त-संबंध है, जिसे पाद-टिप्पणी स्पष्ट करती है।
- source_word: אָנִי
  choice: मैं … हूँ
  rationale: स्वतंत्र सर्वनाम वक्ता पर बल देता है। हिंदी में स्पष्ट ‘मैं’ और वाक्य की स्थिति यह बल पर्याप्त रूप से व्यक्त करते हैं।
theological_decisions:
- issue: रक्त-संबंध के मुहावरे को शाब्दिक रखना या अर्थ खोलकर कहना
  choice: मुख्य पाठ में ‘मैं तुम्हारी हड्डी और तुम्हारा मांस हूँ’
  alternative: ‘मैं तुम्हारा अपना खून हूँ’ अथवा ‘मैं तुम्हारा निकट संबंधी हूँ’
  rationale: ठोस इब्रानी मुहावरे को बनाए रखने से पारिवारिक एकता और अबीमेलेक की राजनीतिक अपील दोनों की शक्ति सुरक्षित रहती है। पाद-टिप्पणी अर्थ स्पष्ट करती है, बिना मुख्य पाठ में व्याख्या थोपे।
- issue: यरुब्बाल के वंशजों और एक शासक के लिए पुरुषवाचक भाषा
  choice: ‘सत्तर पुत्र’ और ‘एक ही पुरुष’
  alternative: ‘सत्तर जन’ और ‘एक ही व्यक्ति’
  rationale: संदर्भ विशिष्ट रूप से यरुब्बाल के पुत्रों और अबीमेलेक नामक पुरुष से संबंधित है; इसलिए लिंग-निरपेक्ष भाषा मूल की ऐतिहासिक विशिष्टता को धुंधला कर देगी।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और मौखिक संबोधन के अनुकूल रखी गई है। ‘अगुओं’ से नगर के प्रभावशाली नेतृत्व का भाव आता है, जबकि ‘शासन’ राजनीतिक प्रसंग को स्पष्ट करता है। मुहावरे को मुख्य पाठ में सुरक्षित रखकर उसकी व्याख्या पाद-टिप्पणी में दी गई है।
