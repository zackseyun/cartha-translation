base_translation:
  language: en
  yaml_path: translation/ot/judges/009/001.yaml
  text: Abimelech son of Jerubbaal went to Shechem[a], to his mother's brothers, and spoke to them and to the whole clan of his mother's father's house, saying,
translation:
  language: hi
  text: यरुब्बाल का पुत्र अबीमेलेक शकेम में अपनी माँ के भाइयों के पास गया। उसने उनसे और अपनी माँ के पिता के घराने के पूरे परिवार से कहा,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: गया
  rationale: कथानक को आगे बढ़ाने वाली क्रिया का स्वाभाविक हिन्दी रूप; अलग से ‘तब’ जोड़ना आवश्यक नहीं है।
- source_word: אֲבִימֶלֶךְ בֶּן יְרֻבַּעַל
  choice: यरुब्बाल का पुत्र अबीमेलेक
  rationale: दोनों व्यक्तिनामों का लिप्यंतरण करते हुए पुत्र-संबंध को स्पष्ट और स्वाभाविक हिन्दी में रखा गया है।
- source_word: שְׁכֶמָה
  choice: शकेम में
  rationale: दिशासूचक प्रत्यय शकेम की ओर जाकर वहाँ पहुँचने का भाव देता है; अगले पदबंध ‘...के पास’ के साथ हिन्दी में ‘शकेम में’ स्वाभाविक है।
- source_word: אֶל אֲחֵי אִמּוֹ
  choice: अपनी माँ के भाइयों के पास
  rationale: मूल के शाब्दिक रिश्ते ‘उसकी माँ के भाई’ को सुरक्षित रखा गया है; संदर्भ में ये उसके मामा हैं।
- source_word: וַיְדַבֵּר אֲלֵיהֶם
  choice: उसने उनसे ... कहा
  rationale: דבר का आशय बोलना है; आगामी प्रत्यक्ष कथन का परिचय देने वाले לֵאמֹר के साथ हिन्दी में ‘कहा’ सहज है।
- source_word: וְאֶל כָּל מִשְׁפַּחַת
  choice: और ... पूरे कुल से
  rationale: מִשְׁפָּחָה यहाँ विस्तृत नातेदारी-समूह को दर्शाता है; ‘कुल’ इस सामाजिक इकाई को संक्षेप और गरिमा से व्यक्त करता है।
- source_word: בֵּית אֲבִי אִמּוֹ
  choice: अपनी माँ के पिता के घराने
  rationale: मूल की मातृपक्षीय संबंध-रचना और ‘घर’ के परिवार/वंश वाले भाव को बनाए रखा गया है।
- source_word: לֵאמֹר
  choice: कहा,
  rationale: यह अगले पद में आने वाले प्रत्यक्ष कथन का परिचय देता है; अंतिम अल्पविराम वाक्य की निरंतरता दिखाता है।
