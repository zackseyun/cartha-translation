  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/תֹּ֤אמֶר לָ/הֶם֙ הַ/גֶּ֔פֶן הֶ/חֳדַ֨לְתִּי֙ אֶת תִּ֣ירוֹשִׁ֔/י הַֽ/מְשַׂמֵּ֥חַ אֱלֹהִ֖ים וַ/אֲנָשִׁ֑ים וְ/הָ֣לַכְתִּ֔י לָ/נ֖וּעַ עַל הָ/עֵצִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/013.yaml
  text: But the vine said to them[a], ‘Should I stop producing my new wine, which gladdens gods and men, and go to sway over the trees?’
translation:
  language: hi
  text: परन्तु दाखलता ने उनसे कहा, “क्या मैं अपना नया दाखमधु बनाना छोड़ दूँ, जो देवताओं और मनुष्यों को आनन्दित करता है,[a] और जाकर वृक्षों के ऊपर झूमूँ?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “जो परमेश्वर और मनुष्यों को आनन्दित करता है।”
    reason: אֱלֹהִים यहाँ रूपतः बहुवचन है, पर इसका एकवचन अर्थ ‘परमेश्वर’ भी संभव है।
lexical_decisions:
- source_word: הַגֶּפֶן
  choice: दाखलता
  rationale: यह योताम के दृष्टान्त में बोलने वाली अंगूर की बेल है। ‘दाखलता’ साहित्यिक गरिमा रखते हुए हिन्दी बाइबलीय संदर्भ में सहज और सटीक है।
- source_word: הֶחֳדַלְתִּי
  choice: क्या मैं ... बनाना छोड़ दूँ
  rationale: प्रथम पुरुष पूर्ण रूप यहाँ प्रसंगानुसार विचारात्मक आलंकारिक प्रश्न है। ‘बनाना’ जोड़ने से दाखलता और उसके दाखमधु का स्वाभाविक संबंध हिन्दी में स्पष्ट होता है।
- source_word: תִּירוֹשִׁי
  choice: अपना नया दाखमधु
  rationale: תִּירוֹשׁ सामान्य मदिरा की अपेक्षा नया या ताज़ा दाखमधु सूचित करता है; ‘दाखमधु’ कृषि-चित्र और मूल शब्द का भेद बनाए रखता है।
- source_word: הַמְשַׂמֵּחַ
  choice: जो ... आनन्दित करता है
  rationale: हिफ़ील कृदन्त का कारणवाचक अर्थ सुरक्षित रहता है और यह पूर्ववर्ती ‘नया दाखमधु’ को विशेषित करता है।
- source_word: אֱלֹהִים וַאֲנָשִׁים
  choice: देवताओं और मनुष्यों
  rationale: אֱלֹהִים रूपतः बहुवचन है और इस दृष्टान्त के काव्यात्मक, प्राचीन निकट-पूर्वी परिवेश में बहुवचन अर्थ संभवतः अधिक उपयुक्त है। पारंपरिक एकवचन अर्थ पादटिप्पणी में रखा गया है।
- source_word: לָנוּעַ עַל הָעֵצִים
  choice: वृक्षों के ऊपर झूमूँ
  rationale: נוּעַ का आगे-पीछे हिलने या झूमने का दृश्यात्मक अर्थ और वृक्षों पर अधिकार का निहित संकेत दोनों बने रहते हैं; सीधे ‘राज करूँ’ कहना मूल रूपक को समतल कर देता।
theological_decisions:
- issue: אֱלֹהִים का अर्थ—‘देवताओं’ या ‘परमेश्वर’
  choice: मुख्य पाठ में ‘देवताओं’
  alternative: ‘परमेश्वर’
  rationale: हिब्रू रूप बहुवचन है और दृष्टान्त का पारंपरिक काव्य-वाक्य दिव्य तथा मानवीय दोनों लोकों का उल्लेख कर सकता है। फिर भी אֱלֹהִים एकवचन ‘परमेश्वर’ के लिए भी प्रयुक्त होता है, इसलिए उस वास्तविक अस्पष्टता को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में स्वाभाविक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य शैली। ‘दाखलता’ और ‘दाखमधु’ दृष्टान्त की कृषि-संबंधी साहित्यिक छवि बनाए रखते हैं; ‘झूमूँ’ भौतिक गति तथा शासन के संकेत के बीच मूल तनाव को सुरक्षित रखता है।
