  text: וַ/יֵּצְא֨וּ הַ/שָּׂדֶ֜ה וַֽ/יִּבְצְר֤וּ אֶת כַּרְמֵי/הֶם֙ וַֽ/יִּדְרְכ֔וּ וַֽ/יַּעֲשׂ֖וּ הִלּוּלִ֑ים וַ/יָּבֹ֨אוּ֙ בֵּ֣ית אֱֽלֹֽהֵי/הֶ֔ם וַ/יֹּֽאכְלוּ֙ וַ/יִּשְׁתּ֔וּ וַֽ/יְקַלְל֖וּ אֶת אֲבִימֶֽלֶךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/027.yaml
  text: And they went out into the field and gathered the grapes from their vineyards and trod them[a], and they held a festival[b]. Then they went into the house of their god and ate and drank and cursed Abimelek.
translation:
  language: hi
  text: वे खेतों में गए, अपने अंगूर के बागों से अंगूर तोड़े और उन्हें रौंदा। फिर उन्होंने अंगूर की फसल का उत्सव मनाया[a]। इसके बाद वे अपने देवता के घर[b] में गए, खाया-पिया और अबीमेलेक को शाप दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उन्होंने उत्सव मनाया” अथवा “उन्होंने आनंद मनाया।” इब्रानी शब्द उत्सवी उल्लास को दर्शाता है, जो सम्भवतः अंगूर की फसल से जुड़ा था।
    reason: lexical_alternative
  - marker: b
    text: या, “अपने देवताओं के घर।” इब्रानी रूप को बहुवचन भी समझा जा सकता है, यद्यपि यहाँ वह सम्भवतः उस पूजा-स्थान में पूजे जाने वाले एक देवता को दर्शाता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּצְאוּ הַשָּׂדֶה
  choice: वे खेतों में गए
  rationale: दिशासूचक रूप खेत या खुले स्थान की ओर जाने का भाव देता है। ‘खेतों में गए’ आधुनिक हिन्दी में स्वाभाविक है और नगर से बाहर जाने के संदर्भ के अनुकूल है।
- source_word: וַיִּבְצְרוּ אֶת כַּרְמֵיהֶם
  choice: अपने अंगूर के बागों से अंगूर तोड़े
  rationale: בצר दाख की फसल के संदर्भ में विशेष रूप से अंगूर तोड़ने या बटोरने को दर्शाता है; हिन्दी में वस्तु को स्पष्ट करना स्वाभाविक है।
- source_word: וַיִּדְרְכוּ
  choice: उन्हें रौंदा
  rationale: यहाँ דרך रस निकालने के लिए अंगूरों को पैरों से रौंदने का ठोस चित्र देता है। सर्वनाम पहले उल्लिखित अंगूरों से स्पष्ट रूप से जुड़ता है।
- source_word: וַיַּעֲשׂוּ הִלּוּלִים
  choice: फसल का उत्सव मनाया
  rationale: הִלּוּלִים यहाँ अंगूर की फसल से जुड़ी उत्सवी प्रसन्नता को सूचित करता है। ‘फसल का उत्सव’ संदर्भ स्पष्ट करता है, जबकि पादटिप्पणी व्यापक अर्थ की संभावना सुरक्षित रखती है।
- source_word: בֵּית אֱלֹהֵיהֶם
  choice: अपने देवता के भवन
  rationale: ‘भवन’ मूल ‘घर’ के रूपक के निकट रहते हुए पूजा-स्थान के अर्थ में समझने योग्य है। אֱלֹהֵיהֶם का यहाँ एक देवता के लिए एकवचन अर्थ संभव और संदर्भानुकूल है।
- source_word: וַיֹּאכְלוּ וַיִּשְׁתּוּ
  choice: खाया-पिया
  rationale: यह संक्षिप्त और स्वाभाविक हिन्दी मूल की सीधी क्रियात्मक जोड़ी को बनाए रखती है।
- source_word: וַיְקַלְלוּ אֶת אֲבִימֶלֶךְ
  choice: अबीमेलेक को शाप दिया
  rationale: पिएल रूप यहाँ केवल निंदा नहीं, बल्कि शाप देने का प्रबल अर्थ रखता है।
theological_decisions:
- issue: मूर्तिपूजक संदर्भ में אֱלֹהֵיהֶם का वचन
  choice: अपने देवता
  alternative: अपने देवताओं
  rationale: रूप व्याकरणतः बहुवचन भी समझा जा सकता है, पर कथा में किसी विशिष्ट पूजा-स्थान के देवता का एकवचन अर्थ अधिक संभावित है। पादटिप्पणी वास्तविक भाषिक संभावना को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण कथात्मक शैली रखी गई है। ‘अंगूर के बाग’ सामान्य पाठक के लिए स्पष्ट है; ‘रौंदा’ प्राचीन अंगूर-रस निष्कर्षण का ठोस चित्र बनाए रखता है। ‘देवता के भवन’ मूल की संरचना के निकट है और ‘मंदिर’ जैसी अतिरिक्त व्याख्यात्मक विशिष्टता से बचता है।
