translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। गाल की तिरस्कारपूर्ण चुनौती, राजनीतिक ‘सेवा’ का भाव और शकेम की सम्भावित लाक्षणिकता सुरक्षित रखी गई है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
