source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר גַּ֣עַל בֶּן עֶ֗בֶד מִֽי אֲבִימֶ֤לֶךְ וּ/מִֽי שְׁכֶם֙ כִּ֣י נַעַבְדֶ֔/נּוּ הֲ/לֹ֥א בֶן יְרֻבַּ֖עַל וּ/זְבֻ֣ל פְּקִיד֑/וֹ עִבְד֗וּ אֶת אַנְשֵׁ֤י חֲמוֹר֙ אֲבִ֣י שְׁכֶ֔ם וּ/מַדּ֖וּעַ נַעַבְדֶ֥/נּוּ אֲנָֽחְנוּ׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/028.yaml
  text: And Gaal son of Ebed said[a], “Who is Abimelek, and who is Shechem, that we should serve him? Is he not the son of Jerubbaal, and Zebul his officer? Serve the men of Hamor[c][b], the father of Shechem! But why should we serve him?”
translation:
  language: hi
  text: और एबेद के पुत्र गाल ने कहा, “अबीमेलेक कौन है, और शकेम कौन है[a], कि हम उसकी सेवा करें? क्या वह यरुब्बाल का पुत्र नहीं, और जबूल उसका अधिकारी[b] नहीं है? शकेम के पिता हमोर के लोगों की सेवा करो[c]! फिर हम उसकी सेवा क्यों करें?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अबीमेलेक कौन है, और शकेम क्या है...?” इब्रानी में ‘शकेम’ नाम सीधे आया है; सम्भवतः इससे नगर या उसका शासक समुदाय अभिप्रेत है।
    reason: lexical_alternative
  - marker: b
    text: “अधिकारी” का अनुवाद “प्रतिनिधि” या “नियुक्त पदाधिकारी” भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: अर्थात हमोर के वंशज या उससे जुड़े लोग। हमोर को शकेम का पिता कहा गया है; उत्पत्ति 34 देखें।
    reason: cross_reference
lexical_decisions:
- source_word: מִי אֲבִימֶלֶךְ וּמִי שְׁכֶם
  choice: अबीमेलेक कौन है, और शकेम कौन है
  rationale: दोनों प्रश्नवाचक पदों की समानांतर, तिरस्कारपूर्ण शैली बनाए रखी गई है। ‘शकेम’ नगर या उसके शासक समुदाय के लिए लक्षणा हो सकता है, पर मूल पाठ सीधे नाम ही लेता है।
- source_word: כִּי נַעַבְדֶנּוּ
  choice: कि हम उसकी सेवा करें
  rationale: यहाँ עבד राजनीतिक अधीनता या निष्ठापूर्ण सेवा व्यक्त करता है; ‘सेवा करें’ अर्थ को स्वाभाविक रखते हुए मूल की संक्षिप्तता बचाता है।
- source_word: הֲלֹא בֶן יְרֻבַּעַל
  choice: क्या वह यरुब्बाल का पुत्र नहीं
  rationale: הֲלֹא सहमति की अपेक्षा रखने वाला आलंकारिक प्रश्न है; हिन्दी में ‘क्या ... नहीं’ वही बल देता है।
- source_word: פְּקִידוֹ
  choice: उसका अधिकारी
  rationale: פָּקִיד किसी नियुक्त अधीनस्थ पदाधिकारी को सूचित करता है। ‘अधिकारी’ पद का अनावश्यक विशेषीकरण किए बिना जबूल की भूमिका व्यक्त करता है।
- source_word: עִבְדוּ
  choice: सेवा करो
  rationale: मूल का पुरुष बहुवचन आदेश तीखा और सीधा है; हिन्दी में यही आज्ञार्थक रूप उपयुक्त है।
- source_word: אַנְשֵׁי חֲמוֹר אֲבִי שְׁכֶם
  choice: हमोर के लोगों की सेवा करो—उस हमोर की, जो शकेम का पिता था
  rationale: אַנְשֵׁי का अर्थ हमोर से जुड़े लोग या वंशज हो सकता है। ‘लोग’ हिन्दी में स्वाभाविक है और वंशीय-सामुदायिक संकेत को खुला रखता है।
- source_word: וּמַדּוּעַ נַעַבְדֶנּוּ אֲנָחְנוּ
  choice: फिर हम उसकी सेवा क्यों करें
  rationale: ‘फिर’ तर्क के चरम पर उठाई गई चुनौती को व्यक्त करता है; स्पष्ट אֲנָחְנוּ का बल ‘हम’ से बना रहता है।
