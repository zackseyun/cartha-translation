source:
  edition: WLC
  text: וַ/יֵּ֣צֵא גַ֔עַל לִ/פְנֵ֖י בַּעֲלֵ֣י שְׁכֶ֑ם וַ/יִּלָּ֖חֶם בַּ/אֲבִימֶֽלֶךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/039.yaml
  text: So Gaal went out before the leaders of Shechem and fought against Abimelech[a].
translation:
  language: hi
  text: तब गाल शकेम के अगुओं के आगे निकल गया[a] और अबीमेलेक से लड़ा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “शकेम के अगुओं का नेतृत्व करते हुए।”
    reason: לִפְנֵי का मूल अर्थ ‘आगे/सामने’ है, पर इस सैनिक प्रसंग में यह नेतृत्व अथवा दल के अग्रभाग में होने का भाव भी व्यक्त कर सकता है।
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: निकल गया
  rationale: יצא का सामान्य कथात्मक अर्थ बाहर जाना या निकलना है; प्रसंग में गाल का नगर से युद्ध के लिए निकलना अभिप्रेत है।
- source_word: גַעַל
  choice: गाल
  rationale: व्यक्तिवाचक नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: לִפְנֵי
  choice: के आगे
  rationale: शाब्दिक स्थानगत अर्थ ‘के सामने/आगे’ को बनाए रखता है और इस सैनिक प्रसंग में दल के अग्रभाग में होने या नेतृत्व करने की सम्भावना खुली रखता है।
- source_word: בַּעֲלֵי שְׁכֶם
  choice: शकेम के अगुओं
  rationale: यह पद नगर के प्रभावशाली अथवा शासकीय पुरुषों को सूचित करता है; ‘अगुए’ आधुनिक पाठक के लिए स्वाभाविक है और केवल सामान्य निवासियों का अर्थ नहीं देता।
- source_word: וַיִּלָּחֶם
  choice: लड़ा
  rationale: לחם के निफ़अल रूप का यहाँ सीधा अर्थ युद्ध करना या लड़ना है।
- source_word: בַּאֲבִימֶלֶךְ
  choice: अबीमेलेक से
  rationale: לחם के साथ ב प्रतिद्वंद्वी को चिह्नित करता है; हिन्दी में ‘से लड़ा’ स्पष्ट और स्वाभाविक है।
theological_decisions: []
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण कथात्मक हिन्दी। ‘के आगे’ मूल की स्थानगत अभिव्यक्ति और उसकी नेतृत्व-संबंधी सम्भावना दोनों को सुरक्षित रखता है; वैकल्पिक अर्थ पाद-टिप्पणी में दिया गया है।
