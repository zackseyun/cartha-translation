base_translation:
  language: en
  yaml_path: translation/ot/judges/009/004.yaml
  text: And they gave him seventy pieces of silver from the house of Baal-berith[a], and with them Abimelek hired worthless and reckless men[c][b], and they followed him.
translation:
  language: hi
  text: तब उन्होंने बाल-बरीत के भवन[a] से उसे चाँदी के सत्तर टुकड़े[b] दिए। उस चाँदी से अबीमेलेक ने निकम्मे और उच्छृंखल लोगों[c] को भाड़े पर रखा, और वे उसके पीछे हो लिए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बाल-बरीत के मंदिर से।” इब्रानी में “घर” है, जो उपासना के संदर्भ में मंदिर या देवस्थान को दर्शा सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “चाँदी के सत्तर शेकेल।” इब्रानी में शाब्दिक रूप से “सत्तर चाँदी” है; यह तौल के अनुसार बताई गई धनराशि थी।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से “खाली और उच्छृंखल लोग।”
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁבְעִים כֶּסֶף
  choice: चाँदी के सत्तर टुकड़े
  rationale: इब्रानी में शाब्दिक रूप से ‘सत्तर चाँदी’ है और आशय तौल के अनुसार दी गई धनराशि से है। ‘टुकड़े’ स्वाभाविक हिंदी है और मूल में स्पष्ट न होने के कारण ‘शेकेल’ को मुख्य पाठ में नहीं जोड़ता।
- source_word: מִבֵּית בַּעַל בְּרִית
  choice: बाल-बरीत के भवन से
  rationale: בַּיִת का मूल अर्थ ‘घर/भवन’ है और उपासना-संदर्भ में यह मंदिर भी हो सकता है। ‘भवन’ मूल बिंब और संदर्भगत अस्पष्टता दोनों बनाए रखता है; बाल-बरीत को व्यक्तिवाचक नाम के रूप में लिप्यंतरित किया गया है।
- source_word: וַיִּשְׂכֹּר בָּהֶם
  choice: उनसे ... भाड़े पर रखा
  rationale: בָּהֶם पहले उल्लिखित चाँदी को साधन के रूप में दर्शाता है। हिंदी में ‘उनसे’ धन के उन्हीं टुकड़ों की ओर स्वाभाविक रूप से संकेत करता है।
- source_word: אֲנָשִׁים רֵיקִים
  choice: निकम्मे लोग
  rationale: רֵיקִים का शाब्दिक अर्थ ‘खाली’ है, पर यहाँ यह सामाजिक और नैतिक रूप से किसी काम के न होने का भाव देता है। ‘निकम्मे’ वर्तमान हिंदी में इस निंदात्मक अर्थ को सहजता से व्यक्त करता है।
- source_word: וּפֹחֲזִים
  choice: उतावले
  rationale: यह शब्द असंयमी, जल्दबाज़ और अविश्वसनीय व्यवहार का संकेत देता है। ‘उतावले’ मूल की आवेगशीलता को दर्शाता है और ‘निकम्मे’ के साथ स्वाभाविक लगता है।
- source_word: וַיֵּלְכוּ אַחֲרָיו
  choice: वे उसके पीछे हो लिए
  rationale: शाब्दिक अर्थ ‘वे उसके पीछे चले’ है; संदर्भ में इसका अर्थ उसके अनुयायी या साथी बनना है। ‘पीछे हो लिए’ दोनों भावों को स्वाभाविक हिंदी में बनाए रखता है।
