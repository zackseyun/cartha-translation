  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण कथात्मक शैली रखी गई है। ‘भवन’ से मूल की शब्द-छवि और मंदिर होने की संभावित व्याख्या सुरक्षित है; ‘भाड़े पर रखा’ सामान्य पाठक के लिए स्पष्ट है। सभी वैकल्पिक अर्थ पादटिप्पणियों में दिए गए हैं।
