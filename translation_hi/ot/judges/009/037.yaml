source:
  edition: WLC
  text: וַ/יֹּ֨סֶף ע֣וֹד גַּעַל֮ לְ/דַבֵּר֒ וַ/יֹּ֕אמֶר הִנֵּה עָם֙ יֽוֹרְדִ֔ים מֵ/עִ֖ם טַבּ֣וּר הָ/אָ֑רֶץ וְ/רֹאשׁ אֶחָ֣ד בָּ֔א מִ/דֶּ֖רֶךְ אֵל֥וֹן מְעוֹנְנִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/037.yaml
  text: Gaal spoke again and said[a], “Look, people are coming down from the center of the land[b], and one company is coming by the way of the Oak of the Soothsayers.”
translation:
  language: hi
  text: गाल ने फिर कहा, “देखो, लोग देश के बीचोंबीच[a] से नीचे उतर रहे हैं, और एक दल शकुन बतानेवालों के बलूत के पेड़[b] के मार्ग से आ रहा है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से “देश की नाभि”; अर्थात देश का मध्य भाग।
    reason: lexical_alternative
  - marker: b
    text: या “शकुन बतानेवालों का तारपीन वृक्ष”; अथवा इसे स्थान-नाम मानकर “मओननीम का बलूत का पेड़”। वृक्ष की ठीक जाति और अंतिम नाम का अर्थ अनिश्चित है; यह शकुन या भविष्य बतानेवालों की ओर संकेत कर सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּסֶף עוֹד גַּעַל לְדַבֵּר וַיֹּאמֶר
  choice: गाल ने फिर कहा
  rationale: शाब्दिक ‘फिर और बोलना जोड़ा’ हिब्रू मुहावरा है; आधुनिक हिन्दी में ‘फिर कहा’ पुनः बोलने का भाव स्वाभाविक और संक्षिप्त रूप से व्यक्त करता है।
- source_word: הִנֵּה
  choice: देखो
  rationale: यह ध्यान आकर्षित करने वाला संकेतक है; ‘देखो’ दृश्य स्थिति और तात्कालिकता बनाए रखता है।
- source_word: עָם יֹרְדִים
  choice: लोग ... नीचे उतर रहे हैं
  rationale: עָם को व्यापक अर्थ में ‘लोग’ रखा गया है, न कि संदर्भ से अनुमानित ‘सैनिक’; बहुवचन कृदंत गतिशील समूह और जारी क्रिया को दर्शाता है।
- source_word: מֵעִם טַבּוּר הָאָרֶץ
  choice: देश के बीचोंबीच से
  rationale: טַבּוּר का शाब्दिक अर्थ ‘नाभि’ है, पर भौगोलिक प्रयोग में केंद्रीय भाग सूचित होता है; ‘बीचोंबीच’ आधुनिक हिन्दी में अर्थ स्पष्ट करता है और शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
- source_word: וְרֹאשׁ אֶחָד
  choice: और एक दल
  rationale: רֹאשׁ का मूल अर्थ ‘सिर’ है, किंतु यहाँ आगे आते जनसमूह के एक अलग हिस्से या टुकड़ी का बोध देता है; ‘दल’ सैन्य अर्थ को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: מִדֶּרֶךְ
  choice: के मार्ग से
  rationale: वाक्यांश आने की दिशा अथवा रास्ता बताता है; ‘के मार्ग से’ दोनों पहलुओं को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אֵלוֹן מְעוֹנְנִים
  choice: भावी बतानेवालों के बांज वृक्ष
  rationale: אֵלוֹן को परंपरागत वृक्ष-संज्ञा ‘बांज वृक्ष’ से और מְעוֹנְנִים को शकुन अथवा भविष्य बताने वालों से संबंधित अर्थ में अनूदित किया गया है; वृक्ष की जाति और स्थान-नाम की व्याख्या दोनों अनिश्चित हैं, इसलिए विकल्प पादटिप्पणी में दिए गए हैं।
