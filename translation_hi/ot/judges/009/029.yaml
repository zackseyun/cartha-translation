source:
  edition: WLC
  text: וּ/מִ֨י יִתֵּ֜ן אֶת הָ/עָ֤ם הַ/זֶּה֙ בְּ/יָדִ֔/י וְ/אָסִ֖ירָה אֶת אֲבִימֶ֑לֶךְ וַ/יֹּ֨אמֶר֙ לַ/אֲבִימֶ֔לֶךְ רַבֶּ֥ה צְבָאֲ/ךָ֖ וָ/צֵֽאָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/029.yaml
  text: If only this people were in my hand[a], then I would remove Abimelek. And he said to Abimelek[b], “Increase your army and come out!”
translation:
  language: hi
  text: काश, ये लोग मेरे हाथ में होते![a] तब मैं अबीमेलेक को हटा देता। फिर उसने अबीमेलेक से कहा,[b] “अपनी सेना बढ़ा और निकल आ!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप में: “कौन इन लोगों को मेरे हाथ में देगा? तब मैं अबीमेलेक को हटा देता।” इब्रानी में “कौन देगा...?” इच्छा व्यक्त करने वाला मुहावरा है।'
    reason: lexical_alternative
  - marker: b
    text: “अपनी सेना बढ़ा और निकल आ” अबीमेलेक को दी गई चुनौती या ताना जान पड़ता है; यह सीधे उससे कहा गया हो सकता है या उसे संबोधित करके अलंकारिक रूप से बोला गया हो सकता है।
    reason: cultural_note
lexical_decisions:
- source_word: וּמִי יִתֵּן
  choice: काश
  rationale: यह इब्रानी मुहावरा शाब्दिक प्रश्न नहीं, बल्कि प्रबल इच्छा व्यक्त करता है; आधुनिक हिन्दी में “काश” इसका स्वाभाविक रूप है।
- source_word: הָעָם הַזֶּה
  choice: ये लोग
  rationale: यह सामूहिक जनसमुदाय को सूचित करता है। हिन्दी में “ये लोग” स्वाभाविक है और इसे अनावश्यक रूप से केवल सेना तक सीमित नहीं करता।
- source_word: בְּיָדִי
  choice: मेरे हाथ में
  rationale: मूल रूपक को बनाए रखते हुए अधिकार या नियंत्रण का भाव व्यक्त करता है और हिन्दी में समझने योग्य है।
- source_word: וְאָסִירָה
  choice: मैं ... हटा देता
  rationale: हिफ़ील रूप का व्यापक अर्थ हटाना है; यह हत्या, निष्कासन या पदच्युति में से किसी एक को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: וַיֹּאמֶר לַאֲבִימֶלֶךְ
  choice: फिर उसने अबीमेलेक से कहा
  rationale: ל को सामान्यतः संबोधित व्यक्ति के चिह्न के रूप में लिया गया है। प्रसंग में यह सीधी अथवा अलंकारिक चुनौती हो सकती है।
- source_word: רַבֶּה צְבָאֲךָ
  choice: अपनी सेना बढ़ा
  rationale: רבה का आज्ञार्थक रूप संख्या या सामर्थ्य बढ़ाने का निर्देश देता है और צבא यहाँ सैन्य बल को सूचित करता है।
- source_word: וָצֵאָה
  choice: और निकल आ
  rationale: प्रतिद्वंद्वी को दी गई चुनौती में יצא का यह स्वाभाविक हिन्दी रूप है।
