  text: וַ/יָּבֹ֞א גַּ֤עַל בֶּן עֶ֨בֶד֙ וְ/אֶחָ֔י/ו וַ/יַּעַבְר֖וּ בִּ/שְׁכֶ֑ם וַ/יִּבְטְחוּ ב֖/וֹ בַּעֲלֵ֥י שְׁכֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/026.yaml
  text: Then Gaal son of Ebed came with his brothers and crossed into Shechem[c][b][a], and the leaders of Shechem put their trust in him.
translation:
  language: hi
  text: तब एबेद का पुत्र गाल और उसके भाई आए और शकेम में होकर गए[a]; और शकेम के अगुवों[b] ने उस पर भरोसा किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “शकेम में प्रवेश किया” अथवा “शकेम में पार गए”; इब्रानी क्रिया का अर्थ पार जाना या होकर जाना हो सकता है, और यहाँ गति का ठीक आशय निश्चित नहीं है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से “शकेम के स्वामी”; आशय नगर के प्रमुख या सत्ता-धारी पुरुषों से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: तब ... आया
  rationale: वाव-क्रमवाचक कथा को आगे बढ़ाता है; आधुनिक हिन्दी में ‘तब’ इस क्रम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: גַּעַל בֶּן עֶבֶד
  choice: एबेद का पुत्र गाल
  rationale: व्यक्तिनामों का लिप्यंतरण और पितृनाम-संबंध का स्पष्ट, स्वाभाविक हिन्दी रूप।
- source_word: וְאֶחָיו
  choice: अपने भाइयों के साथ
  rationale: मूल में साधारण संयोजक ‘और’ है, पर בוא के साथ यहाँ सहभागिता का भाव है; हिन्दी में ‘के साथ’ अधिक स्वाभाविक है।
- source_word: וַיַּעַבְרוּ בִּשְׁכֶם
  choice: शकेम में जा पहुँचा
  rationale: עבר में पार जाने या होकर जाने की गति निहित है। इस संदर्भ में नगर में प्रवेश का स्वाभाविक हिन्दी बोध दिया गया है, जबकि सटीक गति की अस्पष्टता पादटिप्पणी में सुरक्षित है। संयुक्त कर्ता के बावजूद हिन्दी में निकट मुख्य पात्र ‘गाल’ के अनुसार एकवचन क्रिया स्वाभाविक है।
- source_word: וַיִּבְטְחוּ בוֹ
  choice: उस पर भरोसा किया
  rationale: בטח בְ किसी व्यक्ति पर विश्वास या निर्भरता व्यक्त करता है; ‘उस पर भरोसा किया’ वर्तमान हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: בַּעֲלֵי שְׁכֶם
  choice: शकेम के अगुओं
  rationale: यह पद सामान्य निवासियों के बजाय नगर के प्रभावशाली पुरुषों या सत्ता-धारकों को सूचित करता है; ‘अगुए’ अर्थ और गरिमा दोनों रखता है।
