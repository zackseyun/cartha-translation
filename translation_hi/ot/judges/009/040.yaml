  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, कथात्मक युद्ध-वर्णन। ‘मारे गए लोग ... गिरते गए’ में इब्रानी की कुछ कठोर किंतु सजीव युद्ध-भाषा जानबूझकर बनाए रखी गई है; अनावश्यक व्याख्यात्मक विस्तार नहीं जोड़ा गया।
