  yaml_path: translation/ot/judges/009/040.yaml
  text: Abimelech pursued him[a], and he fled before him; and many slain fell as far as the entrance of the gate.
translation:
  language: hi
  text: अबीमेलेक ने उसका पीछा किया, और वह उसके सामने से भागा; और बहुत-से मारे गए लोग फाटक के प्रवेश तक गिर पड़े।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּרְדְּפֵהוּ
  choice: उसका पीछा किया
  rationale: רדף शत्रु का पीछा करने को दर्शाता है; यह स्वाभाविक हिन्दी में सैन्य संदर्भ को स्पष्ट रखता है।
- source_word: וַיָּנָס
  choice: वह ... भागा
  rationale: נוס का सीधा अर्थ भागना या पलायन करना है; एकवचन कर्ता पिछले संदर्भ के गाल की ओर संकेत करता है।
- source_word: מִפָּנָיו
  choice: उसके सामने से
  rationale: शाब्दिक रूप से ‘उसके मुख/उपस्थिति से’; पीछा किए जाने के प्रसंग में ‘उसके सामने से’ मूल मुहावरे के निकट है।
- source_word: וַיִּפְּלוּ חֲלָלִים רַבִּים
  choice: बहुत-से मारे गए लोग ... गिरते गए
  rationale: नפל की ‘गिरने’ वाली सजीव छवि और חללים का युद्ध में मारे या घात किए गए लोगों का अर्थ दोनों सुरक्षित रहते हैं। हिन्दी में ‘गिरते गए’ फाटक तक फैली पीछा-युद्ध की क्रमिक घटना को स्वाभाविक रूप से व्यक्त करता है।
- source_word: עַד פֶּתַח הַשָּׁעַר
  choice: फाटक के प्रवेश तक
  rationale: פתח ‘प्रवेश/खुला स्थान’ और שער ‘फाटक’ है; यह अनुवाद दोनों शब्दों को स्पष्ट और संक्षिप्त रूप में रखता है।
