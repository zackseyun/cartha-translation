  yaml_path: translation/ot/judges/009/042.yaml
  text: And it happened on the next day that the people went out into the field[a], and it was reported to Abimelek.
translation:
  language: hi
  text: अगले दिन ऐसा हुआ कि लोग मैदान में निकल गए, और अबीमेलेक को इसकी सूचना दी गई।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: ऐसा हुआ
  rationale: यह कथात्मक क्रम में अगली घटना का परिचय देता है; ‘ऐसा हुआ’ आधुनिक और स्वाभाविक हिन्दी में इसके घटनात्मक भाव को बनाए रखता है।
- source_word: מִמָּחֳרָת
  choice: अगले दिन
  rationale: यह समय-सूचक पद ठीक अगले दिन को दर्शाता है; ‘अगले दिन’ सरल और सटीक हिन्दी है।
- source_word: וַיֵּצֵא
  choice: निकल गए
  rationale: יצא का सामान्य अर्थ बाहर जाना या निकलना है; नगर से खुले मैदान की ओर जाने के प्रसंग में ‘निकल गए’ स्वाभाविक है।
- source_word: הָעָם
  choice: लोग
  rationale: עם यहाँ सामूहिक रूप से जनसमूह को सूचित करता है, केवल पुरुषों को नहीं; इसलिए ‘लोग’ उपयुक्त है।
- source_word: הַשָּׂדֶה
  choice: मैदान में
  rationale: שׂדה नगर के बाहर के खुले या खेती वाले क्षेत्र को सूचित करता है; एकवचन और स्थानीय अर्थ को ‘मैदान में’ सहज रूप से व्यक्त करता है।
- source_word: וַיַּגִּדוּ
  choice: इसकी सूचना दी गई
  rationale: इब्रानी में अनिश्चित कर्ता के साथ तृतीय पुरुष बहुवचन है, अर्थात किसी ने अबीमेलेक को बताया; हिन्दी में कर्मवाच्य इस अनिश्चित कर्ता को स्वाभाविक रूप से सुरक्षित रखता है।
- source_word: לַאֲבִימֶלֶךְ
  choice: अबीमेलेक को
  rationale: व्यक्तिवाचक नाम को हिन्दी ध्वन्यात्मक रूप में रखा गया है और לְ के संप्रदान अर्थ को ‘को’ से व्यक्त किया गया है।
