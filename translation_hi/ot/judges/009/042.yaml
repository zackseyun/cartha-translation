  register: भाषा आधुनिक मानक हिन्दी में, सरल किंतु गरिमापूर्ण कथात्मक शैली में रखी गई है। इब्रानी के अनिश्चित बहुवचन कर्ता को किसी निश्चित सूचनादाता में बदले बिना हिन्दी कर्मवाच्य द्वारा व्यक्त किया गया है।
