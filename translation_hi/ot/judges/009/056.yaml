  yaml_path: translation/ot/judges/009/056.yaml
  text: Thus God repaid Abimelech for the evil that he had done to his father by killing his seventy brothers[a].
translation:
  language: hi
  text: इस प्रकार परमेश्वर ने अबीमेलेक की उस बुराई का फल उसी को भुगताया, जो उसने अपने पिता के विरुद्ध अपने सत्तर भाइयों की हत्या करके की थी।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “परमेश्वर ने अबीमेलेक की बुराई उसी पर लौटा दी।” इब्रानी मुहावरे का अर्थ है कि परमेश्वर ने उसके बुरे कर्म का फल उसी को भुगताया।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׁב
  choice: बदला उसे दिया
  rationale: हिफ़ील रूप यहाँ किसी की बुराई को उसी पर लौटा देने, अर्थात उसके कर्म का प्रतिफल देने का भाव रखता है। यह हिंदी प्रयोग न्यायिक प्रतिफल को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: क्रिया एकवचन है और संदर्भ इस्राएल के एक परमेश्वर को न्याय करते हुए प्रस्तुत करता है।
- source_word: רָעַת
  choice: बुराई
  rationale: यह शब्द यहाँ केवल हानि नहीं, बल्कि अबीमेलेक के नैतिक रूप से बुरे कर्म को सूचित करता है।
- source_word: אֲבִימֶלֶךְ
  choice: अबीमेलेक
  rationale: व्यक्तिनाम का प्रचलित हिंदी लिप्यंतरण रखा गया है।
- source_word: אֲשֶׁר עָשָׂה
  choice: जो उसने ... की थी
  rationale: यह संबंधवाचक उपवाक्य पहले किए गए अपराध की ओर लौटकर संकेत करता है और हिंदी में स्वाभाविक है।
- source_word: לְאָבִיו
  choice: अपने पिता के विरुद्ध
  rationale: ל यहाँ उस व्यक्ति को चिह्नित करता है जिसके विरुद्ध अपराध हुआ; हत्या पुत्रों की हुई, इसलिए केवल ‘पिता के साथ’ की अपेक्षा ‘पिता के विरुद्ध’ अर्थ को अधिक स्पष्ट करता है।
- source_word: לַהֲרֹג
  choice: हत्या करके
  rationale: सप्रयोजन क्रियार्थक रूप उस बुराई की विषयवस्तु अथवा रीति बताता है; प्रसंग में जानबूझकर मार डालने के लिए ‘हत्या’ उपयुक्त है।
- source_word: שִׁבְעִים אֶחָיו
  choice: अपने सत्तर भाइयों
  rationale: मूल की संख्या और पारिवारिक संबंध दोनों सीधे सुरक्षित रखे गए हैं।
- source_word: וַ
  choice: इस प्रकार
  rationale: साधारण संयोजक यहाँ कथा के निष्कर्ष और परिणाम का परिचय देता है।
theological_decisions:
- issue: न्याय में परमेश्वर की सक्रिय भूमिका
  choice: परमेश्वर ने अबीमेलेक की बुराई का बदला उसे दिया
  alternative: परमेश्वर ने अबीमेलेक की बुराई उसी पर लौट आने दी
  rationale: मूल पाठ परमेश्वर को सकर्मक क्रिया का स्पष्ट कर्ता बनाता है। इसलिए दैवी न्याय की सक्रिय भूमिका को अनुमति मात्र में नरम नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘बदला ... दिया’ सामान्य हिंदी में न्यायोचित प्रतिफल को स्पष्ट करता है; पादटिप्पणी मूल इब्रानी के ‘बुराई लौटा देने’ वाले चित्र को सुरक्षित रखती है।
