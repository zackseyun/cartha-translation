  text: וַ/יֵּצֵא֙ גַּ֣עַל בֶּן עֶ֔בֶד וַ/יַּעֲמֹ֕ד פֶּ֖תַח שַׁ֣עַר הָ/עִ֑יר וַ/יָּ֧קָם אֲבִימֶ֛לֶךְ וְ/הָ/עָ֥ם אֲשֶׁר אִתּ֖/וֹ מִן הַ/מַּאְרָֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/035.yaml
  text: Then Gaal son of Ebed went out and stood at the entrance of the city gate[b][a], and Abimelech and the people who were with him rose from the ambush.
translation:
  language: hi
  text: तब एबेद का पुत्र गाल बाहर निकला[a] और नगर के फाटक के प्रवेश पर खड़ा हो गया। तब अबीमेलेक और उसके साथ के लोग घात से[b] उठ खड़े हुए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बाहर आया।” हिब्रू क्रिया केवल बाहर की ओर गति को सूचित करती है।
    reason: lexical_alternative
  - marker: b
    text: या “घात लगाने की जगह से।” हिब्रू संज्ञा घात अथवा घात लगाने की जगह—दोनों को सूचित कर सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: बाहर निकला
  rationale: יצא बाहर की ओर गति को व्यक्त करता है। ‘बाहर निकला’ स्वाभाविक हिन्दी है और आरंभ-बिंदु के बारे में अनावश्यक अनुमान नहीं लगाता।
- source_word: גַּעַל בֶּן עֶבֶד
  choice: एबेद का पुत्र गाल
  rationale: हिब्रू वंशसूचक रचना को स्वाभाविक और गरिमापूर्ण हिन्दी में रखा गया है तथा नामों का लिप्यंतरण किया गया है।
- source_word: וַיַּעֲמֹד
  choice: खड़ा हो गया
  rationale: עמד का सामान्य अर्थ खड़ा होना है। यह अनुवाद मूल में स्पष्ट न किए गए सैनिक भाव को नहीं जोड़ता।
- source_word: פֶּתַח שַׁעַר הָעִיר
  choice: नगर के फाटक के प्रवेश-द्वार पर
  rationale: פתח ‘खुला स्थान/प्रवेश’ और שער העיר ‘नगर का फाटक’ है। यह पदबंध दोनों के संबंध को स्पष्ट रखते हुए हिन्दी में स्थान को स्वाभाविक ढंग से बताता है।
- source_word: וַיָּקָם
  choice: उठ खड़े हुए
  rationale: קום यहाँ छिपे हुए लोगों के उठकर कार्रवाई आरंभ करने को बताता है। ‘उठ खड़े हुए’ मूल क्रिया की कथात्मक शक्ति बनाए रखता है।
- source_word: וְהָעָם אֲשֶׁר אִתּוֹ
  choice: उसके साथ के लोग
  rationale: עם का मूल अर्थ ‘लोग’ है। सैनिक प्रसंग के बावजूद ‘सैनिक’ जोड़ने के बजाय व्यापक मूल शब्द को बनाए रखा गया है।
- source_word: מִן הַמַּאְרָב
  choice: घात से
  rationale: מארב घात अथवा घात लगाने की जगह को सूचित कर सकता है। मुख्य पाठ में संक्षिप्त और स्वाभाविक ‘घात से’ रखा गया है, जबकि स्थान-संबंधी अर्थ पादटिप्पणी में दिया गया है।
