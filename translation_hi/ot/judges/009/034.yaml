translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘घात लगाकर बैठ गए’ सामान्य पाठक के लिए सैन्य आशय स्पष्ट करता है, जबकि ‘लोग’ मूल के व्यापक शब्द को सुरक्षित रखता है। पाद-टिप्पणी का चिह्न उसी पद के बाद रखा गया है जिसकी वह व्याख्या करती है।
