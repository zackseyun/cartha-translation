id: JDG.9.34
reference: Judges 9:34
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יָּ֧קָם אֲבִימֶ֛לֶךְ וְ/כָל הָ/עָ֥ם אֲשֶׁר עִמּ֖/וֹ לָ֑יְלָה וַ/יֶּאֶרְב֣וּ עַל שְׁכֶ֔ם אַרְבָּעָ֖ה רָאשִֽׁים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/034.yaml
  text: So Abimelech and all the people who were with him got up by night[a], and they lay in ambush against Shechem in four companies.
translation:
  language: hi
  text: तब अबीमेलेक और उसके साथ के सब लोग रात को उठे और शकेम के विरुद्ध चार दलों[a] में घात लगाकर बैठ गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से ‘चार सिर’; यहाँ इसका अर्थ चार दल या टुकड़ियाँ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: उठे
  rationale: קום का कथात्मक रूप यहाँ उठकर कार्रवाई आरम्भ करने को दर्शाता है; ‘उठे’ मूल की ठोस अभिव्यक्ति को बनाए रखता है।
- source_word: לָיְלָה
  choice: रात को
  rationale: यह समय बताने वाला क्रियाविशेषणीय प्रयोग है; ‘रात को’ स्वाभाविक आधुनिक हिन्दी है और कार्रवाई के रात में होने को व्यक्त करता है।
- source_word: וַיֶּאֶרְבוּ
  choice: घात लगाकर बैठ गए
  rationale: ארב छिपकर प्रतीक्षा करने या घात लगाने की सैन्य कार्रवाई बताता है; यह हिन्दी अभिव्यक्ति छिपकर आक्रमण की प्रतीक्षा करने का भाव स्पष्ट करती है।
- source_word: עַל שְׁכֶם
  choice: शकेम के विरुद्ध
  rationale: ארב के साथ עַל यहाँ घात के शत्रुतापूर्ण लक्ष्य को सूचित कर सकता है; ‘के विरुद्ध’ केवल स्थान नहीं, बल्कि उस लक्ष्य को भी व्यक्त करता है।
- source_word: אַרְבָּעָה רָאשִׁים
  choice: चार दलों
  rationale: शाब्दिक अर्थ ‘चार सिर’ है, पर यहाँ यह लोगों की चार अलग टुकड़ियों या इकाइयों का मुहावरा है; ‘दल’ स्पष्ट, स्वाभाविक और अनावश्यक सैन्य विशिष्टता से रहित है।
- source_word: הָעָם אֲשֶׁר עִמּוֹ
  choice: उसके साथ के सब लोग
  rationale: עָם का व्यापक अर्थ ‘लोग’ है। प्रसंग सैन्य है, फिर भी मूल में ‘पुरुष’ या ‘सैनिक’ स्पष्ट रूप से नहीं कहा गया, इसलिए व्यापक पद रखा गया है।
