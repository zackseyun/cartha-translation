lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: तब ... कहा
  rationale: वाव-क्रमागत कथानक को आगे बढ़ाता है; आधुनिक हिन्दी में “तब” घटनाक्रम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הָעֵצִים
  choice: पेड़ों
  rationale: योताम के दृष्टान्त में बहुवचन עֵץ का सन्दर्भ सामग्री के रूप में लकड़ी से नहीं, पेड़ों से है।
- source_word: לַגָּפֶן
  choice: दाखलता से
  rationale: גֶּפֶן अंगूर की बेल को दर्शाता है; “दाखलता” संक्षिप्त, प्रतिष्ठित और बाइबिलीय प्रसंग में सहज हिन्दी है।
- source_word: לְכִי
  choice: आ
  rationale: הלך का मूल अर्थ “जाना/चलना” है, पर अगले आदेश के साथ यह बुलावे का मुहावरा है; हिन्दी में “आ” स्वाभाविक है।
- source_word: אַתְּ
  choice: तू
  rationale: यह द्वितीय पुरुष स्त्रीलिंग एकवचन सर्वनाम है और व्यक्तिरूप दी गई दाखलता को प्रत्यक्ष सम्बोधित करता है; हिन्दी में “तू” एकवचन आदेश के साथ सहज है।
- source_word: מְלֹכִי
  choice: राज कर
  rationale: מלך का स्त्रीलिंग एकवचन आदेशात्मक रूप राजकीय शासन करने को व्यक्त करता है; “राज कर” आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: עָלֵינוּ
  choice: हम पर
  rationale: מלך के साथ עַל शासन के अधीन होने का सम्बन्ध बताता है; हिन्दी में मानक प्रयोग “हम पर राज कर” है।
