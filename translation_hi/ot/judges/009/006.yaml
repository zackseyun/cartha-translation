  text: וַ/יֵּאָ֨סְפ֜וּ כָּל בַּעֲלֵ֤י שְׁכֶם֙ וְ/כָל בֵּ֣ית מִלּ֔וֹא וַ/יֵּ֣לְכ֔וּ וַ/יַּמְלִ֥יכוּ אֶת אֲבִימֶ֖לֶךְ לְ/מֶ֑לֶךְ עִם אֵל֥וֹן מֻצָּ֖ב אֲשֶׁ֥ר בִּ/שְׁכֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/006.yaml
  text: Then all the leaders of Shechem and all Beth-millo gathered together[b][a], and they went and made Abimelech king beside the oak pillar that was in Shechem.
translation:
  language: hi
  text: तब शकेम के सभी अगुवे और सारा बेत-मिल्लो[b] इकट्ठे हुए। वे गए और शकेम में स्थित उस स्तंभ वाले बांज-वृक्ष के पास[a] अबीमेलेक को राजा बनाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “शकेम में उस स्तंभ के बांज-वृक्ष के पास।” इब्रानी वाक्यांश कठिन है; מֻצָּב का ठीक अर्थ और बांज-वृक्ष से उसका संबंध अनिश्चित है।
    reason: lexical_alternative
  - marker: b
    text: “बेत-मिल्लो” का अर्थ “मिल्लो का घराना” भी हो सकता है, पर यहाँ यह संभवतः किसी स्थान, कुल या समूह का नाम है।
    reason: cultural_note
lexical_decisions:
- source_word: בַּעֲלֵי שְׁכֶם
  choice: शकेम के सभी अगुवे
  rationale: शाब्दिक अर्थ ‘स्वामी/मालिक’ है, पर इस नगर-राजनीतिक संदर्भ में यह शकेम के प्रभावशाली अगुवों या सत्ताधारियों को सूचित करता है।
- source_word: בֵּית מִלּוֹא
  choice: पूरा बेत-मिल्लो
  rationale: यह किसी स्थान, कुल या समूह के नाम के रूप में प्रयुक्त होता जान पड़ता है; लिप्यंतरण अनिश्चित संदर्भ को सुरक्षित रखता है। ‘पूरा’ כָל के सामूहिक अर्थ को व्यक्त करता है।
- source_word: וַיַּמְלִיכוּ ... לְמֶלֶךְ
  choice: अबीमेलेक को राजा बनाया
  rationale: हिफ़ील रूप का सीधा अर्थ किसी को राज्य करने वाला बनाना है; ‘राजा बनाया’ किसी अस्पष्ट राज्याभिषेक-विधि को नहीं जोड़ता।
- source_word: עִם
  choice: निकट
  rationale: यहाँ शब्द किसी प्रमुख स्थल-चिह्न के पास होने का स्थानिक संबंध व्यक्त करता है।
- source_word: אֵלוֹן
  choice: बांज-वृक्ष
  rationale: यह किसी बड़े वृक्ष, संभवतः ओक या तारपीन-वृक्ष, को सूचित करता है। ‘बांज-वृक्ष’ वर्तमान हिन्दी में गरिमापूर्ण और समझने योग्य निकटतम विकल्प है, जबकि सटीक प्रजाति निश्चित नहीं है।
- source_word: מֻצָּב
  choice: स्तंभ
  rationale: यह נצב से बना रूप किसी खड़ी या स्थापित वस्तु की ओर संकेत करता है। संदर्भ में ‘स्तंभ’ संभावित अर्थ देता है, पर वृक्ष के साथ इसका ठीक संबंध अनिश्चित है और पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: וַיֵּאָסְפוּ
  choice: इकट्ठे हुए
  rationale: यह सामूहिक रूप से एकत्र होने का स्वाभाविक आधुनिक हिन्दी वर्णन है।
