  text: וְ/הָיָ֤ה בַ/בֹּ֨קֶר֙ כִּ/זְרֹ֣חַ הַ/שֶּׁ֔מֶשׁ תַּשְׁכִּ֖ים וּ/פָשַׁטְתָּ֣ עַל הָ/עִ֑יר וְ/הִנֵּה ה֞וּא וְ/הָ/עָ֤ם אֲשֶׁר אִתּ/וֹ֙ יֹצְאִ֣ים אֵלֶ֔י/ךָ וְ/עָשִׂ֣יתָ לּ֔/וֹ כַּ/אֲשֶׁ֖ר תִּמְצָ֥א יָדֶֽ/ךָ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/033.yaml
  text: Then in the morning[a], as soon as the sun rises, you must get up early and spread out against the city. And look, when he and the people who are with him come out to you, you shall do to him as your hand finds.
translation:
  language: hi
  text: फिर सवेरे, सूरज निकलते ही, तुम तड़के उठकर नगर पर धावा बोलना। और देखो, जब वह और उसके साथ के लोग तुम्हारी ओर निकलकर आएँ, तब उसके साथ वही करना जो तुम्हारे हाथ में हो।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: “जैसा तुम्हारा हाथ पाए”; अर्थात् जैसा अवसर मिले या जितना तुम्हारे वश में हो।'
    reason: मूल इब्रानी मुहावरे के शाब्दिक रूप और उसके आशय को स्पष्ट करना।
lexical_decisions:
- source_word: וְהָיָה בַבֹּקֶר
  choice: फिर सवेरे
  rationale: וְהָיָה यहाँ निर्देशों के क्रम को आगे बढ़ाता है; संक्षिप्त और स्वाभाविक हिन्दी में ‘फिर सवेरे’ वही कार्य करता है।
- source_word: כִּזְרֹחַ הַשֶּׁמֶשׁ
  choice: सूरज निकलते ही
  rationale: כ के साथ infinitive construct समय बताता है; सैन्य योजना में निहित तत्परता को ‘निकलते ही’ स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: תַּשְׁכִּים
  choice: तड़के उठकर
  rationale: שכם का हिफ़ील रूप भोर में जल्दी उठने या शीघ्र आरम्भ करने का भाव देता है।
- source_word: וּפָשַׁטְתָּ עַל הָעִיר
  choice: नगर पर धावा बोलना
  rationale: सैन्य संदर्भ में פשט आक्रमण करने या छापा मारने का अर्थ देता है। ‘धावा बोलना’ हिन्दी में आक्रामक आगे बढ़ने को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וְהִנֵּה
  choice: और देखो
  rationale: यह अगले घटनाक्रम की ओर ध्यान खींचने वाला प्रत्यक्ष discourse marker है।
- source_word: הוּא וְהָעָם אֲשֶׁר אִתּוֹ
  choice: वह और उसके साथ के लोग
  rationale: עָם को ‘लोग’ रखना मूल की व्यापकता बचाता है; ‘सैनिक’ कहना संदर्भ से संभव होते हुए भी अधिक विशिष्ट होता।
- source_word: יֹצְאִים אֵלֶיךָ
  choice: तुम्हारी ओर निकलकर आएँ
  rationale: אֵלֶיךָ मूलतः दिशा ‘तुम्हारी ओर/तुम्हारे पास’ बताता है। युद्ध-संदर्भ शत्रुता स्पष्ट करता है, पर उसे पूर्वसर्ग में जोड़कर मूल को अनावश्यक रूप से सीमित नहीं किया गया।
- source_word: וְעָשִׂיתָ לּוֹ
  choice: वैसा ही उसके साथ करना
  rationale: एकवचन प्रत्यय לּוֹ का सीधा संदर्भ नेता से है; इसलिए एकवचन ‘उसके साथ’ बनाए रखा गया है।
- source_word: כַּאֲשֶׁר תִּמְצָא יָדֶךָ
  choice: तुम्हारा हाथ जैसा अवसर पाए
  rationale: मूल के ‘हाथ’ वाले मुहावरे को बनाए रखते हुए ‘अवसर पाए’ उसके सामर्थ्य अथवा परिस्थिति के अनुसार कार्य करने के आशय को हिन्दी में समझने योग्य बनाता है।
