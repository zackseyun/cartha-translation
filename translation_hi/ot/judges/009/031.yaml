  text: וַ/יִּשְׁלַ֧ח מַלְאָכִ֛ים אֶל אֲבִימֶ֖לֶךְ בְּ/תָרְמָ֣ה לֵ/אמֹ֑ר הִנֵּה֩ גַ֨עַל בֶּן עֶ֤בֶד וְ/אֶחָי/ו֙ בָּאִ֣ים שְׁכֶ֔מָ/ה וְ/הִנָּ֛/ם צָרִ֥ים אֶת הָ/עִ֖יר עָלֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/031.yaml
  text: And he sent messengers to Abimelek secretly[a], saying, “Look, Gaal son of Ebed and his brothers have come to Shechem, and look, they are besieging the city against you.”
translation:
  language: hi
  text: उसने अबीमेलेक के पास गुप्त रूप से[a] दूतों के द्वारा कहलवाया, “देख, एबेद का पुत्र गाल और उसके भाई शकेम आ गए हैं, और देख, वे नगर को तेरे विरुद्ध भड़का रहे हैं।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या “छल से।” अंतिम वाक्य का अनुवाद यह भी हो सकता है: “वे तेरे विरुद्ध नगर को घेर रहे हैं।” यहाँ प्रयुक्त इब्रानी क्रिया का अर्थ अनिश्चित है; प्रसंग में संभवतः आशय यह है कि गाल और उसके साथी शकेम नगर को अबीमेलेक के विरुद्ध उकसा रहे हैं।'
    reason: दुर्लभ בְּתָרְמָה और कठिन צָרִים के प्रमुख अर्थ-विकल्पों को सुरक्षित रखना।
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: उसने ... दूत भेजकर कहा
  rationale: हिब्रू कथात्मक रूप को स्वाभाविक हिन्दी भूतकाल में व्यक्त किया गया है; לֵאמֹר को मुख्य क्रिया के साथ ‘भेजकर कहा’ में जोड़ा गया है।
- source_word: מַלְאָכִים
  choice: दूत
  rationale: राजनीतिक-सैनिक संदर्भ में यह मनुष्य संदेशवाहकों को सूचित करता है, स्वर्गदूतों को नहीं।
- source_word: בְּתָרְמָה
  choice: गुप्त रूप से
  rationale: यह दुर्लभ पद छिपकर अथवा छलपूर्वक संदेश भेजने का भाव देता है; ‘गुप्त रूप से’ अनावश्यक नैतिक अर्थ जोड़े बिना गोपनीयता व्यक्त करता है।
- source_word: הִנֵּה ... וְהִנָּם
  choice: देख ... और देख
  rationale: दोनों ध्यानाकर्षक पदों की पुनरावृत्ति रखी गई है, जिससे संदेश की तत्पर और जोरदार शैली बनी रहती है।
- source_word: גַעַל בֶּן עֶבֶד
  choice: एबेद का पुत्र गाल
  rationale: हिब्रू संबंधवाचक संरचना को स्पष्ट, स्वाभाविक हिन्दी में रखा गया है और नामों का लिप्यंतरण किया गया है।
- source_word: וְאֶחָיו
  choice: और उसके भाई
  rationale: मूल पाठ का सीधा अर्थ सुरक्षित रखा गया है; यहाँ ‘भाई’ निकट संबंधियों या सहयोगियों को भी समेट सकता है, पर अनुवाद में उसे व्यापक नहीं किया गया।
- source_word: בָּאִים שְׁכֶמָה
  choice: शकेम आ गए हैं
  rationale: कृदन्त और दिशासूचक रूप उनके पहुँच चुकने तथा वर्तमान स्थिति पर उसके प्रभाव को दर्शाते हैं।
- source_word: צָרִים אֶת הָעִיר עָלֶיךָ
  choice: वे नगर को तेरे विरुद्ध भड़का रहे हैं
  rationale: צור का रूप यहाँ कठिन है। ‘तेरे विरुद्ध’ और विद्रोह के प्रसंग के कारण नगर को अबीमेलेक के विरुद्ध उकसाने का अर्थ प्रसंगानुकूल है; शाब्दिक ‘घेर रहे हैं’ को पादटिप्पणी में सुरक्षित रखा गया है।
