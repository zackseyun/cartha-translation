base_translation:
  language: en
  yaml_path: translation/ot/judges/009/041.yaml
  text: And Abimelech stayed in Arumah[a], and Zebul drove Gaal and his brothers out from dwelling in Shechem.
translation:
  language: hi
  text: अबीमेलेक अरूमा में रहा, और ज़बूल ने गाल और उसके भाइयों को शकेम से निकाल दिया और वहाँ रहने न दिया[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “गाल और उसके भाइयों को निकाल दिया, ताकि वे शकेम में न रह सकें।” इब्रानी में ‘निवास करना’ वाले क्रियार्थक संज्ञा-रूप के साथ निर्माण उन्हें शकेम में रहने से वंचित किए जाने का भाव व्यक्त करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: रहा
  rationale: ישׁב यहाँ किसी स्थान पर ठहरने या बने रहने का बोध देता है। युद्ध-संदर्भ में ‘रहा’ स्वाभाविक है और अनावश्यक रूप से दीर्घकालीन निवास का संकेत नहीं देता।
- source_word: בָּארוּמָה
  choice: अरूमा में
  rationale: स्थान-नाम को देवनागरी में लिप्यंतरित किया गया है; בְּ उपसर्ग का स्वाभाविक स्थानीय अर्थ ‘में’ है।
- source_word: וַיְגָרֶשׁ
  choice: निकाल दिया
  rationale: גרשׁ बलपूर्वक हटाने या खदेड़ने को व्यक्त करता है। ‘निकाल दिया’ आधुनिक हिंदी में स्पष्ट और स्वाभाविक है तथा औपचारिक कानूनी निर्वासन का अतिरिक्त भाव नहीं जोड़ता।
- source_word: זְבֻל
  choice: जबूल
  rationale: व्यक्तिवाचक नाम का स्रोत-उच्चारण के निकट देवनागरी लिप्यंतरण।
- source_word: גַּעַל
  choice: गाल
  rationale: व्यक्तिवाचक नाम का सरल और पठनीय देवनागरी लिप्यंतरण; हिंदी में अयिन को अलग चिह्न से दिखाना आवश्यक नहीं समझा गया।
- source_word: אֶחָיו
  choice: उसके भाइयों
  rationale: אָח का सामान्य और प्रत्यक्ष अर्थ ‘भाई’ है; प्रसंग में इसे ‘संबंधी’ या ‘साथी’ बनाने का पर्याप्त आधार नहीं है।
- source_word: מִשֶּׁבֶת בִּשְׁכֶם
  choice: शकेम से
  rationale: מן + ישׁב के क्रियार्थक संज्ञा-रूप में वहाँ निवास करने से वंचित किए जाने का भाव है। मुख्य पाठ में स्वाभाविक हिंदी के लिए ‘शकेम से निकाल दिया’ रखा गया है और निर्माण की सूक्ष्मता पादटिप्पणी में स्पष्ट की गई है।
- source_word: בִּשְׁכֶם
  choice: शकेम
  rationale: स्थान-नाम का प्रचलित हिंदी बाइबलीय लिप्यंतरण।
