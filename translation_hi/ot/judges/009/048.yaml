  text: וַ/יַּ֨עַל אֲבִימֶ֜לֶךְ הַר צַלְמ֗וֹן הוּא֮ וְ/כָל הָ/עָ֣ם אֲשֶׁר אִתּ/וֹ֒ וַ/יִּקַּח֩ אֲבִימֶ֨לֶךְ אֶת הַ/קַּרְדֻּמּ֜וֹת בְּ/יָד֗/וֹ וַ/יִּכְרֹת֙ שׂוֹכַ֣ת עֵצִ֔ים וַ/יִּ֨שָּׂאֶ֔/הָ וַ/יָּ֖שֶׂם עַל שִׁכְמ֑/וֹ וַ/יֹּ֜אמֶר אֶל הָ/עָ֣ם אֲשֶׁר עִמּ֗/וֹ מָ֤ה רְאִיתֶם֙ עָשִׂ֔יתִי מַהֲר֖וּ עֲשׂ֥וּ כָמֽוֹ/נִי־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/048.yaml
  text: Then Abimelek went up Mount Zalmon[a], he and all the people who were with him. Abimelek took the axes in his hand, cut down a bundle of branches, lifted it, and put it on his shoulder. Then he said to the people who were with him, “What you have seen me do, hurry and do as I have done.”
translation:
  language: hi
  text: तब अबीमेलेक अपने साथ के सब लोगों के साथ सलमोन पर्वत पर चढ़ गया। अबीमेलेक ने हाथ में कुल्हाड़ियाँ लीं, पेड़ों की डालियों का एक गट्ठर[a] काटा, उसे उठाकर अपने कंधे पर रखा और अपने साथ के लोगों से कहा, “जो कुछ तुमने मुझे करते देखा है, जल्दी से वैसा ही करो।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “पेड़ों की एक बड़ी डाली,” “पेड़ों का झुरमुट,” अथवा “झाड़-झंखाड़ का गट्ठर”; यहाँ प्रयुक्त इब्रानी शब्द दुर्लभ है और डालियों या झाड़-झंखाड़ के एक समूह को सूचित करता है।
    reason: दुर्लभ इब्रानी शब्द שׂוֹכָה के संदर्भानुकूल अर्थ-विकल्पों को सुरक्षित रखना।
lexical_decisions:
- source_word: וַיַּעַל
  choice: चढ़ गए
  rationale: कथा के संदर्भ में עלה ऊपर जाने या चढ़ने को व्यक्त करता है; बहुवचन क्रिया अबीमेलेक और उसके साथ के सब लोगों को स्वाभाविक हिन्दी में समेटती है।
- source_word: הַר צַלְמוֹן
  choice: सलमोन पर्वत
  rationale: स्थान-नाम को अनूदित करने के बजाय देवनागरी में लिप्यंतरित किया गया है; הַר को स्वाभाविक हिन्दी क्रम में ‘पर्वत’ कहा गया है।
- source_word: הוּא וְכָל־הָעָם אֲשֶׁר אִתּוֹ
  choice: अबीमेलेक और उसके साथ के सब लोग
  rationale: עָם का व्यापक अर्थ ‘लोग’ बनाए रखा गया है; संदर्भ से योद्धा होने की सम्भावना के बावजूद मूल पाठ यहाँ ‘सैनिक’ या ‘पुरुष’ नहीं कहता।
- source_word: הַקַּרְדֻּמּוֹת בְּיָדוֹ
  choice: कुल्हाड़ियाँ अपने हाथ में लीं
  rationale: कुल्हाड़ी का शब्द मूल में बहुवचन है, इसलिए उसे बहुवचन रखा गया है; ‘अपने हाथ में लीं’ हिन्दी में अधिकार और क्रिया दोनों को सहज रूप से व्यक्त करता है।
- source_word: וַיִּכְרֹת שׂוֹכַת עֵצִים
  choice: पेड़ों की डालियों का एक गट्ठर काटा
  rationale: दुर्लभ שׂוֹכָה डालियों, झाड़-झंखाड़ या लकड़ी के घने समूह को सूचित करता है। आगे उसे कंधे पर रखने के कारण ‘गट्ठर’ संदर्भानुकूल है, पर वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित हैं।
- source_word: וַיִּשָּׂאֶהָ וַיָּשֶׂם עַל שִׁכְמוֹ
  choice: उसे उठाकर अपने कंधे पर रखा
  rationale: इससे उठाने और फिर कंधे पर रखने की मूल क्रिया-श्रृंखला स्पष्ट और स्वाभाविक हिन्दी में बनी रहती है।
- source_word: מָה רְאִיתֶם עָשִׂיתִי
  choice: जो कुछ तुमने मुझे करते देखा है
  rationale: मूल इब्रानी वाक्य संक्षिप्त है; यह हिन्दी रूप उसके अर्थ को बिना अतिरिक्त व्याख्या के स्वाभाविक बनाता है।
- source_word: מַהֲרוּ עֲשׂוּ כָמוֹנִי
  choice: जल्दी से वैसा ही करो
  rationale: बहुवचन आज्ञाओं की तात्कालिकता और अबीमेलेक के काम का अनुकरण—दोनों को संक्षिप्त, वर्तमान हिन्दी में व्यक्त किया गया है।
