translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथात्मक शैली अपनाई गई है। हिब्रू के सामूहिक אִישׁ और बाद के वितरक אִישׁ के भेद को क्रमशः ‘लोगों’ और ‘हर एक’ से स्पष्ट किया गया है। अलग पाद-टिप्पणी आवश्यक नहीं, क्योंकि हिन्दी मुख्य पाठ में वितरक एकवचन स्वाभाविक और स्पष्ट है।
