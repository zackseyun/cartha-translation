  yaml_path: translation/ot/judges/009/055.yaml
  text: When the men of Israel saw that Abimelech was dead[a], each went to his own place.
translation:
  language: hi
  text: जब इस्राएल के पुरुषों ने देखा कि अबीमेलेक मर गया था, तब हर एक अपने स्थान को चला गया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּרְאוּ
  choice: देखा
  rationale: रूट ראה का सामान्य कथात्मक अर्थ दृश्य बोध है, जिससे यहाँ अबीमेलेक की मृत्यु का पता चलता है; ‘देखा’ मूल अभिव्यक्ति और स्वाभाविक हिन्दी दोनों को बनाए रखता है।
- source_word: אִישׁ יִשְׂרָאֵל
  choice: इस्राएल के लोगों
  rationale: एकवचन אִישׁ यहाँ बहुवचन क्रिया के साथ सामूहिक अर्थ में है। प्रसंग युद्धरत पुरुषों का है, पर हिन्दी में ‘इस्राएल के लोगों’ सामूहिक प्रयोग को सहज रूप से व्यक्त करता है और अनावश्यक रूप से ‘इस्राएली पुरुषों’ जैसा भारी नहीं लगता।
- source_word: כִּי
  choice: कि
  rationale: 'यहाँ כִּי देखने या जान लेने की विषय-वस्तु प्रस्तुत करता है: उन्होंने देखा ‘कि’ अबीमेलेक मर गया है।'
- source_word: מֵת
  choice: मर गया है
  rationale: हिब्रू पद अबीमेलेक की मृत अवस्था बताता है। हिन्दी कथन में ‘मर गया है’ उस समय पहचानी गई अवस्था को ‘मृत था’ की अपेक्षा अधिक स्वाभाविक ढंग से व्यक्त करता है।
- source_word: אֲבִימֶלֶךְ
  choice: अबीमेलेक
  rationale: व्यक्तिवाचक नाम का मानक हिन्दी लिप्यंतरण।
- source_word: וַיֵּלְכוּ
  choice: चला गया
  rationale: הלך की सामान्य कथात्मक गति को ‘चला गया’ व्यक्त करता है; ‘लौट गया’ मूल में निहित न होने के कारण नहीं चुना गया। वितरक ‘हर एक’ के अनुसार क्रिया एकवचन है।
- source_word: אִישׁ לִמְקֹמוֹ
  choice: हर एक अपने स्थान को
  rationale: बहुवचन समूह में אִישׁ का वितरक प्रयोग ‘हर एक’ से व्यक्त होता है। מָקוֹם का सीधा अर्थ ‘स्थान’ है; ‘घर’ कहना मूल से अधिक विशिष्ट होता।
