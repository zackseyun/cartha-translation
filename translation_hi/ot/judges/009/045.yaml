  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/אֲבִימֶ֜לֶךְ נִלְחָ֣ם בָּ/עִ֗יר כֹּ֚ל הַ/יּ֣וֹם הַ/ה֔וּא וַ/יִּלְכֹּד֙ אֶת הָ/עִ֔יר וְ/אֶת הָ/עָ֥ם אֲשֶׁר בָּ֖/הּ הָרָ֑ג וַ/יִּתֹּץ֙ אֶת הָ/עִ֔יר וַ/יִּזְרָעֶ֖/הָ מֶֽלַח־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/045.yaml
  text: And Abimelech fought against the city all that day[a], and he captured the city and killed the people who were in it[b]. Then he tore down the city and sowed it with salt.
translation:
  language: hi
  text: अबीमेलेक उस पूरे दिन नगर के विरुद्ध लड़ता रहा[a]। उसने नगर पर अधिकार कर लिया और उसमें मौजूद लोगों को मार डाला। फिर उसने नगर को ढा दिया और उस पर नमक बो दिया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “नगर पर आक्रमण करता रहा।” इब्रानी क्रिया का शाब्दिक अर्थ “लड़ा” है; यहाँ प्रयुक्त संबंधसूचक शब्द के साथ यह संभवतः नगर के विरुद्ध सैन्य कार्रवाई को दर्शाती है।
    reason: lexical_alternative
  - marker: b
    text: “नमक बो देना” विध्वंस और अभिशाप का प्रतीकात्मक कार्य था, जो नगर के उजड़ जाने को चिह्नित करता था।
    reason: cultural_note
lexical_decisions:
- source_word: נִלְחָם בָּעִיר
  choice: नगर के विरुद्ध लड़ता रहा
  rationale: लड़ने के अर्थ वाले क्रिया-रूप के साथ प्रयुक्त ב यहाँ शत्रुतापूर्ण सैन्य कार्रवाई को सूचित करता है। अगले वाक्यांशों में नगर पर अधिकार और उसके विनाश का वर्णन इसकी पुष्टि करता है।
- source_word: כֹּל הַיּוֹם הַהוּא
  choice: उस पूरे दिन
  rationale: यह उस विशेष दिन भर कार्रवाई जारी रहने पर बल देता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: וַיִּלְכֹּד אֶת הָעִיר
  choice: उसने नगर पर अधिकार कर लिया
  rationale: לכד का सैन्य संदर्भ में अर्थ किसी नगर को पकड़ लेना या जीत लेना है। 'अधिकार कर लिया' सहज हिन्दी में नगर के सैन्य अधिग्रहण को स्पष्ट करता है।
- source_word: הָעָם אֲשֶׁר בָּהּ
  choice: उसमें मौजूद लोगों
  rationale: यह नगर के भीतर उपस्थित जनसमुदाय को दर्शाता है। यह अनुवाद मूल संबंधवाचक वाक्यांश को संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הָרָג
  choice: मार डाला
  rationale: क्रिया सीधे हत्या करने को दर्शाती है; 'मार डाला' स्पष्ट, वर्तमान और सहज हिन्दी है।
- source_word: וַיִּתֹּץ אֶת הָעִיר
  choice: नगर को ढा दिया
  rationale: נתץ इमारतों या संरचनाओं को गिरा देने का अर्थ रखता है। 'ढा दिया' नगर के विध्वंस को संक्षेप में और स्वाभाविक रूप से व्यक्त करता है।
- source_word: וַיִּזְרָעֶהָ מֶלַח
  choice: उस पर नमक बो दिया
  rationale: मूल में नमक को 'बोने' की सजीव और जानबूझकर की गई क्रिया है। इसे बनाए रखने से प्रतीकात्मक विध्वंस की छवि सुरक्षित रहती है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट कथात्मक शैली रखी गई है। 'लड़ता रहा' और 'उस पूरे दिन' मिलकर इब्रानी में व्यक्त निरंतर अवधि को सहज रूप से प्रस्तुत करते हैं; 'नमक बो दिया' मूल रूपक को सुरक्षित रखता है।
