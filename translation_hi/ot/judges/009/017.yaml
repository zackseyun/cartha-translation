base_translation:
  language: en
  yaml_path: translation/ot/judges/009/017.yaml
  text: because my father fought for you[a], cast his life in front of him[b], and delivered you from the hand of Midian.
translation:
  language: hi
  text: क्योंकि मेरे पिता ने तुम्हारे लिए युद्ध किया, अपनी जान जोखिम में डाली[a], और तुम्हें मिद्यान के हाथ से छुड़ाया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “अपनी जान सामने फेंक दी”; यह प्राणघातक खतरा मोल लेने का मुहावरा है।
    reason: lexical_alternative
  - marker: b
    text: या “मिद्यान की सत्ता से बचाया।”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  choice: क्योंकि
  rationale: संदर्भ में यह पद पिछले कथन के समर्थन में कारण प्रस्तुत करता है; इसलिए केवल संबंधवाचक रूप के बजाय कारणवाचक अनुवाद स्वाभाविक है।
- source_word: נִלְחַם אָבִי עֲלֵיכֶם
  choice: मेरे पिता ने तुम्हारे लिए युद्ध किया
  rationale: נִלְחַם का अर्थ युद्ध करना है और यहाँ עֲלֵיכֶם श्रोताओं के हित या पक्ष में किए गए युद्ध को व्यक्त करता है, उनके विरुद्ध युद्ध को नहीं।
- source_word: וַיַּשְׁלֵךְ אֶת־נַפְשׁוֹ מִנֶּגֶד
  choice: अपनी जान जोखिम में डाली
  rationale: शाब्दिक चित्र अपनी जान को सामने फेंकने का है; यह प्राणघातक खतरे के सामने स्वयं को रखने का मुहावरा है। हिंदी का यह रूप अर्थ को स्पष्ट रखते हुए मूल चित्र की झलक भी बनाए रखता है।
- source_word: וַיַּצֵּל
  choice: छुड़ाया
  rationale: हिफ़ील रूप का अर्थ बचाना, छुड़ाना या किसी के अधिकार से निकालना है; सैन्य संदर्भ में ‘छुड़ाया’ सहज और सटीक है।
- source_word: מִיַּד מִדְיָן
  choice: मिद्यान के हाथ से
  rationale: ‘हाथ से’ मूल इब्रानी मुहावरे को सुरक्षित रखता है, जहाँ हाथ सत्ता या नियंत्रण का संकेत है।
