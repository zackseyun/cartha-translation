  yaml_path: translation/ot/judges/009/008.yaml
  text: The trees once went to anoint a king over themselves[a], and they said to the olive tree, ‘Reign over us.’
translation:
  language: hi
  text: पेड़ एक बार अपने ऊपर राजा का अभिषेक करने निकले[a]। उन्होंने जैतून के पेड़ से कहा, “हम पर राज कर।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में बल देने वाला क्रियारूप है—शाब्दिक रूप से, “चलते हुए वे चले।” इसके अनुवाद “पेड़ निश्चय ही गए” या “पेड़ अपने ऊपर राजा का अभिषेक करने निकल पड़े” भी हो सकते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: הָלוֹךְ הָלְכוּ
  choice: एक बार ... निकल पड़े
  rationale: इनफ़िनिटिव ऐब्सोल्यूट के साथ सीमित क्रिया कार्य पर बल देती है। हिंदी में ‘एक बार ... निकल पड़े’ दृष्टांत का स्वाभाविक आरंभ करता है और उद्देश्यपूर्ण प्रस्थान का भाव व्यक्त करता है; बलयुक्त हिब्रू रूप की जानकारी पाद-टिप्पणी में सुरक्षित है।
- source_word: הָעֵצִים
  choice: पेड़
  rationale: योताम के दृष्टांत में बहुवचन संज्ञा सचमुच पेड़ों को दर्शाती है; हिंदी में ‘पेड़’ स्वाभाविक और स्पष्ट है।
- source_word: לִמְשֹׁחַ
  choice: अभिषेक करने के लिए
  rationale: משׁח पद-स्थापना के लिए तेल से अभिषेक करने की ठोस क्रिया दर्शाता है। ‘अभिषेक’ राजनीतिक और धार्मिक प्रतीकात्मकता को बनाए रखता है।
- source_word: עֲלֵיהֶם
  choice: अपने ऊपर
  rationale: מלך के संदर्भ में על शासन के अधीन होने का अर्थ देता है; कर्ता बहुवचन होने के कारण ‘अपने ऊपर’ उसका आत्मवाचक भाव सुरक्षित रखता है।
- source_word: מֶלֶךְ
  choice: एक राजा
  rationale: यहाँ संज्ञा अर्थ की दृष्टि से अनिश्चित है; पेड़ अपने लिए किसी एक राजा को नियुक्त करना चाहते हैं।
- source_word: וַיֹּאמְרוּ
  choice: उन्होंने ... कहा
  rationale: यह אָמַר का सामान्य कथात्मक रूप है; हिंदी कथा-शैली में ‘उन्होंने कहा’ सहज है।
- source_word: לַזַּיִת
  choice: जैतून के पेड़ से
  rationale: זית जैतून अथवा जैतून का पेड़ हो सकता है; मानवीकृत संबोधित पात्र के लिए ‘जैतून का पेड़’ स्पष्ट है।
- source_word: מְלֹכָה
  choice: राज कर
  rationale: यह מלך का आज्ञार्थक रूप है। ‘राज कर’ संक्षिप्त, स्वाभाविक और राजकीय शासन का भाव रखने वाला अनुवाद है।
- source_word: עָלֵינוּ
  choice: हम पर
  rationale: מלך के साथ על प्रजा के ऊपर प्रभुत्व सूचित करता है; ‘हम पर’ इसका सटीक और स्वाभाविक हिंदी रूप है।
