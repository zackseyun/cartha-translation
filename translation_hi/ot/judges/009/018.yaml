id: JDG.9.18
reference: Judges 9:18
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/אַתֶּ֞ם קַמְתֶּ֨ם עַל בֵּ֤ית אָבִ/י֙ הַ/יּ֔וֹם וַ/תַּהַרְג֧וּ אֶת בָּנָ֛י/ו שִׁבְעִ֥ים אִ֖ישׁ עַל אֶ֣בֶן אֶחָ֑ת וַ/תַּמְלִ֜יכוּ אֶת אֲבִימֶ֤לֶךְ בֶּן אֲמָת/וֹ֙ עַל בַּעֲלֵ֣י שְׁכֶ֔ם כִּ֥י אֲחִי/כֶ֖ם הֽוּא־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/018.yaml
  text: But you have risen up against my father's house today[a], and you killed his sons, seventy men, on one stone, and you made Abimelek, the son of his female servant, king over the leaders of Shechem, because he is your brother.
translation:
  language: hi
  text: पर आज तुम मेरे पिता के घराने के विरुद्ध उठ खड़े हुए हो; तुमने उसके सत्तर पुत्रों को एक ही पत्थर पर मार डाला और उसकी दासी के पुत्र अबीमेलेक को शकेम के अगुओं का राजा बनाया, क्योंकि वह तुम्हारा भाई है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קַמְתֶּם עַל
  choice: के विरुद्ध उठ खड़े हुए हो
  rationale: यह इब्रानी मुहावरा विरोध या शत्रुतापूर्ण कार्रवाई व्यक्त करता है। यह चयन मूल रूपक और आरोप की तीव्रता को बनाए रखते हुए स्वाभाविक हिन्दी देता है।
- source_word: בֵּית אָבִי
  choice: मेरे पिता के घराने
  rationale: यहाँ ‘घर’ भवन नहीं, बल्कि परिवार या वंश को दर्शाता है; ‘घराना’ आधुनिक हिन्दी में यह आशय स्पष्ट करता है।
- source_word: וַתַּהַרְגוּ
  choice: मार डाला
  rationale: मूल क्रिया हत्या किए जाने का तथ्य बताती है, पर अपने आप कोई विशिष्ट कानूनी श्रेणी निर्धारित नहीं करती।
- source_word: עַל אֶבֶן אֶחָת
  choice: एक ही पत्थर पर
  rationale: सीधा अनुवाद सामूहिक वध के ठोस और भयावह दृश्य को सुरक्षित रखता है। ‘ही’ एक पत्थर पर सभी के मारे जाने पर बल देता है।
- source_word: וַתַּמְלִיכוּ
  choice: राजा बनाया
  rationale: מלך के हिफ़ील रूप का कारक अर्थ है किसी को राजा बनाना; यह हिन्दी में सीधा और स्वाभाविक है।
- source_word: בֶּן אֲמָתוֹ
  choice: उसकी दासी के पुत्र
  rationale: אָמָה स्त्री सेवक अथवा दास स्त्री को सूचित करता है। ‘दासी’ संक्षिप्त और प्रचलित है तथा ‘उपपत्नी’ का अधिक विशिष्ट अर्थ मुख्य पाठ में नहीं जोड़ता।
- source_word: בַּעֲלֵי שְׁכֶם
  choice: शकेम के अगुओं
  rationale: इस नगर-राजनीतिक संदर्भ में यह पद शकेम के प्रभावशाली नागरिक नेतृत्व को दर्शाता है। ‘अगुए’ इस भूमिका को साधारण पाठक के लिए स्पष्ट करता है।
- source_word: כִּי אֲחִיכֶם הוּא
  choice: क्योंकि वह तुम्हारा भाई है
  rationale: כִּי यहाँ उनके कार्य का कारण देता है और योताम के आरोप में निहित विडंबना को बनाए रखता है।
theological_decisions:
- issue: अबीमेलेक की माता के लिए אֲמָתוֹ की सामाजिक स्थिति
  choice: मुख्य पाठ में ‘उसकी दासी’
  alternative: ‘उसकी दास स्त्री,’ ‘उसकी सेविका,’ या अधिक व्याख्यात्मक रूप में ‘उसकी उपपत्नी’
  rationale: इब्रानी संज्ञा का मूल अर्थ स्त्री सेवक अथवा दास स्त्री है। प्रसंग में यह अबीमेलेक की मातृ-पक्षीय निम्न सामाजिक स्थिति पर कटाक्ष करता है, पर ‘उपपत्नी’ कहना मूल शब्द से अधिक विशिष्ट होगा; इसलिए उस संभावना को पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और मौखिक आरोप के अनुकूल रखी गई है। ‘घराना,’ ‘उठ खड़े हुए,’ और ‘अगुए’ जैसे पद मूल के पारिवारिक, रूपकात्मक और नागरिक-राजनीतिक अर्थों को सामान्य पाठक के लिए स्पष्ट करते हैं।
