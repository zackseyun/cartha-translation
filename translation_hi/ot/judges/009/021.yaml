  yaml_path: translation/ot/judges/009/021.yaml
  text: Then Jotham fled and escaped and went to Beer[a], and he lived there away from Abimelech his brother.
translation:
  language: hi
  text: तब योताम भागा और बच निकला। वह बेएर[a] चला गया और अपने भाई अबीमेलेक से दूर वहीं रहने लगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात बेएर की ओर; इब्रानी रूप में स्थान के नाम के साथ दिशासूचक प्रत्यय जुड़ा है।
    reason: source_form
lexical_decisions:
- source_word: וַיָּנָס
  choice: भागा
  rationale: נוּס खतरे से भागने को व्यक्त करता है; सरल कथात्मक हिन्दी में ‘भागा’ स्वाभाविक है।
- source_word: וַיִּבְרַח
  choice: बच निकला
  rationale: בָּרַח भी पलायन को व्यक्त करता है। पहले क्रियापद के साथ रखी गई निकटार्थी पुनरुक्ति को ‘भागा और बच निकला’ के रूप में बनाए रखा गया है।
- source_word: בְּאֵרָה
  choice: बेएर
  rationale: यह स्थानवाचक नाम בְּאֵר के साथ दिशासूचक ה है। इसलिए नाम को ‘बेएर’ लिप्यंतरित किया और गति का भाव ‘चला गया’ में व्यक्त किया गया है।
- source_word: וַיֵּשֶׁב שָׁם
  choice: वहीं रहने लगा
  rationale: יָשַׁב का अर्थ यहाँ किसी स्थान पर ठहरकर रहना है; ‘रहने लगा’ आधुनिक हिन्दी में प्रसंगानुकूल है और שָׁם को ‘वहीं’ व्यक्त करता है।
- source_word: מִפְּנֵי
  choice: से दूर
  rationale: इस प्रयोग का मूल भाव किसी की उपस्थिति या पहुँच से हटकर रहने का है। ‘से दूर’ कारण को भय के रूप में अनावश्यक रूप से निश्चित किए बिना स्थानिक दूरी व्यक्त करता है।
- source_word: אָחִיו
  choice: अपने भाई
  rationale: तीसरे पुरुष एकवचन संबंधसूचक प्रत्यय और पारिवारिक संबंध दोनों स्पष्ट रूप से सुरक्षित रखे गए हैं।
