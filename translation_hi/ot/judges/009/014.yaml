  text: Then all the trees said to the bramble[a], ‘You come, reign over us.’
translation:
  language: hi
  text: तब सब पेड़ों ने कँटीली झाड़ी से कहा, “तुम आओ और हमारे ऊपर राज करो।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: तब ... ने कहा
  rationale: वाव-क्रमिक रूप कथा को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में घटनाक्रम का स्वाभाविक संकेत देता है।
- source_word: כָל הָעֵצִים
  choice: सब पेड़ों
  rationale: सामूहिक और निश्चित कर्ता का सीधा, स्वाभाविक हिन्दी रूप।
- source_word: אֶל הָאָטָד
  choice: कँटीली झाड़ी से
  rationale: אָטָד किसी कँटीली झाड़ी को दर्शाता है; किसी अनिश्चित वनस्पति-प्रजाति को थोपे बिना सामान्य अर्थ व्यक्त किया गया है। हिन्दी में ‘कहा’ के साथ ‘से’ स्वाभाविक है।
- source_word: לֵךְ אַתָּה
  choice: तुम आओ
  rationale: הלך का आज्ञार्थक रूप अगले आज्ञार्थक के साथ बुलावे/आग्रह का मुहावरा है; स्पष्ट सर्वनाम אַתָּה का बल ‘तुम’ से सुरक्षित रहता है।
- source_word: מְלָךְ
  choice: राज करो
  rationale: क्रिया का अर्थ राजा होकर शासन करना है; ‘राज करो’ संक्षिप्त, स्वाभाविक और राजकीय भाव को सुरक्षित रखता है।
- source_word: עָלֵינוּ
  choice: हमारे ऊपर
  rationale: शासन के संदर्भ में על का निकट और स्पष्ट हिन्दी रूप।
theological_decisions: []
