  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण कथात्मक शैली। ‘कँटीली झाड़ी’ वनस्पति की वास्तविक अनिश्चितता बनाए रखती है, इसलिए अलग पाद-टिप्पणी आवश्यक नहीं मानी गई।
