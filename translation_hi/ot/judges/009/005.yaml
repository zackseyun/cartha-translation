source:
  edition: WLC
  text: וַ/יָּבֹ֤א בֵית אָבִי/ו֙ עָפְרָ֔תָ/ה וַֽ/יַּהֲרֹ֞ג אֶת אֶחָ֧י/ו בְּנֵֽי יְרֻבַּ֛עַל שִׁבְּעִ֥ים אִ֖ישׁ עַל אֶ֣בֶן אֶחָ֑ת וַ/יִּוָּתֵ֞ר יוֹתָ֧ם בֶּן יְרֻבַּ֛עַל הַ/קָּטֹ֖ן כִּ֥י נֶחְבָּֽא־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/005.yaml
  text: Then he went to his father’s house at Ophrah and killed his brothers[a], the sons of Jerubbaal—seventy men—on one stone. But Jotham, the youngest son of Jerubbaal, was left[c][b], because he hid himself.
translation:
  language: hi
  text: तब वह ओप्रा में अपने पिता के घर गया और उसने अपने भाइयों—यरुब्बाल के सत्तर पुत्रों—को एक ही पत्थर पर[b] मार डाला। परन्तु यरुब्बाल का सबसे छोटा पुत्र योताम बच गया[a], क्योंकि वह छिप गया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “जीवित बचा रहा।”
    reason: lexical_alternative
  - marker: b
    text: “एक ही पत्थर पर” संभवतः उस एक पत्थर को सूचित करता है जहाँ इन लोगों का वध किया गया था; इससे यह भी संकेत मिल सकता है कि वे एक ही स्थान पर मारे गए थे।
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּבֹא בֵית אָבִיו עָפְרָתָה
  choice: तब वह ओप्रा में अपने पिता के घर गया
  rationale: वाव-क्रम कथा को आगे बढ़ाता है; दिशासूचक रूप ओप्रा की ओर गति बताता है। स्वाभाविक हिन्दी में पूरे गंतव्य को इस प्रकार व्यक्त किया गया है।
- source_word: וַיַּהֲרֹג
  choice: मार डाला
  rationale: यह הרג के सामान्य अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है और क्रिया में उससे अधिक कानूनी अर्थ नहीं जोड़ता।
- source_word: אֶת אֶחָיו בְּנֵי יְרֻבַּעַל שִׁבְעִים אִישׁ
  choice: अपने भाइयों—यरुब्बाल के सत्तर पुत्रों—को
  rationale: समानाधिकरण पद भाइयों की पहचान यरुब्बाल के पुत्रों के रूप में करता है; संख्या सत्तर को उन्हीं से स्पष्ट रूप से जोड़ा गया है।
- source_word: עַל אֶבֶן אֶחָת
  choice: एक ही पत्थर पर
  rationale: मूल की कठोर और संभवतः वध-स्थल सूचित करने वाली छवि को बिना अतिरिक्त व्याख्या के सुरक्षित रखा गया है।
- source_word: וַיִּוָּתֵר
  choice: बच गया
  rationale: निफ़अल रूप का अर्थ शेष रह जाना या बच जाना है; मृत्यु के प्रसंग में 'बच गया' सहज हिन्दी है, जबकि जीवित बचने का आशय स्पष्ट रहता है।
- source_word: הַקָּטֹן
  choice: सबसे छोटा
  rationale: पारिवारिक संदर्भ में इसका स्वाभाविक अर्थ सबसे छोटा पुत्र है।
- source_word: כִּי נֶחְבָּא
  choice: क्योंकि वह छिप गया था
  rationale: यह योताम के बचने का कारण देता है; पूर्वकालिक हिन्दी रूप छिपने और फलस्वरूप बचने के संबंध को स्पष्ट करता है।
