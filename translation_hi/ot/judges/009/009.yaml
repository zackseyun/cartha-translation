source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר לָ/הֶם֙ הַ/זַּ֔יִת הֶ/חֳדַ֨לְתִּי֙ אֶת דִּשְׁנִ֔/י אֲשֶׁר בִּ֛/י יְכַבְּד֥וּ אֱלֹהִ֖ים וַ/אֲנָשִׁ֑ים וְ/הָ֣לַכְתִּ֔י לָ/נ֖וּעַ עַל הָ/עֵצִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/009.yaml
  text: But the olive tree said to them[a], ‘Should I stop producing my oil, by which gods and men are honored[b], and go to sway over the trees?’
translation:
  language: hi
  text: लेकिन जैतून के पेड़ ने उनसे कहा, “क्या मैं अपना तेल[b] देना छोड़ दूँ, जिससे देवताओं[a] और मनुष्यों का आदर होता है, और पेड़ों के ऊपर झूमने जाऊँ?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “परमेश्वर।” बहुत-से अनुवाद यहाँ אֱלֹהִים को सच्चे परमेश्वर के लिए प्रयुक्त मानते हैं, क्योंकि जैतून का तेल उपासना में काम आता था; इब्रानी संज्ञा और उससे जुड़ी क्रिया यहाँ बहुवचन हैं।
    reason: alternative_reading
  - marker: b
    text: शाब्दिक अर्थ “मेरी चिकनाई” या “मेरी समृद्धि”; यह जैतून के पेड़ की भरपूर उपज, अर्थात उसके तेल, की ओर संकेत करने वाली आलंकारिक अभिव्यक्ति है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַזַּיִת
  choice: जैतून का पेड़
  rationale: संज्ञा का शाब्दिक अर्थ ‘जैतून’ है, पर इस दृष्टांत में बोलने वाला पात्र स्वयं पेड़ है; इसलिए हिन्दी में ‘जैतून का पेड़’ स्पष्ट और स्वाभाविक है।
- source_word: הֶחֳדַלְתִּי
  choice: क्या मैं ... देना छोड़ दूँ
  rationale: पूर्ण क्रिया-रूप यहाँ पिछले निमंत्रण के उत्तर में अलंकारिक प्रश्न व्यक्त करता है। ‘क्या मैं ... छोड़ दूँ’ हिन्दी में इस भाव को स्वाभाविक रूप से रखता है।
- source_word: דִּשְׁנִי
  choice: अपना तेल
  rationale: इसका शाब्दिक अर्थ ‘मेरी चिकनाई/समृद्धि’ है। जैतून के पेड़ के संदर्भ में संकेत उसके तेल की ओर है; मुख्य पाठ में ‘तेल’ अर्थ को सहज बनाता है, जबकि शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
- source_word: אֲשֶׁר בִּי
  choice: जिससे
  rationale: सम्बन्धवाचक पद यहाँ साधन का भाव देता है—पेड़ की उपज के द्वारा देवताओं और मनुष्यों का आदर होता है।
- source_word: יְכַבְּדוּ
  choice: आदर होता है
  rationale: इब्रानी क्रिया सक्रिय और बहुवचन है, पर उसका कर्ता अनिर्दिष्ट है। हिन्दी का भाववाच्य प्रयोग अनावश्यक कर्ता जोड़े बिना आशय को स्वाभाविक रखता है।
- source_word: אֱלֹהִים
  choice: देवताओं
  rationale: रूप और उससे जुड़ी क्रिया दोनों बहुवचन हैं। इसलिए मुख्य पाठ में बहुवचन ‘देवताओं’ रखा गया है; ‘परमेश्वर’ की पारंपरिक सम्भावना पादटिप्पणी में दी गई है।
- source_word: וַאֲנָשִׁים
  choice: और मनुष्यों
  rationale: यह देवताओं और मानवों की युग्मित अभिव्यक्ति है; ‘मनुष्यों’ आधुनिक मानक हिन्दी में व्यापक और सटीक है।
- source_word: לָנוּעַ עַל הָעֵצִים
  choice: पेड़ों के ऊपर झूमता फिरूँ
  rationale: क्रिया हिलने-डुलने या झूमने का चित्र प्रस्तुत करती है और इस दृष्टांत में पेड़ों पर शासन करने की विडंबनापूर्ण छवि भी रखती है। ‘झूमता फिरूँ’ वृक्ष-संबंधी चित्र को बचाता है, जबकि ‘ऊपर’ प्रभुत्व के संकेत को बनाए रखता है।
theological_decisions:
- issue: אֱלֹהִים का अभिप्राय
  choice: देवताओं
  alternative: परमेश्वर
  rationale: संज्ञा का रूप तथा क्रिया दोनों बहुवचन हैं, इसलिए ‘देवताओं’ को मुख्य पाठ में रखा गया है। फिर भी उपासना में जैतून के तेल के उपयोग के कारण इसे सच्चे परमेश्वर के लिए प्रयुक्त मानने की पुरानी अनुवाद-परंपरा है; इस वास्तविक विकल्प को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और कथात्मक रखी गई है। ‘झूमता फिरूँ’ मूल वृक्ष-चित्र और शासन के विडंबनापूर्ण संकेत दोनों को यथासंभव सुरक्षित रखता है। पादटिप्पणी-चिह्न उन्हीं शब्दों के बाद रखे गए हैं जिनसे वे संबंधित हैं।
