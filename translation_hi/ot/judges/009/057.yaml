id: JDG.9.57
reference: Judges 9:57
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/אֵ֗ת כָּל רָעַת֙ אַנְשֵׁ֣י שְׁכֶ֔ם הֵשִׁ֥יב אֱלֹהִ֖ים בְּ/רֹאשָׁ֑/ם וַ/תָּבֹ֣א אֲלֵי/הֶ֔ם קִֽלֲלַ֖ת יוֹתָ֥ם בֶּן יְרֻבָּֽעַל־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/057.yaml
  text: And God repaid all the evil of the men of Shechem on their own heads, and the curse of Jotham son of Jerubbaal came upon them.
translation:
  language: hi
  text: और शकेम के पुरुषों की सारी बुराई परमेश्वर ने उन्हीं के सिर पर लौटा दी; और यरुब्बाल के पुत्र योताम का शाप उन पर आ पड़ा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֵשִׁיב
  choice: लौटा दी
  rationale: हिफ़ील रूप, ‘बुराई’ को कर्म और ‘उनके सिर पर’ को पूरक बनाकर, यह व्यक्त करता है कि परमेश्वर ने उनकी की हुई बुराई का परिणाम उन्हीं पर लौटा दिया। यह चुनाव इब्रानी प्रतिदान-चित्र को बनाए रखता है।
- source_word: רָעַת
  choice: बुराई
  rationale: यहाँ शब्द शकेम के पुरुषों के नैतिक रूप से बुरे कर्म को दर्शाता है, केवल विपत्ति या हानि को नहीं।
- source_word: בְּרֹאשָׁם
  choice: उन्हीं के सिर पर
  rationale: यह इब्रानी मुहावरा बताता है कि कर्मों का फल स्वयं अपराधियों पर आया। ‘उन्हीं’ प्रतिवर्ती बल को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: קִלֲלַת
  choice: शाप
  rationale: संज्ञा अध्याय में पहले योताम द्वारा कहे गए शाप की ओर संकेत करती है; ‘शाप’ सहज और प्रसंगानुकूल है।
- source_word: וַתָּבֹא אֲלֵיהֶם
  choice: उन पर आ पड़ा
  rationale: यह न्याय-संबंधी भाषा है जिसमें शाप के प्रभावी हो जाने का भाव है; ‘आ पड़ा’ गति के रूपक और घटित न्याय दोनों को व्यक्त करता है।
- source_word: אַנְשֵׁי שְׁכֶם
  choice: शकेम के पुरुषों
  rationale: इब्रानी पद शाब्दिक रूप से ‘शकेम के पुरुष’ है। यह सामूहिक अर्थ रख सकता है, पर स्रोत की पुल्लिंग अभिव्यक्ति को सुरक्षित रखा गया है।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: एकवचन क्रिया के साथ यह इस्राएल के परमेश्वर को न्याय करते हुए दर्शाता है; हिन्दी बाइबलीय प्रयोग में ‘परमेश्वर’ स्वाभाविक और स्पष्ट है।
- source_word: יוֹתָם בֶּן יְרֻבָּעַל
  choice: यरुब्बाल के पुत्र योताम
  rationale: व्यक्तिनामों का हिन्दी में प्रचलित लिप्यंतरण किया गया है और पुत्र-संबंध को सीधे बनाए रखा गया है।
theological_decisions:
- issue: ईश्वरीय प्रतिदान की भाषा
  choice: परमेश्वर ने शकेम के पुरुषों की बुराई उन्हीं के सिर पर लौटा दी।
  alternative: परमेश्वर ने उनकी बुराई को उन पर लौट आने दिया।
  rationale: इब्रानी में परमेश्वर הֵשִׁיב का व्याकरणिक कर्ता है और सक्रिय न्याय करता है। इसलिए अनुवाद इस सक्रियता को केवल अनुमति के अर्थ में नरम नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘उन्हीं के सिर पर’ मूल इब्रानी चित्र को सुरक्षित रखता है, जबकि ‘आ पड़ा’ शाप के प्रभावी होने को स्वाभाविक हिन्दी में व्यक्त करता है।
