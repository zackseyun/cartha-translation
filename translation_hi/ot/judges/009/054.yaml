  text: וַ/יִּקְרָ֨א מְהֵרָ֜ה אֶל הַ/נַּ֣עַר נֹשֵׂ֣א כֵלָ֗י/ו וַ/יֹּ֤אמֶר ל/וֹ֙ שְׁלֹ֤ף חַרְבְּ/ךָ֙ וּ/מ֣וֹתְתֵ֔/נִי פֶּן יֹ֥אמְרוּ לִ֖/י אִשָּׁ֣ה הֲרָגָ֑תְ/הוּ וַ/יִּדְקְרֵ֥/הוּ נַעֲר֖/וֹ וַ/יָּמֹֽת־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/054.yaml
  text: Then he quickly called to the young man who carried his weapons and said to him[a], “Draw your sword and kill me, lest they say of me, ‘A woman killed him.’” So his young man pierced him through, and he died.
translation:
  language: hi
  text: तब उसने जल्दी से उस युवक को, जो उसके हथियार उठाए रहता था, बुलाकर उससे कहा[a], “अपनी तलवार खींच और मुझे मार डाल, कहीं ऐसा न हो कि लोग मेरे बारे में कहें, ‘एक स्त्री ने उसे मार डाला।’” तब उस युवक ने उसे भेद दिया, और वह मर गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, अधिक प्रचलित पद में, “अपने शस्त्रवाहक को बुलाकर उससे कहा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא מְהֵרָה
  choice: तब उसने जल्दी से ... बुलाकर
  rationale: वाव-क्रमिक क्रिया कथा को आगे बढ़ाती है, और מְהֵרָה जल्दबाज़ी दर्शाता है; यह रूप स्वाभाविक हिन्दी कथन देता है।
- source_word: הַנַּעַר נֹשֵׂא כֵלָיו
  choice: अपने हथियार ढोनेवाले जवान
  rationale: नַעַר का मूल अर्थ ‘जवान’ और נֹשֵׂא כֵלָיו का अर्थ उसके उपकरण या हथियार उठानेवाला है; मुख्य पाठ इस वर्णनात्मक अर्थ को बनाए रखता है।
- source_word: שְׁלֹף חַרְבְּךָ
  choice: अपनी तलवार खींच
  rationale: आज्ञार्थक क्रिया तलवार को म्यान से निकालने का निर्देश देती है; ‘तलवार खींच’ हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: וּמוֹתְתֵנִי
  choice: और मुझे मार डाल
  rationale: संदर्भ में क्रिया का भाव उसकी मृत्यु करा देने का सीधा अनुरोध है।
- source_word: פֶּן יֹאמְרוּ לִי
  choice: कहीं ऐसा न हो कि लोग मेरे बारे में कहें
  rationale: פֶּן आशंकित परिणाम को व्यक्त करता है; לִי यहाँ शाब्दिक ‘मुझसे’ के बजाय प्रसंगानुसार ‘मेरे बारे में’ है।
- source_word: אִשָּׁה הֲרָגָתְהוּ
  choice: ‘एक स्त्री ने उसे मार डाला’
  rationale: स्रोत की सक्रिय वाक्य-रचना और ‘स्त्री’ पर आरंभिक बल को सुरक्षित रखा गया है।
- source_word: וַיִּדְקְרֵהוּ
  choice: उसे तलवार से आर-पार कर दिया
  rationale: क्रिया हथियार से भेदने का बोध कराती है; प्रसंग से तलवार साधन है, और ‘आर-पार कर दिया’ हिंसक क्रिया की विशिष्टता रखता है।
- source_word: נַעֲרוֹ
  choice: उसके जवान
  rationale: पहले आए נַעַר के साथ शब्दगत संगति रखी गई है, यद्यपि प्रसंग में वह हथियार ढोनेवाला सेवक है।
