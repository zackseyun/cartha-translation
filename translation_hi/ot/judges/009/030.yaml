base_translation:
  language: en
  yaml_path: translation/ot/judges/009/030.yaml
  text: When Zebul[a], the ruler of the city, heard the words of Gaal son of Ebed, his anger burned.
translation:
  language: hi
  text: जब नगर के शासक ज़बूल ने एबेद के पुत्र गाल की बातें सुनीं, तो उसका क्रोध भड़क उठा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “उसकी नाक जल उठी”; यह क्रोधित होने का एक मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: जब ... ने ... सुनीं
  rationale: वाव-क्रमिक क्रिया कथा को आगे बढ़ाती है। हिन्दी में अगले परिणाम से इसका संबंध स्वाभाविक रूप से दिखाने के लिए ‘जब ... सुनीं, तो ...’ रखा गया है। यहाँ שׁמע का अर्थ कही गई बातों को सुनना है।
- source_word: זְבֻל
  choice: जबूल
  rationale: इब्रानी व्यक्ति-नाम का देवनागरी लिप्यंतरण।
- source_word: שַׂר הָעִיר
  choice: नगर के शासक
  rationale: שַׂר किसी प्रधान, अधिकारी या शासक को सूचित कर सकता है। ‘शासक’ जबूल के नागरिक अधिकार को व्यक्त करता है, पर किसी आधुनिक प्रशासनिक पद को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: אֶת דִּבְרֵי
  choice: की बातें
  rationale: शाब्दिक अर्थ ‘के शब्द’ है, पर इस प्रसंग में ‘की बातें’ सहज आधुनिक हिन्दी है और गाल द्वारा कही गई बातों को स्पष्ट रूप से व्यक्त करता है।
- source_word: גַּעַל בֶּן עָבֶד
  choice: एबेद के पुत्र गाल
  rationale: व्यक्ति-नामों का लिप्यंतरण किया गया है और इब्रानी पितृनाम-सूत्र को स्वाभाविक हिन्दी क्रम में रखा गया है।
- source_word: וַיִּחַר אַפּוֹ
  choice: उसका क्रोध भड़क उठा
  rationale: इब्रानी मुहावरे में नाक/क्रोध के जलने की छवि है। ‘क्रोध भड़क उठा’ उस रूपक की तीव्रता को सहज हिन्दी में बनाए रखता है, जबकि अत्यधिक शाब्दिक ‘उसकी नाक जल उठी’ अस्पष्ट होगा।
