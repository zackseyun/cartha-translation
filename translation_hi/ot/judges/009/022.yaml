  language: hi
  text: अबीमेलेक ने इस्राएल पर तीन वर्ष तक शासन किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשַׂר
  choice: शासन किया
  rationale: שׂרר यहाँ अधिकारपूर्वक राज करने या शासन चलाने का अर्थ देता है। आधुनिक हिन्दी में “शासन किया” स्वाभाविक है और राजनीतिक अधिकार का भाव बनाए रखता है।
- source_word: אֲבִימֶלֶךְ
  choice: अबीमेलेक
  rationale: व्यक्तिनाम को हिन्दी बाइबलीय परंपरा के प्रचलित रूप में लिप्यंतरित किया गया है।
- source_word: עַל
  choice: पर
  rationale: शासन-सूचक क्रिया के साथ עַל अधीनता या अधिकार के संबंध को व्यक्त करता है; हिन्दी में “पर” इसका सहज समतुल्य है।
- source_word: יִשְׂרָאֵל
  choice: इस्राएल
  rationale: राष्ट्रनाम का मानक हिन्दी लिप्यंतरण अपनाया गया है।
- source_word: שָׁלֹשׁ שָׁנִים
  choice: तीन वर्ष तक
  rationale: यह पदबंध शासन की अवधि बताता है; हिन्दी में “तीन वर्ष तक” समयावधि को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
