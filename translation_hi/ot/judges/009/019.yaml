source:
  edition: WLC
  text: וְ/אִם בֶּ/אֱמֶ֨ת וּ/בְ/תָמִ֧ים עֲשִׂיתֶ֛ם עִם יְרֻבַּ֥עַל וְ/עִם בֵּית֖/וֹ הַ/יּ֣וֹם הַ/זֶּ֑ה שִׂמְחוּ֙ בַּ/אֲבִימֶ֔לֶךְ וְ/יִשְׂמַ֥ח גַּם ה֖וּא בָּ/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/019.yaml
  text: And if today you have acted in truth and integrity toward Jerubbaal and toward his house[a], rejoice in Abimelech[c][b], and let him also rejoice in you.
translation:
  language: hi
  text: और यदि आज तुमने यरुब्बाल और उसके घराने[a] के साथ सच्चाई और खराई से व्यवहार किया है, तो अबीमेलेक के कारण आनन्द मनाओ, और वह भी तुम्हारे कारण आनन्द मनाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “घराना” परिवार, कुल या वंश को भी सूचित कर सकता है।
    reason: cultural_note
lexical_decisions:
- source_word: וְאִם
  choice: और यदि
  rationale: संयोजक और शर्त दोनों को रखते हुए योताम के पिछले कथन से प्रवाह बनाए रखता है।
- source_word: בֶּאֱמֶת וּבְתָמִים
  choice: सच्चाई और खराई से
  rationale: दोनों नैतिक गुणों—विश्वसनीय सच्चाई और निष्कपट नैतिक अखंडता—को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: עֲשִׂיתֶם עִם
  choice: के साथ ... व्यवहार किया है
  rationale: इब्रानी मुहावरे के संबंधपरक अर्थ को स्पष्ट और सहज हिन्दी में व्यक्त करता है।
- source_word: יְרֻבַּעַל
  choice: यरुब्बाल
  rationale: व्यक्तिवाचक नाम का हिन्दी लिप्यंतरण।
- source_word: בֵּיתוֹ
  choice: उसके घराने
  rationale: यहाँ 'घर' केवल भवन नहीं, बल्कि परिवार, कुल या वंश को सूचित करता है; 'घराना' इस व्यापक अर्थ को हिन्दी में सुरक्षित रखता है।
- source_word: הַיּוֹם הַזֶּה
  choice: आज
  rationale: शाब्दिक 'इस दिन' का स्वाभाविक आधुनिक हिन्दी समतुल्य।
- source_word: שִׂמְחוּ בַּאֲבִימֶלֶךְ
  choice: अबीमेलेक के कारण आनन्द मनाओ
  rationale: ב के कारण/आधार संबंधी भाव को स्वाभाविक हिन्दी में व्यक्त करता है और अस्पष्ट 'अबीमेलेक में' से बचता है।
- source_word: וְיִשְׂמַח גַּם הוּא בָּכֶם
  choice: और वह भी तुम्हारे कारण आनन्द मनाए
  rationale: अपूर्ण क्रिया के आज्ञार्थक/कामनार्थक बल और पहले खंड के पारस्परिक समानांतर को सुरक्षित रखता है।
