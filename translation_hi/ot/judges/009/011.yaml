  yaml_path: translation/ot/judges/009/011.yaml
  text: But the fig tree said to them[a], ‘Should I stop producing my sweetness and my good fruit, and go to sway over the trees?’
translation:
  language: hi
  text: परन्तु अंजीर के पेड़ ने उनसे कहा, “क्या मैं अपनी मिठास और अपना अच्छा फल देना छोड़ दूँ और जाकर पेड़ों के ऊपर डोलूँ[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पेड़ों पर शासन करूँ?” इब्रानी क्रिया का शाब्दिक अर्थ “डोलना,” “हिलना” या “झूमना” है। दृष्टान्त में यह वृक्ष की छवि को बनाए रखते हुए शासन करने का संकेत देती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: परन्तु … ने … कहा
  rationale: वाव-क्रम कथा को आगे बढ़ाता है; पिछले वृक्ष के इनकार के बाद यहाँ ‘परन्तु’ प्रसंग का विरोधात्मक प्रवाह स्वाभाविक रूप से व्यक्त करता है।
- source_word: הַתְּאֵנָה
  choice: अंजीर के पेड़
  rationale: संज्ञा इस दृष्टान्त-कथा में बोलने वाले अंजीर के वृक्ष को दर्शाती है; आधुनिक हिन्दी में यही स्वाभाविक रूप है।
- source_word: הֶחֳדַלְתִּי
  choice: क्या मैं … देना छोड़ दूँ
  rationale: यह पूर्ण क्रिया यहाँ विचारात्मक आलंकारिक प्रश्न का बल रखती है—‘क्या मैं छोड़ दूँ?’ ‘देना’ फल और मिठास के उत्पादन को हिन्दी में स्वाभाविक बनाने के लिए जोड़ा गया है।
- source_word: מָתְקִי
  choice: अपनी मिठास
  rationale: मूल शब्द मिठास के गुण को व्यक्त करता है; यह चयन मानवीकृत वृक्ष की मूल छवि को सुरक्षित रखता है।
- source_word: תְּנוּבָתִי הַטּוֹבָה
  choice: अपना अच्छा फल
  rationale: תְּנוּבָה का अर्थ उपज या फल है; अंजीर के पेड़ के संदर्भ में ‘फल’ सबसे सहज है और विशेषण ‘अच्छा’ को सीधे बनाए रखता है।
- source_word: וְהָלַכְתִּי
  choice: और जाकर
  rationale: यह पहले विचारात्मक प्रश्न के अधीन अगली क्रिया है; ‘और जाकर’ हिन्दी में क्रियाओं का संबंध स्वाभाविक रूप से व्यक्त करता है।
- source_word: לָנוּעַ
  choice: झूमूँ
  rationale: נוע का मूल अर्थ हिलना, डोलना या झूमना है। ‘झूमूँ’ वृक्ष की छवि बनाए रखता है, जबकि इस दृष्टान्त में शासन करने का निहित संकेत पादटिप्पणी में दिया गया है।
- source_word: עַל הָעֵצִים
  choice: पेड़ों पर
  rationale: עַל यहाँ वृक्षों के ऊपर स्थिति और रूपकतः उन पर अधिकार—दोनों अर्थों की संभावना रखता है; ‘पेड़ों पर’ इस द्विअर्थकता को बनाए रखता है।
