  text: וַ/יִּקַּ֣ח אֶת הָ/עָ֗ם וַֽ/יֶּחֱצֵ/ם֙ לִ/שְׁלֹשָׁ֣ה רָאשִׁ֔ים וַ/יֶּאֱרֹ֖ב בַּ/שָּׂדֶ֑ה וַ/יַּ֗רְא וְ/הִנֵּ֤ה הָ/עָם֙ יֹצֵ֣א מִן הָ/עִ֔יר וַ/יָּ֥קָם עֲלֵי/הֶ֖ם וַ/יַּכֵּֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/043.yaml
  text: He took the people[a], divided them into three companies, and lay in wait in the field. When he saw that the people were coming out of the city, he rose up against them and struck them down.
translation:
  language: hi
  text: उसने लोगों को लिया, उन्हें तीन दलों[a] में बाँट दिया और मैदान में घात लगाकर बैठ गया। जब उसने देखा कि नगर के लोग बाहर निकल रहे हैं, तो वह उन पर आ पड़ा और उन्हें मारा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘तीन टुकड़ियों/समूहों में।’ शाब्दिक रूप से, ‘तीन सिरों में’; यह हिब्रू मुहावरा दलों या टुकड़ियों के लिए है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח אֶת הָעָם
  choice: उसने अपने लोगों को लेकर
  rationale: עָם का मूल अर्थ ‘लोग’ है, पर यहाँ सैन्य प्रसंग में अबीमेलेक के अधीन लोगों का संकेत है। ‘अपने लोगों’ से संदर्भ स्पष्ट होता है, बिना उन्हें अनिवार्य रूप से ‘सैनिक’ कहने के।
- source_word: וַיֶּחֱצֵם לִשְׁלֹשָׁה רָאשִׁים
  choice: उन्हें तीन दलों में बाँट दिया
  rationale: חצה का अर्थ ‘बाँटना’ है और רָאשִׁים (‘सिर’) यहाँ दलों या टुकड़ियों के लिए हिब्रू मुहावरा है। ‘तीन दल’ आधुनिक हिन्दी में स्वाभाविक और संदर्भानुकूल है।
- source_word: וַיֶּאֱרֹב בַּשָּׂדֶה
  choice: मैदान में घात लगाकर बैठ गया
  rationale: ארב छिपकर अवसर की प्रतीक्षा करने या घात लगाने को व्यक्त करता है। यह रूप हिन्दी में क्रिया की प्रतीक्षात्मक बारीकी और स्थान दोनों रखता है।
- source_word: וַיַּרְא וְהִנֵּה
  choice: जब उसने देखा कि
  rationale: וְהִנֵּה दृश्य को सजीव बनाता है। आधुनिक हिन्दी में ‘जब उसने देखा कि’ कथानक का प्रवाह स्वाभाविक रखता है और अवलोकन का भाव देता है।
- source_word: הָעָם יֹצֵא מִן־הָעִיר
  choice: नगर के लोग बाहर निकल रहे हैं
  rationale: यहाँ הָעָם नगर से निकलने वाले लोगों को दर्शाता है और सहभागी יֹצֵא चल रही क्रिया का भाव देता है। हिन्दी की अप्रत्यक्ष कथन-शैली में ‘निकल रहे हैं’ स्वाभाविक है।
- source_word: וַיָּקָם עֲלֵיהֶם
  choice: वह उन पर टूट पड़ा
  rationale: קום על का अर्थ किसी के विरुद्ध उठ खड़ा होना या आक्रमण करना है। ‘टूट पड़ा’ घात से किए गए अचानक आक्रमण को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וַיַּכֵּם
  choice: उन्हें मार गिराया
  rationale: נכה का अर्थ प्रहार करना, परास्त करना या मार गिराना हो सकता है। ‘मार गिराया’ निर्णायक हिंसक प्रहार बताता है, पर ‘सबको मार डाला’ जैसी अनावश्यक स्पष्टता नहीं जोड़ता।
