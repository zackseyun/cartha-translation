id: JDG.9.16
reference: Judges 9:16
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/עַתָּ֗ה אִם בֶּ/אֱמֶ֤ת וּ/בְ/תָמִים֙ עֲשִׂיתֶ֔ם וַ/תַּמְלִ֖יכוּ אֶת אֲבִימֶ֑לֶךְ וְ/אִם טוֹבָ֤ה עֲשִׂיתֶם֙ עִם יְרֻבַּ֣עַל וְ/עִם בֵּית֔/וֹ וְ/אִם כִּ/גְמ֥וּל יָדָ֖י/ו עֲשִׂ֥יתֶם לֽ/וֹ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/016.yaml
  text: Now therefore[a], if you have acted in truth and integrity when you made Abimelech king, and if you have dealt well with Jerubbaal and with his house, and if you have dealt with him according to the recompense of his hands,
translation:
  language: hi
  text: अब इसलिए, यदि तुमने सच्चाई और निष्कपटता से काम किया है और अबीमेलेक को राजा बनाया है, और यदि तुमने यरुब्बाल और उसके घराने के साथ भलाई की है, और यदि तुमने उसके कर्मों के प्रतिफल के अनुसार उसके साथ व्यवहार किया है[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जैसा उसके कामों का फल उसे मिलना चाहिए था।” शाब्दिक रूप से, “उसके हाथों के प्रतिफल के अनुसार।” हिब्रू मुहावरा किसी व्यक्ति के कामों के अनुरूप उसके साथ किए गए व्यवहार को दर्शाता है।
    reason: ‘हाथों’ वाली शाब्दिक छवि और कर्मानुरूप व्यवहार के मुहावरेदार अर्थ, दोनों को स्पष्ट करने के लिए।
lexical_decisions:
- source_word: וְעַתָּה
  choice: इसलिए अब
  rationale: यह पद पिछले कथन से वर्तमान शर्तपूर्ण चुनौती की ओर बढ़ता है; यह रूप कालगत और निष्कर्षसूचक दोनों बल व्यक्त करता है।
- source_word: בֶּאֱמֶת וּבְתָמִים
  choice: सच्चाई और खराई से
  rationale: दोनों नैतिक शब्द आचरण की विश्वसनीयता और निष्कपट समग्रता बताते हैं; आधुनिक हिंदी में यह युग्म स्वाभाविक और गरिमापूर्ण है।
- source_word: וַתַּמְלִיכוּ אֶת אֲבִימֶלֶךְ
  choice: और अबीमेलेक को राजा बनाया है
  rationale: हिफ़ील क्रिया का अर्थ किसी को राज्य करने के पद पर स्थापित करना है; ‘राजा बनाया’ स्पष्ट और सीधा है।
- source_word: טוֹבָה עֲשִׂיתֶם עִם
  choice: के साथ भलाई की है
  rationale: हिब्रू मुहावरे ‘किसी के साथ भलाई करना’ को हिंदी में स्वाभाविक रूप से बनाए रखता है।
- source_word: יְרֻבַּעַל
  choice: यरुब्बाल
  rationale: मूल पाठ में प्रयुक्त इसी नाम को लिप्यंतरित किया गया है, न कि उसके दूसरे नाम गिदोन को प्रतिस्थापित किया गया।
- source_word: בֵּיתוֹ
  choice: उसके घराने
  rationale: यह परिवार और व्यापक वंशगत समूह दोनों को समेट सकता है; ‘घराना’ हिंदी में इस सामूहिक अर्थ को सहजता से व्यक्त करता है।
- source_word: כִּגְמוּל יָדָיו
  choice: उसके हाथों के प्रतिफल के अनुसार
  rationale: यह चयन हाथों की ठोस हिब्रू छवि को सुरक्षित रखता है और उस व्यवहार की ओर संकेत करता है जो उसके कर्मों के अनुरूप होना चाहिए था।
- source_word: עֲשִׂיתֶם לוֹ
  choice: उसके साथ व्यवहार किया है
  rationale: मूल की व्यापक क्रिया को इस मूल्यांकनात्मक प्रसंग में स्वाभाविक हिंदी के रूप में प्रस्तुत करता है।
theological_decisions:
- issue: כִּגְמוּל יָדָיו का नैतिक मूल्य
  choice: मुख्य पाठ में तटस्थ मुहावरा ‘उसके हाथों के प्रतिफल के अनुसार’ रखा गया
  alternative: ‘जैसा उसके कामों का बदला होना चाहिए था’
  rationale: इस शर्त-वाक्य में प्रतिफल सम्मान या दंड दोनों के सिद्धांत को व्यक्त कर सकता है; उसे केवल ‘योग्य इनाम’ या ‘सज़ा’ मान लेना मूल की व्यापकता को अनावश्यक रूप से सीमित करेगा।
translation_notes:
  register: आधुनिक मानक हिंदी; स्वर गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध है। पद की तीनों शर्तों और अगले पद तक जारी रहने वाली अपूर्ण वाक्य-रचना को अंतिम डैश द्वारा बनाए रखा गया है।
