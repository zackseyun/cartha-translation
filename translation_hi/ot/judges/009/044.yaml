  text: וַ/אֲבִימֶ֗לֶךְ וְ/הָ/רָאשִׁים֙ אֲשֶׁ֣ר עִמּ֔/וֹ פָּשְׁט֕וּ וַ/יַּ֣עַמְד֔וּ פֶּ֖תַח שַׁ֣עַר הָ/עִ֑יר וּ/שְׁנֵ֣י הָֽ/רָאשִׁ֗ים פָּֽשְׁט֛וּ עַֽל כָּל אֲשֶׁ֥ר בַּ/שָּׂדֶ֖ה וַ/יַּכּֽוּ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/044.yaml
  text: And Abimelech and the leaders who were with him rushed forward and took their stand at the entrance of the city gate[a], while the two other companies rushed against everyone who was in the field and struck them down.
translation:
  language: hi
  text: अबीमेलेक और उसके साथ के अगुवे झपटकर आगे बढ़े और नगर के फाटक के मुहाने पर मोर्चा सँभालकर खड़े हो गए; और बाकी दो दल[a] मैदान में मौजूद सभी लोगों पर टूट पड़े और उन्हें मार गिराया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से ‘दो अगुवे’। पिछले पद में सेना को तीन दलों में बाँटने का उल्लेख है, इसलिए यहाँ संभवतः बाकी दो दल अभिप्रेत हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּשְׁטוּ
  choice: झपटकर आगे बढ़े / टूट पड़े
  rationale: सैनिक प्रसंग में क्रिया तीव्र आक्रमणकारी बढ़त बताती है। दोनों स्थानों पर प्रसंगानुकूल स्वाभाविक हिन्दी प्रयोग किए गए हैं।
- source_word: הָרָאשִׁים
  choice: अगुवे
  rationale: शाब्दिक अर्थ ‘सिर’ है, पर यहाँ अबीमेलेक के साथ सैन्य नेतृत्व करने वाले व्यक्तियों का संकेत है। ‘अगुवे’ सरल और गरिमापूर्ण आधुनिक हिन्दी है।
- source_word: וַיַּעַמְדוּ
  choice: मोर्चा सँभालकर खड़े हो गए
  rationale: केवल खड़े होने के बजाय युद्ध में जानबूझकर स्थान ग्रहण करने का भाव व्यक्त करता है।
- source_word: פֶּתַח שַׁעַר הָעִיר
  choice: नगर के फाटक के प्रवेश पर
  rationale: इब्रानी पदबंध में नगर-फाटक के मुख अथवा प्रवेश-स्थान का ठोस स्थानिक संकेत सुरक्षित रखा गया है।
- source_word: וּשְׁנֵי הָרָאשִׁים
  choice: बाकी दो दल
  rationale: पाठ में शाब्दिक रूप से ‘दो अगुवे’ है, किंतु पिछले पद में सेना के तीन दलों में बाँटे जाने के कारण यहाँ शेष दो सैन्य दल संदर्भतः अभिप्रेत जान पड़ते हैं; शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
- source_word: עַל כָּל אֲשֶׁר בַּשָּׂדֶה
  choice: मैदान में मौजूद सभी लोगों पर
  rationale: आगे आए बहुवचन कर्म-सर्वनाम और मारने की क्रिया से मनुष्य अभिप्रेत हैं; हिन्दी में इसे स्पष्ट किया गया है।
- source_word: וַיַּכּוּם
  choice: उन्हें मार गिराया
  rationale: נכה यहाँ हिंसक प्रहार से गिराने या मार डालने का अर्थ दे सकता है। ‘मार गिराया’ हिंसा और परिणाम व्यक्त करता है, पर प्रत्येक व्यक्ति की मृत्यु को आवश्यकता से अधिक निश्चित नहीं करता।
