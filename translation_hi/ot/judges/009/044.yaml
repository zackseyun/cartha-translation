  terminology: “अगुवे,” “दल,” and “मोर्चा सँभालकर खड़े हो गए” fit the military context. The footnote’s “दो अगुवे” correctly reflects the literal Hebrew while the main text’s “बाकी दो दल” responsibly follows the immediate context.
