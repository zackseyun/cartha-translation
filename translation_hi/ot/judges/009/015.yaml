  text: וַ/יֹּ֣אמֶר הָ/אָטָד֮ אֶל הָ/עֵצִים֒ אִ֡ם בֶּ/אֱמֶ֣ת אַתֶּם֩ מֹשְׁחִ֨ים אֹתִ֤/י לְ/מֶ֨לֶךְ֙ עֲלֵי/כֶ֔ם בֹּ֖אוּ חֲס֣וּ בְ/צִלִּ֑/י וְ/אִם אַ֕יִן תֵּ֤צֵא אֵשׁ֙ מִן הָ֣/אָטָ֔ד וְ/תֹאכַ֖ל אֶת אַרְזֵ֥י הַ/לְּבָנֽוֹן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/015.yaml
  text: Then the bramble said to the trees[a], ‘If you are truly anointing me as king over you, come, take refuge in my shade; but if not[c][b], let fire come out from the bramble and consume the cedars of Lebanon.’
translation:
  language: hi
  text: तब काँटेदार झाड़ी[a] ने पेड़ों से कहा, “यदि तुम सचमुच मेरा अभिषेक अपने राजा के रूप में कर रहे हो, तो आओ, मेरी छाया में शरण लो[b]; पर यदि नहीं, तो काँटेदार झाड़ी से आग निकले[c] और लबानोन के देवदारों को भस्म कर दे।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्द किसी काँटेदार झाड़ी को दर्शाता है; उसकी ठीक प्रजाति निश्चित नहीं है।
    reason: lexical_alternative
  - marker: b
    text: “शरण लो” का अनुवाद “आश्रय लो” भी हो सकता है। काँटेदार झाड़ी बहुत कम छाया देती है, इसलिए इन शब्दों में विडंबना हो सकती है।
    reason: lexical_alternative
  - marker: c
    text: इसका अनुवाद “काँटेदार झाड़ी से आग निकलेगी” भी हो सकता है। इब्रानी क्रिया को शाप-सदृश इच्छा या भविष्यसूचक कथन, दोनों रूपों में समझा जा सकता है।
    reason: source_ambiguity
lexical_decisions:
- source_word: הָאָטָד
  choice: काँटेदार झाड़ी
  rationale: यह इब्रानी शब्द किसी काँटेदार झाड़ी को दर्शाता है, पर उसकी ठीक प्रजाति अनिश्चित है। यह चयन कथा में बड़े और प्रतिष्ठित वृक्षों के साथ उसके विरोध को स्वाभाविक रूप से बनाए रखता है।
- source_word: אִם בֶּאֱמֶת
  choice: यदि तुम सचमुच
  rationale: यह वाक्यांश कार्य की सच्चाई या गंभीरता पर बल देता है; ‘सचमुच’ आधुनिक हिन्दी में उसकी चुनौतीपूर्ण शर्त को स्पष्ट रखता है।
- source_word: מֹשְׁחִים אֹתִי לְמֶלֶךְ עֲלֵיכֶם
  choice: मेरा अभिषेक करके मुझे अपना राजा बना रहे हो
  rationale: ‘अभिषेक’ मूल के विशिष्ट राजकीय कार्य को सुरक्षित रखता है, जबकि पूरा वाक्यांश आधुनिक हिन्दी में स्वाभाविक ढंग से उनके ऊपर उसके शासन का भाव व्यक्त करता है।
- source_word: בֹּאוּ חֲסוּ בְצִלִּי
  choice: आओ, मेरी छाया में शरण लो
  rationale: यह निकट आने और सुरक्षा पाने के दोनों आदेशों को बनाए रखता है। झाड़ी की बहुत कम छाया होने के कारण कथन में निहित विडंबना भी बनी रहती है।
- source_word: וְאִם אַיִן
  choice: पर यदि नहीं
  rationale: यह पहली शर्त के विपरीत परिणाम की ओर स्पष्ट और स्वाभाविक संक्रमण करता है।
- source_word: תֵּצֵא אֵשׁ מִן הָאָטָד
  choice: काँटेदार झाड़ी से आग निकले
  rationale: ‘निकले’ इब्रानी अपूर्ण क्रिया के शाप-सदृश इच्छार्थक बल को रखता है, साथ ही उसका भविष्यसूचक अर्थ भी संभव है।
- source_word: וְתֹאכַל
  choice: भस्म कर दे
  rationale: आग के साथ प्रयुक्त ‘खाने’ की इब्रानी उक्ति का यह स्वाभाविक हिन्दी रूप है और पूर्ण विनाश का भाव व्यक्त करता है।
- source_word: אַרְזֵי הַלְּבָנוֹן
  choice: लबानोन के देवदारों
  rationale: यह विशाल और प्रतिष्ठित देवदारों के प्रसिद्ध भौगोलिक संकेत को स्पष्ट रूप से बनाए रखता है।
theological_decisions:
- issue: תֵּצֵא का इच्छार्थक या भविष्यसूचक बल
  choice: आग निकले
  alternative: आग निकलेगी
  rationale: प्रसंग में यह शाप-सदृश घोषणा इच्छार्थक रूप ग्रहण कर सकती है, किंतु इब्रानी अपूर्ण क्रिया साधारण भविष्यवाणी के रूप में भी समझी जा सकती है; इसलिए वैकल्पिक अर्थ को पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘अभिषेक’, ‘शरण’ और ‘देवदार’ जैसे परिचित बाइबिलीय शब्द मूल के राजकीय और काव्यात्मक स्वर को बनाए रखते हैं; अनिश्चित वनस्पति-प्रजाति और क्रिया के इच्छार्थक/भविष्यसूचक भेद को बिना अनावश्यक रूप से तय किए पादटिप्पणियों में स्पष्ट किया गया है।
