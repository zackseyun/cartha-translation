  language: hi
  text: तब पेड़ों ने अंजीर के पेड़ से कहा, “तू जाकर हम पर राज कर।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: तब ... कहा
  rationale: वाव-क्रमिक रूप कथा को आगे बढ़ाता है; ‘तब’ घटनाक्रम की क्रमिकता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הָעֵצִים
  choice: पेड़ों
  rationale: इस दृष्टांत में עֵצִים बोलने वाले वृक्षों को सूचित करता है, इसलिए ‘पेड़’ प्रसंगानुकूल है।
- source_word: לַתְּאֵנָה
  choice: अंजीर के पेड़ से
  rationale: תְּאֵנָה यहाँ फल नहीं, अंजीर का वृक्ष है; ל बोलने के अप्रत्यक्ष कर्म को दर्शाता है।
- source_word: לְכִי אַתְּ
  choice: तू आकर
  rationale: स्त्रीलिंग एकवचन आज्ञार्थक और स्पष्ट सर्वनाम मिलकर सीधे, बलयुक्त संबोधन देते हैं। ‘तू’ उस एकवचन निकट संबोधन को बनाए रखता है, और ‘आकर’ हिन्दी में संयुक्त आज्ञा को स्वाभाविक बनाता है।
- source_word: מָלְכִי
  choice: राज कर
  rationale: מלך का स्त्रीलिंग एकवचन आज्ञार्थक रूप राजा के समान शासन करने का भाव देता है; ‘राज कर’ संक्षिप्त और स्वाभाविक हिन्दी है।
- source_word: עָלֵינוּ
  choice: हम पर
  rationale: מלך के साथ על प्रजा पर शासन का संबंध व्यक्त करता है; हिन्दी में ‘हम पर राज कर’ इसका सामान्य रूप है।
