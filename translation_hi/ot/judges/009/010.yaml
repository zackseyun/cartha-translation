  source_fidelity: The draft correctly identifies the trees, fig tree, direct address, and rule ‘over us.’ However, ‘आकर’ means ‘having come/come and,’ whereas the Hebrew feminine singular imperative לְכִי is from הלך, ‘go.’ In this fable’s repeated invitation formula, the movement imperative should not be reversed.
