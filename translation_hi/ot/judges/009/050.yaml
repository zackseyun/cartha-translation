base_translation:
  language: en
  yaml_path: translation/ot/judges/009/050.yaml
  text: Then Abimelech went to Thebez[a], camped against Thebez, and captured it.
translation:
  language: hi
  text: तब अबीमेलेक तेबेस गया। उसने तेबेस के विरुद्ध पड़ाव डाला[a] और उस पर अधिकार कर लिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तेबेस में पड़ाव डाला”; इब्रानी संबंधबोधक उपसर्ग का अधिक शाब्दिक अनुवाद ऐसा हो सकता है, पर इस सैन्य प्रसंग में आशय संभवतः नगर के विरुद्ध पड़ाव डालने का है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: गया
  rationale: הלך का सामान्य कथात्मक अर्थ ‘जाना’ है; ‘चढ़ाई की’ कहने से क्रिया में ऐसा सैन्य भाव जुड़ जाता जो स्वयं इसमें स्पष्ट नहीं है।
- source_word: אֲבִימֶלֶךְ
  choice: अबीमेलेक
  rationale: व्यक्तिनाम का प्रचलित हिंदी बाइबलीय लिप्यंतरण।
- source_word: אֶל תֵּבֵץ
  choice: तेबेस गया
  rationale: אֶל यहाँ स्थान की ओर गति बताता है; स्वाभाविक हिंदी में गंतव्य को ‘तेबेस गया’ से व्यक्त किया गया है।
- source_word: וַיִּחַן בְּתֵבֵץ
  choice: तेबेस के विरुद्ध पड़ाव डाला
  rationale: חנה का अर्थ पड़ाव डालना है। नगर पर अधिकार करने के सैन्य प्रसंग में בְּ को ‘के विरुद्ध’ समझना सर्वाधिक स्वाभाविक है, यद्यपि उसका अधिक शाब्दिक अर्थ ‘में’ भी हो सकता है।
- source_word: וַיִּלְכְּדָהּ
  choice: उस पर अधिकार कर लिया
  rationale: לכד किसी नगर को पकड़ने या अपने अधिकार में लेने के लिए प्रयुक्त होता है; स्त्रीलिंग प्रत्यय तेबेस नगर की ओर संकेत करता है।
theological_decisions: []
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिंदी। छोटे कथात्मक वाक्यों से इब्रानी घटनाक्रम की क्रमिक गति रखी गई है; स्थाननाम के लिए प्रचलित रूप ‘तेबेस’ अपनाया गया है।
