base_translation:
  language: en
  yaml_path: translation/ot/judges/009/025.yaml
  text: Then the leaders of Shechem set men in ambush for him on the tops of the mountains[a], and they robbed everyone who passed by them on the road; and it was reported to Abimelech.
translation:
  language: hi
  text: तब शकेम के अगुओं[a] ने अबीमेलेक के विरुद्ध पहाड़ों की चोटियों पर घात लगानेवालों को तैनात कर दिया। सड़क पर उनके पास से होकर गुजरने वाले हर व्यक्ति को वे लूट लेते थे, और इसकी सूचना अबीमेलेक को दी गई।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “शकेम के नागरिक” अथवा “शकेम के स्वामी।” इब्रानी अभिव्यक्ति का शाब्दिक अर्थ “शकेम के स्वामी/अधिकार रखनेवाले” है और यह नगर के प्रमुख या प्रभावशाली लोगों को सूचित कर सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בַעֲלֵי שְׁכֶם
  choice: शकेम के अगुओं
  rationale: בַעֲלֵי का मूल अर्थ ‘स्वामी/अधिकार रखनेवाले’ है, पर इस नगर-राजनीतिक संदर्भ में यह शकेम के प्रभावशाली अगुओं को सूचित करता है। ‘अगुओं’ से यह भाव स्वाभाविक आधुनिक हिन्दी में आता है, जबकि मूल की व्यापकता पादटिप्पणी में सुरक्षित है।
- source_word: וַיָּשִׂימוּ לוֹ מְאָרְבִים
  choice: अबीमेलेक के विरुद्ध ... घात लगानेवाले बैठा दिए
  rationale: שׂים के साथ לוֹ और बहुवचन कृदन्त מְאָרְבִים मिलकर किसी के विरुद्ध घात लगानेवालों को तैनात करने का भाव देते हैं। सर्वनाम की जगह अबीमेलेक का नाम रखने से हिन्दी में संदर्भ स्पष्ट रहता है।
- source_word: עַל רָאשֵׁי הֶהָרִים
  choice: पहाड़ों की चोटियों पर
  rationale: यह इब्रानी के शाब्दिक चित्र ‘पहाड़ों के सिरों पर’ को स्वाभाविक हिन्दी में निकटता से व्यक्त करता है।
- source_word: וַיִּגְזְלוּ
  choice: लूट लेते थे
  rationale: גזל बलपूर्वक छीनने या लूटने को दर्शाता है। अपूर्णकालिक हिन्दी रूप मार्ग से गुजरनेवालों के साथ बार-बार किए गए कार्य को सहज रूप से व्यक्त करता है।
- source_word: אֵת כָּל אֲשֶׁר יַעֲבֹר עֲלֵיהֶם בַּדָּרֶךְ
  choice: जो कोई सड़क पर उनके पास से होकर निकलता, उसे
  rationale: כָּל के बाद एकवचन क्रिया का वितरणात्मक अर्थ ‘जो कोई’ से व्यक्त होता है; בַּדָּרֶךְ के निश्चित मार्ग-संदर्भ के लिए ‘सड़क पर’ चुना गया है।
- source_word: וַיֻּגַּד לַאֲבִימֶלֶךְ
  choice: इसकी खबर अबीमेलेक को दी गई
  rationale: निष्क्रिय होफाल रूप सूचना देनेवाले को अनिर्दिष्ट छोड़ता है; हिन्दी का कर्मवाच्य उसी विशेषता को बनाए रखता है।
