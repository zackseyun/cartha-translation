  text: וַ/יִּשְׁלַ֤ח אֱלֹהִים֙ ר֣וּחַ רָעָ֔ה בֵּ֣ין אֲבִימֶ֔לֶךְ וּ/בֵ֖ין בַּעֲלֵ֣י שְׁכֶ֑ם וַ/יִּבְגְּד֥וּ בַעֲלֵי שְׁכֶ֖ם בַּ/אֲבִימֶֽלֶךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/023.yaml
  text: Then God sent an evil spirit between Abimelech and the leaders of Shechem[c][b][a], and the leaders of Shechem dealt treacherously with Abimelech.
translation:
  language: hi
  text: तब परमेश्वर ने अबीमेलेक और शकेम के अगुओं[b] के बीच एक दुष्ट आत्मा[a] भेजी, और शकेम के अगुओं ने अबीमेलेक के साथ विश्वासघात किया[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “एक हानिकारक आत्मा।” इब्रानी पद नैतिक बुराई या हानिकारक प्रभाव—दोनों में से किसी पर बल दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “शकेम के स्वामी”; यहाँ आशय संभवतः नगर के प्रभावशाली पुरुषों या नागरिक अगुओं से है।
    reason: lexical_alternative
  - marker: c
    text: या, “अबीमेलेक के विरुद्ध विश्वासघाती व्यवहार किया” अथवा “अबीमेलेक को धोखा दिया।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: भेजी
  rationale: שׁלח का कथात्मक रूप सीधे ‘भेजना’ दर्शाता है; स्त्रीलिंग क्रिया ‘आत्मा’ के अनुसार है और परमेश्वर की प्रत्यक्ष कर्तृता बनाए रखती है।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: इस कथानक में यह इस्राएल के परमेश्वर को सूचित करता है; आधुनिक हिन्दी बाइबलीय गद्य में ‘परमेश्वर’ स्वाभाविक और गरिमापूर्ण है।
- source_word: רוּחַ רָעָה
  choice: एक दुष्ट आत्मा
  rationale: यह सीधा अनुवाद רָעָה के नैतिक बुराई और हानिकारक प्रभाव—दोनों संभावित पहलुओं को खुला रखता है; ‘हानिकारक आत्मा’ को पादटिप्पणी में विकल्प दिया गया है।
- source_word: בֵּין ... וּבֵין
  choice: के बीच
  rationale: युग्मित पूर्वसर्ग दोनों पक्षों के बीच उत्पन्न वैमनस्य या विभाजन को व्यक्त करते हैं।
- source_word: בַּעֲלֵי שְׁכֶם
  choice: शकेम के अगुए
  rationale: בַּעֲלֵי का शाब्दिक अर्थ ‘स्वामी/अधिपति’ है, पर यहाँ नगर के प्रभावशाली नागरिक-नेताओं का बोध होता है; ‘अगुए’ अर्थ और सामाजिक भूमिका दोनों स्पष्ट करता है।
- source_word: וַיִּבְגְּדוּ
  choice: विश्वासघात किया
  rationale: בגד निष्ठाहीन अथवा छलपूर्ण व्यवहार को दर्शाता है; ‘विश्वासघात किया’ आधुनिक हिन्दी में स्वाभाविक और अर्थतः सटीक है।
- source_word: בַּאֲבִימֶלֶךְ
  choice: अबीमेलेक के साथ
  rationale: בגד के साथ ב उस व्यक्ति को चिह्नित करता है जिसके प्रति विश्वासघात हुआ; हिन्दी में ‘के साथ विश्वासघात किया’ स्वाभाविक प्रयोग है।
theological_decisions:
- issue: दुष्ट आत्मा भेजने में परमेश्वर की कर्तृता
  choice: ‘परमेश्वर ने ... एक दुष्ट आत्मा भेजी’ के रूप में प्रत्यक्ष कर्तृता रखी गई है।
  alternative: ‘परमेश्वर ने एक दुष्ट आत्मा को आने दिया’ अथवा ‘वैमनस्य की भावना उत्पन्न होने दी।’
  rationale: इब्रानी क्रिया और वाक्य-विन्यास भेजने का कार्य सीधे परमेश्वर को देते हैं। इसे केवल अनुमति में बदलना पाठ की धर्मवैचारिक कठिनाई को व्याख्या द्वारा हल करना होगा; अनुवाद उस तनाव को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण कथात्मक शैली अपनाई गई है। ‘दुष्ट आत्मा’ मूल की धर्मवैचारिक तीक्ष्णता बनाए रखता है; ‘अगुए’ नागरिक-राजनीतिक संदर्भ को सामान्य पाठक के लिए स्पष्ट करता है। सभी पादटिप्पणी-चिह्न संबंधित पदों के तुरंत बाद रखे गए हैं।
