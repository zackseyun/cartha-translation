  text: וְ/אִם אַ֕יִן תֵּ֤צֵא אֵשׁ֙ מֵ/אֲבִימֶ֔לֶךְ וְ/תֹאכַ֛ל אֶת בַּעֲלֵ֥י שְׁכֶ֖ם וְ/אֶת בֵּ֣ית מִלּ֑וֹא וְ/תֵצֵ֨א אֵ֜שׁ מִ/בַּעֲלֵ֤י שְׁכֶם֙ וּ/מִ/בֵּ֣ית מִלּ֔וֹא וְ/תֹאכַ֖ל אֶת אֲבִימֶֽלֶךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/020.yaml
  text: But if not[a], let fire come out from Abimelech and consume the leaders of Shechem and Beth-millo[b]; and let fire come out from the leaders of Shechem and from Beth-millo and consume Abimelech.
translation:
  language: hi
  text: पर यदि ऐसा नहीं है, तो अबीमेलेक से आग निकले और शकेम के शासकों[a] और बेत-मिल्लो[b] को भस्म कर दे; और शकेम के शासकों और बेत-मिल्लो से आग निकले और अबीमेलेक को भस्म कर दे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘शकेम के स्वामी’; इससे नगर के अधिकार-संपन्न शासक या प्रमुख व्यक्ति अभिप्रेत हैं।
    reason: lexical_alternative
  - marker: b
    text: ‘बेत-मिल्लो’ का अनुवाद ‘मिल्लो का घर’ भी हो सकता है। सम्भवतः यह शकेम से जुड़ा कोई स्थान या शासकीय समुदाय था।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם אַיִן
  choice: पर यदि ऐसा नहीं है
  rationale: यह पिछले पद की शर्त के विपरीत पक्ष को स्वाभाविक हिन्दी में व्यक्त करता है और नकारात्मक शर्त को स्पष्ट रखता है।
- source_word: תֵּצֵא אֵשׁ
  choice: आग निकले
  rationale: यहाँ यिक़्तोल का शापसूचक/कामनासूचक बल है; यह रूप केवल भविष्यवाणी मान लेने के बजाय उस बल को बनाए रखता है।
- source_word: וְתֹאכַל
  choice: और ... को भस्म कर दे
  rationale: आग के कर्ता होने पर אכל का अर्थ नष्ट कर देना या भस्म करना है; ‘भस्म कर दे’ अग्नि-बिंब और विनाशकारी बल दोनों को स्वाभाविक हिन्दी में रखता है।
- source_word: בַּעֲלֵי שְׁכֶם
  choice: शकेम के शासक
  rationale: बहुवचन בַּעֲלֵי यहाँ नगर के अधिकार-संपन्न प्रमुख पुरुषों को सूचित करता है; ‘शासक’ राजनीतिक-सामाजिक अधिकार को स्पष्ट करता है।
- source_word: בֵּית מִלּוֹא
  choice: बेत-मिल्लो
  rationale: इसे सम्भावित स्थान अथवा सम्बद्ध शासकीय समुदाय के नाम के रूप में लिप्यंतरित किया गया है, क्योंकि पद स्वयं इसका स्वरूप निश्चित नहीं करता।
- source_word: מֵאֲבִימֶלֶךְ ... מִבַּעֲלֵי שְׁכֶם וּמִבֵּית מִלּוֹא
  choice: अबीमेलेक से ... शकेम के शासकों और बेत-मिल्लो से
  rationale: दोनों दिशाओं में ‘से’ रखकर पारस्परिक विनाश की सममित शाप-संरचना सुरक्षित की गई है।
theological_decisions:
- issue: ‘आग’ के बिंब का स्वरूप
  choice: मुख्य पाठ में ‘आग’ का ठोस बिंब ज्यों का त्यों रखा गया है।
  alternative: इसे सीधे ‘हिंसक संघर्ष’ कहना, अथवा स्पष्ट रूप से ‘परमेश्वर की आग’ कहना।
  rationale: इब्रानी पाठ आग को शापसूचक कथन में रखता है, पर यह निर्धारित नहीं करता कि वह शाब्दिक है, पारस्परिक हिंसा का रूपक है, या दोनों; अनुवाद इस तनाव को खुला रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी रखी गई है। दोनों अर्ध-पंक्तियों की समानांतर बनावट सुरक्षित है। ‘शासक’ सामान्य पाठक के लिए स्पष्ट है, जबकि पादटिप्पणी मूल पद की शाब्दिक सम्भावना बताती है।
