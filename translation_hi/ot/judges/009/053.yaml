  rationale: शाब्दिक अर्थ ‘एक स्त्री’ है और यह उस अनाम स्त्री की निर्णायक भूमिका पर हल्का बल बनाए रखता है।
- source_word: פֶּלַח רֶכֶב
  choice: चक्की का ऊपरी पाट
