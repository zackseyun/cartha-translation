- source_word: עַל רֹאשׁ
  choice: सिर पर
  rationale: यह स्थान-सूचक पदबंध का सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: אֲבִימֶלֶךְ
  choice: अबीमेलेक
  rationale: इब्रानी नाम का प्रचलित हिन्दी लिप्यंतरण अपनाया गया है।
- source_word: וַתָּרִץ
  choice: कुचल दी
  rationale: רצץ का अर्थ कुचलना या चूर करना है; ‘कुचल दी’ आघात की तीव्रता को बिना अतिशयोक्ति व्यक्त करता है।
- source_word: גֻּלְגָּלְתּוֹ
  choice: उसकी खोपड़ी
  rationale: यह संज्ञा सामान्य ‘सिर’ के बजाय विशेष रूप से खोपड़ी को सूचित करती है।
