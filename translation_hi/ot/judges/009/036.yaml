  text: וַ/יַּרְא גַּעַל֮ אֶת הָ/עָם֒ וַ/יֹּ֣אמֶר אֶל זְבֻ֔ל הִנֵּה עָ֣ם יוֹרֵ֔ד מֵ/רָאשֵׁ֖י הֶ/הָרִ֑ים וַ/יֹּ֤אמֶר אֵלָי/ו֙ זְבֻ֔ל אֵ֣ת צֵ֧ל הֶ/הָרִ֛ים אַתָּ֥ה רֹאֶ֖ה כָּ/אֲנָשִֽׁים־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/036.yaml
  text: When Gaal saw the people[a], he said to Zebul, “Look, people are coming down from the tops of the mountains.” But Zebul said to him, “You are seeing the shadow of the mountains as men.”
translation:
  language: hi
  text: जब गाल ने उन लोगों को देखा, तो उसने जबूल से कहा, “देखो, लोग पहाड़ों की चोटियों से नीचे उतर रहे हैं।” लेकिन जबूल ने उससे कहा, “तुम पहाड़ों की छाया को आदमियों जैसी देख रहे हो।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम पहाड़ों की छाया को आदमी समझ रहे हो।”
    reason: इब्रानी כָּאֲנָשִׁים का अर्थ ‘आदमियों की तरह/जैसी’ है; हिन्दी में इसे ‘आदमी समझ रहे हो’ कहकर भी व्यक्त किया जा सकता है।
lexical_decisions:
- source_word: וַיַּרְא
  choice: देखा
  rationale: साधारण कथात्मक संदर्भ में ראה के कालरूप का सीधा और स्वाभाविक हिन्दी अनुवाद।
- source_word: הָעָם / עָם
  choice: उन लोगों को / लोग
  rationale: עָם का सामान्य अर्थ ‘लोग’ है। संदर्भ में वे लड़ाके हैं, पर इब्रानी यहाँ उन्हें स्पष्ट रूप से सेना या सैनिक नहीं कहती।
- source_word: הִנֵּה
  choice: देखो
  rationale: प्रत्यक्ष भाषण में ध्यान आकर्षित करने वाला स्वाभाविक आधुनिक हिन्दी संबोधन।
- source_word: יוֹרֵד
  choice: नीचे उतर रहे हैं
  rationale: עָם सामूहिक संज्ञा है; हिन्दी में ‘लोग’ के साथ बहुवचन क्रिया स्वाभाविक है।
- source_word: מֵרָאשֵׁי הֶהָרִים
  choice: पहाड़ों की चोटियों से
  rationale: רֹאשׁ यहाँ पहाड़ के ऊपरी भाग या चोटी को दर्शाता है।
- source_word: צֵל הֶהָרִים
  choice: पहाड़ों की छाया
  rationale: צֵל का मूल अर्थ ‘छाया’ है और यहाँ दृश्य भ्रम का संदर्भ है।
- source_word: אַתָּה רֹאֶה כָּאֲנָשִׁים
  choice: तुम ... को आदमी समझ रहे हो
  rationale: यह हिन्दी में दृश्य को मनुष्य मान लेने की भूल को स्वाभाविक ढंग से व्यक्त करता है; तुलना की अधिक शाब्दिक संरचना फुटनोट में सुरक्षित है।
- source_word: אֲנָשִׁים
  choice: आदमी
  rationale: इब्रानी शब्द पुरुषवाचक बहुवचन है; ‘आदमी’ यहाँ सामूहिक/जातिवाचक रूप में दिखाई देने वाली पुरुष आकृतियों को दर्शाता है।
