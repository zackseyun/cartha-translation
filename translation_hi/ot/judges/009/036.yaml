  register: आधुनिक, गरिमापूर्ण और सहज कथात्मक हिन्दी। नामों के लिए ‘गाल’ और ‘जबूल’ रूप अपनाए गए हैं। मुख्य पाठ में इब्रानी की सामूहिक संज्ञा के अनुरूप ‘लोग’ रखा गया है और अनावश्यक रूप से ‘सेना’ या ‘सैनिक’ नहीं जोड़ा गया।
