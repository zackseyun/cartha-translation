  text: לָ/ב֕וֹא חֲמַ֖ס שִׁבְעִ֣ים בְּנֵֽי יְרֻבָּ֑עַל וְ/דָמָ֗/ם לָ/שׂ֞וּם עַל אֲבִימֶ֤לֶךְ אֲחִי/הֶם֙ אֲשֶׁ֣ר הָרַ֣ג אוֹתָ֔/ם וְ/עַל֙ בַּעֲלֵ֣י שְׁכֶ֔ם אֲשֶׁר חִזְּק֥וּ אֶת יָדָ֖י/ו לַ/הֲרֹ֥ג אֶת אֶחָֽי/ו־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/024.yaml
  text: so that the violence done to the seventy sons of Jerubbaal might come[a], and their blood be laid on Abimelech their brother, who killed them, and on the leaders of Shechem[c][b], who strengthened his hands to kill his brothers.
translation:
  language: hi
  text: ताकि यरुब्बाल के सत्तर पुत्रों के साथ हुई हिंसा का प्रतिफल आए[a], और उनका खून उनके भाई अबीमेलेक पर, जिसने उन्हें मार डाला था, और शकेम के अगुओं[b] पर डाला जाए—जिन्होंने उसके भाइयों को मारने के लिए उसके हाथ मज़बूत किए थे[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “यरुब्बाल के सत्तर पुत्रों की हिंसा आए।” यहाँ हिंसक अन्याय के न्यायिक परिणाम का भाव है।
    reason: lexical_alternative
  - marker: b
    text: या “शकेम के प्रभुओं”; इब्रानी पद नगर के प्रमुख अथवा सत्ताधारी लोगों को दर्शाता है।
    reason: lexical_alternative
  - marker: c
    text: “उसके हाथ मज़बूत किए” एक इब्रानी मुहावरा है, अर्थात उन्होंने उसका साथ दिया या उसे समर्थन दिया।
    reason: lexical_alternative
lexical_decisions:
- source_word: לָבוֹא חֲמַס
  choice: हिंसा का बदला आए
  rationale: לָבוֹא उद्देश्य/परिणाम बताता है, जबकि חֲמַס हिंसक अन्याय को सूचित करता है। केवल ‘हिंसा आए’ हिन्दी में अस्पष्ट है; ‘हिंसा का बदला आए’ प्रतिफल के भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: שִׁבְעִים בְּנֵי יְרֻבָּעַל
  choice: यरुब्बाल के सत्तर पुत्रों
  rationale: सम्बन्धवाचक पदबंध का सीधा अनुवाद; व्यक्ति-नाम का लिप्यंतरण रखा गया है।
- source_word: וְדָמָם לָשׂוּם עַל
  choice: उनके खून का दोष ... पर आए
  rationale: शाब्दिक ‘उनका खून ... पर रखा जाए’ हिन्दी में अस्वाभाविक है। ‘खून का दोष ... पर आए’ रक्तपात की जिम्मेदारी का इब्रानी न्यायिक मुहावरा और ‘खून’ की छवि दोनों बनाए रखता है।
- source_word: אֲבִימֶלֶךְ אֲחִיהֶם
  choice: उनके भाई अबीमेलेक पर
  rationale: सहोदर सम्बन्ध को स्पष्ट और प्रभावपूर्ण ढंग से बनाए रखा गया है।
- source_word: אֲשֶׁר הָרַג אוֹתָם
  choice: जिसने उन्हें मार डाला था
  rationale: הרג का सामान्य अर्थ ‘मारना’ है; ‘हत्या की’ जैसी अधिक विशिष्ट कानूनी संज्ञा आरोपित नहीं की गई।
- source_word: בַּעֲלֵי שְׁכֶם
  choice: शकेम के अगुओं
  rationale: यहाँ בַּעֲלֵי नगर के प्रभावशाली पुरुषों अथवा सत्ताधारियों को दर्शाता है; ‘अगुए’ आधुनिक धार्मिक-पाठीय हिन्दी में समझने योग्य है।
- source_word: חִזְּקוּ אֶת יָדָיו
  choice: उसका हाथ मजबूत किया था
  rationale: समर्थन देने के इब्रानी मुहावरे को मुख्य पाठ में सुरक्षित रखा गया है; अर्थ पादटिप्पणी में स्पष्ट किया गया है।
- source_word: לַהֲרֹג אֶת אֶחָיו
  choice: उसके भाइयों को मारने के लिए
  rationale: उद्देश्यसूचक infinitive और पुरुष सहोदरों के स्पष्ट संदर्भ का सीधा अनुवाद।
theological_decisions:
- issue: बहाए गए खून की जिम्मेदारी का चित्रण
  choice: ‘उनके खून का दोष ... पर आए’
  alternative: ‘उनके खून का बदला ... पर आए’ अथवा ‘उनका खून ... पर रखा जाए’
  rationale: अनुवाद खून की मूल छवि तथा अपराध-जिम्मेदारी के न्यायिक भाव को साथ रखता है, बिना यह तय किए कि वाक्य केवल प्रतिशोध, दंड या कानूनी दोषारोपण में से किस एक को दर्शाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज शैली। ‘खून’ तथा ‘हाथ मजबूत किया’ जैसी स्रोत-छवियाँ बनाए रखी गई हैं, जबकि अस्वाभाविक शाब्दिक संरचना को स्पष्ट हिन्दी वाक्य में ढाला गया है।
