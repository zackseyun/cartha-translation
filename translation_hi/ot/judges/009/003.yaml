  yaml_path: translation/ot/judges/009/003.yaml
  text: And his mother’s brothers spoke all these words about him in the hearing of all the leaders of Shechem[a], and their hearts turned after Abimelech, for they said[b], “He is our brother.”
translation:
  language: hi
  text: और उसकी माँ के भाइयों ने उसके विषय में ये सारी बातें[b] शकेम के सब अगुओं[a] के सामने कहीं। और उनका मन अबीमेलेक की ओर झुक गया, क्योंकि उन्होंने कहा, “वह हमारा भाई है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “शकेम के सब स्वामियों” अथवा “शकेम के सब प्रमुख पुरुषों।” इब्रानी पदबंध नगर के प्रभावशाली पुरुषों को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: या “ये सब मामले” अथवा “ये सब बातें।” इब्रानी शब्द का अर्थ बोले गए वचन या विषय/मामले दोनों हो सकता है; यहाँ यह पिछले पद में दिए गए प्रस्ताव की ओर संकेत करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבְּרוּ אֲחֵי אִמּוֹ
  choice: उसकी माँ के भाइयों ने…सुनाईं
  rationale: यह पदबंध माँ के पुरुष सहोदरों को स्पष्ट रूप से दर्शाता है। בְּאָזְנֵי के साथ हिन्दी में ‘को सुनाईं’ स्वाभाविक रूप से श्रव्य संप्रेषण व्यक्त करता है।
- source_word: עָלָיו
  choice: उसके विषय में
  rationale: यह अबीमेलेक के संबंध में बोलने को व्यक्त करता है और ‘उसकी ओर से’ कहकर पक्षसमर्थन को अनावश्यक रूप से स्पष्ट नहीं करता।
- source_word: כָּל בַּעֲלֵי שְׁכֶם
  choice: शकेम के सब अगुओं
  rationale: בַּעֲלֵי का यहाँ नगर के प्रभावशाली अथवा शासकीय पुरुषों के लिए प्रयोग है; ‘अगुए’ उनकी सामाजिक-राजनीतिक भूमिका को सहज हिन्दी में व्यक्त करता है।
- source_word: אֵת כָּל הַדְּבָרִים הָאֵלֶּה
  choice: ये सारी बातें
  rationale: דְּבָרִים का अर्थ ‘वचन/बातें’ या ‘मामले’ हो सकता है; यहाँ यह पिछले पद में दिए प्रस्ताव को संदर्भित करता है, इसलिए ‘बातें’ स्वाभाविक और पर्याप्त रूप से खुला है।
- source_word: וַיֵּט לִבָּם אַחֲרֵי אֲבִימֶלֶךְ
  choice: उनका मन अबीमेलेक की ओर झुक गया
  rationale: हृदय के झुकने का इब्रानी रूपक समर्थन अथवा निष्ठा की ओर प्रवृत्ति बताता है। सामूहिक एकवचन לִבָּם के लिए हिन्दी का ‘उनका मन’ स्वाभाविक है।
- source_word: כִּי אָמְרוּ אָחִינוּ הוּא
  choice: क्योंकि उन्होंने कहा, ‘वह हमारा भाई है’
  rationale: כִּי कारण प्रस्तुत करता है। ‘भाई’ प्रत्यक्ष संबंधवाची शब्द को बनाए रखता है और शकेमी मातृ-पक्ष से जुड़ी कुलगत एकता की अपील को सुरक्षित रखता है।
