  text: וַ/יִּכְרְת֨וּ גַם כָּל הָ/עָ֜ם אִ֣ישׁ שׂוֹכֹ֗/ה וַ/יֵּ֨לְכ֜וּ אַחֲרֵ֤י אֲבִימֶ֨לֶךְ֙ וַ/יָּשִׂ֣ימוּ עַֽל הַ/צְּרִ֔יחַ וַ/יַּצִּ֧יתוּ עֲלֵי/הֶ֛ם אֶֽת הַ/צְּרִ֖יחַ בָּ/אֵ֑שׁ וַ/יָּמֻ֜תוּ גַּ֣ם כָּל אַנְשֵׁ֧י מִֽגְדַּל שְׁכֶ֛ם כְּ/אֶ֖לֶף אִ֥ישׁ וְ/אִשָּֽׁה־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/049.yaml
  text: So all the people also cut down a branch each[a], and they went after Abimelech and piled them against the inner chamber, and set the inner chamber on fire over them, so that all the people of the tower of Shechem also died[b], about a thousand men and women.
translation:
  language: hi
  text: तब सब लोगों ने भी एक-एक डाल काटी[a] और अबीमेलेक के पीछे गए। उन्होंने डालों को भीतरी शरणकक्ष के सहारे ढेर कर दिया और उस शरणकक्ष को उनके ऊपर आग लगा दी। इस प्रकार शकेम के गुम्मट के सभी लोग भी मर गए—लगभग एक हज़ार पुरुष और स्त्रियाँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: “हर व्यक्ति ने अपनी डाल काटी।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְרְתוּ
  choice: काटी
  rationale: यहाँ כרת पेड़ की डाल काटने के लिए प्रयुक्त है; हिन्दी में ‘डाल काटी’ स्वाभाविक और प्रसंगानुकूल है।
- source_word: אִישׁ שׂוֹכֹה
  choice: एक-एक डाल
  rationale: शाब्दिक संरचना ‘हर व्यक्ति अपनी डाल’ की वितरणात्मक भावना और एकवचन संज्ञा को सहज हिन्दी में व्यक्त करता है।
- source_word: וַיֵּלְכוּ אַחֲרֵי אֲבִימֶלֶךְ
  choice: अबीमेलेक के पीछे गए
  rationale: यह मूल के स्थानिक मुहावरे को बनाए रखता है और प्रसंग में उसके नेतृत्व का अनुसरण करना भी स्पष्ट करता है।
- source_word: הַצְּרִיחַ
  choice: भीतरी शरणकक्ष
  rationale: צריח संभवतः गुम्मट के भीतर का घिरा हुआ सुरक्षित भाग था; यह अनुवाद उसे बाद में आए מִגְדַּל ‘गुम्मट’ से अलग रखता है।
- source_word: וַיָּשִׂימוּ עַל הַצְּרִיחַ
  choice: डालों को भीतरी शरणकक्ष के सहारे ढेर कर दिया
  rationale: עַל का मूल अर्थ ‘पर’ है, पर आग लगाने के इस प्रसंग में डालों को भवन के साथ/सहारे रखना अभिप्रेत है; ‘ढेर कर दिया’ सामूहिक क्रिया को स्वाभाविक हिन्दी में दर्शाता है।
- source_word: וַיַּצִּיתוּ עֲלֵיהֶם אֶת הַצְּרִיחַ בָּאֵשׁ
  choice: उनके ऊपर उस शरणकक्ष में आग लगा दी
  rationale: ‘उनके ऊपर’ עֲלֵיהֶם की स्थानिक अस्पष्टता को सुरक्षित रखता है और यह बताता है कि शरण लिए लोगों के रहते संरचना जलाई गई।
- source_word: אַנְשֵׁי מִגְדַּל שְׁכֶם
  choice: शकेम के गुम्मट के सभी लोग
  rationale: אַנְשֵׁי औपचारिक रूप से पुल्लिंग है, पर अगला वाक्यांश पुरुषों और स्त्रियों दोनों को सम्मिलित करता है; ‘लोग’ यहाँ निवासियों/शरणार्थियों का स्वाभाविक सामूहिक बोध देता है।
- source_word: כְּאֶלֶף
  choice: लगभग एक हज़ार
  rationale: उपसर्ग כ यहाँ अनुमान सूचित करता है; ‘लगभग’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: אִישׁ וְאִשָּׁה
  choice: पुरुष और स्त्रियाँ
  rationale: यह दोनों लिंगों को मृतकों की संख्या में स्पष्ट रूप से सम्मिलित करता है और मूल भेद को बनाए रखता है।
