  yaml_path: translation/ot/judges/009/032.yaml
  text: Now then[a], arise by night, you and the people who are with you[b], and lie in wait in the field.
translation:
  language: hi
  text: अब रात को उठो—तुम और तुम्हारे साथ के लोग—और मैदान में घात लगाकर बैठो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: इसलिए अब
  rationale: यह पद पिछले कथन से तत्काल निर्देश की ओर बढ़ता है; ‘इसलिए अब’ संयोजक और तात्कालिक दोनों भाव स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: קוּם
  choice: उठो
  rationale: קום के एकवचन पुल्लिंग आज्ञार्थक का सीधा और वर्तमान हिन्दी में स्वाभाविक रूप।
- source_word: לַיְלָה
  choice: रात को
  rationale: कालवाचक प्रयोग रात में कार्रवाई बताता है, पर अनिवार्य रूप से ‘आज रात’ निर्दिष्ट नहीं करता।
- source_word: אַתָּה וְהָעָם אֲשֶׁר אִתָּךְ
  choice: तुम और तुम्हारे साथ के लोग
  rationale: स्पष्ट ‘तुम’ का बल बनाए रखा गया है और עָם को ‘सेना’ या ‘पुरुष’ कहकर आवश्यकता से अधिक विशिष्ट नहीं किया गया।
- source_word: וֶאֱרֹב
  choice: और घात लगाकर बैठो
  rationale: ארב यहाँ छिपकर प्रतीक्षा करने या घात लगाने की सामरिक क्रिया बताता है; यह हिन्दी मुहावरा केवल आक्रमण नहीं, घात की स्थिति लेने का भाव भी देता है।
- source_word: בַּשָּׂדֶה
  choice: मैदान में
  rationale: שָׂדֶה का सीधा संदर्भ खेत, मैदान या खुले भूभाग से हो सकता है; सामरिक प्रसंग में ‘मैदान’ स्वाभाविक और पर्याप्त व्यापक है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, dignified और सीधी रखी गई है। सैन्य प्रसंग को स्पष्ट करने के लिए ‘घात लगाकर बैठो’ चुना गया, जबकि मूल की रात संबंधी अभिव्यक्ति को ‘आज रात’ बनाकर अधिक निश्चित नहीं किया गया।
