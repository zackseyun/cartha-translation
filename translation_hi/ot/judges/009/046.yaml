  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַֽ/יִּשְׁמְע֔וּ כָּֽל בַּעֲלֵ֖י מִֽגְדַּל שְׁכֶ֑ם וַ/יָּבֹ֣אוּ אֶל צְרִ֔יחַ בֵּ֖ית אֵ֥ל בְּרִֽית־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/046.yaml
  text: When all the leaders of the tower of Shechem heard it[c][b][a], they went into the inner chamber of the house of El-berith.
translation:
  language: hi
  text: जब शकेम की मीनार[b] के सभी अगुओं ने यह सुना, तो वे एल-बरीत[c] के भवन के भीतरी कक्ष[a] में चले गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तहखाना,” “दुर्ग,” अथवा “भीतरी कमरा”; इब्रानी शब्द किसी संरक्षित भीतरी कक्ष को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: “शकेम की मीनार” एक स्थान-नाम, “मिग्दल-शकेम,” भी हो सकता है।
    reason: alternative_reading
  - marker: c
    text: “एल-बरीत” का अर्थ “वाचा का ईश्वर” हो सकता है। इस अध्याय में आए संबंधित नाम “बाल-बरीत” से तुलना करें।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁמְעוּ
  choice: यह सुना
  rationale: क्रिया का मूल अर्थ ‘सुना’ है। पिछले घटनाक्रम की सूचना को स्वाभाविक हिंदी में स्पष्ट करने के लिए ‘यह’ जोड़ा गया है।
- source_word: בַּעֲלֵי
  choice: अगुओं
  rationale: शाब्दिक अर्थ ‘स्वामी/मालिक’ हो सकता है, पर इस नागरिक-सैन्य संदर्भ में यह प्रमुख या नेतृत्व करने वाले निवासियों को सूचित करता है।
- source_word: מִגְדַּל שְׁכֶם
  choice: शकेम के गढ़
  rationale: מִגְדַּל का सामान्य अर्थ ‘मीनार’ है, किंतु यहाँ उससे जुड़े समुदाय या सुरक्षित दुर्ग का बोध संभव है। ‘गढ़’ हिंदी में स्थान और उसके निवासियों के संबंध को स्वाभाविक ढंग से व्यक्त करता है; स्थान-नाम की संभावना पादटिप्पणी में रखी गई है।
- source_word: וַיָּבֹאוּ אֶל
  choice: में जा घुसे
  rationale: אֶל के साथ गति यहाँ आश्रय-स्थल के भीतर जाने को सूचित करती है। प्रसंग में सुरक्षा पाने के लिए भीतर प्रवेश करने का भाव है।
- source_word: צְרִיחַ
  choice: भीतरी सुरक्षित कक्ष
  rationale: यह दुर्लभ संज्ञा किसी संरक्षित भीतरी कमरे, तहखाने या दुर्ग-सदृश कक्ष को दर्शा सकती है। यह चयन निश्चित वास्तु-रचना तय किए बिना मुख्य भाव देता है।
- source_word: בֵּית אֵל בְּרִית
  choice: एली-बरीत के भवन
  rationale: בֵּית का अर्थ ‘घर/भवन’ है और उपासना-स्थल के लिए भी आता है। אֵל בְּרִית को नाम या उपाधि मानते हुए लिप्यंतरित किया गया है, ताकि ‘वाचा का ईश्वर’ अर्थ और निकटवर्ती ‘बाल-बरीत’ से संबंध की अस्पष्टता बनी रहे।
theological_decisions:
- issue: אֵל בְּרִית को ईश्वरीय नाम, उपाधि या वर्णन के रूप में समझना
  choice: एली-बरीत
  alternative: वाचा के ईश्वर; अथवा निकटवर्ती संदर्भ से सामंजस्य करके बाल-बरीत
  rationale: मसोरी पाठ में אֵל בְּרִית है। लिप्यंतरण पाठ की विशिष्टता और यह वास्तविक अस्पष्टता बनाए रखता है कि पदबंध नाम है या ‘वाचा का ईश्वर’ अर्थ वाली उपाधि; इसे बाल-बरीत में बदलना अनावश्यक सामंजस्य होगा।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिंदी। ‘अगुओं’ से नागरिक-सैन्य नेतृत्व, ‘गढ़’ से सुरक्षित स्थल, और ‘भीतरी सुरक्षित कक्ष’ से दुर्लभ स्थापत्य शब्द का अनिश्चित अर्थ व्यक्त किया गया है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में दिए गए हैं।
