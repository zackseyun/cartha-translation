  text: Abimelech came up to the tower and fought against it, and he came near to the entrance of the tower to burn it with fire.
translation:
  language: hi
  text: अबीमेलेक मीनार तक चढ़ आया और उसके विरुद्ध लड़ा। फिर वह मीनार के द्वार के पास गया, ताकि उसे आग से जला दे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא ... עַד הַמִּגְדָּל
  choice: मीनार तक चढ़ आया
  rationale: संदर्भ में मीनार ऊँचे स्थान पर थी; इसलिए ‘चढ़ आया’ गति और प्रसंग दोनों को स्वाभाविक रूप से व्यक्त करता है, जबकि עַד का ‘तक’ भी सुरक्षित रहता है।
- source_word: וַיִּלָּחֶם בּוֹ
  choice: उसके विरुद्ध लड़ने लगा
  rationale: בְּ के विरोधसूचक अर्थ को ‘के विरुद्ध’ से स्पष्ट किया गया है; हिन्दी में मीनार पर किए जा रहे आक्रमण के लिए यह स्वाभाविक है।
- source_word: פֶּתַח הַמִּגְדָּל
  choice: मीनार का द्वार
  rationale: פֶּתַח प्रवेश-स्थान या द्वार को दर्शाता है; यहाँ ‘द्वार’ संक्षिप्त और स्वाभाविक है।
- source_word: לְשָׂרְפוֹ בָאֵשׁ
  choice: ताकि उसे आग से जला दे
  rationale: उद्देश्यसूचक לְ को ‘ताकि’ से और בָאֵשׁ को औपचारिक रूप से ‘आग से’ व्यक्त किया गया है।
