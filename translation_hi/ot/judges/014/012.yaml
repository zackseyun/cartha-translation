base_translation:
  language: en
  yaml_path: translation/ot/judges/014/012.yaml
  text: And Samson said to them[a], “Please let me put a riddle to you. If you indeed tell it to me within the seven days of the feast and solve it[c][b], then I will give you thirty linen garments and thirty changes of clothes.”
translation:
  language: hi
  text: तब शिमशोन ने उनसे कहा, “कृपया मुझे तुम्हारे सामने एक पहेली रखने दो। यदि तुम भोज के सात दिनों के भीतर उसका उत्तर मुझे ठीक-ठीक बता दो और उसे सुलझा लो, तो मैं तुम्हें लिनन के तीस वस्त्र और कपड़ों के तीस पूरे जोड़े[a] दूँगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “लिनन के वस्त्र” और “कपड़ों के पूरे जोड़े”—इन वस्त्रों के ठीक-ठीक प्रकार निश्चित नहीं हैं।
    reason: cultural_note
lexical_decisions:
- source_word: אָחֽוּדָה נָּא
  choice: मैं तुम्हें एक पहेली बुझाऊँ
  rationale: सहवाची रूप और נָא विनम्र प्रस्ताव व्यक्त करते हैं। हिंदी में ‘पहेली बुझाऊँ’ स्वाभाविक है और प्रथम-पुरुष इच्छार्थक भाव बनाए रखता है।
- source_word: חִידָה
  choice: पहेली
  rationale: संदर्भ में यह ऐसी गूढ़ बात है जिसका उत्तर खोजना है; आधुनिक हिंदी में ‘पहेली’ इसका सीधा और स्वाभाविक पर्याय है।
- source_word: אִם הַגֵּד תַּגִּידוּ
  choice: यदि ... उत्तर ठीक-ठीक बता दो
  rationale: इनफिनिटिव ऐब्सोल्यूट के साथ क्रिया की पुनरुक्ति कथन पर बल देती है। ‘ठीक-ठीक बता दो’ सामर्थ्य का अर्थ जोड़े बिना उस बल को व्यक्त करता है।
- source_word: שִׁבְעַת יְמֵי הַמִּשְׁתֶּה
  choice: भोज के सात दिनों के भीतर
  rationale: מִשְׁתֶּה भोज अथवा दावत है और प्रसंग में सात दिन की समय-सीमा निहित है; ‘के भीतर’ उस सीमा को स्पष्ट करता है।
- source_word: וּמְצָאתֶם
  choice: और उसे बूझ लो
  rationale: शाब्दिक अर्थ ‘ढूँढ़ पाना’ है, पर पहेली के प्रसंग में आशय उसका समाधान खोज लेना है। ‘बूझ लो’ हिंदी में पहेली के साथ स्वाभाविक है और मूल रूपक से निकट भी है।
- source_word: שְׁלֹשִׁים סְדִינִים
  choice: मलमल के तीस वस्त्र
  rationale: סְדִינִים महीन सन के कपड़े से बने वस्त्रों को सूचित करता है, पर उनका सटीक प्रकार अनिश्चित है। ‘मलमल के वस्त्र’ कपड़े की प्रकृति बताता है और वस्त्र-प्रकार के विषय में अतिनिश्चित नहीं होता।
- source_word: שְׁלֹשִׁים חֲלִפֹת בְּגָדִים
  choice: पहनने के कपड़ों के तीस जोड़े
  rationale: वाक्यांश बदलकर पहनने योग्य पूरे जोड़ों अथवा पोशाकों का बोध देता है। यह हिंदी में समझने योग्य है और पहले बताए महीन वस्त्रों से भेद बनाए रखता है।
- source_word: וְנָתַתִּי לָכֶם
  choice: तो मैं तुम्हें ... दूँगा
  rationale: वाव यहाँ शर्त के परिणाम को जोड़ता है; हिंदी का ‘तो’ इस संबंध को स्वाभाविक ढंग से व्यक्त करता है।
