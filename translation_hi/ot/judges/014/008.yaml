base_translation:
  language: en
  yaml_path: translation/ot/judges/014/008.yaml
  text: After some days he returned to take her, and he turned aside to see the carcass of the lion, and behold, a swarm of bees was in the body of the lion, and honey.
translation:
  language: hi
  text: कुछ दिनों बाद वह उसे ब्याहकर ले जाने के लिए फिर आया। तब वह सिंह का शव देखने के लिए रास्ते से हटकर गया। और देखो, सिंह के शव में मधुमक्खियों का एक झुंड और शहद था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְקַחְתָּהּ
  choice: उसे ब्याहकर ले जाने के लिए
  rationale: संदर्भ में केवल सामान्य रूप से ‘लेना’ नहीं, बल्कि विवाह की प्रक्रिया पूरी करके स्त्री को पत्नी के रूप में ले जाना अभिप्रेत है; यह स्वाभाविक हिंदी में उस आशय को स्पष्ट करता है।
- source_word: מַפֶּלֶת הָאַרְיֵה
  choice: सिंह की लोथ
  rationale: מַפֶּלֶת यहाँ मारे गए पशु के गिरे हुए मृत शरीर को दर्शाता है। ‘लोथ’ संक्षिप्त और संदर्भानुकूल है।
- source_word: עֲדַת דְּבוֹרִים
  choice: मधुमक्खियों का एक झुंड
  rationale: עֲדָה समूह या समुदाय को व्यक्त करता है; मधुमक्खियों के लिए आधुनिक हिंदी में ‘झुंड’ स्वाभाविक है।
- source_word: בִּגְוִיַּת הָאַרְיֵה
  choice: सिंह के शरीर में
  rationale: גְּוִיָּה मृत शरीर को भी सूचित कर सकता है, किंतु पिछले वाक्य में ‘लोथ’ आ चुका है; यहाँ ‘शरीर’ मूल की पुनरुक्ति-भिन्नता बनाए रखता है।
- source_word: וּדְבָשׁ
  choice: और शहद था
  rationale: खंडात्मक इब्रानी ‘और शहद’ को सुबोध हिंदी वाक्य में जोड़ा गया है, बिना यह जोड़े कि शहद कहाँ या कितनी मात्रा में था।
