  to: कुछ दिनों बाद वह उसे ब्याहकर ले जाने के लिए फिर आया। तब वह सिंह का शव देखने के लिए रास्ते से हटकर गया। और देखो, सिंह के शव में मधुमक्खियों का एक झुंड और शहद था।
