  yaml_path: translation/ot/judges/014/017.yaml
  text: She wept before him the seven days that they had the feast[a]. And on the seventh day he told her, because she pressed him hard[b]; then she told the riddle to the sons of her people.
translation:
  language: hi
  text: भोज के सातों दिन वह उसके सामने रोती रही।[a] सातवें दिन शिमशोन ने उसे पहेली का उत्तर बता दिया, क्योंकि वह उस पर बहुत दबाव डाल रही थी। तब उसने वह पहेली अपने लोगों के पुरुषों को बता दी।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू मुहावरे का शाब्दिक अर्थ है, “वह उस पर रोती रही”; इससे यह भाव मिलता है कि वह अपने लगातार रोने से उस पर दबाव डालती रही।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “अपने लोगों के पुत्रों को”; संदर्भ में सम्भवतः उसके अपने लोगों के पुरुष, यानी पलिश्ती साथी, अभिप्रेत हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּבְךְּ עָלָיו
  choice: वह उसके सामने रोती रही
  rationale: בכה का अर्थ रोना है और עַל के साथ यहाँ रोना शिमशोन की ओर निर्देशित होकर उस पर लगातार भावनात्मक दबाव डालता है। स्वाभाविक हिन्दी में “उसके सामने रोती रही” क्रिया की निरंतरता रखता है; दबाव की छाया पादटिप्पणी में स्पष्ट की गई है।
- source_word: שִׁבְעַת הַיָּמִים אֲשֶׁר הָיָה לָהֶם הַמִּשְׁתֶּה
  choice: भोज के सातों दिन
  rationale: यह वाक्यांश भोज की पूरी सात-दिवसीय अवधि बताता है। “भोज” מִשְׁתֶּה के उत्सवी भोज का अर्थ रखता है, बिना उसे मूल से अधिक विशिष्ट बनाए।
- source_word: וַיְהִי בַּיּוֹם הַשְּׁבִיעִי
  choice: सातवें दिन
  rationale: हिब्रू कथात्मक संक्रमण को संक्षिप्त और स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: וַיַּגֶּד לָהּ
  choice: उसने उसे पहेली का उत्तर बता दिया
  rationale: נגד का मूल अर्थ बताना या प्रकट करना है। हिब्रू में कर्म संदर्भ से समझा जाता है; हिन्दी में “पहेली का उत्तर” जोड़ने से आशय स्पष्ट होता है और अगले खंड में स्वयं पहेली बताए जाने से भेद बना रहता है।
- source_word: כִּי הֱצִיקַתְהוּ
  choice: क्योंकि वह उस पर बहुत दबाव डाल रही थी
  rationale: צוק के हिफ़ील रूप में कठोर या लगातार दबाव डालने का भाव है। यह अनुवाद भावनात्मक विवशता और उसकी निरंतरता दोनों व्यक्त करता है।
- source_word: וַתַּגֵּד הַחִידָה
  choice: तब उसने वह पहेली ... बता दी
  rationale: नारेटिव क्रम में נגד और חִידָה को सीधे “पहेली बता दी” से प्रस्तुत किया गया है।
- source_word: לִבְנֵי עַמָּהּ
  choice: अपने लोगों के पुरुषों को
  rationale: शाब्दिक अर्थ “उसके लोगों के पुत्रों” है, पर यहाँ בני वयस्क पुरुषों की ओर संकेत करता है। आधुनिक हिन्दी में “अपने लोगों के पुरुष” लिंग-सूचना को रखते हुए स्वाभाविक है।
