base_translation:
  language: en
  yaml_path: translation/ot/judges/014/006.yaml
  text: Then the Spirit of Yahweh rushed upon him[a], and he tore it apart as one tears apart a young goat, though he had nothing in his hand[b]. But he did not tell his father or his mother what he had done.
translation:
  language: hi
  text: तब याहवेह का आत्मा सामर्थ्य के साथ उस पर आया[a], और उसने सिंह को ऐसे चीर डाला जैसे कोई बकरी के बच्चे को चीर डालता है[b], जबकि उसके हाथ में कुछ भी नहीं था। पर उसने अपने पिता या अपनी माता को नहीं बताया कि उसने क्या किया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सामर्थ्यपूर्वक उस पर आया।”
    reason: lexical_alternative
  - marker: b
    text: 'हिब्रू: “जैसे कोई बकरी के बच्चे को चीरता है।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּצְלַח עָלָיו
  choice: उस पर प्रबलता से आया
  rationale: צלח על यहाँ आत्मा के अचानक और सामर्थ्यपूर्ण रूप से किसी पर आने तथा उसे समर्थ बनाने को व्यक्त करता है। यह हिंदी में स्वाभाविक रहते हुए मूल की शक्ति बनाए रखता है।
- source_word: רוּחַ יְהוָה
  choice: यहवेह का आत्मा
  rationale: रूअख यहाँ हवा या मनोभाव नहीं, बल्कि परमेश्वर के सामर्थ्य देने वाले आत्मा को सूचित करता है; यְהוָה को व्यक्तिगत दिव्य नाम के रूप में लिप्यंतरित किया गया है।
- source_word: וַיְשַׁסְּעֵהוּ
  choice: उसने सिंह को ... चीर डाला
  rationale: שׁסע का अर्थ जोर से चीरना या फाड़ना है। पूर्ववर्ती संदर्भ के पुल्लिंग सिंह को स्पष्ट करने के लिए संज्ञा दोहराई गई है।
- source_word: כְּשַׁסַּע הַגְּדִי
  choice: जैसे कोई बकरी के बच्चे को चीर डालता है
  rationale: यह तुलना क्रिया की सहजता या ढंग को दिखाती है। आधुनिक हिंदी में ‘बकरी का बच्चा’ स्पष्ट और स्वाभाविक है।
- source_word: וּמְאוּמָה אֵין בְּיָדוֹ
  choice: हालाँकि उसके हाथ में कुछ भी नहीं था
  rationale: वाक्यांश इस बात पर बल देता है कि उसके पास कोई हथियार नहीं था; ‘हालाँकि’ निहित विरोधात्मक भाव को सहज हिंदी में व्यक्त करता है।
- source_word: וְלֹא הִגִּיד לְאָבִיו וּלְאִמּוֹ
  choice: पर उसने अपने पिता या अपनी माता को नहीं बताया
  rationale: निषेध के साथ ‘या’ हिंदी में स्वाभाविक रूप से बताता है कि उसने दोनों में से किसी को भी नहीं बताया।
- source_word: אֵת אֲשֶׁר עָשָׂה
  choice: कि उसने क्या किया था
  rationale: ‘किया था’ कथा-क्रम में पहले पूरी हुई घटना को स्पष्ट करता है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहवेह
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में चार-अक्षरी व्यक्तिगत दिव्य नाम सीधे उपस्थित है। ‘यहवेह’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और नाम को सामान्य उपाधि में नहीं बदलता।
- issue: רוּחַ का आशय
  choice: आत्मा
  alternative: वायु / शक्ति
  rationale: इस संदर्भ में यहवेह का आत्मा शिमशोन पर आकर उसे असाधारण सामर्थ्य देता है; इसलिए इसे केवल वायु या निराकार शक्ति के रूप में नहीं प्रस्तुत किया गया।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। मूल की तीव्रता को ‘प्रबलता से आया’ और ‘चीर डाला’ द्वारा व्यक्त किया गया है; व्याख्यात्मक विस्तार न्यूनतम रखा गया है।
