base_translation:
  language: en
  yaml_path: translation/ot/judges/014/019.yaml
  text: And the Spirit of Yahweh rushed upon him[a], and he went down to Ashkelon and struck down thirty men from among them, and took their spoil garments and gave the changes of clothes to those who had explained the riddle. And his anger burned, and he went up to his father's house.
translation:
  language: hi
  text: तब याहवे का आत्मा सामर्थ्य से उस पर उतरा। वह अश्कलोन गया और वहाँ के लोगों में से तीस पुरुषों को मार डाला। उसने उनके उतारे हुए वस्त्र[a] ले लिए और पहेली का उत्तर बतानेवालों को बदलने के वस्त्र दे दिए। फिर उसका क्रोध भड़क उठा, और वह ऊपर अपने पिता के घर चला गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उनके वस्त्र।” इब्रानी शब्द का अर्थ उतारे हुए वस्त्र, संभवतः मारे गए लोगों से लूट में लिए गए वस्त्र, हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּצְלַח עָלָיו רוּחַ יְהוָה
  choice: याहवे का आत्मा सामर्थ्य के साथ उस पर आया
  rationale: צלח के साथ רוּחַ יְהוָה न्यायियों में अचानक और प्रभावशाली दैवी सामर्थ्य प्रदान किए जाने को व्यक्त करता है। हिंदी में यह वाक्यांश बल को बनाए रखते हुए स्वाभाविक है और ‘समृद्ध हुआ’ जैसे अनुपयुक्त अर्थ से बचता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी व्यक्तिगत नाम יהוה को उपाधि से बदलने के बजाय निकट देवनागरी लिप्यंतरण में प्रस्तुत किया गया है।
- source_word: וַיֵּרֶד אַשְׁקְלוֹן
  choice: वह अश्कलोन गया
  rationale: ירד का शाब्दिक अर्थ ‘नीचे गया’ है, पर हिंदी में नगर की ओर जाने के लिए बिना स्पष्ट भौगोलिक संदर्भ के ‘नीचे गया’ अस्वाभाविक हो सकता है; ‘गया’ दिशा और कथात्मक गति को स्वाभाविक रूप से व्यक्त करता है।
- source_word: וַיַּךְ מֵהֶם שְׁלֹשִׁים אִישׁ
  choice: वहाँ के लोगों में से तीस पुरुषों को मार डाला
  rationale: संदर्भ में נכה घातक प्रहार को दर्शाता है और מֵהֶם का अंशवाचक अर्थ ‘में से’ स्पष्ट रूप से रखा गया है।
- source_word: חֲלִיצוֹתָם
  choice: उनके शरीर से उतारे गए वस्त्र
  rationale: यह दुर्लभ संज्ञा यहाँ मारे गए लोगों से उतारे गए कपड़ों की ओर संकेत कर सकती है। मुख्य पाठ संदर्भगत अर्थ देता है और पादटिप्पणी अधिक सामान्य विकल्प सुरक्षित रखती है।
- source_word: הַחֲלִיפוֹת
  choice: एक-एक जोड़ी वस्त्र
  rationale: חליפות इस प्रसंग में पहेली की शर्त के अनुसार प्रत्येक विजेता को दिए जाने वाले बदलने के वस्त्रों के एक सेट को दर्शाता है। ‘एक-एक’ तीस व्यक्तियों में वितरण को स्वाभाविक हिंदी में स्पष्ट करता है।
- source_word: לְמַגִּידֵי הַחִידָה
  choice: पहेली का उत्तर बतानेवालों को
  rationale: נגד का कृदंत यहाँ उन लोगों को सूचित करता है जिन्होंने पहेली का समाधान प्रकट किया; ‘उत्तर बतानेवाले’ आधुनिक हिंदी में स्पष्ट है।
- source_word: וַיִּחַר אַפּוֹ
  choice: उसका क्रोध भड़क उठा
  rationale: यह हिंदी मुहावरा इब्रानी में क्रोध के जलने की सजीव उपमा को स्वाभाविक रूप से बनाए रखता है।
- source_word: וַיַּעַל בֵּית אָבִיהוּ
  choice: वह अपने पिता के घर चला गया
  rationale: עלה का ऊर्ध्वगामी भाव हिंदी में इस भौगोलिक संदर्भ के बिना कृत्रिम लग सकता है। ‘चला गया’ घटना को बिना ‘लौट गया’ जैसा अतिरिक्त अर्थ जोड़े स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: दैवी आत्मा द्वारा सामर्थ्य प्रदान करने की भाषा
  choice: याहवे का आत्मा सामर्थ्य के साथ उस पर आया
  alternative: याहवे का आत्मा उस पर झपटा
  rationale: अनुवाद दैवी सामर्थ्य की प्रत्यक्ष और प्रभावशाली क्रिया को बनाए रखता है, पर यह नहीं जोड़ता कि इसके बाद शिमशोन का प्रत्येक कार्य नैतिक रूप से अनुमोदित था। ‘झपटा’ बल तो व्यक्त करता है, किंतु हिंदी में आक्रामक अथवा नकारात्मक भाव जगा सकता है।
- issue: ईश्वर के नाम का अनुवाद
  choice: याहवे
  alternative: प्रभु
  rationale: मूल पाठ के व्यक्तिगत नाम יהוה को उपाधि में बदलने के बजाय लिप्यंतरित किया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक हिंदी में रखी गई है। छोटे वाक्यों से घटनाक्रम स्पष्ट किया गया है। हिंसा को मूल पाठ के अनुरूप सीधे व्यक्त किया गया है, न तो उसे नरम किया गया है और न अधिक चित्रात्मक बनाया गया है।
