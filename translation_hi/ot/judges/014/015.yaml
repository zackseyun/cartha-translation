review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the coercive command, threat, and the singular address followed by plural accusation. However, “पहेली का भेद बता दे” specifies the riddle’s solution, whereas the Hebrew directly says “tell us the riddle.” Also, “हमारी संपत्ति हड़प लो” narrows the Hebrew ירשׁ to property, while its primary force here is to dispossess the speakers; this should remain broader in the main text.
  naturalness: The Hindi is modern, clear, and appropriately forceful. “पहेली हमें बता दे” is slightly more literal but remains natural in the context of a demand to disclose the riddle. “हमें बेदखल कर दो” is idiomatic and preserves the accusatory force.
  terminology: “शिमशोन,” “फुसलाओ,” “पति,” and “पिता के घराने” are suitable. The household/house ambiguity is properly handled in the footnote. Revising the final accusation avoids importing an explicit “property” object not present in the Hebrew.
  issues:
  - severity: medium
    issue: “पहेली का भेद बता दे” adds ‘the solution/secret of the riddle.’
    rationale: The Hebrew object is simply “the riddle” (אֶת־הַחִידָה). Although the narrative context concerns its answer, the translation should not state that answer/secret explicitly where the source does not.
  - severity: medium
    issue: “हमारी संपत्ति हड़प लो” is too narrow for הֲלְיָרְשֵׁנוּ.
    rationale: The Hebrew expresses dispossessing the speakers or taking possession at their expense. It may involve goods in the wager context, but does not explicitly name property; the broader rendering preserves the lexical ambiguity reflected in the audit trail.
