base_translation:
  language: en
  yaml_path: translation/ot/judges/014/015.yaml
  text: And on the seventh day they said to Samson’s wife[a], “Entice your husband so that he may tell us the riddle, lest we burn you and your father’s household with fire[b]. Did you invite us to dispossess us? Is that not so?”
translation:
  language: hi
  text: सातवें दिन उन्होंने शिमशोन की पत्नी से कहा, “अपने पति को फुसलाओ कि वह हमें पहेली बता दे, नहीं तो हम तुम्हें और तुम्हारे पिता के घराने[a] को आग में जला देंगे। क्या तुम लोगों ने हमें इसलिए बुलाया था कि हमें बेदखल कर दो[b]? क्या ऐसा नहीं है?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तुम्हारे पिता के घर को।” इब्रानी पद भौतिक घर या व्यापक अर्थ में पिता के परिवार अथवा घराने—दोनों को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “हमें गरीब कर दो” अथवा “जो हमारा है उस पर अधिकार कर लो।” इब्रानी क्रिया किसी को बेदखल करने या उसकी वस्तु अपने अधिकार में लेने का भाव दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּתִּי
  choice: फुसलाओ
  rationale: पिएल आज्ञार्थक में मनाने के साथ छलपूर्ण या जोड़-तोड़ का भाव है; ‘फुसलाओ’ इस संदर्भ की कुटिलता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אִישֵׁךְ
  choice: अपने पति को
  rationale: विवाहित स्त्री के संदर्भ में אִישׁ का स्वाभाविक अर्थ ‘पति’ है।
- source_word: וְיַגֶּד לָנוּ אֶת־הַחִידָה
  choice: कि वह हमें पहेली का भेद बता दे
  rationale: आज्ञा के बाद वाव सहित अपूर्ण क्रिया उद्देश्य बताती है। प्रसंग में वे पहेली पहले सुन चुके हैं और उसका समाधान चाहते हैं, इसलिए ‘पहेली का भेद’ स्पष्ट और स्वाभाविक है।
- source_word: פֶּן נִשְׂרֹף אֹתָךְ וְאֶת־בֵּית אָבִיךְ בָּאֵשׁ
  choice: नहीं तो हम तुम्हें और तुम्हारे पिता के घराने को आग में जला देंगे
  rationale: פֶּן यहाँ धमकी के परिणाम को प्रस्तुत करता है। हिन्दी में ‘नहीं तो’ धमकी की शक्ति को सहज रूप से व्यक्त करता है और आग का स्पष्ट बिंब बनाए रखता है।
- source_word: בֵּית אָבִיךְ
  choice: तुम्हारे पिता के घराने
  rationale: ‘पिता का घर’ भौतिक मकान के साथ परिवार या घराने को भी सूचित कर सकता है; मुख्य पाठ में ‘घराना’ सामाजिक इकाई को स्पष्ट करता है और विकल्प पादटिप्पणी में रखा गया है।
- source_word: הֲלְיָרְשֵׁנוּ
  choice: कि हमारी संपत्ति हड़प लो
  rationale: ירשׁ यहाँ किसी को उसकी वस्तुओं या अधिकार से वंचित कर उन पर अधिकार कर लेने का भाव देता है। ‘संपत्ति हड़प लो’ दाँव के प्रसंग में अर्थ को सामान्य पाठक के लिए स्पष्ट रखता है।
- source_word: קְרָאתֶם לָנוּ
  choice: क्या तुम लोगों ने हमें इसलिए बुलाया था
  rationale: बहुवचन क्रिया קְרָאתֶם को ‘तुम लोगों ने’ से बनाए रखा गया है; इससे पत्नी के साथ उसके परिवार या मेजबान पक्ष पर लगाया गया आरोप प्रकट होता है।
- source_word: הֲלֹא
  choice: यही बात है न?
  rationale: यह आरोप की पुष्टि चाहने वाला आलंकारिक प्रश्न है; हिन्दी में यह रूप उसके दबावपूर्ण भाव को स्वाभाविक ढंग से रखता है।
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: सातवें दिन
  rationale: समय-सूचक पद का सीधा और स्वाभाविक हिन्दी अनुवाद।
