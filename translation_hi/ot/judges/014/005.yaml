  text: וַ/יֵּ֧רֶד שִׁמְשׁ֛וֹן וְ/אָבִ֥י/ו וְ/אִמּ֖/וֹ תִּמְנָ֑תָ/ה וַ/יָּבֹ֨אוּ֙ עַד כַּרְמֵ֣י תִמְנָ֔תָ/ה וְ/הִנֵּה֙ כְּפִ֣יר אֲרָי֔וֹת שֹׁאֵ֖ג לִ/קְרָאתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/014/005.yaml
  text: Then Samson went down with his father and his mother to Timnah[a], and they came as far as the vineyards of Timnah. And behold[c][b], a young lion was roaring as it came toward him.
translation:
  language: hi
  text: तब शिमशोन अपने पिता और माता के साथ तिम्ना की ओर उतर गया, और वे तिम्ना के अंगूर के बागों तक आए। और देखो, एक जवान सिंह[a] उसकी ओर दहाड़ रहा था।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, ‘सिंहों का एक जवान सिंह’; यह ‘एक जवान सिंह’ के अर्थ में प्रयुक्त मुहावरा है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘उससे मिलने के लिए दहाड़ रहा था।’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: उतर गया
  rationale: मूल क्रिया ירד में नीचे की ओर जाने का भाव है; तिम्ना की ओर यात्रा के भौगोलिक संकेत को बनाए रखने के लिए ‘उतर गया’ उपयुक्त है।
- source_word: תִּמְנָתָה
  choice: तिम्ना को
  rationale: दिशासूचक ה गंतव्य की ओर गति बताता है; आधुनिक हिन्दी में ‘तिम्ना को’ इस गति को स्वाभाविक रूप से व्यक्त करता है।
- source_word: וַיָּבֹאוּ עַד
  choice: जब वे ... तक पहुँचे
  rationale: בוא के साथ עַד यात्रा के किसी निश्चित पड़ाव तक पहुँचने का अर्थ देता है। हिन्दी में आश्रित वाक्य दृश्य के क्रम को सहज बनाता है।
- source_word: כַּרְמֵי תִמְנָתָה
  choice: तिम्ना के अंगूर के बाग़ों
  rationale: כֶּרֶם अंगूर की बारी या दाखबारी है; ‘अंगूर के बाग़’ साधारण आधुनिक पाठक के लिए स्पष्ट और स्वाभाविक है।
- source_word: וְהִנֵּה
  choice: तो देखो
  rationale: הִנֵּה अचानक सामने आए दृश्य की ओर ध्यान खींचता है; ‘तो देखो’ उसकी जीवंतता बनाए रखता है और आधुनिक हिन्दी में समझने योग्य है।
- source_word: כְּפִיר אֲרָיוֹת
  choice: एक जवान सिंह
  rationale: כְּפִיר कम आयु के, पर छोटे शावक मात्र नहीं, सिंह को दर्शाता है। पूरा इब्रानी पद एक मुहावरेदार संरचना है, जिसे हिन्दी में स्वाभाविक रूप से ‘जवान सिंह’ कहा गया है।
- source_word: שֹׁאֵג
  choice: दहाड़ता हुआ
  rationale: कृदंत जारी क्रिया का सजीव चित्र प्रस्तुत करता है; ‘दहाड़ता हुआ’ उसी निरंतर क्रिया को व्यक्त करता है।
- source_word: לִקְרָאתוֹ
  choice: उसकी ओर ... आ रहा था
  rationale: לִקְרָאתוֹ का अर्थ ‘उसकी ओर’ या ‘उससे मिलने को’ हो सकता है। हिंसक प्रसंग में ‘उसकी ओर ... आ रहा था’ स्वाभाविक है, जबकि अधिक शाब्दिक संभावना पादटिप्पणी में रखी गई है।
