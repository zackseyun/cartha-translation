- source_word: וַתְּהִי
  choice: बन गई
  rationale: यहाँ היה का कथात्मक रूप स्थिति-परिवर्तन और परिणाम बताता है; इसलिए स्थिर अर्थ वाले ‘थी’ की अपेक्षा ‘बन गई’ अधिक उपयुक्त है।
- source_word: אֵשֶׁת שִׁמְשׁוֹן
  choice: शिमशोन की पत्नी
  rationale: सम्बन्धवाचक पदबंध वैवाहिक सम्बन्ध को सीधे व्यक्त करता है; यह आधुनिक हिन्दी में स्वाभाविक रूप है।
- source_word: לְמֵרֵעֵהוּ
  choice: उसके उस साथी की पत्नी
  rationale: היה के साथ לְ यहाँ किसी की पत्नी हो जाने का भाव देता है। מֵרֵעַ सामाजिक साथी या संगी को सूचित करता है; विवाह-प्रसंग में ‘साथी’ उपयुक्त और स्वाभाविक है।
- source_word: אֲשֶׁר רֵעָה לוֹ
  choice: जो उसका मित्र रहा था
  rationale: सम्बन्धवाचक उपवाक्य उस व्यक्ति को शिमशोन से मित्रता या संगति रखने वाले के रूप में पहचानता है। यहाँ क्रिया का अर्थ चरवाही करना नहीं, बल्कि मित्र अथवा संगी होना है।
