base_translation:
  language: en
  yaml_path: translation/ot/judges/014/003.yaml
  text: But his father and his mother said to him[a], “Is there not a woman among the daughters of your brothers or among all my people, that you are going to take a wife from the uncircumcised Philistines?” But Samson said to his father, “Get her for me[b], for she is right in my eyes.”
translation:
  language: hi
  text: तब उसके पिता और उसकी माता ने उससे कहा, “क्या तेरे भाइयों की बेटियों[a] में या मेरे सारे लोगों में कोई स्त्री नहीं है, जो तू खतनारहित पलिश्तियों में से पत्नी लेने जा रहा है?” लेकिन शिमशोन ने अपने पिता से कहा, “उसी को मेरे लिए ले आइए, क्योंकि वही मेरी दृष्टि में ठीक है[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “तेरे भाइयों की बेटियाँ” से सम्भवतः शिमशोन के निकट संबंधियों या उसके अपने कुल-समुदाय की स्त्रियाँ अभिप्रेत हैं, केवल उसके सगे भाइयों की बेटियाँ नहीं।
    reason: cultural_note
  - marker: b
    text: या, “वही मुझे अच्छी लगती है” अथवा “वही मुझे उचित जान पड़ती है।” इब्रानी मुहावरा व्यक्तिगत पसंद, आकर्षण या अनुमोदन व्यक्त कर सकता है; मुख्य पाठ न्यायियों में बार-बार आने वाले “अपनी दृष्टि में ठीक” विषय की शब्दावली भी बनाए रखता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַאֵין
  choice: क्या ... कोई स्त्री नहीं है
  rationale: नकारात्मक प्रश्न की आलंकारिक शक्ति को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: בִּבְנוֹת אַחֶיךָ
  choice: तेरे भाइयों की बेटियों में
  rationale: इब्रानी के पारिवारिक शब्दों को निकटता से सुरक्षित रखा गया है; यहाँ ‘भाई’ का अर्थ व्यापक संबंधी या कुल-समुदाय भी हो सकता है, जिसे पादटिप्पणी में स्पष्ट किया गया है।
- source_word: וּבְכָל עַמִּי
  choice: या मेरे सारे लोगों में
  rationale: इब्रानी में प्रथम पुरुष एकवचन ‘मेरे’ है; अपेक्षित ‘हमारे’ में बदलकर पाठ को समतल नहीं किया गया।
- source_word: אִשָּׁה ... אִשָּׁה
  choice: स्त्री ... पत्नी
  rationale: पहले प्रयोग में विवाह योग्य स्त्री की सामान्य पहचान है, जबकि दूसरे प्रयोग में विवाह का आशय स्पष्ट है।
- source_word: הוֹלֵךְ לָקַחַת
  choice: लेने जा रहा है
  rationale: इब्रानी क्रियात्मक रचना को बनाए रखते हुए हिन्दी में विवाह-संदर्भ को स्पष्ट और स्वाभाविक रखा गया है।
- source_word: מִפְּלִשְׁתִּים הָעֲרֵלִים
  choice: खतनारहित पलिश्तियों में से
  rationale: जातीय नाम और वाचा-संबंधी अर्थ वाला विशेषण दोनों सुरक्षित रखे गए हैं; अपमानसूचक तीखेपन को नरम नहीं किया गया।
- source_word: אוֹתָהּ קַח לִי
  choice: उसी को मेरे लिए ले आइए
  rationale: विवाह तय कराने में पिता की भूमिका और आज्ञार्थक बल को स्वाभाविक हिन्दी में व्यक्त करता है; पिता को संबोधन में सम्मानसूचक रूप रखा गया है।
- source_word: יָשְׁרָה בְעֵינַי
  choice: वही मेरी दृष्टि में ठीक है
  rationale: ‘मेरी आँखों में सीधी/ठीक’ इब्रानी मुहावरे के मूल्यांकनात्मक भाव और न्यायियों में बार-बार आने वाले ‘अपनी दृष्टि में ठीक’ विषयगत प्रतिध्वनि दोनों को सुरक्षित रखता है।
theological_decisions:
- issue: न्यायियों में יָשְׁרָה בְעֵינַי की कथात्मक और नैतिक प्रतिध्वनि
  choice: वही मेरी दृष्टि में ठीक है
  alternative: वही मुझे अच्छी लगती है / वही मुझे उचित जान पड़ती है
  rationale: मुहावरा आकर्षण, पसंद या उपयुक्तता व्यक्त कर सकता है। मुख्य पाठ का रूप उस अस्पष्टता को पूरी तरह समाप्त किए बिना न्यायियों की आवर्ती उक्ति—अपनी दृष्टि में ठीक करना—से संबंध बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण कथात्मक रूप अपनाया गया है। माता-पिता की वाणी में ‘तू/तेरे’ मूल पाठ की निकट पारिवारिक संबोधन-शैली को दर्शाता है, जबकि पुत्र द्वारा पिता से कहे गए वाक्य में हिन्दी-सम्मत सम्मानसूचक ‘ले आइए’ रखा गया है। ‘खतनारहित’ और ‘मेरी दृष्टि में ठीक’ जैसे धर्म-सांस्कृतिक रूपों को जानबूझकर सरलतर पर अर्थ-संकुचित विकल्पों से नहीं बदला गया।
