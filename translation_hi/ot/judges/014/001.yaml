  yaml_path: translation/ot/judges/014/001.yaml
  text: Then Samson went down to Timnah[a], and at Timnah he saw a woman from the daughters of the Philistines.
translation:
  language: hi
  text: तब शिमशोन नीचे तिम्ना को गया, और तिम्ना में उसने पलिश्तियों की बेटियों में से एक स्त्री को देखा।[क]
  philosophy: optimal-equivalence
  footnotes:
  - marker: क
    text: 'या, अधिक स्वाभाविक ढंग से: ‘पलिश्ती स्त्रियों में से एक।’'
    reason: ‘पलिश्तियों की बेटियों में से’ इब्रानी के शाब्दिक पारिवारिक-जातीय प्रयोग को बनाए रखता है; वैकल्पिक पदबंध हिन्दी में उसके मुहावरेदार अर्थ को स्पष्ट करता है।
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: उतर गया
  rationale: ירד का मूल अर्थ ‘नीचे जाना/उतरना’ है। ‘उतर गया’ इब्रानी के स्थलाकृतिक वर्णन को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: שִׁמְשׁוֹן
  choice: शिमशोन
  rationale: व्यक्तिनाम को इब्रानी उच्चारण के निकट देवनागरी में लिप्यंतरित किया गया है।
- source_word: תִּמְנָתָה
  choice: तिम्ना को
  rationale: दिशासूचक ה स्थान की ओर गति व्यक्त करता है; ‘तिम्ना को’ हिन्दी में गंतव्य को स्पष्ट करता है।
- source_word: וַיַּרְא
  choice: उसने ... देखा
  rationale: ראה का सामान्य अर्थ ‘देखना’ है; यह कथन में कोई अतिरिक्त आशय नहीं जोड़ता।
- source_word: אִשָּׁה
  choice: एक स्त्री
  rationale: אשה का अर्थ प्रसंगानुसार ‘स्त्री’ या ‘पत्नी’ हो सकता है, पर यहाँ विवाह से पहले उसे देखने की बात है; इसलिए ‘स्त्री’ कम व्याख्यात्मक है।
- source_word: בְּתִמְנָתָה
  choice: वहाँ
  rationale: समान स्थाननाम की तुरन्त पुनरावृत्ति को स्वाभाविक हिन्दी में सर्वनामिक स्थान-सूचक से व्यक्त किया गया है; अर्थ तिम्ना ही रहता है।
- source_word: מִבְּנוֹת פְּלִשְׁתִּים
  choice: पलिश्तियों की बेटियों में से
  rationale: यह इब्रानी के पारिवारिक-जातीय मुहावरे ‘पलिश्तियों की बेटियों में से’ को सुरक्षित रखता है और हिन्दी में बोधगम्य है।
