  text: And when they saw him[a], they took thirty companions, and they were with him.
translation:
  language: hi
  text: जब उन्होंने उसे देखा, तो उन्होंने तीस साथी लिए, और वे उसके साथ थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כִּרְאוֹתָם
  choice: जब उन्होंने ... देखा, तब
  rationale: यहाँ וַיְהִי कथा के प्रवाह को आगे बढ़ाता है और כִּרְאוֹתָם समयसूचक है। हिंदी का ‘जब…तब’ संबंध को स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: אֹתוֹ
  choice: उसे
  rationale: यह प्रत्यक्ष कर्म सर्वनाम शिमशोन की ओर संकेत करता है।
- source_word: וַיִּקְחוּ
  choice: उन्होंने ... को लिया
  rationale: לקח का मूल अर्थ ‘लेना’ है। इस सीधे अनुवाद से यह अनावश्यक रूप से तय नहीं किया जाता कि उन पुरुषों को चुना गया, नियुक्त किया गया या वहाँ लाया गया।
- source_word: שְׁלֹשִׁים מֵרֵעִים
  choice: तीस साथियों
  rationale: מֵרֵעִים का अर्थ मित्र या साथी हो सकता है। ‘साथी’ संबंध को व्यक्त करता है, पर किसी औपचारिक वैवाहिक भूमिका को निश्चित नहीं करता।
- source_word: וַיִּהְיוּ אִתּוֹ
  choice: और वे उसके साथ रहे
  rationale: यह सरल इब्रानी वाक्यांश ‘वे उसके साथ थे’ का स्वाभाविक हिंदी रूप है; ‘साथ रहे’ प्रसंग में उपस्थिति और संगति दोनों को व्यक्त करता है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘साथियों’ के बाद पादटिप्पणी-चिह्न रखा गया है, क्योंकि lexical ambiguity מֵרֵעִים में है, न कि ‘उसे’ में।
