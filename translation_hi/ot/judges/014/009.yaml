base_translation:
  language: en
  yaml_path: translation/ot/judges/014/009.yaml
  text: He scraped it into his hands and went on[a], eating as he went. Then he went to his father and mother and gave some to them, and they ate. But he did not tell them that he had scraped the honey from the carcass of the lion.
translation:
  language: hi
  text: उसने उसे अपने हाथों में निकाल लिया[a] और खाते-खाते आगे चलता गया। फिर वह अपने पिता और अपनी माता के पास गया और उसमें से कुछ उन्हें दिया, और उन्होंने खाया। पर उसने उन्हें यह नहीं बताया कि उसने वह शहद सिंह की लाश में से निकाला था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘उसे खुरचकर अपनी हथेलियों में ले लिया’ अथवा ‘उसे निकाल लिया’; इब्रानी क्रिया सिंह की लाश के भीतर से हाथ से शहद निकालने का संकेत देती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְדֵּהוּ
  choice: उसे अपने हाथों में निकाल लिया
  rationale: रדה यहाँ सिंह की लोथ के भीतर से शहद हाथ से निकालने की क्रिया बताता है। ‘निकाल लिया’ स्वाभाविक हिन्दी है और क्रिया की विधि को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: אֶל כַּפָּיו
  choice: अपने हाथों में
  rationale: כף का अर्थ हथेली या हाथ हो सकता है; ‘हाथों में’ सहज आधुनिक हिन्दी में आशय स्पष्ट करता है।
- source_word: וַיֵּלֶךְ הָלוֹךְ וְאָכֹל
  choice: खाते-खाते आगे चलता गया
  rationale: ससीम क्रिया और infinitive absolute का संयोजन चलने और खाने की जारी, साथ-साथ होने वाली क्रिया व्यक्त करता है।
- source_word: וַיֵּלֶךְ אֶל אָבִיו וְאֶל אִמּוֹ
  choice: फिर वह अपने पिता और अपनी माता के पास गया
  rationale: הלך का सीधा अर्थ ‘गया’ है; ‘फिर’ कथात्मक क्रम को स्वाभाविक बनाता है। दोनों संबंधों के साथ ‘अपने’ रखना हिन्दी में स्पष्ट और गरिमापूर्ण है।
- source_word: וַיִּתֵּן לָהֶם
  choice: उसमें से कुछ उन्हें दिया
  rationale: संदर्भ में वस्तु शहद है और दी गई मात्रा आंशिक है; ‘उसमें से कुछ’ निहित अंशवाचक अर्थ को सहज रूप से प्रकट करता है।
- source_word: וַיֹּאכֵלוּ
  choice: उन्होंने खाया
  rationale: इब्रानी में कर्म व्यक्त नहीं है और संदर्भ से स्पष्ट है; हिन्दी में भी उसे दोहराना आवश्यक नहीं।
- source_word: וְלֹא הִגִּיד לָהֶם
  choice: पर उसने उन्हें यह नहीं बताया
  rationale: נגד यहाँ बताने या सूचित करने के अर्थ में है। ‘पर’ पिछले कथन के साथ विरोध को स्वाभाविक रूप से दर्शाता है।
- source_word: מִגְּוִיַּת הָאַרְיֵה
  choice: सिंह की लोथ में से
  rationale: גויה मृत देह को दर्शाता है। किसी पशु के लिए ‘लोथ’ मृत देह की कठोर, ठोस छवि बनाए रखता है; ‘में से’ भीतर से निकाले जाने का भाव देता है।
- source_word: רָדָה הַדְּבָשׁ
  choice: वह शहद ... निकाला था
  rationale: पहली क्रिया के अनुरूप ‘निकाला’ रखा गया है। ‘था’ पहले घट चुकी क्रिया को स्पष्ट करता है।
