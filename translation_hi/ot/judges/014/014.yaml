  text: And he said to them[a], “Out of the eater came food[b], and out of the strong came sweetness.” But they could not tell the riddle for three days.
translation:
  language: hi
  text: उसने उनसे कहा, “खाने वाले में से भोजन निकला, और बलवान[a] में से मिठास निकली।” पर वे तीन दिन तक पहेली का उत्तर न बता सके[b]।
  philosophy: optimal-equivalence
  footnotes:
