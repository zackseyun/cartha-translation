    text: या “उग्र।” इब्रानी विशेषण का अर्थ “बलवान,” “शक्तिशाली” या “उग्र” हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “वे तीन दिन तक पहेली का अर्थ न समझा सके।”
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵהָאֹכֵל
  choice: खाने वाले में से
  rationale: इब्रानी में אכל का कर्तृवाचक कृदंत निश्चित उपपद के साथ संज्ञा के रूप में प्रयुक्त है, अर्थात ‘खाने वाला’। ‘में से’ מן और इस पहेली में किसी वस्तु के भीतर से निकलने की छवि को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מַאֲכָל
  choice: भोजन
  rationale: यह संज्ञा खाने की वस्तु या खाद्य सामग्री को दर्शाती है। ‘भोजन’ संक्षिप्त है और पहेली की समानांतर संरचना बनाए रखता है।
- source_word: וּמֵעַז
  choice: और बलवान में से
  rationale: עַז का अर्थ ‘बलवान’, ‘शक्तिशाली’ या ‘उग्र’ हो सकता है। ‘बलवान’ मूल की संक्षिप्तता और अस्पष्टता को बनाए रखता है तथा सिंह का उल्लेख समय से पहले नहीं करता।
- source_word: מָתוֹק
  choice: मिठास
  rationale: यहाँ विशेषण संज्ञा की तरह प्रयुक्त है। ‘मिठास’ उसके भाववाचक अर्थ को व्यक्त करती है और ‘भोजन’ के साथ काव्यात्मक संतुलन रखती है।
- source_word: לְהַגִּיד הַחִידָה
  choice: पहेली का उत्तर न बता सके
  rationale: הגיד का मूल अर्थ ‘बताना’ या ‘घोषित करना’ है। पहेली के प्रसंग में स्वाभाविक हिन्दी के लिए ‘उत्तर बता सके’ कहा गया है, जबकि व्याख्या करने का अर्थ भी संभव है।
- source_word: שְׁלֹשֶׁת יָמִים
  choice: तीन दिन तक
  rationale: यह अवधि को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है और इब्रानी से अधिक सटीक समय-सीमा आरोपित नहीं करता।
