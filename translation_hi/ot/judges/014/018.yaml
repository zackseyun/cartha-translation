  text: וַ/יֹּ֣אמְרוּ ל/וֹ֩ אַנְשֵׁ֨י הָ/עִ֜יר בַּ/יּ֣וֹם הַ/שְּׁבִיעִ֗י בְּ/טֶ֨רֶם֙ יָבֹ֣א הַ/חַ֔רְסָ/ה מַה מָּת֣וֹק מִ/דְּבַ֔שׁ וּ/מֶ֥ה עַ֖ז מֵ/אֲרִ֑י וַ/יֹּ֣אמֶר לָ/הֶ֔ם לוּלֵא֙ חֲרַשְׁתֶּ֣ם בְּ/עֶגְלָתִ֔/י לֹ֥א מְצָאתֶ֖ם חִידָתִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/014/018.yaml
  text: And the men of the city said to him on the seventh day[a], before the sun went down, “What is sweeter than honey, and what is stronger than a lion?” And he said to them, “If you had not plowed with my heifer[b], you would not have found out my riddle.”
translation:
  language: hi
  text: तब सातवें दिन, सूर्यास्त से पहले[a], नगर के पुरुषों ने उससे कहा, “शहद से अधिक मीठा क्या है, और सिंह से अधिक बलवान क्या है?” उसने उनसे कहा, “यदि तुम मेरी बछिया को साथ लेकर हल न चलाते[b], तो मेरी पहेली न सुलझा पाते।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “सूर्य के भीतर आने से पहले”; यह सूर्यास्त से पहले का मुहावरा है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “यदि तुम मेरी बछिया को साथ लेकर हल न चलाते।” शिमशोन अपनी पत्नी के लिए यह रूपक इस्तेमाल करके उन पर आरोप लगाता है कि उन्होंने पहेली सुलझाने के लिए उसका उपयोग किया।
    reason: cultural_note
lexical_decisions:
- source_word: אַנְשֵׁי הָעִיר
  choice: नगर के पुरुषों
  rationale: इब्रानी के पुल्लिंग बहुवचन को स्पष्ट रखते हुए आधुनिक और स्वाभाविक हिन्दी अभिव्यक्ति।
- source_word: בְּטֶרֶם יָבֹא הַחַרְסָה
  choice: सूर्यास्त से पहले
  rationale: शाब्दिक रूप से ‘सूर्य के भीतर आने से पहले’; प्रसंग में यह सूर्य डूबने का मुहावरा है।
- source_word: מַה מָּתוֹק מִדְּבַשׁ
  choice: मधु से अधिक मीठा क्या है
  rationale: מִן के तुलनात्मक अर्थ को स्पष्ट और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: וּמֶה עַז מֵאֲרִי
  choice: सिंह से अधिक बलवान क्या है
  rationale: עַז के बल या सामर्थ्य-संबंधी अर्थ और समानांतर तुलनात्मक रचना को सुरक्षित रखता है।
- source_word: לוּלֵא חֲרַשְׁתֶּם בְּעֶגְלָתִי
  choice: यदि तुम मेरी बछिया से हल न चलवाते
  rationale: विपरीत-तथ्य शर्त और कृषि-रूपक दोनों सुरक्षित हैं; हिन्दी में करणवाचक प्रयोग से आशय स्वाभाविक बनता है।
- source_word: לֹא מְצָאתֶם חִידָתִי
  choice: तो मेरी पहेली का उत्तर न खोज पाते
  rationale: ‘खोजना/पा लेना’ की मूल छवि रखते हुए पहेली सुलझाने का प्रासंगिक अर्थ स्पष्ट करता है।
