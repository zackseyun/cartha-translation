lexical_decisions:
- source_word: וַיֵּרֶד
  choice: नीचे गया
  rationale: मूल क्रिया ירד में उतरने या नीचे जाने का दिशात्मक भाव है; हिंदी में “नीचे गया” इसे बनाए रखता है।
- source_word: אָבִיהוּ
  choice: उसका पिता
  rationale: पुल्लिंग एकवचन प्रत्यय संदर्भ में शिमशोन की ओर संकेत करता है।
- source_word: אֶל הָאִשָּׁה
  choice: उस स्त्री के पास
  rationale: मूल पाठ सामान्य रूप से “उस स्त्री” कहता है; संदर्भ से वह शिमशोन की होने वाली पत्नी है, पर अनुवाद उस संबंध को अतिरिक्त रूप से स्पष्ट नहीं करता।
- source_word: וַיַּעַשׂ
  choice: दिया
  rationale: עשה का अर्थ व्यापक रूप से करना या बनाना है; भोज के साथ हिंदी में “भोज दिया” स्वाभाविक और अर्थानुकूल प्रयोग है।
- source_word: שָׁם
  choice: वहाँ
  rationale: यह स्थानवाचक क्रियाविशेषण का सीधा और स्वाभाविक हिंदी रूप है।
- source_word: מִשְׁתֶּה
  choice: एक भोज
  rationale: यह शब्द उत्सवी भोजन को दर्शाता है जिसमें प्रायः मद्यपान भी सम्मिलित होता था; “भोज” अर्थ को अनावश्यक रूप से सीमित किए बिना स्पष्ट रखता है।
- source_word: כִּי כֵן יַעֲשׂוּ
  choice: क्योंकि ... ऐसा ही करते थे
  rationale: यह वाक्यांश उस समय की प्रचलित रीति बताता है; अपूर्ण क्रिया के आदतन भाव को “करते थे” स्वाभाविक रूप से व्यक्त करता है।
- source_word: הַבַּחוּרִים
  choice: जवान
  rationale: בָּחוּר विवाह योग्य या युवावस्था के पुरुष को दर्शाता है; “जवान” संक्षिप्त, स्वाभाविक और पर्याप्त रूप से सटीक है।
