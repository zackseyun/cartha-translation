base_translation:
  language: en
  yaml_path: translation/ot/judges/014/013.yaml
  text: But if you cannot tell me[a], then you must give me thirty linen garments and thirty changes of clothes.” And they said to him, “Tell your riddle, and let us hear it.”
translation:
  language: hi
  text: पर यदि तुम मुझे न बता सको, तो तुम्हें मुझे महीन लिनन के तीस वस्त्र[a] और बदलने के तीस जोड़े कपड़े देने होंगे।” उन्होंने उससे कहा, “अपनी पहेली कहो, ताकि हम उसे सुनें।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘महीन लिनन के तीस कपड़े’; इब्रानी शब्द महीन लिनन की वस्तुओं को सूचित कर सकता है, पर यहाँ ‘बदलने के जोड़े कपड़ों’ के समानांतर होने के कारण संभवतः पहनने योग्य वस्त्र अभिप्रेत हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: תוּכְלוּ
  choice: सको
  rationale: יכל सामर्थ्य व्यक्त करता है; शर्त वाले वाक्य में ‘न बता सको’ स्वाभाविक हिंदी है और अनिच्छा नहीं, असमर्थता दर्शाता है।
- source_word: לְהַגִּיד לִי
  choice: मुझे इसका अर्थ ... बता
  rationale: हिफ़ील में נגד का अर्थ ‘बताना’ है। प्रसंग में निहित कर्म पहेली का उत्तर अथवा अर्थ है; हिंदी में ‘इसका अर्थ बता’ इसे स्वाभाविक ढंग से स्पष्ट करता है, यद्यपि स्रोत केवल ‘मुझे बताना’ कहता है।
- source_word: וּנְתַתֶּם אַתֶּם לִי
  choice: तो तुम्हें मुझे ... देने होंगे
  rationale: शर्त के परिणामस्वरूप बाज़ी की बाध्यता को ‘देने होंगे’ स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: סְדִינִים
  choice: मलमल के ... वस्त्र
  rationale: यह शब्द महीन लिनन के कपड़े अथवा पहनने योग्य वस्तु को सूचित कर सकता है। वस्त्रों की बाज़ी के इस प्रसंग में ‘मलमल के वस्त्र’ उपयुक्त है, जबकि आधुनिक ‘चादरें’ भ्रामक हो सकता है।
- source_word: חֲלִיפוֹת בְּגָדִים
  choice: पहनने के लिए ... जोड़े कपड़े
  rationale: पदबंध बदलकर पहनने के वस्त्रों अथवा कपड़ों के पूरे जोड़ों को दर्शाता है; यह हिंदी पाठक के लिए स्पष्ट है और पहली वस्तु से अंतर बनाए रखता है।
- source_word: חוּדָה
  choice: कहो
  rationale: חוד का आज्ञार्थक रूप पहेली प्रस्तुत करने के अर्थ में है; ‘अपनी पहेली कहो’ बोलचाल में स्वाभाविक और स्रोत के निकट है।
- source_word: חִידָתְךָ
  choice: अपनी पहेली
  rationale: חידה का सामान्य और प्रसंगानुकूल हिंदी पर्याय ‘पहेली’ है।
- source_word: וְנִשְׁמָעֶנָּה
  choice: ताकि हम उसे सुनें
  rationale: प्रथम पुरुष बहुवचन इच्छार्थक रूप और स्त्रीलिंग प्रत्यय, जो पहेली की ओर संकेत करता है, हिंदी में ‘ताकि हम उसे सुनें’ से स्वाभाविक रूप में व्यक्त होते हैं।
