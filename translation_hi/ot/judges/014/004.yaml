id: JDG.14.4
reference: Judges 14:4
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/אָבִ֨י/ו וְ/אִמּ֜/וֹ לֹ֣א יָדְע֗וּ כִּ֤י מֵ/יְהוָה֙ הִ֔יא כִּי תֹאֲנָ֥ה הֽוּא מְבַקֵּ֖שׁ מִ/פְּלִשְׁתִּ֑ים וּ/בָ/עֵ֣ת הַ/הִ֔יא פְּלִשְׁתִּ֖ים מֹשְׁלִ֥ים בְּ/יִשְׂרָאֵֽל־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/014/004.yaml
  text: But his father and mother did not know that it was from Yahweh[a], for he was seeking an occasion from the Philistines[b]. At that time the Philistines were ruling over Israel.
translation:
  language: hi
  text: पर उसके पिता और माता नहीं जानते थे कि यह बात यहोवा की ओर से थी, क्योंकि वह पलिश्तियों के विरुद्ध कदम उठाने का अवसर ढूँढ़ रहा था।[a] उस समय पलिश्ती इस्राएल पर शासन कर रहे थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या संभवतः, “क्योंकि वह पलिश्तियों के विरुद्ध कदम उठाने का अवसर ढूँढ़ रहा था,” जहाँ “वह” से यहोवा अभिप्रेत हैं। इब्रानी में यह अर्थ संभव है, यद्यपि प्रसंग अधिक स्वाभाविक रूप से शिमशोन की ओर संकेत करता है। “अवसर” का अनुवाद “बहाना” या “मौका” भी हो सकता है।
    reason: कर्ता की व्याकरणिक अस्पष्टता तथा תֹאֲנָה के ‘अवसर/बहाना’ संबंधी वैकल्पिक अर्थ को सुरक्षित रखना।
lexical_decisions:
- source_word: מֵיְהוָה
  choice: यहोवा की ओर से
  rationale: परमेश्वर के वाचा-नाम को ‘यहोवा’ के रूप में व्यक्त किया गया है; ‘की ओर से’ स्रोत के מִן को स्वाभाविक हिन्दी में दर्शाता है।
- source_word: הִיא
  choice: यह ... था
  rationale: स्त्रीलिंग सर्वनाम प्रसंग में पूरे मामले या परिस्थिति की ओर संकेत करता है; हिन्दी में नपुंसक भाव वाला ‘यह ... था’ स्वाभाविक है।
- source_word: תֹאֲנָה
  choice: कार्रवाई करने का अवसर
  rationale: संज्ञा विरोधी पक्ष के विरुद्ध कदम उठाने के बहाने या अवसर को सूचित करती है। मुख्य पाठ में ‘अवसर’ अनावश्यक रूप से कपट का भाव जोड़े बिना आशय स्पष्ट करता है।
- source_word: מְבַקֵּשׁ
  choice: ढूँढ़ रहा था
  rationale: कृदन्त चल रही या समकालीन क्रिया को व्यक्त करता है; यह हिन्दी रूप उस पक्ष को बनाए रखता है।
- source_word: מִפְּלִשְׁתִּים
  choice: पलिश्तियों के विरुद्ध
  rationale: शाब्दिक रूप ‘पलिश्तियों से’ है, पर תֹאֲנָה और בקשׁ के साथ प्रसंग शत्रुतापूर्ण कार्रवाई के लिए अवसर ढूँढ़ने का है; ‘के विरुद्ध’ लक्ष्य-संबंध को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: וּבָעֵת הַהִיא
  choice: उस समय
  rationale: यह सहज हिन्दी में कथा की काल-संबंधी पृष्ठभूमि देता है।
- source_word: מֹשְׁלִים בְּיִשְׂרָאֵל
  choice: इस्राएल पर शासन कर रहे थे
  rationale: कृदन्त उस समय जारी प्रभुत्व को दर्शाता है; ‘शासन कर रहे थे’ राजनीतिक अधीनता को स्पष्ट और स्वाभाविक रूप में व्यक्त करता है।
- source_word: וְאָבִיו וְאִמּוֹ
  choice: उसके पिता और उसकी माता
  rationale: दोनों संबंधों को स्पष्ट रखते हुए हिन्दी का स्वाभाविक समन्वय अपनाया गया है।
- source_word: לֹא יָדְעוּ
  choice: नहीं जानते थे
  rationale: ידע के पूर्ण रूप का सीधा और सहज हिन्दी अनुवाद।
theological_decisions:
- issue: शिमशोन के विवाह-संबंधी प्रयत्न और उससे होने वाले संघर्ष में ईश्वरीय संलग्नता
  choice: पद इस मामले को यहोवा की ओर से बताता है और साथ ही अवसर ढूँढ़ने वाले मानवीय कर्ता का भी उल्लेख करता है।
  alternative: इसे या तो केवल प्रत्यक्ष ईश्वरीय प्रेरण अथवा केवल बाद में किए गए ईश्वरीय उपयोग के रूप में समझाना।
  rationale: इब्रानी पाठ ईश्वरीय स्रोत और मानवीय क्रिया दोनों को साथ रखता है। अनुवाद इस तनाव को किसी एक व्यवस्थित धर्मवैज्ञानिक निष्कर्ष में नहीं बदलता।
- issue: מְבַקֵּשׁ ‘वह ढूँढ़ रहा था’ का कर्ता
  choice: मुख्य पाठ में ‘वह’ को शिमशोन माना गया है।
  alternative: ‘वह’ से यहोवा अभिप्रेत हो सकते हैं।
  rationale: व्यापक कथा-संदर्भ शिमशोन को इस विवाह-प्रसंग के द्वारा पलिश्तियों के विरुद्ध अवसर ढूँढ़ने वाला बताने के पक्ष में है, यद्यपि इब्रानी व्याकरण यहोवा को कर्ता मानने की संभावना पूरी तरह बंद नहीं करता; इसलिए विकल्प पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, कथात्मक और सामान्य पाठक के लिए स्पष्ट शैली। ‘कार्रवाई करने का अवसर’ अकेले ‘अवसर’ की तुलना में लक्ष्य को स्पष्ट करता है, जबकि पादटिप्पणी ‘बहाना’ का संभावित अर्थ और कर्ता की अस्पष्टता सुरक्षित रखती है।
