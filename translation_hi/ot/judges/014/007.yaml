  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֵּ֖רֶד וַ/יְדַבֵּ֣ר לָ/אִשָּׁ֑ה וַ/תִּישַׁ֖ר בְּ/עֵינֵ֥י שִׁמְשֽׁוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/014/007.yaml
  text: Then he went down and spoke to the woman[a], and she was pleasing in Samson’s eyes.
translation:
  language: hi
  text: तब वह नीचे गया और उस स्त्री से बात की; वह शिमशोन की दृष्टि में अच्छी लगी।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या अधिक मुहावरेदार ढंग से, “उसने शिमशोन को प्रसन्न किया” अथवा “वह शिमशोन को सही लगी।”
    reason: יָשַׁר בְּעֵינֵי के अर्थ-क्षेत्र में पसंद, अनुकूलता और अपने आकलन में सही लगना—तीनों भाव संभव हैं।
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: तब वह नीचे गया
  rationale: יָרַד का मूल अर्थ ‘नीचे जाना’ है। तिम्ना की ओर भौगोलिक गति को बनाए रखते हुए ‘तब’ हिब्रू कथा-क्रम को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וַיְדַבֵּר לָאִשָּׁה
  choice: उस स्त्री से बात की
  rationale: דבר के साथ ל यहाँ किसी व्यक्ति से बोलने का भाव देता है। आधुनिक हिन्दी में ‘से बात की’ स्वाभाविक है और परस्पर बातचीत की संभावना को अनावश्यक रूप से सीमित नहीं करता।
- source_word: לָאִשָּׁה
  choice: उस स्त्री
  rationale: אִשָּׁה का अर्थ संदर्भ के अनुसार ‘स्त्री’ या ‘पत्नी’ हो सकता है। यहाँ विवाह अभी नहीं हुआ है, इसलिए ‘स्त्री’ सबसे सटीक और कम व्याख्यात्मक है।
- source_word: וַתִּישַׁר
  choice: अच्छी लगी
  rationale: יָשַׁר यहाँ शिमशोन के आकलन में उचित, मनभावनी या अनुकूल होने का संकेत देता है। ‘अच्छी लगी’ आधुनिक हिन्दी में सहज है, जबकि ‘सीधी/सही थी’ इस संदर्भ में अस्वाभाविक या अधिक नैतिक अर्थ दे सकता है।
- source_word: בְּעֵינֵי שִׁמְשׁוֹן
  choice: शिमशोन की दृष्टि में
  rationale: यह चयन ‘शिमशोन की आँखों में’ वाले हिब्रू मुहावरे की मूल्यांकन-संबंधी छवि को सम्मानजनक और स्वाभाविक हिन्दी में बनाए रखता है तथा न्यायियों में बार-बार आने वाले ‘अपनी दृष्टि में सही’ विषय की संभावित प्रतिध्वनि को सुरक्षित रखता है।
theological_decisions:
- issue: न्यायियों की पुस्तक में ‘अपनी दृष्टि में सही’ होने के विषय से संभावित साहित्यिक संबंध
  choice: मुख्य पाठ में ‘शिमशोन की दृष्टि में’ रखा गया
  alternative: ‘शिमशोन को वह अच्छी लगी’
  rationale: हिब्रू मुहावरा केवल पसंद का संकेत दे सकता है, पर पुस्तक के व्यापक साहित्यिक विषय की प्रतिध्वनि भी संभव है। ‘दृष्टि में’ इस संभावना को बनाए रखता है, बिना उसे निश्चित धार्मिक निष्कर्ष बनाए।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘नीचे गया’ भौगोलिक संकेत को और ‘दृष्टि में’ मूल हिब्रू की साहित्यिक छवि को सुरक्षित रखता है।
