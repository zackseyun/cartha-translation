  terminology: “स्त्री” correctly avoids prematurely calling the Timnite woman Samson’s wife. “शिमशोन” is an appropriate standard Hindi form of the name. The footnote accurately states the semantic range of יָשַׁר בְּעֵינֵי and distinguishes idiomatic alternatives without making one interpretively mandatory.
