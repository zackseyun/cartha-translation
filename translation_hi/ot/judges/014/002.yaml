base_translation:
  language: en
  yaml_path: translation/ot/judges/014/002.yaml
  text: Then he went up and told his father and mother[a], and he said, “I saw a woman in Timnah from the daughters of the Philistines. So now, get her for me as a wife.”
translation:
  language: hi
  text: तब वह ऊपर गया और उसने अपने पिता और माता को बताया। उसने कहा, “मैंने तिम्ना में पलिश्तियों की बेटियों में से एक स्त्री[a] देखी है। अब उससे मेरा विवाह करा दो।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या अधिक स्वाभाविक रूप में, “पलिश्ती स्त्रियों में से एक को।”
    reason: ‘पलिश्तियों की बेटियों में से’ मूल इब्रानी की कुल-संबंधी अभिव्यक्ति है; विकल्प आधुनिक हिन्दी में उसका आशय बताता है।
lexical_decisions:
