  choice: तब वह ऊपर गया
  rationale: עלה के चढ़ने अथवा ऊपर जाने के मूल स्थानगत भाव को कथा में बिना अतिरिक्त भौगोलिक व्याख्या के बनाए रखता है।
- source_word: וַיַּגֵּד
  choice: उसने ... बताया
  rationale: हिफ़ईल रूप का सामान्य अर्थ ‘बताना’ या ‘सूचित करना’ है; यहाँ ‘बताया’ स्वाभाविक और प्रसंगानुकूल है।
- source_word: לְאָבִיו וּלְאִמּוֹ
  choice: अपने पिता और माता को
  rationale: दोनों संबंधों को स्पष्ट रखते हुए आधुनिक हिन्दी में स्वाभाविक निजवाचक रूप दिया गया है।
- source_word: אִשָּׁה
  choice: एक स्त्री
  rationale: यहाँ אִשָּׁה का अर्थ ‘स्त्री’ है, क्योंकि विवाह का अनुरोध इसके बाद आता है; पहले ही ‘पत्नी’ कहना घटनाक्रम को समय से पहले निश्चित कर देगा।
- source_word: רָאִיתִי
  choice: मैंने ... देखा है
  rationale: हिब्रू पूर्ण क्रिया को वर्तमान अनुरोध से जुड़े हाल के अनुभव के रूप में स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בְתִמְנָתָה
  choice: तिम्ना में
  rationale: स्थानवाचक प्रयोग के लिए हिन्दी में ‘में’ सहज है; नगर का नाम ‘तिम्ना’ रखा गया है।
- source_word: מִבְּנוֹת פְּלִשְׁתִּים
  choice: पलिश्तियों की बेटियों में से एक स्त्री
  rationale: מִן के अंशवाचक भाव और ‘बेटियों’ की हिब्रू कुल-संबंधी अभिव्यक्ति को बनाए रखता है; अधिक स्वाभाविक विकल्प पाद-टिप्पणी में दिया गया है।
- source_word: וְעַתָּה
  choice: इसलिए अब
  rationale: कथन से अनुरोध की ओर होने वाले संक्रमण और उसके परिणामसूचक बल, दोनों को व्यक्त करता है।
- source_word: קְחוּ אוֹתָהּ לִּי לְאִשָּׁה
  choice: उससे मेरा विवाह करा दो
  rationale: बहुवचन आज्ञा माता-पिता से विवाह की व्यवस्था कराने का अनुरोध है। शब्दशः ‘उसे मेरे लिए पत्नी के रूप में ले लो’ हिन्दी में भ्रामक और अस्वाभाविक होगा; चुना हुआ रूप वैवाहिक मुहावरे का आशय स्पष्ट रखता है।
