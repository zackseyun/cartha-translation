base_translation:
  language: en
  yaml_path: translation/ot/judges/014/016.yaml
  text: Then Samson’s wife wept before him and said[a], “You only hate me; you do not love me. You have posed the riddle to the sons of my people, but you have not told me.” And he said to her, “Look, I have not told my father or my mother, so should I tell you?”
translation:
  language: hi
  text: तब शिमशोन की पत्नी उसके सामने रोई और बोली, “तुम मुझसे केवल घृणा करते हो; मुझसे प्रेम नहीं करते। तुमने मेरे लोगों के पुरुषों को पहेली पूछी है, पर मुझे नहीं बताई।” शिमशोन ने उससे कहा, “देखो, मैंने अपने पिता और अपनी माता को नहीं बताया; तो क्या मैं तुम्हें बताऊँ?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֵּבְךְּ ... עָלָיו
  choice: उसके सामने रोने लगी
  rationale: בכה का अर्थ ‘रोना’ है। व्यक्ति के साथ עַל यहाँ उसके सामने या उसके पास रोकर भावनात्मक दबाव डालने का संकेत देता है; ‘उसके सामने रोने लगी’ स्वाभाविक हिन्दी है और अनावश्यक व्याख्या नहीं जोड़ती।
- source_word: אֵשֶׁת שִׁמְשׁוֹן
  choice: शिमशोन की पत्नी
  rationale: सम्बन्धवाचक संरचना वैवाहिक सम्बन्ध को सीधे व्यक्त करती है; यह आधुनिक हिन्दी में स्वाभाविक है।
- source_word: רַק
  choice: केवल
  rationale: यह आरोप को तीव्र करता है—‘तुम मुझसे केवल घृणा करते हो।’
- source_word: שְׂנֵאתַנִי ... וְלֹא אֲהַבְתָּנִי
  choice: तुम मुझसे केवल घृणा करते हो, मुझसे प्रेम नहीं करते
  rationale: ‘घृणा’ और ‘प्रेम’ का मूल विरोध सीधे बनाए रखा गया है।
- source_word: הַחִידָה חַדְתָּ
  choice: पहेली रखी
  rationale: חִידָה का अर्थ ‘पहेली’ और חוד का यहाँ अर्थ पहेली प्रस्तुत करना है; ‘पहेली रखी’ सहज हिन्दी प्रयोग है।
- source_word: לִבְנֵי עַמִּי
  choice: मेरे लोगों के बेटों के सामने
  rationale: शाब्दिक पुरुषवाचक ‘मेरे लोगों के बेटे’ सुरक्षित रखा गया है। לְ को प्रसंगानुसार ‘के सामने’ किया गया है, क्योंकि पहेली विवाह-समारोह के पुरुष साथियों के समक्ष रखी गई थी।
- source_word: וְלִי לֹא הִגַּדְתָּה
  choice: पर मुझे उसका अर्थ नहीं बताया
  rationale: हिफ़ील נגד का अर्थ बताना या प्रकट करना है। पहेली के प्रसंग में हिन्दी में ‘उसका अर्थ बताना’ आशय को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הִנֵּה
  choice: देखो
  rationale: यह ध्यान आकर्षित करने वाला बलाघात है; ‘देखो’ आधुनिक और गरिमापूर्ण हिन्दी है।
- source_word: לְאָבִי וּלְאִמִּי לֹא הִגַּדְתִּי
  choice: मैंने अपने पिता या अपनी माता को भी नहीं बताया
  rationale: नकार के साथ हिन्दी में ‘या’ स्वाभाविक है; ‘भी’ शिमशोन के तर्क का बल स्पष्ट करता है।
- source_word: וְלָךְ אַגִּיד
  choice: तो क्या तुम्हें बता दूँ?
  rationale: मूल भविष्यत् क्रिया यहाँ आलंकारिक प्रश्न है; यह हिन्दी रूप उसके निहित तर्क को बिना निष्कर्ष थोपे व्यक्त करता है।
