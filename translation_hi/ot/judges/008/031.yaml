  text: और उसकी उपपत्नी, जो शकेम में थी, ने भी उसके एक पुत्र को जन्म दिया, और गिदोन ने उसका नाम अबीमेलेक रखा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּפִילַגְשׁוֹ
  choice: और उसकी उपपत्नी
  rationale: פִילֶגֶשׁ के लिए ‘उपपत्नी’ आधुनिक मानक हिन्दी में सीधा और गरिमापूर्ण शब्द है; यह उसके सामाजिक दर्जे को ‘पत्नी’ या ‘प्रेमिका’ कहकर बदलता नहीं है।
- source_word: אֲשֶׁר בִּשְׁכֶם
  choice: जो शकेम में थी
  rationale: इब्रानी केवल स्थान बताता है; ‘रहती थी’ कहने से ऐसी अतिरिक्त विशिष्टता जुड़ती जो मूल में स्पष्ट नहीं है।
- source_word: יָלְדָה לּוֹ
  choice: उसने भी उसके लिए ... को जन्म दिया
  rationale: יַלד और לּוֹ का संबंध ‘उसके लिए जन्म दिया’ से स्पष्ट होता है और हिन्दी में स्वाभाविक रहता है।
- source_word: גַם הִיא
  choice: उसने भी
  rationale: यह स्त्री भी गिदोन की अन्य स्त्रियों की तरह पुत्रवती हुई; ‘भी’ मूल के बलाघात को सहज रूप से व्यक्त करता है।
- source_word: בֵּן
  choice: एक पुत्र
  rationale: संज्ञा अनिश्चित है; हिन्दी में ‘एक पुत्र’ इसका स्वाभाविक रूप है।
- source_word: וַיָּשֶׂם אֶת־שְׁמוֹ
  choice: और उसने उसका नाम ... रखा
  rationale: शाब्दिक ‘उसका नाम स्थापित किया’ हिन्दी में अस्वाभाविक होगा; ‘नाम रखा’ इब्रानी मुहावरे का सामान्य अर्थ देता है।
- source_word: אֲבִימֶלֶךְ
  choice: अबीमेलेक
  rationale: यह देवनागरी लिप्यंतरण इब्रानी אֲבִימֶלֶךְ की ध्वनि के निकट है और हिन्दी पाठक के लिए सुबोध है।
