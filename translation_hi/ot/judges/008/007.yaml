source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר גִּדְע֔וֹן לָ/כֵ֗ן בְּ/תֵ֧ת יְהוָ֛ה אֶת זֶ֥בַח וְ/אֶת צַלְמֻנָּ֖ע בְּ/יָדִ֑/י וְ/דַשְׁתִּי֙ אֶת בְּשַׂרְ/כֶ֔ם אֶת קוֹצֵ֥י הַ/מִּדְבָּ֖ר וְ/אֶת הַֽ/בַּרְקֳנִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/007.yaml
  text: And Gideon said[a], “Therefore, when Yahweh gives Zebah and Zalmunna into my hand, I will thresh your flesh with the thorns of the wilderness and with briers.”
translation:
  language: hi
  text: इसलिए गिदोन ने कहा, “जब याहवे जेबह और सलमुन्ना को मेरे हाथ में दे देगा, तब मैं निर्जन प्रदेश के काँटों और कँटीली झाड़ियों[a] से तुम्हारी देह को रौंदूँगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “कँटीले पौधों”; इब्रानी शब्द किस ठीक प्रकार की वनस्पति को सूचित करता है, यह निश्चित नहीं है।
    reason: शब्दार्थ-विषयक अनिश्चितता
lexical_decisions:
- source_word: לָכֵן
  choice: इस कारण
  rationale: यह पिछले पद में सुक्कोत के लोगों के इनकार के परिणामस्वरूप दी गई गिदोन की धमकी को स्पष्ट करता है और मूल के निष्कर्षसूचक बल को बनाए रखता है।
- source_word: בְּתֵת
  choice: जब ... कर देगा
  rationale: בְּ के साथ infinitive construct यहाँ स्वाभाविक रूप से भावी काल-सूचक है। हिंदी में ‘जब ... कर देगा’ इसी संबंध को सहज ढंग से व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय परमेश्वर-नाम को उपाधि से बदलने के बजाय नाम के रूप में लिप्यंतरित किया गया है।
- source_word: בְּיָדִי
  choice: मेरे हाथ में
  rationale: यह किसी को अपने अधिकार में दिए जाने का इब्रानी मुहावरा है; शाब्दिक चित्र हिंदी में भी समझ में आता है।
- source_word: וְדַשְׁתִּי
  choice: दाँवूँगा
  rationale: मूल क्रिया का अर्थ अनाज दाँवना है। यह चुनाव दंड की हिंसा के साथ कृषि-रूपक को भी सुरक्षित रखता है।
- source_word: בְּשַׂרְכֶם
  choice: तुम्हारी देह
  rationale: ‘देह’ मूल के ठोस और कठोर आशय को स्वाभाविक, dignified हिंदी में बनाए रखता है।
- source_word: קוֹצֵי הַמִּדְבָּר
  choice: जंगल के काँटों
  rationale: מִדְבָּר के निर्जन वन-प्रदेश संबंधी भाव और काँटेदार वनस्पति की छवि को संक्षेप में सुरक्षित रखता है।
- source_word: הַבַּרְקֳנִים
  choice: कँटीली झाड़ियों
  rationale: शब्द किसी चुभने वाली वनस्पति को दर्शाता है, पर उसकी ठीक प्रजाति अनिश्चित है; यह सामान्य अनुवाद अनावश्यक वनस्पति-विषयक विशिष्टता से बचता है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा
  rationale: पद में परमेश्वर का विशिष्ट चतुरक्षरीय नाम आया है। ‘याहवे’ स्रोत-नाम का व्यापक रूप से स्वीकृत आधुनिक लिप्यंतरण है और उसे किसी उपाधि से नहीं बदलता।
translation_notes:
  register: भाषा आधुनिक, गंभीर और सामान्य पाठक के लिए सुबोध रखी गई है। ‘दाँवूँगा’ अपेक्षाकृत कम प्रचलित कृषि-शब्द है, पर मूल के जानबूझकर प्रयुक्त ‘अनाज दाँवने’ के हिंसक रूपक को सुरक्षित रखने के लिए चुना गया है।
