source:
  edition: WLC
  text: וַ/יָּבֹא֙ אֶל אַנְשֵׁ֣י סֻכּ֔וֹת וַ/יֹּ֕אמֶר הִנֵּ֖ה זֶ֣בַח וְ/צַלְמֻנָּ֑ע אֲשֶׁר֩ חֵרַפְתֶּ֨ם אוֹתִ֜/י לֵ/אמֹ֗ר הֲ֠/כַף זֶ֣בַח וְ/צַלְמֻנָּ֤ע עַתָּה֙ בְּ/יָדֶ֔/ךָ כִּ֥י נִתֵּ֛ן לַ/אֲנָשֶׁ֥י/ךָ הַ/יְּעֵפִ֖ים לָֽחֶם־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/015.yaml
  text: Then he came to the men of Succoth and said[a], “Here are Zebah and Zalmunna, about whom you taunted me, saying, ‘Are Zebah and Zalmunna already in your hand[b], that we should give bread to your weary men?’”
translation:
  language: hi
  text: तब वह सुक्कोत के पुरुषों के पास आया और कहा, “देखो, जेबह और सल्मुन्ना यहाँ हैं, जिनको लेकर तुमने यह कहकर मेरा उपहास किया था[a], ‘क्या जेबह और सल्मुन्ना अब तुम्हारे हाथ में हैं[b], कि हम तुम्हारे थके-माँदे पुरुषों को रोटी दें?’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरा अपमान किया था” या “मेरा तिरस्कार किया था।” हिब्रू क्रिया में तिरस्कारपूर्ण निंदा या उपहास का भाव है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “क्या जेबह और सल्मुन्ना की हथेली अब तुम्हारे हाथ में है...?” यह एक मुहावरा है, जिसका अर्थ है, “क्या तुमने उन्हें पकड़ लिया है?”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַנְשֵׁי סֻכּוֹת
  choice: सुक्कोत के पुरुषों
  rationale: ‘पुरुषों’ मूल के लिंग-सूचक और सामाजिक बल को बनाए रखता है; प्रसंग नगर के उन पुरुषों से है जिन्होंने गिदोन को उत्तर दिया था।
- source_word: הִנֵּה
  choice: देखो, ... यहाँ हैं
  rationale: यह संकेतवाचक अव्यय सामने उपस्थित बंदियों की ओर ध्यान खींचता है; यह रूप आधुनिक हिन्दी में स्वाभाविक है।
- source_word: זֶבַח וְצַלְמֻנָּע
  choice: जेबह और सल्मुन्ना
  rationale: व्यक्तिनामों का ध्वन्यात्मक लिप्यंतरण किया गया है।
- source_word: אֲשֶׁר חֵרַפְתֶּם אוֹתִי
  choice: जिनके विषय में तुमने ... मेरा अपमान किया था
  rationale: חרף में तिरस्कारपूर्ण निंदा या उपहास का भाव है। ‘अपमान किया’ सामान्य आधुनिक हिन्दी में इस बल को स्पष्ट रखता है, जबकि ‘जिनके विषय में’ अपमान का इन राजाओं से संबंध दिखाता है।
- source_word: הֲכַף ... בְּיָדֶךָ
  choice: क्या ... अब तुम्हारे हाथ में हैं
  rationale: हिब्रू की ‘हाथ में’ वाली छवि बनाए रखते हुए यह स्पष्ट करता है कि प्रश्न उनके पकड़े जाकर गिदोन के वश में होने के विषय में था।
- source_word: כִּי נִתֵּן
  choice: कि हम ... दें
  rationale: यह आलंकारिक प्रश्न में निहित परिणाम को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לַאֲנָשֶׁיךָ הַיְּעֵפִים
  choice: तुम्हारे थके-माँदे पुरुषों को
  rationale: यְעֵפִים पीछा करते-करते हुई गहरी थकान बताता है; ‘थके-माँदे’ सहज और सजीव हिन्दी है।
- source_word: לָחֶם
  choice: रोटी
  rationale: प्रत्यक्ष अर्थ को बनाए रखता है, यद्यपि प्रसंग में यह सामान्य भोजन का भी द्योतक हो सकता है।
