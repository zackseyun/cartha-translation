translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। प्रत्यक्ष कथन में सुक्कोत के पुरुषों की तिरस्कारपूर्ण चुनौती बनी रहती है। ‘हाथ में’ की मूल हिब्रू छवि मुख्य पाठ में सुरक्षित है और उसका मुहावरेदार अर्थ पाद-टिप्पणी में दिया गया है।
