source:
  edition: WLC
  text: בְּ/יֶדְ/כֶם֩ נָתַ֨ן אֱלֹהִ֜ים אֶת שָׂרֵ֤י מִדְיָן֙ אֶת עֹרֵ֣ב וְ/אֶת זְאֵ֔ב וּ/מַה יָּכֹ֖לְתִּי עֲשׂ֣וֹת כָּ/כֶ֑ם אָ֗ז רָפְתָ֤ה רוּחָ/ם֙ מֵֽ/עָלָ֔י/ו בְּ/דַבְּר֖/וֹ הַ/דָּבָ֥ר הַ/זֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/003.yaml
  text: Into your hand God gave the princes of Midian[a], Oreb and Zeeb; and what was I able to do compared with you? Then their spirit relaxed toward him when he spoke this word.
translation:
  language: hi
  text: परमेश्वर ने मिद्यान के हाकिमों, ओरेब और ज़ेब, को तुम्हारे हाथ में कर दिया। मैंने तुम्हारी तुलना में ऐसा क्या किया है? जब उसने यह बात कही, तब उसके विरुद्ध उनका क्रोध शांत हो गया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּיֶדְכֶם נָתַן אֱלֹהִים
  choice: परमेश्वर ने ... तुम्हारे हाथ में कर दिया
  rationale: ‘हाथ में देना’ अधिकार या वश में कर देने का स्वाभाविक हिन्दी मुहावरा है और इब्रानी बिंब को भी बनाए रखता है।
- source_word: שָׂרֵי מִדְיָן
  choice: मिद्यान के हाकिमों
  rationale: שָׂרֵי यहाँ उच्च पदस्थ अगुओं या शासकों को दर्शाता है। ‘हाकिम’ आधुनिक पाठक के लिए सहज है और उनकी पदवी को बनाए रखता है।
- source_word: עֹרֵב וְאֶת זְאֵב
  choice: ओरेब और ज़ेब
  rationale: व्यक्तिवाचक नामों का प्रचलित हिन्दी लिप्यंतरण।
- source_word: וּמַה יָּכֹלְתִּי עֲשׂוֹת כָּכֶם
  choice: मैंने तुम्हारी तुलना में ऐसा क्या किया है?
  rationale: प्रश्न गिदोन की विनम्र, शांत कराने वाली तुलना व्यक्त करता है; हिन्दी में यह रूप प्रसंगगत आशय को स्वाभाविक ढंग से संप्रेषित करता है।
- source_word: רָפְתָה רוּחָם מֵעָלָיו
  choice: उसके विरुद्ध उनका क्रोध शांत हो गया
  rationale: शाब्दिक रूप से ‘उनकी आत्मा/मन उसके ऊपर से ढीली पड़ गई’; प्रसंग में यह विरोधपूर्ण क्रोध के शांत होने का इब्रानी मुहावरा है। हिन्दी में अर्थ-केंद्रित रूप अधिक स्पष्ट और स्वाभाविक है।
- source_word: בְּדַבְּרוֹ הַדָּבָר הַזֶּה
  choice: जब उसने यह बात कही
  rationale: पूर्वसर्ग सहित infinitive construct घटना का समय बताता है; ‘यह बात कही’ דָבָר का स्वाभाविक हिन्दी प्रतिरूप है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी में स्वाभाविक, गरिमापूर्ण कथात्मक शैली। इब्रानी के ‘हाथ में देना’ मुहावरे को रखा गया है, जबकि अंतिम भावात्मक मुहावरे को अर्थ-स्पष्ट हिन्दी में प्रस्तुत किया गया है।
