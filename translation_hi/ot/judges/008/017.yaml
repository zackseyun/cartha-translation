lexical_decisions:
- source_word: מִגְדַּל
  choice: मीनार
  rationale: यह संज्ञा किसी ऊँची, प्रायः किलाबंद संरचना को दर्शाती है। संदर्भ में ‘मीनार’ सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: פְּנוּאֵל
  choice: पनूएल
  rationale: यहाँ के व्यंजनात्मक इब्रानी रूप के निकट मानक देवनागरी लिप्यंतरण ‘पनूएल’ रखा गया है; पारंपरिक वैकल्पिक रूप पनीएल को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: נָתָץ
  choice: ढा दी
  rationale: क्रिया किसी संरचना को गिरा देने या ध्वस्त करने का अर्थ देती है। ‘ढा दी’ आधुनिक हिन्दी में स्वाभाविक है और क्रिया का बल बनाए रखती है।
- source_word: וַיַּהֲרֹג
  choice: मार डाला
  rationale: הרג का सीधा अर्थ हत्या करना या जान से मारना है। ‘मार डाला’ स्पष्ट, वर्तमान और प्रसंगानुकूल है।
- source_word: אַנְשֵׁי הָעִיר
  choice: नगर के पुरुषों
  rationale: यह पदबंध शाब्दिक रूप से ‘नगर के पुरुष’ है। दंडात्मक सैन्य संदर्भ में पुल्लिंग अर्थ को सामान्य ‘लोगों’ से प्रतिस्थापित नहीं किया गया।
