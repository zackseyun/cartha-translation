translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। जोरदार इब्रानी रचना को ‘अवश्य’ से व्यक्त किया गया है। मुख्य पाठ में ‘बाली’ प्रसंगानुकूल है, पर मूल शब्द की कान/नाक संबंधी अस्पष्टता पादटिप्पणी में सुरक्षित है।
