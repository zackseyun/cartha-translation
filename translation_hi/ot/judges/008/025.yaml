  text: וַ/יֹּאמְר֖וּ נָת֣וֹן נִתֵּ֑ן וַֽ/יִּפְרְשׂוּ֙ אֶת הַ/שִּׂמְלָ֔ה וַ/יַּשְׁלִ֣יכוּ שָׁ֔מָּ/ה אִ֖ישׁ נֶ֥זֶם שְׁלָלֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/025.yaml
  text: And they said[a], “We will surely give them.” Then they spread out the cloak[c][b], and each man threw there an earring from his spoil.
translation:
  language: hi
  text: उन्होंने कहा[a], “हम अवश्य देंगे।” तब उन्होंने वह वस्त्र[b] फैला दिया, और हर एक ने अपनी लूट में से एक बाली[c] वहाँ फेंक दी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में एक ही क्रिया के विशेष व्याकरणिक रूप से दोहराव द्वारा कथन पर जोर दिया गया है; इसका अनुवाद “हम निश्चय ही देंगे” भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: 'इब्रानी: “वह वस्त्र”; यह संभवतः एक बाहरी वस्त्र या ओढ़ने का कपड़ा था, जिसे आभूषण इकट्ठा करने के लिए फैलाया गया।'
    reason: cultural_note
  - marker: c
    text: इब्रानी शब्द का व्यापक अर्थ “छल्ला” है; कुछ प्रसंगों में यह नथ या नाक में पहना जाने वाला छल्ला भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: נָתוֹן נִתֵּן
  choice: हम अवश्य देंगे
  rationale: क्रिया के साथ प्रयुक्त infinitive absolute कथन पर बल देता है। ‘अवश्य’ इस जोर को स्वाभाविक हिन्दी में व्यक्त करता है, बिना मूल में स्पष्ट रूप से निहित न होने वाली प्रसन्नता या उत्सुकता जोड़े।
- source_word: הַשִּׂמְלָה
  choice: वह चादर
  rationale: यह शब्द वस्त्र, ओढ़ने के बाहरी कपड़े या चादर-जैसे आवरण को दर्शा सकता है। यहाँ वस्तुओं को इकट्ठा करने के लिए फैलाए जाने के कारण ‘चादर’ सहज और ठोस चित्र प्रस्तुत करता है; निश्चित उपपद को ‘वह’ से व्यक्त किया गया है।
- source_word: וַיִּפְרְשׂוּ
  choice: फैला दी
  rationale: פרשׂ का अर्थ फैलाना या खोलकर बिछाना है। चादर के प्रसंग में ‘फैला दी’ स्वाभाविक हिन्दी है।
- source_word: וַיַּשְׁלִיכוּ שָׁמָּה
  choice: वहाँ फेंक दी
  rationale: שלך साधारणतः ‘रखना’ नहीं, बल्कि ‘फेंकना/डालना’ है, और שָׁמָּה का अर्थ ‘वहाँ’ है। अनुवाद मूल की क्रिया और स्थान-सूचक शब्द दोनों को बनाए रखता है।
- source_word: אִישׁ
  choice: हर एक
  rationale: यहाँ אִישׁ वितरणात्मक अर्थ में है—समूह के प्रत्येक व्यक्ति ने ऐसा किया। ‘हर एक’ आधुनिक हिन्दी में स्वाभाविक है और अनावश्यक रूप से ‘पुरुष’ जोड़ने से बचता है।
- source_word: נֶזֶם
  choice: बाली
  rationale: נֶזֶם कान या नाक में पहना जाने वाला छल्ला हो सकता है। पिछले पद में माँगे गए मिद्यानी आभूषणों के प्रसंग में ‘बाली’ सम्भावित अर्थ है, जबकि व्यापक विकल्प पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: שְׁלָלוֹ
  choice: अपनी लूट में से
  rationale: שָׁלָל युद्ध में प्राप्त लूट को दर्शाता है। एकवचन प्रत्यय और वितरणात्मक אִישׁ को हिन्दी में ‘अपनी ... में से’ स्वाभाविक रूप से व्यक्त करता है।
