  yaml_path: translation/ot/judges/008/023.yaml
  text: But Gideon said to them[a], “I will not rule over you, and my son will not rule over you; Yahweh will rule over you.”
translation:
  language: hi
  text: परन्तु गिदोन ने उनसे कहा[a], “मैं तुम पर शासन नहीं करूँगा, और न मेरा पुत्र तुम पर शासन करेगा; यहोवा तुम पर शासन करेगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और गिदोन ने उनसे कहा।” इब्रानी संयोजक को सामान्य कथात्मक अर्थ में “और” भी अनूदित किया जा सकता है; यहाँ “परन्तु” पिछले पद में लोगों के अनुरोध के साथ विरोध को स्पष्ट करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: परन्तु ... ने कहा
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है; पिछले पद में लोगों के अनुरोध को गिदोन द्वारा अस्वीकार किए जाने के कारण प्रसंग में विरोधसूचक ‘परन्तु’ स्वाभाविक है।
- source_word: אֲלֵהֶם
  choice: उनसे
  rationale: दिशासूचक संबंधबोधक उपसर्ग और बहुवचन सर्वनाम का स्वाभाविक हिन्दी रूप।
- source_word: גִּדְעוֹן
  choice: गिदोन
  rationale: व्यक्तिनाम का हिन्दी बाइबलीय परंपरा में प्रचलित लिप्यंतरण।
- source_word: לֹא אֶמְשֹׁל אֲנִי בָּכֶם
  choice: मैं तुम पर शासन नहीं करूँगा
  rationale: מָשַׁל राजनीतिक अधिकार सहित शासन करने को व्यक्त करता है। स्पष्ट אֲנִי को ‘मैं’ से रखा गया है, पर अनावश्यक ‘मैं स्वयं’ नहीं जोड़ा गया।
- source_word: וְלֹא יִמְשֹׁל בְּנִי בָּכֶם
  choice: और न मेरा पुत्र तुम पर शासन करेगा
  rationale: यह पिछले निषेध के समानांतर है और वंशगत उत्तराधिकार तक इनकार को बढ़ाता है; ‘और न’ आधुनिक हिन्दी में स्पष्ट तथा स्वाभाविक है।
- source_word: בְּנִי
  choice: मेरा पुत्र
  rationale: एकवचन संज्ञा और प्रथम पुरुष एकवचन प्रत्यय को सीधे रखा गया है; निहित वंशगत आशय को ‘वंशज’ कहकर विस्तृत नहीं किया गया।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चतुरक्षरीय व्यक्तिगत दिव्य नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित नामरूप से प्रस्तुत किया गया है।
- source_word: יְהוָה יִמְשֹׁל בָּכֶם
  choice: यहोवा ही तुम पर शासन करेगा
  rationale: מָשַׁל की पुनरावृत्ति को ‘शासन करेगा’ से बनाए रखा गया है। ‘ही’ गिदोन और उसके पुत्र के निषेध के बाद यहोवा के शासन पर मूल वाक्य के प्रबल विरोधात्मक बल को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: गिदोन द्वारा शासन-संबंधी प्रस्ताव का अस्वीकार
  choice: गिदोन अपने और अपने पुत्र के शासन से इनकार करता है और शासन यहोवा का बताता है।
  alternative: गिदोन केवल राजा की औपचारिक उपाधि ठुकराता है, जबकि व्यवहार में शासक बना रहता है।
  rationale: इब्रानी पाठ गिदोन, उसके पुत्र और यहोवा—तीनों के लिए מָשַׁל का ही प्रयोग करता है और ‘राजा’ के लिए अलग शब्द नहीं लाता। इसलिए अनुवाद मानवीय और दिव्य शासन का विरोध बनाए रखता है, पर औपचारिक राजपद के बारे में पाठ से अधिक नहीं कहता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज शैली। ‘शासन करना’ को तीनों स्थानों पर दोहराकर मूल का मुख्य शब्द और उसका अलंकारिक विरोध सुरक्षित रखा गया है। दिव्य नाम के लिए ‘यहोवा’ रखा गया है।
