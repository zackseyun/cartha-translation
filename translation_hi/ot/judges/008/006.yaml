id: JDG.8.6
reference: Judges 8:6
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ שָׂרֵ֣י סֻכּ֔וֹת הֲ֠/כַף זֶ֧בַח וְ/צַלְמֻנָּ֛ע עַתָּ֖ה בְּ/יָדֶ֑/ךָ כִּֽי נִתֵּ֥ן לִֽ/צְבָאֲ/ךָ֖ לָֽחֶם־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/006.yaml
  text: Then the leaders of Succoth said, “Are the hands of Zebah and Zalmunna already in your hand, that we should give bread to your army?”
translation:
  language: hi
  text: तब सुक्कोत के प्रधानों ने कहा, “क्या जेबह और सल्मुन्ना पहले ही तुम्हारे हाथ में आ चुके हैं, कि हम तुम्हारी सेना को रोटी दें?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׂרֵי סֻכּוֹת
  choice: सुक्कोत के प्रधानों
  rationale: שָׂרֵי नगर के शासकीय अगुओं को दर्शाता है; ‘प्रधानों’ आधुनिक और गरिमापूर्ण है।
- source_word: הֲכַף זֶבַח וְצַלְמֻנָּע ... בְּיָדֶךָ
  choice: क्या जेबह और सल्मुन्ना ... तुम्हारे हाथ में आ चुके हैं
  rationale: मूल में ‘हथेली/हाथ ... तुम्हारे हाथ में’ सामर्थ्य में आ जाने या पकड़ लिए जाने का मुहावरा है। हिन्दी का ‘हाथ में आना’ उसी व्यंग्यपूर्ण प्रश्न को स्वाभाविक रूप से व्यक्त करता है।
- source_word: עַתָּה
  choice: पहले ही
  rationale: सन्दर्भ में प्रधान यह ताना देते हैं कि विजय या गिरफ्तारी अभी हुई ही नहीं; ‘पहले ही’ प्रश्न की इसी अपेक्षा को स्पष्ट करता है।
- source_word: צְבָאֲךָ
  choice: तुम्हारी सेना
  rationale: צָבָא यहाँ गिदोन के साथ आए युद्धरत पुरुषों के दल को सूचित करता है; ‘सेना’ सीधा और सामान्य हिन्दी रूप है।
- source_word: לֶחֶם
  choice: रोटी
  rationale: לֶחֶם का मूल अर्थ रोटी है और यहाँ सैनिकों के लिए भोजन/रसद के प्रतिनिधि रूप में प्रयुक्त है; ‘रोटी’ स्रोत की ठोस छवि बनाए रखती है।
theological_decisions:
- issue: प्रधानों के प्रश्न में निहित अविश्वास और उपहास
  choice: प्रश्न को सीधे व्यंग्यपूर्ण रूप में रखा गया है
  alternative: इसे स्पष्ट कथन बनाना कि गिदोन ने शत्रुओं को अभी बंदी नहीं बनाया था
  rationale: मूल पाठ अलंकारिक प्रश्न के द्वारा उनका अविश्वास दिखाता है; उसे व्याख्यात्मक कथन में बदलना कथात्मक तनाव को घटा देता।
translation_notes:
  register: आधुनिक मानक हिन्दी, सामान्य पाठक के लिए सहज किंतु गरिमापूर्ण। संवाद में एकवचन ‘तुम्हारे’ रखा गया है। मूल के हाथ-संबंधी मुहावरे को हिन्दी के स्वाभाविक ‘हाथ में आना’ द्वारा व्यक्त किया गया है।
