  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יִּכָּנַ֣ע מִדְיָ֗ן לִ/פְנֵי֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/לֹ֥א יָסְפ֖וּ לָ/שֵׂ֣את רֹאשָׁ֑/ם וַ/תִּשְׁקֹ֥ט הָ/אָ֛רֶץ אַרְבָּעִ֥ים שָׁנָ֖ה בִּ/ימֵ֥י גִדְעֽוֹן׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/028.yaml
  text: So Midian was subdued before the sons of Israel[a], and they did not again lift up their head. And the land had rest forty years in the days of Gideon.
translation:
  language: hi
  text: इस प्रकार मिद्यान इस्राएलियों के अधीन हो गया, और मिद्यानियों ने फिर सिर नहीं उठाया[a]। गिदोन के दिनों में देश को चालीस वर्ष तक चैन मिला।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात वे फिर शक्ति या साहस जुटाकर अपना प्रभुत्व स्थापित नहीं कर सके। शाब्दिक रूप से, “उन्होंने फिर अपना सिर नहीं उठाया।”
    reason: मूल इब्रानी मुहावरे की संभावित अर्थ-छाया स्पष्ट करना।
lexical_decisions:
- source_word: וַיִּכָּנַע
  choice: अधीन हो गया
  rationale: निफ़अल रूप यहाँ मिद्यान के दबाए जाकर वश में आने को व्यक्त करता है। यह चयन युद्ध-संदर्भ में स्वाभाविक हिन्दी है और मूल के निष्क्रिय भाव को बनाए रखता है।
- source_word: לִפְנֵי בְּנֵי יִשְׂרָאֵל
  choice: इस्राएलियों के अधीन
  rationale: शाब्दिक ‘इस्राएल के पुत्रों के सामने’ आधुनिक हिन्दी में असहज और आशय में अस्पष्ट होता। संदर्भ में यह पदबंध इस्राएल के लोगों के सामने मिद्यान के वश में किए जाने का संबंध बताता है।
- source_word: וְלֹא יָסְפוּ
  choice: फिर ... नहीं
  rationale: יסף के साथ क्रिया का अर्थ यहाँ उस काम को दोबारा न करना है; ‘फिर ... नहीं’ इसे संक्षेप और स्वाभाविक रूप से व्यक्त करता है।
- source_word: לָשֵׂאת רֹאשָׁם
  choice: सिर नहीं उठाया
  rationale: मूल का सजीव मुहावरा बनाए रखा गया है। यह पुनः शक्ति या साहस न जुटा पाने का संकेत देता है, पर मुख्य पाठ उस अर्थ को एक ही व्याख्या में सीमित नहीं करता।
- source_word: וַתִּשְׁקֹט הָאָרֶץ
  choice: देश को ... चैन मिला
  rationale: न्यायियों में यह क्रिया युद्ध से राहत और शांति की अवधि बताती है। ‘चैन मिला’ आधुनिक हिन्दी में सहज है और केवल मौन हो जाने की अपेक्षा प्रसंग को ठीक व्यक्त करता है।
- source_word: אַרְבָּעִים שָׁנָה
  choice: चालीस वर्ष तक
  rationale: मूल संख्या और उस अवधि के फैलाव को सीधे व्यक्त किया गया है।
- source_word: בִּימֵי גִדְעוֹן
  choice: गिदोन के दिनों में
  rationale: मानक इब्रानी काल-सूचक अभिव्यक्ति का निकट और स्वाभाविक रूप; यह अवधि को अनावश्यक रूप से केवल गिदोन के जीवनकाल के रूप में निश्चित नहीं करता।
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל का राष्ट्रीय पदनाम
  choice: इस्राएली
  alternative: इस्राएल के पुत्र
  rationale: यह एक रूढ़ राष्ट्रीय पदनाम है। ‘इस्राएली’ आधुनिक हिन्दी में पूरे समुदाय को स्पष्ट और स्वाभाविक रूप से दर्शाता है; ‘इस्राएल के पुत्र’ यहाँ अनावश्यक रूप से जैविक पुत्रों का आभास दे सकता है।
- issue: לָשֵׂאת רֹאשָׁם के मुहावरे का संरक्षण
  choice: सिर उठाना
  alternative: फिर शक्ति जुटाना
  rationale: मुख्य पाठ में मूल रूपक सुरक्षित रखा गया है, ताकि नए साहस, सामर्थ्य या प्रभुत्व की उसकी व्यापक अर्थ-छाया किसी एक व्याख्या में सीमित न हो।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘मिद्यानियों’ का प्रयोग बहुवचन क्रिया के कर्ता को हिन्दी में स्पष्ट करता है, जबकि पहले वाक्यांश में सामूहिक राष्ट्र ‘मिद्यान’ बना रहता है।
