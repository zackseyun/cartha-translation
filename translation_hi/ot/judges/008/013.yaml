base_translation:
  language: en
  yaml_path: translation/ot/judges/008/013.yaml
  text: Then Gideon son of Joash returned from the battle by the ascent of Heres[a].
translation:
  language: hi
  text: तब योआश का पुत्र गिदोन युद्ध से हेरेस की चढ़ाई के मार्ग से लौटा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या संभवतः, “सूर्य की चढ़ाई से।” इब्रानी वाक्यांश कठिन है; הֶחָרֶס को स्थाननाम “हेरेस” या “सूर्य” समझा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: तब ... लौटा
  rationale: यह कथानक को आगे बढ़ाने वाला क्रियारूप है; ‘तब’ क्रम को और ‘लौटा’ שוב के सामान्य अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: גִּדְעוֹן בֶּן יוֹאָשׁ
  choice: योआश का पुत्र गिदोन
  rationale: व्यक्तिनामों को मानक हिन्दी बाइबलीय रूप में रखा गया है और इब्रानी पितृनाम-संबंध को सीधे व्यक्त किया गया है।
- source_word: מִן הַמִּלְחָמָה
  choice: युद्ध से
  rationale: यहाँ מִלְחָמָה तत्कालीन सैनिक मुठभेड़ को सूचित करता है; हिन्दी में ‘युद्ध’ सहज और प्रसंगानुकूल है।
- source_word: מִלְמַעֲלֵה
  choice: चढ़ाई के मार्ग से
  rationale: מַעֲלֶה किसी चढ़ाई, घाट या ऊपर जाने वाले मार्ग को सूचित कर सकता है। यह रूप मार्ग-संबंधी अर्थ को स्पष्ट करता है, पर अत्यधिक विशिष्ट भूगोल नहीं थोपता।
- source_word: הֶחָרֶס
  choice: हेरेस
  rationale: मुख्य पाठ में इसे संभावित स्थाननाम के रूप में लिप्यंतरित किया गया है; ‘सूर्य’ की शाब्दिक संभावना पाद-टिप्पणी में सुरक्षित रखी गई है।
