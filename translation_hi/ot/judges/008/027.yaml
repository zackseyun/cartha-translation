base_translation:
  language: en
  yaml_path: translation/ot/judges/008/027.yaml
  text: Gideon made it into an ephod and set it up in his city[a], in Ophrah. And all Israel prostituted themselves after it there[b], and it became a snare to Gideon and to his house.
translation:
  language: hi
  text: गिदोन ने उससे एक एपोद[a] बनाया और उसे अपने नगर ओप्रा में स्थापित किया। वहाँ सारे इस्राएल ने उसके पीछे वेश्यावृत्ति की[b], और वह गिदोन और उसके घराने के लिए फंदा बन गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘एपोद’ याजकीय या उपासना-संबंधी संदर्भों से जुड़ी वस्तु थी; यहाँ पाठ उसके ठीक स्वरूप या कार्य को स्पष्ट नहीं करता।
    reason: cultural_note
  - marker: b
    text: हिब्रू में शाब्दिक रूप से वेश्यावृत्ति की उपमा है; यह उपासना में इस्राएल की बेवफाई को दर्शाती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לְאֵפוֹד
  choice: एक एपोद बनाया
  rationale: עשה के साथ ל यहाँ परिणाम का बोध कराता है—वस्तु को एपोद बनाया गया। אֵפוֹד को लिप्यंतरित रखा गया है, क्योंकि इस प्रसंग में उसका ठीक स्वरूप या कार्य स्पष्ट नहीं किया गया।
- source_word: וַיַּצֵּג
  choice: स्थापित किया
  rationale: हिफ़ील रूप किसी वस्तु को खड़ा करने या नियत स्थान पर रखने का भाव देता है। ‘स्थापित किया’ सार्वजनिक अथवा उपासना-संबंधी रखे जाने की संभावना को व्यक्त करता है, पर उसे मूर्ति घोषित नहीं करता।
- source_word: בְעִירוֹ בְּעָפְרָה
  choice: अपने नगर ओप्रा में
  rationale: עִיר का सामान्य अर्थ ‘नगर’ है और עָפְרָה स्थान-नाम ‘ओप्रा’ के रूप में लिप्यंतरित किया गया है।
- source_word: וַיִּזְנוּ ... אַחֲרָיו
  choice: उसके पीछे लगकर वेश्या जैसा आचरण करने लगा
  rationale: זנה की प्रबल यौन-अविश्वास की उपमा को सुरक्षित रखा गया है। एकवचन सामूहिक कर्ता ‘समस्त इस्राएल’ के साथ स्वाभाविक हिन्दी क्रिया-रूप रखा गया; ‘उसके’ का संकेत एपोद की ओर है।
- source_word: שָׁם
  choice: वहाँ
  rationale: यह शब्द धर्मत्याग को विशेष रूप से ओप्रा में घटित बताता है, इसलिए इसे स्पष्ट रूप से रखा गया है।
- source_word: לְמוֹקֵשׁ
  choice: फंदा
  rationale: מוֹקֵשׁ शाब्दिक रूप से पकड़ने वाले फंदे या जाल को और रूपक रूप से पाप अथवा विनाश में फँसाने वाली वस्तु को दर्शाता है।
- source_word: וּלְבֵיתוֹ
  choice: उसके घराने के लिए
  rationale: בַּיִת यहाँ भवन से अधिक गिदोन के परिवार अथवा वंश को सूचित करता है; ‘घराना’ इस व्यापक आशय को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: एपोद के प्रति इस्राएल की मूर्तिपूजक प्रतिक्रिया में प्रयुक्त यौन-अविश्वास की उपमा
  choice: ‘उसके पीछे लगकर वेश्या जैसा आचरण करने लगा’ कहकर उपमा को स्पष्ट रूप से बनाए रखना
  alternative: ‘उसके प्रति विश्वासघाती हो गया’ या ‘उसके पीछे भटक गया’
  rationale: हिब्रू זנה वाचा और उपासना में अविश्वास के लिए जानबूझकर प्रबल यौन-उपमा का प्रयोग करता है। इसे सामान्य ‘भटकने’ तक नरम करना मूल पाठ का धार्मिक और नैतिक भार घटा देता।
- issue: गिदोन के एपोद का स्वरूप
  choice: אֵפוֹד को ‘एपोद’ के रूप में रखना और उसके स्वरूप को अनिर्णीत छोड़ना
  alternative: ‘याजकीय वस्त्र’, ‘मूर्ति’ या ‘पवित्र प्रतिमा’
  rationale: पाठ वस्तु का नाम तो बताता है, पर यहाँ यह निश्चित नहीं करता कि वह पहनावा, प्रतिमा या भविष्य-कथन से जुड़ी कोई उपासना-वस्तु थी। अनुवाद इस वास्तविक अस्पष्टता को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘एपोद’ और ‘फंदा’ जैसे बाइबलीय शब्द मूल की सांस्कृतिक अस्पष्टता और रूपक को बचाते हैं; फुटनोट कठिन सांस्कृतिक तथा रूपक-संबंधी अर्थ स्पष्ट करते हैं।
