  text: וַ/יִּלְכָּד נַ֛עַר מֵ/אַנְשֵׁ֥י סֻכּ֖וֹת וַ/יִּשְׁאָלֵ֑/הוּ וַ/יִּכְתֹּ֨ב אֵלָ֜י/ו אֶת שָׂרֵ֤י סֻכּוֹת֙ וְ/אֶת זְקֵנֶ֔י/הָ שִׁבְעִ֥ים וְ/שִׁבְעָ֖ה אִֽישׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/014.yaml
  text: And he captured a young man from the men of Succoth and questioned him[a], and he wrote down for him the officials of Succoth and its elders, seventy-seven men.
translation:
  language: hi
  text: उसने सुक्कोत के लोगों में से एक युवक को पकड़ लिया और उससे पूछा। उस युवक ने उसके लिए सुक्कोत के अधिकारियों[a] और पुरनियों को लिख दिया, जो कुल सतहत्तर पुरुष थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “प्रधानों”; इब्रानी शब्द अधिकारियों, प्रधानों या शासकों को दर्शा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלְכָּד
  choice: पकड़कर
  rationale: לכד का सामान्य अर्थ पकड़ना या बंदी बनाना है; यहाँ ‘पकड़कर’ घटना को स्वाभाविक ढंग से व्यक्त करता है और गिरफ्तारी की रीति के विषय में कुछ नहीं जोड़ता।
- source_word: נַעַר
  choice: एक जवान
  rationale: נַעַר लड़के, युवक, जवान या सेवक को सूचित कर सकता है। यहाँ वह नगर के नेतृत्व की जानकारी लिखने में सक्षम है, इसलिए ‘जवान’ उपयुक्त और अनावश्यक रूप से बाल्यावस्था या सेवकत्व का संकेत न देने वाला विकल्प है।
- source_word: מֵאַנְשֵׁי סֻכּוֹת
  choice: सुक्कोत के लोगों में से
  rationale: מן समूह में से चयन या स्रोत दर्शाता है; यह हिंदी प्रयोग उस जवान के सुक्कोत समुदाय से होने का भाव स्पष्ट रखता है।
- source_word: וַיִּשְׁאָלֵהוּ
  choice: उससे पूछताछ की
  rationale: שׁאל का अर्थ पूछना या जानकारी लेना है। सैन्य प्रसंग में ‘पूछताछ की’ उद्देश्यपूर्ण प्रश्न करने का भाव देता है, पर यातना या कठोर औपचारिक जाँच का दावा नहीं करता।
- source_word: וַיִּכְתֹּב אֵלָיו
  choice: उस जवान ने उसके लिए ... नाम लिख दिए
  rationale: इब्रानी क्रिया का निकटतम व्यक्त कर्ता पकड़ा गया जवान है; אֵלָיו का अर्थ ‘उसके लिए’ है। हिंदी में कर्ता दोहराने से अस्पष्टता दूर होती है। ‘नाम’ मूल में प्रत्यक्ष नहीं है, पर अधिकारियों और पुरनियों को लिखने का स्वाभाविक आशय उनकी सूची या नाम लिखना है।
- source_word: שָׂרֵי סֻכּוֹת
  choice: सुक्कोत के अधिकारियों
  rationale: שׂרים शासकों, प्रधानों या पदाधिकारियों को दर्शा सकता है। नागरिक संदर्भ में ‘अधिकारी’ स्वाभाविक है और आधुनिक ‘राजकुमार’ का भ्रामक वंशगत अर्थ नहीं लाता।
- source_word: זְקֵנֶיהָ
  choice: उसके पुरनियों
  rationale: स्त्रीलिंग प्रत्यय नगर सुक्कोत की ओर संकेत करता है। ‘पुरनिये’ समुदाय के मान्य वरिष्ठ अगुओं के लिए प्रतिष्ठित बाइबलीय हिंदी शब्द है।
- source_word: שִׁבְעִים וְשִׁבְעָה אִישׁ
  choice: कुल सतहत्तर पुरुष
  rationale: संख्या सीधे सतहत्तर है और איש स्पष्ट रूप से पुरुषों का उल्लेख करता है। ‘कुल’ बताता है कि संख्या अधिकारियों और पुरनियों की संयुक्त सूची की है।
