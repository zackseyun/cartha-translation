source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ לְ/אַנְשֵׁ֣י סֻכּ֔וֹת תְּנוּ נָא֙ כִּכְּר֣וֹת לֶ֔חֶם לָ/עָ֖ם אֲשֶׁ֣ר בְּ/רַגְלָ֑/י כִּי עֲיֵפִ֣ים הֵ֔ם וְ/אָנֹכִ֗י רֹדֵ֛ף אַחֲרֵ֛י זֶ֥בַח וְ/צַלְמֻנָּ֖ע מַלְכֵ֥י מִדְיָֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/005.yaml
  text: And he said to the men of Succoth[a], “Please give loaves of bread to the people who are with me, for they are weary, and I am pursuing Zebah and Zalmunna, the kings of Midian.”
translation:
  language: hi
  text: फिर उसने सुक्कोत के पुरुषों से कहा, “कृपया मेरे साथ चल रहे लोगों[a] को रोटियाँ दे दो, क्योंकि वे थके हुए हैं और मैं मिद्यान के राजाओं, जेबह और सलमुन्ना, का पीछा कर रहा हूँ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ, “जो मेरे पैरों पर हैं”; यह उसके साथ चलने या उसका अनुसरण करने वालों के लिए प्रयुक्त मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לְאַנְשֵׁי סֻכּוֹת
  choice: सुक्कोत के पुरुषों से
  rationale: אַנְשֵׁי का पुरुषवाचक बहुवचन रूप रखा गया है; प्रसंग में नगर के पुरुषों अथवा पुरुष प्रतिनिधियों की ओर संकेत है।
- source_word: תְּנוּ נָא
  choice: कृपया ... दे दो
  rationale: आज्ञार्थक क्रिया के साथ נָא अनुरोध या विनम्र आग्रह व्यक्त करता है; यह आधुनिक हिन्दी में स्वाभाविक रूप है।
- source_word: כִּכְּרוֹת לֶחֶם
  choice: रोटियाँ
  rationale: यह पद रोटी की गोल टिकियों या लोइयों को सूचित करता है; सामान्य हिन्दी में ‘रोटियाँ’ अर्थ को सहज और स्पष्ट रूप से व्यक्त करता है।
- source_word: לָעָם אֲשֶׁר בְּרַגְלָי
  choice: मेरे साथ चल रहे लोगों
  rationale: शाब्दिक चित्र ‘मेरे पैरों पर’ है, जो साथ चलने या किसी का अनुसरण करने वालों के लिए मुहावरा है। मुख्य पाठ में उसका स्वाभाविक हिन्दी अर्थ दिया गया और शाब्दिक रूप पादटिप्पणी में रखा गया है।
- source_word: עֲיֵפִים
  choice: थके हुए
  rationale: यह परिश्रम से आई थकान बताता है; ‘थके हुए’ स्वाभाविक है और शारीरिक मूर्छा या अत्यधिक निर्बलता का अनावश्यक अर्थ नहीं जोड़ता।
- source_word: רֹדֵף אַחֲרֵי
  choice: पीछा कर रहा हूँ
  rationale: कृदन्त रूप जारी पीछा करने की क्रिया को दर्शाता है; हिन्दी का अपूर्ण वर्तमान इसका उचित संप्रेषण करता है।
- source_word: זֶבַח וְצַלְמֻנָּע
  choice: जेबह और सलमुन्ना
  rationale: दोनों व्यक्तिनामों का हिब्रू उच्चारणानुसार देवनागरी लिप्यंतरण किया गया है।
- source_word: מַלְכֵי מִדְיָן
  choice: मिद्यान के राजाओं
  rationale: सम्बन्धवाचक हिब्रू पदबंध का सीधा और स्वाभाविक हिन्दी रूप है।
