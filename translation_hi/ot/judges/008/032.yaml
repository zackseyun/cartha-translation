  text: וַ/יָּ֛מָת גִּדְע֥וֹן בֶּן יוֹאָ֖שׁ בְּ/שֵׂיבָ֣ה טוֹבָ֑ה וַ/יִּקָּבֵ֗ר בְּ/קֶ֨בֶר֙ יוֹאָ֣שׁ אָבִ֔י/ו בְּ/עָפְרָ֖ה אֲבִ֥י הָֽעֶזְרִֽי־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/032.yaml
  text: And Gideon son of Joash died at a good old age and was buried in the tomb of Joash his father[b][a], in Ophrah of the Abiezrites.
translation:
  language: hi
  text: और योआश का पुत्र गिदोन अच्छी वृद्धावस्था तक जीकर मर गया, और उसे उसके पिता योआश की कब्र[a] में, अबीएजेरी कुल के ओप्रा में दफनाया गया।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “समाधि” अथवा “दफन-स्थान।” इब्रानी शब्द קֶבֶר के ये अर्थ भी हो सकते हैं।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से “अबीएजेरी के ओप्रा में,” अर्थात अबीएजेर के कुल से संबंधित ओप्रा में।
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּמָת
  choice: मर गया
  rationale: मूल क्रिया מות सीधे मृत्यु को व्यक्त करती है; यह सहज और स्पष्ट हिन्दी है।
- source_word: גִּדְעוֹן בֶּן יוֹאָשׁ
  choice: योआश का पुत्र गिदोन
  rationale: वंश-संबंध को स्वाभाविक हिन्दी क्रम में स्पष्ट रखा गया है।
- source_word: בְּשֵׂיבָה טוֹבָה
  choice: अच्छी वृद्धावस्था में
  rationale: שֵׂיבָה वृद्धावस्था को और טוֹבָה उसके अनुकूल, सकारात्मक स्वर को व्यक्त करता है; अनावश्यक रूप से 'पूर्ण आयु' नहीं जोड़ी गई।
- source_word: וַיִּקָּבֵר
  choice: उसे ... दफनाया गया
  rationale: निफ़अल रूप का कर्मवाच्य अर्थ स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: בְּקֶבֶר
  choice: कब्र
  rationale: קֶבֶר कब्र, समाधि या दफन-स्थान को सूचित कर सकता है; 'कब्र' साधारण आधुनिक हिन्दी में स्पष्ट है, जबकि वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: יוֹאָשׁ אָבִיו
  choice: उसके पिता योआश की
  rationale: समाधि-स्थान का योआश से संबंध और गिदोन के साथ उसका पितृ-संबंध दोनों स्पष्ट किए गए हैं।
- source_word: בְּעָפְרָה
  choice: ओप्रा में
  rationale: स्थान-नाम का हिन्दी लिप्यंतरण किया गया है।
- source_word: אֲבִי הָעֶזְרִי
  choice: अबीएजेरी कुल के
  rationale: एकवचन जातिवाचक रूप यहाँ अबीएजेर से जुड़े कुल और उसके ओप्रा को दर्शाता है; 'कुल' सांस्कृतिक आशय स्पष्ट करता है।
