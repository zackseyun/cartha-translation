id: JDG.8.22
reference: Judges 8:22
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּאמְר֤וּ אִֽישׁ יִשְׂרָאֵל֙ אֶל גִּדְע֔וֹן מְשָׁל בָּ֨/נוּ֙ גַּם אַתָּ֔ה גַּם בִּנְ/ךָ֖ גַּ֣ם בֶּן בְּנֶ֑/ךָ כִּ֥י הוֹשַׁעְתָּ֖/נוּ מִ/יַּ֥ד מִדְיָֽן־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/022.yaml
  text: Then the men of Israel said to Gideon[a], “Rule over us—you, your son, and your grandson as well—for you have saved us from the hand of Midian.”
translation:
  language: hi
  text: तब इस्राएल के पुरुषों ने गिदोन से कहा, “तू हम पर शासन कर—तू, तेरा बेटा और तेरे बेटे का बेटा भी—क्योंकि तूने हमें मिद्यान के हाथ से बचाया है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: तब ... ने कहा
  rationale: वाव-क्रमागत कथा को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में घटनाक्रम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אִישׁ יִשְׂרָאֵל
  choice: इस्राएल के पुरुषों
  rationale: ‘इश’ रूप में एकवचन होते हुए भी बहुवचन क्रिया के साथ यहाँ सामूहिक अर्थ रखता है; यह अनुवाद उसके पुरुषवाचक और सामूहिक बल को बनाए रखता है।
- source_word: מְשָׁל בָּנוּ
  choice: तू हम पर शासन कर
  rationale: माशाल का आदेशात्मक रूप यहाँ राजनीतिक प्रभुत्व या शासन की माँग व्यक्त करता है; ‘शासन कर’ सीधा और वर्तमान हिन्दी में स्वाभाविक है।
- source_word: גַּם אַתָּה גַּם בִּנְךָ גַּם בֶּן בְּנֶךָ
  choice: तू, तेरा बेटा और तेरे बेटे का बेटा भी
  rationale: दोहराया गया ‘गम’ उत्तराधिकार की क्रमिक और जोड़ात्मक धारणा पर बल देता है। ‘तेरे बेटे का बेटा’ इब्रानी की स्पष्ट पीढ़ीगत अभिव्यक्ति को बनाए रखता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह शासन की माँग का कारण प्रस्तुत करता है; हिन्दी में ‘क्योंकि’ सबसे स्पष्ट और स्वाभाविक संयोजक है।
- source_word: הוֹשַׁעְתָּנוּ
  choice: तूने हमें ... बचाया है
  rationale: यशा धातु उद्धार या बचाव बताती है; सैन्य प्रसंग में ‘बचाया’ स्वाभाविक है और व्यापक बाइबलीय उद्धार-शब्दावली से संबंध भी बनाए रखता है।
- source_word: מִיַּד מִדְיָן
  choice: मिद्यान के हाथ से
  rationale: ‘हाथ’ शक्ति या नियंत्रण का इब्रानी मुहावरा है और हिन्दी बाइबलीय शैली में बोधगम्य रहते हुए मूल चित्र को सुरक्षित रखता है।
theological_decisions:
- issue: गिदोन से माँगी गई भूमिका का स्वरूप
  choice: 'शासन की वंशानुगत माँग के रूप में अनुवाद: ‘तू हम पर शासन कर—तू, तेरा बेटा और तेरे बेटे का बेटा भी।’'
  alternative: वंशानुगत अर्थ के बिना केवल सामान्य नेतृत्व की माँग
  rationale: מְשָׁל के साथ तीन क्रमिक पीढ़ियों का स्पष्ट उल्लेख अस्थायी सैन्य नेतृत्व नहीं, बल्कि चलता हुआ वंशानुगत शासन माँगता है। फिर भी ‘राजा’ जैसे मूल में अनुपस्थित पद को नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सीधी कथात्मक शैली। गिदोन को संबोधन में एकवचन ‘तू’ मूल के प्रत्यक्ष एकवचन संबोधन को दर्शाता है; यह यहाँ अपमानसूचक नहीं है। इब्रानी की पीढ़ीगत स्पष्टता बचाने के लिए संक्षिप्त ‘पोता’ के बजाय ‘तेरे बेटे का बेटा’ रखा गया है।
