  text: וַ/יָּבֹ֥א גִדְע֖וֹן הַ/יַּרְדֵּ֑נָ/ה עֹבֵ֣ר ה֗וּא וּ/שְׁלֹשׁ מֵא֤וֹת הָ/אִישׁ֙ אֲשֶׁ֣ר אִתּ֔/וֹ עֲיֵפִ֖ים וְ/רֹדְפִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/004.yaml
  text: Then Gideon came to the Jordan and crossed over[a], he and the three hundred men who were with him, exhausted yet pursuing.
translation:
  language: hi
  text: गिदोन यरदन तक पहुँचा और उसे पार किया। वह और उसके साथ के तीन सौ आदमी थके हुए थे, फिर भी पीछा कर रहे थे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “थके हुए और पीछा करते हुए”; इसका अनुवाद “थके हुए, पर पीछा करते हुए” भी हो सकता है।
    reason: इब्रानी संयोजक וְ सामान्यतः “और” है, पर यहाँ प्रसंग के अनुसार विरोधसूचक भाव भी दे सकता है।
lexical_decisions:
- source_word: וַיָּבֹא
  choice: पहुँचा
  rationale: בוא यहाँ गंतव्य के साथ प्रयुक्त है; आधुनिक हिन्दी कथा में “पहुँचा” आगमन और कथात्मक गति को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הַיַּרְדֵּנָה
  choice: यरदन के पास
  rationale: दिशासूचक ה नदी की ओर गति बताता है। अगले पदबंध में नदी पार करने का उल्लेख होने से “यरदन के पास” हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: עֹבֵר הוּא
  choice: और उसे पार कर गया। वह
  rationale: कृदन्त और सर्वनाम गिदोन के पार जाने को सजीव ढंग से प्रस्तुत करते हैं और आगे उसके साथियों को जोड़ते हैं। दो हिन्दी वाक्यों में बाँटने से अर्थ स्पष्ट रहता है और “वह” का बल भी बना रहता है।
- source_word: וּשְׁלֹשׁ מֵאוֹת הָאִישׁ אֲשֶׁר אִתּוֹ
  choice: और उसके साथ के तीन सौ पुरुष
  rationale: सैन्य संदर्भ में הָאִישׁ के लिए “पुरुष” सटीक है; यह पदबंध गिदोन के साथ उपस्थित दल की पहचान करता है।
- source_word: עֲיֵפִים
  choice: थके हुए थे
  rationale: यह उनकी वास्तविक शारीरिक थकावट को सरल, वर्तमान हिन्दी में व्यक्त करता है, बिना उन्हें अचेत या चलने में असमर्थ बताने के।
- source_word: וְרֹדְפִים
  choice: फिर भी पीछा करते जा रहे थे
  rationale: संदर्भ में थकावट और निरन्तर पीछा करने के बीच विरोध है। “फिर भी” उस निहित concessive भाव को व्यक्त करता है, जबकि “करते जा रहे थे” जारी कार्रवाई को बनाए रखता है।
