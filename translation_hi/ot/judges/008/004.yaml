  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। “यरदन” बाइबलीय व्यक्तिवाचक नाम के परिचित हिन्दी रूप में है। मूल की संक्षिप्तता और थकावट के बावजूद जारी पीछा करने का तनाव सुरक्षित रखा गया है।
