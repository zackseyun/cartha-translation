  text: וַ/יְהִ֗י מִשְׁקַ֞ל נִזְמֵ֤י הַ/זָּהָב֙ אֲשֶׁ֣ר שָׁאָ֔ל אֶ֥לֶף וּ/שְׁבַע מֵא֖וֹת זָהָ֑ב לְ֠/בַד מִן הַ/שַּׂהֲרֹנִ֨ים וְ/הַ/נְּטִפ֜וֹת וּ/בִגְדֵ֣י הָ/אַרְגָּמָ֗ן שֶׁ/עַל֙ מַלְכֵ֣י מִדְיָ֔ן וּ/לְ/בַד֙ מִן הָ֣/עֲנָק֔וֹת אֲשֶׁ֖ר בְּ/צַוְּארֵ֥י גְמַלֵּי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/026.yaml
  text: And the weight of the gold rings that he requested was 1,700 shekels of gold[a], besides the crescent ornaments and the pendants and the purple garments that were on the kings of Midian[b], and besides the necklaces that were on the necks of their camels.
translation:
  language: hi
  text: उसने जो सोने के छल्ले[b] माँगे थे, उनका वज़न 1,700 शेकेल[a] था। यह अर्धचंद्राकार आभूषणों, लटकनों और मिद्यान के राजाओं के पहने हुए बैंगनी वस्त्रों के अतिरिक्त था; और उनके ऊँटों की गर्दनों के हारों के अतिरिक्त भी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से ‘1,700 सोना’ है; संदर्भ के अनुसार वज़न की निहित इकाई ‘शेकेल’ जोड़ी गई है।
    reason: lexical_alternative
  - marker: b
    text: या ‘बालियाँ’ अथवा ‘नथें’; इब्रानी शब्द कान या नाक में पहने जाने वाले छल्ले को दर्शा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁקַ֞ל
  choice: वज़न
  rationale: यह संज्ञा मापे गए भार को दर्शाती है; आभूषणों और सोने के संदर्भ में ‘वज़न’ स्वाभाविक और सटीक है।
- source_word: נִזְמֵי הַזָּהָב
  choice: सोने के छल्ले
  rationale: נזם कान या नाक में पहना जाने वाला छल्ला हो सकता है। मुख्य पाठ में व्यापक अर्थ वाला ‘छल्ले’ रखा गया है और स्थान की अस्पष्टता पादटिप्पणी में बताई गई है।
- source_word: אֲשֶׁר שָׁאָל
  choice: उसके माँगे हुए
  rationale: यह गिदोन द्वारा लोगों से माँगी गई लूट की वस्तुओं की ओर संकेत करता है और हिंदी में संक्षिप्त तथा स्वाभाविक है।
- source_word: אֶלֶף וּשְׁבַע מֵאוֹת זָהָב
  choice: 1,700 शेकेल
  rationale: इब्रानी में शाब्दिक रूप से ‘1,700 सोना’ है; वज़न के इस कथन में ‘शेकेल’ निहित इकाई है, जिसे स्पष्टता के लिए पाठ में जोड़ा गया है।
- source_word: לְבַד מִן
  choice: इसके अलावा … इसमें शामिल नहीं थे
  rationale: यह वाक्यांश बताता है कि आगे गिनाई गई वस्तुएँ पहले बताए गए वज़न में सम्मिलित नहीं थीं। हिंदी रूप इस बहिष्करण को स्पष्ट रखता है।
- source_word: הַשַּׂהֲרֹנִים
  choice: अर्धचंद्राकार आभूषण
  rationale: शब्द चंद्रमा की कला के आकार वाले आभूषणों को दर्शाता है; यह रूप आकार और वस्तु दोनों को स्पष्ट करता है।
- source_word: הַנְּטִפוֹת
  choice: लटकनें
  rationale: यह संभवतः नीचे लटकने वाले आभूषणों का नाम है; ‘लटकनें’ अर्थ को अनावश्यक रूप से विशिष्ट किए बिना व्यक्त करता है।
- source_word: בִגְדֵי הָאַרְגָּמָן
  choice: बैंगनी वस्त्र
  rationale: यह बैंगनी रंग अथवा बैंगनी रंगे कपड़े से बने राजसी वस्त्रों का सीधा और स्वाभाविक अनुवाद है।
- source_word: שֶׁעַל מַלְכֵי מִדְיָן
  choice: मिद्यान के राजाओं के पहने हुए
  rationale: על यहाँ उन वस्त्रों को दर्शाता है जो राजाओं के शरीर पर थे; ‘पहने हुए’ हिंदी में ठोस चित्र को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: הָעֲנָקוֹת
  choice: हार
  rationale: यह गर्दन के आभूषणों को दर्शाता है; ऊँटों की गर्दनों के संदर्भ में ‘हार’ सरल और स्पष्ट है।
- source_word: בְּצַוְּארֵי גְמַלֵּיהֶם
  choice: उनके ऊँटों की गर्दनों में पड़े
  rationale: यह आभूषणों का स्थान बताता है; हिंदी में हार के लिए ‘गर्दनों में पड़े’ स्वाभाविक प्रयोग है।
