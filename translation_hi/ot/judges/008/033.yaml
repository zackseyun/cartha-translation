source:
  edition: WLC
  text: וַ/יְהִ֗י כַּֽ/אֲשֶׁר֙ מֵ֣ת גִּדְע֔וֹן וַ/יָּשׁ֨וּבוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וַ/יִּזְנ֖וּ אַחֲרֵ֣י הַ/בְּעָלִ֑ים וַ/יָּשִׂ֧ימוּ לָ/הֶ֛ם בַּ֥עַל בְּרִ֖ית לֵ/אלֹהִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/033.yaml
  text: And it happened that[a], when Gideon died, the sons of Israel turned back and prostituted themselves after the Baals[b], and they made Baal-berith their god.
translation:
  language: hi
  text: और ऐसा हुआ कि जब गिदोन मर गया, तब इस्राएली फिर मुड़ गए और बाल देवताओं के पीछे व्यभिचार किया[a]; उन्होंने बाल-बरीत[b] को अपना देवता बना लिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बाल देवताओं के पीछे वेश्या जैसा आचरण किया।” इब्रानी में मूर्तिपूजा से हुए विश्वासघात के लिए यौन उपमा प्रयुक्त हुई है।
    reason: lexical_alternative
  - marker: b
    text: “बाल-बरीत” का संभावित अर्थ “वाचा का बाल” या “वाचा का स्वामी” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: और ऐसा हुआ कि जब
  rationale: यह इब्रानी कथात्मक सूत्र समय के एक नए मोड़ का परिचय देता है। यह अनुवाद उसकी कथात्मक छटा बनाए रखते हुए आधुनिक हिन्दी में स्वाभाविक है।
- source_word: וַיָּשׁוּבוּ
  choice: फिर मुड़ गए
  rationale: यहाँ क्रिया पहले के धर्मत्याग की ओर लौटने या फिर से उसी आचरण में पड़ने का भाव रखती है, केवल स्थान बदलने का नहीं।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएली
  rationale: यह पद पूरे इस्राएली समुदाय का सामूहिक उल्लेख करता है। ‘इस्राएली’ आधुनिक हिन्दी में स्वाभाविक और अर्थ की दृष्टि से सटीक है।
- source_word: וַיִּזְנוּ אַחֲרֵי
  choice: के पीछे व्यभिचार करने लगे
  rationale: זנה की स्पष्ट यौन उपमा को बनाए रखा गया है; यहाँ यह मूर्तिपूजा के द्वारा विश्वासघात को व्यक्त करती है।
- source_word: הַבְּעָלִים
  choice: बाल देवताओं
  rationale: बहुवचन विभिन्न स्थानीय बाल-रूपों या उनकी उपासना को सूचित करता है। हिन्दी में ‘बाल देवताओं’ से बहुवचन स्पष्ट रहता है।
- source_word: וַיָּשִׂימוּ לָהֶם ... לֵאלֹהִים
  choice: उन्होंने ... को अपना देवता बना लिया
  rationale: यह पदबंध अपने लिए किसी को देवता ठहराने या स्वीकार करने का भाव देता है। ‘अपना देवता बना लिया’ इस अर्थ को सहज हिन्दी में व्यक्त करता है।
- source_word: בַּעַל בְּרִית
  choice: बाल-बरीत
  rationale: यह एक विशिष्ट उपासना-संबंधी नाम है, इसलिए मुख्य पाठ में उसका लिप्यंतरण किया गया है और उसका संभावित अर्थ पाद-टिप्पणी में दिया गया है।
theological_decisions:
- issue: मूर्तिपूजा के लिए यौन उपमा को बनाए रखना
  choice: बाल देवताओं के पीछे व्यभिचार करने लगे
  alternative: बाल देवताओं के पीछे चलकर परमेश्वर के प्रति विश्वासघाती हो गए
  rationale: मूल इब्रानी में זנה जानबूझकर तीखी यौन उपमा का प्रयोग करता है। इसे बनाए रखने से इस्राएल की मूर्तिपूजा में निहित संबंधपरक और वाचा-संबंधी विश्वासघात की शक्ति कम नहीं होती।
- issue: בְּנֵי יִשְׂרָאֵל का सामूहिक अर्थ
  choice: इस्राएली
  alternative: इस्राएल के पुत्र
  rationale: संदर्भ पूरे समुदाय का है। ‘इस्राएली’ हिन्दी में स्त्री-पुरुष सभी सदस्यों को स्वाभाविक रूप से समेटता है और मूल पद के सामूहिक आशय को स्पष्ट रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। कथात्मक सूत्र को कुछ औपचारिकता के साथ सुरक्षित रखा गया है, जबकि ‘इस्राएली’ और ‘अपना देवता बना लिया’ स्वाभाविक हिन्दी देते हैं।
