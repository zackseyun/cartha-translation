source:
  edition: WLC
  text: וַ/יַּ֣עַל גִּדְע֗וֹן דֶּ֚רֶךְ הַ/שְּׁכוּנֵ֣י בָֽ/אֳהָלִ֔ים מִ/קֶּ֥דֶם לְ/נֹ֖בַח וְ/יָגְבֳּהָ֑ה וַ/יַּךְ֙ אֶת הַֽ/מַּחֲנֶ֔ה וְ/הַֽ/מַּחֲנֶ֖ה הָ֥יָה בֶֽטַח־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/011.yaml
  text: Then Gideon went up by the route of those who dwell in tents[a], east of Nobah and Jogbehah, and struck the camp while the camp was unsuspecting.
translation:
  language: hi
  text: तब गिदोन नोबह और योगबह के पूर्व में तंबुओं में रहनेवालों के मार्ग से चढ़ गया। उसने छावनी पर प्रहार किया; उस समय छावनी निश्चिंत थी[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘सुरक्षित थी।’ इब्रानी शब्द भरोसे या सुरक्षा की अवस्था बता सकता है; इस प्रसंग में संभवतः आशय है कि छावनी को किसी आक्रमण की आशंका नहीं थी।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: चढ़ गया
  rationale: עלה का मूल अर्थ ‘ऊपर जाना/चढ़ना’ है। यहाँ यह गिदोन की आगे की यात्रा बताता है; इसलिए सैन्य अर्थ को अनावश्यक रूप से जोड़ने के बजाय इब्रानी कथन की गति बनाए रखी गई है।
- source_word: דֶּרֶךְ הַשְּׁכוּנֵי בָאֳהָלִים
  choice: तंबुओं में रहनेवालों के मार्ग से
  rationale: यह पदबंध शाब्दिक रूप से तंबुओं में रहनेवाले लोगों के मार्ग को दर्शाता है। ‘खानाबदोशों’ जैसा अधिक व्याख्यात्मक शब्द नहीं अपनाया गया।
- source_word: מִקֶּדֶם לְנֹבַח וְיָגְבֳּהָה
  choice: नोबह और योगबह के पूर्व में
  rationale: भौगोलिक संदर्भ में מִקֶּדֶם यहाँ इन स्थानों के पूर्व की दिशा/स्थिति बताता है। स्थान-नामों का स्रोतानुसार लिप्यंतरण किया गया है।
- source_word: וַיַּךְ אֶת־הַמַּחֲנֶה
  choice: छावनी पर प्रहार किया
  rationale: נכה का व्यापक अर्थ मारना या प्रहार करना है। यह अनुवाद आक्रमण की सीधी भाषा रखता है, पर उसके परिणाम को ‘पराजित किया’ कहकर पहले से निश्चित नहीं करता।
- source_word: בֶטַח
  choice: निश्चिंत थी
  rationale: בֶּטַח सुरक्षा, भरोसे या बेखटके अवस्था को व्यक्त कर सकता है। सैन्य प्रसंग में ‘निश्चिंत’ स्वाभाविक हिन्दी में सुरक्षा के भाव और असावधानी की संभावना—दोनों को बनाए रखता है।
