translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी रखी गई है। इब्रानी में ‘छावनी’ की पुनरावृत्ति को सुरक्षित रखा गया है। स्रोत में अंतिम दो कथन ‘और’ से जुड़े हैं; हिन्दी में अर्धविराम और ‘उस समय’ द्वारा उनका निकट संबंध स्पष्ट किया गया है, बिना कारणात्मक अर्थ जोड़े। अंग्रेज़ी परामर्श-पाठ में [a] का चिह्न ‘तंबुओं’ के बाद था, जबकि उसकी टिप्पणी בֶטַח से संबंधित है; हिन्दी में चिह्न को सही शब्द ‘निश्चिंत’ के बाद रखा गया है।
