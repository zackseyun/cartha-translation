  edition: WLC
  text: וַ/יֹּ֜אמֶר זֶ֣בַח וְ/צַלְמֻנָּ֗ע ק֤וּם אַתָּה֙ וּ/פְגַע בָּ֔/נוּ כִּ֥י כָ/אִ֖ישׁ גְּבוּרָת֑/וֹ וַ/יָּ֣קָם גִּדְע֗וֹן וַֽ/יַּהֲרֹג֙ אֶת זֶ֣בַח וְ/אֶת צַלְמֻנָּ֔ע וַ/יִּקַּח֙ אֶת הַ/שַּׂ֣הֲרֹנִ֔ים אֲשֶׁ֖ר בְּ/צַוְּארֵ֥י גְמַלֵּי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/021.yaml
  text: Then Zebah and Zalmunna said[a], “Rise yourself and strike us down, for as the man is, so is his strength.” So Gideon rose and killed Zebah and Zalmunna[c][b], and he took the crescent ornaments that were on the necks of their camels.
translation:
  language: hi
  text: तब ज़ेबह और सल्मुन्ना ने कहा[a], “तुम स्वयं उठो और हमें मार डालो, क्योंकि जैसा पुरुष होता है, वैसा ही उसका बल भी होता है।” तब गिदोन उठा और उसने ज़ेबह और सल्मुन्ना को मार डाला; फिर उसने उनके ऊँटों की गर्दनों पर लगे अर्धचंद्राकार आभूषण[b] ले लिए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम स्वयं उठो और हम पर प्रहार करो।” इस प्रसंग में प्रहार का परिणाम मृत्यु है।
    reason: lexical_alternative
  - marker: b
    text: या, “चंद्रकलाकार लटकनें” अथवा “चंद्राकार आभूषण।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר ... זֶבַח וְצַלְמֻנָּע
  choice: तब ज़ेबह और सल्मुन्ना ने कहा
  rationale: संयुक्त कर्ता के साथ एकवचन क्रिया इब्रानी कथात्मक प्रयोग है; हिन्दी में बहुवचन ‘ने कहा’ स्वाभाविक है। कथाक्रम के वाव को ‘तब’ से व्यक्त किया गया है।
- source_word: קוּם אַתָּה
  choice: तुम स्वयं उठो
  rationale: स्पष्ट सर्वनाम אַתָּה आज्ञा पर बल देता है; ‘स्वयं’ उसी जोर को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: וּפְגַע בָּנוּ
  choice: और हमें मार डालो
  rationale: פגע का मूल अर्थ भिड़ना या प्रहार करना हो सकता है, पर इस मृत्युदंड के प्रसंग में प्रहार का घातक परिणाम अभिप्रेत है; इसलिए ‘मार डालो’ स्पष्ट और प्रसंगानुकूल है।
- source_word: כִּי כָאִישׁ גְּבוּרָתוֹ
  choice: क्योंकि जैसा पुरुष होता है, वैसा ही उसका बल होता है
  rationale: यह पुरुष की सामर्थ्य को उसके व्यक्तित्व, पराक्रम या कद के अनुरूप बताने वाली लोकोक्तिपरक पंक्ति है। लगभग शब्दानुरूप रचना मूल की संक्षिप्तता और निहित तनाव को बनाए रखती है।
- source_word: וַיָּקָם גִּדְעוֹן
  choice: तब गिदोन उठा
  rationale: ‘उठा’ पहले दी गई आज्ञा קוּם को प्रतिध्वनित करता है और ‘तब’ कथाक्रम को स्पष्ट करता है।
- source_word: וַיַּהֲרֹג
  choice: और उसने ... को मार डाला
  rationale: הרג के सामान्य घातक अर्थ को वर्तमान, स्पष्ट हिन्दी में व्यक्त करता है।
- source_word: הַשַּׂהֲרֹנִים
  choice: अर्धचंद्राकार आभूषण
  rationale: यह शब्द चंद्र-कलाकार सजावटी वस्तुओं को दर्शाता है; ‘आभूषण’ वस्तु के उपयोग को और ‘अर्धचंद्राकार’ उसके आकार को स्पष्ट करता है।
- source_word: אֲשֶׁר בְּצַוְּארֵי גְמַלֵּיהֶם
  choice: उनके ऊँटों की गर्दनों पर लगे
  rationale: संबंधवाचक उपवाक्य आभूषणों का स्थान बताता है; ‘पर लगे’ हिन्दी में स्वाभाविक और सटीक है।
- source_word: וַיִּקַּח
  choice: फिर उसने ... उतार लिए
  rationale: मूलतः ‘ले लिया’; गर्दनों पर लगे आभूषणों के प्रसंग में ‘उतार लिए’ क्रिया को स्वाभाविक रूप से व्यक्त करता है, जबकि प्राप्त कर लेने का भाव बना रहता है।
theological_decisions:
- issue: כָאִישׁ में पुरुषवाची लोकोक्तिपरक अभिव्यक्ति
  choice: जैसा पुरुष होता है, वैसा ही उसका बल होता है
  alternative: जैसा मनुष्य होता है, वैसा ही उसका बल होता है
  rationale: संदर्भ पुरुष योद्धाओं और वध करने की सामर्थ्य का है तथा मूल रूप पुरुषवाची है। ‘पुरुष’ इस संदर्भगत अर्थ को सुरक्षित रखता है, बिना इसे सार्वभौमिक या लिंग-निरपेक्ष कथन में बदलने के।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, सहज किंतु गरिमापूर्ण रखी गई है। लोकोक्तिपरक कारण-वाक्य को सरल करके उसका आशय मात्र नहीं दिया गया, ताकि मूल की शैली और निहित अर्थ सुरक्षित रहें।
