  text: וַ/יֹּ֨אמֶר אֲלֵ/הֶ֜ם גִּדְע֗וֹן אֶשְׁאֲלָ֤ה מִ/כֶּם֙ שְׁאֵלָ֔ה וּ/תְנוּ לִ֕/י אִ֖ישׁ נֶ֣זֶם שְׁלָל֑/וֹ כִּֽי נִזְמֵ֤י זָהָב֙ לָ/הֶ֔ם כִּ֥י יִשְׁמְעֵאלִ֖ים הֵֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/024.yaml
  text: 'Then Gideon said to them, “Let me ask one request of you: each man, give me an earring from his spoil.” For they had gold earrings, because they were Ishmaelites.'
translation:
  language: hi
  text: 'तब गिदोन ने उनसे कहा, “मैं तुमसे एक विनती करता हूँ: हर व्यक्ति अपनी लूट में से एक कान की बाली[क] मुझे दे।” क्योंकि उनके पास सोने की बालियाँ थीं, क्योंकि वे इश्माएली थे।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: क
    text: ‘कान की बाली’ के लिए इब्रानी शब्द नाक में पहने जाने वाले छल्ले का भी अर्थ दे सकता है।
    reason: नֶזֶם के कान अथवा नाक के आभूषण होने की वास्तविक शब्दगत अस्पष्टता को सुरक्षित रखता है।
lexical_decisions:
- source_word: אֶשְׁאֲלָה מִכֶּם שְׁאֵלָה
  choice: मैं तुमसे एक विनती करता हूँ
  rationale: इब्रानी धातु और संज्ञा की पुनरुक्ति विनती करने पर बल देती है; स्वाभाविक आधुनिक हिन्दी में अर्थ और विनम्र आग्रह दोनों सुरक्षित हैं।
- source_word: אִישׁ
  choice: हर एक पुरुष
  rationale: वितरणात्मक अर्थ है—प्रत्येक व्यक्ति अपनी लूट में से दे।
- source_word: נֶזֶם / נִזְמֵי
  choice: नथ / नथें
  rationale: यह शब्द नाक या कान के आभूषण के लिए प्रयुक्त हो सकता है; इस प्रसंग और प्राचीन इश्माएली/मिद्यानी आभूषण-प्रथा में नाक की नथ संभावित है। वास्तविक शाब्दिक अस्पष्टता को टिप्पणी में दर्ज किया गया है।
- source_word: שְׁלָלוֹ
  choice: अपनी लूट में से
  rationale: व्यक्ति के युद्ध में प्राप्त लूट के हिस्से को स्पष्ट और संक्षिप्त ढंग से व्यक्त करता है।
- source_word: יִשְׁמְעֵאלִים
  choice: इश्माएली
  rationale: प्रचलित हिन्दी बाइबलीय जातिनाम; स्रोत की पहचान को यथावत रखता है।
theological_decisions:
- issue: मिद्यानियों को इश्माएली कहना
  choice: वे इश्माएली थे
  alternative: वे इश्माएली माने जाते थे
  rationale: स्रोत सीधा जातीय/समूहगत कथन करता है। अनुवाद ने मिद्यानी और इश्माएली नामों के संबंध को समझाकर या समतल करके पाठ के ऐतिहासिक तनाव को नहीं मिटाया।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। प्रत्यक्ष कथन में ‘तुम’ बहुवचन समुदाय के लिए है; ‘हर एक पुरुष’ मूल के वितरणात्मक बल को बनाए रखता है।
