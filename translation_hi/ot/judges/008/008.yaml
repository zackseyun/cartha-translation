base_translation:
  language: en
  yaml_path: translation/ot/judges/008/008.yaml
  text: From there he went up to Penuel and spoke to them in the same way[b][a], and the men of Penuel answered him just as the men of Succoth had answered.
translation:
  language: hi
  text: वहाँ से वह चढ़कर पनूएल[a] गया और उनसे वैसी ही बात कही[b]। पनूएल के पुरुषों ने उसे वैसा ही उत्तर दिया जैसा सुक्कोत के पुरुषों ने दिया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: पनूएल का नाम अन्य स्थानों पर ‘पनीएल’ भी लिखा गया है।
    reason: alternative_reading
  - marker: b
    text: 'अधिक शाब्दिक अनुवाद: ‘और उनसे इस प्रकार कहा।’ इब्रानी अभिव्यक्ति पिछले पद में बताए गए अनुरोध या कथन की ओर संकेत करती है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל מִשָּׁם
  choice: वहाँ से वह ... को चढ़ गया
  rationale: עלה में ऊपर की ओर जाने का भाव है; ‘चढ़ गया’ उस दिशात्मक अर्थ को स्वाभाविक हिन्दी में बनाए रखता है, और מִשָּׁם का सीधा अर्थ ‘वहाँ से’ है।
- source_word: פְּנוּאֵל
  choice: पनूएल
  rationale: इस पद के इब्रानी व्यंजनात्मक रूप के अनुरूप स्थान-नाम का लिप्यंतरण किया गया है।
- source_word: וַיְדַבֵּר אֲלֵיהֶם כָּזֹאת
  choice: और उनसे वैसी ही बात कही
  rationale: शाब्दिक अर्थ ‘और उनसे इस प्रकार कहा’ है, पर कथन की विषयवस्तु पिछले पद के अनुरोध की ओर संकेत करती है; ‘वैसी ही बात’ इस संदर्भसूचक बल को सहज ढंग से व्यक्त करता है।
- source_word: וַיַּעֲנוּ אוֹתוֹ
  choice: उसे ... उत्तर दिया
  rationale: ענה यहाँ सीधे कर्म के साथ ‘उत्तर देना’ व्यक्त करता है।
- source_word: אַנְשֵׁי פְנוּאֵל
  choice: पनूएल के पुरुषों
  rationale: אַנְשֵׁי का अर्थ विशेष रूप से ‘पुरुष’ है; इसलिए इसे सामान्य ‘लोगों’ से निरपेक्ष नहीं किया गया।
- source_word: כַּאֲשֶׁר עָנוּ אַנְשֵׁי סֻכּוֹת
  choice: वैसा ही ... जैसा सुक्कोत के पुरुषों ने दिया था
  rationale: כַּאֲשֶׁר तुलना प्रकट करता है; ‘दिया था’ पहले घट चुकी प्रतिक्रिया को स्पष्ट करता है।
- source_word: סֻכּוֹת
  choice: सुक्कोत
  rationale: इब्रानी उच्चारण के निकट और हिन्दी में सुबोध लिप्यंतरण।
