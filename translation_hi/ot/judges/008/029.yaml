lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: जाकर
  rationale: वाव-क्रमिक कथात्मक रूप यहाँ आगे की घटना बताता है। ‘जाकर’ मूल क्रिया ‘जाना’ को स्वाभाविक हिन्दी में रखता है; ‘लौटकर’ दिशा को आवश्यकता से अधिक स्पष्ट कर देता।
- source_word: יְרֻבַּעַל
  choice: यरुब्बाल
  rationale: इब्रानी पाठ में इसी नाम का प्रयोग है, इसलिए अधिक परिचित वैकल्पिक नाम ‘गिदोन’ रखने के बजाय मूल नाम का लिप्यंतरण किया गया है।
- source_word: בֶּן יוֹאָשׁ
  choice: योआश का पुत्र
  rationale: यह मानक पुत्र-संबंधी रचना का सीधा और गरिमापूर्ण हिन्दी अनुवाद है।
- source_word: וַיֵּשֶׁב
  choice: रहने लगा
  rationale: ישב के अर्थों में बैठना, रहना और बसना शामिल हैं। ‘अपने घर में’ के साथ यहाँ निवास का भाव है; ‘रहने लगा’ आधुनिक हिन्दी में इसे स्पष्ट करता है और क्रमिक कथन को स्वाभाविक रखता है।
- source_word: בְּבֵיתוֹ
  choice: अपने घर में
  rationale: तीसरे पुरुष एकवचन स्वत्वसूचक प्रत्यय का हिन्दी में कर्ता-संबंधी स्वाभाविक रूप ‘अपने’ है; ‘घर में’ मूल पूर्वसर्ग और संज्ञा को स्पष्ट रूप से व्यक्त करता है।
- source_word: וַ...וַ
  choice: तब ... जाकर ... रहने लगा
  rationale: दोनों वाव-क्रमिक क्रियाएँ कथा को आगे बढ़ाती हैं। ‘तब’ और संयुक्त क्रियात्मक रचना आधुनिक हिन्दी में उसी अनुक्रम को सहजता से व्यक्त करती है।
