language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/לֹ֤א זָֽכְרוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל אֶת יְהוָ֖ה אֱלֹהֵי/הֶ֑ם הַ/מַּצִּ֥יל אוֹתָ֛/ם מִ/יַּ֥ד כָּל אֹיְבֵי/הֶ֖ם מִ/סָּבִֽיב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/034.yaml
  text: And the sons of Israel did not remember Yahweh their God[a], who had delivered them from the hand of all their enemies all around.
translation:
  language: hi
  text: और इस्राएल के पुत्रों ने अपने परमेश्वर यहवे को याद नहीं रखा, जिसने उन्हें चारों ओर के अपने सभी शत्रुओं के हाथ से छुड़ाया था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלֹא
  choice: और ... न रख सके
  rationale: संयोजक पिछले कथन से कथा का प्रवाह जारी रखता है। हिन्दी में ‘और’ स्वाभाविक है; निषेध ‘न’ से व्यक्त है।
- source_word: זָכְרוּ
  choice: याद न रख सके
  rationale: यहाँ स्मरण केवल मानसिक याद नहीं, बल्कि यहवे के उद्धार को ध्यान में रखकर निष्ठावान बने रहना भी सूचित करता है। ‘याद रखना’ इस व्यापक अर्थ को स्वाभाविक हिन्दी में वहन करता है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्र
  rationale: मूल इब्रानी की औपचारिक, पुल्लिंग सामूहिक अभिव्यक्ति को सुरक्षित रखा गया है।
- source_word: יְהוָה
  choice: यहवे
  rationale: उपाधि से बदलने के बजाय परमेश्वर के व्यक्तिगत वाचा-नाम का हिन्दी लिप्यंतरण किया गया है।
- source_word: אֱלֹהֵיהֶם
  choice: अपने परमेश्वर
  rationale: यहवे इसका एकवचन संदर्भ है; ‘अपने परमेश्वर’ इस्राएल के साथ वाचा-संबंध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הַמַּצִּיל
  choice: जिसने ... छुड़ाया था
  rationale: संज्ञीकृत कृदंत यहवे को उनके उद्धारकर्ता कार्य से पहचानता है। पूर्वकालिक उद्धार को ‘छुड़ाया था’ स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: מִיַּד
  choice: के हाथ से
  rationale: शक्ति अथवा नियंत्रण के लिए प्रयुक्त मूल इब्रानी बिंब को सुरक्षित रखा गया है और हिन्दी में भी यह समझने योग्य है।
- source_word: כָּל אֹיְבֵיהֶם
  choice: उनके सभी शत्रुओं
  rationale: समग्रता बताने वाले मूल पदबंध का सीधा और स्वाभाविक अनुवाद है।
- source_word: מִסָּבִיב
  choice: चारों ओर के
  rationale: यह आसपास, प्रत्येक दिशा में स्थित शत्रुओं को सूचित करता है; ‘चारों ओर के’ आधुनिक हिन्दी में संक्षिप्त और स्पष्ट है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चतुरक्षरीय व्यक्तिगत नाम सीधे आया है। उपाधि ‘प्रभु’ से प्रतिस्थापित न करके नाम को हिन्दी में लिप्यंतरित किया गया है।
- issue: लिंगयुक्त सामूहिक पद בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्र
  alternative: इस्राएली; इस्राएल की संतान
  rationale: मूल की औपचारिक पुल्लिंग बहुवचन अभिव्यक्ति सुरक्षित रखी गई है; इसे अधिक सामान्य जातीय पद में नहीं बदला गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज कथात्मक शैली। ‘इस्राएल के पुत्र’ मूल की औपचारिकता बनाए रखता है, जबकि ‘हाथ से छुड़ाया’ स्रोत के बिंब और बाइबलीय मुहावरे को सुरक्षित रखता है।
