base_translation:
  language: en
  yaml_path: translation/ot/judges/008/010.yaml
  text: Zebah and Zalmunna were in Karkor[a], and their camps were with them, about fifteen thousand men, all who were left from all the camp of the sons of the east; and those who had fallen were one hundred twenty thousand men drawing the sword.
translation:
  language: hi
  text: ज़ेबह और सलमुन्ना करकोर में थे, और उनकी छावनियाँ उनके साथ थीं—लगभग पंद्रह हज़ार पुरुष, जो पूरब के लोगों की सारी सेना में से बचे हुए थे। तलवार चलानेवाले जो पुरुष मारे गए थे, उनकी संख्या एक लाख बीस हज़ार थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּקַּרְקֹר
  choice: करकोर में
  rationale: בְּ स्थान सूचित करता है; स्थान-नाम के साथ ‘में’ स्वाभाविक और सटीक है।
- source_word: וּמַחֲנֵיהֶם עִמָּם
  choice: उनके साथ उनकी छावनियाँ भी थीं
  rationale: מַחֲנֵיהֶם रूप की बहुवचनता को ‘छावनियाँ’ में बनाए रखा गया है और עִמָּם को स्पष्टतः ‘उनके साथ’ कहा गया है।
- source_word: כַּחֲמֵשֶׁת עָשָׂר אֶלֶף
  choice: लगभग पंद्रह हज़ार पुरुष
  rationale: संख्या पर लगे כְּ से अनुमान का भाव आता है, जिसे ‘लगभग’ व्यक्त करता है; संदर्भ के आधार पर ‘पुरुष’ स्पष्ट किया गया है।
- source_word: כֹּל הַנּוֹתָרִים מִכֹּל מַחֲנֵה בְנֵי קֶדֶם
  choice: पूरब के लोगों की पूरी सेना में से केवल इतने ही बचे थे
  rationale: निफ़अल कृदंत הַנּוֹתָרִים का शेष बचे होने का भाव रखा गया है और מִן का अंशसूचक अर्थ ‘में से’ से व्यक्त हुआ है। בְנֵי קֶדֶם शाब्दिकतः ‘पूरब के पुत्र’ है, पर आधुनिक हिन्दी में ‘पूरब के लोग’ अर्थ को स्वाभाविक ढंग से पहुँचाता है। सैन्य संदर्भ में מַחֲנֶה को ‘सेना’ कहा गया है।
- source_word: וְהַנֹּפְלִים
  choice: मारे जा चुके थे
  rationale: युद्ध के संदर्भ में נפל का आशय युद्ध में मारे गए लोगों से है; हिन्दी में ‘मारे जा चुके थे’ पूर्ववर्ती घटना और परिणाम दोनों को स्पष्ट करता है।
- source_word: מֵאָה וְעֶשְׂרִים אֶלֶף
  choice: एक लाख बीस हज़ार
  rationale: हिन्दी की प्रचलित संख्या-पद्धति में सटीक संख्या दी गई है।
- source_word: אִישׁ שֹׁלֵף חָרֶב
  choice: तलवार चलानेवाले पुरुष
  rationale: यह युद्ध करने योग्य सशस्त्र पुरुषों का सामरिक मुहावरा है। ‘तलवार चलानेवाले’ मूल की सजीव छवि को रखते हुए हिन्दी में स्वाभाविक है।
