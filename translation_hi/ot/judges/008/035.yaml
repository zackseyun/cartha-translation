source:
  edition: WLC
  text: וְ/לֹֽא עָשׂ֣וּ חֶ֔סֶד עִם בֵּ֥ית יְרֻבַּ֖עַל גִּדְע֑וֹן כְּ/כָל הַ/טּוֹבָ֔ה אֲשֶׁ֥ר עָשָׂ֖ה עִם יִשְׂרָאֵֽל־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/035.yaml
  text: And they did not show kindness to the house of Jerubbaal (that is, Gideon), in keeping with all the good that he had done for Israel.
translation:
  language: hi
  text: और उन्होंने यरुब्बाल, अर्थात् गिदोन, के घराने के प्रति उस सारी भलाई के अनुरूप दयालुता नहीं दिखाई, जो उसने इस्राएल के लिए की थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֶסֶד
  choice: कृपा
  rationale: यहाँ शब्द का आशय निष्ठापूर्ण दयालु व्यवहार से है; ‘कृपा दिखाई’ आधुनिक हिन्दी में स्वाभाविक रहते हुए नैतिक संबंधगत भाव को व्यक्त करता है।
- source_word: בֵּית יְרֻבַּעַל
  choice: यरुब्बाल ... के घराने
  rationale: בֵּית व्यक्ति के परिवार या वंश को सूचित करता है, इसलिए ‘घराने’ उपयुक्त है।
- source_word: כְּכָל הַטּוֹבָה
  choice: उस सारी भलाई के अनुरूप
  rationale: כְּ को अनुपात/अनुरूपता के अर्थ में रखा गया है और הַטּוֹבָה को गिदोन द्वारा किए गए हितकारी कार्यों के रूप में ‘भलाई’ कहा गया है।
- source_word: עִם יִשְׂרָאֵל
  choice: इस्राएल के लिए
  rationale: शाब्दिक ‘इस्राएल के साथ’ की अपेक्षा प्रसंग में लाभार्थी भाव है; स्वाभाविक हिन्दी में ‘इस्राएल के लिए’ वही आशय स्पष्ट करता है।
theological_decisions:
- issue: यरुब्बाल और गिदोन की पहचान
  choice: यरुब्बाल, अर्थात गिदोन
  alternative: यरुब्बाल गिदोन
  rationale: दोनों नाम एक ही व्यक्ति के हैं; ‘अर्थात’ इस समानता को स्पष्ट करता है, जैसा निकटवर्ती कथा-संदर्भ से प्रमाणित है, बिना अतिरिक्त व्याख्या जोड़े।
- issue: חֶסֶד का धार्मिक अर्थ
  choice: कृपा
  alternative: वाचा की निष्ठा
  rationale: पद परिवार के प्रति इस्राएल की कृतघ्नता पर केंद्रित है; यहाँ तकनीकी ‘वाचा’ शब्द जोड़ना मूल पाठ से अधिक विशिष्ट धार्मिक निष्कर्ष आरोपित कर सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण शैली। वाक्य ने हिब्रू की नकारात्मक संरचना और गिदोन की भलाई के अनुपात में अपेक्षित व्यवहार—दोनों को सुरक्षित रखा है।
