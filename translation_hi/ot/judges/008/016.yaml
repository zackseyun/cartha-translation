base_translation:
  language: en
  yaml_path: translation/ot/judges/008/016.yaml
  text: Then he took the elders of the city[a], and thorns of the wilderness and briers, and with them he disciplined the men of Succoth.
translation:
  language: hi
  text: तब उसने नगर के पुरनियों को पकड़ा और जंगल के काँटों और कँटीली झाड़ियों से सुक्कोत के पुरुषों को दण्ड दिया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू में यहाँ एक कठिन अभिव्यक्ति है। क्रिया का सामान्य अर्थ “ज्ञात कराना” या “सिखाना” है, पर इस प्रसंग में कुछ इसे काँटों और झाड़ियों के द्वारा सुक्कोत के पुरुषों को कठोर दण्ड देने के अर्थ में समझते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: זִקְנֵי הָעִיר
  choice: नगर के पुरनियों
  rationale: यह पद नगर के मान्य वरिष्ठ नागरिकों और शासकीय अगुओं को सूचित करता है। ‘पुरनियों’ से सामाजिक-राजनीतिक पदवी बनी रहती है।
- source_word: קוֹצֵי הַמִּדְבָּר
  choice: जंगल के काँटों
  rationale: यह जंगली या निर्जन प्रदेश में उगने वाले काँटेदार पौधों का ठोस चित्र बनाए रखता है।
- source_word: הַבַּרְקֳנִים
  choice: कँटीली झाड़ियों
  rationale: संज्ञा किसी चुभने वाले काँटेदार पौधे को दर्शाती है; सहज आधुनिक हिन्दी में ‘कँटीली झाड़ियों’ उसका अनिश्चित वनस्पतिक स्वरूप सुरक्षित रखता है।
- source_word: וַיֹּדַע בָּהֶם
  choice: उनसे ... दण्ड दिया
  rationale: हिफ़ील रूप का सामान्य अर्थ ‘जान कराया’ है, पर यहाँ काँटों के साधन के कारण कठोर दण्ड का भाव स्पष्ट है। हिन्दी में शाब्दिक ‘सिखाया’ भ्रामक हो सकता है, इसलिए प्रसंगानुकूल अर्थ मुख्य पाठ में रखा गया और कठिन हिब्रू अभिव्यक्ति पादटिप्पणी में बताई गई है।
- source_word: אַנְשֵׁי סֻכּוֹת
  choice: सुक्कोत के पुरुषों
  rationale: हिब्रू पद का शाब्दिक लिंग और नगर-समुदाय के पुरुषों का संकेत सुरक्षित रखा गया है।
theological_decisions:
- issue: गिदोन की कार्रवाई का स्वरूप
  choice: दण्ड दिया
  alternative: उन्हें सिखाया / उनसे परिचित कराया
  rationale: पाठ गिदोन की कार्रवाई का वर्णन करता है, उसका नैतिक अनुमोदन नहीं। साधनों और प्रसंग से दण्डात्मक कार्रवाई सूचित होती है, जबकि क्रिया की असामान्यता पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘पुरनियों’ बाइबलीय सामाजिक पदवी के रूप में प्रचलित है; ‘कँटीली झाड़ियों’ दुर्लभ वनस्पतिक शब्द से बचते हुए मूल की अनिश्चितता बनाए रखता है।
