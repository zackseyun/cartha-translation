source:
  edition: WLC
  text: וַ/יָּנ֗וּסוּ זֶ֚בַח וְ/צַלְמֻנָּ֔ע וַ/יִּרְדֹּ֖ף אַחֲרֵי/הֶ֑ם וַ/יִּלְכֹּ֞ד אֶת שְׁנֵ֣י מַלְכֵ֣י מִדְיָ֗ן אֶת זֶ֨בַח֙ וְ/אֶת צַלְמֻנָּ֔ע וְ/כָל הַֽ/מַּחֲנֶ֖ה הֶחֱרִֽיד־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/012.yaml
  text: Zebah and Zalmunna fled[a], and he pursued them and captured the two kings of Midian, Zebah and Zalmunna; and he threw the whole camp into panic.
translation:
  language: hi
  text: ज़ेबह और सलमुन्‍ना भाग गए। गिदोन ने उनका पीछा किया और मिद्यान के उन दोनों राजाओं—ज़ेबह और सलमुन्‍ना—को पकड़ लिया; और उसने पूरी छावनी में भगदड़ मचा दी।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसने पूरी छावनी को आतंकित कर दिया” अथवा “उसने पूरी छावनी को तितर-बितर कर दिया।” इब्रानी क्रिया का अर्थ काँपने या घबराहट का कारण बनना हो सकता है और इस प्रसंग में उसके सैन्य निहितार्थ भी हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּנוּסוּ
  choice: भाग गए
  rationale: נוּס का काल के अनुसार कथात्मक रूप यहाँ युद्ध से भाग निकलने को दर्शाता है; ‘भाग गए’ स्वाभाविक और स्पष्ट आधुनिक हिन्दी है।
- source_word: זֶבַח וְצַלְמֻנָּע
  choice: ज़ेबह और सलमुन्‍ना
  rationale: व्यक्तिवाचक नामों को अनुवादित करने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: וַיִּרְדֹּף אַחֲרֵיהֶם
  choice: गिदोन ने उनका पीछा किया
  rationale: רדף אחרי का सामान्य अर्थ ‘पीछा करना’ है। इब्रानी में निहित कर्ता को हिन्दी में स्पष्टता के लिए ‘गिदोन’ कहा गया है।
- source_word: וַיִּלְכֹּד
  choice: पकड़ लिया
  rationale: לכד सैन्य प्रसंग में शत्रु को पकड़ लेने या बंदी बनाने का अर्थ देता है; ‘पकड़ लिया’ सहज हिन्दी है और राजाओं के जीवित पकड़े जाने के प्रसंग के अनुकूल है।
- source_word: שְׁנֵי מַלְכֵי מִדְיָן
  choice: मिद्यान के उन दोनों राजाओं
  rationale: यह इब्रानी की संबंधवाचक रचना को बनाए रखता है; ‘उन’ पहले उल्लिखित ज़ेबह और सलमुन्‍ना की ओर स्वाभाविक संकेत करता है।
- source_word: וְכָל הַמַּחֲנֶה
  choice: पूरी छावनी
  rationale: מַחֲנֶה यहाँ सैन्य छावनी अथवा उसमें उपस्थित सैन्य दल को सामूहिक रूप से सूचित करता है।
- source_word: הֶחֱרִיד
  choice: भगदड़ मचा दी
  rationale: חרד का हिफ़ील रूप काँपने, आतंकित होने या युद्ध में अस्त-व्यस्त हो जाने का कारण बनने का भाव रखता है। प्रसंग में ‘भगदड़ मचा दी’ इसके कारणवाचक और सैन्य दोनों पक्षों को स्वाभाविक हिन्दी में व्यक्त करता है।
