translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण कथात्मक प्रयोग किया गया है। इब्रानी की तेज़ घटनाक्रम-शैली को छोटे, सक्रिय वाक्यों से रखा गया है। अस्पष्ट अंतिम क्रिया का मुख्य पाठ में प्रसंगानुकूल अर्थ दिया गया है और उसके वास्तविक वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित रखे गए हैं।
