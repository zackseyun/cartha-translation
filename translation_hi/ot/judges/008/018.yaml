translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। संवाद में ‘तुम’ मूल के एकवचन संबोधन के अनुरूप है। पादटिप्पणी-चिह्नों को उनके वास्तविक विषयों—ताबोर और उत्तर की वैकल्पिक अभिव्यक्ति—के साथ रखा गया है।
