  text: וַ/יֹּ֗אמֶר אֶל זֶ֨בַח֙ וְ/אֶל צַלְמֻנָּ֔ע אֵיפֹה֙ הָ/אֲנָשִׁ֔ים אֲשֶׁ֥ר הֲרַגְתֶּ֖ם בְּ/תָב֑וֹר וַֽ/יֹּאמרוּ֙ כָּמ֣וֹ/ךָ כְמוֹ/הֶ֔ם אֶחָ֕ד כְּ/תֹ֖אַר בְּנֵ֥י הַ/מֶּֽלֶךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/018.yaml
  text: Then he said to Zebah and Zalmunna[a], “Where are the men whom you killed at Tabor?” And they said, “As you are, so were they[b]; each one had the appearance of the sons of a king.”
translation:
  language: hi
  text: तब उसने जेबह और सलमुन्ना से कहा, “वे पुरुष कहाँ हैं जिन्हें तुमने ताबोर[b] पर मार डाला था?” उन्होंने कहा, “जैसे तुम हो, वैसे ही वे थे; उनमें से हर एक का रूप राजा के पुत्र जैसा था।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वे तुम्हारे जैसे थे; हर एक राजा के बेटे जैसा दिखता था।”
    reason: मूल इब्रानी की संक्षिप्त तुलना और ‘राजा के पुत्रों’ वाली अभिव्यक्ति का अधिक शब्दशः वैकल्पिक अनुवाद।
  - marker: b
    text: ताबोर से आशय ताबोर पर्वत है।
    reason: स्थान-नाम की भौगोलिक पहचान स्पष्ट करने के लिए।
lexical_decisions:
- source_word: אֵיפֹה הָאֲנָשִׁים
  choice: वे पुरुष कहाँ हैं
  rationale: इब्रानी प्रश्नवाचक क्रिया-विशेषण स्थान पूछता है; वर्तमानकालीन ‘हैं’ मूल में निहित योजक क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הֲרַגְתֶּם
  choice: तुमने ... मार डाला था
  rationale: मूल क्रिया का सामान्य अर्थ ‘मार डालना/हत्या करना’ है; यह चयन घटना को स्पष्ट रखता है, पर ‘हत्या’ जैसी अतिरिक्त कानूनी व्याख्या नहीं जोड़ता।
- source_word: בְּתָבוֹר
  choice: ताबोर में
  rationale: בְּ स्थान-संबंध बताता है। ‘ताबोर में’ हिन्दी में स्वाभाविक है; पर्वत होने की जानकारी पादटिप्पणी में दी गई है।
- source_word: כָּמוֹךָ כְמוֹהֶם
  choice: जैसे तुम हो, वैसे ही वे थे
  rationale: मूल की संक्षिप्त और कुछ हद तक लुप्त-वाक्यात्मक तुलना को समझने योग्य बनाते हुए गिदोन और मारे गए पुरुषों के बीच सीधी समानता बनाए रखी गई है।
- source_word: אֶחָד
  choice: उनमें से हर एक
  rationale: यहाँ אֶחָד बहुवचन समूह के प्रत्येक सदस्य के लिए वितरणात्मक अर्थ में प्रयुक्त है।
- source_word: כְּתֹאַר בְּנֵי הַמֶּלֶךְ
  choice: राजपुत्र जैसा दिखता था
  rationale: תֹּאַר बाहरी रूप या आकृति को सूचित करता है। ‘राजपुत्र’ בני המלך के राजकीय पुत्र होने के भाव को संक्षिप्त, स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וַיֹּאמֶר ... וַיֹּאמְרוּ
  choice: तब उसने ... कहा ... उन्होंने कहा
  rationale: यह चयन इब्रानी कथात्मक क्रम और दोनों प्रत्यक्ष कथनों को बिना अतिरिक्त व्याख्या के बनाए रखता है।
