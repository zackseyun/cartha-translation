base_translation:
  language: en
  yaml_path: translation/ot/judges/008/030.yaml
  text: Gideon had seventy sons[a], his own offspring, because he had many wives.
translation:
  language: hi
  text: गिदोन के सत्तर बेटे थे—उसकी अपनी संतान[a]—क्योंकि उसकी बहुत-सी पत्नियाँ थीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ, “जो उसकी कटि से निकले थे”; यह उसकी जैविक संतान के लिए एक हिब्रू मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְגִדְעוֹן הָיוּ
  choice: गिदोन के ... थे
  rationale: हिब्रू में לְ के साथ הָיוּ स्वामित्व व्यक्त करता है; आधुनिक हिंदी में ‘गिदोन के ... थे’ स्वाभाविक और सटीक है। आरंभिक וּ को अलग से ‘और’ कहना हिंदी में आवश्यक नहीं, क्योंकि यहाँ वह मुख्यतः कथानक को जोड़ता है।
- source_word: שִׁבְעִים בָּנִים
  choice: सत्तर बेटे
  rationale: בָּנִים यहाँ पुरुष संतानों, अर्थात बेटों, को स्पष्ट रूप से दर्शाता है; सामान्य ‘संतानें’ कहना लिंग-सूचना को मिटा देता।
- source_word: יֹצְאֵי יְרֵכוֹ
  choice: उसकी अपनी संतान
  rationale: शाब्दिक अर्थ ‘उसकी जाँघ/कटि से निकले हुए’ है, जो उसकी जैविक संतान के लिए हिब्रू मुहावरा है। मुख्य पाठ में स्वाभाविक हिंदी रखी गई है और शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यहाँ כִּי बेटों की बड़ी संख्या का कारण प्रस्तुत करता है।
- source_word: נָשִׁים רַבּוֹת הָיוּ לוֹ
  choice: उसकी बहुत-सी पत्नियाँ थीं
  rationale: इस पारिवारिक संदर्भ में נָשִׁים का अर्थ केवल ‘स्त्रियाँ’ नहीं, बल्कि ‘पत्नियाँ’ है; היה + ל स्वामित्व व्यक्त करता है।
theological_decisions:
- issue: गिदोन की अनेक पत्नियों का वर्णन
  choice: ‘बहुत-सी पत्नियाँ’ कहकर स्थिति का तटस्थ वर्णन
  alternative: ‘बहुत-सी स्त्रियाँ’ कहकर वैवाहिक संबंध को अस्पष्ट करना, या नैतिक अनुमोदन/निंदा जोड़ना
  rationale: पद गिदोन की पारिवारिक स्थिति बताता है, पर स्वयं कोई स्पष्ट नैतिक निर्णय नहीं देता। अनुवाद न तो वैवाहिक अर्थ को छिपाता है, न पाठ से बाहर कोई मूल्यांकन जोड़ता है।
translation_notes:
  register: आधुनिक मानक हिंदी; सहज, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट। मुहावरे का अर्थ मुख्य पाठ में स्वाभाविक ढंग से दिया गया है, जबकि उसका मूर्त शाब्दिक रूप पादटिप्पणी में सुरक्षित रखा गया है।
