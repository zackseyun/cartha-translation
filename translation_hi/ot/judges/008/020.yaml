base_translation:
  language: en
  yaml_path: translation/ot/judges/008/020.yaml
  text: Then he said to Jether his firstborn[a], “Get up, kill them.” But the young man did not draw his sword, because he was afraid, for he was still a young man.
translation:
  language: hi
  text: तब उसने अपने पहलौठे बेटे येतेर से कहा, “उठ, उन्हें मार डाल।” पर उस युवक[a] ने अपनी तलवार नहीं खींची, क्योंकि वह डरा हुआ था; वह अभी युवक ही था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू शब्द נַעַר (नाअर) का अर्थ प्रसंग के अनुसार ‘लड़का’, ‘किशोर’ या ‘युवक’ हो सकता है। यहाँ उसके पास तलवार होने और उसे मारने की आज्ञा दिए जाने के कारण ‘युवक’ रखा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब उसने कहा
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में घटनाक्रम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: לְיֶתֶר
  choice: येतेर से
  rationale: व्यक्तिवाचक नाम को हिब्रू उच्चारण के निकट देवनागरी में लिप्यंतरित किया गया है।
- source_word: בְּכוֹרוֹ
  choice: अपने पहलौठे बेटे
  rationale: בכור जन्मक्रम और पहलौठे होने का भाव रखता है। हिन्दी में स्पष्टता और स्वाभाविकता के लिए ‘बेटे’ जोड़ा गया है, जबकि ‘पहलौठे’ मूल शब्द की विशेष शक्ति को बनाए रखता है।
- source_word: קוּם
  choice: उठ
  rationale: आज्ञार्थक रूप को सीधे, संक्षिप्त और वर्तमान हिन्दी के अनुरूप रखा गया है।
- source_word: הֲרֹג אוֹתָם
  choice: उन्हें मार डाल
  rationale: הרג सामान्यतः जान से मारने को व्यक्त करता है; ‘मार डाल’ आदेश की प्रत्यक्षता और परिणाम दोनों को स्वाभाविक हिन्दी में प्रकट करता है।
- source_word: וְלֹא שָׁלַף
  choice: पर ... नहीं खींची
  rationale: ‘पर’ आदेश और युवक की निष्क्रिय प्रतिक्रिया के बीच विरोध को स्पष्ट करता है; ‘खींची’ तलवार को म्यान से निकालने का स्वाभाविक हिन्दी प्रयोग है।
- source_word: הַנַּעַר
  choice: उस युवक
  rationale: נער की अर्थ-सीमा बालक से युवा पुरुष तक है। तलवार धारण करने और वध की आज्ञा पाने के प्रसंग में ‘युवक’ उपयुक्त है, पर अर्थ की व्यापकता पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: חַרְבּוֹ
  choice: अपनी तलवार
  rationale: हिन्दी में कर्ता की अपनी वस्तु के लिए ‘अपनी’ स्वाभाविक संबंधवाचक रूप है।
- source_word: כִּי יָרֵא
  choice: क्योंकि वह डर गया था
  rationale: כִּי यहाँ तलवार न खींचने का कारण देता है। ‘डर गया था’ प्रसंग में उसकी भयभीत प्रतिक्रिया को सहज हिन्दी में व्यक्त करता है।
- source_word: כִּי עוֹדֶנּוּ נָעַר
  choice: वह अभी युवक ही था
  rationale: עוֹדֶנּוּ का ‘अभी भी/अब तक’ भाव ‘अभी ... ही’ से व्यक्त हुआ है। נער की पुनरावृत्ति को ‘युवक’ दोहराकर बनाए रखा गया है; अर्धविराम संबद्ध किंतु अलग कारणात्मक कथन को सुरक्षित रखता है।
