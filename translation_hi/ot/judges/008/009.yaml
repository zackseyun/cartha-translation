base_translation:
  language: en
  yaml_path: translation/ot/judges/008/009.yaml
  text: He also said to the men of Penuel[a], “When I return in peace[c][b], I will tear down this tower.”
translation:
  language: hi
  text: उसने पनूएल के पुरुषों[b] से भी कहा, “जब मैं सकुशल लौटूँगा[a], तब इस मीनार[c] को ढा दूँगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ “शांति में”; यहाँ इसका अर्थ “सुरक्षित रूप से,” “सफल होकर” या “बिना हानि के” भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में “पनूएल के पुरुषों” है। इससे सम्भवतः नगर के पुरुष अगुवे या प्रतिनिधि अभिप्रेत हैं, अनिवार्य रूप से हर निवासी नहीं।
    reason: cultural_note
  - marker: c
    text: “मीनार” से पनूएल के भीतर स्थित कोई रक्षात्मक बुर्ज या किलेबंद शरणस्थान अभिप्रेत हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: भी
  rationale: यह गिदोन की पिछली बात में पनूएल के लोगों को जोड़ता है और इब्रानी के संयोजक बल को स्वाभाविक हिन्दी में रखता है।
- source_word: לְאַנְשֵׁי פְנוּאֵל
  choice: पनूएल के पुरुषों से
  rationale: אַנְשֵׁי का मूल अर्थ ‘पुरुष’ है। मुख्य पाठ उस लैंगिक अर्थ को बनाए रखता है, जबकि पादटिप्पणी संभावित नागरिक-प्रतिनिधि संदर्भ स्पष्ट करती है।
- source_word: בְּשׁוּבִי
  choice: जब मैं लौटूँगा
  rationale: בְּ के साथ प्रथम पुरुष प्रत्यययुक्त infinitive construct यहाँ समयसूचक है; यह आधुनिक हिन्दी में स्वाभाविक रूप है।
- source_word: בְשָׁלוֹם
  choice: सकुशल
  rationale: युद्ध से लौटने के संदर्भ में שָׁלוֹם सुरक्षित, सफल और अहानिकर वापसी का भाव दे सकता है। ‘सकुशल’ हिन्दी में इस प्रसंगगत अर्थ को स्वाभाविक ढंग से व्यक्त करता है; शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: אֶתֹּץ
  choice: ढा दूँगा
  rationale: נתץ किसी संरचना को गिराने या ध्वस्त करने के लिए प्रयुक्त होता है। ‘ढा दूँगा’ संक्षिप्त, प्रबल और स्वाभाविक हिन्दी है।
- source_word: הַמִּגְדָּל הַזֶּה
  choice: इस मीनार
  rationale: מִגְדָּל का सामान्य ठोस अर्थ ‘मीनार’ है। उसके संभावित रक्षात्मक कार्य को मुख्य पाठ में निश्चित नहीं किया गया, बल्कि पादटिप्पणी में रखा गया है।
