  text: וַ/יֹּ֣אמֶר אֲלֵי/הֶ֔ם מֶה עָשִׂ֥יתִי עַתָּ֖ה כָּ/כֶ֑ם הֲ/ל֗וֹא ט֛וֹב עֹלְל֥וֹת אֶפְרַ֖יִם מִ/בְצִ֥יר אֲבִיעֶֽזֶר־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/002.yaml
  text: But he said to them[a], “What have I done now compared to you? Are not the gleanings of Ephraim better than the grape harvest of Abiezer?”
translation:
  language: hi
  text: पर उसने उनसे कहा, “मैंने अब तुम्हारी तुलना में किया ही क्या है? क्या एप्रैम के बचे-खुचे अंगूर[a] अबीएजेर की अंगूर की फसल से अच्छे नहीं हैं?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात, मुख्य तुड़ाई के बाद बेलों पर बचे और बीनकर इकट्ठे किए गए अंगूर।
    reason: lexical_clarification
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵיהֶם
  choice: पर उसने उनसे कहा
  rationale: वाव-क्रम कथा को आगे बढ़ाता है, जबकि प्रसंग में ‘पर’ एप्रैम की शिकायत के प्रति गिदोन के शांतिपूर्ण उत्तर का विरोधात्मक भाव स्वाभाविक रूप से व्यक्त करता है। ‘उनसे’ पिछले पद के एप्रैमियों को सूचित करता है।
- source_word: מֶה עָשִׂיתִי עַתָּה כָּכֶם
  choice: मैंने अब तुम्हारी तुलना में किया ही क्या है?
  rationale: כָּכֶם यहाँ तुलना व्यक्त करता है। ‘किया ही क्या है’ प्रश्न के आत्म-लघुकरण और अलंकारिक बल को सहज आधुनिक हिन्दी में बनाए रखता है।
- source_word: הֲלוֹא טוֹב
  choice: क्या ... अच्छे नहीं हैं?
  rationale: הֲלוֹא सहमति की अपेक्षा रखने वाला अलंकारिक प्रश्न प्रस्तुत करता है, और מִן के साथ טוֹב का भाव तुलनात्मक, अर्थात ‘से अच्छे’, है।
- source_word: עֹלְלוֹת אֶפְרַיִם
  choice: एप्रैम के बीनने के बाद बचे अंगूर
  rationale: עֹלְלוֹת मुख्य तुड़ाई के बाद बेलों पर बचे और फिर बीनकर लिए जाने वाले अंगूरों को दर्शाता है। यह रूपक को स्पष्ट रखता है और केवल सामान्य ‘बची हुई फसल’ कहने से होने वाली अस्पष्टता से बचता है।
- source_word: מִבְצִיר אֲבִיעֶזֶר
  choice: अबीएजेर की अंगूर की फसल से
  rationale: בָּצִיר विशेष रूप से अंगूर की तुड़ाई या फसल है; prefixed מִן तुलना को ‘से’ द्वारा व्यक्त करता है। ‘अंगूर की फसल’ आधुनिक हिन्दी में स्पष्ट है और दाखबारी रूपक बनाए रखता है।
