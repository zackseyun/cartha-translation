  register: भाषा आधुनिक, सहज और सम्मानपूर्ण रखी गई है। गिदोन के आत्म-लघुकरण तथा अंगूर की बिनाई और मुख्य फसल के बीच मूल रूपक को बिना उसका निहितार्थ खुलकर जोड़ने के सुरक्षित रखा गया है।
