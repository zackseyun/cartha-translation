  register: आधुनिक मानक हिंदी में गरिमापूर्ण किंतु सहज प्रत्यक्ष संवाद रखा गया है। गोत्र का नाम 'एप्रैम' और राष्ट्र/जनसमूह का नाम 'मिद्यान' प्रचलित हिंदी बाइबलीय रूपों के अनुसार दिया गया है।
