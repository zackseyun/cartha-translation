base_translation:
  language: en
  yaml_path: translation/ot/judges/008/001.yaml
  text: Then the men of Ephraim said to him[a], “What is this thing you have done to us[b], not calling us when you went to fight against Midian?” And they contended with him strongly.
translation:
  language: hi
  text: तब एप्रैम के लोगों ने उससे कहा[a], “तुमने हमारे साथ यह क्या किया कि जब तुम मिद्यान से लड़ने गए, तो हमें नहीं बुलाया?” और उन्होंने उससे बहुत तीखा झगड़ा किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ “एप्रैम का पुरुष” है; यहाँ यह पूरे गोत्र के लोगों के लिए प्रयुक्त सामूहिक अभिव्यक्ति है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ אֶפְרַיִם
  choice: एप्रैम के लोगों
  rationale: אִישׁ रूप की दृष्टि से एकवचन है, पर यहाँ गोत्र-सूचक नाम के साथ सामूहिक अर्थ रखता है; आगे के बहुवचन क्रियापद इसकी पुष्टि करते हैं। यह हिंदी में स्वाभाविक है और सामूहिक आशय स्पष्ट करता है।
- source_word: מָה הַדָּבָר הַזֶּה עָשִׂיתָ לָּנוּ
  choice: तुमने हमारे साथ यह क्या किया
  rationale: यह हिंदी की स्वाभाविक शिकायतात्मक प्रश्न-रचना है और דָּבָר तथा לָנוּ के आशय को बनाए रखती है, बिना इसे केवल 'क्यों' में समेटे।
- source_word: לְבִלְתִּי קְרֹאות לָנוּ
  choice: हमें नहीं बुलाया
  rationale: קרא का प्रसंगानुकूल सामान्य अर्थ 'बुलाना' है। हिंदी वाक्य-रचना में इसे मुख्य शिकायत के परिणामसूचक उपवाक्य के रूप में रखना सहज है।
- source_word: כִּי הָלַכְתָּ לְהִלָּחֵם בְּמִדְיָן
  choice: जब तुम मिद्यान से लड़ने गए
  rationale: כִּי को यहाँ समयसूचक मानना शिकायत के संदर्भ में सबसे स्वाभाविक है; בְּמִדְיָן विरोधी पक्ष को दर्शाता है, जिसे 'मिद्यान से लड़ने' द्वारा व्यक्त किया गया है।
- source_word: וַיְרִיבוּן אִתּוֹ בְּחָזְקָה
  choice: उन्होंने उससे बहुत तीखा झगड़ा किया
  rationale: ריב विवाद या झगड़े को और בְּחָזְקָה उसकी प्रबल तीव्रता को व्यक्त करता है। 'बहुत तीखा झगड़ा किया' आधुनिक हिंदी में उग्र मौखिक टकराव को स्पष्ट और स्वाभाविक ढंग से बताता है।
