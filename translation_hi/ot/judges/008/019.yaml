id: JDG.8.19
reference: Judges 8:19
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּאמַ֕ר אַחַ֥/י בְּנֵֽי אִמִּ֖/י הֵ֑ם חַי יְהוָ֗ה ל֚וּ הַחֲיִתֶ֣ם אוֹתָ֔/ם לֹ֥א הָרַ֖גְתִּי אֶתְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/019.yaml
  text: And he said[a], “They were my brothers, the sons of my mother. As Yahweh lives, if you had let them live[b], I would not have killed you.”
translation:
  language: hi
  text: तब उसने कहा, “वे मेरे भाई—मेरी माँ के बेटे[a]—थे। याहवे के जीवन की शपथ, यदि तुमने उन्हें जीवित छोड़ा होता, तो मैं तुम्हें न मारता[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “मेरी माँ के बेटे” से आशय उसके सगे भाइयों से है, केवल व्यापक अर्थ में रिश्तेदारों से नहीं।
    reason: cultural_note
  - marker: b
    text: इब्रानी में अवास्तविक शर्त के परिणाम के लिए पूर्ण क्रिया-रूप है; इसका अनुवाद “मैंने तुम्हें न मारा होता” भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמַר
  choice: तब उसने कहा
  rationale: इब्रानी कथात्मक रूप गिदोन के उत्तर को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में घटनाक्रम को स्वाभाविक ढंग से जोड़ता है।
- source_word: אַחַי בְּנֵי אִמִּי הֵם
  choice: वे मेरे भाई—मेरी माँ के बेटे—थे
  rationale: ‘भाई’ को उसके बाद का समानाधिकरण स्पष्ट करता है। भूतकाल उन पुरुषों के लिए उपयुक्त है जिन्हें पहले ही मार दिया गया था।
- source_word: חַי יְהוָה
  choice: याहवे के जीवन की शपथ
  rationale: यह गंभीर शपथ-सूत्र है। इसमें परमेश्वर के व्यक्तिगत नाम को शीर्षक से नहीं बदला गया है।
- source_word: הַחֲיִתֶם אוֹתָם
  choice: तुमने उन्हें जीवित छोड़ा होता
  rationale: חיה के हिफ़ील रूप का अर्थ यहाँ किसी को जीवित रखना या जीवित छोड़ना है; हिन्दी में यह अतीत की अवास्तविक शर्त को सहजता से व्यक्त करता है।
- source_word: לֹא הָרַגְתִּי אֶתְכֶם
  choice: मैं तुम्हें न मारता
  rationale: इब्रानी पूर्ण रूप अवास्तविक शर्त के परिणाम में आया है। हिन्दी का ‘न मारता’ प्रसंगानुसार स्वाभाविक है और आसन्न हत्या के बारे में गिदोन का कथन व्यक्त करता है।
theological_decisions:
- issue: शपथ-सूत्र में יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में चतुरक्षरीय व्यक्तिगत नाम सीधे प्रयुक्त है; ‘याहवे’ उसे किसी उपाधि से बदले बिना प्रस्तुत करता है।
- issue: गिदोन के कथन में प्रतिशोध की शर्त
  choice: यदि तुमने उन्हें जीवित छोड़ा होता, तो मैं तुम्हें न मारता
  alternative: यदि तुमने उन्हें जीवित रखा होता, तो मैंने तुम्हें न मारा होता
  rationale: मुख्य पाठ अतीत की असत्य शर्त और उसके परिणाम को स्पष्ट रखता है, पर गिदोन के हिंसक निर्णय को नैतिक अनुमोदन या दैवी आदेश के रूप में नहीं जोड़ता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और बोलचाल में बोधगम्य हिन्दी। समानाधिकरण को डैश से अलग किया गया है ताकि पारिवारिक संबंध का भाव स्पष्ट रहे। शपथ-सूत्र में मूल की गंभीरता और परमेश्वर का व्यक्तिगत नाम सुरक्षित रखा गया है।
