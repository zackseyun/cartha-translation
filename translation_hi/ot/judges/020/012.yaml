  text: וַֽ/יִּשְׁלְח֞וּ שִׁבְטֵ֤י יִשְׂרָאֵל֙ אֲנָשִׁ֔ים בְּ/כָל שִׁבְטֵ֥י בִנְיָמִ֖ן לֵ/אמֹ֑ר מָ֚ה הָ/רָעָ֣ה הַ/זֹּ֔את אֲשֶׁ֥ר נִהְיְתָ֖ה בָּ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/012.yaml
  text: So the tribes of Israel sent men through all the tribes of Benjamin[a], saying[b], “What is this evil that has happened among you?”
translation:
  language: hi
  text: तब इस्राएल के गोत्रों ने बिन्यामीन के सभी गोत्रों में[a] आदमी भेजकर कहा, “यह क्या बुराई[b] है जो तुम्हारे बीच हुई है?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बिन्यामीन के सभी गोत्रों के पास।” इब्रानी पूर्वसर्ग का अर्थ यहाँ वितरणात्मक भी हो सकता है। बिन्यामीन स्वयं एक गोत्र था, पर मूल पाठ में यहाँ “गोत्रों” बहुवचन है।
    reason: lexical_alternative
  - marker: b
    text: या “यह कैसी दुष्टता” अथवा “यह कैसा अपराध।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלְחוּ
  choice: भेजकर कहा
  rationale: क्रिया का मूल अर्थ ‘भेजना’ है; לֵאמֹר के साथ हिंदी में ‘आदमी भेजकर कहा’ स्वाभाविक ढंग से दूतों द्वारा कही गई बात का परिचय देता है।
- source_word: שִׁבְטֵי יִשְׂרָאֵל
  choice: इस्राएल के गोत्रों
  rationale: बहुवचन रचनात्मक पदबंध को सीधे रखा गया है और यह इस्राएल के सामूहिक गोत्रीय निकायों को दर्शाता है।
- source_word: אֲנָשִׁים
  choice: आदमी
  rationale: इब्रानी पाठ सामान्य शब्द ‘आदमी/पुरुष’ कहता है, उन्हें स्पष्ट रूप से ‘दूत’ या ‘प्रतिनिधि’ नहीं कहता।
- source_word: בְּכָל שִׁבְטֵי בִנְיָמִן
  choice: बिन्यामीन के सभी गोत्रों में
  rationale: בְּ को वितरणात्मक अर्थ में ‘में’ समझते हुए इब्रानी के असामान्य बहुवचन ‘गोत्रों’ को सुरक्षित रखा गया है; संभावित लक्ष्यसूचक अर्थ पादटिप्पणी में दिया गया है।
- source_word: מָה הָרָעָה הַזֹּאת
  choice: यह क्या बुराई
  rationale: מָה प्रश्न द्वारा घटना की पहचान पूछता है, और רָעָה यहाँ नैतिक रूप से बुरे काम या घोर अपराध को दर्शाता है।
- source_word: אֲשֶׁר נִהְיְתָה
  choice: जो ... हुई है
  rationale: היה का निफ़अल रूप किसी घटना के घटित होने को व्यक्त करता है; हिंदी में ‘हुई है’ संक्षिप्त और स्वाभाविक है।
- source_word: בָּכֶם
  choice: तुम्हारे बीच
  rationale: यह बिन्यामीन के समुदाय के भीतर हुई घटना का स्थान बताता है।
