  text: וַ/יִּתְפָּֽקְדוּ֩ בְנֵ֨י בִנְיָמִ֜ן בַּ/יּ֤וֹם הַ/הוּא֙ מֵ/הֶ֣/עָרִ֔ים עֶשְׂרִ֨ים וְ/שִׁשָּׁ֥ה אֶ֛לֶף אִ֖ישׁ שֹׁ֣לֵֽף חָ֑רֶב לְ֠/בַד מִ/יֹּשְׁבֵ֤י הַ/גִּבְעָה֙ הִתְפָּ֣קְד֔וּ שְׁבַ֥ע מֵא֖וֹת אִ֥ישׁ בָּחֽוּר׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/015.yaml
  text: 'And on that day the sons of Benjamin were mustered from the cities: twenty-six thousand men drawing the sword[a], besides the inhabitants of Gibeah[b], who were mustered as seven hundred chosen men.'
translation:
  language: hi
  text: उस दिन नगरों में से बिन्यामीन के वंशजों की गिनती की गई[a]—छब्बीस हज़ार तलवार खींचनेवाले पुरुष। इनके अलावा, गिबा के निवासियों में से सात सौ चुने हुए[b] पुरुष गिने गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उनकी सैन्य-गणना की गई’ अथवा ‘उन्हें नामांकित किया गया’; इब्रानी क्रिया यहाँ सैन्य सेवा के लिए गिने जाने का संकेत देती है।
    reason: lexical_alternative
  - marker: b
    text: या ‘श्रेष्ठ’; इब्रानी शब्द का अर्थ ‘जवान’ भी हो सकता है, पर इस प्रसंग में संभवतः चुने हुए योद्धा अभिप्रेत हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְפָּקְדוּ / הִתְפָּקְדוּ
  choice: गिनती हुई / गिने गए
  rationale: हित्पएल रूप यहाँ सैन्य सेवा के लिए लोगों की गणना या नामांकन का संकेत देता है। हिंदी में ‘गिनती हुई’ और ‘गिने गए’ स्वाभाविक हैं और दोनों इब्रानी क्रियाओं की पुनरावृत्ति भी बनाए रखते हैं।
- source_word: בְנֵי בִנְיָמִן
  choice: बिन्यामीन के वंशज
  rationale: यह इब्रानी के जनजातीय-पारिवारिक मुहावरे का स्वाभाविक हिंदी रूप है; केवल ‘बिन्यामीनी’ की अपेक्षा स्रोत की वंशगत अभिव्यक्ति को अधिक स्पष्ट रखता है।
- source_word: בַּיּוֹם הַהוּא
  choice: उस दिन
  rationale: मानक और स्वाभाविक कालवाचक अभिव्यक्ति, जो संकेतवाचक बल को सुरक्षित रखती है।
- source_word: מֵהֶעָרִים
  choice: नगरों के
  rationale: यह उन नगरों को सैनिकों के स्रोत या निवास-स्थान के रूप में व्यक्त करता है। हिंदी वाक्य-विन्यास में ‘नगरों के ... पुरुष’ ‘नगरों से’ की अपेक्षा अधिक सहज है।
- source_word: עֶשְׂרִים וְשִׁשָּׁה אֶלֶף אִישׁ
  choice: छब्बीस हज़ार ... पुरुष
  rationale: संख्या और אִישׁ का सीधा रूपांतरण; सैनिक अर्थ अगली अभिव्यक्ति से स्पष्ट होता है, इसलिए ‘सैनिक’ जोड़ना आवश्यक नहीं।
- source_word: שֹׁלֵף חָרֶב
  choice: तलवार खींचनेवाले
  rationale: यह युद्ध के लिए सुसज्जित पुरुषों का मुहावरा है। चुना हुआ रूप इब्रानी की ठोस तलवार-वाली छवि को बनाए रखता है।
- source_word: לְבַד
  choice: इनके अलावा
  rationale: यह स्पष्ट करता है कि गिबा के सात सौ पुरुष पहले बताए गए छब्बीस हज़ार से अलग, अतिरिक्त दल थे।
- source_word: מִיֹּשְׁבֵי הַגִּבְעָה
  choice: गिबा के निवासियों में से
  rationale: निवाससूचक कृदंत का स्वाभाविक हिंदी रूप, जो गिबा के दल को अलग से चिह्नित करता है।
- source_word: שְׁבַע מֵאוֹת אִישׁ
  choice: सात सौ ... पुरुष
  rationale: संख्या और संज्ञा का सीधा तथा स्पष्ट अनुवाद।
- source_word: בָּחוּר
  choice: चुने हुए
  rationale: सैन्य प्रसंग और अगले पद में इन योद्धाओं की विशिष्ट दक्षता को देखते हुए यह शब्द यहाँ केवल आयु नहीं, बल्कि चयनित या श्रेष्ठ पुरुषों को सूचित करता है।
