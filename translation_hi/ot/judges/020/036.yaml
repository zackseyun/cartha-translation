source:
  edition: WLC
  text: וַ/יִּרְא֥וּ בְנֵֽי בִנְיָמִ֖ן כִּ֣י נִגָּ֑פוּ וַ/יִּתְּנ֨וּ אִֽישׁ יִשְׂרָאֵ֤ל מָקוֹם֙ לְ/בִנְיָמִ֔ן כִּ֤י בָֽטְחוּ֙ אֶל הָ֣/אֹרֵ֔ב אֲשֶׁר שָׂ֖מוּ אֶל הַ/גִּבְעָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/036.yaml
  text: So the sons of Benjamin saw that they were defeated[a]. Now the men of Israel had given place to Benjamin[b], because they trusted in the ambush that they had set against Gibeah.
translation:
  language: hi
  text: तब बिन्यामीन के लोगों ने देखा कि वे पराजित हो गए थे। इस्राएल के पुरुषों ने बिन्यामीनियों को जगह दी थी,[a] क्योंकि उन्हें उस घात पर भरोसा था जो उन्होंने गिबा के विरुद्ध लगाई थी।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “बिन्यामीन को जगह दी थी।” यहाँ इब्रानी मुहावरे का अर्थ है कि इस्राएली बिन्यामीनियों को बाहर खींचने के लिए रणनीति के तहत पीछे हटे थे।
    reason: lexical_alternative
  - marker: b
    text: या, “घात लगाकर बैठे उस दल पर भरोसा था जिसे उन्होंने गिबा में तैनात किया था।” इब्रानी शब्द אֹרֵב घात और घात लगाकर बैठे दल—दोनों को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְאוּ בְנֵי בִנְיָמִן
  choice: तब बिन्यामीनियों ने देखा
  rationale: ראה का मूल अर्थ ‘देखना’ रखा गया है; ‘बिन्यामीनियों’ आधुनिक हिन्दी में בני בנימין का स्वाभाविक सामूहिक रूप है।
- source_word: כִּי נִגָּפוּ
  choice: कि वे हार गए हैं
  rationale: निफ़ाल נגף युद्ध में पराजित होने को दर्शाता है; यह हिन्दी में सहज और प्रसंगानुकूल है।
- source_word: וַיִּתְּנוּ ... מָקוֹם לְבִנְיָמִן
  choice: बिन्यामीन के सामने जानबूझकर पीछे हटकर जगह छोड़ दी थी
  rationale: शाब्दिक ‘जगह दी’ के साथ प्रसंग में निहित रणनीतिक पीछे हटना स्पष्ट किया गया है; पूर्वकालिकता व्याख्यात्मक संबंध को दिखाती है।
- source_word: אִישׁ יִשְׂרָאֵל
  choice: इस्राएल के पुरुषों
  rationale: व्याकरणतः एकवचन रूप यहाँ सामूहिक अर्थ रखता है; युद्ध-वृत्तांत में ‘इस्राएल के पुरुष’ स्वाभाविक है।
- source_word: כִּי בָטְחוּ
  choice: क्योंकि उन्हें ... भरोसा था
  rationale: בטח का भरोसा अथवा निर्भरता का अर्थ सीधे व्यक्त होता है।
- source_word: אֶל הָאֹרֵב
  choice: उस घात पर
  rationale: אֹרֵב घात की योजना अथवा घात लगाकर बैठे दल, दोनों का बोध करा सकता है; मुख्य पाठ में संक्षिप्त ‘घात’ रखा गया है।
- source_word: אֲשֶׁר שָׂמוּ אֶל הַגִּבְעָה
  choice: जिसे उन्होंने गिबा के विरुद्ध लगाया था
  rationale: שׂים के लिए ‘लगाया’ घात के साथ स्वाभाविक है और אֶל की लक्ष्याभिमुख/विरोधी दिशा को ‘के विरुद्ध’ व्यक्त करता है।
