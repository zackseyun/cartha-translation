translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, कथात्मक और सामान्य पाठक के लिए स्पष्ट शैली। ‘जानबूझकर पीछे हटकर’ मुहावरे का सामरिक आशय स्पष्ट करता है, जबकि पादटिप्पणी अधिक शाब्दिक रूप सुरक्षित रखती है।
