source:
  edition: WLC
  text: וְ/עַתָּ֡ה תְּנוּ֩ אֶת הָ/אֲנָשִׁ֨ים בְּנֵֽי בְלִיַּ֜עַל אֲשֶׁ֤ר בַּ/גִּבְעָה֙ וּ/נְמִיתֵ֔/ם וּ/נְבַעֲרָ֥ה רָעָ֖ה מִ/יִּשְׂרָאֵ֑ל וְ/לֹ֤א אָבוּ֙ בִּנְיָמִ֔ן לִ/שְׁמֹ֕עַ בְּ/ק֖וֹל אֲחֵי/הֶ֥ם בְּנֵֽי יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/013.yaml
  text: Hand over the men[a], the sons of worthlessness, who are in Gibeah, so that we may put them to death and purge evil from Israel. But Benjamin was not willing to listen to the voice of their brothers[c][b], the sons of Israel.
translation:
  language: hi
  text: “और अब गिबा में जो दुष्ट लोग[a] हैं, उन्हें हमें सौंप दो, ताकि हम उन्हें मृत्यु-दण्ड दें और इस्राएल में से बुराई दूर करें।” परन्तु बिन्यामीन अपने भाइयों, अर्थात इस्राएलियों, की बात सुनने[b] को तैयार नहीं हुआ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: “निकम्मेपन के बेटे”; परम्परागत अनुवाद: “बेलियाल के बेटे।”'
    reason: lexical_alternative
  - marker: b
    text: “बात सुनने” का अर्थ यहाँ “ध्यान देने,” “मानने,” या “आज्ञा मानने” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: इसलिए
  rationale: וְעַתָּה यहाँ पूर्ववर्ती आरोप के आधार पर माँग की ओर संक्रमण कराता है। आधुनिक हिन्दी में ‘इसलिए’ इस निष्कर्षात्मक बल को स्वाभाविक रूप से व्यक्त करता है; केवल कालसूचक ‘अब’ पर्याप्त नहीं होगा।
- source_word: תְּנוּ
  choice: हमारे हवाले कर दो
  rationale: न्यायिक प्रसंग में क्रिया दोषियों को दण्ड के लिए सौंपने की माँग करती है, इसलिए सामान्य ‘दे दो’ की अपेक्षा यह अधिक सटीक है।
- source_word: הָאֲנָשִׁים בְּנֵי בְלִיַּעַל
  choice: उन निकम्मे लोगों
  rationale: בְּנֵי בְלִיַּעַל एक नैतिक निन्दासूचक इब्रानी मुहावरा है। ‘निकम्मे लोग’ उसका स्वाभाविक हिन्दी अर्थ देता है और ‘बेलियाल’ को अनावश्यक रूप से व्यक्तिवाचक नाम मानने से बचाता है।
- source_word: אֲשֶׁר בַּגִּבְעָה
  choice: गिबा में रहनेवाले
  rationale: सम्बन्धवाचक वाक्यांश उन लोगों को उनके स्थान से पहचानता है; ‘रहनेवाले’ हिन्दी में स्वाभाविक है, यद्यपि मूल में सामान्य ‘जो गिबा में हैं’ है।
- source_word: וּנְמִיתֵם
  choice: ताकि हम उन्हें मार डालें
  rationale: सहवाची रूप अपेक्षित अगली कार्रवाई का उद्देश्य प्रकट करता है। ‘मार डालें’ मृत्यु-दण्ड का स्पष्ट, सामान्य हिन्दी रूप है।
- source_word: וּנְבַעֲרָה רָעָה מִיִּשְׂרָאֵל
  choice: और इस्राएल में से बुराई दूर करें
  rationale: यह व्यवस्थाविवरणीय न्यायिक सूत्र समुदाय में से बुराई हटाने को व्यक्त करता है। ‘दूर करें’ हिन्दी में स्पष्ट है और मूल के शुद्धिकरणात्मक बल को बनाए रखता है।
- source_word: וְלֹא אָבוּ בִנְיָמִן
  choice: परन्तु बिन्यामीन ... तैयार नहीं हुआ
  rationale: क्रिया इच्छा या सहमति न होने को व्यक्त करती है। गोत्र को सामूहिक एकवचन मानते हुए हिन्दी में ‘तैयार नहीं हुआ’ स्वाभाविक है।
- source_word: לִשְׁמֹעַ בְּקוֹל
  choice: की बात सुनने
  rationale: शाब्दिक मुहावरे ‘आवाज़ सुनना’ का अर्थ यहाँ ध्यान देना या मानना भी हो सकता है। ‘बात सुनना’ हिन्दी में उसी अर्थ-व्याप्ति को स्वाभाविक रूप से रखता है।
- source_word: אֲחֵיהֶם בְּנֵי יִשְׂרָאֵל
  choice: अपने भाइयों—इस्राएलियों—की
  rationale: ‘अपने भाइयों’ मूल की पारिवारिक/गोत्रीय भाषा बचाता है, जबकि ‘इस्राएलियों’ अनुवर्ती समानाधिकरण בְּנֵי יִשְׂרָאֵל को स्पष्ट करता है।
theological_decisions:
- issue: בְּנֵי בְלִיַּעַל का अर्थ
  choice: निकम्मे लोग
  alternative: निकम्मेपन के बेटे; बेलियाल के बेटे
  rationale: प्रसंग में यह दुष्ट चरित्र का मुहावरेदार वर्णन है, किसी व्यक्तिगत दुष्ट सत्ता का निश्चित नाम नहीं। हिन्दी मुहावरे में अर्थ देना बाद की धार्मिक धारणा आयात करने से बचाता है।
- issue: सहवाची क्रियाओं का न्यायिक बल
  choice: ताकि हम उन्हें मार डालें और ... बुराई दूर करें
  alternative: और हम उन्हें मार डालेंगे और बुराई मिटा देंगे
  rationale: उद्देश्यसूचक रचना सभा की माँग और उसके अभिप्रेत न्यायिक परिणाम को व्यक्त करती है, बिना इसे केवल भविष्यवाणी बना देने के।
- issue: לִשְׁמֹעַ בְּקוֹל में सुनने और मानने की अर्थ-व्याप्ति
  choice: बात सुनने
  alternative: आज्ञा मानने; ध्यान देने
  rationale: चुना हुआ हिन्दी मुहावरा वास्तविक सुनने तथा आग्रह मानने—दोनों सम्भावनाओं को खुला रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण लेकिन सामान्य-पाठक-सुलभ रूप। प्रत्यक्ष कथन के उद्धरण-चिह्न जोड़े गए हैं; ‘परन्तु’ कथा के विरोध को स्पष्ट करता है। गोत्र ‘बिन्यामीन’ को मूल के समान सामूहिक एकवचन रखा गया है।
