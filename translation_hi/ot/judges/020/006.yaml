source:
  edition: WLC
  text: וָֽ/אֹחֵ֤ז בְּ/פִֽילַגְשִׁ/י֙ וָֽ/אֲנַתְּחֶ֔/הָ וָֽ/אֲשַׁלְּחֶ֔/הָ בְּ/כָל שְׂדֵ֖ה נַחֲלַ֣ת יִשְׂרָאֵ֑ל כִּ֥י עָשׂ֛וּ זִמָּ֥ה וּ/נְבָלָ֖ה בְּ/יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/006.yaml
  text: So I took hold of my concubine and cut her in pieces[a], and sent her throughout all the territory of Israel’s inheritance[c][b], because they committed lewdness and outrage in Israel.
translation:
  language: hi
  text: तब मैंने अपनी उपपत्नी को पकड़ लिया, उसके टुकड़े किए[a], और उसे इस्राएल के विरासती भूभाग में हर ओर भेज दिया[b], क्योंकि उन्होंने इस्राएल में जघन्य अनैतिकता और घोर अपमानजनक कृत्य किया था[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसके अंग-अंग काट दिए।”
    reason: lexical_alternative
  - marker: b
    text: “विरासती भूभाग” उस भूमि को दर्शाता है जो इस्राएल को विरासत के रूप में बाँटकर मिली थी। इब्रानी में “उसे” स्त्रीलिंग एकवचन है; संदर्भ में यह उसकी काटी हुई देह की ओर संकेत करता है।
    reason: cultural_note
  - marker: c
    text: “जघन्य अनैतिकता” का अनुवाद “यौन अनैतिकता,” “दुष्टता,” या “घृणित काम” भी हो सकता है; “घोर अपमानजनक कृत्य” का अनुवाद “लज्जाजनक काम” या “घृणित मूर्खता” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹחֵז
  choice: तब मैंने ... पकड़कर
  rationale: אחז का अर्थ पकड़ना या थाम लेना है। यहाँ वाव कथा को आगे बढ़ाता है, इसलिए स्वाभाविक हिन्दी में ‘तब’ रखा गया है।
- source_word: בְּפִילַגְשִׁי
  choice: अपनी उपपत्नी
  rationale: פִּילֶגֶשׁ सामाजिक रूप से मान्य, पर पत्नी से निम्न दर्जे की स्त्री को दर्शाता है; ‘उपपत्नी’ इसका संक्षिप्त और प्रचलित हिन्दी समतुल्य है।
- source_word: וָאֲנַתְּחֶהָ
  choice: उसके टुकड़े कर दिए
  rationale: נתח किसी देह को काटकर टुकड़ों में बाँटने की क्रिया बताता है। यह अनुवाद क्रिया की भयावहता को स्पष्ट रखता है।
- source_word: וָאֲשַׁלְּחֶהָ
  choice: उसके टुकड़ों को ... भेज दिया
  rationale: इब्रानी में स्त्रीलिंग एकवचन सर्वनाम, अर्थात ‘उसे’, है; किन्तु पिछले खंड के परिणाम को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करने के लिए आशयगत वस्तु ‘उसके टुकड़ों’ को कहा गया है।
- source_word: בְּכָל שְׂדֵה נַחֲלַת יִשְׂרָאֵל
  choice: इस्राएल के निज भाग के पूरे क्षेत्र में
  rationale: שׂדה यहाँ केवल खेत नहीं, विस्तृत भू-क्षेत्र को दर्शाता है। נחלה को ‘निज भाग’ कहने से इस्राएल को बाँटकर दी गई विरासती भूमि का भाव बना रहता है।
- source_word: כִּי עָשׂוּ
  choice: क्योंकि उन्होंने ... की थी
  rationale: כִּי कारण बताता है और עשה अमूर्त नैतिक संज्ञाओं के साथ ‘करना’ के अर्थ में है। पूर्वकालिक कारण को हिन्दी में ‘की थी’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: זִמָּה
  choice: यौन दुष्कर्म
  rationale: זִמָּה इस प्रसंग में यौन रूप से घोर अनैतिक और जघन्य कृत्य को सूचित करता है। ‘यौन दुष्कर्म’ इस आयाम को अनावश्यक तकनीकी अर्थ दिए बिना स्पष्ट करता है।
- source_word: וּנְבָלָה
  choice: और घोर नीचता
  rationale: נְבָלָה सामुदायिक मर्यादा को तोड़ने वाले लज्जाजनक, घृणित और मूर्खतापूर्ण कृत्य का बोध कराता है। ‘घोर नीचता’ आधुनिक हिन्दी में इसकी तीव्र नैतिक निन्दा व्यक्त करती है।
- source_word: בְּיִשְׂרָאֵל
  choice: इस्राएल में
  rationale: पूर्वसर्ग ב यहाँ स्थान और समुदाय के भीतर घटित होने का भाव देता है; इसलिए सीधा अनुवाद ‘इस्राएल में’ है।
theological_decisions:
- issue: נַחֲלַת יִשְׂרָאֵל में वाचा और भूमि-वितरण का भाव
  choice: इस्राएल के निज भाग
  alternative: इस्राएल की भूमि; इस्राएली क्षेत्र
  rationale: ‘निज भाग’ केवल भूगोल नहीं, इस्राएल को मिले बाँटे हुए विरासती भाग का भाव भी सुरक्षित रखता है।
- issue: זִמָּה וּנְבָלָה की नैतिक तीव्रता
  choice: यौन दुष्कर्म और घोर नीचता
  alternative: दुष्टता और लज्जाजनक काम; जघन्य अनैतिकता और घृणित काम
  rationale: शब्द-युग्म में यौन अनैतिकता और पूरे समुदाय की मर्यादा के विरुद्ध घोर कृत्य—दोनों भाव हैं। चुना हुआ रूप किसी बाद की तकनीकी धर्मशास्त्रीय श्रेणी को आरोपित किए बिना दोनों को व्यक्त करता है।
- issue: וָאֲשַׁלְּחֶהָ के स्त्रीलिंग एकवचन सर्वनाम का अनुवाद
  choice: उसके टुकड़ों को ... भेज दिया
  alternative: उसे ... भेज दिया
  rationale: इब्रानी का ‘उसे’ पूर्ववर्ती टुकड़े करने की क्रिया के बाद विखंडित देह की ओर संकेत करता है। हिन्दी में ‘उसके टुकड़ों’ से अभिप्राय स्पष्ट होता है, जबकि पादटिप्पणी शाब्दिक रूप सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है। वाक्य जानबूझकर सीधा और गंभीर रखा गया है, ताकि वर्णित हिंसा और नैतिक आक्रोश को न तो नरम किया जाए और न सनसनीखेज बनाया जाए। ‘उपपत्नी’ और ‘निज भाग’ जैसे शब्द पाठ की प्राचीन सामाजिक तथा वाचा-संबंधी पृष्ठभूमि को संक्षेप में बनाए रखते हैं।
