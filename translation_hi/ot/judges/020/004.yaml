  text: וַ/יַּ֜עַן הָ/אִ֣ישׁ הַ/לֵּוִ֗י אִ֛ישׁ הָ/אִשָּׁ֥ה הַ/נִּרְצָחָ֖ה וַ/יֹּאמַ֑ר הַ/גִּבְעָ֨תָ/ה֙ אֲשֶׁ֣ר לְ/בִנְיָמִ֔ן בָּ֛אתִי אֲנִ֥י וּ/פִֽילַגְשִׁ֖/י לָ/לֽוּן׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/004.yaml
  text: Then the Levite[a], the husband of the woman who had been murdered, answered and said, “I came to Gibeah, which belongs to Benjamin, I and my concubine, to spend the night.
translation:
  language: hi
  text: तब उस लेवी ने, जो उस स्त्री का पति था जिसकी हत्या कर दी गई थी, उत्तर दिया, “मैं अपनी उपपत्नी के साथ रात बिताने के लिए उस गिबा में आया था जो बिन्यामीन का है।[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बिन्यामीन में स्थित गिबा।”
    reason: אֲשֶׁר לְבִנְיָמִן गिबा के बिन्यामीन से संबंध को बताता है; इसे क्षेत्रीय स्थिति के अर्थ में भी समझा जा सकता है।
lexical_decisions:
- source_word: וַיַּעַן
  choice: उत्तर दिया
  rationale: कथात्मक प्रसंग में ענה का सामान्य अर्थ उत्तर देना है; पहले कोई स्पष्ट प्रश्न न होने पर भी इब्रानी मुहावरे को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: הָאִישׁ הַלֵּוִי
  choice: उस लेवी ने
  rationale: यह वक्ता की लेवी पहचान को संक्षिप्त और प्रचलित बाइबलीय हिन्दी में व्यक्त करता है।
- source_word: אִישׁ הָאִשָּׁה
  choice: उस स्त्री के पति
  rationale: शाब्दिक रूप से ‘स्त्री का पुरुष’ संबंधसूचक पद है; इस प्रसंग में ‘पति’ उसका स्वाभाविक हिन्दी अर्थ है।
- source_word: הַנִּרְצָחָה
  choice: जिसकी हत्या कर दी गई थी
  rationale: רצח के आपराधिक और गंभीर भाव को ‘मारे जाने’ की अपेक्षा ‘हत्या’ अधिक सटीक रूप से व्यक्त करता है।
- source_word: הַגִּבְעָתָה
  choice: गिबा में
  rationale: दिशासूचक रूप गिबा की ओर आने को बताता है; हिन्दी में ‘गिबा में आए’ स्वाभाविक गंतव्य-निर्माण है।
- source_word: אֲשֶׁר לְבִנְיָמִן
  choice: बिन्यामीन के गिबा
  rationale: यह गिबा के बिन्यामीन से क्षेत्रीय अथवा जनजातीय संबंध को संक्षिप्त और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: בָּאתִי אֲנִי וּפִילַגְשִׁי
  choice: मैं और मेरी उपपत्नी … आए थे
  rationale: स्पष्ट सर्वनाम और साथ आई स्त्री दोनों को वाक्य के संयुक्त कर्ता के रूप में रखा गया है; हिन्दी में पुल्लिंग बहुवचन क्रिया स्वाभाविक है।
- source_word: פִילֶגֶשׁ
  choice: उपपत्नी
  rationale: यह פילגש के विशिष्ट सामाजिक संबंध को ‘पत्नी’ में विलीन किए बिना हिन्दी में व्यक्त करता है।
- source_word: לָלוּן
  choice: रात बिताने के लिए
  rationale: לון का आशय रात भर ठहरना है; यह आधुनिक, स्पष्ट और अर्थनिष्ठ हिन्दी है।
