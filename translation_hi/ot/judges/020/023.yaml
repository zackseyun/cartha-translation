base_translation:
  language: en
  yaml_path: translation/ot/judges/020/023.yaml
  text: Then the sons of Israel went up and wept before Yahweh until evening[a], and they inquired of Yahweh, saying, “Shall I continue to go near for battle with the sons of Benjamin, my brother?” And Yahweh said, “Go up against him.”
translation:
  language: hi
  text: तब इस्राएल के पुत्र ऊपर गए और शाम तक यहवे के सामने रोते रहे। उन्होंने यहवे से पूछा, “क्या मैं अपने भाई बिन्यामीन के पुत्रों से युद्ध करने के लिए फिर आगे बढ़ूँ?”[a] यहवे ने कहा, “उसके विरुद्ध चढ़ाई करो।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्या मैं अपने भाई बिन्यामीन के पुत्रों से युद्ध करने के लिए आगे बढ़ता रहूँ?” हिब्रू में पुनः आक्रमण करने और आक्रमण जारी रखने—दोनों का भाव सम्भव है।
    reason: הַאוֹסִיף की वास्तविक अर्थगत अस्पष्टता को सुरक्षित रखना।
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: ऊपर गए
  rationale: עלה की दिशात्मकता को बनाए रखता है; प्रसंग में सम्भवतः उपासना अथवा पूछताछ के स्थान की ओर जाने का संकेत है, पर गंतव्य को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: בְנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्र
  rationale: हिब्रू की पारिवारिक और सामूहिक अभिव्यक्ति को औपचारिक निकटता के साथ सुरक्षित रखता है।
- source_word: וַיִּבְכּוּ
  choice: रोते रहे
  rationale: בכה के विलापपूर्ण भाव और शाम तक जारी क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לִפְנֵי יְהוָה
  choice: यहवे के सामने
  rationale: לִפְנֵי का सीधा अर्थ सुरक्षित है और יְהוָה को उसके व्यक्तिगत वाचा-नाम ‘यहवे’ से प्रस्तुत किया गया है।
- source_word: וַיִּשְׁאֲלוּ בַיהוָה
  choice: उन्होंने यहवे से पूछा
  rationale: यहाँ שׁאל ב־ ईश्वरीय मार्गदर्शन जानने के लिए पूछने का बोध देता है; सरल हिन्दी में यही भाव स्पष्ट है।
- source_word: הַאוֹסִיף לָגֶשֶׁת
  choice: क्या मैं ... फिर आगे बढ़ूँ
  rationale: प्रश्न में क्रिया एकवचन है, यद्यपि सामूहिक वक्ता बहुवचन है। יסף पुनः करने अथवा जारी रखने, दोनों का संकेत दे सकता है; मुख्य पाठ में ‘फिर’ पूर्व आक्रमण के प्रसंग के अनुकूल है। נגשׁ को युद्ध हेतु आगे बढ़ने के रूप में स्वाभाविक बनाया गया है।
- source_word: עִם בְּנֵי בִנְיָמִן
  choice: बिन्यामीन के पुत्रों से
  rationale: עִם मूलतः ‘साथ’ है, पर युद्ध के प्रसंग में हिन्दी का ‘से युद्ध करना’ विरोधी संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אָחִי
  choice: अपने भाई
  rationale: एकवचन और आत्मीय संबोधन को बनाए रखता है; सामूहिक इस्राएल बिन्यामीन को अपना भाई मानकर बोलता है।
- source_word: עֲלוּ אֵלָיו
  choice: उसके विरुद्ध चढ़ाई करो
  rationale: עלה की चढ़ने की छवि और सैन्य प्रसंग में אֶל के विरोधात्मक आशय, दोनों को व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहवे
  alternative: यहोवा / प्रभु
  rationale: हिब्रू पाठ में वाचा-नाम सीधे उपस्थित है; ‘यहवे’ उसका निकट देवनागरी लिप्यंतरण है और सामान्य उपाधि से उसे प्रतिस्थापित नहीं करता।
- issue: सामूहिक बहुवचन विषय के साथ प्रथम पुरुष एकवचन אָחִי और הַאוֹסִיף
  choice: ‘क्या मैं’ और ‘अपने भाई’
  alternative: ‘क्या हम’ और ‘अपने भाइयों’
  rationale: मसोरेटिक पाठ में दोनों रूप प्रथम पुरुष एकवचन हैं। हिन्दी में असामान्यता रहने पर भी सामूहिक इस्राएल की एक व्यक्ति की तरह वाणी को सुरक्षित रखा गया है।
- issue: הַאוֹסִיף की कालगत अस्पष्टता
  choice: फिर
  alternative: जारी रखूँ
  rationale: पिछली लड़ाई के बाद पुनः आक्रमण का प्रसंग ‘फिर’ का समर्थन करता है, पर हिब्रू निरंतरता भी व्यक्त कर सकता है; इसे पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज कथात्मक रूप अपनाया गया है। ‘इस्राएल के पुत्र’ और प्रथम पुरुष एकवचन जैसे औपचारिक तत्व मूल की पारिवारिक-सामूहिक संरचना और तनाव को बचाते हैं; सैन्य वाक्यांशों को स्वाभाविक हिन्दी में रखा गया है।
