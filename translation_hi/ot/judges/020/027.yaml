source:
  edition: WLC
  text: וַ/יִּשְׁאֲל֥וּ בְנֵֽי יִשְׂרָאֵ֖ל בַּֽ/יהוָ֑ה וְ/שָׁ֗ם אֲרוֹן֙ בְּרִ֣ית הָ/אֱלֹהִ֔ים בַּ/יָּמִ֖ים הָ/הֵֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/027.yaml
  text: And the sons of Israel inquired of Yahweh—for the ark of the covenant of God was there in those days—[a][b]
translation:
  language: hi
  text: इस्राएलियों ने यहोवा से पूछा—क्योंकि उन दिनों परमेश्वर की वाचा का संदूक वहीं था।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “इस्राएल के पुत्रों ने।” यहाँ यह पद पूरे इस्राएली समुदाय के लिए है।
    reason: lexical_alternative
  - marker: b
    text: “क्योंकि उन दिनों परमेश्वर की वाचा का संदूक वहीं था” वाला खंड उनके यहोवा से पूछने की परिस्थिति बताता है।
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁאֲלוּ
  choice: पूछा
  rationale: שׁאל के साथ ב और ईश्वरीय नाम यहाँ मार्गदर्शन जानने के लिए परमेश्वर से विधिवत पूछने का भाव रखते हैं। हिंदी में ‘यहोवा से पूछा’ स्वाभाविक है और प्रसंग में धार्मिक परामर्श का अर्थ स्पष्ट रहता है।
- source_word: בְנֵי יִשְׂרָאֵל
  choice: इस्राएलियों
  rationale: शाब्दिक अर्थ ‘इस्राएल के पुत्र’ है, पर कथा में यह पूरे इस्राएली समुदाय का सामूहिक नाम है; ‘इस्राएलियों’ आधुनिक हिंदी में स्वाभाविक और अर्थसटीक है।
- source_word: בַּיהוָה / יְהוָה
  choice: यहोवा से
  rationale: ב के साथ שׁאל का अर्थ यहाँ ‘से पूछना/परामर्श लेना’ है। यְהוָה को उपाधि से बदलने के बजाय प्रचलित हिंदी लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है।
- source_word: וְשָׁם
  choice: —क्योंकि ... वहीं था
  rationale: यह खंड पूछताछ की परिस्थिति समझाने वाली अंतःस्थ टिप्पणी है। डैश और ‘क्योंकि’ उसके व्याख्यात्मक संबंध को स्वाभाविक हिंदी में स्पष्ट करते हैं।
- source_word: אֲרוֹן בְּרִית הָאֱלֹהִים
  choice: परमेश्वर की वाचा का संदूक
  rationale: यह निकट और स्वाभाविक हिंदी संरचना है, जो संदूक, वाचा और परमेश्वर—तीनों संबंधों को सुरक्षित रखती है।
- source_word: בַּיָּמִים הָהֵם
  choice: उन दिनों
  rationale: यह हिब्रू कालवाचक मुहावरे का मानक और सहज हिंदी रूप है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में चतुरक्षरीय व्यक्तिगत नाम सीधे प्रयुक्त है। हिंदी बाइबल परंपरा में व्यापक रूप से पहचाने जाने वाले ‘यहोवा’ को रखा गया है; ‘याहवे’ अधिक अकादमिक लिप्यंतरण है, पर उच्चारण का पूर्ण निश्चय नहीं है।
translation_notes:
  register: आधुनिक मानक हिंदी; सहज, गरिमापूर्ण कथात्मक शैली। ‘वाचा का संदूक’ स्थापित बाइबलीय पदावली के रूप में रखा गया है। व्याख्यात्मक खंड को डैश से अलग किया गया है, और सभी पादटिप्पणी-चिह्न मुख्य पाठ में दिए गए हैं।
