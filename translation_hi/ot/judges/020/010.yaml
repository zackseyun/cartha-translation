source:
  edition: WLC
  text: וְ/לָקַ֣חְנוּ עֲשָׂרָה֩ אֲנָשִׁ֨ים לַ/מֵּאָ֜ה לְ/כֹ֣ל שִׁבְטֵ֣י יִשְׂרָאֵ֗ל וּ/מֵאָ֤ה לָ/אֶ֨לֶף֙ וְ/אֶ֣לֶף לָ/רְבָבָ֔ה לָ/קַ֥חַת צֵדָ֖ה לָ/עָ֑ם לַ/עֲשׂ֗וֹת לְ/בוֹאָ/ם֙ לְ/גֶ֣בַע בִּנְיָמִ֔ן כְּ/כָל הַ֨/נְּבָלָ֔ה אֲשֶׁ֥ר עָשָׂ֖ה בְּ/יִשְׂרָאֵֽל׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/010.yaml
  text: And we will take ten men out of a hundred from all the tribes of Israel[a], and a hundred out of a thousand, and a thousand out of ten thousand, to get provisions for the people, so that when they come to Gibeah of Benjamin[b], they may do according to all the outrage that it committed in Israel.
translation:
  language: hi
  text: और हम इस्राएल के सभी गोत्रों में से हर सौ में से दस पुरुष, हर हज़ार में से सौ, और हर दस हज़ार में से एक हज़ार चुनेंगे, ताकि वे लोगों के लिए रसद लें। फिर जब वे बिन्यामीन के गिबा पहुँचें, तो वे उस सारे घोर दुष्कर्म[b] के अनुसार कार्रवाई करें[a], जो इस्राएल में किया गया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से भाव है, “उनके बिन्यामीन के गिबा पहुँचने पर करने के लिए।” यह एक संक्षिप्त अभिव्यक्ति है, जिसका आशय वहाँ पहुँचकर कार्रवाई करना है।
    reason: मूल की संक्षिप्त वाक्य-रचना को स्पष्ट करना
  - marker: b
    text: इस इब्रानी शब्द का अर्थ अत्यंत लज्जाजनक, घिनौना और नैतिक रूप से चौंकाने वाला काम है।
    reason: महत्त्वपूर्ण शाब्दिक अर्थ और वैकल्पिक अभिव्यक्ति स्पष्ट करना
lexical_decisions:
- source_word: וְלָקַחְנוּ
  choice: और हम ... चुनेंगे
  rationale: संयोजक के साथ आया पूर्ण क्रियारूप सभा की भावी योजना को व्यक्त करता है; हिन्दी में भविष्यकाल और ‘चुनेंगे’ आनुपातिक चयन का भाव स्वाभाविक रूप से देते हैं।
- source_word: עֲשָׂרָה אֲנָשִׁים לַמֵּאָה ... וּמֵאָה לָאֶלֶף וְאֶלֶף לָרְבָבָה
  choice: हर सौ पुरुषों में दस, हर हज़ार में सौ और हर दस हज़ार में एक हज़ार पुरुष
  rationale: यह आनुपातिक चयन की क्रमिक संख्यात्मक रचना को स्पष्ट और स्रोत के निकट रखता है।
- source_word: לְכֹל שִׁבְטֵי יִשְׂרָאֵל
  choice: इस्राएल के सभी गोत्रों में से
  rationale: संदर्भ में पुरुष समस्त गोत्रों से चुने जा रहे हैं; ‘में से’ उस स्रोत-समूह को स्पष्ट करता है।
- source_word: לָקַחַת צֵדָה לָעָם
  choice: लोगों के लिए रसद ले आएँ
  rationale: צֵדָה अभियान या यात्रा के लिए आवश्यक भोजन-सामग्री और अन्य आपूर्ति को दर्शाता है; ‘रसद’ सैन्य संदर्भ में संक्षिप्त और उपयुक्त है, जबकि לָעָם के लिए व्यापक ‘लोगों’ को बनाए रखा गया है।
- source_word: לַעֲשׂוֹת לְבוֹאָם
  choice: जब लोग ... पहुँचें, तो वे ... कार्रवाई करें
  rationale: इब्रानी की संक्षिप्त उद्देश्यसूचक रचना को सहज हिन्दी में खोला गया है, बिना कार्रवाई के स्वरूप को अनावश्यक रूप से निश्चित किए।
- source_word: לְגֶבַע בִּנְיָמִן
  choice: बिन्यामीन के गिबा पहुँचें
  rationale: दिशासूचक भाव को ‘पहुँचें’ से रखा गया है; ‘बिन्यामीन का गिबा’ नगर को गोत्रीय क्षेत्र से जोड़ता है।
- source_word: כְּכָל הַנְּבָלָה
  choice: उस सारे घोर दुष्कर्म के अनुसार
  rationale: נְבָלָה यहाँ मूर्खता मात्र नहीं, बल्कि अत्यंत लज्जाजनक और नैतिक रूप से जघन्य कृत्य है; ‘घोर दुष्कर्म’ उसका नैतिक भार रखता है।
- source_word: אֲשֶׁר עָשָׂה בְּיִשְׂרָאֵל
  choice: वहाँ किए गए
  rationale: इब्रानी क्रिया पुल्लिंग एकवचन है और कर्ता व्याकरणतः संक्षिप्त/अस्पष्ट है। हिन्दी का निष्क्रिय प्रयोग घटना को गिबा और इस्राएल के संदर्भ से जोड़ता है, पर किसी एक अपराधी या पूरे नगर को चुपचाप निश्चित नहीं करता।
theological_decisions:
- issue: נְבָלָה के नैतिक भार को बिना किसी बाद की धर्मवैज्ञानिक श्रेणी के व्यक्त करना
  choice: घोर दुष्कर्म
  alternative: लज्जाजनक काम; घिनौना कृत्य; मूर्खता
  rationale: ‘घोर दुष्कर्म’ साधारण भूल या मूर्खता से अधिक, इस प्रसंग के चौंकाने वाले नैतिक अपराध को व्यक्त करता है, पर स्रोत से बाहर का तकनीकी धार्मिक शब्द नहीं जोड़ता।
- issue: אֲשֶׁר עָשָׂה में अपराध के कर्ता की अस्पष्टता
  choice: वहाँ किए गए
  alternative: जो उसने इस्राएल में किया था
  rationale: मूल में एकवचन कर्ता का संकेत है, पर उसका संदर्भ गिबा नगर, सामूहिक अपराधी पक्ष या किसी व्यक्ति की ओर समझा जा सकता है। निष्क्रिय हिन्दी इस वास्तविक अस्पष्टता को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सामान्य-पाठक-सुलभ शैली रखी गई है। संख्यात्मक अनुपात को दोहराकर स्पष्ट किया गया है। ‘रसद’ सैन्य अभियान के प्रसंग में स्वाभाविक है। मूल की संक्षिप्त अंतिम रचना को मुख्य पाठ में सहज बनाया गया है और पादटिप्पणी में उसका शाब्दिक स्वरूप दिया गया है।
