  to: परन्तु इस्राएल के लोग, अर्थात् इस्राएली पुरुष, हिम्मत बाँधकर फिर उस स्थान पर युद्ध के लिए पंक्तिबद्ध हुए, जहाँ वे पहले दिन पंक्तिबद्ध हुए थे।[a]
