base_translation:
  language: en
  yaml_path: translation/ot/judges/020/022.yaml
  text: But the people[a], the men of Israel, strengthened themselves and again drew up for battle in the place where they had drawn up on the first day.
translation:
  language: hi
  text: परन्तु इस्राएल के लोग, अर्थात् इस्राएली पुरुष, हिम्मत बाँधकर फिर उस स्थान पर युद्ध के लिए पंक्तिबद्ध हुए, जहाँ वे पहले दिन पंक्तिबद्ध हुए थे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपने को दृढ़ किया।” इब्रानी शब्द पराजय के बाद नए सिरे से दृढ़ निश्चय करने या साहस पाने का भाव भी व्यक्त कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְחַזֵּק
  choice: अपने आप को दृढ़ किया
  rationale: हित्पएल रूप आत्मवाचक/अकर्मक भाव में पराजय के बाद फिर से दृढ़ होने या साहस जुटाने को व्यक्त करता है। यह चयन मूल के आत्मवाचक भाव को बनाए रखता है; वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: הָעָם אִישׁ יִשְׂרָאֵל
  choice: इस्राएल के लोगों, अर्थात् इस्राएली पुरुषों
  rationale: मूल का समूहवाचक 'लोग' और उसके साथ स्पष्टीकरण रूप में आया 'इस्राएल के पुरुष'—दोनों सुरक्षित रखे गए हैं, जिससे युद्ध में सम्मिलित पुरुषों का संदर्भ स्पष्ट होता है और 'सेना' जैसा अधिक व्याख्यात्मक शब्द नहीं जोड़ा जाता।
- source_word: וַיֹּסִפוּ
  choice: फिर
  rationale: आगे आए धातुरूप के साथ यह कार्य की पुनरावृत्ति या पुनः आरम्भ को दर्शाता है। आधुनिक हिन्दी में 'फिर' इसका सहज और सटीक रूप है।
- source_word: לַעֲרֹךְ מִלְחָמָה
  choice: युद्ध के लिए पाँत बाँधी
  rationale: ערך और מלחמה का संयोजन युद्ध-विन्यास या युद्ध-पंक्ति बनाने को सूचित करता है। 'पाँत बाँधी' सैन्य गठन का बोध कराता है और केवल सामान्य तैयारी कहने से अधिक विशिष्ट है।
- source_word: בַּמָּקוֹם
  choice: उसी स्थान पर
  rationale: स्थानवाचक अभिव्यक्ति को स्वाभाविक हिन्दी में रखा गया है; 'उसी' अगले संबंधवाचक उपवाक्य में बताए गए पहले दिन के स्थान से पहचान स्पष्ट करता है।
- source_word: אֲשֶׁר עָרְכוּ שָׁם
  choice: जहाँ उन्होंने ... पाँत बाँधी थी
  rationale: उसी सैन्य धातु की पुनरावृत्ति हिन्दी में भी समान पदावली से रखी गई है। पूर्वकालिक घटना के लिए 'थी' प्रयुक्त है।
- source_word: בַּיּוֹם הָרִאשׁוֹן
  choice: पहले दिन
  rationale: यह पूर्व युद्ध-विन्यास के समय को सीधे और स्वाभाविक ढंग से व्यक्त करता है।
