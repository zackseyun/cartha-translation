  text: וַ/יִּפְנ֞וּ לִ/פְנֵ֨י אִ֤ישׁ יִשְׂרָאֵל֙ אֶל דֶּ֣רֶךְ הַ/מִּדְבָּ֔ר וְ/הַ/מִּלְחָמָ֖ה הִדְבִּיקָ֑תְ/הוּ וַ/אֲשֶׁר֙ מֵ/הֶ֣/עָרִ֔ים מַשְׁחִיתִ֥ים אוֹת֖/וֹ בְּ/תוֹכֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/042.yaml
  text: So they turned before the men of Israel toward the way of the wilderness[a], but the battle overtook them[c][b]; and those from the cities were destroying them in their midst.
translation:
  language: hi
  text: तब वे इस्राएली पुरुषों के सामने से मुड़कर निर्जन प्रदेश के मार्ग की ओर गए, पर युद्ध ने उन्हें आ पकड़ा[a]; और नगरों से आए लोग उनके बीच ही उनका संहार कर रहे थे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पर लड़ाई ने उन्हें जा पकड़ा।”
    reason: lexical_alternative
  - marker: b
    text: अंतिम उपवाक्य का इब्रानी पाठ संक्षिप्त और कठिन है। संभवतः आशय उन इस्राएली दलों से है जो नगरों या घात लगाने के स्थानों से निकलकर बिन्यामीनियों को उनके बीच से मार रहे थे।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּפְנוּ לִפְנֵי אִישׁ יִשְׂרָאֵל
  choice: वे इस्राएली पुरुषों के सामने से मुड़कर ... भागे
  rationale: פנה का मूल बिंब ‘मुड़ना’ है, जबकि युद्ध-संदर्भ और ‘सामने से’ पीछे हटने या भागने का भाव देते हैं। संयुक्त हिंदी अभिव्यक्ति मूल बिंब और प्रसंगगत गति दोनों को स्पष्ट रखती है।
- source_word: אֶל דֶּרֶךְ הַמִּדְבָּר
  choice: निर्जन प्रदेश के मार्ग की ओर
  rationale: דֶּרֶךְ को ‘मार्ग’ और מִדְבָּר को यहाँ आबादी से बाहर के निर्जन क्षेत्र के अर्थ में लिया गया है; यह आधुनिक हिंदी में स्वाभाविक और भौगोलिक रूप से खुला है।
- source_word: וְהַמִּלְחָמָה הִדְבִּיקָתְהוּ
  choice: पर युद्ध ने उन्हें आ पकड़ा
  rationale: הדביק का हिफ़ील रूप पीछा करते हुए जा पकड़ने का अर्थ देता है। ‘युद्ध’ को कर्ता बनाए रखना इब्रानी की सजीव छवि को सुरक्षित रखता है; सामूहिक एकवचन प्रत्यय का हिंदी में स्वाभाविक बहुवचन ‘उन्हें’ किया गया है।
- source_word: וַאֲשֶׁר מֵהֶעָרִים
  choice: और नगरों से आए लोग
  rationale: मूल वाक्यांश संक्षिप्त और लुप्त-पद वाला है। ‘आए लोग’ न्यूनतम पूर्ति द्वारा नगरों से संबंधित हमलावर समूह का संकेत देता है, बिना उनकी ठीक पहचान को अनावश्यक रूप से निश्चित किए।
- source_word: מַשְׁחִיתִים אֹתוֹ
  choice: उनका संहार कर रहे थे
  rationale: שׁחת का यह रूप युद्ध में विनाशकारी हत्या को दर्शाता है। ‘संहार’ गंभीर सैन्य संदर्भ के अनुकूल है; सामूहिक एकवचन कर्म को हिंदी में बहुवचन रूप दिया गया है।
- source_word: בְּתוֹכוֹ
  choice: उनके बीच ही
  rationale: एकवचन प्रत्यय सामूहिक सेना की ओर संकेत करता है। ‘उनके बीच ही’ भीतर या मध्य में हो रहे प्रहार का सामरिक भाव देता है, पर उसकी सटीक व्यवस्था को तय नहीं करता।
