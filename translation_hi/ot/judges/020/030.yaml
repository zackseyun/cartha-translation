language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יַּעֲל֧וּ בְנֵֽי יִשְׂרָאֵ֛ל אֶל בְּנֵ֥י בִנְיָמִ֖ן בַּ/יּ֣וֹם הַ/שְּׁלִישִׁ֑י וַ/יַּעַרְכ֥וּ אֶל הַ/גִּבְעָ֖ה כְּ/פַ֥עַם בְּ/פָֽעַם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/030.yaml
  text: Then the sons of Israel went up against the sons of Benjamin on the third day[a], and they drew up against Gibeah as before.
translation:
  language: hi
  text: तीसरे दिन इस्राएल के पुत्रों ने बिन्यामीन के पुत्रों के विरुद्ध चढ़ाई की और पहले की तरह गिबा के सामने युद्ध के लिए पंक्तिबद्ध हो गए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: चढ़ाई की
  rationale: עלה का मूल भाव ‘ऊपर जाना/चढ़ना’ है; युद्ध के संदर्भ में ‘चढ़ाई की’ सैन्य आगे बढ़ने का स्वाभाविक हिन्दी रूप है और अनावश्यक भौगोलिक विवरण नहीं जोड़ता।
- source_word: בְנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों
  rationale: शाब्दिक संबंध-सूचक अभिव्यक्ति को बनाए रखने से दोनों पक्षों के लिए प्रयुक्त समानांतर भाषा और गृहयुद्ध का तनाव सुरक्षित रहता है।
- source_word: אֶל בְּנֵי בִנְיָמִן
  choice: बिन्यामीन के पुत्रों के विरुद्ध
  rationale: אֶל का मूल अर्थ ‘की ओर’ है, पर युद्ध-संदर्भ में शत्रुतापूर्ण अग्रसरता को हिन्दी में ‘के विरुद्ध’ स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: तीसरे दिन
  rationale: समय-सूचक पदबंध का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: וַיַּעַרְכוּ
  choice: युद्ध के लिए पंक्तिबद्ध हो गए
  rationale: ערך का यहाँ अर्थ सेना को युद्ध-विन्यास में लगाना है; यह रूप सैन्य अर्थ को सामान्य पाठक के लिए स्पष्ट करता है।
- source_word: אֶל הַגִּבְעָה
  choice: गिबा के सामने
  rationale: सैन्य विन्यास के साथ אֶל स्थान की ओर/उसके सम्मुख तैनाती बताता है; ‘के सामने’ स्थानिक संबंध को सुरक्षित रखता है, जबकि ‘के विरुद्ध’ की अनावश्यक पुनरावृत्ति से बचता है।
- source_word: כְּפַעַם בְּפָעַם
  choice: पहले की तरह
  rationale: हिब्रू मुहावरे का संक्षिप्त, सहज हिन्दी अर्थ ‘जैसा पिछली बारों में’ है; ‘पहले की तरह’ वही भाव स्वाभाविक रूप से देता है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए स्पष्ट। ‘इस्राएल के पुत्रों’ और ‘बिन्यामीन के पुत्रों’ को जानबूझकर बनाए रखा गया है ताकि मूल की समानांतर संबंध-सूचक शब्दावली और एक ही व्यापक वंश के भीतर संघर्ष का प्रभाव बना रहे।
