  text: Then all the people rose up as one man, saying, “Not one of us will go to his tent, and not one of us will turn aside to his house.”
translation:
  language: hi
  text: तब सब लोग एकजुट होकर उठ खड़े हुए और कहने लगे, “हममें से कोई भी अपने तंबू की ओर नहीं जाएगा, और न ही कोई अपने घर की ओर मुड़ेगा।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְּאִישׁ אֶחָד
  choice: एक मन होकर
  rationale: शाब्दिक अर्थ ‘एक मनुष्य के समान’ है; यहाँ मुहावरा लोगों की पूर्ण एकता और सामूहिक संकल्प व्यक्त करता है। आधुनिक हिन्दी में ‘एक मन होकर’ यही भाव स्वाभाविक और स्पष्ट रूप से देता है।
- source_word: נָסוּר
  choice: मुड़ेगा
  rationale: मूल क्रिया का अर्थ मुड़ना अथवा मार्ग छोड़कर किसी ओर जाना है। ‘घर की ओर मुड़ेगा’ इस गतिशील अर्थ को बनाए रखता है।
- source_word: אֹהֳלוֹ / בֵּיתוֹ
  choice: अपने तंबू / अपने घर
  rationale: दोनों अलग संज्ञाओं को मूल पाठ के समान बनाए रखा गया है; उन्हें एक ही सामान्य शब्द में नहीं मिलाया गया।
