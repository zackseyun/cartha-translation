reference: Judges 20:26
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יַּעֲל֣וּ כָל בְּנֵי֩ יִשְׂרָאֵ֨ל וְ/כָל הָ/עָ֜ם וַ/יָּבֹ֣אוּ בֵֽית אֵ֗ל וַ/יִּבְכּוּ֙ וַ/יֵּ֤שְׁבוּ שָׁם֙ לִ/פְנֵ֣י יְהוָ֔ה וַ/יָּצ֥וּמוּ בַ/יּוֹם הַ/ה֖וּא עַד הָ/עָ֑רֶב וַֽ/יַּעֲל֛וּ עֹל֥וֹת וּ/שְׁלָמִ֖ים לִ/פְנֵ֥י יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/026.yaml
  text: Then all the sons of Israel and all the people went up and came to Bethel[a], and they wept and sat there before Yahweh and fasted that day until evening[b]. Then they offered up burnt offerings and peace offerings before Yahweh.
translation:
  language: hi
  text: तब इस्राएल के सभी पुत्र और सारे लोग[a] चढ़कर बेतेल आए। वे रोए और वहाँ याहवे के सामने बैठे रहे। उन्होंने उस दिन शाम तक उपवास किया और याहवे के सामने होमबलियाँ और मेलबलियाँ[b] चढ़ाईं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सभी इस्राएली और सारे लोग।”
    reason: इब्रानी में ‘इस्राएल के सभी पुत्र और सारे लोग’ है; दूसरा पद पहले पद पर जोर देने वाला या उसकी व्याख्या करने वाला हो सकता है।
  - marker: b
    text: या, “सहभागिता-बलियाँ।”
    reason: שְׁלָמִים के लिए यह वैकल्पिक अनुवाद बलि से जुड़ी संगति और साझा भोज के पहलू को उभारता है।
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: चढ़कर
  rationale: עלה यात्रा के संदर्भ में ऊपर की ओर जाने का भाव रखता है; ‘चढ़कर’ इस दिशात्मक अर्थ को स्वाभाविक हिंदी में बनाए रखता है।
- source_word: כָל בְּנֵי יִשְׂרָאֵל וְכָל הָעָם
  choice: इस्राएल के सभी पुत्र और सारे लोग
  rationale: यह रूप בני ישראל की पारिवारिक-राष्ट्रीय अभिव्यक्ति और उसके बाद आए जोरदार/व्याख्यात्मक ‘सारे लोग’—दोनों को बिना मिलाए सुरक्षित रखता है।
- source_word: בֵית אֵל
  choice: बेतेल
  rationale: स्थान-नाम का प्रचलित हिंदी लिप्यंतरण अपनाया गया है; इसे अर्थानुवाद करके ‘परमेश्वर का घर’ नहीं बनाया गया।
- source_word: וַיִּבְכּוּ
  choice: वे रोए
  rationale: यह पराजय, शोक और उपासना के प्रसंग में व्यक्त विलाप का सीधा और स्वाभाविक अनुवाद है।
- source_word: וַיֵּשְׁבוּ שָׁם לִפְנֵי יְהוָה
  choice: वहाँ याहवे के सामने बैठे रहे
  rationale: ישב के ठोस ‘बैठना’ और कुछ समय तक उसी अवस्था में रहने—दोनों भावों को ‘बैठे रहे’ व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम का हिंदी लिप्यंतरण किया गया है, उसे किसी उपाधि से नहीं बदला गया।
- source_word: וַיָּצ֥וּמוּ
  choice: उपवास किया
  rationale: צום शोक या भक्ति के कारण भोजन से विरत रहने को दर्शाता है; ‘उपवास किया’ इसका मानक हिंदी रूप है।
- source_word: בַיּוֹם הַהוּא עַד הָעָרֶב
  choice: उस दिन शाम तक
  rationale: यह इब्रानी में दी गई समय-सीमा को संक्षिप्त और स्वाभाविक आधुनिक हिंदी में व्यक्त करता है।
- source_word: וַיַּעֲלוּ עֹלוֹת
  choice: होमबलियाँ चढ़ाईं
  rationale: बलिदान के संदर्भ में עלה का यह प्रयोग अर्पित करने को दर्शाता है; ‘चढ़ाईं’ हिंदी धार्मिक भाषा में स्वाभाविक है।
- source_word: שְׁלָמִים
  choice: मेलबलियाँ
  rationale: यह שלמים का पारंपरिक और संक्षिप्त बलिदानी पद है; वैकल्पिक ‘सहभागिता-बलियाँ’ इसके सामुदायिक पक्ष को अधिक स्पष्ट करता है।
theological_decisions:
- issue: वाचा के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम सीधे आया है। ‘याहवे’ प्रचलित विद्वत्तापूर्ण पुनर्निर्माण का हिंदी लिप्यंतरण है और नाम को ‘प्रभु’ जैसी उपाधि से नहीं बदलता।
- issue: בני ישראל का लिंगयुक्त राष्ट्रीय पद
  choice: इस्राएल के सभी पुत्र
  alternative: सभी इस्राएली
  rationale: मुख्य पाठ में इब्रानी की पुत्र-संबंधी पारिवारिक अभिव्यक्ति सुरक्षित रखी गई है, जबकि अधिक सहज राष्ट्रीय पद को पादटिप्पणी में दिया गया है।
- issue: שלמים बलियों की प्रकृति
  choice: मेलबलियाँ
  alternative: सहभागिता-बलियाँ
  rationale: ‘मेलबलियाँ’ मूल पद की पारंपरिक व्यापकता बनाए रखता है; ‘सहभागिता-बलियाँ’ उसके एक महत्त्वपूर्ण पहलू को स्पष्ट करता है, पर कुछ अधिक व्याख्यात्मक है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘होमबलियाँ’ और ‘मेलबलियाँ’ जैसे स्थापित बाइबलीय बलिदानी पद बनाए गए हैं। छोटे वाक्यों से सामूहिक शोक, उपवास और बलिदान का क्रम स्पष्ट किया गया है।
