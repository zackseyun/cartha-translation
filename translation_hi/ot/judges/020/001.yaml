source:
  edition: WLC
  text: וַ/יֵּצְאוּ֮ כָּל בְּנֵ֣י יִשְׂרָאֵל֒ וַ/תִּקָּהֵ֨ל הָ/עֵדָ֜ה כְּ/אִ֣ישׁ אֶחָ֗ד לְ/מִ/דָּן֙ וְ/עַד בְּאֵ֣ר שֶׁ֔בַע וְ/אֶ֖רֶץ הַ/גִּלְעָ֑ד אֶל יְהוָ֖ה הַ/מִּצְפָּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/001.yaml
  text: Then all the sons of Israel came out[a], and the congregation assembled as one man, from Dan to Beer-sheba, and from the land of Gilead[c][b], to Yahweh at Mizpah.
translation:
  language: hi
  text: तब सारे इस्राएली[a] निकल पड़े, और दान से लेकर बेर्शेबा तक तथा गिलाद देश से सारी सभा एक मनुष्य की तरह[b] मिस्पा में याहवे के पास[c] इकट्ठी हुई।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, ‘इस्राएल के सब पुत्र’; यह अभिव्यक्ति यहाँ केवल पुरुषों को नहीं, बल्कि इस्राएली समुदाय को सामूहिक रूप से सूचित करती है।
    reason: lexical_alternative
  - marker: b
    text: हिब्रू में, ‘एक मनुष्य की तरह’; अर्थात् एकमत और एकजुट होकर।
    reason: lexical_alternative
  - marker: c
    text: या, ‘मिस्पा में याहवे के सामने।’ हिब्रू शब्दों को इस अर्थ में भी समझा जा सकता है कि सभा मिस्पा में याहवे की उपस्थिति में एकत्र हुई।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּצְאוּ
  choice: निकल पड़े
  rationale: יצא के मूल अर्थ ‘बाहर निकलना/जाना’ को स्वाभाविक हिन्दी कथन में व्यक्त करता है और सभा के लिए विभिन्न क्षेत्रों से चल पड़ने का भाव देता है।
- source_word: כָּל בְּנֵי יִשְׂרָאֵל
  choice: सारे इस्राएली
  rationale: शाब्दिक रूप ‘इस्राएल के सब पुत्र’ है, पर यहाँ पदबंध पूरे इस्राएली समुदाय के लिए सामूहिक रूप से प्रयुक्त हुआ है। ‘सारे इस्राएली’ आधुनिक हिन्दी में अर्थ को स्पष्ट रखता है; शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: וַתִּקָּהֵל הָעֵדָה
  choice: सारी सभा ... इकट्ठी हुई
  rationale: עֵדָה संगठित समुदाय अथवा सभा को दर्शाता है और קהל का यह रूप उसके एकत्र होने को। यह चयन अनावश्यक रूप से केवल धार्मिक उपासना-सभा का अर्थ नहीं जोड़ता।
- source_word: כְּאִישׁ אֶחָד
  choice: एक मनुष्य के समान
  rationale: हिब्रू का चित्रात्मक मुहावरा सुरक्षित रखा गया है; इसका आशय एकमत और एकजुट होकर कार्य करना है, जिसे पादटिप्पणी स्पष्ट करती है।
- source_word: לְמִדָּן וְעַד בְּאֵר שֶׁבַע
  choice: दान से लेकर बेर्शेबा तक
  rationale: यह इस्राएल के उत्तर से दक्षिण तक के भूभाग को सूचित करने वाला प्रचलित भौगोलिक युग्म है। हिन्दी में ‘से लेकर ... तक’ इसकी सीमा को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וְאֶרֶץ הַגִּלְעָד
  choice: और गिलाद देश से भी
  rationale: यह यरदन-पार गिलाद को दान–बेर्शेबा की सीमा के अतिरिक्त प्रतिनिधित्व वाले क्षेत्र के रूप में जोड़ता है। ‘से भी’ इस संबंध को हिन्दी में स्पष्ट करता है।
- source_word: אֶל יְהוָה
  choice: याहवे के सामने
  rationale: אֶל का मूल अर्थ ‘की ओर/के पास’ है, पर सभा के संदर्भ में यह याहवे की उपस्थिति में एकत्र होने का भाव दे सकता है। मुख्य पाठ में स्वाभाविक संदर्भगत अर्थ रखा गया है और अधिक शाब्दिक संभावना पादटिप्पणी में सुरक्षित है।
- source_word: הַמִּצְפָּה
  choice: मिस्पा में
  rationale: स्थाननाम को हिन्दी में प्रचलित रूप ‘मिस्पा’ से लिप्यंतरित किया गया है; ‘में’ सभा के मिलने का स्थान स्पष्ट करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत वाचा-नाम सीधे आया है। ‘याहवे’ उसका लिप्यंतरण करता है और उसे केवल उपाधि में नहीं बदलता।
- issue: אֶל יְהוָה הַמִּצְפָּה का संबंध और अर्थ
  choice: मिस्पा में याहवे के सामने
  alternative: याहवे के पास, मिस्पा में
  rationale: हिब्रू वाक्य-विन्यास सभा को मिस्पा में याहवे की उपस्थिति में एकत्र दिखा सकता है, जबकि אֶל का अधिक सीधा अर्थ ‘की ओर/के पास’ भी संभव है। मुख्य पाठ स्वाभाविक हिन्दी देता है और वैकल्पिक बोध पादटिप्पणी में रखता है।
- issue: בְּנֵי יִשְׂרָאֵל और כְּאִישׁ אֶחָד में पुल्लिंग सामूहिक भाषा
  choice: पहले पदबंध का सामूहिक अर्थ ‘इस्राएली’, और दूसरे का चित्रात्मक रूप ‘एक मनुष्य के समान’
  alternative: ‘इस्राएल के सब पुत्र’ और ‘एक व्यक्ति के समान’
  rationale: בְּנֵי יִשְׂרָאֵל पूरे जातीय समुदाय का स्थापित नाम है, इसलिए आधुनिक हिन्दी में ‘इस्राएली’ भ्रम से बचाता है। दूसरी ओर, אחד איש का सजीव मुहावरा अर्थबोध में बाधा नहीं डालता और स्रोत की अभिव्यक्ति को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। भौगोलिक नामों के लिए प्रचलित हिन्दी रूप अपनाए गए हैं। वाक्य को दो भागों में बाँटकर लंबी हिब्रू संरचना को पठनीय बनाया गया है, जबकि क्षेत्रीय विस्तार, सामूहिक एकता और याहवे की उपस्थिति—तीनों मुख्य तत्व सुरक्षित हैं।
