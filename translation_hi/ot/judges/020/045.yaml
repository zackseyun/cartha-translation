  text: וַ/יִּפְנ֞וּ וַ/יָּנֻ֤סוּ הַ/מִּדְבָּ֨רָ/ה֙ אֶל סֶ֣לַע הָֽ/רִמּ֔וֹן וַ/יְעֹֽלְלֻ֨/הוּ֙ בַּֽ/מְסִלּ֔וֹת חֲמֵ֥שֶׁת אֲלָפִ֖ים אִ֑ישׁ וַ/יַּדְבִּ֤יקוּ אַחֲרָי/ו֙ עַד גִּדְעֹ֔ם וַ/יַּכּ֥וּ מִמֶּ֖/נּוּ אַלְפַּ֥יִם אִֽישׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/045.yaml
  text: Then they turned and fled toward the wilderness[a], to the rock of Rimmon. And they cut down five thousand men of them on the highways, and pursued them as far as Gidom[b], and struck down two thousand men of them.
translation:
  language: hi
  text: तब वे मुड़े और निर्जन प्रदेश की ओर, रिम्मोन की चट्टान तक भाग गए। इस्राएलियों ने मार्गों पर उनमें से पाँच हज़ार पुरुषों को मार गिराया[a]। फिर वे गिदओम तक उनका पीछा करते गए[b] और उनमें से दो हज़ार पुरुषों को मार गिराया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से “उसे बीन लिया” है—यहाँ यह भागते हुए बचे लोगों को चुन-चुनकर मारने का मुहावरा है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में यहाँ कुछ प्रत्यय एकवचन हैं—“उसके पीछे” और “उसमें से”—पर उनका संकेत भागते हुए बिन्यामीनियों के पूरे दल की ओर है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְנוּ וַיָּנֻסוּ
  choice: वे मुड़े ... और ... भाग गए
  rationale: दोनों क्रमिक क्रियाओं—दिशा बदलने और युद्ध से भागने—को स्वाभाविक हिन्दी में अलग-अलग बनाए रखा गया है।
- source_word: הַמִּדְבָּרָה
  choice: निर्जन प्रदेश की ओर
  rationale: दिशासूचक प्रत्यय गति की दिशा बताता है; ‘की ओर’ उस अर्थ को स्पष्ट करता है और ‘निर्जन प्रदेश’ बाइबिलीय wilderness का स्वाभाविक आधुनिक हिन्दी रूप है।
- source_word: אֶל סֶלַע הָרִמּוֹן
  choice: रिम्मोन की चट्टान तक
  rationale: סֶלַע का ठोस अर्थ ‘चट्टान’ रखा गया है और रिम्मोन को स्थाननाम के रूप में लिप्यंतरित किया गया है। इस वाक्य में ‘तक’ उनके भागने के गंतव्य को सहज रूप से व्यक्त करता है।
- source_word: וַיְעֹלְלֻהוּ
  choice: उनमें से ... को मार गिराया
  rationale: यहाँ ‘बीनने’ की मूल छवि युद्ध में बचे हुए भागते लोगों को चुन-चुनकर मारने का मुहावरा है। मुख्य पाठ में स्पष्ट सैन्य अर्थ दिया गया है और मूल रूपक पादटिप्पणी में सुरक्षित है।
- source_word: בַּמְסִלּוֹת
  choice: मार्गों पर
  rationale: מְסִלּוֹת बने हुए रास्तों या सड़कों को सूचित करता है। ‘मार्गों’ से अनावश्यक आधुनिक ‘राजमार्ग’ का आभास नहीं आता।
- source_word: וַיַּדְבִּיקוּ אַחֲרָיו
  choice: वे ... उनका पीछा करते गए
  rationale: דבק का हिफ़ील रूप निकटता से लगातार पीछा करने का भाव देता है। ‘पीछा करते गए’ उस निरंतरता को स्वाभाविक हिन्दी में व्यक्त करता है, बिना स्रोत से अधिक तीव्रता जोड़ने के।
- source_word: עַד גִּדְעֹם
  choice: गिदओम तक
  rationale: עַד पीछा किए जाने की भौगोलिक सीमा बताता है; स्थाननाम को निकट ध्वन्यात्मक रूप में लिप्यंतरित किया गया है।
- source_word: וַיַּכּוּ מִמֶּנּוּ אַלְפַּיִם אִישׁ
  choice: उनमें से दो हज़ार पुरुषों को मार गिराया
  rationale: מִמֶּנּוּ का अंशसूचक भाव ‘उनमें से’ द्वारा सुरक्षित है। ‘और’ या ‘अतिरिक्त’ संख्या स्रोत में स्पष्ट नहीं है, इसलिए नहीं जोड़ा गया।
theological_decisions:
- issue: लगातार बहुवचन क्रियाओं में कर्ता का अप्रकट परिवर्तन
  choice: दूसरे वाक्य में ‘इस्राएलियों ने’ स्पष्ट किया गया
  alternative: सभी क्रियाओं के लिए केवल ‘उन्होंने’ रखना
  rationale: इब्रानी आख्यान में पहले भागने वाले बिन्यामीनी हैं, जबकि उन्हें मारने और उनका पीछा करने वाले इस्राएली हैं। हिन्दी में केवल ‘उन्होंने’ रखने से उलटा अर्थ निकल सकता था; संदर्भ से निश्चित कर्ता को स्पष्ट करना व्याख्यात्मक सिद्धान्त जोड़ना नहीं है।
- issue: एकवचन प्रत्ययों का सामूहिक अर्थ
  choice: हिन्दी में बहुवचन ‘उनका/उनमें से’
  alternative: शाब्दिक एकवचन ‘उसका/उसमें से’
  rationale: इब्रानी एकवचन प्रत्यय भागते हुए बिन्यामीनियों के दल को सामूहिक इकाई मानते हैं। हिन्दी में बहुवचन संदर्भ के अनुसार स्वाभाविक है; मूल व्याकरणिक विशेषता पादटिप्पणी में बताई गई है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और कथात्मक हिन्दी रखी गई है। ‘निर्जन प्रदेश’, ‘मार्गों’ और ‘मार गिराया’ सामान्य पाठक के लिए स्पष्ट हैं तथा अत्यधिक संस्कृतनिष्ठ या आधुनिक सैन्य शब्दावली से बचते हैं।
