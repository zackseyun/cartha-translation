  verdict: revise
  source_fidelity: The draft accurately represents the hostile rising up, the nighttime encirclement of the house, the intention to kill, the sexual violation of the concubine, and her subsequent death. The direct rendering “बलात्कार किया” is contextually warranted by Judges 19–20, while the footnote appropriately retains the broader semantic range of ענה.
  naturalness: A small syntactic revision is needed. With the plural subject, the coordinated transitive clause “...घर को ... घेर लिया” is less natural without an explicit renewed subject/ergative construction, and “मुझे मार डालने का इरादा किया” is a calqued Hindi expression. “वे मुझे मार डालना चाहते थे” is natural and retains the stated intent.
  terminology: “गिबा,” “उपपत्नी,” and “बलात्कार” are accurate, modern-standard Hindi choices in this historical context. The note is appropriately measured and does not obscure the sexual violence indicated by the context.
  issues:
