source:
  edition: WLC
  text: וַ/יָּקֻ֤מוּ עָלַ/י֙ בַּעֲלֵ֣י הַ/גִּבְעָ֔ה וַ/יָּסֹ֧בּוּ עָלַ֛/י אֶת הַ/בַּ֖יִת לָ֑יְלָה אוֹתִ/י֙ דִּמּ֣וּ לַ/הֲרֹ֔ג וְ/אֶת פִּילַגְשִׁ֥/י עִנּ֖וּ וַ/תָּמֹֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/005.yaml
  text: Then the men of Gibeah rose up against me and surrounded the house at night[a]. They intended to kill me, and they violated my concubine[b], and she died.
translation:
  language: hi
  text: तब गिबा के पुरुष मेरे विरुद्ध उठ खड़े हुए और उन्होंने रात को घर को चारों ओर से घेर लिया। वे मुझे मार डालना चाहते थे, और उन्होंने मेरी उपपत्नी के साथ बलात्कार किया[a], और वह मर गई।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरी उपपत्नी को अपमानित और प्रताड़ित किया।” यहाँ प्रयुक्त इब्रानी क्रिया के अर्थ-क्षेत्र में घोर अपमान और दुर्व्यवहार शामिल हैं; इस प्रसंग में यह यौन हिंसा को दर्शाती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּעֲלֵי הַגִּבְעָה
  choice: गिबा के पुरुष
  rationale: बहुवचन संबंध-रचना यहाँ नगर के पुरुष निवासियों को सूचित करती है; ‘पुरुष’ स्वाभाविक है और औपचारिक प्रभुत्व का अनावश्यक भाव नहीं जोड़ता।
- source_word: וַיָּקֻמוּ עָלַי
  choice: मेरे विरुद्ध उठ खड़े हुए
  rationale: यह शत्रुतापूर्ण विरोध के इब्रानी मुहावरे और उसकी क्रियात्मक छवि, दोनों को सुरक्षित रखता है।
- source_word: וַיָּסֹבּוּ עָלַי אֶת הַבַּיִת
  choice: उस घर को चारों ओर से घेर लिया
  rationale: संदर्भ में क्रिया घर को घेर लेने का भाव देती है; हिन्दी में यह स्पष्ट और स्वाभाविक अभिव्यक्ति है।
- source_word: לָיְלָה
  choice: रात को
  rationale: समय बताने वाला सरल और प्रचलित आधुनिक हिन्दी रूप।
- source_word: דִּמּוּ לַהֲרֹג
  choice: मार डालने का इरादा किया
  rationale: इस प्रसंग में क्रिया विचार मात्र नहीं, हत्या की मंशा व्यक्त करती है।
- source_word: פִּילַגְשִׁי
  choice: मेरी उपपत्नी
  rationale: प्राचीन सामाजिक संबंध के लिए मानक और संक्षिप्त हिन्दी पद, जो उसे सामान्य पत्नी कहकर भेद को मिटाता नहीं।
- source_word: עִנּוּ
  choice: के साथ बलात्कार किया
  rationale: पिअल रूप व्यापक रूप से अपमानित या पीड़ित करने का अर्थ रख सकता है, पर न्यायियों 19–20 का स्पष्ट यौन संदर्भ यहाँ बलपूर्वक यौन हिंसा सूचित करता है।
- source_word: וַתָּמֹת
  choice: और वह मर गई
  rationale: सरल क्रमवर्ती वाव को सीधे रखा गया है; इससे ऐसा अतिरिक्त उद्देश्यात्मक या स्पष्ट कारणात्मक संबंध नहीं जोड़ा जाता जो व्याकरण स्वयं अनिवार्य नहीं करता।
