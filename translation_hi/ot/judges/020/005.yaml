    issue: Awkward coordination and agreement in the first sentence
    rationale: “गिबा के पुरुष ... उठ खड़े हुए और ... घेर लिया” combines an intransitive and a transitive perfect construction without a natural explicit subject marker for the latter. Renewing the subject as “उन्होंने” makes the Hindi syntax clear.
  - severity: medium
    issue: Calqued expression for murderous intent
    rationale: “मुझे मार डालने का इरादा किया” is not idiomatic modern Hindi. “वे मुझे मार डालना चाहते थे” naturally conveys דִּמּוּ לַהֲרֹג without strengthening it beyond intention.
