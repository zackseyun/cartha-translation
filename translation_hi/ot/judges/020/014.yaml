  text: And the sons of Benjamin gathered from the cities to Gibeah to go out to battle against the sons of Israel[a][b].
translation:
  language: hi
  text: तब बिन्यामीन के लोग इस्राएलियों के विरुद्ध[a] युद्ध के लिए निकलने को नगरों से गिबा में इकट्ठे हुए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, ‘इस्राएल के पुत्रों के साथ’; युद्ध के इस प्रसंग में अर्थ ‘इस्राएलियों के विरुद्ध’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּאָסְפוּ
  choice: इकट्ठे होकर
  rationale: निफ़अल रूप यहाँ एकत्र होने का भाव देता है। ‘इकट्ठे होकर’ स्वाभाविक आधुनिक हिन्दी है और अगले क्रियात्मक उद्देश्य से सहज जुड़ता है।
- source_word: בְנֵי בִנְיָמִן
  choice: बिन्यामीन के लोग
  rationale: शाब्दिक ‘बिन्यामीन के पुत्र’ हिन्दी में वास्तविक पुत्रों का भ्रम दे सकता है; यहाँ आशय बिन्यामीन गोत्र के लोगों से है।
- source_word: מִן הֶעָרִים
  choice: नगरों से
  rationale: מִן उद्गम बताता है और הֶעָרִים बहुवचन आबादी-केंद्रों को सूचित करता है; ‘नगरों से’ संक्षिप्त और स्वाभाविक है।
- source_word: הַגִּבְעָתָה
  choice: गिबा आए
  rationale: स्थाननाम पर दिशासूचक ה गिबा की ओर गति दर्शाता है। हिन्दी में गमन-क्रिया के साथ ‘गिबा आए’ इस अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: לָצֵאת לַמִּלְחָמָה
  choice: युद्ध करने निकलें
  rationale: यह सैन्य मुहावरा लड़ने के लिए बाहर निकलने को दर्शाता है; चुना हुआ रूप मूल की गति और उद्देश्य दोनों बनाए रखता है।
- source_word: עִם בְּנֵי יִשְׂרָאֵל
  choice: इस्राएलियों के विरुद्ध
  rationale: עִם का सामान्य अर्थ ‘के साथ’ है, पर युद्ध-संदर्भ में इसका भाव प्रतिपक्षी, अर्थात ‘के विरुद्ध’, है। ‘इस्राएली’ हिन्दी में गोत्रीय सामूहिक पहचान को स्पष्ट और सहज रूप से व्यक्त करता है।
