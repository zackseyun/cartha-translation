  text: וְ/הַ/מּוֹעֵ֗ד הָיָ֛ה לְ/אִ֥ישׁ יִשְׂרָאֵ֖ל עִם הָ/אֹרֵ֑ב הֶ֕רֶב לְ/הַעֲלוֹתָ֛/ם מַשְׂאַ֥ת הֶ/עָשָׁ֖ן מִן הָ/עִֽיר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/038.yaml
  text: The appointed sign between the men of Israel and the ambush was that they should make a great cloud of smoke rise from the city[a][b][c].
translation:
  language: hi
  text: इस्राएल के पुरुषों और घात लगाए हुए दल के बीच पहले से यह संकेत तय था[a][b] कि वे नगर से धुएँ का एक बड़ा गुबार उठाएँ[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘पहले से तय व्यवस्था’ अथवा ‘सहमति से ठहराया हुआ संकेत।’ इब्रानी शब्द का सामान्य अर्थ ‘नियत समय’ होता है, पर यहाँ वह युद्ध में पहले से ठहराए गए संकेत को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से ‘इस्राएल के पुरुषों के लिए, घात लगाए हुए दल के साथ’; यहाँ भाव दोनों पक्षों के बीच हुई व्यवस्था का है।
    reason: lexical_alternative
  - marker: c
    text: या ‘धुएँ की एक बड़ी राशि’ अथवा ‘धुएँ का एक ऊँचा स्तंभ।’ इब्रानी पद नगर से उठने वाले स्पष्ट धूम-संकेत को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַמּוֹעֵד
  choice: पहले से यह संकेत तय था
  rationale: מוֹעֵד सामान्यतः नियत समय या नियत भेंट को दर्शाता है, पर इस युद्ध-संदर्भ में दोनों दलों के बीच पहले से निर्धारित संकेत अभिप्रेत है। हिंदी में यह वाक्य-विन्यास पूर्व-व्यवस्था और संकेत, दोनों को स्वाभाविक रूप से व्यक्त करता है। आरंभिक וְ को अलग से ‘और’ कहना हिंदी में आवश्यक नहीं है।
- source_word: לְאִישׁ יִשְׂרָאֵל עִם הָאֹרֵב
  choice: इस्राएल के पुरुषों और घात लगाए हुए दल के बीच
  rationale: לְ...עִם का यहाँ भाव दो पक्षों के बीच हुई व्यवस्था है। אִישׁ יִשְׂרָאֵל को उसके सैनिक और पुल्लिंग संदर्भ के अनुरूप ‘इस्राएल के पुरुषों’ तथा सामूहिक אֹרֵב को ‘घात लगाए हुए दल’ कहा गया है।
- source_word: הֶרֶב לְהַעֲלוֹתָם
  choice: कि वे ... एक बड़ा ... उठाएँ
  rationale: רבה का गहनकारी रूप क्रिया के परिणाम की विशालता या प्रचुरता बताता है, और עלה का हिफ़ील रूप ‘ऊपर उठाना’ है। हिंदी में उद्देश्यसूचक उपवाक्य और ‘बड़ा’ मिलकर इस बल को स्वाभाविक ढंग से व्यक्त करते हैं।
- source_word: מַשְׂאַת הֶעָשָׁן
  choice: धुएँ का एक बड़ा गुबार
  rationale: מַשְׂאַת यहाँ ऊपर उठती हुई, साफ़ दिखाई देने वाली धुएँ की राशि या लहर को सूचित करता है। ‘गुबार’ आधुनिक हिंदी में ऐसे घने, उठते हुए धुएँ के लिए स्वाभाविक है।
- source_word: מִן הָעִיר
  choice: नगर से
  rationale: מן स्रोत या उद्गम को दर्शाता है; ‘नगर से’ संक्षिप्त और सीधा अनुवाद है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘घात लगाए हुए दल’ सामूहिक सैन्य बल को स्पष्ट करता है, जबकि ‘धुएँ का गुबार’ दृश्य संकेत की स्वाभाविक हिंदी अभिव्यक्ति है।
