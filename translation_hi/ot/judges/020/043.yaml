base_translation:
  language: en
  yaml_path: translation/ot/judges/020/043.yaml
  text: They surrounded Benjamin[a], pursued him relentlessly, and trampled him down as far as opposite Gibeah[c][b], toward the east of the sun.
translation:
  language: hi
  text: उन्होंने बिन्यामीन[a] को घेर लिया, उसे चैन न लेने देते हुए उसका पीछा किया[b], और उसे गिबा के सामने तक, पूरब की ओर, रौंद डाला[c][d]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ ‘बिन्यामीन’ से उस गोत्र के लोग या उसकी सेना सामूहिक रूप से अभिप्रेत हैं।
    reason: collective_singular
  - marker: b
    text: 'इब्रानी शब्द कठिन है। संभव अनुवाद: ‘मेनूहा से उसका पीछा किया,’ यदि מְנוּחָה को क्रियाविशेषण के बजाय स्थान का नाम माना जाए।'
    reason: alternative_reading
  - marker: c
    text: या ‘उसे आगे हाँकते गए’; इब्रानी क्रिया इस संदर्भ में रौंदने अथवा बलपूर्वक आगे बढ़ाने—दोनों का भाव दे सकती है।
    reason: lexical_alternative
  - marker: d
    text: शाब्दिक रूप में ‘सूर्योदय की दिशा से,’ अर्थात ‘पूर्व की ओर’ या ‘पूर्वी ओर।’
    reason: idiom
lexical_decisions:
- source_word: כִּתְּרוּ
  choice: घेर लिया
  rationale: यह क्रिया युद्ध में किसी को चारों ओर से घेरने या उसका मार्ग रोकने का भाव व्यक्त करती है।
- source_word: אֶת בִּנְיָמִן
  choice: बिन्यामीन
  rationale: इब्रानी में गोत्र का नाम सामूहिक एकवचन के रूप में आया है; आगे के एकवचन प्रत्ययों को बनाए रखने के लिए नाम को ज्यों का त्यों रखा गया है।
- source_word: הִרְדִיפֻהוּ
  choice: उसका पीछा किया
  rationale: רדף का सामान्य सैनिक अर्थ पीछा करना है; एकवचन सर्वनाम बिन्यामीन को सामूहिक इकाई मानता है।
- source_word: מְנוּחָה
  choice: उसे चैन न लेने देते हुए
  rationale: शब्द का मूल अर्थ ‘विश्राम’ या ‘विश्राम-स्थान’ है। कठिन वाक्य-विन्यास में इसे क्रियाविशेषणीय अर्थ में लेकर ऐसे लगातार पीछा करने के रूप में व्यक्त किया गया है जिससे शत्रु को विश्राम न मिले; स्थान-नाम की संभावना पादटिप्पणी में सुरक्षित है।
- source_word: הִדְרִיכֻהוּ
  choice: उसे रौंद डाला
  rationale: דרך के हिफ़ील रूप में ‘पैरों तले रौंदना’ अथवा ‘आगे हाँकना’ दोनों भाव संभव हैं। युद्ध-संदर्भ में प्रबल और विनाशकारी भाव मुख्य पाठ में रखा गया है।
- source_word: עַד נֹכַח הַגִּבְעָה
  choice: गिबा के सामने ... तक
  rationale: נֹכַח किसी स्थान के सामने, सम्मुख या आमने-सामने होने का स्थानिक भाव देता है।
- source_word: מִמִּזְרַח שָׁמֶשׁ
  choice: उसकी पूर्व दिशा तक
  rationale: शाब्दिक अभिव्यक्ति ‘सूरज के उगने की ओर से’ पूर्व दिशा का संकेत करती है। स्वाभाविक हिन्दी में दिशा स्पष्ट की गई है और शाब्दिक रूप पादटिप्पणी में दिया गया है।
