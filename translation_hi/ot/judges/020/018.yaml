base_translation:
  language: en
  yaml_path: translation/ot/judges/020/018.yaml
  text: Then they arose and went up to Bethel[a], and they inquired of God. The sons of Israel said, “Who will go up first for us to the battle against the sons of Benjamin?” And Yahweh said[c][b], “Judah first.”
translation:
  language: hi
  text: तब वे उठे और बेतेल गए, और उन्होंने परमेश्वर से पूछा। इस्राएलियों ने कहा, “बिन्यामीनियों के विरुद्ध युद्ध के लिए हमारी ओर से सबसे पहले कौन आगे बढ़े?” यहोवा ने कहा, “यहूदा पहले।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקֻמוּ וַיַּעֲלוּ
  choice: वे उठकर ... गए
  rationale: दोनों क्रमिक क्रियाओं को स्वाभाविक हिन्दी कथन में रखा गया है। बेतेल की ओर जाने के लिए प्रयुक्त עלה का शाब्दिक अर्थ ‘ऊपर जाना/चढ़ना’ है, पर हिन्दी में यहाँ केवल ‘गए’ अधिक स्वाभाविक है।
- source_word: בֵית אֵל
  choice: बेतेल
  rationale: इसे प्रचलित स्थान-नाम के रूप में लिया गया है; शब्द-रूप के कारण ‘परमेश्वर का भवन’ भी संभव है, इसलिए उसे पादटिप्पणी में रखा गया है।
- source_word: וַיִּשְׁאֲלוּ בֵאלֹהִים
  choice: उन्होंने परमेश्वर से पूछा
  rationale: שׁאל ב यहाँ युद्ध के विषय में ईश्वरीय मार्गदर्शन पूछने को दर्शाता है। सरल हिन्दी में ‘परमेश्वर से पूछा’ स्पष्ट और स्वाभाविक है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएलियों
  rationale: शाब्दिक ‘इस्राएल के पुत्रों’ के बजाय समुदाय के लिए आधुनिक, सहज हिन्दी पद चुना गया है; शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: מִי יַעֲלֶה לָּנוּ בַתְּחִלָּה
  choice: हममें से सबसे पहले कौन आगे बढ़े
  rationale: यह प्रश्न उस गोत्र के विषय में है जो युद्ध में पहल करेगा। ‘आगे बढ़े’ עלה के सैन्य-संदर्भित आशय को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि ‘हममें से’ हितार्थक לָנוּ को प्रसंगानुसार स्पष्ट करता है।
- source_word: לַמִּלְחָמָה עִם בְּנֵי בִנְיָמִן
  choice: बिन्यामीनियों के विरुद्ध युद्ध करने के लिए
  rationale: युद्ध-संदर्भ में עִם विरोधी पक्ष के साथ मुठभेड़ को सूचित करता है; इसलिए हिन्दी में ‘के विरुद्ध’ अपेक्षित अर्थ देता है।
- source_word: וַיֹּאמֶר יְהוָה
  choice: यहोवा ने कहा
  rationale: व्यक्तिगत ईश्वरीय नाम יהוה को हिन्दी के व्यापक रूप से पहचाने जाने वाले लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है।
- source_word: יְהוּדָה בַתְּחִלָּה
  choice: यहूदा सबसे पहले
  rationale: मूल का उत्तर संक्षिप्त और क्रियारहित है; हिन्दी में भी उसी संक्षिप्तता और बल को बनाए रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में सामान्य उपाधि नहीं, परमेश्वर का विशिष्ट नाम है। ‘यहोवा’ हिन्दी पाठकों में परिचित रूप है और नाम को उपाधि में बदलने से बचाता है।
- issue: בְּנֵי יִשְׂרָאֵל का सामुदायिक अर्थ
  choice: इस्राएली
  alternative: इस्राएल के पुत्र
  rationale: यह पद पूरे इस्राएली समुदाय का पारंपरिक सामूहिक नाम है। सहज आधुनिक हिन्दी के लिए ‘इस्राएली’ रखा गया है, जबकि मूल की वंश-संबंधी अभिव्यक्ति पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक रखी गई है। सैन्य प्रसंग को स्पष्ट करने के लिए ‘विरुद्ध’ और ‘आगे बढ़े’ चुने गए हैं। मूल के अंतिम संक्षिप्त उत्तर ‘यहूदा सबसे पहले’ को विस्तार दिए बिना सुरक्षित रखा गया है।
