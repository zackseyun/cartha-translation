  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज शैली रखी गई है। ‘घमासान’ युद्ध की तीव्रता को स्वाभाविक ढंग से व्यक्त करता है। मूल के ‘वे/उन्हें’ सर्वनाम को बनाए रखा गया है ताकि पाठ में निहित संदर्भगत अस्पष्टता को किसी दल का नाम जोड़कर न मिटाया जाए।
