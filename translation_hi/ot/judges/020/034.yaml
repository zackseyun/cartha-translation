  text: וַ/יָּבֹאוּ֩ מִ/נֶּ֨גֶד לַ/גִּבְעָ֜ה עֲשֶׂרֶת֩ אֲלָפִ֨ים אִ֤ישׁ בָּחוּר֙ מִ/כָּל יִשְׂרָאֵ֔ל וְ/הַ/מִּלְחָמָ֖ה כָּבֵ֑דָה וְ/הֵם֙ לֹ֣א יָדְע֔וּ כִּֽי נֹגַ֥עַת עֲלֵי/הֶ֖ם הָ/רָעָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/034.yaml
  text: Then ten thousand chosen men from all Israel came against Gibeah[a], and the battle was fierce; but they did not know that disaster was closing in on them.
translation:
  language: hi
  text: तब समस्त इस्राएल में से दस हज़ार चुने हुए पुरुष गिबा के सामने आए, और युद्ध घमासान था; पर उन्हें पता नहीं था कि विपत्ति उन तक पहुँच रही थी।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “विपत्ति उन पर आ पड़ रही थी।” इब्रानी में शाब्दिक भाव है, “विपत्ति उन्हें छू/उन तक पहुँच रही थी।”
    reason: नֹגַעַת के ‘छूने/पहुँचने’ वाले मूल अर्थ और प्रसंगगत ‘विपत्ति आ पड़ने’ के अर्थ—दोनों को दिखाने के लिए।
lexical_decisions:
- source_word: מִנֶּגֶד לַגִּבְעָה
  choice: गिबा के सामने
  rationale: מִנֶּגֶד स्थान की दृष्टि से ‘सामने/आमने-सामने’ होने का बोध देता है। युद्ध के प्रसंग में यह विरोधी दल के विरुद्ध बढ़ने का भाव भी रखता है; ‘गिबा के सामने आ पहुँचे’ स्थानगत अर्थ को बचाते हुए प्रसंग में स्वाभाविक है।
- source_word: עֲשֶׂרֶת אֲלָפִים אִישׁ בָּחוּר
  choice: दस हज़ार चुने हुए पुरुष
  rationale: संख्या के साथ אִישׁ सामूहिक बहुवचन अर्थ देता है, और בָּחוּר यहाँ युद्ध के लिए चुने गए श्रेष्ठ पुरुषों को सूचित करता है।
- source_word: מִכָּל יִשְׂרָאֵל
  choice: समस्त इस्राएल में से
  rationale: यह वाक्यांश बताता है कि ये सैनिक पूरे इस्राएल में से लिए गए थे।
- source_word: וְהַמִּלְחָמָה כָּבֵדָה
  choice: और युद्ध घमासान था
  rationale: כָּבֵדָה का शाब्दिक अर्थ ‘भारी’ है, पर यहाँ इसका आशय युद्ध की तीव्रता और कठोरता से है; ‘घमासान’ आधुनिक हिन्दी में यही भाव स्पष्ट करता है।
- source_word: וְהֵם לֹא יָדְעוּ
  choice: पर उन्हें पता नहीं था
  rationale: वाव को यहाँ विरोधसूचक ‘पर’ से व्यक्त किया गया है, क्योंकि भीषण युद्ध और आसन्न विपत्ति से उनकी अनभिज्ञता के बीच स्पष्ट विरोध है। सर्वनाम की अस्पष्टता को अनावश्यक रूप से किसी समूह का नाम जोड़कर नहीं सुलझाया गया।
- source_word: כִּי נֹגַעַת עֲלֵיהֶם הָרָעָה
  choice: कि विपत्ति उन तक पहुँच रही थी
  rationale: נֹגַעַת का मूल भाव ‘छूना/पहुँचना’ है और इसका रूप चल रही स्थिति को व्यक्त कर सकता है। הָרָעָה यहाँ नैतिक बुराई नहीं, आने वाली विपत्ति है। यह अनुवाद आसन्न संकट और मूल क्रिया, दोनों को बनाए रखता है।
