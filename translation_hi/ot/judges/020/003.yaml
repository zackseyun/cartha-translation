  text: וַֽ/יִּשְׁמְעוּ֙ בְּנֵ֣י בִנְיָמִ֔ן כִּֽי עָל֥וּ בְנֵֽי יִשְׂרָאֵ֖ל הַ/מִּצְפָּ֑ה וַ/יֹּֽאמְרוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל דַּבְּר֕וּ אֵיכָ֥ה נִהְיְתָ֖ה הָ/רָעָ֥ה הַ/זֹּֽאת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/003.yaml
  text: The sons of Benjamin heard that the sons of Israel had gone up to Mizpah[a]. And the sons of Israel said, “Tell us[b], how did this evil happen?”
translation:
  language: hi
  text: बिन्यामीन के वंशजों[a] ने सुना कि इस्राएली मिस्पा गए थे। तब इस्राएलियों ने कहा, “हमें बताओ, यह बुराई[b] कैसे हुई?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से “बिन्यामीन के पुत्र” है; इसी पद में “इस्राएली” के लिए भी “इस्राएल के पुत्र” कहा गया है।
    reason: lexical_alternative
  - marker: b
    text: “बुराई” का अनुवाद “दुष्टता” या “अनर्थ” भी किया जा सकता है; यहाँ इब्रानी शब्द में प्रबल नैतिक भाव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמְעוּ
  choice: ने सुना
  rationale: שׁמע यहाँ किसी समाचार के सुनने या पता चलने को व्यक्त करता है; ‘सुना’ सरल और कथात्मक प्रवाह के अनुकूल है।
- source_word: בְּנֵי בִנְיָמִן
  choice: बिन्यामीन के वंशजों
  rationale: शाब्दिक ‘बिन्यामीन के पुत्रों’ की अपेक्षा यह आधुनिक हिन्दी में स्वाभाविक ढंग से गोत्रीय पहचान व्यक्त करता है।
- source_word: כִּי עָלוּ
  choice: कि ... गए थे
  rationale: עלה का मूल भाव ऊपर जाने का है, पर हिन्दी में किसी स्थान के लिए केवल ‘चढ़ गए’ अस्वाभाविक या भ्रामक हो सकता है। ‘गए थे’ पूर्ववर्ती श्रवण के सापेक्ष पहले हुई यात्रा को स्पष्ट करता है।
- source_word: הַמִּצְפָּה
  choice: मिस्पा
  rationale: स्थान-नाम का प्रचलित हिन्दी लिप्यंतरण रखा गया है; इब्रानी निश्चित उपपद का अलग अनुवाद आवश्यक नहीं है।
- source_word: וַיֹּאמְרוּ
  choice: तब ... ने कहा
  rationale: मूल क्रिया ‘कहा’ है। ‘तब’ वाव द्वारा आगे बढ़ती कथा को स्वाभाविक हिन्दी में व्यक्त करता है, बिना कोई स्वतंत्र कालवाचक ‘अब’ जोड़ने के।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएली / इस्राएलियों
  rationale: यह आधुनिक हिन्दी में इस गोत्रीय-राष्ट्रीय समूह का स्वाभाविक नाम है; मूल की शाब्दिक अभिव्यक्ति फुटनोट में दी गई है।
- source_word: דַּבְּרוּ
  choice: हमें बताओ
  rationale: शाब्दिक ‘बोलो’ यहाँ घटना का वृत्तांत माँगता है; ‘हमें बताओ’ हिन्दी में उसी आशय को सहज रूप से व्यक्त करता है।
- source_word: אֵיכָה נִהְיְתָה
  choice: कैसे हुई
  rationale: यह प्रश्न घटना के घटित होने के ढंग के विषय में है; ‘कैसे हुई’ संक्षिप्त और स्वाभाविक है।
- source_word: הָרָעָה הַזֹּאת
  choice: यह बुराई
  rationale: רָעָה संदर्भ में प्रबल नैतिक दोष व्यक्त करता है। ‘बुराई’ इस नैतिक बल को बनाए रखती है, फिर भी शब्द को केवल विपत्ति के अर्थ तक सीमित नहीं करती।
theological_decisions:
- issue: רָעָה का नैतिक और विपत्तिमूलक अर्थ-क्षेत्र
  choice: बुराई
  alternative: दुष्टता / अनर्थ
  rationale: गिबा की घटना के संदर्भ में नैतिक अर्थ प्रमुख है, पर ‘बुराई’ मूल शब्द की अपेक्षाकृत व्यापकता को ‘दुष्टता’ से बेहतर बनाए रखती है।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। गोत्रीय समूहों के लिए स्वाभाविक हिन्दी रूप अपनाए गए हैं, जबकि इब्रानी की दोहराई हुई ‘पुत्र’ संरचना को फुटनोट में सुरक्षित रखा गया है।
