  language: hi
  text: तब इस्राएल ने गिबा के चारों ओर घात लगानेवाले तैनात किए[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू में शाब्दिक रूप से, “गिबा की ओर/चारों ओर घात लगानेवाले रखे।” इस अभिव्यक्ति का आशय नगर के चारों ओर घात-दल तैनात करना है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: तैनात किए
  rationale: שׂוּם का मूल अर्थ ‘रखना/स्थापित करना’ है। सैनिक प्रसंग में ‘तैनात किए’ स्वाभाविक हिंदी है और जानबूझकर स्थान निर्धारित करने की क्रिया व्यक्त करता है।
- source_word: יִשְׂרָאֵל
  choice: इस्राएल
  rationale: यह सामूहिक रूप से इस्राएली सेना को सूचित करने वाला व्यक्तिवाचक नाम है; हिंदी बाइबलीय प्रयोग के अनुरूप ‘इस्राएल’ रखा गया है।
- source_word: אֹרְבִים
  choice: घात लगानेवाले
  rationale: ארב का बहुवचन कृदंत उन व्यक्तियों को दर्शाता है जो छिपकर प्रतीक्षा में हैं। ‘घात लगानेवाले’ इस व्यक्तिगत और सक्रिय अर्थ को बनाए रखता है।
- source_word: אֶל ... סָבִיב
  choice: के चारों ओर
  rationale: אֶל सामान्यतः ‘की ओर’ है, पर סָבִיב और सैन्य संदर्भ के साथ पूरा पदबंध गिबा के चारों ओर घात-दल की स्थिति बताता है। मुख्य पाठ में स्वाभाविक हिंदी दी गई है और शाब्दिक दिशात्मक संभावना पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: הַגִּבְעָה
  choice: गिबा
  rationale: यह नगर का नाम है; हिब्रू का निश्चित उपपद हिंदी व्यक्तिवाचक स्थान-नाम में अलग से व्यक्त नहीं किया जाता।
