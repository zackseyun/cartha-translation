  text: וְ/הַ/מַּשְׂאֵ֗ת הֵחֵ֛לָּה לַ/עֲל֥וֹת מִן הָ/עִ֖יר עַמּ֣וּד עָשָׁ֑ן וַ/יִּ֤פֶן בִּנְיָמִן֙ אַחֲרָ֔י/ו וְ/הִנֵּ֛ה עָלָ֥ה כְלִיל הָ/עִ֖יר הַ/שָּׁמָֽיְמָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/040.yaml
  text: But the signal began to rise from the city as a pillar of smoke[a], and Benjamin turned behind him, and behold[c][b], the whole city was going up to the heavens.
translation:
  language: hi
  text: नगर से संकेत धुएँ के स्तंभ के रूप में उठने लगा[a], और बिन्यामीन पीछे मुड़ा[b], और देखो, पूरा नगर आकाश की ओर उठ रहा था[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “नगर से धुएँ का स्तंभ उठने लगा।” इब्रानी शब्द किसी ऊपर उठाई गई वस्तु या संकेत-चिह्न को सूचित कर सकता है; यहाँ संभवतः युद्ध के लिए पहले से ठहराया गया संकेत अभिप्रेत है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “बिन्यामीन अपने पीछे की ओर मुड़ा।” इसका अर्थ पीछे मुड़ना या पीछे देखने के लिए मुड़ना हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: या, “पूरा नगर आकाश तक उठ गया,” अर्थात आग और धुएँ में।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּשְׂאֵת
  choice: संकेत
  rationale: युद्ध के इस प्रसंग में यह शब्द घात लगाए दल द्वारा दिए गए पहले से ठहराए संकेत को सूचित करता है। ‘संकेत’ इसके संचारात्मक कार्य को स्वाभाविक हिंदी में स्पष्ट करता है, जबकि धुएँ का स्वरूप अगले पदबंध में बना रहता है।
- source_word: הֵחֵלָּה לַעֲלוֹת
  choice: उठने लगा
  rationale: यह आरंभ और ऊपर की ओर गति—दोनों को व्यक्त करता है तथा धुएँ के विषय में स्वाभाविक हिंदी है।
- source_word: עַמּוּד עָשָׁן
  choice: धुएँ के खंभे के रूप में
  rationale: यह धुएँ की सीधी ऊपर उठती हुई धारा का सजीव और प्रचलित चित्र सुरक्षित रखता है।
- source_word: וַיִּפֶן בִּנְיָמִן אַחֲרָיו
  choice: तब बिन्यामीन पीछे की ओर मुड़ा
  rationale: क्रिया का मूल अर्थ ‘मुड़ना’ है; केवल ‘पीछे देखा’ कहना दृष्टि की क्रिया को अधिक स्पष्ट कर देता। ‘बिन्यामीन’ यहाँ गोत्र के लिए सामूहिक एकवचन है।
- source_word: וְהִנֵּה
  choice: और देखो
  rationale: यह अचानक हुए बोध और दृश्य की नाटकीयता को बनाए रखता है, फिर भी आधुनिक हिंदी में समझने योग्य है।
- source_word: עָלָה
  choice: उठ रहा था
  rationale: यह बिन्यामीन के सामने घट रहे निरंतर दृश्य को व्यक्त करता है और यह खुला रखता है कि नगर आग और धुएँ में ऊपर उठता दिखाई दे रहा था।
- source_word: כְלִיל הָעִיר
  choice: पूरा नगर
  rationale: यह नगर की संपूर्णता को सहज और स्पष्ट हिंदी में व्यक्त करता है।
- source_word: הַשָּׁמָיְמָה
  choice: आकाश की ओर
  rationale: दिशासूचक प्रत्यय ऊपर की ओर गति बताता है। हिंदी में ‘आकाश की ओर’ मूल चित्र को स्वाभाविक ढंग से सुरक्षित रखता है।
