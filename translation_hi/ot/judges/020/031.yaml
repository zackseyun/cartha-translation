base_translation:
  language: en
  yaml_path: translation/ot/judges/020/031.yaml
  text: And the sons of Benjamin came out to meet the people[a], and were drawn away from the city; and they began to strike down some of the people, as at other times, on the highways, one of which goes up to Bethel and one to Gibeah in the open country[d][c][b], about thirty men of Israel.
translation:
  language: hi
  text: तब बिन्यामीन के लोग लोगों का सामना करने के लिए बाहर निकले[a] और नगर से दूर खिंच गए[b]। वे पहले की ही तरह[c] राजमार्गों पर लोगों में से लगभग तीस इस्राएली पुरुषों को मार गिराने लगे—एक मार्ग बेतेल की ओर और दूसरा खुले मैदान से होकर गिबा की ओर जाता था[d]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “बिन्यामीन के पुत्र।” इसका अर्थ बिन्यामीन गोत्र के लोग है।
    reason: lexical_alternative
  - marker: b
    text: इसका अनुवाद “नगर से अलग हो गए” या “फुसलाकर नगर से दूर ले जाए गए” भी हो सकता है। आशय यह है कि वे नगर की सुरक्षा से दूर निकल आए।
    reason: lexical_alternative
  - marker: c
    text: या “पिछली बारों की तरह।” इब्रानी मुहावरा इस आक्रमण की तुलना पहले हुई लड़ाइयों से करता है।
    reason: lexical_alternative
  - marker: d
    text: शाब्दिक रूप से, “मैदान में।” सम्भवतः यह खुले भूभाग से होकर जाने वाले मार्ग का वर्णन है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצְאוּ
  choice: बाहर निकले
  rationale: नगर से युद्ध के लिए निकलने की सामान्य कथात्मक क्रिया; हिन्दी में स्वाभाविक और स्रोत के निकट।
- source_word: בְנֵי בִנְיָמִן
  choice: बिन्यामीन के वंशज
  rationale: इब्रानी के शाब्दिक ‘बिन्यामीन के पुत्र’ का जनजातीय अर्थ स्पष्ट करता है, फिर भी मूल के वंश-संबंध को बनाए रखता है।
- source_word: לִקְרַאת הָעָם
  choice: लोगों का सामना करने के लिए
  rationale: עָם का मूल अर्थ ‘लोग’ रखा गया है, जबकि युद्ध-संदर्भ को ‘सामना करने’ से स्पष्ट किया गया है।
- source_word: הָנְתְּקוּ מִן הָעִיר
  choice: नगर से दूर खींच लिए गए
  rationale: रणनीतिक रूप से नगर की सुरक्षा से अलग कर दिए जाने का निष्क्रिय भाव व्यक्त करता है; जानबूझकर फुसलाए जाने का अर्थ मुख्य पाठ में अनिवार्य नहीं किया गया।
- source_word: וַיָּחֵלּוּ לְהַכּוֹת ... חֲלָלִים
  choice: मार गिराने लगे
  rationale: आरम्भिक क्रिया और घातक परिणाम दोनों को स्वाभाविक हिन्दी में समेटता है; ‘घायल’ की अपेक्षा חֲלָלִים के मारे गए लोगों के अर्थ को दर्शाता है।
- source_word: כְּפַעַם בְּפַעַם
  choice: पहले की तरह
  rationale: पिछली लड़ाइयों जैसा क्रम दोहराए जाने वाले इब्रानी मुहावरे का सहज हिन्दी रूप।
- source_word: בַּמְסִלּוֹת
  choice: राजमार्गों पर
  rationale: מְסִלָּה प्रमुख अथवा निर्मित मार्ग को सूचित करता है; बहुवचन सुरक्षित रखा गया है।
- source_word: וְאַחַת גִּבְעָתָה בַּשָּׂדֶה
  choice: दूसरा खुले मैदान से होकर गिबा को जाता था
  rationale: בַשָּׂדֶה को मार्ग का खुले भूभाग से होकर जाना माना गया है; वाक्य को हिन्दी में स्पष्ट बनाया गया है।
- source_word: כִּשְׁלֹשִׁים אִישׁ בְּיִשְׂרָאֵל
  choice: इस्राएल के लगभग तीस पुरुषों को
  rationale: संख्या की अनुमानात्मकता और मारे गए लोगों की इस्राएली पहचान दोनों सुरक्षित हैं।
