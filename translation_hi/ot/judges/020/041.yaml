  text: וְ/אִ֤ישׁ יִשְׂרָאֵל֙ הָפַ֔ךְ וַ/יִּבָּהֵ֖ל אִ֣ישׁ בִּנְיָמִ֑ן כִּ֣י רָאָ֔ה כִּֽי נָגְעָ֥ה עָלָ֖י/ו הָ/רָעָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/041.yaml
  text: Then the men of Israel turned[a], and the men of Benjamin were terrified, because they saw that disaster had come upon them.
translation:
  language: hi
  text: तब इस्राएल के पुरुष पलटे[a], और बिन्यामीन के पुरुष भयभीत हो गए, क्योंकि उन्होंने देखा कि विपत्ति उन पर आ पड़ी थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ इब्रानी में ‘इस्राएल का पुरुष,’ ‘बिन्यामीन का पुरुष,’ ‘उसने देखा’ और ‘उस पर’ जैसे एकवचन रूप सामूहिक अर्थ में दोनों सेनाओं के लिए प्रयुक्त हुए हैं; इसलिए हिन्दी में इन्हें बहुवचन में व्यक्त किया गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אִישׁ יִשְׂרָאֵל
  choice: तब इस्राएल के पुरुष
  rationale: אִישׁ रूप की दृष्टि से एकवचन है, पर युद्ध-वर्णन में इस्राएली सेना के लिए सामूहिक अर्थ में प्रयुक्त हुआ है। וְ को घटनाक्रम के अनुसार स्वाभाविक हिन्दी में ‘तब’ कहा गया है।
- source_word: הָפַךְ
  choice: पलटे
  rationale: यह युद्ध में दिशा बदलकर शत्रु का सामना करने की कार्रवाई बताता है। ‘पलटे’ संक्षिप्त है और मूल की संभावित व्यापकता बनाए रखता है; ‘वापस मुड़े’ अधिक व्याख्यात्मक होता।
- source_word: וַ/יִּבָּהֵל
  choice: भयभीत हो गए
  rationale: בהל अचानक भय और घबराहट व्यक्त करता है। ‘भयभीत हो गए’ गरिमापूर्ण और सामान्य आधुनिक हिन्दी है तथा सामूहिक कर्ता के अनुरूप बहुवचन में है।
- source_word: אִישׁ בִּנְיָמִן
  choice: बिन्यामीन के पुरुष
  rationale: एकवचन אִישׁ यहाँ बिन्यामीन की लड़ाकू टुकड़ी के लिए सामूहिक रूप से प्रयुक्त है, इसलिए हिन्दी में बहुवचन स्वाभाविक है।
- source_word: כִּי רָאָה
  choice: क्योंकि उन्होंने देखा
  rationale: पहला כִּי कारण बताता है और एकवचन רָאָה का कर्ता सामूहिक बिन्यामीन है; इसलिए हिन्दी में आदरसूचक नहीं बल्कि सामूहिक बहुवचन ‘उन्होंने देखा’ रखा गया है।
- source_word: כִּי נָגְעָה עָלָיו
  choice: कि … उन पर आ पड़ी थी
  rationale: दूसरा כִּי देखी गई बात का विषय प्रस्तुत करता है। נגע על यहाँ किसी विपत्ति के किसी पर आ पड़ने को व्यक्त करता है। एकवचन प्रत्यय को सामूहिक संदर्भ के कारण ‘उन पर’ किया गया है।
- source_word: הָרָעָה
  choice: विपत्ति
  rationale: इस प्रसंग में רָעָה नैतिक बुराई नहीं, बल्कि युद्ध में आई घोर हानि या अनिष्ट है; ‘विपत्ति’ इस अर्थ को स्पष्ट और गरिमापूर्ण ढंग से व्यक्त करता है।
