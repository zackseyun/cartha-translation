base_translation:
  language: en
  yaml_path: translation/ot/judges/020/020.yaml
  text: The men of Israel went out to battle against Benjamin[a], and the men of Israel drew up for battle against them at Gibeah.
translation:
  language: hi
  text: इस्राएल के पुरुष बिन्यामीन से युद्ध करने निकले, और इस्राएल के पुरुषों ने गिबा में उनके विरुद्ध[a] युद्ध के लिए मोर्चा बाँधा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से “उनके साथ”; युद्ध के इस प्रसंग में इसका अर्थ “उनके विरुद्ध” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: निकले
  rationale: सैन्य कथानक में יצא कार्रवाई या युद्ध के लिए निकलने को दर्शाता है; ‘निकले’ स्वाभाविक है और अनावश्यक विस्तार नहीं करता।
- source_word: אִישׁ יִשְׂרָאֵל
  choice: इस्राएल के पुरुष
  rationale: एकवचन रूप यहाँ इस्राएल के लड़ने वाले पुरुषों के लिए सामूहिक अर्थ में प्रयुक्त है; हिन्दी में बहुवचन इसे स्पष्ट और स्वाभाविक बनाता है।
- source_word: לַמִּלְחָמָה
  choice: युद्ध करने
  rationale: यह पदबंध युद्ध के उद्देश्य को व्यक्त करता है; ‘युद्ध करने’ आधुनिक हिन्दी में सहज है।
- source_word: עִם בִּנְיָמִן
  choice: बिन्यामीन से
  rationale: युद्ध के प्रसंग में עִם विरोधी पक्ष के साथ मुठभेड़ का बोध देता है; ‘से युद्ध करने’ हिन्दी में शत्रुतापूर्ण संबंध स्पष्ट करता है।
- source_word: וַיַּעַרְכוּ
  choice: मोर्चा बाँधा
  rationale: ערך का सैन्य अर्थ सैनिकों को युद्ध-क्रम में लगाना है; ‘मोर्चा बाँधा’ प्रचलित, संक्षिप्त और बोधगम्य हिन्दी अभिव्यक्ति है।
- source_word: אִתָּם
  choice: उनके विरुद्ध
  rationale: मूल पूर्वसर्ग का सामान्य अर्थ ‘उनके साथ’ हो सकता है, पर युद्ध के लिए पंक्तिबद्ध होने के इस प्रसंग में विरोध का अर्थ अपेक्षित है; अस्पष्टता को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: מִלְחָמָה
  choice: युद्ध के लिए
  rationale: यह संज्ञा सैनिक व्यवस्था के उद्देश्य को बताती है; ‘युद्ध के लिए’ हिन्दी में स्वाभाविक है।
- source_word: אֶל הַגִּבְעָה
  choice: गिबा में
  rationale: אֶל सामान्यतः दिशा सूचित करता है, किंतु यहाँ सैन्य तैनाती का स्थान गिबा है; ‘गिबा में’ प्रसंगानुकूल और सहज है।
theological_decisions:
- issue: אִישׁ יִשְׂרָאֵל में पुरुषवाचक सामूहिक भाषा
  choice: इस्राएल के पुरुष
  alternative: इस्राएली सेना / इस्राएल
  rationale: इब्रानी में אִישׁ व्याकरणतः एकवचन होते हुए भी यहाँ लड़ने वाले पुरुषों के लिए सामूहिक रूप में है; अनुवाद पुरुष सैन्य समूह के संकेत को बनाए रखता है।
- issue: אִתָּם का संबंधसूचक अर्थ
  choice: उनके विरुद्ध
  alternative: उनके साथ
  rationale: पूर्वसर्ग अपने आप में साथ होने का अर्थ दे सकता है, पर युद्ध के लिए मोर्चा बाँधने के संदर्भ में दोनों पक्ष विरोधी हैं। अनुवाद प्रसंगगत अर्थ देता है और शाब्दिक विकल्प को पादटिप्पणी में रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण कथात्मक स्वर रखा गया है। ‘मोर्चा बाँधा’ सैन्य व्यवस्था को सामान्य पाठक के लिए स्पष्ट करता है; स्थान-नाम ‘गिबा’ का लिप्यंतरण किया गया है।
