  yaml_path: translation/ot/judges/020/044.yaml
  text: And eighteen thousand men from Benjamin fell[a]; all these were valiant warriors.
translation:
  language: hi
  text: बिन्यामीन के अठारह हज़ार पुरुष मारे गए; ये सभी शूरवीर योद्धा[a] थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप से, “पराक्रमी पुरुष।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְּלוּ
  choice: मारे गए
  rationale: नפל का मूल अर्थ ‘गिरना’ है, पर युद्ध के प्रसंग में यह मृत्यु में गिरने अर्थात मारे जाने को दर्शाता है। आधुनिक हिन्दी में ‘मारे गए’ आशय को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: מִבִּנְיָמִן
  choice: बिन्यामीन के
  rationale: מִן यहाँ उन पुरुषों की जनजातीय संबद्धता बताता है। ‘बिन्यामीन के’ आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: שְׁמֹנָה עָשָׂר אֶלֶף אִישׁ
  choice: अठारह हज़ार पुरुष
  rationale: इब्रानी पाठ संख्या के बाद אִישׁ को स्पष्ट रूप से रखता है; इसलिए ‘पुरुष’ का अनुवाद किया गया है, जबकि ‘सैनिक’ जोड़ना अधिक व्याख्यात्मक होता।
- source_word: אֶת כָּל אֵלֶּה
  choice: ये सभी
  rationale: यह पदबंध पहले बताए गए मारे गए पुरुषों को समष्टि रूप में फिर से इंगित करता है। ‘ये सभी’ हिन्दी में सहज है और अनावश्यक शब्द नहीं जोड़ता।
- source_word: אַנְשֵׁי חָיִל
  choice: शूरवीर योद्धा
  rationale: युद्ध-संदर्भ में यह पदबंध सामर्थ्यवान और साहसी लड़ाकों को दर्शाता है। ‘शूरवीर योद्धा’ साहस और युद्ध-कौशल दोनों को वर्तमान, स्पष्ट हिन्दी में व्यक्त करता है।
