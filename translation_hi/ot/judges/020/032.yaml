  yaml_path: translation/ot/judges/020/032.yaml
  text: And the sons of Benjamin said[a], “They are being struck down before us as at the first.” But the sons of Israel said[c][b], “Let us flee and draw them away from the city to the highways.”
translation:
  language: hi
  text: तब बिन्यामीन के लोगों ने कहा, “वे हमारे सामने पहले की तरह[a] पराजित हो रहे हैं।” पर इस्राएलियों ने कहा, “आओ, हम भागें और उन्हें[b] नगर से मुख्य मार्गों[c] की ओर खींच ले जाएँ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “पहले की तरह” से आशय इस अध्याय में पहले हुए युद्धों की तरह है।
    reason: cross_reference
  - marker: b
    text: हिब्रू में यहाँ शाब्दिक रूप से एकवचन “उसे” है, जो संभवतः बिन्यामीन या उसकी सेना को सामूहिक रूप में दर्शाता है।
    reason: lexical_alternative
  - marker: c
    text: इसका अनुवाद “सड़कों” या “राजमार्गों” भी किया जा सकता है।
    reason: lexical_alternative
