- source_word: לְפָנֵינוּ
  choice: हमारे सामने
  rationale: यह युद्ध-संबंधी सामान्य मुहावरा है, जिसका अर्थ उनके सामने अथवा उनके हाथों परास्त होना है।
- source_word: כְּבָרִאשֹׁנָה
  choice: पहले की तरह
  rationale: यह अध्याय में पहले हुए युद्धों की ओर संकेत करता है और मूल की संक्षिप्त तुलना को बनाए रखता है।
- source_word: נָנוּסָה
  choice: आओ, हम भागें
  rationale: प्रथम पुरुष बहुवचन cohortative का प्रस्तावात्मक भाव आधुनिक हिंदी में स्वाभाविक ढंग से व्यक्त होता है।
- source_word: וּנְתַקְּנֻהוּ
  choice: और उन्हें ... खींच ले जाएँ
  rationale: क्रिया का अर्थ खींचकर अलग या दूर ले जाना है। हिब्रू में कर्म-प्रत्यय एकवचन है, पर संदर्भ में वह बिन्यामीन की सामूहिक सेना को सूचित करता है; हिंदी में बहुवचन ‘उन्हें’ अधिक स्वाभाविक है और रूपगत अंतर को पादटिप्पणी में बताया गया है।
- source_word: הָעִיר
  choice: नगर
  rationale: यह गिबा के शहरी केंद्र के लिए प्रयुक्त सामान्य शब्द है; ‘नगर’ गरिमापूर्ण और सहज हिंदी है।
- source_word: הַמְסִלּוֹת
  choice: राजमार्गों
  rationale: מְסִלָּה प्रायः बने हुए या मुख्य मार्ग को दर्शाता है; बहुवचन को ‘राजमार्गों’ से सुरक्षित रखा गया है।
