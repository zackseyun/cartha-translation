source:
  edition: WLC
  text: וַ/יִּגֹּ֨ף יְהוָ֥ה אֶֽת בִּנְיָמִן֮ לִ/פְנֵ֣י יִשְׂרָאֵל֒ וַ/יַּשְׁחִיתוּ֩ בְנֵ֨י יִשְׂרָאֵ֤ל בְּ/בִנְיָמִן֙ בַּ/יּ֣וֹם הַ/ה֔וּא עֶשְׂרִ֨ים וַ/חֲמִשָּׁ֥ה אֶ֛לֶף וּ/מֵאָ֖ה אִ֑ישׁ כָּל אֵ֖לֶּה שֹׁ֥לֵף חָֽרֶב׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/035.yaml
  text: And Yahweh struck Benjamin down before Israel[a], and the sons of Israel destroyed twenty-five thousand one hundred men of Benjamin that day[b], all these drawing the sword.
translation:
  language: hi
  text: याहवे ने इस्राएल के सामने बिन्यामीन को पराजित कर दिया[a], और उस दिन इस्राएल के पुत्रों ने बिन्यामीन के पच्चीस हज़ार एक सौ पुरुषों का संहार किया। ये सभी तलवार खींचनेवाले थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘बिन्यामीन को मार गिराया।’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגֹּף
  choice: पराजित कर दिया
  rationale: सैनिक प्रसंग में נָגַף का अर्थ प्रहार करके परास्त करना है। हिंदी में ‘पराजित कर दिया’ युद्ध के परिणाम को स्वाभाविक ढंग से व्यक्त करता है; अधिक शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम יהוה का लिप्यंतरण किया गया है, उसे किसी उपाधि से नहीं बदला गया।
- source_word: לִפְנֵי יִשְׂרָאֵל
  choice: इस्राएल के सामने
  rationale: यह हिब्रू मुहावरे की स्थानिक/युद्ध-संबंधी छवि को बनाए रखता है और संकेत करता है कि बिन्यामीन इस्राएल के सम्मुख युद्ध में परास्त हुआ।
- source_word: וַיַּשְׁחִיתוּ
  choice: संहार किया
  rationale: हिफ़ील रूप यहाँ युद्ध में प्राणघातक विनाश बताता है। ‘संहार किया’ इसकी तीव्रता और सामूहिक युद्ध-संदर्भ को बनाए रखता है।
- source_word: בְנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों
  rationale: औपचारिक अभिव्यक्ति ‘इस्राएल के पुत्र’ रखी गई है; इस सैनिक प्रसंग में गिने गए योद्धा पुरुष हैं।
- source_word: בְּבִנְיָמִן
  choice: बिन्यामीन के
  rationale: यहाँ ב उस समुदाय को चिह्नित करता है जिसमें से मारे गए पुरुष गिने गए; हिंदी में संबंधकारक स्वाभाविक है।
- source_word: עֶשְׂרִים וַחֲמִשָּׁה אֶלֶף וּמֵאָה אִישׁ
  choice: पच्चीस हज़ार एक सौ पुरुषों
  rationale: संख्या और אִישׁ का सीधा, स्पष्ट हिंदी रूप है।
- source_word: כָּל אֵלֶּה
  choice: ये सभी
  rationale: यह पहले गिने गए पुरुषों की ओर लौटकर संकेत करनेवाली अभिव्यक्ति है।
- source_word: שֹׁלֵף חָרֶב
  choice: तलवार खींचनेवाले
  rationale: मूल चित्र ‘तलवार खींचना’ सुरक्षित है और इससे सशस्त्र योद्धाओं का आशय स्पष्ट होता है।
theological_decisions:
- issue: युद्ध के परिणाम में ईश्वरीय और मानवीय कर्तृत्व
  choice: याहवे ने बिन्यामीन को पराजित किया, और इस्राएल के पुत्रों ने उसके पुरुषों का संहार किया—दोनों कर्तृत्व अलग-अलग स्पष्ट रखे गए हैं।
  alternative: केवल ईश्वरीय कारण पर या केवल मानवीय सैनिक विजय पर बल देना।
  rationale: हिब्रू पाठ दोनों क्रियाओं को क्रम में रखता है और उनके संबंध को दार्शनिक रूप से नहीं समझाता। अनुवाद इस धर्मवैज्ञानिक तनाव को ज्यों का त्यों रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण मानक हिंदी। ‘इस्राएल के पुत्रों’ और ‘तलवार खींचनेवाले’ में मूल की औपचारिक छवि रखी गई है, जबकि वाक्य-विन्यास सामान्य पाठक के लिए सहज बनाया गया है।
