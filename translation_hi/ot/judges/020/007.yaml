lexical_decisions:
- source_word: הִנֵּה
  choice: देखो
  rationale: ध्यान आकर्षित करने वाले हिब्रू उद्गार का स्वाभाविक और सीधा हिन्दी रूप।
- source_word: כֻלְּכֶם בְּנֵי יִשְׂרָאֵל
  choice: तुम सब इस्राएली हो
  rationale: शाब्दिक ‘तुम सब इस्राएल के पुत्र’ आधुनिक हिन्दी में अस्वाभाविक और अनावश्यक रूप से केवल पुरुषों का बोध करा सकता है; प्रसंग में संबोधन समूचे एकत्रित इस्राएल से है।
- source_word: הָבוּ לָכֶם דָּבָר
  choice: अपना विचार ... दो
  rationale: यहाँ דָּבָר का आशय सभा के सामने प्रस्ताव, मत या निर्णय प्रस्तुत करना है; ‘वचन दो’ हिन्दी में प्रतिज्ञा करने का भ्रामक अर्थ देता।
- source_word: וְעֵצָה
  choice: और परामर्श
  rationale: עֵצָה के सलाह अथवा विचार-विमर्श संबंधी अर्थ को सीधे बनाए रखता है।
- source_word: הֲלֹם
  choice: यहीं
  rationale: सभा के इसी स्थान और अवसर पर उत्तर प्रस्तुत करने के आग्रह को व्यक्त करता है।
