  text: बिन्यामीन को छोड़कर, इस्राएल के पुरुषों की सैन्य गणना तलवार खींचनेवाले चार लाख पुरुषों की हुई; ये सभी योद्धा थे।[a][b]
  philosophy: optimal-equivalence
