  yaml_path: translation/ot/judges/020/024.yaml
  text: And the sons of Israel came near to the sons of Benjamin on the second day[a][b].
translation:
  language: hi
  text: दूसरे दिन इस्राएल के पुत्र बिन्यामीन के पुत्रों के निकट आए[a][b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “पास आए”; युद्ध के संदर्भ में “विरुद्ध आगे बढ़े” भी संभव है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में “इस्राएल के पुत्र” और “बिन्यामीन के पुत्र”; इन्हें “इस्राएली” और “बिन्यामीनियों” भी कहा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְבוּ
  choice: के निकट आए
  rationale: काल क्रिया קרב का मूल अर्थ ‘निकट आना’ है। युद्ध के संदर्भ में ‘विरुद्ध आगे बढ़े’ संभव है, पर मूल पाठ केवल उनकी ओर बढ़ने को स्पष्ट करता है; इसलिए अधिक अर्थ जोड़े बिना सीधा भाव रखा गया है।
- source_word: בְנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्र
  rationale: यह इब्रानी पारिवारिक-जनजातीय पद का सीधा रूप है और यहाँ इस्राएली युद्ध-दल को सामूहिक रूप से सूचित करता है।
- source_word: אֶל
  choice: के निकट
  rationale: संबंधबोधक אֶל दिशा या लक्ष्य, अर्थात ‘की ओर/के पास’, बताता है। युद्ध-संदर्भ होते हुए भी इसे सीधे ‘के विरुद्ध’ नहीं किया गया।
- source_word: בְנֵי בִנְיָמִן
  choice: बिन्यामीन के पुत्रों
  rationale: इब्रानी जनजातीय संबोधन का सीधा अनुवाद है और ‘इस्राएल के पुत्र’ के साथ मूल समानांतरता बनाए रखता है।
- source_word: בַּיּוֹם הַשֵּׁנִי
  choice: दूसरे दिन
  rationale: मूल में क्रमसूचक संख्या स्पष्ट है; इसलिए कथात्मक विकल्प ‘अगले दिन’ के बजाय ‘दूसरे दिन’ रखा गया है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और स्रोत के निकट रखी गई है। ‘पुत्र’ का प्रयोग दोनों जनजातीय पदों की पारिवारिक अभिव्यक्ति और समानांतरता को सुरक्षित रखता है; वैकल्पिक स्वाभाविक सामूहिक नाम पादटिप्पणी में दिए गए हैं।
