  text: מִ/כֹּ֣ל הָ/עָ֣ם הַ/זֶּ֗ה שְׁבַ֤ע מֵאוֹת֙ אִ֣ישׁ בָּח֔וּר אִטֵּ֖ר יַד יְמִינ֑/וֹ כָּל זֶ֗ה קֹלֵ֧עַ בָּ/אֶ֛בֶן אֶל הַֽ/שַּׂעֲרָ֖ה וְ/לֹ֥א יַחֲטִֽא׀־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/016.yaml
  text: From all this people[a], seven hundred chosen men were left-handed; every one of these could sling a stone at a hair and not miss.
translation:
  language: hi
  text: इन सब लोगों में से सात सौ चुने हुए पुरुष बाएँ हाथ के थे[a]। उनमें से हर एक बाल पर गोफन से पत्थर फेंक सकता था और चूकता नहीं था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से उनके दाहिने हाथ के बाधित या सीमित होने की बात है। संदर्भ में इसका अर्थ संभवतः यह है कि वे बाएँ हाथ का उपयोग करते थे।
    reason: इब्रानी मुहावरे के शाब्दिक रूप और संदर्भगत अर्थ, दोनों को सुरक्षित रखना।
lexical_decisions:
- source_word: מִכֹּל הָעָם הַזֶּה
  choice: इन सब लोगों में से
  rationale: यह अंशसूचक वाक्यांश है—पूरे समुदाय में से सात सौ पुरुष। ‘लोगों’ से मूल עָם का सामान्य अर्थ बना रहता है और ‘सैनिकों’ जैसा अतिरिक्त विशिष्टीकरण नहीं जुड़ता।
- source_word: שְׁבַע מֵאוֹת אִישׁ בָּחוּר
  choice: सात सौ चुने हुए पुरुष
  rationale: אִישׁ गिने जा रहे वयस्क पुरुषों को और בָּחוּר चुनिंदा अथवा चयनित होने को दर्शाता है।
- source_word: אִטֵּר יַד יְמִינוֹ
  choice: बाएँ हाथ से लड़नेवाले थे[a]
  rationale: इब्रानी मुहावरा शाब्दिक रूप से दाहिने हाथ के बाधित या सीमित होने की बात करता है; युद्ध के संदर्भ में आशय बाएँ हाथ का उपयोग करनेवाले योद्धाओं से है। स्वाभाविक हिन्दी मुख्य पाठ में आशय दिया गया है और शाब्दिक अनिश्चितता पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: כָּל זֶה
  choice: उनमें से हर एक
  rationale: यह वितरणात्मक अर्थ देता है और प्रत्येक पुरुष की व्यक्तिगत कुशलता पर बल देता है।
- source_word: קֹלֵעַ בָּאֶבֶן
  choice: गोफन से पत्थर मार सकता था
  rationale: कृदंत यहाँ उनकी नियमित अथवा विशिष्ट क्षमता बताता है; ‘गोफन’ सैन्य संदर्भ के उपकरण को स्पष्ट करता है।
- source_word: אֶל הַשַּׂעֲרָה
  choice: बाल को निशाना बनाकर
  rationale: एक बाल की अत्यंत सूक्ष्मता को लक्ष्य के रूप में व्यक्त करता है और हिन्दी में चित्र को स्वाभाविक रखता है।
- source_word: וְלֹא יַחֲטִא
  choice: और चूकता नहीं था
  rationale: यहाँ חטא का ठोस अर्थ निशाने से चूकना है, नैतिक अर्थ में पाप करना नहीं।
