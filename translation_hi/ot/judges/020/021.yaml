  yaml_path: translation/ot/judges/020/021.yaml
  text: Then the sons of Benjamin came out from Gibeah and struck down twenty-two thousand men of Israel that day[a].
translation:
  language: hi
  text: तब बिन्यामीन के लोग गिबा से निकल आए और उस दिन उन्होंने इस्राएल के बाईस हज़ार पुरुषों को मार गिराया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “गिबा से बाहर निकले और उस दिन इस्राएल के बाईस हज़ार पुरुषों को मार डाला।”
    reason: יצא और שׁחת के प्रसंगानुकूल वैकल्पिक, अधिक सपाट शब्दांकन को दर्ज करता है।
lexical_decisions:
- source_word: וַיֵּצְאוּ
  choice: निकल आए
  rationale: יצא का क्रमिक कथात्मक रूप नगर से युद्ध के लिए बाहर आने की अगली घटना बताता है; ‘निकल आए’ सैन्य प्रसंग में स्वाभाविक है।
- source_word: בְנֵי בִנְיָמִן
  choice: बिन्यामीन के लोग
  rationale: शाब्दिक ‘बिन्यामीन के पुत्र’ के स्थान पर यह आधुनिक हिन्दी में गोत्रीय समुदाय को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: מִן הַגִּבְעָה
  choice: गिबा से
  rationale: מִן उद्गम को सूचित करता है और הַגִּבְעָה यहाँ नगर गिबा का नाम है।
- source_word: וַיַּשְׁחִיתוּ
  choice: मार गिराया
  rationale: שׁחת के हिफ़ील रूप का मूल भाव नाश करना है; गिने हुए युद्ध-हताहतों के प्रसंग में ‘मार गिराया’ घातक सैन्य कार्रवाई और भूमि पर गिरने की छवि दोनों को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: בְיִשְׂרָאֵל
  choice: इस्राएल के
  rationale: यहाँ בְ उस समुदाय को चिह्नित करता है जिस पर घातक प्रहार हुआ; संख्या के साथ हिन्दी में ‘इस्राएल के ... पुरुषों’ स्वाभाविक है।
- source_word: בַּיּוֹם הַהוּא
  choice: उस दिन
  rationale: यह समय-सूचक पद का सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: שְׁנַיִם וְעֶשְׂרִים אֶלֶף
  choice: बाईस हज़ार
  rationale: हिब्रू संख्या का मानक आधुनिक हिन्दी रूप।
- source_word: אִישׁ
  choice: पुरुषों
  rationale: संख्या के बाद हिब्रू में एकवचन संज्ञा है, जबकि हिन्दी वाक्य-विन्यास में यहाँ बहुवचन संबंधकारक रूप चाहिए; युद्धरत पुरुष स्पष्ट हैं, पर ‘सैनिक’ मूल में व्यक्त नहीं है।
- source_word: אָרְצָה
  choice: मार गिराया
  rationale: दिशासूचक रूप का अर्थ ‘भूमि की ओर/भूमि पर’ है; अलग से ‘भूमि पर’ जोड़ने के बजाय हिन्दी का ‘मार गिराया’ इस परिणाम और छवि को संक्षेप में समेटता है।
