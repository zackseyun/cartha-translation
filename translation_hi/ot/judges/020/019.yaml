  text: Then the sons of Israel rose in the morning and camped against Gibeah[a].
translation:
  language: hi
  text: तब इस्राएली सुबह उठे और गिबा के विरुद्ध छावनी डाली।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקֻמוּ
  choice: उठे
  rationale: קום के क्रमिक कथात्मक रूप का सीधा अर्थ रखा गया है; यहाँ केवल प्रस्थान का भाव जोड़ना आवश्यक नहीं।
- source_word: בְנֵי יִשְׂרָאֵל
  choice: इस्राएली
  rationale: शाब्दिक इब्रानी मुहावरे ‘इस्राएल के पुत्र’ का आधुनिक हिंदी में स्वाभाविक सामूहिक समतुल्य ‘इस्राएली’ है; संदर्भ समस्त युद्ध-दल का है।
- source_word: בַּבֹּקֶר
  choice: सुबह
  rationale: समय-सूचक पद का सहज आधुनिक हिंदी रूप।
- source_word: וַיַּחֲנוּ
  choice: छावनी डाली
  rationale: חנה सैन्य संदर्भ में पड़ाव या शिविर स्थापित करने को दर्शाता है; ‘छावनी डाली’ प्रसंगानुकूल और सुबोध है।
- source_word: עַל
  choice: के विरुद्ध
  rationale: युद्ध-संदर्भ में यह केवल निकटता नहीं, बल्कि गिबा के सामने शत्रुतापूर्ण सैन्य स्थिति दर्शाता है।
- source_word: הַגִּבְעָה
  choice: गिबा
  rationale: इसे निश्चित उपपद सहित स्थान-नाम के रूप में पहचाना गया है; हिंदी में उपपद अलग से नहीं जोड़ा गया।
