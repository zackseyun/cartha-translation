base_translation:
  language: en
  yaml_path: translation/ot/judges/020/047.yaml
  text: But six hundred men turned and fled toward the wilderness[a], to the rock of Rimmon[b], and stayed at the rock of Rimmon four months.
translation:
  language: hi
  text: परन्तु छह सौ पुरुष मुड़े और जंगल की दिशा में, रिम्मोन की चट्टान तक भाग गए, और वे रिम्मोन की चट्टान पर चार महीने रहे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּפְנוּ
  choice: मुड़े
  rationale: क्रिया दिशा बदलने को व्यक्त करती है; युद्ध से पलटकर भागने के क्रम में ‘मुड़े’ संक्षिप्त और स्वाभाविक है।
- source_word: וַיָּנֻסוּ
  choice: भाग गए
  rationale: נוּס का सामान्य अर्थ संकट या युद्ध से भागना है; यह सैनिक प्रसंग की तात्कालिकता बनाए रखता है।
- source_word: הַמִּדְבָּרָה
  choice: जंगल की ओर
  rationale: दिशासूचक प्रत्यय जंगल-प्रदेश की ओर अथवा उसमें जाने का संकेत देता है; ‘की ओर’ इस वास्तविक अस्पष्टता को बनाए रखता है।
- source_word: אֶל סֶלַע הָרִמּוֹן
  choice: रिम्मोन की चट्टान तक
  rationale: סֶלַע को ‘चट्टान’ और संबंधसूचक इब्रानी रचना को ‘रिम्मोन की चट्टान’ के रूप में रखा गया है; ‘तक’ निर्दिष्ट गंतव्य को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: שֵׁשׁ מֵאוֹת אִישׁ
  choice: छः सौ पुरुष
  rationale: संख्या के बाद אִישׁ यहाँ युद्ध में सम्मिलित वयस्क पुरुषों की गणना करता है।
- source_word: וַיֵּשְׁבוּ
  choice: रहे
  rationale: ישׁב बैठने, बसने या ठहरे रहने का अर्थ दे सकता है; चार महीने के अस्थायी निवास के लिए ‘रहे’ सहज है और स्थायी बसावट नहीं जताता।
- source_word: בְּסֶלַע רִמּוֹן
  choice: रिम्मोन की चट्टान पर
  rationale: בְּ स्थान बताता है; किसी नामित चट्टानी शरणस्थल के लिए हिंदी में ‘पर’ स्वाभाविक है।
- source_word: אַרְבָּעָה חֳדָשִׁים
  choice: चार महीने
  rationale: यह उनके वहाँ रहने की अवधि का सीधा समय-सूचक पद है।
- source_word: וַ
  choice: परन्तु
  rationale: आरंभिक कथात्मक वाव को पिछले विनाश के विपरीत बचे हुए इन पुरुषों की ओर मोड़ दिखाने के लिए ‘परन्तु’ किया गया है।
