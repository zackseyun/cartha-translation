  rationale: एकवचन रूप यहाँ सामूहिक सैनिक समूह के लिए प्रयुक्त है; हिन्दी में बहुवचन ‘इस्राएली पुरुष’ यह अर्थ स्वाभाविक रूप से व्यक्त करता है।
- source_word: בַּמִּלְחָמָה
  choice: युद्ध में
  rationale: चल रहे युद्ध के भीतर उनके पलटने को दर्शाता है।
- source_word: וּבִנְיָמִן
  choice: बिन्यामीन
  rationale: गोत्र का नाम उसके योद्धाओं के लिए लक्षणा के रूप में आया है; मूल की अभिव्यक्ति बनाए रखी गई है।
- source_word: הֵחֵל לְהַכּוֹת חֲלָלִים
  choice: मार गिराना शुरू कर दिया
  rationale: शाब्दिक रचना अत्यंत संक्षिप्त और युद्ध-संबंधी है; हिन्दी में यह उसके आरंभिक और घातक भाव को स्वाभाविक रूप से व्यक्त करती है।
- source_word: בְּאִישׁ יִשְׂרָאֵל כִּשְׁלֹשִׁים אִישׁ
  choice: इस्राएली पुरुषों में से लगभग तीस को
  rationale: בְ समूह के भीतर से हताहत होने वालों को दिखाता है और כִּ संख्या को अनुमानित बनाता है।
- source_word: אַךְ נִגּוֹף נִגָּף הוּא
  choice: निश्चय ही इस्राएल ... पूरी तरह हार गया है
  rationale: क्रिया की धात्वर्थक पुनरुक्ति पराजय की निश्चितता और तीव्रता पर बल देती है; एकवचन सर्वनाम के सामूहिक संकेत को स्पष्ट करने के लिए ‘इस्राएल’ दोहराया गया है।
- source_word: לְפָנֵינוּ
  choice: हमारे सामने
  rationale: मूल के स्थानिक मुहावरे को बनाए रखते हुए विजय-पराजय के प्रसंग में स्वाभाविक हिन्दी देता है।
- source_word: כַּמִּלְחָמָה הָרִאשֹׁנָה
  choice: जैसा पहले युद्ध में हुआ था
  rationale: पहले युद्ध के समान परिणाम का संकेत हिन्दी में पूर्ण और स्वाभाविक वाक्यांश से व्यक्त किया गया है।
