base_translation:
  language: en
  yaml_path: translation/ot/judges/020/039.yaml
  text: Then the men of Israel turned in the battle[a], and Benjamin began to strike down the slain among the men of Israel, about thirty men, for they said, “Surely he is utterly defeated before us[b], as in the first battle.”
translation:
  language: hi
  text: तब इस्राएली पुरुष युद्ध में पलटे, और बिन्यामीन ने इस्राएली पुरुषों में से लगभग तीस को मार गिराना शुरू कर दिया[a], क्योंकि उन्होंने कहा, “निश्चय ही इस्राएल हमारे सामने पूरी तरह हार गया है[b], पहले युद्ध की तरह।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में “मारे हुए” के लिए शब्द का प्रयोग एक संक्षिप्त युद्ध-मुहावरे में हुआ है; आशय है कि बिन्यामीन इस्राएली पुरुषों को घातक रूप से मारने लगा—लगभग तीस पुरुष।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में “वह पूरी तरह हार गया है” एकवचन में है और संभवतः इस्राएल को एक सामूहिक इकाई मानकर कहा गया है; इसका अनुवाद “वे पूरी तरह हार गए हैं” भी किया जा सकता है।
    reason: lexical_alternative
