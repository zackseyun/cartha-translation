  register: आधुनिक मानक हिन्दी; कथात्मक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज। मूल के 'एक मनुष्य' वाले एकता-बिंब को सुरक्षित रखा गया है और אֶל में निहित दिशा को अनावश्यक रूप से शत्रुतापूर्ण अर्थ नहीं दिया गया।
