base_translation:
  language: en
  yaml_path: translation/ot/judges/020/011.yaml
  text: So all the men of Israel gathered to the city[a], united as one man.
translation:
  language: hi
  text: इस प्रकार इस्राएल के सभी पुरुष उस नगर की ओर एक ही मनुष्य के समान, एकजुट होकर इकट्ठे हुए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּאָסֵף
  choice: इकट्ठे हुए
  rationale: निफ़अल रूप यहाँ सामूहिक रूप से एकत्र होने का भाव देता है। हिन्दी में बहुवचन कर्ता के साथ यह स्वाभाविक है।
- source_word: כָּל אִישׁ יִשְׂרָאֵל
  choice: इस्राएल के सभी पुरुष
  rationale: सैन्य संदर्भ में यह अभिव्यक्ति इस्राएल के पुरुष योद्धाओं को सामूहिक रूप से दर्शाती है; इसलिए लिंग-निरपेक्ष अनुवाद उपयुक्त नहीं होगा।
- source_word: אֶל הָעִיר
  choice: उस नगर के पास
  rationale: אֶל दिशा या गंतव्य बताता है। मूल पाठ स्वयं स्पष्ट रूप से 'विरुद्ध' नहीं कहता; 'के पास' हिन्दी में नगर की ओर जाकर वहाँ एकत्र होने का भाव स्वाभाविक रूप से देता है।
- source_word: כְּאִישׁ אֶחָד
  choice: एक मनुष्य के समान
  rationale: यह एक होकर कार्य करने का इब्रानी मुहावरा है। अपेक्षाकृत औपचारिक रूप मूल बिंब को बनाए रखता है।
- source_word: חֲבֵרִים
  choice: एकजुट थे
  rationale: חבר से निकला यह बहुवचन रूप परस्पर जुड़े या संयुक्त होने का भाव जोड़ता है। 'एकजुट थे' आधुनिक हिन्दी में इस सामूहिक एकता को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
theological_decisions: []
