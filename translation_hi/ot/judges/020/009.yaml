  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘कार्रवाई करेंगे’ मूल में निहित सैन्य कार्य को सहज हिन्दी में व्यक्त करता है, जबकि पादटिप्पणी मूल की वास्तविक संक्षिप्तता और अर्थगत खुलापन बताती है।
