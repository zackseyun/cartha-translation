  text: וְ/עַתָּ֕ה זֶ֣ה הַ/דָּבָ֔ר אֲשֶׁ֥ר נַעֲשֶׂ֖ה לַ/גִּבְעָ֑ה עָלֶ֖י/הָ בְּ/גוֹרָֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/009.yaml
  text: 'But now this is what we will do to Gibeah: against it by lot[a].'
translation:
  language: hi
  text: 'पर अब हम गिबा के विषय में यह करेंगे: उसके विरुद्ध चिट्ठी डालकर[a]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसके विरुद्ध चिट्ठी के द्वारा।” इब्रानी वाक्य बहुत संक्षिप्त है और अंत में अलग क्रिया नहीं है। इसका आशय यह हो सकता है कि गिबा के विरुद्ध सेना की कार्रवाई चिट्ठी डालकर तय या व्यवस्थित की जाएगी।
    reason: मूल इब्रानी के संक्षिप्त, क्रियारहित अंतिम खंड तथा चिट्ठी द्वारा निर्धारित सैन्य कार्रवाई के संभावित अर्थ को सुरक्षित रखना।
lexical_decisions:
- source_word: וְעַתָּה
  choice: पर अब
  rationale: यह पद विचार-विमर्श में अगले कदम की ओर ले जाता है; ‘पर अब’ काल-सूचक और हल्के विरोधात्मक, दोनों भावों को स्वाभाविक हिन्दी में रखता है।
- source_word: זֶה הַדָּבָר אֲשֶׁר נַעֲשֶׂה
  choice: हम ... यह करेंगे
  rationale: इब्रानी के संकेतवाचक, संज्ञा और सम्बन्धवाचक उपवाक्य को आधुनिक हिन्दी की स्वाभाविक योजना-सूचक अभिव्यक्ति में रखा गया है; प्रथम पुरुष बहुवचन अपूर्ण क्रिया यहाँ भावी संकल्प बताती है।
- source_word: לַגִּבְעָה
  choice: गिबा के साथ
  rationale: ל यहाँ प्रस्तावित कार्य के लक्ष्य या सम्बन्ध को बताता है। ‘के साथ’ आरम्भिक वाक्यांश में इसे व्यापक रखता है, जबकि आगे ‘उसके विरुद्ध’ शत्रुतापूर्ण दिशा स्पष्ट करता है।
- source_word: עָלֶיהָ
  choice: उसके विरुद्ध
  rationale: सैन्य प्रसंग में עַל किसी नगर के विरुद्ध बढ़ने या कार्य करने का भाव दे सकता है। हिन्दी में नगर के लिए ‘उसके’ स्वाभाविक है।
- source_word: בְּגוֹרָל
  choice: चिट्ठी डालकर
  rationale: यह निर्णय या व्यवस्था के लिए चिट्ठी डालने को सूचित करता है। यह सामान्य पाठक के लिए ‘चिट्ठी के द्वारा’ से अधिक स्पष्ट और मुहावरेदार है।
- source_word: עָלֶיהָ בְּגוֹרָל
  choice: चिट्ठी डालकर उसके विरुद्ध कार्रवाई करेंगे
  rationale: मूल इब्रानी में यह अंश संक्षिप्त और क्रियारहित है। मुख्य पाठ में समझने योग्य हिन्दी के लिए सैन्य कार्रवाई का निहित भाव व्यक्त किया गया है, पर उसकी अनिश्चितता पादटिप्पणी में सुरक्षित रखी गई है।
theological_decisions: []
