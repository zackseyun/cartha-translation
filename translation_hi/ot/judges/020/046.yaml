base_translation:
  language: en
  yaml_path: translation/ot/judges/020/046.yaml
  text: So all who fell from Benjamin that day were twenty-five thousand men who drew the sword[a]; all these were men of valor.
translation:
  language: hi
  text: इस प्रकार उस दिन बिन्यामीन के कुल पच्चीस हज़ार तलवार खींचनेवाले पुरुष मारे गए; वे सभी वीर योद्धा थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: इस प्रकार
  rationale: यहाँ क्रिया कथानक के परिणामस्वरूप दी गई संख्या का सार प्रस्तुत करती है; ‘इस प्रकार’ उस संबंध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: כָל הַנֹּפְלִים מִבִּנְיָמִן
  choice: बिन्यामीन के कुल ... पुरुष मारे गए
  rationale: נפל युद्ध में मारे जाने का बोध देता है। हिन्दी वाक्य-विन्यास में संख्या और सैन्य विशेषण के साथ इसे अंत में ‘मारे गए’ कहना स्वाभाविक है; מן को संबंधसूचक ‘के’ से व्यक्त किया गया है।
- source_word: עֶשְׂרִים וַחֲמִשָּׁה אֶלֶף אִישׁ
  choice: पच्चीस हज़ार ... पुरुष
  rationale: मूल संख्या और איש का सीधा, स्पष्ट अनुवाद।
- source_word: שֹׁלֵף חֶרֶב
  choice: तलवार खींचनेवाले
  rationale: यह युद्ध करनेवाले सशस्त्र पुरुषों का मुहावरा है; अनुवाद मूल की तलवार खींचने की सजीव छवि को बनाए रखता है।
- source_word: בַּיּוֹם הַהוּא
  choice: उस दिन
  rationale: समय-संदर्भ का सहज और सटीक हिन्दी रूप।
- source_word: אֶת כָּל אֵלֶּה אַנְשֵׁי חָיִל
  choice: वे सभी वीर योद्धा थे
  rationale: पुनरुक्त संकेत ‘वे सभी’ से सुरक्षित है। אַנְשֵׁי חָיִל यहाँ युद्ध-संदर्भ में सामर्थ्य और वीरता वाले पुरुषों को दर्शाता है, इसलिए ‘वीर योद्धा’ स्वाभाविक और सटीक है।
