base_translation:
  language: en
  yaml_path: translation/ot/judges/020/033.yaml
  text: Then all the men of Israel rose from their place and drew up in battle formation at Baal-tamar[a], while the men lying in ambush of Israel rushed out from their place, from Maareh-geba.
translation:
  language: hi
  text: तब इस्राएल के सब पुरुष अपने स्थान से उठ खड़े हुए और बाल-तामार में युद्ध के लिए पंक्तिबद्ध हो गए। इसी बीच इस्राएल के घात लगाए हुए सैनिक अपने स्थान से, मारेह-गेबा[a] से, झपटकर निकल पड़े।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी ‘मारेह-गेबा’ को यहाँ स्थान-नाम माना गया है। इसका अर्थ ‘गेबा का खुला स्थान’ या ‘गेबा का मैदान’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹל אִישׁ יִשְׂרָאֵל
  choice: इस्राएल के सब पुरुष
  rationale: एकवचन אִישׁ, כֹל के साथ सामूहिक-वितरणात्मक अर्थ देता है; सैनिक प्रसंग में ‘सब पुरुष’ स्रोत के लिंग और सामूहिक अर्थ दोनों को बनाए रखता है।
- source_word: קָמוּ מִמְּקוֹמוֹ
  choice: अपने स्थान से उठ खड़े हुए
  rationale: बहुवचन क्रिया सामूहिक कर्ता के अनुरूप है, जबकि एकवचन प्रत्यय वितरणात्मक है; आधुनिक हिन्दी में ‘अपने स्थान’ स्वाभाविक है।
- source_word: וַיַּעַרְכוּ
  choice: युद्ध के लिए पंक्तिबद्ध हो गए
  rationale: ערך का सैनिक प्रसंग में अर्थ युद्ध-विन्यास में खड़ा होना है; यह अभिव्यक्ति अर्थ को स्पष्ट रखते हुए अनावश्यक विस्तार नहीं करती।
- source_word: בְּבַעַל תָּמָר
  choice: बाल-तामार में
  rationale: यह स्थान-नाम है, इसलिए इसका अर्थानुवाद न करके देवनागरी में लिप्यंतरण किया गया है।
- source_word: אֹרֵב יִשְׂרָאֵל
  choice: इस्राएल के घात लगाए हुए सैनिक
  rationale: संक्षिप्त इब्रानी पदबंध यहाँ इस्राएल के घात-दल को सूचित करता है; ‘सैनिक’ जोड़ने से हिन्दी में कर्ता स्पष्ट और स्वाभाविक बनता है।
- source_word: מֵגִיחַ
  choice: झपटकर निकल पड़े
  rationale: हिफ़ील कृदंत छिपे स्थान से अचानक बाहर आने या आगे बढ़ने का भाव देता है; ‘झपटकर’ घात के प्रसंग की आकस्मिकता व्यक्त करता है।
- source_word: מִמְּקוֹמוֹ
  choice: अपने स्थान से
  rationale: एकवचन प्रत्यय सामूहिक घात-दल के लिए वितरणात्मक है; हिन्दी में ‘अपने’ वचन-भेद के बिना स्वाभाविक रूप से इसे व्यक्त करता है।
- source_word: מִמַּעֲרֵה גָבַע
  choice: मारेह-गेबा
  rationale: पदबंध कठिन और अनिश्चित है तथा संभवतः स्थान-नाम है; इसलिए मुख्य पाठ में लिप्यंतरण और वैकल्पिक वर्णनात्मक अर्थ पादटिप्पणी में दिए गए हैं।
