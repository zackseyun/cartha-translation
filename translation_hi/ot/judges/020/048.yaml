base_translation:
  language: en
  yaml_path: translation/ot/judges/020/048.yaml
  text: And the men of Israel turned back against the sons of Benjamin and struck them with the edge of the sword[a], from each city, men to livestock, even all that was found[c][b]. Also all the cities that were found they set on fire.
translation:
  language: hi
  text: तब इस्राएली पुरुष बिन्यामीनियों के विरुद्ध लौटे और उन्होंने उन्हें तलवार की धार से मार डाला—नगर के लोगों से लेकर पशुओं तक, और जो कुछ भी मिला, सबको।[a] जो भी नगर उन्हें मिले, उन सबको भी उन्होंने आग के हवाले कर दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “नगर के लोगों से लेकर” के लिए प्रयुक्त हिब्रू पदबंध का अर्थ अनिश्चित है। इसका आशय संभवतः यह है कि उन्होंने नगरों के निवासियों को पूरी तरह नष्ट कर दिया, और पशुओं तथा वहाँ मिली हर वस्तु को भी नहीं छोड़ा।
    reason: textual_difficulty
lexical_decisions:
- source_word: וְאִישׁ יִשְׂרָאֵל
  choice: इस्राएली पुरुष
  rationale: एकवचन रूप यहाँ बहुवचन क्रिया के साथ सामूहिक अर्थ देता है और संदर्भ युद्धरत पुरुषों का है।
- source_word: שָׁבוּ אֶל בְּנֵי בִנְיָמִן
  choice: मुड़कर बिन्यामीनियों पर टूट पड़े
  rationale: שׁוב दिशा पलटकर लौटने को और אֶל अगले शत्रुतापूर्ण कार्य के संदर्भ में लक्ष्य को व्यक्त करता है; यह हिन्दी में स्वाभाविक युद्ध-वर्णन है।
- source_word: וַיַּכּוּם לְפִי חֶרֶב
  choice: सबको तलवार की धार से मार डाला
  rationale: נכה संदर्भ में घातक प्रहार है, और לְפִי חֶרֶב की तलवार की ‘धार/मुख’ वाली ठोस छवि को बनाए रखा गया है।
- source_word: מֵעִיר מְתֹם עַד בְּהֵמָה עַד כָּל הַנִּמְצָא
  choice: हर नगर में मनुष्यों से लेकर पशुओं तक—जो कुछ भी मिला—सबको
  rationale: दुर्बोध पदबंध का संभावित आशय नगरों के निवासियों, पशुओं और वहाँ मिली हर वस्तु के संपूर्ण विनाश से है; मुख्य पाठ इसे स्पष्ट और स्वाभाविक हिन्दी में देता है, जबकि अनिश्चितता पादटिप्पणी में सुरक्षित है।
- source_word: גַּם כָּל הֶעָרִים הַנִּמְצָאוֹת
  choice: जिन-जिन नगरों पर वे आए, उन सबको भी
  rationale: מצא का कृदंत यहाँ मार्ग में पाए या सामने आए नगरों का संकेत देता है; ‘जिन-जिन’ वितरणात्मक व्यापकता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: שִׁלְּחוּ בָאֵשׁ
  choice: आग लगा दी
  rationale: यह आग के हवाले करने का हिब्रू मुहावरा है; चुना गया रूप आधुनिक हिन्दी में स्पष्ट और सहज है।
