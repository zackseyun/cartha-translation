  choice: और हारून के पोते, एलिआज़ार के पुत्र पीनहास
  rationale: वंशावली की दोनों पीढ़ियाँ सुरक्षित रखते हुए हिन्दी में स्वाभाविक क्रम अपनाया गया है।
- source_word: עֹמֵד לְפָנָיו
  choice: उसके सामने सेवा में उपस्थित था
  rationale: עֹמֵד का कृदन्त उस समय की निरंतर स्थिति बताता है; याजकीय प्रसंग में केवल शारीरिक रूप से खड़े रहने से अधिक सेवा में उपस्थित रहने का भाव संभव है। पुल्लिंग सर्वनाम की संदर्भगत अस्पष्टता हिन्दी में बनी रहती है।
- source_word: בַּיָּמִים הָהֵם
  choice: उन दिनों
  rationale: यह इब्रानी काल-सूचक पद का निकट और स्वाभाविक हिन्दी रूप है।
- source_word: הַאוֹסִף עוֹד לָצֵאת לַמִּלְחָמָה
  choice: क्या मैं ... युद्ध करने के लिए फिर निकलूँ
  rationale: יסף और עוד मिलकर किसी कार्य को दोबारा करने का अर्थ देते हैं; सैन्य मुहावरे को सहज हिन्दी में व्यक्त किया गया है।
- source_word: עִם בְּנֵי בִנְיָמִן אָחִי
  choice: अपने भाई बिन्यामीन के वंशजों से
  rationale: युद्ध के संदर्भ में עִם प्रतिपक्ष का संकेत देता है। בְּנֵי को 'वंशजों' और אָחִי को 'अपने भाई' से व्यक्त कर गृहयुद्ध के बीच रिश्तेदारी का तनाव सुरक्षित रखा गया है।
- source_word: אִם אֶחְדָּל
  choice: या रुक जाऊँ?
  rationale: חדל का सरल आधुनिक हिन्दी अर्थ 'रुक जाना' है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: परियोजना की हिन्दी परंपरा और व्यक्तिवाचक दिव्य नाम को ध्यान में रखकर नाम का प्रचलित लिप्यंतरण चुना गया है।
- source_word: עֲלוּ
  choice: चढ़ाई करो
  rationale: बहुवचन आज्ञार्थक עלה सैन्य प्रसंग में आगे बढ़कर आक्रमण करने का संकेत देता है; 'चढ़ाई करो' हिन्दी में उस भाव को स्पष्ट रखता है।
- source_word: אֶתְּנֶנּוּ בְיָדֶךָ
  choice: मैं उसे तुम्हारे हाथ में कर दूँगा
  rationale: इब्रानी के एकवचन सामूहिक सर्वनाम और 'हाथ में देना' मुहावरे को औपचारिक निकटता के साथ रखा गया है।
theological_decisions:
- issue: לְפָנָיו में सर्वनाम का संदर्भ
  choice: ‘उसके सामने’ रखकर संदर्भ को अनिर्धारित छोड़ा गया है
  alternative: ‘सन्दूक के सामने’ अथवा ‘यहोवा के सामने’
  rationale: पिछले पद में वाचा का सन्दूक निकटतम विषय है, जबकि धार्मिक अर्थ में यहोवा भी स्वाभाविक संदर्भ हो सकते हैं। मूल पाठ इसे स्पष्ट नहीं करता, इसलिए मुख्य पाठ में अस्पष्टता सुरक्षित है।
- issue: प्रश्न में एकवचन वक्ता और उत्तर में बहुवचन आज्ञा
  choice: प्रश्न में ‘मैं’ और उत्तर में ‘चढ़ाई करो’
  alternative: दोनों को सामूहिक बहुवचन में समतल करना
  rationale: 'मूल पाठ का वचन-परिवर्तन जानबूझकर सुरक्षित रखा गया है: प्रतिनिधि के रूप में इस्राएल पूछता है, और उत्तर पूरे समुदाय को संबोधित करता है।'
- issue: बिन्यामीन के लिए एकवचन प्रत्यय
  choice: ‘उसे’
  alternative: ‘उन्हें’
  rationale: मूल का एकवचन बिन्यामीन को सामूहिक/वंशीय इकाई के रूप में देखता है; इसे बहुवचन करके तनाव को नहीं मिटाया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, कथात्मक और सामान्य पाठक के लिए सुबोध रूप। रिश्तेदारी, सामूहिक एकवचन और सर्वनाम-संदर्भ की मूल अस्पष्टता को यथासंभव सुरक्षित रखा गया है।
