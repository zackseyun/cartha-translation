  text: וּ֠/פִינְחָס בֶּן אֶלְעָזָ֨ר בֶּֽן אַהֲרֹ֜ן עֹמֵ֣ד לְ/פָנָ֗י/ו בַּ/יָּמִ֣ים הָ/הֵם֮ לֵ/אמֹר֒ הַ/אוֹסִ֨ף ע֜וֹד לָ/צֵ֧את לַ/מִּלְחָמָ֛ה עִם בְּנֵֽי בִנְיָמִ֥ן אָחִ֖/י אִם אֶחְדָּ֑ל וַ/יֹּ֤אמֶר יְהוָה֙ עֲל֔וּ כִּ֥י מָחָ֖ר אֶתְּנֶ֥/נּוּ בְ/יָדֶֽ/ךָ־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/028.yaml
  text: And Phinehas the son of Eleazar[a], son of Aaron, stood before him in those days, saying, “Shall I yet again go out to battle against the sons of Benjamin my brother, or shall I stop?” And Yahweh said, “Go up[c][b], for tomorrow I will give him into your hand.”
translation:
  language: hi
  text: और उन दिनों एलिआज़ार का पुत्र, हारून का पोता पीनहास उसके सामने खड़ा था[a]। उसने पूछा, “क्या मैं फिर अपने भाई बिन्यामीन के लोगों के विरुद्ध युद्ध करने निकलूँ, या रुक जाऊँ?” तब यहोवा ने कहा, “चढ़ाई करो, क्योंकि कल मैं उसे तेरे हाथ में दे दूँगा।”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “उसके सामने” का संदर्भ अस्पष्ट है। यह पिछले पद में उल्लिखित वाचा के सन्दूक की ओर, या यहोवा की ओर संकेत कर सकता है।
    reason: לְפָנָיו में सर्वनाम का संदर्भ मूल पाठ में स्पष्ट नहीं है; मुख्य पाठ में अस्पष्टता बनाए रखी गई है।
  - marker: b
    text: “उसे” बिन्यामीन के गोत्र को एक सामूहिक इकाई के रूप में दर्शाता है। “तेरे हाथ में दे दूँगा” विजय दिलाने का इब्रानी मुहावरा है।
    reason: मूल के सामूहिक एकवचन और בְיָדֶךָ के विजय-मुहावरे को स्पष्ट करना।
lexical_decisions:
