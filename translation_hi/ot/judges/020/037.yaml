  yaml_path: translation/ot/judges/020/037.yaml
  text: Then the men in ambush quickly rushed against Gibeah[a], and the ambush advanced and struck the whole city with the edge of the sword.
translation:
  language: hi
  text: तब घात लगाए हुए लोगों ने फुर्ती से गिबा पर धावा बोल दिया; घात में छिपा दल आगे बढ़ा[a] और उसने तलवार की धार से पूरे नगर का संहार कर दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, ‘घात ने खींचा।’ इसका आशय यह हो सकता है कि घात में छिपा दल फैलता हुआ आगे बढ़ा या नगर के भीतर आगे बढ़ता गया।
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֹרֵב
  choice: घात लगाए हुए लोग / घात में बैठा दल
  rationale: इब्रानी रूप व्याकरण की दृष्टि से एकवचन होते हुए भी यहाँ सामूहिक रूप से घातक सेना को सूचित करता है। पहले बहुवचन क्रियाओं के साथ ‘घात लगाए हुए लोगों’ और फिर एकवचन क्रियाओं के साथ ‘घात में बैठा दल’ कहना मूल के वचन-परिवर्तन को स्वाभाविक हिन्दी में दर्शाता है।
- source_word: הֵחִישׁוּ
  choice: फुर्ती से
  rationale: क्रिया शीघ्रता और तत्परता से कार्रवाई करने का भाव देती है; ‘फुर्ती से’ युद्ध-वर्णन में स्वाभाविक और स्पष्ट है।
- source_word: וַיִּפְשְׁטוּ אֶל
  choice: पर धावा बोल दिया
  rationale: इस युद्ध-संदर्भ में क्रिया का अर्थ फैलकर आगे बढ़ने अथवा आक्रमण करने से है। ‘धावा बोल दिया’ अचानक और तेज़ सैन्य आक्रमण का स्वाभाविक हिन्दी रूप है।
- source_word: הַגִּבְעָה
  choice: गिबा
  rationale: स्थान-नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: וַיִּמְשֹׁךְ
  choice: आगे बढ़ा
  rationale: मूल क्रिया का सामान्य अर्थ ‘खींचना’ है, पर यहाँ संभवतः घातक दल के फैलकर या दबाव बनाते हुए नगर में आगे बढ़ने को व्यक्त करती है। मुख्य पाठ में प्रसंगानुकूल अर्थ दिया गया और शाब्दिक अनिश्चितता पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: וַיַּךְ
  choice: मार डाला
  rationale: ‘तलवार की धार से’ के साथ यह क्रिया यहाँ प्राणघातक प्रहार को सूचित करती है; ‘मार डाला’ आधुनिक हिन्दी में परिणाम को स्पष्ट करता है।
- source_word: כָּל הָעִיר
  choice: पूरे नगर को
  rationale: यह मूल के ‘समस्त नगर’ वाले सामूहिक मुहावरे को बनाए रखता है और इसे केवल निवासियों तक स्पष्ट रूप से सीमित नहीं करता।
- source_word: לְפִי חָרֶב
  choice: तलवार की धार से
  rationale: शाब्दिक अर्थ ‘तलवार के मुँह से’ है। ‘तलवार की धार से’ हिन्दी में अर्थ और मूल बिंब दोनों को स्वाभाविक रूप से व्यक्त करता है।
