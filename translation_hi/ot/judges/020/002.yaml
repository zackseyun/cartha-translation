  text: וַ/יִּֽתְיַצְּב֞וּ פִּנּ֣וֹת כָּל הָ/עָ֗ם כֹּ֚ל שִׁבְטֵ֣י יִשְׂרָאֵ֔ל בִּ/קְהַ֖ל עַ֣ם הָ/אֱלֹהִ֑ים אַרְבַּ֨ע מֵא֥וֹת אֶ֛לֶף אִ֥ישׁ רַגְלִ֖י שֹׁ֥לֵֽף חָֽרֶב־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/002.yaml
  text: And the chiefs of all the people[a], of all the tribes of Israel, took their stand in the assembly of the people of God—four hundred thousand foot soldiers drawing the sword.
translation:
  language: hi
  text: और सारी प्रजा के प्रधान, अर्थात् इस्राएल के सभी गोत्रों के प्रधान, परमेश्वर की प्रजा की सभा में खड़े हो गए—तलवार खींचे हुए चार लाख पैदल सैनिक।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתְיַצְּבוּ
  choice: आकर खड़े हो गए
  rationale: हित्पएल रूप किसी स्थान पर स्वयं उपस्थित होकर मोर्चा लेने या खड़े होने का भाव देता है; यह हिन्दी में स्वाभाविक रहते हुए तत्परता का संकेत भी बनाए रखता है।
- source_word: פִּנּוֹת כָּל־הָעָם
  choice: सारी प्रजा के प्रधान
  rationale: פִּנּוֹת का शाब्दिक अर्थ ‘कोने’ है, पर यहाँ यह प्रमुख या अगुआ व्यक्तियों के लिए प्रयुक्त रूपक है। ‘प्रधान’ इस नेतृत्वार्थ को संक्षेप और गरिमा से व्यक्त करता है।
- source_word: כֹּל שִׁבְטֵי יִשְׂרָאֵל
  choice: इस्राएल के सभी गोत्रों में से
  rationale: यह वाक्यांश एकत्र प्रजा के प्रधानों का दायरा स्पष्ट करता है। हिन्दी में ‘में से’ जोड़ने से यह संबंध स्वाभाविक और असंदिग्ध बनता है।
- source_word: בִּקְהַל
  choice: सभा में
  rationale: קהל एकत्र समुदाय या सभा को दर्शाता है; ‘सभा’ आधुनिक हिन्दी में सहज है और अनावश्यक कलीसियाई अर्थ नहीं जोड़ता।
- source_word: עַם הָאֱלֹהִים
  choice: परमेश्वर की प्रजा
  rationale: यह मूल संबंधवाचक संरचना और इस्राएल की परमेश्वर से सामुदायिक पहचान को सीधे सुरक्षित रखता है।
- source_word: אַרְבַּע מֵאוֹת אֶלֶף
  choice: चार लाख
  rationale: हिन्दी की मानक संख्या-पद्धति में 400,000 का स्वाभाविक और सटीक रूप।
- source_word: אִישׁ רַגְלִי
  choice: पैदल सैनिक
  rationale: शाब्दिक ‘पैदल पुरुष’ का सैन्य संदर्भ में स्वाभाविक हिन्दी समतुल्य, जो घुड़सवारों से भेद बनाए रखता है।
- source_word: שֹׁלֵף חָרֶב
  choice: जो तलवार खींचे हुए थे
  rationale: एकवचन कृदन्त बड़ी सामूहिक संख्या के बाद वितरणात्मक/वर्गगत भाव रखता है। हिन्दी बहुवचन उपवाक्य युद्ध के लिए तैयार होने की सजीव छवि को स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: עַם הָאֱלֹהִים का अनुवाद
  choice: परमेश्वर की प्रजा
  alternative: परमेश्वर के लोग
  rationale: ‘परमेश्वर की प्रजा’ मूल संबंधवाचक संरचना, सामूहिक पहचान और प्रसंग की गरिमा बनाए रखती है, बिना किसी अतिरिक्त सांप्रदायिक अर्थ के।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट और सार्वजनिक पाठ के अनुकूल शैली। ‘गोत्र’, ‘प्रजा’ और ‘परमेश्वर’ बाइबलीय प्रसंग की गंभीरता रखते हैं, जबकि वाक्य-विन्यास सामान्य पाठक के लिए सहज बनाया गया है।
