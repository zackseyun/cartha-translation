- from: दूसरे दिन बिन्यामीन गिबा से उनका सामना करने निकला[a], और उसके लोगों ने इस्राएलियों[b] के अठारह हज़ार और पुरुषों को मारकर धरती पर गिरा दिया; ये सभी तलवार खींचनेवाले पुरुष थे।
  to: दूसरे दिन बिन्यामीन गिबा से उनका सामना करने निकला[a], और उन्होंने इस्राएलियों[b] में से और अठारह हज़ार पुरुषों को धरती पर मार गिराया; वे सभी तलवार खींचनेवाले पुरुष थे।
  rationale: The revision removes the unneeded explicative noun ‘उसके लोगों’ while retaining the source’s collective-singular name followed by plural action through ‘उन्होंने.’ It also changes the placement of ‘और’ so that the additional sense of עוֹד is clear and idiomatic. The footnote anchors and their content remain valid.
