  edition: WLC
  text: וַ/יֵּצֵא֩ בִנְיָמִ֨ן לִ/קְרָאתָ֥/ם מִֽן הַ/גִּבְעָה֮ בַּ/יּ֣וֹם הַ/שֵּׁנִי֒ וַ/יַּשְׁחִיתוּ֩ בִ/בְנֵ֨י יִשְׂרָאֵ֜ל ע֗וֹד שְׁמֹנַ֨ת עָשָׂ֥ר אֶ֛לֶף אִ֖ישׁ אָ֑רְצָ/ה כָּל אֵ֖לֶּה שֹׁ֥לְפֵי חָֽרֶב׀׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/025.yaml
  text: Benjamin came out from Gibeah to meet them on the second day[a], and they struck down another eighteen thousand men of Israel to the ground[b]; all these were drawing the sword.
translation:
  language: hi
  text: दूसरे दिन बिन्यामीन गिबा से उनका सामना करने निकला[a], और उन्होंने इस्राएलियों[b] में से और अठारह हज़ार पुरुषों को धरती पर मार गिराया; वे सभी तलवार खींचनेवाले पुरुष थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उनके विरुद्ध निकल पड़ा”; इब्रानी अभिव्यक्ति युद्ध के संदर्भ में शत्रुतापूर्ण मुठभेड़ का संकेत दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से “इस्राएल के पुत्रों।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא בִנְיָמִן
  choice: बिन्यामीन…निकला
  rationale: एकवचन क्रिया और सामूहिक जातीय नाम को बनाए रखता है; अगले खंड में बहुवचन कर्ता को स्वाभाविक हिंदी में ‘उसके लोगों’ से स्पष्ट किया गया है।
- source_word: לִקְרָאתָם
  choice: उनका सामना करने
  rationale: मूल अभिव्यक्ति मिलने या सामना करने का अर्थ दे सकती है; युद्ध-संदर्भ की शत्रुता को बिना अनावश्यक विस्तार के व्यक्त करती है।
- source_word: מִן הַגִּבְעָה
  choice: गिबा से
  rationale: स्थान से बाहर आने के सरल स्रोत-सूचक अर्थ को व्यक्त करता है।
- source_word: בַּיּוֹם הַשֵּׁנִי
  choice: दूसरे दिन
  rationale: इब्रानी क्रमवाचक अभिव्यक्ति का सीधा और स्वाभाविक अनुवाद।
- source_word: וַיַּשְׁחִיתוּ
  choice: मारकर…गिरा दिया
  rationale: युद्ध और मृतकों की संख्या के संदर्भ में हिफ़ील क्रिया के विनाशकारी, प्राणघातक अर्थ को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: בִבְנֵי יִשְׂרָאֵל
  choice: इस्राएलियों के
  rationale: प्रभावित समूह को आधुनिक हिंदी में सहज रूप से व्यक्त करता है; शाब्दिक पारिवारिक-राष्ट्रीय रूप फुटनोट में सुरक्षित है।
- source_word: עוֹד
  choice: और
  rationale: पिछले दिन की हानि में इस संख्या के अतिरिक्त होने का भाव देता है।
- source_word: שְׁמֹנַת עָשָׂר אֶלֶף אִישׁ
  choice: अठारह हज़ार…पुरुषों
  rationale: संख्या और אִישׁ के पुरुष-वाचक अर्थ को बनाए रखता है; संदर्भ से उनका योद्धा होना स्पष्ट है।
- source_word: אָרְצָה
  choice: धरती पर गिरा दिया
  rationale: दिशासूचक रूप के युद्ध-संदर्भीय मुहावरे को स्पष्ट और चित्रात्मक हिंदी में व्यक्त करता है।
- source_word: כָּל אֵלֶּה שֹׁלְפֵי חָרֶב
  choice: ये सभी तलवार खींचनेवाले पुरुष थे
  rationale: मूल के जीवंत कृदंत ‘तलवार खींचनेवाले’ को बनाए रखता है और पुरुष-वाचक संदर्भ स्पष्ट करता है।
