  text: וְ/הֵ֨מָּה לָקְח֜וּ אֵ֧ת אֲשֶׁר עָשָׂ֣ה מִיכָ֗ה וְֽ/אֶת הַ/כֹּהֵן֮ אֲשֶׁ֣ר הָיָה ל/וֹ֒ וַ/יָּבֹ֣אוּ עַל לַ֗יִשׁ עַל עַם֙ שֹׁקֵ֣ט וּ/בֹטֵ֔חַ וַ/יַּכּ֥וּ אוֹתָ֖/ם לְ/פִי חָ֑רֶב וְ/אֶת הָ/עִ֖יר שָׂרְפ֥וּ בָ/אֵֽשׁ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/027.yaml
  text: So they took what Micah had made[a], along with the priest who belonged to him, and came against Laish, against a people quiet and secure. They struck them with the edge of the sword and burned the city with fire.
translation:
  language: hi
  text: तब वे मीका की बनाई हुई वस्तुएँ और उसके याजक को लेकर लैश के विरुद्ध आए, उस जनसमुदाय के विरुद्ध जो शांत और सुरक्षित था। उन्होंने उन्हें तलवार की धार से मारा[a] और नगर को आग से जला दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से ‘तलवार के मुँह से’; यह तलवार की धार से मारने का मुहावरा है।
    reason: इब्रानी मुहावरे के शाब्दिक रूप और अनूदित अर्थ को स्पष्ट करना।
lexical_decisions:
- source_word: וְהֵמָּה לָקְחוּ
  choice: तब वे ... लेकर
  rationale: स्वतंत्र सर्वनाम से आए कर्ता-बल और कथा की निरंतरता को स्वाभाविक हिन्दी में बनाए रखता है; לָקְחוּ का व्यापक अर्थ ‘लेना’ वस्तुओं और याजक दोनों के लिए उपयुक्त है।
- source_word: אֵת אֲשֶׁר עָשָׂה מִיכָה
  choice: मीका की बनाई हुई वस्तुएँ
  rationale: संदर्भ में यह मीका द्वारा बनवाई गई उपासना-वस्तुओं की ओर संकेत करता है। बहुवचन ‘वस्तुएँ’ हिन्दी में संदर्भ को स्पष्ट करता है, बिना उनकी सूची इस पद में जोड़ने के।
- source_word: וְאֶת הַכֹּהֵן אֲשֶׁר הָיָה לוֹ
  choice: और उसके याजक को
  rationale: शाब्दिक भाव ‘जो उसके लिए/उसका था’ है। ‘उसके याजक’ मीका से याजक के संबंध को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है, पर दास-संपत्ति का अनावश्यक संकेत नहीं देता।
- source_word: וַיָּבֹאוּ עַל לַיִשׁ
  choice: लैश पर चढ़ आए
  rationale: בוא על का यहाँ सैनिक और शत्रुतापूर्ण भाव है। ‘पर चढ़ आए’ आक्रमण के लिए आने का अर्थ रखता है, जबकि अगले वाक्य में वास्तविक प्रहार अलग रहता है।
- source_word: עַל עַם שֹׁקֵט וּבֹטֵחַ
  choice: ऐसे लोगों पर जो शांत और सुरक्षित थे
  rationale: שֹׁקֵט शांति/निश्चलता और בֹטֵחַ सुरक्षा/निश्चिंतता का भाव देता है। यह अनुवाद दोनों गुणों को अलग रखते हुए ‘बेखबर’ जैसा अतिरिक्त अर्थ नहीं जोड़ता।
- source_word: וַיַּכּוּ אוֹתָם לְפִי חָרֶב
  choice: उन्होंने उन्हें तलवार की धार से मारा
  rationale: נכה का व्यापक अर्थ ‘मारना/प्रहार करना’ है और לְפִי חָרֶב तलवार द्वारा घातक हिंसा का रूढ़ मुहावरा है। ‘मारा’ मूल की क्रियात्मक व्यापकता रखता है; ‘तलवार की धार’ मुहावरे का स्वाभाविक हिन्दी रूप है।
- source_word: וְאֶת הָעִיר שָׂרְפוּ בָאֵשׁ
  choice: और नगर को आग से जला दिया
  rationale: मूल में ‘आग से’ स्पष्ट रूप से आया है; इसे रखने से इब्रानी की तीव्रता और चित्रात्मकता बनी रहती है।
