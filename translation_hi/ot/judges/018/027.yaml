translation_notes:
  register: आधुनिक मानक हिन्दी, कथात्मक और गरिमापूर्ण शैली। ‘याजक’ और ‘नगर’ जैसे परिचित बाइबलीय शब्द रखे गए हैं। वाक्य स्वाभाविक बनाया गया है, पर आक्रमण, लोगों की शांत-सुरक्षित दशा और तलवार वाले मुहावरे की मूल संरचना सुरक्षित रखी गई है।
