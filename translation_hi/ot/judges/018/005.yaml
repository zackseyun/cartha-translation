  edition: WLC
  text: וַ/יֹּ֥אמְרוּ ל֖/וֹ שְׁאַל נָ֣א בֵ/אלֹהִ֑ים וְ/נֵ֣דְעָ֔ה הֲ/תַצְלִ֣יחַ דַּרְכֵּ֔/נוּ אֲשֶׁ֥ר אֲנַ֖חְנוּ הֹלְכִ֥ים עָלֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/005.yaml
  text: And they said to him[a], “Please inquire of God, so that we may know whether the journey on which we are going will succeed.”
translation:
  language: hi
  text: तब उन्होंने उससे कहा, “कृपया परमेश्वर से पूछो, ताकि हम जान सकें कि हमारा मार्ग, जिस पर हम जा रहे हैं, सफल होगा या नहीं।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמְרוּ לוֹ
  choice: तब उन्होंने उससे कहा
  rationale: वय्यिक्तोल कथानक की अगली घटना बताता है। आधुनिक हिन्दी में ‘तब’ घटनाक्रम को स्वाभाविक रूप से आगे बढ़ाता है, बिना कोई अतिरिक्त कारणात्मक अर्थ जोड़े।
- source_word: שְׁאַל נָא
  choice: कृपया ... से पूछो
  rationale: שׁאל के साथ נָא विनम्र अनुरोध है। ‘कृपया’ उस विनम्रता को व्यक्त करता है और ‘पूछो’ सामान्य पाठक के लिए सहज है।
- source_word: בֵאלֹהִים
  choice: परमेश्वर से
  rationale: इस प्रसंग में אֱלֹהִים का एकवचन अर्थ स्वाभाविक है। שׁאל के साथ ב उस सत्ता से दैवी मार्गदर्शन पूछने का भाव देता है।
- source_word: וְנֵדְעָה
  choice: ताकि हम जान सकें
  rationale: यहाँ रूप अनुरोध के उद्देश्य या अपेक्षित परिणाम को व्यक्त करता है; ‘ताकि’ इस संबंध को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: הֲתַצְלִיחַ
  choice: सफल होगा या नहीं
  rationale: הֲ प्रश्नवाचकता व्यक्त करता है और צלח का हिफ़ील रूप सफल होने या फलने का अर्थ देता है। हिन्दी का ‘या नहीं’ अप्रत्यक्ष हाँ-नहीं प्रश्न को स्पष्ट और स्वाभाविक बनाता है।
- source_word: דַּרְכֵּנוּ
  choice: जिस मार्ग
  rationale: ‘मार्ग’ मूल इब्रानी बिंब को बनाए रखता है; प्रत्यय ‘हमारा’ है, पर अगला संबंधवाचक उपवाक्य ‘जिस मार्ग पर हम जा रहे हैं’ हिन्दी में उसी संबंध को स्पष्ट कर देता है और बोझिल पुनरुक्ति से बचाता है।
- source_word: אֲשֶׁר אֲנַחְנוּ הֹלְכִים עָלֶיהָ
  choice: जिस मार्ग पर हम जा रहे हैं
  rationale: यह अनुवाद मूल के ‘जिस पर हम जा रहे हैं’ वाले स्थानगत बिंब और संबंधवाचक संरचना को स्वाभाविक हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: אֱלֹהִים का संदर्भ
  choice: परमेश्वर (एकवचन)
  alternative: देवताओं
  rationale: रूप व्याकरणतः बहुवचन अर्थ भी दे सकता है, पर तत्काल प्रसंग में पुरोहित से दैवी मार्गदर्शन पूछने की बात है और एकवचन संदर्भ सर्वाधिक स्वाभाविक है। यह प्रसंगाधारित शब्दार्थ निर्णय है, कोई सांप्रदायिक विस्तार नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सरल, गरिमापूर्ण और कथात्मक है। ‘मार्ग’ मूल इब्रानी रूपक को बचाता है, जबकि पूरी वाक्य-रचना सामान्य पाठक के लिए सहज रखी गई है।
