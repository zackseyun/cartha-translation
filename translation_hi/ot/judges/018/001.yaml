base_translation:
  language: en
  yaml_path: translation/ot/judges/018/001.yaml
  text: In those days there was no king in Israel[a]. And in those days the tribe of the Danites was seeking for itself an inheritance to dwell in[b], because up to that day no inheritance had fallen to it among the tribes of Israel.
translation:
  language: hi
  text: उन दिनों इस्राएल में कोई राजा नहीं था। उन दिनों दान का गोत्र अपने बसने के लिए विरासत की भूमि खोज रहा था, क्योंकि उस दिन तक इस्राएल के गोत्रों के बीच उसे विरासत की भूमि नहीं मिली थी।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उसे विरासत नहीं पड़ी थी”; अर्थात गोत्रों को बाँटी गई भूमि में उसका हिस्सा नहीं आया था।
    reason: lexical_alternative
lexical_decisions:
