  choice: इस्राएल में कोई राजा नहीं था
  rationale: अस्तित्ववाचक निषेध और स्थानवाचक पद का स्वाभाविक हिन्दी रूप; कथन को ऐतिहासिक-राजनीतिक स्तर पर ही रखता है।
- source_word: שֵׁבֶט הַדָּנִי
  choice: दान का गोत्र
  rationale: दान से सम्बद्ध जनजातीय समूह के लिए प्रचलित, संक्षिप्त और स्पष्ट हिन्दी अभिव्यक्ति।
- source_word: מְבַקֵּשׁ לוֹ
  choice: अपने लिए ... खोज रहा था
  rationale: कृदन्त की जारी क्रिया और सामूहिक एकवचन गोत्र के आत्मवाचक अर्थ—दोनों को सुरक्षित रखता है।
- source_word: נַחֲלָה לָשֶׁבֶת
  choice: अपने बसने के लिए विरासत की भूमि
  rationale: נַחֲלָה के पैतृक/आवंटित भूभाग के अर्थ और ישׁב के बसने के प्रसंग को सहज हिन्दी में व्यक्त करता है।
- source_word: לֹא נָפְלָה לוֹ ... בְּנַחֲלָה
  choice: उसे विरासत की भूमि नहीं मिली थी
  rationale: भूमि के चिट्ठी या बँटवारे में किसी गोत्र के हिस्से आने वाले इब्रानी मुहावरे का अर्थ स्पष्ट करता है; शाब्दिक बिंब पादटिप्पणी में सुरक्षित है।
- source_word: עַד הַיּוֹם הַהוּא
  choice: उस दिन तक
  rationale: कथा के पूर्वदृष्टिपरक समय-संदर्भ का सीधा और स्वाभाविक अनुवाद।
- source_word: בְּתוֹךְ שִׁבְטֵי יִשְׂרָאֵל
  choice: इस्राएल के गोत्रों के बीच
  rationale: समूह के भीतर वितरण के अर्थ को स्वाभाविक हिन्दी में बनाए रखता है।
theological_decisions:
- issue: “इस्राएल में कोई राजा नहीं था” कथन का आशय
  choice: इसे बिना अतिरिक्त व्याख्या के ऐतिहासिक-राजनीतिक कथन के रूप में रखा गया है।
  alternative: इसे राजतंत्र के स्पष्ट समर्थन या न्यायियों के युग की तीखी निन्दा के रूप में विस्तार देना।
  rationale: इब्रानी पाठ केवल स्थिति बताता है; अनुवाद को न तो राजतंत्र का समर्थन जोड़ना चाहिए, न कथन की सम्भावित कथात्मक आलोचना को निष्प्रभावी करना चाहिए।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली। “विरासत की भूमि” से נַחֲלָה का केवल सामान्य उत्तराधिकार नहीं, बल्कि गोत्र को मिला भूभाग स्पष्ट होता है। पादटिप्पणी-चिह्न उसी वाक्य के अंत में रखा गया है जिसके मुहावरे को वह समझाता है।
