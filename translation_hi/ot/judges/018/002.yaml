  yaml_path: translation/ot/judges/018/002.yaml
  text: So the sons of Dan sent five men from their clan[a], from among their whole number, valiant men from Zorah and from Eshtaol, to spy out the land and to explore it. And they said to them, “Go, explore the land.” So they came to the hill country of Ephraim, as far as the house of Micah[c][b], and spent the night there.
translation:
  language: hi
  text: तब दान के वंशजों ने अपने कुल के लोगों में से, अर्थात् अपने समुदाय में से, पाँच समर्थ पुरुषों को—सोरा और एश्ताओल से—उस देश की जासूसी करने और उसकी छानबीन करने के लिए भेजा। उन्होंने उनसे कहा, “जाओ, देश की छानबीन करो।” वे एप्रैम के पहाड़ी प्रदेश में मीका के घर[c] तक पहुँचे और वहाँ रात बिताई।
  philosophy: optimal-equivalence
  footnotes:
  - marker: c
    text: इब्रानी में “मीका का घर”; इसका अर्थ मीका का घराना या उसका आवास-परिसर भी हो सकता है।
    reason: cultural_note
lexical_decisions:
- source_word: בְנֵי דָן
  choice: दान के वंशज
  rationale: इब्रानी के पारिवारिक-जनजातीय मुहावरे को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; यहाँ आशय दान के वास्तविक पुत्रों से नहीं, दानवंशियों से है।
- source_word: מִמִּשְׁפַּחְתָּם
  choice: अपने कुल में से
  rationale: מִשְׁפָּחָה यहाँ जनजाति के भीतर के कुल अथवा गोत्र-सदृश संबंध-समूह को दर्शाता है; ‘परिवार’ बहुत संकीर्ण और ‘गोत्र’ आधुनिक पाठकों के लिए भिन्न सांस्कृतिक अर्थ दे सकता है।
- source_word: מִקְצוֹתָם
  choice: अपने लोगों में से
  rationale: शाब्दिक ‘उनके सिरों/छोरों में से’ के बजाय पदबंध के अंशवाचक अर्थ को व्यक्त करता है—पूरे समुदाय में से कुछ व्यक्तियों का चयन।
- source_word: אֲנָשִׁים בְּנֵי חַיִל
  choice: समर्थ पुरुष
  rationale: בְּנֵי חַיִל सामर्थ्य, योग्यता और वीरता का संकेत दे सकता है। जासूसी के प्रसंग में ‘समर्थ’ उपयुक्तता और क्षमता को व्यक्त करता है, जबकि वीरता का संभावित अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: לְרַגֵּל
  choice: जासूसी करने
  rationale: भूमि का गुप्त रूप से निरीक्षण करने और सामरिक जानकारी जुटाने का आशय स्पष्ट करता है।
- source_word: וּלְחָקְרָהּ / חִקְרוּ
  choice: छानबीन करने / छानबीन करो
  rationale: חקר के सावधानीपूर्वक जाँचने और खोजबीन करने के अर्थ को दोनों स्थानों पर एकरूपता से व्यक्त करता है।
- source_word: הַר אֶפְרַיִם
  choice: एप्रैम का पहाड़ी प्रदेश
  rationale: यह किसी एक पर्वत के बजाय एप्रैम के उच्चभूमि क्षेत्र का भौगोलिक नाम है।
- source_word: עַד בֵּית מִיכָה
  choice: मीका के घर तक
  rationale: עַד की सीमासूचक दिशा और בֵּית מִיכָה के मूल अर्थ दोनों को सहज हिन्दी में बनाए रखता है।
- source_word: וַיָּלִינוּ שָׁם
  choice: वहाँ रात बिताई
  rationale: לון के रातभर ठहरने के अर्थ का स्पष्ट और वर्तमान हिन्दी रूप।
