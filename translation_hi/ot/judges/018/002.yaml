  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण वर्णनात्मक रजिस्टर अपनाया गया है। ‘दान के वंशज’, ‘पहाड़ी प्रदेश’ और ‘रात बिताई’ जैसे रूप शाब्दिक संरचना के आशय को सामान्य पाठक के लिए स्पष्ट रखते हैं। ‘चुना ... और भेजा’ इब्रानी के ‘समुदाय में से पाँच पुरुष भेजे’ वाले चयनार्थक आशय को स्वाभाविक हिन्दी वाक्य-विन्यास में व्यक्त करता है।
