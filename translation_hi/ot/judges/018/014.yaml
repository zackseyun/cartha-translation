source:
  edition: WLC
  text: וַֽ/יַּעֲנ֞וּ חֲמֵ֣שֶׁת הָ/אֲנָשִׁ֗ים הַ/הֹלְכִים֮ לְ/רַגֵּל֮ אֶת הָ/אָ֣רֶץ לַיִשׁ֒ וַ/יֹּֽאמְרוּ֙ אֶל אֲחֵי/הֶ֔ם הַ/יְדַעְתֶּ֗ם כִּ֠י יֵ֣שׁ בַּ/בָּתִּ֤ים הָ/אֵ֨לֶּה֙ אֵפ֣וֹד וּ/תְרָפִ֔ים וּ/פֶ֖סֶל וּ/מַסֵּכָ֑ה וְ/עַתָּ֖ה דְּע֥וּ מַֽה תַּעֲשֽׂוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/014.yaml
  text: Then the five men who had gone to spy out the land of Laish answered and said to their brothers[a], “Do you know that in these houses there are an ephod, teraphim, a carved image, and a cast image? So now[b], know what you will do.”
translation:
  language: hi
  text: तब उन पाँच पुरुषों ने, जो लैश के प्रदेश की टोह लेने गए थे, अपने भाइयों को उत्तर दिया और कहा, “क्या तुम जानते हो कि इन घरों में एक एपोद, तराफ़ीम[a], एक तराशी हुई मूर्ति और एक ढली हुई मूर्ति[b] हैं? इसलिए अब सोच लो कि तुम्हें क्या करना है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में “तराफ़ीम”; यह शब्द घरेलू उपासना से जुड़ी मूर्तियों या गृह-देवताओं को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: अर्थात साँचे में, सम्भवतः धातु से, ढालकर बनाई गई मूर्ति; परम्परागत अनुवादों में “पिघली हुई मूर्ति” भी मिलता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲנוּ ... וַיֹּאמְרוּ
  choice: उत्तर दिया और कहा
  rationale: इब्रानी की दोहरी कथात्मक अभिव्यक्ति को बनाए रखता है, भले ही इसके ठीक पहले कोई कथन उद्धृत नहीं है।
- source_word: הַהֹלְכִים לְרַגֵּל
  choice: टोह लेने गए थे
  rationale: इन पुरुषों के पहले ही किए जा चुके गुप्त निरीक्षण के मिशन को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: אֶת־הָאָרֶץ לַיִשׁ
  choice: लैश के प्रदेश
  rationale: यहाँ אֶרֶץ पृथ्वी नहीं, लैश से जुड़ा भूभाग है; ‘प्रदेश’ इस स्थानीय अर्थ को स्पष्ट करता है।
- source_word: אֶל־אֲחֵיהֶם
  choice: अपने भाइयों को
  rationale: शाब्दिक संबंधसूचक शब्द को बनाए रखता है; संदर्भ में ये दानवंशी पुरुषों के साथी हैं।
- source_word: אֵפוֹד
  choice: एपोद
  rationale: विशिष्ट उपासना-संबंधी वस्तु का लिप्यंतरण अनावश्यक रूप से उसका स्वरूप निर्धारित नहीं करता।
- source_word: תְרָפִים
  choice: गृह-देवताओं की मूर्तियाँ
  rationale: सामान्य पाठक के लिए संभावित अर्थ सुलभ बनाता है, जबकि पादटिप्पणी में इब्रानी पद और उसकी अर्थगत अनिश्चितता सुरक्षित है।
- source_word: פֶסֶל
  choice: खुदी हुई मूर्ति
  rationale: तराशकर या खोदकर बनाई गई प्रतिमा का ठोस अर्थ देता है और इसे सामान्य ‘मूर्ति’ में नहीं मिलाता।
- source_word: מַסֵּכָה
  choice: ढली हुई मूर्ति
  rationale: साँचे में ढालकर बनाई गई प्रतिमा का अर्थ देता है और פֶסֶל से इसका भेद बनाए रखता है।
- source_word: דְּעוּ מַה־תַּעֲשׂוּן
  choice: सोच लो कि तुम्हें क्या करना है
  rationale: शाब्दिक ‘जान लो कि तुम क्या करोगे’ के आशय—आगामी कार्रवाई पर विचार कर निर्णय करना—को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: मीका के उपासनास्थल की वस्तुओं का वर्णन
  choice: एपोद, गृह-देवताओं की मूर्तियाँ, खुदी हुई मूर्ति और ढली हुई मूर्ति—चारों पदों को अलग रखा गया है।
  alternative: सभी को सामान्यतः ‘मूर्तियाँ’ या ‘देवमूर्तियाँ’ कहना।
  rationale: अलग-अलग इब्रानी शब्दों को एक श्रेणी में मिला देने से पाठ में उपस्थित वस्तुगत भेद मिट जाएगा और अनावश्यक व्याख्या जुड़ जाएगी।
- issue: תְרָפִים का अर्थ
  choice: मुख्य पाठ में ‘गृह-देवताओं की मूर्तियाँ’, पादटिप्पणी में ‘तराफ़ीम’।
  alternative: मुख्य पाठ में केवल ‘तराफ़ीम’ या ‘गृहदेवता’।
  rationale: यह चयन पठनीयता और स्रोतगत अनिश्चितता दोनों को संतुलित करता है; पद ऐसी घरेलू उपासना-वस्तुओं या देवताओं की प्रतिमाओं को सूचित कर सकता है।
- issue: अंतिम आदेश का भाव
  choice: ‘सोच लो कि तुम्हें क्या करना है।’
  alternative: ‘जान लो कि तुम क्या करोगे।’
  rationale: इब्रानी आदेश को निर्णय और कार्रवाई के आह्वान के रूप में स्वाभाविक हिन्दी में व्यक्त किया गया है, बिना यह बताए कि उन्हें कौन-सा निर्णय लेना चाहिए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक रखी गई है। ‘टोह लेना’ सामान्य पाठक के लिए सहज है; ‘एपोद’ जैसे विशिष्ट सांस्कृतिक पद को लिप्यंतरित किया गया है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में संबंधित शब्दों के साथ दिए गए हैं।
