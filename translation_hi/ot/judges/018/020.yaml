base_translation:
  language: en
  yaml_path: translation/ot/judges/018/020.yaml
  text: And the priest’s heart was glad[a], and he took the ephod, the household idols, and the carved image[b], and went into the midst of the people.
translation:
  language: hi
  text: तब याजक का मन प्रसन्न हुआ, और उसने एपोद, गृह-देवताओं[a] और तराशी हुई मूर्ति[b] को ले लिया और लोगों के बीच जा पहुँचा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल इब्रानी में ‘तराफीम’; यह शब्द घरेलू धार्मिक प्रतिमाओं या गृह-देवताओं के लिए प्रयुक्त होता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘देव-प्रतिमा’ अथवा ‘मूर्ति’।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּיטַב לֵב הַכֹּהֵן
  choice: याजक का मन प्रसन्न हुआ
  rationale: इब्रानी मुहावरे का शाब्दिक चित्र—याजक का ‘मन/हृदय अच्छा हुआ’—बनाए रखते हुए स्वाभाविक आधुनिक हिन्दी में उसकी प्रसन्नता व्यक्त करता है।
- source_word: הָאֵפוֹד
  choice: एपोद
  rationale: यह उपासना से जुड़ी एक विशिष्ट वस्तु का तकनीकी नाम है; संक्षिप्त और निश्चित हिन्दी पर्याय न होने के कारण लिप्यंतरण उपयुक्त है।
- source_word: הַתְּרָפִים
  choice: गृह-देवताओं
  rationale: यह बहुवचन शब्द घरेलू धार्मिक प्रतिमाओं अथवा देव-वस्तुओं को सूचित करता है। ‘गृह-देवता’ आधुनिक पाठक के लिए अर्थ स्पष्ट करता है, जबकि पाद-टिप्पणी मूल पद भी देती है।
- source_word: הַפָּסֶל
  choice: खुदी हुई मूर्ति
  rationale: यह शब्द काटकर या खोदकर बनाई गई धार्मिक प्रतिमा को दर्शाता है; यह अनुवाद वस्तु के निर्मित रूप को स्पष्ट रखता है।
- source_word: בְּקֶרֶב הָעָם
  choice: लोगों के बीच जा मिला
  rationale: यह वाक्यांश लोगों के मध्य प्रवेश करने का भाव देता है। ‘जा मिला’ गति और समूह में सम्मिलित होने—दोनों अर्थों को स्वाभाविक हिन्दी में व्यक्त करता है।
