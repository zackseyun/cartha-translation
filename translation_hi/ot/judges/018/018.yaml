source:
  edition: WLC
  text: וְ/אֵ֗לֶּה בָּ֚אוּ בֵּ֣ית מִיכָ֔ה וַ/יִּקְחוּ֙ אֶת פֶּ֣סֶל הָ/אֵפ֔וֹד וְ/אֶת הַ/תְּרָפִ֖ים וְ/אֶת הַ/מַּסֵּכָ֑ה וַ/יֹּ֤אמֶר אֲלֵי/הֶם֙ הַ/כֹּהֵ֔ן מָ֥ה אַתֶּ֖ם עֹשִֽׂים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/018.yaml
  text: These men went into Micah’s house and took the carved image[a], the ephod, the household idols, and the cast image. Then the priest said to them, “What are you doing?”
translation:
  language: hi
  text: वे लोग मीका के घर में गए और तराशी हुई मूर्ति, एपोद, घरेलू देव-मूर्तियाँ[a] और ढली हुई मूर्ति ले लीं। तब पुरोहित ने उनसे कहा, “तुम क्या कर रहे हो?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्द “तराफीम”; ये घर या परिवार से जुड़ी पूजावस्तुएँ अथवा देव-मूर्तियाँ हैं।
    reason: सांस्कृतिक रूप से विशिष्ट इब्रानी पद को दर्ज करते हुए मुख्य पाठ में उसका सुलभ अर्थ देना।
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: वे लोग
  rationale: संकेतवाचक पद निकट संदर्भ के पाँच पुरुषों की ओर लौटता है। आधुनिक हिन्दी में “वे लोग” स्वाभाविक है और संदर्भित समूह को स्पष्ट करता है।
- source_word: בָּאוּ בֵּית מִיכָה
  choice: मीका के घर में गए
  rationale: בוא के साथ बिना पूर्वसर्ग का स्थानवाचक पद यहाँ घर में प्रवेश करने का भाव देता है; हिन्दी में यह प्रयोग सहज और अर्थानुकूल है।
- source_word: וַיִּקְחוּ
  choice: उठा ले गए
  rationale: मूल क्रिया का आधारभूत अर्थ “लेना” है; कथा-संदर्भ में वस्तुओं को वहाँ से हटाकर ले जाने का भाव हिन्दी के “उठा ले गए” से स्वाभाविक रूप में व्यक्त होता है, बिना हिंसक बल प्रयोग जोड़े।
- source_word: פֶּסֶל
  choice: खुदी हुई मूर्ति
  rationale: यह शब्द तराशकर या खोदकर बनाई गई प्रतिमा को सूचित करता है। यह अनुवाद उसके निर्माण-प्रकार को बचाता है और सभी पूजावस्तुओं को एक सामान्य शब्द में नहीं मिलाता।
- source_word: הָאֵפוֹד
  choice: एपोद
  rationale: यह एक विशिष्ट प्राचीन पूजासंबंधी वस्तु का नाम है जिसका सटीक आधुनिक हिन्दी पर्याय नहीं है; लिप्यंतरण अनावश्यक व्याख्या से बचता है।
- source_word: הַתְּרָפִים
  choice: घरेलू देव-मूर्तियाँ
  rationale: तराफीम घर या कुल से जुड़ी पूजावस्तुएँ थीं। “घरेलू देव-मूर्तियाँ” सामान्य पाठक को उनका प्रकार बताता है, जबकि “तराफीम” को पाद-टिप्पणी में सुरक्षित रखा गया है।
- source_word: הַמַּסֵּכָה
  choice: ढली हुई मूर्ति
  rationale: यह ढलाई, सामान्यतः धातु ढालकर बनाई गई प्रतिमा को दर्शाता है। “ढली हुई मूर्ति” निर्माण-पद्धति को स्पष्ट और संक्षिप्त रूप में रखता है।
- source_word: הַכֹּהֵן
  choice: पुरोहित
  rationale: कथा में धार्मिक सेवा करने वाले व्यक्ति के लिए आधुनिक मानक हिन्दी का dignified और सामान्य पद।
- source_word: מָה אַתֶּם עֹשִׂים
  choice: तुम क्या कर रहे हो?
  rationale: सीधा प्रश्न मूल की संक्षिप्तता और तत्काल विरोध को बनाए रखता है; “यहाँ” जैसा कोई अतिरिक्त स्थानवाचक पद नहीं जोड़ा गया।
theological_decisions:
- issue: मूर्तिपूजक प्रसंग में अलग-अलग पूजावस्तुओं का अनुवाद
  choice: खुदी हुई मूर्ति, एपोद, घरेलू देव-मूर्तियाँ और ढली हुई मूर्ति—इन अलग श्रेणियों को बनाए रखा गया।
  alternative: सबको सामान्य रूप से “मूर्तियाँ” या “देवता” कहना।
  rationale: इब्रानी पाठ वस्तुओं को अलग-अलग नाम देता है। ठोस और भिन्न शब्दावली पाठ की ऐतिहासिक-सांस्कृतिक जानकारी तथा उसकी धार्मिक आलोचना को बिना अतिरिक्त व्याख्या के सुरक्षित रखती है।
- issue: एपोद की प्रकृति
  choice: केवल “एपोद” कहा गया।
  alternative: “याजकीय वस्त्र” या “पूजा की मूर्ति” कहकर उसकी प्रकृति निश्चित करना।
  rationale: न्यायियों के इस प्रसंग में एपोद का ठीक रूप और कार्य पूरी तरह स्पष्ट नहीं है। लिप्यंतरण वास्तविक अस्पष्टता को बनाए रखता है और किसी विशिष्ट व्याख्या को पाठ में नहीं डालता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। कथा की तीव्रता के लिए छोटे, सीधे वाक्य और सामान्य शब्दावली अपनाई गई है। “एपोद” जैसे अपरिहार्य सांस्कृतिक पद को लिप्यंतरित किया गया है, जबकि “तराफीम” का अर्थ मुख्य पाठ में देकर मूल पद पाद-टिप्पणी में रखा गया है।
