  yaml_path: translation/ot/judges/018/021.yaml
  text: So they turned and went on[a], and put the little children, the livestock[b], and the valuables before them.
translation:
  language: hi
  text: तब वे मुड़े और चले गए, और उन्होंने छोटे बच्चों, पशुधन और कीमती सामान को अपने आगे रखा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּפְנוּ
  choice: वे मुड़कर
  rationale: פנה का मूल अर्थ ‘मुड़ना’ है; संयुक्त क्रिया-प्रवाह में ‘मुड़कर’ स्वाभाविक हिन्दी है और दिशा का अनावश्यक अनुमान नहीं लगाता।
- source_word: וַיֵּלֵכוּ
  choice: आगे बढ़े
  rationale: הלך यहाँ मुड़ने के बाद यात्रा जारी रखने की क्रिया बताता है; ‘आगे बढ़े’ आधुनिक हिन्दी में इस क्रम को सहज रूप से व्यक्त करता है।
- source_word: וַיָּשִׂימוּ
  choice: रखा
  rationale: שׂים का सामान्य अर्थ रखना/स्थापित करना है; यहाँ वस्तुओं और व्यक्तियों को दल के आगे रखने के लिए ‘रखा’ स्वाभाविक है।
- source_word: הַטַּף
  choice: छोटे बच्चों
  rationale: טף समूह के छोटे और आश्रित बच्चों को सूचित करता है; ‘छोटे बच्चों’ से उसकी आयु और असुरक्षित स्थिति दोनों स्पष्ट होती हैं।
- source_word: הַמִּקְנֶה
  choice: पशुओं
  rationale: מקנה पाले हुए पशुधन का व्यापक शब्द है; हिन्दी में ‘पशुओं’ प्रसंगानुकूल और ‘मवेशियों’ से अधिक व्यापक है।
- source_word: הַכְּבוּדָּה
  choice: कीमती सामान
  rationale: כבודה यहाँ साथ ले जाई जा सकने वाली मूल्यवान संपत्ति या सामान को दर्शाता है, न कि ‘महिमा’ को; ‘कीमती सामान’ अर्थ और यात्रा-प्रसंग दोनों को स्पष्ट रखता है।
- source_word: לִפְנֵיהֶם
  choice: अपने आगे
  rationale: शाब्दिक अर्थ ‘उनके सामने/आगे’ है। कर्ता और संदर्भित समूह एक ही होने के कारण ‘अपने आगे’ हिन्दी में स्वाभाविक रूप से बताता है कि बच्चों, पशुओं और सामान को मुख्य दल से आगे रखा गया।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथात्मक शैली रखी गई है। हिब्रू के क्रमिक क्रिया-प्रवाह को ‘मुड़कर आगे बढ़े’ से व्यक्त किया गया है और किसी अतिरिक्त उद्देश्य या दिशा को पाठ में नहीं जोड़ा गया।
