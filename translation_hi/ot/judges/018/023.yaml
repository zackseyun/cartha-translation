base_translation:
  language: en
  yaml_path: translation/ot/judges/018/023.yaml
  text: They called out to the sons of Dan[a], and they turned around and said to Micah, “What is the matter with you[b], that you have called out?”
translation:
  language: hi
  text: उन्होंने दानवंशियों[a] को पुकारा। तब वे मुड़कर मीका से कहने लगे, “तुम्हें क्या हुआ है कि तुम चिल्ला उठे हो[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ, “दान के पुत्रों को”; अर्थात दान के वंशजों को।
    reason: lexical_alternative
  - marker: b
    text: या, “तुमने पुकार लगाई है” या “तुमने दुहाई दी है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְאוּ
  choice: उन्होंने ... पुकारा
  rationale: קרא का सामान्य अर्थ ‘पुकारना’ है; यहाँ पीछे जा रहे दल को आवाज़ देने का भाव है।
- source_word: אֶל בְּנֵי דָן
  choice: दानवंशियों को
  rationale: शाब्दिक रूप ‘दान के पुत्रों’ का स्वाभाविक आधुनिक हिन्दी रूप ‘दानवंशी’ है।
- source_word: וַיַּסֵּבּוּ פְּנֵיהֶם
  choice: तब उन्होंने मुड़कर
  rationale: शाब्दिक मुहावरा ‘उन्होंने अपने मुख फेरे’ है; ‘मुड़कर’ वही क्रिया सहज हिन्दी में व्यक्त करता है।
- source_word: לְמִיכָה
  choice: मीका से
  rationale: कथन के प्राप्तकर्ता के लिए हिन्दी में ‘से कहा’ स्वाभाविक है।
- source_word: מַה לְּךָ
  choice: तुम्हें क्या हुआ है
  rationale: यह मुहावरा सामने वाले की परेशानी या व्यवहार का कारण पूछता है।
- source_word: כִּי
  choice: कि
  rationale: यहाँ प्रश्न के अगले खंड को जोड़ता है और परिस्थिति का आधार प्रस्तुत करता है।
- source_word: נִזְעָקְתָּ
  choice: तुमने लोगों को इकट्ठा कर लिया है
  rationale: זעק के निफ़अल रूप का यहाँ दुर्लभ अर्थ ‘पुकारकर लोगों को जमा करना/एकत्र होना’ संदर्भ से उपयुक्त है, क्योंकि मीका अपने पड़ोसियों के दल के साथ पीछा कर रहा है; ‘चिल्लाए’ भी संभव है।
