base_translation:
  language: en
  yaml_path: translation/ot/judges/018/006.yaml
  text: And the priest said to them[a], “Go in peace. The journey on which you are going is before Yahweh.”
translation:
  language: hi
  text: तब याजक ने उनसे कहा, “कुशल से जाओ। जिस मार्ग पर तुम जा रहे हो, वह याहवे के सामने है[a]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम्हारा मार्ग याहवे के सामने है,” अर्थात तुम्हारी यात्रा उसकी दृष्टि में है। यह वाक्य अनिवार्य रूप से याहवे की स्पष्ट स्वीकृति नहीं बताता।
    reason: शाब्दिक विकल्प और कथन की संभावित सीमा स्पष्ट करना।
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने कहा
  rationale: वय्यिक्तोल कथानक को आगे बढ़ाता है; हिंदी में ‘तब ... ने कहा’ स्वाभाविक रूप से घटनाक्रम की निरंतरता व्यक्त करता है, बिना समय-संबंध पर अनावश्यक बल दिए।
- source_word: הַכֹּהֵן
  choice: याजक
  rationale: संदर्भ में पहले से उपस्थित निश्चित याजक का सीधा और प्रचलित हिंदी रूप।
- source_word: לְכוּ לְשָׁלוֹם
  choice: कुशल से जाओ
  rationale: यह प्रस्थान के समय कही जाने वाली आशीष-सदृश इब्रानी अभिव्यक्ति है; ‘कुशल से जाओ’ आधुनिक, गरिमापूर्ण और अर्थानुकूल हिंदी है।
- source_word: נֹכַח
  choice: के सामने
  rationale: यह किसी के सम्मुख या उसकी दृष्टि में होने का भाव देता है। यहाँ यह यात्रा के याहवे के सामने होने को व्यक्त करता है, न कि स्पष्ट रूप से उसकी स्वीकृति या सफलता की गारंटी को।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय परमेश्वर-नाम का हिंदी लिप्यंतरण; इसे किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: דַּרְכְּכֶם
  choice: जिस मार्ग पर तुम जा रहे हो
  rationale: דֶּרֶךְ का मूल अर्थ ‘मार्ग’ है और प्रसंग में यह यात्रा को सूचित करता है; हिंदी वाक्य में ‘मार्ग’ मूल बिंब को बनाए रखता है।
- source_word: אֲשֶׁר תֵּלְכוּ בָהּ
  choice: जिस मार्ग पर तुम जा रहे हो
  rationale: संबंधवाचक उपवाक्य मार्ग पर चलने की इब्रानी छवि को स्वाभाविक हिंदी में सुरक्षित रखता है।
theological_decisions:
- issue: दानियों की यात्रा के विषय में याजक के कथन का आशय
  choice: ‘वह याहवे के सामने है’—अर्थात यात्रा उसकी दृष्टि में है।
  alternative: ‘याहवे तुम्हारी यात्रा को स्वीकार करता है’ या ‘याहवे तुम्हारी यात्रा को सफल करेगा।’
  rationale: נֹכַח יְהוָה के साथ ‘तुम्हारा मार्ग’ सीधे तौर पर यात्रा के याहवे के सम्मुख होने की बात कहता है। मूल पाठ स्पष्ट रूप से उसकी स्वीकृति, आशीष या सफलता की प्रतिज्ञा नहीं करता; इसलिए कथन का धार्मिक तनाव बनाए रखा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी, सरल किंतु गरिमापूर्ण शैली। ‘कुशल से जाओ’ आशीष-सदृश विदाई को स्वाभाविक ढंग से व्यक्त करता है। ‘याहवे के सामने’ मूल की अस्पष्टता बनाए रखता है और ईश्वरीय अनुमोदन का अतिरिक्त अर्थ नहीं जोड़ता।
