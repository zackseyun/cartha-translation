  yaml_path: translation/ot/judges/018/011.yaml
  text: So six hundred men from the clan of the Danites set out from there[a], from Zorah and from Eshtaol[b], armed with weapons of war.
translation:
  language: hi
  text: तब दान के कुल के छह सौ पुरुष वहाँ से, अर्थात् सोराह और एश्ताओल से, युद्ध के हथियारों से सुसज्जित होकर चल पड़े।[a]
  philosophy: optimal-equivalence
  footnotes:
