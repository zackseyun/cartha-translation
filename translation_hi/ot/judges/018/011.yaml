    text: इब्रानी में शाब्दिक रूप से, “युद्ध के हथियारों से कमर कसे हुए।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: चल पड़े
  rationale: נסע यहाँ पड़ाव छोड़कर यात्रा आरम्भ करने को दर्शाता है; ‘चल पड़े’ आधुनिक, सहज और कथात्मक हिन्दी है।
- source_word: מִשָּׁם
  choice: वहाँ से
  rationale: स्थानवाचक क्रियाविशेषण का सीधा और स्वाभाविक अनुवाद।
- source_word: מִמִּשְׁפַּחַת הַדָּנִי
  choice: दानियों के कुल में से
  rationale: מִשְׁפָּחָה पूरे गोत्र से छोटी वंश-आधारित सामाजिक इकाई को सूचित करता है; ‘कुल’ हिन्दी में इस अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: מִצָּרְעָה וּמֵאֶשְׁתָּאֹל
  choice: सोराह और एश्ताओल से
  rationale: स्थान-नामों का देवनागरी लिप्यंतरण किया गया है और स्रोत के संबंधबोधक अर्थ को बनाए रखा गया है।
- source_word: שֵׁשׁ מֵאוֹת אִישׁ
  choice: छः सौ पुरुष
  rationale: सैन्य प्रसंग में אִישׁ वयस्क पुरुषों को गिनता है; ‘पुरुष’ अर्थ और गरिमा दोनों बनाए रखता है।
- source_word: חָגוּר כְּלֵי מִלְחָמָה
  choice: युद्ध के हथियार बाँधकर
  rationale: חָגוּר का मूल बिंब कमर में बाँधने का है; केवल ‘हथियारबंद’ कहने के बजाय यह अनुवाद स्रोत की ठोस अभिव्यक्ति को सुरक्षित रखता है।
