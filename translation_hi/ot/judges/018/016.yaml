lexical_decisions:
- source_word: וְשֵׁשׁ מֵאוֹת אִישׁ
  choice: और छह सौ पुरुष
  rationale: וְ को कथात्मक क्रम में स्वाभाविक रूप से ‘और’ किया गया है। संख्या के बाद एकवचन אִישׁ का सामूहिक अर्थ है, इसलिए हिन्दी में बहुवचन ‘पुरुष’ उपयुक्त है।
- source_word: חֲגוּרִים כְּלֵי מִלְחַמְתָּם
  choice: अपने युद्ध के हथियारों से लैस
  rationale: חֲגוּרִים का मूल अर्थ ‘कमर बाँधे हुए’ है, पर हथियारों के साथ यह युद्ध के लिए सुसज्जित होने का भाव देता है। ‘लैस’ आधुनिक हिन्दी में इसी सैनिक अर्थ को स्वाभाविक रूप से व्यक्त करता है, और ‘युद्ध के हथियार’ मूल की अभिव्यक्ति को बनाए रखता है।
- source_word: נִצָּבִים
  choice: खड़े थे
  rationale: कृदन्त रूप दृश्य की जारी अवस्था बताता है; ‘खड़े थे’ हिन्दी में उस स्थिति को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: פֶּתַח הַשַּׁעַר
  choice: फाटक के प्रवेश-द्वार पर
  rationale: פֶּתַח का अर्थ खुला स्थान या प्रवेश है और הַשַּׁעַר फाटक है। यह अनुवाद दोनों संज्ञाओं का भाव रखते हुए स्थान को स्पष्ट करता है।
- source_word: אֲשֶׁר מִבְּנֵי דָן
  choice: वे दान के पुत्रों में से थे
  rationale: यह पहचानसूचक उपवाक्य छह सौ पुरुषों को दान के वंश से संबंधित बताता है। ‘दान के पुत्र’ मूल की वंशसूचक अभिव्यक्ति को बनाए रखता है; पादटिप्पणी उसका स्वाभाविक आशय स्पष्ट करती है।
