  yaml_path: translation/ot/judges/018/012.yaml
  text: They went up and camped at Kiriath-jearim in Judah. Therefore that place has been called Mahaneh-dan to this day; behold, it is west of Kiriath-jearim.
translation:
  language: hi
  text: वे ऊपर गए और यहूदा के किर्यत-यारीम में छावनी डाली। इस कारण उस स्थान का नाम आज तक महने-दान पड़ा हुआ है। देखो, वह किर्यत-यारीम के पश्चिम में है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּקִרְיַת יְעָרִים
  choice: किर्यत-यारीम के पास
  rationale: यहाँ בְּ स्थान-संबंध बताता है; छावनी नगर के क्षेत्र अथवा निकट होने का स्वाभाविक हिंदी संकेत दिया गया है।
- source_word: מַחֲנֵה דָן
  choice: महने-दान
  rationale: स्थान-नाम को अर्थानुवाद करने के बजाय लिप्यंतरित किया गया है; इसका संबंध दान की छावनी से है।
- source_word: אַחֲרֵי קִרְיַת יְעָרִים
  choice: किर्यत-यारीम के पश्चिम में
  rationale: אַחֲרֵי का मूल अर्थ ‘पीछे’ है, पर प्राचीन पूर्वाभिमुख दिशा-दृष्टि में यहाँ भौगोलिक आशय ‘पश्चिम में’ समझा जाता है; संदर्भानुकूल दिशा स्पष्ट की गई है।
- source_word: הִנֵּה
  choice: देखो
  rationale: वर्णन में स्थान की ओर ध्यान खींचने वाला संकेतक सुरक्षित रखा गया है।
