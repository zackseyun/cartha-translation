reference: Judges 18:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כְּ/בֹאֲ/כֶ֞ם תָּבֹ֣אוּ אֶל עַ֣ם בֹּטֵ֗חַ וְ/הָ/אָ֨רֶץ֙ רַחֲבַ֣ת יָדַ֔יִם כִּֽי נְתָנָ֥/הּ אֱלֹהִ֖ים בְּ/יֶדְ/כֶ֑ם מָקוֹם֙ אֲשֶׁ֣ר אֵֽין שָׁ֣ם מַחְס֔וֹר כָּל דָּבָ֖ר אֲשֶׁ֥ר בָּ/אָֽרֶץ׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/010.yaml
  text: When you go[a], you will come to a secure people, and the land is broad; for God has given it into your hand[b], a place where there is no lack of anything that is in the land.
translation:
  language: hi
  text: जब तुम वहाँ पहुँचोगे, तो तुम्हें निश्चिंत लोग मिलेंगे।[a] वह देश बहुत विस्तृत है।[b] परमेश्वर ने उसे तुम्हारे हाथ में दे दिया है। यह ऐसी जगह है जहाँ उस देश में पाई जाने वाली किसी भी वस्तु की कमी नहीं है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सुरक्षित होकर रहनेवाले लोग” अथवा “बेखबर लोग।” हिब्रू में ऐसे लोगों का वर्णन है जो अपने को सुरक्षित समझकर रह रहे हैं।
    reason: lexical_alternative
  - marker: b
    text: हिब्रू में शाब्दिक रूप से “हाथों की चौड़ी,” अर्थात बहुत खुला और विशाल देश।
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּבֹאֲכֶם ... תָּבֹאוּ
  choice: जब तुम वहाँ पहुँचोगे, तो तुम्हें ... मिलेंगे
  rationale: इन्फिनिटिव और सीमित क्रिया के संयुक्त वाक्य-विन्यास को सहज आधुनिक हिन्दी में आगमन और उसके परिणाम के रूप में व्यक्त किया गया है; शाब्दिक दोहराव हिन्दी में अस्वाभाविक होता।
- source_word: עַם בֹּטֵחַ
  choice: निश्चिन्त लोग
  rationale: यह लोगों की सुरक्षा की अनुभूति और बेफिक्री को व्यक्त करता है, पर मुख्य पाठ में उन्हें अनिवार्य रूप से ‘असावधान’ बताकर प्रसंगगत अर्थ को मूल से अधिक स्पष्ट नहीं करता।
- source_word: וְהָאָרֶץ רַחֲבַת יָדַיִם
  choice: वह देश बहुत विस्तृत है
  rationale: ‘हाथों का चौड़ा’ हिब्रू मुहावरा पर्याप्त फैलाव और विशालता बताता है। हिन्दी में ‘बहुत विस्तृत’ उसका स्वाभाविक अर्थ है; मूल बिंब पादटिप्पणी में सुरक्षित है।
- source_word: כִּי נְתָנָהּ אֱלֹהִים בְּיֶדְכֶם
  choice: परमेश्वर ने उसे तुम्हारे हाथ में कर दिया है
  rationale: पूर्ण क्रिया वक्ताओं की दृष्टि में निश्चित और मानो सम्पन्न दान को दर्शाती है। ‘हाथ में कर दिया’ अधिकार या वश में सौंपने का हिन्दी मुहावरा है और मूल के सामूहिक एकवचन बिंब को बनाए रखता है।
- source_word: מָקוֹם
  choice: यह ऐसी जगह है
  rationale: यह पूर्ववर्णित भूभाग का समानाधिकरणात्मक परिचय देता है और מָקוֹם का सीधा, स्वाभाविक अनुवाद है।
- source_word: אֲשֶׁר אֵין שָׁם מַחְסוֹר כָּל דָּבָר אֲשֶׁר בָּאָרֶץ
  choice: जहाँ उस देश में पाई जानेवाली किसी भी वस्तु की कमी नहीं है
  rationale: מַחְסוֹר को ‘कमी’ और प्रसंगानुसार הָאָרֶץ को चर्चा में आए विशिष्ट देश के रूप में लिया गया है, पूरी पृथ्वी के रूप में नहीं।
theological_decisions:
- issue: אֱלֹהִים का अनुवाद
  choice: परमेश्वर
  alternative: देवता / कोई देवता
  rationale: यहाँ क्रिया एकवचन है और जासूसों के कथन में इस्राएल के परमेश्वर द्वारा देश सौंपे जाने का आशय है; बहुवचन या अनिश्चित देवता का अर्थ व्याकरण और प्रसंग से समर्थित नहीं है।
- issue: पूर्ण क्रिया נְתָנָהּ का कालगत बल
  choice: ने ... कर दिया है
  alternative: दे रहा है
  rationale: वक्ताओं की दृष्टि में विजय की सुनिश्चितता को सम्पन्न कार्य की तरह प्रस्तुत किया गया है; इसे केवल जारी प्रक्रिया बनाना उस बल को घटा देता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट शैली रखी गई है। ‘निश्चिन्त’ सुरक्षा की अनुभूति और संभावित बेखबरी के बीच मूल की अर्थगत खुलावट बनाए रखता है; ‘विस्तृत’ हिब्रू मुहावरे का स्वाभाविक हिन्दी रूप है।
