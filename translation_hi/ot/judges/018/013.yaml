translation:
  language: hi
  text: वहाँ से वे एप्रैम के पहाड़ी प्रदेश से होकर आगे बढ़े और मीका के घर तक पहुँचे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַבְרוּ מִשָּׁם
  choice: वहाँ से ... होकर आगे बढ़े
  rationale: עבר यात्रा के इस प्रसंग में किसी क्षेत्र से होकर आगे जाने का भाव देता है; यह हिंदी में स्वाभाविक रूप से गति और मार्ग दोनों व्यक्त करता है।
- source_word: הַר אֶפְרָיִם
  choice: एप्रैम के पहाड़ी प्रदेश
  rationale: यह एक भौगोलिक क्षेत्र का नाम है, किसी एक पर्वत-शिखर का नहीं; इसलिए 'पहाड़ी प्रदेश' सटीक और सहज है।
- source_word: וַיָּבֹאוּ עַד
  choice: तक पहुँचे
  rationale: בוא के साथ עַד यहाँ यात्रा की सीमा या गंतव्य तक पहुँचने को दर्शाता है; 'तक पहुँचे' संक्षिप्त और स्वाभाविक हिंदी है।
- source_word: בֵּית מִיכָה
  choice: मीका के घर
  rationale: इब्रानी संबंधवाचक पदबंध का सीधा और आधुनिक हिंदी रूप; संदर्भ में 'घराना' या 'मंदिर' जोड़ने की आवश्यकता नहीं है।
