base_translation:
  language: en
  yaml_path: translation/ot/judges/018/015.yaml
  text: They turned aside there and came to the house of the young Levite[a], to the house of Micah, and asked him about his welfare.
translation:
  language: hi
  text: वे वहाँ मुड़कर उस जवान लेवी के घर, अर्थात मीका के घर, आए और उससे उसका कुशल-क्षेम पूछा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּסוּרוּ שָׁמָּה
  choice: वे वहाँ मुड़कर
  rationale: सूर क्रिया मार्ग से हटकर किसी स्थान की ओर मुड़ने को व्यक्त करती है; दिशासूचक שָׁמָּה को सहज हिन्दी में ‘वहाँ’ से व्यक्त किया गया है।
- source_word: וַיָּבֹאוּ אֶל
  choice: आए
  rationale: בוא עם אֶל यहाँ किसी स्थान तक पहुँचने को दर्शाता है; ‘आए’ मूल कथानक के दृष्टिकोण और आगमन के भाव को बनाए रखता है।
- source_word: בֵּית הַנַּעַר הַלֵּוִי
  choice: उस जवान लेवी के घर
  rationale: נַעַר के लिए ‘जवान’ और הַלֵּוִי के लिए ‘लेवी’ रखा गया है, जिससे व्यक्ति की आयु और उसकी पहचान दोनों स्पष्ट रहती हैं।
- source_word: בֵּית מִיכָה
  choice: अर्थात मीका के घर
  rationale: दूसरा ‘घर’ पदबंध पहले स्थान की व्याख्यात्मक पहचान करता है; ‘अर्थात’ हिन्दी में इस समानाधिकरण को स्पष्ट और स्वाभाविक बनाता है।
- source_word: וַיִּשְׁאֲלוּ לוֹ לְשָׁלוֹם
  choice: और उससे उसका कुशल-क्षेम पूछा
  rationale: यह इब्रानी मुहावरा किसी के शांति, भलाई या हालचाल के विषय में पूछने को दर्शाता है। ‘कुशल-क्षेम पूछा’ आधुनिक हिन्दी का स्वाभाविक मुहावरा है और इसे केवल औपचारिक अभिवादन तक सीमित नहीं करता।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। इब्रानी की पुनरुक्त स्थान-संरचना को ‘अर्थात मीका के घर’ द्वारा बनाए रखा गया है। ‘कुशल-क्षेम पूछा’ मूल मुहावरे के अर्थ को पर्याप्त रूप से व्यक्त करता है, इसलिए अलग पाद-टिप्पणी आवश्यक नहीं समझी गई।
