base_translation:
  language: en
  yaml_path: translation/ot/judges/018/022.yaml
  text: When they had gone some distance from Micah’s house[a], the men who were in the houses near Micah’s house were called together, and they overtook the sons of Dan.
translation:
  language: hi
  text: जब वे मीका के घर से कुछ दूर निकल गए, तब मीका के घर के आसपास के घरों में रहनेवाले पुरुष इकट्ठा होने के लिए बुलाए गए[a], और वे दान के पुत्रों तक जा पहुँचे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उन्होंने खतरे की पुकार लगाई।” इब्रानी क्रिया खतरे की पुकार या उसके फलस्वरूप लोगों के इकट्ठा होने, दोनों का संकेत दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵמָּה
  choice: वे
  rationale: यह स्वतंत्र सर्वनाम पहले से वर्णित दान के पुत्रों की ओर फिर संकेत करता है; हिन्दी में सामान्य कर्ता-सर्वनाम स्वाभाविक है।
- source_word: הִרְחִיקוּ
  choice: कुछ दूर निकल गए
  rationale: רחק का हिफ़ील रूप यहाँ किसी स्थान से दूर हो जाने का भाव देता है; यह प्रयोग कथा के आगे बढ़ने को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מִבֵּית מִיכָה
  choice: मीका के घर से
  rationale: सम्बन्धवाचक रचना को आधुनिक हिन्दी के सहज अधिकार-सूचक रूप में रखा गया है।
- source_word: הָאֲנָשִׁים
  choice: पुरुष
  rationale: मूल इब्रानी में सामान्य ‘लोग’ नहीं, बल्कि स्पष्ट रूप से ‘पुरुष’ कहा गया है।
- source_word: אֲשֶׁר בַּבָּתִּים אֲשֶׁר עִם בֵּית מִיכָה
  choice: मीका के घर के पासवाले घरों में रहनेवाले
  rationale: शाब्दिक रचना कुछ असहज है; עִם यहाँ निकटता या सम्बद्धता बताता है, इसलिए ‘पासवाले’ अर्थ और पठनीयता दोनों बनाए रखता है।
- source_word: נִזְעֲקוּ
  choice: इकट्ठे किए गए
  rationale: זעק के निफ़ाल रूप को यहाँ पीछा करने के लिए लोगों के जुटाए जाने के अर्थ में लिया गया है; पुकार या खतरे की आवाज़ उठाने का सम्भव अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: וַיַּדְבִּיקוּ
  choice: जा पकड़ा
  rationale: क्रिया का अर्थ पीछा करके किसी तक पहुँच जाना या उसे पकड़ लेना है; ‘जा पकड़ा’ हिन्दी कथन में गति और परिणाम दोनों व्यक्त करता है।
- source_word: אֶת בְּנֵי דָן
  choice: दान के पुत्रों को
  rationale: मूल की औपचारिक वंशगत अभिव्यक्ति को बनाए रखा गया है; सन्दर्भ में यह दान के गोत्र के लोगों को सूचित करती है।
