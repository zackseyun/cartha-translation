base_translation:
  language: en
  yaml_path: translation/ot/judges/018/008.yaml
  text: Then they came to their brothers at Zorah and Eshtaol[a], and their brothers said to them[b], “What is with you?”
translation:
  language: hi
  text: तब वे सोरा और एश्ताओल में अपने भाइयों[a] के पास आए। उनके भाइयों ने उनसे पूछा, “तुम लोगों का क्या समाचार है?”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपने कुल या गोत्र के संबंधियों”; यहाँ “भाई” सगे भाइयों के साथ-साथ एक ही कुल या गोत्र के संबंधियों को भी दर्शा सकता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी प्रश्न बहुत संक्षिप्त है—शाब्दिक रूप से लगभग “क्या, तुम?” यह संभवतः उनकी दशा या समाचार के बारे में पूछता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: तब वे ... आए
  rationale: वय्यिक्तोल रूप कथा को आगे बढ़ाता है; ‘तब’ स्वाभाविक हिन्दी में क्रम को व्यक्त करता है और आने की साधारण क्रिया को बनाए रखता है।
- source_word: אֶל אֲחֵיהֶם
  choice: अपने भाइयों के पास
  rationale: אָח का अर्थ सगे भाई भी हो सकता है और व्यापक कुल या गोत्र के पुरुष संबंधी भी; मुख्य पाठ में मूल शब्दावली रखी गई है और व्यापक अर्थ पादटिप्पणी में दिया गया है।
- source_word: צָרְעָה וְאֶשְׁתָּאֹל
  choice: सोरा और एश्ताओल में
  rationale: स्थान-नामों को आधुनिक हिन्दी में प्रचलित बाइबलीय लिप्यंतरण के अनुसार रखा गया है। यहाँ इब्रानी नाम स्थान-सूचक रूप में व्यक्त हुए हैं।
- source_word: וַיֹּאמְרוּ לָהֶם אֲחֵיהֶם
  choice: उनके भाइयों ने उनसे पूछा
  rationale: इब्रानी में ‘कहा’ है, पर उसके बाद सीधा प्रश्न होने के कारण हिन्दी में ‘पूछा’ स्वाभाविक है; स्पष्ट कर्ता ‘उनके भाई’ सुरक्षित रखा गया है।
- source_word: מָה אַתֶּם
  choice: तुम लोगों का क्या हाल है?
  rationale: इब्रानी प्रश्न अत्यंत संक्षिप्त और अध्याहृत है—शाब्दिक रूप से लगभग ‘क्या, तुम?’। चुना हुआ हिन्दी प्रश्न उनकी दशा या समाचार पूछ सकता है और संदर्भ को आवश्यकता से अधिक निश्चित नहीं करता।
