source:
  edition: WLC
  text: וַ/יֹּ֡אמֶר אֶת אֱלֹהַ/י֩ אֲשֶׁר עָשִׂ֨יתִי לְקַחְתֶּ֧ם וְֽ/אֶת הַ/כֹּהֵ֛ן וַ/תֵּלְכ֖וּ וּ/מַה לִּ֣/י ע֑וֹד וּ/מַה זֶּ֛ה תֹּאמְר֥וּ אֵלַ֖/י מַה לָּֽ/ךְ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/024.yaml
  text: He said[a], “You have taken my gods that I made, and the priest, and you have gone away. What do I have left now? So how can you say to me, ‘What is the matter with you?’”
translation:
  language: hi
  text: उसने कहा[a], “तुम मेरे बनाए हुए देवताओं और याजक को ले गए और चले गए। अब मेरे पास क्या बचा है? फिर तुम मुझसे कैसे कह सकते हो, ‘तुम्हें क्या हुआ है?’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मेरे देवता” अथवा “मेरी ईश-प्रतिमाएँ।” इब्रानी शब्द कुछ संदर्भों में एकवचन या बहुवचन हो सकता है, पर यहाँ व्यापक संदर्भ “मेरे देवताओं” का समर्थन करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהַי
  choice: मेरे बनाए हुए देवताओं
  rationale: אֱלֹהַי का रूप कुछ संदर्भों में एकवचन या बहुवचन हो सकता है, पर इस अध्याय में मीका की उपासना-वस्तुओं का व्यापक संदर्भ बहुवचन का समर्थन करता है। ‘देवताओं’ मूल शब्दावली और मनुष्य द्वारा बनाए देवताओं की कथात्मक विडंबना दोनों को बनाए रखता है।
- source_word: אֲשֶׁר עָשִׂיתִי
  choice: बनाए हुए
  rationale: यह संबंधवाचक उपवाक्य देवताओं को विशेषित करता है। हिंदी में ‘मेरे बनाए हुए देवताओं’ स्वाभाविक है और עשה के सीधे अर्थ को सुरक्षित रखता है।
- source_word: לְקַחְתֶּם
  choice: तुम ... ले गए
  rationale: द्वितीय पुरुष बहुवचन कर्ता स्पष्ट रखा गया है। संदर्भ में वस्तुओं को अपने साथ ले जाने का भाव होने के कारण ‘ले गए’ स्वाभाविक हिंदी है।
- source_word: הַכֹּהֵן
  choice: याजक
  rationale: निश्चित संदर्भ मीका के परिचित याजक की ओर संकेत करता है; हिंदी में प्रसंग के कारण अलग निश्चित उपपद आवश्यक नहीं।
- source_word: וַתֵּלְכוּ
  choice: और चले गए
  rationale: द्वितीय पुरुष बहुवचन और प्रस्थान—दोनों को सीधे तथा स्वाभाविक रूप से व्यक्त करता है।
- source_word: וּמַה לִּי עוֹד
  choice: अब मेरे पास क्या बचा है?
  rationale: यह वाक्यांश मीका की वंचना और शेष न रहने की शिकायत व्यक्त करता है; ‘अब’ עוֹד के प्रसंगगत भाव को सहज हिंदी में देता है।
- source_word: וּמַה זֶּה תֹּאמְרוּ אֵלַי
  choice: फिर तुम मुझसे कैसे कह सकते हो
  rationale: शाब्दिक संरचना मुहावरेदार और आक्रोशपूर्ण है। यह हिंदी रूप पिछले कथन से निकली उसकी आपत्ति और अविश्वास को व्यक्त करता है।
- source_word: מַה לָּךְ
  choice: तुम्हें क्या हुआ है?
  rationale: यह सामान्य प्रश्नसूचक मुहावरा है जिसका अर्थ है कि तुम्हें क्या परेशानी है या बात क्या है। चुना हुआ रूप सीधा और आधुनिक है।
theological_decisions:
- issue: घरेलू उपासना-वस्तुओं के संदर्भ में אֱלֹהַי का अनुवाद
  choice: देवताओं
  alternative: देवता/देवताओं; ईश-प्रतिमाओं; मूर्तियों
  rationale: मूल शब्द का अर्थ ‘देवता/देवताओं’ है और व्यापक संदर्भ भौतिक उपासना-वस्तुओं की पहचान कराता है। मुख्य पाठ में ‘देवताओं’ रखना मूल की शब्दावली तथा मनुष्य-निर्मित देवताओं की अंतर्निहित विडंबना को बचाता है; ‘मूर्तियों’ कहना इस तनाव को व्याख्यात्मक रूप से समतल कर देता।
translation_notes:
  register: आधुनिक मानक हिंदी; कथन सीधा, गरिमापूर्ण और बोलचाल में समझ आने योग्य रखा गया है। ‘याजक’ बाइबलीय धार्मिक पद के लिए प्रचलित हिंदी शब्द है।
