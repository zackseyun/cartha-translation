base_translation:
  language: en
  yaml_path: translation/ot/judges/018/007.yaml
  text: Then the five men went and came to Laish[a], and they saw the people who were in it, dwelling securely, according to the custom of the Sidonians, quiet and secure. And there was no one in the land to humiliate them in anything, possessing authority; and they were far from the Sidonians[c][b], and they had no dealings with anyone.
translation:
  language: hi
  text: तब वे पाँच पुरुष चल पड़े और लैश पहुँचे। वहाँ उन्होंने देखा कि उसके भीतर रहने वाले लोग सीदोनियों की रीति के अनुसार निश्चिंत रहते थे—शांत और सुरक्षित। उस देश में ऐसा कोई नहीं था जो किसी बात में उन्हें अपमानित करता और अधिकार रखता हो[a]। वे सीदोनियों से दूर थे और किसी के साथ उनका कोई व्यवहार नहीं था[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी वाक्यांश कठिन है: शाब्दिक रूप से, “देश में कोई नहीं जो किसी बात को अपमानित करे, अधिकार रखता हुआ।” इसका आशय संभवतः ऐसा कोई शासक या दबाव डालने वाला व्यक्ति न होना है जो उन्हें अपमानित या अधीन करे।'
    reason: मַכְלִים דָּבָר और יוֹרֵשׁ עֶצֶר की कठिन संरचना और उसके संभावित अर्थ को बिना निश्चित व्याख्या थोपे स्पष्ट करना।
  - marker: b
    text: या, “किसी के साथ उनकी कोई संधि या लेन-देन नहीं था।”
    reason: וְדָבָר אֵין לָהֶם עִם אָדָם के मुहावरे के व्यवहार, व्यवस्था, या गठजोड़-संबंधी वैकल्पिक अर्थ को दर्शाना।
lexical_decisions:
- source_word: לָיְשָׁה
  choice: लैश
  rationale: यह उस नगर का स्थान-नाम है, जिसे बाद में दान नाम दिया गया; प्रसंगानुसार इसका लिप्यंतरण किया गया है।
- source_word: יוֹשֶׁבֶת לָבֶטַח
  choice: निश्चिन्त बसे हुए थे
  rationale: यह पद स्थायी रूप से निर्भय और सुरक्षित जीवन बिताने का भाव व्यक्त करता है।
- source_word: כְּמִשְׁפַּט צִדֹנִים
  choice: सीदोनियों की रीति के अनुसार
  rationale: यहाँ מִשְׁפָּט न्यायिक निर्णय से अधिक प्रचलित रीति या जीवन-पद्धति को सूचित करता है।
- source_word: שֹׁקֵט וּבֹטֵחַ
  choice: शान्त और सुरक्षित
  rationale: दोनों समानार्थी वर्णनों को बनाए रखते हुए नगर के निर्बाध और भयमुक्त जीवन पर संचित बल सुरक्षित रखा गया है।
- source_word: מַכְלִים דָּבָר
  choice: किसी बात में नीचा दिखाने वाला
  rationale: כלם के हिफ़ील रूप में लज्जित या अपमानित करने का भाव है; सहज हिन्दी में 'नीचा दिखाने' से वह भाव व्यक्त होता है।
- source_word: יוֹרֵשׁ עֶצֶר
  choice: अधिकार रखने वाला व्यक्ति
  rationale: यह अत्यन्त कठिन इब्रानी अभिव्यक्ति सम्भवतः प्रभुत्व या नियन्त्रण रखने वाले व्यक्ति को बताती है; अनुवाद सम्भावित कार्यात्मक अर्थ देता है, जबकि टिप्पणी अनिश्चितता स्पष्ट करती है।
- source_word: וּרְחֹקִים הֵמָּה מִצִּדֹנִים
  choice: वे सीदोनियों से दूर थे
  rationale: मूल पाठ का सीधा भौगोलिक कथन उनकी अलगावपूर्ण स्थिति समझाता है।
- source_word: וְדָבָר אֵין לָהֶם עִם אָדָם
  choice: किसी से उनका कोई सम्बन्ध नहीं था
  rationale: यह मुहावरा व्यवहार, सम्पर्क या सम्बन्ध न होने को दर्शाता है; 'सम्बन्ध' जानबूझकर व्यापक रखा गया है।
- source_word: אָדָם
  choice: किसी
  rationale: यहाँ एकवचन संज्ञा सामान्य अर्थ में है, इसलिए आधुनिक हिन्दी में अनिश्चित सर्वनाम स्वाभाविक है।
theological_decisions:
- issue: लैश के निवासियों की असुरक्षा का स्वरूप
  choice: राजनीतिक-सामाजिक अलगाव और किसी स्थानीय प्रभुत्वशाली व्यक्ति के अभाव को वर्णित किया गया है
  alternative: पाठ को केवल नैतिक निन्दा या किसी विशेष शासन-व्यवस्था का समर्थन मानना
  rationale: इब्रानी मुख्यतः खोजियों द्वारा देखी गई सुरक्षा, दूरी और सम्बन्धहीनता बताता है; वह स्पष्ट धार्मिक मूल्यांकन नहीं देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। 'पुरुष', 'रीति', 'निश्चिन्त', और 'सम्बन्ध' जैसे प्रचलित मानक शब्द चुने गए हैं। कठिन इब्रानी खण्ड को मुख्य पाठ में अत्यधिक शाब्दिक और दुर्बोध बनाने के बजाय उसका सम्भावित अर्थ दिया गया है तथा वास्तविक अनिश्चितता पादटिप्पणी में स्पष्ट की गई है।
