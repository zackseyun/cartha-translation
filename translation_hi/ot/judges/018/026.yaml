base_translation:
  language: en
  yaml_path: translation/ot/judges/018/026.yaml
  text: Then the sons of Dan went on their way, and Micah saw that they were stronger than he was, so he turned and went back to his house.
translation:
  language: hi
  text: तब दान के वंशज अपने रास्ते चले गए। मीका ने देखा कि वे उससे अधिक शक्तिशाली थे, इसलिए वह मुड़ा और अपने घर लौट गया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְנֵי דָן
  choice: दान के वंशज
  rationale: शाब्दिक रूप ‘दान के पुत्र’ यहाँ जातीय/गोत्रीय अर्थ रखता है। ‘दान के वंशज’ आधुनिक हिन्दी में स्वाभाविक है और दान से उनके वंशगत संबंध को स्पष्ट रखता है।
- source_word: לְדַרְכָּם
  choice: अपने रास्ते चले गए
  rationale: यह हिब्रू पदबंध यात्रा जारी रखने को दर्शाता है; यह हिन्दी अभिव्यक्ति अर्थ और प्रवाह दोनों को बनाए रखती है।
- source_word: חֲזָקִים הֵמָּה מִמֶּנּוּ
  choice: वे उससे अधिक शक्तिशाली हैं
  rationale: חזק के साथ מן का तुलनात्मक अर्थ है। वर्तमानकाल ‘हैं’ हिब्रू के प्रत्यक्ष कथन की कालगत बनावट को बनाए रखता है, यद्यपि हिन्दी में ‘थे’ भी प्रसंगानुकूल हो सकता है।
- source_word: וַיִּפֶן
  choice: वह मुड़ा
  rationale: क्रिया का सीधा अर्थ ‘मुड़ना’ है। अगली क्रिया लौटने की बात कहती है, इसलिए यहाँ ‘वापस मुड़ा’ कहकर अनावश्यक पुनरुक्ति नहीं की गई।
- source_word: וַיָּשָׁב אֶל בֵּיתוֹ
  choice: अपने घर लौट गया
  rationale: שׁוב वापसी का बोध देता है और אֶל בֵּיתוֹ गंतव्य के रूप में उसके घर को बताता है। हिन्दी में यह संक्षिप्त और स्वाभाविक है।
- source_word: בֵּיתוֹ
  choice: अपने घर
  rationale: בַּיִת का सीधा अर्थ ‘घर’ है। कर्ता मीका होने के कारण हिन्दी में निजवाचक ‘अपने’ अधिक स्वाभाविक और स्पष्ट है।
