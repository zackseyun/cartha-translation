  text: וַ/יֹּאמְר֤וּ אֵלָי/ו֙ בְּנֵי דָ֔ן אַל תַּשְׁמַ֥ע קוֹלְ/ךָ֖ עִמָּ֑/נוּ פֶּֽן יִפְגְּע֣וּ בָ/כֶ֗ם אֲנָשִׁים֙ מָ֣רֵי נֶ֔פֶשׁ וְ/אָסַפְתָּ֥ה נַפְשְׁ/ךָ֖ וְ/נֶ֥פֶשׁ בֵּיתֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/025.yaml
  text: And the sons of Dan said to him[a], “Do not let your voice be heard among us, lest men bitter of soul fall upon you[b], and you lose your life and the lives of your household.”
translation:
  language: hi
  text: दान के वंशजों ने उससे कहा, “हमारे बीच अपनी आवाज़ सुनाई न देने दो,[a] कहीं ऐसा न हो कि कड़वे मन वाले लोग तुम सब पर टूट पड़ें,[b] और तुम अपनी जान और अपने घराने के लोगों की जान गँवा बैठो।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “अपनी आवाज़ हमारे साथ सुनाई न देने दो।”
    reason: lexical_alternative
  - marker: b
    text: “कड़वे मन वाले लोग” का अनुवाद “उग्र लोग,” “हताश लोग,” या “कड़वी आत्मा वाले लोग” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי דָן
  choice: दान के वंशज
  rationale: इब्रानी के शाब्दिक ‘दान के पुत्र’ में निहित गोत्रीय पहचान को स्पष्ट रखते हुए आधुनिक हिन्दी में स्वाभाविक अभिव्यक्ति चुनी गई है।
- source_word: אַל תַּשְׁמַע קוֹלְךָ עִמָּנוּ
  choice: अपनी आवाज़ हमारे बीच सुनाई न देने दो
  rationale: यह चेतावनी आगे बोलने या विरोध करने से रोकती है; अनुवाद इब्रानी के ‘आवाज़ सुनाई देना’ वाले बिंब को बनाए रखता है।
- source_word: פֶּן
  choice: कहीं ऐसा न हो कि
  rationale: यह निषेध के बाद आने वाले आशंकापूर्ण किंतु धमकीभरे परिणाम को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יִפְגְּעוּ בָכֶם
  choice: तुम लोगों पर टूट पड़ें
  rationale: क्रिया यहाँ हिंसक मुठभेड़ या आक्रमण का अर्थ देती है। बहुवचन प्रत्यय को ‘तुम लोगों पर’ से सुरक्षित रखा गया है।
- source_word: אֲנָשִׁים מָרֵי נֶפֶשׁ
  choice: कड़वे मनवाले लोग
  rationale: यह चयन ‘कड़वाहट’ और ‘मन/प्राण’ के मूल बिंब को बचाता है, जबकि सन्दर्भ में ऐसे लोगों की उग्र और खतरनाक प्रवृत्ति निहित रहती है।
- source_word: וְאָסַפְתָּה נַפְשְׁךָ
  choice: तुम अपनी जान ... गँवा बैठो
  rationale: אסף के साथ נפש यहाँ शाब्दिक ‘जान समेटना’ नहीं, बल्कि जान चले जाने का मुहावरा है; ‘गँवा बैठो’ धमकी के परिणाम को स्पष्ट करता है।
- source_word: וְנֶפֶשׁ בֵּיתֶךָ
  choice: अपने घराने के लोगों की जान
  rationale: एकवचन ‘प्राण’ और सामूहिक ‘घराना’ का आशय घर के सदस्यों के जीवन से है; हिन्दी में इसे स्पष्ट और स्वाभाविक रूप दिया गया है।
