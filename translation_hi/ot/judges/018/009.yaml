  yaml_path: translation/ot/judges/018/009.yaml
  text: And they said, “Rise up, and let us go up against them, for we have seen the land, and behold, it is very good. And you are keeping silent—do not be sluggish to go, to enter, to take possession of the land.”
translation:
  language: hi
  text: उन्होंने कहा, “उठो, और हम उन पर चढ़ाई करें, क्योंकि हमने उस भूमि को देखा है, और देखो, वह बहुत अच्छी है। और तुम चुप हो; वहाँ जाने, उसमें प्रवेश करने और उस भूमि पर अधिकार करने में आलस मत करो।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קוּמָה וְנַעֲלֶה עֲלֵיהֶם
  choice: उठो, हम उन पर चढ़ाई करें
  rationale: आह्वान और सैन्य संदर्भ दोनों को स्वाभाविक हिन्दी में व्यक्त करता है; נעלה का शाब्दिक ‘ऊपर चलें’ यहाँ आक्रमण के अर्थ में है।
- source_word: וְהִנֵּה טוֹבָה מְאֹד
  choice: वह सचमुच बहुत अच्छा है
  rationale: וְהִנֵּה की ध्यान खींचने वाली और पुष्टि करने वाली शक्ति को ‘सचमुच’ से सहज रूप में रखा गया है।
- source_word: מַחְשִׁים
  choice: चुप बैठे हो
  rationale: मूल क्रिया का अर्थ चुप या निष्क्रिय बने रहना है; प्रसंग में ‘चुप बैठे हो’ दोनों भावों को स्वाभाविक ढंग से संकेत करता है।
- source_word: אַל תֵּעָצְלוּ
  choice: आलस मत करो
  rationale: क्रिया की सुस्ती या ढिलाई न करने की चेतावनी का सीधा और सामान्य हिन्दी रूप।
- source_word: לָלֶכֶת לָבֹא לָרֶשֶׁת
  choice: जाने, प्रवेश करने और उस पर अधिकार करने में
  rationale: तीनों स्रोत infinitives को बनाए रखता है और अंतिम क्रिया ירשׁ को भूमि पर अधिकार करने के रूप में प्रस्तुत करता है।
