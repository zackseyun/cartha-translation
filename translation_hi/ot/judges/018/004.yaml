lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵהֶם
  choice: उसने उनसे कहा
  rationale: वाक्यांश लेवी के उत्तर को प्रस्तुत करता है। आरंभिक वाव कथानक का क्रम बताता है, जिसे हिन्दी में प्रसंग और क्रिया-क्रम स्वाभाविक रूप से व्यक्त करते हैं।
- source_word: כָּזֹה וְכָזֶה
  choice: यह-वह
  rationale: यह हिब्रू मुहावरा पहले बताई गई बातों को दोहराए बिना संक्षेप में समेटता है। ‘यह-वह’ आधुनिक हिन्दी में उसी अनिश्चित सार-संकेत को सहजता से व्यक्त करता है।
- source_word: עָשָׂה לִי
  choice: मेरे लिए ... किया
  rationale: עשה के साथ ל यहाँ बताता है कि मीका ने वक्ता के लिए या उसके संबंध में क्या किया।
- source_word: מִיכָה
  choice: मीका
  rationale: व्यक्तिवाचक नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: וַיִּשְׂכְּרֵנִי
  choice: उसने मुझे वेतन पर रख लिया
  rationale: שׂכר का अर्थ मजदूरी या वेतन देकर नियुक्त करना है। यह हिन्दी अभिव्यक्ति आर्थिक नियुक्ति को स्पष्ट और स्वाभाविक रूप से व्यक्त करती है।
- source_word: וָאֱהִי לוֹ לְכֹהֵן
  choice: और मैं उसका याजक बन गया
  rationale: היה यहाँ घटनाक्रम में नई भूमिका ग्रहण करने को सूचित करता है; לוֹ और לְכֹהֵן का स्वाभाविक संयुक्त रूप ‘उसका याजक’ है।
theological_decisions:
- issue: अनियमित उपासना-व्यवस्था में याजकीय भूमिका का स्वरूप
  choice: उसका याजक
  alternative: उसके लिए याजक
  rationale: हिब्रू पाठ मीका से व्यक्तिगत रूप से जुड़ी याजकीय सेवा बताता है। ‘उसका याजक’ इस संबंध को व्यक्त करता है, पर इस व्यवस्था की वैधता पर पाठ से आगे बढ़कर कोई निर्णय नहीं देता।
