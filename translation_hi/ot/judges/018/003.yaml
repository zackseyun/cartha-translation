reference: Judges 18:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: הֵ֚מָּה עִם בֵּ֣ית מִיכָ֔ה וְ/הֵ֣מָּה הִכִּ֔ירוּ אֶת ק֥וֹל הַ/נַּ֖עַר הַ/לֵּוִ֑י וַ/יָּס֣וּרוּ שָׁ֗ם וַ/יֹּ֤אמְרוּ ל/וֹ֙ מִֽי הֱבִיאֲ/ךָ֣ הֲלֹ֔ם וּ/מָֽה אַתָּ֥ה עֹשֶׂ֛ה בָּ/זֶ֖ה וּ/מַה לְּ/ךָ֥ פֹֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/003.yaml
  text: While they were near Micah’s house[a], they recognized the voice of the young Levite. So they turned aside there and said to him[b], “Who brought you here? What are you doing in this place? And what do you have here?”
translation:
  language: hi
  text: जब वे मीका के घर के पास थे, तब उन्होंने उस जवान लेवी की आवाज़ पहचान ली। इसलिए वे वहाँ मुड़ गए और उससे पूछा, “तुम्हें यहाँ कौन लाया? तुम इस जगह[a] क्या कर रहे हो? और यहाँ तुम्हारे पास क्या है?[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “इसमें।” इसका अर्थ “तुम यहाँ क्या कर रहे हो?” भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “और यहाँ तुम्हारा क्या काम है?”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵמָּה עִם בֵּית מִיכָה
  choice: जब वे मीका के घर के पास थे
  rationale: עִם यहाँ घर के साथ संगति नहीं, बल्कि स्थान-संबंधी निकटता दर्शाता है। ‘घर के पास’ आधुनिक हिन्दी में स्वाभाविक है और इब्रानी की परिस्थितिसूचक भूमिका को बनाए रखता है।
- source_word: הִכִּירוּ
  choice: पहचान ली
  rationale: נכר के हिफ़ील रूप का यहाँ अर्थ किसी आवाज़ को पहचानना है।
- source_word: אֶת קוֹל הַנַּעַר הַלֵּוִי
  choice: उस जवान लेवी की आवाज़
  rationale: קוֹל का प्रसंगानुकूल अर्थ ‘आवाज़’ है; נַעַר आयु या स्थिति के अनुसार ‘जवान’ है, और הַלֵּוִי उस व्यक्ति की पहचान बताता है।
- source_word: וַיָּסוּרוּ שָׁם
  choice: इसलिए वे वहाँ मुड़ गए
  rationale: סור मार्ग से हटकर किसी स्थान की ओर मुड़ने को व्यक्त करता है। ‘मुड़ गए’ गति को सुरक्षित रखते हुए सहज हिन्दी देता है।
- source_word: מִי הֱבִיאֲךָ הֲלֹם
  choice: तुम्हें यहाँ कौन लाया?
  rationale: בוא का हिफ़ील रूप कारणवाचक ‘लाना’ है और הֲלֹם का अर्थ ‘यहाँ’ है।
- source_word: וּמָה אַתָּה עֹשֶׂה בָּזֶה
  choice: तुम इस जगह क्या कर रहे हो?
  rationale: בָּזֶה शाब्दिक रूप से ‘इसमें/इसके साथ’ है, पर वाक्य यहाँ स्थान की ओर संकेत करता प्रतीत होता है। ‘इस जगह’ अस्पष्ट संकेत को पठनीय बनाता है; शाब्दिकता और वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित हैं।
- source_word: וּמַה לְּךָ פֹה
  choice: और यहाँ तुम्हारे पास क्या है?
  rationale: מַה לְּךָ פֹה में अधिकार, सरोकार या काम-काज की अर्थ-छाया हो सकती है। मुख्य पाठ का ‘तुम्हारे पास क्या है’ ठोस इब्रानी बनावट के निकट है; व्यापक मुहावरेदार अर्थ पादटिप्पणी में दिया गया है।
