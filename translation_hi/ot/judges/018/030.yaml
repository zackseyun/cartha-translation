reference: Judges 18:30
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יָּקִ֧ימוּ לָ/הֶ֛ם בְּנֵי דָ֖ן אֶת הַ/פָּ֑סֶל וִ֠/יהוֹנָתָן בֶּן גֵּרְשֹׁ֨ם בֶּן מְ ה֣וּא וּ/בָנָ֗י/ו הָי֤וּ כֹהֲנִים֙ לְ/שֵׁ֣בֶט הַ/דָּנִ֔י עַד י֖וֹם גְּל֥וֹת הָ/אָֽרֶץ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/030.yaml
  text: Then the sons of Dan set up for themselves the carved image, and Jonathan the son of Gershom, son of Moses,[a] he and his sons were priests for the tribe of the Danites until the day of the exile of the land.
translation:
  language: hi
  text: तब दान के वंशजों ने अपने लिए वह खुदी हुई मूर्ति स्थापित की; और योनातान, जो मूसा के पुत्र गेर्शोम का पुत्र था,[a] और उसके पुत्र देश के निर्वासन के दिन तक दानी गोत्र के लिए याजक रहे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में “मूसा” है; मसोरा-परंपरा में एक निलंबित नून है, जिससे पारंपरिक पाठ “मनश्शे” बनता है।
    reason: textual_variant
lexical_decisions:
- source_word: וַיָּקִימוּ
  choice: स्थापित की
  rationale: हिफ़ील रूप का अर्थ किसी वस्तु को खड़ा करना या प्रतिष्ठित करना है; मूर्ति के संदर्भ में ‘स्थापित की’ स्वाभाविक और सटीक है।
- source_word: לָהֶם
  choice: अपने लिए
  rationale: यह दानियों के अपने उपयोग या लाभ के लिए किए गए कार्य का भाव स्पष्ट करता है।
- source_word: בְּנֵי דָן
  choice: दान के वंशजों
  rationale: इब्रानी ‘दान के पुत्रों’ का वंशगत अर्थ आधुनिक हिन्दी में स्वाभाविक ढंग से व्यक्त होता है और आगे आए गोत्र-संबंधी पद से भेद भी बना रहता है।
- source_word: הַפָּסֶל
  choice: वह खुदी हुई मूर्ति
  rationale: פֶּסֶל विशेषतः काटकर या खोदकर बनाई गई प्रतिमा को दर्शाता है; यह अनुवाद ‘मूर्ति’ की धार्मिक भूमिका और निर्माण की ठोस विधि दोनों बनाए रखता है।
- source_word: וִיהוֹנָתָן
  choice: योनातान
  rationale: नाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण।
- source_word: בֶּן גֵּרְשֹׁם בֶּן מְהוּא
  choice: जो गेर्शोम का पुत्र और मूसा का पोता था
  rationale: लगातार आए ‘पुत्र’ संबंधों को स्पष्ट, स्वाभाविक हिन्दी वंशावली के रूप में व्यक्त किया गया है; मूल पाठ की मूसा वाली आधार-पाठीय पहचान मुख्य पाठ में रखी गई है।
- source_word: וּבָנָיו
  choice: तथा उसके पुत्र
  rationale: योनातान और उसके पुत्र दोनों ‘याजक बने रहे’ के कर्ता हैं; हिन्दी वाक्य-विन्यास इसे स्पष्ट करता है।
- source_word: כֹהֲנִים
  choice: याजक
  rationale: उपासना-संबंधी संदर्भ में כהנים का मानक हिन्दी पर्याय।
- source_word: לְשֵׁבֶט הַדָּנִי
  choice: दानियों के गोत्र के लिए
  rationale: לְ सेवा के लाभार्थी या संबद्ध समूह को और הַדָּנִי दानी समुदाय को सूचित करता है; यह रूप आधुनिक हिन्दी में स्पष्ट है।
- source_word: עַד יוֹם גְּלוֹת הָאָרֶץ
  choice: उस दिन तक ... जब देश बंधुआई में चला गया
  rationale: इब्रानी की संक्षिप्त अभिव्यक्ति को स्वाभाविक हिन्दी में रखते हुए ‘देश’ को व्याकरणिक विषय बनाया गया है; किस ऐतिहासिक बंधुआई का संकेत है, यह अनिर्धारित छोड़ा गया है।
theological_decisions:
- issue: योनातान के पूर्वज की पाठीय पहचान
  choice: मूसा का पोता
  alternative: मनश्शे का पोता
  rationale: मसोरा-पाठ की मूल व्यंजनात्मक गवाही ‘मूसा’ की ओर संकेत करती है, जबकि ऊपर टांगा गया नून पारंपरिक ‘मनश्शे’ पाठ देता है। पाठीय और धर्मवैचारिक तनाव को बनाए रखने के लिए ‘मूसा’ मुख्य पाठ में और पारंपरिक विकल्प पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज गद्य। ‘खुदी हुई मूर्ति’, ‘गोत्र’, ‘याजक’ और ‘बंधुआई’ जैसे परिचित बाइबलीय शब्द रखे गए हैं। असामान्य निर्वासन-सूत्र की ऐतिहासिक पहचान को व्याख्यात्मक रूप से निश्चित नहीं किया गया।
