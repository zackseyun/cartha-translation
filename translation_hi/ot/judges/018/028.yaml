source:
  edition: WLC
  text: וְ/אֵ֨ין מַצִּ֜יל כִּ֧י רְֽחוֹקָה הִ֣יא מִ/צִּיד֗וֹן וְ/דָבָ֤ר אֵין לָ/הֶם֙ עִם אָדָ֔ם וְ/הִ֕יא בָּ/עֵ֖מֶק אֲשֶׁ֣ר לְ/בֵית רְח֑וֹב וַ/יִּבְנ֥וּ אֶת הָ/עִ֖יר וַ/יֵּ֥שְׁבוּ בָֽ/הּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/028.yaml
  text: And there was no one to deliver them[a], because it was far from Sidon, and they had no dealings with anyone; and it was in the valley that belongs to Beth-rehob. Then they rebuilt the city and lived in it.
translation:
  language: hi
  text: उन्हें बचाने वाला कोई न था, क्योंकि वह नगर सीदोन से दूर था और उनका किसी से कोई लेन-देन नहीं था। वह बेत-रहोब के क्षेत्र की घाटी में था[a]। तब उन्होंने नगर को फिर से बनाया और उसमें रहने लगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह बेत-रहोब के पास की घाटी में था।” इब्रानी वाक्यांश संक्षिप्त है, और यहाँ प्रयुक्त उपसर्ग क्षेत्रीय संबंध के बजाय निकटता भी दर्शा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: מַצִּיל
  choice: बचानेवाला
  rationale: हिफ़ील कृदंत ऐसे व्यक्ति को दर्शाता है जो संकट से छुड़ाए या बचाए। सैन्य संकट के इस प्रसंग में यह सहज और ठोस अर्थ देता है; कर्म ‘उन्हें’ संदर्भ से स्पष्ट है।
- source_word: רְחוֹקָה הִיא מִצִּידוֹן
  choice: वह नगर सीदोन से दूर था
  rationale: स्त्रीलिंग सर्वनाम का संदर्भ नगर है। हिन्दी में संदर्भ स्पष्ट रखने के लिए ‘नगर’ व्यक्त किया गया है।
- source_word: וְדָבָר אֵין לָהֶם עִם אָדָם
  choice: उनका किसी से कोई लेन-देन नहीं था
  rationale: शाब्दिक संरचना ‘उनके लिए किसी मनुष्य के साथ कोई बात/मामला न था’ सामाजिक या राजनीतिक अलगाव बताती है। ‘लेन-देन’ आधुनिक हिन्दी में इस व्यापक व्यवहार-संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אָדָם
  choice: किसी से
  rationale: यहाँ एकवचन संज्ञा जातिवाचक अर्थ में है; अतः लिंग-निरपेक्ष ‘किसी से’ संदर्भानुकूल है।
- source_word: בָּעֵמֶק
  choice: घाटी में
  rationale: עֵמֶק सामान्यतः घाटी या निचला भूभाग दर्शाता है; यहाँ ‘घाटी’ सीधा और स्वाभाविक भौगोलिक शब्द है।
- source_word: אֲשֶׁר לְבֵית רְחוֹב
  choice: बेत-रहोब की
  rationale: लामेद संबंध या अधिकार-क्षेत्र का संकेत दे सकता है। ‘बेत-रहोब की घाटी’ सम्भावित प्रादेशिक संबंध को सहज हिन्दी में रखता है, जबकि निकटता की सम्भावना पाद-टिप्पणी में सुरक्षित है।
- source_word: וַיִּבְנוּ אֶת הָעִיר
  choice: उन्होंने नगर को फिर से बनाया
  rationale: मूल क्रिया का सामान्य अर्थ ‘बनाना’ है, पर पिछले पद में नगर के जलाए जाने के कारण यहाँ पुनर्निर्माण निहित है। ‘फिर से बनाया’ उस प्रसंगगत अर्थ को स्पष्ट करता है।
- source_word: וַיֵּשְׁבוּ בָהּ
  choice: उसमें रहने लगे
  rationale: יָשַׁב का अर्थ निवास करना या बसना है। क्रमिक कथन में ‘रहने लगे’ स्पष्ट करता है कि पुनर्निर्माण के बाद उन्होंने वहीं निवास आरम्भ किया।
- source_word: בֵית רְחוֹב
  choice: बेत-रहोब
  rationale: यह स्थान-नाम है, इसलिए इसका अनुवाद करने के बजाय देवनागरी में लिप्यंतरण किया गया है।
