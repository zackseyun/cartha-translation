source:
  edition: WLC
  text: וַ/יִּקְרְא֤וּ שֵׁם הָ/עִיר֙ דָּ֔ן בְּ/שֵׁם֙ דָּ֣ן אֲבִי/הֶ֔ם אֲשֶׁ֥ר יוּלַּ֖ד לְ/יִשְׂרָאֵ֑ל וְ/אוּלָ֛ם לַ֥יִשׁ שֵׁם הָ/עִ֖יר לָ/רִאשֹׁנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/029.yaml
  text: And they called the name of the city Dan[a], after the name of Dan their father, who was born to Israel; however, the name of the city formerly was Laish.
translation:
  language: hi
  text: और उन्होंने उस नगर का नाम अपने पिता, दान, के नाम पर दान रखा, जिसका जन्म इस्राएल के यहाँ हुआ था; परन्तु पहले उस नगर का नाम लैश था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרְאוּ שֵׁם הָעִיר
  choice: उन्होंने उस नगर का नाम ... रखा
  rationale: हिब्रू में शाब्दिक रूप से ‘नगर का नाम पुकारा’ है; आधुनिक हिन्दी में ‘नगर का नाम ... रखा’ नामकरण का वही अर्थ स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: דָּן
  choice: दान
  rationale: व्यक्तिनाम और नगरनाम दोनों के लिए प्रचलित हिन्दी लिप्यंतरण रखा गया है।
- source_word: בְּשֵׁם דָּן אֲבִיהֶם
  choice: अपने पिता दान के नाम पर
  rationale: בְשֵׁם यहाँ किसी के नाम के आधार पर नाम रखने का भाव देता है। אֲבִיהֶם का सीधा अर्थ ‘उनका पिता’ है, जबकि वंश-संदर्भ में इसका व्यापक अर्थ पूर्वज भी हो सकता है।
- source_word: אֲשֶׁר יוּלַּד לְיִשְׂרָאֵל
  choice: जो इस्राएल से उत्पन्न हुआ था
  rationale: निष्क्रिय ילד और לְ का भाव सुरक्षित रखते हुए यह स्पष्ट करता है कि दान इस्राएल से उत्पन्न हुआ था; स्रोत के ‘इस्राएल’ को ‘याकूब’ से नहीं बदला गया।
- source_word: וְאוּלָם
  choice: परन्तु
  rationale: नए नाम और पुराने नाम के बीच स्रोत का विरोधसूचक संबंध संक्षेप और गरिमा से व्यक्त होता है।
- source_word: לַיִשׁ
  choice: लैश
  rationale: स्थाननाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: לָרִאשֹׁנָה
  choice: पहले
  rationale: संदर्भ में नगर का पूर्व नाम सूचित है; ‘पहले’ आधुनिक हिन्दी में सहज और सटीक है।
theological_decisions:
- issue: वंशसूचक אֲבִיהֶם
  choice: पिता
  alternative: पूर्वज
  rationale: मुख्य पाठ में हिब्रू का प्रत्यक्ष पारिवारिक शब्द सुरक्षित रखा गया है। चूँकि ‘पिता’ वंश के पुराने पुरुष को भी सूचित कर सकता है, व्यापक अर्थ को पादटिप्पणी में दिया गया है और अस्पष्टता मिटाई नहीं गई।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। हिब्रू की नामकरण-रीति को स्वाभाविक हिन्दी ‘नाम ... रखा’ से व्यक्त किया गया है, जबकि वंशसूचक ‘पिता’ की व्यापक अर्थ-संभावना पादटिप्पणी में सुरक्षित है।
