source:
  edition: WLC
  text: וַ/יֹּאמְרוּ֩ ל֨/וֹ הַחֲרֵ֜שׁ שִֽׂים יָדְ/ךָ֤ עַל פִּ֨י/ךָ֙ וְ/לֵ֣ךְ עִמָּ֔/נוּ וֶֽ/הְיֵה לָ֖/נוּ לְ/אָ֣ב וּ/לְ/כֹהֵ֑ן הֲ/ט֣וֹב הֱיוֹתְ/ךָ֣ כֹהֵ֗ן לְ/בֵית֙ אִ֣ישׁ אֶחָ֔ד א֚וֹ הֱיוֹתְ/ךָ֣ כֹהֵ֔ן לְ/שֵׁ֥בֶט וּ/לְ/מִשְׁפָּחָ֖ה בְּ/יִשְׂרָאֵֽל־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/019.yaml
  text: They said to him[a], “Be quiet; put your hand over your mouth, and come with us, and be to us a father and a priest. Is it better for you to be priest to the house of one man[c][b], or to be priest to a tribe and a clan in Israel?”
translation:
  language: hi
  text: उन्होंने उससे कहा, “चुप रहो[a]; अपने मुँह पर हाथ रखो और हमारे साथ चलो। हमारे लिए पिता[b] और याजक बनो। तुम्हारे लिए क्या अच्छा है—एक ही आदमी के घराने का याजक होना, या इस्राएल में एक गोत्र और कुल[c] का याजक होना?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मौन रहो।” हिब्रू आज्ञा का अर्थ चुप या मौन रहने की आज्ञा है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ “पिता” जैविक संबंध नहीं, बल्कि सामाजिक या धार्मिक नेतृत्व अथवा संरक्षण का पद है।
    reason: cultural_note
  - marker: c
    text: या “वंश-समूह”; यहाँ हिब्रू शब्द गोत्र से संबद्ध नातेदारी-समूह को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֲרֵשׁ
  choice: चुप रहो
  rationale: यह חרשׁ का आज्ञार्थक रूप है और यहाँ बोलना बंद करने की सीधी आज्ञा देता है। ‘चुप रहो’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: שִׂים יָדְךָ עַל־פִּיךָ
  choice: अपने मुँह पर हाथ रखो
  rationale: मौन और संयम के शारीरिक संकेत को उसकी ठोस छवि सहित बनाए रखता है।
- source_word: וְהְיֵה לָנוּ לְאָב וּלְכֹהֵן
  choice: हमारे लिए पिता और याजक बनो
  rationale: दोनों भूमिकाओं को स्पष्ट रखता है; ‘पिता’ को व्याख्यात्मक पद से बदलकर उसका सांस्कृतिक अर्थ संकीर्ण नहीं किया गया।
- source_word: הֲטוֹב
  choice: तुम्हारे लिए क्या अच्छा है
  rationale: हिब्रू में विशेषण ‘अच्छा’ है, जबकि दो विकल्पों का प्रश्न तुलनात्मक अर्थ उत्पन्न करता है। यह रूप मूल शब्दावली और प्रश्न की तुलना दोनों को स्वाभाविक ढंग से रखता है।
- source_word: לְבֵית אִישׁ אֶחָד
  choice: एक ही आदमी के घराने का
  rationale: בֵּית का यहाँ आशय केवल भवन नहीं, व्यक्ति के गृहस्थ समूह से है; ‘घराना’ उस अर्थ को सहज हिन्दी में व्यक्त करता है।
- source_word: לְשֵׁבֶט וּלְמִשְׁפָּחָה בְּיִשְׂרָאֵל
  choice: इस्राएल में एक गोत्र और कुल का
  rationale: שֵׁבֶט के लिए ‘गोत्र’ और מִשְׁפָּחָה के लिए ‘कुल’ रखकर दो संबंधित किन्तु अलग सामाजिक इकाइयों का भेद सुरक्षित रहता है।
theological_decisions:
- issue: ‘पिता’ का पदसूचक अर्थ
  choice: मूल पद ‘पिता’ को मुख्य पाठ में बनाए रखा गया।
  alternative: सलाहकार, संरक्षक या अगुवा
  rationale: यह जैविक संबंध के बजाय सामाजिक-धार्मिक नेतृत्व या संरक्षण का पद हो सकता है, पर किसी एक व्याख्यात्मक पद को चुनना अर्थ को अनावश्यक रूप से सीमित करता।
- issue: מִשְׁפָּחָה की सामाजिक इकाई
  choice: कुल
  alternative: परिवार या वंश-समूह
  rationale: ‘कुल’ गोत्र के भीतर या उससे संबद्ध बड़े नातेदारी-समूह का संकेत दे सकता है और आधुनिक छोटे परिवार के अर्थ से बचाता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। कथन की कठोर आज्ञा, मुँह पर हाथ रखने की मूल छवि तथा ‘पिता’ और ‘याजक’ की सांस्कृतिक-धार्मिक तनावपूर्ण संगति सुरक्षित है।
