language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יָּשִׂ֣ימוּ לָ/הֶ֔ם אֶת פֶּ֥סֶל מִיכָ֖ה אֲשֶׁ֣ר עָשָׂ֑ה כָּל יְמֵ֛י הֱי֥וֹת בֵּית הָ/אֱלֹהִ֖ים בְּ/שִׁלֹֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/031.yaml
  text: So they set up for themselves Micah’s carved image that he had made[a], all the days that the house of God was in Shiloh.
translation:
  language: hi
  text: उन्होंने मीका की बनाई हुई तराशी हुई मूर्ति को अपने लिए तब तक स्थापित रखा, जब तक परमेश्वर का भवन शीलो में रहा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשִׂימוּ לָהֶם
  choice: उन्होंने ... अपने लिए स्थापित कर ली
  rationale: שׂים का मूल अर्थ रखना/स्थापित करना है; उपासना के लिए प्रतिमा लगाए जाने के संदर्भ में ‘स्थापित कर ली’ स्वाभाविक है और לָהֶם का स्वहितार्थ ‘अपने लिए’ से सुरक्षित रहता है।
- source_word: פֶּסֶל
  choice: खुदी हुई मूर्ति
  rationale: यह शब्द उपासना के लिए गढ़ी या तराशी गई प्रतिमा को दर्शाता है। ‘खुदी हुई मूर्ति’ उसके ठोस, निर्मित स्वरूप को बनाए रखता है; ‘मूरत’ अपेक्षाकृत साहित्यिक और ‘मूर्ति’ अकेला कुछ कम विशिष्ट है।
- source_word: מִיכָה
  choice: मीका
  rationale: व्यक्तिनाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: אֲשֶׁר עָשָׂה
  choice: मीका की बनाई हुई
  rationale: सम्बन्धवाचक उपवाक्य को स्वाभाविक हिन्दी कृदन्तीय रचना में व्यक्त किया गया है; इससे स्पष्ट रहता है कि मूर्ति पहले मीका ने बनाई थी।
- source_word: כָּל יְמֵי הֱיוֹת
  choice: उन सभी दिनों तक ... जब तक ... था
  rationale: यह अवधि-सूचक इब्रानी अभिव्यक्ति है। हिन्दी में ‘जब तक’ अवधि की सीमा को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: בֵּית הָאֱלֹהִים
  choice: परमेश्वर का भवन
  rationale: स्रोत के ‘परमेश्वर के घर/भवन’ रूप को निकटता से रखता है और व्याख्यात्मक ‘पवित्रस्थान’ जोड़ने से बचता है।
- source_word: בְּשִׁלֹה
  choice: शीलो में
  rationale: स्थाननाम का प्रचलित हिन्दी लिप्यंतरण और पूर्वसर्ग का सीधा अनुवाद।
theological_decisions:
- issue: दान के अनुचित उपासना-केंद्र और शीलो में परमेश्वर के भवन के बीच निहित विरोध
  choice: परमेश्वर का भवन
  alternative: परमेश्वर का पवित्रस्थान
  rationale: इब्रानी पद स्वयं ‘भवन/घर’ कहता है। ‘परमेश्वर का भवन’ वैध केंद्रीय उपासना और दान की मूर्ति के बीच कथात्मक तनाव को बनाए रखता है, बिना उसे व्याख्यात्मक शब्दावली से सुलझाए।
- issue: अंतिम कालवाचक वाक्यांश का सम्बन्ध
  choice: मूर्ति वहाँ उन सभी दिनों तक रही जब तक परमेश्वर का भवन शीलो में था
  alternative: उन्होंने उसे परमेश्वर का भवन शीलो में रहने के सभी दिनों में स्थापित रखा
  rationale: इब्रानी में मुख्य क्रिया ‘स्थापित किया’ है और अवधि-वाक्यांश उसके बने रहने का अर्थ प्रसंगतः देता है। स्पष्ट हिन्दी के लिए ‘वह ... वहाँ रही’ निहित निरंतरता को व्यक्त करता है, पर मूर्ति के अंतिम परिणाम के विषय में कुछ नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी, सामान्य पाठक के लिए स्पष्ट और गरिमापूर्ण। ‘स्थापित कर ली’ उपासना-संबंधी स्थापना को व्यक्त करता है। ‘परमेश्वर का भवन’ स्रोत की ठोस अभिव्यक्ति और प्रसंग का धर्मवैचारिक तनाव सुरक्षित रखता है।
