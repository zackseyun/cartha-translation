  text: וַֽ/יַּעֲל֞וּ חֲמֵ֣שֶׁת הָ/אֲנָשִׁ֗ים הַ/הֹלְכִים֮ לְ/רַגֵּ֣ל אֶת הָ/אָרֶץ֒ בָּ֣אוּ שָׁ֔מָּ/ה לָקְח֗וּ אֶת הַ/פֶּ֨סֶל֙ וְ/אֶת הָ֣/אֵפ֔וֹד וְ/אֶת הַ/תְּרָפִ֖ים וְ/אֶת הַ/מַּסֵּכָ֑ה וְ/הַ/כֹּהֵ֗ן נִצָּב֙ פֶּ֣תַח הַ/שַּׁ֔עַר וְ/שֵׁשׁ מֵא֣וֹת הָ/אִ֔ישׁ הֶ/חָג֖וּר כְּלֵ֥י הַ/מִּלְחָמָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/017.yaml
  text: Then the five men who had gone to spy out the land went up[a], came there, and took the carved image, the ephod, the household gods, and the cast image[b], while the priest was standing at the entrance of the gate with the six hundred men armed with weapons of war.
translation:
  language: hi
  text: तब वे पाँचों पुरुष, जो देश की जासूसी करने गए थे, ऊपर चढ़े और वहाँ आकर तराशी हुई मूर्ति, एपोद, गृह-देवता[a] और ढली हुई मूर्ति[b] ले लिया। उस समय याजक फाटक के प्रवेश पर युद्ध के हथियारों से लैस उन छह सौ पुरुषों के साथ खड़ा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तराफीम।” इब्रानी शब्द घर में रखी जाने वाली उपासना-संबंधी वस्तुओं या गृह-देवताओं के लिए प्रयुक्त होता है।
    reason: lexical_alternative
  - marker: b
    text: 'परंपरागत अनुवाद: “धातु की ढली हुई मूर्ति।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: ऊपर चढ़े
  rationale: עלה का सामान्य अर्थ ‘ऊपर जाना/चढ़ना’ है। यहाँ कथात्मक गति में निहित दिशा को बनाए रखा गया है; केवल ‘गए’ कहना स्रोत की इस विशेषता को मिटा देता।
- source_word: הַהֹלְכִים לְרַגֵּל אֶת־הָאָרֶץ
  choice: जो देश की जासूसी करने गए थे
  rationale: רגל इस सैनिक और रणनीतिक संदर्भ में गुप्त रूप से भूमि का निरीक्षण करने को दर्शाता है। ‘गए थे’ इस अभियान के वर्तमान घटना से पहले होने को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: בָּאוּ שָׁמָּה
  choice: वहाँ आकर
  rationale: यह ‘वहाँ आए’ का स्वाभाविक हिन्दी रूप है और किसी भवन में प्रवेश करने की बात अनावश्यक रूप से नहीं जोड़ता।
- source_word: לָקְחוּ
  choice: उठा ले गए
  rationale: לקח का मूल अर्थ ‘लेना’ है। वस्तुओं को अपने साथ ले जाने के प्रसंग में ‘उठा ले गए’ स्वाभाविक है और चोरी का अतिरिक्त मूल्यांकन शब्द में नहीं जोड़ता।
- source_word: הַפֶּסֶל
  choice: नक्काशी की हुई मूर्ति
  rationale: פסל तराशकर या नक्काशी करके बनाई गई प्रतिमा को सूचित करता है। यह रूप निर्माण-विधि को स्पष्ट रखता है, जबकि ‘मूर्ति’ मात्र से वह भेद मिट जाता।
- source_word: הָאֵפוֹד
  choice: एपोद
  rationale: אֵפוֹד एक विशिष्ट धार्मिक-सांस्कृतिक वस्तु है जिसका सरल हिन्दी समकक्ष नहीं है; इसलिए लिप्यंतरण उचित है।
- source_word: הַתְּרָפִים
  choice: गृह-देवता
  rationale: תרפים घर में रखी जाने वाली उपासना-संबंधी प्रतिमाओं या देव-वस्तुओं को दर्शाता है। पाठक-सुलभ अर्थ मुख्य पाठ में और मूल पद का लिप्यंतरण पादटिप्पणी में दिया गया है।
- source_word: הַמַּסֵּכָה
  choice: ढली हुई मूर्ति
  rationale: מסכה साँचे में ढालकर, प्रायः धातु से, बनाई गई प्रतिमा है। ‘ढली हुई मूर्ति’ आधुनिक हिन्दी में निर्माण-विधि को सही रूप से व्यक्त करती है।
- source_word: וְהַכֹּהֵן נִצָּב
  choice: उस समय याजक … खड़ा था
  rationale: यह खंड वस्तुओं को उठाए जाने के साथ-साथ चल रही परिस्थिति बताता है; ‘उस समय’ इस संबंध को सहज हिन्दी में व्यक्त करता है।
- source_word: פֶּתַח הַשַּׁעַר
  choice: फाटक के प्रवेश-द्वार पर
  rationale: यह פתח और שער दोनों की छवि बनाए रखता है और स्थान को स्पष्ट करता है।
- source_word: וְשֵׁשׁ מֵאוֹת הָאִישׁ הֶחָגוּר כְּלֵי הַמִּלְחָמָה
  choice: युद्ध के हथियारों से लैस उन छह सौ पुरुषों के साथ
  rationale: חגור का शाब्दिक भाव हथियार बाँधने का है; ‘हथियारों से लैस’ वर्तमान हिन्दी में उसी सैनिक तैयारी को स्वाभाविक ढंग से व्यक्त करता है। वाक्य-विन्यास याजक और छह सौ पुरुषों को प्रवेश-द्वार पर उपस्थित दिखाता है।
theological_decisions:
- issue: תרפים को देवताओं या उपासना-वस्तुओं के रूप में व्यक्त करना
  choice: मुख्य पाठ में ‘गृह-देवता’, पादटिप्पणी में ‘तराफीम’
  alternative: ‘गृह-मूर्तियाँ’ या केवल ‘तराफीम’
  rationale: ‘गृह-देवता’ पद का प्रचलित अर्थ पाठक तक पहुँचाता है, पर पादटिप्पणी यह बनाए रखती है कि इब्रानी शब्द विशिष्ट घरेलू उपासना-वस्तुओं के लिए है। इससे कथाकार की धार्मिक स्वीकृति का कोई अतिरिक्त संकेत नहीं जोड़ा जाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक रखी गई है। ‘एपोद’ जैसे विशिष्ट सांस्कृतिक पद का लिप्यंतरण किया गया है। अंग्रेज़ी परामर्श-पाठ में [a] का चिह्न ‘went up’ के बाद असंगत रूप से था, जबकि उसकी पादटिप्पणी תרפים से संबंधित है; हिन्दी में चिह्न को सही पद ‘गृह-देवता’ के बाद रखा गया है।
