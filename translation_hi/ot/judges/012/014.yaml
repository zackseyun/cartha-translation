  yaml_path: translation/ot/judges/012/014.yaml
  text: He had forty sons and thirty grandsons, riding on seventy donkeys, and he judged Israel eight years.
translation:
  language: hi
  text: उसके चालीस बेटे और तीस पोते थे, जो सत्तर गधों पर सवार होते थे। उसने आठ वर्ष तक इस्राएल का न्याय किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי בָנִים
  choice: पोते
  rationale: शाब्दिक अर्थ ‘बेटों के बेटे’ है; आधुनिक हिन्दी में इसका स्वाभाविक और सटीक समतुल्य ‘पोते’ है।
- source_word: עֲיָרִם
  choice: गधों
  rationale: यहाँ शब्द नर गधों/गधे के बच्चों को सूचित कर सकता है; प्रसंग में सवारी के पशु के सामान्य और स्पष्ट उल्लेख के लिए ‘गधों’ चुना गया।
- source_word: וַיִּשְׁפֹּט
  choice: न्याय किया
  rationale: न्यायियों की पुस्तक में यह क्रिया न्याय करने के साथ नेतृत्व/शासन का भाव रखती है; ‘न्याय किया’ मूल पदावली और पुस्तक के पारिभाषिक संबंध को बनाए रखता है।
theological_decisions:
- issue: ‘न्याय किया’ में नेतृत्व का निहित भाव
  choice: इस्राएल का न्याय किया
  alternative: इस्राएल पर शासन किया
  rationale: मूल क्रिया שפט को सीधे दर्शाते हुए न्यायी की नेतृत्वकारी भूमिका को अनावश्यक रूप से केवल राजनीतिक शासन तक सीमित नहीं किया गया।
translation_notes:
  register: सरल, आधुनिक और गरिमापूर्ण हिन्दी। बहुवचन कृदंत ‘सवार’ को बेटों और पोतों के पूरे समूह से जोड़ने के लिए स्वाभाविक सम्बन्धवाचक वाक्य प्रयोग किया गया है।
