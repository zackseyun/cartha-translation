  text: וַ/יִּשְׁפֹּ֤ט אַֽחֲרָי/ו֙ אֶת יִשְׂרָאֵ֔ל אִבְצָ֖ן מִ/בֵּ֥ית לָֽחֶם־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/012/008.yaml
  text: After him[a], Ibzan from Bethlehem judged Israel.
translation:
  language: hi
  text: उसके बाद बेतलेहेम के इबसान ने इस्राएल का न्याय किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁפֹּט
  choice: न्याय किया
  rationale: न्यायियों की पुस्तक में שׁפט न्यायी के रूप में शासन और अगुवाई करने के लिए बार-बार प्रयुक्त होता है। “न्याय किया” पुस्तक की मुख्य शब्दावली को बनाए रखता है।
- source_word: אַחֲרָיו
  choice: उसके बाद
  rationale: यह पदबंध पिछले न्यायी के बाद उत्तराधिकार या क्रम को दर्शाता है; संदर्भ स्पष्ट होने के कारण उसका नाम जोड़ना आवश्यक नहीं है।
- source_word: אֶת יִשְׂרָאֵל
  choice: इस्राएल का
  rationale: אֵת कर्म-चिह्न है और יִשְׂרָאֵל न्याय करने की क्रिया का कर्म है। हिन्दी में “इस्राएल का न्याय किया” स्वाभाविक और सटीक है।
- source_word: אִבְצָן
  choice: इबसान
  rationale: व्यक्तिनाम को प्रचलित हिन्दी बाइबलीय लिप्यंतरण के अनुरूप प्रस्तुत किया गया है।
- source_word: מִבֵּית לָחֶם
  choice: बेतलेहेम के
  rationale: מִן यहाँ मूल स्थान या स्थान-संबंध बता सकता है। हिन्दी में किसी व्यक्ति की नगर-संबद्धता के लिए “बेतलेहेम के” स्वाभाविक है और “वहाँ से आए” अर्थ को अनावश्यक रूप से निश्चित नहीं करता।
