base_translation:
  language: en
  yaml_path: translation/ot/judges/012/009.yaml
  text: He had thirty sons[a], and thirty daughters he sent away, and he brought in thirty daughters from outside for his sons. And he judged Israel seven years.
translation:
  language: hi
  text: उसके तीस बेटे[a] थे। उसने तीस बेटियों को बाहर भेजा और अपने बेटों के लिए बाहर से तीस बेटियाँ ले आया। उसने सात वर्ष तक इस्राएल का न्याय किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक स्पष्ट अर्थ संभवतः यह है: “उसने अपनी तीस बेटियों का विवाह अपने कुल या घराने से बाहर किया और अपने बेटों के लिए बाहर से तीस स्त्रियाँ ब्याह लाया।” इब्रानी में दोनों जगह शब्दशः “बेटियाँ” है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי לוֹ
  choice: उसके ... थे
  rationale: היה + לְ स्वामित्व व्यक्त करने वाला इब्रानी मुहावरा है; हिंदी में ‘उसके ... थे’ स्वाभाविक है।
- source_word: שְׁלֹשִׁים בָּנִים
  choice: तीस बेटे
  rationale: संख्या और लिंग को सीधे और स्पष्ट रूप से सुरक्षित रखता है।
- source_word: וּשְׁלֹשִׁים בָּנוֹת שִׁלַּח הַחוּצָה
  choice: उसने अपनी तीस बेटियों को बाहर भेज दिया
  rationale: मुख्य पाठ में שׁלח और הַחוּצָה की प्रत्यक्ष शब्दावली रखी गई है; विवाह का संभावित आशय पादटिप्पणी में स्पष्ट किया गया है, ताकि मूल की संक्षिप्तता पर अनावश्यक व्याख्या न थोपी जाए।
- source_word: וּשְׁלֹשִׁים בָּנוֹת הֵבִיא לְבָנָיו מִן הַחוּץ
  choice: अपने बेटों के लिए बाहर से तीस बेटियाँ ले आया
  rationale: मूल में दोहराए गए ‘बेटियाँ’ को सुरक्षित रखा गया है। संदर्भ में वे पुत्रों के लिए लाई गई युवतियाँ, संभवतः पत्नियाँ, हैं; किंतु मुख्य पाठ मूल की अभिव्यक्ति बनाए रखता है।
- source_word: וַיִּשְׁפֹּט אֶת יִשְׂרָאֵל
  choice: उसने ... इस्राएल का न्याय किया
  rationale: न्यायियों की पुस्तक में שׁפט की आवर्ती भूमिका-संबंधी शब्दावली को ‘न्याय किया’ द्वारा सुरक्षित रखा गया है; ‘नेतृत्व किया’ अधिक व्याख्यात्मक होता।
- source_word: שֶׁבַע שָׁנִים
  choice: सात वर्ष तक
  rationale: अवधि को स्वाभाविक आधुनिक हिंदी में व्यक्त करता है।
theological_decisions:
- issue: बेटियों को बाहर भेजने और बाहर से बेटियाँ लाने का आशय
  choice: मुख्य पाठ में शाब्दिक ‘बेटियाँ’ और ‘बाहर’ रखा गया; विवाह-संबंधी आशय पादटिप्पणी में दिया गया।
  alternative: उसने अपनी तीस बेटियों का विवाह अपने कुल/घराने से बाहर किया और अपने बेटों के लिए बाहर से तीस स्त्रियाँ ब्याह लाया।
  rationale: संदर्भ विवाह-संबंधों की ओर संकेत करता है, पर इब्रानी पाठ दोनों स्थानों पर ‘बेटियाँ’ कहता है और विवाह के लिए स्पष्ट क्रिया नहीं देता। इसलिए संभावित सामाजिक आशय को निश्चित बनाकर मुख्य पाठ में नहीं डाला गया।
translation_notes:
  register: आधुनिक, सरल और गरिमापूर्ण हिंदी। ‘न्याय किया’ पुस्तक की प्रमुख पारिभाषिक पुनरावृत्ति को बनाए रखता है। पादटिप्पणी का चिह्न [a] मुख्य पाठ में उपस्थित है।
