base_translation:
  language: en
  yaml_path: translation/ot/judges/012/015.yaml
  text: And Abdon son of Hillel the Pirathonite died[a], and he was buried in Pirathon, in the land of Ephraim, in the hill country of the Amalekites.
translation:
  language: hi
  text: अब्दोन, जो हिल्लेल का पुत्र और पिरातोनवासी था, मर गया; और उसे एप्रैम के प्रदेश में, अमालेकियों के पहाड़ी इलाके में स्थित पिरातोन में दफनाया गया[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शब्दशः: “अमालेकी के पहाड़ी प्रदेश में।” इब्रानी में निवासी-सूचक शब्द एकवचन है, पर सम्भवतः उसका प्रयोग सामूहिक या क्षेत्रीय अर्थ में हुआ है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: मर गया
  rationale: מות यहाँ सीधे मृत्यु को व्यक्त करता है; ‘मर गया’ स्पष्ट और स्वाभाविक है तथा अनावश्यक शिष्टोक्ति से बचता है।
- source_word: עַבְדּוֹן
  choice: अब्दोन
  rationale: व्यक्तिवाचक नाम का मानक हिन्दी लिप्यंतरण।
- source_word: בֶּן
  choice: पुत्र
  rationale: यह रचनात्मक संबंध पुत्रत्व बताता है; गरिमापूर्ण आधुनिक हिन्दी में ‘पुत्र’ संक्षिप्त और स्वाभाविक है।
- source_word: הִלֵּל
  choice: हिल्लेल
  rationale: व्यक्तिवाचक नाम का स्रोत-ध्वनियों के निकट हिन्दी लिप्यंतरण।
- source_word: הַפִּרְעָתוֹנִי
  choice: पिरातोनवासी
  rationale: यह निवासी-सूचक शब्द अब्दोन का पिरातोन से संबंध बताता है; ‘पिरातोनवासी’ हिन्दी में संक्षिप्त और सहज है।
- source_word: וַיִּקָּבֵר
  choice: उसे दफनाया गया
  rationale: קבר का निफ़अल रूप यहाँ निष्क्रिय अर्थ देता है; स्पष्ट हिन्दी के लिए कर्म-सर्वनाम जोड़ा गया है।
- source_word: בְּפִרְעָתוֹן
  choice: पिरातोन में
  rationale: स्थाननाम का लिप्यंतरण किया गया है और בְּ को स्थानवाचक ‘में’ से व्यक्त किया गया है।
- source_word: בְּאֶרֶץ אֶפְרַיִם
  choice: एप्रैम के प्रदेश में
  rationale: אֶרֶץ को स्पष्ट रखते हुए ‘प्रदेश’ चुना गया है, क्योंकि यहाँ भौगोलिक क्षेत्र अभिप्रेत है।
- source_word: בְּהַר הָעֲמָלֵקִי
  choice: अमालेकियों के पहाड़ी इलाके में
  rationale: क्षेत्रीय भौगोलिक प्रयोग में הַר पहाड़ी भूभाग को सूचित कर सकता है। एकवचन निवासी-सूचक रूप को सामूहिक/क्षेत्रीय अर्थ में ‘अमालेकियों’ कहा गया है; अधिक शब्दशः संभावना फुटनोट में सुरक्षित है।
