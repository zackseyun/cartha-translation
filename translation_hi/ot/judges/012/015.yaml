  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। भौगोलिक संबंध को स्वाभाविक बनाने के लिए ‘जो ... में था’ का प्रयोग किया गया है; इससे स्रोत का आशय स्पष्ट होता है, जबकि ‘अमालेकी’ के एकवचन रूप की वास्तविक अस्पष्टता फुटनोट में बनी रहती है।
