  yaml_path: translation/ot/judges/012/007.yaml
  text: Jephthah judged Israel six years[a]. Then Jephthah the Gileadite died and was buried in the cities of Gilead.
translation:
  language: hi
  text: यिप्तह छह वर्ष तक इस्राएल का न्यायी रहा। फिर गिलादी यिप्तह मर गया और उसे गिलाद के नगरों में[a] दफनाया गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल हिब्रू में शाब्दिक रूप से ‘गिलाद के नगरों में’ है। यहाँ बहुवचन संभवतः उस क्षेत्र के किसी अनिर्दिष्ट नगर के लिए मुहावरेदार ढंग से प्रयुक्त हुआ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁפֹּט
  choice: न्याय किया
  rationale: न्यायियों की पुस्तक में שׁפט न्यायी के रूप में इस्राएल का नेतृत्व और न्याय करने के लिए प्रयुक्त आवर्ती शब्द है। ‘न्याय किया’ पुस्तक की शब्दावली बनाए रखता है और भूमिका को केवल शासन या सैनिक नेतृत्व तक सीमित नहीं करता।
- source_word: שֵׁשׁ שָׁנִים
  choice: छह वर्ष तक
  rationale: यह अवधि बताने वाला सीधा वाक्यांश है; ‘तक’ स्वाभाविक हिन्दी में पूरी अवधि व्यक्त करता है।
- source_word: הַגִּלְעָדִי
  choice: गिलादी
  rationale: यह विशेषण यिप्तह की क्षेत्रीय पहचान बताता है। ‘गिलादी’ संक्षिप्त है और मूल के जातिवाचक/क्षेत्रवाचक रूप को बनाए रखता है।
- source_word: וַיִּקָּבֵר
  choice: उसे … दफनाया गया
  rationale: यह हिब्रू के निष्क्रिय क्रियारूप को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: בְּעָרֵי גִלְעָד
  choice: गिलाद के नगरों में
  rationale: मसोरेटिक पाठ में ‘नगरों’ बहुवचन है। मुख्य पाठ में बहुवचन बनाए रखने से कठिन और संभावित रूप से मुहावरेदार मूल अभिव्यक्ति को किसी एक अर्थ में चुपचाप सीमित नहीं किया जाता।
