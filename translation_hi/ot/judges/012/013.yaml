  yaml_path: translation/ot/judges/012/013.yaml
  text: After him, Abdon son of Hillel the Pirathonite judged Israel.
translation:
  language: hi
  text: उसके बाद पिरातोनवासी हिल्लेल के पुत्र अब्दोन ने इस्राएल का न्याय किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁפֹּט
  choice: न्याय किया
  rationale: न्यायियों की पुस्तक में שׁפט न्यायियों के कार्य के लिए बार-बार प्रयुक्त प्रमुख शब्द है। ‘न्याय किया’ इस आवर्ती शब्दावली को बनाए रखता है और यहाँ शासन या अगुवाई जैसे किसी एक व्यापक अर्थ को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: אַחֲרָיו
  choice: उसके बाद
  rationale: यह पदबंध पिछले न्यायी के बाद उत्तराधिकार या कालक्रम को व्यक्त करता है; आधुनिक हिन्दी में ‘उसके बाद’ सीधा और स्वाभाविक है।
- source_word: אֶת יִשְׂרָאֵל
  choice: इस्राएल का
  rationale: אֵת कर्म-चिह्न है और יִשְׂרָאֵל न्याय किए जाने वाले लोगों को सूचित करता है। हिन्दी में ‘न्याय करना’ के साथ ‘का’ स्वाभाविक संबंध व्यक्त करता है।
- source_word: עַבְדּוֹן
  choice: अब्दोन
  rationale: व्यक्तिनाम का निकट और प्रचलनानुकूल देवनागरी लिप्यंतरण।
- source_word: בֶּן הִלֵּל
  choice: हिल्लेल के पुत्र
  rationale: समासिक पदबंध अब्दोन की वंशगत पहचान देता है; ‘हिल्लेल के पुत्र’ हिन्दी में स्पष्ट और गरिमापूर्ण है।
- source_word: הַפִּרְעָתוֹנִי
  choice: पिरातोनवासी
  rationale: संज्ञाविशेषण पिरातोन से संबंधित या वहाँ के निवासी व्यक्ति को दर्शाता है; ‘पिरातोनवासी’ हिब्रू रूप का अर्थ स्वाभाविक हिन्दी में देता है।
