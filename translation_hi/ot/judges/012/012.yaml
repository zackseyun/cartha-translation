  yaml_path: translation/ot/judges/012/012.yaml
  text: Then Elon the Zebulunite died[a], and he was buried in Aijalon, in the land of Zebulun.
translation:
  language: hi
  text: फिर ज़बूलूनी एलोन मर गया, और उसे अय्यालोन में, ज़बूलून के प्रदेश में, दफनाया गया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּמָת
  choice: फिर ... मर गया
  rationale: क्रमिक कथन को स्वाभाविक हिन्दी में व्यक्त करता है और मूल क्रिया ‘मरना’ का सरल अर्थ बनाए रखता है।
- source_word: אֵלוֹן
  choice: एलोन
  rationale: व्यक्तिवाचक नाम का हिन्दी ध्वन्यात्मक लिप्यंतरण।
- source_word: הַזְּבוּלֹנִי
  choice: जबूलूनी
  rationale: संज्ञा-विशेषण एलोन की जबूलून गोत्र अथवा क्षेत्र से संबद्धता बताता है; संक्षिप्त हिन्दी जातिवाचक रूप उपयुक्त है।
- source_word: וַיִּקָּבֵר
  choice: और उसे ... दफनाया गया
  rationale: קבר के निफ़अल रूप का कर्मवाच्य अर्थ ‘दफनाया गया’ है; ‘उसे’ हिन्दी में संदर्भ स्पष्ट करता है।
- source_word: בְּאַיָּלוֹן
  choice: अय्यालोन में
  rationale: स्थान-नाम का लिप्यंतरण और בְּ का स्वाभाविक स्थानवाचक अनुवाद।
- source_word: בְּאֶרֶץ זְבוּלֻן
  choice: जबूलून के प्रदेश में
  rationale: אֶרֶץ यहाँ किसी गोत्र के भूभाग या प्रदेश को सूचित करता है; ‘प्रदेश’ इस भौगोलिक संदर्भ में स्वाभाविक और स्पष्ट है।
