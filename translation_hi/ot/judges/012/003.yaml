id: JDG.12.3
reference: Judges 12:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וָֽ/אֶרְאֶ֞ה כִּֽי אֵינְ/ךָ֣ מוֹשִׁ֗יע וָ/אָשִׂ֨ימָ/ה נַפְשִׁ֤/י בְ/כַפִּ/י֙ וָֽ/אֶעְבְּרָ/ה֙ אֶל בְּנֵ֣י עַמּ֔וֹן וַ/יִּתְּנֵ֥/ם יְהוָ֖ה בְּ/יָדִ֑/י וְ/לָ/מָ֞ה עֲלִיתֶ֥ם אֵלַ֛/י הַ/יּ֥וֹם הַ/זֶּ֖ה לְ/הִלָּ֥חֶם בִּֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/012/003.yaml
  text: When I saw that you were not delivering us[a], I put my life in my hand and crossed over against the Ammonites, and Yahweh gave them into my hand. So why have you come up against me today to fight against me?
translation:
  language: hi
  text: जब मैंने देखा कि तू हमें नहीं बचा रहा था, तब मैंने अपनी जान हथेली पर रख ली[a] और पार होकर अम्मोनियों के विरुद्ध गया, और याहवे ने उन्हें मेरे हाथ में दे दिया। फिर आज तुम लोग मेरे विरुद्ध युद्ध करने के लिए क्यों चढ़ आए हो?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: “मैंने अपना प्राण अपनी हथेली पर रख लिया”; अर्थात मैंने अपनी जान जोखिम में डाल दी।'
    reason: हिब्रू मुहावरे के बिंब और आशय को स्पष्ट करना।
lexical_decisions:
- source_word: וָאֶרְאֶה כִּי אֵינְךָ מוֹשִׁיעַ
  choice: जब मैंने देखा कि तू हमें छुड़ाने नहीं आ रहा था
  rationale: मूल में संबोधन एकवचन है और מוֹשִׁיעַ सैन्य संकट से छुड़ाने या बचाने को सूचित करता है। हिन्दी में अर्थ पूरा करने के लिए प्रसंग से निहित कर्म ‘हमें’ रखा गया है।
- source_word: וָאָשִׂימָה נַפְשִׁי בְכַפִּי
  choice: मैंने अपनी जान हथेली पर रख ली
  rationale: यह हिब्रू बिंब और उसका अर्थ—जान जोखिम में डालना—दोनों सुरक्षित रखता है; हिन्दी में भी यह स्वाभाविक और समझ में आने वाला मुहावरा है।
- source_word: וָאֶעְבְּרָה אֶל בְּנֵי עַמּוֹן
  choice: पार होकर अम्मोनियों के विरुद्ध गया
  rationale: עבר के पार जाने के भाव और युद्ध-संदर्भ में אֶל की विरोधी दिशा, दोनों को बनाए रखा गया है; किसी अनुल्लिखित नदी या स्थान को नहीं जोड़ा गया।
- source_word: וַיִּתְּנֵם יְהוָה בְּיָדִי
  choice: याहवे ने उन्हें मेरे हाथ में कर दिया
  rationale: यह विजय-सूचक हिब्रू सूत्र के ‘हाथ’ वाले बिंब को सुरक्षित रखता है और יְהוָה को उसके व्यक्तिगत नाम ‘याहवे’ से प्रस्तुत करता है।
- source_word: וְלָמָה עֲלִיתֶם אֵלַי הַיּוֹם הַזֶּה לְהִלָּחֶם בִּי
  choice: फिर आज तुम लोग मुझसे लड़ने के लिए मेरे विरुद्ध क्यों चढ़ आए हो?
  rationale: यहाँ संबोधन बहुवचन हो जाता है, जिसे ‘तुम लोग’ स्पष्ट करता है। युद्ध-संदर्भ में עלה का आक्रमण करने के लिए चढ़ आने का भाव और בִּי का विरोधी अर्थ सुरक्षित है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का रूप
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में वाचा का व्यक्तिगत नाम स्पष्ट रूप से है। ‘याहवे’ उसे उपाधि से बदलने के बजाय नाम के रूप में प्रस्तुत करता है।
- issue: एकवचन से बहुवचन संबोधन का परिवर्तन
  choice: पहले ‘तू’, फिर ‘तुम लोग’
  alternative: दोनों स्थानों पर ‘तुम’
  rationale: हिब्रू पहले एकवचन אֵינְךָ और फिर बहुवचन עֲלִיתֶם प्रयोग करता है। अनिश्चित व्याकरणिक तनाव को समतल करने के बजाय हिन्दी में इसे दृश्यमान रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक रूप अपनाया गया है। सैन्य प्रसंग के मुहावरों को जहाँ सम्भव हुआ, मूल बिंब सहित रखा गया है। आरम्भिक एकवचन और बाद के बहुवचन संबोधन का अंतर जानबूझकर सुरक्षित है।
