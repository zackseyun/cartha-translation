  text: Then Ibzan died and was buried in Bethlehem.
translation:
  language: hi
  text: फिर इब्सान मर गया और उसे बेतलेहेम में दफ़नाया गया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּמָת
  choice: फिर ... मर गया
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है; आधुनिक हिन्दी में ‘फिर’ स्वाभाविक रूप से घटनाक्रम व्यक्त करता है, और क्रिया का अर्थ ‘मर गया’ है।
- source_word: אִבְצָן
  choice: इब्सान
  rationale: व्यक्तिवाचक नाम को हिन्दी में उसके हिब्रू उच्चारण के निकट लिप्यंतरित किया गया है।
- source_word: וַיִּקָּבֵר
  choice: उसे ... दफ़नाया गया
  rationale: निफ़अल रूप यहाँ कर्मवाच्य अर्थ देता है; यह प्रयोग आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: בְּבֵית לָחֶם
  choice: बेतलेहेम में
  rationale: पूर्वसर्ग בְּ स्थान सूचित करता है, इसलिए ‘में’ चुना गया; स्थान-नाम को प्रचलित हिन्दी बाइबलीय रूप में लिप्यंतरित किया गया है।
