source:
  edition: WLC
  text: וַ/יִּקְבֹּ֤ץ יִפְתָּח֙ אֶת כָּל אַנְשֵׁ֣י גִלְעָ֔ד וַ/יִּלָּ֖חֶם אֶת אֶפְרָ֑יִם וַ/יַּכּוּ֩ אַנְשֵׁ֨י גִלְעָ֜ד אֶת אֶפְרַ֗יִם כִּ֤י אָמְרוּ֙ פְּלִיטֵ֤י אֶפְרַ֨יִם֙ אַתֶּ֔ם גִּלְעָ֕ד בְּ/ת֥וֹךְ אֶפְרַ֖יִם בְּ/ת֥וֹךְ מְנַשֶּֽׁה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/012/004.yaml
  text: Then Jephthah gathered all the men of Gilead and fought with Ephraim. And the men of Gilead struck Ephraim down[a], because they had said, “You Gileadites are fugitives of Ephraim, in the midst of Ephraim and in the midst of Manasseh.”
translation:
  language: hi
  text: तब यिप्तह ने गिलाद के सभी पुरुषों को इकट्ठा किया और एप्रैम से युद्ध किया। गिलाद के पुरुषों ने एप्रैम को मार गिराया, क्योंकि उन्होंने कहा था, “तुम गिलादी लोग एप्रैम से भागे हुए लोग हो, एप्रैम के बीच में और मनश्शे के बीच में।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अंतिम आरोप का इब्रानी वाक्य कठिन है। इसका अनुवाद यह भी हो सकता है: “हे गिलाद, तुम एप्रैम के भगोड़े हो, एप्रैम के बीच में और मनश्शे के बीच में।”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקְבֹּץ
  choice: इकट्ठा किया
  rationale: קבץ का सामान्य अर्थ इकट्ठा या एकत्र करना है। युद्ध के संदर्भ में यह सेना जुटाने का भाव रखता है, पर हिन्दी में अनावश्यक रूप से औपचारिक सैन्य भर्ती का अर्थ नहीं जोड़ता।
- source_word: כָּל אַנְשֵׁי גִלְעָד
  choice: गिलाद के सभी पुरुषों
  rationale: यह मूल के ‘गिलाद के सब पुरुष’ के निकट है। प्रसंग में योद्धा अभिप्रेत हैं, पर ‘योद्धाओं’ कहना मूल से अधिक विशिष्ट होता।
- source_word: וַיִּלָּחֶם אֶת אֶפְרָיִם
  choice: एप्रैम से युद्ध किया
  rationale: לחם का निफ़अल युद्ध करने या लड़ने को व्यक्त करता है। ‘से युद्ध किया’ आधुनिक हिन्दी में स्वाभाविक है और विरोधी पक्ष को स्पष्ट करता है।
- source_word: וַיַּכּוּ
  choice: मार गिराया
  rationale: נכה प्रहार करने, मार गिराने या पराजित करने के अर्थ में आ सकता है। ‘मार गिराया’ हिंसक युद्धार्थ को बनाए रखता है, पर हर व्यक्ति की मृत्यु का अनावश्यक दावा नहीं करता।
- source_word: פְּלִיטֵי אֶפְרַיִם
  choice: एप्रैम से भागे हुए लोग
  rationale: פְּלִיטֵי का मूल भाव बच निकलने या भागने वालों का है। यह चयन हिन्दी में अपमानजनक आरोप का आशय व्यक्त करता है और ‘शरणार्थी’ जैसे आधुनिक वैधानिक अर्थ से बचता है।
- source_word: אַתֶּם גִּלְעָד
  choice: तुम गिलादी
  rationale: मूल में स्थाननाम गिलाद वहाँ के लोगों के लिए आया है। ‘गिलादी’ उस सामूहिक संबोधन का संक्षिप्त और स्वाभाविक हिन्दी रूप है।
- source_word: בְּתוֹךְ אֶפְרַיִם בְּתוֹךְ מְנַשֶּׁה
  choice: एप्रैम के बीच और मनश्शे के बीच
  rationale: בְּתוֹךְ का अर्थ बीच में या मध्य में है। मूल की पुनरावृत्ति बनाए रखी गई है; ‘के बीच’ स्थानिक संबंध को बिना ‘दोनों के बीच’ जैसी व्याख्या जोड़े प्रस्तुत करता है।
theological_decisions:
- issue: अंतिम आरोप की कठिन और संक्षिप्त वाक्य-रचना
  choice: “तुम गिलादी एप्रैम से भागे हुए लोग हो, एप्रैम के बीच और मनश्शे के बीच।”
  alternative: “हे गिलाद, तुम एप्रैम के भगोड़े हो, एप्रैम और मनश्शे के बीच।”
  rationale: इब्रानी आरोप की वाक्य-रचना अस्पष्ट है। मुख्य पाठ अपमान की सीधी वाणी और פְּלִיטֵי के भागने के भाव को बचाता है, जबकि पादटिप्पणी वैकल्पिक संबोधन और संबंध को सामने रखती है; किसी धर्मवैज्ञानिक निष्कर्ष को आरोपित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और कथात्मक शैली रखी गई है। जातीय/भौगोलिक नामों के लिए प्रचलित बाइबिलीय रूप ‘यिप्तह’, ‘गिलाद’, ‘एप्रैम’ और ‘मनश्शे’ प्रयुक्त हैं। कठिन अंतिम आरोप को मूल पाठ में अधिक स्पष्ट बनाकर हल नहीं किया गया; उसकी वास्तविक अस्पष्टता पादटिप्पणी में संरक्षित है।
