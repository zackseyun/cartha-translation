base_translation:
  language: en
  yaml_path: translation/ot/judges/012/002.yaml
  text: Jephthah said to them[a], “I and my people were in a bitter conflict with the Ammonites, and I called out to you, but you did not save me from their hand.”
translation:
  language: hi
  text: यिप्तह ने उनसे कहा[a], “मैं और मेरे लोग अम्मोनियों के साथ घोर संघर्ष में थे। मैंने सहायता के लिए तुम्हें पुकारा, पर तुमने मुझे उनके हाथ से नहीं बचाया।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप में: “मैं और मेरे लोग अम्मोनियों के साथ बहुत बड़े झगड़े में थे।”'
    reason: मूल इब्रानी पदबंध אִישׁ רִיב और वाक्य-विन्यास का अधिक औपचारिक विकल्प।
lexical_decisions:
- source_word: אִישׁ רִיב ... מְאֹד
  choice: घोर संघर्ष में थे
  rationale: शाब्दिक पदबंध ‘झगड़े का मनुष्य’ यहाँ היה के साथ यिप्तह और उसके लोगों की परिस्थिति बताता है। ‘घोर संघर्ष’ רִיב और מְאֹד की तीव्रता को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: וְעַמִּי
  choice: और मेरे लोग
  rationale: עַם का सामान्य अर्थ ‘लोग’ है; इसे केवल सेना या कुटुम्ब तक सीमित करने का पर्याप्त आधार नहीं है।
- source_word: וּבְנֵי עַמּוֹן
  choice: अम्मोनियों के साथ
  rationale: בני עמון जातिनाम है, जिसका स्वाभाविक हिन्दी रूप ‘अम्मोनी’ है।
- source_word: וָאֶזְעַק אֶתְכֶם
  choice: मैंने सहायता के लिए तुम्हें पुकारा
  rationale: זעק संकट में सहायता की पुकार को सूचित करता है। ‘सहायता के लिए’ प्रसंगगत आशय स्पष्ट करता है, जबकि पुकार की दिशा ‘तुम्हें’ में बनी रहती है।
- source_word: וְלֹא הוֹשַׁעְתֶּם אוֹתִי
  choice: पर तुमने मुझे ... नहीं बचाया
  rationale: ישׁע का हिफ़ील रूप बचाने या छुड़ाने का अर्थ देता है; सैन्य संकट के इस प्रसंग में ‘बचाया’ सीधा और सहज है।
- source_word: מִיָּדָם
  choice: उनके हाथ से
  rationale: मूल पाठ की ‘हाथ’ वाली सत्ता अथवा नियंत्रण की उपमा हिन्दी में भी समझ में आती है और स्रोत-चित्र को सुरक्षित रखती है।
