source:
  edition: WLC
  text: וַ/יֹּ֣אמְרוּ ל/וֹ֩ אֱמָר נָ֨א שִׁבֹּ֜לֶת וַ/יֹּ֣אמֶר סִבֹּ֗לֶת וְ/לֹ֤א יָכִין֙ לְ/דַבֵּ֣ר כֵּ֔ן וַ/יֹּאחֲז֣וּ אוֹת֔/וֹ וַ/יִּשְׁחָט֖וּ/הוּ אֶל מַעְבְּר֣וֹת הַ/יַּרְדֵּ֑ן וַ/יִּפֹּ֞ל בָּ/עֵ֤ת הַ/הִיא֙ מֵֽ/אֶפְרַ֔יִם אַרְבָּעִ֥ים וּ/שְׁנַ֖יִם אָֽלֶף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/012/006.yaml
  text: Then they said to him[a], “Please say ‘Shibboleth.’” But he said, “Sibboleth,” because he could not say it that way. So they seized him and slaughtered him at the fords of the Jordan. At that time forty-two thousand from Ephraim fell.
translation:
  language: hi
  text: तब वे उससे कहते थे, “ज़रा ‘शिब्बोलेत’[a] कहो।” पर वह “सिब्बोलेत” कहता था, क्योंकि वह उसे उस तरह बोल नहीं पाता था। तब वे उसे पकड़ लेते थे और यरदन के पार-स्थलों पर उसका वध कर देते थे। उस समय एप्रैम के बयालीस हज़ार लोग मारे गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘शिब्बोलेत’ का अर्थ सम्भवतः ‘अनाज की बाल’ या ‘धारा/बाढ़’ है; लेकिन यहाँ इसका प्रयोग उच्चारण की जाँच के लिए किया गया है।
    reason: शब्द के सम्भावित कोशगत अर्थों को सुरक्षित रखते हुए यह स्पष्ट करता है कि इस प्रसंग में यह उच्चारण-परीक्षा का शब्द है।
lexical_decisions:
- source_word: אֱמָר נָא
  choice: ज़रा ... कहो
  rationale: आज्ञार्थक क्रिया के साथ נָא अनुरोध को कुछ नरम बनाता है। आधुनिक हिन्दी में ‘ज़रा ... कहो’ स्वाभाविक है और जाँच के प्रसंग में विनम्र आग्रह का भाव रखता है।
- source_word: שִׁבֹּלֶת
  choice: शिब्बोलेत
  rationale: यहाँ शब्द का कोशगत अर्थ नहीं, बल्कि उसका उच्चारण पहचान की कसौटी है; इसलिए ध्वन्यंतरण रखा गया है।
- source_word: סִבֹּלֶת
  choice: सिब्बोलेत
  rationale: श और स के आरंभिक ध्वनि-भेद को देवनागरी में स्पष्ट रखते हुए कथानक का केंद्रीय उच्चारण-अंतर सुरक्षित किया गया है।
- source_word: וְלֹא יָכִין לְדַבֵּר כֵּן
  choice: क्योंकि वह उसे उस तरह बोल नहीं पाता था
  rationale: शाब्दिक मुहावरा अपने को वैसा बोलने के लिए तैयार/निर्देशित न कर पाने का है। प्रसंग में यह अपेक्षित ध्वनि बोलने की असमर्थता बताता है; हिन्दी रूप मूल की ‘उस तरह बोलने’ वाली अभिव्यक्ति को बनाए रखता है।
- source_word: וַיֹּאחֲזוּ אֹתוֹ
  choice: वे उसे पकड़कर
  rationale: אחז का अर्थ पकड़ना या दबोचना है। ‘पकड़कर’ तत्काल हिरासत और आगे की कार्रवाई को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וַיִּשְׁחָטוּהוּ
  choice: उसका वध कर देते
  rationale: שׁחט सामान्य ‘मार डालना’ से अधिक प्रबल है और काटकर वध करने के लिए प्रयुक्त होता है। ‘वध’ उसकी कठोरता को गरिमापूर्ण आधुनिक हिन्दी में बनाए रखता है।
- source_word: אֶל מַעְבְּרוֹת הַיַּרְדֵּן
  choice: यरदन के घाटों पर
  rationale: מַעְבְּרוֹת नदी पार करने के उथले स्थानों को दर्शाता है। ‘घाट’ हिन्दी में नदी के पारावार/पार करने के स्थान के लिए सहज है।
- source_word: וַיִּפֹּל ... מֵאֶפְרַיִם
  choice: एप्रैम के ... लोग मारे गए
  rationale: युद्ध और हिंसा के प्रसंग में נפל का अर्थ मरना है। ‘एप्रैम के लोग’ जनजातीय संबंध को सामान्य पाठक के लिए स्पष्ट करता है।
- source_word: אַרְבָּעִים וּשְׁנַיִם אָלֶף
  choice: बयालीस हज़ार
  rationale: मूल संख्या को यथावत स्वाभाविक हिन्दी संख्या-रूप में रखा गया है।
