  language: hi
  text: उसके बाद, जबूलूनी एलोन ने इस्राएल का न्याय किया। उसने दस वर्ष तक इस्राएल का न्याय किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁפֹּט
  choice: न्याय किया
  rationale: न्यायियों की पुस्तक में שׁפט न्यायियों की विशिष्ट भूमिका के लिए बार-बार प्रयुक्त होता है। ‘न्याय किया’ इस आवर्ती शब्दावली को बनाए रखता है और भूमिका को केवल नेतृत्व या शासन तक सीमित नहीं करता।
- source_word: אַחֲרָיו
  choice: उसके बाद
  rationale: सर्वनामिक रूप का सीधा अर्थ ‘उसके बाद’ है और संदर्भ में पिछले न्यायी की ओर संकेत करता है; पद में नाम न होने के कारण उसे स्पष्ट रूप से जोड़ना उचित नहीं है।
- source_word: אֵילוֹן
  choice: एलोन
  rationale: व्यक्तिनाम का आधुनिक हिन्दी में सरल लिप्यंतरण किया गया है।
- source_word: הַזְּבוּלֹנִי
  choice: जबूलून के
  rationale: यह कुल/गोत्र-संबंधसूचक रूप एलोन की जबूलून से संबद्धता बताता है। हिन्दी में ‘जबूलून के एलोन’ स्वाभाविक ढंग से यही पहचान व्यक्त करता है।
- source_word: עֶשֶׂר שָׁנִים
  choice: दस वर्ष तक
  rationale: अवधि को व्यक्त करने वाला स्वाभाविक हिन्दी प्रयोग।
- source_word: וַיִּשְׁפֹּט אֶת־יִשְׂרָאֵל ... וַיִּשְׁפֹּט אֶת־יִשְׂרָאֵל
  choice: इस्राएल का न्याय किया। उसने दस वर्ष तक इस्राएल का न्याय किया।
  rationale: इब्रानी में क्रिया और कर्म की वास्तविक पुनरावृत्ति है। दो छोटे वाक्यों में इसे रखना स्रोत की संरचना और पुस्तक की आवर्ती शब्दावली को सुरक्षित रखते हुए हिन्दी में स्पष्ट रहता है।
