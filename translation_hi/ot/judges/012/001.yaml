base_translation:
  language: en
  yaml_path: translation/ot/judges/012/001.yaml
  text: Then the men of Ephraim were called together[a], and they crossed over to Zaphon and said to Jephthah[c][b], “Why did you cross over to fight against the Ammonites and not call us to go with you? We will burn your house down over you with fire.”
translation:
  language: hi
  text: तब एप्रैम के लोगों को इकट्ठा किया गया, और वे साफोन[a] में पार उतर गए। उन्होंने यिप्तह से कहा, “तू अम्मोनियों से लड़ने के लिए पार क्यों गया और हमें अपने साथ चलने के लिए क्यों नहीं बुलाया? हम तेरे घर को तेरे ऊपर ही आग से जला देंगे।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उत्तर की ओर।” इब्रानी צָפוֹנָה को स्थाननाम “साफोन” अथवा दिशासूचक क्रिया-विशेषण माना जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּצָּעֵק אִישׁ אֶפְרַיִם
  choice: एप्रैम के लोग इकट्ठे बुलाए गए
  rationale: אִישׁ व्याकरण की दृष्टि से एकवचन है, पर आगे का बहुवचन וַיֹּאמְרוּ इसे सामूहिक अर्थ में लेने का संकेत देता है। צעק का निफ़अल रूप यहाँ युद्ध के लिए बुलाए या जुटाए जाने का भाव देता है।
- source_word: וַיַּעֲבֹר
  choice: पार गए
  rationale: क्रिया रूप एकवचन है, लेकिन सामूहिक कर्ता और आगे की बहुवचन क्रिया के कारण हिन्दी में बहुवचन स्वाभाविक और स्पष्ट है। עבר के मूल पार जाने के भाव को बनाए रखा गया है।
- source_word: צָפוֹנָה
  choice: साफोन की ओर
  rationale: इसे यहाँ स्थाननाम साफोन मानना प्रसंग में उपयुक्त है; दिशासूचक अर्थ ‘उत्तर की ओर’ भी व्याकरणतः संभव है, इसलिए उसे पादटिप्पणी में रखा गया है।
- source_word: לְהִלָּחֵם בִּבְנֵי עַמּוֹן
  choice: अम्मोनियों से लड़ने के लिए
  rationale: ‘अम्मोन के पुत्रों’ का स्वाभाविक आधुनिक हिन्दी जातिनाम ‘अम्मोनी’ है; ב के विरोधार्थक संबंध को ‘से लड़ने’ द्वारा व्यक्त किया गया है।
- source_word: וְלָנוּ לֹא קָרָאתָ לָלֶכֶת עִמָּךְ
  choice: हमें अपने साथ चलने के लिए क्यों नहीं बुलाया
  rationale: קרא यहाँ युद्ध-अभियान में साथ देने के लिए बुलाने का अर्थ रखता है। हिन्दी प्रश्न में दोहराया ‘क्यों’ शिकायत की समानांतर संरचना को स्पष्ट करता है।
- source_word: בֵּיתְךָ נִשְׂרֹף עָלֶיךָ בָּאֵשׁ
  choice: हम तेरे घर को तेरे ऊपर ही आग से जला देंगे
  rationale: शाब्दिक और हिंसक बिंब को बनाए रखते हुए עָלֶיךָ का ‘तेरे ऊपर ही’ अनूदित किया गया है। इससे घर में यिप्तह के उपस्थित होने का संकेत रहता है, पर उसे मुख्य पाठ में पूर्णतः स्पष्ट करके मूल की अंतर्निहितता को समाप्त नहीं किया गया।
