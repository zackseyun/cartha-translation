  register: आधुनिक मानक हिन्दी में सहज किंतु गरिमापूर्ण कथात्मक शैली अपनाई गई है। प्रत्यक्ष कथन में ‘तू/तेरे’ रखा गया है, क्योंकि यह शत्रुतापूर्ण सामना है। मूल की सामूहिक एकवचन और बहुवचन के तनाव को हिन्दी की स्पष्टता के लिए सामूहिक बहुवचन से व्यक्त किया गया है।
