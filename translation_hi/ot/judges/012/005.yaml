  text: וַ/יִּלְכֹּ֥ד גִּלְעָ֛ד אֶֽת מַעְבְּר֥וֹת הַ/יַּרְדֵּ֖ן לְ/אֶפְרָ֑יִם וְֽ֠/הָיָה כִּ֣י יֹאמְר֞וּ פְּלִיטֵ֤י אֶפְרַ֨יִם֙ אֶעֱבֹ֔רָה וַ/יֹּ֨אמְרוּ ל֧/וֹ אַנְשֵֽׁי גִלְעָ֛ד הַֽ/אֶפְרָתִ֥י אַ֖תָּה וַ/יֹּ֥אמֶֽר לֹֽא־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/012/005.yaml
  text: And Gilead captured the fords of the Jordan against Ephraim. And whenever the fugitives of Ephraim said[a], “Let me cross over,” the men of Gilead would say to him, “Are you an Ephraimite?” If he said, “No,”
translation:
  language: hi
  text: गिलाद के लोगों ने एप्रैम के विरुद्ध यरदन के घाटों[a] पर अधिकार कर लिया। जब कभी एप्रैम का कोई भगोड़ा कहता, “मुझे पार जाने दो,” तो गिलाद के लोग उससे पूछते, “क्या तुम एप्रैमी हो?” यदि वह कहता, “नहीं,”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात नदी के उथले पार-स्थल, जहाँ से यरदन को पार किया जाता था।
    reason: ‘घाटों’ के भौगोलिक अर्थ को स्पष्ट करता है, ताकि इसे सामान्य नदी-तट न समझा जाए।
lexical_decisions:
- source_word: וַיִּלְכֹּד גִּלְעָד
  choice: गिलाद के लोगों ने ... अधिकार कर लिया
  rationale: לכד सैन्य प्रसंग में किसी रणनीतिक स्थान को अपने नियंत्रण में लेने का भाव देता है। स्थानवाचक ‘गिलाद’ यहाँ उसके लोगों के लिए प्रयुक्त है; इसे स्पष्ट करना स्वाभाविक हिन्दी है।
- source_word: מַעְבְּרוֹת הַיַּרְדֵּן
  choice: यरदन के घाटों
  rationale: מַעְבָּרוֹת यहाँ नदी के उन उथले स्थानों को दर्शाता है जहाँ से पार जाया जाता था। हिन्दी में ‘घाट’ इस प्रसंग में संक्षिप्त और सहज है।
- source_word: לְאֶפְרָיִם
  choice: एप्रैम के विरुद्ध
  rationale: 'प्रसंग में ל विरोधी संबंध व्यक्त करता है: घाटों पर इसलिए अधिकार किया गया कि एप्रैमियों का मार्ग रोका या नियंत्रित किया जा सके।'
- source_word: וְהָיָה כִּי
  choice: जब कभी
  rationale: यह पदबंध बार-बार होने वाली प्रक्रिया आरम्भ करता है; ‘जब कभी’ उसके पुनरावृत्त भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: פְּלִיטֵי אֶפְרַיִם
  choice: एप्रैम का कोई भगोड़ा
  rationale: פָּלִיט युद्ध से बचकर निकलने या भागने वाले व्यक्ति को दर्शाता है। एक-एक व्यक्ति से पूछताछ होने के कारण हिन्दी में एकवचन वितरणात्मक रूप स्वाभाविक है।
- source_word: אֶעֱבֹרָה
  choice: मुझे पार जाने दो
  rationale: प्रथम पुरुष cohortative यहाँ इच्छा अथवा अनुमति की विनती व्यक्त करता है।
- source_word: הַאֶפְרָתִי אַתָּה
  choice: क्या तुम एप्रैमी हो?
  rationale: यह एप्रैम गोत्र से संबंधित पहचान का सीधा प्रश्न है; ‘एप्रैमी’ हिन्दी में उपयुक्त जातिवाचक रूप है।
- source_word: וַיֹּאמֶר לֹא
  choice: यदि वह कहता, “नहीं,”
  rationale: पुनरावृत्त जाँच-प्रक्रिया में यह अगली शर्त प्रस्तुत करता है; ‘यदि’ उस संबंध को स्पष्ट करता है और अगले पद के लिए वाक्य खुला रखता है।
