  text: וַ/יַּזְעֵ֨ק בָּרָ֜ק אֶת זְבוּלֻ֤ן וְ/אֶת נַפְתָּלִי֙ קֶ֔דְשָׁ/ה וַ/יַּ֣עַל בְּ/רַגְלָ֔י/ו עֲשֶׂ֥רֶת אַלְפֵ֖י אִ֑ישׁ וַ/תַּ֥עַל עִמּ֖/וֹ דְּבוֹרָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/010.yaml
  text: Then Barak summoned Zebulun and Naphtali to Kedesh[a], and ten thousand men went up following him, and Deborah went up with him.
translation:
  language: hi
  text: तब बाराक ने जबूलून और नप्ताली को केदेश आने के लिए बुलाया। दस हजार पुरुष उसके पीछे-पीछे चढ़ गए,[a] और दबोरा उसके साथ चढ़ गई।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ, “दस हजार पुरुष उसके पैरों पर चढ़ गए”; यह मुहावरा उसके पीछे चलने या उसके नेतृत्व में जाने का भाव देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּזְעֵק
  choice: बुलाकर इकट्ठा किया
  rationale: हिफ़ील रूप यहाँ सैन्य प्रसंग में लोगों को एक साथ बुलाने का भाव देता है। यह अभिव्यक्ति आधुनिक हिन्दी में स्वाभाविक है और औपचारिक भर्ती का अतिरिक्त अर्थ नहीं जोड़ती।
- source_word: אֶת זְבוּלֻן וְאֶת נַפְתָּלִי
  choice: जबूलून और नप्ताली
  rationale: ये बाराक द्वारा बुलाए गए गोत्रों के नाम हैं; इन्हें प्रचलित हिन्दी बाइबलीय रूपों के निकट लिप्यंतरित किया गया है।
- source_word: קֶדְשָׁה
  choice: केदेश में
  rationale: दिशासूचक ה स्थान की ओर गति दर्शाता है; हिन्दी में बुलाकर किसी स्थान पर एकत्र करने के प्रसंग में ‘केदेश में’ अधिक स्वाभाविक है, जबकि गमन का लक्ष्य निहित रहता है।
- source_word: וַיַּעַל
  choice: चढ़ गए
  rationale: עלה का मूल गमनार्थ ‘ऊपर जाना/चढ़ना’ सुरक्षित रखा गया है; सैन्य कूच का अनावश्यक विस्तार नहीं जोड़ा गया।
- source_word: בְּרַגְלָיו
  choice: उसके पीछे-पीछे
  rationale: शाब्दिक अर्थ ‘उसके पैरों पर/उसके पैरों के पास’ है, पर इस प्रसंग में यह बाराक के पीछे या उसके नेतृत्व में जाने का मुहावरा है। मुख्य पाठ में स्वाभाविक हिन्दी अर्थ दिया गया है और शाब्दिक रूप पादटिप्पणी में रखा गया है।
- source_word: עֲשֶׂרֶת אַלְפֵי אִישׁ
  choice: दस हजार पुरुष
  rationale: यह दस हजार पुरुषों की सैन्य टुकड़ी के लिए मानक संख्यात्मक अभिव्यक्ति है; ‘पुरुष’ स्रोत के लिंग और प्रसंग दोनों को व्यक्त करता है।
- source_word: וַתַּעַל עִמּוֹ דְּבוֹרָה
  choice: और दबोरा भी उसके साथ चढ़ गई
  rationale: दोहराए गए עלה को ‘चढ़ गई’ से सुरक्षित रखा गया है; ‘भी’ साथ जाने पर स्वाभाविक हिन्दी बल देता है।
