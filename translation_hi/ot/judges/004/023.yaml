source:
  edition: WLC
  text: וַ/יַּכְנַ֤ע אֱלֹהִים֙ בַּ/יּ֣וֹם הַ/ה֔וּא אֵ֖ת יָבִ֣ין מֶֽלֶךְ כְּנָ֑עַן לִ/פְנֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/023.yaml
  text: So on that day God subdued Jabin king of Canaan before the sons of Israel[a].
translation:
  language: hi
  text: इस प्रकार उस दिन परमेश्वर ने कनान के राजा याबीन को इस्राएलियों के सामने परास्त कर दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּכְנַע
  choice: परास्त कर दिया
  rationale: यहाँ כנע के हिफ़ील रूप का अर्थ किसी शत्रु को दबा देना या अधीन कर देना है। युद्ध और राजनीतिक पराजय के इस प्रसंग में ‘परास्त कर दिया’ स्वाभाविक और स्पष्ट है।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: यह पद इस्राएल के परमेश्वर को इतिहास में कार्य करते हुए प्रत्यक्ष कर्ता के रूप में प्रस्तुत करता है।
- source_word: בַּיּוֹם הַהוּא
  choice: उस दिन
  rationale: यह स्वाभाविक हिन्दी में इब्रानी कालसूचक पद का सीधा अर्थ सुरक्षित रखता है।
- source_word: יָבִין
  choice: याबीन
  rationale: व्यक्तिवाचक नाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण अपनाया गया है।
- source_word: מֶלֶךְ כְּנָעַן
  choice: कनान के राजा
  rationale: सम्बन्धवाचक इब्रानी पदबंध का स्वाभाविक हिन्दी रूप है और याबीन की उपाधि स्पष्ट करता है।
- source_word: לִפְנֵי
  choice: के सामने
  rationale: मूल अर्थ ‘के सामने’ है; इस प्रसंग में यह इस्राएलियों के सम्मुख अथवा उनके विरुद्ध हुई याबीन की पराजय व्यक्त करता है, बिना सम्बन्ध को अनावश्यक रूप से अधिक निश्चित किए।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएलियों
  rationale: इब्रानी मुहावरा शाब्दिक रूप से ‘इस्राएल के पुत्र’ है, पर आधुनिक हिन्दी में यह पूरे इस्राएली समुदाय के लिए अस्वाभाविक और केवल पुरुषों तक सीमित सुनाई दे सकता है। ‘इस्राएलियों’ सामुदायिक आशय को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: इस्राएल की विजय में परमेश्वर की भूमिका
  choice: परमेश्वर को याबीन को परास्त करने वाला प्रत्यक्ष कर्ता रखा गया है।
  alternative: वाक्य को इस्राएल की मानवीय सैन्य विजय के रूप में प्रस्तुत करना।
  rationale: इब्रानी पाठ में אֱלֹהִים स्पष्टतः क्रिया का कर्ता है; इसलिए ईश्वरीय कर्तृत्व को सुरक्षित रखना आवश्यक है।
- issue: בְּנֵי יִשְׂרָאֵל का सामुदायिक आशय
  choice: इस्राएलियों
  alternative: इस्राएल के पुत्र
  rationale: यह स्थिर इब्रानी सामुदायिक अभिव्यक्ति यहाँ इस्राएल के लोगों को सूचित करती है। स्वाभाविक आधुनिक हिन्दी में ‘इस्राएलियों’ उसी आशय को बिना पुरुष-मात्र का अर्थ उत्पन्न किए व्यक्त करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘इस प्रकार’ पूर्ववर्ती घटनाओं के परिणाम को दिखाने वाले וַ का प्रसंगानुकूल रूप है। कोई पादटिप्पणी आवश्यक नहीं समझी गई।
