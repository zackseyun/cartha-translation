base_translation:
  language: en
  yaml_path: translation/ot/judges/004/015.yaml
  text: And Yahweh threw Sisera[a], all his chariots, and all his army into confusion before Barak by the sword[c][b]. Then Sisera got down from his chariot and fled on foot.
translation:
  language: hi
  text: तब याहवे ने सीसरा[a], उसके सभी रथों और उसकी सारी सेना[c] को बाराक के सामने तलवार की धार से[b] घोर भ्रम में डाल दिया। तब सीसरा अपने रथ से उतरकर पैदल भाग गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सीसरा को तितर-बितर कर दिया”; इब्रानी क्रिया युद्ध में आतंक या भ्रम उत्पन्न करने का अर्थ दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: 'शाब्दिक अर्थ: “तलवार के मुँह (अर्थात् धार) से।”'
    reason: lexical_alternative
  - marker: c
    text: या “सारी छावनी” अथवा “पूरा दल”; यहाँ आशय पूरे लड़ाकू बल से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּהָם
  choice: खलबली मचा दी
  rationale: यह क्रिया युद्ध में आतंक, भ्रम और अव्यवस्था उत्पन्न करने का भाव रखती है। ‘खलबली मचा दी’ उसके कारक अर्थ को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है, बिना इसी क्रिया में पूर्ण पराजय का भाव जोड़ने के।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत नाम יהוה है। आधुनिक हिन्दी बाइबलीय प्रयोग में प्रचलित रूप ‘यहोवा’ नाम को किसी उपाधि से बदलने के बजाय नाम के रूप में प्रस्तुत करता है।
- source_word: הָרֶכֶב
  choice: उसके सभी रथों
  rationale: यह शब्द सामूहिक रूप से रथों अथवा रथ-दल का बोध करा सकता है। प्रसंग में ‘उसके सभी रथों’ स्पष्ट और स्वाभाविक है।
- source_word: הַמַּחֲנֶה
  choice: उसकी सारी सेना
  rationale: शाब्दिक रूप से यह ‘छावनी’ या ‘दल’ हो सकता है, पर युद्ध के इस प्रसंग में पूरे लड़ाकू बल का संकेत है; इसलिए ‘सेना’ अर्थ को अधिक स्पष्ट करता है।
- source_word: לְפִי חֶרֶב
  choice: तलवार से
  rationale: इब्रानी मुहावरे का शाब्दिक रूप ‘तलवार के मुँह/धार से’ है। ‘तलवार से’ उसका स्वाभाविक हिन्दी समतुल्य है और युद्ध के साधन को बनाए रखता है।
- source_word: לִפְנֵי בָרָק
  choice: बाराक के सामने
  rationale: यह पदबंध बाराक के आगे या उसकी उपस्थिति में हुई घटना को बताता है; ‘के सामने’ संक्षिप्त और स्वाभाविक है।
- source_word: וַיֵּרֶד ... מֵעַל הַמֶּרְכָּבָה
  choice: अपने रथ से उतरकर
  rationale: सन्दर्भ में वाहन से नीचे उतरने का अर्थ है। यद्यपि मूल में निश्चित पद ‘उस रथ’ है, हिन्दी में सीसरा के रथ के लिए ‘अपने रथ’ अधिक स्वाभाविक है।
- source_word: וַיָּנָס בְּרַגְלָיו
  choice: पैदल भाग गया
  rationale: यह मुहावरा वाहन छोड़कर अपने पैरों से भागने को दर्शाता है। ‘पैदल भाग गया’ रथ छोड़ने के विरोधाभास को स्पष्ट रूप से व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में चार अक्षरों वाला ईश्वरीय नाम है, कोई उपाधि नहीं। हिन्दी के सामान्य बाइबलीय पाठकों के लिए ‘यहोवा’ प्रतिष्ठित और पहचानने योग्य नामरूप है; इसे ‘प्रभु’ से नहीं बदला गया। उच्चारण का विद्वतापरक वैकल्पिक रूप ‘याहवे’ है।
translation_notes:
  register: भाषा आधुनिक, कथात्मक और गरिमापूर्ण रखी गई है। ‘खलबली मचा दी’ सामान्य पाठक के लिए सहज है और मूल क्रिया के युद्धजनित भ्रम के भाव को बचाता है। सर्वनामसूचक ‘उसके/उसकी/अपने’ हिन्दी की स्वाभाविकता के लिए प्रयुक्त हैं, यद्यपि इब्रानी में इन स्थानों पर निश्चित पद हैं। सभी पादटिप्पणी चिह्न मुख्य पाठ में उपस्थित हैं।
