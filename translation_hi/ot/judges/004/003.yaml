source:
  edition: WLC
  text: וַ/יִּצְעֲק֥וּ בְנֵֽי יִשְׂרָאֵ֖ל אֶל יְהוָ֑ה כִּ֠י תְּשַׁ֨ע מֵא֤וֹת רֶֽכֶב בַּרְזֶל֙ ל֔/וֹ וְ֠/הוּא לָחַ֞ץ אֶת בְּנֵ֧י יִשְׂרָאֵ֛ל בְּ/חָזְקָ֖ה עֶשְׂרִ֥ים שָׁנָֽה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/003.yaml
  text: Then the sons of Israel cried out to the LORD, because he had nine hundred iron chariots, and he oppressed the sons of Israel harshly for twenty years.
translation:
  language: hi
  text: तब इस्राएलियों ने यहोवा की दुहाई दी, क्योंकि उसके पास लोहे के नौ सौ रथ थे और उसने बीस वर्ष तक इस्राएलियों पर कठोरता से अत्याचार किया था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּצְעֲקוּ ... אֶל־יְהוָה
  choice: यहोवा की दुहाई दी
  rationale: संकट में सहायता के लिए पुकारने का भाव स्वाभाविक और स्पष्ट हिंदी में व्यक्त करता है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएली
  rationale: शाब्दिक ‘इस्राएल के पुत्र’ की अपेक्षा आधुनिक हिंदी में पूरे समुदाय के लिए यह अधिक स्वाभाविक है।
- source_word: רֶכֶב בַּרְזֶל
  choice: लोहे के ... रथ
  rationale: इब्रानी संज्ञा-समूह का सीधा रूपांतरण; पाठ यह स्पष्ट नहीं करता कि रथ पूर्णतः लोहे के थे या लोहे से सुदृढ़ किए गए थे।
- source_word: לָחַץ ... בְּחָזְקָה
  choice: कठोरता से अत्याचार किया
  rationale: לָחַץ के दमन/उत्पीड़न और בְּחָזְקָה की कठोर, प्रबल रीति—दोनों को सहज हिंदी में रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का रूप
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ के विशिष्ट व्यक्तिगत नाम को नाम के रूप में बनाए रखता है और हिंदी बाइबलीय परंपरा में व्यापक रूप से पहचाना जाता है।
- issue: ‘उसके’ का संदर्भ
  choice: पुल्लिंग एकवचन सर्वनाम को यथावत रखा
  alternative: याबीन या सीसरा का नाम स्पष्ट रूप से जोड़ना
  rationale: मूल पद में केवल לוֹ और וְהוּא हैं; निकटवर्ती संदर्भ के संभावित संकेत को अनुवाद में अनावश्यक रूप से निश्चित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिंदी, सरल किंतु गरिमापूर्ण कथात्मक शैली। मूल की सर्वनामगत अस्पष्टता सुरक्षित रखी गई है।
