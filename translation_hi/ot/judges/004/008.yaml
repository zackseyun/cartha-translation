  text: וַ/יֹּ֤אמֶר אֵלֶ֨י/הָ֙ בָּרָ֔ק אִם תֵּלְכִ֥י עִמִּ֖/י וְ/הָלָ֑כְתִּי וְ/אִם לֹ֥א תֵלְכִ֛י עִמִּ֖/י לֹ֥א אֵלֵֽךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/008.yaml
  text: Barak said to her[a], “If you will go with me, I will go; but if you will not go with me, I will not go.”
translation:
  language: hi
  text: बाराक ने उससे कहा, “यदि तुम मेरे साथ चलोगी, तो मैं जाऊँगा; पर यदि तुम मेरे साथ नहीं चलोगी, तो मैं नहीं जाऊँगा।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלֶיהָ
  choice: उससे कहा
  rationale: אמר के साथ אֶל और स्त्रीलिंग एकवचन प्रत्यय का स्वाभाविक आधुनिक हिन्दी रूप; प्रसंग में संकेत दबोरा की ओर है।
- source_word: בָּרָק
  choice: बाराक
  rationale: व्यक्तिवाचक नाम का देवनागरी लिप्यंतरण।
- source_word: אִם
  choice: यदि
  rationale: शर्तसूचक अव्यय का स्पष्ट और गरिमापूर्ण आधुनिक हिन्दी समतुल्य।
- source_word: תֵּלְכִי עִמִּי
  choice: तुम मेरे साथ चलोगी
  rationale: הלך के स्त्रीलिंग द्वितीय पुरुष एकवचन रूप और עִם के साहचर्य अर्थ को सुरक्षित रखता है; हिन्दी में इस प्रसंग में ‘चलना’ स्वाभाविक है।
- source_word: וְהָלָכְתִּי
  choice: तो मैं जाऊँगा
  rationale: शर्त के परिणाम को हिन्दी में स्पष्ट करने के लिए ‘तो’ और भविष्यकाल स्वाभाविक हैं।
- source_word: וְאִם לֹא תֵלְכִי עִמִּי
  choice: पर यदि तुम मेरे साथ नहीं चलोगी
  rationale: दूसरी, विपरीत शर्त को ‘पर यदि’ स्वाभाविक रूप से व्यक्त करता है और निषेध को क्रिया के साथ रखता है।
- source_word: לֹא אֵלֵךְ
  choice: मैं नहीं जाऊँगा
  rationale: नकारयुक्त प्रथम पुरुष एकवचन अपूर्ण क्रिया यहाँ शर्त के परिणामस्वरूप दृढ़ अस्वीकार व्यक्त करती है।
