base_translation:
  language: en
  yaml_path: translation/ot/judges/004/016.yaml
  text: And Barak pursued the chariots and the army as far as Harosheth of the nations[a], and all Sisera’s army fell by the edge of the sword[b]; not even one was left.
translation:
  language: hi
  text: और बाराक ने रथों[a] और सेना का पीछा राष्ट्रों के हारोशेत[b] तक किया। सीसरा की सारी सेना तलवार की धार से मारी गई; एक भी न बचा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “रथ-सेना”; हिब्रू में “रथों” शब्द सामूहिक सैन्य अर्थ में भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: हिब्रू में “राष्ट्रों का हारोशेत”; परंपरागत रूप से “हारोशेत-हग्गोयीम।”
    reason: lexical_alternative
lexical_decisions:
- source_word: רָדַף אַחֲרֵי
  choice: पीछा करते-करते ... तक गया
  rationale: यह क्रिया और संबंधसूचक पद युद्ध में सक्रिय पीछा करने का भाव देते हैं; हिंदी में यह प्रयोग स्वाभाविक रूप से पीछा जारी रहने और उसकी सीमा दोनों व्यक्त करता है।
- source_word: הָרֶכֶב
  choice: रथों
  rationale: एकवचन रूप यहाँ सामूहिक अर्थ में रथ-दल को सूचित करता है; सरल आधुनिक हिंदी में 'रथों' संदर्भ के अनुकूल है।
- source_word: הַמַּחֲנֶה
  choice: सेना
  rationale: युद्ध-वृत्तांत में यह शब्द केवल छावनी नहीं, सैन्य दल को दर्शाता है; इसलिए 'सेना' अधिक स्पष्ट है।
- source_word: עַד חֲרֹשֶׁת הַגּוֹיִם
  choice: अन्यजातियों के हरोशेत तक
  rationale: עַד पीछा किए जाने की सीमा बताता है। स्थाननाम का लिप्यंतरण किया गया है और הַגּוֹיִם का मूल संबंधसूचक अर्थ भी बनाए रखा गया है।
- source_word: וַיִּפֹּל כָּל מַחֲנֵה סִיסְרָא
  choice: सीसरा की सारी सेना ... मारी गई
  rationale: सामूहिक कर्ता के साथ क्रिया पूरे सैन्य दल के युद्ध में मारे जाने को दर्शाती है; शाब्दिक 'गिर पड़ी' की अपेक्षा 'मारी गई' आधुनिक हिंदी में आशय स्पष्ट करती है।
- source_word: לְפִי חֶרֶב
  choice: तलवार की धार से
  rationale: हिब्रू मुहावरे का चित्रात्मक तत्व सुरक्षित रखते हुए युद्ध में तलवार से मारे जाने का अर्थ व्यक्त किया गया है।
- source_word: לֹא נִשְׁאַר עַד אֶחָד
  choice: एक भी जीवित न बचा
  rationale: यह वाक्यांश पूर्ण विनाश पर बल देता है; संदर्भ के कारण 'जीवित' जोड़ने से स्वाभाविक हिंदी में निहित आशय स्पष्ट होता है।
