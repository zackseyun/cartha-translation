source:
  edition: WLC
  text: וַ/יַּזְעֵ֨ק סִֽיסְרָ֜א אֶת כָּל רִכְבּ֗/וֹ תְּשַׁ֤ע מֵאוֹת֙ רֶ֣כֶב בַּרְזֶ֔ל וְ/אֶת כָּל הָ/עָ֖ם אֲשֶׁ֣ר אִתּ֑/וֹ מֵ/חֲרֹ֥שֶׁת הַגּוֹיִ֖ם אֶל נַ֥חַל קִישֽׁוֹן־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/013.yaml
  text: Then Sisera called together all his chariots[a], nine hundred iron chariots, and all the people who were with him, from Harosheth-haggoyim to the Wadi Kishon.
translation:
  language: hi
  text: तब सीसरा ने अपने सभी रथों—लोहे के नौ सौ रथों—और जो सभी लोग उसके साथ थे, उन्हें हरोशेत-हग्गोयीम से कीशोन नाले[a] तक बुलाकर इकट्ठा किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “कीशोन नदी,” “कीशोन की बरसाती धारा,” अथवा “कीशोन की घाटी”; इब्रानी नाहल किसी नाले, जलधारा, मौसमी बरसाती धारा या उसके पाट/घाटी को दर्शा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּזְעֵק
  choice: इकट्ठा होने के लिए बुलाया
  rationale: सैन्य संदर्भ में זעק का अर्थ सेना या रथों को बुलाकर एकत्र करना है। यह प्रयोग कारक भाव और सैन्य जुटान दोनों को सहज हिन्दी में व्यक्त करता है।
- source_word: רִכְבּוֹ
  choice: अपने सभी रथों
  rationale: रֶכֶב सामूहिक रथ-दल का बोध करा सकता है, पर आगे 'लोहे के नौ सौ रथों' की व्याख्या होने के कारण ठोस बहुवचन स्वाभाविक है।
- source_word: תְּשַׁע מֵאוֹת רֶכֶב בַּרְזֶל
  choice: लोहे के नौ सौ रथों
  rationale: यह संख्या और पदार्थ-संबंधी पदबंध को सीधे रखता है; इससे यह अनावश्यक रूप से निश्चित नहीं किया जाता कि रथ पूर्णतः लोहे के थे या लोहे से सुसज्जित।
- source_word: כָּל הָעָם אֲשֶׁר אִתּוֹ
  choice: अपने साथ के सभी लोगों को
  rationale: עָם का मूल अर्थ 'लोग' है। प्रसंग सैन्य है, पर 'सैनिक' कहने से जो स्पष्टता मूल में नहीं है वह जुड़ जाती; इसलिए मूल की व्यापकता बनाए रखी गई है।
- source_word: מֵחֲרֹשֶׁת הַגּוֹיִם
  choice: हरोशेत-हग्गोयीम से
  rationale: स्थान-नाम को अर्थानुवाद करने के बजाय हिन्दी लिपि में ध्वन्यंतरण किया गया है; מִן को 'से' से व्यक्त किया गया है।
- source_word: נַחַל קִישׁוֹן
  choice: कीशोन नाले
  rationale: נַחַל नदी, मौसमी जलधारा, नाला या उसकी घाटी/पाट का बोध करा सकता है। मुख्य पाठ में सहज 'नाला' चुना गया और अर्थ-सीमा पादटिप्पणी में सुरक्षित रखी गई।
