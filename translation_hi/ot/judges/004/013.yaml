  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। सैन्य संदर्भ स्पष्ट है, फिर भी जहाँ इब्रानी शब्द व्यापक या अस्पष्ट है वहाँ अनावश्यक विशिष्टीकरण से बचा गया है।
