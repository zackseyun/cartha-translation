  text: וַ/יִּמְכְּרֵ֣/ם יְהוָ֗ה בְּ/יַד֙ יָבִ֣ין מֶֽלֶךְ כְּנַ֔עַן אֲשֶׁ֥ר מָלַ֖ךְ בְּ/חָצ֑וֹר וְ/שַׂר צְבָא/וֹ֙ סִֽיסְרָ֔א וְ/ה֥וּא יוֹשֵׁ֖ב בַּ/חֲרֹ֥שֶׁת הַגּוֹיִֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/002.yaml
  text: So Yahweh sold them into the hand of Jabin king of Canaan[a], who reigned in Hazor; and the commander of his army was Sisera[b], who lived in Harosheth-haggoyim.
translation:
  language: hi
  text: तब याहवे ने उन्हें कनान के राजा याबीन के हाथ बेच दिया,[a] जो हासोर में राज्य करता था। उसकी सेना का प्रधान सीसरा था, जो हरोशेत-हग्गोयीम में रहता था।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उन्हें ... के हाथ बेच दिया।” यह वाचा के दंड का एक इब्रानी मुहावरा है, जिसका अर्थ है कि याहवे ने उन्हें याबीन के अधिकार में दे दिया।
    reason: lexical_alternative
  - marker: b
    text: “हरोशेत-हग्गोयीम” का संभावित अर्थ “जातियों का हरोशेत” है।
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּמְכְּרֵם
  choice: उन्हें ... के हाथ बेच दिया
  rationale: मूल क्रिया מָכַר का अर्थ ‘बेचना’ है। न्यायियों में यह वाचा के दंड का रूपक है; इसलिए इसे केवल ‘सौंप दिया’ कहकर नरम नहीं किया गया।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में परमेश्वर के व्यक्तिगत नाम के प्रचलित लिप्यंतरण ‘यहोवा’ का प्रयोग किया गया है, न कि उसके स्थान पर कोई उपाधि।
- source_word: בְּיַד
  choice: के हाथ
  rationale: यह सामर्थ्य या अधिकार में सौंपे जाने का इब्रानी मुहावरा है। हिन्दी में ‘के हाथ बेच दिया’ मूल बिंब को स्वाभाविक रूप से बनाए रखता है।
- source_word: יָבִין מֶלֶךְ כְּנַעַן
  choice: कनान के राजा याबीन
  rationale: नाम और राजकीय पद को आधुनिक हिन्दी के स्वाभाविक क्रम में रखा गया है।
- source_word: אֲשֶׁר מָלַךְ בְּחָצוֹר
  choice: जो हासोर में राज्य करता था
  rationale: מָלַךְ विशेष रूप से राजा होकर शासन करने या राज्य करने को व्यक्त करता है।
- source_word: וְשַׂר צְבָאוֹ
  choice: उसकी सेना का प्रधान
  rationale: שַׂר צְבָא सेना के सर्वोच्च अधिकारी को दर्शाता है; ‘सेना का प्रधान’ स्पष्ट और गरिमापूर्ण हिन्दी है।
- source_word: סִיסְרָא
  choice: सीसरा
  rationale: व्यक्तिनाम का हिन्दी बाइबलीय लिप्यंतरण।
- source_word: וְהוּא יוֹשֵׁב
  choice: जो ... रहता था
  rationale: पुल्लिंग एकवचन सर्वनाम और सहभागी रूप का सबसे स्वाभाविक संबंध निकटवर्ती सीसरा से है; हिन्दी में इसे संबंधवाचक उपवाक्य बनाया गया है।
- source_word: בַּחֲרֹשֶׁת הַגּוֹיִם
  choice: हरोशेत-हग्गोयीम में
  rationale: इसे स्थाननाम मानकर लिप्यंतरित किया गया है; नाम के दूसरे भाग का अर्थ पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: इस्राएल के उत्पीड़न में ईश्वरीय कर्तृत्व
  choice: यहोवा ने उन्हें याबीन के हाथ बेच दिया
  alternative: यहोवा ने उन्हें याबीन के अधीन हो जाने दिया
  rationale: इब्रानी पाठ यहोवा को सक्रिय कर्ता बताता है। अनुवाद इस वाचा-संबंधी न्याय को केवल अनुमति के रूप में नरम नहीं करता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘बेच दिया’ और ‘के हाथ’ मूल के दोनों रूपकों को सुरक्षित रखते हैं। स्थाननामों को हिन्दी देवनागरी में लिप्यंतरित किया गया है; अर्थगत अनिश्चितता मुख्य पाठ में हल करने के बजाय पादटिप्पणी में रखी गई है।
