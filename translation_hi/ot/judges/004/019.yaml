  text: וַ/יֹּ֧אמֶר אֵלֶ֛י/הָ הַשְׁקִי/נִי נָ֥א מְעַט מַ֖יִם כִּ֣י צָמֵ֑אתִי וַ/תִּפְתַּ֞ח אֶת נֹ֧אוד הֶ/חָלָ֛ב וַ/תַּשְׁקֵ֖/הוּ וַ/תְּכַסֵּֽ/הוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/019.yaml
  text: And he said to her[a], “Please give me a little water to drink, for I am thirsty.” So she opened the skin of milk and gave him a drink and covered him.
translation:
  language: hi
  text: उसने उससे कहा, “ज़रा मुझे थोड़ा-सा पानी पिला दे, क्योंकि मैं प्यासा हूँ।” तब उसने दूध की मशक[a] खोली, उसे पिलाया और उसे ढक दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मशक पशु की खाल से बना तरल रखने का पात्र था; यहाँ उसमें दूध था।
    reason: cultural_note
lexical_decisions:
- source_word: הַשְׁקִי/נִי
  choice: मुझे ... पिला दे
  rationale: שׁקה के हिफ़ील आज्ञार्थक रूप और प्रथम पुरुष एकवचन प्रत्यय का अर्थ ‘मुझे पीने को दे’ या ‘मुझे पिला’ है। ‘मुझे ... पिला दे’ आधुनिक हिन्दी में स्वाभाविक है और कारक भाव को बनाए रखता है।
- source_word: נָא
  choice: कृपया
  rationale: यह आज्ञा को नम्र अनुरोध बनाने वाला निपात है; आधुनिक मानक हिन्दी में ‘कृपया’ इसका स्पष्ट और गरिमापूर्ण समतुल्य है।
- source_word: מְעַט מַיִם
  choice: थोड़ा-सा पानी
  rationale: מְעַט कम मात्रा बताता है। ‘थोड़ा-सा पानी’ सहज हिन्दी है और मूल मात्रा-बोध को सुरक्षित रखता है।
- source_word: כִּי צָמֵאתִי
  choice: क्योंकि मैं प्यासा हूँ
  rationale: यह अनुरोध का कारण बताता है। कर्ता पुरुष है, इसलिए हिन्दी में ‘प्यासा’ प्रयुक्त हुआ है।
- source_word: נֹאוד הֶחָלָב
  choice: दूध की मशक
  rationale: נֹאוד पशु की खाल से बना तरल रखने का पात्र है और संबंध-विन्यास बताता है कि उसमें दूध था। ‘दूध की मशक’ प्राचीन सांस्कृतिक वस्तु और पानी के बदले दूध दिए जाने के कथात्मक अंतर, दोनों को बनाए रखता है।
- source_word: וַתַּשְׁקֵהוּ
  choice: उसे पिलाया
  rationale: यह שׁקה का कारक रूप है। पहले ही दूध की मशक का उल्लेख होने से ‘उसे पिलाया’ संक्षिप्त और स्वाभाविक है; दूध को दोहराना आवश्यक नहीं।
- source_word: וַתְּכַסֵּהוּ
  choice: उसे ढक दिया
  rationale: כסה का सीधा अर्थ ढकना या छिपाना है। मूल पाठ यह नहीं बताता कि किस वस्तु से ढका गया, इसलिए हिन्दी में भी साधन को अनिर्दिष्ट रखा गया है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है। संवाद को विनम्र किंतु सहज रखा गया है। सर्वनामों और क्रियाओं में मूल पाठ की क्रमिकता बनाए रखते हुए अनावश्यक व्याख्यात्मक नाम नहीं जोड़े गए हैं।
