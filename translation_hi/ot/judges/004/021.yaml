base_translation:
  language: en
  yaml_path: translation/ot/judges/004/021.yaml
  text: Then Jael[a], the wife of Heber, took a tent peg and put a hammer in her hand, and she went to him quietly and drove the peg into his temple, and it went down into the ground. Now he was fast asleep and exhausted[b], and he died.
translation:
  language: hi
  text: तब हेबेर की पत्नी याएल ने तंबू की एक खूंटी ली और हथौड़ा अपने हाथ में लिया। वह चुपचाप[a] उसके पास गई और खूंटी को उसकी कनपटी में ठोंक दिया, और वह धरती में धँस गई[b]। वह गहरी नींद में था और थककर चूर था, और वह मर गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “दबे पाँव।” हिब्रू शब्द उसके बिना आहट और किसी का ध्यान खींचे बिना पास आने पर बल देता है।
    reason: lexical_alternative
  - marker: b
    text: हिब्रू में क्रिया स्त्रीलिंग है और उसका सबसे स्वाभाविक कर्ता ‘खूंटी’ है; अर्थात खूंटी धरती में धँस गई।
    reason: referent_clarification
lexical_decisions:
- source_word: יְתַד / הַיָּתֵד
  choice: तम्बू की एक खूंटी / खूंटी
  rationale: यह तम्बू को बाँधने के लिए प्रयुक्त खूंटी है; ‘तम्बू की खूंटी’ आधुनिक हिन्दी में स्पष्ट और ठोस चित्र प्रस्तुत करता है।
- source_word: הַמַּקֶּבֶת
  choice: हथौड़ा
  rationale: खूंटी ठोंकने के औज़ार के लिए ‘हथौड़ा’ सहज और पर्याप्त रूप से सटीक हिन्दी शब्द है।
- source_word: בְּיָדָהּ
  choice: अपने हाथ में लिया
  rationale: हिब्रू वाक्यांश बताता है कि उसने हथौड़ा हाथ में पकड़ा; हिन्दी में क्रिया के साथ यह रूप स्वाभाविक है।
- source_word: בַּלָּאט
  choice: चुपचाप
  rationale: यह उसके मौन और बिना आहट के पास आने के ढंग को व्यक्त करता है, बिना उसके उद्देश्य की अनावश्यक व्याख्या किए।
- source_word: וַתִּתְקַע
  choice: ठोंक दी
  rationale: खूंटी और हथौड़े के संदर्भ में क्रिया बलपूर्वक खूंटी गाड़ने या ठोंकने को दर्शाती है; ‘ठोंक दी’ सहज हिन्दी है।
- source_word: בְּרַקָּתוֹ
  choice: उसकी कनपटी में
  rationale: רַקָּה सिर के पार्श्व भाग, अर्थात कनपटी, को दर्शाता है। ‘में’ प्रवेश को व्यक्त करता है, पर खूंटी के आर-पार जाने को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: וַתִּצְנַח בָּאָרֶץ
  choice: और वह धरती में धँस गई
  rationale: स्त्रीलिंग क्रिया का स्वाभाविक कर्ता स्त्रीलिंग ‘खूंटी’ है। स्वतंत्र समन्वित वाक्यांश हिब्रू की घटनाक्रमात्मक रचना को बनाए रखता है और उद्देश्य या अवधि नहीं जोड़ता।
- source_word: נִרְדָּם
  choice: गहरी नींद में था
  rationale: यह सोए होने की प्रबल अवस्था को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: וַיָּעַף
  choice: थककर चूर था
  rationale: यह सीसरा की अत्यधिक थकान को स्पष्ट और प्रचलित हिन्दी में व्यक्त करता है।
- source_word: וַיָּמֹת
  choice: और वह मर गया
  rationale: मूल पाठ के संक्षिप्त और स्पष्ट कथात्मक निष्कर्ष को बिना अलंकरण के बनाए रखता है।
- source_word: אֵשֶׁת חֶבֶר
  choice: हेबेर की पत्नी
  rationale: हिब्रू संबंध को आधुनिक हिन्दी के स्वाभाविक संबंधकारक ढाँचे में व्यक्त करता है।
