base_translation:
  language: en
  yaml_path: translation/ot/judges/004/018.yaml
  text: Jael went out to meet Sisera and said to him[a], “Turn aside, my lord, turn aside to me; do not be afraid.” So he turned aside to her into the tent[b], and she covered him with a blanket.
translation:
  language: hi
  text: याएल सीसरा से मिलने बाहर निकली और उससे कहा, “मेरे स्वामी, इधर मुड़ आइए, मेरे पास मुड़ आइए; डरिए मत।” तब वह मुड़कर उसके तंबू में चला गया, और याएल ने उसे एक कंबल[a] से ढक दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्द का अर्थ “गलीचा” या कोई अन्य ढकने वाला कपड़ा भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּצֵא
  choice: बाहर निकली
  rationale: יצא की मूल दिशा भीतर से बाहर की ओर है; यह स्वाभाविक हिन्दी में याएल के तंबू से निकलने की क्रिया व्यक्त करता है।
- source_word: לִקְרַאת
  choice: से मिलने
  rationale: לקראת किसी की ओर उद्देश्यपूर्वक बढ़ने को दर्शाता है; प्रसंग में “से मिलने” सहज और सटीक है।
- source_word: סוּרָה
  choice: इधर मुड़कर मेरे पास आइए
  rationale: סור का मूल भाव अपने मार्ग से मुड़ना है। “मुड़कर” उस बिंब को बनाए रखता है, जबकि “मेरे पास आइए” निमंत्रण को स्वाभाविक आधुनिक हिन्दी में स्पष्ट करता है; दोहराव भी सुरक्षित है।
- source_word: אֲדֹנִי
  choice: हे मेरे स्वामी
  rationale: यहाँ आदरपूर्ण संबोधन है। “मेरे स्वामी” मूल की विनम्रता को रखता है और इसे परमेश्वर की उपाधि के रूप में प्रस्तुत नहीं करता।
- source_word: אַל תִּירָא
  choice: डरिए मत
  rationale: यह निषेधात्मक आश्वासन का संक्षिप्त और स्वाभाविक हिन्दी रूप है।
- source_word: וַיָּסַר
  choice: मुड़कर
  rationale: यह याएल के आदेश में प्रयुक्त סור को दोहराता है; समान शब्दावली से सीसरा की प्रतिक्रिया स्पष्ट रहती है।
- source_word: הָאֹהֱלָה
  choice: उसके तंबू में चला गया
  rationale: दिशासूचक प्रत्यय तंबू की ओर गति दर्शाता है और प्रसंग में भीतर प्रवेश निहित है।
- source_word: וַתְּכַסֵּהוּ
  choice: उसे ... से ढक दिया
  rationale: כסה का सीधा अर्थ ढकना है; “छिपा दिया” जैसी निहित व्याख्या को मुख्य पाठ में नहीं जोड़ा गया।
- source_word: בַּשְּׂמִיכָה
  choice: एक कंबल
  rationale: שׂמיכה किसी ढकने वाले कपड़े, संभवतः कंबल या गलीचे, को दर्शाता है। “कंबल” आधुनिक पाठक के लिए सहज है, जबकि वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
