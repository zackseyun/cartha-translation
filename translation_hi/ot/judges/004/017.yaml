source:
  edition: WLC
  text: וְ/סִֽיסְרָא֙ נָ֣ס בְּ/רַגְלָ֔י/ו אֶל אֹ֣הֶל יָעֵ֔ל אֵ֖שֶּׁת חֶ֣בֶר הַ/קֵּינִ֑י כִּ֣י שָׁל֗וֹם בֵּ֚ין יָבִ֣ין מֶֽלֶךְ חָצ֔וֹר וּ/בֵ֕ין בֵּ֖ית חֶ֥בֶר הַ/קֵּינִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/017.yaml
  text: But Sisera fled on foot to the tent of Jael[a], the wife of Heber the Kenite[b], because there was peace between Jabin king of Hazor and the house of Heber the Kenite.
translation:
  language: hi
  text: परन्तु सीसरा पैदल भागकर केनी हेबेर की पत्नी याएल के तम्बू में पहुँचा[a], क्योंकि हासोर के राजा याबीन और केनी हेबेर के घराने[b] के बीच शान्ति थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और सीसरा पैदल भागकर ... पहुँचा।” इब्रानी संयोजक का साधारण अनुवाद “और” हो सकता है; “परन्तु” यहाँ कथा के प्रसंग में आए विरोध को प्रकट करता है।
    reason: alternative_reading
  - marker: b
    text: “हेबेर का घराना” से आशय हेबेर का परिवार या कुल है।
    reason: cultural_note
lexical_decisions:
- source_word: וְ/סִֽיסְרָא֙
  choice: परन्तु सीसरा
  rationale: वाव का मूल अर्थ ‘और’ हो सकता है, पर यहाँ पिछले प्रसंग—सेना की हार और सीसरा के रथ छोड़ने—के विपरीत कथा का रुख दिखाने के लिए ‘परन्तु’ स्वाभाविक है।
- source_word: נָ֣ס בְּ/רַגְלָ֔י/ו
  choice: पैदल भागकर
  rationale: क्रिया נוס का सीधा अर्थ ‘भागना’ है और ‘पैदल’ उस इब्रानी मुहावरे को स्वाभाविक हिन्दी में व्यक्त करता है जिसका शाब्दिक रूप ‘अपने पैरों से’ है।
- source_word: אֶל אֹ֣הֶל יָעֵ֔ל
  choice: याएल के तम्बू में गया
  rationale: אֶל गन्तव्य को सूचित करता है। हिन्दी में गति की क्रिया को पूर्ण करने के लिए ‘में गया’ सहज है; भागने का भाव पहले ही ‘भागकर’ में सुरक्षित है।
- source_word: אֵ֖שֶּׁת חֶ֣בֶר הַ/קֵּינִ֑י
  choice: केनी हेबेर की पत्नी
  rationale: यह याएल की पहचान बताने वाला पद है और इब्रानी के सम्बन्ध को संक्षिप्त, स्पष्ट हिन्दी में रखता है।
- source_word: כִּ֣י
  choice: क्योंकि
  rationale: यहाँ כִּי उस कारण का परिचय देता है जिसके कारण सीसरा ने याएल के तम्बू को आश्रय के लिए चुना।
- source_word: שָׁל֗וֹם
  choice: शान्ति
  rationale: שָׁלוֹם यहाँ शांतिपूर्ण सम्बन्धों को दर्शाता है। ‘शान्ति’ मूल शब्द की व्यापकता बनाए रखता है और किसी औपचारिक सन्धि का अनावश्यक अनुमान नहीं लगाता।
- source_word: בֵּ֖ית חֶ֥בֶר הַ/קֵּינִֽי
  choice: केनी हेबेर का घराना
  rationale: בֵּית इस सन्दर्भ में केवल भवन नहीं बल्कि परिवार, गृहस्थी या कुलगत समूह को सूचित करता है; ‘घराना’ इस सामाजिक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी की गरिमापूर्ण, सुबोध कथा-शैली अपनाई गई है। व्यक्तिनामों और स्थाननामों के प्रचलित हिन्दी बाइबलीय रूप—सीसरा, याएल, हेबेर, याबीन और हासोर—रखे गए हैं। ‘शान्ति’ को ‘मैत्री’ या ‘सन्धि’ बनाकर अधिक विशिष्ट नहीं किया गया, और ‘घराना’ द्वारा प्राचीन सामाजिक इकाई का अर्थ स्पष्ट रखा गया है।
