base_translation:
  language: en
  yaml_path: translation/ot/judges/004/024.yaml
  text: And the hand of the sons of Israel went on[a], growing stronger against Jabin king of Canaan[c][b], until they cut off Jabin king of Canaan.
translation:
  language: hi
  text: इस्राएल के पुत्रों[a] का हाथ कनान के राजा याबीन पर लगातार भारी पड़ता गया, यहाँ तक कि उन्होंने कनान के राजा याबीन का नाश कर दिया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात् “इस्राएली।” इब्रानी में शाब्दिक रूप से “इस्राएल के पुत्र” है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक अर्थ “काट दिया” है; यहाँ आशय निर्णायक रूप से नष्ट कर देना है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּלֶךְ יַד
  choice: हाथ ... पड़ता गया
  rationale: ‘हाथ’ शक्ति और सामर्थ्य का इब्रानी रूपक है। ‘पड़ता गया’ अगले तीव्रतासूचक पद के साथ निरंतर बढ़ते प्रभाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों
  rationale: यह मूल पद का निकट रूप है; इसका सामूहिक अर्थ इस्राएली लोग है, जिसे पादटिप्पणी में स्पष्ट किया गया है।
- source_word: הָלוֹךְ וְקָשָׁה
  choice: लगातार अधिक भारी
  rationale: यह रचना क्रमशः बढ़ती कठोरता, शक्ति या दबाव को व्यक्त करती है। ‘हाथ ... अधिक भारी पड़ता गया’ हिन्दी का स्वाभाविक मुहावरा है और मूल रूपक भी बनाए रखता है।
- source_word: עַל
  choice: पर
  rationale: शत्रुतापूर्ण संदर्भ में यह याबीन के विरुद्ध बढ़ते प्रभुत्व और दबाव को दर्शाता है।
- source_word: הִכְרִיתוּ
  choice: मिटा दिया
  rationale: हिफ़ील रूप का मूल भाव ‘काट देना’ है और यहाँ इसका आशय निर्णायक रूप से नष्ट कर देना है। ‘मिटा दिया’ आधुनिक हिन्दी में उस अर्थ को स्पष्ट और प्रभावशाली ढंग से व्यक्त करता है।
