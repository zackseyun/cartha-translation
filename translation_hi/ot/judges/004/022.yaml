  yaml_path: translation/ot/judges/004/022.yaml
  text: And look, Barak was pursuing Sisera. Jael went out to meet him and said to him, “Come, and I will show you the man whom you are seeking.” So he went in to her, and look, Sisera was lying there dead, with the tent peg in his temple.
translation:
  language: hi
  text: और देखो, बाराक सीसरा का पीछा कर रहा था। याएल उससे मिलने बाहर निकली और उससे बोली, “आइए, मैं आपको वह आदमी दिखाती हूँ जिसे आप ढूँढ़ रहे हैं।” तब वह उसके पास गया, और देखो, सीसरा मरा पड़ा था और तंबू का खूँटा उसकी कनपटी में था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִנֵּה
  choice: तभी / और देखा कि
  rationale: पहला प्रयोग दृश्य में बाराक के अचानक आ पहुँचने को उभारता है; दूसरा बाराक के भीतर जाकर सामने का दृश्य देखने को। दोनों प्रसंगानुकूल आधुनिक हिन्दी में हिब्रू के ध्यानाकर्षक बल को व्यक्त करते हैं।
- source_word: רֹדֵף
  choice: पीछा करता हुआ
  rationale: यह सक्रिय कृदंत बाराक की जारी कार्रवाई को दर्शाता है।
- source_word: לֵךְ
  choice: आइए
  rationale: संदर्भ में याएल बाराक को अपने तंबू के भीतर आने का निमंत्रण देती है; सम्मानसूचक हिन्दी संबोधन स्वाभाविक है।
- source_word: נֹפֵל מֵת
  choice: मरा पड़ा था
  rationale: शाब्दिक रूप से ‘गिरा हुआ, मृत’; हिन्दी में यह शव की अवस्था को स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: הַיָּתֵד
  choice: खूँटा
  rationale: पूर्ववर्ती प्रसंग के अनुसार यह तंबू का खूँटा है; यहाँ संक्षिप्त रूप मूल के अनुरूप है।
- source_word: בְּרַקָּתוֹ
  choice: उसकी कनपटी में
  rationale: רַקָּה का सामान्य शारीरिक अर्थ ‘कनपटी’ है।
