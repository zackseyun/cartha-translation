  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּסִ֨פוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל לַ/עֲשׂ֥וֹת הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה וְ/אֵה֖וּד מֵֽת׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/001.yaml
  text: And the sons of Israel again did what was evil in the eyes of Yahweh after Ehud died[a].
translation:
  language: hi
  text: एहूद की मृत्यु के बाद इस्राएलियों ने फिर से वह किया जो यहोवा की दृष्टि में बुरा था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּסִפוּ
  choice: फिर वही किया
  rationale: יסף के साथ क्रियार्थक संज्ञा यहाँ पहले के पाप की पुनरावृत्ति बताती है। ‘फिर’ न्यायियों में बार-बार लौटने वाले चक्र को स्वाभाविक हिन्दी में व्यक्त करता है; ‘वही’ पूर्ववर्ती बुराई से संबंध स्पष्ट करता है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएलियों
  rationale: शाब्दिक रूप ‘इस्राएल के पुत्र’ है, पर यहाँ यह पूरे इस्राएली समुदाय का प्रचलित सामूहिक नाम है। आधुनिक हिन्दी में ‘इस्राएली’ स्त्री-पुरुष दोनों को स्वाभाविक रूप से समेटता है और अर्थ को ठीक रखता है।
- source_word: לַעֲשׂוֹת הָרַע
  choice: वही किया ... बुरा था
  rationale: הָרַע संज्ञीकृत विशेषण है, जिसका स्वाभाविक हिन्दी रूप ‘जो ... बुरा था’ है। इसे יסף के साथ एक सहज क्रियात्मक वाक्य में रखा गया है।
- source_word: בְּעֵינֵי יְהוָה
  choice: यहोवा की दृष्टि में
  rationale: यह हिन्दी में स्पष्ट और प्रतिष्ठित मुहावरा है, जो इब्रानी ‘यहोवा की आँखों में’ के मूल्यांकनात्मक रूपक को बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चार-अक्षरीय व्यक्तिगत ईश्वरीय नाम को हिन्दी बाइबल परंपरा में व्यापक और पहचाने जाने वाले लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है, न कि किसी उपाधि से।
- source_word: וְאֵהוּד מֵת
  choice: एहूद की मृत्यु के बाद
  rationale: औपचारिक रूप से यह ‘और एहूद मर गया’ है, पर प्रसंग में यह इस्राएल के दोबारा बुराई करने का कालगत परिवेश बताता है। ‘मृत्यु के बाद’ उस संबंध को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम का प्रयोग करता है। हिन्दी पाठकों में स्थापित रूप ‘यहोवा’ नाम को उपाधि में बदले बिना पहचान योग्य रखता है; ‘याहवे’ संभावित वैकल्पिक लिप्यंतरण है।
- issue: בְּנֵי יִשְׂרָאֵל का सामूहिक आशय
  choice: इस्राएलियों
  alternative: इस्राएल के पुत्रों
  rationale: वाक्यांश का आशय समूचा इस्राएली समुदाय है, केवल पुरुष वंशज नहीं। शाब्दिक संरचना को हिन्दी में रखने से अनचाहा लैंगिक संकुचन और अप्राकृतिक भाषा उत्पन्न होती।
- issue: अंतिम खंड का कालगत संबंध
  choice: एहूद की मृत्यु के बाद
  alternative: और एहूद मर गया
  rationale: וְ के संबंध में व्याकरणतः कुछ लचीलापन है, किंतु कथा-संदर्भ एहूद की मृत्यु को नए पतन की पृष्ठभूमि बनाता है। चुना हुआ रूप संबंध को स्पष्ट करता है, कोई अतिरिक्त धर्मवैज्ञानिक कारण आरोपित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। एक ही पद में अनावश्यक शाब्दिक कठोरता से बचते हुए न्यायियों की पुनरावृत्त कथा-शैली और ‘यहोवा की दृष्टि में’ वाला मूल रूपक सुरक्षित रखा गया है।
