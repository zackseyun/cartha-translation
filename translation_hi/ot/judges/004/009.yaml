  text: וַ/תֹּ֜אמֶר הָלֹ֧ךְ אֵלֵ֣ךְ עִמָּ֗/ךְ אֶ֚פֶס כִּי֩ לֹ֨א תִֽהְיֶ֜ה תִּֽפְאַרְתְּ/ךָ֗ עַל הַ/דֶּ֨רֶךְ֙ אֲשֶׁ֣ר אַתָּ֣ה הוֹלֵ֔ךְ כִּ֣י בְֽ/יַד אִשָּׁ֔ה יִמְכֹּ֥ר יְהוָ֖ה אֶת סִֽיסְרָ֑א וַ/תָּ֧קָם דְּבוֹרָ֛ה וַ/תֵּ֥לֶך עִם בָּרָ֖ק קֶֽדְשָׁ/ה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/009.yaml
  text: And she said[a], “I will surely go with you. Nevertheless, the honor will not be yours on the way that you are going, for Yahweh will sell Sisera into the hand of a woman.” Then Deborah arose and went with Barak to Kedesh.
translation:
  language: hi
  text: तब उसने कहा, “मैं निश्चय ही तुम्हारे साथ चलूँगी। फिर भी, जिस मार्ग पर तुम जा रहे हो, उस पर तुम्हें सम्मान नहीं मिलेगा, क्योंकि याहवे सीसरा को एक स्त्री के हाथ बेच देगा[a]।” तब दबोरा उठी और बाराक के साथ केदेश गई।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या अधिक मुहावरेदार रूप में, “याहवे सीसरा को एक स्त्री के हाथ सौंप देगा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: הָלֹךְ אֵלֵךְ
  choice: मैं निश्चय ही ... चलूँगी
  rationale: क्रिया के infinitive absolute और imperfect का मेल कथन पर बल देता है; यह हिन्दी प्रयोग उस emphatic force को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: אֶפֶס
  choice: फिर भी
  rationale: यह कण सहमति पर एक सीमित करने वाली, विरोधसूचक शर्त जोड़ता है।
- source_word: תִּפְאַרְתְּךָ
  choice: सम्मान तुम्हारा नहीं होगा
  rationale: सैन्य प्रसंग में शब्द विजय से मिलने वाले गौरव, प्रतिष्ठा या श्रेय को सूचित करता है; ‘सम्मान’ अर्थ को स्पष्ट रखते हुए मूल की गरिमा बनाए रखता है।
- source_word: עַל הַדֶּרֶךְ אֲשֶׁר אַתָּה הוֹלֵךְ
  choice: जिस मार्ग पर तुम जा रहे हो, उसमें
  rationale: ‘मार्ग’ की मूल छवि को बनाए रखा गया है और इसे केवल रणनीति या यात्रा तक सीमित नहीं किया गया।
- source_word: בְיַד אִשָּׁה
  choice: एक स्त्री के हाथ में
  rationale: यह किसी के अधिकार में सौंपे जाने का इब्रानी मुहावरा है; ‘हाथ’ की छवि हिन्दी में भी बोधगम्य है।
- source_word: יִמְכֹּר
  choice: बेच देगा
  rationale: मूल क्रिया का सीधा अर्थ ‘बेचना’ है। यहाँ इसका आशय शत्रु को किसी के अधिकार में कर देना है; मुख्य पाठ में मूल रूपक रखा और पादटिप्पणी में मुहावरेदार अर्थ दिया गया है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चतुराक्षरीय दिव्य नाम को हिन्दी में प्रचलित व्यक्तिगत नाम ‘यहोवा’ से प्रस्तुत किया गया है, किसी उपाधि से नहीं।
- source_word: וַתָּקָם
  choice: उठी
  rationale: कथा के क्रम और प्रस्थान की क्रिया को संक्षिप्त, स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: קֶדְשָׁה
  choice: केदेश
  rationale: स्थान-नाम का देवनागरी लिप्यंतरण।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में व्यक्तिगत दिव्य नाम है। हिन्दी पाठकों के लिए स्थापित रूप ‘यहोवा’ नाम की विशिष्टता बनाए रखता है; इसे ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित नहीं किया गया।
- issue: स्त्री के हाथ में सीसरा को ‘बेचना’
  choice: मूल रूपक ‘बेच देगा’ बनाए रखा
  alternative: एक स्त्री के हाथ सौंप देगा
  rationale: यहाँ क्रिया सैन्य पराजय और दूसरे के अधिकार में दिए जाने को सूचित करती है। शाब्दिक रूपक और मुहावरेदार आशय दोनों को क्रमशः मुख्य पाठ और पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। मूल के ‘मार्ग’, ‘हाथ’ और ‘बेचना’ रूपकों को जहाँ सम्भव हो संरक्षित किया गया है।
