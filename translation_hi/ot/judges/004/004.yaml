  yaml_path: translation/ot/judges/004/004.yaml
  text: Deborah, a woman, a prophetess, the wife of Lappidoth, was judging Israel at that time.
translation:
  language: hi
  text: दबोरा, एक स्त्री, एक नबिया, और लप्पीदोत की पत्नी थी; वह उस समय इस्राएल का न्याय करती थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִשָּׁה נְבִיאָה
  choice: एक नबी स्त्री
  rationale: हिब्रू में ‘स्त्री’ और ‘नबी’ दोनों स्पष्ट हैं; आधुनिक, सहज हिन्दी में दोनों तत्व सुरक्षित रखे गए हैं।
- source_word: אֵשֶׁת לַפִּידוֹת
  choice: लप्पीदोत की पत्नी
  rationale: व्यक्तिनाम को लिप्यंतरित किया गया और संबंधवाचक पद का सीधा अर्थ रखा गया।
- source_word: שֹׁפְטָה אֶת־יִשְׂרָאֵל
  choice: इस्राएल का न्याय करती थी
  rationale: क्रिया के निरंतर/प्रचलित कार्य का भाव ‘करती थी’ से व्यक्त होता है; ‘न्याय करना’ न्यायी के रूप में नेतृत्व करने की हिब्रू अवधारणा को खुला रखता है।
- source_word: בָּעֵת הַהִיא
  choice: उस समय
  rationale: समय-सूचक वाक्यांश का स्वाभाविक और सटीक हिन्दी रूप।
theological_decisions:
- issue: दबोरा की नबी और न्यायी के रूप में भूमिका
  choice: उसे स्पष्टतः ‘नबी स्त्री’ और इस्राएल का न्याय करने वाली कहा गया
  alternative: भूमिका को केवल सलाह देने या विवाद निपटाने तक सीमित करना
  rationale: मूल पाठ दोनों भूमिकाएँ सीधे बताता है; उनके अधिकार या दायरे को संप्रदायगत मान्यताओं के आधार पर घटाया या बढ़ाया नहीं गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण और सामान्य पाठक के लिए सहज। हिब्रू के आरंभिक וּ को अलग ‘और/अब’ से नहीं दर्शाया गया, क्योंकि यहाँ वह मुख्यतः कथात्मक संयोजक है।
