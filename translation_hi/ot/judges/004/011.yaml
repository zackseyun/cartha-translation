source:
  edition: WLC
  text: וְ/חֶ֤בֶר הַ/קֵּינִי֙ נִפְרָ֣ד מִ/קַּ֔יִן מִ/בְּנֵ֥י חֹבָ֖ב חֹתֵ֣ן מֹשֶׁ֑ה וַ/יֵּ֣ט אָהֳל֔/וֹ עַד אֵל֥וֹן ב/צענים אֲשֶׁ֥ר אֶת קֶֽדֶשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/011.yaml
  text: Heber the Kenite had separated from the Kenites[a], from the sons of Hobab, the father-in-law of Moses, and had pitched his tent as far as the oak in Zaannannim[b], which is near Kedesh.
translation:
  language: hi
  text: केनी हेबेर मूसा के ससुर होबाब के वंशज केनियों से अलग हो गया था, और उसने सानन्नीम में बलूत के वृक्ष तक अपना तंबू लगाया था, जो केदेश के निकट था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נִפְרָד
  choice: अलग हो गया था
  rationale: निफ़ाल रूप किसी समूह से अलग होने को व्यक्त करता है। पूर्णभूतकाल इस पद की पृष्ठभूमि-सूचक भूमिका को स्वाभाविक हिंदी में प्रकट करता है।
- source_word: מִקַּיִן / הַקֵּינִי
  choice: केनियों / केनी
  rationale: इस प्रसंग में קין किसी व्यक्ति कैन का नहीं, बल्कि केनी कुल का सामूहिक नाम है।
- source_word: מִבְּנֵי חֹבָב
  choice: होबाब के वंशज
  rationale: בני का शाब्दिक अर्थ ‘पुत्र’ है, पर यहां पूरे वंश या कुल के लोगों का बोध होता है; ‘वंशज’ आधुनिक हिंदी में आशय स्पष्ट करता है।
- source_word: חֹתֵן מֹשֶׁה
  choice: मूसा के ससुर
  rationale: חֹתֵן विवाह से बने संबंध को बताता है और यहां प्रचलित तथा संभावित अर्थ ‘ससुर’ है; व्यापक अर्थ पाद-टिप्पणी में रखा गया है।
- source_word: וַיֵּט אָהֳלוֹ
  choice: अपना तंबू लगाया था
  rationale: נטה אהל तंबू गाड़ने या फैलाने का मुहावरा है। पूर्णभूतकाल पृष्ठभूमि में पहले से घट चुकी क्रिया को दर्शाता है।
- source_word: עַד
  choice: तक जाकर
  rationale: עַד किसी स्थान तक पहुंचने की सीमा बताता है। ‘तक जाकर’ हिंदी में गमन और वहां तंबू लगाने, दोनों के संबंध को सहज बनाता है।
- source_word: אֵלוֹן
  choice: बांज वृक्ष
  rationale: אֵלוֹן किसी बड़े वृक्ष, विशेषतः ओक या बुतुम, को सूचित कर सकता है। ‘बांज वृक्ष’ मुख्य पाठ में सुबोध है और वनस्पति-संबंधी विकल्प पाद-टिप्पणी में सुरक्षित है।
- source_word: בצענים
  choice: सानन्नीम
  rationale: यह स्थान-नाम है; इसके अनिश्चित व्युत्पत्तिगत अर्थ का अनुवाद करने के बजाय लिप्यंतरण किया गया है।
- source_word: אֲשֶׁר אֶת קֶדֶשׁ
  choice: यह स्थान केदेश के निकट है
  rationale: यह पदबंध केदेश से निकटता व्यक्त करता है। अलग उपवाक्य हिंदी में संबंध को स्पष्ट और स्वाभाविक रखता है।
theological_decisions:
- issue: मूसा से חֹתֵן का संबंध
  choice: मूसा के ससुर
  alternative: मूसा के विवाह-संबंधी रिश्तेदार
  rationale: इब्रानी शब्द का अर्थ सामान्यतः विवाह से बना पुरुष संबंधी भी हो सकता है, पर मूसा और होबाब की कथा-परंपरा में ‘ससुर’ संभावित और परिचित अर्थ है। व्यापक संभावना को चुपचाप हटाने के बजाय पाद-टिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण और कथात्मक शैली रखी गई है। आरंभ में ऐसा कोई ‘अब’ नहीं जोड़ा गया, क्योंकि मूल इब्रानी में स्पष्ट काल-सूचक शब्द नहीं है। लंबी वंशावली-संबंधी रचना को दो वाक्यों में बांटकर अर्थ और पृष्ठभूमि-सूचक प्रवाह स्पष्ट किया गया है।
