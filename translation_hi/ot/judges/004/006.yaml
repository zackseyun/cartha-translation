base_translation:
  language: en
  yaml_path: translation/ot/judges/004/006.yaml
  text: 'She sent and summoned Barak son of Abinoam from Kedesh-naphtali, and said to him, “Has not the LORD, the God of Israel, commanded: ‘Go, draw up to Mount Tabor, and take with you ten thousand men from the sons of Naphtali and from the sons of Zebulun’?”'
translation:
  language: hi
  text: 'उसने केदेश-नप्ताली से अबीनोअम के पुत्र बाराक को बुलवा भेजा और उससे कहा, “क्या यहोवा, इस्राएल के परमेश्वर, ने यह आज्ञा नहीं दी है: ‘जा, ताबोर पर्वत पर कूच कर[a] और नप्ताली तथा जबूलून के वंशजों में से दस हज़ार पुरुषों को अपने साथ ले जा’?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ प्रयुक्त इब्रानी क्रिया का मूल अर्थ “खींचना” है; इस सैन्य प्रसंग में इसका अर्थ कूच करना, लोगों को साथ खींचकर ले जाना, या तैनात करना हो सकता है।
    reason: क्रिया מָשַׁךְ की अर्थ-व्याप्ति और उसके सटीक सैन्य आशय की अनिश्चितता को सुरक्षित रखने के लिए।
lexical_decisions:
- source_word: וַתִּשְׁלַח וַתִּקְרָא
  choice: बुलवा भेजा
  rationale: दोनों क्रियाओं—‘भेजना’ और ‘बुलाना’—का स्वाभाविक हिन्दी में संयुक्त भाव व्यक्त करता है।
- source_word: מִקֶּדֶשׁ נַפְתָּלִי
  choice: केदेश-नप्ताली से
  rationale: स्थान-नाम को संयुक्त रूप में रखता है और מִן का स्रोतार्थ ‘से’ स्पष्ट करता है।
- source_word: וּמָשַׁכְתָּ בְּהַר תָּבוֹר
  choice: ताबोर पर्वत पर सेना ले जा
  rationale: सैन्य प्रसंग में क्रिया का आशय लोगों को खींचकर/ले जाकर तैनात करने या कूच कराने का है; निहित कर्म को ‘सेना’ से स्पष्ट किया गया है, जबकि पादटिप्पणी मूल की व्यापकता सुरक्षित रखती है।
- source_word: עֲשֶׂרֶת אֲלָפִים אִישׁ
  choice: दस हज़ार पुरुषों
  rationale: संख्या और सैनिक भर्ती के पुरुष-संदर्भ को सीधे व्यक्त करता है।
- source_word: מִבְּנֵי נַפְתָּלִי וּמִבְּנֵי זְבֻלוּן
  choice: नप्ताली तथा जबूलून के वंशजों में से
  rationale: בְּנֵי का यहाँ जातीय/गोत्रीय अर्थ है; ‘वंशज’ आधुनिक हिन्दी में ‘पुत्रों’ से अधिक स्पष्ट है।
theological_decisions:
- issue: יהוה का हिन्दी रूप
  choice: यहोवा
  alternative: प्रभु
  rationale: व्यक्तिगत वाचा-नाम को नाम के रूप में बनाए रखता है और हिन्दी बाइबलीय परंपरा में व्यापक रूप से पहचाना जाता है।
- issue: הֲלֹא צִוָּה की प्रश्नात्मक शक्ति
  choice: क्या ... ने यह आज्ञा नहीं दी है
  alternative: '... ने आज्ञा दी है'
  rationale: मूल के आलंकारिक प्रश्न और दबावपूर्ण पुष्टि को कथन में बदलने के बजाय सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘बुलवा भेजा’ और ‘सेना ले जा’ सामान्य पाठक के लिए स्वाभाविक हैं; गोत्रीय संबंध के लिए ‘वंशज’ प्रयुक्त हुआ है। उद्धरण के भीतर आज्ञा को स्पष्ट रखने के साथ मूल के आलंकारिक प्रश्न को बनाए रखा गया है।
