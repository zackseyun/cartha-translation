  text: וַ/תֹּאמֶר֩ דְּבֹרָ֨ה אֶל בָּרָ֜ק ק֗וּם כִּ֣י זֶ֤ה הַ/יּוֹם֙ אֲשֶׁר֩ נָתַ֨ן יְהוָ֤ה אֶת סִֽיסְרָא֙ בְּ/יָדֶ֔/ךָ הֲ/לֹ֥א יְהוָ֖ה יָצָ֣א לְ/פָנֶ֑י/ךָ וַ/יֵּ֤רֶד בָּרָק֙ מֵ/הַ֣ר תָּב֔וֹר וַ/עֲשֶׂ֧רֶת אֲלָפִ֛ים אִ֖ישׁ אַחֲרָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/014.yaml
  text: Then Deborah said to Barak[a], “Arise, for this is the day on which Yahweh has given Sisera into your hand. Has not Yahweh gone out before you?” So Barak went down from Mount Tabor[b], with ten thousand men following him.
translation:
  language: hi
  text: तब दबोरा ने बाराक से कहा, “उठो, क्योंकि यही वह दिन है जिस दिन याहवे ने सीसरा को तुम्हारे हाथ में सौंप दिया है।[a] क्या याहवे तुम्हारे आगे नहीं गया है?[b]” तब बाराक ताबोर पर्वत से नीचे उतरा, और उसके पीछे दस हज़ार पुरुष चले।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सीसरा को तुम्हारे अधिकार में कर दिया है।”
    reason: lexical_alternative
  - marker: b
    text: या “क्या याहवे तुम्हारे आगे-आगे नहीं गया है?”
    reason: lexical_alternative
lexical_decisions:
- source_word: קוּם
  choice: उठो
  rationale: एकवचन आज्ञार्थक क्रिया बाराक को तुरंत कार्रवाई के लिए बुलाती है; ‘उठो’ आधुनिक हिंदी में स्वाभाविक और प्रभावशाली है।
- source_word: כִּי זֶה הַיּוֹם אֲשֶׁר
  choice: क्योंकि आज ही वह दिन है जब
  rationale: ‘आज ही’ संकेतवाचक बल को स्वाभाविक हिंदी में व्यक्त करता है, और ‘जब’ दिन से जुड़े संबंधवाचक उपवाक्य को सहज बनाता है।
- source_word: נָתַן ... בְּיָדֶךָ
  choice: तुम्हारे हाथ में कर दिया है
  rationale: हिब्रू मुहावरे में किसी को दूसरे के अधिकार में देने का भाव है। यह चयन ‘हाथ’ की मूल छवि और पूर्ण क्रिया से व्यक्त विजय की निश्चितता दोनों बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में प्रयुक्त परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: הֲלֹא
  choice: क्या ... नहीं
  rationale: यह सहमति की अपेक्षा रखने वाले आलंकारिक प्रश्न का रूप सुरक्षित रखता है।
- source_word: יָצָא לְפָנֶיךָ
  choice: तुम्हारे आगे ... निकल गया है
  rationale: ‘निकलना’ मूल क्रिया की गति और प्रसंग में निहित सैन्य अगुवाई दोनों को व्यक्त करता है, जबकि पाठ से अधिक विशिष्ट अर्थ नहीं जोड़ता।
- source_word: וַיֵּרֶד
  choice: नीचे उतरा
  rationale: पर्वत से नीचे आने की गति को आधुनिक हिंदी में स्वाभाविक ढंग से व्यक्त करता है।
- source_word: מֵהַר תָּבוֹר
  choice: ताबोर पर्वत से
  rationale: भौगोलिक नाम का प्रचलित देवनागरी रूप और הַר का स्पष्ट अर्थ रखा गया है।
- source_word: וַעֲשֶׂרֶת אֲלָפִים אִישׁ אַחֲרָיו
  choice: उसके पीछे दस हज़ार पुरुष चले
  rationale: אַחֲרָיו की अनुगमन-गतिशीलता को ‘पीछे ... चले’ से व्यक्त किया गया है; אִישׁ युद्ध में जाने वाले पुरुषों को स्पष्ट करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु
  rationale: मूल पाठ में वाचा-संबंधी व्यक्तिगत नाम सीधे आता है; ‘याहवे’ उसका लिप्यंतरण है और उसे किसी उपाधि में नहीं बदलता।
- issue: पूर्ण क्रिया נָתַן में विजय की निश्चितता
  choice: कर दिया है
  alternative: कर देगा
  rationale: हिब्रू पूर्ण क्रिया आगामी युद्ध के परिणाम को पहले से निश्चित मानकर कहती है। हिंदी पूर्णकाल इस तनाव को सुरक्षित रखता है; भविष्यकाल इसे केवल भविष्यवाणी बना देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक है। संवाद में आज्ञा और आलंकारिक प्रश्न की तीव्रता रखी गई है। ‘याहवे’, ‘सीसरा’ और ‘ताबोर’ नामों का सरल देवनागरी लिप्यंतरण किया गया है।
