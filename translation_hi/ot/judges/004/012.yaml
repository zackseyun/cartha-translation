  language: hi
  text: तब सीसरा को बताया गया कि अबीनोअम का पुत्र बाराक ताबोर पर्वत पर चढ़ गया था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּגִּדוּ
  choice: तब ... को बताया गया
  rationale: हिफ़ील रूप का अर्थ ‘बताना/समाचार देना’ है। इब्रानी में कर्ता अनिर्दिष्ट बहुवचन है; स्वाभाविक हिन्दी में भाववाच्य अनिर्दिष्ट सूचना को स्पष्ट रखता है, बिना किसी नए कर्ता की कल्पना किए।
- source_word: לְסִיסְרָא
  choice: सीसरा को
  rationale: לְ यहाँ सूचना पाने वाले अप्रत्यक्ष कर्म को चिह्नित करता है; हिन्दी में ‘को’ इसका स्वाभाविक रूप है।
- source_word: כִּי
  choice: कि
  rationale: कहने-बताने की क्रिया के बाद यह सूचना की विषयवस्तु प्रस्तुत करता है, कारण नहीं।
- source_word: עָלָה
  choice: चढ़ गया है
  rationale: עלה का मूल अर्थ ‘ऊपर जाना/चढ़ना’ है। पर्वत के संदर्भ में ‘चढ़ गया’ स्वाभाविक है; ‘है’ सीसरा को दी गई सूचना के दृष्टिकोण से पूर्ण हो चुकी क्रिया का परिणाम व्यक्त करता है।
- source_word: בָּרָק
  choice: बाराक
  rationale: व्यक्तिवाचक नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: בֶּן אֲבִינֹעַם
  choice: अबीनोअम का पुत्र
  rationale: इब्रानी पितृनाम-संबंध को गरिमापूर्ण और स्पष्ट हिन्दी में सुरक्षित रखा गया है।
- source_word: הַר תָּבוֹר
  choice: ताबोर पर्वत पर
  rationale: यह एक विशिष्ट नामित पर्वत है। עלה के साथ हिन्दी में गंतव्य ‘पर’ स्वाभाविक है और स्थलाकृतिक दिशा को बनाए रखता है।
