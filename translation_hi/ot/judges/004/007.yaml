  yaml_path: translation/ot/judges/004/007.yaml
  text: And I will draw Sisera[a], the commander of Jabin’s army, along with his chariots and his multitude, to you at the Wadi Kishon[b], and I will give him into your hand.
translation:
  language: hi
  text: और मैं याबीन की सेना के प्रधान सीसरा को उसके रथों और उसके जनसमूह के साथ कीशोन नाले[a] के पास तेरी ओर खींच लाऊँगा; और मैं उसे तेरे हाथ में सौंप दूँगा।
  philosophy: optimal-equivalence
  footnotes:
