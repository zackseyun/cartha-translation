- source_word: הֲמוֹנוֹ
  choice: उसकी सारी भीड़
  rationale: המון का मूल अर्थ भीड़, जनसमूह या बड़ी संख्या है। सैन्य प्रसंग के बावजूद ‘भीड़’ इसकी व्यापकता बचाती है; ‘सारी’ साथ आए पूरे समूह का भाव स्पष्ट करती है।
- source_word: וּנְתַתִּיהוּ
  choice: मैं उसे ... कर दूँगा
  rationale: נתן और ‘हाथ में’ मिलकर किसी को दूसरे के अधिकार में सौंपने का मुहावरा बनाते हैं; हिन्दी में ‘हाथ में कर दूँगा’ मूल बिंब को बनाए रखता है।
- source_word: בְּיָדֶךָ
  choice: तेरे हाथ में
  rationale: यह इब्रानी मुहावरा अधिकार या वश में कर देने का अर्थ रखता है। शाब्दिक बिंब हिन्दी में भी सहज और परिचित है।
