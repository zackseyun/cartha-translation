    text: या “कीशोन नदी के पास” अथवा “कीशोन की बरसाती धारा के पास”; इब्रानी शब्द नाले, जलधारा, नदी-घाटी या बरसात में उफनने वाली धारा के लिए प्रयुक्त हो सकता है।
    reason: lexical_alternative
