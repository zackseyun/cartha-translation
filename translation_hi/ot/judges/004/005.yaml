base_translation:
  language: en
  yaml_path: translation/ot/judges/004/005.yaml
  text: She used to sit under the palm of Deborah[a], between Ramah and Bethel in the hill country of Ephraim[b], and the sons of Israel went up to her for judgment.
translation:
  language: hi
  text: वह एप्रैम के पहाड़ी प्रदेश में रामा और बेतेल के बीच, दबोरा के खजूर के पेड़ के नीचे बैठा करती थी; और इस्राएली[a] न्याय[b] के लिए उसके पास चढ़कर आते थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “इस्राएल के पुत्र।” यह समूची इस्राएली प्रजा के लिए प्रयुक्त हिब्रानी अभिव्यक्ति है।
    reason: lexical_alternative
  - marker: b
    text: या, “न्यायिक निर्णय के लिए” या “न्याय कराने के लिए।” हिब्रानी शब्द न्यायिक निर्णय-प्रक्रिया या न्याय के प्रशासन को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹשֶׁבֶת
  choice: बैठा करती थी
  rationale: स्त्रीलिंग कृदंत प्रसंग में दबोरा के नियमित न्यायिक कार्य-स्थान का वर्णन करता है; यह हिन्दी में स्वाभाविक रूप से अभ्यस्त भूतकाल व्यक्त करता है।
- source_word: תֹּמֶר דְּבוֹרָה
  choice: दबोरा के खजूर के पेड़
  rationale: रचना-संबंध को स्पष्ट रखते हुए सामान्य हिन्दी में उस पहचाने हुए वृक्ष को दर्शाता है; इसे अनावश्यक रूप से औपचारिक स्थान-नाम नहीं बनाया गया।
- source_word: בְּהַר אֶפְרָיִם
  choice: एप्रैम के पहाड़ी प्रदेश में
  rationale: यहाँ एक अकेले पर्वत के बजाय एप्रैम के पर्वतीय भूभाग का संकेत है।
- source_word: וַיַּעֲלוּ אֵלֶיהָ
  choice: उसके पास ऊपर जाते थे
  rationale: עלה की ऊपर जाने वाली भौगोलिक छवि को बनाए रखता है और पहाड़ी प्रदेश के संदर्भ में उपयुक्त है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएली
  rationale: हिब्रानी मुहावरे का आशय इस्राएल की प्रजा से है; आधुनिक हिन्दी में ‘इस्राएली’ स्वाभाविक और समावेशी सामूहिक पद है।
- source_word: לַמִּשְׁפָּט
  choice: न्याय पाने के लिए
  rationale: न्यायिक निर्णय अथवा न्याय-व्यवस्था के लिए दबोरा के पास आने का आशय सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל का लिंगसूचक सामूहिक मुहावरा
  choice: इस्राएली
  alternative: इस्राएल के पुत्र
