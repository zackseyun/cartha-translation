source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֵלֶ֔י/הָ עֲמֹ֖ד פֶּ֣תַח הָ/אֹ֑הֶל וְ/הָיָה֩ אִם אִ֨ישׁ יָב֜וֹא וּ/שְׁאֵלֵ֗/ךְ וְ/אָמַ֛ר הֲ/יֵֽשׁ פֹּ֥ה אִ֖ישׁ וְ/אָמַ֥רְתְּ אָֽיִן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/020.yaml
  text: And he said to her[a], “Stand at the entrance of the tent, and if anyone comes and asks you, saying, ‘Is there a man here?’ you shall say, ‘No.’”
translation:
  language: hi
  text: उसने उससे कहा, “तंबू के प्रवेश-द्वार पर खड़ी रहो। यदि कोई पुरुष आकर तुमसे पूछे, ‘क्या यहाँ कोई पुरुष है?’ तो कहना, ‘नहीं।’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֲמֹד
  choice: खड़ी रहना
  rationale: यह עמד का स्त्रीलिंग एकवचन आदेश है। प्रसंग में याएल को प्रवेश-द्वार पर अपना स्थान बनाए रखने का निर्देश है; इसलिए ‘खड़ी रहना’ स्वाभाविक और अर्थ-सटीक है।
- source_word: פֶּתַח הָאֹהֶל
  choice: तंबू के प्रवेश-द्वार पर
  rationale: פֶּתַח किसी खुलने की जगह या प्रवेश को दर्शाता है। ‘प्रवेश-द्वार’ आधुनिक हिन्दी में स्पष्ट है और तंबू के संदर्भ में उपयुक्त है।
- source_word: וְהָיָה אִם
  choice: यदि
  rationale: यह रचना एक संभावित परिस्थिति प्रस्तुत करती है। हिन्दी में ‘यदि’ शर्त को स्वाभाविक रूप से व्यक्त करता है; इब्रानी मुहावरे का शब्दशः विस्तार आवश्यक नहीं।
- source_word: אִישׁ
  choice: कोई पुरुष
  rationale: אִישׁ दोनों स्थानों पर आया है और मूलतः ‘पुरुष’ का अर्थ देता है। पुनरावृत्ति बनाए रखने से स्रोत की शब्दावली और संभावित पुरुष खोजकर्ता का संकेत सुरक्षित रहता है।
- source_word: יָבוֹא
  choice: आकर
  rationale: בוא का सामान्य अर्थ ‘आना’ है। अगले क्रियापद के साथ ‘आकर ... पूछे’ स्वाभाविक हिन्दी क्रम देता है।
- source_word: וּשְׁאֵלֵךְ
  choice: तुमसे पूछे
  rationale: שׁאל यहाँ प्रश्न करने के अर्थ में है; ‘तुमसे पूछे’ सीधा और सामान्य आधुनिक हिन्दी प्रयोग है।
- source_word: הֲיֵשׁ פֹּה אִישׁ
  choice: क्या यहाँ कोई पुरुष है?
  rationale: प्रश्न उपस्थिति के विषय में है। ‘यहाँ’ פֹּה को और ‘कोई पुरुष’ אִישׁ को स्पष्ट रूप से व्यक्त करता है।
- source_word: אָיִן
  choice: नहीं
  rationale: इब्रानी उत्तर अत्यंत संक्षिप्त है। ‘नहीं’ उसी संक्षिप्तता को स्वाभाविक हिन्दी में बनाए रखता है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। स्त्री संबोधन को ‘खड़ी रहना’ और ‘कहना’ से व्यक्त किया गया है। इब्रानी में אִישׁ की दोनों बार की पुनरावृत्ति हिन्दी मुख्य पाठ में ‘कोई पुरुष’ के रूप में सुरक्षित रखी गई है; अतिरिक्त पाद-टिप्पणी आवश्यक नहीं मानी गई।
