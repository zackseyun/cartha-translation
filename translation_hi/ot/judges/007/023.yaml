  rationale: निफ़अल रूप और सैन्य प्रसंग में क्रिया का आशय लोगों को इकट्ठा करना या युद्ध के लिए बुलाना है। एकवचन सामूहिक कर्ता के कारण हिन्दी में ‘बुलाया गया’ रखा गया; ‘युद्ध के लिए’ प्रसंगगत अर्थ स्पष्ट करता है।
- source_word: אִישׁ יִשְׂרָאֵל
  choice: इस्राएली पुरुषों
  rationale: इब्रानी में शाब्दिक रूप से एकवचन ‘इस्राएल का पुरुष’ है, पर यह सामूहिक प्रयोग है; आगे आने वाली बहुवचन क्रिया भी बहुवचन अर्थ की पुष्टि करती है।
- source_word: מִנַּפְתָּלִי וּמִן אָשֵׁר וּמִן כָּל מְנַשֶּׁה
  choice: नप्ताली, आशेर और सारे मनश्शे से
  rationale: מִן स्रोत को दर्शाता है और כָּל मनश्शे की व्यापक भागीदारी पर बल देता है। जनजातीय नामों को उनके भूभाग/समुदाय के रूप में स्वाभाविक हिन्दी में रखा गया है।
- source_word: וַיִּרְדְּפוּ
  choice: उन्होंने ... पीछा किया
  rationale: सैन्य कथा में רדף शत्रु का पीछा करने के सामान्य अर्थ में है।
- source_word: אַחֲרֵי מִדְיָן
  choice: मिद्यानियों का
  rationale: यहाँ ‘मिद्यान’ लाक्षणिक रूप से मिद्यानी सेना या लोगों के लिए प्रयुक्त है; हिन्दी में ‘मिद्यानियों’ कहना लक्ष्य को स्पष्ट और स्वाभाविक बनाता है।
