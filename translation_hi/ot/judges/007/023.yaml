base_translation:
  language: en
  yaml_path: translation/ot/judges/007/023.yaml
  text: And the men of Israel were called out from Naphtali[a], from Asher, and from all Manasseh[c][b], and they pursued Midian.
translation:
  language: hi
  text: तब नप्ताली, आशेर और पूरे मनश्शे से इस्राएली पुरुषों को बुलाया गया[a][b], और उन्होंने मिद्यानियों का पीछा किया[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद “एकत्र किया गया” भी हो सकता है, या अधिक शाब्दिक रूप से “पुकारा गया।” इब्रानी क्रिया यहाँ कठिन है; प्रसंग में इसका आशय पीछा करने के लिए लोगों को इकट्ठा करने से है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक रूप से “इस्राएल का पुरुष” है; यह सामूहिक अभिव्यक्ति इस्राएली पुरुषों को दर्शाती है।
    reason: lexical_alternative
  - marker: c
    text: इब्रानी में “मिद्यान”; यहाँ यह मिद्यानी सेना के लिए प्रयुक्त है।
    reason: lexical_alternative
