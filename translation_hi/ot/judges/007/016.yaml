  yaml_path: translation/ot/judges/007/016.yaml
  text: Then he divided the three hundred men into three companies[a], and put trumpets into the hands of all of them, and empty jars[c][b], with torches inside the jars.
translation:
  language: hi
  text: तब उसने उन तीन सौ पुरुषों को तीन दलों में बाँट दिया[a] और उन सबके हाथों में नरसिंगे[b], खाली घड़े[c], और घड़ों के भीतर मशालें भी दीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से ‘तीन सिर’; यह तीन समूहों या दलों के अर्थ में प्रयुक्त मुहावरा है।
    reason: lexical_alternative
  - marker: b
    text: अर्थात् संकेत देने के लिए बजाए जाने वाले सींग-वाद्य; इसे ‘तुरहियाँ’ भी कहा जा सकता है।
    reason: lexical_alternative
  - marker: c
    text: या ‘खाली मटके’।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחַץ
  choice: बाँट दिया
  rationale: यहाँ क्रिया का अर्थ सेना को अलग-अलग दलों में विभाजित करना है; ‘बाँट दिया’ सहज और प्रसंगानुकूल है।
- source_word: שְׁלֹשׁ מֵאוֹת הָאִישׁ
  choice: उन तीन सौ पुरुषों
  rationale: אִישׁ का मूल अर्थ ‘पुरुष’ है; ‘सैनिक’ कहना प्रसंग से संभव है, पर मूल से अधिक व्याख्यात्मक होगा।
- source_word: שְׁלֹשָׁה רָאשִׁים
  choice: तीन दलों
  rationale: शाब्दिक रूप से ‘तीन सिर’ एक मुहावरा है, जिसका आशय तीन समूह या दल है। सैन्य प्रसंग में ‘दल’ स्वाभाविक है।
- source_word: וַיִּתֵּן ... בְּיַד כֻּלָּם
  choice: उन सबके हाथों में ... दिए
  rationale: यह अनुवाद वितरण के साथ मूल पाठ में उपस्थित ‘हाथ’ की ठोस छवि को भी बनाए रखता है।
- source_word: שׁוֹפָרוֹת
  choice: नरसिंगे
  rationale: שׁוֹפָר संकेत देने के लिए बजाया जाने वाला सींग-वाद्य है; ‘नरसिंगा’ आधुनिक हिन्दी में परिचित और प्रसंगानुकूल समतुल्य है।
- source_word: כַדִּים רֵקִים
  choice: खाली घड़े
  rationale: כַּד मिट्टी का घड़ा या पात्र हो सकता है; ‘खाली घड़े’ सामान्य हिन्दी में स्पष्ट है और विशेषण רֵקִים को सुरक्षित रखता है।
- source_word: לַפִּדִים
  choice: मशालें
  rationale: לַפִּיד के लिए ‘मशाल’ स्पष्ट, प्रचलित और प्रसंगानुकूल हिन्दी शब्द है।
- source_word: בְּתוֹךְ הַכַּדִּים
  choice: घड़ों के भीतर
  rationale: यह पात्रों के अंदर मशालों की स्थिति को सीधे व्यक्त करता है और मूल स्थान-संबंध को बनाए रखता है।
