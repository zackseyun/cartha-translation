  text: and you will hear what they are saying[a], and afterward your hands will be strengthened[b], and you will go down into the camp.” So he went down with Purah his servant to the edge of the armed men who were in the camp.
translation:
  language: hi
  text: “और तू सुनेगा कि वे क्या कह रहे हैं। उसके बाद तेरे हाथ दृढ़ हो जाएँगे, और तू छावनी में उतर जाएगा।” तब वह अपने सेवक[a] पूरा के साथ छावनी में मौजूद सशस्त्र लोगों[b] के बाहरी छोर तक उतर गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से “उसका युवा पुरुष”; इस शब्द का अर्थ “सेवक” या “परिचर” भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “युद्ध के लिए सुसज्जित लोग”; इब्रानी शब्द हथियारों से लैस सैनिकों का बोध करा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמַעְתָּ מַה יְדַבֵּרוּ
  choice: और तू सुनेगा कि वे क्या कह रहे हैं
  rationale: संयोजक सहित पूर्ण क्रिया इस प्रत्यक्ष वचन के क्रम में भविष्य का भाव देती है; अपूर्ण क्रिया तत्काल सुनी जाने वाली बातचीत को दर्शाती है।
- source_word: וְאַחַר
  choice: उसके बाद
  rationale: सुनने के बाद होने वाले परिणाम का स्पष्ट कालक्रम बनाए रखता है।
- source_word: תֶּחֱזַקְנָה יָדֶיךָ
  choice: तेरे हाथ दृढ़ हो जाएँगे
  rationale: साहस और संकल्प के लिए प्रयुक्त इब्रानी बिंब ‘हाथ’ को सुरक्षित रखते हुए हिन्दी में समझने योग्य अभिव्यक्ति देता है।
- source_word: וְיָרַדְתָּ בַּמַּחֲנֶה
  choice: और तू छावनी में उतर जाएगा
  rationale: ירד का मूल गतिसूचक अर्थ ‘उतरना’ और בְּ के साथ छावनी के भीतर जाने का भाव सुरक्षित है।
- source_word: וַיֵּרֶד הוּא
  choice: तब वह ... उतर गया
  rationale: कथात्मक wayyiqtol घटनाक्रम को आगे बढ़ाता है; ‘तब’ निर्देश से उसके पालन की ओर स्वाभाविक संक्रमण देता है।
- source_word: וּפֻרָה
  choice: पूरा
  rationale: व्यक्तिनाम का आधुनिक हिन्दी ध्वन्यात्मक लिप्यंतरण।
- source_word: נַעֲרוֹ
  choice: अपने सेवक
  rationale: נַעַר का मूल अर्थ युवक हो सकता है, पर इस सैन्य प्रसंग में साथ रहने वाले सेवक अथवा परिचर का अर्थ स्वाभाविक है; वैकल्पिक शाब्दिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: אֶל קְצֵה
  choice: के छोर तक
  rationale: קצה के ‘किनारा/छोर’ अर्थ को बनाए रखता है और छावनी की बाहरी सीमा का संकेत देता है।
- source_word: הַחֲמֻשִׁים
  choice: हथियारबंद लोगों
  rationale: यह पद युद्ध के लिए सुसज्जित या हथियारबंद व्यक्तियों को सूचित करता है; ‘लोगों’ मूल के पुरुषवाचक समूह को सहज हिन्दी में व्यक्त करता है।
- source_word: אֲשֶׁר בַּמַּחֲנֶה
  choice: छावनी में मौजूद
  rationale: सम्बन्धवाचक उपवाक्य को संक्षिप्त और स्वाभाविक हिन्दी में प्रस्तुत करता है।
theological_decisions:
- issue: ‘हाथ दृढ़ होने’ के मुहावरे को बनाए रखना
  choice: तेरे हाथ दृढ़ हो जाएँगे
  alternative: तुझे साहस मिलेगा
  rationale: मूल पाठ के देहात्मक बिंब को अर्थ-स्पष्टीकरण से बदलने के बजाय सुरक्षित रखा गया है, ताकि साहस और कार्य-सामर्थ्य दोनों की अर्थ-छाया बनी रहे।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सुबोध कथात्मक रूप अपनाया गया है। ईश्वरीय प्रत्यक्ष संबोधन में प्रसंगानुकूल एकवचन ‘तू/तेरे’ रखा गया है। मूल का ‘हाथ दृढ़ होना’ मुहावरा जानबूझकर सुरक्षित है। पादटिप्पणी-चिह्न उन्हीं शब्दों पर लगाए गए हैं जिनसे उनके lexical विकल्प संबंधित हैं।
