base_translation:
  language: en
  yaml_path: translation/ot/judges/007/024.yaml
  text: And Gideon sent messengers throughout all the hill country of Ephraim[a], saying, “Come down against Midian, and seize the waters as far as Beth-barah, and the Jordan.” So every man of Ephraim was called out, and they seized the waters as far as Beth-barah[c][b], and the Jordan.
translation:
  language: hi
  text: और गिदोन ने एप्रैम के सारे पहाड़ी प्रदेश में दूत भेजकर कहा, “मिद्यान का सामना करने के लिए नीचे उतरो और बेत-बारा तक के जल[a] और यरदन को अपने अधिकार में कर लो।” तब एप्रैम के सभी पुरुषों को पुकारा गया[b], और उन्होंने बेत-बारा तक के जल और यरदन को अपने अधिकार में कर लिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ “जल” है; सम्भवतः यहाँ जलमार्गों, घाटों, या नदी पार करने के रणनीतिक स्थानों का उल्लेख है।
    reason: lexical_alternative
  - marker: b
    text: यह क्रियारूप कठिन है। इसका अधिक शाब्दिक अनुवाद “पुकारा गया” या “पुकार उठी” हो सकता है; संदर्भ में आशय एप्रैम के पुरुषों को युद्ध के लिए बुलाने या जुटाने से है।
    reason: alternative_reading
lexical_decisions:
- source_word: וּמַלְאָכִים
  choice: दूत
  rationale: यहाँ मनुष्यों को संदेश लेकर भेजा गया है; ‘दूत’ स्वाभाविक और संदर्भानुकूल है।
- source_word: בְּכָל הַר אֶפְרַיִם
  choice: एप्रैम के सारे पहाड़ी प्रदेश में
  rationale: הַר यहाँ किसी एक पर्वत के बजाय एप्रैम के पहाड़ी भूभाग को सूचित करता है।
- source_word: רְדוּ לִקְרַאת מִדְיָן
  choice: मिद्यान का सामना करने के लिए नीचे उतरो
  rationale: רְדוּ ऊँचे प्रदेश से उतरने की भौगोलिक गति रखता है, जबकि सैन्य संदर्भ में לִקְרַאת सामना करने या रोकने के लिए आगे बढ़ने का भाव देता है।
- source_word: וְלִכְדוּ לָהֶם
  choice: अधिकार कर लो
  rationale: לכד का भाव रणनीतिक स्थानों को पकड़ने या अपने नियंत्रण में लेने का है; हिन्दी में ‘अधिकार कर लो’ संदर्भ के अनुसार सहज है।
- source_word: אֶת הַמַּיִם
  choice: जलस्थानों
  rationale: शाब्दिक अर्थ ‘जल’ है, पर सैन्य संदर्भ में नदी तक पहुँचने वाले जलमार्गों, घाटों या पार उतरने के रणनीतिक स्थानों का संकेत सम्भावित है। ‘जलस्थानों’ मूल की व्यापकता को कुछ हद तक बनाए रखता है; विकल्प पादटिप्पणी में दिए गए हैं।
- source_word: עַד בֵּית בָּרָה
  choice: बेत-बारा तक
  rationale: עַד सीमा या विस्तार दर्शाता है; स्थाननाम को लिप्यंतरित किया गया है।
- source_word: וְאֶת הַיַּרְדֵּן
  choice: और यरदन पर
  rationale: वाक्य में यही क्रिया का समान कर्म है; हिन्दी में नियंत्रण का भाव स्पष्ट करने हेतु ‘पर’ प्रयुक्त है।
- source_word: וַיִּצָּעֵק כָּל אִישׁ אֶפְרַיִם
  choice: तब एप्रैम के सभी पुरुषों को इकट्ठा होने के लिए पुकारा गया
  rationale: क्रियारूप कठिन है और शाब्दिक रूप से ‘पुकारा/चिल्लाया गया’ से जुड़ता है; संदेशवाहकों के संदर्भ में सेना को बुलाने या जुटाने का भाव सर्वाधिक उपयुक्त है। सामूहिक एकवचन אִישׁ को ‘सभी पुरुषों’ से व्यक्त किया गया है।
- source_word: וַיִּלְכְּדוּ
  choice: उन्होंने ... अधिकार कर लिया
  rationale: पहले आए לכד के साथ अर्थगत संगति रखते हुए सफल नियंत्रण का भाव व्यक्त किया गया है।
