  text: וַ/יֹּ֣אמֶר אֲלֵי/הֶ֔ם מִמֶּ֥/נִּי תִרְא֖וּ וְ/כֵ֣ן תַּעֲשׂ֑וּ וְ/הִנֵּ֨ה אָנֹכִ֥י בָא֙ בִּ/קְצֵ֣ה הַֽ/מַּחֲנֶ֔ה וְ/הָיָ֥ה כַ/אֲשֶׁר אֶעֱשֶׂ֖ה כֵּ֥ן תַּעֲשֽׂוּ/ן־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/017.yaml
  text: And he said to them[a], “Watch me, and do likewise. Behold, when I come to the edge of the camp, then as I do, so you shall do.”
translation:
  language: hi
  text: उसने उनसे कहा, “मुझे देखो और वैसा ही करो। देखो, जब मैं छावनी के किनारे आऊँ, तब जैसा मैं करूँ, वैसा ही तुम करना।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִמֶּנִּי תִרְאוּ
  choice: मुझे ध्यान से देखो
  rationale: ראה के साथ מן यहाँ गिदोन को कार्य के नमूने के रूप में देखकर उसका अनुकरण करने का निर्देश देता है। ‘ध्यान से देखो’ इस आशय को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: וְכֵן תַּעֲשׂוּ
  choice: और वैसा ही करो
  rationale: כֵן रीति या ढंग (‘ऐसा/वैसा’) बताता है; यह अनुवाद अनुकरण और आज्ञार्थक बल दोनों बनाए रखता है।
- source_word: וְהִנֵּה
  choice: देखो
  rationale: הִנֵּה आगे कही जाने वाली बात की ओर ध्यान खींचता है। ‘देखो’ हिन्दी में संक्षिप्त, स्पष्ट और प्रसंगानुकूल है।
- source_word: אָנֹכִי בָא
  choice: मैं … पहुँचूँ
  rationale: בָא का कृदन्त निकट भविष्य की गति को सजीव बनाता है। गंतव्य के साथ हिन्दी में ‘पहुँचूँ’ अधिक स्वाभाविक है और मूल की गति तथा आसन्नता को व्यक्त करता है।
- source_word: בִּקְצֵה הַמַּחֲנֶה
  choice: छावनी के किनारे
  rationale: קָצֶה किसी वस्तु की सीमा या किनारे को दर्शाता है; ‘छावनी के किनारे’ सटीक और सहज है।
- source_word: וְהָיָה כַאֲשֶׁר
  choice: तो जैसा
  rationale: यह रचना आगामी कार्य और उसके अनुकरण के बीच परिस्थिति तथा क्रम का संबंध स्थापित करती है; ‘तो जैसा’ हिन्दी में इसे स्वाभाविक रूप से रखता है।
- source_word: אֶעֱשֶׂה כֵּן תַּעֲשׂוּן
  choice: जैसा मैं करूँ, वैसा ही तुम भी करना
  rationale: मूल की अनुकरण-सूत्र रचना को निकटता से रखते हुए यह निर्देशात्मक बल को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी का स्पष्ट, गरिमापूर्ण और मौखिक सैन्य-निर्देश के अनुकूल रूप। ‘ध्यान से’ मूल में अलग शब्द के रूप में नहीं है, पर ראה מן की अनुकरणात्मक दृष्टि को हिन्दी में स्पष्ट करता है। किसी सम्प्रदायगत व्याख्या को नहीं जोड़ा गया है।
