source:
  edition: WLC
  text: וְ/תָקַעְתִּי֙ בַּ/שּׁוֹפָ֔ר אָנֹכִ֖י וְ/כָל אֲשֶׁ֣ר אִתִּ֑/י וּ/תְקַעְתֶּ֨ם בַּ/שּׁוֹפָר֜וֹת גַּם אַתֶּ֗ם סְבִיבוֹת֙ כָּל הַֽ/מַּחֲנֶ֔ה וַ/אֲמַרְתֶּ֖ם לַ/יהוָ֥ה וּ/לְ/גִדְעֽוֹן־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/018.yaml
  text: When I and all who are with me blow the ram’s horn[a], then you also must blow the horns all around the whole camp, and say[b], ‘For Yahweh and for Gideon!’
translation:
  language: hi
  text: जब मैं और मेरे साथ के सभी लोग नरसिंगा[a] फूँकूँ, तब तुम भी पूरी छावनी के चारों ओर नरसिंगे फूँकना और कहना[b], ‘याहवे के लिए और गिदोन के लिए!’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी שׁוֹפָר उस सींग-वाद्य को दर्शाता है जो प्रायः मेढ़े के सींग से बनाया जाता था; यह धातु की तुरही नहीं था।
    reason: cultural_note
  - marker: b
    text: कुछ अनुवादों में यहाँ ‘याहवे और गिदोन की तलवार’ मिलता है, सम्भवतः न्यायियों 7:20 के निकटवर्ती शब्दों के प्रभाव से। इस पद का इब्रानी पाठ केवल ‘याहवे के लिए और गिदोन के लिए’ कहता है।
    reason: alternative_reading
lexical_decisions:
- source_word: תָקַעְתִּי / תְקַעְתֶּם
  choice: फूँकें / फूँकना
  rationale: שׁוֹפָר के साथ תקע का अर्थ सींग-वाद्य फूँकना या बजाना है। ‘फूँकना’ ठोस क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: שׁוֹפָר / שׁוֹפָרוֹת
  choice: नरसिंगा / नरसिंगे
  rationale: यह धातु की तुरही नहीं, सींग से बना वाद्य है। ‘नरसिंगा’ आधुनिक हिन्दी पाठक के लिए अपेक्षाकृत सुबोध और सांस्कृतिक रूप से उपयुक्त शब्द है; विवरण पादटिप्पणी में दिया गया है।
- source_word: אָנֹכִי וְכָל אֲשֶׁר אִתִּי
  choice: मैं और मेरे साथ के सभी लोग
  rationale: वाक्यांश गिदोन और उसके साथ उपस्थित लोगों को सूचित करता है; यह रूप सहज और स्पष्ट है।
- source_word: גַּם אַתֶּם
  choice: तुम भी
  rationale: גַּם की समावेशी शक्ति को संक्षेप और स्वाभाविक ढंग से बनाए रखता है।
- source_word: סְבִיבוֹת כָּל הַמַּחֲנֶה
  choice: पूरी छावनी के चारों ओर
  rationale: סְבִיבוֹת और כָּל दोनों के व्यापक स्थानिक भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וַאֲמַרְתֶּם
  choice: कहना
  rationale: मूल क्रिया साधारण ‘कहना’ है। युद्ध-संदर्भ के बावजूद ‘चिल्लाना’ जोड़ने से ऐसी तीव्रता आती जिसे इब्रानी स्पष्ट नहीं करता।
- source_word: לַיהוָה וּלְגִדְעוֹן
  choice: याहवे के लिए और गिदोन के लिए
  rationale: दोनों ל उपसर्गों की समानांतर संरचना और पक्ष/निष्ठा सूचित करने वाला ‘के लिए’ भाव सुरक्षित रहता है। יהוה को उसके व्यक्तिगत वाचा-नाम ‘याहवे’ के रूप में रखा गया है।
theological_decisions:
- issue: युद्धघोष לַיהוָה וּלְגִדְעוֹן का अनुवाद
  choice: याहवे के लिए और गिदोन के लिए!
  alternative: याहवे और गिदोन की तलवार!
  rationale: इस पद के इब्रानी पाठ में ‘तलवार’ नहीं है; वह निकटवर्ती 7:20 में आता है। अतः उसे यहाँ जोड़ना पाठों का सामंजस्य करना होगा। ל का पुनरावर्तन ‘के लिए ... और ... के लिए’ के रूप में सुरक्षित रखा गया है।
- issue: יהוה का निरूपण
  choice: याहवे
  alternative: प्रभु
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत वाचा-नाम है; लिप्यंतरण नाम और उपाधि के भेद को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और मौखिक निर्देश जैसी रखी गई है। ‘छावनी’, ‘नरसिंगा’ और ‘याहवे’ जैसे शब्द प्रसंग की प्राचीनता बनाए रखते हैं, जबकि वाक्य-विन्यास सामान्य आधुनिक हिन्दी का है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
