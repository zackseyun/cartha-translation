  yaml_path: translation/ot/judges/007/021.yaml
  text: And each man stood in his place around the camp[a], and the whole camp ran, and they shouted and fled.
translation:
  language: hi
  text: और हर एक व्यक्ति छावनी के चारों ओर अपने-अपने स्थान पर खड़ा रहा, और सारी छावनी के लोग दौड़े, और वे चिल्लाए[a] और भाग गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उन्होंने युद्ध-घोष किया।” यहाँ प्रयुक्त क्रिया युद्ध में किए गए ऊँचे घोष या घबराहट में निकली चीख—दोनों को व्यक्त कर सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַמְדוּ
  choice: खड़ा रहा
  rationale: עמד का मूल अर्थ खड़ा होना या अपने स्थान पर डटे रहना है। एकवचन-वितरक पदबंध ‘हर एक व्यक्ति’ के साथ हिन्दी में ‘खड़ा रहा’ स्वाभाविक है।
- source_word: אִישׁ תַּחְתָּיו
  choice: हर एक व्यक्ति ... अपने-अपने स्थान पर
  rationale: शाब्दिक रूप ‘हर व्यक्ति अपने नीचे’ एक इब्रानी मुहावरा है, जिसका अर्थ प्रत्येक का अपनी निर्धारित जगह पर होना है। ‘अपने-अपने’ इसकी वितरकता स्पष्ट करता है।
- source_word: סָבִיב לַמַּחֲנֶה
  choice: छावनी के चारों ओर
  rationale: यह पदबंध छावनी को घेरे हुए स्थिति बताता है; ‘चारों ओर’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: וַיָּרָץ כָּל הַמַּחֲנֶה
  choice: सारी छावनी के लोग दौड़ने लगे
  rationale: ‘सारी छावनी दौड़ी’ इब्रानी में सामूहिक लक्षणा है। हिन्दी में ‘छावनी के लोग’ अभिप्रेत मानवीय कर्ता स्पष्ट करता है, जबकि ‘दौड़ने लगे’ घबराहट में आरम्भ हुई सामूहिक गति व्यक्त करता है।
- source_word: וַיָּרִיעוּ
  choice: वे चिल्लाए
  rationale: רוע/ריע ऊँची पुकार, युद्धघोष या घबराहट की चीख का संकेत दे सकता है। ‘चिल्लाए’ इस संदर्भगत अस्पष्टता को संकीर्ण किए बिना बनाए रखता है।
- source_word: ויניסו
  choice: भाग गए
  rationale: נוס का सामान्य अर्थ भागना या पलायन करना है। ‘भाग गए’ वर्तमान मानक हिन्दी में सहज और स्पष्ट है।
