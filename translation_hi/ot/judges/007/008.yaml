base_translation:
  language: en
  yaml_path: translation/ot/judges/007/008.yaml
  text: So they took the provisions of the people in their hands[a], along with their trumpets. And he sent every man of Israel, each to his tent, but retained the three hundred men. And the camp of Midian was below him in the valley.
translation:
  language: hi
  text: तब उन्होंने लोगों की रसद और उनके नरसिंगे[a] अपने हाथों में ले लिए। उसने इस्राएल के हर पुरुष को अपने-अपने तंबुओं में भेज दिया, पर तीन सौ पुरुषों को रोक रखा। मिद्यान की छावनी उससे नीचे घाटी में थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तुरहियाँ” अथवा “सींग”; इब्रानी शब्द उस सींग के लिए है जिसे संकेत देने वाले वाद्य के रूप में बजाया जाता था।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: उन्होंने ... ले लिए
  rationale: बहुवचन कथात्मक क्रिया का सरल और स्वाभाविक हिन्दी रूप; कर्ता प्रसंग से चुने हुए पुरुष समझे जाते हैं।
- source_word: צֵדָה
  choice: रसद
  rationale: यह केवल भोजन नहीं, यात्रा या सैन्य अभियान के लिए रखी गई सामग्री को भी दर्शाता है; ‘रसद’ प्रसंगानुकूल और व्यापक है।
- source_word: הָעָם
  choice: लोगों
  rationale: इब्रानी का सामान्य शब्द बनाए रखा गया है; प्रसंग में इसका आशय इस्राएली सैनिकों के बड़े समूह से है।
- source_word: בְּיָדָם
  choice: अपने हाथों में
  rationale: मूल की ठोस अभिव्यक्ति को बनाए रखते हुए वस्तुओं को लेने और साथ रखने का भाव व्यक्त करता है।
- source_word: שׁוֹפְרֹתֵיהֶם
  choice: उनके नरसिंगे
  rationale: शोफ़ार सींग से बना संकेत देने वाला वाद्य है; ‘नरसिंगा’ आधुनिक हिन्दी में इसके आकार और सैन्य-संकेत वाले उपयोग को ‘तुरही’ से अधिक ठोस रूप में व्यक्त करता है।
- source_word: שִׁלַּח
  choice: उसने ... भेज दिया
  rationale: एकवचन क्रिया का कर्ता गिदोन है; ‘भेज दिया’ मूल अर्थ के निकट है, जबकि प्रसंग से विदा करने का भाव स्पष्ट होता है।
- source_word: כָּל אִישׁ יִשְׂרָאֵל ... אִישׁ לְאֹהָלָיו
  choice: इस्राएल के हर पुरुष को उसके तंबू में
  rationale: मूल की वितरणात्मक, स्पष्टतः पुरुषवाचक एकवचन रचना सुरक्षित रखी गई है, क्योंकि संदर्भ पुरुष सैनिकों का है।
- source_word: וּבִשְׁלֹשׁ מֵאוֹת הָאִישׁ הֶחֱזִיק
  choice: पर उन तीन सौ पुरुषों को अपने पास रखा
  rationale: החזיק यहाँ उन्हें जाने न देकर साथ बनाए रखने का भाव देता है; ‘पर’ भेजे गए बड़े दल और रखे गए छोटे दल का निहित विरोध स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: מַחֲנֵה מִדְיָן
  choice: मिद्यान की छावनी
  rationale: सम्बन्धवाचक इब्रानी पदबंध का संक्षिप्त और स्वाभाविक हिन्दी रूप।
- source_word: מִתַּחַת בָּעֵמֶק
  choice: नीचे घाटी में
  rationale: ऊँचाई के स्थानिक विरोध और स्थलाकृति, दोनों को सीधे सुरक्षित रखता है।
