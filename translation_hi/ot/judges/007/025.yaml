  text: וַֽ/יִּלְכְּד֡וּ שְׁנֵֽי שָׂרֵ֨י מִדְיָ֜ן אֶת עֹרֵ֣ב וְ/אֶת זְאֵ֗ב וַ/יַּהַרְג֨וּ אֶת עוֹרֵ֤ב בְּ/צוּר עוֹרֵב֙ וְ/אֶת זְאֵב֙ הָרְג֣וּ בְ/יֶֽקֶב זְאֵ֔ב וַֽ/יִּרְדְּפ֖וּ אֶל מִדְיָ֑ן וְ/רֹאשׁ עֹרֵ֣ב וּ/זְאֵ֔ב הֵבִ֨יאוּ֙ אֶל גִּדְע֔וֹן מֵ/עֵ֖בֶר לַ/יַּרְדֵּֽן־־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/025.yaml
  text: And they captured the two princes of Midian[a], Oreb and Zeeb. They killed Oreb at the rock of Oreb, and they killed Zeeb at the winepress of Zeeb. Then they pursued Midian[b], and they brought the heads of Oreb and Zeeb to Gideon from across the Jordan.
translation:
  language: hi
  text: उन्होंने मिद्यान के दो सरदारों[a], ओरेब और ज़ेब, को पकड़ लिया। उन्होंने ओरेब को ओरेब की चट्टान पर मार डाला और ज़ेब को ज़ेब के दाखरस के कुंड पर मार डाला। फिर उन्होंने मिद्यान का पीछा किया, और ओरेब और ज़ेब के सिर यरदन के पार से[b] गिदोन के पास ले आए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ओरेब’ नाम इब्रानी भाषा के ‘कौआ’ शब्द से, और ‘ज़ेब’ नाम ‘भेड़िया’ शब्द से संबंधित है; मुख्य पाठ में दोनों को व्यक्तिगत नामों के रूप में दिया गया है।
    reason: lexical_alternative
  - marker: b
    text: या, “यरदन के उस पार से।” यह अभिव्यक्ति वक्ता के भौगोलिक दृष्टिकोण के अनुसार समझी जा सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלְכְּדוּ
  choice: पकड़ लिया
  rationale: לכד सैन्य प्रसंग में पकड़ने या अधिकार में लेने को व्यक्त करता है; ‘पकड़ लिया’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: שְׁנֵי שָׂרֵי מִדְיָן
  choice: मिद्यान के दो सरदारों
  rationale: שַׂר यहाँ ऊँचे पद वाले राजनीतिक-सैन्य अगुओं के लिए है। ‘सरदार’ उनके पद और अधिकार को बनाए रखता है और सामान्य हिन्दी में ‘राजकुमार’ से अधिक प्रसंगानुकूल है।
- source_word: עֹרֵב וְזְאֵב
  choice: ओरेब और जेब
  rationale: दोनों व्यक्तिगत नाम हैं, इसलिए उनके शाब्दिक अर्थों का अनुवाद करने के बजाय प्रचलित हिन्दी लिप्यंतरण रखा गया है।
- source_word: בְּצוּר עוֹרֵב
  choice: ओरेब की चट्टान पर
  rationale: צוּר का अर्थ चट्टान या शैल है। स्थान-सूचक ב को ‘पर’ से व्यक्त करके नामकरण की पुनरावृत्ति बनाए रखी गई है।
- source_word: בְיֶקֶב זְאֵב
  choice: जेब के दाखरस-कुंड पर
  rationale: יֶקֶב अंगूर रौंदने और रस एकत्र करने की संरचना या कुंड को दर्शाता है। ‘दाखरस-कुंड’ संक्षिप्त और प्रसंग में स्पष्ट है; ‘पर’ नामित स्थान के लिए उपयुक्त है।
- source_word: וַיִּרְדְּפוּ אֶל־מִדְיָן
  choice: फिर वे मिद्यानियों का पीछा करते रहे
  rationale: रूपक रूप में ‘मिद्यान’ उसके लोगों या सेना को दर्शाता है। हिन्दी में ‘मिद्यानियों’ कहना आशय स्पष्ट करता है, और ‘करते रहे’ जारी सैन्य पीछा व्यक्त करता है।
- source_word: וְרֹאשׁ עֹרֵב וּזְאֵב
  choice: ओरेब और जेब के सिर
  rationale: रֹאשׁ रूपतः एकवचन है, पर दो समन्वित व्यक्तियों के साथ इसका अर्थ वितरणात्मक है; हिन्दी में स्वाभाविक रूप से बहुवचन ‘सिर’ दोनों के काटे हुए सिरों को व्यक्त करता है।
- source_word: מֵעֵבֶר לַיַּרְדֵּן
  choice: यरदन के पार से
  rationale: यह पदबंध यरदन की दूसरी ओर से आने को दर्शाता है। ‘पार से’ आधुनिक हिन्दी में स्वाभाविक है और मूल की दृष्टिकोणगत अस्पष्टता बनाए रखता है।
