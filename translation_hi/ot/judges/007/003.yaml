  text: וְ/עַתָּ֗ה קְרָ֨א נָ֜א בְּ/אָזְנֵ֤י הָ/עָם֙ לֵ/אמֹ֔ר מִֽי יָרֵ֣א וְ/חָרֵ֔ד יָשֹׁ֥ב וְ/יִצְפֹּ֖ר מֵ/הַ֣ר הַ/גִּלְעָ֑ד וַ/יָּ֣שָׁב מִן הָ/עָ֗ם עֶשְׂרִ֤ים וּ/שְׁנַ֨יִם֙ אֶ֔לֶף וַ/עֲשֶׂ֥רֶת אֲלָפִ֖ים נִשְׁאָֽרוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/003.yaml
  text: Please proclaim in the hearing of the people[a], saying, ‘Whoever is fearful and trembling, let him return and depart from Mount Gilead.’ Then twenty-two thousand of the people returned[b], and ten thousand remained.
translation:
  language: hi
  text: 'अब लोगों को सुनाकर घोषणा कर: “जो कोई डरा हुआ और काँप रहा है, वह लौट जाए और गिलाद पर्वत[b] से चला जाए[a]।” तब लोगों में से बाईस हज़ार लौट गए और दस हज़ार रह गए।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “चला जाए” के लिए प्रयुक्त इब्रानी क्रिया (וְיִצְפֹּר) दुर्लभ है और उसके अर्थ पर मतभेद है; इसका आशय “जल्दी निकल जाए” या “चुपचाप खिसक जाए” भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: “गिलाद पर्वत” इब्रानी का सीधा अनुवाद है, हालाँकि इस प्रसंग में इसकी भौगोलिक पहचान कठिन है; कुछ लोग इसे अधिक व्यापक अर्थ में “गिलाद का पहाड़ी प्रदेश” समझते हैं।
    reason: cultural_note
lexical_decisions:
- source_word: וְעַתָּה
  choice: अब
  rationale: यह पद पिछले कथन से जुड़ते हुए वर्तमान निर्देश की ओर स्पष्ट संक्रमण करता है; וְעַתָּה का स्वाभाविक हिन्दी रूप यहाँ “अब” है।
- source_word: קְרָא נָא בְּאָזְנֵי הָעָם
  choice: लोगों के सुनते हुए यह घोषणा कर
  rationale: קרא सार्वजनिक घोषणा को दर्शाता है, בְּאָזְנֵי का आशय लोगों को सुनाकर कहना है, और נָא आदेश को विनम्र या आग्रहपूर्ण बनाता है; हिन्दी में पूरा वाक्यांश स्वाभाविक आदेश के रूप में रखा गया है।
- source_word: מִי יָרֵא וְחָרֵד
  choice: जो कोई डरता और काँपता है
  rationale: दोनों पद भय की तीव्रता दिखाते हैं; “डरता और काँपता है” साधारण पाठक के लिए स्पष्ट रहते हुए युग्म को बनाए रखता है।
- source_word: יָשֹׁב
  choice: वह लौट जाए
  rationale: यह निर्देशात्मक जुस्सिव है; “लौट जाए” अनुमति और आदेश के संयुक्त भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְיִצְפֹּר
  choice: और ... से चला जाए
  rationale: यह दुर्लभ और विवादित क्रिया है। प्रसंग में सेना के जमावड़े से हट जाने का सामान्य अर्थ स्पष्ट है, इसलिए मुख्य पाठ में व्यापक अर्थ रखा गया और विशिष्ट संभावनाएँ पादटिप्पणी में दी गई हैं।
- source_word: מֵהַר הַגִּלְעָד
  choice: गिलाद पर्वत से
  rationale: एकवचन הַר का सीधा स्थानवाचक अनुवाद “पर्वत” है। प्रसंग में भूगोल कठिन होने के कारण व्यापक विकल्प पादटिप्पणी में सुरक्षित है।
- source_word: עֶשְׂרִים וּשְׁנַיִם אֶלֶף
  choice: बाईस हज़ार
  rationale: संख्या का मानक आधुनिक हिन्दी रूप।
- source_word: וַעֲשֶׂרֶת אֲלָפִים נִשְׁאָרוּ
  choice: और दस हज़ार रह गए
  rationale: נשאר का सीधा और स्वाभाविक कथात्मक अर्थ “रह गए” है।
