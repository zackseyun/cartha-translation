base_translation:
  language: en
  yaml_path: translation/ot/judges/007/013.yaml
  text: 'When Gideon came[a], behold, a man was telling a dream to his companion. He said, “Look, I dreamed a dream: behold, a round loaf of barley bread was rolling around in the camp of Midian, and it came up to the tent and struck it so that it fell, He turned it upside down, and the tent collapsed.”'
translation:
  language: hi
  text: 'जब गिदोन पहुँचा, तो देखो, एक आदमी अपने साथी को एक सपना सुना रहा था। उसने कहा, “देखो, मैंने एक सपना देखा: जौ की एक गोल रोटी[a] मिद्यान की छावनी में लुढ़क रही थी। वह तंबू तक पहुँची और उससे टकराई, जिससे तंबू गिर पड़ा; उसने उसे उलट दिया, और तंबू ढह गया।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “जौ की एक टिकिया” अथवा “जौ की एक रोटी।” यहाँ प्रयुक्त इब्रानी शब्द दुर्लभ है और संभवतः गोल टिकिया या रोटी को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא גִדְעוֹן
  choice: जब गिदोन वहाँ पहुँचा
  rationale: वाव-क्रम कथा को आगे बढ़ाता है और गिदोन के पहुँचने पर सामने आए दृश्य की समयगत पृष्ठभूमि बनाता है; ‘वहाँ’ प्रसंगगत स्थान को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְהִנֵּה
  choice: तो देखो / देखो
  rationale: यह अव्यय अचानक ध्यान खींचता और दृश्य को सजीव बनाता है। कथन और प्रत्यक्ष वाणी दोनों में ‘देखो’ इसकी शक्ति को सहज आधुनिक हिन्दी में बनाए रखता है।
- source_word: אִישׁ
  choice: एक आदमी
  rationale: इब्रानी शब्द यहाँ एक अनिर्दिष्ट पुरुष के लिए एकवचन और ठोस संज्ञा है।
- source_word: מְסַפֵּר לְרֵעֵהוּ חֲלוֹם
  choice: अपने साथी को एक सपना सुना रहा था
  rationale: कृदन्त जारी क्रिया दर्शाता है; सैनिक प्रसंग में ‘साथी’ רֵעַ को बिना अनावश्यक आत्मीयता जोड़े व्यक्त करता है।
- source_word: הִנֵּה חֲלוֹם חָלַמְתִּי
  choice: देखो, मैंने एक सपना देखा
  rationale: मूल की सजातीय क्रिया-संज्ञा रचना हिन्दी के स्वाभाविक ‘सपना देखा’ में बनी रहती है, जबकि ‘देखो’ कथन का जोर सुरक्षित रखता है।
- source_word: צלול לֶחֶם שְׂעֹרִים
  choice: जौ की एक गोल रोटी
  rationale: दुर्लभ צלול संभवतः गोल टिकिया या रोटी को सूचित करता है। मुख्य पाठ में स्पष्ट और स्वाभाविक विकल्प चुना गया है तथा अनिश्चितता पादटिप्पणी में रखी गई है।
- source_word: מִתְהַפֵּךְ
  choice: लुढ़क रही थी
  rationale: हित्पएल रूप अपने ऊपर पलटते या घूमते हुए आगे बढ़ने की गति दर्शाता है; गोल रोटी के संदर्भ में ‘लुढ़क रही थी’ सहज और चित्रात्मक है।
- source_word: בְּמַחֲנֵה מִדְיָן
  choice: मिद्यान की छावनी में
  rationale: ב का सामान्य स्थानवाचक अर्थ ‘में’ रखा गया है; अनावश्यक रूप से ‘छावनी के भीतर आई’ नहीं बनाया गया।
- source_word: וַיָּבֹא עַד הָאֹהֶל
  choice: वह एक तंबू तक पहुँची
  rationale: עַד किसी सीमा या लक्ष्य तक पहुँचने को दर्शाता है; स्त्रीलिंग ‘वह/पहुँची’ हिन्दी में ‘रोटी’ को विषय बनाए रखता है।
- source_word: וַיַּכֵּהוּ
  choice: उससे टकराई
  rationale: मूल क्रिया प्रहार को व्यक्त करती है; लुढ़कती रोटी के दृश्य में ‘टकराई’ बलपूर्ण संपर्क को स्वाभाविक हिन्दी में बताता है।
- source_word: וַיַּהַפְכֵהוּ לְמַעְלָה
  choice: फिर उसने उसे उलटकर ऊपर की ओर कर दिया
  rationale: मूल में कर्ता और कर्म दोनों पुल्लिंग एकवचन रूपों से व्यक्त हैं, जिससे संदर्भगत संकेत तो मिलता है पर व्याकरणिक अस्पष्टता भी रहती है। सर्वनामात्मक हिन्दी इस तनाव को अनावश्यक रूप से पूरी तरह नहीं सुलझाती।
- source_word: וְנָפַל הָאֹהֶל
  choice: और तंबू ढह गया
  rationale: अंतिम खंड स्पष्ट रूप से तंबू को कर्ता बनाता है; विनाशकारी गिरावट के लिए ‘ढह गया’ स्वाभाविक है।
theological_decisions:
- issue: וַיַּהַפְכֵהוּ में कर्ता और कर्म की पहचान
  choice: ‘फिर उसने उसे उलटकर ऊपर की ओर कर दिया’ द्वारा सर्वनामात्मक अस्पष्टता बनाए रखी गई
  alternative: ‘रोटी ने तंबू को उलट दिया’ या ‘तंबू ने उसे उलट दिया’
  rationale: इब्रानी में क्रिया का कर्ता और प्रत्यय का कर्म दोनों पुल्लिंग एकवचन हैं। प्रसंग सामान्यतः रोटी को कर्ता और तंबू को कर्म समझने की ओर संकेत करता है, पर मूल व्याकरण इसे खुलकर नामित नहीं करता; इसलिए अनावश्यक निर्णायक विस्तार से बचा गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, कथात्मक और गरिमापूर्ण रखी गई है। ‘देखो’ से הִנֵּה की सजीव ध्यानाकर्षक शक्ति व्यक्त हुई है। सरल शब्दावली—‘आदमी,’ ‘साथी,’ ‘छावनी,’ ‘तंबू,’ ‘ढह गया’—सामान्य पाठक के लिए स्पष्ट है, जबकि दुर्लभ शब्द और सर्वनाम-संबंधी वास्तविक अस्पष्टता को दबाया नहीं गया।
