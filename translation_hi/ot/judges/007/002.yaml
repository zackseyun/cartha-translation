source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל גִּדְע֔וֹן רַ֗ב הָ/עָם֙ אֲשֶׁ֣ר אִתָּ֔/ךְ מִ/תִּתִּ֥/י אֶת מִדְיָ֖ן בְּ/יָדָ֑/ם פֶּן יִתְפָּאֵ֨ר עָלַ֤/י יִשְׂרָאֵל֙ לֵ/אמֹ֔ר יָדִ֖/י הוֹשִׁ֥יעָה לִּֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/002.yaml
  text: And Yahweh said to Gideon[a], “The people who are with you are too many for me to give Midian into their hand, lest Israel boast against me, saying[b], ‘My own hand has saved me.’”
translation:
  language: hi
  text: याहवे ने गिदोन से कहा, “मिद्यान को उनके हाथ[a] में सौंपने के लिए तेरे साथ के लोग बहुत अधिक हैं। कहीं ऐसा न हो कि इस्राएल मेरे विरुद्ध अपनी बड़ाई करे और कहे, ‘मेरे अपने हाथ ने मुझे बचाया[b] है।’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘उनके हाथ में’; यहाँ ‘हाथ’ अधिकार या नियंत्रण का इब्रानी मुहावरा है। इसे ‘उनके हाथों में’ भी कहा जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘मुझे छुड़ाया।’ इब्रानी क्रिया का अर्थ ‘बचाना’ या ‘छुड़ाना’ हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: רַב הָעָם אֲשֶׁר אִתָּךְ
  choice: तेरे साथ के लोग बहुत अधिक हैं
  rationale: रַב का प्रसंगानुकूल अर्थ केवल ‘बहुत’ नहीं, बल्कि अपेक्षित कार्य के लिए संख्या का अत्यधिक होना है।
- source_word: מִתִּתִּי אֶת־מִדְיָן בְּיָדָם
  choice: मिद्यान को उनके हाथ में सौंपने के लिए
  rationale: מִן और infinitive construct यहाँ लोगों की संख्या उस कार्य के लिए अत्यधिक होने का भाव देते हैं। ‘हाथ में सौंपना’ अधिकार या नियंत्रण में देने का स्वाभाविक हिन्दी मुहावरा है।
- source_word: יִתְפָּאֵר עָלַי
  choice: मेरे विरुद्ध घमंड करे
  rationale: Hitpael रूप आत्म-प्रशंसा या अपने को ऊँचा करने का भाव देता है, और עַל यहाँ परमेश्वर के विरोध में ऐसा करने को दर्शाता है।
- source_word: יָדִי הוֹשִׁיעָה לִּי
  choice: मेरे अपने हाथ ने मुझे बचाया है
  rationale: एकवचन सामूहिक ‘इस्राएल’ और उसके एकवचन कथन को बनाए रखा गया है। ‘अपने’ आत्मनिर्भरता के दावे को स्वाभाविक हिन्दी में स्पष्ट करता है।
theological_decisions:
- issue: परमेश्वर के नाम का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल इब्रानी में व्यक्तिगत नाम יְהוָה है; इसलिए उसे किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- issue: इस्राएल का सामूहिक एकवचन
  choice: इस्राएल ... कहे, ‘मेरे अपने हाथ ने मुझे बचाया है’
  alternative: इस्राएली ... कहें, ‘हमारे अपने हाथों ने हमें बचाया है’
  rationale: मूल पाठ इस्राएल को एक सामूहिक एकवचन के रूप में प्रस्तुत करता है; उसी दृष्टिकोण और उसकी धर्मवैचारिक धार को सुरक्षित रखा गया है।
- issue: परमेश्वर द्वारा मिद्यान को न सौंपने का कारण
  choice: लोगों की संख्या इस कार्य के लिए बहुत अधिक है, जिससे इस्राएल घमंड कर सकता है
  alternative: परमेश्वर मिद्यान को देने में असमर्थ है
  rationale: वाक्य परमेश्वर की सामर्थ्य की कमी नहीं, बल्कि उसके उद्देश्य—इस्राएल की आत्म-श्लाघा रोकने—को व्यक्त करता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। गिदोन से प्रत्यक्ष संबोधन में ‘तेरे’ रखा गया है, जो प्राचीन कथात्मक संवाद में स्वाभाविक है। इब्रानी के सामूहिक एकवचन और ‘हाथ में सौंपना’ मुहावरे को संरक्षित किया गया है।
