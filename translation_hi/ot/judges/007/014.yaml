base_translation:
  language: en
  yaml_path: translation/ot/judges/007/014.yaml
  text: His companion answered and said[a], “This is nothing other than the sword of Gideon son of Joash, a man of Israel[b]. God has given Midian and the whole camp into his hand.”
translation:
  language: hi
  text: उसके साथी ने उत्तर दिया, “यह और कुछ नहीं, बल्कि योआश के पुत्र गिदोन, इस्राएल के एक पुरुष, की तलवार है। परमेश्वर ने मिद्यान और पूरी छावनी को उसके हाथ में दे दिया है।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: “उसके हाथ में दे दिया है,” अर्थात उसके अधिकार या वश में कर दिया है।'
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַן רֵעֵהוּ וַיֹּאמֶר
  choice: उसके साथी ने उत्तर दिया
  rationale: हिब्रू संवाद-सूत्र का स्वाभाविक आधुनिक हिन्दी रूप; ‘साथी’ सैन्य छावनी के प्रसंग में רֵעַ का उपयुक्त अर्थ देता है।
- source_word: אֵין זֹאת בִּלְתִּי אִם
  choice: यह और कुछ नहीं, बल्कि … है
  rationale: सपने की निर्णायक पहचान बताने वाले प्रबल निषेधात्मक मुहावरे को सहज हिन्दी में सुरक्षित रखता है।
- source_word: חֶרֶב גִּדְעוֹן
  choice: गिदोन की तलवार
  rationale: शाब्दिक प्रतीक को बनाए रखता है; यहाँ तलवार गिदोन द्वारा होने वाली पराजय को सूचित करती है।
- source_word: גִּדְעוֹן בֶּן יוֹאָשׁ אִישׁ יִשְׂרָאֵל
  choice: इस्राएली योआश के पुत्र गिदोन
  rationale: वंश और राष्ट्रीय पहचान दोनों को स्पष्ट, स्वाभाविक हिन्दी में व्यक्त करता है; אִישׁ की पुरुषवाचक पहचान गिदोन नाम और ‘पुत्र’ में पहले ही स्पष्ट है।
- source_word: נָתַן הָאֱלֹהִים
  choice: परमेश्वर ने … कर दिया है
  rationale: हिब्रू पूर्ण क्रिया की उस निश्चितता को व्यक्त करता है जिसमें भविष्य की विजय को निर्णायक रूप से संपन्न माना गया है।
- source_word: בְּיָדוֹ
  choice: उसके हाथ में कर दिया है
  rationale: अधिकार या वश में सौंपने के हिब्रू मुहावरे को हिन्दी के समान मुहावरे द्वारा सुरक्षित रखता है।
- source_word: אֶת מִדְיָן וְאֶת כָּל הַמַּחֲנֶה
  choice: मिद्यान और उसकी पूरी छावनी
  rationale: מִדְיָן को सामूहिक शत्रु के रूप में और הַמַּחֲנֶה को उसकी समूची सैन्य छावनी के रूप में स्वाभाविक ढंग से प्रस्तुत करता है।
theological_decisions:
- issue: נָתַן का काल-पक्ष और विजय की निश्चितता
  choice: परमेश्वर ने … कर दिया है
  alternative: परमेश्वर ने … कर दिया
  rationale: वक्ता सपने का अर्थ बताते हुए विजय को निश्चित और मानो पहले ही संपन्न घोषित करता है; हिन्दी पूर्ण वर्तमान इस बल को व्यक्त करता है, बिना यह तय किए कि घटना कालक्रम में हो चुकी थी।
- issue: אִישׁ יִשְׂרָאֵל की अभिव्यक्ति
  choice: इस्राएली … गिदोन
  alternative: इस्राएल का एक पुरुष … गिदोन
  rationale: ‘इस्राएली’ राष्ट्रीय पहचान को साफ रखता है, जबकि गिदोन का पुरुष होना ‘पुत्र’ से स्पष्ट है; अस्वाभाविक शब्दशः हिन्दी से बचा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; कथात्मक, गरिमापूर्ण और सामान्य पाठक के लिए सहज। मुख्य पाठ में हिब्रू ‘हाथ में देना’ मुहावरा रखा गया है और पादटिप्पणी में उसका आशय स्पष्ट किया गया है।
