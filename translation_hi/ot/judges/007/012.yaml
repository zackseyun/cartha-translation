source:
  edition: WLC
  text: וּ/מִדְיָ֨ן וַ/עֲמָלֵ֤ק וְ/כָל בְּנֵי קֶ֨דֶם֙ נֹפְלִ֣ים בָּ/עֵ֔מֶק כָּ/אַרְבֶּ֖ה לָ/רֹ֑ב וְ/לִ/גְמַלֵּי/הֶם֙ אֵ֣ין מִסְפָּ֔ר כַּ/ח֛וֹל שֶׁ/עַל שְׂפַ֥ת הַ/יָּ֖ם לָ/רֹֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/012.yaml
  text: Midian and Amalek and all the people of the East were lying in the valley as numerous as locusts[a], and their camels were without number[b], as the sand on the seashore in abundance.
translation:
  language: hi
  text: मिद्यान, अमालेक और पूर्व के सभी लोग[a] घाटी में टिड्डियों के समान बड़ी संख्या में फैले पड़े थे[b]। उनके ऊँटों की भी कोई गिनती न थी; वे समुद्र-तट की रेत के समान बहुत अधिक थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप से: “पूर्व के पुत्र।”'
    reason: lexical_alternative
  - marker: b
    text: या “पड़े हुए थे” अथवा “घाटी में पड़ाव डाले हुए थे”; हिब्रू कृदंत का शाब्दिक अर्थ “गिरते/पड़े हुए” है और यहाँ वह पड़ाव डाले फैली हुई सेना का वर्णन करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹפְלִים
  choice: फैले पड़े थे
  rationale: नפל का कृदंत शाब्दिक रूप से ‘गिरते/पड़े हुए’ का बोध देता है। यहाँ सैन्य पड़ाव के संदर्भ में ‘फैले पड़े थे’ सेना के घाटी में डेरा डाले फैले होने की तस्वीर को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: בָּעֵמֶק
  choice: घाटी में
  rationale: עֵמֶק का सामान्य और इस प्रसंग में सीधा अर्थ ‘घाटी’ है।
- source_word: בְּנֵי קֶדֶם
  choice: पूर्व के सभी लोग
  rationale: शाब्दिक अभिव्यक्ति ‘पूर्व के पुत्र’ है, पर यह पूर्व दिशा के जातीय समूहों के लिए सामूहिक भौगोलिक पद है; ‘पूर्व के सभी लोग’ आधुनिक हिन्दी में इसका स्पष्ट और स्वाभाविक अर्थ देता है।
- source_word: כָּאַרְבֶּה לָרֹב
  choice: टिड्डियों के समान बड़ी संख्या में
  rationale: यह उपमा सेना की अत्यधिक संख्या की तुलना टिड्डियों के झुंड से करती है और לָרֹב की बहुलता को स्पष्ट रखती है।
- source_word: לִגְמַלֵּיהֶם
  choice: उनके ऊँटों
  rationale: संज्ञा और उसके तृतीय पुरुष बहुवचन संबंधसूचक प्रत्यय का सीधा हिन्दी रूप।
- source_word: אֵין מִסְפָּר
  choice: कोई गिनती न थी
  rationale: हिब्रू का शाब्दिक भाव ‘कोई संख्या नहीं’ है; यह हिन्दी मुहावरा अगणनीय संख्या का अतिशयोक्तिपूर्ण बल सुरक्षित रखता है।
- source_word: כַּחוֹל שֶׁעַל שְׂפַת הַיָּם
  choice: समुद्र-तट की रेत के समान
  rationale: असंख्यता के लिए प्रयुक्त मानक हिब्रू उपमा का स्वाभाविक हिन्दी रूप।
- source_word: לָרֹב
  choice: बहुत अधिक थे
  rationale: अंतिम לָרֹב संख्या की प्रचुरता पर दोबारा जोर देता है; इसे अनावश्यक समझकर हटाने के बजाय हिन्दी में स्पष्ट रूप से रखा गया है।
- source_word: וּמִדְיָן וַעֲמָלֵק וְכָל בְּנֵי קֶדֶם
  choice: मिद्यान, अमालेक और पूर्व के सभी लोग
  rationale: आरंभिक ו कथा की कड़ी जोड़ता है। हिन्दी वाक्य-प्रवाह में अलग ‘अब’ जोड़े बिना नामों के बीच ‘और’ से इसका संबंध स्वाभाविक रूप से व्यक्त होता है।
