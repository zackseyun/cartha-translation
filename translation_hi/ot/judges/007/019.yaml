    reason: cultural_note
  revision_rationale: The revision retains the draft's sound treatment of the watch-change clause while replacing the culturally misleading “नरसिंगे” with the source-faithful generic “सींग.” It also makes the jar phrase idiomatic and explicitly preserves their being held in the men's hands. No doctrinal or historical interpretation has been added.
