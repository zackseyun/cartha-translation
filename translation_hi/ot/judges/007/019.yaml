source:
  edition: WLC
  text: וַ/יָּבֹ֣א גִ֠דְעוֹן וּ/מֵאָה אִ֨ישׁ אֲשֶׁר אִתּ֜/וֹ בִּ/קְצֵ֣ה הַֽ/מַּחֲנֶ֗ה רֹ֚אשׁ הָ/אַשְׁמֹ֣רֶת הַ/תִּֽיכוֹנָ֔ה אַ֛ךְ הָקֵ֥ם הֵקִ֖ימוּ אֶת הַ/שֹּֽׁמְרִ֑ים וַֽ/יִּתְקְעוּ֙ בַּ/שּׁ֣וֹפָר֔וֹת וְ/נָפ֥וֹץ הַ/כַּדִּ֖ים אֲשֶׁ֥ר בְּ/יָדָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/019.yaml
  text: So Gideon and the hundred men who were with him came to the edge of the camp at the beginning of the middle watch[a], just as they had posted the watchmen[c][b]; and they blew the trumpets and smashed the jars that were in their hands.
translation:
  language: hi
  text: तब गिदोन और उसके साथ के सौ पुरुष छावनी के किनारे, मध्य पहर[a] के आरम्भ में, पहुँचे—जब पहरेदार अभी-अभी तैनात किए गए थे। उन्होंने सींग[b] फूँके और अपने हाथों में पकड़े घड़े चकनाचूर कर दिए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात रात का मध्य पहर; इसे ‘रात का दूसरा पहर’ भी कहा जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: 'इब्रानी: शोफ़ार; संकेत देने के लिए फूँका जाने वाला सींग।'
    reason: cultural_note
lexical_decisions:
- source_word: בִּקְצֵה הַמַּחֲנֶה
  choice: छावनी के किनारे
  rationale: קָצֶה छोर या किनारे को दर्शाता है; यह हिन्दी में स्थानिक अर्थ को सहज और स्पष्ट रखता है।
- source_word: רֹאשׁ הָאַשְׁמֹרֶת הַתִּיכוֹנָה
  choice: मध्य पहर आरम्भ ही हुआ था
  rationale: רֹאשׁ यहाँ समयावधि के आरम्भ का मुहावरेदार संकेत है और אַשְׁמֹרֶת रात के पहरे की अवधि है। 'मध्य पहर' संक्षिप्त, स्वाभाविक और प्रसंगानुकूल है।
- source_word: אַךְ הָקֵם הֵקִימוּ אֶת־הַשֹּׁמְרִים
  choice: पहरेदार अभी-अभी तैनात किए गए थे
  rationale: אַךְ तात्कालिकता व्यक्त करता है, जबकि infinitive absolute के साथ Hiphil क्रिया पहरेदारों को नियुक्त या तैनात करने की कार्रवाई पर बल देती है। कर्मवाच्य हिन्दी मूल की अस्पष्ट कर्तृता को सुरक्षित रखती है।
- source_word: וַיִּתְקְעוּ בַּשּׁוֹפָרוֹת
  choice: उन्होंने नरसिंगे फूँके
  rationale: שׁוֹפָר संकेत देने के लिए फूँका जाने वाला पशु-सींग है। 'नरसिंगा' आधुनिक हिन्दी पाठक के लिए सामान्य 'तुरही' से अधिक ठोस सांस्कृतिक समतुल्य है, पर विशेष सामग्री को मुख्य पाठ में अनावश्यक रूप से निश्चित नहीं करता।
- source_word: וְנָפוֹץ הַכַּדִּים
  choice: घड़े चकनाचूर कर दिए
  rationale: נפץ बलपूर्वक तोड़ने या चकनाचूर करने का अर्थ देता है; כַּד के लिए 'घड़ा' सहज आधुनिक हिन्दी है और मिट्टी की सामग्री मूल में स्पष्ट न होने के कारण नहीं जोड़ी गई।
- source_word: אֲשֶׁר בְּיָדָם
  choice: अपने हाथों के
  rationale: यह उन घड़ों को पहचानता है जिन्हें वे हाथ में लिए हुए थे; संक्षिप्त हिन्दी प्रयोग मूल आशय को बनाए रखता है।
