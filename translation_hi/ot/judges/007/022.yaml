  text: וַֽ/יִּתְקְעוּ֮ שְׁלֹשׁ מֵא֣וֹת הַ/שּׁוֹפָרוֹת֒ וַ/יָּ֣שֶׂם יְהוָ֗ה אֵ֣ת חֶ֥רֶב אִ֛ישׁ בְּ/רֵעֵ֖/הוּ וּ/בְ/כָל הַֽ/מַּחֲנֶ֑ה וַ/יָּ֨נָס הַֽ/מַּחֲנֶ֜ה עַד בֵּ֤ית הַשִּׁטָּה֙ צְֽרֵרָ֔תָ/ה עַ֛ד שְׂפַת אָבֵ֥ל מְחוֹלָ֖ה עַל טַבָּֽת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/022.yaml
  text: When the three hundred trumpets were blown[a], Yahweh set every man's sword against his companion and against the whole camp, and the camp fled as far as Beth-shittah toward Zererah, as far as the edge of Abel-meholah[d][c][b], by Tabbath.
translation:
  language: hi
  text: जब उन तीन सौ जनों ने नरसिंगे फूँके[a], तब याहवे ने हर एक की तलवार उसके साथी के विरुद्ध कर दी, और ऐसा सारी छावनी में हुआ[b]। तब छावनी बेत-शित्ताह तक, सरेराह की ओर, आबेल-महोला[c] के किनारे[d] तक, तब्बात के पास भागी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जब तीन सौ नरसिंगे फूँके गए।” इब्रानी שׁוֹפָרוֹת सींग से बने फूँक-वाद्यों को दर्शाता है, जो प्रायः मेढ़ों के सींगों से बनाए जाते थे।
    reason: व्याकरणिक और शब्दार्थगत विकल्प
  - marker: b
    text: या, “हर एक की तलवार उसके साथी और सारी छावनी के विरुद्ध कर दी।” इब्रानी वाक्यांश का अर्थ यह भी हो सकता है कि प्रत्येक व्यक्ति की तलवार साथी के विरुद्ध हुई और विरोध पूरी छावनी तक फैल गया।
    reason: वैकल्पिक वाक्य-संबंध
  - marker: c
    text: बेत-शित्ताह, सरेराह, आबेल-महोला और तब्बात उस मार्ग के स्थान-नाम हैं जिस पर सेना भागी।
    reason: भौगोलिक टिप्पणी
  - marker: d
    text: “किनारे” का अनुवाद “तट” या “सीमा” भी किया जा सकता है।
    reason: शब्दार्थगत विकल्प
lexical_decisions:
- source_word: וַיִּתְקְעוּ ... הַשּׁוֹפָרוֹת
  choice: उन तीन सौ जनों ने नरसिंगे फूँके
  rationale: תָּקַע के सामान्य सक्रिय अर्थ और प्रसंग के आधार पर तीन सौ योद्धाओं को कर्ता समझना स्वाभाविक है। שׁוֹפָר सींग से बना फूँक-वाद्य है; ‘नरसिंगा’ आधुनिक हिन्दी में इस चित्र को ‘तुरही’ से अधिक स्पष्ट रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी लिपि में लिप्यंतरित किया गया है।
- source_word: וַיָּשֶׂם ... אֵת חֶרֶב אִישׁ בְּרֵעֵהוּ
  choice: हर एक पुरुष की तलवार उसके साथी के विरुद्ध कर दी
  rationale: यह चयन इब्रानी के वितरणात्मक אִישׁ और तलवार को साथी के विरुद्ध किए जाने की सजीव छवि दोनों को बनाए रखता है।
- source_word: וּבְכָל הַמַּחֲנֶה
  choice: और सारी छावनी के विरुद्ध
  rationale: בְּ को इस प्रसंग में विरोधात्मक रूप से लिया गया है, पर ‘सारी छावनी में’ भी व्याकरणतः संभव है; विकल्प को पादटिप्पणी में रखा गया है।
- source_word: וַיָּנָס הַמַּחֲנֶה
  choice: वह छावनी ... भागी
  rationale: מַחֲנֶה को ‘छावनी’ रखा गया है; यहाँ यह सामूहिक रूप से उसमें मौजूद सेना को दर्शाता है।
- source_word: עַד בֵּית הַשִּׁטָּה צְרֵרָתָה
  choice: बेत-शित्ताह से सरेराह की ओर
  rationale: עַד गंतव्य-सीमा और צְרֵרָתָה का दिशासूचक प्रत्यय मार्ग को व्यक्त करते हैं। हिन्दी वाक्य में ‘से ... की ओर’ उस मार्गगत संबंध को स्वाभाविक ढंग से रखता है।
- source_word: שְׂפַת אָבֵל מְחוֹלָה
  choice: आबेल-महोला के किनारे
  rationale: שָׂפָה का मूल अर्थ होंठ/किनारा है। ‘किनारा’ नदी-तट या भू-सीमा में से किसी एक को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: עַל טַבָּת
  choice: तब्बात के पास
  rationale: स्थान-नाम के साथ עַל यहाँ निकटता या स्थानगत संबंध बता सकता है; ‘के पास’ इस अस्पष्टता को सहज हिन्दी में बचाता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम का प्रयोग करता है। ‘याहवे’ नाम को नाम के रूप में सुरक्षित रखता है, जबकि ‘प्रभु’ उसे उपाधि में बदल देता और ‘यहोवा’ बाद की मिश्रित उच्चारण-परंपरा को दर्शाता है।
- issue: छावनी में फैली पारस्परिक हिंसा का वाक्य-संबंध
  choice: हर एक पुरुष की तलवार उसके साथी और सारी छावनी के विरुद्ध कर दी
  alternative: हर एक पुरुष की तलवार उसके साथी के विरुद्ध कर दी, और ऐसा सारी छावनी में हुआ
  rationale: मुख्य पाठ בְּרֵעֵהוּ और וּבְכָל הַמַּחֲנֶה को समानांतर विरोधात्मक वाक्यांश मानता है, लेकिन दूसरा वाक्यांश घटना के पूरे शिविर में फैलने का स्थान भी बता सकता है; इस तनाव को पादटिप्पणी में सुरक्षित रखा गया है।
