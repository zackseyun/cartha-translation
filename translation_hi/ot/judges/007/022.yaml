  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए सुबोध रखी गई है। युद्ध-संदर्भ में ‘नरसिंगे’, ‘तलवार’, ‘छावनी’ और ‘भागी’ जैसे ठोस शब्द लिए गए हैं। स्थान-नाम मूल इब्रानी के निकट देवनागरी में लिप्यंतरित हैं; अस्पष्ट भौगोलिक और वाक्यगत संबंधों को पादटिप्पणियों में खुला रखा गया है।
