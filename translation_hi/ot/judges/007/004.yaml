  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל גִּדְע֗וֹן עוֹד֮ הָ/עָ֣ם רָב֒ הוֹרֵ֤ד אוֹתָ/ם֙ אֶל הַ/מַּ֔יִם וְ/אֶצְרְפֶ֥/נּוּ לְ/ךָ֖ שָׁ֑ם וְ/הָיָ֡ה אֲשֶׁר֩ אֹמַ֨ר אֵלֶ֜י/ךָ זֶ֣ה יֵלֵ֣ךְ אִתָּ֗/ךְ ה֚וּא יֵלֵ֣ךְ אִתָּ֔/ךְ וְ/כֹ֨ל אֲשֶׁר אֹמַ֜ר אֵלֶ֗י/ךָ זֶ֚ה לֹא יֵלֵ֣ךְ עִמָּ֔/ךְ ה֖וּא לֹ֥א יֵלֵֽךְ־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/004.yaml
  text: 'Then the LORD said to Gideon, “The people are still too many. Bring them down to the water, and there I will test them for you. And this is what will happen: anyone of whom I say to you, ‘This one shall go with you,’ he shall go with you; but anyone of whom I say to you, ‘This one shall not go with you,’ he shall not go.”'
translation:
  language: hi
  text: तब यहोवा ने गिदोन से कहा, “लोग अब भी बहुत अधिक हैं। उन्हें जल तक नीचे ले जा; वहीं मैं तेरे लिए उन्हें परखूँगा। फिर ऐसा होगा कि जिसके विषय में मैं तुझसे कहूँ, ‘यह तेरे साथ जाएगा,’ वही तेरे साथ जाएगा; और जिसके विषय में मैं तुझसे कहूँ, ‘यह तेरे साथ नहीं जाएगा,’ वह नहीं जाएगा।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत नाम को प्रचलित हिन्दी रूप में रखा गया है, न कि सामान्य उपाधि से बदला गया।
- source_word: הָעָם רָב
  choice: लोग अब भी बहुत अधिक हैं
  rationale: רָב का यहाँ सन्दर्भानुकूल अर्थ संख्या में अधिक होना है; עוֹד को “अब भी” से व्यक्त किया गया।
- source_word: וְאֶצְרְפֶנּוּ
  choice: मैं ... उन्हें परखूँगा
  rationale: צרף का मूल भाव शोधन/जाँच है; इस प्रसंग में चयन के लिए जाँचने का स्वाभाविक हिन्दी रूप “परखना” है।
- source_word: לְךָ
  choice: तेरे लिए
  rationale: हितार्थक दातृवाचक अर्थ को स्पष्ट रखते हुए मूल की सम्भावित सूक्ष्मता सुरक्षित की गई।
- source_word: זֶה
  choice: यह
  rationale: चयन किए जा रहे प्रत्येक व्यक्ति की ओर संकेत करने वाले एकवचन प्रदर्शनवाचक को यथावत रखा गया।
theological_decisions:
- issue: ईश्वरीय नाम का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल में विशिष्ट नाम יהוה है; उसे सामान्य उपाधि में बदलने के बजाय हिन्दी में परिचित लिप्यंतरण दिया गया।
- issue: मनुष्यों के चयन में परमेश्वर की भूमिका
  choice: “मैं ... उन्हें परखूँगा” और “जिसके विषय में मैं तुझसे कहूँ”
  alternative: गिदोन स्वयं उन्हें जाँचेगा या चुनेगा
  rationale: मूल पाठ चयनकारी कथन और परख दोनों को यहोवा की क्रिया बताता है; अनुवाद इस बल को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण और कथात्मक रूप अपनाया गया है। प्राचीन संवाद की एकवचन निकटता बनाए रखने के लिए “तेरे/तुझसे” रखा गया है; वाक्य-विन्यास को सहज बनाया गया, पर मूल की पुनरुक्ति और चयनात्मक विरोध को सुरक्षित रखा गया है।
