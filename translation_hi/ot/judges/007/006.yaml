  text: וַ/יְהִ֗י מִסְפַּ֞ר הַֽ/מֲלַקְקִ֤ים בְּ/יָדָ/ם֙ אֶל פִּי/הֶ֔ם שְׁלֹ֥שׁ מֵא֖וֹת אִ֑ישׁ וְ/כֹל֙ יֶ֣תֶר הָ/עָ֔ם כָּרְע֥וּ עַל בִּרְכֵי/הֶ֖ם לִ/שְׁתּ֥וֹת מָֽיִם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/006.yaml
  text: And the number of those lapping with their hand to their mouth was three hundred men[a], but all the rest of the people knelt on their knees to drink water.
translation:
  language: hi
  text: और जो लोग अपने हाथ से मुँह तक पानी ले जाकर उसे चाटते थे[a], उनकी गिनती तीन सौ पुरुष थी; पर बाकी सब लोग पानी पीने के लिए घुटनों के बल झुक गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हाथ से मुँह तक।” इब्रानी पदबंध इस बात पर बल देता है कि वे सीधे झुककर पीने के बजाय हाथ से पानी उठाकर मुँह तक लाए।
    reason: lexical_alternative
lexical_decisions:
- source_word: מִסְפַּר
  choice: गिनती
  rationale: यह उपसमूह की संख्या बताने वाला सामान्य संज्ञा-पद है; ‘गिनती’ आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: הַמֲלַקְקִים
  choice: चपचपाकर पीते थे
  rationale: לקק पानी पीने की जीवंत क्रिया को चित्रित करता है। केवल ‘पीते’ कहने की अपेक्षा यह मूल के विशिष्ट बिंब को बनाए रखता है।
- source_word: בְּיָדָם אֶל־פִּיהֶם
  choice: अपने हाथ से पानी मुँह तक ले जाकर
  rationale: यह वितरणात्मक एकवचन का स्वाभाविक हिन्दी रूप है और स्पष्ट करता है कि प्रत्येक व्यक्ति हाथ से पानी उठाकर मुँह तक लाया।
- source_word: שְׁלֹשׁ מֵאוֹת אִישׁ
  choice: तीन सौ पुरुष
  rationale: सैन्य प्रसंग में אִישׁ के लिए ‘पुरुष’ उपयुक्त और लिंग-सटीक है।
- source_word: וְכֹל יֶתֶר הָעָם
  choice: पर बाकी सब लोग
  rationale: यद्यपि ו का मूल अर्थ ‘और’ है, यहाँ दोनों समूहों का विरोध स्पष्ट है; ‘पर’ हिन्दी में उस संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: כָּרְעוּ עַל בִּרְכֵיהֶם
  choice: घुटनों के बल झुक गए
  rationale: यह घुटने टेककर नीचे झुकने की शारीरिक मुद्रा को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לִשְׁתּוֹת מָיִם
  choice: पानी पीने के लिए
  rationale: उद्देश्यसूचक infinitive और मूल में स्पष्ट ‘पानी’ दोनों सुरक्षित रहते हैं।
