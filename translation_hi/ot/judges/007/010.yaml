- source_word: וְאִם
  choice: परन्तु यदि
  rationale: यह पिछले आदेश के साथ एक शर्त जोड़ता है और प्रसंग में हल्का विरोध भी व्यक्त करता है।
- source_word: יָרֵא אַתָּה
  choice: तुम ... डरते हो
  rationale: यह गिदोन की वर्तमान भयभीत अवस्था को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: לָרֶדֶת ... רֵד
  choice: नीचे जाने ... नीचे जाओ
  rationale: मूल में ירד की पुनरावृत्ति है; उसे अर्थ और बल बनाए रखने के लिए हिन्दी में भी दोहराया गया है।
- source_word: וּפֻרָה
  choice: पूरा के साथ
  rationale: संयोजक ו यहाँ पूरा के गिदोन के साथ जाने का भाव देता है; हिन्दी में ‘के साथ’ स्वाभाविक है।
- source_word: נַעַרְךָ
  choice: अपने सेवक
  rationale: נַעַר का अर्थ युवक, सेवक या परिचर हो सकता है। इस प्रसंग में पूरा गिदोन के अधीन साथ जाने वाला व्यक्ति है, इसलिए ‘सेवक’ स्वाभाविक और प्रसंगानुकूल है।
- source_word: אֶל הַמַּחֲנֶה
  choice: छावनी में
  rationale: אֶל का मूल भाव ‘की ओर/तक’ है; अगले पद के अनुसार गिदोन छावनी के किनारे तक पहुँचता है। हिन्दी में गति के साथ ‘छावनी में नीचे जाओ’ सहज है, यद्यपि ‘छावनी तक’ अधिक औपचारिक विकल्प है।
