translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। स्थान-नामों को प्रचलित हिन्दी बाइबलीय शैली के अनुरूप लिप्यंतरित किया गया है। एकवचन स्थानिक सर्वनाम को मूल इब्रानी के अनुसार ‘उससे’ रखा गया है।
