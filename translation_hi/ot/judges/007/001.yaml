  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יַּשְׁכֵּ֨ם יְרֻבַּ֜עַל ה֣וּא גִדְע֗וֹן וְ/כָל הָ/עָם֙ אֲשֶׁ֣ר אִתּ֔/וֹ וַֽ/יַּחֲנ֖וּ עַל עֵ֣ין חֲרֹ֑ד וּ/מַחֲנֵ֤ה מִדְיָן֙ הָיָה ל֣/וֹ מִ/צָּפ֔וֹן מִ/גִּבְעַ֥ת הַ/מּוֹרֶ֖ה בָּ/עֵֽמֶק־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/001.yaml
  text: Then Jerubbaal (that is[a], Gideon) and all the people who were with him rose early and camped by the spring of Harod. The camp of Midian was north of him, by the hill of Moreh in the valley.
translation:
  language: hi
  text: तब यरुब्बाल, अर्थात् गिदोन, और उसके साथ के सब लोग तड़के उठे और हरोद के सोते[a] के पास डेरा डाला। मिद्यान का पड़ाव उससे उत्तर की ओर, घाटी में मोरे की पहाड़ी के पास था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “एन-हरोद के पास।” इब्रानी नाम में ‘सोता’ शब्द शामिल है।
    reason: स्थान-नाम को लिप्यंतरित करने और उसके अर्थ का अनुवाद करने—दोनों सम्भव प्रस्तुतियों को सुरक्षित रखना।
lexical_decisions:
- source_word: וַיַּשְׁכֵּם
  choice: तड़के उठे
  rationale: हिफ़ील रूप का सामान्य अर्थ ‘बहुत सुबह उठना’ है; ‘तड़के उठे’ समय-संबंधी भाव को स्वाभाविक आधुनिक हिन्दी में रखता है।
- source_word: יְרֻבַּעַל הוּא גִדְעוֹן
  choice: यरुब्बाल, अर्थात् गिदोन
  rationale: הוּא यहाँ दोनों नामों की पहचान स्पष्ट करता है; ‘अर्थात्’ इस व्याख्यात्मक संबंध को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וְכָל הָעָם אֲשֶׁר אִתּוֹ
  choice: और उसके साथ के सब लोग
  rationale: עָם का व्यापक अर्थ ‘लोग’ है। प्रसंग सैनिक है, फिर भी मूल में विशिष्ट सैन्य शब्द न होने के कारण ‘सैनिक’ नहीं जोड़ा गया।
- source_word: וַיַּחֲנוּ
  choice: डेरा डाला
  rationale: חנה का अर्थ पड़ाव डालना या शिविर लगाना है; ‘डेरा डाला’ वर्तमान हिन्दी में सहज और स्पष्ट है।
- source_word: עַל עֵין חֲרֹד
  choice: हरोद के सोते के पास
  rationale: עֵין जल-स्रोत या सोते को दर्शाता है और स्थान-नाम का अंग भी हो सकता है। अर्थ का अनुवाद पाठक को स्थल की प्रकृति बताता है; स्थान-नाम वाला विकल्प पादटिप्पणी में सुरक्षित है।
- source_word: וּמַחֲנֵה מִדְיָן
  choice: मिद्यान का पड़ाव
  rationale: समास का सीधा अर्थ ‘मिद्यान का पड़ाव’ है; मूल में जातिवाचक ‘मिद्यानी’ स्पष्ट रूप से नहीं है।
- source_word: הָיָה לוֹ מִצָּפוֹן
  choice: उससे उत्तर की ओर ... था
  rationale: एकवचन לוֹ को बनाए रखा गया है और उसका संदर्भ प्रधान पात्र गिदोन से समझा गया है; इसे बहुवचन ‘उनसे’ बनाकर मूल की संख्या को समतल नहीं किया गया।
- source_word: מִגִּבְעַת הַמּוֹרֶה
  choice: मोरे की पहाड़ी के पास
  rationale: यहाँ מִן बड़े स्थानिक वर्णन में निकटता सूचित करता है; ‘के पास’ हिन्दी में स्थल-संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: בָּעֵמֶק
  choice: घाटी में
  rationale: עֵמֶק सामान्यतः घाटी को दर्शाता है; ‘घाटी में’ स्थलाकृति का सीधा अनुवाद है।
