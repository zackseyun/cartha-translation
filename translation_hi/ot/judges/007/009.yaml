  text: וַֽ/יְהִי֙ בַּ/לַּ֣יְלָה הַ/ה֔וּא וַ/יֹּ֤אמֶר אֵלָי/ו֙ יְהוָ֔ה ק֖וּם רֵ֣ד בַּֽ/מַּחֲנֶ֑ה כִּ֥י נְתַתִּ֖י/ו בְּ/יָדֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/009.yaml
  text: And it happened that night that Yahweh said to him[a], “Arise, go down into the camp, for I have given it into your hand.”
translation:
  language: hi
  text: उसी रात ऐसा हुआ कि याहवे ने उससे कहा, “उठ, छावनी में उतर जा, क्योंकि मैंने उसे तेरे हाथ में दे दिया है[a]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘तेरे हाथ में दे दिया है’ इब्रानी मुहावरा है, जिसका अर्थ है किसी को तेरे अधिकार या वश में सौंप दिया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַּלַּיְלָה הַהוּא
  choice: उसी रात ऐसा हुआ
  rationale: यह इब्रानी कथात्मक सूत्र एक नए दृश्य का आरम्भ करता है। यह अनुवाद उसके कथात्मक कार्य को बनाए रखते हुए आधुनिक हिन्दी में स्वाभाविक है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में परमेश्वर का विशिष्ट नाम है; इसलिए किसी उपाधि से बदलने के बजाय उसका हिन्दी लिप्यंतरण किया गया है।
- source_word: קוּם רֵד
  choice: उठ, ... उतर जा
  rationale: दोनों आज्ञार्थक क्रियाओं की तात्कालिकता और नीचे की ओर जाने की स्थानिक धारणा को स्पष्ट एवं स्वाभाविक हिन्दी में रखा गया है।
- source_word: בַּמַּחֲנֶה
  choice: छावनी में
  rationale: गति सूचक ‘उतर जा’ के साथ בּ यहाँ छावनी के भीतर जाने का भाव देता है; ‘के विरुद्ध’ कहना सैन्य आशय को आवश्यकता से अधिक स्पष्ट कर देता।
- source_word: נְתַתִּיו
  choice: मैंने उसे ... कर दिया है
  rationale: पुल्लिंग एकवचन प्रत्यय निकटवर्ती ‘छावनी’ की ओर संकेत करता है, जो प्रसंग में शत्रु-सेना का प्रतिनिधित्व करती है। पूर्ण क्रिया को वर्तमान परिणाम सहित पूर्ण कार्य के रूप में व्यक्त किया गया है।
- source_word: בְּיָדֶךָ
  choice: तेरे हाथ में
  rationale: मूल इब्रानी मुहावरे और उसकी सजीव छवि को बनाए रखा गया है; इसका अर्थ किसी को अधिकार या वश में सौंपना है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल में चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम सीधे प्रयुक्त हुआ है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और नाम को उपाधि में नहीं बदलता।
- issue: नְתַתִּיו की पूर्ण क्रिया और विजय की निश्चितता
  choice: मैंने उसे तेरे हाथ में कर दिया है
  alternative: मैं उसे तेरे हाथ में कर दूँगा
  rationale: इब्रानी पूर्ण रूप दैवी निर्णय को पहले से सम्पन्न और सुनिश्चित रूप में प्रस्तुत करता है। भविष्यकाल करने से मूल की यह तनावपूर्ण निश्चितता कम हो जाती।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। गिदोन को संबोधन में एकवचन ‘तू’ के रूप ‘उठ’, ‘उतर जा’ और ‘तेरे’ मूल की सीधी, व्यक्तिगत आज्ञा को व्यक्त करते हैं।
