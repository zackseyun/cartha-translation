  text: וַ/יּ֥וֹרֶד אֶת הָ/עָ֖ם אֶל הַ/מָּ֑יִם וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל גִּדְע֗וֹן כֹּ֣ל אֲשֶׁר יָלֹק֩ בִּ/לְשׁוֹנ֨/וֹ מִן הַ/מַּ֜יִם כַּ/אֲשֶׁ֧ר יָלֹ֣ק הַ/כֶּ֗לֶב תַּצִּ֤יג אוֹת/וֹ֙ לְ/בָ֔ד וְ/כֹ֛ל אֲשֶׁר יִכְרַ֥ע עַל בִּרְכָּ֖י/ו לִ/שְׁתּֽוֹת־־ס־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/005.yaml
  text: So he brought the people down to the water[a], and Yahweh said to Gideon, “Everyone who laps the water with his tongue, as a dog laps, you shall set apart by himself; likewise everyone who kneels on his knees to drink.”
translation:
  language: hi
  text: तब वह लोगों को नीचे पानी तक ले गया। याहवे ने गिदोन से कहा, “जो कोई अपनी जीभ से पानी चाटे, जैसे कुत्ता चाटता है, उसे अलग खड़ा करना[a]; और जो कोई पीने के लिए घुटनों के बल झुके, उसे भी अलग खड़ा करना।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसे अलग रखना”; क्रिया का अर्थ किसी को अलग स्थान पर खड़ा करना या तैनात करना भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹרֶד
  choice: नीचे ... ले गया
  rationale: 'हिफ़ील रूप कारणवाचक है: गिदोन ने लोगों को पानी तक नीचे पहुँचाया। यह प्रयोग उस कारणवाचक भाव को स्वाभाविक हिन्दी में बनाए रखता है।'
- source_word: הָעָם
  choice: लोगों
  rationale: עַם सामान्य सामूहिक संज्ञा है। प्रसंग सैनिकों का है, फिर भी मूल पाठ के व्यापक शब्द को बनाए रखने के लिए ‘लोगों’ चुना गया।
- source_word: אֶל הַמָּיִם
  choice: पानी के पास
  rationale: אֶל दिशा या गंतव्य बताता है; हिन्दी में ‘पानी के पास’ दृश्य को स्वाभाविक रूप से व्यक्त करता है, बिना यह कहे कि वे पानी के भीतर गए।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार-अक्षरीय परमेश्वर-नाम को किसी उपाधि से बदलने के बजाय हिन्दी में उसके प्रचलित ध्वन्यात्मक रूप में रखा गया है।
- source_word: כֹּל אֲשֶׁר יָלֹק בִּלְשׁוֹנוֹ מִן הַמַּיִם
  choice: जो कोई ... अपनी जीभ से पानी चाटकर पिए
  rationale: ‘जो कोई’ वितरक अर्थ देता है; ‘अपनी जीभ से’ एकवचन प्रत्यय को व्यक्त करता है। ‘चाटकर पिए’ कुत्ते के पानी पीने की ठोस छवि को सहज हिन्दी में बनाए रखता है।
- source_word: כַּאֲשֶׁר יָלֹק הַכֶּלֶב
  choice: कुत्ते के समान
  rationale: स्पष्ट उपमा को संक्षिप्त और स्वाभाविक हिन्दी में रखा गया है; यहाँ निश्चित लेख जातिगत उदाहरण का संकेत देता है।
- source_word: תַּצִּיג אוֹתוֹ לְבָד
  choice: उसे अलग खड़ा करना
  rationale: יצג का हिफ़ील रूप किसी को स्थान पर खड़ा करने या तैनात करने और לְבָד अलगाव का भाव देता है। चुना हुआ वाक्यांश छँटाई की क्रिया को स्पष्ट रखता है।
- source_word: וְכֹל אֲשֶׁר יִכְרַע עַל בִּרְכָּיו לִשְׁתּוֹת
  choice: और जो कोई पीने के लिए घुटनों के बल झुके
  rationale: ‘घुटनों के बल झुके’ כרע और ‘अपने घुटनों पर’ के ठोस भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत नाम है। ‘याहवे’ उसका ध्वन्यात्मक रूप सुरक्षित रखता है और उसे किसी उपाधि से नहीं बदलता।
- issue: दूसरे समूह के लिए आदेश की पूर्ति
  choice: उसे भी अलग खड़ा करना
  alternative: मूल की तरह केवल ‘और जो कोई ... झुके’ छोड़ देना
  rationale: इब्रानी में दूसरे समूह के बाद क्रिया लुप्त है और पहले आदेश से समझी जाती है। हिन्दी में ‘भी अलग खड़ा करना’ जोड़ने से वही निहित आदेश स्पष्ट होता है, कोई नई व्याख्या नहीं जुड़ती।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘पानी चाटकर पिए’ दृश्यात्मक उपमा को बनाए रखता है, जबकि दूसरे खंड में निहित आदेश को हिन्दी की स्पष्टता के लिए दोहराया गया है।
