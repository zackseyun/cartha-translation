source:
  edition: WLC
  text: וַ/יְהִי֩ כִ/שְׁמֹ֨עַ גִּדְע֜וֹן אֶת מִסְפַּ֧ר הַ/חֲל֛וֹם וְ/אֶת שִׁבְר֖/וֹ וַ/יִּשְׁתָּ֑חוּ וַ/יָּ֨שָׁב֙ אֶל מַחֲנֵ֣ה יִשְׂרָאֵ֔ל וַ/יֹּ֣אמֶר ק֔וּמוּ כִּֽי נָתַ֧ן יְהוָ֛ה בְּ/יֶדְ/כֶ֖ם אֶת מַחֲנֵ֥ה מִדְיָֽן־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/015.yaml
  text: And when Gideon heard the telling of the dream and its interpretation, he bowed down in worship. Then he returned to the camp of Israel and said, “Get up, for the LORD has given the camp of Midian into your hand.”
translation:
  language: hi
  text: जब गिदोन ने स्वप्न का वर्णन और उसका अर्थ सुना, तो उसने दण्डवत् किया। फिर वह इस्राएल की छावनी में लौट आया और बोला, “उठो, क्योंकि यहोवा ने मिद्यान की छावनी तुम्हारे हाथ में दे दी है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִסְפַּר הַחֲלוֹם
  choice: स्वप्न का वर्णन
  rationale: מִסְפַּר यहाँ स्वप्न को सुनाने या उसका वृत्तांत बताने को दर्शाता है; आधुनिक हिन्दी में ‘वर्णन’ स्वाभाविक और सटीक है।
- source_word: שִׁבְרוֹ
  choice: उसका अर्थ
  rationale: שֵׁבֶר का आशय यहाँ स्वप्न की व्याख्या या अर्थ खोलना है; ‘अर्थ’ साधारण पाठक के लिए स्पष्ट है।
- source_word: וַיִּשְׁתָּחוּ
  choice: उसने दण्डवत् किया
  rationale: क्रिया झुककर श्रद्धा प्रकट करने को बताती है। इब्रानी में कर्म स्पष्ट नहीं है, इसलिए पाठ में ‘आराधना की’ जोड़कर अस्पष्टता नहीं मिटाई गई।
- source_word: ק֔וּמוּ
  choice: उठो
  rationale: बहुवचन आज्ञार्थक का संक्षिप्त और स्वाभाविक हिन्दी रूप।
- source_word: נָתַן ... בְּיֶדְכֶם
  choice: तुम्हारे हाथ में कर दी है
  rationale: इब्रानी विजय-सूचक मुहावरे को बनाए रखते हुए ऐसा हिन्दी रूप चुना गया है जो अधिकार और विजय के लिए सौंपे जाने का भाव देता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: व्यक्तिगत दिव्य नाम को सामान्य उपाधि से प्रतिस्थापित न करके हिन्दी बाइबलीय परंपरा में प्रचलित लिप्यंतरण रखा गया है।
theological_decisions:
- issue: וַיִּשְׁתָּחוּ में श्रद्धा का लक्ष्य
  choice: उसने दण्डवत् किया
  alternative: उसने आराधना की
  rationale: संदर्भ परमेश्वर के प्रति आराधना का संकेत दे सकता है, पर क्रिया स्वयं लक्ष्य को व्यक्त नहीं करती; इसलिए मूल की संक्षिप्तता और संभावित अस्पष्टता सुरक्षित रखी गई।
- issue: पूर्ण क्रिया נָתַן और भविष्य की विजय
  choice: ने ... कर दी है
  alternative: '... तुम्हारे हाथ में कर देगा'
  rationale: इब्रानी पूर्ण क्रिया आने वाली विजय को निश्चित, मानो पहले ही दी जा चुकी हो, प्रस्तुत करती है; हिन्दी पूर्ण रूप उसी निश्चितता को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, कथात्मक और गरिमापूर्ण शैली। ‘दण्डवत् किया’ बाइबलीय संदर्भ में सहज है, जबकि वाक्य-रचना सामान्य पाठकों के लिए सरल रखी गई है।
