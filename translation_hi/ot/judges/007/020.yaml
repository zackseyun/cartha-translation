reference: Judges 7:20
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַֽ֠/יִּתְקְעוּ שְׁלֹ֨שֶׁת הָ/רָאשִׁ֥ים בַּ/שּֽׁוֹפָרוֹת֮ וַ/יִּשְׁבְּר֣וּ הַ/כַּדִּים֒ וַ/יַּחֲזִ֤יקוּ בְ/יַד שְׂמאוֹלָ/ם֙ בַּ/לַּפִּדִ֔ים וּ/בְ/יַ֨ד יְמִינָ֔/ם הַ/שּׁוֹפָר֖וֹת לִ/תְק֑וֹעַ וַֽ/יִּקְרְא֔וּ חֶ֥רֶב לַֽ/יהוָ֖ה וּ/לְ/גִדְעֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/020.yaml
  text: Then the three companies blew the trumpets and shattered the jars. They held the torches in their left hands and the trumpets in their right hands to blow[a], and they cried out, “A sword for Yahweh and for Gideon!”
translation:
  language: hi
  text: तब तीनों दलों ने नरसिंगे फूँके और घड़े फोड़ डाले। उन्होंने अपने बाएँ हाथों में मशालें और फूँकने के लिए दाएँ हाथों में नरसिंगे थाम रखे थे। वे पुकार उठे, “याहवे और गिदोन के लिए तलवार!”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “याहवे और गिदोन की तलवार!”
    reason: मूल इब्रानी युद्धघोष संक्षिप्त और क्रियारहित है; संबंध को ‘के लिए’ अथवा ‘की’ के रूप में समझना संभव है।
lexical_decisions:
- source_word: שְׁלֹשֶׁת הָרָאשִׁים
  choice: तीनों दलों
  rationale: सैनिक प्रसंग में यह पद गिदोन द्वारा बनाए गए तीन समूहों या टुकड़ियों को दर्शाता है; ‘दल’ सहज आधुनिक हिन्दी है।
- source_word: שׁוֹפָרוֹת
  choice: नरसिंगे
  rationale: यह संकेत देने के लिए फूँका जाने वाला सींग-वाद्य है। ‘नरसिंगा’ हिन्दी में ऐसे वाद्य के लिए स्वाभाविक और प्रसंगानुकूल शब्द है।
- source_word: הַכַּדִּים
  choice: घड़े
  rationale: כַּד पानी या अन्य सामग्री रखने के पात्र को दर्शाता है; ‘घड़े’ स्पष्ट, सामान्य और प्रसंगानुकूल है।
- source_word: וַיַּחֲזִיקוּ
  choice: थाम रखे थे
  rationale: यहाँ क्रिया हाथ में मजबूती से पकड़े रहने की क्रिया बताती है; यह हिन्दी प्रयोग उस स्थिति को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: בְיַד שְׂמאוֹלָם ... וּבְיַד יְמִינָם
  choice: अपने बाएँ हाथों में ... दाएँ हाथों में
  rationale: इब्रानी में एकवचन ‘हाथ’ बहुवचन समुदाय के प्रत्येक व्यक्ति पर वितरणात्मक रूप से लागू है; हिन्दी में बहुवचन स्वाभाविक है।
- source_word: לַפִּדִים
  choice: मशालें
  rationale: לַפִּיד जलती हुई मशाल या अग्निशिखा वाला साधन है; ‘मशालें’ सबसे स्पष्ट सामान्य हिन्दी है।
- source_word: לִתְקֹעַ
  choice: फूँकने के लिए
  rationale: क्रियार्थक पद उद्देश्य व्यक्त करता है—नरसिंगे इसलिए हाथ में थे कि उन्हें फूँका जाए।
- source_word: וַיִּקְרְאוּ
  choice: पुकार उठे
  rationale: यह युद्धघोष की ऊँची और आकस्मिक पुकार है; ‘पुकार उठे’ उसका बल स्वाभाविक हिन्दी में रखता है।
- source_word: חֶרֶב לַיהוָה וּלְגִדְעוֹן
  choice: याहवे और गिदोन के लिए तलवार!
  rationale: इब्रानी वाक्य क्रियारहित और संक्षिप्त युद्धघोष है। ‘के लिए’ לְ के सीधे अर्थ और मूल की तीक्ष्ण संक्षिप्तता को बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम के चार इब्रानी अक्षरों को किसी उपाधि से बदलने के बजाय हिन्दी में लिप्यंतरित किया गया है।
theological_decisions:
- issue: युद्धघोष חֶרֶב לַיהוָה וּלְגִדְעוֹן का विस्तार
  choice: याहवे और गिदोन के लिए तलवार!
  alternative: याहवे और गिदोन की तलवार!
  rationale: मूल वाक्य में क्रिया नहीं है और לְ संबंध या हित दोनों का भाव दे सकता है। मुख्य पाठ ‘के लिए’ को सीधे रखता है, जबकि संबंधसूचक पारंपरिक समझ को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक रखी गई है। ‘तीनों दलों’, ‘घड़े’, ‘मशालें’ और ‘पुकार उठे’ सामान्य पाठक के लिए सहज हैं। युद्धघोष की मूल संक्षिप्तता और उसकी वास्तविक व्याकरणिक अस्पष्टता सुरक्षित रखी गई है।
