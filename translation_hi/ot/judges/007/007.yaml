source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל גִּדְע֗וֹן בִּ/שְׁלֹשׁ֩ מֵא֨וֹת הָ/אִ֤ישׁ הַֽ/מֲלַקְקִים֙ אוֹשִׁ֣יעַ אֶתְ/כֶ֔ם וְ/נָתַתִּ֥י אֶת מִדְיָ֖ן בְּ/יָדֶ֑/ךָ וְ/כָל הָ/עָ֔ם יֵלְכ֖וּ אִ֥ישׁ לִ/מְקֹמֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/007.yaml
  text: And Yahweh said to Gideon[a], “With the three hundred men who lapped, I will save you and give Midian into your hand. And let all the people go, each man to his place.”
translation:
  language: hi
  text: तब याहवे ने गिदोन से कहा, “चाटकर पीने वाले उन तीन सौ पुरुषों के द्वारा[a] मैं तुम लोगों को बचाऊँगा और मिद्यान को तेरे हाथ में दे दूँगा। और सब लोग अपने-अपने स्थान चले जाएँ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “चाटकर पीने वाले उन तीन सौ पुरुषों के साथ।”
    reason: בְּ यहाँ साधन (‘के द्वारा’) अथवा साथ होने (‘के साथ’) का भाव व्यक्त कर सकता है; इस संदर्भ में साधनवाचक अर्थ अधिक संभावित है।
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम को उपाधि से बदलने के बजाय प्रचलित हिन्दी लिप्यंतरण में रखा गया है।
- source_word: בִּשְׁלֹשׁ מֵאוֹת הָאִישׁ
  choice: उन तीन सौ पुरुषों के द्वारा
  rationale: בְּ का साधनवाचक अर्थ स्पष्ट करता है कि इन्हीं पुरुषों के माध्यम से छुटकारा दिया जाएगा; ‘उन’ पिछले प्रसंग में चुने गए दल की ओर संकेत करता है।
- source_word: הַמֲלַקְקִים
  choice: चाटकर पीने वाले
  rationale: पहले के प्रसंग में वर्णित ठोस क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है; पद में ‘पानी’ दोहराया नहीं गया है, इसलिए उसे यहाँ नहीं जोड़ा गया।
- source_word: אוֹשִׁיעַ אֶתְכֶם
  choice: मैं तुम लोगों को बचाऊँगा
  rationale: हिफ़ील क्रिया के बचाने/छुड़ाने के अर्थ को बनाए रखता है और ‘तुम’ के इब्रानी बहुवचन को हिन्दी में स्पष्ट करता है।
- source_word: וְנָתַתִּי אֶת מִדְיָן בְּיָדֶךָ
  choice: मिद्यान को तेरे हाथ में कर दूँगा
  rationale: विजय और अधिकार सौंपने वाले इब्रानी मुहावरे को हिन्दी में समझने योग्य रूप में बनाए रखता है; ‘तेरे’ का एकवचन गिदोन को संबोधित करता है।
- source_word: וְכָל הָעָם יֵלְכוּ אִישׁ לִמְקֹמוֹ
  choice: बाकी सब लोग अपने-अपने स्थान को चले जाएँ
  rationale: संदर्भगत विरोध के कारण ‘बाकी’ स्वाभाविक है; ‘चले जाएँ’ आज्ञा/अनुमति सूचक भाव और ‘अपने-अपने’ वितरक एकवचन का अर्थ व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा
  rationale: मूल पाठ में चार-अक्षरी व्यक्तिगत नाम सीधे आया है; ‘याहवे’ उसे किसी उपाधि से प्रतिस्थापित किए बिना आधुनिक हिन्दी में प्रस्तुत करता है।
- issue: אוֹשִׁיעַ में सैन्य और उद्धार-संबंधी अर्थ
  choice: बचाऊँगा
  alternative: छुटकारा दूँगा
  rationale: ‘बचाऊँगा’ युद्ध में मुक्ति और व्यापक उद्धार—दोनों अर्थों के लिए खुला रहता है और किसी एक धर्मवैज्ञानिक अर्थ तक सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। गिदोन के लिए एकवचन ‘तेरे’ और गिदोन सहित समुदाय के लिए बहुवचन ‘तुम लोगों’ का भेद सुरक्षित रखा गया है।
