    reason: lexical_alternative
lexical_decisions:
- source_word: בְּבוֹא
  choice: जब … आया था
  rationale: בְּ के साथ infinitive construct यहाँ समय-सूचक उपवाक्य बनाता है। हिन्दी में ‘जब … आया था’ स्वाभाविक है और शीर्षक की कथात्मक पृष्ठभूमि स्पष्ट करता है।
- source_word: אֵלָיו
  choice: उसके पास
  rationale: אֶל और तृतीय पुरुष एकवचन प्रत्यय का स्वाभाविक हिन्दी रूप; इससे नातान के दाऊद के पास आने की दिशा बनी रहती है।
- source_word: נָתָן הַנָּבִיא
  choice: नातान भविष्यद्वक्ता
  rationale: व्यक्तिनाम का प्रचलित हिन्दी लिप्यंतरण और נָבִיא का स्पष्ट, प्रतिष्ठित हिन्दी समतुल्य।
- source_word: כַּאֲשֶׁר
  choice: क्योंकि
  rationale: כַּאֲשֶׁר सामान्यतः ‘जब/जैसे’ हो सकता है, पर यहाँ प्रसंग में नातान के आने का कारण बताने वाला अर्थ स्वाभाविक है; हिन्दी में ‘क्योंकि’ उस संबंध को स्पष्ट करता है, जबकि क्रम भी संदर्भ से समझ में आता है।
- source_word: בָּא אֶל
  choice: के पास गया था
  rationale: किसी स्त्री के साथ בוא אל यौन संबंध का शिष्टोक्तिपूर्ण मुहावरा है। मुख्य पाठ में उसी प्रकार का संयत मुहावरा रखा गया है और अर्थ पादटिप्पणी में स्पष्ट किया गया है।
- source_word: בַּת שָׁבַע
  choice: बतशेबा
  rationale: इब्रानी नाम का हिन्दी बाइबलीय परंपरा में प्रचलित लिप्यंतरण।
theological_decisions:
- issue: כַּאֲשֶׁר का संबंध
  choice: क्योंकि
  alternative: जब / उसके बाद
  rationale: मूल संयोजक समय या परिस्थिति व्यक्त कर सकता है। इस शीर्षक में वह दाऊद के बतशेबा के पास जाने को नातान के आगमन की प्रेरक परिस्थिति बनाता है; ‘क्योंकि’ कारणात्मक संबंध को स्वाभाविक हिन्दी में रखता है, बिना घटना के नैतिक अर्थ को बढ़ाए।
