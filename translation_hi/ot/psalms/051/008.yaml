  text: Purify me with hyssop[a], and I will be clean; wash me, and I will be whiter than snow.
translation:
  language: hi
  text: जूफ़े[a] से मुझे शुद्ध कर, और मैं शुद्ध हो जाऊँगा; मुझे धो, और मैं बर्फ़ से भी अधिक सफ़ेद हो जाऊँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जूफ़े से मुझे शुद्ध कर।” हिब्रू क्रिया पाप और शुद्धिकरण से जुड़ी है तथा अनुष्ठानिक शुद्धि की ओर संकेत करती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּחַטְּאֵנִי
  choice: मुझे शुद्ध कर
  rationale: पिएल रूप यहाँ पाप कराने का नहीं, बल्कि पाप अथवा अशुद्धता दूर करके शुद्ध करने का भाव देता है। यह सहज हिन्दी है और अनुष्ठानिक शुद्धि की छवि बनाए रखता है।
- source_word: בְאֵזוֹב
  choice: जूफ़े से
  rationale: אֵזוֹב बाइबिल में शुद्धिकरण-विधियों में प्रयुक्त वनस्पति है। करण कारक ‘से’ हिब्रू בְּ का स्वाभाविक हिन्दी रूप है।
- source_word: וְאֶטְהָר
  choice: और मैं शुद्ध हो जाऊँगा
  rationale: טהר का अर्थ शुद्ध अथवा स्वच्छ होना है; यहाँ पहले खंड की अनुष्ठानिक और नैतिक शुद्धि दोनों की प्रतिध्वनि के कारण ‘शुद्ध’ उपयुक्त है।
- source_word: תְּכַבְּסֵנִי
  choice: मुझे धो
  rationale: כבס मूलतः वस्त्र धोने के लिए प्रयुक्त होता है, पर यहाँ काव्यात्मक रूप से प्रार्थी पर लागू है। ‘मुझे धो’ रूपक को स्पष्ट और स्वाभाविक रखता है।
- source_word: וּמִשֶּׁלֶג
  choice: बर्फ़ से भी अधिक
  rationale: सन्दर्भ में מִן तुलनात्मक है। ‘से भी अधिक’ हिम की उज्ज्वल सफेदी से बढ़कर होने का भाव स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אַלְבִּין
  choice: उजला हो जाऊँगा
  rationale: हिफ़ील रूप यहाँ श्वेत हो जाने के परिणाम को व्यक्त करता है। हिन्दी में मनुष्य की शुद्ध की हुई दशा के लिए ‘उजला’ काव्यात्मक और स्वाभाविक है।
theological_decisions:
- issue: नैतिक पाप के लिए अनुष्ठानिक शुद्धिकरण की छवि
  choice: ‘जूफ़े से मुझे शुद्ध कर’ कहकर अनुष्ठानिक छवि को स्पष्ट रूप से बनाए रखा गया है।
  alternative: ‘जूफ़े से मुझे पवित्र कर’ अथवा सामान्यीकृत ‘मुझे पाप से शुद्ध कर’
  rationale: हिब्रू पद इस्राएल की शुद्धिकरण-विधियों की छवि द्वारा पाप से शुद्ध होने की विनती करता है। ‘जूफ़ा’ और ‘शुद्ध’ को बनाए रखना इस सम्बन्ध को सुरक्षित रखता है, जबकि पाठ में ‘पाप से’ जैसे अनकहे शब्द नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, प्रार्थनापूर्ण और काव्यात्मक रखी गई है। ‘जूफ़ा’ अपेक्षाकृत अपरिचित बाइबिलीय वनस्पति-नाम है, इसलिए उसके अर्थगत और अनुष्ठानिक संकेत को पाद-टिप्पणी से स्पष्ट किया गया है।
