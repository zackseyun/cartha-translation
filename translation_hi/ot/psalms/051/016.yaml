  text: אֲ֭דֹנָ/י שְׂפָתַ֣/י תִּפְתָּ֑ח וּ֝/פִ֗/י יַגִּ֥יד תְּהִלָּתֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/016.yaml
  text: Lord, open my lips, and my mouth will declare your praise.
translation:
  language: hi
  text: हे प्रभु, मेरे होंठ खोल दे, और मेरा मुँह तेरी स्तुति का उद्घोष करेगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲדֹנָי
  choice: हे प्रभु
  rationale: यह परमेश्वर के लिए सीधे सम्बोधन में प्रयुक्त श्रद्धापूर्ण उपाधि है। ‘हे प्रभु’ आधुनिक हिन्दी में स्वाभाविक सम्बोधन है और इसमें ‘मेरे’ जैसा ऐसा तत्व नहीं जोड़ा गया जो हिन्दी में आवश्यक नहीं है।
- source_word: שְׂפָתַי
  choice: मेरे होंठ
  rationale: बहुवचन देह-अंग और प्रथम पुरुष एकवचन संबंधसूचक प्रत्यय को ठोस वाणी-चित्र सहित बनाए रखता है।
- source_word: תִּפְתָּח
  choice: खोल दे
  rationale: פתח के काल रूप का प्रार्थना-संदर्भ में विनतीसूचक बल है। ‘खोल दे’ हिन्दी में प्रत्यक्ष और स्वाभाविक प्रार्थना है।
- source_word: וּפִי
  choice: और मेरा मुँह
  rationale: संयोजक तथा समानांतर देह-अंग की छवि दोनों सुरक्षित हैं; ‘तब’ जोड़कर स्पष्ट परिणाम-संबंध आरोपित नहीं किया गया।
- source_word: יַגִּיד
  choice: बखान करेगा
  rationale: נגד के हिफ़ील रूप का अर्थ घोषित करना या वर्णन करना है। ‘बखान करेगा’ स्तुति के संदर्भ में स्वाभाविक है और आगामी परिणाम का भाव रखता है।
- source_word: תְּהִלָּתֶךָ
  choice: तेरी स्तुति
  rationale: संज्ञा और द्वितीय पुरुष एकवचन प्रत्यय का सीधा, प्रचलित हिन्दी रूप; यह प्रभु की प्रशंसा को कथन का विषय बनाए रखता है।
theological_decisions:
- issue: सीधे सम्बोधन में ईश्वरीय उपाधि का अनुवाद
  choice: हे प्रभु
  alternative: हे मेरे प्रभु
  rationale: אֲדֹנָי यहाँ श्रद्धापूर्ण ईश्वरीय उपाधि है। ‘हे प्रभु’ हिन्दी में उपाधि और सम्बोधन दोनों स्पष्ट करता है, जबकि ‘मेरे’ जोड़ना मूल रूप की संभावित पारंपरिक व्याख्या को आवश्यकता से अधिक स्पष्ट कर सकता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और प्रार्थनामय है। परमेश्वर के सीधे सम्बोधन में निकटता तथा काव्यात्मक एकरूपता के लिए ‘तेरी’ और ‘खोल दे’ का प्रयोग किया गया है। ‘होंठ’ और ‘मुँह’ की इब्रानी समानांतर छवि सुरक्षित रखी गई है।
