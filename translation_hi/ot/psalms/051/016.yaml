    issue: Register and precision of “बखान करेगा”
    rationale: Although it can mean recount or praise, “बखान” is less elevated and can imply elaborate description. “उद्घोष करेगा” naturally conveys public declaration/proclamation while maintaining the worshipful poetic register.
