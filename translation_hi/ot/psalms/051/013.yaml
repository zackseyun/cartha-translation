id: PSA.51.13
reference: Psalms 51:13
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: הָשִׁ֣יבָ/ה לִּ֭/י שְׂשׂ֣וֹן יִשְׁעֶ֑/ךָ וְ/ר֖וּחַ נְדִיבָ֣ה תִסְמְכֵֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/013.yaml
  text: Restore to me the joy of your salvation[c][b][a], and let a willing spirit sustain me.
translation:
  language: hi
  text: तेरे उद्धार का आनन्द मुझे फिर से दे,[a] और तत्पर आत्मा[b] मुझे सम्भाले।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘तेरे छुटकारे का आनन्द’।
    reason: lexical_alternative
  - marker: b
    text: या ‘उदार आत्मा’ या ‘कुलीन आत्मा’।
    reason: lexical_alternative
  - marker: c
    text: या ‘मुझे थामे रखे’।
    reason: lexical_alternative
lexical_decisions:
- source_word: הָשִׁיבָה
  choice: फिर दे
  rationale: हिफ़ील आज्ञार्थक रूप किसी पहले अनुभव की हुई अवस्था को लौटाने की प्रार्थना व्यक्त करता है; सहज हिन्दी में ‘फिर दे’ यही भाव स्पष्ट करता है।
- source_word: לִּי
  choice: मुझे
  rationale: यह प्रथम पुरुष एकवचन प्राप्तकर्ता को चिह्नित करता है और ‘फिर दे’ के साथ स्वाभाविक हिन्दी है।
- source_word: שְׂשׂוֹן
  choice: आनन्द
  rationale: संज्ञा आनन्द, हर्ष या उल्लास का बोध कराती है; प्रार्थना के गरिमापूर्ण काव्यात्मक सन्दर्भ में ‘आनन्द’ स्वाभाविक और संक्षिप्त है।
- source_word: יִשְׁעֶךָ
  choice: अपने उद्धार का
  rationale: यह परमेश्वर से मिलने वाले बचाव/उद्धार को व्यक्त करता है; ‘उद्धार’ इसके व्यापक धार्मिक और संकट से छुड़ाने—दोनों आयामों को खुला रखता है।
- source_word: וְרוּחַ
  choice: और ... आत्मा
  rationale: इस आन्तरिक और नैतिक सन्दर्भ में רוּחַ का अर्थ ‘आत्मा’ है, न कि हवा; वाव दोनों विनतियों को जोड़ता है।
- source_word: נְדִיבָה
  choice: तत्पर
  rationale: विशेषण का अर्थ इच्छुक, उदार या कुलीन हो सकता है। ‘तत्पर’ स्वेच्छा से तैयार और उत्तरदायी मनोवृत्ति का भाव देता है, बिना यह तय किए कि आत्मा परमेश्वर की है या प्रार्थी की।
- source_word: תִסְמְכֵנִי
  choice: मुझे सम्भाले
  rationale: סמך सहारा देने, थामे रखने या सम्भालने का अर्थ देता है। समानांतर विनती में यह रूप प्रार्थनात्मक है; ‘सम्भाले’ निरन्तर सहारे का भाव स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: पश्चात्ताप के भजन में יִשְׁעֶךָ का अर्थ
  choice: अपने उद्धार का
  alternative: अपने छुटकारे का
  rationale: इब्रानी शब्द संकट से छुड़ाने और व्यापक उद्धार दोनों का बोध करा सकता है। ‘उद्धार’ इस धर्मवैज्ञानिक विस्तार को बनाए रखता है, पर बाद की किसी विशिष्ट धर्मसैद्धान्तिक व्याख्या को पद में नहीं जोड़ता।
- issue: נְדִיבָה רוּחַ का आशय
  choice: तत्पर आत्मा
  alternative: उदार आत्मा; कुलीन आत्मा
  rationale: वाक्यांश यह स्पष्ट नहीं करता कि यह परमेश्वर का आत्मा है या भजनकार की नवीकृत आन्तरिक प्रवृत्ति। ‘तत्पर आत्मा’ इस अस्पष्टता को सुरक्षित रखते हुए स्वेच्छापूर्ण तैयारी का मुख्य प्रसंगगत भाव देता है।
- issue: תִסְמְכֵנִי में सहारे की प्रकृति
  choice: मुझे सम्भाले
  alternative: मुझे थामे रखे
  rationale: अनुवाद आन्तरिक स्थिरता के लिए जारी सहारे की विनती व्यक्त करता है और यह निर्धारित नहीं करता कि सहारा किस विशिष्ट रीति से दिया जाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, प्रार्थनात्मक और गरिमापूर्ण शैली। ‘फिर दे’ बोलचाल में स्पष्ट है, जबकि ‘आनन्द’, ‘उद्धार’ और ‘आत्मा’ बाइबलीय काव्य की गरिमा बनाए रखते हैं। प्रत्येक विकल्प का चिह्न सम्बन्धित पदांश के तुरन्त बाद रखा गया है।
