lexical_decisions:
- source_word: הֵן
  choice: देख
  rationale: यह शब्द कथन पर ध्यान खींचते हुए उसे बल देता है। ‘देख’ भजन की काव्यात्मक शैली में इस प्रभाव को स्वाभाविक रूप से बनाए रखता है।
- source_word: אֱמֶת
  choice: सच्चाई
  rationale: यहाँ शब्द भीतरी नैतिक सत्यता और निष्कपटता की ओर संकेत करता है; ‘सच्चाई’ उसके अर्थ को किसी संकीर्ण doctrinal अर्थ तक सीमित नहीं करता।
- source_word: חָפַצְתָּ
  choice: चाहता है
  rationale: क्रिया इच्छा रखने या प्रसन्न होने का भाव व्यक्त कर सकती है। इस संदर्भ में ‘चाहता है’ परमेश्वर की अपेक्षा को सहज और स्पष्ट ढंग से बताता है।
- source_word: בַטֻּחוֹת
  choice: अंतरतम में
  rationale: यह दुर्लभ काव्यात्मक पद मनुष्य के भीतर के या छिपे भागों को सूचित करता है। ‘अंतरतम’ शारीरिक अंगों का अनावश्यक आभास दिए बिना भीतरी मनुष्य का बिंब रखता है।
- source_word: וּבְסָתֻם
  choice: और गुप्त स्थान में
  rationale: यह अभिव्यक्ति छिपी या गुप्त जगह का स्थानिक बिंब बनाए रखती है और पहले पद के समानांतर है।
- source_word: חָכְמָה
  choice: बुद्धि
  rationale: यह मानक और संदर्भानुकूल अनुवाद है, जो परमेश्वर से मिलने वाली नैतिक और आत्मिक समझ को व्यक्त करता है।
- source_word: תוֹדִיעֵנִי
  choice: तू मुझे … का ज्ञान कराता है
  rationale: ידע के हिफ़ील रूप का मूल भाव ‘किसी को जानने देना/ज्ञान कराना’ है। यह चयन उस कारक भाव को ‘सिखाता है’ की अपेक्षा अधिक स्पष्टता से रखता है।
theological_decisions:
- issue: परमेश्वर द्वारा चाही गई भीतरी नैतिक वास्तविकता
  choice: पद को मनुष्य के अंतरतम में परमेश्वर की चाही हुई सच्चाई और वहीं उसके द्वारा दी जाने वाली बुद्धि के रूप में प्रस्तुत किया गया है।
  alternative: ‘सच्चाई’ को विशेष रूप से वाचा-निष्ठा मानना, या पद को मुख्यतः मनोवैज्ञानिक आत्म-जागरूकता के रूप में पढ़ना।
  rationale: इब्रानी काव्यात्मक समानांतरता भीतरी सच्चाई और गुप्त स्थान में ज्ञात कराई गई बुद्धि को जोड़ती है, पर किसी बाद की धर्मवैज्ञानिक प्रणाली को निर्दिष्ट नहीं करती।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल किंतु गरिमामय भजनात्मक शैली रखी गई है। ‘तू’ मूल इब्रानी के एकवचन संबोधन और हिन्दी की पारंपरिक प्रार्थना-भाषा के अनुरूप है। दुर्लभ भीतरी-अंग संबंधी बिंबों को ‘अंतरतम’ और ‘गुप्त स्थान’ से व्यक्त किया गया है, तथा उनकी अनिश्चितता पादटिप्पणियों में सुरक्षित रखी गई है।
