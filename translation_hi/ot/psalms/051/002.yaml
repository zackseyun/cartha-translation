  text: חָנֵּ֣/נִי אֱלֹהִ֣ים כְּ/חַסְדֶּ֑/ךָ כְּ/רֹ֥ב רַ֝חֲמֶ֗י/ךָ מְחֵ֣ה פְשָׁעָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/002.yaml
  text: Be gracious to me[a], God, according to your steadfast love; according to your abundant mercies[c][b], blot out my transgressions.
translation:
  language: hi
  text: हे परमेश्वर, मुझ पर अनुग्रह कर[a], तेरे अटल प्रेम[c] के अनुसार; तेरी अपार करुणा[b] के अनुसार मेरे अपराधों को मिटा दे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मुझ पर कृपा कर” अथवा “मुझ पर दया कर।” हिब्रानी क्रिया कृपा या अनुग्रह दिखाने की विनती करती है; मुख्य पाठ आगे प्रयुक्त करुणा-सूचक शब्द से इसका भेद बनाए रखता है।
    reason: lexical_alternative
  - marker: b
    text: या, “तेरी दयाओं की बहुतायत के अनुसार।” हिब्रानी में ‘करुणा/दया’ बहुवचन रूप में है और प्रचुर, गहरी करुणा का भाव देती है।
    reason: lexical_alternative
  - marker: c
    text: ‘अटल प्रेम’ हिब्रानी חֶסֶד (हेसेद) का अनुवाद है, जो प्रायः निष्ठावान, स्थिर प्रेम को सूचित करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: חָנֵּנִי
  choice: मुझ पर अनुग्रह कर
  rationale: यह חנן का आज्ञार्थक रूप है, जिसमें वक्ता अपने लिए कृपा या अनुग्रह माँगता है। यह अनुवाद आगे आने वाले רחמים से इसका शब्दगत भेद बनाए रखता है।
- source_word: אֱלֹהִים
  choice: हे परमेश्वर
  rationale: यह इस्राएल के परमेश्वर को प्रत्यक्ष संबोधन है। हिन्दी में प्रार्थना के स्वाभाविक और गरिमापूर्ण संबोधन के रूप में ‘हे परमेश्वर’ चुना गया है।
- source_word: כְּחַסְדֶּךָ
  choice: अपनी अटल प्रेममय करुणा के अनुसार
  rationale: חסד में स्थिर, निष्ठावान प्रेम और कृपालुता का भाव है। यह पदबंध उस समृद्ध अर्थ को साधारण आधुनिक हिन्दी में व्यक्त करता है; ‘के अनुसार’ כְּ की शक्ति दर्शाता है।
- source_word: כְּרֹב
  choice: अपनी अपार
  rationale: רֹב बहुतायत, विशालता या बहुलता व्यक्त करता है। ‘अपार’ दया की प्रचुरता को स्वाभाविक हिन्दी में रखता है।
- source_word: רַחֲמֶיךָ
  choice: दया
  rationale: רחמים गहरी करुणा और दयालुता को व्यक्त करता है। हिन्दी में भाववाचक ‘दया’ स्वाभाविक है, यद्यपि हिब्रानी रूप बहुवचन है; इसका संकेत पादटिप्पणी में दिया गया है।
- source_word: מְחֵה
  choice: मिटा दे
  rationale: מחה का अर्थ पोंछ देना, मिटा देना या लोप कर देना है। ‘मिटा दे’ पापों के अभिलेख अथवा दोष को हटाने की रूपकात्मक शक्ति बनाए रखता है।
- source_word: פְשָׁעַי
  choice: मेरे अपराधों
  rationale: פשע अधिकार के विरुद्ध विद्रोह, उल्लंघन या अपराध को दर्शाता है। ‘अपराध’ आधुनिक हिन्दी में स्वाभाविक है और नैतिक गंभीरता बनाए रखता है।
theological_decisions:
- issue: חנן, חסד और רחמים जैसे परस्पर संबंधित कृपा-दया सूचक शब्दों का अनुवाद
  choice: ‘अनुग्रह’, ‘अटल प्रेममय करुणा’ और ‘दया’ जैसे अलग पदों से शब्दगत भेद बनाए रखा गया है।
  alternative: तीनों के लिए मुख्यतः ‘दया’ या ‘करुणा’ की भाषा दोहराना।
  rationale: हिब्रानी कविता परमेश्वर के अनुग्रह, निष्ठावान प्रेम और गहरी करुणा के निकट-संबंधित किन्तु विशिष्ट पहलुओं को परत-दर-परत रखती है। भिन्न हिन्दी पद इस बनावट और धर्मवैचारिक तनाव को समतल होने से बचाते हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी, प्रार्थनात्मक और गरिमापूर्ण शैली। वाक्यरचना काव्यात्मक समानांतरता बनाए रखती है। ‘अटल प्रेममय करुणा’ חסד के स्थिर, निष्ठावान और कृपालु प्रेम को व्यक्त करती है; भाषा को संप्रदाय-विशेष की शब्दावली से मुक्त रखा गया है।
