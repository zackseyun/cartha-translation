  text: אַל תַּשְׁלִיכֵ֥/נִי מִ/לְּ/פָנֶ֑י/ךָ וְ/ר֥וּחַ קָ֝דְשְׁ/ךָ֗ אַל תִּקַּ֥ח מִמֶּֽ/נִּי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/012.yaml
  text: Do not cast me away from your presence[a], and do not take your Holy Spirit from me.
translation:
  language: hi
  text: मुझे अपनी उपस्थिति से निकाल न दे, और अपना पवित्र आत्मा मुझसे न ले।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תַּשְׁלִיכֵנִי
  choice: मुझे ... दूर न कर
  rationale: हिफ़ील रूप में किसी को फेंक देने या दूर कर देने का भाव है। हिंदी में “दूर न कर” प्रार्थना की स्वाभाविक गरिमा रखते हुए उस अस्वीकार के बल को व्यक्त करता है।
- source_word: מִלְּפָנֶיךָ
  choice: अपने सामने से
  rationale: शाब्दिक रूप से “अपने मुख के सामने से”; “अपने सामने से” आधुनिक हिंदी में स्वाभाविक है और परमेश्वर की उपस्थिति से दूर किए जाने का संबंधपरक भाव बनाए रखता है।
- source_word: רוּחַ קָדְשְׁךָ
  choice: अपना पवित्र आत्मा
  rationale: रचना का शाब्दिक अर्थ “अपनी पवित्रता का आत्मा” अथवा “अपना पवित्र आत्मा” हो सकता है। मुख्य पाठ में परमेश्वर के अपने आत्मा का सीधा और प्रचलित हिंदी निरूपण रखा गया है; शाब्दिक विकल्प पादटिप्पणी में सुरक्षित है।
- source_word: תִּקַּח
  choice: न ले
  rationale: לקח का सामान्य अर्थ “लेना” है। “मुझसे न ले” मूल विनती की संक्षिप्तता और सीधापन बनाए रखता है।
- source_word: מִמֶּנִּי
  choice: मुझसे
  rationale: यह स्रोत के “मुझसे/मेरे पास से” अर्थ का स्वाभाविक हिंदी रूप है।
theological_decisions:
- issue: רוּחַ קָדְשְׁךָ का व्यक्तिवाचक अथवा वर्णनात्मक निरूपण
  choice: अपना पवित्र आत्मा
  alternative: अपना पवित्र आत्मा; अधिक शाब्दिक रूप में, अपनी पवित्रता का आत्मा
  rationale: संदर्भ परमेश्वर के अपने आत्मा की ओर संकेत करता है, पर इब्रानी संरचना “पवित्रता के आत्मा” की शाब्दिक संभावना भी रखती है। हिंदी में बड़े अक्षरों का भेद उपलब्ध नहीं है, इसलिए मुख्य पाठ स्वाभाविक रूप रखता है और पादटिप्पणी वास्तविक शाब्दिक अस्पष्टता बताती है।
translation_notes:
  register: आधुनिक मानक हिंदी में संक्षिप्त, गंभीर प्रार्थना-शैली। “तू” का कर्ता प्रत्यक्ष नहीं लिखा गया; आज्ञार्थक क्रियाएँ मूल की निकट और विनयपूर्ण तीव्रता व्यक्त करती हैं।
