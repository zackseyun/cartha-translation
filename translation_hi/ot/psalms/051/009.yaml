source:
  edition: WLC
  text: תַּ֭שְׁמִיעֵ/נִי שָׂשׂ֣וֹן וְ/שִׂמְחָ֑ה תָּ֝גֵ֗לְנָה עֲצָמ֥וֹת דִּכִּֽיתָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/009.yaml
  text: Let me hear joy and gladness[c][b][a]; let the bones you have crushed rejoice.
translation:
  language: hi
  text: मुझे हर्ष और आनंद सुनने दे[a]; जिन हड्डियों को तूने कुचल दिया है[b][c], वे आनंदित हों।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मुझे हर्ष और आनंद सुनवा।”
    reason: कारणवाचक हिब्रू क्रिया का अधिक शाब्दिक विकल्प।
  - marker: b
    text: हिब्रू में केवल “हड्डियाँ” है; संदर्भ से वक्ता की अपनी हड्डियाँ अभिप्रेत हैं।
    reason: मूल में प्रथम-पुरुष स्वामित्व-प्रत्यय नहीं है।
  - marker: c
    text: या, “जिन हड्डियों को तूने तोड़ डाला है।”
    reason: דכה के प्रबल रूपक का वैकल्पिक अनुवाद।
lexical_decisions:
- source_word: תַּשְׁמִיעֵנִי
  choice: मुझे ... सुनने दे
  rationale: हिफ़ील रूप मूलतः ‘मुझे सुनवा/सुनने दे’ का कारणवाचक भाव रखता है। प्रार्थना के प्रसंग में यह स्वाभाविक हिन्दी में विनती का भाव व्यक्त करता है।
- source_word: שָׂשׂוֹן וְשִׂמְחָה
  choice: हर्ष और आनन्द
  rationale: दो निकटार्थक शब्दों की काव्यात्मक जोड़ी को दो अलग, सहज हिन्दी शब्दों से सुरक्षित रखा गया है।
- source_word: תָּגֵלְנָה
  choice: वे मग्न हों
  rationale: स्त्रीलिंग बहुवचन अपूर्ण क्रिया यहाँ प्रार्थनात्मक/कामनार्थक भाव रखती है; ‘हों’ उस भाव को बनाए रखता है। ‘मग्न हों’ גיל के उल्लासपूर्ण आनन्द को व्यक्त करता है।
- source_word: עֲצָמוֹת
  choice: जिन हड्डियों को
  rationale: हिब्रू में केवल ‘हड्डियाँ’ है, कोई प्रथम-पुरुष प्रत्यय नहीं। हिन्दी वाक्य-संबंध के लिए ‘जिन’ जोड़ा गया, पर ‘मेरी’ नहीं जोड़ा गया।
- source_word: דִּכִּיתָ
  choice: तूने कुचल दिया है
  rationale: דכה का प्रबल रूपक ‘कुचलना/तोड़ डालना’ है। ‘कुचल दिया है’ गहरी पीड़ा और परमेश्वर को संबोधित प्रत्यक्ष कर्तृत्व दोनों बनाए रखता है।
theological_decisions:
- issue: पीड़ा का कर्तृत्व परमेश्वर को दिया जाना
  choice: ‘तूने कुचल दिया है’ के प्रत्यक्ष संबोधन को बनाए रखा
  alternative: ‘जो कुचल गई हैं’ या ‘जिन्हें तोड़ दिया गया है’
  rationale: हिब्रू का द्वितीय पुरुष एकवचन पूर्ण क्रियारूप सीधे परमेश्वर को कर्ता ठहराता है। इस धर्मवैचारिक तनाव को कर्मवाच्य बनाकर नरम नहीं किया गया।
- issue: ‘हड्डियों’ का वक्ता से संबंध
  choice: मुख्य पाठ में ‘मेरी’ नहीं जोड़ा
  alternative: ‘मेरी हड्डियाँ’
  rationale: प्रसंग हड्डियों को भजनकार की अपनी हड्डियाँ समझाता है, पर मूल पद में प्रथम-पुरुष स्वामित्व स्पष्ट नहीं है; इसलिए मूल की अभिव्यक्ति सुरक्षित रखी गई।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और प्रार्थनात्मक हिन्दी। परमेश्वर के लिए निकट, काव्यात्मक एकवचन संबोधन ‘तू’ रखा गया है। समानार्थी काव्य-युग्म और दोनों खंडों का कामनार्थक समानांतर भाव सुरक्षित रखा गया है।
