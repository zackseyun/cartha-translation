lexical_decisions:
- source_word: הֵיטִיבָה
  choice: भला कर
  rationale: यטב के हिफ़ईल प्रार्थनात्मक रूप का सीधा और स्वाभाविक अनुवाद है; यह परमेश्वर से सिय्योन के हित में कार्य करने की विनती को बनाए रखता है।
- source_word: בִּרְצוֹנְךָ
  choice: अपनी प्रसन्नता के अनुसार
  rationale: רָצוֹן में कृपा, सद्भाव और इच्छा—इन सभी अर्थ-छायाओं की संभावना है। यह वाक्यांश दिव्य अनुग्रह और इच्छा दोनों के लिए स्थान रखता है।
- source_word: אֶת צִיּוֹן
  choice: सिय्योन का
  rationale: हिन्दी में ‘भला करना’ के साथ संबंधकारक प्रयोग स्वाभाविक रूप से सिय्योन को परमेश्वर के हितकारी कार्य का लक्ष्य बताता है।
- source_word: תִּבְנֶה
  choice: बना दे
  rationale: क़ाल अपूर्ण रूप यहाँ विनती या कामना व्यक्त करता है। ‘बना दे’ प्रार्थनात्मक बल को स्वाभाविक हिन्दी में व्यक्त करता है और अपने आप ‘फिर से’ जोड़कर पुनर्निर्माण को अनिवार्य नहीं बनाता।
- source_word: חוֹמוֹת
  choice: दीवारें
  rationale: यह नगर की बहुवचन दीवारों के लिए सीधा और सर्वसुलभ हिन्दी शब्द है; ‘किलेबंदियाँ’ अनावश्यक रूप से अर्थ का विस्तार करेगा।
- source_word: יְרוּשָׁלִָם
  choice: यरूशलेम
  rationale: स्थान-नाम का हिन्दी बाइबलीय परंपरा में प्रचलित रूप।
theological_decisions:
- issue: परमेश्वर की प्रसन्नता/कृपा और पुनर्स्थापना का संबंध
  choice: पद को ऐसी प्रार्थना के रूप में रखा गया है जिसमें परमेश्वर की प्रसन्न इच्छा सिय्योन के प्रति ठोस भलाई और यरूशलेम की दीवारों के निर्माण में प्रकट हो।
  alternative: ‘अपनी इच्छा के अनुसार सिय्योन का भला कर,’ जिसमें רָצוֹן को मुख्यतः इच्छा के अर्थ में लिया जाए।
  rationale: इब्रानी רָצוֹן कृपा, प्रसन्नता या इच्छा का बोध करा सकता है। मुख्य पाठ और पादटिप्पणी मिलकर इस धर्मवैचारिक तनाव को बिना किसी एक अर्थ में सीमित किए सुरक्षित रखते हैं।
translation_notes:
  register: भाषा आधुनिक, प्रार्थनात्मक और गरिमापूर्ण रखी गई है। ‘भला कर’ मूल क्रिया की सीधाई बनाए रखता है, और ‘बना दे’ हिन्दी में विनती का स्वाभाविक भाव देता है।
