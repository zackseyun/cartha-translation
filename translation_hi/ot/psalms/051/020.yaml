id: PSA.51.20
reference: Psalms 51:20
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אָ֤ז תַּחְפֹּ֣ץ זִבְחֵי צֶ֭דֶק עוֹלָ֣ה וְ/כָלִ֑יל אָ֤ז יַעֲל֖וּ עַל מִזְבַּחֲ/ךָ֣ פָרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/020.yaml
  text: Then you will delight in righteous sacrifices[a], in burnt offerings and whole burnt offerings[c][b]; then bulls will be offered on your altar.
translation:
  language: hi
  text: तब तू धार्मिकता के बलिदानों[a], होमबलि और पूर्ण होमबलि[b] से प्रसन्न होगा; तब तेरी वेदी पर बैल चढ़ाए जाएँगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “धार्मिक बलिदान”।
    reason: צֶדֶק की संबंध-रचना को हिन्दी में गुणसूचक विशेषण के रूप में भी समझा जा सकता है।
  - marker: b
    text: या “होमबलि और सम्पूर्ण बलि”; इब्रानी यहाँ “होमबलि” और “पूर्ण/सम्पूर्ण बलि” के लिए अलग शब्द रखता है।
    reason: עוֹלָה וְכָלִיל की संरचना को दो संबद्ध बलिदानी पदों या निकट संयुक्त अभिव्यक्ति के रूप में समझने की वास्तविक lexical ambiguity सुरक्षित की गई है।
lexical_decisions:
- source_word: תַּחְפֹּץ
  choice: प्रसन्न होगा
  rationale: חפץ यहाँ किसी वस्तु को स्वीकार करते हुए उससे प्रसन्न होने का भाव देता है। आधुनिक हिन्दी में “से प्रसन्न होगा” स्वाभाविक है और पुनः स्वीकार की गई उपासना के प्रसंग में उपयुक्त बैठता है।
- source_word: זִבְחֵי צֶדֶק
  choice: धार्मिकता के बलिदान
  rationale: इब्रानी संबंध-रचना का निकट रूप रखते हुए यह צֶדֶק की नैतिक और वाचागत गहराई को सुरक्षित रखता है; इसे केवल विधिपूर्वक किए गए बलिदानों तक सीमित नहीं करता।
- source_word: עוֹלָה
  choice: होमबलियाँ
  rationale: यह उस मानक बलिदान का प्रचलित हिन्दी नाम है जिसे वेदी पर जलाया जाता था।
- source_word: וְכָלִיל
  choice: पूर्ण होमबलियाँ
  rationale: כָלִיל बलि के पूर्णतः अर्पित या भस्म किए जाने पर बल देता है। “पूर्ण होमबलियाँ” עוֹלָה से इसका निकट संबंध भी दिखाता और उसका विशेष बल भी बनाए रखता है।
- source_word: יַעֲלוּ
  choice: चढ़ाए जाएँगे
  rationale: עלה का हिफ़ील रूप बलिदानी प्रसंग में वेदी पर अर्पित करने को व्यक्त करता है। हिन्दी में “चढ़ाए जाएँगे” स्वाभाविक धार्मिक प्रयोग है और ऊपर चढ़ाने की मूल छवि भी रखता है।
- source_word: מִזְבַּחֲךָ
  choice: तेरी वेदी
  rationale: परमेश्वर को सीधे एकवचन संबोधन और बलिदान की ठोस वेदी—दोनों को स्पष्ट रूप से सुरक्षित रखता है।
- source_word: פָרִים
  choice: बैल
  rationale: यह פָרִים का सीधा और प्रसंगानुकूल हिन्दी अर्थ है।
- source_word: אָז ... אָז
  choice: तब ... तब
  rationale: दोनों occurrences को रखकर इब्रानी पद की क्रमिक और परिणामसूचक संरचना सुरक्षित की गई है।
theological_decisions:
- issue: भजन में टूटे और पश्चातापी मन पर बल दिए जाने के बाद बलिदानों की स्वीकार्यता
  choice: पद को पुनर्स्थापित और स्वीकार्य वास्तविक बलिदानी उपासना के रूप में प्रस्तुत किया गया है।
  alternative: बलिदानों को केवल आंतरिक धार्मिकता का रूपक मानना, या इस पद को केवल बाद का मंदिर-केंद्रित जोड़ समझकर अनुवाद में उसका ठोस अर्थ हल्का करना।
  rationale: 'पद की बलिदानी शब्दावली को ज्यों का त्यों ठोस रखा गया है। इस प्रकार पिछले पदों के साथ मौजूद तनाव बना रहता है: बलिदान निरपेक्ष रूप से अस्वीकार नहीं, परन्तु पश्चाताप से अलग होकर स्वीकार्य भी नहीं बताए गए।'
- issue: עוֹלָה וְכָלִיל के बीच संबंध
  choice: “होमबलियों और पूर्ण होमबलियों” द्वारा दोनों पदों को अलग किंतु निकट संबद्ध रखा गया है।
  alternative: इसे केवल एक संयुक्त पद “सम्पूर्ण होमबलि” के रूप में लेना।
  rationale: इब्रानी में दो शब्द और संयोजक उपस्थित हैं। अनुवाद संभावित बलाघात या निकटार्थक संबंध को दर्शाता है, पर दोनों को चुपचाप एक ही पद में विलीन नहीं करता।
translation_notes:
  register: दाऊद की परमेश्वर से सीधी प्रार्थना के अनुरूप गरिमापूर्ण एकवचन “तू/तेरी” रखा गया है। भाषा आधुनिक और सहज है, जबकि “होमबलि” तथा “वेदी” जैसे स्थापित बाइबलीय बलिदानी शब्द बनाए गए हैं।
