lexical_decisions:
- source_word: הֵן
  choice: देखो
  rationale: यह आरंभिक अव्यय कथन पर गंभीर और जोरदार ध्यान खींचता है। ‘देखो’ उसके काव्यात्मक बल को बनाए रखता है; ‘निश्चय ही’ भी संभव है।
- source_word: בְּעָוֹן
  choice: अधर्म में
  rationale: עָוֹן नैतिक टेढ़ेपन, अधर्म या दोष को सूचित कर सकता है। ‘अधर्म में’ मूल पूर्वसर्ग और अर्थ की गंभीरता को बिना अतिरिक्त व्याख्या के बनाए रखता है।
- source_word: חוֹלָלְתִּי
  choice: मैं उत्पन्न हुआ
  rationale: इस रूप का संदर्भ जन्म दिए जाने से है। ‘उत्पन्न हुआ’ जन्म की छवि को बनाए रखता है और हिन्दी में स्वाभाविक तथा गरिमापूर्ण है।
- source_word: וּבְחֵטְא
  choice: और पाप में
  rationale: यह חֵטְא का सीधा और स्वाभाविक अनुवाद है तथा पहले खंड के ‘अधर्म में’ के साथ काव्यात्मक समानांतरता बनाए रखता है।
- source_word: יֶחֱמַתְנִי
  choice: मुझे गर्भ में धारण किया
  rationale: संदर्भ में क्रिया गर्भधारण को व्यक्त करती है। यह वाक्य जन्म और गर्भाधान के समानांतर बिंब को स्पष्ट और स्वाभाविक हिन्दी में रखता है।
- source_word: אִמִּי
  choice: मेरी माँ
  rationale: मूल के संबंधसूचक संज्ञा-रूप का सीधा अनुवाद।
theological_decisions:
- issue: क्या पद माँ के व्यक्तिगत पाप, गर्भाधान से भजनकार की पापमयता, या पश्चात्ताप की काव्यात्मक अतिशयोक्ति की शिक्षा देता है
  choice: 'इब्रानी को सीधे रूप में रखा गया है: भजनकार अपने गर्भाधान और जन्म को अधर्म और पाप के संबंध में व्यक्त करता है, पर उस संबंध की धर्मवैज्ञानिक व्याख्या तय नहीं की गई।'
  alternative: इसे माँ के पाप का उल्लेख, गर्भाधान से जन्मजात पापमयता का कथन, या पश्चात्ताप की काव्यात्मक अतिशयोक्ति माना जा सकता है।
  rationale: मूल पाठ गर्भाधान और जन्म को עָוֹן तथा חֵטְא से जोड़ता है, लेकिन यह स्पष्ट नहीं करता कि यह संबंध किस प्रकार समझा जाए। इसलिए अनुवाद वास्तविक धर्मवैज्ञानिक तनाव को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में काव्यात्मक, गंभीर और सामान्य पाठकों के लिए सुबोध शैली। ‘अधर्म में’ और ‘पाप में’ की समानांतर संरचना सुरक्षित रखी गई है; संप्रदायगत व्याख्या नहीं जोड़ी गई।
