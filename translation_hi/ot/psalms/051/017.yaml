source:
  edition: WLC
  text: כִּ֤י לֹא תַחְפֹּ֣ץ זֶ֣בַח וְ/אֶתֵּ֑נָה ע֝וֹלָ֗ה לֹ֣א תִרְצֶֽה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/017.yaml
  text: For you do not delight in sacrifice[a], or I would give it; you do not take pleasure in burnt offering.
translation:
  language: hi
  text: क्योंकि बलिदान से आप प्रसन्न नहीं होते—वरना मैं उसे चढ़ाता; होमबलि से आपको प्रसन्नता नहीं होती।[क]
  philosophy: optimal-equivalence
  footnotes:
  - marker: क
    text: या, “क्योंकि आप बलिदान की इच्छा नहीं करते, नहीं तो मैं उसे देता।” इब्रानी संयोजक और वाक्य-क्रम अधिक औपचारिक ढंग से ऐसा अनुवाद भी संभव बनाते हैं।
    reason: इब्रानी כִּי तथा וְאֶתֵּנָה के वाक्यगत संबंध के वैकल्पिक, अधिक औपचारिक अनुवाद को दर्शाना।
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण प्रस्तुत करता है; हिंदी में ‘क्योंकि’ तर्क-संबंध को स्वाभाविक और स्पष्ट रखता है।
- source_word: לֹא תַחְפֹּץ
  choice: आप प्रसन्न नहीं होते
  rationale: חפץ में इच्छा के साथ प्रसन्नता या रुचि का भाव है; यह चयन केवल ‘चाहना’ की अपेक्षा उस भावात्मक अर्थ को बेहतर व्यक्त करता है।
- source_word: זֶבַח
  choice: बलिदान
  rationale: यह बलि के लिए प्रयुक्त सामान्य उपासना-संबंधी शब्द है; आधुनिक हिंदी में ‘बलिदान’ स्वाभाविक और पर्याप्त रूप से सटीक है।
- source_word: וְאֶתֵּנָה
  choice: वरना मैं उसे चढ़ाता
  rationale: 'संदर्भ में וְ को परिणामात्मक अथवा शर्तगत अर्थ में समझना उचित है: यदि परमेश्वर बलिदान चाहते, तो भजनकार उसे अर्पित करता। ‘उसे’ का संकेत पिछले ‘बलिदान’ की ओर है और ‘चढ़ाता’ उपासना-संदर्भ में נָתַן के आशय को स्वाभाविक बनाता है।'
- source_word: עוֹלָה
  choice: होमबलि
  rationale: यह पूरी तरह जलाई जाने वाली विशिष्ट बलि का पारंपरिक और संक्षिप्त हिंदी पद है।
- source_word: לֹא תִרְצֶה
  choice: आपको प्रसन्नता नहीं होती
  rationale: רצה यहाँ अनुकूल स्वीकृति या प्रसन्नता का भाव देता है। यह पहले खंड के समानांतर है, पर वाक्य-विन्यास में हल्का अंतर बनाए रखता है।
theological_decisions:
- issue: बलिदान के विषय में पद का आशय
  choice: कथन को सीधा रखा गया है कि भजनकार की पश्चातापपूर्ण स्थिति में बलिदान अपने आप में परमेश्वर को प्रसन्न नहीं करता।
  alternative: इसे समस्त बलिदान-व्यवस्था का सार्वभौमिक और पूर्ण निषेध मानना।
  rationale: भजन 51 और व्यापक इब्रानी शास्त्र के संदर्भ में बाहरी अनुष्ठान और सही हृदय के बीच तनाव बना रहता है। अनुवाद इस तनाव को सुरक्षित रखता है और पद में कोई अतिरिक्त धर्मसैद्धांतिक निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिंदी में आदरसूचक ‘आप’ का प्रयोग किया गया है। भाषा काव्यात्मक किंतु सामान्य पाठक के लिए स्पष्ट है। दोनों समानांतर पंक्तियों में ‘प्रसन्न’ रखा गया है, जबकि उनकी संरचना में भिन्नता से इब्रानी क्रियाओं का हल्का अंतर संकेतित होता है।
