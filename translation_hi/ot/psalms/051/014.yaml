  text: I will teach transgressors your ways[a], and sinners will return to you.
translation:
  language: hi
  text: मैं अपराधियों को तेरे मार्गों की शिक्षा दूँगा, और पापी तेरी ओर लौटेंगे[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘तेरी ओर मुड़ेंगे’ अथवा ‘तेरी ओर फिर लौटेंगे।’ इब्रानी क्रिया मुड़ने और लौटने—दोनों अर्थ व्यक्त कर सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲלַמְּדָה
  choice: मैं ... सिखाऊँगा
  rationale: למד के हिफ़ील, प्रथम पुरुष एकवचन रूप में संकल्प या अभिप्राय का भाव है। प्रसंग में पुनर्स्थापना के फलस्वरूप भजनकार का निश्चय व्यक्त होता है; इसलिए भविष्यकालीन ‘सिखाऊँगा’ स्वाभाविक है।
- source_word: פֹשְׁעִים
  choice: अपराधियों
  rationale: פשע जानबूझकर किए गए उल्लंघन या विद्रोह का बोध कराता है। ‘अपराधियों’ नैतिक उल्लंघन का भाव बनाए रखता है और सामान्य आधुनिक हिन्दी में सहज है।
- source_word: דְּרָכֶיךָ
  choice: तेरे मार्ग
  rationale: דרך का बहुवचन यहाँ परमेश्वर की चाल, इच्छा और आचरण के निर्देशों की रूपकात्मक अभिव्यक्ति है। ‘तेरे मार्ग’ मूल रूपक को संक्षिप्त और गरिमापूर्ण ढंग से सुरक्षित रखता है।
- source_word: חַטָּאִים
  choice: पापी
  rationale: חטאים के लिए ‘पापी’ सीधा, प्रचलित और समानांतर पद ‘अपराधियों’ के अनुकूल अनुवाद है।
- source_word: אֵלֶיךָ
  choice: तेरी ओर
  rationale: पूर्वसर्ग אֶל दिशा—‘की ओर/के पास’—व्यक्त करता है। ‘तेरी ओर’ मुड़ने अथवा लौटने, दोनों संभावित अर्थों के साथ स्वाभाविक बैठता है।
- source_word: יָשׁוּבוּ
  choice: लौटेंगे
  rationale: שוב का अर्थ ‘मुड़ना’, ‘लौटना’ या ‘फिर लौटना’ हो सकता है। पश्चात्ताप के इस प्रसंग में ‘लौटेंगे’ संबंध की पुनर्स्थापना का भाव देता है, जबकि पादटिप्पणी वास्तविक शाब्दिक विकल्प सुरक्षित रखती है।
theological_decisions:
- issue: שוב में पश्चात्ताप का भाव
  choice: तेरी ओर लौटेंगे
  alternative: तेरी ओर मुड़ेंगे / तेरी ओर फिर लौटेंगे
  rationale: इब्रानी क्रिया मुड़ने और लौटने दोनों को व्यक्त कर सकती है। इस प्रायश्चित्तमय प्रसंग में ‘लौटेंगे’ संबंधपरक भाव को स्वाभाविक रूप से व्यक्त करता है, पर किसी विशिष्ट मत-सिद्धांत को आरोपित नहीं करता; पादटिप्पणी अर्थगत अस्पष्टता बनाए रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और काव्यात्मक शैली। परमेश्वर के लिए एकवचन आत्मीय संबोधन ‘तेरे’ रखा गया है, जो भजन की सीधी प्रार्थनात्मक वाणी के अनुरूप है।
