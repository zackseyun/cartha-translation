  text: כִּֽי פְ֭שָׁעַ/י אֲנִ֣י אֵדָ֑ע וְ/חַטָּאתִ֖/י נֶגְדִּ֣/י תָמִֽיד־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/004.yaml
  text: For I know my transgressions, and my sin is always before me.
translation:
  language: hi
  text: 'क्योंकि मैं अपने अपराधों को जानता हूँ,

    और मेरा पाप सदा मेरे सामने रहता है।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले निवेदन का कारण या आधार प्रस्तुत करता है; ‘क्योंकि’ हिन्दी में इस व्याख्यात्मक संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: פְשָׁעַי
  choice: अपने अपराधों
  rationale: פשע विद्रोह या मर्यादा-भंग से जुड़े अपराधों को दर्शाता है। ‘अपराध’ नैतिक गंभीरता बनाए रखता है और बहुवचन को भी सुरक्षित रखता है।
- source_word: אֲנִי אֵדָע
  choice: मैं ... जानता हूँ
  rationale: ידע यहाँ अपने दोष के प्रति सचेत पहचान को व्यक्त करता है। ‘जानता हूँ’ सीधा अर्थ देता है, जबकि ‘स्वीकार करता हूँ’ मूल क्रिया में स्पष्ट निहित न होने वाला भाव जोड़ सकता है। स्पष्ट ‘मैं’ इब्रानी सर्वनाम के बल को कुछ हद तक बनाए रखता है।
- source_word: וְחַטָּאתִי
  choice: और मेरा पाप
  rationale: इस स्वीकारोक्ति के संदर्भ में חטאת का अर्थ ‘पाप’ है, न कि ‘पापबलि’। मूल का एकवचन रखा गया है।
- source_word: נֶגְדִּי
  choice: मेरे सामने
  rationale: यह उस वस्तु की छवि देता है जो वक्ता के सम्मुख उपस्थित है; ‘मेरे सामने’ आधुनिक हिन्दी में स्वाभाविक और रूपक के प्रति निष्ठावान है।
- source_word: תָמִיד
  choice: सदा
  rationale: यह निरंतर बने रहने का भाव व्यक्त करता है। ‘सदा’ संक्षिप्त, गरिमापूर्ण और काव्यात्मक हिन्दी है।
- source_word: נֶגְדִּי תָמִיד
  choice: सदा मेरे सामने रहता है
  rationale: इब्रानी में अस्तित्वसूचक क्रिया अव्यक्त है; हिन्दी में ‘रहता है’ जोड़ने से निरंतर उपस्थित रहने का भाव स्पष्ट और स्वाभाविक बनता है।
theological_decisions:
- issue: ‘अपराधों’ और ‘पाप’ का पारस्परिक संबंध
  choice: 'दोनों अलग शब्दों और उनकी मूल वचन-संख्या को बनाए रखना: ‘अपराधों’ और ‘पाप’'
  alternative: दोनों को एक ही सामान्य शब्द, जैसे ‘पापों’, से व्यक्त करना
  rationale: इब्रानी में פשע और חטאת दो संबंधित किंतु भिन्न शब्द हैं, और क्रमशः बहुवचन तथा एकवचन में आते हैं। यह भेद स्वीकारोक्ति की काव्यात्मक और धर्मवैचारिक बनावट को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल पर गरिमापूर्ण काव्यात्मक शैली। वाक्य मूल इब्रानी की दो समानांतर पंक्तियों और स्वीकारोक्ति के गंभीर स्वर को बनाए रखता है।
