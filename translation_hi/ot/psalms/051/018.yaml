source:
  edition: WLC
  text: זִֽבְחֵ֣י אֱלֹהִים֮ ר֪וּחַ נִשְׁבָּ֫רָ֥ה לֵב נִשְׁבָּ֥ר וְ/נִדְכֶּ֑ה אֱ֝לֹהִ֗ים לֹ֣א תִבְזֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/018.yaml
  text: The sacrifices of God are a broken spirit[a]; a broken and crushed heart, O God[b], you will not despise.
translation:
  language: hi
  text: 'परमेश्वर के बलिदान हैं: टूटी हुई आत्मा[a]; टूटे और कुचले हुए हृदय को, हे परमेश्वर[b], तू तुच्छ न जानेगा।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘पश्चात्तापी आत्मा।’
    reason: lexical_alternative
  - marker: b
    text: या, ‘टूटे और पश्चात्तापी हृदय को, हे परमेश्वर।’
    reason: lexical_alternative
lexical_decisions:
- source_word: זִבְחֵי אֱלֹהִים
  choice: परमेश्वर के बलिदान
  rationale: इब्रानी संबंध-वाक्यांश का सीधा रूप सुरक्षित रखा गया है। संदर्भ में आशय परमेश्वर को स्वीकार्य बलिदानों से है, पर मुख्य पाठ में उसकी व्याख्या जोड़ना उचित नहीं।
- source_word: רוּחַ נִשְׁבָּרָה
  choice: टूटी हुई आत्मा
  rationale: נשבר का टूटने का ठोस रूपक सुरक्षित रहता है और רוּחַ के लिए ‘आत्मा’ आधुनिक धार्मिक हिन्दी में स्वाभाविक है।
- source_word: לֵב נִשְׁבָּר
  choice: टूटा हुआ हृदय
  rationale: दोनों शब्दों का सीधा और स्वाभाविक हिन्दी समतुल्य है तथा पहले प्रयुक्त टूटने के रूपक को दोहराता है।
- source_word: וְנִדְכֶּה
  choice: और कुचला हुआ
  rationale: דכה से निकला शब्द दबाकर कुचल दिए जाने का बिंब देता है। ‘पश्चात्तापी’ अर्थगत व्याख्या होगी, इसलिए उसे वैकल्पिक पादटिप्पणी में रखा गया है।
- source_word: לֹא תִבְזֶה
  choice: तू तुच्छ न जानेगा
  rationale: בזה के तिरस्कार या तुच्छ समझने के अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है; भविष्यसूचक क्रियारूप भी सुरक्षित है।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: निर्माण-वाक्यांश और सीधे संबोधन, दोनों में אֱלֹהִים का मानक हिन्दी रूप।
theological_decisions:
- issue: पश्चात्ताप के संदर्भ में बलिदान का रूपक
  choice: भीतरी दीनता—टूटी आत्मा और टूटा-कुचला हृदय—को ‘परमेश्वर के बलिदान’ कहा गया है।
  alternative: इसे बाहरी बलिदानों का पूर्ण निषेध या केवल भावनात्मक दुःख का वर्णन माना जाए।
  rationale: इब्रानी पाठ भीतरी दशा को बलिदान की भाषा में प्रस्तुत करता है, पर इस एक वाक्य में बलिदान-व्यवस्था के पूर्ण उन्मूलन का सिद्धांत नहीं बताता। अनुवाद इस तनाव को बिना सुलझाए सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज काव्यात्मक रूप। ‘तू’ भजन में परमेश्वर के सीधे और निकट संबोधन को बनाए रखता है। मुख्य पाठ में टूटने और कुचले जाने के इब्रानी रूपक सुरक्षित हैं; ‘पश्चात्तापी’ को व्याख्यात्मक विकल्प के रूप में पादटिप्पणियों में दिया गया है।
