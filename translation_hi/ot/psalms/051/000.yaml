lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: संगीत-निर्देशक के लिए
  rationale: भजनों के शीर्षकों में यह शब्द संगीत का नेतृत्व या निरीक्षण करने वाले व्यक्ति को सूचित करता है। ‘संगीत-निर्देशक’ आधुनिक हिन्दी में स्वाभाविक और व्यापक है; उपसर्ग לַ को ‘के लिए’ से व्यक्त किया गया है, यद्यपि ‘संगीत-निर्देशक को’ भी सम्भव है।
- source_word: מִזְמוֹר
