- source_word: לְדָוִד
  choice: दाऊद का
  rationale: व्यक्तिनाम के साथ לְ रचना, सम्बन्ध, समर्पण या स्वामित्व का संकेत दे सकता है। ‘दाऊद का’ इस सम्बन्ध को ‘दाऊद द्वारा’ की अपेक्षा कम निर्णायक रखता है और मूल की व्यापकता को यथासम्भव सुरक्षित करता है।
