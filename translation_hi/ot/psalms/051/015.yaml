base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/015.yaml
  text: Deliver me from bloodguilt[a], O God, God of my salvation[b], and my tongue will sing aloud of your righteousness.
translation:
  language: hi
  text: हे परमेश्वर, मुझे रक्तपात के दोष से छुड़ा[a], मेरे उद्धार के परमेश्वर; तब मेरी जीभ तेरी धार्मिकता का आनंद से गान करेगी।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “रक्तपात से” अथवा “रक्त-दोष से”; इब्रानी में शाब्दिक रूप से “रक्तों से” है, जो प्रायः रक्तपात या उसके दोष का मुहावरा है।
    reason: lexical_alternative
  - marker: b
    text: “धार्मिकता” का अर्थ यहाँ “न्याय” भी हो सकता है; इब्रानी शब्द में नैतिक सहीपन और न्यायिक न्याय, दोनों की अर्थ-छाया हो सकती है।
    reason: alternative_reading
lexical_decisions:
- source_word: הַצִּילֵנִי
  choice: मुझे छुड़ा
  rationale: नצל के आज्ञार्थक रूप और प्रथम पुरुष एकवचन प्रत्यय को सीधी विनती के रूप में व्यक्त करता है; ‘छुड़ा’ संकट और दोष से मुक्ति, दोनों के लिए स्वाभाविक हिंदी है।
- source_word: מִדָּמִים
  choice: रक्तपात के दोष से
  rationale: बहुवचन דמים यहाँ केवल शाब्दिक ‘रक्त’ नहीं, बल्कि बहाए गए रक्त और उससे उत्पन्न अपराध-दोष का संकेत देता है। यह अनुवाद पश्चात्ताप के प्रसंग में दोष का भाव स्पष्ट रखते हुए ‘रक्तपात’ को भी बनाए रखता है।
- source_word: אֱלֹהִים
  choice: हे परमेश्वर
  rationale: यह प्रत्यक्ष संबोधन है; ‘हे’ संबोधन को स्पष्ट करता है और ‘परमेश्वर’ आधुनिक हिंदी बाइबलीय प्रयोग में स्वाभाविक तथा गरिमापूर्ण है।
- source_word: אֱלֹהֵי תְּשׁוּעָתִי
  choice: हे मेरे उद्धारकर्ता परमेश्वर
  rationale: शाब्दिक संरचना ‘मेरे उद्धार के परमेश्वर’ हिंदी में कम स्वाभाविक है। ‘मेरे उद्धारकर्ता परमेश्वर’ उसी संबंध को सहज रूप में व्यक्त करता है, बिना उद्धार के स्वरूप को सीमित किए।
- source_word: תְּרַנֵּן
  choice: जयजयकार करेगी
  rationale: רנן ऊँचे स्वर में आनंदपूर्ण गायन या जयघोष का बोध देता है। स्त्रीलिंग क्रिया ‘करेगी’ का कर्ता ‘मेरी जीभ’ है और परिणामसूचक भाव ‘तब’ से व्यक्त हुआ है।
- source_word: לְשׁוֹנִי
  choice: मेरी जीभ
  rationale: मूल की काव्यात्मक देह-छवि को बनाए रखता है; इसे केवल ‘मैं’ या ‘मेरा मुँह’ नहीं बनाया गया।
- source_word: צִדְקָתֶךָ
  choice: तेरी धार्मिकता
  rationale: צדקה में नैतिक सहीपन, न्याय और उद्धारकारी सत्यनिष्ठा के परस्पर जुड़े भाव हो सकते हैं। ‘धार्मिकता’ व्यापक मुख्य अर्थ को सुरक्षित रखती है; ‘न्याय’ का संभव भाव पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: דמים का अर्थ
  choice: रक्तपात के दोष
  alternative: रक्तपात; रक्त-दोष
  rationale: भजन 51 के पश्चात्तापपूर्ण संदर्भ में यह अभिव्यक्ति बहाए गए रक्त से जुड़े अपराध-दोष की ओर संकेत करती है। फिर भी इब्रानी बहुवचन की व्यापकता के कारण पादटिप्पणी में वैकल्पिक अर्थ सुरक्षित रखे गए हैं।
- issue: צִדְקָתֶךָ की अर्थ-छाया
  choice: तेरी धार्मिकता
  alternative: तेरा न्याय
  rationale: इब्रानी शब्द नैतिक धार्मिकता और न्यायिक न्याय दोनों का भाव रख सकता है। मुख्य पाठ में व्यापक पारंपरिक अर्थ रखा गया है, जबकि न्याय की वैध अर्थ-छाया पादटिप्पणी में दी गई है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण काव्यात्मक संबोधन रखा गया है। ‘तब’ ने विनती के फलस्वरूप होने वाली स्तुति का संबंध स्पष्ट किया है। एकवचन निकट संबोधन ‘तेरी’ भजन की सीधी प्रार्थना-शैली को बनाए रखता है।
