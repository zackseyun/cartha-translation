base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/011.yaml
  text: Create in me a clean heart[a], O God[b], and renew a steadfast spirit within me.
translation:
  language: hi
  text: हे परमेश्वर, मेरे भीतर शुद्ध हृदय[a] रच दे, और मेरे भीतर स्थिर आत्मा[b] को नया कर।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “निर्मल हृदय।”
    reason: lexical_alternative
  - marker: b
    text: या “सही आत्मा” या “दृढ़ आत्मा।” इब्रानी में ऐसी आत्मा का भाव है जो स्थिर, दृढ़ या स्थापित हो।
    reason: alternative_reading
lexical_decisions:
- source_word: לֵב טָהוֹר
  choice: शुद्ध हृदय
  rationale: ‘हृदय’ इब्रानी मानव-दृष्टि में विचार, इच्छा और भावनाओं सहित भीतरी व्यक्तित्व को व्यक्त करता है। ‘शुद्ध’ नैतिक और शुद्धिकरण-संबंधी दोनों अर्थों को स्वाभाविक हिंदी में बनाए रखता है।
- source_word: בְּרָא לִי
  choice: मेरे भीतर ... रच दे
  rationale: ברא परमेश्वर के सृजनात्मक कार्य का प्रबल शब्द है; ‘रच दे’ प्रार्थना की आत्मीयता और भीतर होने वाले मूलभूत परिवर्तन को व्यक्त करता है। לִי का शाब्दिक अर्थ ‘मेरे लिए/मुझे’ है, पर संदर्भ में ‘मेरे भीतर’ सहज और आशय-संगत है।
- source_word: אֱלֹהִים
  choice: हे परमेश्वर
  rationale: यह सीधा संबोधन है। ‘हे परमेश्वर’ आधुनिक, गरिमापूर्ण और प्रार्थनात्मक हिंदी में स्वाभाविक है।
- source_word: רוּחַ נָכוֹן
  choice: स्थिर आत्मा
  rationale: רוּחַ यहाँ मनुष्य की भीतरी प्रवृत्ति या आत्मिक दशा का व्यापक अर्थ रखता है। נָכוֹן दृढ़, स्थापित और अटल होने का भाव देता है; ‘स्थिर’ इस अर्थ को संक्षेप और स्वाभाविक रूप से व्यक्त करता है।
- source_word: חַדֵּשׁ בְּקִרְבִּי
  choice: मेरे अंतर्मन में ... नया कर
  rationale: חַדֵּשׁ का अर्थ नया करना या नवीकृत करना है। ‘नया कर’ सामान्य पाठक के लिए सीधा है, जबकि בְּקִרְבִּי की भीतर की स्थिति को ‘मेरे अंतर्मन में’ स्पष्ट करता है।
theological_decisions:
- issue: רוּחַ נָכוֹן में נָכוֹן का अर्थ
  choice: स्थिर आत्मा
  alternative: सही आत्मा; दृढ़ आत्मा
  rationale: इब्रानी शब्द केवल नैतिक ‘सहीपन’ नहीं, बल्कि दृढ़ता और स्थापित रहने का भाव भी रखता है। ‘स्थिर’ मूल की इस व्यापकता को बिना किसी विशिष्ट धर्मसैद्धांतिक व्याख्या के सुरक्षित रखता है।
- issue: רוּחַ का संदर्भ
  choice: मनुष्य की आत्मा/भीतरी प्रवृत्ति
  alternative: पवित्र आत्मा
  rationale: यहाँ समानांतर पद ‘हृदय’ और प्रथम पुरुष ‘मेरे अंतर्मन में’ मनुष्य की भीतरी आत्मिक दशा की ओर संकेत करते हैं। अनुवाद में केवल ‘आत्मा’ रखकर शब्द की व्यापकता और संभावित तनाव को बनाए रखा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी, प्रार्थनात्मक और काव्यात्मक गरिमा के साथ। ‘रच दे’ तथा ‘नया कर’ सहज लोकबोध बनाए रखते हैं; ‘अंतर्मन’ भीतरी स्थान को स्पष्ट करता है।
