source:
  edition: WLC
  text: הרבה כַּבְּסֵ֣/נִי מֵ/עֲוֺנִ֑/י וּֽ/מֵ/חַטָּאתִ֥/י טַהֲרֵֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/003.yaml
  text: Wash me thoroughly from my iniquity[c][b][a], and cleanse me from my sin.
translation:
  language: hi
  text: मेरे अधर्म से मुझे भली-भाँति धो डाल[a][b], और मेरे पाप से मुझे शुद्ध कर[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘मुझे बहुत अधिक धो’ अथवा ‘मुझे बार-बार धो’; इब्रानी तीव्रतासूचक शब्द प्रचुर, गहन या बारंबार धुलाई का भाव दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘अधर्म’ का अनुवाद ‘दोष’ या ‘अपराध’ भी हो सकता है; इब्रानी עָוֹן में गलत काम और उससे उत्पन्न दोष—दोनों का भाव हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: या ‘मुझे मेरे पाप से निर्मल कर।’
    reason: lexical_alternative
lexical_decisions:
- source_word: הַרְבֵּה
  choice: भली-भाँति
  rationale: यह क्रियाविशेषण अगली आज्ञा की तीव्रता या परिपूर्णता बढ़ाता है। ‘भली-भाँति’ आधुनिक हिन्दी में स्वाभाविक रूप से गहन और पूरी तरह धोए जाने का भाव व्यक्त करता है, पर स्पष्ट पुनरावृत्ति नहीं जोड़ता।
- source_word: כַּבְּסֵנִי
  choice: मुझे ... धो डाल
  rationale: כּבס मूलतः वस्त्र धोने के लिए प्रयुक्त क्रिया है और यहाँ गहरे शुद्धीकरण का चित्र प्रस्तुत करती है। ‘धो डाल’ उस सशक्त आज्ञार्थक भाव और धुलाई के बिंब को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: מֵעֲוֺנִי
  choice: मेरे अधर्म से
  rationale: עָוֹן में कुटिलता, अपराध और उससे उत्पन्न दोष का भाव हो सकता है। ‘अधर्म’ नैतिक गंभीरता बनाए रखता है और समानांतर ‘पाप’ से शब्दगत भेद भी बचाता है।
- source_word: וּמֵחַטָּאתִי
  choice: और मेरे पाप से
  rationale: חַטָּאת का इस पश्चात्तापपूर्ण प्रसंग में सीधा और स्वाभाविक अर्थ ‘पाप’ है।
- source_word: טַהֲרֵנִי
  choice: मुझे शुद्ध कर
  rationale: טהר स्वच्छ या शुद्ध करने को दर्शाता है और इसमें नैतिक तथा अनुष्ठानिक दोनों प्रतिध्वनियाँ हो सकती हैं। ‘शुद्ध कर’ हिन्दी में इन दोनों आयामों को संक्षेप में बनाए रखता है।
theological_decisions:
- issue: पश्चात्ताप से जुड़े समानांतर शब्द עָוֹן और חַטָּאת का अनुवाद
  choice: मुख्य पाठ में अलग शब्द ‘अधर्म’ और ‘पाप’ रखना
  alternative: עָוֹן को ‘दोष’ या ‘अपराध’ कहना, अथवा दोनों को सामान्य रूप से ‘पाप’ कहना
  rationale: इब्रानी पद में दो संबंधित किंतु पूर्णतः समान न होने वाले शब्द काव्यात्मक समानांतरता में हैं। उन्हें अलग रखना मूल पाठ की शब्द-संरचना और अर्थगत तनाव को बचाता है, बिना यह तय किए कि עָוֹן केवल कृत्य है या उससे उत्पन्न दोष।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और प्रार्थनात्मक रखी गई है। ‘भली-भाँति धो डाल’ सामान्य पाठक के लिए सहज है और मूल के धुलाई-बिंब तथा तीव्रता को बनाए रखता है।
