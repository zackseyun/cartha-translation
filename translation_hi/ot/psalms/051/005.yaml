  yaml_path: translation/ot/psalms/051/005.yaml
  text: Against you—you alone—I have sinned[a], and I have done what is evil in your eyes[b], so that you may be justified in your words and blameless in your judgment.
translation:
  language: hi
  text: तेरे विरुद्ध—केवल तेरे ही विरुद्ध—मैंने पाप किया है[a], और जो तेरी दृष्टि में बुरा है, वही मैंने किया है; ताकि जब तू बोलता है, तब तू धर्मी ठहरे, और जब तू न्याय करता है, तब निर्दोष ठहरे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “केवल तेरे ही विरुद्ध मैंने पाप किया है।” इब्रानी शब्दावली परमेश्वर पर उस पक्ष के रूप में विशेष बल देती है जिसके विरुद्ध अंततः पाप किया गया है।
    reason: lexical_alternative
  - marker: b
    text: या, “ताकि तू अपने वचन में धर्मी ठहरे और अपने न्याय में निर्दोष ठहरे।” इब्रानी में उद्देश्य और परिणाम, तथा “अपने वचन/न्याय में” और “जब तू बोलता/न्याय करता है,” दोनों अर्थ संभव हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: לְךָ לְבַדְּךָ
  choice: तेरे ही विरुद्ध—केवल तेरे ही विरुद्ध—
  rationale: לְ का अर्थ इस पाप-स्वीकार के प्रसंग में ‘विरुद्ध’ है। ‘केवल’ और पुनरुक्ति इब्रानी के तीव्र बल को बनाए रखते हैं।
- source_word: חָטָאתִי
  choice: मैंने पाप किया है
  rationale: इब्रानी पूर्ण क्रिया बीते कर्म का वर्तमान पाप-स्वीकार व्यक्त करती है; यह हिंदी में स्वाभाविक है।
- source_word: וְהָרַע בְּעֵינֶיךָ עָשִׂיתִי
  choice: और जो तेरी दृष्टि में बुरा है, वही मैंने किया है
  rationale: विशेषण का संज्ञात्मक प्रयोग ‘जो ... बुरा है’ से व्यक्त होता है; ‘तेरी दृष्टि में’ इब्रानी बिंब और परमेश्वर के मूल्यांकन दोनों को सुरक्षित रखता है। ‘वही’ वाक्य के अग्रस्थ ‘बुरे’ पर बल को दर्शाता है।
- source_word: לְמַעַן
  choice: इसलिए
  rationale: यहाँ अव्यय उद्देश्य अथवा परिणाम का संबंध व्यक्त कर सकता है। ‘इसलिए’ दाऊद के पाप को परमेश्वर की धार्मिकता का उद्देश्य बनाने की संभावित गलत समझ से बचते हुए परिणामात्मक संबंध व्यक्त करता है।
- source_word: תִּצְדַּק בְדָבְרֶךָ
  choice: जब तू बोलता है, तब तू धर्मी ठहरे
  rationale: צדק का न्यायिक भाव ‘धर्मी/सही सिद्ध होना’ है। בְדָבְרֶךָ को क्रियात्मक-कालिक रूप में लेना स्वाभाविक हिंदी देता है और इब्रानी अर्थ को बनाए रखता है।
- source_word: תִּזְכֶּה בְשָׁפְטֶךָ
  choice: जब तू न्याय करता है, तब निर्दोष ठहरे
  rationale: זכה शुद्ध, दोषरहित अथवा सही सिद्ध होने का न्यायिक भाव रखता है; ‘निर्दोष ठहरे’ समानांतरता और न्यायालयीय स्वर को सुरक्षित रखता है।
theological_decisions:
- issue: मानवीय पीड़ितों के होते हुए ‘केवल तेरे ही विरुद्ध’ का अर्थ
  choice: निरपेक्ष परमेश्वर-केंद्रित कथन को बिना नरम किए रखा गया
  alternative: सबसे बढ़कर तेरे विरुद्ध
  rationale: इब्रानी कथन तीखा और निरपेक्ष है। अनुवाद उस तनाव को बनाए रखता है कि पाप अंततः परमेश्वर के विरुद्ध है, बिना यह दावा जोड़े कि मनुष्यों के विरुद्ध कोई अपराध नहीं हुआ।
- issue: לְמַעַן द्वारा उद्देश्य या परिणाम
  choice: इसलिए
  alternative: ताकि
  rationale: इब्रानी उद्देश्य और परिणाम दोनों की छाया सह सकता है। ‘इसलिए’ परमेश्वर के धर्मी ठहरने और दाऊद के स्वीकार के संबंध को रखता है, पर यह संकेत कम करता है कि दाऊद ने परमेश्वर को सही सिद्ध करने के उद्देश्य से पाप किया।
- issue: अंतिम दो क्रियाओं का न्यायिक और नैतिक भाव
  choice: धर्मी ठहरे ... निर्दोष ठहरे
  alternative: सही सिद्ध हो ... शुद्ध ठहरे
  rationale: यह चयन परमेश्वर के वचन और न्याय में उसके सही तथा दोषरहित सिद्ध होने का न्यायिक-मूल्यात्मक भाव रखता है, बिना अतिरिक्त सांप्रदायिक अर्थ आरोपित किए।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण, प्रार्थनामय और सहज शैली रखी गई है। परमेश्वर को संबोधित करने के लिए ‘तू/तेरा’ का प्रयोग निकट और काव्यात्मक भजन-भाषा के अनुरूप है; यह अनादर का सूचक नहीं है। इब्रानी समानांतरता और कथन के धर्मवैचारिक तनाव को सुरक्षित रखा गया है।
