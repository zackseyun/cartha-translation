  text: Hide your face from my sins[b][a], and blot out all my iniquities.
translation:
  language: hi
  text: 'मेरे पापों से अपना मुख छिपा ले,

    और मेरे सारे अधर्म[a] मिटा दे।[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘अधर्म’ के लिए प्रयुक्त इब्रानी शब्द में ‘दोष’ का भाव भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘पोंछ दे’ अथवा ‘मिटा डाल’।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַסְתֵּר
  choice: छिपा ले
  rationale: हिफ़ील आज्ञार्थक क्रिया की विनती और ‘छिपाने’ के ठोस रूपक—दोनों को बनाए रखता है।
- source_word: פָּנֶיךָ
  choice: अपना मुख
  rationale: इब्रानी ‘मुख’ के मानवीय रूपक को सुरक्षित रखता है; इसे व्याख्यात्मक रूप से केवल ‘उपस्थिति’ नहीं बनाया गया।
- source_word: מֵחֲטָאָי
  choice: मेरे पापों से
  rationale: חטא के सामान्य अर्थ ‘पाप’ और מִן के ‘से’ संबंध को सीधे तथा स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְכָל
  choice: और मेरे सारे
  rationale: संयोजक और संपूर्णता के बल को स्वाभाविक हिन्दी शब्दक्रम में व्यक्त करता है।
- source_word: עֲוֺנֹתַי
  choice: मेरे सारे अधर्म
  rationale: עָוֹן को पहले चरण के ‘पाप’ से अलग रखते हुए उसकी कुटिलता/दोष की अर्थ-छाया को व्यक्त करता है; ‘अधर्म’ हिन्दी बाइबलीय प्रयोग में समझने योग्य है।
- source_word: מְחֵה
  choice: मिटा दे
  rationale: आज्ञार्थक विनती और लेख अथवा दाग मिटाने की छवि को सहज आधुनिक हिन्दी में बनाए रखता है।
theological_decisions:
- issue: पाप-संबंधी दो अलग इब्रानी शब्दों का निर्वाह
  choice: חטא के लिए ‘पाप’ और עון के लिए ‘अधर्म’
  alternative: दोनों के लिए ‘पाप’, अथवा עון के लिए ‘दोष’
  rationale: समानांतर पंक्तियों में मूल पाठ की शब्दगत भिन्नता और काव्यात्मक गहनता बनी रहती है, बिना दोनों के बीच कोई कठोर पारिभाषिक धर्मवैज्ञानिक भेद थोपे।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, प्रार्थनापूर्ण और गरिमापूर्ण शैली। ‘मुख छिपा ले’ मूल रूपक को बनाए रखता है; ‘मिटा दे’ सामान्य पाठक के लिए स्वाभाविक है।
