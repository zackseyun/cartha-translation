  yaml_path: translation/ot/psalms/104/005.yaml
  text: He founded the earth on its foundations[a]; it will not be shaken forever and ever.
translation:
  language: hi
  text: उसने पृथ्वी को उसकी नींवों पर स्थापित किया है[a]; वह युगानुयुग कभी नहीं डगमगाएगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “पृथ्वी को उसके आधारों पर दृढ़ किया”; इब्रानी में संसार की स्थिरता के लिए भवन-निर्माण की छवि प्रयुक्त हुई है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יָסַד
  choice: स्थापित किया है
  rationale: क्रिया का अर्थ नींव डालकर स्थापित करना है। हिंदी में ‘स्थापित किया’ स्वाभाविक है और ‘नींवों’ के साथ वास्तु-रूपक को बनाए रखता है। पूर्ण पक्ष वर्तमान स्थिरता से जुड़े बीते सृजन-कर्म को व्यक्त करता है।
- source_word: אֶרֶץ
  choice: पृथ्वी
  rationale: सृष्टि-भजन के संदर्भ में स्थानीय ‘भूमि’ की अपेक्षा समूची पृथ्वी अभिप्रेत है।
- source_word: עַל
  choice: पर
  rationale: यह आधार अथवा सहारे पर स्थित किए जाने का सीधा संबंध व्यक्त करता है।
- source_word: מְכוֹנֶיהָ
  choice: उसकी नींवों
  rationale: यह शब्द आधार, स्थिर स्थान या नींव का बोध कराता है। ‘नींवों’ से पद का वास्तु-रूपक स्पष्ट और स्वाभाविक रहता है।
- source_word: בַּל תִּמּוֹט
  choice: कभी नहीं डगमगाएगी
  rationale: निषेध के साथ क्रिया अस्थिर होने, हिलने या डगमगाने का अर्थ देती है। ‘डगमगाएगी’ स्थिरता की काव्यात्मक छवि को सहज हिंदी में बनाए रखता है; ‘कभी’ दीर्घकालिक निषेध को स्वाभाविक बनाता है।
- source_word: עוֹלָם וָעֶד
  choice: युगानुयुग
  rationale: युग्मित इब्रानी अभिव्यक्ति अनंत और प्रबलित अवधि बताती है। ‘युगानुयुग’ उसका संक्षिप्त, गरिमापूर्ण और प्रचलित हिंदी समतुल्य है।
theological_decisions:
- issue: सृष्टि-वर्णन में ब्रह्मांड संबंधी वास्तु-रूपक
  choice: पृथ्वी, उसकी नींवों और उसके न डगमगाने की मूल काव्यात्मक छवि को बनाए रखा गया है।
  alternative: उसने संसार को ऐसा स्थिर किया कि वह कभी अपनी जगह से नहीं हटेगा।
  rationale: पद को आधुनिक वैज्ञानिक गद्य या किसी विशेष ब्रह्मांड-विज्ञान में बदलने के बजाय इब्रानी कविता की प्रत्यक्ष वास्तु-छवि और पृथ्वी की स्थिरता के दावे को सुरक्षित रखना उचित है।
translation_notes:
  register: आधुनिक मानक हिंदी का सहज किंतु गरिमापूर्ण काव्यात्मक रूप अपनाया गया है। ‘नींवों’ और ‘डगमगाएगी’ सामान्य पाठक के लिए स्पष्ट हैं तथा मूल की वास्तु और स्थिरता संबंधी छवियों को सुरक्षित रखते हैं।
