  yaml_path: translation/ot/psalms/104/030.yaml
  text: When you send out your Spirit[a], they are created[b], and you renew the face of the ground.
translation:
  language: hi
  text: जब तू अपनी आत्मा[a] भेजता है, तब वे रचे जाते हैं[b], और तू भूमि के स्वरूप को नया करता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपनी श्वास” अथवा “अपनी हवा”; हिब्रू शब्द רוּחַ में ये तीनों अर्थ हो सकते हैं।
    reason: lexical_alternative
  - marker: b
    text: या “तू अपनी आत्मा भेजता है, वे रचे जाते हैं।”
    reason: previous_rendering
lexical_decisions:
- source_word: תְּשַׁלַּח
  choice: भेजता है
  rationale: पिएल रूप का सामान्य अर्थ ‘भेजना’ है। ‘भेजता है’ आधुनिक हिन्दी में स्वाभाविक है और परमेश्वर की सक्रिय जीवनदायी क्रिया को व्यक्त करता है।
- source_word: רוּחֲךָ
  choice: अपनी आत्मा
  rationale: רוּחַ का अर्थ ‘आत्मा’, ‘श्वास’ या ‘वायु’ हो सकता है। सृष्टि और जीवन देने के प्रसंग में ‘अपनी आत्मा’ उपयुक्त है; अन्य वास्तविक अर्थों को पादटिप्पणी में रखा गया है।
- source_word: יִבָּרֵאוּן
  choice: वे रचे जाते हैं
  rationale: ברא का निफ़अल रूप ‘रचा जाना’ बताता है। यह अनुवाद कर्मवाच्य अर्थ को बनाए रखता है और इसमें ‘फिर से’ जैसा अतिरिक्त भाव नहीं जोड़ता।
- source_word: וּתְחַדֵּשׁ
  choice: और तू ... नया कर देता है
  rationale: חדשׁ के पिएल का अर्थ ‘नया करना’ या ‘नवीकृत करना’ है। यह सहज हिन्दी में पुनर्नवीकरण का भाव रखता है।
- source_word: פְּנֵי
  choice: रूप
  rationale: शाब्दिक अर्थ ‘मुख’ है, पर ‘भूमि का मुख’ आधुनिक हिन्दी में अस्वाभाविक लगता है। ‘भूमि का रूप’ काव्यात्मकता और उसकी दिखाई देने वाली दशा—दोनों को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: אֲדָמָה
  choice: भूमि
  rationale: אֲדָמָה मिट्टी या धरती की भूमि को दर्शाता है। ‘भूमि’ व्यापक ब्रह्मांडीय ‘पृथ्वी’ की अपेक्षा मूल शब्द के धरातलीय भाव के अधिक निकट है।
theological_decisions:
- issue: सृष्टि के प्रसंग में רוּחַ का अनुवाद
  choice: अपनी आत्मा
  alternative: अपनी श्वास; अपनी वायु
  rationale: ‘आत्मा’ परमेश्वर की जीवनदायी सक्रियता का धार्मिक वजन बनाए रखता है, जबकि पादटिप्पणी हिब्रू शब्द में उपस्थित श्वास और वायु के अर्थों को भी सुरक्षित रखती है।
- issue: पहले दो उपवाक्यों का संबंध
  choice: जब ... तब
  alternative: तू अपनी आत्मा भेजता है, वे रचे जाते हैं
  rationale: हिब्रू में दोनों क्रियाएँ समन्वित रूप से आती हैं और उनका संबंध प्रसंग से समझा जाता है। ‘जब ... तब’ स्वाभाविक हिन्दी में समय और परिणाम का संबंध स्पष्ट करता है; अधिक शाब्दिक संरचना पादटिप्पणी में दी गई है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी। परमेश्वर के लिए काव्यात्मक एकवचन ‘तू’ रखा गया है, जो भजन-साहित्य की सीधी संबोधन शैली के अनुकूल है।
