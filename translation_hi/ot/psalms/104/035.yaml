id: PSA.104.35
reference: Psalms 104:35
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: יִתַּ֤מּוּ חַטָּאִ֨ים מִן הָ/אָ֡רֶץ וּ/רְשָׁעִ֤ים ע֤וֹד אֵינָ֗/ם בָּרֲכִ֣י נַ֭פְשִׁ/י אֶת יְהוָ֗ה הַֽלְלוּ יָֽהּ׀־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/035.yaml
  text: May sinners be finished from the earth[a], and may the wicked be no more. Bless Yahweh, O my soul[b]. Hallelujah!
translation:
  language: hi
  text: पापी पृथ्वी पर से मिट जाएँ[a], और दुष्ट फिर न रहें। हे मेरे प्राण, यहोवा को धन्य कह। हालेलूयाह![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप से: “पापी पृथ्वी पर से समाप्त हो जाएँ।”'
    reason: lexical_alternative
  - marker: b
    text: 'इब्रानी: “याह की स्तुति करो!” ‘हालेलूयाह’ इसी अभिव्यक्ति का पारंपरिक प्रतिलेखन है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִתַּמּוּ
  choice: मिट जाएँ
  rationale: תמם का यह रूप समाप्त हो जाने या अंत तक पहुँचने का भाव रखता है। ‘मिट जाएँ’ पृथ्वी पर से उनके हट जाने की कामना और इच्छासूचक बल को स्वाभाविक हिन्दी में व्यक्त करता है, बिना क्रिया को किसी विशेष हिंसक प्रक्रिया तक सीमित किए।
- source_word: חַטָּאִים
  choice: पापी
  rationale: यह बहुवचन व्यक्तियों को सूचित करता है, अमूर्त ‘पापों’ को नहीं। ‘पापी’ संक्षिप्त और सामान्य हिन्दी पद है।
- source_word: מִן הָאָרֶץ
  choice: पृथ्वी पर से
  rationale: भजन 104 के सृष्टि-विषयक व्यापक संदर्भ में אֶרֶץ का अर्थ स्थानीय ‘देश’ की अपेक्षा ‘पृथ्वी’ है। ‘पर से’ हिन्दी में हट जाने के भाव को सहजता से व्यक्त करता है।
- source_word: וּרְשָׁעִים
  choice: और दुष्ट
  rationale: यह व्यक्तियों के नैतिक वर्ग को सूचित करने वाला संज्ञात्मक बहुवचन विशेषण है; ‘दुष्ट’ उसका सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: עוֹד אֵינָם
  choice: फिर न रहें
  rationale: यह आगे उनकी उपस्थिति या अस्तित्व न रहने का भाव देता है। ‘फिर न रहें’ काव्यात्मक और सहज हिन्दी है।
- source_word: בָּרֲכִי נַפְשִׁי
  choice: हे मेरे प्राण, ... को धन्य कह
  rationale: स्त्रीलिंग एकवचन आज्ञार्थक रूप आत्मा/प्राण को संबोधित आत्म-उपदेश है। परमेश्वर के कर्म के रूप में ברך को ‘धन्य कह’ प्रस्तुत करना ‘आशीष दे’ की सम्भावित हिन्दी अस्पष्टता से बचाता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ के व्यक्तिगत दिव्य नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित प्रतिलेखन ‘यहोवा’ से प्रस्तुत किया गया है।
- source_word: הַלְלוּ יָהּ
  choice: हालेलूयाह!
  rationale: यह स्थापित आराधनात्मक अभिव्यक्ति है। प्रतिलेखन इसकी पहचानी जाने वाली स्तुतिपरक शक्ति बनाए रखता है; इसका शाब्दिक अर्थ पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: क्या कामना पापों के नाश की है या पापियों और दुष्टों के हट जाने की
  choice: पाठ स्वयं पापियों के पृथ्वी पर से मिट जाने और दुष्टों के फिर न रहने की कामना करता है।
  alternative: पृथ्वी पर से पाप समाप्त हो जाएँ।
  rationale: חַטָּאִים और רְשָׁעִים यहाँ व्यक्तियों के लिए प्रयुक्त पद हैं, अमूर्त पाप या पापमयता के लिए नहीं। ‘मिट जाएँ’ और ‘न रहें’ प्रार्थना/कामना का बल बनाए रखते हैं और उसे सीधे आदेश में नहीं बदलते।
- issue: दिव्य नाम का अनुवाद या प्रतिलेखन
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल में יְהוָה व्यक्तिगत नाम है; इसलिए उपाधि ‘प्रभु’ से प्रतिस्थापित न करके नाम को हिन्दी में प्रतिलिखित किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण काव्यात्मक शैली रखी गई है। ‘हे मेरे प्राण’ आत्म-संबोधन को सुरक्षित रखता है। मुख्य पाठ में दोनों पादटिप्पणी-चिह्न स्पष्ट रूप से उपस्थित हैं।
