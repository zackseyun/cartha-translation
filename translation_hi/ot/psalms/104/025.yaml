source:
  edition: WLC
  text: זֶ֤ה הַ/יָּ֥ם גָּדוֹל֮ וּ/רְחַ֪ב יָ֫דָ֥יִם שָֽׁם רֶ֭מֶשׂ וְ/אֵ֣ין מִסְפָּ֑ר חַיּ֥וֹת קְ֝טַנּ֗וֹת עִם גְּדֹלֽוֹת׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/025.yaml
  text: There is the sea[a], great and broad of hands; in it are swarming things without number[c][b], living creatures small along with great.
translation:
  language: hi
  text: देखो, यह समुद्र कितना विशाल और दूर-दूर तक फैला हुआ है! उसमें अनगिनत जीव हैं—छोटे भी और बड़े भी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זֶה הַיָּם
  choice: देखो, यह समुद्र
  rationale: זֶה यहाँ संकेत और विस्मय के साथ समुद्र की ओर ध्यान खींचता है। हिन्दी में ‘देखो, यह समुद्र’ उस काव्यात्मक संकेत को स्वाभाविक रूप से व्यक्त करता है।
- source_word: גָּדוֹל
  choice: कितना विशाल
  rationale: आकार और काव्यात्मक विस्मय दोनों को व्यक्त करता है; ‘कितना’ विस्मयात्मक प्रस्तुति को स्वाभाविक हिन्दी देता है।
- source_word: וּרְחַב יָדָיִם
  choice: दूर-दूर तक फैला हुआ
  rationale: शाब्दिक रूप से ‘हाथों में चौड़ा’ हिब्रू मुहावरा है, जिसका आशय विस्तृत फैलाव है। शाब्दिक ‘हाथों में चौड़ा’ हिन्दी में अस्पष्ट होगा, इसलिए अर्थ और चित्र को स्वाभाविक रूप में व्यक्त किया गया है।
- source_word: שָׁם
  choice: उसमें
  rationale: स्थानवाचक शब्द पहले उल्लिखित समुद्र की ओर संकेत करता है; हिन्दी में ‘उसमें’ संबंध को स्पष्ट और सहज बनाता है।
- source_word: רֶמֶשׂ
  choice: रेंगते-तैरते ... जीव
  rationale: यह सामूहिक शब्द अनेक प्रकार के गतिशील अथवा झुंड में भरे जीवों को दर्शाता है। समुद्री संदर्भ में केवल ‘रेंगते’ कहना संकीर्ण होगा; युग्मित अभिव्यक्ति मूल की व्यापकता और समुद्री गति दोनों रखती है।
- source_word: וְאֵין מִסְפָּר
  choice: अनगिनत
  rationale: ‘जिनकी कोई गिनती नहीं’ का संक्षिप्त, स्वाभाविक और काव्यात्मक हिन्दी रूप।
- source_word: חַיּוֹת קְטַנּוֹת עִם גְּדֹלוֹת
  choice: छोटे और बड़े, दोनों
  rationale: חַיּוֹת को पूर्ववर्ती ‘जीव’ में समाहित करते हुए आकारों के समावेशी विरोध को स्पष्ट किया गया है। עִם का आशय छोटे जीवों के साथ बड़े जीवों की उपस्थिति है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी में विस्मयपूर्ण, गरिमामय काव्य-गद्य। हिब्रू मुहावरे का अस्वाभाविक शब्दशः रूप न लेकर उसका विस्तृत फैलाव व्यक्त किया गया है; समुद्री संदर्भ में רֶמֶשׂ की व्यापक गतिशीलता बनाए रखने के लिए ‘रेंगते-तैरते’ चुना गया है।
