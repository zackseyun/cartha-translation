translation:
  language: hi
  text: 'तू प्रकाश को वस्त्र की तरह ओढ़ता है,

    और आकाश को परदे की तरह तानता है।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֹטֶה
  choice: ओढ़ता है
  rationale: यह काल का कृदन्त परमेश्वर का सजीव, निरन्तर काव्यात्मक चित्र प्रस्तुत करता है। हिन्दी में ‘ओढ़ता है’ प्रकाश और वस्त्र—दोनों के साथ स्वाभाविक है और अनावश्यक पुनरुक्ति से बचता है।
- source_word: אוֹר
  choice: प्रकाश
  rationale: यहाँ संज्ञा का सीधा अर्थ ‘प्रकाश’ है; उसे ‘वैभव’ जैसे अमूर्त अर्थ में बदलने की आवश्यकता नहीं है।
- source_word: כַשַּׂלְמָה
  choice: वस्त्र के समान
  rationale: שַׂלְמָה सामान्यतः वस्त्र या चादर-जैसे परिधान को दर्शाता है। ‘वस्त्र’ व्यापक और स्वाभाविक है तथा किसी विशेष प्रकार के परिधान को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: נוֹטֶה
  choice: तानता है
  rationale: נטה फैलाने या तानने को व्यक्त करता है। परदे और आकाश की काव्यात्मक उपमा में ‘तानता है’ आधुनिक हिन्दी में सटीक और सहज है।
- source_word: שָׁמַיִם
  choice: आकाश
  rationale: इब्रानी बहुवचन रूप यहाँ ऊपर विस्तृत नभ या heavens को दर्शाता है। हिन्दी में सामूहिक एकवचन ‘आकाश’ प्राकृतिक और गरिमापूर्ण है।
- source_word: כַיְרִיעָה
  choice: तम्बू के परदे के समान
  rationale: יְרִיעָה परदे अथवा कपड़े के फैलाए हुए पट को, विशेषकर तम्बू या पवित्र निवास के परदे को, दर्शा सकता है। ‘तम्बू का परदा’ इस सृष्टि-चित्र में निहित फैलाए हुए आवरण की छवि स्पष्ट करता है।
theological_decisions:
- issue: परमेश्वर द्वारा प्रकाश ओढ़ने और आकाश तानने का मानवरूपी काव्यात्मक चित्र
  choice: मूल काव्यात्मक रूपक को प्रत्यक्ष बनाए रखना
  alternative: ‘तू प्रकाश से घिरा है’ या ‘प्रकाश तेरा वैभव है’ जैसे व्याख्यात्मक कथन
  rationale: मूल पाठ परमेश्वर की महिमा और सृजनकारी सामर्थ्य को सजीव मानवरूपी बिम्बों से व्यक्त करता है। सीधा अनुवाद इस काव्यात्मक तनाव को बनाए रखता और धर्मवैज्ञानिक व्याख्या को पाठ में जोड़ने से बचता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, काव्यात्मक किन्तु सामान्य पाठक के लिए सहज रखी गई है। समानान्तर क्रियाओं ‘ओढ़ता है’ और ‘तानता है’ से इब्रानी पद की लय और वर्तमान कृदन्तों की सजीवता व्यक्त होती है।
