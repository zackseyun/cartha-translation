  text: עֹשֶׂ֣ה מַלְאָכָ֣י/ו רוּח֑וֹת מְ֝שָׁרְתָ֗י/ו אֵ֣שׁ לֹהֵֽט׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/004.yaml
  text: He makes his messengers winds[b][a], his ministers a flaming fire.
translation:
  language: hi
  text: वह अपने दूतों को हवाएँ[a] और अपने सेवकों को धधकती आग बनाता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह अपने स्वर्गदूतों को आत्माएँ और अपने सेवकों को आग की ज्वाला बनाता है।” इब्रानियों 1:7 में यही पारम्परिक अर्थ मिलता है। इब्रानी शब्द का अर्थ “हवाएँ” या “आत्माएँ” हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: עֹשֶׂה
  choice: बनाता है
  rationale: यह कृदन्त यहाँ परमेश्वर के नियमित कार्य को व्यक्त करता है; ‘बनाता है’ उसके सक्रिय अर्थ को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: מַלְאָכָיו
  choice: अपने दूतों को
  rationale: מַלְאָךְ का अर्थ ‘दूत’ या ‘स्वर्गदूत’ हो सकता है। मुख्य पाठ में ‘दूत’ रखने से मूल शब्द का व्यापक अर्थ और काव्यगत अस्पष्टता बनी रहती है।
- source_word: רוּחוֹת
  choice: हवाएँ
  rationale: רוּחַ का अर्थ ‘हवा’, ‘श्वास’ या ‘आत्मा’ हो सकता है। सृष्टि-वर्णन और धधकती आग के समानान्तर प्रयोग में ‘हवाएँ’ अधिक उपयुक्त है; दूसरा अर्थ पादटिप्पणी में दिया गया है।
- source_word: מְשָׁרְתָיו
  choice: अपने सेवकों को
  rationale: यह शब्द सेवा में उपस्थित परिचारकों को सूचित करता है। आधुनिक हिन्दी में ‘सेवक’ स्पष्ट और गरिमापूर्ण है तथा ‘मंत्री’ से पैदा होने वाले आधुनिक राजनीतिक अर्थ से बचता है।
- source_word: אֵשׁ לֹהֵט
  choice: धधकती आग
  rationale: यह पद सक्रिय और प्रचण्ड अग्नि का चित्र प्रस्तुत करता है; ‘धधकती आग’ उस काव्यात्मक तीव्रता को स्वाभाविक हिन्दी में व्यक्त करती है।
theological_decisions:
- issue: क्या पद स्वर्गदूतों/आत्माओं की बात करता है या हवाओं और आग को परमेश्वर के दूत एवं सेवक बताता है
  choice: वह अपने दूतों को हवाएँ और अपने सेवकों को धधकती आग बनाता है।
  alternative: 'वह अपने स्वर्गदूतों को आत्माएँ और अपने सेवकों को आग की ज्वाला बनाता है; अथवा: वह हवाओं को अपने दूत और आग की लपटों को अपने सेवक बनाता है।'
  rationale: इब्रानी शब्दों और वाक्य-विन्यास में एक से अधिक अर्थ सम्भव हैं। भजन 104 के सृष्टि-सन्दर्भ को देखते हुए मुख्य पाठ ‘दूतों को हवाएँ’ वाला पाठ रखता है, जबकि इब्रानियों 1:7 में प्रतिबिम्बित पारम्परिक अर्थ पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और काव्यात्मक शैली। ‘सेवक’ को ‘मंत्री’ पर वरीयता दी गई है, क्योंकि वर्तमान हिन्दी में ‘मंत्री’ प्रायः राजनीतिक पद समझा जाता है।
