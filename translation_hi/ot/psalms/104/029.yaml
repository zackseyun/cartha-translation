  to: तू अपना मुख छिपाता है[a], तो वे भयभीत हो जाते हैं; तू उनकी साँस ले लेता है[b], तो वे मर जाते हैं और अपनी धूल में लौट जाते हैं।
  rationale: The revision strengthens the response to God’s hidden face from general agitation to fear/alarm, matching the Hebrew more closely. It also uses a more direct Hindi expression for God’s taking away the creatures’ breath. The ambiguity of רוּחַ and the literal anthropomorphic expression “मुख” remain preserved in anchored footnotes.
