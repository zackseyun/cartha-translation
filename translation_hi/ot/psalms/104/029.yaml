review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately represents the Hebrew sequence and imagery: God hides his face, creatures are alarmed, he removes their rûaḥ, and they die and return to their dust. The rendering “घबरा जाते हैं,” however, can indicate mild nervousness and understates the Niphal of בהל, which conveys being alarmed, dismayed, or terrified.'
  naturalness: The Hindi is clear and suitably poetic. “तू” is a coherent devotional-register choice for the direct address in this psalm. “उनकी साँस ले लेता है” is slightly more direct and idiomatic than “वापस ले लेता है,” while retaining the sense of divine withdrawal of life-breath.
  terminology: “मुख,” “साँस,” “मर जाते हैं,” and “धूल में लौट जाते हैं” preserve the concrete Hebrew imagery and avoid importing theological conclusions. The lexical alternatives in both footnotes are appropriate. The footnote wording is adjusted only for smoother modern Hindi and to clarify that “अनुग्रह” is part of the idiomatic implication, not a replacement for the literal wording.
  issues:
  - severity: medium
    issue: “घबरा जाते हैं” is weaker than the Hebrew verb יִבָּהֵלוּן.
    rationale: The Hebrew denotes being deeply alarmed or terrified. “भयभीत हो जाते हैं” more adequately conveys this intensity in natural modern Hindi.
  - severity: low
    issue: “वापस ले लेता है” is interpretively fuller than necessary.
    rationale: Although contextually defensible, “ले लेता है” directly conveys the removal of breath without adding the explicit notion of return.
  revised_text: तू अपना मुख छिपाता है[a], तो वे भयभीत हो जाते हैं; तू उनकी साँस ले लेता है[b], तो वे मर जाते हैं और अपनी धूल में लौट जाते हैं।
