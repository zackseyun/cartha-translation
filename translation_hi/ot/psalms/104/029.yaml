language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: תַּסְתִּ֥יר פָּנֶי/ךָ֮ יִֽבָּהֵ֫ל֥וּ/ן תֹּסֵ֣ף ר֭וּחָ/ם יִגְוָע֑וּ/ן וְֽ/אֶל עֲפָרָ֥/ם יְשׁוּבֽוּ/ן־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/029.yaml
  text: You hide your face[a], they are terrified; you take away their breath[b], they die and return to their dust.
translation:
  language: hi
  text: तू अपना मुख छिपाता है[a], तो वे भयभीत हो जाते हैं; तू उनकी साँस ले लेता है[b], तो वे मर जाते हैं और अपनी धूल में लौट जाते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपनी उपस्थिति।” इब्रानी में “मुख” व्यक्तिगत उपस्थिति या अनुग्रह के लिए प्रयुक्त होने वाला सामान्य मुहावरा है।
    reason: lexical_alternative
  - marker: b
    text: या “उनकी आत्मा।” इब्रानी רוּחַ का अर्थ “साँस,” “वायु,” या “आत्मा” हो सकता है; यहाँ मरने और धूल में लौटने का संदर्भ “साँस” के पक्ष में है।
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּסְתִּיר
  choice: छिपाता है
  rationale: हिफ़ील रूप का अर्थ ‘छिपाना’ है; यह परमेश्वर के अनुग्रहपूर्ण सान्निध्य के हटने की संबंधपरक छवि को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: פָּנֶיךָ
  choice: अपना मुख
  rationale: शाब्दिक अर्थ ‘तेरा मुख’ है। हिंदी में ‘मुख छिपाना’ काव्यात्मक और बोधगम्य है तथा मूल मानवीकरण को बनाए रखता है।
- source_word: יִבָּהֵלוּן
  choice: घबरा जाते हैं
  rationale: נפעל रूप तीव्र व्याकुलता या भय प्रकट करता है। ‘घबरा जाते हैं’ सामान्य आधुनिक हिंदी में इस प्रतिक्रिया को सहजता से व्यक्त करता है।
- source_word: תֹּסֵף
  choice: वापस ले लेता है
  rationale: אסף का अर्थ इकट्ठा करना, हटा लेना या अपने पास ले लेना हो सकता है। जीवन-श्वास के संदर्भ में ‘वापस ले लेना’ जीवन के परमेश्वर पर निर्भर होने का भाव व्यक्त करता है, बिना अनावश्यक व्याख्या जोड़े।
- source_word: רוּחָם
  choice: उनकी साँस
  rationale: רוּחַ का अर्थ साँस, वायु या आत्मा हो सकता है। मरने और धूल में लौटने के समानांतर संदर्भ में ‘साँस’ सबसे स्वाभाविक है; वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: יִגְוָעוּן
  choice: मर जाते हैं
  rationale: גוע का अर्थ प्राण छोड़ना या मरना है। ‘मर जाते हैं’ स्पष्ट, स्वाभाविक और गरिमापूर्ण आधुनिक हिंदी है।
- source_word: עֲפָרָם
  choice: अपनी धूल
  rationale: मूल में अधिकारवाचक प्रत्यय है, अर्थात ‘उनकी धूल’। हिंदी में कर्ता की ओर संकेत करते हुए ‘अपनी धूल’ व्याकरणतः स्वाभाविक है और मूल का नश्वरता-संबंधी संकेत बनाए रखता है।
- source_word: יְשׁוּבוּן
  choice: लौट जाते हैं
  rationale: שוב का सामान्य अर्थ ‘लौटना’ है; धूल में लौटने की प्रचलित सृष्टि-मृत्यु छवि के लिए यही उपयुक्त है।
theological_decisions:
- issue: सृष्टि और मृत्यु के संदर्भ में רוּחָם का अर्थ
  choice: उनकी साँस
  alternative: उनकी आत्मा
  rationale: यह पद जीवों से जीवनदायी श्वास लिए जाने, उनके मरने और धूल में लौटने का वर्णन करता है। ‘साँस’ संदर्भ के अनुकूल है और अमूर्त आत्मा के विषय में कोई अतिरिक्त मानवशास्त्रीय निष्कर्ष आरोपित नहीं करता; वास्तविक वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- issue: परमेश्वर के मुख का मानवीकरण
  choice: अपना मुख
  alternative: अपनी उपस्थिति
  rationale: मूल इब्रानी की ठोस काव्यात्मक छवि हिंदी में समझी जा सकती है, इसलिए उसे अमूर्त व्याख्या से प्रतिस्थापित नहीं किया गया। उपस्थिति या कृपा का मुहावरेदार आशय पादटिप्पणी में बताया गया है।
translation_notes:
  register: आधुनिक मानक हिंदी, काव्यात्मक किंतु सामान्य पाठक के लिए स्पष्ट। परमेश्वर के लिए एकवचन निकट संबोधन ‘तू’ भजन की सीधी प्रार्थनात्मक शैली और इब्रानी के एकवचन संबोधन को बनाए रखता है। ‘मुख’ और ‘धूल’ जैसी ठोस मूल छवियाँ सुरक्षित रखी गई हैं।
