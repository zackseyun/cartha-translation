  yaml_path: translation/ot/psalms/104/028.yaml
  text: You give to them[a], and they gather it; you open your hand, and they are filled with good.
translation:
  language: hi
  text: तू उन्हें देता है, और वे बटोरते हैं; तू अपना हाथ खोलता है, और वे अच्छी वस्तुओं[a] से तृप्त होते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “भलाई से तृप्त होते हैं।”
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּתֵּן לָהֶם
  choice: तू उन्हें देता है
  rationale: נתן का सामान्य अर्थ ‘देना’ है और לָהֶם अप्रत्यक्ष कर्म ‘उन्हें’ को दर्शाता है। परमेश्वर को संबोधित एकवचन रूप बनाए रखने के लिए ‘तू’ चुना गया है।
- source_word: יִלְקֹטוּן
  choice: वे बटोर लेते हैं
  rationale: לקט का अर्थ इकट्ठा करना या बटोरना है। ‘लेते हैं’ से हिन्दी में यह स्वाभाविक रूप से स्पष्ट होता है कि वे परमेश्वर की दी हुई वस्तु बटोरते हैं, बिना कोई विशिष्ट वस्तु जोड़ने के।
- source_word: תִּפְתַּח יָדְךָ
  choice: तू अपना हाथ खोलता है
  rationale: मूल पाठ के सजीव मानवरूपी बिंब को अक्षुण्ण रखा गया है; इसे ‘उदारता से देता है’ जैसे अमूर्त कथन में नहीं बदला गया।
- source_word: יִשְׂבְּעוּן
  choice: तृप्त हो जाते हैं
  rationale: שׂבע पेट भरने, भरपूर पाने और संतुष्ट होने का भाव व्यक्त करता है। ‘तृप्त’ भोजन और प्रावधान के प्रसंग में स्वाभाविक तथा काव्यात्मक है।
- source_word: טוֹב
  choice: अच्छी वस्तुओं
  rationale: यहाँ טוב संज्ञा के समान प्रयुक्त है। बहुवचन ‘अच्छी वस्तुओं’ हिन्दी में स्वाभाविक रूप से परमेश्वर के उत्तम प्रावधान को व्यक्त करता है, जबकि मूल की संक्षिप्त ‘भलाई’ वाली अभिव्यक्ति को पादटिप्पणी में सुरक्षित रखा गया है।
theological_decisions:
- issue: परमेश्वर के हाथ का मानवरूपी चित्रण
  choice: ‘तू अपना हाथ खोलता है’ को शब्दचित्र के रूप में बनाए रखना
  alternative: ‘तू उदारता से देता है’
  rationale: यह चित्रण सृष्टि के प्रति परमेश्वर की भरपूर देखभाल को ठोस काव्यात्मक भाषा में प्रकट करता है; इसका भावार्थ कर देने से भजन का बिंब कमज़ोर हो जाता।
- issue: טוֹב का अर्थ-विस्तार
  choice: मुख्य पाठ में ‘अच्छी वस्तुओं’
  alternative: ‘भलाई’
  rationale: दोनों अर्थ मूल के अनुकूल हैं। मुख्य पाठ का विकल्प सामान्य हिन्दी में अधिक स्पष्ट है, पर पादटिप्पणी मूल की संक्षिप्त और कुछ अधिक अमूर्त अभिव्यक्ति को बनाए रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और काव्यात्मक शैली रखी गई है। परमेश्वर के लिए निकट, प्रत्यक्ष संबोधन ‘तू’ भजन की प्रार्थनात्मक शैली के अनुरूप है; क्रियाओं का वर्तमानकालीन रूप निरंतर या सामान्य क्रिया का भाव देता है।
