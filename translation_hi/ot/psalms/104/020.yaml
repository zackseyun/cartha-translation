base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/020.yaml
  text: You set darkness[a], and it becomes night; in it all the beasts of the forest creep about.
translation:
  language: hi
  text: तू अँधेरा लाता है, और रात हो जाती है; उसमें जंगल के सब जीव-जंतु विचरते हैं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “रेंगते-फिरते हैं”; इब्रानी क्रिया जीवों के इधर-उधर चलने को दर्शाती है, पर अपने-आप में शिकार की खोज में घूमने का अर्थ आवश्यक नहीं करती।
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּשֶׁת
  choice: तू ... करता है
  rationale: क्रिया का अर्थ रखना या स्थापित करना है। अँधेरे के साथ ‘अँधेरा करता है’ स्वाभाविक हिन्दी है और परमेश्वर की सक्रिय भूमिका बनाए रखता है।
- source_word: חֹשֶׁךְ
  choice: अँधेरा
  rationale: सृष्टि-व्यवस्था में रात के आरम्भ से जुड़े अंधकार के लिए सामान्य और सहज हिन्दी शब्द।
- source_word: וִיהִי לָיְלָה
  choice: और रात हो जाती है
  rationale: अँधेरा किए जाने के परिणामस्वरूप रात के हो जाने की अवस्था और क्रम को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בּוֹ
  choice: उसमें
  rationale: पुल्लिंग एकवचन प्रत्यय निकटवर्ती ‘रात’ की ओर संकेत करता है; ‘उसमें’ मूल की संक्षिप्तता रखता है।
- source_word: תִרְמֹשׂ
  choice: घूमते-फिरते हैं
  rationale: רמשׂ जीवों के रेंगने या इधर-उधर चलने को दर्शा सकता है। जंगल के सभी जीवों के लिए ‘घूमते-फिरते’ पर्याप्त व्यापक है और अनावश्यक रूप से शिकार करने का भाव नहीं जोड़ता।
- source_word: כָּל חַיְתוֹ יָעַר
  choice: जंगल के सब जीव-जंतु
  rationale: निर्माण-संबंध को स्वाभाविक हिन्दी क्रम में रखा गया है। ‘जीव-जंतु’ व्यापक सामूहिक अर्थ देता है और केवल हिंसक पशुओं तक सीमित नहीं करता।
theological_decisions:
- issue: सृष्टि की व्यवस्था में परमेश्वर की सक्रिय भूमिका
  choice: परमेश्वर अँधेरा करता है, और उसके परिणामस्वरूप रात हो जाती है।
  alternative: परमेश्वर अँधेरे और रात को केवल होने देता है।
  rationale: द्वितीय पुरुष एकवचन क्रिया इस कार्य को सीधे परमेश्वर से जोड़ती है; अनुवाद मूल से आगे बढ़कर कारणता का कोई दार्शनिक सिद्धान्त नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण काव्यात्मक गद्य। परमेश्वर को संबोधन भजन के निकटवर्ती काव्य-स्वर के अनुरूप अनौपचारिक एकवचन ‘तू’ में रखा गया है।
