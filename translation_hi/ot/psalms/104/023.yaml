  text: Man goes out to his work and to his labor until evening[a][b].
translation:
  language: hi
  text: मनुष्य[a] अपने काम के लिए निकलता है और साँझ तक परिश्रम करता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मानव जाति।” इब्रानी शब्द व्याकरणतः पुल्लिंग एकवचन है, पर यहाँ वह सामान्य रूप से मनुष्यों का प्रतिनिधित्व कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵצֵא
  choice: निकलता है
  rationale: यह क़ाल अपूर्ण रूप यहाँ नियमित या प्रथागत क्रिया व्यक्त करता है। ‘निकलता है’ दिन के समय काम के लिए बाहर जाने का स्वाभाविक हिंदी रूप है।
- source_word: אָדָם
  choice: मनुष्य
  rationale: यहाँ एकवचन शब्द मानव जाति के सामान्य प्रतिनिधि के रूप में आया है और पिछले पदों के पशुओं से मनुष्यों का भेद दिखाता है। ‘मनुष्य’ आधुनिक हिंदी में इसके सामान्य और प्रतिनिधिक अर्थ को व्यक्त करता है।
- source_word: לְפָעֳלוֹ
  choice: अपने काम पर
  rationale: פֹּעַל का अर्थ काम, कार्य या गतिविधि हो सकता है। יצא के साथ हिंदी मुहावरे में ‘अपने काम पर निकलता है’ उद्देश्य और गंतव्य दोनों को सहज रूप से व्यक्त करता है।
- source_word: וְלַעֲבֹדָתוֹ
  choice: और ... परिश्रम करता है
  rationale: עֲבֹדָה यहाँ काम या श्रम को दर्शाता है। हिंदी में दूसरे उद्देश्यवाचक पदबंध को ज्यों का त्यों रखने से वाक्य असहज होता; क्रियात्मक रूप ‘परिश्रम करता है’ समानांतर भाव को स्पष्ट और स्वाभाविक बनाता है।
- source_word: עֲדֵי עָרֶב
  choice: साँझ तक
  rationale: עֲדֵי समय की सीमा ‘तक’ और עָרֶב साँझ को दर्शाता है। यह संक्षिप्त, काव्यात्मक और स्पष्ट हिंदी है।
theological_decisions:
- issue: אָדָם का सामान्य मानव-संदर्भ
  choice: मनुष्य
  alternative: आदमी / एक पुरुष
  rationale: संदर्भ सृष्टि में मनुष्यों की सामान्य दिनचर्या बताता है। ‘मनुष्य’ इस व्यापक अर्थ को प्रमुख रखता है, जबकि पादटिप्पणी मूल के व्याकरणिक एकवचन और संभावित व्यक्तिगत अर्थ को सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘साँझ’ भजन की काव्यात्मक शैली के अनुकूल है। इब्रानी के दो समानांतर उद्देश्यवाचक पदबंधों को हिंदी में ‘काम पर निकलता है’ और ‘परिश्रम करता है’ के रूप में व्यक्त किया गया है, जिससे अर्थ सुरक्षित रहते हुए वाक्य स्वाभाविक बनता है।
