- source_word: מְעוֹנֹתָם
  choice: अपनी माँदों
  rationale: מָעוֹן निवास-स्थान को दर्शाता है; यहाँ पिछले पद के सिंहों के संदर्भ में ‘माँद’ सबसे स्वाभाविक है।
- source_word: יִרְבָּצוּן
  choice: लेट जाते हैं
  rationale: רבץ प्रायः पशुओं के बैठने, दुबकने या लेटने के लिए आता है; यहाँ विश्राम के लिए ‘लेट जाते हैं’ स्पष्ट और स्वाभाविक है।
