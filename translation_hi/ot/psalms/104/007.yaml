  yaml_path: translation/ot/psalms/104/007.yaml
  text: At your rebuke they fled[a]; at the sound of your thunder they hurried away.
translation:
  language: hi
  text: तेरी डाँट से वे भाग गए[a]; तेरे गर्जन की ध्वनि से वे तेजी से हट गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तेरी फटकार से वे भाग निकले; तेरे गर्जन की ध्वनि से वे जल्दी हट गए।”
    reason: גְּעָרָה के लिए ‘फटकार’ तथा נוּס और חפז के वैकल्पिक, अधिक शाब्दिक/औपचारिक क्रिया-प्रयोगों को दर्ज करने के लिए।
lexical_decisions:
- source_word: גַּעֲרָתְךָ
  choice: तेरी डाँट
  rationale: यह शब्द परमेश्वर की प्रभावशाली फटकार या डाँट को दर्शाता है। ‘डाँट’ आधुनिक हिन्दी में स्वाभाविक और सशक्त है तथा सृष्टि पर उसके आदेशकारी वचन का भाव बनाए रखता है।
- source_word: יְנוּסוּן
  choice: वे भाग गए
  rationale: נוּס का मूल अर्थ भाग जाना या पलायन करना है। प्रसंग में भूतकालीन घटना का वर्णन है, इसलिए ‘भाग गए’ सहज और सटीक है।
- source_word: קוֹל רַעַמְךָ
  choice: तेरे गर्जन की आवाज़
  rationale: קוֹל का अर्थ आवाज़ या ध्वनि और רַעַם का अर्थ गर्जन है। यह पदबंध श्रव्य बिंब को स्पष्ट रखता है और हिन्दी में स्वाभाविक है।
- source_word: יֵחָפֵזוּן
  choice: वे झटपट दूर हो गए
  rationale: חפז शीघ्रता और घबराहट में तेज़ गति का संकेत दे सकता है। ‘झटपट दूर हो गए’ गति और तत्काल प्रतिक्रिया व्यक्त करता है, पर ‘घबराकर’ जोड़कर भाव को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: מִן ... מִן
  choice: से ... सुनकर
  rationale: दोनों מִן यहाँ प्रतिक्रिया के कारण या अवसर को सूचित करते हैं। हिन्दी में ‘डाँट से’ और ‘आवाज़ सुनकर’ इसी कारणात्मक तथा तात्कालिक संबंध को सहज ढंग से व्यक्त करते हैं।
theological_decisions:
- issue: बहुवचन क्रियाओं का निहित कर्ता
  choice: इब्रानी की तरह कर्ता को ‘वे’ ही रखा गया है; निकटवर्ती प्रसंग से इसका संकेत जलराशियों की ओर है।
  alternative: ‘जलराशियाँ भाग गईं’ कहकर कर्ता को स्पष्ट करना।
  rationale: मूल पद में संज्ञा दोहराई नहीं गई है। ‘वे’ रखने से काव्यात्मक प्रवाह और मूल की अंतर्निहित संदर्भ-निर्भरता सुरक्षित रहती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और काव्यात्मक शैली। परमेश्वर को संबोधित करते हुए निकटवर्ती एकवचन ‘तेरी/तेरे’ रखा गया है, जो भजन की सीधी संबोधन-शैली के अनुरूप है।
