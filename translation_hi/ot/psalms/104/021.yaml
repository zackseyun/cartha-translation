  text: הַ֭/כְּפִירִים שֹׁאֲגִ֣ים לַ/טָּ֑רֶף וּ/לְ/בַקֵּ֖שׁ מֵ/אֵ֣ל אָכְלָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/021.yaml
  text: The young lions roar for prey, seeking their food from God.
translation:
  language: hi
  text: जवान सिंह शिकार के लिए गरजते हैं और परमेश्वर से अपना भोजन खोजते हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַכְּפִירִים
  choice: जवान सिंह
  rationale: यह शब्द पूर्ण विकसित सिंहों के विपरीत युवा सिंहों को दर्शाता है; आधुनिक हिन्दी में यह स्वाभाविक और स्पष्ट है।
- source_word: שֹׁאֲגִים
  choice: गरजते हैं
  rationale: सिंह की ऊँची पुकार के लिए हिन्दी का सामान्य और सटीक शब्द।
- source_word: לַטָּרֶף
  choice: शिकार के लिए
  rationale: טֶרֶף यहाँ पकड़े या फाड़े जाने वाले आहार, अर्थात शिकार, को सूचित करता है।
- source_word: וּלְבַקֵּשׁ
  choice: और ... माँगते हैं
  rationale: בקשׁ का अर्थ खोजने के साथ माँगना भी हो सकता है; מֵאֵל के साथ यहाँ परमेश्वर से भोजन की याचना या अपेक्षा का भाव स्वाभाविक है। समन्वयी infinitive को हिन्दी में finite क्रिया बनाना सहज है।
- source_word: מֵאֵל אָכְלָם
  choice: परमेश्वर से अपना भोजन
  rationale: מֵאֵל स्रोत को और אָכְלָם उनके भोजन को दर्शाता है; 'अपना भोजन' आधुनिक हिन्दी में स्पष्ट है।
theological_decisions:
- issue: पशुओं द्वारा परमेश्वर से भोजन माँगना
  choice: परमेश्वर से अपना भोजन माँगते हैं
  alternative: परमेश्वर से अपना भोजन खोजते हैं
  rationale: मूल पाठ का מֵאֵל जीवों की निर्भरता परमेश्वर पर रखता है। 'माँगते हैं' इस काव्यात्मक व्यक्तिकरण को बनाए रखता है और यह नहीं बताता कि उनकी गरज सचेत प्रार्थना है।
translation_notes:
  register: भाषा आधुनिक, सहज और काव्यात्मक गरिमा वाली रखी गई है। समानांतर क्रियाओं को स्पष्ट करने के लिए 'और' रखा गया है; किसी पादटिप्पणी की आवश्यकता नहीं है।
