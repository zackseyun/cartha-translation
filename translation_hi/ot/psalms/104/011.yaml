  yaml_path: translation/ot/psalms/104/011.yaml
  text: All the beasts of the field drink from them[b][a]; the wild donkeys quench their thirst.
translation:
  language: hi
  text: मैदान के सभी जंगली पशु उनसे पानी पीते हैं; जंगली गधे अपनी प्यास बुझाते हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יַשְׁקוּ
  choice: उनसे पानी पीते हैं
  rationale: हिफ़ील रूप का मूल भाव ‘पानी पिलाना/सींचना’ है, पर पिछले पद के जलस्रोतों को कर्ता मानकर हिन्दी में पशुओं की दृष्टि से ‘उनसे पानी पीते हैं’ अधिक स्वाभाविक है। ‘उनसे’ का संकेत पद 10 में आए जलस्रोतों की ओर है।
- source_word: כָּל
  choice: सभी
  rationale: यहाँ समष्टिगत अर्थ है; बहुवचन पशुओं के साथ ‘सभी’ सहज आधुनिक हिन्दी है।
- source_word: חַיְתוֹ שָׂדָי
  choice: मैदान के सभी जंगली पशु
  rationale: यह रचना खुले प्रदेश में रहने वाले वन्य जीवों को दर्शाती है। ‘मैदान के जंगली पशु’ स्पष्ट, स्वाभाविक और गरिमापूर्ण हिन्दी है।
- source_word: יִשְׁבְּרוּ
  choice: बुझाते हैं
  rationale: ‘प्यास’ के साथ שׁבר एक मुहावरा है जिसका अर्थ प्यास को तृप्त या शांत करना है; हिन्दी में ‘प्यास बुझाना’ उसका स्वाभाविक समतुल्य है।
- source_word: פְרָאִים
  choice: जंगली गधे
  rationale: यह शब्द वन्य गधों अथवा ओनेगरों को दर्शाता है। ‘जंगली गधे’ सामान्य पाठक के लिए तकनीकी ‘ओनेगर’ से अधिक स्पष्ट है।
- source_word: צְמָאָם
  choice: अपनी प्यास
  rationale: संज्ञा पर तृतीय पुरुष बहुवचन प्रत्यय है। हिन्दी वाक्य में कर्ता से संबंध स्पष्ट करने के लिए ‘अपनी प्यास’ स्वाभाविक है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, काव्यात्मक और गरिमापूर्ण शैली रखी गई है। पूर्व पद के जलस्रोतों के संदर्भ को ‘उनसे’ द्वारा स्पष्ट किया गया है। स्रोत में वास्तविक अर्थगत विकल्प है, किंतु हिन्दी में ‘पानी पिलाते हैं’ कहने पर पशुओं को कर्म बनाना पड़ेगा और वाक्य अप्राकृतिक होगा; इसलिए मुख्य पाठ में सन्दर्भानुकूल सक्रिय अभिव्यक्ति चुनी गई है।
