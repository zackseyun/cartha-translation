  yaml_path: translation/ot/psalms/104/009.yaml
  text: You set a boundary they may not cross[b][a]; they may not return to cover the earth.
translation:
  language: hi
  text: आपने एक सीमा ठहराई है कि वे उसे पार नहीं करेंगे; वे फिर लौटकर पृथ्वी को ढकने के लिए नहीं आएँगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גְּבוּל
  choice: सीमा
  rationale: यह संज्ञा ठहराई हुई हद या सीमा को दर्शाती है; जल के लिए परमेश्वर द्वारा निर्धारित रोक के संदर्भ में ‘सीमा’ स्वाभाविक और सटीक है।
- source_word: שַׂמְתָּ
  choice: आपने ... ठहराई
  rationale: שׂוּם का अर्थ ‘रखना/स्थापित करना’ है। ‘सीमा ठहराना’ आधुनिक मानक हिन्दी में स्वाभाविक है और स्थायी निर्धारण का भाव देता है।
- source_word: בַּל
  choice: न करें / न ढकें
  rationale: यह अव्यय आगामी अपूर्ण क्रिया को निषेधात्मक बनाता है। हिन्दी में प्रसंगानुकूल विध्यर्थक निषेध मूल के प्रतिबंध या रोक के भाव को व्यक्त करता है।
- source_word: יַעֲבֹרוּן
  choice: वे पार न करें
  rationale: עבר का अर्थ ‘पार जाना’ है। निर्धारित सीमा के संदर्भ में ‘पार करना’ स्पष्ट और स्वाभाविक है।
- source_word: יְשׁוּבוּן
  choice: वे फिर लौटकर
  rationale: שׁוב का मूल अर्थ ‘लौटना’ है। ‘फिर’ पुनरागमन का भाव स्पष्ट करता है, जो जल के दोबारा पृथ्वी को ढकने की संभावना से जुड़ा है।
- source_word: לְכַסּוֹת
  choice: ढकें
  rationale: כסה का सीधा अर्थ ‘ढकना’ है। ‘बाढ़ लाना’ निहित अर्थ को स्पष्ट करता, पर ‘ढकना’ सृष्टि और जल के मूल बिंब को सुरक्षित रखता है।
- source_word: הָאָרֶץ
  choice: पृथ्वी
  rationale: इस विश्वव्यापी सृष्टि-भजन में ‘पृथ्वी’ का व्यापक अर्थ ‘भूमि’ की अपेक्षा अधिक उपयुक्त है।
theological_decisions:
- issue: बहुवचन क्रियाओं का संदर्भ
  choice: ‘वे’ निकटवर्ती प्रसंग के जल को सूचित करता है, पर मुख्य पाठ में संज्ञा जोड़कर संदर्भ को आवश्यकता से अधिक निश्चित नहीं किया गया।
  alternative: ‘वे’ को अव्यवस्थित जलराशियों या समुद्र की शक्तियों के अधिक अमूर्त संकेत के रूप में समझना।
  rationale: पिछले पदों में जल के हटने और उसके लिए स्थान निर्धारित होने का वर्णन है। मूल इब्रानी बहुवचन को बनाए रखना संदर्भ को स्पष्ट रहने देता है और अनावश्यक व्याख्या से बचाता है।
- issue: निषेध का स्वरूप
  choice: ‘पार न करें’ और ‘न ढकें’ के द्वारा परमेश्वर द्वारा लगाई गई रोक व्यक्त की गई।
  alternative: 'इसे केवल भविष्यवाणी के रूप में अनूदित करना: ‘वे पार नहीं करेंगे ... वे नहीं लौटेंगे।’'
  rationale: בַּל के साथ अपूर्ण क्रियाएँ यहाँ निर्धारित सीमा और उसके प्रभाव—दोनों का भाव दे सकती हैं। हिन्दी विध्यर्थक रूप इस तनाव को सहज रूप से बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। ‘आप’ से परमेश्वर के प्रति सम्मान व्यक्त होता है। काव्यात्मक समानांतरता और इब्रानी मूल का बहुवचन ‘वे’ सुरक्षित रखा गया है; उसके संदर्भ की व्याख्या पादटिप्पणी में दी गई है।
