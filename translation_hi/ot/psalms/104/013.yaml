source:
  edition: WLC
  text: מַשְׁקֶ֣ה הָ֭רִים מֵ/עֲלִיּוֹתָ֑י/ו מִ/פְּרִ֥י מַ֝עֲשֶׂ֗י/ךָ תִּשְׂבַּ֥ע הָ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/013.yaml
  text: He waters the mountains from his upper chambers[a]; the earth is satisfied with the fruit of your works.
translation:
  language: hi
  text: वह अपने ऊपरी कक्षों से पहाड़ों को सींचता है; तेरे कार्यों के फल से धरती तृप्त होती है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַשְׁקֶה
  choice: वह…सींचता है
  rationale: שׁקה का हिफ़ील कृदन्त यहाँ आसपास के प्रसंग में परमेश्वर को निहित कर्ता मानकर क्रियात्मक रूप में प्रयुक्त है। ‘सींचता है’ पहाड़ों पर वर्षा द्वारा जल देने के भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הָרִים
  choice: पहाड़ों को
  rationale: הָרִים का सामान्य अर्थ ‘पहाड़’ है और निश्चित रूप को प्रसंगानुसार हिन्दी में स्वाभाविक ढंग से व्यक्त किया गया है।
- source_word: מֵעֲלִיּוֹתָיו
  choice: अपने ऊपरी कक्षों से
  rationale: עֲלִיּוֹת ऊपरी कमरों या कक्षों को दर्शाता है। ‘ऊपरी कक्ष’ भजन 104 में सृष्टि को भवन के रूप में चित्रित करने वाले रूपक और तीसरे पुरुष के स्वत्वबोधक प्रत्यय—दोनों को सुरक्षित रखता है।
- source_word: מִפְּרִי
  choice: फल से
  rationale: מִן स्रोत अथवा माध्यम बता सकता है। हिन्दी ‘से’ इसी वास्तविक अस्पष्टता को सहज रूप में बनाए रखता है।
- source_word: מַעֲשֶׂיךָ
  choice: तेरे कार्यों के
  rationale: ‘कार्य’ परमेश्वर की सृजनात्मक और पोषणकारी गतिविधियों को समेटने वाला व्यापक, गरिमापूर्ण अर्थ देता है; दूसरे पुरुष एकवचन को ‘तेरे’ से सुरक्षित रखा गया है।
- source_word: תִּשְׂבַּע
  choice: तृप्त होती है
  rationale: שׂבע का अर्थ भरपूर होकर तृप्त होना है। वर्तमानकालीन वर्णन भजन की स्तुतिपरक शैली के अनुकूल है।
- source_word: הָאָרֶץ
  choice: धरती
  rationale: सृष्टि-वर्णन के व्यापक संदर्भ में ‘धरती’ स्थानीय ‘भूमि’ की अपेक्षा उपयुक्त और स्वाभाविक है।
theological_decisions:
- issue: हिब्रू में निहित दिव्य कर्ता
  choice: वह अपने ऊपरी कक्षों से पहाड़ों को सींचता है
  alternative: अपने ऊपरी कक्षों से पहाड़ों को सींचते हुए
  rationale: पद में कर्ता अलग से व्यक्त नहीं है, पर निकटवर्ती प्रसंग स्पष्टतः परमेश्वर की गतिविधियों का वर्णन करता है। ‘वह’ जोड़ना पठनीयता देता है, कोई नया धर्मवैज्ञानिक दावा नहीं।
- issue: तीसरे से दूसरे पुरुष में परिवर्तन
  choice: वह…अपने…; तेरे कार्यों…
  alternative: वह…अपने…; उसके कार्यों…
  rationale: 'मूल हिब्रू में यही व्यक्ति-परिवर्तन है: מֵעֲלִיּוֹתָיו तीसरा पुरुष है, जबकि מַעֲשֶׂיךָ दूसरा पुरुष। इसे समतल न करके काव्यगत तनाव सुरक्षित रखा गया है।'
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण काव्यात्मक गद्य। ‘ऊपरी कक्ष’ ब्रह्माण्डीय भवन-रूपक को बचाता है; ‘सींचता’ और ‘तृप्त’ सामान्य पाठक के लिए सहज हैं। मूल पाठ की तीसरे से दूसरे पुरुष की आकस्मिक करवट ज्यों की त्यों रखी गई है।
