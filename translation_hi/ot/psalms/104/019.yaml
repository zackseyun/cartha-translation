lexical_decisions:
- source_word: עָשָׂה
  choice: बनाया है
  rationale: कल के सामान्य अर्थ ‘बनाना/करना’ को व्यक्त करता है; काव्य के व्यापक संदर्भ से परमेश्वर कर्ता है।
- source_word: יָרֵחַ
  choice: चाँद
  rationale: आधुनिक मानक हिन्दी में इस आकाशीय पिंड का सहज और स्पष्ट नाम।
- source_word: לְמוֹעֲדִים
  choice: नियत समयों
  rationale: यह चयन ठहराए हुए समयों का व्यापक अर्थ बनाए रखता है, जिसमें ऋतुएँ और पर्वों के समय दोनों सम्मिलित हो सकते हैं।
- source_word: שֶׁמֶשׁ
  choice: सूरज
  rationale: आधुनिक, सहज हिन्दी का मानक शब्द और ‘चाँद’ के अनुरूप काव्यात्मक जोड़ी।
- source_word: יָדַע
  choice: जानता है
  rationale: मूल क्रिया के शाब्दिक अर्थ को रखकर सूरज के काव्यात्मक मानवीकरण को सुरक्षित करता है।
- source_word: מְבוֹאוֹ
  choice: अपने अस्त होने का समय
  rationale: सूरज के संबंध में מָבוֹא उसके ‘जाने/प्रवेश करने’, अर्थात अस्त होने को दर्शाता है; हिन्दी में यह वाक्यांश स्वाभाविक अर्थ स्पष्ट करता है।
theological_decisions:
- issue: सृष्टि के संदर्भ में מוֹעֲדִים का अर्थ
  choice: व्यापक अर्थ में ‘नियत समयों’
  alternative: ‘ऋतुओं’ या केवल ‘पर्वों’
  rationale: पद आकाशीय पिंडों द्वारा समय के दैवी क्रम को चिह्नित करने की बात करता है। व्यापक अनुवाद ऋतुओं और पर्व-तिथियों, दोनों की संभावना बनाए रखता है और किसी एक अर्थ को अनावश्यक रूप से निर्णायक नहीं बनाता।
