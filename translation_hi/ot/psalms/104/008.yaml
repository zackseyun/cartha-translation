  text: יַעֲל֣וּ הָ֭רִים יֵרְד֣וּ בְקָע֑וֹת אֶל מְ֝ק֗וֹם זֶ֤ה יָסַ֬דְתָּ לָ/הֶֽם־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/008.yaml
  text: The mountains rose[a], the valleys sank down, to the place that you established for them.
translation:
  language: hi
  text: पहाड़ ऊपर उठे[a], घाटियाँ नीचे धँस गईं—उस स्थान तक, जिसे तूने उनके लिए स्थापित किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, इब्रानी काव्य की एक अन्य संभव व्याख्या के अनुसार: “वे पहाड़ों के ऊपर चढ़े और घाटियों में उतर गए—उस स्थान तक, जिसे तूने उनके लिए स्थापित किया।” यहाँ जल को निहित कर्ता समझा गया है।'
    reason: alternative_reading
lexical_decisions:
- source_word: יַעֲלוּ
  choice: ऊपर उठे
  rationale: עלה के क़ाल अपूर्ण 3 बहुवचन का उर्ध्वगामी भाव स्वाभाविक हिन्दी में व्यक्त करता है और भू-आकृति के उभरने की काव्यात्मक छवि बनाए रखता है।
- source_word: הָרִים
  choice: पहाड़
  rationale: निश्चित बहुवचन संज्ञा है; हिन्दी में सामान्यतः पृथक निश्चित उपपद की आवश्यकता नहीं होती।
- source_word: יֵרְדוּ
  choice: नीचे धँस गईं
  rationale: ירד के नीचे जाने के भाव को पहाड़ों के उठने के समानांतर घाटियों के नीचा होने की स्थलाकृतिक छवि में व्यक्त करता है।
- source_word: בְקָעוֹת
  choice: घाटियाँ
  rationale: निचले भूभागों या घाटियों के लिए सहज और प्रचलित आधुनिक हिन्दी शब्द।
- source_word: אֶל מְקוֹם
  choice: उस स्थान तक
  rationale: गति के लक्ष्य को प्रकट करता है; आगे आने वाले संबंधवाचक उपवाक्य के कारण 'उस स्थान' स्वाभाविक है।
- source_word: זֶה
  choice: जिसे
  rationale: शाब्दिक संकेतवाचक 'यह' को हिन्दी के स्वाभाविक संबंधवाचक विन्यास में समाहित किया गया है, बिना उसके संदर्भात्मक बल को खोए।
- source_word: יָסַדְתָּ
  choice: ठहराया था
  rationale: יסד के स्थापित या नियत करने के अर्थ को सृष्टि में परमेश्वर द्वारा स्थान निर्धारित करने के प्रसंग में सहज ढंग से व्यक्त करता है।
- source_word: לָהֶם
  choice: उनके लिए
  rationale: पुल्लिंग बहुवचन प्रत्यय को बहुवचन ही रखा गया है और उसके संदर्भ को अनावश्यक रूप से निश्चित नहीं किया गया।
theological_decisions:
- issue: काव्य-पंक्ति के कर्ता का संबंध
  choice: 'मुख्य पाठ में पहाड़ों और घाटियों को क्रियाओं का कर्ता माना गया है: पहाड़ उठे और घाटियाँ धँसीं।'
  alternative: 'जल को निहित कर्ता मानकर: ''वे पहाड़ों के ऊपर चढ़े और घाटियों में उतर गए।'''
  rationale: स्वरांकित इब्रानी में पहाड़ और घाटियाँ क्रियाओं के कर्ता समझे जा सकते हैं और इससे सृष्टि की व्यवस्थित भू-रचना का सुसंगत चित्र बनता है। फिर भी आसपास का प्रसंग जल के पीछे हटने का है, इसलिए दूसरी व्याकरणिक-काव्यात्मक व्याख्या भी वास्तविक संभावना है और उसे पाद-टिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट काव्यात्मक शैली रखी गई है। परमेश्वर के लिए एकवचन आत्मीय संबोधन 'तूने' भजन-साहित्य की सीधी प्रार्थनात्मक वाणी के अनुरूप है। मुख्य पाठ संक्षिप्त रखा गया है, जबकि वास्तविक इब्रानी अस्पष्टता पाद-टिप्पणी में संरक्षित है।
