  text: You covered it with the deep as with a garment[a]; the waters stood above the mountains.
translation:
  language: hi
  text: तूने उसे गहरे जल से ऐसे ढक दिया, जैसे वस्त्र से[a]; जल पहाड़ों के ऊपर ठहरा हुआ था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अथाह जल’ अथवा ‘आदिकालीन गहरा जल’।
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּהוֹם
  choice: गहरा जल
  rationale: यह शब्द अथाह या महासागरीय गहरे जल को दर्शाता है। ‘गहरा जल’ सृष्टि-वर्णन की जलराशि की छवि बनाए रखता है और अनावश्यक पौराणिक अर्थ नहीं जोड़ता।
- source_word: כַּ/לְּבוּשׁ
  choice: जैसे वस्त्र से
  rationale: उपसर्ग כַּ तुलना व्यक्त करता है और לְבוּשׁ का अर्थ वस्त्र है; यह वाक्य में स्वाभाविक ढंग से उपमा को सुरक्षित रखता है।
- source_word: כִּסִּיתוֹ
  choice: तूने उसे ... ढक दिया
  rationale: क्रिया द्वितीय पुरुष पुल्लिंग एकवचन है और उसमें तृतीय पुरुष पुल्लिंग एकवचन कर्म-प्रत्यय है। इसलिए परमेश्वर को किया गया सीधा संबोधन और ‘उसे’ दोनों सुरक्षित रखे गए हैं।
- source_word: עַל הָרִים
  choice: पहाड़ों के ऊपर
  rationale: עַל यहाँ पहाड़ों से ऊँची स्थिति दर्शाता है; הָרִים के लिए ‘पहाड़’ सृष्टि-वर्णन की विशालता बनाए रखता है।
- source_word: יַעַמְדוּ מָיִם
  choice: जल ... खड़ा था
  rationale: עמד का मूल अर्थ ‘खड़ा होना’ है। एकवचन सामूहिक संज्ञा ‘जल’ के साथ ‘खड़ा था’ इब्रानी की सजीव काव्यात्मक छवि को बनाए रखता है।
theological_decisions:
- issue: क्रिया का पुरुष और संबोधन
  choice: 'परमेश्वर से सीधा संबोधन: ‘तूने ... ढक दिया’'
  alternative: 'तृतीय पुरुष वर्णन: ‘उसने ... ढक दिया’'
  rationale: इब्रानी क्रिया स्पष्ट रूप से द्वितीय पुरुष पुल्लिंग एकवचन है और निकटवर्ती संदर्भ में भजनकार यहोवा को सीधे संबोधित करता है; इसलिए व्यक्ति बदलना उचित नहीं।
- issue: תְּהוֹם की ब्रह्मांडीय छवि
  choice: ‘गहरा जल’
  alternative: ‘आदिकालीन अथाह जल’ या ‘अथाह गर्त’
  rationale: चुना हुआ रूप विशाल गहरे जल का भाव रखता है, लेकिन पाठ से अधिक विशिष्ट पौराणिक या दार्शनिक अर्थ आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में काव्यात्मक और गरिमापूर्ण शैली रखी गई है। ‘तूने’ भजन में परमेश्वर के प्रति सीधे, एकवचन संबोधन को स्वाभाविक हिन्दी में सुरक्षित रखता है। ‘जल ... खड़ा था’ जानबूझकर शाब्दिक काव्य-चित्र बनाए रखता है।
