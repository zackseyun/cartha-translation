review_pass:
  verdict: revise
  source_fidelity: The draft correctly retains the second-person singular address ('तूने'), the 3ms object ('उसे'), the comparison with a garment, and the location of the waters above the mountains. The Hebrew plural waters and imperfect verb portray waters standing/remain fixed; Hindi need not reproduce the Hebrew number morphologically where 'जल' functions as a collective noun.
  naturalness: '''जल ... खड़ा था'' is understandable as a deliberately literal image, but it is strained in modern standard Hindi because water is not normally described as physically standing. ''ठहरा हुआ था'' naturally conveys water remaining fixed in position while retaining the poetic sense of the Hebrew verb in context.'
  terminology: ‘गहरा जल’ is a suitably non-speculative rendering of תְּהוֹם. ‘वस्त्र,’ ‘पहाड़ों,’ and the direct-address form are appropriate. The footnote supplies legitimate lexical alternatives without imposing a mythological interpretation.
  issues:
  - severity: low
    issue: ‘जल पहाड़ों के ऊपर खड़ा था’ is overly literal and unnatural Hindi.
    rationale: The Hebrew image is vivid, but in Hindi ‘ठहरा हुआ था’ is the normal way to describe waters remaining positioned above something. It preserves the contextual force of יַעַמְדוּ without suggesting that the water literally stood upright.
  revised_text: तूने उसे गहरे जल से ऐसे ढक दिया, जैसे वस्त्र से[a]; जल पहाड़ों के ऊपर ठहरा हुआ था।
