id: PSA.104.1
reference: Psalms 104:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: בָּרֲכִ֥י נַפְשִׁ֗/י אֶת יְה֫וָ֥ה יְהוָ֣ה אֱ֭לֹהַ/י גָּדַ֣לְתָּ מְּאֹ֑ד ה֭וֹד וְ/הָדָ֣ר לָבָֽשְׁתָּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/001.yaml
  text: Bless Yahweh[a], O my soul! Yahweh my God, you are very great; you have clothed yourself with splendor and majesty.
translation:
  language: hi
  text: 'हे मेरे प्राण, याहवे को धन्य कह![a]


    हे याहवे, मेरे परमेश्वर, तू अत्यन्त महान है;


    तू वैभव और प्रताप पहने हुए है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में परमेश्वर का व्यक्तिगत नाम ‘YHWH’ है, जिसका यहाँ लिप्यंतरण ‘याहवे’ किया गया है। इसे कभी-कभी ‘यहोवा’ और अनेक अनुवादों में ‘प्रभु’ भी लिखा जाता है।
    reason: alternative_reading
lexical_decisions:
- source_word: בָּרֲכִי
  choice: धन्य कह
  rationale: स्त्रीलिंग एकवचन आज्ञार्थक रूप कवि के अपने ‘प्राण’ को संबोधित करता है। ‘धन्य कह’ ברך के आराधनात्मक अर्थ को ‘स्तुति कर’ की अपेक्षा अधिक सीधे सुरक्षित रखता है।
- source_word: נַפְשִׁי
  choice: हे मेरे प्राण
  rationale: נפש यहाँ संपूर्ण अंतःस्व या स्वयं को संबोधित करने वाला काव्यात्मक प्रयोग है। ‘प्राण’ हिंदी बाइबलीय-काव्य भाषा में स्वाभाविक और गरिमापूर्ण है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ के व्यक्तिगत ईश्वरीय नाम YHWH को पदवी से प्रतिस्थापित न करके लिप्यंतरित किया गया है।
- source_word: גָּדַלְתָּ מְּאֹד
  choice: तू अत्यन्त महान है
  rationale: पूर्णकालिक क्रिया यहाँ वर्तमान गुण या अवस्था व्यक्त करती है; ‘अत्यन्त’ מְאֹד की तीव्रता बनाए रखता है।
- source_word: הוֹד וְהָדָר
  choice: वैभव और प्रताप
  rationale: यह निकटार्थी युग्म दृश्य दीप्ति और राजसी महिमा दोनों व्यक्त करता है; हिंदी में ‘वैभव और प्रताप’ उसका स्वाभाविक काव्यात्मक समतुल्य है।
- source_word: לָבָשְׁתָּ
  choice: वस्त्र के समान पहने हुए है
  rationale: क्रिया वस्त्र धारण करने का रूपक प्रस्तुत करती है। हिंदी में ‘पहने हुए है’ वर्तमान परिणामी अवस्था को स्वाभाविक ढंग से व्यक्त करता है, और ‘वस्त्र के समान’ निहित चित्र को स्पष्ट करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: पद में वाचा-संबंधी व्यक्तिगत नाम सीधे आया है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और नाम तथा पदवी के भेद को बनाए रखता है।
- issue: ברך का आराधनात्मक अर्थ
  choice: धन्य कह
  alternative: स्तुति कर
  rationale: ‘स्तुति कर’ अर्थ की दिशा बताता है, पर ‘धन्य कह’ मूल क्रिया के आशीर्वचनात्मक और आराधनात्मक तनाव को अधिक निकटता से सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण काव्य-शैली रखी गई है। परमेश्वर के लिए एकवचन ‘तू’ मूल इब्रानी के सीधे, निकट संबोधन को दर्शाता है; यह अनादर सूचित नहीं करता। पंक्ति-विभाजन पद के आत्म-संबोधन और फिर परमेश्वर से सीधे संबोधन को स्पष्ट करता है।
