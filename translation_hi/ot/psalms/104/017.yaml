lexical_decisions:
- source_word: אֲשֶׁר שָׁם
  choice: जहाँ
  rationale: दोनों पद मिलकर पिछले पद में बताए गए पेड़ों की ओर स्थानवाचक संबंधसूचक भाव से संकेत करते हैं; आधुनिक हिन्दी में ‘जहाँ’ स्वाभाविक और संक्षिप्त है।
- source_word: צִפֳּרִים
  choice: पक्षी
  rationale: यह पक्षियों के लिए सामान्य शब्द है; हिन्दी में बिना अनावश्यक निश्चितता जोड़े पूरी जाति का बोध कराता है।
- source_word: יְקַנֵּנוּ
  choice: अपने घोंसले बनाते हैं
  rationale: कन्न मूल का अर्थ घोंसला बनाना या उसमें बसना है; यह अभिव्यक्ति क्रिया और बहुवचन कर्ता दोनों को सहज हिन्दी में बनाए रखती है।
- source_word: חֲסִידָה
  choice: लगलग
  rationale: यह इब्रानी पक्षीनाम परंपरागत रूप से stork को सूचित करता है; ‘लगलग’ उसका सटीक हिन्दी नाम है और ‘सारस’ से होने वाली crane-संबंधी अस्पष्टता से बचाता है।
- source_word: בְּרוֹשִׁים
  choice: सरो के पेड़
  rationale: यह किसी शंकुधारी वृक्ष का नाम है, जिसकी ठीक प्रजाति अनिश्चित है। ‘सरो’ एक प्रचलित संभावित पहचान है; अन्य संभावनाएँ पादटिप्पणी में सुरक्षित रखी गई हैं।
- source_word: בֵּיתָהּ
  choice: का घर ... में है
  rationale: मूल में शाब्दिक अर्थ ‘उसका घर’ है। हिन्दी वाक्य-विन्यास में यह पशु के बसेरे को स्वाभाविक ढंग से व्यक्त करता है और स्त्रीलिंग प्रत्यय को अनावश्यक रूप से जैविक लिंग का दावा नहीं बनाता।
