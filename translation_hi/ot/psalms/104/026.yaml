  text: There the ships move about[a], and Leviathan, which you formed to play in it.
translation:
  language: hi
  text: वहाँ जहाज़ आते-जाते हैं, और लिव्यातान भी, जिसे तूने समुद्र में खेलने के लिए रचा है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और लिव्यातान, जिसे तूने अपने साथ खेलने के लिए रचा है”; अर्थात, “जिसके साथ तू खेल सके।” अंतिम वाक्यांश को कुछ लोग इस अर्थ में लेते हैं कि परमेश्वर लिव्यातान के साथ खेलता है, न कि लिव्यातान समुद्र में खेलता है।
