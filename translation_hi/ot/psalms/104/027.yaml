base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/027.yaml
  text: All of them wait for you to give them their food in its time[a][b].
translation:
  language: hi
  text: वे सब आपकी ओर आशा लगाए रहते हैं कि आप उन्हें ठीक समय पर उनका भोजन दें।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “आपकी ओर अपेक्षा से देखते हैं” या “आप पर आशा रखते हैं।”
    reason: lexical_alternative
  - marker: b
    text: या “उचित समय पर” या “नियत समय पर।”
    reason: lexical_alternative
lexical_decisions:
- source_word: כֻּלָּם
  choice: वे सब
  rationale: यह पदबंध पहले वर्णित सभी जीवों को सामूहिक और समावेशी रूप से संदर्भित करता है; आधुनिक हिन्दी में ‘वे सब’ स्वाभाविक है।
- source_word: אֵלֶיךָ
  choice: आपकी ओर
  rationale: पूर्वसर्ग अपेक्षा और निर्भरता की दिशा परमेश्वर की ओर होने को व्यक्त करता है।
- source_word: יְשַׂבֵּרוּן
  choice: आशा लगाए रहते हैं
  rationale: पिएल रूप यहाँ आशापूर्ण प्रतीक्षा या अपेक्षा का भाव देता है; यह हिन्दी प्रयोग उस सक्रिय निर्भरता को स्वाभाविक रूप से व्यक्त करता है।
- source_word: לָתֵת
  choice: कि आप ... दें
  rationale: इनफिनिटिव प्रतीक्षा की अपेक्षित विषयवस्तु बताता है; हिन्दी में ‘कि आप ... दें’ स्पष्ट और सहज है।
- source_word: אָכְלָם
  choice: उनका भोजन
  rationale: यह सभी प्रकार के जीवों के लिए सामान्य आहार को दर्शाता है, केवल शिकार या किसी विशिष्ट प्रकार की खुराक को नहीं।
- source_word: בְּעִתּוֹ
  choice: ठीक समय पर
  rationale: यह वाक्यांश उचित, नियत या अनुकूल समय का बोध देता है; ‘ठीक समय पर’ निकट और सुबोध हिन्दी है।
theological_decisions:
- issue: सृष्टि के लिए परमेश्वर का प्रावधान
  choice: जीव परमेश्वर से भोजन पाने की आशा में उनकी ओर देखते हैं।
  alternative: इसे परमेश्वर पर स्पष्ट विश्वास या उपासना की घोषणा के रूप में अधिक व्याख्यात्मक ढंग से प्रस्तुत करना।
  rationale: इब्रानी पाठ सभी जीवों की परमेश्वर पर आशापूर्ण निर्भरता दिखाता है, पर उनकी चेतन उपासना या किसी अधिक विकसित धर्मसैद्धांतिक धारणा को स्पष्ट रूप से नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और काव्यात्मक गद्य-विन्यास रखा गया है। परमेश्वर के लिए आदरसूचक ‘आप’ प्रयुक्त है; मूल की आशापूर्ण प्रतीक्षा और समय-संबंधी अर्थ-विस्तार पादटिप्पणियों में सुरक्षित हैं।
