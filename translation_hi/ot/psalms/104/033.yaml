source:
  edition: WLC
  text: אָשִׁ֣ירָה לַ/יהוָ֣ה בְּ/חַיָּ֑/י אֲזַמְּרָ֖ה לֵ/אלֹהַ֣/י בְּ/עוֹדִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/033.yaml
  text: I will sing to Yahweh as long as I live[b][a]; I will make music to my God while I still live.
translation:
  language: hi
  text: मैं जीवन भर यहोवा के लिए गाऊँगा; जब तक मैं जीवित हूँ, मैं अपने परमेश्वर का गुणगान करूँगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָשִׁירָה
  choice: मैं ... गाऊँगा
  rationale: शीर के काल रूप में यहाँ संकल्पपूर्ण भाव है; आधुनिक हिन्दी में भविष्यकाल इस दृढ़ स्तुति-संकल्प को स्वाभाविक रूप से व्यक्त करता है।
- source_word: לַיהוָה
  choice: यहोवा के लिए
  rationale: ל दिशा अथवा स्तुति के लक्ष्य को सूचित करता है। יהוה को उसके व्यक्तिवाचक वाचा-नाम ‘यहोवा’ से व्यक्त किया गया है।
- source_word: בְּחַיָּי
  choice: जीवन भर
  rationale: शाब्दिक अर्थ ‘मेरे जीवन में’ है, पर यहाँ पूरे जीवनकाल की अवधि अभिप्रेत है; ‘जीवन भर’ संक्षिप्त और स्वाभाविक हिन्दी है।
- source_word: אֲזַמְּרָה
  choice: मैं ... गुणगान करूँगा
  rationale: זמר का पिएल रूप संगीत सहित स्तुति करने अथवा भजन गाने का अर्थ देता है। ‘गुणगान’ पहले खंड के सामान्य ‘गाऊँगा’ से काव्यात्मक भिन्नता बनाए रखता है और हिन्दी में स्तुति का भाव स्पष्ट करता है।
- source_word: לֵאלֹהַי
  choice: अपने परमेश्वर का
  rationale: मूल में לֵאלֹהַי का अर्थ ‘मेरे परमेश्वर के लिए/को’ है। हिन्दी में ‘अपने परमेश्वर का गुणगान’ लक्ष्य और संबंध दोनों को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: בְּעוֹדִי
  choice: जब तक मेरा अस्तित्व है
  rationale: עוֹדִי निरंतर बने रहने या अस्तित्व में रहने का संकेत देता है। यह अनुवाद पहले खंड के ‘जीवन भर’ से अर्थगत समानता रखते हुए मूल की शब्दगत भिन्नता भी बचाता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में सामान्य उपाधि नहीं, चार अक्षरों वाला व्यक्तिवाचक वाचा-नाम है। हिन्दी के साधारण पाठकों में परिचित रूप ‘यहोवा’ नाम की विशिष्टता को बनाए रखता है।
- issue: בְּעוֹדִי में जीवन या व्यापक अस्तित्व
  choice: जब तक मेरा अस्तित्व है
  alternative: जब तक मैं जीवित हूँ
  rationale: दूसरा पदांश पहले के בְּחַיָּי के समानांतर है, किंतु עוֹדִי का शब्दार्थ बने रहने अथवा अस्तित्व में होने की ओर अधिक व्यापक संकेत कर सकता है। इसलिए भेद को मिटाए बिना काव्यात्मक तनाव सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, काव्यात्मक और श्रद्धापूर्ण शैली। ‘अस्तित्व’ थोड़ा औपचारिक है, पर मूल के दोनों समानांतर पदांशों की शब्दगत भिन्नता को स्पष्ट और बोधगम्य रूप में सुरक्षित रखता है।
