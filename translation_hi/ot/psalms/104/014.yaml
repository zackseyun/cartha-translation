source:
  edition: WLC
  text: מַצְמִ֤יחַ חָצִ֨יר לַ/בְּהֵמָ֗ה וְ֭/עֵשֶׂב לַ/עֲבֹדַ֣ת הָ/אָדָ֑ם לְ/ה֥וֹצִיא לֶ֝֗חֶם מִן הָ/אָֽרֶץ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/014.yaml
  text: He causes grass to grow for the cattle[a], and plants for the service of man, to bring forth bread from the earth,
translation:
  language: hi
  text: वह पशुओं के लिए घास और मनुष्य[a] के काम के लिए वनस्पति उगाता है, ताकि धरती से रोटी निकले।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात् समस्त मानवजाति; इब्रानी में ‘मनुष्य’ प्रतिनिधिक और सामान्य अर्थ में है।
    reason: प्रतिनिधिक אָדָם के समावेशी अर्थ को स्पष्ट करना।
lexical_decisions:
- source_word: מַצְמִיחַ
  choice: उगाता है
  rationale: 'हिफ़ील कृदन्त का कारक भाव सुरक्षित रहता है: परमेश्वर ही वनस्पति को उगाता है।'
- source_word: חָצִיר
  choice: घास
  rationale: सन्दर्भ में पशुओं के चारे की वनस्पति अभिप्रेत है; ‘घास’ सहज और सटीक है।
- source_word: לַבְּהֵמָה
  choice: पशुओं के लिए
  rationale: בְּהֵמָה यहाँ सामान्यतः पाले जाने वाले चरने वाले पशुओं को दर्शाता है; ‘पशुओं’ का प्रयोग आधुनिक हिन्दी में स्वाभाविक और पर्याप्त व्यापक है।
- source_word: וְעֵשֶׂב
  choice: और ... वनस्पति
  rationale: עֵשֶׂב केवल पाक-कला में प्रयुक्त जड़ी-बूटियों तक सीमित नहीं, बल्कि मनुष्य के लिए उपयोगी उगने वाली वनस्पति का व्यापक बोध देता है।
- source_word: לַעֲבֹדַת הָאָדָם
  choice: मनुष्य के काम के लिए
  rationale: עֲבֹדָה के ‘काम/श्रम/सेवा’ सम्बन्धी अर्थ को रखते हुए यह अनुवाद वाक्यांश की संक्षिप्तता और कुछ हद तक उसकी अर्थगत खुलावट बनाए रखता है।
- source_word: הָאָדָם
  choice: मनुष्य
  rationale: यहाँ אָדָם किसी एक पुरुष का नहीं, प्रतिनिधिक और सामान्य मानव का बोध देता है; ‘मनुष्य’ आधुनिक हिन्दी में स्वाभाविक रूप से समावेशी है।
- source_word: לְהוֹצִיא
  choice: ताकि ... निकले
  rationale: उद्देश्य अथवा परिणाम का सम्बन्ध व्यक्त होता है, जबकि धरती से रोटी निकालने वाले कर्ता को अनावश्यक रूप से निश्चित नहीं किया गया।
- source_word: לֶחֶם
  choice: रोटी
  rationale: לֶחֶם का सीधा अर्थ ‘रोटी’ है; इसे व्यापक ‘भोजन’ बनाकर कृषि-बिम्ब को धुँधला नहीं किया गया।
- source_word: מִן הָאָרֶץ
  choice: धरती से
  rationale: यहाँ אֶרֶץ उपज के स्रोत रूप में धरती/भूमि को दर्शाता है; ‘धरती से’ काव्यात्मक और स्वाभाविक है।
theological_decisions:
- issue: प्रतिनिधिक अर्थ में אָדָם का अनुवाद
  choice: मनुष्य
  alternative: मानवजाति
  rationale: एकवचन प्रतिनिधिक रूप को बनाए रखते हुए ‘मनुष्य’ हिन्दी में स्त्री-पुरुष सभी मनुष्यों को समेटता है; वैकल्पिक सामूहिक अर्थ पादटिप्पणी में दिया गया है।
- issue: לְהוֹצִיא में निहित कर्ता
  choice: ताकि धरती से रोटी निकले
  alternative: धरती से रोटी निकालने के लिए
  rationale: इब्रानी में उद्देश्य/परिणाम स्पष्ट है, पर अन्तर्निहित कर्ता को अलग से व्यक्त नहीं किया गया। चुना हुआ रूप परमेश्वर या मानवीय श्रम में से किसी एक को अनावश्यक रूप से विशिष्ट नहीं करता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘मनुष्य के काम’ इब्रानी वाक्यांश की संक्षिप्त अर्थगत खुलावट बनाए रखता है, और ‘रोटी’ मूल कृषि-बिम्ब को सुरक्षित रखती है।
