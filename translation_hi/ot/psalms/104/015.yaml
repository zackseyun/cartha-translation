  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/יַ֤יִן יְשַׂמַּ֬ח לְֽבַב אֱנ֗וֹשׁ לְ/הַצְהִ֣יל פָּנִ֣ים מִ/שָּׁ֑מֶן וְ֝/לֶ֗חֶם לְֽבַב אֱנ֥וֹשׁ יִסְעָֽד׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/015.yaml
  text: and wine gladdens the heart of man[a], making the face shine more than oil[b], and bread sustains the heart of man.
translation:
  language: hi
  text: और दाखमधु मनुष्य के हृदय को आनन्दित करता है[a], तेल से भी अधिक उसके मुख पर चमक लाता है[b], और रोटी मनुष्य के हृदय को सहारा देती है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मानव के हृदय को” अथवा “किसी व्यक्ति के हृदय को।” यहाँ इब्रानी में एकवचन ‘मनुष्य’ पूरी मानवता का प्रतिनिधित्व करता है।
    reason: lexical_alternative
  - marker: b
    text: या, “तेल से मुख पर चमक लाने के लिए।” इब्रानी पूर्वसर्ग का अर्थ तुलनात्मक (“तेल से भी अधिक”) अथवा साधन/स्रोत-सूचक (“तेल से”) हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וְיַיִן
  choice: और दाखमधु
  rationale: יַיִן का अर्थ दाखमधु है; यहाँ यह किसी विशेष पात्र की नहीं, सामान्य पदार्थ की बात करता है। ‘दाखमधु’ काव्यात्मक और गरिमापूर्ण है तथा आधुनिक हिन्दी में बोधगम्य है।
- source_word: יְשַׂמַּח
  choice: आनन्दित करता है
  rationale: पिएल रूप कारणवाचक अर्थ देता है—आनन्द उत्पन्न करना। यह चयन उस अर्थ को स्पष्ट और स्वाभाविक ढंग से रखता है।
- source_word: לְבַב אֱנוֹשׁ
  choice: मनुष्य के हृदय
  rationale: לְבַב भीतरी जीवन, मनोभाव और शक्ति का केंद्र सूचित करता है; אֱנוֹשׁ यहाँ समस्त मानवजाति का प्रतिनिधित्व करने वाला एकवचन है।
- source_word: לְהַצְהִיל פָּנִים
  choice: उसके मुख को चमकाता है
  rationale: हिफ़ील क्रिया चमक या प्रसन्न दीप्ति उत्पन्न करने का भाव देती है। हिन्दी में ‘मुख को चमकाता है’ काव्यात्मक बिंब को बनाए रखता है; ‘उसके’ से हृदय वाले मनुष्य का संदर्भ स्वाभाविक रूप से स्पष्ट होता है।
- source_word: מִשָּׁמֶן
  choice: तेल से भी अधिक
  rationale: 'מִן को यहाँ तुलनात्मक अर्थ में लिया गया है: दाखमधु मुख को तेल से भी अधिक चमकाता है। चूँकि यही पूर्वसर्ग साधन या स्रोत भी दर्शा सकता है, वैकल्पिक पाठ को पादटिप्पणी में रखा गया है।'
- source_word: וְלֶחֶם
  choice: और रोटी
  rationale: לֶחֶם का मूल अर्थ ‘रोटी’ है और यहाँ जीवन के मुख्य आहार के रूप में उसका ठोस काव्यात्मक बिंब उचित है।
- source_word: יִסְעָד
  choice: सहारा देती है
  rationale: סעד का अर्थ सहारा देना, संभालना या कायम रखना है। ‘सहारा देती है’ हृदय के साथ मूल रूपक को बनाए रखता है और केवल शारीरिक पोषण तक अर्थ को सीमित नहीं करता।
theological_decisions:
- issue: אֱנוֹשׁ का सामान्य प्रतिनिधिक एकवचन
  choice: मनुष्य
  alternative: मानव / व्यक्ति / मानवजाति
  rationale: यहाँ शब्द किसी विशेष पुरुष तक सीमित नहीं, बल्कि मानवता के प्रत्येक सदस्य का प्रतिनिधित्व करता है। ‘मनुष्य’ हिन्दी में इस प्रतिनिधिक एकवचन को बनाए रखता है; समावेशी आशय पादटिप्पणी में स्पष्ट किया गया है।
- issue: מִן का तुलनात्मक अथवा साधन-सूचक अर्थ
  choice: तेल से भी अधिक
  alternative: तेल से/तेल के द्वारा मुख को चमकाना
  rationale: तुलनात्मक पाठ पंक्ति को दाखमधु के प्रभाव का निरंतर वर्णन मानता है और काव्यात्मक समानांतरता में सुगम बैठता है। फिर भी इब्रानी पूर्वसर्ग साधन या स्रोत का अर्थ भी दे सकता है, इसलिए उस वास्तविक अस्पष्टता को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सहज किंतु काव्यात्मक और गरिमापूर्ण रखी गई है। ‘दाखमधु’, ‘मुख’ और ‘हृदय’ भजन की काव्यात्मक शैली बनाए रखते हैं, जबकि वाक्य-विन्यास सामान्य पाठक के लिए स्पष्ट है।
