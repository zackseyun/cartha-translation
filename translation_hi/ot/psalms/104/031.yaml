  text: יְהִ֤י כְב֣וֹד יְהוָ֣ה לְ/עוֹלָ֑ם יִשְׂמַ֖ח יְהוָ֣ה בְּ/מַעֲשָֽׂי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/031.yaml
  text: May the glory of Yahweh be forever[b][a]; may Yahweh rejoice in his works.
translation:
  language: hi
  text: याहवे की महिमा सदा बनी रहे; याहवे अपने कार्यों में आनंदित हो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהִי ... לְעוֹלָם
  choice: सदा बनी रहे
  rationale: इच्छासूचक יְהִי और कालवाची לְעוֹלָם को मिलाकर हिन्दी में स्वाभाविक प्रार्थनात्मक भाव व्यक्त होता है; यह केवल ‘सदा हो’ की अपेक्षा निरन्तरता को स्पष्ट करता है।
- source_word: כְבוֹד
  choice: महिमा
  rationale: भजन के स्तुतिपरक संदर्भ में यह परमेश्वर के वैभव और गौरव को व्यक्त करने वाला प्रचलित और उपयुक्त हिन्दी शब्द है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को उपाधि से बदलने के बजाय हिन्दी लिप्यन्तरण में रखा गया है।
- source_word: יִשְׂמַח
  choice: आनन्दित हो
  rationale: यह पहले खंड के समान इच्छा या कामना व्यक्त करता है और आधुनिक हिन्दी में गरिमापूर्ण तथा स्वाभाविक है।
- source_word: בְּמַעֲשָׂיו
  choice: अपने कार्यों से
  rationale: यहाँ מַעֲשֶׂה सृष्टि-संबंधी कृतियों को समेटता है। हिन्दी में आनन्द के कारण या आधार के लिए ‘से’ स्वाभाविक है और בְּ के संबंधात्मक विस्तार को उचित रूप से व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु
  rationale: मूल पाठ व्यक्तिगत ईश्वरीय नाम का प्रयोग करता है; इसलिए उसे किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- issue: याहवे और उसके कार्यों के बीच आनन्द का संबंध
  choice: अपने कार्यों से आनन्दित हो
  alternative: अपने कार्यों पर आनन्दित हो
  rationale: इब्रानी בְּ संबंध के एक से अधिक सूक्ष्म अर्थ दे सकता है। हिन्दी में ‘से’ अधिक स्वाभाविक है और कार्यों को आनन्द का आधार बताता है, बिना अनावश्यक रूप से ‘पर’ वाला अर्थ थोपे।
translation_notes:
  register: आधुनिक मानक हिन्दी; काव्यात्मक, प्रार्थनात्मक और गरिमापूर्ण शैली। दोनों खंडों की समानांतर इच्छासूचक संरचना सुरक्षित रखी गई है।
