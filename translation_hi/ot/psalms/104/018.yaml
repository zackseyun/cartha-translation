  yaml_path: translation/ot/psalms/104/018.yaml
  text: The high mountains are for the wild goats[b][a]; the rocks are a refuge for the rock badgers.
translation:
  language: hi
  text: ऊँचे पहाड़ जंगली बकरों[a] के लिए हैं; चट्टानें शाफानों[b] की शरण हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात आइबेक्स—चट्टानी पहाड़ों में रहने वाला एक प्रकार का जंगली बकरा।
    reason: lexical_alternative
  - marker: b
    text: शाफान छोटा, चट्टानों में रहने वाला पशु है, जिसे अंग्रेज़ी में हाइरैक्स या रॉक बैजर कहा जाता है; यह वास्तविक बिज्जू नहीं है।
    reason: lexical_clarification
lexical_decisions:
- source_word: הָרִים הַגְּבֹהִים
  choice: ऊँचे पहाड़
  rationale: विशेषण और संज्ञा का सीधा, स्वाभाविक हिन्दी रूप; ऊँचे चट्टानी आवास का चित्र बनाए रखता है।
- source_word: לַיְּעֵלִים
  choice: जंगली बकरों के लिए
  rationale: יָעֵל पर्वतीय जंगली बकरे अथवा आइबेक्स को दर्शाता है। सामान्य पाठक के लिए 'जंगली बकरे' सहज है, जबकि अधिक विशिष्ट पहचान पाद-टिप्पणी में दी गई है।
- source_word: סְלָעִים
  choice: चट्टानें
  rationale: סֶלַע की चट्टानी संरचनाओं वाली छवि को संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מַחְסֶה
  choice: शरण
  rationale: सुरक्षा देने वाले आश्रय-स्थान का अर्थ व्यक्त करता है और भजन की काव्यात्मक गरिमा बनाए रखता है।
- source_word: לַשְׁפַנִּים
  choice: शाफानों की
  rationale: שָׁפָן का निश्चित आधुनिक हिन्दी लोकनाम व्यापक रूप से प्रचलित नहीं है। स्रोत-पशु के नाम का लिप्यंतरण गलत रूप से 'बिज्जू' जैसी दूसरी जाति बताने से बचता है; पहचान पाद-टिप्पणी में स्पष्ट की गई है।
