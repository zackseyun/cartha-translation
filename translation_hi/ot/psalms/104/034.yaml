  text: יֶעֱרַ֣ב עָלָ֣י/ו שִׂיחִ֑/י אָ֝נֹכִ֗י אֶשְׂמַ֥ח בַּ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/034.yaml
  text: May my meditation be pleasing to him[a]; I will rejoice in Yahweh.
translation:
  language: hi
  text: मेरा मनन उसे प्रिय लगे[a]; मैं यहोवा में आनन्दित रहूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरा मनन उसके लिए मधुर हो” अथवा “उसे स्वीकार्य हो।”
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶעֱרַב
  choice: प्रिय लगे
  rationale: क़ाल रूप यहाँ ‘मधुर/सुखद होना’ अथवा ‘प्रिय/स्वीकार्य लगना’ व्यक्त कर सकता है। प्रार्थनात्मक संदर्भ में ‘प्रिय लगे’ स्वाभाविक है और परमेश्वर द्वारा अनुकूल रूप से ग्रहण किए जाने का भाव रखता है।
- source_word: עָלָיו
  choice: उसे
  rationale: ערב के साथ על उस व्यक्ति को दर्शाता है जिसे कोई बात प्रिय लगती है; हिन्दी में ‘उसे प्रिय लगे’ सहज मुहावरा है। संदर्भ में पुल्लिंग एकवचन प्रत्यय परमेश्वर की ओर संकेत करता है।
- source_word: שִׂיחִי
  choice: मेरा मनन
  rationale: שׂיח का अर्थ मनन, चिंतन या कही गई बात हो सकता है। इस स्तुति-प्रधान प्रसंग में ‘मनन’ उपयुक्त है, जबकि ‘विलाप/शिकायत’ संदर्भानुकूल नहीं है।
- source_word: אָנֹכִי
  choice: मैं
  rationale: स्वतंत्र सर्वनाम में हल्का बल है; हिन्दी में दूसरी पंक्ति के आरम्भ का ‘मैं’ इसे पर्याप्त रूप से व्यक्त करता है, जबकि ‘मैं स्वयं’ अनावश्यक रूप से भारी लगेगा।
- source_word: אֶשְׂמַח
  choice: आनन्दित रहूँगा
  rationale: अपूर्ण क्रिया संकल्प अथवा निरन्तर प्रवृत्ति व्यक्त कर सकती है। ‘आनन्दित रहूँगा’ भविष्यगत संकल्प और स्थायी भाव—दोनों को स्वाभाविक हिन्दी में रखता है।
- source_word: בַּיהוָה
  choice: यहोवा में
  rationale: בְּ आनन्द के आधार अथवा विषय को दर्शाता है। ‘यहोवा में’ स्रोत की संरचना और अर्थ दोनों को बनाए रखता है; יהוה को व्यक्तिगत वाचा-नाम के रूप में ‘यहोवा’ लिखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में चार-अक्षरी व्यक्तिगत नाम सीधे उपस्थित है। हिन्दी बाइबल-पाठकों में परिचित ‘यहोवा’ उसका नाम के रूप में प्रत्यक्ष निरूपण करता है; उसे उपाधि ‘प्रभु’ से बदलने पर मूल में नाम और उपाधि का भेद मिट जाता। ‘याहवे’ अधिक निकट वैकल्पिक लिप्यन्तरण है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और काव्यात्मक हिन्दी। ‘मनन’ सामान्य धार्मिक-साहित्यिक शब्द है; ‘प्रिय लगे’ सरल और स्वाभाविक है। अर्धविराम इब्रानी काव्य की दो परस्पर सम्बद्ध पंक्तियों को स्पष्ट करता है।
