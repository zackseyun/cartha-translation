  yaml_path: translation/ot/psalms/104/032.yaml
  text: He looks at the earth[a], and it trembles; he touches the mountains, and they smoke.
translation:
  language: hi
  text: 'वह पृथ्वी को देखता है[a], और वह काँप उठती है;

    वह पर्वतों को छूता है, और वे धुआँ छोड़ते हैं।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप में: “जो पृथ्वी को देखता है, और वह काँप उठती है; वह पर्वतों को छूता है, और वे धुआँ छोड़ते हैं।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּבִּיט
  choice: वह ... दृष्टि करता है
  rationale: हिफ़िल कृदंत यहाँ परमेश्वर का वर्णन करने वाले संज्ञात्मक पद की तरह काम करता है—‘जो दृष्टि करता है।’ मुख्य पाठ में स्वाभाविक हिन्दी के लिए स्पष्ट सर्वनाम और वर्तमानकालीन क्रिया रखी गई है; अधिक रूपनिष्ठ रचना पादटिप्पणी में दी गई है।
- source_word: לָאָרֶץ
  choice: पृथ्वी पर
  rationale: אֶרֶץ का अर्थ ‘भूमि’ या ‘पृथ्वी’ हो सकता है। भजन 104 के सृष्टि-विषयक, विश्वव्यापी संदर्भ में ‘पृथ्वी’ उपयुक्त है।
- source_word: וַתִּרְעָד
  choice: और वह काँप उठती है
  rationale: רעד काँपने या थरथराने को व्यक्त करता है। ‘काँप उठती है’ पृथ्वी की तत्काल प्रतिक्रिया और काव्यात्मक सजीवता को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: יִגַּע
  choice: वह ... छूता है
  rationale: נגע का सामान्य अर्थ ‘छूना’ है। यह चयन परमेश्वर की सहज सामर्थ्य की छवि को बिना अतिव्याख्या के सुरक्षित रखता है।
- source_word: בֶּהָרִים
  choice: पर्वतों को
  rationale: הָרִים का सामान्य अर्थ ‘पर्वत’ है; यह मूल की विराट छवि को बनाए रखता है।
- source_word: וְיֶעֱשָׁנוּ
  choice: और वे धुआँ छोड़ने लगते हैं
  rationale: עשׁן का अर्थ ‘धुआँ देना/धुआँ छोड़ना’ है और बहुवचन क्रिया पर्वतों से मेल खाती है। यह हिन्दी में ‘वे धुआँते हैं’ की अपेक्षा अधिक स्वाभाविक है तथा आरंभिक/परिणामी क्रिया-भाव को भी व्यक्त करता है।
theological_decisions:
- issue: कृदंतात्मक वाक्यांश में निहित ईश्वरीय कर्ता
  choice: मुख्य पाठ में ‘वह’ रखकर आसपास के संदर्भ के परमेश्वर को कर्ता माना गया है।
  alternative: 'अधिक रूपनिष्ठ अनुवाद: ‘जो पृथ्वी पर दृष्टि करता है, और वह काँप उठती है...’'
  rationale: भजन का निकट संदर्भ कर्ता को स्पष्ट करता है। हिन्दी में ‘वह’ स्वाभाविक है, जबकि मूल की संज्ञात्मक कृदंत-रचना को पादटिप्पणी में सुरक्षित रखा गया है; इससे कोई अतिरिक्त सांप्रदायिक अर्थ नहीं जोड़ा जाता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और काव्यात्मक रजिस्टर। ‘दृष्टि करता है’ ऊँचा किंतु सामान्यतः बोधगम्य है; ‘काँप उठती है’ और ‘धुआँ छोड़ने लगते हैं’ दृश्य की तात्कालिकता को स्पष्ट करते हैं।
