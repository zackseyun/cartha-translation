  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और हल्की काव्यात्मक शैली रखी गई है। दुर्लभ इब्रानी संज्ञा की वास्तविक अनिश्चितता पाद-टिप्पणी में दी गई है; पक्षियों की ध्वनि को विशेष रूप से ‘गाना’ नहीं कहा गया।
