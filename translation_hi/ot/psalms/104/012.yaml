base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/012.yaml
  text: Above them the birds of the heavens dwell[a]; from among the branches they give forth their voice.
translation:
  language: hi
  text: उनके ऊपर आकाश के पक्षी बसेरा करते हैं; डालियों[a] के बीच से वे अपना स्वर उठाते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘पत्तेदार शाखाओं,’ ‘पर्णसमूह,’ अथवा ‘बड़ी डालियों।’ इब्रानी संज्ञा दुर्लभ है और व्यापक रूप से पत्तों वाली डालियों या पर्णसमूह का संकेत दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲלֵיהֶם
  choice: उनके ऊपर
  rationale: עַל के साथ सर्वनाम-प्रत्यय यहाँ पिछले पद की जलधाराओं के ऊपर या उनके आस-पास ऊँचाई में स्थित स्थान का चित्र देता है; ‘उनके ऊपर’ स्थान-संबंध को स्पष्ट रखते हुए मूल की काव्यात्मक छवि बचाता है।
- source_word: עוֹף הַשָּׁמַיִם
  choice: आकाश के पक्षी
  rationale: עוֹף सामूहिक रूप से उड़नेवाले जीवों, प्रसंग में पक्षियों, को दर्शाता है; ‘आकाश के पक्षी’ मूल संबंध-वाक्यांश का स्वाभाविक और गरिमापूर्ण हिन्दी रूप है।
- source_word: יִשְׁכּוֹן
  choice: बसेरा करते हैं
  rationale: שׁכן का अर्थ बसना या निवास करना है। ‘बसेरा करते हैं’ पक्षियों के संदर्भ में स्वाभाविक है और केवल घोंसला बनाने का अनावश्यक विशिष्टीकरण नहीं करता।
- source_word: מִבֵּין
  choice: के बीच से
  rationale: यह भीतर स्थित स्थान से स्वर निकलने का भाव देता है; ‘के बीच से’ हिन्दी में स्रोत और स्थान दोनों को सहज रूप से व्यक्त करता है।
- source_word: עֳפָאיִם
  choice: डालियों
  rationale: यह दुर्लभ संज्ञा संभवतः पत्तेदार डालियों, शाखाओं या पर्णसमूह को दर्शाती है। मुख्य पाठ में ‘डालियों’ स्पष्ट और प्रसंगानुकूल है, जबकि शब्द की अनिश्चितता पाद-टिप्पणी में सुरक्षित रखी गई है।
- source_word: יִתְּנוּ קוֹל
  choice: वे अपना स्वर निकालते हैं
  rationale: इस इब्रानी मुहावरे का शाब्दिक भाव ‘स्वर देना’ है। ‘अपना स्वर निकालते हैं’ पक्षियों के बोलने या गाने को अनावश्यक रूप से निश्चित किए बिना अर्थ को स्वाभाविक हिन्दी में रखता है।
