    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׂבְּעוּ
  choice: तृप्त होते हैं
  rationale: שׂבע का क़ाल रूप पूरी तरह भर जाने या पर्याप्त पोषण पाने का भाव देता है। वर्षा से सिंचित वृक्षों के संदर्भ में ‘तृप्त होते हैं’ काव्यात्मक मानवीकरण और भरपूरी—दोनों को बनाए रखता है।
- source_word: עֲצֵי יְהוָה
  choice: याहवे के वृक्ष
  rationale: रचना-संबंध को सीधे रखा गया है। ‘याहवे के वृक्ष’ का अर्थ उनके लगाए या उनके अधिकार में रहने वाले वृक्ष हो सकता है; अगला पदांश उन्हें लबानोन के देवदारों के रूप में स्पष्ट करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुराक्षरीय निजी नाम को उपाधि से बदलने के बजाय हिंदी में प्रचलित निकट लिप्यंतरण द्वारा प्रस्तुत किया गया है।
- source_word: אַרְזֵי לְבָנוֹן
  choice: लबानोन के देवदार
  rationale: दोनों संज्ञाओं के रचना-संबंध को स्वाभाविक हिंदी में रखा गया है; यह पदांश पहले पदांश का समानाधिकरणात्मक स्पष्टीकरण है।
- source_word: אֲשֶׁר נָטָע
  choice: जिन्हें उसने लगाया है
  rationale: संबंधवाचक उपवाक्य देवदारों को विशेषित करता है। क़ाल पूर्ण रूप सृष्टि में परमेश्वर के पहले किए कार्य के वर्तमान परिणाम को दर्शाता है, इसलिए हिंदी पूर्ण वर्तमान स्वाभाविक है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ निजी ईश्वरीय नाम का प्रयोग करता है। ‘याहवे’ उसे उपाधि से प्रतिस्थापित किए बिना सुरक्षित रखता है।
- issue: ‘याहवे के वृक्ष’ का संबंध
  choice: मूल का व्यापक संबंध बनाए रखा गया
  alternative: ‘याहवे द्वारा लगाए गए वृक्ष’
  rationale: यद्यपि अंतिम उपवाक्य बताता है कि उसने देवदार लगाए, पहले पदांश के रचना-संबंध को केवल कर्तृत्व तक सीमित करना मूल की संभावित व्यापकता को अनावश्यक रूप से घटाता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिंदी। ‘तृप्त’ काव्यात्मक मानवीकरण को बनाए रखता है; डैश दूसरे पदांश को पहले का स्पष्टीकरण दिखाता है।
