  text: מָֽה רַבּ֬וּ מַעֲשֶׂ֨י/ךָ יְֽהוָ֗ה כֻּ֭לָּ/ם בְּ/חָכְמָ֣ה עָשִׂ֑יתָ מָלְאָ֥ה הָ֝/אָ֗רֶץ קִנְיָנֶֽ/ךָ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/024.yaml
  text: How many are your works[a], O Yahweh! In wisdom you have made them all; the earth is full of your creatures.
translation:
  language: hi
  text: हे याहवे, तेरे काम कितने अधिक हैं! तूने उन सबको बुद्धि से बनाया है; पृथ्वी तेरी बनाई हुई वस्तुओं[a] से भरी है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तेरी संपत्ति से” अथवा “जो कुछ तेरा है, उससे।” इब्रानी शब्द किसी की अर्जित वस्तु या उसके अधिकार में होने वाली वस्तु को सूचित कर सकता है; इस प्रसंग में इसका आशय व्यापक रूप से परमेश्वर की बनाई हुई वस्तुओं से भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה רַבּוּ
  choice: कितने अनगिनत हैं
  rationale: यह विस्मयबोधक पदबंध कामों की प्रचुरता और विविधता व्यक्त करता है। केवल ‘कितने हैं’ हिन्दी में अधूरा-सा लगता, जबकि ‘कितने अनगिनत हैं’ काव्यात्मक विस्मय और बहुलता दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: מַעֲשֶׂיךָ
  choice: तेरे काम
  rationale: सृष्टि के प्रसंग में यह परमेश्वर द्वारा किए और बनाए गए कार्यों को समेटता है; ‘काम’ सामान्य आधुनिक हिन्दी में सहज और व्यापक है।
- source_word: יְהוָה
  choice: यहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को उपाधि से बदलने के बजाय हिन्दी में प्रचलित निकट लिप्यंतरण द्वारा सुरक्षित रखा गया है।
- source_word: כֻּלָּם
  choice: उन सबको
  rationale: यह पीछे आए ‘तेरे काम’ की ओर संकेत करता है और समग्रता का बल बनाए रखता है।
- source_word: בְּחָכְמָה
  choice: बुद्धि से
  rationale: संज्ञा ‘बुद्धि’ को बनाए रखते हुए यह सृष्टि करने के ढंग या साधन को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: עָשִׂיתָ
  choice: तूने ... बनाया है
  rationale: पूर्ण किए गए सृजन और उसके वर्तमान परिणाम को हिन्दी का पूर्णकाल सहज रूप से व्यक्त करता है।
- source_word: מָלְאָה הָאָרֶץ
  choice: पृथ्वी ... से भरी है
  rationale: इब्रानी पूर्ण क्रिया यहाँ वर्तमान परिणामी अवस्था बताती है; ‘पृथ्वी’ सृष्टि-भजन के वैश्विक संदर्भ के अनुकूल है।
- source_word: קִנְיָנֶךָ
  choice: तेरी बनाई वस्तुओं
  rationale: मूल शब्द उस वस्तु को सूचित कर सकता है जो किसी की प्राप्त की हुई या अधिकार में हो। संदर्भ में ये परमेश्वर की सृजी हुई और उसी की वस्तुएँ हैं; यह चयन सृष्टि-संदर्भ को स्पष्ट करता है, जबकि पादटिप्पणी स्वामित्व-केंद्रित विकल्प सुरक्षित रखती है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहवे
  alternative: यहोवा; प्रभु
  rationale: पाठ में व्यक्तिगत ईश्वरीय नाम है। उसे केवल उपाधि ‘प्रभु’ से प्रतिस्थापित न करके हिन्दी में निकट लिप्यंतरण दिया गया है।
- issue: קִנְיָנֶךָ में सृष्टि और स्वामित्व का संबंध
  choice: तेरी बनाई वस्तुओं
  alternative: तेरी संपत्ति; जो कुछ तेरा है
  rationale: आस-पास का संदर्भ परमेश्वर के बनाए हुए कामों का है, इसलिए मुख्य पाठ में सृजित वस्तुओं का भाव स्वाभाविक है। फिर भी मूल पद में अधिकार अथवा स्वामित्व का भाव भी संभव है, जिसे पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में काव्यात्मक पर सहज शैली रखी गई है। परमेश्वर के लिए एकवचन आत्मीय ‘तू/तेरे’ का प्रयोग भजन की सीधी संबोधन-शैली के अनुरूप है। विस्मयादिबोधक चिह्न मूल के विस्मय को उभारता है।
