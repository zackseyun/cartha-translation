source:
  edition: WLC
  text: הַ֥/מְקָרֶֽה בַ/מַּ֗יִם עֲֽלִיּ֫וֹתָ֥י/ו הַ/שָּׂם עָבִ֥ים רְכוּב֑/וֹ הַֽ֝/מְהַלֵּ֗ךְ עַל כַּנְפֵי רֽוּחַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/003.yaml
  text: who lays the beams of his upper chambers on the waters[a], who makes the clouds his chariot, who walks on the wings of the wind.
translation:
  language: hi
  text: 'जो जल के ऊपर अपने ऊपरी कक्षों के शहतीर बिछाता है,


    जो बादलों को अपना रथ बनाता है,


    जो हवा[a] के पंखों पर चलता है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘आत्मा के पंखों पर चलता है।’ इब्रानी शब्द का अर्थ ‘आत्मा’ भी हो सकता है; यहाँ आसपास की मौसम-संबंधी छवियों के कारण ‘हवा’ को प्राथमिकता दी गई है।
    reason: alternative_reading
lexical_decisions:
- source_word: הַמְקָרֶה
  choice: कड़ियाँ बिछाता है
  rationale: क्रिया קרה यहाँ भवन की छत के लिए कड़ियाँ लगाने या छत बनाने का चित्र देती है। यह चयन ठोस स्थापत्य-रूपक को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: בַמַּיִם
  choice: जल पर
  rationale: पूर्वसर्ग ב के कई अर्थ हो सकते हैं; इस स्थापत्य-चित्र में ‘जल पर’ ऊपरी कक्षों की कड़ियाँ टिकाने की ब्रह्मांडीय छवि को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: עֲלִיּוֹתָיו
  choice: अपने ऊपरी कक्षों
  rationale: संज्ञा का अर्थ भवन के ऊपरी कमरे या कक्ष है। ‘ऊपरी कक्ष’ अर्थ को ठीक रखते हुए गरिमापूर्ण आधुनिक हिन्दी है।
- source_word: הַשָּׂם
  choice: बनाता है
  rationale: שׂים का मूल अर्थ रखना या स्थापित करना है; बादलों और रथ के इस विधेयात्मक वाक्य में ‘बनाता है’ सबसे स्वाभाविक है।
- source_word: עָבִים
  choice: बादलों
  rationale: यह शब्द बादलों, कभी-कभी घने बादलों, को दर्शाता है। यहाँ सामान्य ‘बादल’ पर्याप्त है और काव्यात्मक प्रवाह बनाए रखता है।
- source_word: רְכוּבוֹ
  choice: अपना रथ
  rationale: शब्द सवारी, वाहन या रथ को सूचित करता है। ‘रथ’ ईश-प्रकटन की सजीव काव्यात्मक छवि को सुरक्षित रखता है।
- source_word: הַמְהַלֵּךְ
  choice: चलता है
  rationale: הלך का यह रूप चलने या आगे बढ़ने का चित्र देता है। ‘चलता है’ मानवरूपी काव्यात्मक अभिव्यक्ति को सीधे बनाए रखता है।
- source_word: כַּנְפֵי
  choice: पंखों
  rationale: כנף का अर्थ पंख, किनारा या छोर हो सकता है; हवा की तीव्र गति के इस चित्र में ‘पंख’ सबसे सजीव और संदर्भानुकूल है।
- source_word: רוּחַ
  choice: हवा
  rationale: רוּחַ का अर्थ हवा, श्वास या आत्मा हो सकता है। बादलों, रथ और पंखों के मौसम-संबंधी प्रसंग में ‘हवा’ प्राथमिक अर्थ है; वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: अंतिम पंक्ति में רוּחַ का अर्थ
  choice: हवा
  alternative: आत्मा
  rationale: शब्द अर्थ की दृष्टि से व्यापक है, पर बादलों, रथ और पंखों की तत्काल प्रकृति-संबंधी छवि ‘हवा’ का समर्थन करती है। पादटिप्पणी ‘आत्मा’ की वास्तविक शाब्दिक संभावना को बनाए रखती है और किसी अनावश्यक सिद्धान्तगत निष्कर्ष से बचती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक रखी गई है। समानांतर तीन उपवाक्यों में ‘जो’ की पुनरावृत्ति इब्रानी संरचना और स्तुति-काव्य की लय को बनाए रखती है। पादटिप्पणी-चिह्न को उसी शब्द ‘हवा’ के बाद रखा गया है जिससे वैकल्पिक अर्थ संबंधित है।
