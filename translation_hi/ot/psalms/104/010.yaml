  text: הַֽ/מְשַׁלֵּ֣חַ מַ֭עְיָנִים בַּ/נְּחָלִ֑ים בֵּ֥ין הָ֝רִ֗ים יְהַלֵּכֽוּ/ן׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/010.yaml
  text: He sends springs into the valleys[a]; they flow between the mountains.
translation:
  language: hi
  text: वह घाटियों[a] में सोते बहाता है; वे पहाड़ों के बीच बहते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मौसमी नदी-तलों में” या “खड्डों में”; इब्रानी शब्द मौसमी जलधाराओं के पाटों अथवा उनसे जुड़ी घाटियों को दर्शा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמְשַׁלֵּחַ
  choice: वह ... बहाता है
  rationale: हिफ़ील कृदंत यहाँ परमेश्वर के निरंतर प्रबंधकारी कार्य का वर्णन करता है। हिंदी में कर्ता सहित वर्तमानकालीन क्रिया स्वाभाविक है; जल-स्रोतों के संदर्भ में ‘बहाता है’ भेजने और प्रवाहित करने, दोनों भावों को सहज रूप से व्यक्त करता है।
- source_word: מַעְיָנִים
  choice: सोते
  rationale: מַעְיָן प्राकृतिक जल-स्रोत या झरने को दर्शाता है। ‘सोते’ संक्षिप्त और प्रचलित बाइबलीय हिंदी है तथा यहाँ बहते जल के उद्गम का भाव देता है।
- source_word: בַּנְּחָלִים
  choice: घाटियों में
  rationale: נחל का अर्थ मौसमी नदी-तल, नाला, खड्ड या उससे जुड़ी घाटी हो सकता है। मुख्य पाठ में ‘घाटियों’ स्थलाकृतिक दृश्य को सरलता से व्यक्त करता है, जबकि वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित हैं।
- source_word: בֵּין הָרִים
  choice: पहाड़ों के बीच
  rationale: यह इब्रानी वाक्यांश सीधे तौर पर पहाड़ों के मध्य की स्थिति बताता है; हिंदी में यही स्वाभाविक और सटीक रूप है।
- source_word: יְהַלֵּכוּן
  choice: वे ... बहते हैं
  rationale: הלך का मूल अर्थ चलना या जाना है, पर जल के लिए हिंदी में ‘बहना’ प्रसंगानुकूल है और गति की मूल छवि बनाए रखता है।
theological_decisions:
- issue: कृदंत का निहित कर्ता
  choice: ‘वह’ से परमेश्वर का संकेत
  alternative: ‘भेजनेवाला’ अथवा कृदंतीय खंड
  rationale: भजन के संदर्भ में सृष्टि को व्यवस्थित करने वाला कर्ता परमेश्वर है। हिंदी में पूर्ण और स्वाभाविक वाक्य के लिए ‘वह’ देना आवश्यक है; इससे पाठ में कोई अतिरिक्त सांप्रदायिक व्याख्या नहीं जुड़ती।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिंदी। ‘सोते’ प्राकृतिक जल-स्रोतों के लिए संक्षिप्त पद है; ‘घाटियों’ सामान्य पाठक के लिए स्पष्ट है, और इब्रानी शब्द की भौगोलिक व्यापकता पादटिप्पणी में दी गई है।
