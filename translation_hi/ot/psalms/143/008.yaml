  text: הַשְׁמִ֘יעֵ֤/נִי בַ/בֹּ֨קֶר חַסְדֶּ/ךָ֮ כִּֽי בְ/ךָ֪ בָ֫טָ֥חְתִּי הוֹדִיעֵ֗/נִי דֶּֽרֶךְ ז֥וּ אֵלֵ֑ךְ כִּֽי אֵ֝לֶי/ךָ נָשָׂ֥אתִי נַפְשִֽׁ/י׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/143/008.yaml
  text: Let me hear your steadfast love in the morning[a], for in you I trust. Make known to me the way I should go[c][b], for to you I lift up my soul.
translation:
  language: hi
  text: भोर में मुझे अपना अटल प्रेम सुनने दे[a], क्योंकि मैं तुझ पर भरोसा रखता हूँ। मुझे वह मार्ग बता जिस पर मुझे चलना चाहिए[b], क्योंकि मैं अपना प्राण तेरी ओर उठाता हूँ[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “भोर में मुझे अपना अटल प्रेम सुनवा।”
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “वह मार्ग जिस पर मैं चलूँगा।”
    reason: lexical_alternative
  - marker: c
    text: “अपना प्राण तेरी ओर उठाता हूँ” एक इब्रानी अभिव्यक्ति है, जिसका भाव अपने आपको परमेश्वर को सौंपना या अपने पूरे भीतरी जीवन को उसकी ओर उन्मुख करना है।
    reason: cultural_note
lexical_decisions:
- source_word: הַשְׁמִיעֵנִי
  choice: मुझे ... का संदेश सुना
  rationale: हिफ़ील आज्ञार्थक का मूल भाव ‘मुझे सुनवा’ है। ‘संदेश सुना’ हिन्दी में अगले पद חַסְדֶּךָ को सुनने की असामान्य लेकिन सार्थक इब्रानी अभिव्यक्ति को स्पष्ट और स्वाभाविक बनाता है।
- source_word: בַבֹּקֶר
  choice: भोर को
  rationale: एकवचन कालवाचक पद प्रातःकाल को सूचित करता है; इसमें ‘हर सुबह’ का आदतन भाव या ‘सुबह तक’ की समय-सीमा जोड़ना उचित नहीं।
- source_word: חַסְדֶּךָ
  choice: अपनी अटल करुणा
  rationale: חסד में प्रेमपूर्ण कृपा और स्थायी निष्ठा दोनों निहित हैं। ‘अटल करुणा’ आधुनिक हिन्दी में इन दोनों पक्षों को संक्षेप में व्यक्त करती है और केवल दया तक अर्थ को सीमित नहीं करती।
- source_word: בְךָ בָטָחְתִּי
  choice: मैं तुझ पर भरोसा रखता हूँ
  rationale: पूर्ण क्रिया यहाँ स्थापित और वर्तमान भरोसे की दशा व्यक्त कर सकती है। वर्तमानकालीन हिन्दी प्रार्थना के प्रसंग में यही भाव सहज रूप से देती है।
- source_word: הוֹדִיעֵנִי
  choice: मुझे ... बता
  rationale: ידע के हिफ़ील का अर्थ ‘जानने दे/ज्ञात करा’ है। ‘बता’ आधुनिक हिन्दी में स्वाभाविक रहते हुए प्रकाशन और मार्गदर्शन की विनती को व्यक्त करता है।
- source_word: דֶּרֶךְ זוּ אֵלֵךְ
  choice: वह मार्ग ... जिस पर मुझे चलना चाहिए
  rationale: शाब्दिक संरचना ‘वह मार्ग जिस पर मैं चलूँगा’ है। विनती के प्रसंग में ‘चलना चाहिए’ अभिप्रेत मार्गदर्शन को स्वाभाविक हिन्दी में व्यक्त करता है; शाब्दिक विकल्प पादटिप्पणी में सुरक्षित है।
- source_word: נָשָׂאתִי נַפְשִׁי
  choice: मैं अपना प्राण तेरी ओर उठाता हूँ
  rationale: इब्रानी रूपक को मिटाकर केवल ‘मैं अपने को सौंपता हूँ’ नहीं किया गया। ‘प्राण’ נפש के सम्पूर्ण जीवित/भीतरी व्यक्तित्व के भाव को रखता है, और ‘तेरी ओर उठाता हूँ’ दिशा, लालसा तथा निर्भरता का काव्यात्मक तनाव बनाए रखता है।
theological_decisions:
- issue: परमेश्वर के חסד का अनुवाद
  choice: अपनी अटल करुणा
  alternative: अपना अटल प्रेम; अपनी वाचा की प्रीति; अपनी दया
  rationale: चुना हुआ पद प्रेमपूर्ण कृपा और विश्वसनीय निष्ठा को साथ रखता है, पर ‘वाचा’ शब्द जोड़कर उस निहितार्थ को पाठ में स्पष्ट सिद्धान्त के रूप में आरोपित नहीं करता।
- issue: נָשָׂאתִי נַפְשִׁי के रूपक का संरक्षण
  choice: मैं अपना प्राण तेरी ओर उठाता हूँ
  alternative: मैं अपने आपको तुझे सौंपता हूँ; मैं अपनी पूरी अन्तरात्मा तेरी ओर लगाता हूँ
  rationale: मूल रूपक को सुरक्षित रखने से आत्मसमर्पण, प्रार्थनापूर्ण लालसा और सम्पूर्ण आन्तरिक जीवन को परमेश्वर की ओर लगाने जैसे सम्भव अर्थ खुले रहते हैं।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और प्रार्थनात्मक हिन्दी। परमेश्वर के लिए एकवचन आत्मीय संबोधन ‘तू/तेरा’ रखा गया है, जो हिन्दी भजन-प्रार्थना शैली में आदरहीन नहीं बल्कि निकटता सूचित करता है। वाक्यरचना सहज रखी गई है, जबकि ‘प्राण ... उठाता हूँ’ जैसे मूल काव्यात्मक रूपक को संरक्षित किया गया है।
