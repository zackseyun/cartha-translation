id: PSA.143.3
reference: Psalms 143:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּ֥י רָ֘דַ֤ף אוֹיֵ֨ב נַפְשִׁ֗/י דִּכָּ֣א לָ֭/אָרֶץ חַיָּתִ֑/י הוֹשִׁיבַ֥/נִי בְ֝/מַחֲשַׁכִּ֗ים כְּ/מֵתֵ֥י עוֹלָֽם׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/143/003.yaml
  text: For an enemy has pursued my soul[a]; he has crushed my life to the ground; he has made me dwell in dark places[b], like those long dead.
translation:
  language: hi
  text: क्योंकि एक शत्रु ने मेरे प्राणों[a] का पीछा किया है; उसने मेरे जीवन को धरती पर कुचल दिया है; उसने मुझे अँधेरे स्थानों में रहने को मजबूर किया है, बहुत पहले मर चुके लोगों के समान[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मेरा पीछा किया है”; यहाँ “मेरे प्राण” पूरे व्यक्ति के लिए प्रयुक्त एक सामान्य इब्रानी काव्यात्मक अभिव्यक्ति है।
    reason: lexical_alternative
  - marker: b
    text: या “पुराने समय से मरे हुओं के समान।”
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह आसपास की विनती का कारण प्रस्तुत करता है और इब्रानी के कारणसूचक बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: רָדַף אוֹיֵב
  choice: एक शत्रु ने ... पीछा किया है
  rationale: רָדַף का मूल चित्र पीछा करने का है; אוֹיֵב अनिश्चित एकवचन है, इसलिए 'एक शत्रु' इब्रानी रूप को दर्शाता है।
- source_word: נַפְשִׁי
  choice: मेरे प्राण
  rationale: נֶפֶשׁ यहाँ पूरे व्यक्ति अथवा जीवन का काव्यात्मक संकेत है। 'प्राण' हिन्दी में काव्यात्मक गरिमा रखता है और आगे आने वाले 'मेरे जीवन' से शब्दगत भेद बनाए रखता है।
- source_word: דִּכָּא לָאָרֶץ חַיָּתִי
  choice: मेरे जीवन को कुचलकर धरती पर गिरा दिया है
  rationale: דִּכָּא कुचलने या तोड़ डालने का प्रबल बिंब देता है, जबकि לָאָרֶץ नीचे धरती तक गिरा दिए जाने को व्यक्त करता है।
- source_word: הוֹשִׁיבַנִי בְמַחֲשַׁכִּים
  choice: उसने मुझे अँधेरे स्थानों में बसा दिया है
  rationale: הוֹשִׁיבַנִי का कारक भाव जबरन किसी दशा या स्थान में रखे जाने को दर्शाता है; מַחֲשַׁכִּים बहुवचन है, इसलिए 'अँधेरे स्थानों' रखा गया है।
- source_word: כְּמֵתֵי עוֹלָם
  choice: मानो मैं बहुत पहले मरे हुओं में से हूँ
  rationale: मुहावरे का आशय प्राचीन समय से मृत पड़े लोगों जैसा होना है। यह हिन्दी रूप तुलना को स्पष्ट और स्वाभाविक रखता है, बिना इसे अनिवार्य रूप से 'सदा के लिए मृत' अर्थ देने के।
theological_decisions:
- issue: נַפְשִׁי में 'प्राण' का अर्थ
  choice: मुख्य पाठ में 'मेरे प्राण' रखा और पादटिप्पणी में पूरे व्यक्ति का भाव स्पष्ट किया।
  alternative: '''मेरा'' या ''मुझे'''
  rationale: इससे इब्रानी काव्यात्मक अभिव्यक्ति और חַיָּתִי ('मेरे जीवन') के साथ उसका शब्दगत तनाव सुरक्षित रहता है; इसे मनुष्य के किसी पृथक अमूर्त भाग के बारे में सिद्धान्तगत कथन नहीं बनाया गया।
- issue: כְּמֵתֵי עוֹלָם का कालगत अर्थ
  choice: बहुत पहले मरे हुओं जैसा
  alternative: सदा के लिए मरे हुए
  rationale: עוֹלָם यहाँ दूरस्थ प्राचीन काल का संकेत दे सकता है। संदर्भ कब्र-जैसे अन्धकार और परित्याग का है; अनन्त मृत्यु का धर्मवैज्ञानिक निष्कर्ष थोपना आवश्यक नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमामय काव्यात्मक शैली रखी गई है। 'प्राण' और 'अँधेरे स्थानों' जैसे पद मूल की काव्यात्मकता तथा शब्दगत बारीकियों को बनाए रखते हैं, जबकि वाक्य-संरचना सामान्य पाठक के लिए सहज रखी गई है।
