review_pass:
  verdict: revise
  source_fidelity: 'The draft generally follows the Hebrew well: it preserves the causal opening, the singular indefinite enemy, the pursuit imagery, the distinction between נַפְשִׁי and חַיָּתִי, the plural ‘dark places,’ and the temporal sense of כְּמֵתֵי עוֹלָם. However, ‘कुचलकर धरती पर गिरा दिया’ adds a separate causative action of making the life fall; the Hebrew more directly says that the enemy has crushed the psalmist’s life to the ground. The omitted second footnote also leaves the English audit-trail alternative unrepresented.'
  naturalness: ‘मेरे प्राण का पीछा किया है’ is understandable but somewhat stiff in modern Hindi. ‘मेरे प्राणों का पीछा किया है’ is a more idiomatic poetic expression while retaining the Hebrew’s life/self idiom. ‘रहने को मजबूर किया है’ naturally conveys the causative force of הוֹשִׁיבַנִי without suggesting ordinary settlement.
  terminology: ‘प्राणों’ suitably preserves the poetic force of נֶפֶשׁ without requiring a doctrinal sense of an immaterial soul; ‘जीवन’ appropriately renders חַיָּתִי. ‘अँधेरे स्थानों’ accurately retains the plural. ‘बहुत पहले मर चुके लोगों के समान’ gives the likely ‘long dead/dead of old’ sense without imposing ‘eternally dead.’
  issues:
  - severity: medium
    issue: The rendering ‘कुचलकर धरती पर गिरा दिया है’ introduces ‘made [it] fall,’ which is not explicitly expressed by the Hebrew.
    rationale: דִּכָּא לָאָרֶץ means that the enemy has crushed the psalmist’s life to the ground. Rendering this as ‘मेरे जीवन को धरती पर कुचल दिया है’ is closer and avoids adding a distinct action.
  - severity: low
    issue: The alternative-reading footnote corresponding to English footnote b is absent, and its anchor is absent from the Hindi text.
    rationale: The audit trail identifies a legitimate alternative for כְּמֵתֵי עוֹלָם. Including it preserves the supplied translation-note coverage.
  - severity: low
    issue: ‘मेरे प्राण का पीछा’ is less natural Hindi phrasing.
    rationale: The plural idiom ‘मेरे प्राणों का पीछा’ reads more naturally in elevated modern Hindi and continues to distinguish this expression from ‘मेरे जीवन.’
  revised_text: क्योंकि एक शत्रु ने मेरे प्राणों[a] का पीछा किया है; उसने मेरे जीवन को धरती पर कुचल दिया है; उसने मुझे अँधेरे स्थानों में रहने को मजबूर किया है, बहुत पहले मर चुके लोगों के समान[b]।
  revised_footnotes:
  - marker: a
    text: या “मेरा पीछा किया है”; यहाँ “मेरे प्राण” पूरे व्यक्ति के लिए प्रयुक्त एक सामान्य इब्रानी काव्यात्मक अभिव्यक्ति है।
    reason: lexical_alternative
  - marker: b
    text: या “पुराने समय से मरे हुओं के समान।”
    reason: alternative_reading
  revision_rationale: The revision removes the added notion of causing the life to fall, improves the idiomatic Hindi expression for the Hebrew ‘my soul,’ and restores the missing alternative-reading footnote and anchor. It retains the draft’s elevated but modern register, lexical distinction between ‘प्राण’ and ‘जीवन,’ and the Hebrew plural ‘dark places.’
