revisions:
- from: क्योंकि एक शत्रु ने मेरे प्राण[a] का पीछा किया है; उसने मेरे जीवन को कुचलकर धरती पर गिरा दिया है; उसने मुझे अँधेरे स्थानों में बसा दिया है, मानो मैं बहुत पहले मरे हुओं में से हूँ।
  to: क्योंकि एक शत्रु ने मेरे प्राणों[a] का पीछा किया है; उसने मेरे जीवन को धरती पर कुचल दिया है; उसने मुझे अँधेरे स्थानों में रहने को मजबूर किया है, बहुत पहले मर चुके लोगों के समान[b]।
  rationale: The revision removes the added notion of causing the life to fall, improves the idiomatic Hindi expression for the Hebrew ‘my soul,’ and restores the missing alternative-reading footnote and anchor. It retains the draft’s elevated but modern register, lexical distinction between ‘प्राण’ and ‘जीवन,’ and the Hebrew plural ‘dark places.’
  reviewer_model: gpt-5.6-terra
