  text: और अपने दास के साथ न्याय-विवाद में न पड़, क्योंकि तेरे सामने कोई भी जीवित मनुष्य धर्मी नहीं ठहरता।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्योंकि तेरे सामने कोई भी जीवित मनुष्य धर्मी नहीं ठहराया जाएगा।”
    reason: יִצְדַּק के प्रबल न्यायिक अर्थ और संभावित भविष्यकालीन भाव को सुरक्षित रखने के लिए।
lexical_decisions:
- source_word: וְ/אַל
  choice: और ... न
  rationale: संयोजक और निषेध पिछले पद की विनती को आगे बढ़ाते हैं; ‘और’ इस प्रवाह को बिना अनावश्यक विरोध जोड़े बनाए रखता है।
- source_word: תָּב֣וֹא בְ֭/מִשְׁפָּט אֶת עַבְדֶּ֑/ךָ
  choice: अपने दास को न्याय के कटघरे में न ला
  rationale: इब्रानी मुहावरा न्यायिक कार्यवाही में प्रवेश करने को व्यक्त करता है। शाब्दिक ‘अपने दास के साथ न्याय में प्रवेश न कर’ की तुलना में यह स्वाभाविक आधुनिक हिन्दी में कानूनी रूपक स्पष्ट रखता है। ‘दास’ प्रार्थना में वक्ता की अधीनता को सुरक्षित रखता है।
- source_word: כִּ֤י
  choice: क्योंकि
  rationale: यह पहली विनती का कारण प्रस्तुत करता है और आधुनिक हिन्दी में स्पष्ट तथा स्वाभाविक है।
- source_word: לֹֽא יִצְדַּ֖ק
  choice: धर्मी नहीं ठहरता
  rationale: צדק के नैतिक ‘धर्मी होना’ और न्यायिक ‘सही/निर्दोष ठहरना’ दोनों आयामों को ‘धर्मी ... ठहरता’ साथ रखता है; न्यायिक वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: לְ/פָנֶ֣י/ךָ
  choice: तेरे सामने
  rationale: यह परमेश्वर की उपस्थिति और उसके मूल्यांकन, दोनों के लिए स्वाभाविक हिन्दी अभिव्यक्ति है।
- source_word: כָל חָֽי
  choice: कोई भी जीवित जन
  rationale: निषेध के साथ शाब्दिक ‘हर जीवित [जन]’ का अर्थ सार्वभौमिक नकार है। ‘जीवित जन’ काव्यात्मक संक्षिप्तता रखता है और संदर्भ को मनुष्यों पर केंद्रित करता है।
theological_decisions:
- issue: יִצְדַּק का न्यायिक और नैतिक अर्थ
  choice: कोई भी जीवित जन धर्मी नहीं ठहरता
  alternative: कोई भी जीवित जन तेरे सामने निर्दोष नहीं ठहराया जाएगा
  rationale: मुख्य पाठ सार्वभौमिक मानवीय अधार्मिकता और न्यायालयीन संदर्भ दोनों को ‘धर्मी नहीं ठहरता’ में बनाए रखता है। पादटिप्पणी स्पष्ट न्यायिक/निष्क्रिय अर्थ सुरक्षित रखती है और किसी बाद की सिद्धान्तगत प्रणाली को पाठ पर आरोपित नहीं करती।
