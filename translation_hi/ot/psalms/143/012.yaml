id: PSA.143.12
reference: Psalms 143:12
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וּֽ/בְ/חַסְדְּ/ךָ֮ תַּצְמִ֪ית אֹ֫יְבָ֥/י וְֽ֭/הַאֲבַדְתָּ כָּל צֹרֲרֵ֣י נַפְשִׁ֑/י כִּ֝֗י אֲנִ֣י עַבְדֶּֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/143/012.yaml
  text: And in your steadfast love you will cut off my enemies[a], and you will destroy all the adversaries of my soul[b], for I am your servant.
translation:
  language: hi
  text: और अपने अटल प्रेम में तू मेरे शत्रुओं का अन्त कर देगा[a], और मेरे प्राण के सब विरोधियों को नाश कर देगा[b], क्योंकि मैं तेरा सेवक हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अपने अटल प्रेम के द्वारा’; इब्रानी पूर्वसर्ग साधन के साथ-साथ कार्य के संदर्भ या आधार को भी व्यक्त कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘मेरे प्राण’ का अर्थ ‘मेरा जीवन’ या केवल ‘मुझे’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְחַסְדְּךָ
  choice: और अपने अटल प्रेम में
  rationale: חֶסֶד में निष्ठावान, करुणामय और वाचा-संबंधी प्रेम का भाव है। ‘अटल प्रेम’ इसे स्वाभाविक हिन्दी में व्यक्त करता है। ב को ‘में’ रखा गया है, यद्यपि साधनवाचक ‘के द्वारा’ भी सम्भव है।
- source_word: תַּצְמִית
  choice: अन्त कर देगा
  rationale: צמת के हिफ़ील रूप का अर्थ किसी को समाप्त कर देना या मिटा देना है। ‘अन्त कर देना’ इसकी तीव्रता बनाए रखता है और अगले क्रियापद ‘नाश करना’ से शब्दगत भिन्नता भी रखता है।
- source_word: אֹיְבָי
  choice: मेरे शत्रुओं
  rationale: बहुवचन संज्ञा और प्रथम पुरुष एकवचन प्रत्यय का सीधा और स्वाभाविक अनुवाद।
- source_word: וְהַאֲבַדְתָּ
  choice: और ... नाश कर देगा
  rationale: אבד के हिफ़ील का अर्थ नाश करना या मरवा देना है। ‘नाश करना’ मूल की प्रबलता को बिना नरम किए व्यक्त करता है।
- source_word: כָּל צֹרֲרֵי נַפְשִׁי
  choice: मेरे प्राण के सभी विरोधियों
  rationale: צֹרֲרֵי शत्रुता रखने या सताने वालों को दर्शाता है। נֶפֶשׁ के लिए ‘प्राण’ काव्यात्मक हिन्दी में जीवन, स्वयं और भीतरी व्यक्ति की अर्थ-व्याप्ति को कुछ हद तक बनाए रखता है।
- source_word: כִּי אֲנִי עַבְדֶּךָ
  choice: क्योंकि मैं तेरा सेवक हूँ
  rationale: כִּי यहाँ निवेदन का आधार बताता है। עֶבֶד के लिए परमेश्वर को संबोधित भजन की प्रार्थना में ‘सेवक’ विनम्र अधीनता और अपनेपन को स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: शत्रुओं के विरुद्ध विनाश की प्रार्थना
  choice: मूल की सीधी और कठोर भाषा—‘अन्त कर देगा’ और ‘नाश कर देगा’—बनाए रखी गई है।
  alternative: इसे ‘हरा देगा’, ‘चुप करा देगा’ या अन्य कम कठोर भाषा से नरम करना।
  rationale: दोनों इब्रानी क्रियाएँ प्रबल हैं। अनुवाद को दैवी न्याय के लिए की गई इस प्रार्थना का तनाव बनाए रखना चाहिए, न कि पाठक की असुविधा दूर करने के लिए उसे हल्का करना चाहिए।
- issue: भविष्यवाणी अथवा प्रार्थनात्मक विश्वास का स्वर
  choice: इब्रानी अपूर्ण क्रियारूपों को हिन्दी भविष्यकाल ‘कर देगा’ से व्यक्त किया गया है।
  alternative: आज्ञार्थक निवेदन ‘अन्त कर दे ... नाश कर दे’।
  rationale: रूप भविष्यकालीन कथन या विश्वासपूर्ण अपेक्षा के रूप में सहज पढ़े जाते हैं; सन्दर्भ में निवेदन का भाव उपस्थित रहते हुए भी व्याकरण को सीधे आज्ञार्थक नहीं बनाया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण भजनात्मक शैली रखी गई है। परमेश्वर के लिए निकट, एकवचन सम्बोधन ‘तू/तेरा’ प्रयुक्त है। समानान्तर पंक्तियों में दो अलग प्रबल क्रियाएँ रखकर इब्रानी काव्य की शब्दगत विविधता सुरक्षित की गई है।
