  register: भाषा आधुनिक मानक हिन्दी में, काव्यात्मक किंतु सामान्य पाठक के लिए सहज रखी गई है। परमेश्वर के लिए आदरसूचक ‘आप’ का प्रयोग किया गया है। तीनों पंक्तियों की चिंतनशील समानांतरता बनाए रखते हुए निकटार्थी क्रियाओं में स्वाभाविक भेद रखा गया है।
