  text: I remember the days of old[a]; I meditate on all your work[b]; I muse on the work of your hands.
translation:
  language: hi
  text: 'मैं पुराने दिनों को याद करता हूँ[a];

    मैं आपके सभी कार्यों पर मनन करता हूँ;

    मैं आपके हाथों के कार्यों पर विचार करता हूँ[b]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैंने पुराने दिनों को याद किया।” इब्रानी का पूर्ण काल यहाँ भूतकाल अथवा वर्तमान स्मरण-क्रिया—दोनों रूपों में समझा जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी क्रिया का अर्थ “मनन करना” या “विचार करना” हो सकता है; कभी-कभी इसमें बोलने अथवा मन में दोहराने का भाव भी होता है, पर यहाँ संदर्भ आंतरिक चिंतन की ओर संकेत करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: זָכַרְתִּי
  choice: मैं ... स्मरण करता हूँ
  rationale: काल रूप पूर्ण है और भूतकाल भी व्यक्त कर सकता है, पर काव्य-संदर्भ में भजनकार की वर्तमान स्मरण-क्रिया को सहज रूप से व्यक्त करने के लिए वर्तमान काल चुना गया है।
- source_word: יָמִים מִקֶּדֶם
  choice: प्राचीन दिनों को
  rationale: यह पदबंध बहुत पहले के समय या पूर्वकाल को दर्शाता है। ‘प्राचीन दिन’ संक्षिप्त, गरिमापूर्ण और आधुनिक हिन्दी में बोधगम्य है।
- source_word: הָגִיתִי
  choice: मैं ... मनन करता हूँ
  rationale: הגה यहाँ भीतर विचार करने, मनन करने या ध्यान लगाने का भाव देता है। ‘मनन’ चिंतनशील क्रम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: בְּכָל פָּעֳלֶךָ
  choice: आपके सभी कार्यों पर
  rationale: פֹּעַל कार्य, कर्म या गतिविधि को दर्शाता है। ‘सभी कार्यों’ से सामूहिक अर्थ सहज हिन्दी में सुरक्षित रहता है।
- source_word: בְּמַעֲשֵׂה יָדֶיךָ
  choice: आपके हाथों के काम पर
  rationale: यह अनुवाद मूल की सजीव मानव-सदृश छवि को बनाए रखता है और उसे केवल ‘आपकी सृष्टि’ जैसे अधिक व्याख्यात्मक पद तक सीमित नहीं करता।
- source_word: אֲשׂוֹחֵחַ
  choice: मैं गहराई से विचार करता हूँ
  rationale: שׂיח मनन, विचार या बोलने का अर्थ दे सकता है। इस समानांतर संदर्भ में आंतरिक चिंतन प्रमुख है; ‘गहराई से विचार’ पहले ‘मनन’ से हल्का भेद भी बनाए रखता है।
