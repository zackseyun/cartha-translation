base_translation:
  language: en
  yaml_path: translation/ot/psalms/143/011.yaml
  text: For the sake of your name[a], O Yahweh, preserve my life[d][c][b]; in your righteousness bring my soul out of distress.
translation:
  language: hi
  text: अपने नाम की खातिर, हे याहवे, मुझे जीवित रख[a]; अपनी धार्मिकता से मेरे प्राण[d] को संकट[c] से निकाल[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मुझे जीवन दे” अथवा “मुझे फिर से जीवित कर।” इब्रानी क्रिया का अर्थ जीवित रखना, जीवन देना, या पुनर्जीवित करना हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “अपनी धार्मिकता में,” “अपनी धार्मिकता के अनुसार,” अथवा “अपने न्याय के द्वारा।”
    reason: lexical_alternative
  - marker: c
    text: या, “मुसीबत” या “क्लेश से निकाल।”
    reason: lexical_alternative
  - marker: d
    text: शाब्दिक रूप से, “मेरे प्राण को”; इब्रानी मुहावरे में इसका अर्थ “मुझे” या “मेरे जीवन को” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן שִׁמְךָ
  choice: अपने नाम के निमित्त
  rationale: यह पदबंध उद्देश्य अथवा प्रेरक आधार बताता है और परमेश्वर के नाम, अर्थात उसकी प्रकट प्रतिष्ठा और महिमा, की बाइबलीय अभिव्यक्ति को बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय दिव्य नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित व्यक्तिगत नाम ‘यहोवा’ के रूप में रखा गया है।
- source_word: תְּחַיֵּנִי
  choice: मुझे जीवित रख
  rationale: חיה के पिएल रूप में जीवित रखना, जीवन देना, अथवा फिर से सजीव करना—ये अर्थ संभव हैं। विलाप और संकट के संदर्भ में ‘मुझे जीवित रख’ स्वाभाविक है और मृत्यु से रक्षा की विनती को स्पष्ट करता है।
- source_word: בְּצִדְקָתְךָ
  choice: अपनी धार्मिकता के अनुसार
  rationale: בְ साधन अथवा मानक/आधार बता सकता है। यह हिन्दी वाक्य परमेश्वर की धार्मिकता को उद्धार के आधार और उसके चरित्र के अनुरूप कार्य के रूप में व्यक्त करता है।
- source_word: תוֹצִיא מִצָּרָה
  choice: संकट से निकाल
  rationale: יצא का हिफिल ठोस रूप से ‘बाहर निकालना’ बताता है; צָרָה के लिए ‘संकट’ विलाप की परिस्थिति को सहज हिन्दी में व्यक्त करता है।
- source_word: נַפְשִׁי
  choice: मेरे प्राण को
  rationale: נפש यहाँ व्यक्ति, जीवन अथवा प्राण को सूचित कर सकता है। ‘मेरे प्राण’ इब्रानी काव्यात्मक अभिव्यक्ति को बनाए रखता है, जबकि उसका आशय स्वयं प्रार्थी से है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत वाचा-नाम है। हिन्दी पाठकों में सुस्थापित रूप ‘यहोवा’ नाम को उपाधि में बदले बिना सुरक्षित रखता है; ‘याहवे’ अधिक प्रत्यक्ष विद्वत्तापूर्ण लिप्यंतरण है।
- issue: צְדָקָה की अर्थ-छाया
  choice: धार्मिकता
  alternative: न्याय
  rationale: शब्द में धार्मिकता और न्याय दोनों की अर्थ-छायाएँ हैं। यहाँ प्रार्थी परमेश्वर के सत्यनिष्ठ, उचित और विश्वासयोग्य चरित्र के अनुसार छुटकारे की विनती करता है; इसलिए मुख्य पाठ में ‘धार्मिकता’ रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में प्रार्थनात्मक, काव्यात्मक और गरिमापूर्ण शैली रखी गई है। परमेश्वर के लिए निकट संबोधन के अनुरूप एकवचन ‘तू’ के क्रियारूप निहित हैं। ‘प्राण’ मूल की काव्यात्मक मानवशास्त्रीय अभिव्यक्ति को सुरक्षित रखता है; संभावित मुहावरेदार अर्थ पादटिप्पणी में दिए गए हैं।
