  text: מִזְמ֗וֹר לְ/דָ֫וִ֥ד יְהוָ֤ה שְׁמַ֬ע תְּפִלָּתִ֗/י הַאֲזִ֥ינָ/ה אֶל תַּחֲנוּנַ֑/י בֶּ/אֱמֻנָתְ/ךָ֥ עֲ֝נֵ֗/נִי בְּ/צִדְקָתֶֽ/ךָ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/143/001.yaml
  text: A psalm of David[a]. O Yahweh, hear my prayer; give ear to my pleas for mercy. In your faithfulness answer me[c][b], in your righteousness.
translation:
  language: hi
  text: 'दाऊद का भजन।


    हे याहवे, मेरी प्रार्थना सुन;


    मेरी दया की गुहारों पर कान दे।


    अपनी विश्वासयोग्यता में मुझे उत्तर दे,[a]


    अपनी धार्मिकता में।[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपनी विश्वासयोग्यता के कारण मुझे उत्तर दे” अथवा “अपनी विश्वासयोग्यता के द्वारा मुझे उत्तर दे।”
    reason: इब्रानी בְּ आधार, कारण या साधन का भाव दे सकता है।
  - marker: b
    text: या, “अपने न्याय में”; अथवा “अपनी धार्मिकता के द्वारा।”
    reason: צְדָקָה का अर्थ धार्मिकता या न्याय हो सकता है, और בְּ को साधनवाचक भी समझा जा सकता है।
lexical_decisions:
- source_word: מִזְמוֹר לְדָוִד
  choice: दाऊद का भजन
  rationale: ‘भजन’ मानक विधागत पद है। संबंधसूचक ‘का’ इब्रानी לְ की रचनाकारिता, संबद्धता या समर्पण की संभावित व्यापकता को अनावश्यक रूप से सीमित नहीं करता।
- source_word: יְהוָה
  choice: यहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम का हिंदी लिप्यंतरण, किसी उपाधि से प्रतिस्थापन नहीं।
- source_word: שְׁמַע תְּפִלָּתִי
  choice: मेरी प्रार्थना सुन
  rationale: प्रत्यक्ष आज्ञार्थक निवेदन और एकवचन संज्ञा का स्वाभाविक, संक्षिप्त हिंदी रूप।
- source_word: הַאֲזִינָה אֶל־תַּחֲנוּנַי
  choice: मेरी दया की पुकारों पर कान लगा
  rationale: ‘कान लगा’ काव्यात्मक समानांतरता और ध्यानपूर्वक सुनने का बल बनाए रखता है; תַּחֲנוּנִים कृपा या दया माँगने वाली विनतियों को दर्शाता है।
- source_word: בֶּאֱמֻנָתְךָ
  choice: अपनी विश्वासयोग्यता में
  rationale: אֱמוּנָה यहाँ परमेश्वर की स्थिर विश्वसनीयता और निष्ठा को व्यक्त करता है; ‘में’ इब्रानी בְּ की अस्पष्टता को यथासंभव बनाए रखता है।
- source_word: עֲנֵנִי
  choice: मुझे उत्तर दे
  rationale: प्रार्थना के संदर्भ में सामान्य और सीधा अर्थ; अनुकूल उत्तर का भाव स्पष्ट रूप से जोड़ना आवश्यक नहीं।
- source_word: בְּצִדְקָתֶךָ
  choice: अपनी धार्मिकता में
  rationale: צְדָקָה के नैतिक खरापन/न्याय के अर्थ को ‘धार्मिकता’ समेटता है; वैकल्पिक साधनवाचक और न्याय-संबंधी अर्थ पादटिप्पणी में सुरक्षित हैं।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहवे
  alternative: यहोवा
  rationale: मूल पाठ व्यक्तिगत ईश्वरीय नाम का प्रयोग करता है; ‘यहवे’ संभावित प्राचीन उच्चारण का प्रचलित विद्वत्तापूर्ण हिंदी लिप्यंतरण है और इसे ‘प्रभु’ जैसी उपाधि से नहीं बदलता।
- issue: בְּ पदबंधों का संबंध
  choice: ‘में’ द्वारा परमेश्वर के चरित्र के क्षेत्र/आधार की अपूर्णतः निश्चित अभिव्यक्ति
  alternative: ‘अपनी विश्वासयोग्यता/धार्मिकता के कारण’ या ‘के द्वारा’
  rationale: इब्रानी בְּ को अवस्था, आधार या साधन के रूप में समझा जा सकता है। मुख्य पाठ में ‘में’ इस काव्यात्मक और धर्मवैचारिक तनाव को खुला रखता है।
- issue: צְדָקָה का अर्थक्षेत्र
  choice: धार्मिकता
  alternative: न्याय
  rationale: शब्द परमेश्वर के खरे और न्यायपूर्ण चरित्र दोनों को संकेत कर सकता है; मुख्य पाठ व्यापक पारंपरिक अर्थ रखता है और ‘न्याय’ को पादटिप्पणी में देता है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण काव्यात्मक शैली रखी गई है। छोटे आज्ञार्थक वाक्य और समानांतर पंक्तियाँ इब्रानी प्रार्थना की लय बनाए रखते हैं। ‘दया की पुकारें’ सामान्य पाठक के लिए ‘विनतियाँ’ से अधिक अर्थ-स्पष्ट है।
