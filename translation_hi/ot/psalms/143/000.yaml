  text: A psalm of David. O LORD, hear my prayer; give ear to my pleas for mercy! In your faithfulness answer me, in your righteousness!
translation:
  language: hi
  text: 'दाऊद का भजन।


    हे यहोवा, मेरी प्रार्थना सुन; मेरी दया-याचनाओं[a] पर कान लगा। अपनी विश्वासयोग्यता के अनुसार[b] मुझे उत्तर दे, अपनी धार्मिकता के अनुसार[c]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरी विनतियों।”
    reason: lexical_alternative
  - marker: b
    text: या, “अपनी विश्वासयोग्यता के कारण”; हिब्रू को परमेश्वर की विश्वासयोग्यता पर आधारित अपील के रूप में भी समझा जा सकता है।
    reason: lexical_alternative
  - marker: c
    text: या, “अपने न्याय के अनुसार” अथवा “अपनी धार्मिकता के कारण।”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְמוֹר לְדָוִד
  choice: दाऊद का भजन
  rationale: शीर्षक का स्वाभाविक और परंपरागत हिन्दी रूप; לְ यहाँ रचना, संबंध या समर्पण का संकेत दे सकता है, जिसे संक्षिप्त शीर्षक में ‘का’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम को सामान्य उपाधि में बदलने के बजाय नाम के रूप में रखा गया है।
- source_word: תַחֲנוּנַי
  choice: मेरी दया की पुकारों
  rationale: यह बहुवचन संज्ञा कृपा या दया की विनती को व्यक्त करती है; यह रूप सामान्य पाठक के लिए ‘अनुनयों’ की अपेक्षा अधिक सहज है।
- source_word: אֱמוּנָתְךָ
  choice: अपनी विश्वासयोग्यता
  rationale: संदर्भ में परमेश्वर की स्थिर निष्ठा और भरोसेमंदी अभिप्रेत है; ‘विश्वासयोग्यता’ उस गुण को स्पष्ट रूप से व्यक्त करती है।
- source_word: צִדְקָתֶךָ
  choice: अपनी धार्मिकता
  rationale: צדקה के धार्मिकता, न्यायपूर्णता और सही आचरण से जुड़े अर्थ-क्षेत्र को ‘धार्मिकता’ व्यापक रूप से बनाए रखता है।
theological_decisions:
- issue: परमेश्वर की विश्वासयोग्यता और धार्मिकता के साथ בְ उपसर्ग का संबंध
  choice: ‘अपनी विश्वासयोग्यता में, अपनी धार्मिकता में’
  alternative: ‘अपनी विश्वासयोग्यता के कारण, अपने न्याय के अनुसार’
  rationale: हिब्रू בְ साधन, आधार, क्षेत्र या अनुरूपता सूचित कर सकता है। मुख्य पाठ में संरचनात्मक समानता और मूल की अस्पष्टता बनाए रखी गई है; संभावित आधार/साधन का अर्थ पादटिप्पणियों में दिया गया है।
- issue: צדקה का न्यायिक या नैतिक बल
  choice: ‘धार्मिकता’
  alternative: ‘न्याय’ या ‘न्यायपूर्णता’
  rationale: यहाँ भजनकार परमेश्वर के चरित्र के आधार पर उत्तर माँगता है। केवल ‘न्याय’ कहने से अर्थ अनावश्यक रूप से न्यायिक हो सकता है, जबकि ‘धार्मिकता’ व्यापक तनाव को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, प्रार्थनात्मक शैली रखी गई है। ‘हे यहोवा’, ‘कान लगा’ और ‘उत्तर दे’ काव्यात्मक किन्तु सामान्य पाठकों के लिए बोधगम्य हैं। पद-शीर्षक को अलग पंक्ति में रखा गया है और मूल पाठ में उपस्थित सभी प्रार्थना-वाक्य सम्मिलित हैं।
