  text: הַצִּילֵ֖/נִי מֵ/אֹיְבַ֥/י יְהוָ֗ה אֵלֶ֥י/ךָ כִסִּֽתִי׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/143/009.yaml
  text: Deliver me from my enemies[a], O Yahweh; in you I have taken refuge.
translation:
  language: hi
  text: 'हे याहवे, मेरे शत्रुओं से मुझे छुड़ा;

    तेरे पास मैंने शरण ली है।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: और अधिक शाब्दिक रूप से, “तेरे पास मैंने अपने को छिपाया है” या “तेरे पास मैंने ओट खोजी है।” इब्रानी मुहावरा परमेश्वर की शरण लेने का भाव व्यक्त करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצִּילֵנִי
  choice: मुझे छुड़ा
  rationale: नצל के हिफ़ील आज्ञार्थक रूप और प्रथम पुरुष एकवचन प्रत्यय को सीधी उद्धार-विनती के रूप में प्रस्तुत करता है। ‘छुड़ा’ यहाँ स्वाभाविक, गंभीर और प्रसंगानुकूल है।
- source_word: מֵאֹיְבַי
  choice: मेरे शत्रुओं से
  rationale: מִן अलग किए जाने या बचाए जाने के स्रोत को और אֹיְבַי बहुवचन में ‘मेरे शत्रुओं’ को स्पष्ट रूप से व्यक्त करता है।
- source_word: יְהוָה
  choice: हे याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय ‘याहवे’ के रूप में लिप्यंतरित किया गया है; ‘हे’ संबोधन को स्वाभाविक हिंदी में स्पष्ट करता है।
- source_word: אֵלֶיךָ
  choice: तेरे ही पास
  rationale: אֶל का मूल दिशात्मक भाव ‘तेरी ओर/तेरे पास’ है। ‘ही’ आरंभिक पद के बलाघात को व्यक्त करता है, जबकि ‘पास’ अगले क्रियापद के साथ आश्रय पाने का स्वाभाविक हिंदी मुहावरा बनाता है।
- source_word: כִסִּתִי
  choice: मैंने शरण ली है
  rationale: כסה का मूल बिंब ढकने या छिपने से जुड़ा है, पर इस अपूर्ण मुहावरे में परमेश्वर के संरक्षण में आश्रय लेने का भाव है। यह अनुवाद अर्थ को सहज हिंदी में देता है और शाब्दिक बिंब को पादटिप्पणी में सुरक्षित रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा अथवा प्रभु
  rationale: मूल पाठ व्यक्तिगत ईश्वरीय नाम का प्रयोग करता है। ‘याहवे’ उसे उपाधि से प्रतिस्थापित किए बिना आधुनिक हिंदी लिप्यंतरण में सुरक्षित रखता है।
- issue: אֵלֶיךָ כִסִּתִי में आश्रय का भाव
  choice: तेरे ही पास मैंने शरण ली है
  alternative: तेरे पास मैंने अपने को छिपाया है
  rationale: वाक्यांश का व्याकरण शाब्दिक रूप से ‘तेरी ओर/तेरे पास मैंने छिपाया’ जैसा संक्षिप्त है और कर्म निहित है। प्रसंग में आश्रय का भाव सबसे स्वाभाविक है, पर शाब्दिक रूप की अस्पष्टता पादटिप्पणी में दी गई है ताकि मूल बिंब और तनाव न मिटें।
translation_notes:
  register: भाषा आधुनिक, प्रार्थनापूर्ण और गरिमापूर्ण रखी गई है। ‘मुझे छुड़ा’ सामान्य पाठक के लिए सहज है; ‘तेरे ही पास’ मूल पदक्रम और बलाघात को बनाए रखता है। काव्यात्मक अर्धविराम दोनों विनतिपरक पंक्तियों को जोड़ता है।
