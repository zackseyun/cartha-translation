lexical_decisions:
- source_word: לַמְּדֵנִי
  choice: मुझे…सिखा
  rationale: पिएल आज्ञार्थक और प्रथम पुरुष एकवचन प्रत्यय का सीधा, स्वाभाविक प्रार्थनात्मक रूप।
