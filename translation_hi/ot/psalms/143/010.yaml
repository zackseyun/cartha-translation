  choice: अपनी इच्छा पूरी करना
  rationale: शाब्दिक अर्थ ‘तेरी इच्छा करना’ है; हिन्दी में ‘इच्छा पूरी करना’ आज्ञापालन का आशय स्वाभाविक ढंग से व्यक्त करता है।
- source_word: כִּי אַתָּה אֱלֹהָי
  choice: क्योंकि तू मेरा परमेश्वर है
  rationale: כִּי अनुरोध का कारण देता है; ‘क्योंकि’ इस संबंध को स्पष्ट रखता है। एकवचन ‘तू’ निकट और पारंपरिक प्रार्थना-संबोधन है।
- source_word: רוּחֲךָ טוֹבָה
  choice: तेरा भला आत्मा
  rationale: רוּחַ व्याकरणतः स्त्रीलिंग है, पर आधुनिक हिन्दी में परमेश्वर से संबद्ध ‘आत्मा’ के लिए ‘भला’ स्वाभाविक धार्मिक प्रयोग है। देवनागरी में बड़े अक्षर न होने से संभावित अर्थभेद टिप्पणी में रखा गया है।
- source_word: תַּנְחֵנִי
  choice: मुझे…ले चले
  rationale: हिफ़ील रूप मार्ग दिखाते हुए नेतृत्व करने और प्रार्थनात्मक कामना—दोनों को व्यक्त करता है।
- source_word: בְּאֶרֶץ מִישׁוֹר
  choice: समतल भूमि पर
  rationale: स्थानगत बिंब को प्राथमिक रखते हुए सुरक्षित और बाधारहित मार्गदर्शन का रूपक बचाया गया है; हिन्दी में भूमि के साथ ‘पर’ स्वाभाविक है।
theological_decisions:
- issue: רוּחֲךָ का आशय परमेश्वर का आत्मा है या उसका अच्छा स्वभाव/अभिप्राय
  choice: तेरा भला आत्मा
  alternative: तेरी भली आत्मा/तेरा अच्छा स्वभाव
  rationale: प्रत्यक्ष संबोधन और ‘तेरा आत्मा’ परमेश्वर के अपने आत्मा की ओर स्वाभाविक संकेत करते हैं। फिर भी इब्रानी लिपि बड़े-छोटे अक्षरों से इस अर्थ को निश्चित नहीं करती, और हिन्दी में भी ऐसा अक्षर-भेद नहीं है; इसलिए अस्पष्टता फुटनोट में स्पष्ट की गई है।
- issue: בְּאֶרֶץ מִישׁוֹר स्थानगत है या नैतिक
  choice: समतल भूमि पर
  alternative: सीधाई की भूमि में
  rationale: मूल शब्द समतलता और रूपकतः सीधाई दोनों व्यक्त कर सकता है। यहाँ मार्गदर्शन के साथ स्थानगत चित्र अधिक सहज है, पर नैतिक अनुगूंज को नकारा नहीं गया।
