  source_fidelity: The verse’s structure and prayerful force are preserved, but “अपनी इच्छा पूरी करना” can suggest fulfilling a desire rather than doing/obeying God’s will. “तेरी इच्छा मानना” gives the intended sense more directly. The guidance and level-ground image are otherwise retained.
  naturalness: “तेरी भली आत्मा” is more idiomatic and established in dignified modern Hindi biblical register than “तेरा भला आत्मा.” “समतल भूमि पर” is natural for the spatial image.
  terminology: “परमेश्वर,” “आत्मा,” and the intimate singular address are suitable. The footnote should not characterize the alternative as “अभिप्राय,” which is not the direct sense of רוח here; “स्वभाव” or “मनःस्थिति” better represents the broader ‘spirit/disposition’ possibility.
  issues:
