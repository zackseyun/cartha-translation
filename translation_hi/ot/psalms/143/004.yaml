    reason: עטף के ‘अभिभूत होने’ और שמם के ‘उजड़ने/उजाड़ होने’ वाले वैकल्पिक अर्थ-भावों को सुरक्षित रखता है।
lexical_decisions:
- source_word: וַתִּתְעַטֵּף
  choice: मूर्छित हो रही है
  rationale: हित्पएल रूप विलाप के संदर्भ में निर्बल पड़ने, मूर्छित होने या अभिभूत होने का भाव देता है। यह चयन आंतरिक शक्ति चुकने का काव्यात्मक भाव बनाए रखता है।
- source_word: עָלַי
  choice: मेरे भीतर
  rationale: शाब्दिक अर्थ ‘मुझ पर’ है, पर आत्मा की आंतरिक दशा और अगली पंक्ति के בְּתוֹכִי के समानांतर भाव को स्वाभाविक हिन्दी में ‘मेरे भीतर’ व्यक्त करता है।
- source_word: רוּחִי
  choice: मेरी आत्मा
  rationale: यहाँ רוּחַ भजनकार के आंतरिक प्राण या चेतना को दर्शाता है, केवल श्वास या पवित्र आत्मा को नहीं। ‘मेरी आत्मा’ काव्यात्मक समानांतरता को सुरक्षित रखता है।
- source_word: בְּתוֹכִי
  choice: मेरे अंदर
  rationale: यह पद व्यक्ति की आंतरिक अवस्था बताता है। ‘मेरे अंदर’ सरल, स्वाभाविक हिन्दी है और पहली पंक्ति की पुनरुक्ति को हल्का-सा विविध बनाता है।
- source_word: יִשְׁתּוֹמֵם
  choice: स्तब्ध है
  rationale: שמם का यह रूप उजड़ जाने, भयावह आघात से स्तब्ध होने या व्याकुल होने का भाव दे सकता है। ‘स्तब्ध है’ अनुभवजन्य आघात को व्यक्त करता है और हिन्दी में हृदय के साथ स्वाभाविक है।
- source_word: לִבִּי
  choice: मेरा हृदय
  rationale: לֵב आंतरिक व्यक्ति—विचार और भाव—को दर्शाता है। ‘मेरा हृदय’ मानक, गरिमापूर्ण और काव्यात्मक समतुल्य है।
