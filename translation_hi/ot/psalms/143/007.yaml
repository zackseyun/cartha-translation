id: PSA.143.7
reference: Psalms 143:7
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: מַ֘הֵ֤ר עֲנֵ֨/נִי יְהוָה֮ כָּלְתָ֪ה ר֫וּחִ֥/י אַל תַּסְתֵּ֣ר פָּנֶ֣י/ךָ מִמֶּ֑/נִּי וְ֝/נִמְשַׁ֗לְתִּי עִם יֹ֥רְדֵי בֽוֹר׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/143/007.yaml
  text: Answer me quickly[a], O Yahweh; my spirit fails. Do not hide your face from me, or I will become like those who go down to the pit.
translation:
  language: hi
  text: हे याहवे, मुझे शीघ्र उत्तर दे; मेरी आत्मा चुक रही है। अपना मुख मुझसे न छिपा, नहीं तो मैं गड्ढे में उतरनेवालों[a] के समान हो जाऊँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “कब्र में उतरनेवालों।” इब्रानी में “गड्ढा” मृत्यु का एक काव्यात्मक चित्र है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מַהֵר
  choice: शीघ्र
  rationale: यह आग्रह की तात्कालिकता व्यक्त करता है और עֲנֵנִי से जुड़कर स्वाभाविक रूप से ‘मुझे शीघ्र उत्तर दे’ बनता है।
- source_word: עֲנֵנִי
  choice: मुझे उत्तर दे
  rationale: प्रार्थना के संदर्भ में ענה का अर्थ विनती का उत्तर देना है; यह सीधा और स्वाभाविक हिन्दी प्रयोग है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय लिप्यंतरित किया गया है।
- source_word: כָּלְתָה רוּחִי
  choice: मेरी आत्मा चुक रही है
  rationale: כלה समाप्त या निःशेष होने की अवस्था बताता है और רוּחִי यहाँ भीतर की जीवन-शक्ति अथवा आत्मा को सूचित करता है। ‘चुक रही है’ निराशा और क्षीणता दोनों को संक्षेप में रखता है।
- source_word: אַל תַּסְתֵּר פָּנֶיךָ מִמֶּנִּי
  choice: अपना मुख मुझसे न छिपा
  rationale: मूल रूपक को बनाए रखा गया है; यह परमेश्वर की उपस्थिति या कृपा के हट जाने का बोध कराता है, पर उसका अर्थ व्याख्या द्वारा सीमित नहीं करता।
- source_word: וְנִמְשַׁלְתִּי
  choice: नहीं तो मैं ... के समान हो जाऊँगा
  rationale: निफ़अल रूप यहाँ समान हो जाने या गिने जाने का परिणाम बताता है। नकारात्मक विनती के बाद ‘नहीं तो’ हिन्दी में उस परिणाम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: יֹרְדֵי בוֹר
  choice: गड्ढे में उतरनेवाले
  rationale: शाब्दिक मृत्यु-चित्र को बनाए रखा गया है। ‘कब्र’ अर्थ की उचित व्याख्या है, पर मूल के काव्यात्मक रूपक से अधिक स्पष्ट है, इसलिए उसे पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम है; उसे ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित न करके हिन्दी में प्रचलित निकट लिप्यंतरण दिया गया है।
- issue: ‘गड्ढे’ का अभिप्राय
  choice: मुख्य पाठ में मृत्यु का काव्यात्मक चित्र ‘गड्ढा’ बनाए रखना
  alternative: कब्र; अधोलोक
  rationale: इब्रानी בור मृत्यु के क्षेत्र का चित्र उपस्थित करता है, लेकिन इस पद में परलोक की दशा को सिद्धांततः परिभाषित नहीं करता। इसलिए मूल तनाव और अस्पष्टता सुरक्षित रखी गई है।
- issue: רוּחִי का अर्थ
  choice: मेरी आत्मा
  alternative: मेरी जीवन-शक्ति; मेरा प्राण
  rationale: רוּח व्यक्ति की भीतरी शक्ति, प्राण या आत्मा को सूचित कर सकता है। ‘आत्मा’ मूल की व्यापकता को पर्याप्त रूप से बनाए रखता है और कथन को केवल शारीरिक साँस तक सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, प्रार्थनापरक और गरिमापूर्ण रखी गई है। ‘मुख छिपाना’ और ‘गड्ढे में उतरना’ जैसे मूल इब्रानी काव्य-चित्र सुरक्षित हैं; अत्यधिक संस्कृतनिष्ठ शब्दावली से बचा गया है।
