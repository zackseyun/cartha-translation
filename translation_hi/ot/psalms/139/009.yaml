lexical_decisions:
- source_word: אֶשָּׂא
  choice: उड़ जाऊँ
  rationale: मूल अर्थ ‘उठाना/लेना’ है, पर ‘भोर के पंख’ के साथ यह काव्यात्मक रूप से पंख लेकर तीव्र गति से दूर जाने का भाव देता है; सहज हिन्दी में ‘पंखों पर उड़ जाऊँ’ रूपक को बनाए रखता है।
- source_word: כַנְפֵי
  choice: पंखों पर
  rationale: כנף का सामान्य अर्थ ‘पंख’ है। स्थानगत हिन्दी प्रयोग के लिए ‘पर’ जोड़कर भोर के पंखों पर यात्रा करने का काव्य-बिंब स्वाभाविक बनाया गया है।
- source_word: שָׁחַר
  choice: भोर
  rationale: שׁחר भोर या पौ फटने के समय को दर्शाता है; ‘भोर’ संक्षिप्त, वर्तमान और काव्यात्मक हिन्दी है।
- source_word: אֶשְׁכְּנָה
  choice: जा बसूँ
  rationale: שכן का अर्थ बसना या निवास करना है। ‘जा बसूँ’ दूरस्थ स्थान तक पहुँचकर वहाँ रहने का स्थानगत भाव स्पष्ट करता है।
- source_word: בְּאַחֲרִית
  choice: सबसे दूर छोर पर
  rationale: אַחֲרִית यहाँ समय का अंत नहीं, बल्कि स्थान की अंतिम या सुदूर सीमा बताता है; ‘सबसे दूर छोर’ इस अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יָם
  choice: समुद्र
  rationale: ים का सीधा अर्थ ‘समुद्र’ है। पश्चिम दिशा का सम्भावित काव्यात्मक संकेत पाद-टिप्पणी में सुरक्षित रखा गया है।
