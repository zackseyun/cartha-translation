  yaml_path: translation/ot/psalms/139/013.yaml
  text: For you formed my inward parts[b][a]; you wove me together in my mother’s womb.
translation:
  language: hi
  text: 'क्योंकि मेरे भीतरी अंगों[b] को तूने रचा;

    मेरी माँ के गर्भ में तूने मुझे बुना[a]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मुझे गूँथा”; अधिक शाब्दिक रूप में, “मुझे ढका।”
    reason: lexical_alternative
  - marker: b
    text: “भीतरी अंगों” के लिए इब्रानी में शाब्दिक शब्द “मेरे गुर्दे” है; यह मनुष्य के गहरे भीतरी अस्तित्व के लिए एक चित्रात्मक अभिव्यक्ति है।
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पद पिछले कथन का आधार बताता है; ‘क्योंकि’ कारणसूचक संबंध को स्वाभाविक हिन्दी में स्पष्ट रखता है।
- source_word: קָנִיתָ
  choice: रचा
  rationale: क्रिया का मूल अर्थ ‘प्राप्त करना/अधिकार में रखना’ भी हो सकता है, पर गर्भ में निर्माण के काव्यात्मक संदर्भ में ‘रचा’ परमेश्वर की सृजनात्मक क्रिया को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: כִלְיֹתַי
  choice: मेरे अंतरतम अंगों को
  rationale: शाब्दिक अर्थ ‘मेरे गुर्दे’ है, जो इब्रानी में मनुष्य के गहरे आंतरिक अस्तित्व का चित्रात्मक संकेत है। यह चयन शारीरिक बिंब और मुहावरे का भाव दोनों बनाए रखता है।
- source_word: תְּסֻכֵּנִי
  choice: तूने मुझे बुना
  rationale: סכך का मूल भाव ढकना या आड़ देना है; गर्भ के संदर्भ में ‘बुना’ सूक्ष्म गठन का स्वाभाविक काव्यात्मक बिंब देता है, जबकि अधिक शाब्दिक विकल्प पादटिप्पणी में सुरक्षित है।
- source_word: בְּבֶטֶן אִמִּי
  choice: मेरी माँ के गर्भ में
  rationale: यह स्थान और मातृ-संबंध दोनों को स्पष्ट, सहज आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: गर्भपूर्व गठन की भाषा को बाद की सैद्धान्तिक व्याख्याओं से बढ़ाए बिना प्रस्तुत करना
  choice: पद को गर्भ में भजनकार के गठन में परमेश्वर की सीधी क्रिया की काव्यात्मक पुष्टि के रूप में रखा गया है।
  alternative: 'अधिक शाब्दिक पाठ: ‘तूने मेरे गुर्दों को अपना किया; मेरी माँ के गर्भ में तूने मुझे ढका।’'
  rationale: अनुवाद गर्भ में परमेश्वर की सक्रिय भूमिका को स्पष्ट रखता है, पर पद में न कही गई किसी विस्तृत मत-संबंधी धारणा को नहीं जोड़ता।
- issue: קנה के ‘अधिकार में लेना’ और ‘रचना’ अर्थों के बीच तनाव
  choice: मुख्य पाठ में ‘रचा’
  alternative: ‘अपना किया’ या ‘अधिकार में लिया’
  rationale: तात्कालिक गर्भ-गठन संदर्भ ‘रचा’ का समर्थन करता है, यद्यपि क्रिया की स्वामित्व-संबंधी अर्थछाया को पूरी तरह नकारा नहीं जाता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमामय काव्यात्मक रूप अपनाया गया है। परमेश्वर को संबोधित करने में ‘तू’ भजन की निकटता और हिन्दी बाइबिलीय काव्य-परंपरा के अनुरूप है। पंक्ति-विभाजन इब्रानी समानांतरता को उभारता है। दोनों पादटिप्पणी-चिह्न मुख्य पाठ में दिए गए हैं।
