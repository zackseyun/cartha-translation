  text: הֲ/לֽוֹא מְשַׂנְאֶ֖י/ךָ יְהוָ֥ה אֶשְׂנָ֑א וּ֝/בִ/תְקוֹמְמֶ֗י/ךָ אֶתְקוֹטָֽט־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/139/021.yaml
  text: Do I not hate those who hate you, O LORD, and loathe those who rise up against you?
translation:
  language: hi
  text: हे यहोवा, क्या मैं उन लोगों से घृणा नहीं करता जो तुझसे घृणा करते हैं? जो तेरे विरुद्ध उठ खड़े होते हैं, क्या मैं उनसे घोर घृणा नहीं करता?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מְשַנְאֶיךָ / אֶשְׂנָא
  choice: जो तुझसे घृणा करते हैं / मैं ... घृणा नहीं करता
  rationale: एक ही इब्रानी धातु שׂנא की पुनरावृत्ति को हिंदी में भी ‘घृणा’ द्वारा बनाए रखा गया है।
- source_word: וּבִתְקוֹמְמֶיךָ
  choice: जो तेरे विरुद्ध उठ खड़े होते हैं
  rationale: קום की हित्पोलेल कृदंत-रचना यहाँ विरोध में खड़े होने या विद्रोह करने का भाव देती है; यह वाक्यांश उस सक्रिय विरोध को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: אֶתְקוֹטָט
  choice: मैं घिन नहीं करता
  rationale: קוט का यह रूप तीव्र वितृष्णा या घोर विरक्ति व्यक्त करता है। ‘घिन करना’ इसे ‘घृणा’ की पहली पंक्ति से अलग रखते हुए तीव्र भाव को दर्शाता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: व्यक्तिगत ईश्वरीय नाम को हिंदी में प्रचलित लिप्यंतरण द्वारा व्यक्त किया गया है, सामान्य उपाधि से प्रतिस्थापित नहीं किया गया।
theological_decisions:
- issue: भजनकार की घृणा और वितृष्णा की तीव्र भाषा
  choice: तीव्र शब्दावली को यथावत रखा गया
  alternative: इसे केवल असहमति, विरोध या दूरी के रूप में नरम करना
  rationale: मूल पाठ स्पष्ट रूप से שׂנא और קוט जैसे प्रबल भावात्मक शब्दों का प्रयोग करता है; अनुवाद उनका नैतिक या धर्मवैज्ञानिक पुनर्व्याख्यान नहीं करता।
- issue: प्रश्नों का आलंकारिक स्वर
  choice: दोनों खंड प्रश्नवाचक रखे गए
  alternative: निश्चयात्मक कथनों के रूप में अनुवाद
  rationale: प्रारंभिक הֲלוֹא पूरे कथन को अपेक्षित सकारात्मक उत्तर वाले आलंकारिक प्रश्न के रूप में प्रस्तुत करता है; हिंदी में प्रश्न-रचना इसे स्वाभाविक रूप से बनाए रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सीधे संबोधन वाली है। परमेश्वर के लिए निकट एकवचन ‘तू/तेरे/तुझसे’ का प्रयोग काव्यात्मक प्रार्थना के अनुरूप है। पद की समानांतरता को दो प्रश्नों में स्पष्ट किया गया है।
