  text: כִּ֤י אֵ֣ין מִ֭לָּה בִּ/לְשׁוֹנִ֑/י הֵ֥ן יְ֝הוָ֗ה יָדַ֥עְתָּ כֻלָּֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/139/004.yaml
  text: For there is not a word on my tongue—behold[a], O Yahweh, you know it altogether.
translation:
  language: hi
  text: क्योंकि मेरी जीभ पर कोई शब्द आने से पहले ही, निश्चय ही, हे याहवे, तू उसे पूरी तरह जानता है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या: “क्योंकि मेरी जीभ पर कोई शब्द नहीं है—देख, हे याहवे, तू उसे पूरी तरह जानता है।” इब्रानी वाक्य की संक्षिप्त संरचना को “शब्द आने से पहले ही” के रूप में भी समझा जाता है।'
    reason: इब्रानी वाक्य-विन्यास की संक्षिप्तता और הֵן के बलसूचक प्रयोग का वैकल्पिक, अधिक निकट रूप दर्शाने के लिए।
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह अव्यय पिछले विचार का कारण या आधार प्रस्तुत करता है; ‘क्योंकि’ हिंदी में इस संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֵין מִלָּה בִּלְשׁוֹנִי
  choice: मेरी जीभ पर कोई शब्द आने से पहले ही
  rationale: शाब्दिक संरचना ‘मेरी जीभ पर कोई शब्द नहीं’ है, पर संदर्भ में आशय उस शब्द से है जो अभी बोला भी नहीं गया। यह रूप देहगत बिंब ‘जीभ’ को बचाते हुए सामान्य हिंदी में आशय स्पष्ट करता है।
- source_word: הֵן
  choice: ही
  rationale: הֵן बलसूचक अव्यय है। हिंदी वाक्य में ‘पहले ही’ उसकी जोरदार निश्चितता को स्वाभाविक ढंग से वहन करता है; अलग से ‘देख’ कहना इस संबोधन में असहज होता।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिंदी में प्रचलित लिप्यंतरण ‘यहोवा’ दिया गया है।
- source_word: יָדַעְתָּ
  choice: तू ... जानता है
  rationale: पूर्ण क्रिया यहाँ स्थायी और सुनिश्चित ज्ञान का भाव देती है; वर्तमानकालीन हिंदी इसे स्वाभाविक रूप से व्यक्त करती है।
- source_word: כֻלָּהּ
  choice: उसे पूरी तरह
  rationale: स्त्रीलिंग एकवचन प्रत्यय ‘शब्द’ की ओर लौटता है और परमेश्वर के संपूर्ण ज्ञान को व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल में व्यक्तिगत ईश्वरीय नाम है। हिंदी पाठकों में पहचाने जाने योग्य ‘यहोवा’ उसका लिप्यंतरण करता है और उसे ‘प्रभु’ जैसी उपाधि से नहीं बदलता।
- issue: परमेश्वर द्वारा शब्द को जानने का समय
  choice: शब्द के जीभ पर आने से पहले ही उसे पूरी तरह जानना
  alternative: मेरी जीभ पर कोई शब्द नहीं—निश्चय ही, हे यहोवा, तू उसे पूरा जानता है
  rationale: संदर्भ पूर्वज्ञान का संकेत देता है, किंतु इब्रानी की सतही संरचना कुछ संक्षिप्त और द्व्यर्थी है। मुख्य पाठ स्वाभाविक हिंदी में प्रासंगिक आशय देता है, जबकि वैकल्पिक संरचना को निर्णायक धर्मवैज्ञानिक दावे के रूप में नहीं थोपा गया।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिंदी। परमेश्वर के लिए एकवचन आत्मीय ‘तू’ रखा गया है, जो भजन की सीधी प्रार्थनात्मक वाणी के अनुरूप है। काव्यात्मक विराम के लिए दीर्घ डैश प्रयुक्त है।
