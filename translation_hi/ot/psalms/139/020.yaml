  text: who speak of you with evil intent[a]; your enemies take your name in vain.
translation:
  language: hi
  text: 'जो तेरे विषय में बुरी मंशा से बोलते हैं;

    तेरे शत्रु तेरा नाम व्यर्थ लेते हैं।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अंतिम पंक्ति का इब्रानी पाठ कठिन है। वैकल्पिक रूप से इसका अर्थ हो सकता है: “वे झूठ के लिए ऊँचा उठाते हैं—तेरे विरोधी,” या “तेरे विरोधी तुझे झूठे ढंग से उठाते हैं।” मूल इब्रानी में “नाम” शब्द स्पष्ट रूप से नहीं है।'
    reason: alternative_reading
lexical_decisions:
- source_word: אֲשֶׁר
  choice: जो
  rationale: यह संबंधवाचक अव्यय पिछले पद के दुष्ट लोगों का वर्णन आगे बढ़ाता है; हिंदी में ‘जो’ स्वाभाविक है।
- source_word: יֹאמְרֻךָ
  choice: तेरे विषय में ... बोलते हैं
  rationale: אמר के साथ द्वितीय पुरुष एकवचन प्रत्यय यहाँ परमेश्वर के विषय में शत्रुतापूर्ण बोलने का भाव देता है; इसे प्रत्यक्ष संबोधन बनाना संदर्भ में कम उपयुक्त है।
- source_word: לִמְזִמָּה
  choice: बुरी मंशा से
  rationale: מְזִמָּה योजना, युक्ति या दुष्ट षड्यंत्र का बोध करा सकता है। यहाँ यह उनके बोलने के दुर्भावनापूर्ण उद्देश्य को व्यक्त करता है।
- source_word: נָשֻׂא
  choice: लेते हैं
  rationale: נשׂא का मूल अर्थ ‘उठाना/वहन करना’ है, पर שָׁוְא के साथ इसे ‘व्यर्थ लेना’ के परिचित मुहावरे के रूप में समझा गया है।
- source_word: לַשָּׁוְא
  choice: व्यर्थ
  rationale: שָׁוְא में व्यर्थता, मिथ्यापन और खोखलेपन के अर्थ हैं; ‘व्यर्थ’ इस मुहावरे में संक्षिप्त और स्वाभाविक हिंदी है।
- source_word: עָרֶיךָ
  choice: तेरे शत्रु
  rationale: काव्य-संदर्भ में यह परमेश्वर के विरोधियों को सूचित करता है और आसपास के पदों में दुष्टों तथा बैर रखने वालों के उल्लेख के अनुरूप है।
theological_decisions:
- issue: अंतिम उपवाक्य का कर्म और मुहावरा
  choice: तेरे शत्रु तेरा नाम व्यर्थ लेते हैं
  alternative: ‘तेरे विरोधी झूठ के लिए उठाते हैं’ अथवा ‘तेरे विरोधी तुझे झूठ में उठाते हैं’
  rationale: इब्रानी वाक्य-विन्यास कठिन है। נשׂא + שׁוא को प्रचलित मुहावरे की तरह समझने पर परमेश्वर के नाम के दुरुपयोग का अर्थ निकलता है, यद्यपि मूल पाठ में ‘नाम’ स्पष्ट रूप से नहीं लिखा है। इसलिए मुख्य पाठ को सहज रखा गया और वास्तविक अनिश्चितता पादटिप्पणी में सुरक्षित की गई है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिंदी। परमेश्वर के लिए काव्य-संदर्भ के अनुरूप एकवचन आत्मीय संबोधन ‘तेरे’ रखा गया है। पंक्ति-विभाजन इब्रानी काव्य के दो उपवाक्यों को स्पष्ट करता है।
