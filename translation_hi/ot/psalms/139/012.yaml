source:
  edition: WLC
  text: גַּם חֹשֶׁךְ֮ לֹֽא יַחְשִׁ֪יךְ מִ֫מֶּ֥/ךָ וְ֭/לַיְלָה כַּ/יּ֣וֹם יָאִ֑יר כַּ֝/חֲשֵׁיכָ֗ה כָּ/אוֹרָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/139/012.yaml
  text: Even darkness is not dark to you[a]; the night shines like the day[b]; darkness is like light to you.
translation:
  language: hi
  text: अँधेरा भी तेरे लिए अँधेरा नहीं है[a]; रात दिन के समान चमकती है; अँधेरा और उजाला तेरे लिए एक समान हैं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक भाव: “अँधेरा भी तेरे लिए अँधेरा नहीं करता।” हिब्रू क्रिया कारणवाचक है—“अँधेरा करना”—पर यहाँ विशेषणात्मक अर्थ हिन्दी में अधिक स्वाभाविक है।'
    reason: lexical_alternative
  - marker: b
    text: इसका अनुवाद “जैसा अँधेरा, वैसा ही उजाला” भी हो सकता है; अर्थात परमेश्वर के सामने दोनों एक समान हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: भी
  rationale: 'यह पिछले विचार को बलपूर्वक आगे बढ़ाता है: अँधेरा भी परमेश्वर के सामने बाधा नहीं बनता। हिन्दी में ‘भी’ इस भाव को स्वाभाविक रूप से व्यक्त करता है।'
- source_word: חֹשֶׁךְ
  choice: अँधेरा
  rationale: यह सामान्य और सहज आधुनिक हिन्दी शब्द है तथा उजाले के साथ स्पष्ट काव्यात्मक विरोध बनाए रखता है।
- source_word: לֹא יַחְשִׁיךְ מִמֶּךָ
  choice: तेरे लिए अँधेरा नहीं है
  rationale: हिब्रू क्रिया का रूप कारणवाचक है, पर प्रसंग में उसका भाव यह है कि अँधेरा परमेश्वर के लिए अँधेरा नहीं बनता। यह हिन्दी में स्वाभाविक रहते हुए मूल रूपक को सुरक्षित रखता है।
- source_word: וְלַיְלָה כַּיּוֹם יָאִיר
  choice: रात दिन के समान चमकती है
  rationale: तुलना और प्रकाश देने/चमकने के क्रियात्मक चित्र, दोनों को सीधे और काव्यात्मक ढंग से रखा गया है।
- source_word: כַחֲשֵׁיכָה כָּאוֹרָה
  choice: अँधेरा और उजाला तेरे लिए एक समान हैं
  rationale: संक्षिप्त हिब्रू तुलनात्मक कथन का स्वाभाविक हिन्दी रूप; यह बताता है कि परमेश्वर के सामने अँधेरे और उजाले में कोई अंतर नहीं है।
theological_decisions:
- issue: पहली पंक्ति में अँधेरे के न छिपा सकने के निहितार्थ को स्पष्ट करना
  choice: 'मूल प्रकाश-अँधेरा रूपक को बनाए रखा: ‘तेरे लिए अँधेरा नहीं है’।'
  alternative: ‘अँधेरा तुझसे कुछ नहीं छिपा सकता।’
  rationale: वैकल्पिक रूप अर्थ को स्पष्ट करता है, पर सर्वज्ञता के निहितार्थ को मूल शब्दों से अधिक खुलकर कह देता है। चुना हुआ पाठ काव्यात्मक तनाव और रूपक को सुरक्षित रखता है।
- issue: अंतिम खंड की संक्षिप्त तुलनात्मक रचना
  choice: ‘अँधेरा और उजाला तेरे लिए एक समान हैं।’
  alternative: ‘जैसा अँधेरा, वैसा ही उजाला।’
  rationale: दोनों अर्थ सम्भव हैं। चुना हुआ रूप हिन्दी में अधिक स्पष्ट है और परमेश्वर के संबंध में तुलना को व्यक्त करता है, जबकि पादटिप्पणी मूल की अधिक संक्षिप्त रचना बताती है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी; भजन की काव्यात्मक समानांतरता बनाए रखने के लिए ‘अँधेरा’, ‘रात’, ‘दिन’ और ‘उजाला’ जैसे सामान्य शब्द चुने गए हैं। परमेश्वर को संबोधन में निकट, काव्यात्मक एकवचन ‘तेरे’ रखा गया है।
