lexical_decisions:
- source_word: אָ֭נָה
  choice: कहाँ
  rationale: यह गंतव्य या स्थान पूछने वाला प्रश्नवाचक क्रियाविशेषण है; आधुनिक हिन्दी में ‘कहाँ’ स्वाभाविक है।
- source_word: אֵלֵךְ
  choice: जा सकता हूँ
  rationale: הלך का प्रथम पुरुष एकवचन अपूर्ण रूप है। इस आलंकारिक प्रश्न में संभावना की असंभवता व्यक्त करने के लिए ‘जा सकता हूँ’ स्वाभाविक है।
- source_word: מֵ/רוּחֶךָ
  choice: तेरे आत्मा से दूर
  rationale: רוּחַ के अर्थ ‘आत्मा’, ‘वायु’ या ‘श्वास’ हो सकते हैं। ‘तेरी उपस्थिति’ के समानांतर और प्रसंग में ‘आत्मा’ व्यक्तिगत ईश्वरीय संदर्भ को सबसे अच्छी तरह व्यक्त करता है। ‘दूर’ हिन्दी में अलगाव का आशय स्पष्ट करता है।
- source_word: וְ/אָ֗נָה
  choice: कहाँ
  rationale: संयोजक के साथ दोहराया गया प्रश्नवाचक शब्द दूसरा समानांतर प्रश्न आरंभ करता है; हिन्दी काव्य में अलग वाक्य के रूप में ‘कहाँ’ स्वाभाविक है।
- source_word: מִ/פָּנֶ֥י/ךָ
  choice: तेरी उपस्थिति से
  rationale: פָּנִים का शाब्दिक अर्थ ‘मुख’ है, पर इस मुहावरे में इसका अर्थ किसी की व्यक्तिगत उपस्थिति है।
- source_word: אֶבְרָֽח
  choice: भागकर ... जा सकता हूँ
  rationale: ברח का अर्थ ‘भागना’ है। ‘भागकर कहाँ जा सकता हूँ’ पलायन के प्रयास को सहज हिन्दी में व्यक्त करते हुए पहले प्रश्न की संरचना से समानता रखता है।
theological_decisions:
- issue: यहाँ רוּחַ को निरपेक्ष ‘वायु/श्वास’ माना जाए या व्यक्तिगत ईश्वरीय ‘आत्मा’
  choice: तेरे आत्मा
  alternative: तेरी वायु; तेरी श्वास
  rationale: भजन 139 में परमेश्वर के सर्वज्ञ ज्ञान और उसकी उपस्थिति से बच न सकने पर बल है। ‘तेरी उपस्थिति’ के समानांतर होने के कारण व्यक्तिगत ईश्वरीय संदर्भ अधिक उपयुक्त है, फिर भी शब्द की मूल अर्थ-व्याप्ति पाद-टिप्पणी में सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। परमेश्वर को संबोधित करते हुए काव्यात्मक एकवचन ‘तेरे/तेरी’ रखा गया है। दोनों समानांतर आलंकारिक प्रश्नों की लय और आशय सुरक्षित हैं।
