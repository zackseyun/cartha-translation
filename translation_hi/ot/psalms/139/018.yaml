  yaml_path: translation/ot/psalms/139/018.yaml
  text: If I were to count them[a], they would be more than the sand. When I awake[b], I am still with you.
translation:
  language: hi
  text: यदि मैं उन्हें गिनूँ[a], तो वे रेत के कणों से भी अधिक होंगे। जब मैं जागता हूँ[b], तब भी मैं तेरे साथ हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं उन्हें गिनूँ, तो वे रेत के कणों से भी अधिक निकलेंगे।” इब्रानी वाक्य संक्षिप्त है और इसकी शर्तात्मक रचना कुछ भिन्न ढंग से भी व्यक्त की जा सकती है।
    reason: lexical_alternative
  - marker: b
    text: इसे “मैं जागा, और अब भी तेरे साथ हूँ” भी अनुवाद किया जा सकता है। इब्रानी यहाँ यह स्पष्ट नहीं करता कि जागना सामान्य, तत्काल भूतकालीन या रूपकात्मक है।
    reason: alternative_reading
lexical_decisions:
- source_word: אֶסְּפְּרֵם
  choice: यदि मैं उन्हें गिनूँ
  rationale: ספר के क़ाल अपूर्ण 1cs और 3mp प्रत्यय का मूल अर्थ ‘मैं उन्हें गिनूँ’ है। प्रसंग में यह अगली उपवाक्य के साथ स्वाभाविक शर्त व्यक्त करता है और सर्वनाम को बनाए रखता है।
- source_word: מֵחוֹל יִרְבּוּן
  choice: वे रेत के कणों से भी अधिक होंगे
  rationale: חול ‘रेत’ और מן तुलनात्मक अर्थ देता है; רבה यहाँ संख्या में बढ़कर होने का भाव रखता है। ‘रेत के कणों’ से हिन्दी में गिनती की तुलना स्पष्ट और स्वाभाविक होती है।
- source_word: הֱקִיצֹתִי
  choice: मैं जागता हूँ
  rationale: रूप को भूतकाल ‘मैं जागा’ भी समझा जा सकता है, पर काव्यगत प्रसंग में वर्तमान/सामान्य जागने का भाव सम्भव है। मुख्य पाठ काल को अत्यधिक निश्चित नहीं करता और वैकल्पिक पाठ पादटिप्पणी में दिया गया है।
- source_word: וְעוֹדִי עִמָּךְ
  choice: तब भी मैं तेरे साथ हूँ
  rationale: עוד निरन्तरता का भाव देता है—‘अब भी/तब भी’; עם का सीधा अर्थ ‘साथ’ है। ‘तब भी’ जागने के बाद भी बनी रहने वाली संगति को सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ‘उन्हें’ का संदर्भ
  choice: सर्वनाम को मुख्य पाठ में बनाए रखा गया है; निकट प्रसंग में यह परमेश्वर के विचारों की ओर लौटता है।
  alternative: मुख्य पाठ में स्पष्ट रूप से ‘तेरे विचारों को’ कहा जा सकता था।
  rationale: इब्रानी पाठ सर्वनाम ही रखता है। इसे बनाए रखने से पिछले पद के साथ संबंध बना रहता है और अर्थ को अनावश्यक रूप से विस्तार नहीं दिया जाता।
- issue: अन्तिम पंक्ति का आशय
  choice: जागने पर भी भजनकार का परमेश्वर के साथ होना जारी रहता है।
  alternative: इसे नींद से जागने की तत्काल भूतकालीन घटना या मृत्यु के बाद जागने का संकेत माना जा सकता है।
  rationale: पाठ निरन्तर संगति कहता है, पर पुनरुत्थान को स्पष्ट रूप से नहीं कहता; इसलिए वह धर्मवैज्ञानिक अर्थ मुख्य पाठ में नहीं जोड़ा गया।
- issue: परमेश्वर को सम्बोधन
  choice: ‘तेरे’ का प्रयोग
  alternative: आदरार्थक ‘आपके’ का प्रयोग
  rationale: भजन की सीधी, निकट और काव्यात्मक प्रार्थना के लिए ‘तू/तेरे’ हिन्दी बाइबिलीय शैली में गरिमापूर्ण आत्मीयता व्यक्त करता है, अनादर नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, काव्यात्मक और गरिमापूर्ण शैली अपनाई गई है। ‘रेत के कणों’ से संख्या की तुलना सामान्य पाठक के लिए स्पष्ट होती है। मूल की सर्वनामगत और कालगत अस्पष्टता को मुख्य पाठ तथा पादटिप्पणियों में सुरक्षित रखा गया है।
