translation:
  language: hi
  text: वहाँ भी तेरा हाथ मेरी अगुवाई करेगा, और तेरा दाहिना हाथ मुझे थामे रहेगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גַּם שָׁם
  choice: वहाँ भी
  rationale: גַּם का समावेशी बल और שָׁם का स्थान-सूचक अर्थ स्वाभाविक हिंदी शब्दक्रम में सुरक्षित है।
- source_word: תַנְחֵנִי
  choice: मेरी अगुवाई करेगा
  rationale: נחה धातु के हिफ़ील रूप का अर्थ मार्ग दिखाते हुए ले चलना है; ‘अगुवाई करेगा’ इस सक्रिय मार्गदर्शन को व्यक्त करता है।
- source_word: וְתֹאחֲזֵנִי
  choice: और ... मुझे थामे रहेगा
  rationale: אחז का अर्थ पकड़ना या थामना है; प्रसंग में निरंतर सहारा और दृढ़ पकड़ व्यक्त करने के लिए ‘थामे रहेगा’ चुना गया है।
- source_word: יְמִינֶךָ
  choice: तेरा दाहिना हाथ
  rationale: मूल का शाब्दिक अंग-संदर्भ और उससे जुड़ा सामर्थ्य का बिंब दोनों बनाए रखे गए हैं।
theological_decisions:
- issue: परमेश्वर के हाथ द्वारा अगुवाई और थामे जाने का संबंध
  choice: दोनों समानांतर क्रियाओं को बिना अतिरिक्त व्याख्या के रखा गया
  alternative: इसे केवल सुरक्षा, नियंत्रण या उद्धार के रूप में स्पष्ट करना
  rationale: मूल पाठ मार्गदर्शन और पकड़—दोनों बिंब देता है, पर उनके धार्मिक आशय को किसी एक व्याख्या तक सीमित नहीं करता।
translation_notes:
  register: आधुनिक, dignified भक्ति-काव्यात्मक हिंदी; संबोधन में निकटता और भजन की शैली बनाए रखने के लिए ‘तेरा/तेरे’ रूप प्रयुक्त।
