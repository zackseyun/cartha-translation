id: PSA.139.17
reference: Psalms 139:17
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/לִ֗/י מַה יָּקְר֣וּ רֵעֶ֣י/ךָ אֵ֑ל מֶ֥ה עָ֝צְמוּ רָאשֵׁי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/139/017.yaml
  text: And to me[a], how precious are your thoughts, O God[b]; how vast is the sum of them!
translation:
  language: hi
  text: और मेरे लिए तेरे विचार कितने बहुमूल्य हैं, हे परमेश्वर![a] उनकी कुल संख्या कितनी विशाल है![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘तेरे मित्र’ अथवा ‘तेरे प्रिय जन।’ इब्रानी शब्द को इस अर्थ में भी समझा जा सकता है, पर पद 17–18 में गिनने और विशाल संख्या का प्रसंग ‘तेरे विचार’ अर्थ का समर्थन करता है।
    reason: alternative_reading
  - marker: b
    text: शाब्दिक अर्थ ‘उनके सिर’ है; यहाँ इस मुहावरे का अर्थ संभवतः ‘उनका कुल योग’ या ‘उनकी कुल संख्या’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִי
  choice: और मेरे लिए
  rationale: यह संयोजन व्यक्तिगत और बलाघाती दृष्टिकोण व्यक्त करता है—‘और जहाँ तक मेरा संबंध है/मेरे लिए।’ ‘और मेरे लिए’ पूर्ववर्ती प्रसंग से संबंध और व्यक्तिगत भाव दोनों बनाए रखता है।
- source_word: מַה ... יָּקְרוּ
  choice: कितने बहुमूल्य हैं
  rationale: מַה यहाँ प्रश्नवाचक नहीं, विस्मयबोधक है; יקר मूल्यवान या बहुमूल्य होने का भाव देता है। यह हिंदी में स्वाभाविक रूप से विस्मय और आदर व्यक्त करता है।
- source_word: רֵעֶיךָ
  choice: तेरे विचार
  rationale: रूप का अर्थ ‘तेरे मित्र/तेरे प्रिय जन’ भी समझा जा सकता है, पर पद 18 में उन्हें गिनने और उनकी विशाल संख्या का उल्लेख ‘विचार’ अर्थ का अधिक समर्थन करता है।
- source_word: אֵל
  choice: हे परमेश्वर
  rationale: यहाँ אֵל प्रत्यक्ष संबोधन है; ‘हे परमेश्वर’ हिंदी में उसका काव्यात्मक और गरिमापूर्ण संबोधन सुरक्षित रखता है।
- source_word: מֶה ... עָצְמוּ
  choice: कितनी विशाल है
  rationale: दूसरा מֶה भी विस्मयबोधक है। עצם यहाँ बल के साथ-साथ अत्यधिक संख्या या विशालता का अर्थ देता है, जिसे अगले पद में गिनने का प्रसंग पुष्ट करता है।
- source_word: רָאשֵׁיהֶם
  choice: उनकी कुल संख्या
  rationale: शाब्दिक अर्थ ‘उनके सिर’ है, किंतु यहाँ यह मुहावरे के रूप में कुल योग या संख्या को सूचित करता है। अगले पद के ‘गिनूँ’ के कारण ‘कुल संख्या’ स्पष्ट और प्रसंगानुकूल है।
theological_decisions:
- issue: רֵעֶיךָ का अर्थ
  choice: तेरे विचार
  alternative: तेरे मित्र / तेरे प्रिय जन
  rationale: पद 17–18 में अगणनीयता और गिनने की भाषा अमूर्त अर्थ ‘विचार’ या ‘अभिप्राय’ का समर्थन करती है। फिर भी इब्रानी रूप में व्यक्तिवाचक वैकल्पिक अर्थ वास्तविक है, इसलिए उसे पाद-टिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण काव्यात्मक शैली रखी गई है। परमेश्वर के लिए एकवचन निकट संबोधन ‘तेरे’ मूल इब्रानी के प्रत्यक्ष, व्यक्तिगत संबोधन को दर्शाता है। विस्मयबोधक समानांतरता के लिए दोनों खंडों में ‘कितने/कितनी’ रखा गया है।
