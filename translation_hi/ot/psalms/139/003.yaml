  text: You sift out my path and my lying down[a], and you are acquainted with all my ways.
translation:
  language: hi
  text: मेरी राह और मेरे लेटने को तू परखता है[a], और मेरे सभी मार्गों से भली-भाँति परिचित है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तू मेरी राह और मेरे लेटने को फटकता है।” इब्रानी क्रिया में अनाज को फटकने का बिंब है और यहाँ उसका भाव सावधानी से जाँचने का है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אָרְחִי
  choice: मेरे चलने
  rationale: संज्ञा אָרְחִי मार्ग या यात्रा को सूचित करती है। यहाँ ‘मेरे चलने’ से जीवन की गतिशील अवस्था व्यक्त होती है और समानांतर ‘मेरे लेटने’ के साथ स्वाभाविक हिन्दी बनती है।
- source_word: רִבְעִי
  choice: मेरे लेटने
  rationale: यह रूप लेटने या विश्राम के लिए झुकने को दर्शाता है। ‘मेरे लेटने’ सरल, प्रत्यक्ष और काव्यात्मक समानांतर के अनुकूल है।
- source_word: זֵרִיתָ
  choice: तू परखता है
  rationale: क्रिया में अनाज फटकने या छानने का मूल बिंब है और प्रसंग में सावधानी से जाँचने का भाव देती है। हिन्दी में ‘परखता है’ उस सूक्ष्म जाँच को स्वाभाविक ढंग से व्यक्त करता है; मूल बिंब को पादटिप्पणी में स्पष्ट किया गया है।
- source_word: כָל
  choice: सब
  rationale: यह समग्रता का सीधा सूचक है और परमेश्वर के पूर्ण परिचय पर बल देता है।
- source_word: דְּרָכַי
  choice: मेरे सब मार्गों
  rationale: דֶּרֶךְ वास्तविक मार्ग और जीवन-व्यवहार, दोनों का अर्थ दे सकता है। ‘मार्गों’ इस दोहरे काव्यात्मक अर्थ को बनाए रखता है।
- source_word: הִסְכַּנְתָּה
  choice: भली-भाँति परिचित है
  rationale: यहाँ क्रिया गहरे और निकट परिचय का भाव देती है। ‘भली-भाँति परिचित है’ केवल सामान्य जानकारी से अधिक पूर्ण परिचय व्यक्त करता है।
theological_decisions:
- issue: परमेश्वर के ज्ञान के लिए मानवीय क्रिया का बिंब
  choice: परखने और मार्गों के ठोस बिंब बनाए रखे गए हैं, बिना अमूर्त धर्मवैज्ञानिक विस्तार के।
  alternative: ‘तू मेरे उठने-बैठने को जानता है’ जैसे अधिक सपाट और व्याख्यात्मक शब्दों में प्रस्तुत करना।
  rationale: मूल पद परमेश्वर के गहरे ज्ञान को फटकने/छानने और मार्गों के दैनिक बिंबों द्वारा व्यक्त करता है। अनुवाद उस काव्यात्मक तनाव और ठोसपन को यथासंभव बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण काव्यात्मक शैली रखी गई है। भजन में परमेश्वर को सीधे संबोधन के अनुरूप एकवचन ‘तू’ प्रयोग किया गया है; यह अंतरंगता दर्शाता है, अनादर नहीं।
