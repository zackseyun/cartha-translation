  yaml_path: translation/ot/psalms/139/019.yaml
  text: If only you would kill the wicked[a], O God, and you men of blood, depart from me.
translation:
  language: hi
  text: 'हे परमेश्वर, काश तू दुष्ट को मार डालता!


    हत्यारे लोगो,[a] मुझसे दूर हो जाओ!'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, ‘रक्त के लोग’; यह हिंसक या हत्यारे लोगों के लिए इब्रानी मुहावरा है।
    reason: मुहावरे का शाब्दिक रूप और उसका अर्थ स्पष्ट करना।
lexical_decisions:
- source_word: אִם תִּקְטֹל
  choice: काश तू ... मार डालता
  rationale: वाक्य के आरम्भ में אִם और अपूर्ण क्रिया यहाँ सामान्य शर्त नहीं, बल्कि तीव्र इच्छा व्यक्त करते हैं। ‘काश’ इस कामनार्थक भाव को स्वाभाविक आधुनिक हिन्दी में रखता है; ‘मार डालता’ קטל की स्पष्ट तीव्रता को कम नहीं करता।
- source_word: אֱלוֹהַּ
  choice: हे परमेश्वर
  rationale: यह प्रत्यक्ष सम्बोधन है। ‘हे परमेश्वर’ प्रार्थनात्मक और गरिमापूर्ण हिन्दी में सम्बोधन को स्पष्ट करता है।
- source_word: רָשָׁע
  choice: दुष्ट को
  rationale: इब्रानी में शब्द एकवचन है, पर सामान्य अथवा सामूहिक अर्थ रख सकता है। हिन्दी का ‘दुष्ट को’ उसके व्याकरणिक एकवचन को बनाए रखते हुए वर्गगत अर्थ के लिए भी खुला रहता है।
- source_word: וְאַנְשֵׁי דָמִים
  choice: हे खून के प्यासे लोगो
  rationale: शाब्दिक रूप ‘खून के लोग’ हिन्दी में अस्पष्ट और अस्वाभाविक होगा। यह इब्रानी मुहावरा हिंसक या हत्यारे लोगों को बताता है; ‘खून के प्यासे’ उसकी सजीव छवि और हिंसक आशय दोनों व्यक्त करता है।
- source_word: סוּרוּ מֶנִּי
  choice: मुझसे दूर हो जाओ
  rationale: बहुवचन आज्ञार्थक क्रिया और ‘मुझसे’ को सहज वर्तमान हिन्दी में सीधी आज्ञा के रूप में व्यक्त किया गया है।
theological_decisions:
- issue: क्या न्याय की इस कामना को नरम किया जाए
  choice: परमेश्वर से दुष्ट को मार डालने की भजनकार की प्रत्यक्ष कामना को यथावत रखना
  alternative: इसे केवल भावी न्याय की भविष्यवाणी बनाना, या ‘मार डालता’ के स्थान पर ‘निपटता’ जैसा नरम शब्द रखना
  rationale: इब्रानी पाठ स्पष्ट रूप से कामनार्थक है और קטל मृत्यु-दण्डकारी क्रिया को व्यक्त करता है। अनुवाद इस कठिन धर्मवैचारिक तनाव को कम या हल नहीं करता।
- issue: רָשָׁע का एकवचन और उसके बाद बहुवचन सम्बोधन
  choice: ‘दुष्ट को’ एकवचन रखना और अगले खंड में ‘लोगो’ बहुवचन रखना
  alternative: दोनों को एक ही संख्या में समतल कर देना
  rationale: मूल पाठ में वास्तविक संख्या-परिवर्तन है। उसे बनाए रखना पाठ की सम्भावित सामूहिक/सामान्य एकवचनता को खुला रखता है।
translation_notes:
  register: भाषा आधुनिक, सीधी और प्रार्थनात्मक गरिमा वाली है। ‘हे’ सम्बोधन भजन की ऊँची शैली बनाए रखता है, जबकि ‘मुझसे दूर हो जाओ’ सामान्य पाठक के लिए सहज है। विस्मयादिबोधक चिह्न दोनों तीव्र उक्तियों को स्पष्ट करते हैं।
