  yaml_path: translation/ot/psalms/139/001.yaml
  text: For the choirmaster[a]. Of David. A psalm. O Yahweh[b], you have searched me and known me.
translation:
  language: hi
  text: 'संगीत-निर्देशक के लिए[a]। दाऊद का[b] भजन।


    हे याहवे, तूने मुझे जाँचा है और मुझे जान लिया है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “संगीत-निर्देशक को”; भजनों के शीर्षकों में इब्रानी पूर्वसर्ग दिशा अथवा समर्पण का भाव दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “दाऊद के लिए” अथवा “दाऊद द्वारा”; इब्रानी शीर्षक रचनाकारिता, समर्पण या संबंध के विषय में निश्चित नहीं है।
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: प्रधान संगीतकार के लिए
  rationale: भजन-संग्रह के शीर्षकों में यह पद संगीत का नेतृत्व या निरीक्षण करने वाले व्यक्ति को सूचित करता है। ‘के लिए’ उपसर्ग ל की संभावित समर्पण अथवा निर्देश की भावना को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לְדָוִד
  choice: दाऊद का
  rationale: भजन के शीर्षक में ל संबंध, रचनाकारिता या समर्पण का बोध करा सकता है। ‘दाऊद का’ इस लचीलेपन को ‘दाऊद द्वारा रचित’ की अपेक्षा अधिक सुरक्षित रखता है।
- source_word: מִזְמוֹר
  choice: भजन
  rationale: यह संज्ञा प्रायः वाद्य-संगीत के साथ गाए जाने वाले पवित्र गीत को सूचित करती है; ‘भजन’ आधुनिक हिन्दी में स्पष्ट और प्रतिष्ठित पर्याय है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत वाचा-नाम है; लिप्यंतरण ‘याहवे’ किसी उपाधि से उसका प्रतिस्थापन नहीं करता।
- source_word: חֲקַרְתַּנִי
  choice: तूने मुझे परखा है
  rationale: क्रिया का अर्थ गहराई से खोजने, जाँचने या परखने का है। ‘परखा है’ व्यक्तिगत जाँच के काव्यात्मक भाव और पूर्ण क्रिया के वर्तमान परिणाम को बनाए रखता है।
- source_word: וַתֵּדָע
  choice: और मुझे जान लिया है
  rationale: ידע का मूल अर्थ ‘जानना’ है। पूर्ववर्ती पूर्ण क्रिया के साथ ‘जान लिया है’ खोज के फलस्वरूप प्राप्त गहन ज्ञान को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: हे याहवे
  alternative: हे प्रभु
  rationale: इब्रानी पाठ में उपाधि नहीं, चतुरक्षरीय व्यक्तिगत नाम प्रयुक्त है। ‘याहवे’ उस नाम को स्पष्ट रखता है; सम्बोधन के कारण हिन्दी में ‘हे’ जोड़ा गया है।
- issue: לְדָוִד में दाऊद से संबंध का स्वरूप
  choice: दाऊद का
  alternative: दाऊद द्वारा रचित
  rationale: शीर्षक का इब्रानी संबंधसूचक उपसर्ग रचनाकारिता, समर्पण या संबद्धता सूचित कर सकता है। मुख्य पाठ में अधिक निश्चित दावा न करके मूल अस्पष्टता सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ईश्वर को संबोधित करते समय काव्यात्मक निकटता के अनुरूप एकवचन ‘तू’ प्रयुक्त है। शीर्षक संक्षिप्त रखा गया है और उसकी वास्तविक इब्रानी अस्पष्टताओं को पादटिप्पणियों में सुरक्षित किया गया है।
