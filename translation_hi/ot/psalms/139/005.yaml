id: PSA.139.5
reference: Psalms 139:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אָח֣וֹר וָ/קֶ֣דֶם צַרְתָּ֑/נִי וַ/תָּ֖שֶׁת עָלַ֣/י כַּפֶּֽ/כָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/139/005.yaml
  text: You hem me in behind and before[a], and lay your hand upon me.
translation:
  language: hi
  text: तूने मुझे पीछे और आगे से घेर रखा है[a], और अपना हाथ मुझ पर रखा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तूने मुझे चारों ओर से घेर लिया है” अथवा “तूने मेरी घेराबंदी की है”; इब्रानी क्रिया संदर्भ में तटस्थ या रक्षात्मक घेरे के साथ अधिक दबावपूर्ण भाव भी व्यक्त कर सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אָחוֹר
  choice: पीछे
  rationale: קֶדֶם के साथ स्थान-सूचक युग्म में यह ‘पीछे’ का अर्थ देता है और मूल स्थानिक बिंब को स्पष्ट रखता है।
- source_word: קֶדֶם
  choice: आगे
  rationale: אָחוֹר के विरोधी युग्म में यहाँ अर्थ ‘आगे/सामने’ है, न कि काल-सूचक ‘पहले’ या दिशा-सूचक ‘पूर्व’।
- source_word: צַרְתָּנִי
  choice: मुझे ... घेर रखा है
  rationale: यह चयन चारों ओर से घेरे जाने का बिंब बनाए रखता है और क्रिया में संभव सुरक्षा तथा दबाव—दोनों भावों को किसी एक में सीमित नहीं करता।
- source_word: וַתָּשֶׁת
  choice: रखा है
  rationale: שׁית का सामान्य अर्थ ‘रखना/स्थापित करना’ है; ‘हाथ मुझ पर रखा है’ स्वाभाविक और काव्यात्मक हिन्दी है।
- source_word: עָלַי
  choice: मुझ पर
  rationale: עַל की स्थिति-सूचक भावना का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: כַּפֶּךָ
  choice: अपना हाथ
  rationale: כַּף का शाब्दिक अर्थ ‘हथेली’ हो सकता है, पर इस प्रयोग में हिन्दी का स्वाभाविक मानवरूपी बिंब ‘हाथ’ है; ‘अपना’ संबोधित कर्ता से संबंध स्पष्ट करता है।
theological_decisions:
- issue: पद का भाव रक्षात्मक, प्रतिबंधात्मक, या दोनों माना जाए
  choice: ‘घेर रखा है’ द्वारा ईश्वरीय घेरे और स्पर्श की संदिग्धता तथा भावात्मक तनाव बनाए रखा गया है।
  alternative: इसे केवल रक्षात्मक (‘मेरी रक्षा की है’) या केवल दबावपूर्ण (‘मुझे घेराबंदी में लिया है’) बनाना।
  rationale: इब्रानी צַרְתָּנִי संदर्भ में संरक्षण और दबाव, दोनों की छाया रख सकता है। भजन में परमेश्वर की सर्वज्ञ उपस्थिति अंतरंग भी है और अभिभूत करने वाली भी; अनुवाद इस तनाव को चुपचाप हल नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और काव्यात्मक शैली। परमेश्वर के लिए एकवचन आत्मीय संबोधन ‘तू’ भजन की सीधी प्रार्थनात्मक वाणी के अनुरूप है। ‘पीछे और आगे’ मूल स्थानिक युग्म को निकटता से सुरक्षित रखता है।
