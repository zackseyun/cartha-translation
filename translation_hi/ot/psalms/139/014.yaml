  text: אֽוֹדְ/ךָ֗ עַ֤ל כִּ֥י נוֹרָא֗וֹת נִ֫פְלֵ֥יתִי נִפְלָאִ֥ים מַעֲשֶׂ֑י/ךָ וְ֝/נַפְשִׁ֗/י יֹדַ֥עַת מְאֹֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/139/014.yaml
  text: I praise you[a], because I am fearfully and wonderfully made; wonderful are your works[b], and my soul knows it very well.
translation:
  language: hi
  text: मैं तेरी स्तुति करता हूँ, क्योंकि मैं विस्मयकारी और अद्भुत ढंग से रचा गया हूँ[a]; अद्भुत हैं तेरे कार्य, और मेरा प्राण[b] इस बात को भली-भाँति जानता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘मैं विस्मयकारी ढंग से बनाया गया हूँ।’ इब्रानी में आतंक नहीं, बल्कि श्रद्धापूर्ण विस्मय का भाव है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी ‘मेरा प्राण’; इसका अर्थ यहाँ ‘मैं स्वयं’ या ‘मेरा अंतरतम’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֽוֹדְךָ
  choice: मैं तेरी स्तुति करता हूँ
  rationale: हिफ़ील रूप यहाँ परमेश्वर के सृजनकारी कार्य के प्रत्युत्तर में उसकी प्रशंसा व्यक्त करता है। ‘स्तुति करता हूँ’ आधुनिक हिन्दी में इसके भक्तिपूर्ण बल को स्वाभाविक रूप से व्यक्त करता है; ‘धन्यवाद देता हूँ’ भी संभव है।
- source_word: עַל כִּי
  choice: क्योंकि
  rationale: यह पदबंध स्तुति का कारण प्रस्तुत करता है; ‘क्योंकि’ आधुनिक हिन्दी में कारण-संबंध को स्पष्ट रखता है।
- source_word: נוֹרָאוֹת
  choice: विस्मय जगानेवाली ... रीति से
  rationale: यह शब्द आतंकित करनेवाले भय से अधिक श्रद्धापूर्ण विस्मय उत्पन्न करने का भाव रखता है। ‘विस्मय जगानेवाली’ उस अर्थ को सामान्य पाठक के लिए स्पष्ट करता है।
- source_word: נִפְלֵיתִי
  choice: अद्भुत रीति से रचा गया हूँ
  rationale: निफ़ाल रूप असाधारण या अद्भुत होने का भाव देता है। निकटवर्ती संदर्भ में परमेश्वर द्वारा भजनकार की रचना का वर्णन होने के कारण हिन्दी में ‘रचा गया हूँ’ की पूर्ति अर्थसंगत और स्वाभाविक है।
- source_word: נִפְלָאִים
  choice: अद्भुत हैं
  rationale: यह परमेश्वर के कामों को साधारण से परे, आश्चर्यजनक और विलक्षण बताता है। ‘अद्भुत’ पूर्ववर्ती ध्वनि-संबंध को भी बनाए रखता है।
- source_word: מַעֲשֶׂיךָ
  choice: तेरे काम
  rationale: यह व्यापक अभिव्यक्ति परमेश्वर के कार्यों और बनाई हुई वस्तुओं दोनों को समेट सकती है तथा मूल के निकट रहती है।
- source_word: וְנַפְשִׁי
  choice: और मेरा प्राण
  rationale: נפש यहाँ व्यक्ति के भीतर के अस्तित्व अथवा स्वयं व्यक्ति को सूचित कर सकता है। ‘मेरा प्राण’ काव्यात्मक छवि को बनाए रखता है, जबकि पादटिप्पणी व्यापक अर्थ बताती है।
- source_word: יֹדַעַת מְאֹד
  choice: इसे भली-भाँति जानता है
  rationale: क्रिया का कर्ता ‘मेरा प्राण’ है और उसका कर्म प्रसंग से समझा जाता है। ‘इसे’ जोड़ना हिन्दी में कथन को सहज बनाता है; ‘भली-भाँति’ מְאֹד की तीव्रता व्यक्त करता है।
theological_decisions:
- issue: נֶפֶשׁ का मानवशास्त्रीय अर्थ
  choice: मुख्य पाठ में ‘मेरा प्राण’, और पादटिप्पणी में ‘मैं स्वयं’ तथा ‘मेरा अंतरतम’
  alternative: ‘मैं स्वयं’ या ‘मेरा अंतरतम’ को मुख्य पाठ में रखना
  rationale: ‘मेरा प्राण’ मूल की काव्यात्मक अभिव्यक्ति को सुरक्षित रखता है, पर इब्रानी शब्द अनिवार्य रूप से शरीर से पृथक किसी तत्व का तकनीकी सिद्धान्त प्रस्तुत नहीं करता। पादटिप्पणी उस व्यापक अर्थ-सीमा को स्पष्ट करती है।
- issue: נִפְלֵיתִי में सृजन का निहित भाव
  choice: ‘रचा गया हूँ’
  alternative: ‘अद्भुत ठहराया गया हूँ’ या ‘मैं अद्भुत हूँ’
  rationale: क्रिया अपने आप में असाधारण अथवा अद्भुत होने का भाव रखती है, जबकि पद 13–16 का संदर्भ परमेश्वर द्वारा भजनकार की रचना पर केंद्रित है। ‘रचा गया हूँ’ उस संदर्भगत निहितार्थ को हिन्दी में स्पष्ट करता है, बिना रचयिता का नाम इस उपवाक्य में अलग से जोड़ने के।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक रखी गई है। परमेश्वर के लिए एकवचन आत्मीय संबोधन ‘तेरा’ भजन की सीधी प्रार्थनात्मक वाणी के अनुरूप है। ‘विस्मय जगानेवाली’ को ‘भयानक’ पर प्राथमिकता दी गई है ताकि आधुनिक हिन्दी में आतंक का भ्रामक अर्थ न आए।
