  text: וּ/רְאֵ֗ה אִם דֶּֽרֶךְ עֹ֥צֶב בִּ֑/י וּ֝/נְחֵ֗/נִי בְּ/דֶ֣רֶךְ עוֹלָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/139/024.yaml
  text: And see whether there is any grievous way in me[b][a], and lead me in the everlasting way.
translation:
  language: hi
  text: और देख कि मुझमें कोई दुःखदायी मार्ग तो नहीं है,[a] और अनन्त मार्ग पर मेरी अगुवाई कर।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘कोई हानिकारक मार्ग,’ ‘कोई ठेस पहुँचानेवाला मार्ग’; संभवतः ‘मूर्तिपूजा का कोई मार्ग।’
    reason: lexical_alternative
  - marker: b
    text: या ‘प्राचीन मार्ग’ अथवा ‘सनातन मार्ग।’
    reason: lexical_alternative
lexical_decisions:
- source_word: וּרְאֵה
  choice: और देख
  rationale: यह पिछले पद की प्रार्थना को आगे बढ़ाता हुआ परमेश्वर से सीधा निवेदन है; ‘देख’ मूल क्रिया और संक्षिप्त काव्यात्मकता को बनाए रखता है।
- source_word: אִם
  choice: कि … तो नहीं
  rationale: यहाँ אִם शर्त नहीं, बल्कि परोक्ष प्रश्न प्रस्तुत करता है। हिंदी में ‘कि … तो नहीं’ आत्म-परीक्षण की विनती को स्वाभाविक रूप देता है।
- source_word: דֶּרֶךְ עֹצֶב
  choice: कोई दुःखदायी मार्ग
  rationale: ‘मार्ग’ जीवन-चाल का रूपक बनाए रखता है, और ‘दुःखदायी’ עֹצֶב में निहित पीड़ा, हानि या शोक पहुँचाने के व्यापक भाव को बिना अनावश्यक रूप से केवल मूर्तिपूजा तक सीमित किए व्यक्त करता है।
- source_word: בִּי
  choice: मुझमें
  rationale: यह मूल के आंतरिक, प्रथम-पुरुष भाव को सीधे व्यक्त करता है।
- source_word: וּנְחֵנִי
  choice: और … मेरी अगुवाई कर
  rationale: נחה का अर्थ मार्ग दिखाना या आगे ले चलना है; ‘मेरी अगुवाई कर’ प्रार्थनापूर्ण शैली और मार्ग के रूपक के साथ स्वाभाविक है।
- source_word: בְּדֶרֶךְ עוֹלָם
  choice: अनन्तकाल के मार्ग पर
  rationale: ‘पर’ हिंदी में किसी मार्ग पर अगुवाई किए जाने का स्वाभाविक प्रयोग है। ‘अनन्तकाल’ עוֹלָם की दीर्घकालिक या शाश्वत अवधि को सुरक्षित रखता है।
theological_decisions:
- issue: דֶּרֶךְ עֹצֶב का अर्थ
  choice: कोई दुःखदायी मार्ग
  alternative: कोई हानिकारक मार्ग; कोई ठोकर पहुँचानेवाला मार्ग; कोई मूर्तिपूजा का मार्ग
  rationale: यह कठिन और बहुअर्थी पदबंध है। मुख्य पाठ पीड़ा या हानि उत्पन्न करने वाली जीवन-चाल का व्यापक नैतिक अर्थ रखता है; ‘मूर्तिपूजा’ संभव व्याख्या है, पर संदर्भ उसे मुख्य पाठ में निश्चित करने के लिए पर्याप्त नहीं है।
- issue: דֶּרֶךְ עוֹלָם का अर्थ
  choice: अनन्तकाल का मार्ग
  alternative: प्राचीन मार्ग; सनातन मार्ग
  rationale: עוֹלָם अनन्त अवधि या प्राचीन काल दोनों का संकेत कर सकता है। संदर्भ में ‘अनन्तकाल का मार्ग’ उस स्थायी, परमेश्वर-सम्मत जीवन-मार्ग के भाव को सुरक्षित रखता है, जबकि दूसरी संभावना पादटिप्पणी में दी गई है।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी में सरल, गरिमापूर्ण और प्रार्थनापरक रखी गई है। ‘मार्ग’ की पुनरावृत्ति मूल इब्रानी के रूपक और दोनों मार्गों के विरोध को बनाए रखती है।
