  text: For the choirmaster[a]. Of David. A psalm. Yahweh[b], you have searched me and known me.
translation:
  language: hi
  text: संगीत-निर्देशक के लिए[a]। दाऊद का[b] भजन। हे याहवे, तूने मुझे जाँचा है और तू मुझे जानता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “संगीत-निर्देशक को”; भजनों के शीर्षकों में इब्रानी संबंधबोधक उपसर्ग दिशा या समर्पण सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “दाऊद द्वारा” अथवा “दाऊद के लिए”; इब्रानी शीर्षक लेखकत्व, समर्पण या दाऊद से किसी अन्य प्रकार का संबंध सूचित कर सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: संगीत-निर्देशक के लिए
  rationale: מְנַצֵּחַ भजनों के शीर्षकों में संगीत या गायन का नेतृत्व करने वाले व्यक्ति को सूचित करता है; לְ को यहाँ उद्देश्य/समर्पण के अर्थ में स्वाभाविक हिन्दी ‘के लिए’ से व्यक्त किया गया है।
- source_word: לְדָוִד
  choice: दाऊद का
  rationale: यह संक्षिप्त शीर्षकीय रूप दाऊद से संबंध व्यक्त करता है, पर केवल लेखकत्व को निश्चित नहीं करता; ‘दाऊद का’ हिन्दी में उसी संबंधपरक अस्पष्टता को पर्याप्त रूप से बनाए रखता है।
- source_word: מִזְמוֹר
  choice: भजन
  rationale: यह तार वाले वाद्य के साथ गाए जाने वाले गीत/स्तोत्र का पारंपरिक शीर्षकीय पद है; ‘भजन’ सहज और प्रतिष्ठित हिन्दी समतुल्य है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार अक्षरों वाले परमेश्वर के निजी नाम को उपाधि ‘प्रभु’ से बदलने के बजाय लिप्यंतरित किया गया है।
- source_word: חֲקַרְתַּנִי
  choice: तूने मुझे परखा है
  rationale: חקר का अर्थ गहराई से जाँचना या खोज-बीन करना है; ‘परखा है’ यहाँ व्यक्ति के अंतरतम को पूरी तरह जाँचने का भाव स्वाभाविक हिन्दी में देता है।
- source_word: וַתֵּדָע
  choice: और तू मुझे जानता है
  rationale: क्रिया में व्यक्त कर्ता एकवचन है और प्रसंग से कर्म ‘मुझे’ निहित है। हिन्दी में वर्तमान परिणामी ज्ञान को व्यक्त करने के लिए ‘जानता है’ चुना गया है, बिना इसे केवल भूतकालीन घटना बनाने के।
theological_decisions:
- issue: भजन के शीर्षक में לְדָוִד का संबंध
  choice: दाऊद का
  alternative: दाऊद द्वारा / दाऊद के लिए
  rationale: इब्रानी לְ लेखकत्व, समर्पण या संबद्धता सूचित कर सकता है। मुख्य पाठ में संबंधपरक और पारंपरिक ‘दाऊद का’ रखा गया है तथा निश्चित लेखकत्व आरोपित नहीं किया गया।
- issue: दिव्य नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में निजी नाम है, उपाधि नहीं। ‘याहवे’ प्रचलित विद्वत पुनर्निर्मित उच्चारण का हिन्दी लिप्यंतरण है और ‘प्रभु’ द्वारा नाम को छिपाता नहीं।
- issue: וַתֵּדָע का कालगत अर्थ
  choice: तू मुझे जानता है
  alternative: तूने मुझे जान लिया है
  rationale: इब्रानी पूर्ण क्रिया यहाँ जाँच के फलस्वरूप स्थापित ज्ञान अथवा वर्तमान वास्तविकता दोनों का संकेत दे सकती है। ‘जानता है’ परमेश्वर के वर्तमान ज्ञान को व्यक्त करता है और केवल ज्ञान-प्राप्ति की घटना तक अर्थ सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण भजन-शीर्षक रखा गया है। परमेश्वर को संबोधन में निकट और एकवचन ‘तू’ बाइबिलीय प्रार्थना की आत्मीयता दर्शाता है; वाक्य सरल है, पर חקר की गहन जाँच का भाव ‘परखा’ से सुरक्षित है।
