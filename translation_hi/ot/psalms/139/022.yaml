    reason: lexical_alternative
lexical_decisions:
- source_word: תַּכְלִית שִׂנְאָה
  choice: पूरी तरह घृणा
  rationale: תַּכְלִית पूर्णता, चरम सीमा या समग्रता का भाव देता है और שִׂנְאָה के साथ घृणा की तीव्रता को पूर्ण रूप से व्यक्त करता है। ‘पूरी तरह घृणा’ आधुनिक हिन्दी में स्वाभाविक है और इब्रानी के प्रबल अर्थ को बनाए रखता है।
- source_word: שְׂנֵאתִים
  choice: मैं उनसे ... घृणा करता हूँ
  rationale: यह क़ाल पूर्ण रूप, प्रथम पुरुष एकवचन और तृतीय पुरुष बहुवचन प्रत्यय है। काव्यात्मक प्रसंग में यह भजनकार की वर्तमान, दृढ़ मनोवृत्ति बताता है; इसलिए हिन्दी वर्तमान काल स्वाभाविक है।
- source_word: לְאוֹיְבִים הָיוּ לִי
  choice: वे मेरे शत्रु हो गए हैं
  rationale: היה के साथ לְ परिणामी अवस्था या संबंध को व्यक्त करता है। ‘मेरे शत्रु हो गए हैं’ उस परिणामसूचक भाव और व्यक्तिगत संबंध दोनों को स्पष्ट रखता है।
theological_decisions:
- issue: भजनकार की निंदा और घृणा की तीव्रता
  choice: घृणा के स्पष्ट और प्रबल शब्द को बनाए रखा गया है।
  alternative: मैं उनका पूरी तरह विरोध करता हूँ / मैं उन्हें अपने शत्रु मानता हूँ
  rationale: इब्रानी में घृणा-संबंधी शब्द-समूह दो बार आता है। आधुनिक संवेदनशीलता के कारण इसे ‘विरोध’ जैसे नरम शब्द में बदलना मूल पाठ की तीव्रता को घटा देगा।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सहज, गरिमापूर्ण और प्रबल है। ‘घृणा’ मूल के स्पष्ट hate-word group को सुरक्षित रखता है, जबकि ‘पूरी तरह’ תַּכְלִית की पूर्णता/चरम सीमा को सामान्य पाठक के लिए स्वाभाविक ढंग से व्यक्त करता है।
