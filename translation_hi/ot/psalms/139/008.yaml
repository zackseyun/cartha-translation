  text: אִם אֶסַּ֣ק שָׁ֭מַיִם שָׁ֣ם אָ֑תָּה וְ/אַצִּ֖יעָה שְּׁא֣וֹל הִנֶּֽ/ךָּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/139/008.yaml
  text: If I ascend to heaven[a], you are there; if I make my bed in Sheol, behold, you are there.
translation:
  language: hi
  text: 'यदि मैं स्वर्ग तक चढ़ जाऊँ, तो तू वहाँ है;

    यदि मैं शिओल[a] में अपना बिछौना बिछाऊँ, तो देख, तू वहाँ भी है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात मृतकों का लोक या अधोलोक; कभी-कभी ‘कब्र’ भी। हिब्रू ‘शिओल’ का अर्थ यहाँ बाद के अर्थ में ‘नरक’ होना आवश्यक नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: यदि
  rationale: यह काल्पनिक या शर्तसूचक उपवाक्य आरम्भ करता है और दोनों समानांतर पंक्तियों की रचना को बनाए रखता है।
- source_word: אֶסַּק
  choice: मैं ... चढ़ जाऊँ
  rationale: ऊपर जाने की गतिशील और ऊर्ध्व दिशा की काव्यात्मक छवि को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: שָׁמַיִם
  choice: स्वर्ग
  rationale: शिओल के साथ ऊँचाई और गहराई के काव्यात्मक विरोध में यह सबसे स्वाभाविक हिन्दी रूप है; ‘तक’ गन्तव्य की ऊर्ध्व छवि स्पष्ट करता है।
- source_word: שָׁם אָתָּה
  choice: तू वहाँ है
  rationale: स्थानसूचक क्रियाविशेषण और परमेश्वर को किए गए प्रत्यक्ष, आत्मीय सम्बोधन—दोनों को स्पष्ट रूप से बनाए रखता है।
- source_word: וְאַצִּיעָה
  choice: यदि मैं ... अपना बिछौना बिछाऊँ
  rationale: क्रिया में निहित बिछाने या बिस्तर लगाने की ठोस छवि को बनाए रखता है; केवल ‘लेट जाऊँ’ कहना अधिक व्याख्यात्मक होता।
- source_word: שְּׁאוֹל
  choice: शिओल
  rationale: हिब्रू शब्द का लिप्यन्तरण बाद की ‘नरक’ सम्बन्धी धारणाओं को पाठ में आरोपित किए बिना मृतकों के अधोलोक का प्राचीन बोध सुरक्षित रखता है।
- source_word: הִנֶּךָּ
  choice: तो देख, तू वहाँ भी है
  rationale: ‘देख’ विस्मय और प्रत्यक्ष अनुभूति का बल रखता है; ‘वहाँ भी है’ पहली पंक्ति की स्थानसूचक अभिव्यक्ति को स्वाभाविक हिन्दी में प्रतिध्वनित करता है।
theological_decisions:
- issue: परमेश्वर की उपस्थिति के सन्दर्भ में שְּׁאוֹל का अनुवाद
  choice: शिओल
  alternative: अधोलोक; मृतकों का लोक; कब्र; नरक
  rationale: यहाँ हिब्रू शब्द आवश्यक रूप से अन्तिम दण्ड के स्थान को नहीं दर्शाता। लिप्यन्तरण काव्य के इस दावे को सुरक्षित रखता है कि मृत्यु की गहराइयाँ भी परमेश्वर की उपस्थिति से बाहर नहीं हैं, और किसी बाद की विशिष्ट धर्मवैज्ञानिक धारणा को नहीं थोपता।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी अपनाई गई है। परमेश्वर के लिए ‘तू’ भजन की प्रत्यक्ष और आत्मीय प्रार्थनात्मक वाणी को बनाए रखता है। पंक्तियों का समानांतर विन्यास और ऊँचाई–गहराई का विरोध सुरक्षित रखा गया है।
