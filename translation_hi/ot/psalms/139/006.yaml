  yaml_path: translation/ot/psalms/139/006.yaml
  text: Such knowledge is too wonderful for me[a]; it is too high—I cannot attain it.
translation:
  language: hi
  text: यह ज्ञान मेरी समझ से परे, अत्यन्त अद्भुत है[a]; यह इतना ऊँचा है कि मैं इस तक पहुँच नहीं सकता।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यह ज्ञान मेरी समझ से परे है; यह ऊँचा है—मैं इस तक पहुँच नहीं सकता।”
    reason: मूल में प्रयुक्त शब्द विस्मयकारी होने के साथ-साथ भजनकार की समझ और पहुँच से परे होने का भाव भी दे सकते हैं।
lexical_decisions:
- source_word: פלאיה
  choice: अत्यन्त अद्भुत
  rationale: यह रूप किसी असाधारण और मानवीय समझ से बढ़कर बात को व्यक्त करता है। ‘अत्यन्त अद्भुत’ विस्मय और अगम्यता—दोनों भावों को स्वाभाविक हिन्दी में रखता है।
- source_word: דַעַת
  choice: ज्ञान
  rationale: यह संज्ञा पिछले पदों में वर्णित परमेश्वर के ज्ञान की ओर संकेत करती है; ‘ज्ञान’ इसका सीधा और प्रसंगानुकूल अनुवाद है।
- source_word: מִמֶּנִּי
  choice: मेरे लिए
  rationale: शाब्दिक अर्थ ‘मुझसे’ हो सकता है, पर यहाँ भाव भजनकार की क्षमता से परे होने का है। ‘मेरे लिए’ अगले विशेषण के साथ सहज हिन्दी बनाता है।
- source_word: נִשְׂגְּבָה
  choice: वह इतना ऊँचा है
  rationale: यह शब्द ऊँचाई, महानता और पहुँच से बाहर होने का भाव रखता है। इस चयन से मूल का ऊँचाई-संबंधी रूपक बना रहता है।
- source_word: לֹא אוּכַל לָהּ
  choice: मैं उस तक पहुँच नहीं सकता
  rationale: नकार सहित יכל असमर्थता बताता है, और לָהּ का अर्थ ‘उस तक’ है। ‘पहुँच नहीं सकता’ ऊँचाई के रूपक और बौद्धिक अगम्यता दोनों के अनुकूल है।
