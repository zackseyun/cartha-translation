  text: גָּלְמִ֤/י רָ֘א֤וּ עֵינֶ֗י/ךָ וְ/עַֽל סִפְרְ/ךָ֮ כֻּלָּ֪/ם יִכָּ֫תֵ֥בוּ יָמִ֥ים יֻצָּ֑רוּ ו/לא אֶחָ֣ד בָּ/הֶֽם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/139/016.yaml
  text: Your eyes saw my unformed substance[a], and in your book they all were written—the days that were formed[c][b], when not one of them yet existed.
translation:
  language: hi
  text: तेरी आँखों ने मेरे अनगढ़ रूप[a] को देखा; और तेरी पुस्तक में वे सब लिखे गए—वे दिन जो रचे गए[c][b], जबकि उनमें से एक भी अभी अस्तित्व में नहीं आया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘मेरे भ्रूण’ अथवा ‘मेरे अधबने रूप’। इब्रानी शब्द ऐसी वस्तु को दर्शाता है जो अभी पूरी तरह बनी न हो।
    reason: lexical_alternative
  - marker: b
    text: या ‘वे सब तेरी पुस्तक में लिखे गए; मेरे लिए दिन रचे गए।’ इब्रानी वाक्य-विन्यास संकुचित और कठिन है।
    reason: alternative_reading
  - marker: c
    text: ‘रचे गए’ का अनुवाद ‘आकार दिए गए’ भी हो सकता है। कुछ अनुवाद ‘ठहराए गए’ कहते हैं, पर वह इब्रानी क्रिया के मूल अर्थ से अधिक व्याख्यात्मक है।
    reason: lexical_alternative
lexical_decisions:
- source_word: גָּלְמִי
  choice: मेरे अनगढ़ शरीर
  rationale: גֹּלֶם किसी अभी पूरी तरह न बने हुए आकार या शरीर को दर्शाता है। ‘अनगढ़ शरीर’ इस बिंब को आधुनिक जैविक शब्दावली थोपे बिना स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: רָאוּ עֵינֶיךָ
  choice: तेरी आँखों ने ... देखा
  rationale: इब्रानी क़ातल क्रिया और उसके स्पष्ट कर्ता का सीधा, काव्यात्मक भूतकालीन अनुवाद।
- source_word: וְעַל סִפְרְךָ
  choice: और तेरी पुस्तक में
  rationale: עַל का मूल अर्थ ‘पर’ हो सकता है, किंतु लिखे जाने के संदर्भ में हिन्दी मुहावरा ‘पुस्तक में’ स्वाभाविक है।
- source_word: כֻּלָּם יִכָּתֵבוּ
  choice: वे सब लिखे गए
  rationale: निफ़अल क्रिया का कर्मवाच्य अर्थ और पुस्तक में अभिलेखित होने का ठोस बिंब बनाए रखा गया है। ‘वे’ का संदर्भ संक्षिप्त इब्रानी वाक्य-विन्यास के अनुरूप आगे आने वाले ‘दिन’ हैं।
- source_word: יָמִים יֻצָּרוּ
  choice: वे दिन जो रचे गए
  rationale: יָמִים को ‘वे सब’ का सबसे संभावित पूर्वपद मानते हुए स्पष्ट किया गया है। יצר का पुअल रूप ‘रचे गए/आकार दिए गए’ है; ‘ठहराए गए’ जैसा अधिक व्याख्यात्मक धार्मिक अर्थ नहीं थोपा गया।
- source_word: וְלֹא אֶחָד בָּהֶם
  choice: जबकि उनमें से एक भी अभी अस्तित्व में नहीं आया था
  rationale: इब्रानी पदबंध अंडाकार और संक्षिप्त है। यह अनुवाद उस निहित भाव को स्वाभाविक हिन्दी में खोलता है कि उन दिनों में से कोई भी तब तक घटित या अस्तित्व में नहीं आया था।
theological_decisions:
- issue: क्या יֻצָּרוּ को पूर्वनियति का प्रबल दावा बनाते हुए ‘ठहराए गए’ अनुवादित किया जाए
  choice: रचे गए
  alternative: ठहराए गए; आकार दिए गए
  rationale: मूल क्रिया का आधारभूत अर्थ रचना या आकार देना है। पद परमेश्वर के पूर्वज्ञान और उद्देश्य को दर्शाता है, पर अनुवाद में उससे अधिक विशिष्ट पूर्वनियति-संबंधी शब्दावली जोड़ना मूल की धार्मिक तनावपूर्ण व्यापकता को सीमित कर देगा।
- issue: כֻּלָּם और יָמִים के बीच कठिन वाक्य-संबंध
  choice: ‘वे सब’ को आगे आने वाले ‘दिनों’ से जोड़ना
  alternative: ‘वे सब तेरी पुस्तक में लिखे गए; मेरे लिए दिन रचे गए’
  rationale: दिनों को ‘वे सब’ का पूर्वपद मानना संदर्भ में सबसे संभावित है, किंतु इब्रानी वाक्य-विन्यास संकुचित और कठिन है; इसलिए वैकल्पिक विभाजन पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सम्मानपूर्ण, काव्यात्मक और सामान्य पाठक के लिए सुबोध शैली। भजन की सीधी एकवचन संबोधन-शैली के अनुसार ‘तेरी’ रखा गया है। ‘अनगढ़ शरीर’ मूर्त रूप लेने की प्रक्रिया का बिंब बनाए रखता है; ‘अस्तित्व में नहीं आया था’ अंतिम अंडाकार उपवाक्य को सहज हिन्दी में स्पष्ट करता है।
