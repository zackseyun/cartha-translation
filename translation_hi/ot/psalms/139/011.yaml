base_translation:
  language: en
  yaml_path: translation/ot/psalms/139/011.yaml
  text: And I said[a], “Surely darkness will cover me[b], and the night will be light around me.”
translation:
  language: hi
  text: और मैंने कहा, “निश्चय ही अँधेरा मुझे ढक लेगा[a], और रात मेरे चारों ओर उजली हो जाएगी[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मुझे अपने वश में कर लेगा,” अथवा “मुझे कुचल देगा।” इब्रानी क्रिया दुर्लभ है और यहाँ उसका सटीक भाव विवादित है।
    reason: lexical_alternative
  - marker: b
    text: या “और रात मेरे चारों ओर उजली है।” इब्रानी खंड में क्रिया नहीं है; कथन के संदर्भ के अनुसार इसे वर्तमान या भविष्यकाल में समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר
  choice: और मैंने कहा
  rationale: वाव + प्रथम पुरुष एकवचन पूर्ण रूप को उसके सीधे भूतकालीन, चिंतनात्मक अर्थ में रखा गया है; इसे बिना स्पष्ट व्याकरणिक आधार के शर्तसूचक ‘यदि मैं कहूँ’ नहीं बनाया गया।
- source_word: אַךְ
  choice: निश्चय ही
  rationale: यहाँ यह प्रतिबंध नहीं, बल्कि कथन पर बल और दृढ़ धारणा व्यक्त करता है।
- source_word: חֹשֶׁךְ
  choice: अँधेरा
  rationale: यह सामान्य, स्वाभाविक आधुनिक हिन्दी शब्द है और प्रसंग के प्रकाश-अंधकार विरोध को स्पष्ट रखता है।
- source_word: יְשׁוּפֵנִי
  choice: मुझे ढक लेगा
  rationale: दुर्लभ क्रिया का सटीक भाव विवादित है। अँधेरे को कर्ता मानते हुए ‘ढक लेना’ यहाँ की छवि और अगले पद के विरोध के अनुकूल है, जबकि वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित हैं।
- source_word: וְלַיְלָה
  choice: और ... रात
  rationale: सरल संयोजक और संज्ञा को रखते हुए दोनों पंक्तियों की समानांतर रचना सुरक्षित की गई है।
- source_word: אוֹר
  choice: उजाला होगी
  rationale: मूल खंड क्रियारहित है। हिन्दी में स्वाभाविक वाक्य के लिए भविष्यकालीन ‘होगी’ जोड़ा गया है, जो पहले खंड के भाव से मेल खाता है; वर्तमानकाल भी व्याकरणतः संभव है।
- source_word: בַּעֲדֵנִי
  choice: मेरे चारों ओर
  rationale: इस प्रसंग में स्थानिक घेराव का भाव सर्वाधिक स्वाभाविक है और रात द्वारा वक्ता को चारों ओर से घेरे जाने की छवि व्यक्त करता है।
