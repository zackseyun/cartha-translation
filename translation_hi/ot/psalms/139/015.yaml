  text: My frame was not hidden from you when I was made in secret[b][a], woven in the depths of the earth.
translation:
  language: hi
  text: 'मेरी देह की रचना तुझसे छिपी न थी,

    जब मैं गुप्त स्थान में बनाया गया,

    और पृथ्वी की गहराइयों में बुना गया[a]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “पृथ्वी के सबसे निचले भागों में।” यह गर्भ में होने वाली छिपी रचना का काव्यात्मक बिंब है।
    reason: lexical_alternative
lexical_decisions:
- source_word: נִכְחַד
  choice: छिपी न थी
  rationale: निफ़ाल रूप निष्क्रिय अर्थ देता है—दृष्टि या ज्ञान से छिपा होना। हिंदी में यह स्वाभाविक है और मूल निष्क्रिय भाव बनाए रखता है।
- source_word: עָצְמִי
  choice: मेरी देह की बनावट
  rationale: עֶצֶם का सामान्य अर्थ ‘हड्डी’ है, पर यहाँ काव्यात्मक संदर्भ में पूरी शारीरिक संरचना अभिप्रेत है। ‘देह की बनावट’ इस व्यापक अर्थ को स्पष्ट और सहज रूप से व्यक्त करती है।
- source_word: מִמֶּךָּ
  choice: तुझसे
  rationale: מן के साथ सर्वनाम का अर्थ ‘तुझसे’ है; ‘छिपी’ के साथ यही स्वाभाविक हिंदी प्रयोग है।
- source_word: אֲשֶׁר
  choice: जब…तब
  rationale: सम्बन्धवाचक अव्यय यहाँ निर्माण की परिस्थिति या समय बताता है। हिंदी में ‘जब…तब’ उस सम्बन्ध को स्पष्ट और काव्यात्मक ढंग से व्यक्त करता है।
- source_word: עֻשֵּׂיתִי
  choice: मैं…बनाया जा रहा था
  rationale: עשה के निष्क्रिय रूप का व्यापक अर्थ ‘बनाया गया’ है। अपूर्ण होती गर्भस्थ रचना के प्रसंग में ‘बनाया जा रहा था’ स्वाभाविक हिंदी है।
- source_word: בַסֵּתֶר
  choice: गुप्त स्थान में
  rationale: यह पद छिपे हुए या गोपनीय स्थान का बोध कराता है। ‘गुप्त स्थान में’ मूल के स्थानवाचक रूप को बनाए रखता है।
- source_word: רֻקַּמְתִּי
  choice: बुना जा रहा था
  rationale: רקם कढ़ाई अथवा जटिल बुनाई का चित्र प्रस्तुत करता है। ‘बुना’ सुबोध है और वस्त्र-शिल्प का रूपक सुरक्षित रखता है।
- source_word: בְּתַחְתִּיּוֹת אָרֶץ
  choice: पृथ्वी की गहराइयों में
  rationale: यह मूल काव्यात्मक बिंब को बनाए रखता है और इसे गर्भ का सपाट अर्थ बनाकर उसकी वास्तविक अस्पष्टता समाप्त नहीं करता।
theological_decisions:
- issue: ‘पृथ्वी की गहराइयों’ का आशय
  choice: मूल काव्यात्मक रूपक को मुख्य पाठ में सुरक्षित रखा गया
  alternative: इसे सीधे गर्भ के गुप्त निर्माण का उल्लेख मानकर ‘माँ के गर्भ में’ अनूदित करना, अथवा इसे शाब्दिक भूमिगत स्थान समझना
  rationale: सन्दर्भ गर्भपूर्व निर्माण की छिपी और रहस्यमय प्रकृति की ओर संकेत करता है, पर मूल वाक्यांश पृथ्वी की गहराइयों का बिंब ही देता है। इसलिए अनुवाद रूपक को बनाए रखता है और पादटिप्पणी वैकल्पिक शाब्दिक रूप बताती है।
translation_notes:
  register: आधुनिक मानक हिंदी; परमेश्वर के लिए काव्य और भजन की निकटता बनाए रखने हेतु एकवचन आत्मीय ‘तू/तुझसे’ रूप। पंक्ति-विन्यास ने दो समानांतर निष्क्रिय क्रियाओं और समापन में मुख्य कथन को उभारा है।
