  text: You know my sitting down and my rising up[b][a]; you understand my thought from afar.
translation:
  language: hi
  text: तू मेरे बैठने और उठने को जानता है; तू मेरे विचार[a] को दूर ही से[b] समझ लेता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘मेरे अभिप्राय’ अथवा ‘मेरे उद्देश्य’।
    reason: lexical_alternative
  - marker: b
    text: ‘दूर ही से’ स्थानगत दूरी की ओर संकेत कर सकता है, या इस बात की ओर कि परमेश्वर विचार के प्रकट होने से बहुत पहले ही उसे समझ लेता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יָדַעְתָּ
  choice: जानता है
  rationale: यह ידע का काल रूप होकर परमेश्वर के पूर्ण और निरंतर ज्ञान को व्यक्त करता है; हिन्दी में वर्तमानकालीन ‘जानता है’ इस स्थितिमूलक अर्थ को स्वाभाविक ढंग से रखता है।
- source_word: שִׁבְתִּי
  choice: मेरे बैठने
  rationale: यह भजनकार के बैठने की क्रिया या अवस्था को बताता है और अगले पदांश ‘उठने’ के साथ समानांतर जोड़ी बनाता है।
- source_word: וְקוּמִי
  choice: और उठने
  rationale: यह קום से बना रूप है और ‘बैठने’ के साथ मिलकर रोज़मर्रा की समस्त गतिविधियों की ओर संकेत करने वाली काव्यात्मक जोड़ी को सुरक्षित रखता है।
- source_word: בַּנְתָּה
  choice: समझ लेता है
  rationale: בין यहाँ केवल जानकारी होने से आगे, भीतर के विचार को भली-भाँति पहचानने या समझने का भाव देता है; यह पहले आए ‘जानता है’ से उचित भेद भी रखता है।
- source_word: לְרֵעִי
  choice: मेरे विचार
  rationale: संदर्भ में רֵעִי किसी विचार, अभिप्राय या उद्देश्य को व्यक्त कर सकता है। ‘विचार’ सबसे सीधा और स्वाभाविक विकल्प है, जबकि अन्य संभावनाएँ पादटिप्पणी में रखी गई हैं।
- source_word: מֵרָחוֹק
  choice: दूर ही से
  rationale: यह मूल की ‘दूर से’ वाली छवि को बनाए रखता है और स्थानगत दूरी तथा विचार के प्रकट होने से बहुत पहले उसे जान लेने—दोनों संभावनाओं को अनिर्णीत छोड़ता है।
theological_decisions:
- issue: इस पद में परमेश्वर के ज्ञान का विस्तार
  choice: पद को भजनकार के बाहरी कार्यों और भीतरी विचार के विषय में परमेश्वर के गहरे, पूर्ण व्यक्तिगत ज्ञान के वर्णन के रूप में रखा गया है, पर सर्वज्ञता का कोई दार्शनिक मॉडल निर्दिष्ट नहीं किया गया।
  alternative: इसे स्पष्ट रूप से केवल भविष्यज्ञान मानना, अथवा केवल स्थानगत दूरी तक सीमित करना।
  rationale: इब्रानी पाठ बाहरी क्रियाओं और भीतरी विचार—दोनों के बारे में परमेश्वर के ज्ञान को पुष्ट करता है, किंतु ‘दूर से’ का आशय स्थानगत या कालगत हो सकता है। अनुवाद और पादटिप्पणी इस काव्यात्मक तथा धर्मवैचारिक तनाव को सुरक्षित रखते हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और काव्यात्मक शैली रखी गई है। परमेश्वर के लिए ‘तू’ भजन की सीधी, निकट संबोधन-शैली और मूल के एकवचन को सुरक्षित रखता है। ‘बैठने और उठने’ की समानांतर संरचना जानबूझकर बनाए रखी गई है।
