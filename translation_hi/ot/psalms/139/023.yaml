  yaml_path: translation/ot/psalms/139/023.yaml
  text: Search me[a], God, and know my heart; test me and know my anxious thoughts.
translation:
  language: hi
  text: हे परमेश्वर, मुझे जाँच और मेरे हृदय को जान; मुझे परख और मेरे व्याकुल विचारों[a] को जान।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मेरी चिंताएँ” अथवा “मेरे बँटे हुए विचार।”
    reason: शब्द שַׂרְעַפָּי व्याकुल, चिंतित, या भीतर से विभाजित विचारों की अर्थछायाएँ व्यक्त कर सकता है।
lexical_decisions:
- source_word: חָקְרֵנִי
  choice: मुझे जाँच
  rationale: חקר गहराई से जाँचने या खोजकर जानने का भाव देता है। ‘मुझे जाँच’ हिंदी में प्रार्थनात्मक संबोधन के लिए स्वाभाविक है और गहन परीक्षण का रूपक बनाए रखता है।
- source_word: אֵל
  choice: हे परमेश्वर
  rationale: אֵל यहाँ सीधे संबोधन में प्रयुक्त सामान्य ईश्वरीय उपाधि है। ‘हे परमेश्वर’ आधुनिक हिंदी में स्पष्ट, गरिमापूर्ण और स्वाभाविक संबोधन है।
- source_word: וְדַע
  choice: और ... को जान
  rationale: ידע का आज्ञार्थक रूप परमेश्वर से पूर्ण रूप से जानने की विनती करता है। दोनों अर्धपंक्तियों में ‘जान’ की पुनरावृत्ति रखकर मूल की काव्यात्मक समानांतरता सुरक्षित की गई है।
- source_word: לְבָבִי
  choice: मेरे हृदय
  rationale: לֵבָב मनुष्य के भीतरी व्यक्तित्व—विचार, इच्छा और अभिप्राय—को सूचित कर सकता है। ‘हृदय’ हिंदी की काव्यात्मक और बाइबलीय भाषा में इस व्यापक अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: בְּחָנֵנִי
  choice: मुझे परख
  rationale: בחן मूल्य जाँचने या धातु कसौटी पर परखने जैसा भाव रखता है। ‘परख’ पहली क्रिया ‘जाँच’ से संबंध रखते हुए भी उसके मूल्यांकन वाले विशिष्ट अर्थ को बनाए रखती है।
- source_word: שַׂרְעַפָּי
  choice: मेरी चिंताओं
  rationale: שַׂרְעַפִּים बेचैन करनेवाले, उलझे हुए या बँटे हुए विचारों को सूचित कर सकता है। ‘चिंताओं’ संदर्भ में सहज और संक्षिप्त है; शब्द की वास्तविक अर्थगत व्यापकता पादटिप्पणी में रखी गई है।
theological_decisions:
- issue: मनुष्य के भीतरी जीवन की भाषा
  choice: ‘हृदय’ और ‘चिंताओं’—दोनों अलग अभिव्यक्तियाँ बनाए रखना
  alternative: दोनों को ‘मन’ या ‘विचार’ जैसे एक ही मनोवैज्ञानिक शब्द में समेट देना
  rationale: इब्रानी पाठ समानांतर पंक्तियों में भीतरी जीवन के लिए दो अलग शब्दों का प्रयोग करता है। दोनों को बनाए रखने से काव्यात्मक गहराई सुरक्षित रहती है और पाठ पर आधुनिक मनोवैज्ञानिक वर्गीकरण नहीं थोपा जाता।
- issue: שַׂרְעַפָּי की अर्थगत अनिश्चितता
  choice: मुख्य पाठ में ‘चिंताओं’ और पादटिप्पणी में वैकल्पिक अर्थ
  alternative: केवल ‘बँटे हुए विचारों’ या केवल ‘बेचैन विचारों’ को निर्णायक अर्थ मानना
  rationale: इस दुर्लभ काव्यात्मक शब्द में चिंता, बेचैनी और अंतर्मन के विभाजित या उलझे विचारों की अर्थछायाएँ संभव हैं। पादटिप्पणी इस वास्तविक अनिश्चितता को बिना कृत्रिम रूप से सुलझाए प्रस्तुत करती है।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी में संक्षिप्त, प्रार्थनात्मक और गरिमापूर्ण रखी गई है। ‘जाँच/परख’ और ‘जान/जान’ की समानांतरता मूल इब्रानी काव्य-संरचना को सुनाई देती है।
