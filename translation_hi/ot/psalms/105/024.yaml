base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/024.yaml
  text: And he made his people very fruitful[b][a], and made them mightier than their adversaries.
translation:
  language: hi
  text: उसने अपनी प्रजा को बहुत बढ़ाया[a] और उसे उसके विरोधियों से अधिक शक्तिशाली बनाया।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपनी प्रजा को बहुत फलवन्त किया।” हिब्रू क्रिया फलवन्त करने या संख्या बढ़ाने—दोनों भाव व्यक्त कर सकती है।
    reason: lexical_alternative
  - marker: b
    text: हिब्रू में शाब्दिक रूप से “उसे उसके विरोधियों से अधिक शक्तिशाली बनाया” है; एकवचन सर्वनाम सामूहिक संज्ञा “प्रजा” की ओर संकेत करते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּפֶר
  choice: फलवन्त किया
  rationale: हिफ़ील रूप का अर्थ ‘फलवन्त करना’ या ‘बहुत बढ़ाना’ है। ‘फलवन्त किया’ मूल की फलने-बढ़ने की छवि को बनाए रखता है और इस्राएल की जन-वृद्धि के प्रसंग में स्वाभाविक है।
- source_word: עַמּוֹ
  choice: अपनी प्रजा
  rationale: עַם यहाँ परमेश्वर से संबंधित सामूहिक जनसमुदाय को दर्शाता है। ‘अपनी प्रजा’ आधुनिक हिन्दी में इस संबंध और सामूहिक अर्थ को स्पष्ट तथा गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: מְאֹד
  choice: बहुत
  rationale: यह मात्रा या तीव्रता बताने वाला क्रियाविशेषण है; ‘बहुत’ इसका सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: וַיַּעֲצִמֵהוּ
  choice: उसे ... अधिक शक्तिशाली बनाया
  rationale: עצם के हिफ़ील रूप में बलवान या शक्तिशाली बनाने का भाव है। आगे आए מִן के साथ तुलनात्मक अर्थ को ‘से अधिक शक्तिशाली’ स्पष्ट करता है। एकवचन प्रत्यय को सामूहिक ‘प्रजा’ के अनुरूप ‘उसे’ रखा गया है।
- source_word: מִצָּרָיו
  choice: उसके विरोधियों से
  rationale: צַר शत्रु, विरोधी या सताने वाले को सूचित कर सकता है। ‘विरोधियों’ मूल की व्यापकता बनाए रखता है और मिस्री उत्पीड़कों तक अर्थ को अनावश्यक रूप से सीमित नहीं करता।
theological_decisions:
- issue: सामूहिक संज्ञा के साथ एकवचन सर्वनाम
  choice: हिब्रू के सामूहिक एकवचन को हिन्दी में ‘प्रजा—उसे—उसके’ के रूप में बनाए रखा गया।
  alternative: ‘लोगों—उन्हें—उनके’ के रूप में बहुवचन प्रयोग करना।
  rationale: हिब्रू में ‘उसकी प्रजा’ के बाद एकवचन प्रत्यय हैं। हिन्दी में ‘प्रजा’ के साथ एकवचन संदर्भ स्वाभाविक है, इसलिए मूल की व्याकरणिक सामूहिकता बिना अर्थ बदले सुरक्षित रहती है।
- issue: 'עצם का अर्थ: शक्ति या संख्या'
  choice: ‘अधिक शक्तिशाली बनाया’
  alternative: ‘अधिक बढ़ा दिया’ या ‘अधिक संख्या में कर दिया’
  rationale: क्रिया शक्ति और प्रबलता का अर्थ दे सकती है, जबकि पहली पंक्ति पहले ही जन-वृद्धि व्यक्त करती है। इसलिए दूसरी पंक्ति में शक्ति का भाव रखना समानांतर कथन की वास्तविक अर्थ-तनाव को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण काव्यात्मक गद्य अपनाया गया है। ‘फलवन्त’ बाइबिलीय छवि को सुरक्षित रखते हुए सामान्य पाठक के लिए बोधगम्य है; उसका अधिक सीधा विकल्प पादटिप्पणी में दिया गया है।
