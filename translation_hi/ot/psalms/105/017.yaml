  yaml_path: translation/ot/psalms/105/017.yaml
  text: He sent a man before them[a]; Joseph was sold as a servant.
translation:
  language: hi
  text: 'उसने उनके आगे[a] एक मनुष्य भेजा;

    यूसुफ दास के रूप में बेचा गया।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उनसे पहले।”
    reason: לִפְנֵיהֶם स्थानगत ‘उनके आगे’ और सापेक्ष/कालगत ‘उनसे पहले’—दोनों भाव ग्रहण कर सकता है।
lexical_decisions:
- source_word: שָׁלַח
  choice: भेजा
  rationale: यह שלח का क़ाल पूर्ण रूप है; प्रसंग से परमेश्वर कर्ता है। ‘भेजा’ इसका सहज और सीधा हिन्दी समतुल्य है।
- source_word: לִפְנֵיהֶם
  choice: उनके आगे
  rationale: इस पदबंध का मूल अर्थ ‘उनके सामने/आगे’ है और यहाँ यह यूसुफ को उनसे पहले आगे भेजे जाने का भाव देता है।
- source_word: אִישׁ
  choice: एक मनुष्य
  rationale: एकवचन पुल्लिंग संज्ञा का अर्थ सुरक्षित रखते हुए ‘एक मनुष्य’ आधुनिक हिन्दी में स्वाभाविक और गरिमापूर्ण है।
- source_word: לְעֶבֶד
  choice: दास बनाकर
  rationale: ל यहाँ परिणामी अवस्था का संकेत करता है। बेचे जाने के प्रसंग में बंधुआ अवस्था स्पष्ट है, इसलिए ‘सेवक’ की अपेक्षा ‘दास’ अधिक सटीक है।
- source_word: נִמְכַּר
  choice: बेच दिया गया
  rationale: מכר का निफ़अल पूर्ण रूप निष्क्रिय अर्थ देता है; ‘बेच दिया गया’ हिन्दी में इस घटना की निष्क्रियता और पूर्णता को स्वाभाविक रूप से व्यक्त करता है।
- source_word: יוֹסֵף
  choice: यूसुफ
  rationale: व्यक्तिवाचक नाम का प्रचलित हिन्दी बाइबलीय रूप।
theological_decisions:
- issue: यूसुफ की अवस्था के लिए עֶבֶד का अनुवाद
  choice: दास
  alternative: सेवक
  rationale: साथ का क्रियापद ‘बेच दिया गया’ बाध्य और स्वामित्वाधीन अवस्था को स्पष्ट करता है; इसलिए ‘दास’ प्रसंगानुकूल है और मूल की कठोरता को कम नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त काव्यात्मक पंक्ति-विन्यास रखा गया है। ‘मनुष्य’ औपचारिक किंतु सामान्य-पाठक के लिए सुबोध है; ‘दास बनाकर बेच दिया गया’ मूल में बिक्री और परिणामी दासत्व—दोनों को स्पष्ट रखता है।
