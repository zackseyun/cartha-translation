  text: עַד עֵ֥ת בֹּֽא דְבָר֑/וֹ אִמְרַ֖ת יְהוָ֣ה צְרָפָֽתְ/הוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/019.yaml
  text: Until the time his word came to pass[b][a], the word of Yahweh tested him.
translation:
  language: hi
  text: उसकी बात पूरी होने के समय तक,[a] यहोवा के वचन ने उसे परखा।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘उसकी बात’ संभवतः यूसुफ की कही हुई बात या भविष्यवाणी है, जो समय आने पर पूरी हुई; कुछ लोग इसे यूसुफ के विषय में परमेश्वर का वचन समझते हैं।
    reason: alternative_reading
  - marker: b
    text: ‘परखा’ के लिए प्रयुक्त इब्रानी क्रिया का शाब्दिक बिंब धातु को आग में तपाकर शुद्ध करने का है; इसलिए ‘उसे शुद्ध किया’ भी एक संभावित अनुवाद है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד עֵת
  choice: जब तक ... समय न आया
  rationale: यह पदबंध उस अवधि की सीमा बताता है जो एक निश्चित समय के आने तक चलती है; हिंदी में ‘जब तक ... न आया’ स्वाभाविक है।
- source_word: בֹּא
  choice: पूरी होने का ... आया
  rationale: मूल अर्थ ‘आना’ है, पर ‘बात’ के साथ संदर्भ में उसके घटित या पूरा होने का भाव है।
- source_word: דְבָרוֹ
  choice: उसकी बात
  rationale: ‘बात’ דָּבָר के ‘वचन/कथन/घटना’ संबंधी अर्थों को सहज हिंदी में रखती है। सर्वनाम का संकेत संदर्भतः यूसुफ की कही बात की ओर हो सकता है, पर यह पूर्णतः निश्चित नहीं है।
- source_word: אִמְרַת יְהוָה
  choice: यहोवा के वचन
  rationale: אִמְרָה को ‘वचन’ और परमेश्वर के व्यक्तिगत नाम יהוה को ‘यहोवा’ दिया गया है; इससे दोनों अर्धपंक्तियों के निकटार्थी शब्दों का कुछ भेद भी बना रहता है।
- source_word: צְרָפָתְהוּ
  choice: उसे परखा
  rationale: क्रिया का मूल बिंब धातु को तपाकर शुद्ध करने का है; रूपकतः इसका अर्थ परीक्षा या परख है। मुख्य पाठ में सहज अर्थ और टिप्पणी में धातु-शोधन का बिंब रखा गया है।
theological_decisions:
- issue: ‘उसकी बात’ का संदर्भ
  choice: मुख्य पाठ में अस्पष्ट सर्वनाम बनाए रखा गया; संदर्भतः यूसुफ की कही बात संभावित है।
  alternative: इसे यूसुफ के विषय में परमेश्वर का वचन समझा जा सकता है।
  rationale: इब्रानी प्रत्यय व्याकरणतः संदर्भ को निर्णायक रूप से नहीं ठहराता। इसलिए मुख्य पाठ तनाव को सुरक्षित रखता है और दोनों संभावनाएँ टिप्पणी में देता है।
- issue: परीक्षा करने वाला ‘यहोवा का वचन’
  choice: वचन को कर्ता रखते हुए ‘यहोवा के वचन ने उसे परखा’ अनूदित किया गया।
  alternative: इसे केवल यूसुफ की कठिन परिस्थितियों द्वारा शुद्ध किए जाने के रूप में विस्तार से समझाना।
  rationale: मूल पाठ स्पष्ट रूप से אִמְרַת יְהוָה को कर्ता बनाता है; व्याख्यात्मक विस्तार मुख्य पाठ में नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिंदी। ‘उसकी बात’ और ‘यहोवा के वचन’ द्वारा इब्रानी के दो निकटार्थी पदों का हल्का भेद रखा गया है। सभी टिप्पणियों के चिह्न मुख्य पाठ में उपस्थित हैं।
