  text: וַ/יַּ֣ךְ גַּ֭פְנָ/ם וּ/תְאֵנָתָ֑/ם וַ֝/יְשַׁבֵּ֗ר עֵ֣ץ גְּבוּלָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/033.yaml
  text: He struck their vines and their fig trees[a], and shattered the trees of their territory.
translation:
  language: hi
  text: उसने उनकी अंगूर की बेलों और अंजीर के पेड़ों को मारा, और उनके भूभाग के पेड़ों को तोड़ डाला[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, उनकी सीमाओं के भीतर के पेड़ों को।
    reason: गְּבוּלָם (‘उनका भूभाग/सीमा’) के संबंधवाचक अर्थ का वैकल्पिक, अधिक स्थानसूचक निरूपण।
lexical_decisions:
- source_word: וַיַּךְ
  choice: उसने ... को मारा
  rationale: नכה का सामान्य अर्थ प्रहार करना या मारना है। यहाँ ओलों द्वारा वनस्पति नष्ट किए जाने के संदर्भ में यह सीधा और स्वाभाविक हिन्दी प्रयोग है।
- source_word: גַּפְנָם
  choice: उनकी अंगूर की बेलों
  rationale: גֶּפֶן अंगूर की बेल को दर्शाता है; सामूहिक आशय को आधुनिक हिन्दी में बहुवचन से स्पष्ट किया गया है।
- source_word: וּתְאֵנָתָם
  choice: और अंजीर के पेड़ों
  rationale: תְּאֵנָה का अर्थ अंजीर का पेड़ है। एकवचन रूप यहाँ सामूहिक है, इसलिए हिन्दी में बहुवचन स्वाभाविक है।
- source_word: וַיְשַׁבֵּר
  choice: और ... तोड़ डाला
  rationale: שׁבר के पिएल रूप में जोरदार और विनाशकारी ढंग से तोड़ने का भाव है; ‘तोड़ डाला’ इसे सहज हिन्दी में व्यक्त करता है।
- source_word: עֵץ
  choice: पेड़ों
  rationale: עֵץ का अर्थ पेड़ या लकड़ी हो सकता है; यहाँ खड़ी वनस्पति के विनाश की बात है, इसलिए ‘पेड़ों’ उपयुक्त है।
- source_word: גְּבוּלָם
  choice: उनके क्षेत्र के
  rationale: גְּבוּל सीमा, भूभाग या क्षेत्र का बोध करा सकता है। ‘उनके क्षेत्र के’ मूल संबंध को बनाए रखते हुए स्वाभाविक हिन्दी देता है।
theological_decisions:
- issue: क्रियाओं का निहित कर्ता
  choice: ‘उसने’—संदर्भ में परमेश्वर
  alternative: कर्ता को स्पष्ट नाम ‘यहोवा’ से व्यक्त करना
  rationale: इब्रानी में कर्ता तीसरे पुरुष एकवचन क्रिया में निहित है और पूर्ववर्ती संदर्भ से परमेश्वर समझा जाता है। ‘उसने’ साहित्यिक प्रवाह और मूल की अप्रत्यक्षता दोनों बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। कृषि-संबंधी पदों को ठोस रूप में व्यक्त किया गया है और तीव्र पिएल क्रिया के लिए स्वाभाविक हिन्दी ‘तोड़ डाला’ चुना गया है।
