  text: שָׁאַ֣ל וַ/יָּבֵ֣א שְׂלָ֑ו וְ/לֶ֥חֶם שָׁ֝מַ֗יִם יַשְׂבִּיעֵֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/040.yaml
  text: They asked[a], and he brought quail[b]; he satisfied them with the bread of heaven.
translation:
  language: hi
  text: उन्होंने माँगा[a], और उसने बटेरें भेजीं; उसने उन्हें स्वर्ग की रोटी से तृप्त किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू में क्रिया एकवचन में है, शाब्दिक अर्थ ‘उसने माँगा’; सन्दर्भ में सम्भवतः इस्राएल के लोगों का सामूहिक रूप से माँगना अभिप्रेत है।
    reason: alternative_reading
lexical_decisions:
- source_word: שָׁאַל
  choice: उन्होंने माँगा
  rationale: हिब्रू रूप व्याकरणतः एकवचन है, पर सन्दर्भ में इस्राएल के लोगों का सामूहिक माँगना अभिप्रेत है। हिन्दी में आदरसूचक बहुवचन का भ्रम टालने के लिए पदटिप्पणी में शाब्दिक रूप सुरक्षित रखा गया है।
- source_word: וַיָּבֵא
  choice: और उसने ... भेजीं
  rationale: בוא के हिफ़ील रूप का अर्थ ‘आने देना/ले आना’ है। बटेरों के प्रसंग में ‘भेजीं’ स्वाभाविक हिन्दी है और परमेश्वर की कारक भूमिका व्यक्त करता है।
- source_word: שְׂלָו
  choice: बटेरें
  rationale: यह जंगल में परमेश्वर द्वारा उपलब्ध कराए गए पक्षी, अर्थात बटेर, को दर्शाता है।
- source_word: לֶחֶם שָׁמַיִם
  choice: स्वर्ग की रोटी
  rationale: यह संबंधवाचक पदबंध का निकट और काव्यात्मक अनुवाद है; ‘स्वर्ग से आई रोटी’ भी सम्भव अर्थ है।
- source_word: יַשְׂבִּיעֵם
  choice: उसने उन्हें ... तृप्त किया
  rationale: שׂבע के हिफ़ील रूप में भरपूर खिलाकर संतुष्ट करने का भाव है; ‘तृप्त किया’ इसे संक्षिप्त और गरिमापूर्ण ढंग से व्यक्त करता है।
theological_decisions:
- issue: आरम्भिक क्रिया שָׁאַל का कर्ता
  choice: सन्दर्भ के अनुसार इस्राएल के लोगों को सामूहिक कर्ता मानकर ‘उन्होंने माँगा’ किया गया है।
  alternative: रूप की दृष्टि से शाब्दिक अनुवाद ‘उसने माँगा’ है, जिसमें इस्राएल को सामूहिक एकवचन या किसी प्रतिनिधि व्यक्ति को कर्ता माना जा सकता है।
  rationale: भजन का प्रसंग जंगल में पूरे इस्राएल के लिए परमेश्वर के कार्यों का वर्णन करता है, और पद के अन्त में बहुवचन कर्म-प्रत्यय ‘उन्हें’ सामूहिक अर्थ का समर्थन करता है। फिर भी हिब्रू का वास्तविक एकवचन पदटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी; काव्यात्मक ‘स्वर्ग की रोटी’ को बनाए रखा गया है। परमेश्वर के लिए सामान्य एकवचन सर्वनाम प्रयुक्त है और किसी सम्प्रदाय-विशेष की व्याख्या नहीं जोड़ी गई।
