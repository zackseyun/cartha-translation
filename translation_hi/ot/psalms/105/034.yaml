translation:
  language: hi
  text: उसने कहा, और टिड्डियाँ आ गईं—अनगिनत फसल-भक्षक टिड्डियाँ।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “टिड्डियाँ आ गईं, और गिनती से परे फसल-भक्षक कीट।” इब्रानी शब्द יֶלֶק फसल नष्ट करने वाले किसी कीट को दर्शाता है, सम्भवतः टिड्डी की कोई अवस्था या जाति; कुछ पुराने अनुवादों में इसे “इल्ली” कहा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אָמַר
  choice: उसने कहा
  rationale: सामान्य क्रिया 'कहना' मूल अर्थ को सीधे रखती है; 'आज्ञा दी' मूल पाठ से अधिक प्रबल अर्थ जोड़ता। संदर्भ में कर्ता परमेश्वर है।
- source_word: וַיָּבֹא
  choice: आ गईं
  rationale: यह विपत्ति के आगमन को व्यक्त करता है और हिन्दी में सामूहिक बहुवचन 'टिड्डियाँ' के साथ स्वाभाविक है।
- source_word: אַרְבֶּה
  choice: टिड्डियाँ
  rationale: एकवचन रूप यहाँ सामूहिक अर्थ में प्रयुक्त है; हिन्दी बहुवचन विपत्ति के झुंड का भाव स्पष्ट करता है।
- source_word: יֶלֶק
  choice: भक्षक टिड्डियाँ
  rationale: यह फसल चट करने वाले कीट का नाम है, सम्भवतः टिड्डी की कोई अवस्था या जाति। 'भक्षक टिड्डियाँ' विनाशकारी गुण और टिड्डी-संदर्भ दोनों बनाए रखता है, पर अनिश्चित पहचान को पादटिप्पणी में स्पष्ट किया गया है।
- source_word: וְאֵין מִסְפָּר
  choice: अनगिनत
  rationale: इब्रानी मुहावरे 'जिनकी कोई गिनती नहीं' का संक्षिप्त, स्वाभाविक और काव्यात्मक हिन्दी रूप।
