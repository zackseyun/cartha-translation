lexical_decisions:
- source_word: לֵאמֹר
  choice: यह कहते हुए
  rationale: यह पिछले पद में उल्लिखित वाचा के कथन को आगे आने वाली प्रत्यक्ष उक्ति से जोड़ता है और इब्रानी क्रिया-रूप की संयोजक भूमिका बनाए रखता है।
- source_word: לְךָ
  choice: तुझे
  rationale: यह पुल्लिंग एकवचन संबोधन है; इसलिए प्रतिज्ञा के सीधे और व्यक्तिगत संबोधन को एकवचन में रखा गया है।
- source_word: אֶתֵּן
  choice: मैं ... दूँगा
  rationale: यहाँ अपूर्ण क्रिया-रूप भविष्य की प्रतिज्ञा व्यक्त करता है; ‘दूँगा’ उस आशय को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: אֶרֶץ כְּנָעַן
  choice: कनान देश
  rationale: यह भौगोलिक भूभाग को सूचित करने वाला स्वाभाविक और प्रचलित हिन्दी पद है।
- source_word: חֶבֶל
  choice: भाग
  rationale: मूल अर्थ ‘रस्सी/नापने की डोरी’ है, पर भूमि-विभाजन के प्रसंग में यह नापकर बाँटे गए हिस्से को सूचित करता है; ‘भाग’ उस संदर्भगत अर्थ को संक्षेप और सहजता से व्यक्त करता है।
- source_word: נַחֲלַתְכֶם
  choice: तुम लोगों की विरासत
  rationale: बहुवचन प्रत्यय को स्पष्ट रूप से बहुवचन रखकर, एकवचन ‘तुझे’ से होने वाले इब्रानी के जानबूझकर असामंजस्य को सुरक्षित रखा गया है। ‘विरासत’ पैतृक अथवा वाचा में मिले स्थायी हिस्से का भाव बनाए रखती है।
theological_decisions:
- issue: प्रतिज्ञा में एकवचन संबोधन से बहुवचन अधिकारसूचक रूप की ओर परिवर्तन
  choice: ‘तुझे’ और ‘तुम लोगों की विरासत’ के द्वारा संख्या-परिवर्तन को बनाए रखना
  alternative: ‘तुझे ... तेरी विरासत’ अथवा ‘तुझे ... तेरे वंशजों की विरासत’
  rationale: इब्रानी पाठ पहले एक व्यक्ति को संबोधित करता है और फिर बहुवचन अधिकारसूचक रूप अपनाता है। इसे एक ही वचन में समतल करना या ‘वंशजों’ को मुख्य पाठ में जोड़ना पाठ की वास्तविक अस्पष्टता और प्रतिनिधिक तनाव को अनावश्यक रूप से सुलझा देता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी। ‘तुझे’ प्रत्यक्ष एकवचन संबोधन को स्वाभाविक रखता है, जबकि ‘तुम लोगों की’ मूल पाठ के बहुवचन को स्पष्ट करता है। डैश अंतिम पदबंध को कनान देश की समानाधिकरणात्मक व्याख्या के रूप में प्रस्तुत करता है, बिना ‘के रूप में’ जैसा अतिरिक्त संबंध जोड़े।
