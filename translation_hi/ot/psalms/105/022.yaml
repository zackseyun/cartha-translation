lexical_decisions:
- source_word: לֶאְסֹר
  choice: बाँधे
  rationale: אָסַר का मूल अर्थ बाँधना या रोककर रखना है। यहाँ उद्देश्य/परिणाम व्यक्त करने के लिए ‘बाँधे’ सीधा और पर्याप्त व्यापक है।
- source_word: שָׂרָיו
  choice: उसके प्रधानों
  rationale: שַׂר राजदरबार के प्रधान, शासक या उच्च अधिकारी को दर्शा सकता है। ‘प्रधान’ दरबारी पद और अधिकार, दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בְּנַפְשׁוֹ
  choice: उसकी इच्छा के अनुसार
  rationale: शाब्दिक अर्थ ‘उसके प्राण/मन के द्वारा’ है; यहाँ נֶפֶשׁ इच्छा या अभिलाषा का बोध देता है। ‘उसकी इच्छा के अनुसार’ मुहावरे का सहज अर्थ देता है और सर्वनाम के संभावित संदर्भ को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: וּזְקֵנָיו
  choice: और उसके पुरनियों को
  rationale: זָקֵן आयु में बड़े व्यक्ति तथा शासन में वरिष्ठ अगुवे, दोनों को दर्शा सकता है। ‘पुरनिये’ बाइबिलीय गरिमा के साथ आयु और पद के दोनों अर्थ बनाए रखता है।
- source_word: יְחַכֵּם
  choice: बुद्धि सिखाए
  rationale: חכם का पिएल रूप ‘बुद्धिमान बनाना’ या ‘बुद्धि सिखाना’ हो सकता है। ‘बुद्धि सिखाए’ यहाँ शिक्षण के भाव को स्पष्ट रखते हुए कारक अर्थ को व्यक्त करता है।
