    reason: lexical_alternative
lexical_decisions:
- source_word: הִתְהַלְלוּ
  choice: गर्व करो
  rationale: हित्पएल बहुवचन आज्ञार्थक यहाँ किसी में अपना गौरव मानने या उस पर गर्व करने का भाव रखता है। ‘गर्व करो’ इस भाव को सीधे और स्वाभाविक ढंग से व्यक्त करता है; वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: בְּשֵׁם קָדְשׁוֹ
  choice: उसके पवित्र नाम पर
  rationale: בְּ का संबंध यहाँ गर्व या गौरव के आधार/विषय से है, जिसे हिन्दी में ‘नाम पर’ स्वाभाविक रूप से व्यक्त करता है। ‘पवित्र नाम’ मूल पदबंध को स्पष्ट रखता है।
- source_word: יִשְׂמַח
  choice: आनन्दित हो
  rationale: रूपतः अपूर्ण क्रिया होते हुए भी काव्यात्मक समानांतरता में यह इच्छा अथवा प्रोत्साहन का भाव देती है; हिन्दी विधिलिंग ‘हो’ उस खुले भाव को सुरक्षित रखता है।
- source_word: לֵב
  choice: हृदय
  rationale: मूल का एकवचन सामूहिक अर्थ में है। ‘हृदय’ को एकवचन रखने से इब्रानी काव्यात्मक अभिव्यक्ति बनी रहती है और यह खोजनेवालों के भीतरी मन को दर्शाता है।
- source_word: מְבַקְשֵׁי יְהוָה
  choice: यहोवा को खोजनेवालों
  rationale: कृदन्तीय रचना ऐसे लोगों को दर्शाती है जिनकी विशेषता यहोवा को लगातार खोजना है। ‘खोजनेवालों’ आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चार-अक्षरीय व्यक्तिगत ईश्वरीय नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित नामरूप ‘यहोवा’ से व्यक्त किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: पाठ में व्यक्तिगत ईश्वरीय नाम सीधे आया है। हिन्दी पाठकों के लिए व्यापक रूप से पहचाना जाने वाला ‘यहोवा’ नाम को उपाधि में बदले बिना सुरक्षित रखता है; ‘याहवे’ अधिक निकट लिप्यंतरण का विकल्प है।
- issue: לֵב का सामूहिक एकवचन
  choice: हृदय
  alternative: हृदय आनन्दित हों / मन आनन्दित हों
  rationale: मूल पाठ बहुवचन खोजनेवालों के साथ ‘हृदय’ को एकवचन में रखता है। इसे बनाए रखने से सामूहिक और काव्यात्मक तनाव अनावश्यक रूप से हल नहीं होता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और भजनात्मक रखी गई है। ‘आनन्दित’ तथा ‘हृदय’ उपासना-संदर्भ के अनुकूल हैं, जबकि वाक्यरचना सामान्य हिन्दी पाठक के लिए सहज है।
