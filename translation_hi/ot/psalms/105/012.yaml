    reason: lexical_alternative
lexical_decisions:
- source_word: בִּהְיוֹתָם
  choice: जब वे ... थे
  rationale: בְּ के साथ היה का इनफिनिटिव कन्स्ट्रक्ट और तृतीय पुरुष बहुवचन प्रत्यय एक कालवाचक उपवाक्य बनाता है; आधुनिक हिन्दी में ‘जब वे ... थे’ स्वाभाविक और सटीक है।
- source_word: מְתֵי מִסְפָּר
  choice: गिनती में थोड़े
  rationale: यह इब्रानी मुहावरा ऐसी छोटी संख्या को दर्शाता है जिसे आसानी से गिना जा सके; ‘गिनती में थोड़े’ अर्थ और मुहावरे दोनों को बनाए रखता है।
- source_word: כִּמְעַט
  choice: बहुत ही थोड़े
  rationale: यहाँ यह पद पहले कही गई अल्प संख्या पर बल देता है; ‘बहुत ही थोड़े’ उस तीव्रता को सहज हिन्दी में व्यक्त करता है।
- source_word: וְגָרִים
  choice: और ... परदेशी बनकर रहते थे
  rationale: גור किसी ऐसी भूमि में विदेशी अथवा अस्थायी निवासी के रूप में रहने को दर्शाता है जो अपनी नहीं है; ‘परदेशी बनकर रहते थे’ केवल अपरिचित होने के बजाय निवास की इस स्थिति को स्पष्ट करता है।
- source_word: בָּהּ
  choice: उसमें
  rationale: स्त्रीलिंग एकवचन प्रत्यय प्रसंग में भूमि की ओर संकेत करता है; ‘उसमें’ मूल की सर्वनामिक संक्षिप्तता को बनाए रखता है।
