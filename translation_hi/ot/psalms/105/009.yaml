    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  choice: जो
  rationale: यह संबंधवाचक शब्द पिछले पद में आई ‘वाचा’ से इस पद को जोड़ता है; हिन्दी में ‘जो’ इस संबंध को स्वाभाविक रूप से बनाए रखता है।
- source_word: כָּרַת
  choice: बाँधी
  rationale: मूल इब्रानी मुहावरे का शाब्दिक अर्थ ‘काटी’ है, पर वाचा के संदर्भ में इसका अर्थ वाचा बाँधना या स्थापित करना है। ‘बाँधी’ हिन्दी में स्वाभाविक है और पिछले पद की ‘वाचा’ को निहित कर्म के रूप में बनाए रखता है।
- source_word: אֶת אַבְרָהָם
  choice: अब्राहम के साथ
  rationale: यद्यपि אֶת सामान्यतः कर्म-सूचक चिह्न है, वाचा बाँधने के हिन्दी मुहावरे में संबंधित व्यक्ति को ‘के साथ’ कहना अर्थ को स्पष्ट और स्वाभाविक बनाता है।
- source_word: וּשְׁבוּעָתוֹ
  choice: और … अपनी शपथ
  rationale: שְׁבוּעָה का अर्थ ‘शपथ’ है और तृतीय पुरुष एकवचन प्रत्यय को कर्ता-संदर्भित हिन्दी में ‘अपनी’ से स्वाभाविक रूप से व्यक्त किया गया है।
- source_word: לְיִשְׂחָק
  choice: इसहाक से
  rationale: לְ यहाँ उस व्यक्ति को सूचित करता है जिसके प्रति शपथ खाई गई। हिन्दी में ‘किसी से शपथ खाना’ स्वाभाविक अभिव्यक्ति है।
theological_decisions:
- issue: पिछले पद से ग्रहण की गई निहित ‘वाचा’
  choice: ‘जो उसने अब्राहम के साथ बाँधी’—‘वाचा’ को दोहराए बिना पिछले पद से ग्रहण किया गया है।
  alternative: ‘वह वाचा जो उसने अब्राहम के साथ बाँधी’
  rationale: इब्रानी पाठ इस पद में ‘वाचा’ शब्द दोहराता नहीं, बल्कि पिछले पद के शब्द को संबंधवाचक אֲשֶׁר द्वारा आगे बढ़ाता है। हिन्दी अनुवाद उसी संरचना और काव्यात्मक निरंतरता को सुरक्षित रखता है।
- issue: इसहाक के प्रति शपथ की अभिव्यक्ति
  choice: ‘इसहाक से खाई अपनी शपथ’
  alternative: ‘इसहाक के लिए अपनी शपथ’
  rationale: ‘से खाई’ शपथ के संबोधित व्यक्ति को स्पष्ट करता है, जबकि ‘के लिए’ लाभार्थी का अर्थ दे सकता है। यह चयन किसी अतिरिक्त धर्मवैज्ञानिक निष्कर्ष को जोड़े बिना संबंध को व्यक्त करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। पद को पिछले पद से जुड़ा हुआ काव्यात्मक वाक्यांश बनाए रखा गया है; विराम-चिह्न भी इसके आगे जारी रहने का संकेत देता है।
