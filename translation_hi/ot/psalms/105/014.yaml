  text: He allowed no man to oppress them[a]; he rebuked kings on their account,
translation:
  language: hi
  text: 'उसने किसी को उन पर अत्याचार करने नहीं दिया;

    उसने उनके कारण राजाओं को डाँटा।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנִּיחַ
  choice: नहीं दिया
  rationale: हिफ़ील रूप यहाँ किसी कार्य की अनुमति न देने का भाव व्यक्त करता है; ‘करने नहीं दिया’ स्वाभाविक आधुनिक हिन्दी है।
- source_word: אָדָם
  choice: किसी को
  rationale: एकवचन संज्ञा यहाँ सामान्य अर्थ में किसी भी व्यक्ति को सूचित करती है; हिन्दी में ‘किसी को’ इस प्रतिनिधिक अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: לְעָשְׁקָם
  choice: उन पर अत्याचार करने
  rationale: עשק उत्पीड़न, शोषण या अन्यायपूर्ण व्यवहार का व्यापक भाव रखता है; ‘अत्याचार करना’ इस प्रसंग में स्पष्ट और गरिमापूर्ण है।
- source_word: וַיּוֹכַח
  choice: डाँटा
  rationale: יכח यहाँ राजाओं के विरुद्ध कड़ी फटकार या भर्त्सना को दर्शाता है; ‘डाँटा’ सामान्य पाठक के लिए सहज और पर्याप्त रूप से सशक्त है।
- source_word: עֲלֵיהֶם
  choice: उनके कारण
  rationale: על के साथ सर्वनामिक प्रत्यय यहाँ उन लोगों के कारण अथवा उनके पक्ष में की गई कार्रवाई बताता है; ‘उनके कारण’ मूल की संबंधात्मक अस्पष्टता को बनाए रखता है।
- source_word: מְלָכִים
  choice: राजाओं
  rationale: यह संज्ञा सीधे राजाओं को सूचित करती है; व्यापक ‘शासकों’ की आवश्यकता नहीं है।
