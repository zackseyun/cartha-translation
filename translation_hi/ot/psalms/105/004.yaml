  text: Seek Yahweh and his strength[a]; seek his face continually.
translation:
  language: hi
  text: याहवे और उसके सामर्थ्य की खोज करो; उसके मुख की निरन्तर खोज करते रहो।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा, “उसकी उपस्थिति की निरन्तर खोज करते रहो।” इब्रानी में शाब्दिक रूप से, “उसके मुख की निरन्तर खोज करो” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּרְשׁוּ
  choice: खोज करो
  rationale: बहुवचन आज्ञार्थक रूप उपासना के संदर्भ में केवल पूछताछ नहीं, बल्कि मन लगाकर परमेश्वर की ओर मुड़ने और उसे खोजने का भाव देता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: וְעֻזּוֹ
  choice: और उसके सामर्थ्य की
  rationale: עֹז शक्ति, बल या सामर्थ्य को दर्शाता है। यहाँ 'सामर्थ्य' गरिमापूर्ण और स्वाभाविक है तथा संबंधसूचक प्रत्यय को 'उसके' से बनाए रखता है।
- source_word: בַּקְּשׁוּ
  choice: खोज ... करते रहो
  rationale: यह बहुवचन आज्ञार्थक सक्रिय और सतत खोज का भाव रखता है। हिन्दी में 'करते रहो' תָּמִיד के निरन्तर आग्रह को स्वाभाविक रूप देता है।
- source_word: פָנָיו
  choice: उसके मुख की
  rationale: शाब्दिक चित्र 'उसका मुख' सुरक्षित रखा गया है; यह परमेश्वर की उपस्थिति का संकेत हो सकता है, पर मुख्य पाठ में उस रूपक को स्पष्ट करके सीमित नहीं किया गया।
- source_word: תָּמִיד
  choice: निरन्तर
  rationale: यह नियमित, लगातार बने रहने वाली क्रिया का बोध देता है; 'निरन्तर करते रहो' आधुनिक हिन्दी में स्वाभाविक आग्रह है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा
  rationale: मूल पाठ व्यक्तिगत ईश्वरीय नाम का प्रयोग करता है। 'याहवे' उसे उपाधि से प्रतिस्थापित किए बिना प्रस्तुत करता है।
- issue: פָנָיו को चित्रात्मक या अर्थ-स्पष्ट रूप में प्रस्तुत करना
  choice: उसके मुख की
  alternative: उसकी उपस्थिति की
  rationale: इब्रानी मुहावरा उपस्थिति का अर्थ दे सकता है, पर 'मुख' संबंधपरक और काव्यात्मक चित्र को बनाए रखता है। सम्भावित अर्थ फुटनोट में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का संक्षिप्त, काव्यात्मक और गरिमापूर्ण आज्ञार्थक प्रयोग किया गया है। समानान्तर इब्रानी क्रियाओं के लिए 'खोज' दोहराकर पद की काव्यात्मक संरचना बनाए रखी गई है।
