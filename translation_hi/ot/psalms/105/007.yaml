  yaml_path: translation/ot/psalms/105/007.yaml
  text: He is Yahweh our God[b][a]; his judgments are in all the earth.
translation:
  language: hi
  text: वही याहवे[a] हमारा परमेश्वर है; उसके न्याय सारी पृथ्वी पर हैं।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी: יהוה (YHWH); ‘यहोवा’ भी।'
    reason: alternative_reading
  - marker: b
    text: ‘उसके विधान’ या ‘उसके न्यायिक निर्णय’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הוּא
  choice: वही ... है
  rationale: स्वतंत्र सर्वनाम הוּא पर बल है; हिंदी में ‘वही’ इस बल को स्वाभाविक ढंग से व्यक्त करता है, और निहित योजक क्रिया को ‘है’ से स्पष्ट किया गया है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ में प्रयुक्त परमेश्वर के व्यक्तिगत नाम יהוה को किसी उपाधि से बदलने के बजाय हिंदी में प्रचलित लिप्यंतरण ‘यहोवा’ से रखा गया है।
- source_word: אֱלֹהֵינוּ
  choice: हमारा परमेश्वर
  rationale: प्रथम पुरुष बहुवचन प्रत्यय सहित इस रूप का सीधा अर्थ ‘हमारा परमेश्वर’ है।
- source_word: בְּכָל הָאָרֶץ
  choice: सारी पृथ्वी पर
  rationale: यह पदबंध यहाँ व्यापक, सार्वभौमिक क्षेत्र सूचित करता है; इसलिए ‘देश’ के बजाय ‘सारी पृथ्वी पर’ उपयुक्त है।
- source_word: מִשְׁפָּטָיו
  choice: उसके न्याय
  rationale: מִשְׁפָּטָיו न्यायिक निर्णयों, विधानों अथवा न्याय को सूचित कर सकता है। ‘उसके न्याय’ मूल की व्यापकता और संक्षिप्तता बनाए रखता है; विकल्प पादटिप्पणी में दिए गए हैं।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल में चतुरक्षरीय व्यक्तिगत नाम सीधे आया है। उसे उपाधि ‘प्रभु’ से बदलने के बजाय हिंदी पाठकों के लिए परिचित रूप ‘यहोवा’ में प्रस्तुत किया गया है; ‘याहवे’ वैकल्पिक लिप्यंतरण के रूप में पादटिप्पणी में है।
- issue: מִשְׁפָּטָיו का अर्थ-क्षेत्र
  choice: उसके न्याय
  alternative: उसके विधान; उसके न्यायिक निर्णय
  rationale: संदर्भ यह निश्चित नहीं करता कि आशय केवल लिखित विधानों, दिए गए निर्णयों या व्यापक दैवी न्याय से है; अतः मुख्य पाठ में व्यापक शब्द रखा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी का सहज, गरिमापूर्ण और सामूहिक पाठ के योग्य रूप। ‘वही’ से मूल सर्वनाम का बल सुरक्षित रखा गया है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
