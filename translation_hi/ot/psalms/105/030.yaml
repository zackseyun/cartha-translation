  yaml_path: translation/ot/psalms/105/030.yaml
  text: Their land swarmed with frogs[a], even in the chambers of their kings.
translation:
  language: hi
  text: 'उनके देश में मेंढक उमड़ पड़े,

    उनके राजाओं[a] के कक्षों में भी।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में यहाँ बहुवचन ‘उनके राजाओं’ है; निर्गमन की विपत्ति के वृत्तांत में सामान्यतः एकवचन ‘राजा’ आता है। यहाँ बहुवचन संभवतः काव्यात्मक या सामूहिक प्रयोग है।
    reason: मूल पाठ के बहुवचन को स्पष्ट करना और निर्गमन-वृत्तांत के एकवचन से उसके अंतर को बताना।
lexical_decisions:
- source_word: שָׁרַץ
  choice: उमड़ पड़े
  rationale: यह क्रिया बड़ी संख्या में फैल जाने या भर जाने का भाव देती है। हिंदी में मेंढकों को व्याकरणिक कर्ता बनाकर ‘उमड़ पड़े’ कहना स्वाभाविक और चित्रात्मक है।
- source_word: אַרְצָם
  choice: उनके देश में
  rationale: तीसरे पुरुष बहुवचन प्रत्यय सहित संज्ञा का सीधा अर्थ ‘उनका देश’ है; हिंदी वाक्य-विन्यास के अनुसार स्थानवाचक रूप ‘उनके देश में’ रखा गया है।
- source_word: צְפַרְדְּעִים
  choice: मेंढक
  rationale: यह इस संज्ञा का मानक और संदर्भानुकूल हिंदी अर्थ है।
- source_word: בְּחַדְרֵי
  choice: के कक्षों में
  rationale: בְּ स्थान को और חַדְרֵי भीतरी कमरों या कक्षों को दर्शाता है। ‘कक्ष’ भजन की गरिमामय शैली बनाए रखते हुए आधुनिक पाठक के लिए बोधगम्य है।
- source_word: מַלְכֵיהֶם
  choice: उनके राजाओं
  rationale: इब्रानी रूप स्पष्टतः बहुवचन है और उसके साथ तीसरे पुरुष बहुवचन संबंधसूचक प्रत्यय है। इसलिए निर्गमन-वृत्तांत के एकवचन से सामंजस्य बैठाने के बजाय बहुवचन सुरक्षित रखा गया है।
theological_decisions:
- issue: מַלְכֵיהֶם का बहुवचन
  choice: उनके राजाओं
  alternative: उनके राजा
  rationale: मूल इब्रानी पाठ बहुवचन है। यह काव्यात्मक या सामूहिक प्रयोग हो सकता है, पर अनुवाद में उसे चुपचाप एकवचन नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिंदी में संक्षिप्त, काव्यात्मक और गरिमामय शैली रखी गई है। मूल इब्रानी में ‘देश’ व्याकरणिक कर्ता है, पर स्वाभाविक हिंदी के लिए ‘मेंढक’ को कर्ता बनाकर वही अर्थ व्यक्त किया गया है।
