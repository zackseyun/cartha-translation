base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/026.yaml
  text: He sent Moses his servant[a], Aaron whom he had chosen.
translation:
  language: hi
  text: उसने अपने सेवक मूसा को और हारून को, जिसे उसने चुना था[a], भेजा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “चुना।”
    reason: इब्रानी क्रिया का अनुवाद साधारण भूतकाल में भी किया जा सकता है; “चुना था” यह स्पष्ट करता है कि हारून का चुना जाना उसके भेजे जाने से पहले हुआ था।
lexical_decisions:
- source_word: שָׁלַח
  choice: उसने ... भेजा
  rationale: काल पूर्ण, तृतीय पुरुष एकवचन है। कर्ता निकटवर्ती प्रसंग से परमेश्वर है; हिंदी में अंतर्निहित कर्ता को स्वाभाविक सर्वनाम ‘उसने’ से व्यक्त किया गया है।
- source_word: מֹשֶׁה
  choice: मूसा
  rationale: व्यक्तिवाचक नाम का मानक हिंदी बाइबलीय रूप।
- source_word: עַבְדּוֹ
  choice: अपने सेवक
  rationale: עֶבֶד के साथ तृतीय पुरुष एकवचन संबंधसूचक प्रत्यय है। मूसा के लिए इस आदरसूचक और परमेश्वर-सेवा के संदर्भ में ‘सेवक’ स्वाभाविक है; हिंदी में समान कर्ता की ओर लौटने के कारण ‘अपने’ उपयुक्त है।
- source_word: אַהֲרֹן
  choice: हारून
  rationale: व्यक्तिवाचक नाम का मानक हिंदी बाइबलीय रूप।
- source_word: אֲשֶׁר
  choice: जिसे
  rationale: यह संबंधवाचक अव्यय हारून से संबंधित उपवाक्य आरंभ करता है; व्यक्ति के कर्म के लिए ‘जिसे’ स्वाभाविक हिंदी रूप है।
- source_word: בָּחַר בּוֹ
  choice: जिसे उसने चुना था
  rationale: בחר के साथ ב किसी व्यक्ति को चुनने का भाव देता है और प्रत्यय हारून की ओर संकेत करता है। ‘चुना था’ भेजे जाने से पहले हुए चुनाव को सहज रूप से व्यक्त करता है; साधारण भूतकाल भी संभव है।
theological_decisions:
- issue: मुख्य क्रिया का अंतर्निहित कर्ता
  choice: ‘उसने’—अर्थात प्रसंगानुसार परमेश्वर
  alternative: ‘यहोवा ने’ या ‘परमेश्वर ने’ स्पष्ट रूप से जोड़ना
  rationale: इब्रानी पद में कर्ता संज्ञा के रूप में दोहराया नहीं गया है; वह आसपास के प्रसंग से समझा जाता है। सर्वनाम मूल पाठ के प्रवाह और अनिर्दिष्टता को बनाए रखता है।
- issue: हारून के चुनाव और भेजे जाने का काल-संबंध
  choice: ‘चुना था’
  alternative: ‘चुना’
  rationale: पूर्वपूर्ण रूप हिंदी में यह स्पष्ट करता है कि चुनाव भेजे जाने से पहले हुआ, पर इब्रानी पूर्ण क्रिया स्वयं साधारण भूतकाल के रूप में भी समझी जा सकती है; इसलिए विकल्प पाद-टिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। डैश से हारून से जुड़े संबंधवाचक उपवाक्य की सीमा स्पष्ट होती है और मूल पद की एक ही मुख्य क्रिया दोनों व्यक्तियों पर लागू रहती है।
