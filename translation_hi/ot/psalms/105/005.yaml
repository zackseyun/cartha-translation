    text: या ‘उसके सुनाए हुए निर्णयों’ अथवा ‘उसके मुँह से निकली विधियों’।
    reason: lexical_alternative
lexical_decisions:
- source_word: זִכְרוּ
  choice: स्मरण करो
  rationale: बहुवचन आज्ञार्थक क्रिया है, जो श्रोताओं को परमेश्वर के कार्यों को सक्रिय रूप से याद करने के लिए बुलाती है। ‘स्मरण करो’ स्वाभाविक, गरिमापूर्ण और सीधा है।
- source_word: נִפְלְאוֹתָיו אֲשֶׁר עָשָׂה
  choice: उसके किए हुए अद्भुत कामों
  rationale: यह पदबंध विस्मय उत्पन्न करने वाले असाधारण कार्यों को दर्शाता है। हिंदी में विशेषण और संबंधवाचक उपवाक्य को साथ रखकर अर्थ स्पष्ट और स्वाभाविक बनाया गया है।
- source_word: מֹפְתָיו
  choice: उसके चिह्नों
  rationale: यह शब्द ऐसे संकेतों या अद्भुत घटनाओं को दर्शा सकता है जो परमेश्वर के कार्य की गवाही देते हैं। ‘चिह्न’ व्यापक अर्थ और काव्यात्मक समानांतरता को बनाए रखता है।
- source_word: וּמִשְׁפְּטֵי פִיו
  choice: और उसके मुँह के न्याय-वचनों
  rationale: ‘न्याय-वचन’ न्यायिक निर्णयों या घोषित विधानों की संभावित अर्थ-सीमा को खुला रखता है, जबकि ‘उसके मुँह के’ मूल इब्रानी की सजीव काव्यात्मक छवि को सुरक्षित रखता है।
theological_decisions:
- issue: נִפְלְאוֹת और מֹפְתִים में परमेश्वर के कार्यों का स्वरूप
  choice: 'दो अलग लेकिन परस्पर आच्छादित पद: ‘अद्भुत काम’ और ‘चिह्न’'
  alternative: ‘आश्चर्यकर्म’ और ‘चमत्कार’; अथवा ‘अद्भुत कार्य’ और ‘अलौकिक संकेत’
  rationale: पद परमेश्वर के सामर्थी कार्यों के लिए समानांतर शब्दों का संचय करता है, पर उनके बीच कठोर पारिभाषिक भेद नहीं बनाता। अलग हिंदी शब्द काव्यात्मक समानांतरता को बनाए रखते हैं।
- issue: מִשְׁפְּטֵי פִיו का अर्थ
  choice: मूल छवि को बनाए रखते हुए ‘उसके मुँह के न्याय-वचन’
  alternative: ‘उसके सुनाए हुए निर्णय’; अथवा ‘उसके मुँह से निकली विधियाँ’
  rationale: संदर्भ परमेश्वर के न्यायिक निर्णयों, आदेशों या विधानों की ओर संकेत कर सकता है। चुना गया रूप अर्थ को किसी एक व्याख्या तक सीमित किए बिना मूल की मुख-संबंधी छवि सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी का सहज किंतु गरिमापूर्ण काव्यात्मक रूप। ‘न्याय-वचन’ सामान्य पाठक के लिए बोधगम्य रहते हुए מִשְׁפָּט की न्याय, निर्णय और विधान संबंधी अर्थ-व्याप्ति तथा ‘उसके मुँह के’ मूल छवि को बनाए रखता है।
