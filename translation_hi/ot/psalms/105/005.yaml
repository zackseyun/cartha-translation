  naturalness: ‘उसके मुँह के न्याय-वचनों’ is awkward in modern standard Hindi. Recasting the construct idiom as ‘उसके मुँह से निकले न्याय-निर्णयों’ is readable while retaining the Hebrew mouth imagery and the sense of pronouncements.
  terminology: ‘अद्भुत कार्यों’ and ‘संकेतों’ are clear, suitably distinct equivalents for נִפְלְאוֹתָיו and מֹפְתָיו. ‘न्याय-निर्णयों’ retains the judicial sense without forcing the alternative sense ‘विधियाँ’; that alternative remains appropriately footnoted.
