source:
  edition: WLC
  text: וַ/יִּקְרָ֣א רָ֭עָב עַל הָ/אָ֑רֶץ כָּֽל מַטֵּה לֶ֥חֶם שָׁבָֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/016.yaml
  text: He called for famine on the land[a]; he broke every staff of bread.
translation:
  language: hi
  text: उसने देश पर अकाल बुलाया; उसने अन्न का हर सहारा तोड़ दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: बुलाया
  rationale: קרא का मूल अर्थ ‘बुलाना’ है; अकाल को कर्म मानकर यह प्रयोग उसे आने की आज्ञा देने या ले आने का भाव व्यक्त करता है और ईश्वरीय सक्रियता बनाए रखता है।
- source_word: רָעָב
  choice: अकाल
  rationale: यहाँ व्यापक खाद्य-संकट का संदर्भ है, इसलिए सामान्य ‘भूख’ की अपेक्षा ‘अकाल’ अधिक सटीक है।
- source_word: עַל הָאָרֶץ
  choice: देश पर
  rationale: संदर्भ किसी विशिष्ट भूभाग का है; ‘पृथ्वी पर’ अनावश्यक रूप से वैश्विक लगेगा, जबकि ‘देश पर’ स्वाभाविक और प्रसंगानुकूल है।
- source_word: כָּל מַטֵּה לֶחֶם
  choice: अन्न का हर सहारा
  rationale: शाब्दिक रूप ‘रोटी की हर लाठी’ हिंदी में अस्पष्ट और अस्वाभाविक होगा। ‘अन्न का हर सहारा’ मूल रूपक के सहारा देने वाले अर्थ तथा संपूर्ण खाद्य-आपूर्ति के आशय, दोनों को सुरक्षित रखता है।
- source_word: שָׁבָר
  choice: तोड़ दिया
  rationale: क्रिया के मूल अर्थ ‘तोड़ना’ को रखा गया है, जिससे ‘सहारे’ के टूटने का हिब्रू रूपक भी बना रहता है।
theological_decisions:
- issue: अकाल में परमेश्वर की सक्रिय भूमिका
  choice: 'दोनों एकवचन पुल्लिंग क्रियाओं का कर्ता वही परमेश्वर है जिसका वर्णन आसपास के पदों में है: ‘उसने... बुलाया; उसने... तोड़ दिया।’'
  alternative: घटनाओं को केवल निरपेक्ष या प्राकृतिक विवरण के रूप में प्रस्तुत करना।
  rationale: आसपास का भजन यहोवा के ऐतिहासिक कार्यों का वर्णन करता है, और हिब्रू क्रियाएँ उसी कर्ता को स्वाभाविक रूप से आगे बढ़ाती हैं। अनुवाद इस सक्रिय भूमिका को न घटाता है, न पाठ से आगे उसकी व्याख्या करता है।
translation_notes:
  register: आधुनिक मानक हिंदी का सहज, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रूप। ‘अन्न का सहारा’ मूल מַטֵּה לֶחֶם के रूपक को हिंदी में समझने योग्य ढंग से बनाए रखता है; इसलिए अलग पादटिप्पणी आवश्यक नहीं मानी गई।
