  yaml_path: translation/ot/psalms/105/015.yaml
  text: Do not touch my anointed ones[a], and do my prophets no harm.
translation:
  language: hi
  text: '“मेरे अभिषिक्त जनों[a] को मत छूओ,

    और मेरे नबियों को कोई हानि मत पहुँचाओ।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में “मेरे अभिषिक्त जनों।” इसका मूल शब्द “मसीह” शब्द से संबंधित है, पर यहाँ यह बहुवचन में है और परमेश्वर द्वारा अलग ठहराए गए लोगों को दर्शाता है, न कि विशेष रूप से एकवचन मसीह को।
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּגְּעוּ
  choice: मत छूओ
  rationale: נגע का मूल अर्थ ‘छूना’ है; निषेध में यह किसी के विरुद्ध हाथ बढ़ाने का भाव भी रख सकता है। ‘मत छूओ’ मूल रूपक और काव्यात्मक समानांतरता को सुरक्षित रखता है।
- source_word: בִמְשִׁיחָי
  choice: मेरे अभिषिक्त जनों
  rationale: מָשִׁיחַ का अर्थ ‘अभिषिक्त जन’ है। यहाँ रूप बहुवचन है और प्रथम पुरुष एकवचन संबंधसूचक प्रत्यय के कारण अर्थ ‘मेरे अभिषिक्त जनों’ होता है।
- source_word: לִנְבִיאַי
  choice: मेरे नबियों
  rationale: נָבִיא का अर्थ ‘नबी’ है; बहुवचन और प्रथम पुरुष एकवचन संबंधसूचक प्रत्यय का स्वाभाविक हिन्दी रूप ‘मेरे नबियों’ है।
- source_word: תָּרֵעוּ
  choice: कोई हानि मत पहुँचाओ
  rationale: רעע के हिफ़ील रूप में यहाँ बुरा करने या हानि पहुँचाने का निषेध है। ‘कोई हानि मत पहुँचाओ’ आधुनिक हिन्दी में स्वाभाविक है और अर्थ की व्यापकता बनाए रखता है।
- source_word: אַל
  choice: मत
  rationale: אַל के साथ अपूर्ण क्रिया निषेध व्यक्त करती है; हिन्दी में संक्षिप्त और स्वाभाविक समकक्ष ‘मत’ है।
theological_decisions:
- issue: गैर-मसीही बहुवचन संदर्भ में מְשִׁיחַ का अनुवाद
  choice: अभिषिक्त जनों
  alternative: मसीहों
  rationale: यहाँ शब्द बहुवचन में उन लोगों के लिए है जिन्हें परमेश्वर ने अलग ठहराया है; यह सीधे एकवचन विशिष्ट ‘मसीह’ का उल्लेख नहीं करता। ‘अभिषिक्त जनों’ मूल अर्थ और व्याकरणिक बहुवचन दोनों को सुरक्षित रखता है तथा बाद की विशिष्ट मसीही उपाधि को अनुचित रूप से इस पद में नहीं डालता।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, काव्यात्मक और गरिमापूर्ण शैली रखी गई है। ‘नबी’ सामान्य पाठकों में प्रचलित बाइबलीय पद है; ‘अभिषिक्त जन’ मूल शब्द का अर्थ स्पष्ट रखते हुए बहुवचन को स्वाभाविक बनाता है।
