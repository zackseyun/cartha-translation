  text: He confirmed it to Jacob as a statute[b][a], to Israel as an everlasting covenant.
translation:
  language: hi
  text: उसने उसे याकूब के लिए एक विधि के रूप में और इस्राएल के लिए सदा की वाचा[b] के रूप में ठहराया[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘स्थिर किया।’ इब्रानी क्रिया में किसी बात को दृढ़ता से स्थापित करने का भाव हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘अनन्त वाचा’ अथवा ‘चिरस्थायी वाचा।’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמִידֶהָ
  choice: उसने उसे … ठहराया
  rationale: עמד के हिफ़ील रूप का अर्थ यहाँ किसी बात को दृढ़ रूप से स्थापित या मान्य ठहराना है। ‘ठहराया’ विधि और वाचा—दोनों के साथ स्वाभाविक है और इब्रानी प्रत्यय के संदर्भ को ‘उसे’ द्वारा अनिर्दिष्ट रखता है।
- source_word: לְיַעֲקֹב
  choice: याकूब के लिए
  rationale: לְ यहाँ संबंध या हित को व्यक्त करता है; ‘के लिए’ आधुनिक हिन्दी में सहज है।
- source_word: לְחֹק
  choice: एक विधि
  rationale: חֹק किसी निश्चित, निर्धारित विधान को दर्शाता है। ‘विधि’ उसके औपचारिक और विधान-संबंधी भाव को संक्षेप में व्यक्त करती है।
- source_word: לְיִשְׂרָאֵל
  choice: इस्राएल के लिए
  rationale: यह ‘याकूब के लिए’ के समानांतर संरचना को बनाए रखता है।
- source_word: בְּרִית עוֹלָם
  choice: सदा की वाचा
  rationale: בְּרִית के लिए ‘वाचा’ मानक और अर्थ-सटीक धार्मिक हिन्दी है; עוֹלָם यहाँ स्थायी, अनवरत अवधि का बोध देता है, जिसे ‘सदा की’ स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: וַיַּעֲמִידֶהָ में स्त्रीलिंग प्रत्यय का संदर्भ
  choice: ‘उसे’ द्वारा पिछली पंक्तियों में कही गई वाचा, प्रतिज्ञा या शपथ की ओर सामान्य संकेत
  alternative: इसे विशेष रूप से केवल ‘प्रतिज्ञा’ या केवल ‘शपथ’ से जोड़ना
  rationale: निकटवर्ती प्रसंग में वाचा, वचन और शपथ की परस्पर संबद्ध भाषा है। ‘उसे’ मूल पाठ की संदर्भगत अस्पष्टता को बनाए रखता है और किसी एक निकटवर्ती संज्ञा को अनावश्यक रूप से निश्चित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, काव्यात्मक और गरिमापूर्ण शैली रखी गई है। ‘विधि’ और ‘वाचा’ मूल की विधिक-वाचागत समानांतरता को बनाए रखते हैं; ‘ठहराया’ सामान्य पाठक के लिए बोधगम्य रहते हुए औपचारिक भाव देता है।
