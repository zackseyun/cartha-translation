  text: The king sent and released him[b][a]; the ruler of peoples set him free.
translation:
  language: hi
  text: 'राजा ने भेजा और उसे रिहा किया;

    लोगों के शासक ने उसे स्वतंत्र कर दिया।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׁלַח
  choice: भेजकर
  rationale: इब्रानी क्रिया का सामान्य अर्थ ‘भेजना’ है। अगले क्रियापद के साथ हिन्दी में ‘भेजकर’ स्वाभाविक रूप से बताता है कि राजा ने आदेश अथवा दूत भेजकर रिहाई कराई; मूल में कर्म स्पष्ट न होने के कारण उसे जोड़ा नहीं गया।
- source_word: מֶלֶךְ
  choice: राजा
  rationale: काव्य में संज्ञा पर निश्चित उपपद नहीं है, फिर भी प्रसंग में संकेत फ़िरौन की ओर है; हिन्दी में ‘राजा’ पर्याप्त रूप से निश्चित है।
- source_word: וַיַּתִּירֵהוּ
  choice: उसे बन्धन से छुड़ाया
  rationale: क्रिया का भाव खोलने या बन्धन से मुक्त करने का है। ‘बन्धन से छुड़ाया’ कारावास के प्रसंग को स्पष्ट करता और मुक्ति का ठोस बिम्ब बनाए रखता है।
- source_word: מֹשֵׁל עַמִּים
  choice: लोगों के शासक
  rationale: מֹשֵׁל एक पदवी-सदृश कृदन्त ‘शासक’ है और עַמִּים बहुवचन में ‘लोगों/जनसमूहों’ को दर्शाता है। ‘लोगों के शासक’ आधुनिक हिन्दी में स्वाभाविक है और बहुवचन सामूहिक भाव सुरक्षित रखता है।
- source_word: וַיְפַתְּחֵהוּ
  choice: उसे मुक्त कर दिया
  rationale: פתח का मूल अर्थ ‘खोलना’ है, पर मनुष्य को कर्म बनाकर कारावास के प्रसंग में यह मुक्ति का मुहावरेदार भाव देता है। शाब्दिक ‘उसे खोला’ हिन्दी में भ्रामक होता, इसलिए प्रसंगगत अर्थ चुना गया।
