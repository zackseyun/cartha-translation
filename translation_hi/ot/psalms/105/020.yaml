translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। दोनों समानान्तर पंक्तियों में मुक्ति का अर्थ रखा गया है, पर पहली में ‘बन्धन से छुड़ाया’ और दूसरी में ‘मुक्त कर दिया’ द्वारा काव्यात्मक विविधता बनाए रखी गई है।
