  text: offspring of Abraham[a], his servant, sons of Jacob, his chosen ones[c][b],
translation:
  language: hi
  text: 'हे उसके सेवक अब्राहम की संतान[a],

    हे याकूब के पुत्रों[b], उसके चुने हुए जनों[c]!'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अब्राहम का वंश।’ इब्रानी का एकवचन शब्द सामूहिक रूप से अब्राहम के वंशजों के लिए प्रयुक्त हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘याकूब की संतान।’ मूल इब्रानी में शाब्दिक रूप से ‘याकूब के पुत्र’ है।
    reason: lexical_alternative
  - marker: c
    text: या ‘उसके निर्वाचित जन।’
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶרַע
  choice: संतान
  rationale: यहाँ एकवचन इब्रानी शब्द सामूहिक अर्थ में अब्राहम के वंशजों को दर्शाता है। ‘संतान’ उसके सामूहिक भाव को बनाए रखते हुए स्वाभाविक हिन्दी है।
- source_word: עַבְדּוֹ
  choice: उसके सेवक
  rationale: प्रत्यय का संकेत परमेश्वर की ओर है और अब्राहम को उसका सेवक बताता है। इस प्रसंग में ‘सेवक’ सम्मानसूचक संबंध को ‘दास’ से अधिक स्वाभाविक ढंग से व्यक्त करता है।
- source_word: בְּנֵי
  choice: पुत्रों
  rationale: इब्रानी में स्पष्ट रूप से पुल्लिंग बहुवचन ‘पुत्र’ है। ‘पुत्रों’ मूल रूप को बनाए रखता है, यद्यपि वाचा के वंश के व्यापक अर्थ में यह याकूब की संतति का बोध करा सकता है।
- source_word: בְּחִירָיו
  choice: उसके चुने हुओ
  rationale: बहुवचन विशेषण उन लोगों को दर्शाता है जिन्हें परमेश्वर ने चुना है। ‘चुने हुओ’ वर्तमान हिन्दी में स्पष्ट है और किसी बाद की विशिष्ट धर्मवैज्ञानिक शब्दावली को आरोपित नहीं करता।
- source_word: זֶרַע אַבְרָהָם // בְּנֵי יַעֲקֹב
  choice: अब्राहम की संतान // याकूब के पुत्रों
  rationale: दोनों समानांतर पद समुदाय को कुलपतियों के वंश के रूप में पहचानते हैं। अनुवाद दोनों अभिव्यक्तियों को अलग-अलग बनाए रखता है।
theological_decisions:
- issue: ‘उसके सेवक’ और ‘उसके चुने हुओ’ में संबंधसूचक सर्वनाम का संकेत
  choice: 'दोनों स्थानों पर ‘उसके’ का संकेत परमेश्वर की ओर माना गया है: अब्राहम परमेश्वर का सेवक है और याकूब के पुत्र परमेश्वर के चुने हुए हैं।'
  alternative: निकटतम नामित कुलपति को संबंधसूचक सर्वनाम का पूर्वपद माना जा सकता है, पर प्रसंग में इसकी संभावना कम है।
  rationale: भजन के वाचागत प्रसंग और व्यापक बाइबलीय प्रयोग में अब्राहम परमेश्वर का सेवक तथा इस्राएल परमेश्वर के चुने हुए लोग हैं। हिन्दी में ‘उसके’ मूल पाठ की सर्वनामिक अभिव्यक्ति को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और संबोधनात्मक रखी गई है। ‘हे’ से पिछले पद की पुकार का व्याकरणिक प्रवाह स्पष्ट होता है। काव्यात्मक समानांतरता बनाए रखने के लिए पंक्ति-विभाजन किया गया है।
