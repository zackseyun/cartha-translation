source:
  edition: WLC
  text: שָׂמַ֣ח מִצְרַ֣יִם בְּ/צֵאתָ֑/ם כִּֽי נָפַ֖ל פַּחְדָּ֣/ם עֲלֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/038.yaml
  text: Egypt was glad when they departed[b][a], for dread of them had fallen upon them.
translation:
  language: hi
  text: उनके निकल जाने पर मिस्र आनन्दित हुआ, क्योंकि उनका भय मिस्रवासियों[a] पर छा गया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी में: उन पर।'
    reason: मूल के सर्वनाम को हिन्दी में संदर्भ स्पष्ट करने के लिए ‘मिस्रवासियों’ के रूप में व्यक्त किया गया है।
lexical_decisions:
- source_word: שָׂמַח
  choice: आनन्दित हुआ
  rationale: काल पूर्ण क्रिया और सामूहिक कर्ता ‘मिस्र’ के साथ यह बीती हुई प्रतिक्रिया व्यक्त करती है; यह अभिव्यक्ति स्वाभाविक और गरिमापूर्ण है।
- source_word: מִצְרַיִם
  choice: मिस्र
  rationale: यहाँ देश का नाम उसके निवासियों के लिए सामूहिक रूप से प्रयुक्त हुआ है; हिन्दी में ‘मिस्र आनन्दित हुआ’ इस अलंकारिक प्रयोग को बनाए रखता है।
- source_word: בְּצֵאתָם
  choice: उनके निकल जाने पर
  rationale: בְּ के साथ क्रियार्थक संज्ञा और बहुवचन प्रत्यय समय-संबंधी परिस्थिति बताते हैं—इस्राएलियों के बाहर निकलने के अवसर पर।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह मिस्र के आनन्दित होने का कारण प्रस्तुत करता है।
- source_word: נָפַל
  choice: छा गया था
  rationale: शाब्दिक अर्थ ‘गिरा’ है, पर भय के किसी पर आ पड़ने की इब्रानी छवि को हिन्दी में ‘छा गया था’ स्वाभाविक ढंग से व्यक्त करता है; पूर्णभूत रूप पूर्ववर्ती स्थिति को दिखाता है।
- source_word: פַּחְדָּם
  choice: उनका भय
  rationale: प्रत्यय इस्राएलियों की ओर संकेत करता है और भाव उस भय का है जो उनके कारण मिस्रवासियों में उत्पन्न हुआ; संक्षिप्त अभिव्यक्ति मूल की सर्वनामिक रचना बनाए रखती है।
- source_word: עֲלֵיהֶם
  choice: मिस्रवासियों पर
  rationale: मूल में ‘उन पर’ है, जिसका संदर्भ मिस्र के लोग हैं। हिन्दी में लगातार आने वाले अलग-अलग संदर्भ वाले सर्वनामों की उलझन दूर करने के लिए संदर्भ स्पष्ट किया गया है।
