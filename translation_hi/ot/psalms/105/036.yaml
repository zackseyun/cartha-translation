  yaml_path: translation/ot/psalms/105/036.yaml
  text: He struck down every firstborn in their land[a], the firstfruits of all their strength.
translation:
  language: hi
  text: 'उसने उनके देश में हर पहलौठे को मार डाला,

    जो उनकी सारी सामर्थ्य की पहली उपज था।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उनकी सारी जनन-शक्ति की पहली उपज।” इब्रानी अभिव्यक्ति आरम्भिक संतान को उनकी सामर्थ्य की पहली अभिव्यक्ति बताती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּךְ
  choice: मार डाला
  rationale: नכה के हिफ़िल रूप का मूल अर्थ ‘मारना/प्रहार करना’ है; पहलौठों की मृत्यु के प्रसंग में ‘मार डाला’ घातक परिणाम को स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: כָּל בְּכוֹר
  choice: हर पहलौठे
  rationale: एकवचन בְּכוֹר के साथ כָּל का वितरणात्मक भाव है; आधुनिक हिन्दी में ‘हर पहलौठे’ स्वाभाविक है।
- source_word: בְּאַרְצָם
  choice: उनके देश के
  rationale: בְּ का स्थानवाचक अर्थ और 3 पुरुष बहुवचन प्रत्यय सुरक्षित है; हिन्दी वाक्य-विन्यास में ‘उनके देश के हर पहलौठे को’ सहज है।
- source_word: רֵאשִׁית
  choice: पहला फल
  rationale: רֵאשִׁית आरम्भिक या प्रथम उपज को दर्शाता है। ‘पहला फल’ सन्तान को शक्ति की आरम्भिक अभिव्यक्ति बताने वाले रूपक को बनाए रखता है।
- source_word: לְכָל אוֹנָם
  choice: उनकी सारी शक्ति का
  rationale: לְ यहाँ सम्बन्धसूचक है और אוֹן शक्ति, सामर्थ्य अथवा जनन-शक्ति का बोध करा सकता है। मुख्य पाठ में व्यापक ‘शक्ति’ रखा गया है, जबकि अधिक विशिष्ट अर्थ पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: क्रिया का अप्रकट कर्ता
  choice: ‘उसने’ से परमेश्वर अभिप्रेत है
  alternative: परमेश्वर का नाम स्पष्ट रूप से जोड़ना
  rationale: इब्रानी में कर्ता 3 पुरुष एकवचन है और पूर्ववर्ती प्रसंग से परमेश्वर समझा जाता है। ‘उसने’ इस प्रसंगगत सम्बन्ध को बिना अनावश्यक विस्तार के बनाए रखता है।
- issue: רֵאשִׁית לְכָל אוֹנָם का सम्बन्ध
  choice: पहलौठों को उनकी शक्ति का पहला फल बताने वाला समानाधिकरण
  alternative: ‘उनकी सारी जनन-शक्ति की पहली उपज’
  rationale: पंक्ति का दूसरा भाग पहले भाग की काव्यात्मक व्याख्या करता है। मुख्य पाठ रूपक और व्यापक ‘शक्ति’ को सुरक्षित रखता है; जनन-सामर्थ्य वाला अर्थ पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘पहलौठा’ बाइबलीय प्रसंग में प्रचलित और सटीक शब्द है। काव्यात्मक समान्तरता बनाए रखने के लिए पाठ दो पंक्तियों में दिया गया है।
