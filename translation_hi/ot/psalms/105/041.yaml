  text: He opened the rock[a], and water gushed out; they flowed through the dry places like a river.
translation:
  language: hi
  text: उसने चट्टान को खोला, और पानी फूट निकला; वह सूखी जगहों में नदी की तरह बहा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या अधिक शाब्दिक रूप में, “वह सूखी जगहों में बहा—एक नदी।” इब्रानी में “की तरह” के लिए कोई अलग शब्द नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּתַח
  choice: खोली
  rationale: मूल क्रिया का सामान्य अर्थ ‘खोलना’ है। संदर्भ में ‘फाड़ी’ संभव है, पर वह मूल से अधिक प्रबल चित्र जोड़ता है।
- source_word: צוּר
  choice: चट्टान
  rationale: यह इस्राएल की जंगल-यात्रा की परिचित चट्टान की ओर संकेत करता है; हिन्दी में बिना अनावश्यक सर्वनाम के ‘चट्टान’ स्वाभाविक है।
- source_word: וַיָּז֣וּבוּ מָיִם
  choice: पानी फूट निकला
  rationale: क्रिया पानी के बाहर बह निकलने को व्यक्त करती है; ‘फूट निकला’ उसकी आकस्मिकता और प्रचुरता को सहज हिन्दी में दिखाता है।
- source_word: הָלְכוּ
  choice: वह … बह चला
  rationale: शाब्दिक अर्थ ‘वे चले’ है और इब्रानी में ‘पानी’ के साथ बहुवचन क्रिया है; हिन्दी में ‘पानी’ के लिए एकवचन ‘वह’ और ‘बह चला’ अधिक स्वाभाविक है।
- source_word: בַּצִּיּוֹת
  choice: सूखी जगहों में
  rationale: यह सूखे या झुलसे हुए स्थानों को बताता है; ‘जगहों’ मूल की व्यापकता बनाए रखता है और ‘रेगिस्तान’ जितना विशिष्ट नहीं है।
- source_word: נָהָר
  choice: नदी की तरह
  rationale: अंतिम संज्ञा को विधेयात्मक तुलना के रूप में समझना प्रसंग और काव्य-चित्र के अनुकूल है; हिन्दी में ‘की तरह’ जोड़ने से अर्थ स्पष्ट और स्वाभाविक होता है।
theological_decisions:
- issue: निर्गमन-परंपरा में परमेश्वर द्वारा जंगल में पानी देने का संदर्भ
  choice: पद को उस ऐतिहासिक-काव्यात्मक घटना का वर्णन मानकर अनुवाद किया गया है जिसमें उसने चट्टान से इस्राएल के लिए पानी निकाला।
  alternative: इसे सामान्य रूप से परमेश्वर के प्रबंध का रूपक मानना।
  rationale: भजन 105 इस्राएल के इतिहास का पुनर्कथन करता है; इसलिए ऐतिहासिक घटना मुख्य आशय है, जबकि उसका व्यापक धर्मवैचारिक महत्व निहित रहता है।
- issue: נָהָר का संबंध और तुलना
  choice: पानी सूखी जगहों में ‘नदी की तरह’ बहा।
  alternative: 'अव्यक्त तुलना के बिना अधिक शाब्दिक रूप: ‘वह सूखी जगहों में बह चला—एक नदी।’'
  rationale: इब्रानी में तुलना-सूचक शब्द नहीं है, पर ‘नदी’ पानी के बहाव का विधेयात्मक वर्णन जान पड़ता है। स्पष्ट तुलना स्वाभाविक हिन्दी देती है, और शाब्दिक अस्पष्टता पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और काव्यात्मक शैली रखी गई है। ‘फूट निकला’ और ‘बह चला’ घटना की गति को व्यक्त करते हैं, जबकि अनुवाद मूल से अधिक हिंसक ‘चट्टान फाड़ी’ जैसे शब्दों से बचता है।
