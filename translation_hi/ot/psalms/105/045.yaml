base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/045.yaml
  text: so that they might keep his statutes and observe his laws[b][a]. Praise Yah!
translation:
  language: hi
  text: ताकि वे उसकी विधियों को मानें और उसकी शिक्षाओं का पालन करें। याह की स्तुति करें![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘याह’ परमेश्वर के नाम का संक्षिप्त हिब्रू रूप है। पूरे वाक्यांश का लिप्यंतरण ‘हल्लेलूयाह’ भी किया जाता है।
    reason: alternative_reading
lexical_decisions:
- source_word: בַּעֲבוּר
  choice: ताकि
  rationale: यहाँ उद्देश्य या अपेक्षित परिणाम व्यक्त होता है; आधुनिक हिन्दी में ‘ताकि’ स्वाभाविक और सटीक है।
- source_word: יִשְׁמְרוּ חֻקָּיו
  choice: वे उसकी विधियों को मानें
  rationale: שׁמר आज्ञाओं या विधियों के संदर्भ में उन्हें निष्ठापूर्वक मानने का भाव देता है; חֻקִּים निर्धारित विधियों या नियमों को सूचित करता है।
- source_word: וְתוֹרֹתָיו יִנְצֹרוּ
  choice: और उसकी शिक्षाओं का पालन करें
  rationale: תּוֹרוֹת बहुवचन में शिक्षाओं, निर्देशों या व्यवस्थाओं को दर्शा सकता है; נצר सावधानी से थामे रखने और पालन करने का भाव रखता है। यह अनुवाद समानांतरता बनाए रखते हुए हिन्दी में अनावश्यक पुनरुक्ति से बचता है।
- source_word: הַלְלוּ יָהּ
  choice: याह की स्तुति करो
  rationale: हिब्रू में बहुवचन आज्ञार्थक ‘स्तुति करो’ और परमेश्वर के नाम का संक्षिप्त रूप ‘याह’ स्पष्ट रूप से अलग हैं; अनुवाद दोनों को प्रत्यक्ष रखता है।
theological_decisions:
- issue: समापन में संक्षिप्त दिव्य नाम יָהּ का अनुवाद
  choice: याह की स्तुति करो!
  alternative: हल्लेलूयाह! / यहोवा की स्तुति करो!
  rationale: मूल पाठ में पूर्ण चतुराक्षरी नाम नहीं, बल्कि उसका संक्षिप्त रूप יָהּ है। ‘याह’ इस भेद को सुरक्षित रखता है, जबकि ‘स्तुति करो’ आज्ञार्थक क्रिया का अर्थ स्पष्ट करता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘विधियों’ तथा ‘शिक्षाओं’ से समानांतर कानूनी-शिक्षापरक पदों का भेद बना रहता है; ‘मानें’ और ‘पालन करें’ हिन्दी में स्वाभाविक समानांतरता देते हैं।
