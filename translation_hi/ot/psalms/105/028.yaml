id: PSA.105.28
reference: Psalms 105:28
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: שָׁ֣לַֽח חֹ֭שֶׁךְ וַ/יַּחְשִׁ֑ךְ וְ/לֹֽא מָ֝ר֗וּ אֶת דברו/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/028.yaml
  text: He sent darkness and made it dark[a], and they did not rebel against his words.
translation:
  language: hi
  text: उसने अन्धकार भेजा और अँधेरा कर दिया; और उन्होंने उसके वचनों के विरुद्ध विद्रोह नहीं किया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसके वचन/आज्ञा के विरुद्ध विद्रोह नहीं किया।” इब्रानी को एकवचन अर्थ में भी समझा जा सकता है। “उन्होंने” का कर्ता स्पष्ट नहीं है; कुछ इसे मिस्रियों के विषय में और कुछ मूसा और हारून के विषय में समझते हैं।
    reason: वैकल्पिक पाठ और अस्पष्ट कर्ता
lexical_decisions:
- source_word: שָׁלַח
  choice: भेजा
  rationale: यह सामान्य और स्वाभाविक हिन्दी क्रिया है तथा इब्रानी क्रिया के अर्थ को सीधे व्यक्त करती है।
- source_word: חֹשֶׁךְ
  choice: अन्धकार
  rationale: यह संज्ञा मिस्र पर आई विपत्ति के सन्दर्भ में मूल शब्द का मानक और गरिमापूर्ण समतुल्य है।
- source_word: וַיַּחְשִׁךְ
  choice: अँधेरा कर दिया
  rationale: यह क्रिया के कारक भाव को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: וְלֹא
  choice: और ... नहीं
  rationale: यह मूल के साधारण संयोजन और निषेध को अनावश्यक विरोधात्मक बल दिए बिना बनाए रखता है।
- source_word: מָרוּ
  choice: विद्रोह किया
  rationale: यह मूल क्रिया के अवज्ञा और विद्रोह के भाव को व्यक्त करता है।
- source_word: אֶת־דבריו
  choice: उसके वचनों के विरुद्ध
  rationale: व्यंजनात्मक पाठ बहुवचन, ‘उसके वचन’, का समर्थन करता है; ‘के विरुद्ध’ हिन्दी में מָרוּ के साथ आशय स्पष्ट करता है।
theological_decisions:
- issue: ‘उन्होंने’ का अभिप्रेत कर्ता
  choice: बहुवचन ‘उन्होंने’ को बिना कर्ता की पहचान बताए रखा गया है।
  alternative: इसे मिस्रियों अथवा मूसा और हारून के रूप में स्पष्ट करना।
  rationale: इब्रानी में बहुवचन कर्ता अंतर्निहित है और उसकी पहचान स्पष्ट नहीं की गई; अनुवाद इस वास्तविक व्याख्यात्मक अस्पष्टता को बनाए रखता है।
- issue: ‘उसके वचनों’ का वचन और अर्थ
  choice: पाठ के बहुवचन रूप के अनुसार ‘उसके वचनों’ रखा गया है।
  alternative: ‘उसके वचन’ अथवा ‘उसकी आज्ञा’।
  rationale: ‘वचन’ या ‘आज्ञा’ सन्दर्भानुकूल सम्भव अर्थ हैं, पर मुख्य पाठ में रूपगत बहुवचन को सुरक्षित रखना स्रोत के अधिक निकट है।
translation_notes:
  register: आधुनिक मानक हिन्दी में स्वाभाविक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध शैली अपनाई गई है। ‘अन्धकार’ काव्यात्मक संज्ञा के रूप में और ‘अँधेरा कर दिया’ स्वाभाविक क्रियात्मक अभिव्यक्ति के रूप में प्रयुक्त हैं।
