  yaml_path: translation/ot/psalms/105/001.yaml
  text: Give thanks to Yahweh[a]; call on his name; make his deeds known among the peoples.
translation:
  language: hi
  text: 'याहवे[a] का धन्यवाद करो;

    उसका नाम लेकर पुकारो;

    लोगों के बीच उसके कामों को प्रकट करो।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में परमेश्वर का दैवी नाम יהוה (YHWH) है, जिसका लिप्यंतरण यहाँ “याहवे” किया गया है।
    reason: दिव्य नाम के लिप्यंतरण को स्पष्ट करना
lexical_decisions:
- source_word: הוֹדוּ
  choice: धन्यवाद करो
  rationale: ידה का हिफ़ील आज्ञार्थक बहुवचन यहाँ आराधना और कृतज्ञता के संदर्भ में ‘धन्यवाद करना’ व्यक्त करता है। यह अर्थ को स्वाभाविक आधुनिक हिन्दी में रखता है।
- source_word: לַיהוָה
  choice: याहवे का
  rationale: ל यहाँ धन्यवाद के लक्ष्य को चिह्नित करता है। हिन्दी में ‘याहवे का धन्यवाद करो’ स्वाभाविक है और मूल दिव्य नाम को लिप्यंतरित करता है।
- source_word: קִרְאוּ בִּשְׁמוֹ
  choice: उसका नाम पुकारो
  rationale: קרא के साथ בְּשֵׁם किसी का नाम लेकर उसे पुकारने या उसका आह्वान करने का मुहावरा है। चुना हुआ रूप संक्षिप्त, स्वाभाविक और प्रार्थना/आराधना की संभावना को बनाए रखता है।
- source_word: הוֹדִיעוּ
  choice: प्रकट करो
  rationale: ידע का हिफ़ील आज्ञार्थक बहुवचन ‘जानने योग्य बनाओ’ या ‘विदित करो’ का अर्थ देता है। ‘प्रकट करो’ इस कारक अर्थ को पठनीय हिन्दी में व्यक्त करता है।
- source_word: בָעַמִּים
  choice: देश-देश के लोगों के बीच
  rationale: עַמִּים अलग-अलग जनसमुदायों या राष्ट्रों के लोगों को सूचित करता है और בְּ का अर्थ ‘के बीच’ है। यह रूप ‘जाति’ के आधुनिक सामाजिक अर्थ से उत्पन्न संभावित भ्रम को टालता है।
- source_word: עֲלִילוֹתָיו
  choice: उसके कामों
  rationale: यह संज्ञा किए गए कार्यों या कर्मों को दर्शाती है। ‘कामों’ व्यापक और सहज है; ‘सामर्थी कामों’ जैसा विशेषण मूल में स्पष्ट रूप से उपस्थित नहीं है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: इब्रानी पाठ में चार अक्षरों वाला व्यक्तिगत दिव्य नाम सीधे आया है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और उसे सामान्य उपाधि ‘प्रभु’ से नहीं बदलता; पाठक की सहायता के लिए पादटिप्पणी दी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामूहिक आराधना में बोलने योग्य रखी गई है। तीनों बहुवचन आज्ञाओं को हिन्दी में सीधे आज्ञार्थक रूप दिया गया है और इब्रानी पद की समानांतर लय बनाए रखने के लिए पंक्तियाँ अलग रखी गई हैं।
