  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָפַךְ
  choice: बदल दिया
  rationale: यह क्रिया पलटने या एक अवस्था से दूसरी अवस्था में बदलने का अर्थ देती है; यहाँ विपत्ति के संदर्भ में ‘बदल दिया’ स्वाभाविक और सटीक है।
- source_word: מֵימֵיהֶם
  choice: उनके जल
  rationale: बहुवचन रूप को ‘जल’ सामूहिक अर्थ में व्यक्त करता है और मिस्रियों के जलस्रोतों की ओर संकेत करता है।
- source_word: לְדָם
  choice: लहू में
  rationale: לְ परिणामस्वरूप बनी अवस्था को दर्शाता है; आधुनिक हिन्दी में ‘लहू में बदल दिया’ सहज है।
- source_word: וַיָּמֶת
  choice: मार डाला
  rationale: हिफ़ईल रूप कारक अर्थ रखता है। ‘मार डाला’ इस बात को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है कि उसी के कार्य से मछलियाँ मरीं।
- source_word: דְּגָתָם
  choice: उनकी मछलियों
  rationale: यह संज्ञा मछलियों के सामूहिक समूह को दर्शाती है; हिन्दी में बहुवचन ‘मछलियों’ स्पष्ट और स्वाभाविक है।
