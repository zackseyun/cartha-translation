    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְהַלְּכוּ
  choice: भटकते रहे
  rationale: हित्पएल रूप यहाँ बार-बार या इधर-उधर होने वाली गति व्यक्त करता है। संदर्भ में कुलपिताओं के एक स्थान से दूसरे स्थान जाने के लिए ‘भटकते रहे’ स्वाभाविक है और इस गतिशीलता को बनाए रखता है।
- source_word: מִגּוֹי אֶל גּוֹי
  choice: एक जाति से दूसरी जाति में
  rationale: גּוֹי किसी जातीय-राजनीतिक समुदाय को दर्शाता है। हिंदी में ‘एक जाति से दूसरी जाति में’ स्रोत की पुनरावृत्ति और समुदायों के बीच आवागमन का भाव स्पष्ट रखता है।
- source_word: מִמַּמְלָכָה
  choice: एक राज्य से
  rationale: מַמְלָכָה का अर्थ ‘राज्य’ है। यद्यपि स्रोत में ‘एक’ स्पष्ट रूप से नहीं है, ‘एक राज्य से दूसरे…’ हिंदी में स्वाभाविक सहसंबंधी रचना है और मूल के वितरणात्मक भाव को व्यक्त करती है।
- source_word: אֶל עַם אַחֵר
  choice: दूसरे लोगों के बीच
  rationale: עַם सामाजिक या जातीय जनसमुदाय को दर्शाता है और מַמְלָכָה (‘राज्य’) से भिन्न है। ‘लोगों’ इस भेद को बनाए रखता है; ‘के बीच’ हिंदी में किसी जनसमुदाय के क्षेत्र या संगति में पहुँचने का स्वाभाविक भाव देता है।
