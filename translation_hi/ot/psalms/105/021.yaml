    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂמוֹ
  choice: उसने उसे ... बनाया
  rationale: שׂים का क़ाल पूर्ण रूप, 3 पुं. ए. कर्म-प्रत्यय के साथ, मूलतः ‘उसने उसे रखा/नियुक्त किया’ है। पदवी-सूचक संज्ञाओं के साथ हिन्दी में ‘बनाया’ स्वाभाविक है और नियुक्ति का भाव व्यक्त करता है।
- source_word: אָדוֹן
  choice: स्वामी
  rationale: यह शब्द घराने पर अधिकार रखने वाले व्यक्ति को दर्शाता है। ‘स्वामी’ काव्यात्मक गरिमा और अधिकार—दोनों को बनाए रखता है।
- source_word: לְבֵיתוֹ
  choice: अपने घराने का
  rationale: यहाँ לְ उस क्षेत्र को चिह्नित करता है जिसके संबंध में उसे अधिकार दिया गया। ‘घराने’ में केवल भवन नहीं, बल्कि फिरौन का गृह-प्रबंध और उससे जुड़े लोग भी समाहित हो सकते हैं।
- source_word: וּמֹשֵׁל
  choice: और ... शासक
  rationale: משׁל से बना यह रूप शासन करने वाले को दर्शाता है। ‘शासक’ समानांतर पदवी के रूप में स्पष्ट और स्वाभाविक है।
- source_word: בְּכָל
  choice: सारी ... पर
  rationale: משׁל के साथ בְ शासन के क्षेत्र या विषय को बताता है; हिन्दी में इसे स्वाभाविक रूप से ‘पर’ से व्यक्त किया गया है।
- source_word: קִנְיָנוֹ
  choice: अपनी सारी संपत्ति
  rationale: קִנְיָן अर्जित माल, जायदाद या समस्त स्वामित्व की वस्तुओं को सूचित करता है। ‘संपत्ति’ इस व्यापक अर्थ को संक्षेप और स्वाभाविक ढंग से व्यक्त करती है।
