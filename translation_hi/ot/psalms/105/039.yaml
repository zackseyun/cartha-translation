  text: פָּרַ֣שׂ עָנָ֣ן לְ/מָסָ֑ךְ וְ֝/אֵ֗שׁ לְ/הָאִ֥יר לָֽיְלָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/039.yaml
  text: He spread out a cloud as a covering[a], and fire to give light by night.
translation:
  language: hi
  text: उसने आवरण के रूप में बादल फैलाया, और रात में प्रकाश देने के लिए आग दी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פָּרַשׂ
  choice: फैलाया
  rationale: क्रिया का मूल अर्थ फैलाना या तानना है; यहाँ बादल को ऊपर फैलाने का चित्र स्वाभाविक रूप से व्यक्त होता है।
- source_word: עָנָן
  choice: बादल
  rationale: यह शब्द अपने सीधे अर्थ में बादल को दर्शाता है और निर्गमन-यात्रा की पृष्ठभूमि से मेल खाता है।
- source_word: לְמָסָךְ
  choice: ओट के लिए
  rationale: מָסָךְ आवरण, परदा या आड़ का बोध करा सकता है। 'ओट' सुरक्षा और ढकाव दोनों को व्यक्त करता है, जबकि לְ के प्रयोजन-सूचक भाव को 'के लिए' बनाए रखता है।
- source_word: וְאֵשׁ
  choice: और ... आग
  rationale: शाब्दिक चित्र को बनाए रखता है और बादल तथा आग के समानांतर विन्यास को सुरक्षित रखता है। हिंदी में स्वाभाविक वाक्य के लिए 'दी' की पूर्ति की गई है।
- source_word: לְהָאִיר
  choice: उजाला देने के लिए
  rationale: हिफ़ील infinitive यहाँ प्रयोजन बताता है; यह हिंदी में आग के प्रकाश देने के कार्य को स्पष्ट और सहज रूप से व्यक्त करता है।
- source_word: לָיְלָה
  choice: रात में
  rationale: कालवाचक प्रयोग का स्वाभाविक आधुनिक हिंदी रूप।
theological_decisions:
- issue: क्रिया का निहित कर्ता
  choice: उसने, अर्थात संदर्भ में परमेश्वर ने
  alternative: यहोवा ने
  rationale: इब्रानी में तृतीय पुरुष एकवचन कर्ता निहित है और पूर्ववर्ती संदर्भ से परमेश्वर की ओर संकेत करता है। 'उसने' मूल प्रवचन-प्रवाह को बनाए रखता है और मुख्य पाठ में ईश्वरीय नाम नहीं जोड़ता।
- issue: जंगल में ईश्वरीय उपस्थिति का चित्र
  choice: बादल और आग के चित्र को बिना व्याख्यात्मक विस्तार के बनाए रखना
  alternative: उन्हें स्पष्ट रूप से बादल और आग के खंभे कहना
  rationale: पद निर्गमन की घटना की ओर संकेत करता है, पर मूल पाठ केवल बादल, आग और उनके कार्य बताता है; इसलिए अतिरिक्त पहचान मुख्य पाठ में नहीं जोड़ी गई।
translation_notes:
  register: आधुनिक मानक हिंदी में संक्षिप्त, काव्यात्मक और गरिमापूर्ण शैली रखी गई है। 'ओट' सामान्य पाठक के लिए बोधगम्य है और मूल शब्द की सुरक्षात्मक तथा आवरण-संबंधी अर्थ-सीमा को संक्षेप में व्यक्त करता है।
