  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: הָפַ֣ךְ לִ֭בָּ/ם לִ/שְׂנֹ֣א עַמּ֑/וֹ לְ֝/הִתְנַכֵּ֗ל בַּ/עֲבָדָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/025.yaml
  text: He turned their heart to hate his people[b][a], to deal deceitfully with his servants.
translation:
  language: hi
  text: उसने उनके मन को फेर दिया कि वे उसकी प्रजा से घृणा करें और उसके सेवकों के विरुद्ध छल की चालें चलें।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָפַךְ
  choice: फेर दिया
  rationale: यह क्रिया मन की दशा में निर्णायक परिवर्तन और परमेश्वर की प्रत्यक्ष क्रियाशीलता को व्यक्त करती है; ‘फेर दिया’ हिन्दी में स्वाभाविक रहते हुए मूल की प्रबलता बनाए रखता है।
- source_word: לִבָּם
  choice: उनके मन
  rationale: इब्रानी में ‘हृदय’ एकवचन में सामूहिक प्रयोग है। आधुनिक हिन्दी में भी ‘उनके मन’ सामूहिक भीतरी प्रवृत्ति को सहज रूप से व्यक्त करता है।
- source_word: לִשְׂנֹא
  choice: कि वे ... से घृणा करें
  rationale: इनफिनिटिव को परिणाम अथवा उद्देश्य—दोनों की सम्भावना खुली रखते हुए स्वाभाविक हिन्दी उपवाक्य में प्रस्तुत किया गया है।
- source_word: עַמּוֹ
  choice: उसकी प्रजा
  rationale: यहाँ עַם यहोवा से सम्बन्धित लोगों के समुदाय को दर्शाता है; ‘प्रजा’ इस सम्बन्ध को गरिमापूर्ण और सहज हिन्दी में व्यक्त करती है।
- source_word: לְהִתְנַכֵּל
  choice: छल की चालें चलें
  rationale: यह रूप कपटपूर्ण और शत्रुतापूर्ण युक्ति रचने का भाव रखता है। यह हिन्दी अभिव्यक्ति ‘छल करना’ से अधिक स्पष्ट रूप से सोची-समझी धूर्तता बताती है।
- source_word: בַּעֲבָדָיו
  choice: उसके सेवकों के विरुद्ध
  rationale: इस क्रिया के साथ ב लक्ष्य-विरोधी सम्बन्ध व्यक्त करता है; इसलिए हिन्दी में ‘के विरुद्ध’ अधिक स्पष्ट और मुहावरेदार है। עבד को इस सन्दर्भ में परमेश्वर के ‘सेवक’ कहा गया है।
theological_decisions:
- issue: मिस्रियों के मन को फेरने में परमेश्वर की भूमिका
  choice: ‘उसने उनके मन को फेर दिया’ के रूप में प्रत्यक्ष दैवी कर्तृत्व बनाए रखा गया है।
  alternative: ‘उसने उनके मन को फिरने दिया’ अथवा ‘उनका मन फिर गया।’
  rationale: इब्रानी में क्रिया स्पष्ट रूप से एकवचन पुल्लिंग कर्ता की प्रत्यक्ष क्रिया बताती है, और प्रसंग में कर्ता परमेश्वर है। इसे अनुमति या केवल कर्मवाच्य में बदलना मूल पाठ के धर्मवैचारिक तनाव को अनावश्यक रूप से हल्का कर देता।
- issue: इनफिनिटिवों में उद्देश्य और परिणाम का सम्बन्ध
  choice: ‘कि वे ... करें’
  alternative: ‘जिससे वे ... करने लगे’
  rationale: मूल व्याकरण उद्देश्य और परिणाम के बीच कुछ अस्पष्टता की अनुमति देता है। हिन्दी का ‘कि वे’ कथन को स्वाभाविक रखते हुए इस सम्बन्ध को अत्यधिक निश्चित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। सामूहिक एकवचन ‘हृदय’ का शाब्दिक अनुकरण करने के बजाय ‘उनके मन’ चुना गया है, जो हिन्दी में सामूहिक अन्तःप्रवृत्ति को स्वाभाविक ढंग से व्यक्त करता है।
