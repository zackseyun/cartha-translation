  yaml_path: translation/ot/psalms/105/042.yaml
  text: For he remembered his holy word to Abraham his servant[a][b].
translation:
  language: hi
  text: क्योंकि उसने अपने पवित्र वचन को और अपने सेवक अब्राहम को स्मरण किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले पद में वर्णित कार्य का कारण बताता है; हिन्दी में ‘क्योंकि’ इस व्याख्यात्मक संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: זָכַר
  choice: स्मरण किया
  rationale: यह मूल क्रिया ‘याद करना’ को बनाए रखता है और साथ ही उस वचन के अनुसार कार्य करने के वाचागत भाव को बिना स्पष्ट विस्तार किए खुला छोड़ता है।
- source_word: דְּבַר קָדְשׁוֹ
  choice: अपने पवित्र वचन
  rationale: ‘वचन’ हिब्रू דָּבָר के निकट है; संदर्भ में यह प्रतिज्ञा का अर्थ रखता है, पर मुख्य पाठ में मूल की व्यापकता बनाए रखी गई है।
- source_word: אֶת אַבְרָהָם
  choice: अब्राहम को दिए
  rationale: हिब्रू में संबंध सूचक पूर्वसर्ग स्पष्ट नहीं है। संदर्भ के अनुसार यह वचन अब्राहम को दिया गया था; हिन्दी में यह रूप उस निहित संबंध को स्पष्ट और स्वाभाविक बनाता है।
- source_word: עַבְדּוֹ
  choice: अपने दास
  rationale: अब्राहम के परमेश्वर के अधीन और उसकी सेवा में होने के संबंध के लिए ‘दास’ प्रतिष्ठित, संक्षिप्त और प्रसंगानुकूल शब्द है।
theological_decisions:
- issue: ‘स्मरण किया’ का वाचागत अर्थ
  choice: मुख्य पाठ में ‘स्मरण किया’ बनाए रखा गया है।
  alternative: ‘अपनी प्रतिज्ञा पूरी की’
  rationale: संदर्भ में स्मरण करने का अर्थ उस वचन के अनुसार कार्य करना हो सकता है, किंतु ‘पूरा किया’ कहना मूल क्रिया की तुलना में अधिक व्याख्यात्मक होता।
- issue: पवित्र वचन और अब्राहम के बीच संबंध
  choice: ‘अपने दास अब्राहम को दिए अपने पवित्र वचन’
  alternative: ‘अपने पवित्र वचन और अपने दास अब्राहम को’
  rationale: हिब्रू रचना संक्षिप्त और कुछ हद तक अस्पष्ट है। भजन के प्रतिज्ञा-संबंधी संदर्भ में अब्राहम को वचन का प्राप्तकर्ता समझना सबसे स्वाभाविक है, फिर भी ‘वचन’ को सीधे ‘प्रतिज्ञा’ से नहीं बदला गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और काव्यात्मक वाक्य-विन्यास रखा गया है। ‘दास’ और ‘वचन’ जैसे परिचित बाइबिलीय शब्द सामान्य पाठक के लिए समझने योग्य हैं और मूल के धार्मिक भार को भी बनाए रखते हैं।
