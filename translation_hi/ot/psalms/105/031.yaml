lexical_decisions:
- source_word: אָמַר
  choice: उसने कहा
  rationale: मूल क्रिया का सीधा अर्थ ‘कहा’ है। इससे संक्षिप्त ईश्वरीय वचन-सूत्र बना रहता है; ‘उसने आज्ञा दी’ मूल से अधिक अर्थ जोड़ता।
- source_word: וַיָּבֹא
  choice: आ गए
  rationale: בוא यहाँ विपत्ति के आने को व्यक्त करता है। हिंदी में बहुवचन ‘झुंड’ के साथ ‘आ गए’ स्वाभाविक है।
- source_word: עָרֹב
  choice: मक्खियों के झुंड
  rationale: विपत्ति-वृत्तांत में परंपरागत रूप से इसे मक्खियों के झुंड माना जाता है, यद्यपि कीट की ठीक पहचान अनिश्चित है; इसलिए विकल्प पादटिप्पणी में रखा गया है।
- source_word: כִּנִּים
  choice: कुटकियाँ
  rationale: यह छोटे काटने वाले कीटों का द्योतक है। ‘कुटकियाँ’ आधुनिक हिंदी में छोटे मच्छर-जैसे कीटों के लिए उपयुक्त है, जबकि ठीक प्रजाति अनिश्चित है।
- source_word: בְּכָל גְּבוּלָם
  choice: उनके पूरे प्रदेश में
  rationale: בְּכָל पूरे विस्तार को और גְּבוּל यहाँ केवल सीमा-रेखा नहीं, अधिकार-क्षेत्र या प्रदेश को दर्शाता है।
- source_word: כִּנִּים בְּכָל גְּבוּלָם
  choice: उनके पूरे प्रदेश में कुटकियाँ फैल गईं
  rationale: दूसरी पंक्ति में क्रिया अध्याहृत है। स्वाभाविक हिंदी के लिए ‘फैल गईं’ जोड़ा गया है और व्यापक उपस्थिति का भाव सुरक्षित रखा गया है।
