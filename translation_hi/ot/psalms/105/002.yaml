  text: उसके लिए गाओ; उसका गुणगान करो; उसके सभी अद्भुत कार्यों का वर्णन करो।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसके सभी अद्भुत कार्यों की चर्चा करो,” अथवा “उसके सभी अद्भुत कार्यों पर मनन करो।” इब्रानी क्रिया बोलकर वर्णन या चर्चा करने, और मन में विचार करने—दोनों अर्थ दे सकती है; यहाँ स्तुति के प्रसंग में सार्वजनिक रूप से कहने का अर्थ अधिक उपयुक्त जान पड़ता है।
