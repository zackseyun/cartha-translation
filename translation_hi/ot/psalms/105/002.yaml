lexical_decisions:
- source_word: שִׁירוּ לוֹ
  choice: उसके लिए गाओ
  rationale: बहुवचन आज्ञार्थक ‘गाओ’ और לְ का लक्ष्य/समर्पण-भाव स्वाभाविक हिन्दी में व्यक्त होता है।
- source_word: זַמְּרוּ לוֹ
  choice: उसका गुणगान करो
  rationale: स्तुति के प्रसंग में זמר का अर्थ संगीत या गीत द्वारा प्रशंसा करना है; ‘गुणगान करो’ उपासना-संबंधी अर्थ को बिना वाद्य का संकेत जोड़े सहज रूप से व्यक्त करता है।
- source_word: שִׂיחוּ
  choice: चर्चा करो
  rationale: यह क्रिया मनन करने और बोलकर वर्णन करने, दोनों अर्थों में आ सकती है। सार्वजनिक स्तुति की आज्ञाओं के इस क्रम में ‘चर्चा करो’ संवादात्मक अर्थ को प्राथमिकता देता है।
- source_word: בְּכָל נִפְלְאוֹתָיו
  choice: उसके सब अद्भुत कामों की
  rationale: נִפְלָאוֹת परमेश्वर के विस्मयकारी कार्यों को दर्शाता है; ‘अद्भुत काम’ आश्चर्य और वास्तविक कृत्यों, दोनों को बनाए रखता है, और כָל की व्यापकता ‘सब’ से व्यक्त होती है।
theological_decisions:
- issue: שִׂיחוּ का आंतरिक मनन या सार्वजनिक वर्णन
  choice: सार्वजनिक रूप से चर्चा करने का अर्थ मुख्य पाठ में
  alternative: उसके सब अद्भुत कामों पर मनन करो
  rationale: समानांतर बहुवचन आज्ञाएँ—गाना और गुणगान करना—सामुदायिक, मुखर स्तुति का प्रसंग बनाती हैं; फिर भी मूल क्रिया की चिंतनात्मक अर्थ-सम्भावना पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामुदायिक पाठ के लिए सहज रखी गई है। ‘गुणगान’ स्तुति का स्वाभाविक हिन्दी पद है; ‘चर्चा करो’ मूल की बोलने और विचार करने वाली अर्थ-सीमा को ‘वर्णन करो’ की अपेक्षा कुछ अधिक खुला रखता है।
