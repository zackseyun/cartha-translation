translation:
  language: hi
  text: उन्होंने उनके बीच उसके चिन्हों के कार्य[a] किए और हाम के देश में अद्भुत काम किए।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उसके चिन्हों के वचन/बातें”; यहाँ “वचन/बातें” का अर्थ चिन्हों से सम्बन्धित कार्य या घटनाएँ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: “हाम का देश” मिस्र का एक काव्यात्मक नाम है।
    reason: cultural_note
lexical_decisions:
- source_word: שָׂמוּ
  choice: प्रकट किए
  rationale: שׂוּם का मूल अर्थ ‘रखना/स्थापित करना’ है, पर यहाँ चिन्हों और अद्भुत कामों के साथ इसका भाव उन्हें लोगों के बीच घटित या प्रदर्शित करना है। ‘प्रकट किए’ आधुनिक हिन्दी में स्वाभाविक है और चिन्हों के सार्वजनिक प्रदर्शन का भाव रखता है।
- source_word: בָם
  choice: उनके बीच
  rationale: बहुवचन प्रत्यय मिस्रियों की ओर संकेत करता है। सन्दर्भ में ב का अर्थ उनके भीतर नहीं, बल्कि उनकी मध्यस्थता या उपस्थिति में है।
- source_word: דִּבְרֵי אֹתוֹתָיו
  choice: उसके चिन्ह
  rationale: דִּבְרֵי का शाब्दिक अर्थ ‘वचन/बातें’ है, पर इस असामान्य संयोग में यह चिन्हों से सम्बन्धित घटनाओं या कार्यों का सूचक हो सकता है। मुख्य पाठ में स्वाभाविक हिन्दी के लिए ‘उसके चिन्ह’ रखा गया है और शाब्दिक रूप को पादटिप्पणी में सुरक्षित किया गया है।
- source_word: וּמֹפְתִים
  choice: और अद्भुत काम
  rationale: מוֹפֵת चिन्ह के साथ प्रयुक्त होकर विस्मयकारी दैवी कार्य को दर्शाता है। ‘अद्भुत काम’ सामान्य पाठक के लिए स्पष्ट है और अनावश्यक रूप से किसी तकनीकी धार्मिक शब्दावली को नहीं थोपता।
- source_word: בְּאֶרֶץ חָם
  choice: हाम के देश में
  rationale: हिब्रू की काव्यात्मक अभिव्यक्ति को बनाए रखा गया है; यहाँ ‘हाम का देश’ मिस्र का काव्यात्मक नाम है।
theological_decisions:
- issue: דִּבְרֵי אֹתוֹתָיו की असामान्य अभिव्यक्ति
  choice: मुख्य पाठ में अर्थानुकूल ‘उसके चिन्ह प्रकट किए’, और शाब्दिक रूप पादटिप्पणी में
  alternative: ‘उसके चिन्हों के वचन/बातें रखीं’ या ‘उसके चिन्हों के कार्य किए’
  rationale: शाब्दिक संरचना हिन्दी में अस्पष्ट और भ्रामक हो सकती है, मानो चिन्ह स्वयं बोल रहे हों। अर्थानुकूल मुख्य पाठ पठनीयता देता है, जबकि पादटिप्पणी ‘वचन/बातें’ और ‘कार्य/घटनाएँ’ की वास्तविक शाब्दिक-वैचारिक अस्पष्टता को सुरक्षित रखती है।
- issue: कर्ता और स्वामी सूचक सर्वनाम
  choice: ‘उन्होंने’ और ‘उसके’ को बनाए रखना
  alternative: ‘मूसा और हारून ने’ तथा ‘परमेश्वर के’ को स्पष्ट करना
  rationale: हिब्रू पाठ पूर्ववर्ती सन्दर्भ पर निर्भर बहुवचन कर्ता और एकवचन स्वामी सूचक सर्वनाम रखता है। नाम जोड़ने से अर्थ स्पष्ट होता, पर वह इस पद में प्रत्यक्षतः उपस्थित नहीं है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘चिन्ह’ और ‘अद्भुत काम’ बाइबलीय युग्म को स्वाभाविक हिन्दी में व्यक्त करते हैं। असामान्य हिब्रू पदबंध की अस्पष्टता पादटिप्पणी में दी गई है, और मुख्य पाठ में कोई अतिरिक्त नाम या सम्प्रदायगत व्याख्या नहीं जोड़ी गई।
