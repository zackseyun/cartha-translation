base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/037.yaml
  text: He brought them out with silver and gold[a], and among his tribes there was no one who stumbled.
translation:
  language: hi
  text: 'वह उन्हें चाँदी और सोने के साथ निकाल लाया,

    और उसके गोत्रों में कोई भी लड़खड़ाने वाला न था।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “कोई भी निर्बल न था।” इब्रानी कृदन्त का अर्थ ठोकर खाना, लड़खड़ाना या निर्बल होना हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצִיאֵם
  choice: वह उन्हें ... निकाल लाया
  rationale: יצא के हिफ़ील रूप में किसी को बाहर लाने या निकालने का भाव है। यह चुनाव निर्गमन में परमेश्वर की सक्रिय भूमिका को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: בְּכֶסֶף וְזָהָב
  choice: चाँदी और सोने के साथ
  rationale: 'यहाँ ב साथ होने या पास होने का भाव देता है: लोग चाँदी और सोना लेकर निकले। अनुवाद यह नहीं बताता कि वे उससे कितने लदे हुए थे।'
- source_word: וְאֵין
  choice: और ... कोई भी ... न था
  rationale: अस्तित्व-सूचक אֵין को हिन्दी में सहज नकारात्मक अस्तित्व-वाक्य के रूप में व्यक्त किया गया है। 'भी' इस बात पर बल देता है कि एक भी अपवाद नहीं था।
- source_word: בִּשְׁבָטָיו
  choice: उसके गोत्रों में
  rationale: तीसरे पुरुष एकवचन पुल्लिंग प्रत्यय को सुरक्षित रखा गया है। इसका संकेत सामूहिक रूप से एक व्यक्ति के समान देखे गए इस्राएल/याकूब की ओर है।
- source_word: כּוֹשֵׁל
  choice: लड़खड़ाने वाला
  rationale: כשל का कृदन्त ठोकर खाने, लड़खड़ाने, असफल पड़ने या निर्बल होने का भाव दे सकता है। 'लड़खड़ाने वाला' मूल के सजीव बिंब को बनाए रखता है और यात्रा के लिए निर्बल होने का निहित अर्थ भी खुला छोड़ता है।
theological_decisions:
- issue: ‘उसके गोत्रों’ में एकवचन संबंधसूचक प्रत्यय का संदर्भ
  choice: इब्रानी के एकवचन प्रत्यय के अनुरूप ‘उसके गोत्रों’ रखा गया है, जिसका संदर्भ सामूहिक रूप से इस्राएल/याकूब है।
  alternative: ‘उनके गोत्रों’, जिससे लोगों के बहुवचन संदर्भ को हिन्दी में स्पष्ट किया जा सकता था।
  rationale: मूल पाठ में तीसरे पुरुष का एकवचन पुल्लिंग प्रत्यय है। भजन की काव्यात्मक भाषा में इस्राएल को एक सामूहिक व्यक्ति के रूप में देखा जा सकता है; इसलिए स्रोत की व्याकरणिक बनावट और उसकी हल्की अस्पष्टता सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और काव्यात्मक रूप अपनाया गया है। पंक्ति-विभाजन इब्रानी काव्य के दो समानांतर खंडों को दिखाता है। ‘गोत्र’ बाइबलीय संदर्भ में प्रचलित और सामान्य पाठक के लिए पर्याप्त रूप से बोधगम्य शब्द है।
