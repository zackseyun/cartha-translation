  yaml_path: translation/ot/psalms/105/044.yaml
  text: He gave them the lands of the nations[a], and they inherited the labor of the peoples.
translation:
  language: hi
  text: 'उसने उन्हें राष्ट्रों की भूमियाँ दीं,

    और उन्होंने लोगों के परिश्रम का फल[a] विरासत में पाया।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “लोगों के परिश्रम पर अधिकार किया।” इब्रानी शब्द परिश्रम स्वयं या उस परिश्रम से प्राप्त उपज अथवा संपत्ति, दोनों का संकेत कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן לָהֶם
  choice: उसने उन्हें ... दे दिए
  rationale: נתן के सामान्य अर्थ ‘देना’ और भूतकालीन कथात्मक क्रम को स्वाभाविक हिन्दी में व्यक्त करता है; बहुवचन ‘देश’ के अनुसार ‘दे दिए’ रखा गया है।
- source_word: אַרְצוֹת גּוֹיִם
  choice: जाति-जाति के देश
  rationale: אַרְצוֹת के बहुवचन को बनाए रखता है और גּוֹיִם को इस भू-राजनीतिक संदर्भ में ‘जाति-जाति’ से व्यक्त करता है।
- source_word: וַעֲמַל לְאֻמִּים
  choice: राष्ट्रों की मेहनत का फल
  rationale: עָמָל श्रम/मेहनत और उस श्रम से प्राप्त उपज या संपत्ति, दोनों की ओर संकेत कर सकता है। ‘मेहनत का फल’ हिन्दी में विरासत पाने के साथ स्वाभाविक है, जबकि पादटिप्पणी शाब्दिक विकल्प सुरक्षित रखती है।
- source_word: יִירָשׁוּ
  choice: उन्होंने ... विरासत में पाया
  rationale: ירש के अधिकार में लेने और विरासत के रूप में पाने—दोनों आयामों में से यहाँ परमेश्वर द्वारा दिए जाने के प्रसंग के अनुरूप विरासत का भाव बनाए रखता है।
theological_decisions:
- issue: ירש में वाचा-संबंधी विरासत का भाव
  choice: विरासत में पाया
  alternative: अधिकार कर लिया
  rationale: पद में भूमि पहले परमेश्वर द्वारा दी गई है; इसलिए ‘विरासत में पाया’ दैवी दान के भाव को सुरक्षित रखता है, बिना इस बात से इनकार किए कि क्रिया अधिकार प्राप्त करने को भी व्यक्त कर सकती है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। काव्यात्मक समानांतरता के लिए दो पंक्तियाँ रखी गई हैं। ‘जाति-जाति’ और ‘राष्ट्रों’ से मूल के दो निकटार्थी सामूहिक शब्दों में कुछ भिन्नता बनी रहती है।
