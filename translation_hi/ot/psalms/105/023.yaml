  text: וַ/יָּבֹ֣א יִשְׂרָאֵ֣ל מִצְרָ֑יִם וְ֝/יַעֲקֹ֗ב גָּ֣ר בְּ/אֶֽרֶץ חָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/023.yaml
  text: Then Israel came to Egypt[b][a], and Jacob lived as a foreigner in the land of Ham.
translation:
  language: hi
  text: तब इस्राएल मिस्र आया, और याकूब हाम के देश[b] में परदेशी के रूप में रहा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘प्रवासी के रूप में रहा’; इब्रानी क्रिया किसी स्थान में गैर-मूल निवासी के रूप में रहने पर बल देती है।
    reason: lexical_alternative
  - marker: b
    text: ‘हाम का देश’ मिस्र के लिए प्रयुक्त एक काव्यात्मक नाम है।
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּבֹא
  choice: तब ... आया
  rationale: वाव-युक्त कथात्मक क्रिया क्रम को आगे बढ़ाती है; ‘तब’ हिंदी में ऐतिहासिक वर्णन का स्वाभाविक प्रवाह और अनुक्रम दोनों व्यक्त करता है।
- source_word: יִשְׂרָאֵל
  choice: इस्राएल
  rationale: व्यक्तिवाचक नाम को प्रचलित हिंदी रूप में रखा गया है। समानांतर पंक्ति में ‘याकूब’ आने से कुलपिता और उससे संबद्ध समुदाय का प्रतिनिधिक संकेत बना रहता है।
- source_word: מִצְרָיִם
  choice: मिस्र
  rationale: स्थान-नाम का प्रचलित मानक हिंदी रूप।
- source_word: וְיַעֲקֹב
  choice: और याकूब
  rationale: मूल के काव्यात्मक समानांतर ‘इस्राएल // याकूब’ को सर्वनाम में समेटने के बजाय दोनों नाम सुरक्षित रखे गए हैं।
- source_word: גָּר
  choice: परदेशी होकर रहा
  rationale: גור यहाँ किसी स्थान पर गैर-मूल निवासी अथवा प्रवासी के रूप में रहने का भाव देता है। यह रूप आधुनिक हिंदी में निवास और बाहरी व्यक्ति की स्थिति दोनों स्पष्ट करता है।
- source_word: בְּאֶרֶץ חָם
  choice: हाम के देश में
  rationale: אֶרֶץ को ‘देश’ और חָם को व्यक्तिवाचक नाम ‘हाम’ के रूप में रखकर मिस्र के लिए प्रयुक्त मूल काव्यात्मक पदनाम सुरक्षित रखा गया है।
theological_decisions:
- issue: काव्यात्मक समानांतर ‘इस्राएल // याकूब’ को एक ही नाम में समेटना या दोनों को रखना
  choice: मुख्य पाठ में दोनों नाम सुरक्षित रखे गए
  alternative: ‘तब याकूब मिस्र आया और हाम के देश में परदेशी होकर रहा’ अथवा केवल ‘इस्राएल’ का प्रयोग
  rationale: इब्रानी पाठ जानबूझकर एक ही कुलपिता/प्रतिनिधिक जन को दोनों नामों से प्रस्तुत करता है। दोनों नाम रखने से काव्यात्मक बनावट और प्रतिनिधिक अर्थ सुरक्षित रहते हैं, बिना अतिरिक्त धर्मवैज्ञानिक निष्कर्ष जोड़े।
translation_notes:
  register: आधुनिक मानक हिंदी, सहज किंतु गरिमापूर्ण काव्यात्मक-ऐतिहासिक शैली। ‘परदेशी होकर रहा’ साधारण पाठक के लिए स्पष्ट है और मूल क्रिया में निहित गैर-मूल निवासी होने का भाव बनाए रखता है।
