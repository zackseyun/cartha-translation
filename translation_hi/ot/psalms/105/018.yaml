  text: They afflicted his feet with shackles[b][a]; his neck came into iron.
translation:
  language: hi
  text: 'उन्होंने उसके पैरों को बेड़ियों से जकड़कर कष्ट दिया;

    उसका प्राण लोहे में जा पड़ा।[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसकी गर्दन लोहे में जा पड़ी,” अर्थात उसे लोहे का पट्टा या जंजीर पहनाई गई। इब्रानी वाक्यांश कठिन है; “प्राण” (नेफ़ेश) कभी पूरे व्यक्ति को और संदर्भ के विस्तार से गले या गर्दन को भी सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “लोहा उसके प्राण पर आ पड़ा।”
    reason: previous_rendering
lexical_decisions:
- source_word: עִנּוּ
  choice: कष्ट दिया
  rationale: पिएल रूप यहाँ कष्ट पहुँचाने या पीड़ित करने का अर्थ देता है। अनिश्चित बहुवचन कर्ता को “उन्होंने” से रखा गया है।
- source_word: בַכֶּבֶל
  choice: बेड़ियों से जकड़कर
  rationale: כבל पैरों में डाली जाने वाली बेड़ी या बंधन को दर्शाता है। यह प्रयोग उपसर्ग ב के साधन-सूचक भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: רַגְלָיו
  choice: उसके पैरों को
  rationale: संदर्भ में यह यूसुफ के पैरों को स्पष्ट रूप से सूचित करता है।
- source_word: בַּרְזֶל
  choice: लोहे में
  rationale: मूल शब्द का सीधा अर्थ “लोहा” है। मुख्य पाठ में “लोहे का पट्टा” या “लोहे की जंजीर” जोड़ने के बजाय कठिन काव्यात्मक चित्र को बनाए रखा गया है।
- source_word: בָּאָה
  choice: जा पड़ा
  rationale: स्त्रीलिंग एकवचन क्रिया נַפְשׁוֹ से मेल खाती है, इसलिए “प्राण” को कर्ता मानकर गति और दुर्दशा दोनों का भाव व्यक्त किया गया है।
- source_word: נַפְשׁוֹ
  choice: उसका प्राण
  rationale: נפש का अर्थ प्राण, जीवन, स्वयं या व्यक्ति हो सकता है और कभी-कभी संदर्भानुसार गले/गर्दन की ओर संकेत समझा जाता है। “प्राण” मूल की व्यापकता और काव्यात्मक कठिनाई को बनाए रखता है।
