source:
  edition: WLC
  text: זָכַ֣ר לְ/עוֹלָ֣ם בְּרִית֑/וֹ דָּבָ֥ר צִ֝וָּ֗ה לְ/אֶ֣לֶף דּֽוֹר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/008.yaml
  text: He remembers his covenant forever[a], the word he commanded for a thousand generations.
translation:
  language: hi
  text: 'वह अपनी वाचा को सदा स्मरण रखता है,

    उस वचन को, जिसकी उसने हज़ार पीढ़ियों के लिए आज्ञा दी।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उस प्रतिज्ञा को, जिसकी उसने हज़ार पीढ़ियों के लिए आज्ञा दी।”
    reason: דָּבָר का संदर्भगत अर्थ 'प्रतिज्ञा' हो सकता है; मुख्य पाठ में 'वचन' इब्रानी शब्द की व्यापकता और वाचा के साथ समानांतरता बनाए रखता है।
lexical_decisions:
- source_word: זָכַר
  choice: स्मरण रखता है
  rationale: इब्रानी कालरूप पूर्ण क्रिया है, पर काव्य-संदर्भ में परमेश्वर की निरंतर वाचा-निष्ठा व्यक्त करता है; वर्तमानकालीन हिंदी इसे स्वाभाविक रूप से संप्रेषित करती है।
- source_word: לְעוֹלָם
  choice: सदा
  rationale: यह दीर्घकालिक और स्थायी अवधि दर्शाता है; 'सदा' संक्षिप्त, स्वाभाविक और काव्यात्मक हिंदी है।
- source_word: בְּרִיתוֹ
  choice: अपनी वाचा
  rationale: बाइबिल के धर्मवैचारिक संदर्भ में בְּרִית के लिए 'वाचा' मान्य और सटीक शब्द है; संबंधवाचक रचना को हिंदी में 'अपनी' से स्वाभाविक बनाया गया है।
- source_word: דָּבָר
  choice: उस वचन को
  rationale: דָּבָר का अर्थ व्यापक है। यहाँ यह वाचा के समानांतर परमेश्वर के कहे हुए वचन को सूचित करता है; 'वचन' मूल की व्यापकता और काव्यात्मक समानांतरता बचाता है।
- source_word: צִוָּה
  choice: जिसकी आज्ञा उसने ... दी थी
  rationale: पिअेल क्रिया का सीधा अर्थ 'आज्ञा देना' है। संबंधवाचक वाक्य हिंदी में अर्थ-संबंध स्पष्ट और स्वाभाविक रखता है।
- source_word: לְאֶלֶף דּוֹר
  choice: हज़ार पीढ़ियों के लिए
  rationale: ל यहाँ विस्तार अथवा अवधि सूचित करता है। संख्या के बाद इब्रानी एकवचन सामूहिक अर्थ रखता है, इसलिए हिंदी में बहुवचन 'पीढ़ियों' उचित है।
theological_decisions:
- issue: परमेश्वर के स्मरण का काल-पक्ष
  choice: वर्तमानकाल—'स्मरण रखता है'—जो निरंतर वाचा-निष्ठा व्यक्त करता है
  alternative: 'भूतकाल: ''उसने स्मरण रखा'' अथवा पूर्ण वर्तमान: ''उसने स्मरण रखा है'''
  rationale: भजन परमेश्वर की स्थायी विश्वसनीयता की स्तुति करता है; वर्तमानकाल इसे किसी एक बीती घटना तक सीमित नहीं करता।
- issue: वाचा-समानांतरता में דָּבָר का अर्थ
  choice: मुख्य पाठ में 'वचन'
  alternative: '''प्रतिज्ञा'''
  rationale: '''वचन'' मूल शब्द की अर्थगत व्यापकता और काव्यात्मक समानांतरता बनाए रखता है; संदर्भगत अर्थ ''प्रतिज्ञा'' पादटिप्पणी में दिया गया है।'
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण काव्यात्मक शैली रखी गई है। 'वाचा' और 'वचन' बाइबिलीय संदर्भ के परिचित शब्द हैं; वाक्य-विन्यास साधारण पाठकों के लिए स्पष्ट रखा गया है।
