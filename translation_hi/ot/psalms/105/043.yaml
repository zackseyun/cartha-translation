  text: So he brought out his people with joy[b][a], his chosen ones with singing.
translation:
  language: hi
  text: 'तब वह अपनी प्रजा को आनन्द के साथ,

    अपने चुने हुओं को जयगान[a] के साथ बाहर ले आया।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “आनन्द के जयघोष के साथ।” इब्रानी शब्द आनन्द से भरी ऊँची पुकार के साथ-साथ गान को भी दर्शा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצִא
  choice: तब वह … बाहर ले आया
  rationale: हिफ़ील रूप का अर्थ ‘बाहर निकलने का कारण बनाना’ है। ‘बाहर ले आया’ निर्गमन के भाव को स्वाभाविक हिन्दी में बनाए रखता है; וַ को प्रसंगगत क्रमसूचक ‘तब’ से व्यक्त किया गया है।
- source_word: עַמּוֹ
  choice: अपनी प्रजा
  rationale: עַם यहाँ परमेश्वर के अपने समुदाय को दर्शाता है। ‘अपनी प्रजा’ काव्यात्मक, स्पष्ट और वर्तमान हिन्दी में स्वाभाविक है।
- source_word: בְשָׂשׂוֹן
  choice: आनन्द के साथ
  rationale: שָׂשׂוֹן उल्लास या आनन्द को व्यक्त करता है; यह रूप पूर्वसर्ग בְ की क्रियाविशेषणीय भूमिका भी सहजता से दर्शाता है।
- source_word: בְּרִנָּה
  choice: जयगान के साथ
  rationale: רִנָּה आनन्द से भरी ऊँची पुकार या गान दोनों को सूचित कर सकता है। ‘जयगान’ उत्सवपूर्ण और श्रव्य आनन्द को संक्षेप में व्यक्त करता है; दूसरी सम्भावना पादटिप्पणी में रखी गई है।
- source_word: אֶת
  choice: '[प्रत्यक्ष कर्म-चिह्न; अलग से अनूदित नहीं]'
  rationale: यह इब्रानी का प्रत्यक्ष कर्म-सूचक है; हिन्दी वाक्य-विन्यास में इसकी भूमिका स्वतः व्यक्त हो जाती है।
- source_word: בְּחִירָיו
  choice: अपने चुने हुओं
  rationale: בחר से बना यह बहुवचन संज्ञात्मक रूप उन लोगों को दर्शाता है जिन्हें उसने चुना। ‘अपने चुने हुओं’ मूल अर्थ को स्पष्ट रखता और बाद की पारिभाषिक धर्मवैज्ञानिक शब्दावली थोपने से बचता है।
theological_decisions:
- issue: בְּחִירָיו का अनुवाद
  choice: अपने चुने हुओं
  alternative: अपने निर्वाचितों
  rationale: इब्रानी पद यहाँ निर्गमन के प्रसंग में ‘उसकी प्रजा’ के समानांतर परमेश्वर द्वारा चुने गए लोगों को बताता है। ‘चुने हुओं’ वाचा-संबंधी अर्थ को सुरक्षित रखता है, जबकि ‘निर्वाचितों’ से जुड़ सकने वाले बाद के संप्रदायगत अर्थों को अनावश्यक रूप से सामने नहीं लाता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और काव्यात्मक रखी गई है। समानांतर पंक्तियाँ इब्रानी काव्य की संरचना को बनाए रखती हैं; ‘अपनी प्रजा’ और ‘अपने चुने हुओं’ एक ही समुदाय के समानांतर वर्णन हैं।
