source:
  edition: WLC
  text: נָתַ֣ן גִּשְׁמֵי/הֶ֣ם בָּרָ֑ד אֵ֖שׁ לֶהָב֣וֹת בְּ/אַרְצָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/032.yaml
  text: He gave them hail for rain[a], and flaming fire in their land.
translation:
  language: hi
  text: उसने उनकी वर्षा के बदले ओले दिए[a], और उनके देश में धधकती आग दी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उनकी वर्षा के लिए ओले।” “धधकती आग” का अर्थ प्रसंग में “बिजली” या “अग्निमय बाण” भी हो सकता है; इब्रानी में शाब्दिक रूप से “ज्वालाओं की आग” है।
    reason: इब्रानी में ‘वर्षा’ और ‘ओले’ का संबंध संक्षिप्त और कुछ हद तक मुहावरेदार है; पादटिप्पणी वैकल्पिक संबंध तथा אֵשׁ לֶהָבוֹת के संभावित प्रसंगगत अर्थों को सुरक्षित रखती है।
lexical_decisions:
- source_word: נָתַן
  choice: बना दिया / भेजी
  rationale: मूल क्रिया का सामान्य अर्थ ‘देना’ है, पर इस काव्यात्मक संदर्भ में यह दैवी कारण को व्यक्त करती है। ‘वर्षा को ओला बना दिया’ हिन्दी में प्रतिस्थापन का भाव स्पष्ट करता है, और दूसरी पंक्ति में ‘भेजी’ स्वाभाविक हिन्दी है।
- source_word: גִּשְׁמֵיהֶם
  choice: उनकी वर्षा
  rationale: सप्रत्यय रूप का अर्थ ‘उनकी वर्षा’ है। इसे बनाए रखने से यह भाव स्पष्ट रहता है कि सामान्य वर्षा के स्थान पर ओले आए।
- source_word: בָּרָד
  choice: ओला
  rationale: यह ओले के लिए प्रचलित और सीधा हिन्दी शब्द है तथा विपत्ति-वर्णन के संदर्भ के अनुरूप है।
- source_word: אֵשׁ לֶהָבוֹת
  choice: धधकती आग
  rationale: शाब्दिक संरचना ‘ज्वालाओं की आग’ अथवा ‘लपटों वाली आग’ है। ‘धधकती आग’ तीव्रता को स्वाभाविक हिन्दी में सुरक्षित रखती है, बिना इसे मुख्य पाठ में केवल बिजली मान लेने के।
- source_word: בְּאַרְצָם
  choice: उनके देश में
  rationale: पूर्वसर्ग और सर्वनाम-सप्रत्यय का सीधा, स्वाभाविक अर्थ है; प्रसंग में यह मिस्र देश की ओर संकेत करता है।
theological_decisions:
- issue: ओलों की विपत्ति में אֵשׁ לֶהָבוֹת का स्वरूप
  choice: मुख्य पाठ में ‘धधकती आग’
  alternative: बिजली; आग के वज्र
  rationale: निर्गमन की पृष्ठभूमि बिजली का संकेत दे सकती है, पर इब्रानी शब्द सीधे ‘आग’ और ‘ज्वालाओं’ का चित्र प्रस्तुत करते हैं। इसलिए मुख्य पाठ व्यापक चित्र को बनाए रखता है और संभावित प्रसंगगत अर्थ पादटिप्पणी में देता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और काव्यात्मक रूप। समानांतर पंक्तियों में स्वाभाविक हिन्दी के लिए निहित दैवी कर्तृत्व को ‘बना दिया’ और ‘भेजी’ से व्यक्त किया गया है।
