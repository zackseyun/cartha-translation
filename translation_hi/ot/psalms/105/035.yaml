- source_word: אַדְמָתָם
  choice: उनकी भूमि
  rationale: אֲדָמָה मिट्टी, धरती या कृषि-भूमि को दर्शाता है। ‘भूमि’ कृषि-संदर्भ के लिए गरिमापूर्ण और सहज है; यह पहली पंक्ति के ‘देश’ से अर्थगत भेद भी बनाए रखता है।
