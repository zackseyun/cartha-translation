    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण बताता है; हिंदी में ‘क्योंकि’ इस व्याख्यात्मक संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: יוֹמָם וָלַיְלָה
  choice: दिन-रात
  rationale: यह निरंतरता बताने वाला युग्म है; ‘दिन-रात’ संक्षिप्त, स्वाभाविक और काव्यात्मक है।
- source_word: תִּכְבַּד ... יָדֶךָ
  choice: तेरा हाथ मुझ पर भारी रहता था
  rationale: ‘भारी हाथ’ के ठोस इब्रानी रूपक को बनाए रखता है और जारी दबाव का भाव व्यक्त करता है।
- source_word: לְשַׁדִּי
  choice: मेरी जीवन-शक्ति
  rationale: यह दुर्लभ शब्द शारीरिक नमी, जीवन-रस या प्राणशक्ति का संकेत दे सकता है; ‘जीवन-शक्ति’ संदर्भ में बोधगम्य है, जबकि अधिक शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: נֶהְפַּךְ
  choice: सूख गई थी
  rationale: क्रिया का मूल अर्थ ‘बदल गई’ है, पर ग्रीष्म की शुष्कता के संदर्भ में परिणामतः निचुड़ने या सूखने का भाव है; हिंदी में यह संदर्भगत अर्थ स्वाभाविक है और शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
- source_word: בְּחַרְבֹנֵי קַיִץ
  choice: मानो गरमी की तपती शुष्कता में
  rationale: חרבון में झुलसाने वाली गर्मी और सूखे दोनों की अर्थछाया है। यह रूप मुख्य बिंब को स्पष्ट करता है, जबकि ‘ग्रीष्म के सूखों में’ वाला अधिक शाब्दिक विकल्प पादटिप्पणी में दिया गया है।
- source_word: סֶלָה
  choice: सेला
  rationale: इस अनिश्चित संगीतात्मक या उपासना-संबंधी संकेत को अनूदित किए बिना लिप्यंतरित किया गया है।
theological_decisions:
- issue: दुःख में परमेश्वर की सक्रियता
  choice: ‘तेरा हाथ मुझ पर भारी रहता था’ कहकर ईश्वरीय सक्रियता का स्पष्ट रूपक बनाए रखा गया है।
  alternative: इसे केवल सामान्य पीड़ा या स्पष्ट दंड-सिद्धांत के रूप में समझाना।
  rationale: इब्रानी पाठ ईश्वर के हाथ को सीधे भारी बताता है, पर इस पद में उस पीड़ा की पूरी धार्मिक कार्यप्रणाली परिभाषित नहीं की गई; इसलिए तनाव को बिना अतिरिक्त सिद्धांत जोड़े सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी में सरल किंतु गरिमापूर्ण काव्यात्मक शैली रखी गई है। परमेश्वर के लिए एकवचन आत्मीय संबोधन ‘तेरा’ भजन की सीधी प्रार्थनात्मक वाणी के अनुरूप है। ‘गरमी’ सामान्य पाठक के लिए सहज है, जबकि ‘तपती शुष्कता’ मूल के ताप और सूखे दोनों बिंबों को बनाए रखती है।
