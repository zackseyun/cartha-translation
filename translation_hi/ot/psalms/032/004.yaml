  text: क्योंकि दिन-रात तेरा हाथ मुझ पर भारी रहता था; मेरी जीवन-शक्ति[a] मानो ग्रीष्म की तपन से सूख गई थी[b]। सेला
  philosophy: optimal-equivalence
