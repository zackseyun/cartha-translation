source:
  edition: WLC
  text: אַתָּ֤ה סֵ֥תֶר לִ/י֮ מִ/צַּ֪ר תִּ֫צְּרֵ֥/נִי רָנֵּ֥י פַלֵּ֑ט תְּס֖וֹבְבֵ֣/נִי סֶֽלָה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/032/007.yaml
  text: You are a hiding place for me[a]; from distress you preserve me; you surround me with shouts of deliverance[b]. Selah
translation:
  language: hi
  text: 'तू मेरे लिए छिपने का स्थान है;

    संकट से तू मेरी रक्षा करता है;

    छुटकारे के जयघोषों से तू मुझे चारों ओर से घेर लेता है।[a]

    सेलाह।[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘छुटकारे के गीतों से’ अथवा ‘बचाव की गूँजती पुकारों से।’
    reason: lexical_alternative
  - marker: b
    text: ‘सेलाह’ संभवतः संगीत या उपासना से जुड़ा कोई संकेत है; इसका सटीक अर्थ अनिश्चित है।
    reason: cultural_note
lexical_decisions:
- source_word: סֵתֶר
  choice: छिपने का स्थान
  rationale: यह संज्ञा छिपने अथवा सुरक्षा पाने के स्थान को दर्शाती है। ‘छिपने का स्थान’ मूल रूपक को स्पष्ट और स्वाभाविक हिंदी में बनाए रखता है।
- source_word: מִצַּר
  choice: संकट से
  rationale: צַר यहाँ तंगी, विपत्ति या संकट का भाव दे सकता है। ‘संकट’ किसी विशेष शत्रु को मान लिए बिना व्यापक संकटावस्था को व्यक्त करता है।
- source_word: תִּצְּרֵנִי
  choice: तू मेरी रक्षा करता है
  rationale: נצר का अर्थ संभालकर रखना, पहरा देना या रक्षा करना है। ‘रक्षा करता है’ हिंदी में स्वाभाविक है और शरण के समानांतर भाव को बनाए रखता है।
- source_word: רָנֵּי
  choice: जयघोषों
  rationale: רנה के बहुवचन रूप में ऊँची, आनंदपूर्ण पुकारों का भाव है। ‘जयघोष’ उसकी श्रव्य और उल्लासपूर्ण शक्ति को व्यक्त करता है, जबकि गीत या पुकार की निकटवर्ती संभावनाएँ टिप्पणी में सुरक्षित हैं।
- source_word: פַלֵּט
  choice: छुटकारे
  rationale: यह रूप बच निकलने, छुड़ाए जाने या उद्धार का भाव देता है। ‘छुटकारा’ सामान्य आधुनिक हिंदी में बचाव का अर्थ स्पष्ट करता है और अनावश्यक रूप से बाद की पारिभाषिक धर्मवैज्ञानिक शब्दावली नहीं जोड़ता।
- source_word: תְּסוֹבְבֵנִי
  choice: तू मुझे चारों ओर से घेर लेता है
  rationale: סבב का अर्थ चारों ओर घेरना है। यह अनुवाद मूल स्थानिक बिंब को स्पष्ट रूप से बनाए रखता है।
- source_word: סֶלָה
  choice: सेलाह
  rationale: इस शब्द का सटीक अर्थ अनिश्चित है, इसलिए अनुमानित अर्थ थोपने के बजाय इसका लिप्यंतरण किया गया है।
theological_decisions:
- issue: छुटकारे के जयघोषों का स्वरूप और स्रोत
  choice: वाक्यांश को ‘छुटकारे के जयघोषों’ के रूप में रखा गया है और यह नहीं बताया गया कि ये जयघोष कौन करता है।
  alternative: ‘छुटकारे के गीत’, ‘बचाव की पुकारें’, या परमेश्वर अथवा उपासकों को स्पष्ट रूप से इनका स्रोत बताना।
  rationale: רָנֵּי פַלֵּט संक्षिप्त और बहुअर्थी काव्यात्मक पदबंध है। चुना हुआ रूप आनंदपूर्ण तथा रक्षात्मक ध्वनि को बनाए रखता है, पर उसके स्रोत या सटीक साहित्यिक रूप को निश्चित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिंदी में सरल, काव्यात्मक और गरिमापूर्ण शैली अपनाई गई है। परमेश्वर के लिए निकट संबोधन ‘तू’ रखा गया है, जो भजन की सीधी प्रार्थनात्मक वाणी के अनुरूप है। पंक्ति-विन्यास ने इब्रानी समानांतरता को उभारा है।
