base_translation:
  language: en
  yaml_path: translation/ot/psalms/032/002.yaml
  text: Blessed is the man to whom Yahweh does not count iniquity[b][a], and in whose spirit there is no deceit.
translation:
  language: hi
  text: क्या ही धन्य है वह मनुष्य, जिसके अधर्म को यहोवा उसके विरुद्ध नहीं गिनता[a], और जिसकी आत्मा में कोई छल नहीं है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘अधर्म’ का अनुवाद ‘पाप’ या ‘दोष’ भी हो सकता है; इब्रानी शब्द अपराध और उससे उत्पन्न दोष—दोनों का भाव दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: क्या ही धन्य है
  rationale: इब्रानी बहुवचनात्मक उद्गार यहाँ धन्यता-वचन है; यह रूप उसके ऊँचे, भावपूर्ण स्वर को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: אָדָם
  choice: वह मनुष्य
  rationale: एकवचन शब्द यहाँ सामान्य प्रतिनिधिक अर्थ रखता है; ‘मनुष्य’ हिन्दी में पुरुष-मात्र तक सीमित किए बिना मूल की मानवीय संज्ञा को व्यक्त करता है।
- source_word: לֹא יַחְשֹׁב ... לֹו
  choice: जिसके ... का हिसाब ... नहीं लगाता
  rationale: חשב का लेखा/गणना-संबंधी रूपक सरल आधुनिक हिन्दी में सुरक्षित रहता है और अपराध को उसके विरुद्ध गिने जाने का भाव देता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के विशिष्ट इब्रानी नाम को हिन्दी बाइबलीय परंपरा में प्रचलित रूप से लिप्यंतरित किया गया है।
- source_word: עָוֹן
  choice: अधर्म
  rationale: यह शब्द अपराध, पाप और उससे जुड़ी दोषावस्था का अर्थ दे सकता है; ‘अधर्म’ नैतिक गंभीरता बनाए रखता है, जबकि विकल्प पादटिप्पणी में दिए गए हैं।
- source_word: בְּרוּחוֹ
  choice: जिसकी आत्मा में
  rationale: यहाँ רוּחַ व्यक्ति के भीतरी स्वभाव या मनोवृत्ति को सूचित करता है; ‘आत्मा में’ मूल रूपक को बनाए रखता है।
- source_word: רְמִיָּה
  choice: छल
  rationale: यह धोखे या कपट को दर्शाता है; ‘छल’ संक्षिप्त, स्वाभाविक और वर्तमान हिन्दी में स्पष्ट है।
theological_decisions:
- issue: सामान्य अर्थ में एकवचन אָדָם
  choice: वह मनुष्य
  alternative: वह व्यक्ति
  rationale: मूल में एक प्रतिनिधिक मानव का उल्लेख है। ‘मनुष्य’ एकवचन रूप और सामान्य मानवीय अर्थ दोनों बनाए रखता है, बिना इसे केवल पुरुषों तक सीमित किए।
- issue: परमेश्वर द्वारा अधर्म न गिने जाने का लेखा-रूपक
  choice: अधर्म का हिसाब ... नहीं लगाता
  alternative: अधर्म को उसके विरुद्ध नहीं गिनता
  rationale: मुख्य पाठ सुलभ हिन्दी में حساب/गणना का रूपक सुरक्षित रखता है और इसे किसी बाद की व्यवस्थित धर्मशास्त्रीय शब्दावली में सीमित नहीं करता।
- issue: עָוֹן की अर्थ-व्याप्ति
  choice: अधर्म
  alternative: पाप या दोष
  rationale: संदर्भ अपराध और क्षमा से जुड़ा है, पर इब्रानी शब्द स्वयं अपराध, दोष और परिणाम की परस्पर जुड़ी धारणाएँ रख सकता है; पादटिप्पणी इस अस्पष्टता को बचाती है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। धन्यता-वचन का काव्यात्मक स्वर तथा हिसाब लगाने का मूल रूपक बनाए रखा गया है।
