  text: Of David[a]. A Maskil. Blessed is the one whose transgression is forgiven[b], whose sin is covered.
translation:
  language: hi
  text: 'दाऊद का। मस्कील[a]।


    धन्य है वह जिसका अपराध क्षमा किया गया है,

    जिसका पाप ढका हुआ है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी: मस्कील। यह भजन के शीर्षक में प्रयुक्त एक शब्द है, जिसका ठीक अर्थ अनिश्चित है; संभवतः यह शिक्षाप्रद या मननशील रचना को सूचित करता है।'
    reason: cultural_note
lexical_decisions:
- source_word: לְדָוִד
  choice: दाऊद का
  rationale: भजन के शीर्षक में לְ का संबंध लचीला है और लेखकत्व, समर्पण या संबद्धता सूचित कर सकता है। “दाऊद का” स्वाभाविक और पारंपरिक है तथा “दाऊद द्वारा रचित” जैसी अनावश्यक निश्चितता से बचता है।
- source_word: מַשְׂכִּיל
  choice: मस्कील
  rationale: इस शीर्षकीय शब्द का ठीक अर्थ और कार्य अनिश्चित है। लिप्यंतरण इस अनिश्चितता को बनाए रखता है; संभावित अर्थ पादटिप्पणी में दिए गए हैं।
- source_word: אַשְׁרֵי
  choice: धन्य है
  rationale: यह रूप आशीषपूर्ण अवस्था की उद्घोषणा करता है। “धन्य है” आधुनिक हिन्दी में संक्षिप्त, गरिमापूर्ण और धर्मवैचारिक भाव से युक्त है।
- source_word: נְשׂוּי
  choice: क्षमा कर दिया गया
  rationale: נשׂא का मूल बिंब “उठाना/ले जाना” है, पर अपराध के साथ इसका मुहावरेदार अर्थ क्षमा करना है। मुख्य पाठ स्पष्ट अर्थ देता है और मूल बिंब पादटिप्पणी में सुरक्षित है।
- source_word: פֶּשַׁע
  choice: अपराध
  rationale: यह जानबूझकर सीमा लाँघने या विद्रोहपूर्ण उल्लंघन का भाव रखता है। “अपराध” सामान्य पाठक के लिए स्वाभाविक है और समानांतर “पाप” से पर्याप्त भेद भी बनाए रखता है।
- source_word: כְּסוּי
  choice: ढक दिया गया
  rationale: यह כסה का कर्मवाच्य कृदंत है। “ढक दिया गया” मूल रूपक और पहली पंक्ति के साथ काव्यात्मक समानांतरता बनाए रखता है।
- source_word: חֲטָאָה
  choice: पाप
  rationale: यहाँ यह नैतिक दोष को दर्शाता है और “अपराध” के समानांतर आता है; इस संदर्भ में “पापबलि” अभिप्रेत नहीं है।
theological_decisions:
- issue: धन्य-वचन के प्रतिनिधिक एकवचन को व्यक्त करना
  choice: धन्य है वह
  alternative: धन्य हैं वे; धन्य है वह मनुष्य
  rationale: इब्रानी वाक्य अर्थ की दृष्टि से प्रतिनिधिक एकवचन है। “वह” एकवचन को बनाए रखते हुए अनावश्यक रूप से पुरुष-लिंग तक सीमित नहीं करता।
- issue: शीर्षकीय शब्द מַשְׂכִּיל का निर्वचन
  choice: मुख्य पाठ में “मस्कील” बनाए रखना
  alternative: शिक्षाप्रद भजन; मनन-गीत
  rationale: शब्द का सटीक अर्थ और साहित्यिक अथवा संगीतिक कार्य विवादित है; इसलिए किसी एक व्याख्या को मुख्य पाठ में निश्चित कर देना उचित नहीं है।
- issue: पाप के “ढके जाने” का रूपक
  choice: रूपक को ज्यों का त्यों रखना
  alternative: जिसका पाप क्षमा किया गया है
  rationale: “ढक दिया गया” इब्रानी काव्य का विशिष्ट रूपक है और पहली पंक्ति के साथ अर्थपूर्ण समानांतरता रखता है; इसे केवल “क्षमा” कह देने से काव्यात्मक तनाव घट जाता।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, काव्यात्मक और गरिमापूर्ण शैली अपनाई गई है। पंक्ति-विन्यास इब्रानी समानांतरता को स्पष्ट करता है। शीर्षक में “दाऊद का” रखा गया है ताकि लेखकत्व को आवश्यकता से अधिक निश्चित न किया जाए।
