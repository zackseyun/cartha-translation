source:
  edition: WLC
  text: כִּֽי הֶ֭חֱרַשְׁתִּי בָּל֣וּ עֲצָמָ֑/י בְּ֝/שַׁאֲגָתִ֗/י כָּל הַ/יּֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/032/003.yaml
  text: For when I kept silent[a], my bones wasted away through my groaning all day long.
translation:
  language: hi
  text: क्योंकि जब मैं चुप रहा, तब दिन भर मेरे कराहने[a] से मेरी हड्डियाँ घुलती गईं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरे गरजने से।” इब्रानी शब्द सिंह जैसी ऊँची गर्जना या तीखी पुकार का अर्थ दे सकता है; यहाँ संभवतः पीड़ा से निकली कराह अभिप्रेत है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि जब
  rationale: यहाँ כִּי पिछले कथन की व्याख्या करते हुए उस समय की परिस्थिति बताता है; ‘क्योंकि जब’ इस संबंध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הֶחֱרַשְׁתִּי
  choice: मैं चुप रहा
  rationale: חרשׁ का अर्थ यहाँ ‘चुप रहना’ है। पाप के विषय में चुप्पी संदर्भ से समझ में आती है, पर मूल पद में उसका स्पष्ट उल्लेख नहीं है।
- source_word: בָּלוּ
  choice: घुलती गईं
  rationale: בלה जीर्ण होने, चुकने या क्षीण होते जाने का भाव देता है। हड्डियों के साथ ‘घुलती गईं’ शारीरिक और भीतरी क्षय की काव्यात्मक छवि को सहज हिन्दी में बनाए रखता है।
- source_word: עֲצָמָי
  choice: मेरी हड्डियाँ
  rationale: शाब्दिक देहगत बिंब सुरक्षित रखा गया है; भजन की कविता में हड्डियाँ पूरे व्यक्ति की आंतरिक दशा को भी प्रकट करती हैं।
- source_word: בְּשַׁאֲגָתִי
  choice: मेरे कराहने से
  rationale: שׁאגה ऊँची पुकार या गर्जना को भी सूचित कर सकता है, पर यहाँ पीड़ा की मुखर अभिव्यक्ति के लिए ‘कराहना’ प्रसंगानुकूल और स्वाभाविक है। בְּ को साथ रहने वाले कारण या माध्यम के रूप में ‘से’ द्वारा व्यक्त किया गया है।
- source_word: כָּל הַיּוֹם
  choice: दिन भर
  rationale: यह निरंतर अवधि को संक्षिप्त और स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: क्या चुप रहने का विषय पाप को स्पष्ट रूप से बनाया जाए
  choice: मुख्य पाठ में इसे निहित ही रखा गया
  alternative: जब मैं अपने पाप के विषय में चुप रहा
  rationale: आस-पास का संदर्भ पाप न मानने की ओर संकेत करता है, किंतु इस पद के इब्रानी पाठ में चुप्पी का कर्म स्पष्ट नहीं किया गया। इसलिए अनुवाद मूल की संक्षिप्तता और निहित तनाव को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘मेरी हड्डियाँ घुलती गईं’ मूल की शारीरिक-काव्यात्मक छवि को बनाए रखता है। पादटिप्पणी का चिह्न उसी शब्द पर रखा गया है जिससे उसका वास्तविक शाब्दिक विकल्प संबंधित है।
