  yaml_path: translation/ot/psalms/032/000.yaml
  text: Of David[a]. A Maskil. Blessed is the one whose transgression is forgiven[b], whose sin is covered.
translation:
  language: hi
  text: 'दाऊद का। मश्कील[a]।


    धन्य है वह, जिसका अपराध क्षमा किया गया[b], जिसका पाप ढक दिया गया।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी: मश्कील। यह भजन के शीर्षक में प्रयुक्त एक शब्द है, जिसका ठीक अर्थ निश्चित नहीं है; संभवतः यह शिक्षाप्रद या मननपरक रचना को दर्शाता है।'
    reason: cultural_note
  - marker: b
    text: 'शाब्दिक अर्थ: ‘उठा लिया गया’ या ‘दूर ले जाया गया।’'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדָוִד
  choice: दाऊद का
  rationale: शीर्षक में לְ संबंध या रचनाकारिता बता सकता है; संक्षिप्त हिंदी रूप मूल की संक्षिप्तता और कुछ हद तक उसकी व्यापकता बनाए रखता है।
- source_word: מַשְׂכִּיל
  choice: मश्कील
  rationale: यह भजन-शीर्षक का तकनीकी शब्द है और इसका ठीक अर्थ अनिश्चित है; लिप्यंतरण करके संभावित अर्थ पादटिप्पणी में दिए गए हैं।
- source_word: אַשְׁרֵי
  choice: धन्य है वह
  rationale: यह सुखी और परम अनुगृहीत दशा की घोषणा है; आधुनिक हिंदी में स्वाभाविक और गरिमापूर्ण अभिव्यक्ति।
- source_word: נְשׂוּי פֶּשַׁע
  choice: जिसका अपराध क्षमा किया गया
  rationale: נשׂא का शाब्दिक बिंब ‘उठा लेना/दूर ले जाना’ है, पर इस प्रसंग में स्वाभाविक अर्थ क्षमा किया जाना है; मूल बिंब पादटिप्पणी में सुरक्षित है।
- source_word: כְּסוּי חֲטָאָה
  choice: जिसका पाप ढक दिया गया
  rationale: मूल के ‘ढकने’ वाले रूपक को सीधे बनाए रखा गया है, बिना उसे किसी अतिरिक्त धर्मवैज्ञानिक व्याख्या में बदलने के।
theological_decisions:
- issue: अपराध के ‘उठा लिए जाने’ का अर्थ
  choice: मुख्य पाठ में ‘क्षमा किया गया’, साथ में शाब्दिक बिंब की पादटिप्पणी
  alternative: ‘जिसका अपराध उठा लिया गया’
  rationale: क्षमा का संदर्भगत अर्थ सामान्य पाठक के लिए स्पष्ट रहता है, जबकि पादटिप्पणी इब्रानी रूपक और उसकी धर्मवैज्ञानिक गहराई को सुरक्षित रखती है।
- issue: पाप का ढका जाना
  choice: ‘जिसका पाप ढक दिया गया’
  alternative: ‘जिसका पाप क्षमा किया गया’
  rationale: दूसरी पंक्ति को पहली में विलीन करने के बजाय मूल की समानांतर किंतु अलग रूपकात्मक भाषा बनाए रखी गई है।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी में सरल, गरिमापूर्ण और काव्यात्मक रखी गई है। शीर्षक की संक्षिप्त शैली सुरक्षित है; अनिश्चित तकनीकी पद का लिप्यंतरण किया गया है और दोनों इब्रानी रूपकों में से ‘ढक दिया गया’ को मुख्य पाठ में ज्यों का त्यों रखा गया है।
