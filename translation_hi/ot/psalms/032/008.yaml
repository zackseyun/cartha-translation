  text: I will instruct you and teach you in the way you should go[c][b][a]; I will counsel you with my eye upon you.
translation:
  language: hi
  text: मैं तुम्हें समझ-बूझ दूँगा और उस मार्ग पर तुम्हें सिखाऊँगा जिस पर तुम्हें चलना चाहिए[a][c]; मैं तुम्हें परामर्श दूँगा; मेरी दृष्टि तुम पर रहेगी[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जिस पर तुम चलोगे,” अथवा “इस मार्ग पर तुम चलोगे।” इब्रानी शब्दावली अधिक शाब्दिक भविष्यकालीन अर्थ की अनुमति देती है, पर शिक्षा का प्रसंग “जिस पर तुम्हें चलना चाहिए” का समर्थन करता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “तुम पर मेरी आँख।” यह सजग मार्गदर्शन या ध्यानपूर्ण देखभाल व्यक्त कर सकता है।
    reason: lexical_alternative
  - marker: c
    text: वक्ता यहोवा भी समझा जा सकता है और भजनकार भी; इस पद का इब्रानी पाठ स्वयं वक्ता की पहचान स्पष्ट नहीं करता।
    reason: alternative_reading
lexical_decisions:
- source_word: אַשְׂכִּילְךָ
  choice: मैं तुम्हें समझ दूँगा
  rationale: שׂכל के हिफ़ील रूप का कारणवाचक भाव है—किसी को समझ या सूझ देना। यह अनुवाद उस भाव को स्पष्ट रखता है और अगले शिक्षण-संबंधी क्रियापद के साथ स्वाभाविक समानांतरता बनाता है।
- source_word: וְאוֹרְךָ
  choice: और ... तुम्हें सिखाऊँगा
  rationale: ירה के हिफ़ील रूप में सिखाने, निर्देश देने और मार्ग दिखाने के अर्थ सम्मिलित हैं। 'मार्ग के विषय में तुम्हें सिखाऊँगा' शिक्षण और दिशा-निर्देशन दोनों भावों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בְּדֶרֶךְ זוּ תֵלֵךְ
  choice: उस मार्ग के विषय में ... जिस पर तुम्हें चलना चाहिए
  rationale: इब्रानी संरचना का अधिक शाब्दिक अर्थ भविष्यसूचक भी हो सकता है—'जिस पर तुम चलोगे'—पर निर्देश के प्रसंग में हिन्दी का 'जिस पर तुम्हें चलना चाहिए' अभिप्रेत मार्गदर्शन को सहज रूप से व्यक्त करता है; वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: אִיעֲצָה
  choice: मैं ... परामर्श दूँगा
  rationale: יעץ का अर्थ परामर्श या सम्मति देना है। 'परामर्श दूँगा' भजन के गरिमापूर्ण, ज्ञानपरक स्वर के अनुकूल है।
- source_word: עָלֶיךָ עֵינִי
  choice: तुम पर अपनी दृष्टि रखकर
  rationale: शाब्दिक बिंब 'तुम पर मेरी आँख' है। 'अपनी दृष्टि रखकर' उस सजग, व्यक्तिगत ध्यान के रूपक को प्राकृतिक आधुनिक हिन्दी में बनाए रखता है।
theological_decisions:
- issue: भजन 32:8 में वक्ता की पहचान
  choice: पद को प्रथम पुरुष में रखा गया है, पर वक्ता को स्पष्ट रूप से न तो यहोवा और न भजनकार कहा गया है।
  alternative: वक्ता को स्पष्टतः यहोवा मानना, अथवा भजनकार को श्रोता से बोलता हुआ मानना।
  rationale: इस पद के इब्रानी पाठ में वक्ता की पहचान स्पष्ट नहीं की गई है। मुख्य पाठ इस खुलेपन को बनाए रखता है और दोनों संभावनाओं को पादटिप्पणी में बताता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु साधारण पाठकों के लिए स्पष्ट रूप अपनाया गया है। 'समझ दूँगा,' 'सिखाऊँगा,' और 'परामर्श दूँगा' मूल की शिक्षणपरक समानांतरता को रखते हैं। 'दृष्टि रखकर' मूल के नेत्र-संबंधी रूपक को अनावश्यक रूप से अमूर्त किए बिना स्वाभाविक हिन्दी में प्रस्तुत करता है।
