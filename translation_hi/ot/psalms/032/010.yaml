  yaml_path: translation/ot/psalms/032/010.yaml
  text: Many pains belong to the wicked[b][a], but steadfast love surrounds the one who trusts in Yahweh.
translation:
  language: hi
  text: दुष्ट के लिए बहुत-से दुःख हैं[a], पर जो याहवे पर भरोसा रखता है, उसे अटल प्रेम[b] घेरे रहता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “दुष्ट को बहुत-सी पीड़ाएँ मिलती हैं।” इब्रानी संज्ञा शारीरिक पीड़ाओं, शोकों या अन्य कष्टों का बोध करा सकती है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी חֶסֶד का अर्थ सन्दर्भ के अनुसार “करुणा,” “निष्ठावान प्रेम” या “वाचा का प्रेम” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: רַבִּים
  choice: बहुत-से
  rationale: मात्रा की अधिकता को स्वाभाविक हिन्दी में व्यक्त करता है और आरम्भिक बलाघात बनाए रखता है।
- source_word: מַכְאוֹבִים
  choice: दुःख
  rationale: यह शब्द शारीरिक पीड़ा, मानसिक शोक और व्यापक कष्ट को समेट सकता है; ‘दुःख’ आधुनिक हिन्दी में इसी अर्थ-विस्तार को सहजता से रखता है।
- source_word: לָרָשָׁע
  choice: दुष्ट के लिए
  rationale: לְ के सम्बन्धसूचक/दत्तिव अर्थ को बिना यह तय किए सुरक्षित रखता है कि दुःख उसके अपने हैं या उस पर आते हैं; एकवचन רָשָׁע को प्रतिनिधिक अर्थ में लिया गया है।
- source_word: וְהַבּוֹטֵחַ
  choice: पर जो ... भरोसा रखता है
  rationale: संज्ञात्मक कृदन्त को स्वाभाविक हिन्दी सम्बन्धवाचक रचना में व्यक्त किया गया है; वाक्य के स्पष्ट विरोध के कारण וְ को ‘पर’ कहा गया है।
- source_word: בַּיהוָה
  choice: यहोवा पर
  rationale: בטח ב का स्वाभाविक हिन्दी रूप ‘पर भरोसा रखना’ है; परमेश्वर का निज नाम יְהוָה ‘यहोवा’ के रूप में लिप्यंतरित है।
- source_word: חֶסֶד
  choice: अटल प्रेम
  rationale: निष्ठावान, स्थायी और दयापूर्ण प्रेम के भाव को संक्षिप्त तथा सहज हिन्दी में व्यक्त करता है, बिना अर्थ को केवल ‘दया’ तक सीमित किए।
- source_word: יְסוֹבְבֶנּוּ
  choice: उसे ... घेरे रहता है
  rationale: क्रिया के घेरने/चारों ओर होने के अर्थ और अपूर्ण क्रिया की स्थायी प्रकृति को स्वाभाविक हिन्दी में दर्शाता है; प्रत्यय का संकेत ‘उसे’ से स्पष्ट है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का रूप
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में निज वाचा-नाम है, इसलिए उसे किसी उपाधि से बदलने के बजाय हिन्दी में व्यापक रूप से पहचाने जाने वाले ‘यहोवा’ रूप में रखा गया है।
- issue: חֶסֶד का धर्मवैचारिक अर्थ-विस्तार
  choice: अटल प्रेम
  alternative: करुणा / वाचा का प्रेम
  rationale: ‘अटल प्रेम’ निष्ठा और स्थायित्व दोनों को बनाए रखता है; केवल ‘करुणा’ अर्थ को संकरा कर सकती है, जबकि ‘वाचा का प्रेम’ इस पद में निहित सम्भावित वाचागत आयाम को मुख्य पाठ में आवश्यकता से अधिक स्पष्ट कर देगा।
- issue: רָשָׁע का प्रतिनिधिक पुल्लिंग एकवचन
  choice: दुष्ट
  alternative: दुष्ट मनुष्य
  rationale: यहाँ एकवचन किसी एक पुरुष पर नहीं, एक प्रकार के व्यक्ति पर सामान्य कथन है; ‘दुष्ट’ हिन्दी में प्रतिनिधिक और संक्षिप्त है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और काव्यात्मक रूप। दोनों अर्धपंक्तियों का विरोध ‘पर’ से स्पष्ट किया गया है। ‘दुष्ट के लिए’ मूल सम्बन्धसूचक वाक्य-विन्यास की अस्पष्टता को सुरक्षित रखता है, और ‘घेरे रहता है’ निरन्तर सुरक्षा तथा उपस्थिति का भाव देता है।
