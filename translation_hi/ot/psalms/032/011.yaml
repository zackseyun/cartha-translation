lexical_decisions:
- source_word: שִׂמְחוּ
  choice: आनन्दित हो
  rationale: बहुवचन आज्ञार्थक रूप प्रसन्न होने का आह्वान करता है; यह स्वाभाविक हिन्दी है और अगले समानार्थी क्रिया-पद से कुछ भिन्नता बनाए रखता है।
- source_word: בַיהוָה
  choice: याहवे में
  rationale: ב यहाँ आनन्द के आधार या क्षेत्र को व्यक्त करता है; परमेश्वर के व्यक्तिगत नाम יהוה को लिप्यंतरित किया गया है।
- source_word: וְגִילוּ
  choice: और मगन हो
  rationale: गहन और उल्लसित आनन्द व्यक्त करने वाले बहुवचन आज्ञार्थक גיל को वर्तमान, सहज हिन्दी में प्रस्तुत करता है।
- source_word: צַדִּיקִים
  choice: हे धर्मियो
  rationale: यह आज्ञाओं के संबोधन में प्रयुक्त बहुवचन संज्ञा है; सम्बोधन-रूप हिन्दी में सीधे संबोधन को स्पष्ट करता है।
- source_word: וְהַרְנִינוּ
  choice: आनन्द से जयजयकार करो
  rationale: हिफ़ील बहुवचन आज्ञार्थक רנן ऊँची, गूँजती हर्षध्वनि को व्यक्त करता है; यह गायन या पुकार में से किसी एक को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: כָּל יִשְׁרֵי לֵב
  choice: हे सब सीधे मनवालो
  rationale: יִשְׁרֵי לֵב भीतरी नैतिक खराई का मुहावरा है; 'सीधे मनवाले' साधारण आधुनिक हिन्दी में हृदयगत सच्चाई और खराई को बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में उपाधि नहीं, चतुरक्षरीय व्यक्तिगत नाम है। 'याहवे' उसका व्यापक रूप से स्वीकृत विद्वत्तापूर्ण लिप्यंतरण है और नाम को उपाधि से प्रतिस्थापित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, काव्यात्मक और सामूहिक उपासना के अनुकूल शैली। समानान्तर तीन आज्ञार्थक पदों की तीव्रता तथा दोनों प्रत्यक्ष संबोधनों को सुरक्षित रखा गया है।
