language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אַל תִּֽהְי֤וּ כְּ/ס֥וּס כְּ/פֶרֶד֮ אֵ֤ין הָ֫בִ֥ין בְּ/מֶֽתֶג וָ/רֶ֣סֶן עֶדְי֣/וֹ לִ/בְל֑וֹם בַּ֝֗ל קְרֹ֣ב אֵלֶֽי/ךָ־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/032/009.yaml
  text: Do not be like a horse or like a mule[a], without understanding, whose trappings are bit and bridle to restrain it, or else it will not come near you.
translation:
  language: hi
  text: तुम ऐसे घोड़े या खच्चर के समान न बनो, जिसमें समझ नहीं होती; उसका साज मुँह की लगाम और बाग है, जिनसे उसे काबू में रखा जाता है, नहीं तो वह तुम्हारे पास नहीं आएगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “कहीं वह तुम्हारे पास न आ जाए।” इब्रानी में अंतिम वाक्यांश कठिन है। इसका अर्थ या तो यह हो सकता है कि पशु काबू में किए बिना पास नहीं आएगा, या यह कि उसे इसलिए रोकना है कि वह तुम्हारे पास न आ जाए।
    reason: इब्रानी के कठिन अंतिम वाक्यांश की वैकल्पिक व्याख्या सुरक्षित रखना।
lexical_decisions:
- source_word: אַל תִּהְיוּ
  choice: तुम ... न बनो
  rationale: אַל के साथ היה का अपूर्ण रूप निषेध व्यक्त करता है। बहुवचन संबोधन को ‘तुम’ से सुरक्षित रखा गया है; तुलना के संदर्भ में ‘न बनो’ स्वाभाविक हिंदी है।
- source_word: כְּסוּס כְּפֶרֶד
  choice: ऐसे घोड़े या खच्चर के समान
  rationale: כְּ का तुलनात्मक अर्थ और दोनों एकवचन पशु-चित्र सुरक्षित हैं। हिंदी में ‘या’ तुलना को सहज बनाता है।
- source_word: אֵין הָבִין
  choice: जिसमें समझ नहीं होती
  rationale: यह पशु में समझ-बूझ के अभाव को बताता है। सापेक्ष उपवाक्य हिंदी में पशु-चित्र से स्पष्ट रूप से जुड़ता है।
- source_word: בְּמֶתֶג וָרֶסֶן
  choice: मुँह की लगाम और बाग
  rationale: दोनों शब्द पशु को नियंत्रित करने वाले मुख-साज को सूचित करते हैं। ‘मुँह की लगाम’ bit का कार्य स्पष्ट करती है और ‘बाग’ दूसरे नियंत्रण-साधन को अलग रखती है।
- source_word: עֶדְיוֹ
  choice: उसका साज
  rationale: עֲדִי का सामान्य अर्थ आभूषण या सज्जा है, पर यहाँ लगाम-बाग के संदर्भ में पशु पर चढ़ाया गया साज अभिप्रेत है। ‘साज’ इस ठोस चित्र को बिना अनावश्यक विस्तार के रखता है।
- source_word: לִבְלֹם
  choice: काबू में रखा जाता है
  rationale: בלם का अर्थ रोकना या नियंत्रण में रखना है। निष्क्रिय वाक्य-विन्यास हिंदी में साज के कार्य को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: בַּל קְרֹב אֵלֶיךָ
  choice: नहीं तो वह तुम्हारे पास नहीं आएगा
  rationale: कठिन अंतिम वाक्यांश का एक संगत अर्थ यह है कि पशु को नियंत्रित किए बिना वह पास नहीं आएगा। इब्रानी के एकवचन पशु-चित्र को ‘वह’ से रखा गया है; दूसरी संभव व्याख्या पादटिप्पणी में दी गई है।
