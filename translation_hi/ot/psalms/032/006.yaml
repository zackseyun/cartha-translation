id: PSA.32.6
reference: Psalms 32:6
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: עַל זֹ֡את יִתְפַּלֵּ֬ל כָּל חָסִ֨יד אֵלֶי/ךָ֮ לְ/עֵ֪ת מְ֫צֹ֥א רַ֗ק לְ֭/שֵׁטֶף מַ֣יִם רַבִּ֑ים אֵ֝לָ֗י/ו לֹ֣א יַגִּֽיעוּ־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/032/006.yaml
  text: Therefore let every godly one pray to you at a time when you may be found[a]; surely when the great floodwaters come[b], they will not reach him.
translation:
  language: hi
  text: इसलिए हर भक्त जन ऐसे समय में तुझसे प्रार्थना करे जब तुझे पाया जा सकता है[a]; निश्चय ही जब प्रचंड बाढ़ के जल उमड़ेंगे[b], तो वे उस तक नहीं पहुँचेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इस बात के लिए हर निष्ठावान जन तुझसे प्रार्थना करे, जब तुझे पाया जा सकता है।”
    reason: עַל זֹאת का अर्थ ‘इस बात के लिए’ भी हो सकता है, और חָסִיד में भक्तिभाव के साथ निष्ठा का अर्थ भी निहित है।
  - marker: b
    text: 'शाब्दिक अर्थ: “बहुत-से जल की बाढ़ में।”'
    reason: मूल हिब्रू की जल-बाढ़ संबंधी अभिव्यक्ति का अधिक शाब्दिक रूप सुरक्षित रखने के लिए।
lexical_decisions:
- source_word: עַל זֹאת
  choice: इसलिए
  rationale: यह पद पिछले कथन में पाप-स्वीकार और क्षमा से निकला निष्कर्ष बताता है; ‘इसलिए’ उस संबंध को सहज हिन्दी में व्यक्त करता है।
- source_word: יִתְפַּלֵּל
  choice: प्रार्थना करे
  rationale: संदर्भ में अपूर्ण क्रिया का भाव उपदेशात्मक या प्रोत्साहनसूचक है, इसलिए विधिलिंग उपयुक्त है।
- source_word: כָּל חָסִיד
  choice: हर भक्त जन
  rationale: חָסִיד ईश्वर के प्रति निष्ठावान और भक्त व्यक्ति का बोध कराता है। ‘भक्त जन’ आधुनिक हिन्दी में सहज है और एक प्रतिनिधि व्यक्ति के एकवचन भाव को बनाए रखता है।
- source_word: אֵלֶיךָ
  choice: तुझसे
  rationale: यह प्रार्थना की दिशा, अर्थात सीधे परमेश्वर को संबोधन, व्यक्त करता है; मूल में ‘परमेश्वर’ संज्ञा जोड़ी नहीं गई है।
- source_word: לְעֵת מְצֹא
  choice: ऐसे समय में ... जब तुझे पाया जा सकता है
  rationale: מצא के क्रियारूप को यहाँ प्रचलित निष्क्रिय अर्थ में समझा गया है—वह अवसर जब परमेश्वर को पाया जा सकता है। हिन्दी वाक्य में निहित कर्म ‘तुझे’ स्पष्ट करना स्वाभाविक है।
- source_word: רַק
  choice: निश्चय ही
  rationale: यहाँ רַק केवल सीमाबोधक ‘केवल’ नहीं, बल्कि अगले आश्वासन पर बल देने वाला निश्चयवाचक अव्यय है।
- source_word: לְשֵׁטֶף מַיִם רַבִּים
  choice: जब प्रचंड बाढ़ का जल उमड़ेगा
  rationale: मूल चित्र बहुत-से उमड़ते जल का है। यह अनुवाद उस प्रबल बाढ़ की काव्यात्मक छवि को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: אֵלָיו לֹא יַגִּיעוּ
  choice: वह उस तक नहीं पहुँचेगा
  rationale: हिब्रू में पूर्वसर्ग सहित अर्थ ‘उस तक नहीं पहुँचेंगे’ है। हिन्दी में सामूहिक ‘बाढ़ का जल’ एकवचन क्रिया के साथ स्वाभाविक है और संपर्क या पहुँचने का मूल भाव सुरक्षित रहता है।
theological_decisions:
- issue: सुरक्षा की प्रतिज्ञा में ‘उस’ का संकेत
  choice: ‘उस’ से प्रार्थना करने वाला भक्त जन अभिप्रेत है, और बाढ़ की छवि को रूपक के रूप में खुला रखा गया है।
  alternative: इसे शाब्दिक बाढ़ से सुरक्षा मानना, या सर्वनाम को परमेश्वर की ओर संकेत करता समझना।
  rationale: निकटतम वाक्य-संबंध אֵלָיו को भक्त जन से जोड़ता है। भजन-साहित्य में उमड़ता जल विपत्ति या न्याय की सामान्य काव्यात्मक छवि है; अनुवाद इसे किसी एक विशेष घटना या सिद्धान्त तक सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। परमेश्वर के सीधे काव्यात्मक संबोधन में ‘तू/तुझसे/तुझे’ का प्रयोग किया गया है; यह अनादर नहीं, बल्कि हिन्दी बाइबिलीय काव्य में निकट और प्रत्यक्ष संबोधन को दर्शाता है।
