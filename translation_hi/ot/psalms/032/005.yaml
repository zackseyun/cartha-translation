  text: I made my sin known to you[a], and I did not cover my iniquity. I said, “I will confess my transgressions to Yahweh,” and you forgave the iniquity of my sin. Selah
translation:
  language: hi
  text: 'मैंने अपना पाप तुझे बता दिया,

    और अपना अधर्म नहीं छिपाया।

    मैंने कहा, “मैं यहोवा के सामने अपने अपराध स्वीकार करूँगा,”

    और तूने मेरे पाप का दोष क्षमा कर दिया।[a]

    सेला।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी क्रिया का शाब्दिक अर्थ ‘उठा लेना’ या ‘वहन करना’ है; इस संदर्भ में पाप के दोष को उठा लेने का अर्थ उसे क्षमा करना है।
    reason: नשא की मूल रूपकात्मक छवि और उसके प्रसंगगत अर्थ—क्षमा—दोनों को स्पष्ट करना।
lexical_decisions:
- source_word: חַטָּאתִי
  choice: अपना पाप
  rationale: חטאת के सामान्य अर्थ ‘पाप’ को सीधे रखता है और पद में प्रयुक्त तीन अलग पाप-संबंधी शब्दों का भेद बनाए रखता है।
- source_word: אוֹדִיעֲךָ
  choice: तुझ पर प्रकट किया
  rationale: ידע के हिफ़ील रूप का मूल भाव ‘किसी को ज्ञात कराना’ है। ‘तुझ पर प्रकट किया’ आधुनिक हिन्दी में स्वाभाविक रहते हुए जानबूझकर स्वीकार करने का भाव देता है।
- source_word: עֲוֺנִי
  choice: अपना अधर्म
  rationale: עון यहाँ नैतिक कुटिलता या अधर्म का बोध देता है; यह חטאת ‘पाप’ और פשע ‘अपराध’ से शब्दगत भेद बनाए रखता है।
- source_word: לֹא כִסִּיתִי
  choice: नहीं छिपाया
  rationale: כסה का शाब्दिक अर्थ ‘ढाँकना’ है, पर इस संदर्भ में हिन्दी का स्वाभाविक अर्थ ‘छिपाना’ है।
- source_word: אוֹדֶה
  choice: मान लूँगा
  rationale: ידה का हिफ़ील रूप यहाँ अपराधों के संदर्भ में ‘स्वीकार करना/मान लेना’ है, न कि ‘धन्यवाद देना’।
- source_word: עֲלֵי פְשָׁעַי
  choice: अपने अपराधों को … के सामने
  rationale: על स्वीकारोक्ति के विषय को चिह्नित करता है। हिन्दी में ‘अपराधों को … के सामने मान लेना’ इस संबंध को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: לַיהוָה
  choice: यहोवा के सामने
  rationale: लक्षित हिन्दी परंपरा में יהוה के व्यक्तिगत वाचा-नाम को ‘यहोवा’ के रूप में स्पष्ट रखा गया है; ל को स्वीकारोक्ति के प्राप्तकर्ता के अनुसार ‘के सामने’ कहा गया है।
- source_word: נָשָׂאתָ
  choice: उठा लिया
  rationale: נשא का मूल चित्र ‘उठाना/ले जाना’ है। इसे मुख्य पाठ में रखने से क्षमा के साथ बोझ हटाए जाने की छवि भी बनी रहती है।
- source_word: עֲוֺן חַטָּאתִי
  choice: मेरे पाप का दोष
  rationale: सम्बन्धवाचक संरचना को स्वाभाविक हिन्दी में रखते हुए עון के यहाँ ‘दोष/अपराध-दायित्व’ वाले अर्थ को व्यक्त करता है।
- source_word: סֶלָה
  choice: सेला
  rationale: इस सांगीतिक या उपासना-संबंधी पद का ठीक अर्थ अनिश्चित है, इसलिए अर्थ आरोपित करने के बजाय लिप्यंतरण किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: पाठ में वाचा का व्यक्तिगत नाम सीधे आया है। हिन्दी में व्यापक रूप से पहचाना जाने वाला रूप ‘यहोवा’ रखा गया है; इसे उपाधि ‘प्रभु’ से नहीं बदला गया।
- issue: נָשָׂאתָ עֲוֺן में क्षमा और बोझ उठाने की छवि
  choice: तूने मेरे पाप का दोष उठा लिया
  alternative: तूने मेरे पाप का दोष क्षमा कर दिया
  rationale: मूल क्रिया ‘उठाने/ले जाने’ की जीवंत छवि रखती है और प्रसंग में उसका परिणाम क्षमा है। मुख्य पाठ में छवि सुरक्षित रखी गई है तथा पादटिप्पणी अर्थ स्पष्ट करती है।
- issue: पाप-संबंधी तीन संज्ञाओं का भेद
  choice: पाप / अधर्म / अपराध
  alternative: तीनों स्थानों पर ‘पाप’
  rationale: חטאת, עון और פשע के बीच मूल पाठ का शब्दगत और नैतिक तनाव बनाए रखने के लिए अलग किन्तु सुबोध हिन्दी शब्द चुने गए हैं।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। काव्यात्मक पंक्ति-विन्यास रखा गया है। परमेश्वर को संबोधन में एकवचन आत्मीय ‘तू’ प्रयुक्त है, जो भजन की सीधी प्रार्थनात्मक वाणी के अनुरूप है।
