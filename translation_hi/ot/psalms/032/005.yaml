review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the verse’s sequence and the three distinct Hebrew sin terms. However, “तुझ पर प्रकट किया” is not natural modern Hindi for making something known to someone, and “दोष उठा लिया” can suggest that God assumed the guilt rather than idiomatically forgiving/removing it. The Hebrew נשׂא is appropriately represented by ‘क्षमा कर दिया’ in the main text, with its literal burden-removal imagery retained in the footnote.
  naturalness: “मैंने अपना पाप तुझे बता दिया” and “यहोवा के सामने अपने अपराध स्वीकार करूँगा” are clear, idiomatic modern Hindi while retaining the direct, penitential register. “क्षमा कर दिया” is substantially more natural and semantically clear than “दोष उठा लिया” in this context.
  terminology: “पाप / अधर्म / अपराध” suitably maintains the source’s lexical variation without forcing artificial distinctions. “यहोवा” consistently renders יהוה. “सेला” appropriately transliterates the uncertain Hebrew liturgical term.
  issues:
  - severity: medium
    issue: “तुझ पर प्रकट किया” is an unnatural rendering of אוֹדִיעֲךָ.
    rationale: The Hiphil means ‘I made known to you.’ In current Hindi, ‘तुझ पर प्रकट किया’ can sound like revealing something upon or about the addressee, rather than informing God. “तुझे बता दिया” clearly conveys the source sense.
  - severity: medium
    issue: “तूने मेरे पाप का दोष उठा लिया” is potentially misleading for נָשָׂאתָ עֲוֺן חַטָּאתִי.
    rationale: Although נשׂא literally evokes lifting/carrying, this construction idiomatically denotes forgiveness. Hindi ‘दोष उठा लिया’ may mean taking the blame or responsibility upon oneself. The idiomatic meaning should stand in the text; the literal image belongs in the footnote.
