  text: וַ/אֲנִ֤י עָנִ֣י וְ/אֶבְיוֹן֮ אֲדֹנָ֪/י יַחֲשָׁ֫ב לִ֥/י עֶזְרָתִ֣/י וּ/מְפַלְטִ֣/י אַ֑תָּה אֱ֝לֹהַ֗/י אַל תְּאַחַֽר׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/017.yaml
  text: But I am poor and needy; the Lord thinks of me. You are my help and my deliverer; my God[a], do not delay.
translation:
  language: hi
  text: परन्तु मैं दीन और ज़रूरतमंद हूँ; प्रभु मुझ पर ध्यान देते हैं[a]। आप ही मेरी सहायता हैं और मुझे छुड़ानेवाले हैं; हे मेरे परमेश्वर, देर न कीजिए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “प्रभु मेरे विषय में सोचते हैं” या “प्रभु मेरा विचार करेंगे।”
    reason: יַחֲשָׁב לִי का अर्थ किसी पर विचार करना, उसका ध्यान करना, या भविष्य में उसका विचार करना हो सकता है।
lexical_decisions:
- source_word: וַאֲנִי
  choice: परन्तु मैं
  rationale: स्वतंत्र सर्वनाम और प्रसंगगत संयोजक पिछले कथन के साथ विरोध प्रकट करते हैं; आधुनिक हिन्दी में ‘परन्तु मैं’ इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: עָנִי וְאֶבְיוֹן
  choice: दीन और ज़रूरतमंद
  rationale: दोनों निकटार्थी शब्द व्यक्ति की असहाय, अभावग्रस्त दशा बताते हैं। ‘दीन’ सामाजिक और व्यक्तिगत लाचारी तथा ‘ज़रूरतमंद’ उसकी आवश्यकता को अलग-अलग बनाए रखते हैं।
- source_word: אֲדֹנָי
  choice: प्रभु
  rationale: यह יהוה नहीं, बल्कि परमेश्वर के लिए प्रयुक्त उपाधि אֲדֹנָי है; इसलिए इसे ‘प्रभु’ कहा गया है।
- source_word: יַחֲשָׁב לִי
  choice: मेरा ध्यान रखते हैं
  rationale: חשב के साथ ל यहाँ किसी पर विचार या उसका ध्यान रखने का भाव दे सकता है। यह हिन्दी में व्यक्तिगत सरोकार को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: עֶזְרָתִי
  choice: मेरी सहायता
  rationale: मूल शब्द सहायता को सूचित करने वाली संज्ञा है; ‘मेरी सहायता’ इसके रूप और काव्यात्मक संक्षिप्तता को बनाए रखता है।
- source_word: וּמְפַלְטִי
  choice: और मुझे छुड़ानेवाले
  rationale: פלט का कृदन्त उस व्यक्ति को दर्शाता है जो संकट से बचाता या छुड़ाता है; यह पद हिन्दी में उस सक्रिय अर्थ को बनाए रखता है।
- source_word: אֱלֹהַי אַל תְּאַחַר
  choice: हे मेरे परमेश्वर, देर न कीजिए
  rationale: सम्बोधन को ‘हे’ से स्पष्ट किया गया है और निषेधात्मक विनती की तात्कालिकता ‘देर न कीजिए’ में स्वाभाविक आधुनिक हिन्दी में सुरक्षित है।
theological_decisions:
- issue: אֲדֹנָי का अनुवाद
  choice: प्रभु
  alternative: मेरे प्रभु
  rationale: मूल पाठ में אֲדֹנָי दिव्य उपाधि है, יהוה नहीं। प्रत्यय के अभाव में ‘मेरे’ जोड़ना उचित नहीं होगा।
- issue: יַחֲשָׁב לִי का भाव
  choice: प्रभु मेरा ध्यान रखते हैं
  alternative: प्रभु मेरे विषय में सोचते हैं / प्रभु मेरा ध्यान रखेंगे
  rationale: हिब्रू रूप वर्तमान या भविष्य-सदृश विचार/सरोकार व्यक्त कर सकता है। मुख्य पाठ में स्वाभाविक relational अर्थ रखा गया है, पर किसी विशेष विस्तृत ईश्वरीय योजना का दावा नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक, आदरपूर्ण और प्रार्थनात्मक है। परमेश्वर के लिए आदरसूचक बहुवचन क्रिया-रूप (‘रखते हैं’, ‘कीजिए’) रखा गया है। ‘छुड़ानेवाले’ परिचित बाइबलीय गरिमा रखता है, पर अत्यधिक पुरातन नहीं है।
