    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: संगीत निर्देशक के लिए
  rationale: यह पद संगीत-प्रस्तुति की देखरेख करने वाले व्यक्ति को संबोधित करता है। उपसर्ग לַ को शीर्षक में प्रयुक्त समर्पणात्मक अर्थ के अनुसार ‘के लिए’ कहा गया है।
- source_word: לְדָוִד
  choice: दाऊद का
  rationale: भजनों के शीर्षकों में לְ लेखकत्व, संबंध, समर्पण या संग्रह से जुड़ाव बता सकता है। ‘दाऊद का’ स्वाभाविक हिन्दी है; पादटिप्पणी में इसकी व्यापक अर्थ-सीमा स्पष्ट की गई है।
- source_word: מִזְמוֹר
  choice: भजन
  rationale: यह संगीत से जुड़े स्तोत्र की मानक विधा-संज्ञा है। आधुनिक हिन्दी बाइबलीय प्रयोग में ‘भजन’ इसका स्पष्ट और प्रतिष्ठित समतुल्य है।
theological_decisions:
- issue: दाऊदी शीर्षक का अर्थ
  choice: लְדָוִד का अनुवाद ‘दाऊद का’
  alternative: ‘दाऊद द्वारा रचित’ अथवा ‘दाऊद के लिए’
  rationale: इब्रानी शीर्षक अनिवार्य रूप से केवल लेखकत्व निर्धारित नहीं करता। मुख्य पाठ में संक्षिप्त और स्वाभाविक रूप रखा गया है, जबकि पादटिप्पणी लेखकत्व, संबंध और समर्पण की संभावनाएँ खुली रखती है।
translation_notes:
  register: संक्षिप्त, गरिमापूर्ण और आधुनिक मानक हिन्दी। शीर्षक को हिन्दी में स्वाभाविक बनाने के लिए ‘दाऊद का’ और ‘भजन’ को एक ही वाक्यांश में रखा गया है; अर्थगत अस्पष्टता पादटिप्पणी में सुरक्षित है।
