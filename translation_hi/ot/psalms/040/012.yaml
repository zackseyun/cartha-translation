  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּ֤י אָפְפ֥וּ עָלַ֨/י רָע֡וֹת עַד אֵ֬ין מִסְפָּ֗ר הִשִּׂיג֣וּ/נִי עֲ֭וֺנֹתַ/י וְ/לֹא יָכֹ֣לְתִּי לִ/רְא֑וֹת עָצְמ֥וּ מִ/שַּֽׂעֲר֥וֹת רֹ֝אשִׁ֗/י וְ/לִבִּ֥/י עֲזָבָֽ/נִי־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/012.yaml
  text: For evils beyond number have surrounded me[a]; my iniquities have overtaken me, and I am not able to see. They are more than the hairs of my head[c][b], and my heart fails me.
translation:
  language: hi
  text: क्योंकि अनगिनत विपत्तियों ने[a] मुझे चारों ओर से घेर लिया है; मेरे अधर्मों ने[b] मुझे आ पकड़ा है, और मैं देख नहीं सकता। वे मेरे सिर के बालों से भी अधिक हैं, और मेरा हृदय मेरा साथ छोड़ गया है[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “अनगिनत” का अर्थ “जिनकी कोई गिनती नहीं” या “गिनती से परे” भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: “मेरे अधर्मों” का अनुवाद “मेरे पापों” या “मेरे दोष” भी हो सकता है; इब्रानी शब्द गलत काम और उससे जुड़े दोष—दोनों को समेट सकता है।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से, “मेरे हृदय ने मुझे छोड़ दिया है।”
    reason: literal_rendering
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पद आसपास की प्रार्थना का कारण बताता है; ‘क्योंकि’ उस व्याख्यात्मक संबंध को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: אָפְפוּ עָלַי
  choice: मुझे चारों ओर से घेर लिया है
  rationale: क्रिया चारों ओर से घिर जाने या घेर लिए जाने का चित्र प्रस्तुत करती है।
- source_word: רָעוֹת
  choice: विपत्तियों
  rationale: इब्रानी शब्द बुराई, हानि या विपत्ति को सूचित कर सकता है। यहाँ बहुवचन में वक्ता को घेरने वाली विपत्तियाँ स्वाभाविक हैं, जबकि शब्द के व्यापक अनिष्टकारी भाव को बनाए रखा गया है।
- source_word: עַד אֵין מִסְפָּר
  choice: अनगिनत
  rationale: यह मुहावरा ऐसी बहुतायत बताता है जिसकी गिनती न हो सके; ‘अनगिनत’ संक्षिप्त, साहित्यिक और सहज है।
- source_word: הִשִּׂיגוּנִי
  choice: मुझे आ पकड़ा है
  rationale: क्रिया पहुँच जाने, पीछा करके पकड़ लेने या आ घेरने का भाव रखती है; यह चुनाव पीछा किए जाने के बिंब को सुरक्षित रखता है।
- source_word: עֲוֹנֹתַי
  choice: मेरे अधर्मों
  rationale: עָוֹן दुष्कर्म, पाप और उससे जुड़े दोष—इन सबका भाव रख सकता है। ‘अधर्म’ नैतिक गंभीरता को बनाए रखता है और इसे केवल दुःख में नहीं बदलता।
- source_word: וְלֹא יָכֹלְתִּי לִרְאוֹת
  choice: और मैं देख नहीं सकता
  rationale: यह मूल की सीधी अनिश्चितता को बनाए रखता है कि न देख पाना शारीरिक है या अत्यधिक व्याकुलता का रूपक।
- source_word: עָצְמוּ מִשַּׂעֲרוֹת רֹאשִׁי
  choice: वे मेरे सिर के बालों से भी अधिक हैं
  rationale: संदर्भ में क्रिया संख्या की अधिकता व्यक्त करती है; सिर के बालों से तुलना मूल बिंब को ज्यों का त्यों रखती है।
- source_word: וְלִבִּי עֲזָבָנִי
  choice: और मेरा हृदय मेरा साथ छोड़ गया है
  rationale: मूलतः ‘मेरे हृदय ने मुझे छोड़ दिया’ का यह स्वाभाविक हिन्दी रूप है; यह शक्ति या साहस चुकने का संकेत देता है, पर अर्थ को केवल भावनात्मक साहस तक सीमित नहीं करता।
theological_decisions:
- issue: क्या עֲוֹנֹתַי भजनकार के अपने पापों को बताता है या दोष से उत्पन्न दंड और कष्टों को
  choice: मेरे अधर्मों
  alternative: मेरा दोष; मेरे पापों के परिणाम
  rationale: संबंधसूचक प्रत्यय के साथ यह शब्द सबसे स्वाभाविक रूप से वक्ता के अपने अधर्मों या दोष को बताता है। अनुवाद बाहरी विपत्तियों और निजी नैतिक दोष के बीच के तनाव को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘आ पकड़ा’ पीछा करके दबोच लिए जाने का काव्यात्मक बिंब देता है; ‘हृदय मेरा साथ छोड़ गया’ मूल रूपक को स्वाभाविक हिन्दी में सुरक्षित रखता है।
