  yaml_path: translation/ot/psalms/040/014.yaml
  text: Let those who seek to sweep away my life be put to shame and humiliated together[c][b][a]; let those who delight in my harm turn back and be disgraced.
translation:
  language: hi
  text: जो मेरा जीवन मिटा देने[a] पर तुले हैं, वे एक साथ लज्जित और अपमानित हों; जो मेरी हानि से प्रसन्न होते हैं, वे पीछे हटें और लज्जित हों।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “मेरा जीवन मिटा देने” का अनुवाद “मेरे प्राणों को समाप्त करने” या “मेरा जीवन नष्ट करने” भी हो सकता है। इब्रानी में “जीवन” के लिए प्रयुक्त शब्द व्यक्ति के प्राण या स्वयं व्यक्ति को भी सूचित कर सकता है, और क्रिया का अर्थ समाप्त कर देना, नष्ट कर देना या मिटा देना हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵבֹשׁוּ וְיַחְפְּרוּ יַחַד
  choice: वे सब लज्जित और अपमानित हों
  rationale: दोनों क्रियाएँ लज्जा और अपमान का समानांतर भाव व्यक्त करती हैं; ‘सब’ यहाँ יַחַד के सामूहिक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מְבַקְשֵׁי נַפְשִׁי
  choice: जो मेरे प्राण ... पर तुले हैं
  rationale: נֶפֶשׁ यहाँ अमूर्त ‘आत्मा’ नहीं, बल्कि भजनकार के जीवन/प्राण को सूचित करता है; शत्रुतापूर्ण प्रयत्न को हिन्दी मुहावरे ‘पर तुले हैं’ से व्यक्त किया गया है।
- source_word: לִסְפּוֹתָהּ
  choice: मिटा देने
  rationale: ספה का आशय समाप्त कर देना, नष्ट कर देना या मिटा देना हो सकता है; स्त्रीलिंग प्रत्यय נַפְשִׁי की ओर लौटता है। ‘मिटा देने’ तीव्रता और स्वाभाविकता दोनों रखता है।
- source_word: יִסֹּגוּ אָחוֹר
  choice: वे पीछे हटें
  rationale: סוג और אָחוֹר का संयुक्त अर्थ पीछे हटना या लौट जाना है; यह इच्छासूचक/अभिशंसात्मक बल को सीधे रखता है।
- source_word: וְיִכָּלְמוּ
  choice: निरादर सहें
  rationale: כלם अपमानित या लज्जित होने का भाव देता है; ‘निरादर सहें’ पहली पंक्ति की शब्दावली की यांत्रिक पुनरावृत्ति से बचते हुए समानांतरता बनाए रखता है।
- source_word: חֲפֵצֵי רָעָתִי
  choice: जो मेरी हानि से प्रसन्न होते हैं
  rationale: חפץ इच्छा या प्रसन्नता दर्शाता है और רָעָה यहाँ भजनकार की नैतिक बुराई नहीं, उस पर आने वाली हानि को सूचित करती है।
