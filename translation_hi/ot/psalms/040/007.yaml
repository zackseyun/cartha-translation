    text: या “मेरे लिए लिखा है” अथवा “मेरे लिए निर्धारित है।” इब्रानी पदबंध का अर्थ वक्ता के विषय में लिखी बात या उसके लिए ठहराई गई बात—दोनों हो सकता है।
