  yaml_path: translation/ot/psalms/040/007.yaml
  text: Then I said[a], “Behold, I have come[b]; in the scroll of the book it is written about me.”
translation:
  language: hi
  text: तब मैंने कहा, “देखो, मैं आया हूँ[b]; पुस्तक के स्क्रॉल में मेरे विषय में[a] लिखा है।”
  philosophy: optimal-equivalence
  footnotes:
