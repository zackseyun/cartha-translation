lexical_decisions:
- source_word: אָז
  choice: तब
  rationale: यह कालगत और क्रमसूचक क्रियाविशेषण है, जो पिछले प्रसंग के उत्तर में वक्ता की बात आरम्भ करता है।
- source_word: אָמַרְתִּי
  choice: मैंने कहा
  rationale: प्रथम पुरुष एकवचन पूर्ण क्रिया का सीधा और स्वाभाविक हिन्दी अनुवाद।
- source_word: הִנֵּה
  choice: लो
  rationale: यह ध्यान आकर्षित करने और स्वयं को प्रस्तुत करने का भाव देता है; आधुनिक हिन्दी में ‘लो’ काव्यात्मक गरिमा बनाए रखते हुए स्वाभाविक है।
- source_word: בָאתִי
  choice: मैं आया हूँ
  rationale: पूर्ण क्रिया यहाँ आगमन के वर्तमान परिणाम और परमेश्वर के सामने स्वयं को प्रस्तुत करने का भाव व्यक्त करती है।
- source_word: בִּמְגִלַּת סֵפֶר
  choice: पुस्तक के खर्रे में
  rationale: מְגִלָּה लपेटे जाने वाले लिखित खर्रे को और סֵפֶר लिखित पुस्तक अथवा दस्तावेज़ को सूचित करता है। यह चयन मूल बिंब को केवल ‘पुस्तक’ कहकर सपाट नहीं करता।
- source_word: כָּתוּב
  choice: लिखा है
  rationale: निष्क्रिय कृदन्त की स्थितिवाचक शक्ति को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: עָלַי
  choice: मेरे विषय में
  rationale: इस प्रसंग में עַל और प्रथम पुरुष प्रत्यय का सबसे सीधा अर्थ वक्ता के विषय में लिखी हुई बात है; अन्य सम्भव अर्थ पादटिप्पणी में सुरक्षित हैं।
theological_decisions:
- issue: इब्रानियों 10 में बाद के मसीही उद्धरण के आलोक में עָלַי का अर्थ
  choice: मेरे विषय में
  alternative: मेरे लिए; मेरे लिए निर्धारित
  rationale: मुख्य पाठ भजन के तात्कालिक इब्रानी अर्थ को प्राथमिकता देता है और बाद के मसीही प्रयोग को उसमें चुपचाप आरोपित नहीं करता। इब्रानी पदबंध की वैकल्पिक सम्भावना पादटिप्पणी में रखी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक रखी गई है। ‘खर्रा’ मूल के लपेटे हुए लिखित दस्तावेज़ का बिंब सुरक्षित रखता है; पादटिप्पणी-चिह्न उनके वास्तविक सम्बन्धित पदांशों के बाद रखे गए हैं।
