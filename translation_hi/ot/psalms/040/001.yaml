  yaml_path: translation/ot/psalms/040/001.yaml
  text: I waited patiently for Yahweh[a], and he turned to me and heard my cry for help.
translation:
  language: hi
  text: 'मैंने धीरज से याहवे की प्रतीक्षा की;[a]


    वह मेरी ओर मुड़ा


    और मेरी सहायता की पुकार सुनी।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “प्रतीक्षा करते हुए मैंने प्रतीक्षा की,” एक जोरदार अभिव्यक्ति; इसका अर्थ “मैंने धीरज से प्रतीक्षा की” या “मैंने उत्कट आशा से प्रतीक्षा की” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: קַוֺּה קִוִּיתִי
  choice: मैंने यहोवा की बड़ी बाट जोही
  rationale: इनफिनिटिव एब्सोल्यूट और सीमित क्रिया की पुनरुक्ति प्रतीक्षा पर बल देती है। ‘बड़ी बाट जोही’ आधुनिक पाठकों के लिए समझने योग्य, स्वाभाविक और गरिमापूर्ण ढंग से दीर्घ तथा मन लगाकर की गई प्रतीक्षा व्यक्त करता है; मूल की अभिव्यक्ति को पादटिप्पणी में अधिक शाब्दिक रूप से रखा गया है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को उपाधि ‘प्रभु’ से बदलने के बजाय हिन्दी में प्रचलित नाम-रूप ‘यहोवा’ से व्यक्त किया गया है।
- source_word: וַיֵּט אֵלַי
  choice: तब उसने मेरी ओर ध्यान दिया
  rationale: נטה का मूल भाव झुकने या किसी ओर मुड़ने का है। इस प्रसंग में यह विनती करने वाले की ओर कृपापूर्वक ध्यान देने को दर्शाता है; ‘मेरी ओर ध्यान दिया’ हिन्दी में स्वाभाविक है और भाव को स्पष्ट रखता है।
- source_word: וַיִּשְׁמַע
  choice: सुनी
  rationale: שׁמע यहाँ पुकार को ध्यान से सुनने का अर्थ देता है। ‘सुनी’ सरल और पर्याप्त है; प्रसंग उत्तरदायी सुनने का संकेत बनाए रखता है।
- source_word: שַׁוְעָתִי
  choice: सहायता के लिए मेरी पुकार
  rationale: שַׁוְעָה संकट में सहायता माँगने की पुकार है, इसलिए केवल ‘पुकार’ की अपेक्षा ‘सहायता के लिए मेरी पुकार’ अधिक सटीक है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: पाठ में व्यक्तिगत ईश्वरीय नाम सीधे आया है। हिन्दी में व्यापक रूप से पहचाने जाने वाले ‘यहोवा’ को रखा गया है, ताकि नाम को किसी उपाधि से प्रतिस्थापित न किया जाए।
translation_notes:
  register: आधुनिक मानक हिन्दी, काव्यात्मक किंतु सामान्य पाठक के लिए सुबोध। ‘बाट जोहना’ भजन की गरिमा और प्रतीक्षारत आशा को बनाए रखता है। पंक्ति-विभाजन इब्रानी वाक्य के क्रम—प्रतीक्षा, ईश्वर का ध्यान, और पुकार सुनना—को स्पष्ट करता है।
