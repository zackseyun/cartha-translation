base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/013.yaml
  text: Be pleased[a], O Yahweh, to deliver me; O Yahweh[b], hurry to help me.
translation:
  language: hi
  text: हे याहवे, मुझे छुड़ाने की इच्छा कर[a]; हे याहवे, मेरी सहायता के लिए शीघ्र आ[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मुझे छुड़ाने को प्रसन्न हो” या “मुझे छुड़ाने को इच्छुक हो।” हिब्रानी आज्ञार्थक में अनुग्रहपूर्ण इच्छा या अनुकूल प्रसन्नता का भाव है।
    reason: lexical_alternative
  - marker: b
    text: या, “मेरी सहायता के लिए जल्दी कर।”
    reason: lexical_alternative
lexical_decisions:
- source_word: רְצֵה
  choice: तुझे भाए
  rationale: रצה के आज्ञार्थक रूप में अनुग्रहपूर्ण इच्छा या प्रसन्न स्वीकृति का भाव है। ‘तुझे भाए’ इस भाव को प्रार्थनापूर्ण और गरिमापूर्ण हिन्दी में बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चतुरक्षरीय दिव्य नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित नामरूप ‘यहोवा’ से व्यक्त किया गया है।
- source_word: לְהַצִּילֵנִי
  choice: मुझे छुड़ाना
  rationale: נצל के हिफ़ईल रूप का अर्थ संकट से निकालना या बचाना है। ‘छुड़ाना’ प्रसंगानुकूल है और धार्मिक पारिभाषिक अर्थ को अनावश्यक रूप से सीमित नहीं करता।
- source_word: לְעֶזְרָתִי
  choice: मेरी सहायता करने को
  rationale: शाब्दिक अर्थ ‘मेरी सहायता के लिए’ है; हिन्दी में ‘मेरी सहायता करने को’ स्वाभाविक ढंग से प्रयोजन व्यक्त करता है।
- source_word: חוּשָׁה
  choice: शीघ्र आ
  rationale: आज्ञार्थक क्रिया में जल्दी करने का आग्रह है। ‘शीघ्र आ’ सहायता के लिए तत्काल उपस्थित होने का आशय स्वाभाविक हिन्दी में देता है; पादटिप्पणी में अधिक शाब्दिक विकल्प रखा गया है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में व्यक्तिगत दिव्य नाम है, इसलिए ‘प्रभु’ जैसी उपाधि से उसका प्रतिस्थापन नहीं किया गया। आधुनिक हिन्दी बाइबलीय प्रयोग में पहचाने जाने योग्य ‘यहोवा’ चुना गया; ‘याहवे’ अधिक प्रत्यक्ष लिप्यंतरण है।
- issue: רְצֵה में इच्छा और प्रसन्नता का संबंध
  choice: तुझे भाए
  alternative: तू मुझे छुड़ाने को इच्छुक हो
  rationale: मूल शब्द अनुग्रहपूर्ण इच्छा और प्रसन्नता दोनों का संकेत दे सकता है। मुख्य पाठ में दोनों के बीच की अर्थगत व्यापकता सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण प्रार्थनात्मक हिन्दी। ‘तुझे भाए’ काव्यात्मक है, पर सामान्य पाठक के लिए बोधगम्य है; ‘शीघ्र आ’ मूल की तात्कालिकता को सहज रूप में व्यक्त करता है।
