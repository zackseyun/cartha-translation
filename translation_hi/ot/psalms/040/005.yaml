  yaml_path: translation/ot/psalms/040/005.yaml
  text: You have done many things[a], O Yahweh my God—your wonders and your plans for us; none can be compared to you. If I would declare and speak of them, they are too many to recount.
translation:
  language: hi
  text: 'हे याहवे, मेरे परमेश्वर,


    आपने कितने ही अद्भुत काम किए हैं

    और हमारे लिए कितनी ही योजनाएँ बनाई हैं;


    कोई आपके तुल्य नहीं है।


    यदि मैं उनका वर्णन करूँ और उनके विषय में बोलूँ,


    तो वे गिनती से परे हैं।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רַבּוֹת עָשִׂיתָ
  choice: आपने बहुत कुछ किया है
  rationale: स्त्रीलिंग बहुवचन רַבּוֹת यहाँ परमेश्वर के अनेक कार्यों की प्रचुरता बताता है। ‘बहुत कुछ’ हिन्दी में निहित कर्म को स्वाभाविक रूप से व्यक्त करता है, और पूर्ण क्रिया के वर्तमान महत्व को ‘किया है’ बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम चतुरक्षर का शीर्षक से प्रतिस्थापन न करके उसका प्रचलित ध्वन्यात्मक लिप्यंतरण किया गया है।
- source_word: אֱלֹהַי
  choice: मेरे परमेश्वर
  rationale: प्रथम पुरुष एकवचन संबंधसूचक रूप और प्रत्यक्ष व्यक्तिगत संबोधन दोनों सुरक्षित रहते हैं।
- source_word: נִפְלְאֹתֶיךָ
  choice: आपके अद्भुत काम
  rationale: פלא से बना यह संज्ञा-रूप विस्मयकारी दैवी कार्यों को दर्शाता है। ‘अद्भुत काम’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: וּמַחְשְׁבֹתֶיךָ אֵלֵינוּ
  choice: और हमारे लिए आपकी योजनाएँ[a]
  rationale: מַחְשָׁבוֹת का अर्थ विचार, अभिप्राय या योजनाएँ हो सकता है। प्रसंग में ‘योजनाएँ’ उद्देश्यपूर्ण दैवी अभिप्राय व्यक्त करता है; अधिक शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: אֵין עֲרֹךְ אֵלֶיךָ
  choice: कोई आपके तुल्य नहीं है
  rationale: शाब्दिक रूप से ‘आपके सामने/साथ क्रम में रखने वाला कोई नहीं’ तुलना और अतुलनीयता का मुहावरा है। हिन्दी का यह रूप अर्थ को संक्षेप और गरिमा से देता है।
- source_word: אַגִּידָה וַאֲדַבֵּרָה
  choice: यदि मैं उनका वर्णन करूँ और उनके विषय में बोलूँ
  rationale: दोनों cohortative रूप अगले कथन के संदर्भ में शर्तसूचक भाव ग्रहण करते हैं। ‘यदि…तो’ हिन्दी में उस प्रवाह को स्पष्ट करता है, जबकि दो निकटार्थी क्रियाओं का काव्यात्मक विस्तार बना रहता है।
- source_word: עָצְמוּ מִסַּפֵּר
  choice: वे गिनती से परे हैं
  rationale: यह पदबंध संख्या में इतने अधिक होने का भाव देता है कि उन्हें पूरा गिना या सुनाया नहीं जा सकता। ‘गिनती से परे’ संक्षिप्त और मुहावरेदार हिन्दी है।
theological_decisions:
- issue: लोगों की ओर परमेश्वर की מַחְשָׁבוֹת का आशय
  choice: हमारे लिए आपकी योजनाएँ
  alternative: हमारे प्रति आपके विचार
  rationale: ‘योजनाएँ’ परमेश्वर के उद्देश्यपूर्ण और हितकारी अभिप्राय को व्यक्त करता है, पर पद में निहित बात से आगे बढ़कर किसी विशिष्ट नियतिवादी या पूर्वनियति-संबंधी तंत्र को आरोपित नहीं करता। शाब्दिक अर्थ की वास्तविक संभावना पादटिप्पणी में सुरक्षित है।
- issue: אֵין עֲרֹךְ אֵלֶיךָ में तुलना का लक्ष्य
  choice: कोई आपके तुल्य नहीं है
  alternative: आपसे तुलना करने योग्य कुछ भी नहीं है
  rationale: हिब्रू मुहावरा परमेश्वर की अतुलनीयता बताता है। ‘कोई’ को व्यक्तिगत रूप से समझा जा सकता है, जबकि ‘कुछ भी’ उसके कामों या योजनाओं की तुलना की ओर संकेत कर सकता है; निकट संदर्भ और प्रचलित मुहावरे के आधार पर मुख्य पाठ में परमेश्वर की अतुलनीयता रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में आदरसूचक ‘आप’ का प्रयोग किया गया है। शैली काव्यात्मक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। पंक्ति-विभाजन हिब्रू काव्य के विचार-खंडों को उभारता है; अनावश्यक पारिभाषिक या सांप्रदायिक शब्दावली से बचा गया है।
