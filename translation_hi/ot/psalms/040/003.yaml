  text: וַ/יִּתֵּ֬ן בְּ/פִ֨/י שִׁ֥יר חָדָשׁ֮ תְּהִלָּ֪ה לֵֽ/אלֹ֫הֵ֥י/נוּ יִרְא֣וּ רַבִּ֣ים וְ/יִירָ֑אוּ וְ֝/יִבְטְח֗וּ בַּ/יהוָֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/003.yaml
  text: He put a new song in my mouth[a], a song of praise to our God. Many will see and fear[c][b], and will trust in Yahweh.
translation:
  language: hi
  text: उसने मेरे मुँह में एक नया गीत रखा—हमारे परमेश्वर की स्तुति का गीत। बहुत-से लोग देखेंगे और भय मानेंगे[a], और यहोवा पर भरोसा रखेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “श्रद्धा और विस्मय से भर जाएँगे।” इब्रानी क्रिया भय, श्रद्धा अथवा विस्मय का भाव व्यक्त कर सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן בְּפִי
  choice: उसने मेरे मुँह में… रखा
  rationale: נתן का मूल अर्थ ‘देना/रखना’ है; ‘मुँह में रखा’ इब्रानी की ठोस शारीरिक छवि और स्वाभाविक हिन्दी मुहावरे दोनों को बनाए रखता है।
- source_word: שִׁיר חָדָשׁ
  choice: एक नया गीत
  rationale: यह सीधा और स्वाभाविक अनुवाद है; नया गीत परमेश्वर के उद्धार से उपजी नई स्तुति को व्यक्त करता है।
- source_word: תְּהִלָּה לֵאלֹהֵינוּ
  choice: हमारे परमेश्वर की स्तुति का गीत
  rationale: यह पदबंध ‘नया गीत’ का समानाधिकरण होकर उसके स्वरूप को स्पष्ट करता है। ‘स्तुति का गीत’ आधुनिक हिन्दी में स्वाभाविक है, यद्यपि ‘गीत’ अर्थ की स्पष्टता के लिए जोड़ा गया है।
- source_word: יִרְאוּ רַבִּים
  choice: बहुत-से लोग यह देखेंगे
  rationale: अपूर्ण क्रिया यहाँ आगामी/परिणामी प्रतिक्रिया व्यक्त करती है। ‘यह’ प्रसंग में परमेश्वर के कार्य और उससे उपजे स्तुतिगान की ओर संकेत करता है।
- source_word: וְיִירָאוּ
  choice: और भय मानेंगे
  rationale: ירא में भय, श्रद्धा और विस्मय का अर्थ-क्षेत्र है। ‘भय मानेंगे’ हिन्दी बाइबलीय प्रयोग में धार्मिक गंभीरता बनाए रखता है और अर्थ को केवल आतंक तक सीमित नहीं करता।
- source_word: וְיִבְטְחוּ בַּיהוָה
  choice: और यहोवा पर भरोसा रखेंगे
  rationale: בטח का अर्थ भरोसा करना/निर्भर होना है; हिन्दी में ‘पर भरोसा रखना’ स्वाभाविक है। יהוה को उसके व्यक्तिगत वाचा-नाम के रूप में ‘यहोवा’ लिखा गया है।
theological_decisions:
- issue: וְיִירָאוּ में भय और श्रद्धामिश्रित विस्मय की अर्थगत व्यापकता
  choice: भय मानेंगे
  alternative: श्रद्धा से भर जाएँगे / विस्मित होंगे
  rationale: मुख्य पाठ ‘भय’ की धार्मिक और नैतिक गंभीरता को सुरक्षित रखता है; पादटिप्पणी बताती है कि इब्रानी में श्रद्धा और विस्मय भी निहित हो सकते हैं।
- issue: ईश्वरीय नाम יהוה का निरूपण
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: मूल पाठ में सामान्य उपाधि नहीं, चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम है। आधुनिक हिन्दी पाठकों में पहचाने जाने वाले नामरूप ‘यहोवा’ से नाम और उपाधि का भेद बना रहता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध हिन्दी। काव्यात्मक विराम के लिए दीर्घ डैश रखा गया है। ‘मेरे मुँह में’ मूल की ठोस छवि को बनाए रखता है; ‘भय मानेंगे’ अर्थगत और धर्मवैचारिक तनाव को नरम किए बिना प्रस्तुत करता है।
