theological_decisions:
- issue: צדקה का धर्मी चरित्र और न्यायपूर्ण कार्य के बीच अर्थ-विस्तार
  choice: मुख्य पाठ में ‘धार्मिकता’
  alternative: ‘न्याय’ या ‘न्यायपूर्ण कार्य’
  rationale: काव्यात्मक संदर्भ में यह परमेश्वर के गुण और उसके उद्धारकारी धर्मपूर्ण कार्य दोनों को समेट सकता है; पादटिप्पणी वास्तविक अर्थ-विकल्प सुरक्षित रखती है।
- issue: אֱמוּנָה और אֱמֶת जैसे निकटार्थी वाचा-संबंधी पदों का भेद
  choice: क्रमशः ‘विश्वासयोग्यता’ और ‘सच्चाई’
  alternative: दोनों को ‘विश्वासयोग्यता/निष्ठा’ जैसे एक ही निकटार्थी पद से अनूदित करना
  rationale: अलग शब्द रखने से इब्रानी पद्य में संचित गुणों की अलंकारिक पूर्णता और अर्थगत तनाव बना रहता है।
- issue: חסד का अनुवाद
  choice: अटल प्रेममय करुणा
  alternative: वाचा का प्रेम; अटल प्रेम; करुणा
  rationale: मुख्य पाठ प्रेम, करुणा और स्थिर निष्ठा को एक साथ व्यक्त करता है, लेकिन ‘वाचा’ को वहाँ स्पष्ट रूप से जोड़कर निहित धर्मवैज्ञानिक अर्थ को अनावश्यक रूप से निश्चित नहीं करता।
- issue: לְקָהָל רָב का संबंध
  choice: ‘बड़ी सभा से नहीं छिपाया’
  alternative: ‘बड़ी सभा के सामने’ घोषणा की
  rationale: व्याकरण इसे छिपाने की क्रिया के साथ जोड़ता है, फिर भी सार्वजनिक श्रोताओं पर बल देने वाला दूसरा पाठ संभव है; उसे पादटिप्पणी में रखा गया है।
- issue: इब्रानी पूर्ण क्रियाओं का हिन्दी काल
  choice: सामान्य पूर्ण भूत रूप—‘नहीं छिपाया’, ‘वर्णन किया’
  alternative: वर्तमान-परिणामी रूप—‘नहीं छिपाया है’, ‘वर्णन किया है’
  rationale: हिन्दी में सामान्य पूर्ण भूत काव्यात्मक साक्ष्य को स्वाभाविक और संक्षिप्त रखता है; संदर्भ इन कार्यों की वर्तमान प्रासंगिकता संप्रेषित करता है।
