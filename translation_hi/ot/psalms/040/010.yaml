- source_word: אָמָרְתִּי
  choice: मैंने ... का वर्णन किया
  rationale: क्रिया का मूल अर्थ ‘मैंने कहा’ है, पर इन संज्ञात्मक कर्मों के साथ सार्वजनिक घोषणा का भाव हिन्दी में ‘वर्णन किया’ से स्पष्ट और सहज होता है।
- source_word: כִחַדְתִּי
  choice: नहीं छिपाया
