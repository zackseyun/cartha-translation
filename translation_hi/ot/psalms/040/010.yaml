  yaml_path: translation/ot/psalms/040/010.yaml
  text: I have not hidden your righteousness within my heart[a]; I have spoken of your faithfulness and your salvation[d][c][b]. I have not concealed your steadfast love and your truth from the great assembly.
translation:
  language: hi
  text: मैंने तेरी धार्मिकता[a] को अपने हृदय में नहीं छिपाया; मैंने तेरी विश्वासयोग्यता और तेरे उद्धार[b] का वर्णन किया। मैंने तेरे अटल प्रेम[c] और तेरी सच्चाई को बड़ी सभा से नहीं छिपाया[d]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘तेरा न्याय’। इब्रानी शब्द צְדָקָה संदर्भ के अनुसार नैतिक धार्मिकता, न्यायपूर्ण कार्य या न्याय दिलाने को व्यक्त कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘तेरे छुटकारे’।
    reason: lexical_alternative
  - marker: c
    text: या ‘तेरे वाचा के प्रेम’। इब्रानी חֶסֶד अटल प्रेम, करुणा और निष्ठा के भावों को समेटने वाला समृद्ध शब्द है।
    reason: lexical_alternative
  - marker: d
    text: या ‘बड़ी सभा के सामने’। इब्रानी रचना इस बात पर बल दे सकती है कि उसने ये बातें किन लोगों से नहीं छिपाईं, अथवा किनके सामने उनकी घोषणा की।
    reason: syntactic_ambiguity
