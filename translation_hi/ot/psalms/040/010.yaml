  register: आधुनिक मानक हिन्दी का आदरपूर्ण, काव्यात्मक और सामान्य पाठक के लिए सुबोध रूप। परमेश्वर के लिए एकवचन निकट संबोधन ‘तेरी/तेरे’ रखा गया है, जो हिन्दी भजन-साहित्य में आत्मीयता और मूल इब्रानी के एकवचन संबोधन दोनों को दर्शाता है।
