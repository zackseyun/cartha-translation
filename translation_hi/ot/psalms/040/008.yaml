id: PSA.40.8
reference: Psalms 40:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: לַֽ/עֲשֽׂוֹת רְצוֹנְ/ךָ֣ אֱלֹהַ֣/י חָפָ֑צְתִּי וְ֝/ת֥וֹרָתְ/ךָ֗ בְּ/ת֣וֹךְ מֵעָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/008.yaml
  text: I delight to do your will[a], my God, and your law is within my inner being.
translation:
  language: hi
  text: हे मेरे परमेश्वर, तेरी इच्छा पूरी करने में मुझे आनन्द मिलता है, और तेरी व्यवस्था[a] मेरे अंतरतम में है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “शिक्षा।” इब्रानी शब्द तोराह परमेश्वर की शिक्षा को व्यापक अर्थ में भी व्यक्त कर सकता है, केवल कानूनी विधियों को नहीं।
    reason: lexical_alternative
lexical_decisions:
- source_word: לַעֲשׂוֹת
  choice: पूरी करने
  rationale: ל prefixed infinitive of עשה expresses what the speaker delights to do. With इच्छा, natural modern Hindi says “इच्छा पूरी करना,” while retaining the sense of carrying it out.
- source_word: רְצוֹנְךָ
  choice: तेरी इच्छा
  rationale: רָצוֹן here denotes God’s will or desire; “इच्छा” is direct, natural Hindi and fits the collocation “पूरी करना।”
- source_word: אֱלֹהַי
  choice: हे मेरे परमेश्वर
  rationale: The first-person suffix is preserved as “मेरे,” and the Hebrew vocative force is made natural in Hindi with “हे।”
- source_word: חָפָצְתִּי
  choice: मुझे आनन्द मिलता है
  rationale: חפץ conveys delight, desire, or pleasure. This rendering expresses joyful willingness rather than mere obligation and reads naturally as an ongoing disposition.
- source_word: וְתוֹרָתְךָ
  choice: और तेरी व्यवस्था
  rationale: תּוֹרָה may mean law or instruction. “व्यवस्था” preserves its established covenantal and scriptural resonance in Hindi Bible usage; the broader sense is retained in a footnote.
- source_word: בְּתוֹךְ
  choice: में
  rationale: Within the phrase “मेरे अंतरतम में,” the Hindi postposition naturally communicates interior location without a wooden expression.
- source_word: מֵעָי
  choice: मेरे अंतरतम
  rationale: מֵעַי literally refers to inward parts and idiomatically to the deepest inner self. “अंतरतम” preserves that depth without misleading anatomical imagery or reducing it specifically to “हृदय।”
theological_decisions:
- issue: भक्तिपरक सन्दर्भ में תּוֹרָה का अनुवाद
  choice: व्यवस्था
  alternative: शिक्षा
  rationale: “व्यवस्था” वाचा और पवित्रशास्त्र से जुड़े अर्थभार को बनाए रखती है, जबकि पादटिप्पणी स्पष्ट करती है कि इब्रानी शब्द का अर्थ केवल कानूनी विधियों तक सीमित नहीं है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए सहज। परमेश्वर को एकवचन आत्मीय सम्बोधन “तेरी” से संबोधित किया गया है, जो इब्रानी द्वितीय पुरुष एकवचन को स्पष्ट रखता है। “अंतरतम” काव्यात्मक है, पर आधुनिक हिन्दी में बोधगम्य है।
