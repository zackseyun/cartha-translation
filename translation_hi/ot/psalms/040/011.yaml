source:
  edition: WLC
  text: אַתָּ֤ה יְהוָ֗ה לֹא תִכְלָ֣א רַחֲמֶ֣י/ךָ מִמֶּ֑/נִּי חַסְדְּ/ךָ֥ וַ֝/אֲמִתְּ/ךָ֗ תָּמִ֥יד יִצְּרֽוּ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/011.yaml
  text: You[a], O Yahweh, will not withhold your compassion from me[b]; your steadfast love and your faithfulness will continually preserve me.
translation:
  language: hi
  text: हे याहवे, तू अपनी करुणा को मुझसे नहीं रोकेगा[a]; तेरा अटल प्रेम और तेरी विश्वासयोग्यता[b] निरन्तर मेरी रक्षा करेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपनी करुणा को मुझसे मत रोक।” यहाँ क्रिया को भरोसे के कथन के बजाय विनती के रूप में भी समझा जा सकता है।
    reason: alternative_reading
  - marker: b
    text: या, “सच्चाई।”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: यहवे
  rationale: इब्रानी वाचा-नाम को सामान्य हिन्दी लिप्यंतरण में रखा गया है।
- source_word: תִכְלָא
  choice: न रोकेगा
  rationale: כלא का अर्थ यहाँ ‘रोक रखना’ है। यिक़्तोल रूप को भरोसे के भविष्यकालीन कथन के रूप में मुख्य पाठ में रखा गया है; विनती का भाव भी सम्भव है और पादटिप्पणी में दिया गया है।
- source_word: רַחֲמֶיךָ
  choice: अपनी करुणा
  rationale: बहुवचन रूप यहाँ परमेश्वर की दयापूर्ण करुणा को सामूहिक भाव में व्यक्त करता है; हिन्दी में एकवचन भाववाचक संज्ञा स्वाभाविक है।
- source_word: חַסְדְּךָ
  choice: तेरा अटल प्रेम
  rationale: חסד में प्रेम, निष्ठा और स्थिर वाचा-प्रतिबद्धता का संयुक्त भाव है; ‘अटल प्रेम’ इसे सहज हिन्दी में व्यक्त करता है।
- source_word: אֲמִתְּךָ
  choice: तेरी सच्चाई
  rationale: אמת का मूल अर्थ ‘सच्चाई’ है और इस समानांतर प्रयोग में विश्वसनीयता का भाव भी समाहित है; अस्पष्टता को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: תָּמִיד
  choice: निरन्तर
  rationale: रक्षा करने की क्रिया की लगातार प्रकृति को व्यक्त करता है।
- source_word: יִצְּרוּנִי
  choice: मेरी रक्षा करेंगे
  rationale: נצר का सुरक्षात्मक अर्थ ‘रखना, पहरा देना, बचाए रखना’ है। बहुवचन क्रिया ‘अटल प्रेम’ और ‘सच्चाई’ के संयुक्त कर्ता से मेल खाती है।
theological_decisions:
- issue: यिक़्तोल תִכְלָא का कथन या विनती के रूप में अर्थ
  choice: तू ... न रोकेगा
  alternative: तू ... न रोक
  rationale: रूप 2 पुल्लिंग एकवचन अपूर्ण है और भरोसे का कथन स्वाभाविक है, पर प्रार्थना के प्रसंग में निषेधात्मक विनती का अर्थ भी व्याकरणतः सम्भव है; उसे पादटिप्पणी में रखा गया है।
- issue: אמת का अर्थ
  choice: सच्चाई
  alternative: विश्वासयोग्यता
  rationale: शब्द ‘सत्य/सच्चाई’ और ‘विश्वासयोग्यता’ दोनों अर्थ दे सकता है। मुख्य पाठ में निकटतर शाब्दिक अर्थ रखा गया है, जबकि वाचागत समानांतरता में निष्ठा का सम्भव भाव पादटिप्पणी में दिया गया है।
- issue: ईश्वरीय नाम יְהוָה
  choice: यहवे
  alternative: यहोवा
  rationale: मूल पाठ में आए चार-अक्षरीय ईश्वरीय नाम को पदवी से बदलने के बजाय लिप्यंतरित किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में प्रार्थनामय, गरिमापूर्ण और सहज शैली रखी गई है। परमेश्वर के लिए निकट संबोधन ‘तू/तेरा’ भजन की प्रत्यक्ष प्रार्थना के अनुरूप है।
