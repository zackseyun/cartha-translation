source:
  edition: WLC
  text: אַ֥שְֽׁרֵי הַ/גֶּ֗בֶר אֲשֶׁר שָׂ֣ם יְ֭הֹוָה מִבְטַח֑/וֹ וְֽ/לֹא פָנָ֥ה אֶל רְ֝הָבִ֗ים וְ/שָׂטֵ֥י כָזָֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/004.yaml
  text: Blessed is the man who has made Yahweh his trust[a], and has not turned to the proud[d][c][b], to those who turn aside to falsehood.
translation:
  language: hi
  text: क्या ही धन्य[a] है वह पुरुष[b], जिसने याहवे को अपना भरोसा बनाया है और जो न तो घमंडियों[c] की ओर मुड़ा है, न ही उन लोगों की ओर जो झूठ[d] की ओर भटक जाते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘धन्य’ का अनुवाद ‘सुखी’ भी हो सकता है; इब्रानी शब्द में आशीष और कल्याण, दोनों का भाव है।
    reason: lexical_alternative
  - marker: b
    text: मूल में ‘पुरुष’ पुल्लिंग एकवचन है, पर यहाँ वह प्रतिनिधिक कथन में प्रयुक्त हुआ है।
    reason: cultural_note
  - marker: c
    text: या ‘अहंकारियों’। यहाँ इब्रानी शब्द को सामान्य संज्ञा समझना अधिक उचित है, व्यक्तिवाचक नाम ‘राहाब’ नहीं।
    reason: lexical_alternative
  - marker: d
    text: या ‘मिथ्या’ अथवा ‘छल’।
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: क्या ही धन्य है
  rationale: यह इब्रानी धन्यता-सूचक उद्गार को स्वाभाविक हिंदी में व्यक्त करता है और ज्ञान-साहित्य के आशीष तथा कल्याण—दोनों भावों को बनाए रखता है।
- source_word: הַגֶּבֶר
  choice: वह पुरुष
  rationale: इब्रानी शब्द व्याकरण की दृष्टि से पुल्लिंग एकवचन है और यहाँ प्रतिनिधिक अर्थ रखता है; ‘पुरुष’ स्रोत की रूपरेखा को सुरक्षित रखता है।
- source_word: שָׂם ... מִבְטַחוֹ
  choice: अपना भरोसा बनाया है
  rationale: ‘रखा/स्थापित किया’ के मूल भाव को हिंदी की स्वाभाविक अभिव्यक्ति में रखते हुए पूर्ण किए गए चुनाव का भाव व्यक्त किया गया है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम का देवनागरी लिप्यंतरण किया गया है, उसे किसी उपाधि से नहीं बदला गया।
- source_word: פָנָה אֶל
  choice: की ओर मुड़ा
  rationale: यह दिशा बदलने के चित्र के साथ किसी से सहायता, निष्ठा या सहारा लेने का निहित भाव भी बनाए रखता है।
- source_word: רְהָבִים
  choice: घमंडियों
  rationale: इस बहुवचन सामान्य संज्ञा का संदर्भ में सबसे संभावित अर्थ घमंडी या अहंकारी लोग है, न कि व्यक्तिवाचक नाम ‘राहाब’।
- source_word: שָׂטֵי כָזָב
  choice: जो झूठ की ओर भटक जाते हैं
  rationale: कृदंत का ‘मार्ग से हटने/भटकने’ का भाव और כָזָב का अमूर्त ‘झूठ/मिथ्यात्व’ अर्थ दोनों सुरक्षित रखे गए हैं।
theological_decisions:
- issue: ज्ञान-साहित्य की धन्यता में प्रतिनिधिक पुल्लिंग एकवचन
  choice: वह पुरुष
  alternative: वह व्यक्ति / वह जन
  rationale: मूल पाठ में גֶּבֶר पुल्लिंग एकवचन है, यद्यपि कथन का सिद्धांत व्यापक रूप से लागू होता है। मुख्य पाठ स्रोत-रूप को रखता है और पादटिप्पणी उसका प्रतिनिधिक प्रयोग स्पष्ट करती है।
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल में चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है; ‘प्रभु’ नाम को उपाधि में बदल देता, जबकि ‘यहोवा’ बाद की मिश्रित उच्चारण-परंपरा को दर्शाता है।
- issue: רְהָבִים की पहचान
  choice: घमंडी लोग
  alternative: राहाब से जुड़े लोग / अहंकारी लोग
  rationale: बहुवचन और समानांतर वाक्यांश के कारण इसे सामान्य संज्ञा मानना अधिक उपयुक्त है; व्यक्तिवाचक ‘राहाब’ मानना संदर्भ में अनावश्यक विशिष्टता जोड़ता।
- issue: अंतिम दो पदबंधों का संबंध
  choice: दो समानांतर समूह—घमंडी और झूठ की ओर भटकने वाले
  alternative: एक ही समूह का व्याख्यात्मक वर्णन—वे घमंडी जो झूठ की ओर भटकते हैं
  rationale: संयोजक וְ दोनों पाठ-संबंधों की अनुमति देता है। हिंदी में ‘न... न...’ से समानांतरता सामने आती है, पर दोनों समूहों के परस्पर आच्छादन को नकारा नहीं जाता।
translation_notes:
  register: आधुनिक मानक हिंदी का गरिमापूर्ण किंतु सहज ज्ञान-साहित्यिक स्वर रखा गया है। ‘क्या ही धन्य’ धन्यता-वचन की उद्गारात्मक शक्ति व्यक्त करता है। समानांतर ‘न... न...’ रचना इब्रानी काव्यगत संतुलन को स्वाभाविक हिंदी में बनाए रखती है।
