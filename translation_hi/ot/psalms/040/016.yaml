source:
  edition: WLC
  text: יָ֘שִׂ֤ישׂוּ וְ/יִשְׂמְח֨וּ בְּ/ךָ֗ כָּֽל מְבַ֫קְשֶׁ֥י/ךָ יֹאמְר֣וּ תָ֭מִיד יִגְדַּ֣ל יְהוָ֑ה אֹֽ֝הֲבֵ֗י תְּשׁוּעָתֶֽ/ךָ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/016.yaml
  text: Let all who seek you rejoice and be glad in you[a]; let those who love your salvation say continually[b], “May Yahweh be magnified!”
translation:
  language: hi
  text: जो तुझे खोजते हैं, वे सब तुझमें आनन्दित और प्रसन्न हों; जो तेरे उद्धार से प्रेम रखते हैं, वे निरन्तर कहें, “याहवे की महिमा बढ़े!”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '“याहवे की महिमा बढ़े” एक कामनासूचक उद्घोषणा है: अर्थात् याहवे की महानता खुले रूप से मानी और घोषित की जाए।'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשִׂישׂוּ וְיִשְׂמְחוּ
  choice: आनन्दित और मग्न हों
  rationale: दोनों अपूर्ण क्रियाओं को प्रसंगानुसार कामनासूचक रूप में रखा गया है। दो निकटार्थी अभिव्यक्तियाँ इब्रानी काव्यात्मक युग्म को बनाए रखती हैं।
- source_word: בְּךָ
  choice: तुझमें
  rationale: ב यहाँ आनन्द के केंद्र अथवा आधार को सूचित करता है; ‘तुझमें’ ईश्वर-केंद्रित भाव को संक्षेप और स्वाभाविक ढंग से रखता है।
- source_word: כָּל מְבַקְשֶׁיךָ
  choice: जो तुझे खोजते हैं, वे सब
  rationale: कृदन्त उन लोगों को दर्शाता है जिनकी पहचान परमेश्वर को खोजने से होती है; यह हिन्दी में सहज रूप है।
- source_word: יֹאמְרוּ תָמִיד
  choice: वे निरन्तर कहें
  rationale: अपूर्ण क्रिया और תָמִיד मिलकर बार-बार या लगातार कही जाने वाली उद्घोषणा व्यक्त करते हैं।
- source_word: יִגְדַּל יְהוָה
  choice: याहवे की महिमा बढ़े
  rationale: יִגְדַּל को कामनासूचक उद्घोषणा माना गया है, केवल तथ्यात्मक कथन नहीं। हिन्दी मुहावरे में यह परमेश्वर की महानता की सार्वजनिक स्वीकृति की कामना व्यक्त करता है।
- source_word: אֹהֲבֵי תְּשׁוּעָתֶךָ
  choice: जो तेरे उद्धार से प्रेम रखते हैं
  rationale: תְּשׁוּעָה यहाँ बचाव, छुटकारे या व्यापक उद्धार को सूचित कर सकता है। ‘उद्धार’ इस अर्थ-व्याप्ति और भजन के भक्तिपरक स्तर को बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: व्यक्तिगत ईश्वरीय नाम को उपाधि से बदलने के बजाय लिप्यंतरित किया गया है।
theological_decisions:
- issue: יִגְדַּל की विधि और उद्घोषणा का अर्थ
  choice: 'कामनासूचक: “याहवे की महिमा बढ़े!”'
  alternative: 'घोषणात्मक: “याहवे महान है!”'
  rationale: रूप और प्रार्थनामय संदर्भ कामना अथवा आह्वान का समर्थन करते हैं। इसका आशय यह नहीं कि याहवे अपने स्वरूप में अधिक महान बने, बल्कि यह कि उसकी महानता खुले रूप से मानी और घोषित की जाए।
- issue: תְּשׁוּעָה का अर्थ
  choice: उद्धार
  alternative: छुटकारा
  rationale: शब्द किसी ठोस संकट से बचाव और व्यापक उद्धार—दोनों अर्थ रख सकता है। मुख्य पाठ में ‘उद्धार’ अर्थ-व्याप्ति को अधिक खुला रखता है।
- issue: ईश्वरीय नाम יְהוָה
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत नाम है; ‘याहवे’ उसका आधुनिक विद्वतापरक लिप्यंतरण है और उसे केवल उपाधि में नहीं बदलता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमामय भजनात्मक शैली रखी गई है। परमेश्वर के लिए एकवचन आत्मीय सर्वनाम ‘तू/तेरा’ के रूप प्रयुक्त हैं। ‘आनन्दित और मग्न’ काव्यात्मक समानांतरता को बनाए रखते हुए सामान्य पाठक के लिए बोधगम्य है।
