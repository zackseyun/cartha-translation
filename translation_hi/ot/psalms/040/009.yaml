  yaml_path: translation/ot/psalms/040/009.yaml
  text: I have proclaimed righteousness in the great assembly[a]; behold, I have not restrained my lips; O Yahweh[b], you know.
translation:
  language: hi
  text: मैंने बड़ी सभा में धार्मिकता[a] की घोषणा की है। देख, मैंने अपने होंठों को नहीं रोका; हे याहवे, तू जानता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “न्याय।” इब्रानी शब्द צֶדֶק में नैतिक धार्मिकता और न्याय—दोनों के भाव हो सकते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּשַּׂרְתִּי
  choice: शुभ समाचार सुनाया है
  rationale: पिएल रूप सार्वजनिक रूप से समाचार—प्रायः शुभ समाचार—सुनाने का भाव रखता है। यह चयन उसके सकारात्मक और घोषणात्मक बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: צֶדֶק
  choice: धार्मिकता
  rationale: यहाँ शब्द परमेश्वर के सही और न्यायपूर्ण चरित्र अथवा कार्य को सूचित कर सकता है। ‘धार्मिकता’ नैतिक और वाचा-संबंधी भाव को रखती है, जबकि ‘न्याय’ की वास्तविक संभावना पादटिप्पणी में दी गई है।
- source_word: בְּקָהָל רָב
  choice: बड़ी सभा में
  rationale: קָהָל एकत्र समुदाय या सभा है और רָב उसके बड़े होने को बताता है; यह हिन्दी में सार्वजनिक, सामुदायिक परिवेश को स्पष्ट रखता है।
- source_word: הִנֵּה
  choice: देख
  rationale: यह ध्यान आकर्षित करने वाला काव्यात्मक संकेत है; आधुनिक हिन्दी में ‘देख’ उसके बल को सहज रूप से व्यक्त करता है।
- source_word: שְׂפָתַי לֹא אֶכְלָא
  choice: मैंने अपने होंठों को नहीं रोका
  rationale: यह मूल के ठोस ‘होंठ’ रूपक और वाणी को न रोकने के अर्थ, दोनों को बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल में प्रयुक्त व्यक्तिगत दिव्य नाम יהוה को हिन्दी में प्रचलित नामरूप ‘यहोवा’ से व्यक्त किया गया है, किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: יָדָעְתָּ
  choice: तू जानता है
  rationale: पूर्ण क्रिया यहाँ वर्तमान ज्ञान की स्थायी अवस्था को व्यक्त करती है; सीधे संबोधन में यह स्वाभाविक हिन्दी है।
theological_decisions:
- issue: צֶדֶק का अर्थ-क्षेत्र
  choice: धार्मिकता
  alternative: न्याय
  rationale: मूल शब्द नैतिक सहीपन और न्यायिक न्याय दोनों को समेट सकता है। मुख्य पाठ में ‘धार्मिकता’ रखा गया है और दूसरी वास्तविक संभावना पादटिप्पणी में सुरक्षित है।
- issue: दिव्य नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: इसे ‘प्रभु’ जैसी उपाधि से बदलने के बजाय व्यक्तिगत नाम के रूप में रखा गया है। हिन्दी पाठकों में अधिक परिचित रूप ‘यहोवा’ चुना गया है; सटीक प्राचीन उच्चारण निश्चित नहीं है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और काव्यात्मक हिन्दी; ईश्वर को संबोधन में एकवचन ‘तू/तेरी’ रखा गया है। ‘देख’ मूल के ध्यानाकर्षक संकेत को स्वाभाविक बनाता है और ‘होंठ’ की मूल काव्य-छवि सुरक्षित रखी गई है।
