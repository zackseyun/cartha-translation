source:
  edition: WLC
  text: זֶ֤בַח וּ/מִנְחָ֨ה לֹֽא חָפַ֗צְתָּ אָ֭זְנַיִם כָּרִ֣יתָ לִּ֑/י עוֹלָ֥ה וַ֝/חֲטָאָ֗ה לֹ֣א שָׁאָֽלְתָּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/006.yaml
  text: Sacrifice and offering you did not desire[a]; ears you have opened for me[b]; burnt offering and sin offering you did not ask for.
translation:
  language: hi
  text: 'बलिदान और भेंट[a] तूने नहीं चाहे;

    तूने मेरे लिए कान खोद दिए[b];

    होमबलि और पापबलि तूने नहीं माँगी।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या अधिक विशेष रूप से, “अन्नबलि।”
    reason: lexical_alternative
  - marker: b
    text: 'शाब्दिक इब्रानी: “तूने मेरे लिए कान खोद दिए।” यह संभवतः सुनने या आज्ञा मानने में समर्थ करने का मुहावरा है; तुलना करें, “तूने मेरे कान खोल दिए।” सेप्टुआजिन्ट में यहाँ “तूने मेरे लिए एक देह तैयार की” है; इब्रानियों 10:5 उसी रूप का अनुसरण करता है।'
    reason: alternative_reading
lexical_decisions:
- source_word: זֶבַח
  choice: बलिदान
  rationale: उपासना-संबंधी प्रसंग में सामान्य बलि के लिए यह स्वाभाविक और प्रचलित हिन्दी शब्द है।
- source_word: מִנְחָה
  choice: भेंट
  rationale: यह शब्द सामान्य भेंट को सूचित कर सकता है, यद्यपि इस प्रसंग में विशेष रूप से अन्नबलि भी अभिप्रेत हो सकती है; उस अधिक विशिष्ट अर्थ को पादटिप्पणी में रखा गया है।
- source_word: חָפַצְתָּ
  choice: तूने नहीं चाहे
  rationale: मूल क्रिया की इच्छा या प्रसन्नता की धारणा को सरल, सीधी हिन्दी में व्यक्त करता है और समानांतर पंक्ति के ‘नहीं माँगी’ से भेद बनाए रखता है।
- source_word: אָזְנַיִם
  choice: कान
  rationale: मूल में द्विवचन संज्ञा है; हिन्दी में ‘कान’ स्वाभाविक रूप से दोनों कानों का बोध करा सकता है।
- source_word: כָּרִיתָ לִּי
  choice: तूने मेरे लिए कान खोद दिए
  rationale: ‘खोदना’ मूल क्रिया כרה के ठोस चित्र को सुरक्षित रखता है। असामान्य इब्रानी मुहावरे का संभावित अर्थ पादटिप्पणी में स्पष्ट किया गया है।
- source_word: עוֹלָה
  choice: होमबलि
  rationale: पूरी तरह आग में चढ़ाई जाने वाली बलि के लिए यह सटीक और प्रचलित बाइबलीय हिन्दी पद है।
- source_word: חֲטָאָה
  choice: पापबलि
  rationale: बलिदान-संबंधी समानांतरता में यह संज्ञा अमूर्त ‘पाप’ के बजाय पाप के लिए चढ़ाई जाने वाली बलि को दर्शाती है।
- source_word: שָׁאָלְתָּ
  choice: तूने नहीं माँगी
  rationale: मूल के ‘माँगना’ अर्थ को सीधे रखता है; ‘आवश्यक ठहराना’ जैसे अधिक व्याख्यात्मक अर्थ से बचता है।
theological_decisions:
- issue: इब्रानी ‘मेरे लिए कान खोद दिए’ और इब्रानियों 10:5 में उद्धृत यूनानी रूप ‘मेरे लिए एक देह तैयार की’ का संबंध
  choice: मुख्य पाठ में इब्रानी शब्दचित्र ‘तूने मेरे लिए कान खोद दिए’ रखा गया है।
  alternative: ‘तूने मेरे कान खोल दिए’ अथवा सेप्टुआजिन्ट और इब्रानियों 10:5 के अनुसार ‘तूने मेरे लिए एक देह तैयार की।’
  rationale: भजन के मुख्य पाठ में इब्रानी स्रोत को प्राथमिकता दी गई है और उसे नए नियम के उद्धरण के अनुरूप चुपचाप नहीं बदला गया। साथ ही, पादटिप्पणी यूनानी परंपरा और संभावित मुहावरेदार अर्थ दोनों को पारदर्शी रूप से बताती है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और काव्यात्मक हिन्दी रखी गई है। परमेश्वर के लिए एकवचन आत्मीय संबोधन ‘तू’ भजन की सीधी प्रार्थनात्मक वाणी के अनुरूप है। अर्धविराम इब्रानी समानांतर पंक्तियों को स्पष्ट करते हैं।
