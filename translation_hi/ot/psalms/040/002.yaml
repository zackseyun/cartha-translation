source:
  edition: WLC
  text: וַ/יַּעֲלֵ֤/נִי מִ/בּ֥וֹר שָׁאוֹן֮ מִ/טִּ֪יט הַ/יָּ֫וֵ֥ן וַ/יָּ֖קֶם עַל סֶ֥לַע רַגְלַ֗/י כּוֹנֵ֥ן אֲשֻׁרָֽ/י׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/002.yaml
  text: He brought me up out of the pit of tumult[a], out of the miry clay; he set my feet on a rock, making my steps secure.
translation:
  language: hi
  text: उसने मुझे कोलाहल के गड्ढे से, दलदली कीचड़ में से ऊपर निकाला; उसने मेरे पाँव चट्टान पर टिकाए और मेरे कदम दृढ़ किए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲלֵנִי
  choice: उसने मुझे ... ऊपर निकाला
  rationale: हिफ़ील रूप का अर्थ ‘ऊपर ले आना/निकालना’ है; यह गड्ढे से ठोस बचाव का बिंब बनाए रखता है।
- source_word: מִבּוֹר
  choice: गड्ढे ... में से
  rationale: בּוֹר गड्ढे, हौद या कारागार-जैसे गहरे स्थान को दर्शा सकता है; इस काव्यात्मक प्रसंग में ‘गड्ढा’ स्वाभाविक और व्यापक है।
- source_word: שָׁאוֹן
  choice: कोलाहल
  rationale: मूल शब्द शोर, गर्जन या उपद्रव को व्यक्त करता है। ‘कोलाहल’ इस प्रत्यक्ष अर्थ को रखता है और इसे व्याख्यात्मक रूप से ‘विनाश’ नहीं बनाता।
- source_word: מִטִּיט הַיָּוֵן
  choice: दलदली कीचड़ में से
  rationale: दोनों शब्द कीचड़, दलदल और फिसलन भरी मिट्टी का संयुक्त बिंब बनाते हैं; ‘दलदली कीचड़’ आधुनिक हिन्दी में अस्थिर, धँसाने वाले गारे का भाव स्पष्ट करता है।
- source_word: וַיָּקֶם עַל סֶלַע רַגְלַי
  choice: उसने मेरे पाँव चट्टान पर टिकाए
  rationale: קום के हिफ़ील रूप में खड़ा करने या स्थापित करने का भाव है। ‘टिकाए’ अस्थिर कीचड़ के विपरीत चट्टान पर स्थिरता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: כּוֹנֵן אֲשֻׁרָי
  choice: मेरे कदम दृढ़ किए
  rationale: כון के पोलेल रूप में दृढ़ या स्थिर करने का भाव है, और אֲשֻׁרָי का अर्थ ‘मेरे कदम’ है। यह संक्षिप्त रूप समानांतर काव्य-बिंब को सुरक्षित रखता है।
theological_decisions:
- issue: ठोस बचाव-बिंब को बनाए रखना या उसे नैतिक/आत्मिक छुटकारे के रूप में अमूर्त करना
  choice: गड्ढे, कीचड़, पाँव, चट्टान और कदम के ठोस बिंब बनाए रखे गए हैं।
  alternative: ‘उसने मुझे विनाश से बचाया’ जैसे अमूर्त और अधिक व्याख्यात्मक अनुवाद।
  rationale: इब्रानी पद ठोस काव्यात्मक चित्रों के माध्यम से छुटकारा व्यक्त करता है; मुख्य पाठ में उसके धार्मिक आशय को किसी एक अमूर्त व्याख्या तक सीमित नहीं किया गया।
- issue: שָׁאוֹן को ‘कोलाहल’ या ‘विनाश’ समझना
  choice: मुख्य पाठ में ‘कोलाहल’।
  alternative: ‘विनाश’ अथवा ‘उजाड़’।
  rationale: शब्द का अधिक प्रत्यक्ष अर्थ शोर, गर्जन या कोलाहल है। संदर्भ में विनाश का भाव संभव हो सकता है, पर उसे मुख्य पाठ में निश्चित करना मूल की अस्पष्टता को घटा देगा।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण काव्यात्मक गद्य। ‘कोलाहल’ स्रोत के ध्वनि-बिंब को रखता है; ‘दलदली कीचड़’ सामान्य पाठक के लिए स्पष्ट है। अर्धविराम पद के दो समानांतर बचाव-खंडों को अलग करता है।
