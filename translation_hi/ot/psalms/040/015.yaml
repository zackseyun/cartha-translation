  yaml_path: translation/ot/psalms/040/015.yaml
  text: Let those who say to me[a], “Aha[b], aha!” be appalled because of their shame.
translation:
  language: hi
  text: जो मुझसे “आहा, आहा!” कहते हैं, वे अपनी लज्जा के कारण स्तब्ध रह जाएँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יָשֹׁמּוּ
  choice: स्तब्ध रह जाएँ
  rationale: שׁמם का यह रूप उजड़ जाने अथवा भय-विस्मय से स्तब्ध होने का भाव दे सकता है। उपहास के प्रत्युत्तर में आने वाले न्याय के संदर्भ में ‘स्तब्ध रह जाएँ’ स्वाभाविक हिंदी में आघात और चकित अपमान का भाव रखता है।
- source_word: עַל עֵקֶב
  choice: के कारण
  rationale: शाब्दिक रूप से इसमें ‘एड़ी/पीछे’ की छवि है, पर यहाँ पदबंध कारण अथवा परिणाम व्यक्त करता है। ‘के कारण’ आधुनिक हिंदी में इसका सीधा और स्वाभाविक अर्थ देता है।
- source_word: בָּשְׁתָּם
  choice: अपनी लज्जा
  rationale: यह शब्द लज्जा, अपमान या बदनामी को दर्शाता है। हिंदी वाक्य-संरचना में कर्ता के साथ संबंध स्पष्ट करने हेतु ‘उनकी’ की अपेक्षा ‘अपनी’ अधिक स्वाभाविक है।
- source_word: הָאֹמְרִים לִי
  choice: जो मुझसे … कहते हैं
  rationale: सव्यय कृदंत यहाँ व्यक्तियों के समूह को सूचित करता है; ‘जो मुझसे … कहते हैं’ इसका सहज हिंदी रूप है।
- source_word: הֶאָח הֶאָח
  choice: आहा, आहा!
  rationale: यह दुर्भावनापूर्ण हर्ष और उपहास की पुनरुक्त विस्मयध्वनि है। ‘आहा, आहा!’ मूल की ध्वनि और ताने के बल को बनाए रखता है।
