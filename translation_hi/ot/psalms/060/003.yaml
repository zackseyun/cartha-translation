  edition: WLC
  text: הִרְאִ֣יתָה עַמְּ/ךָ֣ קָשָׁ֑ה הִ֝שְׁקִיתָ֗/נוּ יַ֣יִן תַּרְעֵלָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/060/003.yaml
  text: You have shown your people hard things[a]; you have made us drink wine of staggering.
translation:
  language: hi
  text: 'तूने अपनी प्रजा को कठिन समय दिखाया है;

    तूने हमें लड़खड़ा देनेवाली मदिरा[a] पिलाई है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “डगमगा देनेवाली मदिरा” अथवा “बदहवासी की मदिरा।”
    reason: תַּרְעֵלָה लड़खड़ाहट, डगमगाहट और बदहवासी की निकटवर्ती अर्थ-छायाएँ रखता है।
lexical_decisions:
- source_word: הִרְאִיתָה
  choice: दिखाया है
  rationale: हिफ़ील रूप का मूल अर्थ ‘दिखाना’ है। हिंदी में यह इब्रानी बिंब को बनाए रखता है और अगले पदांश के साथ परमेश्वर द्वारा कराए गए अनुभव का भाव देता है।
- source_word: עַמְּךָ
  choice: अपनी प्रजा
  rationale: यहाँ עַם परमेश्वर से संबद्ध समुदाय को सूचित करता है; ‘अपनी प्रजा’ स्वाभाविक और वाचा-संबंधी भाव के अनुकूल है।
- source_word: קָשָׁה
  choice: कठिन समय
  rationale: स्त्रीलिंग विशेषण यहाँ संज्ञा-सदृश होकर कठोर या दुःखद परिस्थिति का बोध कराता है। ‘कठिन समय’ आधुनिक हिंदी में स्वाभाविक है और किसी विशिष्ट विपत्ति को अनावश्यक रूप से नहीं जोड़ता।
- source_word: הִשְׁקִיתָנוּ
  choice: तूने हमें ... पिलाई है
  rationale: שקה के हिफ़ील रूप में किसी को पीने देना या पिलाना निहित है। ‘पिलाई है’ कारणवाचक और आरोपित अनुभव—दोनों को संक्षेप में व्यक्त करता है।
- source_word: יַיִן
  choice: मदिरा
  rationale: शाब्दिक अर्थ ‘दाखमधु/मदिरा’ है और यहाँ यह रूपक के रूप में प्रयुक्त है। ‘मदिरा’ काव्यात्मक, स्पष्ट और गरिमापूर्ण है।
- source_word: תַּרְעֵלָה
  choice: लड़खड़ा देनेवाली
  rationale: यह संज्ञा लड़खड़ाहट, डगमगाहट या मदहोश-बदहवास दशा को व्यक्त करती है। संबंधवाचक पदबंध हिंदी में स्वाभाविक रहते हुए अनुभवजन्य परिणाम को स्पष्ट करता है; विकल्प पादटिप्पणी में दिए गए हैं।
theological_decisions:
- issue: ‘मदिरा’ के बिंब का रूपकात्मक बल
  choice: मदिरा का बिंब परमेश्वर द्वारा अपनी प्रजा को अनुभव कराई गई घोर विपत्ति और दिशाहीनता को व्यक्त करता है।
  alternative: इसे वास्तविक मदिरा-पान अथवा न्याय के भाव से रहित सामान्य दुःख का संकेत माना जा सकता है।
  rationale: पहले पदांश के ‘कठिन समय’ के साथ समानांतरता तथा लड़खड़ाने वाली मदिरा का बाइबलीय बिंब रूपकात्मक विपत्ति और न्याय की ओर संकेत करते हैं। अनुवाद रूपक को समझाकर हटाने के बजाय ज्यों का त्यों रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी का सरल किंतु काव्यात्मक और गरिमापूर्ण रूप अपनाया गया है। परमेश्वर को संबोधन में एकवचन ‘तू’ भजन-साहित्य की सीधी, निकट संबोधन-शैली को बनाए रखता है।
