    text: या “कि वह दिखाया जाए,” “कि वे एकत्र हों,” अथवा सम्भवतः “कि वे भाग जाएँ।” यहाँ प्रयुक्त हिब्रू क्रिया कठिन और विवादित है।
    reason: lexical_alternative
