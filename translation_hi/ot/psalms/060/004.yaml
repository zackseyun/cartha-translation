  language: hi
  text: 'तूने तेरा भय मानने वालों को एक झंडा दिया है,

    कि वह सत्य[b] के कारण ऊँचा उठाया जाए[a]।


    सेला'
  philosophy: optimal-equivalence
  footnotes:
