lexical_decisions:
- source_word: נָתַתָּה
  choice: तूने ... दिया है
  rationale: यह נתן का काल पूर्ण, द्वितीय पुरुष एकवचन पुल्लिंग रूप है और परमेश्वर को सम्बोधित है। हिन्दी में पूर्ण वर्तमान बीते हुए कार्य की वर्तमान प्रासंगिकता बनाए रखता है।
- source_word: לִירֵאֶיךָ
  choice: अपने भय माननेवालों को
  rationale: यह ירא से बना सहभागी रूप है। ‘भय माननेवाले’ केवल आतंक नहीं, बल्कि परमेश्वर के प्रति श्रद्धापूर्ण भय को व्यक्त करता है।
- source_word: נֵס
  choice: झण्डा
  rationale: נֵס ऊँचा किए गए संकेत-ध्वज या सैन्य पताका को दर्शाता है। ‘झण्डा’ साधारण आधुनिक हिन्दी में स्पष्ट है और एकत्र होने के सार्वजनिक संकेत की छवि बनाए रखता है।
- source_word: לְהִתְנוֹסֵס
  choice: कि वह ... ऊँचा किया जाए
  rationale: यह कठिन और विवादित क्रियारूप है। נֵס के साथ इसका निष्क्रिय/आत्मवाचक अर्थ ‘ऊँचा किया जाना’ प्रसंग की ध्वज-छवि को सबसे स्वाभाविक रूप से बनाए रखता है; अन्य सम्भावनाएँ पादटिप्पणी में दी गई हैं।
- source_word: מִפְּנֵי
  choice: के कारण
  rationale: शाब्दिक अर्थ ‘के सामने/के मुख से’ है, पर यहाँ कारणसूचक अर्थ सम्भव और हिन्दी में स्वाभाविक है।
- source_word: קֹשֶׁט
  choice: सत्य
  rationale: यह काव्यात्मक शब्द सम्भवतः ‘सत्य’ या ‘सच्चाई’ का अर्थ देता है। मूल में निश्चित उपपद नहीं है, इसलिए हिन्दी में अनावश्यक निश्चितता जोड़े बिना ‘सत्य’ रखा गया है।
- source_word: סֶלָה
  choice: सेला
  rationale: इसके ठीक आराधनात्मक या संगीत-संबंधी अर्थ की अनिश्चितता के कारण हिब्रू रूप का देवनागरी लिप्यन्तरण रखा गया है।
