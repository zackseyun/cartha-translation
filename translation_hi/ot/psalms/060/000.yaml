- source_word: מִכְתָּם
  choice: मिक्ताम
  rationale: इस इब्रानी काव्य अथवा संगीत-विधा-सूचक शब्द का अर्थ निश्चित नहीं है; इसलिए अनुमानित अर्थ देने के बजाय लिप्यंतरण रखा गया है।
- source_word: לְדָוִד
  choice: दाऊद का
  rationale: इब्रानी संबंधसूचक रचना लेखकत्व, संबद्धता अथवा समर्पण का संकेत दे सकती है। “दाऊद का” इस बहुअर्थता को “दाऊद द्वारा” की अपेक्षा बेहतर बनाए रखता है।
- source_word: לְלַמֵּד
  choice: सिखाने के लिए
  rationale: यह उद्देश्यसूचक रूप है और रचना के शिक्षण हेतु प्रयुक्त होने का भाव व्यक्त करता है।
