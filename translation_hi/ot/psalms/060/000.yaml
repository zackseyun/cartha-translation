  yaml_path: translation/ot/psalms/060/000.yaml
  text: 'For the choirmaster: according to “Lily of Testimony.”[a] A miktam[b] of David[c], for teaching when he fought against Aram-naharaim and Aram-zobah, and Joab returned and struck down twelve thousand of Edom in the Valley of Salt.'
translation:
  language: hi
  text: 'संगीत-निर्देशक के लिए: “साक्षी की लिली” के अनुसार।[a] दाऊद का[c] मिक्ताम,[b] शिक्षा के लिए।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: संभवतः अर्थ है, “साक्षी की लिली” नामक धुन पर। इब्रानी में शायद किसी संगीत या आराधनात्मक शीर्षक का उल्लेख है, पर उसका सटीक अर्थ निश्चित नहीं है।
    reason: lexical_alternative
  - marker: b
    text: “मिक्ताम” अनिश्चित अर्थ वाला इब्रानी विधा-सूचक शब्द है; यह कोई संगीतात्मक या साहित्यिक पदनाम हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: “दाऊद का” का अर्थ “दाऊद द्वारा रचित,” “दाऊद के लिए,” अथवा “दाऊद से संबद्ध” भी हो सकता है।
    reason: alternative_reading
