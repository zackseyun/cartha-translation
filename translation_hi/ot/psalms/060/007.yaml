base_translation:
  language: en
  yaml_path: translation/ot/psalms/060/007.yaml
  text: Gilead is mine[a], and Manasseh is mine; Ephraim is the stronghold of my head[b]; Judah is my scepter.
translation:
  language: hi
  text: गिलाद मेरा है, और मनश्शे भी मेरा है; एप्रैम मेरे सिर का गढ़ है; यहूदा मेरा राजदंड है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “यहूदा मेरा विधिदाता है” अथवा “यहूदा मेरे शासक का राजदंड है।” इब्रानी शब्द आदेश देने वाले व्यक्ति या शासन के प्रतीक दंड/राजदंड—दोनों का संकेत कर सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: לִי
  choice: मेरा है
  rationale: पूर्वसर्ग לְ पर प्रथम पुरुष एकवचन प्रत्यय अधिकार व्यक्त करता है; हिंदी में “मेरा है” इसका सीधा और स्वाभाविक रूप है। दूसरे खंड में प्रवाह के लिए “भी” जोड़ा गया है।
- source_word: גִלְעָד
  choice: गिलआद
  rationale: स्थानवाचक नाम का प्रचलित हिंदी बाइबलीय लिप्यंतरण।
- source_word: מְנַשֶּׁה
  choice: मनश्शे
  rationale: गोत्र और क्षेत्र के नाम का प्रचलित हिंदी लिप्यंतरण।
- source_word: אֶפְרַיִם
  choice: एप्रैम
  rationale: गोत्र के नाम का प्रचलित हिंदी लिप्यंतरण।
- source_word: מָעוֹז
  choice: गढ़
  rationale: यह संज्ञा सामर्थ्य, शरण अथवा सुरक्षित दुर्ग का बोध करा सकती है; “गढ़” सैन्य और सुरक्षात्मक बिंब को संक्षिप्त, स्वाभाविक हिंदी में बनाए रखता है।
- source_word: רֹאשִׁי
  choice: मेरे सिर का
  rationale: मूल का ठोस शारीरिक रूपक बनाए रखा गया है; इसे “मेरी रक्षा” जैसे व्याख्यात्मक रूप में नहीं बदला गया।
- source_word: מְחֹקְקִי
  choice: मेरा राजदंड
  rationale: शब्द आदेश देने वाले शासक या शासन के प्रतीक दंड को सूचित कर सकता है। पद के राजकीय-सैन्य समानांतर में “राजदंड” स्वाभाविक है, जबकि अन्य संभावनाएँ पादटिप्पणी में सुरक्षित हैं।
theological_decisions:
- issue: מְחֹקְקִי का राजकीय अर्थ
  choice: मेरा राजदंड
  alternative: मेरा विधि देनेवाला; मेरे शासक का दंड
  rationale: “राजदंड” यहूदा से जुड़ी राजसत्ता के प्रतीकात्मक बिंब को बनाए रखता है, पर मूल शब्द व्यक्ति—अर्थात आदेश देने वाले—का भी संकेत दे सकता है; इसलिए उस वास्तविक अस्पष्टता को पादटिप्पणी में रखा गया है।
- issue: מָעוֹז רֹאשִׁי का रूपक
  choice: मेरे सिर का गढ़
  alternative: मेरे सिर के लिए गढ़; मेरे सिर की रक्षा
  rationale: इब्रानी संबंधवाचक संरचना और “सिर” के रूपक को बिना धर्मवैचारिक विस्तार के यथासंभव प्रत्यक्ष रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और संक्षिप्त रखी गई है। “गढ़” सामान्य पाठक के लिए सुबोध है और मूल सैन्य-सुरक्षात्मक रूपक को बचाता है। “मेरे सिर का गढ़” जानबूझकर कुछ काव्यात्मक रखा गया है, क्योंकि मूल पद भी रूपकात्मक है।
