  yaml_path: translation/ot/psalms/060/012.yaml
  text: With God we will do valiantly[b][a], and he will trample our adversaries.
translation:
  language: hi
  text: परमेश्वर के साथ हम वीरता दिखाएँगे[a], और वही हमारे शत्रुओं को रौंदेगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “परमेश्वर के द्वारा हम वीरता दिखाएँगे।” इब्रानी संबंधबोधक उपसर्ग साथ होने या साधन—दोनों का भाव व्यक्त कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “हमारे शत्रुओं को पैरों तले कुचलेगा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאלֹהִים
  choice: परमेश्वर के साथ
  rationale: בְ यहाँ निकट सहभागिता अथवा साधन—दोनों का भाव दे सकता है। मुख्य पाठ में स्वाभाविक हिन्दी ‘परमेश्वर के साथ’ रखी गई है, जबकि ‘परमेश्वर के द्वारा’ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: נַעֲשֶׂה חָיִל
  choice: हम वीरता के काम करेंगे
  rationale: עשה חיל एक मुहावरा है जिसका अर्थ वीरता दिखाना या पराक्रमी कार्य करना है। यह अनुवाद मूल क्रिया और सैन्य-काव्यात्मक भाव दोनों को सहज हिन्दी में व्यक्त करता है।
- source_word: וְהוּא
  choice: और वही
  rationale: स्वतंत्र सर्वनाम הוּא पर बल है; ‘वही’ इस बात को स्पष्ट करता है कि निर्णायक रूप से शत्रुओं को अधीन करने वाला परमेश्वर है।
- source_word: יָבוּס
  choice: रौंद डालेगा
  rationale: בוס का ठोस बिंब पैरों तले रौंदने का है। ‘रौंद डालेगा’ आधुनिक हिन्दी में जीवंत है और मूल की युद्ध-संबंधी छवि बनाए रखता है।
- source_word: צָרֵינוּ
  choice: हमारे शत्रुओं
  rationale: צָרֵינוּ विरोधियों या शत्रुओं को दर्शाता है। इस सैन्य संदर्भ में ‘शत्रुओं’ सबसे सहज और सटीक हिन्दी है।
theological_decisions:
- issue: विजय में मानवीय और ईश्वरीय कर्तृत्व
  choice: लोग परमेश्वर के साथ वीरता के काम करते हैं, और परमेश्वर स्वयं निर्णायक रूप से शत्रुओं को रौंदता है।
  alternative: केवल मनुष्य के पराक्रम या केवल ईश्वरीय क्रिया पर बल देना।
  rationale: इब्रानी पाठ दोनों कथनों को साथ रखता है—‘हम करेंगे’ और ‘वही रौंद डालेगा’। अनुवाद इस तनाव को किसी एक पक्ष में समेटे बिना बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक रखी गई है। ‘वीरता के काम करेंगे’ सामान्य पाठक के लिए बोधगम्य रहते हुए עשה חיל के मुहावरे को व्यक्त करता है; ‘रौंद डालेगा’ मूल की सजीव युद्ध-छवि बनाए रखता है।
