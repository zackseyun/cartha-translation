  yaml_path: translation/ot/psalms/060/010.yaml
  text: Have you not[a], O God, rejected us, and do you not go out, O God[c][b], with our armies?
translation:
  language: hi
  text: हे परमेश्वर, क्या तूने ही हमें त्याग नहीं दिया है[a]? और क्या तू, हे परमेश्वर, हमारी सेनाओं के साथ नहीं निकलता[b][c]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘हमें ठुकरा दिया है’।
    reason: lexical_alternative
  - marker: b
    text: यहाँ ‘निकलना’ युद्ध के लिए सेना के साथ कूच करने का भाव रखता है।
    reason: cultural_note
  - marker: c
    text: या ‘और तू, हे परमेश्वर, हमारी सेनाओं के साथ नहीं निकलता।’
    reason: syntactical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: क्या तू ही नहीं है
  rationale: यह अलंकारिक प्रश्न आरम्भ करता है और אַתָּה के बल को ‘ही’ द्वारा व्यक्त करता है।
- source_word: אֱלֹהִים
  choice: हे परमेश्वर
  rationale: यहाँ सीधा संबोधन है; इब्रानी में इसकी पुनरावृत्ति को हिन्दी में भी बनाए रखा गया है।
- source_word: זְנַחְתָּנוּ
  choice: हमें त्याग दिया है
  rationale: यह स्पष्ट और स्वाभाविक आधुनिक हिन्दी है तथा परमेश्वर द्वारा अपनी प्रजा को ठुकराए जाने की विलापपूर्ण तीव्रता को कम नहीं करती।
- source_word: וְלֹא תֵצֵא
  choice: और क्या तू ... नहीं निकलता
  rationale: दूसरे खंड को पहले अलंकारिक प्रश्न के अंतर्गत रखते हुए वर्तमान सैन्य परिस्थिति में परमेश्वर के साथ न निकलने का भाव व्यक्त करता है।
- source_word: בְּצִבְאוֹתֵינוּ
  choice: हमारी सेनाओं के साथ
  rationale: यहाँ צבאות मनुष्यों की युद्धरत सेनाओं को दर्शाता है और בְּ संगति या साथ जाने का भाव देता है।
theological_decisions:
- issue: विलाप में परमेश्वर द्वारा त्यागे जाने का कथन
  choice: सीधे कहा गया है कि परमेश्वर ने हमें त्याग दिया है और वह सेनाओं के साथ नहीं निकलता।
  alternative: ‘तूने ऐसा होने दिया’ या ‘ऐसा लगा कि तूने त्याग दिया’ कहकर कथन को नरम करना।
  rationale: इब्रानी पाठ यह बात सीधे परमेश्वर से कहता है। अनुवाद विलाप के धर्मवैचारिक तनाव को बनाए रखता है और उसे स्पष्टीकरण देकर कम नहीं करता।
- issue: नकार के साथ दूसरे खंड का वाक्य-विन्यास
  choice: दूसरे खंड को भी प्रश्न के रूप में प्रस्तुत किया गया है।
  alternative: ‘और तू ... साथ नहीं निकलता’ के रूप में कथन।
  rationale: आरम्भिक הֲלֹא का प्रश्नात्मक प्रभाव समन्वित दूसरे खंड तक समझा जा सकता है, पर कथनात्मक पाठ भी व्याकरणतः संभव और प्रचलित है; इसलिए उसे पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और प्रार्थनात्मक हिन्दी। परमेश्वर के सीधे संबोधन में ‘तू’ रखा गया है, और इब्रानी की पुनरावृत्ति तथा अलंकारिक प्रश्न की तीव्रता सुरक्षित रखी गई है।
