  yaml_path: translation/ot/psalms/060/002.yaml
  text: You have shaken the earth; you have split it open. Heal its fractures[a], for it is tottering.
translation:
  language: hi
  text: तूने धरती को हिला दिया; तूने उसे फाड़ दिया। उसकी दरारों को भर दे[a], क्योंकि वह डगमगा रही है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘धरती’ का अनुवाद ‘देश’ या ‘भूमि’ भी हो सकता है। इब्रानी אֶרֶץ का अर्थ पूरी पृथ्वी अथवा कोई विशेष देश हो सकता है; यहाँ का काव्यात्मक संदर्भ दोनों अर्थों की गुंजाइश रखता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הִרְעַשְׁתָּה
  choice: तूने ... हिला दिया
  rationale: हिफ़ील रूप धरती को हिलाने या कंपाने का कारक भाव व्यक्त करता है; यह हिंदी में स्वाभाविक और सजीव है।
- source_word: אֶרֶץ
  choice: धरती
  rationale: इब्रानी शब्द का अर्थ पूरी पृथ्वी या कोई विशेष देश/भूमि हो सकता है। ‘धरती’ भूकंप-सदृश काव्यात्मक बिंब को बनाए रखती है, जबकि पादटिप्पणी दूसरा अर्थ बताती है।
- source_word: פְּצַמְתָּהּ
  choice: तूने उसे फाड़ दिया
  rationale: क्रिया तोड़ने, चीरने या दरार उत्पन्न करने का भाव देती है; ‘फाड़ दिया’ अगली पंक्ति की दरारों के बिंब से स्वाभाविक रूप से जुड़ता है।
- source_word: רְפָה
  choice: भर दे
  rationale: मूल क्रिया का सामान्य अर्थ ‘चंगा करना’ है, पर धरती की दरारों के साथ हिंदी में ‘भर दे’ उसी पुनर्स्थापनकारी रूपक को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: שְׁבָרֶיהָ
  choice: उसकी दरारों
  rationale: संज्ञा टूटन, दरार या टूटे हुए स्थान को दर्शाती है; भूकंप के बिंब में ‘दरारों’ सबसे सटीक और सहज है।
- source_word: כִי
  choice: क्योंकि
  rationale: यह विनती का कारण प्रस्तुत करता है और आधुनिक हिंदी में स्पष्ट संबंध स्थापित करता है।
- source_word: מָטָה
  choice: वह डगमगा रही है
  rationale: क्रिया झुकने, अस्थिर होने या लड़खड़ाने का भाव देती है; यह अनवरत अस्थिरता को व्यक्त करती है, पूर्ण विनाश को नहीं।
