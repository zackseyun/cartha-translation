base_translation:
  language: en
  yaml_path: translation/ot/psalms/060/011.yaml
  text: Give us help against the adversary[c][b][a], for the salvation of man is vain.
translation:
  language: hi
  text: शत्रु के विरुद्ध हमारी सहायता कर,[a] क्योंकि मनुष्य का उद्धार व्यर्थ है।[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “संकट से हमारी सहायता कर”; इब्रानी शब्द צַר का अर्थ “संकट” या “शत्रु” दोनों हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: “उद्धार” का अनुवाद “छुटकारा” या “विजय” भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: यहाँ “मनुष्य” से सामान्य रूप से मानवजाति अभिप्रेत है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הָבָה
  choice: कर
  rationale: यह प्रार्थना में परमेश्वर से सहायता देने की विनती है। हिंदी में ‘हमारी सहायता कर’ मूल आज्ञार्थक निवेदन का स्वाभाविक और सीधा रूप है।
- source_word: לָּנוּ
  choice: हमारी
  rationale: प्रथम पुरुष बहुवचन का अर्थ ‘हमारे लिए/हमको’ है; ‘हमारी सहायता कर’ हिंदी में स्वाभाविक अभिव्यक्ति है।
- source_word: עֶזְרַת
  choice: सहायता
  rationale: यह रचनात्मक रूप में ‘मदद/सहायता’ को दर्शाता है। ‘सहायता’ प्रार्थनात्मक और काव्यात्मक प्रसंग में सहज तथा गरिमापूर्ण है।
- source_word: מִצָּר
  choice: संकट से निकलने में
  rationale: צַר का अर्थ ‘संकट’ अथवा ‘शत्रु’ हो सकता है। מִן के साथ ‘संकट से’ सीधा संभव अर्थ है; युद्ध-संदर्भ के अनुरूप ‘शत्रु के विरुद्ध’ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: וְשָׁוְא
  choice: क्योंकि ... व्यर्थ है
  rationale: שָׁוְא निरर्थकता, निष्फलता या व्यर्थता बताता है। संयोजक וְ यहाँ पूर्व विनती का आधार प्रस्तुत करता है, इसलिए हिंदी में ‘क्योंकि’ अर्थ-संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: תְּשׁוּעַת
  choice: उद्धार
  rationale: यह संज्ञा उद्धार, छुटकारा या विजय का अर्थ दे सकती है। ‘उद्धार’ मूल शब्द की व्यापकता बनाए रखता है, जबकि युद्ध-संदर्भ में ‘छुटकारा’ और ‘विजय’ भी संभव हैं।
- source_word: אָדָם
  choice: मनुष्य
  rationale: यहाँ אָדָם किसी एक पुरुष को नहीं, सामान्य रूप से मानवजाति को दर्शाता है। आधुनिक हिंदी में ‘मनुष्य’ यह सामूहिक अर्थ स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: परमेश्वर की सहायता और मानवीय उद्धार का विरोध
  choice: पद तत्कालीन संकट में मनुष्य से मिलने वाले उद्धार की निष्फलता के कारण परमेश्वर से सहायता माँगता है।
  alternative: इसे हर प्रकार के मानवीय प्रयास की सार्वभौमिक निरर्थकता का कथन समझना।
  rationale: इब्रानी पाठ परमेश्वर से की गई विनती को मानवीय उद्धार की व्यर्थता के साथ रखता है, पर इसे स्पष्ट रूप से समस्त मानवीय प्रयास पर एक व्यापक व्यवस्थित सिद्धांत नहीं बनाता।
translation_notes:
  register: आधुनिक मानक हिंदी का सरल, गरिमापूर्ण प्रार्थनात्मक-काव्यात्मक रूप। ‘तू’ को अलग से जोड़े बिना क्रिया ‘कर’ में मूल एकवचन संबोधन सुरक्षित है। वास्तविक शाब्दिक अस्पष्टता मुख्य पाठ और पादटिप्पणी में बनाए रखी गई है।
