base_translation:
  language: en
  yaml_path: translation/ot/psalms/060/006.yaml
  text: 'God has spoken in his holiness: “I will exult[a]; I will divide up Shechem[b], and measure out the Valley of Succoth.”'
translation:
  language: hi
  text: परमेश्वर ने अपनी पवित्रता में कहा है:[a] “मैं उल्लसित होऊँगा;[b] मैं शकेम को बाँटूँगा और सुक्कोत की घाटी को नापूँगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने पवित्र स्थान में,” अथवा “अपनी पवित्रता के द्वारा।” इब्रानी पद परमेश्वर की पवित्रता या उसकी पवित्र उपस्थिति के क्षेत्र का बोध करा सकता है।
    reason: lexical_alternative
  - marker: b
    text: कुछ लोग “मैं उल्लसित होऊँगा” को परमेश्वर की घोषणा का भाग नहीं, बल्कि उसकी वाणी के प्रति भजनकार की प्रतिक्रिया समझते हैं।
    reason: alternative_reading
