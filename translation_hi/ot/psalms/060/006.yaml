  rationale: स्थान-नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: וְעֵמֶק סֻכּוֹת
  choice: सुक्कोत की तराई
  rationale: रचनात्मक संबंध और भौगोलिक क्षेत्र दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אֲמַדֵּד
  choice: नापकर बाँट दूँगा
  rationale: पीएल रूप के मापने तथा भूभाग निर्धारित करने के संयुक्त संदर्भगत भाव को व्यक्त करता है; केवल ‘नापूँगा’ की अपेक्षा क्षेत्र-वितरण का आशय अधिक स्पष्ट है।
theological_decisions:
- issue: वक्ता-परिवर्तन और उद्धरण की सीमा
  choice: ‘मैं जयजयकार करूँगा’ को आगामी भूभाग-विभाजन वाली क्रियाओं के साथ परमेश्वर की प्रत्यक्ष वाणी माना गया है।
  alternative: इसे परमेश्वर की वाणी सुनकर भजनकार की प्रतिक्रिया माना जा सकता है।
  rationale: एकवचन प्रथम-पुरुष क्रियाओं का क्रम और शकेम को बाँटने तथा सुक्कोत की तराई को नापने की सार्वभौम भाषा ईश्वरीय वक्ता के पक्ष में है; फिर भी वाक्य-विन्यास वैकल्पिक वक्ता-परिवर्तन की संभावना छोड़ता है, इसलिए उसे पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। ‘जयजयकार’ विजयोत्सवी उल्लास को व्यक्त करता है; स्थान-नाम ‘शकेम’ और ‘सुक्कोत’ देवनागरी में लिप्यंतरित हैं।
