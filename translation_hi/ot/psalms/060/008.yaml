  text: מוֹאָ֤ב סִ֬יר רַחְצִ֗/י עַל אֱ֭דוֹם אַשְׁלִ֣יךְ נַעֲלִ֑/י עָ֝לַ֗/י פְּלֶ֣שֶׁת הִתְרֹעָֽעִֽי׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/060/008.yaml
  text: Moab is my washbasin[a]; on Edom I cast my sandal; over Philistia[b], shout in triumph for me.
translation:
  language: hi
  text: मोआब मेरे धोने का पात्र है[a]; एदोम पर मैं अपनी जूती फेंकता हूँ; हे पलिश्तिया, मेरे लिए विजय का जयघोष कर![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘धोने का पात्र’ का अनुवाद परंपरागत रूप से ‘धोने की हाँड़ी’ भी किया जाता है। यह चित्र अपमान और अधीनता को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी रूप कठिन है। मसोराई पाठ के अनुसार यह पलिश्तिया को दिया गया आदेश है; एक अन्य पारंपरिक अनुवाद है, ‘पलिश्तिया पर मैं विजय का जयघोष करता हूँ।’
    reason: alternative_reading
lexical_decisions:
- source_word: סִיר רַחְצִי
  choice: मेरे धोने का पात्र
  rationale: सִיר किसी बर्तन या पात्र को और רַחְצִי धोने के उपयोग को बताता है। ‘धोने का पात्र’ आधुनिक हिन्दी में स्वाभाविक है और अधीनता तथा अपमान के रूपक को बनाए रखता है।
- source_word: אַשְׁלִיךְ נַעֲלִי
  choice: मैं अपनी जूती फेंकूँगा
  rationale: हिफ़ील क्रिया אַשְׁלִיךְ का अर्थ ‘फेंकना’ है और נַעַל पैरों में पहनी जाने वाली वस्तु है। ‘जूती’ प्राचीन परिवेश के अनुकूल तथा सामान्य हिन्दी में बोधगम्य है।
- source_word: עַל אֱדוֹם
  choice: एदोम पर
  rationale: עַל का सीधा स्थानवाचक अर्थ रखते हुए जूती एदोम पर फेंकने और उस पर प्रभुत्व जताने की ठोस छवि सुरक्षित रखी गई है।
- source_word: עָלַי פְּלֶשֶׁת
  choice: हे पलिश्तिया, मेरे लिए
  rationale: प्रथम पुरुष एकवचन प्रत्यय वाला संबंधबोधक पद कठिन है। सम्बोधन के साथ ‘मेरे लिए’ उस प्रत्यय को व्यक्त करता और मसोराई पाठ के स्त्रीलिंग एकवचन आदेश से स्वाभाविक रूप से जुड़ता है।
- source_word: הִתְרֹעָעִי
  choice: विजय का जयघोष कर
  rationale: रוע से बना यह स्त्रीलिंग एकवचन आदेश ऊँची, प्रायः युद्ध या विजय से जुड़ी पुकार को व्यक्त करता है। यह अनुवाद पुकार और विजय, दोनों भावों को रखता है; प्रसंग में आदेश व्यंग्यात्मक अधीनता सूचित कर सकता है।
- source_word: מוֹאָב / אֱדוֹם / פְּלֶשֶׁת
  choice: मोआब / एदोम / पलिश्तिया
  rationale: इन स्थान और राष्ट्र-नामों को प्रचलित हिन्दी लिप्यंतरण में दिया गया है। ‘पलिश्तिया’ यहाँ भूमि/राष्ट्र का नाम है।
theological_decisions:
- issue: पलिश्तिया को संबोधित הִתְרֹעָעִי आदेश का बल
  choice: 'मसोराई पाठ के अनुसार पलिश्तिया को संबोधित व्यंग्यात्मक आदेश: ‘हे पलिश्तिया, मेरे लिए विजय का जयघोष कर!’'
  alternative: ‘पलिश्तिया पर मैं विजय का जयघोष करता हूँ।’
  rationale: मसोराई स्वरांकन क्रिया को स्त्रीलिंग एकवचन आदेश बनाता है, जो स्त्रीलिंग माने गए राष्ट्र पलिश्तिया को संबोधित हो सकता है। शत्रु राष्ट्रों पर विजय के प्रसंग में यह स्वतंत्र आनन्द का निमंत्रण नहीं, बल्कि अधीनता दर्शाने वाला व्यंग्यात्मक आदेश जान पड़ता है। प्रथम पुरुष कथन वाली पारंपरिक वैकल्पिक समझ को पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक रखी गई है। समानांतर पदों की संक्षिप्तता बनी रहती है। ‘विजय का जयघोष’ ऊँची विजयी पुकार को सामान्य पाठक के लिए स्पष्ट करता है, जबकि पादटिप्पणी कठिन इब्रानी रूप की वास्तविक अस्पष्टता सुरक्षित रखती है।
