  text: לְ֭מַעַן יֵחָלְצ֣וּ/ן יְדִידֶ֑י/ךָ הוֹשִׁ֖יעָ/ה יְמִֽינְ/ךָ֣ ו/ענ/נו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/060/005.yaml
  text: So that your beloved ones may be delivered[b][a], save with your right hand and answer me.
translation:
  language: hi
  text: जिससे तेरे प्रिय जन छुड़ाए जाएँ[a], तू अपने दाहिने हाथ से बचा और हमें उत्तर दे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बचा लिए जाएँ।”
    reason: lexical_alternative
  - marker: b
    text: कुछ पाठ-परंपराओं और व्याख्याओं में “मुझे उत्तर दे।”
    reason: textual_variant
lexical_decisions:
- source_word: לְמַעַן
  choice: जिससे
  rationale: यह उद्देश्य या अपेक्षित परिणाम व्यक्त करता है और हिंदी में प्रार्थना के प्रवाह के अनुकूल है।
- source_word: יֵחָלְצוּן
  choice: छुड़ाए जाएँ
  rationale: निफ़अल रूप किसी संकट से निकाले या बचाए जाने का भाव देता है; कर्मवाच्य रूप मूल की संरचना को बनाए रखता है।
- source_word: יְדִידֶיךָ
  choice: तेरे प्रिय जन
  rationale: बहुवचन और आत्मीयता—दोनों को स्पष्ट रखता है; 'प्रिय जन' स्वाभाविक और गरिमापूर्ण हिंदी है।
- source_word: הוֹשִׁיעָה
  choice: बचा
  rationale: यह ישׁע का सीधा आज्ञार्थक निवेदन है और संकट से उद्धार की प्रार्थना को सहज हिंदी में व्यक्त करता है।
- source_word: יְמִינְךָ
  choice: अपने दाहिने हाथ से
  rationale: साधन का भाव और परमेश्वर की सामर्थ्य का मूल मानवरूपी काव्य-चित्र दोनों सुरक्षित रहते हैं।
- source_word: ו/ענ/נו
  choice: और हमें उत्तर दे
  rationale: व्यंजन-पाठ ועננו को प्रथम पुरुष बहुवचन कर्म-प्रत्यय के रूप में पढ़ना संभव और सामुदायिक प्रार्थना के अनुकूल है; पाठ-परंपरा में एकवचन विकल्प भी है, जिसे पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: परमेश्वर के दाहिने हाथ का चित्र
  choice: ‘अपने दाहिने हाथ से’ को ज्यों का त्यों बनाए रखना
  alternative: ‘अपनी सामर्थ्य से’
  rationale: मूल का काव्यात्मक और धर्मवैचारिक चित्र परमेश्वर की उद्धारकारी सामर्थ्य दर्शाता है; उसे अमूर्त परिभाषा में बदलना उचित नहीं।
- issue: अंतिम क्रिया का कर्म-प्रत्यय
  choice: ‘हमें उत्तर दे’
  alternative: ‘मुझे उत्तर दे’
  rationale: लिखित रूप को बहुवचन समझा जा सकता है और वह भजन की सामुदायिक विनती से मेल खाता है; एकवचन पाठ को वास्तविक पाठगत विकल्प के रूप में पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी; प्रार्थनामय, संक्षिप्त और गरिमापूर्ण शैली। परमेश्वर के लिए एकवचन आत्मीय सर्वनाम रखा गया है, और मूल की समानांतर काव्यात्मक संरचना तथा वास्तविक पाठगत अस्पष्टता सुरक्षित रखी गई है।
