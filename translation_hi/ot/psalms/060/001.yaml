id: PSA.60.1
reference: Psalms 60:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אֱ֭לֹהִים זְנַחְתָּ֣/נוּ פְרַצְתָּ֑/נוּ אָ֝נַ֗פְתָּ תְּשׁ֣וֹבֵ֥ב לָֽ/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/060/001.yaml
  text: God[a], you have rejected us; you have broken us through; you have been angry[b]. Restore us.
translation:
  language: hi
  text: हे परमेश्वर, आपने हमें त्याग दिया है; आपने हममें सेंध लगा दी है[a]; आप हम पर क्रोधित हुए हैं। हमें पुनःस्थापित कीजिए[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “आपने हमें तोड़ डाला है।” इब्रानी में भंग करने या सेंध लगाने की छवि है।
    reason: मूल क्रिया की भंग/सेंध की छवि और स्वाभाविक वैकल्पिक अर्थ को सुरक्षित रखने के लिए।
  - marker: b
    text: या, “हमारी ओर लौट आइए।” इब्रानी में लोगों की पुनःस्थापना या परमेश्वर के उनकी ओर लौटने—दोनों का भाव हो सकता है।
    reason: मूल पाठ की वास्तविक अर्थगत अस्पष्टता को सुरक्षित रखने के लिए।
lexical_decisions:
- source_word: אֱלֹהִים
  choice: हे परमेश्वर
  rationale: यहाँ शब्द सीधे संबोधन में है। ‘हे परमेश्वर’ आधुनिक मानक हिन्दी में स्पष्ट, स्वाभाविक और गरिमापूर्ण संबोधन है।
- source_word: זְנַחְתָּנוּ
  choice: आपने हमें त्याग दिया है
  rationale: זנח का अर्थ अस्वीकार या त्याग देना है। ‘त्याग दिया है’ स्पष्ट हिन्दी में संबंध-विच्छेद की गंभीरता बनाए रखता है।
- source_word: פְרַצְתָּנוּ
  choice: आपने हमें तोड़ डाला है
  rationale: פרץ में तोड़कर भीतर घुसने या सेंध लगाने की सशक्त छवि है। व्यक्तियों के साथ ‘सेंध लगाना’ हिन्दी में अस्वाभाविक है, इसलिए ‘तोड़ डाला’ विनाशकारी प्रभाव को स्वाभाविक ढंग से व्यक्त करता है; मूल की दरार/सेंध की छवि पादटिप्पणी में सुरक्षित है।
- source_word: אָ֝נַפְתָּ
  choice: आप हम पर क्रोधित हुए हैं
  rationale: यह क्रोध प्रकट करने को बताता है। हिन्दी में ‘हम पर’ जोड़ने से संबंध स्पष्ट होता है और स्रोत का भाव नहीं बदलता।
- source_word: תְּשׁוֹבֵב לָנוּ
  choice: हमें फिर से बहाल कीजिए
  rationale: यह कठिन पद लोगों की पुनर्स्थापना अथवा परमेश्वर के उनकी ओर लौटने—दोनों का संकेत दे सकता है। मुख्य पाठ में पुनर्स्थापना का अर्थ चुना गया है और दूसरा अर्थ पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: תְּשׁוֹבֵב לָנוּ की समापन-विनती का आशय
  choice: न्याय के बाद लोगों को फिर से बहाल करने की विनती
  alternative: हमारी ओर फिर लौट आइए
  rationale: इब्रानी वाक्यांश पुनर्स्थापना और संबंधात्मक वापसी के बीच वास्तविक अर्थ-संभावना रखता है। मुख्य पाठ विलाप की गति के अनुरूप बहाली को व्यक्त करता है, जबकि वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
- issue: פְרַצְתָּנוּ की भंग/सेंध की छवि
  choice: आपने हमें तोड़ डाला है
  alternative: आपने हममें सेंध लगा दी है
  rationale: मुख्य पाठ सहज हिन्दी और विनाशकारी बल को प्राथमिकता देता है; पादटिप्पणी मूल रूपक को दिखाती है, बिना उसे लोगों के आंतरिक विभाजन की विशेष व्याख्या बना देने के।
translation_notes:
  register: आधुनिक मानक हिन्दी में आदरसूचक ‘आप’ और विनयार्थक क्रियाएँ रखी गई हैं। भाषा प्रार्थनात्मक, गरिमापूर्ण और सामान्य पाठक के लिए सहज है; अस्वाभाविक शाब्दिकता को पादटिप्पणियों में समझाया गया है।
