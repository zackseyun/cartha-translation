  text: कौन मुझे किलेबंद नगर तक पहुँचाएगा? कौन मुझे एदोम तक ले जाएगा?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “कौन मुझे किलेबंद नगर तक ले जाएगा? कौन मुझे एदोम तक ले गया है?” इब्रानी क्रियाओं में काल और पक्ष की थोड़ी भिन्न बारीकियाँ सम्भव हैं; मुख्य पाठ दोनों पंक्तियों को भविष्य की ओर देखते समानान्तर प्रश्नों के रूप में रखता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי
  choice: कौन
  rationale: यह प्रश्नवाचक सर्वनाम दोनों अलंकारिक प्रश्नों का आरम्भ करता है; ‘कौन’ इसका स्वाभाविक हिन्दी रूप है।
- source_word: יֹבִלֵנִי
  choice: मुझे ... पहुँचाएगा
  rationale: यबल का हिफ़ील रूप किसी को ले जाने या गन्तव्य तक पहुँचाने का भाव देता है। स्थानवाचक पद के साथ ‘पहुँचाएगा’ सहज और गन्तव्य-केंद्रित है।
- source_word: עִיר מָצוֹר
  choice: गढ़वाले नगर
  rationale: यह पद किलेबन्द या सुदृढ़ नगर को सूचित करता है। ‘गढ़वाला नगर’ साधारण आधुनिक हिन्दी में स्पष्ट है और ‘घेरे हुए नगर’ जैसी अनावश्यक अर्थ-दिशा से बचता है।
- source_word: נָחַנִי
  choice: मुझे ... ले जाएगा
  rationale: נחה का अर्थ अगुवाई करना या मार्ग दिखाते हुए ले जाना है। रूप भूतकालिक ढंग से भी समझा जा सकता है, पर काव्यात्मक समानान्तरता में भविष्याभिमुख प्रश्न स्वाभाविक है।
- source_word: עַד אֱדוֹם
  choice: एदोम तक
  rationale: עַד सीमा या अन्तिम गन्तव्य का बोध कराता है; ‘तक’ इस अर्थ को संक्षेप और स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֱדוֹם
  choice: एदोम
  rationale: स्थाननाम का प्रचलित हिन्दी लिप्यन्तरण।
