  text: Israel[a], trust in Yahweh; he is their help and their shield.
translation:
  language: hi
  text: हे इस्राएल, याहवे[a] पर भरोसा रख! वही उनकी सहायता और उनकी ढाल है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में दिव्य नाम YHWH है।
    reason: divine_name
lexical_decisions:
- source_word: יִשְׂרָאֵל
  choice: हे इस्राएल
  rationale: यह वाचा के समुदाय का व्यक्तिवाचक नाम और प्रत्यक्ष संबोधन है; हिन्दी में संबोधन को स्पष्ट और स्वाभाविक बनाने के लिए ‘हे’ जोड़ा गया है।
- source_word: בְּטַח
  choice: भरोसा रख
  rationale: यह पुल्लिंग एकवचन आज्ञार्थक है और इस्राएल को एक सामूहिक इकाई के रूप में संबोधित करता है। ‘भरोसा रख’ आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: בַּיהוָה
  choice: यहोवा पर
  rationale: उपसर्ग ב यहाँ भरोसे के लक्ष्य को बताता है। हिन्दी में ‘पर भरोसा रखना’ स्वाभाविक प्रयोग है; पवित्र नाम יהוה को ‘यहोवा’ से व्यक्त किया गया है।
- source_word: עֶזְרָם
  choice: उनका सहायक
  rationale: मूल शब्द का शाब्दिक अर्थ ‘उनकी सहायता’ हो सकता है, पर व्यक्ति के लिए विधेय के रूप में हिन्दी में ‘उनका सहायक’ अधिक स्वाभाविक है और आशय को बिना विस्तार के व्यक्त करता है।
- source_word: וּמָגִנָּם
  choice: और उनकी ढाल
  rationale: מָגֵן की ठोस ‘ढाल’ वाली उपमा को बनाए रखा गया है, उसे सामान्य ‘रक्षक’ में नहीं बदला गया।
- source_word: הוּא
  choice: वही ... है
  rationale: स्वतंत्र सर्वनाम के बल को हिन्दी के ‘वही’ द्वारा व्यक्त किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: मूल पाठ में चार-अक्षरीय ईश्वरीय नाम सीधे आया है। हिन्दी पाठकों के लिए प्रचलित नामरूप ‘यहोवा’ नाम की विशिष्टता बनाए रखता है और उसे केवल उपाधि ‘प्रभु’ से प्रतिस्थापित नहीं करता।
- issue: एकवचन संबोधन और बहुवचन सर्वनाम का तनाव
  choice: ‘इस्राएल’ से एकवचन आज्ञा, फिर ‘उनका/उनकी’
  alternative: पूरे वाक्य में एकवचन ‘तेरा/तेरी’
  rationale: इब्रानी पाठ में आज्ञा एकवचन है, जबकि बाद के संबंधसूचक प्रत्यय बहुवचन हैं। पाठ में उपस्थित इस व्याकरणिक बदलाव को समतल किए बिना सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा संक्षिप्त, गरिमापूर्ण और सार्वजनिक पाठ के योग्य है। मूल के सामूहिक एकवचन संबोधन तथा बहुवचन संबंधसूचक रूपों को जानबूझकर बनाए रखा गया है।
