  text: בֵּ֣ית אַ֭הֲרֹן בִּטְח֣וּ בַ/יהוָ֑ה עֶזְרָ֖/ם וּ/מָגִנָּ֣/ם הֽוּא׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/115/010.yaml
  text: O house of Aaron[a], trust in Yahweh[b]; he is their help and their shield.
translation:
  language: hi
  text: हे हारून के घराने, याहवे पर भरोसा रखो; वह उनकी[a] सहायता और उनकी ढाल है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में पहले हारून के घराने को सीधे ‘भरोसा रखो’ कहा गया है, फिर तीसरे पुरुष में ‘उनकी सहायता और उनकी ढाल’ कहा गया है।
    reason: मूल पाठ में दूसरे पुरुष से तीसरे पुरुष में हुए स्पष्ट परिवर्तन को समझाना।
lexical_decisions:
- source_word: בֵּית אַהֲרֹן
  choice: हारून के घराने
  rationale: यह रचनात्मक संबंध वाला पदबंध शाब्दिक रूप से ‘हारून का घर’ है और यहाँ याजकीय घराने को संबोधित करता है। ‘घराने’ से इब्रानी मुहावरे का अर्थ और आसपास की समानांतर रचना दोनों स्वाभाविक हिन्दी में बने रहते हैं।
- source_word: בִּטְחוּ
  choice: भरोसा रखो
  rationale: यह בטח का बहुवचन आज्ञार्थक रूप है। ‘भरोसा रखो’ आधुनिक हिन्दी में सीधा और स्वाभाविक आग्रह है।
- source_word: בַיהוָה
  choice: याहवे पर
  rationale: ב यहाँ भरोसे के लक्ष्य को दर्शाता है, जिसे हिन्दी में ‘पर’ स्वाभाविक रूप से व्यक्त करता है। परमेश्वर के व्यक्तिगत नाम יהוה को ‘याहवे’ लिखा गया है।
- source_word: עֶזְרָם
  choice: उनका सहायक
  rationale: עֵזֶר पर लगे तृतीय पुरुष बहुवचन प्रत्यय का अर्थ ‘उनका’ है। ‘सहायक’ हिन्दी में उस व्यक्ति को स्वाभाविक रूप से व्यक्त करता है जो उनकी सहायता करता है।
- source_word: וּמָגִנָּם
  choice: और उनकी ढाल
  rationale: מָגֵן का ठोस अर्थ ‘ढाल’ है। सुरक्षा के इस काव्यात्मक रूपक को अमूर्त ‘रक्षक’ से बदलने के बजाय सुरक्षित रखा गया है।
- source_word: הוּא
  choice: वह … है
  rationale: स्वतंत्र सर्वनाम निर्क्रिय वाक्य में कर्ता को उभारता है; हिन्दी में वर्तमानकालीन ‘है’ जोड़ना आवश्यक है। मूल में ‘केवल’ का कोई शब्द नहीं है, इसलिए ‘वही’ या ‘वह अकेला’ नहीं जोड़ा गया।
theological_decisions:
- issue: יהוה परमेश्वर के नाम का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत वाचा-नाम सीधे आया है। ‘याहवे’ उसे उपाधि ‘प्रभु’ से बदलने के बजाय नाम के रूप में प्रस्तुत करता है और किसी संप्रदायगत विस्तार को नहीं जोड़ता।
- issue: दूसरे पुरुष से तीसरे पुरुष में सर्वनाम-परिवर्तन
  choice: ‘भरोसा रखो’ के बाद ‘उनका … उनकी’
  alternative: ‘तुम्हारा … तुम्हारी’
  rationale: इब्रानी में आज्ञा सीधे हारून के घराने को दी गई है, पर अगले खंड में प्रत्यय तीसरे पुरुष बहुवचन के हैं। इस व्याकरणिक और काव्यात्मक परिवर्तन को सहज बनाने के लिए समरूप नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामूहिक उपासना में सहज है। ‘हे’ संबोधन की काव्यात्मकता रखता है; ‘घराने’, ‘भरोसा रखो’ और ‘ढाल’ सामान्य पाठक के लिए सुबोध हैं।
