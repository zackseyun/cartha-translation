  text: לֹ֣א הַ֭/מֵּתִים יְהַֽלְלוּ יָ֑הּ וְ֝/לֹ֗א כָּל יֹרְדֵ֥י דוּמָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/115/017.yaml
  text: The dead do not praise Yah[b][a], nor do any who go down into silence.
translation:
  language: hi
  text: मरे हुए याह की स्तुति नहीं करते, और न ही मौन[b] में उतरनेवाला कोई भी याह की स्तुति करता है[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और न ही वे सब जो मौन में उतरते हैं, याह की स्तुति करते हैं।” इब्रानी में ‘सब’ है, पर इस नकारात्मक वाक्य में ‘कोई भी’ उसका वितरणात्मक भाव अधिक स्वाभाविक ढंग से व्यक्त करता है।
    reason: lexical_alternative
  - marker: b
    text: “मौन” मृत्यु की अवस्था या लोक के लिए एक काव्यात्मक अभिव्यक्ति है; कुछ इसे अधिक विशेष रूप से “कब्र” या “अधोलोक” समझते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: הַמֵּתִים
  choice: मरे हुए
  rationale: यह रूप सामान्य रूप से मृत लोगों को दर्शाता है। ‘मरे हुए’ आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: יְהַלְלוּ
  choice: स्तुति नहीं करते
  rationale: पिएल रूप में הלל का सामान्य अर्थ ‘स्तुति करना’ है; निषेध לֹא के साथ इसे ‘स्तुति नहीं करते’ कहा गया है।
- source_word: יָהּ
  choice: याह
  rationale: यह परमेश्वर के नाम का संक्षिप्त काव्यात्मक रूप है; इसे पूरे नाम के किसी पारंपरिक प्रतिस्थापन में मिलाए बिना लिप्यंतरित किया गया है।
- source_word: כָּל
  choice: कोई भी
  rationale: नकारात्मक वाक्य में כָּל का वितरणात्मक भाव हिन्दी में ‘कोई भी’ से स्वाभाविक रूप से व्यक्त होता है; शाब्दिक विकल्प ‘सब’ है।
- source_word: יֹרְדֵי
  choice: उतरनेवाला
  rationale: यह participial रूप उन लोगों को दर्शाता है जो नीचे उतरते हैं; एकवचन ‘कोई भी’ के साथ ‘उतरनेवाला’ स्वाभाविक है।
- source_word: דוּמָה
  choice: मौन
  rationale: यहाँ शब्द मृत्यु की अवस्था या लोक के लिए काव्यात्मक संकेत है। ‘मौन’ मूल बिंब को बनाए रखता है और मुख्य पाठ में ‘कब्र’ या ‘अधोलोक’ जैसी व्याख्या नहीं जोड़ता।
theological_decisions:
- issue: क्या पद को मृत्यु के बाद किसी भी स्तुति के सैद्धांतिक निषेध के रूप में समझाया जाए, या मृत्यु के मौन के विषय में काव्यात्मक कथन के रूप में रहने दिया जाए
  choice: मृतकों और मौन में उतरनेवालों के विषय में मूल काव्यात्मक कथन को बिना विस्तार के रखा गया है।
  alternative: मुख्य पाठ में ‘कब्र में पड़े मरे हुए’ या ‘अधोलोक में उतरनेवाले’ कहकर अर्थ को अधिक निश्चित करना।
  rationale: भजन जीवित उपासकों और मृतकों के बीच पारंपरिक इब्रानी काव्यात्मक विरोध प्रस्तुत करता है। ‘मौन’ को बनाए रखने से मृत्यु के बाद की अवस्था पर व्यापक धर्मवैज्ञानिक विवाद का निर्णय अनुवाद में नहीं थोपा जाता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। समानांतर काव्य-रचना और ‘मौन में उतरना’ वाला मूल बिंब सुरक्षित है। दिव्य नाम के संक्षिप्त रूप יָהּ को ‘याह’ लिखा गया है।
