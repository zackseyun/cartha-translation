    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְאֵי
  choice: हे यहोवा का भय माननेवालो
  rationale: यह ירא का बहुवचन रचनात्मक कृदंत है, जो संज्ञा के रूप में ‘भय माननेवाले’ बताता है। इसके बाद आए बहुवचन आज्ञार्थक के अनुरूप इसे सीधे संबोधन के रूप में रखा गया है।
- source_word: יְהוָה / בַיהוָה
  choice: यहोवा / यहोवा पर
  rationale: चार अक्षरों वाले परमेश्वर के निजी नाम को प्रचलित हिन्दी रूप ‘यहोवा’ में रखा गया है। בטח के साथ ב का स्वाभाविक हिन्दी रूप ‘पर भरोसा रखना’ है; नाम की पुनरावृत्ति मूल के बलाघात को बनाए रखती है।
- source_word: בִּטְחוּ
  choice: भरोसा रखो
  rationale: בטח के काल आज्ञार्थक बहुवचन का सीधा, सहज और गरिमापूर्ण हिन्दी रूप।
- source_word: עֶזְרָם
  choice: उनका सहायक
  rationale: עזר का अर्थ ‘सहायता’ या ‘सहायक’ हो सकता है। व्यक्ति-सूचक הוא और समानांतर ‘ढाल’ के साथ ‘सहायक’ हिन्दी में स्वाभाविक है।
- source_word: וּמָגִנָּם
  choice: और उनकी ढाल
  rationale: מגן की ठोस उपमा ‘ढाल’ को सामान्यीकृत करके ‘रक्षक’ नहीं किया गया।
- source_word: הוּא
  choice: वही ... है
  rationale: स्वतंत्र सर्वनाम के बल को ‘वही’ से व्यक्त किया गया है। तीसरे पुरुष बहुवचन प्रत्ययों के कारण ‘उनका/उनकी’ बनाए रखा गया है।
theological_decisions:
- issue: יִרְאֵי को संबोधन या तीसरे पुरुष के पदनाम के रूप में समझना
  choice: 'सीधा संबोधन: ‘हे यहोवा का भय माननेवालो’'
  alternative: ‘यहोवा का भय माननेवाले यहोवा पर भरोसा रखें’
  rationale: कृदंत दोनों तरह समझा जा सकता है। साथ का बहुवचन आज्ञार्थक सीधे संबोधन को स्वाभाविक बनाता है, पर वास्तविक व्याकरणिक विकल्प को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: दूसरे पुरुष की आज्ञा के बाद तीसरे पुरुष के संबंधसूचक प्रत्यय
  choice: ‘भरोसा रखो; वही उनका सहायक और उनकी ढाल है’
  alternative: ‘भरोसा रखो; वही तुम्हारा सहायक और तुम्हारी ढाल है’
  rationale: मूल पाठ जानबूझकर בִּטְחוּ (‘तुम लोग भरोसा रखो’) से עֶזְרָם/מָגִנָּם (‘उनका’) की ओर जाता है। इस व्यक्ति-परिवर्तन को सुचारु बनाने के लिए हटाया नहीं गया।
- issue: ईश्वरीय नाम יְהוָה का रूप
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में उपाधि नहीं, ईश्वरीय निजी नाम है। आधुनिक हिन्दी बाइबलीय प्रयोग में व्यापक रूप से पहचाने जानेवाले ‘यहोवा’ को चुना गया, बिना उसे ‘प्रभु’ से बदलने के।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण भजन-शैली। ‘भय मानना’ श्रद्धामिश्रित भय की पारंपरिक और बोधगम्य अभिव्यक्ति है। मूल के दूसरे से तीसरे पुरुष में परिवर्तन को सुरक्षित रखा गया है।
