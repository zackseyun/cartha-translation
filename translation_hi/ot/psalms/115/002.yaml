  yaml_path: translation/ot/psalms/115/002.yaml
  text: Why should the nations say[a], “Where now is their God?”
translation:
  language: hi
  text: राष्ट्र क्यों कहें[a], “अब उनका परमेश्वर कहाँ है?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “राष्ट्र क्यों कहते हैं, ‘उनका परमेश्वर अब कहाँ है?’”
    reason: अपूर्ण क्रिया को वर्तमानकालीन, बार-बार किए जाने वाले उपहास के रूप में भी समझा जा सकता है।
lexical_decisions:
- source_word: לָמָּה
  choice: क्यों
  rationale: यह आलंकारिक प्रश्न प्रस्तुत करता है। अपूर्ण क्रिया के साथ ‘क्यों कहें’ राष्ट्रों के उपहास पर आपत्ति का भाव स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: יֹאמְרוּ
  choice: कहें
  rationale: काल अपूर्ण, पुरुष तीसरा, बहुवचन है। यहाँ संभावित अथवा बार-बार किए जाने वाले उपहास का भाव है; संभावनार्थक ‘कहें’ इसे भविष्यवाणी बनाए बिना व्यक्त करता है।
- source_word: הַגּוֹיִם
  choice: राष्ट्र
  rationale: यह इस्राएल से भिन्न विदेशी जातियों या राष्ट्रों को सूचित करता है। ‘राष्ट्र’ सीधा और वर्तमान मानक हिंदी रूप है।
- source_word: אַיֵּה
  choice: कहाँ है
  rationale: स्थानवाचक प्रश्नवाचक शब्द है; हिंदी वाक्य में ‘है’ जोड़ना आवश्यक और स्वाभाविक है।
- source_word: נָא
  choice: अब
  rationale: यहाँ यह विनयार्थक ‘कृपया’ नहीं, बल्कि उपहास में तात्कालिकता या बल देने वाला अव्यय है। ‘अब’ उस चुनौतीपूर्ण भाव को बनाए रखता है।
- source_word: אֱלֹהֵיהֶם
  choice: उनका परमेश्वर
  rationale: प्रत्यय सहित यह पद संदर्भ में इस्राएल के परमेश्वर के लिए एकवचन अर्थ रखता है। ‘परमेश्वर’ सच्चे परमेश्वर की ओर संदर्भ को स्पष्ट करता है।
theological_decisions:
- issue: אֱלֹהֵיהֶם का संदर्भ
  choice: उनका परमेश्वर
  alternative: उनका ईश्वर / उनका देवता
  rationale: राष्ट्र इस्राएल के परमेश्वर की उपस्थिति या कार्य पर ताना मार रहे हैं, किसी अनिर्दिष्ट देवता की चर्चा नहीं कर रहे। ‘परमेश्वर’ संदर्भगत एकवचन को बिना अतिरिक्त धर्मवैज्ञानिक व्याख्या जोड़े व्यक्त करता है।
translation_notes:
  register: आधुनिक मानक हिंदी में संक्षिप्त, गरिमापूर्ण और सहज रूप। मुख्य पाठ में ‘क्यों कहें’ आलंकारिक आपत्ति को रखता है; पादटिप्पणी वर्तमानकालीन वैकल्पिक अर्थ सुरक्षित रखती है।
