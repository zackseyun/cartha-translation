  text: They have mouths, but they do not speak; eyes, but they do not see.
translation:
  language: hi
  text: उनके मुँह हैं, पर वे बोलते नहीं; उनकी आँखें हैं, पर वे देखते नहीं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פֶּה
  choice: मुँह
  rationale: इब्रानी में संज्ञा एकवचन है, पर बहुवचन सर्वनाम के साथ मूर्तियों में से प्रत्येक के लिए वितरणात्मक रूप से प्रयुक्त हुई है। हिन्दी में ‘उनके मुँह’ यही भाव स्वाभाविक ढंग से व्यक्त करता है।
- source_word: לָהֶם
  choice: उनके … हैं / उनकी … हैं
  rationale: לְ उपसर्ग और सर्वनामिक प्रत्यय यहाँ अधिकार-संबंध व्यक्त करते हैं। हिन्दी में संबंधकारक और ‘हैं’ से इसे सहज रूप दिया गया है।
- source_word: וְלֹא יְדַבֵּרוּ
  choice: पर वे बोल नहीं सकते
  rationale: वाव और निषेध अंग के होने तथा उसके कार्य न करने के बीच तीखा विरोध दिखाते हैं। सामर्थ्यसूचक ‘नहीं सकते’ मूर्तियों की वास्तविक अक्षमता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: עֵינַיִם
  choice: आँखें
  rationale: द्विवचन/बहुवचन रूप का सामान्य हिन्दी समतुल्य ‘आँखें’ है।
- source_word: וְלֹא יִרְאוּ
  choice: पर वे देख नहीं सकतीं
  rationale: ראה का मूल अर्थ यहाँ ‘देखना’ है। स्त्रीलिंग क्रिया ‘सकतीं’ का व्याकरणिक मेल निकटवर्ती कर्ता ‘आँखें’ से है और पंक्ति की समानांतर रचना बनाए रखता है।
theological_decisions:
- issue: बहुवचन सर्वनामों का संदर्भ
  choice: सर्वनामों को पूर्ववर्ती संदर्भ की मूर्तियों के लिए मानते हुए ‘उनके/उनकी’ और ‘वे’ से व्यक्त किया गया है।
  alternative: 'अधिक शब्दशः किंतु अस्वाभाविक रचना: ‘मुँह उनको है… आँखें उनको हैं…’।'
  rationale: भजन का संदर्भ मूर्तियों के बने हुए अंगों और उनकी निष्क्रियता का उपहास करता है। यह रूप उस व्यंग्य को स्पष्ट रखता है, बिना अतिरिक्त सांप्रदायिक व्याख्या जोड़े।
- issue: निषेध को साधारण क्रिया या अक्षमता के रूप में व्यक्त करना
  choice: ‘बोल नहीं सकते’ और ‘देख नहीं सकतीं’
  alternative: ‘नहीं बोलते’ और ‘नहीं देखते’
  rationale: इब्रानी रूप सीधे क्रिया का निषेध करता है, पर संदर्भ में आशय केवल वर्तमान निष्क्रियता नहीं, निर्जीव मूर्तियों की अक्षमता है। हिन्दी का सामर्थ्यसूचक रूप इस संदर्भगत बल को स्वाभाविक ढंग से सामने लाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, काव्यात्मक और गरिमापूर्ण शैली। ‘तो…पर’ की समानांतर संरचना अंगों की उपस्थिति और कार्यगत अक्षमता के विरोध को उभारती है।
