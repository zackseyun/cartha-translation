  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וֵֽ/אלֹהֵ֥י/נוּ בַ/שָּׁמָ֑יִם כֹּ֭ל אֲשֶׁר חָפֵ֣ץ עָשָֽׂה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/115/003.yaml
  text: But our God is in the heavens[b][a]; he does all that he pleases.
translation:
  language: hi
  text: परन्तु हमारा परमेश्वर स्वर्गों में है; वह जो कुछ चाहता है, करता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וֵאלֹהֵינוּ
  choice: परन्तु हमारा परमेश्वर
  rationale: सन्दर्भ में ו मूर्तियों के विपरीत जीवित परमेश्वर को सामने रखता है, इसलिए विरोधसूचक ‘परन्तु’ उपयुक्त है। אֱלֹהֵינוּ का स्वाभाविक अनुवाद ‘हमारा परमेश्वर’ है।
- source_word: בַשָּׁמַיִם
  choice: स्वर्गों में है
  rationale: שָׁמַיִם का रूप बहुवचन है। ‘स्वर्गों में’ मूल रूप और भजन की गरिमापूर्ण शैली को सुरक्षित रखता है तथा आधुनिक हिन्दी में बोधगम्य है।
- source_word: כֹּל אֲשֶׁר
  choice: जो कुछ
  rationale: यह पदबंध समग्रता व्यक्त करता है। हिन्दी में ‘जो कुछ’ स्वाभाविक ढंग से ‘whatever/all that’ का भाव देता है।
- source_word: חָפֵץ
  choice: चाहता है
  rationale: חפץ में इच्छा, अभिलाषा और प्रसन्नता का अर्थक्षेत्र है। ‘चाहता है’ सामान्य आधुनिक हिन्दी में स्पष्ट है और इसे किसी संकीर्ण पारिभाषिक धर्मवैज्ञानिक अर्थ में नहीं बाँधता।
- source_word: עָשָׂה
  choice: करता है
  rationale: यहाँ पूर्ण क्रिया सामान्य और स्थायी सत्य व्यक्त करती है; इसलिए हिन्दी का वर्तमानकालीन ‘करता है’ उपयुक्त है।
theological_decisions:
- issue: परमेश्वर की प्रभुसत्ता की अभिव्यक्ति
  choice: वह जो कुछ चाहता है, करता है
  alternative: उसने जो कुछ चाहा, किया / वह अपनी इच्छा के अनुसार सब कुछ करता है
  rationale: यह कथन निष्क्रिय मूर्तियों के विपरीत परमेश्वर की स्वतंत्रता और प्रभावी सामर्थ्य बताता है। वर्तमानकाल सामान्य सत्य को व्यक्त करता है; ‘चाहता है’ חָפֵץ की व्यापकता बनाए रखता है और किसी विशिष्ट धर्मवैज्ञानिक प्रणाली को पाठ में नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी की सहज, संक्षिप्त और गरिमापूर्ण शैली। मूल के बहुवचन ‘स्वर्गों’ को बनाए रखा गया है; किसी पादटिप्पणी की आवश्यकता नहीं समझी गई।
