  yaml_path: translation/ot/psalms/115/007.yaml
  text: They have hands[a], but cannot feel; feet, but cannot walk[b]; they do not make a sound in their throat.
translation:
  language: hi
  text: 'उनके हाथ हैं[a], पर वे छू नहीं सकते;

    पैर हैं, पर चल नहीं सकते;

    अपने गले से वे कोई आवाज़ नहीं निकालते[b]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उनके हाथ हैं, पर वे छूते नहीं … पैर हैं, पर चलते नहीं।”
    reason: lexical_alternative
  - marker: b
    text: या, “वे अपने गले में बुदबुदाते नहीं”; इब्रानी क्रिया धीमे उच्चारण या बुदबुदाहट का बोध दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְדֵיהֶם
  choice: उनके हाथ हैं
  rationale: इब्रानी में शाब्दिक रूप से ‘उनके हाथ’ है; हिन्दी में अस्तित्वसूचक ‘हैं’ जोड़ने से क्रियारहित उपवाक्य और काव्यात्मक समानांतरता स्वाभाविक रूप से व्यक्त होती है।
- source_word: יְמִישׁוּן
  choice: टटोल नहीं सकते
  rationale: क्रिया हाथों से छूने, टटोलने या स्पर्श करके अनुभव करने का बोध देती है। ‘टटोल नहीं सकते’ मूर्तियों की कार्य-असमर्थता को स्पष्ट रखते हुए हिन्दी में स्वाभाविक है।
- source_word: רַגְלֵיהֶם
  choice: पैर हैं
  rationale: अर्थ ‘उनके पैर’ है। पिछले उपवाक्य के समानांतर संक्षिप्त रचना हिन्दी काव्य में स्वाभाविक है।
- source_word: יְהַלֵּכוּ
  choice: चल नहीं सकते
  rationale: रूपतः ‘वे नहीं चलते’ है, पर प्रसंग मूर्तियों की निष्क्रियता मात्र नहीं, उनकी असमर्थता दिखाता है; इसलिए ‘नहीं सकते’ आशय को स्पष्ट करता है।
- source_word: יֶהְגּוּ
  choice: कोई आवाज़ नहीं निकालते
  rationale: הגה धीमी ध्वनि, बुदबुदाहट या उच्चारण का बोध दे सकती है। व्यापक ‘कोई आवाज़ नहीं निकालते’ मूर्तियों की वाणीहीनता व्यक्त करता है, जबकि अधिक विशिष्ट अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: בִּגְרוֹנָם
  choice: अपने गले से
  rationale: शाब्दिक अर्थ ‘अपने गले में/से’ है। हिन्दी में ध्वनि के स्रोत के लिए ‘अपने गले से’ स्वाभाविक है और मूल बिंब बनाए रखता है।
theological_decisions:
- issue: मूर्तियों की असमर्थता का स्वरूप
  choice: हाथों और पैरों से जुड़ी नकारात्मक क्रियाओं को ‘नहीं सकते’ के रूप में प्रस्तुत किया गया।
  alternative: अधिक रूपनिष्ठ ‘टटोलते नहीं/चलते नहीं’।
  rationale: भजन का व्यंग्य मूर्तियों के केवल ऐसा न करने पर नहीं, बल्कि उनकी शक्तिहीनता पर है। ‘नहीं सकते’ प्रसंगगत बल को व्यक्त करता है, बिना कोई अतिरिक्त धर्मसैद्धांतिक दावा जोड़े।
- issue: יֶהְגּוּ की अर्थ-सीमा
  choice: मुख्य पाठ में व्यापक ‘कोई आवाज़ नहीं निकालते’।
  alternative: विशिष्ट ‘बुदबुदाते नहीं’।
  rationale: इब्रानी क्रिया धीमे उच्चारण या बुदबुदाहट को सूचित कर सकती है। व्यापक अर्थ मुख्य पाठ में सहज है और विशिष्ट संभावना पादटिप्पणी में रखकर मूल की अर्थगत गुंजाइश बचाई गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और काव्यात्मक रूप अपनाया गया है। तीन समानांतर पंक्तियाँ मूल की संक्षिप्त व्यंग्यात्मक लय बनाए रखती हैं; ‘टटोल’ सामान्य पाठक के लिए बोधगम्य है और हाथों से स्पर्श करके अनुभव करने की क्रिया को व्यक्त करता है।
