  yaml_path: translation/ot/psalms/115/012.yaml
  text: Yahweh has remembered us[a]; he will bless; he will bless the house of Israel; he will bless the house of Aaron.
translation:
  language: hi
  text: याहवे ने हमें स्मरण किया है[a]; वह आशीष देगा; वह इस्राएल के घराने को आशीष देगा; वह हारून के घराने को आशीष देगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “याहवे हमारा स्मरण रखता आया है।”
