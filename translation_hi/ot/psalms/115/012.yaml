    rationale: Hindi normally says that someone has ‘स्मरण किया है’ or ‘याद रखा है.’ The current wording combines these constructions unnaturally.
  - severity: low
    issue: The footnote “हमारा ध्यान रखा है” can mean ‘has taken care of us.’
    rationale: This may shift the lexical alternative from divine mindfulness/remembering toward protection or care. A wording centered on continued remembrance better retains the intended alternative.
