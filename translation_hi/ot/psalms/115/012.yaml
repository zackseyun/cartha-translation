lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के वाचागत निज नाम को सामान्य हिन्दी लिप्यंतरण में सुरक्षित रखा गया है।
- source_word: זְכָרָנוּ
  choice: ने हमें स्मरण रखा है
  rationale: काल पूर्ण हुई क्रिया को व्यक्त करता है, जिसका वर्तमान आश्वासन से संबंध है। यह मूल के ‘याद करने/ध्यान रखने’ के अर्थ को बनाए रखता है।
- source_word: יְבָרֵךְ
  choice: वह आशीष देगा
  rationale: संदर्भ में अपूर्ण क्रिया को भविष्यसूचक विश्वास के रूप में लिया गया है। मूल की तीन बार की पुनरावृत्ति भी सुरक्षित रखी गई है।
- source_word: בֵּית יִשְׂרָאֵל
  choice: इस्राएल के घराने
  rationale: ‘घराना’ सामूहिक पारिवारिक और वाचागत अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בֵּית אַהֲרֹן
  choice: हारून के घराने
  rationale: याजकीय वंश-समुदाय का संकेत स्पष्ट रखते हुए पिछले पदबंध की समानांतर संरचना सुरक्षित रखी गई है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल में चार-अक्षरीय निज नाम सीधे उपस्थित है; इसलिए उपाधि से बदलने के बजाय उसका लिप्यंतरण किया गया है।
- issue: יְבָרֵךְ का भाव
  choice: 'भविष्यसूचक कथन: ‘वह आशीष देगा’'
  alternative: 'कामनासूचक: ‘वह आशीष दे’'
  rationale: पहले खंड में परमेश्वर के स्मरण पर आधारित भरोसे से आगे आने वाली आशीष की घोषणा संदर्भ में अधिक स्वाभाविक है, यद्यपि हिब्रू अपूर्ण रूप कामनासूचक अर्थ की संभावना रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज हिन्दी। काव्यात्मक बल बनाए रखने हेतु ‘आशीष देगा’ की पुनरावृत्ति नहीं हटाई गई है।
