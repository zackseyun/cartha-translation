  yaml_path: translation/ot/psalms/115/016.yaml
  text: The heavens are Yahweh's heavens[c][b][a], but the earth he has given to the sons of man.
translation:
  language: hi
  text: आकाश तो याहवे[a] का आकाश[b] है, पर पृथ्वी उसने मनुष्यों को दे दी है[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में यहाँ परमेश्वर का व्यक्तिगत नाम יהוה (याहवे) है।
    reason: divine_name
  - marker: b
    text: 'इब्रानी में ‘आकाश’ शब्द दो बार आया है; यह पुनरुक्ति जोर देती है। इसे इस प्रकार भी समझा जा सकता है: ‘जहाँ तक आकाश का प्रश्न है, वह याहवे का है।’'
    reason: source_structure
  - marker: c
    text: 'शाब्दिक रूप से: ‘मनुष्य के पुत्रों को’; यह इब्रानी अभिव्यक्ति मानवजाति या सभी मनुष्यों के लिए प्रयुक्त होती है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשָּׁמַיִם ... שָׁמַיִם
  choice: आकाश—आकाश
  rationale: इब्रानी में ‘आकाश’ की पुनरुक्ति जोर और विषय-वाक्य संरचना प्रकट करती है। हिंदी में डैश के साथ पुनरुक्ति काव्यात्मक बल को बनाए रखती है।
- source_word: לַיהוָה
  choice: याहवे का
  rationale: ל यहाँ अधिकार या संबंध प्रकट करता है। परमेश्वर के व्यक्तिगत वाचा-नाम יהוה को ‘याहवे’ और अधिकार को स्वाभाविक हिंदी संबंधकारक ‘का’ से व्यक्त किया गया है।
- source_word: וְהָאָרֶץ
  choice: पर पृथ्वी
  rationale: ו का मूल अर्थ ‘और’ है, किंतु दोनों अर्ध-पंक्तियों के विरोधात्मक समानांतर को हिंदी में ‘पर’ अधिक स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: נָתַן
  choice: उसने ... दे दी है
  rationale: पूर्ण क्रिया एक संपन्न कार्य और उससे बनी वर्तमान स्थिति को व्यक्त कर सकती है। कर्ता पिछले खंड के याहवे से समझा जाता है; इसलिए ‘उसने’ रखा गया है।
- source_word: לִבְנֵי אָדָם
  choice: मनुष्यों को
  rationale: शाब्दिक रूप से ‘आदम की संतानों/मनुष्य के पुत्रों को’, यह सामान्य इब्रानी मुहावरा समस्त मानवजाति के लिए है। ‘मनुष्यों को’ आधुनिक हिंदी में उसके आशय को स्पष्ट और संक्षिप्त रूप से व्यक्त करता है, जबकि शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: יהוה परमेश्वर के नाम का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में वाचा का व्यक्तिगत नाम יהוה है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और नाम को सामान्य उपाधि ‘प्रभु’ में नहीं बदलता।
- issue: בְנֵי אָדָם का प्रतिनिधिक मानवीय अर्थ
  choice: मनुष्य
  alternative: आदम की संतानें; मनुष्य के पुत्र
  rationale: यह पद केवल पुरुषों के बजाय मानवजाति को सामूहिक रूप से सूचित करता है। मुख्य पाठ में अर्थ-स्पष्ट हिंदी रखी गई है और इब्रानी रूप पादटिप्पणी में दिया गया है।
- issue: आकाश और पृथ्वी के बीच संबंध
  choice: आकाश याहवे का है, पर पृथ्वी उसने मनुष्यों को दी है
  alternative: आकाश केवल याहवे का है और पृथ्वी मनुष्यों की पूर्ण स्वतंत्र संपत्ति है
  rationale: पद अधिकार और दिए जाने का विरोध प्रस्तुत करता है, पर यह नहीं कहता कि पृथ्वी पर परमेश्वर का अंतिम स्वामित्व समाप्त हो गया। अनुवाद मूल कथन से आगे कोई व्यवस्थित धर्मवैज्ञानिक निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक रखी गई है। ‘पर’ समानांतर पंक्तियों का विरोध स्पष्ट करता है। आरंभ की जानबूझकर रखी गई पुनरुक्ति सामान्य गद्य से कुछ अधिक काव्यात्मक है, क्योंकि वही इब्रानी पंक्ति का विशेष बल है।
