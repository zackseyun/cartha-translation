  text: וַ/אֲנַ֤חְנוּ נְבָ֘רֵ֤ךְ יָ֗הּ מֵֽ/עַתָּ֥ה וְ/עַד עוֹלָ֗ם הַֽלְלוּ יָֽהּ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/115/018.yaml
  text: But we will bless Yah from now and forever[b][a]. Praise Yah!
translation:
  language: hi
  text: पर हम अब से सदा तक याह की बड़ाई करेंगे।[a] याह की स्तुति करो![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में ‘याह’ परमेश्वर के नाम का संक्षिप्त काव्यात्मक रूप है; कुछ परम्परागत अनुवाद इसे ‘प्रभु’ कहते हैं।
    reason: alternative_reading
  - marker: b
    text: इब्रानी ‘याह की स्तुति करो!’ उपासना में प्रचलित लिप्यंतरित शब्द ‘हालेलूयाह’ का स्रोत है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנַחְנוּ
  choice: पर हम
  rationale: स्वतंत्र सर्वनाम के साथ संयोजक पिछले पद के मृतकों के विपरीत जीवित समुदाय को उभारता है; ‘पर हम’ इस विरोध को सहज हिन्दी में व्यक्त करता है।
- source_word: נְבָרֵךְ
  choice: धन्य कहेंगे
  rationale: पिएल अपूर्ण रूप यहाँ समुदाय के आगे भी जारी रहने वाले संकल्प को व्यक्त करता है। ‘धन्य कहेंगे’ ברך को बाद के הלל से अलग रखते हुए स्वाभाविक हिन्दी देता है।
- source_word: יָהּ
  choice: याह
  rationale: यह परमेश्वर के नाम का संक्षिप्त काव्यात्मक रूप है। लिप्यंतरण स्रोत-पाठ में प्रयुक्त विशिष्ट रूप को सुरक्षित रखता है।
- source_word: מֵעַתָּה וְעַד עוֹלָם
  choice: अब से सदा तक
  rationale: यह वर्तमान क्षण से अनन्त भविष्य तक की अवधि को संक्षिप्त, वर्तमान हिन्दी में व्यक्त करता है।
- source_word: הַלְלוּ יָהּ
  choice: याह की स्तुति करो!
  rationale: बहुवचन आज्ञार्थक और संक्षिप्त दिव्य नाम का अर्थ स्पष्ट रूप से दिया गया है; यही इब्रानी अभिव्यक्ति ‘हालेलूयाह’ का स्रोत है।
theological_decisions:
- issue: दिव्य नाम के संक्षिप्त काव्यात्मक रूप יָהּ का अनुवाद
  choice: याह
  alternative: प्रभु
  rationale: इब्रानी में यहाँ पूर्ण चतुरक्षरीय नाम नहीं, बल्कि उसका संक्षिप्त काव्यात्मक रूप दो बार आया है। ‘याह’ इस पाठगत भेद और समापन के उपासना-संबंधी शब्द-खेल को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘धन्य कहेंगे’ और ‘स्तुति करो’ के द्वारा ברך तथा הלל का शब्दगत भेद बनाए रखा गया है; ‘पर हम’ पिछले पद से स्पष्ट विरोध दर्शाता है।
