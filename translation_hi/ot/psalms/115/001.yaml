  yaml_path: translation/ot/psalms/115/001.yaml
  text: Not to us[a], O Yahweh, not to us, but to your name give glory, because of your steadfast love, because of your faithfulness.
translation:
  language: hi
  text: हे याहवे, हमें नहीं, हमें नहीं, बल्कि अपने नाम को महिमा दे, अपने अटल प्रेम और अपनी विश्वासयोग्यता[a] के कारण।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपनी सच्चाई।”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी परमेश्वर-नाम YHWH को पदवी से बदलने के बजाय आधुनिक हिन्दी में निकट ध्वन्यात्मक रूप में रखा गया है।
- source_word: לֹא לָנוּ ... לֹא לָנוּ
  choice: हमें नहीं, हमें नहीं
  rationale: दोहराव वक्ताओं के लिए महिमा का दृढ़ निषेध करता है; हिन्दी में यही संक्षिप्त रूप काव्यात्मक बल बनाए रखता है।
- source_word: תֵּן כָּבוֹד
  choice: महिमा ... दे
  rationale: मूल का शाब्दिक भाव सुरक्षित है। हिन्दी की स्वाभाविक शब्द-व्यवस्था के लिए ‘महिमा’ को वाक्य के आरम्भ में रखा गया है।
- source_word: לְשִׁמְךָ
  choice: अपने नाम को
  rationale: ‘नाम’ परमेश्वर की प्रकट पहचान और प्रतिष्ठा का बोध करा सकता है, पर मूल की ठोस अभिव्यक्ति को मुख्य पाठ में बनाए रखा गया है।
- source_word: כִּי
  choice: बल्कि
  rationale: 'दो निषेधों के बाद यह सकारात्मक विरोध प्रस्तुत करता है: महिमा हमें नहीं, बल्कि परमेश्वर के नाम को मिले।'
- source_word: עַל
  choice: के कारण
  rationale: दोनों संज्ञाएँ प्रार्थना का आधार बताती हैं; आधुनिक हिन्दी में कारण-संबंध स्पष्ट रहता है।
- source_word: חַסְדְּךָ
  choice: अपने अटल प्रेम
  rationale: חסד में प्रेम, निष्ठा और स्थिरता का संयुक्त भाव है; ‘अटल प्रेम’ इसे सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: אֲמִתֶּךָ
  choice: अपनी विश्वासयोग्यता
  rationale: חסד के समानांतर यहाँ אֱמֶת परमेश्वर की भरोसेमंद निष्ठा को सूचित करता है; ‘सच्चाई’ का वैकल्पिक अर्थ पाद-टिप्पणी में सुरक्षित है।
theological_decisions:
- issue: परमेश्वर-नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा
  rationale: मूल पाठ में चार अक्षरों वाला विशिष्ट परमेश्वर-नाम है; ‘याहवे’ प्रचलित विद्वतापूर्ण पुनर्निर्मित उच्चारण का निकट हिन्दी रूप है।
- issue: חסד के साथ אֱמֶת का अर्थ
  choice: विश्वासयोग्यता
  alternative: सच्चाई
  rationale: इस प्रचलित युग्म में אֱמֶת प्रायः भरोसेमंद स्थिरता या निष्ठा का भाव रखता है, फिर भी ‘सच्चाई’ वास्तविक शाब्दिक संभावना है और पाद-टिप्पणी में दी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और प्रार्थनात्मक है। मूल के दोहरे निषेध को ज्यों का त्यों रखा गया है, जबकि स्वाभाविक हिन्दी के लिए वाक्य-क्रम हल्का बदला गया है।
