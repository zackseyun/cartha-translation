  text: He will bless those who fear Yahweh[a], the small together with the great.
translation:
  language: hi
  text: वह याहवे का भय मानने वालों को आशीष देगा—छोटे हों या बड़े।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “महत्त्वहीनों को प्रतिष्ठितों के साथ।” हिब्रू में ‘छोटों’ और ‘बड़ों’ का व्यापक विरोध है; इसमें केवल आयु या आकार नहीं, सामाजिक हैसियत अथवा महत्त्व भी अभिप्रेत हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְבָרֵךְ
  choice: वह ... आशीष देगा
  rationale: बरख का पिएल अपूर्ण, पुल्लिंग एकवचन रूप है; निकटवर्ती संदर्भ में परमेश्वर इसका निहित कर्ता है। यहाँ भविष्यसूचक आश्वासन का भाव स्वाभाविक है।
- source_word: יִרְאֵי יְהוָה
  choice: यहोवा का भय माननेवालों
  rationale: यह रचना उन लोगों को सूचित करती है जो यहोवा के प्रति श्रद्धायुक्त भय रखते हैं। प्रचलित हिन्दी बाइबलीय अभिव्यक्ति मूल के भय और भक्ति दोनों के तनाव को बनाए रखती है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चतुरक्षरीय व्यक्तिगत नाम को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है, किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: הַקְּטַנִּים
  choice: छोटों
  rationale: विशेषण यहाँ संज्ञा की तरह प्रयुक्त है और ‘बड़ों’ के विपरीत व्यापक अर्थ रखता है; यह आयु, आकार या सामाजिक हैसियत में से किसी एक तक अर्थ को सीमित नहीं करता।
- source_word: עִם
  choice: के साथ
  rationale: यह संबंध दोनों समूहों के समावेश को व्यक्त करता है और हिन्दी में सहज है।
- source_word: הַגְּדֹלִים
  choice: बड़ों
  rationale: ‘छोटों’ के समानांतर संज्ञात्मक विशेषण है; यह अधिक प्रतिष्ठित, महत्त्वपूर्ण, आयु में बड़े या अन्य अर्थों को खुला रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में व्यक्तिगत ईश्वरीय नाम प्रत्यक्ष है। आधुनिक हिन्दी पाठकों में व्यापक रूप से पहचाने जानेवाले ‘यहोवा’ को रखते हुए इसे ‘प्रभु’ जैसी उपाधि से नहीं बदला गया।
- issue: יְבָרֵךְ का भाव
  choice: निश्चयात्मक भविष्य—‘आशीष देगा’
  alternative: कामनासूचक—‘आशीष दे’
  rationale: भजन के प्रसंग में यह आशीष का आश्वासन है; तथापि हिब्रू अपूर्ण रूप अपने-आप में कामनासूचक अर्थ की व्याकरणिक संभावना को पूर्णतः निषिद्ध नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘भय माननेवाले’ श्रद्धायुक्त भय की पारंपरिक और स्पष्ट अभिव्यक्ति है। ‘छोटों ... बड़ों’ की संक्षिप्त जोड़ी मूल की समानांतरता और अर्थगत व्यापकता बनाए रखती है।
