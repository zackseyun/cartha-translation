  text: Those who make them become like them[b][a], as does everyone who trusts in them.
translation:
  language: hi
  text: जो उन्हें बनाते हैं, वे उन्हीं के समान हो जाएँगे[a][b], और उन पर भरोसा रखने वाले सभी लोग भी ऐसे ही होंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “वे उन्हीं के समान होंगे।” इब्रानी क्रिया का अर्थ “होना” अथवा “हो जाना” दोनों हो सकता है; यहाँ “हो जाएँगे” परिणामी समानता का भाव प्रकट करता है।
    reason: lexical_alternative
  - marker: b
    text: अर्थात् उन मूर्तियों के समान—जो पिछले पदों में न बोल पाने, न देखने, न सुनने और सामर्थ्यहीन होने के रूप में वर्णित हैं।
    reason: cross_reference
lexical_decisions:
- source_word: כְּמוֹהֶם
  choice: उन्हीं के समान
  rationale: כְּ तुलना व्यक्त करता है और प्रत्यय पूर्ववर्ती मूर्तियों की ओर संकेत करता है। ‘उन्हीं के समान’ इस तुलना और उसके बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: יִהְיוּ
  choice: हो जाएँगे
  rationale: היה का अर्थ ‘होंगे’ भी हो सकता है, पर तुलनात्मक विधेय के साथ यहाँ परिणामी समानता का भाव संभव है; ‘हो जाएँगे’ उसे व्यक्त करता है, जबकि वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: עֹשֵׂיהֶם
  choice: जो उन्हें बनाते हैं
  rationale: עשה का कृदन्त और बहुवचन प्रत्यय उन मनुष्यों को दर्शाता है जो मूर्तियाँ बनाते हैं। यह रूप आधुनिक हिन्दी में स्पष्ट और सहज है।
- source_word: כֹּל אֲשֶׁר
  choice: हर वह व्यक्ति जो
  rationale: यह रचना सार्वभौमिक दायरा व्यक्त करती है। ‘हर वह व्यक्ति जो’ हिन्दी में स्वाभाविक है और इब्रानी के एकवचन कृदन्त के साथ भी मेल रखती है।
- source_word: בֹּטֵחַ בָּהֶם
  choice: उन पर भरोसा रखता है
  rationale: בטח ב किसी पर भरोसा या निर्भरता रखने का अर्थ देता है। ‘उन पर भरोसा रखता है’ धार्मिक संदर्भ में स्पष्ट और सामान्य हिन्दी है।
theological_decisions:
- issue: मूर्तियों के समान होने का स्वरूप
  choice: मुख्य पाठ केवल यह कहता है कि बनाने और भरोसा रखने वाले मूर्तियों के समान हो जाएँगे; समानता का पूरा स्वरूप उसमें नहीं जोड़ा गया।
  alternative: इसे स्पष्ट रूप से नैतिक समानता या आत्मिक संवेदनहीनता कहना।
  rationale: इब्रानी पद समानता की घोषणा करता है, पर इसी पद में उसके हर पहलू या प्रक्रिया को परिभाषित नहीं करता। पिछले पदों का संदर्भ पादटिप्पणी में दिया गया है ताकि कथन की धार्मिक गंभीरता बनी रहे और अनावश्यक व्याख्या मुख्य पाठ में न घुसे।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य शैली। ‘मूर्ति’ को मुख्य पद में दोहराने के बजाय मूल के सर्वनाम ‘उन्हें/उन्हीं/उन’ बनाए रखे गए हैं; पादटिप्पणी संदर्भ स्पष्ट करती है।
