source:
  edition: WLC
  text: אָזְנַ֣יִם לָ֭/הֶם וְ/לֹ֣א יִשְׁמָ֑עוּ אַ֥ף לָ֝/הֶ֗ם וְ/לֹ֣א יְרִיחֽוּ/ן׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/115/006.yaml
  text: They have ears, but do not hear; noses, but do not smell.
translation:
  language: hi
  text: उनके कान हैं, पर वे सुनते नहीं; उनकी नाक है, पर वे सूँघते नहीं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָזְנַיִם
  choice: कान
  rationale: द्विवचन रूप श्रवण-अंग को दर्शाता है; हिन्दी में बहुवचन कर्ता के साथ स्वाभाविक रूप से ‘उनके कान हैं’ कहा जाता है।
- source_word: לָהֶם
  choice: उनके ... हैं / उनकी ... है
  rationale: ל־युक्त सर्वनाम शाब्दिक रूप से ‘उनको’ है, पर इस अस्तित्ववाचक स्वामित्व-रचना को आधुनिक हिन्दी में संबंधकारक और ‘हैं/है’ द्वारा स्वाभाविक ढंग से व्यक्त किया गया है।
- source_word: יִשְׁמָעוּ
  choice: सुनते
  rationale: यहाँ שׁמע सुनने की क्षमता या क्रिया बताता है; ‘सुनते’ सीधा और प्रसंगानुकूल है।
- source_word: אַף
  choice: नाक
  rationale: इस प्रसंग में אַף का अर्थ शरीर का अंग ‘नाक’ है, ‘क्रोध’ नहीं। हिब्रू में यह एकवचन है, और हिन्दी में समूह के प्रत्येक सदस्य के अंग के लिए ‘उनकी नाक’ स्वाभाविक है।
- source_word: יְרִיחוּן
  choice: सूँघते
  rationale: यह रूप गंध ग्रहण करने की क्रिया बताता है; ‘सूँघते’ ठोस शारीरिक बिंब और समानांतर रचना को बनाए रखता है।
- source_word: וְלֹא
  choice: पर ... नहीं
  rationale: शाब्दिक ‘और नहीं’ की अपेक्षा ‘पर ... नहीं’ अंग होने और उसके निष्क्रिय होने के व्यंग्यपूर्ण विरोध को स्वाभाविक हिन्दी में स्पष्ट करता है।
theological_decisions:
- issue: मूर्तियों के मानवरूपी अंगों का वर्णन
  choice: इंद्रिय-अंग होने पर भी इंद्रिय-क्षमता न होने का ठोस, शाब्दिक चित्रण
  alternative: उनकी आध्यात्मिक असमर्थता को व्याख्यात्मक भाषा में स्पष्ट करना
  rationale: हिब्रू पाठ स्वयं ठोस शारीरिक बिंबों द्वारा मूर्तियों की निष्प्राणता दिखाता है। अनुवाद उसी अलंकारिक और धर्मवैचारिक तनाव को रखता है तथा मुख्य पाठ में अतिरिक्त व्याख्या नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। दोनों अर्ध-पंक्तियों में समानांतर ‘उनके/उनकी ... हैं/है, पर वे ... नहीं’ संरचना मूल की लय और विडंबना को सुरक्षित रखती है।
