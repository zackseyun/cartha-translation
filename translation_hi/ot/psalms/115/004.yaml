translation:
  language: hi
  text: 'उनकी मूर्तियाँ चाँदी और सोने की हैं,

    मनुष्य के हाथों की बनाई हुई हैं।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֲצַבֵּיהֶם
  choice: उनकी मूर्तियाँ
  rationale: यह पद भजन के विवादात्मक संदर्भ में मनुष्य-निर्मित देव-प्रतिमाओं को सूचित करता है; आधुनिक हिन्दी में ‘मूर्तियाँ’ स्वाभाविक और स्पष्ट है।
- source_word: כֶּסֶף וְזָהָב
  choice: चाँदी और सोना
  rationale: दोनों पदार्थ-सूचक शब्दों और उनके सरल समन्वय को सीधे बनाए रखता है।
- source_word: מַעֲשֵׂה יְדֵי אָדָם
  choice: मनुष्य के हाथों की बनाई हुई
  rationale: इब्रानी के ‘मनुष्य के हाथों का काम/उत्पाद’ का ठोस बिंब बनाए रखते हुए हिन्दी में स्वाभाविक रूप से व्यक्त करता है; אָדָם यहाँ जातिवाचक है।
theological_decisions:
- issue: אָדָם का जातिवाचक अर्थ
  choice: मनुष्य के हाथों
  alternative: आदमी के हाथों / मानव-हाथों
  rationale: यह किसी विशेष पुरुष को नहीं, बल्कि परमेश्वर के विपरीत मानवीय कर्तृत्व को सूचित करता है। ‘मनुष्य’ इस सामूहिक, जातिवाचक अर्थ और धार्मिक तनाव दोनों को स्पष्ट रखता है।
