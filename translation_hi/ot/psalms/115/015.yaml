  text: בְּרוּכִ֣ים אַ֭תֶּם לַ/יהוָ֑ה עֹ֝שֵׂ֗ה שָׁמַ֥יִם וָ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/115/015.yaml
  text: May you be blessed by Yahweh[b][a], the Maker of heaven and earth.
translation:
  language: hi
  text: तुम याहवे से आशीष पाओ[a], जो आकाश[b] और पृथ्वी का रचयिता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप में: “तुम याहवे की ओर से धन्य हो।” यहाँ यह पदबंध आशीर्वाद देने का सूत्र है।'
    reason: lexical_alternative
  - marker: b
    text: या “आकाशों।”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרוּכִים אַתֶּם
  choice: तुम … आशीष पाओ
  rationale: בְּרוּכִים एक निष्क्रिय कृदंत और אַתֶּם बहुवचन सर्वनाम है। प्रसंग में यह आशीर्वाद का सूत्र है; इसलिए हिंदी में स्वाभाविक कामनार्थक अभिव्यक्ति अपनाई गई, जबकि शाब्दिक कथन को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: לַיהוָה
  choice: याहवे से
  rationale: ל यहाँ आशीष के स्रोत अथवा कर्ता का बोध कराता है। ‘से’ हिंदी में इस स्रोतभाव को स्वाभाविक रूप से व्यक्त करता है, और יהוה को उसके व्यक्तिगत वाचा-नाम ‘याहवे’ के रूप में रखा गया है।
- source_word: עֹשֵׂה
  choice: रचयिता
  rationale: עשה का यह कालवाचक कृदंत संज्ञा के रूप में परमेश्वर की उपाधि है। ‘रचयिता’ संक्षिप्त, गरिमापूर्ण और आधुनिक हिंदी में स्वाभाविक है।
- source_word: שָׁמַיִם וָאָרֶץ
  choice: आकाश और पृथ्वी
  rationale: यह युग्म समस्त सृष्टि को सूचित करने वाला प्रचलित द्वंद्व है। שָׁמַיִם रूप की दृष्टि से बहुवचन है, पर हिंदी में ‘आकाश और पृथ्वी’ अधिक स्वाभाविक है; बहुवचन विकल्प पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार-अक्षरी व्यक्तिगत नाम सीधे आया है। ‘याहवे’ उसे सामान्य उपाधि में बदलने के बजाय वाचा-नाम के रूप में सुरक्षित रखता है।
- issue: आशीर्वचन को कथन या कामना के रूप में प्रस्तुत करना
  choice: तुम याहवे से आशीष पाओ
  alternative: तुम याहवे से आशीषित हो
  rationale: इब्रानी पदबंध व्याकरणतः नाममात्र कथन की तरह पढ़ा जा सकता है, पर इस प्रसंग में वह आशीर्वाद-सूत्र का कार्य करता है। मुख्य पाठ में उसका स्वाभाविक हिंदी आशीर्वचन दिया गया है और वास्तविक व्याकरणिक विकल्प पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। बहुवचन ‘तुम’ मूल के אַתֶּם को दर्शाता है। ‘रचयिता’ उपाधि के रूप में עֹשֵׂה की कृदंतीय प्रकृति को संक्षेप में व्यक्त करता है।
