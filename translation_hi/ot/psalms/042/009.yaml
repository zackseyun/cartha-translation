id: PSA.42.9
reference: Psalms 42:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אוֹמְרָ֤ה לְ/אֵ֥ל סַלְעִ/י֮ לָ/מָ֪ה שְׁכַ֫חְתָּ֥/נִי לָֽ/מָּה קֹדֵ֥ר אֵלֵ֗ךְ בְּ/לַ֣חַץ אוֹיֵֽב׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/042/009.yaml
  text: I say to God[a], my rock, “Why have you forgotten me? Why do I go about mourning under the oppression of the enemy?”
translation:
  language: hi
  text: मैं परमेश्वर—मेरी चट्टान—से कहता हूँ, “तू मुझे क्यों भूल गया है? शत्रु के अत्याचार से दबा हुआ मैं शोक करते हुए क्यों फिरता हूँ?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “शत्रु के अत्याचार से दबा हुआ मैं उदास होकर क्यों फिरता हूँ?”
    reason: कֹדֵר का अर्थ शोकाकुल होने के साथ-साथ उदास या अँधेरा-सा होने की दशा भी हो सकता है।
lexical_decisions:
- source_word: אוֹמְרָה
  choice: मैं ... कहता हूँ
  rationale: यह प्रथम पुरुष एकवचन का कोहोर्टेटिव रूप संकल्प या तत्काल कथन जता सकता है। विलाप में सीधे संबोधन का परिचय होने के कारण वर्तमानकालीन अभिव्यक्ति स्वाभाविक है।
- source_word: לְאֵל
  choice: परमेश्वर से
  rationale: यहाँ אֵל संदर्भ में परमेश्वर के लिए सामान्य पद है, व्यक्तिवाचक नाम नहीं।
- source_word: סַלְעִי
  choice: अपनी चट्टान से
  rationale: शाब्दिक रूपक को बनाए रखा गया है; यह परमेश्वर की दृढ़ता और आश्रय होने की काव्यात्मक छवि को सुरक्षित रखता है।
- source_word: שְׁכַחְתָּנִי
  choice: तू मुझे ... भूल गया है
  rationale: पूर्ण क्रिया और प्रथम पुरुष कर्म-प्रत्यय को वर्तमान तक बनी दशा वाले प्रश्न के रूप में व्यक्त किया गया है; ‘त्याग दिया’ मूल क्रिया से अधिक अर्थ जोड़ता।
- source_word: קֹדֵר
  choice: शोक में डूबा
  rationale: קדר अँधेरा या उदास होने और विस्तार से शोक करने का भाव दे सकता है। यहाँ यह चलते-फिरते रहने की दुःखपूर्ण दशा बताता है।
- source_word: אֵלֵךְ
  choice: फिरता हूँ
  rationale: הלך का मूल अर्थ चलना या जाना है; ‘फिरता हूँ’ निरंतर अवस्था को सहज हिन्दी में व्यक्त करता है।
- source_word: בְּלַחַץ
  choice: अत्याचार के कारण
  rationale: לַחַץ दबाव या उत्पीड़न को दर्शाता है और בְּ यहाँ परिस्थिति अथवा कारण व्यक्त कर सकता है। हिन्दी में यह कारणसूचक रूप स्वाभाविक है।
- source_word: אוֹיֵב
  choice: शत्रु
  rationale: अनिश्चित एकवचन रूप काव्य में सामान्य या सामूहिक विरोधी को सूचित कर सकता है; हिन्दी में बिना परसर्गीय निर्धारक के ‘शत्रु’ यह खुलापन बनाए रखता है।
theological_decisions:
- issue: परमेश्वर के लिए रूपक סַלְעִי
  choice: अपनी चट्टान
  alternative: अपना आश्रय
  rationale: रूपक की व्याख्या करके उसे समतल करने के बजाय मूल काव्यात्मक और धर्मवैचारिक छवि सुरक्षित रखी गई है।
- issue: परमेश्वर द्वारा भूल जाने की शिकायत
  choice: तू मुझे क्यों भूल गया है?
  alternative: तूने मुझे क्यों त्याग दिया है?
  rationale: विश्वासी विलाप की तीखी शिकायत को धर्मसैद्धांतिक कारणों से नरम नहीं किया गया, और ‘भूलना’ मूल शब्द के निकट है।
- issue: קֹדֵר की अर्थ-व्याप्ति
  choice: शोक में डूबा
  alternative: उदास होकर
  rationale: मुख्य पाठ में शोक का प्रसंगानुकूल अर्थ लिया गया है, जबकि उदासी या अँधेरेपन की वास्तविक शब्दार्थ-संभावना पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज काव्यात्मक शैली रखी गई है। परमेश्वर के सीधे संबोधन में ‘तू’ भजन-साहित्य की निकटता और एकवचन हिब्रू संबोधन को व्यक्त करता है।
