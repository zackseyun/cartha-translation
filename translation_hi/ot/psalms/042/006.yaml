  text: אֱֽלֹהַ֗/י עָלַ/י֮ נַפְשִׁ֪/י תִשְׁתּ֫וֹחָ֥ח עַל כֵּ֗ן אֶ֭זְכָּרְ/ךָ מֵ/אֶ֣רֶץ יַרְדֵּ֑ן וְ֝/חֶרְמוֹנִ֗ים מֵ/הַ֥ר מִצְעָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/042/006.yaml
  text: My God[a], my soul is cast down within me; therefore I remember you from the land of the Jordan and the Hermons[d][c][b], from Mount Mizar.
translation:
  language: hi
  text: मेरे परमेश्वर, मेरा प्राण मेरे भीतर झुका हुआ है; इसलिए मैं यरदन के प्रदेश और हर्मोन पर्वत-श्रृंखला[b][c] से, मिसआर पर्वत[d] से, तुझे स्मरण करता हूँ[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं तुझे स्मरण करूँगा।” हिब्रू क्रिया संदर्भ में वर्तमान संकल्प या भविष्य की क्रिया, दोनों व्यक्त कर सकती है।
    reason: lexical_alternative
  - marker: b
    text: हिब्रू में शब्द बहुवचन है—शाब्दिक रूप से “हर्मोनों”; संभवतः हर्मोन की पर्वत-श्रृंखला या उसके शिखरों का संकेत है।
    reason: lexical_alternative
  - marker: c
    text: या, “यरदन के प्रदेश से, और हर्मोन से।” हिब्रू वाक्य-विन्यास में भौगोलिक पदों का संबंध कुछ अस्पष्ट है।
    reason: syntactic_ambiguity
  - marker: d
    text: “मिसआर पर्वत” संभवतः किसी स्थान का नाम है; या, “छोटे पर्वत से” अथवा “मिसआर नामक पहाड़ी से।”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהַי
  choice: मेरे परमेश्वर
  rationale: प्रथम पुरुष एकवचन प्रत्यय का अर्थ ‘मेरे परमेश्वर’ है। इसे संबोधन के रूप में रखा गया है, पर मूल में न होने के कारण ‘हे’ नहीं जोड़ा गया।
- source_word: עָלַי נַפְשִׁי תִשְׁתּוֹחָח
  choice: मेरा प्राण मेरे भीतर झुका हुआ है
  rationale: ‘प्राण’ काव्यात्मक נֶפֶשׁ को बनाए रखता है और ‘झुका हुआ’ שׁוחח में निहित नीचे झुकने तथा निराश होने, दोनों भावों को व्यक्त करता है। ‘मेरे भीतर’ इस अवस्था को वक्ता की भीतरी दशा के रूप में स्वाभाविक हिन्दी में बताता है।
- source_word: עַל־כֵּן
  choice: इसलिए
  rationale: यह वक्ता की निराश अवस्था और परमेश्वर को स्मरण करने के बीच परिणाम अथवा निष्कर्ष का संबंध स्पष्ट करता है।
- source_word: אֶזְכָּרְךָ
  choice: मैं तुझे स्मरण करता हूँ
  rationale: काव्य में अपूर्ण क्रिया वर्तमान संकल्प या चल रही क्रिया व्यक्त कर सकती है। हिन्दी का वर्तमान काल इसे स्वाभाविक रूप से रखता है; भविष्यकाल की संभावना पादटिप्पणी में दी गई है।
- source_word: מֵאֶרֶץ יַרְדֵּן
  choice: यरदन के प्रदेश से
  rationale: यह केवल नदी नहीं, यरदन से संबद्ध भू-प्रदेश का संकेत देता है। संयुक्त वाक्यांश में ‘से’ हर्मोन के साथ साझा किया गया है।
- source_word: וְחֶרְמוֹנִים
  choice: और हर्मोन पर्वत-श्रृंखला
  rationale: हिब्रू बहुवचन का संकेत एकाधिक शिखरों या हर्मोन क्षेत्र से हो सकता है। ‘हर्मोन पर्वत-श्रृंखला’ आधुनिक हिन्दी में सुबोध है और बहुवचन भौगोलिक भाव को बचाती है; शाब्दिक रूप पादटिप्पणी में है।
- source_word: מֵהַר מִצְעָר
  choice: मिसआर पर्वत से
  rationale: समानांतर भौगोलिक नामों के संदर्भ में מִצְעָר को स्थान-नाम मानना न्यूनतम व्याख्यात्मक विकल्प है; इसके सामान्य अर्थ पर आधारित विकल्प पादटिप्पणी में सुरक्षित है।
