id: PSA.42.5
reference: Psalms 42:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: מַה תִּשְׁתּ֬וֹחֲחִ֨י נַפְשִׁ/י֮ וַ/תֶּהֱמִ֪י עָ֫לָ֥/י הוֹחִ֣ילִי לֵֽ֭/אלֹהִים כִּי ע֥וֹד אוֹדֶ֗/נּוּ יְשׁוּע֥וֹת פָּנָֽי/ו־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/042/005.yaml
  text: Why are you cast down[a], O my soul, and why are you in turmoil within me? Hope in God, for I will yet praise him, the salvation of my countenance and my God.
translation:
  language: hi
  text: हे मेरे प्राण, तू क्यों दबा हुआ है, और मेरे भीतर क्यों व्याकुल है? परमेश्वर पर आशा रख, क्योंकि मैं फिर उसकी स्तुति करूँगा—उसके मुख के उद्धारों के लिए।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उसके मुख के उद्धार।” इब्रानी में “मुख” प्रायः किसी की उपस्थिति का भी संकेत देता है। इसका अर्थ “उसकी उपस्थिति से मिलने वाले उद्धार” या “उसके मुख से मिलने वाली सहायता” भी समझा जा सकता है।
    reason: मूल इब्रानी के असामान्य पदबंध, बहुवचन और ‘मुख’ के रूपक को सुरक्षित रखना।
lexical_decisions:
- source_word: תִּשְׁתּוֹחֲחִי
  choice: तू क्यों इतना झुक गया है
  rationale: क्रिया झुक जाने या दबकर नीचे हो जाने का चित्र देती है और इस प्रसंग में निराशा व्यक्त करती है। हिंदी में यह रूप मूल रूपक को बनाए रखते हुए स्वाभाविक है।
- source_word: נַפְשִׁי
  choice: हे मेरे प्राण
  rationale: कवि अपने भीतरी व्यक्तित्व को संबोधित करता है। ‘मेरे प्राण’ काव्यात्मक आत्म-संबोधन को सुरक्षित रखता है और किसी तकनीकी मनुष्य-विज्ञान को नहीं थोपता।
- source_word: וַתֶּהֱמִי עָלָי
  choice: मेरे भीतर क्यों व्याकुल है
  rationale: क्रिया उथल-पुथल, बेचैनी या कोलाहल सूचित करती है; עָלַי का शाब्दिक अर्थ ‘मुझ पर’ है, पर आत्म-संबोधन के इस प्रसंग में हिंदी का ‘मेरे भीतर’ आंतरिक व्याकुलता को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: הוֹחִילִי לֵאלֹהִים
  choice: परमेश्वर पर आशा रख
  rationale: आज्ञार्थक क्रिया भरोसे के साथ प्रतीक्षा करने को कहती है। ‘आशा रख’ विश्वास और अपेक्षा दोनों को संक्षेप में व्यक्त करता है।
- source_word: כִּי עוֹד אוֹדֶנּוּ
  choice: क्योंकि मैं फिर भी उसकी स्तुति करूँगा
  rationale: עוֹד वर्तमान दुःख के बावजूद भविष्य की आशा को दर्शाता है; ידה का हिफ़ील रूप यहाँ स्तुति करने के अर्थ में स्वाभाविक है।
- source_word: יְשׁוּעוֹת פָּנָיו
  choice: उसकी उपस्थिति से मिलने वाले उद्धार के लिए
  rationale: बहुवचन יְשׁוּעוֹת उद्धार या बचाने के कार्यों को सूचित कर सकता है और פָּנָיו का मूल अर्थ ‘उसका मुख’ है, जो प्रायः उपस्थिति का संकेत देता है। चुना हुआ रूप कठिन इब्रानी पदबंध को स्पष्ट हिंदी में रखता है, जबकि उसका शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: समापन पदबंध יְשׁוּעוֹת פָּנָיו का संबंध और अर्थ
  choice: उसकी उपस्थिति से मिलने वाले उद्धार के लिए
  alternative: शाब्दिक रूप से, ‘उसके मुख के उद्धारों के लिए’; अथवा ‘उसके मुख से मिलने वाली सहायता के लिए’
  rationale: दिए गए मसोराई पाठ में तीसरे पुरुष का פָּנָיו (‘उसका मुख’) है; इसमें ‘मेरा मुख और मेरा परमेश्वर’ नहीं है। ‘उपस्थिति’ इब्रानी ‘मुख’ के संबंधपरक भाव को व्यक्त करती है, पर वास्तविक रूपक और पदबंध की अस्पष्टता पादटिप्पणी में बनाए रखी गई है।
translation_notes:
  register: आधुनिक मानक हिंदी का गरिमापूर्ण काव्यात्मक रूप अपनाया गया है। आत्म-संबोधन के कारण एकवचन ‘तू’ स्वाभाविक है और यहाँ अनादर नहीं दर्शाता। दिए गए WLC पाठ को प्राथमिक माना गया है; अंग्रेज़ी परामर्श-पाठ का अंतिम वाक्यांश इस स्रोत-पाठ से मेल न खाने के कारण नहीं अपनाया गया।
