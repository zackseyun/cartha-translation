base_translation:
  language: en
  yaml_path: translation/ot/psalms/042/004.yaml
  text: 'These things I remember[a], and I pour out my soul within me: how I used to pass along with the throng, leading them to the house of God with the sound of joyful shouting and thanksgiving[b], a festal multitude.'
translation:
  language: hi
  text: 'इन बातों को मैं स्मरण करता हूँ और अपना मन अपने भीतर उंडेल देता हूँ: कैसे मैं जनसमूह[a] के साथ चलता था और उन्हें[b] परमेश्वर के भवन तक ले जाता था—आनन्द की जयजयकार और धन्यवाद की ध्वनि के साथ, उत्सव मनाती भीड़ के बीच।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “जुलूस की मंडली में”; इब्रानी शब्द בַּסָּךְ कठिन है और पर्व के लिए जुटी भीड़ अथवा स्वयं जुलूस की मंडली का संकेत दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “उनका मार्ग दिखाते हुए” अथवा “उनके साथ जाते हुए”; इब्रानी क्रिया אֶדַּדֵּם दुर्लभ है और उसका सटीक भाव अनिश्चित है, यद्यपि प्रसंग में दूसरों के साथ परमेश्वर के भवन की ओर बढ़ना स्पष्ट है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה אֶזְכְּרָה
  choice: इन बातों को मैं स्मरण करता हूँ
  rationale: बहुवचन संकेतवाचक אֵלֶּה को स्पष्ट रखा गया है। काव्यात्मक प्रसंग में क्रिया वर्तमान चिंतन और जीवंत स्मृति व्यक्त करती है; इसलिए वर्तमान काल चुना गया है।
- source_word: וְאֶשְׁפְּכָה עָלַי נַפְשִׁי
  choice: और अपने भीतर अपना मन उंडेल देता हूँ
  rationale: שׁפך के ‘उंडेलने’ वाले रूपक को बनाए रखा गया है। נֶפֶשׁ यहाँ भीतरी व्यक्तित्व और भावनात्मक जीवन को दर्शाता है; आधुनिक हिन्दी में ‘मन’ स्वाभाविक है, जबकि ‘प्राण’ इस प्रसंग में जीवन-शक्ति का भ्रामक संकेत दे सकता है। עָלַי के मुहावरेदार अर्थ को ‘अपने भीतर’ से व्यक्त किया गया है।
- source_word: כִּי אֶעֱבֹר
  choice: कैसे मैं ... चलता था
  rationale: כִּי यहाँ स्मरण की विषयवस्तु प्रस्तुत करता है, इसलिए ‘कैसे’ उपयुक्त है। अपूर्ण क्रिया को अतीत की बार-बार होने वाली गतिविधि के रूप में ‘चलता था’ से व्यक्त किया गया है।
- source_word: בַּסָּךְ
  choice: जनसमूह के साथ
  rationale: यह दुर्लभ और कठिन संज्ञा तीर्थयात्रियों की भीड़ अथवा जुलूस की मंडली का संकेत दे सकती है। प्रसंगानुसार ‘जनसमूह’ मुख्य पाठ में स्वाभाविक है और अनिश्चितता पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: אֶדַּדֵּם
  choice: उन्हें ... ले जाता था
  rationale: दुर्लभ क्रिया और उसके तृतीय पुरुष बहुवचन प्रत्यय को स्पष्ट किया गया है। सम्भावित अर्थ नेतृत्व करना, मार्ग दिखाना या उनके साथ आगे बढ़ना है; ‘ले जाता था’ हिन्दी में इस प्रक्रिया को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: עַד בֵּית אֱלֹהִים
  choice: परमेश्वर के भवन तक
  rationale: עַד की सीमा/गन्तव्य की भावना के लिए ‘तक’ रखा गया है और ‘परमेश्वर का भवन’ मन्दिर-सन्दर्भ को बिना अतिरिक्त व्याख्या के सुरक्षित रखता है।
- source_word: בְּקוֹל רִנָּה וְתוֹדָה
  choice: आनन्द की जयजयकार और धन्यवाद की ध्वनि के बीच
  rationale: קוֹל की श्रव्यता, רִנָּה की ऊँची आनन्दपूर्ण पुकार और תּוֹדָה के धन्यवाद/स्तुति भाव को एक साथ सुरक्षित रखा गया है।
- source_word: הָמוֹן חוֹגֵג
  choice: उत्सव मनाती भीड़
  rationale: הָמוֹן भीड़ को और חוֹגֵג पर्व मनाने वाले समुदाय को दर्शाता है। ‘उत्सव मनाती भीड़’ आधुनिक हिन्दी में स्पष्ट है और धार्मिक पर्व का सामूहिक वातावरण बनाए रखता है।
theological_decisions:
- issue: נֶפֶשׁ का हिन्दी रूप
  choice: मन
  alternative: प्राण / आत्मा
  rationale: यहाँ शब्द व्यक्ति के भीतरी भावनात्मक जीवन का संकेत देता है, न कि शरीर से अलग आत्मा के विषय में कोई तकनीकी शिक्षा। ‘मन’ प्रसंग का भाव स्वाभाविक रूप से देता है और अनावश्यक दार्शनिक या साम्प्रदायिक अर्थ आरोपित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। ‘स्मरण’, ‘जयजयकार’ और ‘परमेश्वर का भवन’ काव्यात्मक ऊँचाई बनाए रखते हैं, जबकि वाक्य-विन्यास साधारण हिन्दी पाठक के लिए सुबोध है। कठिन इब्रानी पदों की वास्तविक अनिश्चितता मुख्य पाठ को बोझिल किए बिना पादटिप्पणियों में दी गई है।
