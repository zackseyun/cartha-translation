id: PSA.42.1
reference: Psalms 42:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כְּ/אַיָּ֗ל תַּעֲרֹ֥ג עַל אֲפִֽיקֵי מָ֑יִם כֵּ֤ן נַפְשִׁ֨/י תַעֲרֹ֖ג אֵלֶ֣י/ךָ אֱלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/042/001.yaml
  text: As a deer longs for streams of water[a], so my soul longs for you[c][b], O God.
translation:
  language: hi
  text: जैसे हिरन जल की धाराओं[b] के लिए तड़पता है,[a] वैसे ही मेरा प्राण[c] तेरे लिए तड़पता है, हे परमेश्वर।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी क्रिया में प्यास से हाँफने जैसी तीव्र लालसा का भाव भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘जलमार्गों’ अथवा ‘पानी के नालों’।
    reason: lexical_alternative
  - marker: c
    text: ‘मेरा प्राण’ का अर्थ यहाँ ‘मेरा जीवन’, ‘मेरा अंतरतम’ या ‘मैं स्वयं’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּ/אַיָּל
  choice: जैसे हिरन
  rationale: כְּ तुलना को व्यक्त करता है और אַיָּל हिरन, विशेषतः नर हिरन, को सूचित कर सकता है। ‘हिरन’ सहज, व्यापक और काव्यात्मक रूप से उपयुक्त है।
- source_word: תַּעֲרֹג
  choice: तड़पता है
  rationale: ערג तीव्र लालसा व्यक्त करता है, जिसमें प्यास से हाँफने का भाव भी हो सकता है। ‘तड़पता है’ इस तीव्रता को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: עַל
  choice: के लिए
  rationale: लालसा व्यक्त करने वाली क्रिया के साथ हिन्दी में ‘के लिए’ स्वाभाविक रूप से इच्छित वस्तु को दर्शाता है।
- source_word: אֲפִיקֵי מָיִם
  choice: जल की धाराओं
  rationale: यह पद जल के बहावों, नालों या जलमार्गों को सूचित कर सकता है। ‘जल की धाराओं’ स्पष्ट, काव्यात्मक और बहुवचन बिंब को सुरक्षित रखता है।
- source_word: כֵּן
  choice: वैसे ही
  rationale: यह उपमा के दूसरे भाग का परिचय देता है; ‘वैसे ही’ हिन्दी में तुलना को स्पष्ट और स्वाभाविक बनाता है।
- source_word: נַפְשִׁי
  choice: मेरा प्राण
  rationale: נֶפֶשׁ व्यक्ति के प्राण, जीवन, स्वयं या भीतरी अस्तित्व को दर्शा सकता है। ‘मेरा प्राण’ भजन के भक्तिपूर्ण काव्य-स्वर को बनाए रखते हुए अर्थ को केवल पृथक ‘आत्मा’ तक सीमित नहीं करता।
- source_word: אֵלֶיךָ
  choice: तेरे लिए
  rationale: मूल अर्थ ‘तेरी ओर’ है, पर लालसा की क्रिया के साथ ‘तेरे लिए’ स्वाभाविक हिन्दी है और परमेश्वर की ओर निर्देशित चाह को बनाए रखता है।
- source_word: אֱלֹהִים
  choice: हे परमेश्वर
  rationale: यहाँ परमेश्वर को सीधे संबोधित किया गया है; ‘हे परमेश्वर’ उस संबोधन को स्पष्ट और गरिमापूर्ण बनाता है।
theological_decisions:
- issue: נַפְשִׁי का मानव-स्वरूप संबंधी अर्थ
  choice: मेरा प्राण
  alternative: मेरा जीवन; मेरा अंतरतम; मैं स्वयं
  rationale: इब्रानी शब्द अनिवार्य रूप से शरीर से अलग किसी आत्मिक तत्त्व की शिक्षा नहीं देता, बल्कि पूरे जीवित व्यक्ति या उसके भीतरी अस्तित्व को भी सूचित कर सकता है। मुख्य पाठ में ‘मेरा प्राण’ काव्यात्मक और भक्तिपूर्ण स्वर बनाए रखता है, जबकि पाद-टिप्पणी अर्थ की व्यापकता बताती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘तेरे’ का प्रयोग भजन की सीधी, निकट और पारंपरिक प्रार्थना-भाषा के अनुरूप है। उपमा की समानांतर रचना और मूल की तीव्र लालसा सुरक्षित रखी गई है।
