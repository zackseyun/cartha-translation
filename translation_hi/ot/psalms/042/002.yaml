source:
  edition: WLC
  text: צָמְאָ֬ה נַפְשִׁ֨/י לֵ/אלֹהִים֮ לְ/אֵ֪ל חָ֥י מָתַ֥י אָב֑וֹא וְ֝/אֵרָאֶ֗ה פְּנֵ֣י אֱלֹהִֽים׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/042/002.yaml
  text: My soul thirsts for God[a], for the living God. When shall I come and appear before God?
translation:
  language: hi
  text: मेरा प्राण परमेश्वर के लिए, जीवित परमेश्वर के लिए प्यासा है। मैं कब आऊँगा और परमेश्वर के सामने[a] उपस्थित होऊँगा?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ, “परमेश्वर का मुख।”
    reason: lexical_alternative
lexical_decisions:
- source_word: צָמְאָה
  choice: प्यासा है
  rationale: यह क्रिया वास्तविक प्यास के ठोस काव्यात्मक रूपक को व्यक्त करती है। हिन्दी में वर्तमान अवस्था के रूप में “प्यासा है” प्रसंग में चल रही तीव्र लालसा को स्वाभाविक ढंग से प्रकट करता है।
- source_word: נַפְשִׁי
  choice: मेरा प्राण
  rationale: נפשׁ पूरे जीवित और भीतरी व्यक्ति का बोध करा सकता है। “मेरा प्राण” हिब्रू काव्य की आत्मीयता बनाए रखता है और केवल “मैं” कहकर अर्थ को सपाट नहीं करता।
- source_word: לֵאלֹהִים
  choice: परमेश्वर के लिए
  rationale: प्यास के रूपक के साथ ל उस व्यक्ति को बताता है जिसकी लालसा है; “के लिए” आधुनिक हिन्दी में इसे स्पष्ट और स्वाभाविक रखता है।
- source_word: לְאֵל חָי
  choice: जीवित परमेश्वर के लिए
  rationale: אֵל חָי निश्चित अर्थ वाला प्रचलित संबोधन है। “जीवित परमेश्वर” मृत्युहीन, सक्रिय परमेश्वर के भाव को सीधे व्यक्त करता है।
- source_word: מָתַי
  choice: कब
  rationale: प्रश्नवाचक शब्द अपेक्षित समय पूछता है। “कब” मूल अर्थ को बिना अतिरिक्त विलाप-भाव जोड़े सुरक्षित रखता है।
- source_word: אָבוֹא
  choice: मैं कब आऊँगा
  rationale: अपूर्ण क्रिया यहाँ भविष्य में अपेक्षित आगमन को प्रश्न के रूप में व्यक्त करती है; हिन्दी भविष्यकाल इसका स्वाभाविक समतुल्य है।
- source_word: וְאֵרָאֶה
  choice: और … उपस्थित होऊँगा
  rationale: मसोरेटिक स्वरांकन के अनुसार यह ראה का निफ़अल रूप है, जिसका यहाँ उपासना-संबंधी प्रसंग में अर्थ “दिखाई देना/उपस्थित होना” है। “उपस्थित होऊँगा” हिन्दी में इस आशय को स्वाभाविक रूप से देता है।
- source_word: פְּנֵי אֱלֹהִים
  choice: परमेश्वर के सामने
  rationale: शाब्दिक रूप “परमेश्वर का मुख” है, पर यह मुहावरा परमेश्वर की उपस्थिति में आने का अर्थ देता है। “परमेश्वर के सामने” उस अर्थ को स्पष्ट रखता है; शाब्दिक रूप पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: פְּנֵי אֱלֹהִים मुहावरे का अनुवाद
  choice: परमेश्वर के सामने
  alternative: परमेश्वर का मुख / परमेश्वर के मुख के सामने
  rationale: पद में सम्भवतः उपासना के लिए परमेश्वर की उपस्थिति में आने की लालसा व्यक्त है। यह अनुवाद शारीरिक रूप से परमेश्वर का मुख देखने का दावा जोड़े बिना उपस्थिति और पहुँच का भाव बचाता है, जबकि शाब्दिक चित्र पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। “मेरा प्राण” काव्यात्मक हिब्रू अभिव्यक्ति को बनाए रखता है, जबकि “उपस्थित होऊँगा” मसोरेटिक निफ़अल रूप और तीर्थ/उपासना के प्रसंग को स्पष्ट करता है।
