  yaml_path: translation/ot/psalms/042/007.yaml
  text: Deep calls to deep at the sound of your waterfalls[b][a]; all your breakers and your waves have passed over me.
translation:
  language: hi
  text: गहराई गहराई को तेरे जलप्रपातों की ध्वनि पर पुकारती है[a]; तेरी सारी टूटती लहरें और तरंगें मेरे ऊपर से गुज़र गई हैं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तेरी प्रचंड जलधाराओं की ध्वनि पर।”
    reason: צִנּוֹרֶיךָ जलप्रपातों के साथ-साथ तीव्र जलधाराओं या जलमार्गों को भी सूचित कर सकता है।
  - marker: b
    text: या, “मुझ पर उमड़कर बह गई हैं।”
    reason: עָלַי עָבָרוּ को जल के वक्ता को ढकते हुए बह जाने की अधिक गतिशील छवि के साथ भी व्यक्त किया जा सकता है।
lexical_decisions:
- source_word: תְּהוֹם ... תְּהוֹם
  choice: गहराई, गहराई
  rationale: यह चयन अथाह जल की गहराई और काव्यात्मक पुनरुक्ति—दोनों को बनाए रखता है, बिना किसी विशेष ब्रह्मांड-विज्ञान को आरोपित किए।
- source_word: קוֹרֵא
  choice: पुकारती है
  rationale: कृदंत का सजीव वर्तमानकालीन प्रभाव रखा गया है; हिन्दी में ‘गहराई’ स्त्रीलिंग होने के कारण क्रिया भी स्त्रीलिंग है।
- source_word: לְקוֹל
  choice: आवाज़ पर
  rationale: यहाँ לְ को अवसर अथवा श्रव्य पृष्ठभूमि बताने वाला मानकर सहज हिन्दी में प्रस्तुत किया गया है।
- source_word: צִנּוֹרֶיךָ
  choice: तेरे जलप्रपातों
  rationale: शब्द तीव्र बहती जलधारा, नाली या जलप्रवाह का संकेत दे सकता है; प्रसंग में ‘जलप्रपात’ प्रबल जल और उसकी ध्वनि की छवि को स्पष्ट और आधुनिक हिन्दी में व्यक्त करता है।
- source_word: מִשְׁבָּרֶיךָ
  choice: तेरी सारी टूटती लहरें
  rationale: यह समुद्र की टूटकर उठने या तट पर टूटने वाली प्रचंड लहरों को ठोस रूप में व्यक्त करता है और כָּל की समग्रता भी बनाए रखता है।
- source_word: וְגַלֶּיךָ
  choice: और तरंगें
  rationale: ‘तरंगें’ גַּל का सीधा, प्रचलित हिन्दी पर्याय है और पिछले निकटार्थक पद से कुछ भेद भी बनाए रखता है।
- source_word: עָלַי עָבָרוּ
  choice: मेरे ऊपर से गुज़र गई हैं
  rationale: यह पूर्ण हो चुकी अनुभूति और वक्ता को ढककर पार हो जाने वाले जल की छवि, दोनों को निकटता से रखता है।
