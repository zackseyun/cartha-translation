  yaml_path: translation/ot/psalms/042/003.yaml
  text: My tears have been my bread day and night[a], while they say to me all day long, “Where is your God?”
translation:
  language: hi
  text: मेरे आँसू दिन-रात मेरी रोटी रहे हैं[a], जबकि वे दिन भर मुझसे कहते हैं, “कहाँ है तुम्हारा परमेश्वर?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मेरा आँसू दिन-रात मेरी रोटी रहा है”; इब्रानी में एकवचन ‘आँसू’ सामूहिक अर्थ में प्रयुक्त हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הָיְתָה לִּי
  choice: मेरी ... बने रहे हैं
  rationale: היה + לְ की रचना यहाँ उस दशा या भूमिका को व्यक्त करती है जो आँसुओं ने वक्ता के लिए ग्रहण की है। ‘बने रहे हैं’ परिणाम और निरंतर अवस्था दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: דִמְעָתִי
  choice: मेरे आँसू
  rationale: रूप एकवचन है, पर इब्रानी में यह सामूहिक अर्थ में प्रयुक्त हो सकता है। विलाप के प्रसंग में हिन्दी बहुवचन स्वाभाविक है; शाब्दिक एकवचन को पादटिप्पणी में रखा गया है।
- source_word: לֶחֶם
  choice: रोटी
  rationale: ‘रोटी’ मूल रूपक की सजीवता बनाए रखती है; इसे सामान्यीकृत करके ‘भोजन’ कहना आवश्यक नहीं है।
- source_word: יוֹמָם וָלָיְלָה
  choice: दिन-रात
  rationale: यह निरंतर अवधि बताने वाला युग्म है। ‘दिन-रात’ संक्षिप्त, स्वाभाविक और अर्थनिष्ठ हिन्दी है।
- source_word: בֶּאֱמֹר
  choice: जबकि ... कहते हैं
  rationale: בְּ + infinitive construct साथ-साथ चल रही क्रिया दर्शाता है। ‘जबकि’ आँसू बहने और लगातार उपहास किए जाने की समकालिकता व्यक्त करता है।
- source_word: אֵלַי
  choice: मुझसे
  rationale: बोलने की दिशा बताने वाले אֶל का स्वाभाविक हिन्दी रूप यहाँ ‘मुझसे कहते हैं’ है।
- source_word: כָּל הַיּוֹם
  choice: दिन भर
  rationale: यह पूरे दिन बार-बार या लगातार होने वाली क्रिया पर बल देता है। ‘दिन भर’ आधुनिक हिन्दी में सहज है।
- source_word: אַיֵּה
  choice: कहाँ है
  rationale: सीधा प्रश्न मूल के उपहासपूर्ण बल को बिना व्याख्यात्मक विस्तार के बनाए रखता है।
- source_word: אֱלֹהֶיךָ
  choice: तुम्हारा परमेश्वर
  rationale: यह द्वितीय पुरुष पुल्लिंग एकवचन संबंधसूचक रूप है। ‘परमेश्वर’ भजनकार के आराध्य ईश्वर को स्पष्ट और गरिमापूर्ण आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: उपहास करने वालों के प्रश्न का आशय
  choice: “कहाँ है तुम्हारा परमेश्वर?” के रूप में सीधा प्रश्न
  alternative: “तुम्हारे परमेश्वर को क्या हुआ?” जैसे व्याख्यात्मक रूप में अनुवाद
  rationale: इब्रानी पाठ सीधे परमेश्वर के स्थान या प्रत्यक्ष उपस्थिति पर प्रश्न करता है। सीधा अनुवाद परमेश्वर की दिखाई न देने वाली सहायता से उत्पन्न धार्मिक तनाव को बनाए रखता है और उसका समाधान पाठ में नहीं जोड़ता।
