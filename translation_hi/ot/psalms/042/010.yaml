  yaml_path: translation/ot/psalms/042/010.yaml
  text: As with a shattering in my bones[a], my adversaries taunt me, saying to me all day long, “Where is your God?”
translation:
  language: hi
  text: 'मानो मेरी हड्डियाँ चूर कर दी गई हों[a],


    मेरे विरोधी मुझे ताना मारते हैं;

    वे दिन भर मुझसे कहते हैं,


    “तेरा परमेश्वर कहाँ है?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मानो मेरी हड्डियों में घातक चोट लगी हो, मेरे विरोधी मुझे धिक्कारते हैं।” हिब्रू बिंब कठिन है; इसका अर्थ या तो प्राणघातक चोट, या भीतर तक चूर कर देने वाली पीड़ा हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרֶצַח
  choice: मानो … चूर हो रही हों
  rationale: רֶצַח सामान्यतः हत्या या घातक प्रहार को दर्शाता है, पर ‘मेरी हड्डियों में’ के साथ यह गहरी, विनाशकारी पीड़ा का कठिन काव्यात्मक बिंब है। यह अनुवाद उसकी हिंसक तीव्रता को स्वाभाविक हिन्दी में व्यक्त करता है; शाब्दिक विकल्प पाद-टिप्पणी में रखा गया है।
- source_word: בְּעַצְמוֹתַי
  choice: मेरी हड्डियाँ
  rationale: हिब्रू का शारीरिक बिंब बनाए रखते हुए भीतर तक पहुँचने वाली पीड़ा व्यक्त की गई है।
- source_word: חֵרְפוּנִי
  choice: मुझे ताना मारते
  rationale: क्रिया अपमान, निंदा और उपहास का भाव रखती है। अगले प्रत्यक्ष प्रश्न के संदर्भ में ‘ताना मारना’ सहज और सटीक है।
- source_word: צוֹרְרָי
  choice: मेरे विरोधी
  rationale: यह रूप भजनकार के प्रति शत्रुता रखने वालों को दर्शाता है। ‘विरोधी’ अर्थ को स्पष्ट रखता है और अनावश्यक विस्तार नहीं करता।
- source_word: בְּאָמְרָם אֵלַי
  choice: कहते हैं
  rationale: हिन्दी में ‘मुझे ताना मारते हुए कहते हैं’ कथन की दिशा और परिस्थिति दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: כָּל הַיּוֹם
  choice: दिन भर
  rationale: यह हिब्रू मुहावरे की निरंतरता और बार-बार होने का भाव संक्षेप में व्यक्त करता है।
- source_word: אַיֵּה אֱלֹהֶיךָ
  choice: तेरा परमेश्वर कहाँ है?
  rationale: सीधी चुनौती और उसके व्यंग्यपूर्ण आघात को बिना किसी व्याख्यात्मक वृद्धि के सुरक्षित रखा गया है। एकवचन सम्बोधन के अनुरूप ‘तेरा’ रखा गया है।
theological_decisions:
- issue: विरोधियों द्वारा परमेश्वर की उपस्थिति या सहायता को चुनौती
  choice: तेरा परमेश्वर कहाँ है?
  alternative: आखिर तेरा परमेश्वर कहाँ है?
  rationale: सरल प्रश्न मूल पाठ की शत्रुतापूर्ण चुनौती को बनाए रखता है, पर परमेश्वर की कथित अनुपस्थिति की कोई धर्मवैज्ञानिक व्याख्या जोड़कर विलाप के तनाव को हल नहीं करता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और काव्यात्मक हिन्दी। पंक्ति-विन्यास भजन की समानांतरता को उभारता है। विरोधियों के उद्धरण में एकवचन ‘तेरा’ मूल हिब्रू के सम्बोधन से मेल खाता है।
