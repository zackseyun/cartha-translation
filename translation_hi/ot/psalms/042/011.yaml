  text: מַה תִּשְׁתּ֬וֹחֲחִ֨י נַפְשִׁ/י֮ וּֽ/מַה תֶּהֱמִ֪י עָ֫לָ֥/י הוֹחִ֣ילִי לֵֽ֭/אלֹהִים כִּי ע֣וֹד אוֹדֶ֑/נּוּ יְשׁוּעֹ֥ת פָּ֝נַ֗/י וֵֽ/אלֹהָֽ/י־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/042/011.yaml
  text: Why are you cast down[a], my soul, and why are you in turmoil within me? Hope in God, for I will yet praise him[b], the salvation of my countenance and my God.
translation:
  language: hi
  text: हे मेरे प्राण, तू क्यों उदास है और मेरे भीतर क्यों व्याकुल है? परमेश्वर पर आशा रख, क्योंकि मैं फिर उसकी स्तुति करूँगा—वही मेरे मुख का उद्धार[a] और मेरा परमेश्वर है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “मेरे मुख के उद्धार”; अर्थात् वह जो मेरे उदास मुख को फिर उठाता है। इसका अनुवाद “मेरे मुख की सहायता” भी किया गया है।
    reason: इब्रानी יְשׁוּעֹת פָּנַי की सघन अभिव्यक्ति और उसके सम्भव मुहावरेदार अर्थ को स्पष्ट करना।
lexical_decisions:
- source_word: תִּשְׁתּוֹחֲחִי
  choice: तू क्यों उदास है
  rationale: क्रिया का मूल चित्र नीचे झुकने या दब जाने का है; आत्म-संबोधन के इस प्रसंग में ‘उदास’ आधुनिक हिन्दी में उस भीतरी हताशा को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: נַפְשִׁי
  choice: हे मेरे प्राण
  rationale: यहाँ נֶפֶשׁ कवि के भीतरी व्यक्तित्व का आत्म-संबोधन है। ‘मेरे प्राण’ काव्यात्मक गरिमा और आत्मीयता बनाए रखता है।
- source_word: תֶּהֱמִי עָלָי
  choice: मेरे भीतर क्यों व्याकुल है
  rationale: क्रिया उथल-पुथल, अशांति या कोलाहल व्यक्त करती है; עָלַי का शाब्दिक अर्थ ‘मुझ पर’ है, पर इस आत्म-संबोधन में ‘मेरे भीतर’ स्वाभाविक हिन्दी में भाव स्पष्ट करता है।
- source_word: הוֹחִילִי לֵאלֹהִים
  choice: परमेश्वर पर आशा रख
  rationale: יחל की हिफ़ील क्रिया आशाभरी प्रतीक्षा का भाव रखती है। ‘आशा रख’ भरोसे और भविष्य की अपेक्षा को संक्षेप में व्यक्त करता है।
- source_word: עוֹד אוֹדֶנּוּ
  choice: मैं फिर उसकी स्तुति करूँगा
  rationale: עוֹד वर्तमान संकट के बाद भविष्य में पुनः स्तुति करने का विश्वास व्यक्त करता है; ידה यहाँ आराधनात्मक स्तुति है।
- source_word: יְשׁוּעֹת פָּנַי
  choice: मेरे मुख का उद्धार
  rationale: इब्रानी की सघन और असामान्य अभिव्यक्ति को जानबूझकर निकट रूप में रखा गया है, ताकि मुख के उदास होने और परमेश्वर द्वारा उसे फिर उठाए जाने का काव्यात्मक संबंध बना रहे।
- source_word: וֵאלֹהָי
  choice: और मेरा परमेश्वर
  rationale: संयोजक וְ को सामान्य योगसूचक अर्थ में रखते हुए पद के अंतिम व्यक्तिगत विश्वास को सुरक्षित रखा गया है।
theological_decisions:
- issue: יְשׁוּעֹת פָּנַי का अर्थ और वाक्य-संबंध
  choice: वही मेरे मुख का उद्धार और मेरा परमेश्वर है
  alternative: वही मेरे मुख को उबारनेवाला और मेरा परमेश्वर है; वही मेरे मुख की सहायता और मेरा परमेश्वर है
  rationale: मसोरेटिक पाठ इस वाक्यांश को परमेश्वर के वर्णन से जोड़ता है, पर ‘मुख का उद्धार’ एक सघन इब्रानी मुहावरा है। मुख्य पाठ मूल बिंब और उसकी व्याख्यात्मक खुली जगह को बनाए रखता है; अधिक स्पष्ट अर्थ फुटनोट में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में काव्यात्मक और गरिमापूर्ण आत्म-संबोधन रखा गया है। ‘हे मेरे प्राण’ भजन की अंतर्मुखी शैली बनाए रखता है, जबकि शेष वाक्य सामान्य पाठक के लिए सहज है।
