base_translation:
  language: en
  yaml_path: translation/ot/psalms/042/008.yaml
  text: By day Yahweh commands his steadfast love[b][a], and at night his song is with me— a prayer to the God of my life.
translation:
  language: hi
  text: 'दिन में यहोवा अपने अटल प्रेम की आज्ञा देता है,


    और रात में उसका गीत[a] मेरे साथ रहता है—


    मेरे जीवन के परमेश्वर से एक प्रार्थना।[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसके लिए एक गीत मेरे साथ रहता है।” यदि שירה को प्रत्यय के बिना पढ़ा जाए, तो यह अर्थ सम्भव है; मुख्य पाठ इसे “उसका गीत” मानता है।
    reason: alternative_reading
  - marker: b
    text: या, “उस परमेश्वर से जो मुझे जीवन देता है।” हिब्रू का अधिक शाब्दिक अर्थ है, “मेरे जीवन के परमेश्वर।”
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹמָם
  choice: दिन में
  rationale: समयवाचक क्रियाविशेषण के रूप में संक्षिप्त और स्वाभाविक है तथा ‘रात में’ के समानांतर है।
- source_word: יְצַוֶּה
  choice: आज्ञा देता है
  rationale: 'पिएल रूप की प्रबल और सजीव क्रिया को बनाए रखता है: यहोवा अपनी करुणा को मानो सक्रिय रूप से भेजने की आज्ञा देता है।'
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिब्रू चतुरक्षरीय व्यक्तिगत नाम को उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण द्वारा प्रस्तुत करता है।
- source_word: חַסְדּוֹ
  choice: अपनी अटल करुणा
  rationale: חסד में निष्ठावान, स्थायी प्रेम और दया दोनों के भाव हैं; ‘अटल करुणा’ इन्हें संक्षेप में व्यक्त करती है।
- source_word: וּבַלַּיְלָה
  choice: और रात में
  rationale: दिन और रात के समयगत समानांतर को स्पष्ट रखता है; वाव को सामान्य संयोजक ‘और’ से प्रस्तुत किया गया है।
- source_word: שירה
  choice: उसका गीत
  rationale: मुख्य पाठ प्रत्ययात्मक अर्थ ग्रहण करता है—गीत परमेश्वर का है; पाठरूप के कारण दूसरी सम्भावना पादटिप्पणी में दी गई है।
- source_word: עִמִּי
  choice: मेरे साथ रहता है
  rationale: हिब्रू में निहित अस्तित्ववाचक क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है और रात भर साथ रहने का भाव देता है।
- source_word: תְּפִלָּה
  choice: मेरी प्रार्थना
  rationale: यह पूर्ववर्ती गीत की व्याख्या या समानाधिकरण के रूप में समझा गया है; हिन्दी में वक्ता-संबंध स्पष्ट करने के लिए ‘मेरी’ स्वाभाविक है।
- source_word: לְאֵל
  choice: परमेश्वर से
  rationale: प्रार्थना के सम्बोधन को स्वाभाविक हिन्दी में ‘परमेश्वर से प्रार्थना’ द्वारा व्यक्त किया गया है।
- source_word: חַיָּי
  choice: मेरे जीवन के
  rationale: प्रथम पुरुष प्रत्यययुक्त संज्ञा का शाब्दिक संबंध सुरक्षित रखता है और इसे ‘जीवित परमेश्वर’ से नहीं मिलाता।
theological_decisions:
- issue: יְהוָה दिव्य नाम का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ व्यक्तिगत दिव्य नाम का प्रयोग करता है; हिन्दी में परिचित ‘यहोवा’ उस नाम को उपाधि से प्रतिस्थापित नहीं करता।
- issue: לְאֵל חַיָּי का अर्थ
  choice: मेरे जीवन के परमेश्वर
  alternative: मुझे जीवन देने वाले परमेश्वर
  rationale: मुख्य पाठ हिब्रू के संबंधवाचक प्रयोग और उसकी अर्थगत खुलावट को बनाए रखता है; जीवनदाता का अर्थ सम्भव व्याख्या है, इसलिए पादटिप्पणी में है।
- issue: שירה का पाठगत अर्थ
  choice: उसका गीत
  alternative: उसके लिए एक गीत
  rationale: मुख्य पाठ इसे तृतीय पुरुष एकवचन प्रत्यययुक्त रूप मानता है, पर व्यंजनात्मक पाठ को बिना प्रत्यय समझने की सम्भावना को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में काव्यात्मक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट शैली। ‘अटल करुणा’ חסד के स्थायी प्रेम और दया के संयुक्त भाव को रखती है। पंक्ति-विन्यास हिब्रू के दिन/रात समानांतर और अंतिम समानाधिकरण को उभारता है।
