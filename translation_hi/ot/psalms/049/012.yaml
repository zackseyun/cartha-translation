  yaml_path: translation/ot/psalms/049/012.yaml
  text: But man in honor does not remain[c][b][a]; he is like the beasts that perish.
translation:
  language: hi
  text: पर मनुष्य सम्मान की दशा में बना नहीं रहता[a]; वह नाश होने वाले पशुओं के समान है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “रात नहीं बिताता” या “ठहरता नहीं।” भाव यह है कि मनुष्य सम्मान या प्रतिष्ठा की दशा में स्थायी नहीं रहता।
    reason: lexical_alternative
  - marker: b
    text: या, “नष्ट किए जाने वाले पशुओं के समान।” अंतिम इब्रानी क्रिया को परंपरागत रूप से यहाँ नाश होने के अर्थ में समझा जाता है।
    reason: alternative_reading
lexical_decisions:
- source_word: אָדָם
  choice: मनुष्य
  rationale: यहाँ एकवचन प्रतिनिधिक रूप से मानवजाति को दर्शाता है; ‘मनुष्य’ आधुनिक हिन्दी में दोनों अर्थों को स्वाभाविक रूप से समेटता है।
- source_word: בִּיקָר
  choice: अपने वैभव में
  rationale: יָקָר सम्मान, प्रतिष्ठा, मूल्य या वैभव का बोध करा सकता है। प्रसंग में मनुष्य की ऊँची सांसारिक स्थिति और समृद्धि दोनों की छाया है, इसलिए ‘वैभव’ उपयुक्त है।
- source_word: בַּל יָלִין
  choice: टिका नहीं रहता
  rationale: क्रिया का शाब्दिक अर्थ ‘रात बिताना/ठहरना’ है, पर यहाँ किसी सम्मानित दशा में स्थायी न रहने का भाव है।
- source_word: נִמְשַׁל
  choice: के समान है
  rationale: निफ़अल रूप यहाँ तुलना व्यक्त करता है; यह हिन्दी में सीधा और स्वाभाविक रूप है।
- source_word: כַּבְּהֵמוֹת
  choice: पशुओं
  rationale: בְּהֵמוֹת सामान्यतः पशुओं को सूचित करता है; ‘पशु’ वर्तमान हिन्दी में स्पष्ट और गरिमापूर्ण है।
- source_word: נִדְמוּ
  choice: नाश होनेवाले
  rationale: इस पद में पारंपरिक और प्रसंगानुकूल अर्थ ‘नष्ट होना/मर जाना’ है; यह मनुष्य और पशु की समान नश्वरता व्यक्त करता है।
theological_decisions:
- issue: सम्मानित मनुष्य और पशुओं की तुलना
  choice: तुलना को उनकी साझा नश्वरता के रूप में खुला रखा गया है
  alternative: इसे मनुष्य के नैतिक पतन या केवल धन के खोने के रूप में स्पष्ट करना
  rationale: इब्रानी पंक्ति स्वयं तुलना का आधार विस्तार से नहीं बताती; निकट प्रसंग मृत्यु और सांसारिक वैभव की अस्थिरता पर बल देता है, इसलिए अतिरिक्त धर्मवैज्ञानिक निष्कर्ष नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; काव्यात्मक गरिमा बनाए रखते हुए सरल शब्दावली। ‘मनुष्य’ प्रतिनिधिक एकवचन है। ‘होनेवाले’ को प्रचलित संयुक्त वर्तनी में रखा गया है।
