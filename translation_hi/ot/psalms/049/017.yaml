base_translation:
  language: en
  yaml_path: translation/ot/psalms/049/017.yaml
  text: For at his death he will take nothing[c][b][a]; his glory will not go down after him.
translation:
  language: hi
  text: क्योंकि जब वह मरेगा, तब अपने साथ कुछ भी नहीं ले जाएगा[a]; उसका वैभव उसके पीछे नहीं उतरेगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “वह सब कुछ नहीं ले जाएगा”; अर्थ यह भी हो सकता है, “वह उसमें से कुछ भी नहीं ले जाएगा।”
    reason: lexical_alternative
  - marker: b
    text: “वैभव” का अर्थ उसकी महिमा, प्रतिष्ठा, ठाट-बाट या धन-दौलत भी हो सकता है। “नहीं उतरेगा” मृत्यु, कब्र या अधोलोक की ओर संकेत कर सकता है, पर इब्रानी में गन्तव्य स्पष्ट नहीं किया गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण या स्पष्टीकरण प्रस्तुत करता है और भजन के तर्कपूर्ण प्रवाह में स्वाभाविक है।
- source_word: בְמוֹתוֹ
  choice: जब वह मरेगा
  rationale: בְ यहाँ कालवाचक है; यह आधुनिक हिन्दी में स्वाभाविक ढंग से मृत्यु के समय को व्यक्त करता है।
- source_word: יִקַּח הַכֹּל
  choice: अपने साथ कुछ भी नहीं ले जाएगा
  rationale: शाब्दिक रचना ‘सब कुछ नहीं लेगा’ है, पर निषेध के साथ सन्दर्भगत अर्थ है कि वह उसमें से कुछ भी साथ नहीं ले जाएगा। ‘अपने साथ’ मृत्यु-सन्दर्भ में निहित भाव को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: יֵרֵד אַחֲרָיו
  choice: उसके पीछे नीचे नहीं उतरेगा
  rationale: ‘नीचे उतरना’ मूल ठोस बिंब को बनाए रखता है और गन्तव्य को अनिर्दिष्ट छोड़ता है; ‘उसके पीछे’ אַחֲרָיו के अनुगमन-बोध को व्यक्त करता है।
- source_word: כְּבוֹדוֹ
  choice: उसका वैभव
  rationale: כבוד यहाँ महिमा, सम्मान, ठाट-बाट, धन या सामाजिक प्रतिष्ठा को समेट सकता है। ‘वैभव’ सांसारिक सम्पन्नता और प्रतिष्ठा दोनों को स्वाभाविक हिन्दी में पर्याप्त व्यापकता से व्यक्त करता है।
theological_decisions:
- issue: मृत्यु के बाद नीचे उतरने का संकेत
  choice: मुख्य पाठ में ‘नीचे नहीं उतरेगा’ रखकर गन्तव्य को अनिर्दिष्ट छोड़ा गया है।
  alternative: उसका वैभव उसके साथ अधोलोक में नहीं उतरेगा / कब्र तक उसके पीछे नहीं जाएगा
  rationale: इब्रानी क्रिया मृत्यु, कब्र या अधोलोक की ओर संकेत कर सकती है, पर गन्तव्य स्पष्ट नहीं करती। इसलिए किसी एक विशिष्ट व्याख्या को मुख्य पाठ में आरोपित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में काव्यात्मक गरिमा और सहज बोध का संतुलन रखा गया है। ‘वैभव’ को अर्थ-व्याप्ति बनाए रखने के लिए चुना गया है और ‘नीचे उतरना’ मूल इब्रानी बिंब को सुरक्षित रखता है।
