  text: אַל תִּ֭ירָא כִּֽי יַעֲשִׁ֣ר אִ֑ישׁ כִּֽי יִ֝רְבֶּה כְּב֣וֹד בֵּיתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/049/016.yaml
  text: Do not fear when a man becomes rich[a], when the glory of his house increases;
translation:
  language: hi
  text: 'जब कोई मनुष्य धनी हो जाए,

    जब उसके घर[a] का वैभव बढ़े, तो मत डर।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘घराने’ अथवा ‘संपत्ति’; इब्रानी में ‘घर’ परिवार और उससे जुड़ी संपदा को भी दर्शा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּירָא
  choice: मत डर
  rationale: אַל के साथ अपूर्ण क्रिया निषेध व्यक्त करती है। ‘मत डर’ संक्षिप्त, स्वाभाविक और काव्यात्मक हिन्दी है।
- source_word: כִּי
  choice: जब
  rationale: दोनों स्थानों पर כִּי उस परिस्थिति का परिचय देता है जिससे डरना नहीं चाहिए; इसलिए कारणसूचक ‘क्योंकि’ के बजाय ‘जब’ उपयुक्त है।
- source_word: יַעֲשִׁר
  choice: धनी हो जाए
  rationale: עשר के हिफ़ील रूप का यहाँ अकर्मक अर्थ ‘धनी होना’ है। ‘धनी हो जाए’ आधुनिक हिन्दी में सहज है और परिस्थिति के घटित होने का भाव देता है।
- source_word: אִישׁ
  choice: कोई मनुष्य
  rationale: אִישׁ के पुल्लिंग एकवचन और नीतिवचन-सदृश सामान्य प्रयोग को बनाए रखते हुए ‘कोई मनुष्य’ स्वाभाविक हिन्दी देता है।
- source_word: יִרְבֶּה
  choice: बढ़े
  rationale: רבה का मूल अर्थ बढ़ना या बहुत होना है; כְּבוֹד के साथ ‘बढ़े’ स्पष्ट और मुहावरेदार है।
- source_word: כְּבוֹד
  choice: वैभव
  rationale: इस समृद्धि-संबंधी प्रसंग में כְּבוֹד प्रतिष्ठा, ठाट-बाट और संपन्नता की दृश्यमान गरिमा को सूचित कर सकता है। ‘वैभव’ इस व्यापक भाव को रखता है, जबकि इसे केवल धन तक सीमित नहीं करता।
- source_word: בֵּיתוֹ
  choice: उसके घर
  rationale: בַּיִת का मूल चित्र ‘घर’ है, पर इसका अर्थ परिवार, घराना या संपत्ति भी हो सकता है। मुख्य पाठ में ‘घर’ स्रोत की छवि बचाता है और पादटिप्पणी व्यापक अर्थ बताती है।
