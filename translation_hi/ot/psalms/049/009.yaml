  yaml_path: translation/ot/psalms/049/009.yaml
  text: that he should still live on forever and not see the Pit[a].
translation:
  language: hi
  text: कि वह सदा जीवित रहे और गर्त[a] को न देखे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘कब्र’ अथवा ‘सड़न’।
    reason: lexical_alternative
lexical_decisions:
- source_word: וִיחִי
  choice: कि वह ... जीवित रहे
  rationale: यह रूप पिछले पद के विचार को आगे बढ़ाते हुए अभिप्रेत अथवा असंभव परिणाम बताता है; ‘कि वह ... जीवित रहे’ हिंदी में इसकी विध्यर्थक छाया को स्वाभाविक रूप से व्यक्त करता है।
- source_word: עוֹד
  choice: जीवित रहे
  rationale: यहाँ शब्द निरंतर जीवित रहने का भाव जोड़ता है। हिंदी में ‘सदा जीवित रहे’ के भीतर यह निरंतरता स्वाभाविक रूप से समाहित है; अलग से ‘अब भी’ कहने पर अर्थ असहज हो सकता है।
- source_word: לָנֶצַח
  choice: सदा
  rationale: ल उपसर्ग के साथ נצח अनंत काल तक बने रहने का भाव देता है; ‘सदा’ संक्षिप्त, वर्तमान और काव्यात्मक हिंदी है।
- source_word: לֹא
  choice: न
  rationale: यह अगले क्रियापद का सीधा निषेध है।
- source_word: יִרְאֶה
  choice: देखे
  rationale: ‘देखना’ मूल इब्रानी मुहावरे को बनाए रखता है, जबकि संदर्भ में मृत्यु का अनुभव करना भी निहित हो सकता है।
- source_word: הַשָּׁחַת
  choice: गर्त
  rationale: ‘गर्त’ मृत्यु के गहरे गड्ढे की ठोस काव्यात्मक छवि को बनाए रखता है और अर्थ को केवल कब्र या केवल शारीरिक सड़न तक सीमित नहीं करता।
theological_decisions:
- issue: मृत्यु के संदर्भ में שחת का अर्थ
  choice: गर्त
  alternative: कब्र; सड़न
  rationale: ‘गर्त’ मृत्यु, विनाश और नीचे उतरने की व्यापक काव्यात्मक छवि को सुरक्षित रखता है। ‘कब्र’ और ‘सड़न’ जैसी प्रामाणिक वैकल्पिक व्याख्याएँ पादटिप्पणी में दी गई हैं, ताकि मूल की अर्थगत व्यापकता को चुपचाप सीमित न किया जाए।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। पद पिछले कथन पर निर्भर उपवाक्य है, इसलिए आरंभ में ‘कि’ रखा गया है। ‘गर्त’ सामान्य बोलचाल के ‘गड्ढे’ से अधिक काव्यात्मक है, फिर भी आधुनिक पाठक के लिए बोधगम्य है।
