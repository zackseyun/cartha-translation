  text: כַּ/צֹּ֤אן לִֽ/שְׁא֣וֹל שַׁתּוּ֮ מָ֤וֶת יִ֫רְעֵ֥/ם וַ/יִּרְדּ֘וּ בָ֤/ם יְשָׁרִ֨ים לַ/בֹּ֗קֶר ו/ציר/ם לְ/בַלּ֥וֹת שְׁא֗וֹל מִ/זְּבֻ֥ל לֽ/וֹ׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/049/014.yaml
  text: Like sheep they are appointed for Sheol[a]; death will shepherd them, and the upright will rule over them in the morning. Their form will waste away in Sheol[d][c][b], far from its lofty dwelling.
translation:
  language: hi
  text: भेड़ों की तरह वे अधोलोक[a] के लिए नियत किए गए हैं; मृत्यु उनकी चरवाही करेगी, और सीधे-सच्चे लोग भोर में उन पर प्रभुता करेंगे। उनका रूप अधोलोक में क्षीण होता जाएगा[b][c], अपने ऊँचे निवास से दूर।[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘अधोलोक’ मृतकों का लोक है; इसका अर्थ केवल ‘कब्र’ से व्यापक है।
    reason: cultural_note
  - marker: b
    text: या, “उनकी चट्टान/उनका बल नष्ट हो जाएगा।” इस पद का इब्रानी पाठ कठिन है; “उनका रूप” प्रसंग पर आधारित अनुवाद है।
    reason: lexical_alternative
  - marker: c
    text: ‘अधोलोक’ मृतकों का लोक है; इसका अर्थ केवल ‘कब्र’ से व्यापक है।
    reason: cultural_note
  - marker: d
    text: अंतिम इब्रानी वाक्यांश कठिन है। एक अन्य संभव अर्थ है, “अधोलोक उनके रूप को उनके ऊँचे निवास से नष्ट कर देगा,” या इससे मिलता-जुलता अर्थ।
    reason: alternative_reading
lexical_decisions:
- source_word: כַּצֹּאן
  choice: भेड़ों के समान
  rationale: सामूहिक पशु-झुंड की उपमा को स्वाभाविक हिन्दी में रखता है और उनकी असहाय दशा का चित्र सुरक्षित रखता है।
- source_word: לִשְׁאוֹל שַׁתּוּ
  choice: अधोलोक के लिए ठहराए गए हैं
  rationale: שַׁתּוּ का मूल भाव ‘रखे/ठहराए गए’ है और ל गंतव्य सूचित करता है; यह अनिवार्य गंतव्य का भाव देता है, पर उससे अधिक सिद्धान्तगत अर्थ नहीं जोड़ता।
- source_word: מָוֶת יִרְעֵם
  choice: मृत्यु उनकी चरवाही करेगी
  rationale: רעה के चराने अथवा चरवाही करने के अर्थ को सीधे रखकर भेड़ों की उपमा और मृत्यु के विडंबनापूर्ण मानवीकरण को सुरक्षित रखा गया है।
- source_word: וַיִּרְדּוּ בָם יְשָׁרִים
  choice: सीधे लोग उन पर प्रभुता करेंगे
  rationale: יְשָׁרִים का शाब्दिक भाव ‘सीधे/खरे लोग’ है; רדה का यहाँ स्वाभाविक अर्थ प्रभुता करना है।
- source_word: לַבֹּקֶר
  choice: भोर को
  rationale: संक्षिप्त काल-सूचक अभिव्यक्ति मूल की संभावित प्रतीकात्मकता को बिना समझाए खुला छोड़ती है।
- source_word: וְצוּרָם
  choice: उनका रूप
  rationale: व्यंजन-पाठ कठिन है; प्रसंग में ‘रूप/आकृति’ अगले क्षय-सूचक क्रियापद के साथ सुसंगत है। ‘चट्टान/बल’ की संभावना पादटिप्पणी में रखी गई है।
- source_word: לְבַלּוֹת
  choice: गल जाएगा
  rationale: בלה के घिसने, क्षीण होने या नष्ट होने के भाव को सहज हिन्दी में व्यक्त करता है।
- source_word: שְׁאוֹל
  choice: अधोलोक
  rationale: हिन्दी पाठक के लिए मृतकों के लोक का अर्थ देता है और इसे केवल भौतिक कब्र तक सीमित नहीं करता।
- source_word: מִזְּבֻל לוֹ
  choice: अपने ऊँचे निवास से दूर
  rationale: दुर्बोध वाक्यांश को זְבֻל के ‘ऊँचे निवास’ अर्थ के अनुसार प्रस्तुत किया गया है; अनिश्चितता पादटिप्पणी में स्पष्ट है।
theological_decisions:
- issue: שְׁאוֹל का अनुवाद
  choice: अधोलोक
  alternative: कब्र; मृतकों का लोक; शिओल
  rationale: ‘कब्र’ अर्थ को अनावश्यक रूप से संकीर्ण कर देती है। ‘अधोलोक’ हिन्दी में मृतकों के लोक का व्यापक भाव देता है, जबकि इसे अंतिम दण्ड-स्थान के किसी बाद के सिद्धान्त के साथ नहीं मिलाता।
- issue: भोर का आशय
  choice: भोर को
  alternative: पुनरुत्थान के समय; न्याय के दिन
  rationale: मूल केवल काल-सूचक पद देता है। किसी विशिष्ट युगान्त-सिद्धान्त को पाठ में जोड़ने के बजाय उसके काव्यात्मक और धर्मवैचारिक तनाव को खुला रखा गया है।
- issue: सीधे लोगों की प्रभुता
  choice: उन पर प्रभुता करेंगे
  alternative: उन्हें रौंदेंगे
  rationale: क्रिया का शासन/प्रभुता वाला अर्थ अधिक संभावित है, किंतु पद को बाद के संत-राज्य संबंधी किसी विशिष्ट मत में नहीं बाँधा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, काव्यात्मक किंतु सामान्य पाठक के लिए बोधगम्य रूप। ‘चरवाही करेगी’ मूल की विस्तारित भेड़-उपमा को बनाए रखता है। ‘सीधे लोग’ יְשָׁרִים के निकट है, यद्यपि ‘खरे लोग’ अधिक बोलचाल का विकल्प हो सकता है। सभी पाठगत कठिनाइयाँ मुख्य पाठ में सुलझाकर छिपाने के बजाय पादटिप्पणियों में दर्ज की गई हैं।
