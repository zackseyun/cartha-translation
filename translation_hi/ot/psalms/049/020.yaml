source:
  edition: WLC
  text: אָדָ֣ם בִּ֭/יקָר וְ/לֹ֣א יָבִ֑ין נִמְשַׁ֖ל כַּ/בְּהֵמ֣וֹת נִדְמֽוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/049/020.yaml
  text: Man in honor[a], yet without understanding, is like the beasts that perish.
translation:
  language: hi
  text: 'मनुष्य प्रतिष्ठा में होकर भी समझ नहीं रखता,

    तो वह नाश होने वाले पशुओं के समान है।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह पशुओं के समान है; वे मनुष्यों के समान हैं।” अंतिम इब्रानी क्रिया को “नाश होते हैं” के बजाय “समान हैं” भी समझा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: אָדָם
  choice: मनुष्य
  rationale: एकवचन संज्ञा यहाँ नीतिवचन-सदृश सामान्य अर्थ में मानव व्यक्ति को दर्शाती है; ‘मनुष्य’ आधुनिक हिन्दी में स्वाभाविक और गरिमापूर्ण है।
- source_word: בִּיקָר
  choice: वैभव में
  rationale: संज्ञा יְקָר यहाँ सम्मान, प्रतिष्ठा और संपन्न अवस्था का बोध करा सकती है। भजन के धन और सामाजिक ऊँचाई के प्रसंग में ‘वैभव’ इस अर्थ-परास को संक्षेप में व्यक्त करता है।
- source_word: וְלֹא יָבִין
  choice: रहकर भी यदि समझ नहीं रखता
  rationale: בין का अर्थ समझना या विवेक रखना है। ‘भी’ सम्मानित अवस्था और समझ के अभाव का विरोध स्पष्ट करता है; हिन्दी वाक्य की स्वाभाविकता के लिए शर्तसूचक ‘यदि’ लगाया गया है, जो कथन के नीतिवचनात्मक आशय को व्यक्त करता है।
- source_word: נִמְשַׁל
  choice: के समान है
  rationale: משל का निफ़अल रूप तुलना किए जाने या समान होने को व्यक्त करता है; ‘के समान है’ काव्यात्मक और स्पष्ट हिन्दी है।
- source_word: כַּבְּהֵמוֹת
  choice: पशुओं के
  rationale: בְּהֵמוֹת यहाँ केवल पालतू मवेशियों के बजाय सामान्यतः पशुओं को सूचित करता है; ‘पशु’ आधुनिक हिन्दी में व्यापक और उपयुक्त है।
- source_word: נִדְמוּ
  choice: नाश होनेवाले
  rationale: इस प्रसंग और भजन के मृत्यु-विषयक बल के अनुसार क्रिया को ‘नाश होना’ समझा गया है। रूप की वैकल्पिक व्याख्या ‘समान हो जाना/उन जैसा होना’ पादटिप्पणी में सुरक्षित रखी गई है।
theological_decisions:
- issue: अंतिम क्रिया נִדְמוּ का अर्थ
  choice: ‘नाश होनेवाले’—क्रिया को पशुओं के नाश होने के अर्थ में लिया गया है।
  alternative: ‘वह पशुओं के समान है; वे उन्हीं के समान हो गए हैं’ अथवा ‘वह पशुओं जैसा हो गया है।’
  rationale: पूरा भजन इस बात पर बल देता है कि मानवीय वैभव मृत्यु को नहीं रोकता, और यही पंक्ति पद 13 के लगभग समान कथन को दोहराती है। फिर भी इस रूप को ‘समान होना’ से जोड़ना संभव है, इसलिए अर्थगत तनाव को पादटिप्पणी में बनाए रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल किंतु काव्यात्मक और गरिमापूर्ण शैली। दो पंक्तियों में कारणात्मक तुलना स्वाभाविक बनाई गई है। पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित है।
