lexical_decisions:
- source_word: שִׁמְעוּ
  choice: सुनो
  rationale: बहुवचन आज्ञार्थक रूप है और ध्यानपूर्वक सुनने के सीधे, काव्यात्मक आह्वान को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: זֹאת
  choice: यह
  rationale: यह संकेतवाचक शब्द भजनकार की आगे आने वाली शिक्षा या घोषणा की ओर संकेत करता है।
- source_word: כָּל הָעַמִּים
  choice: सब जाति-जाति के लोगो
  rationale: עַמִּים अनेक मानव-समुदायों को दर्शाता है। यह प्रयोग विश्वव्यापी संबोधन को बनाए रखता है और आधुनिक राजनीतिक ‘राष्ट्रों’ तक अर्थ को सीमित नहीं करता।
- source_word: הַאֲזִינוּ
  choice: ध्यान दो
  rationale: यह ध्यान लगाकर सुनने का आज्ञार्थक आह्वान है। ‘ध्यान दो’ पहले पद के ‘सुनो’ के साथ अर्थपूर्ण काव्यात्मक समानांतरता रखता है और आधुनिक हिन्दी में सहज है।
- source_word: כָּל יֹשְׁבֵי
  choice: सब निवासियो
  rationale: सहभागी रूप किसी स्थान में रहने वाले सभी लोगों को संबोधित करता है; सम्बोधन ‘निवासियो’ मूल की सार्वभौमिक पुकार को स्पष्ट रखता है।
- source_word: חָלֶד
  choice: संसार
  rationale: इस प्रसंग में यह मानव-जीवन के बसे हुए संसार या पार्थिव क्षेत्र को सूचित करता है। ‘संसार’ सार्वभौमिक संबोधन के लिए स्वाभाविक है, जबकि ‘पृथ्वी’ संभावित वैकल्पिक अर्थ है।
