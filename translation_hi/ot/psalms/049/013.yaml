  text: This is their way—their folly[a]; yet after them, people approve their words[b]. Selah
translation:
  language: hi
  text: यही उनकी राह है—उनकी मूर्खता[a]; फिर भी उनके बाद आनेवाले उनकी बातों को पसंद करते हैं[b]। सेला
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘मूर्खता’ के लिए इब्रानी शब्द का अर्थ कुछ संदर्भों में ‘भरोसा’ या ‘आत्मविश्वास’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “उनके मुँह में”; अर्थात उनकी बातों या कथनों में। “उनके बाद आनेवाले” उनके अनुयायी या उनके वंशज भी हो सकते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: זֶה דַרְכָּם
  choice: यही उनकी राह है
  rationale: निर्देशक सर्वनाम और ‘राह’ के रूपक को बनाए रखते हुए हिन्दी में स्वाभाविक विधेय जोड़ा गया है। ‘राह’ यहाँ जीवन-चाल और आचरण दोनों का संकेत देती है।
- source_word: כֵּסֶל לָמוֹ
  choice: उनकी मूर्खता
  rationale: כֵּסֶל का सामान्य मूल्यांकनात्मक अर्थ ‘मूर्खता’ है। לָמוֹ को हिन्दी में संबंधसूचक रूप देकर संक्षिप्त इब्रानी पदबंध को स्वाभाविक समानाधिकरण के रूप में रखा गया है; ‘भरोसा’ वाला संभावित अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: וְאַחֲרֵיהֶם
  choice: फिर भी उनके बाद आनेवाले
  rationale: אַחֲרֵי समय की दृष्टि से बाद में आनेवालों, अनुयायियों या वंशजों की ओर संकेत कर सकता है। ‘बाद आनेवाले’ इस व्यापक अस्पष्टता को बनाए रखता है; प्रसंग की विडंबना व्यक्त करने के लिए וְ को ‘फिर भी’ किया गया है।
- source_word: בְּפִיהֶם
  choice: उनकी कही बातों से
  rationale: शाब्दिक रूप ‘उनके मुँह में/से’ है। हिन्दी में ‘कही बातों’ से वाणी का आशय स्वाभाविक रूप से व्यक्त होता है, जबकि शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: יִרְצוּ
  choice: प्रसन्न होते हैं
  rationale: רצה के ‘प्रसन्न होना, पसंद करना, स्वीकार करना’ अर्थों में से यहाँ वाणी के प्रति अनुकूल प्रतिक्रिया व्यक्त करने वाला ‘प्रसन्न होते हैं’ उपयुक्त है।
- source_word: סֶלָה
  choice: सेला
  rationale: इस संभावित संगीतात्मक या उपासना-संबंधी संकेत का सटीक अर्थ अनिश्चित है, इसलिए पारंपरिक लिप्यंतरण रखा गया है।
theological_decisions:
- issue: וְאַחֲרֵיהֶם का संदर्भ
  choice: उनके बाद आनेवाले लोग, व्यापक अर्थ में
  alternative: उनके वंशज
  rationale: इब्रानी अभिव्यक्ति उत्तरवर्ती लोगों, अनुयायियों या वंशजों को सूचित कर सकती है। मुख्य पाठ में व्यापक रूप चुनने से जैविक वंश को अनावश्यक रूप से निश्चित नहीं किया गया।
- issue: כֵּסֶל का अर्थ
  choice: मूर्खता
  alternative: मूर्खतापूर्ण भरोसा या आत्मविश्वास
  rationale: प्रसंग धनी मनुष्य की अविवेकी जीवन-चाल पर निर्णय देता है, इसलिए ‘मूर्खता’ सीधा और उपयुक्त है; फिर भी शब्द में ‘भरोसे’ की अर्थ-छाया संभव होने के कारण उसे पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘राह’ का काव्यात्मक रूपक तथा ‘सेला’ का पारंपरिक रूप बनाए रखा गया है। वाक्य की विडंबना ‘फिर भी’ से स्पष्ट की गई है, पर उत्तरवर्ती लोगों की पहचान को आवश्यकता से अधिक निश्चित नहीं किया गया।
