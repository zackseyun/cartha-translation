    text: 'या: “कोई भाई किसी मनुष्य को किसी भी रीति से छुड़ा नहीं सकता, न परमेश्वर को उसकी छुड़ौती दे सकता है।”'
    reason: आरंभिक אָח और पद के वाक्यविन्यास की वास्तविक अस्पष्टता को सुरक्षित रखने वाला वैकल्पिक अनुवाद।
lexical_decisions:
- source_word: אָח
  choice: किसी भाई को
  rationale: אָח का मूल अर्थ ‘भाई’ है। यहाँ यह केवल सगे भाई तक सीमित न होकर निकट संबंध वाले दूसरे मनुष्य का प्रतिनिधि हो सकता है; ‘किसी भाई को’ एकवचन और व्यापक मानवीय संकेत दोनों बनाए रखता है।
- source_word: פָדֹה יִפְדֶּה
  choice: छुड़ा नहीं सकता
  rationale: धातु के infinitive absolute और imperfect का मेल क्रिया पर प्रबल बल देता है। निषेध के साथ ‘छुड़ा नहीं सकता’ पूर्ण असमर्थता को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: אִישׁ
  choice: कोई मनुष्य
  rationale: אִישׁ एकवचन ‘मनुष्य/पुरुष’ है। यहाँ कथन सामान्य मानव-असमर्थता के विषय में है, इसलिए ‘कोई मनुष्य’ सटीक और सहज है।
- source_word: לֵאלֹהִים
  choice: परमेश्वर को
  rationale: भजन के प्रसंग में אֱלֹהִים एकमात्र परमेश्वर को सूचित करता है; ‘परमेश्वर को’ स्वाभाविक और प्रसंगानुकूल है।
- source_word: כָּפְרוֹ
  choice: उसके लिए छुड़ौती
  rationale: כֹּפֶר जीवन छुड़ाने के लिए दिए जाने वाले मूल्य को दर्शाता है। ‘छुड़ौती’ आर्थिक-मुक्ति का बिंब बनाए रखती है और अनावश्यक रूप से बलिदान या प्रायश्चित की विशिष्ट धारणा नहीं जोड़ती।
- source_word: אָח לֹא
  choice: निश्चय ही कोई मनुष्य किसी भाई को
  rationale: 'आरंभिक אָח की व्याख्या कठिन है: इसे ‘भाई’ संज्ञा अथवा बलसूचक उद्गार माना जा सकता है। मुख्य पाठ प्रचलित वाक्यविन्यास के अनुसार इसे बलसूचक मानते हुए ‘निश्चय ही’ देता है और ‘भाई’ को क्रिया का कर्म रखता है; वैकल्पिक संरचना पादटिप्पणी में दी गई है।'
theological_decisions:
- issue: परमेश्वर को כֹּפֶר देने का अर्थ
  choice: किसी मानव-जीवन को छुड़ाने के लिए परमेश्वर को छुड़ौती देना
  alternative: परमेश्वर को प्रायश्चित-मूल्य देना, अथवा सामान्य अर्थ में मुक्ति का मूल्य देना
  rationale: पद का केंद्र यह है कि कोई मनुष्य दूसरे को मृत्यु से छुड़ाने के लिए परमेश्वर को पर्याप्त मूल्य नहीं दे सकता। ‘छुड़ौती’ इस गंभीर आर्थिक-मुक्ति रूपक को सुरक्षित रखती है, पर पाठ से आगे बढ़कर पूर्ण बलिदानी सिद्धांत निर्धारित नहीं करती।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा गरिमापूर्ण और सामान्य पाठक के लिए सुबोध है। ‘छुड़ा’ और ‘छुड़ौती’ की शब्द-संगति मूल की मुक्ति-मूल्य संबंधी छवि बनाए रखती है। पंक्ति के अंत का दीर्घ विराम अगले पद में जारी विचार को दर्शाता है।
