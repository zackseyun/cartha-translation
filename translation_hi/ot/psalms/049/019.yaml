  yaml_path: translation/ot/psalms/049/019.yaml
  text: He will go to the generation of his fathers[c][b][a]; they will never again see the light.
translation:
  language: hi
  text: वह अपने पुरखों की पीढ़ी तक जाएगा[a]; वे फिर कभी प्रकाश नहीं देखेंगे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'हिब्रू में पुरुष और वचन का तनाव है: आरंभिक क्रिया का लिखित रूप ‘तू जाएगा/आएगा’ है, जबकि बाद की क्रिया बहुवचन में ‘वे देखेंगे’ है। प्रसंग के कारण मुख्य पाठ का आरंभ ‘वह’ किया गया है, पर बाद का बहुवचन बनाए रखा गया है।'
    reason: alternative_reading
  - marker: b
    text: ‘प्रकाश देखना’ जीवन का अनुभव करने के लिए हिब्रू मुहावरा है; यहाँ आशय है कि वे इस संसार के जीवन में फिर कभी नहीं लौटेंगे।
    reason: cultural_note
lexical_decisions:
- source_word: תָּבוֹא
  choice: वह ... जा मिलेगा
  rationale: लिखित रूप रूपात्मक दृष्टि से द्वितीय पुरुष पुल्लिंग एकवचन है, पर प्रसंग समृद्ध मनुष्य का वर्णन आगे बढ़ाता है। हिंदी में तीसरे पुरुष का प्रयोग प्रसंग को स्वाभाविक रखता है; पादटिप्पणी मूल पाठ के पुरुष-वचन तनाव को स्पष्ट करती है। בוא का गंतव्यसूचक प्रयोग यहाँ मृत पुरखों के समुदाय में पहुँचने का भाव देता है।
- source_word: עַד דּוֹר אֲבוֹתָיו
  choice: अपने पुरखों की पीढ़ी में
  rationale: עַד यहाँ गंतव्य या पहुँच की सीमा बताता है। דּוֹר का मूल अर्थ ‘पीढ़ी’ रखा गया है, जबकि אֲבוֹתָיו के लिए स्वाभाविक और गरिमापूर्ण हिंदी ‘अपने पुरखों’ चुनी गई है।
- source_word: עַד נֵצַח
  choice: सदा तक
  rationale: निषेध के साथ यह स्थायी रूप से न होने का अर्थ देता है। ‘सदा तक ... नहीं’ हिब्रू की संरचना और स्थायित्व दोनों को बनाए रखता है।
- source_word: לֹא יִרְאוּ
  choice: वे ... नहीं देखेंगे
  rationale: क्रिया तीसरे पुरुष पुल्लिंग बहुवचन है। बहुवचन को बनाए रखने से उस समुदाय की ओर दृष्टिकोण का बदलाव सुरक्षित रहता है जिसमें वह व्यक्ति जा मिलता है।
- source_word: אוֹר
  choice: ज्योति
  rationale: यह शब्द प्रकाश की छवि रखता है और प्रसंग में जीवन का अनुभव करने का मुहावरेदार भाव भी वहन करता है। ‘ज्योति’ काव्यात्मक, गरिमापूर्ण और आधुनिक हिंदी में बोधगम्य है।
theological_decisions:
- issue: पद में पुरुष और वचन का बदलाव
  choice: पहले खंड में प्रसंगानुसार तीसरा पुरुष एकवचन ‘वह’ और दूसरे में मूल के अनुसार बहुवचन ‘वे’ रखा गया है।
  alternative: आरंभ को अक्षरशः ‘तू जाएगा’ करना, अथवा दोनों खंडों को एकवचन में समतल कर देना।
  rationale: תָּבוֹא का लिखित रूप द्वितीय पुरुष पुल्लिंग एकवचन है, जबकि יִרְאוּ तीसरे पुरुष बहुवचन है। प्रसंगगत अर्थ स्पष्ट रखने के लिए आरंभ में ‘वह’ है, पर बाद का बहुवचन नहीं मिटाया गया; पादटिप्पणी पाठगत तनाव बताती है।
- issue: ‘ज्योति देखने’ का आशय
  choice: मुख्य पाठ में हिब्रू की प्रकाश-छवि को रखा गया है।
  alternative: मुख्य पाठ में अर्थ खोलकर ‘फिर कभी जीवित नहीं होंगे’ कहना।
  rationale: मूल मुहावरा जीवन के अनुभव की ओर संकेत करता है, पर मुख्य पाठ में रूपक बनाए रखने से काव्यात्मक और धर्मवैचारिक खुलापन सुरक्षित रहता है; अर्थ पादटिप्पणी में बताया गया है।
translation_notes:
  register: आधुनिक मानक हिंदी का काव्यात्मक और गरिमापूर्ण रजिस्टर। ‘पुरखे’ सामान्य पाठक के लिए ‘पितरों’ से अधिक सहज और सांप्रदायिक संकेतों से कम जुड़ा है; ‘ज्योति’ भजन की काव्यात्मक छवि बनाए रखती है।
