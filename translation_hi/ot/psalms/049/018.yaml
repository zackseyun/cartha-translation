  text: For his soul blesses itself during his life[a], and they praise you when you do well for yourself.
translation:
  language: hi
  text: क्योंकि वह अपने जीवनकाल में अपने को धन्य मानता है[a], और जब तू अपने लिए अच्छा करता है, तब लोग तेरी प्रशंसा करते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप के निकट: ‘क्योंकि उसका प्राण अपने जीवनकाल में आशीष देता है’; अथवा, ‘क्योंकि जब तक वह जीवित है, वह अपने को धन्य समझता है।’'
    reason: नַפְשׁוֹ और יְבָרֵךְ के शाब्दिक ‘प्राण’ और ‘आशीष देना’ रूप को संकेतित करते हुए, प्रसंग में उनके सम्भावित आत्मवाचक मुहावरे को भी स्पष्ट करता है।
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पद पिछले कथन का कारण या स्पष्टीकरण देता है; हिन्दी में ‘क्योंकि’ तर्क-संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: נַפְשׁוֹ
  choice: अपने को
  rationale: נֶפֶשׁ यहाँ व्यक्ति को ही सूचित करने वाला आत्मवाचक प्रयोग है। ‘अपने को’ हिन्दी में अर्थ स्पष्ट और स्वाभाविक रखता है; ‘उसका प्राण’ शाब्दिक होते हुए भी इस वाक्य में असहज और भ्रामक हो सकता है।
- source_word: בְּחַיָּיו
  choice: अपने जीवनकाल में
  rationale: यह क्रिया के समय-क्षेत्र को बताता है और ‘जब तक वह जीवित है’ के अर्थ को औपचारिक किंतु सहज हिन्दी में व्यक्त करता है।
- source_word: יְבָרֵךְ
  choice: धन्य मानता है
  rationale: 'संदर्भ में क्रिया आत्मवाचक भाव रखती है: समृद्ध व्यक्ति स्वयं को धन्य या भाग्यशाली समझता है। ‘धन्य मानता है’ इस भाव को स्पष्ट करता है और धार्मिक शब्दावली से अनावश्यक रूप से दूर भी नहीं जाता।'
- source_word: וְיוֹדֻךָ
  choice: तब लोग तेरी प्रशंसा करते हैं
  rationale: बहुवचन कर्ता अनिश्चित है, इसलिए हिन्दी में ‘लोग’ जोड़ना आवश्यक स्पष्टता देता है। ידה यहाँ धन्यवाद की अपेक्षा सामाजिक प्रशंसा का भाव रखता है।
- source_word: כִּי
  choice: जब
  rationale: दूसरा כִּי उस परिस्थिति को प्रस्तुत करता है जिसमें प्रशंसा मिलती है; इस प्रसंग में ‘जब’ स्वाभाविक है।
- source_word: תֵיטִיב
  choice: भला करता है
  rationale: יטב का हिफ़ील रूप अच्छा करने, अपने लिए अच्छा करने या उन्नति करने की अर्थ-सीमा रखता है। ‘अपना भला करता है’ सफलता और स्वहित—दोनों भावों को कुछ हद तक खुला रखता है।
- source_word: לָךְ
  choice: अपना
  rationale: द्वितीय पुरुष प्रत्यय से लाभ स्वयं संबोधित व्यक्ति को मिलने का भाव आता है; ‘अपना भला’ हिन्दी में इस आत्महितकारी अर्थ को संक्षेप में व्यक्त करता है।
