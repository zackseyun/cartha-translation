id: PSA.49.10
reference: Psalms 49:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּ֤י יִרְאֶ֨ה חֲכָ֘מִ֤ים יָמ֗וּתוּ יַ֤חַד כְּסִ֣יל וָ/בַ֣עַר יֹאבֵ֑דוּ וְ/עָזְב֖וּ לַ/אֲחֵרִ֣ים חֵילָֽ/ם׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/049/010.yaml
  text: For he sees that wise men die[a]; together the fool and the brutish man perish[c][b], and they leave their wealth to others.
translation:
  language: hi
  text: क्योंकि वह देखता है कि बुद्धिमान भी मरते हैं; मूर्ख और विवेकहीन, दोनों नाश हो जाते हैं और अपनी संपत्ति दूसरों के लिए छोड़ जाते हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण या स्पष्टीकरण प्रस्तुत करता है और इब्रानी संयोजक का स्वाभाविक हिन्दी रूप है।
- source_word: יִרְאֶה
  choice: वह देखता है
  rationale: तीसरे पुरुष एकवचन रूप को बनाए रखते हुए सामान्य, बार-बार दिखाई देने वाले सत्य को वर्तमान काल में व्यक्त करता है।
- source_word: חֲכָמִים
  choice: बुद्धिमान
  rationale: यह बहुवचन प्रतिनिधि मानव-वर्ग को दर्शाता है; हिन्दी में ‘बुद्धिमान’ स्वाभाविक है और अनावश्यक रूप से केवल पुरुषों तक अर्थ सीमित नहीं करता।
- source_word: יָמוּתוּ
  choice: भी मरते हैं
  rationale: ‘मरते हैं’ सामान्य सत्य व्यक्त करता है; ‘भी’ प्रसंग में इस बात पर बल देता है कि बुद्धिमान भी मृत्यु से नहीं बचते।
- source_word: יַחַד
  choice: दोनों
  rationale: मूर्ख और विवेकहीन की समान परिणति को स्वाभाविक हिन्दी में व्यक्त करता है; इसका आशय आवश्यक रूप से एक ही समय पर मरना नहीं है।
- source_word: כְּסִיל
  choice: मूर्ख
  rationale: ज्ञान-साहित्य में नैतिक और बौद्धिक मूर्खता के लिए प्रचलित, स्पष्ट हिन्दी शब्द है।
- source_word: בַעַר
  choice: विवेकहीन
  rationale: अविवेकी, संवेदनहीन या पशुवत व्यक्ति का भाव देता है; ‘विवेकहीन’ आधुनिक हिन्दी में गरिमापूर्ण और सुबोध है।
- source_word: יֹאבֵדוּ
  choice: नाश हो जाते हैं
  rationale: אבד में केवल मरने से आगे विनाश या मिट जाने का भाव है, जिसे यह पदबंध सुरक्षित रखता है।
- source_word: וְעָזְבוּ
  choice: और ... छोड़ जाते हैं
  rationale: मृत्यु के बाद अपनी वस्तुएँ पीछे छोड़ने के प्रसंग को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לַאֲחֵרִים
  choice: दूसरों के लिए
  rationale: इब्रानी पूर्वसर्ग और अनिश्चित बहुवचन का सीधा, स्वाभाविक रूप है; ‘परायों’ जैसा अधिक प्रबल अर्थ नहीं जोड़ता।
- source_word: חֵילָם
  choice: अपनी संपत्ति
  rationale: यहाँ חֵיל धन, साधन या संपदा को सूचित करता है; ‘संपत्ति’ आधुनिक हिन्दी में व्यापक और स्पष्ट है।
theological_decisions:
- issue: חֲכָמִים और בַעַר में प्रतिनिधि मानव-वर्ग तथा व्याकरणिक पुल्लिंग
  choice: बुद्धिमान ... विवेकहीन
  alternative: बुद्धिमान पुरुष ... पशुवत मनुष्य
  rationale: इब्रानी के पुल्लिंग रूप यहाँ मानव-प्रकारों के प्रतिनिधि वर्ग हैं। हिन्दी में विशेषणों का संज्ञावत प्रयोग अर्थ को स्वाभाविक रूप से सुरक्षित रखता है और पाठ को केवल पुरुषों तक सीमित करने का अतिरिक्त दावा नहीं करता।
- issue: יַחַד का संबंध और अर्थ
  choice: मूर्ख और विवेकहीन, दोनों नाश हो जाते हैं
  alternative: मूर्ख और विवेकहीन एक साथ नाश हो जाते हैं
  rationale: यह समान नियति पर बल देता है; ‘दोनों’ उस भाव को रखता है और अनिवार्य समकालिक मृत्यु का संकेत देने से बचता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण काव्यात्मक गद्य। मूल की सामान्य मानवीय मृत्यु और धन छोड़ जाने की विडंबना को संक्षिप्त रखा गया है। किसी पादटिप्पणी की आवश्यकता नहीं पड़ी।
