  text: those who trust in their wealth and boast in the abundance of their riches—[a][b]
translation:
  language: hi
  text: जो अपनी धन-संपत्ति पर भरोसा रखते हैं और अपनी अपार दौलत पर घमंड करते हैं—[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपनी अपार दौलत पर गर्व करते हैं।”
    reason: lexical_alternative
  - marker: b
    text: इब्रानी חַיִל का अर्थ “सामर्थ्य” या “साधन” भी हो सकता है, पर यहाँ “दौलत” के समानांतर होने के कारण भौतिक संपत्ति अभिप्रेत है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבֹּטְחִים
  choice: जो ... भरोसा रखते हैं
  rationale: संज्ञा के रूप में प्रयुक्त निश्चित बहुवचन कृदंत उन लोगों की लगातार बनी रहने वाली प्रवृत्ति व्यक्त करता है; यह हिंदी में स्वाभाविक है।
- source_word: עַל
  choice: पर
  rationale: בטח के साथ यह उस आधार या वस्तु को सूचित करता है जिस पर भरोसा रखा जाता है; हिंदी मुहावरा ‘पर भरोसा रखना’ मूल संबंध को ठीक व्यक्त करता है।
- source_word: חֵילָם
  choice: अपनी धन-संपत्ति
  rationale: חַיִל के अर्थों में सामर्थ्य, साधन और संपत्ति आते हैं; समानांतर ‘दौलत’ के कारण यहाँ भौतिक संपदा का अर्थ उपयुक्त है। ‘धन-संपत्ति’ व्यापक संसाधनों का भाव भी बनाए रखता है।
- source_word: וּבְרֹב
  choice: और अपनी अपार ... पर
  rationale: רֹב बहुतायत या बड़ी मात्रा दर्शाता है। ‘अपार’ हिंदी काव्य-पंक्ति में स्वाभाविक ढंग से प्रचुरता व्यक्त करता है।
- source_word: עָשְׁרָם
  choice: दौलत
  rationale: עֹשֶׁר विशेषतः धन-वैभव को दर्शाता है। ‘दौलत’ पहले पद की ‘धन-संपत्ति’ से शब्दगत भिन्नता रखते हुए काव्यात्मक समानांतरता बचाता है।
- source_word: יִתְהַלָּלוּ
  choice: घमंड करते हैं
  rationale: הלל का हित्पएल रूप यहाँ अपनी संपदा पर शेखी बघारने या गर्व करने का अर्थ देता है; ‘घमंड करते हैं’ सामान्य आधुनिक हिंदी में स्पष्ट और प्रसंगानुकूल है।
theological_decisions: []
