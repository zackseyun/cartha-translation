base_translation:
  language: en
  yaml_path: translation/ot/psalms/049/011.yaml
  text: Their inward thought is that their houses will last forever[a], their dwelling places from generation to generation[b]; they have called lands by their own names.
translation:
  language: hi
  text: 'वे मन ही मन सोचते हैं कि उनके घर सदा बने रहेंगे[a],

    और उनके निवास पीढ़ी-दर-पीढ़ी कायम रहेंगे;

    उन्होंने ज़मीनों और जायदादों के नाम अपने ही नाम पर रखे हैं[b]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'एक वैकल्पिक पाठ-समझ के अनुसार: “उनकी कब्रें सदा के लिए उनके घर हैं, और उनके निवास पीढ़ी-दर-पीढ़ी बने रहते हैं।”'
    reason: textual_variant
  - marker: b
    text: शाब्दिक रूप से, “उन्होंने भूमियों पर अपने नाम पुकारे।” आशय यह है कि उन्होंने ज़मीनों या जायदादों के नाम अपने नाम पर रखे।
    reason: lexical_alternative
lexical_decisions:
- source_word: קִרְבָּם
  choice: वे मन ही मन सोचते हैं
  rationale: मसोरेटी स्वरांकन के अनुसार इसका अर्थ ‘उनका भीतरी भाग/उनके भीतर’ है। क्रियारहित इब्रानी वाक्य को स्वाभाविक हिन्दी में अंतर्निहित विचार के रूप में व्यक्त किया गया है; ‘कब्रें’ वाला वैकल्पिक पाठ पादटिप्पणी में सुरक्षित है।
- source_word: בָּתֵּימוֹ
  choice: उनके घर
  rationale: בית का सामान्य अर्थ ‘घर’ है और यह अगले समानांतर पद ‘निवास’ के साथ उपयुक्त बैठता है।
- source_word: לְעוֹלָם
  choice: सदा बने रहेंगे
  rationale: यह स्थायी बने रहने की उनकी धारणा व्यक्त करता है; हिन्दी में क्रिया जोड़कर इब्रानी के क्रियारहित खंड को सहज बनाया गया है।
- source_word: מִשְׁכְּנֹתָם
  choice: उनके निवास
  rationale: यह रहने के स्थानों के लिए सामान्य शब्द है और आधुनिक हिन्दी में ‘निवास’ संक्षिप्त तथा गरिमापूर्ण है।
- source_word: לְדֹר וָדֹר
  choice: पीढ़ी-दर-पीढ़ी
  rationale: यह लगातार आने वाली पीढ़ियों तक बने रहने का प्रचलित मुहावरा है।
- source_word: קָרְאוּ
  choice: नाम दिए हैं
  rationale: קרא का अर्थ यहाँ ‘नाम रखना’ है; हिन्दी में ‘नाम दिए हैं’ संपत्ति को अपने नाम से पुकारने का भाव स्वाभाविक रूप से बताता है।
- source_word: בִּשְׁמוֹתָם
  choice: अपने ही नाम
  rationale: ‘ही’ आत्म-स्मारक भाव पर हल्का बल देता है, बिना मूल से आगे कोई नया दावा जोड़े।
- source_word: עֲלֵי אֲדָמוֹת
  choice: भूमि-जायदादों को
  rationale: शाब्दिक रूप ‘भूमियों पर’ है, पर प्रसंग में आशय उनकी जमीनों अथवा भू-संपत्तियों से है; संयुक्त अभिव्यक्ति साधारण पाठक के लिए इसे स्पष्ट रखती है।
theological_decisions:
- issue: मानवीय स्थायित्व की अंतर्निहित धारणा बनाम कब्र का पाठ
  choice: मुख्य पाठ में ‘वे मन ही मन सोचते हैं’
  alternative: ‘उनकी कब्रें सदा के लिए उनके घर हैं’
  rationale: प्रदत्त WLC का स्वरांकित पाठ קִרְבָּם ‘उनके भीतर’ का समर्थन करता है। वैकल्पिक पाठ प्राचीन और अनुवाद-परंपरागत महत्त्व रखता है, इसलिए उसे मिटाने के बजाय पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में काव्यात्मक समानांतरता और गरिमापूर्ण, सहज लहजा रखा गया है। ‘भूमि-जायदादों’ से जमीन तथा संपदा—दोनों का प्रसंग स्पष्ट होता है; पाठगत अस्पष्टता पादटिप्पणी में संरक्षित है।
