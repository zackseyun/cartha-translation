  text: For the ransom of their life is costly[a], and it ceases forever[b],
translation:
  language: hi
  text: क्योंकि उनके जीवन[a] की छुड़ौती महँगी है, और वह सदा के लिए समाप्त हो जाती है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘जीवन’ का अनुवाद ‘प्राण’ या ‘आत्मा’ भी किया जा सकता है; इब्रानी शब्द नेफ़ेश प्रायः जीवित व्यक्ति या उसके जीवन को दर्शाता है, केवल देहरहित आत्मा को नहीं।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी वाक्यांश बहुत संक्षिप्त और कठिन है। अधिक शाब्दिक रूप में इसका अर्थ ‘और वह सदा के लिए समाप्त हो जाता है’ हो सकता है; आशय यह भी हो सकता है कि छुड़ौती का प्रयास सदा के लिए विफल रहता है या उसे छोड़ देना पड़ता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וְיֵקַר
  choice: बहुत महँगी है
  rationale: יקר मूल्यवान या महँगा होने का भाव देता है। छुड़ौती के संदर्भ में ‘बहुत महँगी’ स्वाभाविक है और प्रसंगगत असाध्यता को बिना ‘असंभव’ जोड़े व्यक्त करती है।
- source_word: פִּדְיוֹן
  choice: छुड़ौती
  rationale: यह संज्ञा किसी को छुड़ाने के लिए दिए जाने वाले मूल्य को दर्शाती है; ‘छुड़ौती’ लेन-देन और मुक्ति, दोनों भाव बनाए रखती है।
- source_word: נַפְשָׁם
  choice: उनके जीवन
  rationale: נפש यहाँ मृत्यु से बचाए जाने वाले जीवित व्यक्ति या जीवन को सूचित करता है। ‘जीवन’ आधुनिक हिन्दी में स्पष्ट है और केवल देहरहित आत्मा का अर्थ आरोपित नहीं करता।
- source_word: וְחָדַל
  choice: उसका प्रयास … छोड़ देना पड़ता है
  rationale: חדל का मूल भाव रुकना, समाप्त होना या छोड़ देना है। इब्रानी वाक्यांश संक्षिप्त है; प्रसंग में छुड़ौती का प्रयास छोड़ देने का भाव सुबोध है, जबकि वैकल्पिक अधिक शाब्दिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: לְעוֹלָם
  choice: सदा के लिए
  rationale: यह पद स्थायी अवधि का भाव देता है। ‘सदा के लिए’ मूल की कालगत शक्ति को सीधे बनाए रखता है।
theological_decisions:
- issue: मृत्यु और छुड़ौती के संदर्भ में נֶפֶשׁ का अर्थ
  choice: जीवन
  alternative: प्राण; आत्मा
  rationale: भजन का तर्क मनुष्य को मृत्यु से छुड़ाने की असमर्थता के विषय में है। ‘जीवन’ तत्काल संदर्भ के अनुकूल है और इब्रानी शब्द पर बाद की शरीर-आत्मा संबंधी अवधारणा आरोपित नहीं करता।
- issue: संक्षिप्त और कठिन वाक्यांश וְחָדַל לְעוֹלָם की व्याख्या
  choice: छुड़ौती का प्रयास सदा के लिए छोड़ देना पड़ता है
  alternative: वह सदा के लिए समाप्त हो जाती है; वह कभी पर्याप्त नहीं हो सकती
  rationale: इब्रानी में कर्ता या कर्म स्पष्ट नहीं है। मुख्य पाठ प्रसंगगत अर्थ को सहज हिन्दी में देता है, पर मूल की वास्तविक अस्पष्टता और अन्य सम्भव अर्थ पादटिप्पणी में सुरक्षित रखे गए हैं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘छुड़ौती’ भजन के आर्थिक रूपक को बनाए रखती है। कठिन दूसरे खंड को मुख्य पाठ में सुबोध बनाया गया है, पर उसकी व्याख्यात्मक अनिश्चितता पादटिप्पणी में स्पष्ट रूप से सुरक्षित है।
