  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक रखी गई है। 'परन्तु', 'प्राण', 'अधोलोक' और 'सेला' भजन-साहित्य के अनुकूल हैं, फिर भी सामान्य हिन्दी पाठक के लिए समझने योग्य हैं।
