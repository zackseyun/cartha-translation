source:
  edition: WLC
  text: אַךְ אֱלֹהִ֗ים יִפְדֶּ֣ה נַ֭פְשִׁ/י מִֽ/יַּד שְׁא֑וֹל כִּ֖י יִקָּחֵ֣/נִי סֶֽלָה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/049/015.yaml
  text: But God will redeem my life from the hand of Sheol[a], for he will take me[b]. Selah
translation:
  language: hi
  text: लेकिन परमेश्वर मेरे जीवन को शिओल के हाथ से छुड़ा लेगा,[a] क्योंकि वह मुझे ले लेगा।[b] सेला
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '“शिओल” मृतकों के लोक के लिए इब्रानी शब्द है; वैकल्पिक अनुवाद: “कब्र” या “मृतकों का लोक।”'
    reason: lexical_alternative
  - marker: b
    text: या “क्योंकि वह मुझे ग्रहण करेगा।”
    reason: alternative_reading
lexical_decisions:
- source_word: אַךְ
  choice: परन्तु
  rationale: यह अव्यय पिछले पदों में धनी और नश्वर मनुष्य की नियति के विपरीत भजनकार का भरोसा प्रकट करता है।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: यहाँ इस्राएल के परमेश्वर के लिए एकवचन अर्थ में प्रयुक्त सामान्य पद है।
- source_word: יִפְדֶּה
  choice: छुड़ा लेगा
  rationale: פדה किसी शक्ति या दशा से छुड़ाने अथवा मूल्य देकर मुक्त करने का भाव रखता है; सहज हिन्दी में 'छुड़ा लेगा' उद्धार का मूल भाव स्पष्ट रखता है।
- source_word: נַפְשִׁי
  choice: मेरे प्राण को
  rationale: נפש यहाँ केवल शरीर से अलग अमूर्त आत्मा नहीं, बल्कि जीवित व्यक्ति या जीवन को सूचित कर सकता है। 'प्राण' हिन्दी काव्य में इस व्यापकता को संक्षेप में बनाए रखता है।
- source_word: מִיַּד
  choice: के हाथ से
  rationale: मूल इब्रानी बिंब को सुरक्षित रखते हुए यह किसी की पकड़ या अधिकार से मुक्ति का अर्थ देता है।
- source_word: שְׁאוֹל
  choice: अधोलोक
  rationale: שְׁאוֹל मृतकों के लोक का इब्रानी पद है। 'अधोलोक' हिन्दी में इसका संक्षिप्त निकटतम रूप है और इसे केवल कब्र तक सीमित नहीं करता।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह अगले कथन को पहले कथन के आधार या कारण के रूप में जोड़ता है।
- source_word: יִקָּחֵנִי
  choice: वह मुझे अपने पास ले लेगा
  rationale: לקח का मूल अर्थ 'लेना' है; परमेश्वर के कर्ता होने पर इसमें अपने पास ग्रहण करने का संकेत हो सकता है। 'अपने पास' निहित संबंध को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि पादटिप्पणी अधिक शाब्दिक विकल्प देती है।
- source_word: סֶלָה
  choice: सेला
  rationale: इस संगीतात्मक या पाठ-विन्यास संबंधी पद का सटीक अर्थ अनिश्चित है, इसलिए पारंपरिक लिप्यंतरण उचित है।
theological_decisions:
- issue: נַפְשִׁי का मृत्यु और छुटकारे के संदर्भ में अर्थ
  choice: '''मेरे प्राण'' रखा गया, जो व्यक्ति या जीवन की समग्रता को व्यक्त कर सकता है।'
  alternative: '''मेरे जीवन'' या ''मेरी आत्मा'''
  rationale: यह चयन शरीर और आत्मा के बाद के दार्शनिक द्वैत को मूल इब्रानी पर आरोपित नहीं करता और हिन्दी काव्य में स्वाभाविक है।
- issue: अधोलोक से छुटकारे का स्वरूप
  choice: पद को परमेश्वर द्वारा अधोलोक की शक्ति से छुड़ाने और अपने पास लेने की व्यापक आशा के रूप में रखा गया।
  alternative: इसे स्पष्ट पुनरुत्थान, केवल अकाल मृत्यु से बचाव, या मृत्यु के बाद परमेश्वर के साथ संगति के रूप में सीमित करना।
  rationale: इब्रानी पाठ दृढ़ ईश्वरीय छुटकारा व्यक्त करता है, पर उसके व्यवस्थित धर्मवैज्ञानिक स्वरूप को स्पष्ट नहीं करता; इसलिए मूल तनाव और व्यापकता सुरक्षित रखी गई।
- issue: יִקָּחֵנִי में ग्रहण किए जाने का भाव
  choice: '''अपने पास ले लेगा'''
  alternative: '''मुझे ले लेगा'' या ''मुझे ग्रहण करेगा'''
  rationale: मूल क्रिया की व्यापकता बनाए रखते हुए हिन्दी में ईश्वरीय ग्रहण का संभावित संबंधपरक भाव व्यक्त किया गया है; अधिक शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
