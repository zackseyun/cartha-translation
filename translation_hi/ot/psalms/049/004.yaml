- source_word: לְמָשָׁל
  choice: एक नीतिवचन की ओर
  rationale: מָשָׁל का अर्थ नीतिवचन, दृष्टान्त या ज्ञानपूर्ण कथन हो सकता है। इस ज्ञानपरक भजन में ‘नीतिवचन’ उपयुक्त है, जबकि व्यापक अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: אָזְנִי
  choice: अपना कान
  rationale: मूल इब्रानी में संज्ञा एकवचन है और प्रथम पुरुष एकवचन प्रत्यय के साथ है; हिन्दी मुहावरे में भी एकवचन स्वाभाविक है।
- source_word: אֶפְתַּח
  choice: खोलूँगा
  rationale: פתח का मूल अर्थ ‘खोलना’ है। इसे बनाए रखने से रहस्यपूर्ण कथन को संगीत के साथ प्रस्तुत या उद्घाटित करने का इब्रानी रूपक सुरक्षित रहता है।
- source_word: בְּכִנּוֹר
  choice: वीणा के साथ
  rationale: כִּנּוֹר प्राचीन वीणा-सदृश तारवाद्य है। सामान्य हिन्दी पाठक के लिए ‘वीणा’ सुबोध और गरिमापूर्ण निकटतम नाम है; בְ का वाद्यगत अर्थ ‘के साथ’ लिया गया है।
- source_word: חִידָתִי
  choice: अपनी पहेली
  rationale: חִידָה किसी पहेली, गूढ़ कथन या रहस्यपूर्ण उक्ति को दर्शाता है। ‘पहेली’ सरल आधुनिक हिन्दी में अर्थ को स्पष्ट रखती है, और अन्य संभावनाएँ पादटिप्पणी में दी गई हैं।
