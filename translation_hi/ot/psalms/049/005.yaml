  text: לָ֣/מָּה אִ֭ירָא בִּ֣/ימֵי רָ֑ע עֲוֺ֖ן עֲקֵבַ֣/י יְסוּבֵּֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/049/005.yaml
  text: Why should I fear in days of evil[a], when the iniquity of my pursuers surrounds me?
translation:
  language: hi
  text: 'मैं बुरे दिनों में क्यों डरूँ,

    जब मेरे पीछे पड़े लोगों का अधर्म[a] मुझे घेर ले?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से ‘मेरी एड़ियों का अधर्म’। इसका अर्थ ‘मेरे पीछे लगा अधर्म’, मुझे गिराने की ताक में रहने वालों का अधर्म, या संभवतः मेरा अपना अधर्म भी हो सकता है जो मेरे पीछे-पीछे आता है।
    reason: मूल इब्रानी पदबंध עֲוֹן עֲקֵבַי अस्पष्ट है; पाद-टिप्पणी उसके शाब्दिक रूप और प्रमुख वैकल्पिक अर्थों को सुरक्षित रखती है।
lexical_decisions:
- source_word: לָמָּה אִירָא
  choice: मैं क्यों डरूँ
  rationale: प्रश्नवाचक לָמָּה और प्रथम पुरुष अपूर्ण क्रिया אִירָא मिलकर आलंकारिक प्रश्न बनाते हैं; ‘मैं क्यों डरूँ’ इसे स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: בִּימֵי רָע
  choice: बुरे दिनों में
  rationale: यह पदबंध मूल के व्यापक अर्थ को बनाए रखता है; ‘बुरे’ नैतिक बुराई के साथ संकट या विपत्ति के दिनों को भी समेट सकता है।
- source_word: עֲוֹן
  choice: अधर्म
  rationale: עָוֹן में कुटिलता, अपराध, दोष और उसके परिणाम की अर्थ-सीमा है। यहाँ ‘अधर्म’ नैतिक भार बनाए रखते हुए प्रसंग में स्वाभाविक है।
- source_word: עֲקֵבַי
  choice: मेरे पीछे पड़े लोगों
  rationale: शाब्दिक रूप से यह ‘मेरी एड़ियाँ’ है, पर एड़ी/पीछे पड़ने और गिराने से जुड़ा मुहावरा विरोधियों या पीछा करने वालों की ओर संकेत कर सकता है। मुख्य पाठ में बोधगम्य अर्थ दिया गया है और अनिश्चितता पाद-टिप्पणी में सुरक्षित रखी गई है।
- source_word: יְסוּבֵּנִי
  choice: मुझे घेर ले
  rationale: סבב का मूल अर्थ चारों ओर घेरना है। प्रश्न के भीतर संभाव्य परिस्थिति को हिन्दी में ‘घेर ले’ स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: עֲוֹן עֲקֵבַי की कठिन और संदिग्ध व्याख्या
  choice: इसे ऐसे शत्रुतापूर्ण लोगों के अधर्म के रूप में लिया गया है जो भजनकार के पीछे पड़े हैं।
  alternative: इसे शाब्दिक रूप से ‘मेरी एड़ियों का अधर्म’, ‘मेरे पीछे लगा अधर्म’, अथवा भजनकार के अपने अधर्म के रूप में समझा जा सकता है जो उसके पीछे-पीछे आता है।
  rationale: भजन 49 के प्रसंग में शक्तिशाली विरोधियों से न डरने का भाव उपयुक्त है, फिर भी इब्रानी पदबंध अत्यंत संक्षिप्त और अस्पष्ट है। इसलिए मुख्य पाठ एक प्रसंगानुकूल अर्थ देता है, जबकि पाद-टिप्पणी अन्य वास्तविक संभावनाओं को खुला रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। काव्यात्मक प्रश्न और दो-पंक्ति संरचना सुरक्षित हैं; कठिन इब्रानी मुहावरे को मुख्य पाठ में स्पष्ट किया गया है, पर उसकी वास्तविक अनिश्चितता पाद-टिप्पणी में दी गई है।
