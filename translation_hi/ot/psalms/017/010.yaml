lexical_decisions:
- source_word: חֶלְבָּמוֹ
  choice: अपनी चरबी
  rationale: इब्रानी में अक्षरशः ‘उनकी चरबी’ है। काव्यात्मक रूपक असंवेदनशीलता या आत्मतुष्ट कठोरता का संकेत दे सकता है; मुख्य पाठ में ठोस और कुछ अस्पष्ट बिंब सुरक्षित रखा गया है।
- source_word: סָּגְרוּ
  choice: बंद कर रखी है
  rationale: मूल अर्थ ‘बंद करना’ है। यह रूप पूर्ण की परिणामी अवस्था को व्यक्त करता है और चरबी के बंद या घिरे होने का बिंब बनाए रखता है।
- source_word: פִּימוֹ
  choice: अपने मुँह से
  rationale: रूपात्मक रूप से एकवचन संज्ञा के साथ बहुवचन प्रत्यय है; हिन्दी में सामूहिक ‘अपने मुँह से’ स्वाभाविक है और बहुवचन कर्ता के साथ स्पष्ट रहता है।
- source_word: דִּבְּרוּ
  choice: वे ... बातें करते हैं
  rationale: काव्य के संदर्भ में पूर्ण रूप को वर्तमान चरित्रगत क्रिया के रूप में समझा जा सकता है; हिन्दी में ‘करते हैं’ दुष्टों के निरंतर व्यवहार को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: בְגֵאוּת
  choice: घमंड की बातें
  rationale: संज्ञा गर्व, दंभ या अहंकार का भाव रखती है। ‘घमंड की बातें करते हैं’ आधुनिक हिन्दी में सहज है और नकारात्मक नैतिक अर्थ सुरक्षित रखता है।
