translation_notes:
  register: आधुनिक मानक हिन्दी में निकट, प्रत्यक्ष प्रार्थना के लिए एकवचन ‘तू’ रखा गया है। भाषा गरिमापूर्ण किन्तु सरल है; मूल इब्रानी का कान लगाने वाला रूपक और क्रियाओं की कालगत अस्पष्टता सुरक्षित रखी गई है।
