base_translation:
  language: en
  yaml_path: translation/ot/psalms/017/006.yaml
  text: I call on you[a], for you answer me, O God; incline your ear to me[b]; hear my words.
translation:
  language: hi
  text: मैं तुझे पुकारता हूँ[a], क्योंकि तू मुझे उत्तर देता है, हे परमेश्वर! अपना कान मेरी ओर झुका[b]; मेरी बात सुन।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैंने तुझे पुकारा है, क्योंकि तू मुझे उत्तर देगा, हे परमेश्वर।” काव्यात्मक प्रार्थना में इब्रानी क्रियाओं का भाव भूत, वर्तमान या विश्वासपूर्ण भविष्य के रूप में समझा जा सकता है।
    reason: alternative_reading
  - marker: b
    text: “अपना कान मेरी ओर झुका” ध्यान देकर सुनने की विनती करने वाला इब्रानी मुहावरा है।
    reason: cultural_note
lexical_decisions:
- source_word: קְרָאתִיךָ
  choice: मैं तुझे पुकारता हूँ
  rationale: इब्रानी पूर्ण क्रिया काव्यात्मक प्रार्थना में वर्तमान पुकार, पूर्व की पुकार, या विश्वासपूर्ण भाव व्यक्त कर सकती है। वर्तमान काल आधुनिक हिन्दी में स्वाभाविक है; अन्य कालगत सम्भावनाएँ पादटिप्पणी में सुरक्षित हैं।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पुकार का कारण बताता है और इब्रानी के कारणसूचक सम्बन्ध को स्पष्ट, स्वाभाविक हिन्दी में रखता है।
- source_word: תַעֲנֵנִי
  choice: तू मुझे उत्तर देता है
  rationale: अपूर्ण क्रिया यहाँ परमेश्वर के उत्तर देने पर विश्वास प्रकट करती है। हिन्दी वर्तमान काल इस भरोसे को व्यक्त करता है, जबकि भविष्य की सम्भावित छाया पादटिप्पणी में बनी रहती है।
- source_word: אֵל
  choice: हे परमेश्वर
  rationale: यह प्रत्यक्ष सम्बोधन है। ‘हे परमेश्वर’ आधुनिक हिन्दी की गरिमापूर्ण प्रार्थना-भाषा में स्वाभाविक है।
- source_word: הַט אָזְנְךָ לִי
  choice: अपना कान मेरी ओर लगा
  rationale: मूल रूपक को बनाए रखते हुए हिन्दी में ध्यानपूर्वक सुनने का सहज मुहावरा दिया गया है।
- source_word: שְׁמַע
  choice: सुन
  rationale: आज्ञार्थक बल तथा पिछले वाक्यांश के साथ काव्यात्मक समानांतरता सुरक्षित रखी गई है।
- source_word: אִמְרָתִי
  choice: मेरी बात
  rationale: इब्रानी संज्ञा बोले हुए कथन या वाणी को दर्शाती है। ‘मेरी बात’ हिन्दी में स्वाभाविक है और सामूहिक अर्थ में प्रार्थना के कथनों को समेट सकती है।
