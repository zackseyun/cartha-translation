base_translation:
  language: en
  yaml_path: translation/ot/psalms/017/013.yaml
  text: Rise up[a], O Yahweh; confront him, bring him low[b]; deliver my life from the wicked by your sword.
translation:
  language: hi
  text: हे याहवे, उठ खड़े हो; उसका सामना कर, उसे झुका दे; मेरे जीवन को दुष्ट से अपनी तलवार के द्वारा बचा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קוּמָה
  choice: उठ खड़े हो
  rationale: यह קום का आग्रहपूर्ण आज्ञार्थक रूप है। ‘उठ खड़े हो’ आधुनिक हिन्दी में तत्काल हस्तक्षेप की पुकार को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चतुरक्षरीय ईश्वरीय नाम को उपाधि से बदलने के बजाय हिन्दी में उसके प्रचलित निकट लिप्यंतरण ‘याहवे’ से व्यक्त किया गया है।
- source_word: קַדְּמָה פָנָיו
  choice: उसका सामना कर
  rationale: शाब्दिक अर्थ ‘उसके मुख के आगे जा’ है; शत्रुतापूर्ण प्रसंग में यह आमने-सामने होकर रोकने या सामना करने का भाव देता है।
- source_word: הַכְרִיעֵהוּ
  choice: उसे झुका दे
  rationale: כרע के हिफ़ील रूप में किसी को झुकाने, घुटने टेकने या नीचे गिराने का कारण बनने का भाव है। ‘उसे झुका दे’ मूल बिंब को बनाए रखता है।
- source_word: פַּלְּטָה
  choice: बचा
  rationale: פלט का आज्ञार्थक रूप संकट से छुड़ाने या बचाने की तत्काल विनती व्यक्त करता है।
- source_word: נַפְשִׁי
  choice: मेरे प्राण
  rationale: נפש यहाँ हिंसक मृत्यु के खतरे में पड़े जीवन या स्वयं व्यक्ति को दर्शाता है। ‘मेरे प्राण’ हिन्दी में इस ठोस जीवन-संकट को गरिमापूर्ण और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: מֵרָשָׁע
  choice: दुष्ट से
  rationale: एकवचन विशेषण संज्ञा की तरह प्रयुक्त है और किसी दुष्ट विरोधी को सूचित कर सकता है; हिन्दी में ‘दुष्ट से’ वही संक्षिप्तता और संभावित सामान्यता बनाए रखता है।
- source_word: חַרְבֶּךָ
  choice: अपनी तलवार के द्वारा
  rationale: शाब्दिक रूप ‘तेरी तलवार’ है। मुख्य पाठ में इसे साधनवाचक माना गया है—याहवे अपनी तलवार के द्वारा बचाता है—जबकि वैकल्पिक समानाधिकरणीय अर्थ पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: ‘तेरी तलवार’ का ‘दुष्ट’ के साथ संबंध
  choice: 'साधनवाचक अर्थ: याहवे अपनी तलवार के द्वारा भजनकार को बचाता है'
  alternative: 'समानाधिकरणीय अर्थ: ‘दुष्ट से, जो तेरी तलवार है,’ अर्थात दुष्ट याहवे के हाथ में दंड का साधन है'
  rationale: इब्रानी מֵרָשָׁע חַרְבֶּךָ अत्यंत संक्षिप्त है और दोनों व्याकरणिक संबंध संभव हैं। आसपास की आज्ञार्थक विनतियाँ प्रत्यक्ष ईश्वरीय हस्तक्षेप के साधन के रूप में तलवार को समझने का समर्थन करती हैं, पर वैकल्पिक अर्थ वास्तविक है और इसलिए पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और प्रार्थनात्मक रखी गई है। सीधे आज्ञार्थक क्रियारूप मूल इब्रानी की तात्कालिकता बनाए रखते हैं। ‘प्राण’ सामान्य हिन्दी में बोधगम्य है और इस काव्यात्मक प्रसंग के अनुकूल है; अस्पष्ट तलवार-संबंध को मुख्य पाठ में एक अर्थ देकर पादटिप्पणी में दूसरा अर्थ सुरक्षित रखा गया है।
