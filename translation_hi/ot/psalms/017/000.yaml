base_translation:
  language: en
  yaml_path: translation/ot/psalms/017/000.yaml
  text: A prayer of David. Hear righteousness[a], Yahweh; pay attention to my cry; give ear to my prayer from lips without deceit.
translation:
  language: hi
  text: 'दाऊद की प्रार्थना।


    हे याहवे, मेरा न्यायपूर्ण निवेदन सुन[a]; मेरी दुहाई पर ध्यान दे; मेरी उस प्रार्थना पर कान दे, जो कपटपूर्ण होंठों से नहीं निकलती।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “न्याय सुन।” इब्रानी शब्द צֶדֶק का अर्थ धार्मिकता, न्याय, या न्यायपूर्ण पक्ष हो सकता है; यहाँ संभवतः भजनकार का न्यायपूर्ण मामला अभिप्रेत है।
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּפִלָּה לְדָוִד
  choice: दाऊद की प्रार्थना
  rationale: शीर्षक को उसके स्वाभाविक संबंध सहित संक्षिप्त और स्पष्ट हिंदी में रखा गया है।
- source_word: צֶדֶק
  choice: न्याय की बात
  rationale: इस शब्द में धार्मिकता, न्याय और न्यायपूर्ण पक्ष का अर्थ-क्षेत्र है। ‘न्याय की बात’ हिंदी में समझने योग्य है और किसी एक विशिष्ट अर्थ को अनावश्यक रूप से अंतिम नहीं बनाती।
- source_word: רִנָּתִי
  choice: मेरी दुहाई
  rationale: यहाँ शब्द प्रबल पुकार या विनती को दर्शाता है; ‘दुहाई’ प्रार्थनापूर्ण पुकार की तीव्रता को स्वाभाविक हिंदी में व्यक्त करती है।
- source_word: בְּלֹא שִׂפְתֵי מִרְמָה
  choice: वह छलपूर्ण होंठों से नहीं निकलती
  rationale: इब्रानी का शाब्दिक भाव ‘छल के होंठों के बिना’ है। हिंदी में प्रार्थना से इसका संबंध स्पष्ट करते हुए रूपक को बनाए रखा गया है।
- source_word: יְהוָה
  choice: याहवे
  rationale: व्यक्तिगत दिव्य नाम को उपाधि से बदलने के बजाय हिंदी लिप्यंतरण में प्रस्तुत किया गया है।
theological_decisions:
- issue: भजनकार के צֶדֶק का आशय
  choice: ‘न्याय की बात’ द्वारा अर्थ को खुला रखा गया
  alternative: ‘मेरे न्यायपूर्ण पक्ष’ या ‘धार्मिकता’
  rationale: संदर्भ संभवतः भजनकार के न्यायपूर्ण मामले की ओर संकेत करता है, पर इब्रानी संज्ञा स्वयं व्यापक है; इसलिए अनुवाद ने भजनकार के आत्म-धर्मी होने का अतिरिक्त दावा नहीं जोड़ा।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और प्रार्थनात्मक हिंदी। समानांतर आज्ञार्थक वाक्यों की काव्यात्मक गति बनाए रखी गई है; ‘याहवे’ मूल के व्यक्तिगत दिव्य नाम को दर्शाता है।
