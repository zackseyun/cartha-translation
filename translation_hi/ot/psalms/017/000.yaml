  verdict: revise
  source_fidelity: The draft accurately represents the superscription, the divine name, the three parallel petitions, and the final qualification that the prayer does not come from deceitful lips. However, ‘न्याय की बात सुन’ is somewhat vague and can sound like a request to hear a general statement about justice rather than a plea/case; ‘न्यायपूर्ण निवेदन’ better conveys the likely forensic-petitionary force while remaining within the lexical range of צֶדֶק.
  naturalness: ‘कान लगा’ is understandable but comparatively colloquial in this elevated prayer. Explicitly relating the final phrase to ‘प्रार्थना’ produces smoother Hindi and retains the Hebrew sense.
  terminology: ‘याहवे’ appropriately preserves יהוה. ‘दाऊद की प्रार्थना’ is suitable for the superscription. ‘दुहाई’ fittingly conveys רִנָּתִי as an urgent cry.
  issues:
  - severity: medium
    issue: ‘न्याय की बात’ can be misconstrued as a general matter or statement of justice.
    rationale: In this petition צֶדֶק most likely denotes the psalmist’s just cause or righteous plea. ‘न्यायपूर्ण निवेदन’ is natural Hindi and communicates that function without asserting more than the text warrants.
  - severity: low
    issue: The final clause is clearer when directly attached to ‘मेरी प्रार्थना’.
    rationale: The Hebrew phrase qualifies the prayer as not proceeding from deceitful lips. A relative clause avoids any possible ambiguity about the antecedent of ‘वह’.
