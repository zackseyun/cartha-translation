  naturalness: '‘आँख की पुतली के समान मेरी रक्षा कर’ is understandable, but ‘आँख की पुतली की तरह मेरी रक्षा कर’ is more idiomatic modern Hindi and makes the intended comparison clearer: protect me as one protects the pupil. The parallel imperative lines remain natural and prayerful.'
