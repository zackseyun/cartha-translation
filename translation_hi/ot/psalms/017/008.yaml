  text: שָׁ֭מְרֵ/נִי כְּ/אִישׁ֣וֹן בַּת עָ֑יִן בְּ/צֵ֥ל כְּ֝נָפֶ֗י/ךָ תַּסְתִּירֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/017/008.yaml
  text: Keep me like the pupil of the eye[a]; hide me in the shadow of your wings.
translation:
  language: hi
  text: 'आँख की पुतली[a] की तरह मेरी रक्षा कर;

    अपने पंखों की छाया में मुझे छिपा ले।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, पारंपरिक मुहावरे में, “आँख का तारा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמְרֵנִי
  choice: मेरी रक्षा कर
  rationale: שׁמר यहाँ सुरक्षा और सावधानी से देखभाल करने की प्रार्थना व्यक्त करता है। ‘मेरी रक्षा कर’ आधुनिक हिन्दी में स्वाभाविक है और प्रसंग का सुरक्षात्मक भाव स्पष्ट रखता है।
- source_word: כְּאִישׁוֹן בַּת עָיִן
  choice: आँख की पुतली के समान
  rationale: यह इब्रानी मुहावरा आँख की पुतली की ओर संकेत करता है—एक अत्यंत संवेदनशील अंग जिसकी सहज ही सावधानी से रक्षा की जाती है। हिन्दी का ‘आँख की पुतली’ मूल बिंब को सीधे और स्वाभाविक रूप से व्यक्त करता है।
- source_word: בְּצֵל
  choice: छाया में
  rationale: צֵל का अर्थ ‘छाया’ या ‘ओट’ हो सकता है। ‘छाया में’ पंखों से मिलने वाले सुरक्षात्मक आवरण का काव्यात्मक बिंब बनाए रखता है।
- source_word: כְּנָפֶיךָ
  choice: अपने पंखों
  rationale: כָּנָף का सीधा अर्थ ‘पंख’ है। यह रूपक परमेश्वर की सुरक्षा को सजीव काव्यात्मक भाषा में व्यक्त करता है, इसलिए इसे व्याख्यात्मक शब्द से नहीं बदला गया।
- source_word: תַּסְתִּירֵנִי
  choice: मुझे छिपा ले
  rationale: סתר के हिफ़ील रूप का अर्थ ‘छिपाना’ या ‘ओझल करना’ है। ‘मुझे छिपा ले’ प्रार्थना का आत्मीय स्वर और सुरक्षा का ठोस बिंब दोनों सुरक्षित रखता है।
theological_decisions:
- issue: आँख से जुड़े सुरक्षात्मक मुहावरे का अनुवाद
  choice: आँख की पुतली के समान
  alternative: बहुत अनमोल वस्तु के समान
  rationale: मूल पाठ अनमोलता और सतर्क सुरक्षा का भाव ठोस शारीरिक बिंब से व्यक्त करता है। बिंब को बनाए रखना उसके आशय को केवल अमूर्त व्याख्या में बदल देने से अधिक स्रोत-संगत है।
- issue: पंखों के रूपक का निर्वाह
  choice: अपने पंखों की छाया में
  alternative: अपनी सुरक्षा में
  rationale: मूल इब्रानी परमेश्वर की रक्षा को पंखों की छाया के रूप में चित्रित करता है। इस काव्यात्मक रूपक को बनाए रखने से पाठ का साहित्यिक और धर्मवैचारिक तनाव बिना अतिरिक्त व्याख्या के सुरक्षित रहता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण प्रार्थनात्मक हिन्दी में है। समानांतर काव्य-पंक्तियाँ रखी गई हैं; ‘आँख की पुतली’ और ‘पंखों की छाया’ जैसे मूल ठोस बिंब सुरक्षित हैं।
