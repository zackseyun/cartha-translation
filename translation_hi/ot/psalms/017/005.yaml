base_translation:
  language: en
  yaml_path: translation/ot/psalms/017/005.yaml
  text: My steps have held fast in your paths[b][a]; my feet have not slipped.
translation:
  language: hi
  text: मेरे कदम तेरे मार्गों से लगे रहे हैं[a]; मेरे पाँव नहीं फिसले।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरे कदमों को अपने मार्गों पर स्थिर रख”; इब्रानी को दृढ़ता के कथन या विनती—दोनों रूपों में समझा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: תָּמֹךְ
  choice: दृढ़ बने रहे हैं
  rationale: תמך में थामे रहने, सहारा देने या दृढ़ता से टिके रहने का भाव है। संदर्भ में यह चयन मार्ग पर स्थिर बने रहने को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि क्रियारूप की सम्भावित विनती वाली समझ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: אֲשֻׁרַי
  choice: मेरे कदम
  rationale: यह शब्द चलने के कदमों या चाल को दर्शाता है। ‘मेरे कदम’ आधुनिक हिन्दी में सहज है और मूल के चलने वाले रूपक को बनाए रखता है।
- source_word: בְּמַעְגְּלוֹתֶיךָ
  choice: तेरे मार्गों पर
  rationale: מַעְגָּל चलने के रास्ते, पथ या बनी हुई लीक को दर्शाता है। ‘मार्गों पर’ यहाँ सुबोध और गरिमापूर्ण है तथा सम्बन्धवाचक पूर्वसर्ग का स्वाभाविक हिन्दी रूप देता है।
- source_word: בַּל נָמֹטּוּ
  choice: नहीं फिसले
  rationale: בַּל काव्यात्मक निषेध है और מוט डगमगाने, खिसकने या फिसलने का भाव देता है। पाँवों के साथ ‘नहीं फिसले’ सबसे स्वाभाविक ठोस चित्र प्रस्तुत करता है।
- source_word: פְעָמָי
  choice: मेरे पाँव
  rationale: यह शब्द पग, पदचाप या कदमों को सूचित कर सकता है। ‘फिसले’ के साथ ‘मेरे पाँव’ सहज हिन्दी है और पहले चरण के ‘कदम’ के साथ समानान्तर काव्यात्मकता रखता है।
theological_decisions:
- issue: תָּמֹךְ को कथन या विनती के रूप में समझना
  choice: 'मुख्य पाठ में बीती/जारी दृढ़ता का कथन: ‘दृढ़ बने रहे हैं’'
  alternative: 'विनती: ‘मेरे कदमों को अपने मार्गों पर स्थिर रख’'
  rationale: इब्रानी रूप को कथन अथवा विनती दोनों रूपों में समझा गया है। अगले वाक्य ‘मेरे पाँव नहीं फिसले’ के कथनात्मक समानान्तर के कारण मुख्य पाठ में कथन चुना गया है, पर वास्तविक व्याकरणिक अस्पष्टता पादटिप्पणी में रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, काव्यात्मक और गरिमापूर्ण शैली रखी गई है। परमेश्वर के लिए एकवचन आत्मीय सम्बोधन ‘तेरे’ मूल के दूसरे पुरुष एकवचन को दर्शाता है।
