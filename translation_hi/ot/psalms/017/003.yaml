  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: בָּ֘חַ֤נְתָּ לִבִּ֨/י פָּ֘קַ֤דְתָּ לַּ֗יְלָה צְרַפְתַּ֥/נִי בַל תִּמְצָ֑א זַ֝מֹּתִ֗י בַּל יַעֲבָר פִּֽ/י׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/017/003.yaml
  text: You have examined my heart; you have visited me by night; you have tested me and find nothing[a]. I have purposed that my mouth will not transgress.
translation:
  language: hi
  text: 'तूने मेरे हृदय को परखा है;


    रात में मेरी जाँच की है;


    तूने मुझे कसौटी पर कसा है; कुछ नहीं पाया।[a]


    मैंने ठान लिया है कि मेरा मुँह मर्यादा न लाँघे।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अन्तिम खंड का अधिक शब्दशः अनुवाद हो सकता है: “मैंने ठाना है; मेरा मुँह सीमा पार न करे।” इब्रानी वाक्य संक्षिप्त है और इसका वाक्य-विन्यास कुछ अनिश्चित है।'
    reason: मूल इब्रानी के कठिन और संक्षिप्त अन्तिम खंड की शाब्दिक तथा व्याकरणिक वैकल्पिकता को सुरक्षित रखना।
lexical_decisions:
- source_word: בָּחַנְתָּ
  choice: परखा है
  rationale: यह क्रिया किसी व्यक्ति के भीतरी चरित्र या मनोभाव की जाँच को दर्शाती है। ‘परखा’ आधुनिक हिन्दी में स्वाभाविक है और मूल्यांकन के भाव को बनाए रखता है।
- source_word: לִבִּי
  choice: मेरे हृदय
  rationale: ‘हृदय’ यहाँ मनुष्य के भीतरी व्यक्तित्व, विचार और अभिप्राय का द्योतक है; इसलिए मूल रूपक को बनाए रखा गया है।
- source_word: פָּקַדְתָּ
  choice: मेरी जाँच की है
  rationale: פקד का अर्थ ‘भेंट करना’, ‘ध्यान देना’ या ‘निरीक्षण करना’ हो सकता है। इस प्रसंग में परमेश्वर की छानबीन का भाव प्रमुख है, इसलिए ‘जाँच की’ स्पष्ट और स्वाभाविक है।
- source_word: לַּיְלָה
  choice: रात में
  rationale: यह शब्द यहाँ क्रियाविशेषण की तरह समय बताता है। ‘रात में’ सहज आधुनिक हिन्दी है।
- source_word: צְרַפְתַּנִי
  choice: मुझे कसौटी पर कसा
  rationale: צרף मूलतः धातु को गलाकर शुद्ध करने या जाँचने के लिए प्रयुक्त होता है। ‘कसौटी पर कसा’ परीक्षण का अर्थ और धातु-जाँच की रूपकात्मक छाया दोनों व्यक्त करता है।
- source_word: בַל תִּמְצָא
  choice: पर कुछ नहीं पाया
  rationale: मूल में क्रिया का कर्म व्यक्त नहीं है। ‘कुछ नहीं पाया’ उसी संक्षिप्तता और अस्पष्टता को बनाए रखता है; कोई विशेष दोष या बुराई जोड़ना व्याख्यात्मक होता।
- source_word: זַמֹּתִי
  choice: मैंने ठान लिया है
  rationale: इस कठिन रूप को זמם की क्रिया, ‘मैंने निश्चय किया’, के रूप में लिया गया है। ‘ठान लिया’ दृढ़ संकल्प को सामान्य, गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: בַּל יַעֲבָר פִּי
  choice: कि मेरा मुँह मर्यादा न लाँघे
  rationale: עבר का मूल अर्थ ‘पार जाना’ है। मुँह के साथ यह वाणी में सीमा लाँघने का संकेत देता है। ‘मर्यादा न लाँघे’ मूल चित्र को बचाते हुए आशय स्पष्ट करता है।
theological_decisions:
- issue: अन्तिम पंक्ति की व्याख्या
  choice: 'इसे भजनकार के वाणी-संबंधी संकल्प के रूप में प्रस्तुत किया गया है: ‘मैंने ठान लिया है कि मेरा मुँह मर्यादा न लाँघे।’'
  alternative: इसे अधिक शब्दशः ‘मैंने ठाना है; मेरा मुँह पार न जाए’ अथवा कथन के रूप में ‘मेरा मुँह मर्यादा नहीं लाँघता’ भी समझा जा सकता है।
  rationale: इब्रानी वाक्य अत्यन्त संक्षिप्त और कुछ कठिन है। זַמֹּתִי को क्रियात्मक रूप मानकर अगली उपवाक्यांश को उसके संकल्प की विषयवस्तु समझना प्रसंगानुकूल है, किन्तु पादटिप्पणी में मूल की संक्षिप्तता और वैकल्पिक विन्यास सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, काव्यात्मक किन्तु सामान्य पाठक के लिए सुबोध रखी गई है। परमेश्वर को संबोधन में एकवचन ‘तू’ भजन की सीधी और निकट संबोधन-शैली के अनुरूप है। समानार्थी परीक्षण-क्रियाओं में ‘परखा’, ‘जाँच की’ और ‘कसौटी पर कसा’ का प्रयोग मूल की क्रमिक पुनरुक्ति तथा धातु-परख रूपक को बनाए रखता है।
