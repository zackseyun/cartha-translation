  text: परन्तु मैं[a] धार्मिकता में तेरे मुख का दर्शन करूँगा; जब मैं जागूँगा[b], तब तेरे स्वरूप[c] से तृप्त होऊँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘परन्तु मैं’ पिछले पद में वर्णित लोगों के विपरीत भजनकार पर बल देता है।
    reason: discourse_emphasis
  - marker: b
    text: ‘जब मैं जागूँगा’ का अर्थ साधारण नींद से जागना हो सकता है; इसे अन्तिम न्याय में न्यायोचित ठहराए जाने या पुनरुत्थान की जागृति के रूप में भी समझा गया है।
    reason: alternative_reading
  - marker: c
    text: या, ‘तेरे रूप’ अथवा ‘तेरे प्रतिरूप’ से।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּצֶדֶק
  choice: धार्मिकता में
  rationale: צֶדֶק धार्मिकता या न्याय को दर्शाता है। यह चयन इब्रानी की संक्षिप्तता बनाए रखता है और यह तय नहीं करता कि यहाँ भजनकार की खराई, परमेश्वर का न्यायपूर्ण समर्थन, या कोई न्यायिक स्थिति अभिप्रेत है।
- source_word: אֶחֱזֶה
  choice: दर्शन करूँगा
  rationale: חזה केवल सामान्य रूप से देखने के बजाय ध्यानपूर्वक देखने या निहारने का भाव रख सकता है। ‘दर्शन करूँगा’ काव्यात्मक गरिमा और परमेश्वर के मुख को देखने के भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: פָנֶיךָ
  choice: तेरे मुख
  rationale: इब्रानी का ठोस अर्थ ‘तेरा मुख’ है। ‘उपस्थिति’ सम्भावित निहितार्थ है, पर मुख्य पाठ में मूल बिंब रखा गया है।
- source_word: אֶשְׂבְּעָה
  choice: तृप्त होऊँगा
  rationale: שׂבע का अर्थ भर जाना या तृप्त होना है। यह चयन भावी परिणाम को सहज और संक्षिप्त हिन्दी में व्यक्त करता है।
- source_word: בְּהָקִיץ
  choice: जब मैं जागूँगा
  rationale: ב के साथ infinitive construct समय बताता है। यह हिन्दी में स्वाभाविक है और साधारण नींद से जागने तथा अन्तिम जागृति—दोनों सम्भावनाओं को खुला रखता है।
- source_word: תְּמוּנָתֶךָ
  choice: तेरे स्वरूप
  rationale: תְּמוּנָה स्वरूप, आकृति या प्रतिरूप को दर्शा सकता है। ‘स्वरूप’ हिन्दी में गरिमापूर्ण है और किसी निश्चित भौतिक आकृति का अनावश्यक संकेत नहीं देता।
theological_decisions:
- issue: क्या בְּהָקִיץ साधारण नींद से जागने को बताता है या पुनरुत्थान/अन्तिम समर्थन की आशा को
  choice: मुख्य पाठ में केवल ‘जब मैं जागूँगा’ रखा गया है।
  alternative: इसे प्रतिदिन नींद से जागना, अथवा मृत्यु के बाद अन्तिम जागृति या पुनरुत्थान समझा जा सकता है।
  rationale: इब्रानी स्वयं जागने के प्रकार को स्पष्ट नहीं करता। इसलिए मुख्य पाठ धर्मवैज्ञानिक तनाव और वास्तविक अस्पष्टता को बनाए रखता है; सम्भावनाएँ पादटिप्पणी में दी गई हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी में काव्यात्मक और गरिमापूर्ण शैली रखी गई है। परमेश्वर के लिए एकवचन आत्मीय ‘तेरे’ मूल इब्रानी के दूसरे पुरुष एकवचन को स्पष्ट रखता है। ‘मुख का दर्शन’ और ‘स्वरूप से तृप्त’ मूल बिंबों को बनाए रखते हुए साधारण पाठक के लिए बोधगम्य हैं।
