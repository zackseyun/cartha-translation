  text: הַפְלֵ֣ה חֲ֭סָדֶי/ךָ מוֹשִׁ֣יעַ חוֹסִ֑ים מִ֝/מִּתְקוֹמְמִ֗ים בִּֽ/ימִינֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/017/007.yaml
  text: Show your wondrous steadfast love[a], O Savior of those who take refuge from those who rise up against them[b], by your right hand.
translation:
  language: hi
  text: अपनी अद्भुत अटल करुणा दिखा[a], हे अपने दाहिने हाथ से शरण लेनेवालों को उनके विरुद्ध उठनेवालों से बचानेवाले[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपनी अटल करुणा को अद्भुत बना”; हिब्रू आज्ञार्थक का अर्थ किसी बात को अद्भुत या विशिष्ट बनाना अथवा उसे अद्भुत रूप में प्रकट करना हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: 'अंतिम पदबंध को ‘शरण लेनेवालों’ के साथ भी जोड़ा जा सकता है: “हे तेरे दाहिने हाथ की शरण लेनेवालों को उनके विरुद्ध उठनेवालों से बचानेवाले।”'
    reason: alternative_reading
lexical_decisions:
- source_word: הַפְלֵה
  choice: अद्भुत ... दिखा
  rationale: हिफ़ईल आज्ञार्थक रूप किसी वस्तु को अद्भुत या विशिष्ट करके दिखाने का भाव देता है। प्रार्थना के संदर्भ में यह स्वाभाविक हिन्दी अभिव्यक्ति परमेश्वर से उसकी करुणा को असाधारण रीति से प्रकट करने का निवेदन करती है।
- source_word: חֲסָדֶיךָ
  choice: अपनी ... अटल करुणा
  rationale: חסד में दया, निष्ठा और संबंध के प्रति स्थिर प्रेम का संयुक्त भाव है। ‘अटल करुणा’ साधारण पाठक के लिए सुबोध रहते हुए उसकी स्थिरता और कृपापूर्ण स्वरूप को व्यक्त करती है।
- source_word: מוֹשִׁיעַ
  choice: हे ... बचानेवाले
  rationale: यह कृदन्त यहाँ सम्बोधन या समानाधिकरण की तरह परमेश्वर को बचानेवाले के रूप में पुकारता है। हिन्दी में ‘हे ... बचानेवाले’ इस प्रार्थनात्मक सम्बोधन को स्पष्ट और स्वाभाविक बनाता है।
- source_word: חוֹסִים
  choice: शरण लेनेवालों
  rationale: חסה सुरक्षा पाने के लिए शरण लेने का ठोस बिंब रखता है; ‘शरण लेनेवाले’ केवल अमूर्त ‘भरोसा करनेवालों’ की अपेक्षा उस बिंब को सुरक्षित रखता है।
- source_word: מִמִּתְקוֹמְמִים
  choice: उनके विरुद्ध उठनेवालों से
  rationale: קום का यह कृदन्त रूप विरोध में उठ खड़े होनेवालों को दर्शाता है और מן उनसे बचाए जाने का भाव देता है। विरोध का लक्ष्य हिब्रू में अव्यक्त है; निकटवर्ती ‘शरण लेनेवालों’ के आधार पर ‘उनके विरुद्ध’ स्वाभाविक पूर्ति है।
- source_word: בִּימִינֶךָ
  choice: अपने दाहिने हाथ से
  rationale: मुख्य पाठ में यह परमेश्वर के बचाने के साधन को दर्शाता है। ‘दाहिने हाथ से’ शक्ति के मानवरूपी बिंब को बनाए रखते हुए वर्तमान हिन्दी में स्वाभाविक है।
theological_decisions:
- issue: अंतिम पदबंध בִּימִינֶךָ का वाक्यगत संबंध
  choice: 'इसे परमेश्वर के बचाने के कार्य से जोड़ा गया है: ‘अपने दाहिने हाथ से ... बचानेवाले।’'
  alternative: 'इसे शरण लेनेवालों से भी जोड़ा जा सकता है: ‘तेरे दाहिने हाथ में शरण लेनेवालों।’ एक कम संभावित संबंध ‘तेरे दाहिने हाथ के विरुद्ध उठनेवालों’ से भी माना गया है।'
  rationale: हिब्रू में पूर्वसर्गीय पदबंध अंत में आने के कारण संबंध कुछ अस्पष्ट है। संदर्भ में परमेश्वर द्वारा अपने दाहिने हाथ से बचाना सर्वाधिक सुसंगत है, पर वास्तविक वैकल्पिक संबंध को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और प्रार्थनात्मक रखी गई है। ‘हे ... बचानेवाले’ मूल के सम्बोधन को और ‘दाहिने हाथ’ शक्ति के मानवरूपी बिंब को सुरक्षित रखते हैं। संयुक्त पदक्रम मूल अर्थ को स्पष्ट करता है, जबकि वास्तविक वाक्यगत अस्पष्टता पादटिप्पणी में दी गई है।
