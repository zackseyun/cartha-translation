  text: As for the deeds of man[a], by the word of your lips I have kept myself from the paths of the violent.
translation:
  language: hi
  text: मनुष्य के कर्मों के विषय में, तेरे होंठों के वचन से मैंने अपने आप को हिंसक व्यक्ति के मार्गों से बचाए रखा है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, अधिक शब्दशः: “मैंने हिंसक व्यक्ति के मार्गों का पालन किया है” अथवा “उन पर निगरानी रखी है।” इब्रानी क्रिया का अर्थ ‘बचाए रखना’ भी हो सकता है; प्रसंग हिंसक मार्गों से दूर रहने के अर्थ का समर्थन करता है।'
    reason: alternative_reading
lexical_decisions:
- source_word: לִפְעֻלּוֹת אָדָם
  choice: मनुष्य के कर्मों के विषय में
  rationale: לְ यहाँ विषय या क्षेत्र का संकेत देता है। אָדָם एकवचन में सामान्य रूप से मानव को दर्शाता है; इसलिए ‘मनुष्य’ मूल की व्याकरणिक बनावट और व्यापक अर्थ दोनों को बनाए रखता है।
- source_word: בִּדְבַר שְׂפָתֶיךָ
  choice: तेरे होंठों के वचन के द्वारा
  rationale: בְ को साधनसूचक रूप में लिया गया है। ‘होंठों का वचन’ परमेश्वर की वाणी के लिए मूल की काव्यात्मक और मानवरूपी अभिव्यक्ति को सुरक्षित रखता है।
- source_word: שָׁמַרְתִּי
  choice: मैंने अपने आपको ... से बचाए रखा है
  rationale: שׁמר का मूल अर्थ रखना, रक्षा करना या सावधानी से देखना है। इस प्रसंग में यह हिंसक मार्गों से आत्म-संयमपूर्वक दूर रहने का भाव देता है; ‘अपने आपको’ हिंदी में इस आशय को स्वाभाविक रूप से स्पष्ट करता है।
- source_word: אָרְחוֹת
  choice: मार्गों
  rationale: यह जीवन-चाल या आचरण के लिए प्रयुक्त पथ का रूपक है। ‘मार्ग’ काव्यात्मक होने के साथ आधुनिक हिंदी में सहज है।
- source_word: פָּרִיץ
  choice: हिंसक जन
  rationale: यह शब्द हिंसक या क्रूर व्यक्ति को दर्शाता है, केवल सामान्य अपराधी को नहीं। एकवचन सामूहिक रूप ‘हिंसक जन’ मूल के रूप को बनाए रखते हुए उसके सामान्य आशय को व्यक्त करता है।
theological_decisions:
- issue: שָׁמַרְתִּי के साथ उपवाक्य का अर्थ
  choice: भजनकार परमेश्वर के वचन के द्वारा अपने आपको हिंसक जन के मार्गों से बचाए रखने की बात कहता है।
  alternative: भजनकार ने हिंसक जन के मार्गों को देखा या उन पर निगाह रखी है।
  rationale: שׁמר में ‘देखना/पालन करना/रक्षा करना’ जैसे अर्थ संभव हैं, पर निर्दोष चाल के दावे और परमेश्वर के वचन की साधनसूचक भूमिका के कारण यहाँ दूर रहने या बचाए रखने का अर्थ अधिक संगत है। वास्तविक भाषिक विकल्प पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण काव्यात्मक शैली रखी गई है। परमेश्वर के लिए एकवचन आत्मीय संबोधन ‘तेरे’ मूल के द्वितीय पुरुष एकवचन को दर्शाता है। ‘होंठों के वचन’ और ‘मार्गों’ जैसे मूल रूपकों को सरल किए बिना स्वाभाविक हिंदी में रखा गया है।
