  register: भाषा आधुनिक मानक हिन्दी की है, पर भजन की काव्यात्मक गरिमा बनाए रखी गई है। ‘पेट भरता है’ जैसे ठोस बिंब को सुरक्षित रखा गया है। ‘याहवे’ मूल व्यक्तिगत नाम का देवनागरी लिप्यंतरण है। पद की आरंभिक अपूर्ण वाक्यरचना को हिन्दी में पिछले पद की निहित विनती के साथ स्वाभाविक बनाया गया है और उसकी वास्तविक अस्पष्टता पादटिप्पणी में रखी गई है।
