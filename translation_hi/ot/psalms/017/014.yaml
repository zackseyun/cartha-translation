base_translation:
  language: en
  yaml_path: translation/ot/psalms/017/014.yaml
  text: from men by your hand[a], O Yahweh, from men of the world, whose portion is in this life. You fill their belly with your stored-up treasure; they are satisfied with sons[c][b], and they leave their abundance to their children.
translation:
  language: hi
  text: 'हे याहवे, अपने हाथ से मुझे मनुष्यों से बचा[a]—इस संसार के उन मनुष्यों से,

    जिनका भाग इसी जीवन में है।


    तू अपनी संचित संपदा से उनका पेट भरता है;

    वे पुत्रों से तृप्त होते हैं[b]

    और अपनी बची हुई संपत्ति अपने नन्हे बच्चों के लिए छोड़ जाते हैं[c]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप से यह वाक्य संक्षिप्त है: “मनुष्यों से, तेरे हाथ के द्वारा, हे याहवे।” इसका अर्थ “अपने हाथ से मुझे मनुष्यों से बचा” या संभवतः “तेरे हाथ के मनुष्यों से” हो सकता है।'
    reason: alternative_reading
  - marker: b
    text: या, “उनके पुत्र तृप्त होते हैं।” इब्रानी में “पुत्र” है; यह अनेक पुरुष-संतान को समृद्धि के चिह्न के रूप में भी सूचित कर सकता है।
    reason: alternative_reading
  - marker: c
    text: इब्रानी में अधिक विशेष रूप से “अपने नन्हे बच्चों”।
    reason: lexical_alternative
lexical_decisions:
- source_word: מִמְתִים יָדְךָ יְהוָה
  choice: हे याहवे, अपने हाथ से मुझे मनुष्यों से बचा
  rationale: इब्रानी वाक्यरचना संक्षिप्त है और पिछले पद की उद्धार-विनती को आगे बढ़ाती है। स्वाभाविक हिन्दी के लिए निहित क्रिया और कर्म को स्पष्ट किया गया है, जबकि पादटिप्पणी में मूल की संक्षिप्तता और वैकल्पिक संबंध सुरक्षित रखा गया है। יְהוָה को व्यक्तिगत नाम के रूप में ‘याहवे’ लिखा गया है।
- source_word: מֵחֶלֶד
  choice: इस संसार के
  rationale: यहाँ חֶלֶד वर्तमान, क्षणभंगुर मानवीय संसार या युग को सूचित करता है। ‘इस संसार के’ सामान्य हिन्दी में उस वर्तमान जीवन-क्षेत्र को व्यक्त करता है, बिना आगे की धर्मवैज्ञानिक व्याख्या जोड़े।
- source_word: חֶלְקָם בַּחַיִּים
  choice: जिनका भाग इसी जीवन में है
  rationale: ‘भाग’ हिस्से या नियत प्राप्ति की धारणा बनाए रखता है; ‘इसी जीवन में’ प्रसंग के वर्तमान-कालिक बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וּצְפוּנְךָ תְּמַלֵּא בִטְנָם
  choice: तू अपने भंडार से उनका पेट भरता है
  rationale: צפון से छिपाकर या संचित रखी वस्तु का भाव आता है। ‘अपने भंडार से’ उस संचित प्रचुरता को स्वाभाविक रूप से व्यक्त करता है, और ‘पेट भरता है’ इब्रानी के ठोस बिंब को बनाए रखता है।
- source_word: יִשְׂבְּעוּ בָנִים
  choice: वे पुत्रों से तृप्त होते हैं
  rationale: मुख्य पाठ में בָנִים को तृप्ति की वस्तु मानकर ‘पुत्रों’ का स्पष्ट पुल्लिंग अर्थ रखा गया है। वाक्यरचना ‘उनके पुत्र तृप्त होते हैं’ भी हो सकती है, इसलिए उसे पादटिप्पणी में दिया गया है।
- source_word: וְהִנִּיחוּ יִתְרָם
  choice: अपनी बची हुई संपत्ति ... छोड़ जाते हैं
  rationale: יֶתֶר बची हुई मात्रा, अधिशेष या प्रचुरता को दर्शाता है। उत्तराधिकार के प्रसंग में ‘बची हुई संपत्ति’ अर्थ को स्पष्ट और स्वाभाविक बनाती है।
- source_word: לְעוֹלְלֵיהֶם
  choice: अपने बाल-बच्चों के लिए
  rationale: עוֹלֵל विशेष रूप से छोटे बच्चे को सूचित करता है। ‘बाल-बच्चों’ से हिन्दी में वंशजों के लिए छोड़ी गई संपत्ति का भाव स्वाभाविक रहता है; अधिक शाब्दिक अर्थ पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: विरोधी मनुष्यों और परमेश्वर के हाथ का संबंध
  choice: अपने हाथ से मुझे मनुष्यों से बचा
  alternative: मनुष्यों से—तेरे हाथ के द्वारा / तेरे हाथ के मनुष्यों से
  rationale: पिछले पद से उद्धार की विनती ग्रहण करने पर यह स्वाभाविक पाठ बनता है। फिर भी संक्षिप्त इब्रानी यह निश्चित नहीं करती कि ‘तेरा हाथ’ उद्धार का साधन है या मनुष्यों का विशेषण; इसलिए वैकल्पिक संबंध पादटिप्पणी में सुरक्षित है।
- issue: दुष्टों की वर्तमान जीवन में समृद्धि
  choice: जिनका भाग इसी जीवन में है
  alternative: जिनका भाग जीवितों के बीच है
  rationale: पाठ उनकी वर्तमान सांसारिक प्राप्ति पर बल देता है। अनुवाद भविष्य के न्याय या परलोक के विषय में ऐसा कोई स्पष्ट दावा नहीं जोड़ता जिसे यह पद स्वयं नहीं कहता।
- issue: יִשְׂבְּעוּ בָנִים की वाक्यगत अस्पष्टता
  choice: वे पुत्रों से तृप्त होते हैं
  alternative: उनके पुत्र तृप्त होते हैं
  rationale: दोनों विश्लेषण इब्रानी की संक्षिप्त रचना में संभव हैं। मुख्य पाठ समृद्धि के चिह्न के रूप में अनेक पुत्रों का भाव रखता है, पर दूसरा पाठ पादटिप्पणी में दिया गया है।
