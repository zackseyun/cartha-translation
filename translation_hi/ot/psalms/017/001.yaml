base_translation:
  language: en
  yaml_path: translation/ot/psalms/017/001.yaml
  text: A prayer of David. Hear[a], O Yahweh, a just cause; attend to my cry; give ear to my prayer from lips without deceit.
translation:
  language: hi
  text: 'दाऊद की प्रार्थना।


    हे याहवे, मेरे न्यायसंगत पक्ष को सुन[a]; मेरी दुहाई पर ध्यान दे; मेरी उस प्रार्थना पर कान लगा जो छलरहित होंठों से निकलती है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “न्याय को सुन।” इब्रानी צֶדֶק का अर्थ धार्मिकता, न्याय या न्यायपूर्ण पक्ष हो सकता है; यहाँ संभवतः भजनकार के न्यायसंगत मामले की बात है।
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּפִלָּה לְדָוִד
  choice: दाऊद की प्रार्थना
  rationale: भजन के शीर्षक में לְ के साथ व्यक्ति का नाम सामान्यतः रचना अथवा संबद्धता दर्शाता है; हिन्दी में ‘दाऊद की प्रार्थना’ स्वाभाविक है।
- source_word: שִׁמְעָה
  choice: सुन
  rationale: आज्ञार्थक निवेदन की सीधी शक्ति बनाए रखता है और सुनने से जुड़े अगले दो समानांतर आग्रहों के अनुकूल है।
- source_word: יְהוָה
  choice: हे याहवे
  rationale: मूल पाठ के व्यक्तिगत ईश्वरीय नाम को उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है; सम्बोधन के कारण ‘हे’ जोड़ा गया है।
- source_word: צֶדֶק
  choice: न्यायपूर्ण पक्ष
  rationale: यहाँ शब्द ‘सुन’ का कर्म है और प्रसंग में अमूर्त धार्मिकता से अधिक प्रार्थी के न्यायसंगत मामले अथवा पक्ष की ओर संकेत करता है।
- source_word: הַקְשִׁיבָה
  choice: ध्यान दे
  rationale: קשׁב के हिफ़ील आज्ञार्थक का आशय ध्यानपूर्वक सुनना है; यह आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: רִנָּתִי
  choice: मेरी दुहाई
  rationale: विलाप और प्रार्थना के प्रसंग में यह ऊँची, व्याकुल पुकार को व्यक्त करता है; ‘दुहाई’ उसकी तीव्रता बनाए रखती है।
- source_word: הַאֲזִינָה
  choice: कान लगा
  rationale: मूल की कान देकर सुनने वाली काव्यात्मक छवि को सहज हिन्दी में सुरक्षित रखता है।
- source_word: תְפִלָּתִי
  choice: मेरी प्रार्थना
  rationale: शीर्षक में आए תְּפִלָּה के साथ शब्दगत संबंध बनाए रखता है।
- source_word: בְּלֹא שִׂפְתֵי מִרְמָה
  choice: छलरहित होंठों से निकली
  rationale: वाक्यांश प्रार्थना के स्रोत और वक्ता की निष्कपटता को बताता है; हिन्दी में इसे प्रार्थना से पहले रखने पर अर्थ स्पष्ट और प्रवाह स्वाभाविक रहता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल में वाचा-संबंधी व्यक्तिगत नाम सीधे आया है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और उसे किसी उपाधि से प्रतिस्थापित नहीं करता।
- issue: צֶדֶק का आशय
  choice: न्यायपूर्ण पक्ष
  alternative: धार्मिकता; न्याय; जो उचित है
  rationale: रूप की संक्षिप्तता कुछ अर्थगत खुलापन रखती है, पर इस न्याय-विनती के प्रसंग में प्रार्थी का न्यायसंगत पक्ष सर्वाधिक उपयुक्त है; वैकल्पिक शाब्दिक समझ पादटिप्पणी में रखी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक रखी गई है। ‘सुन’, ‘ध्यान दे’ और ‘कान लगा’ मूल के तीन समानांतर श्रवण-संबंधी आग्रहों का भेद बनाए रखते हैं।
