  text: from the wicked who devastate me[a], my deadly enemies who surround me.
translation:
  language: hi
  text: 'उन दुष्टों से जो मुझे बरबाद करते हैं,

    मेरे प्राण लेने पर तुले शत्रुओं से, जो मुझे चारों ओर से घेरते हैं।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरे शत्रु मेरे प्राण के विरुद्ध मुझे घेरते हैं।” इब्रानी पदबंध में शाब्दिक रूप से “प्राण/जीवन” (בְּנֶפֶשׁ) है; यह ऐसे शत्रुओं को दर्शा सकता है जो भजनकार का जीवन लेना चाहते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: מִפְּנֵי
  choice: से
  rationale: यहाँ पदबंध उस शत्रुतापूर्ण स्रोत को बताता है जिससे भजनकार रक्षा चाहता है; हिंदी में ‘से’ स्वाभाविक और सटीक है।
- source_word: רְשָׁעִים
  choice: दुष्टों
  rationale: यह संज्ञा के रूप में प्रयुक्त बहुवचन विशेषण है और नैतिक रूप से दोषी लोगों को दर्शाता है; ‘दुष्टों’ संक्षिप्त है तथा मूल में निहित न होने वाले लिंग को नहीं जोड़ता।
- source_word: זוּ
  choice: जो
  rationale: यह संबंधवाचक अव्यय ‘दुष्टों’ को अगले क्रियापद से जोड़ता है; व्यक्तियों के लिए ‘जो’ स्वाभाविक हिंदी रूप है।
- source_word: שַׁדּוּנִי
  choice: मुझे उजाड़ते हैं
  rationale: שׁדד हिंसक विनाश या लूटकर बरबाद करने का भाव रखता है। ‘उजाड़ते हैं’ इस प्रबल हानि को व्यक्त करता है, पर पूर्ण संहार का अर्थ अनावश्यक रूप से नहीं जोड़ता।
- source_word: אֹיְבַי
  choice: मेरे ... शत्रुओं
  rationale: यह प्रथम पुरुष एकवचन संबंधसूचक प्रत्यय सहित बहुवचन संज्ञा है; ‘मेरे शत्रुओं’ इसका सीधा हिंदी रूप है।
- source_word: בְּנֶפֶשׁ
  choice: प्राण के
  rationale: शाब्दिक रूप से इसमें ‘प्राण/जीवन’ का शब्द है। ‘मेरे प्राण के शत्रु’ उन शत्रुओं को दर्शाता है जो भजनकार के जीवन के पीछे पड़े हैं, साथ ही मूल पदबंध की अर्थगत खुली प्रकृति को काफी हद तक बनाए रखता है।
- source_word: יַקִּיפוּ עָלָי
  choice: मुझे चारों ओर से घेरते हैं
  rationale: נקף का हिफ़ील रूप עַל के साथ चारों ओर घेरने या घेरा डालने का अर्थ देता है; यह हिंदी रूप स्पष्ट और चित्रात्मक है।
theological_decisions:
- issue: בְּנֶפֶשׁ का संबंध और अर्थ
  choice: ‘मेरे प्राण के शत्रु’—अर्थात मेरे जीवन के विरुद्ध शत्रु
  alternative: ‘मेरे शत्रु प्राण लेने को मुझे घेरते हैं’ या ‘घोर शत्रु’
  rationale: मूल में נֶפֶשׁ स्पष्ट रूप से ‘प्राण/जीवन’ उपस्थित रखता है, पर पदबंध का व्याकरणिक-अर्थगत बल पूरी तरह निश्चित नहीं है। मुख्य पाठ जीवन पर मंडराते खतरे को बनाए रखता है और पादटिप्पणी वैकल्पिक विन्यास बताती है।
translation_notes:
  register: आधुनिक मानक हिंदी का गरिमापूर्ण, काव्यात्मक किंतु सहज रूप रखा गया है। ‘प्राण’ भजन-साहित्य के अनुरूप है और सामान्य पाठक के लिए बोधगम्य भी; ‘उजाड़ते हैं’ हिंसक बरबादी का जीवंत भाव देता है।
