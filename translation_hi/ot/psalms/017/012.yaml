translation:
  language: hi
  text: वह सिंह के समान है जो शिकार को फाड़ने के लिए लालायित है, और जवान सिंह के समान जो छिपने की जगहों में घात लगाए बैठा है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप से: “बैठा है”; यहाँ प्रसंग छिपकर घात लगाने का है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּמְיֹנוֹ כְּאַרְיֵה
  choice: वह उस सिंह के समान है
  rationale: शाब्दिक रूप से आरंभ में ‘उसकी समानता सिंह के समान’ जैसा संज्ञात्मक विन्यास है, पर हिंदी में वह अनावश्यक रूप से दोहरावपूर्ण होगा। सीधी उपमा अर्थ को स्वाभाविक और स्पष्ट रूप में रखती है।
- source_word: יִכְסוֹף לִטְרוֹף
  choice: शिकार को फाड़ खाने के लिए लालायित है
  rationale: כסף तीव्र इच्छा या लालसा व्यक्त करता है, और טרף सिंह द्वारा शिकार को पकड़कर फाड़ने के बिंब से जुड़ा है। संयुक्त पद मूल की हिंसक शिकारी छवि को स्पष्ट रखता है।
- source_word: וְכִכְפִיר
  choice: उस जवान सिंह के समान
  rationale: כפיר जवान सिंह को सूचित करता है। पुनरुक्त उपमा को हिंदी में समानांतर ढंग से व्यक्त किया गया है।
- source_word: יֹשֵׁב
  choice: घात लगाए बैठा है
  rationale: मूल कृदंत का सीधा अर्थ ‘बैठा हुआ’ है, किंतु छिपने की जगहों का संदर्भ घात की स्थिति बताता है। ‘घात लगाए बैठा’ शाब्दिक बैठने और प्रसंगगत ambush—दोनों को बनाए रखता है।
- source_word: בְּמִסְתָּרִים
  choice: छिपने की जगहों में
  rationale: बहुवचन रूप को बनाए रखते हुए यह आधुनिक हिंदी में छिपी या गुप्त जगहों का स्वाभाविक वर्णन है।
