  yaml_path: translation/ot/psalms/017/002.yaml
  text: May my judgment come forth from before you[b][a]; may your eyes behold what is upright.
translation:
  language: hi
  text: तेरे सामने से मेरा न्याय निकले[a]; तेरी आँखें जो कुछ न्यायसंगत है उसे देखें[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तेरी उपस्थिति से मेरा न्याय निकले” अथवा “तेरे सामने से मेरा फैसला निकले।”
    reason: alternative_reading
  - marker: b
    text: या, “तेरी आँखें निष्पक्षता को देखें” अथवा “जो सही है उसे देखें।”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִלְּפָנֶיךָ
  choice: तेरे सामने से
  rationale: यह इब्रानी पदबंध परमेश्वर के मुख या उपस्थिति के सामने से निकलने की स्थानिक और न्यायालय-संबंधी छवि रखता है।
- source_word: מִשְׁפָּטִי
  choice: मेरे पक्ष में न्याय
  rationale: מִשְׁפָּטִי का अर्थ मेरे विषय का न्याय, निर्णय या पक्ष-समर्थन हो सकता है। हिंदी में यह प्रयोग न्यायिक संदर्भ को स्पष्ट रखते हुए केवल दंडात्मक ‘फैसले’ का आभास नहीं देता।
- source_word: יֵצֵא
  choice: निकले
  rationale: יצא का मूल अर्थ बाहर निकलना है; यहाँ निर्णय के परमेश्वर की उपस्थिति से जारी होने की काव्यात्मक छवि बनी रहती है।
- source_word: עֵינֶיךָ
  choice: तेरी आँखें
  rationale: मूल पाठ की सजीव मानवरूपी अभिव्यक्ति को अमूर्त ‘तू’ में नहीं बदला गया।
- source_word: תֶּחֱזֶינָה
  choice: देखें
  rationale: חזה ध्यानपूर्वक देखने का अर्थ दे सकता है; आधुनिक हिंदी में ‘देखें’ स्वाभाविक है और संदर्भ निरीक्षण का भाव देता है।
- source_word: מֵישָׁרִים
  choice: वही जो सीधा है
  rationale: बहुवचन संज्ञा का अर्थ सीधापन, निष्पक्षता या जो ठीक है हो सकता है। यह रूप नैतिक और न्यायिक दोनों आयामों को खुला रखता है।
theological_decisions:
- issue: क्रियाओं को निवेदन माना जाए या भविष्य/घोषणा
  choice: 'निवेदन: ‘निकले… देखें’'
  alternative: 'घोषणा या भविष्य: ‘निकलेगा… देखती हैं/देखेंगी’'
  rationale: इब्रानी अपूर्ण क्रियाएँ साधारण भविष्य भी व्यक्त कर सकती हैं, पर प्रार्थना के संदर्भ में इच्छासूचक निवेदन स्वाभाविक है। हिंदी की विधिलिंग दोनों पंक्तियों को विनती के रूप में रखती है, जबकि व्याकरण से अधिक निश्चितता नहीं जोड़ती।
- issue: מִשְׁפָּטִי में निर्णय बनाम दोषमुक्ति
  choice: ‘मेरे पक्ष में न्याय’
  alternative: ‘मेरा फैसला’ या ‘मेरा निर्दोष ठहराया जाना’
  rationale: पद न्यायपूर्ण अनुकूल निर्णय की याचना करता है, पर ‘निर्दोष ठहराया जाना’ परिणाम को अधिक स्पष्ट कर देगा। चुना हुआ रूप न्यायिक आशय बताता है और अर्थ-सीमा को खुला रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और काव्यात्मक हिंदी। परमेश्वर को संबोधित करने में भजन की निकटता बनाए रखने के लिए ‘तेरे/तेरी’ रखा गया है। ‘सामने से’ मूल की स्थानिक-न्यायालयीय छवि और ‘तेरी आँखें’ उसकी मूर्त काव्यात्मकता को सुरक्षित रखते हैं।
