  text: מִ֤י גֶ֣בֶר יִֽ֭חְיֶה וְ/לֹ֣א יִרְאֶה מָּ֑וֶת יְמַלֵּ֨ט נַפְשׁ֖/וֹ מִ/יַּד שְׁא֣וֹל סֶֽלָה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/048.yaml
  text: What man can live and not see death? Can he deliver his soul from the hand of Sheol? Selah[a][b][c]
translation:
  language: hi
  text: कौन ऐसा मनुष्य है जो जी सकता है और मृत्यु को न देखे?[a] क्या वह अपने प्राण को शिओल के हाथ से छुड़ा सकता है?[b][c] सेला।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा, “मृत्यु का अनुभव न करे।” शाब्दिक रूप से, “मृत्यु को न देखे।”
    reason: lexical_alternative
  - marker: b
    text: “अपने प्राण” का अनुवाद “अपने जीवन” या “अपने आपको” भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: “शिओल” मृतकों के लोक के लिए इब्रानी शब्द है; इसका अनुवाद “कब्र” भी किया जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: מִי גֶבֶר
  choice: कौन ऐसा मनुष्य
  rationale: यह आलंकारिक प्रश्न है। ‘मनुष्य’ גֶבֶר के पुरुषवाची रूप को बनाए रखता है, जबकि कथन समस्त मानवजाति की मृत्युशीलता को दर्शाता है।
- source_word: יִחְיֶה
  choice: जीवित रहे
  rationale: अपूर्ण क्रिया यहाँ आलंकारिक प्रश्न में संभावना का भाव देती है; हिंदी में ‘जीवित रहे’ स्वाभाविक रूप से यही अर्थ व्यक्त करता है।
- source_word: וְלֹא יִרְאֶה מָוֶת
  choice: और मृत्यु को न देखे
  rationale: मूल इब्रानी के ‘मृत्यु देखना’ रूपक को मुख्य पाठ में सुरक्षित रखा गया है; इसका आशय मृत्यु का अनुभव करना है।
- source_word: יְמַלֵּט
  choice: छुड़ा सकता है
  rationale: पिएल रूप किसी को बच निकलने देने या छुड़ाने का अर्थ देता है। प्रश्न की संभावना हिंदी में ‘सकता है’ से स्पष्ट होती है।
- source_word: נַפְשׁוֹ
  choice: अपने प्राण को
  rationale: נפש यहाँ ‘प्राण’, ‘जीवन’ या ‘स्वयं’ का संकेत दे सकता है। ‘प्राण’ मृत्यु और अधोलोक के काव्यात्मक संदर्भ में स्वाभाविक है और अर्थ को केवल अमूर्त आत्मा तक सीमित नहीं करता।
- source_word: מִיַּד
  choice: के हाथ से
  rationale: मूल रूपक अधिकार, पकड़ या शक्ति को ‘हाथ’ द्वारा व्यक्त करता है; हिंदी में भी यह बोधगम्य है।
- source_word: שְׁאוֹל
  choice: अधोलोक
  rationale: ‘अधोलोक’ मृतकों के लोक के लिए प्रचलित और सुबोध हिंदी पद है। इसे ‘नरक’ नहीं बनाया गया, क्योंकि वह बाद की विशिष्ट दंड-संबंधी धारणा आरोपित कर सकता है।
- source_word: סֶלָה
  choice: सेला
  rationale: इस संगीतात्मक अथवा पाठगत संकेत का ठीक अर्थ अनिश्चित है, इसलिए पारंपरिक लिप्यंतरण रखा गया है।
theological_decisions:
- issue: שְׁאוֹל का अर्थ
  choice: अधोलोक
  alternative: मृतकों का लोक; कब्र
  rationale: संदर्भ मृत्यु की सार्वभौमिकता और मृतकों के लोक की पकड़ से मनुष्य की असमर्थता पर है। ‘अधोलोक’ इस इब्रानी धारणा को ‘नरक’ की बाद की विशिष्ट शिक्षा से नहीं मिलाता; विकल्प पादटिप्पणी में दिए गए हैं।
- issue: גֶבֶר में प्रतिनिधिक पुरुषवाची भाषा
  choice: मनुष्य
  alternative: व्यक्ति; मानव
  rationale: मूल शब्द पुरुषवाची है, पर आलंकारिक कथन मानव मृत्युशीलता को व्यापक रूप से संबोधित करता है। ‘मनुष्य’ हिंदी में मूल रूप और प्रतिनिधिक अर्थ दोनों को स्वाभाविक ढंग से रखता है।
- issue: נפש का मानव-स्वरूप संबंधी अर्थ
  choice: प्राण
  alternative: जीवन; स्वयं
  rationale: ‘प्राण’ काव्यात्मक और व्यापक है, पर मूल शब्द की अर्थ-सीमा को पूर्णतः एक ही मानवशास्त्रीय श्रेणी में बंद नहीं किया गया; विकल्प पादटिप्पणी में सुरक्षित हैं।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण काव्यात्मक शैली रखी गई है। वाक्यरचना सरल और मौखिक पाठ के योग्य है। ‘मृत्यु को देखना’ तथा ‘अधोलोक के हाथ’ जैसे मूल रूपक सुरक्षित रखे गए हैं, और आवश्यक अर्थ-विकल्प पादटिप्पणियों में दिए गए हैं।
