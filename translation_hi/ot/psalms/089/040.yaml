  yaml_path: translation/ot/psalms/089/040.yaml
  text: You have broken down all his walls[c][b][a]; you have made his strongholds a ruin.
translation:
  language: hi
  text: तूने उसकी सारी दीवारें[a] ढा दी हैं; तूने उसके गढ़ों को खंडहर[b] बना दिया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसके सारे बाड़े,” अथवा “उसके सारे रक्षात्मक अवरोध।” इब्रानी शब्द दीवार, बाड़, या किसी घेरे/रक्षात्मक सीमा के लिए प्रयुक्त हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “विनाश”; सम्भवतः “भय” या “घबराहट।” इब्रानी संज्ञा ध्वस्त या उजड़ी दशा को, और कुछ प्रसंगों में आतंक को भी सूचित कर सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּרַצְתָּ
  choice: तोड़ डाली हैं
  rationale: क्रिया פרץ में तोड़कर रास्ता बनाने या सुरक्षा-घेरा भेदने का भाव है। घेराबंदियों के साथ ‘तोड़ डाली’ स्वाभाविक हिन्दी में विनाश की तीव्रता व्यक्त करता है।
- source_word: כָל
  choice: सारी
  rationale: मूल पाठ में व्यक्त सम्पूर्णता को बनाए रखता है और ‘घेराबंदियाँ’ के लिंग-वचन के अनुरूप है।
- source_word: גְּדֵרֹתָיו
  choice: उसकी सारी घेराबंदियाँ
  rationale: גדרה दीवार, बाड़, घेरा या रक्षात्मक अवरोध का बोध करा सकता है। ‘घेराबंदियाँ’ इस व्यापक रक्षात्मक अर्थ को बनाए रखता है, जबकि फुटनोट में अधिक ठोस विकल्प दिए गए हैं।
- source_word: שַׂמְתָּ
  choice: बना दिया है
  rationale: שים का अर्थ रखना, ठहराना या बना देना हो सकता है। यहाँ परिणामसूचक रचना में ‘बना दिया है’ सहज और सटीक है।
- source_word: מִבְצָרָיו
  choice: उसके गढ़ों
  rationale: מבצר किसी किलेबंद या सुदृढ़ रक्षास्थल को दर्शाता है। ‘गढ़’ काव्यात्मक, सुबोध और मूल के अपेक्षाकृत व्यापक अर्थ के अनुकूल है।
- source_word: מְחִתָּה
  choice: खंडहर
  rationale: इस रक्षात्मक-विनाशकारी संदर्भ में מחתה उजाड़ या ध्वस्त दशा को सूचित करता है। ‘खंडहर बना दिया’ हिन्दी में स्वाभाविक है; ‘विनाश’ और ‘दहशत’ जैसे संभावित अर्थ फुटनोट में सुरक्षित हैं।
theological_decisions:
- issue: तीसरे पुरुष एकवचन पुल्लिंग प्रत्ययों का संदर्भ
  choice: मुख्य पाठ में ‘उसकी/उसके’ बनाए रखना
  alternative: इसे स्पष्ट करके ‘राजा की/के’ या सिय्योन अथवा यरूशलेम की सुरक्षा कहना
  rationale: इब्रानी पाठ केवल पुल्लिंग एकवचन प्रत्यय देता है। निकटवर्ती संदर्भ दाऊदी अभिषिक्त राजा के पतन का विलाप करता है, पर मुख्य पाठ में संदर्भ को स्पष्ट कर देना काव्यात्मक अस्पष्टता को अनावश्यक रूप से समाप्त कर देगा।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमामय काव्यात्मक शैली रखी गई है। ‘तूने’ भजन में परमेश्वर को किए गए सीधे, एकवचन सम्बोधन को दर्शाता है; यह अनादर का संकेत नहीं है। वाक्य-संरचना इब्रानी समानांतरता को बनाए रखते हुए सामान्य पाठक के लिए सहज रखी गई है।
