  text: כִּֽי תִפְאֶ֣רֶת עֻזָּ֣/מוֹ אָ֑תָּה וּ֝/בִ/רְצֹנְ/ךָ֗ תרים קַרְנֵֽ/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/017.yaml
  text: For you are the glory of their strength[b][a], and by your favor you exalt our horn.
translation:
  language: hi
  text: क्योंकि उनकी शक्ति की शोभा[a] आप ही हैं, और आपकी कृपा से आप हमारे सींग को ऊँचा करते हैं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उनकी शक्ति की महिमा/भव्यता।”
    reason: lexical_alternative
  - marker: b
    text: इब्रानी काव्य में “सींग” शक्ति, सामर्थ्य, सम्मान या ऊँचे पद का रूपक है।
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन का आधार बताता है; हिन्दी में ‘क्योंकि’ इस कारणसूचक संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: תִפְאֶרֶת
  choice: शोभा
  rationale: इस संज्ञा में शोभा, वैभव और महिमा का अर्थक्षेत्र है। ‘शोभा’ शक्ति के गौरवपूर्ण अलंकरण या सम्मान को सहज हिन्दी में व्यक्त करती है।
- source_word: עֻזָּמוֹ
  choice: उनकी शक्ति
  rationale: मूल संज्ञा का अर्थ शक्ति या सामर्थ्य है और प्रत्यय तीसरे पुरुष बहुवचन का है; इसलिए ‘उनकी शक्ति’ मूल व्याकरण और सामुदायिक संदर्भ को सुरक्षित रखता है।
- source_word: אָתָּה
  choice: आप ही हैं
  rationale: स्वतंत्र सर्वनाम पर बल है। ‘ही’ उस बल को दर्शाता है और परमेश्वर को संबोधित करने के लिए आदरसूचक ‘आप’ स्वाभाविक है।
- source_word: וּבִרְצֹנְךָ
  choice: और आपकी कृपा से
  rationale: רָצוֹן यहाँ अनुग्रह, प्रसन्नता या सद्भाव को सूचित करता है; ‘कृपा से’ उपसर्ग בְּ के साधनात्मक भाव सहित वाक्य का आशय स्पष्ट करता है।
- source_word: תרים
  choice: ऊँचा होता है
  rationale: लिखित व्यंजन-पाठ תרים को संदर्भ में ‘ऊँचा करना/होना’ के भाव में लिया गया है। स्वरांकन के अभाव से कर्ता-रूप में वास्तविक अनिश्चितता है; हिन्दी में यह रूप उसे अनावश्यक रूप से निश्चित किए बिना काव्यात्मक समानांतरता बनाए रखता है।
- source_word: קַרְנֵנוּ
  choice: हमारा सींग
  rationale: शाब्दिक बिंब को सुरक्षित रखा गया है। इब्रानी काव्य में ‘सींग’ शक्ति, प्रतिष्ठा या ऊँचे पद का रूपक है; इसका अर्थ पादटिप्पणी में स्पष्ट किया गया है।
theological_decisions:
- issue: ‘सींग’ रूपक का अर्थ
  choice: मुख्य पाठ में ‘हमारा सींग’ बनाए रखा गया।
  alternative: हमारी शक्ति / हमारा सामर्थ्य / हमारा सम्मान
  rationale: मूल इब्रानी का सजीव बिंब धार्मिक-काव्यात्मक अर्थ रखता है। उसे अर्थानुवाद से बदलने के बजाय पादटिप्पणी में समझाना स्रोत के अधिक निकट है।
- issue: ‘उनकी’ से ‘हमारा’ में सर्वनाम-परिवर्तन
  choice: मूल के अनुसार ‘उनकी शक्ति’ और ‘हमारा सींग’ रखा गया।
  alternative: दोनों को ‘हमारा’ करके समरूप करना
  rationale: इब्रानी में तीसरे पुरुष बहुवचन से पहले पुरुष बहुवचन का वास्तविक परिवर्तन है। इसे समतल करना पाठ की तनावपूर्ण अभिव्यक्ति को मिटा देता।
- issue: תרים का पाठ और कर्ता
  choice: ‘ऊँचा होता है’ द्वारा कर्ता को अनिर्धारित रखा गया।
  alternative: ‘आप ऊँचा करते हैं’ / ‘वह ऊँचा करेगा’
  rationale: मसोरेटिक पाठ में शब्द के स्वरांकन को लेकर पाठगत कठिनाई है। संदर्भ परमेश्वर को कर्ता मानने का समर्थन करता है, पर दिए गए व्यंजन-पाठ से रूप पूर्णतः निर्विवाद नहीं; अतः हिन्दी में वास्तविक अस्पष्टता को सुरक्षित रखा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सरल काव्यात्मक गद्य। परमेश्वर के लिए आदरसूचक ‘आप’ रखा गया है। मुख्य पाठ में इब्रानी रूपक तथा ‘उनकी/हमारा’ का सर्वनाम-परिवर्तन सुरक्षित हैं; दोनों पादटिप्पणी चिह्न पाठ में उपस्थित हैं।
