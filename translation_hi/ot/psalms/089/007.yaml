  yaml_path: translation/ot/psalms/089/007.yaml
  text: God is greatly feared in the council of the holy ones[b][a], and awesome above all who surround him.
translation:
  language: hi
  text: परमेश्वर पवित्र प्राणियों[b] की परिषद[a] में अत्यन्त भययोग्य है, और उसके चारों ओर रहने वाले सभी से बढ़कर विस्मयकारी है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘सभा’; इब्रानी शब्द निकट परामर्श-मंडल अथवा विचार-विमर्श के लिए एकत्र सभा को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ ‘पवित्र प्राणियों’ से सम्भवतः मनुष्य नहीं, बल्कि स्वर्गीय प्राणी अभिप्रेत हैं।
    reason: cultural_note
lexical_decisions:
- source_word: אֵל
  choice: परमेश्वर
  rationale: यहाँ אֵל इस्राएल के परमेश्वर के लिए प्रयुक्त है; ‘परमेश्वर’ आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: נַעֲרָץ ... רַבָּה
  choice: अत्यन्त भययोग्य
  rationale: निफ़अल कृदन्त और तीव्रतासूचक רַבָּה मिलकर श्रद्धामिश्रित भय और गहरे आदर का भाव देते हैं; ‘अत्यन्त भययोग्य’ इसे नैतिक बुराई का संकेत दिए बिना व्यक्त करता है।
- source_word: בְּסוֹד
  choice: की परिषद में
  rationale: סוֹד निकट परामर्श-मंडल या सभा को सूचित कर सकता है। इस आकाशीय संदर्भ में ‘परिषद’ उपयुक्त है, जबकि वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: קְדֹשִׁים
  choice: पवित्र जनों
  rationale: शाब्दिक व्यापकता बनाए रखी गई है; संदर्भ में सम्भवतः स्वर्गीय प्राणी अभिप्रेत हैं, पर मुख्य पाठ इसे अनावश्यक रूप से संकीर्ण नहीं करता।
- source_word: וְנוֹרָא
  choice: और ... विस्मयकारी
  rationale: यह शब्द भय और श्रद्धा उत्पन्न करने का भाव रखता है। ‘विस्मयकारी’ समानांतर पंक्ति में गरिमापूर्ण और स्वाभाविक हिन्दी देता है।
- source_word: עַל כָּל סְבִיבָיו
  choice: उन सब से अधिक ... जो उसके चारों ओर हैं
  rationale: עַל को यहाँ तुलनात्मक श्रेष्ठता के रूप में समझा गया है; वाक्यांश परमेश्वर को उसके चारों ओर उपस्थित सभी प्राणियों से अधिक भय-विस्मय उत्पन्न करने वाला बताता है।
theological_decisions:
- issue: ‘पवित्र जनों’ और परमेश्वर के चारों ओर रहने वालों की पहचान
  choice: मुख्य पाठ में व्यापक ‘पवित्र जन’; पादटिप्पणी में स्वर्गीय प्राणियों की सम्भावना
  alternative: मानवीय भक्त या मिश्रित उपासक सभा
  rationale: आसपास के पदों का स्वर्ग और आकाशीय सभा वाला संदर्भ स्वर्गीय प्राणियों की ओर संकेत करता है, फिर भी इब्रानी पद स्वयं ‘पवित्र जनों’ कहता है; इसलिए सम्भावित पहचान को पादटिप्पणी में स्पष्ट किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण काव्यात्मक शैली रखी गई है। ‘भययोग्य’ और ‘विस्मयकारी’ समानांतर इब्रानी पदों के श्रद्धा तथा भय के संयुक्त भाव को अलग-अलग लेकिन सम्बद्ध रूप में व्यक्त करते हैं।
