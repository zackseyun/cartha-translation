id: PSA.89.37
reference: Psalms 89:37
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כְּ֭/יָרֵחַ יִכּ֣וֹן עוֹלָ֑ם וְ/עֵ֥ד בַּ֝/שַּׁ֗חַק נֶאֱמָ֥ן סֶֽלָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/037.yaml
  text: Like the moon[a], it will be established forever, and the witness in the sky is faithful[b]. Selah
translation:
  language: hi
  text: चन्द्रमा के समान[a] वह सदा स्थिर रहेगा, और आकाश में साक्षी विश्वासयोग्य है[b]। सेला
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “चन्द्रमा की तरह।”
    reason: lexical_alternative
  - marker: b
    text: “आकाश में साक्षी” को प्रायः चन्द्रमा समझा जाता है, जो वाचा के स्थायित्व का भरोसेमंद आकाशीय साक्षी है।
    reason: alternative_reading
lexical_decisions:
- source_word: כְּיָרֵחַ
  choice: चन्द्रमा के समान
  rationale: उपसर्ग כְּ तुलना प्रकट करता है और יָרֵחַ का अर्थ ‘चन्द्रमा’ है। यह रूप उपमा को स्पष्ट और गरिमापूर्ण हिन्दी में बनाए रखता है।
- source_word: יִכּוֹן
  choice: वह स्थिर रहेगा
  rationale: כון के निफ़ाल अपूर्ण रूप में स्थापित या दृढ़ बने रहने का भाव है। हिन्दी में ‘स्थिर रहेगा’ परिणाम और निरंतरता दोनों को स्वाभाविक रूप से व्यक्त करता है; ‘वह’ का संदर्भ पिछले पद से आता है।
- source_word: עוֹלָם
  choice: सदा
  rationale: वाचा-संबंधी काव्यात्मक प्रसंग में यह चिरस्थायी बने रहने का भाव देता है। ‘सदा’ सहज और संक्षिप्त है।
- source_word: וְעֵד
  choice: और ... साक्षी
  rationale: עֵד का मूल अर्थ ‘साक्षी’ है। इब्रानी में उपपद न होने के कारण हिन्दी में अनावश्यक निश्चितता जोड़ने से बचा गया है।
- source_word: בַּשַּׁחַק
  choice: आकाश में
  rationale: काव्य में שַׁחַק आकाश, नभमंडल या बादलों के क्षेत्र को सूचित कर सकता है। एकवचन ‘आकाश’ स्रोत के रूप और हिन्दी की स्वाभाविक अभिव्यक्ति के अनुरूप है।
- source_word: נֶאֱמָן
  choice: विश्वासयोग्य है
  rationale: यह दृढ़ता, भरोसेमंदी और निष्ठा का अर्थ देता है। ‘विश्वासयोग्य’ संभावित वाचागत अनुगूँज को बनाए रखते हुए विश्वसनीयता व्यक्त करता है।
- source_word: סֶלָה
  choice: सेला
  rationale: इस संगीतिक या साहित्यिक पद का सटीक आशय अनिश्चित है, इसलिए इसका लिप्यंतरण किया गया है।
theological_decisions:
- issue: ‘स्थिर रहेगा’ के निहित कर्ता का संदर्भ
  choice: पिछले पद के संदर्भ को ‘वह’ द्वारा निहित रखा गया है।
  alternative: मुख्य पाठ में ‘उसका सिंहासन’ या ‘उसका वंश’ स्पष्ट रूप से जोड़ना।
  rationale: इब्रानी में यहाँ कर्ता अलग से व्यक्त नहीं है और वह पूर्ववर्ती प्रसंग से मिलता है। किसी एक संदर्भ को स्पष्ट करके अर्थ सीमित करने के बजाय स्रोत की संक्षिप्तता रखी गई है।
- issue: ‘आकाश में साक्षी’ की पहचान
  choice: मुख्य पाठ में साक्षी की पहचान अनिर्धारित रखी गई है।
  alternative: साक्षी को स्पष्ट रूप से चन्द्रमा, इन्द्रधनुष या कोई अन्य आकाशीय चिन्ह कहना।
  rationale: इब्रानी वाक्यांश स्वयं साक्षी की पहचान स्पष्ट नहीं करता। सम्भावित रूप से चन्द्रमा समझे जाने की बात पादटिप्पणी में दी गई है, मुख्य पाठ में नहीं थोपी गई।
translation_notes:
  register: आधुनिक मानक हिन्दी में काव्यात्मक, गरिमापूर्ण और सहज शैली रखी गई है। ‘चन्द्रमा’, ‘साक्षी’ और ‘विश्वासयोग्य’ जैसे सामान्यतः समझे जाने वाले औपचारिक शब्द स्रोत की काव्यात्मक तथा वाचागत गूँज को बनाए रखते हैं।
