id: PSA.89.15
reference: Psalms 89:15
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אַשְׁרֵ֣י הָ֭/עָם יוֹדְעֵ֣י תְרוּעָ֑ה יְ֝הוָ֗ה בְּֽ/אוֹר פָּנֶ֥י/ךָ יְהַלֵּכֽוּ/ן־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/015.yaml
  text: Blessed are the people who know the joyful shout[a]; O Yahweh[b], they walk in the light of your face.
translation:
  language: hi
  text: धन्य हैं वे लोग जो जयघोष करना जानते हैं[a]; हे याहवे, वे तेरे मुख[b] के प्रकाश में चलते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उत्सव का जयघोष’; इसमें आराधना के समय तुरही के साथ किया जाने वाला अभिनन्दन भी सम्मिलित हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक अर्थ ‘तेरा मुख’ है; यहाँ इससे तेरी उपस्थिति या कृपादृष्टि का भाव भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: धन्य हैं
  rationale: यह बहुवचन विस्मयात्मक रूप धन्यता की घोषणा करता है। ‘धन्य हैं’ इसके ऊँचे, आराधनात्मक भाव को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: הָעָם
  choice: वे लोग
  rationale: यहाँ עָם का संकेत समुदाय के लोगों की ओर है, राजनीतिक राष्ट्र पर बल नहीं है। हिन्दी वाक्य में ‘वे लोग’ अधिक स्वाभाविक है।
- source_word: יוֹדְעֵי
  choice: जो ... करना जानते हैं
  rationale: कृदन्त ऐसे लोगों का स्थायी लक्षण बताता है जो इस जयघोष से परिचित हैं और उसमें सहभागी होना जानते हैं।
- source_word: תְרוּעָה
  choice: जयघोष
  rationale: यह शब्द ऊँची पुकार, उत्सवी जयध्वनि या तुरही के साथ होने वाले अभिनन्दन को सूचित कर सकता है। भजन के आराधनात्मक प्रसंग में ‘जयघोष’ व्यापकता बनाए रखता है और इसे केवल वाद्य-ध्वनि तक सीमित नहीं करता।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत वाचा-नाम है; इसलिए किसी उपाधि से बदलने के बजाय उसका हिन्दी लिप्यन्तरण रखा गया है।
- source_word: בְּאוֹר
  choice: के प्रकाश में
  rationale: ב यहाँ उस वातावरण या क्षेत्र को व्यक्त करता है जिसमें लोग चलते हैं; ‘प्रकाश में’ हिन्दी में स्वाभाविक और मूल के निकट है।
- source_word: פָּנֶיךָ
  choice: तेरे मुख
  rationale: शाब्दिक चित्र ‘मुख’ का है। यह परमेश्वर की उपस्थिति और कृपा का संकेत भी दे सकता है, पर मुख्य पाठ मूल बिम्ब को सुरक्षित रखता है।
- source_word: יְהַלֵּכוּן
  choice: चलते हैं
  rationale: यह निरन्तर चाल या जीवन-व्यवहार का भाव देता है। ‘चलते हैं’ मूल रूपक को बनाए रखते हुए सहज हिन्दी है।
theological_decisions:
- issue: यहोवा के नाम יְהוָה का अनुवाद
  choice: याहवे, प्रत्यक्ष सम्बोधन में ‘हे याहवे’
  alternative: यहोवा; प्रभु
  rationale: पद में वाचा-नाम सीधे प्रयुक्त हुआ है। उसका लिप्यन्तरण व्यक्तिगत नाम को सुरक्षित रखता है और उसे किसी उपाधि में नहीं बदलता।
- issue: פָּנֶיךָ को शाब्दिक ‘तेरा मुख’ या भावार्थ ‘तेरी उपस्थिति/कृपा’ कहना
  choice: तेरे मुख
  alternative: तेरी उपस्थिति; तेरी कृपादृष्टि
  rationale: मूल बिम्ब को मुख्य पाठ में रखने से उपस्थिति और अनुग्रह—दोनों सम्भावित आशय खुले रहते हैं; पादटिप्पणी मुहावरे का अर्थ स्पष्ट करती है।
- issue: תְרוּעָה को केवल तुरही की ध्वनि मानना या व्यापक आराधनात्मक जयघोष
  choice: जयघोष
  alternative: उत्सव का जयघोष; तुरही की जयध्वनि
  rationale: शब्द में मानवीय पुकार और तुरही-सहित उत्सवी अभिनन्दन दोनों सम्भव हैं। प्रसंग आराधनात्मक है, पर किसी एक माध्यम को निश्चित करना आवश्यक नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, आराधनात्मक और सामान्य पाठक के लिए सहज शैली रखी गई है। परमेश्वर के प्रति एकवचन निकट सम्बोधन ‘तेरे’ मूल इब्रानी के एकवचन रूप और काव्यात्मक प्रत्यक्षता को दर्शाता है।
