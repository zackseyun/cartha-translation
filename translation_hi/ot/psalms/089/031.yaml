  yaml_path: translation/ot/psalms/089/031.yaml
  text: If they profane my statutes and do not keep my commandments,[a]
translation:
  language: hi
  text: 'यदि वे मेरी विधियों को अपवित्र करें[a]

    और मेरी आज्ञाओं का पालन न करें।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मेरी विधियों का उल्लंघन करें।” इब्रानी क्रिया का अर्थ अपवित्र करना अथवा पवित्र वस्तु को साधारण समझना भी हो सकता है; “अपवित्र करें” उसके अधिक प्रबल भाव को बनाए रखता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: यदि
  rationale: यह शर्त बताने वाला अव्यय है। ‘यदि’ मूल के सीधे शर्तसूचक अर्थ को बनाए रखता है; ‘जब’ घटना की निश्चितता का अतिरिक्त भाव दे सकता है।
- source_word: חֻקֹּתַי
  choice: मेरी विधियों
  rationale: חֻקָּה निर्धारित विधान या नियम को दर्शाता है। ‘विधियों’ से कानूनी-वाचाई भाव बना रहता है और यह समानांतर ‘आज्ञाओं’ से अलग भी सुनाई देता है।
- source_word: יְחַלֵּלוּ
  choice: अपवित्र करें
  rationale: חלל का पिएल रूप अपवित्र करने, पवित्रता भंग करने या साधारण मानने का प्रबल भाव रखता है। ‘अपवित्र करें’ केवल उल्लंघन से अधिक गहरी अनादरपूर्णता को सुरक्षित रखता है।
- source_word: וּמִצְוֺתַי
  choice: और मेरी आज्ञाओं
  rationale: מִצְוָה का स्वाभाविक वाचाई-कानूनी प्रतिशब्द ‘आज्ञा’ है। इससे חֻקּוֹת (‘विधियाँ’) के साथ मूल का समानांतर भेद बना रहता है।
- source_word: לֹא יִשְׁמֹרוּ
  choice: पालन न करें
  rationale: आज्ञाओं के संदर्भ में שׁמר का अर्थ उन्हें मानना या उनका पालन करना है। आधुनिक हिन्दी में ‘पालन करना’ स्वाभाविक और स्पष्ट है।
theological_decisions:
- issue: विधियों के प्रति חלל क्रिया में वाचा-भंग की तीव्रता
  choice: ‘अपवित्र करें’
  alternative: ‘उल्लंघन करें’
  rationale: मूल क्रिया केवल आज्ञा न मानने के बजाय अपवित्र या अनादृत करने का अधिक प्रबल भाव व्यक्त करती है। यह अनुवाद उसी धार्मिक-वाचाई गंभीरता को बनाए रखता है, कोई अतिरिक्त धर्मसिद्धान्त नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में स्वाभाविक, गरिमापूर्ण काव्यात्मक शैली। पद का शर्तसूचक ढाँचा और दोनों समानांतर पंक्तियाँ सुरक्षित रखी गई हैं।
