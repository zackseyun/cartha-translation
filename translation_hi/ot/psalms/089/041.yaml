  text: שַׁ֭סֻּ/הוּ כָּל עֹ֣בְרֵי דָ֑רֶךְ הָיָ֥ה חֶ֝רְפָּ֗ה לִ/שְׁכֵנָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/041.yaml
  text: All who pass by the way have plundered him[a]; he has become a reproach to his neighbors.
translation:
  language: hi
  text: मार्ग से गुजरने वाले सभी लोगों ने उसे लूट लिया है[a]; वह अपने पड़ोसियों के लिए तिरस्कार का पात्र बन गया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘मार्ग से गुजरने वाले सभी लोगों ने उसे लूट लिया है।’ इब्रानी पदबंध का शाब्दिक अर्थ है, ‘मार्ग के सभी गुजरने वाले।’
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁסֻּהוּ
  choice: उसे लूट लिया है
  rationale: शסה का अर्थ शत्रुतापूर्वक लूटना या माल छीन लेना है। यह चयन पूर्ण हो चुकी क्रिया और उसके वर्तमान परिणाम को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: כָּל עֹבְרֵי דָרֶךְ
  choice: मार्ग से होकर जानेवाले सभी लोग
  rationale: शाब्दिक भाव ‘मार्ग के सभी पार जानेवाले’ है। यह रूप व्यापकता और मार्ग से गुजरने की ठोस छवि दोनों बनाए रखता है।
- source_word: הָיָה
  choice: बन गया है
  rationale: पूर्ण क्रिया यहाँ उत्पन्न हुई और अब बनी हुई अवस्था को दर्शाती है; ‘बन गया है’ इस परिणामात्मक भाव को स्पष्ट करता है।
- source_word: חֶרְפָּה
  choice: निंदा का पात्र
  rationale: חֶרְפָּה में अपमान, तिरस्कार और निंदा का भाव है। ‘निंदा का पात्र’ हिन्दी में व्यक्ति के दूसरों की दृष्टि में अपमानित होने को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: לִשְׁכֵנָיו
  choice: अपने पड़ोसियों के लिए
  rationale: שָׁכֵן निकट रहनेवाले या पड़ोसी को दर्शाता है और ל संबंध सूचित करता है। यह सीधा अर्थ सुरक्षित रखता है।
theological_decisions:
- issue: एकवचन तृतीय पुरुष सर्वनाम का संदर्भ
  choice: ‘उसे/वह’ रखकर संदर्भ को अनिर्दिष्ट रखना
  alternative: दाऊदी राजा, अभिषिक्त जन, अथवा राजा द्वारा प्रतिनिधित्व किए गए लोगों को स्पष्ट रूप से नाम देना
  rationale: निकटवर्ती प्रसंग दाऊदी राजा या अभिषिक्त जन की ओर संकेत करता है, पर इस पद में केवल एकवचन सर्वनाम हैं। अनुवाद मूल की अस्पष्टता और संभावित प्रतिनिधिक अर्थ को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘मार्ग’ काव्यात्मक भजन-शैली को बनाए रखता है, जबकि वाक्य-विन्यास वर्तमान हिन्दी के अनुरूप है।
