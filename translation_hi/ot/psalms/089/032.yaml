source:
  edition: WLC
  text: וּ/פָקַדְתִּ֣י בְ/שֵׁ֣בֶט פִּשְׁעָ֑/ם וּ/בִ/נְגָעִ֥ים עֲוֺנָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/032.yaml
  text: Then I will punish their transgression with the rod[a], and their iniquity with blows.
translation:
  language: hi
  text: 'तब मैं उनके अपराध का दण्ड छड़ी से,

    और उनके अधर्म का दण्ड प्रहारों से दूँगा।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּפָקַדְתִּי
  choice: तब मैं ... दण्ड ... दूँगा
  rationale: פקד के व्यापक अर्थ-क्षेत्र में ‘ध्यान देना, सुधि लेना, दण्ड देना’ शामिल हैं। अनुशासन के साधनों के साथ आए इस प्रसंग में दण्ड देने का भाव प्रमुख है। पिछले पद की शर्त के परिणाम को स्वाभाविक हिन्दी में दिखाने के लिए ‘तब’ चुना गया है।
- source_word: בְשֵׁבֶט
  choice: छड़ी से
  rationale: שׁבט का अर्थ छड़ी, लाठी या राजदण्ड हो सकता है। यहाँ शासन-चिह्न नहीं, अनुशासन का साधन अभिप्रेत है; इसलिए ‘छड़ी’ उपयुक्त और सहज है।
- source_word: פִּשְׁעָם
  choice: उनके अपराध
  rationale: פשׁע अपराध, उल्लंघन या विद्रोह को सूचित कर सकता है। ‘अपराध’ नैतिक उल्लंघन को स्पष्ट रखता है, पर राजनीतिक विद्रोह का अनावश्यक अर्थ आरोपित नहीं करता।
- source_word: וּבִנְגָעִים
  choice: प्रहारों से
  rationale: נגע का अर्थ विपत्ति, आघात, मार या महामारी हो सकता है। ‘छड़ी’ के समानांतर अनुशासनात्मक दण्ड के संदर्भ में ‘प्रहार’ मूल बिंब को बनाए रखता है और अर्थ को केवल रोग तक सीमित नहीं करता।
- source_word: עֲוֺנָם
  choice: उनके अधर्म
  rationale: עון अधर्म, दोष अथवा दोष के परिणाम का बोध करा सकता है। ‘अधर्म’ नैतिक गंभीरता और ‘अपराध’ के साथ काव्यात्मक समानांतरता बनाए रखता है।
theological_decisions:
- issue: वाचा के लोगों के पाप के प्रति परमेश्वर की प्रतिक्रिया का स्वरूप
  choice: पद में वास्तविक अनुशासनात्मक दण्ड की ठोस भाषा रखी गई है।
  alternative: इसे केवल अस्पष्ट ‘सुधार’ या ‘सुधि लेने’ के रूप में नरम करना।
  rationale: छड़ी और प्रहार के बिंब दण्ड को स्पष्ट करते हैं। फिर भी इस पद में अंतिम त्याग अथवा उसके अभाव के बारे में कोई अतिरिक्त धर्मसैद्धान्तिक निष्कर्ष नहीं जोड़ा गया; व्यापक भजन का तनाव यथावत रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण काव्यात्मक पंक्तियाँ। समानांतर रचना को बनाए रखने के लिए ‘दण्ड’ दोनों अर्धपंक्तियों में व्यक्त किया गया है; हिन्दी में यह पुनरावृत्ति अर्थ को साफ और लय को संतुलित रखती है।
