  text: זְכֹ֣ר אֲ֭דֹנָ/י חֶרְפַּ֣ת עֲבָדֶ֑י/ךָ שְׂאֵתִ֥/י בְ֝/חֵיקִ֗/י כָּל רַבִּ֥ים עַמִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/050.yaml
  text: Remember[a], Lord, the reproach of your servants[b], which I bear in my bosom from many peoples.
translation:
  language: hi
  text: हे प्रभु, अपने सेवकों की निन्दा को स्मरण कर—वह निन्दा जो मैं बहुत-से लोगों की ओर से अपनी छाती में सहता हूँ।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उन सब बहुत-से लोगों की निन्दा को मैं अपनी छाती में सहता हूँ।” ‘अपनी छाती में’ के बाद की इब्रानी रचना संक्षिप्त है। इसका अर्थ निन्दा का स्रोत (“बहुत-से लोगों की ओर से”) हो सकता है, अथवा उस निन्दा का विषय या विस्तार (“उन सब बहुत-से लोगों की निन्दा”)। ‘अपनी छाती में’ निन्दा को व्यक्तिगत और निकटता से उठाए रखने का इब्रानी बिम्ब है।
    reason: alternative_reading
lexical_decisions:
- source_word: זְכֹר
  choice: स्मरण कर
  rationale: यह זכר का पुल्लिंग एकवचन आज्ञार्थक रूप है और परमेश्वर से सीधी विनती व्यक्त करता है। ‘स्मरण कर’ प्रार्थना और विलाप की गरिमा बनाए रखता है।
- source_word: אֲדֹנָי
  choice: हे प्रभु
  rationale: यहाँ यह परमेश्वर के लिए प्रयुक्त स्थिर उपाधि है और सीधे सम्बोधन में है; ‘हे प्रभु’ स्वाभाविक हिन्दी रूप है।
- source_word: חֶרְפַּת
  choice: निन्दा
  rationale: חֶרְפָּה में अपमान, तिरस्कार और बदनामी का भाव है। ‘निन्दा’ विलाप-सन्दर्भ में व्यापक अर्थ बनाए रखती है और इसे केवल मौखिक ताने तक सीमित नहीं करती।
- source_word: עֲבָדֶיךָ
  choice: अपने सेवकों की
  rationale: परमेश्वर के लोगों के लिए प्रार्थना की भाषा में ‘सेवक’ स्वाभाविक है; यहाँ दासत्व का सामाजिक-कानूनी पक्ष प्रमुख नहीं है।
- source_word: שְׂאֵתִי
  choice: मैं ... सहता हूँ
  rationale: נשׂא का मूल अर्थ उठाना या ढोना है; निन्दा के प्रसंग में हिन्दी ‘सहना’ व्यक्तिगत रूप से बोझ उठाने का आशय स्वाभाविक ढंग से व्यक्त करता है।
- source_word: בְחֵיקִי
  choice: अपने हृदय में
  rationale: शाब्दिक अर्थ ‘अपनी छाती/गोद में’ है, पर मुहावरे का आशय किसी बोझ को अत्यन्त निजी और अंतरंग रूप से धारण करना है। आधुनिक हिन्दी में ‘अपने हृदय में’ इस अर्थ को सहजता से व्यक्त करता है।
- source_word: כָּל רַבִּים עַמִּים
  choice: बहुत-से लोगों की ओर से
  rationale: इब्रानी वाक्यांश संक्षिप्त और व्याकरणतः कठिन है। यह रूप עַמִּים के बहुवचन को बनाए रखते हुए निन्दा के स्रोत को व्यक्त करता है; वैकल्पिक सम्बन्ध पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: ईश्वरीय उपाधि אֲדֹנָי का अनुवाद
  choice: प्रभु
  alternative: मेरे प्रभु
  rationale: भजनों में यह परमेश्वर के लिए प्रचलित स्थिर उपाधि है। ‘प्रभु’ अनावश्यक स्वामित्व-सूचक भाव जोड़े बिना उसका सामान्य प्रयोग सुरक्षित रखता है।
- issue: संक्षिप्त इब्रानी वाक्यांश כָּל רַבִּים עַמִּים का सम्बन्ध
  choice: 'निन्दा का स्रोत: ‘बहुत-से लोगों की ओर से’'
  alternative: वही निन्दा जो उन सब बहुत-से लोगों की है
  rationale: निकट सन्दर्भ में लोगों को निन्दा का स्रोत समझना स्वाभाविक है, पर इब्रानी संरचना दूसरे सम्बन्ध की भी अनुमति देती है; इसलिए उसे पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और प्रार्थनात्मक रखी गई है। ‘अपने हृदय में’ शाब्दिक ‘अपनी छाती/गोद में’ के स्थान पर ऐसा स्वाभाविक हिन्दी मुहावरा है जो निजी और अंतरंग रूप से बोझ सहने की इब्रानी छवि को संप्रेषित करता है।
