language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אֲשֶׁ֤ר חֵרְפ֖וּ אוֹיְבֶ֥י/ךָ יְהוָ֑ה אֲשֶׁ֥ר חֵ֝רְפ֗וּ עִקְּב֥וֹת מְשִׁיחֶֽ/ךָ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/051.yaml
  text: with which your enemies have taunted[a], O Yahweh[b], with which they have taunted the footsteps of your anointed.
translation:
  language: hi
  text: हे यहोवा, तेरे शत्रुओं ने तेरी निन्दा की है; उन्होंने तेरे अभिषिक्त[a] के पदचिह्नों[b] की निन्दा की है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘तेरे मसीह’। इब्रानी מְשִׁיחֶךָ का शाब्दिक अर्थ ‘तेरा अभिषिक्त’ है। इस सन्दर्भ में सम्भवतः दाऊदी राजा अभिप्रेत है, पर इस शब्द में मसीही अनुनाद भी है।
    reason: alternative_reading
  - marker: b
    text: ‘पदचिह्नों’ का अर्थ ‘एड़ियों’, ‘कदमों’ या ‘पैरों के निशानों’ के रूप में भी समझा जा सकता है; यह अभिषिक्त जन की गतिविधियों, मार्ग या आगमन की ओर रूपकात्मक संकेत हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵרְפוּ
  choice: ताने मारे हैं
  rationale: क्रिया חרף में अपमानजनक निन्दा और उपहास का भाव है। ‘ताने मारे हैं’ आधुनिक हिन्दी में उसका कटु और उपहासपूर्ण बल स्वाभाविक रूप से व्यक्त करता है।
- source_word: אוֹיְבֶיךָ
  choice: तेरे शत्रु
  rationale: द्वितीय पुरुष एकवचन प्रत्यय सहित इस पद का सीधा और स्वाभाविक अनुवाद।
- source_word: יְהוָה
  choice: हे यहोवा
  rationale: सम्बोधन को ‘हे’ से व्यक्त किया गया है और चार-अक्षरीय ईश्वरीय नाम को किसी उपाधि से बदलने के बजाय प्रचलित हिन्दी लिप्यन्तरण ‘यहोवा’ रखा गया है।
- source_word: אֲשֶׁר
  choice: जो
  rationale: दोनों आवृत्तियों के सम्बन्धसूचक कार्य को हिन्दी में स्वाभाविक वाक्य-विन्यास द्वारा व्यक्त किया गया है; डैश दूसरे उपवाक्य को पहले की व्याख्या के रूप में जोड़ता है।
- source_word: עִקְּבוֹת
  choice: पदचिह्नों
  rationale: עקב से बने इस बहुवचन में एड़ियों, कदमों या पैरों के निशानों की ठोस छवि है। ‘पदचिह्नों’ उस छवि को बनाए रखता है और व्यक्ति की चाल, मार्ग या आगमन की ओर संकेत कर सकता है।
- source_word: מְשִׁיחֶךָ
  choice: तेरे अभिषिक्त
  rationale: निकट सन्दर्भ में यह दाऊदी राजा को परमेश्वर द्वारा अभिषिक्त व्यक्ति के रूप में बताता है। ‘अभिषिक्त’ मूल शब्द का वर्णनात्मक अर्थ और उसका व्यापक मसीही अनुनाद दोनों सुरक्षित रखता है।
theological_decisions:
- issue: राजकीय भजन में מְשִׁיחֶךָ का अनुवाद और उसका मसीही अनुनाद
  choice: तेरे अभिषिक्त
  alternative: तेरे मसीह
  rationale: तात्कालिक साहित्यिक सन्दर्भ दाऊदी राजा का है, इसलिए मुख्य पाठ में वर्णनात्मक ‘अभिषिक्त’ अधिक उपयुक्त है। उसी इब्रानी शब्द के व्यापक मसीही अर्थ को पादटिप्पणी में रखा गया है, ताकि पाठ की सम्भावित धर्मवैज्ञानिक गूँज दबे नहीं और उस पर आवश्यकता से अधिक निर्णय भी न थोपा जाए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘ताने मारे हैं’ निन्दा के उपहासपूर्ण बल को व्यक्त करता है। मूल की दोहरावपूर्ण रचना को बनाए रखते हुए हिन्दी में डैश के द्वारा दोनों उपवाक्यों का सम्बन्ध स्पष्ट किया गया है। सर्वनामों में निकट और काव्यात्मक ‘तेरे’ का प्रयोग भजन की सम्बोधन-शैली के अनुरूप है।
