source:
  edition: WLC
  text: יְהוָ֤ה אֱלֹ֘הֵ֤י צְבָא֗וֹת מִֽי כָֽמ֖וֹ/ךָ חֲסִ֥ין יָ֑הּ וֶ֝/אֱמֽוּנָתְ/ךָ֗ סְבִיבוֹתֶֽי/ךָ׀־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/008.yaml
  text: O Yahweh[a], God of hosts, who is mighty like you, O Yah? Your faithfulness surrounds you.
translation:
  language: hi
  text: 'हे याहवे, सेनाओं के परमेश्वर,


    आपके समान सामर्थी कौन है, हे याह[a]?


    आपकी विश्वासयोग्यता आपके चारों ओर है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी: ‘याह’—दिव्य नाम का संक्षिप्त रूप; कई अनुवाद यहाँ ‘प्रभु’ लिखते हैं।'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: हे यहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है; सम्बोधन को ‘हे’ से स्पष्ट किया गया है।
- source_word: אֱלֹהֵי צְבָאוֹת
  choice: सेनाओं के परमेश्वर
  rationale: यह रचना ‘सेनाओं/दलसमूहों के परमेश्वर’ का अर्थ देती है। ‘सेनाओं’ मूल की व्यापकता को बनाए रखता है और यह तय नहीं करता कि वे केवल स्वर्गीय हैं या पार्थिव।
- source_word: מִי כָמוֹךָ
  choice: आपके समान ... कौन है
  rationale: अतुलनीयता व्यक्त करने वाले इब्रानी आलंकारिक प्रश्न को स्वाभाविक हिन्दी में उसी प्रश्नात्मक बल के साथ रखा गया है।
- source_word: חֲסִין
  choice: सामर्थी
  rationale: यह विशेषण बल और पराक्रम को दर्शाता है; ‘सामर्थी’ काव्यात्मक और सहज हिन्दी है तथा यहाँ विधेय के रूप में स्वाभाविक बैठता है।
- source_word: יָהּ
  choice: हे याह
  rationale: यह יְהוָה से अलग, दिव्य नाम का संक्षिप्त रूप है; मूल पद में दोनों रूपों का भेद बनाए रखने के लिए इसे ‘याह’ लिप्यंतरित किया गया है।
- source_word: וֶאֱמוּנָתְךָ
  choice: आपकी विश्वासयोग्यता
  rationale: אֱמוּנָה यहाँ परमेश्वर की विश्वसनीयता, दृढ़ता और निष्ठा को व्यक्त करता है; ‘विश्वासयोग्यता’ इस गुण को सबसे सीधे रूप में बताता है।
- source_word: סְבִיבוֹתֶיךָ
  choice: आपके चारों ओर है
  rationale: बहुवचन रूप यहाँ स्थानवाचक/क्रियाविशेषणीय अर्थ ‘चारों ओर’ देता है। हिन्दी वाक्य मूल बिंब को बिना अनावश्यक व्याख्या के बनाए रखता है।
theological_decisions:
- issue: एक ही पद में יְהוָה और संक्षिप्त रूप יָהּ का अनुवाद
  choice: יְהוָה को ‘यहवे’ और יָהּ को ‘याह’ रखा गया है
  alternative: दोनों को ‘प्रभु’ कहना, अथवा दोनों को ‘यहवे’ कहना
  rationale: दोनों इब्रानी रूपों को एक ही उपाधि या नाम में मिला देने से मूल पाठ का जानबूझकर रखा गया रूपात्मक भेद मिट जाता। लिप्यंतरण उस भेद और व्यक्तिगत दिव्य नाम को सुरक्षित रखता है।
- issue: חֲסִין का वाक्यगत संबंध
  choice: इसे विधेय मानकर ‘आपके समान सामर्थी कौन है’ अनूदित किया गया है
  alternative: इसे सीधे יָהּ का विशेषण मानकर ‘हे सामर्थी याह, आपके समान कौन है?’ कहना
  rationale: इब्रानी काव्य दोनों संबंधों की निकटता की अनुमति देता है। चुनी हुई हिन्दी अतुलनीय सामर्थ्य के आलंकारिक प्रश्न को स्पष्ट रखती है, जबकि ‘हे याह’ को अलग सम्बोधन के रूप में सुरक्षित रखती है; इससे कोई अतिरिक्त सैद्धान्तिक निष्कर्ष नहीं जोड़ा जाता।
translation_notes:
  register: आधुनिक मानक हिन्दी में आदरपूर्ण ‘आप’ का प्रयोग किया गया है। शैली काव्यात्मक और गरिमापूर्ण है, पर शब्दावली सामान्य पाठक के लिए सहज रखी गई है। पंक्ति-विन्यास इब्रानी पद की सम्बोधन–प्रश्न–घोषणा संरचना को उभारता है।
