  text: मैंने अपने सेवक दाऊद को पाया है[a]; अपने पवित्र तेल से उसका अभिषेक किया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैंने अपने सेवक दाऊद को पाया; अपने पवित्र तेल से उसका अभिषेक किया।” इब्रानी में दोनों क्रियाएँ पूर्ण रूप में हैं और उनका अनुवाद सामान्य भूतकाल में भी किया जा सकता है।
    reason: कालगत वैकल्पिक अनुवाद
lexical_decisions:
- source_word: מָצָאתִי
  choice: मैंने ... पा लिया है
  rationale: מצא का काल पूर्ण हुई क्रिया को व्यक्त करता है। यहाँ पूर्ण वर्तमान हिंदी में उस पूर्ण कार्य की वर्तमान वाचा-संबंधी प्रासंगिकता स्वाभाविक रूप से बनाए रखता है; सामान्य भूतकाल भी संभव है।
- source_word: דָּוִד
  choice: दाऊद
  rationale: इस नाम का प्रचलित मानक हिंदी बाइबलीय रूप।
- source_word: עַבְדִּי
  choice: अपने सेवक
  rationale: עבד का अर्थ सेवक या दास हो सकता है। यहाँ यह दाऊद के लिए राजकीय और वाचा-संबंधी सम्मानसूचक पद है, इसलिए 'सेवक' संदर्भानुकूल है।
- source_word: בְּשֶׁמֶן קָדְשִׁי
  choice: अपने पवित्र तेल से
  rationale: अभिषेक के संदर्भ में ב साधन को दर्शाता है, जिसे हिंदी में स्वाभाविक रूप से 'से' कहा जाता है; קָדְשִׁי तेल के परमेश्वर के लिए अलग ठहराए होने को व्यक्त करता है।
- source_word: מְשַׁחְתִּיו
  choice: मैंने उसका अभिषेक किया है
  rationale: משׁח का अर्थ तेल लगाकर किसी पद या कार्य के लिए नियुक्त करना है। पूर्ण वर्तमान पहली क्रिया के साथ समानांतरता और कार्य की बनी हुई प्रासंगिकता रखता है।
theological_decisions:
- issue: राजकीय अभिषेक और संभावित मसीही अनुगूँज
  choice: दाऊद के ऐतिहासिक अभिषेक को सीधे व्यक्त किया गया है।
  alternative: अनुवाद में स्पष्ट रूप से मसीहा या अभिषिक्त जन की प्रतिरूपात्मक व्याख्या जोड़ना।
  rationale: इब्रानी पाठ यहाँ दाऊद का नाम लेकर उसके अभिषेक की बात करता है। व्यापक धर्मवैज्ञानिक अनुगूँज संभव है, पर उसे पद के शब्दों में जोड़ना स्रोत से आगे जाना होगा।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिंदी। 'पा लिया है' चयन या खोज के पूर्ण होने और उसकी वर्तमान प्रासंगिकता को व्यक्त करता है; 'अभिषेक' आवश्यक बाइबलीय-राजकीय पदावली को बनाए रखता है।
