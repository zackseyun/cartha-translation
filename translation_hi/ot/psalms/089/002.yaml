  text: כִּֽי אָמַ֗רְתִּי ע֭וֹלָם חֶ֣סֶד יִבָּנֶ֑ה שָׁמַ֓יִם תָּכִ֖ן אֱמוּנָתְ/ךָ֣ בָ/הֶֽם־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/002.yaml
  text: For I said[a], “Steadfast love will be built up forever; in the heavens you will establish your faithfulness.”
translation:
  language: hi
  text: क्योंकि मैंने कहा, “अटल प्रेम सदा के लिए निर्मित होगा[a]; आकाश में तू अपनी निष्ठा को स्थिर करेगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अटल प्रेम सदा के लिए स्थापित रहेगा।” इब्रानी क्रिया का शाब्दिक अर्थ ‘निर्मित होना’ है, पर इसका व्यापक अर्थ ‘स्थापित होना’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण या स्पष्टीकरण प्रस्तुत करता है; हिन्दी में ‘क्योंकि’ इस संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אָמַרְתִּי
  choice: मैंने कहा
  rationale: काल पूर्ण, प्रथम पुरुष एकवचन का सीधा और अनिर्वचनात्मक अनुवाद।
- source_word: עוֹלָם
  choice: सदा
  rationale: यहाँ अवधि बताने वाले क्रियाविशेषण के रूप में प्रयुक्त है; ‘सदा’ आधुनिक हिन्दी में संक्षिप्त और काव्यात्मक है।
- source_word: חֶסֶד
  choice: अटल प्रेम
  rationale: यह प्रेम के साथ स्थिर निष्ठा का भाव भी रखता है; ‘अटल प्रेम’ इसे केवल दया या भावनात्मक प्रेम तक सीमित नहीं करता।
- source_word: יִבָּנֶה
  choice: निर्मित होता रहेगा
  rationale: निफ़ाल अपूर्ण रूप की कर्मवाच्य और निरंतर/भावी छाया को रखते हुए भवन-निर्माण का काव्यात्मक रूपक सुरक्षित रखा गया है।
- source_word: שָׁמַיִם
  choice: आकाश
  rationale: हिब्रू बहुवचन रूप होने पर भी हिन्दी में ‘आकाश’ सामूहिक अर्थ में स्वाभाविक है और ऊँची काव्यात्मक शैली बनाए रखता है।
- source_word: תָּכִן
  choice: दृढ़ता से स्थापित करेगा
  rationale: हिफ़ील रूप किसी वस्तु को स्थिर या दृढ़ करने का भाव देता है; दूसरा पुरुष एकवचन सीधे परमेश्वर को संबोधित करता है।
- source_word: אֱמוּנָתְךָ
  choice: अपनी विश्वासयोग्यता
  rationale: यह संज्ञा दृढ़ता, भरोसेमंदी और निष्ठा का अर्थ रखती है; ‘विश्वासयोग्यता’ प्रसंग में सर्वाधिक स्पष्ट है।
- source_word: בָהֶם
  choice: आकाश में
  rationale: सर्वनाम का पूर्वपद שָׁמַיִם है; हिन्दी में पूर्वपद को दोहराना संदर्भ को स्पष्ट और सहज बनाता है।
theological_decisions:
- issue: חֶסֶד का वाचाई-काव्यात्मक अर्थ
  choice: अटल प्रेम
  alternative: करुणा; वाचा का प्रेम
  rationale: ‘अटल प्रेम’ प्रेम और स्थायी निष्ठा दोनों को समेटता है, पर पद में ‘वाचा’ शब्द जोड़कर अर्थ को आवश्यकता से अधिक संकीर्ण नहीं करता।
- issue: दूसरे चरण में परमेश्वर को सीधा संबोधन
  choice: ‘तू ... स्थापित करेगा’ के रूप में सीधा संबोधन
  alternative: विश्वासयोग्यता के स्थापित होने का निर्वैयक्तिक कथन
  rationale: क्रिया और संज्ञा-प्रत्यय दोनों स्पष्ट रूप से दूसरे पुरुष पुल्लिंग एकवचन हैं, इसलिए परमेश्वर से सीधा संबोधन मूल व्याकरण को सुरक्षित रखता है।
- issue: יִבָּנֶה में निर्माण-रूपक
  choice: निर्मित होता रहेगा
  alternative: स्थापित रहेगा
  rationale: मूल क्रिया ‘बनाना/निर्माण करना’ का रूपक रखती है। यद्यपि सामान्य अर्थ ‘स्थापित होना’ हो सकता है, मुख्य पाठ में काव्यात्मक तनाव सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण काव्यात्मक शैली रखी गई है। परमेश्वर को संबोधित करते हुए ‘तू’ का प्रयोग मूल के एकवचन सीधे संबोधन और भजन की निकट प्रार्थनात्मक भाषा को दर्शाता है; यह अनादर सूचित नहीं करता।
