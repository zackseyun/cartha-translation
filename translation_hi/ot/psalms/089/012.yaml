  yaml_path: translation/ot/psalms/089/012.yaml
  text: The north and the south—you created them[b][a]; Tabor and Hermon sing for joy in your name.
translation:
  language: hi
  text: 'उत्तर और दक्षिण[a]—दोनों को तूने रचा है;

    ताबोर और हेर्मोन तेरे नाम में आनन्द से गाते हैं[b]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उत्तर और दाहिनी ओर—दोनों को तूने रचा है।” यहाँ “दाहिनी ओर” सम्भवतः “दक्षिण” के लिए प्रयुक्त भौगोलिक मुहावरा है।
    reason: lexical_alternative
  - marker: b
    text: या, “तेरे नाम में आनन्द से जयजयकार करते हैं।”
    reason: lexical_alternative
lexical_decisions:
- source_word: צָפוֹן
  choice: उत्तर
  rationale: यहाँ सामान्य दिशासूचक अर्थ उपयुक्त है; इसे יָמִין के साथ रखने पर सृष्टि की व्यापकता बताने वाला उत्तर-दक्षिण युग्म बनता है।
- source_word: יָמִין
  choice: दक्षिण
  rationale: शाब्दिक अर्थ ‘दाहिना हाथ/दाहिनी ओर’ है, पर प्राचीन भौगोलिक अभिमुखता में यह ‘दक्षिण’ का सूचक हो सकता है; צָפוֹן के समानांतर यही अर्थ स्वाभाविक है।
- source_word: בְרָאתָם
  choice: दोनों को तूने रचा है
  rationale: क्रिया द्वितीय पुरुष एकवचन और प्रत्यय बहुवचन कर्म को व्यक्त करते हैं। ‘दोनों को’ उत्तर और दक्षिण की ओर स्पष्ट संकेत करता है, और ‘रचा है’ सृष्टिकर्म की स्थायी प्रासंगिकता सहित स्वाभाविक हिन्दी देता है।
- source_word: תָּבוֹר
  choice: ताबोर
  rationale: स्थानवाचक व्यक्तिवाचक नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: חֶרְמוֹן
  choice: हर्मोन
  rationale: स्थानवाचक व्यक्तिवाचक नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: בְּשִׁמְךָ
  choice: तेरे नाम में
  rationale: בְּ के क्षेत्र, आधार या अवसर संबंधी अर्थ को अनावश्यक रूप से सीमित किए बिना मूल अभिव्यक्ति की धार्मिक और काव्यात्मक व्यापकता बनाए रखता है।
- source_word: יְרַנֵּנוּ
  choice: आनन्द से गाते हैं
  rationale: רנן का पिएल रूप उल्लास की गूँजती पुकार या आनन्दगान दर्शाता है। पर्वतों के काव्यात्मक मानवीकरण में ‘आनन्द से गाते हैं’ स्वाभाविक है; ‘जयजयकार करते हैं’ भी संभव है।
theological_decisions:
- issue: צָפוֹן के समानांतर יָמִין का अर्थ
  choice: 'दिशासूचक समग्र युग्म: ‘उत्तर और दक्षिण’'
  alternative: 'शाब्दिक स्थानसूचक वाक्यांश: ‘उत्तर और दाहिनी ओर’'
  rationale: पद सृष्टि के विस्तृत क्षेत्र का गुणगान करता है। दिशासूचक मुहावरे के रूप में ‘दक्षिण’ काव्यात्मक युग्म को स्पष्ट करता है, जबकि पादटिप्पणी शाब्दिक विकल्प को सुरक्षित रखती है।
- issue: ताबोर और हर्मोन का आनन्द से गाना
  choice: पर्वतों का काव्यात्मक मानवीकरण
  alternative: उन पर्वतीय क्षेत्रों के निवासी आनन्द से गाते हैं
  rationale: मूल पाठ सीधे दोनों पर्वतों को बहुवचन क्रिया का कर्ता बनाता है, और भजन-काव्य में सृष्टि का परमेश्वर की स्तुति करना सामान्य मानवीकरण है। मुख्य पाठ इस चित्र को व्याख्यात्मक रूप से सपाट नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, काव्यात्मक और गरिमापूर्ण शैली अपनाई गई है। परमेश्वर के लिए एकवचन आत्मीय सम्बोधन ‘तू/तेरे’ रखा गया है। पंक्ति-विन्यास इब्रानी समानांतरता को उभारता है और पर्वतों के मानवीकरण को सुरक्षित रखता है।
