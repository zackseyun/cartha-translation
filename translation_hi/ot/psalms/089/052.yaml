  text: Blessed be Yahweh forever[a]. Amen and amen.
translation:
  language: hi
  text: याहवे सदा धन्य हों! आमीन और आमीन।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּרוּךְ
  choice: धन्य हों
  rationale: यह निष्क्रिय कृदन्त यहाँ आराधनात्मक आशीर्वचन या स्तुतिपरक उद्घोष के रूप में प्रयुक्त है। हिंदी में “धन्य हों” उसके भाव और गरिमा को स्वाभाविक रूप से व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय आधुनिक हिंदी लिप्यंतरण “याहवे” के रूप में रखा गया है।
- source_word: לְעוֹלָם
  choice: सदा
  rationale: इस पूर्वसर्गीय पदबंध का कालगत अर्थ अनंत अवधि तक है; “सदा” संक्षिप्त, स्वाभाविक और काव्यात्मक हिंदी समतुल्य है।
- source_word: אָמֵן
  choice: आमीन
  rationale: आराधना में प्रयुक्त इस स्वीकृतिपरक सूत्र का प्रचलित हिंदी लिप्यंतरण रखा गया है।
- source_word: וְאָמֵן
  choice: और आमीन
  rationale: संयोजक सहित दोहराव मूल पाठ की जोरदार आराधनात्मक पुष्टि को सुरक्षित रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा अथवा प्रभु
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम सीधे आया है। “याहवे” उसे उपाधि से प्रतिस्थापित किए बिना प्रस्तुत करता है और स्रोत-रूप के प्रचलित विद्वत्तापूर्ण उच्चारण के निकट है।
translation_notes:
  register: भाषा संक्षिप्त, गरिमापूर्ण और आराधनात्मक रखी गई है। विस्मयादिबोधक चिह्न इब्रानी आशीर्वचनात्मक उद्घोष की शक्ति स्पष्ट करता है। उपलब्ध इब्रानी पाठ में ऐसी कोई वास्तविक वैकल्पिक व्याख्या नहीं मिली जो दिए गए अंग्रेज़ी फुटनोट को उचित ठहराए, इसलिए अनावश्यक फुटनोट नहीं रखा गया।
