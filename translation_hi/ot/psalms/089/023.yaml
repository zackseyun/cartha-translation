  yaml_path: translation/ot/psalms/089/023.yaml
  text: And I will crush his adversaries before him[b][a], and strike down those who hate him.
translation:
  language: hi
  text: मैं उसके सामने उसके विरोधियों को चूर कर दूँगा[a], और उससे घृणा करनेवालों को मार गिराऊँगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसके सामने से उसके विरोधियों को चूर कर दूँगा”; इब्रानी मुहावरा शत्रुओं को उसकी उपस्थिति से हटा देने का भाव भी दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “प्रहार करूँगा”; इब्रानी क्रिया न्याय या युद्ध में प्रबल प्रहार का अर्थ दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכַתּוֹתִי
  choice: मैं ... चूर कर दूँगा
  rationale: כתת का प्रबल युद्ध-संबंधी अर्थ बनाए रखता है। रूप भूतकाल-जैसा है, पर वाचा की प्रतिज्ञाओं के इस क्रम में भविष्य का भाव देता है।
- source_word: מִפָּנָיו
  choice: उसके सामने
  rationale: शाब्दिक भाव ‘उसके मुख/उपस्थिति के सामने से’ है। ‘उसके सामने’ स्वाभाविक हिन्दी में स्थानिक बिंब को बनाए रखता है, जबकि शत्रुओं को उसके मार्ग या उपस्थिति से हटाने का आशय संदर्भ से स्पष्ट होता है।
- source_word: צָרָיו
  choice: उसके विरोधियों
  rationale: צר सक्रिय वैर और विरोध करनेवालों को दर्शाता है। ‘विरोधी’ दूसरे चरण के ‘घृणा करनेवाले’ से शब्दगत भेद भी बनाए रखता है।
- source_word: וּמְשַׂנְאָיו
  choice: उससे घृणा करनेवालों
  rationale: שׂנא के कृदन्त रूप का निरंतर या चारित्रिक घृणा का भाव स्वाभाविक आधुनिक हिन्दी में सुरक्षित रहता है।
- source_word: אֶגּוֹף
  choice: मार गिराऊँगा
  rationale: נגף युद्ध या न्याय में प्रबल प्रहार करके परास्त करने का अर्थ दे सकता है। ‘मार गिराऊँगा’ समानांतर पंक्ति के निर्णायक युद्ध-बिंब को व्यक्त करता है, पर इसे विशेष रूप से महामारी तक सीमित नहीं करता।
theological_decisions:
- issue: दाऊदी राजा से की गई वाचा की प्रतिज्ञा में परमेश्वर का योद्धा-रूप
  choice: परमेश्वर द्वारा राजा के शत्रुओं को सीधे और बलपूर्वक परास्त करने की भाषा बनाए रखी गई है।
  alternative: इसे सामान्य रूप से ‘हरा दूँगा’ या ‘उसकी रक्षा करूँगा’ कहना।
  rationale: दोनों इब्रानी क्रियाएँ प्रबल युद्धात्मक कार्रवाई व्यक्त करती हैं। इस बिंब को हल्का न करना मूल पाठ की राजकीय और वाचागत धर्मवैचारिक तीव्रता को सुरक्षित रखता है, बिना बाद की किसी विशिष्ट व्याख्या को जोड़ने के।
translation_notes:
  register: आधुनिक मानक हिन्दी; काव्यात्मक और गरिमापूर्ण, पर सामान्य पाठक के लिए सहज। ‘चूर कर दूँगा’ और ‘मार गिराऊँगा’ मूल की सशक्त समानांतर युद्ध-भाषा बनाए रखते हैं। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
