  yaml_path: translation/ot/psalms/089/021.yaml
  text: with whom my hand will be established[a]; indeed[c][b], my arm will strengthen him.
translation:
  language: hi
  text: जिसके साथ मेरा हाथ दृढ़ रहेगा[a]; हाँ, मेरी भुजा[b] उसे सामर्थ्य देगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जिसके साथ मेरा हाथ स्थिर रहेगी।”
    reason: lexical_alternative
  - marker: b
    text: “भुजा” शक्ति और सामर्थ्य का काव्यात्मक बिंब है।
    reason: cultural_note
lexical_decisions:
- source_word: אֲשֶׁר ... עִמּוֹ
  choice: उसके साथ
  rationale: सम्बन्धवाचक אֲשֶׁר पिछले पद में चुने हुए राजा की ओर संकेत करता है और עִמּוֹ का अर्थ ‘उसके साथ’ है। हिन्दी में प्रसंगगत सर्वनाम से यह सम्बन्ध स्वाभाविक रूप से व्यक्त होता है।
- source_word: יָדִי
  choice: मेरे हाथ का सहारा
  rationale: ‘हाथ’ की मूल काव्यात्मक छवि बनाए रखते हुए ‘सहारा’ जोड़ने से עִמּוֹ के साथ ईश्वरीय समर्थन का आशय सहज हिन्दी में स्पष्ट होता है।
- source_word: תִּכּוֹן
  choice: दृढ़ बना रहेगा
  rationale: כון के निफ़अल रूप में स्थिर, स्थापित या दृढ़ बने रहने का भाव है। यह चयन परिणामात्मक अर्थ और प्रतिज्ञात्मक भविष्य—दोनों को व्यक्त करता है।
- source_word: אַף
  choice: हाँ
  rationale: यह समानान्तर पंक्ति को बलपूर्वक आगे बढ़ाता है; ‘हाँ’ आधुनिक हिन्दी में इसके पुष्टिकारक बल को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: זְרוֹעִי
  choice: मेरी भुजा
  rationale: मूल की देहात्मक काव्य-छवि सुरक्षित रखी गई है; यहाँ ‘भुजा’ सामर्थ्य और शक्ति का बिंब है।
- source_word: תְאַמְּצֶנּוּ
  choice: उसे सामर्थ्य देगी
  rationale: אמץ के पिअेल रूप का अर्थ उसे बलवान या दृढ़ करना है। ‘सामर्थ्य देगी’ हिन्दी में स्वाभाविक है और प्रेरणार्थक भाव बनाए रखता है।
theological_decisions:
- issue: परमेश्वर के कार्य के लिए मानवरूपी भाषा
  choice: ‘हाथ’ और ‘भुजा’ की काव्यात्मक छवियाँ बनाए रखी गईं।
  alternative: दोनों को अमूर्त रूप में ‘शक्ति’ या ‘सामर्थ्य’ कहना।
  rationale: इब्रानी कविता दाऊदी राजा के लिए परमेश्वर के सक्रिय समर्थन को देहात्मक बिंबों द्वारा व्यक्त करती है। इन बिंबों को हटाने का कोई पाठगत या धर्मवैज्ञानिक कारण नहीं है।
- issue: भविष्य की प्रतिज्ञा बनाम सामान्य वर्तमान सत्य
  choice: ‘बना रहेगा’ और ‘देगी’ द्वारा भविष्यसूचक प्रतिज्ञा व्यक्त की गई।
  alternative: ‘दृढ़ रहता है’ और ‘सामर्थ्य देती है’ जैसा सामान्य वर्तमान।
  rationale: इस वाचा-सन्दर्भ में अपूर्ण क्रियारूप प्रतिज्ञात, निरन्तर भावी समर्थन को स्वाभाविक रूप से व्यक्त करते हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण काव्यात्मक गद्य; ‘हाथ’ और ‘भुजा’ की समानान्तर छवियाँ सुरक्षित हैं। ‘मेरे हाथ का सहारा’ शाब्दिक बिंब को बनाए रखते हुए हिन्दी में ‘हाथ उसके साथ दृढ़ होगा’ जैसी अस्वाभाविक अभिव्यक्ति से बचाता है।
