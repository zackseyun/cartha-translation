  yaml_path: translation/ot/psalms/089/001.yaml
  text: I will sing of the steadfast love of Yahweh forever[a]; from generation to generation I will make your faithfulness known with my mouth.
translation:
  language: hi
  text: मैं याहवे के अटल प्रेम का सदा गीत गाऊँगा[a]; मैं पीढ़ी-दर-पीढ़ी अपने मुँह से तेरी विश्वासयोग्यता प्रकट करूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “करुणाओं” अथवा “अटल प्रेम के कार्यों” का। इब्रानी शब्द חַסְדֵי याहवे के वाचा-निष्ठ प्रेम को, या उस प्रेम से बार-बार प्रकट होने वाली करुणा को, दर्शा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: חַסְדֵי
  choice: अटल प्रेम के कामों
  rationale: बहुवचन/निर्मित रूप חַסְדֵי यहाँ यहोवा के स्थायी वाचा-प्रेम को उसके बार-बार प्रकट होने वाले कृपापूर्ण कामों सहित दर्शाता है। यह रूप अर्थ की क्रियात्मकता और प्रेम की स्थिरता दोनों बचाता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में प्रचलित और सहज पहचाना जाने वाला रूप, जो मूल पाठ में आए परमेश्वर के व्यक्तिगत नाम को उपाधि से नहीं बदलता।
- source_word: עוֹלָם
  choice: सदा
  rationale: यहाँ क्रिया के साथ कालवाचक क्रियाविशेषण है और निरंतर अवधि व्यक्त करता है; ‘सदा’ स्वाभाविक तथा काव्यात्मक हिन्दी है।
- source_word: אָשִׁירָה
  choice: मैं ... गीत गाऊँगा
  rationale: कोहोर्टेटिव रूप संकल्प या दृढ़ अभिप्राय व्यक्त कर सकता है; भविष्यत् रूप हिन्दी में उस संकल्प को स्वाभाविक ढंग से प्रकट करता है।
- source_word: לְדֹר וָדֹר
  choice: पीढ़ी-दर-पीढ़ी
  rationale: यह मुहावरा लगातार आने वाली पीढ़ियों में निरंतरता व्यक्त करता है; चुना हुआ रूप संक्षिप्त और स्वाभाविक है।
- source_word: אוֹדִיעַ
  choice: प्रकट करूँगा
  rationale: हिफ़िल रूप का मूल भाव ‘ज्ञात कराना’ है; ‘प्रकट करूँगा’ मुख से घोषणा किए जाने के प्रसंग में स्पष्ट और स्वाभाविक है।
- source_word: אֱמוּנָתְךָ
  choice: तेरी विश्वासयोग्यता
  rationale: यह शब्द परमेश्वर की विश्वसनीयता, दृढ़ता और निष्ठा को व्यक्त करता है तथा חֶסֶד के समानांतर उपयुक्त है।
- source_word: בְּפִי
  choice: अपने मुँह से
  rationale: मूल की ठोस शारीरिक छवि और मुख से की गई घोषणा, दोनों को सीधे सुरक्षित रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में व्यक्तिगत वाचा-नाम है। हिन्दी पाठकों में ‘यहोवा’ अधिक स्थापित और पहचाना जाने वाला लिप्यंतरण है; इसे ‘प्रभु’ जैसी उपाधि से बदलने पर मूल नाम छिप जाता।
- issue: חַסְדֵי का अर्थ-क्षेत्र
  choice: अटल प्रेम के कामों
  alternative: करुणाओं / अटल प्रेम
  rationale: रूप बहुवचन है और भजन के वाचा-संदर्भ में स्थायी प्रेम के बार-बार दिखाई देने वाले कार्यों को सूचित कर सकता है। मुख्य पाठ में प्रेम और उसके कार्य दोनों रखे गए हैं, जबकि पादटिप्पणी वास्तविक वैकल्पिक अर्थ बताती है।
