  yaml_path: translation/ot/psalms/089/004.yaml
  text: I will establish your offspring forever[a], and build your throne for generation after generation[b]. Selah
translation:
  language: hi
  text: 'मैं तेरे वंश[a] को सदा के लिए स्थिर करूँगा,

    और पीढ़ी-दर-पीढ़ी तेरे सिंहासन को खड़ा करूँगा।

    सेला[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘तेरी संतान’; इब्रानी शब्द एकवचन है, पर सामूहिक रूप से वंशजों को भी दर्शा सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘सेला’ संभवतः संगीत या उपासना-संबंधी संकेत है; इसका ठीक अर्थ अनिश्चित है।
    reason: cultural_note
lexical_decisions:
- source_word: עַד עוֹלָם
  choice: सदा के लिए
  rationale: यह पदबंध निरंतर और स्थायी अवधि व्यक्त करता है; ‘सदा के लिए’ स्वाभाविक आधुनिक हिन्दी में वाचा की चिरस्थायी भावना बनाए रखता है।
- source_word: אָכִין
  choice: स्थिर करूँगा
  rationale: כון के हिफ़ील रूप का अर्थ स्थापित या दृढ़ करना है। ‘स्थिर करूँगा’ वंश की निरंतरता और दृढ़ता दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: זַרְעֶךָ
  choice: तेरे वंश
  rationale: זֶרַע व्याकरणतः एकवचन होकर सामूहिक अर्थ में संतान या वंशजों को दर्शा सकता है। ‘वंश’ राजकीय-वाचा के संदर्भ और सामूहिक भाव को सहज हिन्दी में सुरक्षित रखता है।
- source_word: וּבָנִיתִי
  choice: और ... दृढ़ बनाऊँगा
  rationale: मूल क्रिया का शाब्दिक बिंब ‘बनाना/निर्माण करना’ है और पूर्ववर्ती भविष्यकालीन क्रिया के समान इसका अर्थ भी भविष्यकालीन है। सिंहासन के साथ ‘दृढ़ बनाऊँगा’ हिन्दी में स्वाभाविक है और उसकी स्थायी स्थापना का भाव देता है।
- source_word: לְדֹר וָדֹר
  choice: पीढ़ी-दर-पीढ़ी
  rationale: यह अभिव्यक्ति लगातार आने वाली पीढ़ियों को सूचित करती है; यह हिन्दी रूप उसके पुनरावृत्त और दीर्घकालिक भाव को बनाए रखता है।
- source_word: כִּסְאֲךָ
  choice: तेरे सिंहासन
  rationale: राजकीय संदर्भ में כִּסֵּא का मानक अर्थ ‘सिंहासन’ है और यहाँ यह राजवंशीय शासन का द्योतक है।
- source_word: סֶלָה
  choice: सेला
  rationale: इस शब्द का ठीक अर्थ अनिश्चित है; अर्थ निर्धारित करने के बजाय लिप्यंतरण करना सबसे पारदर्शी और कम व्याख्यात्मक विकल्प है।
theological_decisions:
- issue: राजकीय-वाचा के संदर्भ में वंश और सिंहासन की प्रतिज्ञा
  choice: दाऊदी राजा को किया गया सीधा संबोधन और राजवंशीय भाषा यथावत रखी गई है।
  alternative: पद में मसीही पूर्ति को स्पष्ट जोड़ना, अथवा इसे केवल सामान्य संतान की प्रतिज्ञा बना देना।
  rationale: इब्रानी पाठ सीधे ‘तेरे वंश’ और ‘तेरे सिंहासन’ कहता है। अनुवाद को बाद की धर्मवैचारिक पूर्ति स्पष्ट रूप से जोड़कर या राजकीय अर्थ घटाकर मूल तनाव को समाप्त नहीं करना चाहिए।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, काव्यात्मक और सहज रूप अपनाया गया है। ‘तू/तेरा’ संबोधन मूल के एकवचन निकट संबोधन को रखता है। पंक्ति-विभाजन इब्रानी समानांतरता को स्पष्ट करता है।
