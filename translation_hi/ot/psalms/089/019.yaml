source:
  edition: WLC
  text: אָ֤ז דִּבַּ֥רְתָּֽ בְ/חָ֡זוֹן לַֽ/חֲסִידֶ֗י/ךָ וַ/תֹּ֗אמֶר שִׁוִּ֣יתִי עֵ֭זֶר עַל גִּבּ֑וֹר הֲרִימ֖וֹתִי בָח֣וּר מֵ/עָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/019.yaml
  text: Then you spoke in a vision to your faithful ones and said[a], “I have set help upon a mighty one[d][c][b]; I have exalted one chosen from the people.”
translation:
  language: hi
  text: तब तूने दर्शन में अपने विश्वासयोग्य जनों से बात की और कहा[a], “मैंने एक वीर को सहायता प्रदान की है[b]; मैंने लोगों में से एक चुने हुए व्यक्ति को ऊँचा उठाया है[c]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: एक अन्य पाठ-परम्परा के अनुसार, “अपने विश्वासयोग्य जन से।”
    reason: textual_variant
  - marker: b
    text: शाब्दिक रूप से, “मैंने एक वीर पर सहायता रखी है।” ‘वीर’ का अनुवाद ‘योद्धा,’ ‘पराक्रमी पुरुष’ या ‘बलवान जन’ भी हो सकता है।
    reason: lexical_and_syntactic_alternative
  - marker: c
    text: “चुने हुए व्यक्ति” का अर्थ “जवान” भी हो सकता है; यहाँ सन्दर्भ परमेश्वर द्वारा किए गए चयन के पक्ष में है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: तब
  rationale: यह कालवाचक क्रियाविशेषण बीते हुए काव्यात्मक वर्णन में परमेश्वर के कथन का आरम्भ करता है।
- source_word: דִּבַּרְתָּ בְחָזוֹן
  choice: तू ने दर्शन में ... कहा
  rationale: ‘दर्शन में’ प्रकाशन के माध्यम अथवा परिवेश को स्वाभाविक हिन्दी में व्यक्त करता है; आगे וַתֹּאמֶר के साथ हिन्दी में एक संयुक्त कथन सहज है।
- source_word: לַחֲסִידֶיךָ
  choice: अपने विश्वासयोग्य जनों से
  rationale: प्रदत्त WLC पाठ के बहुवचन को रखा गया है। ‘विश्वासयोग्य’ वाचा-निष्ठा और भक्ति का संकेत देता है, बिना बाद की पारिभाषिक धार्मिक धारणाएँ जोड़े।
- source_word: שִׁוִּיתִי עֵזֶר עַל
  choice: मैंने ... सहायता का भार सौंपा है
  rationale: मूल में सहायता को किसी वीर पर रखने का चित्र है। हिन्दी में ‘सहायता का भार सौंपना’ उस व्यक्ति को दूसरों की सहायता के लिए नियुक्त करने का सम्भावित भाव और ‘पर रखने’ की रूपकात्मक दिशा दोनों सुरक्षित रखता है।
- source_word: גִּבּוֹר
  choice: एक वीर
  rationale: यह शब्द बलवान पुरुष, योद्धा अथवा वीर को सूचित कर सकता है। ‘वीर’ संक्षिप्त, काव्यात्मक और व्यापक है।
- source_word: הֲרִימוֹתִי
  choice: ऊँचा किया है
  rationale: हिफ़ील रूप उठाने अथवा प्रतिष्ठित करने का भाव देता है; राजकीय सन्दर्भ में ‘ऊँचा किया’ स्वाभाविक है।
- source_word: בָחוּר
  choice: एक चुने हुए जन
  rationale: शब्द ‘जवान’ भी हो सकता है, पर यहाँ प्रजा में से दाऊद के चयन और उत्थान के समानान्तर ‘चुना हुआ’ अधिक संदर्भानुकूल है।
- source_word: מֵעָם
  choice: प्रजा में से
  rationale: מִן स्रोत अथवा समूह में से चयन बताता है; राजकीय संदर्भ में ‘प्रजा में से’ सहज हिन्दी है।
theological_decisions:
- issue: भजन 89 की वाचा में इस पद का अभिप्रेत व्यक्ति
  choice: अनुवाद को उसके तात्कालिक दाऊदी संदर्भ तक सीमित रखते हुए किसी स्पष्ट मसीही विस्तार को पाठ में नहीं जोड़ा गया।
  alternative: दाऊद से आगे मसीह की ओर संकेत करने वाला प्रतिरूपात्मक पाठ
  rationale: पद सीधे परमेश्वर द्वारा प्रजा में से एक व्यक्ति को चुनकर ऊँचा करने की बात करता है। आगे की प्रतिरूपात्मक व्याख्या सम्भव है, पर उसे अनुवाद में आरोपित करना आवश्यक नहीं।
- issue: לַחֲסִידֶיךָ की वचन-संख्या
  choice: प्रदत्त WLC पाठ के अनुसार बहुवचन ‘अपने विश्वासयोग्य जनों से’।
  alternative: एक अन्य पाठ-परम्परा के अनुसार एकवचन ‘अपने विश्वासयोग्य जन से’।
  rationale: मूल के प्रदत्त स्वरूप में बहुवचन है; प्राचीन पाठ-परम्पराओं में दिखने वाले एकवचन को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: שִׁוִּיתִי עֵזֶר עַל גִּבּוֹר का सम्बन्ध
  choice: वीर पर सहायता का दायित्व रखने, अर्थात उसे सहायक के रूप में नियुक्त करने का भाव।
  alternative: वीर को सहायता प्रदान करना।
  rationale: עֵזֶר को עַל גִּבּוֹר ‘वीर पर’ रखने की संरचना सहायता को वीर को दिए गए लाभ के बजाय उस पर रखे गए दायित्व के रूप में समझने की अनुमति देती है; फिर भी वाक्यांश की संक्षिप्त काव्यात्मकता के कारण दूसरी समझ सम्भव है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमामय काव्यात्मक शैली रखी गई है। परमेश्वर को सम्बोधन के लिए ‘तू’ भजन-साहित्य की निकट और पारम्परिक हिन्दी शैली के अनुरूप है। ‘सन्तों’ जैसे बाद की कलीसियाई पारिभाषिकता वाले शब्द से बचकर ‘विश्वासयोग्य जनों’ का प्रयोग किया गया है।
