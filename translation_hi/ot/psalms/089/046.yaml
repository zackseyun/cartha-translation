source:
  edition: WLC
  text: עַד מָ֣ה יְ֭הוָה תִּסָּתֵ֣ר לָ/נֶ֑צַח תִּבְעַ֖ר כְּמוֹ אֵ֣שׁ חֲמָתֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/046.yaml
  text: How long[a], O Yahweh? Will you hide yourself forever? Will your wrath burn like fire?
translation:
  language: hi
  text: कब तक, हे याहवे[a]? क्या तू अपने आप को सदा के लिए छिपाए रहेगा? क्या तेरा क्रोध आग की तरह जलेगा?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी: “YHWH”; परंपरागत रूप से “प्रभु” अनूदित।'
    reason: ईश्वरीय नाम के मूल व्यंजनात्मक रूप और उसके परंपरागत अनुवाद की जानकारी।
lexical_decisions:
- source_word: עַד מָה
  choice: कब तक
  rationale: यह इब्रानी विलाप की स्वाभाविक अभिव्यक्ति है, जो संकट की अवधि को लेकर व्याकुल प्रश्न व्यक्त करती है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम को हिन्दी में प्रचलित लिप्यंतरण द्वारा रखा गया है, न कि किसी उपाधि से बदला गया है।
- source_word: תִּסָּתֵר
  choice: अपने आपको छिपाए रहेगा
  rationale: निफ़अल रूप यहाँ आत्मवाचक अर्थ देता है; हिन्दी में यह स्वाभाविक रूप से परमेश्वर के दृष्टि से ओझल रहने का भाव व्यक्त करता है।
- source_word: לָנֶצַח
  choice: सदा
  rationale: यह अनिश्चित, दीर्घकालिक अवधि का बोध कराता है और प्रश्न में 'हमेशा' का भाव बनाए रखता है।
- source_word: תִּבְעַר
  choice: धधकता रहेगा
  rationale: मूल क्रिया 'जलना' का अर्थ रखती है; 'धधकना' प्रकोप और आग के सजीव रूपक को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: כְּמוֹ אֵשׁ
  choice: आग के समान
  rationale: मूल की सीधी उपमा को गरिमापूर्ण और स्पष्ट हिन्दी में रखा गया है।
- source_word: חֲמָתֶךָ
  choice: तेरा प्रकोप
  rationale: यह शब्द तीव्र, तप्त क्रोध का बोध देता है; 'प्रकोप' भजन की गरिमा तथा दैवी क्रोध की तीव्रता दोनों को व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम YHWH का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ सीधे वाचा के परमेश्वर को उनके व्यक्तिगत नाम से संबोधित करता है। इसलिए हिन्दी में परिचित लिप्यंतरण 'यहोवा' रखा गया है और [a] में परंपरागत उपाधि का उल्लेख किया गया है।
- issue: परमेश्वर के छिपने का कथन
  choice: क्या तू सदा अपने आपको छिपाए रहेगा?
  alternative: क्या तू सदा छिपा रहेगा?
  rationale: आत्मवाचक रूप को बनाए रखने से विलाप में अनुभव किए गए दैवी अप्रकटपन का तनाव सुरक्षित रहता है; कथन यह नहीं समझाता कि परमेश्वर वस्तुतः अनुपस्थित हैं।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और विलाप के अनुकूल हिन्दी। सीधे संबोधन की निकटता और तीव्रता बनाए रखने के लिए एकवचन 'तू/तेरा' का प्रयोग किया गया है।
