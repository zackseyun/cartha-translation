  text: You have renounced the covenant of your servant[b][a]; you have defiled his crown to the ground.
translation:
  language: hi
  text: तूने अपने सेवक की वाचा को ठुकरा दिया है[a]; तूने उसके मुकुट को धरती तक अपवित्र कर दिया है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘अस्वीकार कर दिया है’ अथवा ‘तिरस्कार किया है’।
    reason: lexical_alternative
  - marker: b
    text: या, ‘उसके राजमुकुट को धरती तक अपवित्र कर दिया है।’ ‘मुकुट’ के लिए प्रयुक्त इब्रानी शब्द में पवित्र समर्पण की अर्थ-छाया भी हो सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: נֵאַרְתָּה
  choice: ठुकरा दिया है
  rationale: पिएल रूप यहाँ सक्रिय अस्वीकृति या तिरस्कार व्यक्त करता है। ‘ठुकरा दिया’ आधुनिक हिन्दी में वाचा को अस्वीकार करने की प्रबलता को स्वाभाविक रूप से व्यक्त करता है।
- source_word: בְּרִית
  choice: वाचा
  rationale: दाऊदी राजवंश से जुड़े इस धार्मिक और राजकीय प्रसंग में ‘वाचा’ औपचारिक, संबंधपरक और धर्मवैचारिक भार को सुरक्षित रखती है।
- source_word: עַבְדֶּךָ
  choice: अपने सेवक
  rationale: यहाँ दाऊदी राजा परमेश्वर के अधीन राजकीय प्रतिनिधि के रूप में है; इसलिए ‘सेवक’ प्रसंगानुकूल और स्वाभाविक है।
- source_word: חִלַּלְתָּ
  choice: अपवित्र कर दिया है
  rationale: पिएल में यह क्रिया किसी पवित्र या प्रतिष्ठित वस्तु को अपवित्र अथवा अनादृत करने का अर्थ देती है। यह נֵזֶר में निहित अभिषेक/समर्पण की छाया को भी बनाए रखती है।
- source_word: לָאָרֶץ
  choice: भूमि पर
  rationale: शाब्दिक स्थानिक बिंब ‘धरती/भूमि पर’ है। ‘भूमि पर’ मुकुट के नीचे गिराए जाने और अपमानित होने का चित्र बनाए रखता है, बिना ऐसी अतिरिक्त क्रिया जोड़ने के जो मूल में स्पष्ट नहीं है।
- source_word: נִזְרוֹ
  choice: उसके मुकुट
  rationale: राजकीय प्रसंग में ‘मुकुट’ सबसे स्पष्ट अर्थ है, जबकि शब्द में समर्पण या पवित्रीकरण की अर्थ-छाया भी हो सकती है; इसे पाद-टिप्पणी में बताया गया है।
theological_decisions:
- issue: दाऊदी सेवक से जुड़ी राजकीय-वाचागत कल्पना
  choice: वाचा के ठुकराए जाने और राजा के अपमान—दोनों को तीखे विलाप के रूप में बनाए रखना
  alternative: भाषा को बाद की मसीही पूर्ति की ओर व्याख्यात्मक बनाना, अथवा इसे केवल राजनीतिक पराजय तक सीमित करना
  rationale: पद दाऊद के घराने के साथ परमेश्वर की वाचा के प्रत्यक्ष विफल हो जाने पर विलाप करता है। अनुवाद इस धर्मवैचारिक तनाव को हल किए बिना सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, काव्यात्मक किंतु साधारण पाठक के लिए स्पष्ट रखी गई है। परमेश्वर को संबोधित एकवचन निकट संबोधन के लिए ‘तूने’ मूल के प्रत्यक्ष विलाप और भजन-साहित्य की तीव्रता को व्यक्त करता है।
