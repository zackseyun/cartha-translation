  yaml_path: translation/ot/psalms/089/030.yaml
  text: If his sons abandon my law and do not walk in my judgments[b][a],
translation:
  language: hi
  text: यदि उसके पुत्र मेरी व्यवस्था को छोड़ दें और मेरे न्याय-विधानों के अनुसार न चलें,[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मेरी शिक्षा।” इब्रानी शब्द तोराह का अर्थ व्यवस्था के साथ-साथ शिक्षा या निर्देश भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “मेरे विधानों के अनुसार न चलें।”
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: यदि
  rationale: यह शर्तसूचक उपवाक्य आरम्भ करता है; ‘यदि’ मूल के संभावनार्थक भाव को सहज रूप से बनाए रखता है।
- source_word: יַעַזְבוּ
  choice: छोड़ दें
  rationale: עזב का अर्थ छोड़ना या त्याग देना है। ‘छोड़ दें’ आधुनिक हिन्दी में स्वाभाविक है और यहाँ व्यवस्था से विमुख होने का भाव व्यक्त करता है।
- source_word: בָנָיו
  choice: उसके पुत्र
  rationale: मूल इब्रानी में स्पष्ट रूप से पुल्लिंग बहुवचन और तृतीय पुरुष एकवचन संबंधसूचक प्रत्यय है; इसलिए ‘उसके पुत्र’ रखा गया है।
- source_word: תּוֹרָתִי
  choice: मेरी व्यवस्था
  rationale: תּוֹרָה शिक्षा अथवा व्यवस्था दोनों को सूचित कर सकती है। समानांतर पद ‘मेरे न्याय-विधान’ के कारण यहाँ विधिक-वाचाई अर्थ प्रमुख है।
- source_word: וּבְמִשְׁפָּטַי
  choice: मेरे न्याय-विधानों के अनुसार
  rationale: מִשְׁפָּטִים न्यायिक निर्णयों, विधानों या नियमों को सूचित कर सकता है। हिन्दी में ‘के अनुसार चलना’ मूल בְּ के मानक-अनुरूप भाव और विधिक अर्थ को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: לֹא יֵלֵכוּן
  choice: न चलें
  rationale: הלך यहाँ आचरण के लिए प्रयुक्त ‘चलने’ का वाचाई रूपक है; हिन्दी में भी यह रूपक स्पष्ट और स्वाभाविक है।
theological_decisions:
- issue: वाचाई-विधिक संदर्भ में תּוֹרָה का अनुवाद
  choice: मेरी व्यवस्था
  alternative: मेरी शिक्षा
  rationale: תּוֹרָה का व्यापक अर्थ ‘शिक्षा’ हो सकता है, पर ‘मेरे न्याय-विधानों’ के साथ समानांतरता यहाँ विधिक-वाचाई रंग को प्रमुख बनाती है।
- issue: בָנָיו में लिंग का निरूपण
  choice: उसके पुत्र
  alternative: उसकी संतान
  rationale: इब्रानी शब्द स्पष्ट रूप से पुल्लिंग बहुवचन है और दाऊदी वाचा के संदर्भ में पुत्रों/वंशजों की ओर संकेत करता है; इसलिए मुख्य पाठ में पुल्लिंग रूप सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। ‘न चलें’ वाचाई आचरण का बाइबलीय रूपक बनाए रखता है; ‘न्याय-विधान’ מִשְׁפָּטִים के न्यायिक और नियामक दोनों पहलुओं को समेटता है।
