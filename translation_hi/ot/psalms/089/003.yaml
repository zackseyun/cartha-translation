  text: 'I have made a covenant with my chosen one[a]; I have sworn to David my servant:'
translation:
  language: hi
  text: “मैंने अपने चुने हुए के साथ वाचा बाँधी है[a]; मैंने अपने सेवक दाऊद से शपथ खाई है:”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “मैंने अपने चुने हुए के साथ वाचा काटी है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּרַתִּי
  choice: मैंने…वाचा बाँधी है
  rationale: כרת ברית का शाब्दिक अर्थ ‘वाचा काटना’ है, पर यह वाचा स्थापित करने का प्रचलित इब्रानी मुहावरा है। हिंदी में ‘वाचा बाँधना’ स्वाभाविक, गरिमापूर्ण और पारंपरिक रूप से अर्थ-सटीक है; पूर्ण क्रिया का वर्तमान तक प्रभाव ‘है’ से व्यक्त होता है।
- source_word: בְרִית
  choice: वाचा
  rationale: यह शब्द साधारण समझौते से अधिक गंभीर और बंधनकारी संबंध को दर्शाता है; ‘वाचा’ इसकी धर्मवैचारिक गरिमा बनाए रखती है।
- source_word: לִבְחִירִי
  choice: अपने चुने हुए जन के साथ
  rationale: ברית के साथ ל यहाँ संबंध के सहभागी को सूचित करता है, इसलिए ‘के साथ’ उपयुक्त है। ‘चुने हुए जन’ व्यक्तिगत संबोधन को स्पष्ट रखते हुए अस्वाभाविक ‘निर्वाचित’ से बचता है।
- source_word: נִשְׁבַּעְתִּי
  choice: मैंने…शपथ खाई है
  rationale: निफ़अल रूप शपथ लेने को व्यक्त करता है। ‘शपथ खाई है’ हिंदी का स्वाभाविक और गंभीर प्रयोग है तथा शपथ की बनी हुई वैधता दर्शाता है।
- source_word: לְדָוִד
  choice: दाऊद से
  rationale: נשבע के बाद ל उस व्यक्ति को चिह्नित करता है जिसके प्रति शपथ ली गई है। हिंदी में ‘दाऊद से शपथ खाई’ स्वाभाविक प्रयोग है।
- source_word: עַבְדִּי
  choice: अपने सेवक
  rationale: दाऊद के लिए यह राजकीय और वाचागत पदवी है; ‘सेवक’ संदर्भानुकूल है, जबकि ‘दास’ यहाँ अनावश्यक रूप से बंधुआ स्थिति पर बल दे सकता है।
theological_decisions:
- issue: ‘अपने चुने हुए जन’ की पहचान
  choice: पद में निकटतम संदर्भ दाऊद ही रखा गया है, बिना अनुवाद में प्रत्यक्ष मसीही पहचान जोड़े।
  alternative: इसे दाऊद से आगे प्रतिरूपात्मक या मसीही संकेत के रूप में स्पष्ट करना।
  rationale: समानांतर पंक्ति ‘अपने सेवक दाऊद’ कहती है, इसलिए इस पद में सीधा अभिप्राय दाऊद है। व्यापक मसीही अर्थ व्याख्या का विषय है, अनुवाद में जोड़ने का नहीं।
translation_notes:
  register: आधुनिक मानक हिंदी में सहज किंतु गरिमापूर्ण काव्यात्मक शैली रखी गई है। ‘वाचा बाँधना’ इब्रानी मुहावरे का स्वाभाविक हिंदी समतुल्य है; पद के अंत का द्विबिंदु अगले पद में आने वाली शपथ की विषयवस्तु की ओर संकेत करता है।
