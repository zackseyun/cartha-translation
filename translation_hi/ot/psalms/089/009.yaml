  text: אַתָּ֣ה מ֭וֹשֵׁל בְּ/גֵא֣וּת הַ/יָּ֑ם בְּ/שׂ֥וֹא גַ֝לָּ֗י/ו אַתָּ֥ה תְשַׁבְּחֵֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/009.yaml
  text: You rule over the swelling of the sea[a]; when its waves rise[b], you still them.
translation:
  language: hi
  text: तू समुद्र के उफान पर अधिकार रखता है[a]; जब उसकी लहरें उठती हैं, तू उन्हें शांत कर देता है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “समुद्र के गर्व/प्रताप पर।” इब्रानी शब्द ऊँचाई, प्रताप या उफान का अर्थ दे सकता है; यहाँ उठती लहरों का संदर्भ ‘उफान’ के अर्थ का समर्थन करता है।
    reason: lexical_alternative
  - marker: b
    text: या “तू उन्हें थाम लेता है” अथवा “तू उन्हें वश में कर लेता है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: מוֹשֵׁל
  choice: शासन करता है
  rationale: इब्रानी कृदंत निरंतर और सक्रिय प्रभुत्व व्यक्त करता है; ‘शासन करता है’ आधुनिक हिन्दी में स्वाभाविक रहते हुए इस अर्थ को सुरक्षित रखता है।
- source_word: בְּגֵאוּת
  choice: उमड़ने पर
  rationale: גֵּאוּת का अर्थ गर्व, प्रताप या उफान हो सकता है। समुद्र और उठती लहरों के संदर्भ में ‘उमड़ना’ ठोस जल-चित्र को स्वाभाविक हिन्दी में व्यक्त करता है; בְּ को מוֹשֵׁל के साथ ‘पर’ कहा गया है।
- source_word: הַיָּם
  choice: समुद्र
  rationale: יָם का मानक और काव्यात्मक हिन्दी प्रतिशब्द ‘समुद्र’ है।
- source_word: בְּשׂוֹא
  choice: जब ... उठती हैं
  rationale: निषेधात्मक नहीं, बल्कि परिस्थितिसूचक infinitive construct लहरों के उठने का समय बताता है; हिन्दी में ‘जब ... उठती हैं’ स्पष्ट और सहज है।
- source_word: גַלָּיו
  choice: उसकी लहरें
  rationale: प्रत्यय का पूर्वपद ‘समुद्र’ है; हिन्दी में उसके लिए स्वाभाविक संबंधसूचक रूप ‘उसकी’ है।
- source_word: תְשַׁבְּחֵם
  choice: उन्हें शांत कर देता है
  rationale: यहाँ पिएल रूप अशांत जल को शांत या वश में करने का भाव देता है। ‘शांत कर देता है’ स्पष्ट, सजीव और संदर्भानुकूल है।
theological_decisions:
- issue: अराजक जल पर परमेश्वर की प्रभुता का चित्रण
  choice: पद को समुद्र और उसकी लहरों पर परमेश्वर के प्रत्यक्ष, सार्वभौम नियंत्रण की घोषणा के रूप में रखा गया है।
  alternative: इसे ब्रह्मांडीय अराजकता पर परमेश्वर की विजय की मिथकीय-काव्यात्मक ओर संकेत करने वाला माना जा सकता है।
  rationale: मूल पद समुद्र पर परमेश्वर की प्रभुता को सीधे चित्रित करता है। अनुवाद ठोस काव्यात्मक बिंब को बनाए रखता है, पर मुख्य पाठ में कोई विस्तृत मिथकीय ढाँचा नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण काव्यात्मक रजिस्टर अपनाया गया है। भजन में परमेश्वर के लिए निकटवर्ती एकवचन संबोधन के अनुरूप ‘तू’ रखा गया है। वाक्य सरल और जनसुलभ है, जबकि समुद्र के उमड़ने और लहरों के उठने का मूल बिंब सुरक्षित है।
