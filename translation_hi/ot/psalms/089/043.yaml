translation:
  language: hi
  text: तू उसकी तलवार की धार को भी पीछे मोड़ देता है[a], और तूने उसे युद्ध में खड़ा रहने योग्य नहीं बनाया है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तू उसकी तलवार की धार कुंद कर देता है।” इब्रानी में शाब्दिक भाव “तलवार की धार को पीछे मोड़ना” है, अर्थात उसे निष्प्रभावी कर देना।
    reason: lexical_alternative
  - marker: b
    text: या, “तूने युद्ध में उसे संभाला नहीं” अथवा “उसे युद्ध में टिके रहने नहीं दिया।”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף
  choice: भी
  rationale: यहाँ यह विलाप की पिछली बातों से इस आरोप को जोड़ते हुए उस पर बल देता है; हिन्दी में ‘भी’ इस योगात्मक-बलात्मक अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: תָּשִׁיב
  choice: पीछे मोड़ दी है
  rationale: שוב के हिफ़ील रूप का मूल भाव ‘वापस/पीछे मोड़ना’ है। तलवार की धार के साथ यह उसके निष्प्रभावी किए जाने की सजीव छवि बनाए रखता है।
- source_word: צוּר חַרְבּוֹ
  choice: उसकी तलवार की धार
  rationale: इस संबंध में צוּר का अर्थ ‘चट्टान’ नहीं, बल्कि तलवार की धार या तीक्ष्णता है। ‘तलवार की धार’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: הֲקֵימֹתוֹ
  choice: उसे टिके रहने नहीं दिया
  rationale: קום के हिफ़ील का अर्थ ‘खड़ा करना/खड़ा रहने योग्य बनाना’ है। युद्ध के प्रसंग में ‘टिके रहने देना’ अपने मोर्चे पर खड़े रहने या संभले रहने का ठोस भाव देता है।
- source_word: בַּמִּלְחָמָה
  choice: युद्ध में
  rationale: यह सैन्य संघर्ष का सामान्य प्रसंग बताता है; ‘युद्ध में’ संक्षिप्त और स्वाभाविक हिन्दी है।
theological_decisions:
- issue: परमेश्वर को दाऊदी राजा की सैन्य पराजय का प्रत्यक्ष कर्ता बताना
  choice: 'द्वितीय पुरुष में परमेश्वर की प्रत्यक्ष भूमिका बनाए रखी गई: ‘तूने... मोड़ दी है’ और ‘नहीं दिया।’'
  alternative: दैवी कर्तृत्व को नरम करने के लिए निष्क्रिय या अवैयक्तिक वाक्य-विन्यास
  rationale: इब्रानी विलाप राजा की सैन्य विफलता को सीधे परमेश्वर के कार्य से जोड़ता है। इस धर्मवैचारिक तनाव को अनुवाद में कम नहीं किया जाना चाहिए।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी। परमेश्वर के लिए भजन की सीधी एकवचन संबोधन-शैली के अनुरूप ‘तू’ रखा गया है। ‘पीछे मोड़ दी’ मूल रूपक को बचाता है, जबकि पादटिप्पणी उसका अर्थ स्पष्ट करती है।
