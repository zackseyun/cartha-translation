  text: וְ/שַׂמְתִּ֣י בַ/יָּ֣ם יָד֑/וֹ וּֽ/בַ/נְּהָר֥וֹת יְמִינֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/025.yaml
  text: I will set his hand on the sea[a], and his right hand on the rivers.
translation:
  language: hi
  text: मैं उसका हाथ समुद्र पर रखूँगा[a], और उसका दाहिना हाथ नदियों पर।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं उसका हाथ समुद्र के ऊपर और उसका दाहिना हाथ नदियों के ऊपर रखूँगा”—यह बिंब संभवतः प्रभुत्व या पहुँच को व्यक्त करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתִּי
  choice: मैं ... रखूँगा
  rationale: संयोजक वाव के साथ काल रूप प्रतिज्ञात्मक संदर्भ में भविष्य का भाव देता है। ‘रखूँगा’ ठोस काव्यात्मक बिंब को बनाए रखता है।
- source_word: בַיָּם
  choice: समुद्र पर
  rationale: ב यहाँ समुद्र के संबंध में हाथ रखने के प्रभुत्व-वाचक बिंब का भाग है। ‘पर’ मूल चित्र को स्वाभाविक हिन्दी में रखता है, जबकि ‘के ऊपर’ शासन के भाव को अधिक स्पष्ट करके व्याख्यात्मक हो सकता है।
- source_word: יָדוֹ
  choice: उसका हाथ
  rationale: शक्ति और पहुँच का संकेत देने वाले मूल शारीरिक बिंब को ज्यों का त्यों रखा गया है।
- source_word: וּבַנְּהָרוֹת
  choice: और ... नदियों पर
  rationale: נְהָרוֹת का सामान्य अर्थ ‘नदियाँ’ है। समानांतरता और स्पष्टता के लिए ‘पर’ दोहराया गया है।
- source_word: יְמִינוֹ
  choice: उसका दाहिना हाथ
  rationale: यह अनुवाद इब्रानी समानांतरता तथा दाहिने हाथ से जुड़े सामर्थ्य और अधिकार के संकेत को सुरक्षित रखता है।
theological_decisions:
- issue: राजकीय प्रभुत्व का बिंब
  choice: समुद्र और नदियों पर रखे गए हाथ तथा दाहिने हाथ के ठोस बिंब को बनाए रखा गया है; इससे व्यापक प्रभुत्व का संकेत मिलता है, पर उसे मुख्य पाठ में स्पष्ट व्याख्या नहीं बनाया गया।
  alternative: मैं समुद्र पर उसका अधिकार और नदियों पर उसकी सामर्थ्य स्थापित करूँगा।
  rationale: पद काव्यात्मक और रूपकात्मक है तथा संभवतः राजा को परमेश्वर से मिले विस्तृत प्रभुत्व का वर्णन करता है। मूल रूपक को व्याख्यात्मक कथन में बदलने के बजाय उसे सुरक्षित रखना उचित है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और काव्यात्मक शैली अपनाई गई है। ‘हाथ’ और ‘दाहिना हाथ’ की समानांतर संरचना तथा समुद्र–नदियों का विस्तार-बोध सुरक्षित रखा गया है।
