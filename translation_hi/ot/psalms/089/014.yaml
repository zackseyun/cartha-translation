  text: צֶ֣דֶק וּ֭/מִשְׁפָּט מְכ֣וֹן כִּסְאֶ֑/ךָ חֶ֥סֶד וֶ֝/אֱמֶ֗ת יְֽקַדְּמ֥וּ פָנֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/014.yaml
  text: Righteousness and justice are the foundation of your throne[a]; steadfast love and faithfulness go before you.
translation:
  language: hi
  text: धार्मिकता और न्याय तेरे सिंहासन की नींव हैं; अटल प्रेम और निष्ठा तेरे आगे-आगे चलते हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: צֶדֶק
  choice: धार्मिकता
  rationale: מִשְׁפָּט के साथ युग्म में यह नैतिक खराई और उचित व्यवस्था को व्यक्त करता है; ‘न्याय’ से अलग अर्थ बनाए रखता है।
- source_word: מִשְׁפָּט
  choice: न्याय
  rationale: राजकीय शासन के संदर्भ में यह न्यायिक न्याय को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: מְכוֹן
  choice: नींव
  rationale: यह स्थिर आधार या स्थापित स्थान को दर्शाता है; सिंहासन के रूपक में ‘नींव’ स्पष्ट और स्वाभाविक है।
- source_word: כִּסְאֶךָ
  choice: तेरे सिंहासन
  rationale: राजकीय रूपक और एकवचन द्वितीय पुरुष संबंधसूचक प्रत्यय को सीधे सुरक्षित रखता है।
- source_word: חֶסֶד
  choice: अटल प्रेम
  rationale: यह निष्ठावान, टिकाऊ और संबंधपरक प्रेम को सहज हिन्दी में व्यक्त करता है, बिना किसी विशिष्ट सांप्रदायिक व्याख्या को आरोपित किए।
- source_word: אֱמֶת
  choice: सच्चाई
  rationale: शब्द में सत्य और विश्वसनीयता दोनों की अर्थछाया है। ‘सच्चाई’ हिन्दी में इस व्यापकता को ‘विश्वासयोग्यता’ की अपेक्षा बेहतर सुरक्षित रखती है।
- source_word: יְקַדְּמוּ
  choice: सम्मुख चलते हैं
  rationale: क्रिया के आगे जाने या आगे उपस्थित होने के काव्यात्मक बिंब को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: פָנֶיךָ
  choice: तेरे सम्मुख
  rationale: शाब्दिक अर्थ ‘तेरे मुख के आगे’ है; ‘तेरे सम्मुख’ उसी स्थानिक और उपस्थिति-संबंधी भाव को प्राकृतिक हिन्दी में बनाए रखता है।
theological_decisions:
- issue: חֶסֶד וֶאֱמֶת का अनुवाद
  choice: अटल प्रेम और सच्चाई
  alternative: करुणा और विश्वासयोग्यता
  rationale: चुना हुआ रूप חֶסֶד की स्थायी निष्ठा और אֱמֶת के सत्य/विश्वसनीयता के अर्थ-विस्तार को बनाए रखता है; उसे केवल अमूर्त सत्य या किसी तकनीकी वाचा-संबंधी पद तक सीमित नहीं करता।
- issue: פָנֶיךָ को शाब्दिक ‘तेरा मुख’ या मुहावरेदार ‘तेरे सम्मुख’ कहना
  choice: तेरे सम्मुख
  alternative: तेरे मुख के आगे
  rationale: ‘तेरे सम्मुख’ आधुनिक हिन्दी में स्वाभाविक है और हिब्रू के मुख/उपस्थिति वाले काव्यात्मक भाव को पर्याप्त रूप से सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; काव्यात्मक किंतु सरल और गरिमापूर्ण शैली। परमेश्वर के लिए निकट, एकवचन संबोधन ‘तेरे’ रखा गया है, जो भजन की सीधी वाणी के अनुकूल है। समानांतर पद-युग्म और राजकीय बिंब सुरक्षित रखे गए हैं।
