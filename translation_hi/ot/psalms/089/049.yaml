lexical_decisions:
- source_word: אַיֵּה
  choice: कहाँ हैं
  rationale: यह स्थान अथवा वर्तमान अस्तित्व के विषय में प्रश्न करता है; बहुवचन ‘काम’ के साथ ‘हैं’ स्वाभाविक है।
