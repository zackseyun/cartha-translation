  choice: तेरे ... अटल प्रेम के काम
  rationale: חֶסֶד वाचा के प्रति निष्ठावान, स्थिर प्रेम या करुणा को दर्शाता है। इब्रानी बहुवचन को सहज हिन्दी में व्यक्त करने के लिए ‘काम’ जोड़ा गया है।
- source_word: הָרִאשֹׁנִים
  choice: पहले के
  rationale: यह बीते समय में प्रकट हुई कृपाओं की वर्तमान संकट से तुलना करता है; ‘पहले के’ आधुनिक हिन्दी में सहज है।
- source_word: אֲדֹנָי
  choice: हे प्रभु
  rationale: यह परमेश्वर को सीधे संबोधित करने वाला दिव्य शीर्षक है; सम्बोधन में ‘हे प्रभु’ स्वाभाविक और गरिमापूर्ण है।
- source_word: נִשְׁבַּעְתָּ
  choice: तूने ... शपथ खाई थी
  rationale: यह दाऊद को पहले दी गई शपथ की ओर संकेत करता है; हिन्दी का पूर्ण भूतकाल प्रसंग के अनुकूल है।
- source_word: לְדָוִד
  choice: दाऊद से
  rationale: हिन्दी में किसी व्यक्ति को प्रतिज्ञा देने के अर्थ में ‘दाऊद से शपथ खाना’ सहज अभिव्यक्ति है।
- source_word: בֶּאֱמוּנָתֶךָ
  choice: अपनी विश्वासयोग्यता में
  rationale: אֱמוּנָה दृढ़ता, भरोसेमंदी और विश्वासयोग्यता को दर्शाता है। בְּ यहाँ शपथ के ढंग या आधार के बीच कुछ अर्थगत खुलापन रखता है।
theological_decisions:
- issue: वाचा-विलाप के प्रसंग में חֶסֶד का अनुवाद
  choice: अटल प्रेम
  alternative: करुणा; अटल कृपाएँ
  rationale: भजन दाऊद के प्रति परमेश्वर की वाचा-निष्ठा की दुहाई देता है। ‘अटल प्रेम’ इस स्थायी और संबंधपरक अर्थ को सामान्य आधुनिक हिन्दी में स्पष्ट रखता है।
- issue: חֲסָדֶיךָ के बहुवचन को स्पष्ट करना
  choice: अटल प्रेम के काम
  alternative: अटल प्रेम; करुणाएँ
  rationale: ‘प्रेमों’ हिन्दी में अस्वाभाविक है। ‘काम’ बीते समय में प्रकट हुई वाचा-निष्ठा की अनेक अभिव्यक्तियों को स्पष्ट करता है।
- issue: בֶּאֱמוּנָתֶךָ में בְּ का संबंध
  choice: अपनी विश्वासयोग्यता में
  alternative: अपनी विश्वासयोग्यता के कारण; अपनी विश्वासयोग्यता से
  rationale: ‘में’ मूल वाक्यांश की वह अस्पष्टता बचाता है जिसमें विश्वासयोग्यता शपथ का ढंग, क्षेत्र या आधार हो सकती है।
