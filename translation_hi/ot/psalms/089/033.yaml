  text: But my steadfast love I will not remove from him[b][a], nor will I deal falsely in my faithfulness.
translation:
  language: hi
  text: फिर भी मैं अपना अटल प्रेम उससे नहीं हटाऊँगा[a], और न अपनी विश्वासयोग्यता से मुकरूँगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘मेरा करुणामय प्रेम’ अथवा ‘मेरा वाचा-संबंधी प्रेम’।
    reason: lexical_alternative
  - marker: b
    text: या ‘अपनी विश्वासयोग्यता के विषय में झूठा ठहरूँगा’।
    reason: lexical_alternative
lexical_decisions:
- source_word: חַסְדִּי
  choice: अपना अटल प्रेम
  rationale: חֶסֶד यहाँ परमेश्वर के स्थायी, संबंधनिष्ठ और वाचा-संबंधी प्रेम को व्यक्त करता है। ‘अटल प्रेम’ भाव और दृढ़ता दोनों को सहज आधुनिक हिन्दी में बनाए रखता है।
- source_word: אָפִיר
  choice: नहीं हटाऊँगा
  rationale: פור के हिफ़ील रूप का आशय किसी वस्तु को दूर कर देना या वापस ले लेना है। מֵעִמּוֹ के साथ ‘उससे नहीं हटाऊँगा’ स्वाभाविक और अर्थानुकूल है।
- source_word: מֵעִמּוֹ
  choice: उससे
  rationale: यह संबंधवाचक पद उस व्यक्ति से अलग करने या दूर ले जाने का भाव देता है; हिन्दी में ‘उससे’ संक्षिप्त और स्वाभाविक है।
- source_word: אֲשַׁקֵּר
  choice: झूठा निकलूँगा
  rationale: שׁקר का पिएल रूप केवल मौखिक झूठ बोलने के बजाय मिथ्या या अविश्वसनीय सिद्ध होने का भाव भी रखता है। ‘झूठा निकलूँगा’ इस व्यापक अर्थ को बनाए रखता है।
- source_word: בֶּאֱמוּנָתִי
  choice: अपनी विश्वासयोग्यता में
  rationale: אֱמוּנָה यहाँ भरोसेमंदी और निष्ठा का बोध कराता है। בְּ की कुछ हद तक मुहावरेदार रचना को ‘विश्वासयोग्यता में’ के द्वारा यथासंभव सुरक्षित रखा गया है।
- source_word: וְ
  choice: फिर भी
  rationale: पिछली आयतों में बताए गए अनुशासन के विपरीत यहाँ परमेश्वर के स्थायी प्रेम पर बल है; ‘फिर भी’ इस संदर्भगत विरोध को स्पष्ट करता है।
theological_decisions:
- issue: दाऊदी राजा के प्रति परमेश्वर की वाचा-संबंधी प्रतिबद्धता
  choice: ‘अटल प्रेम’ और ‘विश्वासयोग्यता’ द्वारा परमेश्वर की स्थायी निष्ठा व्यक्त करना
  alternative: ‘दया’ और ‘सच्चाई’ जैसे अधिक पारंपरिक शब्द प्रयोग करना
  rationale: आयत यह तनाव बनाए रखती है कि परमेश्वर अनुशासन देता है, फिर भी अपनी संबंधनिष्ठ प्रतिबद्धता वापस नहीं लेता। चुने गए शब्द किसी बाद की सांप्रदायिक व्याख्या को जोड़े बिना इस बात को स्पष्ट रखते हैं।
- issue: אֲשַׁקֵּר בֶּאֱמוּנָתִי का संबंध
  choice: ‘अपनी विश्वासयोग्यता में झूठा निकलूँगा’
  alternative: ‘अपनी विश्वासयोग्यता से मुकरूँगा’
  rationale: चुना हुआ पाठ इब्रानी के मुहावरे और उसकी हल्की अस्पष्टता को बनाए रखता है—परमेश्वर न मिथ्या आचरण करेगा, न अपनी निष्ठा को अविश्वसनीय सिद्ध होने देगा।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और काव्यात्मक रखी गई है। ‘फिर भी’ पूर्ववर्ती अनुशासन और यहाँ व्यक्त अटल निष्ठा के बीच विरोध को सहज रूप से सामने लाता है।
