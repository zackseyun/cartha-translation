base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/027.yaml
  text: Indeed[a], I will make him the firstborn, the highest of the kings of the earth.
translation:
  language: hi
  text: हाँ, मैं उसे पहलौठा ठहराऊँगा[a], पृथ्वी के राजाओं में सर्वोच्च।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ “पहलौठा” अनिवार्यतः वास्तविक जन्मक्रम को नहीं, बल्कि सर्वोच्च पद और विशेषाधिकार को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף
  choice: हाँ
  rationale: यहाँ यह कण पहले कही बात में एक और दृढ़ ईश्वरीय प्रतिज्ञा जोड़ते हुए बल देता है; ‘हाँ’ आधुनिक हिन्दी में इस पुष्टिकारक बल को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: אָ֭נִי
  choice: मैं
  rationale: इब्रानी में स्वतंत्र सर्वनाम स्पष्ट है और वक्ता पर बल देता है; हिन्दी में ‘मैं’ इसे बनाए रखता है।
- source_word: בְּכוֹר
  choice: पहिलौठा
  rationale: मूल का पद सुरक्षित रखा गया है। यहाँ यह अनिवार्यतः जन्मक्रम नहीं, बल्कि सर्वोच्च पद, अधिकार और विशेषाधिकार सूचित करता है।
- source_word: אֶתְּנֵהוּ
  choice: उसे ... ठहराऊँगा
  rationale: נתן यहाँ किसी को एक पद या स्थिति प्रदान करने के अर्थ में है; ‘ठहराऊँगा’ नियुक्ति और परिणामी स्थिति दोनों को व्यक्त करता है।
- source_word: עֶלְיוֹן
  choice: सर्वोच्च
  rationale: यह पृथ्वी के राजाओं की तुलना में सबसे ऊँचे पद को दर्शाता है; ‘सर्वोच्च’ स्पष्ट है और इसे परमेश्वर की उपाधि समझे जाने की आशंका कम करता है।
- source_word: לְמַלְכֵי אָרֶץ
  choice: पृथ्वी के राजाओं में
  rationale: लामेद यहाँ संबंध या तुलना दर्शाता है। ‘राजाओं में सर्वोच्च’ हिन्दी में स्वाभाविक है और उनके बीच सर्वोपरि पद का अर्थ व्यक्त करता है।
theological_decisions:
- issue: ‘पहिलौठा’ का राजकीय और संभावित मसीही आशय
  choice: ‘पहिलौठा’ को पाठ में बनाए रखकर पद, उत्तराधिकार और प्रतिष्ठा का आशय पाद-टिप्पणी में स्पष्ट किया गया।
  alternative: ‘सबसे प्रतिष्ठित’ या ‘प्रधान उत्तराधिकारी’ जैसा अर्थानुवाद।
  rationale: भजन के प्रसंग में यह दाऊदी राजा के उच्च पद को सूचित करता है और व्यापक धर्मग्रंथीय पठन में मसीही अर्थ रख सकता है। अनुवाद उस अर्थ को न तो मिटाता है, न उससे अधिक स्पष्ट सिद्धान्त पाठ में जोड़ता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य शैली। ‘पहिलौठा’ पारंपरिक बाइबलीय शब्द है, पर उसका प्रसंगगत अर्थ पाद-टिप्पणी में स्पष्ट किया गया है।
