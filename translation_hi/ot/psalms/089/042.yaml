id: PSA.89.42
reference: Psalms 89:42
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: הֲ֭רִימוֹתָ יְמִ֣ין צָרָ֑י/ו הִ֝שְׂמַ֗חְתָּ כָּל אוֹיְבָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/042.yaml
  text: You have exalted the right hand of his foes[a]; you have made all his enemies rejoice.
translation:
  language: hi
  text: तूने उसके विरोधियों का दाहिना हाथ ऊँचा किया है[a]; तूने उसके सब शत्रुओं को आनन्दित किया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तूने उसके बैरियों का दाहिना हाथ उठा दिया है।”
    reason: הֲרִימוֹתָ और צָרָיו के निकट शाब्दिक तथा शब्दगत वैकल्पिक अनुवाद को दर्शाने के लिए।
lexical_decisions:
- source_word: הֲרִימוֹתָ
  choice: ऊँचा किया है
  rationale: रום के हिफ़ील पूर्ण 2ms का अर्थ किसी को ऊपर उठाना या ऊँचा करना है। ‘दाहिना हाथ’ के साथ यह विरोधियों को सामर्थ्य या बढ़त देने का संकेत देता है और इब्रानी बिंब को बनाए रखता है।
- source_word: יְמִין
  choice: दाहिना हाथ
  rationale: यह संज्ञा सामान्यतः दाहिने हाथ को दर्शाती है और प्रायः शक्ति का प्रतीक होती है। शाब्दिक बिंब बनाए रखने से उसका सांकेतिक अर्थ भी सुरक्षित रहता है।
- source_word: צָרָיו
  choice: उसके विरोधियों
  rationale: צָרָיו शत्रुतापूर्ण प्रतिपक्षियों को दर्शाता है। ‘विरोधियों’ से अगले खंड के אוֹיְבָיו के लिए प्रयुक्त ‘शत्रुओं’ से निकटार्थी भेद बना रहता है।
- source_word: הִשְׂמַחְתָּ
  choice: आनन्दित किया है
  rationale: 'שׂמח का हिफ़ील रूप कारणवाचक है: संबोधित व्यक्ति ने शत्रुओं को आनन्दित होने का कारण दिया। यह हिंदी प्रयोग उस कारणवाचक अर्थ को स्वाभाविक ढंग से व्यक्त करता है।'
- source_word: כָּל
  choice: सब
  rationale: बहुवचन संज्ञा के साथ כָּל का व्यापक अर्थ आधुनिक हिंदी में ‘सब’ से सहज रूप में व्यक्त होता है।
- source_word: אוֹיְבָיו
  choice: उसके ... शत्रुओं
  rationale: אוֹיֵב के लिए ‘शत्रु’ सीधा और प्रचलित हिंदी समतुल्य है; यह पहले खंड के निकटार्थी צָרָיו से शब्दगत भेद भी बनाए रखता है।
theological_decisions:
- issue: तीसरे पुरुष एकवचन पुल्लिंग प्रत्ययों का संदर्भ
  choice: ‘उसके’ के रूप में रखा गया, जिसका तात्कालिक संदर्भ भजन में दाऊदी राजा/अभिषिक्त जन है।
  alternative: अनुवाद में संदर्भ को और सामान्य या अस्पष्ट रूप में रखना।
  rationale: दोनों खंडों के प्रत्यय तीसरे पुरुष एकवचन पुल्लिंग हैं। भजन 89 के निकट संदर्भ में विलाप दाऊद के अभिषिक्त राजा से संबंधित है। ‘उसके’ व्याकरणिक संदर्भ को सुरक्षित रखता है, बिना आगे की धर्मवैज्ञानिक पहचान आरोपित किए।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण किंतु सुबोध शैली रखी गई है। परमेश्वर को संबोधन में एकवचन ‘तूने’ मूल के 2ms रूप को स्पष्ट करता है। ‘दाहिना हाथ’ का इब्रानी शक्ति-बिंब जानबूझकर सुरक्षित रखा गया है।
