  text: For our shield belongs to Yahweh[a], and our king to the Holy One of Israel.
translation:
  language: hi
  text: क्योंकि हमारी ढाल यहोवा की है[a], और हमारा राजा इस्राएल के पवित्र का है।
  philosophy: optimal-equivalence
  footnotes:
