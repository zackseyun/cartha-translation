lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन के आधार या कारण को प्रस्तुत करता है; ‘क्योंकि’ इसके संयोजक बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: לַיהוָה
  choice: यहोवा की है
  rationale: यहाँ ל संबंध या अधिकार व्यक्त करता है। ‘यहोवा की है’ संक्षिप्त हिब्रू वाक्य को स्वाभाविक हिन्दी में रखते हुए उसके काव्यात्मक समानांतर को बचाता है।
- source_word: מָגִנֵּנוּ
  choice: हमारी ढाल
  rationale: ‘ढाल’ के प्रत्यक्ष रूपक को बनाए रखा गया है; यह भजन-साहित्य में स्पष्ट और परिचित सुरक्षा-चित्र है तथा ‘रक्षक’ जैसे व्याख्यात्मक अमूर्तीकरण से बचता है।
- source_word: וְלִקְדוֹשׁ יִשְׂרָאֵל
  choice: और ... इस्राएल के पवित्र परमेश्वर का है
  rationale: दूसरा ל पहले के समान संबंध या अधिकार व्यक्त करता है। हिन्दी शब्दक्रम में समानांतर अर्थ स्पष्ट किया गया है।
- source_word: קְדוֹשׁ יִשְׂרָאֵל
  choice: इस्राएल का पवित्र परमेश्वर
  rationale: यह इब्रानी बाइबल में परमेश्वर की स्थापित उपाधि है। ‘परमेश्वर’ जोड़ने से आधुनिक हिन्दी में उपाधि स्वाभाविक और स्पष्ट रहती है।
- source_word: מַלְכֵּנוּ
  choice: हमारा राजा
  rationale: मूल संज्ञा का सीधा अर्थ ‘राजा’ है; इससे राजकीय बिंब और मानवीय राजा की संभावित ओर-संकेतता दोनों सुरक्षित रहते हैं।
theological_decisions:
- issue: ‘हमारी ढाल’ और ‘हमारा राजा’ का संदर्भ
  choice: 'अनुवाद दोनों पदों को समानांतर अधिकार-संबंध में रखता है: हमारी ढाल यहोवा की है और हमारा राजा इस्राएल के पवित्र परमेश्वर का है।'
  alternative: ‘हमारी ढाल’ सीधे परमेश्वर को और ‘हमारा राजा’ मानवीय राजा को सूचित करता है।
  rationale: दोनों अर्धपंक्तियों में समान ל-युक्त रचना है। राजकीय भजन में ‘ढाल’ राजा अथवा रक्षक का रूपक हो सकती है; इसलिए मुख्य पाठ इब्रानी की संक्षिप्तता और अर्थगत तनाव को बनाए रखता है, जबकि पादटिप्पणी वैकल्पिक समझ बताती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और काव्यात्मक रूप अपनाया गया है। ‘ढाल’ और ‘राजा’ के मूल बिंब रखे गए हैं; इब्रानी की वास्तविक अस्पष्टता पादटिप्पणी में सुरक्षित है।
