    text: या, “क्योंकि हमारी ढाल यहोवा की है, और हमारा राजा इस्राएल के पवित्र का है।” इब्रानी वाक्य संक्षिप्त है और दोनों अर्धपंक्तियाँ समानांतर हैं; ‘यहोवा की है’ और ‘इस्राएल के पवित्र का है’ में अधिकार या संबंध का भाव है।
