id: PSA.89.13
reference: Psalms 89:13
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: לְ/ךָ֣ זְ֭רוֹעַ עִם גְּבוּרָ֑ה תָּעֹ֥ז יָ֝דְ/ךָ֗ תָּר֥וּם יְמִינֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/013.yaml
  text: Yours is an arm with might[a]; your hand is strong; your right hand is exalted.
translation:
  language: hi
  text: तेरी भुजा सामर्थ्य से भरी है[a]; तेरा हाथ बलवान है; तेरा दाहिना हाथ ऊँचा उठा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तेरी भुजा में पराक्रम है।”
    reason: עִם גְּבוּרָה का अधिक निकट संरचनात्मक विकल्प, जिसमें भुजा को पराक्रम से युक्त बताया गया है।
lexical_decisions:
- source_word: לְךָ
  choice: तेरी ... है
  rationale: वाक्य के आरम्भ में आए संबंधसूचक रूप का स्वाभाविक हिन्दी रूप परमेश्वर के अधिकार और स्वामित्व पर बल देता है।
- source_word: זְרוֹעַ
  choice: भुजा
  rationale: मूल शारीरिक बिंब को बनाए रखता है; यहाँ भुजा सामर्थ्य का काव्यात्मक प्रतीक है।
- source_word: עִם גְּבוּרָה
  choice: सामर्थ्य से भरी
  rationale: עִם के साथ גְּבוּרָה भुजा को सामर्थ्य से युक्त बताता है। यह हिन्दी में सहज है और इब्रानी संरचना का आशय सुरक्षित रखता है।
- source_word: תָּעֹז
  choice: बलवान है
  rationale: क्रिया हाथ की दृढ़ शक्ति व्यक्त करती है; हिन्दी में विधेयात्मक रूप स्वाभाविक और स्पष्ट है।
- source_word: יָדְךָ
  choice: तेरा हाथ
  rationale: मूल का मानवाकार काव्य-बिंब ज्यों का त्यों रखा गया है।
- source_word: תָּרוּם
  choice: ऊँचा उठा है
  rationale: רום ऊँचा होने, उठने या प्रतिष्ठित होने का भाव दे सकता है। यहाँ यह रूप मूल की स्थानगत और महिमासूचक दोनों संभावनाओं को अपेक्षाकृत खुला रखता है।
- source_word: יְמִינֶךָ
  choice: तेरा दाहिना हाथ
  rationale: शाब्दिक बिंब और समानांतर काव्य-रचना को सुरक्षित रखता है; दाहिना हाथ शक्ति और विजय से जुड़ा है।
theological_decisions:
- issue: परमेश्वर की शक्ति के लिए मानवाकार भाषा
  choice: भुजा, हाथ और दाहिना हाथ—तीनों शारीरिक बिंब बनाए रखे गए हैं।
  alternative: इन बिंबों को केवल ‘शक्ति’ या ‘सामर्थ्य’ जैसे अमूर्त शब्दों में बदल देना।
  rationale: पद परमेश्वर के सामर्थ्य को काव्यात्मक मानवाकार भाषा में व्यक्त करता है। बिंबों को बनाए रखने से मूल कविता की शक्ति बनी रहती है और अनावश्यक धर्मवैज्ञानिक व्याख्या नहीं जोड़ी जाती।
- issue: תָּרוּם का भाव
  choice: ऊँचा उठा है
  alternative: महिमामय है / ऊँचा किया गया है
  rationale: इब्रानी क्रिया ऊँचा होने अथवा उठने का अर्थ दे सकती है। चुना गया रूप महिमा और विजयी शक्ति का संकेत देता है, पर अस्पष्टता को पूरी तरह समाप्त नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और काव्यात्मक रूप। परमेश्वर को संबोधन में ‘तेरा/तेरी’ भजन-साहित्य की सीधी आत्मीयता और एकवचन इब्रानी प्रत्ययों के अनुरूप है।
