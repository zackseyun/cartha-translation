  text: זְכָר אֲנִ֥י מֶה חָ֑לֶד עַל מַה שָּׁ֝֗וְא בָּרָ֥אתָ כָל בְּנֵי אָדָֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/047.yaml
  text: Remember how short my lifetime is! For what vanity have you created all the sons of man?[a][b]
translation:
  language: hi
  text: याद कर कि मेरा जीवन कितना छोटा है![a] तूने सभी मनुष्यों को किस व्यर्थता के लिए रचा है?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “याद कर कि मेरी जीवन-अवधि क्या है!” हिब्रू अभिव्यक्ति संक्षिप्त है; संदर्भ उसकी क्षणभंगुरता की ओर संकेत करता है।
    reason: source_ambiguity
  - marker: b
    text: या, “तूने सभी मनुष्यों को व्यर्थ ही क्यों रचा है?” “सभी मनुष्यों” का शाब्दिक हिब्रू रूप “मनुष्य के सब पुत्र” या “आदम की सारी संतान” है।
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: זְכָר
  choice: याद कर
  rationale: यह परमेश्वर को संबोधित पुल्लिंग एकवचन आज्ञार्थक निवेदन है; सरल आज्ञार्थक रूप प्रार्थना की सीधी पुकार बनाए रखता है।
- source_word: אֲנִי מֶה חָלֶד
  choice: मेरा जीवन कितना छोटा है
  rationale: शाब्दिक संरचना कठिन है—‘मैं, जीवन-अवधि क्या?’ חֶלֶד जीवन की अवधि को दर्शाता है, और संदर्भ में מֶה उसकी क्षणभंगुरता पर विस्मयपूर्ण विलाप व्यक्त करता है। आधुनिक हिन्दी में यह अर्थ स्वाभाविक रूप से खुलता है।
- source_word: עַל מַה
  choice: किस ... के लिए
  rationale: यह उद्देश्य या परिणाम पर उठाया गया आलंकारिक प्रश्न है; केवल ‘क्यों’ की अपेक्षा स्रोत की प्रयोजन-संबंधी छाया बनाए रखी गई है।
- source_word: שָּׁוְא
  choice: व्यर्थता
  rationale: शब्द रिक्तता, निष्फलता या व्यर्थता का भाव रखता है। ‘व्यर्थता’ काव्यात्मक विलाप और अस्तित्वगत तनाव दोनों को बनाए रखता है।
- source_word: בָּרָאתָ
  choice: तूने ... रचा है
  rationale: क्रिया परमेश्वर को संबोधित पुल्लिंग एकवचन है। ‘रचा है’ सृष्टि के कार्य और उसके वर्तमान परिणाम के बीच संबंध व्यक्त करता है।
- source_word: כָל בְּנֵי אָדָם
  choice: सभी मनुष्यों
  rationale: हिब्रू मुहावरा शाब्दिक रूप से ‘मनुष्य/आदम के सब पुत्र’ है, पर यहाँ समस्त मानवजाति का सामान्य संदर्भ है। ‘सभी मनुष्यों’ आधुनिक हिन्दी में स्वाभाविक और अर्थ-सटीक है; शाब्दिक रूप पाद-टिप्पणी में दिया गया है।
theological_decisions:
- issue: בְּנֵי אָדָם में समस्त मानवजाति का संदर्भ
  choice: सभी मनुष्यों
  alternative: आदम की सारी संतान / मनुष्य के सब पुत्र
  rationale: वाक्यांश व्याकरणतः पुल्लिंग हिब्रू मुहावरा है, किंतु उसका संदर्भ स्त्री-पुरुष सहित पूरी मानवजाति है। मुख्य पाठ में स्वाभाविक हिन्दी रखी गई है और स्रोत का रूप पाद-टिप्पणी में सुरक्षित है।
- issue: सृष्टि की ‘व्यर्थता’ पर आलंकारिक प्रश्न
  choice: तूने सभी मनुष्यों को किस व्यर्थता के लिए रचा है?
  alternative: तूने सभी मनुष्यों को व्यर्थ ही क्यों रचा है?
  rationale: मुख्य पाठ עַל מַה की प्रयोजन-संबंधी संरचना और शׁוא की संज्ञात्मक शक्ति को बनाए रखता है। इसे सृष्टि के विषय में अंतिम सिद्धांतात्मक घोषणा नहीं, बल्कि क्षणभंगुर जीवन से उपजा प्रार्थनापूर्ण विलाप रहने दिया गया है।
translation_notes:
  register: भाषा आधुनिक, प्रार्थनापूर्ण और काव्यात्मक रखी गई है। परमेश्वर के लिए ‘तू’ भजन की निकट और सीधी संबोधन-शैली को दर्शाता है, अनादर को नहीं। ‘जीवन कितना छोटा है’ सामान्य पाठक के लिए स्पष्ट है, जबकि पाद-टिप्पणी मूल की संक्षिप्त अस्पष्टता सुरक्षित रखती है।
