id: PSA.89.45
reference: Psalms 89:45
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: הִ֭קְצַרְתָּ יְמֵ֣י עֲלוּמָ֑י/ו הֶֽעֱטִ֨יתָ עָלָ֖י/ו בּוּשָׁ֣ה סֶֽלָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/045.yaml
  text: You have shortened the days of his youth; you have covered him with shame[a]. Selah
translation:
  language: hi
  text: 'तूने उसकी जवानी के दिन घटा दिए हैं;

    तूने उसे लज्जा से ढक दिया है[a]। सेला'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तूने उसे लज्जा का वस्त्र पहना दिया है।”
    reason: עטה में ढकने के साथ वस्त्र पहनाने का रूपक भी संभव है।
lexical_decisions:
- source_word: הִקְצַרְתָּ
  choice: तूने ... घटा दिए हैं
  rationale: हिफ़ील रूप का अर्थ किसी अवधि को छोटा करना है। ‘घटा दिए हैं’ वर्तमान परिणाम सहित पूर्ण क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יְמֵי
  choice: दिन
  rationale: रचना-रूप बहुवचन का सीधा अर्थ ‘दिन’ है और यह जीवन की अवधि का भी संकेत देता है; मूल काव्यात्मक अभिव्यक्ति सुरक्षित रहती है।
- source_word: עֲלוּמָיו
  choice: उसकी जवानी
  rationale: यह संज्ञा युवावस्था को दर्शाती है। ‘जवानी’ साधारण आधुनिक हिन्दी में सहज और सीधा समतुल्य है।
- source_word: הֶעֱטִיתָ
  choice: ढक दिया है
  rationale: עטה के हिफ़ील रूप में ढकने, लपेटने या वस्त्र पहनाने का भाव हो सकता है। लज्जा के साथ ‘ढक दिया’ स्पष्ट और स्वाभाविक है, जबकि वैकल्पिक वस्त्र-रूपक पादटिप्पणी में रखा गया है।
- source_word: עָלָיו
  choice: उसे
  rationale: शाब्दिक भाव ‘उस पर’ है, पर हिन्दी मुहावरे में ‘उसे लज्जा से ढक दिया’ पूर्वसर्गीय संबंध को स्वाभाविक ढंग से समाहित करता है।
- source_word: בּוּשָׁה
  choice: लज्जा
  rationale: यह शब्द लज्जा, अपमान या बेइज़्ज़ती का बोध देता है। ‘लज्जा’ गरिमापूर्ण और मूल अर्थ के निकट है।
- source_word: סֶלָה
  choice: सेला
  rationale: इस उपासना-संगीत संबंधी पद का निश्चित अर्थ अस्पष्ट है, इसलिए इसका अर्थ निर्धारित करने के बजाय देवनागरी में लिप्यंतरण किया गया है।
theological_decisions:
- issue: ‘उसकी’ और ‘उसे’ में पुल्लिंग एकवचन प्रत्ययों का संदर्भ
  choice: पुल्लिंग एकवचन सर्वनाम को बनाए रखा गया और संदर्भित व्यक्ति को नाम से स्पष्ट नहीं किया गया।
  alternative: इसे दाऊदी राजा, दाऊदी राजवंश, या व्यक्तिरूप अभिषिक्त के रूप में स्पष्ट करना।
  rationale: भजन का व्यापक संदर्भ अपमानित अभिषिक्त राजा या राजवंश की ओर संकेत करता है, पर इस पद में संदर्भित व्यक्ति का नाम नहीं है। सर्वनाम बनाए रखने से मूल की काव्यात्मक और धर्मवैचारिक अस्पष्टता सुरक्षित रहती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, संक्षिप्त और गरिमापूर्ण काव्यात्मक शैली। परमेश्वर के लिए निकट एकवचन संबोधन ‘तू’ रखा गया है, जो भजन की सीधी प्रार्थनात्मक वाणी के अनुकूल है।
