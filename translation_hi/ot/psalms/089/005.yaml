  text: וְ/י֘וֹד֤וּ שָׁמַ֣יִם פִּלְאֲ/ךָ֣ יְהוָ֑ה אַף אֱ֝מֽוּנָתְ/ךָ֗ בִּ/קְהַ֥ל קְדֹשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/005.yaml
  text: The heavens will praise your wonders[a], O Yahweh—indeed, your faithfulness in the assembly of the holy ones.
translation:
  language: hi
  text: हे याहवे, आकाश तेरे अद्भुत कामों की स्तुति करेगा—हाँ, पवित्र जनों की सभा में तेरी विश्वासयोग्यता की भी।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “पवित्र प्राणियों”; संदर्भ में संभवतः स्वर्गीय प्राणी अभिप्रेत हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: וְיֹודוּ
  choice: स्तुति करेगा
  rationale: हिफ़ील रूप यहाँ प्रशंसा या धन्यवाद व्यक्त करता है। आकाश को कर्ता और परमेश्वर के अद्भुत कामों को विषय मानते हुए ‘स्तुति करेगा’ स्वाभाविक है; एकवचन क्रिया हिंदी में ‘आकाश’ के साथ मेल खाती है।
- source_word: שָׁמַיִם
  choice: आकाश
  rationale: इब्रानी का रूप बहुवचन है, पर आधुनिक मानक हिंदी में समग्र स्वर्गीय विस्तार के लिए ‘आकाश’ अधिक स्वाभाविक और काव्यात्मक है।
- source_word: פִּלְאֲךָ
  choice: तेरे अद्भुत कामों
  rationale: פֶּלֶא आश्चर्यजनक बात या कार्य को सूचित करता है। ‘अद्भुत काम’ इस स्तुति-संदर्भ में परमेश्वर के आश्चर्यपूर्ण कार्यों का सामूहिक भाव स्पष्ट करता है।
- source_word: יְהוָה
  choice: हे यहवे
  rationale: दिव्य नाम को उपाधि से बदलने के बजाय हिंदी लिप्यंतरण ‘यहवे’ से व्यक्त किया गया है; सम्बोधन के लिए ‘हे’ जोड़ा गया है।
- source_word: אַף
  choice: हाँ ... भी
  rationale: यह संयोजन पिछले कथन को बल देते हुए आगे बढ़ाता है; ‘हाँ ... भी’ उसके emphatic और additive दोनों भावों को सहज हिंदी में रखता है।
- source_word: אֱמוּנָתְךָ
  choice: तेरी विश्वासयोग्यता
  rationale: यहाँ אֱמוּנָה परमेश्वर की विश्वसनीयता और निष्ठा को दर्शाता है; ‘विश्वासयोग्यता’ इसका सीधा और प्रचलित धार्मिक-काव्यात्मक रूप है।
- source_word: בִּקְהַל
  choice: सभा में
  rationale: קָהָל एक एकत्र समुदाय को दर्शाता है। ‘सभा में’ उस ठोस सामूहिक चित्र को संक्षेप और स्वाभाविक ढंग से बनाए रखता है।
- source_word: קְדֹשִׁים
  choice: पवित्र जनों
  rationale: यह पद पवित्र प्राणियों या व्यक्तियों के लिए प्रयुक्त हो सकता है। ‘पवित्र जन’ किसी एक पहचान को अनावश्यक रूप से निश्चित किए बिना मूल की व्यापकता बनाए रखता है।
theological_decisions:
- issue: קְדֹשִׁים का संदर्भ
  choice: मुख्य पाठ में ‘पवित्र जन’, और टिप्पणी में स्वर्गीय प्राणियों की संभावित पहचान
  alternative: ‘संत’ अथवा स्पष्ट रूप से ‘स्वर्गदूत’
  rationale: निकटवर्ती संदर्भ आकाश और स्वर्गीय सभा की ओर संकेत करता है, इसलिए स्वर्गीय प्राणी संभावित हैं; फिर भी मूल शब्द स्वयं उन्हें केवल स्वर्गदूतों के रूप में निश्चित नहीं करता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और काव्यात्मक हिंदी रखी गई है। ‘हे यहवे’ सम्बोधन को स्पष्ट करता है, जबकि ‘पवित्र जन’ मूल की संदर्भगत अस्पष्टता सुरक्षित रखता है।
