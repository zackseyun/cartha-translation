source:
  edition: WLC
  text: אַתָּ֤ה דִכִּ֣אתָ כֶ/חָלָ֣ל רָ֑הַב בִּ/זְר֥וֹעַ עֻ֝זְּ/ךָ֗ פִּזַּ֥רְתָּ אוֹיְבֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/010.yaml
  text: You crushed Rahab like one slain[a]; with your mighty arm you scattered your enemies.
translation:
  language: hi
  text: तूने रहब को ऐसे कुचल दिया, जैसे कोई मारा गया हो[a]; अपनी शक्तिशाली भुजा से तूने अपने शत्रुओं को तितर-बितर कर दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “रहब” एक काव्यात्मक नाम है, जो मिस्र या परमेश्वर द्वारा पराजित अराजकता के दैत्य अथवा अराजक शक्ति की ओर संकेत कर सकता है।
    reason: वैकल्पिक अर्थों और मूल की काव्यात्मक अस्पष्टता को सुरक्षित रखना।
lexical_decisions:
- source_word: דִכִּאתָ
  choice: कुचल दिया
  rationale: क्रिया बलपूर्वक तोड़ने या कुचलने का भाव देती है; यह युद्ध-संबंधी काव्यात्मक चित्र को स्वाभाविक और स्पष्ट रूप से व्यक्त करती है।
- source_word: כֶחָלָל
  choice: जैसे कोई युद्ध में मारा गया हो
  rationale: כְּ तुलना सूचित करता है और חָלָל प्रायः युद्ध में बेधा या मारा गया व्यक्ति है। 'युद्ध में' संदर्भगत अर्थ को स्पष्ट करता है, जबकि उपमा बनी रहती है।
- source_word: רָהַב
  choice: रहब
  rationale: इसे काव्यात्मक नाम के रूप में लिप्यंतरित करने से मिस्र और अराजकता की दैत्याकार शक्ति—दोनों संभावित संकेत सुरक्षित रहते हैं।
- source_word: בִּזְרוֹעַ עֻזְּךָ
  choice: अपनी शक्तिशाली भुजा से
  rationale: यह साधनवाचक पदबंध है; यह चयन परमेश्वर की सामर्थ्य के मानवीय-अंग वाले काव्यात्मक बिंब को सहज हिन्दी में बनाए रखता है।
- source_word: פִּזַּרְתָּ
  choice: तितर-बितर कर दिया
  rationale: यह क्रिया बिखेरने या छिन्न-भिन्न करने का अर्थ देती है। हिन्दी में यह शत्रुओं के बिखर जाने का सजीव और स्वाभाविक वर्णन है।
- source_word: אוֹיְבֶיךָ
  choice: अपने शत्रुओं को
  rationale: यह स्वाभाविक हिन्दी में दूसरे पुरुष एकवचन संबंध और बहुवचन संज्ञा को सीधे व्यक्त करता है।
theological_decisions:
- issue: काव्यात्मक संदर्भ में רָהַב की पहचान
  choice: मुख्य पाठ में काव्यात्मक नाम 'रहब' बनाए रखा गया है।
  alternative: इसे 'मिस्र' या 'अराजकता का दैत्य/अराजक शक्ति' कहा जा सकता है।
  rationale: यह नाम काव्य में मिस्र का संकेत भी हो सकता है और परमेश्वर द्वारा पराजित आदिम अराजक शक्ति का बिंब भी जगा सकता है। किसी एक अर्थ को मुख्य पाठ में निश्चित कर देना मूल की अर्थगत बहुलता को समाप्त कर देता।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठकों के लिए सहज। परमेश्वर के लिए निकट संबोधन 'तू' भजन की प्रत्यक्ष प्रार्थनात्मक शैली के अनुरूप रखा गया है।
