  yaml_path: translation/ot/psalms/089/022.yaml
  text: No enemy will exact tribute from him[b][a], and no son of wickedness will afflict him.
translation:
  language: hi
  text: कोई शत्रु उससे जबरन वसूली नहीं करेगा[a], और कोई दुष्ट व्यक्ति[b] उसे पीड़ित नहीं करेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “कोई शत्रु उसे धोखा नहीं देगा” अथवा “उस पर कुछ थोपेगा।” हिब्रू क्रिया के कई निकट-संबंधी अर्थ हो सकते हैं; यहाँ शत्रुतापूर्ण उत्पीड़न के संदर्भ में इसका अनुवाद “जबरन वसूली करना” के अर्थ में किया गया है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “दुष्टता का पुत्र”; यह किसी दुष्ट व्यक्ति या कुकर्मी के लिए हिब्रू मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יַשִּׁא
  choice: जबरन वसूली करेगा
  rationale: इस प्रसंग में हिफ़ील क्रिया शत्रुतापूर्ण आर्थिक या राजनीतिक शोषण—किसी पर देनदारी या कर लादकर वसूलने—का भाव देती है। समानांतर पंक्ति में ‘पीड़ित करेगा’ और राजकीय सुरक्षा का संदर्भ इस अर्थ का समर्थन करते हैं; फिर भी क्रिया की अन्य संभावित अर्थछायाएँ पादटिप्पणी में रखी गई हैं।
- source_word: אוֹיֵב
  choice: शत्रु
  rationale: एकवचन संज्ञा का सीधा, स्वाभाविक और काव्य-संदर्भ के अनुकूल हिन्दी रूप।
- source_word: בּוֹ
  choice: उससे
  rationale: ‘वसूली करना’ के साथ हिन्दी में स्रोत या पीड़ित पक्ष बताने के लिए ‘उससे’ स्वाभाविक है।
- source_word: בֶן עַוְלָה
  choice: दुष्ट जन
  rationale: हिब्रू का शाब्दिक मुहावरा ‘दुष्टता का पुत्र’ है, जिसका अर्थ दुष्ट व्यक्ति है। मुख्य पाठ में सहज आधुनिक हिन्दी रखी गई है और मूल मुहावरा पादटिप्पणी में बताया गया है।
- source_word: עַוְלָה
  choice: दुष्ट
  rationale: यहाँ शब्द अन्याय, कुकर्म या नैतिक बुराई का भाव रखता है; ‘दुष्ट’ व्यक्ति-वाचक मुहावरे में इस व्यापक भाव को संक्षेप में व्यक्त करता है।
- source_word: יְעַנֶּנּוּ
  choice: उसे पीड़ित नहीं करेगा
  rationale: पिएल रूप यहाँ सताने, दबाने या दुःख पहुँचाने का अर्थ देता है। ‘पीड़ित करना’ व्यापक, गरिमापूर्ण और समानांतर पंक्ति के अनुकूल है।
theological_decisions:
- issue: सुरक्षित किए जा रहे व्यक्ति की पहचान
  choice: एकवचन सर्वनाम ‘उससे/उसे’ को बिना व्याख्यात्मक विस्तार के बनाए रखना
  alternative: दाऊद, दाऊदी राजा अथवा प्रतिरूपात्मक रूप से मसीह के रूप में स्पष्ट पहचान देना
  rationale: हिब्रू पाठ वाचा के राजकीय संदर्भ में एक पुरुषवाचक एकवचन व्यक्ति की बात करता है, पर इस पद में उसकी पहचान को और संकीर्ण नहीं करता। अतः अनुवाद मूल की धार्मिक-वैचारिक खुलावट को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल किंतु गरिमापूर्ण काव्यात्मक गद्य रखा गया है। ‘जबरन वसूली’ मूल क्रिया के प्रसंगगत शोषण-भाव को स्पष्ट करती है, जबकि ‘दुष्ट जन’ अस्वाभाविक शाब्दिक मुहावरे से बचते हुए उसकी जानकारी पादटिप्पणी में सुरक्षित रखता है।
