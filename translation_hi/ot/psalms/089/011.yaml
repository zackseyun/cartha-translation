source:
  edition: WLC
  text: לְ/ךָ֣ שָׁ֭מַיִם אַף לְ/ךָ֥ אָ֑רֶץ תֵּבֵ֥ל וּ֝/מְלֹאָ֗/הּ אַתָּ֥ה יְסַדְתָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/011.yaml
  text: The heavens are yours; the earth also is yours[a]. The world and its fullness—you founded them.
translation:
  language: hi
  text: आकाश तेरा है; पृथ्वी भी तेरी है। संसार और जो कुछ उसमें भरा है—उनकी स्थापना तूने की है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְךָ
  choice: तेरा है / तेरी है
  rationale: לְךָ यहाँ संबंध और स्वामित्व व्यक्त करता है। हिंदी में ‘तेरा/तेरी है’ सीधे और काव्यात्मक ढंग से इसे व्यक्त करता है।
- source_word: שָׁמַיִם
  choice: आकाश
  rationale: हिब्रू बहुवचन रूप आकाशीय क्षेत्र को सूचित करता है; आधुनिक मानक हिंदी में ‘आकाश’ स्वाभाविक, गरिमापूर्ण और सामूहिक अर्थ वाला पद है।
- source_word: אַף
  choice: भी
  rationale: यह आकाश के साथ पृथ्वी को भी जोड़कर कथन का विस्तार और बल व्यक्त करता है।
- source_word: אָרֶץ
  choice: पृथ्वी
  rationale: आकाश और संसार के समानांतर यहाँ स्थानीय ‘भूमि’ नहीं, बल्कि ब्रह्मांडीय अर्थ में पृथ्वी अभिप्रेत है।
- source_word: תֵּבֵל
  choice: संसार
  rationale: תֵּבֵל व्यवस्थित या आबाद जगत को दर्शाता है; ‘संसार’ हिंदी में स्वाभाविक और पर्याप्त रूप से व्यापक है।
- source_word: מְלֹאָהּ
  choice: जो कुछ उसमें भरा है
  rationale: शाब्दिक अर्थ ‘उसकी परिपूर्णता/भराव’ है। यह चयन संसार में समाई हर वस्तु और प्राणी का भाव स्पष्ट रखते हुए मूल रूपक को भी बचाता है।
- source_word: יְסַדְתָּם
  choice: उनकी नींव तूने डाली है
  rationale: יסד स्थापना या नींव डालने की छवि रखता है। बहुवचन प्रत्यय को ‘उनकी’ से बनाए रखा गया है और हिंदी में सृष्टि की स्थापत्य-छवि स्वाभाविक रूप से व्यक्त हुई है।
theological_decisions:
- issue: परमेश्वर का स्वामित्व और सृजनकारी स्थापना
  choice: आकाश और पृथ्वी पर परमेश्वर के स्वामित्व तथा संसार और उसमें भरी सब वस्तुओं की नींव डालने—दोनों बातों को स्पष्ट रखा गया है।
  alternative: इसे स्पष्ट रूप से शून्य से सृष्टि की शिक्षा कहना, अथवा केवल राजकीय प्रभुता तक सीमित करना।
  rationale: हिब्रू पाठ स्वामित्व (לְךָ) और आधारभूत स्थापना (יסד)—दोनों की पुष्टि करता है, पर इससे आगे कोई व्यवस्थित धर्मवैज्ञानिक सूत्र नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण काव्यात्मक शैली। एकवचन आत्मीय संबोधन ‘तू/तेरा’ भजन की सीधी ईश-संबोधन शैली को सुरक्षित रखता है। मूल पाठ में इस पद पर कोई पाठगत या अर्थगत अस्पष्टता ऐसी नहीं है जिसके लिए अनिवार्य पाद-टिप्पणी चाहिए।
