  text: לְ֭/עוֹלָ֗ם אשמור ל֣/וֹ חַסְדִּ֑/י וּ֝/בְרִיתִ֗/י נֶאֱמֶ֥נֶת לֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/028.yaml
  text: Forever I will keep my steadfast love for him[a], and my covenant will remain faithful to him.
translation:
  language: hi
  text: मैं सदा उसके लिए अपना अटल प्रेम बनाए रखूँगा, और मेरी वाचा उसके लिए अटल रहेगी।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरी वाचा उसके प्रति विश्वसनीय रहेगी”; अथवा, “मेरी वाचा उसके लिए दृढ़ ठहरेगी।”
    reason: נֶאֱמֶנֶת दृढ़ता, सुनिश्चितता और विश्वसनीयता—इन परस्पर संबद्ध भावों को व्यक्त कर सकता है।
lexical_decisions:
- source_word: לְעוֹלָם
  choice: सदा
  rationale: यह दीर्घ और निरंतर अवधि व्यक्त करता है; ‘सदा’ आधुनिक हिन्दी में स्वाभाविक और गरिमापूर्ण है।
- source_word: אֶשְׁמֹר
  choice: बनाए रखूँगा
  rationale: שׁמר यहाँ परमेश्वर की करुणा को लगातार कायम रखने का भाव देता है; ‘बनाए रखूँगा’ इस सक्रिय संरक्षण को सहज हिन्दी में व्यक्त करता है।
- source_word: חַסְדִּי
  choice: अपनी अटल करुणा
  rationale: חסד में प्रेमपूर्ण करुणा और निष्ठावान प्रतिबद्धता दोनों निहित हैं; ‘अटल करुणा’ किसी एक संप्रदायगत व्याख्या को थोपे बिना इन भावों को समेटती है।
- source_word: לוֹ
  choice: उसके लिए
  rationale: ל संबंध या हित का भाव रखता है; ‘उसके लिए’ दोनों उपवाक्यों में मूल की संरचना और अर्थ को सुरक्षित रखता है।
- source_word: וּבְרִיתִי
  choice: और मेरी वाचा
  rationale: בְּרִית के लिए ‘वाचा’ हिन्दी बाइबलीय प्रयोग में सटीक, प्रचलित और प्रसंगानुकूल शब्द है।
- source_word: נֶאֱמֶנֶת
  choice: अटल रहेगी
  rationale: אמן का निफ़अल कृदंत दृढ़ता, विश्वसनीयता और स्थायित्व व्यक्त करता है; ‘अटल रहेगी’ वाचा की स्थिर विश्वसनीयता को स्वाभाविक हिन्दी में दर्शाता है।
theological_decisions:
- issue: दाऊदी वाचा के कथन में मसीही पूर्ति को स्पष्ट रूप से जोड़ना या न जोड़ना
  choice: ‘उसके’ कहकर तत्कालीन दाऊदी संदर्भ को बनाए रखा गया है।
  alternative: मुख्य पाठ में इसे स्पष्ट रूप से मसीह से संबंधित कर देना।
  rationale: इब्रानी पाठ केवल ‘उसके लिए’ कहता है। व्यापक धर्मवैज्ञानिक पूर्ति को अनुवाद में जोड़ने के बजाय मूल कथन की संदर्भगत और कैनोनिकल खुलावट सुरक्षित रखी गई है।
- issue: נֶאֱמֶנֶת में निष्ठा और दृढ़ता के बीच अर्थ-संतुलन
  choice: मुख्य पाठ में ‘अटल रहेगी’ रखा गया है।
  alternative: ‘विश्वसनीय रहेगी’ या ‘दृढ़ ठहरेगी’।
  rationale: शब्द वाचा की विश्वसनीयता और सुनिश्चित स्थिरता दोनों व्यक्त कर सकता है। मुख्य पाठ में सहज हिन्दी चुनी गई है और अन्य वास्तविक अर्थ-पक्ष पाद-टिप्पणी में सुरक्षित हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य शैली। ‘अटल करुणा’ और ‘वाचा’ द्वारा मूल के वाचागत शब्द-संसार को बनाए रखते हुए वाक्य को सामान्य पाठक के लिए सहज रखा गया है।
