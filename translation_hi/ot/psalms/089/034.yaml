  text: לֹא אֲחַלֵּ֥ל בְּרִיתִ֑/י וּ/מוֹצָ֥א שְׂ֝פָתַ֗/י לֹ֣א אֲשַׁנֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/034.yaml
  text: I will not violate my covenant[b][a], or alter what has gone out from my lips.
translation:
  language: hi
  text: मैं अपनी वाचा का उल्लंघन नहीं करूँगा[a], और जो मेरे होंठों से निकल चुका है, उसे नहीं बदलूँगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अपनी वाचा को अपवित्र नहीं करूँगा’ अथवा ‘अपनी वाचा नहीं तोड़ूँगा’।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘मेरे होंठों से निकली हुई बात’; अर्थात जो मैंने कहा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲחַלֵּל
  choice: उल्लंघन नहीं करूँगा
  rationale: पिएल रूप यहाँ वाचा को अपवित्र करने अथवा तोड़ने का भाव देता है। ‘उल्लंघन’ आधुनिक हिन्दी में वाचा के प्रति गंभीर बेवफ़ाई को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: בְּרִיתִי
  choice: अपनी वाचा
  rationale: בְּרִית के लिए ‘वाचा’ बाइबलीय और धर्मवैज्ञानिक संदर्भ में स्थापित शब्द है; प्रथम पुरुष प्रत्यय को ‘अपनी’ से बनाए रखा गया है।
- source_word: מוֹצָא שְׂפָתַי
  choice: जो मेरे होंठों से निकल चुका है
  rationale: यह मूल इब्रानी के ‘मेरे होंठों से निकलना’ रूपक को बनाए रखते हुए कही हुई बात का स्वाभाविक हिन्दी संकेत देता है।
- source_word: אֲשַׁנֶּה
  choice: बदलूँगा
  rationale: पिएल में अर्थ ‘बदलना’ है; हिन्दी में यह बोले गए वचन में परिवर्तन करने के संदर्भ में स्पष्ट और सहज है।
- source_word: לֹא ... לֹא
  choice: नहीं करूँगा ... नहीं बदलूँगा
  rationale: दोनों निषेधों को अलग-अलग बनाए रखने से इब्रानी समानांतरता और बल सुरक्षित रहते हैं।
theological_decisions:
- issue: ईश्वरीय प्रतिबद्धता की भाषा
  choice: वाचा और होंठों से निकले वचन की ठोस भाषा को बनाए रखा गया है।
  alternative: इसे सामान्यीकृत करके ‘मैं अपना वादा नहीं तोड़ूँगा’ कहना।
  rationale: पद स्वयं वाचा और बोले हुए वचन की बात करता है; व्यापक ईश्वरीय अपरिवर्तनशीलता का सिद्धांत जोड़ना मूल कथन से आगे जाना होगा।
- issue: אֲחַלֵּל की अर्थ-सीमा
  choice: मुख्य पाठ में ‘उल्लंघन’
  alternative: ‘अपवित्र’ या ‘तोड़ना’
  rationale: ‘उल्लंघन’ वाचागत भंग को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि पादटिप्पणी मूल शब्द की अपवित्रीकरण और तोड़ने वाली अर्थ-छायाओं को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज रूप। ‘वाचा’ को बाइबलीय मुख्य शब्द के रूप में रखा गया है और इब्रानी के होंठों से निकलने वाले वचन के चित्र को स्वाभाविक हिन्दी में संरक्षित किया गया है।
