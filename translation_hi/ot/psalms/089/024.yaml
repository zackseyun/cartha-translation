  text: וֶֽ/אֶֽמוּנָתִ֣/י וְ/חַסְדִּ֣/י עִמּ֑/וֹ וּ֝/בִ/שְׁמִ֗/י תָּר֥וּם קַרְנֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/024.yaml
  text: And my faithfulness and my steadfast love will be with him[a], and in my name his horn will be exalted.
translation:
  language: hi
  text: मेरी विश्वासयोग्यता और मेरा अटल प्रेम उसके साथ रहेगा, और मेरे नाम से उसका सींग[a] ऊँचा उठेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘सींग’ इब्रानी काव्य में सामर्थ्य, प्रतिष्ठा या राजकीय शक्ति का प्रतीक है।
    reason: cultural_note
lexical_decisions:
- source_word: אֱמוּנָתִי
  choice: मेरी विश्वासयोग्यता
  rationale: यहाँ אֱמוּנָה परमेश्वर की भरोसेमंदी और निष्ठा को व्यक्त करता है, न कि विश्वास करने की क्रिया को।
- source_word: חַסְדִּי
  choice: मेरा अटल प्रेम
  rationale: חֶסֶד वाचा के संदर्भ में निष्ठावान और स्थिर प्रेम का भाव रखता है; ‘अटल प्रेम’ इसे सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: עִמּוֹ
  choice: उसके साथ
  rationale: עִם का सीधा अर्थ ‘साथ’ है और यहाँ उपस्थिति तथा समर्थन दोनों का संकेत देता है।
- source_word: בִּשְׁמִי
  choice: मेरे नाम से
  rationale: בְּ साधन या आधार का भाव दे सकता है; यहाँ राजा की सामर्थ्य और प्रतिष्ठा परमेश्वर के नाम से प्राप्त होती है। ‘मेरे नाम से’ हिन्दी में स्वाभाविक रहते हुए इस संबंध को सुरक्षित रखता है।
- source_word: תָּרוּם
  choice: ऊँचा उठेगा
  rationale: רוּם का अर्थ ऊँचा होना या उठाया जाना है। ‘ऊँचा उठेगा’ सींग की काव्यात्मक छवि को बनाए रखता है।
- source_word: קַרְנוֹ
  choice: उसका सींग
  rationale: קֶרֶן का शाब्दिक अर्थ ‘सींग’ है और यह सामर्थ्य, प्रतिष्ठा या राजकीय शक्ति का रूपक है; मुख्य पाठ में मूल रूपक सुरक्षित रखा गया है।
theological_decisions:
- issue: राजकीय ‘सींग’ रूपक को बनाए रखना
  choice: उसका सींग ऊँचा उठेगा
  alternative: उसकी शक्ति बढ़ेगी
  rationale: मूल इब्रानी की राजकीय और वाचागत काव्य-छवि को अमूर्त व्याख्या से बदलने के बजाय सुरक्षित रखा गया है।
- issue: בִּשְׁמִי में संबंध का भाव
  choice: मेरे नाम से
  alternative: मेरे नाम में
  rationale: दोनों अर्थ संभव हैं, पर आधुनिक हिन्दी में ‘मेरे नाम से’ परमेश्वर से प्राप्त सामर्थ्य और प्रतिष्ठा को अधिक स्वाभाविक ढंग से व्यक्त करता है, बिना इसे अत्यधिक स्पष्ट किए।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमामय, काव्यात्मक और सामान्य पाठक के लिए बोधगम्य शैली। ‘विश्वासयोग्यता’ और ‘अटल प्रेम’ वाचागत समानांतरता को बनाए रखते हैं; ‘सींग’ की मूल सांस्कृतिक छवि फुटनोट सहित सुरक्षित है।
