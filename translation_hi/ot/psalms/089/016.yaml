  text: בְּ֭/שִׁמְ/ךָ יְגִיל֣וּ/ן כָּל הַ/יּ֑וֹם וּ/בְ/צִדְקָתְ/ךָ֥ יָרֽוּמוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/016.yaml
  text: In your name they rejoice all day long[a], and in your righteousness they are exalted.
translation:
  language: hi
  text: 'वे दिन भर आपके नाम में आनन्द मनाते हैं,

    और आपकी धार्मिकता के बल पर ऊँचे उठते हैं।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “आपके न्याय में वे ऊँचे उठते हैं।”
    reason: צדקה का अर्थ ‘न्याय’ भी हो सकता है; ב का अर्थ ‘में’ या आधार के अर्थ में लिया जा सकता है।
lexical_decisions:
- source_word: בְּשִׁמְךָ
  choice: आपके नाम में
  rationale: यहाँ ב को ‘में’ कहना आनन्द के आधार या क्षेत्र को व्यक्त करता है। ‘नाम’ परमेश्वर के प्रकट चरित्र और प्रतिष्ठा को भी सूचित करता है।
- source_word: יְגִילוּן
  choice: आनन्द मनाते हैं
  rationale: गिल धातु उल्लासपूर्ण आनन्द को व्यक्त करती है; यह वाक्यांश आधुनिक हिन्दी में स्वाभाविक और उत्सवपूर्ण है।
- source_word: כָּל הַיּוֹם
  choice: दिन भर
  rationale: यह पूरे दिन जारी रहने वाली अवधि का स्वाभाविक हिन्दी रूप है।
- source_word: וּבְצִדְקָתְךָ
  choice: और आपकी धार्मिकता के कारण
  rationale: צדקה धार्मिकता और न्याय, दोनों का अर्थ दे सकता है। यहाँ ‘धार्मिकता’ व्यापक अर्थ बनाए रखती है, और ב को कारणसूचक रूप में प्रस्तुत करना अगले क्रियापद से सम्बन्ध स्पष्ट करता है।
- source_word: יָרוּמוּ
  choice: ऊँचे उठाए जाते हैं
  rationale: רום ऊँचा होने या उठाए जाने का भाव देता है। यह रूप इस सम्भावना को स्वाभाविक रूप से व्यक्त करता है कि परमेश्वर की धार्मिकता ही उनके ऊँचे उठाए जाने का आधार है।
theological_decisions:
- issue: स्तुति के सन्दर्भ में परमेश्वर की צדקה का अर्थ
  choice: मुख्य पाठ में ‘धार्मिकता’
  alternative: ‘न्याय’
  rationale: इब्रानी शब्द नैतिक धार्मिकता और न्यायपूर्ण कार्य—दोनों को समेट सकता है। भजन के वाचाई और स्तुतिपरक सन्दर्भ में ‘धार्मिकता’ व्यापक विकल्प है, जबकि ‘न्याय’ को पाद-टिप्पणी में सुरक्षित रखा गया है।
- issue: בְצִדְקָתְךָ में पूर्वसर्ग का सम्बन्ध
  choice: ‘आपकी धार्मिकता के कारण’
  alternative: ‘आपकी धार्मिकता में’
  rationale: इब्रानी ב साधन, आधार या क्षेत्र दर्शा सकता है। हिन्दी में कारणसूचक रूप ऊँचे उठाए जाने और परमेश्वर की धार्मिकता का सम्बन्ध स्पष्ट करता है, पर मूल की अर्थ-सीमा को पाद-टिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में आदरसूचक ‘आप’ का प्रयोग किया गया है। भाषा सरल, गरिमापूर्ण और सामूहिक स्तुति के अनुकूल रखी गई है।
