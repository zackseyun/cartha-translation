  rationale: Revision replaces the unnecessarily vivid ‘पटक दिया’ with ‘गिरा दिया,’ which naturally renders the downcasting image without adding a manner of action. It also makes the first clause slightly more direct and adjusts footnote a to preserve the source verb’s causative cessation sense.
