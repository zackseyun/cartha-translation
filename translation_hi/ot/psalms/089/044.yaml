  yaml_path: translation/ot/psalms/089/044.yaml
  text: You have brought his splendor to an end and cast his throne to the ground[a][b].
translation:
  language: hi
  text: तूने उसके वैभव को समाप्त कर दिया और उसके सिंहासन को भूमि पर गिरा दिया[a][b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तूने उसकी चमक/शुद्धता समाप्त कर दी।” इब्रानी शब्द चमक, शुद्धता या वैभव का अर्थ दे सकता है; यहाँ राजकीय संदर्भ में “वैभव” अधिक उपयुक्त है।
    reason: lexical_alternative
  - marker: b
    text: या “उसके सिंहासन को धरती पर गिरा दिया।”
    reason: lexical_alternative
lexical_decisions:
- source_word: הִשְׁבַּתָּ
  choice: तूने ... का अंत कर दिया
  rationale: שׁבת के हिफ़ील रूप का अर्थ किसी वस्तु को समाप्त कर देना या रुकवा देना है। यह अभिव्यक्ति कारक भाव को स्वाभाविक आधुनिक हिन्दी में व्यक्त करती है।
- source_word: מִטְּהָרוֹ
  choice: उसके वैभव
  rationale: טֹהַר चमक, शुद्धता या उज्ज्वल वैभव का बोध करा सकता है। राजकीय संदर्भ में ‘वैभव’ राजा की घटती हुई महिमा के भाव को सबसे स्वाभाविक ढंग से व्यक्त करता है; מן को क्रिया-विन्यास ‘का अंत’ में समाहित किया गया है।
- source_word: וְכִסְאוֹ
  choice: और उसके सिंहासन
  rationale: כִּסֵּא का सीधा अर्थ ‘सिंहासन’ है; संयोजक וְ को ‘और’ के रूप में रखा गया है।
- source_word: לָאָרֶץ
  choice: भूमि पर
  rationale: אֶרֶץ का अर्थ धरती, भूमि या देश हो सकता है। यहाँ सिंहासन को नीचे गिराने की छवि में ‘भूमि पर’ स्वाभाविक है और अपमानजनक पतन को व्यक्त करता है।
- source_word: מִגַּרְתָּה
  choice: पटक दिया
  rationale: क्रिया नीचे फेंकने या गिरा देने का प्रबल भाव रखती है। ‘पटक दिया’ काव्यात्मक छवि और सिंहासन के अपमानपूर्ण पतन दोनों को स्पष्ट रखता है।
theological_decisions:
- issue: तीसरे पुरुष एकवचन प्रत्ययों का संदर्भ
  choice: ‘उसके’ रखकर संदर्भ को अंतर्निहित छोड़ा गया है।
  alternative: इसे स्पष्ट रूप से ‘दाऊद के राजा का’ या ‘अभिषिक्त जन का’ कहा जा सकता था।
  rationale: इब्रानी में इस पद में पूर्ववर्ती व्यक्ति का नाम फिर से नहीं दिया गया। केवल ‘उसके’ रखने से काव्य-प्रवाह बना रहता है और अनुवाद ऐसी पहचान निश्चित नहीं करता जो इस पंक्ति में स्पष्ट नहीं है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण काव्यात्मक रूप। भजन में परमेश्वर के लिए प्रचलित एकवचन संबोधन ‘तू’ रखा गया है। ‘वैभव’ राजकीय संदर्भ के अनुकूल है और ‘पटक दिया’ मूल क्रिया की तीव्रता को सहज हिन्दी में बनाए रखता है।
