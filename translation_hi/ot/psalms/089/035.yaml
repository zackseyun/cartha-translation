  text: אַ֭חַת נִשְׁבַּ֣עְתִּי בְ/קָדְשִׁ֑/י אִֽם לְ/דָוִ֥ד אֲכַזֵּֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/035.yaml
  text: Once I have sworn by my holiness[b][a]; I will not lie to David.
translation:
  language: hi
  text: मैंने एक बार अपनी पवित्रता की शपथ खाई है[b]; मैं दाऊद से झूठ नहीं बोलूँगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “यदि मैं दाऊद से झूठ बोलूँ...”; यह शपथ का सूत्र है, जिसका अर्थ है, “मैं दाऊद से झूठ नहीं बोलूँगा” या “मैं दाऊद के प्रति निश्चय ही झूठा सिद्ध नहीं होऊँगा।”
    reason: lexical_alternative
  - marker: b
    text: या, “मैंने एक बार और सदा के लिए अपनी पवित्रता की शपथ खाई है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחַת
  choice: एक बार
  rationale: शपथ के प्रसंग में यह क्रियाविशेषण की तरह एक निर्णायक अवसर को व्यक्त करता है। ‘एक बार’ स्वाभाविक हिन्दी है; ‘सदा के लिए एक बार’ का बल पाठ में सम्भव है, इसलिए उसे पाद-टिप्पणी में रखा गया है।
- source_word: נִשְׁבַּעְתִּי
  choice: मैंने ... शपथ खाई है
  rationale: निफ़अल रूप का अर्थ ‘शपथ खाना’ है। पूर्ण वर्तमान हिन्दी में अतीत में खाई गई और अब भी प्रभावी शपथ का भाव देता है।
- source_word: בְקָדְשִׁי
  choice: अपनी पवित्रता की
  rationale: בְ यहाँ शपथ के आधार या साक्षी का बोध कराता है; हिन्दी में ‘अपनी पवित्रता की शपथ’ स्वाभाविक और अर्थनिष्ठ है।
- source_word: אִם
  choice: नहीं
  rationale: शपथ के बाद אִם अधूरी शाप-सूचक शपथ-रचना है—शाब्दिक रूप ‘यदि मैं...’—जिसका आशय दृढ़ निषेध है। मुख्य पाठ में निहित निषेध स्पष्ट किया गया है और शाब्दिक संरचना पाद-टिप्पणी में दी गई है।
- source_word: לְדָוִד
  choice: दाऊद से
  rationale: כזב के साथ व्यक्ति की ओर लक्षित झूठ के लिए आधुनिक हिन्दी में ‘दाऊद से झूठ बोलना’ सर्वाधिक स्वाभाविक है।
- source_word: אֲכַזֵּב
  choice: झूठ नहीं बोलूँगा
  rationale: पिएल रूप यहाँ किसी व्यक्ति से झूठ बोलने या उसके प्रति असत्य सिद्ध होने का भाव देता है। ‘झूठ नहीं बोलूँगा’ सीधा है; ‘दाऊद के प्रति झूठा सिद्ध नहीं होऊँगा’ सम्भव विकल्प है।
theological_decisions:
- issue: दैवी शपथ में אִם की अधूरी शपथ-रचना
  choice: मैं दाऊद से झूठ नहीं बोलूँगा
  alternative: यदि मैं दाऊद से झूठ बोलूँ...
  rationale: मूल में निषेध अलग शब्द के रूप में नहीं है, पर शपथ-सूत्र में אִם दृढ़ निषेध व्यक्त करता है। अर्थ को स्पष्ट हिन्दी में दिया गया है, जबकि मूल की तनावपूर्ण अधूरी रचना को पाद-टिप्पणी में सुरक्षित रखा गया है।
- issue: אַחַת के निर्णायक बल की मात्रा
  choice: एक बार
  alternative: सदा के लिए एक बार
  rationale: ‘एक बार’ मूल के न्यूनतम स्पष्ट अर्थ को रखता है और शपथ की निर्णायकता को अधिक व्याख्यायित नहीं करता; अधिक बलयुक्त सम्भावना पाद-टिप्पणी में दी गई है।
- issue: परमेश्वर की पवित्रता को शपथ का आधार मानना
  choice: अपनी पवित्रता की शपथ
  alternative: अपने पवित्रस्थान की शपथ
  rationale: सन्दर्भ और रूप-विन्यास परमेश्वर की अपनी पवित्रता को शपथ का आधार मानने के पक्ष में हैं; ‘पवित्रस्थान’ यहाँ कम सम्भावित है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट शैली। ‘शपथ खाई है’ सामान्य पाठक के लिए स्वाभाविक है। पाद-टिप्पणी चिह्न सम्बद्ध पदांशों के बाद रखे गए हैं; [a] निषेधात्मक शपथ-सूत्र और [b] אַחַת के अधिक बलयुक्त अर्थ को बताता है।
