base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/038.yaml
  text: But you have cast off and rejected[a]; you have become enraged with your anointed one.
translation:
  language: hi
  text: 'परन्तु आपने अपने अभिषिक्त को त्याग दिया और ठुकरा दिया है;

    आप उस पर क्रोध से भड़क उठे हैं।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אַתָּה
  choice: परन्तु आपने
  rationale: संयोजक के साथ स्वतंत्र सर्वनाम पिछली वाचा-संबंधी प्रतिज्ञाओं के बाद तीखा विरोध प्रकट करता है; ‘परन्तु’ इस मोड़ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: זָנַחְתָּ
  choice: उसे त्याग दिया है
  rationale: क्रिया किसी को अलग कर देने या त्यागने का भाव रखती है। हिन्दी में कर्म स्पष्ट करने के लिए ‘उसे’ जोड़ा गया है, जिसका संदर्भ पद के अंत में आए ‘अभिषिक्त जन’ से है।
- source_word: וַ/תִּמְאָס
  choice: और ठुकरा दिया है
  rationale: मָאַס अस्वीकार करने, तुच्छ जानकर ठुकराने का भाव देता है। ‘त्याग दिया और ठुकरा दिया’ इब्रानी की समानार्थी क्रियाओं से उत्पन्न तीव्रता बनाए रखता है।
- source_word: הִתְעַבַּרְתָּ
  choice: क्रोध से भड़क उठे हैं
  rationale: यह रूप यहाँ तीव्र क्रोध में आने का मुहावरेदार अर्थ देता है; ‘भड़क उठे हैं’ उसकी गतिशीलता और प्रबलता को स्वाभाविक हिन्दी में रखता है।
- source_word: עִם
  choice: पर
  rationale: मूल अर्थ ‘के साथ’ है, पर क्रोधित होने की हिन्दी अभिव्यक्ति में ‘पर’ स्वाभाविक संबंधसूचक है और अभिषिक्त जन की ओर लक्षित क्रोध को व्यक्त करता है।
- source_word: מְשִׁיחֶךָ
  choice: अपने अभिषिक्त जन
  rationale: शब्द का सीधा अर्थ ‘आपका अभिषिक्त’ है। ‘अभिषिक्त जन’ तत्काल संदर्भ में दाऊदी राजा को सूचित करता है और ‘मसीह’ से उसका शब्दगत संबंध भी सुरक्षित रखता है।
theological_decisions:
- issue: राजकीय विलाप में מְשִׁיחֶךָ का अनुवाद और उसका मसीही अनुनाद
  choice: अपने अभिषिक्त जन
  alternative: अपने मसीह
  rationale: इस भजन में निकटतम संदर्भ परमेश्वर की वाचा के अधीन दाऊदी राजा है। मुख्य पाठ में ‘अभिषिक्त जन’ रखने से उससे अधिक स्पष्ट मसीही पहचान आरोपित नहीं होती जितनी पद स्वयं करता है, जबकि पादटिप्पणी ‘मसीह’ के साथ वास्तविक शब्दगत और धर्मवैचारिक संबंध सुरक्षित रखती है।
translation_notes:
  register: आधुनिक, सम्मानसूचक और गरिमापूर्ण हिन्दी के लिए परमेश्वर को ‘आप’ से संबोधित किया गया है। समानार्थी क्रियाओं की काव्यात्मक तीव्रता और दूसरे चरण में प्रबल क्रोध का भाव बनाए रखा गया है।
