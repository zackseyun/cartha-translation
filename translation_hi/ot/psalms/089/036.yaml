id: PSA.89.36
reference: Psalms 89:36
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: זַ֭רְע/וֹ לְ/עוֹלָ֣ם יִהְיֶ֑ה וְ/כִסְא֖/וֹ כַ/שֶּׁ֣מֶשׁ נֶגְדִּֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/036.yaml
  text: His offspring will endure forever[c][b][a], and his throne will be like the sun before me.
translation:
  language: hi
  text: उसका वंश सदा बना रहेगा[a], और उसका सिंहासन मेरे सामने सूर्य के समान होगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, ‘उसका बीज सदा होगा’; यहाँ ‘बीज’ का अर्थ सामूहिक रूप से संतान या वंश है।
    reason: lexical_alternative
  - marker: b
    text: या ‘मेरी उपस्थिति में।’ इब्रानी में शाब्दिक रूप से ‘मेरे सामने’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: זַרְעוֹ
  choice: उसका वंश
  rationale: זֶרַע का सामूहिक अर्थ संतान या वंश हो सकता है। राजकीय वाचा के संदर्भ में ‘वंश’ दाऊद की वंश-परंपरा को स्वाभाविक और संक्षिप्त रूप से व्यक्त करता है।
- source_word: לְעוֹלָם
  choice: सदा
  rationale: यहाँ עוֹלָם वाचा की प्रतिज्ञा में निरंतर स्थायित्व दर्शाता है; ‘सदा’ आधुनिक हिन्दी में सहज और काव्यात्मक है।
- source_word: יִהְיֶה
  choice: बना रहेगा
  rationale: मूल क्रिया का शाब्दिक अर्थ ‘होगा’ है, पर ‘उसका वंश सदा होगा’ हिन्दी में अस्वाभाविक है। ‘बना रहेगा’ उसके निरंतर अस्तित्व को बिना अनावश्यक अर्थ जोड़े व्यक्त करता है।
- source_word: וְכִסְאוֹ
  choice: और उसका सिंहासन
  rationale: כִּסֵּא का मूर्त राजकीय बिंब बनाए रखा गया है; इसे ‘राज्य’ या ‘शासन’ जैसे अमूर्त शब्द में नहीं बदला गया।
- source_word: כַשֶּׁמֶשׁ
  choice: सूर्य के समान
  rationale: उपसर्ग כְּ द्वारा व्यक्त सीधी उपमा को dignified आधुनिक हिन्दी में सुरक्षित रखा गया है।
- source_word: נֶגְדִּי
  choice: मेरे सामने
  rationale: यह प्रथम पुरुष एकवचन प्रत्यय सहित ‘मेरे सामने/मेरी उपस्थिति में’ है। ‘मेरे सामने’ मूल की प्रत्यक्षता और परमेश्वर के कथन का स्वर बनाए रखता है।
theological_decisions:
- issue: נֶגְדִּי में प्रथम पुरुष वक्ता का संकेत
  choice: परमेश्वर के सीधे कथन के रूप में ‘मेरे सामने’
  alternative: ‘मेरी उपस्थिति में’
  rationale: भजन के इस भाग में परमेश्वर दाऊद और उसके वंश के विषय में बोलते हैं। प्रत्यक्ष प्रथम पुरुष को बनाए रखना वाचा के बल को सुरक्षित रखता है और अधिक व्याख्यात्मक रूप से बचता है।
- issue: दूसरे उपवाक्य में क्रिया का अध्याहार
  choice: ‘होगा’ जोड़कर स्पष्ट करना
  alternative: ‘और उसका सिंहासन मेरे सामने सूर्य के समान’
  rationale: इब्रानी में दूसरा उपवाक्य क्रियारहित है और पहले उपवाक्य से क्रिया समझी जाती है। हिन्दी में पूर्ण और सहज वाक्य के लिए ‘होगा’ जोड़ा गया है, जबकि ‘बना रहेगा’ दोहराकर उपमा में स्थायित्व का अतिरिक्त बल नहीं डाला गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। समानांतर काव्य-रचना और राजकीय ‘सिंहासन’ का बिंब सुरक्षित है; ‘सूरज’ की अपेक्षा ‘सूर्य’ भजन की औपचारिक-काव्यात्मक शैली के अनुकूल चुना गया है।
