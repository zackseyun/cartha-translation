  terminology: Key royal and covenantal imagery is retained well. “वंश” naturally conveys the dynastic collective force of זֶרַע in this context, and “मेरे सामने” preserves the direct divine speech rather than unnecessarily interpreting it as a more abstract presence formula. Footnote markers are correctly placed and their notes correspond to the marked expressions.
