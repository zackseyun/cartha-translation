  source_fidelity: 'The Hindi accurately represents the Hebrew: זַרְעוֹ is appropriately rendered collectively as “उसका वंश,” לְעוֹלָם יִהְיֶה as enduring permanence (“सदा बना रहेगा”), and the throne is retained as “सिंहासन.” The comparison “सूर्य के समान” and the first-person divine reference in “मेरे सामने” faithfully preserve כַשֶּׁמֶשׁ נֶגְדִּי. Supplying “होगा” in the verbless second colon is a natural Hindi clarification and does not add the stronger ‘endure’ sense to that clause.'
