  text: He will call to me[a], ‘You are my Father, my God, and the rock of my salvation.’
translation:
  language: hi
  text: वह मुझे पुकारेगा[a], “आप मेरे पिता, मेरे परमेश्वर और मेरे उद्धार की चट्टान हैं।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “वह मुझे पुकारेगा” अथवा “वह मेरी ओर पुकार उठेगा।” इब्रानी क्रिया में, विशेषकर प्रार्थना के संदर्भ में, पुकारकर विनती करने का भाव हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הוּא
  choice: वह
  rationale: स्वतंत्र तृतीय पुरुष एकवचन सर्वनाम को बलयुक्त कर्ता के रूप में स्पष्ट रखा गया है।
- source_word: יִקְרָאֵנִי
  choice: मुझे पुकारकर कहेगा
  rationale: קרא का अर्थ ‘पुकारना’ या ‘आवाज़ देना’ हो सकता है; प्रत्यय प्रथम पुरुष एकवचन है। प्रत्यक्ष कथन से पहले यह हिंदी में स्वाभाविक है और परमेश्वर को पुकारने का भाव बनाए रखता है।
- source_word: אָבִי
  choice: मेरे पिता
  rationale: प्रथम पुरुष एकवचन संबंधवाचक प्रत्यय सहित संज्ञा का सीधा और स्वाभाविक अनुवाद।
- source_word: אָתָּה
  choice: आप ... हैं
  rationale: इब्रानी में स्वतंत्र द्वितीय पुरुष सर्वनाम स्पष्ट है; हिंदी में आदरसूचक ‘आप’ और आवश्यक संयोजक क्रिया ‘हैं’ द्वारा इसे व्यक्त किया गया है।
- source_word: אֵלִי
  choice: मेरे परमेश्वर
  rationale: इस समानांतर संबोधन में אֵל स्पष्टतः परमेश्वर के लिए है; ‘परमेश्वर’ आधुनिक मानक हिंदी में प्रतिष्ठित और स्पष्ट विकल्प है।
- source_word: וְצוּר
  choice: और ... चट्टान
  rationale: צור के ठोस रूपक ‘चट्टान’ को बनाए रखा गया है; इसके साथ कोई अलग स्वत्वसूचक शब्द नहीं जोड़ा गया।
- source_word: יְשׁוּעָתִי
  choice: मेरे उद्धार की
  rationale: יְשׁוּעָה का अर्थ उद्धार/छुटकारा है। ‘मेरे उद्धार की चट्टान’ रचनात्मक संबंध और धार्मिक अनुगूंज दोनों सुरक्षित रखता है।
theological_decisions:
- issue: राजकीय/मसीही संदर्भ में परमेश्वर को संबोधन
  choice: 'वचन को परमेश्वर के प्रति सीधे संबोधन के रूप में रखा गया: “आप मेरे पिता, मेरे परमेश्वर और मेरे उद्धार की चट्टान हैं।”'
  alternative: ‘पिता’ को केवल अतिशयोक्तिपूर्ण राजकीय भाषा मानना या अनुवाद में बाद की विशिष्ट मसीही व्याख्या स्पष्ट कर देना।
  rationale: भजन का संदर्भ दाऊदी राजा और वाचा से संबंधित है, पर पद स्वयं संबंधपरक और वाचागत भाषा में परमेश्वर को संबोधित करता है। अनुवाद इस धार्मिक तनाव को सुरक्षित रखता है और बाद के सिद्धान्तगत निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण और स्वाभाविक शैली अपनाई गई है। परमेश्वर के लिए आदरसूचक ‘आप’ रखा गया है। ‘चट्टान’ के मूल रूपक और ‘उद्धार’ की धार्मिक शब्दावली को सुरक्षित रखा गया है।
