base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/006.yaml
  text: For who in the skies can be compared to Yahweh? Who among the sons of God is like Yahweh?[a]
translation:
  language: hi
  text: क्योंकि आकाश में कौन यहोवा के तुल्य ठहर सकता है? देवपुत्रों में कौन यहोवा के समान है?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “स्वर्गीय प्राणियों में,” “दैवी प्राणियों में,” अथवा “पराक्रमियों के पुत्रों में।” इब्रानी पदबंध का शाब्दिक अर्थ “ईश्वर/देवों के पुत्रों में” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन के आधार या कारण को प्रस्तुत करता है और हिंदी में आलंकारिक प्रश्न से स्वाभाविक रूप से जुड़ता है।
- source_word: בַשַּׁחַק
  choice: आकाश में
  rationale: שׁחק आकाश, स्वर्गीय विस्तार या बादलों के क्षेत्र को सूचित कर सकता है; यहाँ ‘आकाश में’ स्वर्गीय परिवेश को स्वाभाविक और समझने योग्य ढंग से व्यक्त करता है।
- source_word: יַעֲרֹךְ לַיהוָה
  choice: यहोवा के तुल्य ठहर सकता है
  rationale: ערך का मूल भाव किसी को साथ रखकर उसकी तुलना या बराबरी करना है; यह चयन प्रश्न की आलंकारिक शक्ति और सामर्थ्य-सूचक रूप को बनाए रखता है।
- source_word: יִדְמֶה לַיהוָה
  choice: यहोवा के समान है
  rationale: דמה यहाँ समानता या सदृशता व्यक्त करता है और पहले अर्धपद के साथ काव्यात्मक समानांतरता बनाए रखता है।
- source_word: בִּבְנֵי אֵלִים
  choice: देवपुत्रों में
  rationale: यह संक्षिप्त हिंदी समास इब्रानी के ‘एलिम के पुत्रों’ की स्वर्गीय/दैवी प्राणियों वाली छवि को सुरक्षित रखता है; संभावित अर्थ फुटनोट में दिए गए हैं।
- source_word: יהוה
  choice: यहोवा
  rationale: आधुनिक हिंदी बाइबलीय प्रयोग में परमेश्वर के विशिष्ट नाम का परिचित और स्पष्ट रूप; मूल पाठ में नाम की विशिष्टता को बनाए रखता है।
theological_decisions:
- issue: יהוה का अनुवाद
  choice: यहोवा
  alternative: प्रभु / याहवे
  rationale: मूल पाठ के विशिष्ट दैवी नाम को सामान्य उपाधि में बदलने के बजाय हिंदी में परिचित नामरूप रखा गया है।
- issue: בִּבְנֵי אֵלִים की पहचान
  choice: देवपुत्रों में
  alternative: स्वर्गीय प्राणियों में / दैवी प्राणियों में / पराक्रमियों के पुत्रों में
  rationale: मुख्य पाठ इब्रानी की पुत्र-संबंधी छवि और उसकी वास्तविक अर्थगत तनातनी को बनाए रखता है; फुटनोट पाठक को प्रमुख व्याख्यात्मक विकल्प बताता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक है। दोनों आलंकारिक प्रश्नों की समानांतर रचना सुरक्षित रखी गई है; ‘देवपुत्र’ दुर्लभ किंतु स्रोत-सन्निकट पद है, इसलिए उसका अर्थ फुटनोट में स्पष्ट किया गया है।
