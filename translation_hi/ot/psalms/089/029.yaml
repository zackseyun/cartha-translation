  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/שַׂמְתִּ֣י לָ/עַ֣ד זַרְע֑/וֹ וְ֝/כִסְא֗/וֹ כִּ/ימֵ֥י שָׁמָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/029.yaml
  text: I will establish his offspring forever[a], and his throne as the days of heaven.
translation:
  language: hi
  text: मैं उसके वंश को सदा के लिए स्थिर रखूँगा, और उसके सिंहासन को आकाश के दिनों के समान बनाए रखूँगा[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक मुहावरेदार अनुवाद: “जब तक आकाश बना रहेगा।”'
    reason: मूल इब्रानी “आकाश के दिनों के समान” का अधिक स्वाभाविक हिन्दी विकल्प देना।
lexical_decisions:
- source_word: וְשַׂמְתִּי
  choice: मैं ... स्थिर रखूँगा
  rationale: שׂים का मूल अर्थ ‘रखना/स्थापित करना’ है। वाचा की प्रतिज्ञा के संदर्भ में ‘स्थिर रखूँगा’ वंश की निरंतरता और सुरक्षा को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לָעַד
  choice: सदा तक
  rationale: לָעַד स्थायी अवधि को व्यक्त करता है; ‘सदा तक’ आधुनिक, स्पष्ट और काव्यात्मक हिन्दी है।
- source_word: זַרְעוֹ
  choice: उसके वंश
  rationale: זֶרַע यहाँ सामूहिक अर्थ में संतान या वंश को सूचित करता है। ‘वंश’ दाऊदी वाचा के राजवंशीय संदर्भ और सामूहिक भाव दोनों को सहज हिन्दी में सुरक्षित रखता है।
- source_word: וְכִסְאוֹ
  choice: और उसके सिंहासन को
  rationale: כִּסֵּא का सीधा अर्थ ‘सिंहासन’ है; यहाँ यह राजा के शासन और राजाधिकार का बिंब है, जिसे बिना विस्तार किए रखा गया है।
- source_word: כִּימֵי
  choice: के दिनों के समान
  rationale: उपसर्ग כְּ तुलना व्यक्त करता है और יְמֵי का शाब्दिक अर्थ ‘के दिन’ है। यह चयन मूल काव्यात्मक मुहावरे को सुरक्षित रखता है।
- source_word: שָׁמָיִם
  choice: आकाश
  rationale: שָׁמַיִם यहाँ ब्रह्मांडीय आकाश/स्वर्गमंडल को सूचित करता है। इस वाक्य में ‘आकाश’ सामान्य हिन्दी में स्वाभाविक है और दीर्घस्थायित्व की काव्यात्मक तुलना बनाए रखता है।
theological_decisions:
- issue: दाऊदी वाचा की प्रतिज्ञा में अवधि की भाषा
  choice: ‘सदा तक’ और ‘आकाश के दिनों के समान’ द्वारा प्रबल स्थायित्व-वाचक भाषा को यथावत रखना
  alternative: इसे व्याख्यात्मक रूप से ‘जब तक आकाश बना रहेगा’ या ‘पीढ़ी-दर-पीढ़ी’ कहना
  rationale: मूल पाठ वंश और सिंहासन के लिए काव्यात्मक, प्रबल स्थायित्व की प्रतिज्ञा करता है। अनुवाद इसके युगांत-संबंधी या राजवंशीय निहितार्थों को किसी एक धर्मवैज्ञानिक व्यवस्था के अनुसार सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण काव्यात्मक शैली। ‘आकाश के दिनों के समान’ जानबूझकर मूल इब्रानी बिंब को सुरक्षित रखता है; पादटिप्पणी उसका मुहावरेदार अर्थ बताती है।
