  choice: दाऊद का
  alternative: दाऊद द्वारा / दाऊद के लिए
  rationale: इब्रानी शीर्षक केवल लेखकत्व ही नहीं, बल्कि समर्पण या संबद्धता भी बता सकता है; इसलिए मुख्य पाठ किसी एक अर्थ को अंतिम रूप से निश्चित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। संक्षिप्त शीर्षक-शैली बनाए रखते हुए तकनीकी शब्द की अनिश्चितता और दाऊद-संबंधी इब्रानी रचना की व्यापकता टिप्पणियों में सुरक्षित रखी गई है।
