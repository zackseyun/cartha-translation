lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: संगीत-निर्देशक के लिए
  rationale: भजन-शीर्षकों में यह पद संगीत-प्रस्तुति की देखरेख करने वाले व्यक्ति को सूचित करता है। यह आधुनिक और स्वाभाविक हिन्दी है तथा इब्रानी में स्पष्ट न किए गए ‘गायक-मंडली’ के भाव को अनावश्यक रूप से नहीं जोड़ता।
- source_word: בִּנְגִינֹת
  choice: तार वाले वाद्यों के साथ
  rationale: यहाँ संज्ञा तार वाले वाद्यों की संगति की ओर संकेत करती है; ‘के साथ’ प्रस्तुति के साधन को सहज हिन्दी में व्यक्त करता है।
- source_word: מַשְׂכִּיל
  choice: मस्कील
  rationale: यह भजन-शीर्षकों का एक तकनीकी इब्रानी शब्द है, जिसका ठीक अर्थ अनिश्चित है। लिप्यंतरण किसी विवादित अर्थ—जैसे शिक्षाप्रद, मननशील या कुशल रचना—को निश्चित मानने से बचाता है।
- source_word: לְדָוִד
  choice: दाऊद का
  rationale: उपसर्ग לְ लेखन, समर्पण, संबंध या संग्रहगत संबद्धता सूचित कर सकता है। ‘दाऊद का’ हिन्दी में इस व्यापक संबंध को बनाए रखता है, जबकि टिप्पणी संभावित अर्थ स्पष्ट करती है।
