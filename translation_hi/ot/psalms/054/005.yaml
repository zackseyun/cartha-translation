  yaml_path: translation/ot/psalms/054/005.yaml
  text: Behold[a], God is my helper[b]; the Lord is among those who sustain my life.
translation:
  language: hi
  text: देखो, परमेश्वर मेरा सहायक है; प्रभु मेरे जीवन[a] को कायम रखने वालों में है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू נֶפֶשׁ का अर्थ प्रसंग के अनुसार ‘जीवन’, ‘स्वयं’ या ‘प्राण/आत्मा’ हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: 'यह हिब्रू वाक्यांश वाक्यरचना की दृष्टि से कठिन है। इसका अनुवाद यह भी हो सकता है: “प्रभु मेरे जीवन को कायम रखता है।”'
    reason: alternative_reading
lexical_decisions:
- source_word: הִנֵּה
  choice: देखो
  rationale: यह ध्यान खींचने वाला काव्यात्मक अव्यय है। ‘देखो’ उसके बल और प्रत्यक्षता को सहज आधुनिक हिन्दी में बनाए रखता है।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: यहाँ यह एकवचन अर्थ में इस्राएल के परमेश्वर के लिए प्रयुक्त सामान्य ईश्वरीय पद है।
- source_word: עֹזֵר לִי
  choice: मेरा सहायक है
  rationale: עֹזֵר का कृदन्त रूप व्यक्ति-सूचक विधेय के रूप में है और לִי सम्बन्ध अथवा हित व्यक्त करता है; हिन्दी में ‘मेरा सहायक’ स्वाभाविक है।
- source_word: אֲדֹנָי
  choice: प्रभु
  rationale: यह मनुष्य के स्वामी के बजाय परमेश्वर की उपाधि है; ‘प्रभु’ आधुनिक हिन्दी में उसका धार्मिक और काव्यात्मक भार रखता है।
- source_word: בְּסֹמְכֵי
  choice: थामे रखने वालों में है
  rationale: בְּ के साथ बहुवचन कृदन्त-समास वाक्यरचना की दृष्टि से कठिन है। यह अनुवाद संगति/समूह का सम्भावित अर्थ रखते हुए मूल के बहुवचन को सुरक्षित रखता है।
- source_word: נַפְשִׁי
  choice: मेरे जीवन
  rationale: इस संकट और रक्षा के प्रसंग में נֶפֶשׁ पूरे व्यक्ति के जीवित जीवन को दर्शाता है; ‘जीवन’ संकुचित देह–आत्मा विभाजन आरोपित नहीं करता।
theological_decisions:
- issue: אֲדֹנָי को ईश्वरीय उपाधि के रूप में प्रस्तुत करना
  choice: प्रभु
  alternative: स्वामी
  rationale: सन्दर्भ में यह परमेश्वर की उपाधि है। ‘प्रभु’ उस धार्मिक अर्थ को स्पष्ट करता है, जबकि ‘स्वामी’ मानवीय स्वामी भी समझा जा सकता है।
- issue: נַפְשִׁי का प्रसंगगत अर्थ
  choice: मेरे जीवन
  alternative: मेरे प्राण / मेरी आत्मा
  rationale: भजनकार शत्रुओं के बीच अपने संरक्षण की बात करता है। ‘जीवन’ पूरे व्यक्ति के बचाए और सँभाले जाने का अर्थ रखता है, बिना किसी बाद की मानवशास्त्रीय धारणा को आरोपित किए।
- issue: בְּסֹמְכֵי נַפְשִׁי की कठिन वाक्यरचना
  choice: प्रभु मेरे जीवन को थामे रखने वालों में है
  alternative: प्रभु ही मेरे जीवन को थामे रखता है
  rationale: मुख्य पाठ हिब्रू के बहुवचन कृदन्त और בְּ से सम्भव संगति के अर्थ को सुरक्षित रखता है। प्रत्यक्ष एकवचन कर्ता वाला पाठ अधिक सहज है, पर मूल की वाक्यरचनात्मक कठिनाई को हल कर देता है; इसलिए उसे पाद-टिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘देखो’ मूल के काव्यात्मक ध्यानाकर्षण को रखता है, और कठिन दूसरी पंक्ति को अनावश्यक रूप से सरल करके उसकी वास्तविक अस्पष्टता नहीं मिटाई गई।
