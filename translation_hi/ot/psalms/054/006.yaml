translation:
  language: hi
  text: बुराई मेरे विरोधियों पर लौट आए[a]; अपनी विश्वासयोग्यता के अनुरूप उनका नाश कर दे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बुराई मेरे विरोधियों पर लौटेगी; अपनी विश्वासयोग्यता के अनुरूप उनका नाश कर दे।” पहली क्रिया को कामनार्थक के बजाय निश्चयार्थक भी समझा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ישוב
  choice: लौट आए
  rationale: שוב का क़ाल अपूर्ण रूप यहाँ प्रार्थनात्मक/कामनार्थक अर्थ में पढ़ा गया है; अगले आज्ञार्थक क्रिया-रूप के साथ यह स्वाभाविक है, जबकि निश्चयार्थक अर्थ भी सम्भव है।
- source_word: הָרַע
  choice: बुराई
  rationale: רַע नैतिक बुराई के साथ हानि या विपत्ति भी सूचित कर सकता है। ‘बुराई’ इब्रानी की संक्षिप्तता और अर्थ-विस्तार को बनाए रखती है।
- source_word: לְשֹׁרְרָי
  choice: मेरे विरोधियों पर
  rationale: यह शत्रुतापूर्ण प्रतिपक्षियों को दर्शाता है; ‘विरोधियों’ से अनावश्यक रूप से सैनिक अर्थ जोड़े बिना संघर्ष का भाव व्यक्त होता है।
- source_word: בַּאֲמִתְּךָ
  choice: अपनी विश्वासयोग्यता के अनुसार
  rationale: אֱמֶת का अर्थ सत्य, विश्वसनीयता या विश्वासयोग्यता हो सकता है। यहाँ परमेश्वर से उसके विश्वसनीय चरित्र के अनुरूप न्याय करने की विनती है; בְּ को मानक/आधार के अर्थ में व्यक्त किया गया है।
- source_word: הַצְמִיתֵם
  choice: उनका नाश कर दे
  rationale: צמת का हिफ़ईल आज्ञार्थक रूप मिटा देने, नष्ट करने या अन्त कर देने की प्रबल विनती है। ‘नाश कर दे’ उसका बल सीधे और स्वाभाविक हिन्दी में रखता है।
theological_decisions:
- issue: शत्रुओं के विरुद्ध न्याय की प्रार्थना
  choice: पहली क्रिया को कामनार्थक और अन्तिम क्रिया को सीधी आज्ञार्थक विनती के रूप में रखा गया है।
  alternative: 'इसे भविष्यवाचक कथन माना जा सकता है: ‘बुराई मेरे विरोधियों पर लौटेगी; अपनी विश्वासयोग्यता के अनुसार तू उनका नाश करेगा।’'
  rationale: भजन में परमेश्वर को सीधा सम्बोधन है और अन्तिम क्रिया स्पष्ट आज्ञार्थक है। कामनार्थक अनुवाद इब्रानी की दण्ड-विनती के तनाव को न तो नरम करता है, न केवल भविष्यवाणी में बदलता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘लौट आए’ प्रार्थनात्मक भाव रखता है; ‘नाश कर दे’ मूल आज्ञार्थक की कठोरता को बिना नरम किए व्यक्त करता है।
