  text: God[a], save me by your name, and vindicate me by your might.
translation:
  language: hi
  text: हे परमेश्वर, अपने नाम से मुझे बचा, और अपनी सामर्थ्य से मुझे न्याय दिला।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा, “मेरा न्याय कर” या “मेरे मुकदमे का निर्णय कर।” इब्रानी क्रिया न्यायालय में न्याय करने का अर्थ दे सकती है, पर यहाँ सम्भवतः न्याय दिलाने या पक्ष में न्यायपूर्ण निर्णय करने का भाव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהִים
  choice: हे परमेश्वर
  rationale: प्रार्थना के सीधे संबोधन को स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है। यहाँ אֱלֹהִים सामान्य पद है; 'परमेश्वर' आधुनिक हिन्दी बाइबलीय प्रयोग में स्पष्ट और सहज है।
- source_word: בְּשִׁמְךָ
  choice: अपने नाम के द्वारा
  rationale: ב के साधनवाचक अर्थ को बनाए रखता है। 'नाम' परमेश्वर के प्रकट चरित्र, प्रतिष्ठा और पहचान को समेटता है; 'अपने नाम के निमित्त' कहना मूल से अधिक व्याख्यात्मक होता।
- source_word: הוֹשִׁיעֵנִי
  choice: मुझे बचा
  rationale: ישׁע के हिफ़ील रूप की सीधी उद्धार या संकट से बचाने की विनती को साधारण, वर्तमान हिन्दी में व्यक्त करता है।
- source_word: וּבִגְבוּרָתְךָ
  choice: और अपने सामर्थ्य से
  rationale: גְּבוּרָה की शक्ति और प्रभावी सामर्थ्य की धारणा को व्यक्त करता है तथा ב के साधनवाचक बल को बनाए रखता है।
- source_word: תְדִינֵנִי
  choice: मुझे न्याय दिला
  rationale: דין के न्यायिक अर्थ को सुरक्षित रखते हुए इस संदर्भ में अनुकूल न्याय और निर्दोष ठहराए जाने की प्रार्थना व्यक्त करता है। यह केवल तटस्थ जाँच या दंड का संकेत नहीं देता।
theological_decisions:
- issue: दिव्य न्याय के संदर्भ में תְדִינֵנִי का अर्थ
  choice: मुझे न्याय दिला
  alternative: मेरा न्याय कर; मेरा मुकदमा लड़
  rationale: भजनकार परमेश्वर से केवल तटस्थ निर्णय नहीं, बल्कि विरोधियों के सामने न्यायपूर्ण हस्तक्षेप माँगता है। 'मुझे न्याय दिला' इस अनुकूल न्यायिक भाव को व्यक्त करता है, पर भजनकार की धार्मिक स्थिति के बारे में कोई अतिरिक्त doctrinal दावा नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, सहज और प्रार्थनात्मक है। समानांतर पदों में 'अपने नाम के द्वारा' और 'अपने सामर्थ्य से' साधनवाचक संबंध बनाए रखते हैं। 'हे' हिन्दी में सीधे, आदरपूर्ण संबोधन के लिए स्वाभाविक है।
