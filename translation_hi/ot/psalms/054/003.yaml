  yaml_path: translation/ot/psalms/054/003.yaml
  text: God[a], hear my prayer; give ear to the words of my mouth.
translation:
  language: hi
  text: हे परमेश्वर, मेरी प्रार्थना सुन; मेरे मुँह के शब्दों पर कान लगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֱלֹהִים
  choice: हे परमेश्वर
  rationale: यह प्रार्थना में सीधे संबोधन के रूप में प्रयुक्त है। आधुनिक मानक हिन्दी में संबोधन को स्वाभाविक और स्पष्ट बनाने के लिए ‘हे’ रखा गया है; ‘परमेश्वर’ אֱלֹהִים का प्रचलित, गरिमापूर्ण समतुल्य है।
- source_word: שְׁמַע
  choice: सुन
  rationale: आज्ञार्थक रूप यहाँ केवल ध्वनि सुनने नहीं, बल्कि प्रार्थना पर ध्यान देकर उसे ग्रहण करने का भाव रखता है। ‘सुन’ संक्षिप्त, स्वाभाविक और प्रार्थना की भाषा के अनुरूप है।
- source_word: תְּפִלָּתִי
  choice: मेरी प्रार्थना
  rationale: תְּפִלָּה का सामान्य और प्रसंगानुकूल अर्थ ‘प्रार्थना’ है; इससे पद का समानांतर विन्यास भी स्पष्ट रहता है।
- source_word: הַאֲזִינָה
  choice: कान लगा
  rationale: यह क्रिया ध्यानपूर्वक कान देने की सजीव श्रवण-छवि व्यक्त करती है। ‘कान लगा’ आधुनिक हिन्दी में समझने योग्य है और केवल ‘ध्यान दे’ की अपेक्षा मूल रूपक को बेहतर सुरक्षित रखता है।
- source_word: לְאִמְרֵי
  choice: शब्दों पर
  rationale: אִמְרֵי का अर्थ यहाँ ‘शब्दों’ है। ‘कान लगाना’ के साथ हिन्दी में ‘पर’ स्वाभाविक कारक है, यद्यपि इब्रानी में לְ लगा है।
- source_word: פִי
  choice: मेरे मुँह के
  rationale: मूल की ठोस काव्यात्मक अभिव्यक्ति ‘मेरे मुँह के शब्द’ को बनाए रखा गया है, बजाय इसे ‘जो मैं कहता हूँ’ के रूप में व्याख्यात्मक ढंग से कहने के।
