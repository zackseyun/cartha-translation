  text: בִּ/נְדָבָ֥ה אֶזְבְּחָה לָּ֑/ךְ א֤וֹדֶה שִּׁמְ/ךָ֖ יְהוָ֣ה כִּי טֽוֹב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/054/007.yaml
  text: I will sacrifice a freewill offering to you[a]; I will give thanks to your name, O Yahweh[c][b], for it is good.
translation:
  language: hi
  text: मैं तुझे स्वेच्छा-बलि चढ़ाऊँगा[a]; हे याहवे,[c] मैं तेरे नाम का धन्यवाद करूँगा, क्योंकि वह अच्छा है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में ‘स्वेच्छा की भेंट/बलि’। इस वाक्यांश का अर्थ ‘मैं स्वेच्छा से’ या ‘अपनी इच्छा से बलि चढ़ाऊँगा’ भी समझा जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: 'इब्रानी में ‘अच्छा’ का कर्ता स्पष्ट नहीं है। ‘वह’ से ‘तेरा नाम’ अभिप्रेत हो सकता है; कुछ लोग इसे सीधे याहवे के लिए समझते हैं: ‘क्योंकि तू भला है।’'
    reason: alternative_reading
  - marker: c
    text: 'इब्रानी: יהוה (YHWH), जिसे परंपरागत रूप से ‘प्रभु’ कहा गया है और ‘याहवे’ के रूप में भी लिप्यंतरित किया जाता है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּנְדָבָה
  choice: स्वेच्छा-बलि
  rationale: נְדָבָה यहाँ זבח के साथ प्रयुक्त होकर स्वेच्छा से चढ़ाई जाने वाली बलि या भेंट का बोध कराता है। संयुक्त पद ‘स्वेच्छा-बलि’ बलिदान-संबंधी अर्थ को बनाए रखता है; क्रियाविशेषणात्मक अर्थ पादटिप्पणी में दिया गया है।
- source_word: אֶזְבְּחָה לָּךְ
  choice: मैं तुझे … चढ़ाऊँगा
  rationale: זבח का अर्थ बलि चढ़ाना है और לָּךְ उसके प्राप्तकर्ता को दर्शाता है। हिंदी में ‘तुझे … बलि चढ़ाऊँगा’ स्वाभाविक और अर्थानुकूल है।
- source_word: אוֹדֶה
  choice: मैं … धन्यवाद करूँगा
  rationale: ידה के हिफ़ईल रूप में धन्यवाद और स्तुति दोनों का भाव हो सकता है। बलि के साथ आराधनापूर्ण कृतज्ञता के संदर्भ में ‘धन्यवाद करूँगा’ उपयुक्त है।
- source_word: שִׁמְךָ
  choice: तेरे नाम का
  rationale: मूल पाठ स्पष्ट रूप से परमेश्वर के ‘नाम’ को कहता है; इसे केवल ‘तेरा’ बनाकर संक्षिप्त नहीं किया गया।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम יהוה को किसी उपाधि से बदलने के बजाय हिंदी में ‘याहवे’ के रूप में लिप्यंतरित किया गया है।
- source_word: כִּי טוֹב
  choice: क्योंकि वह अच्छा है
  rationale: मूल इब्रानी में विशेषण ‘अच्छा’ के साथ कोई स्पष्ट कर्ता नहीं है। हिंदी का ‘वह’ निकटवर्ती ‘नाम’ अथवा याहवे—दोनों की ओर संकेत कर सकता है और इस प्रकार मूल अस्पष्टता को काफी हद तक बनाए रखता है।
theological_decisions:
- issue: יהוה परमेश्वर के नाम का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल में चार अक्षरों वाला व्यक्तिगत नाम है। लिप्यंतरण नाम और उपाधि के बीच का अंतर बनाए रखता है।
- issue: כִּי טוֹב में ‘अच्छा’ का संदर्भ
  choice: ‘वह अच्छा है’—संदर्भ को खुला रखा गया
  alternative: ‘क्योंकि तेरा नाम अच्छा है’ अथवा ‘क्योंकि तू भला है’
  rationale: इब्रानी में कर्ता व्यक्त नहीं है। निकटवर्ती ‘तेरा नाम’ संभावित संदर्भ है, पर याहवे को सीधा संदर्भ मानना भी प्राचीन काव्यात्मक प्रयोग और अनुवाद-परंपरा में संभव है; इसलिए मुख्य पाठ किसी एक को अनावश्यक रूप से निश्चित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, सरल और प्रार्थनात्मक रखी गई है। ‘तुझे/तेरे’ भजन की सीधी संबोधन-शैली के अनुरूप हैं। ‘स्वेच्छा-बलि’ अपेक्षाकृत संक्षिप्त धार्मिक पद है, जिसकी व्याख्या पादटिप्पणी में दी गई है।
