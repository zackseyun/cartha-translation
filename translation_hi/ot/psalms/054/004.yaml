id: PSA.54.4
reference: Psalms 54:4
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּ֤י זָרִ֨ים קָ֤מוּ עָלַ֗/י וְֽ֭/עָרִיצִים בִּקְשׁ֣וּ נַפְשִׁ֑/י לֹ֤א שָׂ֨מוּ אֱלֹהִ֖ים לְ/נֶגְדָּ֣/ם סֶֽלָה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/054/004.yaml
  text: For strangers have risen against me[a], and ruthless men seek my life; they do not set God before them[c][b]. Selah
translation:
  language: hi
  text: 'क्योंकि पराये लोग मेरे विरुद्ध उठ खड़े हुए हैं,[a]

    और निर्दयी लोग मेरे प्राण के पीछे पड़े हैं;[b][c]

    वे परमेश्वर को अपने सामने नहीं रखते।

    सेला'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “विदेशी लोग।” इब्रानी शब्द का अर्थ पराये, अलग या विदेशी लोग हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “हिंसक लोग।”
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से, “मेरे प्राण को खोजते हैं”; यहाँ “प्राण” का अर्थ भजनकार का जीवन है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले निवेदन का कारण बताता है और इब्रानी के कारणसूचक बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: זָרִים
  choice: पराये लोग
  rationale: यह चयन उन लोगों को दर्शाता है जो अपने नहीं, अलग या विमुख हैं; इससे केवल जातीय रूप से ‘विदेशी’ होने का अर्थ अनावश्यक रूप से निश्चित नहीं किया जाता।
- source_word: קָמוּ עָלַי
  choice: मेरे विरुद्ध उठ खड़े हुए हैं
  rationale: यह हिन्दी मुहावरा विरोध और शत्रुतापूर्ण कार्रवाई, दोनों को स्पष्ट करते हुए मूल क्रियात्मक बिंब को बनाए रखता है।
- source_word: עָרִיצִים
  choice: निर्दयी लोग
  rationale: यह शब्द हिंसक, कठोर और अत्याचारी लोगों का बोध करा सकता है। ‘निर्दयी लोग’ सामान्य पाठक के लिए स्वाभाविक है और उसके नैतिक बल को बनाए रखता है।
- source_word: בִּקְשׁוּ נַפְשִׁי
  choice: मेरे प्राण के पीछे पड़े हैं
  rationale: संकट के इस प्रसंग में נֶפֶשׁ व्यक्ति के जीवन को सूचित करता है। हिन्दी का यह मुहावरा जान लेने के लिए पीछा करने का भाव स्वाभाविक रूप से व्यक्त करता है।
- source_word: לֹא שָׂמוּ אֱלֹהִים לְנֶגְדָּם
  choice: वे परमेश्वर को अपने सामने नहीं रखते
  rationale: 'यह मूल रूपक को सुरक्षित रखता है: वे अपने विचार और आचरण में परमेश्वर को सामने रखकर नहीं चलते। व्याख्यात्मक विस्तार को मुख्य पाठ में नहीं जोड़ा गया।'
- source_word: סֶלָה
  choice: सेला
  rationale: इस आराधनात्मक या संगीत-संबंधी संकेत का ठीक अर्थ अनिश्चित है, इसलिए परंपरागत लिप्यंतरण रखा गया है।
theological_decisions:
- issue: धमकी के प्रसंग में נֶפֶשׁ का मानवशास्त्रीय अर्थ
  choice: ‘प्राण’ को व्यक्ति के जीवन के अर्थ में रखा गया है
  alternative: ‘आत्मा’
  rationale: शत्रु भजनकार के जीवन के पीछे पड़े हैं; यहाँ ‘आत्मा’ कहने से देह और अभौतिक आत्मा के बीच ऐसा विशिष्ट भेद आ सकता है जिस पर यह पद बल नहीं देता।
- issue: परमेश्वर को सामने न रखने का अर्थ
  choice: मूल रूपक को ज्यों का त्यों रखा गया है
  alternative: ‘वे परमेश्वर की परवाह नहीं करते’
  rationale: वैकल्पिक वाक्य आशय समझाता है, पर मूल के दृश्य रूपक और उसके व्यापक नैतिक-धार्मिक तनाव को सीमित कर देता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक रखी गई है। ‘पराये लोग,’ ‘उठ खड़े हुए हैं’ और ‘अपने सामने नहीं रखते’ मूल इब्रानी के बिंबों को बनाए रखते हैं, जबकि ‘मेरे प्राण के पीछे पड़े हैं’ सामान्य आधुनिक हिन्दी में जान लेने की शत्रुतापूर्ण मंशा स्पष्ट करता है।
