source:
  edition: WLC
  text: כִּ֣י מִ/כָּל צָ֭רָה הִצִּילָ֑/נִי וּ֝/בְ/אֹיְבַ֗/י רָאֲתָ֥ה עֵינִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/054/008.yaml
  text: For he has delivered me from every trouble[a], and my eye has looked on my enemies.
translation:
  language: hi
  text: क्योंकि उसने मुझे हर संकट से छुड़ाया है, और मेरी आँख ने मेरे शत्रुओं को देखा है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैंने अपने शत्रुओं को देखा है।” इससे उनकी पराजय या भजनकार के पक्ष की पुष्टि का संकेत हो सकता है, पर यह स्पष्ट नहीं है।
    reason: ‘मेरी आँख’ इब्रानी की शाब्दिक काव्यात्मक अभिव्यक्ति है; ‘मैंने’ उसका स्वाभाविक मुहावरेदार विकल्प है। शत्रुओं को देखने का संभावित निहितार्थ अनिश्चित रखा गया है।
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन में की गई स्तुति या प्रतिज्ञा का आधार बताता है; ‘क्योंकि’ इसके व्याख्यात्मक संबंध को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: מִכָּל צָרָה
  choice: हर संकट से
  rationale: מִן के साथ כָּל समस्त संकटों में से छुटकारे का भाव देता है। ‘हर संकट से’ वितरणात्मक अर्थ और सहज आधुनिक हिन्दी दोनों को सुरक्षित रखता है।
- source_word: הִצִּילָנִי
  choice: उसने मुझे ... छुड़ाया है
  rationale: נצל के हिफ़ईल रूप का अर्थ छुड़ाना या बचाना है। पूर्ण क्रिया को वर्तमान प्रासंगिकता सहित व्यक्त करने के लिए ‘छुड़ाया है’ चुना गया है।
- source_word: וּבְאֹיְבַי
  choice: और ... मेरे शत्रुओं को
  rationale: ראה के साथ ב यहाँ देखे गए व्यक्ति की ओर संकेत कर सकता है। हिन्दी में सकर्मक ‘देखना’ के साथ ‘को’ स्वाभाविक है और शत्रुओं की पराजय को अनकहा ही रहने देता है।
- source_word: רָאֲתָה עֵינִי
  choice: मेरी आँख ने ... देखा है
  rationale: इब्रानी में ‘मेरी आँख’ ही कर्ता है। इस सजीव अभिव्यक्ति को बनाए रखते हुए हिन्दी में स्वाभाविक क्रिया-रूप दिया गया है।
theological_decisions:
- issue: भजनकार द्वारा शत्रुओं को देखने का निहितार्थ
  choice: केवल यह कहना कि उसकी आँख ने उसके शत्रुओं को देखा है
  alternative: मेरी आँख ने मेरे शत्रुओं की पराजय देखी है / मैंने अपने शत्रुओं पर विजय पाकर उन्हें देखा है
  rationale: इब्रानी पाठ शत्रुओं की पराजय, प्रतिशोध या भजनकार की विजय को स्पष्ट रूप से नहीं कहता। संदर्भ में ऐसा निहितार्थ संभव है, पर उसे मुख्य पाठ में जोड़ना स्रोत से अधिक कहना होगा।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रूप। ‘संकट’, ‘छुड़ाया’ और ‘शत्रु’ भजन की काव्यात्मक गरिमा बनाए रखते हैं।
