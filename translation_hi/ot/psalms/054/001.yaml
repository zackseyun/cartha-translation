  text: when the Ziphites came and said to Saul[a], “Is not David hiding among us?”
translation:
  language: hi
  text: जब ज़ीफ़ के लोग आए और शाऊल से कहा, “क्या दाऊद हमारे बीच[a] छिपा हुआ नहीं है?”
