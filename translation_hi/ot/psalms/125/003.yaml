  text: כִּ֤י לֹ֪א יָנ֡וּחַ שֵׁ֤בֶט הָ/רֶ֗שַׁע עַל֮ גּוֹרַ֪ל הַֽ/צַּדִּ֫יקִ֥ים לְמַ֡עַן לֹא יִשְׁלְח֖וּ הַ/צַּדִּיקִ֨ים בְּ/עַוְלָ֬תָ/ה יְדֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/125/003.yaml
  text: For the scepter of wickedness will not rest on the lot of the righteous[c][b][a], lest the righteous stretch out their hands to wrongdoing.
translation:
  language: hi
  text: क्योंकि दुष्टता का राजदंड धर्मियों के भाग पर टिका न रहेगा,[a][b] कहीं ऐसा न हो कि धर्मी अन्याय की ओर अपने हाथ बढ़ाएँ।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “दुष्टों का राजदंड।” इब्रानी पदबंध दुष्टता के गुण या राजदंड चलाने वाले दुष्ट लोगों—दोनों की ओर संकेत कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: “भाग” का अर्थ “नियत हिस्सा” या “विरासत” भी हो सकता है—वह हिस्सा जो धर्मियों को मिला है।
    reason: lexical_alternative
  - marker: c
    text: या, “अन्याय में अपने हाथ बढ़ाएँ” या “अन्याय के लिए अपने हाथ बढ़ाएँ।” यह इब्रानी मुहावरा अन्याय या दुष्कर्म में लग जाने को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन के विश्वास का आधार या कारण प्रस्तुत करता है और हिंदी में प्रसंग का संबंध स्वाभाविक रखता है।
- source_word: יָנוּחַ
  choice: टिका न रहेगा
  rationale: נוח के ठहरने, टिकने या बने रहने के भाव को व्यक्त करता है और दुष्ट शासन के स्थायी न होने पर बल देता है।
- source_word: שֵׁבֶט
  choice: राजदंड
  rationale: यहाँ छड़ी मात्र नहीं, बल्कि शासन और प्रभुत्व का प्रतीक अभिप्रेत है।
- source_word: הָרֶשַׁע
  choice: दुष्टता का
  rationale: अमूर्त संज्ञा के रूप को बनाए रखता है; साथ ही 'दुष्टों का' अर्थ भी संभव है, जिसे पादटिप्पणी में रखा गया है।
- source_word: גּוֹרַל
  choice: भाग
  rationale: यह चिट्ठी द्वारा बाँटे गए हिस्से, नियत अंश या विरासत के अर्थ को सरल आधुनिक हिंदी में व्यक्त करता है।
- source_word: הַצַּדִּיקִים
  choice: धर्मियों
  rationale: बहुवचन विशेषण के संज्ञात्मक प्रयोग का मानक, संक्षिप्त और धर्मवैचारिक रूप से खुला अनुवाद है।
- source_word: לְמַעַן לֹא
  choice: कहीं ऐसा न हो कि
  rationale: निवारक उद्देश्य या संभावित हानिकारक परिणाम को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: יִשְׁלְחוּ ... יְדֵיהֶם
  choice: अपने हाथ बढ़ाएँ
  rationale: मूल इब्रानी बिंब को बनाए रखता है, जबकि आगे का वाक्यांश उसके सक्रिय रूप से बुराई में लगने के भाव को स्पष्ट करता है।
- source_word: בְּעַוְלָתָה
  choice: अन्याय करने को
  rationale: עַוְלָה के अन्याय, कुटिलता या दुष्कर्म के व्यापक अर्थ को यहाँ मुहावरेदार और क्रियात्मक हिंदी में व्यक्त करता है।
theological_decisions:
- issue: धर्मियों पर दुष्ट शासन के विषय में प्रतिज्ञा का स्वरूप
  choice: दुष्ट प्रभुत्व धर्मियों के भाग पर स्थायी रूप से नहीं टिका रहेगा।
  alternative: दुष्ट कभी भी धर्मियों पर किसी प्रकार का अधिकार नहीं रखेंगे।
  rationale: יָנוּחַ का अर्थ टिकना या ठहरना है; इसलिए पद पीड़ा अथवा अस्थायी दमन को नकारता नहीं, बल्कि उसके स्थायी न रहने की बात कहता है। उद्देश्य-वाक्य भी इस सीमा को धर्मियों के अन्याय की ओर मुड़ने से जोड़ता है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण किंतु सामान्य पाठक के लिए स्पष्ट शैली। “राजदंड” ने शासन का रूपक सुरक्षित रखा है; “टिका न रहेगा” ने अस्थायी दमन और स्थायी प्रभुत्व के बीच मूल तनाव बनाए रखा है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में दिए गए हैं।
