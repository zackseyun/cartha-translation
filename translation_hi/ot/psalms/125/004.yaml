  yaml_path: translation/ot/psalms/125/004.yaml
  text: Do good[a], O Yahweh, to the good[b], and to the upright in heart.
translation:
  language: hi
  text: हे याहवे, भले लोगों का भला कर[a], और उनका भी जो अपने हृदय में खरे हैं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘हे याहवे, भले लोगों के साथ भलाई कर।’
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में, ‘अपने हृदयों में सीधे’; यह उनके भीतर की सत्यनिष्ठा पर बल देता है।
    reason: meaning_clarification
lexical_decisions:
- source_word: הֵיטִיבָה
  choice: भलाई कर
  rationale: यह יטב का हिफ़ील आज्ञार्थक रूप है और याहवे से की गई विनती व्यक्त करता है। ‘भलाई कर’ क्रिया के सक्रिय बल को बनाए रखता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय परमेश्वर-नाम को किसी उपाधि से बदलने के बजाय हिन्दी में लिप्यंतरित किया गया है।
- source_word: לַטּוֹבִים
  choice: भले लोगों के साथ
  rationale: विशेषण טוֹב यहाँ संज्ञा के समान प्रयुक्त होकर भले लोगों को दर्शाता है। यह चयन ‘भलाई कर’ के साथ मूल पाठ का शब्द-संबंध भी बनाए रखता है।
- source_word: וְלִישָׁרִים
  choice: और उनके साथ भी जो ... सीधे हैं
  rationale: יָשָׁר नैतिक सीधेपन और खराई को व्यक्त करता है। हिन्दी में ‘हृदयों में सीधे’ मूल रूपक और नैतिक अर्थ दोनों को सुरक्षित रखता है।
- source_word: בְּלִבּוֹתָם
  choice: अपने हृदयों में
  rationale: बहुवचन ‘उनके हृदयों में’ को व्यक्ति-सापेक्ष स्वाभाविक हिन्दी में ‘अपने हृदयों में’ कहा गया है; इससे भीतरी खराई पर मूल पाठ का बल बना रहता है।
theological_decisions:
- issue: परमेश्वर के नाम YHWH का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत परमेश्वर-नाम יְהוָה है। ‘याहवे’ उसका लिप्यंतरण है; ‘प्रभु’ नाम को उपाधि से बदल देता, जबकि ‘यहोवा’ एक वैकल्पिक पारंपरिक रूप है।
- issue: विनती के पात्रों का नैतिक वर्णन
  choice: भले लोग ... जो अपने हृदयों में सीधे हैं
  alternative: धर्मी ... निष्कपट हृदयवाले
  rationale: मूल के दो समानांतर नैतिक विशेषणों को तकनीकी धर्मशास्त्रीय श्रेणियों में बदले बिना रखा गया है और दूसरे पदबंध की भीतरी खराई स्पष्ट की गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और प्रार्थनात्मक रखी गई है। ‘हे’ संबोधन भजन की विनती का स्वर देता है; ‘भले लोगों के साथ भलाई कर’ सामान्य पाठक के लिए सहज है, जबकि ‘अपने हृदयों में सीधे’ मूल इब्रानी के रूपक और बहुवचन को निकटता से सुरक्षित रखता है।
