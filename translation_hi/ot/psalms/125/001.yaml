  yaml_path: translation/ot/psalms/125/001.yaml
  text: A Song of Ascents. Those who trust in Yahweh are like Mount Zion[a], which cannot be shaken, but remains forever.
translation:
  language: hi
  text: 'आरोहण का गीत।


    जो याहवे पर भरोसा रखते हैं,

    वे सिय्योन पर्वत के समान हैं—

    वह कभी नहीं डगमगाएगा[a],

    सदा बना रहेगा।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, अधिक शाब्दिक रूप में, “वह हिलाया नहीं जाएगा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: आरोहण का गीत
  rationale: भजन 120–134 के पारंपरिक शीर्षक को संक्षिप्त और गरिमापूर्ण रूप में रखा गया है। ‘आरोहण’ מַעֲלוֹת के ऊपर चढ़ने के भाव और इस भजन-समूह के साहित्यिक नाम, दोनों को बनाए रखता है।
- source_word: הַבֹּטְחִים
  choice: जो ... भरोसा रखते हैं
  rationale: इब्रानी कृदंत ऐसे लोगों के वर्ग को दर्शाता है जिनकी विशेषता निरंतर भरोसा रखना है; यह हिंदी में स्वाभाविक सामान्य-वर्तमान अभिव्यक्ति है।
- source_word: בַּיהוָה
  choice: यहोवा पर
  rationale: ב यहाँ भरोसे के आधार/विषय को चिह्नित करता है, जिसे हिंदी में स्वाभाविक रूप से ‘पर’ कहा जाता है। परमेश्वर के विशिष्ट नाम יהוה को ‘यहोवा’ के रूप में लिप्यंतरित किया गया है।
- source_word: כְּהַר צִיּוֹן
  choice: सिय्योन पर्वत के समान
  rationale: כְּ की स्पष्ट उपमा को सुरक्षित रखते हुए צִיּוֹן का प्रचलित हिंदी रूप ‘सिय्योन’ रखा गया है।
- source_word: לֹא יִמּוֹט
  choice: वह कभी नहीं डगमगाएगा
  rationale: מוֹט का स्थिरता खोने, हिलने या डगमगाने का बिंब ‘डगमगाएगा’ में स्वाभाविक और काव्यात्मक रूप से व्यक्त होता है। ‘कभी नहीं’ निषेध को कालातीत स्थिरता के संदर्भ में स्पष्ट करता है।
- source_word: לְעוֹלָם יֵשֵׁב
  choice: सदा बना रहेगा
  rationale: יָשַׁב का मूल अर्थ बैठना/निवास करना है, पर इस संदर्भ में לְעוֹלָם के साथ स्थायी बने रहने का भाव प्रमुख है।
theological_decisions:
- issue: परमेश्वर के नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में वाचा का विशिष्ट नाम सीधे आया है। ‘यहोवा’ आधुनिक हिंदी बाइबलीय प्रयोग में पहचाना जाने वाला नाम-रूप है और इसे सामान्य उपाधि ‘प्रभु’ से नहीं बदलता।
- issue: एकवचन क्रियाओं का संदर्भ
  choice: ‘वह’ को सिय्योन पर्वत से व्याकरणिक रूप से जोड़ते हुए उपमा का आशय भरोसा रखने वालों तक खुला रखा गया
  alternative: बहुवचन में ‘वे कभी नहीं डगमगाएँगे’
  rationale: इब्रानी में יִמּוֹט और יֵשֵׁב दोनों एकवचन हैं और निकटतम संज्ञा ‘सिय्योन पर्वत’ है। एकवचन बनाए रखने से मूल व्याकरण और उपमा की काव्यात्मक संरचना सुरक्षित रहती है; बहुवचन करने से निहित आशय स्पष्ट होता, पर मूल रूप बदल जाता।
translation_notes:
  register: आधुनिक मानक हिंदी में संक्षिप्त, काव्यात्मक और गरिमापूर्ण शैली रखी गई है। पंक्ति-विन्यास इब्रानी पद की समानांतर रचना को उभारता है। ‘आरोहण’ सामान्य बातचीत की अपेक्षा कुछ साहित्यिक है, पर भजन-शीर्षक के लिए उपयुक्त और अर्थ-संरक्षक है।
