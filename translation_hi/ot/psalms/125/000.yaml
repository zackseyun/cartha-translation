base_translation:
  language: en
  yaml_path: translation/ot/psalms/125/000.yaml
  text: 'A Song of Ascents[a]. Those who trust in Yahweh are like Mount Zion: it will not be shaken; it abides forever.'
translation:
  language: hi
  text: 'चढ़ाई का गीत।


    जो याहवे पर भरोसा रखते हैं,

    वे सिय्योन पर्वत के समान हैं:

    वह कभी नहीं डगमगाएगा[a];

    वह सदा बना रहेगा।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, अधिक शाब्दिक रूप में, “हिलाया नहीं जाएगा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: चढ़ाई का गीत
  rationale: यह पद-संग्रह के शीर्षक का सहज और अर्थ-सन्निकट रूप है; מַעֲלוֹת में ऊपर चढ़ने या आरोहण का भाव है।
- source_word: הַבֹּטְחִים בַּיהוָה
  choice: जो याहवे पर भरोसा रखते हैं
  rationale: בּטח का आशय भरोसा या निर्भरता रखना है; יהוה को उसके व्यक्तिगत नाम ‘याहवे’ से व्यक्त किया गया है।
- source_word: לֹא יִמּוֹט
  choice: कभी नहीं डगमगाएगा
  rationale: מוט के निफ़अल रूप में हिलने, डगमगाने या अस्थिर किए जाने का भाव है; ‘डगमगाएगा’ आधुनिक हिन्दी में स्थिरता का चित्र स्वाभाविक रूप से रखता है।
- source_word: לְעוֹלָם יֵשֵׁב
  choice: वह सदा बना रहेगा
  rationale: יֵשֵׁב यहाँ स्थायी रूप से टिके या बने रहने का भाव देता है; यह अनावश्यक रूप से केवल ‘बैठने’ का भौतिक अर्थ नहीं थोपता।
theological_decisions:
- issue: बहुवचन भरोसा रखने वालों और उसके बाद आने वाले एकवचन क्रियापदों का संबंध
  choice: एकवचन ‘वह’ को सिय्योन पर्वत की ओर संकेत करने दिया गया
  alternative: क्रियापदों को बहुवचन बनाकर सीधे भरोसा रखने वालों पर लागू करना
  rationale: इब्रानी पाठ में तुलना के बाद לֹא יִמּוֹט और יֵשֵׁב एकवचन हैं, इसलिए सिय्योन पर्वत को निकटतम व्याकरणिक संदर्भ बनाए रखा गया; तुलना के द्वारा यही स्थिरता भरोसा रखने वालों के विषय में भी कही जाती है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण काव्यात्मक शैली। पंक्ति-विन्यास इब्रानी समानांतरता और तुलना को स्पष्ट करता है।
