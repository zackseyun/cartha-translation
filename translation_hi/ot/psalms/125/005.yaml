source:
  edition: WLC
  text: וְ/הַ/מַּטִּ֤ים עַֽקַלְקַלּוֹתָ֗/ם יוֹלִיכֵ֣/ם יְ֭הוָה אֶת פֹּעֲלֵ֣י הָ/אָ֑וֶן שָׁ֝ל֗וֹם עַל יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/125/005.yaml
  text: But as for those who turn aside to their crooked ways[a], Yahweh will lead them away with the workers of iniquity[c][b]. Peace be upon Israel.
translation:
  language: hi
  text: परन्तु जो अपनी टेढ़ी राहों की ओर मुड़ जाते हैं[a], उन्हें याहवे बुराई करनेवालों के साथ दूर ले जाएगा[b]। इस्राएल पर शान्ति हो![c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अपने टेढ़े मार्गों की ओर’ अथवा ‘अपनी विकृत राहों की ओर।’
    reason: lexical_alternative
  - marker: b
    text: या ‘याहवे उन्हें बुराई करनेवालों के साथ ले जाएगा।’
    reason: lexical_alternative
  - marker: c
    text: इब्रानी में शाब्दिक रूप से ‘इस्राएल पर शान्ति’—यह इस्राएल की शान्ति के लिए एक संक्षिप्त आशीर्वचन या प्रार्थना है।
    reason: cultural_note
lexical_decisions:
- source_word: וְהַמַּטִּים
  choice: परन्तु जो ... मुड़ जाते हैं
  rationale: נטה का कृदन्त मार्ग से हटने या मुड़ने का भाव देता है। पिछले पद के सीधे मनवालों से विरोध दिखाने के लिए וְ को यहाँ ‘परन्तु’ कहा गया है।
- source_word: עַקַלְקַלּוֹתָם
  choice: अपनी टेढ़ी राहों की ओर
  rationale: यह शब्द टेढ़े या विकृत मार्गों का बिंब रखता है; ‘राहों’ से इसके नैतिक और रूपकात्मक दोनों अर्थ स्वाभाविक हिन्दी में बने रहते हैं।
- source_word: יוֹלִיכֵם
  choice: उन्हें ... दूर ले जाएगा
  rationale: הלך के हिफ़ील रूप में ‘ले जाना’ या ‘जाने को विवश करना’ अर्थ है। प्रसंग न्याय के द्वारा हटाए जाने का संकेत देता है, जिसे ‘दूर ले जाएगा’ स्पष्ट किंतु संयत रूप से व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: ईश्वर के व्यक्तिगत नाम का लिप्यन्तरण किया गया है; इसे किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: אֶת
  choice: के साथ
  rationale: 'यहाँ אֶת साथ या संगति का भाव देता है: भटकनेवाले लोग बुराई करनेवालों के साथ ले जाए जाएँगे।'
- source_word: פֹּעֲלֵי הָאָוֶן
  choice: बुराई करनेवाले
  rationale: शाब्दिक संरचना ‘अनर्थ/बुराई के कर्ता’ है। ‘बुराई करनेवाले’ आधुनिक हिन्दी में सहज है और नैतिक अर्थ को बनाए रखता है।
- source_word: שָׁלוֹם
  choice: शान्ति
  rationale: यह सामान्य और स्वाभाविक समतुल्य है, जिसमें कुशलता और समग्र कल्याण का व्यापक इब्रानी भाव भी निहित रह सकता है।
- source_word: עַל יִשְׂרָאֵל
  choice: इस्राएल पर ... हो
  rationale: संक्षिप्त इब्रानी पदबंध को आशीर्वाद या प्रार्थना के रूप में स्वाभाविक हिन्दी वाक्य में व्यक्त किया गया है।
theological_decisions:
- issue: समापन वाक्य שָׁלוֹם עַל יִשְׂרָאֵל का बल
  choice: 'आशीर्वचन या प्रार्थना: ‘इस्राएल पर शान्ति हो!’'
  alternative: 'वर्णनात्मक कथन: ‘इस्राएल पर शान्ति है।’'
  rationale: भजन की शैली में यह संक्षिप्त पदबंध स्वाभाविक रूप से आशीर्वचन या प्रार्थनापरक निष्कर्ष है। ‘हो’ मूल में अनुपस्थित काल या पक्ष को अनावश्यक रूप से निश्चित किए बिना यह स्वर बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘टेढ़ी राहें’ मूल रूपक को बचाती हैं, ‘बुराई करनेवाले’ सामान्य पाठक के लिए स्पष्ट है, और ईश्वर का व्यक्तिगत नाम ‘याहवे’ लिप्यन्तरित किया गया है।
