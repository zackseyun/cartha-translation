id: PSA.125.2
reference: Psalms 125:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: יְֽרוּשָׁלִַ֗ם הָרִים֮ סָבִ֪יב לָ֥/הּ וַ֭/יהוָה סָבִ֣יב לְ/עַמּ֑/וֹ מֵ֝/עַתָּ֗ה וְ/עַד עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/125/002.yaml
  text: As the mountains surround Jerusalem[a], so Yahweh surrounds his people from now and forever.
translation:
  language: hi
  text: जैसे यरूशलेम के चारों ओर पहाड़ हैं, वैसे ही यहोवा अपनी प्रजा को चारों ओर से घेरे रहता है, अभी से सदा तक।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शब्दशः: “यरूशलेम—उसके चारों ओर पहाड़ हैं, और यहोवा अपनी प्रजा के चारों ओर अभी से सदा तक है।”'
    reason: मुख्य पाठ में निहित तुलना को स्पष्ट किया गया है; यह टिप्पणी मूल की अधिक रूपात्मक संयोजक रचना और यरूशलेम के लिए स्त्रीलिंग सर्वनाम को दिखाती है।
lexical_decisions:
- source_word: יְרוּשָׁלִַם
  choice: यरूशलेम
  rationale: स्थान-नाम का मानक और प्रचलित हिन्दी लिप्यंतरण।
- source_word: הָרִים
  choice: पहाड़
  rationale: הַר के बहुवचन का स्वाभाविक अर्थ; यरूशलेम के चारों ओर की ऊँचाइयों और सुरक्षा के काव्यात्मक बिंब को बनाए रखता है।
- source_word: סָבִיב לָהּ
  choice: यरूशलेम के चारों ओर ... हैं
  rationale: स्त्रीलिंग प्रत्यय नगर यरूशलेम की ओर संकेत करता है; हिन्दी में संज्ञा को दोहराने से संदर्भ स्पष्ट और तुलना स्वाभाविक रहती है।
- source_word: וַיהוָה
  choice: वैसे ही यहोवा
  rationale: वाव का मूल संयोजक बल रहते हुए समानांतर काव्य-संरचना में निहित तुलना को स्वाभाविक हिन्दी में व्यक्त किया गया है; पवित्र नाम को 'यहोवा' के रूप में लिप्यंतरित किया गया है।
- source_word: סָבִיב לְעַמּוֹ
  choice: अपनी प्रजा के चारों ओर ... बना रहता है
  rationale: चारों ओर उपस्थित रहने का वही बिंब दोहराया गया है; 'बना रहता है' स्थायी रक्षक उपस्थिति का संकेत देता है, बिना क्रिया से अधिक विशिष्ट कार्य जोड़ने के।
- source_word: עַמּוֹ
  choice: अपनी प्रजा
  rationale: संबंधसूचक अर्थ को सहज हिन्दी में रखता है; 'प्रजा' सामूहिक और वाचा-संबंधी भाव को बिना अतिरिक्त व्याख्या के व्यक्त करती है।
- source_word: מֵעַתָּה וְעַד עוֹלָם
  choice: अभी से सदा तक
  rationale: वर्तमान समय से अनिश्चित-अनंत भविष्य तक की अवधि का संक्षिप्त, आधुनिक और काव्यात्मक हिन्दी रूप।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ के विशिष्ट वाचा-नाम को सामान्य उपाधि में बदलने के बजाय हिन्दी में व्यापक रूप से पहचाने जाने वाले लिप्यंतरण से रखा गया है।
- issue: יְהוָה से पहले वाव का बल
  choice: 'तुलनात्मक अर्थ: ''वैसे ही यहोवा'''
  alternative: 'सरल संयोजक: ''और यहोवा'''
  rationale: दो समानांतर अर्धपंक्तियाँ स्पष्ट उपमा बनाती हैं। मुख्य पाठ में तुलना को पठनीय बनाया गया है, जबकि अधिक रूपात्मक रचना पाद-टिप्पणी में सुरक्षित है।
- issue: ईश्वर के अपनी प्रजा के चारों ओर होने का अर्थ
  choice: स्थानिक-सुरक्षात्मक बिंब को बनाए रखना
  alternative: 'स्पष्ट व्याख्या: ''रक्षा करता है'''
  rationale: सुरक्षा का भाव संदर्भ में निहित है, पर मूल पाठ सीधे 'रक्षा' की क्रिया नहीं कहता; इसलिए बिंब को व्याख्यात्मक कथन से नहीं बदला गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। 'चारों ओर' की पुनरावृत्ति इब्रानी समानांतरता को सुरक्षित रखती है। 'अपनी प्रजा' सहज हिन्दी है और संबंधसूचक भाव स्पष्ट करती है।
