id: PSA.74.17
reference: Psalms 74:17
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אַתָּ֣ה הִ֭צַּבְתָּ כָּל גְּבוּל֣וֹת אָ֑רֶץ קַ֥יִץ וָ֝/חֹ֗רֶף אַתָּ֥ה יְצַרְתָּ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/017.yaml
  text: You established all the boundaries of the earth[b][a]; summer and winter—you formed them.
translation:
  language: hi
  text: तूने पृथ्वी की सारी सीमाएँ निर्धारित कीं; गर्मी और सर्दी—तूने ही उन्हें रचा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִצַּבְתָּ
  choice: निर्धारित कीं
  rationale: हिफ़ील रूप किसी वस्तु को स्थापित या नियत स्थान पर ठहराने का भाव देता है। ‘निर्धारित कीं’ पृथ्वी की सीमाओं को तय करने और स्थिर करने, दोनों भावों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: כָּל גְּבוּלוֹת אָרֶץ
  choice: पृथ्वी की सारी सीमाएँ
  rationale: सृष्टि और ऋतुओं के संदर्भ में גְּבוּלוֹת को राजनीतिक ‘सरहदें’ के बजाय ‘सीमाएँ’ कहना उचित है; אָרֶץ यहाँ ‘भूमि’ के बजाय समूची ‘पृथ्वी’ को सूचित करता है।
- source_word: קַיִץ וָחֹרֶף
  choice: गर्मी और सर्दी
  rationale: ये दोनों सामान्य ऋतु-सूचक शब्द हैं। आधुनिक साधारण हिन्दी में ‘गर्मी और सर्दी’ स्वाभाविक है और वार्षिक ऋतु-चक्र के युग्म को बनाए रखता है।
- source_word: יְצַרְתָּם
  choice: उन्हें रचा
  rationale: יצר का मूल भाव आकार देने या गढ़ने का है। ‘रचा’ हिन्दी में सृष्टिकर्ता की सक्रिय कारीगरी को सहज रूप से व्यक्त करता है। पुल्लिंग बहुवचन प्रत्यय को ‘उन्हें’ से सुरक्षित रखा गया है, जिसका संदर्भ गर्मी और सर्दी से है।
- source_word: אַתָּה ... אַתָּה
  choice: तूने ... तूने ही
  rationale: इब्रानी में सर्वनाम की पुनरावृत्ति बल देती है। हिन्दी में दूसरी उपवाक्य में ‘ही’ जोड़कर परमेश्वर की प्रत्यक्ष और विशिष्ट कर्तृता को स्वाभाविक रूप से उभारा गया है।
theological_decisions:
- issue: पृथ्वी की ‘सीमाओं’ से संबंधित सृष्टि-वर्णन का दायरा
  choice: यह संसार की व्यवस्था स्थापित करने में परमेश्वर की भूमिका का व्यापक सृष्टि-संबंधी कथन है।
  alternative: यह देशों या भूभागों की राजनीतिक सीमाओं का उल्लेख है।
  rationale: अगले उपवाक्य में गर्मी और सर्दी का उल्लेख इस कथन को सृष्टि की व्यवस्था के संदर्भ में रखता है; इसलिए ‘पृथ्वी की सीमाएँ’ चुना गया है, न कि ‘देशों की सरहदें’।
translation_notes:
  register: आधुनिक मानक हिन्दी; काव्यात्मक किंतु साधारण पाठक के लिए स्पष्ट। भजन की परमेश्वर से सीधी संबोधन-शैली बनाए रखने के लिए आदरसूचक बहुवचन के बजाय पारंपरिक और आत्मीय एकवचन ‘तू’ का प्रयोग किया गया है।
