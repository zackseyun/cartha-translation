- source_word: עַל הַמָּיִם
  choice: जल पर
  rationale: यह עַל के मूल ‘पर’ अर्थ और असामान्य किंतु सजीव काव्यात्मक चित्र को बनाए रखता है; ‘जल में’ कहना व्याख्यात्मक सरलीकरण होता।
theological_decisions:
- issue: समुद्र और תַנִּינִים से जुड़ी छवि का स्वरूप
  choice: मुख्य पाठ में सृष्टि और अराजकता पर परमेश्वर की विजय की काव्यात्मक छवि को बनाए रखना, साथ ही निर्गमन के ऐतिहासिक छुटकारे की संभावित प्रतिध्वनि खुली रखना।
  alternative: इसे केवल निर्गमन और मिस्र/फ़िरौन का संकेत मानना, अथवा केवल प्राचीन मिथकीय संघर्ष की भाषा मानना।
  rationale: भजन की भाषा दोनों अर्थ-क्षेत्रों को जगा सकती है। अनुवाद किसी एक अर्थ को अनिवार्य बनाकर मूल की धार्मिक और काव्यात्मक तनावपूर्ण बहुअर्थता को समाप्त नहीं करता।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण काव्यात्मक हिन्दी। परमेश्वर को सीधे संबोधित करने के लिए ‘तू’ का प्रयोग निकटता और भजन-साहित्य की पारंपरिक गंभीरता बनाए रखता है। ‘जल पर’ मूल पूर्वसर्ग और काव्यात्मक असामान्यता को सुरक्षित रखता है।
