  text: तूने अपने सामर्थ्य[b] से समुद्र को चीर दिया; तूने जल पर समुद्री दैत्यों[a] के सिर चकनाचूर कर दिए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘समुद्री दैत्यों’ के लिए ‘अजगरों’ या ‘विशाल समुद्री जीवों’ का अनुवाद भी संभव है। इब्रानी शब्द तन्नीनीम जल से जुड़े विकराल, सर्पाकार प्राणियों को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: यह पद काव्यात्मक रूप में अराजक समुद्र पर परमेश्वर की विजय और निर्गमन के समय समुद्र के पास किए गए उसके ऐतिहासिक उद्धार-कार्य—दोनों की प्रतिध्वनि हो सकता है।
    reason: cross_reference
