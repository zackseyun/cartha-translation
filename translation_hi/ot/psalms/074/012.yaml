  yaml_path: translation/ot/psalms/074/012.yaml
  text: Yet God is my King from of old[a], working acts of salvation in the midst of the earth.
translation:
  language: hi
  text: फिर भी परमेश्वर प्राचीनकाल से मेरा राजा है; वह पृथ्वी[a] के बीचोबीच उद्धार के कार्य करता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “देश” अथवा “भूमि।” इब्रानी शब्द पूरी पृथ्वी या किसी विशेष देश/क्षेत्र—दोनों को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וֵאלֹהִים
  choice: फिर भी परमेश्वर
  rationale: 'संदर्भ में וְ विरोधसूचक है: वर्तमान उजाड़ के बावजूद भजनकार परमेश्वर के स्थायी राजत्व पर भरोसा प्रकट करता है।'
- source_word: מַלְכִּי
  choice: मेरा राजा
  rationale: संज्ञा पर प्रथम पुरुष एकवचन प्रत्यय का सीधा अर्थ ‘मेरा राजा’ है।
- source_word: מִקֶּדֶם
  choice: प्राचीनकाल से
  rationale: यह पद बहुत पुराने समय से चली आ रही स्थिति बताता है, पर अनिवार्यतः सृष्टि के आरम्भ का दावा नहीं करता।
- source_word: פֹּעֵל
  choice: करता आया है
  rationale: कृदन्त परमेश्वर के निरन्तर अथवा चरित्रगत कार्य को व्यक्त करता है; हिन्दी में यह रूप प्राचीनकाल से अब तक की सक्रियता को स्वाभाविक ढंग से जोड़ता है।
- source_word: יְשׁוּעוֹת
  choice: उद्धार के काम
  rationale: बहुवचन शब्द बार-बार किए गए बचाने या छुड़ाने के कार्यों को दर्शाता है; यह अनुवाद अस्वाभाविक ‘उद्धारों’ से बचते हुए बहुवचन भाव रखता है।
- source_word: בְּקֶרֶב
  choice: के बीच में
  rationale: यह स्थानवाचक पद किसी क्षेत्र के मध्य या भीतर किए गए कार्य को व्यक्त करता है और काव्यात्मक हिन्दी में सहज है।
- source_word: הָאָרֶץ
  choice: पृथ्वी
  rationale: אֶרֶץ का अर्थ ‘पृथ्वी’ या ‘देश/भूमि’ हो सकता है। यहाँ व्यापक दावा देखते हुए ‘पृथ्वी’ मुख्य पाठ में रखा गया है और दूसरा सम्भव अर्थ पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: परमेश्वर के उद्धारकारी कामों का भौगोलिक विस्तार
  choice: पृथ्वी
  alternative: देश अथवा भूमि
  rationale: इब्रानी אֶרֶץ दोनों अर्थ दे सकता है। भजन के व्यापक स्वर के कारण ‘पृथ्वी’ को प्राथमिकता दी गई है, पर स्थानीय अर्थ को निर्णायक रूप से नकारे बिना पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज और काव्यात्मक शैली रखी गई है। ‘करता आया है’ मूल कृदन्त की निरन्तर/चरित्रगत क्रिया और ‘प्राचीनकाल से’ के कालगत सम्बन्ध को स्वाभाविक रूप देता है।
