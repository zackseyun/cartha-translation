id: PSA.74.10
reference: Psalms 74:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: עַד מָתַ֣י אֱ֭לֹהִים יְחָ֣רֶף צָ֑ר יְנָ֘אֵ֤ץ אוֹיֵ֖ב שִׁמְ/ךָ֣ לָ/נֶֽצַח־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/010.yaml
  text: How long[a], O God, will the foe reproach? Will the enemy revile your name forever?
translation:
  language: hi
  text: हे परमेश्वर, शत्रु कब तक तेरा अपमान करता रहेगा? क्या बैरी सदा तेरे नाम की निन्दा करता रहेगा?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्या बैरी सदा तेरे नाम की ईशनिन्दा करता रहेगा?”
    reason: נאץ परमेश्वर या उसके नाम के सन्दर्भ में ‘ईशनिन्दा करना’ भी व्यक्त कर सकता है; मुख्य पाठ कम व्याख्यात्मक ‘निन्दा’ रखता है।
lexical_decisions:
- source_word: עַד מָתַי
  choice: कब तक
  rationale: यह विलाप में लम्बे समय से चल रहे कष्ट पर प्रश्न करने वाला स्वाभाविक हिन्दी मुहावरा है।
- source_word: אֱלֹהִים
  choice: हे परमेश्वर
  rationale: सम्बोधन और प्रार्थनापूर्ण विलाप को स्वाभाविक, गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: יְחָרֶף
  choice: अपमान करता रहेगा
  rationale: पिएल रूप में तिरस्कारपूर्ण निन्दा या उलाहना देने का भाव है; यह चयन हिन्दी में उस निरन्तर अपमान को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: צָר
  choice: शत्रु
  rationale: विरोधी या वैरी का सामान्य अर्थ देता है; अगली समानान्तर संज्ञा से हल्का शब्दगत भेद बनाए रखा गया है।
- source_word: יְנָאֵץ
  choice: निन्दा करता रहेगा
  rationale: यह परमेश्वर के नाम के प्रति तिरस्कार और अपमान व्यक्त करता है, पर मुख्य पाठ में अधिक व्याख्यात्मक ‘ईशनिन्दा’ को अनिवार्य नहीं बनाता।
- source_word: אוֹיֵב
  choice: बैरी
  rationale: सामान्य ‘शत्रु’ के समानार्थी काव्यात्मक शब्द के रूप में इब्रानी समानान्तरता और शब्दगत भेद दोनों बचाता है।
- source_word: שִׁמְךָ
  choice: तेरे नाम
  rationale: मूल का ‘नाम’ परमेश्वर की प्रतिष्ठा, महिमा और प्रकट पहचान का समृद्ध भाव रखता है; इसे शाब्दिक रूप में सुरक्षित रखा गया है।
- source_word: לָנֶצַח
  choice: सदा
  rationale: विलाप में प्रतीत होने वाली अनन्त अवधि को संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: क्या परमेश्वर के ‘नाम’ की निन्दा को सीधे परमेश्वर की ईशनिन्दा के रूप में स्पष्ट किया जाए
  choice: मुख्य पाठ में ‘तेरे नाम’ रखा गया
  alternative: क्या बैरी सदा तेरी ईशनिन्दा करता रहेगा?
  rationale: इब्रानी पाठ स्पष्ट रूप से ‘तेरे नाम’ कहता है। इसे बनाए रखने से परमेश्वर की प्रतिष्ठा और प्रकट पहचान से जुड़ी धार्मिक गहराई सुरक्षित रहती है और सम्भावित अर्थ को चुपचाप संकीर्ण नहीं किया जाता।
translation_notes:
  register: आधुनिक मानक हिन्दी में प्रार्थनापूर्ण और काव्यात्मक शैली रखी गई है। ‘शत्रु/बैरी’ से इब्रानी समानान्तर पदों का हल्का भेद बचता है। सर्वनाम ‘तेरा’ भजन की सीधी, आत्मीय प्रार्थना के अनुरूप है।
