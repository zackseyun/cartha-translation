  yaml_path: translation/ot/psalms/074/015.yaml
  text: You split open springs and wadis; you dried up ever-flowing rivers.
translation:
  language: hi
  text: तूने सोते और जलधाराएँ फोड़ निकाले; तूने सदा बहनेवाली[a] नदियों को सुखा दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या: प्रबल'
    reason: אֵיתָן का अर्थ ‘स्थायी/सदा बहनेवाली’ के साथ-साथ ‘प्रबल’ भी हो सकता है।
lexical_decisions:
- source_word: בָקַעְתָּ
  choice: फोड़ निकालीं
  rationale: क्रिया का मूल अर्थ ‘चीरना/फाड़ना’ है; सोतों और जलधाराओं के संदर्भ में यह अनुवाद भूमि या चट्टान को चीरकर पानी निकालने की सजीव छवि बनाए रखता है।
- source_word: מַעְיָן וָנָחַל
  choice: सोते और जलधाराएँ
  rationale: מַעְיָן जल-स्रोत या सोता है और נַחַל घाटी में बहनेवाली धारा, नाला या वादी हो सकता है। ‘जलधाराएँ’ आधुनिक हिन्दी में स्वाभाविक है और केवल सूखे नदी-पाट का अर्थ आरोपित नहीं करता। इब्रानी के एकवचन रूपों को यहाँ जातिवाचक/सामूहिक अर्थ में बहुवचन किया गया है।
- source_word: נַהֲרוֹת אֵיתָן
  choice: सदा बहनेवाली नदियाँ
  rationale: אֵיתָן स्थायित्व, निरंतरता या सामर्थ्य व्यक्त कर सकता है। नदी के साथ ‘सदा बहनेवाली’ बारहमासी प्रवाह का स्वाभाविक अर्थ देता है, जबकि वैकल्पिक अर्थ को पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: पद में जल निकालने और नदियाँ सुखाने की विपरीत छवियाँ
  choice: दोनों क्रियाओं को उनके स्पष्ट विरोध के साथ बनाए रखा गया
  alternative: इन्हें किसी एक विशिष्ट ऐतिहासिक घटना—जैसे चट्टान से जल या यरदन पार करने—से स्पष्ट रूप से जोड़ना
  rationale: इब्रानी पाठ स्वयं घटना का नाम नहीं देता; काव्यात्मक और धर्मवैचारिक तनाव को बिना किसी खास व्याख्या में सीमित किए सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी; परमेश्वर को संबोधन में भजन-साहित्य के अनुरूप एकवचन ‘तू’ रखा गया है। ‘सदानीरा’ जैसे अपेक्षाकृत साहित्यिक शब्द के बजाय ‘सदा बहनेवाली’ चुना गया है।
