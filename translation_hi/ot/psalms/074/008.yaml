source:
  edition: WLC
  text: אָמְר֣וּ בְ֭/לִבָּ/ם נִינָ֣/ם יָ֑חַד שָׂרְפ֖וּ כָל מוֹעֲדֵי אֵ֣ל בָּ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/008.yaml
  text: They said in their hearts[b][a], “Let us destroy them all together.” They burned all the meeting places of God in the land.
translation:
  language: hi
  text: उन्होंने अपने मन में कहा, “आओ, हम उन्हें पूरी तरह दबा दें।”[a] उन्होंने देश में परमेश्वर के सभी सभा-स्थल जला दिए।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्द נִינָם का अर्थ अनिश्चित है। इसका भाव ‘हम उन्हें दबा दें,’ ‘वश में कर लें,’ ‘कुचल दें’ या विनाश की कोई दूसरी अभिव्यक्ति हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “परमेश्वर के सभी नियत स्थान।” इब्रानी शब्द का अर्थ नियत समय, सभा या नियत मिलन-स्थान भी हो सकता है; कुछ पारम्परिक अनुवादों में “परमेश्वर के सभी आराधनालय” है।
    reason: alternative_reading
lexical_decisions:
- source_word: אָמְרוּ בְלִבָּם
  choice: उन्होंने अपने मन में कहा
  rationale: यह इब्रानी मुहावरा भीतर के विचार या संकल्प को व्यक्त करता है। ‘अपने मन में’ आधुनिक हिन्दी में स्वाभाविक है और मूल की आंतरिक वाणी को बनाए रखता है।
- source_word: נִינָם
  choice: हम उन सबका … दमन कर दें
  rationale: यह रूप अत्यंत कठिन और अनिश्चित है। प्रसंग में शत्रुतापूर्ण दमन या विनाश का संकल्प स्पष्ट है; ‘दमन कर दें’ इस भाव को व्यक्त करता है, जबकि पादटिप्पणी अन्य सम्भव अर्थों को सुरक्षित रखती है।
- source_word: יָחַד
  choice: एक साथ
  rationale: यह क्रियाविशेषण सामूहिकता अथवा समग्रता का भाव देता है। ‘उन सबका एक साथ’ प्रसंग में व्यापक शत्रुतापूर्ण इरादे को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: שָׂרְפוּ
  choice: जला दिया
  rationale: क़ाल पूर्ण रूप का सीधा अर्थ ‘जलाया’ है। ‘जला दिया’ हिन्दी में पूर्ण की गई विनाशकारी कार्रवाई को स्वाभाविक रूप से व्यक्त करता है।
- source_word: כָּל מוֹעֲדֵי אֵל
  choice: परमेश्वर के सभी सभा-स्थानों
  rationale: מוֹעֵד नियत समय, सभा या नियत मिलन-स्थान का बोध करा सकता है। ‘जला दिया’ और ‘देश में’ के कारण यहाँ स्थानवाचक अर्थ अधिक सम्भावित है। ‘सभा-स्थान’ बाद के ऐतिहासिक संस्थान ‘आराधनालय’ को अनावश्यक रूप से आरोपित नहीं करता।
- source_word: בָּאָרֶץ
  choice: देश में
  rationale: इस प्रसंग में אֶרֶץ से इस्राएल का देश अभिप्रेत होना अधिक स्वाभाविक है; ‘देश में’ आधुनिक हिन्दी में स्पष्ट और संक्षिप्त है।
theological_decisions:
- issue: कठिन रूप נִינָם का अर्थ
  choice: दमन करने की शत्रुतापूर्ण मंशा
  alternative: कुचल देना; नष्ट कर देना; वश में कर लेना; किसी संज्ञा पर आधारित भिन्न वाक्य-विन्यास
  rationale: शब्द का रूप और अर्थ अनिश्चित है, पर निकट प्रसंग व्यापक विनाश की मंशा दिखाता है। मुख्य पाठ में सम्भावित अर्थ दिया गया है और पादटिप्पणी में वास्तविक अनिश्चितता स्पष्ट रखी गई है।
- issue: מוֹעֲדֵי אֵל का स्थानवाचक या कालवाचक अर्थ
  choice: परमेश्वर को समर्पित सभा-स्थान
  alternative: परमेश्वर के नियत समय या पर्व; परमेश्वर की सभाएँ; परमेश्वर के आराधनालय
  rationale: जिन वस्तुओं को जलाया गया और जो ‘देश में’ स्थित हैं, उनके लिए स्थानवाचक अर्थ सबसे संगत है। फिर भी मוֹעֵד की व्यापक अर्थ-सीमा पादटिप्पणी में सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘अपने मन में’ तथा ‘सभा-स्थान’ सामान्य पाठक के लिए बोधगम्य हैं। कठिन इब्रानी रूप और מוֹעֵד की अर्थगत बहुलता को मुख्य पाठ में कृत्रिम रूप से निश्चित करने के बजाय पादटिप्पणियों में स्पष्ट किया गया है।
