  yaml_path: translation/ot/psalms/074/000.yaml
  text: A Maskil of Asaph. Why[a], God, have you rejected us forever? Why does your anger smoke against the sheep of your pasture?
translation:
  language: hi
  text: 'आसाफ का मस्कील[a]।


    हे परमेश्वर, आपने हमें सदा के लिए क्यों त्याग दिया? आपके चरागाह की भेड़ों के विरुद्ध आपका क्रोध धुएँ की तरह क्यों उठ रहा है?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “मस्कील” भजन के शीर्षक में प्रयुक्त एक तकनीकी शब्द है; संभव है कि यह मननपूर्ण या शिक्षाप्रद रचना को दर्शाता हो।
    reason: lexical_alternative
lexical_decisions:
- source_word: מַשְׂכִּיל
  choice: मस्कील
  rationale: यह भजन-शीर्षक का एक तकनीकी शब्द है, जिसका सटीक अर्थ अनिश्चित है; लिप्यंतरण उस अनिश्चितता को बनाए रखता है और पादटिप्पणी संभावित अर्थ बताती है।
- source_word: זָנַחְתָּ
  choice: आपने हमें ... त्याग दिया
  rationale: क्रिया का अर्थ ‘त्याग देना/अस्वीकार करना’ है। इब्रानी में कर्म व्यक्त नहीं है, पर सामुदायिक विलाप के संदर्भ में ‘हमें’ स्वाभाविक और निहित है।
- source_word: יֶעְשַׁן אַפְּךָ
  choice: आपका क्रोध धुएँ-सा ... उठ रहा है
  rationale: मूल की धुएँ वाली सजीव उपमा को बनाए रखते हुए आधुनिक हिन्दी में स्वाभाविक अभिव्यक्ति दी गई है।
- source_word: צֹאן מַרְעִיתֶךָ
  choice: आपकी चरागाह की भेड़ें
  rationale: शाब्दिक चरवाहा-रूपक को स्पष्ट और सहज हिन्दी में सुरक्षित रखा गया है।
theological_decisions:
- issue: भजनकार द्वारा परमेश्वर से सीधे प्रश्न
  choice: दोनों तीखे ‘क्यों’ प्रश्न यथावत रखे गए
  alternative: प्रश्नों को विनम्र निवेदन या व्याख्यात्मक कथन बनाना
  rationale: मूल पाठ का विलाप, तनाव और परमेश्वर से सीधा प्रतिवाद धार्मिक रूप से महत्त्वपूर्ण है; इसे नरम नहीं किया जाना चाहिए।
- issue: त्यागे जाने की अवधि
  choice: ‘सदा के लिए’
  alternative: ‘इतने लंबे समय से’
  rationale: לָנֶצַח का सीधा अर्थ स्थायी/सदा के लिए है; विलाप की अतिशयोक्तिपूर्ण अनुभूति को बिना समाधान दिए रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली अपनाई गई है। परमेश्वर के लिए आदरसूचक ‘आप’ का प्रयोग किया गया है। मूल के चरवाहा और धुएँ के बिंब सुरक्षित रखे गए हैं।
