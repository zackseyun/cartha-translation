lexical_decisions:
- source_word: וְעַת
  choice: और अब
  rationale: संयोजक और कालवाचक क्रियाविशेषण पिछले पद से प्रवाह बनाए रखते हुए विनाश के वर्तमान दृश्य की ओर मोड़ते हैं।
- source_word: פִּתּוּחֶיהָ
  choice: उसकी सारी नक्काशी
  rationale: यह शब्द उकेरे हुए सजावटी काम के सामूहिक अर्थ में है; स्त्रीलिंग प्रत्यय पहले वर्णित पवित्रस्थान की ओर संकेत करता है।
- source_word: יַחַד
  choice: सारी
  rationale: यहाँ सामूहिकता या समग्रता का भाव स्वाभाविक हिन्दी में संज्ञा के साथ ‘सारी’ द्वारा व्यक्त किया गया है; अलग से ‘एक साथ’ जोड़ने पर साधनों के साथ अनचाहा संबंध और अनावश्यक पुनरुक्ति हो सकती है।
- source_word: בְּכַשִּׁיל
  choice: कुल्हाड़ी से
  rationale: यह लकड़ी काटने या तराशने के औज़ार का नाम है। ‘कुल्हाड़ी’ सामान्य पाठक के लिए स्पष्ट है, यद्यपि औज़ार का सटीक आधुनिक समकक्ष अनिश्चित है।
- source_word: וְכֵילַפּוֹת
  choice: और हथौड़ों से
  rationale: यह बहुवचन में प्रहार करने वाले औज़ारों को दर्शाता है। ‘हथौड़े’ सुलभ और प्रसंगानुकूल है, पर सटीक प्रकार निश्चित नहीं है।
- source_word: יַהֲלֹמוּן
  choice: वे तोड़ डालते हैं
  rationale: क्रिया ज़ोर से प्रहार करने का बोध देती है; विनाश के इस प्रसंग में ‘तोड़ डालते हैं’ बल और परिणाम दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
