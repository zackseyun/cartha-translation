  yaml_path: translation/ot/psalms/074/002.yaml
  text: Remember your congregation[a], which you acquired long ago, which you redeemed as the tribe of your inheritance—Mount Zion[d][c][b], this mountain where you dwelled.
translation:
  language: hi
  text: अपनी मण्डली को स्मरण कर, जिसे तूने बहुत पहले अपने अधिकार में लिया था; तेरी विरासत के गोत्र को, जिसे तूने छुड़ाया था—सिय्योन का यह पर्वत, जहाँ तूने निवास किया था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זְכֹר
  choice: स्मरण कर
  rationale: यह परमेश्वर से की गई सीधी विनती के रूप में पुल्लिंग एकवचन आज्ञार्थक क्रिया है। ‘स्मरण कर’ प्रार्थना और विलाप की गरिमा बनाए रखता है।
- source_word: עֲדָתְךָ
  choice: अपनी मण्डली
  rationale: यह शब्द एकत्र समुदाय, विशेषतः वाचा के लोगों, को सामूहिक रूप से दर्शाता है। ‘मण्डली’ हिन्दी में इस सामुदायिक अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: קָנִיתָ קֶּדֶם
  choice: प्राचीनकाल में अपना बनाया था
  rationale: קנה यहाँ लोगों को अपने अधिकार और निज भाग के रूप में ग्रहण करने का भाव देता है; ‘अपना बनाया’ व्यापारिक अर्थ को अनावश्यक रूप से प्रमुख किए बिना इसे व्यक्त करता है। קדם का प्राचीन समय-संबंधी भाव ‘प्राचीनकाल में’ से स्पष्ट होता है।
- source_word: גָּאַלְתָּ
  choice: छुड़ाया था
  rationale: גאל निकट संबंधी द्वारा छुड़ाने और परमेश्वर की उद्धारकारी मुक्ति का प्रमुख शब्द है। ‘छुड़ाया’ सामान्य आधुनिक हिन्दी में स्पष्ट रहते हुए उस अर्थ को सुरक्षित रखता है।
- source_word: שֵׁבֶט נַחֲלָתֶךָ
  choice: अपने निज भाग के गोत्र
  rationale: שבט के सम्भव अर्थों में यहाँ लोगों के सामूहिक सन्दर्भ के कारण ‘गोत्र’ सर्वाधिक संगत है। נַחֲלָה को ‘निज भाग’ कहना उन लोगों के परमेश्वर के अपने अधिकार में होने का भाव रखता है।
- source_word: הַר צִיּוֹן זֶה
  choice: सिय्योन के इस पर्वत को
  rationale: זֶה का संकेतवाचक बल बनाए रखते हुए हिन्दी की स्वाभाविक पदरचना अपनाई गई है। वाक्य में इसे ‘स्मरण कर’ की विनती के दूसरे लक्ष्य के रूप में पढ़ा गया है।
- source_word: שָׁכַנְתָּ בּוֹ
  choice: जहाँ तूने निवास किया था
  rationale: שכן बसने या निवास करने को दर्शाता है और यहाँ परमेश्वर की सिय्योन में उपस्थिति से जुड़ा है। भूतकालीन पूर्ण क्रिया का सरल और स्वाभाविक हिन्दी रूप चुना गया है।
theological_decisions:
- issue: קָנִיתָ को सृष्टि, खरीद या वाचागत अधिकार ग्रहण करने के अर्थ में समझना
  choice: परमेश्वर ने प्राचीनकाल में इस्राएल को अपने लोग बनाया
  alternative: रचा; मोल लिया; प्राप्त किया
  rationale: समानान्तर क्रिया ‘छुड़ाया’ और कर्म ‘मण्डली’ ऐतिहासिक रूप से लोगों को अपना बनाने की ओर संकेत करते हैं। फिर भी शब्द के व्यापक अर्थों को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: שֵׁבֶט का अर्थ गोत्र या राजदण्ड/लाठी
  choice: गोत्र
  alternative: राजदण्ड; लाठी
  rationale: मण्डली और छुड़ाए गए लोगों के समानान्तर सन्दर्भ में जनसमूह का अर्थ सबसे अधिक संगत है; राजकीय प्रतीक का अर्थ सन्दर्भ में कम सम्भावित है।
- issue: הַר צִיּוֹן זֶה का वाक्यगत सम्बन्ध
  choice: स्मरण करने योग्य दूसरे स्थान-सन्दर्भ के रूप में ‘सिय्योन के इस पर्वत को’
  alternative: छुड़ाए गए गोत्र के साथ सीधा समानाधिकरण
  rationale: हिब्रू काव्य-संरचना संक्षिप्त और कुछ हद तक खुली है। चुना गया हिन्दी रूप मण्डली/गोत्र और परमेश्वर के निवास-स्थान दोनों को विनती में रखता है, जबकि संकेतवाचक ‘इस’ को नहीं हटाता।
translation_notes:
  register: आधुनिक मानक हिन्दी में प्रार्थनात्मक और काव्यात्मक गरिमा रखी गई है। परमेश्वर के लिए एकवचन आत्मीय सम्बोधन ‘तू’ प्रयुक्त है। ‘मण्डली,’ ‘निज भाग,’ और ‘निवास’ जैसे शब्द बाइबलीय सन्दर्भ को बनाए रखते हैं, पर वाक्यरचना सामान्य पाठक के लिए स्पष्ट रखी गई है।
