id: PSA.74.21
reference: Psalms 74:21
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אַל יָשֹׁ֣ב דַּ֣ךְ נִכְלָ֑ם עָנִ֥י וְ֝/אֶבְי֗וֹן יְֽהַלְל֥וּ שְׁמֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/021.yaml
  text: Do not let the oppressed turn back ashamed[b][a]; let the poor and needy praise your name.
translation:
  language: hi
  text: कुचला हुआ व्यक्ति लज्जित होकर न लौटे[a][b]; दीन और ज़रूरतमंद तेरे नाम की स्तुति करें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उत्पीड़ित’ अथवा ‘दबा-कुचला व्यक्ति’।
    reason: lexical_alternative
  - marker: b
    text: या ‘अपमानित होकर’; इब्रानी में सार्वजनिक रूप से नीचा दिखाए जाने का भाव भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל יָשֹׁב
  choice: न लौटे
  rationale: निषेधवाचक אַל और अपूर्ण/इच्छार्थक יָשֹׁב मिलकर प्रार्थनापूर्ण विनती व्यक्त करते हैं। ‘न लौटे’ मूल की संक्षिप्तता और इच्छार्थक भाव बनाए रखता है।
- source_word: דַּךְ
  choice: कुचला हुआ व्यक्ति
  rationale: शब्द का मूल बिंब दबाए या कुचले गए व्यक्ति का है; यह सामाजिक उत्पीड़न और व्यक्तिगत दुर्दशा दोनों के लिए खुला रहता है।
- source_word: נִכְלָם
  choice: लज्जित होकर
  rationale: כלם का निष्क्रिय रूप लज्जित या अपमानित किए जाने का भाव रखता है। मुख्य पाठ में स्वाभाविक हिन्दी रखी गई है और सार्वजनिक अपमान की सम्भावित छाया पादटिप्पणी में दी गई है।
- source_word: עָנִי
  choice: दीन
  rationale: यह शब्द निर्धन, दुःख उठाने वाले या दबे हुए व्यक्ति को सूचित कर सकता है। אֶבְיוֹן के साथ युग्म में ‘दीन’ अर्थ-भेद और भजन-संगत गरिमा बनाए रखता है।
- source_word: אֶבְיוֹן
  choice: ज़रूरतमंद
  rationale: यह अभावग्रस्त या सहायता के मोहताज व्यक्ति को दर्शाता है; ‘ज़रूरतमंद’ आधुनिक हिन्दी में स्पष्ट है और עָנִי से भेद बनाए रखता है।
- source_word: יְהַלְלוּ
  choice: स्तुति करें
  rationale: पिएल अपूर्ण/इच्छार्थक रूप प्रार्थनापूर्ण कामना व्यक्त करता है; ‘स्तुति करें’ हिन्दी में उसी भाव को स्वाभाविक रूप से देता है।
- source_word: שְׁמֶךָ
  choice: तेरे नाम की
  rationale: ‘नाम’ परमेश्वर के प्रकट चरित्र और प्रतिष्ठा का अर्थसमृद्ध बाइबलीय कथन है, इसलिए इसे परिभाषित करके सीमित नहीं किया गया।
theological_decisions:
- issue: अंतिम उपवाक्य का पहले उपवाक्य से सम्बन्ध
  choice: 'दोनों को समानांतर प्रार्थनापूर्ण विनतियों के रूप में रखा गया है: वह लज्जित न लौटे; वे स्तुति करें।'
  alternative: 'अंतिम उपवाक्य को छुटकारे का स्पष्ट परिणाम मानना: ‘ताकि दीन और ज़रूरतमंद...’।'
  rationale: इब्रानी इच्छार्थक क्रम परिणाम का संकेत दे सकता है, पर स्पष्ट उद्देश्यसूचक संयोजक नहीं है। इसलिए अनुवाद सम्भावित सम्बन्ध को खुला रखता है और कारणात्मकता नहीं जोड़ता।
- issue: דַּךְ का सामाजिक या अनुभवात्मक अर्थ
  choice: ‘कुचला हुआ व्यक्ति’—ऐसा रूप जो उत्पीड़न और विपत्ति दोनों के लिए खुला है।
  alternative: केवल सामाजिक अर्थ वाला ‘उत्पीड़ित’ या केवल आर्थिक अर्थ वाला ‘गरीब’।
  rationale: मूल शब्द की व्यापकता को किसी एक प्रकार की दुर्दशा तक सीमित नहीं किया गया।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। परमेश्वर के लिए भजन की प्रत्यक्ष प्रार्थना के अनुरूप आत्मीय एकवचन ‘तेरे’ रखा गया है। ‘कुचला हुआ व्यक्ति’ मूल बिंब को बचाता है; पादटिप्पणियाँ उसके प्रमुख वैकल्पिक अर्थ स्पष्ट करती हैं।
