  text: They set your sanctuary on fire[c][b][a]; they profaned the dwelling place of your name to the ground.
translation:
  language: hi
  text: उन्होंने तेरे पवित्रस्थान में आग लगा दी[a]; उन्होंने तेरे नाम के निवासस्थान को धरती तक अपवित्र कर डाला[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उन्होंने तेरे पवित्रस्थान में आग भेजी”; इब्रानी प्रयोग का अर्थ है कि उन्होंने उसे जला दिया।
    reason: lexical_alternative
  - marker: b
    text: “तेरे नाम के निवासस्थान” से आशय उस स्थान से है जिसे परमेश्वर ने अपनी उपस्थिति प्रकट करने के लिए चुना था।
    reason: cultural_note
lexical_decisions:
- source_word: שִׁלְחוּ בָאֵשׁ
  choice: आग लगा दी
  rationale: शाब्दिक रूप से ‘आग भेजी’ है, पर इस इब्रानी प्रयोग का आशय किसी स्थान को जलाना है; आधुनिक हिन्दी में ‘आग लगा दी’ स्वाभाविक और सटीक है।
- source_word: מִקְדָּשֶׁךָ
  choice: तेरे पवित्रस्थान
  rationale: מִקְדָּשׁ का मूल अर्थ पवित्र या समर्पित स्थान है। ‘पवित्रस्थान’ इस अर्थ को बनाए रखता है और इसे समय से पहले केवल ‘मन्दिर’ तक सीमित नहीं करता।
- source_word: לָאָרֶץ
  choice: भूमि तक
  rationale: इस पद में यह वाक्यांश अपवित्रीकरण की चरम सीमा या पूर्ण अपमान व्यक्त करता है। ‘भूमि तक’ मूल बिंब को बनाए रखता है।
- source_word: חִלְּלוּ
  choice: अपवित्र कर दिया
  rationale: पिएल रूप किसी पवित्र वस्तु का अपमान करके उसे अपवित्र करने को व्यक्त करता है; ‘अपवित्र कर दिया’ सामान्य आधुनिक हिन्दी में स्पष्ट है।
- source_word: מִשְׁכַּן שְׁמֶךָ
  choice: तेरे नाम के निवासस्थान
  rationale: यह शब्दशः ‘तेरे नाम का निवासस्थान’ है। यह परमेश्वर की चुनी हुई उपस्थिति से जुड़ी महत्वपूर्ण बाइबलीय अभिव्यक्ति को सुरक्षित रखता है।
theological_decisions:
- issue: מִקְדָּשׁ और מִשְׁכַּן के बीच भेद
  choice: ‘पवित्रस्थान’ और ‘निवासस्थान’—दो अलग पद
  alternative: दोनों के लिए ‘मन्दिर’ या ‘पवित्रस्थान’
  rationale: इब्रानी में दो अलग किंतु संबंधित शब्द हैं। अलग हिन्दी पद स्थान की पवित्रता और परमेश्वर के नाम के निवास—दोनों पहलुओं को बनाए रखते हैं।
- issue: ‘तेरे नाम के निवासस्थान’ की धर्मवैज्ञानिक अभिव्यक्ति
  choice: मूल नाम-संबंधी मुहावरे को बनाए रखना
  alternative: ‘तेरा निवासस्थान’ या ‘वह स्थान जहाँ तू रहता है’
  rationale: मूल पाठ परमेश्वर को भवन में सीमित नहीं करता, बल्कि उसके ‘नाम’ के निवास की बात करता है। अनुवाद इस तनाव को सरल बनाकर समाप्त नहीं करता।
- issue: לָאָרֶץ का वाक्यगत संबंध
  choice: इसे अपवित्र करने की क्रिया की सीमा के रूप में प्रस्तुत करना
  alternative: इसे भवन को ढा देने का स्पष्ट कथन बनाना
  rationale: इब्रानी पदक्रम में कुछ काव्यात्मक तनाव है; अनुवाद ‘भूमि तक अपवित्र’ रखता है और ऐसी भौतिक ध्वंस-व्याख्या नहीं जोड़ता जो क्रिया חִלְּלוּ में स्पष्टतः नहीं है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। परमेश्वर को संबोधन में काव्यात्मक ‘तेरे’ रखा गया है। ‘पवित्रस्थान’ और ‘निवासस्थान’ मूल के दो अलग शब्दों तथा समानांतरता को सुरक्षित रखते हैं।
