  language: hi
  text: 'अपनी पंडुकी के प्राण जंगली पशु के हवाले न कर;

    अपने दीन जनों के प्राणों को सदा के लिए न भूल।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या संभवतः: अपने दीन जनों की मंडली को सदा के लिए न भूल।'
    reason: חַיַּת עֲנִיֶּיךָ असामान्य और अर्थ की दृष्टि से कठिन पदबंध है। मुख्य पाठ इसे ‘तेरे दीन जनों का जीवन/प्राण’ समझता है; कुछ व्याख्याएँ इसे उनके जीवित समुदाय या मंडली के अर्थ में लेती हैं।
lexical_decisions:
- source_word: תּוֹרֶךָ
  choice: अपनी पंडुकी
  rationale: תּוֹר का मूल अर्थ ‘पंडुकी/फाख्ता’ है; यहाँ यह परमेश्वर के असहाय लोगों के लिए स्नेहपूर्ण रूपक है। ‘पंडुकी’ रूपक को स्पष्ट किए बिना सुरक्षित रखता है।
- source_word: לְחַיַּת
  choice: हिंसक पशु के हवाले
  rationale: חַיָּה का अर्थ जंगली पशु है। प्रसंग में वह शिकार करने वाला शत्रु है, इसलिए ‘हिंसक पशु’ स्वाभाविक और संदर्भानुकूल है; ‘के हवाले’ תִּתֵּן के सुपुर्द कर देने के भाव को व्यक्त करता है।
- source_word: נֶפֶשׁ
  choice: प्राण
  rationale: यहाँ נֶפֶשׁ जीवित प्राणी के जीवन/प्राण को दर्शाता है। ‘प्राण’ काव्यात्मक गरिमा और जीवन-संकट दोनों बनाए रखता है।
- source_word: עֲנִיֶּיךָ
  choice: अपने दीन जनों
  rationale: עָנִי पीड़ित, दबे हुए या निर्धन व्यक्ति को सूचित कर सकता है। ‘दीन जन’ अर्थ-परास को अनावश्यक रूप से केवल आर्थिक गरीबी तक सीमित नहीं करता।
- source_word: חַיַּת עֲנִיֶּיךָ
  choice: अपने दीन जनों के प्राण
  rationale: शाब्दिक संरचना एक सामूहिक एकवचन ‘तेरे दीन जनों का जीवन/प्राण’ हो सकती है। हिन्दी में बहुवचन जनसमूह के साथ ‘प्राण’ स्वाभाविक है और प्रत्येक पीड़ित व्यक्ति के जीवन की चिंता व्यक्त करता है।
theological_decisions:
- issue: ‘पंडुकी’ की पहचान
  choice: रूपक को पाठ में यथावत रखा गया
  alternative: इसे सीधे ‘तेरे लोग’ के रूप में स्पष्ट करना
  rationale: मूल काव्य परमेश्वर के लोगों को असहाय पंडुकी के रूप में चित्रित करता है। सीधे अर्थ खोल देने से मूल की काव्यात्मकता और जानबूझकर रखा गया रूपक मिट जाता।
- issue: חַיַּת के दोनों प्रयोगों का संबंध
  choice: पहले को ‘पशु’ और दूसरे को ‘प्राण’ माना गया
  alternative: दोनों स्थानों पर एक ही अर्थ लेना
  rationale: 'एक ही व्यंजन-रूप यहाँ शब्दालंकार उत्पन्न करता है, पर वाक्य-विन्यास और समांतरता अलग अर्थों की माँग करते हैं: पंडुकी को पशु को न सौंपना और दीन जनों के जीवन को न भूलना।'
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी अपनाई गई है। आज्ञार्थक निषेध की तीव्रता ‘न कर’ और ‘न भूल’ से रखी गई है। ‘पंडुकी’ तथा ‘प्राण’ भजन की काव्यात्मक छवि को बनाए रखते हैं, जबकि ‘हिंसक पशु के हवाले’ साधारण पाठक के लिए खतरे का भाव स्पष्ट करता है।
