id: PSA.74.20
reference: Psalms 74:20
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: הַבֵּ֥ט לַ/בְּרִ֑ית כִּ֥י מָלְא֥וּ מַחֲשַׁכֵּי אֶ֝֗רֶץ נְא֣וֹת חָמָֽס־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/020.yaml
  text: Look to the covenant[c][b][a], for the dark places of the land are full of haunts of violence.
translation:
  language: hi
  text: वाचा[a] की ओर दृष्टि कर, क्योंकि देश[b] के अंधकारमय स्थान हिंसा के बसेरों[c] से भरे हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अपनी वाचा की ओर।’ इब्रानी में शाब्दिक रूप से ‘वाचा’ है; संदर्भ में आशय परमेश्वर की अपने लोगों के साथ वाचा से है।
    reason: alternative_reading
  - marker: b
    text: या ‘पृथ्वी।’ इब्रानी शब्द का अर्थ संदर्भ के अनुसार ‘देश’ या ‘पृथ्वी’ हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: या ‘निवास-स्थानों’ अथवा ‘ठिकानों।’
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבֵּט
  choice: दृष्टि कर
  rationale: नבט के आज्ञार्थक रूप में परमेश्वर से किसी बात की ओर ध्यान देने की प्रार्थनापूर्ण विनती है। ‘दृष्टि कर’ मूल के दृश्य बिंब और भजन की गरिमा दोनों को बनाए रखता है।
- source_word: לַבְּרִית
  choice: वाचा की ओर
  rationale: בְּרִית के लिए प्रचलित और धर्मशास्त्रीय रूप से तटस्थ शब्द ‘वाचा’ है। इब्रानी में निश्चित पद है, पर ‘तेरी’ जैसा स्पष्ट संबंधसूचक सर्वनाम नहीं है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पहले निवेदन का कारण प्रस्तुत करता है; आधुनिक हिन्दी में ‘क्योंकि’ इस कारण-संबंध को स्पष्ट और स्वाभाविक बनाता है।
- source_word: מָלְאוּ
  choice: से भरे हैं
  rationale: कालरूप भर जाने के फलस्वरूप वर्तमान दशा व्यक्त करता है; ‘से भरे हैं’ इस अवस्था को सहज हिन्दी में प्रकट करता है।
- source_word: מַחֲשַׁכֵּי אֶרֶץ
  choice: देश के अंधकारमय स्थान
  rationale: शाब्दिक अर्थ ‘देश/पृथ्वी के अंधकारमय स्थान’ है। भजन में सिय्योन और देश की उजाड़ दशा निकट संदर्भ है, इसलिए मुख्य पाठ में ‘देश’ चुना गया है।
- source_word: נְאוֹת
  choice: बसेरे
  rationale: נָוֶה निवास, बसेरा या चरागाह का स्थान बता सकता है। ‘हिंसा के बसेरे’ स्थानवाचक अर्थ और काव्यात्मक प्रभाव को रखता है, बिना यह निश्चित किए कि हिंसा स्वयं निवासी है या हिंसक लोग वहाँ बसे हैं।
- source_word: חָמָס
  choice: हिंसा
  rationale: חָמָס हिंसा, अत्याचार या हिंसक अन्याय को सूचित करता है। यहाँ ‘हिंसा’ इसका सीधा और व्यापक हिन्दी समतुल्य है।
theological_decisions:
- issue: क्या वाचा को स्पष्ट रूप से परमेश्वर की वाचा कहा जाए
  choice: वाचा
  alternative: तेरी वाचा
  rationale: संदर्भ में वाचा परमेश्वर और उसके लोगों की है, फिर भी इब्रानी पाठ में संबंधसूचक प्रत्यय नहीं, बल्कि केवल निश्चित पद है। इसलिए मुख्य पाठ स्रोत की अनिर्दिष्टता रखता है और वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- issue: אֶרֶץ का क्षेत्र
  choice: देश
  alternative: पृथ्वी
  rationale: तात्कालिक विलाप देश और सिय्योन की तबाही पर केंद्रित है, पर इब्रानी शब्द का व्यापक अर्थ ‘पृथ्वी’ भी हो सकता है; इस संभावना को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, प्रार्थनापूर्ण और काव्यात्मक रखी गई है। ‘दृष्टि कर’ भजन की गरिमा बनाए रखता है, जबकि वाक्यरचना सामान्य हिन्दी पाठक के लिए स्पष्ट है। ‘हिंसा के बसेरे’ मूल के स्थानवाचक बिंब और उसकी हल्की अर्थगत अस्पष्टता को सुरक्षित रखता है।
