  text: A Maskil of Asaph. Why[a], O God, have you rejected us forever? Why does your anger smoke against the sheep of your pasture?
translation:
  language: hi
  text: 'आसाफ़ का मसकील।[a]

    हे परमेश्वर, आपने हमें सदा के लिए क्यों ठुकरा दिया है? आपके चरागाह की भेड़ों के विरुद्ध आपका क्रोध क्यों धुआँ उठा रहा है?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “मसकील” भजन के शीर्षक में प्रयुक्त एक तकनीकी शब्द है; संभवतः इसका अर्थ मननशील या शिक्षाप्रद रचना है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מַשְׂכִּיל
  choice: मसकील
  rationale: यह भजन के शीर्षक में प्रयुक्त एक तकनीकी और अनिश्चित अर्थ वाला शब्द है। लिप्यंतरण इसके अर्थ को अनावश्यक रूप से निश्चित नहीं करता; संभावित अर्थ पादटिप्पणी में दिए गए हैं।
- source_word: לְאָסָף
  choice: आसाफ़ का
  rationale: उपसर्ग לְ यहाँ रचनाकार, संबंध या समर्पण सूचित कर सकता है। हिंदी शीर्षक में “आसाफ़ का” स्वाभाविक है और संबंध की सटीक प्रकृति को खुला रखता है।
- source_word: לָמָה
  choice: क्यों
  rationale: विलाप के सीधे प्रश्न के लिए सरल और स्वाभाविक हिंदी।
- source_word: אֱלֹהִים
  choice: हे परमेश्वर
  rationale: यह प्रत्यक्ष संबोधन है; “हे” प्रार्थनापूर्ण संबोधन को स्पष्ट करता है।
- source_word: זָנַחְתָּ
  choice: आपने हमें ... ठुकरा दिया है
  rationale: क्रिया त्यागने या अस्वीकार करने का भाव रखती है। “ठुकरा दिया” सामुदायिक विलाप की तीव्रता को सहज आधुनिक हिंदी में व्यक्त करता है।
- source_word: לָנֶצַח
  choice: सदा के लिए
  rationale: यह विलाप में अंतहीन या ऐसा प्रतीत होने वाला दीर्घकाल व्यक्त करता है।
- source_word: יֶעְשַׁן
  choice: धुआँ उठा रहा है
  rationale: मूल धूम्र-चित्र को बनाए रखा गया है, न कि उसे केवल “भड़क रहा है” जैसे अर्थ में समतल किया गया।
- source_word: אַפְּךָ
  choice: आपका क्रोध
  rationale: शाब्दिक रूप से नाक/नथुना होने पर भी यह इब्रानी मुहावरे में क्रोध दर्शाता है; धुएँ की संगति मूल बिंब का अंश बनाए रखती है।
- source_word: בְּצֹאן מַרְעִיתֶךָ
  choice: आपके चरागाह की भेड़ों के विरुद्ध
  rationale: यह परमेश्वर की प्रजा के लिए ठोस चरवाही रूपक को सुरक्षित रखता है; בְּ का प्रसंगगत विरोधी भाव “के विरुद्ध” से व्यक्त होता है।
theological_decisions:
- issue: זָנַחְתָּ में प्रथम पुरुष बहुवचन कर्म का पाठ और सामुदायिक विलाप
  choice: आपने हमें ... ठुकरा दिया है
  alternative: आपने [अपनी प्रजा को] ठुकरा दिया है
  rationale: मसोरेटिक पाठ और प्रसंग प्रथम पुरुष बहुवचन कर्म “हमें” की माँग करते हैं। “अपनी प्रजा” कहना अर्थ-संगत होते हुए भी अनावश्यक व्याख्यात्मक विस्तार होता।
- issue: בְּצֹאן מַרְעִיתֶךָ में परमेश्वर की प्रजा का रूपक
  choice: आपके चरागाह की भेड़ें
  alternative: आपका झुंड
  rationale: “भेड़ें” और “चरागाह” दोनों मूल के विस्तृत चरवाही बिंब को बनाए रखते हैं और रूपक को स्पष्ट व्याख्या में नहीं बदलते।
translation_notes:
  register: आधुनिक मानक हिंदी में प्रार्थनापूर्ण, गरिमामय और सीधी शैली। परमेश्वर के लिए आदरसूचक बहुवचन क्रियारूप और सर्वनाम प्रयुक्त हैं। शीर्षक के अनिश्चित तकनीकी शब्द को लिप्यंतरित करके उसकी संभावित व्याख्या पादटिप्पणी में रखी गई है।
