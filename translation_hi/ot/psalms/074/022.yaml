id: PSA.74.22
reference: Psalms 74:22
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: קוּמָ֣/ה אֱ֭לֹהִים רִיבָ֣/ה רִיבֶ֑/ךָ זְכֹ֥ר חֶרְפָּתְ/ךָ֥ מִנִּי נָ֝בָ֗ל כָּל הַ/יּֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/022.yaml
  text: Rise up[a], O God; plead your case[b]. Remember your reproach from the fool all day long.
translation:
  language: hi
  text: हे परमेश्वर, उठिए; अपना मुक़दमा लड़िए। याद कीजिए कि मूर्ख[a] दिन भर आपकी निन्दा करता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ “मूर्ख” से आशय केवल कम बुद्धि वाले व्यक्ति से नहीं, बल्कि नैतिक रूप से भ्रष्ट या परमेश्वर-विरोधी व्यक्ति से है।
    reason: cultural_note
lexical_decisions:
- source_word: קוּמָה
  choice: उठिए
  rationale: आग्रहपूर्ण आज्ञार्थक रूप है, जो परमेश्वर से कार्य करने की विनती करता है; आधुनिक हिन्दी में ‘उठिए’ स्वाभाविक और गरिमापूर्ण है।
- source_word: אֱלֹהִים
  choice: हे परमेश्वर
  rationale: प्रत्यक्ष सम्बोधन को प्रार्थनापूर्ण और सामान्य आधुनिक हिन्दी में व्यक्त करता है।
- source_word: רִיבָה רִיבֶךָ
  choice: अपना मुक़दमा लड़िए
  rationale: क्रिया और उसी मूल की संज्ञा कानूनी विवाद की भाषा हैं; यह अभिव्यक्ति न्यायिक रूपक को स्पष्ट और स्वाभाविक हिन्दी में बनाए रखती है।
- source_word: זְכֹר
  choice: याद कीजिए
  rationale: मूल आज्ञार्थक को बिना व्याख्यात्मक विस्तार के सुरक्षित रखता है; प्रार्थना के प्रसंग में इसका आशय ध्यान देकर कार्रवाई करना भी है।
- source_word: חֶרְפָּתְךָ
  choice: आपकी निन्दा
  rationale: यह परमेश्वर के विरुद्ध अपमान या तिरस्कार को दर्शाता है। हिन्दी वाक्य-विन्यास में इसे ‘आपकी निन्दा करता है’ कहना स्रोत और लक्ष्य का सम्बन्ध स्पष्ट करता है।
- source_word: מִנִּי נָבָל
  choice: मूर्ख … करता है
  rationale: מן अपमान के स्रोत को चिह्नित करता है। נָבָל केवल अल्पबुद्धि नहीं, बल्कि नैतिक रूप से भ्रष्ट या भक्तिहीन व्यक्ति का संकेत देता है।
- source_word: כָּל הַיּוֹם
  choice: दिन भर
  rationale: पूरे दिन अथवा लगातार होने का स्वाभाविक हिन्दी मुहावरा है।
theological_decisions:
- issue: ‘आपकी निन्दा’ का लक्ष्य
  choice: निन्दा को सीधे परमेश्वर के विरुद्ध समझते हुए अनुवाद
  alternative: परमेश्वर के लोगों की निन्दा, जिसे उनके साथ परमेश्वर की वाचा-संबंधी पहचान के कारण उसकी निन्दा कहा गया है
  rationale: द्वितीय पुरुष प्रत्यय और ‘अपना मुक़दमा लड़िए’ का समानांतर भाव सीधे परमेश्वर को लक्ष्य मानने का समर्थन करता है। फिर भी पद का अनुवाद व्यापक वाचा-संबंधी अर्थ को नकारने वाला कोई अतिरिक्त स्पष्टीकरण नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी; आदरसूचक क्रियाएँ, प्रार्थनापूर्ण गरिमा और कानूनी रूपक सुरक्षित रखे गए हैं। ‘मुक़दमा लड़िए’ सामान्य पाठक के लिए ‘अपने विवाद का विवाद कीजिए’ जैसे शाब्दिक रूप से अधिक स्वाभाविक है।
