  terminology: ‘परमेश्वर,’ ‘मुक़दमा,’ and ‘निन्दा’ fit the register and communicate the relevant theological and juridical senses. The footnote correctly distinguishes the biblical moral sense of ‘मूर्ख’ from mere lack of intelligence.
