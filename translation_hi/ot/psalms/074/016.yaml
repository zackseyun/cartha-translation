  text: לְ/ךָ֣ י֭וֹם אַף לְ/ךָ֥ לָ֑יְלָה אַתָּ֥ה הֲ֝כִינ֗וֹתָ מָא֥וֹר וָ/שָֽׁמֶשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/016.yaml
  text: The day is yours; the night also is yours[a]. You established the light and the sun.
translation:
  language: hi
  text: दिन तेरा है; रात भी तेरी है। तूने प्रकाश[a] और सूर्य को स्थापित किया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘ज्योति-पिंड’। दिन और रात की समानांतरता के कारण कुछ लोग इसे चंद्रमा का संकेत मानते हैं, पर इब्रानी पाठ में ‘चंद्रमा’ स्पष्ट रूप से नहीं लिखा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לְךָ
  choice: तेरा/तेरी है
  rationale: לְךָ यहाँ अधिकार या स्वामित्व व्यक्त करता है। हिन्दी में लिंग के अनुसार ‘दिन तेरा है’ और ‘रात तेरी है’ स्वाभाविक और बलयुक्त हैं।
- source_word: יוֹם
  choice: दिन
  rationale: לָיְלָה के साथ विरोधी युग्म में इसका सामान्य अर्थ ‘दिन’ है।
- source_word: אַף
  choice: भी
  rationale: 'यह दूसरे खंड को जोड़ते हुए बल देता है: केवल दिन ही नहीं, रात भी परमेश्वर की है।'
- source_word: לָיְלָה
  choice: रात
  rationale: ‘दिन’ के विरोधी युग्म में इसका सामान्य हिन्दी रूप ‘रात’ है।
- source_word: אַתָּה
  choice: तूने
  rationale: इब्रानी में स्पष्ट सर्वनाम कर्ता पर बल देता है। हिन्दी क्रियारूप में ‘तूने’ रखकर यह बल स्वाभाविक रूप से व्यक्त होता है।
- source_word: הֲכִינוֹתָ
  choice: स्थापित किया है
  rationale: हिफ़ील रूप किसी वस्तु को दृढ़ करने, नियत करने या व्यवस्थित रूप से स्थापित करने का भाव देता है; सृष्टि-व्यवस्था के संदर्भ में ‘स्थापित किया है’ उपयुक्त है।
- source_word: מָאוֹר
  choice: प्रकाश
  rationale: מָאוֹר का अर्थ प्रकाश अथवा प्रकाश देने वाला पिंड हो सकता है। अगले पद में सूर्य का अलग उल्लेख होने के कारण ‘प्रकाश’ मूल की व्यापकता और भिन्नता को बनाए रखता है।
- source_word: וָשָׁמֶשׁ
  choice: और सूर्य
  rationale: संयोजक וְ और שֶׁמֶשׁ का सीधा तथा स्वाभाविक हिन्दी अनुवाद।
theological_decisions:
- issue: מָאוֹר का שֶׁמֶשׁ से संबंध
  choice: מָאוֹר को ‘प्रकाश’ अनूदित किया गया है और सूर्य से अलग रखा गया है।
  alternative: दिन-रात की समानांतरता के आधार पर ‘चंद्रमा’, अथवा शाब्दिक विकल्प ‘ज्योति-पिंड’।
  rationale: मूल इब्रानी में ‘चंद्रमा’ स्पष्ट रूप से नहीं है। ‘प्रकाश’ अर्थगत संभावना और काव्यात्मक तनाव को बचाता है तथा संदर्भगत अनुमान को मुख्य पाठ में तथ्य बनाकर प्रस्तुत नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और काव्यात्मक वाक्य-विन्यास रखा गया है। परमेश्वर के लिए एकवचन निकट संबोधन ‘तू’ भजन की सीधी प्रार्थनात्मक वाणी और इब्रानी द्वितीय पुरुष एकवचन के अनुरूप है।
