  yaml_path: translation/ot/psalms/074/004.yaml
  text: Your adversaries roared in the midst of your appointed place[c][b][a]; they set up their own signs as signs.
translation:
  language: hi
  text: तेरे शत्रु तेरे नियत मिलन-स्थान के भीतर गरजे; उन्होंने अपने चिह्नों को चिह्नों के रूप में स्थापित किया।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “नियत मिलन-स्थान” के लिए प्रयुक्त इब्रानी शब्द का अर्थ नियत स्थान, सभा या नियत समय भी हो सकता है; यहाँ प्रसंग सम्भवतः पवित्र मिलन-स्थान का है।
    reason: lexical_alternative
  - marker: b
    text: 'इब्रानी में “चिह्न” शब्द दो बार आया है: शाब्दिक रूप से, “उन्होंने अपने चिह्नों को चिह्नों के रूप में स्थापित किया।” आशय सम्भवतः यह है कि शत्रुओं ने अपने प्रतीकों या ध्वजों को अधिकार अथवा विजय के चिह्नों के रूप में स्थापित कर दिया।'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁאֲגוּ
  choice: गरजे
  rationale: यह क्रिया सिंह की गर्जना और उससे विस्तारित भयावह, हिंसक कोलाहल को व्यक्त करती है; ‘गरजे’ मूल बिंब और तीव्रता को बनाए रखता है।
- source_word: צֹרְרֶיךָ
  choice: तेरे शत्रु
  rationale: सहभागी रूप hostile opponents को दर्शाता है; आधुनिक हिन्दी में ‘शत्रु’ स्वाभाविक और प्रसंगानुकूल है।
- source_word: בְּקֶרֶב מוֹעֲדֶךָ
  choice: तेरे मिलन-स्थान के बीच
  rationale: בְּקֶרֶב स्थान के भीतर/बीच होने पर बल देता है। מוֹעֵד समय, सभा या नियत मिलन-स्थान का अर्थ दे सकता है; मन्दिर-अपवित्रीकरण के प्रसंग में स्थानवाचक ‘मिलन-स्थान’ सबसे स्वाभाविक है, जबकि टिप्पणी में अस्पष्टता सुरक्षित रखी गई है।
- source_word: שָׂמוּ
  choice: लगा दिए
  rationale: שׂים का अर्थ रखना या स्थापित करना है; शत्रुओं द्वारा अपने प्रतीक प्रदर्शित/स्थापित करने के लिए ‘लगा दिए’ सहज हिन्दी है।
- source_word: אוֹתֹתָם אֹתוֹת
  choice: अपने चिह्न ही चिह्न
  rationale: मूल में ‘चिह्न’ शब्द की पुनरावृत्ति है। हिन्दी का ‘ही चिह्न’ विन्यास उस जोर और शत्रुओं के चिह्नों के प्रभुत्व को स्वाभाविक ढंग से व्यक्त करता है, बिना ‘ध्वज’ या ‘विजय-चिह्न’ जैसी अनिश्चित विशिष्टता जोड़े।
theological_decisions:
- issue: मन्दिर के विनाश के विलाप में מוֹעֵד का अर्थ
  choice: 'स्थानवाचक और उपासनात्मक अर्थ: ‘मिलन-स्थान’'
  alternative: नियत समय, सभा, अथवा पर्व
  rationale: आसपास का प्रसंग पवित्र स्थान में शत्रुओं के घुसने और उसे अपवित्र करने का है, इसलिए स्थानवाचक अर्थ सर्वाधिक उपयुक्त है। फिर भी पादटिप्पणी इस शब्द की वास्तविक अर्थ-व्याप्ति को खुला रखती है।
- issue: शत्रुओं के ‘चिह्नों’ का आशय
  choice: सामान्य ‘चिह्न’, जिसकी पुनरावृत्ति पर जोर है
  alternative: ध्वज, निशान, प्रतीक अथवा विजय-चिह्न
  rationale: पद शत्रु के प्रतीकों द्वारा पवित्र स्थान पर अधिकार या विजय जताने का संकेत दे सकता है, पर मूल संज्ञा व्यापक है; इसलिए मुख्य पाठ में उसे अधिक विशिष्ट नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, एकवचन निकट सम्बोधन ‘तेरे’ के साथ, जो इब्रानी के द्वितीय पुरुष एकवचन और भजन की सीधी प्रार्थनात्मक वाणी को बनाए रखता है। भाषा गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखी गई है।
