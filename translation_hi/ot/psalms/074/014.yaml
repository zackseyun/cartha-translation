source:
  edition: WLC
  text: אַתָּ֣ה רִ֭צַּצְתָּ רָאשֵׁ֣י לִוְיָתָ֑ן תִּתְּנֶ֥/נּוּ מַ֝אֲכָ֗ל לְ/עָ֣ם לְ/צִיִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/014.yaml
  text: You crushed the heads of Leviathan[a]; you gave him as food for the creatures of the desert.
translation:
  language: hi
  text: तूने लिव्यातान के सिरों को कुचल डाला; तूने उसे मरुभूमि के जीवों[a] का आहार बना दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मरुभूमि के निवासियों”; या “मरुभूमि के वन्य जीवों।” इब्रानी पद कठिन है और शुष्क प्रदेशों में रहने वाले मनुष्यों अथवा जीवों की ओर संकेत कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: רִצַּצְתָּ
  choice: कुचल डाला
  rationale: क्रिया רצץ हिंसक रीति से तोड़ने या कुचलने का भाव व्यक्त करती है; ‘कुचल डाला’ उसकी तीव्रता को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: רָאשֵׁי
  choice: सिरों को
  rationale: इब्रानी रूप बहुवचन संबंध-सूचक है, इसलिए लिव्यातान के ‘सिरों’ का स्पष्ट बहुवचन सुरक्षित रखा गया है।
- source_word: לִוְיָתָן
  choice: लिव्यातान
  rationale: काव्यात्मक नाम को अनुवादित कर किसी एक व्याख्या तक सीमित करने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: תִּתְּנֶנּוּ
  choice: तूने उसे ... बना दिया
  rationale: נתן का मूल भाव ‘देना’ है; इस वाक्य-विन्यास में ‘आहार बना दिया’ स्वाभाविक हिन्दी है और लिव्यातान के लिए आए एकवचन पुल्लिंग कर्म-प्रत्यय को ‘उसे’ से सुरक्षित रखता है।
- source_word: מַאֲכָל
  choice: आहार
  rationale: מַאֲכָל का अर्थ भोजन या खाने की वस्तु है; ‘आहार’ पद्यात्मक और गरिमापूर्ण हिन्दी में उपयुक्त है।
- source_word: לְעָם לְצִיִּים
  choice: मरुभूमि के जीवों का
  rationale: यह कठिन पदबंध शुष्क प्रदेश के निवासियों अथवा वन्य जीवों की ओर संकेत कर सकता है। मुख्य पाठ में संदर्भानुकूल ‘मरुभूमि के जीवों’ लिया गया है और अन्य संभावनाएँ पाद-टिप्पणी में दी गई हैं।
theological_decisions:
- issue: लिव्यातान की छवि का स्वरूप
  choice: ‘लिव्यातान’ को अनिर्णीत काव्यात्मक-ब्रह्मांडीय छवि के रूप में बनाए रखना
  alternative: इसे केवल वास्तविक समुद्री जीव, पौराणिक दैत्य, मिस्र, या अराजक शक्तियों का निश्चित प्रतीक मानना
  rationale: पद स्वयं इस छवि का आशय किसी एक ऐतिहासिक या तात्त्विक संदर्भ तक सीमित नहीं करता; लिप्यंतरण मूल की व्याख्यात्मक खुली जगह और तनाव को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण काव्यात्मक स्तर रखा गया है। परमेश्वर को संबोधित करते हुए एकवचन ‘तू’ भजन की सीधी, निकट संबोधन-शैली को दर्शाता है।
