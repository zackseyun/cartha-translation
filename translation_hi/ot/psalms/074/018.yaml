  yaml_path: translation/ot/psalms/074/018.yaml
  text: 'Remember this: the enemy has mocked Yahweh[c][b][a], and a foolish people have despised your name.'
translation:
  language: hi
  text: 'यह स्मरण कर: शत्रु ने याहवे का उपहास किया है,[a] और मूर्ख लोगों ने तेरे नाम को तुच्छ जाना है।[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘याहवे की निन्दा की है’ अथवा ‘याहवे को ताना मारा है।’
    reason: lexical_alternative
  - marker: b
    text: यहाँ ‘मूर्ख’ केवल बुद्धि की कमी नहीं, बल्कि नैतिक मूर्खता का भी संकेत देता है। ‘तेरे नाम को तुच्छ जाना है’ का अनुवाद ‘तेरे नाम का तिरस्कार किया है’ या ‘तेरे नाम की निन्दा की है’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: זְכָר זֹאת
  choice: इसे स्मरण रख
  rationale: आज्ञार्थक क्रिया और संकेतवाचक सर्वनाम को प्रार्थनापूर्ण, गरिमापूर्ण तथा स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אוֹיֵב
  choice: शत्रु
  rationale: एकवचन रूप को बनाए रखता है; प्रसंग में यह किसी सामूहिक विरोधी का प्रतिनिधित्व भी कर सकता है।
- source_word: חֵרֵף
  choice: उपहास किया है
  rationale: क्रिया में निंदा, ताना और अपमान का भाव है; ‘उपहास’ आधुनिक हिन्दी में इस तिरस्कारपूर्ण वाणी को स्पष्ट करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी परमेश्वर-नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित नाम-रूप से प्रस्तुत किया गया है।
- source_word: וְעַם נָבָל
  choice: और एक मूर्ख जाति
  rationale: עַם सामूहिक जनसमुदाय है और נָבָל नैतिक-आध्यात्मिक मूर्खता व्यक्त करता है; ‘जाति’ यहाँ लोगों के समुदाय के अर्थ में है।
- source_word: נִאֲצוּ
  choice: तिरस्कार किया है
  rationale: यह घृणापूर्ण अवमानना और ठुकराने का भाव व्यक्त करता है, बिना मुख्य पाठ में अधिक व्याख्यात्मक ‘निन्दा’ या ‘ईशनिन्दा’ आरोपित किए।
- source_word: שְׁמֶךָ
  choice: तेरे नाम
  rationale: मूल का ‘नाम’ सुरक्षित रखता है, जिसमें पहचान, प्रतिष्ठा और प्रकट चरित्र की व्यापक अर्थ-छाया निहित हो सकती है।
theological_decisions:
- issue: יְהוָה परमेश्वर-नाम का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ व्यक्तिगत परमेश्वर-नाम का प्रयोग करता है। उसे उपाधि ‘प्रभु’ से प्रतिस्थापित नहीं किया गया; ‘यहोवा’ हिन्दी बाइबलीय प्रयोग में परिचित लिप्यंतरण है।
- issue: נָבָל का नैतिक अर्थ
  choice: मूर्ख
  alternative: दुष्ट; अधर्मी; विवेकहीन
  rationale: ‘मूर्ख’ मूल की नैतिक और आध्यात्मिक अर्थ-छाया को खुला रखता है; ‘दुष्ट’ या ‘अधर्मी’ मुख्य पाठ में अर्थ को आवश्यकता से अधिक निश्चित कर देते।
- issue: שְׁמֶךָ के तिरस्कार का आशय
  choice: तेरे नाम का तिरस्कार किया है
  alternative: तेरी निन्दा की है; तेरे नाम की ईशनिन्दा की है
  rationale: शाब्दिक ‘नाम’ और अवमानना का भाव रखा गया है, जबकि अधिक विशिष्ट धार्मिक अर्थ को टिप्पणी में विकल्प के रूप में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण प्रार्थना-काव्य रजिस्टर अपनाया गया है। परमेश्वर को संबोधन में ‘तेरे’ मूल के एकवचन निकट संबोधन को बनाए रखता है। वाक्य-संरचना समानांतर इब्रानी पंक्तियों की शक्ति और संक्षिप्तता सुरक्षित रखती है।
