source:
  edition: WLC
  text: לָ֤/מָּה תָשִׁ֣יב יָ֭דְ/ךָ וִֽ/ימִינֶ֑/ךָ מִ/קֶּ֖רֶב חוק/ך כַלֵּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/011.yaml
  text: Why do you hold back your hand[a], your right hand? Draw it out from your bosom and consume them.
translation:
  language: hi
  text: तू अपना हाथ, अपना दाहिना हाथ, क्यों रोके रखता है? उसे अपनी छाती के भीतर से निकालकर उनका अन्त कर दे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल हिब्रू में शाब्दिक क्रम है, “अपनी छाती के भीतर से—अन्त कर दे।” अन्तिम क्रिया का कर्म स्पष्ट नहीं है; “उनका” इस भजन में वर्णित शत्रुओं के संदर्भ से जोड़ा गया है।
    reason: मूल के असामान्य वाक्य-विन्यास और अन्तिम क्रिया के अव्यक्त कर्म को स्पष्ट करना।
lexical_decisions:
- source_word: לָמָּה
  choice: क्यों
  rationale: विलाप में कारण पूछने वाला सामान्य प्रश्नवाचक शब्द।
- source_word: תָשִׁיב
  choice: रोके हुए है
  rationale: हिफ़ील रूप यहाँ हाथ को पीछे रखने या कार्रवाई से रोके रखने का भाव देता है; अगली पंक्ति में हाथ के छाती के पास रहने का चित्र इसी अर्थ को पुष्ट करता है।
- source_word: יָדְךָ
  choice: अपना हाथ
  rationale: मूल ठोस बिंब और ‘दाहिना हाथ’ के साथ काव्यात्मक समानांतरता सुरक्षित रखी गई है।
- source_word: וִימִינֶךָ
  choice: अपना दाहिना हाथ
  rationale: सामर्थ्य और निर्णायक कार्रवाई का ठोस हिब्रू बिंब ज्यों का त्यों रखा गया है।
- source_word: מִקֶּרֶב חֵיקֶךָ
  choice: अपनी छाती से
  rationale: वाक्यांश का आशय वस्त्र की छाती या गोद के भीतर निष्क्रिय रखे हाथ से है; आधुनिक हिन्दी में ‘अपनी छाती से निकाल’ स्वाभाविक और स्पष्ट है।
- source_word: כַלֵּה
  choice: उनका अन्त कर दे
  rationale: पिएल आज्ञार्थक का अर्थ ‘समाप्त कर देना/नष्ट कर देना’ है। मूल में कर्म व्यक्त नहीं है; ‘उनका’ भजन के शत्रुओं के संदर्भ से पूरा किया गया है।
theological_decisions:
- issue: अन्तिम आज्ञार्थक क्रिया का अव्यक्त कर्म
  choice: ‘उनका अन्त कर दे’, जिसमें ‘उनका’ शत्रुओं की ओर संकेत करता है
  alternative: कर्म को अव्यक्त रखते हुए केवल ‘अन्त कर दे’; या संकट/निन्दा को अधिक सामान्य कर्म मानना
  rationale: हिब्रू में कर्म स्पष्ट नहीं है, इसलिए इस अस्पष्टता की सूचना पादटिप्पणी में दी गई है। फिर भी निकटवर्ती संदर्भ परमेश्वर-विरोधी शत्रुओं का है, अतः सहज हिन्दी के लिए ‘उनका’ न्यूनतम संदर्भगत पूर्ति है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी। एकवचन ‘तू’ भजन में परमेश्वर को किए गए सीधे संबोधन और हिब्रू के एकवचन रूप को बनाए रखता है। ‘छाती’ आज की हिन्दी में ‘वक्ष/अंचल’ से अधिक सहज है; ‘अन्त कर दे’ विनाश के अर्थ को स्पष्ट रखते हुए मूल क्रिया की व्यापकता भी बचाता है।
