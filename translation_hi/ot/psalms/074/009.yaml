id: PSA.74.9
reference: Psalms 74:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אֽוֹתֹתֵ֗י/נוּ לֹ֥א רָ֫אִ֥ינוּ אֵֽין ע֥וֹד נָבִ֑יא וְ/לֹֽא אִ֝תָּ֗/נוּ יֹדֵ֥עַ עַד מָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/009.yaml
  text: We do not see our signs; there is no longer any prophet[a], and none among us knows how long.
translation:
  language: hi
  text: 'हम अपने चिन्ह[a] नहीं देखते;

    अब कोई नबी नहीं रहा,

    और हममें से कोई नहीं जानता कि ऐसा कब तक रहेगा।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अपने ध्वज’ अथवा ‘अपने पहचान-चिह्न’; इब्रानी शब्द दिखाई देने वाले चिन्हों या प्रतीकों को व्यक्त कर सकता है, पर यहाँ उसका सटीक संदर्भ स्पष्ट नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹתֹתֵינוּ
  choice: अपने चिन्ह
  rationale: אוֹת का सामान्य अर्थ ‘चिन्ह’ या ‘संकेत’ है। यहाँ उसका सटीक संदर्भ स्पष्ट नहीं है, इसलिए व्यापक और स्वाभाविक शब्द ‘चिन्ह’ रखा गया है।
- source_word: לֹא רָאִינוּ
  choice: नहीं देखते
  rationale: इब्रानी पूर्ण रूप इस विलाप में वर्तमान तक बनी हुई दशा व्यक्त करता है; ‘नहीं देखते’ अनुपस्थिति की तात्कालिकता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אֵין עוֹד
  choice: अब कोई ... नहीं रहा
  rationale: यह पदबंध पहले उपलब्ध रही किसी वस्तु या व्यक्ति के अब न रहने का भाव देता है।
- source_word: נָבִיא
  choice: नबी
  rationale: नָבִיא का प्रचलित और सर्वमान्य हिन्दी बाइबलीय समतुल्य ‘नबी’ है; एकवचन यहाँ सामान्य अर्थ में है।
- source_word: וְלֹא אִתָּנוּ יֹדֵעַ
  choice: और हममें से कोई नहीं जानता
  rationale: अल्पोक्त इब्रानी रचना का अर्थ समुदाय में किसी के भी न जानने से है; ‘हममें से’ אִתָּנוּ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: עַד מָה
  choice: कि ऐसा कब तक रहेगा
  rationale: विलाप के संदर्भ में עַד מָה का अर्थ ‘कब तक’ है। हिन्दी में वाक्य पूरा और सहज बनाने के लिए ‘ऐसा ... रहेगा’ जोड़ा गया है, बिना अवधि निर्धारित किए।
theological_decisions:
- issue: ‘हमारे चिन्हों’ का संदर्भ
  choice: ‘अपने चिन्ह’ कहकर अभिव्यक्ति को व्यापक रखा गया है।
  alternative: ‘अपने ध्वज’ अथवा ‘हमारे बीच परमेश्वर की उपस्थिति के चिन्ह’
  rationale: इब्रानी पाठ यह स्पष्ट नहीं करता कि ये चिन्ह मन्दिर के प्रतीक, उपासना-संबंधी संकेत, परमेश्वर की उपस्थिति के प्रमाण या ध्वज हैं। व्यापक शब्द मूल की अस्पष्टता बनाए रखता है और किसी विशेष ऐतिहासिक पुनर्निर्माण को पाठ पर नहीं थोपता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। काव्यात्मक विलाप की संक्षिप्तता बनाए रखने के लिए पद को तीन पंक्तियों में रखा गया है। ‘नबी’ सामान्य आधुनिक हिन्दी बाइबलीय प्रयोग है।
