lexical_decisions:
- source_word: הָרִימָה
  choice: बढ़ा
  rationale: रום के आज्ञार्थक रूप का פְעָמֶיךָ के साथ प्रयोग परमेश्वर से आगे आने की विनती करता है। हिन्दी में ‘अपने कदम … की ओर बढ़ा’ मूल की गतिशील और मानवरूपी छवि को स्वाभाविक रूप से बनाए रखता है।
- source_word: פְעָמֶיךָ
  choice: अपने कदम
  rationale: פעם यहाँ कदम या पग को दर्शाता है। ‘अपने कदम’ परमेश्वर के उजड़े पवित्रस्थान की ओर आने की सजीव छवि सुरक्षित रखता है।
- source_word: לְמַשֻּׁאוֹת
  choice: खण्डहरों की ओर
  rationale: यह संज्ञा विनाश से उत्पन्न उजड़ी दशा या खण्डहरों को सूचित करती है। ‘खण्डहर’ आधुनिक हिन्दी में ठोस और सहज है; לְ को दिशा-सूचक ‘की ओर’ से व्यक्त किया गया है।
- source_word: נֶצַח
  choice: अनन्त
  rationale: यह खण्डहरों की दीर्घस्थायी या मानो सदा बनी रहने वाली दशा पर बल देता है। ‘अनन्त’ मूल की काव्यात्मक तीव्रता बनाए रखता है।
- source_word: כָּל
  choice: सब कुछ
  rationale: यह शत्रु द्वारा किए गए विनाश की व्यापकता बताता है; ‘सब कुछ’ सहज आधुनिक हिन्दी है।
- source_word: הֵרַע
  choice: उजाड़ दिया है
  rationale: רעע का हिफ़ील रूप यहाँ हानि पहुँचाने, बिगाड़ने या विनष्ट करने के अर्थ में है। पवित्रस्थान के विनाश के प्रसंग में ‘उजाड़ दिया है’ तीव्रता और परिणाम दोनों व्यक्त करता है।
- source_word: אוֹיֵב
  choice: शत्रु
  rationale: एकवचन शब्द विरोधी शक्ति का सामूहिक या प्रतिनिधिक उल्लेख करता है। ‘शत्रु’ dignified और संदर्भानुकूल है।
- source_word: בַּקֹּדֶשׁ
  choice: पवित्रस्थान में
  rationale: קֹדֶשׁ यहाँ पवित्र परिसर, सम्भवतः मन्दिर के पवित्रस्थान, को दर्शाता है। ‘पवित्रस्थान’ धार्मिक अर्थ को स्पष्ट और संक्षिप्त रूप से सुरक्षित रखता है।
theological_decisions:
- issue: आरम्भिक आज्ञार्थक में परमेश्वर के लिए मानवरूपी गति-चित्र
  choice: ‘अपने कदम … की ओर बढ़ा’ कहकर ठोस छवि बनाए रखी गई
  alternative: ‘आ जा’ या ‘देखने आ’
  rationale: भजनकार की विनती जानबूझकर सजीव और काव्यात्मक है। उसे सामान्य ‘आ’ में बदलने से मूल के कदम बढ़ाने वाले चित्र और उसके भावात्मक बल का ह्रास होता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण काव्यात्मक रजिस्टर। ‘तू’ के अनुरूप एकवचन आत्मीय आज्ञार्थक ‘बढ़ा’ रखा गया है। ‘खण्डहर’ ठोस विनाश को और ‘उजाड़ दिया है’ शत्रु की व्यापक विध्वंसकारी क्रिया को स्वाभाविक हिन्दी में व्यक्त करते हैं।
