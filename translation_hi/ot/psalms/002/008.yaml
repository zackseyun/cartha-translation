lexical_decisions:
- source_word: שְׁאַל מִמֶּנִּי
  choice: मुझसे माँग
  rationale: आज्ञार्थक क्रिया और מן-संबंधित वाक्यांश मिलकर संबोधित राजा को सीधे परमेश्वर से माँगने का आदेश देते हैं; यह आधुनिक हिन्दी में स्वाभाविक और संक्षिप्त है।
- source_word: וְאֶתְּנָה
  choice: और मैं ... कर दूँगा
  rationale: आज्ञार्थक के बाद आया इच्छार्थक रूप यहाँ प्रतिज्ञात्मक उत्तर व्यक्त करता है। हिन्दी में ‘कर दूँगा’ दोनों कर्मों के विधेय-संबंध को सहज रूप से बाँधता है।
- source_word: גּוֹיִם
  choice: जाति-जाति के लोग
  rationale: यह विभिन्न राष्ट्रों अथवा जनसमूहों को सूचित करता है। यह चयन आधुनिक पाठक के लिए स्पष्ट है और ‘अन्यजाति’ जैसे बाद के धार्मिक वर्गीकरण को आरोपित नहीं करता।
- source_word: נַחֲלָתֶךָ
  choice: तेरी विरासत
  rationale: נחלה विरासत में मिले अथवा बाँटे गए अधिकार-भाग को दर्शाता है; ‘विरासत’ समानार्थी राजकीय प्रतिज्ञा को सुरक्षित रखती है।
- source_word: וַאֲחֻזָּתְךָ
  choice: तेरी संपत्ति
  rationale: אֲחֻזָּה अधिकार में रखी हुई भूमि या वस्तु है। ‘संपत्ति’ ‘विरासत’ से भिन्न रहते हुए समानांतरता बनाए रखती है।
- source_word: אַפְסֵי אָרֶץ
  choice: पृथ्वी के छोर
  rationale: यह पृथ्वी की दूर से दूर सीमाओं के लिए प्रचलित इब्रानी मुहावरा है; ‘पृथ्वी के छोर’ संक्षिप्त, गरिमापूर्ण और अर्थसंगत है।
theological_decisions:
- issue: प्रतिज्ञा का राजकीय/मसीही विस्तार
  choice: वचन को संबोधित पुत्र/राजा से की गई विश्वव्यापी अधिकार की प्रतिज्ञा के रूप में सीधे अनूदित किया गया है।
  alternative: मुख्य पाठ में इसे स्पष्ट रूप से मसीह के विषय की प्रतिज्ञा बताना।
  rationale: इब्रानी पाठ स्वयं संबोधित राजा/पुत्र को राष्ट्र और पृथ्वी की सीमाएँ देने की बात करता है। अनुवाद बाद की मसीही व्याख्या को नकारता नहीं, पर उसे मुख्य पाठ में जोड़कर मूल की खुली धार्मिक अर्थवत्ता को सीमित भी नहीं करता।
translation_notes:
  register: 'आधुनिक मानक हिन्दी में संक्षिप्त, काव्यात्मक और गरिमापूर्ण शैली रखी गई है। एकवचन संबोधन के लिए ‘मुझसे’, ‘तेरी’ और प्रतिज्ञा के लिए ‘मैं ... कर दूँगा’ प्रयुक्त हैं। उपलब्ध अंग्रेज़ी टिप्पणी में [a] का स्थान असंगत था: उसकी सामग्री אַפְסֵי אָרֶץ से संबंधित है, ‘मुझसे’ से नहीं। चूँकि ‘पृथ्वी के छोर’ मूल मुहावरे को पर्याप्त रूप से व्यक्त करता है, हिन्दी मुख्य पाठ में अनावश्यक पाद-टिप्पणी नहीं जोड़ी गई।'
