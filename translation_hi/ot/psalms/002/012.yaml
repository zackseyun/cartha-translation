  edition: WLC
  text: נַשְּׁקוּ בַ֡ר פֶּן יֶאֱנַ֤ף וְ/תֹ֬אבְדוּ דֶ֗רֶךְ כִּֽי יִבְעַ֣ר כִּ/מְעַ֣ט אַפּ֑/וֹ אַ֝שְׁרֵ֗י כָּל ח֥וֹסֵי בֽ/וֹ־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/002/012.yaml
  text: Kiss the son[a], lest he be angry and you perish in the way, for his anger burns quickly[c][b]. Blessed are all who take refuge in him.
translation:
  language: hi
  text: पुत्र को चूमो[a][b], कहीं ऐसा न हो कि वह क्रोधित हो जाए और तुम मार्ग में नष्ट हो जाओ, क्योंकि उसका क्रोध शीघ्र भड़क उठता है[c]। धन्य हैं वे सब जो उसकी[d] शरण लेते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “पुत्र के प्रति अधीनता प्रकट करो।” यहाँ “चूमना” राजकीय संदर्भ में सम्मान और अधीनता का संकेत हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में यहाँ बַर असामान्य शब्द है। इसे सामान्यतः “पुत्र” समझा जाता है, जो भजन 2:7 से संगत है; कुछ लोग इसे “शुद्धता” अथवा “शुद्ध भाव से” के अर्थ में समझते हैं।
    reason: alternative_reading
  - marker: c
    text: या “क्योंकि उसका क्रोध थोड़े ही में भड़क उठेगा।” मूल इब्रानी संक्षिप्त है और शीघ्रता अथवा अल्पता—दोनों पर बल दे सकती है।
    reason: lexical_alternative
  - marker: d
    text: “उसकी” का संकेत मूल में स्पष्ट नहीं किया गया है; इसका संबंध पुत्र से अथवा पूरे भजन के संदर्भ में यहोवा से समझा जा सकता है।
    reason: referential_ambiguity
lexical_decisions:
- source_word: נַשְּׁקוּ
  choice: चूमो
  rationale: मूल क्रिया का सीधा अर्थ ‘चूमना’ है। राजकीय संदर्भ में यह अधीनता और सम्मान प्रकट करने वाला कार्य हो सकता है; मुख्य पाठ में ठोस बिंब बनाए रखा गया है।
- source_word: בַר
  choice: पुत्र
  rationale: यह असामान्य और विवादित पद है, पर भजन 2:7 के ‘पुत्र’ और राजकीय संदर्भ के साथ ‘पुत्र’ सर्वाधिक संगत है। अन्य संभावनाएँ पादटिप्पणी में दी गई हैं।
- source_word: פֶּן יֶאֱנַף
  choice: कहीं ऐसा न हो कि वह क्रोधित हो जाए
  rationale: פֶּן चेतावनी के रूप में नकारात्मक परिणाम व्यक्त करता है और יֶאֱנַף क्रोधित होने को; यह हिंदी में स्वाभाविक और गंभीर चेतावनी है।
- source_word: וְתֹאבְדוּ דֶרֶךְ
  choice: और तुम मार्ग में नाश हो जाओ
  rationale: मूल की संक्षिप्त काव्यात्मक रचना और דֶרֶךְ के ‘मार्ग’ बिंब को बनाए रखते हुए अर्थ स्पष्ट किया गया है।
- source_word: כִּי יִבְעַר כִּמְעַט אַפּוֹ
  choice: क्योंकि उसका क्रोध शीघ्र ही भड़क उठता है
  rationale: יבער के अग्नि-बिंब को ‘भड़क उठता’ से रखा गया है। כמעט यहाँ शीघ्रता अथवा अल्पता का बोध दे सकता है; मुख्य पाठ में निकट और अचानक प्रकोप का अर्थ चुना गया है और दूसरा अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: אַשְׁרֵי
  choice: धन्य हैं
  rationale: भजनों के आशीर्वचन-सूत्र का धार्मिक और काव्यात्मक वजन बनाए रखता है।
- source_word: חֹסֵי בוֹ
  choice: जो उसकी शरण लेते हैं
  rationale: חסה संरक्षण के लिए आश्रय लेने का अर्थ देता है; ‘शरण लेना’ आधुनिक हिंदी में स्वाभाविक और बिंब के प्रति निष्ठावान है।
theological_decisions:
- issue: भजन 2:12 में בַר की पहचान
  choice: ‘पुत्र’—भजन 2:7 के राजकीय पुत्र-संदर्भ के अनुरूप
  alternative: ‘पवित्रता/शुद्धता’ या क्रियाविशेषण के रूप में ‘शुद्ध भाव से’
  rationale: भजन का निकट साहित्यिक संदर्भ पुत्र-संबंधी राजकीय व्यक्ति की ओर संकेत करता है, किंतु असामान्य अरामी रूप और वैकल्पिक व्याख्याओं के कारण पाठगत तनाव को पादटिप्पणी में खुला रखा गया है।
- issue: अंतिम सर्वनाम ‘उसकी’ का संदर्भ
  choice: मूल की पुल्लिंग एकवचन अस्पष्टता को बनाए रखा गया
  alternative: स्पष्ट रूप से ‘यहोवा’ या ‘पुत्र’ कहना
  rationale: मूल पाठ केवल ‘उसमें’ कहता है; निकटतम व्यक्ति और पूरे भजन में परमेश्वर की शरण—दोनों के बीच संभावित अर्थ-संबंध को अनावश्यक रूप से निश्चित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण काव्यात्मक शैली। ‘चूमो’, ‘मार्ग’, ‘भड़क उठता’ और ‘शरण’ मूल के ठोस बिंब बनाए रखते हैं। पादटिप्पणी [b] का चिह्न उसी शब्द के बाद रखा गया है जिसकी संदर्भगत अस्पष्टता समझाई गई है।
