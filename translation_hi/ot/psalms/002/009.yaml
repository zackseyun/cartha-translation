language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: תְּ֭רֹעֵ/ם בְּ/שֵׁ֣בֶט בַּרְזֶ֑ל כִּ/כְלִ֖י יוֹצֵ֣ר תְּנַפְּצֵֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/002/009.yaml
  text: You will break them with an iron scepter[b][a]; like a potter’s vessel you will shatter them.
translation:
  language: hi
  text: तू उन्हें लोहे के राजदंड[b] से तोड़ डालेगा[a]; कुम्हार के बर्तन के समान तू उन्हें चकनाचूर कर देगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'कुछ प्राचीन अनुवादों में प्रतिबिंबित और प्रकाशितवाक्य में दोहराई गई एक वैकल्पिक पाठ-परंपरा के अनुसार: “तू उन्हें लोहे के राजदंड से चराएगा” अथवा “तू लोहे के राजदंड से उन पर शासन करेगा।”'
    reason: alternative_reading
  - marker: b
    text: “राजदंड” का अनुवाद “दंड” या “छड़ी” भी किया जा सकता है; इब्रानी शब्द अधिकार की छड़ी अथवा अनुशासन के साधन को दर्शा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּרֹעֵם
  choice: तू उन्हें ... तोड़ डालेगा
  rationale: मसोरेटी स्वरांकन और समानांतर पद ‘तू उन्हें चकनाचूर कर देगा’ विनाशकारी न्याय का अर्थ पुष्ट करते हैं। प्राचीन अनुवादों में सुरक्षित ‘चराएगा/शासन करेगा’ पाठांतर को पादटिप्पणी में रखा गया है।
- source_word: בְּשֵׁבֶט
  choice: राजदंड से
  rationale: שֵׁבֶט का अर्थ छड़ी, दंड या राजदंड हो सकता है। भजन 2 के राजकीय प्रसंग में ‘राजदंड’ अधिकार और दंड—दोनों भावों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: בַּרְזֶל
  choice: लोहे के
  rationale: यह पदार्थ का सीधा उल्लेख है और राजदंड की कठोरता तथा न्याय की प्रचंडता को उभारता है।
- source_word: כִּכְלִי יוֹצֵר
  choice: कुम्हार के बर्तन के समान
  rationale: כְּלִי व्यापक रूप से पात्र या वस्तु है, और יוֹצֵר के साथ इसका स्वाभाविक आशय मिट्टी का वह बर्तन है जिसे कुम्हार बनाता है।
- source_word: תְּנַפְּצֵם
  choice: तू उन्हें चकनाचूर कर देगा
  rationale: क्रिया हिंसक रूप से तोड़कर टुकड़े कर देने का बोध कराती है। ‘चकनाचूर कर देगा’ आधुनिक हिन्दी में सजीव है और कुम्हार के बर्तन की उपमा के अनुकूल है।
theological_decisions:
- issue: पहली क्रिया राजकीय शासन दर्शाती है या विनाशकारी न्याय
  choice: 'विनाशकारी न्याय: ‘तू उन्हें ... तोड़ डालेगा’'
  alternative: 'राजकीय शासन: ‘तू उन्हें ... चराएगा’ अथवा ‘उन पर शासन करेगा’'
  rationale: मसोरेटी पाठ का स्वरांकन और ‘चकनाचूर कर देगा’ वाला समानांतर वाक्य विनाशकारी न्याय के अर्थ का समर्थन करते हैं। फिर भी कुछ प्राचीन अनुवादों और प्रकाशितवाक्य में प्रतिबिंबित वैकल्पिक परंपरा महत्वपूर्ण है, इसलिए उसे पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, काव्यात्मक किंतु सहज रूप। भजन के प्रत्यक्ष संबोधन के अनुरूप एकवचन ‘तू’ रखा गया है। मुख्य पाठ मसोरेटी पाठ की विनाशकारी समानांतरता सुरक्षित रखता है, जबकि वास्तविक प्राचीन पाठांतर पादटिप्पणी में दिया गया है।
