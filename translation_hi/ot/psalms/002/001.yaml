lexical_decisions:
- source_word: לָמָּה
  choice: क्यों
  rationale: यह आलंकारिक प्रश्न को स्वाभाविक और सीधे ढंग से व्यक्त करता है।
- source_word: רָגְשׁוּ
  choice: उग्र हो रहे हैं
  rationale: मूल क्रिया समूहों की अशांत, उत्तेजित और शत्रुतापूर्ण हलचल बताती है। यह चयन उस भाव को सहज आधुनिक हिन्दी में व्यक्त करता है, जबकि ‘षड्यंत्र करना’ जैसे अधिक व्याख्यात्मक अर्थ से बचता है।
- source_word: גוֹיִם
  choice: राष्ट्र
  rationale: सन्दर्भ राजनीतिक जातियों या राष्ट्रों का है। ‘राष्ट्र’ स्पष्ट है और ‘अन्यजाति’ से जुड़ी बाद की धार्मिक ध्वनि को नहीं लाता।
- source_word: לְאֻמִּים
  choice: जन-समूह
  rationale: यह גוֹיִם का निकट-समानार्थी बहुवचन है। ‘जन-समूह’ समानांतरता बनाए रखते हुए दोनों इब्रानी शब्दों के बीच कुछ भेद भी सुरक्षित रखता है।
- source_word: יֶהְגּוּ
  choice: योजनाएँ बना रहे हैं
  rationale: क्रिया बुदबुदाने, मनन करने, सोचने या युक्ति रचने का अर्थ दे सकती है। विद्रोही राजनीतिक सन्दर्भ में योजना बनाना स्वाभाविक है, पर व्यापक अर्थ-क्षेत्र पादटिप्पणी में रखा गया है।
- source_word: רִיק
  choice: व्यर्थ
  rationale: संज्ञा का मूल भाव रिक्तता, निष्फलता या निरर्थक वस्तु है। हिन्दी में ‘व्यर्थ योजनाएँ’ अर्थ को सहज ढंग से व्यक्त करता है, यद्यपि मूल में ‘रिक्तता’ कर्म के रूप में अधिक प्रत्यक्ष है।
