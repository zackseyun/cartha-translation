  - marker: a
    text: या, “निरर्थक बात पर मनन कर रहे हैं” या “निरर्थक बात बुदबुदा रहे हैं।” इब्रानी क्रिया बुदबुदाने, मनन करने या योजना बनाने का अर्थ दे सकती है, और संज्ञा रिक्तता, निरर्थकता या निष्फल बात का।
