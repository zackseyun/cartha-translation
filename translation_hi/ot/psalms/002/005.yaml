  edition: WLC
  text: אָ֤ז יְדַבֵּ֣ר אֵלֵ֣י/מוֹ בְ/אַפּ֑/וֹ וּֽ/בַ/חֲרוֹנ֥/וֹ יְבַהֲלֵֽ/מוֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/002/005.yaml
  text: Then he will speak to them in his anger[a], and in his burning wrath he will terrify them.
translation:
  language: hi
  text: 'तब वह अपने क्रोध में उनसे बोलेगा,

    और अपने भड़कते कोप में उन्हें भयभीत कर देगा।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और अपने क्रोध की ज्वाला में उन्हें घबरा देगा।”
    reason: חָרוֹן और בהל के क्रमशः ‘क्रोध की ज्वाला’ तथा ‘घबरा देना’ जैसे वैध वैकल्पिक अर्थों को दर्शाता है।
lexical_decisions:
- source_word: אָז
  choice: तब
  rationale: यह कालवाचक क्रियाविशेषण घटनाक्रम में परमेश्वर की अगली प्रतिक्रिया को दर्शाता है; ‘तब’ संक्षिप्त और स्वाभाविक है।
- source_word: יְדַבֵּר
  choice: बोलेगा
  rationale: דבר का पिएल अपूर्ण रूप प्रसंग में आगामी प्रतिक्रिया व्यक्त करता है; भविष्यकाल हिन्दी में इस क्रम को स्पष्ट रखता है।
- source_word: אֵלֵימוֹ
  choice: उनसे
  rationale: पूर्वसर्ग और तृतीय पुरुष बहुवचन प्रत्यय पिछले पदों के विद्रोही राजाओं और शासकों की ओर संकेत करते हैं; ‘उनसे बोलेगा’ स्वाभाविक हिन्दी प्रयोग है।
- source_word: בְאַפּוֹ
  choice: अपने क्रोध में
  rationale: אַף का शाब्दिक संबंध ‘नाक’ से है, पर यहाँ यह क्रोध का मुहावरा है; अर्थ को बिना कृत्रिम शाब्दिकता के सुरक्षित रखा गया है।
- source_word: וּבַחֲרוֹנוֹ
  choice: और अपने भड़कते कोप में
  rationale: חָרוֹן जलते या भड़कते क्रोध की तीव्रता व्यक्त करता है। ‘भड़कता कोप’ ताप के बिंब को बनाए रखते हुए पहले ‘क्रोध’ से भिन्नता दिखाता है।
- source_word: יְבַהֲלֵמוֹ
  choice: उन्हें भयभीत कर देगा
  rationale: בהל का पिएल रूप अचानक भय, घबराहट या आतंक उत्पन्न करने का बोध देता है; यह चयन न्याय के प्रसंग में उसकी प्रबलता व्यक्त करता है।
theological_decisions:
- issue: परमेश्वर के क्रोध का मानव-सदृश वर्णन
  choice: ‘क्रोध’ और ‘भड़कते कोप’ की प्रबल भाषा को बनाए रखा गया है।
  alternative: इसे केवल ‘अप्रसन्नता’ या अमूर्त ‘न्याय’ के रूप में नरम करना।
  rationale: इब्रानी पाठ विद्रोह के प्रति परमेश्वर के व्यक्तिगत विरोध को तीखी भाषा में व्यक्त करता है। अनुवाद इस तनाव और न्याय-संबंधी गंभीरता को बिना किसी अतिरिक्त धर्मसैद्धांतिक निष्कर्ष के सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; काव्यात्मक गरिमा के लिए ‘कोप’ रखा गया है, जबकि वाक्यरचना सामान्य पाठक के लिए सीधी और सहज है। पद को दो समानांतर पंक्तियों में रखा गया है।
