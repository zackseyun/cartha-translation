  text: יִ֥תְיַצְּב֨וּ מַלְכֵי אֶ֗רֶץ וְ/רוֹזְנִ֥ים נֽוֹסְדוּ יָ֑חַד עַל יְ֝הוָה וְ/עַל מְשִׁיחֽ/וֹ׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/002/002.yaml
  text: The kings of the earth take their stand[b][a], and rulers gather together against Yahweh and against his Anointed.
translation:
  language: hi
  text: पृथ्वी के राजा डट खड़े होते हैं, और शासक मिलकर सलाह करते हैं, यहोवा और उसके अभिषिक्त के विरुद्ध।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “शासक मिलकर इकट्ठे होते हैं” अथवा “एकजुट होते हैं।” इब्रानी अभिव्यक्ति विरोध में समन्वित संयुक्त कार्रवाई का भाव देती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יִתְיַצְּבוּ
  choice: मोर्चा बाँधते हैं
  rationale: हित्पएल रूप जानबूझकर अपना स्थान लेने और विरोध में डटने का भाव देता है। ‘मोर्चा बाँधते हैं’ आधुनिक हिन्दी में इस संगठित, विरोधी मुद्रा को स्वाभाविक रूप से व्यक्त करता है।
- source_word: מַלְכֵי אֶרֶץ
  choice: पृथ्वी के राजा
  rationale: यह रचना-संबंधी पदबंध व्यापक राजनीतिक और विश्वव्यापी दायरे को सूचित करता है; इसलिए ‘देश के राजा’ की अपेक्षा ‘पृथ्वी के राजा’ उपयुक्त है।
- source_word: רוֹזְנִים
  choice: शासक
  rationale: यह शब्द उच्च पदस्थ अधिकारियों अथवा राजनीतिक अगुओं को दर्शाता है। ‘शासक’ स्पष्ट, समकालीन और पर्याप्त व्यापक है।
- source_word: נוֹסְדוּ יָחַד
  choice: मिलकर ... एकजुट होते हैं
  rationale: यह अभिव्यक्ति साझा विरोध के लिए समन्वित संयुक्त कार्रवाई बताती है। मुख्य पाठ में ‘षड्यंत्र रचते हैं’ कहने से आने वाली अधिक विशिष्ट व्याख्या से बचते हुए सामूहिकता को स्पष्ट किया गया है।
- source_word: עַל
  choice: के विरुद्ध
  rationale: इस विरोधपूर्ण संदर्भ में संबंधसूचक अव्यय का अर्थ प्रतिकूलता है; ‘के विरुद्ध’ वही बल व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को हिन्दी में प्रचलित नाम-रूप ‘यहोवा’ से प्रस्तुत किया गया है, न कि उपाधि ‘प्रभु’ से।
- source_word: מְשִׁיחוֹ
  choice: उसके अभिषिक्त
  rationale: शब्द का सीधा अर्थ ‘उसका अभिषिक्त जन’ है। यह तत्कालीन राजकीय संदर्भ तथा व्यापक मसीहाई अर्थ—दोनों के लिए स्थान बनाए रखता है और मुख्य पाठ में केवल बाद की पारिभाषिक उपाधि थोपने से बचता है।
theological_decisions:
- issue: מְשִׁיחוֹ का तत्कालीन राजकीय और व्यापक मसीहाई महत्व
  choice: उसके अभिषिक्त
  alternative: उसके मसीह
  rationale: ‘अभिषिक्त’ मूल इब्रानी का सीधा अर्थ सुरक्षित रखता है, दाऊदी राजा के तत्कालीन संदर्भ को स्पष्ट रहने देता है और भजन की मसीहाई दिशा को नकारता भी नहीं। ‘मसीह’ वैध पारिभाषिक व्याख्या है, पर मुख्य पाठ में वह अर्थ को अधिक निश्चित कर देती।
- issue: ईश्वरीय नाम יְהוָה का प्रस्तुतीकरण
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल में व्यक्तिगत ईश्वरीय नाम है, उपाधि नहीं; इसलिए नाम को हिन्दी के परिचित रूप में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘मोर्चा बाँधते हैं’ विरोध में जानबूझकर डटने का सजीव भाव देता है; ‘अभिषिक्त’ मूल की राजकीय और मसीहाई अर्थ-संभावना को खुला रखता है।
