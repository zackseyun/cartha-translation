  text: Let us tear off their chains and cast their ropes from us[a][b][c].
translation:
  language: hi
  text: “आओ, हम उनके बंधन तोड़ डालें और उनकी रस्सियाँ अपने से दूर फेंक दें।”[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उनकी बेड़ियाँ”।
    reason: lexical_alternative
  - marker: b
    text: या “उनकी डोरियाँ”।
    reason: lexical_alternative
  - marker: c
    text: या “और उनकी रस्सियाँ हमसे दूर फेंक दें”।
    reason: previous_rendering
lexical_decisions:
- source_word: נְנַתְּקָה
  choice: आओ, हम ... तोड़ डालें
  rationale: प्रथम पुरुष बहुवचन का कोहोर्टेटिव रूप साझा संकल्प या उकसावे को व्यक्त करता है। ‘तोड़ डालें’ बंधन को बलपूर्वक अलग करने की क्रिया को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: מֹוסְרוֹתֵימוֹ
  choice: उनके बंधन
  rationale: यह बहुवचन संज्ञा बाँधने वाली वस्तुओं या रोक-टोक के साधनों को दर्शाती है। ‘बंधन’ काव्यात्मक रूपक को बनाए रखता है और अनावश्यक रूप से धातु की ‘जंजीरों’ का अर्थ नहीं जोड़ता।
- source_word: וְנַשְׁלִיכָה
  choice: और ... फेंक दें
  rationale: यह भी प्रथम पुरुष बहुवचन का कोहोर्टेटिव है। ‘फेंक दें’ दृढ़ अस्वीकार और अपने से दूर करने की क्रिया को सहज हिन्दी में व्यक्त करता है।
- source_word: מִמֶּנּוּ
  choice: अपने ऊपर से
  rationale: पूर्वसर्ग और प्रथम पुरुष बहुवचन प्रत्यय वक्ताओं से बंधनों को हटाने का भाव देते हैं। रस्सियों के बँधे होने की छवि में ‘अपने ऊपर से’ हिन्दी में ‘हमसे दूर’ की अपेक्षा अधिक स्वाभाविक है।
- source_word: עֲבֹתֵימוֹ
  choice: उनकी रस्सियाँ
  rationale: संज्ञा मोटी डोरियों, रस्सियों या बटों को दर्शाती है। ‘रस्सियाँ’ सामान्य पाठक के लिए स्पष्ट है और समानांतर बंधन-छवि को ठोस बनाए रखती है।
theological_decisions:
- issue: ईश्वरीय/राजकीय नियंत्रण का रूपक
  choice: बंधन और रस्सियों की ठोस छवि को बिना मूल्यांकन के प्रस्तुत किया गया है।
  alternative: इसे ‘दासता’, ‘अत्याचार’ या ‘नियमों’ जैसे व्याख्यात्मक शब्दों में व्यक्त करना।
  rationale: संदर्भ में राष्ट्र यहोवा और उसके अभिषिक्त का विरोध करते हैं, पर इस पंक्ति में उनके कथन को बंधनों के रूपक से रखा गया है। अनुवाद उस नियंत्रण को न तो अत्याचारी घोषित करता है, न मुक्ति के रूप में उसका अर्थ खोलता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और काव्यात्मक हिन्दी। दो समानांतर कोहोर्टेटिव क्रियाओं को ‘आओ, हम...’ और संयुक्त ‘फेंक दें’ से स्वाभाविक रूप दिया गया है; विद्रोही वक्ताओं का सामूहिक संकल्प बना रहता है।
