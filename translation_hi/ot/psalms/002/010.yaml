lexical_decisions:
- source_word: וְעַתָּה
  choice: इसलिए अब
  rationale: यह पद पिछले कथन से निष्कर्ष निकालते हुए वर्तमान आग्रह की ओर बढ़ता है। ‘इसलिए अब’ संयोजक और कालवाचक—दोनों बलों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מְלָכִים
  choice: हे राजाओ
  rationale: यह सीधा सम्बोधन है। ‘हे’ काव्यात्मक गरिमा बनाए रखते हुए आधुनिक हिन्दी में सम्बोधन को स्पष्ट करता है।
- source_word: הַשְׂכִּילוּ
  choice: बुद्धि से काम लो
  rationale: שׂכל के हिफ़ील आज्ञार्थक रूप में ऐसी समझदारी का भाव है जो व्यवहार में प्रकट हो। ‘बुद्धि से काम लो’ केवल ज्ञान रखने के बजाय विवेकपूर्ण आचरण का आग्रह व्यक्त करता है।
- source_word: הִוָּסְרוּ
  choice: चेतावनी स्वीकार करो
  rationale: יסר के निफ़ाल आज्ञार्थक रूप का अर्थ शिक्षा, अनुशासन, सुधार या चेतावनी को ग्रहण करना हो सकता है। राजाओं को दिए जा रहे इस तात्कालिक आग्रह में ‘चेतावनी स्वीकार करो’ प्रसंग के बल और ग्रहण करने के भाव—दोनों को रखता है।
- source_word: שֹׁפְטֵי אָרֶץ
  choice: हे पृथ्वी के न्यायियो
  rationale: मूल पद न्याय करने वाले अधिकारियों को निर्दिष्ट करता है। भजन 2 के विश्वव्यापी परिप्रेक्ष्य में אָרֶץ के लिए ‘पृथ्वी’ उपयुक्त है; ‘न्यायियो’ को सामान्यीकृत करके ‘शासको’ नहीं किया गया।
