source:
  edition: WLC
  text: יוֹשֵׁ֣ב בַּ/שָּׁמַ֣יִם יִשְׂחָ֑ק אֲ֝דֹנָ֗/י יִלְעַג לָֽ/מוֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/002/004.yaml
  text: The one enthroned in the heavens laughs[a]; the Lord mocks them.
translation:
  language: hi
  text: जो स्वर्गों में विराजमान है, वह हँसता है; प्रभु उनका उपहास करता है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो स्वर्गों में बैठा है, वह हँसता है; प्रभु उन पर ठट्ठा करता है।”
    reason: ‘विराजमान’ के स्थान पर יוֹשֵׁב का अधिक शाब्दिक अनुवाद और יִלְעַג का वैकल्पिक हिन्दी रूप।
lexical_decisions:
- source_word: יוֹשֵׁב
  choice: विराजमान
  rationale: मूल कृदन्त का शाब्दिक अर्थ ‘बैठा हुआ’ है, पर इस राजकीय भजन में यह स्वर्ग में परमेश्वर के संप्रभु आसन का संकेत देता है। ‘विराजमान’ बैठने और राजकीय गरिमा—दोनों भावों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בַּשָּׁמַיִם
  choice: स्वर्गों में
  rationale: इब्रानी शब्द रूपतः बहुवचन है। ‘स्वर्गों में’ उस रूप और भजन की ऊँची काव्यात्मक शैली को बनाए रखता है।
- source_word: יִשְׂחָק
  choice: हँसता है
  rationale: यहाँ अपूर्ण क्रिया काव्यात्मक वर्तमान के रूप में स्वाभाविक है। ‘हँसता है’ मूल अर्थ को बनाए रखता है; उपहास का भाव अगले क्रियापद और प्रसंग से स्पष्ट होता है।
- source_word: אֲדֹנָי
  choice: प्रभु
  rationale: यह אֲדֹנָי उपाधि है, परमेश्वर का निज नाम नहीं। ‘प्रभु’ आधुनिक मानक हिन्दी में प्रतिष्ठित, संक्षिप्त और गरिमापूर्ण अनुवाद है।
- source_word: יִלְעַג
  choice: उपहास करता है
  rationale: לעג तिरस्कारपूर्ण हँसी या उपहास व्यक्त करता है। ‘उपहास करता है’ स्पष्ट, स्वाभाविक और काव्यात्मक गरिमा के अनुकूल है।
- source_word: לָמוֹ
  choice: उनका
  rationale: यह सर्वनाम पिछले पदों के विद्रोही राष्ट्रों और शासकों की ओर संकेत करता है। हिन्दी में ‘उनका उपहास करता है’ सहज प्रयोग है।
theological_decisions:
- issue: परमेश्वर का राजकीय और मानवरूपी चित्रण
  choice: ‘विराजमान’ द्वारा राजकीय भाव व्यक्त करते हुए ‘हँसता है’ और ‘उपहास करता है’ को ज्यों का त्यों बनाए रखना
  alternative: ‘जो स्वर्गों में बैठा है, वह हँसता है; प्रभु उन पर हँसता है’
  rationale: पद विद्रोही शासकों के सामने परमेश्वर की संप्रभु श्रेष्ठता को सजीव मानवरूपी भाषा में दिखाता है। अनुवाद न तो इस भाषा को अमूर्त बनाता है, न उससे अधिक व्याख्या जोड़ता है; ‘विराजमान’ प्रसंग में निहित राजकीय संकेत को स्वाभाविक हिन्दी में सामने लाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी की गरिमापूर्ण काव्यात्मक शैली। वाक्य सरल और मौखिक रूप से सुबोध है; ‘विराजमान’ राजकीय प्रसंग को व्यक्त करता है, जबकि ‘हँसता है’ मूल की सजीव मानवरूपी भाषा बनाए रखता है।
