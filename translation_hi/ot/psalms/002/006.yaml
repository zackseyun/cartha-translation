lexical_decisions:
- source_word: וַאֲנִי
  choice: परन्तु मैंने
  rationale: स्वतंत्र सर्वनाम के साथ संयोजक यहाँ राष्ट्रों और शासकों के विद्रोह के विपरीत यहोवा की निर्णायक कार्रवाई पर बल देता है। स्वाभाविक हिन्दी में ‘परन्तु मैंने’ विरोध और कर्ता के बल—दोनों को व्यक्त करता है।
- source_word: נָסַכְתִּי
  choice: स्थापित किया है
  rationale: संदर्भ में क्रिया का आशय राजा को राजपद पर नियुक्त अथवा प्रतिष्ठित करना है। ‘स्थापित’ आधुनिक हिन्दी में यह भाव देता है और इसे अभिषेक के लिए प्रयुक्त विशिष्ट इब्रानी क्रिया के साथ नहीं मिलाता।
- source_word: מַלְכִּי
  choice: अपने राजा को
  rationale: प्रथम पुरुष एकवचन संबंधसूचक प्रत्यय का अर्थ ‘मेरा राजा’ है; हिन्दी वाक्य में समान कर्ता के कारण ‘अपने राजा को’ अधिक स्वाभाविक और स्पष्ट है।
- source_word: עַל
  choice: पर
  rationale: स्थानवाचक प्रयोग में यह सिय्योन पर राजा की स्थापना को बताता है; ‘के ऊपर शासन करने के लिए’ जैसा अर्थ जोड़ना उचित नहीं होगा।
- source_word: צִיּוֹן
  choice: सिय्योन
  rationale: यह इब्रानी स्थान-नाम का हिन्दी बाइबलीय परंपरा में प्रचलित लिप्यंतरण है।
- source_word: הַר קָדְשִׁי
  choice: अपने पवित्र पर्वत पर
  rationale: शाब्दिक संबंध ‘मेरी पवित्रता का पर्वत’ का स्वाभाविक हिन्दी रूप ‘मेरा पवित्र पर्वत’ है; समान वक्ता के संदर्भ में ‘अपने’ सहज है। ‘पर्वत’ הַר का सीधा अर्थ सुरक्षित रखता है।
theological_decisions:
- issue: क्या נָסַכְתִּי को अनुष्ठानिक अभिषेक या राजकीय स्थापना के रूप में प्रस्तुत किया जाए
  choice: राजकीय स्थापना—‘स्थापित किया है’
  alternative: ‘अभिषेक किया है’ अथवा ‘ठहराया है’
  rationale: तात्कालिक संदर्भ में परमेश्वर विद्रोही सांसारिक राजाओं के सामने सिय्योन में अपने चुने हुए राजा की नियुक्ति घोषित करता है। ‘स्थापित’ राजकीय प्रतिष्ठापन का भाव रखता है, पर अभिषेक की अलग इब्रानी शब्दावली को इसमें आरोपित नहीं करता। इससे मसीही पाठ की संभावना बनी रहती है, किंतु अनुवाद स्वयं किसी संकुचित अनुष्ठानिक व्याख्या को अनिवार्य नहीं बनाता।
