  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אֲסַפְּרָ֗ה אֶֽ֫ל חֹ֥ק יְֽהוָ֗ה אָמַ֘ר אֵלַ֥/י בְּנִ֥/י אַ֑תָּה אֲ֝נִ֗י הַ/יּ֥וֹם יְלִדְתִּֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/002/007.yaml
  text: 'I will declare the decree of Yahweh: He said to me[a], “You are my Son[b]; today I have begotten you.”'
translation:
  language: hi
  text: 'मैं यहोवा की राजाज्ञा घोषित करूँगा:

    उसने मुझसे कहा,

    “तू मेरा पुत्र है;

    आज मैंने तुझे जन्म दिया है।”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “आज मैं तेरा पिता बना हूँ।” मूल हिब्रू में अधिक शाब्दिक रूप से जन्म देने की भाषा है; यह राजकीय अभिषेक या दत्तक-पुत्र बनाए जाने की छवि जगा सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲסַפְּרָה
  choice: मैं ... घोषित करूँगा
  rationale: इस रूप में संकल्प और गंभीर उद्घोषणा का भाव है। राजकीय संदर्भ में ‘घोषित करूँगा’ स्वाभाविक और गरिमापूर्ण है।
- source_word: אֶל חֹק
  choice: राजाज्ञा
  rationale: חֹק का मूल अर्थ निर्धारित विधान या आदेश है; इस राजाभिषेक-संदर्भ में ‘राजाज्ञा’ उसके राजकीय और अधिकारपूर्ण स्वर को स्पष्ट करती है। אֶל को अलग से यांत्रिक रूप में न देकर हिन्दी की स्वाभाविक सकर्मक रचना अपनाई गई है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित नाम-रूप ‘यहोवा’ रखा गया है।
- source_word: אָמַר אֵלַי
  choice: उसने मुझसे कहा
  rationale: क्रिया का कर्ता पिछले पदबंध ‘यहोवा’ से स्वाभाविक रूप से समझ में आता है; सर्वनाम हिन्दी में सहज प्रवाह देता है।
- source_word: בְּנִי אַתָּה
  choice: तू मेरा पुत्र है
  rationale: हिब्रू का सीधा अर्थ सुरक्षित है। हिन्दी में अक्षरों के बड़े-छोटे रूप से मसीही संकेत दिखाना संभव नहीं, इसलिए ‘पुत्र’ को बिना अतिरिक्त व्याख्यात्मक विशेषण के रखा गया है; राजकीय-मसीही अर्थ संदर्भ के लिए खुला रहता है।
- source_word: הַיּוֹם
  choice: आज
  rationale: समय-सूचक बल को आधुनिक और सीधी हिन्दी में ठीक प्रकार व्यक्त करता है।
- source_word: יְלִדְתִּיךָ
  choice: मैंने तुझे जन्म दिया है
  rationale: ילד की जन्म देने/उत्पन्न करने की प्रतिमा को बनाए रखता है। यह राजकीय प्रतिष्ठापन, दत्तक ग्रहण या मसीही पूर्ति में से किसी एक अर्थ को अनावश्यक रूप से निश्चित नहीं करता।
theological_decisions:
- issue: בְּנִי में राजकीय पुत्रत्व और मसीही महत्व
  choice: तू मेरा पुत्र है
  alternative: तू मेरा बेटा है
  rationale: ‘पुत्र’ गरिमापूर्ण और राजकीय-मसीही संदर्भ के अनुकूल है, पर हिब्रू से अधिक कोई उपाधि नहीं जोड़ता। देवनागरी में capitalization का भेद नहीं होता, इसलिए अंग्रेज़ी की Son/son अस्पष्टता हिन्दी में स्वाभाविक रूप से बनी रहती है।
- issue: ‘आज मैंने तुझे जन्म दिया है’ का आशय
  choice: जन्म देने की मूल प्रतिमा को बनाए रखना
  alternative: आज मैं तेरा पिता बना हूँ
  rationale: वैकल्पिक रूप राजकीय दत्तक ग्रहण की व्याख्या को प्रमुख बना देता है। मुख्य पाठ मूल जन्म-भाषा और उससे जुड़ी धार्मिक-वैचारिक तनातनी को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में काव्यात्मक, गंभीर और राजकीय स्वर रखा गया है। परमेश्वर द्वारा राजा को सीधे संबोधन में ‘तू/तुझे’ हिन्दी बाइबिलीय-काव्य परंपरा के अनुरूप आत्मीय एकवचन है, अनादर सूचक नहीं। पद-विन्यास उद्घोषणा और प्रत्यक्ष वचन को स्पष्ट करता है।
