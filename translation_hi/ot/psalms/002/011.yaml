id: PSA.2.11
reference: Psalms 2:11
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: עִבְד֣וּ אֶת יְהוָ֣ה בְּ/יִרְאָ֑ה וְ֝/גִ֗ילוּ בִּ/רְעָדָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/002/011.yaml
  text: Serve Yahweh with fear[b][a], and rejoice with trembling.
translation:
  language: hi
  text: 'याहवे की सेवा भय[a] के साथ करो,

    और काँपते हुए आनन्द मनाओ।[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘श्रद्धा के साथ’; यहाँ प्रयुक्त इब्रानी शब्द परमेश्वर के सामने भय के साथ-साथ विस्मय और श्रद्धा का भाव भी व्यक्त कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘आनन्द मनाओ’ का अनुवाद ‘उल्लसित होओ’ भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עִבְדוּ
  choice: सेवा करो
  rationale: बहुवचन आज्ञार्थक क्रिया परमेश्वर के प्रति सेवा और निष्ठा, दोनों को व्यक्त करती है; ‘सेवा करो’ इसके व्यापक अर्थ को केवल उपासना तक सीमित नहीं करता।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी व्यक्तिगत दिव्य नाम को किसी उपाधि से बदलने के बजाय लिप्यंतरित किया गया है।
- source_word: בְּיִרְאָה
  choice: भय के साथ
  rationale: יִרְאָה में भय, विस्मय और श्रद्धा की अर्थ-छायाएँ हैं। ‘भय’ मूल के प्रबल स्वर को बनाए रखता है; ‘श्रद्धा’ को पाद-टिप्पणी में विकल्प के रूप में दिया गया है।
- source_word: וְגִילוּ
  choice: और आनन्द मनाओ
  rationale: גיל उल्लास या हर्ष मनाने को दर्शाता है। ‘आनन्द मनाओ’ आधुनिक हिन्दी में स्वाभाविक है और आज्ञा का भाव स्पष्ट रखता है।
- source_word: בִּרְעָדָה
  choice: काँपते हुए
  rationale: רְעָדָה भय अथवा विस्मय से काँपने को दर्शाता है। यह पद में आनन्द और भय के बीच जानबूझकर रखे गए तनाव को सुरक्षित रखता है।
theological_decisions:
- issue: आनन्द और भयपूर्ण अधीनता की साथ-साथ दी गई आज्ञाएँ
  choice: ‘याहवे की सेवा भय के साथ करो, और काँपते हुए आनन्द मनाओ।’—दोनों आज्ञाओं का तनाव बनाए रखा गया है।
  alternative: इसे केवल श्रद्धापूर्ण उपासना अथवा केवल आतंक के भाव की ओर झुकाकर सहज बनाया जा सकता था।
  rationale: इब्रानी पाठ भय और आनन्द को बिना किसी व्याख्यात्मक समाधान के साथ रखता है; अनुवाद भी इसी धार्मिक तनाव को सुरक्षित रखता है।
- issue: יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा अथवा प्रभु
  rationale: मूल पाठ के व्यक्तिगत दिव्य नाम को उपाधि से प्रतिस्थापित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; स्वर गरिमापूर्ण और सामान्य पाठक के लिए सहज रखा गया है। बहुवचन आज्ञार्थ के लिए ‘करो/मनाओ’ का प्रयोग हुआ है। पंक्ति-विन्यास इब्रानी समानांतरता को उभारता है।
