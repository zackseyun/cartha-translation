  choice: वे हमें निगल जाते
  alternative: उन्होंने हमें निगल लिया
  rationale: क्रियारूप अपने आप में साधारण भूतकाल की अनुमति देता है, किंतु पद 2–5 की ‘यदि... तब...’ संरचना प्रतिकल्पित परिणाम का प्रबल समर्थन करती है; विकल्प को पादटिप्पणी में सुरक्षित रखा गया है।
