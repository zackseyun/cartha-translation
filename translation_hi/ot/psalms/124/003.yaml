translation:
  language: hi
  text: तब वे हमें जीवित ही निगल जाते, जब उनका क्रोध हमारे विरुद्ध भड़का होता[a][b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसे साधारण भूतकाल मानकर “उन्होंने हमें जीवित ही निगल लिया” भी अनुवाद किया जा सकता है; पर पद 2–5 का व्यापक संदर्भ प्रतिकल्पित अर्थ “वे हमें जीवित ही निगल जाते” का समर्थन करता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “जब उनकी नाक हमारे विरुद्ध जलती”; यह क्रोध के लिए प्रयुक्त इब्रानी मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲזַי
  choice: तब
  rationale: यह कालवाचक क्रियाविशेषण पिछले पद से चली आ रही परिणामसूचक, प्रतिकल्पित संरचना को आगे बढ़ाता है।
- source_word: חַיִּים
  choice: जीवित ही
  rationale: यह क्रियाविशेषणवत् प्रयुक्त है; ‘जीवित ही निगल जाते’ मूल की सजीव और भयावह छवि को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: בְּלָעוּנוּ
  choice: वे हमें ... निगल जाते
  rationale: रूप साधारण पूर्ण भूतकाल का है, पर पद 2–5 की प्रतिकल्पित शर्त के संदर्भ में हिन्दी का ‘निगल जाते’ उपयुक्त है और मूल रूपक को सुरक्षित रखता है।
- source_word: בַּחֲרוֹת
  choice: जब ... भड़क उठा था
  rationale: ב के साथ infinitive construct कालगत परिस्थिति बताता है; ‘जब ... भड़क उठा था’ आग की अंतर्निहित छवि और पूर्वकालिक परिस्थिति दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אַפָּם
  choice: उनका क्रोध
  rationale: शाब्दिक अर्थ ‘उनकी नाक’ है, पर यह इब्रानी मुहावरे में क्रोध को सूचित करता है; ‘क्रोध’ आधुनिक हिन्दी में स्पष्ट और गरिमापूर्ण है।
- source_word: בָּנוּ
  choice: हमारे विरुद्ध
  rationale: क्रोध के संदर्भ में ב शत्रुतापूर्ण दिशा को दर्शाता है; ‘हमारे विरुद्ध’ उसका स्वाभाविक हिन्दी रूप है।
theological_decisions:
