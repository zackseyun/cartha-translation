  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और काव्यात्मक भाषा रखी गई है। ‘जीवित ही निगल जाते’ मूल रूपक को सीधे बनाए रखता है, जबकि ‘क्रोध ... भड़क उठा’ इब्रानी मुहावरे का स्वाभाविक हिन्दी समतुल्य है।
