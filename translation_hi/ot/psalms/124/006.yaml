  text: याहवे[a] धन्य हो, जिसने हमें उनके दाँतों के लिए शिकार होने को नहीं दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “याहवे धन्य हैं।” इब्रानी आशीर्वाद-सूत्र को कथनात्मक अथवा आशीर्वादात्मक उद्गार के रूप में अनुवाद किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ
  choice: धन्य हैं
  rationale: यह निष्क्रिय कृदन्त यहाँ स्तुतिपरक आशीर्वाद-वाक्य है। हिंदी में ‘धन्य हैं’ स्वाभाविक, गरिमापूर्ण और उपासना-संबंधी बल को बनाए रखता है; ‘स्तुति हो’ आशीष की शब्दावली को सीधे स्तुति में बदल देता।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम को किसी उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: שֶׁלֹּא נְתָנָנוּ
  choice: जिन्होंने हमें ... नहीं बनने दिया
  rationale: मूलतः ‘जिन्होंने हमें ... नहीं दिया’ है। हिंदी में दाँतों को शिकार दिए जाने के रूपक को स्वाभाविक ढंग से व्यक्त करने के लिए ‘नहीं बनने दिया’ चुना गया, जबकि बचाए जाने की पूर्ण घटना स्पष्ट रहती है।
- source_word: טֶרֶף
  choice: शिकार
  rationale: ‘दाँतों’ के संदर्भ में यह संज्ञा हिंस्र पशुओं द्वारा फाड़े जाने वाले शिकार का बिंब प्रस्तुत करती है; ‘लूट’ इस पशु-बिंब को खो देती।
- source_word: לְשִׁנֵּיהֶם
  choice: उनके दाँतों का
  rationale: यह शत्रुओं को हिंस्र पशुओं के रूप में दिखाने वाले ठोस रूपक को बनाए रखता है। ‘उनके द्वारा फाड़े जाने’ जैसा विस्तार बिंब की व्याख्या तो करता, पर मूल की संक्षिप्तता और मूर्तता घटाता।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: इब्रानी पाठ में चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम सीधे आया है। ‘याहवे’ उसे उपाधि से प्रतिस्थापित किए बिना प्रस्तुत करता है; पादटिप्पणी परिचित पारंपरिक विकल्प बताती है।
- issue: בָּרוּךְ की स्तुतिपरक विधि
  choice: धन्य हैं
  alternative: याहवे की स्तुति हो
  rationale: ‘धन्य हैं’ मूल की आशीर्वाद-वाचक शब्दावली को सुरक्षित रखता है। ‘स्तुति हो’ प्रसंगानुकूल है, किंतु आशीष को स्पष्ट स्तुति में बदल देता है।
translation_notes:
  register: आधुनिक मानक हिंदी का संक्षिप्त, गरिमापूर्ण और सामूहिक स्तुति-संबंधी स्वर। पशु-शिकार का मूल रूपक स्पष्ट रखा गया है और वाक्य को हिंदी में सहज बनाने के लिए ‘शिकार नहीं बनने दिया’ प्रयोग किया गया है।
