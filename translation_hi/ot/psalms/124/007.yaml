base_translation:
  language: en
  yaml_path: translation/ot/psalms/124/007.yaml
  text: Our soul has escaped like a bird from the snare of the fowlers[a]; the snare is broken[b], and we have escaped.
translation:
  language: hi
  text: हमारा प्राण[a] चिड़िया के समान बहेलियों[b] के फंदे से बच निकला है; फंदा टूट गया, और हम बच निकले हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “हमारा जीवन” अथवा “हम स्वयं।” इब्रानी נֶפֶשׁ प्राण, जीवन या पूरे व्यक्ति को दर्शा सकता है।
    reason: lexical_alternative
  - marker: b
    text: अर्थात फंदे लगाने वालों।
    reason: lexical_alternative
lexical_decisions:
- source_word: נַפְשֵׁנוּ
  choice: हमारा प्राण
  rationale: נֶפֶשׁ यहाँ सामूहिक रूप से जीवन या पूरे व्यक्ति को दर्शाता है। ‘प्राण’ काव्यात्मक गरिमा और एकवचन रूप को बनाए रखता है तथा आधुनिक ‘आत्मा’ से जुड़ सकने वाले देह–आत्मा विभाजन को अनावश्यक रूप से नहीं लाता।
- source_word: כְּצִפּוֹר
  choice: चिड़िया के समान
  rationale: צִפּוֹר किसी विशेष प्रजाति के बजाय सामान्यतः पक्षी, विशेषकर छोटी चिड़िया, को दर्शाता है; यह रूपक हिंदी में स्वाभाविक है।
- source_word: נִמְלְטָה
  choice: बच निकला है
  rationale: מלט के निफ़अल रूप में संकट या जाल से निकल भागने अथवा छुड़ाए जाने का भाव है। ‘बच निकला है’ फंदे के बिंब और पूर्ण हुई मुक्ति दोनों को व्यक्त करता है।
- source_word: מִפַּח
  choice: फंदे से
  rationale: פַּח पक्षियों को पकड़ने के लिए लगाए गए फंदे या जाल को दर्शाता है; ‘फंदा’ इस चित्र को सटीक और सहज रूप में रखता है।
- source_word: יוֹקְשִׁים
  choice: बहेलियों के
  rationale: यह יקשׁ से बना कर्तृवाचक रूप है और फंदा लगाने वालों को दर्शाता है। पक्षी के तत्काल संदर्भ में ‘बहेलिये’ संक्षिप्त और चित्रात्मक है।
- source_word: הַפַּח
  choice: फंदा
  rationale: इसी शब्द को दोहराने से मूल इब्रानी की पुनरावृत्ति और अब निष्प्रभावी हो चुके खतरे पर दिया गया बल सुरक्षित रहता है।
- source_word: נִשְׁבָּר
  choice: टूट गया
  rationale: यह पूर्ण निष्क्रिय क्रिया है। हिंदी में ‘टूट गया’ स्वाभाविक रूप से उस निर्णायक घटना और उसके परिणाम को व्यक्त करता है।
- source_word: וַאֲנַחְנוּ
  choice: और हम
  rationale: स्पष्ट सर्वनाम मूल पाठ में जोर देता है; ‘और हम’ उस बल को सहज हिंदी में बनाए रखता है।
- source_word: נִמְלָטְנוּ
  choice: बच निकले हैं
  rationale: पहले प्रयुक्त מלט की पुनरावृत्ति को बनाए रखते हुए यह सामूहिक छुटकारे के साथ पद का काव्यात्मक समापन करता है।
