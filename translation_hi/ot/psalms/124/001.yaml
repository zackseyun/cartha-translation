  text: שִׁ֥יר הַֽ/מַּעֲל֗וֹת לְ/דָ֫וִ֥ד לוּלֵ֣י יְ֭הוָה שֶׁ/הָ֣יָה לָ֑/נוּ יֹֽאמַר נָ֝א יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/124/001.yaml
  text: A Song of Ascents[a]. Of David. If Yahweh had not been for us—let Israel now say—
translation:
  language: hi
  text: 'चढ़ाइयों का गीत।[a] दाऊद का।


    यदि याहवे हमारे पक्ष में न होता—


    अब इस्राएल कहे—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात चढ़कर जाने के गीत; संभवतः तीर्थयात्रा में गाए जाने वाले गीत।
    reason: शीर्षक के शाब्दिक अर्थ और संभावित तीर्थयात्रा-संबंधी आशय को स्पष्ट करता है, पर उसे निश्चित नहीं ठहराता।
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: चढ़ाइयों का गीत
  rationale: यह शीर्षक מַעֲלוֹת के मूल अर्थ ‘चढ़ाइयाँ’ को बनाए रखता है और तीर्थयात्रा अथवा उपासना-संबंधी प्रयोग की संभावना को किसी एक अर्थ तक सीमित नहीं करता।
- source_word: לְדָוִד
  choice: दाऊद का
  rationale: לְ उपसर्ग यहाँ रचना, संबंध या समर्पण का संकेत दे सकता है; ‘दाऊद का’ इस अस्पष्टता को ‘दाऊद द्वारा’ या ‘दाऊद के लिए’ की अपेक्षा बेहतर बनाए रखता है।
- source_word: לוּלֵי
  choice: यदि ... न होता
  rationale: यह प्रतिकल्पित शर्त आरंभ करता है, जिसका परिणाम अगले पद में पूरा होता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को पदवी से बदलने के बजाय आधुनिक हिन्दी लिप्यंतरण में प्रस्तुत किया गया है।
- source_word: שֶׁהָיָה לָנוּ
  choice: हमारे लिए न होता
  rationale: यह इब्रानी संरचना के निकट रहते हुए याहवे के इस्राएल के सहायक होने का भाव देती है; अधिक मुहावरेदार अर्थ पादटिप्पणी में दिया गया है।
- source_word: יֹאמַר נָא
  choice: अब ... कहे
  rationale: आज्ञार्थक/प्रेरणार्थक भाव और נָא के आग्रह को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יִשְׂרָאֵל
  choice: इस्राएल
  rationale: वाचा के लोगों और नाम का प्रचलित हिन्दी रूप रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम स्पष्ट रूप से आया है; उसे पदवी ‘प्रभु’ से नहीं बदला गया। ‘याहवे’ स्रोत-नाम के मान्य उच्चारण का सीधा हिन्दी लिप्यंतरण है।
- issue: שֶׁהָיָה לָנוּ का आशय
  choice: हमारे लिए न होता
  alternative: हमारी ओर न होता
  rationale: मुख्य पाठ मूल संरचना के निकट है और समर्थन के भाव को बनाए रखता है, जबकि अधिक मुहावरेदार विकल्प पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामूहिक पाठ के अनुकूल रखी गई है। पंक्ति के अंत के डैश मूल की अधूरी प्रतिकल्पित शर्त को बनाए रखते हैं, जो अगले पद में पूरी होती है।
