lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: चढ़ाइयों का गीत
  rationale: शाब्दिक अर्थ ‘चढ़ाइयों/आरोहणों का गीत’ है। ‘चढ़ाइयों’ से मूल की बहुवचन अभिव्यक्ति बनी रहती है और इसे केवल तीर्थयात्रा या मंदिर की सीढ़ियों से नहीं बाँधा जाता।
- source_word: לְדָוִד
  choice: दाऊद का
  rationale: संक्षिप्त शीर्षकीय रूप मूल के व्यापक संबंध को बनाए रखता है; इसे अनिवार्य रूप से लेखकत्व की विस्तृत घोषणा नहीं बनाया गया।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में आए परमेश्वर के विशिष्ट नाम का नाम के रूप में लिप्यंतरण किया गया है, सामान्य उपाधि से प्रतिस्थापित नहीं।
- source_word: שֶׁהָיָה לָנוּ
  choice: हमारी ओर न होता
  rationale: हिब्रू में शाब्दिक रूप से ‘हमारे लिए/हमारी ओर होता’ है। इस प्रसंग में ‘हमारी ओर’ स्वाभाविक हिन्दी में पक्ष और सहायता का भाव व्यक्त करता है।
- source_word: יֹאמַר נָא יִשְׂרָאֵל
  choice: अब इस्राएल कहे
  rationale: नָא का आग्रहात्मक भाव ‘अब’ से व्यक्त हुआ है, और अधूरा वाक्य तथा आगे की पुनरावृत्ति के लिए मूल की नाटकीय संरचना सुरक्षित रखी गई है।
theological_decisions:
- issue: יְהוָה को नाम या उपाधि के रूप में प्रस्तुत करना
  choice: याहवे
  alternative: प्रभु/यहोवा
  rationale: स्रोत में विशिष्ट दिव्य नाम है; लिप्यंतरण पाठ में नाम और उपाधि का भेद बनाए रखता है।
- issue: לְדָוִד का लेखकत्व-संबंध
  choice: दाऊद का
  alternative: दाऊद द्वारा / दाऊद के लिए
  rationale: हिब्रू संबंधसूचक לְ शीर्षकों में लेखकत्व, समर्पण या संबद्धता का संकेत दे सकता है; ‘दाऊद का’ इस संक्षिप्तता और कुछ हद तक अस्पष्टता को बनाए रखता है।
translation_notes:
