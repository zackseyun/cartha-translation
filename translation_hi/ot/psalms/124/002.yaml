  text: If Yahweh had not been for us when man rose up against us—[a]
translation:
  language: hi
  text: 'यदि यहोवा हमारी ओर न होता,

    जब मनुष्य हमारे विरुद्ध उठ खड़ा हुआ—[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यदि यहोवा हमारे पक्ष में न होता, जब मनुष्य हमारे विरुद्ध उठ खड़ा हुआ—”
    reason: lexical_alternative
lexical_decisions:
- source_word: לוּלֵי
  choice: यदि ... न होता
  rationale: यह पद एक अतीत-विरोधी शर्त आरम्भ करता है, जिसका परिणाम अगले पद में आता है। हिंदी में यह रचना स्वाभाविक और काव्यात्मक है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल में परमेश्वर का व्यक्तिगत नाम टेट्राग्रामटन है; हिंदी में इसका प्रचलित नाम-रूप ‘यहोवा’ रखा गया है, किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: שֶׁהָיָה לָנוּ
  choice: हमारी ओर न होता
  rationale: היה ל־ यहाँ समर्थन या पक्ष में होने का भाव देता है। ‘हमारी ओर’ निकट और स्वाभाविक है, जबकि ‘हमारे पक्ष में’ वैकल्पिक स्पष्ट अर्थ है।
- source_word: בְּקוּם
  choice: जब ... उठ खड़े हुए
  rationale: ב के साथ infinitive construct समय का अर्थ देता है—‘जब’। विरोधी कार्रवाई के प्रसंग में קום का अर्थ ‘उठ खड़ा होना’ है।
- source_word: עָלֵינוּ
  choice: हमारे विरुद्ध
  rationale: शत्रुतापूर्ण प्रसंग में על विरोध का भाव व्यक्त करता है।
- source_word: אָדָם
  choice: मनुष्य
  rationale: एकवचन सामूहिक शब्द मानव आक्रमणकारियों को सामान्य रूप से सूचित करता है। ‘मनुष्य’ मूल के एकवचन रूप और सामूहिक अर्थ दोनों को बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम है। ‘यहोवा’ आधुनिक हिंदी बाइबल-पाठकों में सुबोध और प्रचलित नाम-रूप है; इसे ‘प्रभु’ जैसी उपाधि से बदलने के बजाय नाम के रूप में रखा गया है।
- issue: לָנוּ में समर्थन का भाव
  choice: हमारी ओर
  alternative: हमारे पक्ष में
  rationale: ‘हमारी ओर’ हिब्रू अभिव्यक्ति के निकट रहते हुए समर्थन का भाव देता है; अधिक व्याख्यात्मक विकल्प पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। वाक्य को अगले पद में पूरी होने वाली काव्यात्मक शर्त के रूप में डैश के साथ खुला रखा गया है।
