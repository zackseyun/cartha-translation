  choice: हमारे प्राणों
  alternative: हमारे जीवन; हमारे ऊपर से
  rationale: यहाँ शब्द किसी तकनीकी आत्मा-शरीर सिद्धांत को अनिवार्य नहीं करता। ‘प्राणों’ मूल की काव्यात्मक तीव्रता बनाए रखता है और वैकल्पिक व्यापक अर्थ पादटिप्पणी में दिए जाते हैं।
