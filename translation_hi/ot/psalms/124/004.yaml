lexical_decisions:
- source_word: אֲזַי
  choice: तब
  rationale: यह पिछले पद से चल रहे काल्पनिक परिणाम को स्वाभाविक और संक्षिप्त ढंग से आगे बढ़ाता है।
- source_word: הַמַּיִם
  choice: जल
  rationale: हिन्दी में सामूहिक एकवचन ‘जल’ मूल के बहुवचन ‘जलराशियों’ की बाढ़-संबंधी छवि को स्वाभाविक काव्यात्मक भाषा में व्यक्त करता है।
- source_word: שְׁטָפוּנוּ
  choice: हमें बहा ले जाता
  rationale: क्रिया में बाढ़ द्वारा डुबोने या बहा ले जाने का भाव है; प्रसंग के प्रतिकल्पित अर्थ को ‘ले जाता’ व्यक्त करता है।
- source_word: נַחְלָה
  choice: धारा
  rationale: यह शब्द नाले, जलधारा या तेज़ बहाव का संकेत दे सकता है; ‘धारा’ मूल अर्थ के निकट रहते हुए हिन्दी में सहज है।
- source_word: עָבַר עַל
  choice: के ऊपर से गुज़र जाती
  rationale: यह मूल क्रिया और पूर्वसर्ग की ‘ऊपर से पार होने’ वाली स्थानिक छवि को बनाए रखता है।
- source_word: נַפְשֵׁנוּ
  choice: हमारे प्राणों
  rationale: נֶפֶשׁ यहाँ पूरे व्यक्ति या जीवन को सूचित कर सकता है। ‘प्राणों’ काव्यात्मक रूप बनाए रखता है, जबकि पादटिप्पणी व्यापक अर्थ स्पष्ट करती है।
theological_decisions:
