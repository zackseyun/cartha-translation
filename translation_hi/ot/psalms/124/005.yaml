- source_word: הַזֵּידוֹנִים
  choice: उफनता हुआ
  rationale: विशेषण का मूल भाव अभिमानी, उद्दण्ड या धृष्ट होना है। जल के लिए रूपकात्मक प्रयोग में ‘उफनता हुआ’ उसकी हिंसक, दबंग शक्ति को सामान्य हिन्दी में व्यक्त करता है; अधिक शाब्दिक विकल्प पादटिप्पणी में दिया गया है।
