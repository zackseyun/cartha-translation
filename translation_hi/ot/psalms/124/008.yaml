  text: हमारी सहायता आकाश और पृथ्वी के रचयिता याहवे[a] के नाम में है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में ईश्वर का नाम चार व्यंजनों YHWH से लिखा गया है।
    reason: ईश्वरीय नाम के मूल इब्रानी रूप की जानकारी।
lexical_decisions:
- source_word: עֶזְרֵנוּ
  choice: हमारी सहायता
  rationale: संज्ञा עֵזֶר पर प्रथम पुरुष बहुवचन प्रत्यय लगा है; यहाँ अर्थ किसी ‘सहायक’ व्यक्ति का नहीं, बल्कि मिलने वाली सहायता का है।
- source_word: בְּשֵׁם
  choice: के नाम में
  rationale: בְּ के साथ שֵׁם भरोसे और आह्वान के आधार को व्यक्त करता है। ‘के नाम में’ मूल रूपक और उपासना-संबंधी भाव दोनों को बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में ईश्वर का व्यक्तिगत नाम YHWH है। ‘याहवे’ उसे किसी उपाधि से बदलने के बजाय नाम के रूप में प्रस्तुत करता है।
- source_word: עֹשֵׂה
  choice: रचयिता
  rationale: कर्तृवाचक कृदन्त याहवे की विशिष्ट और स्थायी क्रिया बताता है; ‘रचयिता’ इसे केवल भूतकाल की घटना बनाने के बजाय संक्षिप्त और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: שָׁמַיִם וָאָרֶץ
  choice: आकाश और पृथ्वी
  rationale: यह समस्त सृष्टि को समेटने वाला प्रचलित युग्म है; शाब्दिक चित्र और व्यापक अर्थ दोनों सुरक्षित रहते हैं।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: पद में YHWH नाम स्वयं उपस्थित है। उसे ‘याहवे’ लिखने से व्यक्तिगत वाचा-नाम बना रहता है और उसे किसी उपाधि से चुपचाप नहीं बदला जाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘के नाम में’ मूल की धार्मिक और काव्यात्मक अभिव्यक्ति को जानबूझकर बनाए रखता है।
