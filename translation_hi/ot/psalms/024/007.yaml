base_translation:
  language: en
  yaml_path: translation/ot/psalms/024/007.yaml
  text: Lift up your heads[a], O gates, and be lifted up, O ancient doors, that the King of glory may come in.
translation:
  language: hi
  text: हे फाटकों, अपने सिर उठाओ; हे प्राचीन द्वारों,[a] ऊँचे उठ जाओ, ताकि महिमा का राजा भीतर आए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सनातन द्वार।” इब्रानी पदबंध बहुत पुराने अथवा सदा बने रहने वाले द्वारों का अर्थ दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂאוּ
  choice: ऊँचे करो
  rationale: नָשָׂא के बहुवचन आज्ञार्थक रूप को व्यक्त करता है और फाटकों से किए गए सजीव काव्यात्मक संबोधन को बनाए रखता है।
- source_word: שְׁעָרִים
  choice: फाटको
  rationale: नगर या पवित्र स्थान के बड़े प्रवेश-द्वारों के लिए स्वाभाविक हिन्दी शब्द; संबोधन के कारण बहुवचन संबोधन-रूप प्रयुक्त है।
- source_word: רָאשֵׁיכֶם
  choice: अपने सिर
  rationale: शाब्दिक बिंब 'तुम्हारे सिर' को स्वाभाविक हिन्दी में सुरक्षित रखता है और उसे केवल स्थापत्यगत 'ऊपरी भाग' कहकर सपाट नहीं करता।
- source_word: וְהִנָּשְׂאוּ
  choice: ऊँचे उठ जाओ
  rationale: निफ़ाल आज्ञार्थक के उठाए जाने अथवा उठने के भाव को सहज हिन्दी में व्यक्त करता है और पहली पंक्ति की काव्यात्मक प्रतिध्वनि बनाए रखता है।
- source_word: פִּתְחֵי עוֹלָם
  choice: प्राचीन द्वारो
  rationale: פִּתְחֵי को समानांतर पद 'फाटक' के साथ 'द्वार' और עוֹלָם को यहाँ दीर्घ प्राचीनता के अर्थ में लिया गया है; अनन्तकालीन होने की सम्भावना पादटिप्पणी में सुरक्षित है।
- source_word: וְיָבֹא
  choice: ताकि ... भीतर आए
  rationale: आज्ञाओं के बाद प्रयोजन या परिणाम को स्वाभाविक रूप से व्यक्त करता है; 'भीतर' प्रवेश का निहित भाव स्पष्ट करता है।
- source_word: מֶלֶךְ הַכָּבוֹד
  choice: महिमा का राजा
  rationale: इब्रानी संबंध-वाचक पदबंध को निकटता से सुरक्षित रखता है और राजकीय तथा स्तुतिपरक गरिमा बनाए रखता है।
theological_decisions:
- issue: मानवीकरण और राजकीय प्रवेश के बिंब को बिना संकीर्ण व्याख्या के सुरक्षित रखना
  choice: फाटकों और द्वारों को सीधे संबोधित करते हुए उनके 'सिर' का काव्यात्मक बिंब बनाए रखा गया है।
  alternative: इसे अधिक व्याख्यात्मक रूप से केवल 'फाटक खोल दो' कहना।
  rationale: मूल इब्रानी सीधे फाटकों और द्वारों को संबोधित करता है। इस मानवीकरण को बनाए रखने से किसी विशेष ऐतिहासिक या मसीही पहचान को अनुवाद में आरोपित किए बिना भजन की काव्यात्मक और उपासना-संबंधी शक्ति सुरक्षित रहती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमामय काव्यात्मक शैली रखी गई है। 'हे ...' संबोधन और 'महिमा का राजा' भजन के ऊँचे उपासना-भाव को बनाए रखते हैं, जबकि वाक्यरचना साधारण पाठक के लिए स्पष्ट है।
