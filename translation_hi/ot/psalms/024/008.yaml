source:
  edition: WLC
  text: מִ֥י זֶה֮ מֶ֤לֶךְ הַ/כָּ֫ב֥וֹד יְ֭הוָה עִזּ֣וּז וְ/גִבּ֑וֹר יְ֝הוָ֗ה גִּבּ֥וֹר מִלְחָמָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/024/008.yaml
  text: Who is this King of glory? Yahweh[a], strong and mighty; Yahweh, mighty in battle.
translation:
  language: hi
  text: यह महिमा का राजा कौन है? याहवे, बलवान और पराक्रमी; याहवे, युद्ध में पराक्रमी[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “युद्ध में वीर।”
    reason: גִּבּוֹר מִלְחָמָה को विशेषणात्मक ‘युद्ध में पराक्रमी’ या अधिक संज्ञात्मक भाव से ‘युद्ध में वीर’ समझा जा सकता है।
lexical_decisions:
- source_word: מִי זֶה
  choice: यह कौन है
  rationale: प्रश्नवाचक מִי और संकेतवाचक זֶה के मुहावरेदार मेल को स्वाभाविक हिन्दी में रखा गया है; इससे भजन की प्रश्नोत्तर शैली बनी रहती है।
- source_word: מֶלֶךְ הַכָּבוֹד
  choice: महिमा का राजा
  rationale: इब्रानी संबंधसूचक पदबंध को निकटता से व्यक्त करता है और इसे केवल ‘महिमामय राजा’ बनाकर इसके उपाधिस्वरूप बल को कम नहीं करता।
- source_word: יְהוָה
  choice: याहवे
  rationale: चतुर्वर्णी दिव्य नाम को किसी उपाधि से बदलने के बजाय आधुनिक हिन्दी में उसके प्रचलित लिप्यंतरण से व्यक्त किया गया है।
- source_word: עִזּוּז
  choice: बलवान
  rationale: यह शब्द प्रबल सामर्थ्य का बोध कराता है; ‘बलवान’ अगले גִבּוֹר से भेद बनाए रखते हुए सहज हिन्दी देता है।
- source_word: וְגִבּוֹר
  choice: और पराक्रमी
  rationale: גִבּוֹר में सामर्थ्य और वीरता दोनों का भाव है। ‘पराक्रमी’ इस भाव को व्यक्त करता है और अगले युद्ध-संबंधी प्रयोग के साथ समानांतरता बनाए रखता है।
- source_word: גִּבּוֹר מִלְחָמָה
  choice: युद्ध में पराक्रमी
  rationale: यह अनुवाद विशेषण और ‘युद्ध’ के संबंध को बनाए रखता है तथा मूल में स्पष्ट रूप से न आए ‘योद्धा’ जैसे संज्ञा-पद को नहीं जोड़ता।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में परमेश्वर का निजी नाम सीधे आया है। ‘याहवे’ उसे उपाधि से प्रतिस्थापित किए बिना प्रस्तुत करता है; ‘यहोवा’ एक पारंपरिक वैकल्पिक लिप्यंतरण है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल रखी गई है। प्रश्नोत्तर की लय और दोनों अर्धपंक्तियों की समानांतरता सुरक्षित है।
