  yaml_path: translation/ot/psalms/024/003.yaml
  text: Who may ascend the mountain of Yahweh? And who may stand in his holy place?[a]
translation:
  language: hi
  text: याहवे के पर्वत पर कौन चढ़ सकता है? और उसके पवित्र स्थान में कौन खड़ा हो सकता है?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “याहवे की पहाड़ी।” इब्रानी शब्द הַר का अर्थ “पर्वत” या “पहाड़ी” हो सकता है; यहाँ “पर्वत” रखा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי
  choice: कौन
  rationale: यह प्रश्नवाचक सर्वनाम उस व्यक्ति के विषय में अलंकारिक प्रश्न आरम्भ करता है जो परमेश्वर की उपस्थिति में आने के योग्य है।
- source_word: יַעֲלֶה
  choice: चढ़ सकता है
  rationale: עלה का मूल अर्थ ‘ऊपर जाना/चढ़ना’ है। इस उपासना-संबंधी प्रश्न में ‘सकता है’ केवल भावी कार्य नहीं, बल्कि पात्रता की ओर संकेत करता है।
- source_word: בְהַר
  choice: पर्वत पर
  rationale: הַר का अर्थ ‘पर्वत’ या ‘पहाड़ी’ हो सकता है। यहाँ ‘पर्वत’ सिय्योन के लिए गरिमापूर्ण और प्रचलित हिंदी रूप है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिंदी में ध्वन्यात्मक रूप से प्रस्तुत किया गया है।
- source_word: וּמִי
  choice: और ... कौन
  rationale: संयोजक और प्रश्नवाचक सर्वनाम को बनाए रखकर दोनों काव्य-पंक्तियों की समानांतर रचना सुरक्षित रखी गई है।
- source_word: יָקוּם
  choice: खड़ा हो सकता है
  rationale: קום का अर्थ ‘उठना/खड़ा होना’ है। यहाँ पवित्र स्थान में उपस्थित होने या अपना स्थान लेने का भाव है; ‘सकता है’ पात्रता को व्यक्त करता है।
- source_word: בִּמְקוֹם
  choice: स्थान में
  rationale: מָקוֹם का सामान्य अर्थ ‘स्थान’ है। इसे ‘पवित्रस्थान’ या ‘मन्दिर’ बनाकर अर्थ को आवश्यकता से अधिक विशिष्ट नहीं किया गया।
- source_word: קָדְשׁוֹ
  choice: उसके पवित्र
  rationale: यह रूप ‘उसका पवित्र [स्थान]’ बताता है। हिंदी में ‘उसके पवित्र स्थान’ स्वाभाविक है और मूल के संबंधसूचक प्रत्यय को बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम है। ‘याहवे’ उसे उपाधि से प्रतिस्थापित किए बिना प्रस्तुत करता है।
- issue: अपूर्ण क्रियाओं יַעֲלֶה और יָקוּם का भाव
  choice: चढ़ सकता है / खड़ा हो सकता है
  alternative: चढ़ेगा / खड़ा होगा
  rationale: प्रश्न केवल भविष्य में होने वाली क्रिया के बारे में नहीं, बल्कि याहवे की उपस्थिति में आने की पात्रता के बारे में है। ‘सकता है’ इस उपासना-संबंधी भाव को व्यक्त करता है, पर पात्रता का आधार अगले पद के लिए खुला छोड़ता है।
