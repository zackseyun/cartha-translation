  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। दोनों प्रश्नों की काव्यात्मक समानता बनाए रखी गई है; ‘पवित्र स्थान’ मूल की व्यापकता को सुरक्षित रखता है।
