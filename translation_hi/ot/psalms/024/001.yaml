  yaml_path: translation/ot/psalms/024/001.yaml
  text: A psalm of David[a]. The earth and its fullness are Yahweh’s[b], the world and those who dwell in it.
translation:
  language: hi
  text: 'दाऊद का भजन।


    पृथ्वी और जो कुछ उसमें है, याहवे का है;

    जगत और उसमें रहनेवाले भी याहवे के हैं।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְדָוִד
  choice: दाऊद का
  rationale: לְ उपसर्ग रचनाकार, संबंध या समर्पण का संकेत दे सकता है। ‘दाऊद का’ इस स्वाभाविक शीर्षकीय अस्पष्टता को बनाए रखता है।
- source_word: מִזְמוֹר
  choice: भजन
  rationale: भजन-संग्रह के शीर्षक में प्रयुक्त इस मानक पद के लिए ‘भजन’ सटीक, परिचित और स्वाभाविक हिंदी है।
- source_word: לַיהוָה
  choice: यहोवा का है
  rationale: इब्रानी संबंधसूचक पदबंध स्वामित्व बताता है। हिंदी में ‘यहोवा का है’ स्पष्ट और स्वाभाविक है तथा दैवी नाम को नाम के रूप में प्रस्तुत करता है।
- source_word: הָאָרֶץ
  choice: पृथ्वी
  rationale: תֵּבֵל के समानांतर और पद के सार्वभौमिक विस्तार के कारण यहाँ ‘देश’ के बजाय ‘पृथ्वी’ उपयुक्त है।
- source_word: וּמְלוֹאָהּ
  choice: और जो कुछ उसमें है
  rationale: מְלוֹא का शाब्दिक अर्थ ‘परिपूर्णता/भराव’ है, पर इस प्रसंग में यह पृथ्वी में समाई सारी वस्तुओं को सूचित करता है। यह हिंदी अर्थ को स्वाभाविक ढंग से व्यक्त करती है।
- source_word: תֵּבֵל
  choice: जगत
  rationale: यह पद व्यवस्थित अथवा आबाद संसार को दर्शाता है। ‘जगत’ काव्यात्मक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य है।
- source_word: וְיֹשְׁבֵי בָהּ
  choice: और उसमें रहनेवाले भी
  rationale: यह कृदंतीय पदबंध उसमें निवास करनेवालों को दर्शाता है; ‘रहनेवाले’ इसकी क्रियात्मक शक्ति को बनाए रखता है। ‘भी’ पहले अर्ध-पद की स्वामित्व-विधेयता को स्वाभाविक रूप से दूसरे तक पहुँचाता है।
theological_decisions:
- issue: दैवी नाम יְהוָה का रूपांतरण
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में चतुरक्षरीय दैवी नाम प्रत्यक्ष रूप से है। ‘प्रभु’ कहने के बजाय नाम को नाम के रूप में रखना स्रोत के भेद को सुरक्षित करता है; हिंदी बाइबलीय प्रयोग में ‘यहोवा’ व्यापक रूप से परिचित रूप है, यद्यपि ‘याहवे’ अधिक संभावित विद्वत् पुनर्निर्माण है।
- issue: पृथ्वी और उसमें समाई वस्तुओं पर स्वामित्व
  choice: वह यहोवा का है
  alternative: पृथ्वी यहोवा की है, और उसकी भरपूरी भी
  rationale: इब्रानी में स्पष्ट क्रिया नहीं है और הָאָרֶץ וּמְלוֹאָהּ संयुक्त विषय के रूप में लिया जा सकता है। एकवचन ‘वह’ इस संपूर्ण इकाई का निर्देश करता है और मूल के संक्षिप्त स्वामित्व-विधान को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी में संक्षिप्त, गरिमापूर्ण काव्य-रजिस्टर रखा गया है। शीर्षक को अलग पंक्ति में और पद के दो समानांतर अर्धांशों को अलग पंक्तियों में प्रस्तुत किया गया है। कोई पादटिप्पणी आवश्यक नहीं मानी गई।
