  yaml_path: translation/ot/psalms/024/009.yaml
  text: Lift up your heads[a], O gates, and be lifted up, O ancient doors, that the King of glory may come in.
translation:
  language: hi
  text: हे फाटकों, अपने सिर ऊँचे उठाओ; हे प्राचीन द्वारों[a], ऊँचे उठो, ताकि महिमा का राजा भीतर आए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सनातन द्वार।” इब्रानी पद बहुत पुराने अथवा चिरस्थायी द्वारों का बोध करा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂאוּ
  choice: ऊँचे करो
  rationale: बहुवचन आज्ञार्थक क्रिया को बनाए रखता है और फाटकों को किए गए काव्यात्मक संबोधन में स्वाभाविक हिंदी देता है।
- source_word: שְׁעָרִים
  choice: फाटको
  rationale: नगर या पवित्र स्थान के बड़े प्रवेश-द्वारों के लिए मानक और काव्यात्मक संबोधन।
- source_word: רָאשֵׁיכֶם
  choice: अपने सिर
  rationale: इब्रानी के शाब्दिक रूपक को वास्तु-संबंधी व्याख्या में बदले बिना सुरक्षित रखता है।
- source_word: וּשְׂאוּ
  choice: ऊँचे उठ जाओ
  rationale: दूसरी समानांतर आज्ञा और द्वारों के मानवीकरण को सहज आधुनिक हिंदी में व्यक्त करता है।
- source_word: פִּתְחֵי עוֹלָם
  choice: सनातन द्वारो
  rationale: עוֹלָם की दीर्घकालिकता या प्राचीनता की अर्थ-सीमा को समेटने वाला प्रतिष्ठित हिंदी पद; वैकल्पिक अर्थ 'प्राचीन द्वार' पादटिप्पणी में दिया गया है।
- source_word: וְיָבֹא
  choice: ताकि ... भीतर आए
  rationale: आज्ञाओं के बाद उद्देश्य या परिणाम का भाव स्पष्ट करता है और प्रवेश करने की दिशा को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: מֶלֶךְ הַכָּבוֹד
  choice: महिमा का राजा
  rationale: समासिक उपाधि को औपचारिक रूप से सुरक्षित रखता है और भजन में उसकी ऊँची काव्यात्मक गरिमा बनाए रखता है।
theological_decisions:
- issue: फाटकों के 'सिर' होने के मानवीकरण और रूपक को बनाए रखना
  choice: मुख्य पाठ में 'अपने सिर ऊँचे करो' रखा गया
  alternative: '''पूरी तरह खुल जाओ'' जैसे वास्तु-संबंधी भावानुवाद'
  rationale: मूल इब्रानी स्पष्ट रूप से फाटकों का मानवीकरण करके 'सिर' कहती है; इसे बनाए रखने से काव्यात्मक और उपासना-संबंधी प्रभाव सुरक्षित रहता है।
- issue: פִּתְחֵי עוֹלָם में עוֹלָם का अर्थ
  choice: मुख्य पाठ में 'सनातन द्वार'
  alternative: '''प्राचीन द्वार'''
  rationale: यहाँ शब्द दीर्घकाल, पुरातनता अथवा चिरस्थायित्व सूचित कर सकता है। मुख्य पाठ एक प्रतिष्ठित और संक्षिप्त रूप रखता है, जबकि वास्तविक वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण काव्यात्मक संबोधन रखा गया है। 'हे ... ओ' की पुनरावृत्ति से बचते हुए दोनों संबोधनों में 'हे' प्रयोग किया गया है। रूपक, समानांतरता और उद्देश्य-वाक्य को स्पष्ट तथा सहज रखा गया है।
