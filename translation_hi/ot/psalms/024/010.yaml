  yaml_path: translation/ot/psalms/024/010.yaml
  text: Who is this King of glory? Yahweh of hosts—he is the King of glory[b][a]. Selah
translation:
  language: hi
  text: 'यह महिमा का राजा कौन है?


    सेनाओं का याहवे—वही महिमा का राजा है।[a]


    सेला।[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘सेनाओं का याहवे’ का अनुवाद ‘सेनाओं का प्रभु’ भी किया जा सकता है। इब्रानी उपाधि का संकेत व्यापक रूप से स्वर्गीय सेनाओं या व्यवस्थित शक्तियों की ओर भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘सेला’ सम्भवतः संगीत या उपासना से जुड़ा कोई संकेत है; इसका ठीक अर्थ अनिश्चित है।
    reason: cultural_note
lexical_decisions:
- source_word: מִי הוּא זֶה
  choice: यह ... कौन है?
  rationale: प्रश्नवाचक शब्द, सर्वनाम और संकेतवाचक के बल को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: מֶלֶךְ הַכָּבוֹד
  choice: महिमा का राजा
  rationale: इब्रानी संबंधवाचक संरचना को बनाए रखता है और כָּבוֹד के महिमा, गौरव और प्रतिष्ठा-संबंधी अर्थ को समेटता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम का लिप्यंतरण है; इसके स्थान पर कोई उपाधि नहीं रखी गई।
- source_word: צְבָאוֹת
  choice: सेनाओं का
  rationale: बहुवचन צְבָאוֹת का सीधा और सामान्य हिन्दी रूप है; इसके सम्भावित व्यापक आशय को पादटिप्पणी में स्पष्ट किया गया है।
- source_word: הוּא
  choice: वही
  rationale: स्पष्ट इब्रानी सर्वनाम के पहचानसूचक और बलात्मक प्रभाव को स्वाभाविक हिन्दी में व्यक्त करता है, बिना अनावश्यक रूप से 'केवल' जोड़कर अर्थ को सीमित किए।
- source_word: סֶלָה
  choice: सेला
  rationale: इस संगीतात्मक अथवा उपासना-संबंधी संकेत का ठीक अर्थ अनिश्चित है, इसलिए इसका लिप्यंतरण रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु; यहोवा
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम सीधे आया है; उसे उपाधि से बदलने के बजाय हिन्दी में लिप्यंतरित किया गया है।
- issue: उपाधि יְהוָה צְבָאוֹת का आशय
  choice: सेनाओं का याहवे
  alternative: समस्त सेनाओं का याहवे; स्वर्गीय सेनाओं का याहवे
  rationale: ‘सेनाओं’ मूल बहुवचन के निकट है और यह तय नहीं करता कि आशय केवल पृथ्वी की सेनाओं से है या स्वर्गीय शक्तियों से भी।
