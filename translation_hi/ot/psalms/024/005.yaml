source:
  edition: WLC
  text: יִשָּׂ֣א בְ֭רָכָה מֵ/אֵ֣ת יְהוָ֑ה וּ֝/צְדָקָ֗ה מֵ/אֱלֹהֵ֥י יִשְׁעֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/024/005.yaml
  text: He will receive blessing from Yahweh[a], and righteousness from the God of his salvation.
translation:
  language: hi
  text: उसे याहवे से आशीष और उसके उद्धार के परमेश्वर से धार्मिकता[a] मिलेगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “निर्दोष ठहराया जाना” अथवा “न्याय।” इब्रानी शब्द नैतिक धार्मिकता के साथ-साथ न्यायिक और उद्धारकारी अर्थ भी व्यक्त कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשָּׂא
  choice: मिलेगी
  rationale: नָשָׂא का मूल अर्थ ‘उठाना/ले जाना’ है, पर ‘आशीष’ जैसी अमूर्त वस्तु के साथ इसका मुहावरेदार अर्थ ‘पाना’ या ‘प्राप्त करना’ है। हिंदी में ‘उसे … मिलेगी’ स्वाभाविक रूप से यही भाव व्यक्त करता है।
- source_word: בְרָכָה
  choice: आशीष
  rationale: एकवचन को बनाए रखते हुए यह बְּרָכָה का मानक, गरिमापूर्ण और सामान्य हिंदी रूप है।
- source_word: מֵאֵת יְהוָה
  choice: याहवे से
  rationale: מֵאֵת स्रोत को सूचित करता है; यְהוָה को उसके व्यक्तिगत वाचा-नाम ‘याहवे’ के रूप में लिप्यंतरित किया गया है।
- source_word: וּצְדָקָה
  choice: और … धार्मिकता
  rationale: צְדָקָה में धार्मिकता, न्याय और अनुकूल न्यायिक निर्णय—इन सबकी अर्थ-छायाएँ हो सकती हैं। ‘धार्मिकता’ इसकी व्यापकता को मुख्य पाठ में सबसे अच्छी तरह बनाए रखती है; अन्य संभावनाएँ पादटिप्पणी में दी गई हैं।
- source_word: מֵאֱלֹהֵי יִשְׁעוֹ
  choice: उसके उद्धार के परमेश्वर से
  rationale: यह रूप इब्रानी संबंधवाचक संरचना ‘उसके उद्धार के परमेश्वर’ को सुरक्षित रखता है और परमेश्वर को उद्धार का स्रोत अथवा उद्धारकारी परमेश्वर—दोनों रूपों में समझे जाने की गुंजाइश देता है।
- source_word: יִשְׁעוֹ
  choice: उसके उद्धार
  rationale: יֵשַׁע उद्धार, छुटकारा या विजय का बोध करा सकता है। ‘उद्धार’ इस भजन के धार्मिक संदर्भ और शब्द की व्यापकता के अनुकूल है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम सीधे प्रयुक्त हुआ है। ‘याहवे’ उसका निकट लिप्यंतरण है और उसे किसी उपाधि से नहीं बदलता।
- issue: इस संदर्भ में צְדָקָה का अर्थ
  choice: धार्मिकता
  alternative: निर्दोष ठहराया जाना; न्याय
  rationale: पद बताता है कि योग्य उपासक परमेश्वर से क्या पाता है। ‘धार्मिकता’ नैतिक, वाचागत और न्यायिक अर्थ-क्षेत्र को अनावश्यक रूप से संकुचित नहीं करती; वास्तविक वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित हैं।
translation_notes:
  register: आधुनिक मानक हिंदी का सरल, गरिमापूर्ण और काव्यात्मक वाक्य-विन्यास अपनाया गया है। ‘उसे … मिलेगी’ इब्रानी मुहावरे का स्वाभाविक हिंदी रूप है, जबकि ‘उसके उद्धार के परमेश्वर’ मूल की संबंधवाचक संरचना और उसकी अर्थगत खुलावट को बनाए रखता है।
