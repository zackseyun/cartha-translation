  text: A psalm of David[a]. Yahweh's is the earth and its fullness[b], the world and those who dwell in it.
translation:
  language: hi
  text: 'दाऊद का भजन।


    यहोवा के हैं पृथ्वी और उसमें जो कुछ है,

    संसार और उसमें रहनेवाले।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְדָוִד מִזְמוֹר
  choice: दाऊद का भजन
  rationale: शीर्षक का स्वाभाविक और संक्षिप्त हिंदी रूप; לְ का संबंधसूचक अर्थ बनाए रखता है, बिना रचनाकारिता के प्रश्न को आवश्यकता से अधिक निश्चित किए।
- source_word: לַיהוָה
  choice: यहोवा का है
  rationale: दिव्य नाम יהוה को सामान्य हिंदी बाइबलीय लिप्यंतरण 'यहोवा' से व्यक्त किया गया है और संबंधसूचक रचना को स्वाभाविक हिंदी वाक्य में रखा गया है।
- source_word: הָאָרֶץ וּמְלוֹאָהּ
  choice: पृथ्वी और जो कुछ उसमें है
  rationale: מְלוֹאָהּ का आशय पृथ्वी की समस्त सामग्री या उसमें भरी हर वस्तु से है; यह रूप आधुनिक हिंदी में स्पष्ट और स्वाभाविक है।
- source_word: תֵּבֵל
  choice: संसार
  rationale: यहाँ बसाई हुई दुनिया के अर्थ में प्रचलित और काव्यात्मक हिंदी समतुल्य।
- source_word: וְיֹשְׁבֵי בָהּ
  choice: और उसमें रहनेवाले भी
  rationale: संसार के निवासियों को सहज हिंदी में व्यक्त करता है; 'भी' समानांतर पंक्ति के निहित स्वामित्व-विधान को स्पष्ट करता है।
theological_decisions:
- issue: दाऊद से शीर्षक का संबंध
  choice: दाऊद का भजन
  alternative: दाऊद के लिए भजन
  rationale: हिब्रू לְדָוִד संबंध के प्रकार को पूर्णतः निर्दिष्ट नहीं करता। मुख्य पाठ में पारंपरिक, स्वाभाविक रूप रखा गया है, पर इसे निजी सिद्धांत के रूप में अधिक स्पष्ट नहीं किया गया।
- issue: יהוה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ में व्यक्तिगत दिव्य नाम है; उसे उपाधि में बदलने के बजाय हिंदी में परिचित नाम-रूप से संरक्षित किया गया है।
translation_notes:
  register: आधुनिक मानक हिंदी, गरिमापूर्ण और सरल काव्यात्मक शैली। हिब्रू की दो समानांतर पंक्तियाँ संरक्षित हैं; दूसरी पंक्ति में निहित 'यहोवा का है' को 'भी' से स्वाभाविक रूप में संकेतित किया गया है।
