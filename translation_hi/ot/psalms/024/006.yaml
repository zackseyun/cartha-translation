  yaml_path: translation/ot/psalms/024/006.yaml
  text: Such is the generation of those who seek him, who seek your face, O Jacob. Selah
translation:
  language: hi
  text: 'यही उन लोगों की पीढ़ी है जो उसकी खोज करते हैं,

    जो तेरे मुख की खोज करते हैं—हे याकूब[a]। सेला।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में केवल ‘याकूब’ है। इसका अर्थ संबोधन, ‘हे याकूब,’ हो सकता है; कुछ लोग इसे खोजने वालों की पहचान—‘याकूब’ या ‘याकूब की संतान’—मानते हैं। कुछ प्राचीन अनुवाद ‘याकूब के परमेश्वर’ समझते हैं, पर ‘परमेश्वर’ शब्द इब्रानी पाठ में नहीं है।
    reason: मूल के कठिन और बहुअर्थी वाक्यगत संबंध को बताए बिना किसी एक व्याख्या को निर्णायक न बनाने के लिए।
lexical_decisions:
- source_word: דּוֹר
  choice: पीढ़ी
  rationale: मूल शब्द किसी काल की पीढ़ी या समान चरित्र वाले लोगों के समूह को दर्शा सकता है; ‘पीढ़ी’ इस काव्यात्मक व्यापकता को बनाए रखता है।
- source_word: דֹּרְשָׁיו
  choice: जो उसकी खोज करते हैं
  rationale: प्रत्यय तीसरे पुरुष एकवचन (‘उसकी/उसे’) का है; अगले पद के दूसरे पुरुष ‘तेरे’ के साथ मूल में उपस्थित पुरुष-परिवर्तन को सुरक्षित रखा गया है।
- source_word: מְבַקְשֵׁי פָנֶיךָ
  choice: जो तेरे मुख की खोज करते हैं
  rationale: ‘मुख’ परमेश्वर की उपस्थिति और अनुग्रह की खोज का ठोस इब्रानी रूपक है; इसे केवल ‘तुझे खोजते हैं’ बनाकर रूपक हटाया नहीं गया।
- source_word: סֶלָה
  choice: सेला
  rationale: इस संगीतात्मक या उपासना-संबंधी संकेत का निश्चित अर्थ अनिश्चित है, इसलिए पारंपरिक लिप्यंतरण रखा गया है।
theological_decisions:
- issue: יַעֲקֹב का वाक्यगत संबंध
  choice: हे याकूब
  alternative: याकूब की संतान / याकूब के परमेश्वर
  rationale: व्यंजनात्मक पाठ में केवल ‘याकूब’ है; ‘परमेश्वर’ जोड़ना स्पष्टिकरण तो देता है, पर मूल में अनुपस्थित शब्द और एक विशिष्ट व्याख्या आयात करता है। संबोधन मूल की कठिनता और अस्पष्टता को अधिक निकटता से सुरक्षित रखता है।
- issue: ‘उसकी’ से ‘तेरे’ में पुरुष-परिवर्तन
  choice: दोनों सर्वनाम ज्यों के त्यों रखे गए
  alternative: दोनों को एक ही पुरुष में समरूप करना
  rationale: इब्रानी कविता में वास्तव में तीसरे पुरुष से दूसरे पुरुष का परिवर्तन है; इसे सहज बनाने के लिए समरूप करना स्रोत की साहित्यिक और धर्मवैचारिक तनावशीलता मिटा देता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और काव्यात्मक हिन्दी। समानांतर पंक्तियाँ तथा ‘मुख’ का बाइबिलीय रूपक बनाए गए हैं। ‘हे याकूब’ जानबूझकर कुछ कठिन रखा गया है और पादटिप्पणी में विकल्प बताए गए हैं।
