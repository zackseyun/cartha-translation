base_translation:
  language: en
  yaml_path: translation/ot/psalms/024/002.yaml
  text: For he founded it upon the seas[a], and established it upon the rivers.
translation:
  language: hi
  text: क्योंकि उसने उसकी नींव समुद्रों पर डाली[a], और उसे नदियों पर दृढ़ किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्योंकि उसने उसे समुद्रों पर स्थापित किया और नदियों पर दृढ़ किया।”
    reason: יְסָדָהּ के लिए ‘नींव डाली’ के स्थान पर वैकल्पिक शब्दार्थ ‘स्थापित किया’।
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले पद में पृथ्वी पर प्रभु के अधिकार का कारण बताता है; ‘क्योंकि’ हिन्दी में इस संबंध को स्पष्ट और स्वाभाविक रखता है।
- source_word: הוּא
  choice: उसी ने
  rationale: स्वतंत्र सर्वनाम के बल को ‘उसी’ से व्यक्त किया गया है, जिससे कर्ता पर मूल का जोर बना रहता है।
- source_word: עַל יַמִּים
  choice: समुद्रों पर
  rationale: बहुवचन יַמִּים का सीधा अर्थ ‘समुद्र’ है; ‘पर’ काव्यात्मक सृष्टि-चित्र को बिना आधुनिक व्याख्या थोपे सुरक्षित रखता है।
- source_word: יְסָדָהּ
  choice: उसे ... नींव दी
  rationale: יסד नींव डालने या स्थापित करने का भाव देता है; स्त्रीलिंग प्रत्यय पिछले पद की ‘पृथ्वी’ की ओर संकेत करता है। यह हिन्दी प्रयोग मूल बिंब को स्पष्ट रखता है।
- source_word: וְעַל נְהָרוֹת
  choice: और नदियों पर
  rationale: यह पहली पंक्ति की समानांतर संरचना बनाए रखता है; נְהָרוֹת का सामान्य और पारदर्शी अर्थ ‘नदियाँ’ है।
- source_word: יְכוֹנְנֶהָ
  choice: उसे दृढ़ किया
  rationale: כון में स्थिर या दृढ़ करने का भाव है। ‘दृढ़ किया’ पहले क्रियापद के ‘नींव दी’ से अर्थगत भेद भी सुरक्षित रखता है।
theological_decisions:
- issue: पृथ्वी का समुद्रों और नदियों पर स्थापित होना
  choice: प्राचीन इब्रानी काव्य के सृष्टि-संबंधी बिंब को सीधे बनाए रखना
  alternative: इसे केवल स्थिरता का रूपक मानकर कहना, या आधुनिक वैज्ञानिक भाषा में पुनर्लेखन करना
  rationale: मूल पद जल के ऊपर पृथ्वी की नींव और दृढ़ स्थापना का काव्यात्मक चित्र देता है। अनुवाद इस चित्र को न तो वैज्ञानिक विवरण बनाए और न उससे बचने के लिए उसे अमूर्त करे।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। समानांतर काव्य-रचना और ‘उसी’ द्वारा मूल सर्वनाम का बल सुरक्षित रखा गया है।
