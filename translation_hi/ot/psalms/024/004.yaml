  text: נְקִ֥י כַפַּ֗יִם וּֽ/בַר לֵ֫בָ֥ב אֲשֶׁ֤ר לֹא נָשָׂ֣א לַ/שָּׁ֣וְא נַפְשִׁ֑/י וְ/לֹ֖א נִשְׁבַּ֣ע לְ/מִרְמָֽה־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/024/004.yaml
  text: The one who has clean hands and a pure heart[c][b][a], who has not lifted up his soul to falsehood or sworn deceitfully.
translation:
  language: hi
  text: जिसके हाथ साफ़ हैं और जिसका हृदय शुद्ध है, जिसने अपने प्राण को असत्य की ओर नहीं उठाया[a][b] और छल से शपथ नहीं खाई।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी लिखित पाठ में ‘मेरे प्राण’ है; संदर्भ के तीसरे पुरुष वाले वर्णन के अनुरूप पढ़ा जाने वाला पाठ ‘अपने प्राण’ है।
    reason: textual_variant
  - marker: b
    text: ‘असत्य’ का अनुवाद ‘व्यर्थता’ या ‘जो मिथ्या है’ भी हो सकता है; कुछ इसे मूर्ति के संदर्भ में समझते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: נְקִי כַפַּיִם
  choice: जिसके हाथ निर्दोष
  rationale: यह पदबंध बाहरी आचरण की नैतिक निर्दोषता दर्शाता है। हिंदी में ‘हाथ निर्दोष’ मूल के ठोस बिंब को बनाए रखता है और ‘साफ़ हाथ’ की संभावित भौतिक अस्पष्टता से बचता है।
- source_word: בַר לֵבָב
  choice: हृदय शुद्ध
  rationale: यह भीतरी नैतिक शुद्धता को व्यक्त करता है और हाथों तथा हृदय के बाहरी-भीतरी समानांतर को बनाए रखता है।
- source_word: נָשָׂא ... נַפְשִׁי
  choice: अपने मन को ... नहीं लगाया
  rationale: נשא נפש אל की इब्रानी अभिव्यक्ति किसी वस्तु की ओर अपनी भीतरी अभिलाषा या लगाव लगाने का भाव दे सकती है। संदर्भानुकूल तीसरे पुरुष ‘अपने’ को मुख्य पाठ में रखा गया है; मसोराई लिखित रूप ‘मेरे प्राण’ को पाठांतर के रूप में पादटिप्पणी में सुरक्षित किया गया है।
- source_word: לַשָּׁוְא
  choice: असत्य की ओर
  rationale: שָׁוְא में असत्य, व्यर्थता और खोखलेपन का अर्थक्षेत्र है। अगले खंड के छल से नैतिक समानांतर के कारण ‘असत्य’ मुख्य पाठ में स्वाभाविक है, जबकि अन्य संभावनाएँ पादटिप्पणी में दी गई हैं।
- source_word: נִשְׁבַּע לְמִרְמָה
  choice: छल से शपथ नहीं खाई
  rationale: यह छलपूर्ण ढंग से या धोखा देने के उद्देश्य से शपथ खाने का भाव स्पष्ट और स्वाभाविक हिंदी में व्यक्त करता है।
theological_decisions:
- issue: נַפְשִׁי में प्रथम पुरुष ‘मेरे प्राण’ बनाम संदर्भानुकूल तीसरा पुरुष ‘अपने प्राण/मन’
  choice: मुख्य पाठ में ‘अपने मन’
  alternative: ‘मेरे प्राण’
  rationale: पूरे पद का वर्णन तीसरे पुरुष में है, इसलिए अनेक पाठक और अनुवाद यहाँ ‘उसके/अपने प्राण’ समझते हैं। फिर भी WLC/MT के लिखित रूप में प्रथम पुरुष प्रत्यय है; इसे चुपचाप मिटाने के बजाय पादटिप्पणी में स्पष्ट किया गया है।
- issue: שָׁוְא का आशय
  choice: असत्य
  alternative: व्यर्थता, खोखली वस्तु, या मूर्ति
  rationale: नैतिक संदर्भ और अगले छलपूर्ण शपथ वाले खंड के कारण ‘असत्य’ उपयुक्त है, पर मूल शब्द की व्यापकता और संभावित मूर्तिसंबंधी अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिंदी। ‘मन को ... लगाना’ इब्रानी मुहावरे का अर्थ स्वाभाविक हिंदी में देता है; पाठगत तनाव पादटिप्पणी में खुलकर रखा गया है।
