  yaml_path: translation/ot/psalms/114/004.yaml
  text: The mountains skipped like rams[a], the hills like lambs of the flock.
translation:
  language: hi
  text: 'पहाड़ मेढ़ों के समान उछले,

    पहाड़ियाँ मेमनों[a] के समान।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, ‘झुंड के पुत्रों के समान’; अर्थात् युवा भेड़ें या मेमने।
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶהָרִים
  choice: पहाड़
  rationale: इब्रानी में निश्चित पद है; हिन्दी में इस काव्यात्मक दृश्य के सामान्य बहुवचन ‘पहाड़’ से निश्चित संदर्भ स्वाभाविक रूप से व्यक्त होता है।
- source_word: רָקְדוּ
  choice: उछले
  rationale: क्रिया उल्लासपूर्ण कूदने या नाचने की गति बताती है। पशुओं वाली उपमा के साथ ‘उछले’ सजीव और स्वाभाविक है।
- source_word: כְאֵילִים
  choice: मेढ़ों के समान
  rationale: אֵילִים यहाँ नर भेड़ों, अर्थात् मेढ़ों, को सूचित करता है; यही अगली पंक्ति के झुंड-संबंधी बिंब के अनुकूल है।
- source_word: גְּבָעוֹת
  choice: पहाड़ियाँ
  rationale: यह ‘पहाड़’ के समानांतर छोटी ऊँची भू-आकृतियों को दर्शाता है; ‘पहाड़ियाँ’ आधुनिक हिन्दी में स्पष्ट और काव्यात्मक है।
- source_word: כִּבְנֵי־צֹאן
  choice: भेड़-बकरियों के बच्चों के समान
  rationale: शाब्दिक अर्थ ‘झुंड के बच्चों के समान’ है। צֹאן भेड़-बकरियों के छोटे पशुओं के झुंड को सूचित कर सकता है; यह चयन केवल ‘मेमनों’ तक अर्थ को सीमित किए बिना युवा पशुओं का बिंब स्पष्ट करता है।
