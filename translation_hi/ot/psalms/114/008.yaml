translation:
  language: hi
  text: जिसने चट्टान को जल का ताल[a] और चकमक पत्थर को जल का सोता बना दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो चट्टान को जल का ताल बना देता है”; इब्रानी में कृदन्त है, पर भजन में जंगल के दौरान परमेश्वर के कार्यों का स्मरण होने के कारण भूतकाल का भाव प्रसंग के अनुकूल है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַהֹפְכִי
  choice: जिसने…बना दिया
  rationale: הפך का हिफ़ील कृदन्त यहाँ पिछले पद में आए परमेश्वर का वर्णन जारी रखता है। ‘जिसने’ उसके सम्बन्धवाचक बल को और ‘बना दिया’ जंगल में किए गए कार्य के स्मरण को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הַצּוּר
  choice: चट्टान
  rationale: צוּר चट्टान या विशाल पथरीली शिला को दर्शाता है; यहाँ ‘चट्टान’ सहज और निर्गमन-कालीन संकेत के अनुरूप है।
- source_word: אֲגַם מָיִם
  choice: जल का ताल
  rationale: אֲגַם ठहरे हुए पानी के निकाय को दर्शाता है। ‘जल का ताल’ काव्यात्मक समानान्तरता और מָיִם की स्पष्ट पुनरावृत्ति बनाए रखता है।
- source_word: חַלָּמִישׁ
  choice: चकमक पत्थर
  rationale: यह शब्द चकमक या अत्यन्त कठोर पत्थर को दर्शाता है; ‘चकमक पत्थर’ चमत्कार की तीव्रता को मूर्त रूप देता है।
- source_word: לְמַעְיְנוֹ מָיִם
  choice: जल का सोता
  rationale: מַעְיָן प्राकृतिक सोते या जलस्रोत को दर्शाता है और לְ परिणाम का भाव देता है। एकवचन ‘सोता’ इब्रानी रूप से मेल खाता है।
theological_decisions:
- issue: पिछले पद से समझा जाने वाला परमेश्वर कर्ता है
  choice: ‘जिसने’ द्वारा सम्बन्धवाचक खण्ड बनाए रखा गया और ‘परमेश्वर’ दोहराया नहीं गया
  alternative: उसने चट्टान को…बना दिया
  rationale: इब्रानी पद पिछले पद के ‘याकूब के परमेश्वर’ का वर्णन जारी रखता है। कर्ता को स्पष्ट रूप से दोहराने के बजाय सम्बन्धवाचक रचना मूल की काव्यात्मक और वाक्यगत कड़ी सुरक्षित रखती है।
- issue: इब्रानी कृदन्त का कालगत बल
  choice: भूतकालीन ‘बना दिया’
  alternative: वर्तमान/सामान्यकालीन ‘बना देता है’
  rationale: कृदन्त अपने आप काल को पूर्णतः निश्चित नहीं करता, पर भजन का प्रसंग जंगल में परमेश्वर के किए कार्यों को स्मरण करता है; इसलिए मुख्य पाठ में भूतकाल स्वाभाविक है और वैकल्पिक सम्भावना पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। ‘जल’, ‘ताल’ और ‘सोता’ काव्यात्मक समानान्तरता को बनाए रखते हैं; वाक्य पिछले पद से जुड़ा सम्बन्धवाचक खण्ड है।
