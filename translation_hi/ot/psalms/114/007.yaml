  yaml_path: translation/ot/psalms/114/007.yaml
  text: Tremble[a], O earth, before the Lord, before the God of Jacob,
translation:
  language: hi
  text: 'हे पृथ्वी, प्रभु के सामने काँप उठ[a],

    याकूब के परमेश्वर के सामने।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तड़प उठ”; इब्रानी क्रिया ऐंठन या प्रचंड कम्पन की अधिक तीव्र छवि भी व्यक्त कर सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מִלִּפְנֵי
  choice: के सामने
  rationale: यह पदबंध किसी की उपस्थिति या सम्मुख होने का भाव देता है। आधुनिक हिन्दी में “के सामने” स्वाभाविक है और परमेश्वर की उपस्थिति के कारण पृथ्वी के काँपने का आशय बनाए रखता है।
- source_word: אָדוֹן
  choice: प्रभु
  rationale: यहाँ इब्रानी शब्द का अर्थ “प्रभु/स्वामी” है और यह יהוה नहीं है; इसलिए “प्रभु” शीर्षक मूल पाठ के भेद को सुरक्षित रखता है।
- source_word: חוּלִי
  choice: काँप उठ
  rationale: स्त्रीलिंग एकवचन आज्ञार्थक क्रिया पृथ्वी को सीधे संबोधित करती है। “काँप उठ” कम्पन और आकस्मिक उथल-पुथल का काव्यात्मक बल सहज हिन्दी में व्यक्त करता है।
- source_word: אָרֶץ
  choice: हे पृथ्वी
  rationale: भजन के व्यापक, सृष्टिगत परिप्रेक्ष्य और सीधे संबोधन के कारण “भूमि” के बजाय “हे पृथ्वी” उपयुक्त है।
- source_word: אֱלוֹהַּ יַעֲקֹב
  choice: याकूब के परमेश्वर
  rationale: यह पदबंध परमेश्वर को याकूब के साथ उसके संबंध द्वारा पहचानता है; हिन्दी में यही स्वाभाविक और स्रोत-संगत रूप है।
- source_word: יַעֲקֹב
  choice: याकूब
  rationale: व्यक्तिवाचक नाम का प्रचलित हिन्दी बाइबलीय रूप अपनाया गया है।
theological_decisions:
- issue: אָדוֹן को परमेश्वर के निज नाम יהוה से अलग रखना
  choice: प्रभु
  alternative: यहोवा
  rationale: मूल पाठ में אָדוֹן है, יהוה नहीं। इसलिए “यहोवा” लाने से ऐसा भेद जुड़ जाता जो इस पद में उपस्थित नहीं है; “प्रभु” स्रोत के वास्तविक शीर्षक को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक रखी गई है। “हे पृथ्वी” सीधे संबोधन को स्पष्ट करता है, और दोहराया गया “के सामने” इब्रानी समानांतरता को बनाए रखता है।
