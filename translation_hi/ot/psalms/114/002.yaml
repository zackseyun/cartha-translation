  yaml_path: translation/ot/psalms/114/002.yaml
  text: Judah became his sanctuary[c][b][a], Israel his dominion.
translation:
  language: hi
  text: 'यहूदा उसका पवित्रस्थान बना[a][b],

    इस्राएल उसका राज्य[c]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यहूदा उसका पवित्रस्थान था।” हिब्रू क्रिया स्थिर अवस्था (“था”) या नई अवस्था में आने (“बना”)—दोनों भावों में समझी जा सकती है।
    reason: lexical_alternative
  - marker: b
    text: या, “उसका पवित्र स्थान।” हिब्रू शब्द का अर्थ “पवित्रता” भी हो सकता है और “पवित्र स्थान” भी; यहाँ अगली पंक्ति के “राज्य” के समानांतर स्थानवाचक अर्थ उपयुक्त जान पड़ता है।
    reason: lexical_alternative
  - marker: c
    text: या, “उसका शासन,” “उसकी प्रभुता,” अथवा “उसका शासन-क्षेत्र।” हिब्रू संज्ञा रूप में बहुवचन है, पर यहाँ संभवतः शासन या उसके पूरे विस्तार का सामूहिक भाव व्यक्त करती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הָיְתָה
  choice: बना
  rationale: भजन के ऐतिहासिक क्रम में यह क्रिया किसी नई स्थिति में आने का भाव दे सकती है। इसलिए ‘बना’ चुना गया है; ‘था’ भी व्याकरणतः संभव है और उसे पाद-टिप्पणी में रखा गया है।
- source_word: יְהוּדָה
  choice: यहूदा
  rationale: गोत्र और भूभाग के इस व्यक्तिवाचक नाम का प्रचलित हिन्दी रूप।
- source_word: לְקָדְשׁוֹ
  choice: उसका पवित्रस्थान
  rationale: קֹדֶשׁ पवित्रता अथवा पवित्र स्थान को सूचित कर सकता है। यहाँ ‘राज्य’ के समानांतर ठोस स्थानगत अर्थ स्वाभाविक है। उपसर्ग לְ के साथ यहूदा के उसके पवित्रस्थान बन जाने का भाव है।
- source_word: יִשְׂרָאֵל
  choice: इस्राएल
  rationale: लोगों अथवा राष्ट्र के नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: מַמְשְׁלוֹתָיו
  choice: उसका राज्य
  rationale: यह शब्द शासन, प्रभुता या शासन-क्षेत्र का बोध कराता है। यद्यपि हिब्रू रूप बहुवचन है, यहाँ वह विस्तार अथवा अमूर्त शासन को व्यक्त करता जान पड़ता है। ‘राज्य’ संक्षिप्त, स्वाभाविक और काव्यात्मक समानांतरता के अनुकूल है; इसका अर्थ किसी पृथक राजनीतिक राजतंत्र तक सीमित नहीं है।
theological_decisions:
- issue: ‘उसका’ में निहित तृतीय पुरुष एकवचन का संदर्भ
  choice: सर्वनाम परमेश्वर की ओर संकेत करता है, पर पद में उसका नाम नहीं जोड़ा गया।
  alternative: ‘यहोवा का पवित्रस्थान’ और ‘यहोवा का राज्य’ कहकर संदर्भ को स्पष्ट करना।
  rationale: पूरे भजन के संदर्भ में प्रत्यय स्वाभाविक रूप से इस्राएल के परमेश्वर की ओर संकेत करते हैं। फिर भी मूल पद की संक्षिप्तता बनाए रखने और अतिरिक्त नाम न जोड़ने के लिए ‘उसका’ रखा गया है।
- issue: यहूदा और इस्राएल की समानांतर जोड़ी
  choice: दोनों नाम अलग-अलग रखे गए हैं।
  alternative: दोनों को मिलाकर ‘उसकी पवित्र प्रजा’ जैसे एक सामूहिक पद से व्यक्त करना।
  rationale: हिब्रू कविता जानबूझकर यहूदा और इस्राएल को समानांतर पंक्तियों में रखती है। उन्हें अलग रखने से साहित्यिक संरचना और संभावित अर्थगत तनाव सुरक्षित रहता है।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। दो संक्षिप्त समानांतर पंक्तियाँ हिब्रू काव्य की संरचना को बनाए रखती हैं। ‘पवित्रस्थान’ और ‘राज्य’ सामान्य पाठक के लिए परिचित हैं, जबकि पाद-टिप्पणियाँ मूल के वैकल्पिक अर्थ सुरक्षित रखती हैं।
