lexical_decisions:
- source_word: הַיָּם
  choice: समुद्र
  rationale: निश्चित संज्ञा का सीधा और स्वाभाविक हिन्दी रूप; मूल पाठ यहाँ किसी विशिष्ट समुद्र का नाम नहीं देता।
- source_word: רָאָה
  choice: ने देखा
  rationale: सामान्य क्रिया का सीधा अनुवाद, जो समुद्र के काव्यात्मक मानवीकरण को बनाए रखता है और देखी गई वस्तु को अनकहा छोड़ता है।
- source_word: וַיָּנֹס
  choice: और भाग गया
  rationale: נוס का अर्थ भय या संकट से भागना है; यह चयन पद की सजीव काव्यात्मकता बनाए रखता है।
- source_word: הַיַּרְדֵּן
  choice: यरदन
  rationale: नदी के पारंपरिक हिन्दी नाम का प्रयोग; हिन्दी में यहाँ अलग से ‘नदी’ जोड़ना आवश्यक नहीं।
- source_word: יִסֹּב לְאָחוֹר
  choice: पीछे मुड़ गई
  rationale: संयुक्त इब्रानी अभिव्यक्ति का स्वाभाविक हिन्दी रूप, जिसमें मुड़ने और पीछे की ओर जाने—दोनों का भाव सुरक्षित है। स्त्रीलिंग क्रिया ‘गई’ निहित ‘यरदन नदी’ के अनुरूप है।
theological_decisions:
- issue: ऐतिहासिक-काव्यात्मक संकेत
  choice: समुद्र और यरदन के मानवीकरण को बनाए रखा गया तथा ‘देखा’ का कर्म नहीं जोड़ा गया।
  alternative: ‘समुद्र ने उसे देखकर भाग गया’ अथवा मुख्य पाठ में निर्गमन और यरदन-पार करने की घटनाएँ स्पष्ट करना।
  rationale: इब्रानी पद देखी गई वस्तु को अनकहा छोड़ता है और ऐतिहासिक घटनाओं की ओर केवल काव्यात्मक संकेत करता है; कर्म या घटनाओं को मुख्य पाठ में जोड़ना अस्पष्टता को अनुचित रूप से हल कर देता।
- issue: यरदन की गति का वर्णन
  choice: ‘पीछे मुड़ गई’
  alternative: ‘उलटी दिशा में बहने लगी’
  rationale: मूल अभिव्यक्ति पीछे मुड़ने की बात कहती है, पर बहाव की यांत्रिकी स्पष्ट नहीं करती; इसलिए अधिक व्याख्यात्मक विकल्प से बचा गया।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण काव्यात्मक हिन्दी है। समानांतर पंक्तियों की संक्षिप्तता और सृष्टि के मानवीकरण को सुरक्षित रखा गया है।
