lexical_decisions:
- source_word: מַה לְּךָ
  choice: तुझे क्या हुआ
  rationale: हिब्रू मुहावरे का शाब्दिक रूप ‘तेरे लिए/साथ क्या?’ है। आधुनिक हिन्दी में ‘तुझे क्या हुआ?’ विस्मयपूर्ण आलंकारिक संबोधन को स्वाभाविक रूप से व्यक्त करता है; केवल ‘क्यों’ कहने से मूल की सजीवता घट जाती।
- source_word: הַיָּם
  choice: हे समुद्र
  rationale: संज्ञा का अर्थ ‘समुद्र’ है और यहाँ उससे प्रत्यक्ष संबोधन किया गया है; ‘हे’ हिन्दी काव्य में इस संबोधन को स्पष्ट और गरिमापूर्ण बनाता है।
- source_word: כִּי
  choice: कि
  rationale: यह आलंकारिक प्रश्न की विषय-वस्तु प्रस्तुत करता है—‘कि तू भागता है’; इससे मूल की समानांतर रचना बनी रहती है।
- source_word: תָנוּס
  choice: तू भागता है
  rationale: נוּס का सीधा अर्थ ‘भागना/पलायन करना’ है। यह समुद्र के मानवीकरण और वर्तमान काव्यात्मक दृश्य को बनाए रखता है।
- source_word: הַיַּרְדֵּן
  choice: हे यरदन
  rationale: नदी के नाम का मानक हिन्दी रूप ‘यरदन’ रखा गया है। प्रत्यक्ष संबोधन के कारण ‘हे’ जोड़ा गया है।
- source_word: תִּסֹּב
  choice: तू मुड़ता है
  rationale: क्रिया का अर्थ घूमना या मुड़ना है; לְאָחוֹר के साथ इसका स्वाभाविक हिन्दी रूप ‘पीछे मुड़ना’ है।
- source_word: לְאָחוֹר
  choice: पीछे
  rationale: इस क्रियाविशेषण का अर्थ ‘पीछे/पीछे की ओर’ है। ‘पीछे मुड़ता है’ आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक है।
