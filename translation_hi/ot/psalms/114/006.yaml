  text: הֶֽ֭/הָרִים תִּרְקְד֣וּ כְ/אֵילִ֑ים גְּ֝בָע֗וֹת כִּ/בְנֵי צֹֽאן־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/114/006.yaml
  text: O mountains[a], why do you skip like rams, O hills[b], like lambs of the flock?
translation:
  language: hi
  text: हे पहाड़ो, तुम मेढ़ों के समान क्यों उछलते हो? हे पहाड़ियों, तुम झुंड के मेमनों[a] के समान क्यों उछलती हो?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से ‘झुंड की संतान’; यह छोटी भेड़ों या मेमनों के लिए प्रयुक्त मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶהָרִים
  choice: हे पहाड़ो
  rationale: संज्ञा का अर्थ ‘पहाड़’ है। प्रश्नवाचक भाव पिछले पद से जारी है और यहाँ सीधा संबोधन है; इसलिए ‘हे पहाड़ो’ स्वाभाविक है।
- source_word: תִּרְקְדוּ
  choice: उछलते हो / उछलती हो
  rationale: רָקַד का अर्थ उछलना, कूदना या नाचना हो सकता है। मेढ़ों और मेमनों की उपमा के साथ ‘उछलना’ यहाँ की सजीव गति को सबसे स्वाभाविक ढंग से व्यक्त करता है।
- source_word: כְאֵילִים
  choice: मेढ़ों के समान
  rationale: אֵילִים का सीधा अर्थ ‘मेढ़े’ है और यह अगले अर्धपद के भेड़-झुंड संबंधी बिंब से मेल खाता है।
- source_word: גְּבָעוֹת
  choice: हे पहाड़ियों
  rationale: संज्ञा का अर्थ ‘पहाड़ियाँ’ है। यह भी काव्यात्मक प्रत्यक्ष संबोधन को जारी रखती है।
- source_word: כִּבְנֵי צֹאן
  choice: झुंड के मेमनों
  rationale: शाब्दिक रूप से ‘झुंड की संतान’ एक इब्रानी मुहावरा है, जिसका आशय छोटी भेड़ों या मेमनों से है। ‘झुंड के मेमने’ मूल बिंब और झुंड के स्पष्ट उल्लेख दोनों को बनाए रखता है।
theological_decisions: []
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी। प्रश्नवाचक ‘क्यों’ पिछले पद से जारी संरचना को स्पष्ट करता है। पहाड़ (पुल्लिंग बहुवचन) और पहाड़ियाँ (स्त्रीलिंग बहुवचन) के अनुसार क्रिया-रूपों में हिन्दी का स्वाभाविक लिंग-सामंजस्य रखा गया है।
