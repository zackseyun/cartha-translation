base_translation:
  language: en
  yaml_path: translation/ot/psalms/114/001.yaml
  text: When Israel went out from Egypt[a], the house of Jacob from a people of strange speech,
translation:
  language: hi
  text: 'जब इस्राएल मिस्र से निकला,

    याकूब का घराना पराई भाषा बोलनेवाले लोगों से निकला[a]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “एक विदेशी-भाषी जन से।” इब्रानी शब्द उस जन की भाषा को इस्राएल के लिए विदेशी या समझ में न आनेवाली बताता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּ/צֵאת
  choice: जब ... निकला
  rationale: ב के साथ יצא का infinitive construct समयसूचक उपवाक्य बनाता है; आधुनिक हिन्दी में “जब ... निकला” स्वाभाविक और मूल अर्थ के निकट है।
- source_word: יִשְׂרָאֵל
  choice: इस्राएल
  rationale: वाचा-समुदाय और राष्ट्र के नाम का हिन्दी बाइबलीय रूप।
- source_word: מִ/מִּצְרָיִם
  choice: मिस्र से
  rationale: מן स्रोत अथवा अलग होने का भाव व्यक्त करता है; “निकला” के साथ “मिस्र से” संक्षिप्त और स्वाभाविक है।
- source_word: בֵּית יַעֲקֹב
  choice: याकूब का घराना
  rationale: यह याकूब के वंशजों के लिए सामूहिक पद है। “घराना” हिन्दी में वंश और समुदाय का भाव देता है तथा काव्यात्मक समानांतरता बनाए रखता है।
- source_word: מֵ/עַם
  choice: लोगों के बीच से
  rationale: מן अलग होकर निकलने का भाव देता है। हिन्दी में किसी जनसमुदाय से प्रस्थान के लिए “लोगों के बीच से” अधिक स्पष्ट और स्वाभाविक है।
- source_word: לֹעֵז
  choice: पराई भाषा बोलनेवाले
  rationale: यह शब्द ऐसी भाषा बोलने का संकेत देता है जो इस्राएल के लिए विदेशी या समझ से बाहर थी। यह अनुवाद भाषायी भिन्नता को व्यक्त करता है, जातीय तिरस्कार को नहीं।
theological_decisions:
- issue: दोनों काव्य-पंक्तियों का संबंध
  choice: दूसरी पंक्ति को निर्गमन की समानांतर पुनरुक्ति के रूप में रखा गया है और स्पष्ट हिन्दी के लिए “निकला” दोहराया गया है।
  alternative: दूसरी पंक्ति में क्रिया को लुप्त रखकर केवल “याकूब का घराना, पराई भाषा बोलनेवाले लोगों के बीच से” कहना।
  rationale: “इस्राएल” के समानांतर “याकूब का घराना” और “मिस्र से” के समानांतर “पराई भाषा बोलनेवाले लोगों के बीच से” है। हिन्दी में क्रिया दोहराने से अर्थ स्पष्ट होता है, बिना समानांतरता का धर्मवैज्ञानिक विस्तार किए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। पद की इब्रानी समानांतरता दो पंक्तियों में सुरक्षित है; “पराई भाषा” लֹעֵז की भाषायी दूरी को व्यक्त करती है।
