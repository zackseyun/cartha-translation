  text: Yahweh is high above all nations; his glory is above the heavens.
translation:
  language: hi
  text: याहवे सब जातियों से ऊँचे हैं; उनकी महिमा आकाश के ऊपर है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רָם
  choice: ऊँचे हैं
  rationale: यह विधेय विशेषण ऊँचाई और श्रेष्ठता दोनों व्यक्त करता है। आधुनिक हिन्दी में ‘ऊँचे हैं’ स्वाभाविक है और पद की ऊर्ध्वात्मक काव्य-छवि बनाए रखता है।
- source_word: עַל כָּל גּוֹיִם
  choice: सब जातियों से ऊँचे
  rationale: עַל यहाँ तुलनात्मक ऊँचाई और सर्वोच्चता दर्शाता है। हिन्दी में ‘से ऊँचे’ इस संबंध को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी लिप्यंतरण में प्रस्तुत किया गया है।
- source_word: עַל הַשָּׁמַיִם
  choice: आकाश से भी ऊँची
  rationale: שָׁמַיִם का काव्य-संदर्भ में ‘आकाश’ सहज हिन्दी रूप है। ‘भी’ पहले खंड से आगे बढ़ती चरमोत्कर्षात्मक समानांतरता को स्वाभाविक हिन्दी में प्रकट करता है।
- source_word: כְּבוֹדוֹ
  choice: उनकी महिमा
  rationale: כָּבוֹד यहाँ परमेश्वर की प्रकट गरिमा और वैभव को सूचित करता है; ‘महिमा’ हिन्दी बाइबलीय और उपासना-संदर्भ में सटीक तथा प्रचलित है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम सीधे प्रयुक्त है। ‘याहवे’ उसे उपाधि में बदले बिना और किसी सांप्रदायिक व्याख्या को जोड़े बिना सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और गरिमापूर्ण रखी गई है। पहले और दूसरे खंड की ऊँचाई वाली छवि सुरक्षित है; ‘भी’ हिन्दी में काव्यात्मक उत्कर्ष को स्पष्ट करता है।
