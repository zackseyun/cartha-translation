  text: to seat him with nobles[b][a], with the nobles of his people.
translation:
  language: hi
  text: 'उसे कुलीनों[a] के साथ बैठाने के लिए,

    उसकी प्रजा के कुलीनों के साथ।[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “प्रधानों” अथवा “राजकुमारों”; इब्रानी शब्द ऊँचे पद या प्रतिष्ठा वाले व्यक्तियों को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: “उसकी प्रजा” में “उसकी” संभवतः प्रभु की ओर संकेत करता है; व्याकरण की दृष्टि से यह उस व्यक्ति की ओर भी संकेत कर सकता है जिसे ऊँचा उठाया गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: לְהוֹשִׁיבִי
  choice: कि वह उसे बैठाए
  rationale: ישׁב के हिफ़ील infinitive construct में उद्देश्य/परिणाम और कारणवाचक भाव है। पिछले पद से संबंध स्पष्ट करने के लिए स्वाभाविक हिन्दी में ‘कि वह उसे बैठाए’ कहा गया है; ‘उसे’ पिछले पद के दरिद्र व्यक्ति की ओर संकेत करता है।
- source_word: עִם
  choice: के साथ
  rationale: यह मूल अर्थ को सीधे व्यक्त करता है और सम्मानित लोगों की संगति में बैठाए जाने का चित्र बनाए रखता है। दोनों occurrences का अनुवाद रखा गया है ताकि इब्रानी की पुनरावृत्ति और काव्यात्मक समानांतरता बनी रहे।
- source_word: נְדִיבִים / נְדִיבֵי
  choice: कुलीनों
  rationale: इस प्रसंग में נָדִיב ऊँचे सामाजिक पद वाले या प्रधान व्यक्तियों को दर्शाता है, केवल ‘उदार लोगों’ को नहीं। ‘कुलीन’ प्रतिष्ठित श्रेणी का भाव देता है, पर ‘राजकुमार’ की तरह राजवंशीय अर्थ को अनिवार्य नहीं बनाता।
- source_word: עַמּוֹ
  choice: उसकी प्रजा
  rationale: עַם यहाँ किसी जनसमुदाय, विशेषतः याहवे की प्रजा, को सूचित करता है। ‘उसकी’ इब्रानी के पुल्लिंग एकवचन संबंधसूचक प्रत्यय को बनाए रखता है और उसके व्याकरणिक संदर्भ की संभावित अस्पष्टता को भी सुरक्षित रखता है।
theological_decisions:
- issue: ‘उसकी प्रजा’ में ‘उसकी’ का संदर्भ
  choice: मुख्यतः प्रभु की प्रजा के अर्थ में समझा गया, पर मुख्य पाठ में ‘उसकी’ रखकर व्याकरणिक अस्पष्टता सुरक्षित रखी गई है।
  alternative: ‘उसकी’ उस दरिद्र व्यक्ति की ओर संकेत कर सकता है जिसे ऊँचा उठाया गया है।
  rationale: पूरे प्रसंग में कार्य करने वाला कर्ता प्रभु है, इसलिए संदर्भ की दृष्टि से प्रभु अधिक संभावित antecedent है। फिर भी इब्रानी प्रत्यय स्वयं दूसरे अर्थ को व्याकरणतः असंभव नहीं बनाता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘के साथ’ की पुनरावृत्ति मूल की काव्यात्मक समानांतरता को दर्शाती है। ‘कुलीन’ सामान्य पाठक के लिए समझने योग्य रहते हुए सामाजिक प्रतिष्ठा का अर्थ संप्रेषित करता है।
