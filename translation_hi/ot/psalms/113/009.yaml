  yaml_path: translation/ot/psalms/113/009.yaml
  text: He gives the barren woman a home[a], as a joyful mother of children[b]. Praise Yah!
translation:
  language: hi
  text: वह बाँझ स्त्री को घर में बसाता है[a] और उसे बच्चों की आनन्दित माँ बनाता है। याह की स्तुति करो![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, अधिक शाब्दिक रूप से, “वह बाँझ स्त्री को घर में निवास कराता है।”
    reason: lexical_alternative
  - marker: b
    text: “हल्लेलूयाह” इसी इब्रानी वाक्यांश का पारम्परिक लिप्यन्तरण है।
    reason: alternative_rendering
lexical_decisions:
- source_word: מֽוֹשִׁיבִי
  choice: बसाता है
  rationale: यह ישׁב का हिफ़ईल कृदन्त है, जिसका अर्थ किसी को रहने या बसने की स्थिति में लाना है। ‘बसाता है’ कारणवाचक भाव को सहज और संक्षिप्त हिन्दी में रखता है।
- source_word: עֲקֶרֶת
  choice: बाँझ स्त्री
  rationale: यह शब्द सन्तान न जन सकने वाली स्त्री को दर्शाता है। ‘बाँझ स्त्री’ काव्यात्मक सन्दर्भ में स्पष्ट है और ‘निःसन्तान’ की अपेक्षा मूल शब्द के शारीरिक भाव को अधिक सीधे रखता है।
- source_word: הַבַּיִת
  choice: घर में
  rationale: मूलतः ‘उस/उसके घर में’; यहाँ בַּיִת घरेलू निवास और परिवार में स्थापित स्थान का बोध देता है। हिन्दी में ‘घर में बसाता है’ स्वाभाविक रहते हुए स्थानसूचक रूप को सुरक्षित रखता है।
- source_word: אֵם הַבָּנִים
  choice: बच्चों की माँ
  rationale: בָּנִים का अर्थ प्रसंगानुसार ‘पुत्र’ या व्यापक रूप से ‘बच्चे’ हो सकता है। यहाँ बल बाँझपन से मातृत्व की ओर परिवर्तन पर है, इसलिए ‘बच्चों’ उपयुक्त है।
- source_word: שְׂמֵחָה
  choice: आनन्दित
  rationale: यह माँ का वर्णन करने वाला विशेषण है। ‘आनन्दित’ गरिमापूर्ण और वर्तमान हिन्दी में बोधगम्य है।
- source_word: הַֽלְלוּ יָהּ
  choice: याह की स्तुति करो!
  rationale: यह बहुवचन आज्ञा ‘स्तुति करो’ और परमेश्वर के संक्षिप्त नाम יָהּ का संयोजन है। अनुवाद अर्थ और नाम के विशिष्ट रूप दोनों को बनाए रखता है।
theological_decisions:
- issue: समापन में ईश्वरीय नाम יָהּ का रूप
  choice: याह
  alternative: यहोवा / प्रभु / हल्लेलूयाह
  rationale: मूल में पूर्ण चतुरक्षरीय नाम יהוה नहीं, उसका संक्षिप्त रूप יָהּ है। ‘याह’ इस भेद को सुरक्षित रखता है; ‘हल्लेलूयाह’ पूरे वाक्यांश का पारम्परिक लिप्यन्तरण है, अर्थानुवाद नहीं।
- issue: बाँझ स्त्री का बच्चों की माँ होना
  choice: उसे बच्चों की आनन्दित माँ बनाता है
  alternative: वह बच्चों की आनन्दित माँ है
  rationale: इब्रानी में दूसरा पद पहले पद के साथ समानाधिकरण में है और परिवर्तन का परिणाम व्यक्त करता है। हिन्दी में ‘बनाता है’ इस निहित परिणाम को स्वाभाविक बनाता है, बिना परिवर्तन की रीति या समय के विषय में अतिरिक्त दावा किए।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सरल किंतु भजन के अनुरूप गरिमापूर्ण रखी गई है। ‘बसाता है’ घरेलू स्थापना के भाव को स्वाभाविक ढंग से व्यक्त करता है; ‘आनन्दित माँ’ काव्यात्मक संक्षिप्तता बनाए रखता है।
