source:
  edition: WLC
  text: יְהִ֤י שֵׁ֣ם יְהוָ֣ה מְבֹרָ֑ךְ מֵֽ֝/עַתָּ֗ה וְ/עַד עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/113/002.yaml
  text: May the name of Yahweh be blessed from now and forever[a].
translation:
  language: hi
  text: याहवे का नाम अब से सदा तक धन्य हो[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “याहवे का नाम धन्य रहे।”
    reason: יְהִי के कामनासूचक अथवा आह्वानात्मक भाव का स्वाभाविक वैकल्पिक हिंदी रूप।
lexical_decisions:
- source_word: יְהִי
  choice: हो
  rationale: यह היה का जुसिव रूप है और यहाँ कामना अथवा आह्वान व्यक्त करता है; हिंदी में ‘हो’ इस भाव को स्वाभाविक और संक्षिप्त रूप से व्यक्त करता है।
- source_word: שֵׁם
  choice: नाम
  rationale: ‘नाम’ मूल अर्थ को बनाए रखता है और उस व्यक्ति तथा उसकी प्रतिष्ठा का भी संकेत देता है जिसका वह नाम है; पाठ में व्याख्यात्मक विस्तार आवश्यक नहीं है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिंदी में लिप्यंतरित किया गया है।
- source_word: מְבֹרָךְ
  choice: धन्य
  rationale: ברך के निष्क्रिय कृदंत का अर्थ ‘धन्य’ है। यह ‘स्तुति हो’ की अपेक्षा मूल आशीर्वाद-संबंधी भाषा को अधिक निकटता से सुरक्षित रखता है।
- source_word: מֵעַתָּה
  choice: अब से
  rationale: यह वर्तमान क्षण से आगे का समय दर्शाता है; ‘अब से’ आधुनिक हिंदी में सहज और सटीक है।
- source_word: וְעַד עוֹלָם
  choice: सदा तक
  rationale: यह अनिश्चित, निरंतर भविष्यकाल की अवधि व्यक्त करता है; ‘सदा तक’ अर्थ को स्पष्ट और गरिमापूर्ण हिंदी में रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पद में व्यक्तिगत ईश्वरीय नाम सीधे आया है। ‘याहवे’ उसे उपाधि ‘प्रभु’ से प्रतिस्थापित नहीं करता और मूल नाम की पहचान बनाए रखता है।
- issue: יְהִי की विधि और भाव
  choice: 'कामना/आह्वान: ‘धन्य हो’'
  alternative: 'वर्णनात्मक कथन: ‘धन्य है/रहेगा’'
  rationale: जुसिव रूप यहाँ साधारण वर्तमान या भविष्यकालीन कथन नहीं, बल्कि आशीर्वचनात्मक कामना अथवा समुदाय को दिए आह्वान का भाव रखता है। हिंदी ‘हो’ दोनों निकटवर्ती बलों के बीच की वास्तविक अस्पष्टता को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी में संक्षिप्त, काव्यात्मक और गरिमापूर्ण शैली रखी गई है। ‘धन्य हो’ धार्मिक संदर्भ में परिचित है, फिर भी सामान्य पाठक के लिए स्पष्ट है।
