  yaml_path: translation/ot/psalms/113/006.yaml
  text: who stoops down to look on the heavens and the earth[a].
translation:
  language: hi
  text: जो आकाश और पृथ्वी को देखने के लिए नीचे झुकता है[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो देखने के लिए अपने को नीचा करता है।”
    reason: הַמַּשְׁפִּילִי के अधिक शाब्दिक अर्थ को प्रस्तुत करने वाला वैकल्पिक अनुवाद।
lexical_decisions:
- source_word: הַמַּשְׁפִּילִי
  choice: जो ... नीचे झुकता है
  rationale: שׁפל के हिफ़ईल कृदन्त का अर्थ अपने को नीचा करना या नीचे झुकाना है। पिछले पद में परमेश्वर की महान ऊँचाई के संदर्भ में यह अभिव्यक्ति नीचे झुकने का सजीव रूपक बनाए रखती है।
- source_word: לִרְאוֹת
  choice: देखने के लिए
  rationale: ראה का infinitive construct यहाँ उद्देश्य बताता है; ‘देखने के लिए’ इसका सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: בַּשָּׁמַיִם
  choice: आकाश
  rationale: שׁמים काव्यात्मक सन्दर्भ में ऊपर के समस्त आकाशीय क्षेत्र को दर्शाता है; हिन्दी में ‘आकाश’ स्वाभाविक और गरिमापूर्ण है।
- source_word: וּבָאָרֶץ
  choice: और पृथ्वी को
  rationale: אָרֶץ यहाँ आकाश के समानान्तर पृथ्वी को दर्शाता है। हिन्दी वाक्य-विन्यास में ‘देखना’ के कर्मों के साथ ‘को’ स्पष्ट और स्वाभाविक है।
theological_decisions:
- issue: परमेश्वर की पारलौकिक महानता और नीचे झुकने का मानवरूपी चित्रण
  choice: ‘नीचे झुकता है’ रूपक को बनाए रखा गया है।
  alternative: ‘अपने को दीन करता है’ या ‘ध्यान देता है’
  rationale: यह अनुवाद परमेश्वर की महान ऊँचाई और आकाश तथा पृथ्वी की ओर उसके कृपापूर्ण झुकाव के बीच मूल काव्यात्मक तनाव को बनाए रखता है, बिना उसे केवल अमूर्त ‘ध्यान देने’ में बदलने के।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘नीचे झुकता है’ सामान्य पाठक के लिए स्वाभाविक है और मूल का सजीव मानवरूपी चित्र सुरक्षित रखता है।
