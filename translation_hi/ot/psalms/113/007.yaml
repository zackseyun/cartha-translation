  yaml_path: translation/ot/psalms/113/007.yaml
  text: He raises the poor from the dust[a]; he lifts the needy from the ash heap.
translation:
  language: hi
  text: 'वह निर्धन को धूल में से उठाता है;

    वह ज़रूरतमंद को कूड़े के ढेर[a] में से ऊपर उठाता है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘राख के ढेर’; इब्रानी शब्द फेंकी हुई राख या कचरे के ढेर अथवा कूड़ा डालने की जगह को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מְקִימִי
  choice: उठाता है
  rationale: קום के हिफ़ील कृदंत का अर्थ किसी को उठाना या खड़ा करना है। यहाँ निरंतर कर्ता परमेश्वर है; ‘उठाता है’ सहज हिंदी में कारणवाचक क्रिया और नीची दशा से उठाए जाने की छवि दोनों को बनाए रखता है।
- source_word: מֵעָפָר
  choice: धूल में से
  rationale: עָפָר का ठोस अर्थ ‘धूल’ या ढीली मिट्टी है और מִן स्रोत को व्यक्त करता है। ‘धूल में से’ अपमान और अत्यंत नीची दशा की दृश्यात्मक छवि सुरक्षित रखता है।
- source_word: דָּל
  choice: निर्धन
  rationale: דָּל गरीब, निर्बल या सामाजिक रूप से तुच्छ व्यक्ति को सूचित कर सकता है। ‘निर्धन’ इस संदर्भ में आर्थिक-सामाजिक अभाव को स्पष्ट रखता है, पर पद को केवल शारीरिक दुर्बलता तक सीमित नहीं करता।
- source_word: מֵאַשְׁפֹּת
  choice: कूड़े के ढेर में से
  rationale: אַשְׁפֹּת फेंकी हुई राख या कचरे के ढेर अथवा कूड़ा डालने की जगह को सूचित करता है। आधुनिक हिंदी में ‘कूड़े का ढेर’ सबसे सहज है और घोर दीनता की छवि को स्पष्ट रखता है।
- source_word: יָרִים
  choice: ऊपर उठाता है
  rationale: רום के हिफ़ील रूप का अर्थ ऊपर उठाना है। ‘ऊपर उठाता है’ पहले चरण के समानांतर रहते हुए ऊर्ध्व गति को व्यक्त करता है और अगले पद में आने वाली प्रतिष्ठा को समय से पहले नहीं जोड़ता।
- source_word: אֶבְיוֹן
  choice: ज़रूरतमंद
  rationale: אֶבְיוֹן अभावग्रस्त या बेसहारा व्यक्ति को दर्शाता है। ‘ज़रूरतमंद’ पहले चरण के דָּל के लिए चुने गए ‘निर्धन’ से हल्का भेद बनाए रखते हुए दोनों शब्दों का अर्थगत साम्य सुरक्षित रखता है।
theological_decisions:
- issue: मानवीय और सामाजिक दशा की छवि
  choice: धूल और कूड़े के ढेर से निर्धन तथा ज़रूरतमंद को उठाने वाली ठोस सामाजिक उलटफेर की भाषा सुरक्षित रखी गई है।
  alternative: इसे केवल आत्मिक दीनता से उठाए जाने या सामान्य रूप से ईश्वरीय महिमा दिए जाने के रूप में व्यक्त किया जा सकता था।
  rationale: इब्रानी पाठ भौतिक चित्रों और सामाजिक अभाव के शब्दों का प्रयोग करता है। अनुवाद उन्हें आत्मिक अर्थ तक सीमित नहीं करता और न ही अगले पद की प्रतिष्ठा को इस पद में पहले से जोड़ता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। दो समानांतर पंक्तियों में ‘निर्धन/ज़रूरतमंद’ और ‘उठाता है/ऊपर उठाता है’ के माध्यम से इब्रानी काव्य का अर्थगत साम्य तथा हल्का शब्दगत वैविध्य बनाए रखा गया है।
