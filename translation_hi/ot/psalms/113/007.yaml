  source_fidelity: 'The translation accurately preserves the two Hebrew participial clauses and their parallelism: God raises the דָּל from dust and lifts the אֶבְיוֹן from the אַשְׁפֹּת. ‘निर्धन’ and ‘ज़रूरतमंद’ appropriately retain the overlapping yet distinguishable social-vulnerability terms, while ‘धूल में से’ and ‘कूड़े के ढेर में से’ preserve the concrete imagery of abasement. ‘ऊपर उठाता है’ is a faithful rendering of יָרִים without importing the further notion of enthronement from the following verse.'
  naturalness: The Hindi is clear, dignified, and natural in a modern standard register. The repeated ‘उठाता है’ effectively conveys the poetic parallelism; ‘ऊपर’ supplies modest lexical variation and corresponds well to the second Hebrew verb.
