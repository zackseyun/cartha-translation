  text: הַ֥לְלוּ יָ֨הּ הַ֭לְלוּ עַבְדֵ֣י יְהוָ֑ה הַֽ֝לְלוּ אֶת שֵׁ֥ם יְהוָֽה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/113/001.yaml
  text: Praise Yah! Praise[a], servants of Yahweh[b]; praise the name of Yahweh.
translation:
  language: hi
  text: याह की स्तुति करो![a] हे याहवे के सेवकों,[b] स्तुति करो; याहवे के नाम की स्तुति करो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में “हालेलू-याह” का शाब्दिक अर्थ “याह की स्तुति करो” है; “याह” दिव्य नाम का संक्षिप्त रूप है।
    reason: lexical_alternative
  - marker: b
    text: या “याहवे के दासों”; इब्रानी शब्द सेवा करने वालों या दासों, दोनों के लिए प्रयुक्त हो सकता है। यहाँ उपासना के संदर्भ में “सेवकों” अधिक स्वाभाविक है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַלְלוּ
  choice: स्तुति करो
  rationale: पिएल बहुवचन आज्ञार्थक का सीधा और स्वाभाविक हिन्दी रूप; इसकी पुनरावृत्ति मूल के आह्वान और बल को बनाए रखती है।
- source_word: יָהּ
  choice: याह
  rationale: यह दिव्य नाम का संक्षिप्त रूप है; ‘याह’ रखने से इसी पद में आए पूर्ण रूप יְהוָה से स्रोत-पाठ का भेद बना रहता है।
- source_word: עַבְדֵי
  choice: सेवको
  rationale: עבד के संबंध-रूप बहुवचन को संबोधन में ‘सेवको’ कहना उपासना-संदर्भ में स्वाभाविक है; शब्द में दासत्व का अर्थ भी संभव है, जिसे पादटिप्पणी में रखा गया है।
- source_word: יְהוָה
  choice: यहवे
  rationale: इब्रानी व्यंजनात्मक दिव्य नाम YHWH का हिन्दी लिप्यंतरण; इससे יָהּ के संक्षिप्त रूप के साथ संबंध और भेद दोनों सुरक्षित रहते हैं।
- source_word: אֶת שֵׁם יְהוָה
  choice: यहवे के नाम की स्तुति करो
  rationale: प्रत्यक्ष कर्म और संबंध-पदबंध को स्वाभाविक हिन्दी क्रम में व्यक्त करता है तथा दिव्य नाम को स्तुति के विषय के रूप में स्पष्ट रखता है।
theological_decisions:
- issue: एक ही पद में יָהּ और יְהוָה का पृथक निरूपण
  choice: יָהּ को ‘याह’ और יְהוָה को ‘यहवे’
  alternative: दोनों को ‘प्रभु’ कहना, अथवा दोनों को एक ही नाम-रूप में प्रस्तुत करना
  rationale: मूल पाठ संक्षिप्त और पूर्ण दिव्य नाम-रूपों में वास्तविक भेद करता है। दोनों का पृथक लिप्यंतरण उस भेद को सुरक्षित रखता है और किसी संप्रदायगत व्याख्या को नहीं जोड़ता।
- issue: עַבְדֵי में सेवा और दासत्व की अर्थ-सीमा
  choice: मुख्य पाठ में ‘सेवको’
  alternative: ‘दासो’
  rationale: भजन के सामूहिक उपासना-संबोधन में ‘सेवक’ अधिक स्वाभाविक है, पर स्रोत शब्द के अधिक कठोर ‘दास’ अर्थ को पादटिप्पणी में स्पष्ट किया गया है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और उपासना के योग्य गरिमापूर्ण रखी गई है। तीनों आज्ञार्थक क्रियाओं की पुनरावृत्ति सुरक्षित है। संबोधन में ‘हे’ से हिन्दी वाक्य-विन्यास स्पष्ट होता है, जबकि अर्धविराम मूल के दूसरे और तीसरे आह्वान का संबंध बनाए रखता है।
