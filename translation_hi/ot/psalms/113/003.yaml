lexical_decisions:
- source_word: מִמִּזְרַח שֶׁמֶשׁ
  choice: सूरज के उगने से
  rationale: מִזְרַח पूर्व दिशा या उगने की क्रिया/स्थान को सूचित कर सकता है। שֶׁמֶשׁ और समानांतर מְבוֹאוֹ के साथ यहाँ सूर्योदय का काव्यात्मक अर्थ स्वाभाविक है।
- source_word: מְבוֹאוֹ
  choice: उसके डूबने तक
  rationale: शाब्दिक अर्थ ‘उसके भीतर जाने तक’ है और प्रत्यय सूरज की ओर संकेत करता है। आधुनिक हिन्दी में ‘उसके डूबने तक’ सूर्यास्त को सहज रूप से व्यक्त करता है।
- source_word: מְהֻלָּל
  choice: स्तुति की जानी चाहिए
  rationale: निष्क्रिय कृदंत में ‘स्तुति किया हुआ/स्तुति के योग्य’ का सामान्य और स्थायी भाव है। यह रूप कथन और निहित आह्वान दोनों को बनाए रखता है, बिना इसे सीधे आदेश में बदलने के।
- source_word: שֵׁם
  choice: नाम
  rationale: शाब्दिक रूप बनाए रखने से ख्याति, प्रकट पहचान और आराधना में ज्ञात व्यक्तित्व से जुड़ी इब्रानी अर्थ-समृद्धि सुरक्षित रहती है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में प्रचलित व्यक्तिगत नाम ‘यहोवा’ चतुरक्षरीय दिव्य नाम को किसी उपाधि से बदलने के बजाय नाम के रूप में प्रस्तुत करता है। वैकल्पिक उच्चारण ‘याहवे’ पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में व्यक्तिगत दिव्य नाम है। हिन्दी पाठकों के लिए परिचित ‘यहोवा’ को मुख्य पाठ में रखा गया है, जबकि ‘याहवे’ को संभावित उच्चारण के रूप में पादटिप्पणी में बताया गया है; ‘प्रभु’ नाम के स्थान पर उपाधि रख देता।
- issue: מְהֻלָּל का भाव
  choice: स्तुति की जानी चाहिए
  alternative: स्तुति होती है; स्तुति हो
  rationale: यह सामान्य सत्य और आराधना के निहित आह्वान दोनों को व्यक्त करता है तथा इब्रानी निष्क्रिय कृदंत को प्रत्यक्ष आज्ञा में नहीं बदलता।
translation_notes:
