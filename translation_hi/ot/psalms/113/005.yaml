  text: Who is like Yahweh our God[a], who is seated on high[b],
translation:
  language: hi
  text: हमारे परमेश्वर याहवे[a] के समान कौन है, जो ऊँचे स्थान पर विराजमान है[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में परमेश्वर का व्यक्तिगत नाम יהוה (YHWH) है; इसे परंपरागत रूप से “प्रभु” भी अनूदित किया जाता है।
    reason: alternative_reading
  - marker: b
    text: अधिक शाब्दिक रूप से, “जो बैठने के लिए अपने को ऊँचा करता है”; इसका आशय ऊँचे स्थान पर उसके राजसी विराजमान होने से हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי
  choice: कौन
  rationale: यह प्रश्नवाचक सर्वनाम एक अलंकारिक प्रश्न द्वारा याहवे की अतुलनीयता व्यक्त करता है।
- source_word: כַ/יהוָה
  choice: याहवे के समान
  rationale: उपसर्ग כ तुलना व्यक्त करता है। יהוה को परमेश्वर के व्यक्तिगत वाचा-नाम के रूप में ‘याहवे’ लिखा गया है।
- source_word: אֱלֹהֵינוּ
  choice: हमारे परमेश्वर
  rationale: यह אֱלֹהִים का प्रथम पुरुष बहुवचन स्वत्व-प्रत्यय वाला रूप है और इसका सीधा अर्थ ‘हमारे परमेश्वर’ है।
- source_word: הַמַּגְבִּיהִי
  choice: ऊँचे पर विराजमान
  rationale: यह रूप ऊँचा होने अथवा अपने को ऊँचा करके स्थित होने का भाव देता है; לָשָׁבֶת के साथ यह परमेश्वर की उच्च, राजसी स्थिति को व्यक्त करता है।
- source_word: לָשָׁבֶת
  choice: विराजमान है
  rationale: मूल क्रिया का अर्थ ‘बैठना’ या ‘निवास करना’ हो सकता है। यहाँ ऊँचे स्थान पर राजसी ढंग से बैठे होने के चित्र के लिए ‘विराजमान’ स्वाभाविक और गरिमापूर्ण है।
theological_decisions:
- issue: परमेश्वर के नाम יהוה का अनुवाद
  choice: याहवे
  alternative: प्रभु; यहोवा
  rationale: मूल पाठ में चतुरक्षरीय व्यक्तिगत नाम יהוה है। ‘याहवे’ उस नाम को उपाधि में बदलने के बजाय नाम के रूप में सुरक्षित रखता है।
- issue: הַמַּגְבִּיהִי לָשָׁבֶת में आत्म-उन्नयन और सिंहासनारूढ़ता का संबंध
  choice: जो ऊँचे पर विराजमान है
  alternative: जो बैठने के लिए अपने को ऊँचा करता है
  rationale: चुना हुआ पाठ उच्च स्थान पर राजसी उपस्थिति का भाव स्वाभाविक हिन्दी में देता है, जबकि पादटिप्पणी अधिक शाब्दिक संरचना और उसकी अस्पष्टता सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल किंतु गरिमापूर्ण शैली अपनाई गई है। ‘विराजमान’ बैठने और राजसी उच्चता—दोनों भावों को जोड़ता है; अधिक शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
