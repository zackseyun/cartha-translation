  yaml_path: translation/ot/psalms/062/001.yaml
  text: Only for God is my soul silent[b][a]; from him comes my salvation.
translation:
  language: hi
  text: केवल परमेश्वर के सामने मेरी आत्मा मौन है[a]; उसी से मेरा उद्धार आता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इसका अनुवाद यह भी हो सकता है: “मेरी आत्मा केवल परमेश्वर की मौन प्रतीक्षा करती है,” या “केवल परमेश्वर में मेरी आत्मा को विश्राम मिलता है।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: केवल
  rationale: यहाँ यह शब्द मुख्यतः प्रतिबंध और अनन्य भरोसे को व्यक्त करता है; ‘केवल’ पद की संक्षिप्त काव्यात्मकता भी बनाए रखता है।
- source_word: אֶל
  choice: के सामने
  rationale: यह पूर्वसर्ग परमेश्वर की ओर उन्मुख होने का भाव देता है। ‘के सामने’ आधुनिक हिन्दी में मौन और भरोसे की मुद्रा को स्वाभाविक ढंग से व्यक्त करता है, यद्यपि शाब्दिक रूप से ‘की ओर’ भी संभव है।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: इस एकवचन-संदर्भ में यह इस्राएल के परमेश्वर के लिए प्रयुक्त है; हिन्दी बाइबलीय शैली में ‘परमेश्वर’ स्वाभाविक और प्रतिष्ठित रूप है।
- source_word: דּוּמִיָּה
  choice: मौन है
  rationale: संज्ञा का मूल भाव मौन, निस्तब्धता या शांत प्रतीक्षा है। ‘मौन है’ मूल बिंब को बनाए रखता है और प्रतीक्षा अथवा विश्राम के अर्थ को मुख्य पाठ में अनावश्यक रूप से निश्चित नहीं करता।
- source_word: נַפְשִׁי
  choice: मेरी आत्मा
  rationale: נֶפֶשׁ यहाँ व्यक्ति के भीतरी स्व या संपूर्ण जीवित व्यक्तित्व को सूचित कर सकता है। ‘मेरी आत्मा’ काव्यात्मक और पारंपरिक अभिव्यक्ति को सुरक्षित रखता है।
- source_word: מִמֶּנּוּ
  choice: उसी से
  rationale: पूर्वसर्ग स्रोत को दर्शाता है। ‘उसी से’ हिन्दी में पहले खंड की अनन्यता को स्वाभाविक रूप से प्रतिध्वनित करता है।
- source_word: יְשׁוּעָתִי
  choice: मेरा उद्धार
  rationale: यह शब्द बचाव, छुटकारे अथवा विजय को सूचित कर सकता है। ‘मेरा उद्धार’ भजन के व्यापक धार्मिक और काव्यात्मक संदर्भ के अनुकूल है।
theological_decisions:
- issue: דּוּמִיָּה נַפְשִׁי का आशय
  choice: परमेश्वर के सामने भरोसे भरा मौन
  alternative: परमेश्वर की मौन प्रतीक्षा करना; परमेश्वर में विश्राम पाना
  rationale: इब्रानी पदबंध मौन, स्थिरता और शांत प्रतीक्षा—इन निकटवर्ती भावों को समेट सकता है। मुख्य पाठ ‘मौन’ के मूल बिंब को रखता है और वैकल्पिक अर्थों को पाद-टिप्पणी में देता है।
- issue: אַךְ की अनन्यता का संबंध
  choice: आत्मा का अनन्य उन्मुखीकरण परमेश्वर की ओर
  alternative: कथन की निश्चितता पर बल—‘निश्चय ही’
  rationale: इस प्रसंग में प्रतिबंधात्मक अर्थ अधिक प्रबल है और अगले खंड में उद्धार के एकमात्र स्रोत के रूप में परमेश्वर से मेल खाता है; फिर भी इसे किसी विशिष्ट सांप्रदायिक सिद्धांत के रूप में विस्तृत नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। ‘मौन’ मूल काव्य-बिंब को बचाता है, जबकि ‘के सामने’ हिन्दी में परमेश्वर की ओर उन्मुख शांत मुद्रा को सहज बनाता है।
