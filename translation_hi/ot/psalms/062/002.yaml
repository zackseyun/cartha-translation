  yaml_path: translation/ot/psalms/062/002.yaml
  text: He alone is my rock and my salvation[a], my stronghold; I will not be greatly shaken.
translation:
  language: hi
  text: केवल वही मेरी चट्टान और मेरा उद्धार है, मेरा गढ़; मैं बहुत नहीं डगमगाऊँगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं नहीं डगमगाऊँगा।” इब्रानी में ‘बहुत’/‘अत्यन्त’ का अर्थ देने वाला एक शब्द है, जो डगमगाने की मात्रा को सीमित करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: केवल
  rationale: यहाँ यह शब्द परमेश्वर को सुरक्षा के एकमात्र स्रोत के रूप में रेखांकित करता है; ‘केवल’ आधुनिक हिन्दी में इस विशिष्टता को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הוּא
  choice: वही
  rationale: तीसरे पुरुष का सर्वनाम परमेश्वर की ओर संकेत करता है; ‘वही’ אַךְ के साथ मिलकर बल और विशिष्टता दोनों बनाए रखता है।
- source_word: צוּרִי
  choice: मेरी चट्टान
  rationale: यह स्थिरता और रक्षा का परिचित रूपक है; ‘चट्टान’ मूल बिंब को सीधे सुरक्षित रखता है।
- source_word: וִישׁוּעָתִי
  choice: मेरा उद्धार
  rationale: यह शब्द बचाव और छुटकारे के व्यापक अर्थ को व्यक्त करता है; ‘उद्धार’ भजन के संकट और सुरक्षा—दोनों संदर्भों में उपयुक्त है।
- source_word: מִשְׂגַּבִּי
  choice: मेरा दृढ़ गढ़
  rationale: मूल शब्द ऊँचे, सुरक्षित दुर्ग का बोध देता है; ‘दृढ़ गढ़’ रक्षा और अभेद्यता के सैन्य बिंब को सहज हिन्दी में रखता है।
- source_word: לֹא אֶמּוֹט
  choice: मैं न डगमगाऊँगा
  rationale: निफ़अल रूप हिलने, अस्थिर होने या लड़खड़ाने का भाव देता है; ‘डगमगाना’ हिन्दी में इस रूपक को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: רַבָּה
  choice: बहुत
  rationale: यहाँ स्त्रीलिंग विशेषण क्रियाविशेषण की तरह डगमगाने की मात्रा बताता है; ‘बहुत’ इस सीमा-सूचक सूक्ष्मता को बनाए रखता है।
theological_decisions:
- issue: अंतिम कथन में व्यक्त सुरक्षा की मात्रा
  choice: मैं बहुत न डगमगाऊँगा
  alternative: मैं न डगमगाऊँगा
  rationale: इब्रानी पाठ में רַבָּה मात्रा-सूचक शब्द मौजूद है। उसे बनाए रखने से कथन को निकटवर्ती अधिक निरपेक्ष पंक्ति के अनुरूप करने के बजाय इस पद की वास्तविक सूक्ष्मता सुरक्षित रहती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘चट्टान’ और ‘गढ़’ जैसे ठोस काव्यात्मक बिंब सुरक्षित हैं। ‘मैं बहुत न डगमगाऊँगा’ सामान्य गद्य से कुछ अधिक काव्यात्मक है, पर मूल की मात्रा-सूचक अस्पष्टता को बिना मिटाए संक्षेप में व्यक्त करता है।
