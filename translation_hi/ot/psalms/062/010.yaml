base_translation:
  language: en
  yaml_path: translation/ot/psalms/062/010.yaml
  text: Do not trust in oppression[a], and do not put vain hope in robbery; if wealth increases, do not set your heart on it.
translation:
  language: hi
  text: 'अत्याचार पर भरोसा मत रखो,

    और लूट पर व्यर्थ भरोसा मत करो[a];

    यदि धन बढ़े, तो उस पर अपना मन मत लगाओ।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “लूट के विषय में व्यर्थ मत इतराओ,” अथवा “लूट पर घमंड मत करो।” यहाँ प्रयुक्त इब्रानी क्रिया कठिन है और खोखला या व्यर्थ आचरण करने, अथवा किसी खोखली वस्तु पर भरोसा रखने का भाव दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּבְטְחוּ
  choice: भरोसा मत रखो
  rationale: בטח का सामान्य अर्थ भरोसा या विश्वास रखना है। यह सहज आधुनिक हिन्दी में अन्यायपूर्ण साधनों पर निर्भर न रहने की चेतावनी व्यक्त करता है।
- source_word: בְעֹשֶׁק
  choice: अत्याचार पर
  rationale: עֹשֶׁק में उत्पीड़न, शोषण और बलपूर्वक अनुचित लाभ लेने का व्यापक भाव है। ‘अत्याचार’ इस नैतिक विस्तार को बनाए रखता है और अर्थ को केवल धन की जबरन वसूली तक सीमित नहीं करता।
- source_word: בְגָזֵל
  choice: लूट पर
  rationale: גָזֵל बलपूर्वक छीनी गई वस्तु या लूट को दर्शाता है। ‘लूट’ संक्षिप्त, स्पष्ट और पहले पदांश के समानांतर है।
- source_word: תֶּהְבָּלוּ
  choice: व्यर्थ आशा मत लगाओ
  rationale: הבל से बना यह कठिन क्रियारूप खोखलेपन, व्यर्थता या व्यर्थ अभिमान का भाव दे सकता है। इस समानांतर संदर्भ में ‘व्यर्थ आशा मत लगाओ’ किसी खोखली वस्तु पर निर्भर होने का आशय स्वाभाविक हिन्दी में देता है; अन्य संभावनाएँ पादटिप्पणी में सुरक्षित हैं।
- source_word: חַיִל
  choice: धन
  rationale: חַיִל का अर्थ सामर्थ्य, साधन या संपत्ति हो सकता है। יָנוּב (‘बढ़े/फले’) के साथ यहाँ भौतिक धन सबसे उपयुक्त है।
- source_word: כִּי יָנוּב
  choice: यदि धन बढ़े
  rationale: נוב मूलतः अंकुरित होने, फलने या बढ़ने को व्यक्त करता है। धन के संदर्भ में ‘बढ़े’ स्वाभाविक है, और ‘यदि’ כי की यहाँ संभावित शर्तसूचक बारीकी बनाए रखता है।
- source_word: תָּשִׁיתוּ לֵב
  choice: उस पर अपना मन मत लगाओ
  rationale: שׁית לב का शाब्दिक भाव हृदय या मन को किसी वस्तु पर लगाना है। यह हिन्दी मुहावरा आसक्ति, ध्यान और आंतरिक भरोसे—तीनों के भाव को खुला रखता है।
theological_decisions:
- issue: मध्य पदांश में תֶּהְבָּלוּ का अर्थ
  choice: लूट पर व्यर्थ आशा रखने के विरुद्ध चेतावनी
  alternative: ‘लूट में व्यर्थ मत बनो’ अथवा ‘लूट पर घमंड मत करो’
  rationale: क्रिया का सटीक आशय विवादित है। मुख्य पाठ समानांतरता के अनुसार खोखली आशा का भाव व्यक्त करता है, जबकि पादटिप्पणी व्यर्थ आचरण और घमंड की वास्तविक शाब्दिक संभावनाओं को सुरक्षित रखती है।
- issue: अन्यायपूर्ण लाभ से सामान्य धन की ओर कथन की गति
  choice: पहले अत्याचार और लूट पर निर्भरता निषिद्ध है; फिर बढ़ते हुए धन पर मन लगाने से भी रोका गया है
  alternative: पूरे पद को केवल अन्याय से कमाए गए धन के विषय में पढ़ना
  rationale: अंतिम पदांश में חַיִל अपने आप में धन या साधन को सूचित करता है और उसके अन्याय से प्राप्त होने की बात स्पष्ट रूप से नहीं कहता। इसलिए चेतावनी को सामान्य धन तक विस्तृत रहने दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। काव्यात्मक तीन पदांश पंक्ति-विभाजन से सुरक्षित हैं। ‘अत्याचार’, ‘लूट’, ‘धन’ और ‘मन लगाना’ परिचित शब्दावली हैं; कठिन इब्रानी क्रिया की अस्पष्टता पादटिप्पणी में स्पष्ट की गई है।
