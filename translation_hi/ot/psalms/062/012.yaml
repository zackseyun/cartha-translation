  choice: फल देते हैं
  rationale: यहाँ क्रिया का अर्थ किसी को उसके किए के अनुरूप देना है, चाहे परिणाम अनुकूल हो या प्रतिकूल। ‘फल देते हैं’ केवल पुरस्कार तक अर्थ को सीमित नहीं करता।
- source_word: לְאִישׁ
  choice: हर एक मनुष्य को
  rationale: एकवचन पुल्लिंग संज्ञा यहाँ प्रतिनिधिक और वितरणात्मक अर्थ में है। ‘हर एक मनुष्य’ उसके सामान्य मानवीय संदर्भ और एक-एक व्यक्ति पर लागू होने का भाव व्यक्त करता है।
- source_word: כְּמַעֲשֵׂהוּ
  choice: उसके काम के अनुसार
  rationale: यह अनुवाद मूल के एकवचन रूप और किसी व्यक्ति के किए के अनुरूप प्रतिफल मिलने के भाव को बनाए रखता है।
theological_decisions:
- issue: परमेश्वर के अटल प्रेम और न्यायपूर्ण प्रतिफल का संबंध
  choice: अटल प्रेम और प्रत्येक मनुष्य को उसके काम के अनुसार फल देना—दोनों कथनों को बिना नरम किए साथ रखा गया है।
