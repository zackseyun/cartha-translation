translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण काव्यात्मक हिन्दी है। ‘आपका ही है’ मूल के अग्रस्थ स्वामित्व-सूचक पद का बल व्यक्त करता है, और ‘फल देते हैं’ सकारात्मक तथा नकारात्मक—दोनों प्रकार के न्यायपूर्ण परिणामों के लिए खुला रहता है।
