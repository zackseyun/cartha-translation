  yaml_path: translation/ot/psalms/062/003.yaml
  text: How long will you assail a man? Will you all break him down[a], like a leaning wall[c][b], a tottering fence?
translation:
  language: hi
  text: 'तुम कब तक एक आदमी पर टूट पड़ोगे?


    क्या तुम सब मिलकर उसे ढहा दोगे[a],


    मानो वह झुकी हुई दीवार[b],


    गिरने को तैयार बाड़ हो?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसकी हत्या कर दोगे।” इब्रानी क्रिया का सामान्य अर्थ हत्या करना है, पर दीवार और बाड़ के अगले बिंब के कारण यहाँ “ढहा देना” रूपकात्मक अर्थ हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: तुलना का अर्थ यह हो सकता है कि आक्रमण का शिकार व्यक्ति झुकी दीवार और गिरती बाड़ के समान निर्बल है। कुछ लोग इसे आक्रमणकारियों का उसके विरुद्ध उभरी हुई दीवार की तरह इकट्ठा होना मानते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: תְּהֽוֹתְת֣וּ
  choice: टूट पड़ोगे
  rationale: यह दुर्लभ क्रिया हिंसक और सामूहिक आक्रमण का भाव रखती है। ‘टूट पड़ना’ आधुनिक हिन्दी में उस तीव्रता को स्वाभाविक रूप से व्यक्त करता है।
- source_word: עַל אִישׁ
  choice: एक आदमी पर
  rationale: אִישׁ यहाँ एकवचन पुल्लिंग है और किसी विशेष व्यक्ति को निशाना बनाए जाने का संकेत देता है।
- source_word: תְּרָצְּחוּ
  choice: उसे ढहा दोगे
  rationale: क्रिया सामान्यतः हत्या करने का अर्थ दे सकती है, पर आगे दीवार और बाड़ के बिंब के साथ यहाँ रूपकात्मक ‘ढहा देना’ संदर्भ में सुसंगत है; शाब्दिक विकल्प पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: כֻלְּכֶם
  choice: तुम सब मिलकर
  rationale: यह बहुवचन की सामूहिक और बलाघाती शक्ति को सहज हिन्दी में व्यक्त करता है।
- source_word: כְּקִיר נָטוּי
  choice: मानो वह झुकी हुई दीवार
  rationale: यह मूल बिंब और उसके अस्थिर, गिरने के निकट होने का भाव बनाए रखता है।
- source_word: גָּדֵר הַדְּחוּיָה
  choice: गिरने को तैयार बाड़
  rationale: דחה से बना रूप धकेली गई या गिरने की दशा में पहुँची संरचना का संकेत देता है। यह चयन हिन्दी में स्वाभाविक रहते हुए आसन्न पतन का बिंब देता है।
