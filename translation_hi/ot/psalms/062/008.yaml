  text: Trust in him at all times[a], O people; pour out your hearts before him. God is a refuge for us[d][c][b]. Selah
translation:
  language: hi
  text: हे लोगो, हर समय उस पर भरोसा रखो[a]; अपने हृदयों को उसके सामने उँडेल दो[b]। परमेश्वर हमारे लिए शरणस्थान है। सेला[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ ‘हर एक समय में’; इसका अर्थ ‘निरंतर’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘अपने हृदयों को उँडेल दो’ एक इब्रानी रूपक है, जिसका अर्थ परमेश्वर के सामने अपने भीतरी विचार, भावनाएँ और इच्छाएँ खुलकर प्रकट करना है।
    reason: lexical_alternative
  - marker: c
    text: ‘सेला’ संभवतः आराधना या संगीत से जुड़ा शब्द है; इसका ठीक अर्थ अनिश्चित है।
    reason: cultural_note
lexical_decisions:
- source_word: בִּטְחוּ בּוֹ
  choice: उस पर भरोसा रखो
  rationale: बहुवचन आज्ञार्थक रूप समुदाय को परमेश्वर पर विश्वास और निर्भरता रखने का आह्वान करता है; आधुनिक हिन्दी में यह स्वाभाविक है।
- source_word: בְכָל־עֵת
  choice: हर समय
  rationale: शाब्दिक अर्थ ‘प्रत्येक समय’ है; ‘हर समय’ निरंतर और सभी परिस्थितियों में भरोसा रखने का भाव स्पष्ट करता है।
- source_word: עָם
  choice: हे लोगो
  rationale: यह समुदाय को किया गया सीधा संबोधन है; ‘हे लोगो’ सम्बोधनात्मक बल को बनाए रखता है, बिना इसे किसी विशिष्ट राष्ट्र तक सीमित किए।
- source_word: שִׁפְכוּ לְפָנָיו לְבַבְכֶם
  choice: उसके सामने अपने हृदय खोलकर रख दो
  rationale: मूल रूपक का आशय परमेश्वर के सामने मन की बातें, भावनाएँ और इच्छाएँ बिना रोक-टोक प्रकट करना है। हिन्दी में ‘हृदय उँडेल दो’ अधिक शाब्दिक होता, पर ‘हृदय खोलकर रख दो’ उसी भाव को अधिक स्वाभाविक ढंग से व्यक्त करता है। बहुवचन संबोधन के साथ ‘अपने हृदय’ प्रत्येक संबोधित व्यक्ति के हृदय को सामूहिक रूप से दर्शाता है।
- source_word: אֱלֹהִים מַחֲסֶה לָנוּ
  choice: परमेश्वर हमारे लिए शरणस्थान है
  rationale: מַחֲסֶה सुरक्षा और आश्रय की जगह को दर्शाता है; ‘शरणस्थान’ संक्षिप्त, स्पष्ट और काव्यात्मक है।
- source_word: סֶלָה
  choice: सेला
  rationale: इस आराधनात्मक या संगीतमय पद का ठीक अर्थ अनिश्चित है, इसलिए अनुमानित अर्थ देने के बजाय लिप्यंतरण रखा गया है।
theological_decisions:
- issue: עָם का सामुदायिक संबोधन
  choice: ‘हे लोगो’ के रूप में सीधे समुदाय को संबोधन
  alternative: केवल ‘लोग’ अथवा ‘हे राष्ट्र’
  rationale: आज्ञार्थक क्रियाओं के बीच यह पद स्वाभाविक रूप से सम्बोधन है। यह सामुदायिक आयाम बनाए रखता है और अनावश्यक जातीय या राजनीतिक संकीर्णता से बचता है।
- issue: סֶלָה का अर्थ
  choice: ‘सेला’ को अनूदित न करके लिप्यंतरित करना
  alternative: ‘विराम’ अथवा ‘संगीतांतर’
  rationale: शब्द का सटीक अर्थ अनिश्चित है; लिप्यंतरण इस अनिश्चितता को ईमानदारी से सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सामुदायिक काव्यात्मक संबोधन। ‘भरोसा रखो,’ ‘हृदय खोलकर रख दो’ और ‘शरणस्थान’ सामान्य पाठक के लिए स्पष्ट हैं; मूल की अनिश्चितता ‘सेला’ के लिप्यंतरण और पादटिप्पणी में सुरक्षित है।
