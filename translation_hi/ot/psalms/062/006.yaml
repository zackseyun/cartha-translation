  yaml_path: translation/ot/psalms/062/006.yaml
  text: He alone is my rock and my salvation[a], my stronghold; I will not be shaken.
translation:
  language: hi
  text: केवल वही मेरी चट्टान और मेरा उद्धार है, मेरा गढ़; मैं नहीं डगमगाऊँगा।[क]
  philosophy: optimal-equivalence
  footnotes:
  - marker: क
    text: या, “मैं हिलाया न जाऊँगा।”
    reason: इब्रानी לֹא אֶמּוֹט के निफ़अल रूप का अधिक शाब्दिक वैकल्पिक अनुवाद; मुख्य पाठ के ‘मैं नहीं डगमगाऊँगा’ को समर्थन देता है।
lexical_decisions:
- source_word: אַךְ הוּא
  choice: वही
  rationale: यह संयोजन यहाँ विशिष्टता और बल व्यक्त करता है—परमेश्वर ही चट्टान, उद्धार और दृढ़ गढ़ हैं। आधुनिक हिन्दी में ‘वही’ इस अर्थ को स्वाभाविक और संक्षिप्त रूप से व्यक्त करता है।
- source_word: צוּרִי
  choice: मेरी चट्टान
  rationale: צוּר स्थिरता और सुरक्षा का रूपक है। ‘मेरी चट्टान’ मूल काव्यात्मक चित्र को स्पष्ट और गरिमापूर्ण हिन्दी में बनाए रखता है।
- source_word: וִישׁוּעָתִי
  choice: मेरा उद्धार
  rationale: יְשׁוּעָה बचाव अथवा छुटकारे का व्यापक भाव रखता है। ‘उद्धार’ तात्कालिक रक्षा और व्यापक धार्मिक अर्थ, दोनों के लिए उपयुक्त है।
- source_word: מִשְׂגַּבִּי
  choice: मेरा दृढ़ गढ़
  rationale: מִשְׂגָּב ऊँचे और सुरक्षित आश्रय या किले को दर्शाता है। ‘दृढ़ गढ़’ सुरक्षा, ऊँचाई और अभेद्यता के काव्यात्मक भाव को सहज हिन्दी में व्यक्त करता है।
- source_word: לֹא אֶמּוֹט
  choice: मैं नहीं डगमगाऊँगा
  rationale: מוֹט का निफ़अल रूप हिलाए जाने, अस्थिर होने या डगमगाने का भाव देता है। ‘मैं नहीं डगमगाऊँगा’ स्थिर विश्वास के रूपक को आधुनिक और स्वाभाविक हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: अंतिम उपवाक्य में विश्वास की दृढ़ता
  choice: मैं नहीं डगमगाऊँगा
  alternative: मैं हिलाया न जाऊँगा
  rationale: इब्रानी वाक्य परमेश्वर पर भरोसे से उत्पन्न स्थिरता व्यक्त करता है। चुना हुआ पाठ पूर्ण अभेद्यता का अतिरिक्त दावा जोड़े बिना आत्मविश्वास और स्थिरता के रूपक को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, काव्यात्मक किंतु सामान्य पाठक के लिए सहज रखी गई है। ‘चट्टान’ और ‘गढ़’ जैसे ठोस बिंब मूल इब्रानी समानांतरता और सुरक्षा की छवि को बनाए रखते हैं।
