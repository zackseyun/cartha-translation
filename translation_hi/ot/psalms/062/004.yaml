id: PSA.62.4
reference: Psalms 62:4
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אַ֤ךְ מִ/שְּׂאֵת֨/וֹ יָעֲצ֣וּ לְ/הַדִּיחַ֮ יִרְצ֪וּ כָ֫זָ֥ב בְּ/פִ֥י/ו יְבָרֵ֑כוּ וּ֝/בְ/קִרְבָּ֗/ם יְקַלְלוּ סֶֽלָה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/062/004.yaml
  text: They only plan to cast him down from his high position[a]; they delight in falsehood. With their mouth they bless, but inwardly they curse[b]. Selah
translation:
  language: hi
  text: वे केवल उसे उसके ऊँचे पद से गिराने की योजना बनाते हैं[a]; वे झूठ से प्रसन्न होते हैं। अपने मुँह से वे आशीर्वाद देते हैं, पर भीतर ही भीतर शाप देते हैं[b]। सेला
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसकी गरिमा से,” “उसकी ऊँचाई से,” अथवा “उसकी प्रतिष्ठा से।”
    reason: lexical_alternative
  - marker: b
    text: 'इब्रानी में शाब्दिक रूप से “उसके मुँह से वे आशीर्वाद देते हैं”; संभवतः आशय सामूहिक है: वे बाहर से आशीर्वाद देते हैं, पर भीतर शाप देते हैं।'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: केवल
  rationale: यह अव्यय यहाँ विरोधियों के एकमात्र उद्देश्य को सीमित करता है; ‘केवल’ उसके प्रतिबंधात्मक बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מִשְּׂאֵתוֹ
  choice: उसके ऊँचे पद से
  rationale: שְׂאֵת ऊँचाई, प्रतिष्ठा या गरिमा का बोध करा सकता है। संदर्भ में किसी को गिराने की साज़िश है, इसलिए ‘ऊँचा पद’ स्थान और प्रतिष्ठा—दोनों अर्थों को खुला रखता है।
- source_word: יָעֲצוּ
  choice: योजना बनाते हैं
  rationale: क्रिया सोच-विचार करके परामर्श या षड्यंत्र करने को व्यक्त करती है। शत्रुतापूर्ण संदर्भ में ‘योजना बनाते हैं’ स्पष्ट और आधुनिक है।
- source_word: לְהַדִּיחַ
  choice: गिराने
  rationale: हिफ़ईल रूप किसी को हटाने, दूर धकेलने या नीचे गिराने का कारण बनने को दर्शाता है। ऊँचे पद के साथ ‘गिराने’ का प्रयोग उपयुक्त है।
- source_word: יִרְצוּ כָזָב
  choice: वे झूठ से प्रसन्न होते हैं
  rationale: רצה यहाँ असत्य को पसंद करने या उसमें आनंद लेने का भाव देता है। ‘झूठ से प्रसन्न होते हैं’ इस नैतिक और भावात्मक अर्थ को बनाए रखता है।
- source_word: בְּפִיו יְבָרֵכוּ
  choice: अपने मुँह से वे आशीर्वाद देते हैं
  rationale: इब्रानी में प्रत्यय शाब्दिक रूप से एकवचन ‘उसके मुँह’ है, किंतु बहुवचन क्रिया और समानांतर पंक्ति सामूहिक अर्थ की ओर संकेत करती हैं। मुख्य पाठ में स्वाभाविक अर्थ रखा गया है और शाब्दिक रूप पादटिप्पणी में बताया गया है।
- source_word: וּבְקִרְבָּם
  choice: भीतर ही भीतर
  rationale: शाब्दिक अर्थ ‘उनके भीतर’ है; यहाँ यह बाहरी वाणी के विपरीत आंतरिक मनोभाव को दर्शाता है।
- source_word: יְקַלְלוּ
  choice: शाप देते हैं
  rationale: यह क्रिया सीधे शाप देने को व्यक्त करती है और ‘आशीर्वाद देते हैं’ के साथ तीखा विरोध बनाए रखती है।
- source_word: סֶלָה
  choice: सेला
  rationale: इस सांगीतिक या उपासना-संबंधी पद का सटीक अर्थ अनिश्चित है; इसलिए इसका लिप्यंतरण किया गया है।
theological_decisions:
- issue: ‘उसके ऊँचे पद से’ में एकवचन प्रत्यय और ‘गिराने’ का कर्म
  choice: विरोधी एक पुरुष लक्ष्य—संदर्भतः भजनकार या धर्मी व्यक्ति—को उसके ऊँचे अथवा प्रतिष्ठित स्थान से गिराना चाहते हैं।
  alternative: ‘किसी को’ जैसा सामान्य कर्म रखा जा सकता है, या पद के बजाय उसकी गरिमा/प्रतिष्ठा पर बल दिया जा सकता है।
  rationale: इब्रानी प्रत्यय पुल्लिंग एकवचन है। ‘उसे’ इस व्यक्तिगत लक्ष्य को सुरक्षित रखता है, पर किसी विशेष बाद की धर्मवैज्ञानिक पहचान को आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज और काव्यात्मक गद्य रखा गया है। ‘ऊँचे पद’ मूल की स्थानगत और प्रतिष्ठासूचक अस्पष्टता को बनाए रखता है; ‘भीतर ही भीतर’ बाहरी आशीर्वाद और आंतरिक शाप के विरोध को स्वाभाविक हिन्दी में उभारता है।
