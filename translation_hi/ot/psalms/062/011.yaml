  yaml_path: translation/ot/psalms/062/011.yaml
  text: 'One thing God has spoken[a]; two things I have heard: that strength belongs to God.'
translation:
  language: hi
  text: 'एक बात परमेश्वर ने कही है[a]; दो बातें मैंने सुनी हैं: सामर्थ्य परमेश्वर का है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “एक बार परमेश्वर ने कहा; दो बार मैंने यह सुना।” इब्रानी मुहावरे को समय-सूचक अर्थ में (“एक बार/दो बार”) या संख्यात्मक कथन-शैली में (“एक बात/दो बातें”) पढ़ा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: אַחַת
  choice: एक बात
  rationale: स्त्रीलिंग एकवचन संख्या का मूल अर्थ ‘एक’ है। आगे ‘दो’ के साथ मिलकर यह संख्यात्मक कथन-शैली बनाती है; इसलिए ‘एक बात’ स्वाभाविक और अर्थानुकूल है।
- source_word: דִּבֶּר
  choice: कही है
  rationale: पूर्ण क्रिया को हिन्दी में वर्तमान पूर्णकाल से व्यक्त किया गया है, जिससे कही हुई बात की वर्तमान प्रासंगिकता बनी रहती है। ‘बात’ के साथ ‘कही’ स्वाभाविक हिन्दी है।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: यहाँ रूप व्याकरणतः बहुवचन होते हुए भी एकवचन अर्थ में इस्राएल के परमेश्वर को सूचित करता है।
- source_word: שְׁתַּיִם
  choice: दो बातें
  rationale: ‘एक’ के समानांतर इसे संख्यात्मक कथन-शैली के रूप में लिया गया है। हिन्दी में स्पष्टता और स्वाभाविकता के लिए ‘बातें’ जोड़ा गया है।
- source_word: זוּ
  choice: दो बातें मैंने सुनी हैं
  rationale: यह संकेतवाची रूप आगे आने वाली बात की ओर संकेत करता है। हिन्दी में इसे अलग से ‘यह’ कहने के बजाय पूरे मुहावरे में स्वाभाविक रूप से समाहित किया गया है।
- source_word: שָׁמָעְתִּי
  choice: मैंने सुनी हैं
  rationale: पूर्ण क्रिया का वर्तमान पूर्णकालीन अनुवाद उस बात को व्यक्त करता है जिसे भजनकार सुन चुका है और जो अब भी उसके लिए मान्य है।
- source_word: כִּי
  choice: ':'
  rationale: यह शब्द सुनी गई बात की विषय-वस्तु प्रस्तुत करता है। हिन्दी में द्विबिंदु उसी संबंध को अधिक स्वाभाविक रूप से व्यक्त करता है; ‘कि’ भी सम्भव था।
- source_word: עֹז
  choice: सामर्थ्य
  rationale: यह संज्ञा शक्ति या बल को व्यक्त करती है। ‘सामर्थ्य’ आधुनिक, गरिमापूर्ण हिन्दी में व्यापक और स्वाभाविक है।
- source_word: לֵאלֹהִים
  choice: परमेश्वर ही का है
  rationale: ל यहाँ स्वामित्व या संबंध दर्शाता है। ‘ही’ पद्य के बलाघात को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि ‘का है’ स्वामित्व को स्पष्ट रखता है।
theological_decisions:
- issue: ‘एक...दो’ वाली संख्यात्मक कथन-शैली
  choice: ‘एक बात परमेश्वर ने कही है; दो बातें मैंने सुनी हैं’
  alternative: ‘एक बार परमेश्वर ने कहा; दो बार मैंने यह सुना’
  rationale: इब्रानी को समय-सूचक ‘एक बार/दो बार’ या संख्यात्मक कथन-शैली ‘एक बात/दो बातें’ दोनों रूपों में समझा जा सकता है। मुख्य पाठ में दूसरा अर्थ वाक्य-संरचना और आगे आने वाली विषय-वस्तु के साथ अधिक सहज है; वास्तविक वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और काव्यात्मक शैली रखी गई है। ‘सामर्थ्य परमेश्वर ही का है’ स्वामित्व और बलाघात दोनों को व्यक्त करता है। मुख्य पाठ में इब्रानी की संख्यात्मक समानांतरता बनाए रखी गई है और वैकल्पिक समय-सूचक पाठ पादटिप्पणी में दिया गया है।
