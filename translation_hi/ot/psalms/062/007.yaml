lexical_decisions:
- source_word: עַל
  choice: परमेश्वर पर ही टिके हैं
  rationale: इब्रानी पदबंध निर्भरता या आधार का भाव व्यक्त करता है। ‘पर टिके हैं’ इस रूपक को स्वाभाविक हिन्दी में बनाए रखता है; ‘ही’ परमेश्वर पर केंद्रित बल को संदर्भानुकूल स्पष्ट करता है।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: यहाँ इस्राएल के परमेश्वर के लिए प्रयुक्त אֱלֹהִים का मानक, स्वाभाविक हिन्दी रूप।
- source_word: יִשְׁעִי
  choice: मेरा उद्धार
  rationale: ישׁע से बना यह शब्द छुटकारे, बचाव और व्यापक धार्मिक अर्थ में उद्धार को व्यक्त करता है।
- source_word: וּכְבוֹדִי
  choice: और मेरा गौरव
  rationale: כָּבוֹד का अर्थ गौरव या सम्मान हो सकता है। ‘गौरव’ काव्यात्मक समानांतरता और अर्थ की व्यापकता बनाए रखता है।
- source_word: צוּר
  choice: चट्टान
  rationale: स्थिरता और सुरक्षा के सामान्य काव्यात्मक रूपक को सीधे सुरक्षित रखता है।
- source_word: עֻזִּי
  choice: मेरी सामर्थ्य
  rationale: עֹז का सीधा अर्थ सामर्थ्य या बल है; ‘गढ़’ जैसे अधिक विशिष्ट चित्र को अनावश्यक रूप से नहीं जोड़ा गया।
- source_word: מַחְסִי
  choice: मेरा शरणस्थान
  rationale: यह संज्ञा सुरक्षा पाने के स्थान या आश्रय को दर्शाती है; ‘शरणस्थान’ भजन-साहित्य के लिए स्पष्ट और गरिमापूर्ण है।
- source_word: בֵּאלֹהִים
  choice: परमेश्वर में है
  rationale: בְּ यहाँ स्थिति या आधार का भाव देता है। इब्रानी में लुप्त योजक क्रिया को हिन्दी की स्वाभाविकता के लिए ‘है’ से व्यक्त किया गया है।
theological_decisions:
- issue: आरम्भिक पूर्वसर्गीय पदबंध और क्रियारहित वाक्यांशों का संबंध
  choice: उद्धार और गौरव को परमेश्वर पर टिका हुआ बताया गया है, जबकि अंतिम वाक्यांश में सामर्थ्य की चट्टान और शरणस्थान परमेश्वर में होने की बात बनी रहती है।
  alternative: 'अधिक शाब्दिक रूप: ‘परमेश्वर पर मेरा उद्धार और मेरा गौरव है।’'
  rationale: इब्रानी काव्य क्रियारहित है। ‘टिके हैं’ निर्भरता के रूपक को स्पष्ट करता है, पर उसे किसी विशिष्ट मतगत व्याख्या में नहीं बदलता। अंतिम בְּ को ‘परमेश्वर में’ रखकर मूल की स्थान/आधार-संबंधी अस्पष्टता सुरक्षित रखी गई है।
- issue: כְבוֹדִי का अर्थ
  choice: मेरा गौरव
  alternative: मेरा सम्मान
  rationale: दोनों अर्थ संभव हैं। ‘गौरव’ मूल शब्द की काव्यात्मक और धार्मिक व्यापकता बचाता है, जबकि पादटिप्पणी सम्मान, प्रतिष्ठा या निर्दोष सिद्ध किए जाने के संभावित भाव की ओर संकेत करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में काव्यात्मक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य शैली। ‘टिके हैं’ निर्भरता के रूपक को स्वाभाविक बनाता है; दूसरे अर्धांश की संक्षिप्त क्रियारहित इब्रानी संरचना को यथासंभव निकट रखते हुए ‘है’ जोड़ा गया है।
