source:
  edition: WLC
  text: אַ֤ךְ הֶ֥בֶל בְּנֵֽי אָדָם֮ כָּזָ֪ב בְּנֵ֫י אִ֥ישׁ בְּ/מֹאזְנַ֥יִם לַ/עֲל֑וֹת הֵ֝֗מָּה מֵ/הֶ֥בֶל יָֽחַד׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/062/009.yaml
  text: Surely the sons of man are a breath; the sons of men are a lie[a]. In the balances they go up; together they are lighter than a breath.
translation:
  language: hi
  text: निश्चय ही मानव की संतान बस एक साँस है; मनुष्य की संतान झूठ है।[a] तराजू पर वे ऊपर उठ जाते हैं; सब मिलकर एक साँस से भी हलके हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, व्याख्यात्मक रूप से, “मानव की संतान” को “निम्न पद के लोग” और “मनुष्य की संतान” को “उच्च पद के लोग” समझा जा सकता है। इब्रानी में अधिक शाब्दिक रूप से “मानव की संतान” और “मनुष्य की संतान” है।
    reason: alternative_reading
lexical_decisions:
- source_word: אַךְ
  choice: निश्चय ही
  rationale: यहाँ अव्यय कथन पर बल देता है; ‘निश्चय ही’ भजन की दृढ़ उद्घोषणा को स्वाभाविक हिन्दी में रखता है।
- source_word: הֶבֶל
  choice: एक साँस
  rationale: शब्द क्षणभंगुरता और सारहीनता का ठोस बिंब देता है। ‘साँस’ उसी बिंब को दोनों स्थानों पर बनाए रखता है।
- source_word: בְּנֵי אָדָם
  choice: आदम की संतान
  rationale: यह इब्रानी अभिव्यक्ति के ‘आदम’ घटक को सामने रखता और अगली समानांतर अभिव्यक्ति से उसका शब्दगत भेद बचाता है; हिन्दी में ‘संतान’ सामूहिक अर्थ देता है।
- source_word: כָּזָב
  choice: झूठ
  rationale: संज्ञा झूठ, मिथ्यात्व या अविश्वसनीयता बताती है। ‘झूठ’ संक्षिप्त और तीखा है तथा समानांतर पंक्ति की शक्ति बनाए रखता है।
- source_word: בְּנֵי אִישׁ
  choice: मनुष्य की संतान
  rationale: यह אִישׁ को सामान्य ‘मनुष्य’ के रूप में व्यक्त करते हुए בְּנֵי אָדָם से मूल का सूक्ष्म शब्दगत भेद बनाए रखता है। सामाजिक श्रेणियों का अर्थ मुख्य पाठ में नहीं जोड़ा गया।
- source_word: בְּמֹאזְנַיִם
  choice: तराजू पर
  rationale: यह आधुनिक हिन्दी में तौलने के उपकरण और उसके पलड़ों के बिंब को सहज रूप से व्यक्त करता है।
- source_word: לַעֲלוֹת
  choice: ऊपर उठ जाते हैं
  rationale: क्रिया का मूल अर्थ ‘ऊपर उठना’ है। तराजू के संदर्भ में यह उनके भारहीन निकलने का बिंब सुरक्षित रखता है।
- source_word: מֵהֶבֶל
  choice: एक साँस से भी हलके
  rationale: तुलनात्मक अर्थ को तराजू के बिंब के भीतर स्पष्ट करता है, बिना הֶבֶל के ‘साँस’ रूपक को खोए।
- source_word: יָחַד
  choice: सब मिलकर
  rationale: 'यह सामूहिक समग्रता व्यक्त करता है: दोनों समूह एक साथ इस आकलन के अधीन हैं।'
theological_decisions:
- issue: בְּנֵי אָדָם / בְּנֵי אִישׁ की युग्मित अभिव्यक्तियाँ
  choice: मुख्य पाठ में ‘आदम की संतान’ / ‘मनुष्य की संतान’ के रूप में मूल का शाब्दिक समानांतर और भेद बनाए रखा गया।
  alternative: ‘छोटे लोग’ / ‘बड़े लोग’ अथवा ‘नीच पदवाले’ / ‘ऊँचे पदवाले’
  rationale: सामाजिक स्तरों का विरोध एक संभव व्याख्या है, पर मूल शब्द सीधे तौर पर उन श्रेणियों को नहीं कहता। इसलिए अस्पष्टता को मुख्य पाठ में सुरक्षित रखकर वैकल्पिक व्याख्या पादटिप्पणी में दी गई है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और काव्यात्मक हिन्दी। ‘तराजू पर ऊपर उठना’ मूल तौल-बिंब को प्रत्यक्ष रखता है। ‘हलके’ की वर्तनी मानक हिन्दी के अनुसार रखी गई है।
