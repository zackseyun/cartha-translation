  yaml_path: translation/ot/psalms/062/005.yaml
  text: For God alone[a], be silent, my soul[c][b], for my hope is from him.
translation:
  language: hi
  text: केवल परमेश्वर के लिए शांत रह, हे मेरे प्राण[a][b]; क्योंकि मेरी आशा उससे है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “केवल परमेश्वर के लिए मेरा प्राण मौन होकर प्रतीक्षा करता है,” यदि क्रिया को आग्रह के बजाय कथन माना जाए।
    reason: alternative_reading
  - marker: b
    text: इब्रानी क्रिया का अर्थ चुप या स्थिर रहना और प्रसंगानुसार शांत होकर प्रतीक्षा करना भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: केवल
  rationale: 'यहाँ यह अव्यय विशिष्टता और बल प्रकट करता है: प्राण का भरोसा केवल परमेश्वर पर केंद्रित है।'
- source_word: לֵאלֹהִים
  choice: परमेश्वर के सामने
  rationale: ל उपसर्ग परमेश्वर की ओर उन्मुखता व्यक्त करता है। हिंदी में क्रिया ‘शांत रह’ के साथ ‘परमेश्वर के सामने’ स्वाभाविक है और लाभार्थक अर्थ की गलतफहमी से बचाता है।
- source_word: דּוֹמִּי
  choice: शांत रह
  rationale: मसोरेटिक स्वरांकन में यह स्त्रीलिंग एकवचन आज्ञार्थक रूप है, जो ‘मेरे प्राण’ को संबोधित करता है। मूल अर्थ चुप या स्थिर रहने का है; प्रतीक्षा का भाव संदर्भ से संभव है।
- source_word: נַפְשִׁי
  choice: हे मेरे प्राण
  rationale: भजन में स्वयं को संबोधित करने की इब्रानी शैली बनाए रखी गई है; ‘हे’ हिंदी में संबोधन स्पष्ट करता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह आत्मिक आग्रह का कारण प्रस्तुत करता है।
- source_word: מִמֶּנּוּ
  choice: उसी से
  rationale: सर्वनाम परमेश्वर की ओर लौटता है; ‘उसी’ पहले पदांश की विशिष्टता को स्वाभाविक हिंदी में प्रतिध्वनित करता है, बिना ‘केवल’ को दोहराए।
- source_word: תִּקְוָתִי
  choice: मेरी आशा
  rationale: תִּקְוָה का यहाँ सहज और संदर्भानुकूल अर्थ ‘आशा’ है।
theological_decisions:
- issue: דּוֹמִּי को कथन माना जाए या आत्म-संबोधित आग्रह
  choice: 'आग्रह: ‘शांत रह, हे मेरे प्राण’'
  alternative: 'कथन: ‘मेरा प्राण केवल परमेश्वर के लिए मौन होकर बाट जोहता है’'
  rationale: स्वरांकित रूप आज्ञार्थक पठन का समर्थन करता है। फिर भी व्यंजनात्मक पाठ और काव्यात्मक संदर्भ में कथनात्मक पठन संभव है, इसलिए उसे पादटिप्पणी में रखा गया है।
- issue: דמם में मौनता और प्रतीक्षा का संबंध
  choice: मुख्य पाठ में ‘शांत रह’
  alternative: ‘चुपचाप बाट जोह’
  rationale: मुख्य पाठ क्रिया के प्रत्यक्ष अर्थ को रखता है; प्रतीक्षा का विस्तृत भाव प्रसंग से निकलता है और पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिंदी। ‘मेरे प्राण’ भजन की आत्म-संबोधन शैली को बनाए रखता है; ‘परमेश्वर के सामने’ हिंदी में उन्मुखता को स्पष्ट और स्वाभाविक बनाता है।
