id: PSA.111.9
reference: Psalms 111:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: פְּד֤וּת שָׁ֘לַ֤ח לְ/עַמּ֗/וֹ צִוָּֽה לְ/עוֹלָ֥ם בְּרִית֑/וֹ קָד֖וֹשׁ וְ/נוֹרָ֣א שְׁמֽ/וֹ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/111/009.yaml
  text: He sent redemption to his people[a]; he has commanded his covenant forever[b]. Holy and awesome is his name.
translation:
  language: hi
  text: उसने अपनी प्रजा के लिए छुटकारा भेजा; उसने अपनी वाचा सदा के लिए ठहराई है। उसका नाम पवित्र और भययोग्य[a] है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात् ऐसा, जो श्रद्धापूर्ण भय और विस्मय उत्पन्न करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּדוּת
  choice: छुटकारा
  rationale: यह संज्ञा छुड़ाने, मुक्ति दिलाने या मूल्य देकर मुक्त करने का भाव रखती है। आधुनिक हिन्दी में ‘छुटकारा’ स्वाभाविक है और भजन के व्यापक उद्धारकारी अर्थ को बनाए रखता है।
- source_word: שָׁלַח
  choice: भेजा
  rationale: मूल क्रिया का सीधा अर्थ ‘भेजना’ है; ‘छुटकारा भेजा’ परमेश्वर द्वारा आरम्भ किए गए उद्धार की ठोस काव्यात्मक छवि सुरक्षित रखता है।
- source_word: לְעַמּוֹ
  choice: अपनी प्रजा के लिए
  rationale: לְ प्राप्तकर्ता अथवा हित—दोनों का संकेत दे सकता है। हिन्दी में ‘अपनी प्रजा के लिए’ स्वाभाविक है और छुटकारे के लाभार्थी को स्पष्ट करता है।
- source_word: צִוָּה
  choice: ठहराई है
  rationale: क्रिया का मूल अर्थ ‘आज्ञा देना’ है, पर वाचा के साथ इसका आशय अधिकारपूर्वक नियुक्त या स्थिर करना है। ‘वाचा की आज्ञा दी’ हिन्दी में अस्वाभाविक और अर्थतः भ्रमकारी होता; ‘ठहराई है’ उसके प्रामाणिक आदेशात्मक बल को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: לְעוֹלָם
  choice: सदा के लिए
  rationale: यह दीर्घ, असीम स्थायित्व बताता है; ‘सदा के लिए’ आधुनिक हिन्दी का स्पष्ट और स्वाभाविक समतुल्य है।
- source_word: בְּרִיתוֹ
  choice: अपनी वाचा
  rationale: ‘वाचा’ בְּרִית के बाइबिलीय संबंधपरक और प्रतिज्ञात्मक अर्थ को सुरक्षित रखने वाला स्थापित हिन्दी शब्द है।
- source_word: קָדוֹשׁ
  choice: पवित्र
  rationale: परमेश्वर के नाम के विषय में ‘पवित्र’ सटीक, स्थापित और सहज हिन्दी रूप है।
- source_word: וְנוֹרָא
  choice: भययोग्य
  rationale: यह शब्द श्रद्धापूर्ण भय और विस्मय उत्पन्न करने का भाव रखता है। ‘भययोग्य’ केवल आकर्षक आश्चर्य नहीं, बल्कि परमेश्वर के प्रति उचित श्रद्धामय भय भी बनाए रखता है।
- source_word: שְׁמוֹ
  choice: उसका नाम
  rationale: ‘नाम’ परमेश्वर के प्रकट चरित्र और प्रतिष्ठा को सूचित करता है; मूल रूपक को बिना व्याख्यात्मक विस्तार के रखा गया है।
theological_decisions:
- issue: צִוָּה का ‘वाचा’ के साथ अर्थ
  choice: उसने अपनी वाचा सदा के लिए ठहराई है
  alternative: उसने अपनी वाचा की आज्ञा सदा के लिए दी है
  rationale: मूल क्रिया के आदेशात्मक अधिकार को स्वीकार करते हुए हिन्दी में उसके प्रसंगगत परिणाम—वाचा को अधिकारपूर्वक स्थिर करना—को व्यक्त किया गया है। शाब्दिक विकल्प हिन्दी में यह भ्रम पैदा कर सकता है कि वाचा स्वयं कोई आज्ञा है।
- issue: परमेश्वर के नाम के लिए וְנוֹרָא का भाव
  choice: भययोग्य
  alternative: विस्मयकारी; भय उत्पन्न करने वाला
  rationale: ‘भययोग्य’ श्रद्धा, भय और विस्मय के संयुक्त भाव को संक्षेप में रखता है। पादटिप्पणी बताती है कि इसका आशय आतंक मात्र नहीं, बल्कि श्रद्धापूर्ण भय भी है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘प्रजा’ और ‘वाचा’ बाइबिलीय संदर्भ के उपयुक्त स्थापित शब्द हैं; वाक्य का समानांतर काव्यात्मक विन्यास सुरक्षित रखा गया है।
