source:
  edition: WLC
  text: הַ֥לְלוּ יָ֨הּ אוֹדֶ֣ה יְ֭הוָה בְּ/כָל לֵבָ֑ב בְּ/ס֖וֹד יְשָׁרִ֣ים וְ/עֵדָֽה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/111/001.yaml
  text: Praise Yah! I will give thanks to Yahweh with my whole heart[b][a], in the council of the upright and in the congregation.
translation:
  language: hi
  text: 'याह की स्तुति करो![a]


    मैं पूरे मन से याहवेह का धन्यवाद करूँगा,


    सज्जनों की अंतरंग सभा[b] और मंडली में।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में इसका अर्थ “याह की स्तुति करो” है; पारम्परिक रूप “हल्लेलूयाह” है। “याह” परमेश्वर के नाम का संक्षिप्त रूप है।
    reason: lexical_alternative
  - marker: b
    text: या “सज्जनों की गोष्ठी।” इब्रानी शब्द किसी अंतरंग मंडल, परामर्श-सभा या एकत्र सभा को दर्शा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַלְלוּ יָהּ
  choice: याह की स्तुति करो!
  rationale: बहुवचन आज्ञार्थक क्रिया और परमेश्वर के नाम के संक्षिप्त रूप को सीधे व्यक्त करता है; इससे आगे आए יְהוָה से मूल पाठ का भेद भी बना रहता है।
- source_word: אוֹדֶה
  choice: मैं ... धन्यवाद करूँगा
  rationale: हिफ़ील रूप यहाँ उपासना के प्रसंग में कृतज्ञतापूर्वक प्रशंसा करने और व्यक्तिगत संकल्प का भाव रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ में आए व्यक्तिगत ईश्वरीय नाम को हिन्दी में प्रचलित लिप्यंतरण द्वारा नाम के रूप में रखा गया है।
- source_word: בְּכָל לֵבָב
  choice: पूरे मन से
  rationale: यह सम्पूर्ण आंतरिक निष्ठा का स्वाभाविक और स्पष्ट आधुनिक हिन्दी प्रयोग है।
- source_word: בְּסוֹד
  choice: अंतरंग सभा
  rationale: סוֹד किसी निकटवर्ती मंडल, गोष्ठी या परामर्श-सभा को सूचित कर सकता है; 'अंतरंग सभा' अगले עֵדָה से भेद रखते हुए उस निकटता को व्यक्त करती है।
- source_word: יְשָׁרִים
  choice: सीधे लोगों
  rationale: यह नैतिक रूप से खरे और सत्यनिष्ठ लोगों के लिए प्रयुक्त विशेषण है; 'सीधे लोग' सामान्य हिन्दी में समझने योग्य है और मूल रूपक को रखता है।
- source_word: וְעֵדָה
  choice: और मण्डली में
  rationale: עֵדָה एक एकत्रित समुदाय को दर्शाता है; 'मण्डली' उपासना के संदर्भ में स्वाभाविक है और סוֹד से भिन्न शब्द रखता है।
theological_decisions:
- issue: एक ही पद में יָהּ और יְהוָה का अनुवाद
  choice: יָהּ को 'याह' और יְהוָה को 'यहोवा' रखा गया
  alternative: दोनों को 'प्रभु' कहना, अथवा पहले को 'हल्लेलूयाह' और दूसरे को 'प्रभु' कहना
  rationale: दोनों रूपों को अलग रखकर मूल पाठ में परमेश्वर के नाम के संक्षिप्त और पूर्ण रूप के बीच उपस्थित भेद सुरक्षित रहता है।
- issue: סוֹד और עֵדָה के संबंध की व्याख्या
  choice: दो समानांतर पर अलग पदों के रूप में 'अंतरंग सभा' और 'मण्डली'
  alternative: दोनों को एक ही सभा के पर्याय मानकर समान शब्द से अनुवाद करना
  rationale: मूल के दो भिन्न संज्ञा-पदों को बनाए रखने से यह अनिर्णीत रहता है कि वे दो समूह हैं या एक ही समुदाय के दो वर्णन।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल हिन्दी। काव्यात्मक पंक्ति-विभाजन रखा गया है। 'मण्डली' का परम्परागत किन्तु व्यापक रूप से बोधगम्य प्रयोग किया गया है; 'अंतरंग सभा' मूल के दुर्लभ סוֹד और सामान्य सामुदायिक עֵדָה के बीच अंतर बनाए रखता है।
