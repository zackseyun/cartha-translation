  yaml_path: translation/ot/psalms/111/006.yaml
  text: He has declared to his people the power of his works[a], in giving them the inheritance of the nations.
translation:
  language: hi
  text: उसने अपने लोगों को अपने कार्यों का सामर्थ्य प्रकट किया है—उन्हें राष्ट्रों की विरासत देकर।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसने अपने लोगों को अपने कार्यों का सामर्थ्य प्रकट किया है, ताकि उन्हें राष्ट्रों की विरासत दे।” इब्रानी इन्फिनिटिव उद्देश्य भी व्यक्त कर सकता है, न कि केवल साधन या परिणाम।
    reason: alternative_reading
lexical_decisions:
- source_word: כֹּחַ
  choice: सामर्थ्य
  rationale: यह शब्द शक्ति या सामर्थ्य को दर्शाता है; यहाँ परमेश्वर के कार्यों में प्रकट प्रभावी शक्ति के लिए ‘सामर्थ्य’ स्वाभाविक और गरिमापूर्ण है।
- source_word: מַעֲשָׂיו
  choice: अपने कार्यों
  rationale: מַעֲשֶׂה का अर्थ कार्य या कृत्य है। ‘कार्य’ मूल की व्यापकता और भजन के औपचारिक स्तुति-स्वर को बनाए रखता है।
- source_word: הִגִּיד
  choice: प्रकट किया है
  rationale: נגד के हिफ़ील रूप का अर्थ बताना, घोषित करना या ज्ञात कराना है। संदर्भ में परमेश्वर ने ऐतिहासिक कार्य द्वारा अपना सामर्थ्य दिखाया, इसलिए ‘प्रकट किया है’ उपयुक्त है।
- source_word: לְעַמּוֹ
  choice: अपने लोगों को
  rationale: 'לְ को यहाँ अप्रत्यक्ष कर्म के रूप में लिया गया है: उसने अपने लोगों को यह बात प्रकट की।'
- source_word: לָתֵת
  choice: देकर
  rationale: ל सहित infinitive उद्देश्य, परिणाम अथवा साधन व्यक्त कर सकता है। मुख्य पाठ में ‘देकर’ उस संभावित साधन/परिणाम अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לָהֶם
  choice: उन्हें
  rationale: यह ‘अपने लोगों’ की ओर लौटता है और हिन्दी में संदर्भ स्पष्ट रखता है।
- source_word: נַחֲלַת
  choice: विरासत
  rationale: נַחֲלָה विरासत, भाग में मिली संपत्ति या अधिकार में मिली भूमि को दर्शाता है। ‘विरासत’ वाचा और भूमि के संदर्भ को संक्षेप में बनाए रखती है।
- source_word: גּוֹיִם
  choice: राष्ट्रों की
  rationale: यहाँ גּוֹיִם उन अन्य राष्ट्रों को दर्शाता है जिनकी भूमि इस्राएल को मिली; ‘राष्ट्रों’ मूल के सामान्य अर्थ को बिना अनावश्यक संप्रदायगत रंग के रखता है।
theological_decisions:
- issue: अंतिम infinitive खंड לָתֵת לָהֶם נַחֲלַת גּוֹיִם का मुख्य वाक्य से संबंध
  choice: 'साधन/परिणाम: राष्ट्रों की विरासत देकर परमेश्वर ने अपने कार्यों का सामर्थ्य प्रकट किया'
  alternative: 'उद्देश्य: उसने अपने लोगों को अपने कार्यों का सामर्थ्य इसलिए प्रकट किया कि वह उन्हें राष्ट्रों की विरासत दे'
  rationale: לָתֵת में साधन, परिणाम और उद्देश्य की वास्तविक व्याकरणिक संभावना है। संदर्भ में भूमि देना परमेश्वर के सामर्थ्य का ऐतिहासिक प्रदर्शन जान पड़ता है, इसलिए मुख्य पाठ में ‘देकर’ रखा गया है; उद्देश्य वाला पाठ पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण काव्यात्मक गद्य। ‘सामर्थ्य’, ‘कार्य’ और ‘विरासत’ मूल शब्दावली के औपचारिक संबंधों को बनाए रखते हैं; डैश अंतिम खंड को मुख्य कथन के स्पष्टीकरण के रूप में सहजता से जोड़ता है।
