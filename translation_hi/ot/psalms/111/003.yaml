  yaml_path: translation/ot/psalms/111/003.yaml
  text: Splendor and majesty are his work[a], and his righteousness stands forever.
translation:
  language: hi
  text: 'वैभव और महिमा उसका कार्य है,

    और उसकी धार्मिकता[a] सदा बनी रहती है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा, “उसका न्याय सदा बना रहता है।”
    reason: צִדְקָתוֹ का अर्थ ‘धार्मिकता’ के साथ-साथ ‘न्याय’ भी हो सकता है।
lexical_decisions:
- source_word: הוֹד
  choice: वैभव
  rationale: यह शब्द गौरव, शोभा और भव्यता का भाव व्यक्त करता है। הָדָר के साथ काव्यात्मक युग्म में ‘वैभव’ दोनों निकटार्थी शब्दों का भेद बनाए रखता है।
- source_word: הָדָר
  choice: प्रताप
  rationale: यहाँ इसका अर्थ गरिमामय भव्यता या राजसी महिमा है। ‘प्रताप’ ऊँचे काव्यात्मक स्वर को बनाए रखते हुए ‘वैभव’ के साथ स्वाभाविक युग्म बनाता है।
- source_word: פָּעֳלוֹ
  choice: उसका कार्य
  rationale: एकवचन संज्ञा परमेश्वर के कार्य को सामूहिक अर्थ में प्रस्तुत करती है। ‘कार्य’ आधुनिक, गरिमापूर्ण और व्यापक है।
- source_word: צִדְקָתוֹ
  choice: उसकी धार्मिकता
  rationale: צְדָקָה नैतिक खराई और न्याय—दोनों अर्थ-क्षेत्रों को छू सकती है। इस व्यापक स्तुतिपरक संदर्भ में ‘धार्मिकता’ प्राथमिक अर्थ को व्यक्त करती है; ‘न्याय’ को पादटिप्पणी में रखा गया है।
- source_word: עֹמֶדֶת
  choice: बनी रहती है
  rationale: עמד का मूल चित्र ‘खड़े रहने’ का है, पर इस प्रसंग में निरंतर स्थिर रहने का भाव है। हिंदी में ‘बनी रहती है’ उसी स्थायित्व को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: לָעַד
  choice: सदा
  rationale: यह अनंत अथवा निरंतर स्थायित्व बताता है। ‘सदा’ संक्षिप्त, स्वाभाविक और काव्यात्मक हिंदी है।
theological_decisions:
- issue: परमेश्वर के स्थायी गुण के संदर्भ में צִדְקָתוֹ का अनुवाद
  choice: उसकी धार्मिकता
  alternative: उसका न्याय
  rationale: इब्रानी शब्द नैतिक धार्मिकता और न्यायपूर्ण आचरण दोनों को सूचित कर सकता है। यहाँ किसी विशिष्ट न्यायिक कार्य की अपेक्षा परमेश्वर के कार्य और स्थायी नैतिक खराई की व्यापक स्तुति है, इसलिए मुख्य पाठ में ‘धार्मिकता’ चुना गया है और वास्तविक वैकल्पिक अर्थ ‘न्याय’ पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी की, सहज और गरिमापूर्ण है। पहली पंक्ति में इब्रानी के दो भाववाचक शब्दों को ‘से भरा है’ के साथ रखा गया है, ताकि शाब्दिक आशय और स्वाभाविक हिंदी दोनों सुरक्षित रहें। काव्यात्मक समानांतरता बनाए रखने के लिए पद को दो पंक्तियों में प्रस्तुत किया गया है।
