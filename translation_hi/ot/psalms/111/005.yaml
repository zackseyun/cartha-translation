  text: He has given food to those who fear him[a]; he will remember his covenant forever.
translation:
  language: hi
  text: उसने जो उसका भय मानते हैं, उन्हें भोजन दिया है[a]; वह अपनी वाचा को सदा स्मरण रखेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘शिकार’; हिब्रू शब्द शिकार या शिकार से प्राप्त भोजन का अर्थ दे सकता है, पर यहाँ संभवतः सामान्य रूप से भोजन या जीविका का अर्थ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: טֶרֶף
  choice: आहार
  rationale: यह संज्ञा मूलतः शिकार या शिकार से मिले भोजन को भी दर्शा सकती है, पर इस प्रसंग में परमेश्वर द्वारा दिए गए भोजन का सामान्य अर्थ अधिक स्वाभाविक है। ‘आहार’ ठोस अर्थ बनाए रखता है; ‘प्रबंध’ अपेक्षाकृत व्यापक और व्याख्यात्मक होता।
- source_word: נָתַן
  choice: दिया है
  rationale: हिब्रू पूर्ण क्रिया संपन्न कार्य बताती है। हिंदी में ‘दिया है’ परमेश्वर के सिद्ध किए हुए उपकार को स्वाभाविक ढंग से व्यक्त करता है और अगली भविष्यकालीन पंक्ति के साथ सहज बैठता है।
- source_word: לִירֵאָיו
  choice: अपने डरवैयों को
  rationale: कृदंत उन लोगों को दर्शाता है जिनकी पहचान परमेश्वर का भय मानने से होती है। ‘डरवैये’ संक्षिप्त, बाइबलीय और यिरआ के भय तथा श्रद्धा—दोनों के गंभीर भाव को बनाए रखता है।
- source_word: יִזְכֹּר
  choice: स्मरण रखेगा
  rationale: अपूर्ण क्रिया को यहाँ भविष्यकालीन कथन माना गया है। ‘स्मरण रखेगा’ केवल मानसिक याद नहीं, बल्कि वाचा के अनुसार कार्य करने की बाइबलीय अभिव्यक्ति को अक्षुण्ण रखता है।
- source_word: לְעוֹלָם
  choice: सदा
  rationale: वाचा के इस प्रसंग में यह अनंत और निरंतर अवधि को स्वाभाविक, गरिमापूर्ण हिंदी में व्यक्त करता है।
- source_word: בְּרִיתוֹ
  choice: अपनी वाचा
  rationale: ‘वाचा’ בְּרִית का स्थापित बाइबलीय हिंदी पर्याय है और परमेश्वर की बाध्यकारी प्रतिज्ञा तथा संबंध को ‘समझौते’ से अधिक ठीक रूप में व्यक्त करता है।
theological_decisions:
- issue: वाचा के संदर्भ में परमेश्वर के ‘स्मरण’ का अर्थ
  choice: ‘वह अपनी वाचा को सदा स्मरण रखेगा’—अर्थात वाचा को केवल मन में याद करना नहीं, बल्कि उसके अनुसार विश्वसनीयता से कार्य करना
  alternative: ‘वह अपनी वाचा को सदा स्मरण रखता है’—कालातीत या सामान्य वर्तमान
  rationale: हिब्रू में परमेश्वर द्वारा वाचा को स्मरण करना प्रायः उसके अनुरूप कार्य करने को समाहित करता है। अनुवाद मूल रूपक को व्याख्यात्मक ‘निभाएगा’ में बदलने के बजाय ‘स्मरण रखेगा’ बनाए रखता है; भविष्यकाल יִזְכֹּר की संभावित अग्रदर्शी शक्ति भी सुरक्षित रहती है।
translation_notes:
  register: आधुनिक मानक हिंदी का संक्षिप्त, काव्यात्मक और गरिमापूर्ण रूप अपनाया गया है। ‘डरवैये’ सामान्य बोलचाल की तुलना में कुछ बाइबलीय है, पर मूल के ‘भय मानने वालों’ का संज्ञात्मक और धर्मवैचारिक भार संक्षेप में बनाए रखता है।
