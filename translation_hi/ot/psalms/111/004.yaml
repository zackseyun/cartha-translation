  yaml_path: translation/ot/psalms/111/004.yaml
  text: He has caused his wondrous works to be remembered[a]; Yahweh is gracious and compassionate.
translation:
  language: hi
  text: उसने अपने अद्भुत कामों को स्मरणीय बनाया है[a]; याहवे अनुग्रहकारी और करुणामय है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसने अपने अद्भुत कामों के लिए एक स्मारक बनाया है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: זֵכֶר
  choice: स्मरणीय
  rationale: זֵכֶר का अर्थ ‘स्मरण/स्मारक’ है। עָשָׂה और לְנִפְלְאוֹתָיו के साथ ‘स्मरणीय बनाया’ सहज हिन्दी में उसके कामों का स्थायी स्मरण स्थापित करने का भाव व्यक्त करता है।
- source_word: עָשָׂה
  choice: बनाया है
  rationale: मूल अर्थ ‘किया/बनाया’ है; ‘स्मरणीय बनाया है’ हिन्दी में इस इब्रानी पदबंध का प्रभावकारी अर्थ स्वाभाविक रूप से देता है।
- source_word: לְנִפְלְאוֹתָיו
  choice: अपने अद्भुत कामों को
  rationale: נִפְלָאוֹת परमेश्वर के असाधारण और आश्चर्यजनक कार्यों को दर्शाता है; ‘अद्भुत काम’ सामान्य पाठक के लिए ठोस और सहज है।
- source_word: חַנּוּן
  choice: अनुग्रहकारी
  rationale: यह विशेषण कृपा और अनुग्रह करने वाले स्वभाव को व्यक्त करता है तथा רַחוּם से अर्थगत भेद बनाए रखता है।
- source_word: וְרַחוּם
  choice: और करुणामय
  rationale: רַחוּם दया और गहरी करुणा का भाव रखता है; ‘करुणामय’ आधुनिक, गरिमापूर्ण और स्पष्ट है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: व्यक्तिगत ईश्वरीय नाम יהוה को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से प्रस्तुत किया गया है, न कि किसी उपाधि से।
theological_decisions:
- issue: יהוה ईश्वरीय नाम का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: पद में चतुरक्षरीय व्यक्तिगत नाम सीधे आया है। हिन्दी बाइबलीय प्रयोग में व्यापक रूप से पहचाने जाने वाले ‘यहोवा’ को चुना गया है; ‘याहवे’ एक सम्भव अधिक ध्वन्यात्मक लिप्यंतरण है।
- issue: पहले उपवाक्य का कर्ता
  choice: ‘उसने’ का संकेत यहोवा की ओर है
  alternative: 'अव्यक्त भाव: ‘उसके अद्भुत कामों का स्मारक बनाया गया है’'
  rationale: इब्रानी क्रिया पुल्लिंग एकवचन है और कर्ता बाद के उपवाक्य में יהוה के रूप में सामने आता है। हिन्दी में ‘उसने’ पद की काव्यात्मक कर्ता-निरंतरता बनाए रखता है।
- issue: זֵכֶר עָשָׂה की अर्थगत अस्पष्टता
  choice: अपने अद्भुत कामों को स्मरणीय बनाया है
  alternative: अपने अद्भुत कामों के लिए एक स्मारक बनाया है
  rationale: मुख्य पाठ में स्थायी स्मरण कराने का प्रभावकारी भाव स्वाभाविक हिन्दी में दिया गया है, जबकि ठोस ‘स्मारक’ वाला सम्भव अर्थ पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और काव्यात्मक रूप। ‘स्मरणीय बनाया’ सामान्य पाठक के लिए स्पष्ट है; पादटिप्पणी मूल पदबंध के ‘स्मारक’ अर्थ को सुरक्षित रखती है।
