id: PSA.111.10
reference: Psalms 111:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: רֵ֘אשִׁ֤ית חָכְמָ֨ה יִרְאַ֬ת יְהוָ֗ה שֵׂ֣כֶל ט֭וֹב לְ/כָל עֹשֵׂי/הֶ֑ם תְּ֝הִלָּת֗/וֹ עֹמֶ֥דֶת לָ/עַֽד׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/111/010.yaml
  text: The fear of Yahweh is the beginning of wisdom[a]; good understanding belongs to all who practice it[c][b]. His praise stands forever.
translation:
  language: hi
  text: 'याहवे का भय बुद्धि का आरम्भ है;

    जो उन पर अमल करते हैं, उन सभी को अच्छी समझ होती है।[a]

    उसकी स्तुति सदा बनी रहती है।[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी का शाब्दिक भाव है, “उन्हें करनेवाले सभी को अच्छी समझ होती है।” “उन्हें” का स्पष्ट पूर्वपद इस पद में नहीं दिया गया है; इसका संकेत याहवे के उन उपदेशों की ओर हो सकता है जिनका उल्लेख पिछले पदों में है, या याहवे के भय को व्यवहार में उतारने की ओर।
    reason: मूल के बहुवचन प्रत्यय और उसके अनकहे संदर्भ की वास्तविक अस्पष्टता स्पष्ट करना।
  - marker: b
    text: या, “उसकी स्तुति सदा स्थिर रहती है।”
    reason: עֹמֶדֶת के अधिक शाब्दिक ‘स्थिर रहती है/खड़ी रहती है’ अर्थ को दर्ज करना।
lexical_decisions:
- source_word: רֵאשִׁית חָכְמָה
  choice: बुद्धि का आरम्भ
  rationale: रֵאשִׁית यहाँ बुद्धि के आरम्भ या आधारभूत शुरुआती बिंदु को दर्शाता है। ‘आरम्भ’ परिचित और स्वाभाविक है तथा इसे केवल कालक्रम या केवल सर्वोच्च स्थान तक सीमित नहीं करता।
- source_word: יִרְאַת יְהוָה
  choice: याहवे का भय
  rationale: ‘भय’ इब्रानी अभिव्यक्ति में निहित श्रद्धा, विस्मय और वास्तविक भय के संयुक्त भाव को बनाए रखता है; इसे केवल ‘श्रद्धा’ कहना अर्थ को नरम कर देता। יְהוָה को व्यक्तिगत वाचा-नाम के रूप में ‘याहवे’ लिखा गया है।
- source_word: שֵׂכֶל טוֹב
  choice: अच्छी समझ
  rationale: שֵׂכֶל नैतिक और व्यावहारिक सूझ-बूझ सहित सही समझ को व्यक्त करता है। ‘अच्छी समझ’ सरल आधुनिक हिन्दी में इस व्यापक भाव को बनाए रखती है।
- source_word: לְכָל עֹשֵׂיהֶם
  choice: जो उन पर अमल करते हैं, उन सभी को
  rationale: इब्रानी में ‘उन्हें करनेवाले सभी को’ जैसा बहुवचन प्रत्यय है, पर उसका स्पष्ट संज्ञात्मक पूर्वपद इस पद में नहीं है। ‘उन पर अमल करते हैं’ बहुवचन और आज्ञापालन के व्यावहारिक भाव को बचाता है, जबकि पादटिप्पणी संदर्भगत अस्पष्टता बताती है।
- source_word: תְּהִלָּתוֹ עֹמֶדֶת לָעַד
  choice: उसकी स्तुति सदा बनी रहती है
  rationale: ‘उसकी’ का सबसे स्वाभाविक संदर्भ याहवे है। ‘बनी रहती है’ עֹמֶדֶת के स्थायित्व को सहज हिन्दी में व्यक्त करता है; ‘स्तुति’ प्रशंसा और प्रशंसनीय यश के बीच मूल की हल्की अर्थगत व्यापकता को रहने देती है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम सीधे आया है। ‘याहवे’ नाम को पदवी में बदले बिना प्रस्तुत करता है।
- issue: יִרְאַת को केवल श्रद्धा के रूप में नरम करना
  choice: भय
  alternative: श्रद्धा / श्रद्धापूर्ण भय
  rationale: ज्ञान-साहित्य का यह सूत्र श्रद्धा और विस्मय को समेटता है, पर वास्तविक ‘भय’ की धार भी रखता है। इसलिए मूल की धर्मवैचारिक गंभीरता बनाए रखने के लिए ‘भय’ चुना गया।
- issue: עֹשֵׂיהֶם के बहुवचन कर्म का संदर्भ
  choice: बहुवचन ‘उन पर’ बनाए रखा और अस्पष्टता पादटिप्पणी में बताई
  alternative: ‘उस पर अमल करते हैं’ कहकर इसे याहवे के भय से जोड़ना
  rationale: मूल का प्रत्यय बहुवचन है और उसका स्पष्ट पूर्वपद पद में नहीं है। उसे एकवचन करके केवल ‘भय’ से जोड़ना वास्तविक पाठगत अस्पष्टता को चुपचाप सुलझा देता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण काव्यात्मक गद्य रखा गया है। पंक्ति-विभाजन इब्रानी पद के तीन कथनों को स्पष्ट करता है। ‘अमल करना’ सामान्य पाठक के लिए स्वाभाविक है और आज्ञाओं को व्यवहार में लाने का भाव देता है।
