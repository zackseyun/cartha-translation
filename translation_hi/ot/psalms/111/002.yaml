  yaml_path: translation/ot/psalms/111/002.yaml
  text: Great are the works of the LORD, studied by all who delight in them.
translation:
  language: hi
  text: 'यहोवा के कार्य महान हैं;

    उनका अध्ययन वे सभी करते हैं जो उनमें आनंद लेते हैं।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גְּדֹלִים
  choice: महान
  rationale: यह बहुवचन विशेषण यहोवा के कार्यों की महत्ता और भव्यता व्यक्त करता है; हिंदी में ‘महान’ स्वाभाविक और गरिमापूर्ण है।
- source_word: מַעֲשֵׂי
  choice: काम
  rationale: यह शब्द किए गए कार्यों या कृत्यों को दर्शाता है। ‘काम’ सामान्य पाठक के लिए सहज है और संदर्भ में परमेश्वर के सामर्थ्यपूर्ण कार्यों को समेटता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ में आए विशिष्ट दिव्य नाम को सामान्य उपाधि में बदलने के बजाय हिंदी में प्रचलित लिप्यंतरण द्वारा सुरक्षित रखा गया है।
- source_word: דְּרוּשִׁים
  choice: अध्ययन करते हैं
  rationale: דרש का यह रूप खोजने, पूछताछ करने और ध्यानपूर्वक जाँचने का भाव रखता है। संदर्भ में ‘अध्ययन करते हैं’ उस सक्रिय और विचारशील खोज को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: חֶפְצֵיהֶם
  choice: उनसे प्रसन्न रहनेवाले
  rationale: חפץ प्रसन्नता, रुचि या आनंद रखने का भाव देता है। प्रत्यय का स्वाभाविक पूर्वपद निकटस्थ ‘काम’ हैं, इसलिए ‘उनसे’ बहुवचन रखा गया है।
theological_decisions:
- issue: दिव्य नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: विशिष्ट नाम और उपाधि के बीच मूल पाठ का भेद बनाए रखने के लिए ‘यहोवा’ चुना गया है; इससे किसी विशेष सांप्रदायिक व्याख्या का आयात नहीं होता।
- issue: דְּרוּשִׁים की अर्थ-सीमा
  choice: अध्ययन करते हैं
  alternative: खोजते हैं
  rationale: दोनों अर्थ संभव हैं, पर भजन में परमेश्वर के कामों पर मनन और जाँच का भाव प्रमुख है। ‘अध्ययन’ केवल पता लगाने की अपेक्षा इस अर्थ को अधिक स्पष्ट करता है।
translation_notes:
  register: आधुनिक मानक हिंदी, सरल किंतु गरिमापूर्ण काव्यात्मक शैली। समानांतर दो पंक्तियों में मूल पद की संरचना रखी गई है।
