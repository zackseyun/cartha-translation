  yaml_path: translation/ot/psalms/111/007.yaml
  text: The works of his hands are truth and justice[b][a]; all his precepts are trustworthy.
translation:
  language: hi
  text: 'उसके हाथों के काम सत्य और न्याय हैं[a];

    उसके सभी निर्देश भरोसेमंद हैं[b]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “निष्ठा और न्याय।”
    reason: lexical_alternative
  - marker: b
    text: या “उसकी सभी आज्ञाएँ विश्वसनीय हैं।”
    reason: lexical_alternative
lexical_decisions:
- source_word: מַעֲשֵׂי יָדָיו
  choice: उसके हाथों के काम
  rationale: इब्रानी की काव्यात्मक छवि और परमेश्वर की सक्रियता को सीधे बनाए रखता है।
- source_word: אֱמֶת
  choice: सत्य
  rationale: यह मूल शब्द के अर्थ-क्षेत्र तथा ‘न्याय’ के साथ उसके संज्ञात्मक समानांतर को सुरक्षित रखता है; ‘विश्वसनीयता’ संभव अर्थ है, इसलिए पादटिप्पणी में दिया गया है।
- source_word: וּמִשְׁפָּט
  choice: और न्याय
  rationale: यहाँ शब्द परमेश्वर के कामों के गुण को व्यक्त करता है; आधुनिक हिन्दी में ‘न्याय’ स्वाभाविक है और ‘निर्णय’ से अधिक उपयुक्त है।
- source_word: נֶאֱמָנִים
  choice: भरोसेमंद हैं
  rationale: बहुवचन विधेय परमेश्वर के उपदेशों की स्थिर विश्वसनीयता बताता है; ‘भरोसेमंद’ इसे सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: כָּל
  choice: सभी
  rationale: मूल के सार्वभौमिक अर्थ को बिना घटाए व्यक्त करता है।
- source_word: פִּקּוּדָיו
  choice: उसके उपदेश
  rationale: भजन-साहित्य में यह परमेश्वर के ठहराए हुए निर्देशों या आदेशों को सूचित करता है। ‘उपदेश’ सामान्य पाठक के लिए सुबोध है और नैतिक-आदेशात्मक बल बनाए रखता है।
theological_decisions:
- issue: परमेश्वर के कामों के विषय में אֱמֶת का अनुवाद ‘सत्य’ किया जाए या ‘विश्वसनीयता’
  choice: सत्य
  alternative: विश्वसनीयता
  rationale: ‘सत्य’ मूल की संज्ञात्मक बनावट और ‘न्याय’ के साथ काव्यात्मक संतुलन बनाए रखता है, जबकि अगली पंक्ति נֶאֱמָנִים द्वारा भरोसेमंद होने का भाव स्पष्ट करती है।
- issue: פִּקּוּדָיו के लिए विशिष्ट विधिक शब्द या अधिक सहज सामान्य शब्द
  choice: उसके उपदेश
  alternative: उसके निर्देश / उसकी आज्ञाएँ
  rationale: ‘उपदेश’ आधुनिक हिन्दी में स्वाभाविक रहते हुए परमेश्वर के प्रामाणिक निर्देशों का भाव देता है; विकल्प पादटिप्पणी में संरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और काव्यात्मक रूप; दो समानांतर पंक्तियों में इब्रानी पद्य-संरचना और ‘हाथों’ की मूर्त छवि सुरक्षित रखी गई है।
