  to: 'उसके हाथों के काम सत्य और न्याय हैं[a];

    उसके सभी निर्देश भरोसेमंद हैं[b]।'
  rationale: The revision preserves the Hebrew poetic structure, the concrete ‘hands’ image, and the distinction between אמת (‘सत्य’; alternatively ‘निष्ठा’) and נֶאֱמָנִים (‘भरोसेमंद’). It also strengthens the rendering of פִּקּוּדָיו from general teachings to authoritative directions/precepts.
