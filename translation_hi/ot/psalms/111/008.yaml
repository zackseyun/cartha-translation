lexical_decisions:
- source_word: סְמוּכִים
  choice: अटल हैं
  rationale: सמך का कर्मवाच्य कृदन्त सहारा दिए जाने या दृढ़ किए जाने का भाव रखता है। आज की स्वाभाविक हिन्दी में ‘अटल हैं’ परमेश्वर की आज्ञाओं की स्थायी दृढ़ता व्यक्त करता है।
- source_word: לָעַד לְעוֹלָם
  choice: सदा-सर्वदा
  rationale: दोनों कालवाचक पद मिलकर स्थायित्व पर बल देते हैं; ‘सदा-सर्वदा’ इस पुनरुक्त बल को सहज हिन्दी में बनाए रखता है।
- source_word: עֲשׂוּיִם
  choice: बनाए गए हैं
  rationale: עשה के कर्मवाच्य कृदन्त को औपचारिक रूप से रखते हुए यह बताता है कि वे इस प्रकार रचे या स्थापित किए गए हैं।
- source_word: בֶּאֱמֶת
  choice: सच्चाई से
  rationale: אֱמֶת सत्य, विश्वसनीयता और विश्वासयोग्यता का अर्थ दे सकता है। ‘सच्चाई’ मूल अर्थ को सामने रखती है, जबकि वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: וְיָשָׁר
  choice: और खराई से
  rationale: יָשָׁר का अर्थ सीधा, सही या खरा है। यहाँ בֶּאֱמֶת के साथ समांतर रीति-सूचक अर्थ में ‘खराई से’ स्वाभाविक और नैतिक सीधाई का द्योतक है।
