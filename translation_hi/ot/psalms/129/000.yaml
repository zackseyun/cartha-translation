  text: 'A Song of Ascents: “Greatly they have afflicted me from my youth”—let Israel now say—[a]'
translation:
  language: hi
  text: 'चढ़ाइयों का गीत:


    “मेरी युवावस्था से ही उन्होंने मुझे बहुत सताया है”—अब इस्राएल कहे—[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरी युवावस्था से ही उन्होंने मुझे बार-बार सताया है।” इब्रानी शब्द רַבַּת ‘बहुत’ के साथ-साथ ‘बार-बार’ का अर्थ भी दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: चढ़ाई का गीत
  rationale: यह पदावली तीर्थयात्रा अथवा ऊपर चढ़ने से जुड़े गीत का शीर्षक है। संक्षिप्त पारंपरिक रूप मूल की संरचना बनाए रखता है और अर्थ को किसी एक ऐतिहासिक परिस्थिति तक सीमित नहीं करता।
- source_word: רַבַּת
  choice: बहुत
  rationale: यह क्रियाविशेषण पीड़ा की बड़ी मात्रा या तीव्रता व्यक्त कर सकता है। बार-बार होने का अर्थ भी संभव है, इसलिए उसे पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: צְרָרוּנִי
  choice: उन्होंने मुझे सताया है
  rationale: צרר यहाँ शत्रुतापूर्ण ढंग से दबाने, कष्ट देने या सताने का भाव रखता है। 'सताया' आधुनिक हिन्दी में स्वाभाविक है और विरोधी उत्पीड़न की व्यापकता बनाए रखता है।
- source_word: מִנְּעוּרַי
  choice: मेरी युवावस्था से ही
  rationale: מִן आरंभ-बिंदु दर्शाता है और प्रत्यय प्रथम पुरुष एकवचन है। 'से ही' लंबे समय से चले आ रहे अनुभव पर स्वाभाविक हिन्दी बल देता है।
- source_word: יֹאמַר־נָא יִשְׂרָאֵל
  choice: अब इस्राएल कहे
  rationale: נא यहाँ आग्रहपूर्ण आह्वान है; प्रसंग में 'अब' इसे सहज हिन्दी में व्यक्त करता है। एकवचन 'कहे' सामूहिक इस्राएल को संबोधित मूल रूप बनाए रखता है।
theological_decisions:
- issue: वक्ता के एकवचन 'मुझे' और सामूहिक इस्राएल का संबंध
  choice: एकवचन 'मुझे' को बनाए रखते हुए इस्राएल को यही कथन कहने का आह्वान
  alternative: इसे सीधे बहुवचन 'हमें' में बदलना
  rationale: मूल पाठ पहले व्यक्ति एकवचन प्रत्यय का प्रयोग करता है और फिर इस्राएल को बोलने बुलाता है। इसे सामूहिक व्यक्तित्व माना जा सकता है, पर अनुवाद उस व्याख्या को स्पष्ट करके मूल तनाव समाप्त नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सामूहिक पाठ के योग्य शैली अपनाई गई है। शीर्षक और मुख्य कथन अलग पंक्तियों में हैं; उद्धरण-चिह्न तथा दीर्घ डैश मूल के आह्वानात्मक वाक्य-विन्यास को स्पष्ट करते हैं।
