  yaml_path: translation/ot/psalms/129/008.yaml
  text: and those who pass by do not say[a], “The blessing of Yahweh be upon you; we bless you in the name of Yahweh.”
translation:
  language: hi
  text: 'और राहगीर यह नहीं कहते:


    “याहवेह की आशीष तुम पर हो;

    हम याहवेह के नाम से तुम्हें आशीष देते हैं।”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלֹא אָמְרוּ
  choice: और ... यह न कहें
  rationale: 'निषेध पिछले पद के अभिशाप-सदृश कथन को आगे बढ़ाता है। प्रसंग में हिब्रू क़ातल को इच्छासूचक भाव में समझना स्वाभाविक है: राहगीर ऐसा आशीर्वाद न दें।'
- source_word: הָעֹבְרִים
  choice: आने-जानेवाले
  rationale: संज्ञीकृत कृदंत राह से गुजरने वाले लोगों के सामान्य वर्ग को दर्शाता है; यह हिंदी में सहज और स्पष्ट है।
- source_word: בִּרְכַּת יְהוָה אֲלֵיכֶם
  choice: याहवेह की आशीष तुम पर हो
  rationale: संबंधवाचक रचना और क्रियारहित आशीर्वाद-वाक्य का स्वाभाविक हिंदी रूप; ‘हो’ मूल में निहित इच्छासूचक भाव व्यक्त करता है।
- source_word: בֵּרַכְנוּ אֶתְכֶם
  choice: हम ... तुम्हें आशीष देते हैं
  rationale: यह प्रचलित आशीर्वचन में निष्पादक कथन है; वर्तमान काल हिंदी में उसके बोले जाते ही किए जाने वाले कार्य को स्पष्ट करता है।
- source_word: בְּשֵׁם יְהוָה
  choice: याहवेह के नाम से
  rationale: यह उस नाम के आह्वान और अधिकार के अंतर्गत आशीष देने का अर्थ स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवेह
  rationale: टेट्राग्राम को उपाधि से बदलने के बजाय परमेश्वर के व्यक्तिगत नाम के रूप में लिप्यंतरित किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवेह
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम है। ‘याहवेह’ उसका व्यापक रूप से स्वीकृत विद्वत्तापूर्ण लिप्यंतरण है और नाम को उपाधि में नहीं बदलता।
- issue: आरंभिक निषेध का भाव
  choice: 'इच्छासूचक: ‘न कहें’'
  alternative: 'वर्णनात्मक: ‘नहीं कहते’'
  rationale: पद 7–8 में समानांतर अभिशाप/कामना की काव्यात्मक धारा के कारण इसे इच्छासूचक रूप में लिया गया है, यद्यपि हिब्रू रूप अकेले वर्णनात्मक अर्थ भी ग्रहण कर सकता है।
translation_notes:
  register: आधुनिक मानक हिंदी, काव्यात्मक किंतु सामान्य पाठक के लिए सहज। संबोधन में मूल के बहुवचन को स्वाभाविक सामूहिक ‘तुम’ से व्यक्त किया गया है। ‘याहवेह’ की वर्तनी उच्चारण को स्पष्ट रखती है।
