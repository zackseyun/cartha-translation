translation:
  language: hi
  text: 'जिससे फसल काटने वाला अपना हाथ नहीं भरता,

    और न पूलों को बटोरने वाला अपनी गोद भरता है[a]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अपनी छाती’ अथवा ‘अपने वस्त्र की तह’। यहाँ कटे हुए डंठल रखने की जगह अभिप्रेत है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שֶׁלֹּא
  choice: जिससे ... नहीं
  rationale: यह सापेक्ष पद पिछले पद के छत पर उगने वाले घास से जुड़ता है; ‘जिससे’ इस संबंध को स्वाभाविक हिन्दी में स्पष्ट रखता है।
- source_word: מִלֵּא
  choice: नहीं भरता
  rationale: इब्रानी पूर्ण रूप यहाँ उस घास की सामान्य और निश्चित निष्फलता बताता है। हिन्दी में सामान्य वर्तमान इस चरित्रगत परिणाम को सहजता से व्यक्त करता है।
- source_word: כַפּוֹ
  choice: अपनी मुट्ठी
  rationale: כַּף मूलतः हथेली/हाथ है; कटे हुए डंठल पकड़ने के प्रसंग में ‘मुट्ठी भरना’ ठोस और स्वाभाविक हिन्दी चित्र प्रस्तुत करता है।
- source_word: קוֹצֵר
  choice: काटने वाला
  rationale: यह फसल काटने वाले व्यक्ति के लिए प्रयुक्त संज्ञात्मक कृदन्त है। ‘काटने वाला’ सामान्य पाठक के लिए स्पष्ट है और कृषि-संदर्भ बनाए रखता है।
- source_word: וְחִצְנוֹ
  choice: अपनी गोद
  rationale: חֵצֶן छाती से लगी गोद या वस्त्र की उस तह को सूचित कर सकता है जिसमें डंठल रखे जाते हैं। ‘गोद’ मूल शारीरिक चित्र और उसकी अस्पष्टता को ‘बाँहों’ की अपेक्षा अधिक निकटता से रखता है; अन्य अर्थ पादटिप्पणी में दिए गए हैं।
- source_word: מְעַמֵּר
  choice: पूले बटोरने वाला
  rationale: यह कृदन्त कटे हुए डंठलों को एकत्र कर पूले बनाने या बटोरने वाले को दर्शाता है। यह चयन कृषि-क्रिया को स्पष्ट करते हुए समानांतर पंक्ति को संक्षिप्त रखता है।
