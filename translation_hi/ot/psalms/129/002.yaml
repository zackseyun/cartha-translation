  text: רַ֭בַּת צְרָר֣וּ/נִי מִ/נְּעוּרָ֑/י גַּ֝ם לֹא יָ֥כְלוּ לִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/129/002.yaml
  text: Greatly they have afflicted me from my youth[b][a], yet they have not prevailed against me.
translation:
  language: hi
  text: जवानी से ही उन्होंने मुझे बहुत सताया है[a], फिर भी वे मुझ पर प्रबल नहीं हो सके[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जवानी से ही उन्होंने मुझे बार-बार सताया है।” इब्रानी आरंभिक शब्द सताए जाने की तीव्रता (“बहुत”) या उसकी बारंबारता (“बार-बार”) पर बल दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “फिर भी वे मुझे पराजित नहीं कर सके।”
    reason: lexical_alternative
lexical_decisions:
- source_word: רַבַּת
  choice: बहुत
  rationale: क्रियाविशेषण के रूप में यह सताए जाने की मात्रा या तीव्रता पर बल देता है। हिंदी में ‘बहुत’ सहज और काव्यात्मक है; ‘बार-बार’ भी संभव है, इसलिए उसे पादटिप्पणी में रखा गया है।
- source_word: צְרָרוּנִי
  choice: उन्होंने मुझे सताया है
  rationale: צרר में शत्रुता रखते हुए तंग करने, दबाने या पीड़ित करने का भाव है। ‘सताया’ निरंतर शत्रुतापूर्ण व्यवहार को स्वाभाविक हिंदी में व्यक्त करता है और अर्थ को केवल सैन्य आक्रमण तक सीमित नहीं करता।
- source_word: מִנְּעוּרָי
  choice: जवानी से ही
  rationale: यह जीवन की युवावस्था से आरंभ होकर आगे तक चलने वाली अवधि बताता है। ‘जवानी से ही’ सामान्य आधुनिक हिंदी में स्वाभाविक है।
- source_word: גַּם
  choice: फिर भी
  rationale: 'इस प्रसंग में גַּם साधारण ‘भी’ के बजाय विरोध या रियायत का भाव देता है: सताए जाने के बावजूद शत्रु सफल नहीं हुए।'
- source_word: לֹא יָכְלוּ לִי
  choice: वे मुझ पर प्रबल नहीं हो सके
  rationale: יכל के साथ ל किसी के विरुद्ध सफल या उस पर हावी न हो सकने का अर्थ देता है। यह अनुवाद विफल प्रभुत्व का भाव बनाए रखता है।
