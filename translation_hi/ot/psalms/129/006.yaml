  yaml_path: translation/ot/psalms/129/006.yaml
  text: May they be like grass on the rooftops[a], which withers before it grows up.
translation:
  language: hi
  text: 'वे छतों की घास के समान हो जाएँ,[a]

    जो उखाड़ी जाने से पहले ही सूख जाती है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो बढ़ने से पहले ही सूख जाती है।”
    reason: शब्द שָׁלַף का अर्थ और इस पद में उसका आशय विवादित है; मुख्य पाठ ‘उखाड़ना/खींचना’ वाले सामान्य अर्थ को रखता है, जबकि टिप्पणी प्राचीन वैकल्पिक व्याख्या को सुरक्षित रखती है।
lexical_decisions:
- source_word: יִהְיוּ
  choice: हो जाएँ
  rationale: संदर्भ में रूप कामना अथवा अभिशाप व्यक्त करता है; ‘हो जाएँ’ आधुनिक हिन्दी में इस भाव को स्वाभाविक रूप से रखता है।
- source_word: כַּחֲצִיר
  choice: घास के समान
  rationale: חָצִיר यहाँ घास अथवा वनस्पति को दर्शाता है; ‘घास’ सरल और चित्रात्मक हिन्दी है।
- source_word: גַּגּוֹת
  choice: छतों पर उगने वाली
  rationale: बहुवचन संज्ञा समतल घरों की छतों की ओर संकेत करती है, जहाँ थोड़ी मिट्टी में घास उग सकती थी। हिन्दी में संबंध स्पष्ट करने के लिए ‘उगने वाली’ जोड़ा गया है।
- source_word: שֶׁקַּדְמַת
  choice: से पहले ही
  rationale: यह अगली क्रिया से पहले सूख जाने का कालगत संबंध व्यक्त करता है; ‘ही’ अकाल सूखने पर काव्यात्मक बल देता है।
- source_word: שָׁלַף
  choice: उखाड़े जाने
  rationale: שׁלף का मूल अर्थ खींचना अथवा बाहर निकालना है। घास के संदर्भ में ‘उखाड़ना’ उपयुक्त है; इसे ‘बढ़ना’ मानना स्रोत-क्रिया का सामान्य अर्थ नहीं है।
- source_word: יָבֵשׁ
  choice: सूख जाती है
  rationale: वनस्पति के लिए יבש का सीधा और स्वाभाविक हिन्दी अर्थ ‘सूख जाना’ है।
