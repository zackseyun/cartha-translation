  yaml_path: translation/ot/psalms/129/003.yaml
  text: Plowmen have plowed on my back[a]; they have made their furrows long.
translation:
  language: hi
  text: 'हल चलाने वालों ने मेरी पीठ पर हल चलाया;

    उन्होंने उनके हल की लकीरें लंबी कर दीं।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘हल की लकीरें’ के लिए ‘कूड़’ भी कहा जा सकता है। इब्रानी में कठोर उत्पीड़न या घावों की छवि के लिए जुताई का रूपक बना रहता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל גַּבִּי
  choice: मेरी पीठ पर
  rationale: स्थानसूचक संबंध और पीठ की सजीव छवि को सीधे बनाए रखता है।
- source_word: חָרְשׁוּ חֹרְשִׁים
  choice: हल चलानेवालों ने ... हल चलाया
  rationale: क्रिया और कर्ता की पुनरुक्ति मूल इब्रानी की काव्यात्मक तीव्रता तथा कृषि-रूपक को सुरक्षित रखती है।
- source_word: הֶאֱרִיכוּ
  choice: लंबी कर दीं
  rationale: हिफ़ील रूप का अर्थ किसी वस्तु को लंबा करना है; यह आधुनिक हिन्दी में सहज है।
- source_word: לְמַעֲנוֹתָם
  choice: अपने हल की लकीरें
  rationale: यह दुर्लभ संज्ञा जुताई से बनी कूड़ों या लकीरों को दर्शाती है। ‘हल की लकीरें’ सामान्य पाठक के लिए स्पष्ट रहते हुए कृषि-चित्र बनाए रखता है।
theological_decisions:
- issue: इस्राएल के घोर दुःख और उत्पीड़न का रूपक
  choice: पीठ पर हल चलाने और लंबी लकीरें बनाने की कृषि-संबंधी छवि को मुख्य पाठ में ज्यों का त्यों रखा गया है।
  alternative: उन्होंने मेरी पीठ पर लंबे घाव कर दिए।
  rationale: मूल पाठ उत्पीड़न या कोड़े खाने का अर्थ सीधे नहीं खोलता, बल्कि तीखा कृषि-रूपक प्रस्तुत करता है; व्याख्यात्मक अर्थ को मुख्य पाठ में रखने से मूल की काव्यात्मक अस्पष्टता मिट जाती।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सहज रखी गई है। ‘कूड़ें’ की अपेक्षा मुख्य पाठ में अधिक समझ में आने वाला ‘हल की लकीरें’ रखा गया है; शाब्दिक विकल्प पादटिप्पणी में दिया गया है।
