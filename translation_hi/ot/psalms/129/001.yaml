  text: A Song of Ascents[a]. Greatly they have afflicted me from my youth—let Israel now say—
translation:
  language: hi
  text: 'आरोहणों का गीत।[a]


    उन्होंने मेरी युवावस्था से मुझे बहुत सताया है—अब इस्राएल कहे—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उन्होंने मेरी युवावस्था से मुझे बहुत बार सताया है।” इब्रानी רַבַּת बारंबारता के साथ-साथ बहुत अधिक तीव्रता या व्यापकता भी व्यक्त कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: आरोहणों का गीत
  rationale: परंपरागत शीर्षक-सूत्र में מַעֲלוֹת के बहुवचन और उसके मूल ‘ऊपर चढ़ने/आरोहण’ के भाव को बनाए रखता है; ‘तीर्थयात्रियों का गीत’ अधिक व्याख्यात्मक होता।
- source_word: רַבַּת
  choice: बहुत
  rationale: क्रियाविशेषण रूप में तीव्रता या विस्तार व्यक्त करता है। ‘बहुत बार’ भी संभव है, इसलिए उसे पाद-टिप्पणी में रखा गया है।
- source_word: צְרָרוּנִי
  choice: उन्होंने ... मुझे ... सताया है
  rationale: यह शत्रुतापूर्ण पीड़ा और दुर्व्यवहार का व्यापक भाव स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है, बिना अर्थ को केवल राजनीतिक उत्पीड़न तक सीमित किए।
- source_word: מִנְּעוּרַי
  choice: मेरी युवावस्था से
  rationale: समय के आरंभ-बिंदु को व्यक्त करने वाले मूल पूर्वसर्गीय पदबंध का सीधा और स्वाभाविक रूप।
- source_word: יֹאמַר נָא
  choice: अब ... कहे
  rationale: आग्रहात्मक आह्वान में נָא की प्रवचनगत शक्ति को ‘अब’ व्यक्त करता है; ‘कृपया’ यहाँ भ्रामक विनम्र निवेदन बन जाता।
- source_word: יִשְׂרָאֵל
  choice: इस्राएल
  rationale: मानक हिन्दी बाइबलीय रूप; यहाँ पूरी वाचा-समुदाय को यह स्वीकारोक्ति दोहराने के लिए बुलाया गया है।
theological_decisions:
- issue: सामूहिक वक्ता और उपासना-संबंधी रूपरेखा
  choice: पहले पुरुष एकवचन की शिकायत को यथावत रखते हुए इस्राएल को उसे कहने का आह्वान दिया गया है।
  alternative: इसे केवल किसी व्यक्ति की शिकायत मानना, जिसे बाद में इस्राएल पर लागू किया गया हो।
  rationale: ‘अब इस्राएल कहे’ से सामूहिक पहचान स्पष्ट होती है, पर ‘मुझे’ व्यक्तिगत और सामूहिक स्वर के बीच वास्तविक तनाव को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामूहिक उपासना में पठनीय रखी गई है। शीर्षक में अपेक्षाकृत औपचारिक ‘आरोहणों’ मूल रूपक को सुरक्षित रखता है; मुख्य पंक्ति में सहज ‘बहुत सताया है’ चुना गया है।
