  yaml_path: translation/ot/psalms/129/004.yaml
  text: Yahweh is righteous[a]; he has cut the cords of the wicked.
translation:
  language: hi
  text: याहवे धर्मी है; उसने दुष्टों की रस्सियाँ काट दी हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम को किसी उपाधि से बदलने के बजाय उसका प्रचलित हिन्दी लिप्यंतरण रखा गया है।
- source_word: צַדִּיק
  choice: धर्मी
  rationale: यह विशेषण यहाँ याहवे के नैतिक और न्यायपूर्ण चरित्र को व्यक्त करता है; ‘धर्मी’ संक्षिप्त, स्वाभाविक और अर्थ-संगत है।
- source_word: קִצֵּץ
  choice: काट डाली हैं
  rationale: क्रिया निर्णायक रूप से काटने या अलग कर देने का भाव देती है; हिन्दी में ‘काट डाली हैं’ पूर्ण और प्रभावी छुटकारे के भाव को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: עֲבוֹת
  choice: रस्सियाँ
  rationale: यह बहुवचन संज्ञा बाँधने वाली रस्सियों, संभवतः मोटी रस्सियों, को सूचित करती है; मुख्य पाठ में ‘रस्सियाँ’ स्पष्ट और सहज है।
- source_word: רְשָׁעִים
  choice: दुष्टों
  rationale: मूल में विशेषण संज्ञा के रूप में प्रयुक्त है और दुष्ट लोगों को सामूहिक रूप से दर्शाता है; ‘दुष्टों’ बिना अनावश्यक लैंगिक जोड़ के अर्थ रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार-अक्षरी व्यक्तिगत नाम सीधे आया है। ‘याहवे’ उस नाम को उपाधि से प्रतिस्थापित किए बिना सुरक्षित रखता है।
