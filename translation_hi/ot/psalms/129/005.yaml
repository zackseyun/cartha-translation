  text: יֵ֭בֹשׁוּ וְ/יִסֹּ֣גוּ אָח֑וֹר כֹּ֝֗ל שֹׂנְאֵ֥י צִיּֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/129/005.yaml
  text: May all who hate Zion be put to shame and turned backward[a].
translation:
  language: hi
  text: सिय्योन से घृणा करनेवाले सभी लज्जित हों और पीछे हट जाएँ।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सिय्योन से घृणा करनेवाले सभी लज्जित होंगे और पीछे हट जाएँगे।” इब्रानी क्रियारूपों को इच्छा-प्रार्थना के बजाय भविष्य के कथन के रूप में भी समझा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: יֵבֹשׁוּ
  choice: लज्जित हों
  rationale: בוש लज्जा और अपमानित होने का भाव व्यक्त करता है। यहाँ इच्छासूचक/प्रार्थनात्मक बल को ‘लज्जित हों’ स्वाभाविक और संक्षिप्त रूप में व्यक्त करता है।
- source_word: וְיִסֹּגוּ
  choice: और पीछे हट जाएँ
  rationale: סוג का अर्थ पीछे हटना या लौट जाना है। ‘पीछे हट जाएँ’ विरोधियों के संदर्भ में स्वाभाविक है और किसी अनिर्दिष्ट कर्ता द्वारा उन्हें हटाए जाने का अर्थ अनावश्यक रूप से नहीं जोड़ता।
- source_word: אָחוֹר
  choice: पीछे
  rationale: यह दिशा-सूचक क्रियाविशेषण है; ‘पीछे हट जाएँ’ आधुनिक हिन्दी का सहज प्रयोग है।
- source_word: כֹּל
  choice: सभी
  rationale: समूचे समूह को सूचित करनेवाले इस परिमाणवाचक शब्द का सीधा और स्वाभाविक अनुवाद।
- source_word: שֹׂנְאֵי
  choice: से घृणा करनेवाले
  rationale: संज्ञार्थक कृदन्त ‘घृणा करनेवाले’ निरंतर पहचान/रवैये को बनाए रखता है और हिन्दी में स्वाभाविक है।
- source_word: צִיּוֹן
  choice: सिय्योन
  rationale: हिन्दी बाइबलीय परंपरा में प्रचलित नाम-रूप, जो मूल स्थाननाम को लिप्यंतरित करता है।
theological_decisions:
- issue: आरंभिक yiqtol क्रियाओं का इच्छासूचक/शाप-प्रार्थनात्मक बल
  choice: 'इच्छा-प्रार्थना के रूप में: ‘...लज्जित हों और पीछे हट जाएँ।’'
  alternative: 'भविष्य-कथन के रूप में: ‘...लज्जित होंगे और पीछे हट जाएँगे।’'
  rationale: काव्यात्मक संदर्भ में ये रूप इच्छासूचक या प्रार्थनात्मक समझे जा सकते हैं; मुख्य पाठ में इसे रखा गया है, जबकि इब्रानी की वास्तविक भविष्यवाचक संभावना पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सामान्य पाठकों के लिए स्पष्ट रूप। ‘पीछे हट जाएँ’ ने मूल क्रिया और दिशा-सूचक अव्यय दोनों को स्वाभाविक हिन्दी में समेटा है; मुख्य पाठ और पादटिप्पणी के बीच विधि/काल की अस्पष्टता सुरक्षित रखी गई है।
