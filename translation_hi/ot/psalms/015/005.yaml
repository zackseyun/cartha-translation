source:
  edition: WLC
  text: כַּסְפּ֤/וֹ לֹא נָתַ֣ן בְּ/נֶשֶׁךְ֮ וְ/שֹׁ֥חַד עַל נָקִ֗י לֹ֥א לָ֫קָ֥ח עֹֽשֵׂה אֵ֑לֶּה לֹ֖א יִמּ֣וֹט לְ/עוֹלָֽם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/015/005.yaml
  text: He does not lend his money at interest[a], and does not take a bribe against the innocent[b]. The one who does these things will never be shaken.
translation:
  language: hi
  text: जो अपना धन ब्याज पर नहीं देता[a] और निर्दोष के विरुद्ध रिश्वत नहीं लेता, वह कभी नहीं डगमगाएगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘सूद पर’; इब्रानी शब्द ऋण पर लिए जाने वाले ब्याज को दर्शा सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘सदा के लिए नहीं डगमगाएगा।’
    reason: literal_rendering
lexical_decisions:
- source_word: כַּסְפּוֹ
  choice: अपना धन
  rationale: כֶּסֶף का शाब्दिक अर्थ ‘चाँदी’ हो सकता है, पर उधार और ब्याज के आर्थिक संदर्भ में ‘धन’ स्वाभाविक और स्पष्ट है।
- source_word: נָתַן בְּנֶשֶׁךְ
  choice: ब्याज पर ... देता
  rationale: यह पदबंध ब्याज लेकर धन उधार देने को व्यक्त करता है। ‘ब्याज पर देना’ आधुनिक हिन्दी में सहज है और इसे केवल अत्यधिक ब्याज तक सीमित नहीं करता।
- source_word: שֹׁחַד
  choice: घूस
  rationale: यह न्याय को भ्रष्ट करने के लिए दिए गए अनुचित भुगतान का मानक और स्पष्ट हिन्दी शब्द है।
- source_word: עַל נָקִי
  choice: निर्दोष के विरुद्ध
  rationale: נָקִי दोषरहित या निर्दोष व्यक्ति को दर्शाता है; עַל यहाँ उसके विरुद्ध हानि पहुँचाने वाले न्यायिक पक्ष को बनाए रखता है।
- source_word: עֹשֵׂה אֵלֶּה
  choice: जो ये काम करता है
  rationale: इब्रानी कृदंत ऐसे व्यक्ति का वर्णन करता है जिसकी पहचान इन आचरणों से होती है; यह हिन्दी में स्वाभाविक एकवचन अभिव्यक्ति है।
- source_word: לֹא יִמּוֹט לְעוֹלָם
  choice: कभी नहीं डगमगाएगा
  rationale: מוֹט स्थिरता खोने या डगमगाने का रूपक है, और निषेध के साथ לְעוֹלָם का अर्थ ‘कभी नहीं’ स्वाभाविक रूप से व्यक्त होता है।
theological_decisions:
- issue: ब्याज लेने की नैतिक सीमा
  choice: נֶשֶׁךְ को व्यापक अर्थ में ‘ब्याज’ के रूप में प्रस्तुत किया गया है।
  alternative: ‘सूद’ या केवल अत्यधिक/शोषणकारी ब्याज
  rationale: मूल शब्द ऋण पर लिए जाने वाले ब्याज को सूचित कर सकता है। इसे केवल अत्यधिक ब्याज तक सीमित करना मूल पाठ से अधिक संकीर्ण नैतिक निष्कर्ष जोड़ देगा।
- issue: अंतिम प्रतिज्ञा का कालगत बल
  choice: ‘कभी नहीं डगमगाएगा’
  alternative: ‘सदा के लिए नहीं हटाया जाएगा’
  rationale: निषेध और לְעוֹלָם का मेल स्थायी सुरक्षा व्यक्त करता है; ‘डगमगाना’ मूल रूपक को स्वाभाविक हिन्दी में बनाए रखता है, बिना उसकी आध्यात्मिक या सांसारिक सीमा को अतिरिक्त रूप से निश्चित किए।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य शैली। ‘धन’, ‘ब्याज’, ‘घूस’ और ‘निर्दोष’ जैसे प्रचलित शब्द चुने गए हैं; अंतिम पंक्ति में स्थिरता का इब्रानी रूपक सुरक्षित रखा गया है।
