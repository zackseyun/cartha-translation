lexical_decisions:
- source_word: הוֹלֵךְ
  choice: चाल चलता है
  rationale: הלך का कृदन्त यहाँ जीवन-व्यवहार के रूपक के रूप में प्रयुक्त है। ‘चाल चलता है’ मूल के ‘चलने’ वाले बिंब को बनाए रखता है और इस काव्यात्मक संदर्भ में स्वाभाविक है।
- source_word: תָּמִים
  choice: खरी
  rationale: תמים यहाँ आचरण की संपूर्णता, निष्कपटता और अखंड निष्ठा को दर्शाता है, न कि अनिवार्य रूप से पूर्ण निष्पापता को। ‘खरी चाल’ आधुनिक हिन्दी में इस नैतिक अखंडता को सहज रूप से व्यक्त करती है।
- source_word: וּפֹעֵל
  choice: करता है
  rationale: פעל का कृदन्त करने या व्यवहार में लाने का भाव देता है। ‘करता है’ अगले पद के साथ स्वाभाविक हिन्दी बनाता और तीनों समानांतर क्रियाओं को बनाए रखता है।
- source_word: צֶדֶק
  choice: जो सही है
  rationale: צדק में धार्मिकता, न्याय और उचित बात के अर्थ समाहित हो सकते हैं। ‘जो सही है’ व्यावहारिक नैतिक आचरण को सरल आधुनिक हिन्दी में व्यक्त करता है, जबकि विकल्प पादटिप्पणी में सुरक्षित हैं।
- source_word: וְדֹבֵר
  choice: बोलता है
  rationale: דבר का कृदन्त सीधे बोलने की क्रिया बताता है और अन्य कृदन्तों के साथ काव्यात्मक समानांतरता रखता है।
- source_word: אֱמֶת
  choice: सच
  rationale: אמת विश्वसनीयता या निष्ठा का अर्थ भी दे सकता है, पर ‘बोलता है’ के साथ यहाँ सत्य भाषण प्रमुख है। ‘सच’ सामान्य आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: בִּלְבָבוֹ
  choice: अपने हृदय में
  rationale: यह पद शाब्दिक रूप से ‘उसके हृदय में’ है। ‘अपने हृदय में’ भीतरी सत्यनिष्ठा को व्यक्त करता है और हृदय के इब्रानी बिंब को बनाए रखता है।
