  yaml_path: translation/ot/psalms/015/003.yaml
  text: He does not slander with his tongue[a], does not do evil to his neighbor[c][b], and does not bear reproach against his close one.
translation:
  language: hi
  text: जो अपनी जीभ से किसी की निंदा नहीं करता[a], अपने पड़ोसी[b] के विरुद्ध बुराई नहीं करता, और अपने निकट के व्यक्ति[c] के विरुद्ध अपमान की बात नहीं उठाता।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपनी जीभ से चुगली नहीं करता।”
    reason: lexical_alternative
  - marker: b
    text: “पड़ोसी” के लिए प्रयुक्त इब्रानी शब्द का अर्थ मित्र या साथी भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: यह किसी रिश्तेदार, घनिष्ठ व्यक्ति, या उसके आसपास के समुदाय के किसी व्यक्ति को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: רָגַל עַל לְשׁוֹנוֹ
  choice: अपनी जीभ से किसी की निंदा करता
  rationale: इस वाक्यांश में רָגַל का अर्थ वाणी के द्वारा किसी के विरुद्ध चुगली या निंदा करना है। हिन्दी में यह अभिव्यक्ति नैतिक आशय और ‘जीभ’ के ठोस बिंब, दोनों को बनाए रखती है।
- source_word: עָשָׂה ... רָעָה
  choice: बुराई करता
  rationale: यह व्यापक इब्रानी अभिव्यक्ति है, जिसमें गलत काम और हानि दोनों समा सकते हैं। ‘बुराई करता’ इसके नैतिक विस्तार को अनावश्यक रूप से सीमित नहीं करता।
- source_word: לְרֵעֵהוּ
  choice: अपने पड़ोसी के साथ
  rationale: רֵעַ मित्र, साथी या समुदाय के दूसरे व्यक्ति को सूचित कर सकता है। ‘पड़ोसी’ व्यापक सामाजिक संबंध को सहज और परिचित हिन्दी में व्यक्त करता है।
- source_word: חֶרְפָּה
  choice: अपमान की बात
  rationale: חֶרְפָּה में निंदा, तिरस्कार और सामाजिक अपमान के भाव हैं। ‘अपमान की बात’ यहाँ बोलकर किसी को लज्जित करने के समानांतर आशय को स्वाभाविक हिन्दी में व्यक्त करती है।
- source_word: נָשָׂא ... עַל
  choice: के विरुद्ध ... उठाता
  rationale: यह चयन मूल के ‘उठाना/ढोना’ रूपक को बनाए रखता है और किसी के विरुद्ध अपमानजनक बात उठाने या आगे बढ़ाने के सक्रिय अर्थ को व्यक्त करता है।
- source_word: קְרֹבוֹ
  choice: अपने निकट के व्यक्ति
  rationale: यह शब्द किसी रिश्तेदार, घनिष्ठ व्यक्ति या पास रहने वाले व्यक्ति को सूचित कर सकता है। यह अनुवाद संबंध की निकटता बनाए रखता है, पर उसे केवल रक्त-संबंध तक सीमित नहीं करता।
