  edition: WLC
  text: מִזְמ֗וֹר לְ/דָ֫וִ֥ד יְ֭הֹוָה מִי יָג֣וּר בְּ/אָהֳלֶ֑/ךָ מִֽי יִ֝שְׁכֹּ֗ן בְּ/הַ֣ר קָדְשֶֽׁ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/015/001.yaml
  text: A psalm of David[a]. O Yahweh[b], who may sojourn in your tent? Who may dwell on your holy mountain?
translation:
  language: hi
  text: 'दाऊद का भजन।[a]


    हे याहवे, तेरे तम्बू में कौन अतिथि होकर रह सकता है?[b]


    तेरे पवित्र पर्वत पर कौन निवास कर सकता है?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद ‘दाऊद द्वारा रचित भजन’ या ‘दाऊद के लिए भजन’ भी हो सकता है; इब्रानी शीर्षक रचनाकारिता, संबंध या समर्पण सूचित कर सकता है।
    reason: alternative_reading
  - marker: b
    text: ‘तम्बू’ से यहाँ परमेश्वर के निवासस्थान, अर्थात पवित्रस्थान, का संकेत हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְמוֹר
  choice: भजन
  rationale: भजन-संग्रह के शीर्षकों में यह गीत अथवा स्तुति-काव्य का मानक पद है; हिन्दी में ‘भजन’ स्वाभाविक और स्थापित समतुल्य है।
- source_word: לְדָוִד
  choice: दाऊद का
  rationale: शीर्षक में לְ संबंध, रचनाकारिता या समर्पण सूचित कर सकता है। ‘दाऊद का’ इस संबंध को किसी एक अर्थ तक सीमित नहीं करता।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ के व्यक्तिगत ईश्वरीय नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित नाम-रूप से व्यक्त किया गया है।
- source_word: יָגוּר
  choice: अतिथि होकर रह सकता है
  rationale: גור में परदेशी या अतिथि के रूप में ठहरने का भाव है। यह पद उस अस्थायी-अतिथि भाव को व्यक्त करता और अगले चरण के ‘निवास’ से भेद बनाए रखता है।
- source_word: בְּאָהֳלֶךָ
  choice: तेरे तम्बू में
  rationale: אֹהֶל का सीधा अर्थ ‘तम्बू’ है। संदर्भ में यह परमेश्वर के पवित्रस्थान की ओर संकेत कर सकता है, पर अनुवाद मूल ठोस बिम्ब को सुरक्षित रखता है।
- source_word: יִשְׁכֹּן
  choice: निवास कर सकता है
  rationale: שׁכן का अर्थ बसना या निवास करना है; यह पहले चरण के अतिथि होकर रहने के समानांतर अधिक स्थायी निवास का भाव देता है।
- source_word: בְּהַר קָדְשֶׁךָ
  choice: तेरे पवित्र पर्वत पर
  rationale: यह पद स्वाभाविक हिन्दी में ‘तेरे पवित्र पर्वत’ है और सिय्योन को परमेश्वर के पवित्र स्थान के रूप में संकेतित करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: पाठ में आए वाचा-संबंधी व्यक्तिगत नाम को ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित नहीं किया गया। ‘यहोवा’ आधुनिक हिन्दी बाइबलीय प्रयोग में व्यापक रूप से पहचाना जाने वाला नाम-रूप है।
- issue: לְדָוִד में दाऊद से संबंध
  choice: दाऊद का भजन
  alternative: दाऊद द्वारा रचित भजन / दाऊद के लिए भजन
  rationale: हिब्रू संबंधसूचक לְ रचनाकारिता, संबंध अथवा समर्पण बता सकता है। मुख्य पाठ में व्यापक संबंध रखा गया और संभावनाएँ टिप्पणी में स्पष्ट की गईं।
- issue: तम्बू और पवित्र पर्वत का पवित्रस्थान-संबंधी संकेत
  choice: मूल स्थानिक बिम्बों को बनाए रखना
  alternative: तेरे पवित्रस्थान में कौन रह सकता है?
  rationale: ‘तम्बू’ और ‘पवित्र पर्वत’ के समानांतर बिम्ब परमेश्वर की उपस्थिति और सिय्योन-पवित्रस्थान की ओर संकेत करते हैं; इन्हें एक सामान्य धार्मिक शब्द में मिला देना मूल काव्यात्मक तनाव को घटाता।
translation_notes:
  register: भाषा आधुनिक, सहज और श्रद्धापूर्ण रखी गई है। काव्यात्मक समानांतरता बनाए रखने के लिए दो प्रश्न अलग पंक्तियों में हैं। ‘अतिथि होकर रहना’ और ‘निवास करना’ मूल क्रियाओं के सूक्ष्म भेद को साधारण पाठक के लिए स्पष्ट करते हैं।
