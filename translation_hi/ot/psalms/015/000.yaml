  text: A psalm of David[a]. Yahweh[b], who may dwell in your tent? Who may live on your holy mountain?
translation:
  language: hi
  text: 'दाऊद का भजन।[a]


    हे यहोवा, कौन तेरे तंबू में अतिथि की तरह ठहर सकता है?[b]


    तेरे पवित्र पर्वत पर कौन निवास कर सकता है?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “दाऊद द्वारा रचित भजन” अथवा “दाऊद के लिए भजन”; इब्रानी शीर्षक दाऊद के साथ रचनाकारिता, संबंध या समर्पण का संकेत दे सकता है।
    reason: alternative_reading
  - marker: b
    text: यहाँ “तंबू” संभवतः परमेश्वर के निवासस्थान, अर्थात् पवित्रस्थान, की ओर संकेत करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְמוֹר לְדָוִד
  choice: दाऊद का भजन
  rationale: यह स्वाभाविक हिन्दी शीर्षक है; לְ संबंध, रचनाकारिता या समर्पण सूचित कर सकता है, इसलिए उसकी व्यापकता पादटिप्पणी में रखी गई है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: व्यक्तिगत दिव्य नाम को हिन्दी में प्रचलित और पहचाने जाने योग्य रूप में रखा गया है।
- source_word: יָגוּר
  choice: अतिथि बनकर रह सकता है
  rationale: גור में किसी स्थान पर परदेशी अथवा आश्रित अतिथि के रूप में ठहरने का भाव हो सकता है; यह अगले समानांतर क्रियापद שׁכן से उसका सूक्ष्म अंतर बचाता है।
- source_word: בְּאָהֳלֶךָ
  choice: तेरे तंबू में
  rationale: אהל का मूल ठोस अर्थ 'तंबू' है; प्रसंग में यह पवित्रस्थान की ओर संकेत करता है, जिसे पादटिप्पणी स्पष्ट करती है।
- source_word: יִשְׁכֹּן
  choice: निवास कर सकता है
  rationale: שׁכן स्थिर रूप से बसने या निवास करने का भाव देता है और पहले प्रश्न के גור के साथ काव्यात्मक समानांतरता रखता है।
- source_word: הַר קָדְשֶׁךָ
  choice: तेरे पवित्र पर्वत
  rationale: मूल के संबंधवाचक रूप और सिय्योन/पवित्रस्थान की स्थानिक छवि को सीधे सुरक्षित रखा गया है।
theological_decisions:
- issue: भजन के शीर्षक में לְדָוִד का संबंध
  choice: दाऊद का भजन
  alternative: दाऊद द्वारा रचित भजन; दाऊद के लिए भजन
  rationale: मूल व्याकरण स्वयं इन संभावनाओं में से किसी एक को निर्णायक रूप से निर्धारित नहीं करता; मुख्य पाठ में पारंपरिक संक्षिप्त रूप और पादटिप्पणी में वास्तविक अस्पष्टता रखी गई है।
- issue: तंबू की पवित्रस्थान-संबंधी छवि
  choice: शाब्दिक 'तंबू' मुख्य पाठ में
  alternative: निवास-तंबू; पवित्रस्थान
  rationale: मूल रूपक को व्याख्यात्मक शब्द से बदलने के बजाय उसके धार्मिक संकेत को पादटिप्पणी में बताया गया है।
translation_notes:
  register: भाषा आधुनिक, श्रद्धापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। दोनों प्रश्नों की काव्यात्मक समानांतरता सुरक्षित है, जबकि יָגוּר और יִשְׁכֹּן के बीच अतिथि रूप में ठहरने और स्थायी निवास करने का सूक्ष्म अंतर हिन्दी में यथासंभव व्यक्त किया गया है।
