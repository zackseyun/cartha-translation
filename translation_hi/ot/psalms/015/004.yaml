source:
  edition: WLC
  text: נִבְזֶ֤ה בְּֽ/עֵ֘ינָ֤י/ו נִמְאָ֗ס וְ/אֶת יִרְאֵ֣י יְהוָ֣ה יְכַבֵּ֑ד נִשְׁבַּ֥ע לְ֝/הָרַ֗ע וְ/לֹ֣א יָמִֽר׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/015/004.yaml
  text: In his eyes a despised person is rejected[a], but he honors those who fear Yahweh[b]; he swears to his own harm and does not change.
translation:
  language: hi
  text: उसकी दृष्टि में तुच्छ समझा गया व्यक्ति ठुकराया हुआ है[a], पर वह यहोवा का भय मानने वालों का आदर करता है; वह अपनी हानि होने पर भी शपथ लेता है[b] और अपनी बात नहीं बदलता।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, अधिक पारंपरिक रूप में: “उसकी दृष्टि में नीच व्यक्ति तुच्छ है।” इब्रानी वाक्यांश बहुत संक्षिप्त है और इसके कई निकट-संबंधी अनुवाद संभव हैं।'
    reason: alternative_reading
  - marker: b
    text: शाब्दिक रूप से, “वह हानि के लिए शपथ खाता है और नहीं बदलता।” सामान्यतः इसका अर्थ यह समझा जाता है कि शपथ निभाने से स्वयं उसकी हानि हो, तब भी वह उससे पीछे नहीं हटता।
    reason: lexical_alternative
lexical_decisions:
- source_word: נִבְזֶה
  choice: तुच्छ समझा गया व्यक्ति
  rationale: इब्रानी का निष्क्रिय विशेषण ऐसे व्यक्ति को दर्शाता है जिसे तुच्छ माना जाता है; यह अनुवाद उसे सीधे ‘दुष्ट’ कहकर अर्थ को अनावश्यक रूप से सीमित नहीं करता।
- source_word: בְּעֵינָיו
  choice: उसकी दृष्टि में
  rationale: यह मूल्यांकन का सामान्य इब्रानी मुहावरा है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: נִמְאָס
  choice: अस्वीकार्य है
  rationale: क्रिया अस्वीकार किए जाने या ग्रहण योग्य न माने जाने का भाव देती है; यह נִבְזֶה के साथ अनावश्यक शब्द-दोहराव से बचती है।
- source_word: יִרְאֵי יְהוָה
  choice: यहोवा का भय माननेवाले
  rationale: वाचा-संबंधी अभिव्यक्ति में श्रद्धापूर्ण भय का अर्थ है; ‘भय’ को केवल ‘श्रद्धा’ बनाकर उसका तनाव कम नहीं किया गया।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ में प्रयुक्त परमेश्वर के व्यक्तिगत वाचा-नाम को हिन्दी के प्रचलित लिप्यंतरण में रखा गया है, किसी उपाधि से बदला नहीं गया।
- source_word: יְכַבֵּד
  choice: आदर करता है
  rationale: पिएल रूप यहाँ किसी को महत्त्व और सम्मान देने का अर्थ रखता है; हिन्दी में यह संक्षिप्त और स्वाभाविक है।
- source_word: נִשְׁבַּע
  choice: शपथ खाता है
  rationale: वर्तमान काल पूरे पद में चरित्र के नियमित गुण का वर्णन करता है।
- source_word: לְהָרַע
  choice: अपनी ही हानि की
  rationale: इब्रानी वाक्यांश संक्षिप्त और कुछ हद तक अस्पष्ट है; सामान्य संदर्भगत अर्थ यह है कि शपथ स्वयं उसके लिए हानिकारक सिद्ध होती है।
- source_word: יָמִר
  choice: अपनी बात नहीं बदलता
  rationale: हिफ़ील रूप का अर्थ बदलना या फेरना है; निहित कर्म—उसकी शपथ या वचन—को स्वाभाविक हिन्दी में ‘अपनी बात’ से व्यक्त किया गया है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: पद में चतुरक्षरीय व्यक्तिगत नाम सीधे आया है; नाम को सुरक्षित रखना स्रोत-पाठ को किसी उपाधि से प्रतिस्थापित करने की अपेक्षा अधिक निकटता से प्रस्तुत करता है।
- issue: नִבְזֶה בְּעֵינָיו נִמְאָס की कठिन और संक्षिप्त रचना
  choice: उसकी दृष्टि में तुच्छ समझा गया व्यक्ति अस्वीकार्य है
  alternative: उसकी दृष्टि में नीच व्यक्ति तुच्छ है
  rationale: चुना गया पाठ दोनों निष्क्रिय रूपों के प्रभाव को बनाए रखता है और व्यक्ति की नैतिक श्रेणी को मूल से अधिक कठोरता से निर्धारित नहीं करता; पारंपरिक विकल्प पादटिप्पणी में दिया गया है।
- issue: लְהָרַע में हानि किसकी है
  choice: अपनी ही हानि
  alternative: हानि करने के लिए
  rationale: संदर्भ में सामान्य अर्थ शपथ लेनेवाले को होने वाली हानि है, पर मूल वाक्यांश की संक्षिप्तता और शाब्दिक विकल्प पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘यहोवा का भय माननेवाले’ जैसी बाइबलीय अभिव्यक्ति को अर्थगत तनाव सहित बनाए रखा गया है; कठिन प्रथम उपवाक्य और संक्षिप्त शपथ-वाक्य की अस्पष्टता पादटिप्पणियों में स्पष्ट की गई है।
