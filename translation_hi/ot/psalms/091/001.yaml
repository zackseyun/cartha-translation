id: PSA.91.1
reference: Psalms 91:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: יֹ֭שֵׁב בְּ/סֵ֣תֶר עֶלְי֑וֹן בְּ/צֵ֥ל שַׁ֝דַּ֗י יִתְלוֹנָֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/091/001.yaml
  text: He who dwells in the shelter of the Most High will lodge in the shadow of the Almighty[a][b][c].
translation:
  language: hi
  text: जो परमप्रधान के आश्रय[a] में निवास करता है, वह सर्वशक्तिमान की छाया में रात बिताएगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “परमप्रधान के गुप्त स्थान में।”
    reason: lexical_alternative
  - marker: b
    text: या “ठहरा रहेगा” अथवा “निवास करेगा।” इब्रानी क्रिया का मूल भाव रात ठहरना है और विस्तार से बने रहना भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹשֵׁב
  choice: जो ... निवास करता है
  rationale: यह कृदन्त संज्ञा के समान प्रयुक्त होकर ऐसे व्यक्ति को दर्शाता है जिसकी विशेषता वहाँ बने रहना है। हिंदी में ‘जो ... निवास करता है’ प्रतिनिधिक एकवचन को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: בְּסֵתֶר
  choice: के आश्रय में
  rationale: סֵתֶר किसी छिपे, सुरक्षित स्थान को सूचित करता है। ‘आश्रय’ सुरक्षा और शरण के भाव को सहज आधुनिक हिंदी में व्यक्त करता है; ‘गुप्त स्थान’ भी संभव है।
- source_word: עֶלְיוֹן
  choice: परमप्रधान
  rationale: यह परमेश्वर की सर्वोच्चता बताने वाली उपाधि है। ‘परमप्रधान’ हिंदी बाइबलीय प्रयोग में प्रतिष्ठित, स्पष्ट और गरिमापूर्ण है।
- source_word: בְּצֵל
  choice: की छाया में
  rationale: मूल शब्द का सीधा अर्थ ‘छाया में’ है और यहाँ निकटता तथा संरक्षण का काव्यात्मक बिंब बना रहता है।
- source_word: שַׁדַּי
  choice: सर्वशक्तिमान
  rationale: इस ईश्वरीय उपाधि का अर्थानुवाद आधुनिक पाठक को सामर्थ्य का आशय स्पष्ट करता है और केवल लिप्यंतरण से बचता है।
- source_word: יִתְלוֹנָן
  choice: रात बिताएगा
  rationale: לון से बना यह क्रियापद मूलतः रात ठहरने या रात बिताने का ठोस अर्थ रखता है और विस्तार से टिके रहने का भाव भी दे सकता है। ‘रात बिताएगा’ मूल बिंब को सुरक्षित रखता है।
theological_decisions:
- issue: पुल्लिंग एकवचन सहभागी का प्रतिनिधिक अर्थ
  choice: जो ... निवास करता है
  alternative: वह पुरुष जो ... निवास करता है
  rationale: इब्रानी रूप व्याकरणतः पुल्लिंग एकवचन है, पर उसका प्रयोग किसी भी ऐसे व्यक्ति के लिए प्रतिनिधिक रूप से हो सकता है। हिंदी का ‘जो’ इस व्यापक अर्थ को बिना अनावश्यक लिंग-विशेष जोड़ने के स्वाभाविक रूप में बनाए रखता है।
- issue: ईश्वरीय उपाधि שַׁדַּי का अनुवाद
  choice: सर्वशक्तिमान
  alternative: शद्दाय
  rationale: अर्थानुवाद उपाधि का आशय सामान्य पाठक के लिए स्पष्ट रखता है; लिप्यंतरण मूल ध्वनि तो बचाता है, पर अर्थ तत्काल स्पष्ट नहीं करता।
translation_notes:
  register: आधुनिक मानक हिंदी का सरल, गरिमापूर्ण और काव्यात्मक रूप अपनाया गया है। समानांतर पंक्तियों में ‘निवास करता है’ और ‘रात बिताएगा’ मूल की स्थायी शरण तथा रात्रिकालीन ठहराव—दोनों छवियों को अलग रखते हैं।
