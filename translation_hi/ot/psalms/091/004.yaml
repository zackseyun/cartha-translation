  text: בְּ/אֶבְרָת֨/וֹ יָ֣סֶךְ לָ֭/ךְ וְ/תַֽחַת כְּנָפָ֣י/ו תֶּחְסֶ֑ה צִנָּ֖ה וְֽ/סֹחֵרָ֣ה אֲמִתּֽ/וֹ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/091/004.yaml
  text: With his pinions he will cover you[a], and under his wings you will find refuge[b]; his faithfulness is a shield and a bulwark.
translation:
  language: hi
  text: वह अपने परों से तुम्हें ढक लेगा[a], और तुम उसके पंखों के नीचे शरण लोगे; उसकी विश्वसनीयता बड़ी ढाल और छोटी ढाल है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह अपने पंखों से तुम्हें ढक लेगा।”
    reason: lexical_alternative
  - marker: b
    text: या, “उसका सत्य बड़ी ढाल और छोटी ढाल है।” अंतिम इब्रानी शब्द का अर्थ अनिश्चित है; इसका अर्थ “चारों ओर से घेरने वाली रक्षा” भी हो सकता है।
    reason: textual_or_lexical_ambiguity
lexical_decisions:
- source_word: בְּאֶבְרָתוֹ
  choice: अपने परों से
  rationale: אֶבְרָה पक्षी के परों अथवा पंखदार भाग को सूचित करता है। ‘परों’ से पक्षी का बिंब स्वाभाविक और स्पष्ट रहता है।
- source_word: יָסֶךְ
  choice: ढक लेगा
  rationale: סכך के हिफ़ील रूप में ढकने और इस प्रकार सुरक्षा देने का भाव है; ‘ढक लेगा’ मूल बिंब को सीधे रखता है।
- source_word: לָךְ
  choice: तुम्हें
  rationale: इब्रानी रूप एकवचन स्त्रीलिंग संबोधन है, पर संदर्भ में उपासक को सामान्य रूप से संबोधित किया गया है; हिन्दी ‘तुम्हें’ अनावश्यक लिंग-निर्धारण से बचता है।
- source_word: כְּנָפָיו
  choice: उसके पंखों
  rationale: כנף का पक्षी-संदर्भ में स्वाभाविक अर्थ ‘पंख’ है और यह पहले खंड के पक्षी-बिंब को आगे बढ़ाता है।
- source_word: תֶּחְסֶה
  choice: शरण लोगे
  rationale: חסה का अर्थ शरण लेना या शरण पाना है। ‘शरण लोगे’ क्रिया की सक्रियता और भरोसे के भाव को बनाए रखता है।
- source_word: צִנָּה
  choice: बड़ी ढाल
  rationale: צִנָּה सामान्यतः शरीर को अधिक ढकने वाली बड़ी ढाल को दर्शाता है; आकार का संकेत अगले कठिन सैन्य पद से इसका भेद स्पष्ट करता है।
- source_word: וְסֹחֵרָה
  choice: और छोटी ढाल
  rationale: סֹחֵרָה दुर्लभ और अर्थ की दृष्टि से कठिन शब्द है। पारंपरिक ‘छोटी ढाल’ इस सैन्य रूपक की समानांतरता बनाए रखता है, जबकि वैकल्पिक ‘चारों ओर की रक्षा’ को पादटिप्पणी में रखा गया है।
- source_word: אֲמִתּוֹ
  choice: उसकी विश्वसनीयता
  rationale: אֱמֶת में सत्य, निष्ठा और भरोसेमंदी के अर्थ समाहित हैं। ‘विश्वसनीयता’ सुरक्षा के संदर्भ में उसकी भरोसेमंद स्थिरता व्यक्त करती है, बिना ‘सत्य’ की वास्तविक संभावना मिटाए।
theological_decisions:
- issue: אֲמִתּוֹ का अर्थ
  choice: उसकी विश्वसनीयता
  alternative: उसका सत्य
  rationale: सुरक्षा के रूपक में परमेश्वर की भरोसेमंदी प्रसंगानुकूल है, पर मूल शब्द ‘सत्य’ भी हो सकता है; इसलिए विकल्प पादटिप्पणी में सुरक्षित रखा गया है।
- issue: סֹחֵרָה का कठिन अर्थ
  choice: छोटी ढाल
  alternative: चारों ओर की रक्षा
  rationale: शब्द दुर्लभ है और उसका सटीक अर्थ अनिश्चित है। पारंपरिक सैन्य अर्थ मुख्य पाठ में रखा गया है, जबकि घेरकर रक्षा करने का संभावित अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और काव्यात्मक हिन्दी। पक्षी और युद्ध-सुरक्षा के दोनों मूल रूपक बनाए गए हैं। ‘पर’ और ‘पंख’ का क्रम हिन्दी में स्वाभाविक रखते हुए इब्रानी समानांतरता को दर्शाता है; दुर्लभ סֹחֵרָה तथा बहुअर्थी אֱמֶת की अनिश्चितता पादटिप्पणी में स्पष्ट की गई है।
