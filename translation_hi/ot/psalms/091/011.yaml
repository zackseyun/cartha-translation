  text: כִּ֣י מַ֭לְאָכָי/ו יְצַוֶּה לָּ֑/ךְ לִ֝/שְׁמָרְ/ךָ֗ בְּ/כָל דְּרָכֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/091/011.yaml
  text: For he will command his angels concerning you[b][a], to guard you in all your ways.
translation:
  language: hi
  text: क्योंकि वह तुम्हारे विषय में[a] अपने स्वर्गदूतों को आज्ञा देगा कि वे तुम्हारे सभी मार्गों में तुम्हारी रक्षा करें[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘तुम्हारे लिए’। इब्रानी रचना संबंध के साथ-साथ हित का भाव भी व्यक्त कर सकती है।
    reason: lexical_alternative
  - marker: b
    text: या ‘तुम्हारी रखवाली करें’ अथवा ‘तुम्हें सुरक्षित रखें’।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले आश्वासन का आधार बताता है; ‘क्योंकि’ उसके व्याख्यात्मक कारण-संबंध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מַלְאָכָיו
  choice: अपने स्वर्गदूतों को
  rationale: शब्द का मूल अर्थ ‘दूत’ हो सकता है, पर इस भजन में परमेश्वर के संरक्षणकारी स्वर्गीय सेवकों का संदर्भ है; ‘अपने’ हिन्दी में कर्ता के साथ संबंध स्पष्ट और स्वाभाविक बनाता है।
- source_word: יְצַוֶּה
  choice: आज्ञा देगा
  rationale: पिएल क्रिया किसी को आदेश देने का भाव रखती है; यह चयन स्रोत की दृढ़ता और भविष्यगत आश्वासन दोनों बनाए रखता है।
- source_word: לָּךְ
  choice: तुम्हारे विषय में
  rationale: צוה के साथ यह रचना उस व्यक्ति को बताती है जिसके संबंध में आदेश दिया जाता है। ‘तुम्हारे लिए’ भी संभव है, इसलिए उसे पादटिप्पणी में रखा गया है।
- source_word: לִשְׁמָרְךָ
  choice: तुम्हारी रक्षा करें
  rationale: שׁמר यहाँ संभालने, पहरा देने और सुरक्षित रखने का भाव देता है; संकट और संरक्षण के प्रसंग में ‘रक्षा करें’ स्पष्ट तथा सहज है।
- source_word: בְּכָל דְּרָכֶיךָ
  choice: तुम्हारे सभी मार्गों में
  rationale: यह अनुवाद व्यापकता को बनाए रखते हुए ‘मार्ग’ के शाब्दिक और जीवन-यात्रा संबंधी दोनों संभावित अर्थों को खुला रखता है।
theological_decisions:
- issue: पुल्लिंग एकवचन क्रिया का निहित कर्ता
  choice: ‘वह’—प्रसंग में परमेश्वर—अपने स्वर्गदूतों को आज्ञा देता है।
  alternative: कर्ता का नाम जोड़े बिना केवल आज्ञा दिए जाने की बात कहना।
  rationale: इब्रानी क्रिया में कर्ता सर्वनाम निहित है, और भजन का निकट प्रसंग उसे परमेश्वर के रूप में पहचानता है। हिन्दी में ‘वह’ मूल की सर्वनामात्मक अभिव्यक्ति को बनाए रखता है, जबकि ‘परमेश्वर’ नाम को अनावश्यक रूप से पाठ में नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और काव्योपयुक्त शैली रखी गई है। एकवचन संबोधन के लिए सम्मानसूचक ‘तुम्हारे/तुम्हारी’ चुना गया है; ‘मार्ग’ रूपक की व्यापकता को सुरक्षित रखता है।
