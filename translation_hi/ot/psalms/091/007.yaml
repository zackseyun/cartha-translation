source:
  edition: WLC
  text: יִפֹּ֤ל מִ/צִּדְּ/ךָ֨ אֶ֗לֶף וּ/רְבָבָ֥ה מִ/ימִינֶ֑/ךָ אֵ֝לֶ֗י/ךָ לֹ֣א יִגָּֽשׁ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/091/007.yaml
  text: A thousand may fall at your side[a], and ten thousand at your right hand[b], but it will not come near you.
translation:
  language: hi
  text: तेरे पास एक हज़ार गिरें[a], और तेरी दाहिनी ओर दस हज़ार, फिर भी वह तेरे निकट न आएगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तेरे पास एक हज़ार गिरेंगे, और तेरी दाहिनी ओर दस हज़ार।” इस काव्य-संदर्भ में इब्रानी अपूर्ण क्रियाओं का अर्थ भावी या संभाव्य हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “वह तेरी ओर न बढ़ेगा।” इब्रानी में कर्ता बताया नहीं गया है; संदर्भ में इसका संकेत आस-पास की विपत्ति की ओर है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יִפֹּל
  choice: गिरें
  rationale: नफ़ल का क़ाल अपूर्ण रूप इस काव्य-संदर्भ में संभाव्य अथवा भावी अर्थ दे सकता है। ‘गिरें’ इस संभाव्यता को स्वाभाविक हिंदी में बनाए रखता है।
- source_word: מִצִּדְּךָ
  choice: तेरे पास
  rationale: मूल पूर्वसर्ग का शाब्दिक अर्थ ‘से’ है, पर गिरने के साथ यह स्थान-संबंध बताता है; ‘तेरे पास’ हिंदी में स्वाभाविक है।
- source_word: אֶלֶף
  choice: एक हज़ार
  rationale: संख्या को काव्यात्मक समानांतरता के लिए यथावत रखा गया है।
- source_word: וּרְבָבָה
  choice: और दस हज़ार
  rationale: רְבָבָה सामान्यतः दस हज़ार अथवा अत्यंत बड़ी संख्या दर्शाता है; यहाँ ‘दस हज़ार’ पहले पद की तीव्रता बढ़ाता है।
- source_word: מִימִינֶךָ
  choice: तेरी दाहिनी ओर
  rationale: पूर्वसर्ग यहाँ स्थान-संबंधी है। यह चयन मूल स्थानिक बिंब और समानांतर रचना को बनाए रखता है।
- source_word: אֵלֶיךָ
  choice: तेरे निकट
  rationale: נגשׁ के साथ אֶל किसी की ओर बढ़ने का भाव देता है; ‘निकट आना’ धमकी के पास पहुँचने को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: לֹא יִגָּשׁ
  choice: वह ... न आएगा
  rationale: क्रिया एकवचन है और उसका कर्ता मूल में व्यक्त नहीं है। हिंदी में ‘वह’ देकर संदर्भगत विपत्ति की ओर संकेत किया गया है, पर उसे अधिक विशिष्ट नाम नहीं दिया गया।
theological_decisions:
- issue: अंतिम उपवाक्य का अव्यक्त कर्ता
  choice: ‘वह’ सर्वनाम द्वारा संदर्भगत विपत्ति की ओर संकेत
  alternative: ‘विपत्ति’ या ‘महामारी’ को स्पष्ट कर्ता बनाना
  rationale: इब्रानी में कर्ता अनकहा है। ‘वह’ मूल की अस्पष्टता को काफी हद तक बनाए रखता है और किसी एक विशेष संकट को पाठ में जोड़ने से बचता है।
- issue: יִפֹּל का भावी या संभाव्य अर्थ
  choice: संभाव्य ‘गिरें’
  alternative: निश्चित भावी ‘गिरेंगे’
  rationale: इब्रानी अपूर्ण रूप काव्य में भावी या संभाव्य दोनों अर्थ दे सकता है; मुख्य पाठ में संभाव्यता रखी गई और भावी विकल्प पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिंदी। भजन के एकवचन आत्मीय संबोधन को बनाए रखने के लिए ‘तेरे/तेरी’ का प्रयोग किया गया है; स्थानिक समानांतरता और मूल की कर्ता-संबंधी अस्पष्टता सुरक्षित रखी गई है।
