  yaml_path: translation/ot/psalms/091/005.yaml
  text: You will not fear the terror of the night[b][a], nor the arrow that flies by day.
translation:
  language: hi
  text: 'तू रात के आतंक[a] से नहीं डरेगा,[b]

    और उस तीर से भी नहीं जो दिन में उड़ता है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘आतंक’ के स्थान पर ‘दहशत’ या ‘भय।’
    reason: lexical_alternative
  - marker: b
    text: या ‘तुझे डरने की आवश्यकता नहीं,’ जिससे आश्वासन का भाव अधिक स्पष्ट होता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: תִירָא
  choice: तू ... डरेगा
  rationale: לֹא के साथ क़ाल अपूर्ण 2 पुल्लिंग एकवचन यहाँ निषेधात्मक आज्ञा के बजाय भविष्यसूचक आश्वासन व्यक्त करता है। हिंदी का भविष्यकाल इस आश्वासन को स्वाभाविक ढंग से बनाए रखता है।
- source_word: פַּחַד
  choice: आतंक
  rationale: यह शब्द केवल डरने की मनःस्थिति नहीं, बल्कि भय उत्पन्न करने वाली दहशत या आतंक को भी सूचित करता है; काव्यात्मक संदर्भ में ‘आतंक’ उपयुक्त है।
- source_word: לָיְלָה
  choice: रात के
  rationale: ‘रात का आतंक’ संबंध को स्वाभाविक हिंदी में व्यक्त करता है और अगले चरण के ‘दिन में’ के साथ काव्यात्मक विरोध बनाए रखता है।
- source_word: חֵץ
  choice: तीर
  rationale: मूल शब्द का सामान्य और ठोस अर्थ ‘तीर’ है; संभावित रूपक को स्पष्ट किए बिना मूल बिंब सुरक्षित रखा गया है।
- source_word: יָעוּף
  choice: उड़ता है
  rationale: क़ाल अपूर्ण का मूल अर्थ ‘उड़ना’ है; तीर को विशेषित करने के लिए यह वर्तमान-सामान्य प्रयोग हिंदी में स्वाभाविक है।
- source_word: יוֹמָם
  choice: दिन में
  rationale: यह क्रियाविशेषण दिन के समय को दर्शाता है और ‘रात के’ के साथ स्पष्ट काव्यात्मक समानांतर बनाता है।
- source_word: מִן ... מִן
  choice: से ... न ... से
  rationale: दोहराया गया संबंधसूचक उन दोनों खतरों को चिह्नित करता है जिनसे भय नहीं होगा। हिंदी में ‘से डरना’ दोनों पदों में इसकी शक्ति को स्पष्ट और सहज रूप से बनाए रखता है।
theological_decisions:
- issue: पद को आज्ञा के रूप में प्रस्तुत किया जाए या प्रतिज्ञात्मक आश्वासन के रूप में
  choice: 'प्रतिज्ञात्मक आश्वासन: ‘तू ... नहीं डरेगा’'
  alternative: 'आज्ञा: ‘मत डर’'
  rationale: इब्रानी में לֹא के साथ अपूर्ण क्रिया इस काव्यात्मक संदर्भ में सीधे निषेध की अपेक्षा सुरक्षित व्यक्ति के विषय में आश्वासन को अधिक स्वाभाविक रूप से व्यक्त करती है। भविष्यकाल मूल की संभावित प्रतिज्ञात्मक शक्ति को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिंदी। एकवचन संबोधन के लिए काव्य और भजन-साहित्य में प्रचलित ‘तू’ रखा गया है। पंक्ति-विभाजन इब्रानी समानांतरता को दर्शाता है; दोनों पादों में ‘से’ दोहराकर मूल के מִן ... מִן को स्वाभाविक हिंदी में सुरक्षित रखा गया है।
