source:
  edition: WLC
  text: כִּֽי אַתָּ֣ה יְהוָ֣ה מַחְסִ֑/י עֶ֝לְי֗וֹן שַׂ֣מְתָּ מְעוֹנֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/091/009.yaml
  text: Because you[a], O Yahweh, are my refuge, you have made the Most High your dwelling place.
translation:
  language: hi
  text: क्योंकि हे यहोवा, आप ही मेरा शरणस्थान हैं,[a] आपने परमप्रधान को अपना निवास बनाया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'कठिन इब्रानी वाक्य-विन्यास का एक प्रचलित अर्थ यह भी है: “क्योंकि आपने कहा है, ‘यहोवा मेरा शरणस्थान है,’ और परमप्रधान को अपना निवास बनाया है।”'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह आसपास वर्णित सुरक्षा का कारण या आधार प्रस्तुत करता है और इब्रानी के कारणवाचक बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: אַתָּה
  choice: आप ही
  rationale: द्वितीय पुरुष एकवचन सर्वनाम के स्पष्ट बल को हिन्दी में ‘ही’ द्वारा व्यक्त किया गया है; परमेश्वर के लिए आदरसूचक ‘आप’ स्वाभाविक है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ रखा गया है।
- source_word: מַחְסִי
  choice: मेरा शरणस्थान
  rationale: מַחְסֶה सुरक्षा पाने के स्थान को दर्शाता है; ‘शरणस्थान’ भजन-साहित्य के अनुरूप, स्पष्ट और गरिमापूर्ण है।
- source_word: עֶלְיוֹן
  choice: परमप्रधान
  rationale: यह परमेश्वर की उपाधि है जिसका अर्थ ‘सबसे ऊँचा’ है; ‘परमप्रधान’ आधुनिक हिन्दी बाइबलीय प्रयोग में संक्षिप्त और स्पष्ट है।
- source_word: שַׂמְתָּ
  choice: आपने ... बनाया है
  rationale: שׂים का यहाँ अर्थ किसी को अपना निवास ठहराना या बनाना है; हिन्दी में यह पदबंध स्वाभाविक है।
- source_word: מְעוֹנֶךָ
  choice: अपना निवास
  rationale: מָעוֹן रहने की जगह को दर्शाता है। ‘निवास’ स्पष्ट है और पहले आए ‘शरणस्थान’ से शब्दार्थगत भेद बनाए रखता है।
theological_decisions:
- issue: भजन 91:9 में वक्ता और संबोधित व्यक्ति की कठिन वाक्य-संरचना
  choice: 'मसोरेटी स्वरांकन के अनुसार पंक्ति को सीधे संबोधन के रूप में रखा गया है: ‘क्योंकि हे यहोवा, आप ही मेरा शरणस्थान हैं ... आपने परमप्रधान को अपना निवास बनाया है।’'
  alternative: ‘क्योंकि आपने कहा है, “यहोवा मेरा शरणस्थान है,” और परमप्रधान को अपना निवास बनाया है।’
  rationale: इब्रानी पाठ में ‘आपने कहा है’ के लिए कोई स्पष्ट क्रिया नहीं है और ‘मेरा शरणस्थान’ से ‘अपना निवास’ तक पुरुष-वचन का तनाव बना रहता है। मुख्य पाठ न्यूनतम पूर्ति के साथ मसोरेटी शब्दों को सुरक्षित रखता है; प्रचलित वैकल्पिक विन्यास पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली अपनाई गई है। परमेश्वर के प्रत्यक्ष संबोधन में आदरसूचक ‘आप’ रखा गया है। मुख्य पाठ इब्रानी की वास्तविक वाक्यगत कठिनाई को मिटाता नहीं; वैकल्पिक समझ पादटिप्पणी में सुरक्षित है।
