source:
  edition: WLC
  text: כִּ֤י ה֣וּא יַ֭צִּֽילְ/ךָ מִ/פַּ֥ח יָק֗וּשׁ מִ/דֶּ֥בֶר הַוּֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/091/003.yaml
  text: For he will deliver you from the snare of the fowler[b][a], from the deadly pestilence.
translation:
  language: hi
  text: क्योंकि वही तुम्हें बहेलिए के फंदे से, और विनाशकारी महामारी से बचाएगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले आश्वासन का आधार बताता है; इसलिए कारणसूचक संबंध को स्पष्ट रखा गया है।
- source_word: הוּא
  choice: वही
  rationale: स्वतंत्र सर्वनाम में निहित कर्ता-बल को स्वाभाविक हिन्दी में ‘वही’ व्यक्त करता है।
- source_word: יַצִּילְךָ
  choice: तुम्हें ... बचाएगा
  rationale: नצל के हिफ़ील रूप का अर्थ संकट से छुड़ाना या बचाना है; ‘बचाएगा’ सहज और गरिमापूर्ण है।
- source_word: מִפַּח
  choice: फंदे से
  rationale: פַּח किसी जाल या फंदे को दर्शाता है; पक्षी पकड़ने के संदर्भ में ‘फंदा’ सटीक और सामान्य हिन्दी है।
- source_word: יָקוּשׁ
  choice: बहेलिए के
  rationale: यह जाल बिछाकर पक्षी पकड़ने वाले व्यक्ति को सूचित करता है; ‘बहेलिया’ संक्षिप्त और प्रचलित समतुल्य है।
- source_word: מִדֶּבֶר
  choice: महामारी से
  rationale: דֶּבֶר व्यापक रूप से फैलने वाली घातक व्याधि या महामारी को दर्शाता है।
- source_word: הַוּוֹת
  choice: विनाशकारी
  rationale: यह शब्द विनाश, बरबादी या घातक हानि का भाव देता है; ‘विनाशकारी’ דֶּבֶר के विशेषण के रूप में अर्थ और अभिव्यक्ति दोनों को सुरक्षित रखता है।
theological_decisions:
- issue: वर्णित खतरों का स्वरूप
  choice: ठोस खतरों की मूल छवियों को बनाए रखा गया है, जो काव्य में व्यापक संकटों का भी प्रतिनिधित्व कर सकती हैं।
  alternative: इन्हें केवल शारीरिक खतरे या केवल रूपकात्मक आत्मिक खतरे मानना।
  rationale: इब्रानी पाठ फंदे और महामारी जैसे वास्तविक खतरों का नाम लेता है, पर काव्यात्मक संदर्भ उनके व्यापक प्रतीकात्मक प्रयोग को बंद नहीं करता; अनुवाद इस तनाव का निर्णय नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और काव्यात्मक। ‘बहेलिया’ मूल की पक्षी पकड़ने वाले की विशिष्ट छवि को बनाए रखता है।
