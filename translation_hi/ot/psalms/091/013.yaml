  yaml_path: translation/ot/psalms/091/013.yaml
  text: You will tread on the lion and the cobra[b][a]; you will trample the young lion and the serpent.
translation:
  language: hi
  text: तुम सिंह और कोबरा[a] को पैरों तले रौंदोगे; तुम जवान सिंह और सर्प[b] को कुचल डालोगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: परंपरागत रूप से “ऐस्प”; यह शब्द किसी विषैले साँप को सूचित करता है।
    reason: lexical_alternative
  - marker: b
    text: या “अजगर” अथवा “ड्रैगन”; हिब्रू शब्द अन्य संदर्भों में किसी बड़े सरीसृप या समुद्री जीव को भी सूचित कर सकता है, पर यहाँ “सर्प” संदर्भानुकूल है।
    reason: alternative_reading
lexical_decisions:
- source_word: עַל
  choice: पैरों तले
  rationale: यह संबंधबोधक शब्द उन जीवों को बताता है जिन पर पाँव रखा जाता है; हिंदी में क्रियाओं के साथ ‘पैरों तले’ स्वाभाविक और काव्यात्मक है।
- source_word: שַׁחַל
  choice: सिंह
  rationale: यह सिंह के लिए प्रयुक्त काव्यात्मक शब्द है; ‘सिंह’ अर्थ और गरिमापूर्ण शैली दोनों बनाए रखता है।
- source_word: פֶתֶן
  choice: नाग
  rationale: यह विषैले साँप को सूचित करता है, जिसे परंपरागत रूप से ऐस्प या कोबरा माना गया है। ‘नाग’ आधुनिक हिंदी में सहज है और घातक सर्प की छवि बनाए रखता है।
- source_word: תִּדְרֹךְ
  choice: पैरों तले रौंदोगे
  rationale: यह द्वितीय पुरुष एकवचन क्रिया किसी वस्तु पर पाँव रखने या रौंदने का भाव देती है; यह अनुवाद हिंदी में स्पष्ट और काव्यात्मक है।
- source_word: תִּרְמֹס
  choice: कुचल डालोगे
  rationale: यह पहली क्रिया से अधिक प्रबल होकर बलपूर्वक दबाने या रौंद डालने का भाव देती है; ‘कुचल डालोगे’ समानांतर पंक्ति की तीव्रता व्यक्त करता है।
- source_word: כְּפִיר
  choice: जवान सिंह
  rationale: यह छोटे शावक के बजाय युवा और शक्तिशाली सिंह को सूचित करता है।
- source_word: תַנִּין
  choice: महासर्प
  rationale: यह शब्द बड़े सरीसृप, सर्प, समुद्री जीव या अजगर-जैसे प्राणी को सूचित कर सकता है। यहाँ स्थल के खतरनाक जीवों की सूची में ‘महासर्प’ संदर्भानुकूल है और मूल की व्यापकता को साधारण ‘साँप’ की अपेक्षा अधिक सुरक्षित रखता है।
theological_decisions:
- issue: תַנִּין को पौराणिक ‘अजगर/दैत्याकार प्राणी’ मानें या प्राणी-जगत के ‘महासर्प’ के रूप में
  choice: महासर्प
  alternative: अजगर; दैत्याकार प्राणी; समुद्री जीव
  rationale: सिंह, विषैले नाग और जवान सिंह के साथ समानांतरता स्थल पर पाए जाने वाले खतरनाक जीव की ओर संकेत करती है। फिर भी हिब्रू शब्द का अर्थ-क्षेत्र व्यापक है, इसलिए वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण काव्यात्मक शैली रखी गई है। दोनों समानांतर क्रियाओं के बढ़ते बल को ‘रौंदोगे’ और ‘कुचल डालोगे’ से व्यक्त किया गया है। संबोधन पुल्लिंग एकवचन है, जैसा हिब्रू क्रियारूप में है।
