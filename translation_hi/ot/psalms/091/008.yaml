lexical_decisions:
- source_word: רַק
  choice: केवल
  rationale: 'यह सीमा और बल दोनों व्यक्त करता है: संबोधित व्यक्ति उस विपत्ति को भोगेगा नहीं, बल्कि केवल उसे देखेगा।'
- source_word: בְּעֵינֶיךָ
  choice: अपनी आँखों से
  rationale: हिब्रू के दृश्य-बिंब को स्वाभाविक आधुनिक हिन्दी में सुरक्षित रखता है और प्रत्यक्ष दर्शन का भाव देता है।
- source_word: תַבִּיט
  choice: देखोगे
  rationale: नבט के हिफ़ील रूप का यहाँ सामान्य अर्थ ‘देखना/निहारना’ है; ‘देखोगे’ स्पष्ट और सहज है।
- source_word: וְשִׁלֻּמַת
  choice: प्रतिफल
  rationale: שלם से बने इस संज्ञा-रूप में किए का उचित प्रत्युत्तर या बदला मिलने का भाव है। ‘प्रतिफल’ इस व्यापकता को रखता है और इसे केवल दंड तक सीमित नहीं करता।
- source_word: רְשָׁעִים
  choice: दुष्टों
  rationale: भजन-साहित्य में इस नैतिक श्रेणी के लिए यह संक्षिप्त और प्रचलित हिन्दी रूप है।
- source_word: תִּרְאֶה
  choice: देखोगे
  rationale: ראה के सामान्य अर्थ ‘देखना’ को सीधे व्यक्त करता है; पहले क्रियापद के साथ पुनरुक्ति मूल की शैली को भी सुरक्षित रखती है।
theological_decisions:
- issue: दुष्टों को मिलने वाले परिणाम का स्वरूप
  choice: दुष्टों का प्रतिफल
  alternative: दुष्टों का दंड / दुष्टों को मिलने वाला बदला
  rationale: मूल संज्ञा उचित प्रत्युत्तर, बदले या दंड का बोध करा सकती है, पर केवल दंड का तात्पर्य अनिवार्य नहीं करती। ‘प्रतिफल’ नैतिक-न्यायिक भाव को रखते हुए अर्थ को अनावश्यक रूप से संकीर्ण नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण शैली। ‘अपनी आँखों से’ प्रत्यक्ष देखने का मूल बिंब रखता है। दोनों हिब्रू क्रियाओं के लिए ‘देखोगे’ की पुनरावृत्ति जानबूझकर सुरक्षित रखी गई है।
