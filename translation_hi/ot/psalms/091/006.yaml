  text: nor the plague that walks in darkness[a], nor the destruction that devastates at noon.
translation:
  language: hi
  text: न उस महामारी से, जो अंधकार में चलती है,[a] न उस विनाश से, जो दोपहर में उजाड़ता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘महामारी’ के लिए ‘घातक रोग’ और ‘विनाश’ के लिए संभवतः ‘घातक प्रकोप’ भी अनुवाद हो सकता है; इब्रानी में विनाशकारी संकट के लिए दो समानांतर काव्यात्मक शब्द आए हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: דֶּבֶר
  choice: महामारी
  rationale: यह शब्द महामारी या घातक संक्रामक प्रकोप को दर्शाता है; ‘महामारी’ आधुनिक हिन्दी में स्पष्ट है और समानांतर विनाशकारी संकट के अनुकूल है।
- source_word: בָּאֹפֶל
  choice: अंधकार में
  rationale: यह गहरे अंधकार या घोर अँधेरे का बोध कराता है; ‘अंधकार में’ काव्यात्मक चित्र को स्वाभाविक और गरिमापूर्ण ढंग से बनाए रखता है।
- source_word: יַהֲלֹךְ
  choice: चलती है
  rationale: मूल क्रिया का अर्थ चलना या जाना है; ‘चलती है’ महामारी के काव्यात्मक मानवीकरण को सुरक्षित रखता है।
- source_word: קֶּטֶב
  choice: विनाश
  rationale: यह शब्द विनाश या घातक प्रकोप का संकेत दे सकता है। ‘विनाश’ इसकी व्यापकता और पहले चरण के साथ काव्यात्मक समानांतरता बनाए रखता है, बिना इसे केवल रोग तक सीमित किए।
- source_word: יָשׁוּד
  choice: उजाड़ता है
  rationale: क्रिया हिंसक रीति से नष्ट या बरबाद करने का भाव रखती है; ‘उजाड़ता है’ सजीव, सहज और काव्यात्मक है।
- source_word: צָהֳרָיִם
  choice: दोपहर में
  rationale: शब्द का सीधा अर्थ दोपहर है और यह ‘अंधकार में’ के साथ समय-संबंधी विरोध को बनाए रखता है।
- source_word: מִן
  choice: न ... से
  rationale: यद्यपि पूर्वसर्ग का मूल अर्थ ‘से’ है, भजन 91:5–6 की सूची में यह उन संकटों को आगे जोड़ता है जिनसे भय नहीं होगा; ‘न ... से’ हिन्दी में उस समानांतर संरचना को स्वाभाविक रूप से जारी रखता है।
