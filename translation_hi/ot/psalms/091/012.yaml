  text: עַל כַּפַּ֥יִם יִשָּׂא֑וּ/נְ/ךָ פֶּן תִּגֹּ֖ף בָּ/אֶ֣בֶן רַגְלֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/091/012.yaml
  text: On their hands they will carry you[b][a], lest you strike your foot against a stone.
translation:
  language: hi
  text: वे तुझे अपनी हथेलियों पर उठाएंगे[a], ताकि तेरा पैर किसी पत्थर से न टकराए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या: “वे तुझे ले चलेंगे” अथवा “वहन करेंगे।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כַּפַּיִם
  choice: अपनी हथेलियों पर
  rationale: עַל स्थान/आधार को और כַּפַּיִם हाथ की हथेलियों को दर्शाता है। हिंदी में यह वाक्यांश स्वाभाविक है और मूल बिंब को स्पष्ट रूप से बनाए रखता है।
- source_word: יִשָּׂאוּנְךָ
  choice: वे तुझे ... उठा लेंगे
  rationale: נָשָׂא का अर्थ उठाना, ढोना या संभाले रखना हो सकता है। यहाँ सुरक्षा के प्रसंग में ‘उठा लेंगे’ स्वाभाविक है और हथेलियों पर सुरक्षित थामने का भाव देता है; ‘ले चलेंगे’ भी संभव है।
- source_word: פֶּן
  choice: ताकि ... न
  rationale: פֶּן नकारात्मक उद्देश्य अथवा रोके जाने वाले परिणाम को व्यक्त करता है। आधुनिक हिंदी में ‘ताकि ... न’ इसका स्पष्ट और स्वाभाविक रूप है।
- source_word: תִּגֹּף
  choice: टकराए
  rationale: נָגַף यहाँ पैर के पत्थर से चोट खाते हुए टकराने को दर्शाता है। ‘टकराए’ प्रत्यक्ष संपर्क को व्यक्त करता है, बिना गिरने या ठोकर खाकर लड़खड़ाने का अतिरिक्त अर्थ जोड़े।
- source_word: בָּאֶבֶן
  choice: किसी पत्थर से
  rationale: בְּ यहाँ संपर्क के लक्ष्य को दर्शाता है। संदर्भ में אֶבֶן अनिश्चित है, इसलिए हिंदी में ‘किसी पत्थर से’ स्वाभाविक है।
- source_word: רַגְלֶךָ
  choice: तेरा पैर
  rationale: मूल में संज्ञा एकवचन है और उसके साथ द्वितीय पुरुष पुल्लिंग एकवचन प्रत्यय है; हिंदी मुहावरे में भी एकवचन स्वाभाविक है।
theological_decisions:
- issue: परंपरागत धार्मिक भाषा और स्रोत-आधारित आधुनिक हिंदी के बीच चयन
  choice: वे तुझे अपनी हथेलियों पर उठा लेंगे
  alternative: वे तुझे अपने हाथों पर संभाल लेंगे
  rationale: चुना हुआ पाठ इब्रानी के स्थानगत बिंब—हथेलियों पर—को बनाए रखते हुए सामान्य आधुनिक हिंदी में सुरक्षा का भाव व्यक्त करता है और किसी विशिष्ट व्याख्यात्मक परंपरा को नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिंदी; संबोधन का एकवचन ‘तू’ रूप भजन की काव्यात्मक और निकट शैली के अनुरूप है। भाषा सरल, गरिमापूर्ण और स्रोत के बिंब के निकट रखी गई है।
