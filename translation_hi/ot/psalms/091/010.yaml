  yaml_path: translation/ot/psalms/091/010.yaml
  text: No harm will happen to you[b][a], and no plague will come near your tent.
translation:
  language: hi
  text: तुम पर कोई विपत्ति नहीं आएगी[a], और कोई महामारी तुम्हारे तंबू[b] के निकट नहीं आएगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम पर कोई अनिष्ट नहीं आएगा।”
    reason: lexical_alternative
  - marker: b
    text: या, “निवास”; “तंबू” यहाँ घर या परिवार के निवास का व्यापक बोध भी दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: תְאֻנֶּה
  choice: नहीं आएगी
  rationale: यह क्रिया किसी घटना के किसी पर आ पड़ने या घटित होने का भाव देती है। ‘नहीं आएगी’ आधुनिक हिन्दी में स्वाभाविक है और आनेवाली विपत्ति की दिशा भी बनाए रखती है।
- source_word: רָעָה
  choice: विपत्ति
  rationale: इस सुरक्षा-संबंधी प्रसंग में यह शब्द नैतिक बुराई तक सीमित नहीं, बल्कि हानि, अनिष्ट या संकट का भी बोध कराता है। ‘विपत्ति’ इस व्यापक प्रतिकूल अर्थ को सहज हिन्दी में व्यक्त करती है।
- source_word: נֶגַע
  choice: महामारी
  rationale: यह शब्द किसी प्रहार, पीड़ादायक प्रकोप या रोगजनित विपत्ति को सूचित कर सकता है। भजन 91 में घातक रोग और संकट की पृष्ठभूमि के कारण ‘महामारी’ प्रसंगानुकूल है, जबकि शब्द की व्यापकता अनुवाद-टिप्पणी की आवश्यकता के बिना पद के काव्यात्मक समानांतर में बनी रहती है।
- source_word: יִקְרַב
  choice: पास नहीं फटकेगी
  rationale: मूल क्रिया निकट आने का स्थानिक चित्र प्रस्तुत करती है। ‘पास नहीं फटकेगी’ हिन्दी का स्वाभाविक और प्रभावी निषेधात्मक मुहावरा है, जो उसी चित्र को बनाए रखता है।
- source_word: אָהֳלֶךָ
  choice: तुम्हारे तंबू
  rationale: मूल शब्द का ठोस अर्थ ‘तंबू’ है। मुख्य पाठ में इस काव्यात्मक चित्र को रखा गया है; इसका व्यापक अर्थ घर या निवास भी हो सकता है।
- source_word: אֵלֶיךָ
  choice: तुम पर
  rationale: यह संबंधवाचक रूप विपत्ति के सम्बोधित व्यक्ति तक पहुँचने या उस पर आ पड़ने की दिशा दिखाता है। ‘तुम पर’ हिन्दी में ‘विपत्ति आने’ के साथ स्वाभाविक है।
theological_decisions:
- issue: प्रतिज्ञात सुरक्षा का स्वरूप
  choice: पद को परमेश्वर की सुरक्षा की सीधी और काव्यात्मक प्रतिज्ञा के रूप में अनूदित किया गया है, बिना उसके दावे को घटाए या बढ़ाए।
  alternative: इसे इस व्याख्यात्मक विस्तार के साथ प्रस्तुत करना कि विश्वासयोग्य व्यक्ति को हर परिस्थिति में कोई भी शारीरिक दुःख कभी नहीं होगा।
  rationale: इब्रानी पाठ प्रतिज्ञा को प्रबल और निरपेक्ष काव्यात्मक भाषा में कहता है, पर इस एक पद में दुःख और परमेश्वर के विधान से जुड़े सभी व्यापक धर्मवैज्ञानिक प्रश्नों का स्पष्टीकरण नहीं देता। इसलिए अनुवाद उसी तनाव को खुला रखता है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी अपनाई गई है। ‘तंबू’ मूल के ठोस काव्यात्मक बिंब को सुरक्षित रखता है, जबकि ‘पास नहीं फटकेगी’ सामान्य पाठक के लिए स्वाभाविक ढंग से निकट न आने का अर्थ देता है।
