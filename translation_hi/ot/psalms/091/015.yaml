  text: יִקְרָאֵ֨/נִי וְֽ/אֶעֱנֵ֗/הוּ עִמּֽ/וֹ אָנֹכִ֥י בְ/צָרָ֑ה אֲ֝חַלְּצֵ֗/הוּ וַֽ/אֲכַבְּדֵֽ/הוּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/091/015.yaml
  text: He will call on me[a], and I will answer him; I am with him in trouble[b]; I will rescue him and honor him.
translation:
  language: hi
  text: वह मुझे पुकारेगा, और मैं उसे उत्तर दूँगा; संकट में मैं उसके साथ हूँ; मैं उसे छुड़ाऊँगा और उसे सम्मानित करूँगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יִקְרָאֵנִי
  choice: वह मुझे पुकारेगा
  rationale: קרא के साथ प्रथम पुरुष कर्म-प्रत्यय यहाँ प्रार्थना में परमेश्वर को पुकारने का भाव देता है। ‘मुझे पुकारेगा’ आधुनिक हिन्दी में स्वाभाविक और सीधा है।
- source_word: וְאֶעֱנֵהוּ
  choice: और मैं उसे उत्तर दूँगा
  rationale: ענה का अर्थ यहाँ पुकार का उत्तर देना है; यह हिन्दी में समानांतर क्रिया को स्पष्ट रखता है।
- source_word: עִמּוֹ אָנֹכִי בְצָרָה
  choice: संकट में मैं उसके साथ रहूँगा
  rationale: हिब्रू शब्दक्रम में ‘उसके साथ’ पर बल है। हिन्दी में ‘संकट में’ को आगे रखकर परिस्थिति उभरती है और परमेश्वर की साथ रहने की प्रतिज्ञा स्वाभाविक ढंग से व्यक्त होती है।
- source_word: אֲחַלְּצֵהוּ
  choice: मैं उसे छुड़ाऊँगा
  rationale: חלץ के पिएल रूप में खतरे या संकट से निकालने और बचाने का अर्थ है। ‘छुड़ाऊँगा’ सक्रिय मुक्ति को संक्षेप में व्यक्त करता है।
- source_word: וַאֲכַבְּדֵהוּ
  choice: और उसका सम्मान करूँगा
  rationale: כבד के पिएल का यहाँ अर्थ व्यक्ति को आदर या प्रतिष्ठा देना है। ‘सम्मान करूँगा’ ‘महिमा दूँगा’ की तुलना में आधुनिक हिन्दी में अधिक स्वाभाविक है और अनावश्यक धर्मवैज्ञानिक भ्रम से बचता है।
theological_decisions:
- issue: ईश्वरीय प्रतिज्ञाओं के क्रम को बिना अतिरिक्त शर्त जोड़े प्रस्तुत करना
  choice: पुकार, उत्तर, उपस्थिति, छुटकारा और सम्मान का सीधा क्रम
  alternative: पद में स्पष्ट रूप से पूर्व विश्वासयोग्यता की शर्त जोड़ना
  rationale: हिब्रू इस पद में कोई अतिरिक्त शर्त व्यक्त नहीं करता। इसलिए अनुवाद प्रतिज्ञाओं को ज्यों का त्यों रखता है और बाहरी धर्मवैज्ञानिक योग्यता नहीं जोड़ता।
- issue: עִמּוֹ אָנֹכִי में वर्तमान कथन और प्रतिज्ञात्मक संदर्भ
  choice: मैं उसके साथ रहूँगा
  alternative: मैं उसके साथ हूँ
  rationale: हिब्रू में नाममात्र वाक्य शाब्दिक रूप से वर्तमान उपस्थिति व्यक्त कर सकता है, जबकि आसपास की भविष्यसूचक क्रियाओं के बीच हिन्दी का भविष्यकाल प्रतिज्ञा के प्रवाह में स्वाभाविक है। अर्थतः परमेश्वर की संकट में उपस्थिति सुरक्षित रहती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य। ‘संकट’, ‘छुड़ाऊँगा’ और ‘सम्मान’ सामान्य पाठक के लिए स्पष्ट हैं। पद में कोई पादटिप्पणी आवश्यक नहीं मानी गई, क्योंकि वास्तविक अर्थ-भेद मुख्य पाठ में पर्याप्त रूप से व्यक्त है।
