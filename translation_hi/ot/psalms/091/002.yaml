  yaml_path: translation/ot/psalms/091/002.yaml
  text: I say to Yahweh[a], “My refuge and my fortress, my God, in whom I trust.”
translation:
  language: hi
  text: मैं यहोवा के विषय में कहता हूँ, “वह मेरा शरणस्थान और मेरा गढ़ है, मेरा परमेश्वर है; मैं उस पर भरोसा रखता हूँ।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या: “मैं यहोवा से कहता हूँ, ‘मेरा शरणस्थान और मेरा गढ़, मेरा परमेश्वर, जिस पर मैं भरोसा रखता हूँ।’”'
    reason: इब्रानी לַיהוָה का अर्थ ‘यहोवा के विषय में’ अथवा ‘यहोवा से’ हो सकता है। मुख्य पाठ में ‘यहोवा के विषय में’ लिया गया है, क्योंकि आगे का बּוֹ (‘उस पर’) तृतीय पुरुष है; ‘यहोवा से’ वाला अर्थ संभव वैकल्पिक वाचन के रूप में रखा गया है।
lexical_decisions:
- source_word: אֹמַר
  choice: मैं ... कहता हूँ
  rationale: אמר का क़ाल अपूर्ण, प्रथम पुरुष एकवचन, यहाँ वर्तमानकालीन विश्वास-घोषणा के रूप में स्वाभाविक है; ‘मैं कहूँगा’ भी व्याकरणतः संभव है।
- source_word: לַיהוָה
  choice: यहोवा से
  rationale: ל को यहाँ कथन के संबोधित व्यक्ति को चिह्नित करने वाला माना गया है। ‘यहोवा के विषय में’ भी संभव है और उसे पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: יהוה
  choice: यहोवा
  rationale: परमेश्वर के विशिष्ट वाचा-नाम YHWH को नाम के रूप में प्रस्तुत किया गया है, न कि सामान्य उपाधि से बदला गया है।
- source_word: מַחְסִי
  choice: मेरा शरणस्थान
  rationale: מַחְסֶה सुरक्षा पाने के स्थान को दर्शाता है; ‘शरणस्थान’ स्पष्ट और काव्यात्मक दोनों है।
- source_word: וּמְצוּדָתִי
  choice: और मेरा गढ़
  rationale: מְצוּדָה का दुर्ग अथवा सुरक्षित गढ़ वाला रक्षात्मक बिंब संक्षेप में बना रहता है।
- source_word: אֱלֹהַי
  choice: मेरा परमेश्वर
  rationale: प्रथम पुरुष एकवचन संबंधसूचक प्रत्यय की व्यक्तिगत स्वीकारोक्ति सीधे सुरक्षित है।
- source_word: אֶבְטַח בּוֹ
  choice: जिस पर मैं भरोसा रखता हूँ
  rationale: בטח ב निर्भरता और विश्वास व्यक्त करता है। संबंधवाचक रचना निकटवर्ती ‘मेरा परमेश्वर’ से इसे स्वाभाविक रूप से जोड़ती है और मूल के तीसरे पुरुष संकेत को बनाए रखती है।
theological_decisions:
- issue: יהוה परमेश्वर के नाम का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल में विशिष्ट नाम YHWH है। ‘यहोवा’ हिन्दी पाठक के लिए पहचाना हुआ नामरूप है और नाम को केवल उपाधि में नहीं बदलता।
- issue: לַיהוָה का संबंध
  choice: यहोवा से कहना
  alternative: यहोवा के विषय में कहना
  rationale: ל संबोधन के प्राप्तकर्ता को चिह्नित कर सकता है, जबकि विषय-सूचक अर्थ भी संभव है। मुख्य पाठ में संबोधन लिया गया है और वैकल्पिक व्याख्या पादटिप्पणी में दी गई है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘शरणस्थान’ और ‘गढ़’ भजन की सुरक्षा-संबंधी समानांतर काव्य-छवियों को बनाए रखते हैं। मुख्य वाक्य की संक्षिप्त नाममात्र शैली मूल इब्रानी की काव्यात्मक अभिव्यक्ति के निकट है।
