  text: כִּ֤י בִ֣/י חָ֭שַׁק וַ/אֲפַלְּטֵ֑/הוּ אֲ֝שַׂגְּבֵ֗/הוּ כִּֽי יָדַ֥ע שְׁמִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/091/014.yaml
  text: Because he clings to me[a], I will rescue him; I will set him securely on high[b], because he knows my name.
translation:
  language: hi
  text: क्योंकि वह मुझसे दृढ़ता से जुड़ा है[a], इसलिए मैं उसे छुड़ाऊँगा; मैं उसे सुरक्षित ऊँचे स्थान पर रखूँगा[b], क्योंकि वह मेरा नाम जानता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “क्योंकि वह मुझसे प्रेम करता है” अथवा “क्योंकि उसने मुझ पर अपना स्नेह लगाया है।” इब्रानी क्रिया गहरे लगाव और दृढ़ता से जुड़े रहने का भाव देती है।
    reason: lexical_alternative
  - marker: b
    text: या “मैं उसे ऊँचे स्थान पर रखूँगा” अथवा “मैं उसकी रक्षा करूँगा।” इब्रानी क्रिया किसी को ऊँचे, सुरक्षित और पहुँच से बाहर स्थान पर रखने का भाव देती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि / इसलिए
  rationale: पहला כִּי परमेश्वर के कार्य का कारण बताता है; हिन्दी में सहसंबंध स्पष्ट और स्वाभाविक करने के लिए ‘क्योंकि… इसलिए’ रखा गया है। दूसरे כִּי का अनुवाद ‘क्योंकि’ है।
- source_word: בִי חָשַׁק
  choice: वह मुझसे लिपटा रहता है
  rationale: חָשַׁק गहरे लगाव और दृढ़ता से जुड़े रहने का भाव देता है। ‘लिपटा रहता है’ इस संबंधपरक और निरंतर आसक्ति को बनाए रखता है, जबकि केवल ‘प्रेम करता है’ अर्थ को कुछ संकीर्ण कर सकता है।
- source_word: וַאֲפַלְּטֵהוּ
  choice: मैं उसे छुड़ाऊँगा
  rationale: क्रिया संकट से निकालने या बचाने की प्रतिज्ञा व्यक्त करती है। ‘छुड़ाऊँगा’ आधुनिक हिन्दी में स्पष्ट है और दैवी उद्धार की क्रिया को सीधे व्यक्त करता है।
- source_word: אֲשַׂגְּבֵהוּ
  choice: मैं उसे सुरक्षित ऊँचे स्थान पर रखूँगा
  rationale: שׂגב में किसी को पहुँच से बाहर ऊँचाई पर रखकर सुरक्षित करने का चित्र है। यह अनुवाद ऊँचाई के रूपक और सुरक्षा के आशय दोनों को बनाए रखता है।
- source_word: יָדַע שְׁמִי
  choice: वह मेरा नाम जानता है
  rationale: शाब्दिक अभिव्यक्ति को बनाए रखते हुए ‘जानता है’ व्यक्तिगत और संबंधपरक ज्ञान के लिए पर्याप्त खुला है; इसे ‘स्वीकार करता है’ जैसे अधिक व्याख्यात्मक रूप में नहीं बदला गया।
theological_decisions:
- issue: परमेश्वर से गहरे लगाव की वाचाई-संबंधपरक भाषा
  choice: ‘वह मुझसे लिपटा रहता है’
  alternative: ‘वह मुझसे प्रेम करता है’ / ‘उसने मुझ पर अपना प्रेम लगाया है’
  rationale: चुना हुआ रूप इब्रानी के प्रबल लगाव और दृढ़ता से जुड़े रहने के भाव को सुरक्षित रखता है, बिना इसे केवल भावना तक सीमित किए।
- issue: אֲשַׂגְּבֵהוּ में सुरक्षा का ऊँचाई-संबंधी रूपक
  choice: ‘मैं उसे सुरक्षित ऊँचे स्थान पर रखूँगा’
  alternative: ‘मैं उसकी रक्षा करूँगा’ / ‘मैं उसे ऊँचा करूँगा’
  rationale: मूल पाठ सुरक्षा को अगम्य ऊँचाई के चित्र से व्यक्त करता है। चुना हुआ अनुवाद इस काव्यात्मक रूपक को सपाट किए बिना उसका सुरक्षात्मक आशय स्पष्ट करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज और काव्यात्मक भाषा। ‘लिपटा रहता है’ को शारीरिक अर्थ तक सीमित न होकर गहरे, स्थायी लगाव के मुहावरे के रूप में चुना गया है। दोनों पादों की कारण-प्रतिज्ञा संरचना स्पष्ट रखी गई है।
