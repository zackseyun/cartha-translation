  text: Hide me from the secret counsel of evildoers[b][a], from the tumult of workers of wickedness.
translation:
  language: hi
  text: 'मुझे बुराई करनेवालों की गुप्त मंत्रणा[a] से,

    कुकर्म करनेवालों की हलचल[b] से छिपा रख।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बुराई करनेवालों के गुप्त षड्यंत्र से।” इब्रानी סוֹד का अर्थ गोपनीय मंत्रणा, निकट मंडली, या गुप्त योजना हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “कुकर्म करनेवालों की उत्तेजित भीड़ से” अथवा “उनके कोलाहल से।” इब्रानी רִגְשָׁה शत्रुतापूर्ण हलचल, जमाव, या कोलाहल का संकेत देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּסְתִּירֵנִי
  choice: मुझे … छिपा रख
  rationale: सתר के हिफ़ील रूप और प्रथम पुरुष एकवचन प्रत्यय का अर्थ ‘मुझे छिपा/ओट में रख’ है। संदर्भ में यह परमेश्वर से सीधी विनती है, इसलिए हिंदी में आज्ञार्थक-विनयात्मक ‘छिपा रख’ स्वाभाविक है।
- source_word: מִסּוֹד
  choice: गुप्त मंत्रणा से
  rationale: סוֹד गोपनीय विचार-विमर्श, निकट मंडली या गुप्त योजना को सूचित कर सकता है। ‘गुप्त मंत्रणा’ इसकी गोपनीयता और सामूहिक विचार-विमर्श—दोनों को बनाए रखती है।
- source_word: מְרֵעִים
  choice: बुराई करनेवालों
  rationale: רעע का कृदंत उन लोगों को दर्शाता है जो बुराई करते हैं। यह सक्रिय अर्थ को सरल, आधुनिक हिंदी में व्यक्त करता है।
- source_word: מֵרִגְשַׁת
  choice: उपद्रव से
  rationale: רִגְשָׁה में उत्तेजित जमाव, हलचल और शत्रुतापूर्ण कोलाहल का भाव है। ‘उपद्रव’ संदर्भानुकूल खतरे और उथल-पुथल को व्यक्त करता है, जबकि वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित हैं।
- source_word: פֹּעֲלֵי אָוֶן
  choice: अनर्थ करनेवालों
  rationale: यह रचना शाब्दिक रूप से אָוֶן को करने या रचनेवालों को दर्शाती है। ‘अनर्थ करनेवाले’ सक्रिय और अभ्यस्त दुष्कर्म का भाव रखता है तथा पहली पंक्ति की शब्दावली को केवल दोहराता नहीं।
