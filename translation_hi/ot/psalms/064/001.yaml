  text: שְׁמַע אֱלֹהִ֣ים קוֹלִ֣/י בְ/שִׂיחִ֑/י מִ/פַּ֥חַד א֝וֹיֵ֗ב תִּצֹּ֥ר חַיָּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/064/001.yaml
  text: Hear[a], O God, my voice in my complaint; preserve my life from the fear of the enemy.
translation:
  language: hi
  text: हे परमेश्वर, मेरी शिकायत में मेरी आवाज़ सुन[a]; शत्रु के भय से मेरे जीवन की रक्षा कर।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मेरे मनन में” अथवा “मेरे मन के विचार में।” हिब्रू शब्द भीतर के चिंतन के साथ-साथ बोली गई शिकायत या विलाप को भी सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמַע
  choice: सुन
  rationale: यह परमेश्वर को संबोधित एकवचन आज्ञार्थक क्रिया है। हिंदी प्रार्थना में ‘सुन’ सीधा, स्वाभाविक और गरिमापूर्ण है।
- source_word: אֱלֹהִים
  choice: हे परमेश्वर
  rationale: यह सीधे संबोधन में प्रयुक्त है। ‘हे परमेश्वर’ आधुनिक हिंदी की प्रार्थना-शैली में स्वाभाविक संबोधन है।
- source_word: קוֹלִי
  choice: मेरी आवाज़
  rationale: हिब्रू का ठोस बिंब बनाए रखता है और इसे केवल ‘मुझे’ या ‘मेरी प्रार्थना’ में नहीं समेटता।
- source_word: בְשִׂיחִי
  choice: मेरी विनती में
  rationale: שִׂיחַ मनन, मन की बात, विलाप या शिकायत का अर्थ दे सकता है। शत्रु से रक्षा की याचना के संदर्भ में ‘विनती’ प्रार्थनापूर्ण विलाप को स्वाभाविक हिंदी में व्यक्त करती है, जबकि पादटिप्पणी मूल की अस्पष्टता बचाती है।
- source_word: מִפַּחַד
  choice: के भय से
  rationale: פַּחַד भय, दहशत या आतंक को सूचित करता है। ‘भय’ सीधा और संदर्भानुकूल हिंदी पर्याय है।
- source_word: אוֹיֵב
  choice: शत्रु
  rationale: मूल में एकवचन है; ‘शत्रु’ उस रूप को बनाए रखते हुए सामूहिक या सामान्य अर्थ की संभावना भी खुली रखता है।
- source_word: תִּצֹּר
  choice: रक्षा कर
  rationale: נצר का अर्थ संभालना, पहरा देना या सुरक्षित रखना है। ‘मेरे जीवन की रक्षा कर’ हिंदी में स्वाभाविक और अर्थतः निकट है।
- source_word: חַיָּי
  choice: मेरे जीवन
  rationale: शाब्दिक रूप बहुवचनाकार होते हुए भी यहाँ व्यक्ति के जीवन का बोध देता है। हिंदी में एकवचन ‘जीवन’ स्वाभाविक है और ‘प्राण’ या ‘आत्मा’ जैसी अतिरिक्त व्याख्या से बचता है।
theological_decisions:
- issue: בְשִׂיחִי का अर्थ
  choice: मेरी विनती में
  alternative: मेरे मनन में; मेरी शिकायत में; मेरे विलाप में
  rationale: शत्रु से रक्षा की पुकार होने के कारण प्रार्थनापूर्ण विलाप का भाव संदर्भ से मेल खाता है। फिर भी शब्द भीतर के मनन और बोली गई शिकायत दोनों को सूचित कर सकता है, इसलिए पादटिप्पणी में विकल्प सुरक्षित रखे गए हैं।
translation_notes:
  register: आधुनिक मानक हिंदी में संक्षिप्त, सीधे और गरिमापूर्ण प्रार्थना-रजिस्टर का प्रयोग किया गया है। ‘मेरी आवाज़’ मूल के ठोस कथन को बनाए रखता है; ‘विनती’ सहज हिंदी देती है और पादटिप्पणी वास्तविक अर्थगत अस्पष्टता को स्पष्ट करती है।
