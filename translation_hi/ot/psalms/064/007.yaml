  yaml_path: translation/ot/psalms/064/007.yaml
  text: But God shoots an arrow at them[a]; suddenly they are wounded.
translation:
  language: hi
  text: परन्तु परमेश्वर उन पर तीर चलाता है[a]; अचानक वे घायल हो जाते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या अधिक शब्दशः, “परन्तु परमेश्वर ने उन पर तीर चलाया; अचानक उनके घाव हुए।”
    reason: इब्रानी की कालगत और संज्ञात्मक संरचना का अधिक औपचारिक विकल्प।
lexical_decisions:
- source_word: וַיֹּרֵם
  choice: उन पर तीर चलाता है
  rationale: यह ירה के हिफ़ील रूप के साथ तृतीय पुरुष बहुवचन प्रत्यय है। यहाँ परमेश्वर कर्ता और ‘तीर’ कर्म है; वर्तमान काल काव्यात्मक वर्णन को सजीव रखता है।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: इस प्रसंग में यह एकवचन अर्थ में इस्राएल के परमेश्वर को दर्शाता है; हिन्दी बाइबलीय शैली में ‘परमेश्वर’ स्वाभाविक और प्रतिष्ठित रूप है।
- source_word: חֵץ
  choice: तीर
  rationale: मूल शब्द का सीधा और सामान्य अर्थ ‘तीर’ है।
- source_word: פִּתְאֹם
  choice: अचानक
  rationale: यह दैवी न्याय के सहसा और अप्रत्याशित रूप से आने पर बल देता है।
- source_word: הָיוּ מַכּוֹתָם
  choice: वे घायल हो जाते हैं
  rationale: शब्दशः संरचना ‘उनके घाव हुए’ के निकट है, पर हिन्दी में परिणामसूचक भाव को ‘वे घायल हो जाते हैं’ अधिक स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: काव्यात्मक चित्र में दैवी न्याय
  choice: परमेश्वर को दुष्टों पर तीर चलाने वाले सक्रिय कर्ता के रूप में स्पष्ट रखा गया है।
  alternative: चित्र को केवल परिस्थितियों के उलट जाने या अस्पष्ट दैवी विधान के रूप में नरम करना।
  rationale: इब्रानी पाठ में परमेश्वर स्पष्ट कर्ता है और तीर दंड का काव्यात्मक साधन; अनुवाद इस सक्रियता को न तो कम करता है, न इसमें बाद की कोई धर्मसैद्धांतिक व्याख्या जोड़ता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘परन्तु’ काव्य में विरोध को स्पष्ट करता है; मुख्य पाठ में सजीव वर्तमान काल और स्वाभाविक हिन्दी परिणामसूचक वाक्य-विन्यास अपनाया गया है।
