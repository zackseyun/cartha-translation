translation:
  language: hi
  text: छिपे स्थानों से निर्दोष पर तीर चलाने के लिए वे अचानक उस पर तीर चलाते हैं और डरते नहीं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִירוֹת
  choice: तीर चलाएँ
  rationale: शत्रुतापूर्ण संदर्भ में ירה का अर्थ ‘चलाना/मारना’ है। हिन्दी में केवल ‘गोली चलाना’ का आधुनिक अर्थ उभर सकता है, इसलिए काव्यगत प्राचीन संदर्भ स्पष्ट करने के लिए ‘तीर चलाना’ स्वाभाविक है।
- source_word: בַּמִּסְתָּרִים
  choice: छिपने के स्थानों से
  rationale: शब्द छिपे या गुप्त स्थानों को दर्शाता है। उपसर्ग का शाब्दिक अर्थ ‘में’ है, पर घात लगाकर आक्रमण करने के प्रसंग में हिन्दी में ‘से’ अधिक स्वाभाविक है।
- source_word: תָּם
  choice: निर्दोष
  rationale: תָּם नैतिक खराई अथवा दोषरहित होने का भाव दे सकता है। ‘निर्दोष’ इस प्रसंग में स्वाभाविक है, जबकि ‘खरा’ वैकल्पिक नैतिक अर्थ को व्यक्त करता है।
- source_word: פִּתְאֹם
  choice: अचानक
  rationale: यह आक्रमण की आकस्मिकता को सीधे और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: יֹרֻהוּ
  choice: वे उस पर तीर चलाते हैं
  rationale: एकवचन कर्म-प्रत्यय पहले आए प्रतिनिधिक एकवचन תָּם की ओर लौटता है। ‘उस पर’ आक्रमण की दिशा बताता है, बिना यह निश्चित किए कि तीर लगा ही था।
- source_word: וְלֹא יִירָאוּ
  choice: और डरते नहीं
  rationale: मूल में भय का कोई स्पष्ट कर्म नहीं है; इसलिए हिन्दी में भी संक्षिप्तता और अस्पष्टता सुरक्षित रखी गई है।
