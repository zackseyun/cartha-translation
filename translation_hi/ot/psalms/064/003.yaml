source:
  edition: WLC
  text: אֲשֶׁ֤ר שָׁנְנ֣וּ כַ/חֶ֣רֶב לְשׁוֹנָ֑/ם דָּרְכ֥וּ חִ֝צָּ֗/ם דָּבָ֥ר מָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/064/003.yaml
  text: who sharpen their tongue like a sword; they bend their arrow—a bitter word—
translation:
  language: hi
  text: 'जो अपनी जीभ को तलवार के समान तेज़ करते हैं;

    वे अपना तीर चढ़ाते हैं—एक कड़वा वचन—'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׁנְנוּ
  choice: तेज़ करते हैं
  rationale: क्रिया का मूल अर्थ धार तेज़ करना है; तलवार के रूपक के साथ यह स्वाभाविक और सटीक है।
- source_word: לְשׁוֹנָם
  choice: अपनी जीभ को
  rationale: मूल के एकवचन सामूहिक रूप को हिन्दी में स्वाभाविक ढंग से रखा गया है।
- source_word: דָּרְכוּ
  choice: चढ़ाते हैं
  rationale: धनुष को तानने/तैयार करने की क्रिया यहाँ प्रत्यययुक्त 'उनका तीर' के साथ आती है; हिन्दी में 'तीर चढ़ाना' युद्ध-तैयारी के बिंब को स्वाभाविक रूप से व्यक्त करता है, बिना इसे केवल 'निशाना लगाना' बना देने के।
- source_word: חִצָּם
  choice: अपना तीर
  rationale: मसोराई पाठ का एकवचन प्रत्यययुक्त रूप 'उनका तीर' है; हिन्दी में कर्ता से मेल खाते हुए 'अपना तीर' स्वाभाविक है।
- source_word: דָּבָר מָר
  choice: एक कड़वा वचन
  rationale: דָּבָר यहाँ बोली गई बात/वचन है और מָר उसकी हानिकारक कटुता दर्शाता है; इसे तीर के समानांतर रखकर मूल रूपक सुरक्षित रहता है।
theological_decisions:
- issue: तीर और कड़वे वचन का संबंध
  choice: डैशों के बीच 'एक कड़वा वचन' रखकर उसे तीर का रूपकात्मक स्पष्टीकरण बनाया गया है।
  alternative: '''कड़वे वचन को तीर की तरह'' या ''कड़वे वचन के तीर'''
  rationale: मूल की संक्षिप्त, काव्यात्मक संरचना में संबंध स्पष्टतः चिह्नित नहीं है। डैश रूपक को समझने योग्य बनाते हैं, पर व्याकरणिक संबंध को आवश्यकता से अधिक निश्चित नहीं करते।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और काव्यात्मक हिन्दी। समानांतरता तथा तलवार–तीर का हिंसक वाणी-बिंब बनाए रखा गया है।
