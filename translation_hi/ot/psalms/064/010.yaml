base_translation:
  language: en
  yaml_path: translation/ot/psalms/064/010.yaml
  text: The righteous will rejoice in Yahweh and take refuge in him[a], and all the upright in heart will glory.
translation:
  language: hi
  text: धर्मी जन याहवे में आनन्दित होगा और उसकी शरण लेगा; और मन के सभी सीधे लोग बड़ाई करेंगे[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘आनन्द से झूमेंगे।’ इब्रानी क्रिया ‘बड़ाई करने’ अथवा उल्लसित होने का अर्थ दे सकती है; यहाँ भाव याहवे और उसके उद्धार के कारण होने वाले सकारात्मक आनन्द का है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׂמַח
  choice: आनन्दित होगा
  rationale: अपूर्ण क्रिया को भजन के निष्कर्ष में अपेक्षित भावी परिणाम के रूप में रखा गया है; यह चुनाव उल्लास के सकारात्मक भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: צַדִּיק
  choice: धर्मी जन
  rationale: एकवचन विशेषण यहाँ संज्ञा के रूप में प्रयुक्त है। ‘धर्मी जन’ उसके प्रतिनिधिक एकवचन को बनाए रखते हुए आधुनिक हिन्दी में स्वाभाविक है।
- source_word: בַּיהוָה
  choice: याहवे में
  rationale: בְּ आनन्द के आधार अथवा केन्द्र को दर्शाता है, और יהוה को उसके व्यक्तिगत वाचा-नाम ‘याहवे’ के रूप में लिप्यंतरित किया गया है।
- source_word: וְחָסָה בּוֹ
  choice: और उसकी शरण लेगा
  rationale: חסה सुरक्षा के लिए शरण लेने का चित्र प्रस्तुत करता है; ‘शरण लेगा’ केवल ‘भरोसा करेगा’ की अपेक्षा इस रूपक को अधिक स्पष्टता से सुरक्षित रखता है।
- source_word: וְיִתְהַלְלוּ
  choice: और … गर्व करेंगे
  rationale: הלל का हित्पएल रूप यहाँ सकारात्मक अर्थ में गर्व करने, इतराने अथवा उल्लसित होने को व्यक्त कर सकता है। ‘गर्व करेंगे’ मूल क्रिया की साहसपूर्ण अभिव्यक्ति और कुछ हद तक उसकी अर्थगत व्यापकता बनाए रखता है।
- source_word: כָּל יִשְׁרֵי לֵב
  choice: सभी सीधे मनवाले
  rationale: यह उन लोगों के लिए इब्रानी मुहावरा है जिनकी भीतरी प्रवृत्ति खरी और सीधी है। यह हिन्दी अभिव्यक्ति ‘हृदय’ के रूपक को सहज ‘मन’ के द्वारा संप्रेषित करती है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में चतुरक्षरीय व्यक्तिगत नाम सीधे आया है; ‘याहवे’ उसे किसी उपाधि से बदलने के बजाय वाचा-नाम के रूप में प्रस्तुत करता है।
- issue: וְיִתְהַלְלוּ के सकारात्मक धार्मिक अर्थ की प्रस्तुति
  choice: गर्व करेंगे
  alternative: आनन्द से झूमेंगे / बड़ाई करेंगे
  rationale: क्रिया में गर्व या उल्लास दोनों की छाया हो सकती है। मुख्य पाठ ‘गर्व’ के निकट अर्थ को रखता है, जबकि पादटिप्पणी स्पष्ट करती है कि सन्दर्भ में यह आत्म-अभिमान नहीं, परमेश्वर के उद्धार के कारण सकारात्मक उल्लास है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। काव्यात्मक समानता को अर्धविराम से दिखाया गया है। ‘धर्मी जन’ एकवचन और ‘सभी सीधे मनवाले’ बहुवचन के बीच मूल इब्रानी का व्याकरणिक अंतर बनाए रखते हैं।
