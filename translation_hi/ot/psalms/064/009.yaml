source:
  edition: WLC
  text: וַ/יִּֽירְא֗וּ כָּל אָ֫דָ֥ם וַ֭/יַּגִּידוּ פֹּ֥עַל אֱלֹהִ֗ים וּֽ/מַעֲשֵׂ֥/הוּ הִשְׂכִּֽילוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/064/009.yaml
  text: Then all mankind will fear[a], and they will declare the work of God; they will understand what he has done.
translation:
  language: hi
  text: तब सभी लोग भय मानेंगे[a] और परमेश्वर के कार्य का वर्णन करेंगे; वे उसके किए हुए काम को समझेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “डरेंगे।” इब्रानी क्रिया में भय के साथ श्रद्धामिश्रित विस्मय का भाव भी हो सकता है। “सभी लोग” का शाब्दिक रूप “हर आदम” है, जो यहाँ समस्त मानवता के लिए सामूहिक पद है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּירְאוּ
  choice: डरेंगे
  rationale: मूल ירא भय और श्रद्धामिश्रित विस्मय—दोनों व्यक्त कर सकता है। न्याय के इस प्रसंग में ‘डरेंगे’ स्वाभाविक है और भय की तीव्रता बनाए रखता है; काव्यगत क्रम के अनुसार भविष्यकाल रखा गया है।
- source_word: כָּל אָדָם
  choice: सब मनुष्य
  rationale: אָדָם यहाँ किसी एक पुरुष का नहीं, समस्त मानव-समुदाय का सामूहिक बोध कराता है। ‘सब मनुष्य’ आधुनिक हिंदी में व्यापक मानवीय अर्थ स्पष्ट करता है।
- source_word: וַיַּגִּידוּ
  choice: बखान करेंगे
  rationale: Hiphil נגד का अर्थ बताना, घोषित करना या प्रकट करना है। ‘बखान करेंगे’ यहाँ परमेश्वर के कार्य को सार्वजनिक रूप से सुनाने का काव्यात्मक भाव देता है।
- source_word: פֹּעַל אֱלֹהִים
  choice: परमेश्वर के कार्य
  rationale: פֹּעַל किसी किए हुए काम या प्रभावी कार्य को दर्शाता है। यह पदबंध संदर्भ में परमेश्वर के न्यायपूर्ण हस्तक्षेप को बिना अनावश्यक रूप से सीमित किए व्यक्त करता है।
- source_word: וּמַעֲשֵׂהוּ
  choice: जो उसने किया है
  rationale: शाब्दिक अर्थ ‘उसका कार्य’ है। पिछले पदबंध में आए ‘कार्य’ की अस्वाभाविक पुनरावृत्ति से बचते हुए यह उसके किए हुए काम का ठोस अर्थ बनाए रखता है।
- source_word: הִשְׂכִּילוּ
  choice: समझेंगे
  rationale: שׂכל के Hiphil रूप में समझना, अंतर्दृष्टि पाना या बुद्धिमानी से विचार करना संभव है। परमेश्वर का किया हुआ कार्य इसका विषय होने के कारण यहाँ बोध या अंतर्दृष्टि प्रमुख है।
theological_decisions:
- issue: אָדָם का सामान्य मानवता-सूचक अर्थ
  choice: सब मनुष्य
  alternative: हर मनुष्य / सारी मानवजाति
  rationale: यद्यपि इब्रानी पद व्याकरणतः एकवचन है, यहाँ उसका प्रयोग सामूहिक रूप से सभी मनुष्यों के लिए हुआ है। अनुवाद किसी केवल-पुरुष संदर्भ का संकेत नहीं देता।
- issue: ירא में भय और श्रद्धामिश्रित विस्मय का संबंध
  choice: डरेंगे
  alternative: भय मानेंगे / विस्मित होंगे
  rationale: दैवी न्याय के संदर्भ में वास्तविक भय प्रमुख है, फिर भी मूल क्रिया में श्रद्धामिश्रित विस्मय की छाया संभव है; टिप्पणी में इस अर्थ-विस्तार को सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी, सहज किंतु गरिमापूर्ण काव्यात्मक शैली। ‘बखान करेंगे’ सार्वजनिक घोषणा और स्तुतिपरक कथन के बीच मूल की व्यापकता बनाए रखता है।
