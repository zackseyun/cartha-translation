source:
  edition: WLC
  text: וַ/יַּכְשִׁיל֣וּ/הוּ עָלֵ֣י/מוֹ לְשׁוֹנָ֑/ם יִ֝תְנֹדֲד֗וּ כָּל רֹ֥אֵה בָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/064/008.yaml
  text: They are made to stumble[a]; their own tongue is against them[b]; all who see them shake their heads.
translation:
  language: hi
  text: उन्हें ठोकर खिलाई जाती है[a]; उनकी अपनी जीभ उनके विरुद्ध होती है; उन्हें देखनेवाले सभी लोग सिर हिलाते हैं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक औपचारिक अनुवाद संभव है: “उसकी/इसकी जीभ ने उसे/इसे उन पर ठोकर खिलाई।” पहले खंड की इब्रानी वाक्य-रचना कठिन है और सर्वनामों का संबंध स्पष्ट नहीं है। मुख्य पाठ यह भाव व्यक्त करता है कि दुष्ट अपनी ही वाणी से धराशायी होते हैं।'
    reason: alternative_reading
  - marker: b
    text: इस क्रिया का अनुवाद “सिर डुलाते हैं,” “काँप उठते हैं,” या कुछ संदर्भों में “भाग जाते हैं” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכְשִׁילוּהוּ
  choice: वे ठोकर खाकर गिर पड़ते हैं
  rationale: כשׁל के हिफ़ईल रूप का मूल भाव किसी को ठोकर खिलाना या गिराना है। यद्यपि प्रत्यय व्याकरणतः एकवचन पुल्लिंग है, पद की कठिन काव्यात्मक रचना और आगे के बहुवचन संदर्भों को देखते हुए मुख्य पाठ दुष्टों के अपनी ही वाणी से धराशायी होने का सामूहिक भाव व्यक्त करता है।
- source_word: עָלֵימוֹ
  choice: उनके विरुद्ध
  rationale: על बहुवचन प्रत्यय के साथ ‘उन पर’ या ‘उनके विरुद्ध’ हो सकता है। यहाँ वाणी के उन्हीं पर पलटने का भाव स्वाभाविक और संदर्भानुकूल है।
- source_word: לְשׁוֹנָם
  choice: उनकी अपनी जीभ
  rationale: इब्रानी का एकवचन सामूहिक ‘जीभ’ बनाए रखा गया है। ‘अपनी’ इस बात को स्पष्ट करता है कि उनके पतन का साधन उनकी स्वयं की वाणी है, बिना बिंब को अमूर्त ‘बातों’ में बदलने के।
- source_word: יִתְנֹדֲדוּ
  choice: सिर हिलाते हैं
  rationale: נוד हिलने, भटकने या प्रतिक्रिया में संकेत करने को व्यक्त कर सकता है। देखनेवालों के संदर्भ में ‘सिर हिलाना’ विस्मय, तिरस्कार या भय की दिखाई देनेवाली प्रतिक्रिया को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: כָּל רֹאֵה בָם
  choice: उन्हें देखनेवाले सभी लोग
  rationale: यह सहभागी पदबंध के सार्वभौमिक भाव और बहुवचन कर्म—दोनों को स्पष्ट, सहज हिन्दी में बनाए रखता है।
theological_decisions:
- issue: पहले खंड के सर्वनामों और कर्ता-कर्म का संबंध
  choice: मुख्य पाठ में दुष्टों को अपनी ही जीभ के कारण ठोकर खाकर गिरते हुए समझा गया है।
  alternative: 'अधिक शब्दशः: ‘उसकी/इसकी जीभ ने उसे उन पर ठोकर खिलाई।’'
  rationale: इब्रानी वाक्य-विन्यास संक्षिप्त और कठिन है; प्रत्ययों का परस्पर संबंध निश्चित नहीं है। मुख्य पाठ निकटवर्ती बहुवचन संदर्भ और आत्म-विनाश के काव्यात्मक भाव का अनुसरण करता है, जबकि पादटिप्पणी वास्तविक व्याकरणिक अस्पष्टता सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘जीभ’ का ठोस काव्यात्मक बिंब सुरक्षित है। पहले खंड की वास्तविक इब्रानी अस्पष्टता को मुख्य पाठ में जबरन सुलझाने के बजाय पादटिप्पणी में स्पष्ट किया गया है; अंतिम क्रिया के अर्थ-विकल्प भी दिए गए हैं।
