source:
  edition: WLC
  text: יְחַזְּקוּ לָ֨/מוֹ דָּ֘בָ֤ר רָ֗ע יְֽ֭סַפְּרוּ לִ/טְמ֣וֹן מוֹקְשִׁ֑ים אָ֝מְר֗וּ מִ֣י יִרְאֶה לָּֽ/מוֹ־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/064/005.yaml
  text: They strengthen for themselves an evil matter[a]; they talk of hiding snares; they say[b], “Who will see them?”
translation:
  language: hi
  text: 'वे अपनी बुरी योजना[a] को मजबूत करते हैं;

    वे फंदे छिपाने की चर्चा करते हैं;

    वे कहते हैं, “उन्हें कौन देखेगा?”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘बुरी योजना’ का अनुवाद ‘बुरी बात’ या ‘बुरा मामला’ भी हो सकता है; इब्रानी शब्द के अर्थों में ‘वचन’, ‘बात’ और ‘मामला’ शामिल हैं।
    reason: lexical_alternative
  - marker: b
    text: कुछ व्याख्याकार इसे “हमें कौन देखेगा?” समझते हैं, मानो षड्यंत्रकारी अपने विषय में सीधे बोल रहे हों; पर इब्रानी रूप तृतीय पुरुष बहुवचन, अर्थात् “उन्हें”, है।
    reason: alternative_reading
lexical_decisions:
- source_word: יְחַזְּקוּ לָמוֹ
  choice: वे अपनी ... को दृढ़ करते हैं
  rationale: पिअल रूप का मूल भाव किसी बात को मजबूत या पक्का करना है। לָמוֹ को प्रसंग में आत्मवाचक अर्थ देकर ‘अपनी’ कहा गया है; इससे षड्यंत्रकारियों द्वारा अपनी योजना पक्की करने का भाव स्वाभाविक हिन्दी में आता है।
- source_word: דָּבָר רָע
  choice: बुरी योजना
  rationale: דָּבָר का अर्थ ‘वचन’, ‘बात’, ‘मामला’ या ‘कार्य’ हो सकता है। फंदों के प्रसंग में ‘बुरी योजना’ स्वाभाविक है, पर इसकी व्यापकता को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: יְסַפְּרוּ
  choice: चर्चा करते हैं
  rationale: पिअल में क्रिया का अर्थ बताना या वर्णन करना है; यहाँ क्रियार्थक पदबंध के साथ यह षड्यंत्रकारियों के आपसी विचार-विमर्श को व्यक्त करती है।
- source_word: לִטְמוֹן מוֹקְשִׁים
  choice: फंदे छिपाने
  rationale: טמן का मूल अर्थ छिपाना या गुप्त रखना और מוֹקֵשׁ का अर्थ फंदा है। यह अनुवाद छिपाकर फंदे लगाने के चित्र को बनाए रखता है।
- source_word: אָמְרוּ
  choice: वे कहते हैं
  rationale: यद्यपि रूप पूर्णकालिक है, काव्यात्मक वर्णन की धारा में वर्तमानकालीन ‘कहते हैं’ उनकी चलती हुई गतिविधि को स्वाभाविक रूप से व्यक्त करता है।
- source_word: מִי יִרְאֶה לָּמוֹ
  choice: उन्हें कौन देखेगा?
  rationale: לָמוֹ का रूप अन्य पुरुष बहुवचन है, इसलिए ‘उन्हें’ उसका सीधा प्रतिनिधित्व करता है। इब्रानी कविता में इसका संदर्भ संक्षिप्त और कुछ अस्पष्ट है; वैकल्पिक समझ पादटिप्पणी में दी गई है।
theological_decisions:
- issue: अंतिम सर्वनाम का संदर्भ
  choice: ‘उन्हें’ रखकर इब्रानी के अन्य पुरुष बहुवचन को सुरक्षित रखा गया
  alternative: ‘हमें कौन देखेगा?’ अथवा ‘उन्हें कौन देख पाएगा?’
  rationale: पाठ का व्याकरण अन्य पुरुष बहुवचन का समर्थन करता है, यद्यपि वक्ताओं द्वारा अपने विषय में सीधे बोलने की व्याख्या भी संभव है। किसी धर्मवैचारिक निष्कर्ष से अस्पष्टता को नहीं सुलझाया गया।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। समानांतर काव्य-पंक्तियाँ बनाए रखी गई हैं; ‘दृढ़ करते हैं’ स्रोत की क्रियात्मक शक्ति और ‘फंदे छिपाने’ उसके गुप्त षड्यंत्र के चित्र को सुरक्षित रखते हैं।
