source:
  edition: WLC
  text: יַֽחְפְּֽשׂוּ עוֹלֹ֗ת תַּ֭מְנוּ חֵ֣פֶשׂ מְחֻפָּ֑שׂ וְ/קֶ֥רֶב אִ֝֗ישׁ וְ/לֵ֣ב עָמֹֽק־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/064/006.yaml
  text: 'They devise injustices: “We have perfected a carefully concealed plot.” And the inward part of each man, and the heart, are deep.'
translation:
  language: hi
  text: 'वे अन्याय की बातें खोजते हैं और कहते हैं,


    “हमने एक सावधानी से छिपाई हुई योजना पूरी कर ली है।”[a]


    हर व्यक्ति का अंतर्मन और हृदय गहरे हैं।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इस पंक्ति का हिब्रू पदबंध कठिन है और इसमें ‘खोजने’ से जुड़े शब्दों की पुनरावृत्ति है। इसका अर्थ यह भी हो सकता है: “हमने एक भली-भाँति खोजी/जाँची हुई बात पूरी कर ली है।”'
    reason: חֵפֶשׂ מְחֻפָּשׂ का सटीक अर्थ अनिश्चित है। मुख्य पाठ अंग्रेज़ी POB की ‘carefully concealed plot’ व्याख्या रखता है, और टिप्पणी खोज/जाँच से संबंधित वैकल्पिक समझ को सुरक्षित रखती है।
lexical_decisions:
- source_word: יַחְפְּשׂוּ עוֹלֹת
  choice: वे अन्याय की योजनाएँ खोज निकालते हैं
  rationale: חפשׂ का मूल भाव ‘खोजना/ढूँढ़ निकालना’ है और עוֹלֹת नैतिक कुटिलता या अन्याय के बहुवचन को व्यक्त करता है; ‘योजनाएँ’ प्रसंग में निहित षड्यंत्रकारी अर्थ को स्वाभाविक हिंदी में स्पष्ट करता है।
- source_word: תַּמְנוּ
  choice: हमने ... पूरी कर ली है
  rationale: तमם धातु के प्रथम पुरुष बहुवचन रूप को पूर्णता तक पहुँचाने के अर्थ में लिया गया है।
- source_word: חֵפֶשׂ מְחֻפָּשׂ
  choice: एक सोची-समझी गुप्त योजना
  rationale: यह दुर्लभ और कठिन पदबंध खोज-बीन से तैयार तथा छिपाई गई युक्ति का संकेत देता है; हिंदी में शब्दशः पुनरुक्ति अस्वाभाविक होती, इसलिए अर्थपूर्ण किंतु सावधान अभिव्यक्ति चुनी गई है।
- source_word: וְקֶרֶב אִישׁ וְלֵב עָמֹק
  choice: हर मनुष्य का अंतर्मन और हृदय अथाह गहरा है
  rationale: קֶרֶב आंतरिक व्यक्तित्व और לֵב विचार-इच्छा के केंद्र को सूचित करता है। עָמֹק के अगम्य/गहन भाव के लिए ‘अथाह गहरा’ रखा गया है।
theological_decisions:
- issue: मानवीय अंतर्मन की गहराई और कुटिल योजना के बीच संबंध
  choice: दोनों को एक ही अंतिम कथन में निकट रखा गया
  alternative: इसे केवल योजनाकारों की चतुराई या केवल सभी मनुष्यों की सामान्य मनोवैज्ञानिक गहराई के रूप में स्पष्ट करना
  rationale: हिब्रू वाक्य दोनों अर्थ-संभावनाओं के बीच तनाव बनाए रखता है; अनुवाद किसी एक व्याख्या को निर्णायक नहीं बनाता।
translation_notes:
  register: आधुनिक मानक हिंदी; काव्यात्मक गरिमा रखते हुए सामान्य पाठक के लिए बोधगम्य शब्दावली। ‘अंतर्मन’, ‘हृदय’ और ‘अथाह गहरा’ मूल की समानांतर तथा गहन अभिव्यक्ति को बनाए रखते हैं।
