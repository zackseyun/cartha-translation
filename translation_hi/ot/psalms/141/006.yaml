  text: נִשְׁמְט֣וּ בִֽ/ידֵי סֶ֭לַע שֹׁפְטֵי/הֶ֑ם וְ/שָׁמְע֥וּ אֲ֝מָרַ֗/י כִּ֣י נָעֵֽמוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/141/006.yaml
  text: Their judges have been thrown down by the sides of the rock[a], and they have heard my words[b], for they are pleasant.
translation:
  language: hi
  text: उनके न्यायाधीश चट्टान की ढलानों पर से नीचे फेंक दिए गए हैं[a], और वे मेरे वचन सुनते हैं, क्योंकि वे सुखद हैं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “चट्टान के किनारों से नीचे।” इब्रानी पदबंध कठिन है; परंपरागत रूप से इसका अधिक शाब्दिक अर्थ “चट्टान के हाथों में” भी किया गया है।
    reason: alternative_reading
  - marker: b
    text: या, “मधुर” अथवा “मनभावने।”
    reason: lexical_alternative
lexical_decisions:
- source_word: נִשְׁמְטוּ
  choice: नीचे फेंक दिए गए हैं
  rationale: निफ़अल रूप गिराए जाने, फेंके जाने या फिसला दिए जाने का भाव दे सकता है; यहाँ हिंसक पतन का निष्क्रिय भाव उपयुक्त है।
- source_word: בִידֵי סֶלַע
  choice: चट्टान की ढलानों से
  rationale: शाब्दिक रूप से यह पदबंध कठिन है और ‘चट्टान के हाथों में’ भी समझा जा सकता है; प्रसंग में चट्टान के पार्श्व अथवा ढलान का स्थानवाचक अर्थ अधिक स्वाभाविक है।
- source_word: שֹׁפְטֵיהֶם
  choice: उनके न्यायी
  rationale: यह रूप न्याय करने वालों को दर्शाता है; ‘न्यायी’ मूल अर्थ को सीधे रखता है, यद्यपि ‘शासक’ अर्थ भी संभव है।
- source_word: וְשָׁמְעוּ
  choice: और वे ... सुनते हैं
  rationale: काव्य में क़ातल रूप का काल प्रसंगानुसार वर्तमान, भूत या भावी हो सकता है; वर्तमान काल पंक्ति को सजीव रखता और समय को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: אֲמָרַי
  choice: मेरे वचन
  rationale: पहले पुरुष प्रत्यय सहित बहुवचन का सीधा, गरिमापूर्ण और स्वाभाविक हिन्दी रूप।
- source_word: נָעֵמוּ
  choice: वे मनोहर हैं
  rationale: क्रिया सुखद, प्रिय या मधुर होने का भाव देती है; ‘मनोहर’ सकारात्मक मूल्यांकन को स्वाभाविक और गरिमापूर्ण ढंग से व्यक्त करता है।
theological_decisions:
- issue: कठिन पदबंध בידי סלע की व्याख्या
  choice: 'स्थानवाचक: ‘चट्टान की ढलानों से’'
  alternative: 'अधिक शाब्दिक: ‘चट्टान के हाथों में’; अन्य स्थलाकृतिक रूप: ‘चट्टान के किनारों से’'
  rationale: इब्रानी वाक्य-विन्यास कठिन और वास्तविक रूप से अस्पष्ट है। मुख्य पाठ संभावित स्थलाकृतिक चित्र को रखता है, जबकि अधिक शाब्दिक विकल्प पादटिप्पणी में सुरक्षित है।
- issue: וְשָׁמְעוּ का कालगत भाव
  choice: 'वर्तमान: ‘वे ... सुनते हैं’'
  alternative: 'भूतकाल: ‘उन्होंने ... सुने हैं’; भावी: ‘वे ... सुनेंगे’'
  rationale: इब्रानी काव्य में पूर्ण रूप का काल प्रसंग से निर्धारित होता है। यहाँ वर्तमान अर्थ अपनाया गया है, पर उससे किसी विशिष्ट धर्मवैज्ञानिक क्रम को आरोपित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में काव्यात्मक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य शैली। कठिन इब्रानी स्थलाकृतिक पदबंध की अस्पष्टता पादटिप्पणी में सुरक्षित रखी गई है।
