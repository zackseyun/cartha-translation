  yaml_path: translation/ot/psalms/141/003.yaml
  text: Set a guard[a], O Yahweh, over my mouth; keep watch over the door of my lips.
translation:
  language: hi
  text: 'हे याहवे, मेरे मुँह पर पहरा लगा;

    मेरे होंठों के द्वार की रखवाली कर।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरे होंठों के द्वार पर पहरा रख।” इब्रानी में शाब्दिक छवि “मेरे होंठों का द्वार” है; ‘द्वार’ के लिए ‘खुलने का स्थान’ भी समझा जा सकता है।
    reason: दַּל के ‘द्वार’ तथा उसके संभावित ‘खुलने का स्थान’ अर्थ को स्पष्ट करता है, बिना समयसूचक ‘खुलने पर’ अर्थ जोड़े।
lexical_decisions:
- source_word: שִׁיתָה
  choice: बैठा
  rationale: यह प्रार्थनात्मक आज्ञार्थक निवेदन है। ‘पहरा बैठा’ आधुनिक हिन्दी में स्वाभाविक है और किसी रक्षक को नियुक्त करने की ठोस छवि बनाए रखता है।
- source_word: יְהוָה
  choice: यहवे
  rationale: चतुरक्षरीय परमेश्वर-नाम को किसी उपाधि से बदलने के बजाय हिन्दी में उसके प्रचलित लिप्यंतरण ‘यहवे’ से व्यक्त किया गया है।
- source_word: שָׁמְרָה
  choice: पहरा
  rationale: यहाँ संज्ञा का अर्थ रखवाली या पहरा है; ‘पहरा बैठा’ मूल की ठोस रक्षक-छवि को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לְפִי
  choice: मेरे मुँह पर
  rationale: לְ और ‘मेरा मुँह’ के संबंध को हिन्दी में ‘पर’ से स्वाभाविक रूप दिया गया है, जहाँ पहरा नियुक्त किया जाता है।
- source_word: נִצְּרָה
  choice: निगरानी रख
  rationale: आज्ञार्थक रूप लगातार सावधानी से रक्षा करने का भाव देता है और पहले चरण के ‘पहरा’ के समानांतर रहता है।
- source_word: עַל
  choice: पर
  rationale: यह उस स्थान या वस्तु को चिह्नित करता है जिस पर निगरानी रखी जानी है।
- source_word: דַּל שְׂפָתָי
  choice: मेरे होंठों के द्वार
  rationale: דַּל का ‘द्वार/किवाड़’ अर्थ लेकर मूल की सजीव रूपक-छवि सुरक्षित रखी गई है; होंठ ऐसे द्वार हैं जिनसे वचन बाहर आते हैं।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: यहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ व्यक्तिगत परमेश्वर-नाम का सीधे प्रयोग करता है। ‘यहवे’ उस नाम को उपाधि से प्रतिस्थापित किए बिना प्रस्तुत करता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और प्रार्थनात्मक हिन्दी। समानांतर पंक्तियों तथा मुँह/होंठों पर पहरे की इब्रानी छवि को बनाए रखते हुए ‘पहरा बैठा’ और ‘निगरानी रख’ जैसे सामान्य बोधगम्य पद चुने गए हैं।
