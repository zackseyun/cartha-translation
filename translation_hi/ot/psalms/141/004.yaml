base_translation:
  language: en
  yaml_path: translation/ot/psalms/141/004.yaml
  text: Do not incline my heart to any evil thing[a], to practice wicked deeds with men who work iniquity[c][b]; and let me not eat of their delicacies.
translation:
  language: hi
  text: 'मेरे हृदय को किसी बुरी बात[a] की ओर न झुका,


    ऐसा न हो कि मैं बुराई करने वाले लोगों[b] के साथ


    दुष्ट काम करने में लगूँ;


    और मैं उनके स्वादिष्ट व्यंजन[c] न खाऊँ।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘बात’ का अर्थ यहाँ ‘विषय’, ‘वस्तु’ या ‘वचन’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘उन मनुष्यों के साथ जो बुराई करते हैं’; इसे ‘कुकर्मियों के साथ’ भी कहा जा सकता है।
    reason: lexical_alternative
  - marker: c
    text: अर्थात उनके उत्तम भोजन या मनभावनी वस्तुएँ; यह उनके पापमय सुखों में सहभागी होने का संकेत भी दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּט
  choice: झुका
  rationale: נטה का causative अर्थ यहाँ हृदय को किसी दिशा में झुकाने का है। ‘झुका’ मूल रूपक और परमेश्वर से की गई सीधी विनती—दोनों को बनाए रखता है।
- source_word: לִבִּי
  choice: मेरे हृदय को
  rationale: हिब्रू में ‘हृदय’ इच्छा, विचार और आंतरिक प्रवृत्ति का केंद्र है। इसे बनाए रखने से मूल मानवीय बिंब सुरक्षित रहता है।
- source_word: לְדָבָר רָע
  choice: किसी बुरी बात की ओर
  rationale: דבר का अर्थ ‘बात’, ‘विषय’, ‘वस्तु’ या ‘वचन’ हो सकता है। हिन्दी ‘बात’ यहाँ पर्याप्त व्यापक है और इसे केवल वाणी तक सीमित नहीं करती।
- source_word: לְהִתְעוֹלֵל עֲלִילוֹת בְּרֶשַׁע
  choice: दुष्ट काम करने में लगूँ
  rationale: हित्पोलेल infinitive किसी कार्य में सक्रिय रूप से लगने या संलग्न होने का भाव देता है; עֲלִילוֹת कर्मों/कामों को और בְּרֶשַׁע उनकी दुष्ट प्रकृति को व्यक्त करता है।
- source_word: אֶת אִישִׁים פֹּעֲלֵי אָוֶן
  choice: बुराई करनेवाले लोगों के साथ
  rationale: वाक्यांश ऐसे लोगों की संगति बताता है जिनकी पहचान बुरे कर्म करने से होती है। सहज आधुनिक हिन्दी में ‘लोगों’ सामान्य मानवीय समूह को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וּבַל אֶלְחַם
  choice: और मैं ... न खाऊँ
  rationale: निषेधात्मक रूप प्रार्थना की अगली विनती है। ‘न खाऊँ’ खाने के ठोस बिंब को बनाए रखता है और सहभागिता के संभावित लाक्षणिक अर्थ को खुला छोड़ता है।
- source_word: בְּמַנְעַמֵּיהֶם
  choice: उनके स्वादिष्ट व्यंजन
  rationale: מַנְעַמִּים मनभावनी या सुखद वस्तुओं, विशेषकर उत्तम खाद्य पदार्थों, को सूचित कर सकता है। खाने की क्रिया के साथ ‘स्वादिष्ट व्यंजन’ स्वाभाविक हिन्दी है।
theological_decisions:
- issue: ‘मेरे हृदय को ... न झुका’ में मानवीय नैतिक उत्तरदायित्व और परमेश्वर की सक्रियता
  choice: 'परमेश्वर से की गई सीधी causative विनती को बनाए रखा गया: ‘मेरे हृदय को ... न झुका।’'
  alternative: ‘मेरे हृदय को ... झुकने न दे।’
  rationale: हिब्रू पाठ परमेश्वर से सीधे हृदय को न झुकाने की प्रार्थना करता है। अनुमति मात्र का अर्थ देकर इस कथन को नरम करना मूल पाठ के धर्मवैचारिक तनाव को अनावश्यक रूप से सुलझा देता।
- issue: ‘स्वादिष्ट व्यंजन’ का शाब्दिक या लाक्षणिक आशय
  choice: खाने के ठोस बिंब को मुख्य पाठ में रखा गया और व्यापक संभावित आशय को पादटिप्पणी में बताया गया।
  alternative: ‘उनके पापमय सुखों में सहभागी न होऊँ।’
  rationale: मूल पाठ भोजन की भाषा इस्तेमाल करता है, पर वह दुष्टों के सुखों में सहभागिता का संकेत भी दे सकता है। मुख्य पाठ में बिंब बनाए रखने से अस्पष्टता सुरक्षित रहती है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, प्रार्थनामय और गरिमापूर्ण रखी गई है। ‘हृदय’, ‘झुका’ और ‘न खाऊँ’ मूल बिंबों को सुरक्षित रखते हैं; ‘दुष्ट काम करने में लगूँ’ और ‘बुराई करनेवाले लोगों’ से वाक्य सामान्य पाठक के लिए स्पष्ट और स्वाभाविक रहता है।
