base_translation:
  language: en
  yaml_path: translation/ot/psalms/141/008.yaml
  text: For my eyes are toward you[a], O Yahweh, my Lord; in you I take refuge[b]; do not pour out my life.
translation:
  language: hi
  text: क्योंकि मेरी आँखें तेरी ओर लगी हैं, हे यहोवा, मेरे प्रभु; मैंने तुझमें शरण ली है; मेरे प्राण[a] को उँडेल न दे।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “मेरे प्राण” का अर्थ यहाँ “मेरा जीवन” या “मैं स्वयं” भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: “उँडेल न दे” का अर्थ “मुझे निरावरण न कर” या “मुझे असहाय न छोड़” भी समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले संदर्भ में विनती का आधार बताता है और इब्रानी संयोजक का कारणसूचक बल बनाए रखता है।
- source_word: אֵלֶיךָ ... עֵינַי
  choice: मेरी आँखें तेरी ओर लगी हैं
  rationale: आँखों के किसी की ओर होने का इब्रानी मुहावरा ध्यान, आशा और निर्भरता व्यक्त करता है; यह हिंदी में स्वाभाविक रूप से उसी भाव को रखता है।
- source_word: יְהֹוָה
  choice: यहोवा
  rationale: व्यक्तिगत ईश्वरीय नाम को उपाधि में विलीन किए बिना नाम के रूप में प्रस्तुत किया गया है।
- source_word: אֲדֹנָי
  choice: मेरे प्रभु
  rationale: यहोवा से अलग प्रभुत्व-सूचक संबोधन और प्रथम पुरुष एकवचन संबंध को सुरक्षित रखता है।
- source_word: בְּךָ חָסִיתִי
  choice: मैंने तुझमें शरण ली है
  rationale: पूर्ण क्रिया को ऐसी वर्तमान-प्रासंगिक पूर्णता के रूप में रखा गया है जो पहले किए गए और अब भी कायम भरोसे को व्यक्त करती है।
- source_word: אַל־תְּעַר
  choice: उँडेल न दे
  rationale: हिफ़ील क्रिया के मूल अर्थ ‘खाली करना/उँडेल देना’ को प्रत्यक्ष रूप से रखा गया है, जबकि संभावित ‘निरावरण या असहाय छोड़ना’ अर्थ फुटनोट में दिया गया है।
- source_word: נַפְשִׁי
  choice: मेरे प्राण को
  rationale: ‘प्राण’ यहाँ जीवन/जीवित व्यक्ति का संकेत देता है और ‘आत्मा’ के संकुचित दार्शनिक अर्थ को अनावश्यक रूप से नहीं थोपता।
theological_decisions:
- issue: יְהֹוָה אֲדֹנָי में दोहरे ईश्वरीय संबोधन का अनुवाद
  choice: हे यहोवा, मेरे प्रभु
  alternative: हे प्रभु परमेश्वर
  rationale: ईश्वरीय व्यक्तिगत नाम और स्वामित्व-सूचक प्रभुता की उपाधि दोनों को अलग-अलग रखता है तथा ‘मेरे’ का भाव सुरक्षित करता है।
- issue: נֶפֶשׁ का संदर्भगत अर्थ
  choice: मेरे प्राण
  alternative: मेरी आत्मा / मेरा जीवन
  rationale: यहाँ वक्ता विनाश से अपने जीवन की रक्षा माँग रहा है; ‘प्राण’ जीवन और व्यक्ति दोनों की व्यापकता रखता है, बिना बाद की देह-आत्मा द्वैतवादी धारणा थोपे।
- issue: תְּעַר की रूपकात्मक विनती
  choice: उँडेल न दे
  alternative: मुझे निरावरण न कर / मुझे असहाय न छोड़
  rationale: मुख्य पाठ में क्रिया का ठोस रूपक रखा गया है और व्यापक संदर्भगत संभावना को फुटनोट में सुरक्षित किया गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण प्रार्थनात्मक हिंदी; परमेश्वर के लिए निकट और काव्यात्मक एकवचन ‘तू’ रूप अपनाया गया है। इब्रानी काव्य के शारीरिक रूपक और अंतिम विनती की वास्तविक अर्थगत व्यापकता बनाए रखी गई है।
