source:
  edition: WLC
  text: כְּמ֤וֹ פֹלֵ֣חַ וּ/בֹקֵ֣עַ בָּ/אָ֑רֶץ נִפְזְר֥וּ עֲ֝צָמֵ֗י/נוּ לְ/פִ֣י שְׁאֽוֹל׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/141/007.yaml
  text: As one plows and breaks up the earth[b][a], our bones have been scattered at the mouth of Sheol.
translation:
  language: hi
  text: जैसे कोई धरती को जोतता और चीरता है,[a] वैसे ही हमारी हड्डियाँ शिओल[b] के मुँह पर बिखर गई हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जैसे कोई भूमि को काटता और फाड़ता है।” हिब्रू के कृदंत क्रिया को सजीव रूप में दिखाते हैं; कृषि-संबंधी इन क्रियाओं का अनुवाद कुछ भिन्न शब्दों से भी किया जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: शिओल हिब्रू में मृतकों के लोक के लिए प्रयुक्त शब्द है; परंपरागत रूप से इसका अनुवाद “अधोलोक” या “कब्र” भी किया जाता है। कुछ संदर्भों में “नरक” कहा गया है, पर वह यहाँ कम सटीक है।
    reason: alternative_reading
lexical_decisions:
- source_word: כְּמוֹ
  choice: जैसे
  rationale: यह तुलना का संकेत देता है; हिंदी में ‘जैसे ... वैसे ही’ उपमा को स्वाभाविक और स्पष्ट बनाता है।
- source_word: פֹלֵחַ
  choice: जोतता
  rationale: यहाँ भूमि को काटने या चीरने की कृषि-संबंधी क्रिया अभिप्रेत है; ‘जोतता’ सामान्य पाठक के लिए उस चित्र को सहजता से व्यक्त करता है।
- source_word: וּבֹקֵעַ
  choice: और चीरता
  rationale: यह पहले क्रियापद के समानांतर भूमि को फाड़ने या खोलने की तीखी छवि बनाए रखता है।
- source_word: בָּאָרֶץ
  choice: धरती को
  rationale: संदर्भ में मिट्टी या भूमि अभिप्रेत है; हिंदी क्रियाओं ‘जोतता’ और ‘चीरता’ के साथ कर्मकारक प्रयोग स्वाभाविक है।
- source_word: נִפְזְרוּ
  choice: बिखर गई हैं
  rationale: निफ़अल रूप निष्क्रिय या परिणामसूचक भाव रखता है; यह अनिर्दिष्ट कर्ता जोड़े बिना वर्तमान परिणामी दशा को व्यक्त करता है।
- source_word: עֲצָמֵינוּ
  choice: हमारी हड्डियाँ
  rationale: सीधा अनुवाद मूल की कठोर और मार्मिक छवि को बिना नरम किए सुरक्षित रखता है।
- source_word: לְפִי
  choice: के मुँह पर
  rationale: मूल मुहावरे का शाब्दिक चित्र ‘मुँह’ है; इसे बनाए रखने से शिओल के निगलने वाले प्रवेश-द्वार की सजीव छवि सुरक्षित रहती है।
- source_word: שְׁאוֹל
  choice: शिओल
  rationale: हिब्रू संज्ञा का लिप्यंतरण मृतकों के लोक की प्राचीन अवधारणा को सुरक्षित रखता है और इसे अनावश्यक रूप से ‘नरक’ जैसी बाद की, अधिक संकीर्ण धारणा में नहीं बदलता।
theological_decisions:
- issue: שְׁאוֹל का अनुवाद
  choice: शिओल
  alternative: अधोलोक; मृतकों का लोक; कब्र; नरक
  rationale: लिप्यंतरण मूल हिब्रू अवधारणा और उसकी अर्थगत व्यापकता को बनाए रखता है। ‘नरक’ कहना ऐसी बाद की दंड-संबंधी धारणा जोड़ सकता है जिसकी इस पद में अनिवार्य माँग नहीं है; अर्थ पाठक के लिए पादटिप्पणी में स्पष्ट किया गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘जैसे ... वैसे ही’ हिंदी में तुलना को स्पष्ट करता है, जबकि ‘शिओल के मुँह’ और बिखरी हड्डियों की कठोर काव्यात्मक छवियाँ जानबूझकर सुरक्षित रखी गई हैं।
