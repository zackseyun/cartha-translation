  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उसके जालों में।” हिब्रू में ‘जाल’ बहुवचन है, पर अधिकारसूचक प्रत्यय एकवचन है; संदर्भ में इसका सामूहिक या आत्मवाची अर्थ हो सकता है।
    reason: alternative_reading
  - marker: b
    text: या, “जब मैं पार निकलूँ।” हिब्रू में शाब्दिक रूप से, “जब तक मैं पार निकलूँ।”
