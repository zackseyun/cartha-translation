lexical_decisions:
- source_word: יִפְּלוּ
  choice: गिरें
  rationale: प्रार्थना के संदर्भ में क़ाल अपूर्णकाल को इच्छासूचक रूप में लिया गया है; ‘गिरें’ इस भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בְמַכְמֹרָיו
  choice: अपने ही जालों में
  rationale: מַכְמֹר के बहुवचन रूप का अर्थ ‘जालों’ है। तीसरे पुरुष एकवचन प्रत्यय को बहुवचन सामूहिक कर्ता ‘दुष्ट’ के संदर्भ में हिन्दी में स्वाभाविक आत्मवाची रूप ‘अपने ही’ से व्यक्त किया गया है; शाब्दिक रूप ‘उसके जालों में’ भी संभव है।
- source_word: רְשָׁעִים
  choice: दुष्ट
  rationale: यह बहुवचन संज्ञार्थक विशेषण दुष्ट लोगों को सामूहिक रूप से दर्शाता है; ‘दुष्ट’ संक्षिप्त और स्वाभाविक हिन्दी है।
- source_word: יַחַד
  choice: सब-के-सब
  rationale: यहाँ क्रियाविशेषण सामूहिकता अथवा एक साथ होने का भाव देता है; ‘सब-के-सब’ पद्य में समूह की पूर्णता को स्पष्ट करता है।
- source_word: אָנֹכִי
  choice: मैं
  rationale: स्वतंत्र सर्वनाम का विरोधात्मक बल हिन्दी में स्पष्ट ‘मैं’ और ‘और’ से स्वाभाविक रूप में व्यक्त होता है।
- source_word: עַד אֶעֱבוֹר
  choice: और मैं पार निकल जाऊँ
  rationale: עַד का मूल अर्थ ‘जब तक’ है और עבר का अर्थ पार होना/निकलना है। संक्षिप्त हिब्रू पदबंध को लक्ष्य अथवा अपेक्षित परिणति के रूप में प्रस्तुत किया गया है, बिना ‘सुरक्षित’ जैसा अप्रकट शब्द जोड़े।
