  yaml_path: translation/ot/psalms/141/000.yaml
  text: A psalm of David. Yahweh[a], I call to you; hurry to me. Give ear to my voice when I call to you.
translation:
  language: hi
  text: 'दाऊद का भजन।


    हे यहोवा[a], मैं तुझे पुकारता हूँ; शीघ्र मेरे पास आ। जब मैं तुझे पुकारता हूँ, तब मेरी आवाज़ पर कान लगा।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू YHWH; परम्परागत रूप से “प्रभु” के रूप में अनूदित किया जाता है; वैकल्पिक रूप से “याहवे”।
    reason: alternative_reading
lexical_decisions:
- source_word: מִזְמוֹר לְדָוִד
  choice: दाऊद का भजन
  rationale: शीर्षक की स्वाभाविक हिन्दी अभिव्यक्ति; לְ को लेखकत्व अथवा संबद्धता की सम्भावित व्यापकता को बिना अनावश्यक विस्तार के पारंपरिक रूप में प्रस्तुत किया गया है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी पाठकों में परमेश्वर के विशिष्ट वाचा-नाम के रूप में व्यापक रूप से पहचाना जाने वाला रूप; पादटिप्पणी में हिब्रू व्यंजनात्मक रूप और वैकल्पिक उच्चारण स्पष्ट किया गया है।
- source_word: חוּשָׁה לִּי
  choice: शीघ्र मेरे पास आ
  rationale: शाब्दिक भाव 'मेरे लिए शीघ्रता कर' है; सन्दर्भ में सहायता हेतु तत्काल निकट आने की विनती को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הַאֲזִינָה קוֹלִי
  choice: मेरी आवाज़ पर कान लगा
  rationale: सुनने और ध्यान देने की प्रार्थना को मूल के शारीरिक मुहावरे के निकट रखते हुए सहज हिन्दी में प्रस्तुत करता है।
- source_word: בְּקָרְאִי לָךְ
  choice: जब मैं तुझे पुकारूँ
  rationale: कालगत उपवाक्य को स्वाभाविक हिन्दी में रखा गया है; दूसरी पुरुष एकवचन सम्बोधन बनाए रखा गया है।
theological_decisions:
- issue: दिव्य नाम YHWH का प्रस्तुतीकरण
  choice: मुख्य पाठ में 'यहोवा' और पादटिप्पणी में 'याहवे' विकल्प
  alternative: '''प्रभु'' अथवा मुख्य पाठ में ''याहवे'''
  rationale: मूल में सामान्य उपाधि नहीं, विशिष्ट दिव्य नाम है। 'यहोवा' आधुनिक हिन्दी बाइबलीय प्रयोग में परिचित है, जबकि पादटिप्पणी पाठक को मूल रूप और प्रचलित वैकल्पिक उच्चारण बताती है।
- issue: חוּשָׁה לִּי में गति का आशय
  choice: शीघ्र मेरे पास आ
  alternative: मेरे लिए शीघ्रता कर
  rationale: मूल वाक्यांश संक्षिप्त है और क्रिया का अपेक्षित कार्य स्पष्ट नहीं करता; सन्दर्भ सहायता और उपस्थिति की तात्कालिक याचना सुझाता है। हिन्दी में अर्थपूर्ण अभिव्यक्ति चुनी गई, पर कोई विशिष्ट प्रकार की सहायता नहीं जोड़ी गई।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और प्रार्थनात्मक रखी गई है। परमेश्वर के प्रति एकवचन निकट सम्बोधन के कारण 'तू/तुझे' रूप अपनाया गया है; यह अनादर नहीं, मूल हिब्रू के प्रत्यक्ष व्यक्तिगत सम्बोधन को दर्शाता है।
