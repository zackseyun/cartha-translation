source:
  edition: WLC
  text: תִּכּ֤וֹן תְּפִלָּתִ֣/י קְטֹ֣רֶת לְ/פָנֶ֑י/ךָ מַֽשְׂאַ֥ת כַּ֝פַּ֗/י מִנְחַת עָֽרֶב־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/141/002.yaml
  text: May my prayer be established before you as incense[b][a], the lifting up of my hands as the evening offering.
translation:
  language: hi
  text: मेरी प्रार्थना तेरे सामने धूप के समान ठहरे[a]; मेरे हाथों का उठाना सन्ध्या की भेंट के समान हो[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तेरे सामने व्यवस्थित हो” अथवा “तैयार हो”; इब्रानी में प्रार्थना के परमेश्वर की उपस्थिति में दृढ़ता से रखे जाने की विनती है।
    reason: lexical_alternative
  - marker: b
    text: “सन्ध्या की भेंट” से आशय सन्ध्या के समय नियमित रूप से चढ़ाई जाने वाली भेंट है; इब्रानी शब्द विशेष रूप से अन्नबलि भी सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּכּוֹן
  choice: स्थिर की जाए
  rationale: निफ़अल रूप में इच्छा या विनती व्यक्त होती है कि प्रार्थना परमेश्वर की उपस्थिति में दृढ़ता से रखी या व्यवस्थित की जाए। यह अनुवाद ‘स्वीकार की जाए’ कहकर निहित भाव को मूल अर्थ का स्थान नहीं देता।
- source_word: תְּפִלָּתִי
  choice: मेरी प्रार्थना
  rationale: प्रथम पुरुष एकवचन प्रत्यय सहित संज्ञा का सीधा और स्वाभाविक अनुवाद।
- source_word: קְטֹרֶת
  choice: धूप
  rationale: परमेश्वर के सामने जलाई जाने वाली सुगन्धित अर्पण-वस्तु के लिए प्रचलित और प्रसंगानुकूल हिन्दी शब्द।
- source_word: לְפָנֶיךָ
  choice: तेरे सामने
  rationale: परमेश्वर की उपस्थिति के स्थानिक-संबन्धात्मक भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מַשְׂאַת
  choice: उठाना
  rationale: हाथ उठाकर प्रार्थना करने की देहगत मुद्रा को सरल और सटीक रूप में रखता है।
- source_word: כַּפַּי
  choice: मेरे हाथों
  rationale: यद्यपि शब्द का शाब्दिक अर्थ ‘हथेलियाँ’ भी हो सकता है, इस प्रार्थना-मुद्रा में ‘हाथ’ स्वाभाविक हिन्दी है।
- source_word: מִנְחַת עָרֶב
  choice: सन्ध्या की भेंट
  rationale: मִנְחָה भेंट और विशेषतः अन्नबलि को सूचित कर सकता है। ‘भेंट’ पद्य की संक्षिप्तता और बलिदानी संदर्भ बनाए रखता है; विशिष्ट अर्थ पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: प्रार्थना पर उपासना-विधि की छवियों का प्रयोग
  choice: प्रार्थना और उठे हुए हाथों की तुलना धूप और सन्ध्या की भेंट से की गई है।
  alternative: प्रार्थना को बलिदान का पूर्ण प्रतिस्थापन मानना, अथवा इसे उपासना-विधि से रहित केवल काव्यात्मक चित्र समझना।
  rationale: इब्रानी पाठ में धूप और सन्ध्या की भेंट की स्पष्ट उपासना-विधिक भाषा है, पर तुलना को उससे आगे बढ़ाकर कोई पूर्ण धर्मसैद्धान्तिक दावा नहीं बनाया गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। परमेश्वर को सम्बोधन में काव्यात्मक एकवचन ‘तेरे’ रखा गया है। समानांतर काव्य-संरचना और उपासना-विधिक बिम्ब सुरक्षित रखे गए हैं।
