  yaml_path: translation/ot/psalms/141/001.yaml
  text: A psalm of David. O Yahweh[a], I call to you; hurry to me. Give ear to my voice when I call to you.
translation:
  language: hi
  text: 'दाऊद का भजन।


    हे याहवे[a], मैं तुझे पुकारता हूँ; शीघ्र मेरे पास आ। जब मैं तुझे पुकारूँ, तब मेरी आवाज़ पर ध्यान दे।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में YHWH; परंपरागत रूप से इसका अनुवाद ‘प्रभु’ किया गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: מִזְמוֹר
  choice: भजन
  rationale: भजन-संग्रह के शीर्षक में यह काव्यात्मक उपासना-गीत का मानक और सहज हिन्दी पद है।
- source_word: לְדָוִד
  choice: दाऊद का
  rationale: शीर्षक में לְ संबंध, समर्पण या रचनाकार होने का संकेत दे सकता है। प्रचलित हिन्दी अभिव्यक्ति ‘दाऊद का’ इस संबंध को बिना स्पष्ट रूप से ‘दाऊद द्वारा रचित’ कहे खुला रखती है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम YHWH को किसी उपाधि से बदलने के बजाय हिन्दी लिप्यंतरण में प्रस्तुत किया गया है।
- source_word: קְרָאתִיךָ
  choice: मैं तुझे पुकारता हूँ
  rationale: प्रार्थना के संदर्भ में पूर्ण क्रिया तात्कालिक पुकार को व्यक्त करती है; वर्तमानकालीन हिन्दी इस जीवंत विनती को स्वाभाविक रूप से रखती है।
- source_word: חוּשָׁה לִּי
  choice: शीघ्र मेरे पास आ
  rationale: आज्ञार्थक रूप तत्काल सहायता और निकट आने की विनती व्यक्त करता है। ‘शीघ्र’ काव्यात्मक गरिमा और आग्रह दोनों बनाए रखता है।
- source_word: הַאֲזִינָה קוֹלִי
  choice: मेरी आवाज़ पर कान लगा
  rationale: यह केवल सुनने नहीं, ध्यानपूर्वक सुनने की विनती है; हिन्दी मुहावरा मूल की काव्यात्मक और आग्रहपूर्ण भाषा को बनाए रखता है।
- source_word: בְּקָרְאִי לָךְ
  choice: जब मैं तुझे पुकारूँ
  rationale: בְּ के साथ क्रियार्थक रूप यहाँ समयसूचक अर्थ देता है; यह अनुवाद स्वाभाविक हिन्दी में वही संबंध व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा अथवा ‘प्रभु’
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम YHWH है। ‘याहवे’ उसे उपाधि से प्रतिस्थापित किए बिना प्रस्तुत करता है; पारंपरिक विकल्प पादटिप्पणी में बताया गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और प्रार्थनात्मक है। ‘शीघ्र’ तथा ‘कान लगा’ पद्य की गरिमा रखते हैं, जबकि पुरातन या अत्यधिक संस्कृतनिष्ठ शब्दावली से बचा गया है।
