  yaml_path: translation/ot/psalms/141/009.yaml
  text: Keep me from the hands of the trap they have set for me[b][a], and from the snares of the workers of wickedness.
translation:
  language: hi
  text: जिस फंदे को उन्होंने मेरे लिए लगाया है, उसकी पकड़ से मेरी रक्षा कर, और बुराई करने वालों के जालों से भी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׁמְרֵנִי
  choice: मेरी रक्षा कर
  rationale: שׁמר के प्रार्थनात्मक आदेश का अर्थ ‘रक्षा करना/बचाए रखना’ है; आधुनिक हिन्दी में यह स्वाभाविक और गरिमापूर्ण है।
- source_word: מִידֵי
  choice: की पकड़ से
  rationale: शाब्दिक रूप ‘के हाथों से’ है, पर निर्जीव फंदे के साथ यहाँ ‘पकड़’ उसके वश या चंगुल की इब्रानी छवि को स्वाभाविक हिन्दी में व्यक्त करती है।
- source_word: פַח
  choice: फंदे
  rationale: פח किसी पशु-पक्षी या व्यक्ति को फँसाने वाले फंदे/जाल को सूचित करता है; बाद के מֹקְשׁוֹת से हल्का शब्दगत भेद बनाए रखने के लिए ‘फंदा’ चुना गया है।
- source_word: יָקְשׁוּ לִי
  choice: जिसे उन्होंने मेरे लिए लगाया है
  rationale: क्रिया יקשׁ यहाँ फंदा लगाने का भाव देती है; सम्बन्धवाचक वाक्यांश हिन्दी में उसके आशय को स्पष्ट और सहज रखता है।
- source_word: וּמֹקְשׁוֹת
  choice: और ... जालों से भी
  rationale: बहुवचन מֹקְשׁוֹת को ‘जालों’ से व्यक्त किया गया है; ‘से’ पहली पंक्ति से अर्थानुसार दोहराया और ‘भी’ से समानांतरता स्वाभाविक की गई है।
- source_word: פֹּעֲלֵי אָוֶן
  choice: अनर्थ करनेवालों
  rationale: यह पद शाब्दिक रूप से ‘אָוֶן करनेवाले’ है। אָוֶן में बुराई, दुष्टता, अनर्थ और हानि के अर्थ संभव हैं; ‘अनर्थ करनेवाले’ कर्म और उसके विनाशकारी नैतिक भाव दोनों को संक्षेप में रखता है।
