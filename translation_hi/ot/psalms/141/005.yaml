source:
  edition: WLC
  text: יֶֽהֶלְמֵֽ/נִי צַדִּ֨יק חֶ֡סֶד וְֽ/יוֹכִיחֵ֗/נִי שֶׁ֣מֶן רֹ֭אשׁ אַל יָנִ֣י רֹאשִׁ֑/י כִּי ע֥וֹד וּ֝/תְפִלָּתִ֗/י בְּ/רָעוֹתֵי/הֶֽם־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/141/005.yaml
  text: Let a righteous man strike me—it is a kindness[a]; let him rebuke me—it is oil for the head; let my head not refuse it[d][c][b]. For still my prayer is against their evils.
translation:
  language: hi
  text: धर्मी मुझे मारे—यह कृपा है[a]; वह मुझे डाँटे—यह सिर के लिए तेल है; मेरा सिर इसे अस्वीकार न करे[b]। क्योंकि अब भी मेरी प्रार्थना उनके बुरे कामों के विरुद्ध है[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “धर्मी मुझे निष्ठापूर्ण प्रेम से मारे।”
    reason: חֶסֶד यहाँ कृपा, दयालुता या निष्ठापूर्ण प्रेम का बोध करा सकता है।
  - marker: b
    text: इब्रानी पद कठिन है; इसका अर्थ “मेरा सिर इसे न ठुकराए” भी हो सकता है।
    reason: אַל יָנִי רֹאשִׁי में क्रिया का अर्थ और रूपकात्मक संबंध अनिश्चित है।
  - marker: c
    text: अंतिम वाक्य अनिश्चित है। इसका अर्थ यह भी हो सकता है, “क्योंकि उनकी विपत्तियों में भी मेरी प्रार्थना उनके लिए है,” या “क्योंकि अब भी मेरी प्रार्थना उनकी विपत्तियों के बीच है।”
    reason: בְּרָעוֹתֵיהֶם में पूर्वसर्ग और ‘उनकी बुराइयों/विपत्तियों’ के अर्थ की एक से अधिक सम्भव व्याख्याएँ हैं।
lexical_decisions:
- source_word: יֶהֶלְמֵנִי
  choice: मुझे मारे
  rationale: הלם के ठोस और प्रबल प्रहार के रूपक को बनाए रखता है; प्रसंग में यह धर्मी व्यक्ति की कड़ी सुधारात्मक कार्रवाई है।
- source_word: צַדִּיק
  choice: धर्मी
  rationale: पुल्लिंग एकवचन विशेषण का संज्ञात्मक प्रयोग है। हिन्दी में ‘धर्मी’ प्रतिनिधि धर्मी पुरुष को स्वाभाविक और संक्षिप्त रूप से व्यक्त करता है।
- source_word: חֶסֶד
  choice: यह कृपा है
  rationale: यहाँ शब्द धर्मी व्यक्ति के प्रहार को हितकारी, कृपालु कार्य बताता है। ‘कृपा’ दया और निष्ठापूर्ण भलाई की अर्थ-छाया रखती है, पर प्रसंग से अधिक निश्चित वाचा-संबंधी अर्थ नहीं थोपती।
- source_word: וְיוֹכִיחֵנִי
  choice: वह मुझे डाँटे
  rationale: हिफ़ील रूप नैतिक दोष दिखाने और कड़ी ताड़ना देने का भाव रखता है। ‘डाँटे’ सामान्य आधुनिक हिन्दी में इसकी तीक्ष्णता को व्यक्त करता है।
- source_word: שֶׁמֶן רֹאשׁ
  choice: सिर के लिए तेल
  rationale: मूल रूपक को बिना औपचारिक अभिषेक का अर्थ जोड़े सुरक्षित रखता है।
- source_word: אַל יָנִי רֹאשִׁי
  choice: मेरा सिर इसे अस्वीकार न करे
  rationale: इब्रानी पद कठिन है; यह अनुवाद सुधार-रूपी तेल को न ठुकराने का प्रसंगानुकूल अर्थ देता है और ‘मेरा सिर’ की मूल छवि बनाए रखता है।
- source_word: כִּי עוֹד
  choice: क्योंकि अब भी
  rationale: कारण अथवा जारी स्थिति का संकेत स्वाभाविक हिन्दी में देता है।
- source_word: וּתְפִלָּתִי
  choice: मेरी प्रार्थना
  rationale: प्रथम पुरुष एकवचन प्रत्यय का सीधा और स्वाभाविक अनुवाद।
- source_word: בְּרָעוֹתֵיהֶם
  choice: उनके बुरे कामों के विरुद्ध
  rationale: ב की कठिन वाक्यगत भूमिका को निकटवर्ती प्रसंग में विरोधात्मक समझता है; बहुवचन רָעוֹת को अमूर्त ‘बुराइयों’ की अपेक्षा कर्मों के रूप में साफ़ करता है, जबकि वैकल्पिक पाठ फुटनोट में रखा गया है।
theological_decisions:
- issue: צַדִּיק का लिंग और प्रतिनिधि प्रयोग
  choice: धर्मी
  alternative: कोई धर्मी व्यक्ति / धर्मी जन
  rationale: मूल शब्द व्याकरणतः पुल्लिंग एकवचन है। हिन्दी का ‘धर्मी’ इसे अनावश्यक रूप से लिंग-निरपेक्ष बनाए बिना स्वाभाविक ढंग से प्रस्तुत करता है।
- issue: अंतिम कठिन उपवाक्य का अर्थ
  choice: क्योंकि अब भी मेरी प्रार्थना उनके बुरे कामों के विरुद्ध है
  alternative: क्योंकि उनकी विपत्तियों में भी मेरी प्रार्थना उनके लिए है
  rationale: पूर्वसर्ग ב और प्रत्यय के संबंध के कारण मूल वाक्य अस्पष्ट है। मुख्य पाठ दुष्टों के कर्मों से विरोध का प्रसंगानुकूल अर्थ लेता है, पर दूसरी वास्तविक सम्भावना को फुटनोट में सुरक्षित रखता है।
- issue: חֶסֶד की अर्थ-छाया
  choice: कृपा
  alternative: दयालुता / निष्ठापूर्ण प्रेम
  rationale: सुधार को हितकारी अनुग्रह के रूप में व्यक्त करता है, पर यहाँ वाचा-संबंधी तकनीकी अर्थ को निर्णायक नहीं बनाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। पद की कठोर छवियाँ—मारना, डाँटना और सिर का तेल—नरम किए बिना सुरक्षित हैं। कठिन इब्रानी को मुख्य पाठ में पठनीय बनाया गया है और वास्तविक अनिश्चितताएँ फुटनोटों में दी गई हैं।
