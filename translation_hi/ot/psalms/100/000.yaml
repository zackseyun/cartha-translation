translation:
  language: hi
  text: 'धन्यवाद का एक भजन।[a]


    हे सारी पृथ्वी, याहवे के लिए जयजयकार करो![b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद “धन्यवाद के लिए एक भजन” या “धन्यवाद-बलि के लिए एक भजन” भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “हे सारी पृथ्वी, याहवे के लिए हर्षध्वनि करो!”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְמוֹר
  choice: भजन
  rationale: यह इब्रानी संज्ञा गीतात्मक उपासना-रचना को दर्शाती है; आधुनिक हिन्दी में “भजन” इसका स्वाभाविक और प्रचलित समतुल्य है।
- source_word: לְתוֹדָה
  choice: धन्यवाद के लिए
  rationale: לְ उद्देश्य या संबंध व्यक्त कर सकता है और תּוֹדָה का अर्थ धन्यवाद अथवा धन्यवाद-बलि हो सकता है। मुख्य पाठ में सीधा अर्थ रखा गया है और अनुष्ठान-संबंधी संभावना पादटिप्पणी में दी गई है।
- source_word: הָרִיעוּ
  choice: जयजयकार करो
  rationale: यह बहुवचन आज्ञा ऊँची, उल्लासपूर्ण सार्वजनिक पुकार को व्यक्त करती है; “जयजयकार करो” हिन्दी में उस भाव को स्वाभाविक ढंग से पहुँचाता है।
- source_word: כָּל־הָאָרֶץ
  choice: हे सारी पृथ्वी
  rationale: समूची पृथ्वी को सीधे संबोधन के रूप में प्रस्तुत किया गया है, जैसा इब्रानी वाक्य में है।
- source_word: יהוה
  choice: याहवे
  rationale: व्यक्तिगत दिव्य नाम को उपाधि से बदलने के बजाय हिन्दी लिपि में प्रतिलेखित किया गया है।
theological_decisions:
- issue: לְתוֹדָה में धन्यवाद और धन्यवाद-बलि के बीच अर्थ-संभावना
  choice: मुख्य पाठ में “धन्यवाद के लिए”
  alternative: “धन्यवाद-बलि के लिए” या “धन्यवाद का”
  rationale: इब्रानी पदबंध उद्देश्य, अवसर या प्रकार का संकेत दे सकता है। मुख्य पाठ व्यापक अर्थ बनाए रखता है; अधिक विशिष्ट अनुष्ठान-संबंधी अर्थ पादटिप्पणी में सुरक्षित है।
- issue: दिव्य नाम יהוה का प्रस्तुतीकरण
  choice: याहवे
  alternative: प्रभु
  rationale: मूल में व्यक्तिगत नाम है; उसका प्रतिलेखन स्रोत की विशिष्टता को बनाए रखता है और उसे सामान्य उपाधि में नहीं बदलता।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। शीर्षक और आज्ञा को अलग पंक्तियों में रखा गया है। “जयजयकार” सामूहिक उल्लासपूर्ण पुकार का स्वाभाविक हिन्दी रूप है, जबकि मूल की वैकल्पिक ध्वनि-छवि पादटिप्पणी में दी गई है।
