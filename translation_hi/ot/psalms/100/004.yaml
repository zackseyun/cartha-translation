id: PSA.100.4
reference: Psalms 100:4
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: בֹּ֤אוּ שְׁעָרָ֨י/ו בְּ/תוֹדָ֗ה חֲצֵרֹתָ֥י/ו בִּ/תְהִלָּ֑ה הֽוֹדוּ ל֝֗/וֹ בָּרֲכ֥וּ שְׁמֽ/וֹ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/100/004.yaml
  text: Enter his gates with thanksgiving[a], his courts with praise; give thanks to him; bless his name.
translation:
  language: hi
  text: धन्यवाद के साथ[a] उसके फाटकों में प्रवेश करो, स्तुति के साथ उसके आँगनों में; उसका धन्यवाद करो; उसके नाम को धन्य कहो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “धन्यवाद-बलि लेकर”; इब्रानी शब्द (תּוֹדָה) का अर्थ संदर्भ के अनुसार धन्यवाद या धन्यवाद-बलि, दोनों हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בֹּאוּ
  choice: प्रवेश करो
  rationale: बहुवचन आज्ञार्थक क्रिया है। फाटकों और आँगनों के संदर्भ में ‘प्रवेश करो’ गति और उपासना-स्थल में आने का भाव स्वाभाविक रूप से व्यक्त करता है।
- source_word: שְׁעָרָיו
  choice: उसके फाटकों
  rationale: बहुवचन रूप और तृतीय पुरुष एकवचन प्रत्यय को सीधे बनाए रखता है तथा पवित्र परिसर के प्रवेश-द्वारों की मूर्त छवि सुरक्षित रखता है।
- source_word: בְּתוֹדָה
  choice: धन्यवाद के साथ
  rationale: תּוֹדָה यहाँ धन्यवाद अथवा धन्यवाद-बलि दोनों का बोध करा सकता है। स्तुति के समानांतर होने के कारण मुख्य पाठ में ‘धन्यवाद’ स्वाभाविक है, जबकि बलि वाला संभव अर्थ पाद-टिप्पणी में रखा गया है।
- source_word: חֲצֵרֹתָיו
  choice: उसके आँगनों
  rationale: यह मंदिर के बाहरी या भीतरी प्रांगणों का संकेत देता है। ‘आँगनों’ साधारण पाठक के लिए स्पष्ट है और मूल स्थान-संबंधी बिंब बनाए रखता है।
- source_word: בִּתְהִלָּה
  choice: स्तुति के साथ
  rationale: मूल के समानांतर ढाँचे को ‘धन्यवाद के साथ’ के अनुरूप रखता है और תְהִלָּה का सामान्य उपासना-संबंधी अर्थ व्यक्त करता है।
- source_word: הוֹדוּ לוֹ
  choice: उसका धन्यवाद करो
  rationale: उपासना के संदर्भ में ידה का हिफ़ील रूप धन्यवाद देने को व्यक्त करता है। यह पहले आए תּוֹדָה से शब्दार्थ-संबंध भी बनाए रखता है।
- source_word: בָּרֲכוּ
  choice: धन्य कहो
  rationale: ‘धन्य कहो’ परमेश्वर के नाम के संबंध में ברך का भाव व्यक्त करता है और इसे केवल ‘स्तुति करो’ कहकर תְהִלָּה के साथ मिला नहीं देता।
- source_word: שְׁמוֹ
  choice: उसके नाम को
  rationale: मूल अभिव्यक्ति को सीधे सुरक्षित रखता है; यहाँ ‘नाम’ परमेश्वर की प्रकट पहचान और प्रतिष्ठा का प्रतिनिधित्व करता है।
theological_decisions:
- issue: फाटकों और आँगनों की उपासना-संबंधी छवि
  choice: ‘फाटकों’ और ‘आँगनों’ को मूर्त रूप में बनाए रखना
  alternative: इसे सामान्य बनाकर ‘उसकी उपस्थिति’ या ‘उसके भवन’ में कहना
  rationale: इब्रानी पाठ पवित्र परिसर में प्रवेश करने की स्पष्ट छवि देता है। इसे बनाए रखने से पाठ में निहित मंदिर-संबंधी संदर्भ सुरक्षित रहता है और कोई व्यापक धर्मवैज्ञानिक अर्थ अनावश्यक रूप से नहीं जोड़ा जाता।
- issue: תּוֹדָה का अर्थ
  choice: मुख्य पाठ में ‘धन्यवाद’, पाद-टिप्पणी में ‘धन्यवाद-बलि’
  alternative: मुख्य पाठ में केवल ‘धन्यवाद-बलि’
  rationale: शब्द दोनों अर्थों में प्रयुक्त हो सकता है। स्तुति के साथ समानांतरता अमूर्त ‘धन्यवाद’ का समर्थन करती है, पर बलि-संबंधी संभावना वास्तविक है और उसे पाद-टिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और काव्यात्मक उपासना-रजिस्टर अपनाया गया है। समानांतर वाक्य-विन्यास और मंदिर-परिसर की ठोस छवि सुरक्षित रखी गई है।
