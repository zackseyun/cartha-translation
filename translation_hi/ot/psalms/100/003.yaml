id: PSA.100.3
reference: Psalms 100:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: דְּע֗וּ כִּֽי יְהוָה֮ ה֤וּא אֱלֹ֫הִ֥ים הֽוּא עָ֭שָׂ/נוּ ו/לא אֲנַ֑חְנוּ עַ֝מּ֗/וֹ וְ/צֹ֣אן מַרְעִיתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/100/003.yaml
  text: Know that Yahweh[a], he is God. He made us, and not we ourselves; we are his people and the sheep of his pasture.
translation:
  language: hi
  text: जान लो कि याहवे ही परमेश्वर है। उसी ने हमें बनाया; हमने स्वयं को नहीं बनाया।[a] हम उसकी प्रजा और उसकी चरागाह की भेड़ें हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, परंपरागत हाशियाई पाठ के अनुसार: “उसी ने हमें बनाया, और हम उसी के हैं।”'
    reason: alternative_reading
lexical_decisions:
- source_word: דְּעוּ
  choice: जान लो
  rationale: बहुवचन आज्ञार्थक रूप है, जो श्रोताओं से इस सत्य को पहचानने और स्वीकार करने का आह्वान करता है; ‘जान लो’ आधुनिक हिंदी में स्वाभाविक और स्पष्ट है।
- source_word: כִּי
  choice: कि
  rationale: यह उस कथन की विषय-वस्तु प्रस्तुत करता है जिसे जानना है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: ईश्वर के व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिंदी में प्रचलित लिप्यंतरण द्वारा सुरक्षित रखा गया है।
- source_word: הוּא אֱלֹהִים
  choice: ही परमेश्वर है
  rationale: हिब्रू सर्वनाम की बलात्मकता को ‘ही’ से व्यक्त किया गया है, पर मूल से आगे बढ़कर कोई अतिरिक्त सिद्धान्तात्मक वाक्यांश नहीं जोड़ा गया।
- source_word: הוּא עָשָׂנוּ
  choice: उसी ने हमें बनाया
  rationale: कर्ता पर बल को ‘उसी ने’ से और עשה के सामान्य अर्थ को ‘बनाया’ से स्वाभाविक हिंदी में व्यक्त किया गया है।
- source_word: וְלֹא אֲנַחְנוּ
  choice: हमने स्वयं को नहीं बनाया
  rationale: मुख्य पाठ लिखित रूप לא (‘नहीं’) का अनुसरण करता है। हिंदी में पूर्ण और सहज वाक्य बनाने के लिए पहले क्रियापद ‘बनाया’ को निहित रूप से दोहराया गया है।
- source_word: עַמּוֹ
  choice: उसकी प्रजा
  rationale: परमेश्वर से संबंधित समुदाय के लिए ‘प्रजा’ गरिमापूर्ण और बोधगम्य वाचा-संबंधी पद है।
- source_word: וְצֹאן מַרְעִיתוֹ
  choice: उसकी चराई की भेड़ें
  rationale: ‘भेड़ें’ और ‘चराई’ मूल के पशुपालकीय बिंब को निकटता से बनाए रखते हैं।
theological_decisions:
- issue: मध्य खंड में केतीव/केरे पाठांतर
  choice: 'मुख्य पाठ केतीव לא के अनुसार: ‘उसी ने हमें बनाया, हमने स्वयं को नहीं बनाया।’'
  alternative: 'परंपरागत केरे לו के अनुसार: ‘उसी ने हमें बनाया, और हम उसी के हैं।’'
  rationale: लिखित व्यंजन-पाठ לא स्वाभाविक रूप से ‘नहीं’ अर्थ देता है, जबकि पारंपरिक हाशियाई पाठ לו ‘उसके’ अर्थ देता है। मूल-पाठ की प्रधानता के कारण केतीव मुख्य पाठ में है, और प्राचीन तथा प्रसंगानुकूल केरे को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामूहिक आराधना में सुबोध रखी गई है। ‘यहोवा’ व्यक्तिगत नाम को सुरक्षित रखता है; ‘प्रजा’ और ‘चराई की भेड़ें’ वाचा तथा चरवाहे के मूल बिंबों को बनाए रखते हैं।
