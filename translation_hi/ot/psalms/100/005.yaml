id: PSA.100.5
reference: Psalms 100:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּי ט֣וֹב יְ֭הֹוָה לְ/עוֹלָ֣ם חַסְדּ֑/וֹ וְ/עַד דֹּ֥ר וָ֝/דֹ֗ר אֱמוּנָתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/100/005.yaml
  text: For Yahweh is good[a]; his steadfast love is forever[d][c][b], and his faithfulness endures from generation to generation.
translation:
  language: hi
  text: क्योंकि याहवे भला है; उसका अटल प्रेम सदा बना रहता है[a], और उसकी विश्वासयोग्यता पीढ़ी-दर-पीढ़ी बनी रहती है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी ‘हेसेद’; इसमें अटल प्रेम के साथ दया, निष्ठा और वाचा के प्रति भरोसेमंद प्रतिबद्धता के भाव भी शामिल हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पद भजन में पहले दिए गए आह्वान का कारण बताता है; ‘क्योंकि’ उस व्याख्यात्मक संबंध को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: טוֹב
  choice: भला
  rationale: यह शब्द नैतिक अच्छाई और उपकारशीलता दोनों को समेटता है; परमेश्वर के लिए ‘भला’ संक्षिप्त, गरिमापूर्ण और स्वाभाविक है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में प्रयुक्त परमेश्वर के व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय देवनागरी लिप्यंतरण में रखा गया है।
- source_word: חַסְדּוֹ
  choice: उसका अटल प्रेम
  rationale: חֶסֶד में प्रेम, दया, निष्ठा और स्थायी संबंधपरक प्रतिबद्धता के भाव हैं। ‘अटल प्रेम’ मुख्य अर्थ को सहज हिन्दी में रखता है, जबकि टिप्पणी इसकी व्यापकता बताती है।
- source_word: לְעוֹלָם
  choice: सदा बना रहता है
  rationale: यह अनंत अथवा निरंतर अवधि को व्यक्त करता है। हिन्दी में विधेय को स्पष्ट करने के लिए ‘बना रहता है’ जोड़ा गया है; यह मूल के नाममात्र वाक्य का निहित अर्थ है।
- source_word: אֱמוּנָתוֹ
  choice: उसकी विश्वासयोग्यता
  rationale: यह संज्ञा दृढ़ता, भरोसेमंदी और निष्ठा दर्शाती है; ‘विश्वासयोग्यता’ परमेश्वर की भरोसेमंद स्थिरता को ठीक प्रकार व्यक्त करती है।
- source_word: וְעַד דֹּר וָדֹר
  choice: और ... पीढ़ी-दर-पीढ़ी
  rationale: इब्रानी की पुनरुक्ति लगातार आने वाली पीढ़ियों तक अवधि को बढ़ाती है। ‘पीढ़ी-दर-पीढ़ी’ हिन्दी का स्वाभाविक समानार्थी मुहावरा है।
theological_decisions:
- issue: परमेश्वर के नाम יהוה का अनुवाद
  choice: याहवे
  alternative: प्रभु
  rationale: पद में व्यक्तिगत वाचा-नाम सीधे उपस्थित है; ‘याहवे’ उसे सुरक्षित रखता है और उसे केवल एक उपाधि में नहीं बदलता।
- issue: חֶסֶד की अर्थ-व्याप्ति
  choice: अटल प्रेम
  alternative: वाचा की निष्ठा / करुणा
  rationale: ‘अटल प्रेम’ प्रेम और स्थिरता दोनों को व्यक्त करता है, पर अर्थ को केवल कानूनी वाचा-श्रेणी या केवल दया तक सीमित नहीं करता।
- issue: मूल के क्रियारहित समानांतर उपवाक्यों को हिन्दी में व्यक्त करना
  choice: ‘बना रहता है’ को दोनों उपवाक्यों में स्पष्ट करना
  alternative: ‘उसका अटल प्रेम सदा है, और उसकी विश्वासयोग्यता पीढ़ी-दर-पीढ़ी’
  rationale: इब्रानी में क्रिया निहित है। स्पष्ट क्रिया जोड़ने से वर्तमान हिन्दी स्वाभाविक बनती है और स्थायित्व का भाव सामने आता है, बिना नया धर्मवैज्ञानिक दावा जोड़े।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल रखी गई है। समानांतर काव्य-रचना को अर्धविराम और दोहराए गए ‘बनी/बना रहती है’ से स्पष्ट किया गया है; ‘पीढ़ी-दर-पीढ़ी’ मूल की पुनरुक्ति का स्वाभाविक हिन्दी रूप है।
