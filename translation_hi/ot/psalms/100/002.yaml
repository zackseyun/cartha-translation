source:
  edition: WLC
  text: עִבְד֣וּ אֶת יְהוָ֣ה בְּ/שִׂמְחָ֑ה בֹּ֥אוּ לְ֝/פָנָ֗י/ו בִּ/רְנָנָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/100/002.yaml
  text: Serve Yahweh with gladness[a]; come before him with joyful shouting.
translation:
  language: hi
  text: 'आनन्द से याहवे की सेवा करो;

    जयजयकार करते हुए[a] उसके सामने आओ।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “आनन्द का गीत गाते हुए”; इब्रानी शब्द उल्लास से की गई ऊँची पुकार या आनन्द-गीत—दोनों का बोध करा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עִבְדוּ
  choice: सेवा करो
  rationale: यह עבד का बहुवचन आज्ञार्थक रूप है। याहवे के संबंध में यह समर्पित सेवा और उपासना-संबंधी आज्ञाकारिता को दर्शाता है; ‘सेवा करो’ इसके व्यापक अर्थ को बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय दिव्य नाम को किसी उपाधि से बदलने के बजाय उसके प्रचलित विद्वत्तापूर्ण उच्चारण के अनुसार लिप्यंतरित किया गया है।
- source_word: בְּשִׂמְחָה
  choice: आनन्द से
  rationale: पूर्वसर्ग בְּ यहाँ रीति या भाव बताता है—सेवा आनन्दपूर्वक की जानी है। यह आधुनिक हिन्दी में सहज और स्पष्ट है।
- source_word: בֹּאוּ
  choice: आओ
  rationale: בוא का बहुवचन आज्ञार्थक रूप है। ‘आओ’ मूल की व्यापक गति-सूचना को रखता है और किसी भवन या पवित्रस्थान में प्रवेश का अनावश्यक विशेषीकरण नहीं करता।
- source_word: לְפָנָיו
  choice: उसके सामने
  rationale: शाब्दिक भाव ‘उसके मुख/उपस्थिति के सामने’ है। ‘उसके सामने’ संक्षिप्त, स्वाभाविक और मूल के स्थानिक-संबंधपरक भाव के निकट है।
- source_word: בִּרְנָנָה
  choice: जयजयकार करते हुए
  rationale: רְנָנָה उल्लासपूर्ण ऊँची पुकार, जयध्वनि या आनन्द-गीत का बोध करा सकता है। ‘जयजयकार करते हुए’ इसके मुखर और उत्साहपूर्ण भाव को स्वाभाविक हिन्दी में व्यक्त करता है; गीत का संभव अर्थ पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: पद में व्यक्तिगत दिव्य नाम सीधे आया है। ‘याहवे’ उसे उपाधि से प्रतिस्थापित किए बिना सुरक्षित रखता है और ‘यहोवा’ की अपेक्षा मूल नाम के व्यापक रूप से स्वीकृत विद्वत्तापूर्ण उच्चारण के अधिक निकट है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामूहिक आह्वान के लिए स्वाभाविक रखी गई है। हिन्दी में क्रिया-रूप लिंग या संख्या का भेद स्पष्ट नहीं करता, पर संदर्भ में आज्ञा पूरे समुदाय को संबोधित है। समानांतर पंक्तियों की संक्षिप्तता और काव्यात्मक लय बनाए रखी गई है।
