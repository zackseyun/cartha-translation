lexical_decisions:
- source_word: מִזְמוֹר
  choice: एक भजन
  rationale: भजन-संग्रह के शीर्षकों में यह संज्ञा सामान्यतः संगीतबद्ध पवित्र गीत को दर्शाती है; आधुनिक हिन्दी में ‘भजन’ इसका स्वाभाविक और स्थापित रूप है।
- source_word: לְתוֹדָה
  choice: धन्यवाद के लिए
  rationale: לְ उपसर्ग उद्देश्य या संबंध सूचित कर सकता है और תוֹדָה का अर्थ धन्यवाद, स्तुति अथवा धन्यवाद-बलि हो सकता है। ‘धन्यवाद के लिए’ बलिदान-संबंधी अर्थ को अनावश्यक रूप से निश्चित किए बिना मूल की व्यापकता बनाए रखता है।
- source_word: הָרִיעוּ
  choice: जयजयकार करो
  rationale: रूप एक बहुवचन आज्ञार्थक है जो ऊँची, उत्सवपूर्ण पुकार का निर्देश देता है। ‘जयजयकार करो’ उसकी श्रव्य तीव्रता और आनंदपूर्ण भाव दोनों को सहज हिन्दी में व्यक्त करता है।
- source_word: לַיהוָה
  choice: यहोवा के लिए
  rationale: לְ पुकार की दिशा या जिसके सम्मान में पुकार की जाती है उसे दर्शाता है। יְהוָה को एक व्यक्तिवाचक ईश्वरीय नाम के रूप में ‘यहोवा’ लिखा गया है।
- source_word: כָּל־הָאָרֶץ
  choice: सारी पृथ्वी
  rationale: इस सार्वभौमिक आह्वान में אֶרֶץ का आशय किसी सीमित भूभाग की अपेक्षा पूरी पृथ्वी है। ‘सारी पृथ्वी’ काव्यात्मक और सामान्य हिन्दी दोनों में स्वाभाविक है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: मूल पाठ में चार-अक्षरीय ईश्वरीय नाम प्रत्यक्ष रूप से है। उसे केवल उपाधि ‘प्रभु’ से बदलने के बजाय नाम के रूप में रखना स्रोत-साक्ष्य को अधिक स्पष्टता से सुरक्षित करता है; हिन्दी पाठकों के लिए ‘यहोवा’ प्रचलित लिप्यंतरण है।
- issue: לְתוֹדָה में बलिदान-संबंधी संभावना
  choice: धन्यवाद के लिए
  alternative: धन्यवाद-बलि के लिए / धन्यवाद का
  rationale: תוֹדָה धन्यवाद की अभिव्यक्ति और धन्यवाद-बलि दोनों को सूचित कर सकता है। मुख्य पाठ व्यापक अर्थ रखता है और पादटिप्पणी विशिष्ट बलिदान-संबंधी संभावना बताती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामूहिक आराधना में सहज रूप से पढ़ी जाने योग्य रखी गई है। शीर्षक की संक्षिप्तता और आज्ञा की ऊर्जस्विता सुरक्षित है; अर्थगत अस्पष्टता पादटिप्पणी में दी गई है।
