  text: Then we will not turn back from you; revive us[a], and we will call on your name.
translation:
  language: hi
  text: तब हम तुझसे मुँह न मोड़ेंगे; हमें जीवन दे[a], और हम तेरे नाम को पुकारेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “हमें फिर से जिला”; इब्रानी का अर्थ “हमें जीवित रख” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא
  choice: तब ... न
  rationale: पूर्ववर्ती प्रार्थना के प्रत्युत्तर का परिणाम व्यक्त करने के लिए וְ को यहाँ स्वाभाविक हिन्दी में ‘तब’ कहा गया है; निषेध स्पष्ट रखा गया है।
- source_word: נָסוֹג מִמֶּךָּ
  choice: हम तुझसे मुँह न मोड़ेंगे
  rationale: סוג का मूल भाव पीछे हटना या फिर जाना है। ‘मुँह मोड़ना’ सम्बन्धपरक निष्ठा के इस प्रसंग में स्वाभाविक हिन्दी है और ‘भटकना’ जैसे अधिक व्याख्यात्मक शब्द से बचता है।
- source_word: תְּחַיֵּנוּ
  choice: हमें जीवन दे
  rationale: חיה के पिअेल रूप में जीवन देना, फिर से जिलाना, या जीवित रखना—इन अर्थों की गुंजाइश है। ‘जीवन दे’ इस व्यापकता को यथासम्भव खुला रखता है।
- source_word: וּבְשִׁמְךָ נִקְרָא
  choice: और हम तेरे नाम को पुकारेंगे
  rationale: קרא בשם परमेश्वर का नाम लेकर उसे पुकारने/उसकी दुहाई देने का मुहावरा है। यह अनुवाद प्रार्थना और उपासना का भाव सहज रूप में रखता है।
theological_decisions:
- issue: जीवन देने की विनती का आशय
  choice: ‘हमें जीवन दे’—ऐसी व्यापक विनती जिसमें पुनर्जीवन और जीवित रखे जाने, दोनों की सम्भावना बनी रहती है।
  alternative: ‘हमें फिर से जिला’ या ‘हमें जीवित रख’
  rationale: इब्रानी क्रिया केवल आत्मिक पुनर्जागरण अथवा केवल शारीरिक संरक्षण तक सीमित नहीं है; इसलिए पाठ की अर्थगत और धर्मवैचारिक व्यापकता को अनिर्णीत रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और प्रार्थनामय हिन्दी। भजन में परमेश्वर के लिए प्रयुक्त एकवचन निकट सम्बोधन के अनुरूप ‘तुझसे/तेरे’ रखा गया है।
