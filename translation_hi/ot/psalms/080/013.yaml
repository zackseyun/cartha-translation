  text: A boar from the forest tears it down[b][a], and the wild animals of the field feed on it.
translation:
  language: hi
  text: जंगल का सूअर उसे कुतरकर नुकसान पहुँचाता है[a], और मैदान के जंगली पशु उसे चरते हैं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसे नोचता” या “उसे बुरी तरह नष्ट करता है।”
    reason: दुर्लभ क्रिया में विनाशकारी ढंग से कुतरने, नोचने, या खाकर नुकसान पहुँचाने का भाव है।
  - marker: b
    text: या, “मैदान के चलने-फिरनेवाले जीव उस पर चरते हैं।”
    reason: זִיז का अधिक शाब्दिक अर्थ चलने-फिरनेवाले जीव हो सकता है; רעה का अर्थ चरना या भोजन करना है।
lexical_decisions:
- source_word: יְכַרְסְמֶנָּה
  choice: उसे नोचकर उजाड़ देता है
  rationale: दुर्लभ क्रिया כרסם पशुओं द्वारा कुतरने, नोचने या खाकर बुरी तरह नष्ट करने का भाव देती है। यह चयन बेल को होनेवाली सक्रिय और व्यापक क्षति को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: חֲזִיר מִיָּעַר
  choice: जंगल से आया जंगली सूअर
  rationale: חֲזִיר सूअर को और מִיָּעַר उसके जंगल से आने को दर्शाता है। ‘जंगली सूअर’ आधुनिक हिन्दी में इस वन्य पशु का स्वाभाविक नाम है, जबकि ‘जंगल से आया’ מן के स्रोत-बोध को बनाए रखता है।
- source_word: זִיז שָׂדַי
  choice: मैदान के जंगली पशु
  rationale: दुर्लभ זִיז चलने-फिरनेवाले जीवों, विशेषकर वन्य पशुओं, के लिए प्रयुक्त होता है। ‘जंगली पशु’ स्पष्ट और स्वाभाविक है; ‘मैदान के’ शָׂדַי की खुली भूमि की छवि को बनाए रखता है।
- source_word: יִרְעֶנָּה
  choice: उसे चर जाते हैं
  rationale: רעה का मूल अर्थ चरना या भोजन करना है। बेल के संदर्भ में ‘चर जाते हैं’ वन्य पशुओं द्वारा उसे खा डालने का चित्र संक्षेप और स्वाभाविक ढंग से देता है।
