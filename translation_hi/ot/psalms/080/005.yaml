  text: You have fed them bread of tears[a], and given them tears to drink in full measure.
translation:
  language: hi
  text: तूने उन्हें आँसुओं की रोटी खिलाई है और उन्हें भरपूर मात्रा में आँसू पिलाए हैं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी में: “तीसरे माप के अनुसार आँसू” या “तीनगुनी मात्रा में।” अंतिम शब्द सम्भवतः किसी बड़े माप को दर्शाता है, पर उसका ठीक अर्थ अनिश्चित है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶאֱכַלְתָּם
  choice: तूने उन्हें ... खिलाई है
  rationale: अכל के हिफ़ील रूप में 3 पुं. बहु. कर्म-प्रत्यय है; यह ‘उन्हें खाने को देना/खिलाना’ व्यक्त करता है। पूर्ण क्रिया को वर्तमान प्रभाव सहित ‘खिलाई है’ से व्यक्त किया गया है।
- source_word: לֶחֶם דִּמְעָה
  choice: आँसुओं की रोटी
  rationale: ‘रोटी’ और ‘आँसू’ की सजीव इब्रानी उपमा को सामान्यीकृत करके ‘दुःख का भोजन’ नहीं बनाया गया।
- source_word: וַתַּשְׁקֵמוֹ
  choice: और ... पिलाए हैं
  rationale: שׁקה का हिफ़ील ‘पीने को देना/पिलाना’ है; बहुवचन कर्म ‘उन्हें’ पहली पंक्ति से स्वाभाविक रूप से समझ में आता है और समानांतरता बनी रहती है।
- source_word: בִּדְמָעוֹת
  choice: आँसू
  rationale: पीने की क्रिया के साथ यह पिलाए गए द्रव्य को बताता है; हिन्दी में ‘आँसू पिलाना’ स्वाभाविक है।
- source_word: שָׁלִישׁ
  choice: भरपूर मात्रा में
  rationale: यहाँ शब्द किसी अस्पष्ट माप अथवा तीन गुनी मात्रा का संकेत दे सकता है। मुख्य पाठ में प्रचुरता का भाव रखा गया है, जबकि शाब्दिक संभावनाएँ पाद-टिप्पणी में दी गई हैं।
