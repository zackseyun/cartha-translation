  text: לִ/פְנֵ֤י אֶפְרַ֨יִם וּ/בִנְיָ֘מִ֤ן וּ/מְנַשֶּׁ֗ה עוֹרְרָ֥/ה אֶת גְּבֽוּרָתֶ֑/ךָ וּ/לְכָ֖/ה לִ/ישֻׁעָ֣תָ/ה לָּֽ/נוּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/080/002.yaml
  text: Before Ephraim and Benjamin and Manasseh[b][a], stir up your might and come to save us.
translation:
  language: hi
  text: एप्रैम, बिन्यामीन और मनश्शे के सामने अपना पराक्रम जगा[a], और आकर हमारा उद्धार कर[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपना सामर्थ्य जगा” अथवा “अपनी शक्ति जगा।”
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “और हमारे उद्धार के लिए चल”; इस प्रसंग में यह अपने लोगों की सहायता के लिए परमेश्वर के हस्तक्षेप की विनती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לִפְנֵי
  choice: के सामने
  rationale: यह स्थान-सूचक अर्थ को स्वाभाविक हिन्दी में रखता है और परमेश्वर के इन गोत्रों के सम्मुख प्रकट होने या उनके आगे बढ़ने की छवि को अनावश्यक रूप से स्पष्ट नहीं करता।
- source_word: אֶפְרַיִם וּבִנְיָמִן וּמְנַשֶּׁה
  choice: एप्रैम, बिन्यामीन और मनश्शे
  rationale: गोत्रों के पारंपरिक हिन्दी नाम रखे गए हैं; सूची को आधुनिक हिन्दी विराम-चिह्नों के अनुसार सहज बनाया गया है।
- source_word: עוֹרְרָה
  choice: जगा
  rationale: आज्ञार्थक विनती में निहित ‘जगाने/सक्रिय करने’ की रूपकात्मक छवि को संक्षिप्त और स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: אֶת גְּבוּרָתֶךָ
  choice: अपना पराक्रम
  rationale: גְּבוּרָה के सामर्थ्य, वीर्य और प्रभावी शक्ति के अर्थ को प्रार्थना के गरिमापूर्ण काव्यात्मक स्तर पर व्यक्त करता है।
- source_word: וּלְכָה
  choice: और आकर
  rationale: मूल क्रिया הלך का शाब्दिक अर्थ ‘जा/चल’ है, पर याचकों की ओर दैवी हस्तक्षेप की इस प्रार्थना में हिन्दी का ‘आकर’ प्रसंगानुकूल है; शाब्दिक विकल्प पादटिप्पणी में सुरक्षित है।
- source_word: לִישֻׁעָתָה לָּנוּ
  choice: हमारा उद्धार कर
  rationale: शाब्दिक संज्ञात्मक वाक्यांश ‘हमारे उद्धार के लिए’ का प्रयोजनात्मक अर्थ सहज हिन्दी में क्रियात्मक रूप से व्यक्त करता है।
theological_decisions:
- issue: प्रार्थना में परमेश्वर की सक्रियता का निरूपण
  choice: अपना पराक्रम जगाने और आकर उद्धार करने की सीधी विनती
  alternative: अपना सामर्थ्य जगा और हमारे उद्धार के लिए चल
  rationale: यह पद की प्रार्थनात्मक तात्कालिकता को बनाए रखता है, पर दैवी कार्य की रीति के बारे में कोई अतिरिक्त धर्मवैज्ञानिक दावा नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, काव्यात्मक और प्रार्थनापूर्ण शैली। ‘पराक्रम जगा’ मूल रूपक को बचाता है, जबकि ‘आकर हमारा उद्धार कर’ सामान्य पाठक के लिए आशय स्पष्ट करता है।
