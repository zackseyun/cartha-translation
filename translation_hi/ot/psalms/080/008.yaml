    reason: lexical_alternative
lexical_decisions:
- source_word: גֶּפֶן
  choice: एक दाखलता
  rationale: यह शब्द अंगूर की बेल को दर्शाता है। ‘दाखलता’ हिंदी बाइबलीय काव्य में स्वाभाविक और गरिमापूर्ण है तथा इस्राएल के रूपक को बिना खोले बनाए रखता है।
- source_word: מִמִּצְרַיִם
  choice: मिस्र से
  rationale: מִן स्रोत या प्रस्थान-बिंदु बताता है; ‘मिस्र से’ हिंदी में स्वाभाविक है और निर्गमन की पृष्ठभूमि को स्पष्ट रखता है।
- source_word: תַּסִּיעַ
  choice: निकाल लाया
  rationale: נסע के हिफ़ील रूप में उखाड़ने, प्रस्थान कराने या एक स्थान से दूसरे स्थान ले जाने का भाव हो सकता है। दाखलता के रूपक और निर्गमन की घटना—दोनों के संदर्भ में ‘निकाल लाया’ सहज है, जबकि अन्य संभावनाएँ पाद-टिप्पणी में सुरक्षित हैं।
- source_word: תְּגָרֵשׁ
  choice: खदेड़ दिया
  rationale: גרש का पिएल रूप बलपूर्वक निकालने या भगा देने का अर्थ देता है। ‘खदेड़ दिया’ क्रिया की तीव्रता और भूमि से राष्ट्रों को हटाने का भाव व्यक्त करता है।
- source_word: גּוֹיִם
  choice: जातियों
  rationale: इस भूमि-संबंधी संदर्भ में גּוֹיִם का अर्थ विभिन्न राष्ट्र या जातियाँ हैं। ‘जातियों’ से बाद के धार्मिक अर्थ वाला ‘गैर-यहूदी’ शब्द अनावश्यक रूप से आरोपित नहीं होता।
- source_word: וַתִּטָּעֶהָ
  choice: और उसे रोप दिया
  rationale: क्रिया का अर्थ ‘रोपना’ है और स्त्रीलिंग प्रत्यय दाखलता की ओर संकेत करता है। हिंदी में ‘उसे’ व्याकरणिक लिंग के अनुरूप होने के साथ स्वाभाविक भी है।
theological_decisions:
- issue: दाखलता के रूपक की पहचान
  choice: मुख्य पाठ में ‘दाखलता’ का रूपक बनाए रखा गया है।
  alternative: ‘तू इस्राएल को मिस्र से निकाल लाया।’
  rationale: इब्रानी पाठ इस्राएल को सीधे नाम देने के बजाय दाखलता के रूप में प्रस्तुत करता है। मुख्य पाठ में ‘इस्राएल’ जोड़ना अनुवाद से आगे बढ़कर व्याख्या करना होता; इसलिए पहचान को पाद-टिप्पणी में बताया गया है।
- issue: תַּסִּיעַ में गति और उखाड़ने का संयुक्त भाव
  choice: ‘निकाल लाया’ चुना गया है।
  alternative: ‘यात्रा कराकर लाया’ या ‘उखाड़कर लाया’
  rationale: मूल क्रिया प्रस्थान कराने और पौधे को उखाड़कर दूसरी जगह लगाने—दोनों चित्रों को जगा सकती है। मुख्य पाठ में सहज हिंदी रखी गई है और वास्तविक शब्दार्थगत तनाव पाद-टिप्पणी में सुरक्षित किया गया है।
translation_notes:
  register: आधुनिक मानक हिंदी में संक्षिप्त, काव्यात्मक और गरिमापूर्ण शैली अपनाई गई है। परमेश्वर के लिए एकवचन आत्मीय संबोधन ‘तू’ भजन-साहित्य की सीधी प्रार्थनात्मक वाणी के अनुरूप है।
