source:
  edition: WLC
  text: אֱלֹהִ֣ים צְבָאוֹת֮ שֽׁ֫וּב נָ֥א הַבֵּ֣ט מִ/שָּׁמַ֣יִם וּ/רְאֵ֑ה וּ֝/פְקֹ֗ד גֶּ֣פֶן זֹֽאת־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/080/014.yaml
  text: God of hosts[a], please return; look down from heaven and see, and visit this vine.
translation:
  language: hi
  text: हे सेनाओं के परमेश्वर, कृपा करके लौट आ; स्वर्ग से नीचे दृष्टि कर और देख, और इस दाख की बेल की सुधि ले[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इस दाख की बेल को देखने आ।” इब्रानी क्रिया का अर्थ ‘भेंट करना,’ ‘ध्यान देना,’ ‘देखभाल करना,’ या ‘निरीक्षण करना’ हो सकता है; यहाँ आशय उसके कल्याण के लिए हस्तक्षेप करने का है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהִים צְבָאוֹת
  choice: सेनाओं के परमेश्वर
  rationale: यह उपाधि परमेश्वर को स्वर्गीय सेनाओं के अधिपति के रूप में संबोधित करती है। ‘सेनाओं के परमेश्वर’ सैन्य और ब्रह्मांडीय बिंब को बनाए रखता है; ‘सर्वशक्तिमान परमेश्वर’ अधिक व्याख्यात्मक होता।
- source_word: שׁוּב נָא
  choice: कृपा करके लौट आ
  rationale: שׁוּב का सीधा अर्थ ‘लौट’ है और נָא विनती को व्यक्त करता है। एकवचन संबोधन के कारण ‘लौट आ’ स्वाभाविक है।
- source_word: הַבֵּט מִשָּׁמַיִם
  choice: स्वर्ग से नीचे दृष्टि कर
  rationale: הבט ध्यानपूर्वक देखने का आग्रह है। ‘नीचे’ स्वर्ग से देखने की स्थानिक दिशा को स्वाभाविक हिंदी में स्पष्ट करता है।
- source_word: וּרְאֵה
  choice: और देख
  rationale: सरल आज्ञार्थक क्रिया को बनाए रखा गया है; यह पहले देखने के आग्रह के साथ काव्यात्मक क्रम बनाती है।
- source_word: וּפְקֹד
  choice: और ... की सुधि ले
  rationale: פקד के अर्थ-क्षेत्र में भेंट करना, ध्यान देना, देखभाल करना और हस्तक्षेप करना शामिल है। इस विनती में ‘सुधि ले’ हितकारी ध्यान और देखभाल का भाव देता है, बिना क्रिया को जरूरत से अधिक निश्चित किए।
- source_word: גֶּפֶן זֹאת
  choice: इस दाखलता
  rationale: גפן एकवचन में ‘दाखलता’ है, ‘दाख की बारी’ नहीं। इससे इस्राएल के लिए प्रयुक्त मूल रूपक ठीक बना रहता है।
theological_decisions:
- issue: ईश्वरीय उपाधि का अनुवाद
  choice: सेनाओं के परमेश्वर
  alternative: सर्वशक्तिमान परमेश्वर
  rationale: मूल उपाधि परमेश्वर की स्वर्गीय सेनाओं पर प्रभुता का बिंब रखती है। ‘सर्वशक्तिमान’ अर्थ की सामान्य व्याख्या तो देता है, पर मूल सैन्य/ब्रह्मांडीय रूपक को हटा देता है।
- issue: פקד में निहित ईश्वरीय हस्तक्षेप
  choice: इस दाखलता की सुधि ले
  alternative: इस दाखलता को देखने आ
  rationale: संदर्भ अनुकूल हस्तक्षेप की प्रार्थना करता है, किंतु क्रिया अपने आप में देखभाल, निरीक्षण या भेंट—इनमें से किसी एक अर्थ को पूर्णतः निश्चित नहीं करती। ‘सुधि ले’ इस अर्थ-विस्तार और हितकारी संदर्भ दोनों को संभालता है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण प्रार्थनात्मक शैली रखी गई है। परमेश्वर के लिए एकवचन निकट संबोधन ‘लौट आ’, ‘दृष्टि कर’, ‘देख’ और ‘सुधि ले’ मूल के लगातार एकवचन आज्ञार्थकों को दर्शाता है। ‘दाखलता’ रूपक की सटीकता के लिए चुना गया है।
