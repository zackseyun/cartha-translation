  source_fidelity: The rendering accurately retains the vocative divine title, the entreaty ‘please return,’ the paired imperatives to look from heaven and see, and the favorable/intervention-oriented sense of פקד. ‘सुधि ले’ is a good contextual rendering of the final imperative, provided its lexical breadth is noted.
