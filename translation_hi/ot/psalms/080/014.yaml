    rationale: ‘दाख की बेल’ is more readily understood while preserving the Hebrew singular ‘vine,’ rather than changing it to ‘vineyard.’
  - severity: low
    issue: The lexical ambiguity of וּפְקֹד is not represented by a footnote in the Hindi draft.
    rationale: The source audit trail identifies ‘visit,’ ‘attend to,’ ‘care for,’ and ‘inspect’ as viable senses. A concise Hindi note preserves this without forcing one interpretation.
