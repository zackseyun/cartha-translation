  text: יְהוָ֣ה אֱלֹהִ֣ים צְבָא֑וֹת עַד מָתַ֥י עָ֝שַׁ֗נְתָּ בִּ/תְפִלַּ֥ת עַמֶּֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/080/004.yaml
  text: O Yahweh God of hosts[a], how long will you smoke against the prayer of your people?
translation:
  language: hi
  text: हे यहवे, सेनाओं के परमेश्वर, कब तक तू अपनी प्रजा की प्रार्थना के विरुद्ध क्रोध में धुआँ उगलता रहेगा?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक भाव: “तू अपनी प्रजा की प्रार्थना के विरुद्ध कब तक धुआँ करता रहेगा?” इब्रानी क्रिया का मूल बिंब धुएँ का है; यहाँ वह परमेश्वर के क्रोध को चित्रात्मक ढंग से व्यक्त करता है।'
    reason: शाब्दिक धुआँ-बिंब और क्रोध के प्रसंगगत अर्थ को स्पष्ट करता है तथा ‘अपनी प्रजा’ के मूल संबंध को बनाए रखता है।
lexical_decisions:
- source_word: יְהוָה
  choice: यहवे
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम को किसी उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: אֱלֹהִים צְבָאוֹת
  choice: सेनाओं के परमेश्वर
  rationale: यह प्रचलित और सुबोध पदवी צְבָאוֹת के सैन्य अथवा ब्रह्मांडीय विस्तार को किसी एक अर्थ तक सीमित नहीं करती।
- source_word: עַד מָתַי
  choice: कब तक
  rationale: विलाप में प्रयुक्त इब्रानी प्रश्नसूचक पद का स्वाभाविक हिन्दी रूप, जो शिकायत की तात्कालिकता बनाए रखता है।
- source_word: עָשַׁנְתָּ
  choice: क्रोध में धुआँ उगलता रहेगा
  rationale: इब्रानी क्रिया के धुएँ अथवा फुँफकारने जैसे सजीव बिंब को बनाए रखते हुए हिन्दी में उसके निहित क्रोध को स्पष्ट और स्वाभाविक बनाया गया है।
- source_word: בִּתְפִלַּת
  choice: प्रार्थना के विरुद्ध
  rationale: यहाँ ב को विरोधात्मक संबंध में समझा गया है; इससे वह असहज धर्मवैचारिक तनाव बना रहता है कि परमेश्वर का क्रोध उसकी प्रजा की प्रार्थना के ही विरुद्ध है।
- source_word: עַמֶּךָ
  choice: अपनी प्रजा
  rationale: यह वाचाई समुदाय के सामूहिक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: יְהוָה אֱלֹהִים צְבָאוֹת का अनुवाद
  choice: हे यहवे, सेनाओं के परमेश्वर
  alternative: हे प्रभु, सेनाओं के परमेश्वर
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम स्पष्ट रूप से उपस्थित है; इसलिए उसे उपाधि से प्रतिस्थापित नहीं किया गया।
- issue: धुआँ उठने के क्रोध-बिंब को बनाए रखना
  choice: क्रोध में धुआँ उगलता रहेगा
  alternative: क्रोधित रहेगा
  rationale: सिर्फ ‘क्रोधित रहेगा’ कहना कविता के मानवीकरण और तीखे दृश्य-बिंब को मिटा देता; चुना हुआ रूप बिंब और उसका आशय दोनों संप्रेषित करता है।
- issue: प्रार्थना के साथ विरोधात्मक संबंध
  choice: प्रार्थना के विरुद्ध
  alternative: प्रार्थना पर
  rationale: ‘विरुद्ध’ इब्रानी पूर्वसर्ग की संभावित विरोधात्मक शक्ति और विलाप के कठिन धर्मवैचारिक तनाव को स्पष्ट रखता है।
