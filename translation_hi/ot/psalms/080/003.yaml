lexical_decisions:
- source_word: אֱלֹהִים
  choice: हे परमेश्वर
  rationale: यहाँ बहुवचन-रूप वाला शब्द इस्राएल के एकमात्र परमेश्वर के लिए प्रयुक्त है और प्रत्यक्ष संबोधन स्पष्ट है। आधुनिक हिंदी में संबोधन को स्वाभाविक बनाने के लिए ‘हे परमेश्वर’ उपयुक्त है।
- source_word: הֲשִׁיבֵנוּ
  choice: हमें फिर से लौटा ला
  rationale: שׁוב के हिफ़ील रूप का कारणवाचक अर्थ ‘हमें लौटने दे/लौटा ला’ है। यह पद समुदाय को परमेश्वर की ओर लौटाने और उसकी दशा बहाल करने—दोनों अर्थ-संभावनाओं को खुला रखता है।
- source_word: וְהָאֵר פָּנֶיךָ
  choice: अपने मुख का प्रकाश हम पर चमका
  rationale: हिफ़ील आज्ञार्थक का कारणवाचक भाव और ‘मुख’ की मूल छवि दोनों सुरक्षित हैं। हिंदी में ‘मुख का प्रकाश ... चमका’ ईश्वरीय अनुग्रह और उपस्थिति की बोधगम्य, गरिमापूर्ण अभिव्यक्ति है।
- source_word: וְנִוָּשֵׁעָה
  choice: और हम उद्धार पाएँ
  rationale: निफ़ाल प्रथम पुरुष बहुवचन का इच्छासूचक रूप प्रार्थित परिणाम को व्यक्त करता है। ‘उद्धार पाएँ’ कर्मवाच्य अर्थ और प्रार्थनापूर्ण भाव को बनाए रखता है, जबकि ‘और’ मूल समुच्चय को सुरक्षित रखकर उद्देश्य और आश्वस्त परिणाम की संभावित ध्वनियों को पूरी तरह बंद नहीं करता।
theological_decisions:
- issue: अंतिम क्रिया का इच्छासूचक भाव और पिछले आज्ञार्थकों से उसका संबंध
  choice: ‘और हम उद्धार पाएँ’—इच्छित परिणाम व्यक्त करने वाली प्रार्थना
  alternative: ‘और हम उद्धार पाएँगे’—परिणाम का आश्वस्त कथन
  rationale: आज्ञार्थकों के बाद आया रूप प्रार्थित परिणाम के रूप में स्वाभाविक है, पर मूल ‘और’ को रखते हुए उस आश्वस्त परिणति की ध्वनि भी सुरक्षित रहती है।
- issue: ‘मुख चमकाने’ की रूपकात्मक भाषा
  choice: मुख और प्रकाश की मूल छवि को बनाए रखना
  alternative: इसे सीधे ‘हम पर कृपा कर’ कहना
  rationale: मूल रूपक ईश्वरीय अनुग्रह और उपस्थिति व्यक्त करता है तथा गिनती 6:25 की याजकीय आशीष से भाषिक संबंध रखता है; सीधे अर्थ खोल देने से यह प्रतिध्वनि खो जाएगी।
translation_notes:
  register: आधुनिक मानक हिंदी का प्रार्थनापूर्ण, गरिमामय और सामान्य पाठकों के लिए सहज रूप। ‘मुख’ और ‘उद्धार’ जैसे पारंपरिक किन्तु आज भी बोधगम्य शब्द मूल की काव्यात्मक तथा धर्मवैचारिक गहराई बनाए रखते हैं।
