  text: आग से जली हुई, काट डाली गई—तेरे मुख की डाँट से वे नाश होते हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׂרֻפָה בָאֵשׁ
  choice: आग से जली हुई
  rationale: स्त्रीलिंग कर्मवाच्य रूप को पिछले पद की दाखलता से जोड़ते हुए मूल की खंडित काव्यात्मक संरचना बनाए रखी गई है।
- source_word: כְּסוּחָה
  choice: काट डाली गई
  rationale: शब्द वनस्पति के काटे या छाँटे जाने को दर्शाता है; संदर्भ में दाखलता के विनाश के लिए ‘काट डाली गई’ स्वाभाविक है।
- source_word: מִגַּעֲרַת פָּנֶיךָ
  choice: तेरे मुख की डाँट से
  rationale: ‘मुख’ को हटाकर केवल ‘तेरी डाँट’ कहना अधिक सहज होता, पर मूल की ठोस और न्याय-सूचक अभिव्यक्ति को सुरक्षित रखा गया है।
- source_word: יֹאבֵדוּ
  choice: वे नाश हो जाएँ
  rationale: अपूर्ण क्रिया यहाँ परिणाम या विनती-सदृश भाव दे सकती है; ‘नाश हो जाएँ’ उस तनाव को बनाए रखता है और इसे निश्चित वर्तमान कथन में नहीं बदलता।
theological_decisions:
- issue: अंतिम क्रिया को कथन या विनती के रूप में प्रस्तुत करना
  choice: वे नाश हो जाएँ
  alternative: वे नाश होते हैं / वे नाश हो जाएँगे
  rationale: हिब्रू अपूर्ण रूप का भाव संदर्भ में पूर्णतः निश्चित नहीं है। यह चयन भजन की प्रार्थनात्मक धारा और परिणामसूचक अर्थ दोनों के लिए स्थान रखता है।
- issue: ‘तेरे मुख’ की मानवरूपी ईश्वरीय भाषा
  choice: तेरे मुख की डाँट
  alternative: तेरी डाँट
  rationale: मूल रूपक को बिना व्याख्यात्मक रूप से नरम किए सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और काव्यात्मक हिन्दी। आरंभिक दो स्त्रीलिंग कर्मवाच्य पदबंध पिछली पंक्ति की दाखलता को संकेत करते हैं; डैश हिब्रू की संक्षिप्त, तीखी गति बनाए रखता है।
