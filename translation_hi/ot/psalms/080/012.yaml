  choice: ‘उसकी/उसे’ द्वारा पहले वर्णित दाखलता की ओर संकेत बनाए रखा गया है
  alternative: रूपक को खोलकर सीधे इस्राएल कहना, या ‘उसके फल’ जोड़ना
  rationale: निकटवर्ती संदर्भ में इस्राएल को दाखलता के रूप में चित्रित किया गया है। सर्वनाम रूपक और मूल की संक्षिप्तता को सुरक्षित रखते हैं।
translation_notes:
