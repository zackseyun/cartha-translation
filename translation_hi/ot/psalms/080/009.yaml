id: PSA.80.9
reference: Psalms 80:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: פִּנִּ֥יתָ לְ/פָנֶ֑י/הָ וַ/תַּשְׁרֵ֥שׁ שָׁ֝רָשֶׁ֗י/הָ וַ/תְּמַלֵּא אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/080/009.yaml
  text: You cleared the ground before it[c][b][a], and it took root and filled the land.
translation:
  language: hi
  text: तूने उसके आगे जगह साफ़ की[a]; उसने अपनी जड़ें जमा लीं[b] और देश[c] को भर दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तूने उसके लिए जगह तैयार की।” इब्रानी क्रिया बेल के आगे से बाधाएँ हटाने अथवा उसके लिए स्थान तैयार करने का भाव दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “उसने अपनी जड़ें जड़ दीं”; यह इब्रानी अभिव्यक्ति उसके दृढ़ता से स्थापित हो जाने का भाव देती है।
    reason: lexical_alternative
  - marker: c
    text: या, “पृथ्वी।” इब्रानी शब्द का अर्थ प्रसंग के अनुसार स्थानीय ‘देश’ अथवा व्यापक ‘पृथ्वी’ हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּנִּיתָ לְפָנֶיהָ
  choice: तूने उसके आगे जगह साफ़ की
  rationale: पִּנִּיתָ (पिएल) और לְפָנֶיהָ का संयुक्त भाव बेल के आगे से बाधाएँ हटाकर उसके फैलने के लिए स्थान तैयार करना है। यह रूप कृषि-रूपक को स्वाभाविक और सजीव रखता है।
- source_word: וַתַּשְׁרֵשׁ שָׁרָשֶׁיהָ
  choice: उसने अपनी जड़ें जमा लीं
  rationale: इब्रानी में शाब्दिक रूप से ‘उसने अपनी जड़ें जड़ दीं’ जैसा बलाघात है। ‘जड़ें जमा लीं’ आधुनिक हिन्दी में दृढ़ता से स्थापित होने का स्वाभाविक वनस्पति-संबंधी मुहावरा है और बिना किसी अनुल्लिखित तीव्रता को जोड़े मूल भाव सुरक्षित रखता है।
- source_word: וַתְּמַלֵּא
  choice: भर दिया
  rationale: מלא का मूल अर्थ ‘भरना’ है। यह बेल के व्यापक रूप से फैलकर पूरे क्षेत्र को व्याप्त करने की छवि बनाए रखता है।
- source_word: אָרֶץ
  choice: देश
  rationale: אֶרֶץ का अर्थ प्रसंगानुसार ‘देश/भूमि’ या ‘पृथ्वी’ हो सकता है। यहाँ इस्राएल की बेल और उसके फैलाव के प्रसंग में ‘देश’ अधिक संभावित स्थानीय अर्थ है; व्यापक विकल्प पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: बेल के रूपक का संदर्भ
  choice: पद में बेल के रूपक को उसी रूप में बनाए रखा गया है; ‘इस्राएल’ को मुख्य पाठ में स्पष्टतः नहीं जोड़ा गया।
  alternative: ‘इस्राएल ने जड़ पकड़ ली और देश को भर दिया’ जैसे व्याख्यात्मक विस्तार से रूपक खोल देना।
  rationale: आसपास का भजन बेल को इस्राएल से जोड़ता है, पर इस पद का इब्रानी पाठ रूपक में ही बोलता है। इसलिए अनकही व्याख्या को मुख्य पाठ में जोड़ने के बजाय मूल काव्यात्मक तनाव सुरक्षित रखा गया है।
- issue: אָרֶץ का भौगोलिक विस्तार
  choice: देश
  alternative: पृथ्वी
  rationale: निकट प्रसंग स्थानीय भूमि की ओर संकेत करता है, पर इब्रानी शब्द व्यापक अर्थ भी ले सकता है; इसलिए वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सरल, काव्यात्मक और गरिमापूर्ण रखी गई है। स्त्रीलिंग बेल के लिए सर्वनाम ‘उसके/उसने’ स्वाभाविक रूप से प्रयुक्त है। ‘जड़ें जमा लीं’ सामान्य पाठक के लिए सहज है और मूल की पुनरुक्ति का अर्थगत बल बनाए रखता है।
