  yaml_path: translation/ot/psalms/080/007.yaml
  text: God of hosts[a], restore us; make your face shine[c][b], and we will be saved.
translation:
  language: hi
  text: हे सेनाओं के परमेश्वर[a], हमें बहाल कर[b]; अपना मुख चमका[c], और हम उद्धार पाएँगे[d]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘सेनाएँ’ स्वर्गीय सेनाओं अथवा परमेश्वर के अधीन समस्त शक्तियों की ओर संकेत कर सकती हैं।
    reason: lexical_alternative
  - marker: b
    text: या ‘हमें वापस ले आ’ अथवा ‘हमें फेर।’ इब्रानी क्रिया लौटाने और बहाल करने—दोनों का भाव व्यक्त कर सकती है।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से ‘अपना मुख चमका।’ यह मुहावरा परमेश्वर की अनुकूल और कृपामय उपस्थिति को दर्शाता है।
    reason: lexical_alternative
  - marker: d
    text: या ‘हम छुड़ाए जाएँगे’ अथवा ‘ताकि हम उद्धार पाएँ।’ इब्रानी में व्यापक रूप से बचाव या उद्धार का भाव है।
    reason: alternative_reading
lexical_decisions:
- source_word: אֱלֹהִים צְבָאוֹת
  choice: हे सेनाओं के परमेश्वर
  rationale: यहाँ पदबंध सीधे संबोधन में प्रयुक्त एक ईश्वरीय उपाधि है। ‘सेनाओं’ से इब्रानी צְבָאוֹת की व्यापक सामर्थ्य और अधीन शक्तियों का भाव बना रहता है; इसे केवल मानवीय सेनाओं या केवल स्वर्गीय प्राणियों तक सीमित नहीं किया गया।
- source_word: הֲשִׁיבֵנוּ
  choice: हमें बहाल कर
  rationale: שׁוב के हिफ़ील रूप में लौटाने और पूर्व दशा में फिर स्थापित करने—दोनों का भाव संभव है। ‘बहाल कर’ भजन के निवेदन में स्वाभाविक है और भौगोलिक, आत्मिक या वाचागत वापसी में से किसी एक को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: וְהָאֵר פָּנֶיךָ
  choice: अपना मुख चमका
  rationale: אור का हिफ़ील रूप कारणवाचक है और פָּנֶיךָ का ठोस बिंब ‘तेरा मुख’ है। हिंदी में संक्षिप्त काव्यात्मक अभिव्यक्ति मूल बिंब को बनाए रखती है; इसका आशय परमेश्वर की अनुकूल उपस्थिति से है।
- source_word: וְנִוָּשֵׁעָה
  choice: और हम उद्धार पाएँगे
  rationale: ישׁע का निफ़ाल रूप बचाए जाने या छुड़ाए जाने को व्यक्त करता है। ‘उद्धार पाएँगे’ ऐतिहासिक संकट से बचाव और व्यापक उद्धार—दोनों संभावनाएँ खुली रखता है।
theological_decisions:
- issue: ईश्वरीय उपाधि אֱלֹהִים צְבָאוֹת का दायरा
  choice: सेनाओं के परमेश्वर
  alternative: स्वर्गीय सेनाओं के परमेश्वर; सेनाओं के ईश्वर
  rationale: यह रूप परमेश्वर की समस्त शक्तियों पर प्रभुता को व्यक्त करता है, पर ‘सेनाओं’ को केवल मानवीय या केवल स्वर्गीय सेना मानकर अर्थ को संकरा नहीं करता।
- issue: וְנִוָּשֵׁעָה में उद्धार का स्वरूप
  choice: हम उद्धार पाएँगे
  alternative: हम बचाए जाएँगे; हम छुड़ाए जाएँगे
  rationale: मूल शब्द व्यापक बचाव को सूचित कर सकता है। चुना हुआ रूप धार्मिक अर्थवत्ता बनाए रखता है, फिर भी इसे केवल आत्मिक उद्धार या केवल तत्काल ऐतिहासिक छुटकारे तक सीमित नहीं करता।
- issue: वाक्य के अंतिम खंड का संबंध
  choice: और हम उद्धार पाएँगे
  alternative: ताकि हम उद्धार पाएँ
  rationale: वाव और क्रियारूप को परिणामसूचक कथन के रूप में प्रस्तुत किया गया है, जैसा इस आवर्ती प्रार्थना में स्वाभाविक है; प्रयोजनसूचक अर्थ भी व्याकरणतः निकट है, इसलिए उसे टिप्पणी में खुला रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और प्रार्थनात्मक रखी गई है। एकवचन संबोधन के अनुरूप ‘कर’ और ‘चमका’ प्रयुक्त हैं। मूल की संक्षिप्त समानांतर रचना तथा ‘मुख’ का बाइबलीय बिंब सुरक्षित रखा गया है; जहाँ हिंदी पाठ से अर्थ अत्यधिक संकरा हो सकता था, वहाँ पादटिप्पणी दी गई है।
