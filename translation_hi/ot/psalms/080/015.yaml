source:
  edition: WLC
  text: וְ֭/כַנָּה אֲשֶׁר נָטְעָ֣ה יְמִינֶ֑/ךָ וְ/עַל בֵּ֝֗ן אִמַּ֥צְתָּה לָּֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/080/015.yaml
  text: and the stock that your right hand planted[b][a], and the son whom you made strong for yourself—
translation:
  language: hi
  text: 'और उस पौधे[a] की, जिसे तेरे दाहिने हाथ ने लगाया,

    और उस पुत्र[b] की, जिसे तूने अपने लिए सामर्थी बनाया—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अंकुर,” “शाखा,” अथवा “मूल तना।” यहाँ प्रयुक्त इब्रानी शब्द दुर्लभ है और इस भजन की दाखलता-वाली उपमा में आया है।
    reason: lexical_alternative
  - marker: b
    text: या “शाखा।” इब्रानी में “पुत्र” है, पर कुछ लोग इसे दाखलता की उपमा में एक शाखा या सामूहिक रूप से इस्राएल के लिए प्रयुक्त शब्द समझते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: כַנָּה
  choice: पौधा
  rationale: यह दुर्लभ संज्ञा भजन की दाखलता-वाली उपमा में आती है। ‘पौधा’ वनस्पति-संबंधी अर्थ को बनाए रखता है, पर यह अनावश्यक रूप से तय नहीं करता कि आशय अंकुर, शाखा या मूल तना है।
- source_word: נָטְעָה
  choice: लगाया
  rationale: נטע का सामान्य अर्थ पौधा लगाना है। ‘लगाया’ आधुनिक हिन्दी में स्वाभाविक है और खेती की उपमा को बनाए रखता है।
- source_word: יְמִינֶךָ
  choice: तेरे दाहिने हाथ
  rationale: शाब्दिक देहात्मक बिंब को बनाए रखा गया है; इसे केवल ‘तेरी शक्ति’ कहने से मूल का सजीव चित्र सपाट हो जाता।
- source_word: וְעַל
  choice: और ... की
  rationale: यह पिछले पद की विनती के समानांतर कर्मों को जोड़ता है। हिन्दी में ‘की’ का प्रयोग उस पूर्ववर्ती क्रिया से संबंध बनाए रखता है, जबकि ‘और’ समन्वय को व्यक्त करता है।
- source_word: בֵּן
  choice: पुत्र
  rationale: मूल शब्द का सामान्य अर्थ ‘पुत्र’ है। दाखलता के संदर्भ में इसे ‘शाखा’ समझा जा सकता है, पर मुख्य पाठ में ‘पुत्र’ रखने से मूल का व्यक्तिकरण और सामूहिक/धर्मवैचारिक तनाव सुरक्षित रहता है।
- source_word: אִמַּצְתָּה
  choice: सामर्थी बनाया
  rationale: पिएल रूप किसी को दृढ़ या बलवान बनाने का कारणवाचक भाव देता है। ‘सामर्थी बनाया’ इस भाव को सहज, गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: לָּךְ
  choice: अपने लिए
  rationale: यह संबंध या हित का भाव व्यक्त करता है; ‘अपने लिए’ परमेश्वर के अपने उद्देश्य हेतु किए गए कार्य की प्रतिवर्ती छाया को स्पष्ट रखता है।
theological_decisions:
- issue: दाखलता की उपमा में ‘पुत्र’ की पहचान
  choice: मुख्य पाठ में मूल का ‘पुत्र’ रखा गया है और किसी विशिष्ट मसीही पहचान को स्पष्ट नहीं किया गया।
  alternative: इसे दाखलता की ‘शाखा’, सामूहिक रूप से इस्राएल, या प्रतिरूपात्मक/मसीही संकेत समझना।
  rationale: निकट संदर्भ में दाखलता इस्राएल का चित्र है, इसलिए यह पद सामूहिक उपमा के भीतर काम कर सकता है। फिर भी इब्रानी में स्पष्ट रूप से ‘पुत्र’ है। उसी को रखने से अनुवाद किसी एक धर्मवैचारिक व्याख्या को पाठ पर आरोपित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। परमेश्वर को संबोधन के लिए ‘तेरे/तूने’ का काव्यात्मक निकट संबोधन प्रयुक्त है। पद मूल में पिछले पद की विनती से व्याकरणिक रूप से जुड़ा हुआ है; इसलिए हिन्दी में ‘की’ रखकर उस अपूर्ण-समानांतर संरचना को संकेतित किया गया है और अंत में डैश बनाए रखा गया है।
