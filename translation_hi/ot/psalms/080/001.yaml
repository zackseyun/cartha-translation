id: PSA.80.1
reference: Psalms 80:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: רֹ֘עֵ֤ה יִשְׂרָאֵ֨ל הַאֲזִ֗ינָ/ה נֹהֵ֣ג כַּ/צֹּ֣אן יוֹסֵ֑ף יֹשֵׁ֖ב הַ/כְּרוּבִ֣ים הוֹפִֽיעָ/ה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/080/001.yaml
  text: Shepherd of Israel[a], give ear, you who lead Joseph like a flock; you who are enthroned above the cherubim[c][b], shine forth.
translation:
  language: hi
  text: 'हे इस्राएल के चरवाहे, ध्यान दे,

    तू जो यूसुफ[a] को भेड़ों के झुंड के समान ले चलता है;

    तू जो करूबों पर विराजमान है[b],

    तेज से प्रकट हो।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ ‘यूसुफ’ संभवतः इस्राएल के लोगों, विशेषकर उत्तरी गोत्रों, का प्रतिनिधित्व करता है; मूल इब्रानी पाठ में व्यक्ति-नाम ही है।
    reason: cultural_note
  - marker: b
    text: या ‘करूबों के बीच विराजमान है।’ इब्रानी में शाब्दिक रूप से ‘करूबों पर विराजने वाला’ है; यह परमेश्वर की राजकीय उपस्थिति के लिए प्रयुक्त अभिव्यक्ति है।
    reason: alternative_reading
lexical_decisions:
- source_word: רֹעֵה
  choice: चरवाहे
  rationale: यह רעה का कर्तृवाचक कृदंत है और परमेश्वर को संबोधित करने वाली उपाधि के रूप में प्रयुक्त हुआ है। ‘चरवाहे’ मूल रूपक और संबोधन दोनों को स्वाभाविक हिंदी में बनाए रखता है।
- source_word: הַאֲזִינָה
  choice: ध्यान दे
  rationale: आज्ञार्थक रूप का अर्थ ध्यानपूर्वक सुनना है। ‘ध्यान दे’ आधुनिक हिंदी में स्वाभाविक है और साधारण ‘सुन’ की अपेक्षा विनती की गंभीरता अधिक स्पष्ट करता है।
- source_word: נֹהֵג
  choice: ले चलता है
  rationale: चरवाही के संदर्भ में यह सक्रिय अगुवाई को व्यक्त करता है। ‘ले चलता है’ मार्गदर्शन का भाव रखता है और ‘हाँकता है’ से उत्पन्न कठोरता से बचता है।
- source_word: כַּצֹּאן
  choice: भेड़ों के झुंड के समान
  rationale: צאן एक सामूहिक संज्ञा है, जो छोटे पालतू पशुओं के झुंड को दर्शाती है। संदर्भ में ‘भेड़ों के झुंड’ चरवाही के बिंब को स्पष्ट और स्वाभाविक बनाता है।
- source_word: יוֹסֵף
  choice: यूसुफ
  rationale: मूल पाठ व्यक्ति-नाम को बनाए रखता है; इसलिए उसके सामूहिक संकेतार्थ को मुख्य पाठ में ‘इस्राएल’ कहकर नहीं बदला गया।
- source_word: יֹשֵׁב הַכְּרוּבִים
  choice: करूबों के ऊपर विराजमान है
  rationale: ישב यहाँ केवल बैठने नहीं, बल्कि राजकीय उपस्थिति और सिंहासनारूढ़ होने का भाव देता है। ‘विराजमान’ उस गरिमा को व्यक्त करता है; ‘ऊपर’ स्थानिक संबंध को अत्यधिक संकीर्ण किए बिना करूब-सिंहासन के बिंब को बनाए रखता है।
- source_word: הוֹפִיעָה
  choice: तेज के साथ प्रकट हो
  rationale: यह ईश-प्रकाशन के संदर्भ में दीप्तिमान होकर प्रकट होने का आग्रह है। यह अनुवाद प्रकट होने और तेज, दोनों भावों को सहज हिंदी में रखता है।
theological_decisions:
- issue: करूबों के संबंध में परमेश्वर की राजकीय उपस्थिति
  choice: करूबों के ऊपर विराजमान है
  alternative: करूबों के बीच विराजमान है / करूबों पर बैठा है
  rationale: मूल अभिव्यक्ति परमेश्वर की करूबों से संबद्ध सिंहासनमय उपस्थिति को दर्शाती है, पर सटीक स्थानिक संबंध को पूरी तरह स्पष्ट नहीं करती। मुख्य पाठ राजकीय भाव को रखता है और वैकल्पिक स्थानिक समझ को पादटिप्पणी में सुरक्षित करता है।
- issue: ‘यूसुफ’ का सामूहिक संकेतार्थ
  choice: मुख्य पाठ में ‘यूसुफ’ नाम बनाए रखा गया
  alternative: इस्राएल के लोग / उत्तरी गोत्र
  rationale: संदर्भ में यह नाम संभवतः इस्राएल, विशेषकर उत्तरी गोत्रों, का प्रतिनिधित्व करता है; फिर भी मूल पाठ जानबूझकर ‘यूसुफ’ कहता है, इसलिए उसकी काव्यात्मक और ऐतिहासिक तनावपूर्ण व्यापकता को नहीं मिटाया गया।
translation_notes:
  register: भाषा आधुनिक, काव्यात्मक और श्रद्धापूर्ण रखी गई है। मसोरी विराम के अनुरूप पद को दो समानांतर विनतियों में व्यवस्थित किया गया है। ‘ध्यान दे’ और ‘तेज के साथ प्रकट हो’ सामान्य पाठक के लिए बोधगम्य हैं, जबकि मूल की गंभीरता और ईश-प्रकाशन का बिंब बनाए रखते हैं।
