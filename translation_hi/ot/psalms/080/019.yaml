lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में परमेश्वर के वाचा-संबंधी नाम का प्रचलित लिप्यंतरण; इसे सामान्य उपाधि से नहीं बदला गया।
- source_word: אֱלֹהִים צְבָאוֹת
  choice: सेनाओं के परमेश्वर
  rationale: צְבָאוֹת की सैन्य/स्वर्गीय समूहों की छवि को बनाए रखते हुए हिन्दी में प्रतिष्ठित और बोधगम्य ईश्वरीय उपाधि।
- source_word: הֲשִׁיבֵנוּ
  choice: हमें फिर से स्थापित कर
  rationale: שוב के हिफ़ील आदेश में लौटाने और पूर्व दशा में बहाल करने—दोनों भाव संभव हैं; मुख्य पाठ में पुनर्स्थापना का व्यापक संदर्भगत अर्थ दिया गया है।
- source_word: הָאֵר פָּנֶיךָ
  choice: अपने मुख का प्रकाश हम पर चमका
  rationale: हिफ़ील की कारणवाचक शक्ति और ‘मुख’ की ठोस बाइबलीय छवि को स्वाभाविक हिन्दी में सुरक्षित रखा गया है; ‘हम पर’ हिन्दी मुहावरे में निहित लक्ष्य स्पष्ट करता है।
- source_word: וְנִוָּשֵׁעָה
  choice: और हम उद्धार पाएँगे
  rationale: वाव के समन्वयी बल तथा पूर्ववर्ती विनतियों के परिणाम को व्यक्त करता है; रूप के उद्देश्य/परिणाम संबंधी पाठ की संभावना पादटिप्पणी में रखी गई है।
theological_decisions:
- issue: יְהוָה אֱלֹהִים צְבָאוֹת का संबोधन
  choice: हे यहोवा, सेनाओं के परमेश्वर
  alternative: हे यहोवा सेनाओं के परमेश्वर
  rationale: विराम-चिह्न יהוה को वाचा-संबंधी नाम और ‘सेनाओं के परमेश्वर’ को उससे समानाधिकरण में आई उपाधि के रूप में स्पष्ट करता है, बिना अर्थ बदले।
- issue: וְנִוָּשֵׁעָה का बल
  choice: और हम उद्धार पाएँगे
  alternative: ताकि हम उद्धार पाएँ
  rationale: हिब्रू वाव और क्रिया-क्रम परिणाम तथा उद्देश्य दोनों की छाया दे सकते हैं। मुख्य पाठ समन्वयी/परिणामी संबंध रखता है और उद्देश्यात्मक संभावना पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी का प्रार्थनात्मक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट स्वर। एकवचन संबोधन में निकट और काव्यात्मक आदेश-रूप ‘कर/चमका’ रखा गया है।
