  text: It sent out its branches as far as the sea[b][a], and its shoots to the River.
translation:
  language: hi
  text: उसने अपनी डालियाँ समुद्र तक फैला दीं[a], और अपने अंकुर नदी तक[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ ‘डालियाँ’ के लिए प्रयुक्त इब्रानी शब्द असामान्य है; इसका अर्थ ‘बड़ी शाखाएँ’ या दाखलता की फैलती हुई बढ़त भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘नदी’ से संभवतः फरात नदी अभिप्रेत है। समुद्र से नदी तक का वर्णन इस्राएल की आदर्श भू-सीमा की ओर संकेत करता है।
    reason: cross_reference
lexical_decisions:
- source_word: תְּשַׁלַּח
  choice: फैला दीं
  rationale: पिएल रूप यहाँ दाखलता द्वारा अपनी बढ़त को दूर तक फैलाने का सक्रिय चित्र देता है; हिंदी में ‘फैला दीं’ स्वाभाविक है।
- source_word: קְצִירֶהָ
  choice: अपनी डालियाँ
  rationale: यह असामान्य शब्द इस दाखलता-संदर्भ में उसके फैलते हुए अंगों को सूचित करता है। ‘डालियाँ’ समानांतर ‘नई शाखाएँ’ से भेद रखते हुए सहज हिंदी देता है।
- source_word: עַד יָם
  choice: समुद्र तक
  rationale: עַד सीमा या विस्तार व्यक्त करता है, जिसे ‘तक’ ठीक प्रकार से दर्शाता है; संदर्भ में संभवतः भूमध्य सागर अभिप्रेत है।
- source_word: וְאֶל נָהָר
  choice: महानद तक
  rationale: भूमि-सीमा की बाइबलीय भाषा में נָהָר सामान्यतः फरात को सूचित करता है। हिंदी बाइबल परंपरा का ‘महानद’ संभावित विशिष्ट भौगोलिक संकेत को बनाए रखता है।
- source_word: יוֹנְקוֹתֶיהָ
  choice: अपनी नई शाखाएँ
  rationale: यह शब्द पौधे से निकलने वाली कोमल नई बढ़त को दर्शाता है; ‘नई शाखाएँ’ आधुनिक पाठक के लिए स्पष्ट और वनस्पति-चित्र के अनुकूल है।
theological_decisions:
- issue: समुद्र और महानद द्वारा दाखलता के विस्तार का भौगोलिक संकेत
  choice: मुख्य पाठ में काव्यात्मक सीमा-भाषा रखी गई और फरात की संभावित पहचान पादटिप्पणी में दी गई।
  alternative: मुख्य पाठ में सीधे ‘भूमध्य सागर’ और ‘फरात नदी’ कहना।
  rationale: मूल पाठ केवल ‘समुद्र’ और ‘नदी/महानद’ कहता है; स्पष्ट भौगोलिक नाम जोड़ने से उसकी काव्यात्मकता और कुछ वास्तविक अस्पष्टता मिट जाती।
translation_notes:
  register: भाषा आधुनिक, काव्यात्मक और गरिमापूर्ण रखी गई है। स्त्रीलिंग क्रियाएँ और सर्वनाम संदर्भ की दाखलता के अनुरूप हैं। दोनों पादटिप्पणी-चिह्न मुख्य पाठ में संबंधित पदों के तुरंत बाद दिए गए हैं।
