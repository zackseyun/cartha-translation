base_translation:
  language: en
  yaml_path: translation/ot/psalms/080/010.yaml
  text: The mountains were covered by its shade[a], and its branches were like the cedars of God.
translation:
  language: hi
  text: 'उसकी छाया से पहाड़ ढक गए,

    और उसकी डालियाँ परमेश्वर के देवदारों के समान थीं।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “विशाल देवदारों के समान।” इब्रानी पदबंध “परमेश्वर के देवदार” महानता या भव्यता व्यक्त करने वाला मुहावरा हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּסּוּ
  choice: ढक गए
  rationale: כסּה के काल रूप और बहुवचन कर्ता ‘पहाड़’ को स्वाभाविक हिन्दी में परिणामसूचक अकर्मक/भाववाच्य ढंग से व्यक्त करता है।
- source_word: הָרִים
  choice: पहाड़
  rationale: निश्चित बहुवचन संज्ञा का सरल और स्वाभाविक हिन्दी रूप।
- source_word: צִלָּהּ
  choice: उसकी छाया
  rationale: बेल के फैलाव से पड़ने वाली छाया को स्पष्ट करता है और मूल वनस्पति-बिंब बनाए रखता है।
- source_word: וַעֲנָפֶיהָ
  choice: और उसकी डालियाँ
  rationale: ענף का आधुनिक, सामान्य पाठक के लिए सहज वनस्पति-संबंधी रूप।
- source_word: אַרְזֵי אֵל
  choice: परमेश्वर के देवदार
  rationale: मूल में उपस्थित אֵל को मुख्य पाठ में सुरक्षित रखता है; साथ ही इसकी संभावित महत्ता-सूचक अर्थछाया टिप्पणी में दी गई है।
theological_decisions:
- issue: אַרְזֵי אֵל में אֵל का अर्थ
  choice: मुख्य पाठ में ‘परमेश्वर के देवदार’
  alternative: विशाल देवदार / प्रतापी देवदार
  rationale: यह पदबंध सचमुच परमेश्वर से संबंध भी जता सकता है और इब्रानी महत्ता-सूचक प्रयोग भी हो सकता है। शाब्दिक पदबंध मुख्य पाठ में रखकर अस्पष्टता को टिप्पणी में स्पष्ट किया गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और काव्यात्मक रखी गई है। ‘डालियाँ’ सामान्य हिन्दी में ‘शाखाएँ’ से अधिक स्वाभाविक वनस्पति-बिंब देती है; ‘परमेश्वर के देवदार’ मूल की अर्थगत अस्पष्टता को बनाए रखता है।
