  text: תְּשִׂימֵ֣/נוּ מָ֭דוֹן לִ/שְׁכֵנֵ֑י/נוּ וְ֝/אֹיְבֵ֗י/נוּ יִלְעֲגוּ לָֽ/מוֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/080/006.yaml
  text: You make us a cause of strife to our neighbors, and our enemies mock them.
translation:
  language: hi
  text: तू हमें हमारे पड़ोसियों के लिए झगड़े का कारण बना देता है, और हमारे शत्रु उनका उपहास करते हैं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘उनका’ का संकेत हिब्रू में अस्पष्ट है; इसका अनुवाद ‘हमारा उपहास करते हैं’ या ‘आपस में हँसते हैं’ भी किया जाता है।
    reason: काव्यात्मक सर्वनाम לָמוֹ के व्याकरणिक रूप और उसके संभावित संदर्भगत अर्थों को स्पष्ट करना।
lexical_decisions:
- source_word: מָדוֹן
  choice: झगड़े का कारण
  rationale: यह संज्ञा विवाद, कलह या झगड़े को सूचित करती है; इस वाक्य में इस्राएल को पड़ोसियों के बीच/लिए विवाद का विषय बनाए जाने का भाव है।
- source_word: יִלְעֲגוּ
  choice: उपहास करते हैं
  rationale: क्रिया לעג का सामान्य अर्थ हँसी उड़ाना या उपहास करना है; dignified और सहज हिन्दी में ‘उपहास करते हैं’ उपयुक्त है।
- source_word: לָמוֹ
  choice: उनका
  rationale: मसोरेटिक पाठ में यह तीसरे पुरुष बहुवचन का काव्यात्मक सर्वनाम है; इसलिए मुख्य पाठ में उसके प्रत्यक्ष व्याकरणिक रूप को बनाए रखा गया है, यद्यपि संदर्भगत संकेत अस्पष्ट है।
theological_decisions:
- issue: לָמוֹ के संकेत और उपहास के लक्ष्य की अस्पष्टता
  choice: मुख्य पाठ में ‘उनका’
  alternative: ‘हमारा’ अथवा ‘आपस में’
  rationale: हिब्रू रूप शाब्दिक रूप से ‘उन्हें/उनका’ की ओर संकेत करता है, जबकि कई अनुवाद संदर्भ के आधार पर इस्राएल को उपहास का लक्ष्य मानते हैं या इसे आत्मवाचक अर्थ में लेते हैं। पाठ की वास्तविक अस्पष्टता को मुख्य पाठ और पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। भजन में परमेश्वर को सीधे संबोधन के अनुरूप एकवचन ‘तू’ रखा गया है।
