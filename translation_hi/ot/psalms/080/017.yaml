  text: תְּֽהִי יָ֭דְ/ךָ עַל אִ֣ישׁ יְמִינֶ֑/ךָ עַל בֶּן אָ֝דָ֗ם אִמַּ֥צְתָּ לָּֽ/ךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/080/017.yaml
  text: Let your hand be upon the man of your right hand[b][a], upon the son of man whom you have made strong for yourself.
translation:
  language: hi
  text: तेरा हाथ तेरे दाहिने हाथ वाले पुरुष[a] पर बना रहे—उस मनुष्य के पुत्र[b] पर, जिसे तूने अपने लिए सामर्थी बनाया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तेरे दाहिने ओर के पुरुष।” इब्रानी मुहावरा ऐसे व्यक्ति को सूचित कर सकता है जिसे विशेष अनुग्रह या सहारा मिला हो, अथवा जिसे परमेश्वर ने अपने दाहिने ओर रखा हो।
    reason: lexical_alternative
  - marker: b
    text: “मनुष्य का पुत्र” का अर्थ केवल “मनुष्य” भी हो सकता है; फिर भी बाइबिल के संदर्भ में इस अभिव्यक्ति में राजकीय या मसीहाई अनुनाद भी हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: תְּהִי
  choice: बना रहे
  rationale: यहाँ היה का भाव प्रार्थना या कामना व्यक्त करता है; ‘बना रहे’ हिंदी में स्वाभाविक रूप से इस विनती को प्रकट करता है।
- source_word: יָדְךָ
  choice: तेरा हाथ
  rationale: मूल का ठोस रूपक बनाए रखा गया है; संदर्भ में यह परमेश्वर की सक्रिय सहायता और सामर्थ्य का संकेत देता है।
- source_word: עַל
  choice: पर
  rationale: यह संबंध और सहायक उपस्थिति दोनों को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: אִישׁ יְמִינֶךָ
  choice: तेरे दाहिने हाथ का पुरुष
  rationale: इब्रानी मुहावरे और उसकी काव्यात्मक अस्पष्टता को सुरक्षित रखता है—यह विशेष अनुग्रह पाए, समर्थित, या दाहिनी ओर स्थित व्यक्ति को सूचित कर सकता है।
- source_word: בֶּן אָדָם
  choice: मनुष्य का पुत्र
  rationale: एकवचन पुरुषवाचक अभिव्यक्ति तथा उसके साहित्यिक और संभावित राजकीय या मसीहाई अनुनाद को बिना निर्णायक व्याख्या थोपे सुरक्षित रखता है।
- source_word: אִמַּצְתָּ
  choice: सामर्थी बनाया है
  rationale: פיעל रूप के दृढ़ या बलवान बनाने के कारक अर्थ तथा पूर्ण क्रिया के परिणामात्मक भाव को व्यक्त करता है।
- source_word: לָּךְ
  choice: अपने लिए
  rationale: संबंध, उद्देश्य और अपने निमित्त तैयार करने के भाव को प्रकट करता है।
theological_decisions:
- issue: ‘तेरे दाहिने हाथ का पुरुष’ और ‘मनुष्य का पुत्र’ को स्पष्ट मसीहाई उपाधि बनाया जाए या नहीं
  choice: काव्यात्मक मानवीय भाषा को बिना विशेष शीर्षकीय संकेत या व्याख्यात्मक विस्तार के रखा गया
  alternative: इसे स्पष्टतः मसीह, राजा, या सामूहिक इस्राएल का उल्लेख बनाना
  rationale: इब्रानी भाषा सामूहिक, राजकीय और मसीहाई पाठ-संभावनाओं के लिए खुली है; पद स्वयं अनिवार्य रूप से किसी एक को निश्चित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण काव्यात्मक शैली रखी गई है। भजन की परमेश्वर से सीधी प्रार्थना के अनुरूप ‘तू/तेरा’ का प्रयोग है। ‘दाहिने हाथ का पुरुष’ जानबूझकर कुछ असामान्य रखा गया है ताकि मूल मुहावरे की वास्तविक अस्पष्टता बनी रहे; वैकल्पिक स्वाभाविक अर्थ पादटिप्पणी में दिया गया है।
