  text: 'For the choir director: according to “Lilies.” A testimony[b][a]. A psalm of Asaph.'
translation:
  language: hi
  text: संगीत-निर्देशक के लिए। “लिलियों” की धुन पर। एक गवाही।[a] आसाप का भजन।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या सम्भवतः, “संगीत-निर्देशक के लिए। ‘लिलियों—गवाही’ की धुन पर।” इब्रानी शीर्षक में प्राचीन संगीत या उपासना-संबंधी निर्देश सुरक्षित हो सकते हैं, जिनका ठीक आशय अब निश्चित नहीं है।
    reason: alternative_reading
  - marker: b
    text: या, “आसाप के लिए एक भजन।” इब्रानी पदबंध रचनाकार, संबद्धता अथवा संग्रह से संबंध व्यक्त कर सकता है।
    reason: source_ambiguity
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: संगीत-निर्देशक के लिए
  rationale: यह भजन-शीर्षकों में प्रयुक्त निर्देशात्मक पद है, जो संगीत-प्रस्तुति की देखरेख करने वाले व्यक्ति को सूचित करता है। ‘संगीत-निर्देशक’ आधुनिक हिन्दी में स्वाभाविक और व्यापक है।
- source_word: אֶל שֹׁשַׁנִּים
  choice: “सोसन के फूल” की धुन पर
  rationale: यह सम्भवतः किसी ज्ञात धुन या प्रस्तुति-शैली का नाम है। ‘की धुन पर’ शीर्षक में אֶל के सांगीतिक प्रयोग को स्पष्ट करता है, जबकि उद्धरण-चिह्न इसे सामान्य फूलों का उल्लेख समझने से रोकते हैं।
- source_word: עֵדוּת
  choice: एक साक्षी
  rationale: मूल शब्द का अर्थ ‘साक्षी’ या ‘गवाही’ है, पर यहाँ उसका ठीक सांगीतिक अथवा उपासना-संबंधी कार्य अनिश्चित है। इसलिए इसे अलग पद के रूप में रखते हुए अस्पष्टता सुरक्षित रखी गई है।
- source_word: לְאָסָף
  choice: आसाप का
  rationale: यह प्रचलित शीर्षकीय संबंध-सूचक अभिव्यक्ति है। हिन्दी में ‘आसाप का’ स्वाभाविक है, पर यह रचनाकार, संबद्ध व्यक्ति या संग्रह—इनमें से किस संबंध को बताता है, इसे निश्चित नहीं करता।
- source_word: מִזְמוֹר
  choice: भजन
  rationale: गाए जाने वाले धार्मिक काव्य के लिए यह आधुनिक हिन्दी का सहज और स्थापित शब्द है।
theological_decisions:
- issue: לְאָסָף में आसाप के साथ संबंध की प्रकृति
  choice: आसाप का भजन
  alternative: आसाप के लिए एक भजन
  rationale: इब्रानी संबंध-सूचक उपसर्ग लेखन, संबद्धता, समर्पण या संग्रह-सदस्यता दर्शा सकता है। मुख्य पाठ में प्रचलित स्वाभाविक रूप रखा गया और टिप्पणी में अनिश्चितता बताई गई है।
- issue: עֵדוּת का शीर्षक में कार्य
  choice: एक साक्षी
  alternative: ‘सोसन के फूल—साक्षी’ नामक धुन पर
  rationale: शब्द को धुन के नाम में मिला देना सम्भव है, पर इब्रानी पाठ यह संबंध निर्विवाद रूप से निर्धारित नहीं करता। अलग वाक्यांश मूल की संरचनात्मक और उपासना-संबंधी अस्पष्टता बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और गरिमापूर्ण रखी गई है। प्राचीन सांगीतिक पदों को अत्यधिक समझाने के बजाय मुख्य पाठ में पठनीय रूप दिया गया है और वास्तविक अनिश्चितता टिप्पणियों में स्पष्ट की गई है।
