lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: संगीत-निर्देशक के लिए
  rationale: यह पद भजन के संगीत-प्रस्तुतीकरण की देखरेख करने वाले व्यक्ति को संबोधित करता है। ‘संगीत-निर्देशक’ आधुनिक हिंदी में स्वाभाविक है और ‘अगुए’ जैसे अत्यधिक व्यापक शब्द से अधिक सटीक है; उपसर्ग לַ को ‘के लिए’ से व्यक्त किया गया है।
- source_word: מִזְמוֹר
  choice: भजन
  rationale: यह संगीत-संगति से जुड़े गीत या स्तोत्र के लिए प्रयुक्त मानक शीर्षकीय शब्द है; हिंदी बाइबलीय और सामान्य धार्मिक प्रयोग में ‘भजन’ इसका स्वाभाविक समतुल्य है।
- source_word: לְדָוִד
  choice: दाऊद का
  rationale: भजन-शीर्षकों में לְ लेखकत्व, संबंध, समर्पण या संग्रहगत संबद्धता बता सकता है। ‘दाऊद का’ हिंदी में संक्षिप्त और स्वाभाविक रहते हुए इस संबंध को केवल लेखकत्व तक सीमित नहीं करता।
theological_decisions:
- issue: दाऊद से संबंधित शीर्षक की अर्थ-छाया
  choice: दाऊद का
  alternative: दाऊद द्वारा रचा गया; दाऊद के लिए
  rationale: इब्रानी रचना किसी एक संबंध को अनिवार्य रूप से निश्चित नहीं करती। इसलिए मुख्य पाठ में ऐसा रूप रखा गया है जो लेखकत्व, संबद्धता या समर्पण की संभावनाओं को समय से पहले निर्धारित न करे।
translation_notes:
  register: भजन के शीर्षक के अनुरूप भाषा संक्षिप्त, गरिमापूर्ण और आधुनिक मानक हिंदी में रखी गई है। ‘गायक-मंडली के प्रधान’ की अपेक्षा ‘संगीत-निर्देशक’ अधिक व्यापक संगीत-संदर्भ को व्यक्त करता है।
