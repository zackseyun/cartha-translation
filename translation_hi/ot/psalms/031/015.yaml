  text: My times are in your hand[a]; rescue me from the hand of my enemies and from my pursuers.
translation:
  language: hi
  text: 'मेरे समय तेरे हाथ में हैं[a];


    मुझे मेरे शत्रुओं के हाथ से


    और मेरा पीछा करने वालों से छुड़ा।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मेरे नियत समय” अथवा “मेरी परिस्थितियाँ।” इब्रानी में शाब्दिक अर्थ “मेरे समय” है, जो किसी व्यक्ति के जीवन के विभिन्न दौरों और घटनाओं को व्यापक रूप से सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיָדְךָ
  choice: तेरे हाथ में
  rationale: इब्रानी रूपक को बनाए रखता है और अधिकार व नियंत्रण का भाव स्वाभाविक हिंदी में व्यक्त करता है; साथ ही आगे आए ‘शत्रुओं के हाथ से’ के साथ काव्यात्मक विरोध सुरक्षित रहता है।
- source_word: עִתֹּתָי
  choice: मेरा समय
  rationale: इब्रानी बहुवचन जीवन के समयों, अवस्थाओं और घटनाओं को व्यापक रूप से समेटता है। हिंदी में ‘मेरा समय’ इस काव्यात्मक व्यापकता को स्वाभाविक ढंग से रखता है; विकल्पों को पादटिप्पणी में दिया गया है।
- source_word: הַצִּילֵנִי
  choice: मुझे ... छुड़ा
  rationale: तत्काल संकट और विरोधियों से ठोस बचाव का भाव स्पष्ट, आधुनिक हिंदी में व्यक्त होता है।
- source_word: מִיַּד
  choice: मेरे शत्रुओं के हाथ से
  rationale: ‘हाथ’ का मूल रूपक बनाए रखने से परमेश्वर के हाथ और शत्रुओं के हाथ के बीच जानबूझकर रखा गया काव्यात्मक तथा धर्मवैचारिक विरोध सुरक्षित रहता है।
- source_word: אֹיְבַי
  choice: मेरे शत्रुओं
  rationale: विरोधी व्यक्तियों के लिए सीधा और मानक हिंदी प्रतिशब्द।
- source_word: וּמֵרֹדְפָי
  choice: और मेरा पीछा करनेवालों से
  rationale: सक्रिय रूप से पीछा करनेवालों का ठोस चित्र सुरक्षित रखता है; ‘सतानेवालों’ की अपेक्षा स्रोत के पीछा करने के अर्थ को अधिक स्पष्ट करता है।
theological_decisions:
- issue: ‘मेरे समयों’ का अर्थ-क्षेत्र
  choice: जीवन के समयों, अवस्थाओं और घटनाओं का व्यापक संकेत, जो परमेश्वर के हाथ में हैं
  alternative: केवल नियत समय; मेरी परिस्थितियाँ; मेरा भाग्य
  rationale: इब्रानी पद काव्यात्मक रूप से व्यापक है। मुख्य पाठ और पादटिप्पणी इसे केवल पूर्वनियत भाग्य या केवल निश्चित अवसरों तक सीमित नहीं करते।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिंदी। एकवचन संबोधन ‘तेरे’ भजन की प्रत्यक्ष प्रार्थना और काव्यात्मक निकटता को बनाए रखता है। पंक्ति-विन्यास इब्रानी समानांतरता तथा ‘तेरे हाथ’ और ‘शत्रुओं के हाथ’ के विरोध को उभारता है।
