source:
  edition: WLC
  text: תַּסְתִּירֵ֤/ם בְּ/סֵ֥תֶר פָּנֶי/ךָ֮ מֵֽ/רֻכְסֵ֫י אִ֥ישׁ תִּצְפְּנֵ֥/ם בְּ/סֻכָּ֗ה מֵ/רִ֥יב לְשֹׁנֽוֹת׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/020.yaml
  text: You hide them in the shelter of your presence from the schemes of man[b][a]; you conceal them in a shelter from the strife of tongues.
translation:
  language: hi
  text: तू उन्हें अपने सान्निध्य की ओट में मनुष्य की साज़िशों से छिपा रखता है[a]; तू उन्हें जीभों के झगड़े से एक आश्रय में छिपा रखता है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘मनुष्य के षड्यंत्रों से’ अथवा ‘मनुष्य के विरोधी गठजोड़ों से।’ यहाँ प्रयुक्त इब्रानी शब्द दुर्लभ है और उसका ठीक अर्थ अनिश्चित है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से ‘जीभों के झगड़े से’; अर्थात विरोधी, कलहकारी या निंदात्मक बातों से।
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּסְתִּירֵם
  choice: तू उन्हें ... छिपा रखता है
  rationale: सתר के हिफ़ील रूप में किसी को छिपाने या ओट में सुरक्षित रखने का सक्रिय भाव है; ‘छिपा रखता है’ निरंतर दैवी सुरक्षा को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בְּסֵתֶר פָּנֶיךָ
  choice: अपने सान्निध्य की ओट में
  rationale: סֵתֶר छिपने की जगह या ओट है और פָּנִים का शाब्दिक अर्थ ‘मुख’ होते हुए यहाँ परमेश्वर की निकट उपस्थिति का बोध देता है। ‘सान्निध्य की ओट’ निकटता और सुरक्षा दोनों को बनाए रखता है।
- source_word: מֵרֻכְסֵי אִישׁ
  choice: मनुष्य की साज़िशों से
  rationale: रूप רֻכְסֵי दुर्लभ और अर्थ की दृष्टि से कठिन है; प्रसंग में यह विरोधी गठजोड़, षड्यंत्र या चालों की ओर संकेत करता है। ‘साज़िशों’ समानांतर पंक्ति के शत्रुतापूर्ण वचन से मेल खाता है, जबकि ‘मनुष्य’ इब्रानी के प्रतिनिधिक एकवचन को रखता है।
- source_word: תִּצְפְּנֵם
  choice: तू उन्हें ... छिपा रखता है
  rationale: צפן का अर्थ छिपाना, संचित रखना या सुरक्षित रख देना हो सकता है। यहाँ आश्रय के भीतर संरक्षण प्रमुख है; समान क्रिया की पुनरावृत्ति हिन्दी में काव्यात्मक समानांतरता स्पष्ट करती है।
- source_word: בְּסֻכָּה
  choice: एक आश्रय में
  rationale: סֻכָּה मूलतः छप्पर, मंडप या अस्थायी ओट हो सकती है; इस प्रसंग में उसका सुरक्षात्मक कार्य प्रमुख है, इसलिए ‘आश्रय’ स्पष्ट और स्वाभाविक है।
- source_word: מֵרִיב לְשֹׁנוֹת
  choice: जीभों के झगड़े से
  rationale: רִיב विवाद या झगड़ा है और לְשֹׁנוֹת का शाब्दिक अर्थ ‘जीभें’ है। यह रूपक विरोधी, कलहकारी या निंदात्मक वाणी की काव्यात्मक छवि बनाए रखता है।
theological_decisions:
- issue: אִישׁ का प्रतिनिधिक पुल्लिंग एकवचन
  choice: मनुष्य
  alternative: लोगों
  rationale: इब्रानी संज्ञा एकवचन पुल्लिंग है और यहाँ सामान्य मानव का प्रतिनिधित्व करती है। ‘मनुष्य’ इस व्याकरणिक रूप को रखते हुए आधुनिक हिन्दी में व्यापक अर्थ देता है।
- issue: פָּנֶיךָ में दैवी मुख और उपस्थिति का संबंध
  choice: सान्निध्य
  alternative: मुख
  rationale: शाब्दिक ‘मुख’ सम्भव है, पर इस सुरक्षात्मक प्रसंग में अभिप्राय परमेश्वर की निकट उपस्थिति है। ‘सान्निध्य’ इस संबंधपरक अर्थ को स्पष्ट करता है, जबकि ‘ओट’ मूल की आश्रय-छवि रखती है।
translation_notes:
  register: परमेश्वर को संबोधित करने के लिए काव्यात्मक और पारंपरिक निकटता वाला ‘तू’ रखा गया है। भाषा आधुनिक, सहज और गरिमापूर्ण है; ‘सान्निध्य की ओट’ तथा ‘जीभों के झगड़े’ मूल की सुरक्षा और वाणी-संबंधी काव्यात्मक छवियों को बनाए रखते हैं।
