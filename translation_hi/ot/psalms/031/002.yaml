  verdict: revise
  source_fidelity: The draft accurately represents the imperative requests, urgency, and the paired protective images. However, “कान लगा” more commonly means ‘listen closely/put one’s ear to’ in Hindi, whereas the Hebrew image is specifically that of bending or inclining the ear toward the speaker. “झुका” retains that image more precisely.
  naturalness: The proposed revision is fluent modern standard Hindi while retaining the elevated but direct prayer register. “मेरी ओर अपना कान झुका” is idiomatic and clearer as an address to God than “मेरी ओर अपना कान लगा.”
  terminology: “शरण की चट्टान” and “किलेबंद घर” appropriately preserve the rock and house imagery and their protective force. “बचा” and “बचाने” render the two related Hebrew deliverance expressions naturally without importing doctrinal terminology.
  issues:
  - severity: low
    issue: The opening idiom is slightly imprecise in Hindi.
    rationale: “कान लगाना” usually denotes listening intently, often by placing one’s ear near something. Hebrew הַטֵּה ... אָזְנְךָ depicts inclining/bending the ear; “कान झुका” preserves the concrete metaphor.
  revised_text: मेरी ओर अपना कान झुका; शीघ्र मुझे बचा। मेरे लिए शरण की चट्टान, मुझे बचाने के लिए एक किलेबंद घर हो।
