  register: आधुनिक मानक हिंदी में सीधी प्रार्थना का गरिमापूर्ण, सहज स्वर रखा गया है। ‘कान’, ‘चट्टान’ और ‘घर’ जैसे इब्रानी के ठोस बिंब सुरक्षित रखे गए हैं; कठिन शब्द-संयोजनों को मुख्य पाठ में स्वाभाविक बनाया गया और उनके अधिक शाब्दिक विकल्प पादटिप्पणियों में दिए गए हैं।
