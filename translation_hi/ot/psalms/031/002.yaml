  text: Incline your ear to me[a]; quickly rescue me. Be for me a rock of refuge[b], a fortified house to save me.
translation:
  language: hi
  text: मेरी ओर अपना कान झुका; शीघ्र मुझे बचा। मेरे लिए शरण की चट्टान, मुझे बचाने के लिए एक किलेबंद घर हो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַטֵּה אֵלַי אָזְנְךָ
  choice: मेरी ओर अपना कान लगा
  rationale: इब्रानी मुहावरे में कान को किसी की ओर झुकाने का अर्थ ध्यान से सुनना है। हिंदी में यह रूप ठोस बिंब और विनती—दोनों को स्वाभाविक ढंग से बनाए रखता है।
- source_word: מְהֵרָה
  choice: शीघ्र
  rationale: यह क्रियाविशेषण विनती की तात्कालिकता व्यक्त करता है; ‘शीघ्र’ आधुनिक, संक्षिप्त और गरिमापूर्ण है।
- source_word: הַצִּילֵנִי
  choice: मुझे छुड़ा
  rationale: नצל यहाँ संकट से निकालने या बचा लेने की तत्काल कार्रवाई व्यक्त करता है। ‘छुड़ा’ आगे आने वाले ישׁע के अनुवाद ‘बचाने’ से उचित शब्दगत भेद भी रखता है।
- source_word: הֱיֵה לִי
  choice: मेरे लिए ... हो
  rationale: היה के आज्ञार्थ और संबंधसूचक לִי को सीधे रखा गया है; इससे वक्ता की निजी शरण की विनती बनी रहती है।
- source_word: לְצוּר מָעוֹז
  choice: शरण की चट्टान
  rationale: צוּר का ठोस बिंब ‘चट्टान’ से और מָעוֹז का रक्षात्मक आशय ‘शरण’ से व्यक्त होता है। वैकल्पिक अर्थ ‘दृढ़ चट्टान’ पादटिप्पणी में दिया गया है।
- source_word: לְבֵית מְצוּדוֹת
  choice: एक किलेबंद घर
  rationale: ‘घर’ के मूल बिंब को रखते हुए מְצוּדוֹת की सुदृढ़ रक्षात्मक प्रकृति ‘किलेबंद’ से व्यक्त की गई है।
- source_word: לְהוֹשִׁיעֵנִי
  choice: मुझे बचाने के लिए
  rationale: ישׁע के साध्यवाचक infinitive को उद्देश्य के रूप में स्पष्ट रखा गया है और पहले प्रयुक्त नצל से शब्दगत भेद बनाए रखा गया है।
