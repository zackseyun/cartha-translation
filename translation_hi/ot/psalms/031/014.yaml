  yaml_path: translation/ot/psalms/031/014.yaml
  text: But as for me[a], I trust in you, O Yahweh; I say, “You are my God.”
translation:
  language: hi
  text: 'परन्तु मैं तो आप पर भरोसा रखता हूँ[a], हे याहवे;

    मैं कहता हूँ, “आप ही मेरे परमेश्वर हैं।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इसका अनुवाद यह भी हो सकता है: “परन्तु मैंने आप पर भरोसा रखा है, हे याहवे; मैंने कहा है, ‘आप ही मेरे परमेश्वर हैं।’” इब्रानी की पूर्ण क्रियाएँ भूत अथवा वर्तमान-पूर्ण अर्थ में समझी जा सकती हैं; मुख्य पाठ उन्हें जारी विश्वास और अंगीकार की वर्तमान घोषणाओं के रूप में व्यक्त करता है।'
    reason: क्रियाकाल का वैकल्पिक अनुवाद
lexical_decisions:
- source_word: וַאֲנִי
  choice: परन्तु मैं तो
  rationale: संयोजक और स्वतंत्र सर्वनाम मिलकर पहले के प्रसंग से विरोध तथा ‘मैं’ पर बल प्रकट करते हैं; आधुनिक हिन्दी में ‘परन्तु मैं तो’ दोनों भाव स्वाभाविक रूप से व्यक्त करता है।
- source_word: עָלֶיךָ בָטַחְתִּי
  choice: आप पर भरोसा रखता हूँ
  rationale: בטח के साथ על का अर्थ किसी पर निर्भर होकर भरोसा रखना है। वर्तमानकालीन अभिव्यक्ति प्रार्थना में जारी विश्वास को सामने लाती है, जबकि इब्रानी पूर्ण रूप की कालगत सम्भावना पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: יְהוָה
  choice: याहवे
  rationale: यह परमेश्वर का व्यक्तिगत नाम YHWH है; ‘याहवे’ उसका प्रचलित हिन्दी लिप्यंतरण है, न कि किसी उपाधि से उसका प्रतिस्थापन।
- source_word: אָמַרְתִּי
  choice: मैं कहता हूँ
  rationale: इब्रानी पूर्ण रूप को यहाँ समानान्तर वर्तमान विश्वास-घोषणा के रूप में व्यक्त किया गया है; भूत अथवा वर्तमान-पूर्ण अर्थ की सम्भावना पादटिप्पणी में दी गई है।
- source_word: אֱלֹהַי אָתָּה
  choice: आप ही मेरे परमेश्वर हैं
  rationale: संज्ञा पर प्रथम पुरुष एकवचन प्रत्यय का अर्थ ‘मेरे परमेश्वर’ है। स्पष्ट स्वतंत्र सर्वनाम אָתָּה के बल को हिन्दी के ‘ही’ से व्यक्त किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा अथवा ‘प्रभु’
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम सीधे आया है। लिप्यंतरण उसे उपाधि में बदले बिना सुरक्षित रखता है।
- issue: पूर्ण क्रियाओं בָטַחְתִּי और אָמַרְתִּי का काल
  choice: 'वर्तमान विश्वास और अंगीकार: ‘भरोसा रखता हूँ’ और ‘कहता हूँ’'
  alternative: ‘मैंने भरोसा रखा है’ और ‘मैंने कहा है’
  rationale: प्रार्थना के इस प्रसंग में ये रूप वर्तमान में कायम भरोसे और अंगीकार को व्यक्त कर सकते हैं। फिर भी इब्रानी पूर्ण रूप भूत अथवा वर्तमान-पूर्ण अनुवाद की अनुमति देते हैं, इसलिए उस अस्पष्टता को पादटिप्पणी में स्पष्ट किया गया है।
translation_notes:
  register: भाषा आधुनिक, श्रद्धापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। परमेश्वर को सम्बोधित करते समय आदरसूचक ‘आप’ का प्रयोग किया गया है। काव्यात्मक समानान्तरता बनाए रखने के लिए पद को दो पंक्तियों में रखा गया है।
