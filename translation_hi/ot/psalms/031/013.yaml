  text: כִּ֤י שָׁמַ֨עְתִּי דִּבַּ֥ת רַבִּים֮ מָג֪וֹר מִ/סָּ֫בִ֥יב בְּ/הִוָּסְדָ֣/ם יַ֣חַד עָלַ֑/י לָ/קַ֖חַת נַפְשִׁ֣/י זָמָֽמוּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/013.yaml
  text: For I have heard the whispering of many—terror on every side!—as they conspired together against me[a], plotting to take my life.
translation:
  language: hi
  text: क्योंकि मैंने बहुतों की कानाफूसी[a] सुनी है—चारों ओर आतंक है!—जब वे मेरे विरुद्ध मिलकर षड्यंत्र रचते हैं और मेरी जान लेने की योजना बनाते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बहुतों की बदनामी भरी बातें।” इब्रानी संज्ञा कानाफूसी, अफ़वाह या किसी को बदनाम करने वाली बात के लिए प्रयुक्त हो सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पद भजनकार की व्यथा का कारण बताता है; ‘क्योंकि’ इस व्याख्यात्मक संबंध को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: שָׁמַעְתִּי
  choice: मैंने ... सुनी है
  rationale: इब्रानी पूर्ण क्रिया के वर्तमान तक बने प्रभाव और प्रसंग की जीवंतता को हिन्दी का पूर्ण वर्तमान व्यक्त करता है।
- source_word: דִּבַּת רַבִּים
  choice: बहुतों की कानाफूसी
  rationale: דִּבָּה कानाफूसी, अफ़वाह या बदनामी की बात को सूचित कर सकता है। षड्यंत्रकारी प्रसंग में ‘कानाफूसी’ स्वाभाविक है, जबकि ‘बदनामी’ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: מָגוֹר מִסָּבִיב
  choice: चारों ओर आतंक है
  rationale: यह चारों तरफ़ से घेर लेने वाले भय का संक्षिप्त मुहावरा है; ‘आतंक’ उसकी तीव्रता बनाए रखता है।
- source_word: בְּהִוָּסְדָם יַחַד עָלַי
  choice: जब वे मेरे विरुद्ध मिलकर षड्यंत्र रचते हैं
  rationale: रूप संयुक्त परामर्श की ओर संकेत करता है और शत्रुतापूर्ण प्रसंग उसे षड्यंत्र का भाव देता है; יחד के लिए ‘मिलकर’ समन्वित कार्रवाई व्यक्त करता है।
- source_word: לָקַחַת נַפְשִׁי זָמָמוּ
  choice: मेरी जान लेने की योजना बनाते हैं
  rationale: נֶפֶשׁ यहाँ अमूर्त आत्मा नहीं, व्यक्ति का जीवन है; זָמַם जानबूझकर की गई शत्रुतापूर्ण योजना को दर्शाता है।
