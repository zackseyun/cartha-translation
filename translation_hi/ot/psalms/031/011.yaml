  text: מִ/כָּל צֹרְרַ֨/י הָיִ֪יתִי חֶרְפָּ֡ה וְ/לִ/שֲׁכֵנַ֨/י מְאֹד֮ וּ/פַ֪חַד לִֽ/מְיֻדָּ֫עָ֥/י רֹאַ֥/י בַּ/ח֑וּץ נָדְד֥וּ מִמֶּֽ/נִּי־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/011.yaml
  text: Because of all my enemies I have become a reproach[a], especially to my neighbors, and a terror to my acquaintances[c][b]; those who see me in the street flee from me.
translation:
  language: hi
  text: मेरे सब शत्रुओं के कारण मैं निन्दा का पात्र बन गया हूँ[a], अपने पड़ोसियों के लिए तो बहुत अधिक, और अपने परिचितों के लिए भय का कारण। जो लोग मुझे बाहर[b] देखते हैं, वे मुझसे दूर भाग जाते हैं[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मेरे सब शत्रुओं की ओर से मैं निन्दा का पात्र बन गया हूँ”; आरम्भिक वाक्यांश का तुलनात्मक अर्थ “मेरे सब शत्रुओं से भी अधिक” भी लिया जा सकता है।
    reason: alternative_reading
  - marker: b
    text: शाब्दिक अर्थ “बाहर” है; यहाँ आशय सार्वजनिक स्थान पर दिखाई देने से है।
    reason: cultural_note
  - marker: c
    text: या “मुझसे दूर हट जाते हैं” अथवा “मुझसे दूर चले जाते हैं।”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִכָּל צֹרְרַי
  choice: अपने सब शत्रुओं के कारण
  rationale: 'מִן को यहाँ प्रसंगानुसार कारणसूचक समझना सबसे स्वाभाविक है: शत्रु उसकी दुर्दशा और सार्वजनिक अपमान का कारण बने हैं। स्रोत अथवा तुलनात्मक अर्थ भी सम्भव हैं, इसलिए उन्हें पादटिप्पणी में रखा गया है।'
- source_word: הָיִיתִי חֶרְפָּה
  choice: मैं निन्दा का पात्र बन गया हूँ
  rationale: היה के पूर्ण रूप और חֶרְפָּה का मेल उत्पन्न हुई तथा अब भी बनी हुई दशा व्यक्त करता है। हिन्दी में ‘निन्दा का पात्र’ व्यक्ति के उपहास और तिरस्कार की वस्तु बनने का भाव स्पष्ट करता है।
- source_word: וְלִשֲׁכֵנַי מְאֹד
  choice: विशेषकर अपने पड़ोसियों के लिए
  rationale: מְאֹד पड़ोसियों के सम्बन्ध में तीव्रता बढ़ाता है। ‘विशेषकर’ स्वाभाविक हिन्दी में निकट रहने वालों के बीच बढ़ी हुई बदनामी व्यक्त करता है।
- source_word: וּפַחַד לִמְיֻדָּעָי
  choice: अपने परिचितों के लिए भय का कारण
  rationale: פַּחַד भय या दहशत है और מְיֻדָּעַ परिचित व्यक्ति को दर्शाता है। ‘भय का कारण’ हिन्दी में इस आशय को स्वाभाविक रूप से व्यक्त करता है कि लोग उससे आतंकित या आशंकित होकर बचते हैं।
- source_word: רֹאַי בַּחוּץ
  choice: जो मुझे बाहर देखते हैं
  rationale: בַּחוּץ का सीधा अर्थ ‘बाहर’ है और यहाँ सार्वजनिक स्थान में दिखाई देने का भाव है। मुख्य पाठ में मूल की व्यापकता रखी गई है; सांस्कृतिक-संदर्भ पादटिप्पणी में स्पष्ट है।
- source_word: נָדְדוּ מִמֶּנִּי
  choice: वे मुझसे दूर भाग जाते हैं
  rationale: נָדַד के अर्थ-क्षेत्र में भटकना, हट जाना और भागना आते हैं। भय और सामाजिक परिहार के इस प्रसंग में ‘दूर भाग जाते हैं’ सबसे सशक्त और स्वाभाविक अर्थ देता है, जबकि हल्के विकल्प पादटिप्पणी में सुरक्षित हैं।
