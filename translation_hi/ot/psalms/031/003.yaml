id: PSA.31.3
reference: Psalms 31:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּֽי סַלְעִ֣/י וּ/מְצוּדָתִ֣/י אָ֑תָּה וּ/לְמַ֥עַן שִׁ֝מְ/ךָ֗ תַּֽנְחֵ֥/נִי וּֽ/תְנַהֲלֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/003.yaml
  text: For you are my rock and my fortress[c][b][a]; and for your name’s sake you will lead me and guide me.
translation:
  language: hi
  text: क्योंकि[a] आप ही मेरी चट्टान और मेरा गढ़[b] हैं; अपने नाम की खातिर आप मेरी अगुवाई करेंगे और मुझे राह दिखाएँगे।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इसलिए कि आप ही मेरी चट्टान और मेरा गढ़ हैं।” इब्रानी כִּי कारण (“क्योंकि”) या व्याख्या प्रस्तुत कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: “गढ़” के स्थान पर “दुर्ग” भी अनुवाद किया जा सकता है।
    reason: lexical_alternative
  - marker: c
    text: इब्रानी की दोनों क्रियाएँ निकटार्थक हैं। “अगुवाई करेंगे” और “राह दिखाएँगे” उनका काव्यात्मक समानांतर बनाए रखते हैं। इन्हें विनती के रूप में “मेरी अगुवाई कीजिए और मुझे राह दिखाइए” भी समझा जा सकता है।
    reason: lexical_and_grammatical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यहाँ यह शब्द पिछली विनती का कारण या आधार बताता है। हिंदी में ‘क्योंकि’ उस संबंध को स्वाभाविक रूप से व्यक्त करता है, यद्यपि इसे व्याख्यात्मक अर्थ में भी समझा जा सकता है।
- source_word: סַלְעִי
  choice: मेरी चट्टान
  rationale: संज्ञा चट्टान या पथरीली ऊँचाई को दर्शाती है और यहाँ सुरक्षित शरण का रूपक है। ‘चट्टान’ आधुनिक हिंदी में इस बिंब को स्पष्ट रखता है।
- source_word: מְצוּדָתִי
  choice: मेरा गढ़
  rationale: यह शब्द किलेबंद सुरक्षित स्थान को दर्शाता है। ‘गढ़’ संक्षिप्त, स्वाभाविक और रक्षात्मक बिंब के अनुकूल है; ‘दुर्ग’ भी संभव है।
- source_word: אָתָּה
  choice: आप ही ... हैं
  rationale: इब्रानी में स्वतंत्र सर्वनाम बल देता है। हिंदी में ‘ही’ उस बल को स्पष्ट करता है, और ‘आप’ आदरपूर्ण आधुनिक संबोधन है।
- source_word: וּלְמַעַן שִׁמְךָ
  choice: अपने नाम की खातिर
  rationale: यह वाक्यांश परमेश्वर के नाम—उनके प्रकट चरित्र, सम्मान और विश्वसनीयता—को उनके कार्य का आधार बताता है। यह अनुवाद मूल मुहावरे को बिना विस्तार दिए स्वाभाविक हिंदी में रखता है।
- source_word: תַּנְחֵנִי
  choice: आप मेरी अगुवाई करेंगे
  rationale: हिफ़ील रूप का सामान्य अर्थ आगे ले चलना या मार्ग दिखाना है। भविष्यकाल प्रार्थना के भीतर भरोसे से भरी अपेक्षा व्यक्त करता है।
- source_word: וּתְנַהֲלֵנִי
  choice: और मुझे राह दिखाएँगे
  rationale: यह क्रिया सावधानी से ले चलने या मार्गदर्शन देने का भाव रखती है। अलग हिंदी अभिव्यक्ति दोनों निकटार्थक क्रियाओं के काव्यात्मक समानांतर को बनाए रखती है।
theological_decisions:
- issue: ‘अपने नाम की खातिर’ का आशय
  choice: परमेश्वर का मार्गदर्शन उनके अपने नाम, अर्थात उनके प्रकट चरित्र, सम्मान और विश्वसनीयता पर आधारित है।
  alternative: इसे केवल लोगों के सामने परमेश्वर की प्रतिष्ठा के संकुचित अर्थ में लेना।
  rationale: मूल इब्रानी मुहावरे की व्यापकता बनाए रखी गई है; अनुवाद उसमें कोई संप्रदायगत व्याख्या नहीं जोड़ता।
- issue: अपूर्ण क्रियाओं का काल और भाव
  choice: 'भरोसे से भरी भावी अपेक्षा: ‘आप ... करेंगे ... दिखाएँगे।’'
  alternative: 'विनती के रूप में: ‘मेरी अगुवाई कीजिए और मुझे राह दिखाइए’; अथवा वर्तमान कथन: ‘आप मेरी अगुवाई करते और मुझे राह दिखाते हैं।’'
  rationale: संदर्भ में ‘आप ही मेरी चट्टान और मेरा गढ़ हैं’ से यह भरोसेपूर्ण अपेक्षा निकलती है। फिर भी इब्रानी अपूर्ण रूप में विनती या वर्तमान भाव की संभावना पूरी तरह समाप्त नहीं होती।
translation_notes:
  register: आधुनिक मानक हिंदी में आदरपूर्ण ईश्वरीय संबोधन ‘आप’ रखा गया है। भाषा सरल किंतु गरिमापूर्ण है। ‘चट्टान’ और ‘गढ़’ मूल के ठोस सुरक्षा-बिंबों को बनाए रखते हैं; ‘अपने नाम की खातिर’ प्रचलित मुहावरे को सहज हिंदी में व्यक्त करता है।
