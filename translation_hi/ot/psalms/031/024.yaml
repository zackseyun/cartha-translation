  yaml_path: translation/ot/psalms/031/024.yaml
  text: Be strong[a], and let your heart be courageous, all you who wait for Yahweh.
translation:
  language: hi
  text: दृढ़ रहो और तुम्हारा हृदय साहसी हो, हे यहोवा की बाट जोहने वालो, तुम सब![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हे यहोवा की आशा रखने वालो, तुम सब।” हिब्रू शब्द में बाट जोहने और आशा रखने—दोनों के भाव हो सकते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: חִזְקוּ
  choice: दृढ़ रहो
  rationale: बहुवचन आज्ञार्थक का सीधा और स्वाभाविक हिन्दी रूप; यह शारीरिक बल से अधिक आंतरिक दृढ़ता के आह्वान को व्यक्त करता है।
- source_word: וְיַאֲמֵץ
  choice: और तुम्हारा हृदय साहसी हो
  rationale: हिफ़ील अपूर्ण रूप यहाँ आज्ञार्थक के बाद इच्छार्थक/प्रोत्साहनात्मक भाव रखता है। ‘साहसी हो’ पहले पद के ‘दृढ़ रहो’ की अनावश्यक पुनरावृत्ति से बचते हुए निकट अर्थ बनाए रखता है।
- source_word: לְבַבְכֶם
  choice: तुम्हारा हृदय
  rationale: हिब्रू में ‘हृदय’ संकल्प, साहस और भीतरी व्यक्ति को समेटता है; काव्यात्मक हिन्दी में यह स्वाभाविक और पारदर्शी है।
- source_word: כָּל
  choice: तुम सब
  rationale: समूचे संबोधित समुदाय को स्पष्ट रूप से व्यक्त करता है।
- source_word: הַמְיַחֲלִים
  choice: बाट जोहनेवालो
  rationale: कृदन्त में प्रतीक्षा और आशा, दोनों का भाव है। ‘बाट जोहना’ प्रत्याशापूर्ण प्रतीक्षा को स्वाभाविक हिन्दी में व्यक्त करता है; आशा का वैकल्पिक भाव पादटिप्पणी में सुरक्षित है।
- source_word: לַיהוָה
  choice: यहोवा की
  rationale: לְ के साथ יחל उस व्यक्ति को सूचित करता है जिसकी बाट जोही जाती है। ‘यहोवा की बाट जोहना’ हिन्दी में स्वाभाविक है और व्यक्तिगत दिव्य नाम को सुरक्षित रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में चार-अक्षरी व्यक्तिगत नाम सीधे आया है। आधुनिक हिन्दी बाइबलीय प्रयोग में ‘यहोवा’ व्यापक रूप से पहचाना जाता है; इसे ‘प्रभु’ से बदलने पर मूल का व्यक्तिगत नाम ओझल हो जाता। उच्चारण की ऐतिहासिक अनिश्चितता के कारण ‘याहवे’ भी संभव है।
- issue: יחל में प्रतीक्षा और आशा का संबंध
  choice: बाट जोहनेवालो
  alternative: आशा रखनेवालो
  rationale: संदर्भ भरोसे से भरी प्रतीक्षा का है। मुख्य पाठ प्रतीक्षा की क्रियात्मक छवि रखता है, जबकि पादटिप्पणी आशा के वास्तविक अर्थ-घटक को स्पष्ट करती है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामुदायिक संबोधन वाली हिन्दी। ‘हे ... वालो’ से अंतिम संबोधन को आरम्भ में रखा गया है, जिससे हिन्दी वाक्य स्वाभाविक बनता है; दोनों प्रोत्साहनात्मक क्रियाओं और मूल की काव्यात्मक समानता को बनाए रखा गया है।
