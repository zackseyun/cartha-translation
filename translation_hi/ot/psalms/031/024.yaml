  source_fidelity: 'The two exhortations are represented accurately: חִזְקוּ is conveyed by “दृढ़ रहो,” and the following jussive sense by “तुम्हारा हृदय साहसी हो.” “यहोवा की बाट जोहनेवालो” preserves the object marked by לְ and the waiting sense of מְיַחֲלִים. However, the Hebrew word order gives the exhortations first and addresses “all who wait for Yahweh” last; the proposed fronting is possible in Hindi but weakens the verse’s climactic final address. The footnote''s proposed alternative is structurally incomplete as an alternative to the whole line and shifts “यहोवा की” to “यहोवा पर,” which is not the most direct equivalent of יחל לְ.'
  naturalness: “बाट जोहनेवालो” is intelligible and suitably elevated, but spelling it as “बाट जोहने वालो” is more readable in modern standard Hindi. “हृदय” and “साहसी” fit the poetic, dignified register. Keeping the vocative group at the end produces a more natural poetic cadence while following the source sequence.
  terminology: “यहोवा” appropriately preserves the divine name in accordance with the supplied POB theological decision. “आशा रखने” is a valid lexical alternative for יחל, but it should be framed as an alternative for the relevant phrase, not as a fragmentary recasting of the entire verse. No doctrinal interpretation is introduced.
