  text: חָנֵּ֥/נִי יְהוָה֮ כִּ֤י צַ֫ר לִ֥/י עָשְׁשָׁ֖ה בְ/כַ֥עַס עֵינִ֗/י נַפְשִׁ֥/י וּ/בִטְנִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/009.yaml
  text: Be gracious to me[a], O Yahweh, for I am in distress[c][b]; my eye has wasted away with grief—my soul and my belly as well.
translation:
  language: hi
  text: हे याहवे, मुझ पर अनुग्रह कर, क्योंकि मैं संकट में हूँ। दुःख से मेरी आँख क्षीण हो गई है[a]—मेरी आत्मा[b] और मेरा पेट[c] भी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “खिन्नता से मेरी आँख धुँधली हो गई है” अथवा “दुःख से मेरी आँख जवाब दे गई है।”
    reason: lexical_alternative
  - marker: b
    text: “मेरी आत्मा” का अनुवाद “मेरे प्राण,” “मेरा जीवन” या “मेरा पूरा अस्तित्व” भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: इब्रानी में शाब्दिक अर्थ “मेरा पेट” है; यह शब्द अधिक व्यापक रूप से भीतर के अंगों या भीतरी भागों का भी संकेत कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: חָנֵּנִי
  choice: मुझ पर अनुग्रह कर
  rationale: חנן के आज्ञार्थक रूप में कृपा या अनुग्रह की याचना है। यह अनुवाद दया की पुकार को स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम יהוה को किसी उपाधि से बदलने के बजाय हिन्दी में लिप्यंतरित किया गया है।
- source_word: צַר לִי
  choice: मैं संकट में हूँ
  rationale: इब्रानी मुहावरा व्यक्तिगत तंगी, क्लेश या संकट की अवस्था बताता है; यह हिन्दी में उसका स्पष्ट और स्वाभाविक रूप है।
- source_word: עָשְׁשָׁה
  choice: क्षीण हो गई है
  rationale: क्रिया के कमज़ोर पड़ने, चुकने या गलते जाने के भाव को व्यक्त करता है और आँख के साथ स्वाभाविक भी है।
- source_word: בְכַעַס
  choice: दुःख से
  rationale: כעס क्रोध, खिन्नता, संताप या दुःख का बोध करा सकता है। विलाप के प्रसंग में 'दुःख' उपयुक्त है, जबकि अन्य संभावनाएँ पादटिप्पणी में सुरक्षित हैं।
- source_word: עֵינִי
  choice: मेरी आँख
  rationale: मूल पाठ के एकवचन को बनाए रखा गया है; काव्यात्मक हिन्दी में यह स्वाभाविक है।
- source_word: נַפְשִׁי
  choice: मेरी आत्मा
  rationale: נפש आत्मा, प्राण, जीवन या स्वयं व्यक्ति का संकेत कर सकता है। 'आत्मा' काव्यात्मक व्यापकता बनाए रखता है, और अन्य अर्थ पादटिप्पणी में दिए गए हैं।
- source_word: וּבִטְנִי
  choice: और मेरा पेट भी
  rationale: בטן का प्रत्यक्ष अर्थ पेट या उदर है, यद्यपि यह भीतर के अंगों अथवा अंतर्मन की ओर भी संकेत कर सकता है। मुख्य पाठ में ठोस शारीरिक बिंब बनाए रखा गया है।
theological_decisions:
- issue: יהוה परमेश्वर के नाम का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में व्यक्तिगत दिव्य नाम आया है; उसे उपाधि में बदलने के बजाय लिप्यंतरित करना स्रोत की विशिष्टता को सुरक्षित रखता है।
- issue: נַפְשִׁי का मानव-स्वरूप संबंधी अर्थ
  choice: मेरी आत्मा
  alternative: मेरे प्राण / मेरा जीवन / मेरा पूरा अस्तित्व
  rationale: यह शब्द केवल किसी अमूर्त, देह-विरहित तत्व तक सीमित नहीं है। 'आत्मा' के साथ पादटिप्पणी देकर मूल की अर्थ-विस्तार और तनाव दोनों सुरक्षित रखे गए हैं।
translation_notes:
  register: भाषा आधुनिक, प्रार्थनामय और गरिमापूर्ण रखी गई है। मूल की देहात्मक काव्य-छवि—आँख, आत्मा और पेट—को सरल बनाए बिना बनाए रखा गया है; जहाँ इब्रानी शब्दों के अर्थ व्यापक हैं, वहाँ पादटिप्पणियाँ दी गई हैं।
