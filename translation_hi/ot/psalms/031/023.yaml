base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/023.yaml
  text: Love Yahweh[b][a], all his faithful ones! Yahweh preserves the faithful and fully repays the one who acts proudly.
translation:
  language: hi
  text: हे यहोवा के सभी निष्ठावान लोगो,[a] यहोवा से प्रेम करो! यहोवा विश्वासयोग्य लोगों की रक्षा करता है और घमण्ड करने वाले को भरपूर प्रतिफल देता है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “हे यहोवा के सभी भक्तो” अथवा “हे यहोवा के सभी पवित्र लोगो।” इब्रानी शब्द उन लोगों को दर्शाता है जो यहोवा के प्रति वाचा की निष्ठा रखते हैं।
    reason: lexical_alternative
  - marker: b
    text: या “पूरा प्रतिफल देता है” अथवा “बहुतायत से प्रतिफल देता है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶהֱבוּ
  choice: प्रेम करो
  rationale: बहुवचन आज्ञार्थक क्रिया है; समुदाय को दिया गया सीधा और स्वाभाविक आह्वान।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी व्यक्तिगत नाम को हिन्दी में प्रचलित लिप्यंतरण द्वारा व्यक्त किया गया है।
- source_word: כָּל־חֲסִידָיו
  choice: यहोवा के सब विश्वासयोग्य लोगो
  rationale: חסיד covenant loyalty और भक्ति से पहचाने जाने वालों को सूचित करता है। सम्बोधन में हिन्दी का ‘लोगो’ स्वाभाविक है; ‘यहोवा के’ मूल के ‘उसके’ संदर्भ को स्पष्ट करता है।
- source_word: אֱמוּנִים
  choice: विश्वासयोग्य लोगों
  rationale: यह विशेषण संज्ञा के रूप में प्रयुक्त है और निष्ठावान अथवा भरोसेमंद लोगों का बोध कराता है।
- source_word: נֹצֵר
  choice: रक्षा करता है
  rationale: क्रिया सावधानी से सुरक्षित रखने और निगरानी करने का भाव देती है; प्रसंग में ‘रक्षा करता है’ सहज और सटीक है।
- source_word: וּמְשַׁלֵּם עַל־יֶתֶר
  choice: परन्तु … भरपूर बदला देता है
  rationale: שׁלם प्रतिफल अथवा बदला देने और עַל־יֶתֶר उसकी भरपूरी/अधिकता का भाव देता है। विरोधात्मक संबंध को हिन्दी में ‘परन्तु’ से स्वाभाविक रूप से स्पष्ट किया गया है।
- source_word: עֹשֵׂה גַאֲוָה
  choice: घमण्ड से काम करने वाले
  rationale: शाब्दिक भाव ‘घमण्ड करने वाला’ है; चुना हुआ रूप अहंकारी आचरण के सक्रिय और निरंतर भाव को रखता है।
theological_decisions:
- issue: חֲסִידָיו में वाचागत पहचान
  choice: यहोवा के सब विश्वासयोग्य लोगो
  alternative: उसके सब भक्तो / उसके सब पवित्र लोगो
  rationale: ‘विश्वासयोग्य’ वाचा-संबंधी निष्ठा को व्यक्त करता है और ‘पवित्र’ से जुड़ी बाद की तकनीकी या साम्प्रदायिक धारणाओं को आरोपित नहीं करता।
- issue: ईश्वरीय संरक्षण और दण्ड का विरोध
  choice: यहोवा विश्वासयोग्य लोगों की रक्षा करता है, परन्तु घमण्ड से काम करने वाले को भरपूर बदला देता है
  alternative: यहोवा विश्वासयोग्यों की रक्षा करता है और अहंकारी को पूरा प्रतिफल देता है
  rationale: मूल पाठ विश्वासयोग्यों की रक्षा और घमण्डी के प्रति भरपूर प्रतिकार को साथ रखता है। ‘परन्तु’ इस निहित विरोध को स्पष्ट करता है, जबकि न्याय की कठोरता को नरम नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। सम्बोधन में ‘लोगो’ तथा आज्ञा में ‘प्रेम करो’ स्वाभाविक हिन्दी प्रयोग हैं। ‘यहोवा’ नाम को सीधे रखा गया है; ‘विश्वासयोग्य’ covenant loyalty और אֱמוּנִים दोनों के अर्थ-संबंध को बनाए रखता है।
