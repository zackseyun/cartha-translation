source:
  edition: WLC
  text: בָּר֥וּךְ יְהוָ֑ה כִּ֥י הִפְלִ֘יא חַסְדּ֥/וֹ לִ֝֗/י בְּ/עִ֣יר מָצֽוֹר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/021.yaml
  text: Blessed be Yahweh[a], for he has wonderfully shown his steadfast love to me in a fortified city.
translation:
  language: hi
  text: याहवे धन्य हो, क्योंकि उसने घेराबंदी में पड़े नगर में[a] मेरे प्रति अपना अटल प्रेम अद्भुत रीति से प्रकट किया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “किलेबंद नगर में।” इब्रानी पदबंध का अर्थ घेराबंदी में पड़ा नगर या किलेबंद नगर—दोनों हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: בָּרוּךְ
  choice: धन्य है
  rationale: ईश्वर की स्तुति में प्रयुक्त निष्क्रिय कृदन्त का स्वाभाविक और गरिमापूर्ण हिन्दी रूप; यह केवल गुण-वर्णन नहीं, स्तुतिपरक उद्घोष व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुराक्षरीय व्यक्तिगत नाम को उपाधि से बदलने के बजाय लिप्यंतरित किया गया है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह याहवे को धन्य कहने का कारण प्रस्तुत करता है।
- source_word: הִפְלִיא
  choice: अद्भुत रीति से प्रकट किया है
  rationale: פלא के हिफ़ईल रूप में किसी बात को असाधारण अथवा आश्चर्यजनक रूप से करने का भाव है; חַסְדּוֹ के साथ ‘प्रकट किया’ स्वाभाविक हिन्दी है।
- source_word: חַסְדּוֹ
  choice: अपना अटल प्रेम
  rationale: חסד में स्थिर, निष्ठावान और संबंधपरक प्रेम का भाव है; ‘अटल प्रेम’ इसे सामान्य पाठक के लिए स्पष्ट रखता है, बिना इसे किसी एक सैद्धान्तिक परिभाषा तक सीमित किए।
- source_word: לִי
  choice: मेरे प्रति
  rationale: वक्ता को उस प्रेम का व्यक्तिगत पात्र दिखाता है और हिन्दी में ‘प्रेम प्रकट किया’ के साथ सहज है।
- source_word: בְּעִיר מָצוֹר
  choice: घेराबंदी से घिरे नगर में
  rationale: מָצוֹר घेराबंदी, घेरने की व्यवस्था अथवा किलेबंदी का संकेत दे सकता है। मुख्य पाठ में संकट और छुटकारे के प्रसंग के अनुरूप घेराबंदी का अर्थ लिया गया है, जबकि दूसरा सम्भव अर्थ पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम सीधे आया है; उसे उपाधि से प्रतिस्थापित न करके पारदर्शी रूप से प्रस्तुत किया गया है।
- issue: בְּעִיר מָצוֹר का अर्थ
  choice: घेराबंदी से घिरे नगर में
  alternative: किलेबंद नगर में
  rationale: इब्रानी पदबंध दोनों अर्थों की अनुमति देता है। मुख्य पाठ भजन के संकट-संदर्भ के अनुरूप घेराबंदी का अर्थ रखता है, पर वास्तविक शाब्दिक अस्पष्टता पादटिप्पणी में स्पष्ट की गई है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, स्तुतिपरक किन्तु सहज रखी गई है। ‘अद्भुत रीति से’ काव्यात्मक गरिमा बनाए रखता है, और ‘अटल प्रेम’ सामान्य पाठक के लिए स्पष्ट रहते हुए חסד की निष्ठापूर्ण स्थिरता व्यक्त करता है।
