source:
  edition: WLC
  text: תֵּ֥אָלַ֗מְנָה שִׂפְתֵ֫י שָׁ֥קֶר הַ/דֹּבְר֖וֹת עַל צַדִּ֥יק עָתָ֗ק בְּ/גַאֲוָ֥ה וָ/בֽוּז־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/018.yaml
  text: Let lying lips be silenced[d][c][b][a], which speak arrogantly against the righteous with pride and contempt.
translation:
  language: hi
  text: झूठ बोलने वाले होंठ मौन हो जाएँ,[a] जो धर्मी के विरुद्ध धृष्टता से बोलते हैं, घमंड और तिरस्कार के साथ।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “गूँगे कर दिए जाएँ”; इब्रानी क्रिया चुप हो जाने या चुप कर दिए जाने का भाव दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: “धृष्टता से” के लिए प्रयुक्त इब्रानी शब्द उद्दंडता, धृष्टता या अभिमानी ढंग से बोलने का भाव रखता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵּאָלַמְנָה
  choice: मौन हो जाएँ
  rationale: निफ़अल अपूर्ण रूप यहाँ कामनासूचक/आज्ञार्थक बल रखता है और चुप हो जाने या चुप कर दिए जाने—दोनों की छाया दे सकता है। हिंदी में यह वाक्यांश उस कामना को स्वाभाविक रूप से व्यक्त करता है।
- source_word: שִׂפְתֵי שָׁקֶר
  choice: झूठ बोलने वाले होंठ
  rationale: शाब्दिक अर्थ ‘झूठ के होंठ’ है; चुना हुआ रूप आधुनिक हिंदी में स्वाभाविक रहते हुए कपटपूर्ण वाणी का अर्थ बनाए रखता है।
- source_word: הַדֹּבְרוֹת
  choice: जो ... बातें करते हैं
  rationale: स्त्रीलिंग बहुवचन कृदंत ‘होंठ’ से मेल खाता है और उसे विशेषित करता है; हिंदी में संबंधवाचक उपवाक्य इसे स्पष्ट रूप से व्यक्त करता है।
- source_word: עַל צַדִּיק
  choice: धर्मी के विरुद्ध
  rationale: एकवचन צַדִּיק किसी एक धर्मी व्यक्ति अथवा प्रतिनिधिक अर्थ में धर्मी जन को सूचित कर सकता है; ‘धर्मी’ इस अस्पष्टता को अनावश्यक रूप से सीमित नहीं करता।
- source_word: עָתָק
  choice: ढिठाई की बातें
  rationale: यह संज्ञा उद्दंडता, धृष्टता या अभिमानी वाणी को सूचित करती है। संज्ञात्मक हिंदी रूप मूल की रचना को बनाए रखता है और आगे आने वाले ‘घमंड’ से केवल पुनरुक्ति नहीं करता।
- source_word: בְּגַאֲוָה
  choice: घमंड ... के साथ
  rationale: בְּ यहाँ रीति या भाव दर्शाता है; ‘घमंड के साथ’ स्वाभाविक हिंदी में अहंकारी मनोभाव व्यक्त करता है।
- source_word: וָבוּז
  choice: और तिरस्कार
  rationale: בּוּז का अर्थ तिरस्कार या उपेक्षापूर्ण अवमानना है; ‘तिरस्कार’ प्रसंग में स्पष्ट और गरिमापूर्ण है।
theological_decisions:
- issue: צַדִּיק के एकवचन का संदर्भ
  choice: धर्मी
  alternative: एक धर्मी मनुष्य
  rationale: मूल किसी विशिष्ट व्यक्ति और प्रतिनिधिक धर्मी व्यक्ति के बीच निर्णय करने को बाध्य नहीं करता; इसलिए हिंदी में लिंग अथवा संदर्भ को अधिक निर्दिष्ट नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल रखी गई है। ‘ढिठाई की बातें’ को ‘घमंड और तिरस्कार’ से अलग रखकर मूल के तीन जुड़े हुए किंतु विशिष्ट भावों को सुरक्षित किया गया है।
