review_pass:
  verdict: revise
  source_fidelity: 'The imprecatory force of תֵּאָלַמְנָה is accurately conveyed by “मौन हो जाएँ,” and the rendering preserves the representative singular “धर्मी.” However, “ढिठाई की बातें करते हैं” makes עָתָק primarily the content of what is said, whereas it more directly qualifies the manner of their speech: they speak insolently/arrogantly. The revision expresses this manner without losing the distinct following terms for pride and contempt.'
  naturalness: The draft is generally clear and suitably dignified. “धृष्टता से बोलते हैं” is more idiomatic and precise than “ढिठाई की बातें करते हैं” in this syntax. Retaining “घमंड और तिरस्कार के साथ” preserves the Hebrew’s emphatic accumulation.
  terminology: “धर्मी,” “घमंड,” and “तिरस्कार” are appropriate modern-standard Hindi terms for צַדִּיק, גַּאֲוָה, and בּוּז. “धृष्टता” appropriately represents עָתָק without conflating it entirely with the subsequent “घमंड.”
  issues:
  - severity: medium
    issue: The phrase “ढिठाई की बातें करते हैं” treats עָתָק as the object/content of speech rather than its adverbial manner.
    rationale: The Hebrew construction describes the lying lips as speaking against the righteous insolently, followed by the associated attitudes “with pride and contempt.” Rendering it as “धृष्टता से बोलते हैं” better reflects the syntax and semantic function.
  revised_text: झूठ बोलने वाले होंठ मौन हो जाएँ,[a] जो धर्मी के विरुद्ध धृष्टता से बोलते हैं, घमंड और तिरस्कार के साथ।[b]
