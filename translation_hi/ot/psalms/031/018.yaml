  rationale: A limited syntactic revision changes “ढिठाई की बातें करते हैं” to “धृष्टता से बोलते हैं,” so that the Hindi directly represents insolent speech as the manner of speaking. No doctrinal or contextual specification has been added; “धर्मी” retains the source’s singular/representative ambiguity.
