source:
  edition: WLC
  text: מָ֤ה רַֽב טוּבְ/ךָ֮ אֲשֶׁר צָפַ֪נְתָּ לִּֽ/ירֵ֫אֶ֥י/ךָ פָּ֭עַלְתָּ לַ/חֹסִ֣ים בָּ֑/ךְ נֶ֝֗גֶד בְּנֵ֣י אָדָם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/019.yaml
  text: How abundant is your goodness[a], which you have stored up for those who fear you, which you have worked for those who take refuge in you before the sons of man.
translation:
  language: hi
  text: आपकी भलाई कितनी अपार है, जिसे आपने उन लोगों के लिए संचित रखा है जो आपका भय मानते हैं, और जिसे आपने उन लोगों के लिए मनुष्यों के सामने किया है जो आपकी शरण लेते हैं!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מָה רַב
  choice: कितनी अपार है
  rationale: विस्मयवाचक מָה और רַב मिलकर परिमाण पर आश्चर्य प्रकट करते हैं; ‘कितनी अपार है’ आधुनिक हिन्दी में इस भाव और प्रचुरता दोनों को व्यक्त करता है।
- source_word: טוּבְךָ
  choice: आपकी भलाई
  rationale: טוּב में नैतिक अच्छाई और कल्याणकारी उदारता दोनों समाहित हो सकते हैं; ‘भलाई’ इस व्यापकता को सहज हिन्दी में बनाए रखता है।
- source_word: צָפַנְתָּ
  choice: संचित रखा है
  rationale: क्रिया किसी वस्तु को सुरक्षित रख छोड़ने या भविष्य के लिए जमा रखने का बोध कराती है; ‘संचित रखा है’ केवल छिपाने का अनावश्यक अर्थ नहीं जोड़ता।
- source_word: לִירֵאֶיךָ
  choice: जो आपका भय मानते हैं
  rationale: यह अभिव्यक्ति परमेश्वर के प्रति श्रद्धायुक्त भय से पहचाने जाने वालों को दर्शाती है; पारंपरिक अर्थ को रखते हुए वाक्यांश सामान्य पाठक के लिए स्पष्ट है।
- source_word: פָּעַלְתָּ
  choice: आपने ... वह भलाई की है
  rationale: פעל सक्रिय रूप से कुछ करने या संपन्न करने को व्यक्त करता है। हिन्दी में पहले उल्लिखित ‘भलाई’ को दोहराने से आशय स्वाभाविक और स्पष्ट रहता है, जबकि क्रिया को ‘प्रकट किया’ जैसे अधिक विशिष्ट अर्थ तक सीमित नहीं किया गया।
- source_word: לַחֹסִים בָּךְ
  choice: जो आपकी शरण लेते हैं
  rationale: חסה का मूल चित्र आश्रय या सुरक्षा पाने के लिए शरण लेने का है; यह अनुवाद उस ठोस रूपक को बनाए रखता है, जिसमें भरोसा भी निहित है।
- source_word: נֶגֶד
  choice: के सामने
  rationale: यहाँ शब्द सार्वजनिक दृश्यता या लोगों की दृष्टि में किए जाने का भाव देता है; ‘के सामने’ संक्षिप्त और स्वाभाविक है।
- source_word: בְּנֵי אָדָם
  choice: सब मनुष्यों
  rationale: शाब्दिक रूप ‘मनुष्य के पुत्र’ एक प्रतिनिधिक इब्रानी अभिव्यक्ति है जिसका आशय सामान्यतः मानव समुदाय है। हिन्दी मुख्य पाठ में ‘सब मनुष्यों’ से वास्तविक सामूहिक अर्थ स्वाभाविक ढंग से व्यक्त होता है; पादटिप्पणी शाब्दिक रूप बताती है।
theological_decisions:
- issue: בְּנֵי אָדָם का मानव-समुदायवाचक प्रयोग
  choice: सब मनुष्यों
  alternative: मनुष्य के पुत्रों
  rationale: यह पारंपरिक इब्रानी सामूहिक पद केवल पुरुष संतानों को नहीं, लोगों या मानवजाति को दर्शाता है। मुख्य पाठ में उसके आशय को स्पष्ट और स्वाभाविक हिन्दी में रखा गया है तथा शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
- issue: परमेश्वर की भलाई का संचित और सार्वजनिक रूप
  choice: दो समानांतर कथनों को बनाए रखा गया है—भलाई संचित रखी गई है और लोगों के सामने की गई है
  alternative: संचित भलाई को बाद में ‘प्रकट’ किया गया है
  rationale: मूल पाठ צפן और פעל के बीच तनाव रखता है, पर दूसरी क्रिया को स्पष्टतः ‘प्रकट करना’ नहीं कहता। इसलिए अनुवाद उस संभावित संबंध को निश्चित व्याख्या में नहीं बदलता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, आदरसूचक ‘आप’ के साथ, काव्यात्मक किंतु सामान्य पाठक के लिए सहज रखी गई है। आरंभ का विस्मय मूल पदक्रम और भाव को दर्शाता है। अंतिम उपवाक्य में ‘वह भलाई’ की पुनरावृत्ति हिन्दी की स्पष्टता के लिए है और कोई नया वैचारिक तत्व नहीं जोड़ती।
