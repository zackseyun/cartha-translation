  text: अपने मुख का प्रकाश अपने सेवक पर चमका; अपने अटल प्रेम में[a] मुझे बचा ले।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अपने अटल प्रेम से’ अथवा ‘अपने अटल प्रेम के अनुसार।’ यहाँ इब्रानी उपसर्ग को एक से अधिक निकट अर्थों में समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאִירָה
  choice: प्रकाश चमका
  rationale: हिफ़ील आज्ञार्थक रूप कारणवाचक निवेदन व्यक्त करता है। हिंदी में ‘अपने मुख का प्रकाश चमका’ स्वाभाविक रहते हुए उस भाव को बनाए रखता है।
- source_word: פָנֶיךָ
  choice: अपने मुख का
  rationale: मूल का ठोस बिंब ‘तेरा मुख’ है, जो परमेश्वर की अनुकूल दृष्टि और उपस्थिति का इब्रानी मुहावरा है; इसे केवल ‘उपस्थिति’ कहकर अमूर्त नहीं किया गया।
- source_word: עַל
  choice: पर
  rationale: यह सेवक की ओर अनुग्रहपूर्ण मुख फेरने की दिशा बताता है; ‘पर’ इसका सीधा और स्वाभाविक हिंदी रूप है।
- source_word: עַבְדֶּךָ
  choice: अपने सेवक
  rationale: प्रार्थना में परमेश्वर से संबंध के संदर्भ में ‘सेवक’ उपयुक्त है; ‘दास’ संभव है, पर आधुनिक हिंदी में वह अनावश्यक रूप से दासता का सामाजिक अर्थ उभार सकता है।
- source_word: הוֹשִׁיעֵנִי
  choice: मुझे बचा ले
  rationale: यह ישׁע धातु का आज्ञार्थक रूप है, जिसमें प्रथम पुरुष एकवचन कर्म-प्रत्यय है। ‘बचा ले’ तत्काल संकट से छुटकारे की पुकार को सामान्य पाठक के लिए स्वाभाविक ढंग से व्यक्त करता है।
- source_word: בְחַסְדֶּךָ
  choice: अपने अटल प्रेम से
  rationale: חסד परमेश्वर के स्थिर, निष्ठावान प्रेम को दर्शाता है। ‘अटल प्रेम’ इसकी स्थायित्वपूर्ण संबंधनिष्ठा को व्यक्त करता है। उपसर्ग ב साधन, आधार या मानक के निकट अर्थ दे सकता है; ‘से’ मुख्य पाठ में संक्षिप्त है और टिप्पणी में अन्य संभावनाएँ सुरक्षित रखी गई हैं।
theological_decisions:
- issue: חסד का अनुवाद
  choice: अटल प्रेम
  alternative: करुणा; कृपा; निष्ठावान प्रेम
  rationale: यहाँ प्रार्थना परमेश्वर के केवल भावनात्मक स्नेह पर नहीं, बल्कि उसके स्थिर और निष्ठावान प्रेम पर आधारित है। ‘अटल प्रेम’ इस अर्थ-भार को सहज आधुनिक हिंदी में रखता है।
- issue: בְ का संबंध חסד से
  choice: अटल प्रेम से
  alternative: अटल प्रेम के अनुसार; अटल प्रेम के कारण
  rationale: इब्रानी संबंध को केवल साधन, कारण या मानक में सीमित करना निश्चित नहीं है। मुख्य पाठ स्वाभाविक हिंदी देता है और पादटिप्पणी निकटवर्ती अर्थों को खुला रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और प्रार्थनात्मक रखी गई है। समानांतर आज्ञार्थक वाक्यों की संक्षिप्तता तथा ‘मुख का प्रकाश’ वाला मूल इब्रानी बिंब सुरक्षित रखा गया है।
