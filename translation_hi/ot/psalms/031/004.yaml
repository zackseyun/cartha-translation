  text: תּוֹצִיאֵ֗/נִי מֵ/רֶ֣שֶׁת ז֭וּ טָ֣מְנוּ לִ֑/י כִּֽי אַ֝תָּה מָֽעוּזִּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/004.yaml
  text: Bring me out of this net that they have hidden for me[a], for you are my stronghold.
translation:
  language: hi
  text: मुझे उस जाल से बाहर निकाल, जिसे उन्होंने मेरे लिए छिपाया है[a], क्योंकि तू ही मेरा गढ़ है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उस जाल से, जो उन्होंने मेरे लिए छिपाया है”; जाल के प्रसंग में इसका अर्थ “जो उन्होंने मेरे लिए बिछाया है” भी समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹצִיאֵנִי
  choice: मुझे ... बाहर निकाल
  rationale: יצא के हिफ़ील रूप का अर्थ किसी को बाहर निकालना है। यह हिंदी में स्वाभाविक है और इब्रानी की कारणवाचकता को बनाए रखता है।
- source_word: מֵרֶשֶׁת
  choice: उस जाल से
  rationale: רֶשֶׁת का ठोस अर्थ ‘जाल’ है; इसे ‘फंदा’ कहने के बजाय मूल बिंब सुरक्षित रखा गया है।
- source_word: זוּ
  choice: उस ... जिसे
  rationale: זוּ यहाँ संकेतवाचक अथवा संबंधवाचक बल रख सकता है। हिंदी में ‘उस जाल ... जिसे’ विशिष्ट जाल को स्पष्ट करते हुए इस लचीलेपन को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: טָמְנוּ לִי
  choice: उन्होंने मेरे लिए छिपाया है
  rationale: טמן का मूल अर्थ छिपाना या गाड़कर रखना है। जाल के संदर्भ में ‘बिछाया’ अधिक मुहावरेदार है, पर ‘छिपाया’ मूल क्रिया और छिपे हुए खतरे के बिंब को सुरक्षित रखता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: כִּי यहाँ विनती का आधार बताता है; आधुनिक हिंदी में ‘क्योंकि’ इस कारण-संबंध को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: מָעוּזִּי
  choice: मेरा गढ़
  rationale: מָעוֹז शक्ति और सुरक्षा देने वाले सुदृढ़ स्थान को दर्शाता है। ‘गढ़’ हिंदी में संक्षिप्त, काव्यात्मक और सुरक्षात्मक बिंब वाला शब्द है।
theological_decisions:
- issue: परमेश्वर के लिए सुरक्षात्मक रूपक
  choice: तू ही मेरा गढ़ है
  alternative: तू मेरा शरणस्थान है / तू मेरा दृढ़ दुर्ग है
  rationale: ‘गढ़’ परमेश्वर को सुरक्षा और सामर्थ्य के स्थान के रूप में प्रस्तुत करने वाला मूल रूपक बनाए रखता है। ‘ही’ इब्रानी स्वतंत्र सर्वनाम אַתָּה के जोर को हिंदी में व्यक्त करता है, बिना कोई संप्रदायगत अर्थ जोड़े।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिंदी; भजन की सीधी प्रार्थना के अनुरूप परमेश्वर के लिए एकवचन निकट संबोधन ‘तू’ रखा गया है। ठोस ‘जाल’ और ‘गढ़’ के बिंब सुरक्षित हैं।
