source:
  edition: WLC
  text: שָׂנֵ֗אתִי הַ/שֹּׁמְרִ֥ים הַבְלֵי שָׁ֑וְא וַ֝/אֲנִ֗י אֶל יְהוָ֥ה בָּטָֽחְתִּי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/006.yaml
  text: I hate those who keep worthless idols[a], but as for me, I trust in Yahweh.
translation:
  language: hi
  text: मैं व्यर्थ मूर्तियों को माननेवालों से घृणा करता हूँ[a], परन्तु मैं याहवे पर भरोसा रखता हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “जो झूठी व्यर्थताओं को पकड़े रहते हैं”; शाब्दिक रूप में “जो मिथ्या की व्यर्थ वस्तुओं को सँभाले रखते हैं।”
    reason: הַשֹּׁמְרִים और הַבְלֵי שָׁוְא दोनों की शाब्दिक व्यापकता तथा मूर्तियों से आगे सम्भव संदर्भ को सुरक्षित रखना।
lexical_decisions:
- source_word: שָׂנֵאתִי
  choice: मैं ... घृणा करता हूँ
  rationale: काल रूप पूर्ण है, पर काव्यात्मक प्रसंग में यह भजनकार की स्थिर वर्तमान मनोवृत्ति व्यक्त करता है; हिन्दी का वर्तमान काल इसे स्वाभाविक रूप से प्रकट करता है।
- source_word: הַשֹּׁמְרִים
  choice: माननेवालों
  rationale: שמר का मूल अर्थ रखना, ध्यान रखना या पालन करना है। इस कर्म के साथ यह किसी झूठी उपास्य वस्तु को मानने और उससे निष्ठा रखने का भाव देता है; शाब्दिक विकल्प पादटिप्पणी में सुरक्षित है।
- source_word: הַבְלֵי שָׁוְא
  choice: व्यर्थ मूर्तियों
  rationale: यह पदबंध खालीपन, निष्फलता और मिथ्यात्व का बोध कराता है। याहवे पर भरोसे के विरोध में यह झूठी उपास्य वस्तुओं की ओर संकेत करता है; अधिक शाब्दिक अस्पष्टता पादटिप्पणी में दी गई है।
- source_word: וַאֲנִי
  choice: परन्तु मैं
  rationale: संयोजक और स्वतंत्र सर्वनाम पिछले समूह तथा भजनकार के अपने भरोसे के बीच स्पष्ट विरोध दिखाते हैं।
- source_word: אֶל יְהוָה בָּטָחְתִּי
  choice: मैं याहवे पर भरोसा रखता हूँ
  rationale: אֶל का मूल भाव ‘की ओर’ है, किंतु בטח के साथ हिन्दी में ‘पर भरोसा रखना’ स्वाभाविक है। पूर्ण क्रिया यहाँ स्थिर वर्तमान विश्वास व्यक्त करती है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
theological_decisions:
- issue: הַבְלֵי שָׁוְא का अभिप्राय
  choice: मुख्य पाठ में ‘व्यर्थ मूर्तियाँ’
  alternative: ‘झूठी व्यर्थताओं’ या ‘खोखली वस्तुओं’
  rationale: प्रसंग में याहवे पर भरोसे के विपरीत झूठी उपास्य वस्तुएँ अभिप्रेत जान पड़ती हैं, पर इब्रानी पदबंध स्वयं अधिक व्यापक और रूपकात्मक हो सकता है; इसलिए वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण काव्यात्मक गद्य। ‘परन्तु’ विरोध को स्पष्ट करता है; ‘भरोसा रखता हूँ’ स्थिर विश्वास का स्वाभाविक हिन्दी रूप है।
