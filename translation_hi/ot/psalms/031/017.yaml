source:
  edition: WLC
  text: יְֽהוָ֗ה אַל אֵ֭בוֹשָׁה כִּ֣י קְרָאתִ֑י/ךָ יֵבֹ֥שׁוּ רְ֝שָׁעִ֗ים יִדְּמ֥וּ לִ/שְׁאֽוֹל־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/017.yaml
  text: O Yahweh[a], let me not be put to shame, for I call on you; let the wicked be put to shame; let them be silent in Sheol.
translation:
  language: hi
  text: हे याहवे, मुझे लज्जित न होने दे, क्योंकि मैंने तुझे पुकारा है; दुष्ट लज्जित हों; वे अधोलोक में मौन हो जाएँ।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “वे अधोलोक में निश्चल हो जाएँ,” अथवा “वे मौन होकर अधोलोक में उतर जाएँ।” इब्रानी क्रिया मौन या निश्चल होने का अर्थ दे सकती है। “अधोलोक” मृतकों का लोक है; इसका अर्थ अनिवार्य रूप से “नरक” नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: हे यहोवा
  rationale: परमेश्वर के विशिष्ट वाचा-नाम को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है; ‘हे’ सम्बोधन को स्पष्ट करता है।
- source_word: אַל אֵבוֹשָׁה
  choice: मुझे लज्जित न होने दे
  rationale: אַל के साथ क्रियारूप प्रार्थनात्मक निषेध व्यक्त करता है। यह हिन्दी में स्वाभाविक रूप से विनती का भाव रखता है और केवल मन की शर्म नहीं, अपमानित सिद्ध होने की संभावना भी समेटता है।
- source_word: כִּי קְרָאתִיךָ
  choice: क्योंकि मैंने तुझे पुकारा है
  rationale: पूर्ण क्रियारूप को वर्तमान विनती के आधार बने हुए पूर्व/संपन्न आह्वान के रूप में रखा गया है। ‘पुकारा है’ परमेश्वर से सहायता की प्रार्थना का स्वाभाविक हिन्दी मुहावरा है।
- source_word: יֵבֹשׁוּ רְשָׁעִים
  choice: दुष्ट लज्जित हों
  rationale: इच्छार्थक/अभिशंसात्मक बल और पहले खंड के साथ בושׁ की समानता को बनाए रखा गया है। ‘दुष्ट’ भजन-साहित्य में רְשָׁעִים का संक्षिप्त और प्रचलित रूप है।
- source_word: יִדְּמוּ
  choice: मौन हो जाएँ
  rationale: यह क्रिया यहाँ मौन अथवा निश्चल हो जाने का अर्थ दे सकती है। ‘मौन हो जाएँ’ गैर-कारक रूप को सुरक्षित रखता है और ‘नष्ट हो जाएँ’ जैसी अधिक निर्णायक व्याख्या नहीं जोड़ता।
- source_word: לִשְׁאוֹל
  choice: अधोलोक में
  rationale: שְׁאוֹל मृतकों के लोक को सूचित करता है, केवल किसी एक कब्र या अनिवार्यतः नरक को नहीं। ‘अधोलोक’ सामान्य हिन्दी पाठक के लिए अर्थगम्य है और לִ को प्रसंगानुसार अवस्थिति के रूप में व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में आए विशिष्ट ईश्वरीय नाम को उपाधि ‘प्रभु’ से प्रतिस्थापित न करके नाम के रूप में रखा गया है। हिन्दी बाइबलीय प्रयोग में ‘यहोवा’ व्यापक रूप से पहचाना जाता है।
- issue: שְׁאוֹל की अवधारणा
  choice: अधोलोक
  alternative: शीओल
  rationale: यहाँ मृतकों के लोक की प्राचीन इब्रानी अवधारणा है। ‘अधोलोक’ अर्थ को सीधे संप्रेषित करता है और इसे ‘नरक’ या केवल ‘कब्र’ मानकर धार्मिक तनाव का समाधान नहीं करता।
- issue: יִדְּמוּ का आशय
  choice: मौन हो जाएँ
  alternative: निश्चल हो जाएँ / मौन होकर अधोलोक में उतर जाएँ
  rationale: मूल क्रिया मौन और निश्चलता दोनों का संकेत दे सकती है, जबकि לִשְׁאוֹל अवस्थिति अथवा दिशा से जुड़ सकता है। मुख्य पाठ में मौन होने का सीधा अर्थ रखा और अन्य संभावनाएँ पादटिप्पणी में सुरक्षित की गई हैं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और प्रार्थनात्मक रखी गई है। परमेश्वर के लिए एकवचन आत्मीय सम्बोधन ‘तुझे’ भजन की सीधी पुकार के अनुरूप है। समान मूल בושׁ की पुनरावृत्ति को दोनों खंडों में ‘लज्जित’ द्वारा बनाए रखा गया है।
