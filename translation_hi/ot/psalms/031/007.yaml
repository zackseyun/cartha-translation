  terminology: ‘अटल प्रेम’ is an appropriate rendering of חסד. ‘आत्मा’ is acceptable for נפשׁ provided its broader semantic range remains documented in the footnote. The footnote accurately preserves viable readings without imposing a technical theological sense.
