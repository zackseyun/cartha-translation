source:
  edition: WLC
  text: אָגִ֥ילָה וְ/אֶשְׂמְחָ֗ה בְּ/חַ֫סְדֶּ֥/ךָ אֲשֶׁ֣ר רָ֭אִיתָ אֶת עָנְיִ֑/י יָ֝דַ֗עְתָּ בְּ/צָר֥וֹת נַפְשִֽׁ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/007.yaml
  text: I will rejoice and be glad in your steadfast love[a], because you have seen my affliction; you have known the distresses of my soul.
translation:
  language: hi
  text: मैं तेरे अटल प्रेम में आनन्दित और प्रसन्न होऊँगा, क्योंकि तूने मेरी पीड़ा देखी है; तूने मेरी आत्मा[a] के संकटों को जाना है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘मेरे जीवन के संकटों’ अथवा ‘मेरे पूरे अस्तित्व के संकटों’। इब्रानी नेफेश का अर्थ प्रसंग के अनुसार ‘आत्मा’, ‘जीवन’ या ‘स्वयं/पूरा अस्तित्व’ हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אָגִילָה
  choice: मैं ... मगन होऊँगा
  rationale: गिल का यह प्रथम पुरुष एकवचन रूप उल्लासपूर्ण और संकल्पसूचक भाव व्यक्त करता है। ‘मगन होऊँगा’ आधुनिक हिन्दी में उस उल्लास को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וְאֶשְׂמְחָה
  choice: और आनन्द मनाऊँगा
  rationale: सामख का अर्थ आनन्दित होना है। पहले क्रियापद के साथ इसे अलग अभिव्यक्ति देकर इब्रानी काव्य की भाव-वृद्धि बनाए रखी गई है।
- source_word: בְחַסְדֶּךָ
  choice: तेरे अटल प्रेम में
  rationale: खेसेद प्रेम, निष्ठा और स्थिर कृपा के संयुक्त भाव को धारण करता है। ‘अटल प्रेम’ इस व्यापक अर्थ को सहज और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: אֲשֶׁר
  choice: क्योंकि
  rationale: यहाँ सम्बन्धवाचक अव्यय आनन्द मनाने का कारण प्रस्तुत करता है, इसलिए हिन्दी में कारणसूचक ‘क्योंकि’ स्वाभाविक है।
- source_word: רָאִיתָ אֶת־עָנְיִי
  choice: तूने मेरा दुःख देखा है
  rationale: ओनी दीन दशा, पीड़ा या दुःख को सूचित करता है। ‘मेरा दुःख’ संक्षिप्त, सहज और प्रसंगानुकूल है।
- source_word: יָדַעְתָּ
  choice: तूने ... जाना है
  rationale: यादा केवल बौद्धिक जानकारी नहीं, बल्कि पहचानने और निकटता से अवगत होने का भाव भी रखता है। ‘जाना है’ उसकी अर्थ-व्याप्ति को खुला रखता है।
- source_word: בְצָרוֹת נַפְשִׁי
  choice: मेरी आत्मा के संकटों को
  rationale: त्सारोत बहुवचन में संकटों या क्लेशों को बताता है और नेफेश यहाँ व्यक्ति के भीतरी जीवन अथवा पूरे अस्तित्व को सूचित कर सकता है। ‘आत्मा’ पारम्परिक गहराई बनाए रखता है, जबकि पादटिप्पणी अन्य सम्भव अर्थ स्पष्ट करती है।
theological_decisions:
- issue: विलाप के सन्दर्भ में נֶפֶשׁ का अर्थ
  choice: आत्मा
  alternative: जीवन; स्वयं/पूरा अस्तित्व
  rationale: ‘आत्मा’ पद की काव्यात्मक और मानवीय गहराई को बनाए रखता है, पर इसे शरीर से पृथक किसी तकनीकी तत्त्व के अर्थ तक सीमित नहीं किया गया है। पादटिप्पणी इब्रानी शब्द की वास्तविक अर्थ-व्याप्ति सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, सहज और भजन-साहित्य के अनुरूप गरिमापूर्ण रखी गई है। परमेश्वर को एकवचन निकट सम्बोधन ‘तू’ दिया गया है। समानार्थी क्रियाओं की काव्यात्मक जोड़ी तथा संकटों का बहुवचन सुरक्षित रखा गया है।
