  text: וַ/אֲנִ֤י אָ֘מַ֤רְתִּי בְ/חָפְזִ֗/י נִגְרַזְתִּי֮ מִ/נֶּ֪גֶד עֵ֫ינֶ֥י/ךָ אָכֵ֗ן שָׁ֭מַעְתָּ ק֥וֹל תַּחֲנוּנַ֗/י בְּ/שַׁוְּעִ֥/י אֵלֶֽי/ךָ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/022.yaml
  text: As for me[a], I said in my alarm[b], “I am cut off from before your eyes.” Yet you heard the sound of my pleas when I cried to you for help.
translation:
  language: hi
  text: पर मैंने अपनी घबराहट में[a] कहा, “मैं तेरी आँखों के सामने से अलग कर दिया गया हूँ[b]।” फिर भी, जब मैंने सहायता के लिए तुझे पुकारा, तब तूने मेरी विनतियों का स्वर सुना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपनी उतावली में।” इब्रानी शब्द जल्दबाज़ी, व्याकुलता या घबराहट का भाव व्यक्त कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “तेरी दृष्टि से।” शाब्दिक अर्थ है “तेरी आँखों के सामने से।”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְחָפְזִי
  choice: अपनी घबराहट में
  rationale: यह पद जल्दबाज़ी के साथ-साथ व्याकुलता या घबराहट का भाव भी व्यक्त कर सकता है। विलाप के संदर्भ में “घबराहट” संकट की मनःस्थिति को स्वाभाविक हिन्दी में स्पष्ट करता है; “उतावली” को पाद-टिप्पणी में रखा गया है।
- source_word: נִגְרַזְתִּי
  choice: मैं ... दूर कर दिया गया हूँ
  rationale: गזר के निफ़अल रूप का अर्थ यहाँ काट दिए जाने या हटा दिए जाने का है। “दूर कर दिया गया हूँ” हिन्दी में स्वाभाविक रहते हुए अलग कर दिए जाने की अनुभूति व्यक्त करता है।
- source_word: מִנֶּגֶד עֵינֶיךָ
  choice: तेरी आँखों के सामने से
  rationale: यह इब्रानी की ठोस छवि, शाब्दिक रूप से “तेरी आँखों के सामने से,” सुरक्षित रखता है। अधिक मुहावरेदार विकल्प “तेरी दृष्टि से” पाद-टिप्पणी में दिया गया है।
- source_word: אָכֵן
  choice: फिर भी
  rationale: यहाँ यह भजनकार की भयभीत धारणा और परमेश्वर द्वारा उसकी प्रार्थना सुने जाने की वास्तविकता के बीच प्रबल विरोध दिखाता है।
- source_word: קוֹל תַּחֲנוּנַי
  choice: मेरी विनतियों की आवाज़
  rationale: यह קוֹל की “आवाज़” और תַּחֲנוּנִים की कृपा या दया के लिए की गई “विनतियाँ”—दोनों को बनाए रखता है।
- source_word: בְּשַׁוְּעִי אֵלֶיךָ
  choice: जब मैंने सहायता के लिए तुझे पुकारा
  rationale: שׁוע संकट में सहायता के लिए पुकारने को दर्शाता है। “सहायता के लिए” क्रिया में निहित भाव को स्वाभाविक हिन्दी में स्पष्ट करता है।
theological_decisions:
- issue: परमेश्वर द्वारा त्यागे जाने की अनुभूति और वास्तव में प्रार्थना सुने जाने के बीच तनाव
  choice: भजनकार की अनुभूति—“मैं ... दूर कर दिया गया हूँ”—को उसके अपने कथन के रूप में रखा गया है, और फिर “फिर भी” के द्वारा परमेश्वर के सुनने की वास्तविकता सामने आती है।
  alternative: पहले कथन को व्याख्यात्मक रूप से “मैंने सोचा कि तूने मुझे त्याग दिया है” कहना।
  rationale: इब्रानी पाठ स्पष्ट रूप से सैद्धांतिक त्याग की घोषणा नहीं करता, बल्कि संकट में अनुभव की गई दूरी को व्यक्त करता है। अनुवाद मानवीय अनुभूति और परमेश्वर की प्रतिक्रिया के बीच तनाव को बिना सुलझाए सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। परमेश्वर के लिए एकवचन आत्मीय संबोधन “तू/तेरी/तुझे” अपनाया गया है, जो भजन की सीधी प्रार्थना और इब्रानी एकवचन संबोधन के अनुरूप है।
