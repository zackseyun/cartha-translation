lexical_decisions:
- source_word: הִסְגַּרְתַּנִי
  choice: मुझे…नहीं सौंपा
  rationale: हिफ़ील रूप यहाँ किसी को दूसरे के वश या अधिकार में कर देने का अर्थ रखता है। ‘नहीं सौंपा’ आधुनिक हिन्दी में स्वाभाविक है और शत्रु के नियंत्रण में दिए जाने का भाव व्यक्त करता है।
- source_word: בְּיַד
  choice: के हाथ में
  rationale: हिब्रानी मुहावरे की ठोस ‘हाथ’ वाली छवि सुरक्षित रहती है और हिन्दी में भी किसी के वश या अधिकार में होने का अर्थ स्पष्ट है।
- source_word: אוֹיֵב
  choice: शत्रु
  rationale: एकवचन रूप को रखा गया है; प्रसंग में यह किसी विरोधी या शत्रु-शक्ति का सामान्य बोध करा सकता है।
- source_word: הֶעֱמַדְתָּ
  choice: खड़े किए हैं
  rationale: हिफ़ील का मूल भाव ‘खड़ा करना’ या ‘स्थिर करके रखना’ है। यह अनुवाद पैरों की मूल छवि और सुरक्षित स्थिति—दोनों को बनाए रखता है।
- source_word: בַמֶּרְחָב
  choice: एक खुले स्थान में
  rationale: מֶרְחָב संकुचन और संकट के विपरीत खुली, विस्तृत जगह को दर्शाता है। ‘खुला स्थान’ आधुनिक हिन्दी में सहज रहते हुए रूपक को सुरक्षित रखता है।
- source_word: רַגְלָי
  choice: मेरे पाँव
  rationale: हिब्रानी बहुवचन को स्वाभाविक हिन्दी बहुवचन में व्यक्त किया गया है।
- source_word: וְלֹא
  choice: और…नहीं
  rationale: संयोजक का सामान्य अर्थ ‘और’ है; इसे अनावश्यक रूप से विरोधसूचक ‘परन्तु’ नहीं बनाया गया।
