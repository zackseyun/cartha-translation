id: PSA.31.1
reference: Psalms 31:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: בְּ/ךָ֖ יְהוָ֣ה חָ֭סִיתִי אַל אֵב֣וֹשָׁה לְ/עוֹלָ֑ם בְּ/צִדְקָתְ/ךָ֥ פַלְּטֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/001.yaml
  text: In you[a], O Yahweh, I have taken refuge; let me never be put to shame. In your righteousness deliver me.
translation:
  language: hi
  text: हे यहोवा, मैंने तुझमें शरण ली है; मैं कभी लज्जित न होऊँ। अपनी धार्मिकता[a] के कारण मुझे छुड़ा ले।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने न्याय के कारण।”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּךָ
  choice: तुझमें
  rationale: यह रूपकात्मक स्थानवाचक प्रयोग है और शरण लेने की ठोस छवि को बनाए रखता है; ‘तुझ पर भरोसा किया’ अर्थ को अनावश्यक रूप से अधिक स्पष्ट कर देता।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में प्रचलित रूप ‘यहोवा’ परमेश्वर के व्यक्तिगत वाचा-नाम को उपाधि से बदलने के बजाय नाम के रूप में प्रस्तुत करता है।
- source_word: חָסִיתִי
  choice: मैंने ... शरण ली है
  rationale: पूर्ण क्रिया स्थापित या संपन्न आश्रय-ग्रहण को व्यक्त करती है और חסה की शरणस्थल वाली छवि को सुरक्षित रखती है।
- source_word: אַל אֵבוֹשָׁה לְעוֹלָם
  choice: मैं कभी लज्जित न होऊँ
  rationale: नकारात्मक प्रार्थना या कामना को स्वाभाविक हिन्दी में व्यक्त करता है; ‘कभी’ לְעוֹלָם की नकारात्मक संदर्भ में पूर्ण व्यापकता दर्शाता है।
- source_word: בְּצִדְקָתְךָ
  choice: अपनी धार्मिकता के कारण
  rationale: בְּ को आधार या कारण के अर्थ में प्रस्तुत किया गया है; ‘धार्मिकता’ צְדָקָה की नैतिक, न्यायपूर्ण और वाचागत व्यापकता को बनाए रखती है।
- source_word: פַלְּטֵנִי
  choice: मुझे छुड़ा ले
  rationale: पिएल आज्ञार्थक सक्रिय बचाव की याचना है; ‘छुड़ा ले’ आधुनिक हिन्दी में संक्षिप्त, स्वाभाविक और प्रार्थनात्मक है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ व्यक्तिगत ईश्वरीय नाम का प्रयोग करता है; ‘यहोवा’ उसे केवल उपाधि ‘प्रभु’ से प्रतिस्थापित नहीं करता।
- issue: परमेश्वर के उद्धारकारी कार्य से जुड़ी צִדְקָה
  choice: धार्मिकता
  alternative: न्याय
  rationale: ‘धार्मिकता’ परमेश्वर के सही, विश्वासयोग्य और न्यायपूर्ण चरित्र की व्यापकता बनाए रखती है; इस प्रसंग में ‘न्याय’ भी संभव अर्थ है, इसलिए उसे पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमामय प्रार्थनात्मक शैली अपनाई गई है। परमेश्वर को संबोधन में एकवचन निकटता-सूचक ‘तू’ के रूप (‘तुझमें’, ‘अपनी’) रखे गए हैं, जो भजन-साहित्य में स्वाभाविक हैं।
