  yaml_path: translation/ot/psalms/031/005.yaml
  text: Into your hand I commit my spirit; you have redeemed me[a], O Yahweh, God of truth.
translation:
  language: hi
  text: तेरे हाथ में मैं अपनी आत्मा सौंपता हूँ; हे याहवे, सत्य के परमेश्वर,[a] तूने मुझे छुड़ा लिया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “विश्वासयोग्य परमेश्वर।” इब्रानी शब्द का अर्थ सत्य, विश्वसनीयता या विश्वासयोग्यता हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּ/יָדְ/ךָ
  choice: तेरे हाथ में
  rationale: सौंपने की क्रिया के साथ यह वाक्यांश परमेश्वर की देखभाल और अधिकार में अपने को देने का भाव व्यक्त करता है; हिन्दी में ‘हाथ में सौंपना’ स्वाभाविक है।
- source_word: אַפְקִיד
  choice: मैं ... सौंपता हूँ
  rationale: हिफ़ील रूप यहाँ किसी वस्तु या जीवन को दूसरे की देखभाल में सौंपने का अर्थ देता है।
- source_word: רוּחִי
  choice: अपनी आत्मा
  rationale: רוּחַ का अर्थ श्वास, प्राण या आत्मा हो सकता है; इस प्रार्थना में ‘आत्मा’ व्यक्ति के जीवन और अंतरात्मिक अस्तित्व को समेटता है।
- source_word: פָּדִיתָה
  choice: तूने ... छुड़ा लिया है
  rationale: פדה छुड़ाने या मूल्य देकर मुक्त करने को दर्शाता है। ‘छुड़ा लिया है’ पूर्ण हुई उस क्रिया की वर्तमान प्रासंगिकता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יְהוָה
  choice: हे यहोवा
  rationale: मूल पाठ में आए परमेश्वर के व्यक्तिगत वाचा-नाम को उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ द्वारा रखा गया है।
- source_word: אֵל אֱמֶת
  choice: सत्य के परमेश्वर
  rationale: यह इब्रानी संबंध-वाक्यांश का सीधा रूप है और אֱמֶת के ‘सत्य’ अर्थ को सुरक्षित रखता है; ‘विश्वासयोग्य परमेश्वर’ की वैध छाया पादटिप्पणी में दी गई है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: पद में निजी ईश्वरीय नाम सीधे आया है; इसलिए उसे किसी उपाधि से प्रतिस्थापित किए बिना हिन्दी बाइबल परंपरा में परिचित ‘यहोवा’ रूप में रखा गया है।
- issue: אֱמֶת की अर्थ-छाया
  choice: सत्य के परमेश्वर
  alternative: विश्वासयोग्य परमेश्वर
  rationale: אֱמֶת सत्य, विश्वसनीयता और विश्वासयोग्यता—इन परस्पर जुड़े भावों को व्यक्त कर सकता है। मुख्य पाठ में औपचारिक संरचना रखी गई है और दूसरी प्रासंगिक व्याख्या पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और प्रार्थनात्मक हिन्दी। परमेश्वर के सीधे संबोधन में ‘तेरे/तूने’ का प्रयोग निकटता और काव्यात्मक लहजे को बनाए रखता है; भाषा अनावश्यक रूप से पुरातन नहीं है।
