lexical_decisions:
- source_word: נִשְׁכַּחְתִּי
  choice: स्मृति से मिट गया हूँ
  rationale: निफ़अल पूर्ण 1 पुरुष एकवचन वक्ता की उस वर्तमान दशा को व्यक्त करता है जिसमें उसे भुला दिया गया है। ‘स्मृति से मिट गया हूँ’ अगले מִלֵּב के साथ मिलकर आधुनिक हिन्दी में इस भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: כְּמֵת
  choice: मरे हुए मनुष्य के समान
  rationale: כְּ तुलना सूचित करता है और מֵת एकवचन ‘मरा हुआ व्यक्ति’ है; यह अनुवाद मूल की व्यक्तिगत, एकवचन उपमा बनाए रखता है।
- source_word: מִלֵּב
  choice: लोगों की स्मृति से
  rationale: शाब्दिक अर्थ ‘हृदय से’ है, पर यहाँ לֵב मन अथवा स्मरण का स्थान सूचित करता है। हिन्दी में ‘लोगों की स्मृति से’ आशय स्पष्ट करता है; ‘लोगों की’ संदर्भानुसार निहित है, मूल में प्रत्यक्ष नहीं।
- source_word: הָיִיתִי
  choice: हो गया हूँ
  rationale: Qal पूर्ण 1 पुरुष एकवचन यहाँ ऐसी परिणामी दशा बताता है जो अब भी बनी हुई है; ‘हो गया हूँ’ इसे स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: כִּכְלִי
  choice: पात्र के समान
  rationale: כְּלִי वस्तु, उपकरण या पात्र का व्यापक शब्द है। इस काव्यात्मक चित्र में ‘पात्र’ मूल की सामान्यता को काफी हद तक बनाए रखते हुए गरिमापूर्ण हिन्दी देता है।
- source_word: אֹבֵד
  choice: खोए हुए
  rationale: אבד का कृदन्त रूप ‘खोया हुआ’, ‘नष्ट होता हुआ’ या ‘बरबाद’ का भाव दे सकता है। मुख्य पाठ में ‘खोए हुए’ निकटतम सामान्य अर्थ रखता है, जबकि दूसरी सम्भावना पादटिप्पणी में दी गई है।
