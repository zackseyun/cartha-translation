  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּ֤י כָל֪וּ בְ/יָג֡וֹן חַיַּ/י֮ וּ/שְׁנוֹתַ֪/י בַּ/אֲנָ֫חָ֥ה כָּשַׁ֣ל בַּ/עֲוֺנִ֣/י כֹחִ֑/י וַ/עֲצָמַ֥/י עָשֵֽׁשׁוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/010.yaml
  text: For my life is spent with grief[a], and my years with sighing; my strength has failed because of my iniquity[b], and my bones waste away.
translation:
  language: hi
  text: 'क्योंकि मेरा जीवन शोक में बीत गया है,

    और मेरे वर्ष आहें भरने में बीत गए हैं;

    मेरे अधर्म[a] के कारण मेरी शक्ति लड़खड़ा गई है[b],

    और मेरी हड्डियाँ क्षीण हो गई हैं।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘मेरे दोष के कारण’; इब्रानी शब्द अधर्म, उससे उत्पन्न दोष, या उसके परिणाम का बोध करा सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘मेरी शक्ति चुक गई है’; इब्रानी क्रिया का शाब्दिक अर्थ ‘ठोकर खाना’ या ‘लड़खड़ाना’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले विलाप का कारण या स्पष्टीकरण प्रस्तुत करता है; ‘क्योंकि’ इसके कारणसूचक बल को स्पष्ट रखता है।
- source_word: כָלוּ בְיָגוֹן חַיַּי
  choice: मेरा जीवन शोक में बीत गया है
  rationale: כָלוּ के समाप्त, चुक या व्यतीत हो जाने के भाव को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि יָגוֹן का अर्थ ‘शोक’ सुरक्षित रहता है।
- source_word: וּשְׁנוֹתַי בַּאֲנָחָה
  choice: और मेरे वर्ष आहें भरते-भरते
  rationale: अधूरे समानांतर काव्य-वाक्य को हिन्दी में सहज बनाते हुए אֲנָחָה के आह भरने या कराहने के भाव को बनाए रखता है।
- source_word: כָּשַׁל ... כֹחִי
  choice: मेरी शक्ति लड़खड़ा गई है
  rationale: כָּשַׁל की ठोकर खाने या लड़खड़ाने की सजीव रूपकात्मक छवि को सुरक्षित रखता है; पादटिप्पणी प्रसंगगत अर्थ स्पष्ट करती है।
- source_word: בַּעֲוֺנִי
  choice: मेरे अधर्म के कारण
  rationale: בְּ को यहाँ कारणसूचक समझा गया है और עָוֹן का नैतिक अर्थ ‘अधर्म’ रखा गया है, बिना उसके ‘दोष’ या उसके परिणाम के संभावित अर्थ को मिटाए।
- source_word: וַעֲצָמַי עָשֵׁשׁוּ
  choice: और मेरी हड्डियाँ क्षीण हो गई हैं
  rationale: शारीरिक दुर्बलता की मूल देहात्मक छवि बनाए रखते हुए עָשֵׁשׁוּ के घुलने, चुकने या निर्बल होने के भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: עָוֹן में अधर्म, दोष और दोष के परिणाम की अर्थ-व्याप्ति
  choice: मुख्य पाठ में ‘अधर्म’
  alternative: ‘दोष’ अथवा ‘अधर्म का परिणाम’
  rationale: ‘अधर्म’ नैतिक आयाम को बनाए रखता है, पर पादटिप्पणी स्वीकार करती है कि इब्रानी शब्द स्वयं अपराध, उससे उत्पन्न दोष, या उसके परिणाम का बोध करा सकता है; इस प्रकार पाठ को किसी विशिष्ट दंड-सिद्धांत तक सीमित नहीं किया गया।
- issue: शक्ति के लिए כָּשַׁל का रूपक
  choice: ‘लड़खड़ा गई है’
  alternative: ‘चुक गई है’ अथवा ‘विफल हो गई है’
  rationale: मूल की रूपकात्मक तीव्रता को मुख्य पाठ में रखा गया है, जबकि पादटिप्पणी उसका प्रसंगगत आशय बताती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण काव्यात्मक शैली रखी गई है। पंक्ति-विन्यास इब्रानी समानांतरता को उभारता है। ‘आहें भरते-भरते’, ‘लड़खड़ा गई’ और ‘क्षीण हो गई’ सामान्य पाठक के लिए बोधगम्य हैं, फिर भी मूल की भावात्मक और देहात्मक छवियों को बनाए रखते हैं।
