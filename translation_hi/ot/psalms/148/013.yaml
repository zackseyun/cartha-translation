id: PSA.148.13
reference: Psalms 148:13
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: יְהַלְל֤וּ אֶת שֵׁ֬ם יְהוָ֗ה כִּֽי נִשְׂגָּ֣ב שְׁמ֣/וֹ לְ/בַדּ֑/וֹ ה֝וֹד֗/וֹ עַל אֶ֥רֶץ וְ/שָׁמָֽיִם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/148/013.yaml
  text: Let them praise the name of Yahweh[a], for his name alone is exalted; his majesty is above earth and heaven.
translation:
  language: hi
  text: 'वे याहवे के नाम की स्तुति करें,


    क्योंकि केवल उसका नाम ही ऊँचा है;


    उसकी महिमा[a] पृथ्वी और आकाश से ऊँची है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसका वैभव” अथवा “उसका प्रताप।”
    reason: हिब्रू הוֹד के अर्थ-क्षेत्र में महिमा, वैभव, प्रताप और राजसी तेज शामिल हैं।
lexical_decisions:
- source_word: יְהַלְלוּ
  choice: वे ... स्तुति करें
  rationale: यहाँ अपूर्ण क्रिया भजन में स्तुति के आह्वान को आगे बढ़ाती है; हिंदी में संभावनार्थक/आज्ञार्थक रूप इसका स्वाभाविक भाव व्यक्त करता है।
- source_word: שֵׁם
  choice: नाम
  rationale: मूल काव्य की ठोस और धर्मवैचारिक रूप से महत्त्वपूर्ण अभिव्यक्ति को यथावत रखा गया है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार अक्षरों वाले परमेश्वर के व्यक्तिगत नाम का लिप्यंतरण किया गया है, उसे किसी उपाधि से नहीं बदला गया।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह स्तुति के आह्वान का कारण प्रस्तुत करता है और आधुनिक हिंदी में स्पष्ट तथा स्वाभाविक है।
- source_word: נִשְׂגָּב
  choice: सर्वोच्च है
  rationale: यह शब्द ऊँचा, महान अथवा महिमा में सबसे ऊपर होने की स्थिति व्यक्त करता है; 'सर्वोच्च' संदर्भ में सहज ढंग से उसकी अतुलनीय उच्चता बताता है।
- source_word: שְׁמוֹ לְבַדּוֹ
  choice: केवल उसका नाम ही
  rationale: לְבַדּוֹ की विशिष्टता पर दिए गए बल को 'केवल...ही' से सुरक्षित रखा गया है और 'नाम' को स्पष्ट रूप से बनाए रखा गया है।
- source_word: הוֹדוֹ
  choice: उसका प्रताप
  rationale: הוֹד राजसी वैभव, तेज और महिमा का बोध कराता है। 'प्रताप' संक्षिप्त, गरिमापूर्ण और काव्यात्मक हिंदी है; अन्य संभव अर्थ पादटिप्पणी में दिए गए हैं।
- source_word: עַל
  choice: के ऊपर है
  rationale: यह पृथ्वी और आकाश की तुलना में ऊँचाई या श्रेष्ठता व्यक्त करता है; हिंदी में वाक्य पूरा करने के लिए 'है' जोड़ा गया है।
- source_word: אֶרֶץ וְשָׁמַיִם
  choice: पृथ्वी और आकाश
  rationale: हिब्रू शब्द-क्रम और समूची सृष्टि को समेटने वाले काव्यात्मक युग्म को स्वाभाविक हिंदी में रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा अथवा प्रभु
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत वाचा-नाम सीधे आया है। 'याहवे' उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और उसे उपाधि में परिवर्तित नहीं करता।
- issue: שְׁמוֹ לְבַדּוֹ में विशिष्टता का केंद्र
  choice: केवल उसका नाम ही सर्वोच्च है
  alternative: केवल वही सर्वोच्च है
  rationale: मूल में विशिष्टता स्पष्ट रूप से 'उसके नाम' से जुड़ी है; इसलिए व्यापक धर्मवैचारिक अर्थ की ओर बदलने के बजाय हिब्रू कथन सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी में, स्तुतिगीत के अनुरूप गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। समानांतर काव्य-पंक्तियाँ और हिब्रू का पृथ्वी-आकाश क्रम सुरक्षित हैं।
