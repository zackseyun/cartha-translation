  yaml_path: translation/ot/psalms/148/003.yaml
  text: Praise him[a], sun and moon; praise him, all shining stars.
translation:
  language: hi
  text: 'उसकी स्तुति करो, हे सूर्य और चन्द्रमा;

    उसकी स्तुति करो, हे सभी प्रकाशमान तारों![a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “प्रकाश के तारे।”
    reason: इब्रानी में כּוֹכְבֵי אוֹר एक संबंधसूचक रचना है, जिसका अधिक शाब्दिक रूप ‘प्रकाश के तारे’ है; मुख्य पाठ में स्वाभाविक हिन्दी के लिए ‘प्रकाशमान तारे’ रखा गया है।
lexical_decisions:
- source_word: הַלְלוּהוּ
  choice: उसकी स्तुति करो
  rationale: הלל के बहुवचन आज्ञार्थक रूप और तृतीय पुरुष एकवचन प्रत्यय को सीधे व्यक्त करता है; पुनरावृत्ति इब्रानी काव्य की समानांतरता को बनाए रखती है।
- source_word: שֶׁמֶשׁ וְיָרֵחַ
  choice: सूर्य और चन्द्रमा
  rationale: दोनों खगोलीय पिंडों के सामान्य अर्थों को संयोजक सहित, काव्य के गरिमापूर्ण किन्तु सुबोध स्तर पर प्रस्तुत करता है।
- source_word: כָּל כּוֹכְבֵי אוֹר
  choice: सभी प्रकाशमान तारो
  rationale: כָּל की समग्रता और אוֹר से संबद्ध तारों की चमक दोनों को स्वाभाविक हिन्दी में व्यक्त करता है; सम्बोधन के कारण 'तारो' रूप प्रयुक्त है।
theological_decisions:
- issue: सूर्य, चन्द्रमा और तारों को सीधे स्तुति की आज्ञा
  choice: खगोलीय पिंडों को प्रत्यक्ष सम्बोधन और आज्ञार्थक शैली में प्रस्तुत किया गया है।
  alternative: इसे व्याख्यात्मक कथन बनाना कि सृष्टि परमेश्वर की महिमा प्रकट करती है।
  rationale: इब्रानी पाठ में बहुवचन आज्ञार्थक क्रियाएँ सीधे इन खगोलीय पिंडों को सम्बोधित करती हैं; इसे बनाए रखने से समस्त सृष्टि को परमेश्वर की स्तुति के लिए बुलाने वाली काव्यात्मक धर्म-दृष्टि सुरक्षित रहती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण काव्यात्मक सम्बोधन रखा गया है। ‘हे’ से प्रत्यक्ष सम्बोधन स्पष्ट होता है और ‘सूर्य’, ‘चन्द्रमा’, ‘प्रकाशमान’ जैसे शब्द भजन-साहित्य के अनुरूप होते हुए भी सामान्य पाठक के लिए सुबोध हैं।
