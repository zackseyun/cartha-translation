lexical_decisions:
- source_word: הַֽלְלוּהוּ
  choice: उसकी स्तुति करो
  rationale: बहुवचन आज्ञार्थक क्रिया और तृतीय पुरुष एकवचन कर्म-प्रत्यय को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: שְׁמֵי הַשָּׁמָיִם
  choice: सर्वोच्च आकाशो
  rationale: शाब्दिक रचना ‘आकाशों के आकाश’ तीव्रता/श्रेष्ठता सूचक इब्रानी अभिव्यक्ति है; ‘सर्वोच्च आकाश’ उसका स्पष्ट और गरिमापूर्ण अर्थ देता है। सम्बोधन के कारण ‘आकाशो’ रूप रखा गया है।
- source_word: וְהַמַּיִם
  choice: और हे ... जलो
  rationale: निश्चित पद ‘और वे जल’ यहाँ पहले आज्ञार्थक क्रिया के अधीन समन्वित सम्बोधन है; हिन्दी में ‘हे’ और सम्बोधन-रूप ‘जलो’ से यह वाक्य-संबंध स्पष्ट होता है।
- source_word: אֲשֶׁר מֵעַל הַשָּׁמָיִם
  choice: आकाशों के ऊपर के
  rationale: सम्बन्धवाचक उपवाक्य ‘जो आकाशों के ऊपर हैं’ को संक्षिप्त विशेषण-वाक्यांश में रखा गया है, जबकि स्थान-संबंध यथावत है।
theological_decisions:
- issue: आकाशों के ऊपर के जल की ब्रह्माण्ड-संबंधी भाषा
  choice: प्राचीन काव्यात्मक ब्रह्माण्ड-चित्र को ज्यों का त्यों बनाए रखना
  alternative: इसे वायुमंडलीय जल या केवल रूपक के रूप में आधुनिक बनाना
  rationale: पाठ सृष्टि के इन जलों को स्तुति के लिए बुलाता है; अनुवाद को बिना पाठगत आधार के इस चित्र को आधुनिक वैज्ञानिक श्रेणियों में नहीं बदलना चाहिए।
- issue: שְׁמֵי הַשָּׁמָיִם का अर्थ
  choice: सर्वोच्च आकाश
  alternative: आकाशों के आकाश
  rationale: यह इब्रानी रचना सर्वोच्चता व्यक्त कर सकती है। मुख्य पाठ में अर्थ-स्पष्ट रूप और टिप्पणी में शाब्दिक रूप देने से अभिप्राय तथा स्रोत-रचना दोनों सुरक्षित रहते हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी, काव्यात्मक किन्तु सहज और गरिमापूर्ण। दोनों सृष्ट तत्त्वों को प्रत्यक्ष सम्बोधन के रूप में स्पष्ट किया गया है; ‘तुम भी’ समन्वित आज्ञा को स्वाभाविक हिन्दी में पूरा करता है।
