  text: mountains and all hills[a], fruit trees and all cedars,
translation:
  language: hi
  text: पहाड़ और सभी पहाड़ियाँ, फलदार पेड़[a] और सभी देवदार,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘फल देनेवाले पेड़।’ इब्रानी में शाब्दिक रूप से ‘फल का पेड़’ है, जिसका प्रयोग यहाँ सामूहिक अर्थ में हुआ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶהָרִים
  choice: पहाड़
  rationale: הָרִים का अर्थ ‘पहाड़’ है। हिन्दी की इस काव्यात्मक सूची में निश्चयवाचक उपपद को अलग से व्यक्त करना अस्वाभाविक होता, जबकि सामान्य श्रेणी का भाव स्पष्ट रहता है।
- source_word: וְכָל גְּבָעוֹת
  choice: और सभी पहाड़ियाँ
  rationale: גְּבָעוֹת ऊँचे भूभागों को दर्शाता है जो पहाड़ों से छोटे हैं; ‘पहाड़ियाँ’ इस समानांतर भौगोलिक भेद को स्वाभाविक हिन्दी में बनाए रखता है। כָּל के लिए ‘सभी’ बहुवचन सूची के अनुकूल है।
- source_word: עֵץ פְּרִי
  choice: फलदार पेड़
  rationale: यह रचना शाब्दिक रूप से ‘फल का पेड़’ है और यहाँ एक पूरी श्रेणी के लिए सामूहिक रूप में प्रयुक्त हुई है। ‘फलदार पेड़’ साधारण आधुनिक हिन्दी में स्वाभाविक और अर्थ-सटीक है।
- source_word: וְכָל אֲרָזִים
  choice: और सभी देवदार
  rationale: אֲרָזִים देवदार के वृक्षों को सूचित करता है। सन्दर्भ में वृक्ष होने का भाव स्पष्ट है, इसलिए संक्षिप्त ‘देवदार’ पर्याप्त और काव्यात्मक है।
