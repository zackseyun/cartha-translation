  text: הַֽלְל֣וּ אֶת יְ֭הוָה מִן הָ/אָ֑רֶץ תַּ֝נִּינִ֗ים וְ/כָל תְּהֹמֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/148/007.yaml
  text: Praise Yahweh from the earth[b][a], sea creatures and all deeps.
translation:
  language: hi
  text: पृथ्वी से याहवे की स्तुति करो—हे समुद्री जीवो[a] और समस्त गहराइयो[b]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘समुद्री दैत्य’ अथवा ‘अजगर’; इब्रानी शब्द תַּנִּינִים बड़े, विकराल या सर्पाकार जल-प्राणियों को भी सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘समस्त अथाह गहराइयाँ’; इब्रानी में गहरे अथवा आदिम जलों का बिंब है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַֽלְל֣וּ
  choice: स्तुति करो
  rationale: הלל का बहुवचन आज्ञार्थक रूप है। भजन की आराधनात्मक पुकार के लिए ‘स्तुति करो’ स्वाभाविक और सीधा हिन्दी प्रयोग है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय परमेश्वर-नाम को उपाधि से बदलने के बजाय हिन्दी में उसके प्रचलित निकट लिप्यंतरण ‘याहवे’ से व्यक्त किया गया है।
- source_word: מִן הָאָרֶץ
  choice: पृथ्वी पर से
  rationale: इस विश्वव्यापी सृष्टि-स्तुति में אֶרֶץ आकाश के विपरीत पृथ्वी-लोक को सूचित करता है। ‘पर से’ हिन्दी में उस क्षेत्र से उठती स्तुति का भाव स्वाभाविक रूप से देता है।
- source_word: תַּנִּינִים
  choice: विशाल जलचरो
  rationale: תנינים बड़े, कभी सर्पाकार या विकराल, जल-संबंधी प्राणियों को सूचित कर सकता है। ‘विशाल जलचर’ सृष्टि-संदर्भ में अर्थ स्पष्ट रखता है, जबकि संभावित ‘समुद्री दैत्य’ अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: תְּהֹמוֹת
  choice: गहरे जलो
  rationale: תהום का बहुवचन आदिम अथवा अथाह गहरे जलों को दर्शाता है। ‘गहरे जल’ आधुनिक हिन्दी में बोधगम्य है और इब्रानी के जलमय गहराइयों वाले बिंब को बनाए रखता है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में निजी परमेश्वर-नाम सीधे उपस्थित है। ‘याहवे’ उसे उपाधि ‘प्रभु’ से प्रतिस्थापित किए बिना प्रस्तुत करता है; ‘यहोवा’ वैकल्पिक पारंपरिक लिप्यंतरण है।
- issue: תַּנִּינִים की सृष्टिगत अथवा मिथकीय ध्वनि
  choice: विशाल जलचर
  alternative: समुद्री दैत्य; अजगर
  rationale: पाठ सभी सृष्ट प्राणियों को स्तुति के लिए बुलाता है। मुख्य पाठ में तटस्थ सृष्टिगत अर्थ रखा गया है, पर शब्द की विकराल या सर्पाकार ध्वनि को पादटिप्पणी में छोड़ा गया है, ताकि संभावित तनाव मिटे नहीं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक रखी गई है। ‘हे …’ संबोधन से इब्रानी में पृथ्वी-लोक के घटकों को दी गई प्रत्यक्ष स्तुति-पुकार स्पष्ट होती है। बहुवचन संबोधन ‘जलचरो’ और ‘जलो’ पद्य की लय तथा आज्ञार्थक संरचना बनाए रखते हैं।
