  text: הַֽלְל֥וּ/הוּ כָל מַלְאָכָ֑י/ו הַֽ֝לְל֗וּ/הוּ כָּל צבא/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/148/002.yaml
  text: Praise him[a], all his angels; praise him, all his hosts.
translation:
  language: hi
  text: उसके सब स्वर्गदूतों, उसकी स्तुति करो; उसकी सारी स्वर्गीय सेना[a], उसकी स्तुति करो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘उसके सारे स्वर्गीय दल’; या, ‘उसकी सारी सेनाएँ’।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַלְלוּהוּ
  choice: उसकी स्तुति करो
  rationale: הלל का बहुवचन आज्ञार्थक रूप और तृतीय पुरुष एकवचन कर्म-सूचक प्रत्यय है। यह अनुवाद आज्ञा का बल और परमेश्वर को कर्म के रूप में बनाए रखता है तथा आधुनिक हिन्दी में स्वाभाविक है।
- source_word: כָל
  choice: सब / सारी
  rationale: सन्दर्भ में दोनों सम्बोधित समूहों की समग्रता व्यक्त होती है; हिन्दी में संज्ञा के लिंग और वचन के अनुसार ‘सब’ तथा ‘सारी’ स्वाभाविक हैं।
- source_word: מַלְאָכָיו
  choice: उसके सब स्वर्गदूतो
  rationale: इस स्वर्गीय और ब्रह्मांडीय सन्दर्भ में מַלְאָך मानव दूत नहीं, स्वर्गीय प्राणी हैं। सम्बोधन के कारण ‘स्वर्गदूतो’ प्रयोग किया गया है।
- source_word: צְבָאוֹ
  choice: उसकी सारी स्वर्गीय सेना
  rationale: צָבָא का अर्थ सेना या संगठित दल हो सकता है। ‘स्वर्गीय सेना’ स्वर्गदूतों के समानान्तर सन्दर्भ को स्पष्ट करती है, जबकि पादटिप्पणी व्यापक विकल्प सुरक्षित रखती है।
theological_decisions:
- issue: ‘उसकी’ और निहित कर्म ‘उसकी’ का सन्दर्भ
  choice: सर्वनाम भजन में स्तुति के विषय परमेश्वर की ओर संकेत करते हैं।
  alternative: पद में ‘यहोवा’ या ‘प्रभु’ नाम को स्पष्ट रूप से जोड़ना।
  rationale: इब्रानी पाठ सर्वनामों का प्रयोग करता है और उनका पूर्वपद पिछले पद के सन्दर्भ से समझा जाता है; नाम जोड़ने से अनावश्यक स्पष्टिकरण होता।
- issue: צְבָאוֹ की पहचान
  choice: स्वर्गीय सेना
  alternative: सेनाएँ / समस्त दल
  rationale: ‘स्वर्गदूतों’ के साथ समानान्तरता स्वर्गीय समूह की ओर संकेत करती है, पर शब्द की सैन्य और सामूहिक व्यापकता को पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और काव्यात्मक हिन्दी। दोनों अर्धपंक्तियों में प्रत्यक्ष सम्बोधन और दोहराई गई आज्ञा रखी गई है। ‘स्वर्गदूत’ सामान्य पाठक के लिए स्पष्ट है; ‘स्वर्गीय सेना’ इब्रानी समानान्तरता और צָבָא की सामूहिक-सैन्य छवि को बनाए रखती है।
