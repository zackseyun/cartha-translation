  text: וַ/יַּעֲמִידֵ֣/ם לָ/עַ֣ד לְ/עוֹלָ֑ם חָק נָ֝תַ֗ן וְ/לֹ֣א יַעֲבֽוֹר־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/148/006.yaml
  text: And he established them forever and ever; he gave a decree[a], and it will not pass away.
translation:
  language: hi
  text: उसने उन्हें सदा-सर्वदा के लिए स्थिर किया; उसने एक विधान ठहराया[a], और वह कभी नहीं टलेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसने एक विधान ठहराया, और वे उसकी सीमा से आगे नहीं जाते”; अथवा, “कोई उसकी सीमा से आगे नहीं जाता।” अंतिम इब्रानी वाक्यांश का कर्ता और अर्थ अस्पष्ट है।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעֲמִידֵם
  choice: उसने उन्हें ... स्थिर किया
  rationale: עמד के हिफ़ील रूप में ‘खड़ा करना, स्थिर करना, स्थापित करना’ का कारक अर्थ है; सृष्टि की स्थायी व्यवस्था के संदर्भ में ‘स्थिर किया’ स्वाभाविक और सटीक है।
- source_word: לָעַד לְעוֹלָם
  choice: सदा-सर्वदा के लिए
  rationale: दोनों कालवाचक पद मिलकर अनंत स्थायित्व पर बल देते हैं; ‘सदा-सर्वदा’ इस तीव्रता को सहज हिन्दी में बनाए रखता है।
- source_word: חָק
  choice: विधान
  rationale: חק का अर्थ विधि, ठहराई हुई मर्यादा या निश्चित व्यवस्था हो सकता है। ‘विधान’ सृष्टि के लिए परमेश्वर द्वारा निर्धारित स्थायी व्यवस्था को व्यक्त करता है, बिना अत्यधिक कानूनी भाषा के।
- source_word: נָתַן
  choice: ठहराया
  rationale: נתן का मूल अर्थ ‘देना’ है, पर חק के साथ हिन्दी में ‘विधान ठहराया’ अधिक स्वाभाविक है और नियुक्त अथवा निर्धारित करने का प्रसंगगत भाव रखता है।
- source_word: וְלֹא יַעֲבוֹר
  choice: जो कभी टलेगा नहीं
  rationale: עבר यहाँ ‘बीतना, हटना, सीमा पार करना’ जैसे अर्थ दे सकता है। मुख्य पाठ में एकवचन ‘विधान’ को पूर्वपद मानकर उसके न टलने का भाव दिया गया है; अन्य संभव वाक्य-विन्यास पादटिप्पणी में सुरक्षित हैं।
theological_decisions:
- issue: וְלֹא יַעֲבוֹר का कर्ता और अर्थ
  choice: 'विधान स्वयं स्थायी है: ‘जो कभी टलेगा नहीं।’'
  alternative: ‘और वे उससे आगे नहीं बढ़ेंगे,’ अथवा ‘कोई उससे आगे नहीं बढ़ेगा।’
  rationale: इब्रानी क्रिया एकवचन है और उसका कर्म व्यक्त नहीं किया गया, इसलिए वाक्यांश व्याकरणतः अस्पष्ट है। मुख्य पाठ निकटतम एकवचन संज्ञा חק को कर्ता मानता है, जबकि सृष्ट वस्तुओं या अनिश्चित कर्ता वाली व्याख्याएँ पादटिप्पणी में रखी गई हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण काव्यात्मक गद्य। ‘सदा-सर्वदा’ मूल की पुनरुक्तिपूर्ण तीव्रता रखता है; ‘विधान’ धार्मिक-कानूनी अतिरेक से बचते हुए निर्धारित सृष्टि-व्यवस्था को व्यक्त करता है।
