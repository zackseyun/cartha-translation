lexical_decisions:
- source_word: בַּחוּרִים
  choice: जवान पुरुष
  rationale: यह बहुवचन संज्ञा प्रायः युवावस्था या जीवन के उत्कर्ष में पहुँचे पुरुषों को दर्शाती है। ‘जवान पुरुष’ आधुनिक हिन्दी में स्वाभाविक है और पुरुष-वाचक अर्थ बनाए रखता है।
- source_word: וְגַם
  choice: और
  rationale: इस संक्षिप्त काव्यात्मक सूची में सामान्य समुच्चय ‘और’ ही योगात्मक भाव को सहज रूप से व्यक्त करता है।
- source_word: בְּתוּלוֹת
  choice: जवान स्त्रियाँ
  rationale: शब्द विशेष रूप से कुँवारी या अविवाहित युवतियों को सूचित कर सकता है, पर यहाँ आयु और लिंग के समूहों की काव्यात्मक सूची में सामान्य अभिप्राय ‘जवान स्त्रियाँ’ है; अधिक विशिष्ट अर्थ पादटिप्पणी में रखा गया है।
- source_word: זְקֵנִים
  choice: बूढ़े पुरुष
  rationale: आयु-समूहों के इस क्रम में इसका अर्थ पदधारी ‘पुरनिए’ नहीं, बल्कि अधिक आयु के पुरुष है। यह चयन आयु और पुरुष-वाचकता दोनों को स्पष्ट रखता है।
- source_word: עִם
  choice: और
  rationale: हिब्रू ‘साथ’ का भाव देता है, पर हिन्दी की संक्षिप्त काव्यात्मक सूची में ‘और’ दोनों समूहों को स्वाभाविक ढंग से जोड़ता है।
- source_word: נְעָרִים
  choice: लड़के
  rationale: यहाँ यह पहले आए वयस्क जवान पुरुषों की तुलना में कम आयु के पुरुषों को दर्शाता है। ‘लड़के’ आयु और लिंग का विरोध बनाए रखता है; शब्द की व्यापक आयु-सीमा पादटिप्पणी में दी गई है।
