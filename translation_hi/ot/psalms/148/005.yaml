  text: יְֽ֭הַֽלְלוּ אֶת שֵׁ֣ם יְהוָ֑ה כִּ֤י ה֭וּא צִוָּ֣ה וְ/נִבְרָֽאוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/148/005.yaml
  text: Let them praise the name of Yahweh[a], for he commanded, and they were created.
translation:
  language: hi
  text: 'वे याहवे[a] के नाम की स्तुति करें,

    क्योंकि उसने आज्ञा दी, और वे रचे गए।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी: ‘YHWH’ (יהוה)। इसे परंपरागत रूप से ‘प्रभु’ के रूप में प्रस्तुत किया जाता है; ‘यहोवा’ एक वैकल्पिक रूप है।'
    reason: दिव्य नाम के इब्रानी रूप तथा प्रचलित वैकल्पिक निरूपण को स्पष्ट करना।
lexical_decisions:
- source_word: יְהַלְלוּ
  choice: स्तुति करें
  rationale: पिएल अपूर्ण/आज्ञार्थक भाव यहाँ आसपास संबोधित सृष्ट वस्तुओं के लिए स्तुति का आह्वान है; ‘स्तुति करें’ हिंदी में इस भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֶת שֵׁם
  choice: के नाम की
  rationale: यह ‘नाम की स्तुति करना’ वाला बाइबिलीय मुहावरा बनाए रखता है और परमेश्वर की प्रकट पहचान तथा कीर्ति—दोनों के आशय को खुला रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल इब्रानी में प्रयुक्त चार-अक्षरीय दिव्य नाम को किसी उपाधि से बदलने के बजाय हिंदी में लिप्यंतरित किया गया है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यहाँ כִּי स्तुति के आह्वान का कारण प्रस्तुत करता है; ‘क्योंकि’ आधुनिक हिंदी में स्पष्ट और स्वाभाविक है।
- source_word: הוּא
  choice: उसने
  rationale: स्पष्ट इब्रानी सर्वनाम का संदर्भ याहवे से है। हिंदी में ‘उसने’ कर्ता को स्पष्ट रखता है, पर अनावश्यक रूप से ‘उसी ने’ जैसा अतिरिक्त बल नहीं जोड़ता।
- source_word: צִוָּה
  choice: आज्ञा दी
  rationale: यह क्रिया आदेश देने को दर्शाती है; ‘आज्ञा दी’ सृष्टि के उसके वचन से घटित होने का सीधा कारण बनाए रखता है।
- source_word: וְנִבְרָאוּ
  choice: और वे रचे गए
  rationale: निफ़अल पूर्ण बहुवचन के कर्मवाच्य रूप को बनाए रखते हुए ‘रचे गए’ सृष्टि के आशय को सामान्य आधुनिक हिंदी में व्यक्त करता है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: पद में चार-अक्षरीय निजी दिव्य नाम सीधे आया है। ‘याहवे’ उसे उपाधि से प्रतिस्थापित किए बिना प्रस्तुत करता है; पादटिप्पणी पारंपरिक विकल्प की जानकारी देती है।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। काव्यात्मक पंक्ति-विभाजन कारणसूचक दूसरे खंड को उभारता है। ‘रचे गए’ कर्मवाच्य मूल रूप तथा सृष्टि-संबंधी अर्थ दोनों को सुरक्षित रखता है।
