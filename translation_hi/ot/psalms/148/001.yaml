id: PSA.148.1
reference: Psalms 148:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: הַ֥לְלוּ יָ֨הּ הַֽלְל֣וּ אֶת יְ֭הוָה מִן הַ/שָּׁמַ֑יִם הַֽ֝לְל֗וּ/הוּ בַּ/מְּרוֹמִֽים׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/148/001.yaml
  text: Praise Yah! Praise Yahweh from the heavens[a]; praise him in the heights.
translation:
  language: hi
  text: याह की स्तुति करो![a] आकाशों से याहवे की स्तुति करो; ऊँचाइयों में उसकी स्तुति करो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी ‘हालेलू-याह’ का शाब्दिक अर्थ है, ‘याह की स्तुति करो।’
    reason: पहले आह्वान की इब्रानी अभिव्यक्ति और उससे बने प्रचलित ‘हालेलूयाह’ का अर्थ स्पष्ट करना।
lexical_decisions:
- source_word: הַלְלוּ
  choice: स्तुति करो
  rationale: पिएल रूप का बहुवचन आज्ञार्थक है और सीधे सामूहिक आह्वान को व्यक्त करता है।
- source_word: יָהּ
  choice: याह
  rationale: यह परमेश्वर के नाम का संक्षिप्त काव्यात्मक रूप है; लिप्यंतरण करने से अगले पूर्ण रूप יְהוָה से इसका भेद बना रहता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में आए परमेश्वर के विशिष्ट वाचा-नाम को आधुनिक हिन्दी में स्पष्ट लिप्यंतरण द्वारा रखा गया है।
- source_word: מִן הַשָּׁמַיִם
  choice: आकाशों से
  rationale: מִן का अर्थ ‘से’ और שָׁמַיִם का बहुवचन रूप सुरक्षित रहता है; यह समस्त आकाशीय जगत को किए गए आह्वान के अनुकूल है।
- source_word: הַלְלוּהוּ
  choice: उसकी स्तुति करो
  rationale: क्रिया से जुड़ा तृतीय पुरुष एकवचन प्रत्यय पूर्वोक्त याहवे की ओर संकेत करता है।
- source_word: בַּמְּרוֹמִים
  choice: ऊँचाइयों में
  rationale: यह ऊँचे, उन्नत आकाशीय क्षेत्रों की स्थानिक छवि को बिना ‘सर्वोच्च स्वर्ग’ जैसा अतिरिक्त अर्थ जोड़े व्यक्त करता है।
theological_decisions:
- issue: एक ही पद में יָהּ और יְהוָה का अनुवाद
  choice: יָהּ को ‘याह’ और יְהוָה को ‘याहवे’ रखा गया
  alternative: दोनों को ‘प्रभु’ कहना, अथवा दोनों के लिए एक ही नामरूप अपनाना
  rationale: दो अलग हिब्रू रूपों का भेद बनाए रखने और मूल में उपस्थित विशिष्ट ईश्वरीय नाम को अस्पष्ट न करने के लिए दोनों का पृथक लिप्यंतरण किया गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और उपासना-योग्य रखी गई है। ‘आकाशों’ तथा ‘ऊँचाइयों’ से मूल की बहुवचन और ऊर्ध्व स्थानिक छवि बनी रहती है; वाक्य की तीन समानांतर आज्ञाएँ भी सुरक्षित हैं।
