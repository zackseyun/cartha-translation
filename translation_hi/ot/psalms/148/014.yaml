source:
  edition: WLC
  text: וַ/יָּ֤רֶם קֶ֨רֶן לְ/עַמּ֡/וֹ תְּהִלָּ֤ה לְֽ/כָל חֲסִידָ֗י/ו לִ/בְנֵ֣י יִ֭שְׂרָאֵל עַֽם קְרֹב֗/וֹ הַֽלְלוּ יָֽהּ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/148/014.yaml
  text: And he has raised up a horn for his people[a], praise for all his faithful ones, for the sons of Israel, the people near to him[d][c][b]. Praise Yah!
translation:
  language: hi
  text: उसने अपने लोगों के लिए एक सींग ऊँचा किया है—अपने सभी भक्तों के लिए स्तुति, इस्राएल के पुत्रों के लिए, उसके निकट के लोगों के लिए। याह की स्तुति करो!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּרֶם
  choice: उसने ... ऊँचा किया है
  rationale: रूम धातु के उठाने/ऊँचा करने के अर्थ और स्तुतिपरक पूर्ण कार्य—दोनों को व्यक्त करता है।
- source_word: קֶרֶן
  choice: सींग
  rationale: बल, गौरव और ऊँचे सामर्थ्य के इब्रानी काव्यात्मक रूपक को अर्थ में समतल किए बिना सुरक्षित रखता है।
- source_word: לְעַמּוֹ
  choice: अपने लोगों का
  rationale: हिन्दी में ‘सींग ऊँचा करना’ के साथ संबंधसूचक ‘का’ स्वाभाविक है और आशय ‘अपने लोगों के लिए’ बना रहता है।
- source_word: תְּהִלָּה
  choice: स्तुति
  rationale: मूल संज्ञा का सीधा अर्थ रखता है; संक्षिप्त इब्रानी वाक्यरचना के कारण इसका पिछले कथन से संबंध अस्पष्ट है।
- source_word: לְכָל חֲסִידָיו
  choice: अपने सभी निष्ठावानों के लिए
  rationale: חסידיו की वाचा-संबंधी निष्ठा और भक्ति को आधुनिक हिन्दी में व्यक्त करता है, बिना बाद की पारिभाषिक धारणाएँ जोड़े।
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों के लिए
  rationale: मूल के पुल्लिंग बहुवचन रूप को निकटता से बनाए रखता है; यहाँ यह सामूहिक जातीय पदनाम है।
- source_word: עַם קְרֹבוֹ
  choice: जो उसके निकट रहने वाले लोग हैं
  rationale: परमेश्वर से निकटता की संबंधपरक छवि को ‘चुने हुए’ या ‘प्रिय’ कहकर अधिक व्याख्यायित नहीं करता।
- source_word: הַלְלוּ יָהּ
  choice: याह की स्तुति करो!
  rationale: आज्ञार्थक क्रिया और दिव्य नाम के संक्षिप्त रूप יָהּ, दोनों का अर्थ सीधे व्यक्त करता है।
theological_decisions:
- issue: קֶרֶן के रूपक का अनुवाद
  choice: सींग
  alternative: सामर्थ्य
  rationale: काव्यात्मक और धर्मवैचारिक तनाव को बनाए रखने के लिए रूपक को व्याख्यात्मक अमूर्तीकरण में नहीं बदला गया।
- issue: בְנֵי יִשְׂרָאֵל का लिंग-सूचक रूप
  choice: इस्राएल के पुत्र
  alternative: इस्राएल की सन्तान
  rationale: मूल का व्याकरणिक पुल्लिंग रूप रखा गया है, जबकि सन्दर्भ में यह सामूहिक जातीय समुदाय को सूचित करता है।
- issue: תְּהִלָּה का पिछले वाक्यांश से संबंध
  choice: डैश के बाद ‘अपने सभी निष्ठावानों के लिए स्तुति’
  alternative: ‘जो उसके सभी निष्ठावानों के लिए स्तुति का कारण है’
  rationale: मूल की संक्षिप्त और संभावित समानाधिकरणात्मक अथवा परिणामसूचक वाक्यरचना को मुख्य पाठ में अत्यधिक स्पष्ट नहीं किया गया।
- issue: יָהּ का निरूपण
  choice: याह
  alternative: यहोवा / हल्लेलूयाह
  rationale: मूल में प्रयुक्त दिव्य नाम के संक्षिप्त रूप को अर्थ सहित सीधे रखा गया है, न कि उसे יְהוָה के पूर्ण रूप से बदलकर या वाक्यांश को अनूदित छोड़े बिना।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। ‘सींग’ की इब्रानी काव्यात्मक छवि जानबूझकर रखी गई है। केवल वही पादटिप्पणी दी गई है जो वास्तविक वाक्यगत अस्पष्टता स्पष्ट करती है; उसका चिह्न मुख्य पाठ में उपस्थित है।
