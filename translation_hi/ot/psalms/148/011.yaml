lexical_decisions:
- source_word: מַלְכֵי אֶרֶץ
  choice: पृथ्वी के राजाओ
  rationale: सम्बन्धवाचक बहुवचन पद का सीधा और काव्यात्मक हिन्दी रूप; सम्बोधन-सूची के प्रवाह में ‘राजाओ’ स्वाभाविक है।
- source_word: וְכָל לְאֻמִּים
  choice: और सभी जातियो
  rationale: לְאֻמִּים मानव-समुदायों अथवा राष्ट्रों को सूचित करता है। ‘जातियो’ आधुनिक राष्ट्र-राज्यों तक अर्थ को सीमित नहीं करता और सार्वभौमिक समानांतरता बनाए रखता है।
- source_word: שָׂרִים
  choice: हाकिमो
  rationale: यह उच्च पदाधिकारियों और शासकीय अगुओं का व्यापक अर्थ देता है; ‘राजकुमारो’ वंशगत राजपरिवार का अनावश्यक संकेत दे सकता है।
- source_word: וְכָל שֹׁפְטֵי אָרֶץ
  choice: और पृथ्वी के सभी न्यायियो
  rationale: שֹׁפְטֵי का प्रत्यक्ष अर्थ ‘न्याय करनेवाले/न्यायी’ है। यहाँ नेतृत्व-वर्गों की सूची में ‘न्यायियो’ संक्षिप्त और गरिमापूर्ण है।
- source_word: אֶרֶץ / אָרֶץ
  choice: पृथ्वी
  rationale: भजन 148 की समस्त सृष्टि को समेटने वाली व्यापक पुकार में स्थानीय ‘देश’ या ‘भूमि’ की अपेक्षा ‘पृथ्वी’ अधिक उपयुक्त है।
theological_decisions:
- issue: स्तुति-सूची में אֶרֶץ का दायरा
  choice: पृथ्वी
  alternative: देश / भूमि
  rationale: पूरे भजन का संदर्भ विश्वव्यापी और सृष्टिगत है, इसलिए व्यापक अर्थ चुना गया; स्थानीय अर्थ की वास्तविक शब्दार्थ-संभावना पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण काव्यात्मक हिन्दी। पद को पिछले आह्वान की निरंतरता मानकर सभी समूहों को सम्बोधन-बहुवचन में रखा गया है। ‘हाकिम’ सहज और व्यापक शासकीय पद है; ‘न्यायी’ मूल के न्यायिक कार्य को बनाए रखता है।
