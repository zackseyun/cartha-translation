translation:
  language: hi
  text: आग और ओले, बर्फ और वाष्प[a], तूफ़ानी हवा, जो उसके वचन को पूरा करती है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “धुआँ” अथवा “कुहरा।”
    reason: lexical_alternative
  - marker: b
    text: या “जो उसकी आज्ञा का पालन करती है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵשׁ
  choice: आग
  rationale: यह संज्ञा सामान्य रूप से आग को दर्शाती है और सृष्टि की इस सूची में स्वाभाविक हिन्दी विकल्प है।
- source_word: וּבָרָד
  choice: और ओले
  rationale: בָּרָד का अर्थ ओले है; आरम्भिक संयोजक को 'और' से व्यक्त किया गया है।
- source_word: שֶׁלֶג
  choice: बर्फ
  rationale: मौसम-संबंधी इस सूची में यह שֶׁלֶג का सहज और सर्वसुलभ हिन्दी रूप है।
- source_word: וְקִיטוֹר
  choice: और धुआँ
  rationale: קִיטוֹר धुआँ, वाष्प या कुहरा दर्शा सकता है। बाइबिलीय प्रयोग में 'धुआँ' एक सशक्त और स्वाभाविक अर्थ है; अन्य संभावनाएँ पादटिप्पणी में रखी गई हैं।
- source_word: רוּחַ סְעָרָה
  choice: आँधी
  rationale: शाब्दिक रूप से यह तूफानी वायु है; आधुनिक हिन्दी में 'आँधी' दोनों घटकों को संक्षेप और स्वाभाविक ढंग से व्यक्त करती है।
- source_word: עֹשָׂה דְבָרוֹ
  choice: जो उसके वचन को पूरा करती है
  rationale: עֹשָׂה का मूल भाव 'करना' है, पर हिन्दी में 'वचन को करना' अस्वाभाविक है। 'वचन को पूरा करना' आज्ञा अथवा कथन को कार्यान्वित करने का भाव स्वाभाविक रूप से देता है, जबकि 'वचन' דָּבָר की व्यापकता बनाए रखता है।
theological_decisions:
- issue: דְבָרוֹ में पुल्लिंग एकवचन प्रत्यय का संकेत
  choice: '''उसके वचन''—सन्दर्भ में परमेश्वर का वचन'
  alternative: '''उसकी आज्ञा'''
  rationale: पूरे भजन में सृष्ट वस्तुओं को परमेश्वर की स्तुति के लिए बुलाया गया है, इसलिए प्रत्यय का स्वाभाविक संकेत परमेश्वर की ओर है। मुख्य पाठ में 'वचन' रखने से דָּבָר की शब्दार्थगत व्यापकता बनी रहती है; 'आज्ञा' प्रसंगगत अर्थ को स्पष्ट करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी, काव्यात्मक परन्तु सहज। पद की सूचीबद्ध लय को बनाए रखा गया है। स्त्रीलिंग 'करती है' का संबंध 'आँधी' से है।
