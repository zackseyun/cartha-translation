  text: The earth and all who dwell in it melt away[a]; I myself have set its pillars firm[c][b]. Selah
translation:
  language: hi
  text: पृथ्वी और उसके सभी निवासी पिघल रहे हैं[a]; मैंने ही उसके स्तंभों को स्थिर किया है[b]। सेला[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘डगमगा रहे हैं,’ ‘गल रहे हैं,’ अथवा ‘हिल रहे हैं।’ इब्रानी बिंब अस्थिरता या ढह जाने का है।
    reason: lexical_alternative
  - marker: b
    text: या ‘मैंने उसके स्तंभ स्थापित किए हैं।’
    reason: lexical_alternative
  - marker: c
    text: ‘सेला’ का परंपरागत रूप से लिप्यंतरण किया जाता है; इसका ठीक अर्थ अनिश्चित है।
    reason: cultural_note
lexical_decisions:
- source_word: נְמֹגִים
  choice: गलते जा रहे हैं
  rationale: यह रूप पिघलने, घुलने या ढहकर अस्थिर होने का सजीव काव्यात्मक बिंब देता है। ‘गलते जा रहे हैं’ उस बिंब को बनाए रखता है; वैकल्पिक अर्थ पादटिप्पणी में दिए गए हैं।
- source_word: אֶרֶץ
  choice: पृथ्वी
  rationale: ‘उसके सभी निवासी’ और ‘उसके स्तंभ’ के साथ यहाँ स्थानीय भूमि के बजाय व्यापक, विश्व-संबंधी अर्थ अधिक उपयुक्त है।
- source_word: יֹשְׁבֶיהָ
  choice: उसके सभी निवासी
  rationale: यह स्वाभाविक आधुनिक हिन्दी में पृथ्वी पर रहने वाले सब लोगों को व्यक्त करता है।
- source_word: אָנֹכִי
  choice: मैंने ही
  rationale: स्वतंत्र सर्वनाम के बलाघात को ‘ही’ द्वारा व्यक्त किया गया है, पर इसे ‘मैं अकेला’ कहकर आवश्यकता से अधिक विशिष्ट नहीं बनाया गया।
- source_word: תִכַּנְתִּי
  choice: दृढ़ किया है
  rationale: पिएल रूप यहाँ स्थापित करने, स्थिर करने या दृढ़ करने का भाव देता है; स्तंभों के संदर्भ में ‘दृढ़ किया है’ स्थिरता लाने की क्रिया स्पष्ट करता है।
- source_word: עַמּוּדֶיהָ
  choice: उसके स्तंभों
  rationale: ‘स्तंभ’ मूल काव्यात्मक विश्व-बिंब को बिना आधुनिक वैज्ञानिक पुनर्व्याख्या के बनाए रखता है।
- source_word: סֶּלָה
  choice: सेला
  rationale: इस शब्द का ठीक अर्थ अनिश्चित है, इसलिए अनुमानित अर्थ देने के बजाय परंपरागत लिप्यंतरण रखा गया है।
theological_decisions:
- issue: पृथ्वी के स्तंभों का विश्व-संबंधी काव्यात्मक बिंब
  choice: मुख्य पाठ में ‘उसके स्तंभों’ को यथावत रखना
  alternative: उसकी नींवों / उसके आधारों
  rationale: भजन परमेश्वर के स्थिर करने वाले शासन को प्राचीन काव्यात्मक विश्व-बिंब से व्यक्त करता है। शाब्दिक बिंब बनाए रखने से पाठ का आशय आधुनिक वैज्ञानिक भाषा में पुनर्गठित नहीं होता।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी रखी गई है। ‘गलते जा रहे हैं’ मूल के असामान्य लेकिन प्रभावशाली काव्यात्मक बिंब को सुरक्षित रखता है; ‘मैंने ही’ वक्ता के बलाघात को व्यक्त करता है।
