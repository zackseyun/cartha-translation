  text: כִּ֤י לֹ֣א מִ֭/מּוֹצָא וּ/מִֽ/מַּעֲרָ֑ב וְ֝/לֹ֗א מִ/מִּדְבַּ֥ר הָרִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/075/006.yaml
  text: For not from the east or from the west[c][b][a], and not from the wilderness comes lifting up.
translation:
  language: hi
  text: क्योंकि उन्नति न पूर्व से, न पश्चिम से, और न निर्जन प्रदेश से आती है।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक भावार्थपूर्ण अनुवाद हो सकता है: “पद-प्रतिष्ठा” या “ऊँचा उठाया जाना।” इब्रानी कथन संक्षिप्त और कठिन है; अगली आयत में परमेश्वर एक को नीचा करता और दूसरे को ऊँचा उठाता है।'
    reason: lexical_alternative
  - marker: b
    text: अंतिम इब्रानी शब्द को “पहाड़” भी समझा गया है, जिससे “और न पहाड़ों के निर्जन प्रदेश से” जैसा अर्थ निकलता है। पर संदर्भ “ऊँचा उठाए जाने” के अर्थ का अधिक समर्थन करता है।
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण या स्पष्टीकरण प्रस्तुत करता है और भजन के तर्क-प्रवाह में स्वाभाविक है।
- source_word: מִמּוֹצָא
  choice: पूर्व से
  rationale: शब्द का मूल बिंब सूर्य के निकलने का स्थान है; यहाँ दिशासूचक अर्थ को सहज हिन्दी में व्यक्त किया गया है।
- source_word: וּמִמַּעֲרָב
  choice: न पश्चिम से
  rationale: מַעֲרָב सूर्यास्त अथवा पश्चिम को सूचित करता है; दोहराई गई नकारात्मक शृंखला को हिन्दी में स्पष्ट किया गया है।
- source_word: מִמִּדְבַּר
  choice: न जंगल से
  rationale: מִדְבָּר निर्जन वन-प्रदेश या मरुभूमि को दर्शाता है; ‘जंगल’ सामान्य आधुनिक हिन्दी में बाइबलीय ‘निर्जन प्रदेश’ का व्यापक और सुबोध रूप है।
- source_word: הָרִים
  choice: ऊँचा उठाया जाना आता है
  rationale: कठिन और संक्षिप्त इब्रानी वाक्यांश को רום, ‘ऊँचा उठाना,’ से संबंधित मानते हुए अनूदित किया गया है। अगली आयत में परमेश्वर द्वारा एक को गिराने और दूसरे को उठाने का संदर्भ इसका समर्थन करता है।
theological_decisions:
- issue: अंतिम शब्द הָרִים की व्याख्या
  choice: यह पद बताता है कि ऊँचा उठाया जाना किसी सांसारिक दिशा या स्थान से नहीं आता।
  alternative: इसे संज्ञा ‘पहाड़’ मानकर ‘और न पहाड़ों के जंगल से’ जैसा अर्थ लिया जा सकता है।
  rationale: इब्रानी वाक्य संक्षिप्त और कठिन है, इसलिए उसकी अस्पष्टता स्वीकार की गई है। फिर भी अगली आयत में न्याय करने वाले परमेश्वर के एक को नीचा करने और दूसरे को ऊँचा उठाने के कारण क्रियात्मक अर्थ संदर्भ में अधिक उपयुक्त है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और स्रोत-संरचना के निकट भाषा रखी गई है। कठिन इब्रानी पदबंध का मुख्य संदर्भानुकूल अर्थ पाठ में और वास्तविक वैकल्पिक पठन पादटिप्पणी में सुरक्षित है।
