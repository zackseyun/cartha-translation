source:
  edition: WLC
  text: כִּ֤י כ֪וֹס בְּֽ/יַד יְהוָ֡ה וְ/יַ֤יִן חָמַ֨ר מָ֥לֵא מֶסֶךְ֮ וַ/יַּגֵּ֪ר מִ֫/זֶּ֥ה אַךְ שְׁ֭מָרֶי/הָ יִמְצ֣וּ יִשְׁתּ֑וּ כֹּ֝֗ל רִשְׁעֵי אָֽרֶץ־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/075/008.yaml
  text: For a cup is in the hand of Yahweh[a], and the wine foams, full of mixed spices; he pours from it[c][b], and surely all the wicked of the earth will drain its dregs and drink.
translation:
  language: hi
  text: 'क्योंकि यहोवा के हाथ में एक प्याला है;


    उसमें दाखमधु झाग मार रहा है


    और मिश्रण से भरा हुआ है।[a]


    वह उसमें से उंडेलता है;


    निश्चय ही पृथ्वी के सारे दुष्ट


    उसकी तलछट को निचोड़कर पी जाएँगे।[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पूरी तरह मिलाया हुआ।” इसका आशय तैयार किया हुआ मिश्रित दाखमधु है, जिसमें सम्भवतः मसाले मिलाए गए थे।
    reason: lexical_alternative
  - marker: b
    text: “तलछट” प्याले के नीचे बैठ जाने वाला अवशेष है। चित्र यह है कि दुष्टों को प्याला अन्तिम अंश तक पीना पड़ेगा।
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पद पिछले कथन का आधार बताता है; इसलिए कारणसूचक अर्थ स्वाभाविक है।
- source_word: כּוֹס
  choice: प्याला
  rationale: दिव्य न्याय से जुड़ी ठोस काव्यात्मक छवि को बनाए रखता है और हिन्दी बाइबलीय भाषा में सहज है।
- source_word: בְּיַד יְהוָה
  choice: यहोवा के हाथ में
  rationale: अधिकार और नियंत्रण व्यक्त करने वाले इब्रानी मूर्त मुहावरे को सुरक्षित रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम को हिन्दी में प्रचलित लिप्यंतरण द्वारा प्रस्तुत करता है।
- source_word: יַיִן
  choice: दाखमधु
  rationale: अंगूर से बनी मदिरा का सीधा, गरिमापूर्ण और प्रसंगानुकूल हिन्दी पर्याय है।
- source_word: חָמַר
  choice: झाग उठा रहा है
  rationale: यह क्रिया सक्रिय, प्रबल मदिरा के झाग उठने या खमीरित होने की जीवंत छवि देती है; केवल रंग बताना कम संभावित है।
- source_word: מָלֵא מֶסֶךְ
  choice: पूरी तरह मिलाया हुआ
  rationale: तैयार किए गए मिश्रित दाखमधु का अर्थ रखता है, पर मुख्य पाठ में मसाले जैसी अनिश्चित सामग्री को निश्चित नहीं करता।
- source_word: וַיַּגֵּר מִזֶּה
  choice: वह उसमें से उंडेलता है
  rationale: क्रिया के उंडेलने के अर्थ और מִזֶּה के ‘इसमें से’ भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אַךְ
  choice: निश्चय ही
  rationale: यहाँ प्रतिबंध से अधिक न्याय की निश्चितता पर बल देता है।
- source_word: שְׁמָרֶיהָ
  choice: उसकी तलछट
  rationale: प्याले के तल में बची मदिरा की गाद या अवसाद को स्पष्ट आधुनिक हिन्दी में व्यक्त करता है।
- source_word: יִמְצוּ יִשְׁתּוּ
  choice: तलछट तक निचोड़कर पी जाएँगे
  rationale: दोनों क्रियाओं से व्यक्त पूरी तरह निकालकर पीने की तीव्र और संपूर्ण क्रिया को हिन्दी में संक्षेपतः सुरक्षित रखता है।
theological_decisions:
- issue: दिव्य नाम का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल में चतुरक्षरी व्यक्तिगत नाम יהוה है; उसका लिप्यंतरण सामान्य पदवी से भेद बनाए रखता है।
- issue: प्याले की छवि
  choice: प्याले और दाखमधु की मूल छवि को बिना व्याख्यात्मक विस्तार के रखना
  alternative: ‘क्रोध का प्याला’ कहना
  rationale: प्रसंग दिव्य न्याय की ओर संकेत करता है, पर इस पद में ‘क्रोध’ शब्द नहीं है; अतः अंतर्निहित धर्मवैचारिक अर्थ को मुख्य पाठ में जोड़ा नहीं गया।
- issue: मिश्रित दाखमधु की सामग्री
  choice: पूरी तरह मिलाया हुआ
  alternative: मसालों से भरा हुआ
  rationale: מֶסֶךְ तैयार या मिश्रित दाखमधु बताता है, पर मिश्रण की ठीक सामग्री स्पष्ट नहीं है; व्यापक अनुवाद मूल अस्पष्टता बचाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में काव्यात्मक पंक्ति-विन्यास रखा गया है। भाषा गरिमापूर्ण लेकिन सुबोध है; ‘प्याला’, ‘उंडेलता’ और ‘तलछट’ मूल चित्र को ठोस रखते हैं।
