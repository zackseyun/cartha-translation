source:
  edition: WLC
  text: כִּ֭י אֶקַּ֣ח מוֹעֵ֑ד אֲ֝נִ֗י מֵישָׁרִ֥ים אֶשְׁפֹּֽט׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/075/002.yaml
  text: For when I choose the appointed time[b][a], I myself will judge with uprightness.
translation:
  language: hi
  text: क्योंकि जब मैं ठहराया हुआ समय चुनूँगा[a][b], तब मैं स्वयं निष्पक्षता से न्याय करूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्योंकि जब मैं ठहराया हुआ समय लूँगा, तब मैं समता से न्याय करूँगा।” इब्रानी क्रिया का शाब्दिक अर्थ “लेना” है; “समता” उस शब्द का एक अन्य सम्भव अनुवाद है जिसका अनुवाद मुख्य पाठ में “निष्पक्षता” किया गया है।
    reason: lexical_alternative
  - marker: b
    text: या, “नियत समय ठहराऊँगा।”
    reason: previous_rendering
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह शब्द पिछले कथन का आधार या स्पष्टीकरण प्रस्तुत करता है; समय का भाव आगे आने वाले ‘जब’ से व्यक्त होता है।
- source_word: אֶקַּח
  choice: चुनूँगा
  rationale: क्रिया का मूल अर्थ ‘लेना’ है, पर מוֹעֵד के साथ यह किसी निश्चित समय को चुनने या निर्धारित करने का भाव देती है। ‘चुनूँगा’ सहज है और अर्थ को आवश्यकता से अधिक स्पष्ट नहीं करता।
- source_word: מוֹעֵד
  choice: ठहराया हुआ समय
  rationale: यह संज्ञा किसी नियुक्त, निश्चित या पहले से ठहराए हुए समय को दर्शाती है।
- source_word: אֲנִי
  choice: मैं स्वयं
  rationale: स्वतंत्र सर्वनाम पहले पुरुष पर विशेष बल देता है, जिसे ‘मैं स्वयं’ सुरक्षित रखता है।
- source_word: מֵישָׁרִים
  choice: निष्पक्षता से
  rationale: बहुवचन संज्ञा न्याय में खरापन, समता और निष्पक्षता का भाव रखती है। आधुनिक हिन्दी में ‘निष्पक्षता से’ न्यायिक संदर्भ को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: אֶשְׁפֹּט
  choice: न्याय करूँगा
  rationale: यहाँ क्रिया न्यायिक कार्य को दर्शाती है और प्रसंग में भविष्यकालीन घोषणा के रूप में आती है।
theological_decisions:
- issue: वक्ता और न्याय करने का दावा
  choice: पद को प्रथम पुरुष में न्याय करने वाले वक्ता की सीधी घोषणा के रूप में रखा गया है; नाम जोड़कर वक्ता की पहचान स्पष्ट नहीं की गई।
  alternative: संदर्भ के आधार पर वक्ता को स्पष्ट रूप से परमेश्वर कहना।
  rationale: मूल पद में प्रथम पुरुष क्रियाएँ और बलसूचक सर्वनाम हैं, पर इसी पद के भीतर वक्ता का नाम नहीं दिया गया। इसलिए अनुवाद दैवी न्याय के संदर्भ के अनुकूल रहते हुए भी मूल की अभिव्यक्ति से आगे नहीं जाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘जब…तब’ से वाक्य का कालगत संबंध स्पष्ट होता है, जबकि आरम्भ का ‘क्योंकि’ पिछले पद से उसके कारणसूचक संबंध को बनाए रखता है।
