  text: לַ/מְנַצֵּ֥חַ אַל תַּשְׁחֵ֑ת מִזְמ֖וֹר לְ/אָסָ֣ף שִֽׁיר־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/075/000.yaml
  text: 'For the choirmaster: “Do Not Destroy.”[a] A psalm of Asaph[b]. A song.'
translation:
  language: hi
  text: संगीत-निर्देशक के लिए। “नष्ट न कर।”[a] आसाफ का भजन।[b] एक गीत।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यह संभवतः किसी धुन का नाम या संगीत-संबंधी निर्देश है: “नष्ट न कर।”'
    reason: cultural_note
  - marker: b
    text: “आसाफ का” लेखकत्व, आसाफ से संबंध, या आसाफीय संग्रह में सम्मिलित होने का संकेत दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: संगीत-निर्देशक के लिए
  rationale: भजन-संहिता के शीर्षकों में यह पद संगीत-प्रस्तुति का निर्देशन करने वाले व्यक्ति को दर्शाता है; यह अनुवाद उसके सांगीतिक कार्य को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: אַל תַּשְׁחֵת
  choice: “नष्ट न कर”
  rationale: क्रिया का सीधा अर्थ ‘नष्ट करना’ है। शीर्षक में यह संभवतः किसी धुन का नाम या संगीत-संबंधी निर्देश है, इसलिए इसे उद्धरण-चिह्नों में रखा गया है।
- source_word: מִזְמוֹר
  choice: भजन
  rationale: यह भजन-संहिता में प्रयुक्त मानक काव्य-सांगीतिक विधा-सूचक शब्द है।
- source_word: לְאָסָף
  choice: आसाफ का
  rationale: उपसर्ग לְ यहाँ रचनाकार, संबंध, समर्पण या आसाफीय संग्रह से जुड़ाव बता सकता है; प्रचलित हिन्दी ‘आसाफ का’ संक्षिप्त है, जबकि पाद-टिप्पणी इसकी वास्तविक व्यापकता बनाए रखती है।
- source_word: שִׁיר
  choice: एक गीत
  rationale: इसे अलग विधा-सूचक पद के रूप में रखकर मूल के दोहरे परिचय—מִזְמוֹר और שִׁיר—को सुरक्षित रखा गया है।
theological_decisions:
- issue: לְאָסָף में संबंध का प्रकार
  choice: मुख्य पाठ में ‘आसाफ का’, साथ में अर्थ-व्याप्ति बताने वाली पाद-टिप्पणी
  alternative: ‘आसाफ द्वारा’ या ‘आसाफ के लिए’
  rationale: मूल व्याकरण केवल लेखकत्व निश्चित नहीं करता; इसलिए किसी एक संबंध को धर्मवैचारिक या ऐतिहासिक रूप से निर्णायक नहीं बनाया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण भजन-शीर्षक शैली अपनाई गई है। तकनीकी किंतु सहज ‘संगीत-निर्देशक’ से सांगीतिक संदर्भ स्पष्ट होता है। मूल की खंडित शीर्षकीय संरचना और दोनों विधा-सूचक शब्द अलग-अलग सुरक्षित रखे गए हैं।
