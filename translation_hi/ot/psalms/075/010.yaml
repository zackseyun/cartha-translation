source:
  edition: WLC
  text: וְ/כָל קַרְנֵ֣י רְשָׁעִ֣ים אֲגַדֵּ֑עַ תְּ֝רוֹמַ֗מְנָה קַֽרְנ֥וֹת צַדִּֽיק־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/075/010.yaml
  text: And I will cut off all the horns of the wicked[a], but the horns of the righteous will be lifted up.
translation:
  language: hi
  text: और मैं दुष्टों के सभी सींग काट डालूँगा[a], पर धर्मी के सींग ऊँचे उठेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ ‘सींग’ शक्ति, सामर्थ्य या ऊँचे पद का रूपक है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כָל
  choice: और ... सभी
  rationale: וְ पद को पिछले संदर्भ से जोड़ता है, इसलिए सरल संयोजक ‘और’ रखा गया है; כָּל के लिए स्वाभाविक आधुनिक हिन्दी ‘सभी’ है।
- source_word: קַרְנֵי / קַרְנוֹת
  choice: सींग
  rationale: कֶרֶן का मूल अर्थ ‘सींग’ है और यहाँ यह शक्ति, सामर्थ्य तथा प्रतिष्ठा का काव्यात्मक रूपक है। अमूर्त अर्थ रखने के बजाय मूल बिंब को दोनों स्थानों पर सुरक्षित रखा गया है।
- source_word: רְשָׁעִים
  choice: दुष्टों
  rationale: बहुवचन संज्ञात्मक विशेषण दुष्ट लोगों को एक वर्ग के रूप में सूचित करता है; ‘दुष्टों’ संक्षिप्त और स्वाभाविक हिन्दी है।
- source_word: אֲגַדֵּעַ
  choice: मैं ... काट डालूँगा
  rationale: גדע का अर्थ काट देना या काट गिराना है। ‘काट डालूँगा’ सींग के बिंब के अनुकूल है और निर्णायक रूप से शक्ति मिटाने का भाव व्यक्त करता है।
- source_word: תְּרוֹמַמְנָה
  choice: ऊँचे उठेंगे
  rationale: רום से बना यह रूप ऊँचा किए जाने या प्रतिष्ठित होने का भाव देता है। ‘ऊँचे उठेंगे’ हिन्दी में स्वाभाविक रहते हुए परिणाम और काव्यात्मक बिंब दोनों को बनाए रखता है।
- source_word: צַדִּיק
  choice: धर्मी
  rationale: यद्यपि इब्रानी शब्द एकवचन है, यहाँ वह दुष्टों के विपरीत धर्मी व्यक्ति अथवा धर्मी वर्ग का प्रतिनिधिक उल्लेख है। ‘धर्मी’ इस एकवचन और सामान्य अर्थ दोनों को सुरक्षित रखता है।
theological_decisions:
- issue: ‘सींग’ का शक्ति और प्रतिष्ठा के रूपक के रूप में प्रयोग
  choice: मुख्य पाठ में ‘सींग’ का ठोस काव्यात्मक बिंब बनाए रखा गया है।
  alternative: ‘मैं दुष्टों की सारी शक्ति मिटा दूँगा, पर धर्मी का सामर्थ्य बढ़ेगा।’
  rationale: बाइबिलीय काव्य में सींग शक्ति, अधिकार और ऊँचे पद का स्थापित रूपक है। इसे सीधे ‘शक्ति’ कर देने से मूल कविता और अर्थ की व्यापकता घट जाती।
- issue: धर्मी के सींगों का ऊँचा होना
  choice: ‘ऊँचे उठेंगे’
  alternative: ‘ऊँचे किए जाएँगे’
  rationale: मूल रूप उत्कर्ष अथवा ऊँचा होने का परिणाम सामने रखता है, पर कर्ता को स्पष्ट नहीं करता। ‘ऊँचे उठेंगे’ उसी अस्पष्टता को अधिक स्वाभाविक हिन्दी में बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘और’ मूल संयोजक को सुरक्षित रखता है, जबकि दोनों अर्ध-पंक्तियों के स्पष्ट विरोध को स्वाभाविक हिन्दी ‘पर’ से व्यक्त किया गया है।
