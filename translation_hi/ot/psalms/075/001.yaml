base_translation:
  language: en
  yaml_path: translation/ot/psalms/075/001.yaml
  text: We give thanks to you[a], O God; we give thanks, for your name is near[c][b]; your wondrous deeds are recounted.
translation:
  language: hi
  text: 'हे परमेश्वर, हम तेरा धन्यवाद करते हैं,

    हम तेरा धन्यवाद करते हैं;

    तेरा नाम निकट है[a];

    लोग तेरे अद्भुत कामों का वर्णन करते हैं[b]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘तेरा नाम निकट है’ परमेश्वर की निकटता, उसकी प्रकट उपस्थिति या उसके प्रसिद्ध चरित्र की ओर संकेत कर सकता है। मूल की अर्थ-समृद्ध अभिव्यक्ति को ज्यों का त्यों रखा गया है।
    reason: lexical_alternative
  - marker: b
    text: मूल इब्रानी में शाब्दिक रूप से ‘वे वर्णन करते हैं’ है, पर कर्ता स्पष्ट नहीं है। इसका अनुवाद ‘तेरे अद्भुत कामों का वर्णन किया जाता है’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹדִינוּ
  choice: हम तेरा धन्यवाद करते हैं
  rationale: हिफ़ील रूप यहाँ परमेश्वर को संबोधित स्तुतिपरक धन्यवाद व्यक्त करता है। पद में इसकी पुनरावृत्ति को ज्यों का त्यों रखा गया है।
- source_word: לְּךָ אֱלֹהִים
  choice: हे परमेश्वर ... तेरा
  rationale: אֱלֹהִים को प्रत्यक्ष संबोधन के रूप में और לְךָ को स्पष्ट द्वितीय पुरुष संबंध के साथ स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: וְקָרוֹב שְׁמֶךָ
  choice: तेरा नाम निकट है
  rationale: ‘नाम’ और ‘निकट’ की इब्रानी अभिव्यक्ति को बनाए रखा गया है, ताकि परमेश्वर की उपस्थिति, प्रकट चरित्र और यश से जुड़ी इसकी अर्थ-समृद्धि किसी एक व्याख्या तक सीमित न हो। आरंभिक וְ को अलग हिन्दी संयोजक से व्यक्त नहीं किया गया, क्योंकि काव्य में अगली पंक्ति का संबंध संदर्भ से स्पष्ट है और ‘क्योंकि’ कहना उसके व्याख्यात्मक अर्थ को आवश्यकता से अधिक निश्चित कर देता।
- source_word: סִפְּרוּ
  choice: लोग ... वर्णन करते हैं
  rationale: यह बिना व्यक्त कर्ता वाला तृतीय पुरुष बहुवचन है। ‘लोग’ अनिश्चित बहुवचन कर्ता को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; ‘वर्णन करते हैं’ दिव्य कामों को सुनाने या घोषित करने का भाव रखता है।
- source_word: נִפְלְאוֹתֶיךָ
  choice: तेरे अद्भुत कामों
  rationale: यह संज्ञा विस्मय उत्पन्न करने वाले असाधारण दिव्य कार्यों की ओर संकेत करती है; ‘अद्भुत काम’ हिन्दी में ठोस कर्मों का भाव स्पष्ट रखता है।
theological_decisions:
- issue: ‘तेरा नाम निकट है’ का अर्थ
  choice: इब्रानी मुहावरे को ‘तेरा नाम निकट है’ के रूप में बनाए रखना
  alternative: ‘तू निकट है’ या ‘तेरी उपस्थिति निकट है’
  rationale: भजन-साहित्य में परमेश्वर का ‘नाम’ उसके प्रकट चरित्र, यश अथवा उपस्थिति की ओर संकेत कर सकता है। मूल पाठ किसी एक अर्थ को अनिवार्य नहीं करता, इसलिए अनुवाद उस धार्मिक अर्थ-तनाव और बहुअर्थकता को सुरक्षित रखता है।
- issue: סִפְּרוּ का अनिश्चित बहुवचन कर्ता
  choice: ‘लोग ... वर्णन करते हैं’
  alternative: ‘वे ... वर्णन करते हैं’ अथवा कर्मवाच्य ‘वर्णन किया जाता है’
  rationale: मूल क्रिया कर्तृवाच्य तृतीय पुरुष बहुवचन है, पर उसका स्पष्ट कर्ता नहीं दिया गया। ‘लोग’ इस अनिश्चितता को हिन्दी में स्वाभाविक रूप से व्यक्त करता है, जबकि कर्मवाच्य मूल क्रिया के रूप को बदल देता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। परमेश्वर को संबोधन में भजन-काव्य के अनुरूप एकवचन आत्मीय रूप ‘तेरा’ रखा गया है। पंक्ति-विन्यास पुनरावृत्ति और इब्रानी काव्य की मुख्य इकाइयों को स्पष्ट करता है।
