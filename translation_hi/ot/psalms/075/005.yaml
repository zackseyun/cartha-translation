  yaml_path: translation/ot/psalms/075/005.yaml
  text: Do not lift up your horn on high[b][a]; do not speak with an arrogant neck.
translation:
  language: hi
  text: अपने सींग को ऊँचा मत उठाओ[a]; ढीठ गर्दन से मत बोलो[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ “सींग” सामर्थ्य, शक्ति, या अपने को ऊँचा करने का रूपक है।
    reason: lexical_alternative
  - marker: b
    text: या, “अकड़ी गर्दन से” अथवा “हठीले ढंग से।” इब्रानी में अभिमानी उद्दंडता के लिए शारीरिक बिंब बना रहता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תָּרִימוּ
  choice: मत उठाओ
  rationale: निषेधवाचक אַל और क्रिया רום के रूप को स्वाभाविक हिन्दी आज्ञार्थक निषेध में व्यक्त करता है तथा उठाने का ठोस बिंब बनाए रखता है।
- source_word: לַמָּרוֹם
  choice: ऊँचा
  rationale: מָרוֹם के ऊँचाई-संबंधी अर्थ को सहज आधुनिक हिन्दी में रखता है; सींग उठाने के स्थानिक बिंब से आत्म-उत्थान का भाव भी बना रहता है।
- source_word: קַרְנְכֶם
  choice: अपने सींग को
  rationale: קֶרֶן का मूल बिंब सुरक्षित रखा गया है; यहाँ सींग सामर्थ्य, अधिकार या घमंड से स्वयं को ऊँचा करने का रूपक हो सकता है।
- source_word: תְּדַבְּרוּ
  choice: मत बोलो
  rationale: דבר के सामान्य अर्थ और समानांतर निषेध को स्पष्ट, गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: בְצַוָּאר עָתָק
  choice: अकड़ी गर्दन से
  rationale: शाब्दिक गर्दन-बिंब को बनाए रखते हुए עָתָק के घमंडी, ढीठ या उद्दंड भाव को स्वाभाविक हिन्दी मुहावरे में व्यक्त करता है।
theological_decisions:
- issue: सींग के रूपक का अर्थ
  choice: मुख्य पाठ में ‘सींग’ को बनाए रखा गया
  alternative: ‘अपनी शक्ति/घमंड को ऊँचा मत करो’
  rationale: मूल काव्यात्मक बिंब शक्ति, प्रतिष्ठा और आत्म-उत्थान के बीच अर्थगत तनाव रखता है; किसी एक व्याख्या से उसे सीमित नहीं किया गया।
- issue: בְצַוָּאר עָתָק की व्याख्या
  choice: ‘अकड़ी गर्दन से’
  alternative: ‘घमंड से’ या ‘ढिठाई की बातें’
  rationale: यह चुनाव शारीरिक रूपक और अभिमानी अवज्ञा दोनों को रखता है, बिना वाक्यांश को केवल वाणी या केवल हठ का अर्थ देने के।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, काव्यात्मक और गरिमापूर्ण। ‘सींग’ तथा ‘गर्दन’ के इब्रानी शारीरिक रूपक सुरक्षित रखे गए हैं, जबकि ‘अकड़ी गर्दन’ से पद स्वाभाविक हिन्दी में समझने योग्य रहता है।
