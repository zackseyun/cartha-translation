  text: כִּֽי אֱלֹהִ֥ים שֹׁפֵ֑ט זֶ֥ה יַ֝שְׁפִּ֗יל וְ/זֶ֣ה יָרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/075/007.yaml
  text: 'For God is the judge: he brings one down[b][a], and lifts up another.'
translation:
  language: hi
  text: क्योंकि परमेश्वर न्यायी है[a]; वह एक को नीचा करता है और दूसरे को ऊँचा उठाता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्योंकि परमेश्वर न्याय करता है।” इब्रानी कृदन्त को क्रियात्मक अर्थ में भी समझा जा सकता है, न कि केवल “न्यायी” जैसे विधेय-संज्ञात्मक रूप में।
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यहाँ כִּי पिछली बात का आधार या कारण बताता है; आधुनिक हिन्दी में “क्योंकि” इस संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: एकवचन विधेय और प्रसंग के अनुसार यहाँ इस्राएल के परमेश्वर का एकवचन अर्थ है; “परमेश्वर” गरिमापूर्ण और प्रचलित हिन्दी रूप है।
- source_word: שֹׁפֵט
  choice: ही न्यायी है
  rationale: कृदन्त को यहाँ विधेय-संज्ञात्मक रूप में समझा गया है। “न्यायी” परमेश्वर की न्याय करने वाली भूमिका को व्यक्त करता है, और “ही” हिन्दी में इस विधेय की केंद्रित प्रमुखता को स्वाभाविक बनाता है। क्रियात्मक अर्थ “न्याय करता है” भी सम्भव है।
- source_word: זֶה ... וְזֶה
  choice: एक ... और दूसरे
  rationale: दोहराया गया संकेतवाचक यहाँ वितरणात्मक है—शाब्दिक रूप से “इसको ... और इसको।” हिन्दी मुहावरे में “एक ... दूसरे” वही अर्थ स्पष्टता से देता है।
- source_word: יַשְׁפִּיל
  choice: नीचा करता है
  rationale: שׁפל के हिफ़ील रूप का अर्थ किसी को नीचा करना है। यह चयन कारक अर्थ और ऊँचा उठाने के साथ स्थानिक रूपक दोनों बनाए रखता है।
- source_word: יָרִים
  choice: ऊँचा उठाता है
  rationale: רום के हिफ़ील रूप का अर्थ उठाना या ऊँचा करना है; यह हिन्दी अभिव्यक्ति मूल स्थानिक रूपक और पहले खंड के विरोधी समानांतर को सुरक्षित रखती है।
theological_decisions:
- issue: אֱלֹהִים שֹׁפֵט में परमेश्वर की न्यायिक भूमिका
  choice: परमेश्वर ही न्यायी है
  alternative: परमेश्वर न्याय करता है
  rationale: इब्रानी कृदन्त विधेय-संज्ञात्मक अथवा क्रियात्मक दोनों अर्थ दे सकता है। मुख्य पाठ में न्यायी की भूमिका को रखा गया है, जबकि पादटिप्पणी क्रियात्मक सम्भावना को सुरक्षित रखती है; इससे किसी अतिरिक्त सांप्रदायिक निष्कर्ष को आरोपित नहीं किया जाता।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण काव्यात्मक गद्य। वितरणात्मक “इसको ... इसको” को स्वाभाविक “एक ... दूसरे” से व्यक्त किया गया है। केवल वास्तविक अर्थगत अस्पष्टता के लिए पादटिप्पणी दी गई है।
