  yaml_path: translation/ot/psalms/075/004.yaml
  text: I said to the boastful[a], “Do not boast,” and to the wicked, “Do not lift up your horn.”
translation:
  language: hi
  text: मैंने डींग मारनेवालों से कहा, “डींग मत मारो,” और दुष्टों से, “अपना सींग ऊँचा मत उठाओ।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपनी शक्ति को ऊँचा मत उठाओ” अथवा “अपना घमंड मत बढ़ाओ।” इब्रानी में “सींग” शक्ति, प्रतिष्ठा या गर्वपूर्ण आत्म-उन्नयन का रूपक है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אָמַרְתִּי
  choice: मैंने ... कहा
  rationale: אמר का काल पूर्ण 1 एकवचन है; काव्य-संदर्भ में पूर्ण क्रिया को स्वाभाविक आधुनिक हिन्दी में भूतकाल से व्यक्त किया गया है।
- source_word: הוֹלְלִים
  choice: घमंडियों
  rationale: यहाँ הלל का अर्थ डींग मारने या घमंड करने वालों से है। ‘घमंडियों’ समान धातु से बने अगले निषेध के साथ शब्दगत संबंध बनाए रखता है।
- source_word: אַל תָּהֹלּוּ
  choice: घमंड मत करो
  rationale: אַל के साथ बहुवचन निषेध को संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त किया गया है तथा הוֹלְלִים के साथ शब्द-संबंध सुरक्षित है।
- source_word: רְשָׁעִים
  choice: दुष्टों
  rationale: भजन-साहित्य में यह नैतिक रूप से बुरे लोगों की प्रचलित श्रेणी है; ‘दुष्ट’ बिना अनावश्यक कानूनी विशिष्टता के इसे व्यक्त करता है।
- source_word: אַל תָּרִימוּ
  choice: ऊँचा मत उठाओ
  rationale: רום के हिफ़ील रूप का सीधा अर्थ ऊपर उठाना या ऊँचा करना है; सींग के रूपक के साथ यह हिन्दी में समझने योग्य है।
- source_word: קָרֶן
  choice: अपना सींग
  rationale: मूल में स्वत्ववाचक शब्द स्पष्ट नहीं है, पर संबोधित बहुवचन के साथ यह मुहावरे में निहित है। ‘अपना’ हिन्दी को स्वाभाविक बनाता है, जबकि ‘सींग’ मूल काव्यात्मक रूपक को बनाए रखता है।
theological_decisions:
- issue: ‘सींग’ के रूपक का आशय
  choice: मुख्य पाठ में ‘अपना सींग ऊँचा मत उठाओ’ रूपक बनाए रखा गया
  alternative: अपनी शक्ति का घमंड मत करो / अपने अहंकार को मत बढ़ाओ
  rationale: इब्रानी ‘सींग’ शक्ति, प्रतिष्ठा और गर्वपूर्ण आत्म-उन्नयन का रूपक हो सकता है। किसी एक अर्थ को मुख्य पाठ में निश्चित करने के बजाय मूल बहुअर्थता और काव्यात्मक तनाव सुरक्षित रखे गए हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल किंतु गरिमापूर्ण काव्यात्मक शैली। समान शब्द-मूल का प्रभाव बनाए रखने के लिए ‘घमंडियों—घमंड मत करो’ रखा गया है।
