  text: וַ֭/אֲנִי אַגִּ֣יד לְ/עֹלָ֑ם אֲ֝זַמְּרָ֗ה לֵ/אלֹהֵ֥י יַעֲקֹֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/075/009.yaml
  text: But as for me[a], I will declare forever; I will sing praise to the God of Jacob.
translation:
  language: hi
  text: परन्तु मैं[a] सदा घोषणा करूँगा; मैं याकूब के परमेश्वर का स्तुतिगान करूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और मैं सदा घोषणा करूँगा।” हिब्रू संयोजक का अनुवाद “और” किया जा सकता है, या प्रसंग में विरोध दिखाने के लिए “परन्तु”।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: परन्तु मैं
  rationale: संयोजक וְ के साथ स्वतंत्र सर्वनाम אֲנִי प्रसंग में बल और विरोध प्रकट करता है; इसलिए ‘परन्तु मैं’ निकटवर्ती दुष्टों के विपरीत भजनकार की प्रतिक्रिया को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אַגִּיד
  choice: घोषणा करता रहूँगा
  rationale: נגד के हिफ़ील रूप का अर्थ बताना या घोषित करना है। ‘घोषणा’ मूल अर्थ को बनाए रखता है, और ‘करता रहूँगा’ לְעוֹלָם के साथ निरंतर संकल्प को सहज हिन्दी में व्यक्त करता है।
- source_word: לְעוֹלָם
  choice: सदा
  rationale: यह दीर्घकालीन अथवा अनवरत अवधि को सूचित करता है। ‘सदा’ काव्यात्मक, वर्तमान और सहज हिन्दी है।
- source_word: אֲזַמְּרָה
  choice: स्तुतिगान करूँगा
  rationale: पिएल क्रिया זמר संगीत के साथ स्तुति करने का भाव रखती है। ‘स्तुतिगान’ गायन और आराधनात्मक प्रशंसा दोनों को समेटता है।
- source_word: לֵאלֹהֵי יַעֲקֹב
  choice: याकूब के परमेश्वर का
  rationale: हिन्दी में ‘किसी का स्तुतिगान करना’ स्वाभाविक प्रयोग है; इसलिए स्रोत का לְ प्राप्तकर्ता-संबंध हिन्दी की क्रिया-संरचना में ‘का’ से व्यक्त हुआ है। ‘याकूब का परमेश्वर’ वाचाई संबोधन को सुरक्षित रखता है।
theological_decisions:
- issue: आसपास के प्रसंग में वक्ता का दुष्टों से विरोध
  choice: आरम्भ को बलयुक्त विरोध के रूप में ‘परन्तु मैं’ अनूदित किया गया है।
  alternative: ‘और मैं’
  rationale: स्वतंत्र सर्वनाम के साथ संयोजक और निकटवर्ती प्रसंग वक्ता की स्थायी स्तुति को दुष्टों के परिणाम के विपरीत रखते हैं। फिर भी हिब्रू संयोजक का साधारण अर्थ ‘और’ भी हो सकता है, इसलिए विकल्प पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण और सामान्य पाठक के लिए सुबोध काव्यात्मक गद्य रखा गया है। ‘परन्तु’ औपचारिकता और स्पष्ट विरोध देता है; ‘स्तुतिगान’ संक्षिप्त रूप से संगीतपूर्ण प्रशंसा व्यक्त करता है।
