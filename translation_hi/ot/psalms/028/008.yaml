lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय उसका प्रचलित हिन्दी लिप्यंतरण रखा गया है।
- source_word: עֹז
  choice: बल
  rationale: यहाँ संज्ञा विधेय के रूप में सामर्थ्य या शक्ति बताती है; ‘बल’ संक्षिप्त और स्वाभाविक है तथा अगले शब्द מָעוֹז से भेद बनाए रखता है।
- source_word: לָמוֹ
  choice: उनका
  rationale: इब्रानी प्रत्यय बहुवचन है। संदर्भ के आधार पर ‘उसका’ या ‘अपनी प्रजा का’ कहकर इसे एकवचन अथवा अधिक स्पष्ट नहीं किया गया।
- source_word: מָעוֹז
  choice: दृढ़ गढ़
  rationale: यह सुरक्षा देने वाले आश्रय या किले का बिंब व्यक्त करता है; ‘दृढ़ गढ़’ उस रक्षात्मक छवि को स्पष्ट और गरिमापूर्ण हिन्दी में बनाए रखता है।
- source_word: יְשׁוּעוֹת
  choice: उद्धार
  rationale: इब्रानी में बहुवचन है, पर हिन्दी में ‘उद्धारों’ अत्यंत अस्वाभाविक लगेगा। सामूहिक एकवचन मूल भाव को पठनीय रूप में देता है, और बहुवचन की जानकारी पादटिप्पणी में सुरक्षित है।
- source_word: מְשִׁיחוֹ
  choice: अपने अभिषिक्त जन
  rationale: यह वर्णनात्मक पद तत्कालीन अभिषिक्त राजा को सूचित कर सकता है। ‘मसीह’ को मुख्य पाठ में रखने से बाद की पारिभाषिक उपाधि अनावश्यक रूप से निश्चित हो सकती थी।
- source_word: הוּא
  choice: वह ... है
  rationale: स्वतंत्र सर्वनाम के बलाघात को स्पष्ट हिन्दी कर्ता और संयोजक क्रिया द्वारा व्यक्त किया गया है।
theological_decisions:
- issue: מְשִׁיחוֹ को पारिभाषिक उपाधि ‘मसीह’ माना जाए या वर्णनात्मक रूप ‘अभिषिक्त जन’
  choice: अपने अभिषिक्त जन
  alternative: अपने मसीह
  rationale: भजन के निकट संदर्भ में यह याहवे के अभिषिक्त राजा को दर्शा सकता है, जबकि व्यापक मसीहाई अनुगूँज भी संभव है। मुख्य पाठ तत्कालीन अर्थ रखता है और वैकल्पिक पारिभाषिक पाठ पादटिप्पणी में देता है।
- issue: יְשׁוּעוֹת के स्पष्ट इब्रानी बहुवचन को हिन्दी में कैसे व्यक्त किया जाए
  choice: उद्धार
  alternative: उद्धारों / छुटकारे के कार्यों
  rationale: स्वाभाविक हिन्दी में ‘उद्धार’ सामूहिक अर्थ दे सकता है। इब्रानी बहुवचन को पादटिप्पणी में स्पष्ट करके उसके बार-बार या अनेक प्रकार से बचाने के भाव को खोने नहीं दिया गया।
translation_notes:
