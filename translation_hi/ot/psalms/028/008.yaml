    text: ‘अपने अभिषिक्त’ का अनुवाद ‘अपने मसीह’ भी किया जा सकता है। इस संदर्भ में यह पहले याहवे के अभिषिक्त राजा की ओर संकेत करता जान पड़ता है, साथ ही व्यापक मसीहाई अनुगूँज की संभावना भी बनी रहती है।
