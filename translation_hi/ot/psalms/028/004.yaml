  text: תֶּן לָ/הֶ֣ם כְּ/פָעֳלָ/ם֮ וּ/כְ/רֹ֪עַ מַֽעַלְלֵ֫י/הֶ֥ם כְּ/מַעֲשֵׂ֣ה יְ֭דֵי/הֶם תֵּ֣ן לָ/הֶ֑ם הָשֵׁ֖ב גְּמוּלָ֣/ם לָ/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/028/004.yaml
  text: Give to them according to their work[a], and according to the evil of their deeds; according to the work of their hands give to them; repay them their due.
translation:
  language: hi
  text: उनके काम के अनुसार उन्हें दे, और उनके कर्मों की बुराई के अनुसार; उनके हाथों के काम के अनुसार उन्हें दे; उनका प्रतिफल उन्हें लौटा दे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תֶּן
  choice: फल दे
  rationale: यह परमेश्वर से की गई सीधी विनती है। केवल ‘दे’ की अपेक्षा ‘फल दे’ हिंदी में प्रतिफल के न्यायिक संदर्भ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: כְּפָעֳלָם
  choice: उनके कामों के अनुसार
  rationale: פעל यहाँ किए हुए काम या कर्म को दर्शाता है। ‘कामों’ से आशय स्पष्ट रहता है और अनुपातिक प्रतिफल की रचना सुरक्षित रहती है।
- source_word: וּכְרֹעַ מַעַלְלֵיהֶם
  choice: और उनके बुरे कर्मों के अनुसार
  rationale: रֹעַ की नैतिक बुराई और מַעַלְלֵיהֶם के कर्म/कारनामे का अर्थ सहज, संक्षिप्त हिंदी में व्यक्त होता है।
- source_word: כְּמַעֲשֵׂה יְדֵיהֶם
  choice: उनके हाथों के काम के अनुसार
  rationale: हिब्रू में हाथों की छवि उनके अपने किए पर बल देती है; इसे बनाए रखने से काव्यात्मक समानांतरता भी सुरक्षित रहती है।
- source_word: הָשֵׁב
  choice: लौटा दे
  rationale: שוב का हिफ़ील रूप यहाँ किए का परिणाम उन्हीं पर वापस लाने, अर्थात प्रतिफल देने, का भाव रखता है।
- source_word: גְּמוּלָם
  choice: उनका किया
  rationale: גמול प्रतिफल, बदला या किए का उचित परिणाम हो सकता है। ‘उनका किया उन्हीं पर लौटा दे’ हिंदी में प्रत्यावर्तन और न्यायोचित प्रतिफल दोनों भाव व्यक्त करता है।
theological_decisions:
- issue: अभिशापात्मक प्रार्थना और ईश्वरीय प्रतिफल
  choice: पद को परमेश्वर से दुष्टों को उनके कर्मों के अनुरूप फल देने की स्पष्ट विनती के रूप में रखा गया है।
  alternative: इसे केवल परिणाम का वर्णन मानकर विनती की धार को नरम करना।
  rationale: दो बार תֶּן और फिर הָשֵׁב आज्ञार्थक रूप हैं; इसलिए मूल पाठ प्रार्थनापूर्ण निवेदन करता है, मात्र निष्पक्ष कथन नहीं। अनुवाद इस न्यायिक तीव्रता को न घटाता है, न बढ़ाता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘हाथों के काम’ की हिब्रू छवि तथा तीन खंडों वाली समानांतर काव्य-रचना यथासंभव सुरक्षित है।
