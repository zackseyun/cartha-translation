base_translation:
  language: en
  yaml_path: translation/ot/psalms/028/001.yaml
  text: Of David[a]. To you, O Yahweh, I call; my rock, do not be deaf to me[c][b], lest you be silent to me and I become like those who go down to the pit.
translation:
  language: hi
  text: 'दाऊद का भजन।[a]


    हे यहोवा, मैं तुझे पुकारता हूँ;


    हे मेरी चट्टान, मेरी पुकार के प्रति बहरा न हो,[b]


    कहीं ऐसा न हो कि तू मेरे प्रति मौन रहे


    और मैं गड्ढे में उतरनेवालों के समान हो जाऊँ।[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शीर्षक का अनुवाद “दाऊद के लिए” भी हो सकता है।
    reason: इब्रानी לְדָוִד लेखकत्व, संबद्धता या समर्पण व्यक्त कर सकता है।
  - marker: b
    text: या, “मेरे प्रति मौन न रह।” पहले क्रियापद का अर्थ बहरा होना या मौन रहना, दोनों हो सकता है।
    reason: חרשׁ की शब्दार्थगत अस्पष्टता और अगले खंड के ‘मौन रहे’ से उसका संबंध बताना।
  - marker: c
    text: “गड्ढा” कब्र या मृतकों के लोक की ओर संकेत कर सकता है।
    reason: काव्यात्मक बिंब के संभावित मृत्यु-संबंधी आशय को स्पष्ट करना, बिना मुख्य पाठ को सीमित किए।
lexical_decisions:
- source_word: לְדָוִד
  choice: दाऊद का भजन
  rationale: शीर्षक में לְ का संबंध लेखकत्व, संबद्धता या समर्पण से हो सकता है। हिन्दी में प्रचलित और स्वाभाविक शीर्षक ‘दाऊद का भजन’ संबंध को व्यक्त करता है, यद्यपि ‘दाऊद के लिए’ भी संभव है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल में परमेश्वर का व्यक्तिगत नाम चतुरक्षर יְהוָה है। आधुनिक हिन्दी बाइबिलीय प्रयोग में परिचित रूप ‘यहोवा’ नाम को उपाधि से प्रतिस्थापित किए बिना प्रस्तुत करता है।
- source_word: אֶקְרָא
  choice: मैं तुझे पुकारता हूँ
  rationale: קרא यहाँ प्रार्थना में पुकारने का अर्थ देता है। वर्तमानकालीन हिन्दी रूप इब्रानी अपूर्ण क्रिया के प्रसंगगत, जारी आह्वान को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: צוּרִי
  choice: हे मेरी चट्टान
  rationale: ठोस रूपक को सुरक्षित रखा गया है; यह परमेश्वर की दृढ़ता और सुरक्षा की ओर संकेत करता है, पर उसे व्याख्यात्मक शब्द ‘शरण’ में नहीं बदला गया।
- source_word: אַל תֶּחֱרַשׁ מִמֶּנִּי
  choice: मेरी ओर से बहरा न हो
  rationale: חרשׁ का अर्थ बहरा होना अथवा मौन रहना हो सकता है। अगले खंड के חשה ‘मौन रहना’ से अंतर और संभावित शब्द-क्रीड़ा बचाने के लिए यहाँ ‘बहरा’ चुना गया है।
- source_word: פֶּן
  choice: कहीं ऐसा न हो कि
  rationale: यह हिन्दी में आशंकित परिणाम को स्पष्ट और स्वाभाविक रूप से प्रस्तुत करता है।
- source_word: תֶּחֱשֶׁה מִמֶּנִּי
  choice: तू मेरे प्रति मौन रहे
  rationale: חשה का अर्थ मौन रहना है। ‘मेरे प्रति’ מִמֶּנִּי की संबंधपरक दिशा को यथासंभव सुरक्षित रखता है।
- source_word: וְנִמְשַׁלְתִּי
  choice: और मैं ... के समान हो जाऊँ
  rationale: निफ़अल रूप यहाँ समान हो जाने या समान ठहरने का अर्थ देता है। ‘हो जाऊँ’ आशंकित परिणाम को सहज हिन्दी में व्यक्त करता है।
- source_word: עִם יֹרְדֵי בוֹר
  choice: गड्ढे में उतरनेवालों के समान
  rationale: ‘गड्ढा’ मूल ठोस बिंब तथा कब्र या मृतकों के लोक की संभावित ध्वनि दोनों को बचाता है; ‘के समान’ पिछले क्रियापद के साथ स्वाभाविक हिन्दी बनाता है।
theological_decisions:
- issue: יְהוָה परमेश्वर के नाम का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ व्यक्तिगत दिव्य नाम रखता है। हिन्दी पाठ में परिचित नामरूप ‘यहोवा’ चुना गया है; ‘प्रभु’ कहने से नाम उपाधि में बदल जाता, जबकि ‘याहवे’ स्रोत उच्चारण का अधिक प्रत्यक्ष लिप्यंतरण है।
- issue: गड्ढे का आशय
  choice: गड्ढे
  alternative: कब्र; मृतकों का लोक
  rationale: בּוֹר का ठोस बिंब रखा गया है और इसे केवल कब्र या अधोलोक के अर्थ में सीमित नहीं किया गया, ताकि काव्यात्मक और धर्मवैचारिक बहुअर्थकता बनी रहे।
- issue: परमेश्वर का न सुनना और मौन रहना
  choice: ‘बहरा न हो’ और ‘मौन रहे’ को अलग रखा
  alternative: दोनों को ‘मौन न रह’ के रूप में प्रस्तुत करना
  rationale: 'दो निकटवर्ती इब्रानी क्रियाओं חרשׁ और חשה के बीच संभावित अर्थभेद और तनाव को बनाए रखा गया है: प्रार्थना न सुनना और उत्तर न देना।'
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण काव्यात्मक प्रार्थना। परमेश्वर को एकवचन आत्मीय संबोधन ‘तू/तुझे’ दिया गया है, जो भजन की सीधी पुकार के अनुकूल है। ठोस रूपकों और इब्रानी समानांतरता को बनाए रखते हुए वाक्य-विन्यास स्वाभाविक रखा गया है।
