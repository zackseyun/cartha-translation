id: PSA.28.0
reference: Psalms 28:0
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: לְ/דָוִ֡ד אֵ֘לֶ֤י/ךָ יְהוָ֨ה אֶקְרָ֗א צוּרִ/י֮ אַֽל תֶּחֱרַ֪שׁ מִ֫מֶּ֥/נִּי פֶּן תֶּֽחֱשֶׁ֥ה מִמֶּ֑/נִּי וְ֝/נִמְשַׁ֗לְתִּי עִם י֥וֹרְדֵי בֽוֹר׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/028/000.yaml
  text: Of David[a]. To you, Yahweh, I call; my rock, do not be deaf to me, lest if you are silent to me[c][b], I become like those going down to the pit.
translation:
  language: hi
  text: 'दाऊद का।[a]


    हे याहवे, मैं तुझे पुकारता हूँ।

    हे मेरी चट्टान, मेरी पुकार अनसुनी न कर;[b]

    कहीं ऐसा न हो कि तू मेरे प्रति मौन रहे

    और मैं गड्ढे में उतरनेवालों के समान हो जाऊँ।[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “दाऊद के लिए” अथवा “दाऊद से संबंधित।” इब्रानी शीर्षक लेखकीयता, संबंध या समर्पण सूचित कर सकता है।
    reason: source_ambiguity
  - marker: b
    text: शाब्दिक रूप से, “मेरे प्रति बहरा न बन” अथवा “मेरी ओर मौन न रह।”
    reason: lexical_alternative
  - marker: c
    text: “गड्ढा” कब्र या मृतकों के लोक की ओर संकेत कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדָוִד
  choice: दाऊद का
  rationale: לְ उपसर्ग यहाँ लेखकीयता, संबंध या समर्पण सूचित कर सकता है। संक्षिप्त शीर्षक मूल की अस्पष्टता को काफी हद तक बनाए रखता है; विकल्प पादटिप्पणी में दिए गए हैं।
- source_word: יְהוָה
  choice: याहवे
  rationale: ईश्वर के विशिष्ट इब्रानी नाम को उपाधि में बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: צוּרִי
  choice: मेरी चट्टान
  rationale: चट्टान का रूपक सीधे रखा गया है; यह सुरक्षा, स्थिरता और शरण का बोध कराता है।
- source_word: אַל־תֶּחֱרַשׁ מִמֶּנִּי
  choice: मेरी पुकार अनसुनी न कर
  rationale: पहली क्रिया में बहरा बने रहने और मौन रहने, दोनों का अर्थक्षेत्र है। संदर्भ में प्रार्थना न सुनने का भाव स्वाभाविक हिंदी में व्यक्त किया गया, जबकि अगली क्रिया से मौन रहने का भेद सुरक्षित रखा गया है।
- source_word: בּוֹר
  choice: गड्ढा
  rationale: मूल ठोस रूपक को रखा गया है; प्रसंग में यह कब्र अथवा मृतकों के लोक की ओर संकेत कर सकता है।
theological_decisions:
- issue: याहवे की चुप्पी और प्रार्थी का मृतकों जैसा हो जाना
  choice: दोनों को आशंकित परिणामों की जुड़ी हुई शृंखला के रूप में रखा गया है
  alternative: 'इसे शर्त के रूप में पढ़ना: ‘यदि तू मौन रहा, तो मैं…’'
  rationale: פֶּן आशंकित परिणाम प्रस्तुत करता है और וְ अगली बात को उससे जोड़ता है। हिंदी में ‘कहीं ऐसा न हो कि… और…’ इस संबंध को बिना अतिरिक्त धर्मवैज्ञानिक निष्कर्ष के व्यक्त करता है।
- issue: ‘गड्ढे’ का आशय
  choice: मुख्य पाठ में रूपक को खुला रखा गया है
  alternative: सीधे ‘कब्र’ या ‘मृतकों का लोक’ कहना
  rationale: בּוֹר का ठोस अर्थ गड्ढा है, पर काव्यात्मक संदर्भ मृत्यु का संकेत देता है। किसी एक अर्थ को मुख्य पाठ में निश्चित करना मूल की अर्थ-व्याप्ति को सीमित कर देता।
translation_notes:
  register: भाषा आधुनिक, सरल और प्रार्थनात्मक है। ‘तू/तुझे’ का प्रयोग भजन की निकट, प्रत्यक्ष संबोधन-शैली के लिए किया गया है; यह अनादर का सूचक नहीं है। काव्य-पंक्तियाँ मूल के संबोधन, विनती और आशंकित परिणाम की गति को बनाए रखती हैं।
