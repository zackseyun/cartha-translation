  text: אַל תִּמְשְׁכֵ֣/נִי עִם רְשָׁעִים֮ וְ/עִם פֹּ֪עֲלֵ֫י אָ֥וֶן דֹּבְרֵ֣י שָׁ֭לוֹם עִם רֵֽעֵי/הֶ֑ם וְ֝/רָעָ֗ה בִּ/לְבָבָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/028/003.yaml
  text: Do not drag me away with the wicked[a], with those who work evil[b], who speak peace with their neighbors while evil is in their hearts.
translation:
  language: hi
  text: मुझे दुष्टों के साथ और बुराई करनेवालों के साथ घसीटकर[a] न ले जा। वे अपने पड़ोसियों[b] से शांति की बातें करते हैं, जबकि उनके मन में बुराई है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘खींचकर’।
    reason: lexical_alternative
  - marker: b
    text: या ‘साथियों’ अथवा ‘मित्रों’।
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּמְשְׁכֵנִי
  choice: मुझे … घसीटकर न ले जा
  rationale: मूल क्रिया משׁך खींचने या साथ ले जाने का भाव देती है। इस संदर्भ में यह दुष्टों की संगति या उनके परिणाम में साथ ले जाए जाने की प्रबल विनती है; ‘घसीटकर न ले जा’ उस बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: רְשָׁעִים
  choice: दुष्टों
  rationale: यह भजन-साहित्य में नैतिक रूप से बुरे लोगों के लिए मानक, स्पष्ट और संक्षिप्त हिन्दी शब्द है।
- source_word: פֹּעֲלֵי אָוֶן
  choice: बुराई करनेवालों
  rationale: यह अनुवाद פֹּעֲלֵי के सक्रिय अर्थ को बनाए रखता है और आधुनिक पाठक के लिए सहज है।
- source_word: דֹּבְרֵי שָׁלוֹם
  choice: शांति की बातें करते हैं
  rationale: यह इब्रानी मुहावरे के ‘शांति बोलने’ के भाव को स्वाभाविक हिन्दी में व्यक्त करता और बाहरी शांतिपूर्ण वाणी तथा भीतरी बुराई का विरोध उभारता है।
- source_word: רֵעֵיהֶם
  choice: अपने पड़ोसियों
  rationale: רֵעַ का अर्थ पड़ोसी, साथी या मित्र हो सकता है। यहाँ ‘पड़ोसियों’ से सामान्य सामाजिक संबंध का भाव आता है, बिना वास्तविक मित्रता मान लिए।
- source_word: רָעָה בִּלְבָבָם
  choice: उनके मन में बुराई है
  rationale: ‘मन’ आधुनिक हिन्दी में भीतरी विचार और मंशा को स्वाभाविक रूप से व्यक्त करता है; ‘बुराई’ मूल के नैतिक और हानिकारक आशय को अनावश्यक रूप से संकीर्ण नहीं करती।
theological_decisions:
- issue: दुष्टों के साथ ले जाए जाने के विषय में भजनकार की विनती
  choice: दुष्टों की संगति या उनके परिणाम में उनके साथ घसीटकर न ले जाए जाने की विनती
  alternative: केवल दुष्टों जैसा आचरण न करने की विनती
  rationale: ‘मुझे … उनके साथ घसीटकर न ले जा’ का सबसे स्वाभाविक अर्थ उनके साथ ले जाए जाने से बचाने की प्रार्थना है, संभवतः न्याय के समय; फिर भी अनुवाद मूल की तरह उस परिणाम की सटीक प्रकृति को अनिर्दिष्ट रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और मौखिक रूप से सहज शैली रखी गई है। ‘करनेवालों’ का संयुक्त रूप प्रवाह बनाए रखता है; ‘हृदय’ के बजाय ‘मन’ यहाँ आंतरिक मंशा को सामान्य पाठक के लिए अधिक स्वाभाविक ढंग से व्यक्त करता है।
