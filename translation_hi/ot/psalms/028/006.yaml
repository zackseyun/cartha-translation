  yaml_path: translation/ot/psalms/028/006.yaml
  text: Blessed be Yahweh[b][a], for he has heard the voice of my pleas for mercy.
translation:
  language: hi
  text: 'याहवे धन्य हों,

    क्योंकि उन्होंने मेरी दया-याचनाओं का स्वर सुना है।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּרוּךְ
  choice: धन्य हैं
  rationale: निष्क्रिय कृदन्त यहाँ आशीर्वचनात्मक और स्तुतिपरक उद्घोषणा के रूप में प्रयुक्त है। ‘धन्य हैं’ इस रूप और भाव दोनों को स्वाभाविक, गरिमापूर्ण हिन्दी में बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम का हिन्दी लिप्यंतरण किया गया है; उसके स्थान पर कोई उपाधि नहीं रखी गई।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह याहवे को धन्य कहने का कारण प्रस्तुत करता है; ‘क्योंकि’ कारणसूचक सम्बन्ध को स्पष्ट रूप से व्यक्त करता है।
- source_word: שָׁמַע
  choice: सुन ली है
  rationale: पूर्ण क्रिया उस सुनी जा चुकी प्रार्थना को व्यक्त करती है जिसका प्रभाव वर्तमान स्तुति में बना हुआ है। ‘सुन ली है’ हिन्दी में पूर्णता और स्वीकार किए जाने की प्रसंगगत ध्वनि दोनों देता है।
- source_word: קוֹל
  choice: पुकार
  rationale: קוֹל का मूल अर्थ ‘आवाज़/स्वर’ है, पर תַּחֲנוּנָי के साथ हिन्दी में ‘मेरी विनतियों की आवाज़’ असहज लगता है। ‘पुकार’ श्रव्य और व्यक्तिगत भाव को स्वाभाविक रूप से समेटता है; शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: תַּחֲנוּנָי
  choice: दया के लिए मेरी पुकार
  rationale: यह शब्द अनुग्रह या दया पाने के लिए की गई गम्भीर विनतियों को सूचित करता है। यह चयन उसके करुण और विनयपूर्ण भाव को साधारण आधुनिक हिन्दी में स्पष्ट करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम स्पष्ट रूप से है। ‘याहवे’ उस नाम को उपाधि से बदलने के बजाय उसका निकट हिन्दी लिप्यंतरण प्रस्तुत करता है।
translation_notes:
  register: भाषा आधुनिक, सहज और स्तुतिपरक गरिमा वाली रखी गई है। पद्य-विन्यास मूल के दो विचार-खंडों को दर्शाता है। ‘दया के लिए मेरी पुकार’ स्वाभाविक हिन्दी हेतु संक्षिप्त समतुल्यता है; शाब्दिक संरचना पादटिप्पणी में दी गई है।
