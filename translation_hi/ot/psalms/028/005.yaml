id: PSA.28.5
reference: Psalms 28:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּ֤י לֹ֤א יָבִ֡ינוּ אֶל פְּעֻלֹּ֣ת יְ֭הוָה וְ/אֶל מַעֲשֵׂ֣ה יָדָ֑י/ו יֶ֝הֶרְסֵ֗/ם וְ/לֹ֣א יִבְנֵֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/028/005.yaml
  text: Because they do not understand the works of Yahweh or the work of his hands[a], he will tear them down and not build them up.
translation:
  language: hi
  text: क्योंकि वे यहोवा के कामों को और उसके हाथों के कार्य को नहीं समझते; वह उन्हें ढा देगा और उनका निर्माण नहीं करेगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले संदर्भ में विनती अथवा न्याय का कारण बताता है; हिन्दी में causal force स्वाभाविक रूप से स्पष्ट होती है।
- source_word: יָבִינוּ אֶל
  choice: को नहीं समझते
  rationale: בין यहाँ समझने या विवेक से ग्रहण करने का भाव देता है; אֶל उस समझ की ओर निर्देशित वस्तु को चिह्नित करता है।
- source_word: פְּעֻלֹּת יְהוָה
  choice: यहोवा के कामों
  rationale: बहुवचन परमेश्वर के कार्यों या सामर्थी कृत्यों को दर्शाता है; 'कामों' सामान्य पाठक के लिए सहज है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को हिन्दी में प्रचलित लिप्यंतरण द्वारा रखा गया है, किसी उपाधि से नहीं बदला गया।
- source_word: מַעֲשֵׂה יָדָיו
  choice: उसके हाथों के किए हुए कार्य
  rationale: इब्रानी के एकवचन और मानवीकरणयुक्त रूपक को बनाए रखता है तथा पहले बहुवचन 'कामों' के साथ समानांतरता दिखाता है।
- source_word: יֶהֶרְסֵם
  choice: वह उन्हें ढा देगा
  rationale: הרס इमारत गिराने या ध्वस्त करने का चित्र देता है; 'ढा देगा' अगले 'खड़ा नहीं करेगा' के साथ निर्माण-विनाश का विरोध बनाए रखता है।
- source_word: וְלֹא יִבְנֵם
  choice: और फिर खड़ा नहीं करेगा
  rationale: בנה का मूल निर्माण-चित्र सुरक्षित है। 'फिर' हिन्दी में विनाश के बाद न बनाए जाने का क्रम स्पष्ट करता है, बिना पुनर्स्थापना का अतिरिक्त धर्मवैज्ञानिक दावा किए।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में व्यक्तिगत वाचा-नाम सीधे आया है। हिन्दी बाइबल परंपरा में व्यापक रूप से पहचाने जाने वाले 'यहोवा' को रखते हुए इसे 'प्रभु' जैसी उपाधि से प्रतिस्थापित नहीं किया गया।
- issue: अंतिम क्रियाओं का न्याय-संबंधी रूपक
  choice: ढा देगा और फिर खड़ा नहीं करेगा
  alternative: नष्ट कर देगा और उनका निर्माण नहीं करेगा
  rationale: मूल के הרס/בנה विरोध को यथासंभव जीवित रखा गया है; इसे अनन्त दण्ड अथवा किसी खास पुनर्स्थापना-सिद्धान्त की स्पष्ट घोषणा बनाकर नहीं बढ़ाया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण काव्यात्मक गद्य। 'कामों/कार्य' से इब्रानी बहुवचन और एकवचन की समानांतरता रखी गई है; 'ढा देगा/खड़ा नहीं करेगा' से विनाश और निर्माण का रूपक सुरक्षित है।
