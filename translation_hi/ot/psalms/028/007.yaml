base_translation:
  language: en
  yaml_path: translation/ot/psalms/028/007.yaml
  text: Yahweh is my strength and my shield[a]; in him my heart trusts, and I am helped. Therefore my heart rejoices[c][b], and with my song I will praise him.
translation:
  language: hi
  text: याहवे मेरा बल और मेरी ढाल है; उसी पर[a] मेरे हृदय ने भरोसा रखा, और मुझे सहायता मिली। इसलिए मेरा हृदय आनन्द से झूम उठा[b], और मैं अपने गीत से उसका धन्यवाद करूँगा[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसी में मेरे हृदय ने भरोसा रखा।”
    reason: lexical_alternative
  - marker: b
    text: या, “मेरा हृदय उल्लसित हुआ।”
    reason: lexical_alternative
  - marker: c
    text: या, “मैं उसकी स्तुति करूँगा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: याहवेह
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम को किसी उपाधि से बदलने के बजाय हिन्दी में लिप्यंतरित किया गया है।
- source_word: עֻזִּי
  choice: मेरा बल
  rationale: עֹז का सीधा अर्थ बल या सामर्थ्य है; समानांतर पदबंध 'मेरी ढाल' के साथ 'मेरा बल' स्वाभाविक है।
- source_word: מָגִנִּי
  choice: मेरी ढाल
  rationale: मूल रूपक को स्पष्ट और स्वाभाविक हिन्दी में अक्षुण्ण रखता है।
- source_word: בּוֹ בָטַח לִבִּי
  choice: उसी पर मेरे हृदय ने भरोसा रखा
  rationale: בטח पूर्ण रूप में है और ב के साथ निर्भरता व्यक्त करता है; इसलिए भूतकाल और 'पर भरोसा रखना' चुना गया।
- source_word: וְנֶעֱזָרְתִּי
  choice: और मुझे सहायता मिली
  rationale: עזר के निफ़अल रूप का निष्प्रयोज्य भाव स्वाभाविक हिन्दी में व्यक्त होता है और सहायता देने वाले को अनावश्यक रूप से स्पष्ट नहीं करता।
- source_word: וַיַּעֲלֹז לִבִּי
  choice: इसलिए मेरा हृदय आनन्द से झूम उठा
  rationale: עלז तीव्र, उल्लसित आनन्द व्यक्त करता है; वय्यिक्तोल रूप के कारण भूतकाल रखा गया है।
- source_word: וּמִשִּׁירִי
  choice: और मैं अपने गीत से
  rationale: यहाँ מִן साधन का भाव देता है; 'अपने गीत से' मूल संरचना और हिन्दी की स्वाभाविकता दोनों को बनाए रखता है।
- source_word: אֲהוֹדֶנּוּ
  choice: उसका धन्यवाद करूँगा
  rationale: ידה के हिफ़ईल रूप में धन्यवाद और स्तुति दोनों अर्थ संभव हैं; गीत के संदर्भ में भी 'धन्यवाद करना' एक प्रत्यक्ष और मान्य अर्थ है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवेह
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ व्यक्तिगत ईश्वरीय नाम का प्रयोग करता है; लिप्यंतरण नाम और उपाधि के भेद को सुरक्षित रखता है।
- issue: אֲהוֹדֶנּוּ में धन्यवाद और स्तुति का अर्थ-संबंध
  choice: उसका धन्यवाद करूँगा
  alternative: उसकी स्तुति करूँगा
  rationale: ידה दोनों अर्थ धारण कर सकता है। यहाँ धन्यवाद का अर्थ पूर्णतः संदर्भानुकूल है, जबकि स्तुति मान्य वैकल्पिक अनुवाद है।
translation_notes:
  register: आधुनिक मानक हिन्दी; काव्यात्मक परन्तु सामान्य पाठक के लिए सहज। इब्रानी क्रियाओं के पूर्ण और क्रमिक भूतकाल को वर्तमानकाल में समतल नहीं किया गया है।
