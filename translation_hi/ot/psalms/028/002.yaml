  text: मेरी दया-याचनाओं की आवाज़ सुन, जब मैं तुझे पुकारूँ; जब मैं अपने हाथ तेरे पवित्रस्थान के अंतरतम कक्ष[a] की ओर उठाऊँ।
  philosophy: optimal-equivalence
  footnotes:
