  verdict: revise
  source_fidelity: The draft accurately represents the imperative appeal, the intense crying out, the lifting of hands, and the directional reference to the sanctuary. However, its expression for the pleas is unnecessarily awkward, and the phrase for the inner sanctuary repeats ‘पवित्रस्थान’ in a way that obscures the Hebrew architectural specificity rather than expressing it naturally.
  naturalness: ‘मेरी दया की विनतियों की आवाज़’ is not idiomatic modern Hindi. ‘तेरे पवित्र भीतरी पवित्रस्थान’ is also cumbersome because of the stacked, partially redundant modifiers. A more natural formulation can retain all the source elements and the solemn prayer register.
  terminology: ‘दया-याचनाएँ’ clearly conveys earnest pleas for mercy. ‘तेरे पवित्रस्थान के अंतरतम कक्ष’ appropriately renders דְּבִיר as the innermost sanctuary room without importing later doctrinal terminology. The intimate singular address ‘तुझे/तेरे’ is consistent and suitable.
  issues:
  - severity: medium
    issue: Awkward rendering of קוֹל תַּחֲנוּנַי
    rationale: ‘मेरी दया की विनतियों की आवाज़’ is grammatically possible but unnatural and overly layered in Hindi. ‘मेरी दया-याचनाओं की आवाज़’ retains both ‘voice’ and pleas for mercy in idiomatic form.
  - severity: medium
    issue: Cumbersome rendering of אֶל דְּבִיר קָדְשֶׁךָ
    rationale: ‘तेरे पवित्र भीतरी पवित्रस्थान’ has an awkward repetition of ‘पवित्रस्थान.’ ‘तेरे पवित्रस्थान के अंतरतम कक्ष की ओर’ naturally conveys the inner, sacred chamber while preserving the directional sense.
  revised_text: मेरी दया-याचनाओं की आवाज़ सुन, जब मैं तुझे पुकारूँ; जब मैं अपने हाथ तेरे पवित्रस्थान के अंतरतम कक्ष[a] की ओर उठाऊँ।
