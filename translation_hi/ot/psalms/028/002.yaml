    text: या ‘तेरे पवित्रस्थान की ओर’; इब्रानी शब्द विशेष रूप से मंदिर के भीतरी, सबसे पवित्र कक्ष को भी सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמַע
  choice: सुन
  rationale: यह שׁמע का पुल्लिंग एकवचन आज्ञार्थक रूप है और परमेश्वर से की गई सीधी, आग्रहपूर्ण प्रार्थना को व्यक्त करता है।
- source_word: קוֹל תַּחֲנוּנַי
  choice: मेरी दया की विनतियों की आवाज़
  rationale: קוֹל का ठोस अर्थ ‘आवाज़’ है और תַּחֲנוּנִים अनुग्रह या दया पाने के लिए की गई गंभीर विनतियों को दर्शाता है। यह रूपक हिन्दी में समझने योग्य रहते हुए इब्रानी अभिव्यक्ति को बनाए रखता है।
- source_word: בְּשַׁוְּעִי אֵלֶיךָ
  choice: जब मैं तुझे पुकारूँ
  rationale: בְּ + infinitive construct यहाँ कालवाचक है; שׁוע साधारण बुलाने से अधिक तीव्र पुकार को व्यक्त करता है। אֵלֶיךָ का सीधा अर्थ ‘तुझे/तेरी ओर’ है।
- source_word: בְּנָשְׂאִי יָדַי
  choice: जब मैं अपने हाथ ... उठाऊँ
  rationale: दूसरा בְּ + infinitive construct भी कालवाचक है। हाथ उठाना प्रार्थना की वास्तविक शारीरिक मुद्रा है, इसलिए इसे शाब्दिक रखा गया है।
- source_word: אֶל דְּבִיר קָדְשֶׁךָ
  choice: तेरे पवित्र भीतरी पवित्रस्थान की ओर
  rationale: דְּבִיר सामान्यतः मंदिर के सबसे भीतर के पवित्र कक्ष को सूचित करता है। ‘भीतरी पवित्रस्थान’ स्थानगत विशिष्टता को सामान्य पाठक के लिए स्पष्ट करता है; קָדְשֶׁךָ को स्वाभाविक हिन्दी में विशेषणात्मक रूप से व्यक्त किया गया है।
theological_decisions:
- issue: דְּבִיר קָדְשֶׁךָ का उपासना-स्थल संबंधी संकेत
  choice: तेरे पवित्र भीतरी पवित्रस्थान
  alternative: तेरे पवित्रस्थान; तेरे पवित्र अंतरतम कक्ष
  rationale: यह पद मंदिर के सामान्य क्षेत्र के बजाय परमेश्वर की उपस्थिति से जुड़े भीतर के पवित्र कक्ष की ओर संकेत करता है। विशिष्ट अनुवाद इस उपासना-संबंधी बिंब को सुरक्षित रखता है, पर किसी बाद की संप्रदायगत व्याख्या को नहीं जोड़ता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण प्रार्थना-शैली रखी गई है। परमेश्वर के लिए निकट और एकवचन संबोधन ‘तू/तेरा’ प्रयोग हुआ है। समानांतर ‘जब... जब...’ संरचना मूल पद की लय और दोनों समकालिक प्रार्थना-क्रियाओं को बनाए रखती है।
