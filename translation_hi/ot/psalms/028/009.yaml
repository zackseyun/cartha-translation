  text: Save your people and bless your inheritance[b][a]; shepherd them and carry them forever.
translation:
  language: hi
  text: अपने लोगों का उद्धार कर और अपनी विरासत को आशीष दे; उनकी चरवाही कर[a] और उन्हें सदा सँभालकर ले चल[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उन्हें खिला’; इब्रानी क्रिया में झुंड को खिलाना शामिल हो सकता है, पर इसका व्यापक अर्थ चरवाहे के रूप में उनकी देखभाल करना है।
    reason: lexical_alternative
  - marker: b
    text: या ‘उन्हें उठाए’ अथवा ‘उन्हें ढोए’; इब्रानी क्रिया का अर्थ उठाना, भार वहन करना या लेकर चलना हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹשִׁיעָה
  choice: उद्धार कर
  rationale: यह ישׁע का आज्ञार्थक रूप है और परमेश्वर से की गई प्रार्थना व्यक्त करता है। ‘उद्धार कर’ संकट से बचाने तथा वाचा-संबंधी मुक्ति—दोनों अर्थ-क्षेत्रों को स्वाभाविक धार्मिक हिंदी में बनाए रखता है।
- source_word: עַמֶּךָ
  choice: अपने लोगों
  rationale: עם पर द्वितीय पुरुष एकवचन प्रत्यय परमेश्वर से संबंधित प्रजा को दर्शाता है; ‘अपने लोगों’ हिंदी वाक्य में इस संबंध को सहज रूप से व्यक्त करता है।
- source_word: בָרֵךְ
  choice: आशीष दे
  rationale: प्रार्थना में प्रयुक्त ברך के आज्ञार्थक रूप का यह सीधा, प्रचलित और गरिमापूर्ण हिंदी रूप है।
- source_word: נַחֲלָתֶךָ
  choice: अपनी विरासत
  rationale: נחלה उत्तराधिकार में मिले भाग, धरोहर या निज संपत्ति को सूचित कर सकता है। ‘अपनी विरासत’ लोगों के परमेश्वर के विशेष भाग होने की वाचाई उपमा को बनाए रखता है।
- source_word: רְעֵם
  choice: उनकी चरवाही कर
  rationale: רעה केवल खिलाने तक सीमित नहीं, बल्कि चरवाहे के रूप में देखभाल और अगुवाई करने को भी समेटता है। ‘चरवाही कर’ इस व्यापक पशुपालकीय और राजकीय बिंब को सुरक्षित रखता है।
- source_word: נַשְּׂאֵם
  choice: उन्हें उठाए रख
  rationale: נשא का अर्थ उठाना, ढोना या संभालकर ले चलना हो सकता है। ‘उठाए रख’ मूल क्रिया के ठोस बिंब और निरंतर संरक्षण के भाव को बनाए रखता है; अन्य संभावनाएँ पादटिप्पणी में दी गई हैं।
- source_word: עַד הָעוֹלָם
  choice: सदा
  rationale: यह पदबंध अनिश्चित, स्थायी अवधि को दर्शाता है; ‘सदा’ संक्षिप्त, स्वाभाविक और काव्यात्मक हिंदी समतुल्य है।
theological_decisions:
- issue: רְעֵם में चरवाहे का बिंब
  choice: उनकी चरवाही कर
  alternative: उन्हें चरा / उन्हें खिला
  rationale: मूल क्रिया में खिलाना सम्मिलित हो सकता है, पर उसका अर्थ चरवाहे की समूची देखभाल तक विस्तृत है। चुना हुआ रूप इस व्यापक बिंब को किसी बाद की विशिष्ट धर्मसैद्धांतिक व्याख्या के बिना बनाए रखता है।
- issue: נַחֲלָתֶךָ में वाचाई पहचान
  choice: अपनी विरासत
  alternative: अपनी धरोहर / अपने निज भाग
  rationale: मूल पद लोगों को परमेश्वर के विशेष भाग अथवा अधिकार के रूप में प्रस्तुत करता है। ‘विरासत’ इस रूपक को सपाट किए बिना आधुनिक हिंदी में समझने योग्य रखता है।
- issue: נַשְּׂאֵם में संरक्षण का बिंब
  choice: उन्हें उठाए रख
  alternative: उन्हें ढोता रह / उन्हें संभाले रख
  rationale: मूल क्रिया उठाने और भार वहन करने दोनों का अर्थ दे सकती है। मुख्य पाठ एक संभावित ठोस अर्थ चुनता है, जबकि पादटिप्पणी वास्तविक शाब्दिक अस्पष्टता को स्पष्ट करती है।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी में, प्रार्थनापरक और काव्यात्मक गरिमा के साथ रखी गई है। परमेश्वर को संबोधित एकवचन आज्ञार्थक रूपों के लिए ‘कर/दे/रख’ का प्रयोग भजन की सीधी विनती को सुरक्षित रखता है। ‘चरवाही’ और ‘विरासत’ मूल बिंबों को बनाए रखते हैं, और दोनों पादटिप्पणी-चिह्न संबंधित शब्दों के तुरंत बाद दिए गए हैं।
