  text: לְ/דָוִ֗ד מִ֫זְמ֥וֹר חֶֽסֶד וּ/מִשְׁפָּ֥ט אָשִׁ֑ירָה לְ/ךָ֖ יְהוָ֣ה אֲזַמֵּֽרָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/101/000.yaml
  text: Of David[a]. A psalm. I will sing of steadfast love and justice; to you, Yahweh[b], I will sing praise.
translation:
  language: hi
  text: 'दाऊद का[a] भजन।


    मैं अटल प्रेम[b] और न्याय का गीत गाऊँगा;

    हे याहवे, मैं तेरे लिए भजन गाऊँगा।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू शीर्षक का अर्थ ‘दाऊद द्वारा’, ‘दाऊद के लिए’ या ‘दाऊद से संबंधित’ हो सकता है।
    reason: alternative_reading
  - marker: b
    text: इस हिब्रू शब्द का अनुवाद ‘दया’ या ‘करुणा’ भी किया जा सकता है; ‘अटल प्रेम’ यहाँ उसके निष्ठावान और संबंधपरक भाव को अधिक व्यापक रूप से व्यक्त करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶסֶד
  choice: अटल प्रेम
  rationale: यह पद में निष्ठावान, टिकाऊ और संबंधपरक प्रेम का व्यापक भाव व्यक्त करता है; केवल ‘दया’ कहने से अर्थ अनावश्यक रूप से संकीर्ण हो सकता है।
- source_word: מִשְׁפָּט
  choice: न्याय
  rationale: यहाँ यह न्यायपूर्ण व्यवस्था और सही निर्णय के व्यापक नैतिक भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אֲזַמֵּרָה
  choice: भजन गाऊँगा
  rationale: क्रिया का आशय संगीत सहित स्तुतिगान करना है; ‘भजन गाऊँगा’ हिन्दी के काव्यात्मक और उपासना-संबंधी संदर्भ में स्वाभाविक है।
- source_word: יְהוָה
  choice: याहवे
  rationale: हिब्रू में दिए गए परमेश्वर के विशिष्ट नाम को उपाधि में बदलने के बजाय लिप्यंतरित रूप में सुरक्षित रखा गया है।
theological_decisions:
- issue: לְדָוִד शीर्षक का संबंध
  choice: दाऊद का
  alternative: दाऊद के लिए / दाऊद से संबंधित
  rationale: हिब्रू संबंधसूचक पदबंध को संक्षिप्त और पारंपरिक हिन्दी में रखा गया है, जबकि पादटिप्पणी रचनाकारिता, समर्पण या संबंध की वास्तविक अस्पष्टता सुरक्षित रखती है।
- issue: חֶסֶד का अर्थ-क्षेत्र
  choice: अटल प्रेम
  alternative: दया / करुणा
  rationale: ‘अटल प्रेम’ वाचा-संबंधी निष्ठा सहित व्यापक अर्थ को व्यक्त करता है, पर पादटिप्पणी संकीर्ण वैकल्पिक अनुवादों को स्वीकार करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और काव्यात्मक शैली रखी गई है। समानांतर पंक्तियों में ‘गीत गाऊँगा’ और ‘भजन गाऊँगा’ से हिब्रू की दो निकटवर्ती गायन-क्रियाओं का हल्का भेद बना रहता है। सर्वनाम ‘तेरे’ भजन की सीधी, भक्तिपूर्ण संबोधन-शैली के अनुरूप है।
