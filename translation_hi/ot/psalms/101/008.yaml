  text: לַ/בְּקָרִ֗ים אַצְמִ֥ית כָּל רִשְׁעֵי אָ֑רֶץ לְ/הַכְרִ֥ית מֵֽ/עִיר יְ֝הוָ֗ה כָּל פֹּ֥עֲלֵי אָֽוֶן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/101/008.yaml
  text: Morning by morning I will destroy all the wicked of the land[b][a], cutting off from the city of Yahweh all workers of iniquity.
translation:
  language: hi
  text: हर सुबह मैं देश के सभी दुष्टों का नाश करूँगा,[a] ताकि याहवे[b] के नगर से सभी कुकर्मियों को हटा दूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पृथ्वी के सभी दुष्टों का।” इब्रानी शब्द אֶרֶץ का अर्थ “देश/भूमि” या “पृथ्वी” हो सकता है; यहाँ भजन के राजकीय प्रसंग में “देश” अधिक उपयुक्त है।
    reason: lexical_alternative
  - marker: b
    text: 'इब्रानी: “YHWH”; यहाँ ईश्वर के व्यक्तिगत नाम को “याहवे” लिखा गया है। इसे परंपरागत रूप से “प्रभु” और कभी-कभी “यहोवा” भी लिखा जाता है।'
    reason: alternative_reading
lexical_decisions:
- source_word: לַבְּקָרִים
  choice: हर सुबह
  rationale: बहुवचन रूप का यहाँ पुनरावृत्तिमूलक अर्थ है—यह काम प्रत्येक सुबह किया जाएगा। ‘हर सुबह’ आधुनिक हिन्दी में इसे स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: אַצְמִית
  choice: मैं ... नाश करूँगा
  rationale: צמת के हिफ़इल रूप का सामान्य अर्थ किसी को मिटा देना या नष्ट कर देना है; राजकीय-न्यायिक प्रसंग में ‘नाश करूँगा’ उसका सीधा अर्थ देता है।
- source_word: כָּל רִשְׁעֵי אָרֶץ
  choice: देश के सभी दुष्टों
  rationale: רִשְׁעֵי संज्ञा के रूप में प्रयुक्त बहुवचन विशेषण है, अर्थात ‘दुष्ट लोग’। אָרֶץ का अर्थ ‘देश/भूमि’ या ‘पृथ्वी’ हो सकता है; इस राजकीय प्रसंग में ‘देश’ अधिक उपयुक्त है।
- source_word: לְהַכְרִית
  choice: ताकि ... मिटा दूँ
  rationale: यह हिफ़इल क्रियार्थक संज्ञा पहले कथन के उद्देश्य या परिणाम को व्यक्त करती है। ‘ताकि ... मिटा दूँ’ इस संबंध और किसी समुदाय से पूरी तरह हटा दिए जाने के न्यायिक भाव को स्पष्ट रखता है।
- source_word: מֵעִיר יְהוָה
  choice: याहवे के नगर से
  rationale: यह पदबंध नगर का याहवे से संबंध दर्शाता है और हिन्दी में संबंधकारक रचना मूल अर्थ को स्वाभाविक रूप से व्यक्त करती है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय ‘याहवे’ के रूप में लिप्यंतरित किया गया है।
- source_word: כָּל פֹּעֲלֵי אָוֶן
  choice: उन सभी को ... जो कुकर्म करते हैं
  rationale: यह इब्रानी पदबंध शाब्दिक रूप से ‘अनर्थ/बुराई करनेवाले सभी लोग’ है। हिन्दी संबंधवाचक रचना इसके कर्म करने के सक्रिय भाव और नैतिक गंभीरता को सहज ढंग से बनाए रखती है।
theological_decisions:
- issue: אָרֶץ का दायरा
  choice: देश
  alternative: पृथ्वी
  rationale: भजन में राजा अपने शासन-क्षेत्र और विशेष रूप से याहवे के नगर से दुष्टता हटाने की बात करता है, इसलिए यहाँ ‘देश’ प्रसंगानुकूल है; फिर भी इब्रानी शब्द में ‘पृथ्वी’ का अर्थ संभव है और उसे पादटिप्पणी में रखा गया है।
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम सीधे आया है। ‘याहवे’ उसे उपाधि से प्रतिस्थापित किए बिना हिन्दी में लिप्यंतरित करता है; प्रचलित विकल्प पादटिप्पणी में बताए गए हैं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘हर सुबह’ पुनरावृत्ति को स्वाभाविक हिन्दी में व्यक्त करता है; ‘नाश’ और ‘मिटा दूँ’ मूल की कठोर राजकीय-न्यायिक छवि को कम किए बिना अनावश्यक रूप से पुरातन शब्दावली से बचते हैं।
