  text: לֵבָ֣ב עִ֭קֵּשׁ יָס֣וּר מִמֶּ֑/נִּי רָ֝֗ע לֹ֣א אֵדָֽע׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/101/004.yaml
  text: A crooked heart will depart from me[a]; I will not know evil.
translation:
  language: hi
  text: कुटिल हृदय मुझसे दूर हो जाएगा; बुराई को मैं नहीं जानूँगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बुराई से मेरा कोई संबंध न होगा।” इब्रानी में शाब्दिक रूप से, “मैं बुराई को नहीं जानूँगा।”
    reason: शाब्दिक ‘जानना’ यहाँ बुराई से संबंध या सहभागिता न रखने का भाव भी व्यक्त कर सकता है।
lexical_decisions:
- source_word: לֵבָב
  choice: हृदय
  rationale: यहाँ यह मनुष्य के भीतरी स्वभाव, इच्छा और विचार को दर्शाता है। ‘हृदय’ नैतिक बल और मूल बिंब दोनों को बनाए रखता है।
- source_word: עִקֵּשׁ
  choice: कुटिल
  rationale: यह शब्द नैतिक टेढ़ेपन या विकृति को व्यक्त करता है। ‘कुटिल’ आधुनिक हिन्दी में स्वाभाविक है और सीधे मार्ग से हटने का बिंब सुरक्षित रखता है।
- source_word: יָסוּר מִמֶּנִּי
  choice: मुझसे दूर रहेगा
  rationale: सूर क्रिया अलग होने या हट जाने का भाव देती है। इस प्रसंग में यह वाक्यांश भजनकार से दूरी और अस्वीकार, दोनों को सहज हिन्दी में व्यक्त करता है।
- source_word: רָע
  choice: बुराई
  rationale: यह व्यापक नैतिक अनिष्ट को सूचित करता है; ‘बुराई’ मूल की सामान्यता को किसी अधिक संकीर्ण अर्थ में नहीं बाँधती।
- source_word: לֹא אֵדָע
  choice: मैं नहीं जानूँगा
  rationale: मूल क्रिया का सीधा अर्थ ‘जानना’ है, पर यहाँ उसमें संबंध या सहभागिता का भाव भी हो सकता है। मुख्य पाठ में ‘जानूँगा’ रखने से इब्रानी मुहावरे और उसकी अर्थगत अस्पष्टता सुरक्षित रहती है।
theological_decisions:
- issue: बुराई को ‘जानने’ का आशय
  choice: मुख्य पाठ में ‘बुराई को मैं नहीं जानूँगा’ रखा गया है, जिससे मूल का संबंधपरक अथवा सहभागितापरक अर्थ खुला रहता है।
  alternative: ‘बुराई से मेरा कोई संबंध न होगा’ या ‘मैं बुराई को स्वीकार नहीं करूँगा।’
  rationale: भजन और ज्ञान-साहित्य में ‘जानना’ केवल जानकारी रखने के बजाय संबंध या अनुभव में भाग लेने का संकेत दे सकता है। नैतिक प्रसंग बुराई से असंबद्ध रहने की ओर संकेत करता है, किंतु अनुवाद उस अर्थ को मुख्य पाठ में निर्णायक रूप से नहीं थोपता।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और काव्यात्मक शैली रखी गई है। ‘कुटिल हृदय’ और ‘नहीं जानूँगा’ मूल इब्रानी के बिंब तथा अर्थगत तनाव को सुरक्षित रखते हैं।
