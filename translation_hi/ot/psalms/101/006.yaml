source:
  edition: WLC
  text: עֵינַ֤/י בְּ/נֶֽאֶמְנֵי אֶרֶץ֮ לָ/שֶׁ֪בֶת עִמָּ֫דִ֥/י הֹ֭לֵךְ בְּ/דֶ֣רֶךְ תָּמִ֑ים ה֝֗וּא יְשָׁרְתֵֽ/נִי׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/101/006.yaml
  text: My eyes are on the faithful of the land[a], that they may dwell with me; he who walks in a blameless way[b], he shall serve me.
translation:
  language: hi
  text: देश के विश्वासयोग्य लोगों पर मेरी दृष्टि रहेगी, ताकि वे मेरे साथ रहें[a]; जो सत्यनिष्ठा के मार्ग पर चलता है[b], वही मेरी सेवा करेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मेरे साथ बैठें।” इब्रानी क्रिया का अर्थ “बैठना” या “रहना” दोनों हो सकता है; यहाँ संभवतः राजा की उपस्थिति में निरंतर संगति का भाव है।
    reason: lexical_alternative
  - marker: b
    text: या “खरे मार्ग पर चलता है।” यहाँ “सत्यनिष्ठा” निष्कपट और खरे आचरण को दर्शाती है, पूर्ण पापरहितता को नहीं।
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵינַי
  choice: मेरी दृष्टि रहेगी
  rationale: शाब्दिक अर्थ ‘मेरी आँखें’ है, पर इस मुहावरे में आशय ध्यान और अनुकूल दृष्टि से है। ‘मेरी दृष्टि रहेगी’ इस भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בְּנֶאֶמְנֵי אֶרֶץ
  choice: देश के विश्वासयोग्य लोगों पर
  rationale: נֶאֱמָן का अर्थ विश्वासयोग्य या भरोसेमंद व्यक्ति है। אֶרֶץ यहाँ पूरे संसार के बजाय राजा के देश या राज्य की ओर संकेत करता है।
- source_word: לָשֶׁבֶת עִמָּדִי
  choice: ताकि वे मेरे साथ रहें
  rationale: יָשַׁב का अर्थ ‘बैठना’ या ‘रहना/बसना’ हो सकता है। प्रसंग में ‘मेरे साथ रहें’ निरंतर संगति या राजकीय निकटता—दोनों की संभावना बनाए रखता है। ל उद्देश्य व्यक्त करता है।
- source_word: הֹלֵךְ
  choice: जो ... चलता है
  rationale: कृदंत यहाँ ऐसे व्यक्ति को दर्शाता है जिसकी जीवन-शैली निरंतर ऐसी है। ‘जो चलता है’ मार्ग रूपक और एकवचन रूप को बनाए रखता है।
- source_word: בְּדֶרֶךְ תָּמִים
  choice: खरे मार्ग पर
  rationale: דֶּרֶךְ जीवन-आचरण का रूपक है और תָּמִים यहाँ खराई, संपूर्णता या निष्कपटता बताता है, न कि अनिवार्यतः पूर्ण पापरहितता।
- source_word: הוּא
  choice: वही
  rationale: इब्रानी सर्वनाम बलाघातयुक्त है; ‘वही’ योग्य व्यक्ति पर दिए गए जोर को स्पष्ट रूप से बनाए रखता है।
- source_word: יְשָׁרְתֵנִי
  choice: मेरी सेवा करेगा
  rationale: שׁרת व्यक्तिगत, और प्रायः राजकीय या आधिकारिक, सेवा को दर्शाता है। ‘सेवा करेगा’ स्वाभाविक है और अर्थ को केवल धार्मिक सेवकाई तक सीमित नहीं करता।
theological_decisions:
- issue: राजा के साथ रहने और उसकी सेवा करने वालों की नैतिक योग्यता
  choice: पद देश के विश्वासयोग्य लोगों पर राजा की अनुकूल दृष्टि बताता है और खरे जीवन वाले व्यक्ति को उसके साथ रहने तथा उसकी सेवा करने योग्य ठहराता है।
  alternative: इसे अधिक संकीर्ण अर्थ में केवल राजदरबार के अधिकारियों की नियुक्ति के रूप में पढ़ा जा सकता है।
  rationale: इब्रानी ‘मेरे साथ रहें’ के द्वारा निकट संगति और ‘मेरी सेवा करेगा’ के द्वारा आधिकारिक सेवा—दोनों का संकेत दे सकता है। अनुवाद किसी एक संभावना तक अर्थ को सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सहज हिन्दी में रखी गई है। ‘दृष्टि रहेगी’ राजकीय अनुकूलता का भाव देता है; ‘मेरे साथ रहें’ संगति और दरबारी निकटता की संभावनाएँ खुली रखता है; ‘खरे मार्ग’ में नैतिक सत्यनिष्ठा का भाव है।
