  text: אַשְׂכִּ֤ילָה בְּ/דֶ֬רֶךְ תָּמִ֗ים מָ֭תַי תָּב֣וֹא אֵלָ֑/י אֶתְהַלֵּ֥ךְ בְּ/תָם לְ֝בָבִ֗/י בְּ/קֶ֣רֶב בֵּיתִֽ/י׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/101/002.yaml
  text: I will give attention to the blameless way—when will you come to me? I will walk with integrity of heart within my house[a][b].
translation:
  language: hi
  text: मैं निर्दोष मार्ग पर ध्यान दूँगा[b]—तू मेरे पास कब आएगा?[a] मैं अपने घर के भीतर निष्कपट हृदय से चलूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में है, “तू मेरे पास कब आएगा?” कर्ता स्पष्ट नहीं है; बहुत-से लोग इसे परमेश्वर से किया गया संबोधन समझते हैं।
    reason: alternative_reading
  - marker: b
    text: या “मैं निर्दोष मार्ग पर विचार करूँगा,” अथवा “मैं निर्दोष मार्ग में बुद्धिमानी से चलूँगा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׂכִּילָה
  choice: मैं ... ध्यान दूँगा
  rationale: שׂכל के हिफ़ील रूप में समझ-बूझ से आचरण करने या सावधानीपूर्वक ध्यान देने का भाव हो सकता है। यहाँ यह निर्दोष जीवन-मार्ग के प्रति सोच-समझकर सजग रहने को व्यक्त करता है।
- source_word: בְּדֶרֶךְ תָּמִים
  choice: निर्दोष चाल पर
  rationale: דֶּרֶךְ नैतिक जीवन-पद्धति का रूपक है और תָּמִים नैतिक अखंडता या खरेपन को दर्शाता है, पापरहित सिद्धता को नहीं। हिंदी में “चाल” जीवन के आचरण का स्वाभाविक और संक्षिप्त रूपक है।
- source_word: מָתַי תָּבוֹא אֵלַי
  choice: तू मेरे पास कब आएगा?
  rationale: क्रिया द्वितीय पुरुष पुल्लिंग एकवचन है, इसलिए सीधे संबोधन को रखा गया है। कर्ता स्पष्ट रूप से नहीं लिखा है; संदर्भ में इसे प्रायः परमेश्वर से संबोधन माना जाता है, पर मुख्य पाठ इसे स्पष्ट करके अस्पष्टता समाप्त नहीं करता।
- source_word: אֶתְהַלֵּךְ
  choice: मैं ... चलूँगा
  rationale: הלך का हित्पएल रूप जीवन बिताने या आचरण करने का अर्थ दे सकता है। “चलूँगा” मूल नैतिक रूपक को बनाए रखता है और हिंदी में समझने योग्य है।
- source_word: בְּתָם לְבָבִי
  choice: निष्कपट हृदय से
  rationale: תֹּם अखंडता, खरेपन और निष्कपटता का भाव देता है। हृदय के साथ यह भीतर की नैतिक सच्चाई को दर्शाता है; “निष्कपट हृदय से” आधुनिक हिंदी में स्वाभाविक है।
- source_word: בְּקֶרֶב בֵּיתִי
  choice: अपने घर के भीतर
  rationale: בְּקֶרֶב का शाब्दिक भाव “बीच में” है, पर यहाँ “घर के भीतर” घरेलू जीवन-क्षेत्र को स्वाभाविक हिंदी में व्यक्त करता है।
theological_decisions:
- issue: “तू मेरे पास कब आएगा?” में निहित कर्ता
  choice: मुख्य पाठ में द्वितीय पुरुष का सीधा संबोधन रखा गया, पर कर्ता का नाम नहीं जोड़ा गया।
  alternative: “परमेश्वर, तू मेरे पास कब आएगा?” कहना, अथवा इस वाक्य को निर्दोष चाल के आने से जोड़कर अधिक निर्वैयक्तिक बनाना।
  rationale: इब्रानी क्रिया द्वितीय पुरुष पुल्लिंग एकवचन है, लेकिन स्पष्ट कर्ता नहीं दिया गया। परमेश्वर को संबोधन समझना संदर्भानुकूल और प्रचलित है, फिर भी अनुवाद को मूल पाठ की निहित अस्पष्टता सुरक्षित रखनी चाहिए।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी में, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रखी गई है। “चाल” और “चलूँगा” मूल के नैतिक ‘मार्ग/चलने’ वाले रूपक को बनाए रखते हैं। “तू” भजन में परमेश्वर की ओर संभावित निकट, एकवचन संबोधन को बिना नाम जोड़े व्यक्त करता है।
