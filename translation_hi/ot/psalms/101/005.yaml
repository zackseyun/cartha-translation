source:
  edition: WLC
  text: מלושני בַ/סֵּ֨תֶר רֵעֵ/הוּ֮ אוֹת֪/וֹ אַ֫צְמִ֥ית גְּֽבַהּ עֵ֭ינַיִם וּ/רְחַ֣ב לֵבָ֑ב אֹ֝ת֗/וֹ לֹ֣א אוּכָֽל׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/101/005.yaml
  text: Whoever secretly slanders his neighbor[a], him I will destroy; one with haughty eyes and a proud heart[b], him I cannot endure.
translation:
  language: hi
  text: 'जो गुप्त रूप से अपने पड़ोसी की बदनामी करता है,[a]

    उसे मैं नाश कर दूँगा;

    ऊँची आँखों और अभिमानी मन वाले को,[b]

    मैं सह नहीं सकता।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो अपने पड़ोसी की गुप्त रूप से बदनामी करता है, उसे मैं काट डालूँगा।”
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “ऊँची आँखों और चौड़े हृदय वाला।” यह इब्रानी मुहावरा अहंकारी दृष्टि और घमंडी मनोवृत्ति को दर्शाता है।
    reason: cultural_note
lexical_decisions:
- source_word: מְלוֹשְׁנִי / מלושני
  choice: जो ... निंदा करता है
  rationale: לשׁן से बना यह रूप किसी के विरुद्ध दुर्भावनापूर्ण बातें कहने वाले व्यक्ति को दर्शाता है। ‘निंदा करता है’ आधुनिक हिन्दी में स्वाभाविक है और साधारण आलोचना से अधिक गंभीर दोषारोपण का भाव रखता है।
- source_word: בַסֵּתֶר
  choice: छिपकर
  rationale: शाब्दिक अर्थ ‘गुप्त स्थान में’ है; यहाँ यह क्रिया-विशेषण की तरह गुप्त रूप से किए गए काम को व्यक्त करता है।
- source_word: רֵעֵהוּ
  choice: अपने पड़ोसी
  rationale: רֵעַ सामाजिक निकटता वाले साथी या दूसरे व्यक्ति के लिए प्रयुक्त हो सकता है। ‘पड़ोसी’ व्यापक और परिचित हिन्दी समानार्थी है तथा इसे केवल घनिष्ठ मित्र तक सीमित नहीं करता।
- source_word: אַצְמִית
  choice: मैं नष्ट कर दूँगा
  rationale: צמת के हिफ़ील रूप में मिटा देने या नाश करने का प्रबल भाव है। ‘नष्ट कर दूँगा’ इसकी गंभीरता बनाए रखता है, पर दंड की कोई ऐसी विशिष्ट रीति नहीं जोड़ता जिसका मूल में उल्लेख नहीं है।
- source_word: גְּבַהּ עֵינַיִם
  choice: जिसकी आँखें घमंड से ऊँची हैं
  rationale: अनुवाद मूल के ‘ऊँची आँखों’ वाले ठोस बिंब को बनाए रखते हुए स्पष्ट करता है कि यह अहंकारी दृष्टि और व्यवहार का मुहावरा है।
- source_word: וּרְחַב לֵבָב
  choice: जिसका मन अभिमानी है
  rationale: शाब्दिक रूप ‘हृदय में चौड़ा’ है, जो इस प्रसंग में घमंड या आत्म-महत्त्व का इब्रानी मुहावरा है। हिन्दी में ‘चौड़ा हृदय’ उदारता का भ्रामक अर्थ दे सकता था, इसलिए भावार्थ दिया गया है।
- source_word: לֹא אוּכָל
  choice: मैं सह नहीं सकता
  rationale: शाब्दिक अर्थ ‘मैं सक्षम नहीं हूँ’ है, पर प्रसंग में निहित अर्थ ऐसे व्यक्ति को सहन न करना है। यह रूप असमर्थता और दृढ़ नैतिक अस्वीकार—दोनों का तनाव बनाए रखता है।
theological_decisions:
- issue: राजकीय-नैतिक घोषणा में दंड का स्वरूप
  choice: वक्ता चुगली करने वाले को नष्ट करने और अभिमानी व्यक्ति को सहन न करने का दृढ़ संकल्प व्यक्त करता है; दंड की ठीक रीति निर्दिष्ट नहीं की गई।
  alternative: इसे अनिवार्य रूप से शाब्दिक मृत्युदंड मानना, या केवल संगति से इनकार करने की अतिशयोक्ति मानना।
  rationale: मूल का אַצְמִית बहुत प्रबल न्याय-वचन है, जबकि לֹא אוּכָל असहिष्णुता या नैतिक अस्वीकार व्यक्त करता है। अनुवाद दोनों की शक्ति बनाए रखता है और किसी अनिर्दिष्ट दंड-प्रक्रिया को पाठ में नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, काव्यात्मक पंक्ति-विन्यास के साथ रखी गई है। ‘घमंड से ऊँची आँखें’ मूल बिंब को बचाता है, जबकि ‘अभिमानी मन’ ऐसे शाब्दिक अनुवाद से बचता है जो हिन्दी में उदारता का अर्थ दे सकता है।
