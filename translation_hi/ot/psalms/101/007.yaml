  text: לֹֽא יֵשֵׁ֨ב בְּ/קֶ֥רֶב בֵּיתִ/י֮ עֹשֵׂ֪ה רְמִ֫יָּ֥ה דֹּבֵ֥ר שְׁקָרִ֑ים לֹֽא יִ֝כּ֗וֹן לְ/נֶ֣גֶד עֵינָֽ/י־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/101/007.yaml
  text: One who practices deceit will not dwell within my house[b][a]; one who speaks lies will not stand before my eyes.
translation:
  language: hi
  text: छल करनेवाला मेरे घर के भीतर न बसेगा; झूठ बोलनेवाला मेरी आँखों के सामने न टिकेगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरी आँखों के सामने स्थापित न होगा।” इब्रानी क्रिया का अर्थ “स्थापित होना,” “दृढ़ होना” या “स्थिर रहना” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵשֵׁב
  choice: न बसेगा
  rationale: ישׁב के ‘बैठना, बसना, बने रहना’ अर्थों में यहाँ ‘मेरे घर के भीतर’ के साथ ‘बसना’ निरंतर निवास या स्वीकृत उपस्थिति को स्वाभाविक रूप से व्यक्त करता है।
- source_word: בְּקֶרֶב בֵּיתִי
  choice: मेरे घर के भीतर
  rationale: בקרב का अर्थ ‘बीच में, भीतर’ है; यह चयन वक्ता के घराने के अंदरूनी दायरे का भाव सहज हिन्दी में रखता है।
- source_word: עֹשֵׂה רְמִיָּה
  choice: छल करनेवाला
  rationale: कृदन्त עֹשֵׂה नियमित या चरित्रगत आचरण बताता है; ‘छल करनेवाला’ इस निरंतर प्रवृत्ति को संक्षिप्त और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: דֹּבֵר שְׁקָרִים
  choice: झूठ बोलनेवाला
  rationale: कृदन्त דֹּבֵר चरित्रगत व्यवहार और बहुवचन שְׁקָרִים झूठी बातों को दर्शाता है; हिन्दी में यह पद समानांतर संरचना बनाए रखता है।
- source_word: יִכּוֹן
  choice: स्थिर न रह सकेगा
  rationale: निफ़अल रूप का अर्थ ‘स्थापित होना, दृढ़ होना, टिकना’ हो सकता है। ‘मेरी आँखों के सामने’ के साथ यह अनुवाद उपस्थिति में टिके या स्वीकारे न रह पाने का भाव देता है, जबकि मूल की स्थिरता संबंधी छवि भी बचाता है।
- source_word: לְנֶגֶד עֵינַי
  choice: मेरी आँखों के सामने
  rationale: यह मूल की दृश्यात्मक अभिव्यक्ति ‘मेरी आँखों के सामने’ को सीधे सुरक्षित रखता है।
theological_decisions:
- issue: छल करनेवाले को बाहर रखने के संकल्प का दायरा
  choice: इसे भजनकार के अपने घर और अपनी उपस्थिति के विषय में व्यक्तिगत/राजकीय संकल्प के रूप में रखा गया है।
  alternative: इसे परमेश्वर के घर के विषय में सार्वभौमिक कथन या आंतरिक नैतिक शुद्धता का रूपक मानना।
  rationale: प्रथम पुरुष के ‘मेरे घर’ और ‘मेरी आँखों’ को ज्यों का त्यों रखना भजन 101 के राजकीय और घरेलू संदर्भ के अनुरूप है; अनुवाद पाठ से आगे कोई व्यापक सिद्धान्त नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज शैली। दोनों कृदन्तों को ‘करनेवाला/बोलनेवाला’ से समानांतर रखा गया है। संयुक्त ‘करनेवाला’ वर्तनी प्रवाह और आधुनिक प्रकाशन-शैली के अनुरूप है।
