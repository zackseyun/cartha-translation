source:
  edition: WLC
  text: לֹֽא אָשִׁ֨ית לְ/נֶ֥גֶד עֵינַ֗/י דְּֽבַר בְּלִ֫יָּ֥עַל עֲשֹֽׂה סֵטִ֥ים שָׂנֵ֑אתִי לֹ֖א יִדְבַּ֣ק בִּֽ/י־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/101/003.yaml
  text: I will not set any worthless thing before my eyes[a]; I hate the work of those who turn aside[b]; it will not cling to me.
translation:
  language: hi
  text: मैं अपनी आँखों के सामने कोई निकृष्ट बात नहीं रखूँगा[a]। भटकने वालों की करनी से मैं घृणा करता हूँ[b]; वह मुझसे नहीं चिपकेगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “कोई अधम बात” अथवा “बिलियाल की कोई बात।” यहाँ इब्रानी בְּלִיָּעַל का अर्थ संभवतः “निकृष्ट/अधम” है, न कि व्यक्तिवाचक नाम “बिलियाल।”
    reason: lexical_alternative
  - marker: b
    text: या “धर्मत्यागियों की करनी” अथवा “कुटिल लोगों के काम।” मूल शब्द में सही मार्ग से मुड़ जाने या विचलित होने का भाव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אָשִׁית
  choice: रखूँगा
  rationale: שׂים के प्रथम पुरुष एकवचन अपूर्ण रूप का अर्थ ‘रखना/स्थापित करना’ है। ‘आँखों के सामने ... रखूँगा’ हिन्दी में स्वाभाविक है और संकल्प का भाव बनाए रखता है।
- source_word: לְנֶגֶד עֵינַי
  choice: अपनी आँखों के सामने
  rationale: यह ठोस दृश्य-बिंब को सुरक्षित रखता है और बताता है कि वक्ता जान-बूझकर किस बात को अपनी दृष्टि के सामने आने देता है।
- source_word: דְּבַר בְּלִיָּעַל
  choice: कोई निकम्मी बात
  rationale: דבר का अर्थ ‘बात/वस्तु/मामला’ और בליעל का यहाँ सामान्य विशेषणात्मक अर्थ ‘निकम्मा, अधम, दुष्ट’ अधिक संभावित है। ‘निकम्मी बात’ निरर्थकता और नैतिक निकृष्टता के तनाव को संक्षेप में व्यक्त करती है; विकल्प पादटिप्पणी में दिए गए हैं।
- source_word: עֲשֹׂה סֵטִים
  choice: भटक जानेवालों के काम
  rationale: עֲשֹׂה कार्य/करनी को और סֵטִים मार्ग से हटने या भटकनेवालों को सूचित करता है। यह अनुवाद कर्म और नैतिक विचलन, दोनों को बनाए रखता है।
- source_word: שָׂנֵאתִי
  choice: मैं घृणा करता हूँ
  rationale: रूप पूर्ण है, पर काव्य-संदर्भ में यह वक्ता की स्थिर और वर्तमान मनोवृत्ति व्यक्त करता है।
- source_word: לֹא יִדְבַּק בִּי
  choice: वह मुझसे नहीं चिपकेगा
  rationale: דבק का मूल बिंब चिपकने या लगे रहने का है। यह हिन्दी रूप उस भ्रष्ट काम के वक्ता से न जुड़ने के रूपक को सुरक्षित रखता है।
theological_decisions:
- issue: בליעל का अर्थ
  choice: 'सामान्य विशेषणात्मक अर्थ: ‘निकम्मी/अधम बात’'
  alternative: 'व्यक्तिवाचक अर्थ: ‘बिलियाल की कोई बात’'
  rationale: भजन 101:3 में דְּבַר בְּלִיָּעַל का सबसे स्वाभाविक अर्थ नैतिक रूप से निकम्मी, अधम या दुष्ट बात है। यहाँ बाद के व्यक्तिरूप ‘बिलियाल’ को आयात करना आवश्यक नहीं है।
- issue: סֵטִים से संकेतित लोग
  choice: ‘भटक जानेवाले’
  alternative: ‘धर्मत्यागी’ या ‘कुटिल लोग’
  rationale: इब्रानी शब्द का मूल बिंब मार्ग से मुड़ने या विचलित होने का है। ‘भटक जानेवाले’ उस बिंब को बचाता है और ‘धर्मत्यागी’ जैसी अधिक विशिष्ट धार्मिक व्याख्या को मुख्य पाठ में आरोपित नहीं करता।
- issue: अंतिम सर्वनाम का संदर्भ
  choice: एकवचन ‘वह’, निकटवर्ती ‘काम’ की ओर संकेत
  alternative: उन लोगों या उनकी करनी को सामूहिक रूप से संदर्भित समझना
  rationale: इब्रानी יִדְבַּק एकवचन है। हिन्दी में ‘वह’ व्याकरणिक रूप को बनाए रखता है, यद्यपि भावार्थ में यह उस प्रकार के भ्रष्ट कार्य/आचरण को समेट सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण काव्यात्मक गद्य रखा गया है। ‘निकम्मी बात’ सामान्य पाठक के लिए बोधगम्य है, जबकि पादटिप्पणी नैतिक तीव्रता और वैकल्पिक अर्थों को स्पष्ट करती है। समानांतर खंडों और मूल के ‘चिपकने’ वाले रूपक को सुरक्षित रखा गया है।
