base_translation:
  language: en
  yaml_path: translation/ot/psalms/101/001.yaml
  text: Of David[a]. A psalm. I will sing of steadfast love and justice; to you, O Yahweh[b], I will sing praise.
translation:
  language: hi
  text: 'दाऊद का[a]। एक भजन।


    मैं अटल प्रेम और न्याय का गीत गाऊँगा;


    हे याहवे, मैं तेरी स्तुति गाऊँगा।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शीर्षक का अर्थ ‘दाऊद के लिए’, ‘दाऊद से संबंधित’ या ‘दाऊद द्वारा’ भी हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: לְדָוִד
  choice: दाऊद का
  rationale: भजन के शीर्षक में לְ लेखन, समर्पण या संबंध का संकेत दे सकता है। ‘दाऊद का’ इस अस्पष्टता को ‘दाऊद द्वारा’ की अपेक्षा बेहतर बनाए रखता है।
- source_word: מִזְמוֹר
  choice: एक भजन
  rationale: यह संगीतात्मक भजन के लिए प्रचलित शीर्षकीय शब्द है; आधुनिक हिन्दी में ‘भजन’ स्वाभाविक और स्पष्ट है।
- source_word: חֶסֶד
  choice: अटल प्रेम
  rationale: חֶסֶד में प्रेम, निष्ठा और दया का व्यापक भाव है। ‘अटल प्रेम’ उसके स्थायी संबंधपरक अर्थ को संक्षेप और स्वाभाविक रूप में व्यक्त करता है।
- source_word: וּמִשְׁפָּט
  choice: और न्याय
  rationale: מִשְׁפָּט का अर्थ न्याय, न्यायिक निर्णय या न्याय-विधान हो सकता है। यहाँ חֶסֶד के साथ गुणात्मक जोड़ी में ‘न्याय’ सबसे स्वाभाविक है।
- source_word: אָשִׁירָה
  choice: मैं ... गीत गाऊँगा
  rationale: सहोर्टेटिव रूप संकल्प या इच्छा व्यक्त करता है; हिन्दी का भविष्यकाल इस दृढ़ संकल्प को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: לְךָ
  choice: तेरे लिए
  rationale: לְ यहाँ स्तुति के संबोधन अथवा उसके लक्ष्य को सूचित करता है। ‘तेरे लिए’ हिन्दी में स्वाभाविक है और ‘यहोवा’ को प्रत्यक्ष संबोधन बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में दिव्य नाम के सुव्यवस्थित और व्यापक रूप ‘यहोवा’ का प्रयोग किया गया है, न कि किसी उपाधि से उसका प्रतिस्थापन।
- source_word: אֲזַמֵּרָה
  choice: मैं ... स्तुति गाऊँगा
  rationale: זמר संगीत के साथ गाने या स्तुति गाने को सूचित करता है। ‘स्तुति गाऊँगा’ पहले क्रियापद की मात्र पुनरावृत्ति से बचते हुए स्तुतिपरक भाव स्पष्ट करता है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में व्यक्तिगत दिव्य नाम है। हिन्दी पाठकों के लिए परिचित लिप्यंतरण ‘यहोवा’ नाम को किसी उपाधि से बदले बिना सुरक्षित रखता है।
- issue: חֶסֶד और מִשְׁפָּט की अर्थ-सीमा
  choice: अटल प्रेम और न्याय
  alternative: दया और न्याय-दण्ड
  rationale: चुना हुआ पाठ वाचा-संबंधी निष्ठा और नैतिक न्याय की व्यापकता बनाए रखता है; संकरे विकल्पों को मुख्य पाठ में थोपता नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण काव्यात्मक शैली। ‘तेरे’ का प्रयोग एकवचन प्रत्यक्ष संबोधन और भजन की आत्मीयता के अनुरूप है। शीर्षक को मुख्य काव्य-पंक्तियों से अलग रखा गया है।
