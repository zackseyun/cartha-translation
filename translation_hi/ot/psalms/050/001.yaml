  yaml_path: translation/ot/psalms/050/001.yaml
  text: A psalm of Asaph. The Mighty One[a], God, Yahweh, has spoken and called the earth from the rising of the sun to its setting.
translation:
  language: hi
  text: 'आसाप का भजन।


    शक्तिमान, परमेश्वर, याहवे ने कहा है

    और सूर्य के उदय से उसके अस्त तक पृथ्वी को पुकारा है।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִזְמוֹר
  choice: भजन
  rationale: यह भजन-संग्रह के शीर्षकों में प्रयुक्त मानक विधा-सूचक शब्द है; आधुनिक हिन्दी में ‘भजन’ स्वाभाविक और स्थापित है।
- source_word: לְאָסָף
  choice: आसाप का
  rationale: शीर्षकों में לְ लेखन, संबंध या संग्रह—इनमें से किसी का संकेत दे सकता है। ‘आसाप का’ संक्षिप्त और स्वाभाविक है तथा संबंध की सटीक प्रकृति को अनावश्यक रूप से तय नहीं करता।
- source_word: אֵל
  choice: सामर्थी
  rationale: अगले दो ईश्वरीय नामों से इसे अलग रखते हुए इसकी शक्ति-सूचक अर्थछाया और तीन पदों की आलंकारिक क्रमबद्धता बचाई गई है।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: एकवचन क्रियाओं और याहवे नाम के साथ इसका संकेत इस्राएल के परमेश्वर की ओर है; इसलिए एकवचन ‘परमेश्वर’ उपयुक्त है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी लिपि में ध्वन्यंतरित किया गया है।
- source_word: דִּבֶּר
  choice: ने कहा है
  rationale: पूर्ण क्रिया को वर्तमान प्रासंगिकता वाले सम्पन्न कथन के रूप में व्यक्त करता है; ‘कहा है’ साधारण हिन्दी में ‘बोला है’ से अधिक स्वाभाविक है।
- source_word: וַיִּקְרָא
  choice: पुकारा है
  rationale: यह पहली क्रिया के बाद पृथ्वी को बुलाने की क्रिया बताता है; ‘पुकारा’ मूल के बुलाने/आह्वान करने के भाव को बिना न्यायिक संदर्भ जोड़े रखता है।
- source_word: אָרֶץ
  choice: पृथ्वी
  rationale: सूर्य के उदय से अस्त तक का सार्वभौमिक विस्तार यहाँ ‘देश’ के बजाय पूरी पृथ्वी का संकेत देता है।
- source_word: מִמִּזְרַח שֶׁמֶשׁ
  choice: सूर्य के उदय से
  rationale: ‘पूर्व से’ की अपेक्षा मूल काव्यात्मक बिंब को प्रत्यक्ष रूप से सुरक्षित रखता है।
- source_word: עַד מְבֹאוֹ
  choice: उसके अस्त होने तक
  rationale: प्रत्यय का संबंध सूर्य से है; यह हिन्दी में स्वाभाविक रूप से सूर्यास्त का दूसरा सिरा व्यक्त करता है।
theological_decisions:
- issue: अֵל אֱלֹהִים יְהוָה की त्रिस्तरीय ईश्वरीय पदावली
  choice: सामर्थी, परमेश्वर, याहवे
  alternative: ‘ईश्वर, परमेश्वर, याहवे’ अथवा ‘देवताओं का परमेश्वर, याहवे’
  rationale: इब्रानी में तीन ईश्वरीय पद क्रम से रखे गए हैं। ‘सामर्थी’ पहले पद की विशिष्ट शक्ति-सूचक अर्थछाया को बचाता है और उसे אֱלֹהִים के साथ मिला नहीं देता। ‘देवताओं का परमेश्वर’ सम्भव व्याख्या है, पर यहाँ पदों को समानाधिकरण में पढ़ना अधिक सहज है; वैकल्पिक समझ को पाद-टिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। पंक्ति-विन्यास इब्रानी काव्य के दो व्यापक खंडों—ईश्वरीय वक्तव्य और पृथ्वी के सार्वभौमिक आह्वान—को उभारता है।
