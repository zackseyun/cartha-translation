  text: And the heavens declare his righteousness[a], for God himself is judge. Selah
translation:
  language: hi
  text: 'और आकाश उसकी धार्मिकता[a] की घोषणा करता है,

    क्योंकि परमेश्वर स्वयं न्याय करता है। सेला'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसका न्याय।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגִּידוּ
  choice: घोषणा करता है
  rationale: हिफ़ील रूप सार्वजनिक रूप से प्रकट या घोषित करने का भाव देता है। हिंदी में ‘घोषणा करता है’ काव्यात्मक और उद्घोषणात्मक अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: שָׁמַיִם
  choice: आकाश
  rationale: इब्रानी बहुवचन यहाँ सामूहिक अर्थ रखता है। आधुनिक हिंदी में ‘आकाश’ इस काव्यात्मक सामूहिक संज्ञा के लिए स्वाभाविक है।
- source_word: צִדְקוֹ
  choice: उसकी धार्मिकता
  rationale: צדק नैतिक खराई और न्याय, दोनों को व्यक्त कर सकता है। ‘धार्मिकता’ व्यापक नैतिक अर्थ को बनाए रखती है, जबकि ‘न्याय’ को पादटिप्पणी में वास्तविक विकल्प के रूप में रखा गया है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यहाँ כִּי पहले कथन का कारण बताता है; ‘क्योंकि’ आधुनिक हिंदी में उसका स्पष्ट और स्वाभाविक causal रूप है।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: संदर्भ में शब्द स्पष्ट रूप से एकवचन परमेश्वर के लिए है; ‘परमेश्वर’ गरिमापूर्ण और प्रचलित हिंदी रूप है।
- source_word: שֹׁפֵט
  choice: न्यायी है
  rationale: कृदंत यहाँ विधेय के रूप में परमेश्वर की न्याय करने वाली पहचान और भूमिका बताता है। ‘न्यायी है’ हिंदी में स्वाभाविक रहते हुए संज्ञात्मक-वर्णनात्मक बल बनाए रखता है।
- source_word: הוּא
  choice: स्वयं
  rationale: 'स्वतंत्र सर्वनाम का बल ‘स्वयं’ से स्पष्ट होता है: न्यायी कोई और नहीं, परमेश्वर स्वयं है।'
- source_word: סֶלָה
  choice: सेला
  rationale: इस आराधनात्मक या संगीत-संबंधी संकेत का सटीक अर्थ अनिश्चित है, इसलिए इसका अनुवाद करने के बजाय लिप्यंतरण रखा गया है।
theological_decisions:
- issue: ईश्वरीय न्याय के संदर्भ में צדק का अनुवाद
  choice: उसकी धार्मिकता
  alternative: उसका न्याय
  rationale: ‘धार्मिकता’ परमेश्वर की व्यापक नैतिक खराई को बनाए रखती है और उसे केवल न्यायिक कार्यवाही तक सीमित नहीं करती। फिर भी इस प्रसंग में ‘न्याय’ भी संभावित अर्थ है, इसलिए उसे पादटिप्पणी में सुरक्षित रखा गया है।
- issue: שֹׁפֵט को गुण, पद या क्रिया के रूप में व्यक्त करना
  choice: न्यायी है
  alternative: न्याय करता है / न्यायाधीश है
  rationale: इब्रानी कृदंत का विधेयात्मक बल बना रहे और अनावश्यक रूप से किसी औपचारिक पदवी का संकेत न जुड़े, इसलिए ‘न्यायी है’ चुना गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक रखी गई है। ‘आकाश’ को हिंदी की स्वाभाविक सामूहिक संज्ञा मानकर एकवचन क्रिया ली गई है। ‘सेला’ को अर्थ की अनिश्चितता के कारण लिप्यंतरित किया गया है।
