  text: וּ֭/קְרָאֵ/נִי בְּ/י֣וֹם צָרָ֑ה אֲ֝חַלֶּצְ/ךָ֗ וּֽ/תְכַבְּדֵֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/015.yaml
  text: And call on me in the day of distress; I will deliver you[a], and you will honor me.
translation:
  language: hi
  text: संकट के दिन मुझे पुकार; मैं तुझे छुड़ाऊँगा, और तू मेरा आदर करेगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּקְרָאֵנִי
  choice: मुझे पुकार
  rationale: यहाँ קרא का अर्थ सहायता के लिए परमेश्वर को पुकारना है। ‘मुझे पुकार’ आधुनिक हिन्दी में स्वाभाविक, सीधा और प्रार्थना-संदर्भ के अनुकूल है।
- source_word: בְּיוֹם צָרָה
  choice: संकट के दिन
  rationale: यह इब्रानी कालवाचक पद का स्वाभाविक हिन्दी रूप है और צָרָה की विपत्ति, परेशानी तथा घोर कठिनाई की व्यापकता को बनाए रखता है।
- source_word: אֲחַלֶּצְךָ
  choice: मैं तुझे छुड़ाऊँगा
  rationale: חלץ के पिएल रूप का यहाँ अर्थ खतरे या संकट से बचाना अथवा छुड़ाना है। ‘छुड़ाऊँगा’ दैवी उद्धार की क्रिया को स्पष्ट और संक्षिप्त रूप में व्यक्त करता है।
- source_word: וּתְכַבְּדֵנִי
  choice: और तू मेरा आदर करेगा
  rationale: כבד के पिएल रूप में आदर देने या महिमा करने का भाव है। ‘मेरा आदर करेगा’ व्यापक मूल अर्थ को स्वाभाविक हिन्दी में रखता है, बिना उसे केवल आराधनात्मक भाषा तक सीमित किए।
theological_decisions:
- issue: दैवी छुटकारे के बाद मनुष्य की प्रतिक्रिया
  choice: और तू मेरा आदर करेगा
  alternative: और तू मेरी महिमा करेगा
  rationale: इब्रानी क्रिया बचाए गए व्यक्ति द्वारा परमेश्वर को उचित आदर देने को व्यक्त करती है। ‘आदर करेगा’ इसका व्यापक अर्थ बनाए रखता है; ‘महिमा करेगा’ भी संभव है, पर यहाँ अनावश्यक रूप से अधिक विशिष्ट धार्मिक शब्दावली हो सकती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; काव्यात्मक पर सरल और गरिमापूर्ण शैली। एकवचन संबोधन के लिए ‘तू/तुझे’ रखा गया है, जो भजन में परमेश्वर के प्रत्यक्ष, निकट संबोधन के अनुकूल है। अनावश्यक फुटनोट नहीं जोड़ा गया, क्योंकि ‘आदर’ मूल की अर्थ-सीमा को पर्याप्त रूप से व्यक्त करता है।
