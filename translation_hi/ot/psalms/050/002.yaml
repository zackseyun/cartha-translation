  text: מִ/צִּיּ֥וֹן מִכְלַל יֹ֗פִי אֱלֹהִ֥ים הוֹפִֽיעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/002.yaml
  text: From Zion[a], the perfection of beauty, God shines forth.
translation:
  language: hi
  text: सिय्योन से[a], जो सौंदर्य की परिपूर्णता है, परमेश्वर चमकते हुए प्रकट होता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सिय्योन से, जो सौंदर्य की परिपूर्णता है, परमेश्वर चमकते हुए प्रकट हुआ है”; अथवा, “सिय्योन से परमेश्वर पूर्ण सौंदर्य में चमकते हुए प्रकट होता है।”
    reason: इब्रानी सिद्ध क्रिया को भूत/पूर्ण भाव में भी समझा जा सकता है, और ‘सौंदर्य की परिपूर्णता’ को सिय्योन का वर्णन मानने के बजाय परमेश्वर के प्रकट होने की रीति से जोड़ा जा सकता है।
lexical_decisions:
- source_word: מִ/צִּיּוֹן
  choice: सिय्योन से
  rationale: מִן स्रोत या उद्गम बताता है; ‘सिय्योन से’ स्वाभाविक हिन्दी में इसी अर्थ को स्पष्ट रखता है।
- source_word: מִכְלַל יֹפִי
  choice: सौन्दर्य की परिपूर्णता
  rationale: यह रचना पूर्णता या सौन्दर्य की चरम अभिव्यक्ति का भाव देती है और काव्यात्मक गरिमा बनाए रखती है।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: एकवचन क्रिया के कारण यहाँ अर्थ एकवचन है; हिन्दी बाइबलीय शैली में ‘परमेश्वर’ सहज और प्रतिष्ठित रूप है।
- source_word: הוֹפִיעַ
  choice: प्रकाशमान होता है
  rationale: हिफ़ील रूप में चमकते हुए प्रकट होने का भाव है। वर्तमानकालीन काव्यात्मक प्रस्तुति इब्रानी सिद्ध क्रिया की सजीवता को व्यक्त करती है, यद्यपि पूर्ण भूतकाल भी सम्भव है।
theological_decisions:
- issue: ‘सौन्दर्य की परिपूर्णता’ का सम्बन्ध सिय्योन से है या परमेश्वर के प्रकट होने की रीति से
  choice: 'वाक्यांश को सिय्योन का समानाधिकरण माना गया: ‘सिय्योन से, जो सौन्दर्य की परिपूर्णता है’।'
  alternative: ‘सिय्योन से परमेश्वर पूर्ण सौन्दर्य में प्रकाशमान हुआ है’ अथवा वाक्यांश को परमेश्वर से अधिक सीधे जोड़ा जा सकता है।
  rationale: इब्रानी शब्दक्रम में यह वाक्यांश सबसे स्वाभाविक रूप से सिय्योन का वर्णन करता है; फिर भी वैकल्पिक क्रियाविशेषणीय सम्बन्ध को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण काव्यात्मक शैली रखी गई है। ‘सौन्दर्य की परिपूर्णता’ मूल की संक्षिप्त काव्यात्मक अभिव्यक्ति को सुरक्षित रखता है; ‘प्रकाशमान होता है’ चमकते हुए प्रकट होने के संयुक्त भाव को व्यक्त करता है।
