  yaml_path: translation/ot/psalms/050/014.yaml
  text: Offer to God a sacrifice of thanksgiving[a], and fulfill your vows to the Most High.
translation:
  language: hi
  text: परमेश्वर को धन्यवाद की बलि चढ़ा[a], और परमप्रधान के लिए अपनी मन्नतें पूरी कर।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “परमेश्वर को धन्यवाद-बलि चढ़ा” अथवा “परमेश्वर को धन्यवाद बलि के रूप में चढ़ा।” इस बलिदान-संबंधी संदर्भ में इब्रानी शब्द תּוֹדָה का अर्थ ‘धन्यवाद’ या ‘धन्यवाद-बलि’ हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: זְבַח
  choice: बलि चढ़ा
  rationale: आज्ञार्थक क्रिया का अनुवाद ऐसे प्रचलित हिन्दी पदबंध से किया गया है जो उपासना-संबंधी बलिदान का अर्थ स्पष्ट रखता है।
- source_word: לֵאלֹהִים
  choice: परमेश्वर को
  rationale: यहाँ ל बलि के प्राप्तकर्ता को दर्शाता है; ‘परमेश्वर को’ स्वाभाविक और सीधा हिन्दी रूप है।
- source_word: תּוֹדָה
  choice: धन्यवाद की बलि
  rationale: תּוֹדָה धन्यवाद अथवा धन्यवाद-बलि, दोनों का बोध करा सकता है। ‘धन्यवाद की बलि’ कृतज्ञता और बलिदान—दोनों पहलुओं को बनाए रखता है।
- source_word: וְשַׁלֵּם
  choice: और ... पूरी कर
  rationale: मन्नत के साथ שׁלם का अर्थ उसके दायित्व को निभाना या पूरा करना है। ‘पूरी कर’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: לְעֶלְיוֹן
  choice: परमप्रधान से की हुई
  rationale: עֶלְיוֹן को उसके ईश्वरीय शीर्षक के अर्थ में ‘परमप्रधान’ किया गया है। हिन्दी में मन्नत के संबंध को स्पष्ट और स्वाभाविक बनाने के लिए ל को ‘से की हुई’ के रूप में व्यक्त किया गया है।
- source_word: נְדָרֶיךָ
  choice: अपनी मन्नतें
  rationale: बहुवचन और एकवचन पुल्लिंग संबोधन को क्रमशः ‘मन्नतें’ और ‘अपनी’ से सुरक्षित रखा गया है।
theological_decisions:
- issue: זבח और תודה का संयुक्त बलिदान-संबंधी प्रयोग
  choice: धन्यवाद की बलि
  alternative: धन्यवाद चढ़ा; धन्यवाद-बलि चढ़ा
  rationale: मुख्य पाठ बलिदान के संदर्भ और कृतज्ञता के भाव दोनों को रखता है, पर इसे किसी अत्यधिक विशिष्ट अनुष्ठानिक श्रेणी तक सीमित नहीं करता। वास्तविक शब्दार्थगत विकल्प पादटिप्पणी में दिया गया है।
- issue: ईश्वरीय शीर्षक עֶלְיוֹן
  choice: परमप्रधान
  alternative: एलयोन
  rationale: यहाँ शब्द परमेश्वर के शीर्षक के रूप में प्रयुक्त है; अर्थानुवाद सामान्य हिन्दी पाठक के लिए इसका आशय सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। एकवचन आज्ञार्थक संबोधन के लिए ‘चढ़ा’ और ‘कर’ प्रयुक्त हुए हैं; ‘परमेश्वर’ तथा ‘परमप्रधान’ प्रचलित बाइबलीय हिन्दी पद हैं।
