  naturalness: The direct singular rebuke and reverent plural verb for God are natural in a scriptural Hindi register. The revised word order is clearer, and “ज़बान पर लेना” is more idiomatic than “मुँह पर रखना” in this verbal context.
  terminology: “दुष्ट,” “विधियाँ,” and “वाचा” appropriately preserve the moral, legal, and covenantal senses of the Hebrew. No doctrinal expansion is introduced.
  issues:
  - severity: medium
    issue: “दुष्ट से परमेश्वर कहते हैं” has ambiguous and nonstandard Hindi word order.
    rationale: The Hebrew לָרָשָׁע marks the recipient of God’s speech. In Hindi, placing “परमेश्वर” before “दुष्ट से” makes that relationship unambiguous.
  - severity: low
    issue: “मेरी वाचा को अपने मुँह पर रखे” is overly literal and less idiomatic in Hindi.
    rationale: The Hebrew image denotes taking up the covenant in speech. “अपनी ज़बान पर ले” naturally conveys this while retaining the mouth/speech imagery; the literal wording is preserved in a footnote.
