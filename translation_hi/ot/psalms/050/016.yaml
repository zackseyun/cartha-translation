  yaml_path: translation/ot/psalms/050/016.yaml
  text: But to the wicked God says[b][a], “What right do you have to recount my statutes and to take my covenant on your lips?”
translation:
  language: hi
  text: परन्तु परमेश्वर दुष्ट से कहते हैं, “तुझे क्या अधिकार है कि तू मेरी विधियों का वर्णन करे और मेरी वाचा को अपनी ज़बान पर ले?[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “और मेरी वाचा को अपने मुँह पर उठाए/ले।” अर्थात, उसे अपनी वाणी में ले।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָרָשָׁע
  choice: पर दुष्ट से
  rationale: וְ यहाँ पिछले प्रसंग के विपरीत एक नया संबोधन आरम्भ करता है; רָשָׁע नैतिक अर्थ में ‘दुष्ट’ है।
- source_word: אָמַר אֱלֹהִים
  choice: परमेश्वर कहते हैं
  rationale: काव्य में पूर्णकालिक אָמַר प्रत्यक्ष वचन की जीवंत भूमिका निभाता है; हिन्दी में वर्तमान काल स्वाभाविक है। आदरसूचक बहुवचन क्रिया हिन्दी के मानक प्रयोग के अनुरूप है।
- source_word: מַה לְּךָ
  choice: तुझे क्या अधिकार है
  rationale: यह मुहावरा जानकारी नहीं माँगता, बल्कि दुष्ट व्यक्ति के नैतिक दावे और पात्रता को चुनौती देता है।
- source_word: לְסַפֵּר חֻקָּי
  choice: मेरी विधियों का वर्णन करे
  rationale: ספּר यहाँ बोलकर सुनाने या घोषित करने का भाव देता है; חֻקִּים परमेश्वर द्वारा निर्धारित विधियों को दर्शाता है।
- source_word: וַתִּשָּׂא בְרִיתִי
  choice: और मेरी वाचा को ... रखे
  rationale: נשׂא का मूल बिंब उठाने या धारण करने का है; यहाँ वाचा को मुख पर लेने, अर्थात उसका उल्लेख करने, का अर्थ है। ‘वाचा’ בְּרִית का स्थापित और धर्मवैचारिक रूप से महत्त्वपूर्ण हिन्दी प्रतिशब्द है।
- source_word: עֲלֵי פִיךָ
  choice: अपने मुँह पर
  rationale: यह इब्रानी बिंब ‘तेरे मुँह पर’ को औपचारिक रूप से सुरक्षित रखता है; अर्थ वाचा को वाणी में लेने का है।
theological_decisions:
- issue: दुष्ट को दी गई फटकार का आशय
  choice: उसके परमेश्वर की विधियाँ सुनाने और वाचा का दावा करने के नैतिक अधिकार को चुनौती
  alternative: दुष्ट द्वारा परमेश्वर की वाचा का किसी भी प्रकार उल्लेख करने पर पूर्ण निषेध
  rationale: מַה לְּךָ पात्रता और संगति पर प्रश्न उठाता है। प्रसंग का निशाना पाखंड और वाचा-विरोधी आचरण है, न कि परमेश्वर के विषय में हर प्रकार के कथन पर निरपेक्ष रोक।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सीधे संबोधन वाला काव्यात्मक गद्य। ‘तू’ मूल पाठ के एकवचन और कठोर फटकार को बनाए रखता है; परमेश्वर के लिए ‘कहते हैं’ आदरसूचक हिन्दी प्रयोग है।
