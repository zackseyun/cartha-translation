  yaml_path: translation/ot/psalms/050/004.yaml
  text: 'He calls to the heavens above and to the earth[a], that he may judge his people:'
translation:
  language: hi
  text: 'वह ऊपर के आकाश को और पृथ्वी को पुकारता है[a], ताकि वह अपने लोगों का न्याय करे:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘वह ऊपर के आकाश और पृथ्वी को बुलाता है।’ न्यायिक प्रसंग में इस क्रिया का अर्थ औपचारिक रूप से बुलाना भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יִקְרָא
  choice: पुकारता है
  rationale: קרא का सामान्य अर्थ ‘पुकारना’ है और न्यायिक प्रसंग में ‘बुलाना’ भी हो सकता है। ‘पुकारता है’ मूल की सजीवता और अर्थगत व्यापकता बनाए रखता है।
- source_word: הַשָּׁמַיִם מֵעָל
  choice: ऊपर के आकाश को
  rationale: מֵעָל यहाँ स्थानसूचक रूप से ‘ऊपर’ का बोध देता है। ‘ऊपर के आकाश’ काव्यात्मक ऊँचाई और विश्वव्यापी साक्षी का भाव स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְאֶל הָאָרֶץ
  choice: और पृथ्वी को
  rationale: आकाश के समानांतर הָאָרֶץ का अर्थ यहाँ किसी सीमित भूभाग के बजाय पूरी ‘पृथ्वी’ है।
- source_word: לָדִין
  choice: ताकि वह ... न्याय करे
  rationale: ל के साथ क्रिया का infinitive रूप उद्देश्य व्यक्त करता है; ‘ताकि’ इस प्रयोजन-संबंध को स्पष्ट और स्वाभाविक हिन्दी में रखता है।
- source_word: עַמּוֹ
  choice: अपनी प्रजा का
  rationale: עַם का अर्थ वाचा-संबंधी प्रसंग में ‘प्रजा/लोग’ है। कर्ता के साथ संबंध स्पष्ट करने के लिए हिन्दी में ‘अपनी प्रजा’ स्वाभाविक है।
theological_decisions:
- issue: निहित कर्ता की पहचान
  choice: कर्ता को ‘वह’ रखा गया है, जो संदर्भ में परमेश्वर की ओर संकेत करता है।
  alternative: पद में स्पष्ट रूप से ‘परमेश्वर’ जोड़ना।
  rationale: इब्रानी क्रिया पुल्लिंग एकवचन है, पर इस पद में संज्ञा-रूप कर्ता नहीं दिया गया। ‘वह’ मूल की वाक्य-प्रवाहगत अस्पष्टता को सुरक्षित रखता है और अतिरिक्त स्पष्टता नहीं जोड़ता।
- issue: आकाश और पृथ्वी की न्यायिक भूमिका
  choice: मुख्य पाठ में केवल यह कहा गया है कि वह उन्हें पुकारता है।
  alternative: उन्हें स्पष्ट रूप से ‘साक्षी’ या ‘न्यायसभा’ कहना।
  rationale: न्यायिक प्रसंग ऐसी भूमिका सुझा सकता है, पर इस पद में उन्हें सीधे ‘साक्षी’ नहीं कहा गया; इसलिए वह व्याख्या पाठ में नहीं जोड़ी गई।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक रखी गई है। ‘आकाश’ को हिन्दी में प्रचलित एकवचन सामूहिक संज्ञा के रूप में लिया गया है; ‘प्रजा’ संबंधपरक और सामुदायिक अर्थ को बनाए रखती है।
