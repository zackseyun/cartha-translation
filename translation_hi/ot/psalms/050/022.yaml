id: PSA.50.22
reference: Psalms 50:22
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: בִּֽינוּ נָ֣א זֹ֭את שֹׁכְחֵ֣י אֱל֑וֹהַּ פֶּן אֶ֝טְרֹ֗ף וְ/אֵ֣ין מַצִּֽיל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/022.yaml
  text: Understand this[a], please, you who forget God, lest I tear you apart, and there be no one to rescue.
translation:
  language: hi
  text: हे परमेश्वर को भूलनेवालो, अब इस बात को समझो, कहीं ऐसा न हो कि मैं तुम्हें फाड़ डालूँ और बचानेवाला कोई न हो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּֽינוּ
  choice: समझो
  rationale: בין के बहुवचन आज्ञार्थक का अर्थ विवेक से समझना या ध्यान देना है। ‘समझो’ सीधा, स्वाभाविक और चेतावनी के अनुरूप है।
- source_word: נָא
  choice: अब
  rationale: यह विनती अथवा तात्कालिक आग्रह को बल देने वाला निपात है। इस कठोर चेतावनी में हिंदी ‘अब’ आग्रह और तात्कालिकता को स्वाभाविक ढंग से व्यक्त करता है; ‘कृपया’ अनुचित रूप से विनम्र सुनाई दे सकता है।
- source_word: זֹאת
  choice: इस बात को
  rationale: संकेतवाचक सर्वनाम पूर्ववर्ती चेतावनी की ओर संकेत करता है। ‘इस बात को’ हिंदी में स्पष्ट है और ‘चेतावनी’ जोड़कर अर्थ को अनावश्यक रूप से सीमित नहीं करता।
- source_word: שֹׁכְחֵי אֱל֑וֹהַּ
  choice: हे परमेश्वर को भूलनेवालो
  rationale: सक्रिय कृदंत का प्रयोग संबोधन के रूप में हुआ है। यह रूप जारी या चरित्रगत भूलने की क्रिया तथा सीधे संबोधन—दोनों को सुरक्षित रखता है।
- source_word: אֱל֑וֹהַּ
  choice: परमेश्वर
  rationale: यह ईश्वर के लिए एकवचन उपाधि है। आधुनिक हिंदी बाइबलीय शैली में ‘परमेश्वर’ स्वाभाविक और गरिमापूर्ण है; मूल में किसी विस्तारित उपाधि का आधार नहीं है।
- source_word: פֶּן
  choice: कहीं ऐसा न हो कि
  rationale: यह चेतावनी के नकारात्मक परिणाम को प्रस्तुत करता है। हिंदी में यह संरचना आशंकासूचक अर्थ को स्वाभाविक रूप से व्यक्त करती है।
- source_word: אֶ֝טְרֹ֗ף
  choice: मैं तुम्हें फाड़ डालूँ
  rationale: טרף शिकार को चीरने-फाड़ने की सजीव छवि देता है। मूल में कर्म निहित है, जिसे संदर्भ के आधार पर ‘तुम्हें’ कहकर हिंदी में स्पष्ट किया गया है; ‘फाड़ डालूँ’ रूपक की तीव्रता बनाए रखता है।
- source_word: וְ/אֵ֣ין מַצִּֽיל
  choice: और बचानेवाला कोई न हो
  rationale: अस्तित्वसूचक निषेध और נצל के हिफ़ील कृदंत से किसी भी छुड़ाने या बचाने वाले के अभाव का अर्थ निकलता है। यह हिंदी रूप संक्षिप्त, स्पष्ट और मूल संरचना के निकट है।
theological_decisions:
- issue: אֶטְרֹף में परमेश्वर के न्याय की हिंस्र रूपकात्मक छवि
  choice: ‘मैं तुम्हें फाड़ डालूँ’ के रूप में प्रत्यक्ष और तीव्र छवि बनाए रखी गई।
  alternative: ‘मैं तुम्हें नष्ट कर दूँ’ या ‘मैं तुम्हें पकड़ लूँ’ जैसे नरम रूप।
  rationale: इब्रानी क्रिया शिकार को फाड़ने की सजीव छवि रखती है। इसे सामान्य ‘नष्ट करना’ कहना न्याय की भयावहता और मूल के धर्मवैचारिक तनाव को कम कर देता।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी में, गंभीर और प्रत्यक्ष चेतावनी के स्वर में रखी गई है। ‘हे ... भूलनेवालो’ काव्यात्मक संबोधन को गरिमा के साथ सुरक्षित रखता है, जबकि शेष वाक्य सामान्य पाठक के लिए सहज है।
