source:
  edition: WLC
  text: הַֽ֭/אוֹכַל בְּשַׂ֣ר אַבִּירִ֑ים וְ/דַ֖ם עַתּוּדִ֣ים אֶשְׁתֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/013.yaml
  text: Do I eat the flesh of bulls[a], or drink the blood of goats?
translation:
  language: hi
  text: क्या मैं बैलों का मांस खाता हूँ या बकरों का खून पीता हूँ?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַאוֹכַל
  choice: क्या मैं...खाता हूँ
  rationale: प्रश्नवाचक הֲ और प्रथम पुरुष एकवचन अपूर्ण क्रिया यहाँ अलंकारिक प्रश्न बनाते हैं। हिन्दी का सामान्य वर्तमान काल इसके सीधे और निरंतर आशय को स्वाभाविक रूप से व्यक्त करता है।
- source_word: בְּשַׂר
  choice: मांस
  rationale: בשר का ठोस अर्थ देह या मांस है; बलि के पशु के संदर्भ में आधुनिक हिन्दी में “मांस” सबसे स्वाभाविक और स्पष्ट है।
- source_word: אַבִּירִים
  choice: बैलों
  rationale: शब्द का मूल भाव “बलवान” हो सकता है, पर बलि, मांस और बकरों के खून के इस संदर्भ में यह शक्तिशाली गोवंशीय नर पशुओं, अर्थात बैलों, को सूचित करता है।
- source_word: וְדַם
  choice: या...खून
  rationale: וְ का सामान्य अर्थ “और” है, किंतु दो समानांतर क्रियाओं वाले इस एक अलंकारिक प्रश्न में हिन्दी का “या” स्वाभाविक रूप से दोनों विकल्पों को जोड़ता है। דם के लिए “खून” साधारण आधुनिक हिन्दी में स्पष्ट है और ठोस बलिदानी बिंब बनाए रखता है।
- source_word: עַתּוּדִים
  choice: बकरों
  rationale: עתודים नर बकरों को सूचित करता है। हिन्दी में “बकरों” से नर लिंग पहले ही स्पष्ट हो जाता है, इसलिए अतिरिक्त “नर” अनावश्यक है।
- source_word: אֶשְׁתֶּה
  choice: पीता हूँ
  rationale: प्रथम पुरुष एकवचन की यह अपूर्ण क्रिया पहले खंड से आरंभ हुए अलंकारिक प्रश्न को आगे बढ़ाती है; समानांतर सामान्य वर्तमान हिन्दी में सहज है।
theological_decisions:
- issue: परमेश्वर के बारे में मानवरूपी बलिदानी भाषा
  choice: मांस खाने और खून पीने के ठोस अलंकारिक प्रश्न को ज्यों का त्यों बनाए रखना
  alternative: इसे भावानुवाद करके “क्या मुझे तुम्हारे बलिदानों की आवश्यकता है?” कहना
  rationale: पद इस बात का निषेध करता है कि परमेश्वर बलिदानी भोजन या पेय पर निर्भर है। मूल इब्रानी की ठोस उपासना-संबंधी छवि इस धार्मिक बल को अमूर्त व्याख्या की अपेक्षा अधिक स्पष्टता से बनाए रखती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। “खून” सामान्य पाठक के लिए “रक्त” या पारंपरिक “लहू” से अधिक सीधा है, जबकि बलिदान की ठोस छवि बनी रहती है।
