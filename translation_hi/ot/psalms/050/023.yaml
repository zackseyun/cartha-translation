id: PSA.50.23
reference: Psalms 50:23
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: זֹבֵ֥חַ תּוֹדָ֗ה יְֽכַ֫בְּדָ֥/נְנִי וְ/שָׂ֥ם דֶּ֑רֶךְ אַ֝רְאֶ֗/נּוּ בְּ/יֵ֣שַׁע אֱלֹהִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/023.yaml
  text: Whoever offers a sacrifice of thanksgiving honors me[c][b][a], and to the one who orders his way I will show the salvation of God.
translation:
  language: hi
  text: जो धन्यवाद की बलि[a] चढ़ाता है, वह मेरा आदर करता है; और जो अपना मार्ग ठीक रखता है[b], उसे मैं परमेश्वर का उद्धार[c] दिखाऊँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “धन्यवाद-बलि।” इब्रानी शब्द תּוֹדָה यहाँ बलि के रूप में व्यक्त धन्यवाद को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: या, “अपने आचरण को व्यवस्थित करता है,” अथवा “मार्ग तैयार करता है।” इब्रानी अभिव्यक्ति संक्षिप्त है और इसका अर्थ अपने जीवन को सही ढंग से व्यवस्थित करना भी हो सकता है।
    reason: alternative_reading
  - marker: c
    text: या, “परमेश्वर का छुटकारा,” अथवा “परमेश्वर की विजय।”
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹבֵחַ
  choice: जो ... बलि चढ़ाता है
  rationale: कर्ता के रूप में प्रयुक्त काल कृदंत को सामान्य व्यक्ति के लिए स्वाभाविक हिन्दी वाक्यांश में व्यक्त किया गया है; ‘बलि चढ़ाता है’ याजकीय संदर्भ को स्पष्ट रखता है।
- source_word: תּוֹדָה
  choice: धन्यवाद की बलि
  rationale: यहाँ शब्द केवल मौखिक धन्यवाद नहीं, बल्कि बलि के रूप में व्यक्त धन्यवाद को सूचित करता है। यह पदबंध दोनों भावों को सहज हिन्दी में बनाए रखता है।
- source_word: יְכַבְּדָנְנִי
  choice: मेरा आदर करता है
  rationale: पिएल रूप का अर्थ आदर देना अथवा महिमा करना है। ‘मेरा आदर करता है’ आधुनिक हिन्दी में स्पष्ट है और मूल कथन की सीधाई बनाए रखता है।
- source_word: וְשָׂם דֶּרֶךְ
  choice: और जो अपना मार्ग ठीक रखता है
  rationale: संक्षिप्त इब्रानी अभिव्यक्ति को जीवन के मार्ग अथवा आचरण को सही ढंग से व्यवस्थित करने के अर्थ में लिया गया है। ‘मार्ग’ का मूल रूपक सुरक्षित है, जबकि हिन्दी स्वाभाविक रहती है।
- source_word: אַרְאֶנּוּ
  choice: उसे मैं ... दिखाऊँगा
  rationale: हिफ़ील रूप का अर्थ ‘किसी को देखने देना/दिखाना’ है और एकवचन पुल्लिंग प्रत्यय को ‘उसे’ से स्पष्ट किया गया है। संदर्भ में भविष्यकालीन प्रतिज्ञा उपयुक्त है।
- source_word: בְּיֵשַׁע אֱלֹהִים
  choice: परमेश्वर का उद्धार
  rationale: יֵשַׁע उद्धार, छुटकारा या विजय का बोध करा सकता है। ‘उद्धार’ स्तोत्र के संदर्भ में स्वाभाविक है; ‘परमेश्वर का’ को बनाए रखने से प्रथम पुरुष वक्ता और तृतीय पुरुष ईश-संज्ञा के बीच मूल पाठ का तनाव सुरक्षित रहता है।
theological_decisions:
- issue: וְשָׂם דֶּרֶךְ की व्याख्या
  choice: 'सही ढंग से जीवन बिताने वाले व्यक्ति के लिए प्रतिज्ञा: ‘जो अपना मार्ग ठीक रखता है ...’'
  alternative: ‘जो मार्ग तैयार करता है’ अथवा ‘जो अपने आचरण को व्यवस्थित करता है’
  rationale: इब्रानी पदबंध संक्षिप्त और कुछ हद तक संदिग्ध है। मुख्य पाठ में नैतिक आचरण का संभावित अर्थ लिया गया है, पर पादटिप्पणी अन्य संभव अर्थों को खुला रखती है; इससे पाठ में स्वीकार्य आराधना और सही जीवन के संबंध को बिना अतिरिक्त सिद्धान्त जोड़े व्यक्त किया जाता है।
- issue: בְּיֵשַׁע אֱלֹהִים में वक्ता और ‘परमेश्वर’
  choice: ‘मैं परमेश्वर का उद्धार दिखाऊँगा’
  alternative: ‘मैं अपना उद्धार दिखाऊँगा’
  rationale: मूल में प्रथम पुरुष वक्ता के साथ स्पष्ट रूप से ‘परमेश्वर का उद्धार’ है। हिन्दी में इसे ‘मेरा उद्धार’ बनाकर अंतर्निहित पहचान को स्पष्ट नहीं किया गया, ताकि मूल की शैली और धार्मिक तनाव सुरक्षित रहें।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी अपनाई गई है। ‘बलि चढ़ाता है,’ ‘मेरा आदर करता है’ और ‘अपना मार्ग ठीक रखता है’ जैसे पदबंध धार्मिक संदर्भ को बनाए रखते हुए अत्यधिक संस्कृतनिष्ठ भाषा से बचते हैं।
