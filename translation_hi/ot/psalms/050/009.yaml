  text: I will not take a bull from your house[a], or goats from your pens.
translation:
  language: hi
  text: 'मैं तेरे घर से कोई बैल नहीं लूँगा,

    न तेरे बाड़ों से बकरे।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֶקַּח
  choice: मैं ... नहीं लूँगा
  rationale: לקח के प्रथम पुरुष एकवचन अपूर्ण रूप को לֹא नकारता है; इस काव्यात्मक ईश्वरीय घोषणा में हिन्दी भविष्यकाल स्वाभाविक है।
- source_word: מִבֵּיתְךָ
  choice: तेरे घर से
  rationale: בַּיִת का ठोस स्थानवाचक अर्थ सुरक्षित रहता है और यहाँ परिवार के सदस्यों के बजाय उपासक की संपत्ति या परिसर का संकेत है।
- source_word: פָר
  choice: कोई बैल
  rationale: פָר बलि के योग्य नर गोवंश, अर्थात बैल, को दर्शाता है; नकारात्मक वाक्य में ‘कोई बैल’ सहज हिन्दी है।
- source_word: מִמִּכְלְאֹתֶיךָ
  choice: तेरे बाड़ों से
  rationale: מִכְלָאָה पशुओं के घेरे या बाड़े को दर्शाता है; ‘बाड़ों’ आधुनिक, स्पष्ट और प्रसंगानुकूल है।
- source_word: עַתּוּדִים
  choice: बकरे
  rationale: עַתּוּדִים विशेष रूप से नर बकरों को दर्शाता है; हिन्दी ‘बकरे’ में यह नरत्व स्पष्ट रूप से सुरक्षित रहता है, इसलिए पाद-टिप्पणी आवश्यक नहीं।
