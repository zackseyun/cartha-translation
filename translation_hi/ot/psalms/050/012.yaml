id: PSA.50.12
reference: Psalms 50:12
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אִם אֶ֭רְעַב לֹא אֹ֣מַר לָ֑/ךְ כִּי לִ֥/י תֵ֝בֵ֗ל וּ/מְלֹאָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/012.yaml
  text: If I were hungry[a], I would not tell you, for the world and its fullness are mine.
translation:
  language: hi
  text: यदि मैं भूखा होता, तो तुझसे न कहता, क्योंकि संसार और जो कुछ उसमें है, वह मेरा है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִם אֶרְעַב
  choice: यदि मैं भूखा होता
  rationale: אִם के साथ अपूर्ण क्रिया यहाँ एक काल्पनिक, अलंकारिक परिस्थिति व्यक्त करती है; यह अनुवाद उसे वर्तमान तथ्य के रूप में प्रस्तुत नहीं करता।
- source_word: לֹא אֹמַר לָךְ
  choice: तो तुझसे न कहता
  rationale: शर्त के परिणाम को स्वाभाविक हिन्दी में व्यक्त करता है। एकवचन सम्बोधन ‘तुझसे’ मूल पाठ के व्यक्ति और निकट, प्रत्यक्ष सम्बोधन को बनाए रखता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण बताने वाला संयोजक है।
- source_word: לִי
  choice: मेरा है
  rationale: मूल पूर्वसर्गीय रचना यहाँ स्वामित्व व्यक्त करती है।
- source_word: תֵבֵל
  choice: संसार
  rationale: תֵבֵל व्यवस्थित अथवा बसा हुआ जगत दर्शाता है; ‘संसार’ आधुनिक हिन्दी में इसका सहज और व्यापक समतुल्य है।
- source_word: וּמְלֹאָהּ
  choice: और जो कुछ उसमें है
  rationale: शाब्दिक ‘उसकी भरपूरी’ हिन्दी में अस्वाभाविक है; यह वाक्यांश उसी अर्थ को स्पष्ट, स्वाभाविक ढंग से व्यक्त करता है कि संसार की समस्त सामग्री परमेश्वर की है।
theological_decisions:
- issue: बलिदान के प्रसंग में परमेश्वर की आत्मनिर्भरता
  choice: पद को ऐसे अलंकारिक, काल्पनिक कथन के रूप में रखा गया है जो दिखाता है कि परमेश्वर मनुष्यों से भोजन पाने पर निर्भर नहीं है।
  alternative: 'अधिक शब्दानुगामी भावी वाचन: ‘यदि मैं भूखा होऊँगा, तो तुझसे नहीं कहूँगा।’'
  rationale: निकटवर्ती प्रसंग में परमेश्वर इस धारणा का खंडन करते हैं कि बलिदान उनकी किसी आवश्यकता को पूरा करते हैं। अनुवाद इस आशय को सुरक्षित रखता है, पर पाठ से परे कोई दार्शनिक शब्दावली नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक रूप से संक्षिप्त रखी गई है। ‘तो’ हिन्दी में शर्त और परिणाम का संबंध स्पष्ट करता है, यद्यपि उसका पृथक शब्द मूल में नहीं है।
