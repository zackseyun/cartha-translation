  choice: क्योंकि तू
  rationale: संयोजक וְ यहाँ पिछले प्रश्न का कारण या स्पष्टीकरण दे सकता है, जबकि व्यक्त सर्वनाम אַתָּה सीधे और बलपूर्ण एकवचन संबोधन को बनाए रखता है।
