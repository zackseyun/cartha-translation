- source_word: וַתַּשְׁלֵךְ
  choice: फेंक देता है
  rationale: यह चयन इब्रानी क्रिया की ठोस और तीखी छवि को बनाए रखता है तथा प्रसंग में बार-बार या जानबूझकर किए जाने वाले तिरस्कार को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: דְּבָרַי
