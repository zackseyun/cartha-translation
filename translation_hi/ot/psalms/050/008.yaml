  text: I do not rebuke you for your sacrifices[a]; your burnt offerings are continually before me.
translation:
  language: hi
  text: मैं तेरे बलिदानों के विषय में तुझे नहीं डाँटता[a]; तेरी होमबलियाँ निरन्तर मेरे सामने रहती हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं तेरे बलिदानों के कारण तुझे नहीं डाँटता।”
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא עַל זְבָחֶיךָ
  choice: तेरे बलिदानों के कारण नहीं
  rationale: निषेध के साथ עַל यहाँ डाँटने के आधार या कारण को व्यक्त करता है; यह वाक्य बलिदानों की अनुपस्थिति को दोष नहीं ठहराता।
- source_word: אוֹכִיחֶךָ
  choice: मैं ... तुझे नहीं डाँटता
  rationale: יכח के हिफ़ील रूप का यहाँ अर्थ दोष दिखाना या फटकारना है। ‘डाँटना’ आधुनिक और सहज है, जबकि पादटिप्पणी अधिक औपचारिक विकल्प सुरक्षित रखती है।
- source_word: זְבָחֶיךָ
  choice: तेरे बलिदान
  rationale: זֶבַח बलिदान के लिए व्यापक उपासना-संबंधी शब्द है; अनावश्यक रूप से किसी खास प्रकार का बलिदान निर्दिष्ट नहीं किया गया।
- source_word: וְעוֹלֹתֶיךָ
  choice: तेरी होमबलियाँ तो
  rationale: עוֹלָה पूर्णतः वेदी पर जलाए जाने वाले विशिष्ट बलिदान का पारंपरिक और सटीक हिन्दी पद ‘होमबलि’ है। ‘तो’ इब्रानी वाक्य के दूसरे खंड में निहित प्रतिपक्ष को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: לְנֶגְדִּי תָמִיד
  choice: निरन्तर मेरे सामने रहती हैं
  rationale: לְנֶגְדִּי उपस्थिति या दृष्टि में होने को और תָמִיד नियमित निरंतरता को व्यक्त करता है; जोड़ी गई क्रिया हिन्दी में स्वाभाविक वाक्य पूरा करती है।
theological_decisions:
- issue: इस पद का इस्राएल की बलिदान-व्यवस्था से संबंध
  choice: परमेश्वर यह नहीं कहता कि बलिदान अपने-आप में अनुचित हैं; वह कहता है कि उसकी डाँट का कारण बलिदानों की कमी नहीं है।
  alternative: यह पद बलिदान को पूरी तरह अस्वीकार करता है।
  rationale: दूसरा खंड कहता है कि होमबलियाँ निरन्तर परमेश्वर के सामने हैं। इसलिए संदर्भ में समस्या अनुष्ठान की अनुपस्थिति नहीं, बल्कि आगे वर्णित उपासना और जीवन की गहरी समस्या है।
translation_notes:
  register: आधुनिक मानक हिन्दी में एकवचन निकट संबोधन ‘तू/तेरा’ रखा गया है, क्योंकि इब्रानी प्रत्यय एकवचन पुल्लिंग हैं और परमेश्वर वाचा-समुदाय को प्रत्यक्ष रूप से संबोधित कर रहा है। भाषा सरल किन्तु गरिमापूर्ण है; तकनीकी उपासना-पद के रूप में ‘होमबलि’ सुरक्षित रखा गया है।
