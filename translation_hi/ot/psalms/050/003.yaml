source:
  edition: WLC
  text: יָ֤בֹ֥א אֱלֹהֵ֗י/נוּ וְֽ/אַל יֶ֫חֱרַ֥שׁ אֵשׁ לְ/פָנָ֥י/ו תֹּאכֵ֑ל וּ֝/סְבִיבָ֗י/ו נִשְׂעֲרָ֥ה מְאֹֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/003.yaml
  text: Our God comes and does not keep silent[a]; a fire devours before him[b], and around him it storms violently.
translation:
  language: hi
  text: हमारा परमेश्वर आता है और मौन नहीं रहता[a]। उसके आगे आग भस्म करती है, और उसके चारों ओर प्रचण्ड तूफ़ान उठता है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “हमारा परमेश्वर आएगा और मौन नहीं रहेगा।” इस काव्यात्मक प्रसंग में इब्रानी अपूर्ण क्रियाएँ भविष्य का बोध भी करा सकती हैं।
    reason: alternative_reading
  - marker: b
    text: या “उसके चारों ओर बहुत प्रचण्ड तूफ़ानी हलचल होती है” या “उसके चारों ओर अत्यन्त प्रबल आँधी चलती है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: יָבֹא
  choice: आता है
  rationale: यह क़ाल अपूर्ण रूप काव्य में वर्तमान या भविष्य का बोध करा सकता है। यहाँ वर्तमान काल परमेश्वर के प्रकट होने का जीवंत और तात्कालिक चित्र बनाए रखता है; भविष्य अर्थ को पादटिप्पणी में रखा गया है।
- source_word: אֱלֹהֵינוּ
  choice: हमारा परमेश्वर
  rationale: प्रथम पुरुष बहुवचन प्रत्यय सहित इस पद का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: וְאַל יֶחֱרַשׁ
  choice: और मौन नहीं रहता
  rationale: חרשׁ का अर्थ चुप या मौन रहना है। यद्यपि אַל प्रायः निषेधात्मक इच्छा या आज्ञा व्यक्त करता है, यहाँ काव्यात्मक प्रवाह में इसे परमेश्वर के आगमन के साथ जुड़ा कथन समझना स्वाभाविक है।
- source_word: אֵשׁ לְפָנָיו תֹאכֵל
  choice: उसके आगे आग भस्म करती जाती है
  rationale: לְפָנָיו की स्थानगत छवि को 'उसके आगे' से और आग के विषय में אכל की भस्म करने वाली क्रिया को सजीव हिन्दी में व्यक्त किया गया है। 'करती जाती है' आग की आगे बढ़ती, निरंतर क्रिया का काव्यात्मक प्रभाव देता है।
- source_word: וּסְבִיבָיו
  choice: और उसके चारों ओर
  rationale: मूल स्थानगत वाक्यांश का स्पष्ट और स्वाभाविक हिन्दी अनुवाद।
- source_word: נִשְׂעֲרָה מְאֹד
  choice: प्रचण्ड तूफ़ान उठता है
  rationale: निफ़अल क्रिया तूफ़ानी उथल-पुथल या प्रबल झंझा का भाव देती है और מְאֹד उसकी तीव्रता बढ़ाता है। हिन्दी में 'प्रचण्ड तूफ़ान उठता है' इस दृश्य को स्वाभाविक रूप से व्यक्त करता है, यद्यपि मूल में 'तूफ़ान' अलग संज्ञा के रूप में नहीं है।
theological_decisions:
- issue: न्याय के प्रसंग में परमेश्वर का प्रकट होना
  choice: परमेश्वर के आगमन, आग और तूफ़ान की प्रत्यक्ष काव्यात्मक छवि बनाए रखी गई है।
  alternative: इसे अंतिम न्याय या किसी विशिष्ट मसीही भविष्यवाणी के रूप में स्पष्ट करना।
  rationale: इब्रानी पद स्वयं किसी बाद की धर्मवैज्ञानिक पहचान को स्पष्ट नहीं करता; इसलिए अनुवाद मूल की गंभीरता और तनाव को सुरक्षित रखता है, पर उसमें कोई सांप्रदायिक व्याख्या नहीं जोड़ता।
- issue: וְאַל יֶחֱרַשׁ का कथन या कामनार्थक निषेध
  choice: कथन के रूप में 'मौन नहीं रहता'।
  alternative: कामना या आग्रह के रूप में 'वह मौन न रहे'।
  rationale: पूर्ववर्ती अपूर्ण क्रिया के साथ यह पाठ परमेश्वर के आगमन का जीवंत वर्णन बनाता है। फिर भी इब्रानी אַל के सामान्य निषेधात्मक प्रयोग के कारण वैकल्पिक व्याकरणिक समझ संभव है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, काव्यात्मक और सामान्य पाठक के लिए स्पष्ट रूप अपनाया गया है। 'मौन' तथा 'भस्म' जैसे परिचित साहित्यिक शब्द भजन की गंभीरता बनाए रखते हैं; वाक्यरचना को अत्यधिक संस्कृतनिष्ठ नहीं बनाया गया।
