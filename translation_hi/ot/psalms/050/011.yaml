source:
  edition: WLC
  text: יָ֭דַעְתִּי כָּל ע֣וֹף הָרִ֑ים וְ/זִ֥יז שָׂ֝דַ֗י עִמָּדִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/011.yaml
  text: I know every bird of the mountains[b][a], and the creatures of the field are with me.
translation:
  language: hi
  text: मैं पहाड़ों के हर पक्षी को जानता हूँ, और मैदान के जीव-जंतु[a] मेरे साथ हैं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘मैदान में विचरने वाले प्राणी’ अथवा ‘मैदान के जंगली पशु’; यहाँ प्रयुक्त इब्रानी शब्द זִיז का अर्थ अनिश्चित है।
    reason: lexical_alternative
  - marker: b
    text: या ‘मेरे हैं’; इब्रानी में अधिक शाब्दिक रूप से ‘मेरे साथ हैं।’
    reason: alternative_reading
lexical_decisions:
- source_word: יָדַעְתִּי
  choice: मैं ... जानता हूँ
  rationale: यह पूर्ण क्रिया यहाँ स्थायी अवस्था और परमेश्वर के व्यापक ज्ञान को व्यक्त करती है; इसलिए हिन्दी में वर्तमान काल स्वाभाविक है।
- source_word: כָּל עוֹף הָרִים
  choice: पहाड़ों के हर पक्षी
  rationale: एकवचन सामूहिक संज्ञा के साथ כָּל का वितरणात्मक भाव ‘हर’ से स्पष्ट होता है; עוֹף के लिए प्रसंगानुकूल सामान्य शब्द ‘पक्षी’ चुना गया है।
- source_word: זִיז שָׂדַי
  choice: मैदान के जीव-जंतु
  rationale: זִיז एक कठिन और अनिश्चित शब्द है, जो संभवतः खुले क्षेत्र में विचरने वाले प्राणियों को दर्शाता है। ‘जीव-जंतु’ अर्थ को व्यापक रखता है और किसी विशेष प्रजाति का अनावश्यक निर्धारण नहीं करता।
- source_word: עִמָּדִי
  choice: मेरे साथ हैं
  rationale: यह इब्रानी पद का निकट और स्वाभाविक हिन्दी रूप है। प्रसंग में स्वामित्व का भाव निहित हो सकता है, पर उसे मुख्य पाठ में स्पष्ट रूप से जोड़ना उचित नहीं।
theological_decisions:
- issue: עִמָּדִי में परमेश्वर के स्वामित्व का निहितार्थ
  choice: मेरे साथ हैं
  alternative: मेरे हैं
  rationale: इब्रानी पाठ सीधे ‘मेरे’ नहीं, बल्कि ‘मेरे साथ’ कहता है। इस रूप से सृष्टि पर परमेश्वर के अधिकार का संभावित निहितार्थ बना रहता है, पर पाठ की वास्तविक अभिव्यक्ति से आगे नहीं बढ़ा जाता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण काव्यात्मक गद्य। ‘जीव-जंतु’ कठिन इब्रानी शब्द की व्यापकता और अनिश्चितता को बनाए रखता है; सभी पाद-टिप्पणी चिह्न मुख्य पाठ में दिए गए हैं।
