lexical_decisions:
- source_word: פִּיךָ
  choice: अपने मुँह को
  rationale: शरीर-अंग के मूल बिंब और ‘जीभ’ के साथ काव्यात्मक समानांतरता को बनाए रखता है; यहाँ ‘मुँह’ वाणी का द्योतक है।
- source_word: שָׁלַחְתָּ
  choice: खुला छोड़ देता है
  rationale: मूल क्रिया का अर्थ ‘भेजना/छोड़ देना’ है; मुँह के संदर्भ में यह बुरी बातें कहने के लिए उसे बेलगाम छोड़ने का भाव व्यक्त करती है।
- source_word: בְרָעָה
  choice: बुराई के लिए
  rationale: पूर्वसर्ग दिशा, प्रयोजन अथवा क्षेत्र का भाव दे सकता है। यह अनुवाद नैतिक अर्थ और मूल की संक्षिप्तता बनाए रखता है।
- source_word: וּלְשׁוֹנְךָ
  choice: और अपनी जीभ को
  rationale: ‘मुँह’ के साथ मूल काव्यात्मक समानांतरता और वाणी का सजीव बिंब सुरक्षित रहता है।
- source_word: תַּצְמִיד
  choice: जोड़े रखता है
  rationale: हिफ़ील रूप किसी वस्तु को जोड़ने, लगाकर रखने या चिपकाने का भाव देता है। यह अनुवाद जीभ और छल के निरंतर संबंध का बिंब बनाए रखता है।
- source_word: מִרְמָה
  choice: छल
  rationale: यह कपटपूर्ण और धोखा देने वाली वाणी के लिए स्वाभाविक, व्यापक और काव्यात्मक हिन्दी शब्द है।
