  source_fidelity: The draft preserves the parallel images of ‘mouth’ and ‘tongue’ and renders מִרְמָה appropriately as ‘छल.’ However, ‘मुँह को ... खुला छोड़ देता है’ is less direct than the Hebrew idiom, and ‘जीभ को छल से जोड़े रखता है’ is syntactically heavy in Hindi and can suggest a continuing state more strongly than the verbal action.
  naturalness: The current wording is understandable but somewhat literal and awkward in modern Hindi. ‘बुराई के लिए अपना मुँह खोल देता है’ is idiomatic while retaining the Hebrew bodily image. ‘तेरी जीभ छल रचती है’ is a natural poetic rendering of the second colon in context.
  terminology: ‘बुराई’ and ‘छल’ are suitable, dignified, and nonsectarian. The singular direct address ‘तू/तेरी’ appropriately maintains the psalm’s rebuking register.
  issues:
