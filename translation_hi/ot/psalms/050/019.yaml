    issue: The phrase ‘अपने मुँह को बुराई के लिए खुला छोड़ देता है’ is unnatural and slightly diffuse in Hindi.
    rationale: Hindi normally expresses this speech idiom as opening one’s mouth for evil, rather than leaving one’s mouth open. The revision retains the source image and moral direction.
  - severity: medium
    issue: ‘अपनी जीभ को छल से जोड़े रखता है’ is overly mechanical and may overstate durative ‘keeping’ language.
    rationale: The Hebrew verb denotes attaching/aligning with deceit, and in this speech context naturally conveys producing or fashioning deceit. ‘तेरी जीभ छल रचती है’ communicates the poetic sense idiomatically; the alternative footnote preserves the more literal attachment sense.
