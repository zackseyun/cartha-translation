  yaml_path: translation/ot/psalms/050/018.yaml
  text: If you saw a thief[a], you were pleased with him[b], and your portion was with adulterers.
translation:
  language: hi
  text: 'यदि[a] तू किसी चोर को देखता, तो उससे प्रसन्न होता[b],

    और व्यभिचारियों के साथ तेरा हिस्सा होता[c]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘जब’। इब्रानी शब्द शर्त भी व्यक्त कर सकता है और किसी प्रसंग या बार-बार होने वाली स्थिति को भी सामने रख सकता है।
    reason: source_ambiguity
  - marker: b
    text: अर्थात तू उसे पसंद या स्वीकार करता था; इब्रानी क्रिया अनुकूलता, प्रसन्नता या स्वीकृति व्यक्त कर सकती है।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से ‘तेरा हिस्सा व्यभिचारियों के साथ होता’; यह उनके साथ अपना पक्ष या सहभागिता रखने का रूपक है।
    reason: idiom_clarification
lexical_decisions:
- source_word: אִם
  choice: जब
  rationale: यह अव्यय सामान्यतः ‘यदि’ भी हो सकता है, पर यहाँ आरोप में बार-बार होने वाले आचरण का प्रसंग प्रस्तुत करता है; इसलिए मुख्य पाठ में ‘जब’ स्वाभाविक है और ‘यदि’ को पादटिप्पणी में रखा गया है।
- source_word: רָאִיתָ
  choice: तू ... देखता
  rationale: क़ाल पूर्ण, द्वितीय पुरुष एकवचन पुल्लिंग है। प्रसंगगत अभ्यस्त आरोप को स्वाभाविक हिन्दी में व्यक्त करने के लिए ‘देखता’ चुना गया है।
- source_word: גַנָּב
  choice: किसी चोर को
  rationale: शब्द का सीधा अर्थ चोरी करने वाला व्यक्ति है; ‘चोर’ आधुनिक हिन्दी में सटीक और सहज है।
- source_word: וַתִּרֶץ
  choice: तो उससे प्रसन्न होता था
  rationale: רצה का मूल भाव प्रसन्न होना, अनुग्रह करना या स्वीकार करना है। यह अनुवाद चोर के प्रति अनुकूल स्वीकृति का भाव रखता है, बिना उसे केवल संगति या सक्रिय सहभागिता तक सीमित किए।
- source_word: עִמּוֹ
  choice: उससे
  rationale: עִם और तृतीय पुरुष प्रत्यय का संबंधपरक भाव हिन्दी में ‘उससे’ के द्वारा स्वाभाविक रूप से व्यक्त होता है।
- source_word: מְנָאֲפִים
  choice: व्यभिचारियों
  rationale: संज्ञा के रूप में प्रयुक्त बहुवचन कृदंत उन लोगों को दर्शाता है जो व्यभिचार करते हैं; ‘व्यभिचारी’ संक्षिप्त और सटीक है।
- source_word: חֶלְקֶךָ
  choice: तेरा हिस्सा था
  rationale: חלק का अर्थ हिस्सा, भाग या अंश है। मूल रूपक को बनाए रखते हुए ‘हिस्सा’ यहाँ उनके साथ पक्ष, संगति या सहभागिता होने का संकेत देता है।
