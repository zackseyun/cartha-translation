id: PSA.50.5
reference: Psalms 50:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אִסְפוּ לִ֥/י חֲסִידָ֑/י כֹּרְתֵ֖י בְרִיתִ֣/י עֲלֵי זָֽבַח־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/005.yaml
  text: Gather to me my faithful ones[a], those who make my covenant by sacrifice.
translation:
  language: hi
  text: '“मेरे प्रति निष्ठावान लोगों को मेरे पास इकट्ठा करो,

    जो बलिदान के द्वारा मेरे साथ वाचा बाँधते हैं।”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी में शाब्दिक रूप से: “जो बलिदान पर/के ऊपर मेरी वाचा काटते हैं।” ‘वाचा काटना’ वाचा बाँधने का इब्रानी मुहावरा है।'
    reason: शाब्दिक मुहावरे और עֲלֵי के संभावित ‘पर/के ऊपर’ अर्थ को सुरक्षित रखना।
lexical_decisions:
- source_word: אִסְפוּ
  choice: इकट्ठा करो
  rationale: यह אסף का बहुवचन पुल्लिंग आज्ञार्थक रूप है। ‘इकट्ठा करो’ आधुनिक हिन्दी में स्वाभाविक है और आज्ञा का बल बनाए रखता है।
- source_word: לִי
  choice: मेरे पास
  rationale: לִי का अर्थ ‘मेरे लिए’ या ‘मेरे पास’ हो सकता है। इस सभा-बुलावे के प्रसंग में ‘मेरे पास’ परमेश्वर की उपस्थिति में एकत्र होने का भाव स्पष्ट करता है।
- source_word: חֲסִידָי
  choice: मेरे प्रति निष्ठावान लोग
  rationale: חסיד वाचा के संबंध में भक्ति, निष्ठा और वफादारी का बोध कराता है। ‘मेरे प्रति निष्ठावान लोग’ संबंधपरक भाव को स्पष्ट रखता है और ‘सन्त’ जैसे बाद के पारिभाषिक अर्थों से बचता है।
- source_word: כֹּרְתֵי
  choice: बाँधते हैं
  rationale: כרת + ברית का शाब्दिक मुहावरा ‘वाचा काटना’ है। हिन्दी में ‘वाचा बाँधना’ स्वाभाविक, गरिमापूर्ण और अर्थ-सन्निकट मुहावरा है; शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: בְרִיתִי
  choice: मेरे साथ वाचा
  rationale: प्रत्यययुक्त ברית का शाब्दिक अर्थ ‘मेरी वाचा’ है। हिन्दी में वाचा के पक्षकार से संबंध व्यक्त करने के लिए ‘मेरे साथ वाचा’ अधिक स्वाभाविक है, बिना मूल संबंध को बदलने के।
- source_word: עֲלֵי זָבַח
  choice: बलिदान के द्वारा
  rationale: यह पदबंध बलिदानी अनुष्ठान से जुड़ी वाचा-स्थापना बताता है। ‘के द्वारा’ साधन अथवा अनुष्ठानिक माध्यम का भाव सहज हिन्दी में व्यक्त करता है; ‘बलिदान पर’ अधिक शाब्दिक किंतु अस्पष्ट है।
theological_decisions:
- issue: वाचा के प्रसंग में חֲסִידָי का अर्थ
  choice: मेरे प्रति निष्ठावान लोग
  alternative: मेरे पवित्र लोग / मेरे भक्त
  rationale: यह चयन परमेश्वर के प्रति वाचा-संबंधी निष्ठा को सामने रखता है और बाद की धार्मिक पारिभाषिकता को अनावश्यक रूप से पाठ में नहीं लाता।
- issue: वाचा काटने के इब्रानी मुहावरे का अनुवाद
  choice: मेरे साथ वाचा बाँधते हैं
  alternative: मेरी वाचा काटते हैं
  rationale: ‘वाचा बाँधना’ हिन्दी का स्पष्ट और स्वाभाविक मुहावरा है, जबकि मूल के ठोस ‘काटने’ वाले बिंब को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: עֲלֵי זָבַח में संबंध का प्रकार
  choice: बलिदान के द्वारा
  alternative: बलिदान पर / बलिदान के साथ
  rationale: पूर्वसर्ग बलिदान से अनुष्ठानिक संबंध को व्यक्त करता है। ‘के द्वारा’ संभावित साधनात्मक अर्थ को स्पष्ट करता है, जबकि पादटिप्पणी मूल की व्यापकता बनाए रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य। ‘वाचा’ मूल की धर्मवैधानिक और संबंधपरक गहराई बनाए रखता है।
