  yaml_path: translation/ot/psalms/050/000.yaml
  text: A psalm of Asaph. God[a], God, Yahweh, has spoken and called the earth from the rising of the sun to its setting.
translation:
  language: hi
  text: 'आसाफ का एक भजन।


    ईश्वर[a], परमेश्वर, यहोवा बोला है और

    सूर्योदय से सूर्यास्त तक

    पृथ्वी को पुकारा है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा “ईश्वर, ईश्वर, यहोवा”; आरंभ में आए ईश्वरीय नामों और उपाधियों को कुछ लोग अलग ढंग से जोड़ते हैं, जैसे “देवताओं का परमेश्वर, यहोवा।”
    reason: alternative_reading
lexical_decisions:
- source_word: מִזְמוֹר לְאָסָף
  choice: आसाफ का एक भजन
  rationale: यह स्वाभाविक हिन्दी में शीर्षक का संबंध आसाफ से जोड़ता है, जबकि इब्रानी לְ की रचना, लेखकत्व या संबद्धता के बीच, स्वयं अधिक विस्तार से निश्चित नहीं करती।
- source_word: אֵל אֱלֹהִים יְהוָה
  choice: ईश्वर, परमेश्वर, यहोवा
  rationale: तीनों इब्रानी ईश्वरीय पदों को क्रमशः अलग रखते हुए אֵל और אֱלֹהִים के लिए प्रचलित हिन्दी पर्याय तथा יהוה के लिए व्यक्तिवाचक नाम ‘यहोवा’ रखा गया है। पदों के आपसी व्याकरणिक संबंध की वास्तविक अस्पष्टता फुटनोट में सुरक्षित है।
- source_word: מִמִּזְרַח שֶׁמֶשׁ עַד מְבֹאוֹ
  choice: सूर्योदय से सूर्यास्त तक
  rationale: शाब्दिक रूप से सूर्य के उदय से उसके अस्त होने तक; यह वर्तमान हिन्दी में उसी व्यापक भौगोलिक अर्थ को सहजता से व्यक्त करता है।
- source_word: וַיִּקְרָא אָרֶץ
  choice: पृथ्वी को पुकारा है
  rationale: קרא के प्रत्यक्ष संबोधन और אָרֶץ को कर्म के रूप में सुरक्षित रखा गया है; इसे केवल ‘समूची पृथ्वी को इकट्ठा किया’ जैसे अधिक व्याख्यात्मक अर्थ में नहीं बदला गया।
theological_decisions:
- issue: आरंभिक ईश्वरीय पदों का संबंध
  choice: 'तीन संबोधनों/उपाधियों को समानांतर रूप में रखा गया: ‘ईश्वर, परमेश्वर, यहोवा’'
  alternative: ‘देवताओं का परमेश्वर यहोवा’ या ‘ईश्वर, ईश्वर, यहोवा’
  rationale: इब्रानी אֵל אֱלֹהִים יְהוָה को कई प्रकार से समझा जा सकता है। मुख्य पाठ पदों का क्रम और तनाव बनाए रखता है तथा किसी एक धर्मवैज्ञानिक विश्लेषण को निर्णायक नहीं बनाता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सार्वजनिक पाठ के अनुकूल काव्यात्मक पंक्तियाँ रखी गई हैं। ‘यहोवा’ को नाम के रूप में रखा गया है और स्रोत की पुनरुक्ति तथा अस्पष्टता को सरल बनाकर हटाया नहीं गया।
