base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/010.yaml
  text: For every wild animal of the forest is mine[b][a], the cattle on a thousand hills.
translation:
  language: hi
  text: 'क्योंकि वन का हर जीव मेरा है,

    और एक हजार पहाड़ों के पशु भी।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “एक हजार पहाड़ियों पर के पशु।” हिब्रू “पशु” बड़े पशुओं या मवेशियों के लिए भी प्रयुक्त हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पद पिछले कथन का कारण बताता है; हिंदी में ‘क्योंकि’ इस संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: לִי
  choice: मेरा है
  rationale: यह संबंधसूचक रूप स्वामित्व व्यक्त करता है; हिंदी में ‘मेरा है’ स्पष्ट और सहज है।
- source_word: כָל חַיְתוֹ יָעַר
  choice: वन का हर जीव
  rationale: एकवचन सामूहिक संज्ञा के साथ כָל का वितरणात्मक भाव ‘हर’ से आता है। חַיָּה यहाँ वन्य जीव को सूचित करती है, पर ‘जीव’ काव्यात्मक और व्यापक शब्द है।
- source_word: בְּהֵמוֹת
  choice: पशु
  rationale: यह शब्द बड़े स्थलचर पशुओं, विशेषतः पालतू या चरने वाले पशुओं, के लिए प्रयुक्त हो सकता है। ‘पशु’ मूल की व्यापकता को ‘मवेशी’ से बेहतर बचाता है।
- source_word: בְּהַרְרֵי אָלֶף
  choice: हजारों पहाड़ों के
  rationale: शाब्दिक संरचना ‘एक हजार पहाड़ों पर/के’ है। हिंदी की काव्यात्मक अभिव्यक्ति ‘हजारों पहाड़ों के’ विपुलता का स्वाभाविक बोध कराती है; शाब्दिक विकल्प पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: परमेश्वर के स्वामित्व की व्यापकता
  choice: वन के जीवों और पहाड़ों के पशुओं की समानांतर छवियों द्वारा व्यापक दैवी स्वामित्व व्यक्त किया गया है।
  alternative: ठीक एक हजार पहाड़ों पर स्थित पशुओं की गणनात्मक सीमा
  rationale: काव्य में ‘हजार’ विपुलता का चित्र प्रस्तुत करता है; अनुवाद दैवी स्वामित्व की व्यापकता रखता है, बिना संख्या के धर्मवैज्ञानिक अर्थ को अत्यधिक निश्चित किए।
- issue: दो पदांशों का संबंध
  choice: ‘और ... भी’ से समानांतर समन्वय
  alternative: दूसरे पदांश को पहले का समानाधिकरण मानना
  rationale: हिब्रू में स्पष्ट संयोजक नहीं है और संबंध कुछ हद तक अस्पष्ट है। हिंदी में अल्पविराम मात्र से दूसरा पदांश पहले की पुनर्व्याख्या लग सकता है; ‘और ... भी’ काव्यात्मक समानांतरता और दो पूरक पशु-समूहों को स्पष्ट करता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और काव्यात्मक हिंदी। पहली पंक्ति में ‘वन का हर जीव’ सहज है; दूसरी में ‘और ... भी’ निहित स्वामित्व को स्पष्ट करता है।
