  terminology: ‘प्रजा’ suitably renders the collective covenantal ‘my people’; ‘परमेश्वर’ is an appropriate established rendering for אֱלֹהִים here. ‘गवाही दूँगा’ preserves the judicial-testimonial force. The footnote's alternative is understandable, though ‘साक्षी दूँगा’ more directly represents the alternative ‘witness/testify.’
