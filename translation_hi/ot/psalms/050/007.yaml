  yaml_path: translation/ot/psalms/050/007.yaml
  text: 'Hear[a], my people, and I will speak; O Israel, and I will testify against you: I am God, your God.'
translation:
  language: hi
  text: 'हे मेरी प्रजा, सुनो, और मैं बोलूँगा; हे इस्राएल, मैं तेरे विरुद्ध गवाही दूँगा[a]: मैं परमेश्वर, तेरा परमेश्वर हूँ।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं तेरे विरुद्ध साक्षी दूँगा।” इब्रानी क्रिया में कानूनी गवाही देने का भाव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעָה
  choice: सुनो
  rationale: आज्ञार्थक रूप ध्यानपूर्वक सुनने का आह्वान करता है। ‘सुनो’ आधुनिक हिन्दी में स्वाभाविक है और वाचा-संबंधी तथा न्यायिक गंभीरता बनाए रखता है।
- source_word: עַמִּי
  choice: मेरी प्रजा
  rationale: प्रथम पुरुष एकवचन प्रत्यय सहित यह वाचा-संबंधी संबोधन है। ‘मेरी प्रजा’ सामूहिक और राजकीय-वाचा संबंधी भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וַאֲדַבֵּרָה
  choice: और मैं बोलूँगा
  rationale: आज्ञा के बाद आया प्रथम पुरुष cohortative बोलने के दृढ़ संकल्प और क्रम को दर्शाता है; भविष्यत् रूप हिन्दी में इसे सहजता से व्यक्त करता है।
- source_word: יִשְׂרָאֵל
  choice: हे इस्राएल
  rationale: यह प्रत्यक्ष संबोधन है; ‘हे’ उसके संबोधनात्मक और गंभीर स्वर को स्पष्ट करता है।
- source_word: וְאָעִידָה בָּךְ
  choice: मैं तुम्हारे विरुद्ध गवाही दूँगा
  rationale: העיד का हिफ़ील रूप यहाँ कानूनी-साक्ष्य संबंधी अर्थ रखता है। בְּ के साथ द्वितीय पुरुष प्रत्यय प्रसंग में विरोधी दिशा, अर्थात ‘तुम्हारे विरुद्ध’, व्यक्त करता है।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: रूप की दृष्टि से बहुवचन होते हुए भी यहाँ अर्थ और वाक्यगत प्रयोग एकवचन है तथा वक्ता स्वयं परमेश्वर है।
- source_word: אֱלֹהֶיךָ
  choice: तुम्हारा परमेश्वर
  rationale: द्वितीय पुरुष एकवचन प्रत्यय वाचा-संबंधी व्यक्तिगत दावे को व्यक्त करता है; हिन्दी में ‘तुम्हारा परमेश्वर’ इसे सीधे सुरक्षित रखता है।
- source_word: אָנֹכִי
  choice: मैं ... हूँ
  rationale: स्वतंत्र सर्वनाम आत्म-पहचान पर बल देता है। हिन्दी के निर्क्रिय वाक्य में ‘हूँ’ जोड़ना स्वाभाविक है और बलयुक्त घोषणा को बनाए रखता है।
theological_decisions:
- issue: אֱלֹהִים אֱלֹהֶיךָ אָנֹכִי में परमेश्वर की बलयुक्त आत्म-पहचान
  choice: मैं परमेश्वर हूँ, तुम्हारा परमेश्वर
  alternative: परमेश्वर, तुम्हारा परमेश्वर, मैं हूँ
  rationale: चुना हुआ रूप आधुनिक हिन्दी में स्पष्ट और गरिमापूर्ण है। यह परमेश्वर होने की घोषणा और इस्राएल के साथ वाचा-संबंधी दावे—दोनों को सुरक्षित रखता है, बिना अतिरिक्त धर्मवैज्ञानिक शब्दावली जोड़े।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सार्वजनिक घोषणा-जैसा स्वर रखा गया है। ‘हे’ दोनों संबोधनों की गंभीरता स्पष्ट करता है; ‘प्रजा’ सामूहिक वाचा-संबंधी पहचान व्यक्त करती है।
