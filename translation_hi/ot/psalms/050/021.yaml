source:
  edition: WLC
  text: אֵ֤לֶּה עָשִׂ֨יתָ וְֽ/הֶחֱרַ֗שְׁתִּי דִּמִּ֗יתָ הֱֽיוֹת אֶֽהְיֶ֥ה כָמ֑וֹ/ךָ אוֹכִיחֲ/ךָ֖ וְ/אֶֽעֶרְכָ֣ה לְ/עֵינֶֽי/ךָ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/021.yaml
  text: You did these things[a], and I kept silent; you thought that I was altogether like you[b]. I will rebuke you and set the case before your eyes.
translation:
  language: hi
  text: 'तुमने ये बातें कीं, और मैं चुप रहा;

    तुमने समझा कि मैं तुम्हारे जैसा हूँ।[a]

    पर मैं तुम्हें फटकारूँगा

    और उन्हें तुम्हारी आँखों के सामने क्रम से रखूँगा।[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुमने कल्पना की कि मैं तुम्हारे जैसा होऊँगा।” हिब्रू रचना इस गलत धारणा को थोड़े अलग कालगत रूप में व्यक्त करने की गुंजाइश देती है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “और तुम्हारी आँखों के सामने क्रम से रखूँगा।” हिब्रू में यह नहीं बताया गया कि क्या क्रम से रखा जाएगा; संदर्भ में ये बातें या इनके संबंध में आरोप अभिप्रेत हो सकते हैं।
    reason: implicit_object
lexical_decisions:
- source_word: אֵלֶּה עָשִׂיתָ
  choice: तुमने ये सब काम किए
  rationale: बहुवचन संकेतवाचक אֵלֶּה पिछली आयतों में बताए अपराधों की ओर लौटता है। ‘ये सब काम’ आधुनिक हिन्दी में इस संदर्भसूचक बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: וְהֶחֱרַשְׁתִּי
  choice: और मैं चुप रहा
  rationale: क्रिया यहाँ परमेश्वर के कुछ समय तक मौन रहने को व्यक्त करती है। ‘चुप रहा’ सरल, स्वाभाविक और मूल के निकट है; यह अपने आप मौन को सहमति नहीं ठहराता।
- source_word: דִּמִּיתָ
  choice: तुमने समझा
  rationale: यहाँ דמה का अर्थ मन में मान लेना या अनुमान करना है। ‘समझा’ उस गलत धारणा को स्पष्ट और सहज हिन्दी में व्यक्त करता है।
- source_word: הֱיוֹת אֶהְיֶה כָמוֹךָ
  choice: कि मैं भी बिल्कुल तुम्हारे जैसा हूँ
  rationale: यह पदबंध वक्ता के बारे में अपराधी की गलत धारणा का विषय बताता है। ‘बिल्कुल’ हिब्रू की जोरदार पुनरुक्ति का स्वाभाविक हिन्दी प्रतिनिधित्व है, जबकि कालगत अस्पष्टता को पादटिप्पणी में रखा गया है।
- source_word: אוֹכִיחֲךָ
  choice: मैं तुम्हें डाँटूँगा
  rationale: יכח के हिफ़ील रूप में यहाँ दोष दिखाने और फटकारने का न्यायिक-नैतिक भाव है। ‘डाँटूँगा’ सामान्य पाठक के लिए स्पष्ट है और ‘दोषी ठहराऊँगा’ की अपेक्षा कम व्याख्यात्मक है।
- source_word: וְאֶעֶרְכָה לְעֵינֶיךָ
  choice: तुम्हारे सामने सब कुछ क्रम से रख दूँगा
  rationale: ערך का मूल भाव व्यवस्थित करना या क्रम से सामने रखना है। हिब्रू में कर्म व्यक्त नहीं है; ‘सब कुछ’ संदर्भगत आरोपों/कामों को संकेत करता है, और इस पूर्ति को पादटिप्पणी में स्पष्ट किया गया है।
theological_decisions:
- issue: परमेश्वर का मौन और उसके बाद की फटकार
  choice: मौन को अस्थायी चुप्पी के रूप में और अगले वाक्य को स्पष्ट फटकार के रूप में रखा गया है।
  alternative: मौन को सीधे ‘धैर्य’ या ‘सहमति न देना’ कहकर समझाया जा सकता था।
  rationale: मूल पाठ केवल कहता है कि परमेश्वर चुप रहा; उसका आशय अगले खंड से स्पष्ट होता है। इसलिए अनुवाद में मौन की धार्मिक व्याख्या जोड़ने के बजाय तनाव को बनाए रखा गया है।
- issue: הֱיוֹת אֶהְיֶה की कालगत अभिव्यक्ति
  choice: ‘कि मैं भी बिल्कुल तुम्हारे जैसा हूँ’
  alternative: ‘कि मैं तुम्हारे जैसा होऊँगा’ या ‘कि मैं तुम्हारे जैसा ही बना रहूँगा’
  rationale: हिब्रू रचना को वर्तमान दशा या अपेक्षित व्यवहार की धारणा के रूप में व्यक्त किया जा सकता है। मुख्य पाठ में स्वाभाविक हिन्दी चुनी गई है और वैकल्पिक कालगत अभिव्यक्ति पादटिप्पणी में दी गई है।
- issue: וְאֶעֶרְכָה का निहित कर्म
  choice: ‘सब कुछ’ जोड़कर अपराधों/आरोपों को सामने क्रम से रखने का भाव व्यक्त किया गया है।
  alternative: ‘और तुम्हारी आँखों के सामने क्रम लगाऊँगा,’ जिसमें कर्म अनकहा रहता।
  rationale: हिन्दी में बिना कर्म के वाक्य अस्वाभाविक और अस्पष्ट होता। ‘सब कुछ’ संदर्भ को खुला रखता है और इसे केवल औपचारिक न्याय-मुकदमे तक सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। काव्यात्मक पंक्ति-विन्यास बनाए रखते हुए अत्यधिक संस्कृतनिष्ठ ‘ताड़ना दूँगा’ या विधिक ‘अभियोग प्रस्तुत करूँगा’ से बचा गया है। ‘तुम’ मूल के एकवचन संबोधन को स्वाभाविक हिन्दी में बनाए रखता है।
