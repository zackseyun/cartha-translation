  text: The sea is his[a], for he made it[b], and his hands formed the dry land.
translation:
  language: hi
  text: समुद्र उसका है[a], क्योंकि उसने उसे बनाया[b], और सूखी भूमि को उसके हाथों ने आकार दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “समुद्र उसी का है।” इब्रानी में शाब्दिक रचना है, “जिसका समुद्र है।”
    reason: lexical_alternative
  - marker: b
    text: या, “और उसने उसे बनाया”; इब्रानी संयोजक का औपचारिक अर्थ “और” है, यद्यपि यहाँ वह संभवतः कारण-संबंध व्यक्त करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר לוֹ
  choice: उसी का है
  rationale: यह संबंधवाचक रचना לְ के साथ स्वामित्व व्यक्त करती है—शाब्दिक रूप से, ‘जो/जिसका समुद्र उसके लिए है।’ आधुनिक हिन्दी में ‘समुद्र उसी का है’ संक्षिप्त, स्वाभाविक और बलयुक्त है।
- source_word: הַיָּם
  choice: समुद्र
  rationale: यह इब्रानी संज्ञा का सामान्य और सीधा अर्थ है; ‘महासागर’ यहाँ अनावश्यक रूप से विशिष्ट होगा।
- source_word: וְהוּא
  choice: क्योंकि उसी ने
  rationale: וְ का औपचारिक अर्थ ‘और’ है, पर यहाँ समुद्र के परमेश्वर का होने और उसके द्वारा बनाए जाने के बीच कारण-संबंध सबसे स्वाभाविक है। ‘उसी’ इब्रानी सर्वनाम הוּא के बल को भी व्यक्त करता है।
- source_word: עָשָׂהוּ
  choice: उसे बनाया
  rationale: क्रिया עשה का यहाँ सामान्य अर्थ ‘बनाना’ है; पुल्लिंग एकवचन प्रत्यय का पूर्वपद ‘समुद्र’ है, जिसे हिन्दी में ‘उसे’ से स्वाभाविक रूप से व्यक्त किया गया है।
- source_word: וְיַבֶּשֶׁת
  choice: और सूखी भूमि को
  rationale: יַבֶּשֶׁת समुद्र के विपरीत सूखी भूमि को दर्शाता है। ‘सूखी भूमि’ यह विरोध स्पष्ट और स्रोत के निकट रखता है।
- source_word: יָדָיו
  choice: उसके हाथों ने
  rationale: बहुवचन ‘हाथों’ को बनाए रखने से परमेश्वर के सृजन-कार्य का मूल काव्यात्मक, मानवरूपी चित्र सुरक्षित रहता है।
- source_word: יָצָרוּ
  choice: आकार दिया
  rationale: יצר किसी वस्तु को सोच-समझकर गढ़ने या रूप देने का भाव रखता है। ‘आकार दिया’ सहज हिन्दी है और पहले आए ‘बनाया’ से मूल की क्रियात्मक भिन्नता भी बनाए रखता है।
theological_decisions:
- issue: परमेश्वर के कार्य के लिए मानवरूपी भाषा
  choice: ‘उसके हाथों ने आकार दिया’ को बनाए रखा
  alternative: ‘उसने आकार दिया’ अथवा ‘उसकी सामर्थ्य ने आकार दिया’
  rationale: मूल पाठ स्पष्ट रूप से परमेश्वर के ‘हाथों’ को कर्ता बनाता है। इस काव्यात्मक चित्र को हटाना या ‘सामर्थ्य’ में बदलना पाठ की व्याख्यात्मक सपाटीकरण होगा।
- issue: सृष्टि की क्रियाओं עשה और יצר के बीच भिन्नता
  choice: ‘बनाया’ और ‘आकार दिया’—दो अलग क्रियाएँ
  alternative: दोनों स्थानों पर ‘बनाया’
  rationale: दो भिन्न हिन्दी क्रियाएँ मूल की शब्द-विविधता और समानांतर काव्य-रचना को सुरक्षित रखती हैं, बिना उनसे कोई अतिरिक्त धर्मवैज्ञानिक भेद निष्कर्षित किए।
- issue: וְ द्वारा व्यक्त संबंध
  choice: कारणसूचक ‘क्योंकि’
  alternative: योगसूचक ‘और’
  rationale: संदर्भ में समुद्र का उसका होना इस बात से समर्थित है कि उसने उसे बनाया। फिर भी इब्रानी संयोजक का औपचारिक अर्थ ‘और’ है, इसलिए विकल्प को पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, काव्यात्मक किंतु साधारण पाठक के लिए स्पष्ट रखी गई है। ‘उसी’ से इब्रानी सर्वनाम का बल उभरता है; ‘हाथों’ का मानवरूपी चित्र ज्यों का त्यों रखा गया है।
