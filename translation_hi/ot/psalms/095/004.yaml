  text: in whose hand are the depths of the earth[b][a], and the heights of the mountains are his.
translation:
  language: hi
  text: जिसके हाथ में पृथ्वी की गहराइयाँ हैं, और पहाड़ों की ऊँचाइयाँ भी उसी की हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲשֶׁר בְּיָדוֹ
  choice: उसके हाथ में हैं
  rationale: सम्बन्धवाचक उपवाक्य पिछले पद में उल्लिखित यहोवा की ओर संकेत करता है। ‘उसके हाथ में’ स्वामित्व और प्रभुत्व के ठोस इब्रानी बिम्ब को बनाए रखता है।
- source_word: מֶחְקְרֵי
  choice: गहराइयाँ
  rationale: यह शब्द उन गहरे अथवा दुर्गम स्थानों को सूचित करता है जिन्हें खोजना कठिन है। पर्वतों की ऊँचाइयों के समानांतर ‘गहराइयाँ’ स्वाभाविक काव्यात्मक विरोध प्रस्तुत करता है।
- source_word: אָרֶץ
  choice: पृथ्वी की
  rationale: सृष्टि-विषयक व्यापक सन्दर्भ में ‘पृथ्वी’ क्षेत्रविशेष के अर्थ वाले ‘देश’ या ‘भूमि’ से अधिक उपयुक्त है।
- source_word: וְתוֹעֲפוֹת הָרִים
  choice: और पहाड़ों की ऊँचाइयाँ
  rationale: यह अभिव्यक्ति पर्वतों के ऊँचे भागों या शिखरों को दर्शाती है। ‘ऊँचाइयाँ’ पहले चरण की ‘गहराइयाँ’ के साथ मूल का काव्यात्मक विरोध सुरक्षित रखती है।
- source_word: לוֹ
  choice: भी उसी की हैं
  rationale: यह संक्षिप्त रूप इब्रानी के स्वामित्व-बोध को बनाए रखता है; ‘भी’ पद के दोनों समानांतर भागों को स्वाभाविक हिन्दी में जोड़ता है।
theological_decisions:
- issue: सृष्टि पर परमेश्वर के स्वामित्व का विस्तार
  choice: पृथ्वी की गहराइयों से लेकर पहाड़ों की ऊँचाइयों तक समस्त सृष्टि पर यहोवा के सार्वभौम स्वामित्व का कथन
  alternative: इस्राएल देश और उसके भूभाग का सीमित, स्थानीय उल्लेख
  rationale: आसपास के भजन में आराधना का व्यापक आह्वान और गहराइयों तथा ऊँचाइयों का युग्म इसे किसी एक क्षेत्र के बजाय समस्त सृष्टि पर प्रभुता का कथन बनाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और काव्यात्मक शैली रखी गई है। ‘हाथ में’ के मूल बिम्ब और ‘गहराइयाँ/ऊँचाइयाँ’ के समानांतर विरोध को सुरक्षित रखा गया है।
