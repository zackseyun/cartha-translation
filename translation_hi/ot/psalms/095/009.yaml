translation:
  language: hi
  text: जहाँ तुम्हारे पुरखों ने मुझे परखा और जाँचा[a], हालाँकि वे मेरा काम देख चुके थे।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘मुझे परीक्षा में डाला और जाँचा।’ दोनों इब्रानी क्रियाएँ किसी को कसौटी पर रखने या उससे प्रमाण माँगने का भाव रखती हैं।
    reason: lexical_alternative
  - marker: b
    text: 'अधिक शाब्दिक रूप में: ‘जहाँ तुम्हारे पुरखों ने मुझे परखा; उन्होंने मुझे जाँचा और मेरा काम भी देखा।’ इब्रानी वाक्य का अर्थ रियायती रूप में भी समझा जा सकता है, जैसा मुख्य पाठ में है।'
    reason: genuine_ambiguity
lexical_decisions:
- source_word: אֲשֶׁר
  choice: जहाँ
  rationale: यह संबंधवाचक शब्द पिछले पद में बताए गए स्थान की ओर संकेत करता है; इसलिए स्थानवाचक ‘जहाँ’ प्रसंग के प्रवाह के अनुकूल है।
- source_word: נִסּוּנִי
  choice: मुझे परखा
  rationale: נסה का अर्थ किसी को कसौटी पर रखना या परखना है। ‘मुझे परखा’ स्वाभाविक हिंदी में विरोधपूर्ण परीक्षण का भाव बनाए रखता है।
- source_word: אֲבוֹתֵיכֶם
  choice: तुम्हारे पुरखाओं
  rationale: इब्रानी शब्द का शाब्दिक अर्थ ‘तुम्हारे पिताओं’ है और यहाँ पूर्वज पीढ़ी अभिप्रेत है। ‘पुरखाओं’ से पुरुषवाचक ऐतिहासिक संदर्भ और आधुनिक हिंदी की स्वाभाविकता दोनों बनी रहती हैं।
- source_word: בְּחָנוּנִי
  choice: मेरी जाँच की
  rationale: בחן का अर्थ जाँचना या प्रमाण माँगते हुए परखना है। पहले क्रियापद के साथ समानांतरता रखते हुए ‘मेरी जाँच की’ अनावश्यक शब्द-पुनरावृत्ति से बचाता है।
- source_word: גַּם
  choice: हालाँकि
  rationale: גם सामान्यतः ‘भी’ या ‘यहाँ तक कि’ है, पर इस प्रसंग में पहले परमेश्वर का काम देख चुकने के बावजूद उसे परखने का विरोधाभास है; ‘हालाँकि’ उस संभावित रियायती संबंध को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: רָאוּ
  choice: देख चुके थे
  rationale: पूर्ण क्रिया को पूर्वपूर्ण रूप में रखने से स्पष्ट होता है कि परमेश्वर का काम देखना उसे परखने से पहले हो चुका था।
- source_word: פָעֳלִי
  choice: मेरा काम
  rationale: פעל यहाँ परमेश्वर के कार्य या किए हुए सामर्थी काम का सामूहिक एकवचन है; ‘मेरा काम’ मूल के एकवचन को निकटता से रखता है।
theological_decisions:
- issue: अंतिम उपवाक्य का रियायती या संयोजक अर्थ
  choice: हालाँकि वे मेरा काम देख चुके थे
  alternative: उन्होंने मेरी जाँच की और मेरा काम भी देखा
  rationale: גם का अधिक शाब्दिक अर्थ ‘भी’ हो सकता है, किंतु प्रसंग में चेतावनी का बल इस बात पर है कि पुरखाओं ने परमेश्वर के काम देखने के बावजूद उसे परखा। मुख्य पाठ संभावित रियायती अर्थ देता है और पादटिप्पणी अधिक शाब्दिक विकल्प सुरक्षित रखती है।
- issue: אֲבוֹתֵיכֶם का संबोधन
  choice: तुम्हारे पुरखाओं
  alternative: तुम्हारे पूर्वजों / तुम्हारे पिताओं
  rationale: ‘पुरखा’ पुरुषवाचक मूल और ऐतिहासिक पीढ़ी के संदर्भ को बनाए रखते हुए सामान्य आधुनिक हिंदी में सहज है।
translation_notes:
  register: भाषा आधुनिक, काव्यात्मक और गरिमापूर्ण रखी गई है। ‘पुरखाओं’ सामान्य पाठक के लिए सहज है; दो समानांतर क्रियाओं के लिए ‘परखा’ और ‘जाँच की’ चुने गए हैं। अंतिम उपवाक्य की वास्तविक इब्रानी अस्पष्टता पादटिप्पणी में सुरक्षित है।
