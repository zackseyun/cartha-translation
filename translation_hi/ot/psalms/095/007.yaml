  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּ֘י ה֤וּא אֱלֹהֵ֗י/נוּ וַ/אֲנַ֤חְנוּ עַ֣ם מַ֭רְעִית/וֹ וְ/צֹ֣אן יָד֑/וֹ הַ֝/יּ֗וֹם אִֽם בְּ/קֹל֥/וֹ תִשְׁמָֽעוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/095/007.yaml
  text: For he is our God[a], and we are the people of his pasture, and the sheep of his hand. Today, if you hear his voice—
translation:
  language: hi
  text: क्योंकि वही हमारा परमेश्वर है, और हम उसकी चराई की प्रजा और उसके हाथ की भेड़ें हैं। आज, यदि तुम उसकी वाणी सुनो—[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “आज, काश तुम उसकी वाणी सुनते!” इब्रानी अव्यय साधारण शर्त के बजाय इच्छासूचक आग्रह भी प्रस्तुत कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले पदों में आराधना के आह्वान का आधार बताता है; हिंदी में ‘क्योंकि’ इस कारणसूचक संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֱלֹהֵינוּ
  choice: हमारा परमेश्वर
  rationale: प्रत्यय सहित पद का सीधा और प्रचलित वाचा-संबंधी अनुवाद।
- source_word: עַם מַרְעִיתוֹ
  choice: उसकी चराई की प्रजा
  rationale: मूल की चरवाहे और चरागाह की ठोस उपमा को बनाए रखता है, साथ ही आधुनिक हिंदी में बोधगम्य है।
- source_word: צֹאן יָדוֹ
  choice: उसके हाथ की भेड़ें
  rationale: शाब्दिक संबंध और समानांतर रचना को सुरक्षित रखता है; ‘हाथ’ मार्गदर्शन, संरक्षण और अधिकार की छवि को खुला छोड़ता है।
- source_word: הַיּוֹם
  choice: आज
  rationale: स्वाभाविक हिंदी रूप और अगले चेतावनी-खंड की महत्वपूर्ण आलंकारिक कड़ी।
- source_word: אִם
  choice: यदि
  rationale: अगले पद में आने वाली आज्ञा से जुड़ी शर्तात्मक-प्रेरक भूमिका को व्यक्त करता है; इच्छासूचक संभावना पादटिप्पणी में रखी गई है।
- source_word: בְּקֹלוֹ תִשְׁמָעוּ
  choice: तुम उसकी वाणी सुनो
  rationale: שׁמע के ‘सुनना’ अर्थ को सामने रखता है और ध्यान देने या आज्ञा मानने की निहित भावना को संदर्भ पर छोड़ता है।
theological_decisions:
- issue: अंतिम वाक्यांश הַיּוֹם אִם בְּקֹלוֹ תִשְׁמָעוּ का बल
  choice: 'शर्तात्मक-प्रेरक आरंभ: ‘आज, यदि तुम उसकी वाणी सुनो—’'
  alternative: 'इच्छासूचक आग्रह: ‘आज, काश तुम उसकी वाणी सुनते!’'
  rationale: אִם सामान्यतः शर्त प्रस्तुत कर सकता है, पर काव्यात्मक आग्रह में इच्छा भी व्यक्त कर सकता है। भजन के प्रवाह में यह अगले पद की चेतावनी की भूमिका बनता है; फिर भी इच्छासूचक संभावना को निर्णायक रूप से हटाया नहीं गया है।
translation_notes:
  register: आधुनिक मानक हिंदी, गरिमापूर्ण और सामान्य पाठक के लिए सहज। ‘परमेश्वर’, ‘प्रजा’, ‘चराई’ और ‘वाणी’ बाइबलीय काव्य-रजिस्टर बनाए रखते हैं। अगले पद तक जारी वाक्य को दिखाने के लिए अंत में दीर्घ डैश रखा गया है।
