  text: Do not harden your hearts as at Meribah[d][c][b][a], as on the day at Massah in the wilderness.
translation:
  language: hi
  text: अपने हृदयों को कठोर न करो, मरीबा के समय की तरह, मरुभूमि में मस्सा के दिन की तरह।[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘मरीबा’ का अर्थ ‘झगड़ा’ या ‘विवाद’ है।
    reason: lexical_alternative
  - marker: b
    text: ‘मस्सा’ का अर्थ ‘परीक्षा’ या ‘परख’ है।
    reason: lexical_alternative
  - marker: c
    text: यहाँ संकेतित मरुभूमि की घटनाओं के लिए निर्गमन 17:7 और गिनती 20:13 देखें।
    reason: cross_reference
lexical_decisions:
- source_word: אַל תַּקְשׁוּ
  choice: कठोर न करो
  rationale: निषेधात्मक אַל के साथ हिफ़िल क्रिया का सीधा और स्वाभाविक हिन्दी निषेध; ‘हृदय’ के साथ स्रोत का रूपक सुरक्षित रहता है।
- source_word: לְבַבְכֶם
  choice: अपने हृदयों को
  rationale: प्रत्यय बहुवचन समुदाय को संबोधित करता है। हिन्दी में ‘अपने हृदयों’ प्रत्येक संबोधित व्यक्ति के हृदय को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: כִּמְרִיבָה
  choice: जैसा मरीबा में हुआ था
  rationale: मरीबा को ऐतिहासिक स्थान-नाम मानते हुए तुलना को हिन्दी में पूर्ण और सहज बनाया गया है; नाम के शब्दार्थ को पादटिप्पणी में रखा गया है।
- source_word: כְּיוֹם מַסָּה
  choice: जैसा ... मस्सा के दिन हुआ था
  rationale: शाब्दिक रूप ‘मस्सा के दिन के समान’ है। हिन्दी वाक्य में घटना-संबंधी तुलना स्पष्ट करने के लिए ‘हुआ था’ जोड़ा गया है, बिना घटना का स्वरूप निर्धारित किए।
- source_word: בַּמִּדְבָּר
  choice: जंगल में
  rationale: निर्गमन-कालीन निर्जन प्रदेश के लिए ‘जंगल’ आधुनिक हिन्दी बाइबलीय प्रयोग में सहज है और केवल रेतीले ‘रेगिस्तान’ तक अर्थ को सीमित नहीं करता।
theological_decisions:
- issue: מְרִיבָה और מַסָּה को सामान्य संज्ञाएँ माना जाए या ऐतिहासिक नाम
  choice: दोनों को स्थान/घटना से जुड़े नामों—‘मरीबा’ और ‘मस्सा’—के रूप में रखा गया है।
  alternative: ‘झगड़े के समान’ और ‘परीक्षा के दिन के समान’
  rationale: निर्गमन 17:7 से स्पष्ट ऐतिहासिक संकेत सुरक्षित रहता है, जबकि नामों के अर्थ पादटिप्पणियों में बताए जाते हैं; इससे मुख्य पाठ में व्याख्यात्मक अर्थ आरोपित नहीं होता।
- issue: כְּיוֹם מַסָּה में मस्सा के साथ संबंध
  choice: ‘मस्सा के दिन’
  alternative: ‘मस्सा में उस दिन’
  rationale: हिब्रू में ‘दिन’ और ‘मस्सा’ के बीच कोई व्यक्त पूर्वसर्ग नहीं है; ‘मस्सा के दिन’ संरचना की वास्तविक अस्पष्टता को अधिक निकटता से सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट और सामुदायिक संबोधन। ‘हृदयों को कठोर न करो’ मूल रूपक को बनाए रखता है। दोनों ऐतिहासिक नाम प्रचलित हिन्दी लिप्यंतरण में रखे गए हैं; उनकी व्युत्पत्तिगत अर्थछटा पादटिप्पणियों में दी गई है।
