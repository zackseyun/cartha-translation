source:
  edition: WLC
  text: כִּ֤י אֵ֣ל גָּד֣וֹל יְהוָ֑ה וּ/מֶ֥לֶךְ גָּ֝ד֗וֹל עַל כָּל אֱלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/095/003.yaml
  text: For Yahweh is a great God[a], and a great King above all gods.
translation:
  language: hi
  text: 'क्योंकि यहोवा महान परमेश्वर है,

    और सब देवताओं से ऊपर महान राजा है।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सब दिव्य प्राणियों से ऊपर।” इब्रानी אֱלֹהִים का अर्थ प्रसंग के अनुसार देवता, दिव्य प्राणी या स्वर्गीय प्राणी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पद पहले दिए गए आराधना के आह्वान का कारण बताता है; ‘क्योंकि’ कारणसूचक अर्थ को स्वाभाविक हिन्दी में स्पष्ट रखता है।
- source_word: אֵל
  choice: परमेश्वर
  rationale: यहाँ यह शब्द यहोवा के ईश्वरत्व को सीधे व्यक्त करता है; आधुनिक हिन्दी में ‘परमेश्वर’ गरिमापूर्ण और सहज है।
- source_word: גָּדוֹל
  choice: महान
  rationale: यह महानता और सर्वोच्च प्रतिष्ठा व्यक्त करता है; दोनों पंक्तियों में ‘महान’ की पुनरावृत्ति मूल समानांतरता को बनाए रखती है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल में आए व्यक्तिगत दिव्य नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से प्रस्तुत किया गया है।
- source_word: וּמֶלֶךְ גָּדוֹל
  choice: और ... महान राजा
  rationale: संयोजक यहोवा के विषय में दूसरा समानांतर कथन जोड़ता है और विशेषण की पुनरावृत्ति बनाए रखता है।
- source_word: עַל כָּל אֱלֹהִים
  choice: सब देवताओं से ऊपर
  rationale: ‘से ऊपर’ तुलनात्मक श्रेष्ठता और प्रभुता व्यक्त करता है; ‘देवताओं’ मूल बहुवचन की संभावित अर्थगत व्यापकता को समय से पहले सीमित नहीं करता।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ के व्यक्तिगत दिव्य नाम को ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित नहीं किया गया। ‘यहोवा’ आधुनिक हिन्दी बाइबलीय प्रयोग में व्यापक रूप से पहचाना जाने वाला रूप है।
- issue: אֱלֹהִים का बहुवचन अर्थ
  choice: देवताओं
  alternative: दिव्य प्राणियों
  rationale: ‘देवताओं’ मूल कथन की वादात्मक शक्ति और अर्थगत तनाव को बनाए रखता है, बिना यह तय किए कि संकेत मूर्तियों, कथित देवताओं या वास्तविक आत्मिक प्राणियों की ओर है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। मूल की दो समानांतर पंक्तियाँ और ‘महान’ की पुनरावृत्ति सुरक्षित हैं।
