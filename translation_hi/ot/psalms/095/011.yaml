translation:
  language: hi
  text: इसलिए मैंने अपने क्रोध में शपथ खाई, “वे मेरे विश्राम में प्रवेश नहीं करेंगे।”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शब्दशः, “यदि वे मेरे विश्राम में प्रवेश करें”—यह शपथ की एक शैली है, जिसका अर्थ है, “वे मेरे विश्राम में प्रवेश नहीं करेंगे।”
    reason: lexical_alternative
  - marker: b
    text: या “मेरे विश्राम-स्थान में।”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  choice: इसलिए
  rationale: यह पद पिछले कथन के परिणाम को व्यक्त करता है; आधुनिक हिन्दी में ‘इसलिए’ उस संबंध को स्वाभाविक रूप से स्पष्ट करता है।
- source_word: נִשְׁבַּעְתִּי
  choice: मैंने ... शपथ खाई
  rationale: निफ़अल रूप का सीधा अर्थ शपथ खाना है; यह मानक और सहज हिन्दी अभिव्यक्ति है।
- source_word: בְאַפִּי
  choice: अपने क्रोध में
  rationale: אַף का मूल संबंध नाक से है, पर यहाँ यह मुहावरे के रूप में क्रोध को दर्शाता है।
- source_word: אִם
  choice: कभी ... न करेंगे
  rationale: शपथ के बाद אִם अधूरी शपथ-विधि में प्रबल निषेध व्यक्त करता है; हिन्दी में उसका आशय स्पष्ट करने के लिए निषेध आवश्यक है।
- source_word: יְבֹאוּן אֶל
  choice: प्रवेश न करेंगे
  rationale: בוא के साथ אֶל यहाँ किसी अवस्था या स्थान में आने का भाव देता है; ‘प्रवेश करना’ संक्षिप्त और स्वाभाविक है।
- source_word: מְנוּחָתִי
  choice: मेरे विश्राम
  rationale: ‘विश्राम’ अवस्था और विश्राम-स्थान—दोनों संभावित अर्थों की गुंजाइश बनाए रखता है और इब्रानी की संक्षिप्तता को सुरक्षित रखता है।
theological_decisions:
- issue: אִם वाली अधूरी शपथ-विधि
  choice: 'स्पष्ट निषेध: “वे ... कभी प्रवेश न करेंगे”'
  alternative: 'शब्दशः: “यदि वे मेरे विश्राम में प्रवेश करें”'
  rationale: इब्रानी शपथ-विधि में ‘यदि’ कथन के अनकहे दंड के कारण दृढ़ निषेध का काम करता है। स्पष्ट निषेध अर्थ बताता है, कोई नया धर्मवैज्ञानिक निष्कर्ष नहीं जोड़ता।
- issue: מְנוּחָה का अर्थ-क्षेत्र
  choice: मेरे विश्राम
  alternative: मेरे विश्राम-स्थान
  rationale: मूल शब्द विश्राम की अवस्था या विश्राम के स्थान, दोनों को सूचित कर सकता है। ‘विश्राम’ इस वास्तविक अस्पष्टता को अनावश्यक रूप से सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘शपथ खाई’ प्रचलित मानक हिन्दी है; ‘विश्राम’ मूल के अर्थगत विस्तार और धर्मवैज्ञानिक तनाव को बनाए रखता है।
