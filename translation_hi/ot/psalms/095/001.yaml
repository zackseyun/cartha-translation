  text: Come[a], let us sing for joy to Yahweh; let us shout aloud to the Rock of our salvation.
translation:
  language: hi
  text: 'आओ, हम याहवे[a] के लिए आनन्द से गाएँ;

    हमारे उद्धार की चट्टान का जयजयकार करें।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी: ‘याहवे।’ ईश्वरीय नाम יהוה का अनुवाद परम्परागत रूप से ‘प्रभु’ किया जाता रहा है।'
    reason: alternative_reading
lexical_decisions:
- source_word: לְכוּ
  choice: आओ
  rationale: הלך का बहुवचन आज्ञार्थक रूप यहाँ किसी स्थान पर जाने की आज्ञा नहीं, बल्कि सामूहिक आराधना का निमंत्रण है; इसलिए आधुनिक हिन्दी में ‘आओ’ स्वाभाविक है।
- source_word: נְרַנְּנָה
  choice: हम आनन्द से गाएँ
  rationale: רנן का सहोत्सर्गात्मक बहुवचन आनन्दपूर्ण, स्वरयुक्त स्तुति व्यक्त करता है। ‘आनन्द से गाएँ’ उसके गायन और उल्लास—दोनों पक्षों को बनाए रखता है।
- source_word: לַיהוָה
  choice: याहवे के लिए
  rationale: ל उपसर्ग स्तुति के संबोधित पात्र को दर्शाता है और יהוה को उसके व्यक्तिगत वाचा-नाम ‘याहवे’ के रूप में लिप्यंतरित किया गया है।
- source_word: נָרִיעָה
  choice: जयघोष करें
  rationale: रूप ऊँची, सार्वजनिक पुकार उठाने का सहोत्सर्गात्मक भाव रखता है, जो विजय अथवा आराधना के प्रसंग में प्रयुक्त होता है। ‘जयघोष करें’ हिन्दी में उसका सामूहिक और ऊँचा स्वर स्वाभाविक रूप से व्यक्त करता है।
- source_word: לְצוּר
  choice: चट्टान के लिए
  rationale: צוּר का ठोस रूपक ‘चट्टान’ के रूप में सुरक्षित रखा गया है; यह स्थिरता, सामर्थ्य और शरण का संकेत देता है।
- source_word: יִשְׁעֵנוּ
  choice: हमारे उद्धार की
  rationale: יֵשַׁע के साथ प्रथम पुरुष बहुवचन प्रत्यय को संज्ञात्मक रूप ‘हमारे उद्धार’ में रखा गया है, ताकि इसे केवल किसी एक प्रकार की छुड़ाई तक सीमित न किया जाए।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम सीधे आया है। ‘याहवे’ उसका लिप्यंतरण करके वाचा-नाम को सामान्य उपाधि में बदलने से बचाता है।
- issue: צוּר का ईश्वर-संबंधी रूपक
  choice: हमारे उद्धार की चट्टान
  alternative: वह चट्टान जो हमारा उद्धार करता है
  rationale: संज्ञात्मक संबंध और मूल रूपक दोनों को सुरक्षित रखा गया है; व्याख्यात्मक क्रियात्मक विकल्प मूल की काव्यात्मक व्यापकता को संकुचित कर देता।
translation_notes:
  register: भाषा आधुनिक, सामूहिक आराधना के अनुकूल और गरिमापूर्ण रखी गई है। दोनों सहोत्सर्गात्मक क्रियाओं को ‘हम … गाएँ/करें’ से व्यक्त किया गया है और ‘चट्टान’ का मूल काव्यात्मक रूपक सुरक्षित है।
