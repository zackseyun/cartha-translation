base_translation:
  language: en
  yaml_path: translation/ot/psalms/095/010.yaml
  text: For forty years I loathed that generation[a], and said, “They are a people who go astray in heart, and they have not known my ways.”
translation:
  language: hi
  text: चालीस वर्ष तक मैं उस पीढ़ी से घृणा करता रहा[a] और मैंने कहा, “ये ऐसे लोग हैं जिनका मन भटकता रहता है, और उन्होंने मेरे मार्गों को नहीं जाना।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं उस पीढ़ी के कारण दुःखी रहा” अथवा “मैं उस पीढ़ी से ऊब गया।” इब्रानी क्रिया घृणा, ऊब या दुःख का भाव व्यक्त कर सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אַרְבָּעִים שָׁנָה
  choice: चालीस वर्ष तक
  rationale: समयावधि को स्वाभाविक हिन्दी में स्पष्ट करता है और इब्रानी पदबंध की अग्रस्थिति बनाए रखता है।
- source_word: אָקוּט
  choice: मैं ... घृणा करता रहा
  rationale: क्रिया में वितृष्णा, ऊब या गहरे अप्रसन्न भाव का अर्थ हो सकता है। मुख्य पाठ में ‘घृणा’ प्रसंग की तीव्रता को व्यक्त करती है, जबकि अवधि के साथ ‘करता रहा’ निरंतरता दर्शाता है।
- source_word: בְּדוֹר
  choice: उस पीढ़ी से
  rationale: בְּ यहाँ भावात्मक रुख की क्रिया के साथ सम्बन्धसूचक है; ‘उस पीढ़ी से’ मरुभूमि की संदर्भित पीढ़ी को स्वाभाविक हिन्दी में बताता है।
- source_word: עַם תֹּעֵי לֵבָב הֵם
  choice: ये ऐसे लोग हैं जिनके मन भटकते रहते हैं
  rationale: תֹּעֵי की जारी या अभिलाक्षणिक भटकन और לֵבָב के भीतरी नैतिक-आत्मिक केंद्र—दोनों को सहज हिन्दी में सुरक्षित रखता है।
- source_word: וְהֵם לֹא יָדְעוּ דְרָכָי
  choice: और इन्होंने मेरे मार्गों को नहीं जाना
  rationale: ידע का मूल अर्थ ‘जानना’ और דְּרָכַי का रूपक ‘मेरे मार्ग’ बनाए रखे गए हैं। हिन्दी का पूर्ण पक्ष उनके अब तक के स्थायी असफल प्रत्युत्तर को व्यक्त कर सकता है।
- source_word: וָאֹמַר
  choice: और मैंने कहा
  rationale: दिव्य प्रतिक्रिया और उसके बाद के आकलन का सीधा क्रम बनाए रखता है।
theological_decisions:
- issue: קוט में व्यक्त परमेश्वर का भाव
  choice: तीव्र वितृष्णा या अप्रसन्नता—‘घृणा करता रहा’
  alternative: ‘उस पीढ़ी से दुःखी रहा’ अथवा ‘उससे ऊब गया’
  rationale: इब्रानी क्रिया दुःख से अधिक तीव्र वितृष्णा या ऊब भी व्यक्त करती है। मुख्य पाठ प्रसंग की कठोरता रखता है, और पादटिप्पणी वास्तविक अर्थ-परास बताती है।
- issue: לֹא יָדְעוּ דְרָכָי का पक्ष
  choice: ‘इन्होंने मेरे मार्गों को नहीं जाना’—स्थायी परिणामी विफलता
  alternative: ‘उन्होंने मेरे मार्गों को नहीं जाना’—साधारण भूतकाल
  rationale: इब्रानी पूर्ण क्रिया को हिन्दी में ऐसा रूप दिया गया है जो कथित लोगों की अब तक कायम विफलता को दर्शाता है, बिना ‘समझना’ जोड़कर ידע की व्याख्या सीमित किए।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण और सामान्य पाठकों के लिए सहज रूप। ‘पीढ़ी,’ ‘मन,’ और ‘मार्ग’ जैसे बाइबलीय रूपक सुरक्षित रखे गए हैं; वाक्य-विन्यास को हिन्दी में स्वाभाविक बनाया गया है।
