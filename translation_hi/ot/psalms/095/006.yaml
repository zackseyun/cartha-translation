  text: בֹּ֭אוּ נִשְׁתַּחֲוֶ֣ה וְ/נִכְרָ֑עָה נִ֝בְרְכָ֗ה לִֽ/פְנֵי יְהוָ֥ה עֹשֵֽׂ/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/095/006.yaml
  text: Come[a], let us bow down in worship and kneel; let us bless[b] before Yahweh, our Maker.
translation:
  language: hi
  text: आओ, हम दण्डवत् होकर आराधना करें और झुकें; हम यहवे, हमारे रचयिता, के सामने घुटने टेकें।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֹּאוּ
  choice: आओ
  rationale: बहुवचन आज्ञार्थक रूप पूरी उपासक सभा को आमंत्रित करता है; ‘आओ’ स्वाभाविक और गरिमापूर्ण हिन्दी आह्वान है।
- source_word: נִשְׁתַּחֲוֶה
  choice: हम दण्डवत् होकर आराधना करें
  rationale: यह क्रिया श्रद्धा और उपासना में नीचे झुकने अथवा दण्डवत् होने की शारीरिक क्रिया बताती है। इस अनुवाद में मुद्रा और आराधना—दोनों भाव सुरक्षित रहते हैं।
- source_word: וְנִכְרָעָה
  choice: और झुकें
  rationale: क्रिया घुटने मोड़ने या नीचे झुकने का भाव रखती है। अगले खंड के अधिक स्पष्ट ‘घुटने टेकें’ के साथ अनावश्यक पुनरुक्ति से बचते हुए ‘झुकें’ शारीरिक मुद्रा को बनाए रखता है।
- source_word: נִבְרְכָה
  choice: हम … घुटने टेकें
  rationale: WLC का स्वरांकन इसे ברך के ‘घुटने टेकना’ अर्थ वाले रूप के रूप में प्रस्तुत करता है। समानांतर शारीरिक मुद्राएँ और לִפְנֵי (‘के सामने’) भी इसी अर्थ का समर्थन करती हैं; यहाँ ‘आशीष दें’ उपयुक्त नहीं है।
- source_word: לִפְנֵי
  choice: के सामने
  rationale: यह यहवे की उपस्थिति में आदरपूर्वक झुकने का स्थान-संबंधी भाव स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יְהוָה
  choice: यहवे
  rationale: इब्रानी चतुरक्षरीय परमेश्वर-नाम को उपाधि से बदलने के बजाय हिन्दी में उसके प्रचलित निकट लिप्यंतरण से रखा गया है।
- source_word: עֹשֵׂנוּ
  choice: अपने रचयिता
  rationale: कर्तृवाचक कृदन्त और प्रथम पुरुष बहुवचन प्रत्यय का अर्थ ‘हमें बनानेवाला/हमारा रचयिता’ है। ‘अपने रचयिता’ पद के संबंध और सृष्टिकर्ता के भाव को सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: यहवे
  alternative: प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम सीधे आया है; ‘यहवे’ उसे उपाधि से प्रतिस्थापित किए बिना सुरक्षित रखता है।
- issue: נִבְרְכָה का अर्थ
  choice: घुटने टेकें
  alternative: आशीष दें / धन्य कहें
  rationale: मसोरेटी स्वरांकन, वाक्य-संरचना और निकटवर्ती शारीरिक मुद्राओं का समानांतर क्रम यहाँ ‘घुटने टेकना’ अर्थ का समर्थन करता है। अंग्रेज़ी परामर्श-पाठ का ‘bless’ मूल के इस रूप और प्रसंग से कम संगत है।
translation_notes:
  register: भाषा आधुनिक, सामूहिक उपासना के योग्य और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘दण्डवत् होकर आराधना करें’, ‘झुकें’ और ‘घुटने टेकें’ मूल में क्रमशः आई श्रद्धापूर्ण शारीरिक मुद्राओं को अलग-अलग बनाए रखते हैं।
