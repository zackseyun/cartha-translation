id: PSA.77.10
reference: Psalms 77:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וָ֭/אֹמַר חַלּ֣וֹתִ/י הִ֑יא שְׁ֝נ֗וֹת יְמִ֣ין עֶלְיֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/077/010.yaml
  text: 'Then I said[b][a], “This is my grief: the years of the right hand of the Most High.”'
translation:
  language: hi
  text: तब मैंने कहा, “यही मेरा दुःख है[a]—परमप्रधान के दाहिने हाथ के वर्ष।”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यही मेरी दुर्बलता है,” अथवा “यही मेरी बीमारी है।” यहाँ का इब्रानी शब्द कठिन है और पीड़ा, दुर्बलता या बीमारी का अर्थ दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “परमप्रधान के दाहिने हाथ का बदल जाना।” कुछ लोग यहाँ के इब्रानी शब्द को “वर्ष” के बजाय “बदलना” से जोड़कर समझते हैं कि परमप्रधान का दाहिना हाथ बदल गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: וָאֹמַר
  choice: तब मैंने कहा
  rationale: वाव-युक्त कथन-क्रिया क्रम में भजनकार के विचार का नया मोड़ दिखाती है; ‘तब मैंने कहा’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: חַלּוֹתִי
  choice: मेरा दुःख
  rationale: यह कठिन रूप पीड़ा, दुर्बलता या बीमारी का बोध करा सकता है। विलाप के संदर्भ में ‘मेरा दुःख’ सहज है, जबकि अन्य संभावनाएँ पाद-टिप्पणी में सुरक्षित हैं।
- source_word: הִיא
  choice: यही ... है
  rationale: स्त्रीलिंग सर्वनाम पूर्वोक्त दशा की ओर संकेत करता है। ‘यही ... है’ उस संकेत और बल दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: שְׁנוֹת
  choice: वर्ष
  rationale: रूप को सामान्य संज्ञा שָׁנָה, ‘वर्ष,’ से समझना सबसे सीधा है। ‘बदलना/परिवर्तन’ से संबंधित वैकल्पिक समझ पाद-टिप्पणी में दी गई है।
- source_word: יְמִין
  choice: दाहिना हाथ
  rationale: मूल काव्यात्मक बिंब को बनाए रखता है, जो सामर्थ्य और उद्धारकारी कार्य का संकेत दे सकता है।
- source_word: עֶלְיוֹן
  choice: परमप्रधान
  rationale: यह परमेश्वर की सर्वोच्चता दर्शाने वाली स्थापित और गरिमापूर्ण हिन्दी उपाधि है।
theological_decisions:
- issue: अत्यंत कठिन इब्रानी वाक्य की व्याख्या
  choice: मुख्य पाठ में भजनकार के वर्तमान दुःख को परमप्रधान के दाहिने हाथ के वर्षों से संबद्ध करते हुए अपेक्षाकृत शाब्दिक, खुला वाक्य रखा गया है।
  alternative: “तब मैंने कहा, ‘मेरा दुःख यही है कि परमप्रधान का दाहिना हाथ बदल गया है।’”
  rationale: חַלּוֹתִי और שְׁנוֹת दोनों की व्याख्या विवादित है। मुख्य पाठ किसी एक निहितार्थ को अनावश्यक रूप से निर्णायक नहीं बनाता, और महत्वपूर्ण विकल्प पाद-टिप्पणियों में सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक रखी गई है। मूल की असामान्य और तनावपूर्ण अभिव्यक्ति ‘परमप्रधान के दाहिने हाथ के वर्ष’ को स्पष्टार्थक विस्तार से नहीं बदला गया, ताकि वास्तविक अस्पष्टता बनी रहे।
