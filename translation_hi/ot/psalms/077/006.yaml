  yaml_path: translation/ot/psalms/077/006.yaml
  text: I remember my song in the night[a]; with my heart I meditate[d][c][b], and my spirit searches.
translation:
  language: hi
  text: रात में मैं अपना गीत[a] याद करता हूँ; मैं अपने हृदय में मनन[b] करता हूँ, और मेरी आत्मा[c] खोजती है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपनी धुन” अथवा “अपना संगीत।”
    reason: lexical_alternative
  - marker: b
    text: या “मन ही मन बातें करता हूँ”; इब्रानी क्रिया मनन करने या विचारपूर्वक बोलने—दोनों का भाव दे सकती है।
    reason: lexical_alternative
  - marker: c
    text: या “मेरा अंतर्मन”; यहाँ “आत्मा” भजनकार के भीतरी व्यक्तित्व को दर्शाती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶזְכְּרָה
  choice: मैं ... याद करता हूँ
  rationale: क़ाल अपूर्ण 1 एकवचन काव्य में भविष्य, संकल्प या वर्तमान भाव दे सकता है। यहाँ आत्मचिंतन की चलती हुई प्रक्रिया के कारण सामान्य वर्तमान स्वाभाविक है।
- source_word: נְגִינָתִי
  choice: अपना गीत
  rationale: נגינה गीत, धुन या वाद्य-संगीत को सूचित कर सकता है। ‘गीत’ आधुनिक हिन्दी में सहज है और काव्यात्मक संदर्भ के अनुकूल है; विकल्प पादटिप्पणी में रखे गए हैं।
- source_word: בַּלָּיְלָה
  choice: रात में
  rationale: यह इब्रानी पूर्वसर्गीय वाक्यांश का निकट और स्वाभाविक हिन्दी रूप है।
- source_word: עִם לְבָבִי
  choice: अपने हृदय में
  rationale: शाब्दिक अर्थ ‘अपने हृदय के साथ’ है, पर यहाँ आंतरिक विचार-विमर्श का भाव है। ‘अपने हृदय में’ हिन्दी में स्वाभाविक रहते हुए उसी अंतर्मुखी अर्थ को व्यक्त करता है।
- source_word: אָשִׂיחָה
  choice: मनन करता हूँ
  rationale: שׂיח विचार करने, मन ही मन बातें करने या बोलने का भाव दे सकता है। इस अंतर्मुखी समानांतरता में ‘मनन’ सबसे उपयुक्त है, जबकि अर्थ की व्यापकता पादटिप्पणी में सुरक्षित है।
- source_word: וַיְחַפֵּשׂ
  choice: खोजती रहती है
  rationale: פיעל रूप गहराई से खोजने या छानबीन करने का भाव देता है। हिन्दी में निरंतर वर्तमान इस पद की चिंतनशील प्रक्रिया को स्वाभाविक रूप से व्यक्त करता है और खोज के अनकहे विषय को अनकहा ही रखता है।
- source_word: רוּחִי
  choice: मेरी आत्मा
  rationale: רוּחַ यहाँ हवा या साँस नहीं, बल्कि भजनकार के भीतरी व्यक्तित्व को दर्शाता है। ‘आत्मा’ इब्रानी की व्यापक मानवीय भाषा को बनाए रखता है; संकुचित अर्थ से बचने के लिए विकल्प पादटिप्पणी में है।
theological_decisions:
- issue: רוּחִי का मानवशास्त्रीय अर्थ
  choice: मेरी आत्मा
  alternative: मेरा अंतर्मन / मेरा मन
  rationale: पाठ भजनकार के भीतर खोजने वाले पक्ष का वर्णन करता है और शरीर से अलग किसी सत्ता के विषय में स्पष्ट दार्शनिक दावा नहीं करता। ‘आत्मा’ मूल की व्यापकता बचाती है, और पादटिप्पणी संभावित संदर्भगत अर्थ स्पष्ट करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और काव्यात्मक रूप अपनाया गया है। ‘हृदय में मनन’ अंतर्मुखी भाव को स्वाभाविक बनाता है, जबकि पादटिप्पणियाँ मूल शब्दों की वास्तविक अर्थ-व्याप्ति सुरक्षित रखती हैं।
