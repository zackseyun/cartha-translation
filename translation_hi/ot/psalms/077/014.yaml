  yaml_path: translation/ot/psalms/077/014.yaml
  text: You are the God who works wonders[b][a]; you have made your strength known among the peoples.
translation:
  language: hi
  text: तू वह परमेश्वर है जो अद्भुत काम करता है; तूने जातियों के बीच अपना सामर्थ्य प्रकट किया है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָאֵל
  choice: वह परमेश्वर
  rationale: निश्चित उपपद के साथ यह पद परमेश्वर की विशिष्ट पहचान पर बल देता है; हिंदी में ‘तू ही वह परमेश्वर है’ इस बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: עֹשֵׂה פֶלֶא
  choice: जो अद्भुत काम करता है
  rationale: कृदंत परमेश्वर के चारित्रिक कार्य को दर्शाता है। एकवचन פֶלֶא यहाँ सामूहिक अर्थ रख सकता है; ‘अद्भुत काम’ सहज हिंदी में इस व्यापक भाव को बनाए रखता है।
- source_word: הוֹדַעְתָּ
  choice: तूने ... प्रकट किया है
  rationale: हिफ़ील रूप का अर्थ ‘जानने योग्य बनाना/प्रकट करना’ है; यह अनुवाद उसके कारणवाचक भाव को सुरक्षित रखता है।
- source_word: בָעַמִּים
  choice: देश-देश के लोगों के बीच
  rationale: עַמִּים का अर्थ ‘लोगों’ अथवा ‘जातियों/राष्ट्रों’ से हो सकता है। ‘देश-देश के लोगों’ से बहुसमुदायी विस्तार स्पष्ट होता है और आधुनिक राजनीतिक ‘राष्ट्र’ का अनावश्यक भार नहीं आता।
- source_word: עֻזֶּךָ
  choice: अपना सामर्थ्य
  rationale: עֹז शक्ति, सामर्थ्य या पराक्रम को व्यक्त करता है। ‘सामर्थ्य’ काव्यात्मक, गरिमापूर्ण और सामान्य हिंदी में स्पष्ट है।
theological_decisions:
- issue: בָעַמִּים में ईश्वरीय सामर्थ्य के प्रकट होने का दायरा
  choice: देश-देश के लोगों के बीच
  alternative: जातियों के बीच / लोगों के बीच / लोगों पर
  rationale: इब्रानी בְּ का स्थानीय अर्थ ‘के बीच’ यहाँ स्वाभाविक है और कथन को अनेक जनसमूहों तक विस्तृत रखता है, बिना किसी संकीर्ण धर्मवैचारिक अर्थ को आरोपित किए।
translation_notes:
  register: आधुनिक मानक हिंदी, काव्यात्मक किंतु सरल और गरिमापूर्ण। भजन की सीधी संबोधन-शैली के अनुरूप ‘तू/तूने’ रखा गया है।
