id: PSA.77.2
reference: Psalms 77:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: בְּ/י֥וֹם צָרָתִ/י֮ אֲדֹנָ֪/י דָּ֫רָ֥שְׁתִּי יָדִ֤/י לַ֣יְלָה נִ֭גְּרָה וְ/לֹ֣א תָפ֑וּג מֵאֲנָ֖ה הִנָּחֵ֣ם נַפְשִֽׁ/י׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/077/002.yaml
  text: In the day of my distress I sought the Lord[a]; my hand was stretched out in the night and did not grow numb; my soul refused to be comforted.
translation:
  language: hi
  text: अपने संकट के दिन मैंने प्रभु को खोजा; रात भर मेरा हाथ फैला रहा और ढीला न पड़ा[a]; मेरे प्राण ने सांत्वना स्वीकार न की।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “रात में मेरा हाथ बहता रहा और शिथिल न हुआ।” इब्रानी बिंब कठिन है; मुख्य पाठ इसे लगातार प्रार्थना में फैले हुए हाथ के रूप में समझता है।
    reason: נִגְּרָה के शाब्दिक ‘बहने/उंडेले जाने’ वाले बिंब और प्रसंगगत अर्थ—हाथ फैलाए रखने—दोनों को पाठक के सामने रखना।
lexical_decisions:
- source_word: בְּיוֹם צָרָתִי
  choice: अपने संकट के दिन
  rationale: कालवाचक प्रयोग और व्यक्तिगत संकट—दोनों को स्वाभाविक, काव्यात्मक हिन्दी में बनाए रखता है।
- source_word: אֲדֹנָי
  choice: प्रभु
  rationale: यहाँ परमेश्वर का नाम YHWH नहीं, बल्कि उपाधि אֲדֹנָי है; इसलिए इसे उपाधि के रूप में अनूदित किया गया है।
- source_word: דָּרָשְׁתִּי
  choice: मैंने ... खोजा
  rationale: परमेश्वर के संबंध में דרשׁ सहायता और उपस्थिति के लिए उन्हें खोजने का भाव व्यक्त करता है।
- source_word: יָדִי
  choice: मेरा हाथ
  rationale: इब्रानी में वचन एकवचन है, इसलिए उसे सुरक्षित रखा गया है।
- source_word: לַיְלָה נִגְּרָה
  choice: रात भर मेरा हाथ फैला रहा
  rationale: נגר का मूल बिंब बहने या उंडेले जाने का है, पर 'हाथ' के साथ प्रसंग निरंतर प्रार्थना में हाथ फैलाए रखने की ओर संकेत करता है; 'रात भर' हिन्दी में इसकी अवधि को स्वाभाविक रूप से व्यक्त करता है।
- source_word: וְלֹא תָפוּג
  choice: और ढीला न पड़ा
  rationale: פוג यहाँ शिथिल होने, रुकने या निर्बल पड़ने का भाव दे सकता है। यह अनुवाद हाथ के लगातार फैले रहने के बिंब के अनुकूल है।
- source_word: מֵאֲנָה הִנָּחֵם
  choice: सांत्वना स्वीकार न की
  rationale: מאן स्पष्ट अस्वीकृति और נחם सांत्वना पाने को व्यक्त करता है; हिन्दी में यह संयोजन संक्षिप्त और स्वाभाविक है।
- source_word: נַפְשִׁי
  choice: मेरे प्राण
  rationale: נפשׁ व्यक्ति के भीतरी जीवन या स्वयं व्यक्ति को सूचित कर सकता है। 'मेरे प्राण' विलाप की काव्यात्मक गरिमा और अंतर्मन की पीड़ा को बनाए रखता है।
theological_decisions:
- issue: אֲדֹנָי का अनुवाद
  choice: प्रभु
  alternative: स्वामी
  rationale: यह पदवी है, चतुरक्षरीय दिव्य नाम YHWH नहीं। 'प्रभु' आधुनिक हिन्दी बाइबलीय प्रयोग में स्वाभाविक और स्पष्ट पदवी है।
- issue: נַפְשִׁי का अर्थ
  choice: मेरे प्राण
  alternative: मैंने / मेरे मन ने
  rationale: मूल की काव्यात्मक देह-मन संबंधी भाषा को सुरक्षित रखा गया है, बिना 'प्राण' को मनुष्य के किसी विशिष्ट दार्शनिक या सांप्रदायिक घटक के रूप में परिभाषित किए।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। समानांतर काव्य-पंक्तियों को अर्धविरामों से जोड़ा गया है। 'मेरे प्राण' और 'हाथ फैला रहा' मूल की देहात्मक तथा भावात्मक कविता को बनाए रखते हैं।
