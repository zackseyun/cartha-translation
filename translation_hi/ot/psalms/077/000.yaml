  text: 'For the choir director: according to Jeduthun[d][c][b][a]. A psalm of Asaph.'
translation:
  language: hi
  text: 'संगीत-निर्देशक[a] के लिए: यदूतून के अनुसार[b]। आसाप का एक भजन[c]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मुख्य संगीतकार के लिए” अथवा “गायक-मंडली के निर्देशक के लिए।”
    reason: lexical_alternative
  - marker: b
    text: “यदूतून के अनुसार” किसी धुन, संगीत-शैली, प्रस्तुति-समूह, या यदूतून से संबद्ध परंपरा का संकेत हो सकता है।
    reason: cultural_note
  - marker: c
    text: या, “आसाप के लिए।” हिब्रू उपसर्ग लेखकत्व, संबंध, या समर्पण का संकेत कर सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: प्रधान संगीतकार के लिए
  rationale: भजन-शीर्षकों में यह रूप संगीत-प्रस्तुति का निर्देशन करने वाले व्यक्ति को सूचित करता है। यह हिंदी में स्वाभाविक है और केवल गायक-मंडली तक अर्थ को सीमित नहीं करता।
- source_word: עַל
  choice: के अनुसार
  rationale: संगीत-संबंधी शीर्षक में यह पद किसी धुन, शैली, प्रस्तुति-विधान या संबद्ध समूह की ओर संकेत कर सकता है; ‘के अनुसार’ मूल की अस्पष्टता को पर्याप्त रूप से बनाए रखता है।
- source_word: ידיתון
  choice: यदूतून
  rationale: यह व्यक्ति अथवा उससे संबद्ध संगीतकार-समूह का नाम है, इसलिए इसका लिप्यंतरण किया गया है।
- source_word: לְאָסָף
  choice: आसाप का
  rationale: यहाँ לְ संबंध, रचनाकारिता, समर्पण या संबद्धता जता सकता है। ‘आसाप का’ संक्षिप्त और पारंपरिक है, किंतु इसे निश्चित लेखकत्व तक सीमित नहीं समझना चाहिए।
- source_word: מִזְמוֹר
  choice: एक भजन
  rationale: यह तारवाद्य-संगत से जुड़े गीत की मानक विधागत संज्ञा है; हिंदी बाइबलीय प्रयोग में ‘भजन’ स्पष्ट और स्वाभाविक है।
theological_decisions:
- issue: לְאָסָף में लेखकत्व बनाम संबद्धता
  choice: आसाप का एक भजन
  alternative: आसाप के लिए एक भजन
  rationale: मूल उपसर्ग लेखकत्व, संबंध या समर्पण में से किसी को सूचित कर सकता है। मुख्य पाठ में स्वाभाविक हिंदी रखी गई है, जबकि पादटिप्पणी अस्पष्टता स्पष्ट करती है।
translation_notes:
  register: आधुनिक, संक्षिप्त और गरिमापूर्ण शीर्षक-शैली अपनाई गई है। ‘प्रधान संगीतकार’ लिंग-विशिष्ट अतिरिक्त शब्द जोड़े बिना कार्यगत अर्थ देता है। उपलब्ध व्यंजन-पाठ ידיתון की वर्तनी के अनुरूप ‘यदूतून’ रखा गया है।
