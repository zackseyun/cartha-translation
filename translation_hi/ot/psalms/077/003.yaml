  yaml_path: translation/ot/psalms/077/003.yaml
  text: I remember God[a], and I groan; I meditate, and my spirit grows faint[b]. Selah
translation:
  language: hi
  text: मैं परमेश्वर को स्मरण करता हूँ और कराहता हूँ; मैं मनन करता हूँ,[a] और मेरी आत्मा दुर्बल पड़ जाती है।[b] सेला
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं मन ही मन कहता हूँ” या “मैं अपनी व्यथा कहता हूँ।”
    reason: שיח का अर्थ मनन करना, मन ही मन बोलना, अथवा शिकायत/विलाप प्रकट करना हो सकता है।
  - marker: b
    text: या, “मेरी आत्मा अभिभूत हो जाती है।”
    reason: עטף का अर्थ दुर्बल पड़ना या अभिभूत होना हो सकता है।
lexical_decisions:
- source_word: אֶזְכְּרָה
  choice: मैं ... स्मरण करता हूँ
  rationale: प्रथम पुरुष रूप में वर्तमान विलाप की चल रही क्रिया स्वाभाविक रूप से व्यक्त होती है; इब्रानी में संभावित इच्छार्थक या भविष्यगत छाया को संदर्भ निर्णायक रूप से नहीं माँगता।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: यहाँ इस्राएल के एकमात्र परमेश्वर का उल्लेख है; आधुनिक हिन्दी बाइबलीय शैली में यह स्पष्ट और प्रतिष्ठित पद है।
- source_word: וְאֶהֱמָיָה
  choice: और कराहता हूँ
  rationale: המה यहाँ व्यथा से उपजी सुनाई देने वाली आंतरिक हलचल या विलाप बताता है; ‘कराहता हूँ’ इस भाव को सहज हिन्दी में व्यक्त करता है।
- source_word: אָשִׂיחָה
  choice: मैं मनन करता हूँ
  rationale: שיח मन ही मन विचार करने, बोलने या शिकायत प्रकट करने का अर्थ दे सकता है। समानांतर पंक्ति में स्मरण और भीतरी व्यथा के कारण ‘मनन’ उपयुक्त है, जबकि विकल्प पादटिप्पणी में सुरक्षित हैं।
- source_word: וְתִתְעַטֵּף
  choice: शिथिल हो जाती है
  rationale: עטף का हित्पएल रूप दुर्बल पड़ने अथवा अभिभूत होने का भाव देता है। आत्मा के साथ ‘शिथिल हो जाती है’ भीतरी शक्ति चुकने को स्वाभाविक हिन्दी में बताता है।
- source_word: רוּחִי
  choice: मेरी आत्मा
  rationale: רוּחַ यहाँ श्वास से अधिक कवि के आंतरिक जीवन या मनोबल को सूचित करता है; ‘आत्मा’ इस बहुअर्थी बाइबलीय पद का प्रचलित समतुल्य है।
- source_word: סֶלָה
  choice: सेला
  rationale: इस संगीतात्मक या साहित्यिक संकेत का ठीक अर्थ अनिश्चित है, इसलिए इसका लिप्यंतरण किया गया है।
