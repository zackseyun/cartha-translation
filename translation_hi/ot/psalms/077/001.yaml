  text: My voice is to God[a], and I cry out; my voice is to God[b], and he gives ear to me.
translation:
  language: hi
  text: 'मेरी आवाज़ परमेश्वर की ओर उठती है—मैं पुकारता हूँ;

    मेरी आवाज़ परमेश्वर की ओर उठती है—वह मेरी पुकार ध्यान से सुनता है।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप से: “मेरी आवाज़ परमेश्वर की ओर है ... मेरी आवाज़ परमेश्वर की ओर है।” इब्रानी में यह काव्य-पदबंध दोहराया गया है। अंतिम क्रिया का अर्थ है “वह मेरी ओर कान देता है” अर्थात ध्यान से सुनता है; या, “उसने मेरी सुनी।”'
    reason: दोहराए हुए संज्ञात्मक काव्य-पदबंध तथा अंतिम क्रिया के ध्यानपूर्ण श्रवण और कालगत वैकल्पिक अनुवाद को स्पष्ट करना।
lexical_decisions:
- source_word: קוֹלִי אֶל־אֱלֹהִים
  choice: मैं परमेश्वर की ओर अपनी आवाज़ उठाता हूँ
  rationale: शाब्दिक संरचना ‘मेरी आवाज़ परमेश्वर की ओर’ है। हिन्दी में ‘आवाज़ उठाता हूँ’ दिशा, पुकार और काव्यात्मक बल को स्वाभाविक रूप से व्यक्त करता है; दूसरी पंक्ति में इसकी पुनरावृत्ति इब्रानी समानांतरता को बनाए रखती है।
- source_word: וְאֶצְעָקָה
  choice: पुकारता हूँ
  rationale: צעק संकट में सहायता के लिए ऊँची और तीव्र पुकार को दर्शाता है। ‘पुकारता हूँ’ आधुनिक हिन्दी में सहज है, जबकि ‘आवाज़ उठाकर’ उसके स्वर-बल को साथ में व्यक्त करता है।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: यहाँ बहुवचन-रूप संज्ञा एकमात्र परमेश्वर के लिए एकवचन अर्थ में प्रयुक्त है।
- source_word: וְהַאֲזִין אֵלָי
  choice: और वह मेरी ओर कान लगाता है
  rationale: אזן केवल सुनने नहीं, ध्यानपूर्वक कान लगाने का भाव रखता है। ‘मेरी ओर’ אֵלָי की दिशात्मक अभिव्यक्ति को सुरक्षित रखता है।
theological_decisions:
- issue: दूसरी पंक्ति में परमेश्वर की प्रतिक्रिया
  choice: 'इसे कथन के रूप में प्रस्तुत किया गया है: ‘वह मेरी ओर कान लगाता है।’'
  alternative: ‘उसने मेरी सुनी’ अथवा प्रार्थनात्मक भाव में ‘वह मेरी सुने।’
  rationale: प्रस्तुत स्वरूप परमेश्वर के ध्यानपूर्वक सुनने को एक घोषणात्मक कथन के रूप में समझता है और वर्तमानकालीन काव्यात्मक जीवंतता बनाए रखता है। पाठ में संभावित कालगत भिन्नता को पादटिप्पणी में खुला रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘आवाज़ उठाता हूँ’ अत्यधिक शाब्दिक किन्तु अस्वाभाविक ‘मेरी आवाज़ परमेश्वर की ओर है’ से बचता है, जबकि दोनों अर्धपंक्तियों की पुनरावृत्ति और काव्यात्मक समानांतरता बनाए रखता है।
