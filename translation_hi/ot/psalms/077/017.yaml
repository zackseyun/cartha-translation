source:
  edition: WLC
  text: זֹ֤רְמוּ מַ֨יִם עָב֗וֹת ק֭וֹל נָתְנ֣וּ שְׁחָקִ֑ים אַף חֲ֝צָצֶ֗י/ךָ יִתְהַלָּֽכוּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/077/017.yaml
  text: The clouds poured out water; the skies gave forth a sound; indeed[a], your arrows moved about.
translation:
  language: hi
  text: बादलों ने जल बरसाया; आकाश ने ध्वनि सुनाई; यहाँ तक कि तेरे तीर भी इधर-उधर चलते रहे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तेरी बिजलियाँ इधर-उधर कौंधती रहीं।” हिब्रू में शाब्दिक रूप से “तेरे तीर” है; परमेश्वर के तूफ़ानी प्रकट होने के इस प्रसंग में यह सम्भवतः बिजली के लिए युद्ध-संबंधी रूपक है।
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹרְמוּ
  choice: बरसाया
  rationale: क्रिया प्रचुर धारा के रूप में बह निकलने या उंडेलने का भाव देती है। बादलों और वर्षा के प्रसंग में ‘जल बरसाया’ स्वाभाविक हिन्दी है और तीव्र प्रवाह को व्यक्त करता है।
- source_word: מַיִם
  choice: जल
  rationale: हिब्रू रूप बहुवचनात्मक है, पर यहाँ हिन्दी में द्रव्यवाचक एकवचन ‘जल’ अधिक स्वाभाविक और काव्यात्मक है।
- source_word: עָבוֹת
  choice: बादलों
  rationale: शब्द घने बादल-समूहों को सूचित करता है। ‘बादल’ साधारण पाठक के लिए स्पष्ट है; तूफ़ानी संदर्भ उनका घनापन प्रकट करता है।
- source_word: קוֹל נָתְנוּ
  choice: अपना स्वर दिया
  rationale: मूल मुहावरा शाब्दिक रूप से ‘स्वर/ध्वनि दी’ है। यह अनुवाद सम्भावित गर्जन को स्पष्ट किए बिना हिब्रू काव्य-चित्र को बनाए रखता है।
- source_word: שְׁחָקִים
  choice: आकाश
  rationale: शब्द ‘आकाश’ या ‘बादल’ का बोध करा सकता है। पिछले पदांश में बादल आ चुके हैं, इसलिए ‘आकाश’ समानांतरता और शब्द-भेद दोनों बनाए रखता है।
- source_word: אַף
  choice: यहाँ तक कि ... भी
  rationale: यह बलवर्धक तथा योगसूचक अव्यय है। ‘यहाँ तक कि ... भी’ पद्य की चरम गति और जोर को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: חֲצָצֶיךָ
  choice: तेरे तीर
  rationale: शब्द का सामान्य अर्थ ‘तीर’ है। तूफ़ानी ईश-प्रकटन में यह बिजली का युद्ध-संबंधी रूपक हो सकता है, पर मुख्य पाठ मूल चित्र को बनाए रखता है।
- source_word: יִתְהַלָּכוּ
  choice: इधर-उधर चले
  rationale: हित्पएल रूप चारों ओर या इधर-उधर गतिशील होने का भाव देता है। यह अभिव्यक्ति तीर और बिजली, दोनों सम्भावनाओं के साथ संगत रहती है।
theological_decisions:
- issue: ईश-प्रकटन के काव्यात्मक चित्र में वास्तविक तीर या बिजली का रूपक
  choice: मुख्य पाठ में ‘तेरे तीर’ रखा गया है, जिससे तूफ़ानी संदर्भ स्वयं बिजली का रूपक सुझा सके।
  alternative: ‘तेरी बिजलियाँ’ या ‘तेरे बिजली के बाण’
  rationale: हिब्रू संज्ञा का प्रत्यक्ष अर्थ ‘तीर’ है। उसे सीधे ‘बिजली’ कर देने से मूल का युद्ध-संबंधी रूपक मिट जाता; इसलिए सम्भावित मौसम-संबंधी अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल किंतु गरिमापूर्ण काव्यात्मक रूप अपनाया गया है। ‘जल’ और ‘स्वर दिया’ मूल की काव्यात्मकता रखते हैं; ‘इधर-उधर चले’ गति को बिना अनावश्यक व्याख्या के स्पष्ट करता है। सर्वनाम ‘तेरे’ भजन की सीधी, निकट ईश्वर-संबोधन शैली के अनुरूप है।
