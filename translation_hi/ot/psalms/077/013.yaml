  text: हे परमेश्वर, तेरा मार्ग पवित्रता में है।[a] परमेश्वर के समान महान देवता कौन है?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तेरा मार्ग पवित्रस्थान में है।” इब्रानी पदबंध परमेश्वर की पवित्रता को या पवित्र स्थान को सूचित कर सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: אֱלֹהִים
  choice: हे परमेश्वर
  rationale: अगले पदबंध में द्वितीय पुरुष प्रत्यय (‘तेरा’) होने के कारण इसे संबोधन मानना स्वाभाविक है; ‘परमेश्वर’ आधुनिक हिन्दी में इस्राएल के परमेश्वर के लिए गरिमापूर्ण और सहज है।
- source_word: בַּקֹּדֶשׁ
  choice: पवित्रता में
  rationale: קֹדֶשׁ यहाँ पवित्रता के क्षेत्र या गुण को व्यक्त कर सकता है; यह चयन इब्रानी की अमूर्त सम्भावना बनाए रखता है, जबकि ‘पवित्रस्थान में’ को पादटिप्पणी में वैकल्पिक अर्थ के रूप में दिया गया है।
- source_word: דַּרְכֶּךָ
  choice: तेरा मार्ग
  rationale: ‘मार्ग’ परमेश्वर के कार्य करने के ढंग और उसके आचरण—दोनों अर्थों को समेट सकता है।
- source_word: מִי
  choice: कौन
  rationale: यह आलंकारिक तुलना आरम्भ करने वाले प्रश्नवाचक का सीधा और स्वाभाविक अनुवाद है।
- source_word: אֵל
  choice: ईश्वर
  rationale: तुलनात्मक खंड में यह जातिवाचक अर्थ रखता है—किसी भी देवता या ईश्वर-सत्ता की तुलना सच्चे परमेश्वर से की जा रही है; ‘ईश्वर’ इस भेद को पठनीय ढंग से व्यक्त करता है।
- source_word: גָּדוֹל
  choice: महान
  rationale: यह मूल शब्द का सीधा अर्थ है और आलंकारिक स्तुति की गरिमा बनाए रखता है।
- source_word: כֵּאלֹהִים
  choice: परमेश्वर के समान
  rationale: उपसर्ग כְּ की तुलना और אֱלֹהִים के यहाँ एकवचन, सच्चे परमेश्वर के संदर्भ—दोनों को स्पष्ट और संक्षिप्त रूप में रखा गया है।
theological_decisions:
- issue: בַּקֹּדֶשׁ का अर्थ
  choice: परमेश्वर का मार्ग पवित्रता में है
  alternative: परमेश्वर का मार्ग पवित्रस्थान में है
  rationale: इब्रानी पदबंध गुण/क्षेत्र के रूप में ‘पवित्रता’ और स्थान के रूप में ‘पवित्रस्थान’—दोनों अर्थ दे सकता है। मुख्य पाठ में व्यापक अर्थ रखा गया है और वास्तविक स्थानवाचक सम्भावना पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, काव्यात्मक और सामान्य पाठक के लिए सुबोध शैली। परमेश्वर को सीधे संबोधित करते हुए ‘तेरा’ रखा गया है, जो भजन की निकटता और एकवचन इब्रानी रूप को दर्शाता है।
