  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और काव्यात्मक शैली रखी गई है। दोनों पंक्तियों की समानांतर संरचना मूल इब्रानी काव्य के अनुरूप सुरक्षित है।
