  text: I considered the days of old[a], the years of ages past.
translation:
  language: hi
  text: 'मैंने प्राचीन दिनों पर विचार किया,

    बीते युगों के वर्षों पर[a]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा, “प्राचीन काल के वर्षों पर।” यहाँ इब्रानी עוֹלָמִים का अर्थ निरपेक्ष अर्थ में अनंतता होना आवश्यक नहीं है, बल्कि सुदूर प्राचीन काल भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: חִשַּׁבְתִּי
  choice: मैंने … पर विचार किया
  rationale: חשׁב यहाँ सोचने, मनन करने या विचार करने की सचेत क्रिया व्यक्त करता है; ‘विचार किया’ केवल याद करने की अपेक्षा इस चिंतनशील भाव को अधिक ठीक से रखता है।
- source_word: יָמִים מִקֶּדֶם
  choice: प्राचीन दिनों
  rationale: מִקֶּדֶם बहुत पुराने अथवा पूर्वकाल का बोध कराता है। ‘प्राचीन दिनों’ संक्षिप्त है और काव्यात्मक समानांतरता बनाए रखता है।
- source_word: שְׁנוֹת עוֹלָמִים
  choice: बीते युगों के वर्षों
  rationale: עוֹלָמִים इस संदर्भ में परम अनंतता नहीं, बल्कि सुदूर अतीत के दीर्घ युगों की ओर संकेत करता है। यह अनुवाद उस कालगत विस्तार और काव्यात्मक भार को सुरक्षित रखता है।
theological_decisions:
- issue: עוֹלָמִים का कालगत अर्थ
  choice: सुदूर अतीत के ‘बीते युग’
  alternative: अनंतकाल
  rationale: ‘वर्षों’ और ‘प्राचीन दिनों’ के समानांतर प्रयोग से यहाँ बीते हुए अत्यंत पुराने समय का अर्थ अधिक स्वाभाविक है; पद को दार्शनिक या तात्त्विक अनंतता तक विस्तृत करना संदर्भ से अधिक कहना होगा।
