source:
  edition: WLC
  text: הֲ/שָׁכַ֣ח חַנּ֣וֹת אֵ֑ל אִם קָפַ֥ץ בְּ֝/אַ֗ף רַחֲמָ֥י/ו סֶֽלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/077/009.yaml
  text: Has God forgotten to be gracious? Has he in anger shut up his compassion? Selah[a][b]
translation:
  language: hi
  text: क्या परमेश्वर अनुग्रह करना भूल गया है? क्या उसने क्रोध में अपनी करुणा रोक ली है? सेला[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्या परमेश्वर कृपा दिखाना भूल गया है? या क्या उसने क्रोध में अपनी दयाएँ रोक रखी हैं?”
    reason: lexical_alternative
  - marker: b
    text: ‘सेला’ सम्भवतः उपासना या संगीत से जुड़ा कोई संकेत है; इसका ठीक अर्थ अनिश्चित है।
    reason: cultural_note
lexical_decisions:
- source_word: הֲ/שָׁכַח
  choice: क्या ... भूल गया है
  rationale: प्रश्नवाचक הֲ और שׁכח मिलकर आलंकारिक प्रश्न बनाते हैं। यह अनुवाद भजनकार की व्यथित पूछताछ को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: חַנּוֹת
  choice: अनुग्रह करना
  rationale: חנן का यह रूप अनुग्रह या कृपा दिखाने का भाव व्यक्त करता है। ‘अनुग्रह करना’ मूल की ईश्वरीय अनुग्रह-संबंधी शब्दावली को संक्षिप्त और गरिमापूर्ण ढंग से सुरक्षित रखता है।
- source_word: אֵל
  choice: परमेश्वर
  rationale: यहाँ אֵל परमेश्वर के सामान्य पदनाम के रूप में आया है; ‘परमेश्वर’ आधुनिक बाइबलीय हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: אִם
  choice: क्या
  rationale: पहले प्रश्न के समानांतर אִם दूसरा प्रश्न आरम्भ करता है। हिन्दी में नया ‘क्या’ लगाना सहज है; ‘या क्या’ का वैकल्पिक संबंध पादटिप्पणी में सुरक्षित है।
- source_word: קָפַץ
  choice: रोक ली है
  rationale: क्रिया का मूल बिंब बन्द करने या समेट लेने का है। करुणा के साथ ‘रोक ली’ आधुनिक हिन्दी में स्वाभाविक है और उसे न देने का भाव स्पष्ट करती है।
- source_word: בְּ/אַף
  choice: क्रोध में
  rationale: אַף का शाब्दिक अर्थ ‘नाक’ है, पर यहाँ इसका प्रचलित लाक्षणिक अर्थ क्रोध है।
- source_word: רַחֲמָיו
  choice: अपनी करुणा
  rationale: रूप की दृष्टि से यह बहुवचन है, पर ईश्वरीय दया या करुणा के सामूहिक भाव में प्रयुक्त है। ‘अपनी करुणा’ सहज हिन्दी है; बहुवचन ‘दयाएँ’ पादटिप्पणी में दिया गया है।
- source_word: סֶלָה
  choice: सेला
  rationale: इस उपासना या संगीत-संबंधी संकेत का सटीक अर्थ अनिश्चित है, इसलिए अनुमानित अनुवाद के बजाय लिप्यंतरण रखा गया है।
theological_decisions:
- issue: पद को कथन मानें या आलंकारिक प्रश्न
  choice: भजनकार की व्यथा व्यक्त करने वाले दो आलंकारिक प्रश्न
  alternative: ‘परमेश्वर अनुग्रह करना भूल गया है’ जैसे कथन
  rationale: प्रश्नवाचक चिह्न और काव्यात्मक संदर्भ प्रश्नात्मक पाठ का समर्थन करते हैं। इन्हें कथन बना देने से विलाप का धार्मिक तनाव अनावश्यक रूप से निश्चित आरोप में बदल जाता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सरल किंतु गरिमापूर्ण रखी गई है। समानांतर आलंकारिक प्रश्न और विलाप का तनाव सुरक्षित हैं। ‘सेला’ का अनुवाद न करके देवनागरी में लिप्यंतरण किया गया है।
