base_translation:
  language: en
  yaml_path: translation/ot/psalms/077/019.yaml
  text: Your way was through the sea[a], and your paths through many waters[b], yet your footprints were not known.
translation:
  language: hi
  text: समुद्र में होकर तेरा मार्ग था[a], और बहुत-से जल में तेरे पथ; फिर भी तेरे पदचिह्नों का पता नहीं चला[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “समुद्र में तेरा मार्ग था।” इब्रानी संबंधबोधक का अर्थ “में” हो सकता है, पर यहाँ वह जल में से होकर जाने का भाव भी दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “तेरे कदमों के निशान” या “तेरे कदम ज्ञात न हुए।”
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיָּם
  choice: समुद्र में होकर
  rationale: בְּ का मूल स्थानवाचक अर्थ ‘में’ है, पर ‘मार्ग’ के साथ यहाँ जल के भीतर से होकर जाने का भाव है। ‘में होकर’ स्थान और गति दोनों को बनाए रखता है।
- source_word: דַּרְכֶּךָ
  choice: तेरा मार्ग
  rationale: דֶּרֶךְ के व्यापक अर्थ ‘मार्ग/राह’ को ‘मार्ग’ स्वाभाविक और गरिमापूर्ण ढंग से व्यक्त करता है तथा शाब्दिक और रूपकात्मक दोनों प्रतिध्वनियाँ बनाए रखता है।
- source_word: שביליך
  choice: तेरे पथ
  rationale: שְׁבִיל का अर्थ पगडंडी, पथ या निशान हो सकता है। ‘पथ’ पहले पद के ‘मार्ग’ के साथ काव्यात्मक समानांतरता रखता है।
- source_word: בְּמַיִם רַבִּים
  choice: अथाह जलराशि में
  rationale: शाब्दिक रूप से यह ‘बहुत/विशाल जल में’ है। हिंदी काव्य में ‘अथाह जलराशि’ विशाल और गहरे जल का स्वाभाविक बोध देता है, बिना किसी विशिष्ट भौगोलिक जलाशय को जोड़ने के।
- source_word: עִקְּבוֹתֶיךָ
  choice: तेरे पदचिह्नों
  rationale: संज्ञा एड़ी, कदमों के निशान या पदचिह्नों को सूचित करती है। ‘पदचिह्न’ पीछे रह जाने वाले दृश्य निशानों की काव्यात्मक छवि को बनाए रखता है।
- source_word: לֹא נֹדָעוּ
  choice: का पता न चला
  rationale: निफ़अल रूप का शाब्दिक अर्थ ‘ज्ञात नहीं हुए’ है। आधुनिक हिंदी में ‘पता न चला’ स्वाभाविक है और यह खुला रखता है कि निशान दिखाई नहीं दिए, पहचाने नहीं गए, या उनका अनुसरण नहीं किया जा सका।
theological_decisions:
- issue: निर्गमन-संबंधी जल-पारगमन की व्याख्यात्मक विशिष्टता
  choice: समुद्र और विशाल जल के बीच परमेश्वर के मार्ग की काव्यात्मक छवि को बनाए रखना, पर मुख्य पाठ में लाल समुद्र या निर्गमन का नाम न जोड़ना।
  alternative: इसे मुख्य पाठ में स्पष्ट रूप से लाल समुद्र पार करने की घटना कहना।
  rationale: इब्रानी पाठ उस ऐतिहासिक उद्धार की ओर संकेत करता है, किंतु घटना का नाम नहीं लेता। अप्रकट पदचिह्नों की छवि परमेश्वर के वास्तविक कार्य और उसकी अगम्यता के बीच तनाव को बनाए रखती है।
translation_notes:
  register: आधुनिक मानक हिंदी का काव्यात्मक और गरिमापूर्ण रूप अपनाया गया है। ‘तेरा/तेरे’ भजन की सीधी प्रार्थनात्मक संबोधन-शैली के अनुरूप है। अर्धविराम इब्रानी समानांतर पदों को स्पष्ट करता है; ‘फिर भी’ अंतिम विरोधाभास को स्वाभाविक हिंदी में व्यक्त करता है।
