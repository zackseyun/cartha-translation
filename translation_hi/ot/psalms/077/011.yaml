    reason: lexical_alternative
lexical_decisions:
- source_word: אַזְכִּיר
  choice: स्मरण करूँगा
  rationale: हिफ़ील रूप का अर्थ याद करना, उल्लेख करना या सुनाना हो सकता है। यहाँ अगली पंक्ति में उसी धातु की पुनरावृत्ति को बनाए रखते हुए ‘स्मरण करूँगा’ विचारपूर्वक याद करने के भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מַעַלְלֵי
  choice: कामों
  rationale: यह शब्द किए गए कार्यों या कर्मों को दर्शाता है। ‘कामों’ सामान्य आधुनिक हिन्दी में सहज है और काव्यात्मक समानांतरता में उपयुक्त बैठता है।
- source_word: יָהּ
  choice: याह
  rationale: यह परमेश्वर के नाम का संक्षिप्त काव्यात्मक रूप है, पूर्ण चतुरक्षरी नाम नहीं। इसलिए मूल पाठ का भेद सुरक्षित रखने हेतु इसे लिप्यंतरित किया गया है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यहाँ यह संयोजक दूसरी पंक्ति को पहली पंक्ति की व्याख्यात्मक या बलपूर्ण पुनरुक्ति के रूप में जोड़ता है।
- source_word: אֶזְכְּרָה
  choice: स्मरण करूँगा
  rationale: यह रूप प्रसंग में दृढ़ प्रथम-पुरुष संकल्प व्यक्त करता है। ‘स्मरण करूँगा’ उस संकल्प और पहली पंक्ति की शब्द-पुनरावृत्ति दोनों को बनाए रखता है।
- source_word: מִקֶּדֶם
  choice: प्राचीन काल के
  rationale: यह अभिव्यक्ति बहुत पुराने अथवा पूर्वकाल की ओर संकेत करती है; ‘प्राचीन काल के’ समय की गहराई रखता है, पर अनिवार्यतः सृष्टि के आरम्भ का अर्थ नहीं देता।
- source_word: פִּלְאֶךָ
  choice: तेरे अद्भुत कामों
  rationale: यह संज्ञा आश्चर्यजनक या अलौकिक कार्यों को दर्शाती है। हिन्दी में ‘अद्भुत कामों’ समानांतर पंक्ति के साथ स्पष्ट और स्वाभाविक है।
theological_decisions:
- issue: परमेश्वर के नाम के संक्षिप्त काव्यात्मक रूप יָהּ का अनुवाद
  choice: याह
  alternative: यहोवा / प्रभु
  rationale: मूल में पूर्ण नाम יְהוָה के बजाय संक्षिप्त रूप יָהּ है। ‘याह’ इस शब्दगत और काव्यात्मक भेद को सुरक्षित रखता है तथा उसे किसी परम्परागत प्रतिस्थापन में समतल नहीं करता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी; इब्रानी काव्य की समानांतरता तथा זכר धातु की पुनरावृत्ति को रखा गया है। परमेश्वर के लिए एकवचन निकट संबोधन ‘तेरे’ मूल के द्वितीय पुरुष एकवचन को स्पष्ट करता है।
