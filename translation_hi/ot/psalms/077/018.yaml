base_translation:
  language: en
  yaml_path: translation/ot/psalms/077/018.yaml
  text: The sound of your thunder was in the whirlwind[a]; lightning lit up the world; the earth trembled and quaked.
translation:
  language: hi
  text: तेरे गर्जन की ध्वनि बवंडर में थी[a]; बिजलियों ने संसार को आलोकित कर दिया; पृथ्वी काँप उठी और थरथरा गई।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘पहिए में’; इब्रानी शब्द का शाब्दिक अर्थ ‘पहिया’ हो सकता है, पर यहाँ संभवतः घूमते हुए तूफ़ान का बिंब है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ק֤וֹל
  choice: आवाज़
  rationale: קול का अर्थ ‘आवाज़’ या ‘ध्वनि’ है। गर्जन के साथ ‘आवाज़’ स्वाभाविक आधुनिक हिन्दी है और श्रव्य बिंब बनाए रखती है।
- source_word: רַעַמְךָ
  choice: तेरे गर्जन
  rationale: רעם बादल की गर्जना को सूचित करता है; द्वितीय पुरुष एकवचन प्रत्यय को ‘तेरे’ से बनाए रखा गया है, क्योंकि भजन में संबोधन परमेश्वर से है।
- source_word: בַּגַּלְגַּל
  choice: बवंडर में
  rationale: גלגל का मूल बिंब पहिए या घूमती हुई वस्तु का है, पर यहाँ गर्जन और बिजली के मौसम-संबंधी संदर्भ में यह घूमते तूफ़ान को सूचित करता है। ‘बवंडर’ इस गतिशील बिंब को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הֵאִירוּ
  choice: प्रकाशित कर दिया
  rationale: אור का हिफ़ील रूप प्रकाश देने या उजाला करने का अर्थ रखता है। यह चयन उसके कारक भाव को बनाए रखता है।
- source_word: בְרָקִים
  choice: बिजलियों
  rationale: इब्रानी शब्द बहुवचन है; हिन्दी में ‘बिजलियों’ अलग-अलग चमकों की बहुलता को सहज रूप से व्यक्त करता है।
- source_word: תֵּבֵל
  choice: संसार
  rationale: תבל प्रायः बसे हुए जगत या पृथ्वी-जगत को दर्शाता है। यहाँ ‘संसार’ संक्षिप्त और स्वाभाविक है।
- source_word: רָגְזָה
  choice: काँप उठी
  rationale: यह क्रिया काँपने और व्याकुल होकर हिलने का भाव देती है। ‘काँप उठी’ अचानक प्रतिक्रिया को व्यक्त करती है।
- source_word: וַתִּרְעַשׁ
  choice: और थरथरा गई
  rationale: רעש ज़ोर से हिलने या काँपने का अर्थ देता है। इसे अलग अभिव्यक्ति देने से पहले क्रियापद के साथ इब्रानी काव्यात्मक तीव्रता बनी रहती है।
- source_word: הָאָרֶץ
  choice: पृथ्वी
  rationale: इस विश्वव्यापी ईश-प्रकटन के संदर्भ में ‘पृथ्वी’, स्थानीय ‘देश’ या ‘भूमि’ से अधिक उपयुक्त है।
