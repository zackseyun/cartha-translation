    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָגִיתִי
  choice: मैं…मनन करूँगा
  rationale: הגה का क़ाल प्रथम पुरुष एकवचन रूप मन में विचार करने या मनन करने का भाव देता है। समानांतर भाव वाले अगले क्रियारूप के साथ यहाँ भावी/संकल्पसूचक हिन्दी स्वाभाविक है।
- source_word: בְכָל פָּעֳלֶךָ
  choice: तेरे हर काम पर
  rationale: विचार की क्रिया के साथ ב विषय को सूचित करता है; פֹּעַל सामूहिक अर्थ में परमेश्वर के समस्त काम को दर्शाता है। ‘हर काम’ मूल के כָל और एकवचन संज्ञा दोनों को सहज हिन्दी में व्यक्त करता है।
- source_word: וּבַעֲלִילוֹתֶיךָ
  choice: और तेरे कार्यों पर
  rationale: עֲלִילוֹתֶיךָ बहुवचन में ‘तेरे कार्य/कृत्य’ है। ‘कार्यों’ पहली पंक्ति के ‘काम’ से काव्यात्मक समानता रखते हुए शब्दगत विविधता बनाए रखता है; ‘सामर्थी कार्य’ जैसा अतिरिक्त अर्थ नहीं जोड़ता।
- source_word: אָשִׂיחָה
  choice: विचार करूँगा
  rationale: שיח मन में सोचने/मनन करने और बोलने/चर्चा करने, दोनों को व्यक्त कर सकता है। यहाँ पहली पंक्ति के समानांतर चिंतन का अर्थ अधिक संभावित है; ‘विचार करूँगा’ पुनरुक्ति से बचते हुए अर्थगत समानता रखता है।
