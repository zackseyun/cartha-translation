lexical_decisions:
- source_word: גָּאַלְתָּ
  choice: छुड़ा लिया
  rationale: क्रिया גאל किसी निकट संबंधी द्वारा छुड़ाने तथा व्यापक रूप से उद्धार करने का भाव रखती है। हिंदी में ‘छुड़ा लिया’ इस उद्धारकारी कार्य को स्वाभाविक ढंग से व्यक्त करता है; ‘मोल लेकर छुड़ाया’ यहाँ स्रोत से अधिक विशिष्ट हो सकता है।
- source_word: בִּזְרוֹעַ
  choice: अपनी भुजा से
  rationale: ‘भुजा’ मूल काव्यात्मक बिंब को बनाए रखती है और परमेश्वर की सक्रिय सामर्थ्य का संकेत देती है; ‘सामर्थ्य से’ अर्थ स्पष्ट करता, पर बिंब मिटा देता।
- source_word: עַמֶּךָ
  choice: अपनी प्रजा
  rationale: द्वितीय पुरुष एकवचन प्रत्यय सहित עַם परमेश्वर की ‘अपनी प्रजा’ को दर्शाता है। ‘प्रजा’ भजन की गरिमामय शैली और सामुदायिक अर्थ दोनों के अनुकूल है।
- source_word: בְּנֵי
  choice: पुत्रों
  rationale: निर्माण-रूप בְּנֵי का औपचारिक अर्थ ‘पुत्र’ है। वंशगत-सामुदायिक प्रयोग के बावजूद मूल अभिव्यक्ति को बनाए रखा गया है, जबकि पादटिप्पणी उसके व्यापक आशय को बताती है।
- source_word: יַעֲקֹב וְיוֹסֵף
  choice: याकूब और यूसुफ
  rationale: दोनों व्यक्तिनामों को यथावत रखा गया है; मुख्य पाठ यह तय नहीं करता कि ‘यूसुफ’ विशेष गोत्रों का प्रतिनिधि है या समूचे इस्राएल का काव्यात्मक नाम।
- source_word: סֶלָה
  choice: सेला
  rationale: इस उपासना-संगीत संबंधी संकेत का ठीक अर्थ अनिश्चित है, इसलिए अर्थानुवाद करने के बजाय पारंपरिक लिप्यंतरण रखा गया है।
theological_decisions:
- issue: ‘याकूब और यूसुफ के पुत्र’ का राष्ट्रीय/गोत्रीय संदर्भ
  choice: दोनों नामों को ज्यों का त्यों रखते हुए उन्हें ‘अपनी प्रजा’ का पुनर्व्याख्यात्मक विस्तार माना गया है।
  alternative: ‘यूसुफ’ को विशेष रूप से एप्रैम और मनश्शे, उत्तरी राज्य, अथवा पूरे इस्राएल का प्रतिनिधि मानकर स्पष्ट करना।
  rationale: इब्रानी पाठ स्वयं प्रतिनिधित्व का दायरा निर्धारित नहीं करता। अतः मुख्य पाठ में उसकी ऐतिहासिक और काव्यात्मक अस्पष्टता सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमामय और काव्यात्मक रखी गई है। ‘अपनी भुजा से’ इब्रानी बिंब को सुरक्षित रखता है, और डैश के बाद का पदबंध स्पष्ट करता है कि ‘याकूब और यूसुफ के पुत्र’ उसी प्रजा का विवरण है।
