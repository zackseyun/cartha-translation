  - marker: b
    text: “याकूब और यूसुफ के पुत्र” इस्राएल की प्रजा के लिए काव्यात्मक अभिव्यक्ति हो सकती है; “यूसुफ” संभवतः उससे निकले गोत्रों को विशेष रूप से उभारता है।
    reason: alternative_reading
  - marker: c
    text: “सेला” संभवतः उपासना या संगीत से जुड़ा संकेत है; इसका ठीक अर्थ अनिश्चित है।
