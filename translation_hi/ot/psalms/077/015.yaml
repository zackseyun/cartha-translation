  text: आपने अपनी भुजा से अपनी प्रजा को छुड़ाया[a]—याकूब और यूसुफ के पुत्रों को[b]। सेला[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मुक्त किया” अथवा “उद्धार किया।”
