  text: You have held my eyelids open[b][a]; I am troubled and cannot speak.
translation:
  language: hi
  text: तूने मेरी पलकों को खुला रखा है[a]; मैं व्याकुल[b] हूँ और बोल नहीं पाता।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “तूने मेरी आँखों के पहरों को थाम रखा है।” इस इब्रानी मुहावरे का संभावित अर्थ है कि परमेश्वर ने भजनकार की आँखें नींद में बंद नहीं होने दीं।
    reason: lexical_alternative
