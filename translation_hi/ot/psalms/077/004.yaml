    text: या “मैं बहुत बेचैन हूँ” अथवा “मैं विचलित हूँ।”
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से, “और मैं नहीं बोलता।”
    reason: source_ambiguity
lexical_decisions:
- source_word: אָחַזְתָּ
  choice: तूने…खुला रखा है
  rationale: अחז के क़ाल पूर्ण, द्वितीय पुरुष एकवचन रूप में परमेश्वर की सक्रिय भूमिका व्यक्त होती है। पूरे मुहावरे के साथ ‘खुला रखा है’ स्वाभाविक हिन्दी में निरंतर जागते रहने का भाव देता है।
- source_word: שְׁמֻרוֹת עֵינָי
  choice: मेरी पलकों को
  rationale: शाब्दिक रूप से यह ‘मेरी आँखों के पहर/रखवाले’ है। प्रसंग में यह आँखें बंद न हो पाने, अर्थात पलकों को खुला रखे जाने का मुहावरेदार चित्र है; ‘पलकें’ सामान्य हिन्दी में इस आशय को स्पष्ट करती हैं।
- source_word: נִפְעַמְתִּי
  choice: मैं व्याकुल हूँ
  rationale: פעם का निफ़अल रूप भीतर की हलचल या गहरी बेचैनी व्यक्त करता है। ‘व्याकुल’ भाव की तीव्रता बनाए रखता है, पर भय, विस्मय या घबराहट में से किसी एक अर्थ को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: וְלֹא אֲדַבֵּר
  choice: और बोल नहीं पाता
  rationale: रूप की शाब्दिक अभिव्यक्ति ‘और मैं नहीं बोलता’ है, पर प्रसंग में व्याकुलता से उत्पन्न असमर्थता अधिक संभावित है। ‘बोल नहीं पाता’ इसे स्वाभाविक हिन्दी में व्यक्त करता है; शाब्दिक विकल्प पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: परमेश्वर को संबोधन का सर्वनाम
  choice: तूने
  alternative: आपने
  rationale: इब्रानी में द्वितीय पुरुष एकवचन का सीधा, निकट संबोधन है। हिन्दी के भजनात्मक और प्रार्थनात्मक प्रयोग में ‘तू’ आत्मीयता और प्रत्यक्षता बनाए रखता है; इसे अनादर का संकेत नहीं माना गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। परमेश्वर के लिए एकवचन ‘तू’ भजन की सीधी प्रार्थनात्मक वाणी को बनाए रखता है। मूल मुहावरे का अर्थ मुख्य पाठ में स्पष्ट किया गया है और उसका शाब्दिक चित्र पादटिप्पणी में सुरक्षित रखा गया है।
