  yaml_path: translation/ot/psalms/077/020.yaml
  text: You led your people like a flock by the hand of Moses and Aaron[a][b].
translation:
  language: hi
  text: आपने अपनी प्रजा की भेड़-बकरियों के झुंड के समान अगुवाई की[a], मूसा और हारून के द्वारा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘भेड़ों के समान।’ इब्रानी צאן एक सामूहिक शब्द है, जो विशेष रूप से भेड़ों या बकरियों के झुंड को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक रूप से, ‘मूसा और हारून के हाथ से’; यह उनके माध्यम या नेतृत्व द्वारा होने का मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: נָחִיתָ
  choice: आपने ... अगुवाई दी
  rationale: यह परमेश्वर को संबोधित दूसरा पुरुष एकवचन क्रिया-रूप है और मार्ग दिखाने अथवा आगे ले चलने का भाव देता है। आधुनिक हिन्दी में ‘अगुवाई दी’ स्वाभाविक है और चरवाहे के बिंब के अनुकूल भी।
- source_word: כַצֹּאן
  choice: भेड़-बकरियों के झुंड के समान
  rationale: כ तुलना प्रकट करता है और צאן छोटे पालतू पशुओं—मुख्यतः भेड़ और बकरियों—के सामूहिक झुंड का द्योतक है। यह अनुवाद सामूहिक चरवाही-बिंब और शब्द की व्यापकता दोनों रखता है।
- source_word: עַמֶּךָ
  choice: अपनी प्रजा
  rationale: עם यहाँ परमेश्वर से संबंधित वाचा-समुदाय के अर्थ में है। ‘अपनी प्रजा’ हिन्दी में स्वाभाविक ढंग से ‘आपकी प्रजा’ का संबंध व्यक्त करता है।
- source_word: בְּיַד
  choice: के हाथों से
  rationale: בְּיַד का शाब्दिक अर्थ ‘हाथ के द्वारा’ है और यहाँ माध्यम अथवा प्रतिनिधि नेतृत्व का मुहावरा है। ‘के हाथों से’ मूल बिंब को बनाए रखता है।
- source_word: מֹשֶׁה וְאַהֲרֹן
  choice: मूसा और हारून
  rationale: दोनों नामों के प्रचलित मानक हिन्दी बाइबलीय रूप अपनाए गए हैं।
theological_decisions:
- issue: परमेश्वर की अगुवाई में मूसा और हारून की भूमिका
  choice: परमेश्वर प्रमुख कर्ता हैं; मूसा और हारून वे मानवीय माध्यम हैं जिनके द्वारा उन्होंने अपनी प्रजा की अगुवाई की।
  alternative: मूसा और हारून केवल साथ उपस्थित ऐतिहासिक व्यक्ति हैं, अगुवाई के माध्यम नहीं।
  rationale: दूसरे पुरुष की क्रिया सीधे परमेश्वर को कर्ता बताती है, जबकि בְּיַד מֹשֶׁה וְאַהֲרֹן उनकी माध्यमगत भूमिका व्यक्त करता है। अनुवाद दोनों स्तरों को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘भेड़-बकरियों के झुंड’ से इब्रानी सामूहिक संज्ञा की व्यापकता स्पष्ट होती है; ‘के हाथों से’ मूल मुहावरे को सुरक्षित रखते हुए पादटिप्पणी में उसका आशय समझाया गया है।
