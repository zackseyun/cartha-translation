id: PSA.77.7
reference: Psalms 77:7
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: הַֽ֭/לְ/עוֹלָמִים יִזְנַ֥ח אֲדֹנָ֑/י וְ/לֹֽא יֹסִ֖יף לִ/רְצ֣וֹת עֽוֹד׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/077/007.yaml
  text: Will the Lord reject forever[a], and never again show favor?
translation:
  language: hi
  text: क्या प्रभु सदा के लिए त्याग देंगे[a] और फिर कभी अनुग्रह नहीं दिखाएँगे?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्या प्रभु सदा के लिए ठुकरा देंगे और फिर कभी प्रसन्न न होंगे?”
    reason: יִזְנַח और לִרְצוֹת के निकटतर शाब्दिक विकल्पों को सुरक्षित रखने के लिए।
lexical_decisions:
- source_word: הַלְעוֹלָמִים
  choice: क्या ... सदा के लिए
  rationale: प्रश्नवाचक הַ और बहुवचन עוֹלָמִים मिलकर अवधि पर बल देने वाला आलंकारिक प्रश्न बनाते हैं। ‘सदा के लिए’ स्वाभाविक आधुनिक हिन्दी में इस भाव को व्यक्त करता है।
- source_word: יִזְנַח
  choice: त्याग देंगे
  rationale: זנח का अर्थ ठुकराना या त्याग देना है। विलाप के संबंधपरक संदर्भ में ‘त्याग देंगे’ स्पष्ट है और दूर कर देने के भाव को बनाए रखता है।
- source_word: אֲדֹנָי
  choice: प्रभु
  rationale: यह परमेश्वर की उपाधि अदोनाय है, न कि दिव्य नाम YHWH। इसलिए इसे हिन्दी में स्वाभाविक उपाधि ‘प्रभु’ के रूप में अनूदित किया गया है।
- source_word: וְלֹא יֹסִיף לִרְצוֹת עוֹד
  choice: और फिर कभी अनुग्रह नहीं दिखाएँगे
  rationale: יֹסִיף के साथ क्रियार्थक לִרְצוֹת और עוֹד की संयुक्त रचना का भाव है कि वह आगे या दोबारा ऐसा नहीं करेगा। ‘फिर कभी ... नहीं’ इसे स्वाभाविक हिन्दी में व्यक्त करता है; רצה के अनुकूल रुख या प्रसन्नता को ‘अनुग्रह दिखाना’ संबंधपरक रूप से संप्रेषित करता है।
theological_decisions:
- issue: दिव्य उपाधि אֲדֹנָי का अनुवाद
  choice: प्रभु
  alternative: स्वामी
  rationale: मूल में अदोनाय उपाधि है, YHWH नाम नहीं। ‘प्रभु’ आधुनिक हिन्दी बाइबलीय भाषा में स्वाभाविक और गरिमापूर्ण उपाधि है तथा इसे दिव्य नाम समझ लेने से बचाती है।
- issue: רצה के भाव का निरूपण
  choice: अनुग्रह दिखाएँगे
  alternative: प्रसन्न होंगे
  rationale: संदर्भ में प्रश्न केवल भावात्मक प्रसन्नता का नहीं, बल्कि प्रजा के प्रति अनुकूल और कृपापूर्ण रुख का है। फिर भी वैकल्पिक अर्थ को पादटिप्पणी में रखा गया है ताकि मूल की अर्थ-सीमा संकुचित न हो।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और विलाप के तीखे आलंकारिक प्रश्न के अनुरूप। आदरसूचक बहुवचन क्रिया ‘देंगे/दिखाएँगे’ द्वारा ‘प्रभु’ के लिए स्वाभाविक हिन्दी प्रयोग रखा गया है।
