id: PSA.77.16
reference: Psalms 77:16
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: רָ֘א֤וּ/ךָ מַּ֨יִם אֱֽלֹהִ֗ים רָא֣וּ/ךָ מַּ֣יִם יָחִ֑ילוּ אַ֝֗ף יִרְגְּז֥וּ תְהֹמֽוֹת׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/077/016.yaml
  text: The waters saw you[a], O God; the waters saw you and writhed[b]; even the depths trembled.
translation:
  language: hi
  text: 'हे परमेश्वर, जल ने तुझे देखा;

    जल ने तुझे देखा और तड़प उठा[a];

    यहाँ तक कि गहराइयाँ भी काँप उठीं[b]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “पीड़ा से ऐंठ उठा,” “मरोड़ खाने लगा,” अथवा “थरथरा उठा।” इब्रानी क्रिया ऐंठन-जैसे कंपन या प्रसव-जैसी पीड़ा व्यक्त कर सकती है।
    reason: lexical_alternative
  - marker: b
    text: “गहराइयाँ” से आशय गहरे जल या महासागर की अथाह गहराइयों से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאוּךָ
  choice: तुझे देखा
  rationale: ראה के क़ाल पूर्ण रूप और द्वितीय पुरुष एकवचन प्रत्यय का सीधा अर्थ रखा गया है। काव्यात्मक बल के लिए इसकी पुनरावृत्ति भी सुरक्षित है।
- source_word: מַיִם
  choice: जल
  rationale: समष्टिवाचक ‘जल’ समुद्री/आदिम जलराशि के काव्यात्मक मानवीकरण को स्वाभाविक हिन्दी में व्यक्त करता है और दोनों पंक्तियों में दोहराया गया है।
- source_word: אֱלֹהִים
  choice: हे परमेश्वर
  rationale: यहाँ संबोधन का भाव है। ‘हे’ उसे स्पष्ट करता है, और ‘परमेश्वर’ आधुनिक हिन्दी बाइबलीय काव्य में गरिमापूर्ण तथा सहज है।
- source_word: יָחִילוּ
  choice: तड़प उठा
  rationale: חול/חיל से निकला यह क्रियापद ऐंठन, प्रसव-जैसी पीड़ा या कंपकंपी का बोध करा सकता है। ‘तड़प उठा’ उस तीव्र शारीरिक व्याकुलता को रखता है और अगले ‘काँप उठीं’ से अनावश्यक समानता से बचता है।
- source_word: אַף
  choice: यहाँ तक कि ... भी
  rationale: 'यह पद दूसरे खंड को तीव्र करता है: केवल जल ही नहीं, गहराइयाँ भी प्रतिक्रिया करती हैं।'
- source_word: יִרְגְּזוּ
  choice: काँप उठीं
  rationale: רגז का काँपने या थरथराने का सामान्य भाव स्पष्ट और स्वाभाविक हिन्दी में व्यक्त होता है।
- source_word: תְהֹמוֹת
  choice: गहराइयाँ
  rationale: תהום का बहुवचन गहरे जल अथवा महासागरीय गहराइयों की ओर संकेत करता है। ‘गहराइयाँ’ बहुवचन और ब्रह्मांडीय जल-छवि दोनों को सुरक्षित रखता है।
theological_decisions:
- issue: परमेश्वर के सामने ब्रह्मांडीय जल का मानवीकरण
  choice: जल और गहराइयों को परमेश्वर की उपस्थिति पर सजीव ढंग से प्रतिक्रिया करते हुए रखा गया है।
  alternative: इसे केवल लाल समुद्र की घटना का सीधा उल्लेख या पौराणिक समुद्री शक्तियों के साथ युद्ध मानकर अनुवाद करना।
  rationale: मूल पद सृष्टि के जल को परमेश्वर के सामने तड़पते और काँपते हुए चित्रित करता है, पर इसके संकेत का दायरा स्वयं निश्चित नहीं करता। अनुवाद इस तनाव को व्याख्यात्मक विस्तार के बिना बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण काव्यात्मक शैली अपनाई गई है। मूल की पुनरावृत्ति, समानांतरता और जल के मानवीकरण को बनाए रखा गया है; ‘तड़प उठा’ और ‘काँप उठीं’ अलग-अलग इब्रानी क्रियाओं का अंतर दर्शाते हैं।
