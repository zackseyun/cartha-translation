  yaml_path: translation/ot/psalms/077/008.yaml
  text: Has his steadfast love ceased forever? Has his promise come to an end for generation after generation?[a]
translation:
  language: hi
  text: क्या उसका अटल प्रेम सदा के लिए समाप्त हो गया है? क्या उसका वचन पीढ़ी-दर-पीढ़ी के लिए समाप्त हो गया है?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्या उसकी प्रतिज्ञा पीढ़ी-दर-पीढ़ी के लिए समाप्त हो गई है?”
    reason: אֹמֶר का सीधा अर्थ ‘वचन/कथन’ है, पर इस सन्दर्भ में इसका अर्थ ‘प्रतिज्ञा’ भी हो सकता है।
lexical_decisions:
- source_word: הֶאָפֵס
  choice: समाप्त हो गया है
  rationale: प्रश्नवाचक उपसर्ग सहित पूर्ण क्रिया किसी वस्तु के मिट जाने या अंत हो जाने की आशंका व्यक्त करती है; यह प्रयोग आधुनिक हिन्दी में स्वाभाविक है।
- source_word: לָנֶצַח
  choice: सदा के लिए
  rationale: यह स्थायी अथवा अनंत अवधि का सामान्य कालवाचक मुहावरा है; हिन्दी में ‘सदा के लिए’ प्रश्न की तीव्रता बनाए रखता है।
- source_word: חַסְדּוֹ
  choice: उसका अटल प्रेम
  rationale: חֶסֶד में प्रेम, निष्ठा और स्थिरता का भाव है। ‘अटल प्रेम’ सहज हिन्दी में इन भावों को संक्षेप में व्यक्त करता है, बिना पद में ‘वाचा’ को स्पष्टतः जोड़ने के।
- source_word: גָּמַר
  choice: चुक गया है
  rationale: क्रिया पूर्ण हो जाने अथवा समाप्त हो जाने को दर्शाती है। ‘चुक गया है’ पहले प्रश्न के ‘समाप्त’ को अनावश्यक रूप से दोहराए बिना समानांतर विलाप को स्वाभाविक बनाता है।
- source_word: אֹמֶר
  choice: वचन
  rationale: मूल शब्द का सीधा अर्थ ‘कथन/वचन’ है। सन्दर्भ में यह परमेश्वर की प्रतिज्ञा का संकेत दे सकता है, पर ‘वचन’ उस अर्थ को जबरन निश्चित किए बिना मूल की व्यापकता और धर्मवैचारिक तनाव बनाए रखता है।
- source_word: לְדֹר וָדֹר
  choice: पीढ़ी-दर-पीढ़ी के लिए
  rationale: यह लगातार आने वाली पीढ़ियों में अवधि बने रहने का भाव देता है; चुना गया हिन्दी मुहावरा पुनरावृत्तिमूलक बल सुरक्षित रखता है।
theological_decisions:
- issue: אֹמֶר को सामान्य ‘वचन’ माना जाए या सन्दर्भगत ‘प्रतिज्ञा’
  choice: वचन
  alternative: प्रतिज्ञा
  rationale: समानांतरता और विलाप का सन्दर्भ परमेश्वर की प्रतिज्ञा की ओर संकेत कर सकते हैं, किन्तु इब्रानी संज्ञा स्वयं अधिक व्यापक है। मुख्य पाठ में ‘वचन’ रखने से वास्तविक lexical ambiguity बनी रहती है; सम्भावित सन्दर्भगत अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और विलाप के दो समानांतर प्रश्नों के अनुरूप रखी गई है। ‘अटल प्रेम’ חֶסֶד की निष्ठा और स्थिरता को सहज हिन्दी में व्यक्त करता है; ‘वचन’ मूल की अस्पष्टता को ‘प्रतिज्ञा’ की अपेक्षा बेहतर सुरक्षित रखता है।
