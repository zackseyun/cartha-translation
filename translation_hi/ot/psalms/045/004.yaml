id: PSA.45.4
reference: Psalms 45:4
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/הֲדָ֬רְ/ךָ֨ צְלַ֬ח רְכַ֗ב עַֽל דְּבַר אֱ֭מֶת וְ/עַנְוָה צֶ֑דֶק וְ/תוֹרְ/ךָ֖ נוֹרָא֣וֹת יְמִינֶֽ/ךָ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/045/004.yaml
  text: In your majesty ride on victoriously for the cause of truth and meekness and righteousness[b][a]; let your right hand teach you awesome deeds.
translation:
  language: hi
  text: अपने प्रताप में सत्य, नम्रता और धार्मिकता के निमित्त विजयपूर्वक सवार होकर आगे बढ़; तेरा दाहिना हाथ तुझे विस्मयकारी काम सिखाएगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तेरा दाहिना हाथ तुझे भयावह काम दिखाए,” अथवा, “तेरा दाहिना हाथ तुझे विस्मयकारी काम करना सिखाए।”
    reason: इब्रानी क्रिया का अर्थ “सिखाना” या “दिखाना” और נוֹרָאוֹת का अर्थ विस्मय अथवा भय जगाने वाली बातें हो सकता है।
lexical_decisions:
- source_word: וַהֲדָרְךָ
  choice: अपने प्रताप में
  rationale: הָדָר का अर्थ प्रताप, वैभव या महिमा है। यहाँ संबंधसूचक रूप को अगले आदेशों के साथ स्वाभाविक रूप से जोड़कर राजसी गरिमा व्यक्त की गई है।
- source_word: צְלַח רְכַב
  choice: विजयपूर्वक सवार होकर आगे बढ़
  rationale: צְלַח सफलता या विजयी प्रगति और רְכַב सवारी करने का आदेश व्यक्त करता है। संयुक्त अनुवाद राजसी-योद्धा की गतिशील छवि बनाए रखता है।
- source_word: עַל דְּבַר אֱמֶת
  choice: सत्य ... के निमित्त
  rationale: עַל־דְּבַר यहाँ किसी विषय, कारण या उद्देश्य की ओर संकेत कर सकता है। 'के निमित्त' सत्य के पक्ष में की गई राजकीय कार्रवाई का भाव देता है।
- source_word: וְעַנְוָה צֶדֶק
  choice: नम्रता और धार्मिकता
  rationale: इब्रानी पदबंध संक्षिप्त और व्याकरणतः तनावपूर्ण है। दोनों संज्ञाओं को समन्वित रूप में रखना अर्थ को अनावश्यक रूप से 'नम्र धार्मिकता' में सीमित नहीं करता।
- source_word: וְתוֹרְךָ
  choice: तुझे ... सिखाएगा
  rationale: हिफ़ील रूप 'सिखाना, दिखाना या मार्ग बताना' व्यक्त करता है; स्त्रीलिंग कर्ता 'तेरा दाहिना हाथ' है। भविष्यसूचक कथन मूल रूपरचना को आदेशात्मक 'करने दे' की अपेक्षा अधिक सीधे रखता है।
- source_word: נוֹרָאוֹת
  choice: विस्मयकारी काम
  rationale: यह शब्द भय अथवा विस्मय जगाने वाली बातों या कर्मों को सूचित करता है। 'विस्मयकारी काम' हिंदी में न तो केवल भयानकता तक अर्थ सीमित करता है, न मूल की प्रचंडता मिटाता है।
- source_word: יְמִינֶךָ
  choice: तेरा दाहिना हाथ
  rationale: शक्ति, कौशल और विजय की मूल राजसी-योद्धा छवि को अक्षरशः बनाए रखा गया है।
theological_decisions:
- issue: राजा-योद्धा की छवि और भजन का बाद का मसीही पठन
  choice: पद में राजा को किया गया प्रत्यक्ष संबोधन और योद्धा-छवि बनाए रखी गई है।
  alternative: अनुवाद में प्रत्यक्ष मसीही संदर्भ जोड़ना।
  rationale: मूल पद का ऐतिहासिक-साहित्यिक संबोधन राजा से है। ऐसा अनुवाद बाद की धर्मवैज्ञानिक व्याख्या की संभावना खुली रखता है, पर उसे पद के शब्दों में आरोपित नहीं करता।
- issue: עַנְוָה צֶדֶק का संबंध
  choice: नम्रता और धार्मिकता
  alternative: नम्र धार्मिकता; धार्मिकता की नम्रता
  rationale: मूल रचना अत्यंत संक्षिप्त है और दोनों शब्दों का ठीक संबंध विवादित है। समन्वित अनुवाद दोनों स्वतंत्र धारणाओं को सुनाई देता है और कृत्रिम रूप से गुण-संबंध निर्धारित नहीं करता।
- issue: וְתוֹרְךָ का वाक्य-बल
  choice: तेरा दाहिना हाथ तुझे ... सिखाएगा
  alternative: तेरा दाहिना हाथ तुझे ... सिखाए
  rationale: रूप को सामान्य भविष्यसूचक कथन मानना उसकी रूपरचना के निकट है; काव्य-संदर्भ में आज्ञार्थक या इच्छार्थक छाया संभव है, इसलिए विकल्प पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण काव्यात्मक एकवचन संबोधन रखा गया है। 'प्रताप', 'धार्मिकता' और 'दाहिना हाथ' बाइबिलीय राजसी शैली बनाए रखते हैं, जबकि वाक्य-विन्यास सामान्य पाठक के लिए स्पष्ट है।
