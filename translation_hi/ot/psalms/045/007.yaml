id: PSA.45.7
reference: Psalms 45:7
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אָהַ֣בְתָּ צֶּדֶק֮ וַ/תִּשְׂנָ֫א רֶ֥שַׁע עַל כֵּ֤ן מְשָׁחֲ/ךָ֡ אֱלֹהִ֣ים אֱ֭לֹהֶי/ךָ שֶׁ֥מֶן שָׂשׂ֗וֹן מֵֽ/חֲבֵרֶֽי/ךָ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/045/007.yaml
  text: You have loved righteousness and hated wickedness[a]; therefore God, your God[b], has anointed you with the oil of gladness beyond your companions.
translation:
  language: hi
  text: तू ने धार्मिकता से प्रेम किया और दुष्टता से घृणा की; इसलिए परमेश्वर, तेरे परमेश्वर ने[a], तुझे तेरे साथियों से बढ़कर आनन्द के तेल से अभिषेक किया है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इसलिए, हे परमेश्वर, तेरे परमेश्वर ने तुझे तेरे साथियों से बढ़कर आनन्द के तेल से अभिषेक किया है।” पहले “परमेश्वर” को क्रिया का कर्ता मानने के बजाय सम्बोधन के रूप में भी पढ़ा जा सकता है।
    reason: alternative_reading
  - marker: b
    text: यह पद इब्रानियों 1:9 में उद्धृत है।
    reason: cross_reference
lexical_decisions:
- source_word: אָהַבְתָּ
  choice: तू ने प्रेम किया
  rationale: काल रूप पूर्ण क्रिया, द्वितीय पुरुष एकवचन पुल्लिंग है। हिन्दी का सामान्य पूर्ण भूतकाल राजकीय संबोधन और स्थापित चरित्र—दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: צֶּדֶק
  choice: धार्मिकता
  rationale: यहाँ नैतिक रूप से सही और न्यायपूर्ण आचरण का भाव है। ‘धार्मिकता’ काव्यात्मक तथा धर्मवैचारिक भार बनाए रखती है।
- source_word: וַתִּשְׂנָא
  choice: और घृणा की
  rationale: दूसरे पुरुष के सीधे वर्णन को पहले खंड के समानांतर और स्वाभाविक हिन्दी में रखा गया है।
- source_word: רֶשַׁע
  choice: दुष्टता
  rationale: नैतिक बुराई का संज्ञात्मक अर्थ सुरक्षित रहता है और ‘धार्मिकता’ के साथ स्पष्ट विरोध बनता है।
- source_word: עַל כֵּן
  choice: इसलिए
  rationale: यह पूर्ववर्ती नैतिक विशेषताओं से अभिषेक का परिणाम अथवा आधार जोड़ने वाला सामान्य निष्कर्षसूचक पद है।
- source_word: מְשָׁחֲךָ
  choice: तुझे ... अभिषेक किया है
  rationale: मूल पूर्ण क्रिया और द्वितीय पुरुष कर्म प्रत्यय को रखते हुए राजकीय अथवा प्रतिष्ठापन-संबंधी अभिषेक का अर्थ स्पष्ट किया गया है।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: मुख्य पाठ में पहले אֱלֹהִים को क्रिया का कर्ता माना गया है; सम्बोधन ‘हे परमेश्वर’ वाली वास्तविक व्याकरणिक सम्भावना पादटिप्पणी में सुरक्षित है।
- source_word: אֱלֹהֶיךָ
  choice: तेरे परमेश्वर
  rationale: द्वितीय पुरुष एकवचन प्रत्यय को सीधे रूप में रखा गया है और मुख्य पाठ में यह पहले ‘परमेश्वर’ का समानाधिकरण करता है।
- source_word: שֶׁמֶן שָׂשׂוֹן
  choice: आनन्द के तेल
  rationale: रचना का शाब्दिक सम्बन्ध और उत्सव, कृपा तथा प्रतिष्ठा का काव्यात्मक भाव दोनों सुरक्षित रहते हैं।
- source_word: מֵחֲבֵרֶיךָ
  choice: तेरे साथियों से बढ़कर
  rationale: מן के तुलनात्मक अर्थ को स्पष्ट, सहज हिन्दी में व्यक्त करता है; सम्बोधित व्यक्ति को उसके साथियों से ऊपर प्रतिष्ठित किए जाने का भाव बना रहता है।
theological_decisions:
- issue: אֱלֹהִים की वाक्यगत भूमिका
  choice: पहले אֱלֹהִים को कर्ता मानकर ‘परमेश्वर, तेरे परमेश्वर ने’
  alternative: पहले אֱלֹהִים को सम्बोधन मानकर ‘इसलिए, हे परमेश्वर, तेरे परमेश्वर ने’
  rationale: इब्रानी वाक्यरचना दोनों पाठों की अनुमति देती है। मुख्य पाठ इस पद की क्रियात्मक संरचना में सहज कर्ता-पाठ अपनाता है, पर धर्मवैचारिक तनाव को मिटाने के बजाय सम्बोधन-पाठ को पादटिप्पणी में रखा गया है।
- issue: इब्रानियों 1:9 में उद्धरण
  choice: पादटिप्पणी में पार-सन्दर्भ देना
  alternative: मुख्य पाठ में नए नियम की व्याख्या को स्पष्ट करना
  rationale: पद का अनुवाद पहले उसके इब्रानी स्रोत और भजन के प्रसंग से किया गया है; नए नियम का सम्बन्ध उपयोगी पार-सन्दर्भ है, पर उसे मुख्य पाठ पर व्याख्यात्मक रूप से आरोपित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण काव्यात्मक शैली रखी गई है। मूल का एकवचन आत्मीय/राजकीय संबोधन बनाए रखने के लिए ‘तू/तेरे/तुझे’ चुना गया है। ‘धार्मिकता’, ‘दुष्टता’, ‘अभिषेक’ और ‘आनन्द के तेल’ जैसे पद सामान्य बाइबलीय हिन्दी में बोधगम्य रहते हुए मूल के नैतिक और राजकीय स्वर को सुरक्षित रखते हैं।
