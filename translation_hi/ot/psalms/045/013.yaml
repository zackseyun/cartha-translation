  text: כָּל כְּבוּדָּ֣ה בַת מֶ֣לֶךְ פְּנִ֑ימָה מִֽ/מִּשְׁבְּצ֖וֹת זָהָ֣ב לְבוּשָֽׁ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/045/013.yaml
  text: All glorious is the king’s daughter within[b][a]; her clothing is of woven gold.
translation:
  language: hi
  text: राजा की बेटी भीतर पूरी तरह शोभायमान है[a]; उसका वस्त्र सोने की बुनावट का है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “राजा की बेटी भीतर पूरी तरह शोभायमान है,” जहाँ “भीतर” उसके आंतरिक सौंदर्य की ओर या महल अथवा कक्ष के अंदर उसकी उपस्थिति की ओर संकेत कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “उसका वस्त्र सोने की जड़ाई से सजा है” अथवा “सोने से कढ़ा हुआ है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל כְּבוּדָּה
  choice: पूरी शोभा से सजी है
  rationale: כָּל यहाँ तीव्रतासूचक है और כְּבוּדָּה वैभव या शोभा व्यक्त करता है। यह हिंदी वाक्यांश स्वाभाविक ढंग से उसकी संपूर्ण राजसी शोभा बताता है।
- source_word: בַת מֶלֶךְ
  choice: राजा की बेटी
  rationale: हिब्रू की संबंधवाचक अभिव्यक्ति को सीधे सुरक्षित रखता है; केवल ‘राजकुमारी’ कहना संभव है, पर स्रोत की बनावट कम स्पष्ट करता है।
- source_word: פְּנִימָה
  choice: भीतर
  rationale: स्थानवाचक मूल अर्थ को बनाए रखता है और महल या कक्ष के भीतर होने तथा अंतःशोभा की संभावित व्याख्याओं को निर्णायक रूप से नहीं चुनता।
- source_word: מִמִּשְׁבְּצוֹת זָהָב
  choice: सोने की बुनावट से बना
  rationale: מִשְׁבְּצוֹת जड़ी हुई, खानेदार, कढ़ी हुई या बुनी सजावट का संकेत दे सकता है। वस्त्र के संदर्भ में ‘बुनावट’ सहज है, जबकि अन्य संभावनाएँ पादटिप्पणी में रखी गई हैं।
- source_word: לְבוּשָׁהּ
  choice: उसका वस्त्र
  rationale: पहनावे के लिए स्वाभाविक और गरिमापूर्ण हिंदी; यह किसी खास प्रकार के चोगे या पोशाक को अनावश्यक रूप से निश्चित नहीं करता।
theological_decisions:
- issue: פְּנִימָה का स्थानवाचक या अंतःगुण-संबंधी अर्थ
  choice: मुख्य पाठ में ‘भीतर’, स्थानवाचक अस्पष्टता सहित
  alternative: ‘उसकी भीतरी सुंदरता’ अथवा ‘भीतरी कक्ष में’
  rationale: हिब्रू पद स्वयं संक्षिप्त और अर्थगत रूप से खुला है; मुख्य पाठ में किसी आध्यात्मिक या मनोवैज्ञानिक अर्थ को थोपना उचित नहीं।
translation_notes:
  register: आधुनिक मानक हिंदी; काव्यात्मक और राजसी गरिमा बनाए रखते हुए सामान्य पाठक के लिए सहज शब्दावली। मुख्य पाठ में मूल की संक्षिप्तता और अस्पष्टता सुरक्षित है।
