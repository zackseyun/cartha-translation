  text: In embroidered garments she is led to the king[a]; virgins behind her, her companions[c][b], are brought to you.
translation:
  language: hi
  text: कढ़ाईदार वस्त्रों में उसे राजा के पास ले जाया जाता है[a]; उसके पीछे चलने वाली कुँवारियाँ[b], उसकी सहेलियाँ, तेरे पास लाई जाती हैं[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “कढ़ाई किए हुए वस्त्रों में उसे राजा के पास लाया जाता है।”
    reason: lexical_alternative
  - marker: b
    text: “कुँवारियाँ” का अनुवाद “युवतियाँ” भी हो सकता है, पर इब्रानी शब्द अधिक विशेष रूप से अविवाहित कुँवारी स्त्रियों को सूचित करता है।
    reason: lexical_alternative
  - marker: c
    text: “तेरे पास” मूल इब्रानी के स्त्रीलिंग एकवचन संबोधन के अनुसार है; यहाँ सम्भवतः दुल्हन को सीधे संबोधित किया गया है। कुछ अनुवाद इसे सहज बनाकर राजा की ओर संबोधन मानते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: לִרְקָמוֹת
  choice: कढ़ाईदार वस्त्रों में
  rationale: רְקָמוֹת कढ़ाई या रंग-बिरंगे वस्त्र-कार्य को सूचित करता है। विवाह-यात्रा और वस्त्र-संदर्भ के कारण हिन्दी में “वस्त्रों” जोड़ना अर्थ को स्वाभाविक और स्पष्ट बनाता है।
- source_word: תּוּבַל
  choice: उसे ... ले जाया जाता है
  rationale: यह יבל का होफ़अल रूप है, जिसका अर्थ निष्क्रिय भाव में ‘लाई/ले जाई जाती है’ है। समारोहपूर्ण यात्रा के संदर्भ में “ले जाया जाता है” उपयुक्त है।
- source_word: לַמֶּלֶךְ
  choice: राजा के पास
  rationale: ל दिशा को सूचित करता है; यहाँ दुल्हन को राजा की ओर ले जाने का सीधा अर्थ है।
- source_word: בְּתוּלוֹת
  choice: कुँवारियाँ
  rationale: यह शब्द विशेष रूप से अविवाहित कुँवारी स्त्रियों को सूचित करता है। “युवतियाँ” अधिक व्यापक होता, इसलिए “कुँवारियाँ” मूल की विशिष्टता बचाता है।
- source_word: אַחֲרֶיהָ
  choice: उसके पीछे चलनेवाली
  rationale: शोभायात्रा के संदर्भ में स्थानिक और क्रमिक दोनों भाव स्वाभाविक रूप से व्यक्त होते हैं।
- source_word: רֵעוֹתֶיהָ
  choice: उसकी सहेलियाँ
  rationale: स्त्रीलिंग बहुवचन रूप निकट संगिनियों या सहेलियों को सूचित करता है; यह उनके औपचारिक पद को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: מוּבָאוֹת
  choice: लाई जाती हैं
  rationale: בוא का होफ़अल स्त्रीलिंग बहुवचन कृदंत निष्क्रिय रूप से ‘लाई जाती हैं’ बताता है और कुँवारियों/सहेलियों से मेल खाता है।
- source_word: לָךְ
  choice: तेरे पास
  rationale: मसोरेटी पाठ में प्रत्यय द्वितीय पुरुष स्त्रीलिंग एकवचन है। “तेरे” दुल्हन को सीधे संबोधन में हुए काव्यात्मक परिवर्तन को सुरक्षित रखता है।
theological_decisions:
- issue: अंतिम सर्वनाम לָךְ में संबोधन का परिवर्तन
  choice: द्वितीय पुरुष स्त्रीलिंग को “तेरे पास” के रूप में बनाए रखा गया है।
  alternative: इसे राजा की ओर संकेत मानकर “उसके पास/राजा के पास” करना, अथवा “उसके साथ” कहकर वाक्य को सहज बनाना।
  rationale: मसोरेटी पाठ स्पष्ट रूप से स्त्रीलिंग एकवचन संबोधन रखता है, जिससे दुल्हन के वर्णन से सीधे उसी को संबोधित करने की काव्यात्मक तब्दीली आती है। मूल-पाठ की इस तनावपूर्ण संरचना को समतल नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, काव्यात्मक किन्तु सहज रूप अपनाया गया है। “कढ़ाईदार वस्त्र,” “सहेलियाँ,” और निष्क्रिय क्रियाएँ विवाह-शोभायात्रा का दृश्य स्पष्ट करती हैं। “तेरे” का प्रयोग स्त्रीलिंग संबोधन को हिन्दी में दृश्य बनाता है और भजन की काव्यात्मक निकटता बनाए रखता है।
