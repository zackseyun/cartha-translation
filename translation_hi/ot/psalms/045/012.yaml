lexical_decisions:
- source_word: וּבַת צֹר
  choice: और सोर की बेटी
  rationale: संयोजक וּ को ‘और’ से व्यक्त किया गया है। किसी नगर के नाम के साथ ‘बेटी’ उस नगर अथवा उसके लोगों का मानवीकरण करने वाला इब्रानी प्रयोग है; इसे बनाए रखने से काव्यात्मक बिंब सुरक्षित रहता है। צֹר का प्रचलित हिन्दी रूप ‘सोर’ है।
- source_word: בְּמִנְחָה
  choice: भेंट लेकर
  rationale: מִנְחָה का अर्थ प्रसंगानुसार भेंट, चढ़ावा या कर-स्वरूप उपहार हो सकता है। राजकीय प्रसंग में ‘भेंट’ स्वाभाविक है, और ‘लेकर’ इब्रानी בְּ के आशय को सहज हिन्दी में व्यक्त करता है।
- source_word: פָּנַיִךְ יְחַלּוּ
  choice: वे तेरा अनुग्रह चाहेंगे
  rationale: शाब्दिक रूप से ‘तेरा मुख मनाएँगे/विनती करेंगे’ स्त्रीलिंग एकवचन संबोधन है। यह मुहावरा किसी की कृपा पाने की विनती को बताता है; ‘तेरा अनुग्रह चाहेंगे’ अर्थ को स्पष्ट और गरिमापूर्ण हिन्दी में रखता है।
- source_word: עֲשִׁירֵי עָם
  choice: लोगों में जो धनवान हैं
  rationale: समास-पद का अर्थ किसी जनसमूह के धनवान लोग है। यह रूप किसी अनिर्दिष्ट जातीय समूह को जोड़ने से बचता है और हिन्दी में स्वाभाविक है।
