base_translation:
  language: en
  yaml_path: translation/ot/psalms/045/001.yaml
  text: My heart overflows with a good word[a]; I say[c][b], “My work is for the king.” My tongue is the pen of a skillful scribe.
translation:
  language: hi
  text: मेरे हृदय में एक उत्तम वचन[a] उमड़ रहा है; मैं कहता हूँ, “मेरी रचना राजा के लिए[b] है।” मेरी जीभ एक निपुण[c] लेखक की कलम है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “एक मनोहर विषय” अथवा “एक उत्तम बात।” हिब्रू पदबंध स्वयं शब्दों या व्यक्त की जा रही विषयवस्तु—दोनों की ओर संकेत कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “राजा के विषय में” अथवा “राजा को।” हिब्रू संबंधसूचक शब्द समर्पण, विषयवस्तु या संबोधन व्यक्त कर सकता है।
    reason: lexical_alternative
  - marker: c
    text: या “तत्पर” अथवा “तेज लेखक।” हिब्रू विशेषण अभ्यासजन्य निपुणता के साथ शीघ्रता या तत्परता पर भी बल दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: רָחַשׁ
  choice: उमड़ रहा है
  rationale: क्रिया भीतर उठने या बुलबुलाने और फिर अभिव्यक्ति में बह निकलने का बिंब देती है; ‘उमड़ रहा है’ काव्यात्मक और सहज है।
- source_word: לִבִּי
  choice: मेरा हृदय
  rationale: हिब्रू में विचार और भाव के भीतरी केंद्र का सामान्य काव्यात्मक उल्लेख; शाब्दिक बिंब बनाए रखा गया है।
- source_word: דָּבָר טוֹב
  choice: एक उत्तम वचन
  rationale: דבר ‘वचन/बात/विषय’ के व्यापक अर्थ रखता है। ‘उत्तम वचन’ मूल रूप के निकट रहते हुए स्वाभाविक हिंदी देता है; विषयवस्तु वाला अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: אֹמֵר אֲנִי
  choice: मैं कहता हूँ
  rationale: यह सरल और प्रत्यक्ष वाणी-सूचक अभिव्यक्ति है; ‘सुनाता हूँ’ संभव है, पर वह काव्य-पाठ का भाव अधिक निश्चित कर देता।
- source_word: מַעֲשַׂי
  choice: मेरी रचना
  rationale: इस राजकीय गीत के साहित्यिक संदर्भ में शब्द कवि की बनाई हुई कृति की ओर संकेत करता है। ‘रचना’ हिंदी में स्वाभाविक है और ‘कर्मों’ की संभावित भ्रामक समझ से बचाता है।
- source_word: לְמֶלֶךְ
  choice: राजा के लिए
  rationale: לְ समर्पण, विषय या संबोधन बता सकता है। ‘राजा के लिए’ संदर्भ में सहज है, जबकि अन्य संभावनाएँ पादटिप्पणी में दी गई हैं।
- source_word: לְשׁוֹנִי
  choice: मेरी जीभ
  rationale: कविता के शरीर-अंग वाले मूल रूपक को ‘वाणी’ कहकर सपाट करने के बजाय सुरक्षित रखा गया है।
- source_word: עֵט
  choice: कलम
  rationale: लेखन-साधन के लिए आधुनिक हिंदी का स्वाभाविक शब्द है और रूपक को स्पष्ट रखता है।
- source_word: סוֹפֵר
  choice: लेखक
  rationale: यहाँ पेशेवर और दक्ष लिखने वाले का आशय है। ‘लेखक’ साधारण पाठक के लिए ‘शास्त्री’ या ‘लिपिक’ से अधिक सहज है और लेखन-रूपक से सीधे जुड़ता है।
- source_word: מָהִיר
  choice: निपुण
  rationale: विशेषण शीघ्रता, तत्परता या अभ्यासजन्य दक्षता व्यक्त कर सकता है। कलम के रूपक में ‘निपुण’ प्रवाहपूर्ण लेखन का स्वाभाविक आशय देता है; ‘तत्पर’ विकल्प पादटिप्पणी में है।
