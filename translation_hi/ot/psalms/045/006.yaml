source:
  edition: WLC
  text: כִּסְאֲ/ךָ֣ אֱ֭לֹהִים עוֹלָ֣ם וָ/עֶ֑ד שֵׁ֥בֶט מִ֝ישֹׁ֗ר שֵׁ֣בֶט מַלְכוּתֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/045/006.yaml
  text: Your throne[a], O God, is forever and ever[b]; the scepter of your kingdom is a scepter of uprightness.
translation:
  language: hi
  text: हे परमेश्वर, आपका सिंहासन[a] सदा-सर्वदा है; आपके राज्य का राजदंड न्याय का राजदंड है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा, “आपका सिंहासन परमेश्वर है, सदा-सर्वदा,” या “आपका दिव्य सिंहासन सदा-सर्वदा है।” इब्रानी वाक्यरचना पर मतभेद है; मुख्य पाठ में इसे संबोधन माना गया है।
    reason: alternative_reading
  - marker: b
    text: अथवा, “न्याय का राजदंड आपके राज्य का राजदंड है।”
    reason: previous_rendering
lexical_decisions:
- source_word: כִּסְאֲךָ
  choice: आपका सिंहासन
  rationale: כִּסֵּא राजकीय आसन और शासन-अधिकार का संकेत है; इस राजकीय भजन में ‘सिंहासन’ स्वाभाविक और सटीक है।
- source_word: אֱלֹהִים
  choice: हे परमेश्वर
  rationale: मुख्य पाठ में אֱלֹהִים को संबोधन माना गया है। ‘हे परमेश्वर’ आधुनिक हिंदी में प्रत्यक्ष संबोधन को स्पष्ट और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: עוֹלָם וָעֶד
  choice: सदा-सर्वदा
  rationale: यह युग्म निरंतर और अनंत स्थायित्व पर बल देता है; ‘सदा-सर्वदा’ उसी काव्यात्मक और बलात्मक अर्थ को स्वाभाविक हिंदी में रखता है।
- source_word: שֵׁבֶט
  choice: राजदंड
  rationale: राजकीय संदर्भ में שֵׁבֶט सामान्य छड़ी नहीं, बल्कि राजा के शासन-अधिकार का प्रतीक राजदंड है।
- source_word: מִישֹׁר
  choice: न्याय
  rationale: מִישֹׁר का मूल भाव सीधापन, निष्पक्षता और नैतिक खराई है। राजकीय शासन के संदर्भ में ‘न्याय’ सहज हिंदी है और निष्पक्ष, सही शासन का भाव देता है।
- source_word: שֵׁבֶט מַלְכוּתֶךָ
  choice: आपके राज्य का राजदंड
  rationale: यह अनुवाद इब्रानी संबंधवाचक रचना को बनाए रखता है और מַלְכוּת को यहाँ ‘राज्य’ के रूप में स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: पहले खंड में אֱלֹהִים की वाक्यगत और धर्मवैचारिक भूमिका
  choice: 'संबोधन: ‘हे परमेश्वर, आपका सिंहासन सदा-सर्वदा बना रहता है’'
  alternative: 'विधेयात्मक पाठ: ‘आपका सिंहासन सदा-सर्वदा परमेश्वर है’; या गुणसूचक अर्थ: ‘आपका दिव्य सिंहासन सदा-सर्वदा बना रहता है’'
  rationale: इब्रानी वाक्यरचना पर मतभेद है, पर संदर्भ में संबोधन-पाठ स्वाभाविक है और प्राचीन ग्रहण-परंपरा में भी प्रमुख है। अन्य गंभीर संभावनाओं को दबाने के बजाय पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी का सहज, गरिमापूर्ण और काव्यात्मक रूप अपनाया गया है। ‘आपका’ आदरसूचक संबोधन है; ‘राजदंड’ राजकीय बिंब बनाए रखता है। मुख्य पाठ स्वाभाविक हिंदी वाक्यक्रम अपनाता है, जबकि इब्रानी की वास्तविक वाक्यगत अस्पष्टता पादटिप्पणी में सुरक्षित है।
