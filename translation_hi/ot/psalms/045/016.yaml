  text: תַּ֣חַת אֲ֭בֹתֶי/ךָ יִהְי֣וּ בָנֶ֑י/ךָ תְּשִׁיתֵ֥/מוֹ לְ֝/שָׂרִ֗ים בְּ/כָל הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/045/016.yaml
  text: In place of your fathers will be your sons[b][a]; you will appoint them as princes in all the earth.
translation:
  language: hi
  text: तेरे पुरखाओं के स्थान पर तेरे पुत्र होंगे; तू उन्हें सारी पृथ्वी पर राजकुमार ठहराएगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सारे देश में।” इब्रानी शब्द אֶרֶץ का अर्थ संदर्भ के अनुसार “पृथ्वी” या “देश” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּחַת
  choice: के स्थान पर
  rationale: यहाँ शब्द स्थानगत ‘नीचे’ नहीं, बल्कि उत्तराधिकार में किसी का स्थान लेने का भाव देता है।
- source_word: אֲבֹתֶיךָ
  choice: तेरे पुरखाओं
  rationale: शाब्दिक अर्थ ‘तेरे पिता’ है, पर बहुवचन और राजवंशीय संदर्भ में आधुनिक हिन्दी का ‘पुरखाओं’ पूर्वजों का आशय स्वाभाविक रूप से व्यक्त करता है।
- source_word: יִהְיוּ
  choice: होंगे
  rationale: यह उत्तराधिकार संबंधी सरल भविष्यवाचक कथन है।
- source_word: בָנֶיךָ
  choice: तेरे पुत्र
  rationale: इब्रानी शब्द पुल्लिंग बहुवचन है और राजवंशीय उत्तराधिकारियों को सूचित करता है।
- source_word: תְּשִׁיתֵמוֹ
  choice: तू उन्हें ... ठहराएगा
  rationale: मूल क्रिया का अर्थ ‘रखना/स्थापित करना’ है; शासकीय पद के संदर्भ में ‘ठहराना’ नियुक्ति और स्थापना दोनों का भाव बनाए रखता है।
- source_word: לְשָׂרִים
  choice: राजकुमार
  rationale: שָׂרִים का अर्थ प्रधान, शासक या राजकुमार हो सकता है; राजकीय प्रसंग में ‘राजकुमार’ गरिमापूर्ण और निकट समतुल्य है।
- source_word: בְּכָל הָאָרֶץ
  choice: सारी पृथ्वी पर
  rationale: אֶרֶץ का अर्थ ‘पृथ्वी’ या ‘देश’ दोनों हो सकता है। स्तोत्र के व्यापक राजकीय स्वर के कारण मुख्य पाठ में ‘पृथ्वी’ चुना गया है, जबकि ‘देश’ की संभावना पादटिप्पणी में रखी गई है।
theological_decisions:
- issue: राजकीय अथवा मसीही संदर्भ में הָאָרֶץ का विस्तार
  choice: सारी पृथ्वी पर
  alternative: सारे देश में
  rationale: इब्रानी दोनों अर्थों की अनुमति देता है। मुख्य पाठ में व्यापक अर्थ लिया गया है, पर बाद की किसी धर्मसैद्धांतिक व्याख्या को अनिवार्य किए बिना संकीर्ण भौगोलिक अर्थ पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी; एकवचन राजकीय संबोधन के लिए ‘तेरे/तू’ रखा गया है। ‘पुरखाओं’ राजवंशीय पूर्वजों का भाव स्पष्ट करता है।
