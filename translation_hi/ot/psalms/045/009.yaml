- source_word: שֵׁגַל
  choice: रानी
  rationale: यह संज्ञा राजा की पत्नी अथवा राजसंगिनी को सूचित करती है; आधुनिक हिंदी में ‘रानी’ सबसे स्वाभाविक और गरिमापूर्ण समतुल्य है।
- source_word: לִימִינְךָ
  choice: तेरे दाहिने हाथ पर
  rationale: यह पदस्थान और सम्मान के राजकीय बिंब को बनाए रखने वाला प्रचलित हिंदी प्रयोग है।
- source_word: בְּכֶתֶם אוֹפִיר
  choice: ओपीर के सोने से सजी
  rationale: כֶּתֶם उत्तम सोने को दर्शाता है और אוֹפִיר उसके प्रसिद्ध स्रोत को; ‘से सजी’ प्रसंग में निहित अलंकरण को स्वाभाविक हिंदी में व्यक्त करता है।
