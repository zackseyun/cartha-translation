  yaml_path: translation/ot/psalms/045/009.yaml
  text: Daughters of kings are among your honored women[b][a]; at your right hand stands the queen in gold of Ophir.
translation:
  language: hi
  text: राजाओं की बेटियाँ तेरी सम्मानित स्त्रियों[a] के बीच हैं; तेरी दाहिनी ओर ओपीर के उत्तम सोने[b] से सजी रानी खड़ी है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस कठिन इब्रानी पद का अनुवाद ‘तेरे बहुमूल्य जनों में’ या ‘तेरी कुलीन स्त्रियों में’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘ओपीर का सोना’ उत्तम कोटि का सोना था। पुराने नियम में ओपीर अपने धन और सोने के लिए प्रसिद्ध स्थान है।
    reason: cultural_note
