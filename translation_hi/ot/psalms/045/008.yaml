  yaml_path: translation/ot/psalms/045/008.yaml
  text: All your garments are fragrant with myrrh[a], aloes, and cassia; from ivory palaces[e][d][c][b], stringed instruments have made you glad.
translation:
  language: hi
  text: तेरे सब वस्त्र गंधरस, अगर-काष्ठ और कासिया से सुगंधित हैं; हाथीदाँत के महलों से संगीत ने तुझे आनंदित किया है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल इब्रानी में “आनंदित किया है” का कर्ता नहीं बताया गया है; इसका अर्थ संगीत, वादक या तारवाले वाद्य हो सकता है। “हाथीदाँत के महलों से” का संबंध भी कुछ अनिश्चित है; इसका अर्थ “हाथीदाँत के महलों में से” या “हाथीदाँत के महलों के कारण” भी हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: מֹר
  choice: गन्धरस
  rationale: यह सुगन्धित राल ‘myrrh’ का प्रचलित और सन्दर्भानुकूल हिन्दी नाम है।
- source_word: וַאֲהָלוֹת
  choice: अगर
  rationale: यह आधुनिक एलोवेरा नहीं, बल्कि सुगन्धित अगर-काष्ठ को सूचित करता है; ‘अगर’ साधारण आधुनिक हिन्दी में वनस्पति-सन्दर्भ को अधिक ठीक व्यक्त करता है।
- source_word: קְצִיעוֹת
  choice: दालचीनी
  rationale: यह सुगन्धित छाल cassia को दर्शाता है; ‘दालचीनी’ सामान्य पाठक के लिए स्वाभाविक हिन्दी समतुल्य है, यद्यपि वनस्पति की दृष्टि से इसे कासिया भी कहा जाता है।
- source_word: כָּל בִּגְדֹתֶיךָ
  choice: तेरे सब वस्त्र ... से सुगन्धित हैं
  rationale: इब्रानी वाक्य क्रियारहित है और सुगन्ध-द्रव्यों को वस्त्रों के साथ रखता है; हिन्दी में आशय स्पष्ट करने के लिए ‘से सुगन्धित हैं’ जोड़ा गया है।
- source_word: מִן הֵיכְלֵי שֵׁן
  choice: हाथीदाँत के महलों से
  rationale: राजकीय विवाह के प्रसंग में הֵיכָל के लिए ‘महल’ उपयुक्त है और שֵׁן यहाँ मुहावरे के रूप में हाथीदाँत को सूचित करता है।
- source_word: שִׂמְּחוּךָ
  choice: तुझे आनन्दित किया है
  rationale: पिएल पूर्ण रूप का अर्थ ‘उन्होंने तुझे आनन्दित किया है’ है; हिन्दी में स्वाभाविक अभिव्यक्ति रखी गई है।
- source_word: implicit subject of שִׂמְּחוּךָ
  choice: संगीत
  rationale: इब्रानी में बहुवचन कर्ता व्यक्त नहीं है। ‘संगीत’ प्रसंगानुकूल है और ‘तारवाले वाद्य’ की अपेक्षा कम विशिष्ट अनुमान करता है; अनिश्चितता पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: भजन 45 का राजकीय/मसीही सन्दर्भ
  choice: पद का अनुवाद उसके तात्कालिक राजकीय विवाह के परिवेश में किया गया है।
  alternative: बाद की मसीही व्याख्या को शब्दावली में स्पष्ट रूप से जोड़ना।
  rationale: इस पद में राजकीय वैभव, सुगन्ध और उत्सव का वर्णन है; इब्रानी पाठ में न कही गई बाद की धर्मवैज्ञानिक परत अनुवाद में नहीं जोड़ी गई।
- issue: שִׂמְּחוּךָ का अव्यक्त कर्ता
  choice: मुख्य पाठ में ‘संगीत’ रखा गया और अनिश्चितता पादटिप्पणी में बताई गई।
  alternative: तारवाले वाद्य, वादक, अथवा अनिर्दिष्ट ‘उन्होंने’।
  rationale: मूल पाठ कर्ता को स्पष्ट नहीं करता; इसलिए किसी एक पारम्परिक पहचान को निश्चित तथ्य के रूप में प्रस्तुत नहीं किया गया।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य हिन्दी; कविता का राजकीय स्वर बनाए रखते हुए दुर्बोध वनस्पति-शब्दों से बचा गया है। एकवचन पुल्लिंग सम्बोधन के लिए ‘तेरे/तुझे’ रखा गया है।
