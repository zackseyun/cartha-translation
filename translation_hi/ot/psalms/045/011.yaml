  text: and the king will desire your beauty[a], for he is your lord[b]; bow down to him.
translation:
  language: hi
  text: और राजा तुम्हारी सुंदरता की अभिलाषा करेगा[a], क्योंकि वह तुम्हारा स्वामी है; उसके आगे झुक जाओ[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “राजा तुम्हारी सुंदरता की अभिलाषा करे।” इब्रानी रूप को भविष्य के कथन अथवा इच्छा/कामना के रूप में समझा जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “उसे सम्मानपूर्वक नमन करो।” यह क्रिया किसी श्रेष्ठ व्यक्ति के सामने आदर से झुकने को दर्शा सकती है—चाहे राजकीय संदर्भ में हो या धार्मिक संदर्भ में। कुछ अनुवाद यहाँ “उसकी आराधना करो” कहते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: וְיִתְאָו
  choice: और ... अभिलाषा करेगा
  rationale: हित्पएल अपूर्ण रूप को यहाँ सामान्य भविष्य के रूप में लिया गया है। ‘अभिलाषा करेगा’ इच्छा के भाव को सीधे व्यक्त करता है; इच्छासूचक अर्थ की संभावना पादटिप्पणी में रखी गई है।
- source_word: הַמֶּלֶךְ
  choice: राजा
  rationale: निश्चित संज्ञा का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: יָפְיֵךְ
  choice: तुम्हारी सुंदरता
  rationale: स्त्रीलिंग एकवचन संबोधन के साथ ‘सुंदरता’ मूल अर्थ को स्पष्ट और सहज रूप में व्यक्त करता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह अगले कथन को पहले कथन/निर्देश के कारण के रूप में जोड़ता है।
- source_word: הוּא
  choice: वह
  rationale: इब्रानी में स्वतंत्र सर्वनाम द्वारा दिए गए बल को बनाए रखा गया है।
- source_word: אֲדֹנַיִךְ
  choice: तुम्हारा स्वामी
  rationale: यहाँ אָדוֹן राजकीय या वैवाहिक संबंधसूचक उपाधि है, परमेश्वर के नाम का रूप नहीं; इसलिए ‘स्वामी’ उपयुक्त है।
- source_word: וְהִשְׁתַּחֲוִי לֽוֹ
  choice: उसके आगे झुक जाओ
  rationale: यह शारीरिक रूप से झुककर आदर प्रकट करने का भाव सुरक्षित रखता है, पर इसे अनिवार्यतः धार्मिक आराधना नहीं ठहराता।
theological_decisions:
- issue: क्या וְהִשְׁתַּחֲוִי לּוֹ को स्पष्ट धार्मिक आराधना की भाषा में अनूदित किया जाए
  choice: उसके आगे झुक जाओ
  alternative: उसे दण्डवत् करो; उसकी आराधना करो
  rationale: क्रिया परमेश्वर अथवा किसी मानवीय श्रेष्ठ व्यक्ति के सामने झुकने के लिए प्रयुक्त हो सकती है। राजकीय विवाह-गीत के संदर्भ में मुख्य पाठ शारीरिक आदर का अर्थ रखता है और धार्मिक या केवल दरबारी अर्थ के बीच की तनावपूर्ण अस्पष्टता को अनावश्यक रूप से नहीं सुलझाता।
- issue: וְיִתְאָו का भविष्यसूचक या इच्छासूचक बल
  choice: राजा ... अभिलाषा करेगा
  alternative: राजा ... की अभिलाषा करे
  rationale: रूप को मुख्य पाठ में सामान्य भविष्य माना गया है, किंतु काव्य-संदर्भ में इच्छासूचक या कामनासूचक बल संभव है; इसे पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक रखी गई है। ‘उसके आगे झुक जाओ’ सामान्य पाठक के लिए सहज है और इब्रानी क्रिया में निहित राजकीय तथा धार्मिक दोनों संभावनाओं को खुला रखता है।
