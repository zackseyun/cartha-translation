  yaml_path: translation/ot/psalms/045/005.yaml
  text: Your arrows are sharp[a]; peoples fall beneath you; they are in the heart of the king’s enemies.
translation:
  language: hi
  text: तेरे तीर पैने हैं[a]; जन-समूह तेरे नीचे गिर पड़ते हैं; वे राजा के शत्रुओं के हृदय में हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप में: “तेरे तीर पैने हैं—जन-समूह तेरे नीचे गिर पड़ते हैं—राजा के शत्रुओं के हृदय में।” इब्रानी पंक्ति अत्यंत संक्षिप्त और काव्यात्मक है; अंतिम खंड में तीरों के लिए कोई स्पष्ट क्रिया नहीं है।'
    reason: मूल वाक्य-विन्यास की संक्षिप्तता तथा अंतिम खंड में स्पष्ट क्रिया के अभाव को दर्शाने वाला शाब्दिक विकल्प।
lexical_decisions:
- source_word: חִצֶּיךָ
  choice: तेरे तीर
  rationale: חֵץ के बहुवचन रूप और द्वितीय पुरुष एकवचन पुल्लिंग प्रत्यय को सीधे और स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: שְׁנוּנִים
  choice: पैने हैं
  rationale: इस विशेषण/कृदन्त का अर्थ ‘पैने’ या ‘तेज़ किए हुए’ है; ‘पैने हैं’ तीरों के लिए स्वाभाविक आधुनिक हिंदी है।
- source_word: עַמִּים
  choice: जन-समूह
  rationale: עַם के बहुवचन को सामूहिक बहुलता सहित व्यक्त करता है और इसे केवल आधुनिक राष्ट्र-राज्यों तक सीमित नहीं करता।
- source_word: תַּחְתֶּיךָ
  choice: तेरे नीचे
  rationale: मूल के ‘तेरे नीचे/तले’ स्थानगत और विजय-संबंधी बिंब को बिना ‘अधीन’ जैसी व्याख्यात्मक अमूर्तता के बनाए रखता है।
- source_word: יִפְּלוּ
  choice: गिर पड़ते हैं
  rationale: अपूर्ण क्रिया को काव्यात्मक, सजीव वर्तमान में रखा गया है; भविष्यकाल ‘गिर पड़ेंगे’ भी संभव है।
- source_word: בְּלֵב
  choice: हृदय में जा धँसते हैं
  rationale: मूलतः ‘हृदय में’ है, पर अत्यंत संक्षिप्त इब्रानी वाक्य में तीरों की गति निहित है; हिंदी में बिंब को सुबोध बनाने के लिए ‘जा धँसते हैं’ जोड़ा गया है।
- source_word: אוֹיְבֵי הַמֶּלֶךְ
  choice: राजा के शत्रुओं के
  rationale: सम्बन्ध-रचना का सीधा अर्थ ‘राजा के शत्रु’ है; इसे ‘तेरे शत्रु’ करके दूसरे पुरुष से समरूप नहीं किया गया।
theological_decisions:
- issue: राजकीय/मसीही भजन में ‘राजा’ का संदर्भ
  choice: अनुवाद में तत्काल काव्यात्मक पद ‘राजा’ को बनाए रखा गया है।
  alternative: राजा की पहचान को अनुवाद में स्पष्ट रूप से मसीह से करना।
  rationale: इब्रानी पाठ केवल ‘राजा’ कहता है। भजन की मसीही व्याख्या संभव है, पर उसे पद के अनुवाद में जोड़ना पाठ की ऐतिहासिक और धर्मवैचारिक बहुअर्थकता को समय से पहले समाप्त कर देगा।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और काव्यात्मक हिंदी। संबोधन के लिए ‘तेरे’ रखा गया है, जो भजन की सीधी और निकट संबोधन-शैली से मेल खाता है। ‘जन-समूह’ बहुवचन समुदायों का भाव बचाता है; अंतिम खंड में स्वाभाविक हिंदी के लिए निहित गति को स्पष्ट किया गया है, जबकि पादटिप्पणी शाब्दिक अस्पष्टता सुरक्षित रखती है।
