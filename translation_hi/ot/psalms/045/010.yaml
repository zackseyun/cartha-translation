  edition: WLC
  text: שִׁמְעִי בַ֣ת וּ֭/רְאִי וְ/הַטִּ֣י אָזְנֵ֑/ךְ וְ/שִׁכְחִ֥י עַ֝מֵּ֗/ךְ וּ/בֵ֥ית אָבִֽי/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/045/010.yaml
  text: Listen[a], daughter, and see; incline your ear, and forget your people and your father's house.
translation:
  language: hi
  text: बेटी, सुन और देख; कान लगाकर सुन, और अपने लोगों और अपने पिता के घर को भूल जा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שִׁמְעִי
  choice: सुन
  rationale: स्त्रीलिंग एकवचन आज्ञार्थक रूप है। ‘सुन’ सीधा और स्वाभाविक है तथा ध्यानपूर्वक सुनने के आह्वान को व्यक्त करता है।
- source_word: בַת
  choice: हे बेटी
  rationale: यह स्त्री संबोधित व्यक्ति के लिए प्रत्यक्ष संबोधन है। ‘हे बेटी’ आधुनिक हिन्दी में संबोधन को स्पष्ट और गरिमापूर्ण रखता है।
- source_word: וּרְאִי
  choice: और ध्यान दे
  rationale: ראה का मूल अर्थ ‘देखना’ है, पर इस आज्ञात्मक क्रम में इसका भाव संबोधित बात पर ध्यान देने का है। हिन्दी में ‘ध्यान दे’ स्वाभाविक है और सुनने तथा कान लगाने के समानांतर exhortation को स्पष्ट करता है।
- source_word: וְהַטִּי אָזְנֵךְ
  choice: अपना कान लगा
  rationale: शाब्दिक बिंब कान को झुकाने या मोड़ने का है। ‘अपना कान लगा’ उस श्रवण-बिंब और ध्यानपूर्वक सुनने, दोनों को सहज हिन्दी में बनाए रखता है।
- source_word: וְשִׁכְחִי
  choice: और ... भूल जा
  rationale: שׁכח का सामान्य अर्थ ‘भूलना’ है। इसे ‘पीछे छोड़ दे’ जैसे नरम अर्थ में नहीं बदला गया, ताकि आज्ञा की तीव्रता बनी रहे।
- source_word: עַמֵּךְ
  choice: अपने लोगों
  rationale: עם यहाँ संबोधित स्त्री के अपने जातीय या सामाजिक समुदाय को दर्शाता है; ‘अपने लोग’ इसका स्वाभाविक हिन्दी रूप है।
- source_word: וּבֵית אָבִיךְ
  choice: और अपने पिता के घर को
  rationale: यह पैतृक परिवार या गृहस्थी के लिए प्रचलित इब्रानी अभिव्यक्ति है। ‘पिता का घर’ मूल बिंब और पारिवारिक अर्थ दोनों को सुरक्षित रखता है।
theological_decisions:
- issue: वधू को दिए गए आग्रह का बल
  choice: वधू को अपने जन्म-समुदाय और पैतृक परिवार से हटकर राजकीय विवाह के प्रति प्राथमिक निष्ठा अपनाने का सीधा आग्रह
  alternative: निष्ठा-परिवर्तन पर विशेष बल दिए बिना ध्यान देने का सामान्य ज्ञानपरक आह्वान
  rationale: आज्ञाओं का क्रम ‘अपने लोगों और अपने पिता के घर को भूल जा’ पर पहुँचता है, जो भजन के विवाह-संदर्भ में निर्णायक संबंधपरक पुनर्निष्ठा का संकेत देता है। अनुवाद इस बल को बनाए रखता है, पर बाद की कोई सिद्धान्तगत व्याख्या नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। स्त्रीलिंग संबोधन तथा आज्ञार्थक रूप स्पष्ट हैं। ‘भूल जा’ मूल की तीव्रता बनाए रखता है; ‘अपना कान लगा’ इब्रानी बिंब को स्वाभाविक हिन्दी में प्रस्तुत करता है।
