source:
  edition: WLC
  text: יָפְיָפִ֡יתָ מִ/בְּנֵ֬י אָדָ֗ם ה֣וּצַק חֵ֭ן בְּ/שְׂפְתוֹתֶ֑י/ךָ עַל כֵּ֤ן בֵּֽרַכְ/ךָ֖ אֱלֹהִ֣ים לְ/עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/045/002.yaml
  text: You are more beautiful than the sons of men[a]; grace is poured upon your lips[c][b]; therefore God has blessed you forever.
translation:
  language: hi
  text: तुम मनुष्य-पुत्रों से कहीं अधिक सुंदर हो[a]; तुम्हारे होंठों पर अनुग्रह उँडेला गया है[b]; इसलिए परमेश्वर ने तुम्हें सदा के लिए आशीष दी है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “मनुष्य के पुत्रों से”; यह अन्य मनुष्यों के साथ राजा की तुलना करने वाली काव्यात्मक अभिव्यक्ति है।
    reason: cultural_note
  - marker: b
    text: या, “कृपा” या “मनोहरता”; भावार्थ में, तुम्हारी वाणी कृपापूर्ण है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יָפְיָפִיתָ
  choice: कहीं अधिक सुन्दर हो
  rationale: यह יפה का गहन काव्यात्मक रूप है और מִן के साथ तुलना में अनुपम अथवा श्रेष्ठ सुन्दरता व्यक्त करता है। ‘कहीं अधिक सुन्दर’ आधुनिक हिन्दी में तुलनात्मक बल को स्वाभाविक ढंग से रखता है।
- source_word: מִבְּנֵי אָדָם
  choice: मनुष्यों के पुत्रों से
  rationale: शाब्दिक काव्यात्मक अभिव्यक्ति ‘मनुष्य के पुत्रों से’ है। हिन्दी में बहुवचन ‘मनुष्यों के पुत्रों से’ पुरुष राजा और अन्य मानव पुरुषों के बीच तुलना को बनाए रखता है; अर्थ की स्पष्टता के लिए पाद-टिप्पणी दी गई है।
- source_word: הוּצַק
  choice: उँडेला गया है
  rationale: יצק के निष्पन्न कर्मवाच्य रूप में उँडेलने का सजीव रूपक और पूर्ण हुई क्रिया का वर्तमान परिणाम दोनों हैं; ‘उँडेला गया है’ इन्हें सुरक्षित रखता है।
- source_word: חֵן
  choice: अनुग्रह
  rationale: חֵן का अर्थ अनुग्रह, कृपा, मनोहरता या शालीनता हो सकता है। होंठों के साथ यह कृपापूर्ण अथवा मनोहर वाणी की ओर संकेत करता है; ‘अनुग्रह’ इसके व्यापक काव्यात्मक और नैतिक अर्थ को खुला रखता है।
- source_word: בְּשְׂפְתוֹתֶיךָ
  choice: तुम्हारे होंठों पर
  rationale: पूर्वसर्ग בְ के साथ यहाँ हिन्दी मुहावरे और उँडेलने के रूपक के अनुसार ‘होंठों पर’ स्वाभाविक है।
- source_word: עַל כֵּן
  choice: इसलिए
  rationale: यह निष्कर्षसूचक संबंध को स्पष्ट और आधुनिक हिन्दी में व्यक्त करता है।
- source_word: בֵּרַכְךָ אֱלֹהִים
  choice: परमेश्वर ने तुम्हें आशीष दी है
  rationale: क्रिया पूर्ण रूप में है और אֱלֹהִים को उसका कर्ता मानना इस पद की सबसे सीधी वाक्यरचना है। ‘दी है’ पूर्ण क्रिया के वर्तमान परिणाम को व्यक्त करता है।
- source_word: לְעוֹלָם
  choice: सदा के लिए
  rationale: यह दीर्घस्थायी अथवा अनन्त अवधि को सामान्य, गरिमापूर्ण हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: अन्तिम उपवाक्य में אֱלֹהִים कर्ता है या सम्बोधन
  choice: 'कर्ता: ‘इसलिए परमेश्वर ने तुम्हें सदा के लिए आशीष दी है।’'
  alternative: सम्बोधन के रूप में ‘हे परमेश्वर’ समझना और अगले पद की भाषा के आधार पर किसी अन्य कर्ता की पूर्ति करना।
  rationale: इसी पद की वाक्यरचना में אֱלֹהִים को בֵּרַכְךָ का कर्ता मानना सबसे स्वाभाविक है। अगले पद के शब्द यहाँ जोड़कर किसी विशेष मसीही व्याख्या को आरोपित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक रखी गई है। पुरुष राजा को सम्बोधित करने के कारण पुल्लिंग रूप और मूल की ‘मनुष्य के पुत्रों’ वाली छवि सुरक्षित है। अर्धविरामों से इब्रानी पद के तीन परस्पर जुड़े काव्यात्मक खंड स्पष्ट होते हैं।
