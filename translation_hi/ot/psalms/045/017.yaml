lexical_decisions:
- source_word: אַזְכִּירָה
  choice: स्मरणीय बनाऊँगा
  rationale: 'זכר के हिफ़ील रूप की प्रेरणार्थक शक्ति को व्यक्त करता है: वक्ता केवल स्वयं स्मरण नहीं करता, बल्कि संबोधित व्यक्ति के नाम को आने वाली पीढ़ियों में स्मरण कराया जाना सुनिश्चित करता है।'
- source_word: שִׁמְךָ
  choice: तेरे नाम को
  rationale: ‘नाम’ का सीधा अर्थ बनाए रखता है; प्रसंग में इसमें यश, प्रतिष्ठा और स्मृति भी निहित हैं। एकवचन प्रत्यक्ष संबोधन के लिए ‘तेरे’ स्वाभाविक और काव्यात्मक है।
- source_word: בְּכָל דֹּר וָדֹר
  choice: पीढ़ी-पीढ़ी
  rationale: इब्रानी के आवृत्तिपूर्ण मुहावरे का संक्षिप्त, स्वाभाविक हिंदी रूप, जो प्रत्येक क्रमिक पीढ़ी का भाव देता है।
- source_word: עַל כֵּן
  choice: इसलिए
  rationale: पहले कथन के परिणाम या निष्कर्ष को स्पष्ट रूप से व्यक्त करता है।
- source_word: עַמִּים
  choice: देश-देश के लोग
  rationale: बहुवचन ‘जनसमूहों/राष्ट्रों’ का भाव सामान्य पाठक के लिए स्वाभाविक हिंदी में व्यक्त करता है और अनेक जातीय-राष्ट्रीय समुदायों का संकेत बनाए रखता है।
- source_word: יְהוֹדֻךָ
  choice: तेरी स्तुति करेंगे
  rationale: ידה के हिफ़ील रूप का भजन-साहित्य में सामान्य अर्थ स्तुति अथवा धन्यवाद करना है; यहाँ ‘स्तुति’ राजकीय और आराधनात्मक संदर्भ में सहज है।
- source_word: לְעוֹלָם וָעֶד
  choice: सदा-सर्वदा
  rationale: युगानुयुग स्थायित्व पर दिए गए इब्रानी बल को एक प्रतिष्ठित और सुबोध हिंदी पदबंध में सुरक्षित रखता है।
theological_decisions:
- issue: राजकीय विवाह-भजन में द्वितीय पुरुष सर्वनामों का संदर्भ
  choice: प्रत्यक्ष द्वितीय पुरुष संबोधन को बिना अधिक स्पष्ट किए बनाए रखा गया है
  alternative: दाऊदी राजा के लिए संबोधन; अथवा अंततः मसीह में पूर्ण होने वाला मसीही संबोधन
  rationale: पद स्वयं ‘तेरे/तेरी’ कहकर सीधे संबोधित करता है, पर संबोधित व्यक्ति की पहचान को इस पद में अलग से निर्धारित नहीं करता। अनुवाद ऐतिहासिक राजकीय और व्यापक मसीही पाठ—दोनों की संभावना खुली रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी में, काव्यात्मक किंतु सामान्य पाठक के लिए सुबोध रखी गई है। ‘पीढ़ी-पीढ़ी’ और ‘सदा-सर्वदा’ इब्रानी समानांतर बल तथा भजन की गरिमा को स्वाभाविक हिंदी में व्यक्त करते हैं।
