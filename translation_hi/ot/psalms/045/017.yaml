  yaml_path: translation/ot/psalms/045/017.yaml
  text: I will cause your name to be remembered in every generation[b][a]; therefore the peoples will praise you forever and ever.
translation:
  language: hi
  text: मैं हर पीढ़ी में तेरे नाम का स्मरण कराऊँगा[a]; इसलिए विभिन्न राष्ट्रों के लोग सदा-सर्वदा तेरी स्तुति करेंगे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मैं हर पीढ़ी में तेरे नाम का उल्लेख करूँगा,” अथवा “मैं हर पीढ़ी में तेरा नाम स्मरण करूँगा।” इब्रानी क्रिया का हिफ़ील रूप सक्रिय रूप से स्मरण कराने का भाव दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “तेरा धन्यवाद करेंगे।” इब्रानी क्रिया आराधना के संदर्भ में स्तुति और धन्यवाद—दोनों का भाव व्यक्त कर सकती है।
