  yaml_path: translation/ot/psalms/045/003.yaml
  text: Strap your sword on your thigh[a], mighty warrior[b], in your splendor and your majesty.
translation:
  language: hi
  text: हे वीर, अपनी तलवार अपनी जाँघ पर बाँध ले[a]—अपने वैभव और महिमा के साथ[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘अपनी तलवार अपनी जाँघ पर कस ले।’
    reason: lexical_alternative
  - marker: b
    text: मूल में ‘वैभव’ और ‘महिमा’ का आज्ञा से संबंध स्पष्ट करने वाला कोई अव्यय नहीं है। इसका अर्थ ‘अपने वैभव और महिमा के साथ’ हो सकता है; अथवा ये शब्द वीर के राजसी गौरव को समानाधिकरण रूप में व्यक्त कर सकते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: חֲגוֹר
  choice: बाँध ले
  rationale: यह חגר के पुरुषवाचक एकवचन आज्ञार्थक रूप को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है और तलवार कमर से बाँधने की ठोस क्रिया बनाए रखता है।
- source_word: חַרְבְּךָ
  choice: अपनी तलवार
  rationale: द्वितीय पुरुष एकवचन प्रत्यय सहित संज्ञा है; हिन्दी में कर्ता से संबंध के कारण ‘अपनी’ स्वाभाविक है।
- source_word: עַל יָרֵךְ
  choice: अपनी जाँघ पर
  rationale: मूल का स्थान-सूचक और ठोस बिंब सुरक्षित रहता है; ‘बगल में’ अधिक सहज होता, पर कम सटीक।
- source_word: גִּבּוֹר
  choice: हे वीर
  rationale: सम्बोधन में प्रयुक्त शब्द शक्तिशाली योद्धा या वीर को दर्शाता है। ‘हे वीर’ संक्षिप्त, काव्यात्मक और युद्ध-संदर्भ के अनुकूल है।
- source_word: הוֹדְךָ
  choice: अपने वैभव
  rationale: הוד राजकीय दीप्ति, गौरव या वैभव को व्यक्त करता है। ‘वैभव’ अगले समानांतर पद से भेद रखते हुए राजसी भव्यता प्रकट करता है।
- source_word: וַהֲדָרֶךָ
  choice: और प्रताप
  rationale: הדר महिमा, भव्यता या प्रताप को दर्शाता है। ‘प्रताप’ वीर और राजा दोनों के संदर्भ में स्वाभाविक है तथा ‘वैभव’ के साथ काव्यात्मक युग्म बनाता है।
theological_decisions:
- issue: भजन 45 में राजकीय अथवा मसीही सम्बोधन
  choice: पद को किसी वीर राजा के सीधे सम्बोधन के रूप में अनूदित किया गया है, बिना शब्दावली में उसकी मसीही पहचान स्पष्ट किए।
  alternative: बाद के शास्त्रीय प्रयोग के प्रकाश में सम्बोधित व्यक्ति को सीधे मसीह के रूप में पहचानना।
  rationale: इब्रानी पद स्वयं एक राजकीय योद्धा को काव्यात्मक सम्बोधन देता है। व्यापक मसीही या प्रतिरूपात्मक अर्थ संभव है, पर उसे इस पद के अनुवाद में आरोपित नहीं किया गया।
- issue: הוֹדְךָ וַהֲדָרֶךָ का वाक्यगत संबंध
  choice: ‘सहित’ द्वारा इसे तलवार बाँधने की आज्ञा के साथ जोड़ा गया है।
  alternative: इसे ‘हे वीर, जो हमारा वैभव और प्रताप है’ जैसे समानाधिकरण सम्बोधन के रूप में लेना।
  rationale: मूल में संबंधसूचक अव्यय व्यक्त नहीं है, इसलिए कुछ वाक्यगत अस्पष्टता रहती है। संदर्भ में साधन अथवा साथ का भाव स्वाभाविक है, पर वैकल्पिक संबंध पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमामय, संक्षिप्त काव्यात्मक शैली रखी गई है। ‘हे वीर’ सामान्य पाठक के लिए सहज है; ‘वैभव’ और ‘प्रताप’ राजकीय काव्य का ऊँचा स्वर बनाए रखते हैं।
