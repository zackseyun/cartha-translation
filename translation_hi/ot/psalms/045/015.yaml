id: PSA.45.15
reference: Psalms 45:15
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: תּ֭וּבַלְנָה בִּ/שְׂמָחֹ֣ת וָ/גִ֑יל תְּ֝בֹאֶ֗ינָה בְּ/הֵ֣יכַל מֶֽלֶךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/045/015.yaml
  text: They will be led with gladness and rejoicing[b][a]; they will enter the palace of the king.
translation:
  language: hi
  text: वे आनन्द और उल्लास के साथ लाई जाएँगी; वे राजा के महल[a] में प्रवेश करेंगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘महल’ के लिए प्रयुक्त इब्रानी शब्द का अर्थ ‘राजमहल’ या ‘सभागृह’ हो सकता है और दूसरे प्रसंगों में ‘मन्दिर’ भी; यहाँ राजकीय विवाह के प्रसंग में ‘महल’ उपयुक्त है।
    reason: cultural_note
lexical_decisions:
- source_word: תּוּבַלְנָה
  choice: लाई जाएँगी
  rationale: यבל के होफल अपूर्णकाल, स्त्रीलिंग बहुवचन का निष्क्रिय प्रेरणार्थक भाव ‘लाई/पहुँचाई जाएँगी’ है। ‘लाई जाएँगी’ विवाह-शोभायात्रा के प्रसंग में स्वाभाविक है और निष्क्रियता बनाए रखता है।
- source_word: בִּשְׂמָחֹת
  choice: आनन्द के साथ
  rationale: ב उपसर्ग सहित बहुवचन संज्ञा यहाँ रीति या साथ का भाव व्यक्त करती है। हिन्दी में सामूहिक उत्सवभाव के लिए ‘आनन्द के साथ’ सहज है।
- source_word: וָגִיל
  choice: और उल्लास
  rationale: גיל उमंगपूर्ण, प्रकट हर्ष को दर्शाता है। ‘उल्लास’ पहले पद ‘आनन्द’ से अर्थगत निकटता रखते हुए भी उसकी विशिष्ट तीव्रता बनाए रखता है।
- source_word: תְּבֹאֶינָה
  choice: वे प्रवेश करेंगी
  rationale: בוא का स्त्रीलिंग बहुवचन रूप किसी भवन के संदर्भ में भीतर आने का संकेत देता है; ‘प्रवेश करेंगी’ हिन्दी में सटीक और गरिमापूर्ण है।
- source_word: בְּהֵיכַל
  choice: महल में
  rationale: הֵיכָל का अर्थ महल, विशाल भवन/सभागृह, अथवा अन्य प्रसंगों में मन्दिर हो सकता है। भजन 45 के राजकीय विवाह-प्रसंग में ‘महल’ सर्वाधिक उपयुक्त है।
- source_word: מֶלֶךְ
  choice: राजा के
  rationale: यद्यपि इब्रानी में यहाँ निश्चित उपपद नहीं है, संबंध-रचना और प्रसंग एक विशिष्ट राजा की ओर संकेत करते हैं; हिन्दी में ‘राजा के’ स्वाभाविक है।
theological_decisions:
- issue: स्त्रीलिंग बहुवचन क्रियाओं का संदर्भ
  choice: ‘वे’ और स्त्रीलिंग बहुवचन क्रियाएँ रखी गई हैं; निकटवर्ती प्रसंग की वधू-संगिनी स्त्रियों से आगे पहचान को स्पष्ट नहीं किया गया।
  alternative: इसे सामान्य रूप से शोभायात्रा में सम्मिलित स्त्रियों का उल्लेख माना जा सकता है।
  rationale: इब्रानी व्याकरण स्त्रीलिंग बहुवचन बताता है और पिछला पद विवाह-समूह का संदर्भ देता है, पर यह पद स्वयं उनकी पहचान दोबारा नहीं बताता। अनुवाद इस अस्पष्टता को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण काव्यात्मक शैली। स्त्रीलिंग बहुवचन रूप मूल व्याकरण के अनुरूप रखा गया है। मुख्य पाठ में एकमात्र पादटिप्पणी-चिह्न [a] उपस्थित है।
