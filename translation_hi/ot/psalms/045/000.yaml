base_translation:
  language: en
  yaml_path: translation/ot/psalms/045/000.yaml
  text: 'For the choirmaster: according to “Lilies.” Of the sons of Korah[a]. A Maskil[c][b]. A song of loves.'
translation:
  language: hi
  text: संगीत-निर्देशक के लिए; “सोसन के फूलों” के अनुसार[a]। कोरह के पुत्रों का। एक मस्कील[b]। प्रेमों का गीत[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्द शोशन्नीम है, जिसका शाब्दिक अर्थ “सोसन के फूल” है; परम्परागत रूप से इसे किसी धुन या संगीत-विन्यास का नाम समझा गया है।
    reason: lexical_alternative
  - marker: b
    text: मस्कील भजन-शीर्षकों में प्रयुक्त एक तकनीकी शब्द है; इसका आशय मननशील या शिक्षाप्रद रचना हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: या “प्रेम-गीत।” इब्रानी में शाब्दिक रूप से “प्रेमों का गीत” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: संगीत-निर्देशक के लिए
  rationale: भजन-शीर्षकों में यह पद संगीत का नेतृत्व या निर्देशन करने वाले व्यक्ति को सूचित करता है। ‘संगीत-निर्देशक’ सामान्य आधुनिक हिन्दी में स्पष्ट है और केवल गायक-मंडली तक अर्थ को सीमित नहीं करता।
- source_word: עַל שֹׁשַׁנִּים
  choice: “सोसन के फूलों” के अनुसार
  rationale: שֹׁשַׁנִּים का शाब्दिक अर्थ ‘सोसन के फूल’ है, पर शीर्षक में यह सम्भवतः किसी धुन या संगीत-विन्यास का नाम है। उद्धरण-चिह्न और पादटिप्पणी इस अनिश्चितता को बनाए रखते हैं।
- source_word: לִבְנֵי קֹרַח
  choice: कोरह के पुत्रों का
  rationale: शीर्षकों में ל संबंध, रचनाकारिता या समर्पण का संकेत दे सकता है। ‘के पुत्रों का’ इस समूह से संबंध बताता है, बिना उस संबंध को अनावश्यक रूप से निश्चित किए।
- source_word: מַשְׂכִּיל
  choice: एक मस्कील
  rationale: यह भजन-शीर्षकों का अनिश्चित तकनीकी पद है। लिप्यंतरण से इसे केवल ‘शिक्षाप्रद’ या ‘मननशील’ मानकर अर्थ को सीमित करने से बचा गया है।
- source_word: שִׁיר
  choice: गीत
  rationale: यह रचना की विधा बताने वाले सामान्य इब्रानी शब्द का सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: יְדִידֹת
  choice: प्रेमों का
  rationale: इब्रानी शब्द बहुवचन में है। असामान्य हिन्दी अभिव्यक्ति मूल के काव्यात्मक बहुवचन और उसकी अस्पष्टता को सुरक्षित रखती है; अधिक सहज वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
theological_decisions: []
translation_notes:
  register: भजन के शीर्षक की खंडात्मक संरचना को छोटे वाक्यांशों में बनाए रखा गया है। भाषा आधुनिक और गरिमापूर्ण है; अनिश्चित संगीत-संबंधी पदों को अत्यधिक स्पष्ट करने के बजाय पादटिप्पणियों में समझाया गया है।
