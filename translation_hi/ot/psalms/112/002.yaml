  yaml_path: translation/ot/psalms/112/002.yaml
  text: His offspring will be mighty in the land[b][a]; the generation of the upright will be blessed.
translation:
  language: hi
  text: उसकी सन्तान[a] देश में[b] शक्तिशाली होगी; खरे लोगों की पीढ़ी आशीष पाएगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उसके वंशज’; यहाँ ‘सन्तान’ सामूहिक अर्थ में है।
    reason: lexical_alternative
  - marker: b
    text: या ‘पृथ्वी पर’; हिब्रू शब्द אֶרֶץ का अर्थ ‘देश/भूमि’ या ‘पृथ्वी’ हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: גִּבּוֹר
  choice: सामर्थी
  rationale: यहाँ शब्द सन्तान की शक्ति या प्रभाव को व्यक्त करता है, किसी विशिष्ट योद्धा की पहचान को नहीं; ‘सामर्थी’ उसके व्यापक अर्थ और काव्यात्मक गरिमा को बनाए रखता है।
- source_word: בָּאָרֶץ
  choice: देश में
  rationale: אֶרֶץ का अर्थ ‘देश/भूमि’ या ‘पृथ्वी’ हो सकता है। इस ज्ञानपरक भजन में सामाजिक और सामुदायिक उन्नति के सन्दर्भ में ‘देश में’ स्वाभाविक है, जबकि विकल्प पादटिप्पणी में सुरक्षित है।
- source_word: יִהְיֶה
  choice: होगी
  rationale: हिब्रू क्रिया के भविष्यकालीन, आशीषसूचक कथन को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: זַרְעוֹ
  choice: उसकी सन्तान
  rationale: זֶרַע यहाँ वंशजों के लिए सामूहिक संज्ञा है। ‘सन्तान’ हिन्दी में स्वाभाविक है और ‘बीज’ के असंगत शाब्दिक अर्थ से बचती है।
- source_word: דּוֹר
  choice: पीढ़ी
  rationale: यह יְשָׁרִים के साथ मिलकर ‘खरे लोगों की पीढ़ी’ बनाता है और पीढ़ीगत भाव को स्पष्ट रखता है।
- source_word: יְשָׁרִים
  choice: खरे लोग
  rationale: יָשָׁר नैतिक सीधेपन और निष्कपटता का भाव देता है। ‘खरे’ इस भाव को स्वाभाविक हिन्दी में व्यक्त करता और ‘धर्मी’ से शब्दगत भेद बनाए रखता है।
- source_word: יְבֹרָךְ
  choice: आशीष पाएगी
  rationale: बरक़त/आशीष की निष्क्रिय धारणा को सहज हिन्दी में स्पष्ट रखता है और इसे केवल भौतिक समृद्धि तक सीमित नहीं करता।
theological_decisions:
- issue: ज्ञानपरक भजन में आशीष का दायरा
  choice: सन्तान और पीढ़ी पर आशीष के व्यापक कथन को यथावत रखना
  alternative: इसे केवल भौतिक समृद्धि या वंशजों के सुनिश्चित आत्मिक उद्धार तक सीमित करना
  rationale: हिब्रू में सामर्थ्य और आशीष व्यापक ज्ञानपरक तथा वाचा-संबंधी भाषा में हैं; अनुवाद को किसी संकुचित सिद्धान्तगत अर्थ को आरोपित नहीं करना चाहिए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘सामर्थी’, ‘खरे’ और ‘आशीष पाएगी’ काव्यात्मक ऊँचाई बनाए रखते हुए अत्यधिक संस्कृतनिष्ठ या सम्प्रदाय-विशिष्ट शब्दावली से बचते हैं।
