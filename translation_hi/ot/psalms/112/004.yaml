  text: Light dawns in the darkness for the upright[a]; he is gracious and compassionate and righteous.
translation:
  language: hi
  text: खरे लोगों के लिए अँधेरे में ज्योति उदय होती है[a]; वह कृपालु, करुणामय और धर्मी है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “खरे लोगों के लिए अँधेरे में ज्योति उदय होती है—कृपालु, करुणामय और धर्मी।” अंतिम विशेषण संभवतः भजन 111:4 में यहोवा के चरित्र का भी स्मरण कराते हैं।
    reason: वैकल्पिक वाक्य-संबंध और भजन 111:4 की संभावित प्रतिध्वनि को सुरक्षित रखना।
lexical_decisions:
- source_word: זָרַח
  choice: उदय होती है
  rationale: यह क्रिया प्रकाश के उगने या फूट निकलने को व्यक्त करती है। भजन के नीतिपरक, सामान्य कथन के संदर्भ में वर्तमानकालिक ‘उदय होती है’ स्वाभाविक है और इब्रानी पूर्ण क्रिया के परिणामकारी भाव को भी संदर्भानुसार संप्रेषित करती है।
- source_word: בַּחֹשֶׁךְ
  choice: अँधेरे में
  rationale: यह मूल पूर्वसर्ग और निश्चित संज्ञा का सीधा, स्वाभाविक हिन्दी रूप है तथा शाब्दिक और रूपक—दोनों अर्थों की संभावना बनाए रखता है।
- source_word: אוֹר
  choice: ज्योति
  rationale: यह वाक्य का व्याकरणिक कर्ता है। ‘ज्योति’ काव्यात्मक किंतु सामान्यतः बोधगम्य है और यहाँ गुणात्मक अर्थ में बिना अनिश्चितता-सूचक शब्द के स्वाभाविक बैठता है।
- source_word: לַיְשָׁרִים
  choice: सीधे लोगों के लिए
  rationale: יְשָׁרִים नैतिक रूप से खरे या सीधे लोगों को दर्शाता है। ‘सीधे’ आगे आने वाले צַדִּיק से शब्दगत भेद बनाए रखता है।
- source_word: חַנּוּן
  choice: कृपालु
  rationale: यह अनुग्रह और कृपा दिखाने वाले स्वभाव को संक्षेप में व्यक्त करता है तथा अगले विशेषण से अर्थगत भेद बनाए रखता है।
- source_word: רַחוּם
  choice: करुणामय
  rationale: यह कोमल दया और गहरी करुणा के भाव को स्वाभाविक तथा गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: צַדִּיק
  choice: धर्मी
  rationale: यह नैतिक धार्मिकता को व्यक्त करता है और इस ज्ञान-साहित्यिक संदर्भ में ‘न्यायी’ की अपेक्षा अधिक व्यापक अर्थ देता है।
theological_decisions:
- issue: अंतिम तीन एकवचन विशेषणों (חַנּוּן וְרַחוּם וְצַדִּיק) का संदर्भ
  choice: मुख्य पाठ में ‘वह’ जोड़कर इन्हें भजन 112 में वर्णित एकवचन धर्मी व्यक्ति के गुणों के रूप में प्रस्तुत किया गया है।
  alternative: विशेषण रूपक रूप में ‘ज्योति’ का वर्णन कर सकते हैं, अथवा भजन 111:4 की प्रतिध्वनि के रूप में यहोवा के चरित्र की ओर संकेत कर सकते हैं।
  rationale: ‘सीधे लोग’ बहुवचन है, जबकि तीनों विशेषण पुल्लिंग एकवचन हैं। निकट संदर्भ में भजन 112 धन्य और धर्मी पुरुष का एकवचन में वर्णन करता है, इसलिए ‘वह’ एक सुसंगत मुख्य पाठ देता है। फिर भी भजन 111:4 में परमेश्वर के लिए प्रयुक्त समान भाषा के कारण वैकल्पिक संभावना को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और काव्यात्मक रूप अपनाया गया है। ‘ज्योति’ और ‘धर्मी’ बाइबलीय संदर्भ के अनुकूल हैं, पर सामान्य पाठक के लिए भी बोधगम्य रहते हैं।
