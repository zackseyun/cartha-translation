  text: כִּֽי לְ/עוֹלָ֥ם לֹא יִמּ֑וֹט לְ/זֵ֥כֶר ע֝וֹלָ֗ם יִהְיֶ֥ה צַדִּֽיק־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/112/006.yaml
  text: For he will never be shaken[a]; the righteous will be remembered forever.
translation:
  language: hi
  text: क्योंकि वह कभी नहीं डगमगाएगा; धर्मी[a] सदा स्मरण किया जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में यह पुल्लिंग एकवचन है, पर यहाँ सामान्य रूप से किसी भी धर्मी व्यक्ति का प्रतिनिधित्व करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन का आधार या कारण प्रस्तुत करता है; ‘क्योंकि’ इसके संयोजक बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: לְעוֹלָם לֹא יִמּוֹט
  choice: कभी नहीं डगमगाएगा
  rationale: नकार के साथ לְעוֹלָם स्थायी निषेध व्यक्त करता है। מוט का निफ़अल रूप अस्थिर होने या डगमगाने का बिंब देता है।
- source_word: לְזֵכֶר עוֹלָם
  choice: सदा स्मरण किया जाएगा
  rationale: यह पदबंध चिरस्थायी स्मृति में बने रहने का भाव व्यक्त करता है; हिन्दी में कर्मवाच्य रूप अर्थ को स्पष्ट और स्वाभाविक रखता है।
- source_word: צַדִּיק
  choice: धर्मी
  rationale: एकवचन विशेषण यहाँ संज्ञा के रूप में प्रयुक्त है और ज्ञान-साहित्य में सामान्य प्रतिनिधि धर्मी व्यक्ति को दर्शाता है। ‘धर्मी’ मूल के नैतिक और संबंधपरक अर्थ को संक्षेप में व्यक्त करता है।
- source_word: יִהְיֶה
  choice: किया जाएगा
  rationale: हिब्रू में सामान्य भविष्यकालीन ‘होगा’ है; स्मरण वाले पदबंध के साथ स्वाभाविक हिन्दी में इसे ‘स्मरण किया जाएगा’ के रूप में व्यक्त किया गया है।
theological_decisions:
- issue: צַדִּיק में प्रतिनिधिक पुल्लिंग एकवचन
  choice: धर्मी[a] ... किया जाएगा
  alternative: धर्मी जन सदा स्मरण किए जाएँगे
  rationale: मूल पाठ के एकवचन को बनाए रखते हुए ‘धर्मी’ को सामान्य प्रतिनिधि व्यक्ति के रूप में रखा गया है। पुल्लिंग एकवचन क्रिया स्रोत की व्याकरणिक आकृति को दर्शाती है, जबकि पादटिप्पणी स्पष्ट करती है कि कथन सामान्य श्रेणी के धर्मी व्यक्ति के विषय में है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘डगमगाएगा’ भजन के स्थिरता-बिंब को बनाए रखता है; अर्धविराम दोनों समानांतर कथनों को जोड़ता है।
