  text: סָמ֣וּךְ לִ֭בּ/וֹ לֹ֣א יִירָ֑א עַ֖ד אֲשֶׁר יִרְאֶ֣ה בְ/צָרָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/112/008.yaml
  text: His heart is steadfast[b][a]; he will not fear until he looks on his adversaries.
translation:
  language: hi
  text: उसका हृदय दृढ़ है; वह नहीं डरेगा, जब तक वह अपने विरोधियों[b] को न देख ले।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप से: “जब तक वह अपने विरोधियों को न देख ले।” इस प्रसंग में इब्रानी अभिव्यक्ति विरोधियों के संबंध में अनुकूल परिणाम देखने का भाव भी सूचित कर सकती है।'
    reason: source_idiom
  - marker: b
    text: या “शत्रुओं।” इब्रानी शब्द शत्रुओं या अधिक सामान्य रूप से वैर रखने वाले विरोधियों के लिए आ सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: סָמוּךְ
  choice: दृढ़
  rationale: निष्क्रिय कृदन्त का भाव ‘समर्थित, स्थिर, दृढ़ किया हुआ’ है। हृदय के संदर्भ में ‘दृढ़’ स्वाभाविक है और भीतरी स्थिरता को व्यक्त करता है।
- source_word: לִבּוֹ
  choice: उसका हृदय
  rationale: यहाँ ‘हृदय’ व्यक्ति के भीतरी मन, विचार और संकल्प का व्यापक काव्यात्मक बोध बनाए रखता है।
- source_word: לֹא יִירָא
  choice: वह नहीं डरेगा
  rationale: अपूर्ण क्रिया यहाँ स्थायी अथवा भावी निर्भयता व्यक्त कर सकती है; यह रूप उस आयामी खुलापन को बनाए रखता है।
- source_word: עַד אֲשֶׁר
  choice: जब तक ... न देख ले
  rationale: यह संयोजन समय की सीमा प्रस्तुत करता है। हिंदी का यह रूप स्वाभाविक है, यद्यपि पूरे वाक्य का आशय भय के बाद लौट आने का नहीं, बल्कि अंतिम प्रतिफल तक बने रहने वाले भरोसे का है।
- source_word: יִרְאֶה בְצָרָיו
  choice: अपने विरोधियों पर विजय होते ... देख ले
  rationale: ראה के साथ ב और विरोधियों का प्रयोग इस संदर्भ में केवल उन्हें देखने से अधिक, उनके विरुद्ध अनुकूल परिणाम या विजय देखने का संकेत देता है। ‘विजय होते देखना’ आशय स्पष्ट करता है, पर विजय को उसकी निजी शक्ति का फल नहीं बताता।
- source_word: צָרָיו
  choice: अपने विरोधियों
  rationale: צַר शत्रु, बैरी या hostile opponent को सूचित करता है। ‘विरोधी’ आधुनिक हिंदी में व्यापक और काव्यात्मक रूप से उपयुक्त है।
theological_decisions:
- issue: विरोधियों को देखने में विजय का निहित भाव
  choice: अपने विरोधियों पर विजय होते देखना
  alternative: अपने विरोधियों को देखना
  rationale: अति-शाब्दिक विकल्प से ऐसा भ्रामक अर्थ निकल सकता है कि विरोधियों को देखते ही उसका साहस समाप्त हो जाएगा। चुना हुआ रूप संदर्भगत विजय या अनुकूल न्याय को व्यक्त करता है, बिना यह निर्धारित किए कि विजय किस मानवीय साधन से आती है।
translation_notes:
  register: आधुनिक मानक हिंदी का सरल, गरिमापूर्ण और काव्यात्मक रूप। ‘दृढ़ हृदय’ भजन-साहित्य की पारंपरिक छवि को स्वाभाविक हिंदी में बनाए रखता है; व्याख्यात्मक विस्तार केवल उस इब्रानी मुहावरे पर किया गया है जिसका अत्यधिक शाब्दिक अनुवाद उलटा अर्थ दे सकता था।
