lexical_decisions:
- source_word: טוֹב
  choice: भला है
  rationale: पद के आरम्भ में यह विशेषण विधेय रूप में है। ‘भला है’ मूल की संक्षिप्तता बनाए रखते हुए उस मनुष्य की सराहनीय दशा और चरित्र दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אִישׁ
  choice: वह मनुष्य
  rationale: इब्रानी में पुल्लिंग एकवचन है और इसका प्रयोग प्रतिनिधिक अर्थ में हुआ है; ‘वह मनुष्य’ इस रूप को बनाए रखता है।
- source_word: חוֹנֵן
  choice: कृपालु है
  rationale: यह कृपा या अनुग्रह दिखाने को सूचित करता है। ‘कृपालु’ केवल धन-संबंधी उदारता तक अर्थ को सीमित नहीं करता।
- source_word: וּמַלְוֶה
  choice: और उधार देता है
  rationale: हिफ़ील कृदंत का सीधा अर्थ किसी को ऋण देना है। यह अनावश्यक रूप से ‘खुले हाथ से’ जैसी अतिरिक्त धारणा नहीं जोड़ता।
- source_word: יְכַלְכֵּל
  choice: चलाता है
  rationale: यहाँ क्रिया अपने मामलों का प्रबन्ध या संचालन करने के अर्थ में है; ‘काम-काज चलाता है’ वर्तमान हिन्दी में सहज है।
- source_word: דְּבָרָיו
  choice: अपने काम-काज
  rationale: संज्ञा का अर्थ ‘बातें/वचन’ भी हो सकता है, पर उधार देने और न्यायपूर्ण आचरण के प्रसंग में ‘काम-काज’ अधिक स्वाभाविक है। वास्तविक वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: בְּמִשְׁפָּט
  choice: न्याय के साथ
  rationale: यह न्याय, उचित निर्णय और न्यायपूर्ण व्यवहार की नैतिक-विधिक शक्ति को बनाए रखता है।
