id: PSA.112.9
reference: Psalms 112:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: פִּזַּ֤ר נָ֘תַ֤ן לָ/אֶבְיוֹנִ֗ים צִ֭דְקָת/וֹ עֹמֶ֣דֶת לָ/עַ֑ד קַ֝רְנ֗/וֹ תָּר֥וּם בְּ/כָבֽוֹד׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/112/009.yaml
  text: He has distributed freely[a]; he has given to the poor. His righteousness stands forever[c][b]; his horn will be lifted up in honor.
translation:
  language: hi
  text: उसने खुले हाथ से बाँटा है; उसने दरिद्रों को दिया है। उसकी धार्मिकता सदा बनी रहती है[a]; उसका सींग[b] सम्मान के साथ ऊँचा उठेगा[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसका न्याय सदा बना रहता है।” इब्रानी शब्द का अर्थ धार्मिकता और न्याय—दोनों हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: “सींग” शक्ति, प्रतिष्ठा या ऊँचे पद का इब्रानी रूपक है।
    reason: cultural_note
  - marker: c
    text: या, “सम्मान में प्रतिष्ठित होगा” अथवा “महिमा में ऊँचा उठेगा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּזַּר
  choice: खुले हाथ से बाँटा है
  rationale: मूल क्रिया का शाब्दिक अर्थ ‘बिखेरना’ है, पर यहाँ दरिद्रों को उदारतापूर्वक बाँटने का भाव है। यह चयन उस व्यापक वितरण और उदारता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: נָתַן
  choice: दिया है
  rationale: पूर्ण क्रिया का सीधा और स्वाभाविक अनुवाद; पहली पंक्ति के समानांतर दान के कार्य को स्पष्ट रखता है।
- source_word: לָאֶבְיוֹנִים
  choice: दरिद्रों को
  rationale: אֶבְיוֹן अभावग्रस्त, निर्धन या ज़रूरतमंद व्यक्ति को दर्शाता है। ‘दरिद्रों’ काव्यात्मक, गरिमापूर्ण और अर्थ की दृष्टि से सटीक है।
- source_word: צִדְקָתוֹ
  choice: उसकी धार्मिकता
  rationale: यह शब्द धार्मिकता और न्याय—दोनों अर्थ-छायाएँ रखता है। ‘धार्मिकता’ इसके व्यापक नैतिक और ईश्वर-संबंधी आशय को बनाए रखती है; ‘न्याय’ को पादटिप्पणी में सुरक्षित किया गया है।
- source_word: עֹמֶדֶת לָעַד
  choice: सदा बनी रहती है
  rationale: मूल में स्थिर खड़े रहने और निरंतर बने रहने का भाव है। यह हिन्दी में स्थायित्व को स्पष्ट और सहज रूप से व्यक्त करता है।
- source_word: קַרְנוֹ
  choice: उसका सींग
  rationale: सींग शक्ति, प्रतिष्ठा और ऊँचे पद का इब्रानी काव्यात्मक रूपक है। स्रोत की छवि को मुख्य पाठ में बनाए रखा गया और उसका अर्थ पादटिप्पणी में समझाया गया है।
- source_word: תָּרוּם
  choice: ऊँचा उठेगा
  rationale: क्रिया ऊँचा होने या प्रतिष्ठित किए जाने का भाव देती है। ‘ऊँचा उठेगा’ सींग के रूपक के साथ स्वाभाविक है और exaltation की अर्थ-छाया बचाता है।
- source_word: בְּכָבוֹד
  choice: सम्मान के साथ
  rationale: כָּבוֹד का अर्थ सम्मान, प्रतिष्ठा या महिमा हो सकता है। इस ज्ञान-साहित्यिक संदर्भ में ‘सम्मान’ सार्वजनिक प्रतिष्ठा को स्पष्ट करता है, जबकि ‘महिमा’ को विकल्प के रूप में रखा गया है।
theological_decisions:
- issue: दान के संबंध में ‘उसकी धार्मिकता’ का अर्थ
  choice: यह उदार व्यक्ति के स्थायी धार्मिक चरित्र और सही आचरण को व्यापक रूप से दर्शाता है।
  alternative: इसे केवल दान-पुण्य के कर्म या मुख्यतः वाचा-संबंधी न्याय के अर्थ में समझना।
  rationale: पद उदारता की प्रशंसा करता है, पर צְדָקָה को केवल पुण्य कमाने वाले दान या केवल सामाजिक परोपकार तक सीमित नहीं करता। व्यापक पद ‘धार्मिकता’ मूल की नैतिक और धर्मवैचारिक अर्थ-व्याप्ति तथा उसके तनाव को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी की गरिमापूर्ण काव्यात्मक शैली अपनाई गई है। वाक्य सरल और सामान्य पाठक के लिए बोधगम्य रखे गए हैं। ‘सींग’ जैसे मूल काव्य-रूपक को हटाने के बजाय संक्षिप्त पादटिप्पणी से स्पष्ट किया गया है।
