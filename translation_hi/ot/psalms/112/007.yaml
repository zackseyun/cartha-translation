  text: He will not fear bad news[a]; his heart is steadfast[b], trusting in Yahweh.
translation:
  language: hi
  text: वह बुरी खबर से नहीं डरेगा[a]; उसका हृदय दृढ़[b] है, और वह याहवे पर भरोसा रखता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह किसी अनिष्टकारी समाचार से नहीं डरता।”
