lexical_decisions:
- source_word: מִשְּׁמוּעָה רָעָה
  choice: बुरी खबर से
  rationale: שְׁמוּעָה רָעָה प्रतिकूल या दुखद समाचार को दर्शाता है, और आरंभिक מִן उस समाचार के कारण या उसके सामने उत्पन्न भय से संबंध बताता है। ‘बुरी खबर से’ आधुनिक हिन्दी में स्वाभाविक और अर्थनिष्ठ है।
- source_word: לֹא יִירָא
  choice: नहीं डरेगा
  rationale: अपूर्ण क्रिया यहाँ धर्मी व्यक्ति के सामान्य और स्थायी आचरण को व्यक्त करती है; हिन्दी का सामान्य भविष्यत् रूप इस सूक्ति-संबंधी बल को बनाए रखता है।
- source_word: נָכוֹן
  choice: दृढ़
  rationale: यह शब्द स्थापित, स्थिर या अटल होने का भाव देता है। ‘दृढ़’ हृदय की आंतरिक स्थिरता को संक्षिप्त और स्वाभाविक रूप में व्यक्त करता है।
- source_word: לִבּוֹ
  choice: उसका हृदय
  rationale: हिब्रू में ‘हृदय’ मनुष्य के भीतरी व्यक्तित्व, इच्छा और मनोवृत्ति को दर्शाता है; हिन्दी में ‘हृदय’ इस बाइबलीय रूपक को सुरक्षित रखता है।
- source_word: בָּטֻחַ
  choice: भरोसा रखता है
  rationale: यह रूप विश्वासपूर्ण या आश्वस्त अवस्था बताता है। अगली पदावली में विश्वास के लक्ष्य के साथ ‘भरोसा रखता है’ सहज हिन्दी है।
- source_word: בַּיהוָה
  choice: यहोवा पर
  rationale: בְּ विश्वास के लक्ष्य को चिह्नित करता है। יהוה को उसके व्यक्तिगत वाचा-नाम ‘यहोवा’ के रूप में प्रस्तुत किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम सीधे प्रयुक्त है। हिन्दी के सामान्य पाठकों में प्रचलित रूप ‘यहोवा’ नाम की विशिष्टता बनाए रखता है, जबकि उसे केवल पदवी ‘प्रभु’ से प्रतिस्थापित नहीं करता।
- issue: दृढ़ हृदय और भरोसे के बीच संबंध
  choice: क्योंकि वह यहोवा पर भरोसा रखता है
  alternative: उसका हृदय दृढ़ है, यहोवा पर भरोसा रखनेवाला
  rationale: हिब्रू में נָכוֹן לִבּוֹ के बाद בָּטֻחַ בַּיהוָה उसी व्यक्ति की भरोसे से भरी अवस्था बताता है। ‘क्योंकि’ हिन्दी में इस निहित आधार-संबंध को स्वाभाविक बनाता है, बिना यह दावा किए कि मूल में स्पष्ट कारणसूचक संयोजक है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और काव्यात्मक-सूक्तिपरक शैली रखी गई है। ‘हृदय’ जैसे प्रमुख बाइबलीय रूपक को बनाए रखते हुए वाक्य-संरचना सामान्य पाठक के लिए स्वाभाविक बनाई गई है।
