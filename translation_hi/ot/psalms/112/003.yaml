base_translation:
  language: en
  yaml_path: translation/ot/psalms/112/003.yaml
  text: Wealth and riches are in his house[a], and his righteousness stands forever.
translation:
  language: hi
  text: 'धन और सम्पत्ति उसके घर में हैं,

    और उसकी धार्मिकता सदा बनी रहती है।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘और उसका न्याय सदा बना रहता है।’
    reason: צְדָקָה का एक वैध अर्थ ‘न्याय’ भी है; यह मूल शब्द की वैकल्पिक अर्थ-छाया को सीधे और स्वाभाविक हिन्दी में दर्शाता है।
lexical_decisions:
- source_word: הוֹן וָעֹשֶׁר
  choice: धन और सम्पत्ति
  rationale: दोनों निकटार्थक संज्ञाओं के काव्यात्मक युग्म को बनाए रखते हुए भौतिक समृद्धि का स्वाभाविक आधुनिक हिन्दी में बोध कराता है।
- source_word: בְּבֵיתוֹ
  choice: उसके घर में हैं
  rationale: ठोस इब्रानी बिंब को सुरक्षित रखता है; प्रसंग में ‘घराने’ का व्यापक भाव भी निहित रह सकता है।
- source_word: וְצִדְקָתוֹ
  choice: और उसकी धार्मिकता
  rationale: צְדָקָה यहाँ धर्मपरायण व्यक्ति के स्थायी नैतिक खरेपन का संकेत देती है; ‘न्यायशीलता’ एक वास्तविक वैकल्पिक अर्थ है, जिसे पादटिप्पणी में रखा गया है।
- source_word: עֹמֶדֶת
  choice: बनी रहती है
  rationale: עמד के स्थिर रहने और टिके रहने के भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לָעַד
  choice: सदा
  rationale: निरन्तर और स्थायी अवधि के अर्थ को संक्षिप्त, गरिमापूर्ण हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: भौतिक आशीष के प्रसंग में ‘उसकी धार्मिकता’ का अर्थ
  choice: इसे धर्मी व्यक्ति की स्थायी धार्मिकता अथवा उदार न्यायपूर्ण आचरण के रूप में खुला रखा गया है।
  alternative: इसे परमेश्वर द्वारा वाचा-संबंधी निर्दोष ठहराया जाना या बाद की किसी आरोपित धार्मिकता की तकनीकी शिक्षा मानना।
  rationale: भजन 112 में व्याकरणिक विषय आशीष पाया हुआ धर्मी मनुष्य है। अनुवाद सीधे संबंधवाचक रूप को रखता है और मूल पाठ में स्पष्ट न की गई बाद की धर्मवैज्ञानिक श्रेणियाँ नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और काव्यात्मक समानांतरता को बनाए रखने वाला पाठ। पादटिप्पणी-चिह्न उसी कथन के बाद रखा गया है जिस पर वैकल्पिक अर्थ लागू होता है।
