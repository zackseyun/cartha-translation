id: PSA.112.1
reference: Psalms 112:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: הַ֥לְלוּ יָ֨הּ אַשְׁרֵי אִ֭ישׁ יָרֵ֣א אֶת יְהוָ֑ה בְּ֝/מִצְוֺתָ֗י/ו חָפֵ֥ץ מְאֹֽד׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/112/001.yaml
  text: Praise Yah! Blessed is the man who fears Yahweh[b][a], who greatly delights in his commandments.
translation:
  language: hi
  text: 'याह की स्तुति करो![a]


    धन्य है वह पुरुष[b] जो याहवे का भय मानता है


    और उसकी आज्ञाओं में बहुत आनंद लेता है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: पारंपरिक रूप से, “हालेलूयाह!”
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में “पुरुष”; इस ज्ञान-वचन में पुल्लिंग एकवचन का प्रयोग सामान्य, प्रतिनिधिक अर्थ में हुआ है।
    reason: cultural_note
lexical_decisions:
- source_word: הַ֥לְלוּ יָ֨הּ
  choice: याह की स्तुति करो!
  rationale: बहुवचन आज्ञार्थक הַלְלוּ और परमेश्वर के संक्षिप्त नाम יָהּ—दोनों को स्पष्ट रूप से व्यक्त करता है। पारंपरिक लिप्यंतरण ‘हालेलूयाह’ को पादटिप्पणी में रखा गया है।
- source_word: אַשְׁרֵי
  choice: धन्य है
  rationale: यह ज्ञान-साहित्य की मंगल-वाणी है, जो उस व्यक्ति की सराहनीय और फलती-फूलती दशा बताती है; ‘धन्य’ हिंदी के गरिमापूर्ण भजन-संदर्भ में स्वाभाविक है।
- source_word: אִישׁ
  choice: वह पुरुष
  rationale: मूल का पुल्लिंग एकवचन रूप सुरक्षित रहता है; इस ज्ञान-वचन में उसका प्रतिनिधिक, सामान्य प्रयोग पादटिप्पणी में स्पष्ट किया गया है।
- source_word: יָרֵא אֶת יְהוָה
  choice: जो याहवे का भय मानता है
  rationale: ‘भय मानता है’ יָרֵא के भय, श्रद्धा और विस्मय के धार्मिक तनाव को केवल ‘आदर करता है’ कहकर हल्का नहीं करता; יְהוָה को व्यक्तिगत नाम ‘याहवे’ के रूप में रखा गया है।
- source_word: בְּמִצְוֺתָיו
  choice: उसकी आज्ञाओं से
  rationale: हिंदी में ‘आज्ञाओं से प्रसन्न होना’ आनंद के विषय को स्वाभाविक ढंग से व्यक्त करता है; ‘उसकी’ का संदर्भ याहवे से है।
- source_word: חָפֵץ מְאֹד
  choice: बहुत प्रसन्न होता है
  rationale: חָפֵץ के आनंद लेने या प्रसन्न होने के अर्थ और מְאֹד की तीव्रता को सरल, वर्तमान हिंदी में व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में चार-अक्षरी व्यक्तिगत नाम सीधे आया है। ‘याहवे’ उसे किसी उपाधि से बदलने के बजाय नाम के रूप में सुरक्षित रखता है।
- issue: יָרֵא में भय और श्रद्धा का संबंध
  choice: भय मानता है
  alternative: श्रद्धा रखता है
  rationale: केवल ‘श्रद्धा’ कहने से मूल का वास्तविक भय-बोध दब सकता है; ‘भय मानना’ हिंदी में श्रद्धापूर्ण भय को भी समेट सकता है और मूल की धार्मिक गहनता बनाए रखता है।
- issue: प्रतिनिधिक पुल्लिंग אִישׁ
  choice: वह पुरुष
  alternative: वह व्यक्ति
  rationale: मूल का पुल्लिंग एकवचन रूप रखा गया है, जबकि पादटिप्पणी बताती है कि ज्ञान-वचन में कथन सामान्य रूप से लागू होता है।
translation_notes:
  register: आधुनिक मानक हिंदी में संक्षिप्त, गरिमापूर्ण भजनात्मक शैली अपनाई गई है। पंक्ति-विन्यास इब्रानी काव्य के अर्थ-खंडों को दर्शाता है। ‘याह’ और ‘याहवे’ के बीच मूल पाठ में उपस्थित संक्षिप्त तथा पूर्ण ईश्वरीय नाम का भेद बनाए रखा गया है।
