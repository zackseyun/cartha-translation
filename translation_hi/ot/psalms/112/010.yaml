base_translation:
  language: en
  yaml_path: translation/ot/psalms/112/010.yaml
  text: The wicked man will see and be angry[a]; he will gnash his teeth and melt away; the desire of the wicked will perish.
translation:
  language: hi
  text: दुष्ट मनुष्य देखेगा और क्रोधित होगा[a]; वह दाँत पीसेगा और पिघल जाएगा; दुष्टों की अभिलाषा मिट जाएगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “दुष्ट देखेगा और क्रोधित होगा”—इब्रानी में ‘दुष्ट मनुष्य’ पुल्लिंग एकवचन है, पर उसका प्रयोग प्रतिनिधिक रूप में हुआ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: רָשָׁע
  choice: दुष्ट मनुष्य
  rationale: इब्रानी में पुल्लिंग एकवचन संज्ञार्थक विशेषण है। ‘दुष्ट मनुष्य’ उसके व्याकरणिक रूप को बनाए रखता है, जबकि यहाँ वह प्रतिनिधिक अर्थ में प्रयुक्त है।
- source_word: יִרְאֶה
  choice: यह देखकर
  rationale: ראה का क़ाल अपूर्ण 3 पुल्लिंग एकवचन है। प्रसंग में इसका आशय पिछले पदों में वर्णित धर्मी की समृद्धि और सम्मान को देखना है; हिन्दी में ‘यह देखकर’ उस प्रसंगगत संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: וְכָעָס
  choice: क्रोधित होगा
  rationale: संयोजक के साथ आया क़ाल पूर्ण रूप काव्यात्मक क्रम में पहले अपूर्ण क्रिया के भाव को आगे बढ़ाता है। ‘क्रोधित होगा’ כעס की भावात्मक तीव्रता को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: שִׁנָּיו יַחֲרֹק
  choice: वह दाँत पीसेगा
  rationale: यह क्रोध और हताशा का सजीव मुहावरा है। ‘दाँत पीसना’ हिन्दी में चित्र और भाव दोनों को सुरक्षित रखता है।
- source_word: וְנָמָס
  choice: और गल जाएगा
  rationale: מסס/מוס से बना यह रूप गलने, पिघलने या क्षीण होकर मिटने का भाव देता है। ‘गल जाएगा’ मूल रूपक को संक्षिप्त और काव्यात्मक ढंग से बनाए रखता है।
- source_word: תַּאֲוַת
  choice: अभिलाषा
  rationale: इसका अर्थ इच्छा, लालसा या आकांक्षा है। ‘अभिलाषा’ यहाँ दुष्टों की विफल आकांक्षा के लिए गरिमापूर्ण और व्यापक शब्द है।
- source_word: רְשָׁעִים
  choice: दुष्टों की
  rationale: मूल में बहुवचन संज्ञार्थक रूप है और תַּאֲוַת के साथ संबंधसूचक संरचना बनाता है। ‘दुष्टों की’ संख्या और सामूहिक अर्थ दोनों को सुरक्षित रखता है।
- source_word: תֹּאבֵד
  choice: मिट जाएगी
  rationale: אבד का क़ाल अपूर्ण स्त्रीलिंग एकवचन ‘अभिलाषा’ से मेल खाता है और उसके पूर्णतः निष्फल हो जाने का भाव देता है। ‘मिट जाएगी’ आधुनिक हिन्दी में स्वाभाविक और प्रभावी है।
theological_decisions:
- issue: एकवचन רָשָׁע का प्रतिनिधिक और लिंग-सूचक अनुवाद
  choice: दुष्ट मनुष्य
  alternative: दुष्ट जन / दुष्ट व्यक्ति
  rationale: मूल इब्रानी पुल्लिंग एकवचन है, इसलिए मुख्य पाठ उसका रूप बनाए रखता है। साथ ही यह केवल पुरुषों तक सीमित नहीं, बल्कि प्रतिनिधिक प्रयोग है; इस बात को पाद-टिप्पणी में स्पष्ट किया गया है।
