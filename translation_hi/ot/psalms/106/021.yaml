  yaml_path: translation/ot/psalms/106/021.yaml
  text: They forgot God their Savior[a], who had done great things in Egypt.
translation:
  language: hi
  text: वे अपने उद्धारकर्ता परमेश्वर को भूल गए[a], जिसने मिस्र में महान कार्य किए थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘उन्हें बचाने वाले परमेश्वर को।’ इब्रानी कृदंत परमेश्वर को उन्हें बचाने वाले के रूप में प्रस्तुत करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁכְחוּ
  choice: वे ... भूल गए
  rationale: काल पूर्ण भूतकालीन घटना बताता है; भजन के ऐतिहासिक वर्णन में सरल भूतकाल स्वाभाविक है।
- source_word: אֵל
  choice: परमेश्वर
  rationale: यहाँ यह इस्राएल के परमेश्वर का सामान्य दैवी संबोधन है; केवल ‘परमेश्वर’ अर्थ को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: מוֹשִׁיעָם
  choice: अपने उद्धारकर्ता
  rationale: हिफ़ील कृदंत और बहुवचन प्रत्यय का अर्थ ‘उनका उद्धार करने वाला’ है; ‘अपने उद्धारकर्ता’ हिन्दी वाक्य में संबंध स्पष्ट और स्वाभाविक बनाता है।
- source_word: עֹשֶׂה
  choice: जिसने ... किए थे
  rationale: कृदंत परमेश्वर का वर्णन करता है। सम्बन्धवाचक उपवाक्य हिन्दी में स्वाभाविक है, और ‘किए थे’ भूलने से पहले हुए कार्यों को दर्शाता है।
- source_word: גְדֹלֹות
  choice: बड़े-बड़े काम
  rationale: बहुवचन विशेष्यीकृत रूप परमेश्वर के महान कार्यों को सूचित करता है; यह सामान्य आधुनिक हिन्दी में सहज है।
- source_word: בְּמִצְרָיִם
  choice: मिस्र में
  rationale: पूर्वसर्ग यहाँ स्थान बताता है।
theological_decisions:
- issue: אֵל को सामर्थ्यसूचक उपाधि या सामान्य दैवी संबोधन के रूप में प्रस्तुत करना
  choice: परमेश्वर
  alternative: पराक्रमी परमेश्वर / सामर्थी जन
  rationale: इस पद में मुख्य बात उस परमेश्वर की पहचान है जिसे लोग भूल गए, न कि सामर्थ्यसूचक उपाधि पर अलग बल देना।
- issue: מוֹשִׁיעָם के कृदंतीय अर्थ को पदवी या सतत भूमिका के रूप में व्यक्त करना
  choice: अपने उद्धारकर्ता
  alternative: उन्हें बचाने वाले
  rationale: ‘उद्धारकर्ता’ संक्षिप्त और गरिमापूर्ण है तथा परमेश्वर की उद्धार करने वाली भूमिका को बनाए रखता है; वैकल्पिक क्रियात्मक अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य। ‘बड़े-बड़े काम’ सामान्य पाठक के लिए सहज है, जबकि पादटिप्पणी कृदंत की वास्तविक अर्थ-छाया सुरक्षित रखती है।
