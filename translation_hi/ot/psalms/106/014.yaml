  yaml_path: translation/ot/psalms/106/014.yaml
  text: But they craved intensely in the wilderness[b][a], and tested God in the wasteland.
translation:
  language: hi
  text: परन्तु निर्जन प्रदेश में उन्होंने प्रबल लालसा की[a][b], और उजाड़ भूमि में परमेश्वर को परखा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में क्रिया के साथ उसी मूल की संज्ञा का प्रयोग है, जिसका शाब्दिक भाव है, “उन्होंने लालसा की लालसा की।” यह लालसा की तीव्रता पर बल देता है।
    reason: lexical_alternative
  - marker: b
    text: “निर्जन प्रदेश” का अनुवाद “मरुभूमि” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְאַוּוּ תַאֲוָה
  choice: उन्होंने प्रबल लालसा की
  rationale: क्रिया और उसी मूल से बने संज्ञा-पद का प्रयोग इब्रानी में लालसा की तीव्रता पर बल देता है। हिंदी में ‘प्रबल लालसा की’ इस बल को स्वाभाविक ढंग से व्यक्त करता है और अनावश्यक रूप से केवल यौन अर्थ नहीं जोड़ता।
- source_word: בַּמִּדְבָּר
  choice: निर्जन प्रदेश में
  rationale: מִדְבָּר आबादी और खेती से दूर जंगल, मरुभूमि या निर्जन भूभाग को सूचित कर सकता है। ‘निर्जन प्रदेश’ इसे वन के अर्थ तक सीमित किए बिना व्यापक भाव बनाए रखता है।
- source_word: וַיְנַסּוּ
  choice: परखा
  rationale: נסה का अर्थ यहाँ किसी को परीक्षा में डालना या उसकी सामर्थ्य और धैर्य को चुनौती देना है। ‘परखा’ संक्षिप्त और स्वाभाविक हिंदी है।
- source_word: אֵל
  choice: परमेश्वर
  rationale: אֵל यहाँ इस्राएल के परमेश्वर के लिए सामान्य ईश्वरीय पद है; ‘परमेश्वर’ आधुनिक हिंदी बाइबिलीय शैली में स्पष्ट और गरिमापूर्ण है।
- source_word: בִּישִׁימוֹן
  choice: उजाड़ भूमि में
  rationale: יְשִׁימוֹן निर्जन, बंजर और उजाड़ भूभाग पर बल देता है। यह चयन पहले स्थानवाचक शब्द מִדְבָּר से भेद भी बनाए रखता है।
theological_decisions:
- issue: इब्रानी के सजातीय क्रिया-संज्ञा प्रयोग को शाब्दिक रूप से दोहराना या भावानुसार व्यक्त करना
  choice: ‘प्रबल लालसा की’ के द्वारा बल को स्वाभाविक हिंदी में व्यक्त किया
  alternative: ‘लालसा की लालसा की’ अथवा ‘बहुत लालच किया’
  rationale: शाब्दिक पुनरावृत्ति हिंदी में अस्वाभाविक होती, जबकि ‘लालच’ नैतिक दोष को मूल पद की अपेक्षा अधिक स्पष्ट रूप से आरोपित कर सकता है। ‘प्रबल लालसा’ तीव्रता और प्रसंगगत तनाव दोनों को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘निर्जन प्रदेश’ और ‘उजाड़ भूमि’ इब्रानी के दो संबंधित किंतु भिन्न स्थलवाचक शब्दों का अंतर बनाए रखते हैं।
