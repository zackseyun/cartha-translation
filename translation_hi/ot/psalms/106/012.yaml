lexical_decisions:
- source_word: וַיַּאֲמִינוּ
  choice: तब उन्होंने … विश्वास किया
  rationale: हिफ़ील रूप यहाँ विश्वास करने या भरोसा रखने का अर्थ देता है। वाव-युक्त कथात्मक रूप घटनाक्रम को आगे बढ़ाता है, इसलिए स्वाभाविक हिन्दी में ‘तब’ चुना गया।
- source_word: בִדְבָרָיו
  choice: उसके वचनों पर
  rationale: דבר बहुवचन में तृतीय पुरुष एकवचन प्रत्यय के साथ है; ‘उसके वचनों’ से बहुवचन बना रहता है। אמן के साथ ב संबंध को हिन्दी में स्वाभाविक रूप से ‘पर विश्वास किया’ व्यक्त करता है।
- source_word: יָשִׁירוּ
  choice: उन्होंने … गाई
  rationale: इस कथात्मक संदर्भ में अपूर्ण क्रिया को बीती हुई अगली घटना के रूप में समझना स्वाभाविक है।
- source_word: תְּהִלָּתוֹ
  choice: उसकी स्तुति
  rationale: תְּהִלָּה पर तृतीय पुरुष एकवचन प्रत्यय है; ‘उसकी स्तुति’ मूल संरचना और अर्थ दोनों को सीधे व्यक्त करता है।
