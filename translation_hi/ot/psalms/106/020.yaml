  yaml_path: translation/ot/psalms/106/020.yaml
  text: They exchanged their glory for the image of an ox that eats grass[a][b].
translation:
  language: hi
  text: उन्होंने अपनी महिमा[a] के बदले घास खानेवाले बैल[b] का प्रतिरूप अपना लिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने महिमामय परमेश्वर।” इब्रानी में शब्दशः “उनकी महिमा” है; यह परमेश्वर के लिए श्रद्धापूर्ण संकेत हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “साँड़।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמִירוּ
  choice: उन्होंने ... बदल लिया
  rationale: מוּר का हिफ़ील रूप एक वस्तु के स्थान पर दूसरी को लेने या विनिमय करने का भाव देता है। हिंदी में ‘को ... से बदल लिया’ इस आरोप को स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: כְּבוֹדָם
  choice: अपनी महिमा
  rationale: इब्रानी में शब्दशः ‘उनकी महिमा’ है। संदर्भ में संकेत परमेश्वर की ओर है, फिर भी मूल की जानबूझकर रखी गई अभिव्यक्ति और उसका धर्मवैचारिक तनाव बचाने के लिए मुख्य पाठ में ‘महिमा’ ही रखा गया है।
- source_word: בְּתַבְנִית
  choice: की मूर्ति
  rationale: תַּבְנִית रूप, आकृति या प्रतिरूप को दर्शाता है। मूर्तिपूजा के संदर्भ में ‘मूर्ति’ आधुनिक हिंदी में सहज है और दृश्य प्रतिरूप का आशय स्पष्ट करता है।
- source_word: שׁוֹר
  choice: बैल
  rationale: שׁוֹר गाय-वंश के नर पशु, बैल या साँड़, को सूचित कर सकता है। ‘बैल’ सामान्य और स्वाभाविक हिंदी विकल्प है; ‘साँड़’ की संभावना पादटिप्पणी में दी गई है।
- source_word: אֹכֵל עֵשֶׂב
  choice: घास खानेवाले
  rationale: कृदंत और कर्म को हिंदी में विशेषणात्मक पदबंध के रूप में प्रस्तुत किया गया है। इससे उस विडंबना पर बल बना रहता है कि उन्होंने अपनी महिमा को एक साधारण घास खानेवाले प्राणी की मूर्ति से बदल लिया।
theological_decisions:
- issue: ‘अपनी महिमा’ का संदर्भ
  choice: मुख्य पाठ में मूल की अभिव्यक्ति ‘अपनी महिमा’ को बनाए रखना
  alternative: ‘अपने महिमामय परमेश्वर’ या ‘परमेश्वर’
  rationale: संदर्भ में यह इस्राएल के परमेश्वर की ओर संकेत करता है, पर मूल पाठ अमूर्त संज्ञा ‘महिमा’ का ही प्रयोग करता है। परमेश्वर को मुख्य पाठ में स्पष्ट कर देना अर्थ की वास्तविक सांकेतिकता और अंतरपाठीय प्रभाव को समय से पहले सुलझा देता।
translation_notes:
  register: आधुनिक मानक हिंदी का सरल, गरिमापूर्ण और काव्यात्मक रूप रखा गया है। ‘खानेवाले’ को संयुक्त रूप में लिखा गया है। ‘अपनी महिमा’ मूल की अर्थपूर्ण अस्पष्टता को सुरक्षित रखता है; अतिरिक्त व्याख्यात्मक पादटिप्पणी आवश्यक नहीं मानी गई, क्योंकि पद के संदर्भ में संकेत परमेश्वर की ओर है।
