  rationale: A single lexical adjustment replaces the non-idiomatic ‘गौरव करूँ’ with ‘गर्व करूँ.’ The revision preserves the Hebrew’s positive, participatory sense of glorying with God's inheritance and retains the draft’s structure, register, and deliberate distinctions among the three identity terms.
