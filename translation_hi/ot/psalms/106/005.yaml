language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: לִ/רְא֤וֹת בְּ/ט֘וֹבַ֤ת בְּחִירֶ֗י/ךָ לִ֭/שְׂמֹחַ בְּ/שִׂמְחַ֣ת גּוֹיֶ֑/ךָ לְ֝/הִתְהַלֵּ֗ל עִם נַחֲלָתֶֽ/ךָ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/005.yaml
  text: that I may see the good of your chosen ones[a], rejoice in the joy of your nation[b], and glory with your inheritance.
translation:
  language: hi
  text: कि मैं तेरे चुने हुओं की भलाई देखूँ, तेरी प्रजा के आनन्द में आनन्दित होऊँ, और तेरी विरासत के साथ गर्व करूँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִרְאוֹת
  choice: कि मैं ... देखूँ
  rationale: ल उपसर्ग वाला infinitive पिछले पद की प्रार्थना का उद्देश्य या परिणाम व्यक्त करता है; हिन्दी में संभावनार्थक रचना इसे स्वाभाविक रूप से प्रकट करती है।
- source_word: בְּטוֹבַת
  choice: की भलाई
  rationale: טוֹבָה यहाँ चुने हुए लोगों को प्राप्त कल्याण, सुख-समृद्धि या अच्छी दशा को समेटता है। ‘भलाई’ मूल की व्यापकता बनाए रखती है और केवल आर्थिक समृद्धि तक अर्थ को सीमित नहीं करती।
- source_word: בְּחִירֶיךָ
  choice: तेरे चुने हुओं
  rationale: यह परमेश्वर द्वारा चुने गए लोगों का बहुवचन पद है। ‘चुने हुए’ स्पष्ट है और बाद की पारिभाषिक धर्मवैज्ञानिक धारणाएँ अनावश्यक रूप से नहीं जोड़ता।
- source_word: לִשְׂמֹחַ בְּשִׂמְחַת
  choice: आनन्द में आनन्दित होऊँ
  rationale: क्रिया और उसी धातु से बने संज्ञा-पद की हिब्रू पुनरुक्ति को हिन्दी में भी रखा गया है; ב सहभागिता अथवा क्षेत्र का बोध देता है।
- source_word: גּוֹיֶךָ
  choice: तेरी प्रजा
  rationale: גּוֹי का मूल अर्थ ‘राष्ट्र’ है, पर परमेश्वर से संबोधित इस वाक्य में ‘तेरी प्रजा’ आधुनिक हिन्दी में उस सामुदायिक और वाचागत संबंध को अधिक सहजता से व्यक्त करती है।
- source_word: לְהִתְהַלֵּל
  choice: गौरव करूँ
  rationale: हित्पएल रूप यहाँ उल्लासपूर्ण गर्व या गौरव करने का अर्थ देता है। ‘गौरव करूँ’ सकारात्मक प्रसंग के अनुकूल है और ‘डींग मारूँ’ के नकारात्मक भाव से बचता है।
- source_word: עִם נַחֲלָתֶךָ
  choice: तेरी विरासत के साथ
  rationale: עִם संगति दर्शाता है और נַחֲלָה परमेश्वर के अपने लोगों के लिए वाचागत पद है। सीधा रूपक सुरक्षित रखा गया है।
theological_decisions:
- issue: वाचागत पहचान के तीन अलग पदों को बनाए रखना
  choice: तेरे चुने हुए ... तेरी प्रजा ... तेरी विरासत
  alternative: तेरे चुने हुए ... तेरा राष्ट्र ... तेरी निज प्रजा
  rationale: मूल पद इस्राएल के लिए तीन परस्पर संबद्ध किन्तु भिन्न संज्ञाएँ रखता है। अनुवाद इन्हें एक ही शब्द में समतल नहीं करता और ‘चुने हुए’ को बाद की किसी विशिष्ट सिद्धान्त-प्रणाली तक सीमित नहीं करता।
- issue: לְהִתְהַלֵּל का सकारात्मक अर्थ
  choice: गौरव करूँ
  alternative: गर्व करूँ / उल्लसित होऊँ
  rationale: संदर्भ परमेश्वर की विरासत के साथ सहभागी उल्लास का है, आत्मश्लाघा की निन्दा का नहीं; इसलिए सकारात्मक अर्थ चुना गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, काव्यात्मक किन्तु सहज शैली। परमेश्वर के लिए निकट संबोधन ‘तेरे/तेरी’ भजन की प्रत्यक्ष प्रार्थना और हिन्दी बाइबलीय काव्य-परंपरा के अनुरूप रखा गया है।
