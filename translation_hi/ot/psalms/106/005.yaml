review_pass:
  verdict: revise
  source_fidelity: 'The purpose sequence is accurately represented: seeing the well-being of God''s chosen ones, rejoicing in the joy of God''s nation/people, and positively glorying in association with God''s inheritance. ‘भलाई’ appropriately preserves the breadth of בְּטוֹבַת, and the three distinct covenantal designations remain distinct.'
  naturalness: 'The verse is generally clear and appropriately elevated. However, ‘तेरी विरासत के साथ गौरव करूँ’ is not idiomatic modern Hindi: ‘गौरव करना’ normally means to honor someone/something, rather than to glory or exult. ‘गर्व करूँ’ naturally conveys the positive contextual sense of the Hebrew without introducing a different object or action.'
  terminology: ‘चुने हुओं,’ ‘प्रजा,’ and ‘विरासत’ suitably maintain the differentiated Hebrew covenantal terms. ‘प्रजा’ is a natural contextual rendering of גּוֹיֶךָ, though ‘राष्ट्र’ would also be possible. No footnote is required in Hindi, since no unresolved ambiguity needs an anchor in the revised text.
  issues:
  - severity: medium
    issue: ‘गौरव करूँ’ does not naturally render לְהִתְהַלֵּל in this sentence.
    rationale: In current Hindi, ‘गौरव करना’ usually has the sense ‘to honor’ or ‘to pay tribute,’ whereas the Hebrew hitpael here denotes glorying/boasting exultantly. ‘गर्व करूँ’ better retains that sense in an idiomatic form.
  revised_text: कि मैं तेरे चुने हुओं की भलाई देखूँ, तेरी प्रजा के आनन्द में आनन्दित होऊँ, और तेरी विरासत के साथ गर्व करूँ।
