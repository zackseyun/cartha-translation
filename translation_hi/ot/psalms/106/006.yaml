  text: חָטָ֥אנוּ עִם אֲבוֹתֵ֗י/נוּ הֶעֱוִ֥ינוּ הִרְשָֽׁעְנוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/006.yaml
  text: We have sinned with our fathers[a]; we have done wrong[b]; we have acted wickedly.
translation:
  language: hi
  text: हमने अपने पूर्वजों के साथ पाप किया है[a]; हमने बुराई की है[b]; हमने दुष्टता से काम किया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, ‘अपने पिताओं के साथ।’
    reason: lexical_alternative
  - marker: b
    text: या, ‘हमने कुटिलता की है।’
    reason: lexical_alternative
lexical_decisions:
- source_word: חָטָאנוּ
  choice: हमने ... पाप किया है
  rationale: काल पूर्ण की सामूहिक पाप-स्वीकारोक्ति को वर्तमान प्रासंगिकता सहित स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: עִם
  choice: के साथ
  rationale: यह उपसर्ग पूर्वजों के साथ सहभागिता अथवा एकजुटता दर्शाता है, केवल समानता नहीं।
- source_word: אֲבוֹתֵינוּ
  choice: अपने पूर्वजों
  rationale: शाब्दिक अर्थ ‘हमारे पिताओं’ है, पर इस ऐतिहासिक-सामुदायिक संदर्भ में ‘अपने पूर्वजों’ आधुनिक हिन्दी में वंश की पिछली पीढ़ियों का स्वाभाविक और स्पष्ट बोध कराता है; शाब्दिक विकल्प पाद-टिप्पणी में रखा गया है।
- source_word: הֶעֱוִינוּ
  choice: हमने बुराई की है
  rationale: עוה के नैतिक रूप से गलत अथवा कुटिल आचरण के अर्थ को साधारण, गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: הִרְשָׁעְנוּ
  choice: हमने दुष्टता से काम किया है
  rationale: רשע के क्रियात्मक बल को बनाए रखता है और तीन चरणों वाली स्वीकारोक्ति के अंतिम, तीव्र कथन को व्यक्त करता है।
theological_decisions:
- issue: पाप-स्वीकार में पीढ़ियों की सामुदायिक एकजुटता
  choice: ‘अपने पूर्वजों के साथ’
  alternative: ‘अपने पूर्वजों के समान’
  rationale: עִם का सहज अर्थ ‘के साथ’ है, ‘के समान’ नहीं। इसलिए पाठ पिछली पीढ़ियों के साथ पाप में सामुदायिक निरंतरता स्वीकार करता है, पर इससे आगे कोई तकनीकी धर्मसिद्धान्त स्थापित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, सामूहिक स्वीकारोक्ति के अनुरूप गंभीर और सामान्य पाठकों के लिए सहज रखी गई है। मूल की तीन समानांतर क्रियाओं और उनकी बढ़ती नैतिक तीव्रता को अलग-अलग वाक्यांशों में सुरक्षित रखा गया है।
