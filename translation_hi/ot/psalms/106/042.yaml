lexical_decisions:
- source_word: וַיִּלְחָצוּם
  choice: उन पर अत्याचार किया
  rationale: לחץ के क़ाल रूप और बहुवचन कर्म-प्रत्यय का अर्थ दबाना, सताना या अत्याचार करना है। शत्रुओं द्वारा लगातार किए गए दमन के संदर्भ में यह स्वाभाविक और सटीक हिन्दी है।
- source_word: אֹיְבֵיהֶם
  choice: उनके शत्रुओं
  rationale: אויב का सामान्य अर्थ ‘शत्रु’ है; प्रत्यय इसे ‘उनके शत्रु’ बनाता है।
- source_word: וַיִּכָּנְעוּ
  choice: दबा दिए गए
  rationale: כנע के निफ़अल रूप में अधीन किए जाने या दबाए जाने का निष्क्रिय और परिणामसूचक भाव है। यह आगे आने वाले ‘हाथ के नीचे’ के साथ सहज बैठता है।
- source_word: תַּחַת יָדָם
  choice: उनके हाथ के नीचे
  rationale: मूल इब्रानी बिंब को सुरक्षित रखा गया है। ‘हाथ के नीचे’ किसी के अधिकार या नियंत्रण में होने का मुहावरा है।
