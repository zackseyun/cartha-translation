  yaml_path: translation/ot/psalms/106/041.yaml
  text: He gave them into the hand of the nations[b][a], and those who hated them ruled over them.
translation:
  language: hi
  text: उसने उन्हें राष्ट्रों के हाथ में दे दिया[a], और उनसे घृणा करने वालों ने उन पर शासन किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘किसी के हाथ में दे देना’ किसी के अधिकार या नियंत्रण में सौंपने का इब्रानी मुहावरा है।
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּתְּנֵם
  choice: उसने उन्हें ... दे दिया
  rationale: נתן का रूप 3 पुं. एक. कर्ता और 3 पुं. बहु. कर्म व्यक्त करता है। सरल क्रिया ‘दे दिया’ परमेश्वर की सक्रिय भूमिका को बनाए रखती है और संदर्भ में किसी दूसरे के अधिकार में सौंपे जाने का भाव देती है।
- source_word: בְּיַד
  choice: के हाथ में
  rationale: यह अधिकार अथवा नियंत्रण में दिए जाने का इब्रानी मुहावरा है। हिन्दी में ‘के हाथ में’ स्वाभाविक है और मूल रूपक को सुरक्षित रखता है।
- source_word: גּוֹיִם
  choice: जाति-जाति के लोग
  rationale: यहाँ शब्द इस्राएल के बाहर की विदेशी जातियों को सूचित करता है। ‘जाति-जाति के लोग’ काव्यात्मक बहुवचन और सामूहिक अर्थ को व्यक्त करता है, जबकि ‘अन्यजाति’ अधिक परंपरा-विशिष्ट हो सकता है।
- source_word: וַיִּמְשְׁלוּ
  choice: शासन किया
  rationale: משל का मूल अर्थ ‘शासन करना’ है। यह शत्रुतापूर्ण संदर्भ में भी क्रिया की lexical सादगी बनाए रखता है; ‘दबाया’ मूल से अधिक अर्थ जोड़ता।
- source_word: בָהֶם
  choice: उन पर
  rationale: משל के साथ ב को हिन्दी में स्वाभाविक रूप से ‘पर शासन करना’ कहा जाता है।
- source_word: שֹׂנְאֵיהֶם
  choice: उनसे घृणा करने वालों
  rationale: कर्तृवाचक कृदन्त का सक्रिय अर्थ ‘जो उनसे घृणा करते थे’ है। यह ‘शत्रुओं’ की तुलना में मूल शब्द की घृणा-वाचक विशिष्टता बनाए रखता है।
theological_decisions:
- issue: इस्राएल के न्याय में परमेश्वर की सक्रिय भूमिका
  choice: ‘उसने ... दे दिया’ के द्वारा परमेश्वर की सक्रिय कार्रवाई स्पष्ट रखी गई है।
  alternative: ‘उसने उन्हें जाने दिया’ अथवा ऐसी भाषा जो केवल अनुमति का भाव दे।
  rationale: संदर्भ में निहित कर्ता परमेश्वर है और נתן सीधे तौर पर उसके द्वारा उन्हें दूसरी जातियों के अधिकार में दिए जाने को व्यक्त करता है। अनुवाद इस तनाव को नरम नहीं करता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध हिन्दी। समानांतर काव्य-रचना तथा ‘हाथ में’ का मूल मुहावरा बनाए रखा गया है।
