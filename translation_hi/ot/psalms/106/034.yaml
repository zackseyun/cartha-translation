base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/034.yaml
  text: They did not destroy the peoples whom Yahweh had told them to destroy[a].
translation:
  language: hi
  text: उन्होंने उन जातियों का नाश नहीं किया, जिनका नाश करने के लिए यहोवा ने उनसे कहा था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी में शाब्दिक रूप से: “उन्होंने उन जातियों का नाश नहीं किया, जिनके विषय में यहोवा ने उनसे कहा था।” संदर्भ से निहित आज्ञा को स्पष्ट करने के लिए मुख्य पाठ में “नाश करने के लिए” जोड़ा गया है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא הִשְׁמִידוּ
  choice: उन्होंने ... नाश नहीं किया
  rationale: निषेध के साथ हिफ़ील क्रिया का स्वाभाविक हिंदी रूप; ‘नाश करना’ मूल की प्रबलता बनाए रखता है, पर उससे अधिक विशिष्ट अर्थ नहीं जोड़ता।
- source_word: אֶת הָעַמִּים
  choice: उन जातियों का
  rationale: बहुवचन עַמִּים यहाँ अनेक जन-समूहों को सूचित करता है; ‘जातियाँ’ आधुनिक बाइबलीय हिंदी में इस भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֲשֶׁר אָמַר ... לָהֶם
  choice: जिनका नाश करने के लिए ... ने उनसे कहा था
  rationale: इब्रानी में कथन की विषय-वस्तु लुप्त पर संदर्भ से निहित है। हिंदी में अर्थपूर्ण वाक्य के लिए ‘नाश करने के लिए’ जोड़ा गया है, जबकि ‘कहा’ मूल אָמַר की सामान्यता को बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत नाम के रूप में चतुरक्षरीय नाम को किसी उपाधि से बदलने के बजाय हिंदी में प्रचलित लिप्यंतरण द्वारा प्रस्तुत किया गया है।
theological_decisions:
- issue: אָמַר के बाद निहित कथ्य
  choice: ‘नाश करने के लिए’ को स्पष्ट किया गया
  alternative: ‘जिनके विषय में यहोवा ने उनसे कहा था’
  rationale: इब्रानी का शाब्दिक विन्यास ‘जिन्हें/जिनके विषय में यहोवा ने उनसे कहा’ जैसा अधूरा है। पूर्ववर्ती הִשְׁמִידוּ और व्यापक संदर्भ से नाश करने की आज्ञा निहित है; पूर्ति पाठ को सुबोध बनाती है, पर इस निहितार्थ को पादटिप्पणी में पारदर्शी रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘नाश करना’ मूल क्रिया की तीव्रता बनाए रखता है; वाक्य-विन्यास हिंदी में स्वाभाविक है और पादटिप्पणी मूल की दीर्घवृत्तिता बताती है।
