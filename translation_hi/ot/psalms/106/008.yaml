  text: Yet he saved them for the sake of his name[c][b][a], to make his might known.
translation:
  language: hi
  text: फिर भी उसने अपने नाम के निमित्त उन्हें बचाया,[a] ताकि वह अपना पराक्रम प्रकट करे।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘फिर भी’ के स्थान पर ‘और’ या ‘परन्तु’ भी अनुवाद किया जा सकता है; इब्रानी संयोजक के कई सम्भव अर्थ हैं, और यहाँ वह पिछले पद के साथ विरोध प्रकट करता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘ताकि वह अपना सामर्थ्य प्रकट करे।’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹשִׁיעֵם
  choice: फिर भी उसने ... उन्हें बचाया
  rationale: ישׁע का अर्थ ‘बचाना/छुड़ाना’ है। पिछले पद में इस्राएल के विद्रोह के विपरीत परमेश्वर के कार्य को दिखाने के लिए וַ का प्रसंगानुकूल विरोधसूचक भाव ‘फिर भी’ से व्यक्त किया गया है।
- source_word: לְמַעַן שְׁמוֹ
  choice: अपने नाम के निमित्त
  rationale: לְמַעַן हेतु या प्रेरणा बताता है। ‘नाम’ को बनाए रखने से परमेश्वर की प्रतिष्ठा के साथ उसके प्रकट चरित्र और सम्मान का व्यापक इब्रानी भाव सुरक्षित रहता है।
- source_word: לְהוֹדִיעַ
  choice: प्रकट करे
  rationale: ידע के हिफ़ील रूप का अर्थ ‘ज्ञात कराना’ है। इस वाक्य में ‘अपना पराक्रम प्रकट करे’ स्वाभाविक आधुनिक हिन्दी में वही प्रयोजन व्यक्त करता है।
- source_word: אֶת
  choice: '[अलग से अनूदित नहीं]'
  rationale: यह निश्चित कर्म को चिह्नित करने वाला व्याकरणिक अव्यय है; हिन्दी में कर्म और वाक्य-विन्यास से इसका कार्य स्पष्ट होता है।
- source_word: גְּבוּרָתוֹ
  choice: अपना पराक्रम
  rationale: גְּבוּרָה सामर्थ्य, पराक्रम या सामर्थ्यपूर्ण कार्य को सूचित कर सकता है। यहाँ एकवचन भाववाचक अर्थ में ‘पराक्रम’ परमेश्वर की प्रभावशाली सामर्थ्य को गरिमापूर्ण और स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: ‘अपने नाम के निमित्त’ का अर्थ
  choice: परमेश्वर का उद्धारकारी कार्य उसके अपने नाम, अर्थात उसके सम्मान और प्रकट चरित्र, के कारण है।
  alternative: अपनी प्रतिष्ठा के लिए
  rationale: ‘प्रतिष्ठा’ अर्थ का एक पहलू है, पर केवल उसी तक सीमित करना इब्रानी ‘नाम’ के व्यापक वाचा-संबंधी और आत्म-प्रकाशनात्मक भाव को संकुचित कर देगा।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण काव्यात्मक गद्य। ‘नाम के निमित्त’ बाइबलीय मुहावरे को बनाए रखता है, जबकि ‘फिर भी’ प्रसंग का विरोध स्पष्ट करता है।
