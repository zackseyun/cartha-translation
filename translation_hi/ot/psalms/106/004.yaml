  text: זָכְרֵ֣/נִי יְ֭הוָה בִּ/רְצ֣וֹן עַמֶּ֑/ךָ פָּ֝קְדֵ֗/נִי בִּ/ישׁוּעָתֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/004.yaml
  text: Remember me[a], O Yahweh, when you show favor to your people[b]; attend to me with your salvation.
translation:
  language: hi
  text: हे याहवे, जब तू अपनी प्रजा पर कृपा करे[a], तब मुझे याद कर; अपने उद्धार के साथ मुझ पर ध्यान दे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपनी प्रजा पर अपनी कृपा के साथ मुझे याद कर।”
    reason: lexical_alternative
  - marker: b
    text: या, “अपने उद्धार के साथ मुझसे मिलने आ।”
    reason: lexical_alternative
lexical_decisions:
- source_word: זָכְרֵנִי
  choice: मुझे याद कर
  rationale: זכר के क़ाल आज्ञार्थक और प्रथम पुरुष एकवचन प्रत्यय का सीधा, प्रार्थनापूर्ण निवेदन; हिन्दी में स्वाभाविक रहते हुए मूल क्रिया को बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय परमेश्वर-नाम को उपाधि से बदलने के बजाय उसके प्रचलित ध्वन्यात्मक रूप में रखा गया है।
- source_word: בִּרְצוֹן עַמֶּךָ
  choice: जब तू अपनी प्रजा पर कृपा करे
  rationale: רָצוֹן यहाँ कृपा, सद्भाव या अनुग्रह का भाव देता है। בְּ को प्रसंगानुसार कालवाचक/परिस्थितिवाचक समझना हिन्दी में अर्थ को स्पष्ट करता है, जबकि वैकल्पिक साहचर्यात्मक अर्थ पाद-टिप्पणी में सुरक्षित है।
- source_word: פָּקְדֵנִי
  choice: मेरी सुधि ले
  rationale: פקד इस प्रार्थना में किसी की ओर ध्यान देकर उसके हित में हस्तक्षेप करने का भाव रखता है। ‘मेरी सुधि ले’ आधुनिक हिन्दी में केवल भौतिक भेंट से अधिक व्यापक और अनुग्रहपूर्ण ध्यान व्यक्त करता है।
- source_word: בִּישׁוּעָתֶךָ
  choice: अपने उद्धार के साथ
  rationale: יְשׁוּעָה के संज्ञात्मक और व्यापक अर्थ—उद्धार या छुटकारा—तथा בְּ की संरचना को बनाए रखता है।
theological_decisions:
- issue: परमेश्वर-नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: पद में व्यक्तिगत वाचा-नाम सीधे प्रयुक्त है; ‘याहवे’ उसे किसी उपाधि से प्रतिस्थापित किए बिना प्रस्तुत करता है।
- issue: בִּרְצוֹן עַמֶּךָ का संबंध
  choice: कालवाचक/परिस्थितिवाचक—‘जब तू अपनी प्रजा पर कृपा करे’
  alternative: साहचर्यात्मक—‘अपनी प्रजा पर की गई कृपा के साथ’
  rationale: संक्षिप्त इब्रानी वाक्यांश दोनों संभावनाएँ देता है। मुख्य पाठ में स्वाभाविक कालवाचक अर्थ चुना गया है और दूसरी वास्तविक संभावना पाद-टिप्पणी में रखी गई है।
- issue: פָּקְדֵנִי में दिव्य आगमन या ध्यान
  choice: मेरी सुधि ले
  alternative: मेरे पास आ
  rationale: क्रिया में कृपापूर्ण ध्यान और सक्रिय हस्तक्षेप दोनों निहित हो सकते हैं। मुख्य पाठ व्यापक भाव रखता है; ‘आने/भेंट करने’ का अधिक शाब्दिक रूप पाद-टिप्पणी में है।
translation_notes:
  register: भाषा आधुनिक, प्रार्थनापूर्ण और गरिमापूर्ण रखी गई है। ‘तू’ भजन की सीधी एकवचन संबोधन-शैली को स्वाभाविक हिन्दी में व्यक्त करता है; ‘प्रजा’, ‘कृपा’, ‘सुधि’ और ‘उद्धार’ सामान्य धार्मिक-पाठकीय रजिस्टर में समझने योग्य हैं।
