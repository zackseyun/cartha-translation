  yaml_path: translation/ot/psalms/106/033.yaml
  text: For they embittered his spirit[b][a], and he spoke rashly with his lips.
translation:
  language: hi
  text: क्योंकि उन्होंने उसके मन को भड़का दिया[a], और वह अपने होंठों से उतावली में बोल गया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उन्होंने उसके मन को कड़वा कर दिया” या “उसे उकसाया”; इब्रानी क्रिया में किसी को कटु करने या भड़काने का भाव हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: अर्थात् मरीबा में मूसा ने आवेश में बोल दिया; गिनती 20:10 देखें।
    reason: cross_reference
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण बताता है और इब्रानी संबंधसूचक अव्यय के व्याख्यात्मक प्रवाह को स्वाभाविक हिन्दी में रखता है।
- source_word: הִמְרוּ
  choice: कड़वा कर दिया
  rationale: हिफ़ील रूप यहाँ किसी की भीतरी दशा को कटु करने या उसे उकसाने का भाव दे सकता है। ‘आत्मा’ को सीधे कर्म के रूप में रखते हुए यह अनुवाद कारणात्मक अर्थ को सुरक्षित रखता है।
- source_word: אֶת רוּחוֹ
  choice: उसकी आत्मा को
  rationale: यह मूसा की भीतरी मनोदशा की ओर संकेत करता है। ‘आत्मा’ मूल रूपक को बनाए रखता है और इसे न तो केवल क्रोध और न ही पवित्र आत्मा के रूप में सीमित करता है।
- source_word: וַיְבַטֵּא
  choice: उतावली बात बोल गया
  rationale: क्रिया का मूल अर्थ बोलना या उचारना है, पर सन्दर्भ में अविवेकपूर्ण, आवेगपूर्ण वाणी का नकारात्मक भाव है। यह हिन्दी प्रयोग उस भाव को सहजता से व्यक्त करता है।
- source_word: בִּשְׂפָתָיו
  choice: अपने होंठों से
  rationale: यह इब्रानी के ठोस वाणी-संबंधी बिम्ब को निकटता से सुरक्षित रखता है और आधुनिक हिन्दी में स्पष्ट है।
theological_decisions:
- issue: ‘उसकी आत्मा’ और ‘अपने होंठों’ में सर्वनाम का संदर्भ
  choice: दोनों सर्वनाम मूसा के लिए हैं।
  alternative: इन्हें लोगों के समूह या किसी अन्य पूर्ववर्ती पात्र से संबंधित समझना।
  rationale: 'मरीबा के वृत्तान्त के इस संक्षिप्त पुनर्कथन में लोगों के व्यवहार का परिणाम मूसा की विफलता के रूप में सामने आता है: उन्होंने उसे कटु या उत्तेजित किया और वह उतावली बात बोल गया। यह गिनती 20:10 के सन्दर्भ से मेल खाता है और पवित्र आत्मा का ऐसा उल्लेख नहीं जोड़ता जिसे प्रसंग स्पष्ट नहीं करता।'
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण काव्यात्मक गद्य। ‘आत्मा’ और ‘होंठों’ से मूल इब्रानी बिम्ब सुरक्षित है; ‘उतावली बात बोल गया’ प्रसंगगत नकारात्मकता को बिना अत्यधिक व्याख्या के व्यक्त करता है।
