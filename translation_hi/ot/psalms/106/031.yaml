  yaml_path: translation/ot/psalms/106/031.yaml
  text: And it was counted to him as righteousness from generation to generation forever[a][b].
translation:
  language: hi
  text: और यह उसके लिए धार्मिकता के रूप में गिना गया, पीढ़ी-दर-पीढ़ी सदा के लिए[a][b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “माना गया” अथवा “उसके खाते में दर्ज किया गया।” इब्रानी में यह किसी बात को धार्मिकता के रूप में मानने या गिनने की प्रचलित अभिव्यक्ति है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक अर्थ “पीढ़ी और पीढ़ी के लिए” है; यह सभी पीढ़ियों में बने रहने का मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּחָשֶׁב
  choice: गिनी गई
  rationale: निफ़अल रूप का निष्क्रिय अर्थ ‘गिनी/मानी गई’ है। ‘गिनी गई’ हिसाब में ठहराए जाने का भाव बनाए रखता है और उत्पत्ति 15:6 से जुड़ी बाइबलीय अभिव्यक्ति की प्रतिध्वनि भी सुरक्षित रखता है।
- source_word: לוֹ
  choice: उसके लिए
  rationale: לְ के साथ सर्वनाम उस व्यक्ति को सूचित करता है जिसके खाते या पक्ष में यह बात गिनी गई। हिंदी में ‘उसके लिए ... गिनी गई’ इस संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: לִצְדָקָה
  choice: धार्मिकता
  rationale: צְדָקָה का सामान्य अर्थ ‘धार्मिकता’ है। ‘धार्मिक काम’ कहने से अर्थ अनावश्यक रूप से केवल एक कर्म तक सीमित हो जाता।
- source_word: לְדֹר וָדֹר
  choice: पीढ़ी-दर-पीढ़ी
  rationale: शाब्दिक ‘पीढ़ी और पीढ़ी के लिए’ का यह स्वाभाविक हिंदी मुहावरा लगातार आने वाली सभी पीढ़ियों का भाव रखता है।
- source_word: עַד עוֹלָם
  choice: सदा तक
  rationale: यह पदबंध निरंतरता अथवा अनंत काल तक बने रहने को दर्शाता है। ‘सदा तक’ काव्यात्मक और सहज हिंदी है।
theological_decisions:
- issue: उत्पत्ति 15:6 से संबंध और गिनी हुई धार्मिकता का धर्मवैज्ञानिक अर्थ
  choice: ‘उसके लिए धार्मिकता गिनी गई’ की अभिव्यक्ति को बिना अतिरिक्त धर्मवैज्ञानिक व्याख्या के रखा गया।
  alternative: ‘उसका काम धार्मिक काम माना गया’
  rationale: इब्रानी पाठ धार्मिकता गिने जाने की व्यापक बाइबलीय अभिव्यक्ति को प्रतिध्वनित करता है। वैकल्पिक अनुवाद इसे केवल एक कर्म के नैतिक मूल्यांकन तक सीमित कर देता और पाठ में स्पष्ट न किए गए निष्कर्ष को जोड़ता।
translation_notes:
  register: आधुनिक मानक हिंदी; काव्यात्मक गरिमा के साथ सामान्य पाठकों के लिए सहज भाषा। ‘धार्मिकता गिनी गई’ जानबूझकर कुछ औपचारिक रखा गया है ताकि मूल इब्रानी की लेखा/मूल्यांकन संबंधी अभिव्यक्ति और उसका धर्मवैज्ञानिक तनाव सुरक्षित रहे।
