  yaml_path: translation/ot/psalms/106/001.yaml
  text: Praise Yah! Give thanks to Yahweh[a], for he is good[b], for his steadfast love endures forever.
translation:
  language: hi
  text: याह की स्तुति करो! याहवे का धन्यवाद करो, क्योंकि वह भला है; क्योंकि उसका अटल प्रेम सदा बना रहता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַֽלְלוּ
  choice: स्तुति करो
  rationale: הלל का बहुवचन आज्ञार्थक रूप है। ‘स्तुति करो’ सामूहिक उपासना के आह्वान को स्वाभाविक और स्पष्ट हिन्दी में व्यक्त करता है।
- source_word: יָהּ
  choice: याह
  rationale: यह परमेश्वर के नाम का संक्षिप्त काव्यात्मक रूप है। इसे ‘याह’ रखने से הַלְלוּ־יָהּ की उपासना-संबंधी अभिव्यक्ति और इसी पद में प्रयुक्त पूर्ण नाम से उसका रूपगत भेद सुरक्षित रहता है।
- source_word: הוֹד֣וּ
  choice: धन्यवाद करो
  rationale: भजन-साहित्य में ידה के हिफ़ील रूप का अर्थ धन्यवाद देना अथवा कृतज्ञतापूर्वक प्रशंसा करना है; यहाँ ‘धन्यवाद करो’ לַיהוָה के साथ स्वाभाविक है।
- source_word: לַ/יהוָ֣ה
  choice: यहोवा का
  rationale: לְ यहाँ धन्यवाद के लक्ष्य को चिह्नित करता है। आधुनिक हिन्दी में ‘यहोवा का धन्यवाद करो’ अधिक सहज है और इब्रानी व्यक्तिनाम को नाम के रूप में सुरक्षित रखता है।
- source_word: כִּי ט֑וֹב
  choice: क्योंकि वह भला है
  rationale: כִּי कारण बताता है और טוֹב विधेय विशेषण है, जिसका निहित कर्ता यहोवा है। हिन्दी में स्पष्टता के लिए ‘वह ... है’ जोड़ा गया है।
- source_word: לְ/עוֹלָ֣ם
  choice: सदा बनी रहती है
  rationale: शाब्दिक अर्थ ‘सदा के लिए’ है। חסד के साथ हिन्दी में ‘सदा बनी रहती है’ स्थायित्व को स्वाभाविक ढंग से व्यक्त करता है, बिना किसी समाप्ति-बिंदु का संकेत दिए।
- source_word: חַסְדּֽ/וֹ
  choice: उसकी अटल करुणा
  rationale: חסד में कृपा, करुणा, निष्ठा और स्थिर प्रेम के परस्पर जुड़े भाव हैं। ‘अटल करुणा’ इसकी दयालुता और विश्वसनीय स्थिरता दोनों को संक्षेप में व्यक्त करती है।
theological_decisions:
- issue: יְהוָה परमेश्वर के नाम का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल में चार-अक्षरीय व्यक्तिगत नाम सीधे आया है। ‘यहोवा’ हिन्दी बाइबलीय प्रयोग में परिचित नाम-रूप है और इसे सामान्य उपाधि ‘प्रभु’ में बदलकर मूल का भेद नहीं मिटाता। ‘याहवे’ अधिक संभावित विद्वत् पुनर्निर्माण है, पर हिन्दी के सामान्य पाठक के लिए कम परिचित है।
- issue: יָהּ के संक्षिप्त नाम-रूप का अनुवाद
  choice: याह
  alternative: यहोवा; प्रभु
  rationale: ‘याह’ मूल के संक्षिप्त काव्यात्मक रूप को बचाता है और उसी पद में יְהוָה के पूर्ण रूप से उसका संबंध तथा भेद दोनों दिखाई देते हैं।
- issue: חסד का अर्थ-क्षेत्र
  choice: अटल करुणा
  alternative: अटल प्रेम; करार की निष्ठा; दया
  rationale: मूल शब्द को केवल भावनात्मक प्रेम, केवल दया, या स्पष्ट रूप से ‘करार’ तक सीमित न करके उसकी दयालु और निष्ठावान स्थिरता को साथ रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामूहिक उपासना में बोलने योग्य रखी गई है। दोनों כִּי को दो बार ‘क्योंकि’ देकर इब्रानी समानांतर संरचना सुरक्षित की गई है; हिन्दी प्रवाह के लिए दोनों कारण-वाक्यों के बीच अर्धविराम रखा गया है।
