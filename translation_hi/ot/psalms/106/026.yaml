    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא
  choice: उठाया
  rationale: נשׂא का मूल अर्थ ‘उठाना’ है। ‘हाथ उठाया’ मूल इब्रानी बिंब को सुरक्षित रखता है, जबकि प्रसंग में शपथ लेने का भाव भी संभव है।
- source_word: יָדוֹ
  choice: अपना हाथ
  rationale: सप्रत्यय एकवचन संज्ञा का स्वाभाविक हिन्दी रूप; प्रसंग में कर्ता परमेश्वर है।
- source_word: לָהֶם
  choice: उनके विरुद्ध
  rationale: ל का मूल संबंध ‘उनकी ओर/उनके लिए’ हो सकता है, पर इस न्यायसूचक मुहावरे में विरोध का भाव है; हिन्दी में ‘उनके विरुद्ध’ इसे स्पष्ट और स्वाभाविक बनाता है।
- source_word: לְהַפִּיל
  choice: गिरा दे
  rationale: נפל के हिफ़ील रूप का कारणवाचक अर्थ ‘गिरा देना’ है; यह मूल क्रिया की शक्ति को बिना अनावश्यक विस्तार के व्यक्त करता है।
- source_word: אֹתָם
  choice: उन्हें
  rationale: प्रत्यक्ष कर्मवाचक सर्वनाम का सीधा और स्वाभाविक हिन्दी अनुवाद।
- source_word: בַּמִּדְבָּר
  choice: जंगल में
  rationale: निर्गमन और भटकने के प्रसंग में מִדְבָּר के लिए ‘जंगल’ प्रचलित बाइबलीय हिन्दी है और निर्जन वन-प्रदेश का भाव देता है।
theological_decisions:
- issue: ‘अपना हाथ उठाया’ मुहावरे का आशय
  choice: मुख्य पाठ में इब्रानी मुहावरा बनाए रखा गया है और शपथ का संभावित अर्थ पाद-टिप्पणी में दिया गया है।
  alternative: ‘उसने उनके विरुद्ध शपथ खाई’ या ‘उसने उनके विरुद्ध शपथ के लिए हाथ उठाया।’
  rationale: प्रसंग परमेश्वर की न्यायसूचक शपथ की ओर संकेत कर सकता है, पर इब्रानी पाठ में शपथ की क्रिया स्पष्ट रूप से नहीं कही गई। इसलिए बिंब और वास्तविक अर्थगत अस्पष्टता दोनों सुरक्षित रखे गए हैं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। वाक्य-संरचना मूल इब्रानी के कारण-उद्देश्य संबंध को बनाए रखती है।
