  yaml_path: translation/ot/psalms/106/013.yaml
  text: They quickly forgot his works[a]; they did not wait for his counsel.
translation:
  language: hi
  text: 'वे जल्दी ही उसके कामों को भूल गए;

    उन्होंने उसके परामर्श की प्रतीक्षा नहीं की।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसकी योजना” अथवा “उसका उद्देश्य।”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִהֲרוּ
  choice: शीघ्र ही
  rationale: यह מהר से निकला क्रियात्मक रूप है, जो उतावली या तेजी का भाव देता है। हिंदी में अगले क्रियापद के साथ ‘शीघ्र ही भूल गए’ स्वाभाविक है और केवल समय बीतने की अपेक्षा जल्दबाजी का संकेत भी बनाए रखता है।
- source_word: שָׁכְחוּ
  choice: भूल गए
  rationale: שכח का काल रूप पूर्ण हुई क्रिया बताता है; काव्यात्मक वृत्तांत में ‘भूल गए’ सीधा और स्वाभाविक अनुवाद है।
- source_word: מַעֲשָׂיו
  choice: उसके कामों को
  rationale: מַעֲשֶׂה कार्य या किए हुए काम को दर्शाता है। ‘उसके काम’ संक्षिप्त, सहज और परमेश्वर के सामर्थी कार्यों के संदर्भ के अनुकूल है।
- source_word: לֹא
  choice: नहीं
  rationale: हिंदी में निषेध का सीधा और स्वाभाविक रूप।
- source_word: חִכּוּ
  choice: प्रतीक्षा की
  rationale: חכה का मूल अर्थ प्रतीक्षा करना है। पूर्ण क्रिया और निषेध के साथ ‘प्रतीक्षा नहीं की’ स्रोत के अर्थ को स्पष्ट रूप से व्यक्त करता है।
- source_word: לַעֲצָתוֹ
  choice: उसकी सम्मति की
  rationale: עֵצָה में सम्मति, परामर्श, योजना या उद्देश्य का अर्थ हो सकता है। ‘सम्मति’ परमेश्वर के निर्देशन और विचारित इच्छा—दोनों की गुंजाइश रखती है, जबकि ‘सलाह’ कुछ हल्का और ‘योजना’ अधिक संकीर्ण लग सकती है।
theological_decisions:
- issue: इस संदर्भ में परमेश्वर की עֵצָה का अर्थ
  choice: उसकी सम्मति
  alternative: उसकी योजना / उसका उद्देश्य / उसका परामर्श
  rationale: ‘सम्मति’ इस्राएल द्वारा परमेश्वर के निर्देशन की प्रतीक्षा न करने के संबंधपरक भाव को बनाए रखती है, पर इसे केवल पूर्वनिर्धारित योजना या आदेश के रूप में सीमित नहीं करती।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी में, संक्षिप्त और गरिमापूर्ण रखी गई है। समानांतर काव्य-पंक्तियाँ संरक्षित हैं; ‘सम्मति’ व्यापक अर्थ-क्षेत्र और धर्मवैचारिक अस्पष्टता को बनाए रखती है।
