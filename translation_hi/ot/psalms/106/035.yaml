  text: but they mixed with the nations and learned their practices[a][b].
translation:
  language: hi
  text: पर वे जातियों में घुल-मिल गए[a] और उनके तौर-तरीके सीख लिए[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जातियों के बीच मिल-जुल गए।”
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक अर्थ “उनके कर्म” या “उनके कार्य”; यहाँ आशय उन जातियों के प्रचलित तौर-तरीकों और आचरण से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְעָרְבוּ
  choice: घुल-मिल गए
  rationale: हित्पएल रूप यहाँ आसपास के लोगों के बीच सामाजिक मेल-जोल और उनके साथ मिश्रित हो जाने का भाव देता है। ‘घुल-मिल गए’ आधुनिक हिंदी में स्वाभाविक है और आत्मसातीकरण की ओर संकेत करता है, पर मूल से अधिक स्पष्ट निंदा नहीं जोड़ता।
- source_word: בַגּוֹיִם
  choice: जातियों में
  rationale: גּוֹיִם का सामान्य अर्थ ‘जातियाँ/राष्ट्र’ है; यहाँ कनान की आसपास की गैर-इस्राएली प्रजा अभिप्रेत है। ‘जातियों में’ בְּ के स्थानगत अर्थ को बनाए रखता है और बाद की धार्मिक शब्दावली नहीं थोपता।
- source_word: וַיִּלְמְדוּ
  choice: सीख लिए
  rationale: काल रूप सक्रिय रूप से ‘उन्होंने सीखा’ बताता है। ‘सीख लिए’ उनके द्वारा उन आचरणों को ग्रहण करने का भाव स्वाभाविक हिंदी में व्यक्त करता है और निष्क्रिय रूप से सिखाए जाने का संकेत नहीं देता।
- source_word: מַעֲשֵׂיהֶם
  choice: उनके काम
  rationale: מַעֲשִׂים का मूल अर्थ ‘काम/कर्म’ है। मुख्य पाठ में ‘काम’ रखने से स्रोत की व्यापकता बनी रहती है; संदर्भ में यह उन जातियों के प्रचलित आचरण और रीति-व्यवहार को सूचित करता है, जिसे पादटिप्पणी स्पष्ट करती है।
theological_decisions:
- issue: जातियों के साथ इस्राएल के मेल-जोल का नैतिक-धार्मिक बल
  choice: ‘जातियों में घुल-मिल गए और उनके काम सीख लिए’ कहकर दोषपूर्ण आत्मसातीकरण का संकेत देना, पर स्पष्ट निंदा न जोड़ना
  alternative: अधिक तटस्थ ‘जातियों के बीच रहने लगे’ या अधिक व्याख्यात्मक ‘जातियों के साथ मिलकर अशुद्ध हो गए’
  rationale: इब्रानी पाठ मेल-जोल और सीखने की बात करता है; उसका नकारात्मक मूल्यांकन व्यापक संदर्भ से आता है। यह रूप उस तनाव को बनाए रखता है, न आरोप को हल्का करता है, न मूल से अधिक तीखा।
translation_notes:
  register: आधुनिक मानक हिंदी, सहज किंतु गरिमापूर्ण शैली। ‘जातियाँ’ मूल की व्यापक सामुदायिक संज्ञा को रखता है; ‘गैर-यहूदी’ जैसे बाद के अर्थ-संकेत से बचा गया है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में दिए गए हैं।
