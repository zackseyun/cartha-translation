base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/029.yaml
  text: They provoked him to anger by their deeds[a], and a plague broke out among them.
translation:
  language: hi
  text: अपने कामों से उन्होंने उसे[a] क्रोधित किया, और उनके बीच महामारी फूट पड़ी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल इब्रानी में ‘उसे’ स्पष्ट रूप से नहीं है; संदर्भ में संकेत परमेश्वर की ओर है।
    reason: मूल पाठ में निहित कर्म-विषय को स्पष्ट करना और उसकी व्याकरणिक अस्पष्टता बनाए रखना।
lexical_decisions:
- source_word: וַיַּכְעִיסוּ
  choice: उन्होंने ... क्रोधित किया
  rationale: כעס के हिफ़ील रूप में किसी को क्रोध दिलाने या क्रोधित करने का भाव है। ‘क्रोधित किया’ आधुनिक हिन्दी में स्वाभाविक रहते हुए इस कारणवाचक अर्थ को व्यक्त करता है।
- source_word: בְּמַעַלְלֵיהֶם
  choice: अपने कामों से
  rationale: מַעֲלָלִים यहाँ नैतिक अर्थ-छाया वाले कामों या कृत्यों को दर्शाता है, और ב साधन बताता है। ‘अपने कामों से’ सहज और स्पष्ट है।
- source_word: וַתִּפְרָץ
  choice: फैल पड़ी
  rationale: פרץ अचानक फूट पड़ने का भाव रखता है। महामारी के साथ ‘फैल पड़ी’ स्वाभाविक हिन्दी प्रयोग है और उसके आकस्मिक आरंभ तथा समुदाय में प्रसार को व्यक्त करता है।
- source_word: בָּם
  choice: उनके बीच
  rationale: यह प्रयोग उस समूह के भीतर महामारी के प्रकट होने को बताता है। ‘उनके बीच’ हिन्दी में इसका स्वाभाविक रूप है।
- source_word: מַגֵּפָה
  choice: महामारी
  rationale: מַגֵּפָה घातक प्रकोप या दंडस्वरूप विपत्ति को दर्शाता है। इस प्रसंग में ‘महामारी’ आधुनिक पाठक के लिए सबसे स्पष्ट शब्द है।
theological_decisions:
- issue: ‘क्रोधित किया’ का अंतर्निहित ईश्वरीय कर्म-विषय
  choice: मुख्य पाठ में ‘उसे’ रखा गया है और पादटिप्पणी में बताया गया है कि यह संदर्भानुसार परमेश्वर है।
  alternative: कर्म-विषय को अनकहा छोड़ना, या सीधे ‘परमेश्वर को’ कहना।
  rationale: इब्रानी में कर्म-विषय स्पष्ट रूप से नहीं दिया गया, पर भजन का संदर्भ परमेश्वर की ओर संकेत करता है। हिन्दी में ‘उसे’ वाक्य को स्वाभाविक बनाता है, जबकि पादटिप्पणी मूल की अल्पोक्ति सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। ‘कामों’ और ‘महामारी’ जैसे सामान्य शब्द साधारण पाठकों के लिए स्पष्ट हैं; वाक्य की समानांतर काव्यात्मक संरचना भी बनाए रखी गई है।
