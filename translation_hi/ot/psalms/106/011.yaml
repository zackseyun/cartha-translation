base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/011.yaml
  text: The waters covered their adversaries[b][a]; not one of them remained.
translation:
  language: hi
  text: जल ने उनके शत्रुओं को ढक लिया; उनमें से एक भी न बचा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְכַסּוּ
  choice: ढक लिया
  rationale: मूल क्रिया כסה का सीधा अर्थ ‘ढकना’ है; समुद्र के प्रसंग में यह जल की वास्तविक क्रिया को सजीव और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: מַיִם
  choice: जल
  rationale: हिब्रू बहुवचन रूप को हिन्दी में अगणनीय सामूहिक संज्ञा ‘जल’ से स्वाभाविक रूप से व्यक्त किया गया है; प्रसंग से निश्चित समुद्री जल स्पष्ट है।
- source_word: צָרֵיהֶם
  choice: उनके शत्रुओं
  rationale: צָר hostile opponents को सूचित करता है। ‘शत्रु’ आधुनिक हिन्दी में स्पष्ट, dignified और प्रसंगानुकूल है; ‘विरोधी’ अपेक्षाकृत कम तीव्र हो सकता है।
- source_word: אֶחָד מֵהֶם
  choice: उनमें से एक भी
  rationale: शाब्दिक अर्थ ‘उनमें से एक’ है; निषेध के साथ हिन्दी में ‘उनमें से एक भी’ पूर्ण विनाश का स्वाभाविक और सटीक बोध देता है।
- source_word: לֹא נוֹתָר
  choice: न बचा
  rationale: निफ़अल रूप का अर्थ ‘शेष रहना/बचा रहना’ है। ‘न बचा’ संक्षिप्त और स्वाभाविक है तथा ‘जीवित बचा’ कहकर मूल से अधिक व्याख्या नहीं जोड़ता।
theological_decisions: []
translation_notes:
  register: सरल, वर्तमान और गरिमापूर्ण मानक हिन्दी। पद की समानांतर, संक्षिप्त काव्यात्मक संरचना बनाए रखी गई है। किसी पाद-टिप्पणी की आवश्यकता नहीं, क्योंकि ‘शत्रु’ और ‘एक भी न बचा’ मूल के अर्थ को बिना महत्वपूर्ण अस्पष्टता खोए स्वाभाविक रूप से व्यक्त करते हैं।
