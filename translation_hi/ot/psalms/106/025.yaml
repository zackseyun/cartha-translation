  text: וַ/יֵּרָגְנ֥וּ בְ/אָהֳלֵי/הֶ֑ם לֹ֥א שָׁ֝מְע֗וּ בְּ/ק֣וֹל יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/025.yaml
  text: So they grumbled in their tents[b][a]; they did not listen to the voice of Yahweh.
translation:
  language: hi
  text: वे अपने तंबुओं में कुड़कुड़ाए[a]; उन्होंने याहवे की वाणी पर ध्यान नहीं दिया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘बड़बड़ाए’ अथवा ‘शिकायत करते रहे।’ इब्रानी क्रिया असंतोष में धीमे स्वर से शिकायत करने का भाव देती है।
    reason: lexical_alternative
  - marker: b
    text: या ‘उन्होंने याहवे की बात नहीं मानी।’ इब्रानी मुहावरे में किसी की वाणी सुनने का अर्थ उस पर ध्यान देना या उसका कहना मानना भी हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּרָגְנוּ
  choice: वे ... कुड़कुड़ाए
  rationale: רגן असंतोष में धीमे स्वर से शिकायत करने या बड़बड़ाने को व्यक्त करता है। ‘कुड़कुड़ाए’ आधुनिक हिन्दी में इस नकारात्मक और दबे स्वर वाले भाव को स्वाभाविक रूप से रखता है।
- source_word: בְאָהֳלֵיהֶם
  choice: अपने तंबुओं में
  rationale: אֹהֶל का ठोस अर्थ ‘तंबू’ है; जंगल की पृष्ठभूमि में इसे सामान्य ‘निवासों’ में बदलना उचित नहीं।
- source_word: לֹא שָׁמְעוּ בְּקוֹל
  choice: वाणी पर ध्यान नहीं दिया
  rationale: यह इब्रानी मुहावरा सुनने के साथ-साथ ध्यान देने और मानने का भाव रखता है। यह अनुवाद श्रवण-संबंधी बिंब को बनाए रखते हुए केवल ध्वनि न सुन पाने का भ्रामक अर्थ टालता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत नाम יהוה है; ‘याहवे’ उसका हिन्दी लिप्यंतरण है, किसी उपाधि का प्रतिस्थापन नहीं।
theological_decisions:
- issue: יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल में वाचा का व्यक्तिगत नाम सीधे प्रयुक्त है। ‘याहवे’ प्रचलित विद्वत्तापूर्ण उच्चारण को देवनागरी में रखता है और नाम को उपाधि से नहीं बदलता।
- issue: שׁמע בקול में सुनने और आज्ञा मानने का संबंध
  choice: वाणी पर ध्यान नहीं दिया
  alternative: बात नहीं मानी
  rationale: मुहावरे में आज्ञापालन निहित है, पर केवल ‘बात नहीं मानी’ करने से मूल का ‘वाणी’ वाला बिंब मिट जाता। मुख्य पाठ दोनों अर्थों के लिए स्थान रखता है और पादटिप्पणी अधिक स्पष्ट विकल्प देती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘तंबू’ मूल की ठोस जंगल-यात्रा संबंधी छवि बनाए रखता है; ‘वाणी पर ध्यान नहीं दिया’ मूल मुहावरे की श्रवण-छवि और आज्ञा न मानने के निहितार्थ, दोनों को संतुलित करता है।
