    reason: lexical_alternative
  - marker: b
    text: यह निर्गमन 32 में होरेब अर्थात् सीनै पर बनाए गए बछड़े की घटना की याद दिलाता है।
    reason: cross_reference
lexical_decisions:
- source_word: יַעֲשׂוּ
  choice: उन्होंने ... बनाया
  rationale: עשה का सामान्य अर्थ ‘बनाना’ है; यह सीधा और स्वाभाविक अनुवाद है तथा निर्माण की विधि के बारे में अतिरिक्त अर्थ नहीं जोड़ता।
- source_word: עֵגֶל
  choice: एक बछड़ा
  rationale: עֵגֶל छोटे गोवंश या बछड़े को दर्शाता है। ‘बछड़ा’ निर्गमन 32 की घटना से संबंध बनाए रखता है, पर इस पद में न आए ‘सोने का’ विवरण को नहीं जोड़ता।
- source_word: בְּחֹרֵב
  choice: होरेब में
  rationale: स्थानसूचक ב के लिए ‘में’ स्वाभाविक हिन्दी है और होरेब के क्षेत्र में घटी घटना को व्यक्त करता है।
- source_word: וַיִּשְׁתַּחֲווּ
  choice: दण्डवत् किया
  rationale: यह क्रिया आदर या उपासना में झुकने अथवा भूमि पर गिरने की शारीरिक क्रिया बताती है। ‘दण्डवत् किया’ उस क्रिया को बनाए रखता है और प्रसंग से मूर्तिपूजा का आशय स्पष्ट होने देता है।
- source_word: לְמַסֵּכָה
  choice: ढली हुई मूर्ति के आगे
  rationale: מַסֵּכָה साँचे में ढालकर बनाई गई, प्रायः धातु की, प्रतिमा को दर्शाता है। ‘ढली हुई मूर्ति’ निर्माण-संबंधी विशिष्टता को सामान्य ‘मूर्ति’ की तुलना में बेहतर सुरक्षित रखता है।
theological_decisions:
- issue: क्या मूर्ति को मुख्य पाठ में ‘सोने का बछड़ा’ कहा जाए
  choice: केवल ‘एक बछड़ा’ रखा गया है।
  alternative: ‘सोने का बछड़ा’
  rationale: निर्गमन 32 में सोने का उल्लेख है, पर भजन 106:19 में केवल ‘बछड़ा’ और ‘ढली हुई मूर्ति’ कहा गया है। इसलिए ‘सोने का’ जोड़ना इस पद की सीमा से बाहर का विवरण होता।
- issue: וַיִּשְׁתַּחֲווּ को सीधे ‘आराधना की’ कहना या शारीरिक क्रिया बनाए रखना
  choice: ‘दण्डवत् किया’
  alternative: ‘आराधना की’
  rationale: मूल क्रिया झुकने या भूमि पर गिरने के कार्य को व्यक्त करती है; प्रसंग उसका मूर्तिपूजक अर्थ स्पष्ट करता है। इस प्रकार अनुवाद क्रिया और धार्मिक आशय के बीच की मूल भाषाई परत को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट शैली। ‘दण्डवत् किया’ धार्मिक प्रसंग में स्वाभाविक है और मूल की शारीरिक क्रिया को ‘आराधना की’ की अपेक्षा अधिक निकटता से रखता है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में दिए गए हैं।
