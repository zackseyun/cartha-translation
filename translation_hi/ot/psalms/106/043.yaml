source:
  edition: WLC
  text: פְּעָמִ֥ים רַבּ֗וֹת יַצִּ֫ילֵ֥/ם וְ֭/הֵמָּה יַמְר֣וּ בַ/עֲצָתָ֑/ם וַ֝/יָּמֹ֗כּוּ בַּ/עֲוֺנָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/043.yaml
  text: Many times he delivered them[b][a], but they were rebellious in their counsel, and they were brought low by their iniquity.
translation:
  language: hi
  text: बहुत बार उसने उन्हें छुड़ाया, फिर भी वे अपनी योजना के अनुसार[a] विद्रोह करते रहे और अपने अधर्म के कारण दीन दशा में पहुँच गए[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपनी सलाह/युक्ति में विद्रोह करते रहे।” इब्रानी शब्द का अर्थ “सलाह,” “युक्ति,” “योजना” या “उद्देश्य” हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “गिरते गए” अथवा “क्षीण होते गए।” इब्रानी क्रिया नीचे हो जाने, ढहने या क्षीण होने का भाव दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּעָמִים רַבּוֹת
  choice: बहुत बार
  rationale: यह पदबंध अनेक अवसरों पर बार-बार हुई कार्रवाई को व्यक्त करता है; ‘बहुत बार’ स्वाभाविक और स्रोत के निकट है।
- source_word: יַצִּילֵם
  choice: उसने उन्हें छुड़ाया
  rationale: हिफ़ील रूप का अर्थ संकट या शत्रु के हाथ से बचाना अथवा छुड़ाना है। ‘छुड़ाया’ प्रसंग में परमेश्वर द्वारा बार-बार किए गए उद्धार को बिना अनावश्यक धर्मवैज्ञानिक विस्तार के व्यक्त करता है।
- source_word: וְהֵמָּה
  choice: फिर भी वे
  rationale: स्वतंत्र सर्वनाम बल देता है और पिछले उपवाक्य से तीखा विरोध दिखाता है; ‘फिर भी वे’ इस प्रतिकूल संबंध को स्पष्ट और स्वाभाविक बनाता है।
- source_word: יַמְרוּ
  choice: विद्रोह करते रहे
  rationale: क्रिया מרה विरोध और विद्रोह बताती है। अपूर्ण रूप तथा बार-बार छुड़ाए जाने के प्रसंग में ‘करते रहे’ उनके निरंतर रवैये को व्यक्त करता है, पर उसे केवल विशेषण बनाकर क्रियात्मकता नहीं खोता।
- source_word: בַעֲצָתָם
  choice: अपनी ही योजना के अनुसार
  rationale: עֵצָה का अर्थ सलाह, युक्ति, योजना या उद्देश्य हो सकता है। मुख्य पाठ में ‘योजना’ सामान्य पाठक के लिए स्वाभाविक है; पादटिप्पणी ‘सलाह/युक्ति’ की वास्तविक शाब्दिक संभावना सुरक्षित रखती है।
- source_word: וַיָּמֹכּוּ
  choice: दीन दशा में पहुँच गए
  rationale: מוך नीचे हो जाने, गिरने या क्षीण होने का भाव देता है। यह चयन परिणामी नीची और दुर्बल दशा को सहज हिन्दी में व्यक्त करता है, जबकि पादटिप्पणी वैकल्पिक बिंबों को सुरक्षित रखती है।
- source_word: בַּעֲוֺנָם
  choice: अपने अधर्म के कारण
  rationale: עָוֹן अधर्म, दोष अथवा दोष-दंड का अर्थ दे सकता है। यहाँ संबंध कारणात्मक है; ‘अधर्म के कारण’ नैतिक गंभीरता और परिणाम, दोनों को स्पष्ट रखता है।
theological_decisions:
- issue: छुड़ाने वाले का कर्ता
  choice: ‘उसने’ रखा गया है और संदर्भ से उसका संकेत परमेश्वर की ओर है।
  alternative: इस पद में ‘परमेश्वर’ या ‘यहोवा’ नाम स्पष्ट रूप से जोड़ना।
  rationale: इब्रानी क्रिया का कर्ता तीसरा पुरुष एकवचन है, पर इस पद में दिव्य नाम दोहराया नहीं गया। सर्वनाम स्रोत की संक्षिप्तता बनाए रखता है और भजन का संदर्भ कर्ता स्पष्ट करता है।
- issue: עָוֹן का नैतिक अर्थ
  choice: ‘अधर्म’
  alternative: ‘दोष’ या ‘बुराई’
  rationale: ‘अधर्म’ वाचा-संबंधी विद्रोह की नैतिक गंभीरता को बनाए रखता है, फिर भी किसी विशिष्ट संप्रदायगत व्याख्या को नहीं जोड़ता।
- issue: וַיָּמֹכּוּ में कर्तृत्व और परिणाम
  choice: ‘दीन दशा में पहुँच गए’
  alternative: ‘उन्हें नीचा किया गया’
  rationale: इब्रानी रूप का मूल भाव स्वयं नीची दशा में हो जाना है; हिन्दी में स्पष्ट बाहरी कर्ता जोड़ने से बचते हुए परिणाम व्यक्त किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सरल काव्यात्मक गद्य रखा गया है। ‘फिर भी’ विरोध को स्पष्ट करता है; ‘करते रहे’ बार-बार के विद्रोह को दर्शाता है। सभी पादटिप्पणी चिह्न संबंधित वाक्यांशों के तुरंत बाद रखे गए हैं।
