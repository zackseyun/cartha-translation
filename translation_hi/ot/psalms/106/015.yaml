base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/015.yaml
  text: So he gave them what they asked for[c][b][a], but sent leanness into their soul.
translation:
  language: hi
  text: उसने उन्हें वही दिया जो उन्होंने माँगा था[a], पर उनके प्राणों में कृशता भेज दी[b][c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उनकी माँग।”
    reason: lexical_alternative
  - marker: b
    text: या “क्षीणता,” “क्षय,” या “दुबलापन।”
    reason: lexical_alternative
  - marker: c
    text: 'इब्रानी: नेफ़ेश; इसका अर्थ “प्राण,” “जीवन,” “स्वयं,” या “संपूर्ण अस्तित्व” भी हो सकता है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: उसने…दे दी
  rationale: נתן का सीधा अर्थ ‘देना’ है; हिन्दी में पूर्ण क्रिया ‘दे दी’ प्रसंग के अनुकूल और स्वाभाविक है।
- source_word: לָהֶם
  choice: उन्हें
  rationale: यह अप्रत्यक्ष कर्म का बहुवचन सर्वनाम है।
- source_word: שֶׁאֱלָתָם
  choice: उनकी माँगी हुई वस्तु
  rationale: שְׁאֵלָה का अर्थ ‘माँगी हुई वस्तु’ या ‘निवेदन’ हो सकता है। यह चयन इस बात को स्पष्ट रखता है कि उन्हें वह मिला जो उन्होंने माँगा था, जबकि पादटिप्पणी संक्षिप्त विकल्प देती है।
- source_word: וַיְשַׁלַּח
  choice: पर…भेज दी
  rationale: मूल में संयोजक ‘और’ है, किंतु दोनों उपवाक्यों के बीच स्पष्ट भावगत विरोध है; ‘पर’ उस विरोध को स्वाभाविक हिन्दी में व्यक्त करता है और ‘भेज दी’ क्रिया की मूल छवि बनाए रखता है।
- source_word: רָזוֹן
  choice: क्षीणता
  rationale: यह शब्द दुबलेपन, क्षय या कृशता को दर्शाता है। ‘क्षीणता’ काव्यात्मक रूपक और व्यापक अर्थ दोनों बनाए रखती है, बिना इसे निश्चित रूप से किसी रोग का नाम दिए।
- source_word: בְּנַפְשָׁם
  choice: उनके प्राणों में
  rationale: נֶפֶשׁ जीवन, प्राण, स्वयं या संपूर्ण अस्तित्व को सूचित कर सकता है। ‘प्राणों में’ हिन्दी में व्यक्ति के जीवन और भीतरी अस्तित्व तक पहुँचने वाले प्रभाव को व्यक्त करता है, जबकि पादटिप्पणी अर्थ-सीमा स्पष्ट करती है।
theological_decisions:
- issue: न्याय के प्रसंग में נֶפֶשׁ का अर्थ
  choice: मुख्य पाठ में ‘प्राणों’
  alternative: जीवन में; अस्तित्व में; स्वयं उनके भीतर
  rationale: ‘प्राण’ इस शब्द को केवल अमूर्त, देह-विहीन ‘आत्मा’ तक सीमित नहीं करता, फिर भी न्याय के उनके गहरे जीवन तक पहुँचने का बल बनाए रखता है। पादटिप्पणी मूल शब्द की व्यापक अर्थ-सीमा सुरक्षित रखती है।
- issue: दोनों उपवाक्यों का संबंध
  choice: विरोधसूचक ‘पर’
  alternative: संयोजक ‘और’
  rationale: इब्रानी में सामान्य संयोजक है, पर प्रसंग में माँगी हुई वस्तु देने और क्षीणता भेजने के बीच विरोध है। ‘पर’ इस निहित संबंध को स्पष्ट करता है, बिना कारण या उद्देश्य जोड़ने के।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, काव्यात्मक और गरिमापूर्ण शैली रखी गई है। ‘माँगी हुई वस्तु’ सामान्य पाठक के लिए स्पष्ट है; ‘क्षीणता’ भजन की रूपकात्मक तीव्रता बनाए रखती है।
