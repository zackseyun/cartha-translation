base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/009.yaml
  text: He rebuked the Red Sea[a], and it dried up; he led them through the depths as through the wilderness.
translation:
  language: hi
  text: उसने लाल सागर[a] को डाँटा, और वह सूख गया; उसने उन्हें गहराइयों के बीच से ऐसे ले चला, जैसे वीराने में से।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या “सरकंडों का सागर।” इब्रानी: याम सूफ़।'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְעַר
  choice: डाँटा
  rationale: यह क्रिया सामान्यतः डाँटने या झिड़कने का भाव रखती है। यहाँ समुद्र को मानो व्यक्ति मानकर कही गई सजीव काव्यात्मक छवि को बनाए रखा गया है।
- source_word: בְּיַם סוּף
  choice: लाल सागर
  rationale: निर्गमन की घटना के इस पारंपरिक भौगोलिक नाम को मुख्य पाठ में रखा गया है; इब्रानी पद का अधिक शाब्दिक अर्थ पाद-टिप्पणी में दिया गया है।
- source_word: וַיֶּחֱרָב
  choice: वह सूख गया
  rationale: इब्रानी क्रिया की अकर्मक अवस्था—सूख जाना—को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: וַיּוֹלִיכֵם
  choice: उसने उन्हें ... निकाला
  rationale: हिफ़ील रूप उन्हें मार्ग से पार ले जाने का भाव देता है। समुद्र की गहराइयों के संदर्भ में ‘निकाला’ हिन्दी में स्वाभाविक है और दैवी अगुवाई को व्यक्त करता है।
- source_word: בַּתְּהֹמוֹת
  choice: गहराइयों के बीच से
  rationale: बहुवचन संज्ञा विशाल जलीय गहराइयों की काव्यात्मक छवि प्रस्तुत करती है; ‘के बीच से’ मार्ग और गति दोनों को स्पष्ट करता है।
- source_word: כַּמִּדְבָּר
  choice: जैसे वीराने में से
  rationale: उपमा यह बताती है कि परमेश्वर ने समुद्र की गहराइयों में भी ऐसा मार्ग दिया मानो खुले निर्जन भूभाग में से ले जा रहा हो। ‘वीराना’ यहाँ निर्जन प्रदेश का सहज, काव्यात्मक हिन्दी रूप है।
theological_decisions:
- issue: निर्गमन-संदर्भ में יַם סוּף का अनुवाद
  choice: लाल सागर
  alternative: सरकंडों का सागर
  rationale: ‘लाल सागर’ हिन्दी पाठकों के लिए निर्गमन की घटना का परिचित नाम है, जबकि इब्रानी अभिव्यक्ति का अधिक शाब्दिक और विवादित विकल्प पाद-टिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक रखी गई है। ‘डाँटा’ मूल के मानवीकरण को बचाता है, जबकि ‘वीराना’ מִדְבָּר के निर्जन भूभाग वाले अर्थ को सामान्य हिन्दी में व्यक्त करता है।
