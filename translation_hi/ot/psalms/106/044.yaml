id: PSA.106.44
reference: Psalms 106:44
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ֭/יַּרְא בַּ/צַּ֣ר לָ/הֶ֑ם בְּ֝/שָׁמְע֗/וֹ אֶת רִנָּתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/044.yaml
  text: Yet he saw their distress when he heard their cry,[a]
translation:
  language: hi
  text: फिर भी जब उसने उनकी दुहाई सुनी, तो उसने उनका संकट देखा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और जब उसने उनकी दुहाई सुनी, तब उसने उन पर आए संकट को देखा।”
    reason: मूल में आरंभिक संयोजक को साधारण ‘और’ समझना और לָהֶם को ‘उन पर’ के रूप में रखना भी संभव है।
lexical_decisions:
- source_word: וַיַּרְא
  choice: उसने ... देखा
  rationale: ראה का सीधा अर्थ ‘देखना’ है; यहाँ इसका भाव केवल दृष्टि पड़ना नहीं, बल्कि संकट पर ध्यान देना भी है। हिंदी में ‘देखा’ इब्रानी मुहावरे को सहज रूप से बनाए रखता है।
- source_word: בַּצַּר לָהֶם
  choice: उनका संकट
  rationale: צַר संकट या विपत्ति की दशा को बताता है और לָהֶם के साथ इसका स्वाभाविक हिंदी रूप ‘उनका संकट’ है।
- source_word: בְּשָׁמְעוֹ
  choice: जब उसने ... सुनी
  rationale: ב के साथ infinitive construct यहाँ कालवाचक उपवाक्य बनाता है; इसलिए ‘जब उसने सुनी’ स्रोत की संरचना और अर्थ को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: רִנָּתָם
  choice: उनकी दुहाई
  rationale: רִנָּה कभी ऊँची पुकार या जयध्वनि हो सकता है, पर संकट के इस प्रसंग में सहायता के लिए की गई तीव्र पुकार अभिप्रेत है। ‘दुहाई’ इस अर्थ को संक्षिप्त और गरिमापूर्ण ढंग से व्यक्त करती है।
- source_word: וַ
  choice: फिर भी
  rationale: मूल संयोजक सामान्यतः ‘और’ है, किंतु पिछले विद्रोह और दंड के बाद परमेश्वर की दयापूर्ण प्रतिक्रिया के संदर्भ में इसका विरोधसूचक बल है; ‘फिर भी’ उस तनाव को स्पष्ट करता है।
theological_decisions:
- issue: न्याय के बाद दया के प्रसंग में आरंभिक וַ का प्रवचनात्मक बल
  choice: 'विरोधसूचक भाव: ‘फिर भी’'
  alternative: साधारण संयोजक ‘और’ अथवा क्रमसूचक ‘तब’
  rationale: भजन का प्रवाह इस्राएल के विद्रोह और उत्पीड़न के बावजूद परमेश्वर की दयापूर्ण प्रतिक्रिया दिखाता है। ‘फिर भी’ न्याय और दया के बीच के तनाव को बिना नई धर्मवैज्ञानिक सामग्री जोड़े सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी; सरल, गरिमापूर्ण और पाठयोग्य शैली। ‘दुहाई’ को संकट में सहायता की प्रबल पुकार के लिए चुना गया है।
