source:
  edition: WLC
  text: וַ/יִּֽחַר אַ֣ף יְהוָ֣ה בְּ/עַמּ֑/וֹ וַ֝/יְתָעֵ֗ב אֶת נַחֲלָתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/040.yaml
  text: So Yahweh’s anger burned against his people[b][a], and he abhorred his inheritance.
translation:
  language: hi
  text: तब याहवे का क्रोध अपनी प्रजा पर भड़क उठा, और उसने अपनी विरासत से घृणा की।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּחַר אַף
  choice: क्रोध ... भड़क उठा
  rationale: חרה אף का मुहावरा क्रोध के गरम होने या भड़क उठने का चित्र प्रस्तुत करता है। यह अभिव्यक्ति आधुनिक हिन्दी में स्वाभाविक है और मूल रूपक की तीव्रता बनाए रखती है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चार अक्षरों वाले व्यक्तिगत ईश्वरीय नाम को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है, न कि किसी उपाधि से।
- source_word: בְּעַמּוֹ
  choice: अपनी प्रजा पर
  rationale: क्रोध-सूचक क्रिया के साथ ב क्रोध के लक्ष्य को दर्शाता है। ‘अपनी प्रजा पर’ हिन्दी में इस संबंध को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: וַיְתָעֵב
  choice: घृणा की
  rationale: תעב तीव्र अरुचि और घृणा को व्यक्त करता है। ‘घृणा की’ साधारण आधुनिक पाठक के लिए स्पष्ट है और मूल की प्रबलता को पर्याप्त रूप से बनाए रखता है।
- source_word: נַחֲלָתוֹ
  choice: अपनी विरासत
  rationale: נחלה विरासत अथवा आवंटित निज भाग को दर्शाता है। यहाँ यह परमेश्वर की प्रजा के लिए प्रयुक्त है; ‘विरासत’ इस वाचा-संबंधी और स्वामित्वपरक अर्थ को सुरक्षित रखती है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम सीधे आया है। हिन्दी बाइबल परंपरा में व्यापक रूप से पहचाना जाने वाला ‘यहोवा’ नाम को उपाधि में बदले बिना सुरक्षित रखता है।
- issue: ईश्वरीय क्रोध की मानवरूपी भाषा
  choice: यहोवा का क्रोध ... भड़क उठा
  alternative: यहोवा क्रोधित हुआ
  rationale: मूल का ताप और प्रज्वलन-संबंधी सजीव मुहावरा ज्यों का त्यों बनाए रखा गया है; इसे सपाट या व्यवस्थित धर्मवैज्ञानिक कथन में नहीं बदला गया।
- issue: परमेश्वर द्वारा अपनी विरासत से घृणा
  choice: उसने अपनी विरासत से घृणा की
  alternative: उसे अपनी विरासत से घिन हुई
  rationale: कठोर कथन को नरम नहीं किया गया। ‘घृणा की’ मूल के तीव्र भाव को बनाए रखते हुए अनावश्यक रूप से शारीरिक वितृष्णा का अर्थ नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए सहज रखी गई है। समानांतर वाक्य-विन्यास और मूल की तीव्र भावात्मक भाषा सुरक्षित हैं।
