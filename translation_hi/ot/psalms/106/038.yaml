  verdict: revise
  source_fidelity: The draft accurately conveys the pouring/shed blood, its innocence, the identification of the victims as the people's sons and daughters, their sacrificial killing, and the resulting pollution of the land. The plural בַּדָּמִים is appropriately retained as ‘खून से’ in the text and explained in the footnote.
  naturalness: The sentence is clear and has an appropriate grave, poetic register. However, ‘मूर्तियों के लिए बलि चढ़ाया’ is less idiomatic and can sound as though the idols merely benefit from the sacrifice rather than receive it. ‘मूर्तियों को बलि चढ़ाया’ is the customary Hindi construction.
  terminology: ‘खून,’ ‘बलि चढ़ाया,’ and ‘अपवित्र’ are natural modern-Hindi choices. ‘भूमि’ more directly represents הָאָרֶץ as the polluted land and avoids the possible modern nation-state association of ‘देश.’
  issues:
  - severity: low
    issue: The phrase ‘कनान की मूर्तियों के लिए बलि चढ़ाया’ is slightly unnatural and less precise in Hindi.
    rationale: The Hebrew לְ marks the recipient of sacrifice. In Hindi, ‘मूर्तियों को बलि चढ़ाया’ naturally expresses that the children were offered to those idols without adding an interpretive element.
  - severity: low
    issue: ‘देश’ can suggest a modern political country.
    rationale: In this context הָאָרֶץ denotes the land/territory that is morally polluted. ‘भूमि’ is more direct and retains the elevated biblical register.
