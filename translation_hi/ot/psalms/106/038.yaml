source:
  edition: WLC
  text: וַ/יִּֽשְׁפְּכ֨וּ דָ֪ם נָקִ֡י דַּם בְּנֵ֘י/הֶ֤ם וּֽ/בְנוֹתֵי/הֶ֗ם אֲשֶׁ֣ר זִ֭בְּחוּ לַ/עֲצַבֵּ֣י כְנָ֑עַן וַ/תֶּחֱנַ֥ף הָ֝/אָ֗רֶץ בַּ/דָּמִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/038.yaml
  text: They poured out innocent blood—the blood of their sons and daughters[c][b][a], whom they sacrificed to the idols of Canaan—and the land was polluted with blood.
translation:
  language: hi
  text: उन्होंने निर्दोषों का खून बहाया—अपने बेटे-बेटियों का खून, जिन्हें उन्होंने कनान की मूर्तियों को बलि चढ़ाया—और भूमि खून से अपवित्र हो गई।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “खून से” के लिए मूल इब्रानी में बहुवचन रूप है, जिसका अर्थ “रक्तपात से” या “रक्त-दोष से” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁפְּכוּ
  choice: उन्होंने ... खून बहाया
  rationale: שׁפך का मूल अर्थ ‘उंडेलना’ है, पर खून के साथ यह हिंसक हत्या के लिए प्रचलित प्रयोग है; आधुनिक हिन्दी में ‘खून बहाया’ स्वाभाविक और सजीव है।
- source_word: דָם נָקִי
  choice: निर्दोषों का खून
  rationale: यह इब्रानी पद अन्यायपूर्वक मारे गए निर्दोष व्यक्तियों के रक्त को सूचित करता है; हिन्दी में यह रूप नैतिक बल और स्वाभाविकता दोनों बनाए रखता है।
- source_word: דַּם בְּנֵיהֶם וּבְנוֹתֵיהֶם
  choice: अपने बेटे-बेटियों का खून
  rationale: דם की पुनरावृत्ति स्पष्ट करती है कि निर्दोष खून उन्हीं की संतानों का था; हिन्दी में ‘अपने’ कर्ता से संबंध साफ करता है।
- source_word: אֲשֶׁר זִבְּחוּ
  choice: जिन्हें उन्होंने ... बलि चढ़ाया
  rationale: זבח यहाँ धार्मिक बलि देने का अर्थ रखता है; ‘बलि चढ़ाया’ आधुनिक हिन्दी में स्पष्ट और संदर्भानुकूल है।
- source_word: לַעֲצַבֵּי כְנָעַן
  choice: कनान की मूर्तियों के लिए
  rationale: עֲצַבִּים पूजित प्रतिमाओं अथवा मूर्तियों के लिए प्रयुक्त निंदात्मक शब्द है; ‘मूर्तियों’ से मूल का विवादात्मक भाव बना रहता है।
- source_word: וַתֶּחֱנַף הָאָרֶץ
  choice: देश ... अपवित्र हो गया
  rationale: חנף इस संदर्भ में नैतिक और धार्मिक अशुद्धि व्यक्त करता है। הָאָרֶץ यहाँ कनान/इस्राएल के भूभाग को सूचित करता है, इसलिए ‘देश’ स्वाभाविक है।
- source_word: בַּדָּמִים
  choice: खून से
  rationale: मूल में דם का बहुवचन रूप है, जो रक्तपात अथवा रक्त-दोष को सूचित कर सकता है। मुख्य पाठ में ‘खून से’ मूल की ठोस पुनरावृत्ति और उसकी अस्पष्टता को अधिक निकटता से रखता है।
theological_decisions:
- issue: बलि चढ़ाए गए बच्चों की नैतिक स्थिति
  choice: उन्हें निर्दोष बताया गया है और उनकी हत्या को निर्दोषों का खून बहाना कहा गया है।
  alternative: ‘निर्दोष खून’—एक अधिक शब्दशः, पर हिन्दी में कुछ कम स्वाभाविक अभिव्यक्ति।
  rationale: דָם נָקִי पाठ का स्पष्ट नैतिक निर्णय है; अनुवाद इसे न तो कम करता है, न अतिरिक्त धर्मशास्त्रीय निष्कर्ष जोड़ता है।
- issue: खून के कारण देश की अपवित्रता
  choice: देश खून से अपवित्र हो गया।
  alternative: देश रक्तपात से अपवित्र हो गया / देश रक्त-दोष से दूषित हो गया।
  rationale: मूल का बहुवचन בַּדָּמִים ठोस रक्त, रक्तपात और रक्त-दोष के अर्थक्षेत्र को छू सकता है। मुख्य पाठ निकट और सजीव रूप रखता है, जबकि पादटिप्पणी वैकल्पिक अर्थ बताती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। ‘बेटे-बेटियों’, ‘खून बहाया’ और ‘बलि चढ़ाया’ बोलचाल में स्पष्ट हैं, जबकि वाक्य की काव्यात्मक पुनरावृत्ति और गंभीर नैतिक स्वर सुरक्षित हैं।
