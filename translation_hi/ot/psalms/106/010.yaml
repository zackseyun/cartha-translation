  text: וַֽ֭/יּוֹשִׁיעֵ/ם מִ/יַּ֣ד שׂוֹנֵ֑א וַ֝/יִּגְאָלֵ֗/ם מִ/יַּ֥ד אוֹיֵֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/010.yaml
  text: So he saved them from the hand of the one who hated them[b][a], and redeemed them from the hand of the enemy.
translation:
  language: hi
  text: और उसने उन्हें उनसे बैर रखने वाले के हाथ से बचाया[a], और शत्रु के हाथ से छुड़ाया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘बचाया’ का अनुवाद ‘संकट से निकाला’ भी हो सकता है; इब्रानी क्रिया खतरे से रक्षा या उद्धार का भाव रखती है।
    reason: lexical_alternative
  - marker: b
    text: ‘छुड़ाया’ का अनुवाद ‘उद्धार किया’ या ‘छुटकारा दिलाया’ भी हो सकता है; इब्रानी शब्द हस्तक्षेप करके किसी को छुड़ाने या अपने अधिकार में वापस लेने का भाव रखता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹשִׁיעֵם
  choice: उन्हें...बचाया
  rationale: ישׁע यहाँ संकट और शत्रु के अधिकार से बचाने का भाव व्यक्त करता है। ‘बचाया’ आधुनिक हिन्दी में स्वाभाविक है और दैवी उद्धार का अर्थ बनाए रखता है।
- source_word: מִיַּד
  choice: के हाथ से
  rationale: इब्रानी मुहावरे में ‘हाथ’ किसी के अधिकार या वश को दर्शाता है। हिन्दी में भी यह बिंब स्पष्ट और स्वाभाविक है, इसलिए इसे बनाए रखा गया है।
- source_word: שׂוֹנֵא
  choice: उनसे बैर रखनेवाले
  rationale: मूल में एकवचन कृदन्त है, जिसका शाब्दिक भाव ‘घृणा/बैर रखनेवाला’ है। एकवचन और वैर का भाव दोनों सुरक्षित रखे गए हैं; इसे सामान्य बहुवचन ‘बैरी लोगों’ में नहीं बदला गया।
- source_word: וַיִּגְאָלֵם
  choice: उन्हें...छुड़ा लिया
  rationale: גאל हस्तक्षेप करके वापस लेने, छुड़ाने या छुटकारा देने का भाव रखता है। ‘छुड़ा लिया’ हिन्दी में सहज है और पहले प्रयुक्त ‘बचाया’ से अर्थगत भिन्नता भी बनाए रखता है।
- source_word: אוֹיֵב
  choice: शत्रु
  rationale: मूल का एकवचन रूप सुरक्षित रखा गया है। प्रसंग में शत्रु पहचाना हुआ विरोधी है; हिन्दी में बिना अनावश्यक विस्तार के ‘शत्रु’ यह अर्थ व्यक्त करता है।
theological_decisions:
- issue: क्या ישׁע और גאל, दोनों क्रियाओं को एक ही सामान्य हिन्दी क्रिया से व्यक्त किया जाए
  choice: पहली को ‘बचाया’ और दूसरी को ‘छुड़ा लिया’ कहा गया
  alternative: दोनों को ‘छुड़ाया’ या ‘बचाया’ कहा जाए
  rationale: मूल पद दो निकट, पर अलग अर्थवाली क्रियाओं के द्वारा काव्यात्मक समानांतरता बनाता है। अलग हिन्दी क्रियाएँ उद्धार और छुड़ाने के दोनों पहलुओं को सुरक्षित रखती हैं, बिना किसी अतिरिक्त सांप्रदायिक अर्थ को जोड़े।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण काव्यात्मक गद्य अपनाया गया है। ‘हाथ से’ वाला मूल बिंब बनाए रखा गया है, और शत्रु-संबंधी दोनों पदों का एकवचन रूप सुरक्षित है।
