source:
  edition: WLC
  text: וַֽ֭/יִּמְאֲסוּ בְּ/אֶ֣רֶץ חֶמְדָּ֑ה לֹֽא הֶ֝אֱמִ֗ינוּ לִ/דְבָרֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/024.yaml
  text: Then they despised the pleasant land[b][a]; they did not believe his word.
translation:
  language: hi
  text: तब उन्होंने मनभावनी भूमि को तुच्छ जाना[a]; उन्होंने उसके वचन पर विश्वास नहीं किया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘मनोहर भूमि’ अथवा ‘वांछनीय भूमि’।
    reason: lexical_alternative
  - marker: b
    text: या ‘उन्होंने उसके वचन पर भरोसा नहीं किया’; यहाँ ‘उसका वचन’ का अर्थ ‘उसकी प्रतिज्ञा’ भी हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּמְאֲסוּ
  choice: तब उन्होंने…तुच्छ जाना
  rationale: מָאַס का अर्थ अस्वीकार करना या तुच्छ जानना है। ‘तुच्छ जाना’ भजन के कड़े नैतिक आकलन को बनाए रखता है, और ‘तब’ वाव-क्रम की कथात्मक प्रगति को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בְּאֶרֶץ חֶמְדָּה
  choice: मनभावनी भूमि को
  rationale: אֶרֶץ यहाँ प्रतिज्ञात भूमि की ओर संकेत करता है। חֶמְדָּה वांछनीयता, प्रियता और मनोहरता का भाव देता है; ‘मनभावनी भूमि’ इस अर्थ को सहज और गरिमापूर्ण हिन्दी में रखता है।
- source_word: לֹא הֶאֱמִינוּ
  choice: विश्वास नहीं किया
  rationale: אמן के हिफ़ील रूप का अर्थ विश्वास करना या भरोसा रखना हो सकता है। ‘विश्वास नहीं किया’ वचन के साथ स्वाभाविक है और मूल की व्यापकता बनाए रखता है।
- source_word: לִדְבָרוֹ
  choice: उसके वचन पर
  rationale: דָּבָר का अर्थ वचन, कही हुई बात या प्रसंगानुसार प्रतिज्ञा हो सकता है। ‘उसके वचन पर’ मूल के व्यापक शब्द को सुरक्षित रखता है और हिन्दी में विश्वास के साथ स्वाभाविक संबंध बनाता है।
theological_decisions:
- issue: क्या ‘उसके वचन’ को स्पष्ट रूप से परमेश्वर की प्रतिज्ञा कहा जाए
  choice: मुख्य पाठ में ‘उसके वचन’ रखा गया
  alternative: उसकी प्रतिज्ञा
  rationale: इब्रानी पाठ व्यापक דָּבָר का प्रयोग करता है। प्रसंग में प्रतिज्ञा का भाव मौजूद है, पर मुख्य पाठ में उसे स्पष्ट कर देना मूल की अर्थ-सीमा को अनावश्यक रूप से संकरा कर देगा।
- issue: הֶאֱמִינוּ में विश्वास और भरोसे के बीच चयन
  choice: विश्वास नहीं किया
  alternative: भरोसा नहीं किया
  rationale: दोनों अर्थ संभव हैं। ‘विश्वास’ कथन की सत्यता को स्वीकारने और बोलने वाले पर भरोसा रखने—दोनों आयामों के लिए पर्याप्त व्यापक है; वैकल्पिक भाव पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है। ‘मनभावनी’ सामान्य पाठक के लिए बोधगम्य होते हुए भी काव्यात्मक और गरिमापूर्ण है। समानांतर उपवाक्यों में ‘उन्होंने’ की पुनरावृत्ति स्पष्टता और भजनात्मक लय बनाए रखती है।
