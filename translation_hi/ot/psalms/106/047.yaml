base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/047.yaml
  text: Save us[a], O Yahweh our God, and gather us from among the nations[b], that we may give thanks to your holy name and glory in your praise.
translation:
  language: hi
  text: हे यहोवा, हमारे परमेश्वर, हमें बचा[a] और राष्ट्रों के बीच से हमें इकट्ठा कर, ताकि हम तेरे पवित्र नाम का धन्यवाद करें और तेरी स्तुति में मगन हों।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हमारा उद्धार कर।”
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹשִׁיעֵנוּ
  choice: हमारा उद्धार कर
  rationale: ישׁע के हिफ़ील आज्ञार्थक रूप में सीधे बचाने या छुड़ाने की विनती है। प्रार्थना की गरिमामय हिन्दी में ‘हमारा उद्धार कर’ इसके व्यापक और गम्भीर भाव को बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत वाचा-नाम है; हिन्दी बाइबल-परम्परा में प्रचलित और सहज पहचाना जाने वाला लिप्यन्तरण ‘यहोवा’ इसे उपाधि से बदलने के बजाय नाम के रूप में रखता है।
- source_word: אֱלֹהֵינוּ
  choice: हमारे परमेश्वर
  rationale: प्रथम पुरुष बहुवचन प्रत्यय सहित रूप का सीधा अर्थ ‘हमारे परमेश्वर’ है और यह प्रार्थना की वाचागत अपील को सुरक्षित रखता है।
- source_word: וְקַבְּצֵנוּ
  choice: और ... हमें इकट्ठा कर
  rationale: קבץ का पिएल आज्ञार्थक बिखरे हुए लोगों को एकत्र करने का भाव देता है; ‘इकट्ठा कर’ स्वाभाविक और सन्दर्भानुकूल है।
- source_word: מִן הַגּוֹיִם
  choice: राष्ट्रों के बीच से
  rationale: यह उन अन्य जातियों या राष्ट्रों को सूचित करता है जिनके बीच लोग बिखरे हैं। ‘के बीच से’ बिखराव और वहाँ से एकत्र किए जाने का भाव स्पष्ट करता है।
- source_word: לְהוֹדוֹת לְשֵׁם קָדְשֶׁךָ
  choice: ताकि हम तेरे पवित्र नाम का धन्यवाद करें
  rationale: לְ वाला infinitive उद्देश्य व्यक्त करता है। ידה के हिफ़ील का यहाँ उपयुक्त अर्थ धन्यवाद करना है; ‘तेरे पवित्र नाम का धन्यवाद करें’ हिन्दी में स्वाभाविक है।
- source_word: לְהִשְׁתַּבֵּחַ בִּתְהִלָּתֶךָ
  choice: और तेरी स्तुति पर गर्व करें
  rationale: שׁבח का हित्पाएल अपने को गौरवान्वित समझने, गर्व करने या उल्लसित होने का प्रबल भाव रखता है। ‘तेरी स्तुति पर गर्व करें’ इस असामान्य पर अर्थपूर्ण इब्रानी अभिव्यक्ति को सामान्य ‘आनन्द करें’ में नरम नहीं करता।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल में व्यक्तिगत वाचा-नाम है। ‘यहोवा’ आधुनिक हिन्दी पाठकों के लिए परिचित लिप्यन्तरण है और नाम को केवल ‘प्रभु’ जैसी उपाधि से नहीं बदलता।
- issue: לְהִשְׁתַּבֵּחַ בִּתְהִלָּתֶךָ का आशय
  choice: तेरी स्तुति पर गर्व करें
  alternative: तेरी स्तुति में मगन हों; तेरी स्तुति में उल्लसित हों
  rationale: मूल क्रिया में गर्व या गौरव मानने का आत्म-संलग्न और उल्लासपूर्ण भाव है। चुना हुआ पाठ इस तनाव को बनाए रखता है और गर्व का केन्द्र परमेश्वर की स्तुति को स्पष्ट करता है।
translation_notes:
  register: भाषा आधुनिक, प्रार्थनात्मक और गरिमामय रखी गई है। परमेश्वर को सम्बोधित करते समय एकवचन ‘तेरे’ का प्रयोग भजन की सीधी और निकट अपील के अनुरूप है। ‘राष्ट्रों’ को ‘अन्यजातियों’ पर प्राथमिकता दी गई है ताकि अनावश्यक धार्मिक-जातीय अर्थ न जुड़ें।
