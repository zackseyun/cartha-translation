  text: וַ/יַּעֲמֹ֣ד פִּֽ֭ינְחָס וַ/יְפַלֵּ֑ל וַ֝/תֵּעָצַ֗ר הַ/מַּגֵּפָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/030.yaml
  text: Then Phinehas stood up and interceded[a], and the plague was stopped.
translation:
  language: hi
  text: तब पीनहास उठ खड़ा हुआ और उसने हस्तक्षेप किया[a]; तब महामारी रुक गई।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘न्याय किया’; एक अन्य सम्भावना, ‘प्रार्थना की।’ यहाँ प्रयुक्त इब्रानी क्रिया में न्यायिक कार्रवाई या मध्यस्थता—दोनों का भाव हो सकता है।
    reason: वैकल्पिक अर्थों और मूल पाठ की वास्तविक अर्थगत अस्पष्टता को सुरक्षित रखना।
lexical_decisions:
- source_word: וַיַּעֲמֹד
  choice: उठ खड़ा हुआ
  rationale: עמד का मूल अर्थ ‘खड़ा होना’ है; कथात्मक क्रम में ‘उठ खड़ा हुआ’ शारीरिक क्रिया और निर्णायक तत्परता—दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: פִּינְחָס
  choice: पीनहास
  rationale: इब्रानी नाम का प्रचलित हिन्दी लिप्यंतरण रखा गया है।
- source_word: וַיְפַלֵּל
  choice: उसने हस्तक्षेप किया
  rationale: פלל के पिएल रूप में यहाँ न्यायिक कार्रवाई अथवा मध्यस्थता का भाव हो सकता है। गिनती 25:7–8 की पृष्ठभूमि में ‘हस्तक्षेप किया’ क्रिया को केवल प्रार्थना या केवल दण्ड देने तक सीमित किए बिना उसकी व्यापकता बनाए रखता है।
- source_word: וַתֵּעָצַר
  choice: रुक गई
  rationale: עצר के निफ़अल रूप का अर्थ रोका जाना या थम जाना है; ‘रुक गई’ स्पष्ट, सहज और परिणामसूचक हिन्दी है।
- source_word: הַמַּגֵּפָה
  choice: महामारी
  rationale: מגפה घातक प्रकोप या विपत्ति को दर्शाता है; इस प्रसंग में ‘महामारी’ आधुनिक हिन्दी का स्वाभाविक और स्थापित शब्द है।
theological_decisions:
- issue: पीनहास के कार्य के लिए וַיְפַלֵּל का अर्थ
  choice: मुख्य पाठ में व्यापक अर्थ वाला ‘हस्तक्षेप किया’
  alternative: ‘न्याय किया’ अथवा ‘प्रार्थना की’
  rationale: भजन गिनती 25 की उस घटना की ओर संकेत करता है जहाँ पीनहास की निर्णायक कार्रवाई से महामारी थमती है। इब्रानी क्रिया में न्यायिक और मध्यस्थतापूर्ण दोनों बल संभव हैं; इसलिए मुख्य पाठ अर्थ को अनावश्यक रूप से संकीर्ण नहीं करता और विकल्प पादटिप्पणी में सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘उठ खड़ा हुआ’ निर्णायक कार्रवाई का स्वाभाविक संकेत देता है, जबकि ‘हस्तक्षेप किया’ मूल क्रिया की न्यायिक तथा मध्यस्थतापूर्ण अर्थ-सीमा को खुला रखता है।
