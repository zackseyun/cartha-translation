  text: וַ/יֹּ֗אמֶר לְֽ/הַשְׁמִ֫ידָ֥/ם לוּלֵ֡י מֹ֘שֶׁ֤ה בְחִיר֗/וֹ עָמַ֣ד בַּ/פֶּ֣רֶץ לְ/פָנָ֑י/ו לְ/הָשִׁ֥יב חֲ֝מָת֗/וֹ מֵֽ/הַשְׁחִֽית׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/023.yaml
  text: So he said he would destroy them—had not Moses[a], his chosen one, stood in the breach before him to turn back his wrath from destroying.
translation:
  language: hi
  text: तब उसने कहा था कि वह उन्हें नष्ट कर देगा—यदि उसका चुना हुआ मूसा उसके सामने दीवार की दरार में[a] खड़ा होकर उसके प्रकोप को उन्हें नष्ट करने से न रोकता।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक चित्र एक टूटी हुई दीवार की दरार में खड़े होने का है; यहाँ यह मूसा द्वारा लोगों के लिए मध्यस्थता करने को दर्शाता है।
    reason: रूपक और उसके प्रसंगगत आशय को स्पष्ट करना।
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: इसलिए उसने कहा
  rationale: वाव-क्रमिक कथा को आगे बढ़ाते हुए पिछले प्रसंग का परिणाम बताता है; ‘इसलिए’ इस संबंध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לְהַשְׁמִידָם
  choice: कि वह उन्हें नष्ट कर देगा
  rationale: ‘कहा’ के बाद לְ सहित infinitive यहाँ विनाश के घोषित इरादे को व्यक्त करता है; यह हिन्दी में अर्थ स्पष्ट करता है।
- source_word: לוּלֵי
  choice: यदि ... न रोकता
  rationale: यह प्रतिकल्पित अपवाद प्रस्तुत करता है—मूसा के हस्तक्षेप के बिना विनाश हो जाता। हिन्दी की ‘यदि ... न’ रचना इस आशय को सहज रूप देती है।
- source_word: בְחִירוֹ
  choice: उसका चुना हुआ
  rationale: यह परमेश्वर द्वारा चुने गए व्यक्ति को सूचित करता है और बाद की विशिष्ट धर्मवैज्ञानिक शब्दावली आरोपित नहीं करता।
- source_word: עָמַד בַּפֶּרֶץ
  choice: दीवार की दरार में खड़ा होकर
  rationale: मूल ठोस रूपक सुरक्षित रखा गया है; ‘दीवार की’ जोड़ने से सामान्य हिन्दी पाठक के लिए दरार का चित्र स्पष्ट होता है, जबकि पादटिप्पणी मध्यस्थता का आशय बताती है।
- source_word: לְפָנָיו
  choice: उसके सामने
  rationale: सर्वनाम का स्वाभाविक संदर्भ परमेश्वर है; यह उसकी उपस्थिति में मूसा के खड़े होने को निकटता से व्यक्त करता है।
- source_word: לְהָשִׁיב חֲמָתוֹ
  choice: उसके प्रकोप को ... रोकता
  rationale: हिफ़ील का आशय प्रकोप को उसके मार्ग से वापस मोड़ना है। ‘रोकता’ परिणाम को स्वाभाविक हिन्दी में बताता है; ‘प्रकोप’ חֵמָה की तीव्रता बनाए रखता है।
- source_word: מֵהַשְׁחִית
  choice: विनाश करने से
  rationale: 'מִן सहित infinitive रोकथाम व्यक्त करता है: प्रकोप को विनाश कार्य करने से रोका गया। यह ईश्वर को प्रत्यक्ष कर्ता मानने की सम्भावना को मिटाए बिना मूल वाक्य-संबंध बनाए रखता है।'
theological_decisions:
- issue: ईश्वरीय न्याय के लिए मानव-सदृश भावभाषा
  choice: ‘उसके प्रकोप’ को यथावत रखा गया
  alternative: उसका क्रोध; उसका न्याय
  rationale: मूल पाठ परमेश्वर के प्रकोप को मूसा के हस्तक्षेप से लौटाए जाने के रूप में प्रस्तुत करता है। इसे अमूर्त ‘न्याय’ बनाकर धर्मवैज्ञानिक तनाव को नरम नहीं किया गया।
- issue: मूसा का ‘दरार में खड़ा होना’
  choice: दीवार की दरार का रूपक मुख्य पाठ में सुरक्षित रखा गया
  alternative: उनके लिए मध्यस्थता की; बीच में आ खड़ा हुआ
  rationale: टूटी हुई रक्षात्मक दीवार के स्थान पर खड़े होने का ठोस चित्र मूसा की मध्यस्थ भूमिका व्यक्त करता है। केवल व्याख्यात्मक पद से इसे बदलने के बजाय अर्थ पादटिप्पणी में स्पष्ट किया गया।
- issue: מֵהַשְׁחִית में विनाश के कर्ता की व्याकरणिक संक्षिप्तता
  choice: ‘उसके प्रकोप को विनाश करने से’
  alternative: ताकि वह उन्हें नष्ट न करे
  rationale: मूल में infinitive का कर्ता अलग से व्यक्त नहीं है। मुख्य अनुवाद प्रकोप को तत्काल व्याकरणिक संबंध में रखता है और सम्भव ईश्वरीय कर्तृत्व को व्याख्यात्मक विस्तार से निर्णीत नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमामय किंतु सामान्य पाठकों के लिए सुबोध। ‘प्रकोप’ न्याय-संदर्भ की तीव्रता रखता है। पादटिप्पणी-चिह्न मुख्य पाठ में संबंधित वाक्य के अंत में दिया गया है।
