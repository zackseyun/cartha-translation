  text: תִּפְתַּח אֶ֭רֶץ וַ/תִּבְלַ֣ע דָּתָ֑ן וַ֝/תְּכַ֗ס עַל עֲדַ֥ת אֲבִירָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/017.yaml
  text: The earth opened and swallowed Dathan[c][b][a], and covered the company of Abiram.
translation:
  language: hi
  text: धरती फट गई और दातान को निगल गई[a][c]; उसने अबीराम के समुदाय को ढक लिया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “खुल गई।”
    reason: lexical_alternative
  - marker: b
    text: या, “अबीराम की सभा” अथवा “अबीराम की मंडली।”
    reason: lexical_alternative
  - marker: c
    text: इस न्याय की घटना की पृष्ठभूमि के लिए गिनती 16:31–33 देखें।
    reason: cross_reference
lexical_decisions:
- source_word: תִּפְתַּח
  choice: फट गई
  rationale: פתח का मूल अर्थ यहाँ ‘खुलना’ है; गिनती 16 की घटना के संदर्भ में धरती के खुलने के लिए स्वाभाविक और सजीव हिन्दी ‘फट गई’ है।
- source_word: אֶרֶץ
  choice: धरती
  rationale: यह प्रादेशिक ‘देश’ नहीं, विद्रोहियों के नीचे खुलने वाली धरती/भूमि को दर्शाता है।
- source_word: וַתִּבְלַע
  choice: और ... निगल गई
  rationale: בלע का सीधा और स्वाभाविक हिन्दी समतुल्य ‘निगलना’ है; क्रिया घटनाक्रम की अगली भूतकालीन क्रिया बताती है।
- source_word: דָּתָן
  choice: दातान
  rationale: व्यक्तिवाचक नाम का मानक हिन्दी लिप्यंतरण।
- source_word: וַתְּכַס עַל
  choice: उसने ... ढक लिया
  rationale: כסה के साथ עַל किसी पर छा जाने या उसे ढक लेने का भाव देता है; हिन्दी में कर्ता ‘धरती’ को सर्वनाम से दोहराना स्वाभाविक है।
- source_word: עֲדַת
  choice: समुदाय
  rationale: עֵדָה के रचनारूप का अर्थ यहाँ अबीराम से जुड़ा समूह है; ‘समुदाय’ आधुनिक, स्पष्ट और गैर-सांप्रदायिक है।
- source_word: אֲבִירָם
  choice: अबीराम
  rationale: व्यक्तिवाचक नाम का मानक हिन्दी लिप्यंतरण।
theological_decisions:
- issue: गिनती 16 के विस्तृत वृत्तांत से इस पद का संबंध
  choice: भजन में दिए काव्यात्मक सारांश को ही अनूदित किया गया है।
  alternative: ‘उनके घरानों’ या गिनती 16 के अन्य विद्रोहियों को अनुवाद में जोड़ना।
  rationale: इब्रानी पद केवल दातान, अबीराम और अबीराम के समुदाय का उल्लेख करता है; वृत्तांत के अतिरिक्त विवरण पाठ में जोड़ना उचित नहीं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘फट गई’ प्रसंगानुकूल सजीवता देता है, जबकि पादटिप्पणी में अधिक शाब्दिक विकल्प सुरक्षित है।
