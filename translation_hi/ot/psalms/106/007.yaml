id: PSA.106.7
reference: Psalms 106:7
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אֲב֘וֹתֵ֤י/נוּ בְ/מִצְרַ֨יִם לֹא הִשְׂכִּ֬ילוּ נִפְלְאוֹתֶ֗י/ךָ לֹ֣א זָ֭כְרוּ אֶת רֹ֣ב חֲסָדֶ֑י/ךָ וַ/יַּמְר֖וּ עַל יָ֣ם בְּ/יַם סֽוּף׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/007.yaml
  text: Our fathers in Egypt did not understand your wondrous deeds[a]; they did not remember the abundance of your steadfast love[b], but rebelled at the sea—the Red Sea.
translation:
  language: hi
  text: मिस्र में हमारे पुरखों ने तेरे अद्भुत कामों को नहीं समझे; उन्होंने तेरी अपार अटल करुणा को याद नहीं रखा, बल्कि समुद्र पर—सरकंडों के समुद्र पर[a]—विद्रोह किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: परंपरागत रूप से “लाल समुद्र।” इब्रानी नाम याम सूफ़ का अर्थ संभवतः “सरकंडों का समुद्र” है।
    reason: स्थाननाम के मूल-भाषायी अर्थ और पारंपरिक पहचान, दोनों को सुरक्षित रखना।
lexical_decisions:
- source_word: אֲבוֹתֵינוּ
  choice: हमारे पुरखों
  rationale: शाब्दिक अर्थ ‘हमारे पिता’ है, पर यहाँ इस्राएल की पिछली पीढ़ियों के लिए सामूहिक प्रयोग है। ‘पुरखों’ से पुरुषवाचक पारिवारिक रूप और ऐतिहासिक-सामूहिक अर्थ दोनों स्वाभाविक हिन्दी में बने रहते हैं।
- source_word: לֹא הִשְׂכִּילוּ
  choice: नहीं समझा
  rationale: हिफ़ील रूप यहाँ परमेश्वर के अद्भुत कामों का अर्थ या महत्त्व समझने में विफलता व्यक्त करता है; ‘नहीं समझा’ सरल और सटीक है।
- source_word: נִפְלְאוֹתֶיךָ
  choice: तेरे अद्भुत कामों
  rationale: यह संज्ञा विस्मय उत्पन्न करने वाले असाधारण कार्यों को सूचित करती है; ‘अद्भुत काम’ अमूर्त ‘चमत्कारों’ की अपेक्षा दैवी कार्यों पर बल देता है।
- source_word: רֹב חֲסָדֶיךָ
  choice: तेरी अपार अटल करुणा
  rationale: רֹב की प्रचुरता और חֶסֶד की स्थायी, निष्ठावान तथा दयामय भलाई को संक्षेप में व्यक्त करता है। ‘करुणा’ हिन्दी में सहज है और ‘अटल’ उसके टिकाऊ, निष्ठावान स्वरूप को बनाए रखता है।
- source_word: וַיַּמְרוּ
  choice: बल्कि ... विद्रोह किया
  rationale: מרה का अर्थ विद्रोह करना है। प्रसंग में वाव पूर्ववर्ती असमझ और विस्मरण के विपरीत परिणति को सामने लाता है, इसलिए ‘बल्कि’ उपयुक्त है।
- source_word: עַל יָם בְּיַם סוּף
  choice: समुद्र के पास—सरकंडों के समुद्र के पास
  rationale: दोनों स्थानसूचक पदबंध समानाधिकरण में हैं। पहले सामान्य ‘समुद्र’ और फिर विशिष्ट नाम याम सूफ़ आता है; डैश इस स्पष्टीकरणात्मक संबंध को स्पष्ट करता है।
- source_word: יַם סוּף
  choice: सरकंडों का समुद्र
  rationale: सूफ़ का मूल अर्थ सरकंडे/जलकास है। मूल भाषा की पारदर्शिता के लिए इसे मुख्य पाठ में रखा गया है; परंपरागत ‘लाल समुद्र’ पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: חֶסֶד का अनुवाद
  choice: अटल करुणा
  alternative: वाचा की निष्ठावान करुणा; अटल प्रेम; दया
  rationale: शब्द में प्रेम, दया और निष्ठा का समृद्ध अर्थक्षेत्र है। ‘अटल करुणा’ स्थायित्व और कृपापूर्ण व्यवहार दोनों व्यक्त करता है, बिना ‘वाचा’ शब्द को वहाँ जोड़ने के जहाँ वह प्रत्यक्ष रूप से नहीं है।
- issue: יַם סוּף का स्थाननाम
  choice: सरकंडों का समुद्र
  alternative: लाल समुद्र
  rationale: मूल इब्रानी नाम के संभावित शाब्दिक अर्थ को प्राथमिकता दी गई है। परिचित पारंपरिक नाम ‘लाल समुद्र’ को पादटिप्पणी में रखकर पाठक की पहचान-सुविधा भी सुरक्षित की गई है।
- issue: दूसरे पुरुष एकवचन का संबोधन
  choice: तेरे/तेरी
  alternative: आपके/आपकी
  rationale: भजन में परमेश्वर को प्रत्यक्ष एकवचन संबोधन है। ‘तेरे’ आधुनिक हिन्दी बाइबलीय काव्य में निकटता और एकवचन दोनों बनाए रखता है तथा अनादर का आशय नहीं रखता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध काव्यात्मक गद्य। इब्रानी के समानाधिकरण को डैश से दिखाया गया है। परमेश्वर के लिए एकवचन निकट संबोधन ‘तेरे/तेरी’ रखा गया है।
