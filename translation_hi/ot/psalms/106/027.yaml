  text: and to make their offspring fall among the nations[b][a], and to scatter them through the lands.
translation:
  language: hi
  text: 'और उनकी संतान को राष्ट्रों के बीच गिरा देने,

    और उन्हें देश-देश में तितर-बितर कर देने की।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּלְהַפִּיל
  choice: और ... गिरा देने
  rationale: हिफ़ील धातुरूप का कारणवाचक अर्थ ‘गिरा देना’ रखा गया है; इससे मृत्यु या सैनिक पराजय का अर्थ अनावश्यक रूप से निश्चित नहीं होता।
- source_word: זַרְעָם
  choice: उनकी संतान
  rationale: זֶרַע का शाब्दिक अर्थ ‘बीज’ है, पर यहाँ वंशज या भावी पीढ़ी अभिप्रेत है। ‘संतान’ आधुनिक हिंदी में स्वाभाविक और सामूहिक अर्थ वाला शब्द है।
- source_word: בַּגּוֹיִם
  choice: अन्यजातियों के बीच
  rationale: גּוֹיִם यहाँ इस्राएल से बाहर की जातियों या राष्ट्रों को दर्शाता है। ‘अन्यजातियों’ से भेद बना रहता है, बिना बाद की धर्मवैज्ञानिक अवधारणाएँ जोड़े।
- source_word: וּלְזָרוֹתָם
  choice: और उन्हें ... तितर-बितर कर देने
  rationale: זרה का अर्थ ‘बिखेरना’ या ‘फटकना’ हो सकता है। निर्वासन और अनेक देशों के संदर्भ में ‘तितर-बितर करना’ स्वाभाविक रूप से व्यापक फैलाव व्यक्त करता है।
- source_word: בָּאֲרָצוֹת
  choice: देश-देश में
  rationale: אֶרֶץ का बहुवचन अनेक देशों या भूभागों को दर्शाता है। ‘देश-देश में’ सहज हिंदी में व्यापक भौगोलिक बिखराव व्यक्त करता है।
theological_decisions:
- issue: वर्णित न्याय का स्वरूप
  choice: वचन उनकी संतान के अन्यजातियों के बीच पतन और विभिन्न देशों में बिखराव की बात करता है।
  alternative: पहले खंड को उनकी संतान की मृत्यु या विशेष रूप से पराजय के अर्थ में समझा जा सकता है।
  rationale: נפל का कारणवाचक रूप शारीरिक मृत्यु से अधिक व्यापक है। समानांतर खंड में बिखराव होने के कारण अनुवाद सामान्य ‘गिरा देने’ को बनाए रखता है और अर्थ को मृत्यु तक सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक रखी गई है। पद पिछले वाक्य पर निर्भर infinitival संरचना है, इसलिए अंत में ‘की’ रखकर मूल की वाक्यगत निरंतरता बचाई गई है।
