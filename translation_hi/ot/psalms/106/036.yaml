  footnotes:
  - marker: a
    text: या, “उन्होंने अपनी मूर्तियों की पूजा की, और वे उनके लिए जाल बन गईं।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַבְדוּ
  choice: उन्होंने ... सेवा की
  rationale: काल रूप में עבד यहाँ झूठे देवताओं को दी गई धार्मिक सेवा को दर्शाता है। ‘सेवा की’ मूल क्रिया के निकट रहते हुए भक्ति का भाव व्यक्त करता है; ‘पूजा की’ संभव, पर थोड़ा अधिक व्याख्यात्मक है।
- source_word: עֲצַבֵּיהֶם
  choice: उनकी मूर्तियों
  rationale: עֲצַבִּים प्रायः उपासना की मूर्तियों के लिए प्रयुक्त होता है और संदर्भ में निंदात्मक भाव रखता है। आधुनिक हिन्दी में ‘मूर्तियाँ’ स्वाभाविक और स्पष्ट है।
- source_word: וַיִּהְיוּ
  choice: वे ... बन गईं
  rationale: 'היה के साथ לְמוֹקֵשׁ यहाँ परिणाम या परिणति का भाव देता है: वे मूर्तियाँ उनके लिए हानिकारक फंदा सिद्ध हुईं।'
- source_word: לָהֶם
  choice: उनके लिए
  rationale: ל संबंध और प्रभाव बताता है। हिन्दी में ‘उनके लिए फंदा बन गईं’ स्वाभाविक रूप से लोगों पर पड़े प्रभाव को व्यक्त करता है।
- source_word: לְמוֹקֵשׁ
  choice: फंदा
  rationale: מוֹקֵשׁ किसी फँसाने वाले जाल या फंदे को दर्शाता है और यहाँ नैतिक-आत्मिक रूपक है। ‘फंदा’ आधुनिक हिन्दी में सटीक और सहज है।
theological_decisions:
- issue: ‘वे उनके लिए फंदा बन गईं’ में ‘वे’ का संदर्भ
  choice: मूर्तियाँ उनकी सेवा करने वाले लोगों के लिए फंदा बन गईं।
  alternative: मूर्तियों की सेवा करने का कार्य उनके लिए फंदा बन गया।
  rationale: निकटतम और व्याकरणतः स्वाभाविक पूर्वपद बहुवचन ‘उनकी मूर्तियाँ’ है। स्त्रीलिंग बहुवचन ‘बन गईं’ हिन्दी में इस संबंध को स्पष्ट करता है, जबकि मूल कथन का आशय बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘सेवा की’ मूल इब्रानी क्रिया से निकटता बनाए रखता है; पादटिप्पणी में अधिक व्याख्यात्मक ‘पूजा की’ और ‘जाल’ दिए गए हैं।
