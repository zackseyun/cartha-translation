source:
  edition: WLC
  text: מִ֗י יְ֭מַלֵּל גְּבוּר֣וֹת יְהוָ֑ה יַ֝שְׁמִ֗יעַ כָּל תְּהִלָּתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/002.yaml
  text: Who can recount the mighty deeds of Yahweh[b][a], or proclaim all his praise?
translation:
  language: hi
  text: याहवे के पराक्रमों का वर्णन कौन कर सकता है, या उसकी सारी स्तुति कौन सुना सकता है?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִי
  choice: कौन कर सकता है
  rationale: प्रश्नवाचक सर्वनाम यहाँ मनुष्य की सामर्थ्य के विषय में आलंकारिक प्रश्न आरम्भ करता है; हिन्दी में ‘कौन कर सकता है’ निहित सामर्थ्य को स्वाभाविक रूप से व्यक्त करता है।
- source_word: יְמַלֵּל
  choice: वर्णन
  rationale: पिएल रूप बोलकर बताने या विस्तार से गिनाने का भाव देता है; ‘वर्णन’ आधुनिक, गरिमापूर्ण और प्रसंगानुकूल है।
- source_word: גְּבוּרוֹת
  choice: पराक्रम के कामों
  rationale: बहुवचन संज्ञा सामर्थ्य के ठोस प्रदर्शनों अथवा शक्तिशाली कार्यों को बताती है; ‘पराक्रम के काम’ इस क्रियात्मक भाव को स्पष्ट रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी परमेश्वर के व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: יַשְׁמִיעַ
  choice: सुना सकता है
  rationale: שמע के हिफ़ील रूप का मूल भाव ‘सुनाना’ या ‘सुनने योग्य बनाना’ है; यह चयन उसके कारक अर्थ को सीधे और स्वाभाविक हिन्दी में रखता है।
- source_word: כָּל
  choice: सारी
  rationale: यह शब्द सम्पूर्णता पर बल देता है, जिसे स्त्रीलिंग ‘स्तुति’ के साथ ‘सारी’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: תְּהִלָּתוֹ
  choice: उसकी सारी स्तुति
  rationale: एकवचन संज्ञा यहाँ सामूहिक अर्थ रख सकती है; ‘उसकी स्तुति’ इब्रानी वचन को बनाए रखते हुए उसके योग्य समस्त प्रशंसा का भाव देती है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार-अक्षरी व्यक्तिगत नाम सीधे प्रयुक्त हुआ है। ‘याहवे’ उसे उपाधि से प्रतिस्थापित किए बिना प्रचलित विद्वत्तापूर्ण उच्चारण के निकट देवनागरी में प्रस्तुत करता है।
- issue: मानवीय स्तुति की सीमा
  choice: दोनों उपवाक्यों में ‘कौन कर सकता है’ द्वारा आलंकारिक असमर्थता बनाए रखी गई
  alternative: इसे स्पष्ट कथन बनाना कि कोई भी ऐसा नहीं कर सकता
  rationale: मूल पाठ उत्तर नहीं देता, बल्कि प्रश्न के रूप में तनाव बनाए रखता है; इसलिए निहित निष्कर्ष को प्रत्यक्ष कथन में नहीं बदला गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, पर भजन की गरिमा बनाए रखती है। दूसरे उपवाक्य में ‘कौन’ की पुनरावृत्ति हिन्दी में प्रश्न की समानांतरता और स्पष्टता के लिए की गई है; मूल का आशय नहीं बदला गया।
