  text: בָּר֤וּךְ יְהוָ֨ה אֱלֹהֵ֪י יִשְׂרָאֵ֡ל מִן הָ֤/עוֹלָ֨ם וְ/עַ֬ד הָ/עוֹלָ֗ם וְ/אָמַ֖ר כָּל הָ/עָ֥ם אָמֵ֗ן הַֽלְלוּ יָֽהּ־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/048.yaml
  text: Blessed be Yahweh[a], the God of Israel, from everlasting to everlasting. And let all the people say[b], “Amen!” Praise Yah!
translation:
  language: hi
  text: इस्राएल का परमेश्वर याहवे[a] अनादिकाल से अनन्तकाल तक धन्य हो! और सब लोग कहें, “आमीन!” याह की स्तुति करो!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में परमेश्वर का व्यक्तिगत नाम יהוה (YHWH) है; यहाँ उसका लिप्यंतरण ‘याहवे’ किया गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ
  choice: धन्य हो
  rationale: यह निष्क्रिय कृदन्तीय आशीर्वाद-सूत्र यहाँ स्तुतिपरक घोषणा है; ‘धन्य हो’ उसके आराधनात्मक बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: יְהוָה
  choice: यहवे
  rationale: चार-अक्षरीय व्यक्तिगत ईश्वरीय नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित निकट लिप्यंतरण दिया गया है।
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: इस्राएल का परमेश्वर
  rationale: सम्बन्धसूचक इब्रानी पदबंध का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: מִן הָעוֹלָם וְעַד הָעוֹלָם
  choice: अनादिकाल से अनन्तकाल तक
  rationale: दोनों עוֹלָם पदों की व्यापक, असीम कालगत दिशा को हिन्दी की गरिमापूर्ण स्तुतिपरक अभिव्यक्ति में सुरक्षित रखता है।
- source_word: וְאָמַר
  choice: और ... कहें
  rationale: रूपतः पूर्ण क्रिया होते हुए भी इस सामूहिक आराधना-सन्दर्भ में इसका बल आह्वान/कामनार्थक है; ‘कहें’ उस कार्य को सहजता से व्यक्त करता है।
- source_word: כָּל הָעָם
  choice: सब लोग
  rationale: एकत्र आराधक समुदाय के सामूहिक उत्तर को साधारण और स्पष्ट हिन्दी में व्यक्त करता है।
- source_word: אָמֵן
  choice: आमीन
  rationale: आराधनात्मक प्रत्युत्तर के रूप में स्थापित हिन्दी लिप्यंतरण अर्थ और सामुदायिक प्रयोग दोनों सुरक्षित रखता है।
- source_word: הַלְלוּ יָהּ
  choice: याह की स्तुति करो
  rationale: बहुवचन आज्ञा और संक्षिप्त ईश्वरीय नाम दोनों को अनूदित करते हुए יָהּ को ‘याह’ के रूप में अलग पहचान देता है।
theological_decisions:
- issue: एक ही पद में יְהוָה और संक्षिप्त रूप יָהּ का निरूपण
  choice: יְהוָה को ‘यहवे’ और יָהּ को ‘याह’
  alternative: दोनों को ‘प्रभु’ कहना, अथवा הַלְלוּ יָהּ को केवल ‘हल्लेलूयाह’ लिप्यंतरित करना
  rationale: मूल पाठ जानबूझकर पूर्ण व्यक्तिगत नाम और उसके संक्षिप्त रूप में भेद करता है। दोनों को अलग रूप में रखना इस पाठगत भेद को बचाता है और किसी उपाधि द्वारा नाम को नहीं छिपाता।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सामूहिक आराधना के अनुकूल शैली। ‘अनादिकाल से अनन्तकाल तक’ मूल की दोहरी कालगत अभिव्यक्ति को सहज हिन्दी में रखता है; अन्तिम आज्ञा में ‘याह’ को सुरक्षित रखा गया है।
