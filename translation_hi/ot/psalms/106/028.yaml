  yaml_path: translation/ot/psalms/106/028.yaml
  text: They joined themselves to Baal of Peor and ate sacrifices of the dead[a][b].
translation:
  language: hi
  text: उन्होंने पोर के बाल से अपने को जोड़ लिया[a] और मरे हुओं के बलिदानों में से खाया।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पोर के बाल से अपने को बाँध लिया।”
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक अर्थ “मरे हुओं के बलिदान” है; यह वाक्यांश निर्जीव मूर्तियों को चढ़ाए गए बलिदानों या मृत लोगों से जुड़े अनुष्ठानों की ओर संकेत कर सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּצָּמְדוּ
  choice: जा मिले
  rationale: यह क्रिया निकटता से जुड़ने या अपने को बाँध लेने का भाव व्यक्त करती है। ‘जा मिले’ आधुनिक हिन्दी में स्वाभाविक है और मूर्तिपूजक उपासना से जानबूझकर जुड़ने का भाव बनाए रखता है।
- source_word: לְבַעַל פְּעוֹר
  choice: पोर के बाल से
  rationale: यह पद पोर स्थान से संबद्ध ‘बाल’ देवता को दर्शाता है। दोनों नामों का लिप्यंतरण रखते हुए संबंध को स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: וַיֹּאכְלוּ
  choice: और ... खाए
  rationale: सरल भूतकाल कथात्मक क्रम को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: זִבְחֵי
  choice: बलिदान
  rationale: यह संज्ञा बलि अथवा बलि में चढ़ाई गई वस्तुओं को दर्शाती है। प्रसंग में उन्हें खाने की बात है, इसलिए ‘बलिदान’ मूल पद की व्यापकता बनाए रखता है।
- source_word: מֵתִים
  choice: मरे हुओं
  rationale: इब्रानी का शाब्दिक अर्थ ‘मरे हुए’ है। यह अभिव्यक्ति निर्जीव देवताओं अथवा मृत लोगों से जुड़े अनुष्ठानों—दोनों संभावनाओं को खुला रखती है।
theological_decisions:
- issue: ‘मरे हुओं के बलिदान’ में ‘मरे हुओं’ का संदर्भ
  choice: मुख्य पाठ में व्यापक और शाब्दिक अभिव्यक्ति ‘मरे हुओं’ रखी गई है।
  alternative: निर्जीव मूर्तियाँ; मृत लोग; मरे हुए देवता
  rationale: इब्रानी पद स्वयं संदर्भ को स्पष्ट नहीं करता। उसे किसी एक अर्थ तक सीमित करना मूल की वास्तविक अस्पष्टता और धार्मिक तनाव को अनावश्यक रूप से सुलझा देता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘जा मिले’ सामान्य पाठक के लिए स्वाभाविक है, जबकि पादटिप्पणी अधिक चित्रात्मक ‘अपने को बाँध लिया’ विकल्प देती है। ‘मरे हुओं’ मूल की अस्पष्टता को सुरक्षित रखता है।
