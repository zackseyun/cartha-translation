  yaml_path: translation/ot/psalms/106/039.yaml
  text: So they became unclean by their deeds[a], and they prostituted themselves by their acts.
translation:
  language: hi
  text: इस प्रकार वे अपने कामों से अशुद्ध हो गए[a], और अपने कर्मों से वेश्यावृत्ति की।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने कर्मों के द्वारा बेवफ़ाई की।” इब्रानी में नैतिक और वाचा-संबंधी बेवफ़ाई के लिए यौन-आधारित बिंब का प्रयोग हुआ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּטְמְאוּ
  choice: अशुद्ध हो गए
  rationale: यह טמא के अकर्मक/परिणामसूचक भाव को स्वाभाविक हिन्दी में व्यक्त करता है और किसी बाहरी कर्ता को नहीं जोड़ता।
- source_word: בְמַעֲשֵׂיהֶם
  choice: अपने कामों से
  rationale: מַעֲשֶׂה का अर्थ काम या कार्य है; ‘से’ यहाँ साधन अथवा कारण का भाव स्पष्ट करता है।
- source_word: וַיִּזְנוּ
  choice: वेश्यावृत्ति करने लगे
  rationale: यह זנה की तीखी यौन-आधारित उपमा को बनाए रखता है, जिसे प्रसंग में नैतिक और वाचा-संबंधी विश्वासघात के लिए प्रयोग किया गया है।
- source_word: בְמַעַלְלֵיהֶם
  choice: अपने कर्मों से
  rationale: מַעֲלָל के कार्य/आचरण संबंधी अर्थ को व्यक्त करते हुए पहले पदांश के ‘कामों’ से काव्यात्मक शब्द-विविधता बनाए रखता है।
theological_decisions:
- issue: זנה को सीधे वाचा-संबंधी विश्वासघात के रूप में समझाकर अनुवाद किया जाए या उसकी यौन-आधारित उपमा बनाए रखी जाए
  choice: मुख्य पाठ में ‘वेश्यावृत्ति करने लगे’ कहकर उपमा बनाए रखी गई
  alternative: अपने कर्मों से विश्वासघाती हो गए
  rationale: भजन में मूर्तिपूजा और वाचा के प्रति बेवफाई का प्रसंग है, पर मूल इब्रानी उसे यौन-आधारित रूपक द्वारा व्यक्त करता है। मुख्य पाठ रूपक को सुरक्षित रखता है और व्याख्यात्मक अर्थ पाद-टिप्पणी में देता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज और गरिमापूर्ण शैली अपनाई गई है। ‘कामों’ और ‘कर्मों’ से इब्रानी समानार्थी शब्दों की काव्यात्मक विविधता रखी गई है; ‘वेश्यावृत्ति’ मूल की कठोर उपमा को बिना सांप्रदायिक व्याख्या जोड़े सुरक्षित रखती है।
