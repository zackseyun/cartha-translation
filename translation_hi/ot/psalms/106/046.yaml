  text: He caused them to receive compassion before all who had taken them captive.
translation:
  language: hi
  text: उसने ऐसा किया कि जिन्होंने उन्हें बंदी बनाया था, उन सबने उन पर दया की।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: उसने ऐसा किया कि ... मिली
  rationale: मूल क्रिया का शाब्दिक अर्थ ‘उसने दिया’ है; इस रचना में यह परमेश्वर द्वारा परिस्थिति उत्पन्न करने का भाव व्यक्त करती है। हिंदी में यह रूप कारणात्मक अर्थ को स्वाभाविक ढंग से रखता है।
- source_word: לְרַחֲמִים
  choice: दया
  rationale: बहुवचन रूप רַחֲמִים यहाँ करुणा अथवा दयापूर्ण व्यवहार का भाव देता है; सामान्य आधुनिक हिंदी में ‘दया’ स्पष्ट और स्वाभाविक है।
- source_word: לִפְנֵי
  choice: के सामने
  rationale: स्थानवाचक/संबंधवाचक अभिव्यक्ति को औपचारिक रूप से सुरक्षित रखा गया है; आशय उन बंदी बनाने वालों की दृष्टि और उपस्थिति में दया मिलने का है।
- source_word: כָּל־שׁוֹבֵיהֶם
  choice: उन सभी लोगों ... जिन्होंने उन्हें बंदी बना लिया था
  rationale: שׁבה का कृदंत उनके बंदी बनाने वालों को दर्शाता है। संबंधवाचक उपवाक्य आधुनिक हिंदी में अर्थ को साफ और सहज बनाता है।
theological_decisions:
- issue: दया का दाता और मानवीय माध्यम
  choice: परमेश्वर ने ऐसी परिस्थिति उत्पन्न की कि बंदी बनाने वालों के सामने उन्हें दया मिली
  alternative: परमेश्वर ने बंदी बनाने वालों को उन पर दया करने के लिए बाध्य किया
  rationale: मूल पाठ परमेश्वर की कारणात्मक भूमिका बताता है, पर मानवीय इच्छा की प्रक्रिया स्पष्ट नहीं करता; इसलिए उससे अधिक निश्चित धर्मवैचारिक दावा नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिंदी; सरल, गरिमापूर्ण और मूल की कारणात्मक रचना के निकट। किसी पादटिप्पणी की आवश्यकता नहीं है।
