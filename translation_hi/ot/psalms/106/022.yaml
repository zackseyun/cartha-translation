lexical_decisions:
- source_word: נִפְלָאוֹת
  choice: अद्भुत काम
  rationale: यह बहुवचन रूप असाधारण और आश्चर्यजनक कृत्यों को दर्शाता है। ‘अद्भुत काम’ प्राकृतिक हिन्दी में कृत्यों का भाव और काव्यात्मक समानांतरता बनाए रखता है।
- source_word: בְּאֶרֶץ
  choice: के देश में
  rationale: בְ यहाँ स्थानसूचक है; אֶרֶץ חָם का स्वाभाविक हिन्दी रूप ‘हाम के देश में’ है।
- source_word: חָם
  choice: हाम
  rationale: मूल पाठ के व्यक्तिवाचक नाम को लिप्यंतरित किया गया है। इस प्रसंग में यह मिस्र का काव्यात्मक नाम है, जिसकी व्याख्या पाद-टिप्पणी में दी गई है।
- source_word: נ֝וֹרָאוֹת
  choice: विस्मयकारी काम
  rationale: यह शब्द भय-मिश्रित विस्मय उत्पन्न करने वाले कृत्यों को सूचित करता है। ‘विस्मयकारी’ आधुनिक हिन्दी में श्रद्धामय विस्मय का भाव देता है और नैतिक बुराई का भ्रामक संकेत नहीं देता।
- source_word: עַל
  choice: के पास
  rationale: भौगोलिक स्थल के साथ עַל यहाँ ‘के पास/किनारे’ का स्थानसूचक अर्थ दे सकता है। ‘के पास’ मूल की व्यापकता को बनाए रखते हुए सहज हिन्दी है।
- source_word: יַם סוּף
  choice: लाल सागर
  rationale: परंपरागत और व्यापक रूप से पहचाना जाने वाला नाम ‘लाल सागर’ मुख्य पाठ में रखा गया है; अधिक शाब्दिक सम्भावना ‘सरकंडों का सागर’ पाद-टिप्पणी में दी गई है।
