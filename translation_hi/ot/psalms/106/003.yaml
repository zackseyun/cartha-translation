  yaml_path: translation/ot/psalms/106/003.yaml
  text: Blessed are those who keep justice[a], who do righteousness at all times.
translation:
  language: hi
  text: 'धन्य हैं वे जो न्याय का पालन करते हैं,

    जो हर समय धार्मिकता के काम करते हैं।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: धन्य हैं
  rationale: यह बहुवचन उद्गारात्मक रूप आशीर्वचन प्रस्तुत करता है। ‘धन्य हैं’ भजन की गरिमामय और वाचा-संबंधी ध्वनि बनाए रखता है; ‘सुखी हैं’ अपेक्षाकृत मनोवैज्ञानिक अर्थ दे सकता है।
- source_word: שֹׁמְרֵי
  choice: जो ... पालन करते हैं
  rationale: कृदंत निरंतर या अभ्यस्त आचरण बताता है। ‘पालन करते हैं’ न्याय के मानदंड को मानने और बनाए रखने का स्वाभाविक हिन्दी प्रयोग है।
- source_word: מִשְׁפָּט
  choice: न्याय
  rationale: इस नैतिक संदर्भ में शब्द किसी न्यायालयीन निर्णय से अधिक न्यायपूर्ण आचरण और न्याय के सिद्धांत को दर्शाता है।
- source_word: עֹשֵׂה
  choice: जो ... काम करते हैं
  rationale: बहुवचन कथन के बाद आया एकवचन कृदंत सामूहिक या सामान्य अर्थ रखता है। हिन्दी में बहुवचन संबंधवाचक उपवाक्य इस अभ्यस्त अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: צְדָקָה
  choice: धार्मिकता के काम
  rationale: यहाँ शब्द नैतिक रूप से सही और धर्मसम्मत आचरण को दर्शाता है। ‘धार्मिकता के काम’ अमूर्त गुण के साथ उसके क्रियात्मक पक्ष को भी स्पष्ट करता है और ‘न्याय’ से भेद बनाए रखता है।
- source_word: בְּכָל עֵת
  choice: हर समय
  rationale: यह पदबंध निरंतर और अभ्यस्त आचरण पर बल देता है। ‘हर समय’ आधुनिक हिन्दी में स्पष्ट, स्वाभाविक और मूल के व्यापक कालगत बल के अनुरूप है।
theological_decisions:
- issue: מִשְׁפָּט और צְדָקָה का पारस्परिक संबंध
  choice: दोनों को अलग रखते हुए क्रमशः ‘न्याय’ और ‘धार्मिकता के काम’ अनूदित किया गया है।
  alternative: दोनों को न्याय-संबंधी समान शब्दावली में व्यक्त करना, अथवा צְדָקָה को भी ‘न्याय’ कहना।
  rationale: इब्रानी में ये परस्पर संबद्ध किंतु पूर्णतः समान न होने वाले दो नैतिक शब्द हैं। अलग अनुवाद काव्यात्मक समानांतरता और वैचारिक भेद दोनों को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमामय भजनात्मक शैली। पंक्ति-विभाजन इब्रानी समानांतरता को स्पष्ट करता है।
