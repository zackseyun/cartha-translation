  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ֭/יַּקְצִיפוּ עַל מֵ֥י מְרִיבָ֑ה וַ/יֵּ֥רַע לְ֝/מֹשֶׁ֗ה בַּ/עֲבוּרָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/032.yaml
  text: They provoked anger at the waters of Meribah[b][a], and it went badly for Moses because of them.
translation:
  language: hi
  text: उन्होंने मरीबा[a] के जल के पास क्रोध भड़काया[b], और उनके कारण मूसा के साथ बुरा हुआ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘मरीबा’ का अर्थ ‘झगड़ा’ या ‘विवाद’ है।
    reason: cultural_note
  - marker: b
    text: या, “उन्होंने मरीबा के जल के पास उसे क्रोधित किया।” इब्रानी की इस पंक्ति में यह स्पष्ट नहीं कहा गया कि उन्होंने किसे क्रोधित किया।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְצִיפוּ
  choice: उन्होंने क्रोध भड़काया
  rationale: हिफ़ील रूप का कारक भाव व्यक्त करता है। इब्रानी में क्रोध का पात्र स्पष्ट नहीं है, इसलिए मुख्य पाठ में उसे नहीं जोड़ा गया।
- source_word: עַל מֵי מְרִיבָה
  choice: मरीबा के जल के पास
  rationale: यह उस स्थान अथवा घटना को सूचित करता है जहाँ लोगों ने क्रोध भड़काया। ‘मरीबा’ को स्थान-नाम के रूप में लिप्यंतरित किया गया है।
- source_word: וַיֵּרַע לְמֹשֶׁה
  choice: मूसा के साथ बुरा हुआ
  rationale: यह स्वाभाविक हिन्दी में मूसा पर आए प्रतिकूल परिणाम को व्यक्त करता है, बिना इसे नैतिक बुराई ठहराए।
- source_word: בַּעֲבוּרָם
  choice: उनके कारण
  rationale: संदर्भ में यह पद लोगों के कारण मूसा पर आए प्रतिकूल परिणाम का कारण बताता है।
theological_decisions:
- issue: मूसा पर आए प्रतिकूल परिणाम का स्वरूप
  choice: पद केवल यह कहता है कि लोगों के कारण मूसा के साथ बुरा हुआ।
  alternative: इसे विशेष रूप से मूसा के पाप का परिणाम मानना, या केवल लोगों के दोष पर बल देना।
  rationale: इस पंक्ति में इब्रानी पाठ पूरी व्याख्या नहीं देता; इसलिए अनुवाद मूसा की जिम्मेदारी और लोगों के उकसावे के बीच के तनाव को खुला रखता है।
- issue: भड़काए गए क्रोध का पात्र
  choice: मुख्य पाठ में क्रोध का पात्र अनिर्दिष्ट रखा गया है।
  alternative: ‘उन्होंने उसे क्रोधित किया,’ जहाँ ‘उसे’ से परमेश्वर अभिप्रेत हो सकता है।
  rationale: इब्रानी क्रिया का कर्म इस पंक्ति में स्पष्ट रूप से व्यक्त नहीं है; उसे जोड़ने से निहित अर्थ आवश्यकता से अधिक निश्चित हो जाएगा।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘क्रोध भड़काया’ कारक अर्थ तथा मूल पाठ की अनिर्दिष्टता दोनों को बनाए रखता है; ‘मूसा के साथ बुरा हुआ’ प्रतिकूल परिणाम को बिना अतिरिक्त धर्मवैज्ञानिक निष्कर्ष के व्यक्त करता है।
