  text: וַ/תִּבְעַר אֵ֥שׁ בַּ/עֲדָתָ֑/ם לֶ֝הָבָ֗ה תְּלַהֵ֥ט רְשָׁעִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/018.yaml
  text: And fire burned among their company[c][b][a]; a flame consumed the wicked.
translation:
  language: hi
  text: और उनकी सभा में आग भड़क उठी; ज्वाला ने दुष्टों को भस्म कर दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּבְעַר
  choice: भड़क उठी
  rationale: בער यहाँ आग के जल उठने या भड़कने को व्यक्त करता है; हिंदी में यह स्वाभाविक है और आग के आरंभ तथा तीव्रता दोनों का संकेत देता है।
- source_word: אֵשׁ
  choice: आग
  rationale: मूल शब्द का सीधा और सामान्य अर्थ 'आग' है; संदर्भ में इसे रूपक बनाने का कोई कारण नहीं है।
- source_word: בַּעֲדָתָם
  choice: उनकी सभा में
  rationale: עֵדָה एकत्र समुदाय या सभा को दर्शाता है। 'उनकी सभा में' सामूहिक अर्थ और בְּ के स्थानगत भाव दोनों को सहज हिंदी में बनाए रखता है।
- source_word: לֶהָבָה
  choice: ज्वाला
  rationale: यह आग की लौ या ज्वाला को दर्शाता है और पहले अर्धपद की 'आग' के साथ काव्यात्मक समानांतरता रखता है।
- source_word: תְּלַהֵט
  choice: भस्म कर दिया
  rationale: להט के इस रूप में तीव्र और विनाशकारी जलाने का भाव है; 'भस्म कर दिया' परिणामकारी बल को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: רְשָׁעִים
  choice: दुष्टों
  rationale: यह बहुवचन संज्ञात्मक विशेषण है, जिसका मानक और लिंग-निरपेक्ष सामूहिक हिंदी रूप 'दुष्टों' है।
theological_decisions:
- issue: न्याय-संबंधी भाषा का आशय
  choice: पद को विद्रोही समुदाय के बीच वास्तविक आग द्वारा हुए ऐतिहासिक न्याय के वर्णन के रूप में रखा गया है।
  alternative: इसे केवल न्याय के सामान्य रूपक के रूप में प्रस्तुत करना।
  rationale: निकटवर्ती संदर्भ इस्राएल के इतिहास में विद्रोह और दंड की घटनाओं को स्मरण करता है। इब्रानी पाठ ठोस आग और ज्वाला की भाषा इस्तेमाल करता है, इसलिए अनुवाद न तो इसे रूपक बनाता है, न इससे कोई व्यापक सिद्धांत जोड़ता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। 'सभा' सामुदायिक समूह का अर्थ सुरक्षित रखता है; 'भड़क उठी' और 'भस्म कर दिया' दोनों अर्धपदों की तीव्र काव्यात्मक गति को व्यक्त करते हैं।
