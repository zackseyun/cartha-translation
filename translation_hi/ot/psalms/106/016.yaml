source:
  edition: WLC
  text: וַ/יְקַנְא֣וּ לְ֭/מֹשֶׁה בַּֽ/מַּחֲנֶ֑ה לְ֝/אַהֲרֹ֗ן קְד֣וֹשׁ יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/016.yaml
  text: They became jealous of Moses in the camp[a], and of Aaron, the holy one of Yahweh.
translation:
  language: hi
  text: छावनी में वे मूसा से ईर्ष्या करने लगे, और याहवे के पवित्र जन हारून से भी[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हारून से भी, जो याहवे के लिए पवित्र था।”
    reason: קְדוֹשׁ יְהוָה को संबंध-सूचक ‘याहवे का पवित्र जन’ अथवा समर्पण-सूचक ‘याहवे के लिए पवित्र’ समझा जा सकता है।
lexical_decisions:
- source_word: וַיְקַנְאוּ
  choice: ईर्ष्या करने लगे
  rationale: यहाँ קנא मूसा और हारून के प्रति ईर्ष्यालु भाव दर्शाता है। ‘करने लगे’ काव्यात्मक पुनर्कथन में क्रिया के आरंभिक भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לְמֹשֶׁה / לְאַהֲרֹן
  choice: मूसा से … हारून से भी
  rationale: קנא के साथ ל ईर्ष्या के लक्ष्य को चिह्नित करता है; हिन्दी में ‘किसी से ईर्ष्या करना’ स्वाभाविक प्रयोग है। ‘भी’ दोनों समानांतर लक्ष्यों को स्पष्ट करता है।
- source_word: בַּמַּחֲנֶה
  choice: छावनी में
  rationale: מַחֲנֶה जंगल में इस्राएल की छावनी को सूचित करता है; यह सीधा और सामान्य हिन्दी रूप है।
- source_word: קְדוֹשׁ יְהוָה
  choice: याहवे के पवित्र जन
  rationale: यह पद हारून को याहवे के लिए विशेष रूप से पवित्र अथवा समर्पित व्यक्ति के रूप में पहचानता है। ‘पवित्र जन’ व्यक्ति-सूचक अर्थ को स्पष्ट रखते हुए मूल की संक्षिप्त उपाधि बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल में परमेश्वर का व्यक्तिगत नाम है; ‘याहवे’ उसे किसी उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित करता है।
theological_decisions:
- issue: हारून के लिए प्रयुक्त קְדוֹשׁ יְהוָה का संबंध
  choice: ‘याहवे के पवित्र जन’—हारून की याहवे से संबद्ध पवित्र हैसियत पर बल
  alternative: ‘याहवे के लिए पवित्र’—हारून के समर्पण पर बल
  rationale: इब्रानी पदबंध दोनों निकट अर्थों की अनुमति देता है। मुख्य पाठ संक्षिप्त संज्ञात्मक उपाधि को बनाए रखता है, जबकि पादटिप्पणी समर्पण-सूचक अर्थ को सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। समानांतर काव्यात्मक संरचना को बनाए रखते हुए हिन्दी की स्वाभाविक ‘से ईर्ष्या करना’ रचना अपनाई गई है।
