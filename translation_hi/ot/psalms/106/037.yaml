  text: וַ/יִּזְבְּח֣וּ אֶת בְּ֭נֵי/הֶם וְ/אֶת בְּנֽוֹתֵי/הֶ֗ם לַ/שֵּֽׁדִים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/037.yaml
  text: They sacrificed their sons and their daughters to demons[a].
translation:
  language: hi
  text: उन्होंने अपने बेटों और बेटियों को दुष्टात्माओं[a] के लिए बलि के रूप में चढ़ाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “दुष्टात्माओं को।”
    reason: इब्रानी לְ बलिदान के प्राप्तकर्ता को ‘को’ के रूप में भी व्यक्त कर सकता है; मुख्य पाठ का ‘के लिए’ भी प्राप्तकर्ता/लाभार्थी का स्वाभाविक हिन्दी निरूपण है।
lexical_decisions:
- source_word: וַיִּזְבְּחוּ
  choice: उन्होंने … बलि चढ़ाया
  rationale: זבח का अर्थ बलिदान के रूप में वध करना या अर्पित करना है। ‘बलि चढ़ाया’ आधुनिक हिन्दी में स्वाभाविक है और धार्मिक बलिदान का भाव स्पष्ट रखता है।
- source_word: בְּנֵיהֶם וְאֶת בְּנוֹתֵיהֶם
  choice: अपने बेटे-बेटियों को
  rationale: मूल पाठ में ‘उनके बेटे और उनकी बेटियाँ’ दोनों अलग-अलग उल्लिखित हैं। संयुक्त हिन्दी रूप ‘अपने बेटे-बेटियों’ इस लैंगिक समावेश और समग्र आरोप को स्वाभाविक ढंग से बनाए रखता है।
- source_word: לַשֵּׁדִים
  choice: दुष्टात्माओं के लिए
  rationale: שֵׁדִים अलौकिक दुष्ट प्राणियों को सूचित करता है। ‘दुष्टात्माएँ’ सामान्य आधुनिक हिन्दी में स्पष्ट है; ל उपसर्ग बलि के प्राप्तकर्ता या जिसके लिए बलि दी गई उसे दर्शाता है।
theological_decisions:
- issue: שֵׁדִים का अनुवाद
  choice: दुष्टात्माएँ
  alternative: दानव; दुष्टात्माओं को
  rationale: यह शब्द केवल मूर्तियों या झूठे देवताओं का अमूर्त संकेत नहीं, बल्कि अलौकिक प्राणियों का उल्लेख करता है। ‘दुष्टात्माएँ’ इस दावे को बनाए रखता है और उनके स्वरूप के बारे में अतिरिक्त अटकल नहीं जोड़ता।
- issue: לַ उपसर्ग का संबंध
  choice: के लिए
  alternative: को
  rationale: इब्रानी ל प्राप्तकर्ता अथवा लाभार्थी का भाव दे सकता है। ‘के लिए बलि चढ़ाया’ स्वाभाविक हिन्दी है; ‘को बलि चढ़ाया’ भी सम्भव है और उसे पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘बेटे-बेटियों’ सामान्य पाठक के लिए स्वाभाविक है, जबकि मूल के दोनों लिंगों के स्पष्ट उल्लेख को सुरक्षित रखता है।
