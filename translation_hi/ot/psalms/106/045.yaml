  text: וַ/יִּזְכֹּ֣ר לָ/הֶ֣ם בְּרִית֑/וֹ וַ֝/יִּנָּחֵ֗ם כְּ/רֹ֣ב חסד/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/045.yaml
  text: He remembered his covenant for their sake[a], and relented according to the abundance of his steadfast love.
translation:
  language: hi
  text: उसने उनके लिए अपनी वाचा को स्मरण किया और अपने अटल प्रेम की प्रचुरता के अनुसार अपना इरादा बदल लिया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तरस खाया” अथवा “करुणा की।” इब्रानी क्रिया पहले के इरादे या कार्रवाई से पीछे हटने, अथवा दया से द्रवित होने का भाव व्यक्त कर सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְכֹּר
  choice: स्मरण किया
  rationale: वाचा के संदर्भ में זכר केवल मन में याद आने का नहीं, बल्कि पहले की प्रतिबद्धता को ध्यान में रखकर कार्य करने का भाव भी रखता है। ‘स्मरण किया’ इस वाचागत प्रतिध्वनि को पारदर्शी ढंग से बनाए रखता है।
- source_word: לָהֶם
  choice: उनके लिए
  rationale: לָהֶם यहाँ लोगों के संबंध में और उनके हित में वाचा स्मरण करने का भाव देता है। ‘उनके लिए’ स्वाभाविक और मूल के निकट है।
- source_word: בְּרִיתוֹ
  choice: अपनी वाचा को
  rationale: בְּרִית का स्थापित बाइबलीय अर्थ ‘वाचा’ है; ‘समझौता’ या ‘संधि’ इसके धर्मवैचारिक और संबंधपरक भार को घटा देंगे।
- source_word: וַיִּנָּחֵם
  choice: तरस खाया
  rationale: נחם के निफ़ाल रूप में पछताना, अपने निश्चय से हटना, या करुणा से द्रवित होना जैसे अर्थ संभव हैं। इस दया-प्रधान संदर्भ में ‘तरस खाया’ स्वाभाविक है, जबकि वैकल्पिक अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: כְּרֹב
  choice: अपार ... के अनुसार
  rationale: כ + רֹב मात्रा या अनुपात का भाव व्यक्त करता है। ‘अपार ... के अनुसार’ हिंदी में सहज रहते हुए प्रेम की प्रचुरता और उसके अनुरूप दयापूर्ण कार्रवाई को व्यक्त करता है।
- source_word: חסדו
  choice: अपने ... अटल प्रेम
  rationale: חסד कृपालु, निष्ठावान और टिकाऊ प्रेम को व्यक्त करता है। ‘अटल प्रेम’ आधुनिक हिंदी में इसकी संबंधपरक स्थिरता को स्पष्ट रखता है; केवल ‘दया’ इसका अर्थ संकरा कर देती।
theological_decisions:
- issue: וַיִּנָּחֵם में परमेश्वर के लिए प्रयुक्त मानवीय भावभाषा
  choice: तरस खाया
  alternative: अपने निश्चय से हट गया; अपना मन बदल लिया
  rationale: इब्रानी क्रिया करुणा से द्रवित होने और पहले घोषित कार्रवाई से हटने—दोनों भाव ग्रहण कर सकती है। मुख्य पाठ में प्रसंगानुकूल करुणा को रखा गया है, पर पादटिप्पणी वास्तविक शाब्दिक अस्पष्टता और परमेश्वर के व्यवहार में आए परिवर्तन की धर्मवैचारिक तनावपूर्ण अभिव्यक्ति को सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘वाचा’ और ‘अटल प्रेम’ जैसे स्थापित बाइबलीय पद मूल की वाचागत भाषा को बनाए रखते हैं।
