base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/027.yaml
  text: There is little Benjamin[a], leading them; the princes of Judah in their throng; the princes of Zebulun[b]; the princes of Naphtali.
translation:
  language: hi
  text: वहाँ छोटा-सा बिन्यामीन उनकी अगुवाई कर रहा है[a]; यहूदा के प्रधान अपने दल के साथ[b], जबूलून के प्रधान और नप्ताली के प्रधान।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उन पर शासन कर रहा है” अथवा “उन पर प्रभुता कर रहा है।” इब्रानी कृदन्त शासन या अग्रस्थान—दोनों का भाव दे सकता है; यहाँ जुलूस के संदर्भ में मुख्य पाठ ने अगुवाई का अर्थ लिया है।
    reason: lexical_alternative
  - marker: b
    text: या, “अपने समूह में,” “अपनी भीड़ में” अथवा “अपने समुदाय के साथ।” इब्रानी शब्द दुर्लभ है और उसका सटीक भाव अनिश्चित है, पर वह यहूदा के साथ एकत्र समूह को दर्शाता है।
    reason: lexical_alternative
