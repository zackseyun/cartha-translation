  yaml_path: translation/ot/psalms/068/013.yaml
  text: Though you lie down among the sheepfolds[a], the wings of a dove are covered with silver[b], and her pinions with yellow gold.
translation:
  language: hi
  text: भले ही तुम भेड़शालाओं के बीच लेटे रहो[a], कबूतरी के पंख चाँदी से ढके हैं, और उसके पर पीले सोने से[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “काठी की थैलियों के बीच” या “चूल्हे के पत्थरों के बीच”; इब्रानी शब्द का अर्थ अनिश्चित है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक अर्थ “हरेपन लिए सोने से” या “सोने की पीली-हरी चमक से” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: चाहे
  rationale: काव्यात्मक संदर्भ में यह शब्द संभावित रियायती भाव व्यक्त करता है। ‘चाहे’ उस भाव को रखता है, जबकि शर्तसूचक ‘यदि’ भी व्याकरणतः संभव है।
- source_word: תִּשְׁכְּבוּן
  choice: तुम ... लेटे रहो
  rationale: שׁכב का मूल शारीरिक अर्थ ‘लेटना’ है। अपूर्ण रूप को यहाँ सामान्य या स्थितिमूलक काव्यात्मक कथन के रूप में प्रस्तुत किया गया है।
- source_word: בֵּין שְׁפַתָּיִם
  choice: भेड़शालाओं के बीच
  rationale: שְׁפַתָּיִם अत्यंत विवादित शब्द है। पारंपरिक और संदर्भ-संगत अर्थ ‘भेड़शालाएँ’ मुख्य पाठ में रखा गया है; अन्य प्रमुख संभावनाएँ पादटिप्पणी में दी गई हैं।
- source_word: כַּנְפֵי יוֹנָה
  choice: कबूतरी के पंख
  rationale: यह संबंधसूचक पदबंध का सीधा और स्वाभाविक हिन्दी रूप है। आगे स्त्रीलिंग प्रत्यय होने के कारण ‘कबूतरी’ उपयुक्त है।
- source_word: נֶחְפָּה בַכֶּסֶף
  choice: चाँदी से ढके हैं
  rationale: חפה आवरण या मढ़े होने का भाव देता है। ‘ढके’ स्पष्ट है और धातु की परत चढ़े होने की छवि को अत्यधिक विशिष्ट किए बिना बनाए रखता है।
- source_word: אֶבְרוֹתֶיהָ
  choice: उसके पर
  rationale: אֶבְרוֹת विशेषतः उड़ान-पंखों या डैनों को सूचित कर सकता है। आधुनिक सामान्य हिन्दी में ‘पर’ संक्षिप्त, काव्यात्मक और समझने योग्य है।
- source_word: בִּירַקְרַק חָרוּץ
  choice: सुनहरे-हरे सोने से
  rationale: חָרוּץ यहाँ सोना है और יְרַקְרַק पीले-हरे या हरेपन लिए रंग का संकेत देता है। असामान्य मूल छवि को मिटाने के बजाय ‘सुनहरे-हरे’ द्वारा सुरक्षित रखा गया है।
