lexical_decisions:
- source_word: בְּמַקְהֵלוֹת
  choice: सभाओं में
  rationale: बहुवचन संज्ञा एकत्र हुए समुदायों को दर्शाती है। ‘सभाओं’ से बहुवचन और उपासना का संदर्भ दोनों बने रहते हैं, बिना किसी विशेष संस्थागत धार्मिक अर्थ को जोड़े।
- source_word: בָּרְכוּ
  choice: धन्य कहो
  rationale: यह बहुवचन आज्ञार्थक क्रिया है। परमेश्वर के लिए प्रयुक्त होने पर ‘धन्य कहो’ हिन्दी में उपासना-संबंधी अर्थ को स्वाभाविक रूप से व्यक्त करता है और इसे केवल सामान्य ‘स्तुति करो’ में नहीं बदलता।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: यहाँ अर्थ एकवचन है और יְהוָה के समानाधिकरण में है; आधुनिक मानक हिन्दी में ‘परमेश्वर’ उपयुक्त और प्रतिष्ठित रूप है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मसोराई इब्रानी पाठ में चतुरक्षरीय व्यक्तिगत नाम יְהוָה है; इसलिए उपाधि ‘प्रभु’ के स्थान पर नाम का लिप्यंतरण रखा गया है।
- source_word: מִמְּקוֹר
  choice: सोते से निकले हो
  rationale: מָקוֹר का मूल अर्थ जल का स्रोत या सोता है। इब्रानी वाक्यांश संक्षिप्त और अर्थ की दृष्टि से खुला है; मुख्य पाठ में इसे संबोधित उपासकों की उत्पत्ति के रूप में समझते हुए काव्यात्मक बिंब बनाए रखा गया है।
- source_word: יִשְׂרָאֵל
  choice: इस्राएल
  rationale: व्यक्तिवाचक नाम का हिन्दी में प्रचलित बाइबलीय लिप्यंतरण।
theological_decisions:
- issue: יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल WLC पाठ व्यक्तिगत दिव्य नाम रखता है। ‘याहवे’ उस नाम को शीर्षक से प्रतिस्थापित किए बिना प्रस्तुत करता है; किसी सम्प्रदायगत व्याख्या को नहीं जोड़ा गया।
- issue: מִמְּקוֹר יִשְׂרָאֵל का संबंध
  choice: 'उपासकों को संबोधित: ‘तुम जो इस्राएल के सोते से निकले हो’'
  alternative: 'सीधा क्रियाविशेषणीय वाक्यांश: ‘इस्राएल के सोते से’'
  rationale: इब्रानी वाक्यांश दीर्घवृत्तात्मक है। इसे इस्राएल की संतति से आए उपासकों का संबोधन मानना संभव और हिन्दी में अधिक बोधगम्य है, पर दूसरी व्याकरणिक संभावना को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामूहिक उपासना के लिए सुबोध रखी गई है। ‘धन्य कहो’ ने मूल क्रिया का उपासना-संबंधी स्वर बनाए रखा है। डैश समानाधिकरण को स्पष्ट करते हैं, जबकि पादटिप्पणी कठिन इब्रानी वाक्य-विन्यास की वास्तविक अस्पष्टता सुरक्षित रखती है।
