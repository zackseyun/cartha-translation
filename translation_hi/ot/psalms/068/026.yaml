  text: In the assemblies[a], bless God, the Lord[b], from the fountain of Israel.
translation:
  language: hi
  text: सभाओं में परमेश्वर को धन्य कहो, याहवे को, इस्राएल के सोते से।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सभाओं में परमेश्वर को, याहवे को धन्य कहो, हे इस्राएल के सोते से निकले लोगो।” इब्रानी में “इस्राएल के सोते से” वाक्यांश संक्षिप्त है। यह उपासकों की उत्पत्ति—अर्थात् इस्राएल से उनकी संबद्धता—बता सकता है, या काव्यात्मक रूप से क्रिया से जुड़ सकता है।
