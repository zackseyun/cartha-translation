  text: חַיָּתְ/ךָ֥ יָֽשְׁבוּ בָ֑/הּ תָּ֤כִ֥ין בְּ/טוֹבָתְ/ךָ֖ לֶ/עָנִ֣י אֱלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/010.yaml
  text: Your creatures settled in it; in your goodness[a], O God, you provided for the poor.
translation:
  language: hi
  text: तेरे प्राणी[a] उसमें बस गए; हे परमेश्वर, तूने अपनी भलाई से दीन जन के लिए प्रबंध किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ इब्रानी חַיָּתְךָ का अर्थ कठिन और निश्चित नहीं है; इसका अनुवाद “तेरे जीवित प्राणी,” “तेरा समुदाय,” या “तेरी मंडली” भी हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: חַיָּתְךָ
  choice: तेरे जीवधारी
  rationale: חַיָּה का मूल अर्थ जीवित प्राणी या पशु है, पर यहाँ सामूहिक अर्थ भी संभव है। ‘जीवधारी’ मूल की व्यापकता बनाए रखता है; कठिन काव्यात्मक प्रयोग के अन्य संभावित अर्थ पादटिप्पणी में दिए गए हैं।
- source_word: יָשְׁבוּ בָהּ
  choice: उसमें बस गए
  rationale: ישב का अर्थ बैठना, रहना या बसना हो सकता है। संदर्भ में तैयार किए गए स्थान में निवास ग्रहण करने के लिए ‘बस गए’ स्वाभाविक और ठोस है; स्त्रीलिंग प्रत्यय पूर्ववर्ती भूमि/विरासत की ओर संकेत करता है।
- source_word: תָּכִין
  choice: तूने ... प्रबंध किया
  rationale: כון के हिफ़ील रूप का अर्थ तैयार करना, स्थिर करना या उपलब्ध कराना है। दीन जन के संदर्भ में ‘प्रबंध किया’ परमेश्वर द्वारा आवश्यक व्यवस्था किए जाने का भाव व्यक्त करता है, बिना वस्तु को अनावश्यक रूप से निर्दिष्ट किए।
- source_word: בְּטוֹבָתְךָ
  choice: अपनी भलाई से
  rationale: טוֹבָה यहाँ भलाई, उदारता या भरपूरी को दर्शाता है। ‘अपनी भलाई से’ साधन/स्रोत के भाव सहित परमेश्वर की उदार कृपा को सहज हिन्दी में रखता है।
- source_word: לֶעָנִי
  choice: दीन जन के लिए
  rationale: עָנִי निर्धन, पीड़ित या दीन व्यक्ति को सूचित कर सकता है। ‘दीन जन’ आर्थिक अभाव तक अर्थ को सीमित किए बिना इसकी व्यापक अर्थ-सीमा बनाए रखता है।
- source_word: אֱלֹהִים
  choice: हे परमेश्वर
  rationale: पद के अंत में यह सीधा संबोधन है; हिन्दी में ‘हे परमेश्वर’ उसका प्रार्थनात्मक-काव्यात्मक बल स्पष्ट करता है।
theological_decisions:
- issue: कठिन काव्यात्मक संदर्भ में חַיָּתְךָ की व्याख्या
  choice: मूल के व्यापक सजीव अर्थ को ‘तेरे जीवधारी’ द्वारा व्यक्त करना
  alternative: तेरा समुदाय; तेरी मंडली; तेरे पशु
  rationale: इब्रानी शब्द सामान्यतः जीवित प्राणी या पशु को दर्शाता है, किंतु यहाँ परमेश्वर के लोगों या उसके साथ जुड़े समूह के लिए सामूहिक रूपक भी हो सकता है। मुख्य पाठ अपेक्षाकृत शाब्दिक व्यापकता रखता है और पादटिप्पणी वास्तविक अस्पष्टता को खुला छोड़ती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और काव्यात्मक संबोधन रखा गया है। ‘तेरे/तूने’ भजन की सीधी प्रार्थना के अनुरूप हैं। अस्पष्ट इब्रानी पद को किसी संप्रदायगत अर्थ में सीमित नहीं किया गया।
