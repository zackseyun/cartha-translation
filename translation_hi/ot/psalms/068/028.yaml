  text: Your God has commanded your strength. Show strength[a], O God, you who have worked for us.
translation:
  language: hi
  text: तेरे परमेश्वर ने तेरे सामर्थ्य को आदेश दिया है। हे परमेश्वर, जिसने हमारे लिए कार्य किया है, सामर्थ्य दिखा[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी עוּזָה का अर्थ निश्चित नहीं है। इसका अर्थ “हे परमेश्वर, बलवान हो” भी हो सकता है; अथवा इसे अगले पद से जोड़कर, “हे परमेश्वर, जो तूने हमारे लिए किया है, उसे दृढ़ कर” समझा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: צִוָּה
  choice: आदेश दिया है
  rationale: पूर्ण क्रिया के अधिकारपूर्ण आदेश देने के भाव और उसके वर्तमान प्रभाव को बनाए रखता है।
- source_word: אֱלֹהֶיךָ
  choice: तेरे परमेश्वर
  rationale: बहुवचन-रूप אֱלֹהִים यहाँ इस्राएल के परमेश्वर के लिए एकवचन अर्थ में है; प्रत्यय द्वितीय पुरुष एकवचन है।
- source_word: עֻזֶּךָ
  choice: तेरे सामर्थ्य को
  rationale: संज्ञा का अर्थ सामर्थ्य या शक्ति है; कर्मचिह्न ‘को’ इसे צִוָּה के कर्म के रूप में व्यक्त करता है।
- source_word: עוּזָה
  choice: सामर्थ्य दिखा
  rationale: यह कठिन, आज्ञार्थक-जैसा रूप परमेश्वर से सामर्थ्य प्रकट करने की विनती के रूप में स्वाभाविक हिंदी देता है; इसकी अन्य संभावनाएँ पादटिप्पणी में सुरक्षित हैं।
- source_word: אֱלֹהִים
  choice: हे परमेश्वर
  rationale: संदर्भ में संबोधन है, जिसे हिंदी में ‘हे’ स्पष्ट और गरिमापूर्ण बनाता है।
- source_word: זוּ
  choice: तूने
  rationale: सापेक्ष उपवाक्य में परमेश्वर की ओर संकेत को हिंदी में अगले क्रियापद के स्पष्ट द्वितीय-पुरुष कर्ता द्वारा स्वाभाविक रूप दिया गया है।
- source_word: פָּעַלְתָּ
  choice: कार्य किया है
  rationale: यह प्रभावी रीति से करने या कार्य करने का भाव रखता है और पूर्ण क्रिया का वर्तमान-संबद्ध परिणाम व्यक्त करता है।
- source_word: לָּנוּ
  choice: हमारे लिए
  rationale: 'לְ यहाँ हितार्थक है: परमेश्वर का कार्य लोगों के हित में हुआ है।'
theological_decisions:
- issue: आज्ञार्थक-जैसे कठिन रूप עוּזָה का अर्थ
  choice: 'परमेश्वर से सामर्थ्य प्रकट करने की विनती: ‘हे परमेश्वर, सामर्थ्य दिखा’'
  alternative: ‘हे परमेश्वर, सामर्थी हो’ अथवा अगले पद से जोड़कर ‘हे परमेश्वर, जो तूने हमारे लिए किया है, उसे दृढ़ कर’
  rationale: इब्रानी रूप वाक्य-विन्यास की दृष्टि से कठिन है। मुख्य पाठ प्रार्थनात्मक भाव को स्पष्ट रखता है, जबकि पादटिप्पणी वास्तविक वैकल्पिक पाठों को बिना किसी एक को सिद्धांतगत रूप से थोपे सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण और प्रार्थनात्मक शैली रखी गई है। परमेश्वर के सीधे संबोधन में पारंपरिक निकटता दर्शाने वाले ‘तू/तेरे’ का सुसंगत प्रयोग किया गया है। पहले वाक्य की स्रोत-पाठगत असामान्यता को सहज व्याख्या से मिटाने के बजाय ‘सामर्थ्य को आदेश दिया’ द्वारा बनाए रखा गया है।
