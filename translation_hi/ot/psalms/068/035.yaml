source:
  edition: WLC
  text: נ֤וֹרָ֥א אֱלֹהִ֗ים מִֽ/מִּקְדָּ֫שֶׁ֥י/ךָ אֵ֤ל יִשְׂרָאֵ֗ל ה֤וּא נֹתֵ֨ן עֹ֖ז וְ/תַעֲצֻמ֥וֹת לָ/עָ֗ם בָּר֥וּךְ אֱלֹהִֽים׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/035.yaml
  text: Awesome is God from your sanctuaries; the God of Israel—he gives strength and mighty power to the people[a]. Blessed be God!
translation:
  language: hi
  text: 'परमेश्वर अपने पवित्रस्थानों से भय और विस्मय जगाने वाला है[a];


    इस्राएल का परमेश्वर—वही लोगों को बल और प्रबल सामर्थ्य देता है।


    परमेश्वर धन्य है!'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘अपने पवित्रस्थान से’ अथवा ‘अपने पवित्रस्थान में।’ इब्रानी में शाब्दिक रूप से ‘अपने पवित्रस्थानों से’ बहुवचन है; यह बहुवचन परमेश्वर के पवित्र निवास को महिमासूचक या सामूहिक अर्थ में भी व्यक्त कर सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: נ֤וֹרָ֥א
  choice: भय और विस्मय जगाता है
  rationale: यह विशेषण श्रद्धामय भय और अभिभूत कर देने वाले विस्मय, दोनों का भाव रखता है। स्वाभाविक आधुनिक हिन्दी में यह पदबंध केवल नकारात्मक ‘भयावह’ अर्थ से बचते हुए दोनों पहलुओं को व्यक्त करता है।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: यहाँ रूप बहुवचन होते हुए भी इस्राएल के एक परमेश्वर के लिए प्रयुक्त है; हिन्दी में एकवचन ‘परमेश्वर’ उपयुक्त है।
- source_word: מִֽמִּקְדָּ֫שֶׁ֥י/ךָ
  choice: अपने पवित्रस्थानों से
  rationale: इब्रानी रूप व्याकरणतः बहुवचन है और उसके साथ द्वितीय पुरुष एकवचन प्रत्यय है। मुख्य पाठ में ‘से’ और बहुवचन दोनों सुरक्षित रखे गए हैं; हिन्दी में कर्ता के अनुरूप ‘अपने’ स्वाभाविक है।
- source_word: אֵ֤ל יִשְׂרָאֵ֗ל
  choice: इस्राएल का परमेश्वर
  rationale: यह पहले उल्लिखित परमेश्वर की पहचान बताने वाला समानाधिकरण पद है।
- source_word: ה֤וּא
  choice: वही
  rationale: स्पष्ट सर्वनाम के बलाघात को हिन्दी में ‘वही’ से व्यक्त किया गया है।
- source_word: נֹתֵ֨ן
  choice: देता है
  rationale: कृदन्त परमेश्वर के नियमित या चारित्रिक कार्य को दर्शाता है; सामान्य वर्तमान काल इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: עֹ֖ז
  choice: बल
  rationale: इस संज्ञा का मूल अर्थ बल या सामर्थ्य है; ‘बल’ अगले पद से शब्दगत भेद बनाए रखता है।
- source_word: וְ/תַעֲצֻמ֥וֹת
  choice: और प्रबल सामर्थ्य
  rationale: यह बहुवचन संज्ञा अत्यधिक शक्ति या महान पराक्रम का भाव देती है। ‘प्रबल सामर्थ्य’ पहले पद को दोहराए बिना उसकी तीव्रता बनाए रखता है।
- source_word: לָ/עָ֗ם
  choice: लोगों को
  rationale: इब्रानी में निश्चित ‘लोगों/प्रजा को’ है, पर ‘अपने’ स्पष्ट रूप से नहीं है; इसलिए कोई स्वामित्वसूचक शब्द नहीं जोड़ा गया।
- source_word: בָּר֥וּךְ
  choice: धन्य है
  rationale: स्तुतिपरक आशीर्वचन को वर्तमान हिन्दी में स्वाभाविक और गरिमापूर्ण ढंग से व्यक्त करता है।
theological_decisions:
- issue: ‘पवित्रस्थानों’ की संख्या और अर्थ
  choice: अपने पवित्रस्थानों से
  alternative: अपने पवित्रस्थान से; अपने पवित्रस्थान में
  rationale: मसोरेटिक इब्रानी रूप व्याकरणतः बहुवचन है और מִן का सामान्य अर्थ ‘से’ है, इसलिए मुख्य पाठ दोनों विशेषताओं को सुरक्षित रखता है। फिर भी बहुवचन को महिमासूचक या सामूहिक अर्थ में एक पवित्र निवास के लिए समझना और पूर्वसर्ग को स्थानसूचक ‘में’ मानना सम्भव है; इन विकल्पों को पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण काव्यात्मक शैली रखी गई है। ‘भय और विस्मय जगाता है’ נוֹרָא के श्रद्धामय भय को स्पष्ट करता है, जबकि ‘वही’ मूल सर्वनाम के बलाघात को सुरक्षित रखता है। पंक्ति-विन्यास पद के स्तुतिगानात्मक प्रवाह को उभारता है।
