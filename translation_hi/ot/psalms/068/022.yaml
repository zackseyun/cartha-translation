  text: אָמַ֣ר אֲ֭דֹנָ/י מִ/בָּשָׁ֣ן אָשִׁ֑יב אָ֝שִׁ֗יב מִֽ/מְּצֻל֥וֹת יָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/022.yaml
  text: The Lord said[a], “I will bring them back from Bashan; I will bring them back from the depths of the sea,”
translation:
  language: hi
  text: प्रभु ने कहा, “मैं बाशान से वापस ले आऊँगा; मैं समुद्र की गहराइयों से वापस ले आऊँगा।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, कर्म को स्पष्ट करते हुए: “मैं उन्हें बाशान से वापस ले आऊँगा; मैं उन्हें समुद्र की गहराइयों से वापस ले आऊँगा।” हिब्रू में दोनों क्रियाओं का कर्म व्यक्त नहीं किया गया है।'
    reason: मूल पाठ के अव्यक्त कर्म को स्पष्ट करता है और बताता है कि वैकल्पिक स्पष्ट अनुवाद दोनों समानांतर क्रियाओं पर लागू होता है।
lexical_decisions:
- source_word: אֲדֹנָי
  choice: प्रभु
  rationale: यहाँ अֲדֹנָי परमेश्वर के लिए प्रयुक्त उपाधि है, दिव्य नाम YHWH नहीं। ‘प्रभु’ आधुनिक हिन्दी में स्वाभाविक और गरिमापूर्ण रूप है।
- source_word: אָמַר
  choice: ने कहा
  rationale: क़ातल रूप यहाँ सीधे परमेश्वर के कथन का परिचय देता है; ‘ने कहा’ इसका सहज कथात्मक अनुवाद है।
- source_word: מִבָּשָׁן
  choice: बाशान से
  rationale: בָּשָׁן स्थान-नाम है, इसलिए उसका लिप्यंतरण किया गया है; מִן को स्वाभाविक रूप से ‘से’ कहा गया है।
- source_word: אָשִׁיב ... אָשִׁיב
  choice: मैं ... वापस ले आऊँगा; मैं ... वापस ले आऊँगा
  rationale: שׁוב के हिफ़ील रूप का अर्थ यहाँ ‘वापस ले आना’ है। मूल की ज़ोरदार पुनरावृत्ति सुरक्षित रखी गई है। हिब्रू में कर्म व्यक्त नहीं है और हिन्दी में भी उसे स्वाभाविक रूप से अनकहा रखा जा सकता है।
- source_word: מִמְּצֻלוֹת יָם
  choice: समुद्र की गहराइयों से
  rationale: מְצֻלוֹת जल के गहरे स्थानों को दर्शाता है। यह हिन्दी रूप मूल की चरम गहराई और दूरस्थता की छवि बनाए रखता है; ‘समुद्र’ को सामान्य संज्ञा माना गया है।
theological_decisions:
- issue: दोहराए गए אָשִׁיב का अव्यक्त कर्म
  choice: 'मुख्य पाठ में कर्म को अव्यक्त रखा गया: ‘वापस ले आऊँगा’'
  alternative: ‘उन्हें वापस ले आऊँगा’
  rationale: हिब्रू में कर्म स्पष्ट नहीं किया गया है। हिन्दी में भी प्रसंग से समझे जाने वाले कर्म को छोड़ा जा सकता है, इसलिए मूल की वास्तविक अस्पष्टता सुरक्षित रहती है। ‘उन्हें’ सम्भव अर्थ है, पर उसे मुख्य पाठ में जोड़ना यह तय कर देता कि किन्हें वापस लाया जाएगा।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण काव्यात्मक गद्य। समानांतर वाक्य-रचना और क्रिया की पुनरावृत्ति मूल के बलाघात को बनाए रखती है।
