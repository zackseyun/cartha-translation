  text: לְמַ֤עַן תִּֽמְחַ֥ץ רַגְלְ/ךָ֗ בְּ֫/דָ֥ם לְשׁ֥וֹן כְּלָבֶ֑י/ךָ מֵ/אֹיְבִ֥ים מִנֵּֽ/הוּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/023.yaml
  text: so that your foot may crush them in blood[b][a], and the tongue of your dogs may have its portion from the enemies.
translation:
  language: hi
  text: ताकि तुम्हारा पैर लहू में उन्हें कुचले[b], और तुम्हारे कुत्तों की जीभ शत्रुओं से अपना भाग पाए।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अंतिम इब्रानी पद कठिन और लुप्तार्थक है; इसे ‘उनमें से’ या ‘उनसे’ भी समझा जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: 'अधिक शाब्दिक रूप: ‘तुम्हारा पैर लहू में कुचले’; ‘उन्हें’ प्रसंग से पूरा किया गया है।'
    reason: supplied_object
lexical_decisions:
- source_word: לְמַעַן
  choice: ताकि
  rationale: यह उद्देश्य अथवा परिणाम प्रकट करता है; आधुनिक हिन्दी में ‘ताकि’ स्वाभाविक और संक्षिप्त है।
- source_word: תִּמְחַץ
  choice: कुचले
  rationale: מחץ का अर्थ प्रहार करके कुचलना है। आश्रित संभावनार्थक क्रिया यहाँ उद्देश्यसूचक לְמַעַן के अनुरूप है।
- source_word: רַגְלְךָ
  choice: तुम्हारा पैर
  rationale: इब्रानी में संज्ञा एकवचन और प्रत्यय द्वितीय पुरुष पुल्लिंग एकवचन है; इसलिए एकवचन बनाए रखा गया है।
- source_word: בְּדָם
  choice: लहू में
  rationale: בְּ को अपेक्षाकृत शाब्दिक रखते हुए युद्ध का सजीव और कठोर बिंब सुरक्षित किया गया है।
- source_word: לְשׁוֹן כְּלָבֶיךָ
  choice: तुम्हारे कुत्तों की जीभ
  rationale: मूल का सामूहिक एकवचन ‘जीभ’ बनाए रखा गया है; हिन्दी में यह समझने योग्य है।
- source_word: מֵאֹיְבִים
  choice: शत्रुओं से
  rationale: מִן स्रोत को व्यक्त करता है; ‘से’ बताता है कि कुत्तों को मिलने वाला भाग पराजित शत्रुओं से आता है।
- source_word: מִנֵּהוּ
  choice: अपना भाग पाए
  rationale: अंतिम पद कठिन और लुप्तार्थक है। प्रसंग में इसे कुत्तों की जीभ को शत्रुओं से भाग मिलने के अर्थ में स्वाभाविक हिन्दी में व्यक्त किया गया है, जबकि इसकी अनिश्चितता पादटिप्पणी में बताई गई है।
theological_decisions:
- issue: हिंसक युद्ध-चित्रण
  choice: पैर के लहू में कुचलने और कुत्तों को शत्रुओं से भाग मिलने का ठोस चित्र बनाए रखा गया है।
  alternative: इसे केवल सामान्य विजय के कथन में नरम करना।
  rationale: मूल पद जानबूझकर तीखा युद्ध-चित्र प्रस्तुत करता है; अनुवाद में उसे धर्मवैचारिक सुविधा के लिए मंद नहीं किया गया।
- issue: अंतिम इब्रानी वाक्यांश की अस्पष्टता
  choice: मुख्य पाठ में अर्थपूर्ण, किंतु संयमित रूप ‘अपना भाग पाए’ रखा गया है।
  alternative: अत्यंत शाब्दिक ‘उसमें से/उससे’ कहना।
  rationale: מִנֵּהוּ का संबंध और आशय विवादास्पद तथा लुप्तार्थक है। मुख्य पाठ सामान्यतः स्वीकृत प्रसंगगत अर्थ देता है और पादटिप्पणी वास्तविक कठिनाई सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘लहू’ काव्यात्मक भजन-संदर्भ में स्वाभाविक है। मूल का एकवचन ‘पैर’ और सामूहिक एकवचन ‘जीभ’ सुरक्षित हैं; हिंसक बिंब को नरम नहीं किया गया।
