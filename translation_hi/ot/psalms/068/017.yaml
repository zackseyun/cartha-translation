  text: The chariots of God are myriads[a], thousands upon thousands; the Lord is among them[c][b], Sinai in holiness.
translation:
  language: hi
  text: परमेश्वर के रथ असंख्य हैं—हज़ारों पर हज़ारों; प्रभु उनके बीच हैं; सीनै पवित्रता में है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अंतिम इब्रानी खंड अत्यन्त संक्षिप्त और कठिन है। इसका अर्थ यह भी हो सकता है, “प्रभु उनके बीच हैं, जैसे वह सीनै पर पवित्रता में थे,” या “प्रभु सीनै से पवित्रस्थान में आए हैं।” “हज़ारों पर हज़ारों” के पीछे का इब्रानी शब्द भी दुर्लभ है और सम्भवतः पुनरावृत्ति या बहुलता का भाव देता है।
    reason: lexical_and_alternative_reading
lexical_decisions:
- source_word: רֶכֶב אֱלֹהִים
  choice: परमेश्वर के रथ
  rationale: רֶכֶב यहाँ सामूहिक रूप से रथों अथवा रथ-सेना को दर्शाता है; संबंधसूचक रचना को स्वाभाविक हिन्दी में अधिकार-संबंध के रूप में रखा गया है।
- source_word: רִבֹּתַיִם
  choice: असंख्य
  rationale: द्विवचन रूप का शाब्दिक अर्थ दो अयुत हो सकता है, पर काव्य में यह अत्यधिक विशाल संख्या का बोध कराता है; ‘असंख्य’ हिन्दी में उसी काव्यात्मक प्रचुरता को सहजता से व्यक्त करता है।
- source_word: אַלְפֵי שִׁנְאָן
  choice: हज़ारों पर हज़ारों
  rationale: दुर्लभ शब्द שִׁנְאָן संभवतः पुनरावृत्ति या बहुलता बताता है; यह अनुवाद अर्थ की सम्भावित दिशा देता है, जबकि अनिश्चितता पादटिप्पणी में बताई गई है।
- source_word: אֲדֹנָי
  choice: प्रभु
  rationale: यह परमेश्वर के लिए प्रयुक्त स्वामित्व और अधिकार का पद है; ‘प्रभु’ आधुनिक हिन्दी में संक्षिप्त, प्रतिष्ठित और प्रचलित समतुल्य है।
- source_word: בָם
  choice: उनके बीच
  rationale: בְּ + सर्वनाम प्रत्यय का अर्थ ‘उनमें/उनके बीच/उनके साथ’ हो सकता है; रथ-समूह के संदर्भ में ‘उनके बीच’ सर्वाधिक स्वाभाविक है।
- source_word: סִינַי בַּקֹּדֶשׁ
  choice: पवित्रता में सीनै
  rationale: मूल वाक्यांश अत्यन्त संक्षिप्त और व्याकरणतः कठिन है। शब्दक्रम को हिन्दी की काव्यात्मक संरचना में रखते हुए स्थान, तुलना या गति को स्पष्ट रूप से जोड़ने से बचा गया है।
theological_decisions:
- issue: אֲדֹנָי בָם סִינַי בַּקֹּדֶשׁ की संक्षिप्त और संदिग्ध रचना
  choice: प्रभु उनके बीच हैं—पवित्रता में सीनै
  alternative: प्रभु उनके बीच हैं, जैसे पवित्र सीनै पर; अथवा प्रभु सीनै से पवित्रस्थान में आए हैं
  rationale: इब्रानी में तुलना-सूचक ‘जैसे’ या गति-सूचक ‘से…आए’ स्पष्ट रूप से नहीं है। मुख्य पाठ मूल की काव्यात्मक कसावट और वास्तविक अस्पष्टता को सुरक्षित रखता है; सम्भव व्याख्याएँ पादटिप्पणी में दी गई हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण काव्यात्मक शैली रखी गई है। ‘हज़ारों पर हज़ारों’ सहज बहुलता व्यक्त करता है। अंतिम खंड को जानबूझकर संक्षिप्त रखा गया है, क्योंकि मूल इब्रानी की वाक्य-रचना अनिश्चित है; पाठक की सहायता के लिए प्रमुख विकल्प पादटिप्पणी में दिए गए हैं।
