  text: אֲדֹנָ֥/י יִתֶּן אֹ֑מֶר הַֽ֝/מְבַשְּׂר֗וֹת צָבָ֥א רָֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/011.yaml
  text: The Lord gives the word[c][b][a]; the women who announce the good news are a great host.
translation:
  language: hi
  text: प्रभु वचन देते हैं[a]; शुभ समाचार सुनानेवाली स्त्रियाँ एक विशाल दल हैं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “संदेश” अथवा “आदेश।”
    reason: lexical_alternative
  - marker: b
    text: इब्रानी पद का अर्थ “एक बड़ी सेना” या “एक विशाल जनसमूह” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי
  choice: प्रभु
  rationale: यहाँ אֲדֹנָי परमेश्वर की उपाधि है। ‘प्रभु’ आधुनिक हिन्दी में स्वाभाविक और प्रतिष्ठित रूप है तथा इसे יהוה के विशिष्ट अनुवाद के साथ नहीं मिलाता।
- source_word: יִתֶּן
  choice: देते हैं
  rationale: 'काव्य-संदर्भ में yiqtol का वर्तमानकालिक/प्रस्तुतिक अर्थ उपयुक्त है: प्रभु वचन देते हैं और घोषणा करनेवाली स्त्रियों का विशाल दल उसे प्रसारित करता है।'
- source_word: אֹמֶר
  choice: वचन
  rationale: אֹמֶר कथन, संदेश या आदेश को सूचित कर सकता है। ‘वचन’ मूल की संक्षिप्तता और व्यापकता बनाए रखता है; अन्य संभावनाएँ पादटिप्पणी में दी गई हैं।
- source_word: הַמְבַשְּׂרוֹת
  choice: शुभ समाचार सुनानेवाली स्त्रियाँ
  rationale: यह בשׂר का स्त्रीलिंग बहुवचन कृदंत है। अनुवाद स्त्रीलिंग को स्पष्ट रखता है और शुभ समाचार की घोषणा का अर्थ स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: צָבָא רָב
  choice: एक विशाल दल
  rationale: צָבָא सेना, समूह या दल हो सकता है और רָב उसकी बड़ी संख्या बताता है। ‘विशाल दल’ सामूहिक अर्थ को स्वाभाविक हिन्दी में रखता है, जबकि संभावित सैन्य बिंब पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: הַמְבַשְּׂרוֹת का स्त्रीलिंग बहुवचन
  choice: ‘शुभ समाचार सुनानेवाली स्त्रियाँ’ के रूप में स्पष्ट स्त्रीलिंग अनुवाद
  alternative: ‘समाचार सुनानेवाले’ या ‘संदेशवाहक’
  rationale: इब्रानी रूप व्याकरण की दृष्टि से स्पष्ट रूप से स्त्रीलिंग बहुवचन है। उसे लिंग-निरपेक्ष करना मूल पाठ की साहित्यिक विशेषता मिटा देगा; यह पाठगत निर्णय है, कोई अतिरिक्त सिद्धान्तगत दावा नहीं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सहज हिन्दी रखी गई है। ‘सुनानेवाली’ में स्त्रीलिंग बहुवचन को स्पष्ट किया गया है। ‘विशाल दल’ अनावश्यक रूप से सैन्य अर्थ निश्चित किए बिना צָבָא की सामूहिक शक्ति बनाए रखता है।
