  text: לָ֤/מָּה תְּֽרַצְּדוּ/ן֮ הָרִ֪ים גַּבְנֻ֫נִּ֥ים הָ/הָ֗ר חָמַ֣ד אֱלֹהִ֣ים לְ/שִׁבְתּ֑/וֹ אַף יְ֝הוָ֗ה יִשְׁכֹּ֥ן לָ/נֶֽצַח׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/016.yaml
  text: Why do you leap about[a], O many-peaked mountains, at the mountain God desired for his dwelling? Indeed, Yahweh will dwell there forever.
translation:
  language: hi
  text: हे अनेक चोटियोंवाले पहाड़ो, तुम उस पहाड़ को ईर्ष्या से क्यों देखते हो[a], जिसे परमेश्वर ने अपने निवास के लिए चाहा है? निश्चय ही यहोवा वहाँ सदा निवास करेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम क्यों उछलते-कूदते हो?” इब्रानी क्रिया दुर्लभ है और उसका अर्थ अनिश्चित है; यह उछलने-कूदने या ईर्ष्या अथवा टेढ़ी दृष्टि से देखने का भाव दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּרַצְּדוּן
  choice: ईर्ष्या से देखते हो
  rationale: यह क्रिया दुर्लभ और अर्थ की दृष्टि से अनिश्चित है। प्रसंग में दूसरे पहाड़ों और परमेश्वर के चाहे हुए पहाड़ के बीच विरोध है, इसलिए ईर्ष्यापूर्ण दृष्टि का भाव स्वाभाविक है; उछलने-कूदने का संभावित अर्थ पादटिप्पणी में रखा गया है।
- source_word: הָרִים גַּבְנֻנִּים
  choice: अनेक चोटियोंवाले पहाड़ो
  rationale: यह पद उभरी हुई पर्वत-शृंखलाओं, कूबड़नुमा ढलानों या अनेक शिखरों की छवि देता है। यह चयन केवल ‘ऊँचे’ कहने की अपेक्षा उस दृश्यात्मकता को अधिक सुरक्षित रखता है।
- source_word: הָהָר
  choice: उस पहाड़
  rationale: इब्रानी में निश्चित उपपद एक विशेष पहाड़ की ओर संकेत करता है, पर उसका नाम यहाँ नहीं दिया गया। इसलिए ‘सिय्योन’ जोड़ने के बजाय ‘उस पहाड़’ रखा गया है।
- source_word: חָמַד
  choice: चाहा है
  rationale: क्रिया इच्छा, अभिलाषा या प्रसन्नतापूर्वक चाहने का अर्थ देती है। ‘चाहा’ मूल के निकट है और ‘चुना’ जैसी अधिक व्याख्यात्मक अभिव्यक्ति से बचता है।
- source_word: לְשִׁבְתּוֹ
  choice: अपने निवास के लिए
  rationale: यह परमेश्वर के निवास करने के उद्देश्य अथवा स्थान को व्यक्त करता है। हिंदी में यह संक्षिप्त और स्वाभाविक है।
- source_word: אַף
  choice: निश्चय ही
  rationale: यहाँ अव्यय अगले कथन को बलपूर्वक पुष्ट करता है; ‘निश्चय ही’ उस जोर को स्पष्ट करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ में आए परमेश्वर के व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिंदी में प्रचलित लिप्यंतरण से प्रस्तुत किया गया है।
- source_word: יִשְׁכֹּן לָנֶצַח
  choice: वहाँ सदा निवास करेगा
  rationale: שׁכן बसने या निवास करने को और לָנֶצַח स्थायी अवधि को दर्शाता है। ‘वहाँ’ प्रसंग में उल्लिखित पहाड़ से स्वाभाविक रूप से ग्रहण किया गया है।
theological_decisions:
- issue: क्या पहाड़ को स्पष्ट रूप से सिय्योन कहा जाए
  choice: मुख्य पाठ में ‘उस पहाड़’ बनाए रखना
  alternative: ‘सिय्योन पर्वत’ कहना
  rationale: व्यापक भजन सिय्योन की ओर संकेत करता है, किंतु इस पद में स्वयं सामान्य संज्ञा ‘पहाड़’ ही है। मूल पाठ से अधिक विशिष्टता न जोड़ने के लिए उसका नाम नहीं दिया गया।
- issue: प्रतिद्वंद्वी पहाड़ों और परमेश्वर के चाहे हुए पहाड़ के बीच अलंकारिक विरोध
  choice: ‘ईर्ष्या से देखते हो’
  alternative: ‘उछलते-कूदते हो’ या ‘कूदते हो’
  rationale: दुर्लभ क्रिया का सटीक अर्थ अनिश्चित है। ईर्ष्यापूर्ण दृष्टि प्रसंग के विरोध को सहज हिंदी में व्यक्त करती है, जबकि गति-संबंधी संभावित अर्थ पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज शैली। संबोधन में ‘पहाड़ो’ और प्रश्नवाचक संरचना से मूल का काव्यात्मक मानवीकरण बनाए रखा गया है।
