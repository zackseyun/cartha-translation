  text: לָ֭/רֹכֵב בִּ/שְׁמֵ֣י שְׁמֵי קֶ֑דֶם הֵ֥ן יִתֵּ֥ן בְּ֝/קוֹל/וֹ ק֣וֹל עֹֽז־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/033.yaml
  text: to him who rides in the highest heavens[a], which are from ancient times—behold, he gives forth his voice[b], a mighty voice.
translation:
  language: hi
  text: उसके लिए, जो प्राचीनकाल के सर्वोच्च आकाशों में सवार है[a]—देखो, वह अपनी वाणी सुनाता है[b], सामर्थ्य की वाणी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “प्राचीनकाल के आकाशों के आकाश में।”
    reason: lexical_alternative
  - marker: b
    text: या, “वह अपनी वाणी निकालता है—सामर्थ्य की वाणी।”
    reason: lexical_alternative
lexical_decisions:
- source_word: לָ/רֹכֵב
  choice: उसके लिए, जो ... सवार है
  rationale: ל का संबंध पिछले पद की आज्ञा से है और रֹכֵב कर्तृवाचक कृदंत के रूप में परमेश्वर का वर्णन करता है; इसलिए पिछले संदर्भ से जुड़ा अप्रत्यक्ष कर्म रखा गया है।
- source_word: בִּ/שְׁמֵי שְׁמֵי קֶדֶם
  choice: प्राचीन काल से विद्यमान सर्वोच्च आकाशों में
  rationale: ‘आकाशों के आकाश’ इब्रानी अतिशयोक्ति है, जिसका स्वाभाविक हिन्दी रूप ‘सर्वोच्च आकाश’ है; קֶדֶם यहाँ स्थान नहीं, प्राचीन काल का बोध कराता है।
- source_word: הֵן
  choice: देखो
  rationale: यह ध्यान आकर्षित करने वाला काव्यात्मक अव्यय है; ‘देखो’ आधुनिक हिन्दी में उसका बल सहज रूप से बनाए रखता है।
- source_word: יִתֵּן בְּ/קוֹל/וֹ
  choice: वह अपनी वाणी बुलंद करता है
  rationale: शाब्दिक रूप ‘अपनी आवाज़ देता है’ है, पर נתן קול बोलने अथवा आवाज़ निकालने का मुहावरा है; ‘वाणी बुलंद करता है’ उसका काव्यात्मक और स्वाभाविक अर्थ देता है।
- source_word: קוֹל עֹז
  choice: एक सामर्थी वाणी
  rationale: इसका शाब्दिक अर्थ ‘सामर्थ्य की वाणी’ है; ‘सामर्थी वाणी’ संक्षिप्त रहते हुए उसकी शक्ति को व्यक्त करती है।
theological_decisions:
- issue: सवार का संदर्भ
  choice: आसपास के संदर्भ के अनुसार यह इस्राएल के परमेश्वर का वर्णन है, पर पद में नाम जोड़कर स्पष्ट नहीं किया गया।
  alternative: बाद की मसीही व्याख्या इस दिव्य सवार की छवि को मसीहा से जोड़ सकती है।
  rationale: इब्रानी पाठ तत्काल संदर्भ में परमेश्वर की महिमामय काव्यात्मक छवि प्रस्तुत करता है; अनुवाद को बाद की विशिष्ट पहचान मुख्य पाठ में नहीं जोड़नी चाहिए।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और काव्यात्मक हिन्दी रखी गई है। पद पिछले पद की आज्ञा से जुड़ता है, इसलिए आरंभ में ‘उसके लिए’ रखा गया है। ‘आकाशों के आकाश’ की इब्रानी अतिशयोक्ति को मुख्य पाठ में स्वाभाविक हिन्दी दी गई और शाब्दिक संरचना पाद-टिप्पणी में सुरक्षित रखी गई है।
