base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/006.yaml
  text: God settles the solitary in a home; he brings out prisoners into prosperity[a], but the rebellious dwell in a parched land.
translation:
  language: hi
  text: परमेश्वर अकेले लोगों को घर में बसाता है; वह बन्दियों को निकालकर समृद्धि में ले आता है[a], परन्तु विद्रोही सूखी भूमि में रहते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘बहुतायत में’; इस दुर्लभ इब्रानी शब्द का अर्थ कुछ विद्वान ‘गाते हुए’ अथवा आनन्दपूर्ण रिहाई बताने वाला कोई अन्य भाव भी समझते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: यहाँ इस्राएल के परमेश्वर के लिए सामान्य पद है; आगे के एकवचन कृदन्त भी एकवचन अर्थ की पुष्टि करते हैं।
- source_word: מוֹשִׁיב
  choice: बसाता है
  rationale: ישׁב के हिफ़ील कृदन्त का कारक भाव, अर्थात किसी को रहने या बसने देना, स्वाभाविक हिन्दी में सुरक्षित रहता है।
- source_word: יְחִידִים
  choice: अकेले लोगों को
  rationale: यह शब्द अकेले या अलग-थलग पड़े व्यक्तियों को दर्शाता है; यह चयन केवल भावनात्मक अकेलेपन तक अर्थ को सीमित नहीं करता।
- source_word: בַּיְתָה
  choice: घर में
  rationale: בַּיִת का अर्थ घर या गृहस्थी हो सकता है। ‘घर में’ मूल बिंब को बनाए रखते हुए आश्रय और अपनत्व दोनों का संकेत देता है।
- source_word: מוֹצִיא
  choice: निकाल लाता है
  rationale: יצא के हिफ़ील कृदन्त का अर्थ बाहर निकालना है; यह समानान्तर पंक्ति में परमेश्वर की सक्रिय मुक्ति को स्पष्ट करता है।
- source_word: אֲסִירִים
  choice: बन्दियों को
  rationale: यह बँधे हुए या कैद व्यक्तियों को सूचित करता है; ‘बन्दी’ आधुनिक हिन्दी में स्पष्ट और गरिमापूर्ण है।
- source_word: בַּכּוֹשָׁרוֹת
  choice: समृद्धि में
  rationale: यह दुर्लभ बहुवचन शब्द अनिश्चित है। इसे सफलता, कुशलता या सम्पन्न दशा से जोड़ना सकारात्मक समानान्तरता के अनुकूल है; अन्य सम्भावनाएँ पादटिप्पणी में सुरक्षित हैं।
- source_word: אַךְ
  choice: परन्तु
  rationale: यह परमेश्वर की उपकारी क्रिया और विद्रोहियों की दशा के बीच तीखा विरोध प्रकट करता है।
- source_word: סוֹרֲרִים
  choice: विद्रोही
  rationale: סרר का कृदन्त हठपूर्वक विरोध या विद्रोह करने वालों को दर्शाता है।
- source_word: שָׁכְנוּ
  choice: रहते हैं
  rationale: שכן का पूर्ण रूप काव्यात्मक, सामान्य सत्य के रूप में प्रयुक्त है; हिन्दी वर्तमान काल इस भाव को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: צְחִיחָה
  choice: सूखी भूमि में
  rationale: यह संज्ञा सूखेपन या निर्जल स्थान को दर्शाती है; ‘सूखी भूमि’ घर और समृद्धि के विपरीत मूल बिंब को स्पष्ट रखती है।
theological_decisions:
- issue: अकेले लोगों के प्रति परमेश्वर की क्रिया का आशय
  choice: परमेश्वर अलग-थलग पड़े लोगों को घर और स्थिर निवास देता है।
  alternative: परमेश्वर अकेले व्यक्तियों को परिवारों में रखता है।
  rationale: इब्रानी पाठ में सीधे ‘अकेले लोग’ और ‘घर’ कहा गया है। ‘परिवारों में’ एक सम्भव व्याख्या है, पर ‘घर में’ मूल एकवचन संज्ञा और उसके व्यापक अर्थ को बिना अनावश्यक संकीर्णता के बनाए रखता है।
- issue: בַּכּוֹשָׁרוֹת का दुर्लभ और अनिश्चित अर्थ
  choice: समृद्धि में
  alternative: बहुतायत में; गाते हुए; आनन्दपूर्ण रिहाई को व्यक्त करने वाला कोई अन्य पद
  rationale: सकारात्मक सन्दर्भ में कुशलता या सम्पन्न दशा का अर्थ सम्भावित है, किन्तु शब्द की दुर्लभता के कारण गायन अथवा आनन्दपूर्ण मुक्ति से जुड़ी व्याख्या को पादटिप्पणी में खुला रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और काव्यात्मक रूप रखा गया है। ‘बसाता है’, ‘बन्दियों’ और ‘सूखी भूमि’ से मूल समानान्तरता स्पष्ट रहती है; दुर्लभ शब्द की वास्तविक अनिश्चितता पादटिप्पणी में सुरक्षित है।
