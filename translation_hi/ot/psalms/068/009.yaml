lexical_decisions:
- source_word: גֶּשֶׁם נְדָבוֹת
  choice: उदारता से वर्षा
  rationale: यह इब्रानी पदबंध शाब्दिक रूप से स्वेच्छा या उदारता से जुड़ा है और यहाँ परमेश्वर द्वारा खुले हाथ से दी गई भरपूर वर्षा का भाव व्यक्त करता है। हिंदी में यह रूप उस उदार प्रबंध को बनाए रखता है।
- source_word: תָּנִיף
  choice: आपने … बरसाई
  rationale: נוּף के हिफ़ील रूप का मूल भाव हिलाने या झाड़ने का हो सकता है; वर्षा के साथ प्रयुक्त होने पर इसका आशय वर्षा को बरसाना है।
- source_word: אֱלֹהִים
  choice: हे परमेश्वर
  rationale: यहाँ सीधा संबोधन है; ‘हे परमेश्वर’ हिंदी में स्वाभाविक और गरिमापूर्ण काव्यात्मक संबोधन है।
- source_word: נַחֲלָתְךָ
  choice: आपकी विरासत
  rationale: यह शब्द विरासत या आवंटित निज भाग को दर्शाता है और काव्य में परमेश्वर की प्रजा, भूमि अथवा दोनों का संकेत दे सकता है; ‘विरासत’ इस व्यापकता को सुरक्षित रखती है।
- source_word: וְנִלְאָה
  choice: जब … थक गई थी
  rationale: स्त्रीलिंग एकवचन रूप ‘विरासत’ से मेल खाता है और थक जाने या निढाल होने की दशा बताता है। प्रसंगगत संबंध को स्वाभाविक हिंदी में ‘जब’ से व्यक्त किया गया है।
- source_word: כּוֹנַנְתָּהּ
  choice: आपने उसे दृढ़ किया
  rationale: כּוּן का अर्थ स्थापित करना, स्थिर करना या दृढ़ करना है। ‘दृढ़ किया’ भूमि या प्रजा—दोनों संभावित संदर्भों के अनुकूल है और मूल क्रिया का केंद्रीय भाव रखता है।
theological_decisions:
- issue: ‘आपकी विरासत’ का संदर्भ
  choice: ‘आपकी विरासत’ को बिना संकुचित किए बनाए रखा गया
  alternative: इस्राएल की भूमि; इस्राएल की प्रजा; या दोनों
  rationale: इब्रानी काव्य में यह पद परमेश्वर की भूमि, उनकी प्रजा अथवा दोनों को एक साथ संकेत कर सकता है। किसी एक अर्थ को चुनने के बजाय मूल की सार्थक अस्पष्टता सुरक्षित रखी गई है।
