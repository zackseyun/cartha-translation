  text: हे परमेश्वर, आपने भरपूर वर्षा बरसाई[a]; जब आपकी विरासत थक गई थी[b], तब आपने उसे स्थिर किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उदार वर्षा” अथवा “उदारता की वर्षा”; इब्रानी पदबंध मुहावरेदार है और परमेश्वर के उदार प्रबंध पर बल देता है।
