  text: עָ֘לִ֤יתָ לַ/מָּר֨וֹם שָׁ֘בִ֤יתָ שֶּׁ֗בִי לָקַ֣חְתָּ מַ֭תָּנוֹת בָּ/אָדָ֑ם וְ/אַ֥ף ס֝וֹרְרִ֗ים לִ/שְׁכֹּ֤ן יָ֬הּ אֱלֹהִֽים׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/018.yaml
  text: You ascended on high[a]; you led captivity captive; you received gifts among men, even among the rebellious[b], so that Yah God might dwell there.
translation:
  language: hi
  text: आप ऊँचाई पर चढ़े; आपने बंदियों को बंदी बनाकर ले गए; आपने मनुष्यों के बीच[a] भेंटें लीं—हाँ, विद्रोहियों के बीच भी—ताकि याह परमेश्वर वहाँ निवास करे।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मनुष्यों से भेंटें लीं।” इब्रानी पूर्वसर्ग का अर्थ यहाँ “के बीच” अथवा “से” हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “ताकि याह परमेश्वर उनके बीच निवास करे”; अथवा “याह परमेश्वर के निवास के लिए।” इब्रानी का अंतिम वाक्यांश संक्षिप्त है और उसकी रचना एक से अधिक प्रकार से समझी जा सकती है।
    reason: alternative_reading
lexical_decisions:
- source_word: עָלִיתָ לַמָּרוֹם
  choice: आप ऊँचे स्थान पर चढ़े
  rationale: क्रिया עלה की ऊपर जाने की गति और מָרוֹם के ऊँचे अथवा उन्नत स्थान, दोनों को स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: שָׁבִיתָ שֶּׁבִי
  choice: आपने बंदियों को बंदी बनाकर ले चले
  rationale: इब्रानी की सजातीय रचना और विजय-यात्रा के भाव को बनाए रखता है; केवल ‘बंदी बनाए’ कहने की तुलना में मूल की आलंकारिक पुनरुक्ति अधिक स्पष्ट रहती है।
- source_word: לָקַחְתָּ מַתָּנוֹת
  choice: आपने ... भेंटें लीं
  rationale: לקח का सीधा अर्थ ‘लेना’ है और מַתָּנוֹת भेंटों को दर्शाता है। ‘प्राप्त कीं’ भी संभव है, पर ‘लीं’ मूल क्रिया के अधिक निकट है।
- source_word: בָּאָדָם
  choice: मनुष्यों के बीच से
  rationale: בְּ के क्षेत्रगत अर्थ ‘के बीच’ और संभावित स्रोतार्थ ‘से’ को हिन्दी की एक स्वाभाविक, किंतु जानबूझकर खुली, अभिव्यक्ति में साथ रखता है। स्पष्ट वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: וְאַף סוֹרְרִים
  choice: हाँ, विद्रोहियों से भी
  rationale: וְאַף के बलाघात और סוֹרְרִים के हठपूर्वक विरोध करने वाले लोगों के अर्थ को संक्षेप और स्पष्टता से व्यक्त करता है।
- source_word: לִשְׁכֹּן יָהּ אֱלֹהִים
  choice: ताकि याह परमेश्वर वहाँ निवास करे
  rationale: לִשְׁכֹּן को प्रयोजनसूचक मानते हुए संक्षिप्त मूल वाक्य को सुबोध हिन्दी बनाता है। ‘वहाँ’ निहित स्थान को व्यक्त करता है, पर उसके ठीक संदर्भ को निश्चित नहीं करता।
- source_word: יָהּ אֱלֹהִים
  choice: याह परमेश्वर
  rationale: יָהּ को पूर्ण चतुरक्षरीय नाम से अलग उसके संक्षिप्त रूप ‘याह’ के रूप में रखता है और אֱלֹהִים के लिए सामान्य, गरिमापूर्ण ‘परमेश्वर’ देता है।
theological_decisions:
- issue: בָּאָדָם में पूर्वसर्ग की दिशा और अर्थ
  choice: मनुष्यों के बीच से
  alternative: मनुष्यों से
  rationale: इब्रानी בְּ यहाँ क्षेत्र (‘बीच’) या स्रोत (‘से’) का संकेत दे सकता है। मुख्य पाठ दोनों संभावनाओं को अनावश्यक रूप से बंद नहीं करता और पादटिप्पणी स्रोतार्थ को स्पष्ट रखती है।
- issue: अंतिम वाक्यांश לִשְׁכֹּן יָהּ אֱלֹהִים की संक्षिप्त वाक्यरचना
  choice: ताकि याह परमेश्वर वहाँ निवास करे
  alternative: ताकि याह परमेश्वर उनके बीच निवास करे; अथवा याह परमेश्वर के निवास के लिए
  rationale: मूल में निवास का स्थान या संबंध स्पष्ट रूप से व्यक्त नहीं है। ‘वहाँ’ सुबोधता देता है, जबकि पादटिप्पणी प्रमुख वैकल्पिक संरचनाओं और धर्मवैचारिक तनाव को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण काव्यात्मक रूप अपनाया गया है। आदरसूचक ‘आप’ ईश्वर को संबोधित करता है। ‘बंदियों को बंदी बनाकर’ मूल की प्रभावपूर्ण पुनरुक्ति को बचाता है; ‘याह’ संक्षिप्त दिव्य नाम को लिप्यंतरित करता है।
