  text: Nobles shall come from Egypt[b][a]; Cush shall quickly stretch out its hands to God.
translation:
  language: hi
  text: मिस्र से प्रतिष्ठित लोग आएँगे[a]; कूश शीघ्रता से अपने हाथ परमेश्वर की ओर बढ़ाएगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘प्रतिष्ठित लोग’ के स्थान पर ‘दूत’ या ‘राजकुमार’ भी संभव है। दुर्लभ इब्रानी शब्द संभवतः मिस्र के प्रमुख लोगों को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘कूश शीघ्रता से उसके हाथ परमेश्वर की ओर बढ़ाएगा।’ इब्रानी में ‘हाथों’ के साथ पुल्लिंग एकवचन अधिकारवाचक प्रत्यय है; कूश राष्ट्र को व्यक्तिरूप में एकवचन माना गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶאֱתָיוּ
  choice: आएँगे
  rationale: यह क्रिया यहाँ आने या पहुँचने का सामान्य अर्थ देती है; भेंट लाने का भाव संदर्भ से संभव है, पर क्रिया में स्वयं स्पष्ट नहीं है।
- source_word: חַשְׁמַנִּים
  choice: प्रतिष्ठित लोग
  rationale: यह दुर्लभ संज्ञा संभवतः ऊँचे पद या प्रतिष्ठा वाले लोगों को दर्शाती है। यह अनुवाद 'दूत' या 'राजकुमार' जैसी अधिक विशिष्ट पहचान आरोपित नहीं करता।
- source_word: מִנִּי מִצְרָיִם
  choice: मिस्र से
  rationale: पूर्वसर्ग स्थान-स्रोत को दर्शाता है; आधुनिक हिन्दी में यह स्वाभाविक अभिव्यक्ति है।
- source_word: כּוּשׁ
  choice: कूश
  rationale: मूल इब्रानी स्थान-नाम को सुरक्षित रखा गया है; इसे बाद के भौगोलिक नाम 'इथियोपिया' से नहीं बदला गया।
- source_word: תָּרִיץ
  choice: बढ़ाने में फुर्ती करेगा
  rationale: हिफ़ील रूप में शीघ्रता या दौड़ाने का भाव है। 'हाथ' के साथ यह अपने हाथ शीघ्रता से आगे बढ़ाने की क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יָדָיו
  choice: अपने हाथ
  rationale: प्रत्यय पुल्लिंग एकवचन है और व्यक्तिरूप में प्रस्तुत एकवचन राष्ट्र 'कूश' से मेल खाता है। हिन्दी में 'अपने' इस संबंध को सहज रूप से बनाए रखता है।
- source_word: לֵאלֹהִים
  choice: परमेश्वर की ओर
  rationale: पूर्वसर्ग दिशा को दर्शाता है। 'की ओर' हाथ बढ़ाने के भाव को स्पष्ट रखते हुए प्रार्थना, विनती या आराधना में से किसी एक को अनिवार्य नहीं करता।
theological_decisions:
- issue: कूश के परमेश्वर की ओर हाथ बढ़ाने का अभिप्राय
  choice: परमेश्वर की ओर उन्मुख समर्पण, प्रार्थना, विनती या आराधना का खुला संकेत
  alternative: विशेष रूप से राजनयिक भेंट चढ़ाना, राजनीतिक अधीनता, या पूर्ण वाचा-समावेश की निश्चित भविष्यवाणी
  rationale: हाथ बढ़ाने का मुहावरा प्रार्थना, विनती, समर्पण या आराधना का संकेत हो सकता है। मूल पाठ इनमें से किसी एक अर्थ को स्पष्ट रूप से सीमित नहीं करता, इसलिए अनुवाद इस धर्मवैचारिक व्यापकता को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। 'प्रतिष्ठित लोग' दुर्लभ पद की अनिश्चितता को बचाता है; 'फुर्ती करेगा' मूल क्रिया की शीघ्रता व्यक्त करता है। सभी पादटिप्पणी चिह्न मुख्य पाठ में दिए गए हैं।
