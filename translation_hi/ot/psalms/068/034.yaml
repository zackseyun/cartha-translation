  yaml_path: translation/ot/psalms/068/034.yaml
  text: Ascribe strength to God[a]; his majesty is over Israel[b], and his strength is in the skies.
translation:
  language: hi
  text: परमेश्वर को सामर्थ्य का श्रेय दो[a]; उसकी महिमा इस्राएल के ऊपर है, और उसकी सामर्थ्य आकाशमंडल में है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “परमेश्वर को सामर्थ्य दो”; यहाँ इसका भाव उसकी सामर्थ्य को स्वीकार करना या उसे श्रेय देना है।
    reason: lexical_alternative
  - marker: b
    text: या “बादलों में” अथवा “स्वर्गीय ऊँचाइयों में”।
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּנוּ
  choice: मानो
  rationale: क्रिया का मूल अर्थ ‘दो’ है, पर यहाँ सामर्थ्य जैसी अमूर्त वस्तु परमेश्वर को देने का काव्यात्मक आदेश उसकी सामर्थ्य को स्वीकार करने या उसका गुणगान करने के अर्थ में है। ‘मानो’ इस भाव को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: עֹז
  choice: सामर्थ्य
  rationale: यह शब्द बल, शक्ति या सामर्थ्य को दर्शाता है। ‘सामर्थ्य’ स्तुति-काव्य के गरिमापूर्ण भाव के अनुकूल है और पद में इसकी पुनरावृत्ति बनाए रखता है।
- source_word: לֵאלֹהִים
  choice: परमेश्वर की
  rationale: हिन्दी में ‘सामर्थ्य को मानो’ के साथ स्वाभाविक वाक्य-विन्यास के लिए इब्रानी के अप्रत्यक्ष कर्म को संबंधसूचक रूप में व्यक्त किया गया है।
- source_word: עַל יִשְׂרָאֵל
  choice: इस्राएल के ऊपर
  rationale: עַל यहाँ प्रताप के इस्राएल के ऊपर प्रकट या विस्तृत होने का स्थानिक अथवा प्रभुत्व-संबंधी भाव रखता है; ‘के ऊपर’ उस वास्तविक अस्पष्टता को सुरक्षित रखता है।
- source_word: גַּאֲוָתוֹ
  choice: उसका प्रताप
  rationale: इस संदर्भ में संज्ञा घमंड नहीं, बल्कि परमेश्वर की ऊँचाई, महिमा या राजसी भव्यता को दर्शाती है। ‘प्रताप’ स्तोत्र की भाषा में स्वाभाविक और गरिमापूर्ण है।
- source_word: וְעֻזּוֹ
  choice: और उसकी सामर्थ्य
  rationale: आरंभ में आए עֹז के साथ काव्यात्मक संबंध बनाए रखने के लिए उसी हिन्दी शब्द की पुनरावृत्ति की गई है।
- source_word: בַּשְּׁחָקִים
  choice: आकाशमंडल में
  rationale: काव्यात्मक बहुवचन ऊपरी आकाश, मेघों या स्वर्गीय ऊँचाइयों को सूचित कर सकता है। ‘आकाशमंडल’ व्यापक आकाशीय चित्र को रखता है, जबकि विकल्प पादटिप्पणी में दिए गए हैं।
theological_decisions:
- issue: क्या मनुष्य सचमुच परमेश्वर को सामर्थ्य देते हैं
  choice: मुहावरे को ‘परमेश्वर की सामर्थ्य को मानो’ के रूप में प्रस्तुत करना
  alternative: ‘परमेश्वर को सामर्थ्य दो’
  rationale: इब्रानी आदेश का शाब्दिक रूप ‘दो’ है, पर स्तुति के संदर्भ में यह उपासकों से परमेश्वर की सामर्थ्य स्वीकार करने और घोषित करने को कहता है; इसका आशय यह नहीं कि परमेश्वर में सामर्थ्य की कमी है जिसे मनुष्य पूरा करते हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण काव्यात्मक शैली रखी गई है। ‘सामर्थ्य’ की पुनरावृत्ति इब्रानी समानांतरता को सुरक्षित रखती है। दोनों पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
