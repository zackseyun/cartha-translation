  text: שִׁ֤ירוּ לֵֽ/אלֹהִים֮ זַמְּר֪וּ שְׁ֫מ֥/וֹ סֹ֡לּוּ לָ/רֹכֵ֣ב בָּ֭/עֲרָבוֹת בְּ/יָ֥הּ שְׁמ֗/וֹ וְ/עִלְז֥וּ לְ/פָנָֽי/ו׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/004.yaml
  text: Sing to God[a]; sing praise to his name. Lift up a song for the one who rides through the deserts; Yah is his name[b]; exult before him.
translation:
  language: hi
  text: परमेश्वर के लिए गाओ; उसके नाम का गुणगान करो। उजाड़ मैदानों[b] में सवार होकर चलनेवाले के लिए मार्ग तैयार करो[a]; उसका नाम याह है; उसके सामने आनंद से झूमो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘सवार होकर चलनेवाले का गुणगान करो।’ इब्रानी क्रिया का अर्थ मार्ग को ऊँचा करके बनाना या तैयार करना भी हो सकता है।
    reason: alternative_reading
  - marker: b
    text: या, ‘बादलों पर सवार होकर चलनेवाले के लिए।’ कुछ व्याख्याकार यहाँ परमेश्वर के प्रकट होने की छवि देखते हैं, यद्यपि इब्रानी शब्द का सामान्य अर्थ ‘उजाड़ मैदान’ या ‘मरुस्थलीय प्रदेश’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁירוּ לֵאלֹהִים
  choice: परमेश्वर के लिए गाओ
  rationale: बहुवचन आज्ञार्थक क्रिया שׁיר का सीधा अर्थ ‘गाओ’ है। इस संदर्भ में אֱלֹהִים इस्राएल के परमेश्वर को सूचित करता है।
- source_word: זַמְּרוּ שְׁמוֹ
  choice: उसके नाम का गुणगान करो
  rationale: זמר स्तुति के प्रसंग में गाकर या संगीत के साथ प्रशंसा करने को व्यक्त करता है। ‘नाम का गुणगान’ स्वाभाविक हिन्दी में भाव और स्पष्ट कर्म दोनों को बनाए रखता है।
- source_word: סֹלּוּ
  choice: मार्ग तैयार करो
  rationale: סלל का मूल चित्र मार्ग को ऊँचा करने या तैयार करने का है। यहाँ निहित कर्म ‘मार्ग’ जोड़ने से हिन्दी स्पष्ट रहती है और इब्रानी मार्ग-निर्माण की छवि सुरक्षित रहती है।
- source_word: לָרֹכֵב בָּעֲרָבוֹת
  choice: उजाड़ मैदानों में सवारी करनेवाले के लिए
  rationale: רכב का कृदन्त रूप सवारी करनेवाले को दर्शाता है। עֲרָבוֹת का सामान्य अर्थ शुष्क, खुले मैदान या मरुस्थलीय प्रदेश है; ‘उजाड़ मैदान’ इसी अर्थ को सहज हिन्दी में व्यक्त करता है।
- source_word: בְּיָהּ שְׁמוֹ
  choice: उसका नाम याह है
  rationale: יָהּ परमेश्वर के व्यक्तिगत नाम का संक्षिप्त रूप है; इसलिए इसे उपाधि से बदलने के बजाय ‘याह’ के रूप में लिप्यंतरित किया गया है।
- source_word: וְעִלְזוּ לְפָנָיו
  choice: उसके सामने आनंद से झूमो
  rationale: עלז प्रबल और उल्लासपूर्ण आनंद व्यक्त करता है। ‘आनंद से झूमो’ आज्ञार्थक और उत्सवी स्वर को स्वाभाविक हिन्दी में बनाए रखता है।
theological_decisions:
- issue: संक्षिप्त दिव्य नाम יָהּ का अनुवाद
  choice: याह
  alternative: प्रभु
  rationale: मूल पाठ में יְהוָה नहीं, उसका विशिष्ट संक्षिप्त रूप יָהּ है। लिप्यंतरण इस भेद को सुरक्षित रखता है और नाम को उपाधि में नहीं बदलता।
- issue: בָּעֲרָבוֹת की दिव्य-सवारी वाली छवि
  choice: उजाड़ मैदानों में
  alternative: बादलों पर
  rationale: शब्द का सामान्य इब्रानी अर्थ मरुस्थलीय या स्तेपीय मैदान है, जो भजन के निर्जन प्रदेश से होकर परमेश्वर के चलने के प्रसंग के अनुकूल है। ‘बादलों पर’ एक सम्भव ईश्वर-प्राकट्य संबंधी व्याख्या है, पर मूल शब्द का कम प्रत्यक्ष अर्थ है; इसलिए उसे पाद-टिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामूहिक उपासना के लिए सहज रखी गई है। ‘याह’ को नाम के रूप में सुरक्षित रखा गया है। पाद-टिप्पणी चिह्नों को उन्हीं पदांशों के बाद रखा गया है जिनसे उनकी वैकल्पिक व्याख्याएँ संबंधित हैं।
