  text: קִדְּמ֣וּ שָׁ֭רִים אַחַ֣ר נֹגְנִ֑ים בְּ/ת֥וֹךְ עֲ֝לָמ֗וֹת תּוֹפֵפֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/025.yaml
  text: The singers went before[a], the musicians after[b], in the midst of young women beating tambourines.
translation:
  language: hi
  text: गायक आगे-आगे चले, वादक पीछे-पीछे, और बीच में डफ बजाती युवतियाँ थीं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קִדְּמוּ
  choice: आगे-आगे चले
  rationale: क्रिया קדם के पिएल रूप से जुलूस में सबसे आगे बढ़ने का भाव प्रकट होता है; यह हिंदी प्रयोग उस गतिशील और क्रमबद्ध दृश्य को स्वाभाविक रूप से व्यक्त करता है।
- source_word: שָׁרִים
  choice: गायक
  rationale: यह שׁיר (‘गाना’) से बना रूप है और समानांतर पद ‘वादक’ के साथ गायकों को दर्शाता है, न कि ‘हाकिमों’ या ‘राजकुमारों’ को।
- source_word: אַחַר
  choice: पीछे-पीछे
  rationale: यह जुलूस में स्थान और क्रम दोनों बताता है; ‘पीछे-पीछे’ पहले खंड के ‘आगे-आगे’ के साथ काव्यात्मक समानांतरता रखता है।
- source_word: נֹגְנִים
  choice: वादक
  rationale: נגן वाद्य बजाने वालों को दर्शाता है; ‘वादक’ संक्षिप्त, आधुनिक और ‘गायक’ के समानांतर है।
- source_word: בְּתוֹךְ
  choice: बीच में
  rationale: यह जुलूस के मध्य भाग में युवतियों की स्थिति का स्थानिक चित्र बनाए रखता है।
- source_word: עֲלָמוֹת
  choice: युवतियाँ
  rationale: शब्द विवाह-योग्य आयु की जवान स्त्रियों को सूचित करता है; ‘युवतियाँ’ आधुनिक हिंदी में स्वाभाविक है और ‘कुँवारियाँ’ कहकर अर्थ को अनावश्यक रूप से सीमित नहीं करता।
- source_word: תּוֹפֵפוֹת
  choice: डफ बजाती
  rationale: यह תֹּף से संबंधित स्त्रीलिंग बहुवचन रूप है और हाथ से बजाए जाने वाले ताल-वाद्य को बजाने की क्रिया बताता है; ‘डफ बजाती’ क्रिया और वाद्य दोनों को स्पष्ट रखता है।
