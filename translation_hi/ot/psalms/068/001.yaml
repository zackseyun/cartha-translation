  yaml_path: translation/ot/psalms/068/001.yaml
  text: God rises up; his enemies are scattered[a], and those who hate him flee from before him.
translation:
  language: hi
  text: परमेश्वर उठ खड़ा होता है; उसके शत्रु तितर-बितर हो जाते हैं,[a] और उससे घृणा करनेवाले उसके सामने से भाग जाते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, पारम्परिक कामनार्थक अनुवाद के अनुसार: “परमेश्वर उठ खड़ा हो; उसके शत्रु तितर-बितर हो जाएँ, और उससे घृणा करनेवाले उसके सामने से भाग जाएँ।”'
    reason: alternative_reading
lexical_decisions:
- source_word: יָקוּם
  choice: उठ खड़ा होता है
  rationale: קום के काल-अपूर्ण रूप की सजीव घोषणात्मक शक्ति और उठने की क्रिया-छवि को स्वाभाविक हिन्दी में व्यक्त करता है; प्रार्थनात्मक अर्थ की सम्भावना पादटिप्पणी में रखी गई है।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: बहुवचन रूप होने पर भी यहाँ एकवचन क्रिया के साथ इस्राएल के परमेश्वर के लिए प्रयुक्त है; इसलिए एकवचन सम्मानसूचक नाम उपयुक्त है।
- source_word: יָפוּצוּ
  choice: तितर-बितर हो जाते हैं
  rationale: פוץ के परिणामसूचक भाव को सहज हिन्दी में व्यक्त करता है और काव्यात्मक समानांतरता बनाए रखता है।
- source_word: אֹיְבָיו
  choice: उसके शत्रु
  rationale: सम्बन्धसूचक रूप और तृतीय पुरुष एकवचन प्रत्यय का सीधा और स्वाभाविक अनुवाद।
- source_word: וְיָנוּסוּ
  choice: और ... भाग जाते हैं
  rationale: נוס के पलायन के अर्थ को सामान्य पाठक के लिए स्पष्ट, वर्तमान और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: מְשַׂנְאָיו
  choice: उससे घृणा करनेवाले
  rationale: संज्ञा की तरह प्रयुक्त कृदन्त की सक्रिय क्रियात्मक शक्ति को बनाए रखता है।
- source_word: מִפָּנָיו
  choice: उसके सामने से
  rationale: शाब्दिक 'उसके मुख/उपस्थिति से' के स्थानिक और उपस्थिति-सूचक दोनों भावों को स्वाभाविक हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: काव्यात्मक, युद्ध-दर्शन संदर्भ में आरम्भिक अपूर्ण क्रियाओं का बल
  choice: 'सजीव घोषणात्मक वर्तमान: “परमेश्वर उठ खड़ा होता है; उसके शत्रु तितर-बितर हो जाते हैं...”'
  alternative: 'कामनार्थक/प्रार्थनात्मक: “परमेश्वर उठ खड़ा हो; उसके शत्रु तितर-बितर हो जाएँ...”'
  rationale: इब्रानी अपूर्ण रूप इस संदर्भ में सजीव घोषणा अथवा इच्छा/प्रार्थना—दोनों के रूप में समझे जा सकते हैं। मुख्य पाठ घोषणात्मक अर्थ देता है, जबकि वास्तविक कामनार्थक सम्भावना पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण काव्यात्मक शैली। “उठ खड़ा होता है” मूल क्रिया की सजीवता रखता है; “तितर-बितर” व्यापक रूप से समझा जाने वाला काव्यात्मक पद है। पादटिप्पणी-चिह्न [a] मुख्य पाठ में सम्बन्धित खण्ड के तुरन्त बाद दिया गया है।
