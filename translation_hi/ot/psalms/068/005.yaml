  text: אֲבִ֣י יְ֭תוֹמִים וְ/דַיַּ֣ן אַלְמָנ֑וֹת אֱ֝לֹהִ֗ים בִּ/מְע֥וֹן קָדְשֽׁ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/005.yaml
  text: God is a father of the fatherless and a judge of widows in his holy dwelling[a][b][c].
translation:
  language: hi
  text: परमेश्वर अपने पवित्र निवास में अनाथों का पिता और विधवाओं का न्याय करने वाला है[a][b][c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘पितृहीनों का’; इब्रानी शब्द विशेष रूप से पिता से वंचित बच्चों को दर्शा सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘विधवाओं का रक्षक’; इब्रानी शब्द अधिक शाब्दिक रूप से न्याय करने या न्याय का प्रशासन करने वाले को दर्शाता है।
    reason: lexical_alternative
  - marker: c
    text: या ‘अपने पवित्र निवास से’; कुछ अनुवाद इस पदबंध को उस स्थान के रूप में लेते हैं जहाँ से परमेश्वर कार्य करता है, यद्यपि इब्रानी संबंधबोधक उपसर्ग का शाब्दिक अर्थ ‘में’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲבִי
  choice: पिता
  rationale: यह אָב का संबंधवाचक रूप है और आगे आए אֱלֹהִים के साथ क्रियारहित वाक्य में विधेय का काम करता है; ‘अनाथों का पिता’ हिन्दी में स्वाभाविक रहते हुए मूल संबंध को बनाए रखता है।
- source_word: יְתוֹמִים
  choice: अनाथों
  rationale: यह उन बच्चों को दर्शाता है जो पिता से वंचित हैं। आधुनिक हिन्दी में ‘अनाथ’ सामान्य और सुबोध शब्द है; फुटनोट में अधिक शाब्दिक ‘पितृहीनों’ दिया गया है।
- source_word: דַיַּן
  choice: न्यायी
  rationale: यह संज्ञा न्याय करने या न्याय दिलाने वाले व्यक्ति को दर्शाती है। ‘न्यायी’ मूल की न्यायिक छवि को बनाए रखता है, जबकि ‘रक्षक’ उसके आशय को अधिक व्याख्यात्मक ढंग से व्यक्त करता।
- source_word: אַלְמָנוֹת
  choice: विधवाओं
  rationale: यह पति-विहीन स्त्रियों के लिए प्रयुक्त सामान्य बहुवचन संज्ञा है; ‘विधवाएँ’ इसका सटीक और प्रचलित हिन्दी समतुल्य है।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: यहाँ यह रूप एकवचन अर्थ में क्रियारहित वाक्य का कर्ता है। ‘परमेश्वर’ आधुनिक हिन्दी बाइबलीय भाषा में स्वाभाविक और गरिमापूर्ण है।
- source_word: בִּמְעוֹן
  choice: निवास में
  rationale: מָעוֹן निवास-स्थान को और उपसर्ग ב सामान्यतः ‘में’ को दर्शाता है। इसलिए मूल के स्थानवाचक भाव को रखा गया है, न कि उसे मुख्य पाठ में ‘से’ बनाया गया।
- source_word: קָדְשׁוֹ
  choice: अपने पवित्र
  rationale: शाब्दिक रूप से ‘उसकी पवित्रता’ संबंधात्मक प्रयोग में מָעוֹן को विशेषित करती है, इसलिए स्वाभाविक हिन्दी में ‘अपने पवित्र निवास’ उपयुक्त है।
theological_decisions:
- issue: דַיַּן को न्यायिक पद के रूप में रखा जाए या संरक्षणात्मक अर्थ में खोला जाए
  choice: विधवाओं का न्यायी
  alternative: विधवाओं का रक्षक / विधवाओं को न्याय दिलानेवाला
  rationale: मूल शब्द का प्रत्यक्ष अर्थ न्याय करने या न्याय का प्रशासन करने वाले से जुड़ा है। ‘न्यायी’ कानूनी बिंब और उसकी अंतर्निहित सुरक्षा—दोनों की गुंजाइश रखता है, बिना उसे केवल पक्षसमर्थक या रक्षक बना देने के।
- issue: בִּמְעוֹן קָדְשׁוֹ को स्थान (‘में’) माना जाए या कार्य के स्रोत (‘से’) के रूप में व्यक्त किया जाए
  choice: अपने पवित्र निवास में
  alternative: अपने पवित्र निवास से
  rationale: इब्रानी उपसर्ग ב का सीधा स्थानवाचक अर्थ ‘में’ है। ‘से’ परमेश्वर के कार्य करने के स्थान को स्पष्ट कर सकता है, पर वह मूल पदबंध की अपेक्षा अधिक व्याख्यात्मक है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सुबोध, गरिमापूर्ण और काव्यात्मक संक्षिप्त रूप। ‘अनाथ’ सामान्य पाठक के लिए सहज है; ‘न्यायी’ कुछ ऊँचे बाइबलीय रजिस्टर का शब्द होते हुए भी समझने योग्य है और मूल की न्यायिक संज्ञा को ‘न्यायाधीश’ की संभावित दंडात्मक संकीर्णता से बेहतर ढंग से सुरक्षित रखता है।
