translation:
  language: hi
  text: यरूशलेम के ऊपर स्थित आपके मंदिर से[a][c], राजा आपके पास भेंट[b] लाएँगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यरूशलेम में आपके मंदिर के कारण राजा आपके पास उपहार लाएँगे।”
    reason: alternative_reading
  - marker: b
    text: “भेंट” का अनुवाद “उपहार” या “नज़राना” भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: या, “यरूशलेम में स्थित।”
    reason: alternative_reading
lexical_decisions:
- source_word: מֵהֵיכָלֶךָ
  choice: आपके मन्दिर से
  rationale: מִן का मूल स्थानवाचक अर्थ ‘से’ बनाए रखा गया है और הֵיכָל का इस प्रसंग में स्वाभाविक अर्थ ‘मन्दिर’ है। कारणवाचक अर्थ भी सम्भव है, इसलिए उसे पादटिप्पणी में दिया गया है।
- source_word: עַל יְרוּשָׁלִָם
  choice: यरूशलेम के ऊपर स्थित
  rationale: עַל के ‘ऊपर’ अर्थ को सुरक्षित रखते हुए ‘स्थित’ जोड़ने से आधुनिक हिन्दी में यह स्पष्ट होता है कि मन्दिर नगर से ऊँचाई पर स्थित है, न कि हवा में उसके ऊपर। ‘यरूशलेम में’ सम्भव अधिक सहज विकल्प है।
- source_word: לְךָ
  choice: आपके पास
  rationale: यह दत्तिव सर्वनाम भेंट पाने वाले को सूचित करता है। ‘लाएँगे’ के साथ ‘आपके पास’ स्वाभाविक हिन्दी है; ‘आपके लिए’ भी सम्भव है।
- source_word: יוֹבִילוּ
  choice: लाएँगे
  rationale: יבל के हिफ़ील रूप का यहाँ अर्थ किसी वस्तु को लाना या पहुँचाना है।
- source_word: מְלָכִים
  choice: राजा
  rationale: यह बहुवचन संज्ञा सीधे राजाओं को सूचित करती है और राजकीय बिम्ब को बनाए रखती है।
- source_word: שַׁי
  choice: भेंट
  rationale: שַׁי किसी श्रेष्ठ व्यक्ति को दी जाने वाली भेंट, उपहार या नज़राने को सूचित करता है। ‘भेंट’ धार्मिक और सम्मानसूचक दोनों भावों को सहज हिन्दी में व्यक्त करती है।
theological_decisions:
- issue: मन्दिर-वाक्यांश का यरूशलेम और राजाओं की भेंट से सम्बन्ध
  choice: मुख्य पाठ में मन्दिर को यरूशलेम के ऊपर स्थित बताया गया है और מִן का स्थानवाचक अर्थ ‘से’ रखा गया है।
  alternative: ‘यरूशलेम में आपके मन्दिर के कारण राजा आपके पास भेंट लाएँगे।’
  rationale: इब्रानी में מִן को स्थानवाचक या कारणवाचक और עַל को ‘ऊपर’ अथवा व्यापक स्थानवाचक अर्थ में समझा जा सकता है। मुख्य पाठ मूल पूर्वसर्गों का अधिक प्रत्यक्ष रूप सुरक्षित रखता है, जबकि पादटिप्पणियाँ वास्तविक वैकल्पिक अर्थ देती हैं और किसी विशेष धार्मिक व्याख्या को निश्चित नहीं करतीं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘मन्दिर’, ‘राजा’ और ‘भेंट’ परिचित शब्द हैं। ‘ऊपर स्थित’ इब्रानी के स्थानवाचक बल को रखते हुए हिन्दी में सम्भावित भ्रम घटाता है।
