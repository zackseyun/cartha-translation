lexical_decisions:
- source_word: וְצַדִּיקִים
  choice: परन्तु धर्मी
  rationale: צַדִּיקִים धर्मी लोगों को दर्शाता है। आरम्भिक וְ सामान्यतः ‘और’ हो सकता है, पर पिछले पद में दुष्टों के विनाश के साथ यहाँ का विरोध ‘परन्तु’ से स्वाभाविक रूप में व्यक्त होता है।
- source_word: יִשְׂמְחוּ
  choice: आनन्दित होंगे
  rationale: שׂמח प्रसन्नता और आनन्द व्यक्त करता है। ‘आनन्दित होंगे’ भविष्यसूचक रूप और पहले आनन्द-सूचक क्रियापद को स्पष्ट रखता है।
- source_word: יַעַלְצוּ
  choice: हर्ष से झूम उठेंगे
  rationale: עלץ प्रबल, उल्लासपूर्ण आनन्द व्यक्त करता है। ‘हर्ष से झूम उठेंगे’ आधुनिक हिन्दी में उसकी तीव्रता को स्वाभाविक ढंग से दर्शाता है।
- source_word: לִפְנֵי אֱלֹהִים
  choice: परमेश्वर के सामने
  rationale: यह पदबंध शाब्दिक रूप से परमेश्वर के मुख या उपस्थिति के सामने होने का भाव देता है। ‘परमेश्वर के सामने’ संक्षिप्त और स्वाभाविक है।
- source_word: וְיָשִׂישׂוּ
  choice: और ... मगन होंगे
  rationale: שׂוש अत्यन्त आनन्दित होने को व्यक्त करता है। ‘मगन होंगे’ निकटवर्ती आनन्द-सूचक शब्दों से कुछ भिन्नता बनाए रखते हुए उल्लास का भाव देता है।
- source_word: בְשִׂמְחָה
  choice: बड़े आनन्द से
  rationale: בְשִׂמְחָה आनन्द मनाने की रीति या तीव्रता बताता है। ‘बड़े आनन्द से’ हिब्रू में आनन्द-सूचक शब्दों के संचय और बल को सहज हिन्दी में व्यक्त करता है।
