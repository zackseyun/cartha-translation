source:
  edition: WLC
  text: גְּעַ֨ר חַיַּ֪ת קָנֶ֡ה עֲדַ֤ת אַבִּירִ֨ים בְּ/עֶגְלֵ֬י עַמִּ֗ים מִתְרַפֵּ֥ס בְּ/רַצֵּי כָ֑סֶף בִּזַּ֥ר עַ֝מִּ֗ים קְרָב֥וֹת יֶחְפָּֽצוּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/030.yaml
  text: Rebuke the beast of the reeds[a], the herd of bulls among the calves of the peoples, trampling on pieces of silver[b]. Scatter the peoples who delight in wars.
translation:
  language: hi
  text: 'सरकंडों के पशु को फटकार,


    जातियों के बछड़ों के बीच साँड़ों के झुंड को,


    जो चाँदी के टुकड़ों पर रौंदता हुआ है।


    उन जातियों को तितर-बितर कर दे जो युद्धों में आनंद लेते हैं।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גְּעַר
  choice: डाँट
  rationale: आज्ञार्थक क्रिया परमेश्वर की ऐसी प्रबल फटकार व्यक्त करती है जो शत्रु शक्तियों को दबा देती है; ‘डाँट’ विनाश का अतिरिक्त अर्थ जोड़े बिना मूल बल बनाए रखती है।
- source_word: חַיַּת קָנֶה
  choice: सरकंडों के पशु
  rationale: शाब्दिक सरकंडे/दलदली वनस्पति से जुड़े खतरनाक पशु का बिंब सुरक्षित रखा गया है; मुख्य पाठ इसे मिस्र या किसी विशिष्ट साम्राज्य के रूप में स्पष्ट नहीं करता।
- source_word: עֲדַת אַבִּירִים
  choice: साँड़ों के झुंड
  rationale: पशु-बिंब के संदर्भ में עֲדָה को सामूहिक झुंड और אַבִּירִים को बलवान साँड़ समझना रूपक की निरंतरता बनाए रखता है।
- source_word: בְּעֶגְלֵי עַמִּים
  choice: बछड़ों जैसे जनसमूहों के बीच
  rationale: בְּ को स्थान/संगति के अर्थ में और עֶגְלֵי को ‘बछड़े’ लिया गया है। हिन्दी में ‘जैसे’ यह स्पष्ट करता है कि जनसमूहों का वर्णन पशु-रूपक में हो रहा है, न कि वे शाब्दिक बछड़े हैं।
- source_word: מִתְרַפֵּס
  choice: रौंदता है
  rationale: रूप विवादित है। हिंसक पशु-बिंब और युद्ध चाहने वाले लोगों के संदर्भ में ‘रौंदता है’ मुख्य पाठ में संगत है; आत्मसमर्पण/दण्डवत करने वाला पाठांतर पादटिप्पणी में रखा गया है।
- source_word: בְּרַצֵּי כָסֶף
  choice: चाँदी के टुकड़ों को
  rationale: רַצֵּי अस्पष्ट है और टुकड़े, खंड या छड़ें सूचित कर सकता है। ‘चाँदी के टुकड़े’ आर्थिक बिंब को बिना अत्यधिक विशिष्ट किए सुरक्षित रखता है।
- source_word: בִּזַּר
  choice: तितर-बितर कर दे
  rationale: रूप पूर्णकाल जैसा बिंदित है, पर काव्य-संदर्भ में आरंभिक आज्ञार्थक के समानांतर विनती के रूप में समझा गया है।
- source_word: עַמִּים
  choice: जनसमूहों
  rationale: ‘जनसमूह’ עַמִּים के बहुवचन और सामुदायिक अर्थ को रखता है तथा आधुनिक हिन्दी में स्वाभाविक है।
- source_word: קְרָבוֹת יֶחְפָּצוּ
  choice: जो युद्धों से प्रसन्न होते हैं
  rationale: यह युद्ध में निरंतर रुचि और आनंद को व्यक्त करता है; बहुवचन ‘युद्धों’ मूल रूप को प्रतिबिंबित करता है।
theological_decisions:
- issue: क्या ‘सरकंडों के पशु’ को स्पष्ट रूप से मिस्र या किसी अन्य ऐतिहासिक शक्ति के रूप में पहचाना जाए
  choice: मुख्य पाठ में रूपक को बिना स्पष्ट ऐतिहासिक पहचान के रखा गया
  alternative: इसे विशेष रूप से मिस्र अथवा सामान्य शत्रु साम्राज्य कहना
  rationale: दलदली/सरकंडों का बिंब मिस्र की ओर संकेत कर सकता है, पर इब्रानी पद यहाँ किसी देश का नाम नहीं लेता; अतः वास्तविक संकेत की संभावना पादटिप्पणी में रखी गई है।
- issue: क्या מִתְרַפֵּס शत्रुतापूर्ण रौंदने या अधीन होकर भेंट चढ़ाने को बताता है
  choice: मुख्य पाठ में ‘रौंदता है’
  alternative: चाँदी देकर अधीन होना या चाँदी की छड़ों के साथ दण्डवत करना
  rationale: शब्द कठिन और विवादित है। हिंसक पशु तथा युद्धप्रिय लोगों के तत्काल संदर्भ से शत्रुतापूर्ण अर्थ संभव है, लेकिन कर/भेंट देकर अधीन होने का अर्थ भी प्राचीन पाठ की गंभीर संभावना है और पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, प्रार्थनात्मक और सहज शैली रखी गई है। मूल पशु-बिंब को बनाए रखते हुए ‘बछड़ों जैसे जनसमूहों’ में हिन्दी की स्पष्टता के लिए ‘जैसे’ जोड़ा गया है। कठिन इब्रानी उपवाक्य की अनिश्चितता पादटिप्पणी में स्पष्ट रूप से सुरक्षित है।
