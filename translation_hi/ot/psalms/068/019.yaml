  text: Blessed be the Lord[a], who day by day bears us up—God is our salvation. Selah
translation:
  language: hi
  text: 'धन्य हो प्रभु,

    जो दिन-प्रतिदिन हमें संभाले रहता है[a]—

    परमेश्वर हमारा उद्धार है।

    सेला'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी वाक्यांश संक्षिप्त है और क्रिया का कर्म स्पष्ट नहीं है। इसका अर्थ ‘हर दिन हमारे लिए भार उठाता है’ भी हो सकता है। परम्परागत अनुवाद है, ‘वह हमें भलाई से लादता है’; किन्तु मूल पाठ में ‘भलाई’ शब्द नहीं है।
    reason: alternative_reading
lexical_decisions:
- source_word: בָּרוּךְ
  choice: धन्य है
  rationale: यह कर्मवाचक कृदन्त स्तुतिपरक आशीर्वचन में प्रयुक्त है। ‘धन्य है’ उसके स्तुतिपूर्ण भाव को स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: אֲדֹנָי
  choice: प्रभु
  rationale: यह परमेश्वर के प्रभुत्व को व्यक्त करने वाली उपाधि है; हिन्दी बाइबलीय भाषा में ‘प्रभु’ स्पष्ट और स्वाभाविक है।
- source_word: יוֹם יוֹם
  choice: दिन-प्रतिदिन
  rationale: शब्द की पुनरावृत्ति निरन्तरता और प्रत्येक दिन का भाव देती है; ‘दिन-प्रतिदिन’ उस रूप और बल दोनों को बनाए रखता है।
- source_word: יַעֲמָס לָנוּ
  choice: हमारा भार उठाता है
  rationale: עמס का मूल बिम्ब भार लादने या ढोने का है। वाक्य में कर्म स्पष्ट नहीं है; मुख्य पाठ में ‘हमारा भार’ सन्दर्भानुकूल और सहज है, जबकि अनिश्चितता पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: הָאֵל
  choice: परमेश्वर
  rationale: אֵל यहाँ इस्राएल के परमेश्वर का सामान्य दैवी पदनाम है। ‘परमेश्वर’ आधुनिक मानक हिन्दी में स्वाभाविक है और अनावश्यक रूप से ‘वह परमेश्वर’ नहीं जोड़ता।
- source_word: יְשׁוּעָתֵנוּ
  choice: हमारा उद्धार
  rationale: यह संज्ञा बचाव, छुटकारे और उद्धार की व्यापक धारणा रखती है; ‘हमारा उद्धार’ उस व्यापकता को बनाए रखता है।
- source_word: סֶלָה
  choice: सेला
  rationale: इस संगीतात्मक या पाठ-संकेतक शब्द का ठीक अर्थ अनिश्चित है, इसलिए परम्परागत लिप्यन्तरण रखा गया है।
theological_decisions:
- issue: יַעֲמָס לָנוּ में अनुल्लिखित कर्म
  choice: परमेश्वर प्रतिदिन अपने लोगों का भार उठाता है।
  alternative: परमेश्वर प्रतिदिन हमें संभाले रहता है; अथवा परमेश्वर प्रतिदिन हमें भलाई से लादता है।
  rationale: इब्रानी क्रिया भार लादने या उठाने का बिम्ब देती है, पर उसका कर्म स्पष्ट रूप से नहीं लिखा गया। ‘हमारा भार उठाता है’ सहायक और धारण करने वाले परमेश्वर का भाव व्यक्त करता है, जबकि पादटिप्पणी अन्य सम्भव समझों को खुला रखती है और ‘भलाई’ को मूल पाठ में अनावश्यक रूप से नहीं जोड़ती।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, काव्यात्मक और स्तुतिपरक शैली रखी गई है। पंक्ति-विभाजन इब्रानी समान्तरता को उभारता है। ‘सेला’ को अर्थ की अनिश्चितता के कारण अनूदित नहीं किया गया।
