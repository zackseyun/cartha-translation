  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: מַמְלְכ֣וֹת הָ֭/אָרֶץ שִׁ֣ירוּ לֵ/אלֹהִ֑ים זַמְּר֖וּ אֲדֹנָ֣/י סֶֽלָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/032.yaml
  text: Kingdoms of the earth[a], sing to God; sing praises to the Lord—Selah
translation:
  language: hi
  text: 'हे पृथ्वी के राज्यो, परमेश्वर के लिए गाओ;

    प्रभु का स्तुतिगान करो[a]—सेला।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘प्रभु के लिए संगीत बजाओ।’
    reason: इब्रानी क्रिया זמר संगीत के साथ स्तुति करने को व्यक्त कर सकती है; संदर्भ के अनुसार इसमें गाना या वाद्य बजाना दोनों सम्मिलित हो सकते हैं।
lexical_decisions:
- source_word: מַמְלְכוֹת הָאָרֶץ
  choice: पृथ्वी के राज्यो
  rationale: यह संबोधन पृथ्वी भर के राजनीतिक राज्यों को सामूहिक रूप से पुकारता है। ‘पृथ्वी’ सार्वभौमिक दायरे को व्यक्त करती है, और ‘राज्यो’ संबोधन-रूप है।
- source_word: שִׁירוּ לֵאלֹהִים
  choice: परमेश्वर के लिए गाओ
  rationale: बहुवचन आज्ञार्थक क्रिया को सीधी पुकार के रूप में रखा गया है; ל गीत के प्राप्तकर्ता अथवा जिसके सम्मान में गीत गाया जाए, उसे सूचित करता है।
- source_word: זַמְּרוּ
  choice: स्तुतिगान करो
  rationale: पिएल आज्ञार्थक रूप संगीतपूर्ण प्रशंसा का भाव देता है। ‘स्तुतिगान करो’ हिंदी में गायन और आराधनापूर्ण प्रशंसा दोनों को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: אֲדֹנָי
  choice: प्रभु
  rationale: यह इब्रानी उपाधि अֲדֹנָי है, परमेश्वर का नाम יהוה नहीं; इसलिए इसे उपाधि ‘प्रभु’ के रूप में अनूदित किया गया है।
- source_word: סֶלָה
  choice: सेला
  rationale: इस उपासना-संबंधी अथवा संगीत-संबंधी संकेत का सटीक अर्थ अनिश्चित है, इसलिए व्याख्या थोपने के बजाय इसका लिप्यंतरण रखा गया है।
theological_decisions:
- issue: अֲדֹנָי का अनुवाद
  choice: प्रभु
  alternative: यहोवा
  rationale: मूल पाठ में अֲדֹנָי है, יהוה नहीं। अतः ईश्वरीय उपाधि का अनुवाद ‘प्रभु’ किया गया है और उसे परमेश्वर के विशिष्ट नाम के रूप में नहीं प्रस्तुत किया गया।
- issue: לֵאלֹהִים में ל का संबंध
  choice: परमेश्वर के लिए गाओ
  alternative: परमेश्वर को गाओ
  rationale: यह संबंध गीत के लक्ष्य अथवा सम्मानित प्राप्तकर्ता को सूचित कर सकता है। ‘के लिए’ सहज आधुनिक हिंदी है और मूल के संबंध को संकीर्ण रूप से निर्धारित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामूहिक उपासना के अनुकूल रखी गई है। ‘हे’ संबोधन को स्पष्ट करता है; पंक्ति-विभाजन पद की समानांतर काव्य-रचना दिखाता है।
