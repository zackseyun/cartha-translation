  yaml_path: translation/ot/psalms/068/014.yaml
  text: When the Almighty scattered kings there, it snowed on Zalmon.
translation:
  language: hi
  text: जब सर्वशक्तिमान ने वहाँ राजाओं को तितर-बितर किया, तब ज़ल्मोन पर हिमपात हुआ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שַׁדַּי
  choice: सर्वशक्तिमान
  rationale: यह शद्दाय के लिए प्रचलित और अर्थपूर्ण हिन्दी उपाधि है।
- source_word: בְּפָרֵשׂ
  choice: जब ... तितर-बितर किया
  rationale: क्रिया פרשׂ यहाँ राजाओं को फैलाने अथवा तितर-बितर करने के अर्थ में है; कालगत उपवाक्य प्रसंग के अनुकूल है।
- source_word: בָּהּ
  choice: वहाँ
  rationale: स्त्रीलिंग सर्वनाम का सटीक पूर्वपद इस पद में स्पष्ट नहीं है; स्थानवाचक 'वहाँ' मूल की संदर्भगत अस्पष्टता को बिना कृत्रिम व्याख्या के बनाए रखता है।
- source_word: תַּשְׁלֵג
  choice: हिमपात हुआ
  rationale: शाब्दिक हिम-संबंधी बिंब को बनाए रखते हुए यह आधुनिक हिन्दी में स्वाभाविक अकर्मक अभिव्यक्ति है।
- source_word: בְּצַלְמוֹן
  choice: सल्मोन पर
  rationale: צלמון को स्थाननाम मानकर लिप्यंतरित किया गया है; בְ को इस स्थल पर घटित हिमपात के लिए 'पर' से व्यक्त किया गया है।
theological_decisions:
- issue: हिमपात को रूपक या ऐतिहासिक घटना मानना
  choice: 'अव्याख्यायित शाब्दिक बिंब: ''हिमपात हुआ'''
  alternative: भूमि हड्डियों या लूट से हिम जैसी सफेद हो गई
  rationale: इब्रानी पाठ स्वयं रूपक का आशय स्पष्ट नहीं करता; अनुवाद को किसी विशिष्ट व्याख्या को पाठ में नहीं जोड़ना चाहिए।
- issue: בָּהּ का संदर्भ
  choice: वहाँ
  alternative: उसमें / उस देश में
  rationale: पूर्वपद अनिश्चित होने के कारण 'वहाँ' काव्यात्मक संदर्भ को स्वाभाविक रूप से व्यक्त करता है और अनावश्यक निश्चितता से बचता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, काव्यात्मक और गरिमापूर्ण शैली। 'बर्फ पड़ी' की तुलना में 'हिमपात हुआ' भजन की उच्च काव्यात्मक भाषा के अधिक अनुकूल है।
