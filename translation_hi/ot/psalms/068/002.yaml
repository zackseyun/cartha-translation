  yaml_path: translation/ot/psalms/068/002.yaml
  text: As smoke is driven away[a], so you drive them away; as wax melts before fire[c][b], so the wicked perish before God.
translation:
  language: hi
  text: जैसे धुआँ उड़ जाता है[a], वैसे ही तू उन्हें उड़ा देता है; जैसे मोम आग के सामने पिघल जाता है[b][c], वैसे ही दुष्ट परमेश्वर के सामने नाश हो जाते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “जैसे धुआँ तितर-बितर किया जाता है”; इब्रानी क्रिया का अर्थ उड़ाया जाना, बिखरना या दूर हो जाना हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से “आग के सामने से” और “परमेश्वर के सामने से”; यह मुहावरा किसी की उपस्थिति में या उसके कारण होने का भाव दे सकता है।
    reason: lexical_alternative
  - marker: c
    text: इब्रानी की अपूर्ण क्रियाओं को भविष्यकाल (“तू उड़ा देगा ... नाश हो जाएँगे”) या इस संदर्भ में इच्छासूचक भाव में भी समझा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: כְּ/הִנְדֹּף עָשָׁן
  choice: जैसे धुआँ उड़ जाता है
  rationale: כ के तुलनात्मक बल और נדף के उड़ाए जाने, तितर-बितर होने या उड़ जाने के अर्थ को स्वाभाविक हिन्दी उपमा में व्यक्त करता है।
- source_word: תִּנְדֹּף
  choice: तू उन्हें उड़ा देता है
  rationale: यह क़ाल अपूर्ण 2 पुल्लिंग एकवचन है और परमेश्वर को सीधे संबोधित करता है। हिन्दी में बहुवचन ‘उन्हें’ आगामी ‘दुष्टों’ को स्पष्ट रूप से ग्रहण करता है, जबकि धुएँ की उपमा बनी रहती है।
- source_word: כְּ/הִמֵּס דּוֹנַג
  choice: जैसे मोम ... पिघल जाता है
  rationale: כ और क्रियार्थक रूप से आरम्भ हुई तुलना को सहज आधुनिक हिन्दी में finite clause के रूप में रखा गया है।
- source_word: מִ/פְּנֵי אֵשׁ
  choice: आग के सामने
  rationale: מִפְּנֵי का शाब्दिक स्थानिक बिंब ‘सामने/उपस्थिति में’ सुरक्षित रहता है और आग के कारण पिघलने का आशय संदर्भ से स्पष्ट है।
- source_word: יֹאבְדוּ
  choice: नाश हो जाते हैं
  rationale: אבד का अर्थ नष्ट या लुप्त होना है। ‘नाश हो जाते हैं’ काव्यात्मक समानांतरता को बनाए रखता है और विनाश की रीति को अनावश्यक रूप से निर्दिष्ट नहीं करता।
- source_word: רְשָׁעִים
  choice: दुष्ट
  rationale: यह दुष्ट व्यक्तियों की नैतिक श्रेणी का संक्षिप्त और प्रचलित हिन्दी रूप है।
- source_word: מִ/פְּנֵי אֱלֹהִים
  choice: परमेश्वर के सामने
  rationale: मूल के ‘मुख/उपस्थिति के सामने से’ वाले मुहावरे और ईश्वरीय उपस्थिति के बिंब को स्वाभाविक हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: काव्यात्मक संदर्भ में अपूर्ण क्रियाओं का काल और भाव
  choice: 'सामान्य वर्तमान: ‘उड़ा देता है ... नाश हो जाते हैं’'
  alternative: 'भविष्य: ‘उड़ा देगा ... नाश हो जाएँगे’; या इच्छासूचक: ‘उड़ा दे ... नाश हो जाएँ’'
  rationale: इब्रानी काव्य में अपूर्ण रूप भविष्य, सामान्य/अभ्यस्त क्रिया या इच्छासूचक भाव व्यक्त कर सकते हैं। सामान्य वर्तमान जीवंत तुलना को बनाए रखता है और भविष्यवाणी अथवा शापात्मक इच्छा में से किसी एक को अनावश्यक रूप से निर्णायक नहीं बनाता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण काव्यात्मक शैली रखी गई है। भजन के प्रत्यक्ष संबोधन को बनाए रखने के लिए ‘तू’ चुना गया है; यह यहाँ अनादर नहीं, बल्कि पारंपरिक निकट और सीधा ईश-संबोधन है।
