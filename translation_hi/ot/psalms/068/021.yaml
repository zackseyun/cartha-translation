id: PSA.68.21
reference: Psalms 68:21
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אַךְ אֱלֹהִ֗ים יִמְחַץ֮ רֹ֤אשׁ אֹ֫יְבָ֥י/ו קָדְקֹ֥ד שֵׂעָ֑ר מִ֝תְהַלֵּ֗ךְ בַּ/אֲשָׁמָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/021.yaml
  text: Surely God will crush the head of his enemies[a], the hairy crown of the one who walks in his guilt.
translation:
  language: hi
  text: निश्चय ही परमेश्वर अपने शत्रुओं का सिर कुचल देगा—उस व्यक्ति के सिर का बालों से ढका ऊपरी भाग, जो अपने दोष में चलता रहता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַךְ
  choice: निश्चय ही
  rationale: यहाँ यह शब्द प्रतिबंध नहीं, बल्कि कथन की निश्चितता और प्रबलता व्यक्त करता है।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: एकवचन क्रिया और प्रसंग इस्राएल के परमेश्वर की ओर संकेत करते हैं; आधुनिक हिन्दी बाइबलीय शैली में ‘परमेश्वर’ स्वाभाविक है।
- source_word: יִמְחַץ
  choice: कुचल देगा
  rationale: क्रिया हिंसक रूप से चूर करने या कुचलने का बोध देती है; यह चयन न्याय की सशक्त शारीरिक छवि बनाए रखता है।
- source_word: רֹאשׁ אֹיְבָיו
  choice: अपने शत्रुओं का सिर
  rationale: मूल की ठोस शारीरिक छवि और बहुवचन संबंधवाचक प्रत्यय दोनों सुरक्षित हैं; हिन्दी में कर्ता की ओर लौटते संबंध के लिए ‘अपने’ स्वाभाविक है।
- source_word: קָדְקֹד שֵׂעָר
  choice: बालों से ढकी खोपड़ी
  rationale: קָדְקֹד सिर के ऊपरी भाग अथवा खोपड़ी को और שֵׂעָר बालों से युक्त होने को दर्शाता है। यह हिन्दी में सजीव और सुबोध है, यद्यपि ‘सिर का बालों वाला ऊपरी भाग’ भी संभव है।
- source_word: מִתְהַלֵּךְ
  choice: चलता रहता है
  rationale: हित्पएल कृदंत निरंतर या अभ्यस्त चाल-चलन का भाव देता है; ‘रहता है’ इस जारी आचरण को व्यक्त करता है।
- source_word: בַּאֲשָׁמָיו
  choice: अपने अपराधों में
  rationale: यह रूप दोष के साथ-साथ दोषपूर्ण कृत्यों या अपराधों को भी दर्शा सकता है और बहुवचन प्रत्यययुक्त रूप है; चाल-चलन के प्रसंग में ‘अपराधों में’ स्वाभाविक है।
theological_decisions:
- issue: ‘अपने शत्रुओं’ में सर्वनाम का संदर्भ
  choice: ‘अपने’ का संदर्भ परमेश्वर से माना गया है।
  alternative: इसे व्यापक रूप से ईश्वरीय राजा या परमेश्वर की प्रजा के शत्रुओं से संबंधित समझा जा सकता है।
  rationale: तत्काल कर्ता אֱלֹהִים है और क्रिया एकवचन है, इसलिए प्रत्यय का सबसे निकट और स्वाभाविक पूर्वपद परमेश्वर है; पद किसी अधिक संकीर्ण मसीही या राष्ट्रीय पहचान को स्पष्ट नहीं करता।
- issue: בַּאֲשָׁמָיו का अर्थ
  choice: ‘अपने अपराधों में’ द्वारा निरंतर दोषपूर्ण आचरण व्यक्त किया गया है।
  alternative: ‘अपने दोष में’ या ‘अपने अपराध करते हुए।’
  rationale: संज्ञा दोष और दोषपूर्ण कृत्य दोनों अर्थ दे सकती है। चलते रहने वाले व्यक्ति का वर्णन होने के कारण आचरण का अर्थ उपयुक्त है, पर पादटिप्पणी में अमूर्त ‘दोष’ की संभावना सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘कुचल देगा’ मूल की कठोर न्याय-छवि को नरम नहीं करता। लंबा डैश समानांतर काव्यात्मक चित्र—शत्रुओं का सिर और दोष में चलते व्यक्ति की खोपड़ी—को स्पष्ट करता है।
