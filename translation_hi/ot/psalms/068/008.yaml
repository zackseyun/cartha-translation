  yaml_path: translation/ot/psalms/068/008.yaml
  text: The earth quaked; even the heavens dripped before God—this Sinai—before God, the God of Israel.
translation:
  language: hi
  text: धरती काँप उठी; आकाश भी परमेश्वर के सामने टपक पड़ा—यह सीनै[a]—परमेश्वर के सामने, इस्राएल के परमेश्वर के सामने।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल पाठ में शाब्दिक रूप से “यह सीनै”; इसका अर्थ “सीनै भी” या “सीनै पर्वत स्वयं” समझा जा सकता है।
    reason: हिब्रू अभिव्यक्ति की वास्तविक संक्षिप्तता और संभावित अर्थों को सुरक्षित रखने के लिए।
lexical_decisions:
- source_word: רָעָשָׁה
  choice: काँप उठी
  rationale: यह क्रिया धरती के हिलने या काँपने को व्यक्त करती है; ‘काँप उठी’ काव्यात्मक तीव्रता को स्वाभाविक हिन्दी में रखती है।
- source_word: נָטְפוּ
  choice: टपक पड़ा
  rationale: मूल क्रिया का आधारभूत अर्थ ‘टपकना/बूँदें गिराना’ है। ‘बरस पड़ा’ अधिक व्याख्यात्मक होता; इसलिए मूल बिंब बनाए रखने के लिए ‘टपक पड़ा’ चुना गया।
- source_word: מִפְּנֵי
  choice: के सामने
  rationale: यहाँ परमेश्वर की उपस्थिति के सम्मुख होने का भाव है। ‘के सामने’ मूल पुनरावृत्ति को स्पष्ट और स्वाभाविक रूप में बनाए रखता है।
- source_word: זֶה סִינַי
  choice: यह सीनै
  rationale: मसोराई पाठ की संक्षिप्त और कुछ हद तक असामान्य अभिव्यक्ति को बिना चुपचाप विस्तार दिए यथासंभव ज्यों का त्यों रखा गया है।
theological_decisions:
- issue: ‘यह सीनै’ का संबंध और आशय
  choice: मुख्य पाठ में ‘यह सीनै’ की संक्षिप्तता बनाए रखी गई।
  alternative: ‘सीनै भी’ या ‘सीनै पर्वत भी’
  rationale: हिब्रू वाक्यांश זֶה סִינַי व्याकरणिक रूप से संक्षिप्त है और उसका सटीक संबंध विवादित हो सकता है। किसी एक व्याख्या को मुख्य पाठ में निर्णायक बनाना उचित नहीं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक रखी गई है। ‘टपक पड़ा’ सामान्य गद्य की अपेक्षा अधिक चित्रात्मक है, पर मूल हिब्रू बिंब को सुरक्षित रखता है। परमेश्वर के सामने होने की पुनरावृत्ति जानबूझकर बनाए रखी गई है।
