base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/007.yaml
  text: God[a], when you went out before your people, when you marched through the wilderness—Selah
translation:
  language: hi
  text: हे परमेश्वर, जब तू अपनी प्रजा के आगे निकला, जब तू निर्जन प्रदेश[a] से होकर चला—सेला।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘निर्जन प्रदेश’ का अनुवाद ‘रेगिस्तान’ या ‘उजाड़ भूमि’ भी हो सकता है। इब्रानी शब्द किसी सुनसान, उजाड़ भूभाग को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהִים
  choice: हे परमेश्वर
  rationale: पद के आरम्भ में यह सीधे संबोधन के रूप में है। आधुनिक गरिमापूर्ण हिन्दी में संबोधन स्पष्ट करने के लिए ‘हे’ जोड़ा गया; ‘परमेश्वर’ सामान्य और स्वाभाविक दैवी संबोधन है।
- source_word: בְּצֵאתְךָ
  choice: जब तू ... निकला
  rationale: בְּ के साथ infinitive construct यहाँ कालवाचक है; ‘जब ... निकला’ घटना का स्वाभाविक हिन्दी रूप है।
- source_word: לִפְנֵי עַמֶּךָ
  choice: अपनी प्रजा के आगे
  rationale: לִפְנֵי का स्थानवाचक अर्थ सुरक्षित रहता है और परमेश्वर द्वारा प्रजा की अगुवाई का चित्र स्पष्ट होता है।
- source_word: בְּצַעְדְּךָ
  choice: जब तू ... चला
  rationale: צעד का मूल भाव कदम बढ़ाते हुए उद्देश्यपूर्ण चलना है। परमेश्वर के लिए हिन्दी में ‘कूच किया’ की अपेक्षा ‘चला’ अधिक स्वाभाविक है, जबकि समानांतर संरचना गति पर बल बनाए रखती है।
- source_word: בִישִׁימוֹן
  choice: निर्जन प्रदेश से होकर
  rationale: יְשִׁימוֹן उजाड़, निर्जन मरुस्थलीय भूभाग को सूचित करता है। ‘निर्जन प्रदेश’ अर्थ-सीमा को खुला रखता है; गतिसूचक क्रिया के साथ ‘से होकर’ हिन्दी में स्वाभाविक है।
- source_word: סֶלָה
  choice: सेला
  rationale: इस संगीतात्मक या उपासना-संबंधी संकेत का सटीक अर्थ अनिश्चित है, इसलिए इसका लिप्यंतरण किया गया है।
theological_decisions:
- issue: निर्जन प्रदेश की यात्रा में परमेश्वर का कार्य
  choice: पद को परमेश्वर से सीधे संबोधन के रूप में रखा गया है, जिसमें अपनी प्रजा के आगे उसके चलने को स्मरण किया गया है।
  alternative: इसे परमेश्वर के बारे में वर्णनात्मक कथन के रूप में पढ़ना।
  rationale: द्वितीय पुरुष प्रत्यय और भजन का प्रसंग सीधा संबोधन समर्थित करते हैं। अनुवाद अगुवाई के ऐतिहासिक-धर्मवैचारिक संकेत को बनाए रखता है, पर पाठ से आगे कोई विशिष्ट सिद्धान्त नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज काव्यात्मक रूप अपनाया गया है। परमेश्वर के लिए एकवचन निकट संबोधन ‘तू’ भजन की प्रत्यक्ष प्रार्थनात्मक वाणी को व्यक्त करता है। पादटिप्पणी चिह्न मुख्य पाठ में ‘सेला’ के बाद रखा गया है।
