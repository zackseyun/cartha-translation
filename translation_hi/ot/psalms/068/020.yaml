  text: God is to us a God of salvations[b][a], and to the Lord GOD belong escapes from death.
translation:
  language: hi
  text: परमेश्वर हमारे लिए उद्धारों के परमेश्वर हैं[a]; मृत्यु से बच निकलने के मार्ग यहोवा प्रभु के पास हैं।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “छुटकारों के परमेश्वर।” इब्रानी में शब्द बहुवचन है; इसका आशय बार-बार या अनेक प्रकार से किए गए उद्धार हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से “मृत्यु के लिए निकलने के मार्ग” या “निकास।” प्रसंग में इसका अर्थ मृत्यु से बच निकलने के मार्ग है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֵל
  choice: परमेश्वर
  rationale: निश्चित पद के साथ אֵל यहाँ इस्राएल के परमेश्वर को स्पष्ट रूप से दर्शाता है; आधुनिक हिन्दी में ‘परमेश्वर’ स्वाभाविक और गरिमापूर्ण है।
- source_word: לָנוּ
  choice: हमारे लिए
  rationale: ל यहाँ संबंध और हित दोनों का भाव रखता है। ‘हमारे लिए’ इस लाभकारी संबंध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אֵל
  choice: परमेश्वर
  rationale: 'दूसरी बार आए אֵל को भी रखकर मूल की पुनरुक्ति और बल सुरक्षित रखा गया है: परमेश्वर हमारे लिए कैसा परमेश्वर है, यह अगला पदबंध बताता है।'
- source_word: לְמוֹשָׁעוֹת
  choice: उद्धारों का
  rationale: बहुवचन מוֹשָׁעוֹת को बनाए रखा गया है, क्योंकि यह बार-बार या अनेक प्रकार से मिलनेवाले उद्धारों की ओर संकेत कर सकता है। असामान्य लेकिन बोधगम्य हिन्दी के कारण स्पष्टीकरण फुटनोट में दिया गया है।
- source_word: וְלֵיהוָה אֲדֹנָי
  choice: प्रभु यहोवा के
  rationale: मूल में יהוה और אֲדֹנָי दोनों हैं। ‘प्रभु यहोवा’ दोनों तत्वों को अलग-अलग सुरक्षित रखता है और परमेश्वर के नाम को ‘यहोवा’ के रूप में व्यक्त करता है।
- source_word: לַמָּוֶת תּוֹצָאוֹת
  choice: मृत्यु से बच निकलने के मार्ग
  rationale: תּוֹצָאוֹת का मूल भाव ‘निकलने के स्थान/मार्ग’ है। मृत्यु के साथ इसका प्रसंगगत अर्थ उससे बच निकलने के उपाय या मार्ग है; बहुवचन भी सुरक्षित है।
theological_decisions:
- issue: יהוה और אֲדֹנָי के संयुक्त प्रयोग का अनुवाद
  choice: प्रभु यहोवा
  alternative: प्रभु परमेश्वर
  rationale: ‘प्रभु यहोवा’ मूल में उपस्थित उपाधि और दिव्य नाम दोनों को बनाए रखता है। इससे किसी संप्रदाय-विशेष की व्याख्या जोड़े बिना पाठ की विशिष्ट अभिव्यक्ति सुरक्षित रहती है।
- issue: ‘उद्धारों’ के बहुवचन का आशय
  choice: व्याकरणिक बहुवचन को बनाए रखना
  alternative: उद्धार देनेवाला परमेश्वर
  rationale: एकवचन या क्रियात्मक रूप अधिक सहज होता, पर वह बारंबार अथवा विविध उद्धारों की संभावित छटा को दबा देता। फुटनोट इस खुले अर्थ को स्पष्ट करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सामान्य पाठक के लिए स्पष्ट शैली रखी गई है। ‘उद्धारों’ का प्रयोग जानबूझकर कुछ चिह्नित है ताकि इब्रानी बहुवचन न मिटे; फुटनोट सहज विकल्प और अर्थ-छटा देता है। दूसरे अर्धपद में हिन्दी की स्वाभाविक अधिकार-संरचना अपनाई गई है।
