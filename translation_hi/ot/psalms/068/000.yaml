translation:
  language: hi
  text: संगीत-निर्देशक के लिए[a]। दाऊद का[b]। एक भजन। एक गीत।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसे “प्रधान संगीतकार के लिए” या “गान-निर्देशक के लिए” भी अनूदित किया जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “दाऊद द्वारा” अथवा “दाऊद के लिए”; भजन-शीर्षकों में प्रयुक्त इब्रानी संबंधबोधक उपसर्ग लेखकत्व, समर्पण या संबद्धता का संकेत दे सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: संगीत-निर्देशक के लिए
  rationale: भजनों के शीर्षकों में यह पद संभवतः संगीत-प्रस्तुति का निर्देशन करने वाले व्यक्ति को दर्शाता है। यह आधुनिक हिन्दी में स्पष्ट है और केवल सामान्य ‘प्रधान’ कहने की अपेक्षा संगीतमय संदर्भ को बेहतर व्यक्त करता है।
- source_word: לְדָוִד
  choice: दाऊद का
  rationale: भजन-शीर्षकों में לְ संबंध, रचनाकार, समर्पण या संबद्धता का संकेत दे सकता है। ‘दाऊद का’ स्वाभाविक हिन्दी में इस व्यापकता को ‘दाऊद द्वारा’ की तुलना में अधिक सुरक्षित रखता है।
- source_word: מִזְמוֹר
  choice: एक भजन
  rationale: यह संगीतमय रचना के लिए प्रचलित शीर्षकीय शब्द है; ‘भजन’ आधुनिक हिन्दी में इसका स्वाभाविक और प्रतिष्ठित रूप है।
- source_word: שִׁיר
  choice: एक गीत
  rationale: इसे सीधे ‘गीत’ अनूदित किया गया है। ‘भजन’ और ‘गीत’ दोनों को अलग-अलग रखना मूल के दोहरे विधा-सूचक शब्दों को सुरक्षित रखता है।
theological_decisions:
- issue: לְדָוִד में लेखकत्व की सीमा
  choice: दाऊद का
  alternative: दाऊद द्वारा
  rationale: ‘दाऊद द्वारा’ निश्चित लेखकत्व बताता, जबकि इब्रानी संबंधबोधक उपसर्ग में लेखकत्व के साथ समर्पण या संबद्धता की संभावना भी रहती है। इसलिए पाठ में व्यापक अभिव्यक्ति रखी गई और टिप्पणी में विकल्प स्पष्ट किए गए।
translation_notes:
  register: भजन के शीर्षक की संक्षिप्त, खंडात्मक शैली को बनाए रखते हुए आधुनिक, सहज और गरिमापूर्ण हिन्दी अपनाई गई है। ‘संगीत-निर्देशक’ सामान्य पाठक के लिए स्पष्ट है; ‘दाऊद का’ मूल की अर्थगत व्यापकता बनाए रखता है।
