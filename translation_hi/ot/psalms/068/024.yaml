  text: רָא֣וּ הֲלִיכוֹתֶ֣י/ךָ אֱלֹהִ֑ים הֲלִ֘יכ֤וֹת אֵלִ֖/י מַלְכִּ֣/י בַ/קֹּֽדֶשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/024.yaml
  text: They have seen your processions[a], O God— the processions of my God, my King, into the sanctuary.
translation:
  language: hi
  text: हे परमेश्वर, उन्होंने तेरी शोभायात्राएँ[a] देखी हैं—पवित्रस्थान में मेरे परमेश्वर, मेरे राजा की शोभायात्राएँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “हे परमेश्वर, उन्होंने तेरी गतियाँ देखी हैं—मेरे परमेश्वर, मेरे राजा की गतियाँ, पवित्रता में।”
    reason: הֲלִיכוֹת का सामान्य अर्थ ‘गतियाँ/चलना’ हो सकता है, और בַקֹּדֶשׁ का वैकल्पिक अर्थ ‘पवित्रता में’ भी संभव है।
lexical_decisions:
- source_word: רָאוּ
  choice: उन्होंने ... देखी हैं
  rationale: यह ראה का काल पूर्ण रूप है और किसी देखी जा चुकी घटना को व्यक्त करता है। भजन की सजीव वर्णन-शैली में हिन्दी का पूर्ण वर्तमान स्वाभाविक है।
- source_word: הֲלִיכוֹתֶיךָ / הֲלִיכוֹת
  choice: तेरी शोभायात्राएँ / ... की शोभायात्राएँ
  rationale: הלך से बना यह बहुवचन संज्ञा-रूप चलने, आगे बढ़ने या विधिपूर्वक निकलने को दर्शा सकता है। आसपास के उपासना-संबंधी प्रसंग में ‘शोभायात्राएँ’ सार्वजनिक और समारोहपूर्ण गति को स्वाभाविक रूप से व्यक्त करता है; दोनों occurrences में एक ही शब्द रखकर पुनरुक्ति और बहुवचन सुरक्षित रखे गए हैं।
- source_word: אֱלֹהִים
  choice: हे परमेश्वर
  rationale: संदर्भ इसे सीधे संबोधन के रूप में प्रस्तुत करता है। ‘हे’ हिन्दी में काव्यात्मक संबोधन को स्पष्ट करता है।
- source_word: אֵלִי
  choice: मेरे परमेश्वर
  rationale: पहले पुरुष एकवचन प्रत्यय का स्वाभाविक अधिकार-सूचक अनुवाद है।
- source_word: מַלְכִּי
  choice: मेरे राजा
  rationale: मूल पाठ में परमेश्वर के लिए प्रयुक्त राजकीय उपाधि को बिना अतिरिक्त व्याख्या के सुरक्षित रखा गया है।
- source_word: בַקֹּדֶשׁ
  choice: पवित्रस्थान में
  rationale: בְּ उपसर्ग और קֹדֶשׁ यहाँ पवित्र क्षेत्र या धर्मस्थान का संकेत दे सकते हैं। ‘पवित्रस्थान में’ मूल के स्थानवाचक रूप को बनाए रखता है और ‘के भीतर की ओर’ जैसी अनिवार्य दिशात्मकता नहीं जोड़ता।
theological_decisions:
- issue: शोभायात्राओं का आशय
  choice: पद को परमेश्वर की पवित्रस्थान-संबंधी समारोहपूर्ण शोभायात्राओं के रूप में प्रस्तुत किया गया है।
  alternative: यह परमेश्वर की गतिविधियों या पवित्रता में उसके मार्गों का अधिक सामान्य वर्णन भी हो सकता है।
  rationale: दो बार आए הֲלִיכוֹת और अंत के בַקֹּדֶשׁ से उपासना तथा शोभायात्रा का दृश्य संभावित है, पर वैकल्पिक व्यापक अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: בַקֹּדֶשׁ का स्थानवाचक या भाववाचक अर्थ
  choice: पवित्रस्थान में
  alternative: पवित्रता में
  rationale: प्रसंग पवित्र स्थल की ओर संकेत करता है, फिर भी קֹדֶשׁ का भाववाचक अर्थ संभव है; इसलिए उसे पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक रखी गई है। ईश्वर-संबोधन में ‘तेरी’ और ‘हे’ भजन की निकटता तथा प्रत्यक्ष संबोधन को व्यक्त करते हैं। ‘शोभायात्राएँ’ मूल के बहुवचन और उपासना-संबंधी बिंब दोनों को सुरक्षित रखता है।
