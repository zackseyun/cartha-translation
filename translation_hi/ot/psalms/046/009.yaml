base_translation:
  language: en
  yaml_path: translation/ot/psalms/046/009.yaml
  text: He makes wars cease to the end of the earth[a]; he breaks the bow and cuts the spear in two[b]; he burns the wagons with fire.
translation:
  language: hi
  text: 'वह धरती के छोर तक युद्धों का अंत कर देता है;

    वह धनुष तोड़ देता और भाले को काट डालता है[b];

    वह गाड़ियों[a] को आग में जला देता है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘रथों’। यहाँ प्रयुक्त इब्रानी शब्द का अधिक सीधा अर्थ ‘गाड़ियाँ’ या ‘छकड़े’ है, हालाँकि युद्ध के प्रसंग के कारण कुछ अनुवाद इसे ‘रथ’ कहते हैं।
    reason: lexical_alternative
  - marker: b
    text: या ‘भाले को काटकर अलग कर देता है’। इब्रानी क्रिया काटने या काटकर अलग करने का बोध देती है; वह यह स्पष्ट नहीं करती कि भाला ठीक दो टुकड़ों में काटा गया।
    reason: source_ambiguity
lexical_decisions:
- source_word: מַשְׁבִּית מִלְחָמוֹת
  choice: युद्धों का अन्त कर देता है
  rationale: हिफ़िल कृदन्त युद्धों को रुकवा देने या समाप्त कर देने का कारक भाव व्यक्त करता है। यह हिन्दी में स्वाभाविक रहते हुए उस कारक अर्थ को बनाए रखता है।
- source_word: עַד קְצֵה הָאָרֶץ
  choice: धरती के छोर तक
  rationale: इब्रानी पद का निकट अर्थ ‘धरती के छोर तक’ है और यह व्यापक भौगोलिक विस्तार को व्यक्त करता है।
- source_word: קֶשֶׁת יְשַׁבֵּר
  choice: धनुष तोड़ देता है
  rationale: एकवचन ‘धनुष’ यहाँ हथियार के प्रकार का सामान्य प्रतिनिधि है; पिएल क्रिया उसके नष्ट किए जाने को स्पष्ट करती है।
- source_word: וְקִצֵּץ חֲנִית
  choice: भाले को दो टुकड़ों में काट देता है
  rationale: קצץ काटने या काटकर अलग करने का बोध देता है। प्रसंग में यह भाले को अनुपयोगी कर देने की ठोस छवि प्रस्तुत करता है; अधिक शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: עֲגָלוֹת
  choice: गाड़ियों
  rationale: यह संज्ञा सामान्यतः गाड़ियों या छकड़ों के लिए प्रयुक्त होती है, न कि रथ के प्रचलित इब्रानी शब्द के रूप में। इसलिए मुख्य पाठ में मूल शब्द का सीधा अर्थ रखा गया है।
- source_word: יִשְׂרֹף בָּאֵשׁ
  choice: आग में जला देता है
  rationale: यह इब्रानी अभिव्यक्ति की ठोस छवि को सुरक्षित रखता है और आधुनिक हिन्दी में स्वाभाविक है।
theological_decisions:
- issue: सैन्य प्रसंग में עֲגָלוֹת का अर्थ
  choice: गाड़ियों
  alternative: रथों
  rationale: यद्यपि युद्ध के प्रसंग के कारण परम्परागत अनुवादों में ‘रथ’ मिलता है, मूल संज्ञा का सामान्य अर्थ ‘गाड़ियाँ/छकड़े’ है। कोई सिद्धान्तगत बात दाँव पर नहीं है; मूल-पाठ की प्राथमिकता के कारण ‘गाड़ियों’ को मुख्य पाठ में और ‘रथों’ को पादटिप्पणी में रखा गया है।
- issue: וְקִצֵּץ חֲנִית में विनाश की रीति
  choice: भाले को दो टुकड़ों में काट देता है
  alternative: भाले को काट डालता है
  rationale: क्रिया काटकर अलग करने का अर्थ दे सकती है, पर टुकड़ों की सटीक संख्या मूल में स्पष्ट नहीं कही गई। मुख्य पाठ सुबोध विनाशकारी छवि देता है और अधिक निरपेक्ष रूप पादटिप्पणी में सुरक्षित है।
