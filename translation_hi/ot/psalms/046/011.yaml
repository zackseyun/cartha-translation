  choice: सेला
  rationale: इस उपासना अथवा संगीत-संबंधी शब्द का सटीक अर्थ अनिश्चित है, इसलिए अर्थ आरोपित करने के बजाय इसका लिप्यंतरण रखा गया है।
theological_decisions:
- issue: יְהוָה צְבָאוֹת का अनुवाद
  choice: सेनाओं का यहोवा
  alternative: सेनाओं का प्रभु
  rationale: मूल पाठ में परमेश्वर का व्यक्तिवाचक नाम सीधे आया है; ‘यहोवा’ उसे शीर्षक ‘प्रभु’ से प्रतिस्थापित नहीं करता, जबकि ‘सेनाओं का’ צְבָאוֹת के व्यापक सैन्य अर्थ को बनाए रखता है।
- issue: מִשְׂגָּב का अर्थ
  choice: हमारे लिए ऊँचा गढ़
  alternative: हमारी शरण / हमारा दृढ़ गढ़
  rationale: मूल शब्द में सुरक्षित ऊँचाई और सुदृढ़ आश्रय दोनों के भाव हैं। ‘ऊँचा गढ़’ इस मूर्त रूपक को सामान्य ‘शरण’ की अपेक्षा अधिक पूर्णतः सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, काव्यात्मक और गरिमापूर्ण शैली रखी गई है। समानांतर इब्रानी पंक्तियों को अर्धविराम से जोड़ा गया है। ‘गढ़’ सामान्य पाठक के लिए बोधगम्य है, और ‘ऊँचा’ मूल शब्द में निहित सुरक्षित ऊँचाई के भाव को स्पष्ट करता है।
