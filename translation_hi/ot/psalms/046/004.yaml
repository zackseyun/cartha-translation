  text: נָהָ֗ר פְּלָגָ֗י/ו יְשַׂמְּח֥וּ עִיר אֱלֹהִ֑ים קְ֝דֹ֗שׁ מִשְׁכְּנֵ֥י עֶלְיֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/046/004.yaml
  text: A river—its streams make glad the city of God[b][a], the holy dwelling place of the Most High.
translation:
  language: hi
  text: एक नदी है—उसकी धाराएँ परमेश्वर के उस नगर को आनन्दित करती हैं, जो परमप्रधान के निवासों का पवित्र स्थान है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נָהָר
  choice: एक नदी है
  rationale: इब्रानी में संज्ञा अनिश्चित है और आरम्भ में क्रिया नहीं है। हिन्दी में स्वाभाविक वाक्य के लिए ‘है’ जोड़ा गया है।
- source_word: פְּלָגָיו
  choice: उसकी धाराएँ
  rationale: बहुवचन रूप पर लगा एकवचन पुल्लिंग प्रत्यय नदी की ओर संकेत करता है; ‘धाराएँ’ नदी से निकलने वाले प्रवाहों का स्वाभाविक काव्यात्मक रूप है।
- source_word: יְשַׂמְּחוּ
  choice: आनन्दित करती हैं
  rationale: 'पिएल रूप कारणवाचक भाव देता है: धाराएँ नगर को आनन्द प्रदान करती हैं।'
- source_word: עִיר אֱלֹהִים
  choice: परमेश्वर का नगर
  rationale: यह इब्रानी संबंधवाचक पदबंध का स्पष्ट और प्रतिष्ठित हिन्दी रूप है।
- source_word: קְדֹשׁ מִשְׁכְּנֵי
  choice: निवासों का पवित्र स्थान
  rationale: קְדֹשׁ एकवचन है और מִשְׁכְּנֵי बहुवचन संबंध-रूप है; यह अनुवाद दोनों संख्याओं को बनाए रखते हुए पदबंध को सुबोध हिन्दी में व्यक्त करता है।
- source_word: עֶלְיוֹן
  choice: परमप्रधान
  rationale: यह परमेश्वर की उपाधि है; ‘परमप्रधान’ आधुनिक हिन्दी बाइबिलीय भाषा में संक्षिप्त, गरिमापूर्ण और परिचित है।
theological_decisions:
- issue: מִשְׁכְּנֵי के बहुवचन को एकवचन ‘निवास’ या ‘पवित्रस्थान’ में समतल करना
  choice: बहुवचन ‘निवासों’ को बनाए रखा गया
  alternative: परमप्रधान का पवित्र निवास
  rationale: मूल पाठ में रूप स्पष्टतः बहुवचन है। सम्भव है कि यह पवित्र परिसर या महिमापूर्ण बहुवचन को व्यक्त करे; अनुवाद इसे किसी एक व्याख्या तक सीमित नहीं करता।
- issue: קְדֹשׁ מִשְׁכְּנֵי עֶלְיוֹן का वाक्यगत संबंध
  choice: 'इसे ‘परमेश्वर के नगर’ के समानाधिकरणात्मक वर्णन के रूप में लिया गया: ‘जो ... पवित्र स्थान है’'
  alternative: ‘परमेश्वर के नगर को, परमप्रधान के पवित्र निवासों को’—दो समानांतर कर्म
  rationale: קְדֹשׁ का एकवचन रूप नगर/पवित्र स्थान से संबंध का समर्थन करता है, जबकि מִשְׁכְּנֵי का संबंध-बहुवचन ‘निवासों का’ बना रहता है। पादटिप्पणी वैकल्पिक वाक्य-संबंध को खुला रखती है।
translation_notes:
  register: भाषा आधुनिक, काव्यात्मक और गरिमापूर्ण रखी गई है। ‘एक नदी है’ हिन्दी में इब्रानी के क्रियारहित आरम्भ को स्वाभाविक बनाता है; दीर्घ विराम नदी और उसकी धाराओं की छवि को उभारता है।
