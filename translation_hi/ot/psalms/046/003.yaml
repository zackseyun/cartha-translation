lexical_decisions:
- source_word: יֶהֱמוּ
  choice: गरजे
  rationale: המה यहाँ उफनते जल की प्रचंड ध्वनि व्यक्त करता है; ‘गरजे’ काव्यात्मक और सहज हिंदी में इस श्रव्य प्रभाव को बनाए रखता है।
- source_word: יֶחְמְרוּ
  choice: झाग उठाए
  rationale: जल के संदर्भ में חמר मथने, उफनने या झाग उठने का बिंब देता है; ‘झाग उठाए’ आधुनिक हिंदी में स्वाभाविक है।
- source_word: מֵימָיו
  choice: उसका जल
  rationale: तीसरे पुरुष पुल्लिंग एकवचन प्रत्यय को संदर्भानुसार ‘उसका’ रखा गया है; ‘जल’ सामूहिक अर्थ में प्रयुक्त है।
- source_word: יִרְעֲשׁוּ
  choice: काँप उठें
  rationale: רעשׁ तीव्र हिलने या भूकंपीय कंपन को दर्शाता है; पहाड़ों के साथ ‘काँप उठें’ सजीव और स्वाभाविक है।
- source_word: הָרִים
  choice: पहाड़
  rationale: निर्धारित बहुवचन को हिंदी में सामान्य वर्गवाचक रूप ‘पहाड़’ से स्वाभाविक ढंग से व्यक्त किया गया है।
- source_word: בְּגַאֲוָתוֹ
  choice: उसके उमड़ने से
  rationale: גאוה में ऊँचाई, गर्व और फूलने/उमड़ने के अर्थ संभव हैं। अशांत जल के तत्काल संदर्भ में ‘उमड़ने’ भौतिक बिंब को प्रमुखता देता है, जबकि वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित हैं।
- source_word: סֶלָה
  choice: सेला
  rationale: इस उपासना-संगीत संबंधी संकेत का निश्चित अर्थ अज्ञात है, इसलिए अर्थ थोपने के बजाय लिप्यंतरण किया गया है।
