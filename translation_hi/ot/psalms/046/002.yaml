  choice: इसलिए
  rationale: यह पद पिछले पद में परमेश्वर को शरण और सामर्थ्य मानने से निकला निष्कर्ष व्यक्त करता है; ‘इसलिए’ उस तार्किक संबंध को स्वाभाविक हिंदी में बनाए रखता है।
- source_word: לֹא נִירָא
  choice: हम नहीं डरेंगे
  rationale: यहाँ प्रथम पुरुष बहुवचन अपूर्ण क्रिया विश्वासपूर्ण संकल्प व्यक्त करती है; भविष्यकालीन रूप हिंदी में उस दृढ़ता को स्पष्ट करता है।
- source_word: בְּהָמִיר אָרֶץ
  choice: चाहे पृथ्वी बदल जाए
  rationale: מ־ו־ר धातु बदलने या परिवर्तित होने का भाव रखती है। ‘चाहे’ उपसर्ग בְ से व्यक्त परिस्थितिजन्य अर्थ को और ‘बदल जाए’ मूल क्रिया की व्यापकता को सुरक्षित रखता है।
- source_word: וּבְמוֹט הָרִים
  choice: चाहे पहाड़ ... खिसक जाएँ
  rationale: מוֹט स्थिर स्थान से डगमगाने, हिलने या खिसकने का बोध देता है। समुद्रों के भीतर जाने की छवि में ‘खिसक जाएँ’ स्वाभाविक और सजीव है।
- source_word: בְּלֵב יַמִּים
  choice: समुद्रों के हृदय में
  rationale: לֵב का शाब्दिक अर्थ ‘हृदय’ है और स्थानवाचक प्रयोग में भीतरी या मध्य भाग को दर्शाता है। रूपक तथा יַמִּים के बहुवचन दोनों को सुरक्षित रखा गया है।
