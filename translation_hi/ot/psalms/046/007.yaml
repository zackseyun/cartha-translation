source:
  edition: WLC
  text: יְהוָ֣ה צְבָא֣וֹת עִמָּ֑/נוּ מִשְׂגָּֽב לָ֝/נוּ אֱלֹהֵ֖י יַעֲקֹ֣ב סֶֽלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/046/007.yaml
  text: Yahweh of Armies is with us; the God of Jacob is a stronghold for us[a]. Selah
translation:
  language: hi
  text: 'सेनाओं का याहवे[a] हमारे साथ है;

    याकूब का परमेश्वर हमारे लिए ऊँचा गढ़ है।

    सेला।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा, परंपरागत रूप से, “सेनाओं का प्रभु हमारे साथ है।”
    reason: ईश्वरीय नाम के पारंपरिक उपाधि-आधारित अनुवाद को दर्ज करने के लिए।
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चार-अक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय आधुनिक हिन्दी में ध्वन्यात्मक रूप से प्रस्तुत किया गया है।
- source_word: צְבָאוֹת
  choice: सेनाओं का
  rationale: यह बहुवचन संज्ञा संगठित सैन्य दलों अथवा स्वर्गीय सेनाओं का बोध करा सकती है। ‘सेनाओं का’ आधुनिक हिन्दी में पारदर्शी है और मूल की सामरिक तथा व्यापक शक्ति को बनाए रखता है।
- source_word: עִמָּנוּ
  choice: हमारे साथ है
  rationale: עם और प्रथम पुरुष बहुवचन प्रत्यय यहाँ उपस्थिति, एकजुटता और संरक्षण का स्वाभाविक भाव व्यक्त करते हैं।
- source_word: מִשְׂגָּב
  choice: ऊँचा गढ़
  rationale: यह शब्द सुरक्षित ऊँचे स्थान अथवा दुर्गम शरण का अर्थ देता है। ‘ऊँचा गढ़’ ऊँचाई और सुरक्षा, दोनों पक्षों को संक्षेप में बनाए रखता है।
- source_word: לָנוּ
  choice: हमारे लिए
  rationale: 'ל और प्रथम पुरुष बहुवचन प्रत्यय यहाँ संबंध और हित का भाव बताते हैं: परमेश्वर हमारे पक्ष में सुरक्षित गढ़ है।'
- source_word: אֱלֹהֵי יַעֲקֹב
  choice: याकूब का परमेश्वर
  rationale: यह सीधा संबंधवाचक पदबंध है और इस्राएल के कुलपिता याकूब के साथ वाचागत संबंध को सुरक्षित रखता है।
- source_word: סֶלָה
  choice: सेला
  rationale: इस संगीतात्मक अथवा उपासना-संबंधी संकेत का सटीक अर्थ अनिश्चित है, इसलिए व्याख्यात्मक अनुवाद के बजाय लिप्यंतरण रखा गया है।
theological_decisions:
- issue: ईश्वरीय पद יְהוָה צְבָאוֹת का अनुवाद
  choice: सेनाओं का याहवे
  alternative: सेनाओं का प्रभु
  rationale: मूल पाठ में व्यक्तिगत नाम יְהוָה सीधे आया है। ‘याहवे’ उस वाचागत नाम को बनाए रखता है, जबकि ‘प्रभु’ उसका पारंपरिक प्रतिस्थापन है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। समानांतर काव्य-पंक्तियाँ सुरक्षित हैं। ‘ऊँचा गढ़’ मूल के रक्षात्मक और ऊँचे सुरक्षित स्थान के दोनों अर्थों को व्यक्त करता है; ‘सेला’ की अनिश्चितता को लिप्यंतरण द्वारा बनाए रखा गया है।
