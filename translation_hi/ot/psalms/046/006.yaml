base_translation:
  language: en
  yaml_path: translation/ot/psalms/046/006.yaml
  text: Nations raged[a], kingdoms tottered; he uttered his voice, the earth melted.
translation:
  language: hi
  text: राष्ट्रों में कोलाहल मचा[a], राज्य डगमगा उठे; उसने अपनी वाणी दी, पृथ्वी पिघल गई।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “राष्ट्रों में उथल-पुथल मची, राज्य हिल गए।”
    reason: lexical_alternative
lexical_decisions:
- source_word: הָמוּ
  choice: कोलाहल मचा
  rationale: क्रिया ऊँची, उथल-पुथल भरी ध्वनि और अशांति दोनों व्यक्त करती है। ‘कोलाहल मचा’ आधुनिक हिन्दी में इन दोनों पहलुओं को स्वाभाविक ढंग से रखता है।
- source_word: גּוֹיִם
  choice: राष्ट्रों
  rationale: यहाँ राजनीतिक समुदाय अभिप्रेत हैं और समानांतर पद में ‘राज्य’ आया है; इसलिए ‘राष्ट्र’ उपयुक्त है। ‘अन्यजातियाँ’ ऐसा धार्मिक भेद जोड़ सकता है जो इस पद में प्रमुख नहीं है।
- source_word: מָטוּ
  choice: डगमगा उठे
  rationale: मूल क्रिया अस्थिर होने, खिसकने या लड़खड़ाने का बिंब देती है। यह चुनाव पूर्ण पतन बताए बिना राज्यों की अस्थिरता को सुरक्षित रखता है।
- source_word: מַמְלָכוֹת
  choice: राज्य
  rationale: राजनीतिक शासन-क्षेत्रों के लिए सहज और सीधा हिन्दी पर्याय।
- source_word: נָתַן בְּקוֹלוֹ
  choice: उसने अपनी वाणी सुनाई
  rationale: शाब्दिक भाव ‘उसने अपनी आवाज़ दी’ है। ‘अपनी वाणी सुनाई’ हिन्दी में स्वाभाविक रहते हुए प्रभावशाली दैवी उच्चारण को व्यक्त करता है और केवल आवाज़ ऊँची करने का अर्थ नहीं देता।
- source_word: תָּמוּג
  choice: पिघल गई
  rationale: क्रिया पिघलने, घुलने या दृढ़ता खोने का भाव देती है। ‘पिघल गई’ मूल काव्य-बिंब को सीधे सुरक्षित रखता है।
- source_word: אָרֶץ
  choice: पृथ्वी
  rationale: भजन के व्यापक, विश्वव्यापी परिप्रेक्ष्य में ‘पृथ्वी’ उपयुक्त है; ‘देश’ अर्थ को अनावश्यक रूप से सीमित कर सकता है।
theological_decisions:
- issue: נָתַן का अंतर्निहित कर्ता
  choice: ‘उसने’—संदर्भ से परमेश्वर
  alternative: इस पद में स्पष्ट रूप से ‘यहोवा’ जोड़ना
  rationale: इब्रानी में कर्ता पुल्लिंग एकवचन में अंतर्निहित है, पर इस पद में दैवी नाम नहीं लिखा गया। ‘उसने’ मूल की संक्षिप्तता बनाए रखता है और आसपास के संदर्भ को कर्ता की पहचान करने देता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, काव्यात्मक और सामान्य पाठक के लिए सुबोध रूप। समानांतरता, तीव्र गति और पृथ्वी के ‘पिघलने’ के मूल बिंब को बनाए रखा गया है।
