  text: לְֽכוּ חֲ֭זוּ מִפְעֲל֣וֹת יְהוָ֑ה אֲשֶׁר שָׂ֖ם שַׁמּ֣וֹת בָּ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/046/008.yaml
  text: Come, see the works of the LORD, who has set desolations in the earth.
translation:
  language: hi
  text: आओ, यहोवा के कार्यों को देखो, जिसने पृथ्वी पर विनाश किए हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְכוּ
  choice: आओ
  rationale: बहुवचन आज्ञार्थक अभिव्यक्ति; हिन्दी में निमंत्रण और आह्वान दोनों का स्वाभाविक रूप।
- source_word: חֲזוּ
  choice: देखो
  rationale: दृढ़ता से देखने या निहारने का आह्वान; सामान्य पाठक के लिए सरल और सीधा।
- source_word: מִפְעֲלוֹת
  choice: कामों
  rationale: यहोवा के किए हुए कार्यों को व्यापक रूप से व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ में आए दिव्य व्यक्तिगत नाम को उपाधि से बदलने के बजाय नाम के रूप में प्रस्तुत किया गया है।
- source_word: שָׂם
  choice: की हैं
  rationale: शाब्दिक अर्थ ‘रखा/स्थापित किया’ है, पर שַׁמּוֹת के साथ इसका भाव उजाड़ उत्पन्न करने का है; हिन्दी में ‘उजाड़ें की हैं’ स्वाभाविक है।
- source_word: שַׁמּוֹת
  choice: कैसी-कैसी उजाड़ें
  rationale: बहुवचन संज्ञा विनाश और उजाड़ की अनेक घटनाओं या दशाओं को दर्शाती है; ‘कैसी-कैसी’ देखने के विस्मयकारी आह्वान को स्वाभाविक हिन्दी में उभारता है।
- source_word: בָּאָרֶץ
  choice: पृथ्वी पर
  rationale: אֶרֶץ का अर्थ ‘पृथ्वी’ या ‘देश’ हो सकता है; यहाँ व्यापक काव्यात्मक संदर्भ में ‘पृथ्वी’ चुना गया है।
theological_decisions:
- issue: विनाशकारी उजाड़ों का कर्ता
  choice: यहोवा को व्याकरण के अनुसार उजाड़ों का कर्ता बनाए रखा गया है।
  alternative: निष्क्रिय रूप में केवल ‘जो उजाड़ हुए हैं’ कहना।
  rationale: अशर शाम का कर्ता निकटतम पूर्ववर्ती ‘यहोवा’ है; मूल की धर्मवैचारिक तीक्ष्णता को नरम नहीं किया गया।
- issue: אֶרֶץ का विस्तार
  choice: ‘पृथ्वी’
  alternative: ‘देश’
  rationale: भजन के व्यापक राष्ट्र-संबंधी और विश्वव्यापी संदर्भ में ‘पृथ्वी’ उपयुक्त है, यद्यपि इब्रानी शब्द दोनों अर्थ ग्रहण कर सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण काव्यात्मक शैली। आज्ञार्थक बहुवचन बनाए रखा गया है और मूल पाठ की कठोर धर्मवैचारिक छवि को स्पष्ट रखा गया है।
