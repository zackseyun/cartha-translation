  text: Be still[a], and know that I am God. I will be exalted among the nations[c][b]; I will be exalted in the earth.
translation:
  language: hi
  text: थम जाओ[a], और जान लो कि मैं ही परमेश्वर हूँ। मैं राष्ट्रों के बीच महिमान्वित होऊँगा[b]; मैं पृथ्वी पर महिमान्वित होऊँगा[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “रुक जाओ,” “छोड़ दो”; हिब्रू आज्ञा का अर्थ ढीला छोड़ना, रुकना या अपनी पकड़ छोड़ देना हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “मैं महिमान्वित हूँ”; हिब्रू क्रियारूप संदर्भ में वर्तमान या भविष्य का भाव दे सकता है।
    reason: alternative_reading
  - marker: c
    text: “पृथ्वी” का अनुवाद “भूमि” भी हो सकता है, पर भजन का व्यापक संदर्भ वैश्विक अर्थ का समर्थन करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַרְפּוּ
  choice: थम जाओ
  rationale: רפה के हिफ़इल आज्ञार्थक बहुवचन का मूल भाव पकड़ ढीली करने, छोड़ देने या रुक जाने का है। भजन के युद्ध और राष्ट्रों के कोलाहल वाले संदर्भ में ‘थम जाओ’ मानवीय प्रयत्न और विद्रोही हलचल रोकने की आज्ञा को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि केवल ध्यानमय मौन तक अर्थ को सीमित नहीं करता।
- source_word: וּדְעוּ
  choice: और जान लो
  rationale: ידע यहाँ प्रत्यक्ष आज्ञा है और परमेश्वर की पहचान तथा स्वीकृति दोनों का भाव रख सकती है। ‘जान लो’ इसकी दृढ़ आज्ञार्थक शक्ति को सहज आधुनिक हिन्दी में बनाए रखता है।
- source_word: כִּי אָנֹכִי אֱלֹהִים
  choice: कि मैं ही परमेश्वर हूँ
  rationale: כִּי ज्ञात की जाने वाली बात का परिचय देता है। स्वतंत्र सर्वनाम אָנֹכִי के बल को हिन्दी में ‘ही’ स्वाभाविक रूप से व्यक्त करता है, बिना कोई बाहरी अर्थ जोड़े।
- source_word: אָרוּם
  choice: मेरी महिमा ऊँची होगी
  rationale: רום का क़ाल अपूर्ण रूप ‘ऊँचा होना’ अथवा ‘महिमान्वित होना’ दर्शाता है। ‘मेरी महिमा ऊँची होगी’ निश्चित भावी उत्कर्ष और सम्मान का आशय स्पष्ट करता है; कालगत अस्पष्टता पादटिप्पणी में सुरक्षित है।
- source_word: בַּגּוֹיִם
  choice: राष्ट्रों के बीच
  rationale: גּוֹיִם यहाँ सामूहिक राजनीतिक जनसमुदायों को सूचित करता है। ‘राष्ट्रों के बीच’ सार्वभौमिक दायरे को स्वाभाविक और गैर-सांप्रदायिक हिन्दी में व्यक्त करता है।
- source_word: בָּאָרֶץ
  choice: सारी पृथ्वी पर
  rationale: אֶרֶץ का अर्थ ‘देश/भूमि’ या ‘पृथ्वी’ हो सकता है। राष्ट्रों के समानांतर और पूरे भजन के व्यापक दायरे में ‘पृथ्वी’ अधिक उपयुक्त है। हिन्दी में ‘पर’ स्वाभाविक संबंधसूचक है; ‘सारी’ व्यापकता को स्पष्ट करती है।
theological_decisions:
- issue: आरंभिक आज्ञा הַרְפּוּ का बल
  choice: मानवीय प्रयत्न और विद्रोही हलचल रोककर परमेश्वर की प्रभुता पहचानने की व्यापक आज्ञा—‘थम जाओ’
  alternative: इसे केवल युद्ध रोकने की आज्ञा, या केवल निजी ध्यान के लिए शांत होने का बुलावा समझना
  rationale: क्रिया स्वयं ढीला छोड़ने या रुकने का अर्थ देती है। राष्ट्रों, युद्धों और पृथ्वी पर परमेश्वर के शासन के संदर्भ में यह व्यापक विराम और समर्पण की मांग करती है। ‘थम जाओ’ दोनों संभावित आयामों को खुला रखता है।
- issue: אָרוּם का कालगत बल
  choice: निश्चित भावी अर्थ—‘मेरी महिमा ऊँची होगी’
  alternative: वर्तमान/स्थितिगत अर्थ—‘मेरी महिमा ऊँची है’
  rationale: हिब्रू अपूर्ण रूप संदर्भ में भविष्य या निश्चित परिणाम व्यक्त कर सकता है। समानांतर घोषणाओं में भविष्य स्वाभाविक है, पर वास्तविक कालगत विकल्प पादटिप्पणी में रखा गया है।
- issue: בָּאָרֶץ का दायरा
  choice: वैश्विक अर्थ—‘सारी पृथ्वी पर’
  alternative: स्थानीय अर्थ—‘देश में’ या ‘भूमि पर’
  rationale: ‘राष्ट्रों के बीच’ के समानांतर और भजन के सार्वभौमिक स्वर के कारण वैश्विक अर्थ अधिक संभावित है, यद्यपि हिब्रू शब्द स्थानीय भूमि को भी सूचित कर सकता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक रखी गई है। ‘थम जाओ’ प्रचलित ‘शांत हो जाओ’ की अपेक्षा मूल क्रिया के रुकने/छोड़ने के भाव को अधिक सीधे रखता है। ‘मैं ही परमेश्वर हूँ’ हिब्रू के स्वतंत्र सर्वनाम का बल व्यक्त करता है।
