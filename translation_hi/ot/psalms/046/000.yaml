lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: संगीत निर्देशक के लिए
  rationale: भजन-शीर्षकों में यह पद संगीत-प्रस्तुति की देखरेख करने वाले व्यक्ति को सूचित करता है। ‘संगीत निर्देशक’ आधुनिक हिन्दी में स्पष्ट है और केवल गायक-मंडली तक अर्थ को सीमित नहीं करता।
- source_word: לִבְנֵי קֹרַח
  choice: कोरह के वंशजों का
  rationale: यहाँ ל संबंध, रचना या प्रस्तुति के लिए नियुक्ति दर्शा सकता है। ‘के वंशजों का’ इस संबंध को संक्षेप में रखता है और लेखकत्व या प्रस्तुति का अनावश्यक निर्णय नहीं करता।
- source_word: עַל
  choice: के अनुसार
  rationale: संगीत-संबंधी शीर्षकों में עַל किसी धुन, शैली या प्रस्तुति-निर्देश का परिचय दे सकता है। ‘के अनुसार’ इस कार्य को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: עֲלָמוֹת
  choice: अलामोत
  rationale: इस तकनीकी शब्द का आशय अनिश्चित है; यह युवतियों, ऊँचे स्वरों, किसी संगीत-शैली या धुन के नाम की ओर संकेत कर सकता है। लिप्यंतरण अनिश्चितता को सुरक्षित रखता है।
- source_word: שִׁיר
  choice: एक गीत
  rationale: यह रचना के प्रकार का संज्ञात्मक संकेत है; ‘एक गीत’ स्वाभाविक और स्पष्ट हिन्दी है।
