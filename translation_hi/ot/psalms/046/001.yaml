  text: परमेश्वर हमारा शरणस्थान और सामर्थ्य है; संकटों में अत्यन्त सुलभ सहायता है।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से ‘संकटों में अत्यन्त पाई गई सहायता’ है; इसका भाव है कि संकट के समय परमेश्वर सहायता के लिए सहज उपलब्ध सिद्ध होता है।
    reason: lexical_alternative
  - marker: b
    text: 'अन्य सम्भव अनुवाद: ‘संकटों में भरपूर उपलब्ध सहायता।’'
    reason: previous_rendering
lexical_decisions:
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: रूप की दृष्टि से यह शब्द बहुवचन-जैसा है, पर यहाँ एकवचन अर्थ में इस्राएल के परमेश्वर के लिए प्रयुक्त हुआ है।
- source_word: לָנוּ
  choice: हमारा
  rationale: इसका शाब्दिक अर्थ ‘हमारे लिए/हमको’ है, पर हिन्दी में मַחֲסֶה के साथ ‘हमारा शरणस्थान’ स्वाभाविक और अर्थानुकूल है।
- source_word: מַחֲסֶה
  choice: शरणस्थान
  rationale: यह सुरक्षा और आश्रय के स्थान को दर्शाता है; ‘शरणस्थान’ काव्यात्मक गरिमा और स्पष्टता दोनों बनाए रखता है।
- source_word: וָעֹז
  choice: और सामर्थ्य
  rationale: עֹז शक्ति या सामर्थ्य को व्यक्त करता है; अमूर्त संज्ञा के रूप को सुरक्षित रखने के लिए ‘सामर्थ्य’ चुना गया है।
- source_word: עֶזְרָה
  choice: सहायक
  rationale: मूल संज्ञा का अर्थ सहायता या मदद है। हिन्दी में परमेश्वर के लिए ‘सहायक’ कहना स्वाभाविक है और संज्ञात्मक विधान को बनाए रखता है।
- source_word: בְצָרוֹת
  choice: संकटों में
  rationale: बहुवचन צָרוֹת क्लेश, विपत्ति या संकट की स्थितियों को सूचित करता है; ‘संकटों में’ बहुवचन और व्यापक अर्थ दोनों रखता है।
- source_word: נִמְצָא מְאֹד
  choice: अत्यन्त सुलभ
  rationale: शाब्दिक रूप से यह ‘अत्यन्त पाया गया/मिलता है’ जैसा संक्षिप्त वाक्यांश है। ‘अत्यन्त सुलभ’ यह भाव स्वाभाविक हिन्दी में व्यक्त करता है कि संकट में परमेश्वर सहायता के लिए सहज उपलब्ध सिद्ध होता है।
theological_decisions:
- issue: अन्तिम उपवाक्य की संक्षिप्त और अस्पष्ट संरचना
  choice: संकटों में वह अत्यन्त सुलभ सहायक है
  alternative: संकटों में अत्यन्त पाया गया सहायक
  rationale: इब्रानी נִמְצָא מְאֹד का सीधा शब्दानुवाद हिन्दी में अस्वाभाविक और अर्थ की दृष्टि से धुँधला होगा। ‘अत्यन्त सुलभ’ उपलब्धता और अनुभव में सहायक सिद्ध होने का भाव देता है, जबकि पादटिप्पणी मूल की शाब्दिक संरचना सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण भजनात्मक शैली अपनाई गई है। ‘शरणस्थान’ और ‘सामर्थ्य’ मूल की समानान्तर संज्ञाओं को बनाए रखते हैं; अन्तिम वाक्यांश को स्वाभाविक हिन्दी में प्रस्तुत करते हुए उसकी शाब्दिक असामान्यता पादटिप्पणियों में सुरक्षित रखी गई है।
