  text: परमेश्वर उसके बीच में है[a]; वह नहीं डगमगाएगी[b]। भोर होने पर[c] परमेश्वर उसकी सहायता करेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
