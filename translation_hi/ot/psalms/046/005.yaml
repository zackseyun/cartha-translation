lexical_decisions:
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: इस भजन के संदर्भ में बहुवचन रूप इस्राएल के एक परमेश्वर को सूचित करता है; आधुनिक हिन्दी में “परमेश्वर” स्पष्ट और गरिमापूर्ण है।
- source_word: בְּקִרְבָּהּ
  choice: उसके बीच में
  rationale: यह स्त्रीलिंग एकवचन नगर की ओर संकेत करते हुए उसके भीतर परमेश्वर की उपस्थिति बताता है। “उसके बीच में” मूल अर्थ और सर्वनाम दोनों को सुरक्षित रखता है।
- source_word: בַּל תִּמּוֹט
  choice: वह नहीं डगमगाएगी
  rationale: מוט का निफ़अल रूप अस्थिर होने, हिलने या डगमगाने का बोध देता है। “नहीं डगमगाएगी” नगर की दृढ़ता का काव्यात्मक चित्र स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: יַעְזְרֶהָ
  choice: उसकी सहायता करेगा
  rationale: अपूर्ण क्रिया यहाँ भावी अथवा सुनिश्चित कार्य व्यक्त करती है। यह अनुवाद स्त्रीलिंग कर्म-सर्वनाम और आश्वासन, दोनों को स्पष्ट रखता है।
- source_word: לִפְנוֹת בֹּקֶר
  choice: भोर होते ही
  rationale: यह अभिव्यक्ति सुबह के प्रकट होने या दिन निकलने के समय को सूचित करती है। “भोर होते ही” हिन्दी में स्वाभाविक है और समय की तात्कालिकता भी व्यक्त करता है; मूल चित्र को पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: स्त्रीलिंग एकवचन सर्वनामों का संदर्भ
  choice: “उसके/वह/उसकी” निकटवर्ती संदर्भ में परमेश्वर के नगर, अर्थात सिय्योन, की ओर संकेत करते हैं।
  alternative: इन्हें अधिक सामान्य रूप से परमेश्वर के लोगों के समुदाय के लिए समझना।
  rationale: मूल का स्त्रीलिंग एकवचन व्याकरण पिछले पद में आए नगर की ओर स्वाभाविक रूप से लौटता है। नगर का नाम जोड़कर अर्थ को आवश्यकता से अधिक निश्चित करने के बजाय सर्वनाम सुरक्षित रखे गए हैं।
translation_notes:
  register: भाषा आधुनिक, सहज और काव्यात्मक गरिमा वाली रखी गई है। स्त्रीलिंग सर्वनाम मूल के नगर-संदर्भ को सुरक्षित रखते हैं। मुख्य पाठ में स्वाभाविक हिन्दी “भोर होते ही” अपनाई गई है और अधिक शाब्दिक हिब्रू रूप पादटिप्पणी में दिया गया है।
