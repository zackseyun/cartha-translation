lexical_decisions:
- source_word: צֵידָהּ
  choice: उसकी भोजन-सामग्री
  rationale: צֵיד यहाँ सिय्योन के लिए उपलब्ध भोजन या रसद को सूचित करता है। ‘भोजन-सामग्री’ नगर की खाद्य-आपूर्ति का भाव स्पष्ट करता है और शिकार के भ्रामक अर्थ से बचता है। स्त्रीलिंग एकवचन प्रत्यय का संकेत निकटवर्ती सिय्योन की ओर है।
- source_word: בָּרֵךְ אֲבָרֵךְ
  choice: निश्चय ही आशीष दूँगा
  rationale: क्रिया के साथ infinitive absolute उसी क्रिया को प्रबल करता है; ‘निश्चय ही’ इस बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אֶבְיוֹנֶיהָ
  choice: उसके निर्धनों
  rationale: אֶבְיוֹן आर्थिक रूप से गरीब या अभावग्रस्त व्यक्ति को दर्शाता है। ‘निर्धनों’ गरिमापूर्ण और संदर्भानुकूल है; प्रत्यय सिय्योन की ओर संकेत करता है।
- source_word: אַשְׂבִּיעַ
  choice: तृप्त करूँगा
  rationale: שׂבע का हिफ़ील रूप भर देने या संतुष्ट करने का कारण बनने का अर्थ देता है। भोजन के संदर्भ में ‘तृप्त करूँगा’ पूर्ण संतोष का स्वाभाविक भाव देता है।
- source_word: לָחֶם
  choice: रोटी से
  rationale: मूल शब्द का ठोस अर्थ ‘रोटी’ है; इसे बनाए रखने से पद का प्रत्यक्ष खाद्य-बिंब सुरक्षित रहता है।
theological_decisions:
- issue: स्त्रीलिंग प्रत्ययों का संदर्भ
  choice: ‘उसकी’ और ‘उसके’ का संदर्भ सिय्योन से है
  alternative: यहोवा के निवास-स्थान का अधिक सामान्य संदर्भ
  rationale: भजन 132:13–14 के निकटवर्ती संदर्भ में स्त्रीलिंग एकवचन प्रत्यय सबसे स्वाभाविक रूप से सिय्योन की ओर लौटते हैं। सर्वनामात्मक रूप नगर के काव्यात्मक मानवीकरण को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट काव्यात्मक गद्य। ‘भोजन-सामग्री’ सामान्य पाठक के लिए बोधगम्य रहते हुए नगर की आपूर्ति का भाव रखता है; ‘निर्धनों’ और ‘तृप्त’ औपचारिक किंतु प्रचलित शब्द हैं।
