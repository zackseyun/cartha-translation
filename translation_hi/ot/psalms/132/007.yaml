source:
  edition: WLC
  text: נָב֥וֹאָה לְ/מִשְׁכְּנוֹתָ֑י/ו נִ֝שְׁתַּחֲוֶ֗ה לַ/הֲדֹ֥ם רַגְלָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/132/007.yaml
  text: Let us go into his dwelling place[b][a]; let us bow down at his footstool.
translation:
  language: hi
  text: आओ, हम उसके निवास-स्थानों में जाएँ; उसके चरणों की चौकी के सामने दण्डवत् करें।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נָבוֹאָה
  choice: आओ, हम जाएँ
  rationale: בוא के प्रथम पुरुष बहुवचन cohortative रूप में सामूहिक आग्रह है। ‘आओ, हम जाएँ’ आधुनिक हिन्दी में इस इच्छार्थक आह्वान को स्वाभाविक रूप से व्यक्त करता है।
- source_word: לְמִשְׁכְּנוֹתָיו
  choice: उसके निवास-स्थानों में
  rationale: מִשְׁכְּנוֹת बहुवचन है और उस पर तृतीय पुरुष एकवचन पुल्लिंग प्रत्यय है। ‘निवास-स्थानों’ से मूल बहुवचन सुरक्षित रहता है; ‘में’ प्रवेश की दिशात्मकता बताता है।
- source_word: נִשְׁתַּחֲוֶה
  choice: दण्डवत् करें
  rationale: यह रूप श्रद्धापूर्वक भूमि की ओर झुकने या स्वयं को नत करने की शारीरिक क्रिया बताता है। ‘दण्डवत् करें’ हिन्दी में उपासना-संदर्भ के भीतर उस ठोस मुद्रा को बनाए रखता है, जबकि केवल ‘आराधना करें’ अधिक व्यापक और व्याख्यात्मक होता।
- source_word: לַהֲדֹם רַגְלָיו
  choice: उसके चरणों की चौकी के सामने
  rationale: हिब्रू पदबंध का शाब्दिक भाव ‘उसके पैरों की चौकी’ है। ‘चरणों की चौकी’ श्रद्धापूर्ण, सुबोध हिन्दी है; ‘के सामने’ ל की यहाँ की दिशात्मक/स्थानवाचक भूमिका और दण्डवत् करने की मुद्रा के अनुकूल है।
theological_decisions:
- issue: ‘उसके’ का संदर्भ
  choice: सर्वनाम को ‘उसके’ ही रहने दिया गया है और उसका संदर्भ स्पष्ट नहीं किया गया।
  alternative: इसे विशेष रूप से यहोवा, वाचा के सन्दूक, या दाऊद द्वारा खोजे गए विश्राम-स्थान से जोड़ना।
  rationale: आस-पास के पदों में यहोवा के निवास, सन्दूक और सिय्योन की छवियाँ परस्पर जुड़ी हैं। हिब्रू इस पद में संदर्भ को स्पष्ट नहीं करता, इसलिए अनुवाद भी उस साहित्यिक और धर्मवैज्ञानिक तनाव को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, सामूहिक आह्वान वाली और गरिमापूर्ण रखी गई है। मूल का बहुवचन ‘निवास-स्थानों’ में सुरक्षित है। ‘दण्डवत्’ धार्मिक हिन्दी में परिचित है और मूल में व्यक्त शारीरिक रूप से झुकने के भाव को ‘आराधना’ की अपेक्षा अधिक सीधे व्यक्त करता है।
