  yaml_path: translation/ot/psalms/132/018.yaml
  text: I will clothe his enemies with shame[a], but on him his crown will flourish.
translation:
  language: hi
  text: 'मैं उसके शत्रुओं को लज्जा का वस्त्र पहनाऊँगा,

    पर उस पर उसका मुकुट खिलेगा[a]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘मुकुट’ के लिए प्रयुक्त इब्रानी शब्द का अर्थ राजकीय मुकुट या ‘किरीट’ भी हो सकता है। ‘खिलेगा’ वाली इब्रानी क्रिया अंकुरित होने या फूलने का चित्र प्रस्तुत करती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹיְבָיו
  choice: उसके शत्रुओं
  rationale: बहुवचन संज्ञा और तृतीय पुरुष एकवचन संबंधसूचक प्रत्यय का सीधा तथा स्वाभाविक हिन्दी रूप।
- source_word: אַלְבִּישׁ
  choice: मैं ... पहनाऊँगा
  rationale: हिफ़ील रूप में कर्ता की स्पष्ट प्रथम पुरुष एजेंसी और ‘वस्त्र पहनाने’ का रूपक सुरक्षित रहता है।
- source_word: בֹּשֶׁת
  choice: लज्जा
  rationale: ‘लज्जा पहनाना’ मूल के सशक्त वस्त्र-रूपक को बनाए रखता है; ‘अपमान’ भी संभव है, पर वह आंतरिक और सार्वजनिक दोनों प्रकार की लज्जा को उतनी व्यापकता से नहीं दर्शाता।
- source_word: וְעָלָיו
  choice: पर ... उस पर
  rationale: וְ को दोनों पंक्तियों के विरोध के कारण ‘पर’ और עָלָיו को स्थानसूचक ‘उस पर’ के रूप में रखा गया है।
- source_word: יָצִיץ
  choice: खिलेगा
  rationale: क्रिया के अंकुरित होने या फूलने के मूल चित्र को सीधे सुरक्षित रखता है; ‘फले-फूलेगा’ अर्थ-विस्तार है।
- source_word: נִזְרוֹ
  choice: उसका मुकुट
  rationale: दाऊदी राजकीय संदर्भ में נֵזֶר का ‘मुकुट’ स्वाभाविक है, जबकि शब्द के ‘अभिषेक/समर्पण’ संबंधी अर्थ को अनावश्यक रूप से पाठ में नहीं थोपा गया।
theological_decisions:
- issue: दाऊदी/सिय्योन भजन में נִזְרוֹ की राजकीय छवि
  choice: ‘उसका मुकुट’ रखा गया और उसके खिलने की काव्यात्मक छवि सुरक्षित रखी गई।
  alternative: ‘उसका अभिषेक/समर्पण खिलेगा’ या स्पष्ट मसीहाई व्याख्या
  rationale: प्रसंग राजकीय अर्थ का समर्थन करता है, पर पद स्वयं किसी अधिक विशिष्ट मसीहाई पहचान को स्पष्ट नहीं करता; इसलिए अनुवाद न तो उस संभावना को नकारता है, न उसे पाठ में जोड़ता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक रखी गई है। ‘लज्जा पहनाऊँगा’ तथा ‘मुकुट ... खिलेगा’ जैसे मूल रूपकों को सहज बनाने के नाम पर हटाया नहीं गया।
