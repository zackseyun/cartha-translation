  text: שִׁ֗יר הַֽ/מַּ֫עֲל֥וֹת זְכוֹר יְהוָ֥ה לְ/דָוִ֑ד אֵ֝ת כָּל עֻנּוֹתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/132/001.yaml
  text: A Song of Ascents[a]. Remember, O Yahweh[b], for David all his affliction.
translation:
  language: hi
  text: 'चढ़ाइयों का गीत।


    हे याहवे, दाऊद के लिए[a] उसके सारे कष्टों[b] को स्मरण कर।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “दाऊद के संबंध में।” इब्रानी पूर्वसर्ग का अर्थ दाऊद के हित में अथवा उसके संबंध में हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “उसके सारे दुःखों” अथवा “उसकी सारी दीनता।” इब्रानी शब्द कष्ट, दुःख या नीचा किए जाने की दशा को व्यक्त कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: चढ़ाइयों का गीत
  rationale: यह भजन-संग्रह के शीर्षक का निकट और स्वाभाविक हिन्दी रूप है; इससे ‘ऊपर चढ़ने’ का मूल भाव बना रहता है, पर इसकी ऐतिहासिक पृष्ठभूमि को अनावश्यक रूप से निश्चित नहीं किया जाता।
- source_word: זְכוֹר
  choice: स्मरण कर
  rationale: ईश्वर को संबोधित आज्ञार्थक प्रार्थना को संक्षिप्त और गरिमापूर्ण ढंग से व्यक्त करता है तथा अनुकूल होकर कार्य करने का भाव संदर्भ पर छोड़ता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी व्यक्तिवाचक ईश्वरीय नाम का देवनागरी लिप्यंतरण है; इसे किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: לְדָוִד
  choice: दाऊद के लिए
  rationale: לְ के हित अथवा संबंधसूचक अर्थ को संक्षेप में रखता है; हिन्दी वाक्यांश में मूल की कुछ अर्थगत व्यापकता बनी रहती है।
- source_word: כָּל עֻנּוֹתוֹ
  choice: उसके सारे कष्टों
  rationale: עֻנּוֹתוֹ दुःख, कठिनाई या नीचा किए जाने की दशा को व्यक्त कर सकता है। ‘सारे कष्टों’ प्रसंग में स्वाभाविक है और इस व्यापक अर्थ को किसी एक प्रकार के दुःख तक सीमित नहीं करता।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु
  rationale: मूल पाठ में उपाधि नहीं, परमेश्वर का विशिष्ट नाम है; इसलिए नाम को लिप्यंतरित किया गया है।
- issue: לְדָוִד में दाऊद से संबंध
  choice: दाऊद के लिए
  alternative: दाऊद के संबंध में
  rationale: यहाँ पूर्वसर्ग दाऊद के हित में की गई विनती अथवा उसके संबंध में स्मरण—दोनों का संकेत दे सकता है। मुख्य पाठ में स्वाभाविक ‘के लिए’ रखा गया और वैकल्पिक संबंधसूचक अर्थ टिप्पणी में बताया गया।
- issue: עֻנּוֹתוֹ का आशय
  choice: उसके सारे कष्टों
  alternative: उसकी सारी दीनता
  rationale: शब्द दुःख-कठिनाई, दीन किए जाने या आत्मत्याग जैसे निकट अर्थों को समेट सकता है। ‘कष्टों’ संदर्भ के अनुकूल व्यापक विकल्प है और इसे केवल अपमान या तपस्या तक सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, प्रार्थनात्मक और गरिमापूर्ण शैली रखी गई है। ‘स्मरण कर’ धार्मिक काव्य के अनुकूल है, पर सामान्य पाठक के लिए भी स्पष्ट है। शीर्षक में पारंपरिक अर्थ को बनाए रखते हुए तीर्थयात्रा जैसी अनिश्चित व्याख्या नहीं जोड़ी गई।
