source:
  edition: WLC
  text: אִֽם יִשְׁמְר֬וּ בָנֶ֨י/ךָ בְּרִיתִ/י֮ וְ/עֵדֹתִ֥/י ז֗וֹ אֲלַ֫מְּדֵ֥/ם גַּם בְּנֵי/הֶ֥ם עֲדֵי עַ֑ד יֵ֝שְׁב֗וּ לְ/כִסֵּא לָֽ/ךְ־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/132/012.yaml
  text: If your sons keep my covenant and my testimonies that I will teach them[a], then their sons also will sit on your throne forever.
translation:
  language: hi
  text: यदि तेरे पुत्र मेरी वाचा और मेरी उन आज्ञाओं[a] को मानें, जो मैं उन्हें सिखाऊँगा, तो उनके पुत्र भी सदा तेरे सिंहासन पर बैठेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रानी शब्द का शाब्दिक अर्थ “मेरी गवाहियाँ” या “मेरे साक्ष्य” है; अथवा “मेरी विधियाँ” या “मेरे नियम।”
    reason: עֵדֹתַי के विशिष्ट वाचागत अर्थ और सम्भव हिन्दी विकल्पों को सुरक्षित रखना।
lexical_decisions:
- source_word: אִם
  choice: यदि
  rationale: वास्तविक शर्त को स्पष्ट रूप से बनाए रखता है।
- source_word: יִשְׁמְרוּ
  choice: मानें
  rationale: वाचा और ईश्वरीय निर्देशों के प्रति निष्ठापूर्वक पालन का स्वाभाविक आधुनिक हिन्दी रूप।
- source_word: בָנֶיךָ
  choice: तेरे पुत्र
  rationale: मूल का पुल्लिंग बहुवचन और राजवंशीय उत्तराधिकार का संदर्भ बनाए रखता है।
- source_word: בְּרִיתִי
  choice: मेरी वाचा
  rationale: בְּרִית का स्थापित और धर्मवैज्ञानिक रूप से उपयुक्त हिन्दी पर्याय।
- source_word: וְעֵדֹתַי
  choice: और मेरी उन आज्ञाओं
  rationale: עֵדוֹת यहाँ परमेश्वर द्वारा सिखाए जाने वाले वाचागत निर्देशों को सूचित करता है; 'आज्ञाओं' से सामान्य पाठक अर्थ सहजता से समझता है, जबकि पादटिप्पणी शाब्दिक विकल्प सुरक्षित रखती है।
- source_word: זוֹ אֲלַמְּדֵם
  choice: जो मैं उन्हें सिखाऊँगा
  rationale: सम्बन्धवाचक זֹו को अगले उपवाक्य से जोड़ता और अपूर्ण क्रिया के भावी अर्थ को सशर्त प्रसंग में बनाए रखता है।
- source_word: גַּם בְּנֵיהֶם
  choice: तो उनके पुत्र भी
  rationale: גַּם का योगात्मक बल तथा राजवंशीय 'पुत्र' दोनों सुरक्षित रहते हैं; 'तो' हिन्दी में शर्त का परिणाम स्वाभाविक बनाता है।
- source_word: עֲדֵי עַד
  choice: सदा
  rationale: स्थायी निरंतरता का संक्षिप्त और स्वाभाविक हिन्दी रूप।
- source_word: יֵשְׁבוּ לְכִסֵּא לָךְ
  choice: तेरे सिंहासन पर बैठेंगे
  rationale: राजकीय सिंहासन ग्रहण करने की इब्रानी छवि को स्वाभाविक हिन्दी में बनाए रखता है।
theological_decisions:
- issue: दाऊद से की गई प्रतिज्ञा की इस पद में सशर्तता
  choice: 'पद को वास्तविक शर्त के रूप में अनूदित किया गया है: पुत्रों के वाचा-पालन पर उनके पुत्रों का सिंहासन पर बने रहना निर्भर है।'
  alternative: प्रतिज्ञा को मूलतः बिना शर्त मानकर इस शर्त को केवल आलंकारिक या अस्थायी समझना।
  rationale: אִם से आरम्भ होने वाली इब्रानी रचना स्पष्ट शर्त रखती है। व्यापक दाऊदी वाचा के साथ इस तनाव का समाधान अनुवाद में आरोपित नहीं किया गया।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। दाऊद को प्रत्यक्ष सम्बोधन होने के कारण एकवचन आत्मीय-गंभीर रूप 'तेरे' रखा गया है; राजवंशीय संदर्भ में 'पुत्र' बनाए रखा गया है।
