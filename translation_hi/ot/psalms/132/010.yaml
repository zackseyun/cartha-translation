lexical_decisions:
- source_word: בַּעֲבוּר
  choice: के कारण
  rationale: यह पदबंध किसी व्यक्ति के कारण या उसके वास्ते की गई विनती को व्यक्त करता है। यहाँ “के कारण” स्वाभाविक हिन्दी में दाऊद को आधार बनाकर की गई प्रार्थना का भाव रखता है।
- source_word: דָּוִד
  choice: दाऊद
  rationale: इब्रानी व्यक्तिवाचक नाम का हिन्दी बाइबलीय परंपरा में प्रचलित रूप।
- source_word: עַבְדֶּךָ
  choice: अपने दास
  rationale: עבד दास या सेवक को सूचित कर सकता है। राजकीय और वाचागत प्रार्थना में “दास” अधीनता और समर्पण को संक्षेप में व्यक्त करता है; “अपने” प्रत्यय ךָ को स्वाभाविक हिन्दी में दर्शाता है।
- source_word: אַל
  choice: न
  rationale: यह निषेधात्मक विनती है। हिन्दी में “न फेर” प्रार्थनापूर्ण निषेध को सहज और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: תָּשֵׁב
  choice: फेर
  rationale: שוב का यहाँ प्रयुक्त रूप ‘वापस मोड़ना/फेरना’ व्यक्त करता है। “मुख न फेर” मूल ठोस रूपक को बनाए रखता है; अर्थ की दृष्टि से “अस्वीकार न कर” संभव है और पादटिप्पणी में दिया गया है।
- source_word: פְּנֵי
  choice: मुख
  rationale: शाब्दिक अर्थ “चेहरा/मुख” है। “मुख फेरना” हिन्दी में भी समझ में आने वाला रूपक है, इसलिए अनुग्रह या स्वीकृति जैसे व्याख्यात्मक शब्द मुख्य पाठ में नहीं रखे गए।
- source_word: מְשִׁיחֶךָ
  choice: अपने अभिषिक्त जन
  rationale: इस संज्ञा का मूल अर्थ “अभिषिक्त व्यक्ति” है। “अभिषिक्त जन” तत्कालीन दाऊदी राजा के संदर्भ और व्यापक मसीही अनुगूँज—दोनों को बिना किसी एक की ओर अर्थ सीमित किए सुरक्षित रखता है।
theological_decisions:
- issue: क्या מְשִׁיחֶךָ को प्रत्यक्ष मसीही उपाधि के रूप में अनूदित किया जाए
  choice: अपने अभिषिक्त जन
  alternative: अपने मसीह
  rationale: निकट साहित्यिक संदर्भ दाऊद और दाऊदी शासक से जुड़ी विनती है। “अभिषिक्त जन” इब्रानी राजकीय पद का मूल अर्थ बनाए रखता है और व्यापक धर्मवैधानिक संदर्भ में उसके मसीही अर्थ की संभावना को बंद नहीं करता। “मसीह” को वैकल्पिक पाठ के रूप में पादटिप्पणी में सुरक्षित रखा गया है।
- issue: פְּנֵי ... תָּשֵׁב के रूपक को शाब्दिक रखा जाए या उसका आशय स्पष्ट किया जाए
  choice: मुख न फेर
  alternative: अस्वीकार न कर
  rationale: मूल पाठ का ठोस रूपक हिन्दी में बोधगम्य है। मुख्य पाठ में इसे बनाए रखने से काव्यात्मक तनाव सुरक्षित रहता है, जबकि पादटिप्पणी इसका प्रसंगगत आशय बताती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का संक्षिप्त, प्रार्थनापूर्ण और काव्यात्मक रूप अपनाया गया है। “दास,” “मुख न फेर,” और “अभिषिक्त जन” गरिमापूर्ण बाइबलीय भाषा रखते हुए सामान्य पाठक के लिए बोधगम्य हैं।
