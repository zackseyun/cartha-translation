lexical_decisions:
- source_word: עַד
  choice: जब तक
  rationale: यह पिछले पद में आरम्भ हुई शपथ की समय-सीमा बताता है; निषेधात्मक क्रिया के साथ ‘जब तक ... न’ स्वाभाविक हिन्दी है।
- source_word: אֶמְצָא
  choice: मैं ... न ढूँढ़ लूँ
  rationale: מצא का प्रथम पुरुष एकवचन अपूर्ण रूप शपथ के प्रसंग में भावी लक्ष्य व्यक्त करता है; ‘ढूँढ़ लूँ’ प्रयत्न और लक्ष्य की प्राप्ति दोनों को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: מָקוֹם
  choice: एक स्थान
  rationale: מקום किसी स्थान या जगह को दर्शाता है; यहाँ ‘स्थान’ उपासना-स्थल या पवित्रस्थान जैसी अधिक विशिष्ट धारणा आरोपित नहीं करता।
- source_word: לַיהוָה
  choice: याहवे के लिए
  rationale: ל उद्देश्य या हित का भाव देता है, और יהוה को वाचा-संबंधी व्यक्तिगत नाम ‘याहवे’ के रूप में लिप्यंतरित किया गया है।
- source_word: מִשְׁכָּנוֹת
  choice: निवास-स्थान[a]
  rationale: यह משכן का बहुवचन रूप है, पर प्रसंग में इसे एक सामूहिक अथवा गहन बहुवचन के रूप में भी समझा जा सकता है। मुख्य पाठ में स्वाभाविक हिन्दी रखी गई है और रूपगत बहुवचन की सूचना टिप्पणी में दी गई है।
- source_word: לַאֲבִיר
  choice: पराक्रमी के लिए
  rationale: אביר सामर्थ्य सूचित करने वाली दैवी उपाधि है; ‘पराक्रमी’ आधुनिक हिन्दी में संक्षिप्त, प्रतिष्ठित और स्पष्ट है।
- source_word: יַעֲקֹב
  choice: याकूब
  rationale: व्यक्तिवाचक नाम का प्रचलित हिन्दी बाइबलीय रूप रखा गया है; संबंधसूचक रचना ‘याकूब के पराक्रमी’ मूल के अर्थ को सुरक्षित रखती है।
theological_decisions:
- issue: दैवी नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चतुरक्षरीय व्यक्तिगत नाम सीधे प्रयुक्त है। ‘याहवे’ उसका स्रोत-सन्निकट आधुनिक लिप्यंतरण है और उसे उपाधि ‘प्रभु’ में नहीं बदलता।
- issue: מִשְׁכָּנוֹת के बहुवचन का अर्थ
  choice: मुख्य पाठ में ‘निवास-स्थान’, टिप्पणी में व्याकरणिक बहुवचन
  alternative: निवास-स्थान; निवासों; तंबुओं
  rationale: रूप व्याकरणतः बहुवचन है, जबकि समानांतर पदबंध ‘एक स्थान’ और प्रसंग एक उपयुक्त दैवी निवास की ओर संकेत कर सकते हैं। टिप्पणी इस तनाव को बिना निर्णायक रूप से सुलझाए सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है। वाक्य पिछले पद की शपथ को आगे बढ़ाता है, इसलिए ‘जब तक ... न ढूँढ़ लूँ’ रचना अपनाई गई है। ‘निवास-स्थान’ गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट है; टिप्पणी मूल के बहुवचन और उसके संभावित विकल्पों को सुरक्षित रखती है।
