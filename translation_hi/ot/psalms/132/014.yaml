  yaml_path: translation/ot/psalms/132/014.yaml
  text: This is my resting place forever; here I will dwell[a], for I have desired it.
translation:
  language: hi
  text: 'यह सदा के लिए मेरा विश्राम-स्थान है;

    मैं यहीं निवास करूँगा,

    क्योंकि मैंने इसी को चाहा है।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्योंकि मैंने उसी की अभिलाषा की है।” इब्रानी का स्त्रीलिंग प्रत्यय स्त्रीरूप में व्यक्त सिय्योन की ओर, अथवा इस विश्राम-स्थान की ओर संकेत कर सकता है।
    reason: मूल पाठ में स्त्रीलिंग प्रत्यय के संदर्भ और काव्यात्मक व्यक्तिकरण की वास्तविक अस्पष्टता को सुरक्षित रखना।
lexical_decisions:
- source_word: זֹאת
  choice: यह
  rationale: स्त्रीलिंग एकवचन संकेतवाचक सर्वनाम है, जो प्रसंग में सिय्योन अथवा अभी बताए गए विश्राम-स्थान की ओर संकेत करता है। हिंदी में ‘यह’ स्वाभाविक और पर्याप्त रूप से स्पष्ट है।
- source_word: מְנוּחָתִי
  choice: मेरा विश्राम-स्थान
  rationale: מְנוּחָה का अर्थ ‘विश्राम’ या ‘विश्राम-स्थान’ हो सकता है। आगे आए स्थानवाचक ‘यहीं’ के कारण यहाँ ठहरने के स्थान का ठोस अर्थ अधिक उपयुक्त है।
- source_word: עֲדֵי עַד
  choice: सदा के लिए
  rationale: यह मुहावरा निरंतर और स्थायी अवधि व्यक्त करता है। ‘सदा के लिए’ आधुनिक हिंदी में स्वाभाविक ढंग से उसकी स्थायित्व-भावना बनाए रखता है।
- source_word: פֹּה
  choice: यहीं
  rationale: स्थानवाचक क्रियाविशेषण का सीधा अनुवाद है। ‘यहीं’ मूल के संकेत और बल दोनों को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: אֵשֵׁב
  choice: मैं निवास करूँगा
  rationale: यद्यपि ישׁב का मूल अर्थ ‘बैठना’ भी है, सिय्योन में परमेश्वर के स्थायी ठहराव के इस प्रसंग में ‘निवास करना’ अधिक स्पष्ट और प्रसंगानुकूल है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यहाँ यह सिय्योन में निवास करने का कारण प्रस्तुत करता है; ‘क्योंकि’ इस संबंध को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: אִוִּתִיהָ
  choice: मैंने इसी को चाहा है
  rationale: क्रिया का अर्थ ‘चाहना’ या ‘अभिलाषा करना’ है और प्रत्यय स्त्रीलिंग एकवचन है। हिंदी का ‘इसी को’ निकटतम संदर्भ को बनाए रखता है, पर कृत्रिम रूप से व्यक्ति-वाचक स्त्रीलिंग सर्वनाम थोपता नहीं; संभावित स्त्री-व्यक्तिकरण को पादटिप्पणी में सुरक्षित रखा गया है।
theological_decisions:
- issue: אִוִּתִיהָ के स्त्रीलिंग प्रत्यय का संदर्भ
  choice: मुख्य पाठ में ‘इसी को’ रखा गया है, जो सिय्योन अथवा विश्राम-स्थान—दोनों संभावित संदर्भों के लिए हिंदी में स्वाभाविक है।
  alternative: ‘मैंने उसी की अभिलाषा की है,’ जहाँ ‘उसी’ को स्त्रीरूप में व्यक्त सिय्योन माना जाए।
  rationale: इब्रानी स्त्रीलिंग प्रत्यय सिय्योन के स्त्री-व्यक्तिकरण की ओर संकेत कर सकता है, पर वह स्त्रीलिंग संज्ञा מְנוּחָה/स्थानगत अवधारणा की ओर भी लौट सकता है। हिंदी में सर्वनाम का कृत्रिम लिंगांकन अस्पष्टता को अनावश्यक रूप से सुलझा देगा; इसलिए मुख्य पाठ स्वाभाविक अस्पष्टता रखता है और पादटिप्पणी दोनों संभावनाएँ बताती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। काव्यात्मक पंक्ति-विन्यास तथा ‘विश्राम-स्थान’, ‘निवास’ और ‘सदा के लिए’ जैसे शब्द भजन की गंभीरता और स्थायित्व-भाव को बनाए रखते हैं।
