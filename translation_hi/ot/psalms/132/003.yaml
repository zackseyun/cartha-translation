  text: Surely I will not enter the tent of my house[b][a]; surely I will not go up onto the bed of my couch—
translation:
  language: hi
  text: 'निश्चय ही मैं अपने घर के तंबू में प्रवेश नहीं करूँगा[a],

    निश्चय ही मैं अपने बिछौने वाले पलंग पर नहीं चढ़ूँगा[b]—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू में शपथ का सूत्र दो बार ‘यदि’ कहता है—शाब्दिक रूप से, ‘यदि मैं प्रवेश करूँ ... यदि मैं चढ़ूँ ...।’ इस संदर्भ में इसका अर्थ है, ‘निश्चय ही मैं प्रवेश नहीं करूँगा ... निश्चय ही मैं नहीं चढ़ूँगा।’
    reason: lexical_alternative
  - marker: b
    text: या, ‘अपने विश्राम-स्थान की खाट पर’ या ‘अपनी शय्या के बिछौने पर।’ हिब्रू में सोने या लेटने के स्थान के लिए दो निकटार्थी शब्द काव्यात्मक रूप से साथ रखे गए हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: निश्चय ही ... नहीं
  rationale: पिछले पद से जारी शपथ-सूत्र में אִם का शाब्दिक अर्थ ‘यदि’ है, पर यहाँ इसका आशय स्वयं पर विपत्ति बुलाने वाली प्रतिज्ञा के कारण दृढ़ निषेध है। मुख्य पाठ में इसका स्वाभाविक हिंदी अर्थ दिया गया है और शाब्दिक रूप पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: אָבֹא
  choice: मैं ... प्रवेश करूँगा
  rationale: בוא का प्रथम पुरुष एकवचन अपूर्ण रूप यहाँ प्रतिज्ञा के अंतर्गत भावी कार्य व्यक्त करता है; ‘प्रवेश करना’ तंबू के साथ स्वाभाविक और ठोस गति-सूचक अनुवाद है।
- source_word: בְּאֹהֶל בֵּיתִי
  choice: अपने घर के तंबू में
  rationale: ‘तंबू’ और ‘घर’ दोनों हिब्रू संज्ञाओं को बनाए रखने से असामान्य किंतु सजीव काव्यात्मक चित्र नहीं मिटता।
- source_word: אֶעֱלֶה עַל
  choice: मैं ... पर चढ़ूँगा
  rationale: עלה और עַל का स्थानिक भाव ‘ऊपर जाना/पर चढ़ना’ है। शय्या पर जाने के संदर्भ में ‘पर चढ़ना’ हिंदी में बोधगम्य रहते हुए मूल बिंब सुरक्षित रखता है।
- source_word: עֶרֶשׂ יְצוּעָי
  choice: अपनी शय्या के बिछौने
  rationale: दो निकटार्थी निद्रा-स्थान संबंधी शब्दों को ‘शय्या’ और ‘बिछौना’ से अलग-अलग व्यक्त किया गया है, ताकि काव्यात्मक युग्म और उसकी संभावित अस्पष्टता बनी रहे।
theological_decisions:
- issue: शपथ-सूत्र का निहित निषेध
  choice: 'मुख्य पाठ में दृढ़ निषेध: ‘निश्चय ही ... नहीं’'
  alternative: शाब्दिक ‘यदि मैं ... यदि मैं ...’
  rationale: संदर्भ में अधूरा शर्त-वाक्य स्वयं पर विपत्ति बुलाने वाली शपथ है; केवल ‘यदि’ रखने से आधुनिक पाठक अर्थ खो सकता है। पादटिप्पणी शाब्दिक संरचना बताती है और मूल की आलंकारिक तीव्रता सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिंदी का गरिमापूर्ण काव्यात्मक स्तर रखा गया है। ‘तंबू,’ ‘शय्या’ और ‘बिछौना’ मूल के ठोस बिंब तथा निकटार्थी समानांतरता बनाए रखते हैं; वाक्य के अंत का दीर्घ विराम अगले पद में प्रतिज्ञा जारी रहने का संकेत देता है।
