  yaml_path: translation/ot/psalms/132/017.yaml
  text: There I will cause a horn to sprout for David[b][a]; I have prepared a lamp for my anointed one.
translation:
  language: hi
  text: वहाँ मैं दाऊद के लिए एक सींग उगाऊँगा[a]; मैंने अपने अभिषिक्त के लिए एक दीपक तैयार किया है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘मैं दाऊद के लिए एक सींग बढ़ाऊँगा।’ ‘सींग’ इब्रानी में सामर्थ्य या राजकीय शक्ति का बिंब है।
    reason: lexical_alternative
  - marker: b
    text: या ‘मेरे मसीह के लिए।’ इब्रानी में ‘मेरे अभिषिक्त के लिए’ है; यहाँ इसका पहला संकेत दाऊदी राजा की ओर है, पर इसमें व्यापक मसीही अनुगूँज भी हो सकती है।
    reason: alternative_reading
lexical_decisions:
- source_word: שָׁם
  choice: वहाँ
  rationale: यह स्थानवाचक क्रियाविशेषण निकट संदर्भ में सिय्योन की ओर संकेत करता है; ‘वहाँ’ स्वाभाविक है और स्थान पर बल बनाए रखता है।
- source_word: אַצְמִיחַ
  choice: मैं ... उगाऊँगा
  rationale: צמח के हिफ़ील रूप का कारणवाचक अर्थ ‘उगाना’ है; यह कृषि-संबंधी रूपक को बनाए रखता है।
- source_word: קֶרֶן
  choice: सींग
  rationale: शाब्दिक बिंब ‘सींग’ इब्रानी में सामर्थ्य और राजकीय शक्ति का रूपक है; मुख्य पाठ में बिंब को सुरक्षित रखा गया है।
- source_word: לְדָוִד
  choice: दाऊद के लिए
  rationale: לְ का लाभ अथवा संबंधसूचक अर्थ सीधे रूप में व्यक्त होता है और पाठ में ‘वंश’ जोड़ने से बचता है।
- source_word: עָרַכְתִּי
  choice: मैंने ... तैयार किया है
  rationale: ערך का अर्थ व्यवस्थित करना अथवा तैयार करना है; ‘दीपक’ के साथ ‘तैयार किया’ स्वाभाविक और अर्थ-संगत है।
- source_word: נֵר
  choice: दीपक
  rationale: נֵר का ठोस अर्थ ‘दीपक’ है; वंश की निरंतरता या स्थायी शासन का संभावित रूपक बिना व्याख्यात्मक विस्तार के सुरक्षित रहता है।
- source_word: לִמְשִׁיחִי
  choice: अपने अभिषिक्त जन के लिए
  rationale: מָשִׁיחַ का मूल अर्थ ‘अभिषिक्त’ है। ‘अभिषिक्त जन’ आधुनिक हिन्दी में स्वाभाविक है और तत्कालीन दाऊदी राजा तथा व्यापक मसीही संकेत—दोनों की संभावना खुली रखता है।
theological_decisions:
- issue: दाऊदी राजकीय संदर्भ में מְשִׁיחִי का अनुवाद
  choice: अपने अभिषिक्त जन
  alternative: अपने मसीह
  rationale: निकट संदर्भ में यह सबसे पहले यहोवा के अभिषिक्त दाऊदी राजा को सूचित करता है। मुख्य पाठ में ‘अभिषिक्त जन’ इब्रानी अर्थ को स्पष्ट रखता है, जबकि ‘मेरे मसीह’ की व्यापक मसीही अनुगूँज पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज शैली। मूल इब्रानी के ‘सींग’ और ‘दीपक’ बिंबों को बनाए रखा गया है; अस्पष्टता को व्याख्यात्मक पदों से सीमित नहीं किया गया।
