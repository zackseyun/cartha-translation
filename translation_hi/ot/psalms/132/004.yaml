base_translation:
  language: en
  yaml_path: translation/ot/psalms/132/004.yaml
  text: I will not give sleep to my eyes[a], nor slumber to my eyelids—
translation:
  language: hi
  text: 'मैं अपनी आँखों में नींद नहीं आने दूँगा,

    न अपनी पलकों पर झपकी नहीं आने दूँगा—[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी में शाब्दिक रूप से: “यदि मैं अपनी आँखों को नींद दूँ, अपनी पलकों को झपकी दूँ…” यह एक शपथ-सदृश अभिव्यक्ति है, जिसका आशय है: “मैं … नहीं दूँगा।”'
    reason: मूल की अधूरी शपथ-संरचना और मुख्य पाठ में उसके अर्थपरक अनुवाद को स्पष्ट करना।
lexical_decisions:
- source_word: אִם
  choice: न … दूँगा
  rationale: यहाँ אִם साधारण शर्त नहीं, बल्कि अधूरी शपथ-सूत्र शैली है; हिंदी में नकारात्मक संकल्प इसका स्वाभाविक अर्थ व्यक्त करता है।
- source_word: אֶתֵּן
  choice: लेने दूँगा
  rationale: मूल अर्थ ‘दूँगा’ है, पर आँखों को नींद ‘देना’ हिंदी में अस्वाभाविक है; ‘नींद न लेने दूँगा’ वही कर्तृ-संकल्प और बिंब सहज रूप में रखता है।
- source_word: שְׁנַת
  choice: नींद
  rationale: यह संज्ञा सामान्य नींद को दर्शाती है और आँखों के साथ स्वाभाविक हिंदी प्रयोग है।
- source_word: לְעֵינַי
  choice: अपनी आँखों को
  rationale: לְ यहाँ अप्रत्यक्ष कर्म सूचित करता है; ‘अपनी आँखों को’ मूल शारीरिक बिंब बनाए रखता है।
- source_word: לְעַפְעַפַּי
  choice: अपनी पलकों को
  rationale: עפעף का अर्थ ‘पलक’ है; यह आँखों के साथ काव्यात्मक समानांतरता सुरक्षित रखता है।
- source_word: תְּנוּמָה
  choice: झपकी
  rationale: यह ‘नींद’ से मिलता-जुलता किंतु अलग शब्द है; ‘झपकी’ हिंदी में हल्की नींद का भाव देकर मूल की शब्द-विविधता बनाए रखती है।
theological_decisions:
- issue: אִם से आरंभ अधूरी शपथ का अर्थ
  choice: 'स्पष्ट नकारात्मक संकल्प: ‘न … दूँगा’'
  alternative: शाब्दिक ‘यदि मैं … दूँ’
  rationale: मूल में शाप का परिणाम अनकहा छोड़कर शपथ व्यक्त की गई है। अकेला शाब्दिक ‘यदि’ हिंदी में वाक्य को अधूरा और भ्रामक बनाएगा; इसलिए मुख्य पाठ में आशय दिया गया और पादटिप्पणी में मूल रूप सुरक्षित रखा गया।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिंदी। दो समानांतर पंक्तियाँ मूल काव्य-संतुलन को बनाए रखती हैं; ‘नींद’ और ‘झपकी’ अलग-अलग इब्रानी संज्ञाओं का भेद दर्शाते हैं।
