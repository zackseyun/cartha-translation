source:
  edition: WLC
  text: וְֽ֭/כֹהֲנֶי/הָ אַלְבִּ֣ישׁ יֶ֑שַׁע וַ֝/חֲסִידֶ֗י/הָ רַנֵּ֥ן יְרַנֵּֽנוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/132/016.yaml
  text: And I will clothe her priests with salvation[b][a], and her faithful ones will shout for joy.
translation:
  language: hi
  text: 'और मैं उसके याजकों को उद्धार का वस्त्र पहनाऊँगा,

    और उसके निष्ठावान जन आनन्द से जयजयकार करेंगे।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כֹהֲנֶיהָ
  choice: उसके याजकों
  rationale: स्त्रीलिंग एकवचन प्रत्यय संदर्भ में सिय्योन की ओर संकेत करता है; हिन्दी में व्यक्तिवाचक नगर के लिए ‘उसके’ स्वाभाविक है।
- source_word: אַלְבִּישׁ
  choice: वस्त्र पहनाऊँगा
  rationale: हिफ़ील रूप का अर्थ ‘पहनाना’ है। ‘वस्त्र पहनाऊँगा’ उद्धार से ढकने के रूपक को स्पष्ट और स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: יֶשַׁע
  choice: उद्धार
  rationale: यह शब्द उद्धार, छुटकारे या विजय का बोध करा सकता है; ‘उद्धार’ यहाँ व्यापक अर्थ और धार्मिक भार को सुरक्षित रखता है।
- source_word: חֲסִידֶיהָ
  choice: उसके निष्ठावान जन
  rationale: חסיד वाचा-संबंधी निष्ठा और भक्ति से पहचाने जाने वालों को दर्शाता है। ‘निष्ठावान जन’ बाद की पारिभाषिक धारणाएँ जोड़े बिना इस भाव को सामान्य आधुनिक हिन्दी में व्यक्त करता है।
- source_word: רַנֵּן יְרַנֵּנוּ
  choice: आनन्द से जयजयकार करेंगे
  rationale: क्रिया की पुनरुक्ति तीव्रता और निश्चितता व्यक्त करती है; ‘आनन्द से जयजयकार करेंगे’ उत्साहपूर्ण ऊँची स्तुति को सहज हिन्दी में संप्रेषित करता है।
theological_decisions:
- issue: חֲסִידֶיהָ का वाचा और उपासना के संदर्भ में अनुवाद
  choice: उसके निष्ठावान जन
  alternative: उसके भक्त जन / उसके पवित्र जन
  rationale: ‘निष्ठावान जन’ वाचा की निष्ठा और समर्पण को सुरक्षित रखता है, जबकि ‘पवित्र जन’ ऐसी बाद की पारिभाषिक छाया ला सकता है जो मूल शब्द में आवश्यक नहीं है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, काव्यात्मक और सामान्य पाठक के लिए सुबोध शैली। समानांतर पंक्तियों तथा ‘उद्धार का वस्त्र’ के रूपक को बनाए रखा गया है।
