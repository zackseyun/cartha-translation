  yaml_path: translation/ot/psalms/132/000.yaml
  text: A Song of Ascents[a]. Remember, Yahweh[b], for David all his affliction.
translation:
  language: hi
  text: 'चढ़ाइयों का गीत।[a]


    हे यहोवा, दाऊद के सारे कष्ट स्मरण कर।[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “आरोहणों का गीत।” यह उन पंद्रह भजनों का शीर्षक है जिन्हें सम्भवतः यरूशलेम की यात्रा में ऊपर चढ़ते समय गाया जाता था; इसका सटीक आशय निश्चित नहीं है।
    reason: historical_lexical_ambiguity
  - marker: b
    text: हिब्रू में, “दाऊद के लिए उसकी सारी पीड़ा।” “दाऊद के लिए” का अर्थ “दाऊद के विषय में” अथवा “दाऊद के पक्ष में” भी हो सकता है। “कष्ट” के लिए प्रयुक्त हिब्रू शब्द पीड़ा, कठिनाई या दीन किए जाने की दशा को भी व्यक्त कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: आरोहणों का गीत
  rationale: यह पारंपरिक शीर्षक का निकट और सुबोध रूप है। מַעֲלוֹת का मूल अर्थ ऊपर चढ़ने या आरोहण से जुड़ा है, यद्यपि शीर्षक का सटीक ऐतिहासिक आशय अनिश्चित है।
- source_word: זְכוֹר
  choice: स्मरण कर
  rationale: हिब्रू आज्ञार्थक रूप को सीधे रखा गया है; यहाँ स्मरण का अर्थ केवल मन में याद करना नहीं, बल्कि ध्यान देकर उसके अनुरूप कार्य करना भी हो सकता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: व्यक्तिगत ईश्वरीय नाम יהוה को सामान्य उपाधि से बदलने के बजाय हिन्दी में प्रचलित नामरूप से व्यक्त किया गया है।
- source_word: לְדָוִד
  choice: दाऊद के लिए
  rationale: לְ का सीधा संबंध बनाए रखते हुए अनावश्यक रूप से यह निश्चित नहीं किया गया कि इसका अर्थ केवल ‘दाऊद की ओर से’ है या ‘दाऊद के विषय में’।
- source_word: כָּל־עֻנּוֹתוֹ
  choice: उसके सारे दुःखों
  rationale: עֻנּוֹתֹו दुःख, कष्ट अथवा दीन किए जाने की दशा को समेट सकता है। हिन्दी में ‘सारे दुःखों’ सामूहिक अर्थ और כָּל दोनों को स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: यहोवा से दाऊद के लिए स्मरण करने की प्रार्थना
  choice: ‘दाऊद के लिए ... स्मरण कर’ की खुली संरचना रखी गई
  alternative: ‘दाऊद के पक्ष में उसके सारे दुःख याद कर’
  rationale: मूल पाठ यह स्पष्ट नहीं करता कि स्मरण का अपेक्षित फल प्रतिफल, दया या वाचा की पूर्ति में से कौन-सा है; अनुवाद ने इस धार्मिक तनाव को नहीं सुलझाया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और प्रार्थनात्मक रखी गई है। ‘हे यहोवा’ सम्बोधन की गंभीरता बनाए रखता है, जबकि वाक्य-विन्यास साधारण हिन्दी पाठक के लिए सहज है।
