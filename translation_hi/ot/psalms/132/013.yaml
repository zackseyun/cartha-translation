  yaml_path: translation/ot/psalms/132/013.yaml
  text: For Yahweh has chosen Zion[a]; he has desired it for his dwelling place.
translation:
  language: hi
  text: क्योंकि याहवे ने सिय्योन[a] को चुना है; उसने उसे अपने निवास के लिए चाहा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में ‘उसे’ के लिए स्त्रीलिंग प्रत्यय है, जो सिय्योन की ओर संकेत करता है। यह सिय्योन के काव्यात्मक मानवीकरण का संकेत भी हो सकता है।
    reason: मूल भाषा की व्याकरणिक सूक्ष्मता और संभावित काव्यात्मक प्रभाव को सुरक्षित रखना।
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पद पिछले कथन का आधार बताता है; ‘क्योंकि’ कारणसूचक संबंध को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: בָחַר
  choice: चुना है
  rationale: क्रिया का अर्थ ‘चुनना’ है। पूर्ण कार्य के वर्तमान महत्व को हिंदी का पूर्णकाल स्वाभाविक रूप से व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: यह परमेश्वर के व्यक्तिगत नाम YHWH का हिंदी लिप्यंतरण है; इसे किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: בְּצִיּוֹן
  choice: सिय्योन को
  rationale: בחר के साथ ב चुनी गई वस्तु या जगह को चिह्नित करता है; हिंदी में कर्मचिह्न ‘को’ अर्थ को सहजता से व्यक्त करता है।
- source_word: אִוָּהּ
  choice: उसने उसे … बनाने की अभिलाषा की है
  rationale: אוה प्रबल इच्छा या अभिलाषा व्यक्त करता है। ‘अभिलाषा की है’ काव्यात्मक गरिमा और मूल की भाव-तीव्रता बनाए रखता है।
- source_word: לְמוֹשָׁב לוֹ
  choice: अपना निवास बनाने
  rationale: מוֹשָׁב निवास या रहने के स्थान को दर्शाता है और לוֹ स्वयं याहवे के लिए होने का भाव देता है; ‘अपना निवास बनाने’ हिंदी में दोनों को स्वाभाविक रूप से समेटता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम सीधे आया है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और नाम को उपाधि में नहीं बदलता।
- issue: सिय्योन के लिए स्त्रीलिंग प्रत्यय
  choice: हिंदी में लिंग-निरपेक्ष ‘उसे’, साथ में पादटिप्पणी
  alternative: सिय्योन का स्त्रीरूप में मानवीकरण स्पष्ट करना
  rationale: इब्रानी प्रत्यय स्त्रीलिंग है और सिय्योन की ओर संकेत करता है, पर हिंदी ‘उसे’ में लिंग प्रकट नहीं होता। पादटिप्पणी मूल की संभावित काव्यात्मक व्यक्ति-कल्पना को सुरक्षित रखती है, बिना मुख्य पाठ पर उसे थोपे।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक रखी गई है। ‘अभिलाषा’ सामान्य ‘इच्छा’ से कुछ अधिक प्रबल चाह व्यक्त करती है और भजन की शैली के अनुकूल है।
