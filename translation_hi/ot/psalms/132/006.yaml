  text: הִנֵּֽה שְׁמַֽעֲנ֥וּ/הָ בְ/אֶפְרָ֑תָה מְ֝צָאנ֗וּ/הָ בִּ/שְׂדֵי יָֽעַר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/132/006.yaml
  text: Look, we heard of it in Ephrathah; we found it in the fields of Jaar.
translation:
  language: hi
  text: देखो, हमने एप्राता में उसके बारे में सुना; हमने उसे यार[a] के मैदानों में पाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '“यार” को यहाँ स्थान-नाम समझा गया है; इब्रानी शब्द का अर्थ “वन” भी हो सकता है: “वन के मैदानों में।”'
    reason: इब्रानी יָעַר को उचित नाम अथवा सामान्य संज्ञा, दोनों रूपों में समझना संभव है।
lexical_decisions:
- source_word: הִנֵּה
  choice: देखो
  rationale: ध्यान आकर्षित करने वाले इस उद्गार का आधुनिक, स्वाभाविक और सीधे संबोधित करने वाला हिन्दी रूप।
- source_word: שְׁמַעֲנוּהָ
  choice: हमने उसके बारे में सुना
  rationale: स्त्रीलिंग एकवचन प्रत्यय को हिन्दी में संदर्भसूचक ‘उसके बारे में’ से व्यक्त किया गया है; पद में उसका स्पष्ट नाम न जोड़कर मूल की संदर्भगत अस्पष्टता सुरक्षित रखी गई है।
- source_word: אֶפְרָתָה
  choice: एप्राता
  rationale: इब्रानी स्थान-नाम का निकट देवनागरी लिप्यंतरण।
- source_word: מְצָאנוּהָ
  choice: हमने उसे … पाया
  rationale: मूल के स्त्रीलिंग एकवचन कर्म-प्रत्यय को स्वाभाविक हिन्दी सर्वनाम से व्यक्त किया गया है, बिना उसके संदर्भ को व्याख्यात्मक रूप से निर्धारित किए।
- source_word: בִּשְׂדֵי יָעַר
  choice: यार के मैदानों में
  rationale: ‘यार’ को स्थान-नाम मानने वाली प्रचलित समझ अपनाई गई है; साथ ही शब्द के सामान्य अर्थ ‘वन’ की संभावना पादटिप्पणी में रखी गई है।
theological_decisions:
- issue: स्त्रीलिंग सर्वनाम का संदर्भ
  choice: ‘उसके/उसे’ कहकर संदर्भ अनिर्दिष्ट रखा गया
  alternative: ‘वाचा के सन्दूक के बारे में/उसे’
  rationale: निकटवर्ती संदर्भ से वाचा का सन्दूक अभिप्रेत हो सकता है, पर इस पद में उसका नाम नहीं है; उसे जोड़ना मूल की काव्यात्मक और संदर्भगत अस्पष्टता को समाप्त कर देता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘देखो’ अंग्रेज़ी परामर्श-पाठ तथा इब्रानी הִנֵּה की प्रत्यक्ष ध्यानाकर्षक शक्ति को बनाए रखता है। समानांतर पंक्तियों की संक्षिप्त काव्यात्मक संरचना सुरक्षित है।
