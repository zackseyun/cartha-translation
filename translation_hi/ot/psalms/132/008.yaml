id: PSA.132.8
reference: Psalms 132:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: קוּמָ֣/ה יְ֭הוָה לִ/מְנוּחָתֶ֑/ךָ אַ֝תָּ֗ה וַ/אֲר֥וֹן עֻזֶּֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/132/008.yaml
  text: Arise[a], O Yahweh, to your resting place[b], you and the ark of your strength.
translation:
  language: hi
  text: उठ, हे याहवे, अपने विश्राम-स्थान[a] में आ—तू और तेरे सामर्थ्य का सन्दूक।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने विश्राम में।” इब्रानी शब्द विश्राम की अवस्था या विश्राम के स्थान—दोनों को दर्शा सकता है; यहाँ संभवतः वह स्थान अभिप्रेत है जहाँ याहवे अपनी स्थायी उपस्थिति स्थापित करता है।
    reason: lexical_alternative
  - marker: b
    text: या, “तेरी शक्ति का सन्दूक” अथवा भावार्थ, “वह सन्दूक जो तेरे सामर्थ्य को प्रकट करता है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: קוּמָה
  choice: उठ
  rationale: यह קום का आज्ञार्थक रूप है। ‘उठ’ परमेश्वर से कार्य करने अथवा अपना निर्धारित स्थान ग्रहण करने की काव्यात्मक पुकार को सीधे और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: לִמְנוּחָתֶךָ
  choice: अपने विश्राम-स्थान में
  rationale: מְנוּחָה का अर्थ ‘विश्राम’ अथवा ‘विश्राम-स्थान’ हो सकता है। सन्दूक और पवित्रस्थान के प्रसंग में स्थानवाचक अर्थ अधिक स्वाभाविक है, फिर भी विकल्प को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: אַתָּה
  choice: तू
  rationale: स्वतंत्र सर्वनाम को बनाए रखने से इब्रानी का बल और आगे आने वाले ‘सन्दूक’ के साथ उसका समन्वय सुरक्षित रहता है। याहवे को संबोधित प्रार्थना में ‘तू’ निकट और काव्यात्मक है, अनादरपूर्ण नहीं।
- source_word: וַאֲרוֹן
  choice: और ... सन्दूक
  rationale: इस उपासना-संबंधी प्रसंग में אֲרוֹן इस्राएल के पवित्र सन्दूक को दर्शाता है। ‘वाचा का’ जोड़ना संदर्भानुकूल होता, पर मूल पद में नहीं है, इसलिए नहीं जोड़ा गया।
- source_word: עֻזֶּךָ
  choice: तेरे सामर्थ्य का
  rationale: עֹז का सीधा अर्थ ‘सामर्थ्य’, ‘शक्ति’ या ‘पराक्रम’ है। संबंधकारक रचना को बनाए रखने से मूल की संक्षिप्त काव्यात्मक अभिव्यक्ति और उसका अर्थगत तनाव सुरक्षित रहता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और उसे किसी उपाधि से प्रतिस्थापित नहीं करता।
- issue: ‘तेरे सामर्थ्य का सन्दूक’ का आशय
  choice: संबंधकारक अभिव्यक्ति को यथासंभव बनाए रखना
  alternative: तेरा सामर्थी सन्दूक; वह सन्दूक जो तेरे सामर्थ्य को प्रकट करता है
  rationale: यह वाक्यांश सन्दूक को याहवे की सामर्थ्यवान उपस्थिति से जोड़ता है, पर उस संबंध को स्पष्ट रूप से परिभाषित नहीं करता। शाब्दिक संरचना उस वास्तविक अस्पष्टता और काव्यात्मक घनत्व को सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और प्रार्थनात्मक-काव्यात्मक रखी गई है। ‘उठ ... आ’ हिन्दी में गंतव्य की ओर बढ़ने की पुकार को स्वाभाविक बनाता है। संबोधन में ‘तू/तेरे’ भजन की निकटता और एकवचन इब्रानी रूप को बनाए रखते हैं।
