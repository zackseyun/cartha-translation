    reason: ईश्वरीय नाम के मूल इब्रानी रूप को स्पष्ट करना।
lexical_decisions:
- source_word: אֲשֶׁר
  choice: जिसने
  rationale: यह संबंधवाचक पद पिछले पद के दाऊद की ओर संकेत करता है; हिन्दी में कर्तृवाचक संबंध के लिए ‘जिसने’ स्वाभाविक है।
- source_word: נִשְׁבַּע
  choice: शपथ खाई
  rationale: निफ़अल रूप का अर्थ ‘शपथ खाना’ है; यह हिन्दी में गंभीर और प्रचलित अभिव्यक्ति है।
- source_word: לַיהוָה
  choice: याहवे से
  rationale: ל यहाँ उस व्यक्ति को चिह्नित करता है जिसके प्रति शपथ खाई गई; हिन्दी में ‘से शपथ खाना’ स्वाभाविक है। יהוה को उसके व्यक्तिगत वाचा-नाम ‘याहवे’ के रूप में रखा गया है।
- source_word: נָדַר
  choice: मन्नत मानी
  rationale: נדר मन्नत या प्रतिज्ञा करने को व्यक्त करता है; ‘मन्नत मानी’ सामान्य हिन्दी में स्पष्ट है और शपथ के समानांतर क्रिया बनी रहती है।
- source_word: לַאֲבִיר יַעֲקֹב
  choice: याकूब के सामर्थी से
  rationale: אֲבִיר का मूल भाव ‘सामर्थी/पराक्रमी जन’ है और यह यहाँ परमेश्वर की उपाधि है। ‘याकूब के सामर्थी’ शीर्षक की संक्षिप्तता और काव्यात्मक गरिमा को बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में चार-अक्षरी व्यक्तिगत नाम सीधे आया है। ‘याहवे’ उसे सामान्य उपाधि में बदलने के बजाय नाम के रूप में प्रस्तुत करता है; पाठक-सहायता के लिए पादटिप्पणी दी गई है।
- issue: אֲבִיר को ईश्वरीय उपाधि के रूप में प्रस्तुत करना
  choice: याकूब के सामर्थी
  alternative: याकूब के पराक्रमी परमेश्वर
  rationale: मूल में ‘परमेश्वर’ शब्द स्पष्ट रूप से नहीं है। संक्षिप्त उपाधि रखने से मूल की काव्यात्मकता बनी रहती है और अनावश्यक व्याख्यात्मक विस्तार नहीं जुड़ता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और काव्यात्मक हिन्दी। पद पिछले वाक्य से जुड़ा संबंधवाचक खंड है, इसलिए अंत में मूल के अनुरूप द्विबिंदु रखा गया है। ‘शपथ खाई’ और ‘मन्नत मानी’ इब्रानी समानांतरता को सहज हिन्दी में सुरक्षित रखते हैं।
