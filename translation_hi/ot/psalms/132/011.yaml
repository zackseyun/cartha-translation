source:
  edition: WLC
  text: נִשְׁבַּֽע יְהוָ֨ה לְ/דָוִ֡ד אֱמֶת֮ לֹֽא יָשׁ֪וּב מִ֫מֶּ֥/נָּה מִ/פְּרִ֥י בִטְנְ/ךָ֑ אָ֝שִׁ֗ית לְ/כִסֵּא לָֽ/ךְ־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/132/011.yaml
  text: 'Yahweh swore to David a sure oath[b][a]; he will not turn back from it: “From the fruit of your womb I will set one on your throne.”'
translation:
  language: hi
  text: 'याहवे ने दाविद से अटल शपथ खाई; वह उससे पीछे नहीं हटेगा: “तेरी देह के फल में से एक को मैं तेरे सिंहासन पर बैठाऊँगा।”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נִשְׁבַּע
  choice: शपथ खाई है
  rationale: निफ़अल रूप यहाँ शपथ लेने को व्यक्त करता है। हिन्दी में पूर्ण क्रिया वर्तमान तक स्थिर उस शपथ के प्रभाव को स्वाभाविक रूप से दिखाती है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: אֱמֶת
  choice: पक्की शपथ
  rationale: शाब्दिक अर्थ ‘सत्य’ है, पर शपथ के साथ यह उसकी निश्चितता और विश्वसनीयता पर बल देता है। ‘पक्की शपथ’ साधारण आधुनिक हिन्दी में यही भाव स्पष्ट करती है।
- source_word: לֹא יָשׁוּב מִמֶּנָּה
  choice: वह उससे पीछे नहीं हटेगा
  rationale: שׁוב מן पीछे फिरने या किसी प्रतिज्ञा से हटने का भाव देता है; स्त्रीलिंग प्रत्यय का संदर्भ शपथ से है।
- source_word: מִפְּרִי בִטְנְךָ
  choice: तेरे शरीर के फल में से
  rationale: मूल का ठोस शारीरिक रूपक बनाए रखा गया है। दाविद पुरुष है, इसलिए ‘गर्भ’ की अपेक्षा ‘शरीर’ हिन्दी में अधिक स्वाभाविक है, जबकि अर्थ उसके अपने वंशज का है।
- source_word: אָשִׁית
  choice: बैठाऊँगा
  rationale: मूल क्रिया का अर्थ रखना/स्थापित करना है; सिंहासन के संदर्भ में ‘बैठाऊँगा’ स्वाभाविक हिन्दी में राजकीय स्थापना का भाव देता है।
- source_word: לְכִסֵּא לָךְ
  choice: तेरे सिंहासन पर
  rationale: शाब्दिक संरचना में ‘तेरे लिए सिंहासन पर’ का भाव है, पर प्रसंग दाविद के राजसिंहासन का है; यह रूप हिन्दी में स्पष्ट और सहज है।
theological_decisions:
- issue: दाविद से की गई प्रतिज्ञा का मसीही और वाचागत दायरा
  choice: मुख्य पाठ में दाविद के अपने वंशज को उसके सिंहासन पर बैठाने की ऐतिहासिक-वाचागत प्रतिज्ञा रखी गई है।
  alternative: मुख्य पाठ में इसे सीधे और स्पष्ट रूप से मसीह के विषय में कहना।
  rationale: इस पद का प्रत्यक्ष कथन दाविद के शारीरिक वंशज और राजसिंहासन के विषय में है। व्यापक धर्मवैधानिक मसीही पूर्ति को अनुवाद में आरोपित किए बिना संदर्भ-टिप्पणी में संकेतित किया गया है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी अपनाई गई है। ‘पक्की शपथ’ आम पाठक के लिए स्पष्ट है; ‘शरीर का फल’ मूल रूपक और वंशगत आशय दोनों को बनाए रखता है। सर्वनामों में दाविद को संबोधित करने वाली काव्यात्मक निकटता के लिए ‘तेरे’ रखा गया है।
