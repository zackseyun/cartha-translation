base_translation:
  language: en
  yaml_path: translation/ot/psalms/132/009.yaml
  text: May your priests be clothed with righteousness[c][b][a], and may your faithful ones shout for joy.
translation:
  language: hi
  text: तेरे याजक धार्मिकता[a] का वस्त्र पहनें, और तेरे निष्ठावान जन[b] आनन्द से जयजयकार करें[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘न्याय’। इब्रानी शब्द में नैतिक धार्मिकता और न्याय—दोनों का भाव हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘तेरे भक्त’ या ‘तेरे पवित्र जन’। इब्रानी शब्द उन लोगों को दर्शाता है जो निष्ठा और भक्ति से पहचाने जाते हैं।
    reason: lexical_alternative
  - marker: c
    text: या ‘आनन्द से गाएँ’। इब्रानी क्रिया मुखर और उल्लासपूर्ण आनन्द व्यक्त करती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּהֲנֶיךָ
  choice: तेरे याजक
  rationale: כֹּהֵן का सीधा अर्थ ‘याजक’ है; यह भजन के मन्दिर और उपासना-संबंधी संदर्भ को बनाए रखता है। द्वितीय पुरुष एकवचन प्रत्यय को ‘तेरे’ से व्यक्त किया गया है।
- source_word: יִלְבְּשׁוּ
  choice: वस्त्र के समान धारण करें
  rationale: לבשׁ के वस्त्र पहनने के बिंब को स्पष्ट और स्वाभाविक हिन्दी में सुरक्षित रखा गया है; प्रार्थनात्मक अपूर्ण क्रिया को ‘करें’ से व्यक्त किया गया है।
- source_word: צֶדֶק
  choice: धार्मिकता
  rationale: צֶדֶק नैतिक खराई और न्याय—दोनों का भाव रख सकता है। याजकीय वस्त्र के रूपक में ‘धार्मिकता’ उपयुक्त है, जबकि ‘न्याय’ को पादटिप्पणी में वास्तविक विकल्प के रूप में रखा गया है।
- source_word: וַחֲסִידֶיךָ
  choice: तेरे भक्त
  rationale: חָסִיד उन लोगों को दर्शाता है जो निष्ठा और समर्पण से पहचाने जाते हैं। ‘भक्त’ आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक है, और यहाँ किसी विशिष्ट उत्तरकालीन पदवी को आरोपित नहीं करता।
- source_word: יְרַנֵּנוּ
  choice: आनन्द से जयजयकार करें
  rationale: רנן का पिएल रूप उल्लासपूर्ण मुखर आनन्द को व्यक्त करता है। ‘जयजयकार करें’ उसकी प्रबल ध्वनि को बनाए रखता है; ‘आनन्द से गाएँ’ भी सम्भव है।
theological_decisions:
- issue: प्रार्थना के संदर्भ में अपूर्ण क्रियाओं का इच्छासूचक बल
  choice: ‘धारण करें’ और ‘जयजयकार करें’ के द्वारा प्रार्थना/कामना के रूप में अनुवाद
  alternative: ‘धारण करेंगे’ और ‘जयजयकार करेंगे’ के रूप में भविष्यवाणी
  rationale: भजन 132 के संदर्भ में यह पंक्ति साधारण भविष्यवाणी से अधिक विनती है। हिन्दी का सम्भावनार्थक/इच्छासूचक ‘करें’ इस भाव को स्वाभाविक ढंग से व्यक्त करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और उपासना-संदर्भ के अनुकूल रखी गई है। ‘वस्त्र के समान’ मूल के पहनावे-संबंधी रूपक को साधारण पाठक के लिए स्पष्ट करता है। ईश्वर को संबोधन में ‘तेरे’ काव्यात्मक और निकटतापूर्ण शैली बनाए रखता है।
