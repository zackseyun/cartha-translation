  text: וַ/אֲנִי בַ֭עַר וְ/לֹ֣א אֵדָ֑ע בְּ֝הֵמ֗וֹת הָיִ֥יתִי עִמָּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/022.yaml
  text: Then I was senseless and did not know[a]; I was like a beast before you.
translation:
  language: hi
  text: तब मैं नासमझ था और जानता न था; मैं तेरे साथ पशु[a] के समान था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल इब्रानी में ‘पशु’ का रूप बहुवचन है; सम्भवतः यह तीव्र अथवा सामूहिक प्रयोग है, जिसका अर्थ ‘पशु के समान’ या ‘पशुवत’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: तब मैं
  rationale: वाव पिछले विचार से इस आत्मस्वीकार को जोड़ता है; प्रसंग में ‘तब मैं’ स्वाभाविक रूप से उस समय की दशा की ओर संकेत करता है।
- source_word: בַעַר
  choice: नासमझ
  rationale: यह शब्द केवल जानकारी के अभाव से अधिक, समझ-बूझ से रहित या पशुवत मूढ़ होने का भाव रखता है। ‘नासमझ’ आधुनिक हिन्दी में स्पष्ट और गरिमापूर्ण है।
- source_word: וְלֹא אֵדָע
  choice: और कुछ नहीं जानता था
  rationale: यָדַע के सामान्य अर्थ ‘जानना’ को रखा गया है; हिन्दी में ‘कुछ नहीं जानता था’ इस निरपेक्ष कथन को स्वाभाविक बनाता है।
- source_word: בְּהֵמוֹת
  choice: पशु के समान
  rationale: रूप की दृष्टि से यह बहुवचन है, पर यहाँ तीव्र अथवा सामूहिक प्रयोग में पशुवत नासमझी व्यक्त करता है। हिन्दी में एकवचन उपमा अर्थ को सहजता से पहुँचाती है।
- source_word: הָיִיתִי
  choice: मैं ... था
  rationale: यहाँ क्रिया भूतकाल की अवस्था बताती है, न कि आवश्यक रूप से उस अवस्था में आ जाने की प्रक्रिया।
- source_word: עִמָּךְ
  choice: तेरे साथ
  rationale: पूर्वसर्ग עִם का मूल अर्थ ‘साथ’ है। यह उस तनाव को बनाए रखता है कि भजनकार परमेश्वर के साथ रहते हुए भी पशुवत नासमझ था; ‘तेरे सामने’ एक सम्भव प्रसंगगत अर्थ है, पर अधिक व्याख्यात्मक है।
theological_decisions:
- issue: परमेश्वर के संबंध में पशु वाली आत्म-उपमा का बल
  choice: ‘मैं तेरे साथ पशु के समान था’—अपनी नासमझी का तीखा किन्तु सीमित आत्मस्वीकार
  alternative: ‘मैं तेरे सामने एक विवेकहीन पशु जैसा था’
  rationale: पद भजनकार की समझ की कमी स्वीकार करता है; इसे समूचे मानव-स्वभाव पर कोई व्यापक धर्मसैद्धान्तिक घोषणा नहीं बनाया गया। ‘तेरे साथ’ मूल पूर्वसर्ग को सीधे रखता और प्रसंग का तनाव बनाए रखता है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। परमेश्वर के लिए निकट संबोधन ‘तेरे’ रखा गया है, जो भजन की प्रत्यक्ष प्रार्थनात्मक वाणी से मेल खाता है। अर्धविराम दोनों समानांतर आत्मस्वीकारों को जोड़ता है।
