base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/026.yaml
  text: My flesh and my heart may fail[b][a], but God is the rock of my heart and my portion forever.
translation:
  language: hi
  text: चाहे मेरा शरीर और मेरा हृदय चुक जाएँ,[a] फिर भी परमेश्वर सदा मेरे हृदय की चट्टान और मेरा भाग है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरा शरीर और मेरा हृदय चुक जाते हैं।” हिब्रू क्रिया क्षीण होने, विफल होने या समाप्त हो जाने का भाव दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: “मेरे हृदय की चट्टान” का अर्थ “मेरे हृदय का बल” भी समझा जा सकता है; हिब्रू में शब्दशः रूपक “चट्टान” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּלָה
  choice: चुक जाएँ
  rationale: यह क्रिया समाप्त होने, क्षीण पड़ने या विफल होने का भाव देती है। ‘चुक जाएँ’ शरीर और हृदय दोनों के लिए स्वाभाविक हिंदी है और संभाव्य अथवा सामान्य अनुभवगत भाव को खुला रखती है।
- source_word: שְׁאֵרִי
  choice: मेरा शरीर
  rationale: यद्यपि शब्द का मूल अर्थ ‘मांस’ भी हो सकता है, यहाँ ‘हृदय’ के साथ समानांतर प्रयोग में यह भौतिक देह को सूचित करता है। आधुनिक हिंदी में ‘शरीर’ अधिक स्वाभाविक और स्पष्ट है।
- source_word: לְבָבִי
  choice: मेरा हृदय
  rationale: यह भीतरी मनुष्य—विचार, इच्छा और भाव—को सूचित करता है। ‘हृदय’ पारदर्शी बाइबलीय रूप है और मूल की पुनरावृत्ति बनाए रखता है।
- source_word: צוּר
  choice: चट्टान
  rationale: मूल शब्द ठोस रूपक ‘चट्टान’ का प्रयोग करता है, जो स्थिरता, सुरक्षा और भरोसे को व्यक्त करता है। इसे केवल ‘बल’ कहने से मूल बिंब संकुचित हो जाएगा।
- source_word: חֶלְקִי
  choice: मेरा भाग
  rationale: यह किसी को मिले हिस्से अथवा विरासत का रूपक है। ‘मेरा भाग’ हिंदी में संक्षिप्त है और परमेश्वर को भजनकार की स्थायी संपदा बताने वाला भाव सुरक्षित रखता है।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: यहाँ शब्द इस्राएल के परमेश्वर के लिए व्यक्तिगत विश्वास-घोषणा में आया है; ‘परमेश्वर’ मानक और गरिमापूर्ण हिंदी रूप है।
- source_word: לְעוֹלָם
  choice: सदा
  rationale: यह स्थायी, अनंत काल तक बने रहने का भाव व्यक्त करता है। ‘सदा’ काव्यात्मक, स्पष्ट और स्वाभाविक हिंदी है।
theological_decisions:
- issue: आरंभिक खंड में मनुष्य की दुर्बलता
  choice: चाहे मेरा शरीर और मेरा हृदय चुक जाएँ
  alternative: मेरा शरीर और मेरा हृदय चुक जाते हैं
  rationale: हिब्रू क्रिया का रूप सामान्य या वर्तमान विफलता के साथ-साथ क्षीण होकर समाप्त होने का भाव दे सकता है। ‘चाहे…चुक जाएँ’ संभाव्य परिस्थिति और उसके विपरीत परमेश्वर की स्थिरता को स्वाभाविक हिंदी में व्यक्त करता है, पर वैकल्पिक पाठ टिप्पणी में सुरक्षित है।
- issue: परमेश्वर के लिए צוּר का रूपक
  choice: मेरे हृदय की चट्टान
  alternative: मेरे हृदय का बल
  rationale: मूल पाठ ठोस ‘चट्टान’ रूपक रखता है। इसे बनाए रखने से स्थिरता, आश्रय और सामर्थ्य की बहुअर्थी छवि बनी रहती है; ‘बल’ उसका संभव अर्थ-स्पष्टीकरण है, पर पूरा रूपक नहीं।
- issue: חֶלְקִי में संपदा अथवा विरासत का भाव
  choice: मेरा भाग
  alternative: मेरी विरासत
  rationale: ‘भाग’ मूल के आवंटित हिस्से के रूपक के सबसे निकट है और यह तय नहीं करता कि आशय केवल कानूनी विरासत है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण, काव्यात्मक और सामान्य पाठक के लिए स्पष्ट शैली। ‘मांस’ के स्थान पर संदर्भानुकूल ‘शरीर’ चुना गया है, जबकि ‘चट्टान’ और ‘भाग’ जैसे मूल बाइबलीय रूपक सुरक्षित रखे गए हैं।
