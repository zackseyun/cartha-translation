  yaml_path: translation/ot/psalms/073/014.yaml
  text: For I was afflicted all day long[b][a], and chastened every morning.
translation:
  language: hi
  text: क्योंकि मैं दिन भर पीड़ित रहा[a], और हर सुबह मुझे ताड़ना मिलती रही[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘मारा जाता रहा’ अथवा ‘विपत्ति झेलता रहा।’
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘और मेरी ताड़ना/डाँट सुबहों में थी’; आशय हर सुबह बार-बार मिलने वाली ताड़ना या अनुशासन से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֱהִי
  choice: क्योंकि मैं…रहा
  rationale: वाव-युक्त रूप पिछले कथन की व्याख्या को आगे बढ़ाता है; संदर्भ में ‘क्योंकि’ इस व्याख्यात्मक संबंध को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि प्रथम पुरुष और भूतकाल बने रहते हैं।
- source_word: נָגוּעַ
  choice: पीड़ित
  rationale: यह נגע का निष्क्रिय रूप है, जिसका अर्थ मारा हुआ या दुःख से ग्रस्त होना हो सकता है। ‘पीड़ित’ सामान्य कष्ट का भाव रखता है और इसे विशेष रूप से बीमारी नहीं ठहराता।
- source_word: כָּל הַיּוֹם
  choice: दिन भर
  rationale: यह पूरे दिन की अवधि बताने वाला स्वाभाविक और स्पष्ट हिन्दी मुहावरा है।
- source_word: וְתוֹכַחְתִּי
  choice: और…मुझे ताड़ना मिलती रही
  rationale: मूल में प्रथम पुरुष प्रत्यय सहित संज्ञा ‘मेरी ताड़ना/सुधार’ है। हिन्दी में यह वाक्य-विन्यास अनुभव की गई बार-बार की अनुशासनात्मक ताड़ना को स्वाभाविक रूप से व्यक्त करता है।
- source_word: לַבְּקָרִים
  choice: हर सुबह
  rationale: बहुवचन ‘सुबहों में’ यहाँ वितरणात्मक और आवर्ती अर्थ रखता है; ‘हर सुबह’ उसे सहज हिन्दी में स्पष्ट करता है।
theological_decisions:
- issue: वर्णित कष्ट का स्वरूप
  choice: सामान्य पीड़ा और अनुशासन की भाषा, बिना इसे बीमारी या दंडात्मक क्रोध तक सीमित किए
  alternative: महामारी-जैसी शारीरिक पीड़ा या मुख्यतः मौखिक डाँट
  rationale: इब्रानी शब्द मारे जाने/पीड़ित होने और सुधार या ताड़ना पाने के व्यापक भाव रखते हैं। इसलिए अनुवाद निरंतर कष्ट और अनुशासन को व्यक्त करता है, पर उसके सटीक स्वरूप को निर्धारित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रूप। ‘ताड़ना’ धार्मिक-साहित्यिक संदर्भ में परिचित है, पर अत्यधिक प्राचीन नहीं; ‘मिलती रही’ मूल संज्ञात्मक रचना का आवर्ती अनुभव स्वाभाविक हिन्दी में सामने लाता है।
