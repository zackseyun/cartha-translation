  yaml_path: translation/ot/psalms/073/020.yaml
  text: Like a dream when one awakes[a], Lord, when you rouse yourself, you will despise their image.
translation:
  language: hi
  text: जैसे जागने पर सपना लुप्त हो जाता है, वैसे ही, प्रभु, जब आप जाग उठेंगे[a], तब आप उनकी छवि को तुच्छ समझेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'एक वैकल्पिक, किंतु कम संभावित अर्थ: “प्रभु, नगर में आप उनकी छवि को तुच्छ समझेंगे।” हिब्रू व्यंजनों को इस प्रकार पढ़ा जा सकता है, पर संदर्भ “जब आप जाग उठेंगे” का अधिक दृढ़ समर्थन करता है।'
    reason: alternative_reading
lexical_decisions:
- source_word: כַּחֲלוֹם
  choice: जैसे ... सपना
  rationale: उपसर्ग כְּ तुलना प्रकट करता है और חֲלוֹם का अर्थ ‘सपना’ है; हिंदी में ‘जैसे ... सपना’ उपमा को स्वाभाविक रूप से व्यक्त करता है।
- source_word: מֵהָקִיץ
  choice: जागने पर
  rationale: קיץ/יקץ ‘जागना’ से निकला यह रूप यहाँ कालवाचक अर्थ देता है; ‘जागने पर’ सपने के लुप्त होने की उपमा स्पष्ट करता है।
- source_word: אֲדֹנָי
  choice: प्रभु
  rationale: यह परमेश्वर के लिए प्रयुक्त संबोधन और उपाधि है; आधुनिक हिंदी में ‘प्रभु’ स्वाभाविक और गरिमापूर्ण है।
- source_word: בָּעִיר
  choice: जब आप जाग उठेंगे
  rationale: व्यंजन-पाठ को ‘नगर में’ भी पढ़ा जा सकता है, किंतु עור ‘जागना/जगा उठना’ से लिया गया क्रियात्मक अर्थ पूर्वार्ध के जागने के समानांतर बैठता है और संदर्भ में अधिक संभावित है।
- source_word: צַלְמָם
  choice: उनकी छवि
  rationale: צֶלֶם का मूल अर्थ ‘छवि, रूप, प्रतिरूप’ है; ‘छवि’ दुष्टों की क्षणभंगुर दिखाई देनेवाली अवस्था की संभावित ओर संकेत करते हुए मूल शब्द की व्यापकता बनाए रखता है।
- source_word: תִּבְזֶה
  choice: आप ... तुच्छ जानेंगे
  rationale: בזה का अर्थ ‘तुच्छ समझना, घृणा की दृष्टि से देखना’ है; अपूर्ण क्रिया का संदर्भगत भाव यहाँ भविष्यसूचक है।
theological_decisions:
- issue: בָּעִיר की व्याख्या
  choice: 'क्रियात्मक पाठ: ‘जब आप जाग उठेंगे’'
  alternative: 'स्थानवाचक संज्ञा: ‘नगर में’'
  rationale: सपने से जागने की तत्काल उपमा दूसरी जागरण-संबंधी क्रिया का दृढ़ समर्थन करती है। फिर भी हिब्रू व्यंजन ‘नगर में’ पढ़े जा सकते हैं, इसलिए विकल्प को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। उपमा का आशय स्वाभाविक हिंदी में स्पष्ट करने के लिए ‘मिट जाता है’ जोड़ा गया है; यह सपने की क्षणभंगुरता को व्यक्त करता है, जबकि विवादित पाठ को पादटिप्पणी में सुरक्षित रखा गया है।
