base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/013.yaml
  text: Surely in vain I have kept my heart pure[b][a], and washed my hands in innocence.
translation:
  language: hi
  text: निश्चय ही, मैंने व्यर्थ अपने हृदय को शुद्ध रखा और निर्दोषता में अपने हाथ धोए।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बिना किसी लाभ के।”
    reason: lexical_alternative
  - marker: b
    text: “निर्दोषता में अपने हाथ धोए” नैतिक निर्दोषता का बिंब है, केवल शरीर की सफ़ाई का नहीं।
    reason: cultural_note
lexical_decisions:
- source_word: אַךְ
  choice: निश्चय ही
  rationale: यहाँ यह पद भजनकार के खेदपूर्ण निष्कर्ष पर बल देता है; संकीर्ण अर्थ वाले ‘केवल’ की अपेक्षा ‘निश्चय ही’ प्रसंगानुकूल है।
- source_word: רִיק
  choice: व्यर्थ ही
  rationale: यह निष्फलता या कोई लाभ न होने का भाव व्यक्त करता है और हिंदी में स्वाभाविक है।
- source_word: זִכִּיתִי
  choice: मैंने ... शुद्ध रखा
  rationale: क्रिया हृदय को शुद्ध करने या शुद्ध बनाए रखने का नैतिक भाव रखती है; प्रसंग में लगातार शुद्ध आचरण का संकेत देने के लिए यह अभिव्यक्ति चुनी गई है।
- source_word: לְבָבִי
  choice: अपने हृदय को
  rationale: ‘हृदय’ भीतरी व्यक्ति तथा नैतिक और इच्छागत केंद्र के काव्यात्मक अर्थ को बनाए रखता है।
- source_word: וָאֶרְחַץ
  choice: और ... धोए हैं
  rationale: यह समानांतर क्रिया को सहज हिंदी में व्यक्त करता है और वर्तमान तक प्रासंगिक बीते आचरण का भाव रखता है।
- source_word: בְּנִקָּיוֹן
  choice: निर्दोषता में
  rationale: यहाँ शब्द स्वच्छता के साथ नैतिक निर्दोषता का भाव रखता है; ‘निर्दोषता में’ उस रूपक को सुरक्षित रखता है।
- source_word: כַּפָּי
  choice: अपने हाथ
  rationale: शाब्दिक रूप से ‘हथेलियाँ’ संभव है, पर इस काव्यात्मक मुहावरे में हिंदी का स्वाभाविक और अर्थपूर्ण रूप ‘हाथ’ है।
theological_decisions:
- issue: नैतिक शुद्धता बनाम अनुष्ठानिक शुद्धता का बिंब
  choice: धोने के बिंब को नैतिक शुद्धता और निर्दोषता के रूपक के रूप में रखा गया है।
  alternative: इसे मुख्यतः अनुष्ठानिक शुद्धता की भाषा समझना।
  rationale: ‘हृदय’ और ‘हाथ’ का समानांतर प्रयोग तथा विलाप का प्रसंग नैतिक शुद्धता की ओर संकेत करते हैं; फिर भी अनुवाद धोने के मूल बिंब को बनाए रखता है और उसे किसी संकीर्ण सिद्धांत में नहीं बदलता।
translation_notes:
  register: आधुनिक मानक हिंदी; सरल, गरिमापूर्ण और काव्यात्मक। ‘हृदय’ और ‘हाथ धोने’ के पारंपरिक बिंब सुरक्षित रखे गए हैं, जबकि वाक्य-विन्यास सामान्य पाठक के लिए स्वाभाविक रखा गया है।
