lexical_decisions:
- source_word: יָצָא
  choice: बाहर निकली हुई हैं
  rationale: क्रिया का मूल अर्थ ‘बाहर निकलना’ है; आँखों और चर्बी के संदर्भ में यह उनके उभरकर बाहर दिखाई देने का ठोस चित्र बनाए रखता है।
- source_word: מֵחֵלֶב
  choice: चर्बी के कारण
  rationale: חֵלֶב का शाब्दिक अर्थ ‘चर्बी’ है। यह रूप शारीरिक चित्र को बनाए रखते हुए कारण-संबंध को स्वाभाविक हिन्दी में व्यक्त करता है, बिना इसे केवल धन-समृद्धि मान लेने के।
- source_word: עֵינֵמוֹ
  choice: उनकी आँखें
  rationale: तृतीय पुरुष बहुवचन प्रत्यय सहित संज्ञा का सीधा और स्वाभाविक अनुवाद।
- source_word: עָבְרוּ
  choice: हद से बढ़ गई हैं
  rationale: मूल अर्थ ‘पार जाना’ या ‘सीमा से आगे बढ़ना’ है; यह चुनाव अति और मर्यादा लाँघने का भाव स्पष्ट रखता है।
- source_word: מַשְׂכִּיּוֹת
  choice: कल्पनाएँ
  rationale: शब्द चित्रों, मन की धारणाओं, विचारों या योजनाओं को सूचित कर सकता है। ‘कल्पनाएँ’ मानसिक अर्थ को बनाए रखता है और इसे केवल मूर्तियों या दुष्ट योजनाओं तक सीमित नहीं करता।
- source_word: לֵבָב
  choice: मन
  rationale: हिब्रू ‘हृदय’ यहाँ अंतःकरण, सोच और इच्छा के केंद्र को दर्शाता है; आधुनिक हिन्दी में ‘मन’ मַשְׂכִּיּוֹת के साथ स्वाभाविक और बोधगम्य है।
