translation:
  language: hi
  text: जब मैं परमेश्वर के पवित्र स्थानों[a] में प्रवेश कर गया, तब मुझे उनकी अंतिम परिणति[b] का बोध हुआ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘परमेश्वर के पवित्र स्थान में।’ इब्रानी में बहुवचन है, जो परमेश्वर के पवित्र परिसर को सामूहिक रूप से सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘उनका अंत,’ ‘उनकी अंतिम दशा,’ अथवा ‘उनका परिणाम।’ इब्रानी शब्द उनकी अंतिम नियति या अंततः होने वाले परिणाम की ओर संकेत करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד
  choice: जब तक कि
  rationale: यह भजनकार की उलझन की सीमा और निर्णायक मोड़ को व्यक्त करता है।
- source_word: אָבוֹא
  choice: मैं ... प्रवेश न कर गया
  rationale: עַד के साथ यह उस निर्णायक क्षण को दर्शाता है जब भजनकार पवित्र परिसर में गया; हिन्दी में ‘जब तक कि ... न’ स्वाभाविक है।
- source_word: מִקְדְּשֵׁי אֵל
  choice: परमेश्वर के पवित्र स्थानों
  rationale: इब्रानी संज्ञा बहुवचन समास रूप में है। ‘पवित्र स्थानों’ बहुवचन को बनाए रखते हुए आधुनिक हिन्दी में स्पष्ट और सहज है।
- source_word: אֵל
  choice: परमेश्वर
  rationale: यहाँ אֵל ईश्वर के सामान्य पदनाम के रूप में प्रयुक्त है; ‘परमेश्वर’ गरिमापूर्ण और प्रचलित हिन्दी रूप है।
- source_word: אָבִינָה
  choice: तब मैंने ... समझा
  rationale: בין से निकला यह रूप सूझ-बूझ या बोध को व्यक्त करता है; ‘तब’ प्रसंग में निहित क्रम को स्पष्ट करता है।
- source_word: לְאַחֲרִיתָם
  choice: उनके अन्त को
  rationale: אַחֲרִית यहाँ उनकी अन्तिम दशा, परिणति या नियति की ओर संकेत करता है; ‘अन्त’ संक्षिप्त और अर्थगर्भित है।
theological_decisions:
- issue: מִקְדְּשֵׁי को पारंपरिक एकवचन में प्रस्तुत किया जाए या इब्रानी बहुवचन बनाए रखा जाए
  choice: परमेश्वर के पवित्र स्थानों
  alternative: परमेश्वर के पवित्र स्थान में
  rationale: मूल भाषा की प्राथमिकता के अनुसार मुख्य पाठ में बहुवचन सुरक्षित रखा गया है। यह पवित्र परिसर के विभिन्न भागों को सामूहिक रूप से भी सूचित कर सकता है; इससे किसी विशिष्ट doctrinal व्याख्या को अनिवार्य नहीं किया गया।
- issue: אַחֲרִיתָם का आशय केवल मृत्यु है या व्यापक अन्तिम परिणाम
  choice: उनके अन्त को
  alternative: उनकी अन्तिम दशा को / उनका परिणाम
  rationale: ‘अन्त’ मूल की गंभीरता और अस्पष्टता बनाए रखता है—यह उनकी मृत्यु, अन्तिम दशा, या व्यापक परिणाम की ओर संकेत कर सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज शैली रखी गई है। मूल इब्रानी के बहुवचन को मुख्य पाठ में सुरक्षित रखा गया है, और ‘अन्त’ द्वारा अन्तिम नियति तथा परिणाम के बीच की अर्थगत व्यापकता बनाए रखी गई है।
