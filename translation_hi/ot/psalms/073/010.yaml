  rationale: इब्रानी प्रत्यय अपने पूर्वपद को स्पष्ट नहीं करता और पद का वाक्य-विन्यास कठिन है; किसी एक धर्मवैचारिक पहचान को अनावश्यक रूप से आरोपित नहीं किया गया।
