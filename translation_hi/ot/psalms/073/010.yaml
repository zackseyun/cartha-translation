  text: Therefore his people turn back here[c][b][a], and waters of fullness are drained by them.
translation:
  language: hi
  text: इसलिए उसके लोग यहाँ लौट आते हैं[a], और भरपूर जल उनके द्वारा निचोड़ा जाता है[b][c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इसलिए वह अपने लोगों को यहाँ लौटा लाता है।” क्रिया का अर्थ अकर्मक, “लौटना,” अथवा सकर्मक, “लौटा लाना,” दोनों प्रकार से समझा जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “पूर्णता के जल”; संभवतः आशय बहुतायत के जल से है, यद्यपि बिंब कठिन है।
    reason: lexical_alternative
  - marker: c
    text: या, “और भरपूर जल उनके लिए निचोड़ा जाता है।” क्रिया और अंतिम सर्वनाम दोनों कठिन हैं; कुछ लोग इस पंक्ति को जल के उनके द्वारा निचोड़े जाने के बजाय उनके लिए भरपूर भाग उपलब्ध कराए जाने के अर्थ में समझते हैं।
    reason: alternative_reading
