- source_word: וּמֵי מָלֵא
  choice: और भरपूर जल
  rationale: शाब्दिक अभिव्यक्ति ‘भरपूरी के जल’ हिन्दी में अस्वाभाविक है। ‘भरपूर जल’ प्रचुरता का भाव और काव्यात्मक बिंब दोनों बनाए रखता है।
- source_word: יִמָּצוּ
  choice: निचोड़ लिया जाता है
  rationale: מצה के निफ़अल रूप में ‘निचोड़े/निकाले जाना’ का निष्क्रिय भाव है। यह कठिन बिंब को व्याख्या से मिटाए बिना हिन्दी में व्यक्त करता है।
- source_word: לָמוֹ
