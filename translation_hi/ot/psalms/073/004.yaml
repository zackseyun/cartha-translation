id: PSA.73.4
reference: Psalms 73:4
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּ֤י אֵ֖ין חַרְצֻבּ֥וֹת לְ/מוֹתָ֗/ם וּ/בָרִ֥יא אוּלָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/004.yaml
  text: For they have no pains until death, and their body is fat.
translation:
  language: hi
  text: क्योंकि मृत्यु तक उन्हें कोई पीड़ा नहीं होती,[a] और उनका शरीर हृष्ट-पुष्ट है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या: “उनकी मृत्यु में कोई पीड़ा नहीं होती।” “पीड़ा” के लिए आया इब्रानी शब्द दुर्लभ है और उसका अर्थ अनिश्चित है।'
    reason: חַרְצֻבּוֹת और לְמוֹתָם—दोनों की भाषिक अस्पष्टता सुरक्षित रखने के लिए।
  - marker: b
    text: 'शाब्दिक रूप के निकट: “उनका शरीर मोटा है”; संभवतः: “वे स्वस्थ और बलवान हैं।”'
    reason: בָרִיא אוּלָם के अर्थ और वाक्य-विन्यास की अनिश्चितता दिखाने के लिए।
lexical_decisions:
- source_word: חַרְצֻבּוֹת
  choice: पीड़ा
  rationale: यह दुर्लभ बहुवचन शब्द संभवतः कष्ट, पीड़ा या बंधन का भाव देता है। प्रसंग में दुष्टों के कष्टरहित जीवन का वर्णन होने के कारण ‘पीड़ा’ स्वाभाविक है, जबकि शब्द की अनिश्चितता पादटिप्पणी में रखी गई है।
- source_word: לְמוֹתָם
  choice: मृत्यु तक
  rationale: पूर्वसर्ग לְ और ‘उनकी मृत्यु’ के मेल को जीवन के अंत तक की अवधि के रूप में लिया गया है। ‘उनकी मृत्यु में’ भी व्याकरणतः संभव है और पादटिप्पणी में दिया गया है।
- source_word: בָרִיא
  choice: हृष्ट-पुष्ट
  rationale: शब्द का मूल अर्थ ‘मोटा’ है, पर प्राचीन संदर्भ में यह पुष्ट, भरापूरा और समृद्ध स्वास्थ्य सूचित कर सकता है। ‘हृष्ट-पुष्ट’ आधुनिक हिन्दी में उस भाव को बिना अनावश्यक अवमानना के व्यक्त करता है।
- source_word: אוּלָם
  choice: शरीर
  rationale: यहाँ शब्द का अर्थ अनिश्चित है; प्रसंग में इसे देह या शरीर के अर्थ में समझा गया है। कुछ व्याख्याएँ इसे बल से जोड़ती हैं, इसलिए विकल्प पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: दुष्टों की मृत्यु अथवा मृत्यु तक की दशा
  choice: मृत्यु तक उन्हें कोई पीड़ा नहीं होती
  alternative: उनकी मृत्यु में कोई पीड़ा नहीं होती / उनकी मृत्यु पीड़ारहित होती है
  rationale: यह चयन भजनकार की उस प्रत्यक्ष धारणा को सामने रखता है कि दुष्ट जीवन के अंत तक कष्ट से बचे रहते हैं; इसे सार्वभौमिक धर्मसिद्धांत न बनाकर वक्ता के संकटपूर्ण अवलोकन के रूप में रहने दिया गया है।
translation_notes:
  register: सरल, आधुनिक और गरिमापूर्ण हिन्दी। ‘हृष्ट-पुष्ट’ सामान्य पाठक के लिए स्वाभाविक है और ‘मोटा’ के प्राचीन सकारात्मक भाव—समृद्धि तथा शारीरिक पुष्टता—को बेहतर व्यक्त करता है।
