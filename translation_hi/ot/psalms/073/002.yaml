id: PSA.73.2
reference: Psalms 73:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/אֲנִ֗י כִּ֭/מְעַט נטוי רַגְלָ֑/י כְּ֝/אַ֗יִן שפכה אֲשֻׁרָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/002.yaml
  text: But as for me[a], my feet had almost stumbled; my steps had nearly slipped.
translation:
  language: hi
  text: परन्तु मैं—मेरे पाँव लगभग लड़खड़ा गए थे; मेरे कदम लगभग फिसल गए थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַאֲנִי
  choice: परन्तु मैं
  rationale: संयोजक और स्वतंत्र सर्वनाम पिछले प्रसंग के साथ विरोध और वक्ता पर बल दोनों व्यक्त करते हैं; हिन्दी में ‘परन्तु मैं’ इसे स्वाभाविक और संक्षिप्त रूप से रखता है।
- source_word: כִּמְעַט
  choice: फिसलते-फिसलते बचे
  rationale: यह क्रिया-विशेषण किसी घटना के होते-होते रह जाने का भाव देता है; हिन्दी मुहावरा उसी निकटता को सहज ढंग से व्यक्त करता है।
- source_word: נטוי
  choice: फिसलते
  rationale: पाठ में כתיב נטוי है, जिसका आधार נטה झुकने या हटने का बोध दे सकता है; पाँवों के संदर्भ में अस्थिर होकर फिसलने का निकट-अर्थ स्वाभाविक है। सम्भावित पाठ-परंपरा ‘डगमगाने’ का भाव भी समर्थित करती है।
- source_word: רַגְלָי
  choice: मेरे पाँव
  rationale: शरीर और मार्ग की ठोस काव्यात्मक छवि को यथावत रखा गया है।
- source_word: כְּאַיִן
  choice: लगभग
  rationale: शाब्दिक रूप से ‘मानो कुछ भी नहीं’ यहाँ ‘बस होने ही वाला था’ अथवा ‘लगभग’ का क्रिया-विशेषणीय भाव देता है।
- source_word: שפכה
  choice: डगमगा गए
  rationale: मूल धातु ‘उँडेलना/बहा देना’ है, पर ‘कदमों’ के साथ यह पाँव के नीचे से आधार खिसकने या चाल अस्थिर होने की काव्यात्मक छवि देता है; ‘डगमगा गए’ हिन्दी में इसे स्पष्ट रखता है।
- source_word: אֲשֻׁרָי
  choice: मेरे कदम
  rationale: यह संज्ञा कदमों या चाल को दर्शाती है; ‘मेरे कदम’ सहज हिन्दी है और जीवन-मार्ग की अंतर्निहित छवि बनाए रखता है।
theological_decisions:
- issue: शारीरिक अस्थिरता की रूपकात्मक भाषा
  choice: ‘पाँव’ और ‘कदम’ की ठोस छवि को बनाए रखा गया है, बिना उसका अर्थ स्पष्ट रूप से विश्वास खोना या नैतिक पतन बताने के।
  alternative: ‘मैं अपना विश्वास खोने ही वाला था’ अथवा ‘मैं पाप में गिरने ही वाला था।’
  rationale: इब्रानी पद निकट-पतन की छवि देता है, पर इस पद में उस पतन का सटीक आध्यात्मिक या नैतिक स्वरूप नहीं बताता। रूपक को बनाए रखना वास्तविक अर्थगत और धर्मवैचारिक तनाव की रक्षा करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण काव्यात्मक गद्य। समानांतर पंक्तियों में ‘पाँव/कदम’ और ‘फिसलना/डगमगाना’ रखकर निकट-अर्थी अस्थिरता की छवियाँ सुरक्षित की गई हैं।
