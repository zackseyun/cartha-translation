  yaml_path: translation/ot/psalms/073/006.yaml
  text: Therefore pride is their necklace[a]; violence covers them like a garment.
translation:
  language: hi
  text: इसलिए घमंड उनके गले का हार है[a]; हिंसा उन्हें वस्त्र के समान ढाँपती है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इसलिए घमंड हार के समान उनकी शोभा बढ़ाता है; हिंसा वस्त्र के समान उन्हें लपेटे रहती है।”
    reason: मूल में हार और वस्त्र के बिंबों को क्रियात्मक ढंग से व्यक्त करने की भी संभावना है।
lexical_decisions:
- source_word: לָכֵן
  choice: इसलिए
  rationale: यह पिछले वर्णन से निकलने वाले परिणाम को सूचित करता है और पद का तार्किक संबंध स्वाभाविक हिंदी में बनाए रखता है।
- source_word: עֲנָקַתְמוֹ
  choice: उनके गले का हार है
  rationale: यह रूप गले के आभूषण या हार का बिंब प्रस्तुत करता है; विधेयात्मक अनुवाद हिब्रू रूपक को संक्षिप्त और स्पष्ट रखता है।
- source_word: גַאֲוָה
  choice: घमंड
  rationale: संदर्भ में यह नकारात्मक आत्म-अभिमान और दर्प को व्यक्त करता है; ‘घमंड’ साधारण आधुनिक हिंदी में स्वाभाविक है।
- source_word: יַעֲטָף
  choice: ढाँपती है
  rationale: क्रिया चारों ओर लपेटने या आवृत करने का भाव देती है; यह वस्त्र के समानांतर बिंब को बनाए रखती है।
- source_word: שִׁית
  choice: वस्त्र के समान
  rationale: यहाँ संज्ञा वस्त्र या ओढ़ने की वस्तु को दर्शाती है; ‘के समान’ हिंदी में निहित रूपक को स्पष्ट और सहज बनाता है।
- source_word: חָמָס
  choice: हिंसा
  rationale: शब्द हिंसा तथा हिंसक अन्याय का बोध देता है; इस नैतिक अभियोग में ‘हिंसा’ सबसे सीधा समतुल्य है।
- source_word: לָמוֹ
  choice: उन्हें
  rationale: क्रिया के साथ यह उन्हीं लोगों को सूचित करता है जिन्हें हिंसा वस्त्र की तरह आवृत करती है; हिंदी में ‘उन्हें’ स्वाभाविक कर्मरूप है।
