source:
  edition: WLC
  text: אִם אָ֭מַרְתִּי אֲסַפְּרָ֥ה כְמ֑וֹ הִנֵּ֤ה ד֭וֹר בָּנֶ֣י/ךָ בָגָֽדְתִּי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/015.yaml
  text: If I had said[a], “I will speak thus,” behold, I would have betrayed the generation of your children.
translation:
  language: hi
  text: यदि मैंने कहा होता, “मैं इसी प्रकार बोलूँगा,” तो देखो, मैं तेरे बच्चों की पीढ़ी से विश्वासघात कर बैठता।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִם אָמַרְתִּי
  choice: यदि मैंने कहा होता
  rationale: शर्तसूचक אִם और पूर्ण क्रिया यहाँ मन में विचार की गई काल्पनिक स्थिति व्यक्त करते हैं; यह हिंदी प्रयोग उस भाव को स्वाभाविक रूप से रखता है।
- source_word: אֲסַפְּרָה כְמוֹ
  choice: मैं इसी प्रकार बोलूँगा
  rationale: ספר का मूल भाव बताना या वर्णन करना है, पर כְמוֹ के साथ संदर्भ में आशय पिछले विचारों को मुखर करना है; ‘बोलूँगा’ इसे अनावश्यक रूप से संकीर्ण नहीं करता।
- source_word: הִנֵּה
  choice: तो देख
  rationale: यह अचानक हुए नैतिक बोध पर बल देता है; ‘देख’ उसकी वक्तृता और तीव्रता बनाए रखता है।
- source_word: דּוֹר בָּנֶיךָ
  choice: तेरे बच्चों की पीढ़ी
  rationale: דּוֹר का सीधा अर्थ ‘पीढ़ी’ है। בָּנֶיךָ व्याकरणतः ‘तेरे पुत्र’ है, किंतु यहाँ परमेश्वर के लोगों के समुदाय का व्यापक बोध उपयुक्त है।
- source_word: בָגָדְתִּי
  choice: मैं ... विश्वासघात करता
  rationale: בגד संबंधगत बेवफाई या विश्वासघात दर्शाता है। शर्त के परिणाम में हिंदी का ‘करता’ अप्राप्त काल्पनिक परिणाम को स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: ‘तेरे बच्चों’ का संदर्भ और दायरा
  choice: इसे परमेश्वर को संबोधित उसके लोगों के व्यापक समुदाय के रूप में प्रस्तुत किया गया है।
  alternative: ‘तेरे पुत्रों की पीढ़ी,’ जो इब्रानी के व्याकरणिक पुल्लिंग को अधिक औपचारिक रूप से दर्शाता है।
  rationale: द्वितीय पुरुष एकवचन पुल्लिंग प्रत्यय परमेश्वर की ओर संकेत करता है, और संदर्भ में ‘बच्चे’ परमेश्वर से संबंधित समुदाय को दर्शाते हैं; इससे पुरुषों तक सीमित अर्थ आरोपित नहीं होता।
- issue: בגד की नैतिक तीव्रता
  choice: विश्वासघात करता
  alternative: बेवफा ठहरता / दगा करता
  rationale: ‘विश्वासघात’ सामुदायिक और संबंधगत निष्ठा तोड़ने का गंभीर भाव बनाए रखता है, बिना किसी विशिष्ट सांप्रदायिक व्याख्या को जोड़ने के।
translation_notes:
  register: आधुनिक मानक हिंदी का सहज किंतु गरिमापूर्ण काव्यात्मक गद्य। परमेश्वर के लिए निकट संबोधन ‘तेरे’ रखा गया है, और ‘तो देख’ से הִנֵּה का आकस्मिक बल सुरक्षित है।
