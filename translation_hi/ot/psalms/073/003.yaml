review_pass:
  verdict: revise
  source_fidelity: The causal clause and the reference to the wicked's שָׁלוֹם are conveyed well. However, “ईर्ष्या करने लगा” is inceptive (“began to envy”), an aspect not expressed by the Hebrew perfect. “घमण्डियों” conveys arrogance but does not retain the more specific boastful sense of הוֹלְלִים as well as a wording referring to boastful people.
  naturalness: The draft is generally fluent modern Hindi. “मुझे ... से ईर्ष्या हुई” is more idiomatic and concise than “मैं ... से ईर्ष्या करने लगा,” while also avoiding the added inceptive nuance.
  terminology: “दुष्टों” is appropriate for רְשָׁעִים, and “सुख-शान्ति” suitably represents the broad contextual sense of שָׁלוֹם. “डींग मारने वालों” more directly expresses the boastful/arrogant moral posture denoted by הוֹלְלִים.
  issues:
  - severity: medium
    issue: “ईर्ष्या करने लगा” adds an inceptive sense.
    rationale: The Hebrew קִנֵּאתִי is a perfect describing the psalmist’s envy; it does not specifically say that he began to envy.
  - severity: low
    issue: “घमण्डियों” is broader than the source term’s boastful nuance.
    rationale: In this context הוֹלְלִים denotes boastful, self-exalting people. “डींग मारने वालों” preserves that feature more explicitly.
  revised_text: क्योंकि जब मैंने दुष्टों की सुख-शान्ति[a] देखी, तब मुझे डींग मारने वालों से ईर्ष्या हुई।
