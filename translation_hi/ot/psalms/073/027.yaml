source:
  edition: WLC
  text: כִּֽי הִנֵּ֣ה רְחֵקֶ֣י/ךָ יֹאבֵ֑דוּ הִ֝צְמַ֗תָּה כָּל זוֹנֶ֥ה מִמֶּֽ/ךָּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/027.yaml
  text: For behold[a], those far from you will perish; you destroy all who are unfaithful to you.
translation:
  language: hi
  text: 'क्योंकि देख, जो तुझसे दूर हैं वे नाश हो जाएँगे;

    तू उन सबका अन्त कर देता है जो तुझसे बेवफ़ाई करते हैं।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप में, “जो तुझसे दूर होकर वेश्या के समान आचरण करते हैं”; यह परमेश्वर के प्रति आध्यात्मिक या वाचा-संबंधी बेवफ़ाई का इब्रानी रूपक है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण या आधार प्रस्तुत करता है और इब्रानी के व्याख्यात्मक-कारणवाचक बल को बनाए रखता है।
- source_word: הִנֵּה
  choice: देख
  rationale: यह ध्यान आकर्षित करने वाला उद्गार है। ‘देख’ आधुनिक हिन्दी में स्वाभाविक रहते हुए उसके जोर को सुरक्षित रखता है।
- source_word: רְחֵקֶיךָ
  choice: जो तुझसे दूर हैं
  rationale: यह परमेश्वर से सम्बन्धात्मक दूरी के द्वारा पहचाने जाने वाले लोगों को दर्शाता है; हिन्दी में यह स्पष्ट और स्वाभाविक है।
- source_word: יֹאבֵדוּ
  choice: नाश हो जाएँगे
  rationale: אבד का अर्थ नष्ट होना या विनाश को प्राप्त होना है; भविष्यकालीन रूप को स्पष्ट रखा गया है।
- source_word: הִצְמַתָּה
  choice: तू ... अन्त कर देता है
  rationale: צמת के हिफ़ईल रूप में नष्ट करने या समाप्त कर देने का भाव है। इब्रानी पूर्ण रूप यहाँ निश्चित अथवा सूक्तिपरक कथन के रूप में समझा गया है, जो समानांतर पंक्ति में परमेश्वर के निर्णायक कार्य को व्यक्त करता है।
- source_word: כָּל
  choice: उन सबका
  rationale: इब्रानी के सर्वसमावेशी अर्थ को सुरक्षित रखता है।
- source_word: זוֹנֶה
  choice: जो ... बेवफ़ाई करते हैं
  rationale: यहाँ זנה का प्रयोग परमेश्वर के प्रति आध्यात्मिक अथवा वाचा-संबंधी विश्वासघात के रूपक के रूप में हुआ है। मुख्य पाठ में अर्थ स्पष्ट रखा गया है और सजीव मूल रूपक को पादटिप्पणी में दिया गया है।
- source_word: מִמֶּךָּ
  choice: तुझसे
  rationale: यह उस व्यक्ति को सूचित करता है जिससे फिरकर बेवफ़ाई की जाती है; ‘तुझसे बेवफ़ाई’ सहज हिन्दी प्रयोग है।
theological_decisions:
- issue: परमेश्वर के सम्बन्ध में זנה का रूपकात्मक अर्थ
  choice: इसे परमेश्वर के प्रति बेवफ़ाई के रूप में अनूदित किया गया है।
  alternative: ‘जो तुझसे फिरकर वेश्या जैसा आचरण करते हैं’
  rationale: निकट संदर्भ परमेश्वर से दूर होने और उसके निकट रहने की तुलना करता है। इसलिए यहाँ शाब्दिक वेश्यावृत्ति नहीं, बल्कि आध्यात्मिक या वाचा-संबंधी विश्वासघात मुख्य अर्थ है; पादटिप्पणी मूल रूपक को भी सुरक्षित रखती है।
- issue: הִצְמַתָּה के पूर्ण क्रियारूप का कालगत बल
  choice: ‘तू ... अन्त कर देता है’—निश्चित और सामान्य रूप से सत्य दैवी कार्य
  alternative: ‘तूने ... अन्त कर दिया है’
  rationale: पूर्ण रूप को केवल भूतकाल तक सीमित करने के बजाय काव्यात्मक समानांतरता और कथन की निश्चितता को व्यक्त किया गया है; इससे परमेश्वर के न्याय को किसी एक ऐतिहासिक घटना तक सीमित नहीं किया जाता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण काव्यात्मक शैली अपनाई गई है। परमेश्वर को सीधे संबोधन के अनुरूप एकवचन ‘तू/तुझसे’ रखा गया है। पंक्ति-विभाजन इब्रानी काव्य की समानांतर संरचना को दर्शाता है।
