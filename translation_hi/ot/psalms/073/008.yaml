lexical_decisions:
- source_word: יָמִיקוּ
  choice: वे ठट्ठा करते
  rationale: इस कठिन क्रिया का अर्थ अनिश्चित है; प्रसंग में घमंडी और तिरस्कारपूर्ण वाणी होने के कारण ‘ठट्ठा करते’ उपयुक्त है, जबकि भ्रष्टता का अर्थ अधिक अनुमानाधारित होगा।
- source_word: וִידַבְּרוּ
  choice: और ... बोलते हैं
  rationale: संयोजक के साथ क्रिया दुष्टों के व्यवहार का वर्णन आगे बढ़ाती है; हिन्दी में कर्ता पहले खंड से स्वाभाविक रूप से समझा जाता है।
- source_word: בְרָע
  choice: दुर्भावना से
  rationale: בְ उपसर्ग के साथ רָע यहाँ उनकी वाणी के ढंग अथवा भाव को बताता है; यह चयन नैतिक शत्रुता को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: עֹשֶׁק
  choice: अत्याचार
  rationale: यह संज्ञा दमन और शोषण का बोध कराती है; ‘अत्याचार’ सामाजिक और नैतिक बल को बनाए रखते हुए केवल आर्थिक उगाही तक अर्थ को सीमित नहीं करता।
- source_word: מִמָּרוֹם
  choice: ऊँचाई से
  rationale: शाब्दिक अर्थ ‘ऊँचाई से’ है। प्रसंग में यह स्थान के साथ-साथ घमंडी ढंग का रूपक भी हो सकता है; मुख्य पाठ में रूपक को खुला रखा गया है।
- source_word: יְדַבֵּרוּ
  choice: वे ... बातें करते हैं
  rationale: दूसरी बार आई बोलने की क्रिया को रखा गया है, ताकि इब्रानी की पुनरावृत्ति और समानांतर रचना बनी रहे।
