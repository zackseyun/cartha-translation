  yaml_path: translation/ot/psalms/073/025.yaml
  text: Whom have I in heaven but you? And besides you[a], I desire nothing on earth.
translation:
  language: hi
  text: स्वर्ग में मेरे लिए तेरे सिवा कौन है? और पृथ्वी पर तेरे सिवा[a] मैं कुछ नहीं चाहता।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप से: “और तेरे साथ पृथ्वी पर मैंने [कुछ] नहीं चाहा।” इब्रानी वाक्य में कर्म व्यक्त नहीं है। इसका भाव यह है कि भजनकार परमेश्वर के अतिरिक्त पृथ्वी पर कुछ नहीं चाहता।'
    reason: alternative_reading
lexical_decisions:
- source_word: מִי לִי
  choice: मेरा कौन है
  rationale: शाब्दिक रूप से ‘मेरे लिए कौन’; यहाँ यह संबंध और अपनेपन को व्यक्त करने वाला अस्तित्वसूचक मुहावरा है। ‘मेरा कौन है’ हिंदी में स्वाभाविक है और प्रश्न की आत्मीयता बनाए रखता है।
- source_word: בַשָּׁמָיִם
  choice: स्वर्ग में
  rationale: इब्रानी बहुवचन यहाँ स्वर्गीय क्षेत्र के सामूहिक अर्थ में है; हिंदी में ‘स्वर्ग में’ स्वाभाविक है।
- source_word: וְעִמְּךָ
  choice: और तेरे होते हुए
  rationale: शाब्दिक अर्थ ‘और तेरे साथ’ है। ‘तेरे होते हुए’ עִם के साथ/संग वाले भाव को रखते हुए इस अर्धपंक्ति के विशिष्ट संबंधपरक अर्थ को सहज हिंदी में व्यक्त करता है; इसकी दीर्घवृत्तात्मकता पादटिप्पणी में दी गई है।
- source_word: לֹא חָפַצְתִּי
  choice: मैं किसी और की इच्छा नहीं रखता
  rationale: חפץ इच्छा, चाह या प्रसन्नता को सूचित कर सकता है। सिद्ध काल यहाँ स्थिर वर्तमान मनोभाव व्यक्त करता है। ‘किसी और’ काव्य-समानांतरता में निहित विशिष्टता को स्पष्ट करता है, जबकि पादटिप्पणी अधिक शाब्दिक रूप सुरक्षित रखती है।
- source_word: בָאָרֶץ
  choice: पृथ्वी पर
  rationale: ‘स्वर्ग में’ के विपरीत यह पृथ्वी के क्षेत्र को दर्शाता है; ‘पृथ्वी पर’ स्वाभाविक हिंदी है और समानांतरता बनाए रखता है।
theological_decisions:
- issue: दूसरी अर्धपंक्ति का अर्थ
  choice: परमेश्वर की उपस्थिति में पृथ्वी पर किसी और की इच्छा न रखना
  alternative: ‘और तेरे साथ पृथ्वी पर मैंने [किसी वस्तु की] इच्छा नहीं की’ अथवा ‘तेरे सिवा पृथ्वी पर मैं कुछ नहीं चाहता’
  rationale: इब्रानी वाक्य दीर्घवृत्तात्मक है और उसका कर्म व्यक्त नहीं किया गया। मुख्य पाठ स्वर्ग और पृथ्वी की समानांतरता में परमेश्वर के प्रति अनन्य लगाव व्यक्त करता है, पर पादटिप्पणी शाब्दिक रचना और उसकी वास्तविक अस्पष्टता को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिंदी। परमेश्वर के लिए एकवचन आत्मीय संबोधन ‘तेरे’ रखा गया है, जो भजन की सीधी प्रार्थनात्मक वाणी के अनुकूल है।
