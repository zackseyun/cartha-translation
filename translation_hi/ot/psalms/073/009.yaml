  text: They set their mouth against the heavens[b][a], and their tongue struts through the earth.
translation:
  language: hi
  text: 'वे आकाश के विरुद्ध अपना मुँह लगाए रहते हैं[a],

    और उनकी जीभ धरती भर में अकड़ती फिरती है[b]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वे अपना मुँह आकाश में रखते हैं।” इब्रानी पूर्वसर्ग का अक्षरशः अर्थ “में” है, पर प्रसंग में आकाश की ओर उद्दंड वाणी का भाव जान पड़ता है।
    reason: lexical_alternative
  - marker: b
    text: अक्षरशः, “उनकी जीभ धरती पर चलती है।” यहाँ “अकड़ती फिरती है” दुष्टों की घमंडी वाणी का प्रसंगगत भाव व्यक्त करता है।
    reason: lexical_alternative
