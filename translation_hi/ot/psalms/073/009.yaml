- source_word: בַשָּׁמַיִם
  choice: आकाश के विरुद्ध
  rationale: पूर्वसर्ग का अक्षरशः अर्थ ‘में’ है, पर प्रसंग में वाणी का उद्दंडतापूर्वक स्वर्ग की ओर या उसके विरुद्ध उठना अभिप्रेत जान पड़ता है। हिन्दी में ‘आकाश के विरुद्ध’ इस भाव को स्पष्ट रखता है; अक्षरशः विकल्प पादटिप्पणी में दिया गया है।
- source_word: פִּיהֶם
  choice: अपना मुँह
  rationale: इब्रानी में बहुवचन कर्ता के साथ एकवचन सामूहिक रूप है। हिन्दी में ‘वे अपना मुँह’ स्वाभाविक है और काव्यात्मक संक्षिप्तता बनाए रखता है।
- source_word: וּלְשׁוֹנָם
  choice: उनकी जीभ
  rationale: एकवचन प्रतिनिधिक/सामूहिक प्रयोग को हिन्दी में बनाए रखने से ‘मुँह—जीभ’ का समानांतर चित्र सुरक्षित रहता है।
- source_word: תִּהֲלַךְ
  choice: अकड़कर चलती है
  rationale: क्रिया का मूल अर्थ ‘चलना/जाना’ है। प्रसंग की घमंडी वाणी को व्यक्त करने के लिए ‘अकड़कर’ जोड़ा गया है, जबकि ‘चलती है’ मूल रूपक को बनाए रखता है।
- source_word: בָּאָרֶץ
  choice: धरती भर में
  rationale: आकाश के साथ विरोधी समानांतरता विश्वव्यापी विस्तार की ओर संकेत करती है। गति-सूचक क्रिया के साथ ‘धरती भर में’ स्वाभाविक हिन्दी है और केवल किसी स्थानीय देश तक अर्थ को सीमित नहीं करता।
