    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: निश्चय ही
  rationale: यहाँ अव्यय प्रतिबंध नहीं, बल्कि भजनकार की दृढ़ और सुधरी हुई समझ पर बल देता है।
- source_word: בַּחֲלָקוֹת
  choice: फिसलन भरी जगहों पर
  rationale: शाब्दिक अर्थ ‘चिकनी जगहों में/पर’ है; प्रसंग में यह अस्थिर और संकटपूर्ण स्थिति का बिंब है।
- source_word: תָּשִׁית לָמוֹ
  choice: तू उन्हें ... रखता है
  rationale: क्रिया का सामान्य अर्थ ‘रखना/स्थापित करना’ है; एकवचन संबोधन और बहुवचन कर्म को स्पष्ट रखा गया है।
- source_word: הִפַּלְתָּם
  choice: तू उन्हें गिराकर ... डाल देता है
  rationale: नפל के हिफ़ील रूप की कारक शक्ति, अर्थात उन्हें गिराने की प्रत्यक्ष क्रिया, स्वाभाविक हिन्दी में व्यक्त होती है।
- source_word: לְמַשּׁוּאוֹת
  choice: विनाश में
  rationale: बहुवचन संज्ञा उजाड़, बरबादी या विनाश को सूचित करती है; हिन्दी में ‘विनाश में’ परिणाम और दिशा दोनों को सहज रूप से व्यक्त करता है।
theological_decisions:
- issue: दुष्टों के पतन में परमेश्वर की प्रत्यक्ष भूमिका
  choice: ‘तू ... रखता है; तू उन्हें गिराकर ... डाल देता है’
  alternative: परिस्थितियों या उनके अपने कदमों के कारण वे गिरते हैं
  rationale: दोनों हिब्रू क्रियाएँ परमेश्वर को संबोधित द्वितीय पुरुष एकवचन में हैं और स्थान तथा पतन की क्रिया उसी को सौंपती हैं; इस तनाव को नरम नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज शैली। भजन में परमेश्वर से सीधे एकवचन संबोधन के कारण ‘तू’ रखा गया है। समानांतर काव्य-पंक्तियों और प्रत्यक्ष दिव्य कर्तृत्व को सुरक्षित रखा गया है।
