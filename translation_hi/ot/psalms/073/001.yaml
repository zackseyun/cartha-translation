  text: A psalm of Asaph[a]. Surely God is good to Israel[b], to those pure in heart.
translation:
  language: hi
  text: 'आसाफ का[a] भजन।


    निश्चय ही परमेश्वर इस्राएल के प्रति भला है—शुद्ध हृदयवालों के प्रति।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “आसाफ के लिए”; इब्रानी शीर्षक आसाफ से लेखन, संबंध या समर्पण का संकेत दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְמוֹר
  choice: भजन
  rationale: यह भजन-संग्रह के शीर्षकों में प्रयुक्त मानक शब्द है; हिन्दी में ‘भजन’ इसके काव्य और उपासना-संबंधी स्वरूप को स्वाभाविक रूप से व्यक्त करता है।
- source_word: לְאָסָף
  choice: आसाफ का
  rationale: शीर्षक में לְ लेखन, संबंध, स्वामित्व या समर्पण का संकेत दे सकता है। ‘आसाफ का’ संक्षिप्त और प्रचलित है, जबकि वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: אַךְ
  choice: निश्चय ही
  rationale: यहाँ यह भजन की आरंभिक दृढ़ पुष्टि को व्यक्त करता है। ‘निश्चय ही’ वर्तमान हिन्दी में स्वाभाविक है और कथन के बल को बनाए रखता है।
- source_word: טוֹב
  choice: भला
  rationale: ‘भला’ परमेश्वर के अच्छे और हितकारी होने, दोनों भावों को बिना अनावश्यक रूप से सीमित किए व्यक्त करता है।
- source_word: לְיִשְׂרָאֵל
  choice: इस्राएल के प्रति
  rationale: सम्बन्ध अथवा हित दर्शाने वाले לְ को ‘के प्रति’ हिन्दी में ‘भला है’ के साथ स्वाभाविक ढंग से व्यक्त करता है।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: यहाँ शब्द एकवचन अर्थ में इस्राएल के परमेश्वर के लिए प्रयुक्त है; ‘परमेश्वर’ मानक और स्पष्ट हिन्दी पर्याय है।
- source_word: לְבָרֵי לֵבָב
  choice: शुद्ध हृदयवालों के प्रति
  rationale: בָּרֵי का अर्थ ‘शुद्ध/निर्मल’ और לֵבָב का अर्थ आंतरिक हृदय या मन है। यह चयन नैतिक-आंतरिक भाव को संक्षिप्त, गरिमापूर्ण हिन्दी में रखता है।
theological_decisions:
- issue: ‘इस्राएल’ और ‘शुद्ध हृदयवालों’ के बीच संबंध
  choice: दोनों पदों को विराम-चिह्न के सहारे साथ रखा गया है, ताकि दूसरा पद पहले का स्पष्टीकरण भी समझा जा सके
  alternative: दो अलग किंतु समानांतर लाभार्थी समूह—इस्राएल और शुद्ध हृदयवाले
  rationale: दोनों इब्रानी पद לְ से आरंभ होते हैं और काव्य में दूसरा पद पहले को निर्दिष्ट या पुनः व्यक्त कर सकता है। डैश संबंध को खुला रखता है और ‘अर्थात्’ जोड़कर व्याख्या को निर्णायक नहीं बनाता।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, काव्यात्मक और गरिमापूर्ण शैली रखी गई है। ‘शुद्ध हृदयवाले’ सामान्य पाठक के लिए स्पष्ट है, और डैश इब्रानी समानांतरता तथा उसके संबंध की संभावित अस्पष्टता को सुरक्षित रखता है।
