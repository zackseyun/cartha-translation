  yaml_path: translation/ot/psalms/073/000.yaml
  text: A psalm of Asaph[a]. Surely God is good to Israel[b], to the pure of heart.
translation:
  language: hi
  text: 'आसाफ़ का भजन।


    निश्चय ही परमेश्वर इस्राएल के लिए भला है, उन लोगों के लिए जिनका हृदय शुद्ध है।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִזְמוֹר לְאָסָף
  choice: आसाफ़ का भजन
  rationale: शीर्षक में לְ संबंध या रचनाकारिता बता सकता है। हिन्दी में प्रचलित और स्वाभाविक शीर्षक रखा गया है, बिना यह निश्चित किए कि आसाफ़ स्वयं रचयिता थे।
- source_word: אַךְ
  choice: निश्चय ही
  rationale: यहाँ अव्यय कथन पर बल देता है; “निश्चय ही” उसके दृढ़ आश्वासन को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: טוֹב ... אֱלֹהִים
  choice: परमेश्वर ... भला है
  rationale: इब्रानी नामवाचक वाक्य का अर्थ और धर्मवैचारिक बल बनाए रखते हुए हिन्दी की स्वाभाविक शब्द-व्यवस्था अपनाई गई है।
- source_word: לְיִשְׂרָאֵל
  choice: इस्राएल के प्रति
  rationale: לְ यहाँ भलाई के लाभार्थी या लक्ष्य को दर्शाता है; “के प्रति” हिन्दी में इस संबंध को स्पष्ट करता है।
- source_word: לְבָרֵי לֵבָב
  choice: उनके प्रति जिनका हृदय शुद्ध है
  rationale: शाब्दिक अर्थ “हृदय के शुद्ध लोगों के लिए/प्रति” है। यह रूप दूसरे पदबंध को इस्राएल की व्याख्या के रूप में सहजता से प्रस्तुत करता है।
theological_decisions:
- issue: “इस्राएल” और “शुद्ध हृदय वालों” का संबंध
  choice: 'दूसरे पदबंध को व्याख्यात्मक रूप में प्रस्तुत किया: “उनके प्रति जिनका हृदय शुद्ध है”'
  alternative: 'दो समानांतर लाभार्थी समूह: “इस्राएल के प्रति, शुद्ध हृदय वालों के प्रति”'
  rationale: इब्रानी में दोनों पदबंध समान לְ से आरम्भ होते हैं, पर दूसरा पहले की व्याख्या या विशेषता हो सकता है। चुना हुआ रूप हिन्दी में कविता का प्रवाह बनाए रखता है, जबकि “उनके” को इस्राएल की ओर लौटाकर अनावश्यक रूप से अलग समूह बनाने से बचता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और काव्यात्मक शैली रखी गई है। “परमेश्वर,” “इस्राएल,” “हृदय” और “भजन” जैसे सामान्य बाइबलीय शब्द प्रयुक्त हैं। किसी फुटनोट की आवश्यकता नहीं पड़ी, इसलिए मुख्य पाठ में कोई फुटनोट-चिह्न नहीं है।
