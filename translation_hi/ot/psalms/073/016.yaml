lexical_decisions:
- source_word: וָאֲחַשְּׁבָה
  choice: पर जब मैंने…विचार किया
  rationale: חשׁב का मूल अर्थ ‘सोचना/विचार करना’ है। प्रसंग में वाव को विरोधसूचक ‘पर’ और क्रिया को प्रथम पुरुष के चिंतन के रूप में रखा गया है।
- source_word: לָדַעַת
  choice: समझने का
  rationale: ידע का सामान्य अर्थ ‘जानना’ है, पर यहाँ विचार के विषय को बौद्धिक रूप से ग्रहण करने के अर्थ में ‘समझना’ स्वाभाविक है।
- source_word: זֹאת
  choice: इसे
  rationale: संकेतवाचक शब्द पिछले प्रसंग की उलझन की ओर लौटता है; ‘इसे’ उस संदर्भ को निहित ही रहने देता है।
- source_word: עָמָל
  choice: कठिन परिश्रम
  rationale: עמל में श्रम, कष्ट और क्लेश का अर्थ-क्षेत्र है। ‘कठिन परिश्रम’ मानसिक प्रयास की श्रमसाध्यता को व्यक्त करता है, जबकि वैकल्पिक ‘कष्टकर’ पाठ टिप्पणी में दिया गया है।
- source_word: הִיא
  choice: यह…था
  rationale: स्त्रीलिंग सर्वनाम זֹאת की ओर संकेत करते हुए विधेयात्मक है; हिन्दी में स्वाभाविक रूप से ‘यह…था’ कहा गया है।
- source_word: בְעֵינָי
  choice: मेरी दृष्टि में
  rationale: शाब्दिक बिंब ‘मेरी आँखों में’ है, जिसका मुहावरेदार अर्थ ‘मेरी दृष्टि में/मेरे लिए’ है। ‘मेरी दृष्टि में’ बिंब और अर्थ दोनों को सुरक्षित रखता है।
