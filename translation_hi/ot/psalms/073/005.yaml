lexical_decisions:
- source_word: בַּעֲמַל
  choice: कष्ट में
  rationale: עָמָל कष्ट, कठिन परिश्रम या दुख का बोध करा सकता है। यहाँ दुष्टों के सामान्य मानवीय कठिनाइयों से बचे दिखने के संदर्भ में ‘कष्ट’ स्वाभाविक और व्यापक है।
- source_word: אֱנוֹשׁ
  choice: नश्वर मनुष्य
  rationale: אֱנוֹשׁ में मनुष्य की दुर्बलता और मरणशीलता का भाव हो सकता है; ‘नश्वर मनुष्य’ उस विशेषता को सुरक्षित रखता है।
- source_word: אֵינֵמוֹ
  choice: वे ... नहीं पड़ते
  rationale: प्रत्यययुक्त नकारात्मक अस्तित्ववाचक रूप का आशय है कि ऐसा कष्ट उनके हिस्से में नहीं है; हिंदी में ‘नहीं पड़ते’ प्रसंगानुकूल मुहावरेदार अभिव्यक्ति है।
- source_word: וְעִם
  choice: और ... के साथ
  rationale: עִם सहभागिता या संगति व्यक्त करता है; ‘के साथ’ सीधा हिंदी समतुल्य है।
- source_word: אָדָם
  choice: दूसरे मनुष्य
  rationale: אָדָם यहाँ सामान्य मानवजाति को सूचित करता है। पहले पदांश के אֱנוֹשׁ से भेद और हिंदी की सहजता के लिए ‘दूसरे मनुष्य’ लिया गया है, अर्थात सामान्य लोगों के साथ।
- source_word: יְנֻגָּעוּ
  choice: विपत्तियाँ ... झेलते
  rationale: נגע का यह रूप पीड़ित, आघातग्रस्त या विपत्तिग्रस्त किए जाने का अर्थ देता है। ‘विपत्तियाँ झेलते’ हिंदी में स्वाभाविक रहते हुए वास्तविक दुःख-पीड़ा को व्यक्त करता है।
