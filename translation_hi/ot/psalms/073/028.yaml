  text: But as for me[a], the nearness of God is good for me; I have made the Lord GOD my refuge, so that I may tell of all your works.
translation:
  language: hi
  text: परन्तु मेरे लिए परमेश्वर की निकटता[a] भली है; मैंने प्रभु याहवे को अपना शरणस्थान बनाया है, ताकि मैं तेरे सब कामों का वर्णन करूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “परमेश्वर के निकट जाना मेरे लिए भला है।” इब्रानी संज्ञा परमेश्वर के साथ संबंधपरक निकटता को व्यक्त कर सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: परन्तु मेरे लिए
  rationale: संयोजक और स्वतंत्र सर्वनाम पिछले प्रसंग के विपरीत भजनकार की स्थिति पर बल देते हैं। हिन्दी में यह वाक्यांश उस विरोध और व्यक्तिगत बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: קִרֲבַת אֱלֹהִים
  choice: परमेश्वर की निकटता
  rationale: इब्रानी भाववाचक संज्ञा और संबंध-रचना को बनाए रखते हुए यह अनुवाद परमेश्वर की निकटता तथा परमेश्वर के निकट होने—दोनों संभावित संबंधपरक अर्थों को खुला रखता है।
- source_word: לִי טוֹב
  choice: मेरे लिए ... भली है
  rationale: यह विधेय-रचना भजनकार के लिए हित और कल्याण व्यक्त करती है; स्त्रीलिंग ‘भली’ का मेल ‘निकटता’ से है।
- source_word: שַׁתִּי
  choice: मैंने ... बनाया है
  rationale: क्रिया का मूल अर्थ रखना या ठहराना है; शरणस्थान के साथ ‘बनाया है’ सचेत भरोसा रखने का स्वाभाविक हिन्दी मुहावरा है।
- source_word: בַּאדֹנָי יְהוִה
  choice: प्रभु याहवे को
  rationale: ‘प्रभु’ אֲדֹנָי की उपाधि और ‘याहवे’ יהוה के व्यक्तिगत नाम को अलग-अलग सुरक्षित रखता है तथा ‘प्रभु प्रभु’ जैसी अस्वाभाविक पुनरुक्ति से बचाता है।
- source_word: מַחְסִי
  choice: अपना शरणस्थान
  rationale: מַחְסֶה संकट में सुरक्षा पाने के स्थान को दर्शाता है; ‘शरणस्थान’ काव्यात्मक, स्पष्ट और सटीक है।
- source_word: לְסַפֵּר
  choice: ताकि मैं ... वर्णन करूँ
  rationale: לְ के साथ धातुरूप यहाँ उद्देश्य व्यक्त कर सकता है। ‘वर्णन करूँ’ परमेश्वर के कार्यों को गिनाकर सुनाने या घोषित करने का भाव देता है।
- source_word: כָּל מַלְאֲכוֹתֶיךָ
  choice: तेरे सब कामों
  rationale: כָּל का पूर्ण परिमाण ‘सब’ से और מְלָאכָה का व्यापक अर्थ ‘कामों’ से सीधे व्यक्त होता है। एकवचन संबोधन ‘तेरे’ मूल पाठ के दूसरे पुरुष एकवचन को बनाए रखता है।
theological_decisions:
- issue: קִרֲבַת אֱלֹהִים में संबंध की दिशा
  choice: परमेश्वर की निकटता
  alternative: परमेश्वर के निकट जाना
  rationale: मूल पाठ संज्ञात्मक और संबंध की दृष्टि से कुछ हद तक खुला है। मुख्य पाठ औपचारिक अस्पष्टता को सुरक्षित रखता है; अधिक क्रियात्मक समझ पादटिप्पणी में दी गई है।
- issue: אֲדֹנָי יְהוִה में उपाधि और दिव्य नाम
  choice: प्रभु याहवे
  alternative: प्रभु परमेश्वर
  rationale: यह चयन उपाधि אֲדֹנָי और व्यक्तिगत दिव्य नाम יהוה दोनों को स्पष्ट रखता है, बिना दिव्य नाम को किसी सामान्य पदवी में विलीन किए।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध रखी गई है। ‘परन्तु’, ‘शरणस्थान’ और ‘वर्णन’ भजन की काव्यात्मक गरिमा बनाए रखते हैं; संबोधन के लिए मूल के एकवचन के अनुरूप ‘तेरे’ प्रयुक्त है।
