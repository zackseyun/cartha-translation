  yaml_path: translation/ot/psalms/073/024.yaml
  text: With your counsel you guide me[a], and afterward you will receive me to glory.
translation:
  language: hi
  text: आप अपने परामर्श से मेरी अगुवाई करते हैं, और बाद में मुझे महिमा में ग्रहण करेंगे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और बाद में मुझे सम्मान के साथ ग्रहण करेंगे।”
    reason: 'वैकल्पिक अर्थ: כָּבוֹד को ‘महिमा’ के बजाय ‘सम्मान’ और उसके संबंध को साधन/रीति के रूप में समझा जा सकता है।'
lexical_decisions:
- source_word: בַּעֲצָתְךָ
  choice: अपनी सम्मति से
  rationale: עֵצָה का अर्थ सम्मति, परामर्श या योजना हो सकता है; उपसर्ग ב यहाँ साधन का बोध कराता है। यह पदबंध परमेश्वर की सम्मति द्वारा मार्गदर्शन को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: תַנְחֵנִי
  choice: मेरी अगुवाई करते हैं
  rationale: נחה के हिफ़ील रूप का अर्थ अगुवाई करना या मार्ग दिखाना है। यहाँ वर्तमानकालीन आश्वस्त कथन के रूप में यह हिंदी में स्वाभाविक है।
- source_word: וְאַחַר
  choice: और उसके बाद
  rationale: אַחַר यहाँ कालवाचक क्रियाविशेषण की तरह आगे होने वाली बात का संकेत देता है।
- source_word: כָּבוֹד
  choice: महिमा
  rationale: כָּבוֹד का अर्थ महिमा या सम्मान हो सकता है। मुख्य पाठ में 'महिमा' पद की ऊँची और संभवतः भविष्यपरक ध्वनि को बनाए रखता है, जबकि वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: תִּקָּחֵנִי
  choice: मुझे ग्रहण करेंगे
  rationale: לקח का अर्थ लेना या ग्रहण करना है। 'ग्रहण करेंगे' यहाँ परमेश्वर द्वारा अपने पास लिए जाने की संभावना को व्यक्त करता है, बिना उसकी रीति को अधिक स्पष्ट किए।
theological_decisions:
- issue: אַחַר כָּבוֹד תִּקָּחֵנִי का अर्थ
  choice: उसके बाद मुझे महिमा में ग्रहण करेंगे
  alternative: उसके बाद मुझे सम्मान के साथ ग्रहण करेंगे
  rationale: इब्रानी वाक्यांश संक्षिप्त है और 'महिमा में ग्रहण करना' तथा 'सम्मान के साथ ग्रहण करना' दोनों अर्थों की गुंजाइश रखता है। मुख्य पाठ भविष्यपरक और उन्नत ध्वनि को रखता है; पादटिप्पणी सम्मान वाले अर्थ को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिंदी में आदरार्थी क्रिया-रूप रखा गया है। भाषा सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य है; संक्षिप्त इब्रानी वाक्य की वास्तविक अर्थगत खुलावट पादटिप्पणी द्वारा सुरक्षित रखी गई है।
