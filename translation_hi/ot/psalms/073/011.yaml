source:
  edition: WLC
  text: וְֽ/אָמְר֗וּ אֵיכָ֥ה יָדַֽע אֵ֑ל וְ/יֵ֖שׁ דֵּעָ֣ה בְ/עֶלְיֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/011.yaml
  text: And they say[b][a], “How does God know? Is there knowledge in the Most High?”
translation:
  language: hi
  text: और वे कहते हैं[a], “परमेश्वर कैसे जानता है? क्या परमप्रधान में ज्ञान है?”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “और उन्होंने कहा,” यदि इब्रानी पूर्ण क्रिया को बार-बार कही जाने वाली बात के बजाय साधारण भूतकाल माना जाए।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से “परमप्रधान में”; आशय यह प्रश्न करना है कि क्या परमप्रधान ज्ञान रखता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמְרוּ
  choice: और वे कहते हैं
  rationale: काव्यात्मक प्रसंग में पूर्ण क्रिया दुष्टों की बार-बार प्रकट होने वाली वाणी का वर्तमान-जैसा वर्णन कर सकती है; इसलिए वर्तमान काल स्वाभाविक है, जबकि साधारण भूतकाल भी संभव है।
- source_word: אֵיכָה
  choice: कैसे
  rationale: यह प्रश्नवाचक क्रियाविशेषण सीधे ‘कैसे?’ पूछता है; इसमें स्रोत में स्पष्ट न होने वाली सामर्थ्य की धारणा नहीं जोड़ी गई।
- source_word: יָדַע אֵל
  choice: परमेश्वर कैसे जानता है
  rationale: יָדַע का अर्थ ‘जानना’ और אֵל का अर्थ यहाँ सामान्य ईश्वरीय पद ‘परमेश्वर’ है; हिंदी प्रश्न-विन्यास स्वाभाविक रखते हुए तीखा आलंकारिक प्रश्न सुरक्षित रखा गया।
- source_word: וְיֵשׁ דֵּעָה
  choice: क्या ... ज्ञान है
  rationale: अस्तित्वसूचक יֵשׁ को प्रश्न के रूप में और דֵּעָה को ‘ज्ञान’ अनूदित किया गया, जिससे पहले पद के ‘जानता’ के साथ शब्दार्थगत समानांतरता बनी रहती है।
- source_word: בְעֶלְיוֹן
  choice: परमप्रधान में
  rationale: בְּ का मूल ‘में’ और עֶלְיוֹן का प्रचलित ईश्वरीय पद ‘परमप्रधान’ रखा गया है; असामान्य किंतु अर्थपूर्ण इब्रानी अभिव्यक्ति को व्याख्यात्मक रूप से ‘परमप्रधान के पास’ में नहीं बदला गया।
theological_decisions:
- issue: ईश्वरीय पद עֶלְיוֹן का अनुवाद
  choice: परमप्रधान
  alternative: सर्वोच्च
  rationale: ‘परमप्रधान’ आधुनिक हिंदी बाइबलीय प्रयोग में परिचित ईश्वरीय पद है और परमेश्वर की सर्वोच्चता व्यक्त करता है, बिना इसे निजी नाम या अतिरिक्त सिद्धांत में बदलने के।
- issue: בְעֶלְיוֹן में ज्ञान के संबंध की अभिव्यक्ति
  choice: परमप्रधान में ज्ञान है
  alternative: परमप्रधान के पास ज्ञान है
  rationale: मुख्य पाठ इब्रानी ‘में’ को सुरक्षित रखता है और यह प्रश्न खुला रहने देता है कि वक्ता परमप्रधान में ज्ञान की उपस्थिति या उसके ज्ञान-धारण पर कटाक्ष कर रहे हैं; अधिक सहज स्वामित्वसूचक अर्थ पादटिप्पणी में बताया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। प्रश्नों की व्यंग्यात्मक तीक्ष्णता और ‘जानता/ज्ञान’ की समानांतरता बचाई गई है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में दिए गए हैं।
