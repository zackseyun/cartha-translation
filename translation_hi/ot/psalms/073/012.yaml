lexical_decisions:
- source_word: הִנֵּה
  choice: देखो
  rationale: यह कथन की ओर ध्यान खींचने वाला संकेतसूचक उद्गार है; आधुनिक हिन्दी में ‘देखो’ स्वाभाविक और प्रभावपूर्ण है।
- source_word: אֵלֶּה רְשָׁעִים
  choice: ये ही दुष्ट हैं
  rationale: אֵלֶּה पहले वर्णित लोगों की ओर संकेत करता है, और רְשָׁעִים उन्हें नैतिक वर्ग के रूप में ‘दुष्ट’ कहता है। ‘ही’ भजनकार की पहचानात्मक और विस्मयपूर्ण दृष्टि को स्वाभाविक हिन्दी में उभारता है।
- source_word: וְשַׁלְוֵי עוֹלָם
  choice: सदा निश्चिन्त रहते हैं
  rationale: שָׁלֵו चैन, निश्चिन्तता या सुरक्षा का भाव देता है और עוֹלָם उसके दीर्घस्थायी होने को बताता है। सन्दर्भ में यह दुष्टों की लगातार बनी हुई सुख-सुविधा और बेफिक्री का वर्णन है।
- source_word: הִשְׂגּוּ
  choice: बढ़ाते जाते हैं
  rationale: हिफ़ील क्रिया का अर्थ यहाँ प्राप्त करना, संचित करना या बढ़ाना हो सकता है। ‘बढ़ाते जाते हैं’ निरन्तर समृद्धि के सन्दर्भ को व्यक्त करता है, जबकि वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: חָיִל
  choice: धन
  rationale: इस शब्द के अर्थ-क्षेत्र में सामर्थ्य, सेना और सम्पत्ति आते हैं; दुष्टों की समृद्धि के इस प्रसंग में आर्थिक अर्थ ‘धन’ सबसे उपयुक्त है।
