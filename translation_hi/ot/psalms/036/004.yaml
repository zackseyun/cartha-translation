source:
  edition: WLC
  text: אָ֤וֶן יַחְשֹׁ֗ב עַֽל מִשְׁכָּ֫ב֥/וֹ יִ֭תְיַצֵּב עַל דֶּ֣רֶךְ לֹא ט֑וֹב רָ֝֗ע לֹ֣א יִמְאָֽס׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/036/004.yaml
  text: He devises wickedness on his bed[a]; he sets himself on a way that is not good; he does not reject evil.
translation:
  language: hi
  text: वह अपने बिछौने पर दुष्टता की योजनाएँ बनाता है; वह ऐसे मार्ग पर अड़ जाता है जो अच्छा नहीं; वह बुराई को ठुकराता नहीं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָוֶן
  choice: दुष्टता
  rationale: संदर्भ में यह शब्द नैतिक बुराई और अधर्म का बोध कराता है; आगे आए רָע से कुछ शब्दगत भिन्नता भी बनी रहती है।
- source_word: יַחְשֹׁב
  choice: योजनाएँ बनाता है
  rationale: חשב यहाँ केवल सोचने के बजाय जानबूझकर मन में योजना गढ़ने का भाव देता है; बहुवचन हिंदी में स्वाभाविक है और इब्रानी सामूहिक भाव को व्यक्त करता है।
- source_word: עַל מִשְׁכָּבוֹ
  choice: अपने बिछौने पर
  rationale: यह स्थानसूचक चित्र को सीधे बनाए रखता है और काव्यात्मक किंतु सुबोध हिंदी है।
- source_word: יִתְיַצֵּב
  choice: अड़ जाता है
  rationale: हित्पएल रूप किसी मार्ग पर स्वयं को दृढ़ता से स्थापित करने का भाव देता है; 'अड़ जाता है' जानबूझकर टिके रहने की नकारात्मक छाया को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: עַל דֶּרֶךְ לֹא טוֹב
  choice: ऐसे मार्ग पर ... जो अच्छा नहीं
  rationale: मार्ग के आचरण-संबंधी रूपक और मूल के नकारात्मक कथन दोनों को बिना 'बुरा मार्ग' में समेटे सुरक्षित रखा गया है।
- source_word: רָע
  choice: बुराई
  rationale: यहाँ नैतिक बुराई क्रिया का कर्म है; 'बुराई' सीधा और आधुनिक हिंदी रूप है।
- source_word: לֹא יִמְאָס
  choice: ठुकराता नहीं
  rationale: מאס में अस्वीकार करने, तुच्छ जानने या घृणा से दूर करने की अर्थ-सीमा है; 'ठुकराता नहीं' नैतिक अस्वीकृति के अभाव को स्पष्ट रखता है, बिना अधिक तीव्र अर्थ थोपे।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण, काव्यात्मक और सामान्य पाठक के लिए सुबोध शैली। तीनों इब्रानी खंडों की क्रमिक गति—मन में योजना, मार्ग पर दृढ़ होना, और बुराई को न ठुकराना—बनाए रखी गई है।
