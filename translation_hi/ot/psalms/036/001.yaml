source:
  edition: WLC
  text: נְאֻֽם פֶּ֣שַׁע לָ֭/רָשָׁע בְּ/קֶ֣רֶב לִבִּ֑/י אֵֽין פַּ֥חַד אֱ֝לֹהִ֗ים לְ/נֶ֣גֶד עֵינָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/036/001.yaml
  text: 'Transgression speaks to the wicked within my heart: there is no fear of God before his eyes[a][b].'
translation:
  language: hi
  text: 'मेरे हृदय के भीतर, अपराध दुष्ट से यह कहता है: उसकी आँखों के सामने परमेश्वर का भय नहीं है।[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी: “मेरे हृदय के भीतर।” कुछ प्राचीन अनुवाद और कई आधुनिक अनुवाद इसे सुगम बनाकर “उसके हृदय के भीतर” करते हैं, या भावार्थ देते हैं, “दुष्ट के विषय में मेरे हृदय में एक संदेश है।”'
    reason: alternative_reading
  - marker: b
    text: 'शब्द-क्रम के अनुसार यह भी अनूदित हो सकता है: “अपराध दुष्ट से मेरे हृदय के भीतर यह कहता है।”'
    reason: previous_rendering
lexical_decisions:
- source_word: נְאֻם
  choice: कहता है
  rationale: यह संज्ञा किसी गंभीर कथन या उद्घोषणा का परिचय देती है। हिन्दी में क्रियात्मक रूप ‘कहता है’ स्वाभाविक है और भीतर सुनाई देने वाले कथन का भाव बनाए रखता है।
- source_word: פֶּשַׁע
  choice: अपराध
  rationale: यह शब्द विद्रोह और जानबूझकर किए गए गलत काम का बोध कराता है। ‘अपराध’ सामान्य आधुनिक हिन्दी में नैतिक दोष का भार रखता है, बिना इसे केवल कानूनी संदर्भ तक सीमित किए।
- source_word: לָרָשָׁע
  choice: दुष्ट से
  rationale: 'लְ को संबोधन के प्राप्तकर्ता के रूप में लिया गया है: अपराध दुष्ट व्यक्ति से कहता है। ‘दुष्ट’ प्रतिनिधिक एकवचन को बनाए रखता है।'
- source_word: בקרב לבי
  choice: मेरे हृदय के भीतर
  rationale: मसोरेटिक पाठ में प्रथम पुरुष एकवचन ‘मेरे हृदय’ है। कठिन होने पर भी इसे बदलकर ‘उसके हृदय’ नहीं किया गया; आरंभ में रखने से हिन्दी में इसका संबंध कथन के स्थान से स्पष्ट होता है।
- source_word: אֵין פַּחַד אֱלֹהִים
  choice: परमेश्वर का कोई भय नहीं है
  rationale: यह परमेश्वर के प्रति श्रद्धामय भय का प्रचलित बाइबलीय भाव है। ‘भय’ मूल की व्यापकता बनाए रखता है; ‘दहशत’ अर्थ को अत्यधिक संकीर्ण कर देता।
- source_word: לנגד עיניו
  choice: उसकी आँखों के सामने
  rationale: यह मुहावरा उस बात को दर्शाता है जो किसी की दृष्टि या विचार में रहती है। हिन्दी रूपक को स्वाभाविक ढंग से बनाए रखती है।
theological_decisions:
- issue: कठिन मसोरेटिक पाठ לִבִּי (‘मेरे हृदय’) में सर्वनाम और दृष्टिकोण
  choice: प्रथम पुरुष ‘मेरे हृदय’ को बनाए रखा गया है; भजनकार अपने भीतर अपराध का वह कथन सुनता या पहचानता है जो दुष्ट से संबोधित है।
  alternative: इसे ‘उसके हृदय के भीतर’ करना, अथवा अर्थ खोलकर ‘दुष्ट के विषय में मेरे हृदय में यह संदेश है’ कहना।
  rationale: स्वरांकित इब्रानी पाठ स्पष्ट रूप से प्रथम पुरुष एकवचन का समर्थन करता है। कठिनाई को पाठ-संशोधन या व्याख्यात्मक विस्तार से दूर करने के बजाय मूल का तनाव सुरक्षित रखा गया है; अगले खंड में ‘उसकी आँखों’ का संबंध दुष्ट से रहता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य हिन्दी। ‘मेरे हृदय के भीतर’ को आगे रखकर कठिन प्रथम-पुरुष पाठ सुरक्षित रखते हुए भ्रामक संबंध से बचाया गया है।
