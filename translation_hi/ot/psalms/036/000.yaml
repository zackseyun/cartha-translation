  yaml_path: translation/ot/psalms/036/000.yaml
  text: For the choirmaster[a]. Of David[d][c][b], the servant of Yahweh.
translation:
  language: hi
  text: संगीत-निर्देशक के लिए[a]। याहवे के सेवक, दाऊद का[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “प्रधान वादक के लिए।” हिब्रू पद उपासना-संगीत का नेतृत्व करने वाले व्यक्ति को सूचित करता है।
    reason: lexical_alternative
  - marker: b
    text: “दाऊद का” कर्तृत्व, समर्पण या व्यापक संबद्धता का बोध करा सकता है; केवल इस शीर्षक से यह निश्चित नहीं होता कि अर्थ अनिवार्य रूप से “दाऊद द्वारा रचित” ही है। हिब्रू में दाऊद को याहवे का सेवक कहा गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: संगीत-निर्देशक के लिए
  rationale: भजन-संग्रह के शीर्षकों में यह पद उपासना-संगीत का नेतृत्व या निरीक्षण करने वाले व्यक्ति को संबोधित करता है। ‘संगीत-निर्देशक’ आधुनिक हिन्दी में स्पष्ट है और केवल गायक-मंडली तक अर्थ को सीमित नहीं करता।
- source_word: לְעֶבֶד
  choice: के सेवक
  rationale: यहाँ עֶבֶד दाऊद के लिए आदरसूचक धार्मिक पदवी है; प्रसंग बंधुआ स्थिति पर बल नहीं देता, इसलिए ‘दास’ की अपेक्षा ‘सेवक’ अधिक स्वाभाविक है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत नाम יהוה है। शीर्षक के स्थान पर नाम को लिप्यंतरित करके रखा गया है।
- source_word: לְדָוִד
  choice: दाऊद का
  rationale: भजन-शीर्षकों में לְ व्यापक संबंध, संबद्धता या कर्तृत्व बता सकता है। ‘दाऊद का’ इस संबंध को स्वाभाविक हिन्दी में व्यक्त करता है, पर ‘दाऊद द्वारा रचित’ जितना संकीर्ण दावा नहीं करता।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल में उपाधि नहीं, चतुरक्षरी व्यक्तिगत नाम है; ‘याहवे’ उसे नाम के रूप में सुरक्षित रखता है।
- issue: עֶבֶד की पदवी
  choice: सेवक
  alternative: दास
  rationale: इस शीर्षक में यह वाचा-संबंधी सम्मानसूचक पदवी है। ‘दास’ सम्भव है, पर वह हिन्दी में बंधुआपन पर ऐसा अतिरिक्त बल डाल सकता है जो यहाँ प्रमुख नहीं है।
- issue: לְדָוִד से व्यक्त संबंध
  choice: दाऊद का
  alternative: दाऊद द्वारा रचित / दाऊद के लिए
  rationale: हिब्रू पूर्वसर्ग कर्तृत्व, समर्पण या व्यापक संबद्धता की सम्भावना खुली रखता है; मुख्य पाठ में किसी एक सम्भावना को निर्णायक नहीं बनाया गया।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और संक्षिप्त शीर्षक-शैली अपनाई गई है। खंड-वाक्य ‘दाऊद का’ हिन्दी के शीर्षकों में स्वाभाविक है और मूल हिब्रू की संक्षिप्तता तथा संबंधसूचक अस्पष्टता को बनाए रखता है।
