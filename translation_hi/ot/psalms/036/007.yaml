base_translation:
  language: en
  yaml_path: translation/ot/psalms/036/007.yaml
  text: How precious is your steadfast love[b][a], O God! The children of man take refuge in the shadow of your wings.
translation:
  language: hi
  text: हे परमेश्वर, तेरा अटल प्रेम कितना अनमोल है![a] मनुष्य तेरे पंखों की छाया में शरण लेते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘अटल प्रेम’ इब्रानी शब्द חֶסֶד का अनुवाद है, जिसमें निष्ठावान प्रेम, दया और वाचागत निष्ठा के भाव भी शामिल हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה יָּקָר
  choice: कितनी अनमोल है
  rationale: מַה यहाँ प्रश्न नहीं, विस्मयबोधक तीव्रता व्यक्त करता है; יקר मूल्यवान और प्रिय होने का भाव रखता है। यह पदबंध उस काव्यात्मक प्रशंसा को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: חַסְדְּךָ
  choice: तेरी अटल करुणा
  rationale: חֶסֶד में करुणामय प्रेम, निष्ठा और स्थिर संबंधपरक भलाई के अर्थ समाहित हैं। ‘अटल करुणा’ इसकी स्थिरता और दयामयता दोनों को संक्षेप में रखती है; पादटिप्पणी इसकी व्यापक अर्थ-सीमा बताती है।
- source_word: אֱלֹהִים
  choice: हे परमेश्वर
  rationale: यहाँ शब्द प्रत्यक्ष संबोधन है। ‘हे’ संबोधन-बल को स्पष्ट करता है और ‘परमेश्वर’ आधुनिक हिन्दी बाइबलीय प्रयोग में स्वाभाविक तथा गरिमापूर्ण है।
- source_word: וּבְנֵי אָדָם
  choice: मनुष्य
  rationale: यह इब्रानी मुहावरा सामान्यतः समस्त मानवों को सामूहिक रूप से सूचित करता है। शाब्दिक ‘आदम की सन्तान’ की अपेक्षा ‘मनुष्य’ आधुनिक हिन्दी में स्पष्ट है और स्त्री-पुरुष सभी को समेटता है।
- source_word: בְּצֵל כְּנָפֶיךָ
  choice: तेरे पंखों की छाया में
  rationale: यह अनुवाद सुरक्षा देने वाले पक्षी-सदृश रूपक को बिना सपाट किए सुरक्षित रखता है और בְּצֵל के स्थानिक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יֶחֱסָיוּן
  choice: शरण लेते हैं
  rationale: חסה का अर्थ सुरक्षा के लिए शरण लेना या शरण खोजना है। ‘शरण लेते हैं’ सक्रिय भरोसे और संरक्षण की खोज दोनों को सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: חֶסֶד की बहुअर्थी धर्मवैचारिक छटा
  choice: अटल करुणा
  alternative: अटल प्रेम; वाचा की निष्ठा; दया
  rationale: केवल ‘दया’ संबंधपरक निष्ठा को कम कर सकती है, जबकि केवल ‘वाचा की निष्ठा’ करुणामय प्रेम को संकुचित कर सकती है। ‘अटल करुणा’ मुख्य पाठ में दोनों आयामों को संतुलित रखती है और पादटिप्पणी वैकल्पिक छटाएँ सुरक्षित करती है।
- issue: בְנֵי אָדָם का सामूहिक अर्थ
  choice: मनुष्य
  alternative: आदम की सन्तान; मानवजाति
  rationale: संदर्भ में यह किसी एक लिंग या वंश-समूह तक सीमित नहीं, बल्कि मानवों को सामान्य रूप से दर्शाता है। ‘मनुष्य’ हिन्दी में सामूहिक मानवता के लिए काव्यात्मक और संक्षिप्त है।
- issue: दिव्य संरक्षण का पंखों वाला रूपक
  choice: तेरे पंखों की छाया में
  alternative: तेरे संरक्षण में
  rationale: मूल का रूपक धर्मवैचारिक और काव्यात्मक तनाव सहित रखा गया है; इसे अमूर्त ‘संरक्षण’ में बदलना मूल बिंब को अनावश्यक रूप से स्पष्ट कर देता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और काव्यात्मक संबोधन रखा गया है। ‘तेरी/तेरे’ निकट प्रत्यक्ष संबोधन को बनाए रखते हैं; भाषा न अत्यधिक संस्कृतनिष्ठ है, न बोलचाल की।
