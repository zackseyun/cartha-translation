  yaml_path: translation/ot/psalms/036/010.yaml
  text: Continue your steadfast love to those who know you[b][a], and your righteousness to the upright in heart.
translation:
  language: hi
  text: जो तुझे जानते हैं, उन पर अपना अटल प्रेम बनाए रख[a], और जिनका मन सीधा है, उन पर अपनी धार्मिकता भी बनाए रख[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपना अटल प्रेम आगे तक बढ़ा”; शाब्दिक अर्थ, “अपना अटल प्रेम खींच।”
    reason: lexical_alternative
  - marker: b
    text: या, “अपना न्याय।”
    reason: lexical_alternative
lexical_decisions:
- source_word: מְשֹׁךְ
  choice: बनाए रख
  rationale: मूल क्रिया का शाब्दिक अर्थ ‘खींचना/आगे बढ़ाना’ है। अमूर्त कर्म ‘अटल प्रेम’ के साथ प्रार्थना के इस संदर्भ में ‘बनाए रख’ उसके निरंतर आगे तक बने रहने की विनती को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: חַסְדְּךָ
  choice: अपना अटल प्रेम
  rationale: חֶסֶד निष्ठावान और स्थायी संबंधपरक प्रेम को दर्शाता है। ‘अटल प्रेम’ केवल दया की अपेक्षा इसकी दृढ़ता और निष्ठा को अधिक व्यापक रूप से सुरक्षित रखता है।
- source_word: לְיֹדְעֶיךָ
  choice: जो तुझे जानते हैं, उन पर
  rationale: यह सहभागी रूप ‘तुझे जाननेवाले’ लोगों को सूचित करता है; ‘जो तुझे जानते हैं’ आधुनिक हिन्दी में सहज है और व्यक्तिगत-संबंधपरक अर्थ को बनाए रखता है। לְ को यहाँ प्राप्तकर्ताओं के संदर्भ में ‘उन पर’ कहा गया है, जो अगले समानांतर पदांश से भी मेल खाता है।
- source_word: וְצִדְקָתְךָ
  choice: और अपनी धार्मिकता
  rationale: צְדָקָה में धार्मिकता, न्याय और सही आचरण का अर्थ-क्षेत्र है। ‘धार्मिकता’ परमेश्वर के नैतिक और संबंधपरक खरापन को बिना केवल न्यायिक अर्थ तक सीमित किए सुरक्षित रखती है।
- source_word: לְיִשְׁרֵי לֵב
  choice: सीधे मनवालों पर
  rationale: יָשָׁר का अर्थ ‘सीधा/खरा’ है और ‘मन’ के साथ यह भीतरी नैतिक खराई का मुहावरा है। ‘सीधे मनवाले’ हिन्दी में बोधगम्य और काव्यात्मक है।
theological_decisions:
- issue: परमेश्वर के समानांतर गुणों חֶסֶד और צְדָקָה का अनुवाद
  choice: ‘अटल प्रेम’ और ‘धार्मिकता’
  alternative: ‘दया’ और ‘न्याय’
  rationale: यह पद परमेश्वर के प्रेम और नैतिक विश्वसनीयता के निरंतर प्रकट होने की प्रार्थना है। चुने हुए शब्द इब्रानी समानांतरता और संबंधपरक भाव को बनाए रखते हैं, पर किसी संकीर्ण न्यायिक या बाद की पद्धतिगत धर्मवैज्ञानिक व्याख्या को आरोपित नहीं करते।
translation_notes:
  register: आधुनिक मानक हिन्दी; प्रार्थनात्मक और गरिमापूर्ण काव्य-शैली। परमेश्वर के लिए एकवचन आत्मीय संबोधन ‘तू’ रखा गया है। ‘सीधे मनवाले’ मूल मुहावरे की भीतरी नैतिक खराई को सरल भाषा में व्यक्त करता है।
