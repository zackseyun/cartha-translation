  yaml_path: translation/ot/psalms/036/002.yaml
  text: For he flatters himself in his own eyes too much to find his iniquity and hate it[a].
translation:
  language: hi
  text: क्योंकि वह अपनी ही दृष्टि में अपने को इतना सराहता है कि वह अपने अधर्म को पहचानकर उससे घृणा नहीं करता।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप में: “क्योंकि वह अपनी दृष्टि में अपने लिए बात को चिकना बनाता है—अपने अधर्म को ढूँढ़ने, उससे घृणा करने के लिए।” इब्रानी वाक्य कठिन है; सम्भव आशय यह है कि आत्म-प्रशंसा उसे अपना अधर्म पहचानने और ठुकराने से रोकती है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण या स्पष्टीकरण प्रस्तुत करता है और भजन के तर्क-प्रवाह में स्वाभाविक है।
- source_word: הֶחֱלִיק אֵלָיו
  choice: अपने को बहलाता है
  rationale: חלק के हिफ़ील का मूल भाव ‘चिकना बनाना’ और मुहावरेदार भाव ‘चिकनी-चुपड़ी बातों से प्रसन्न या भ्रमित करना’ है। आत्मनिर्देशी प्रयोग में ‘अपने को बहलाता है’ आत्म-प्रवंचना का भाव सहज हिन्दी में व्यक्त करता है।
- source_word: בְּעֵינָיו
  choice: अपनी ही दृष्टि में
  rationale: यह अपनी समझ या अपने मूल्यांकन को सूचित करने वाला इब्रानी मुहावरा है; ‘ही’ आत्मकेंद्रित दृष्टि पर स्वाभाविक बल देता है।
- source_word: לִמְצֹא
  choice: पहचानकर
  rationale: मूल अर्थ ‘पाना/ढूँढ़ निकालना’ है; यहाँ अपने नैतिक दोष को जान लेने या पहचानने का भाव है। कृदन्तीय रूप हिन्दी वाक्य में अगले infinitive से संबंध स्पष्ट करता है।
- source_word: עֲוֺנוֹ
  choice: अपने अधर्म को
  rationale: עָוֹן नैतिक कुटिलता, अपराध और दोष का भार रखता है; ‘अधर्म’ इस गंभीरता को सामान्य आधुनिक धार्मिक हिन्दी में बनाए रखता है।
- source_word: לִשְׂנֹא
  choice: उससे घृणा नहीं करता
  rationale: प्रसंगानुसार निहित कर्म ‘अधर्म’ है। निषेध मूल में प्रत्यक्ष नहीं है, पर कठिन वाक्य-विन्यास की प्रचलित प्रसंगानुकूल समझ यह है कि आत्म-प्रशंसा उसे पाप पहचानने और ठुकराने से रोकती है। इस व्याख्यात्मक पूर्ति को पाद-टिप्पणी में स्पष्ट किया गया है।
theological_decisions:
- issue: पद का नैतिक-मनोवैज्ञानिक आशय
  choice: दुष्ट व्यक्ति आत्म-प्रवंचना के कारण अपने अधर्म को पहचानकर उससे घृणा नहीं करता।
  alternative: वह अपने अधर्म को ढूँढ़ने और उससे घृणा करने के लिए अपनी दृष्टि में अपने लिए बातें चिकनी बनाता है।
  rationale: इब्रानी वाक्य-विन्यास संक्षिप्त और कठिन है। निकट प्रसंग दुष्ट की भीतरी आत्म-प्रवंचना का समर्थन करता है, फिर भी अधिक शाब्दिक वैकल्पिक अर्थ को पाद-टिप्पणी में रखकर वास्तविक अस्पष्टता सुरक्षित की गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज रूप अपनाया गया है। ‘अपने को बहलाता है’ आत्म-प्रशंसा और आत्म-प्रवंचना दोनों का संकेत देता है; कठिन मूल वाक्य की अधिक शाब्दिक संरचना पाद-टिप्पणी में सुरक्षित है।
