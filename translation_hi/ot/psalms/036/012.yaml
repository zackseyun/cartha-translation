  text: There the workers of wickedness have fallen[b][a]; they are thrust down and cannot rise.
translation:
  language: hi
  text: वहीं दुष्टता करनेवाले गिर पड़े हैं; वे नीचे धकेल दिए गए हैं और उठ नहीं सकते।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׁם
  choice: वहीं
  rationale: स्थानवाचक क्रियाविशेषण को स्पष्ट रूप से व्यक्त करता है और प्रसंग में दुष्टों के पतन के दृश्य की ओर संकेत करता है।
- source_word: נָפְלוּ
  choice: गिर पड़े हैं
  rationale: काल का पूर्ण हुआ कार्य और उसकी वर्तमान परिणति दोनों स्वाभाविक हिन्दी में व्यक्त होते हैं।
- source_word: פֹּעֲלֵי אָוֶן
  choice: दुष्टता करनेवाले
  rationale: इब्रानी पदबंध के ‘करनेवाले’ और उसके नैतिक आशय दोनों को सहज आधुनिक हिन्दी में बनाए रखता है।
- source_word: אָוֶן
  choice: दुष्टता
  rationale: यहाँ शब्द का नैतिक अर्थ प्रमुख है; ‘दुष्टता’ सामान्य पाठक के लिए स्पष्ट और गरिमापूर्ण है।
- source_word: דֹּחוּ
  choice: उन्हें धकेलकर गिरा दिया गया है
  rationale: क्रिया के बलपूर्वक नीचे गिराए जाने के निष्क्रिय भाव को स्पष्ट करता है।
- source_word: וְלֹא יָכְלוּ קוּם
  choice: और वे फिर उठ नहीं सकते
  rationale: गिरने के बाद उठ पाने की असमर्थता व्यक्त करता है; ‘फिर’ अपरिवर्तनीय पराजय के प्रसंगगत भाव को स्वाभाविक बनाता है।
