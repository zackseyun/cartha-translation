  yaml_path: translation/ot/psalms/036/009.yaml
  text: For with you is the fountain of life[b][a]; in your light we see light.
translation:
  language: hi
  text: 'क्योंकि जीवन का सोता[a] तेरे पास है;

    तेरे प्रकाश में हम प्रकाश देखते हैं।[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “जीवन का झरना” अथवा “जीवन का स्रोत”।
    reason: lexical_alternative
  - marker: b
    text: या “तेरे प्रकाश के द्वारा हम प्रकाश देखते हैं।”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन का आधार बताता है और इब्रानी संयोजक का कारणसूचक बल स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: עִמְּךָ
  choice: तेरे ही पास
  rationale: עִם का मूल अर्थ ‘साथ/पास’ है। ‘तेरे ही पास’ जीवन के सोते का परमेश्वर के पास होना व्यक्त करता है, बिना इसे सीधे ‘तू ही स्रोत है’ में बदलकर रूपक की संरचना मिटाए। ‘ही’ काव्यात्मक बल को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: מְקוֹר
  choice: सोता
  rationale: यह किसी झरने, जलस्रोत या उद्गम को दर्शाता है। ‘सोता’ हिन्दी में जीवंत जल-स्रोत की काव्यात्मक छवि को संक्षेप में बनाए रखता है।
- source_word: חַיִּים
  choice: जीवन
  rationale: यद्यपि इब्रानी रूप बहुवचन है, यहाँ यह प्रचलित भाववाचक अर्थ ‘जीवन’ में प्रयुक्त हुआ है।
- source_word: בְּאוֹרְךָ
  choice: तेरे प्रकाश में
  rationale: בְ की स्थानगत/परिवेशगत छवि को सुरक्षित रखता है और उसे केवल साधनवाचक ‘तेरे प्रकाश के द्वारा’ तक सीमित नहीं करता।
- source_word: נִרְאֶה
  choice: हम देखते हैं
  rationale: ראה का सामान्य, प्रत्यक्ष अर्थ सुरक्षित है; काव्यात्मक संदर्भ में अपूर्ण क्रिया सामान्य वर्तमान सत्य व्यक्त करती है।
- source_word: אוֹר
  choice: प्रकाश
  rationale: ‘प्रकाश’ आधुनिक, गरिमापूर्ण और सीधा विकल्प है; इसकी पुनरावृत्ति इब्रानी शब्द-क्रीड़ा और बल को बनाए रखती है।
theological_decisions:
- issue: जीवन और दिव्य प्रकाश के रूपकों का अर्थ
  choice: ‘जीवन का सोता’ और ‘तेरे प्रकाश में हम प्रकाश देखते हैं’ रूपकों को बिना व्याख्यात्मक विस्तार के बनाए रखना
  alternative: ‘तू सारे जीवन का स्रोत है’ अथवा ‘तेरे सत्य से हमें समझ मिलती है’ जैसे अर्थ-व्याख्यात्मक रूपांतर
  rationale: मूल पद परमेश्वर, जीवन और प्रकाश के संबंध को समृद्ध काव्यात्मक भाषा में व्यक्त करता है। शाब्दिक रूपकों को बनाए रखने से उनकी व्यापकता और धर्मवैज्ञानिक तनाव किसी एक संकीर्ण व्याख्या में सीमित नहीं होते।
translation_notes:
  register: आधुनिक मानक हिन्दी में काव्यात्मक, गरिमापूर्ण और सहज शैली। भजन की सीधी ईश्वर-संबोधित वाणी के अनुरूप ‘तेरे’ रखा गया है। ‘सोता’ दृश्य रूपक को बचाता है; फुटनोट अधिक परिचित वैकल्पिक शब्द देता है।
