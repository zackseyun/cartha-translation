base_translation:
  language: en
  yaml_path: translation/ot/psalms/036/003.yaml
  text: The words of his mouth are wickedness and deceit; he has ceased to act wisely[a], to do good.
translation:
  language: hi
  text: उसके मुँह की बातें दुष्टता और छल हैं; उसने बुद्धिमानी से काम करना[a] और भलाई करना छोड़ दिया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसने भलाई करने में बुद्धिमान होना छोड़ दिया है।” इब्रानी के दोनों अनन्त रूपों को “छोड़ दिया है” के बाद दो समानांतर पूरकों के रूप में भी समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּבְרֵי פִיו
  choice: उसके मुँह की बातें
  rationale: यह पदबंध इब्रानी के ठोस मुहावरे ‘उसके मुँह के शब्द’ को स्वाभाविक आधुनिक हिन्दी में रखता है और वाणी की नैतिक प्रकृति को व्यक्त करता है।
- source_word: אָוֶן
  choice: दुष्टता
  rationale: छल के साथ प्रयुक्त होने पर यह शब्द नैतिक बुराई या अधर्म का बोध कराता है; ‘दुष्टता’ उस नैतिक बल को स्पष्ट रूप से रखता है।
- source_word: וּמִרְמָה
  choice: और छल
  rationale: מִרְמָה यहाँ धोखेभरी वाणी को सूचित करता है; ‘छल’ संक्षिप्त, स्वाभाविक और प्रसंगानुकूल है।
- source_word: חָדַל
  choice: छोड़ दिया है
  rationale: काल का पूर्ण रूप किसी कार्य से हट जाने या उसे बंद कर देने को दर्शाता है; हिन्दी पूर्णकाल इसका सहज रूप है।
- source_word: לְהַשְׂכִּיל
  choice: बुद्धिमानी से काम करना
  rationale: हिफ़ील रूप यहाँ केवल बौद्धिक समझ नहीं, बल्कि विवेकपूर्ण आचरण का संकेत देता है।
- source_word: לְהֵיטִיב
  choice: भलाई करना
  rationale: हिफ़ील क्रिया का अर्थ अच्छा या हितकारी कार्य करना है; ‘भलाई करना’ नैतिक आशय को सरल और स्पष्ट रखता है।
theological_decisions:
- issue: दो इब्रानी क्रियार्थक रूपों का पारस्परिक संबंध
  choice: 'दो समानांतर पूरकों के रूप में: ‘बुद्धिमानी से काम करना और भलाई करना’'
  alternative: 'एक संयुक्त विचार के रूप में: ‘भलाई करने में बुद्धिमान होना’'
  rationale: इब्रानी व्याकरण दोनों पाठों की अनुमति देता है। मुख्य पाठ दोनों क्रियाओं को अलग-अलग बनाए रखता है, जबकि पादटिप्पणी उनके निकट संयुक्त संबंध को सुरक्षित रखती है; इस प्रकार नैतिक बुद्धि और भले आचरण के संबंध को किसी एक व्याख्या में सीमित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सरल, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘मुँह’ का ठोस इब्रानी बिंब बनाए रखा गया है, जबकि अंतिम खंड की वास्तविक व्याकरणिक अस्पष्टता पादटिप्पणी में दी गई है।
