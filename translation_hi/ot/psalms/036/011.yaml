lexical_decisions:
- source_word: תְּבוֹאֵנִי
  choice: मुझ पर न चढ़ आए
  rationale: בוא का मूल अर्थ ‘आना’ है, पर ‘घमण्ड का पाँव’ कर्ता होने और समानांतर पंक्ति के विरोधी भाव के कारण यहाँ शत्रुतापूर्ण ढंग से निकट आने का आशय है। ‘चढ़ आए’ इस भाव को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि पादटिप्पणी अधिक शाब्दिक विकल्प सुरक्षित रखती है।
- source_word: רֶגֶל גַּאֲוָה
  choice: घमण्ड का पाँव
  rationale: यह रचना शाब्दिक रूप से ‘घमण्ड का पाँव’ है। अमूर्त संज्ञा और मूल काव्य-बिम्ब को बनाए रखा गया है; ‘घमण्डियों का पाँव’ कहना व्यक्तियों को स्पष्ट करके मूल की सम्भावित व्यापकता घटा देता।
- source_word: יַד רְשָׁעִים
  choice: दुष्टों का हाथ
  rationale: רְשָׁעִים बहुवचन में ‘दुष्ट’ लोगों को दर्शाता है और ‘हाथ’ उनकी शक्ति या कार्यकारी सामर्थ्य का काव्य-बिम्ब बनाए रखता है।
- source_word: תְּנִדֵנִי
  choice: मुझे दूर न खदेड़े
  rationale: हिफ़ील रूप किसी को उसके स्थान से हटाने, भटकाने या भगा देने का कारण बनने का भाव रख सकता है। ‘दूर खदेड़े’ बलपूर्वक हटाए जाने का आशय स्पष्ट करता है और हाथ के शत्रुतापूर्ण प्रयोग के समानांतर बैठता है।
- source_word: אַל
  choice: न … आए / न खदेड़े
  rationale: जसिव क्रियारूपों के साथ אַל प्रार्थनापूर्ण निषेध व्यक्त करता है। हिन्दी में ‘न’ के साथ ये क्रियारूप विनती का स्वाभाविक और गरिमापूर्ण स्वर देते हैं।
