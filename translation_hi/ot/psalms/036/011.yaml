  text: घमण्ड का पाँव मेरे पास न आए[a], और दुष्टों का हाथ मुझे दूर न खदेड़े[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मुझ तक न पहुँचे” अथवा “मुझ पर न आए।” इब्रानी मुहावरा शाब्दिक रूप से “घमण्ड का पाँव मेरे पास न आए” है।
    reason: lexical_alternative
  - marker: b
