  yaml_path: translation/ot/psalms/036/005.yaml
  text: O Yahweh[a], your steadfast love is in the heavens; your faithfulness reaches to the clouds.
translation:
  language: hi
  text: 'हे याहवे, तेरा अटल प्रेम आकाश में है[a];

    तेरी विश्वासयोग्यता बादलों तक पहुँचती है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तेरा अटल प्रेम आकाश तक पहुँचता है”; इब्रानी पदबंध स्थान के बजाय विस्तार भी व्यक्त कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: हे यहवे
  rationale: वाचा के व्यक्तिगत नाम को लिप्यंतरित किया गया है; पद के आरम्भ में प्रत्यक्ष सम्बोधन को स्वाभाविक हिन्दी में ‘हे’ से व्यक्त किया गया है।
- source_word: בְּהַשָּׁמַיִם
  choice: आकाश में है
  rationale: בְּ का प्राथमिक स्थानवाचक अर्थ ‘में’ रखा गया है और हिन्दी वाक्य की स्वाभाविकता के लिए ‘है’ जोड़ा गया है। हिन्दी में ‘आकाश’ सामूहिक अर्थ में इब्रानी बहुवचन को सहज रूप से व्यक्त करता है।
- source_word: חַסְדֶּךָ
  choice: तेरा अटल प्रेम
  rationale: חֶסֶד के स्थायी, निष्ठावान और सम्बन्धपरक प्रेम के भाव को सामान्य आधुनिक हिन्दी में ‘अटल प्रेम’ व्यक्त करता है।
- source_word: אֱמוּנָתְךָ
  choice: तेरी विश्वासयोग्यता
  rationale: यहाँ אֱמוּנָה भरोसेमन्दता और निष्ठा को दर्शाता है; समानान्तर पंक्ति में ‘विश्वासयोग्यता’ इसी गुण को स्पष्ट रूप से व्यक्त करती है।
- source_word: עַד שְׁחָקִים
  choice: बादलों तक पहुँचती है
  rationale: עַד सीमा या विस्तार बताता है और שְׁחָקִים ऊँचे बादलों/आकाश का काव्यात्मक चित्र है; ‘तक पहुँचती है’ हिन्दी में उस विस्तार को सहज बनाता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहवे
  alternative: प्रभु
  rationale: मूल पाठ में आए विशिष्ट वाचा-नाम को किसी उपाधि से बदलने के बजाय हिन्दी लिपि में सीधे प्रस्तुत किया गया है।
- issue: पहली पंक्ति में प्रेम का स्थान या विस्तार
  choice: आकाश में है
  alternative: आकाश तक पहुँचता है
  rationale: בְּ का सीधा स्थानवाचक अर्थ मुख्य पाठ में रखा गया है, पर काव्यात्मक समानान्तरता के कारण विस्तारवाचक अर्थ भी सम्भव है; इसलिए उसे पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। काव्यात्मक समानान्तरता बनाए रखने के लिए दो पंक्तियाँ दी गई हैं; ईश्वर के लिए निकट प्रत्यक्ष सम्बोधन के अनुरूप एकवचन ‘तेरा/तेरी’ रखा गया है।
