  yaml_path: translation/ot/psalms/036/008.yaml
  text: They are filled from the richness of your house[b][a], and you give them drink from the river of your delights.
translation:
  language: hi
  text: वे तेरे भवन की भरपूरी से तृप्त होते हैं,[a] और तू उन्हें अपने आनन्द की नदी से पिलाता है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वे तेरे भवन की प्रचुरता से जी भरकर पीते हैं।”
    reason: lexical_alternative
  - marker: b
    text: “आनन्द” का अनुवाद “सुखों” भी हो सकता है; इब्रानी शब्द में अदन की प्रतिध्वनि भी सम्भव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְוְיוּן
  choice: तृप्त होते हैं
  rationale: रוה का क़ाल अपूर्ण, तृतीय पुरुष बहुवचन, भरपूर होकर तृप्त होने का भाव देता है। यह चयन परिणामसूचक भाव को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: מִדֶּשֶׁן
  choice: भरपूरी से
  rationale: דֶּשֶׁן का मूल बिंब चिकनाई या समृद्धि है और यहाँ रूपकतः प्रचुरता बताता है। ‘भरपूरी’ उस प्रचुर पोषण को सहज हिन्दी में रखता है।
- source_word: בֵּיתֶךָ
  choice: तेरे भवन की
  rationale: בַּיִת को ‘भवन’ रखा गया है ताकि परमेश्वर के निवास का काव्यात्मक बिंब बना रहे और अर्थ को विशेष रूप से ‘मन्दिर’ या ‘घराने’ तक सीमित न किया जाए।
- source_word: וְנַחַל
  choice: और ... नदी से
  rationale: נַחַל धारा, नदी या वादी हो सकता है। इस प्रसंग में प्रचुर और जीवनदायी प्रवाह के काव्यात्मक बिंब के लिए ‘नदी’ उपयुक्त है।
- source_word: עֲדָנֶיךָ
  choice: अपने आनन्द की
  rationale: עֵדֶן से सम्बन्धित यह रूप आनन्द, सुख या विलास को व्यक्त करता है। ‘आनन्द’ अर्थ को स्पष्ट रखता है; सम्भावित अदन-प्रतिध्वनि पादटिप्पणी में सुरक्षित है।
- source_word: תַשְׁקֵם
  choice: तू उन्हें ... पिलाता है
  rationale: שׁקה का हिफ़ील रूप ‘पीने को देना/पिलाना’ और कर्ता की सक्रिय भूमिका दर्शाता है। ‘पिलाता है’ इसे संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: परमेश्वर के ‘भवन’ का बिंब
  choice: ‘तेरे भवन’ को बिना अधिक विशिष्ट किए बनाए रखना
  alternative: ‘तेरे मन्दिर’, ‘तेरे घराने’ या ‘तेरे निवासस्थान’
  rationale: इब्रानी पाठ परमेश्वर की निकटता और उसके यहाँ से मिलने वाली भरपूरी का काव्यात्मक बिंब देता है, पर किसी एक संस्थागत या स्वर्गीय सन्दर्भ को अनिवार्य नहीं करता।
- issue: עֲדָנֶיךָ में अदन की सम्भावित प्रतिध्वनि
  choice: मुख्य पाठ में ‘आनन्द’ और पादटिप्पणी में अदन की सम्भावना
  alternative: मुख्य पाठ में ‘अदन-जैसे सुख’
  rationale: शब्द आनन्द या सुख का स्पष्ट अर्थ देता है और अदन के नाम से शब्दगत सम्बन्ध भी सम्भव है, पर मुख्य पाठ में ‘अदन’ जोड़ना संकेत को आवश्यकता से अधिक निश्चित कर देगा।
translation_notes:
  register: आधुनिक मानक हिन्दी में काव्यात्मक और गरिमापूर्ण शैली रखी गई है। ईश्वर-सम्बोधन के लिए निकटता और मूल के एकवचन को बनाए रखते हुए ‘तू/तेरे’ का प्रयोग किया गया है। ‘भवन’ मूल के व्यापक निवास-बिंब को ‘मन्दिर’ से अधिक खुला रखता है।
