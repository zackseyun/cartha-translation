base_translation:
  language: en
  yaml_path: translation/ot/psalms/036/006.yaml
  text: Your righteousness is like the mountains of God[a]; your judgments are a great deep. O Yahweh[b], you save man and beast.
translation:
  language: hi
  text: तेरी धार्मिकता परमेश्वर के पर्वतों के समान है[a]; तेरे न्याय अथाह गहराई जैसे हैं। हे याहवे, तू मनुष्य और पशु को बचाता है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “परमेश्वर के पर्वत”; इसका अर्थ “विशाल पर्वत” या “सबसे ऊँचे पर्वत” भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “तू मानवजाति और पशुओं को बचाता है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: צִדְקָתְךָ
  choice: तेरी धार्मिकता
  rationale: यह शब्द परमेश्वर के सही, न्यायपूर्ण और नैतिक चरित्र को व्यापक अर्थ में व्यक्त करता है। ‘धार्मिकता’ इस व्यापकता को बनाए रखती है; केवल ‘न्याय’ कहने से अर्थ संकरा हो सकता है।
- source_word: כְּהַרְרֵי־אֵל
  choice: परमेश्वर के पर्वतों के समान
  rationale: इब्रानी पदबंध का शाब्दिक रूप बनाए रखा गया है। אֵל यहाँ परमेश्वर का संकेत हो सकता है या महानता दर्शाने वाला इब्रानी प्रयोग; संभावित मुहावरेदार अर्थ पादटिप्पणी में दिए गए हैं।
- source_word: מִשְׁפָּטֶיךָ
  choice: तेरे न्याय
  rationale: बहुवचन रूप परमेश्वर के न्यायिक निर्णयों और न्याय के कार्यों की ओर संकेत करता है। यह צְדָקָה से शब्दगत भेद भी बनाए रखता है।
- source_word: תְּהוֹם רַבָּה
  choice: एक विशाल गहरा सागर
  rationale: यह पदबंध अथाह गहराई और विशाल जलराशि का बिंब देता है। ‘विशाल गहरा सागर’ उस काव्यात्मक चित्र को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אָדָם
  choice: मनुष्य
  rationale: यहाँ אָדָם समष्टिगत अर्थ में मानव जाति का प्रतिनिधित्व करता है और पशु के साथ समानांतर रखा गया है। ‘मनुष्य’ हिन्दी में इस प्रतिनिधिक और सामान्य अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: וּבְהֵמָה
  choice: और पशु
  rationale: בְּהֵמָה यहाँ प्राणियों को व्यापक रूप में दर्शाता है। मनुष्य–पशु की काव्यात्मक जोड़ी के लिए ‘पशु’ संक्षिप्त और गरिमापूर्ण है।
- source_word: תוֹשִׁיעַ
  choice: तू ... बचाता है
  rationale: ישׁע का हिफ़ील रूप बचाने, छुड़ाने या सुरक्षित रखने का अर्थ दे सकता है। ‘बचाता है’ इस व्यापक अर्थ को बनाए रखता है और यहाँ परमेश्वर की संरक्षणकारी देखभाल को बाहर नहीं करता।
- source_word: יְהוָה
  choice: हे याहवे
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत वाचा-नाम है। सम्बोधन के काव्यात्मक बल को दिखाने के लिए ‘हे’ के साथ ‘याहवे’ रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: हे याहवे
  alternative: हे प्रभु
  rationale: उपाधि से बदलने के बजाय मूल पाठ में उपस्थित परमेश्वर के व्यक्तिगत नाम को लिप्यंतरित किया गया है।
- issue: אָדָם का समष्टिगत अर्थ
  choice: मनुष्य
  alternative: मानवजाति
  rationale: एकवचन इब्रानी संज्ञा यहाँ समस्त मनुष्यों का प्रतिनिधित्व करती है। मुख्य पाठ में उसके एकवचन काव्यात्मक रूप को रखा गया है और स्पष्ट समष्टिगत विकल्प पादटिप्पणी में दिया गया है।
- issue: כְּהַרְרֵי־אֵל में אֵל का बल
  choice: परमेश्वर के पर्वतों के समान
  alternative: विशाल पर्वतों के समान / सबसे ऊँचे पर्वतों के समान
  rationale: यह रचना शाब्दिक सम्बन्धवाचक अर्थ और महानता-सूचक इब्रानी प्रयोग—दोनों की सम्भावना रखती है। मुख्य पाठ अधिक पारदर्शी रूप रखता है और अन्य सम्भावनाएँ पादटिप्पणी में सुरक्षित हैं।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में है, पर भजन की काव्यात्मक गरिमा के लिए ‘तेरी/तेरे’ और ‘हे याहवे’ का एकवचन सम्बोधन रखा गया है। समानांतर पंक्तियों और पर्वत–गहरे सागर के ऊँचाई/गहराई वाले बिंब को स्पष्ट रखा गया है।
