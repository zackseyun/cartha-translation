    text: 'अधिक मुहावरेदार अर्थ: “तेरे प्रति मेरी मन्नतें।” इब्रानी में शाब्दिक रूप से “तेरी मन्नतें” है, अर्थात परमेश्वर को देय मन्नतें।'
