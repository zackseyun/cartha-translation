  yaml_path: translation/ot/psalms/056/012.yaml
  text: Your vows are upon me[a], O God[b]; I will render thank offerings to you.
translation:
  language: hi
  text: हे परमेश्वर, तेरी मन्नतें मुझ पर हैं[a]; मैं तुझे धन्यवाद-बलियाँ चढ़ाऊँगा[b]।
  philosophy: optimal-equivalence
  footnotes:
