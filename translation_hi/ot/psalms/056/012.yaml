    reason: lexical_alternative
lexical_decisions:
- source_word: עָלַי
  choice: मुझ पर हैं
  rationale: यह इब्रानी बिंब को बनाए रखते हुए दायित्व का भाव व्यक्त करता है।
- source_word: אֱלֹהִים
  choice: हे परमेश्वर
  rationale: यहाँ शब्द सीधे संबोधन में है; आधुनिक हिन्दी में ‘हे परमेश्वर’ स्वाभाविक और गरिमापूर्ण है।
- source_word: נְדָרֶיךָ
  choice: तेरी मन्नतें
  rationale: द्वितीय पुरुष एकवचन प्रत्यय का शाब्दिक अर्थ ‘तेरी मन्नतें’ है; सम्भवतः आशय परमेश्वर के प्रति की गई और उसे देय मन्नतों से है।
- source_word: אֲשַׁלֵּם
  choice: चढ़ाऊँगा
  rationale: पिएल रूप किसी देय वस्तु को पूरा करने या अदा करने का भाव देता है; बलियों के साथ हिन्दी में ‘चढ़ाऊँगा’ स्वाभाविक है।
- source_word: תּוֹדֹת
  choice: धन्यवाद-बलियाँ
  rationale: बहुवचन संज्ञा धन्यवाद की अभिव्यक्तियों अथवा धन्यवाद-बलियों को सूचित कर सकती है; मन्नत और अदा करने के संदर्भ में बलिदानी अर्थ सम्भावित है।
- source_word: לָךְ
  choice: तुझे
  rationale: यह प्राप्तकर्ता को सूचित करता है और पूर्ववर्ती संदर्भ के अनुसार परमेश्वर को ही संबोधित है।
theological_decisions:
- issue: ‘तेरी मन्नतें’ का परमेश्वर से संबंध
  choice: मुख्य पाठ में शाब्दिक ‘तेरी मन्नतें’ रखा गया है।
  alternative: ‘तेरे प्रति मेरी मन्नतें’
  rationale: इब्रानी में स्पष्ट रूप से द्वितीय पुरुष प्रत्यय है। सम्भावित मुहावरेदार आशय को पादटिप्पणी में देना मूल की असामान्यता और अर्थगत तनाव दोनों सुरक्षित रखता है।
- issue: תּוֹדֹת का अर्थ
  choice: धन्यवाद-बलियाँ
  alternative: धन्यवाद / धन्यवाद की अभिव्यक्तियाँ
  rationale: मन्नतों और उन्हें अदा करने के संदर्भ में अर्पण का अर्थ सम्भावित है, पर व्यापक शाब्दिक अर्थ पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और काव्यात्मक। ‘मन्नत’ सामान्य पाठक के लिए बोधगम्य है, जबकि ‘धन्यवाद-बलियाँ’ उपासना-संबंधी संदर्भ को स्पष्ट रखता है।
