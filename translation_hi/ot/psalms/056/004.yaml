review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately represents the Hebrew sequence: praise of his word in God, completed trust in God, refusal to fear, and the rhetorical question concerning בָשָׂר. Rendering בָשָׂר as “नश्वर मनुष्य” is a defensible contextual rendering, with the literal image retained in a footnote. The imperfect יַעֲשֶׂה may naturally be rendered rhetorically as “कर सकता है,” while the alternative notes the formal future sense.'
  naturalness: The sole needed change is idiomatic Hindi for לִי after “कर सकता है.” “नश्वर मनुष्य मेरा क्या कर सकता है?” is understandable but less precise and can sound as though “मेरा” is an object/possession. “मेरे साथ क्या कर सकता है?” is clear, natural, and directly conveys “to me.” The remaining elevated wording is suitable for a psalm.
  terminology: “परमेश्वर,” “वचन,” “भरोसा,” and “नश्वर मनुष्य” are consistent with a dignified modern Hindi biblical register. “नश्वर मनुष्य” appropriately communicates the metonymic reference to frail humanity without making a doctrinal claim; the note preserves “मांस.”
  issues:
  - severity: medium
    issue: The phrase “नश्वर मनुष्य मेरा क्या कर सकता है?” is not the clearest idiomatic rendering of the final לִי.
    rationale: Hindi normally expresses the affected person after “क्या कर सकता है” as “मेरे साथ” (or, idiomatically, “मेरा क्या बिगाड़ सकता है”). “मेरे साथ क्या कर सकता है?” remains semantically close to the Hebrew “do to me” without adding the nuance of “harm/damage.”
