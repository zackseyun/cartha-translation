id: PSA.56.4
reference: Psalms 56:4
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: בֵּ/אלֹהִים֮ אֲהַלֵּ֪ל דְּבָ֫ר֥/וֹ בֵּ/אלֹהִ֣ים בָּ֭טַחְתִּי לֹ֣א אִירָ֑א מַה יַּעֲשֶׂ֖ה בָשָׂ֣ר לִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/056/004.yaml
  text: In God I will praise his word[a]; in God I have trusted; I will not fear[c][b]. What can flesh do to me?
translation:
  language: hi
  text: परमेश्वर में मैं उसके वचन की स्तुति करूँगा; परमेश्वर में मैंने भरोसा रखा है; मैं नहीं डरूँगा। नश्वर मनुष्य[a] मेरे साथ क्या कर सकता है?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल इब्रानी में शाब्दिक रूप से “मांस” है; यहाँ इसका अर्थ दुर्बल और नश्वर मनुष्य है।
    reason: cultural_note
  - marker: b
    text: या “नश्वर मनुष्य मेरे साथ क्या करेगा?” इब्रानी क्रिया भविष्यकालीन रूप में है; आलंकारिक प्रश्न का भाव मनुष्य की असमर्थता भी व्यक्त करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאלֹהִים
  choice: परमेश्वर में
  rationale: בְּ का प्रयोग यहाँ भरोसे और स्तुति के आधार अथवा क्षेत्र को व्यक्त करता है; समानांतर पदबंध के लिए “परमेश्वर में” स्वाभाविक और सुसंगत है।
- source_word: אֲהַלֵּל
  choice: मैं स्तुति करूँगा
  rationale: पिएल अपूर्ण 1 एकवचन यहाँ भविष्य अथवा दृढ़ निश्चय का भाव देता है; “करूँगा” भजनकार के संकल्प को व्यक्त करता है।
- source_word: דְּבָרוֹ
  choice: उसके वचन की
  rationale: דָּבָר का मूल अर्थ “वचन/कथन” है। “वचन” को बनाए रखने से इसे केवल “प्रतिज्ञा” तक सीमित किए बिना अर्थ की व्यापकता सुरक्षित रहती है।
- source_word: בָּטַחְתִּי
  choice: मैंने भरोसा रखा है
  rationale: क़ातल रूप पूर्व में किए गए भरोसे और उसके वर्तमान परिणाम दोनों को सूचित करता है; हिन्दी पूर्ण वर्तमान इसे स्वाभाविक ढंग से व्यक्त करता है।
- source_word: לֹא אִירָא
  choice: मैं नहीं डरूँगा
  rationale: निषेध के साथ अपूर्ण क्रिया भविष्य की निर्भयता और न डरने के निश्चय—दोनों को व्यक्त करती है।
- source_word: מַה יַּעֲשֶׂה
  choice: क्या कर सकता है
  rationale: रूप की दृष्टि से क्रिया भविष्यकालीन है (“क्या करेगा”), पर यह आलंकारिक प्रश्न मनुष्य की असमर्थता व्यक्त करता है; वर्तमान हिन्दी में “क्या कर सकता है” यही आशय सहजता से देता है।
- source_word: בָשָׂר
  choice: नश्वर मनुष्य
  rationale: शाब्दिक अर्थ “मांस” है, पर यहाँ यह परमेश्वर के विपरीत दुर्बल और नश्वर मानव का लक्षणात्मक उल्लेख है। हिन्दी में केवल “मांस” व्यक्ति का अर्थ स्पष्ट नहीं करता; “नश्वर मनुष्य” अभिप्रेत अर्थ और विरोध को संप्रेषित करता है।
- source_word: לִי
  choice: मेरा
  rationale: हिन्दी मुहावरे में “मेरे साथ क्या कर सकता है” या संक्षेप में “मेरा क्या कर सकता है” לִי के अर्थ को स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: परमेश्वर के विपरीत בָשָׂר का मानवशास्त्रीय अर्थ
  choice: नश्वर मनुष्य
  alternative: मांस; मनुष्य
  rationale: यह शब्द मानव की देहधारी दुर्बलता और सीमित सामर्थ्य को सामने लाता है। “नश्वर मनुष्य” हिन्दी पाठक के लिए अभिप्रेत व्यक्ति-संदर्भ स्पष्ट करते हुए परमेश्वर और मानव-दुर्बलता के विरोध को बनाए रखता है।
- issue: דְּבָרוֹ को सामान्य वचन या विशेष प्रतिज्ञा मानना
  choice: उसके वचन
  alternative: उसकी प्रतिज्ञा; जो उसने कहा है
  rationale: मूल शब्द व्यापक है और प्रसंग में प्रतिज्ञा का संकेत हो सकता है, किंतु उसे स्पष्ट रूप से केवल प्रतिज्ञा कहना मूल की संभावित व्यापकता को अनावश्यक रूप से सीमित करेगा।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमामय किंतु सहज काव्यात्मक गद्य रखा गया है। तीनों घोषणाओं को अर्धविरामों से जोड़कर इब्रानी की समानांतर, क्रमिक संरचना सुरक्षित की गई है। मुख्य पाठ में “नश्वर मनुष्य” अर्थ स्पष्ट करता है, जबकि पादटिप्पणी “मांस” की मूल छवि दर्ज करती है।
