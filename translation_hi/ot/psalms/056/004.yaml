- from: परमेश्वर में मैं उसके वचन की स्तुति करूँगा; परमेश्वर में मैंने भरोसा रखा है; मैं नहीं डरूँगा। नश्वर मनुष्य[a] मेरा क्या कर सकता है?[b]
  to: परमेश्वर में मैं उसके वचन की स्तुति करूँगा; परमेश्वर में मैंने भरोसा रखा है; मैं नहीं डरूँगा। नश्वर मनुष्य[a] मेरे साथ क्या कर सकता है?[b]
  rationale: Only the final Hindi idiom has been revised. “मेरे साथ क्या कर सकता है?” more naturally and unambiguously renders the Hebrew rhetorical question “what will flesh do to me?” while retaining the draft’s deliberate contextual rendering of בָשָׂר and its lexical footnote.
