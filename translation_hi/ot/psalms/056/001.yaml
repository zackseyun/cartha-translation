source:
  edition: WLC
  text: חָנֵּ֣/נִי אֱ֭לֹהִים כִּֽי שְׁאָפַ֣/נִי אֱנ֑וֹשׁ כָּל הַ֝/יּ֗וֹם לֹחֵ֥ם יִלְחָצֵֽ/נִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/056/001.yaml
  text: Be gracious to me[a], O God, for man pants after me; all day long, fighting, he oppresses me.
translation:
  language: hi
  text: हे परमेश्वर, मुझ पर अनुग्रह कर, क्योंकि एक मनुष्य मेरे पीछे हाँफता हुआ पड़ा है[a]; दिन भर लड़ते हुए वह मुझे दबाता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “मेरे पीछे हाँफता हुआ पड़ा है” का अनुवाद “मुझे रौंदता है,” “मुझ पर झपटता है,” या “मुझे निगल जाना चाहता है” भी हो सकता है; इब्रानी क्रिया में शत्रुतापूर्ण ढंग से हाँफने या उत्सुकता से पीछा करने का भाव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: חָנֵּנִי
  choice: मुझ पर अनुग्रह कर
  rationale: חנן के पिएल आज्ञार्थक और प्रथम पुरुष एकवचन प्रत्यय को व्यक्त करता है। यह परमेश्वर की कृपा की विनती है; ‘दया कर’ की अपेक्षा ‘अनुग्रह कर’ मूल की कृपा/अनुकम्पा की धारणा को अधिक स्पष्ट रखता है।
- source_word: אֱלֹהִים
  choice: हे परमेश्वर
  rationale: प्रत्यक्ष सम्बोधन को स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: विनती का कारण प्रस्तुत करने वाले संयोजक का सीधा और स्वाभाविक अनुवाद।
- source_word: שְׁאָפַנִי
  choice: मेरे पीछे हाँफता हुआ पड़ा है
  rationale: שׁאף में हाँफते हुए शत्रुतापूर्ण ढंग से पीछा करने या लपकने का सजीव भाव है। हिन्दी मुहावरा मूल बिंब और लगातार आक्रामक पीछा—दोनों को बनाए रखता है।
- source_word: אֱנוֹשׁ
  choice: एक मनुष्य
  rationale: एकवचन मानवीय विरोधी को दर्शाता है और परमेश्वर के सामने उसकी नश्वर मानवीय स्थिति को अस्पष्ट किए बिना स्वाभाविक हिन्दी देता है।
- source_word: כָּל הַיּוֹם
  choice: दिन भर
  rationale: समय-सूचक पद का प्रचलित आधुनिक हिन्दी रूप।
- source_word: לֹחֵם
  choice: मुझसे लड़कर
  rationale: לחם के कृदन्त को परिस्थिति-सूचक रूप में रखता है और विरोधी की चलती हुई शत्रुतापूर्ण गतिविधि को मुख्य क्रिया से जोड़ता है।
- source_word: יִלְחָצֵנִי
  choice: मुझे दबाता है
  rationale: לחץ के दबाने, सताने और उत्पीड़ित करने के अर्थ-क्षेत्र को सजीव रूप से बनाए रखता है; यहाँ ‘दबाता है’ मूल भौतिक रूपक को भी सुरक्षित रखता है।
theological_decisions:
- issue: אֱנוֹשׁ में एकवचन और लिंग-सूचक मानवीय विरोधी
  choice: एक मनुष्य
  alternative: एक नश्वर मनुष्य / मानवजाति
  rationale: सन्दर्भ एक व्यक्तिगत मानवीय शत्रु को दिखाता है, मानवजाति को सामूहिक रूप से नहीं। ‘एक मनुष्य’ एकवचन को बनाए रखता है, जबकि परमेश्वर और मानवीय विरोध के बीच का निहित अंतर पाठक के लिए खुला रहता है।
translation_notes:
  register: भाषा आधुनिक, प्रार्थनामय और गरिमापूर्ण रखी गई है। ‘हे परमेश्वर’ तथा ‘मुझ पर अनुग्रह कर’ भजन की विनती का स्वर देते हैं; शेष पंक्ति में मूल के तीखे पीछा और दबाव के बिंब को सहज हिन्दी में सुरक्षित रखा गया है।
