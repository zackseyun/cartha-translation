    rationale: The note concerns the rendering of שְׁאָפַנִי, ‘मेरे पीछे हाँफता हुआ पड़ा है’; placing the anchor immediately after that phrase provides an unambiguous lexical-note anchor.
  - severity: low
    issue: ‘मुझसे लड़कर’ can suggest a completed or means-like action.
    rationale: לֹחֵם is a participle expressing concurrent, ongoing hostility. ‘लड़ते हुए’ retains this circumstantial participial force more closely.
