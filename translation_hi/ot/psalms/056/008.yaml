  yaml_path: translation/ot/psalms/056/008.yaml
  text: You have counted my wanderings[a]; put my tears in your bottle—are they not in your book?
translation:
  language: hi
  text: मेरी भटकनें तूने गिनी हैं; मेरे आँसुओं को अपनी चमड़े की मशक में रख ले—क्या वे तेरी पुस्तक में नहीं हैं?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נֹדִי
  choice: मेरे भटकने
  rationale: यह शब्द भगोड़े की तरह इधर-उधर भटकने या मारे-मारे फिरने को व्यक्त करता है। ‘मेरे भटकने’ मूल के ठोस और बहुअर्थी बिंब को बनाए रखता है।
- source_word: סָפַרְתָּה
  choice: लेखा रखा है
  rationale: ספר का मूल अर्थ गिनना है और प्रसंग में सावधानी से हिसाब रखने या दर्ज करने का भाव भी है। सहज हिन्दी में ‘लेखा रखा है’ दोनों भावों को साथ रखता है।
- source_word: שִׂימָה
  choice: रख ले
  rationale: यह שׂים का आज्ञार्थक रूप है। ‘रख ले’ प्रार्थनापूर्ण निवेदन को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: דִמְעָתִי
  choice: मेरे आँसुओं को
  rationale: ‘मेरे आँसू’ हिन्दी में स्वाभाविक सामूहिक अर्थ देता है और मूल बिंब को सीधे बनाए रखता है।
- source_word: בְנֹאדֶךָ
  choice: अपनी मशक में
  rationale: נֹאד पशु-चर्म से बना तरल रखने का पात्र है। ‘मशक’ आधुनिक काँच की बोतल का भ्रामक बिंब लाए बिना प्राचीन वस्तु को ठीक व्यक्त करता है।
- source_word: הֲלֹא
  choice: क्या ... नहीं हैं?
  rationale: यह ऐसी आलंकारिक प्रश्नवाचक रचना है जिसमें सकारात्मक उत्तर अपेक्षित है; प्रश्न का स्वर अनुवाद में सुरक्षित रखा गया है।
- source_word: בְסִפְרָתֶךָ
  choice: तेरी पुस्तक में
  rationale: यह परमेश्वर के लिखित अभिलेख या पुस्तक को सूचित करता है। ‘पुस्तक’ स्वाभाविक है और ‘अभिलेख’ जैसे व्याख्यात्मक अमूर्तन से बचता है।
theological_decisions:
- issue: परमेश्वर द्वारा आँसू सँभालने और पुस्तक में दर्ज रखने का मानवरूपी चित्रण
  choice: मशक और पुस्तक के ठोस काव्य-बिंबों को बनाए रखा गया
  alternative: ‘तू मेरे सारे दुःखों को याद रखता है’ जैसा व्याख्यात्मक भावानुवाद
  rationale: मूल पाठ परमेश्वर की व्यक्तिगत और सूक्ष्म देखभाल को सजीव चित्रों में व्यक्त करता है। उन्हें अमूर्त कथन में बदलना काव्यात्मक तथा धर्मवैचारिक प्रभाव को घटा देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। परमेश्वर को संबोधन में एकवचन निकटता के कारण ‘तू/तेरी/अपनी’ रखा गया है। ‘मशक’ प्रसंगतः सटीक प्राचीन पात्र है, इसलिए अलग पादटिप्पणी आवश्यक नहीं समझी गई।
