  text: वे इकट्ठे होते हैं; वे छिपते हैं; वे मेरे कदमों पर नज़र रखते हैं,[a] जैसे वे मेरे प्राण की बाट जोहते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “वे मेरी एड़ियों पर नज़र रखते हैं”; अर्थात्, वे मेरे कदमों या गतिविधियों पर नज़र रखते हैं। अंतिम खंड का अनुवाद “जैसे वे मेरे जीवन की प्रतीक्षा करते हैं” भी किया जा सकता है।
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: יָגוּרוּ
  choice: वे इकट्ठे होते हैं
  rationale: शत्रुतापूर्ण संदर्भ में यह क्रिया उनके एक साथ जुटने या दल बाँधने का भाव देती है; यह अनुवाद स्पष्ट हिंसा जोड़े बिना उस भाव को रखता है।
- source_word: יצפינו
  choice: वे छिप जाते हैं
  rationale: हिफ़ील रूप यहाँ संदर्भानुसार आत्मवाचक अर्थ में है—वे स्वयं को छिपाते हैं; घात का भाव आगे की पंक्ति से स्पष्ट होता है।
- source_word: הֵמָּה
  choice: वे
  rationale: स्वतंत्र सर्वनाम बल देता है; हिन्दी में दोहराया हुआ ‘वे’ इस बल को सहज रूप से व्यक्त करता है।
- source_word: עֲקֵבַי
  choice: मेरे कदमों
  rationale: शाब्दिक अर्थ ‘मेरी एड़ियाँ’ है, पर यहाँ मुहावरे में व्यक्ति के कदमों या गतिविधियों का पीछा करने का भाव है।
- source_word: יִשְׁמֹרוּ
  choice: नज़र रखते हैं
  rationale: यहाँ שמר सुरक्षा करने के बजाय शत्रुतापूर्वक निगरानी करने के अर्थ में है।
- source_word: כַּאֲשֶׁר
  choice: क्योंकि
  rationale: इस कठिन संबंधसूचक पद को यहाँ शत्रुओं की निगरानी का कारण बताने वाला मानना स्वाभाविक हिन्दी देता है; तुलनात्मक ‘जैसे’ भी व्याकरणतः सम्भव है।
- source_word: קִוּוּ
  choice: घात लगाए रहते हैं
  rationale: קוה का मूल भाव प्रतीक्षा/आशा है, पर शत्रुतापूर्ण संदर्भ में यह जीवन लेने के अवसर की प्रतीक्षा को सूचित करता है; हिन्दी का यह मुहावरा प्रसंग को स्वाभाविक रूप से व्यक्त करता है।
- source_word: נַפְשִׁי
  choice: मेरे प्राण
  rationale: נפש यहाँ अमूर्त ‘आत्मा’ के बजाय जीवन या स्वयं व्यक्ति को दर्शाता है; ‘प्राण’ काव्यात्मक और संदर्भानुकूल है।
theological_decisions:
- issue: כַּאֲשֶׁר और קִוּוּ के बीच संबंध
  choice: क्योंकि वे मेरे प्राण के लिए घात लगाए रहते हैं
  alternative: जैसे वे मेरे प्राण की बाट जोहते हैं
  rationale: मूल पदबंध संक्षिप्त और अर्थ-संबंध में कुछ अस्पष्ट है। मुख्य पाठ में शत्रुतापूर्ण कारण/उद्देश्य को स्वाभाविक हिन्दी में रखा गया है, जबकि पादटिप्पणी तुलनात्मक और अधिक शाब्दिक सम्भावना सुरक्षित रखती है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और काव्यात्मक हिन्दी। छोटे समानांतर वाक्य इब्रानी पद की लय रखते हैं। ‘प्राण’ भजन-साहित्य के अनुरूप है, जबकि ‘नज़र रखना’ सामान्य पाठक के लिए सहज है।
