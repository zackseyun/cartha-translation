lexical_decisions:
- source_word: בֵּאלֹהִים
  choice: परमेश्वर में
  rationale: पूर्वसर्ग ב को समानांतर בַּיהוָה के अनुरूप ‘में’ रखा गया है; यह परमेश्वर पर भरोसे और उसी के संबंध में स्तुति करने की भजनात्मक अभिव्यक्ति को बनाए रखता है।
- source_word: אֲהַלֵּל
  choice: मैं ... स्तुति करूँगा
  rationale: पिएल अपूर्ण, प्रथम पुरुष एकवचन यहाँ संकल्प या भावी घोषणा व्यक्त करता है; इसलिए ‘स्तुति करूँगा’ स्वाभाविक है।
- source_word: דָּבָר
  choice: उसके वचन
  rationale: דָּבָר का मूल अर्थ ‘वचन/बात’ है और प्रसंग में वह परमेश्वर की प्रतिज्ञा का संकेत भी दे सकता है। हिंदी में स्वामित्व स्पष्ट करने के लिए ‘उसके’ जोड़ा गया है, जबकि पादटिप्पणी अर्थगत विकल्प सुरक्षित रखती है।
- source_word: בַּיהוָה
  choice: यहोवा में
  rationale: ב को पहली पंक्ति के समान ‘में’ रखा गया है और יְהוָה को उसके व्यक्तिगत वाचा-नाम ‘यहोवा’ से व्यक्त किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
