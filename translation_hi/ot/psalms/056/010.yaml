- issue: 'जिसकी स्तुति की जाती है: परमेश्वर या उसका वचन'
  choice: उसके वचन की स्तुति
  alternative: परमेश्वर की स्तुति उसके वचन के कारण
  rationale: व्याकरण में דָּבָר אֲהַלֵּל का प्रत्यक्ष कर्म है। पाठ की असामान्य और धर्मवैचारिक रूप से तनावपूर्ण अभिव्यक्ति को व्याख्यात्मक पुनर्लेखन से नहीं बदला गया।
