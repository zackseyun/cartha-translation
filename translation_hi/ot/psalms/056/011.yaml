    text: इब्रानी में ‘मनुष्य’ एकवचन है और यहाँ प्रतिनिधिक रूप से किसी भी मनुष्य के लिए प्रयुक्त हुआ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאלֹהִים
  choice: परमेश्वर पर
  rationale: בְּ यहाँ भरोसे के आधार और विषय को व्यक्त करता है। स्वाभाविक हिन्दी में ‘परमेश्वर पर भरोसा रखना’ मूल अर्थ को स्पष्ट रूप से संप्रेषित करता है।
- source_word: בָּטַחְתִּי
  choice: मैंने भरोसा रखा है
  rationale: Qal पूर्ण, प्रथम पुरुष एकवचन, ऐसे भरोसे को व्यक्त करता है जो रखा जा चुका है और वर्तमान में दृढ़ बना हुआ है; हिन्दी का पूर्ण वर्तमान इस भाव को सुरक्षित रखता है।
- source_word: לֹא אִירָא
  choice: मैं नहीं डरूँगा
  rationale: अपूर्ण क्रिया यहाँ परमेश्वर पर भरोसे से उपजे भावी निश्चय को व्यक्त करती है।
- source_word: מַה יַּעֲשֶׂה
  choice: क्या कर सकता है
  rationale: מַה का मूल अर्थ ‘क्या’ है; आलंकारिक प्रश्न के आशय को स्वाभाविक हिन्दी में व्यक्त करने के लिए सामर्थ्यसूचक ‘सकता है’ निहित भाव को सामने लाता है।
- source_word: אָדָם
  choice: मनुष्य
  rationale: एकवचन संज्ञा यहाँ प्रतिनिधिक रूप से किसी भी मानव विरोधी के लिए प्रयुक्त है। ‘मनुष्य’ एकवचन और व्यापक मानवीय अर्थ दोनों को बनाए रखता है।
- source_word: לִי
  choice: मेरा
  rationale: עשה के साथ לִי का आशय ‘मेरे साथ/मुझ पर क्या कर सकता है’ है। हिन्दी की स्वाभाविक प्रश्न-रचना ‘मेरा क्या कर सकता है?’ इस संबंध को संक्षेप और मुहावरेदार ढंग से व्यक्त करती है।
theological_decisions:
- issue: אָדָם का प्रतिनिधिक एकवचन
  choice: मनुष्य
  alternative: आदमी / मानवजाति
  rationale: ‘मनुष्य’ मूल के एकवचन रूप को बनाए रखते हुए किसी भी मानव को समेटता है। ‘मानवजाति’ मूल को सामूहिक बना देता, जबकि ‘आदमी’ अपेक्षाकृत बोलचाल का है। इससे परमेश्वर और सीमित मानव के बीच का विरोध भी सुरक्षित रहता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सहज रखी गई है। ‘परमेश्वर पर भरोसा रखना’ तथा ‘मेरा क्या कर सकता है?’ स्वाभाविक हिन्दी मुहावरे हैं; साथ ही इब्रानी की पूर्ण क्रिया, भावी निश्चय और प्रतिनिधिक एकवचन को यथासंभव सुरक्षित रखा गया है।
