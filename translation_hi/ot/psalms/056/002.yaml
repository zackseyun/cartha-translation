  text: שָׁאֲפ֣וּ שׁ֭וֹרְרַ/י כָּל הַ/יּ֑וֹם כִּֽי רַבִּ֨ים לֹחֲמִ֖ים לִ֣/י מָרֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/056/002.yaml
  text: My enemies pant after me all day long[a], for many fight against me from on high.
translation:
  language: hi
  text: 'मेरे शत्रु दिन भर मुझे रौंदते हैं,

    क्योंकि बहुत-से लोग घमंड से मुझसे लड़ते हैं।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, “क्योंकि बहुत-से लोग ऊँचाई से मुझसे लड़ते हैं”; अंतिम हिब्रू शब्द को परमेश्वर के लिए संबोधन मानकर यह भी अनुवाद किया जा सकता है: “क्योंकि बहुत-से लोग मुझसे लड़ते हैं, हे परमप्रधान।”'
    reason: alternative_reading
lexical_decisions:
- source_word: שָׁאֲפוּ
  choice: रौंदते हैं
  rationale: इस शत्रुतापूर्ण संदर्भ में क्रिया का अर्थ कुचलना या रौंदना हो सकता है। यह स्वाभाविक हिन्दी में आक्रमण की तीव्रता व्यक्त करता है; मूल क्रिया में हाँफते हुए लपकने का बिंब भी संभव है।
- source_word: שׁוֹרְרַי
  choice: मेरे शत्रु
  rationale: यह पद भजनकार के विरोधी और आक्रमणकारी लोगों को सूचित करता है; ‘शत्रु’ स्पष्ट और गरिमापूर्ण आधुनिक हिन्दी है।
- source_word: כָּל הַיּוֹם
  choice: दिन भर
  rationale: हिब्रू मुहावरे का स्वाभाविक और संक्षिप्त हिन्दी समतुल्य।
- source_word: כִּי
  choice: क्योंकि
  rationale: यहाँ यह पहली शिकायत का कारण प्रस्तुत करता है।
- source_word: רַבִּים
  choice: बहुत-से लोग
  rationale: मात्रात्मक अर्थ को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לֹחֲמִים לִי
  choice: मुझसे लड़ते हैं
  rationale: कृदंत निरंतर शत्रुतापूर्ण कार्रवाई दिखाता है; हिन्दी में ‘मुझसे लड़ते हैं’ सुलभ और स्वाभाविक है।
- source_word: מָרוֹם
  choice: घमंड से
  rationale: पद के अंत में प्रयुक्त संक्षिप्त संरचना में इसे विरोधियों के ऊँचेपन या अभिमान को बताने वाले क्रियाविशेषण के रूप में समझना संदर्भानुकूल है। स्थानवाचक ‘ऊँचाई से’ और परमेश्वर को संबोधन ‘हे परमप्रधान’ भी संभव हैं, इसलिए उन्हें पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: מָרוֹם की व्याख्या
  choice: घमंड से
  alternative: ऊँचाई से; हे परमप्रधान
  rationale: हिब्रू वाक्यरचना संक्षिप्त और बहुअर्थी है। मुख्य पाठ में संदर्भानुकूल क्रियाविशेषण चुना गया है, जबकि स्थानवाचक और परमेश्वर-संबोधन वाले प्राचीन विकल्पों को पादटिप्पणी में सुरक्षित रखा गया है, ताकि वास्तविक धर्मवैज्ञानिक तनाव मिटे नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी; काव्यात्मक, संक्षिप्त और गरिमापूर्ण शैली। मुख्य पाठ सहज रखा गया है और מָרוֹם की वास्तविक अस्पष्टता पादटिप्पणी में स्पष्ट की गई है।
