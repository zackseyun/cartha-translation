  yaml_path: translation/ot/psalms/056/005.yaml
  text: All day long they twist my words[c][b][a]; all their thoughts are against me for evil.
translation:
  language: hi
  text: दिन भर वे मेरी बातों को तोड़-मरोड़कर पेश करते हैं[a]; उनके सारे विचार मेरे विरुद्ध बुराई करने के लिए हैं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरी बातों को बिगाड़ते हैं।” यहाँ प्रयुक्त इब्रानी क्रिया कठिन है और उसका अर्थ पीड़ा पहुँचाना, चोट पहुँचाना या तोड़ना-मरोड़ना हो सकता है; इस संदर्भ में बातों को दुर्भावना से विकृत करना सबसे उपयुक्त लगता है।
    reason: lexical_alternative
  - marker: b
    text: या, “मेरे विरुद्ध उनकी सारी योजनाएँ हानि पहुँचाने के लिए हैं।”
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הַיּוֹם
  choice: दिन भर
  rationale: यह स्वाभाविक आधुनिक हिन्दी में पूरे दिन जारी रहने वाली गतिविधि का भाव व्यक्त करता है।
- source_word: דְּבָרַי
  choice: मेरी बातों को
  rationale: דָּבָר का अर्थ 'वचन', 'बात' या 'मामला' हो सकता है; यहाँ शत्रुओं द्वारा कही हुई बातों को दुर्भावना से विकृत करना संदर्भ के अनुकूल है।
- source_word: יְעַצֵּבוּ
  choice: तोड़-मरोड़कर पेश करते हैं
  rationale: यह कठिन क्रिया पीड़ा पहुँचाने, बिगाड़ने या विकृत करने का भाव दे सकती है। 'मेरी बातों' के साथ यह चयन शत्रुतापूर्ण विकृति को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि पादटिप्पणी वास्तविक शाब्दिक अनिश्चितता बचाती है।
- source_word: עָלַי
  choice: मेरे विरुद्ध
  rationale: शत्रुतापूर्ण संदर्भ में संबंधसूचक पद का विरोधात्मक अर्थ स्पष्ट है।
- source_word: כָּל מַחְשְׁבֹתָם
  choice: उनके सारे विचार
  rationale: מַחְשְׁבוֹת विचारों, योजनाओं या षड्यंत्रों को सूचित कर सकता है। 'विचार' मूल के निकट है और वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: לָרָע
  choice: बुराई के लिए
  rationale: यह हानिकारक उद्देश्य के साथ नैतिक बुराई का आयाम भी बनाए रखता है और इब्रानी अभिव्यक्ति के औपचारिक रूप से निकट है।
