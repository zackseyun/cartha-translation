  yaml_path: translation/ot/psalms/056/009.yaml
  text: Then my enemies will turn back in the day I call. This I know[a], that God is for me.
translation:
  language: hi
  text: जिस दिन मैं पुकारूँगा, तब मेरे शत्रु पीछे हट जाएँगे। यह मैं जानता हूँ[a] कि परमेश्वर मेरे पक्ष में है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इसी से मैं जानता हूँ कि परमेश्वर मेरे पक्ष में है।”
    reason: זֶה יָדַעְתִּי में זֶה को संकेतवाचक ‘यह’ अथवा करणवाचक ‘इसी से’ समझा जा सकता है।
lexical_decisions:
- source_word: אָז
  choice: तब
  rationale: यह कालवाचक क्रियाविशेषण प्रार्थना के प्रत्युत्तर में होने वाले परिणाम को सामने लाता है।
- source_word: יָשׁוּבוּ ... אָחוֹר
  choice: पीछे हट जाएँगे
  rationale: שׁוב के साथ אָחוֹר लौटने या पराजित होकर पीछे हटने का भाव देता है; हिंदी में यह पदबंध स्वाभाविक रूप से वही गति और परिणाम व्यक्त करता है।
- source_word: אוֹיְבַי
  choice: मेरे शत्रु
  rationale: मूल के संबंधसूचक रूप का सीधा और गरिमापूर्ण अनुवाद।
- source_word: בְּיוֹם אֶקְרָא
  choice: जिस दिन मैं पुकारूँगा
  rationale: मूल के ठोस कालवाचक पदबंध को बनाए रखता है और हिंदी में स्वाभाविक है; प्रार्थना का संदर्भ पुकार का लक्ष्य स्पष्ट करता है।
- source_word: זֶה יָדַעְתִּי
  choice: यह मैं जानता हूँ
  rationale: זֶה को संकेतवाचक मानकर सरल वाक्य दिया गया है; करणवाचक अर्थ की वास्तविक संभावना पादटिप्पणी में सुरक्षित है।
- source_word: כִּי
  choice: कि
  rationale: यहाँ यह उस बात की विषयवस्तु प्रस्तुत करता है जिसे भजनकार जानता है।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: आधुनिक मानक हिंदी बाइबिलीय भाषा में एकमात्र सच्चे ईश्वर के लिए स्वाभाविक और गरिमापूर्ण पद।
- source_word: לִי
  choice: मेरी ओर है
  rationale: संदर्भ में לִי समर्थन और अनुकूलता दर्शाता है। 'मेरी ओर है' इस आशय को सहज हिंदी में व्यक्त करता है, बिना इसे स्वामित्व के अर्थ तक सीमित किए।
theological_decisions:
- issue: אֱלֹהִים לִי का अर्थ
  choice: परमेश्वर मेरी ओर है—अर्थात भजनकार के पक्ष में और उसके सहायक हैं
  alternative: परमेश्वर मेरा है
  rationale: शत्रुओं के पीछे हटने और भजनकार के पुकारने के संदर्भ में ईश्वरीय समर्थन या अनुकूलता प्रमुख अर्थ है; फिर भी मूल की संक्षिप्त रचना को अत्यधिक व्याख्यायित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। 'पीछे हट जाएँगे' युद्ध या विरोध में पलटने का भाव देता है, और 'मेरी ओर है' मूल के संक्षिप्त समर्थन-सूचक कथन को स्वाभाविक हिंदी में बनाए रखता है।
