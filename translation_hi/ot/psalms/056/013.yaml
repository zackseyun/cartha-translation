id: PSA.56.13
reference: Psalms 56:13
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּ֤י הִצַּ֪לְתָּ נַפְשִׁ֡/י מִ/מָּוֶת֮ הֲ/לֹ֥א רַגְלַ֗/י מִ֫/דֶּ֥חִי לְ֭/הִֽתְהַלֵּךְ לִ/פְנֵ֣י אֱלֹהִ֑ים בְּ֝/א֗וֹר הַֽ/חַיִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/056/013.yaml
  text: For you have delivered my soul from death[a]; have you not also kept my feet from stumbling[d][c][b], that I may walk before God in the light of life?
translation:
  language: hi
  text: क्योंकि तूने मेरे प्राण को मृत्यु से छुड़ाया है[a]; क्या तूने मेरे पाँवों को ठोकर खाने से नहीं बचाया[b], कि मैं परमेश्वर के सामने जीवन के प्रकाश में चलूँ[c]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘मेरे जीवन को।’ इब्रानी शब्द का अर्थ प्राण, जीवन अथवा स्वयं व्यक्ति हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘गिरने से।’
    reason: lexical_alternative
  - marker: c
    text: या ‘जीवितों के प्रकाश में।’
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन के आधार या कारण को प्रकट करता है और भजन की तर्क-श्रृंखला को स्वाभाविक रूप से जोड़ता है।
- source_word: הִצַּלְתָּ
  choice: तूने ... छुड़ाया है
  rationale: हिफ़ील पूर्ण रूप सिद्ध किए गए उद्धार को दिखाता है जिसका वर्तमान महत्व बना हुआ है।
- source_word: נַפְשִׁי
  choice: मेरे प्राण
  rationale: נֶפֶשׁ यहाँ जीवन, प्राण या संपूर्ण व्यक्ति का बोध करा सकता है। ‘प्राण’ काव्यात्मक गहराई और अर्थ की व्यापकता को बनाए रखता है।
- source_word: מִמָּוֶת
  choice: मृत्यु से
  rationale: पूर्वसर्ग और संज्ञा मृत्यु के संकट अथवा अधिकार से छुड़ाए जाने का सीधा बोध कराते हैं।
- source_word: הֲלֹא
  choice: क्या ... नहीं
  rationale: यह सकारात्मक उत्तर की अपेक्षा रखने वाले आलंकारिक प्रश्न को सुरक्षित रखता है।
- source_word: רַגְלַי
  choice: मेरे पाँवों को
  rationale: मूल पाठ के ठोस शारीरिक बिंब को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: מִדֶּחִי
  choice: ठोकर खाने से
  rationale: דֶּחִי लड़खड़ाने, धकेले जाने या गिरने का बोध करा सकता है। पाँव और आगे के ‘चलूँ’ के बिंब के साथ ‘ठोकर खाने’ स्वाभाविक है।
- source_word: לְהִתְהַלֵּךְ
  choice: कि मैं ... चलूँ
  rationale: לְ सहित क्रियार्थक रूप उद्देश्य या परिणाम व्यक्त करता है; यह हिन्दी में उस आशय को स्पष्ट रखता है।
- source_word: לִפְנֵי אֱלֹהִים
  choice: परमेश्वर के सामने
  rationale: यह शाब्दिक रूप से परमेश्वर के सम्मुख या उसकी उपस्थिति में चलने का अर्थ बनाए रखता है।
- source_word: בְּאוֹר הַחַיִּים
  choice: जीवन के प्रकाश में
  rationale: मूल की काव्यात्मक रचना और जीवन, अनुग्रह तथा जीवंतता से जुड़ा प्रकाश-बिंब सुरक्षित रहता है।
theological_decisions:
- issue: נַפְשִׁי का मानव-स्वरूप संबंधी आशय
  choice: मेरे प्राण
  alternative: मेरा जीवन / मुझे
  rationale: पद किसी तकनीकी आत्मा-शरीर सिद्धांत को स्थापित नहीं करता। ‘प्राण’ जीवन और संपूर्ण व्यक्ति दोनों की गुंजाइश रखकर मूल की अर्थगत व्यापकता को अनावश्यक रूप से सीमित नहीं करता।
- issue: הֲלֹא का वाक्यगत बल
  choice: 'आलंकारिक प्रश्न: ‘क्या ... नहीं’'
  alternative: निश्चय ही / और मेरे पाँवों को भी
  rationale: प्रश्नात्मक रूप मूल पाठ की अपेक्षित सकारात्मक प्रतिक्रिया और काव्यात्मक तनाव को बनाए रखता है।
- issue: הַחַיִּים की व्याख्या
  choice: जीवन
  alternative: जीवितों
  rationale: व्यंजनात्मक पाठ अधिक सीधे ‘जीवन’ पढ़ता है; फिर भी ‘जीवितों’ एक संभावित अर्थ है, इसलिए उसे पाद-टिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण भजनात्मक शैली रखी गई है। परमेश्वर को संबोधन में ‘तू’ मूल इब्रानी के एकवचन निकट संबोधन और हिन्दी की पारंपरिक भक्तिपरक शैली के अनुरूप है। अर्धविराम मृत्यु से उद्धार और पाँवों की रक्षा के दो संबद्ध खंडों को अलग करता है, जबकि आलंकारिक प्रश्न सुरक्षित रहता है।
