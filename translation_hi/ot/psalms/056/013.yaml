  terminology: “प्राण” suitably retains the poetic breadth of נפש without reducing it to a technical claim about the soul. “परमेश्वर” is an established Hindi biblical rendering for אלהים here. “ठोकर खाने से” is idiomatic and appropriately conveys the fall/stumbling semantic range of מִדֶּחִי. All three footnotes are anchored at the relevant terms and preserve legitimate alternatives.
