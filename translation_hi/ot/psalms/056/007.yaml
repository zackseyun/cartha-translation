  text: עַל אָ֥וֶן פַּלֶּט לָ֑/מוֹ בְּ֝/אַ֗ף עַמִּ֤ים הוֹרֵ֬ד אֱלֹהִֽים־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/056/007.yaml
  text: Because of iniquity[a], do not let them escape; in anger bring down the peoples[b], O God.
translation:
  language: hi
  text: अधर्म के कारण उन्हें बच निकलने न दे[a]; हे परमेश्वर, क्रोध में लोगों को नीचे गिरा दे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अधर्म के कारण उन्हें न छुड़ा।” इब्रानी खंड कठिन है; क्रिया का अधिक सीधा अर्थ “छुड़ाना/बचाना” भी लिया जा सकता है।
    reason: alternative_reading
  - marker: b
    text: या, “जातियों को।”
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל אָוֶן
  choice: अधर्म के कारण
  rationale: यहाँ עַל को कारणसूचक और אָוֶן को नैतिक बुराई या दुष्टता के अर्थ में लिया गया है। यह पद के न्याय-विनती वाले संदर्भ के अनुकूल है।
- source_word: פַּלֶּט לָמוֹ
  choice: उन्हें बच निकलने न दे
  rationale: פלט का मूल अर्थ बच निकलना या छुड़ाना है। संक्षिप्त और कठिन इब्रानी खंड को संदर्भानुसार नकारात्मक विनती के रूप में प्रस्तुत किया गया है, पर वैकल्पिक सीधा अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: בְּאַף
  choice: क्रोध में
  rationale: אַף यहाँ क्रोध का बोध कराता है। इब्रानी में अधिकारवाचक सर्वनाम स्पष्ट नहीं है, इसलिए 'अपने' नहीं जोड़ा गया।
- source_word: עַמִּים
  choice: लोगों
  rationale: बहुवचन עַמִּים का मूल अर्थ जनसमूह या लोग है; 'जातियाँ' भी संभव है और पादटिप्पणी में दिया गया है।
- source_word: הוֹרֵד
  choice: नीचे गिरा दे
  rationale: ירד के हिफ़ील आज्ञार्थक रूप में नीचे लाने, गिराने या परास्त करने का भाव है। यह अनुवाद अवरोह के रूपक को बनाए रखता है।
- source_word: אֱלֹהִים
  choice: हे परमेश्वर
  rationale: यह सीधा संबोधन है; हिंदी में 'हे' संबोधन-भाव को स्वाभाविक रूप से स्पष्ट करता है।
theological_decisions:
- issue: कठिन इब्रानी खंड में शाप-विनती और निहित निषेध
  choice: इसे विनती के रूप में लिया गया है कि अधर्मी अपने अधर्म के कारण न्याय से बच न निकलें।
  alternative: ‘अधर्म के कारण उन्हें न छुड़ा’ अथवा ‘संकट के कारण वे बच निकलते हैं’ जैसे पाठ-संयोजन संभव माने गए हैं।
  rationale: עַל אָוֶן פַּלֶּט לָמוֹ वाक्य-विन्यास की दृष्टि से संक्षिप्त और कठिन है। भजन के संदर्भ तथा अगले न्याय-संबंधी अनुरोध के साथ नकारात्मक विनती सबसे संगत लगती है, किंतु वास्तविक अस्पष्टता को पादटिप्पणी में बनाए रखा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी में संक्षिप्त, गंभीर और प्रार्थनात्मक शैली रखी गई है। ‘बच निकलने न दे’ सामान्य पाठक के लिए स्वाभाविक है, जबकि कठिन मूल पाठ की वैकल्पिक समझ पादटिप्पणी में दी गई है।
