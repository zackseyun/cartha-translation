  edition: WLC
  text: לַ/מְנַצֵּ֤חַ עַל י֬וֹנַת אֵ֣לֶם רְ֭חֹקִים לְ/דָוִ֣ד מִכְתָּ֑ם בֶּֽ/אֱחֹ֨ז אֹת֖/וֹ פְלִשְׁתִּ֣ים בְּ/גַֽת׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/056/000.yaml
  text: 'For the choir director: according to “The Silent Dove of Distant Places.” Of David[a]. A miktam[b], when the Philistines seized him in Gath.'
translation:
  language: hi
  text: 'गान-निर्देशक के लिए: “दूर देश की मूक कबूतरी” के अनुसार।[a] दाऊद से संबंधित। एक मिक्ताम,[b] जब पलिश्तियों ने उसे गात में पकड़ लिया।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी पदबंध का संभावित अर्थ “दूर स्थानों की मूक कबूतरी” है; संभवतः यह किसी धुन का नाम है, पर इसका ठीक अर्थ अनिश्चित है।
    reason: alternative_reading
  - marker: b
    text: “मिक्ताम” भजन-शीर्षकों में प्रयुक्त एक पारिभाषिक शब्द है; इसका ठीक अर्थ अनिश्चित है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: संगीत निर्देशक के लिए
  rationale: भजन-शीर्षकों में यह पद संगीत-प्रस्तुति की देखरेख करने वाले व्यक्ति को निर्देशित करता है; यह हिंदी में स्पष्ट और स्वाभाविक कार्यात्मक अनुवाद है।
- source_word: עַל
  choice: के अनुसार
  rationale: यहाँ इसके बाद संभवतः किसी धुन या गीत का नाम आता है, इसलिए यह उस संगीत-विन्यास के अनुसार गाने का संकेत देता है।
- source_word: יוֹנַת אֵלֶם רְחֹקִים
  choice: “दूर स्थानों की मूक कबूतरी”
  rationale: यह अस्पष्ट पदबंध संभवतः किसी धुन का नाम है। יוֹנַת को ‘कबूतरी’, אֵלֶם को ‘मूक’, और רְחֹקִים को ‘दूर स्थानों’ के रूप में प्रस्तुत किया गया है, पर अनिश्चितता पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: לְדָוִד
  choice: दाऊद से संबंधित
  rationale: לְ उपसर्ग रचनाकार, समर्पण या संबंध का बोध करा सकता है; यह चयन केवल ‘दाऊद द्वारा’ कहकर अर्थ को अनावश्यक रूप से सीमित नहीं करता।
- source_word: מִכְתָּם
  choice: मिक्ताम
  rationale: यह भजन-शीर्षकों का अनिश्चित अर्थ वाला पारिभाषिक शब्द है; अनुमानित अर्थ देने के बजाय इसका लिप्यंतरण किया गया है।
- source_word: בֶּאֱחֹז אֹתוֹ
  choice: जब ... उसे ... पकड़ लिया था
  rationale: בְּ के साथ क्रियार्थक रूप अवसर या समय बताता है, और אחז यहाँ शत्रुतापूर्ण ढंग से पकड़ने का भाव देता है।
- source_word: פְלִשְׁתִּים
  choice: पलिश्तियों
  rationale: इस जाति के लिए प्रचलित आधुनिक हिंदी रूप।
- source_word: בְּגַת
  choice: गात में
  rationale: स्थानवाचक בְּ का स्वाभाविक हिंदी अनुवाद और स्थान-नाम का प्रचलित रूप।
theological_decisions:
- issue: भजन के शीर्षक की प्रकृति
  choice: शीर्षक को मूलपाठ का अंग मानते हुए उसके संगीत-संबंधी और ऐतिहासिक संकेतों का अनुवाद किया गया है, पर अस्पष्ट तकनीकी शब्दों को अनुमान से नहीं खोला गया।
  alternative: इसे अनूदित मूलपाठ के बजाय केवल संपादकीय सूचना मानना, या מִכְתָּם को ‘स्वर्णिम भजन’ जैसे अनुमानित अर्थ से अनूदित करना।
  rationale: इब्रानी पाठ इसे भजन के शीर्षक के रूप में देता है। अनुवाद उसके शब्दों को बनाए रखता है और जहाँ अर्थ अनिश्चित है वहाँ किसी विशिष्ट ऐतिहासिक या धर्मवैज्ञानिक निष्कर्ष को आरोपित नहीं करता।
- issue: לְדָוִד में संबंध या लेखकत्व
  choice: दाऊद से संबंधित
  alternative: दाऊद द्वारा रचित
  rationale: इब्रानी संबंधसूचक रूप लेखकत्व के अनुकूल हो सकता है, पर केवल उसी तक सीमित नहीं है; इसलिए मूल की वास्तविक अस्पष्टता सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रखी गई है। शीर्षक की संक्षिप्त शैली बनाए रखते हुए अस्पष्ट इब्रानी पदबंध को उद्धरण-चिह्नों में रखा गया है और दोनों आवश्यक पादटिप्पणी-चिह्न मुख्य पाठ में उचित स्थान पर दिए गए हैं।
