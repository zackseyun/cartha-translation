  yaml_path: translation/ot/psalms/056/003.yaml
  text: When I am afraid[a], I will trust in you.
translation:
  language: hi
  text: जिस दिन मैं डरूँगा[a], मैं तुझ पर भरोसा रखूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप से: “जिस दिन मैं डरूँगा, मैं—तुझ पर भरोसा रखूँगा।”'
    reason: मूल में स्वतंत्र सर्वनाम אֲנִי द्वारा ‘मैं’ पर दिए गए बल को दिखाने के लिए।
lexical_decisions:
- source_word: י֥וֹם
  choice: जिस दिन
  rationale: यहाँ יוֹם उस समय को सूचित करने वाला पद है जब भय उठता है। ‘जिस दिन’ मूल के ‘दिन’ को बनाए रखते हुए स्वाभाविक हिन्दी कालवाचक उपवाक्य बनाता है।
- source_word: אִירָ֑א
  choice: मैं डरूँगा
  rationale: ירא का क़ाल अपूर्ण, प्रथम पुरुष एकवचन यहाँ भय अनुभव करने के अर्थ में है। ‘डरूँगा’ कालवाचक उपवाक्य में संकल्पसूचक मुख्य क्रिया के साथ स्वाभाविक है।
- source_word: אֲ֝נִ֗י
  choice: मैं
  rationale: स्वतंत्र सर्वनाम कर्ता पर बल देता है। हिन्दी में मुख्य उपवाक्य का स्पष्ट ‘मैं’ इस बल को सहज रूप में व्यक्त करता है; ‘मैं स्वयं’ अनावश्यक रूप से अधिक बलपूर्ण होता।
- source_word: אֵלֶ֥י/ךָ
  choice: तुझ पर
  rationale: בטח के साथ אֶל भरोसे की दिशा या उसके आधार को सूचित करता है। आधुनिक हिन्दी में ‘तुझ पर भरोसा रखना’ इसका स्वाभाविक समतुल्य है।
- source_word: אֶבְטָֽח
  choice: भरोसा रखूँगा
  rationale: בטח का अर्थ ‘भरोसा करना/रखना’ है। यहाँ अपूर्ण रूप भय के बीच वक्ता का भावी अथवा संकल्पपूर्ण प्रत्युत्तर व्यक्त करता है।
theological_decisions:
- issue: भय और भरोसे का संबंध
  choice: भजनकार भय के अनुभव के बीच परमेश्वर पर भरोसा रखने का संकल्प करता है।
  alternative: ऐसा अनुवाद कि भरोसा भय को पूरी तरह अनुपस्थित कर देता है।
  rationale: इब्रानी पाठ भय और भरोसे को आमने-सामने रखता है; वह यह नहीं कहता कि भय कभी होगा ही नहीं। अनुवाद इस तनाव को बनाए रखता है।
translation_notes:
  register: आधुनिक, सरल और गरिमापूर्ण हिन्दी। परमेश्वर को संबोधित करने के लिए काव्यात्मक-बाइबलीय एकवचन ‘तुझ’ रखा गया है; वाक्य मूल की कालवाचक रचना और भय के बीच भरोसे के संकल्प—दोनों को बनाए रखता है।
