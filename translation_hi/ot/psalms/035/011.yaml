    reason: lexical_alternative
lexical_decisions:
- source_word: יְקוּמוּן
  choice: उठ खड़े होते हैं
  rationale: קום का यह रूप विरोधी गवाहों के आगे आने या न्यायिक प्रसंग में खड़े होने का सजीव भाव रखता है।
- source_word: עֵדֵי חָמָס
  choice: हिंसक गवाह
  rationale: शाब्दिक अर्थ ‘हिंसा के गवाह’ है। ‘हिंसक गवाह’ अन्यायपूर्ण और हानि पहुँचाने वाली गवाही का भाव बनाए रखता है; ‘झूठे गवाह’ संभव अर्थ है, पर इब्रानी से अधिक संकीर्ण है।
- source_word: אֲשֶׁר לֹא יָדַעְתִּי
  choice: जिन बातों को मैं नहीं जानता
  rationale: इब्रानी संबंधवाचक उपवाक्य में कर्म स्पष्ट नहीं है; स्वाभाविक हिन्दी के लिए ‘बातों’ को न्यूनतम रूप से जोड़ा गया है। वर्तमान काल भजनकार की अनभिज्ञता के दावे को सहज ढंग से व्यक्त करता है।
- source_word: יִשְׁאָלוּנִי
  choice: वे मुझसे पूछते हैं
  rationale: שׁאל का सामान्य अर्थ पूछना या जानकारी माँगना है। विरोधी न्यायिक संदर्भ के बावजूद ‘पूछते हैं’ मूल क्रिया की संयमित व्यापकता बनाए रखता है; ‘पूछताछ करते हैं’ अर्थ को अधिक तीखा कर सकता है।
