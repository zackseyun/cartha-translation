id: PSA.35.8
reference: Psalms 35:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: תְּבוֹאֵ֣/הוּ שׁוֹאָה֮ לֹֽא יֵ֫דָ֥ע וְ/רִשְׁתּ֣/וֹ אֲשֶׁר טָמַ֣ן תִּלְכְּד֑/וֹ בְּ֝/שׁוֹאָ֗ה יִפָּל בָּֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/008.yaml
  text: Let destruction come upon him unawares[a], and let the net that he hid catch him[c][b]; into that very destruction let him fall.
translation:
  language: hi
  text: उस पर अचानक विनाश आ पड़े[a]; और जो जाल उसने छिपाया था, वही उसे फँसा ले[b]; उसी विनाश में वह गिर पड़े।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप से: “उस पर विनाश आ पड़े; वह न जानता हो”; अर्थात विनाश उस पर अप्रत्याशित रूप से आए।'
    reason: lexical_alternative
  - marker: b
    text: 'अंतिम वाक्यांश का अर्थ यह भी हो सकता है: “वह उसी जाल में गिर पड़े,” यानी अपने ही बिछाए फंदे में फँसे।'
    reason: alternative_reading
lexical_decisions:
- source_word: תְּבוֹאֵהוּ
  choice: उस पर ... आ पड़े
  rationale: בוא के सामान्य अर्थ ‘आना’ और यहाँ की कामनार्थक वाक्य-शैली, दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: שׁוֹאָה
  choice: विनाश
  rationale: यह संज्ञा अचानक आनेवाली बरबादी या विध्वंस को दर्शाती है; दोनों occurrences में ‘विनाश’ अर्थ और काव्यात्मक गरिमा बनाए रखता है।
- source_word: לֹא יֵדָע
  choice: अचानक
  rationale: शाब्दिक अर्थ ‘वह न जाने’ है; प्रसंग में यह उसके अनजान रहते, अप्रत्याशित रूप से विनाश आने का भाव देता है। शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
- source_word: וְרִשְׁתּוֹ אֲשֶׁר טָמַן
  choice: जो जाल उसने छिपाया था
  rationale: सम्बन्धवाचक रचना यह स्पष्ट करती है कि जाल उसी का बिछाया हुआ गुप्त फंदा है, बिना अनावश्यक पुनरुक्ति के।
- source_word: תִּלְכְּדוֹ
  choice: उसे फँसा ले
  rationale: जाल के संदर्भ में לכד के लिए ‘फँसा लेना’ आधुनिक हिन्दी का सबसे स्वाभाविक प्रयोग है।
- source_word: בְּשׁוֹאָה יִפָּל בָּהּ
  choice: उसी विनाश में वह गिर पड़े
  rationale: आरम्भिक בְּשׁוֹאָה और स्त्रीलिंग प्रत्यय בָּהּ को पुनरुक्त/बलाघाती रचना मानते हुए ‘उसी विनाश में’ दिया गया है; जाल की ओर संकेत की सम्भावना पादटिप्पणी में रखी गई है।
theological_decisions:
- issue: अभिशापात्मक प्रार्थना का बल
  choice: कामनार्थक ‘आ पड़े/फँसा ले/गिर पड़े’
  alternative: भविष्यसूचक ‘आ पड़ेगा/फँसा लेगा/गिर पड़ेगा’
  rationale: हिब्रू रूप इस प्रसंग में विनाश की प्रार्थना या कामना व्यक्त करते हैं; हिन्दी में कामनार्थक क्रियाएँ उस तनाव को बनाए रखती हैं, इसे केवल भविष्यवाणी नहीं बनातीं।
- issue: בָּהּ का पूर्वपद
  choice: ‘विनाश’ की ओर संकेत
  alternative: ‘जाल’ की ओर संकेत
  rationale: निकटवर्ती स्त्रीलिंग שׁוֹאָה और अग्रस्थ पद की पुनरुक्ति मुख्य पाठ के चयन का समर्थन करती है, पर व्याकरणतः जाल की ओर संकेत भी सम्भव है और उसे पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; काव्यात्मक और गरिमापूर्ण, पर सामान्य पाठक के लिए सहज। ‘वही’ अपने ही छिपाए जाल द्वारा पकड़े जाने की प्रतिफलात्मक विडम्बना को उभारता है।
