  yaml_path: translation/ot/psalms/035/002.yaml
  text: Take hold of shield and buckler[a], and rise up for my help.
translation:
  language: hi
  text: ढाल और बड़ी ढाल हाथ में ले, और मेरी सहायता के लिए उठ खड़ा हो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַחֲזֵק
  choice: उठा ले
  rationale: यहाँ क्रिया का आशय युद्ध के लिए ढालों को हाथ में लेने से है। ‘उठा ले’ स्वाभाविक हिन्दी में ठोस युद्ध-चित्र बनाए रखता है; इसे अमूर्त ‘दृढ़ हो’ कहना प्रसंग के अनुकूल नहीं होगा।
- source_word: מָגֵן
  choice: ढाल
  rationale: यह सामान्यतः ढाल के लिए प्रयुक्त शब्द है; ‘ढाल’ इसका सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: צִנָּה
  choice: बड़ी ढाल
  rationale: यह מָגֵן से भिन्न, शरीर के अधिक भाग को ढकने वाली बड़ी ढाल का संकेत देता है। हिन्दी में अलग प्रचलित तकनीकी शब्द के अभाव में ‘बड़ी ढाल’ भेद को स्पष्ट और सहज रखता है।
- source_word: וְקוּמָה
  choice: और ... खड़ा हो जा
  rationale: קום का आग्रहपूर्ण आज्ञार्थक रूप सहायता के लिए तत्काल उठ खड़े होने का आह्वान करता है। ‘खड़ा हो जा’ वर्तमान हिन्दी में स्वाभाविक है और सक्रिय हस्तक्षेप का भाव रखता है।
- source_word: בְּעֶזְרָתִי
  choice: मेरी सहायता के लिए
  rationale: पूर्वसर्ग ב और संज्ञा עֶזְרָה का यह प्रयोग भजनकार की सहायता के लिए कार्रवाई करने का भाव देता है। यह हिन्दी रूप संज्ञात्मक ‘सहायता’ को भी बनाए रखता है।
theological_decisions:
- issue: परमेश्वर का योद्धा-सदृश चित्रण
  choice: परमेश्वर से ढालें उठाकर भजनकार की सहायता के लिए खड़े होने की स्पष्ट युद्ध-संबंधी छवि बनाए रखी गई है।
  alternative: इसे केवल ‘मेरी रक्षा कर’ जैसे सामान्य निवेदन में नरम करना।
  rationale: इब्रानी पाठ स्पष्ट रूप से युद्ध और रक्षात्मक हथियारों की रूपकात्मक भाषा प्रयोग करता है। इसे अमूर्त सुरक्षा-विनती में बदलने से मूल चित्रण खो जाएगा।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, आग्रहपूर्ण और गरिमामय प्रार्थना-भाषा। ‘उठा ले’ तथा ‘खड़ा हो जा’ संबोधन की निकटता और इब्रानी एकवचन आज्ञार्थक की तीव्रता बनाए रखते हैं।
