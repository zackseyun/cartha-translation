source:
  edition: WLC
  text: יֵבֹ֣שׁוּ וְ/יִכָּלְמוּ֮ מְבַקְשֵׁ֪י נַ֫פְשִׁ֥/י יִסֹּ֣גוּ אָח֣וֹר וְ/יַחְפְּר֑וּ חֹ֝שְׁבֵ֗י רָעָתִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/004.yaml
  text: Let those who seek my life be put to shame and humiliated[b][a]; let those who devise my harm turn back and be disgraced.
translation:
  language: hi
  text: जो मेरे प्राण के पीछे पड़े हैं[a], वे लज्जित और अपमानित हों; जो मेरी हानि की योजना बनाते हैं[b], वे पीछे हटें और लज्जित हों।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “जो मेरे प्राण को ढूँढ़ते हैं”; यह इब्रानी मुहावरा किसी के प्राण लेने की चेष्टा करने के लिए है।
    reason: lexical_alternative
  - marker: b
    text: या “जो मेरे विरुद्ध बुराई की योजना बनाते हैं।”
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵבֹשׁוּ
  choice: लज्जित हों
  rationale: क़ाल रूप यहाँ लज्जा और विफलता का अनुभव व्यक्त करता है; प्रार्थना के संदर्भ में इच्छासूचक बल को ‘हों’ से रखा गया है।
- source_word: וְיִכָּלְמוּ
  choice: और अपमानित हों
  rationale: निफ़ाल रूप परिणामस्वरूप अपमानित होने का भाव देता है और पहले लज्जा-सूचक क्रिया की तीव्र समानांतर अभिव्यक्ति है।
- source_word: מְבַקְשֵׁי נַפְשִׁי
  choice: जो मेरे प्राण के पीछे पड़े हैं
  rationale: शत्रुतापूर्ण संदर्भ में נפש को ‘ढूँढ़ना’ किसी के प्राण लेने की चेष्टा का मुहावरा है; यह हिंदी अभिव्यक्ति अर्थ और काव्यात्मकता दोनों रखती है।
- source_word: יִסֹּגוּ אָחוֹר
  choice: वे पीछे हटें
  rationale: סוג और אָחוֹר मिलकर पीछे हटने अथवा परास्त होकर लौटने का भाव देते हैं।
- source_word: וְיַחְפְּרוּ
  choice: और निरादर पाएँ
  rationale: यहाँ חפר का अर्थ शाब्दिक ‘खोदना’ नहीं, बल्कि लज्जा अथवा अपयश का अनुभव करना है; ‘निरादर पाएँ’ पहले प्रयुक्त शब्दों से कुछ भिन्नता बनाए रखता है।
- source_word: חֹשְׁבֵי רָעָתִי
  choice: जो मेरी हानि की योजना बनाते हैं
  rationale: חשב सोचकर योजना बनाने और רָעָתִי भजनकार के विरुद्ध चाही गई बुराई अथवा हानि को दर्शाता है।
theological_decisions:
- issue: शापात्मक प्रार्थना में अपूर्ण क्रियाओं का बल
  choice: क्रियाओं को इच्छासूचक प्रार्थना के रूप में ‘हों/हटें/पाएँ’ से प्रस्तुत किया गया है।
  alternative: 'भविष्यवाणी-सदृश कथन: ‘वे लज्जित होंगे...।’'
  rationale: इब्रानी अपूर्ण रूप अकेले में अस्पष्ट हो सकते हैं, किंतु परमेश्वर से की जा रही इस प्रार्थना में वे स्वाभाविक रूप से निवेदन अथवा न्याय की कामना व्यक्त करते हैं; अनुवाद इस तनाव को भविष्यवाणी में नहीं बदलता।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी की, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। समानांतर लज्जा-सूचक क्रियाओं को ‘लज्जित’, ‘अपमानित’ और ‘निरादर’ से अलग-अलग छटा दी गई है; ‘मेरे प्राण के पीछे पड़े हैं’ स्वाभाविक हिंदी मुहावरे में प्राणघातक आशय रखता है।
