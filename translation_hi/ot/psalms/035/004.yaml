- from: जो मेरे प्राण के पीछे पड़े हैं[a], वे लज्जित और अपमानित हों; जो मेरी हानि की योजना बनाते हैं[b], वे पीछे हटें और निरादर पाएँ।
  to: जो मेरे प्राण के पीछे पड़े हैं[a], वे लज्जित और अपमानित हों; जो मेरी हानि की योजना बनाते हैं[b], वे पीछे हटें और लज्जित हों।
  rationale: Only the rendering of וְיַחְפְּרוּ is revised. ‘लज्जित हों’ directly conveys the Hebrew shame/disgrace sense. Although it repeats the semantic field already present in the first colon, that repetition reflects the Hebrew’s intentional poetic parallelism and avoids the weaker, shifted meaning of ‘निरादर पाएँ’.
