review_pass:
  verdict: revise
  source_fidelity: The imprecatory force is correctly represented by ‘हों/हटें/पाएँ’. ‘मेरे प्राण के पीछे पड़े हैं’ naturally conveys hostile pursuit and, with footnote a, adequately reflects the Hebrew idiom for seeking someone’s life. The second clause faithfully renders planning harm against the psalmist.
  naturalness: The verse is fluent, modern standard Hindi with an appropriately elevated psalmic register. However, ‘निरादर पाएँ’ primarily suggests receiving disrespect from others and does not naturally convey the reflexive/resultative shame denoted by חפר in this context.
  terminology: ‘लज्जित’ and ‘अपमानित’ appropriately preserve the first paired shame terms. Replacing ‘निरादर पाएँ’ with ‘लज्जित हों’ restores the final verb’s sense of being ashamed/disgraced; repetition is preferable to semantic drift in this tightly parallel Hebrew poetic line. Footnote anchors are correctly placed and the notes remain suitable.
  issues:
  - severity: medium
    issue: ‘निरादर पाएँ’ for וְיַחְפְּרוּ
    rationale: This wording means ‘receive disrespect’ or ‘be slighted,’ whereas חפר here denotes being ashamed, put to shame, or disgraced. It can imply an external dishonor without expressing the intended shame response/result.
  revised_text: जो मेरे प्राण के पीछे पड़े हैं[a], वे लज्जित और अपमानित हों; जो मेरी हानि की योजना बनाते हैं[b], वे पीछे हटें और लज्जित हों।
