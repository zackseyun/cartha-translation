source:
  edition: WLC
  text: יְֽהִי דַרְכָּ֗/ם חֹ֥שֶׁךְ וַ/חֲלַקְלַקּ֑וֹת וּ/מַלְאַ֥ךְ יְ֝הוָ֗ה רֹדְפָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/006.yaml
  text: May their way be dark and slippery[a], with the angel of Yahweh pursuing them.
translation:
  language: hi
  text: उनका मार्ग अँधेरा और फिसलन भरा हो, और[a] याहवे का दूत उनका पीछा करे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ “और” का अर्थ “जबकि” या “और साथ ही” भी हो सकता है—अर्थात उनका मार्ग अँधेरा और फिसलन भरा हो, जबकि याहवे का दूत उनका पीछा करे।
    reason: इब्रानी संयोजक וְ साधारण समन्वय के साथ-साथ सहवर्ती परिस्थिति भी व्यक्त कर सकता है।
lexical_decisions:
- source_word: יְהִי
  choice: हो
  rationale: यह היה का आज्ञार्थक/कामनार्थक रूप है, जो यहाँ शाप-सदृश कामना व्यक्त करता है। हिंदी में “हो” इस भाव को स्वाभाविक रूप से रखता है।
- source_word: דַרְכָּם
  choice: उनका मार्ग
  rationale: דֶּרֶךְ का अर्थ मार्ग या रास्ता है और यह वास्तविक तथा रूपक—दोनों अर्थों को खुला रखता है।
- source_word: חֹשֶׁךְ
  choice: अँधेरा
  rationale: मूल में संज्ञा “अंधकार” है, पर विधेय के रूप में “मार्ग अँधेरा हो” सहज आधुनिक हिंदी है और संकट तथा दिशाहीनता का बिंब बनाए रखता है।
- source_word: וַחֲלַקְלַקּוֹת
  choice: और फिसलन भरा
  rationale: बहुवचन संज्ञा चिकनी या फिसलन वाली जगहों/दशा को दर्शाती है। “फिसलन भरा” हिंदी में मार्ग के साथ स्वाभाविक है और खतरे का बिंब स्पष्ट रखता है।
- source_word: וּמַלְאַךְ יְהוָה
  choice: और याहवे का दूत
  rationale: וְ को मुख्य पाठ में सामान्य समन्वयकारी “और” के रूप में रखा गया है; प्रसंग में इसका सहवर्ती अर्थ भी संभव है, जिसे पादटिप्पणी में बताया गया है।
- source_word: יְהוָה
  choice: याहवे
  rationale: टेट्राग्रामटन को उपाधि से बदलने के बजाय परमेश्वर के व्यक्तिगत नाम के लिप्यंतरण के रूप में प्रस्तुत किया गया है।
- source_word: רֹדְפָם
  choice: उनका पीछा करता रहे
  rationale: רדף सक्रिय और शत्रुतापूर्ण ढंग से पीछा करने को दर्शाता है। “करता रहे” कृदंत की जारी क्रिया और पद के कामनार्थक संदर्भ को स्वाभाविक हिंदी में व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में टेट्राग्रामटन सीधे आया है। “याहवे” उसके संभावित उच्चारण का प्रचलित लिप्यंतरण है और व्यक्तिगत वाचा-नाम को किसी उपाधि से नहीं बदलता।
- issue: दूत द्वारा पीछा किए जाने और मार्ग की दशा का संबंध
  choice: समन्वयकारी “और”
  alternative: “जबकि” अथवा सहवर्ती “और साथ ही”
  rationale: इब्रानी וְ साधारण समन्वय और सहवर्ती परिस्थिति—दोनों की अनुमति देता है। मुख्य पाठ निकटतर औपचारिक संबंध रखता है और पादटिप्पणी दूसरा संभव अर्थ बताती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। “अँधेरा” तथा “फिसलन भरा” सामान्य पाठक के लिए स्पष्ट हैं, जबकि “मार्ग” पद के वास्तविक और रूपक दोनों आयाम बनाए रखता है।
