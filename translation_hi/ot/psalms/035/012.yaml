  text: 'वे मेरी भलाई का बदला बुराई से देते हैं;

    मेरे प्राण को शोकाकुल कर देते हैं।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप के निकट: ‘मेरे प्राण के लिए वियोग।’ ‘प्राण’ के लिए प्रयुक्त इब्रानी शब्द का अर्थ ‘जीवन’ या ‘स्वयं मैं’ भी हो सकता है; पूरी पंक्ति का भाव ‘मेरे जीवन को हानि पहुँचती है’ भी समझा जा सकता है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְשַׁלְּמוּנִי
  choice: मुझे बदला देते हैं
  rationale: पिएल रूप यहाँ प्रतिदान या बदला चुकाने का भाव रखता है। पूरे पदबंध में स्वाभाविक हिन्दी के लिए इसे ‘मेरी भलाई का बदला ... देते हैं’ के रूप में रखा गया है।
- source_word: רָעָה תַּחַת טוֹבָה
  choice: मेरी भलाई का बदला बुराई से
  rationale: תַּחַת विनिमय या प्रतिदान दर्शाता है। यह अनुवाद ‘भलाई’ और ‘बुराई’ के तीखे विरोध तथा शत्रुतापूर्ण प्रत्युत्तर—दोनों को सुरक्षित रखता है।
- source_word: שְׁכוֹל
  choice: उजाड़ देते हैं
  rationale: यह शब्द मूलतः वियोग, अपूरणीय हानि या संतान-वियोग से उत्पन्न उजाड़ दशा को व्यक्त कर सकता है। यहाँ रूपकात्मक और काव्यात्मक प्रयोग को हिन्दी में स्वाभाविक बनाने के लिए ‘उजाड़ देते हैं’ चुना गया है; संतान-वियोग को अनावश्यक रूप से निश्चित नहीं किया गया।
- source_word: לְנַפְשִׁי
  choice: मेरे प्राण को
  rationale: נֶפֶשׁ का अर्थ प्रसंगानुसार प्राण, जीवन या स्वयं व्यक्ति हो सकता है। ‘मेरे प्राण’ काव्यात्मक गहराई बनाए रखता है और केवल अमूर्त ‘आत्मा’ तक अर्थ को सीमित नहीं करता।
