  text: Awake and rise up for my judgment[a], my God and my Lord[c][b], for my cause.
translation:
  language: hi
  text: जाग उठ और उठ खड़ा हो—मेरे न्याय[a] के लिए, हे मेरे परमेश्वर और मेरे प्रभु, मेरे मुक़दमे[b] के लिए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘मेरे पक्ष में न्याय करने के लिए’ अथवा ‘मेरे पक्ष को सही ठहराने के लिए’; इब्रानी शब्द न्याय, न्यायिक निर्णय या पक्ष-समर्थन को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘मेरे विवाद के लिए’ अथवा ‘मेरे मामले के लिए’; इब्रानी शब्द किसी कानूनी विवाद या वाद को सूचित करता है।
