lexical_decisions:
- source_word: הָעִירָה
  choice: जाग उठ
  rationale: यह עור के हिफ़ील आदेशात्मक रूप में परमेश्वर से सक्रिय हस्तक्षेप की पुकार है। ‘जाग उठ’ दैवी निष्क्रियता के रूपक को बनाए रखते हुए आधुनिक हिन्दी में स्वाभाविक है।
- source_word: וְהָקִיצָה
  choice: और सचेत हो
  rationale: यह दूसरा जागने का क्रियापद पहले के साथ मिलकर पुकार की तीव्रता बढ़ाता है। ‘सचेत हो’ दोनों क्रियाओं को अलग अभिव्यक्ति देता है, पर सक्रिय होने के भाव को अनावश्यक रूप से विस्तृत नहीं करता।
- source_word: לְמִשְׁפָּטִי
  choice: मेरे न्याय के लिए
  rationale: מִשְׁפָּט का अर्थ न्याय, न्यायिक निर्णय अथवा पक्ष-समर्थन हो सकता है। यह चयन मूल की विधिक व्यापकता और प्रथम पुरुष संबंध दोनों को बनाए रखता है।
- source_word: אֱלֹהַי
  choice: मेरे परमेश्वर
  rationale: सम्बन्धसूचक रूप और प्रत्यक्ष संबोधन को सहज हिन्दी में यथावत रखा गया है।
- source_word: וַאדֹנָי
  choice: और मेरे प्रभु
  rationale: אדני यहाँ परमेश्वर के लिए आदरसूचक उपाधि है। ‘प्रभु’ स्थापित और प्रसंगानुकूल हिन्दी रूप है।
- source_word: לְרִיבִי
  choice: मेरे मुक़दमे के लिए
  rationale: רִיב यहाँ विवाद, कानूनी मामला या अभियोग को सूचित करता है। ‘मुक़दमा’ विधिक अर्थ स्पष्ट करता है, जबकि किसी आधुनिक औपचारिक न्याय-प्रक्रिया को अनिवार्य नहीं बनाता।
theological_decisions:
- issue: परमेश्वर के लिए संयुक्त संबोधन אֱלֹהַי וַאדֹנָי
  choice: हे मेरे परमेश्वर और मेरे प्रभु
  alternative: हे मेरे परमेश्वर और मेरे स्वामी
  rationale: दोनों श्रद्धापूर्ण उपाधियों को अलग-अलग बनाए रखा गया है। ‘प्रभु’ दैवी संबोधन के रूप में स्वाभाविक है और इस भजन में कोई अतिरिक्त मसीह-विषयक दावा नहीं जोड़ता।
- issue: परमेश्वर को जागने की पुकार
  choice: रूपक को प्रत्यक्ष रूप में बनाए रखना
  alternative: मेरी सहायता के लिए सक्रिय हो
  rationale: मूल पाठ परमेश्वर की प्रत्यक्ष निष्क्रियता को ‘जागने’ के रूपक से व्यक्त करता है। इसे व्याख्यात्मक भावार्थ में बदलने के बजाय काव्यात्मक और धर्मवैचारिक तनाव सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, काव्यात्मक और प्रार्थनापरक रखी गई है। एकवचन आदेशात्मक संबोधन की निकटता को बनाए रखा गया है; ‘हे’ संयुक्त दैवी संबोधन को स्पष्ट करता है। डैश तीव्र पुकार और उसके प्रयोजन के बीच स्वाभाविक विराम देता है।
