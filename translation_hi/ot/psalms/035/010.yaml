source:
  edition: WLC
  text: כָּ֥ל עַצְמוֹתַ֨/י תֹּאמַרְנָה֮ יְהוָ֗ה מִ֥י כָ֫מ֥וֹ/ךָ מַצִּ֣יל עָ֭נִי מֵ/חָזָ֣ק מִמֶּ֑/נּוּ וְ/עָנִ֥י וְ֝/אֶבְי֗וֹן מִ/גֹּזְלֽ/וֹ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/010.yaml
  text: All my bones will say, “O LORD, who is like you, delivering the poor from one stronger than he, and the poor and needy from the one who robs him?”
translation:
  language: hi
  text: मेरी सारी हड्डियाँ कहेंगी, “हे यहोवा, तेरे समान कौन है, जो निर्धन को उससे अधिक बलवान के हाथ से, और निर्धन और ज़रूरतमंद को उसे लूटने वाले के हाथ से छुड़ाता है?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל עַצְמוֹתַי
  choice: मेरी सारी हड्डियाँ
  rationale: शाब्दिक शारीरिक बिंब को बनाए रखा गया है; यह पूरे अस्तित्व से स्तुति व्यक्त करने वाला स्वाभाविक हिब्रू मुहावरा है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ में आए परमेश्वर के विशिष्ट नाम को सामान्य उपाधि से बदलने के बजाय हिन्दी में प्रचलित रूप में रखा गया है।
- source_word: עָנִי
  choice: निर्धन
  rationale: संदर्भ में ऐसा असहाय व्यक्ति अभिप्रेत है जो अधिक शक्तिशाली शोषक का सामना कर रहा है; ‘निर्धन’ आर्थिक अभाव को स्पष्ट रखता है, यद्यपि शब्द दुःखित या पीड़ित का भाव भी ले सकता है।
- source_word: אֶבְיוֹן
  choice: ज़रूरतमंद
  rationale: अभाव और सहायता की आवश्यकता के अर्थ को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: מַצִּיל
  choice: छुड़ाता है
  rationale: संकट और शक्तिशाली अत्याचारी के हाथ से बचाने के सक्रिय अर्थ को व्यक्त करता है।
- source_word: גֹּזְלוֹ
  choice: उसके लुटेरे
  rationale: क्रिया גזל के बलपूर्वक छीनने या लूटने के अर्थ को संज्ञात्मक और स्वाभाविक हिन्दी रूप में रखा गया है।
theological_decisions:
- issue: परमेश्वर के नाम का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: यहाँ मूल में विशिष्ट नाम יהוה है; उसे स्पष्ट रखने से नाम और उपाधि का भेद बना रहता है।
- issue: עָנִי की अर्थ-सीमा
  choice: निर्धन
  alternative: पीड़ित / दीन
  rationale: समानांतर पद ‘ज़रूरतमंद’ और लूटने वाले का प्रसंग निर्धन एवं असहाय व्यक्ति की ओर संकेत करता है; फिर भी अनुवाद किसी विशिष्ट सामाजिक या आध्यात्मिक वर्ग तक अर्थ सीमित नहीं करता।
- issue: מִמֶּנּוּ में सर्वनाम-संबंध
  choice: उससे बलवान
  alternative: उसके लिए अत्यन्त बलवान
  rationale: 'हिब्रू तुलना को सीधे रखा गया है: बचाया जाने वाला व्यक्ति उस विरोधी से कमजोर है।'
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल हिन्दी। काव्यात्मक शारीरिक बिंब ‘मेरी सारी हड्डियाँ’ तथा दो समानांतर उद्धार-वाक्य सुरक्षित रखे गए हैं।
