base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/017.yaml
  text: Lord, how long will you look on? Restore my life from their ravages, my only one from the young lions.
translation:
  language: hi
  text: हे प्रभु, तू कब तक देखता रहेगा? मेरे प्राण को उनके किए हुए विनाशों से बचा ले; मेरे उस एकमात्र प्राण को जवान सिंहों से बचा ले।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲדֹנָי
  choice: हे प्रभु
  rationale: यह संबोधन सामान्य हिन्दी में स्वाभाविक और गरिमापूर्ण है तथा मूल के ‘स्वामी/प्रभु’ भाव को व्यक्त करता है।
- source_word: כַּמָּה תִרְאֶה
  choice: तू कब तक देखता रहेगा?
  rationale: शाब्दिक प्रश्न ‘कब तक देखेगा?’ यहाँ निष्क्रिय होकर देखते रहने की शिकायत व्यक्त करता है; हिन्दी में निरंतरता स्पष्ट की गई है।
- source_word: הָשִׁיבָה נַפְשִׁי
  choice: मेरे प्राण को ... वापस ले आ
  rationale: הָשִׁיבָה का मूल भाव ‘लौटा ला/वापस ले आ’ और נֶפֶשׁ का प्रसंगगत अर्थ संकट में पड़ा जीवन या प्राण है।
- source_word: מִשֹּׁאֵיהֶם
  choice: उनके विनाशकारी हमलों से
  rationale: दुर्लभ रूप विनाश या उजाड़ डालने वाली गतिविधि का संकेत देता है। ‘विनाशकारी हमले’ हिन्दी में कर्ताओं की हिंसक कार्रवाई को स्वाभाविक ढंग से व्यक्त करता है, बिना उसे किसी विशिष्ट प्रकार के हमले तक सीमित किए।
- source_word: מִכְּפִירִים
  choice: जवान सिंहों से
  rationale: כְּפִירִים का सामान्य अर्थ युवा या जवान सिंह है; काव्य में यह हिंसक शत्रुओं की छवि है।
- source_word: יְחִידָתִי
  choice: मेरे एकमात्र जीवन
  rationale: स्त्रीलिंग रूप पिछले נַפְשִׁי से जुड़कर वक्ता के एकमात्र, अपूरणीय जीवन को दर्शाता है; मूल की असामान्य और भावपूर्ण अभिव्यक्ति को बनाए रखा गया है।
theological_decisions:
- issue: ईश्वर के देखते रहने का प्रश्न
  choice: ‘तू कब तक देखता रहेगा?’ के रूप में सीधी शिकायत रखी गई
  alternative: ‘तू कब तक चुपचाप देखता रहेगा?’
  rationale: ‘चुपचाप’ मूल में स्पष्ट नहीं है। भजन की शिकायत और तनाव को बनाए रखते हुए अतिरिक्त धार्मिक व्याख्या नहीं जोड़ी गई।
- issue: נֶפֶשׁ का अनुवाद
  choice: ‘प्राण’
  alternative: ‘आत्मा’
  rationale: यहाँ शारीरिक संकट से बचाए जाने की याचना है, इसलिए ‘प्राण/जीवन’ प्रसंगानुकूल है; ‘आत्मा’ हिन्दी में अनावश्यक रूप से अमूर्त या पारलौकिक अर्थ दे सकती है।
- issue: जवान सिंहों की छवि
  choice: रूपक को ज्यों का त्यों रखा गया
  alternative: इसे सीधे ‘हिंसक शत्रु’ कहना
  rationale: मूल कविता शत्रुओं को जवान सिंहों की छवि में प्रस्तुत करती है। इसे स्पष्टार्थ में बदलने से काव्यात्मक शक्ति और संभावित अर्थ-विस्तार घट जाता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, प्रार्थनात्मक संबोधन रखा गया है। ‘तू’ भजन में ईश्वर से निकट और सीधा संबोधन व्यक्त करता है। समानांतर पंक्तियों में ‘प्राण/जीवन’ की पुनरुक्ति मूल के भाव को बनाए रखती है; दूसरी पंक्ति में ‘बचा ले’ निहित क्रिया को स्वाभाविक हिन्दी में पूरा करती है।
