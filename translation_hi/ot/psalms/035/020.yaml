- source_word: שָׁלוֹם
  choice: शान्ति
  rationale: मूल अर्थ शान्ति है, जिसमें कुशल और समग्र भलाई के भाव भी समाहित हो सकते हैं।
- source_word: וְעַל
  choice: बल्कि ... के विरुद्ध
  rationale: संयोजक और संबंधसूचक पद यहाँ उनके शान्ति न बोलने तथा वास्तव में विरोध में षड्यंत्रकारी बातें रचने के बीच विरोध दर्शाते हैं।
- source_word: רִגְעֵי אֶרֶץ
  choice: देश में शान्ति से रहनेवाले
  rationale: दुर्लभ पदबंध संभवतः देश में चुपचाप और शान्तिपूर्वक जीवन बितानेवाले लोगों को सूचित करता है; हिन्दी में यह अर्थ स्पष्ट और स्वाभाविक है, जबकि अनिश्चितता पादटिप्पणी में सुरक्षित है।
- source_word: דִּבְרֵי מִרְמוֹת
  choice: छल की बातें
  rationale: हिब्रू की संज्ञा-आधारित रचना को बनाए रखता है और कपटपूर्ण कथनों का भाव स्पष्ट करता है।
- source_word: יַחֲשֹׁבוּן
  choice: गढ़ते हैं
  rationale: संदर्भ में क्रिया केवल सोचने के बजाय जानबूझकर योजना बनाने या बातें रचने का भाव देती है।
