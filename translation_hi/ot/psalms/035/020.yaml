  yaml_path: translation/ot/psalms/035/020.yaml
  text: For they do not speak peace[a], but against the quiet ones of the land they devise deceitful words.
translation:
  language: hi
  text: क्योंकि वे शांति की बात नहीं करते, बल्कि देश में शांति से रहने वालों[a] के विरुद्ध छल की बातें गढ़ते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘देश के शांत लोगों’ अथवा ‘देश में चैन से रहने वालों।’ हिब्रू पदबंध संभवतः उन लोगों के लिए है जो चुपचाप और शांतिपूर्वक रहते हैं।
    reason: lexical_alternative
lexical_decisions:
