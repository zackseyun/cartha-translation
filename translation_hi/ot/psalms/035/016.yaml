lexical_decisions:
- source_word: בְּחַנְפֵי
  choice: भक्तिहीन ... के बीच
  rationale: חנף से बना रूप नैतिक और धार्मिक भ्रष्टता या अपवित्रता का बोध करा सकता है। यहाँ ‘भक्तिहीन’ केवल कपट का अर्थ थोपे बिना उस भाव को व्यक्त करता है; בְּ को संगति/स्थान के अर्थ में ‘के बीच’ किया गया है।
- source_word: לַעֲגֵי
  choice: ठट्ठा करनेवालों
  rationale: לעג शत्रुतापूर्ण उपहास करनेवालों को दर्शाता है। ‘ठट्ठा करनेवाले’ आधुनिक हिन्दी में सहज और स्पष्ट है।
- source_word: מָעוֹג
  choice: भोज में
  rationale: यह दुर्लभ और अनिश्चित शब्द संभवतः भोज या खाने की वस्तु—केक/निवाले—से जुड़ा है। मुख्य पाठ में प्रसंगगत सामाजिक परिवेश ‘भोज में’ रखा गया है और विकल्प पादटिप्पणी में सुरक्षित है।
- source_word: חָרֹק
  choice: पीसते हैं
  rationale: חרק दाँत पीसने या किटकिटाने की शत्रुतापूर्ण क्रिया बताता है। ‘दाँत पीसते हैं’ हिन्दी का स्वाभाविक मुहावरा है।
- source_word: עָלַי
  choice: मुझ पर
  rationale: शत्रुतापूर्ण क्रिया के साथ עַל का स्वाभाविक हिन्दी रूप ‘मुझ पर’ है।
- source_word: שִׁנֵּימוֹ
  choice: दाँत
  rationale: बहुवचन संज्ञा पर तृतीय पुरुष बहुवचन प्रत्यय है। हिन्दी में कर्ता ‘वे’ के साथ ‘दाँत’ स्वाभाविक रूप से उन्हीं के दाँत समझे जाते हैं।
