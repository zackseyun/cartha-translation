  text: וּ/בְ/צַלְעִ/י֮ שָׂמְח֪וּ וְֽ/נֶאֱ֫סָ֥פוּ נֶאֶסְפ֬וּ עָלַ֣/י נֵ֭כִים וְ/לֹ֣א יָדַ֑עְתִּי קָֽרְע֥וּ וְ/לֹא דָֽמּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/015.yaml
  text: But at my stumbling they rejoiced and gathered together[a]; they gathered against me—strangers whom I did not know[d][c][b]. They tore at me and did not stop.
translation:
  language: hi
  text: पर मेरे लड़खड़ाने पर वे आनंदित हुए और इकट्ठे हो गए[a]; वे मेरे विरुद्ध इकट्ठे हुए—ऐसे प्रहार करनेवाले जिन्हें मैं नहीं जानता था[b][c]। वे मुझे चीरते रहे और रुके नहीं[d]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरे लंगड़ाने पर” अथवा “जब मैं लड़खड़ाया।” इब्रानी शारीरिक लंगड़ाहट या अधिक व्यापक रूप से दुर्बलता अथवा पतन की घड़ी को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: “प्रहार करनेवाले” के लिए प्रयुक्त इब्रानी शब्द दुर्लभ और अनिश्चित है; इसका अर्थ “मारनेवाले,” या सम्भवतः “पीड़ित/लंगड़े लोग” भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: या, “प्रहार करनेवाले मेरे विरुद्ध इकट्ठे हुए, और मुझे इसका पता न था।” इब्रानी वाक्य-विन्यास दोनों अर्थों की सम्भावना रखता है।
    reason: syntactic_ambiguity
  - marker: d
    text: या, “वे चीरते रहे और चुप न हुए,” यदि यहाँ लगातार मौखिक निन्दा का चित्र है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְצַלְעִי
  choice: मेरे लड़खड़ाने पर
  rationale: צלע से बना यह रूप लंगड़ाने, लड़खड़ाने या दुर्बलता और पतन की घड़ी को सूचित कर सकता है। ‘लड़खड़ाने’ से शारीरिक और रूपकात्मक—दोनों भाव खुले रहते हैं।
- source_word: שָׂמְחוּ
  choice: वे आनन्दित हुए
  rationale: שׂמח के सामान्य अर्थ को व्यक्त करता है और भजनकार की विपत्ति पर शत्रुओं की प्रसन्नता स्पष्ट रखता है।
- source_word: וְנֶאֱסָפוּ / נֶאֶסְפוּ
  choice: इकट्ठे हो गए; ... इकट्ठे हुए
  rationale: मूल पाठ में אסף की पुनरावृत्ति बल देती है; हिन्दी में भी दोनों क्रियाओं को रखकर वही प्रभाव सुरक्षित किया गया है।
- source_word: עָלַי
  choice: मेरे विरुद्ध
  rationale: शाब्दिक अर्थ ‘मुझ पर’ हो सकता है, पर इस शत्रुतापूर्ण प्रसंग में ‘मेरे विरुद्ध’ स्वाभाविक और सटीक है।
- source_word: נֵכִים
  choice: मारनेवाले
  rationale: यह दुर्लभ और अनिश्चित शब्द सम्भवतः प्रहार करनेवालों को सूचित करता है; hostile context में ‘मारनेवाले’ उपयुक्त है, जबकि अन्य सम्भावनाएँ पादटिप्पणी में दी गई हैं।
- source_word: וְלֹא יָדַעְתִּי
  choice: और मुझे इसका पता न था
  rationale: यह वाक्यांश उनके इकट्ठे होने या षड्यंत्र से भजनकार की अनभिज्ञता व्यक्त कर सकता है। वैकल्पिक रूप से यह पहले संज्ञा का सम्बन्धवाचक वर्णन हो सकता है।
- source_word: קָרְעוּ
  choice: वे मुझे फाड़ते रहे
  rationale: קרע का मूल अर्थ फाड़ना या चीरना है। कर्म मूल में व्यक्त नहीं है, पर प्रसंग में भजनकार पर लगातार आक्रमण निहित है; हिन्दी में ‘मुझे’ जोड़ना स्वाभाविक है।
- source_word: וְלֹא דָמּוּ
  choice: और रुके नहीं
  rationale: דמם का अर्थ चुप होना या रुक जाना हो सकता है। ‘रुके नहीं’ लगातार आक्रमण का भाव देता है, जबकि मौन न होने का सम्भव अर्थ पादटिप्पणी में सुरक्षित है।
