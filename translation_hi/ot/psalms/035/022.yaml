  yaml_path: translation/ot/psalms/035/022.yaml
  text: You have seen[a], O Yahweh; do not be silent. O Lord, do not be far from me.
translation:
  language: hi
  text: हे याहवे, तूने देखा है; चुप न रह। हे प्रभु, मुझसे दूर न रह।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רָאִיתָה
  choice: तूने यह देखा है
  rationale: यह ראה का काल पूर्ण रूप, द्वितीय पुरुष एकवचन पुल्लिंग है। वर्तमान प्रसंग में भजनकार उस अन्याय की ओर संकेत करके परमेश्वर से विनती करता है जिसे वह पहले ही देख चुका है; हिंदी का पूर्णकाल ‘तूने यह देखा है’ इस आधार को स्वाभाविक रूप से व्यक्त करता है।
- source_word: יְהוָה
  choice: हे यहोवा
  rationale: चार अक्षरों वाले ईश्वरीय नाम को पारंपरिक हिंदी रूप ‘यहोवा’ से व्यक्त किया गया है, ताकि इसे उपाधि ‘प्रभु’ से अलग रखते हुए व्यक्तिगत वाचा-नाम के रूप में सुरक्षित रखा जाए।
- source_word: אַל תֶּחֱרַשׁ
  choice: चुप न रह
  rationale: חרשׁ यहाँ ‘चुप रहना’ अर्थ में है। निषेधात्मक विनती को संक्षिप्त और स्वाभाविक हिंदी ‘चुप न रह’ से व्यक्त किया गया है; संदर्भ में मौन के साथ उत्तर या हस्तक्षेप न करना भी निहित है।
- source_word: אֲדֹנָי
  choice: हे प्रभु
  rationale: यह ईश्वर के लिए प्रयुक्त उपाधि ‘प्रभु’ है। इसे יְהוָה के व्यक्तिगत नाम से अलग रखा गया है और संबोधन के लिए ‘हे’ जोड़ा गया है।
- source_word: אַל תִּרְחַק
  choice: दूर न रह
  rationale: רחק का अर्थ ‘दूर होना/रहना’ है। אַל के साथ यह विनती है कि परमेश्वर दूरी बनाए न रखे; हिंदी में ‘दूर न रह’ स्थानिक और संबंधपरक दोनों भाव बनाए रखता है।
- source_word: מִמֶּנִּי
  choice: मुझसे
  rationale: מן और प्रथम पुरुष एकवचन प्रत्यय का अर्थ ‘मुझसे’ है; ‘दूर न रह’ के साथ यह स्वाभाविक हिंदी प्रयोग बनता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ व्यक्तिगत ईश्वरीय नाम का प्रयोग करता है, इसलिए इसे केवल ‘प्रभु’ से प्रतिस्थापित नहीं किया गया। आधुनिक मानक हिंदी में सामान्य पाठकों के लिए स्थापित रूप ‘यहोवा’ चुना गया, जबकि ‘याहवे’ अधिक प्रत्यक्ष विद्वत् लिप्यंतरण है।
- issue: परमेश्वर के मौन का आशय
  choice: चुप न रह
  alternative: निष्क्रिय न रह
  rationale: मूल की मौन-वाचक उपमा को ज्यों का त्यों रखा गया है। प्रसंग में निष्क्रियता या उत्तर न देना निहित हो सकता है, पर उसे मुख्य पाठ में स्पष्ट करके अर्थ को अनावश्यक रूप से सीमित नहीं किया गया।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिंदी। परमेश्वर के लिए निकट संबोधन का एकवचन ‘तू’ भजन की सीधी प्रार्थना और हिब्रू के द्वितीय पुरुष एकवचन को सुरक्षित रखता है। वाक्य-संरचना संक्षिप्त रखी गई है ताकि मूल की तीव्र विनती बनी रहे।
