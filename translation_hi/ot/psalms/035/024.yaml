base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/024.yaml
  text: Vindicate me according to your righteousness[a], O Yahweh my God, and do not let them rejoice over me.
translation:
  language: hi
  text: हे यहवे, मेरे परमेश्वर, अपनी धार्मिकता[a] के अनुसार मेरे पक्ष में न्याय कर; उन्हें मुझ पर आनन्द न मनाने दे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने न्याय के अनुसार।”
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁפְטֵנִי
  choice: मेरा न्याय करके मुझे निर्दोष ठहरा
  rationale: इस विनती के प्रसंग में שׁפט केवल निष्पक्ष जाँच नहीं, बल्कि प्रार्थी के पक्ष में न्याय करने और उसे सही ठहराने की याचना है। यह हिंदी रूप न्यायिक अर्थ और अपेक्षित अनुकूल निर्णय दोनों को स्पष्ट रखता है।
- source_word: כְצִדְקְךָ
  choice: अपनी धार्मिकता के अनुसार
  rationale: צדק यहाँ परमेश्वर के धर्मी चरित्र और न्यायपूर्ण मानदंड को दर्शाता है। ‘धार्मिकता’ मूल शब्द की व्यापक नैतिक-धार्मिक अर्थच्छाया को बनाए रखती है; ‘न्याय’ एक संभव प्रसंगगत विकल्प है।
- source_word: יְהוָה
  choice: यहवे
  rationale: इब्रानी चतुरक्षरीय निजी नाम को किसी उपाधि से बदलने के बजाय हिंदी में लिप्यंतरित किया गया है।
- source_word: אֱלֹהָי
  choice: मेरे परमेश्वर
  rationale: प्रथम पुरुष एकवचन संबंधसूचक प्रत्यय को स्पष्ट और स्वाभाविक हिंदी में सुरक्षित रखा गया है।
- source_word: וְאַל יִשְׂמְחוּ
  choice: उन्हें ... आनन्द न मनाने दे
  rationale: אַל के साथ अपूर्ण क्रिया नकारात्मक विनती व्यक्त करती है। यह रूप स्पष्ट करता है कि परमेश्वर से शत्रुओं को दुर्भावनापूर्ण आनन्द मनाने न देने की प्रार्थना की जा रही है।
- source_word: לִי
  choice: मुझ पर
  rationale: विरोधी प्रसंग में לִי का आशय भजनकार की दुर्दशा या पराजय पर आनन्द मनाना है; ‘मुझ पर’ इसे संक्षेप में व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहवे
  alternative: यहोवा
  rationale: पद में ईश्वर का निजी नाम सीधे प्रयुक्त है। ‘यहवे’ संभावित इब्रानी उच्चारण का आधुनिक हिंदी लिप्यंतरण है और इसे ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित नहीं करता।
- issue: צִדְקְךָ का अर्थ
  choice: अपनी धार्मिकता के अनुसार
  alternative: अपने न्याय के अनुसार
  rationale: ‘धार्मिकता’ परमेश्वर के धर्मी चरित्र और न्यायपूर्ण कार्य—दोनों की व्यापकता को बनाए रखती है। ‘न्याय’ वैध विकल्प है, पर अर्थ को अधिक न्यायिक दायरे में सीमित कर सकता है।
- issue: שָׁפְטֵנִי में अनुकूल निर्णय की याचना
  choice: मेरा न्याय करके मुझे निर्दोष ठहरा
  alternative: मेरा न्याय कर
  rationale: प्रसंग वक्ता के पक्ष में ईश्वरीय निर्णय की याचना करता है। विस्तृत हिंदी अभिव्यक्ति अनुकूल न्याय की दिशा स्पष्ट करती है, पर निर्दोषता के आधार को पद में दिए ‘अपनी धार्मिकता के अनुसार’ से अलग कोई सांप्रदायिक अर्थ नहीं देती।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और प्रार्थनात्मक रखी गई है। ‘हे’ संबोधन काव्यात्मक विनती के लिए स्वाभाविक है। ‘आनन्द न मनाने दे’ शत्रुओं के दुर्भावनापूर्ण उल्लास को सहज हिंदी में व्यक्त करता है।
