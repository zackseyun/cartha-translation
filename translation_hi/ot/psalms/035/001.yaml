  text: לְ/דָוִ֨ד רִיבָ֣/ה יְ֭הוָה אֶת יְרִיבַ֑/י לְ֝חַ֗ם אֶת לֹֽחֲמָֽ/י׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/001.yaml
  text: Of David[a]. Contend, O Yahweh, with those who contend with me[b]; fight against those who fight against me.
translation:
  language: hi
  text: 'दाऊद का।[a]


    हे याहवे, जो मुझसे विवाद करते हैं, उनसे विवाद कर;[b]

    जो मुझसे लड़ते हैं, उनसे लड़।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में केवल “दाऊद का” है। इसका अर्थ “दाऊद द्वारा,” “दाऊद से संबंधित,” या सम्भवतः “दाऊद के लिए” हो सकता है।
    reason: superscription_ambiguity
  - marker: b
    text: '“विवाद कर” में कानूनी अर्थ भी हो सकता है, जैसे: “मेरे विरोधियों के विरुद्ध मेरी ओर से वाद कर।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדָוִד
  choice: दाऊद का भजन
  rationale: लְ उपसर्ग संबंध, रचनाकारिता या समर्पण का संकेत दे सकता है। हिन्दी में शीर्षक को स्वाभाविक बनाने के लिए निहित विधा-संज्ञा ‘भजन’ जोड़ी गई है, जबकि पादटिप्पणी मूल की संक्षिप्तता और अस्पष्टता बताती है।
- source_word: רִיבָה ... אֶת יְרִיבַי
  choice: जो मुझसे विवाद करते हैं, उनसे विवाद कर
  rationale: रיב की कानूनी और व्यापक संघर्षात्मक दोनों छायाएँ हैं। ‘विवाद’ मूल क्रिया और उससे बने रूप की पुनरावृत्ति को बनाए रखता है और केवल न्यायालयीन अर्थ तक सीमित नहीं करता।
- source_word: יְהוָה
  choice: यहवे
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम יהוה को किसी पदवी से बदलने के बजाय हिन्दी में प्रचलित निकट लिप्यंतरण ‘यहवे’ दिया गया है।
- source_word: לְחַם ... אֶת לֹחֲמָי
  choice: जो मुझसे लड़ते हैं, उनसे लड़
  rationale: לחם यहाँ युद्ध या लड़ाई करने के अर्थ में है। ‘लड़’ सीधा, स्वाभाविक और सामान्य पाठक के लिए स्पष्ट है तथा मूल के क्रिया-प्रतिभागी संबंध को दोहराता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहवे
  alternative: यहोवा; प्रभु
  rationale: मूल में उपाधि नहीं, चतुरक्षरीय व्यक्तिगत नाम है। ‘यहवे’ उसे नाम के रूप में सुरक्षित रखता है; ‘प्रभु’ नाम को पदवी से बदल देता, और ‘यहोवा’ बाद की मिश्रित उच्चारण-परंपरा को दर्शाता है।
- issue: रיב की न्यायालयीन छाया
  choice: विवाद कर
  alternative: मेरा मुक़दमा लड़
  rationale: ‘मेरा मुक़दमा लड़’ सम्भव कानूनी आशय को स्पष्ट करता है, पर मूल में ‘मेरा मुक़दमा’ अलग से नहीं है। मुख्य पाठ व्यापक और कानूनी दोनों सम्भावनाएँ खुली रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, प्रार्थनात्मक और गरिमापूर्ण शैली रखी गई है। समान मूलों से बने इब्रानी पदों की समानांतर पुनरावृत्ति को ‘विवाद…विवाद’ और ‘लड़ते…लड़’ द्वारा सुरक्षित किया गया है।
