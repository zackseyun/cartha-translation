source:
  edition: WLC
  text: יִֽהְי֗וּ כְּ/מֹ֥ץ לִ/פְנֵי ר֑וּחַ וּ/מַלְאַ֖ךְ יְהוָ֣ה דּוֹחֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/005.yaml
  text: May they be like chaff before the wind[a], with the angel of Yahweh driving them away.
translation:
  language: hi
  text: 'वे हवा[a] के सामने भूसी के समान हो जाएँ,

    और याहवे का दूत उन्हें खदेड़ता रहे।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और याहवे का दूत उन्हें खदेड़ता हुआ हो।” इब्रानी संयोजक का अर्थ साधारणतः “और” भी हो सकता है, और कृदन्त का अर्थ “खदेड़ता हुआ” या “दूर धकेलता हुआ” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יִהְיוּ
  choice: हो जाएँ
  rationale: संदर्भ में यह रूप प्रार्थनात्मक/अभिशापसूचक इच्छा व्यक्त करता है; ‘हो जाएँ’ आधुनिक हिन्दी में इसे स्वाभाविक रूप से प्रकट करता है।
- source_word: כְּמֹץ
  choice: भूसी के समान
  rationale: מֹץ खलिहान में अनाज से अलग हुई हल्की भूसी को दर्शाता है, जिसे हवा उड़ा ले जाती है; हिन्दी में यह बिंब स्पष्ट रहता है।
- source_word: לִפְנֵי רוּחַ
  choice: हवा के सामने
  rationale: यह मूल इब्रानी संरचना और हवा के आगे असहाय भूसी के चित्र को निकटता से सुरक्षित रखता है।
- source_word: וּמַלְאַךְ יְהוָה
  choice: और यहोवा का दूत
  rationale: ו को उसके सामान्य समन्वयकारी अर्थ ‘और’ में रखा गया है। מַלְאָךְ के लिए ‘दूत’ मूल के संदेशवाहक/स्वर्गदूत संबंधी अर्थ-विस्तार को अनावश्यक रूप से सीमित नहीं करता।
- source_word: דּוֹחֶה
  choice: उन्हें खदेड़ता रहे
  rationale: यह कृदन्त लगातार सक्रिय ढंग से धकेलने या दूर भगाने का भाव देता है; निहित कर्म को हिन्दी में स्पष्ट किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: व्यक्तिगत वाचा-नाम को उपाधि ‘प्रभु’ से बदलने के बजाय नाम के रूप में रखा गया है; ‘यहोवा’ सामान्य हिन्दी पाठकों में व्यापक रूप से पहचाना जाने वाला रूप है।
- issue: מַלְאַךְ יְהוָה की पहचान
  choice: यहोवा का दूत
  alternative: यहोवा का स्वर्गदूत
  rationale: ‘दूत’ מַלְאָךְ का मूल अर्थ सुरक्षित रखता है और इस व्यक्ति की प्रकृति या पहचान के विषय में पद से अधिक धर्मवैज्ञानिक निष्कर्ष नहीं जोड़ता।
- issue: וּ के संबंध का अर्थ
  choice: और
  alternative: जबकि / साथ ही
  rationale: मूल में साधारण संयोजक है; ‘और’ दोनों खंडों का संबंध खुला रखता है और किसी विशिष्ट परिस्थितिजन्य व्याख्या को आरोपित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। काव्यात्मक समानांतरता के लिए पद को दो पंक्तियों में प्रस्तुत किया गया है; ‘खदेड़ता रहे’ निरंतर और बलपूर्ण क्रिया का भाव देता है।
