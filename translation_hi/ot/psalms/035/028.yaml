  text: And my tongue will meditate on your righteousness[d][c][b][a], and on your praise all day long.
translation:
  language: hi
  text: और मेरी जीभ तेरी धार्मिकता[a] का बखान[b] करेगी; दिन भर तेरी स्तुति करेगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तेरा न्याय।” इब्रानी शब्द धार्मिकता और न्याय, दोनों का बोध करा सकता है, विशेषकर जब परमेश्वर न्यायपूर्वक किसी का पक्ष सिद्ध करता है।
    reason: lexical_alternative
  - marker: b
    text: या, “मनन करेगी” अथवा “धीमे स्वर में कहेगी।” इब्रानी क्रिया मनन करने, धीमे स्वर में बोलने या उच्चारण करने का अर्थ दे सकती है; यहाँ ‘जीभ’ कर्ता होने के कारण मुख से बखान करने का भाव प्रमुख है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְשׁוֹנִי
  choice: और मेरी जीभ
  rationale: संयोजक ו को ‘और’ से रखा गया है और ‘मेरी जीभ’ को वाणी के लिए प्रयुक्त इब्रानी लक्षणा के रूप में अक्षुण्ण रखा गया है।
- source_word: תֶּהְגֶּה
  choice: बखान करेगी
  rationale: הגה मनन करने, धीमे स्वर में बोलने या उच्चारण करने का भाव दे सकता है। यहाँ कर्ता ‘जीभ’ है और विषय परमेश्वर की धार्मिकता तथा स्तुति है, इसलिए मुख से प्रशंसा व्यक्त करने वाला ‘बखान करेगी’ प्रसंगानुकूल और स्वाभाविक है।
- source_word: צִדְקֶךָ
  choice: तेरी धार्मिकता
  rationale: צֶדֶק में धार्मिकता और न्याय, दोनों का अर्थक्षेत्र है। ‘धार्मिकता’ इसकी व्यापक नैतिक और धर्मवैचारिक अर्थवत्ता को बनाए रखती है; न्याय का भाव पादटिप्पणी में सुरक्षित है।
- source_word: כָּל הַיּוֹם
  choice: दिन भर
  rationale: यह आधुनिक हिन्दी में पूरे दिन निरंतरता का स्वाभाविक और संक्षिप्त प्रयोग है।
- source_word: תְּהִלָּתֶךָ
  choice: तेरी स्तुति
  rationale: תְּהִלָּה का सामान्य अर्थ ‘स्तुति’ है। संबंधसूचक रूप को बनाए रखने से परमेश्वर की स्तुति अथवा उसकी प्रशंसनीय महिमा—दोनों निकटवर्ती भाव बने रहते हैं।
theological_decisions:
- issue: दैवी पक्षसमर्थन के प्रसंग में צִדְקֶךָ का अनुवाद
  choice: तेरी धार्मिकता
  alternative: तेरा न्याय
  rationale: इब्रानी शब्द परमेश्वर की नैतिक धार्मिकता और उसके न्यायपूर्ण पक्षसमर्थन, दोनों को व्यक्त कर सकता है। मुख्य पाठ में व्यापक ‘धार्मिकता’ रखा गया है और संदर्भगत ‘न्याय’ को पादटिप्पणी में दिया गया है।
- issue: תֶּהְגֶּה में मनन और मुखर कथन के बीच अर्थ-संतुलन
  choice: बखान करेगी
  alternative: मनन करेगी; धीमे स्वर में कहेगी
  rationale: क्रिया अपने आप में मनन, बुदबुदाने और बोलने के बीच अर्थगत तनाव रखती है। ‘जीभ’ के कर्ता होने तथा स्तुति के प्रसंग से मुखर अभिव्यक्ति प्रमुख लगती है, पर अन्य संभावनाएँ पादटिप्पणी में सुरक्षित रखी गई हैं।
translation_notes:
  register: भाषा आधुनिक, सहज और भजन-काव्य के अनुरूप गरिमापूर्ण रखी गई है। परमेश्वर के लिए एकवचन आत्मीय संबोधन ‘तेरी’ अपनाया गया है। अर्धविराम इब्रानी पद के दो काव्यांशों को दिखाता है; दूसरे अंश में क्रिया की पुनरावृत्ति हिन्दी की स्पष्टता के लिए की गई है।
