id: PSA.35.0
reference: Psalms 35:0
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: לְ/דָוִ֨ד רִיבָ֣/ה יְ֭הוָה אֶת יְרִיבַ֑/י לְ֝חַ֗ם אֶת לֹֽחֲמָֽ/י׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/000.yaml
  text: Of David[a]. Contend, Yahweh, with those who contend with me[b]; fight against those who fight against me.
translation:
  language: hi
  text: 'दाऊद का।


    हे यहोवा[a], जो मुझसे विवाद करते हैं, उनसे तू विवाद कर[b];

    जो मुझसे लड़ते हैं, उनसे तू लड़।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में परमेश्वर का व्यक्तिगत नाम יהוה (YHWH) है। इसका प्रचलित हिन्दी रूप ‘यहोवा’ है; प्राचीन उच्चारण को प्रायः ‘याहवे’ माना जाता है।
    reason: divine_name
  - marker: b
    text: '‘विवाद कर’ के लिए प्रयुक्त इब्रानी क्रिया का कानूनी अर्थ भी हो सकता है: ‘मेरे विरोधियों के विरुद्ध मेरा मुक़दमा लड़’ या ‘मेरी पैरवी कर।’'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדָוִד
  choice: दाऊद का
  rationale: समर्पण, रचनाकारिता या संबंध व्यक्त करने वाले संक्षिप्त इब्रानी शीर्षक का सीधा और स्वाभाविक रूप; मूल की संक्षिप्तता और संभावित व्यापकता बनी रहती है।
- source_word: רִיבָה ... אֶת־יְרִיבַי
  choice: जो मुझसे विवाद करते हैं, उनसे तू विवाद कर
  rationale: एक ही इब्रानी मूल ריב की पुनरावृत्ति को हिन्दी में भी बनाए रखा गया है। ‘विवाद करना’ कानूनी मुक़दमे से लेकर व्यापक विरोध तक का अर्थ दे सकता है; कानूनी अर्थ पादटिप्पणी में दिया गया है।
- source_word: לְחַם אֶת־לֹחֲמָי
  choice: जो मुझसे लड़ते हैं, उनसे तू लड़
  rationale: संज्ञेय कृदंत और आज्ञार्थक क्रिया में एक ही मूल की प्रतिध्वनि को सरल, प्रबल हिन्दी में सुरक्षित रखा गया है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय दिव्य नाम को सामान्य हिन्दी बाइबलीय रूप ‘यहोवा’ से व्यक्त किया गया है, न कि उसे केवल उपाधि ‘प्रभु’ से बदला गया है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का निरूपण
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ यहाँ व्यक्तिगत दिव्य नाम रखता है। ‘यहोवा’ पाठक को नाम और उपाधि के बीच का अंतर दिखाता है; पादटिप्पणी उच्चारण की ऐतिहासिक अनिश्चितता बताती है।
- issue: ריב का कानूनी या व्यापक संघर्ष-संबंधी अर्थ
  choice: मुख्य पाठ में ‘विवाद कर’
  alternative: ‘मेरा मुक़दमा लड़’ या ‘मेरी पैरवी कर’
  rationale: मुख्य पाठ व्यापक अर्थ और मूल की शब्द-पुनरावृत्ति को बचाता है, जबकि पादटिप्पणी वास्तविक कानूनी संभावना को स्पष्ट करती है और उसे निर्णायक रूप से आरोपित नहीं करती।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। समान इब्रानी धातुओं की काव्यात्मक पुनरावृत्ति ‘विवाद...विवाद’ और ‘लड़ते...लड़’ में सुरक्षित है। ‘तू’ भजन की सीधी, निकट और पारंपरिक ईश्वर-संबोधन शैली को दर्शाता है; यह अनादर का सूचक नहीं है।
