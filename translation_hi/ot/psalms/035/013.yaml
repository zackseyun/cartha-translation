  text: וַ/אֲנִ֤י בַּ/חֲלוֹתָ֡/ם לְב֬וּשִׁ/י שָׂ֗ק עִנֵּ֣יתִי בַ/צּ֣וֹם נַפְשִׁ֑/י וּ֝/תְפִלָּתִ֗/י עַל חֵיקִ֥/י תָשֽׁוּב׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/013.yaml
  text: But as for me[a], when they were sick, my clothing was sackcloth; I humbled myself with fasting[c][b], and my prayer returned to my own bosom.
translation:
  language: hi
  text: परन्तु जब वे बीमार थे, तब मेरा पहनावा टाट था[a]; मैंने उपवास करके अपने आपको दीन किया[b], और मेरी प्रार्थना लौटकर मेरी ही गोद में आई[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: टाट खुरदरा शोक-वस्त्र था, जिसे दुःख, संकट या पश्चात्ताप प्रकट करने के लिए पहना जाता था।
    reason: cultural_note
  - marker: b
    text: 'शाब्दिक अर्थ: “मैंने उपवास से अपने प्राण को दीन किया।” यह उपवास द्वारा स्वयं को नम्र करने का इब्रानी मुहावरा है।'
    reason: lexical_alternative
  - marker: c
    text: इस इब्रानी मुहावरे का अर्थ यह भी हो सकता है कि उसकी प्रार्थना अनुत्तरित लौट आई, या उसका लाभ लौटकर उसी को मिला।
    reason: alternative_reading
lexical_decisions:
- source_word: בַּחֲלוֹתָם
  choice: जब वे बीमार थे
  rationale: בְּ के साथ חלה का यह रूप और बहुवचन प्रत्यय उनके बीमार होने का समय बताता है; यह आधुनिक हिन्दी में स्वाभाविक है।
- source_word: לְבוּשִׁי שָׂק
  choice: मेरा वस्त्र टाट था
  rationale: इब्रानी की क्रियारहित संरचना को बनाए रखते हुए शोक के खुरदरे वस्त्र की सांस्कृतिक छवि सुरक्षित रखी गई है।
- source_word: עִנֵּיתִי בַצּוֹם נַפְשִׁי
  choice: मैंने उपवास करके अपने प्राण को दीन किया
  rationale: शाब्दिक अभिव्यक्ति ‘मैंने उपवास से अपने प्राण को दीन किया’ आत्म-दमन अथवा आत्म-विनम्रता का भाव रखती है; ‘प्राण’ נֶפֶשׁ की व्यक्ति-संबंधी व्यापकता को बनाए रखता है।
- source_word: עַל חֵיקִי
  choice: मेरी ही गोद में
  rationale: חֵיק छाती, आँचल या गोद के क्षेत्र को दर्शाता है। ‘गोद’ हिन्दी में लौटकर स्वयं के पास आने की छवि को स्वाभाविक रूप से व्यक्त करती है।
- source_word: תָשׁוּב
  choice: लौटकर ... आई
  rationale: שׁוב का मूल अर्थ लौटना है। स्त्रीलिंग कर्ता ‘प्रार्थना’ के अनुरूप हिन्दी क्रिया रखी गई है और इब्रानी मुहावरे की अस्पष्टता नहीं सुलझाई गई।
theological_decisions:
- issue: ‘मेरी प्रार्थना मेरी गोद में लौट आई’ का अर्थ
  choice: मुख्य पाठ में इब्रानी रूपक को बनाए रखा गया है।
  alternative: मेरी प्रार्थना अनुत्तरित लौट आई; अथवा उसका लाभ मुझे ही मिला।
  rationale: इब्रानी मुहावरा वास्तव में अस्पष्ट है और यह निश्चित नहीं करता कि प्रार्थना अनुत्तरित रही या उसका फल प्रार्थी को मिला; इसलिए व्याख्यात्मक निष्कर्ष पादटिप्पणी में दिए गए हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज काव्यात्मक शैली अपनाई गई है। ‘टाट’, ‘प्राण को दीन किया’ और ‘गोद में आई’ मूल की सांस्कृतिक तथा रूपकात्मक भाषा को सुरक्षित रखते हैं; कठिन मुहावरों को पादटिप्पणियों में स्पष्ट किया गया है।
