id: PSA.35.3
reference: Psalms 35:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/הָ֘רֵ֤ק חֲנִ֣ית וּ֭/סְגֹר לִ/קְרַ֣את רֹדְפָ֑/י אֱמֹ֥ר לְ֝/נַפְשִׁ֗/י יְֽשֻׁעָתֵ֥/ךְ אָֽנִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/003.yaml
  text: Draw the spear and block the way against those who pursue me[a]; say to my soul[b], “I am your salvation.”
translation:
  language: hi
  text: भाला निकाल, और मेरा पीछा करनेवालों का रास्ता रोक दे[a]; मेरे प्राण से कह, “तेरा उद्धार मैं हूँ।”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “भाला और युद्ध-कुल्हाड़ा निकाल, और मेरा पीछा करनेवालों का सामना कर।” ऐसा अनुवाद तब सम्भव है जब וּסְגֹר को ‘रास्ता रोक’ वाली क्रिया के बजाय किसी हथियार का नाम माना जाए।
    reason: alternative_reading
  - marker: b
    text: या, “तेरा छुटकारा मैं हूँ।” इब्रानी शब्द किसी ठोस संकट से बचाए जाने के साथ-साथ व्यापक अर्थ में उद्धार भी दर्शा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָרֵק
  choice: निकाल
  rationale: हिफ़ील आज्ञार्थक रूप यहाँ हथियार को बाहर निकालने का भाव देता है; ‘निकाल’ आधुनिक हिन्दी में सीधा और स्वाभाविक है।
- source_word: חֲנִית
  choice: भाला
  rationale: यह इस सामान्य युद्धास्त्र का मानक हिन्दी नाम है।
- source_word: וּסְגֹר
  choice: रास्ता रोक दे
  rationale: क्रिया का मूल अर्थ ‘बन्द कर/रोक’ है। प्रसंग में पीछा करनेवालों के आगे मार्ग अवरुद्ध करना निहित है; इसे मुख्य पाठ में स्वाभाविक हिन्दी में स्पष्ट किया गया है, जबकि शस्त्रनाम वाली सम्भावना पादटिप्पणी में सुरक्षित है।
- source_word: לִקְרַאת
  choice: का ... रास्ता
  rationale: मूल में सामने जाकर सामना करने का भाव है; ‘रास्ता रोक दे’ शत्रुतापूर्ण मुठभेड़ और अवरोध दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: רֹדְפָי
  choice: मेरा पीछा करनेवालों
  rationale: कृदन्त और प्रथम पुरुष प्रत्यय लगातार चल रही शत्रुतापूर्ण क्रिया बताते हैं; यह पदबंध उसे स्पष्ट रखता है।
- source_word: אֱמֹר
  choice: कह
  rationale: सरल आज्ञार्थक का सीधा हिन्दी रूप।
- source_word: לְנַפְשִׁי
  choice: मेरे प्राण से
  rationale: נֶפֶשׁ व्यक्ति, जीवन अथवा भीतरी प्राण को सूचित कर सकता है। ‘मेरे प्राण से’ काव्यात्मक व्यक्तित्व और मूल रूपक को बनाए रखता है।
- source_word: יְשֻׁעָתֵךְ
  choice: तेरा उद्धार
  rationale: यह संकट से छुड़ाए जाने और व्यापक उद्धार—दोनों अर्थों को वहन कर सकता है; ‘उद्धार’ हिन्दी बाइबलीय भाषा में दोनों के लिए उपयुक्त है।
- source_word: אָֽנִי
  choice: मैं हूँ
  rationale: स्वतन्त्र सर्वनाम पर बल है; हिन्दी में विधेय वाक्य के लिए ‘हूँ’ जोड़ना स्वाभाविक है और ‘मैं’ का बल सुरक्षित रहता है।
theological_decisions:
- issue: संकट के प्रसंग में יְשׁוּעָה का अनुवाद
  choice: उद्धार
  alternative: छुटकारा
  rationale: तात्कालिक प्रसंग में शत्रुओं से बचाव अभिप्रेत है, इसलिए ‘छुटकारा’ सम्भव है; ‘उद्धार’ मूल शब्द की व्यापकता और धार्मिक-काव्यात्मक अनुगूँज को बिना किसी बाद की विशिष्ट धर्मसैद्धान्तिक व्याख्या थोपे बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और प्रार्थनात्मक-काव्यात्मक रखी गई है। ‘मेरे प्राण’ मूल की काव्यात्मक अभिव्यक्ति बचाता है; ‘पीछा करनेवालों’ सामान्य पाठक के लिए ‘सतानेवालों’ से अधिक सटीक है।
