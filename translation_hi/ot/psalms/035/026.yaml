review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the two jussive/prayer clauses, the collective force of יַחְדָּו, the sense of personal harm in רָעָתִי, and the clothing metaphor. However, ‘तिरस्कार’ primarily means contempt shown toward someone, whereas וּכְלִמָּה denotes disgrace, humiliation, or dishonor experienced by the arrogant opponents.
  naturalness: The verse is generally clear and suitably dignified. ‘अपने आप को बड़ा बनाते हैं’ is understandable but somewhat literal and awkward in modern Hindi; ‘अपने को बड़ा जताते हैं’ naturally conveys self-exaltation without restricting it to verbal boasting.
  terminology: ‘अहित,’ ‘लज्जित,’ ‘अपमानित,’ and ‘लज्जा’ are appropriate. Replacing ‘तिरस्कार’ with ‘अपमान’ better preserves the second shame-term. A lexical-alternative note is supplied for the idiom ‘अपने को बड़ा जताते हैं.’
  issues:
  - severity: medium
    issue: ‘तिरस्कार’ is not the best equivalent for וּכְלִמָּה.
    rationale: The Hebrew word refers to disgrace/humiliation rather than contempt directed at a person. ‘अपमान’ retains the intended paired shame/disgrace sense.
  - severity: low
    issue: ‘अपने आप को बड़ा बनाते हैं’ is overly calqued.
    rationale: ‘अपने को बड़ा जताते हैं’ is more idiomatic modern Hindi while retaining the image of arrogant self-exaltation against the psalmist.
  revised_text: जो मेरे अहित पर आनन्दित होते हैं, वे सब मिलकर लज्जित और अपमानित हों; जो मेरे विरुद्ध अपने को बड़ा जताते हैं[a], वे लज्जा और अपमान ओढ़ें।
