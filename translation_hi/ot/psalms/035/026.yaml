base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/026.yaml
  text: Let those who rejoice at my harm be put to shame and humiliated together[a]; let those who magnify themselves against me be clothed with shame and disgrace.
translation:
  language: hi
  text: जो मेरे अहित पर आनन्दित होते हैं, वे सब मिलकर लज्जित और अपमानित हों; जो मेरे विरुद्ध अपने को बड़ा जताते हैं[a], वे लज्जा और अपमान ओढ़ें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘जो मेरे विरुद्ध अपने को ऊँचा करते हैं’ या ‘जो मेरे विरुद्ध अपनी बड़ाई करते हैं।’ इब्रानी में शाब्दिक अर्थ है, ‘जो मेरे ऊपर/विरुद्ध अपने को बड़ा करते हैं।’
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵבֹשׁוּ וְיַחְפְּרוּ יַחְדָּו
  choice: वे सब मिलकर लज्जित और अपमानित हों
  rationale: दोनों अपूर्ण क्रियाओं का यहाँ प्रार्थनात्मक/कामनात्मक बल है। ‘लज्जित’ और ‘अपमानित’ निकटार्थी शब्दों की तीव्रता बनाए रखते हैं; ‘सब मिलकर’ יַחְדָּו का स्वाभाविक हिन्दी रूप है।
- source_word: שְׂמֵחֵי רָעָתִי
  choice: जो मेरे अहित पर आनन्दित होते हैं
  rationale: רָעָתִי यहाँ भजनकार की नैतिक बुराई नहीं, बल्कि उसका अहित, विपत्ति या हानि सूचित करता है। ‘अहित’ इस अर्थ को संक्षेप और स्पष्टता से व्यक्त करता है।
- source_word: יִלְבְּשׁוּ בֹשֶׁת וּכְלִמָּה
  choice: वे लज्जा और तिरस्कार ओढ़ लें
  rationale: ‘ओढ़ लें’ वस्त्र धारण करने के इब्रानी रूपक को स्वाभाविक हिन्दी में सुरक्षित रखता है। ‘लज्जा और तिरस्कार’ दो निकटार्थी संज्ञाओं की प्रबलता को बनाए रखते हैं।
- source_word: הַמַּגְדִּילִים עָלָי
  choice: जो मेरे विरुद्ध अपने आप को बड़ा बनाते हैं
  rationale: यह पद शाब्दिक रूप से किसी के ऊपर/विरुद्ध अपने को बड़ा करने का भाव रखता है। अनुवाद अहंकारी आत्म-बड़ाई की छवि को बनाए रखता है और उसे केवल मौखिक डींग तक सीमित नहीं करता।
