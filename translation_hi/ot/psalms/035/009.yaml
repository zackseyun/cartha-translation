review_pass:
  verdict: revise
  source_fidelity: 'The Hebrew has two closely parallel ב-prepositional phrases: ''my soul will rejoice in Yahweh'' and ''[it] will exult in his salvation/deliverance.'' The draft''s ''यहोवा में'' represents the first well, but ''उसके उद्धार पर'' shifts the second to a causal sense (''because of/on account of'') rather than retaining the parallel locative/object-of-joy construction. ''उद्धार में'' is both faithful and idiomatic in elevated Hindi.'
  naturalness: '''मेरा प्राण'' is suitable for the psalm''s dignified poetic register, and ''आनंदित होगा ... मगन होगा'' is natural enough while preserving the paired expressions of joy. The revised preposition makes the second line more idiomatic as well.'
  terminology: '''उद्धार'' appropriately preserves the semantic breadth of יְשׁוּעָה, without narrowing it to only a physical rescue. ''यहोवा'' is retained, consistently with the supplied Hindi theological decision and as a familiar Hindi rendering of the divine name.'
  issues:
  - severity: medium
    issue: The second occurrence of בְּ is rendered 'पर' in the text and its lexical-alternative footnote.
    rationale: The Hebrew deliberately parallels בַּיהוָה ('in Yahweh') with בִּישׁוּעָתוֹ ('in his salvation'). Hindi 'उद्धार में' preserves that relation; 'उद्धार पर' more readily means 'on account of the salvation' and weakens the formal parallelism.
  revised_text: तब मेरा प्राण यहोवा में आनंदित होगा[a]; वह उसके उद्धार में मगन होगा[b]।
