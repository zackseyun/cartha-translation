  text: וְ֭/נַפְשִׁ/י תָּגִ֣יל בַּ/יהוָ֑ה תָּ֝שִׂישׂ בִּ/ישׁוּעָתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/009.yaml
  text: Then my soul will rejoice in Yahweh[b][a]; it will exult in his salvation.
translation:
  language: hi
  text: तब मेरा प्राण यहोवा में आनंदित होगा[a]; वह उसके उद्धार में मगन होगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और मेरा प्राण यहोवा में आनंदित होगा।”
    reason: alternative_reading
  - marker: b
    text: या, “वह उसके छुटकारे में मगन होगा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנַפְשִׁי
  choice: तब मेरा प्राण
  rationale: נֶפֶשׁ यहाँ व्यक्ति के भीतरी और समूचे अस्तित्व को दर्शाता है; काव्यात्मक हिन्दी में ‘मेरा प्राण’ इस भाव को बनाए रखता है। प्रसंग के अपेक्षित परिणाम को स्पष्ट करने के लिए וְ को ‘तब’ किया गया है, यद्यपि ‘और’ भी सम्भव है।
- source_word: תָּגִיל
  choice: आनन्दित होगा
  rationale: גיל प्रसन्न होने या उल्लास करने का भाव देता है। ‘आनन्दित होगा’ स्वाभाविक हिन्दी है और अगली समानान्तर पंक्ति के अधिक प्रबल हर्ष से भेद बनाए रखता है।
- source_word: בַּיהוָה
  choice: यहोवा में
  rationale: בְּ आनन्द के आधार या विषय को व्यक्त करता है। יְהוָה को परमेश्वर के व्यक्तिगत वाचा-नाम के रूप में ‘यहोवा’ लिखा गया है।
- source_word: תָּשִׂישׂ
  choice: मगन होगा
  rationale: שׂושׂ/שׂישׂ उल्लासपूर्ण हर्ष व्यक्त करता है। ‘मगन होगा’ पहली पंक्ति की पुनरुक्ति किए बिना काव्यात्मक तीव्रता बनाए रखता है।
- source_word: בִּישׁוּעָתוֹ
  choice: उसके उद्धार पर
  rationale: יְשׁוּעָה का अर्थ उद्धार या छुड़ाया जाना हो सकता है। शत्रुओं से बचाव के इस प्रसंग में ‘उद्धार’ व्यापक और सहज है। हिन्दी में आनन्द के कारण को स्वाभाविक ढंग से व्यक्त करने के लिए בְּ को ‘पर’ किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का रूप
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में वाचा-नाम सीधे प्रयुक्त है। हिन्दी पाठकों के लिए प्रतिष्ठित और व्यापक रूप ‘यहोवा’ चुना गया है; ‘याहवे’ सम्भव लिप्यन्तरण है।
- issue: יְשׁוּעָה का अर्थ-क्षेत्र
  choice: उद्धार
  alternative: छुटकारा
  rationale: शब्द तत्काल संकट से छुड़ाने और व्यापक उद्धार—दोनों का अर्थ दे सकता है। ‘उद्धार’ इस अर्थगत विस्तार को बनाए रखता है, जबकि ‘छुटकारा’ प्रसंगगत विकल्प है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और काव्यात्मक हिन्दी। समानान्तर पंक्तियों में ‘आनन्दित’ और ‘मगन’ द्वारा अर्थ की निकटता तथा भाव की तीव्रता दोनों बनाए रखी गई हैं।
