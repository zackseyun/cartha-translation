  text: For without cause they hid their net's pit for me[d][c][b][a]; without cause they dug it for my life.
translation:
  language: hi
  text: क्योंकि उन्होंने अकारण मेरे लिए अपने जाल का गड्ढा छिपाया[a]; अकारण उन्होंने मेरे प्राणों के लिए गड्ढा खोदा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘उन्होंने मेरे लिए अपने जाल सहित एक गड्ढा छिपाया’ अथवा ‘उन्होंने मेरे लिए अपने जाल के वास्ते गड्ढा छिपाया।’ हिब्रू में ‘गड्ढा’ और ‘उनका जाल’ बहुत निकट जुड़े हैं, पर उनके बीच का सटीक संबंध स्पष्ट नहीं है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘मेरे प्राणों के लिए।’ यहाँ ‘प्राण’ से आशय भजनकार स्वयं अथवा उसका जीवन है; संदर्भ में गड्ढा उसके विरुद्ध रचा गया फंदा है।
    reason: lexical_alternative
