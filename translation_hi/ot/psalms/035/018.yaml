lexical_decisions:
- source_word: א֭וֹדְךָ
  choice: तेरा धन्यवाद करूँगा
  rationale: हिफ़ील रूप ידה उपासना के संदर्भ में धन्यवाद देने या स्तुति करने का अर्थ देता है। दूसरे चरण में הלל के लिए ‘स्तुति’ रखने से दोनों क्रियाओं का भेद बना रहता है।
- source_word: בְּקָהָל רָב
  choice: बड़ी सभा में
  rationale: קָהָל एकत्रित सभा या मंडली को दर्शाता है और רָב यहाँ उसके बड़े अथवा बहुसंख्यक होने का बोध देता है। ‘बड़ी सभा’ आधुनिक हिन्दी में स्वाभाविक और सीधा है।
- source_word: בְּעַם עָצוּם
  choice: विशाल जनसमूह के बीच
  rationale: עַם का मूल अर्थ ‘लोग/जन’ है और עָצוּם शक्ति अथवा बड़ी संख्या दोनों का संकेत दे सकता है। समानांतर ‘बड़ी सभा’ के कारण मुख्य पाठ में बड़ी संख्या का भाव स्वाभाविक है, जबकि पादटिप्पणी शक्ति-संबंधी संभावना सुरक्षित रखती है।
- source_word: אֲהַלְלֶךָּ
  choice: तेरी स्तुति करूँगा
  rationale: पिएल रूप הלל का सामान्य अर्थ स्तुति करना है; यह हिन्दी में सीधा, गरिमापूर्ण और उपासना-संदर्भ के अनुकूल है।
