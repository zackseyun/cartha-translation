  text: Do not let my enemies falsely rejoice over me[b][a], nor let those who hate me without cause wink the eye.
translation:
  language: hi
  text: मेरे शत्रु मुझ पर झूठे ढंग से आनन्द न मनाएँ[a]; जो अकारण मुझसे घृणा करते हैं, वे आँख से संकेत न करें[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरे झूठे शत्रु मुझ पर आनन्द न मनाएँ” अथवा “मेरे झूठ बोलनेवाले शत्रु।” इब्रानी पदबंध संक्षिप्त है; यह शत्रुओं के झूठे चरित्र को या भजनकार के विरुद्ध उनके झूठे व्यवहार को दर्शा सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “आँख न मारें।” यह इब्रानी मुहावरा दुर्भावना, उपहास या गुप्त शत्रुता प्रकट करनेवाले संकेत के लिए प्रयुक्त होता है।
    reason: cultural_note
