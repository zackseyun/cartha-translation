- source_word: לִי
  choice: मुझ पर
  rationale: शाब्दिक अर्थ ‘मेरे लिए/मुझसे सम्बन्धित’ है, पर शत्रुतापूर्ण सन्दर्भ में किसी की दुर्दशा पर आनन्द मनाने का भाव है।
- source_word: אֹיְבַי שֶׁקֶר
  choice: मेरे झूठे शत्रु
  rationale: यह संक्षिप्त इब्रानी पदबंध शत्रुओं को झूठा बता सकता है या उनके शत्रुतापूर्ण आनन्द को झूठ पर आधारित बता सकता है। मुख्य पाठ संक्षिप्त संरचना रखता है और पाद-टिप्पणी वैकल्पिक अर्थ स्पष्ट करती है।
- source_word: שֹׂנְאַי
  choice: जो ... मुझसे घृणा करते हैं
  rationale: कृदन्त निरन्तर शत्रुतापूर्ण मनोभाव रखने वालों को दर्शाता है; यह हिन्दी में स्पष्ट और स्वाभाविक अभिव्यक्ति है।
- source_word: חִנָּם
  choice: अकारण
  rationale: यहाँ शब्द बिना किसी उचित कारण के की गई घृणा या शत्रुता को व्यक्त करता है।
- source_word: יִקְרְצוּ עָיִן
  choice: आँख से इशारा न करें
  rationale: इब्रानी मुहावरा आँख द्वारा दुर्भावनापूर्ण, उपहासपूर्ण या षड्यन्त्रकारी संकेत करने को दर्शाता है। ‘आँख से इशारा’ ठोस बिम्ब को बनाए रखता है और आधुनिक हिन्दी में ‘आँख मारना’ के सम्भावित प्रणयार्थ से बचता है।
