base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/025.yaml
  text: Let them not say in their heart[a], “Aha, our desire!” Let them not say, “We have swallowed him up.”
translation:
  language: hi
  text: वे अपने मन में यह न कहें, “आहा! हमारी मनचाही बात हो गई![a]” वे यह न कहें, “हम उसे निगल गए हैं।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से “हमारा प्राण” भी संभव है; यहाँ प्रयुक्त इब्रानी शब्द का अर्थ “हमारी अभिलाषा,” “जो हम चाहते थे,” या “हमारी भूख” भी हो सकता है। इस प्रसंग में संभवतः आशय उनकी इच्छा पूरी होने से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל יֹאמְרוּ
  choice: वे ... यह न कहें
  rationale: אַל के साथ अपूर्ण क्रिया यहाँ प्रार्थनापूर्ण निषेध या नकारात्मक कामना व्यक्त करती है। हिंदी में यह रूप स्वाभाविक है और दोनों उपवाक्यों की समानांतर संरचना बनाए रखता है।
- source_word: בְלִבָּם
  choice: अपने मन में
  rationale: हिब्रू का शाब्दिक भाव ‘अपने हृदय में’ है, पर आधुनिक हिंदी में भीतर के विचार या मन-ही-मन कही बात के लिए ‘अपने मन में’ अधिक स्वाभाविक और स्पष्ट है।
- source_word: הֶאָח
  choice: आहा!
  rationale: यह विरोधियों की दुर्भावनापूर्ण विजय और संतोष की विस्मयध्वनि है। ‘आहा!’ उसके उपहासपूर्ण उल्लास को बनाए रखता है।
- source_word: נַפְשֵׁנוּ
  choice: हमारी मनचाही बात हो गई
  rationale: נֶפֶשׁ के अर्थों में प्राण, स्वयं, अभिलाषा और भूख सम्मिलित हैं। इस संक्षिप्त विजयोद्गार में यह उनकी इच्छा पूरी होने का भाव देता है; हिंदी में केवल ‘हमारी अभिलाषा’ अस्पष्ट और अस्वाभाविक होती।
- source_word: בִּלַּעֲנוּהוּ
  choice: हम उसे निगल गए हैं
  rationale: בלע का मूल चित्र निगलने या पूरी तरह ग्रस लेने का है। यह अनुवाद शत्रुओं के पूर्ण विनाश के दावे की सजीव उपमा सुरक्षित रखता है।
