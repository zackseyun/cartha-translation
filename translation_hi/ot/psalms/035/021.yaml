lexical_decisions:
- source_word: וַיַּרְחִיבוּ עָלַי פִּיהֶם
  choice: उन्होंने मेरे विरुद्ध अपना मुँह पूरा खोल दिया
  rationale: हिफ़ील रूप का शाब्दिक भाव ‘चौड़ा करना’ है। ‘मुँह पूरा खोल दिया’ विरोध और उपहास के लिए मुँह फैलाने की ठोस छवि बनाए रखता है; सामूहिक एकवचन ‘अपना मुँह’ इब्रानी अभिव्यक्ति के निकट है।
- source_word: הֶאָח הֶאָח
  choice: अहा! अहा!
  rationale: यह दुर्भावनापूर्ण विजयोल्लास या उपहास का उद्गार है। पुनरावृत्ति और ताने का स्वर दोनों सुरक्षित रखे गए हैं।
- source_word: רָאֲתָה עֵינֵינוּ
  choice: हमारी आँखों ने देख लिया
  rationale: इब्रानी में सामूहिक अभिव्यक्ति के साथ क्रिया एकवचन है। स्वाभाविक हिन्दी में ‘आँखों ने’ बहुवचन लिया गया है। ‘देख लिया’ प्रसंगगत विजयोल्लास को व्यक्त करता है, पर कोई अनिर्दिष्ट कर्म जोड़कर अर्थ को सीमित नहीं करता।
