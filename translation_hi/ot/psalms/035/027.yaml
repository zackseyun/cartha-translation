source:
  edition: WLC
  text: יָרֹ֣נּוּ וְ/יִשְׂמְחוּ֮ חֲפֵצֵ֪י צִ֫דְקִ֥/י וְ/יֹאמְר֣וּ תָ֭מִיד יִגְדַּ֣ל יְהוָ֑ה הֶ֝/חָפֵ֗ץ שְׁל֣וֹם עַבְדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/027.yaml
  text: Let those who delight in my vindication shout for joy and be glad[a]; let them say continually, “May Yahweh be magnified[b], who delights in the peace of his servant.”
translation:
  language: hi
  text: जो मेरे पक्ष में न्याय होने[a] से प्रसन्न हैं, वे जयजयकार करें और आनन्दित हों; वे सदा कहें, “याहवे की महिमा हो, जो अपने सेवक की कुशलता[b] से प्रसन्न होता है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मेरी धार्मिकता” अथवा “मेरा न्याय।” इब्रानी शब्द नैतिक धार्मिकता या न्यायिक रूप से सही ठहराए जाने को व्यक्त कर सकता है; यहाँ सम्भवतः भजनकार के पक्ष में न्याय होने का भाव है।
    reason: lexical_alternative
  - marker: b
    text: “कुशलता” का अनुवाद “शान्ति,” “कल्याण” या “समृद्धि” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יָרֹנּוּ
  choice: जयजयकार करें
  rationale: रנן आनन्द की ऊँची, सार्वजनिक पुकार को व्यक्त करता है; ‘जयजयकार करें’ हिन्दी में इसके उल्लासपूर्ण स्वर को स्वाभाविक रूप से पहुँचाता है।
- source_word: וְיִשְׂמְחוּ
  choice: और आनन्दित हों
  rationale: שמח का सामान्य अर्थ आनन्दित होना है; यह पहले क्रियापद के साथ समानान्तरता बनाए रखता है।
- source_word: חֲפֵצֵי צִדְקִי
  choice: जो मेरे न्याय-सिद्ध होने से प्रसन्न हैं
  rationale: विवाद और आरोपों के इस संदर्भ में צִדְקִי भजनकार के सही ठहराए जाने की ओर संकेत करता है; ‘न्याय-सिद्ध होना’ कानूनी भाव को स्पष्ट करता है, जबकि व्यापक विकल्प पाद-टिप्पणी में रखे गए हैं।
- source_word: וְיֹאמְרוּ תָמִיד
  choice: वे सदा कहें
  rationale: इब्रानी की इच्छासूचक शक्ति और תָמִיד के निरन्तर भाव को संक्षिप्त, सहज हिन्दी में रखा गया है।
- source_word: יִגְדַּל יְהוָה
  choice: याहवे की महिमा हो
  rationale: יִגְדַּל यहाँ स्तुति की इच्छासूचक अभिव्यक्ति है; ‘महिमा हो’ हिन्दी में स्वाभाविक है और परमेश्वर को महान ठहराने का भाव देता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: व्यक्तिगत ईश्वरीय नाम को उपाधि से प्रतिस्थापित न करके लिप्यन्तरित रूप में रखा गया है।
- source_word: הֶחָפֵץ
  choice: जो ... प्रसन्न होता है
  rationale: חפץ का कृदन्त रूप सक्रिय प्रसन्नता या रुचि व्यक्त करता है और पद के आरम्भ में आए उसी मूल के अर्थ से सम्बन्ध बनाए रखता है।
- source_word: שְׁלוֹם
  choice: कुशलता
  rationale: यहाँ שָׁלוֹם केवल संघर्ष का अभाव नहीं, बल्कि सेवक के समग्र कल्याण और भलाई को भी समेटता है; ‘कुशलता’ उस व्यापक अर्थ को स्वाभाविक हिन्दी में व्यक्त करती है।
- source_word: עַבְדּוֹ
  choice: अपने सेवक
  rationale: भजनकार और परमेश्वर के सम्बन्ध में ‘सेवक’ प्रसंगानुकूल और स्वाभाविक है; ‘अपने’ इब्रानी के तृतीय-पुरुष सम्बन्ध को हिन्दी कथन में स्पष्ट करता है।
theological_decisions:
- issue: צִדְקִי का अर्थ
  choice: मेरे न्याय-सिद्ध होने
  alternative: मेरी धार्मिकता; मेरे न्याय
  rationale: अभियोगियों के विरुद्ध अनुकूल निर्णय का न्यायिक भाव संदर्भ में प्रमुख है, पर इब्रानी शब्द की नैतिक और व्यापक न्याय-संबंधी सम्भावनाएँ पाद-टिप्पणी में सुरक्षित हैं।
- issue: ईश्वरीय नाम יְהוָה
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में आए व्यक्तिगत नाम को नाम के रूप में प्रस्तुत किया गया है, किसी उपाधि में नहीं बदला गया।
- issue: שְׁלוֹם का अर्थ-क्षेत्र
  choice: कुशलता
  alternative: शान्ति; कल्याण; समृद्धि
  rationale: सेवक के हित के संदर्भ में शब्द समग्र भलाई का संकेत दे सकता है; अनुवाद में व्यापक अर्थ चुना गया और अन्य सम्भावनाएँ पाद-टिप्पणी में दी गई हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सार्वजनिक उपासना के योग्य रूप अपनाया गया है। ‘न्याय-सिद्ध’ कुछ औपचारिक है, पर न्यायिक संदर्भ को ‘धार्मिकता’ की अपेक्षा अधिक स्पष्ट करता है। दोनों पाद-टिप्पणी चिह्न मुख्य पाठ में उपस्थित हैं।
