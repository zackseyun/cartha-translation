  choice: मानो वह मेरा मित्र, मेरा अपना भाई हो
  rationale: दोनों उपमाओं और घनिष्ठ व्यक्तिगत संबंध को स्वाभाविक हिन्दी में व्यक्त करता है। לִי का शाब्दिक अर्थ ‘मेरे लिए/मुझसे संबंधित’ है, जिसे यहाँ संबंधसूचक ‘मेरा’ से व्यक्त करना अधिक सहज है।
- source_word: הִתְהַלָּכְתִּי
  choice: मैं ऐसे चलता-फिरता था
  rationale: हित्पएल रूप लगातार या सामान्य चाल-चलन का संकेत दे सकता है। ‘चलता-फिरता था’ मूल की गतिशील छवि बनाए रखता है, यद्यपि संदर्भ में व्यवहार भी निहित है।
- source_word: כַּאֲבֶל אֵם
  choice: माँ का शोक मनानेवाले के समान
  rationale: यह पदबंध माता की मृत्यु पर शोक करनेवाले व्यक्ति की उपमा देता है। हिन्दी में संबंध स्पष्ट करने के लिए ‘माँ का शोक’ स्वाभाविक है।
- source_word: קֹדֵר
  choice: शोक से मलिन होकर
  rationale: קדר का मूल भाव अँधेरा या मलिन होना है और शोक के संदर्भ में उदास, शोकाकुल मुख-मुद्रा को दर्शाता है। यह चयन मूल बिंब और भाव दोनों को संप्रेषित करता है।
- source_word: שַׁחוֹתִי
  choice: मैं ... झुक गया
  rationale: क्रिया शारीरिक रूप से नीचे झुकने या दब जाने की मुद्रा बताती है; यहाँ यह गहरे शोक की देहगत अभिव्यक्ति है।
