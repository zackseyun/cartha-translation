  text: I walked about as though he were my friend[a], as though he were my brother; I bowed down in gloom[c][b], like one mourning for a mother.
translation:
  language: hi
  text: मैं ऐसे चलता-फिरता था, मानो वह मेरा मित्र, मेरा अपना भाई हो[a]; माँ का शोक मनानेवाले के समान, मैं शोक से मलिन होकर झुक गया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इसका अधिक शाब्दिक अनुवाद हो सकता है: “मित्र के समान, मेरे अपने भाई के समान, मैं चलता-फिरता था।” इब्रानी में निकट आत्मीयता पर बल है।'
    reason: lexical_alternative
  - marker: b
    text: “शोक से मलिन” के पीछे इब्रानी शब्द का शाब्दिक भाव “अँधेरा पड़ा हुआ” है; यह शोक के कारण उदास और मलिन दिखाई देने का बिंब है।
    reason: lexical_alternative
