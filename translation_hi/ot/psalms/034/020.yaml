  text: שֹׁמֵ֥ר כָּל עַצְמוֹתָ֑י/ו אַחַ֥ת מֵ֝/הֵ֗נָּה לֹ֣א נִשְׁבָּֽרָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/020.yaml
  text: He keeps all his bones[b][a]; not one of them is broken.
translation:
  language: hi
  text: वह उसकी सब हड्डियों की रक्षा करता है[a]; उनमें से एक भी नहीं टूटती।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘संभालकर रखता है’ अथवा ‘सुरक्षित रखता है’।
    reason: lexical_alternative
  - marker: b
    text: यीशु के क्रूस पर चढ़ाए जाने के संबंध में यह पंक्ति यूहन्ना 19:36 में उद्धृत की गई है।
    reason: cross_reference
lexical_decisions:
- source_word: שֹׁמֵר
  choice: रक्षा करता है
  rationale: שׁמר का कृदन्त यहाँ निरन्तर पहरे और संरक्षण का भाव देता है। ‘रक्षा करता है’ आधुनिक हिन्दी में स्वाभाविक है और प्रसंग के सुरक्षात्मक अर्थ को स्पष्ट रखता है।
- source_word: כָּל עַצְמוֹתָיו
  choice: उसकी सब हड्डियों
  rationale: כָּל समग्रता बताता है, עֲצָמוֹת का अर्थ ‘हड्डियाँ’ है, और पुल्लिंग एकवचन प्रत्यय को ‘उसकी’ से व्यक्त किया गया है।
- source_word: אַחַת מֵהֵנָּה
  choice: उनमें से एक भी
  rationale: स्त्रीलिंग ‘एक’ निहित ‘हड्डी’ से मेल खाता है और מִן का अंशवाचक अर्थ ‘उनमें से’ है। निषेध के साथ ‘एक भी’ सहज हिन्दी मुहावरा है।
- source_word: לֹא נִשְׁבָּרָה
  choice: नहीं टूटती
  rationale: שׁבר का निफ़अल पूर्ण रूप ‘टूटना/टूटा जाना’ बताता है। काव्यात्मक-सामान्य कथन में हिन्दी वर्तमान काल प्रसंगानुकूल है।
theological_decisions:
- issue: एकवचन सर्वनाम का संदर्भ
  choice: ‘वह/उसकी’ के रूप में एकवचन रखा गया है, जो भजन के निकटवर्ती प्रसंग में धर्मी जन की ओर संकेत करता है।
  alternative: ‘धर्मी की हड्डियाँ’ कहना, अथवा यूहन्ना 19:36 के प्रकाश में मुख्य पाठ को स्पष्ट रूप से मसीह-संबंधी बनाना।
  rationale: इब्रानी पाठ में प्रत्यय एकवचन हैं। मुख्य पाठ भजन के प्रत्यक्ष अर्थ को बनाए रखता है; बाद का मसीह-संबंधी प्रयोग पादटिप्पणी में दिया गया है, मुख्य पाठ में आरोपित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और काव्यात्मक वाक्य-विन्यास रखा गया है। ‘हड्डियों की रक्षा करता है’ मूल के ठोस शारीरिक रूपक को बनाए रखता है; उसे सामान्यीकृत करके केवल ‘जीवन बचाता है’ नहीं किया गया।
