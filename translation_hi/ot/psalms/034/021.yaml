  yaml_path: translation/ot/psalms/034/021.yaml
  text: Evil will put the wicked to death[a], and those who hate the righteous will be held guilty.
translation:
  language: hi
  text: बुराई दुष्ट को मार डालेगी[a], और जो धर्मी से घृणा करते हैं, वे दोषी ठहरेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “विपत्ति दुष्ट को मार डालेगी।” इब्रानी शब्द רָעָה का अर्थ “बुराई,” “हानि” या “विपत्ति” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּמוֹתֵת
  choice: मार डालेगी
  rationale: מות का हिफ़ील अपूर्ण रूप यहाँ स्त्रीलिंग कर्ता רָעָה के साथ कारणवाचक अर्थ देता है। ‘मार डालेगी’ इस सक्रिय, कारणवाचक बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: רָשָׁע
  choice: दुष्ट
  rationale: एकवचन विशेषण का संज्ञात्मक प्रयोग है। ‘दुष्ट’ प्रतिनिधिक एकवचन और नैतिक श्रेणी दोनों को संक्षेप में बनाए रखता है।
- source_word: רָעָה
  choice: बुराई
  rationale: यह शब्द नैतिक बुराई, हानि या विपत्ति का अर्थ दे सकता है। ‘बुराई’ इब्रानी की संक्षिप्तता और संभावित दोहरे अर्थ को सबसे अधिक खुला रखता है; ‘विपत्ति’ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: שֹׂנְאֵי
  choice: जो ... से घृणा करते हैं
  rationale: שׂנא का बहुवचन कर्तृवाचक कृदन्त है। सम्बन्धवाचक उपवाक्य आधुनिक हिन्दी में स्वाभाविक है और स्थायी प्रवृत्ति का भाव बनाए रखता है।
- source_word: צַדִּיק
  choice: धर्मी
  rationale: एकवचन विशेषण का संज्ञात्मक प्रयोग है। ‘धर्मी’ अनावश्यक रूप से लिंग निर्दिष्ट किए बिना प्रतिनिधिक व्यक्ति को व्यक्त करता है।
- source_word: יֶאְשָׁמוּ
  choice: दोषी ठहरेंगे
  rationale: אשם का काल रूप दोष या दायित्व में आने का भाव देता है। ‘दोषी ठहरेंगे’ न्यायिक उत्तरदायित्व को व्यक्त करता है, पर उससे आगे किसी विशेष दण्ड को पाठ में नहीं जोड़ता।
theological_decisions:
- issue: רָעָה को नैतिक ‘बुराई’ समझा जाए या परिस्थितिजन्य ‘विपत्ति’
  choice: बुराई
  alternative: विपत्ति
  rationale: पद में רָעָה को दुष्ट का वध करने वाली शक्ति के रूप में व्यक्त किया गया है। ‘बुराई’ मूल शब्दावली और नैतिक विडम्बना को बनाए रखता है, जबकि ‘विपत्ति’ भी प्रसंगानुकूल सम्भव अर्थ है और पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और गरिमापूर्ण रखी गई है। दोनों अर्धपंक्तियों की समानान्तरता सुरक्षित है। ‘दोषी ठहरेंगे’ सामान्य पाठक के लिए स्पष्ट है और मूल के न्यायिक अर्थ को बनाए रखता है।
