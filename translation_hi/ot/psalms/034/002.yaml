  verdict: revise
  source_fidelity: The draft correctly retains the prepositional relation in בַּיהוָה, the poetic subject נַפְשִׁי, and the sequence of the three imperfect verbs. However, ‘गर्व करेगा’ is not a natural Hindi expression for the reflexive boast/glory sense of תִּתְהַלֵּל and can suggest merely feeling proud rather than making one’s boast in Yahweh.
  naturalness: ‘याहवे में मेरा प्राण अपनी बड़ाई करेगा’ is a more idiomatic and explicit poetic Hindi rendering of the Hebrew expression. ‘दीन जन’ is concise, dignified, and natural in a psalmic register. ‘आनंदित’ uses standard contemporary Hindi orthography.
  terminology: ‘याहवे’ appropriately represents יהוה. ‘प्राण’ preserves the poetic anthropological expression without forcing a doctrinal reading. ‘दीन’ is suitably broad for עֲנָוִים; the note preserves the viable alternatives ‘नम्र,’ ‘पीड़ित,’ and ‘दबाए हुए.’
  issues:
  - severity: medium
    issue: ‘गर्व करेगा’ inadequately renders תִּתְהַלֵּל.
    rationale: In modern Hindi, ‘गर्व करना’ usually denotes possessing pride, whereas the Hitpael here means to boast or make one’s glory. ‘अपनी बड़ाई करना’ conveys the verbal, reflexive force more clearly.
  - severity: low
    issue: ‘दीन लोग’ is less compact than the psalmic register warrants.
    rationale: ‘दीन जन’ retains the collective sense of the Hebrew plural and is more natural in elevated modern Hindi.
