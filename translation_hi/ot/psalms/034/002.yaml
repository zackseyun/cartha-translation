lexical_decisions:
- source_word: בַּיהוָה
  choice: याहवे में
  rationale: בְּ को गर्व के आधार/क्षेत्र के रूप में और יהוה को उसके व्यक्तिगत वाचा-नाम ‘याहवे’ के रूप में रखा गया है।
- source_word: תִּתְהַלֵּל
  choice: गर्व करेगा
  rationale: הלל के हित्पएल रूप का अर्थ यहाँ स्वयं पर नहीं, याहवे में ‘गर्व करना’ या ‘महिमा मानना’ है; अपूर्ण क्रिया का घोषणात्मक भाव भविष्यत् रूप से व्यक्त किया गया है।
- source_word: נַפְשִׁי
  choice: मेरा प्राण
  rationale: נפשׁ यहाँ पूरे व्यक्ति/अंतरात्मा को सूचित करता है। ‘मेरा प्राण’ काव्यात्मक अभिव्यक्ति को बनाए रखता है, यद्यपि आशय ‘मैं स्वयं’ भी हो सकता है।
- source_word: יִשְׁמְעוּ
  choice: सुनेंगे
  rationale: שמע का सामान्य अर्थ ‘सुनना’ है; समानांतर अपूर्ण क्रियाओं के अनुरूप भविष्यत् रूप रखा गया है।
- source_word: עֲנָוִים
  choice: दीन
  rationale: ענוים में नम्रता और दुःख-दबाव से उत्पन्न दीनता दोनों अर्थ-छायाएँ संभव हैं। ‘दीन’ मुख्य पाठ में इस व्यापकता को अपेक्षाकृत अच्छी तरह बनाए रखता है।
- source_word: וְיִשְׂמָחוּ
  choice: और आनन्दित होंगे
  rationale: שמח का अर्थ आनन्दित होना है; וְ को ‘और’ के रूप में रखकर सुनने और आनन्दित होने का काव्यात्मक क्रम सुरक्षित रखा गया है।
