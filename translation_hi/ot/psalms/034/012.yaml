id: PSA.34.12
reference: Psalms 34:12
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: מִֽי הָ֭/אִישׁ הֶ/חָפֵ֣ץ חַיִּ֑ים אֹהֵ֥ב יָ֝מִ֗ים לִ/רְא֥וֹת טֽוֹב־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/012.yaml
  text: Who is the man who delights in life[b][a], loving days to see good?
translation:
  language: hi
  text: कौन है वह मनुष्य[a] जो जीवन की अभिलाषा रखता है, जो बहुत-से दिन चाहता है ताकि भलाई देखे?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘वह व्यक्ति’ अथवा ‘कोई भी’; इब्रानी में ‘वह मनुष्य’ प्रतिनिधिक एकवचन है।
    reason: lexical_alternative
  - marker: b
    text: ‘भलाई देखे’ का अर्थ ‘भलाई का अनुभव करे’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי הָאִישׁ
  choice: कौन है वह मनुष्य
  rationale: प्रश्नवाचक आरम्भ और इब्रानी के निश्चित, पुल्लिंग एकवचन को बनाए रखता है; प्रसंग में यह प्रतिनिधिक अर्थ रखता है।
- source_word: הֶחָפֵץ חַיִּים
  choice: जो जीवन की अभिलाषा रखता है
  rationale: חפץ इच्छा, रुचि अथवा प्रसन्नता व्यक्त कर सकता है। यहाँ ‘अभिलाषा रखता है’ जीवन पाने की प्रबल इच्छा को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אֹהֵב יָמִים
  choice: जो बहुत-से दिन चाहता है
  rationale: शाब्दिक रूप ‘दिनों से प्रेम करता है’ हिन्दी में अस्वाभाविक है। सन्दर्भ में यह बहुत दिनों तक जीने की चाह का मुहावरेदार भाव व्यक्त करता है।
- source_word: לִרְאוֹת טוֹב
  choice: ताकि भलाई देखे
  rationale: ראה के मूल बिम्ब ‘देखना’ और טוֹב के व्यापक अर्थ ‘भलाई’ को बनाए रखता है; इसे केवल समृद्धि तक सीमित नहीं करता।
theological_decisions:
- issue: प्रतिनिधिक पुल्लिंग एकवचन
  choice: वह मनुष्य
  alternative: वह व्यक्ति / कोई भी
  rationale: इब्रानी में निश्चित पुल्लिंग एकवचन है, पर ज्ञान-साहित्य के इस प्रश्न में उसका आशय सामान्य और प्रतिनिधिक है। मुख्य पाठ रूप को सुरक्षित रखता है और पादटिप्पणी उसका व्यापक आशय स्पष्ट करती है।
- issue: ‘भलाई देखना’ का अर्थ
  choice: भलाई देखे
  alternative: भलाई का अनुभव करे
  rationale: मुख्य पाठ इब्रानी के दृश्यात्मक मुहावरे को बनाए रखता है; पादटिप्पणी उसके अनुभवात्मक अर्थ की सम्भावना बताती है, बिना ‘भलाई’ को किसी संकीर्ण धार्मिक या भौतिक अर्थ में बाँधे।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। ‘अभिलाषा’ काव्यात्मक भजन-शैली के अनुकूल है, जबकि वाक्य-विन्यास सरल रखा गया है। ‘बहुत-से दिन चाहता है’ शाब्दिक ‘दिनों से प्रेम करता है’ की अपेक्षा स्वाभाविक हिन्दी में दीर्घ जीवन की चाह व्यक्त करता है।
