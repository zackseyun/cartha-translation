source:
  edition: WLC
  text: אֲבָרֲכָ֣ה אֶת יְהוָ֣ה בְּ/כָל עֵ֑ת תָּ֝מִ֗יד תְּֽהִלָּת֥/וֹ בְּ/פִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/001.yaml
  text: I will bless Yahweh at all times[a]; his praise will continually be in my mouth.
translation:
  language: hi
  text: 'मैं हर समय याहवे[a] को धन्य कहूँगा;

    उसकी स्तुति निरन्तर मेरे मुँह में रहेगी।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी: YHWH; वैकल्पिक रूप से “यहोवा”।'
    reason: इब्रानी ईश-नाम के अक्षररूप तथा एक प्रचलित वैकल्पिक हिन्दी लिप्यंतरण को स्पष्ट करता है।
lexical_decisions:
- source_word: אֲבָרֲכָה
  choice: मैं … धन्य कहूँगा
  rationale: बरख धातु का प्रथम पुरुष एकवचन रूप यहाँ संकल्प या दृढ़ निश्चय व्यक्त करता है। परमेश्वर के संबंध में ‘धन्य कहूँगा’ आधुनिक हिन्दी में ‘आशीष दूँगा’ की अपेक्षा अधिक स्वाभाविक और अर्थ-संगत है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय ईश-नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित नामरूप ‘यहोवा’ से व्यक्त किया गया है।
- source_word: בְּכָל עֵת
  choice: हर समय
  rationale: यह पदबंध समय की सर्वव्यापकता और निरन्तरता बताता है; ‘हर समय’ सहज और सटीक आधुनिक हिन्दी है।
- source_word: תָּמִיד
  choice: निरन्तर
  rationale: यह क्रियाविशेषण स्तुति की लगातार बनी रहने वाली प्रकृति पर बल देता है और पहले चरण के ‘हर समय’ के साथ काव्यात्मक समानांतरता बनाए रखता है।
- source_word: תְּהִלָּתוֹ
  choice: उसकी स्तुति
  rationale: संज्ञा תְּהִלָּה और तृतीय पुरुष पुल्लिंग एकवचन प्रत्यय का सीधा अर्थ ‘उसकी स्तुति’ है—अर्थात उसकी ओर निर्देशित या उसे विषय बनाने वाली प्रशंसा।
- source_word: בְּפִי
  choice: मेरे मुँह में
  rationale: यह चयन मूल पाठ की ठोस शारीरिक वाणी-छवि को बनाए रखता है; हिन्दी में भी यह बोलकर स्तुति करने को स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: ईश-नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल में व्यक्तिगत ईश-नाम है, इसलिए उसे ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित नहीं किया गया। हिन्दी पाठकों में व्यापक रूप से पहचाने जाने वाले लिप्यंतरण ‘यहोवा’ को मुख्य पाठ में रखा गया, जबकि वैकल्पिक विद्वत्तापूर्ण उच्चारण पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। समानांतर काव्य-रचना और मुँह में स्तुति रहने की मूल बिंबात्मकता संरक्षित है।
