  text: טַעֲמ֣וּ וּ֭/רְאוּ כִּי ט֣וֹב יְהוָ֑ה אַֽשְׁרֵ֥י הַ֝/גֶּ֗בֶר יֶחֱסֶה בּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/008.yaml
  text: Taste and see that Yahweh is good[a]; blessed is the man who takes refuge in him.
translation:
  language: hi
  text: चखो और देखो कि याहवे भला है; धन्य है वह पुरुष[a] जो उसकी शरण लेता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल इब्रानी में ‘पुरुष’ है; यहाँ पुल्लिंग एकवचन रूप प्रतिनिधिक अर्थ में याहवे की शरण लेने वाले किसी भी व्यक्ति के लिए प्रयुक्त हुआ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: טַעֲמוּ
  choice: चखो
  rationale: बहुवचन आज्ञार्थक क्रिया का ठोस, इंद्रियबोधक अर्थ सुरक्षित रहता है और ‘देखो’ के साथ काव्यात्मक युग्म बना रहता है।
- source_word: וּרְאוּ
  choice: और देखो
  rationale: मूल की दूसरी बहुवचन आज्ञा और अनुभव से पहचानने का रूपक, दोनों सहज हिंदी में बने रहते हैं।
- source_word: כִּי טוֹב
  choice: कि … भला है
  rationale: כִּי यहाँ अनुभव किए जाने वाले कथन का परिचय देता है; ‘भला’ טוֹב के नैतिक और उपकारी दोनों अर्थों को समेटता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: यह उपाधि नहीं, इब्रानी चार-अक्षरीय व्यक्तिगत नाम का हिंदी लिप्यंतरण है।
- source_word: אַשְׁרֵי
  choice: धन्य है
  rationale: यह धन्यता और वांछनीय कल्याण की उद्घोषणा है; ‘धन्य’ गरिमापूर्ण और प्रचलित हिंदी रूप है।
- source_word: הַגֶּבֶר
  choice: वह पुरुष
  rationale: मूल में निश्चित, पुल्लिंग एकवचन संज्ञा है; हिंदी में उसके रूप को रखते हुए उसके प्रतिनिधिक प्रयोग को पाद-टिप्पणी में स्पष्ट किया गया है।
- source_word: יֶחֱסֶה בּוֹ
  choice: उसकी शरण लेता है
  rationale: חסה के आश्रय और सुरक्षा खोजने के बिंब को ‘भरोसा करता है’ जैसे अधिक सामान्य अनुवाद की अपेक्षा अधिक ठीक प्रकार से सुरक्षित रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम है। ‘याहवे’ उसका प्रचलित विद्वत्तापरक लिप्यंतरण है और उसे किसी उपाधि से नहीं बदलता।
- issue: הַגֶּבֶר का प्रतिनिधिक पुल्लिंग प्रयोग
  choice: वह पुरुष
  alternative: वह व्यक्ति; जो कोई
  rationale: मुख्य पाठ मूल के पुल्लिंग एकवचन रूप को सुरक्षित रखता है, जबकि पाद-टिप्पणी स्पष्ट करती है कि कथन का आशय याहवे की शरण लेने वाले किसी भी व्यक्ति से है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘चखो और देखो’ के ठोस काव्यात्मक बिंब तथा ‘शरण लेना’ के सुरक्षात्मक रूपक को ज्यों का त्यों सुरक्षित रखा गया है।
