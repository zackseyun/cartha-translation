review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the divine name and the two parallel groups. However, ‘आत्मबल’ narrows רוּחַ (‘spirit’) to morale/inner strength, and ‘उद्धार करता है’ can carry a broader theological sense than the immediate Hebrew verb’s plain ‘saves/delivers.’
  naturalness: ‘टूटे मनवालों’ is understandable but less idiomatic in modern standard Hindi than ‘टूटे हृदय वालों.’ The revised wording is concise, poetic, and natural.
  terminology: ‘याहवे’ appropriately transliterates יהוה. ‘हृदय’ and ‘आत्मा’ preserve the Hebrew heart/spirit parallel without imposing a penitential interpretation.
  issues:
  - severity: medium
    issue: ‘आत्मबल’ for רוּחַ
    rationale: ‘आत्मबल’ specifically denotes courage or mental strength, whereas רוּחַ here denotes a person’s inner spirit. The narrower rendering reduces the source expression’s range.
  - severity: low
    issue: ‘उद्धार करता है’ for יוֹשִׁיעַ
    rationale: Though possible in biblical Hindi, ‘उद्धार’ may suggest a more developed theological abstraction. ‘बचाता है’ more directly represents the verb’s saving/delivering sense in this context.
  - severity: low
    issue: ‘टूटे मनवालों’
    rationale: It is less natural and less precise than ‘टूटे हृदय वालों’ for the Hebrew ‘broken of heart.’
  revised_text: 'याहवे टूटे हृदय वालों के निकट है,

    और जिनकी आत्मा कुचली हुई है, उन्हें बचाता है।'
