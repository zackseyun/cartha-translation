  rationale: The revision retains the Hebrew parallelism—broken heart and crushed spirit—while replacing the interpretively narrow ‘आत्मबल’ with ‘आत्मा.’ It also uses the direct, contextually fitting ‘बचाता है’ for the saving action and improves idiomatic Hindi expression.
