  text: קָר֣וֹב יְ֭הוָה לְ/נִשְׁבְּרֵי לֵ֑ב וְֽ/אֶת דַּכְּאֵי ר֥וּחַ יוֹשִֽׁיעַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/018.yaml
  text: Yahweh is near to the brokenhearted[a], and he saves those crushed in spirit.
translation:
  language: hi
  text: 'याहवे टूटे हृदय वालों के निकट है,

    और जिनकी आत्मा कुचली हुई है, उन्हें बचाता है।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קָרוֹב
  choice: निकट रहता है
  rationale: विधेय विशेषण ‘निकट’ को हिन्दी में स्वाभाविक पूर्ण वाक्य बनाने के लिए ‘रहता है’ के साथ रखा गया है; इससे स्थानिक और संबंधपरक दोनों भाव बने रहते हैं।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में आए परमेश्वर के व्यक्तिगत नाम יהוה का लिप्यंतरण किया गया है, किसी उपाधि से प्रतिस्थापित नहीं।
- source_word: לְנִשְׁבְּרֵי לֵב
  choice: टूटे मनवालों के
  rationale: शाब्दिक रूप से ‘हृदय से टूटे हुओं’ का बोध है। ‘टूटे मनवाले’ आधुनिक हिन्दी में आंतरिक पीड़ा का रूपक स्वाभाविक रूप से व्यक्त करता है।
- source_word: דַּכְּאֵי רוּחַ
  choice: जिनका आत्मबल कुचला गया है
  rationale: דכא की तीव्रता ‘कुचला गया’ से बनी रहती है। यहाँ רוּחַ व्यक्ति की भीतरी दशा या हौसले का संकेत देता है; ‘आत्मबल’ हिन्दी में इसे स्वाभाविक रूप से व्यक्त करता है, बिना इसे केवल पश्चात्ताप तक सीमित किए।
- source_word: יוֹשִׁיעַ
  choice: उद्धार करता है
  rationale: हिफ़ील रूप का अर्थ बचाना या छुड़ाना है। ‘उद्धार करता है’ तत्काल सहायता और व्यापक बाइबलीय उद्धार—दोनों से संबंध बनाए रखता है।
theological_decisions:
- issue: יהוה परमेश्वर के नाम का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: इब्रानी पाठ में व्यक्तिगत नाम स्पष्ट रूप से उपस्थित है; इसलिए नाम को लिप्यंतरित किया गया है, उपाधि से बदला नहीं गया।
- issue: דַּכְּאֵי רוּחַ का भाव
  choice: जिनका आत्मबल कुचला गया है
  alternative: दीन आत्मावाले / मन में पछतानेवाले
  rationale: शब्द आंतरिक रूप से कुचले, दबे या विनम्र हुए लोगों का वर्णन कर सकता है। इस प्रसंग में पश्चात्ताप का अर्थ अनिवार्य नहीं, इसलिए व्यापक पीड़ा और टूटन का भाव रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, काव्यात्मक और गरिमापूर्ण रूप। ‘टूटे मनवाले’ और ‘आत्मबल कुचला गया’ समानांतर आंतरिक पीड़ा को व्यक्त करते हैं; पद को अनावश्यक रूप से केवल पश्चात्ताप-संबंधी अर्थ नहीं दिया गया।
