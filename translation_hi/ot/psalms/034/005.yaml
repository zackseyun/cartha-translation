  choice: उसकी ओर
  alternative: मेरी ओर
  rationale: प्रसंग में तीसरे पुरुष का पाठ अधिक सहज है, पर पहले पुरुष का पाठ प्राचीन लिखित/पाठ-परंपरा में सुरक्षित है और वक्ता का दृष्टिकोण बदलता है; इसलिए उसे पादटिप्पणी में दिया गया है।
