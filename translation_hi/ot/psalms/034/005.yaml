- source_word: הִבִּיטוּ
  choice: उन्होंने ... देखा
  rationale: हिफ़ील रूप का अर्थ किसी की ओर देखना है। ‘उसकी ओर देखा’ सहज हिन्दी है और अनावश्यक रूप से एकटक देखने का भाव नहीं जोड़ता।
- source_word: אֵלָי/ו
  choice: उसकी ओर
  rationale: स्रोत में ‘उसकी ओर’ और ‘मेरी ओर’ की पाठ-परंपराएँ प्रतिबिंबित हैं। प्रसंग में बहुवचन कर्ता के यहोवा की ओर देखने के कारण मुख्य पाठ में ‘उसकी ओर’ रखा गया है; दूसरा पाठ पादटिप्पणी में सुरक्षित है।
- source_word: וְנָהָרוּ
  choice: दमक उठे
  rationale: यहाँ क्रिया उज्ज्वल या प्रकाशमान होने का भाव देती है। ‘दमक उठे’ परिणामसूचक काव्यात्मक अर्थ को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: וּפְנֵיהֶם
  choice: उनके चेहरे
  rationale: ठोस इब्रानी बिंब और बहुवचन को सीधे बनाए रखता है।
- source_word: אַל יֶחְפָּרוּ
  choice: लज्जित न हुए
  rationale: यहाँ אַל को निषेधात्मक परिणाम के रूप में और अपूर्ण क्रिया को समानांतर कथन के अनुरूप भूतकाल में व्यक्त किया गया है। ‘लज्जित’ मान-अपमान और शर्म, दोनों आयाम समेटता है।
theological_decisions:
