  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण काव्यात्मक शैली। ‘दमक उठे’ सामान्य पाठक के लिए स्वाभाविक है; ‘चेहरे’ मूल के ठोस बिंब को बनाए रखता है। सभी पादटिप्पणी चिह्न मुख्य पाठ में उपस्थित हैं।
