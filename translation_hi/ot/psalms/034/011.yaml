id: PSA.34.11
reference: Psalms 34:11
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: לְֽכוּ בָ֭נִים שִׁמְעוּ לִ֑/י יִֽרְאַ֥ת יְ֝הוָ֗ה אֲלַמֶּדְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/011.yaml
  text: Come[a], children, listen to me[b]; I will teach you the fear of Yahweh.
translation:
  language: hi
  text: आओ, हे बच्चो,[a] मेरी सुनो; मैं तुम्हें यहोवा का भय मानना[b] सिखाऊँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ ‘पुत्रो’ है; ज्ञान-साहित्य में यह संबोधन सामान्यतः शिष्यों या सीखने वालों के लिए भी प्रयुक्त होता है।
    reason: lexical_alternative
  - marker: b
    text: ‘यहोवा का भय’ ज्ञान-साहित्य की एक विशेष अभिव्यक्ति है, जिसमें श्रद्धापूर्ण विस्मय, आज्ञाकारिता और परमेश्वर के सामने उचित भय सम्मिलित हैं।
    reason: lexical_explanation
lexical_decisions:
- source_word: לְכוּ
  choice: आओ
  rationale: הלך का मूल अर्थ ‘जाना/चलना’ है, पर यहाँ प्रत्यक्ष संबोधन में यह बुलावे का मुहावरा है; इसलिए ‘आओ’ स्वाभाविक है।
- source_word: בָנִים
  choice: हे बच्चो
  rationale: शाब्दिक अर्थ ‘पुत्रो’ है, किंतु ज्ञान-साहित्य में यह सामान्यतः शिष्यों या सीखने वालों के संबोधन के रूप में आता है; ‘बच्चो’ शिक्षाप्रद और समावेशी भाव रखता है।
- source_word: שִׁמְעוּ לִי
  choice: मेरी सुनो
  rationale: यह वाक्यांश केवल ध्वनि सुनने नहीं, ध्यान देकर बात मानने का आग्रह व्यक्त करता है; आधुनिक हिन्दी में ‘मेरी सुनो’ इसे सहज रूप से व्यक्त करता है।
- source_word: יִרְאַת יְהוָה
  choice: यहोवा का भय मानना
  rationale: हिन्दी में ‘भय मानना’ उस ज्ञान-साहित्यिक धारणा को अधिक स्वाभाविक ढंग से व्यक्त करता है जिसमें श्रद्धापूर्ण विस्मय, आज्ञाकारिता और उचित भय सम्मिलित हैं; इसे केवल ‘श्रद्धा’ कहकर नरम नहीं किया गया।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय ईश-नाम को सामान्य हिन्दी बाइबलीय रूप ‘यहोवा’ में रखा गया है, न कि उपाधि ‘प्रभु’ से बदला गया।
- source_word: אֲלַמֶּדְכֶם
  choice: मैं तुम्हें ... सिखाऊँगा
  rationale: पिएल अपूर्ण क्रिया यहाँ वक्ता के संकल्प या आश्वासन को व्यक्त करती है; भविष्यकालीन ‘सिखाऊँगा’ इसका सीधा और स्वाभाविक हिन्दी रूप है।
theological_decisions:
- issue: ईश-नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ में वाचा का विशिष्ट ईश-नाम सीधे आया है; उसे उपाधि से बदलने के बजाय हिन्दी में प्रचलित नामरूप देकर सुरक्षित रखा गया है।
- issue: יִרְאַת יְהוָה की अर्थ-व्याप्ति
  choice: यहोवा का भय मानना
  alternative: यहोवा के प्रति श्रद्धा रखना
  rationale: ‘भय’ को बनाए रखने से मूल की धार्मिक गंभीरता और तनाव सुरक्षित रहते हैं; यह पद केवल श्रद्धा नहीं, बल्कि विस्मय, आज्ञाकारिता और परमेश्वर के सामने उचित भय भी समेटता है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। ‘हे बच्चो’ शिक्षकीय संबोधन को बनाए रखता है; ‘यहोवा का भय मानना’ हिन्दी मुहावरे के अनुरूप है और इब्रानी की धार्मिक अर्थ-व्याप्ति को संकुचित नहीं करता।
