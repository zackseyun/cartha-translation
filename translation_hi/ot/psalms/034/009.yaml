  text: יְר֣אוּ אֶת יְהוָ֣ה קְדֹשָׁ֑י/ו כִּי אֵ֥ין מַ֝חְס֗וֹר לִ/ירֵאָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/009.yaml
  text: Fear Yahweh[a], his holy ones[b], for those who fear him lack nothing.
translation:
  language: hi
  text: याहवे का भय मानो, हे उसके पवित्र लोगो[a], क्योंकि उसका भय मानने वालों को किसी बात की कमी नहीं होती[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसके संतों।”
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “उसका भय मानने वालों को कोई कमी नहीं है।”
    reason: literal_rendering
lexical_decisions:
- source_word: יְרָאוּ
  choice: भय मानो
  rationale: यह ירא का बहुवचन आज्ञार्थक रूप है। ‘भय मानो’ उपासना, श्रद्धा और परमेश्वर के प्रति उत्तरदायी भय—इन सभी भावों को समेटते हुए मूल शब्द की पुनरावृत्ति बनाए रखता है।
- source_word: אֶת־יְהוָה
  choice: याहवे का
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत वाचा-नाम יהוה है; इसलिए उसका लिप्यंतरण ‘याहवे’ किया गया है। हिंदी में ‘भय मानना’ के साथ संबंधकारक ‘का’ स्वाभाविक है।
- source_word: קְדֹשָׁיו
  choice: उसके पवित्र जनो
  rationale: यह बहुवचन विशेषण का संज्ञात्मक प्रयोग है और इसके साथ तृतीय पुरुष एकवचन संबंधसूचक प्रत्यय है। ‘पवित्र जन’ मूल अर्थ को पारदर्शी और आधुनिक हिंदी में समझने योग्य रखता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पहले आदेश का कारण प्रस्तुत करता है; ‘क्योंकि’ उस व्याख्यात्मक संबंध को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֵין מַחְסוֹר
  choice: किसी बात की कमी नहीं होती
  rationale: यह पदबंध अभाव या घटी न होने को व्यक्त करता है। चुना हुआ रूप आधुनिक हिंदी में स्वाभाविक है और कथन को अनावश्यक रूप से निरपेक्ष भौतिक समृद्धि तक सीमित नहीं करता।
- source_word: לִירֵאָיו
  choice: उसका भय मानने वालों को
  rationale: यह לְ उपसर्ग, ירא के बहुवचन कृदंत और तृतीय पुरुष एकवचन प्रत्यय का स्वाभाविक हिंदी रूप है। ‘भय मानना’ दोहराने से आरंभिक आज्ञा के साथ मूल का शब्द-संबंध सुरक्षित रहता है।
theological_decisions:
- issue: יהוה परमेश्वर के नाम का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल में चार अक्षरों वाला व्यक्तिगत वाचा-नाम सीधे आया है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और नाम को सामान्य उपाधि में नहीं बदलता।
- issue: ‘कमी नहीं होती’ के आशय की सीमा
  choice: मूल कथन को बिना अतिरिक्त व्याख्या के बनाए रखा गया
  alternative: उन्हें हर इच्छित वस्तु मिलती है
  rationale: מַחְסוֹר अभाव या आवश्यकता की कमी बताता है, पर पद स्वयं यह स्पष्ट नहीं करता कि इसका आशय प्रत्येक इच्छा की पूर्ति है। अनुवाद ने इस धार्मिक तनाव को विस्तृत या सीमित नहीं किया।
translation_notes:
  register: भाषा आधुनिक, श्रद्धापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। संबोधन के लिए ‘हे’ काव्यात्मक गरिमा और वाक्य की स्पष्टता बनाए रखता है; ‘भय मानना’ पूरे पद में एक ही हिब्रू मूल की पुनरावृत्ति सुरक्षित रखता है।
