base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/016.yaml
  text: The face of Yahweh is against those who do evil[b][a], to cut off the memory of them from the earth.
translation:
  language: hi
  text: याहवे का मुख बुराई करनेवालों के विरुद्ध है, उनकी स्मृति को पृथ्वी से मिटाने के लिए।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “देश/भूमि से उनकी स्मृति काट डाले।”
    reason: אֶרֶץ का अर्थ ‘पृथ्वी’ या ‘देश/भूमि’ हो सकता है। לְהַכְרִית का शाब्दिक अर्थ ‘काट डालना’ है; ‘मिटाना’ हिन्दी में स्मृति के साथ स्वाभाविक अभिव्यक्ति है।
lexical_decisions:
- source_word: פְּנֵי
  choice: मुख
  rationale: शाब्दिक अर्थ ‘मुख’ है। यह इब्रानी बिंब याहवे की व्यक्तिगत उपस्थिति और विरोधी रुख को व्यक्त करता है; हिन्दी में ‘मुख ... के विरुद्ध है’ काव्यात्मक और बोधगम्य है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार अक्षरों वाले परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय लिप्यंतरित किया गया है।
- source_word: בְּעֹשֵׂי רָע
  choice: बुराई करनेवालों के विरुद्ध
  rationale: संदर्भ में בְּ विरोधी अभिमुखता व्यक्त करता है। ‘बुराई करनेवाले’ कृदंत के सक्रिय भाव को स्पष्ट रखता है।
- source_word: לְהַכְרִית
  choice: मिटा दे
  rationale: हिफ़ील infinitive उद्देश्य अथवा परिणाम बताता है। स्मृति के साथ हिन्दी में ‘मिटा देना’ स्वाभाविक है और पूर्णतः समाप्त कर देने का प्रबल भाव रखता है।
- source_word: מֵאֶרֶץ
  choice: पृथ्वी पर से
  rationale: אֶרֶץ का अर्थ ‘देश/भूमि’ भी हो सकता है, पर इस ज्ञानपरक सामान्य कथन में व्यापक अर्थ ‘पृथ्वी’ उपयुक्त है; विकल्प पादटिप्पणी में सुरक्षित है।
- source_word: זִכְרָם
  choice: उनकी स्मृति
  rationale: यह संक्षिप्त और स्वाभाविक हिन्दी है तथा इब्रानी प्रत्यय सहित ‘उनका स्मरण/स्मृति’ का अर्थ ठीक से देता है।
theological_decisions:
- issue: ‘याहवे के मुख’ के मानवरूपी बिंब का अनुवाद
  choice: याहवे का मुख ... के विरुद्ध है
  alternative: याहवे की उपस्थिति बुराई करनेवालों के विरुद्ध है
  rationale: ठोस इब्रानी बिंब को बनाए रखने से याहवे का सक्रिय विरोध और पद का काव्यात्मक तनाव सुरक्षित रहता है; इसे केवल अमूर्त कथन में नहीं बदला गया।
- issue: אֶרֶץ का विस्तार
  choice: पृथ्वी
  alternative: देश/भूमि
  rationale: भजन में दुष्टों के भाग्य संबंधी सामान्य कथन व्यापक अर्थ का समर्थन करता है, फिर भी स्थानीय अर्थ की वास्तविक शाब्दिक संभावना पादटिप्पणी में दी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण काव्यात्मक स्वर रखा गया है। ‘मुख’ मूल मानवरूपी बिंब को बचाता है, जबकि ‘बुराई करनेवाले’ सामान्य पाठक के लिए स्पष्ट है।
