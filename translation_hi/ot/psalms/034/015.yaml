  text: The eyes of Yahweh are toward the righteous[a], and his ears toward their cry for help.
translation:
  language: hi
  text: याहवे की आँखें धर्मियों की ओर हैं, और उसके कान उनकी सहायता की पुकार की ओर हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֵינֵי
  choice: आँखें
  rationale: रचनात्मक बहुवचन का सीधा अनुवाद; परमेश्वर की सजग दृष्टि का मानवीय बिंब बनाए रखा गया है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार-अक्षरीय ईश्वरीय नाम का लिप्यंतरण करके व्यक्तिगत वाचा-नाम को सुरक्षित रखा गया है।
- source_word: אֶל
  choice: की ओर
  rationale: यह संबंध दिशा और ध्यान के उन्मुख होने को व्यक्त करता है तथा दोनों काव्य-पंक्तियों में स्वाभाविक है।
- source_word: צַדִּיקִים
  choice: धर्मियों
  rationale: बहुवचन विशेषण यहाँ संज्ञा के रूप में प्रयुक्त है; ‘धर्मी’ इसका प्रचलित और अर्थ-संगत हिन्दी रूप है।
- source_word: וְאָזְנָיו
  choice: और उसके कान
  rationale: तीसरे पुरुष एकवचन संबंधसूचक प्रत्यय सहित बहुवचन को सीधे रखा गया है, जिससे ‘आँखें’ के साथ काव्यात्मक समानता बनी रहती है।
- source_word: שַׁוְעָתָם
  choice: उनकी सहायता की पुकार
  rationale: यह शब्द संकट से उठने वाली सहायता की पुकार या दुहाई को दर्शाता है; अनुवाद उस आशय को स्पष्ट रखते हुए संक्षिप्त है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा अथवा ‘प्रभु’
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम है; उसे उपाधि से बदलने के बजाय लिप्यंतरित किया गया है।
- issue: परमेश्वर की दृष्टि और श्रवण के लिए मानवीय शारीरिक बिंब
  choice: ‘आँखें’ और ‘कान’ को बनाए रखना
  alternative: व्याख्यात्मक रूप, जैसे ‘याहवे धर्मियों की देखभाल करता और उनकी सुनता है’
  rationale: मूल की ठोस काव्यात्मक भाषा को सुरक्षित रखा गया है और उसके आशय को व्याख्यात्मक कथन में नहीं बदला गया।
- issue: इब्रानी में व्यक्त क्रिया का अभाव
  choice: अंत में ‘लगे रहते हैं’ की पूर्ति
  alternative: 'क्रियारहित काव्यात्मक वाक्य: ‘याहवे की आँखें धर्मियों की ओर, और उसके कान उनकी पुकार की ओर’'
  rationale: हिन्दी में वाक्य को स्वाभाविक और स्पष्ट बनाने के लिए निहित स्थायी उन्मुखता को व्यक्त किया गया है, जबकि दोनों समानांतर खंडों की संरचना बनी रहती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और काव्यात्मक रूप अपनाया गया है। ‘की ओर’ की पुनरावृत्ति इब्रानी समानांतरता को बनाए रखती है; ‘लगे रहते हैं’ सतत सजगता को स्वाभाविक हिन्दी में व्यक्त करता है।
