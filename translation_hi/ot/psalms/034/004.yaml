lexical_decisions:
- source_word: דָּרַשְׁתִּי
  choice: मैंने ... को खोजा
  rationale: यहाँ क्रिया का अर्थ प्रार्थना और भरोसे के साथ याहवे की ओर मुड़कर उन्हें खोजना है; ‘खोजा’ इस भाव को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिंदी में लिप्यंतरित किया गया है।
- source_word: וְעָנָנִי
  choice: और उसने मुझे उत्तर दिया
  rationale: प्रथम पुरुष एकवचन प्रत्यय सहित ענה का सीधा अर्थ ‘मुझे उत्तर दिया’ है; कर्ता पिछले पदबंध में आए याहवे हैं।
- source_word: מִכָּל
  choice: मेरे सभी ... से
  rationale: מן और כל का मेल उस पूरी श्रेणी से व्यापक छुटकारे का भाव देता है।
- source_word: מְגוּרוֹתַי
  choice: मेरे सभी भयों
  rationale: इस प्रसंग में शब्द निवास या परदेश-वास नहीं, बल्कि भय अथवा भय उत्पन्न करने वाली बातों को दर्शाता है। ‘भयों’ मूल के बहुवचन और अर्थगत व्यापकता को बनाए रखता है।
- source_word: הִצִּילָנִי
  choice: उसने मुझे ... छुड़ाया
  rationale: हिफ़ील रूप संकट या भय के वश से निकालने का अर्थ देता है; ‘छुड़ाया’ शारीरिक बचाव तक अर्थ को सीमित नहीं करता।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम सीधे आया है। ‘याहवे’ उसका लिप्यंतरण करता है और उसे किसी उपाधि से प्रतिस्थापित नहीं करता।
- issue: מְגוּרוֹתַי का आशय
  choice: मेरे सभी भयों
  alternative: वे सभी बातें जिनसे मैं डरता था; मेरे सभी आतंक
  rationale: मूल शब्द भावगत भय और भय के कारणों—दोनों की ओर संकेत कर सकता है। मुख्य पाठ में स्वाभाविक हिंदी रखी गई है और संभावित वस्तुगत अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक, सरल और गरिमापूर्ण हिंदी। साक्ष्यात्मक काव्य-स्वर बनाए रखने के लिए दो समांतर उपवाक्य रखे गए हैं। पादटिप्पणी-चिह्न को ‘भयों’ के बाद रखा गया है, क्योंकि उसका संबंध מְגוּרוֹתַי की अर्थगत वैकल्पिकताओं से है।
