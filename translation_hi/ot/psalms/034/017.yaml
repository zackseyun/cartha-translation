source:
  edition: WLC
  text: צָעֲק֣וּ וַ/יהוָ֣ה שָׁמֵ֑עַ וּ/מִ/כָּל צָ֝רוֹתָ֗/ם הִצִּילָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/017.yaml
  text: They cried out[a], and Yahweh heard, and delivered them from all their troubles.
translation:
  language: hi
  text: उन्होंने दुहाई दी, और याहवे[a] ने सुना; उसने उन्हें उनकी सारी मुसीबतों से छुड़ाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी: YHWH; परंपरागत रूप से इसका अनुवाद ‘प्रभु’ किया जाता है।'
    reason: ईश्वरीय नाम के पारंपरिक वैकल्पिक निरूपण की जानकारी।
lexical_decisions:
- source_word: צָעֲקוּ
  choice: उन्होंने दुहाई दी
  rationale: यह क्रिया संकट में सहायता के लिए की गई तीव्र पुकार को व्यक्त करती है। ‘दुहाई दी’ आधुनिक हिन्दी में इस भाव को स्वाभाविक और संक्षिप्त रूप से प्रकट करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम YHWH को उपाधि से बदलने के बजाय हिन्दी में निकट लिप्यंतरण के रूप में रखा गया है।
- source_word: שָׁמֵעַ
  choice: ने सुना
  rationale: रूप की दृष्टि से यह कृदन्त है, पर आसपास की पूर्ण क्रियाओं के बीच काव्यात्मक क्रम में भूतकालीन अर्थ स्वाभाविक है।
- source_word: מִכָּל צָרוֹתָם
  choice: उनकी सारी मुसीबतों से
  rationale: מן और כָּל मिलकर उनकी मुसीबतों की समग्रता से छुटकारे का भाव देते हैं; ‘सारी मुसीबतों से’ सहज आधुनिक हिन्दी है।
- source_word: הִצִּילָם
  choice: उसने उन्हें ... छुड़ाया
  rationale: हिफ़ील रूप संकट से निकालने या बचाने का अर्थ देता है। ‘छुड़ाया’ इस ठोस उद्धार-भाव को रखता है और अनावश्यक धर्मवैज्ञानिक विस्तार से बचता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु; यहोवा
  rationale: मूल पाठ में व्यक्तिगत नाम YHWH है। ‘याहवे’ उसके प्रचलित विद्वतापूर्ण उच्चारण का निकट हिन्दी रूप है; मुख्य पाठ में उपाधि ‘प्रभु’ रखने से नाम और उपाधि का भेद मिट जाता, जबकि ‘यहोवा’ बाद की मिश्रित उच्चारण-परंपरा को दर्शाता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। दो उपवाक्यों के बीच अर्धविराम सुनने और छुड़ाने की निकट संबद्ध क्रियाओं को स्पष्ट करता है। सर्वनाम ‘उन्होंने/उन्हें’ मूल के बहुवचन को बनाए रखते हैं; पहले समूह की पहचान इस पद में स्पष्ट न होने के कारण उसे नहीं जोड़ा गया।
