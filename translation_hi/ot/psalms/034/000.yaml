  yaml_path: translation/ot/psalms/034/000.yaml
  text: Of David[a], when he changed his behavior before Abimelech, and he drove him away, and he went away.
translation:
  language: hi
  text: दाऊद का[a]। जब उसने अबीमेलेक के सामने अपना व्यवहार बदला, और अबीमेलेक ने उसे निकाल दिया, तब दाऊद चला गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 1 शमूएल 21:10–15 में इस प्रसंग के राजा का नाम अकीश है। यहाँ ‘अबीमेलेक’ उसका दूसरा नाम या राजकीय पदनाम हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: לְדָוִד
  choice: दाऊद का भजन
  rationale: भजन-संग्रह के शीर्षकों में לְ के साथ दाऊद का नाम रचना, संबंध या समर्पण का व्यापक भाव रख सकता है। हिन्दी में प्रचलित और स्वाभाविक शीर्षकीय अभिव्यक्ति ‘दाऊद का भजन’ इस संबंध को व्यक्त करती है, यद्यपि ‘भजन’ शब्द मूल शीर्षक में स्पष्ट रूप से नहीं है।
- source_word: בְּשַׁנּוֹתוֹ
  choice: जब उसने ... बदल लिया
  rationale: בְּ के साथ infinitive construct यहाँ समयसूचक है; ‘जब उसने ... बदल लिया’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: טַעְמוֹ
  choice: अपना व्यवहार
  rationale: शब्द का मूल अर्थ स्वाद, विवेक या समझ से जुड़ा है, पर इस प्रसंग में बाहरी ढंग या आचरण अभिप्रेत है। ‘व्यवहार’ संदर्भगत अर्थ देता है और ‘मानसिक संतुलन’ जैसी अधिक व्याख्यात्मक भाषा से बचता है।
- source_word: לִפְנֵי אֲבִימֶלֶךְ
  choice: अबीमेलेक के सामने
  rationale: यह पूर्वसर्गीय पदबंध का सीधा, संक्षिप्त और स्वाभाविक हिन्दी रूप है।
- source_word: וַיְגָרֲשֵׁהוּ
  choice: और अबीमेलेक ने उसे निकाल दिया
  rationale: क्रिया का अर्थ निकाल देना या भगा देना है। हिब्रू के सर्वनामों को हिन्दी में यथावत रखने पर कर्ता अस्पष्ट हो सकता था, इसलिए संदर्भ के अनुसार अबीमेलेक का नाम दोहराया गया है; ‘और’ मूल कथात्मक क्रम को सुरक्षित रखता है और उद्देश्य या परिणाम का अनावश्यक भाव नहीं जोड़ता।
- source_word: וַיֵּלַךְ
  choice: तब वह चला गया
  rationale: क्रिया का सामान्य अर्थ ‘गया’ है। ‘चला गया’ निष्कासन के बाद दाऊद के प्रस्थान को स्वाभाविक हिन्दी में व्यक्त करता है; ‘तब’ घटनाक्रम स्पष्ट करता है।
- source_word: אֲבִימֶלֶךְ
  choice: अबीमेलेक
  rationale: मुख्य पाठ में हिब्रू नाम को लिप्यंतरित किया गया है; 1 शमूएल में अकीश नाम मिलने के कारण सामंजस्य स्थापित करने हेतु नाम नहीं बदला गया।
theological_decisions:
- issue: अबीमेलेक की ऐतिहासिक पहचान
  choice: मुख्य पाठ में हिब्रू के अनुसार ‘अबीमेलेक’ रखा गया है।
  alternative: इसे गत के राजा अकीश का दूसरा नाम या राजकीय पदनाम समझा जा सकता है।
  rationale: मूल भाषा की प्रधानता के अनुसार नाम को अकीश में बदलना उचित नहीं; ऐतिहासिक संबंध और संभावित व्याख्या पादटिप्पणी में दी गई है।
- issue: शीर्षक לְדָוִד का संबंध
  choice: ‘दाऊद का भजन’
  alternative: ‘दाऊद द्वारा’ या ‘दाऊद के लिए’
  rationale: हिब्रू לְ लेखकत्व, संबंध या समर्पण में से किसी एक को पूर्णतः निश्चित नहीं करता। हिन्दी की पारंपरिक शीर्षकीय अभिव्यक्ति अपनाई गई है, पर इसे लेखकत्व का कठोर सिद्धांत नहीं माना गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण शैली। सर्वनामों की संभावित अस्पष्टता दूर करने के लिए दूसरे वाक्यखंड में ‘अबीमेलेक’ दोहराया गया है।
