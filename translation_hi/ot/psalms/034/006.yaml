  yaml_path: translation/ot/psalms/034/006.yaml
  text: This poor man cried out[a], and Yahweh heard[b], and saved him from all his troubles.
translation:
  language: hi
  text: यह दीन मनुष्य[a] पुकारा, और याहवे ने सुना; उसने उसे उसके सब संकटों से बचाया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “गरीब” अथवा “पीड़ित।” इब्रानी शब्द गरीबी, पीड़ा, या नम्र दीनता का बोध करा सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “छुड़ाया” अथवा “उबार लिया।” क्रिया संकट या खतरे से रक्षा करके निकालने का अर्थ देती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶה
  choice: इस
  rationale: यह संकेतवाचक शब्द बोलने वाले के सामने उपस्थित उदाहरण की ओर ध्यान खींचता है; ‘इस ... जन ने’ हिन्दी में स्वाभाविक साक्ष्यात्मक अभिव्यक्ति है।
- source_word: עָנִי
  choice: दीन जन
  rationale: यह शब्द गरीबी, दुःख-पीड़ा और विनम्र असहायता का बोध करा सकता है। ‘दीन जन’ इन अर्थ-छायाओं को गरिमापूर्ण और प्रतिनिधिक ढंग से बनाए रखता है।
- source_word: קָרָא
  choice: पुकारा
  rationale: संकट के प्रसंग में यह साधारण बुलावे के बजाय सहायता के लिए की गई व्याकुल पुकार व्यक्त करता है।
- source_word: יהוה
  choice: याहवे
  rationale: इब्रानी पाठ में परमेश्वर का विशिष्ट वाचा-नाम है; उसे उपाधि से बदलने के बजाय नाम के रूप में लिप्यंतरित किया गया है।
- source_word: שָׁמֵעַ
  choice: सुना
  rationale: वचन में पूर्ण हुई घटनाओं का साक्ष्य दिया गया है; इसलिए भूतकाल का सरल और स्वाभाविक रूप उपयुक्त है।
- source_word: מִכָּל צָרוֹתָיו
  choice: उसके सब संकटों से
  rationale: यह पदबंध उस व्यक्ति की समस्त विपत्तियों और घोर कठिनाइयों से छुटकारे को व्यक्त करता है।
- source_word: הוֹשִׁיעוֹ
  choice: उसे ... बचाया
  rationale: हिफ़ील क्रिया संकट या खतरे से बचाने अथवा छुड़ाने का अर्थ देती है; ‘बचाया’ तत्काल उद्धार और व्यापक बाइबलीय उद्धार-शब्दावली दोनों से जुड़ता है।
theological_decisions:
- issue: יהוה परमेश्वर के विशिष्ट नाम का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में उपाधि नहीं, चार अक्षरों वाला विशिष्ट नाम है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और नाम तथा उपाधि के अंतर को सुरक्षित रखता है।
- issue: עָנִי के पुरुषवाचक एकवचन और प्रतिनिधिक अर्थ
  choice: दीन जन
  alternative: गरीब मनुष्य; पीड़ित व्यक्ति
  rationale: यह पद पहले भजनकार की व्यक्तिगत गवाही के रूप में पढ़ा जा सकता है, साथ ही किसी भी असहाय पीड़ित के प्रतिनिधिक उदाहरण के रूप में भी। ‘जन’ व्याकरणिक एकवचन और व्यापक प्रतिनिधिकता दोनों को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। अर्धविराम सुनने और बचाने की निकट सम्बद्ध पर अलग क्रियाओं को स्पष्ट करता है; सर्वनाम मूल पाठ की व्यक्तिगत गवाही को बनाए रखते हैं।
