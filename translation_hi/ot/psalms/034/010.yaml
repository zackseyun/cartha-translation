base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/010.yaml
  text: Young lions suffer want and hunger[a], but those who seek Yahweh lack no good thing.
translation:
  language: hi
  text: 'युवा सिंह अभाव में पड़ते और भूखे रहते हैं,[a]

    पर याहवे को खोजनेवालों को किसी भी अच्छी वस्तु की कमी नहीं होती।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “युवा सिंह निर्धन हो जाते और भूखे रहते हैं।” इब्रानी क्रिया अभाव में पड़ने या निर्धन हो जाने का अर्थ दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּפִירִים
  choice: जवान सिंह
  rationale: यह संज्ञा सामान्यतः युवा और बलवान सिंहों को दर्शाती है; यह चित्र उन शक्तिशाली शिकारी पशुओं का है जिनसे अभाव की अपेक्षा कम होती है।
- source_word: רָשׁוּ
  choice: घटी में पड़ते
  rationale: क्रिया अभाव में होने या निर्धन हो जाने, दोनों का बोध करा सकती है। मुख्य पाठ में स्वाभाविक काव्यात्मक हिंदी रखी गई है और वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: וְרָעֵבוּ
  choice: और भूखे रहते हैं
  rationale: यह क्रिया भूखा होने का सीधा अर्थ देती है और पहली क्रिया के साथ अभाव की तीव्रता प्रकट करती है।
- source_word: וְדֹרְשֵׁי יְהוָה
  choice: पर यहोवा की खोज करनेवालों
  rationale: कृदंत ऐसे लोगों को दर्शाता है जिनकी विशेषता यहोवा को खोजना है; यह हिंदी में स्वाभाविक और अर्थनिष्ठ है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय निज नाम को उपाधि से बदलने के बजाय हिंदी में प्रचलित नाम-रूप द्वारा व्यक्त किया गया है।
- source_word: לֹא יַחְסְרוּ
  choice: घटी नहीं होती
  rationale: अपूर्ण क्रिया यहाँ सामान्य या नीतिवचनात्मक सत्य व्यक्त करती है; वर्तमानकालीन हिंदी उसी आशय को सहज रूप में देती है।
- source_word: כָל טוֹב
  choice: किसी अच्छी वस्तु
  rationale: निषेध के साथ यह वाक्यांश ‘कोई भी अच्छी वस्तु’ का व्यापक अर्थ देता है, जिसे हिंदी में ‘किसी अच्छी वस्तु की घटी नहीं’ स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में निजी वाचा-नाम है, इसलिए ‘प्रभु’ जैसी उपाधि नहीं रखी गई। आधुनिक हिंदी बाइबल-पाठकों के लिए व्यापक रूप से पहचाने जानेवाले ‘यहोवा’ रूप को चुना गया; ‘याहवे’ अधिक प्रत्यक्ष विद्वत्तापरक लिप्यंतरण है।
- issue: अच्छी वस्तु के अभाव न होने का कथन
  choice: सामान्य नीतिवचनात्मक आश्वासन
  alternative: हर परिस्थिति में प्रत्येक मनचाही वस्तु मिलने की निरपेक्ष प्रतिज्ञा
  rationale: इब्रानी अपूर्ण क्रिया और काव्य-संदर्भ सामान्य सत्य व्यक्त करते हैं। अनुवाद मूल के व्यापक ‘अच्छे’ को बनाए रखता है, पर ‘अच्छी’ का अर्थ पाठ में मनचाही वस्तुओं तक सीमित नहीं करता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और काव्यात्मक हिंदी। ‘घटी’ भजन-साहित्य के अनुकूल संक्षिप्त शब्द है और दोनों पंक्तियों में अभाव की ध्वनि को जोड़ता है।
