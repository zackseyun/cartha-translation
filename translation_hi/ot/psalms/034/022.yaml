id: PSA.34.22
reference: Psalms 34:22
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: פּוֹדֶ֣ה יְ֭הוָה נֶ֣פֶשׁ עֲבָדָ֑י/ו וְ/לֹ֥א יֶ֝אְשְׁמ֗וּ כָּֽל הַ/חֹסִ֥ים בּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/022.yaml
  text: Yahweh redeems the life of his servants[b][a], and none of those who take refuge in him will be held guilty.
translation:
  language: hi
  text: 'याहवे अपने सेवकों के जीवन[a] को छुड़ाता है,

    और जितने उसमें शरण लेते हैं, उनमें से कोई भी दोषी नहीं ठहरेगा।[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘प्राण’। इब्रानी נֶפֶשׁ यहाँ जीवित व्यक्ति या उसके जीवन को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘दोष का भागी न होगा’ अथवा ‘दंडनीय न ठहरेगा’। इब्रानी क्रिया में दोष और न्यायिक उत्तरदायित्व का भाव है।
    reason: alternative_reading
lexical_decisions:
- source_word: פּוֹדֶה
  choice: छुड़ाता है
  rationale: פדה बचाने या छुड़ाने के अर्थ में है। ‘छुड़ाता है’ उद्धार की धारणा को स्वाभाविक हिन्दी में व्यक्त करता है, पर ऐसे मूल्य या रीति का संकेत नहीं जोड़ता जिसका इस पंक्ति में स्पष्ट उल्लेख नहीं है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम יהוה को उपाधि से बदलने के बजाय हिन्दी लिपि में लिप्यंतरित किया गया है।
- source_word: נֶפֶשׁ
  choice: जीवन
  rationale: यहाँ נֶפֶשׁ व्यक्ति के जीवित अस्तित्व या जीवन को दर्शाता है। ‘जीवन’ आधुनिक हिन्दी में स्पष्ट है और केवल देह से अलग अमूर्त आत्मा का अर्थ अनावश्यक रूप से नहीं थोपता।
- source_word: עֲבָדָיו
  choice: अपने सेवकों
  rationale: भजन के इस संदर्भ में עבד के लिए ‘सेवक’ स्वाभाविक और गरिमापूर्ण है; ‘दास’ यहाँ बंधुआ स्थिति को आवश्यकता से अधिक उभार सकता है।
- source_word: יֶאְשְׁמוּ
  choice: दोषी नहीं ठहरेगा
  rationale: אשם दोष या दंडनीय उत्तरदायित्व की न्यायिक भाषा रखता है। यह अनुवाद उस बल को बनाए रखता है, पर इसे अनिवार्य रूप से अंतिम दंडाज्ञा तक सीमित नहीं करता।
- source_word: הַחֹסִים בּוֹ
  choice: जितने उसमें शरण लेते हैं
  rationale: חסה आश्रय या सुरक्षा पाने के लिए शरण लेने का चित्र प्रस्तुत करता है। ‘शरण लेते हैं’ सामान्य ‘भरोसा करते हैं’ की तुलना में मूल बिंब को अधिक ठीक से बनाए रखता है।
theological_decisions:
- issue: उद्धार के संदर्भ में נֶפֶשׁ का अर्थ
  choice: मुख्य पाठ में ‘जीवन’
  alternative: ‘प्राण’ या ‘जीव’
  rationale: यह शब्द यहाँ पूरे जीवित व्यक्ति अथवा उसके जीवन को सूचित करता है; अनुवाद किसी तकनीकी देह-आत्मा द्वैत को नहीं थोपता।
- issue: יֶאְשְׁמוּ का न्यायिक बल
  choice: ‘दोषी नहीं ठहरेगा’
  alternative: ‘दोष का भागी न होगा’ या ‘दंडित न होगा’
  rationale: क्रिया का दोष-संबंधी न्यायिक अर्थ सुरक्षित रखा गया है, जबकि ‘दंडित’ जैसे अनुवाद से परिणाम को मूल से अधिक निश्चित या संकीर्ण नहीं बनाया गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सरल, काव्यात्मक और गरिमापूर्ण रखी गई है। समानांतर पंक्ति-विन्यास भजन की शैली को बनाए रखता है। एकवचन ‘कोई भी ... नहीं ठहरेगा’ इब्रानी के सार्वत्रिक कथन को स्वाभाविक हिन्दी में व्यक्त करता है।
