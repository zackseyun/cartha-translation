  text: मेरे साथ याहवे[a] की महिमा करो, और हम मिलकर उसके नाम को ऊँचा उठाएँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी: YHWH (יהוה); अनेक अनुवादों में परंपरागत रूप से ‘प्रभु’ दिया गया है।'
    reason: परमेश्वर के इब्रानी व्यक्तिगत नाम का स्पष्टीकरण।
lexical_decisions:
- source_word: גַּדְּלוּ
  choice: महानता का गुणगान करो
  rationale: बहुवचन आज्ञार्थक रूप यहाँ उपासना में यहोवा को महान घोषित करने और उसकी बड़ाई करने का आह्वान है। यह अभिव्यक्ति शाब्दिक आकार बढ़ाने का भ्रम पैदा किए बिना स्तुतिपरक भाव रखती है।
- source_word: לַיהוָה
  choice: यहोवा
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत नाम יהוה है; हिन्दी में प्रचलित ध्वन्यात्मक रूप ‘यहोवा’ रखा गया है और टिप्पणी में ‘याहवे’ विकल्प बताया गया है।
- source_word: אִתִּי
  choice: मेरे साथ मिलकर
  rationale: वक्ता के साथ साझा रूप से स्तुति में भाग लेने का सीधा निमंत्रण व्यक्त करता है।
- source_word: וּנְרוֹמְמָה
  choice: आओ, हम ... ऊँचा उठाएँ
  rationale: प्रथम पुरुष बहुवचन कोहोर्टेटिव का आमंत्रणात्मक और संकल्पसूचक बल स्वाभाविक हिन्दी में सुरक्षित रहता है।
- source_word: שְׁמוֹ
  choice: उसके नाम को
  rationale: ‘नाम’ को बनाए रखने से परमेश्वर की प्रकट पहचान और प्रतिष्ठा से जुड़ी मूल बाइबलीय भाषा सुरक्षित रहती है।
- source_word: יַחְדָּו
  choice: हम सब मिलकर
  rationale: संयुक्त और सामूहिक कार्य का भाव आधुनिक हिन्दी में स्पष्ट करता है।
theological_decisions:
- issue: परमेश्वर के नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल में उपाधि नहीं, चार अक्षरों वाला व्यक्तिगत नाम है। इसलिए नाम को हिन्दी के परिचित रूप ‘यहोवा’ में रखा गया है; विद्वानों में प्रचलित पुनर्निर्मित उच्चारण ‘याहवे’ टिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, सामूहिक उपासना के अनुकूल और गरिमापूर्ण रखी गई है। समानांतर इब्रानी पंक्तियों को हिन्दी में ‘गुणगान’ और ‘ऊँचा उठाएँ’ के रूप में व्यक्त किया गया है, ताकि काव्यात्मक पुनरुक्ति तथा आह्वान दोनों बने रहें।
