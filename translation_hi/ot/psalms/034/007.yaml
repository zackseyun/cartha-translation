    text: या, ‘याहवे का दूत।’ इब्रानी מַלְאָךְ का अर्थ ‘दूत’ या ‘स्वर्गदूत’ हो सकता है; यहाँ ‘स्वर्गदूत’ अर्थ अधिक सम्भावित है।
    reason: lexical_alternative
lexical_decisions:
- source_word: חֹנֶה
  choice: छावनी डालता है
  rationale: यह חנה के काल कृदन्त का शिविर लगाने वाला सक्रिय और सुरक्षात्मक बिंब बनाए रखता है। हिन्दी में वर्तमानकालीन कथन इसके निरन्तर या सामान्य कार्य को स्वाभाविक रूप से व्यक्त करता है।
- source_word: מַלְאַךְ יְהוָה
  choice: याहवे का दूत
  rationale: מַלְאָךְ का मूल अर्थ ‘दूत’ है और प्रसंग में स्वर्गदूत सम्भावित है; मुख्य पाठ में ‘दूत’ रखने से शब्द की वास्तविक अर्थगत व्यापकता बनी रहती है, जबकि पादटिप्पणी पारम्परिक ‘स्वर्गदूत’ पाठ बताती है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार-अक्षरीय दिव्य नाम को उपाधि से बदलने के बजाय उसके प्रचलित लिप्यन्तरण से व्यक्त किया गया है।
- source_word: סָבִיב
  choice: चारों ओर
  rationale: यह घेरकर उपस्थित रहने और रक्षा करने के स्थानिक बिंब को सहज आधुनिक हिन्दी में स्पष्ट करता है।
- source_word: לִירֵאָיו
  choice: उससे डरनेवालों
  rationale: यह ‘भय माननेवालों’ की अपेक्षा साधारण पाठक के लिए अधिक स्वाभाविक है और ירא की ‘डर/भय’ अर्थछाया को केवल ‘आदर’ बनाकर कमजोर नहीं करता; प्रसंग श्रद्धामय भय का संकेत देता है।
- source_word: וַיְחַלְּצֵם
  choice: और उन्हें बचाता है
  rationale: חלץ के यहाँ संकट से छुड़ाने या बचाने के अर्थ को सरल, वर्तमान हिन्दी में व्यक्त करता है और पिछले कृदन्त के सामान्य वर्तमान भाव से मेल खाता है।
theological_decisions:
- issue: מַלְאַךְ יְהוָה की पहचान और स्वरूप
  choice: ‘याहवे का दूत’ कहा गया है; उसकी पहचान को और निश्चित नहीं किया गया।
  alternative: ‘याहवे का स्वर्गदूत’ अथवा इसे स्पष्ट रूप से ईश्वरीय/मसीही प्रकट रूप मानना।
  rationale: हिब्रू מַלְאָךְ ‘दूत’ या ‘स्वर्गदूत’ हो सकता है। पद अलौकिक दूत का संकेत दे सकता है, पर उसकी सटीक पहचान नहीं बताता; इसलिए अनुवाद उस धर्मवैचारिक तनाव को खुला रखता है।
- issue: לִירֵאָיו में भय और श्रद्धा का सम्बन्ध
  choice: ‘उससे डरनेवालों’ द्वारा भय की स्पष्ट भाषा रखी गई।
  alternative: ‘उसका आदर करनेवालों’ या ‘उसके श्रद्धालुओं’।
  rationale: केवल ‘आदर’ कहना मूल के भय-तत्व को कम कर देता, जबकि केवल आतंक का भाव भी प्रसंग से अधिक होता। चुनी हुई सहज अभिव्यक्ति बाइबिलीय सन्दर्भ में श्रद्धामय भय के लिए खुली रहती है।
