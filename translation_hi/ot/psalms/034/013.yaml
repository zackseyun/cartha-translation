  yaml_path: translation/ot/psalms/034/013.yaml
  text: Guard your tongue from evil[a], and your lips from speaking deceit.
translation:
  language: hi
  text: अपनी जीभ को बुराई से और अपने होंठों को छल की बातें कहने से रोक।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נְצֹר
  choice: रोक
  rationale: आज्ञार्थक क्रिया का मूल भाव पहरा देने या बचाए रखने का है; वाणी के नैतिक संयम के संदर्भ में हिंदी में ‘रोक’ स्वाभाविक और स्पष्ट है।
- source_word: לְשׁוֹנְךָ
  choice: अपनी जीभ को
  rationale: ‘जीभ’ का शाब्दिक बिंब रखा गया है, जो हिंदी में भी वाणी के लिए सहज रूपक है।
- source_word: מֵרָע
  choice: बुराई से
  rationale: רַע यहाँ नैतिक रूप से बुरी वाणी को सूचित करता है; ‘बुराई’ इस नैतिक बल को बनाए रखता है।
- source_word: וּשְׂפָתֶיךָ
  choice: अपने होंठों को
  rationale: ‘होंठ’ का ठोस काव्यात्मक बिंब ‘जीभ’ के समानांतर सुरक्षित रखा गया है।
- source_word: מִדַּבֵּר
  choice: बातें कहने से
  rationale: हिंदी में ‘छल की बातें कहने’ का प्रयोग स्वाभाविक है और बोलने की क्रिया को स्पष्ट व्यक्त करता है।
- source_word: מִרְמָה
  choice: छल
  rationale: מִרְמָה धोखे या कपट को दर्शाता है; ‘छल’ संक्षिप्त, आधुनिक और इस वाणी-संबंधी संदर्भ में उपयुक्त है।
