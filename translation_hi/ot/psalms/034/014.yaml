  text: Turn away from evil and do good[a]; seek peace and pursue it.
translation:
  language: hi
  text: बुराई से दूर हो और भलाई कर; शांति की खोज कर और उसके लिए प्रयत्न कर।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: סוּר
  choice: दूर हो
  rationale: आज्ञार्थक क्रिया नैतिक बुराई से सक्रिय रूप से हटने का भाव देती है; ‘दूर हो’ आधुनिक हिन्दी में स्वाभाविक और संक्षिप्त है।
- source_word: מֵרָע
  choice: बुराई से
  rationale: ज्ञान-साहित्य के इस नैतिक सन्दर्भ में רַע का अर्थ ‘बुराई’ है, और מִן अलगाव का भाव देता है।
- source_word: וַעֲשֵׂה טוֹב
  choice: और भलाई कर
  rationale: यह पहली आज्ञा के विपरीत रखी गई सीधी सकारात्मक आज्ञा है; ‘भलाई कर’ हिब्रू की संक्षिप्तता बनाए रखता है।
- source_word: בַּקֵּשׁ
  choice: खोज
  rationale: पिएल आज्ञार्थक रूप मन लगाकर तलाशने का भाव रखता है; ‘खोज’ सरल और सक्रिय अभिव्यक्ति है।
- source_word: שָׁלוֹם
  choice: शान्ति
  rationale: मुख्य अर्थ यहाँ ‘शान्ति’ है, पर हिब्रू शब्द में सम्पूर्णता और कुशल-मंगल का व्यापक भाव भी शामिल हो सकता है; इसे पादटिप्पणी में रखा गया है।
- source_word: וְרָדְפֵהוּ
  choice: और उसके पीछे लगा रह
  rationale: רדף लगातार और सक्रिय पीछा करने का सजीव भाव देता है। पुल्लिंग एकवचन प्रत्यय का संकेत ‘शान्ति’ की ओर है; हिन्दी में यह वाक्यांश उस निरन्तर प्रयत्न को स्वाभाविक ढंग से व्यक्त करता है।
