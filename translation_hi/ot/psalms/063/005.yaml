  yaml_path: translation/ot/psalms/063/005.yaml
  text: My soul is satisfied as with fat and richness[b][a], and my mouth praises you with lips of joyful songs.
translation:
  language: hi
  text: मेरा प्राण मानो चर्बी और भरपूर भोजन से तृप्त होगा[a], और आनन्द के जयघोष से भरे होंठों के साथ मेरा मुँह तेरी स्तुति करेगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘चर्बी और भरपूर भोजन’ का शाब्दिक भाव ‘चर्बी और चिकनाई/समृद्धि’ भी हो सकता है। ‘तृप्त होगा’ का अनुवाद ‘तृप्त होता है’ भी सम्भव है।
    reason: lexical_and_aspectual_alternative
  - marker: b
    text: 'शाब्दिक रूप से: ‘आनन्द के जयघोषों के होंठ’। ‘स्तुति करेगा’ का अनुवाद ‘स्तुति करता है’ भी सम्भव है।'
    reason: lexical_and_aspectual_alternative
lexical_decisions:
- source_word: כְּמוֹ
  choice: मानो … से
  rationale: यह तुलना सूचित करता है। हिन्दी में भोजन से तृप्त होने की उपमा के साथ ‘मानो … से’ स्वाभाविक है।
- source_word: חֵלֶב וָדֶשֶׁן
  choice: चर्बी और भरपूर भोजन
  rationale: חֵלֶב का ठोस अर्थ ‘चर्बी’ सुरक्षित रखा गया है, जबकि דֶשֶׁן को प्रसंगानुसार समृद्ध और प्रचुर भोजन के रूप में व्यक्त किया गया है; इससे इब्रानी की समृद्ध भोज्य-वस्तुओं की छवि सहज हिन्दी में आती है।
- source_word: תִּשְׂבַּע
  choice: तृप्त होगा
  rationale: काव्यात्मक अपूर्ण रूप भविष्य, जारी अथवा आदतन भाव दे सकता है। यहाँ आगे की क्रिया के रूप में भविष्यकाल स्वाभाविक है, पर वर्तमान अर्थ की सम्भावना पादटिप्पणी में रखी गई है।
- source_word: נַפְשִׁי
  choice: मेरा प्राण
  rationale: נֶפֶשׁ यहाँ व्यक्ति के भीतरी स्व और उसकी गहरी लालसा को दर्शाता है। ‘मेरा प्राण’ भजन की काव्यात्मक गरिमा और व्यापक अर्थ दोनों बनाए रखता है।
- source_word: שִׂפְתֵי רְנָנוֹת
  choice: आनन्द के जयघोष से भरे होंठों के साथ
  rationale: मूल पदबंध शाब्दिक रूप से ‘जयघोषों/आनन्द-पुकारों के होंठ’ है। यह चयन होंठों की ठोस छवि और मुखर आनन्द दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: יְהַלֶּל פִּי
  choice: मेरा मुँह तेरी स्तुति करेगा
  rationale: ‘मेरा मुँह’ क्रिया का कर्ता है। ‘तेरी’ मूल में व्यक्त नहीं, पर पूरे भजन के परमेश्वर से सीधे सम्बोधन के कारण स्पष्ट रूप से निहित है और हिन्दी वाक्य को पूर्ण बनाता है।
theological_decisions:
- issue: स्तुति के निहित कर्म को व्यक्त करना
  choice: ‘तेरी स्तुति’
  alternative: ‘मेरा मुँह स्तुति करेगा’
  rationale: इब्रानी में कर्म स्पष्ट नहीं है, किन्तु भजन में परमेश्वर से प्रत्यक्ष सम्बोधन हो रहा है। ‘तेरी’ जोड़ना प्रसंगगत निहितार्थ को व्यक्त करता है, कोई नया धर्मवैज्ञानिक दावा नहीं जोड़ता।
- issue: काव्यात्मक अपूर्ण क्रियाओं का काल
  choice: भविष्यकाल—‘तृप्त होगा’, ‘स्तुति करेगा’
  alternative: वर्तमान अथवा आदतन भाव—‘तृप्त होता है’, ‘स्तुति करता है’
  rationale: दोनों इब्रानी क्रियाएँ अपूर्ण रूप में हैं और काव्य में भविष्य, जारी या आदतन भाव ग्रहण कर सकती हैं। मुख्य पाठ में दोनों समानान्तर क्रियाओं को भविष्यकाल में रखा गया है और वास्तविक पक्षगत अस्पष्टता पादटिप्पणी में बताई गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमामय और सामान्य पाठक के लिए सुबोध रखी गई है। ‘प्राण’, ‘तृप्त’ और ‘स्तुति’ भजन-काव्य के अनुकूल प्रचलित धार्मिक-काव्यात्मक शब्द हैं; ‘जयघोष’ רְנָנוֹת की मुखर प्रसन्नता को व्यक्त करता है।
