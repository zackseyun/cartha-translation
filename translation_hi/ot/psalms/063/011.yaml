source:
  edition: WLC
  text: וְ/הַ/מֶּלֶךְ֮ יִשְׂמַ֪ח בֵּ/אלֹ֫הִ֥ים יִ֭תְהַלֵּל כָּל הַ/נִּשְׁבָּ֣ע בּ֑/וֹ כִּ֥י יִ֝סָּכֵ֗ר פִּ֣י דֽוֹבְרֵי שָֽׁקֶר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/063/011.yaml
  text: But the king will rejoice in God[a]; everyone who swears by him will boast[c][b], for the mouths of those who speak lies will be shut.
translation:
  language: hi
  text: 'लेकिन राजा परमेश्वर में आनन्दित होगा;

    उसकी[a] शपथ खानेवाला हर व्यक्ति बड़ाई करेगा[b],

    क्योंकि झूठ बोलनेवालों का मुँह बंद हो जाएगा।[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘उसकी’ का सबसे स्वाभाविक संदर्भ परमेश्वर है; व्याकरण की दृष्टि से इसे राजा के संदर्भ में भी समझा जा सकता है।
    reason: सर्वनाम के संदर्भ की वास्तविक सम्भावित अस्पष्टता को सुरक्षित रखना।
  - marker: b
    text: या, ‘गौरव करेगा’ अथवा ‘गर्व करेगा।’ इब्रानी क्रिया में बड़ाई करने और गौरव अनुभव करने—दोनों का भाव हो सकता है।
    reason: इब्रानी क्रिया के अर्थ-क्षेत्र को दिखाना, बिना उसे अनिवार्य रूप से नकारात्मक घमण्ड मानने के।
  - marker: c
    text: शाब्दिक रूप से, ‘झूठ बोलनेवालों का मुँह बंद हो जाएगा।’ यहाँ ‘मुँह’ एकवचन में सामूहिक अर्थ रखता है।
    reason: मूल इब्रानी की एकवचन सामूहिक अभिव्यक्ति और निष्क्रिय परिणाम को स्पष्ट करना।
lexical_decisions:
- source_word: וְהַמֶּלֶךְ
  choice: लेकिन राजा
  rationale: वाव यहाँ पिछले पद में बताए गए दुष्टों के विनाश के विपरीत राजा के परिणाम को सामने लाता है; इसलिए आधुनिक हिन्दी में ‘लेकिन’ प्रसंगगत विरोध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: יִשְׂמַח בֵּאלֹהִים
  choice: परमेश्वर में आनन्दित होगा
  rationale: क्रिया שמח आनन्दित होने को और ב उसके आधार अथवा विषय को व्यक्त करता है। ‘परमेश्वर में आनन्दित होगा’ अर्थ और प्रचलित बाइबिलीय अभिव्यक्ति दोनों को बनाए रखता है।
- source_word: כָּל הַנִּשְׁבָּע בּוֹ
  choice: उसकी शपथ खानेवाला हर व्यक्ति
  rationale: सहभागी रूप और כָּל का वितरक भाव ‘हर व्यक्ति’ से स्पष्ट होता है। हिन्दी में ‘किसी की शपथ खाना’ उस व्यक्ति को शपथ में साक्षी मानकर पुकारने की स्वाभाविक अभिव्यक्ति है।
- source_word: יִתְהַלֵּל
  choice: बड़ाई करेगा
  rationale: הלל का हित्पएल रूप यहाँ गर्व करने, गौरव करने या उल्लसित होकर बड़ाई करने का भाव रखता है। ‘बड़ाई करेगा’ उस व्यापक अर्थ को बनाए रखता है और ‘घमण्ड करेगा’ की अनिवार्य नकारात्मक छाया से बचता है।
- source_word: יִסָּכֵר פִּי דֹבְרֵי שָׁקֶר
  choice: झूठ बोलनेवालों का मुँह बन्द कर दिया जाएगा
  rationale: निफ़अल रूप निष्क्रिय परिणाम व्यक्त करता है। इब्रानी का एकवचन ‘मुँह’ सामूहिक अर्थ में है और हिन्दी में भी यह मुहावरा स्वाभाविक है; ‘झूठ बोलनेवाले’ मूल के क्रियात्मक वर्णन को बनाए रखता है।
theological_decisions:
- issue: ‘राजा’ की पहचान
  choice: केवल ‘राजा’ रखा गया है
  alternative: इसे स्पष्ट रूप से दाऊद या मसीही राजा कहना
  rationale: पद स्वयं राजा की इससे अधिक पहचान नहीं कराता। अनुवाद में किसी विशिष्ट ऐतिहासिक या मसीही व्याख्या को जोड़ना मूल पाठ से आगे जाना होगा।
- issue: בּוֹ में सर्वनाम का संदर्भ
  choice: ‘उसकी’ को मुख्यतः परमेश्वर के संदर्भ में समझा गया है
  alternative: इसे राजा के संदर्भ में समझना
  rationale: निकटतम स्पष्ट पूर्वपद ‘परमेश्वर’ है और परमेश्वर की शपथ खाना बाइबिल में स्थापित अभिव्यक्ति है। फिर भी पुल्लिंग सर्वनाम के कारण राजा को व्याकरणतः पूरी तरह असम्भव नहीं माना गया, इसलिए टिप्पणी में अस्पष्टता बताई गई है।
- issue: יִתְהַלֵּל का मूल्यांकन
  choice: ‘बड़ाई करेगा’
  alternative: ‘घमण्ड करेगा’ या ‘गौरव करेगा’
  rationale: इस प्रसंग में क्रिया आवश्यक रूप से पापपूर्ण अहंकार नहीं दर्शाती। ‘घमण्ड’ अनावश्यक नकारात्मक निर्णय जोड़ सकता है, जबकि ‘गौरव करेगा’ आधुनिक हिन्दी में कम स्वाभाविक है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘परमेश्वर,’ ‘आनन्दित,’ और ‘शपथ खाना’ जैसे परिचित धार्मिक शब्द स्वाभाविक हिन्दी वाक्य-विन्यास में प्रयुक्त हैं। काव्यात्मक समानता और अंतिम कारणसूचक खंड को अर्धविराम तथा पंक्ति-विभाजन से उभारा गया है।
