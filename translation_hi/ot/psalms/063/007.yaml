source:
  edition: WLC
  text: כִּֽי הָיִ֣יתָ עֶזְרָ֣תָ/ה לִּ֑/י וּ/בְ/צֵ֖ל כְּנָפֶ֣י/ךָ אֲרַנֵּֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/063/007.yaml
  text: For you have been my help[a], and in the shadow of your wings I sing for joy.
translation:
  language: hi
  text: क्योंकि आप मेरे सहायक रहे हैं, और आपके पंखों की छाया में मैं आनन्द से गाता हूँ।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘मैं आनन्द से पुकार उठता हूँ।’ इब्रानी क्रिया आनन्द के गूँजते जयघोष के साथ-साथ आनन्दपूर्ण गायन भी व्यक्त कर सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह आसपास के सन्दर्भ में भजनकार की प्रतिक्रिया का कारण बताता है; ‘क्योंकि’ हिन्दी में कारण-संबंध को स्वाभाविक रूप से स्पष्ट रखता है।
- source_word: הָיִיתָ
  choice: रहे हैं
  rationale: क़ातल रूप परमेश्वर की पहले से प्रमाणित सहायता और उसकी वर्तमान प्रासंगिकता व्यक्त करता है; ‘रहे हैं’ इस निरन्तर महत्त्व को सहज हिन्दी में पहुँचाता है।
- source_word: עֶזְרָתָה לִּי
  choice: मेरे सहायक
  rationale: वाक्यांश व्यक्तिगत लाभ के लिए मिली सहायता व्यक्त करता है। ‘मेरे सहायक’ परमेश्वर को सहायता के स्रोत के रूप में स्वाभाविक और संबंधपरक ढंग से प्रस्तुत करता है।
- source_word: וּבְצֵל
  choice: और ... की छाया में
  rationale: בְ का स्थानवाचक अर्थ ‘में’ से व्यक्त होता है और ‘छाया’ सुरक्षा की ठोस काव्यात्मक छवि को बनाए रखती है।
- source_word: כְּנָפֶיךָ
  choice: आपके पंखों
  rationale: बहुवचन रूप और द्वितीय पुरुष एकवचन प्रत्यय को सुरक्षित रखते हुए यह परमेश्वर के पंखों की परिचित सुरक्षात्मक उपमा को अक्षुण्ण रखता है।
- source_word: אֲרַנֵּן
  choice: मैं आनन्द से गाता हूँ
  rationale: रנן का पिएल रूप उल्लासपूर्ण गीत अथवा गूँजती हर्षध्वनि दोनों व्यक्त कर सकता है। मुख्य पाठ में ‘आनन्द से गाता हूँ’ स्वरयुक्त आनन्द को सहज हिन्दी में रखता है, जबकि विकल्प पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: ईश्वरीय सुरक्षा की उपमा
  choice: ‘आपके पंखों की छाया में’ की ठोस उपमा को ज्यों का त्यों बनाए रखना
  alternative: ‘आपकी शरण में’ या ‘आपकी सुरक्षा में’ जैसा व्याख्यात्मक अनुवाद
  rationale: मूल पद परमेश्वर के संरक्षण के लिए सजीव काव्यात्मक बिम्ब का प्रयोग करता है। इसे बनाए रखने से भजन की साहित्यिक और धर्मवैचारिक बनावट सुरक्षित रहती है और किसी संकीर्ण व्याख्या को पाठ में नहीं जोड़ा जाता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और काव्यात्मक रूप। परमेश्वर के लिए आदरसूचक ‘आप’ रखा गया है। मूल की पंखों और छाया वाली उपमा को सरल किए बिना सुरक्षित रखा गया है।
