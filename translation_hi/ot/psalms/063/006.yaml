  text: אִם זְכַרְתִּ֥י/ךָ עַל יְצוּעָ֑/י בְּ֝/אַשְׁמֻר֗וֹת אֶהְגֶּה בָּֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/063/006.yaml
  text: When I remember you on my bed, I meditate on you in the night watches.
translation:
  language: hi
  text: जब मैं अपने बिछौने पर तुझे याद करता हूँ, तब रात के पहरों में तुझ पर मनन करता हूँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִם
  choice: जब
  rationale: यहाँ אִם स्मरण की बार-बार होने वाली परिस्थिति बताता है; संदर्भ में स्वाभाविक हिन्दी ‘जब’ है, न कि अनिश्चित शर्तसूचक ‘यदि’.
- source_word: יְצוּעָי
  choice: अपने बिछौने पर
  rationale: יָצוּעַ लेटने के स्थान या बिछौने को दर्शाता है; ‘बिछौना’ काव्यात्मक गरिमा रखते हुए आधुनिक पाठक के लिए स्पष्ट है.
- source_word: בְּאַשְׁמֻרוֹת
  choice: रात के पहरों में
  rationale: אַשְׁמֻרוֹת रात की प्रहरी-अवधियों को सूचित करता है; हिन्दी में ‘रात के पहर’ इसका स्वाभाविक और पारंपरिक समतुल्य है.
- source_word: אֶהְגֶּה
  choice: मनन करता हूँ
  rationale: הגה यहाँ शांत, निरंतर चिंतन या ध्यान करने का भाव देता है; ‘मनन’ इस अर्थ को बिना किसी विशिष्ट साधना-पद्धति का संकेत दिए व्यक्त करता है.
theological_decisions:
- issue: परमेश्वर के लिए द्वितीय पुरुष एकवचन संबोधन
  choice: तुझे / तुझ पर
  alternative: आपको / आप पर
  rationale: इब्रानी में एकवचन निकट संबोधन है और भजन की आत्मीय, काव्यात्मक वाणी के अनुरूप हिन्दी बाइबलीय शैली में ‘तू’ रूप रखा गया है; यह अनादर नहीं, घनिष्ठ भक्ति व्यक्त करता है.
- issue: אִם का शर्तसूचक या कालसूचक अर्थ
  choice: जब
  alternative: यदि
  rationale: पंक्ति रात में होने वाले स्मरण और मनन का वर्णन करती है; यहाँ कालसूचक अर्थ संदर्भ और इब्रानी प्रयोग के अधिक अनुकूल है.
translation_notes:
  register: भाषा आधुनिक, सहज और भक्तिपूर्ण रखी गई है। ‘बिछौना’, ‘पहर’ और ‘मनन’ काव्यात्मक गरिमा बनाए रखते हैं, फिर भी सामान्य हिन्दी पाठक के लिए समझने योग्य हैं।
