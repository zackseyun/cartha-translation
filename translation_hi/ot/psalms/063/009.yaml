translation:
  language: hi
  text: परन्तु जो मेरे प्राण लेने के लिए मेरी खोज करते हैं, वे धरती की गहराइयों[a] में जा पड़ेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “धरती के निचले भागों में।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵמָּה
  choice: परन्तु जो
  rationale: संयोजक को पिछले पद में व्यक्त भरोसे के साथ विरोध दिखाने के लिए ‘परन्तु’ किया गया है; बलयुक्त सर्वनाम का आशय विरोधी लोगों से है। हिंदी में संबंधवाचक वाक्य विन्यास स्वाभाविक है।
- source_word: לְשׁוֹאָה
  choice: विनाश के लिए
  rationale: שׁוֹאָה विनाश, बरबादी या उजाड़ को सूचित करता है। ‘विनाश के लिए’ उद्देश्य का भाव रखते हुए किसी विशेष प्रकार की मृत्यु को नहीं जोड़ता।
- source_word: יְבַקְשׁוּ נַפְשִׁי
  choice: मेरे प्राण के ... मुझे ढूँढ़ते हैं
  rationale: נֶפֶשׁ यहाँ अमूर्त आत्मा के बजाय जीवन/प्राण का संकेत देता है। मूल शब्दक्रम और उद्देश्यगत संबंध को यथासंभव रखते हुए हिंदी में विरोधियों की घातक खोज व्यक्त की गई है।
- source_word: יָבֹאוּ
  choice: जा पड़ेंगे
  rationale: क्रिया का मूल अर्थ ‘आना/प्रवेश करना’ है, पर गंतव्य धरती की गहराइयाँ होने के कारण हिंदी में अवरोह और परिणति के लिए ‘जा पड़ेंगे’ अधिक स्वाभाविक है।
- source_word: בְּתַחְתִּיּוֹת הָאָרֶץ
  choice: धरती की गहराइयों में
  rationale: यह वाक्यांश धरती के निचले अथवा गहरे भागों की काव्यात्मक छवि रखता है। यह मृत्यु, कब्र या न्याय में गिराए जाने का संकेत दे सकता है, पर इसे किसी विकसित पारलौकिक तकनीकी शब्द में सीमित नहीं करता।
theological_decisions:
- issue: ‘धरती की गहराइयों’ में जाने का अर्थ
  choice: मृत्यु, कब्र या न्याय में नीचे गिराए जाने की खुली काव्यात्मक छवि
  alternative: धरती के निचले भागों का स्थानगत वर्णन, अथवा मृतकों के अधोलोक का विशेष उल्लेख
  rationale: इब्रानी अभिव्यक्ति कई संबद्ध अर्थों की गुंजाइश रखती है। मुख्य पाठ छवि को बनाए रखता है और किसी एक पारलौकिक व्याख्या को निर्णायक नहीं बनाता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और काव्यात्मक हिंदी। ‘प्राण’ भजन-साहित्य के अनुकूल है और यहाँ נֶפֶשׁ को अमूर्त ‘आत्मा’ मानने से बचाता है। उद्देश्यगत वाक्यांश मूल की कुछ असामान्यता को बनाए रखता है, जबकि ‘जा पड़ेंगे’ परिणाम और अवरोह को सहज हिंदी में व्यक्त करता है।
