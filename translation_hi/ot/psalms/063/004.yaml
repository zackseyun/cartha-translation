  choice: मुख्य पाठ में ‘तुझे धन्य कहूँगा’
  alternative: ‘तेरी स्तुति करूँगा’
  rationale: इब्रानी क्रिया स्पष्टतः ברך है। ‘धन्य कहूँगा’ मूल शब्द की विशिष्टता बनाए रखता है, जबकि अधिक व्याख्यात्मक ‘स्तुति करूँगा’ को पादटिप्पणी में दिया गया है।
