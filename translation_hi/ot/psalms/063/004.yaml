- source_word: אֶשָּׂא
  choice: मैं ... उठाऊँगा
  rationale: נשא का अर्थ उठाना है; हाथों के साथ यह प्रार्थना या स्तुति की स्वीकृत शारीरिक मुद्रा व्यक्त करता है।
- source_word: כַפָּי
  choice: अपने हाथ
  rationale: כף विशेषतः हथेली कह सकता है, किंतु इस मुहावरे में आधुनिक हिंदी में ‘हाथ उठाना’ स्वाभाविक और अर्थ-सटीक है।
theological_decisions:
