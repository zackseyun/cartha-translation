    reason: lexical_alternative
lexical_decisions:
- source_word: דָּבְקָה
  choice: लगा रहता है
  rationale: דבק निकटता से चिपके रहने या दृढ़ता से जुड़े रहने का भाव देता है। हिंदी में ‘लगा रहता है’ אַחֲרֶיךָ के साथ स्वाभाविक है और इब्रानी पूर्ण रूप की वर्तमान, निरंतर अवस्था को व्यक्त करता है।
- source_word: נַפְשִׁי
  choice: मेरा प्राण
  rationale: נפשׁ व्यक्ति, जीवन या प्राण को सूचित कर सकता है। काव्यात्मक-भक्तिपरक संदर्भ में ‘मेरा प्राण’ मूल की व्यापक व्यक्तिगत और आध्यात्मिक गूंज बनाए रखता है।
- source_word: אַחֲרֶיךָ
  choice: तेरे पीछे
  rationale: אחרי का मूल स्थानिक/दिशात्मक अर्थ ‘पीछे’ या ‘के बाद’ है। ‘तेरे पीछे’ निकट अनुसरण और लगाव, दोनों की छवि को बिना केवल ‘तुझसे’ में समेटे सुरक्षित रखता है।
- source_word: בִּי תָּמְכָה
  choice: मुझे थामे रहता है
  rationale: תמך का अर्थ सहारा देना या थामे रखना है; בִּי यहाँ क्रिया के व्यक्तिगत पूरक के रूप में स्वाभाविक हिंदी ‘मुझे’ से व्यक्त होता है।
- source_word: יְמִינֶךָ
  choice: तेरा दाहिना हाथ
  rationale: यह मूल की ठोस मानवरूपी छवि को ज्यों का त्यों रखता है, उसे अमूर्त ‘शक्ति’ में नहीं बदलता।
theological_decisions:
- issue: נַפְשִׁי का मानवशास्त्रीय भाव
  choice: मेरा प्राण
  alternative: मैं / मेरा जीवन / मेरा मन
  rationale: ‘मेरा प्राण’ काव्यात्मक और आत्मिक गहराई बनाए रखता है, पर इससे आत्मा की किसी विशिष्ट दार्शनिक या सांप्रदायिक परिभाषा को आरोपित नहीं किया जाता।
- issue: परमेश्वर के दाहिने हाथ की मानवरूपी भाषा
  choice: तेरा दाहिना हाथ
  alternative: तेरी शक्ति
  rationale: इब्रानी की ठोस काव्यात्मक छवि को व्याख्यात्मक अमूर्तीकरण के बिना सुरक्षित रखा गया है।
- issue: דבק + אחרי में लगाव और अनुसरण का तनाव
  choice: तेरे पीछे लगा रहता है
  alternative: तुझसे लिपटा रहता है / तेरे पीछे निकटता से चलता है
  rationale: यह चयन निकट लगाव और पीछे-पीछे अनुसरण के दोनों भावों को यथासंभव बनाए रखता है; किसी एक को ही निर्णायक नहीं बनाता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और काव्यात्मक हिंदी। परमेश्वर के लिए एकवचन आत्मीय संबोधन ‘तेरे/तेरा’ भजन की सीधी प्रार्थनात्मक वाणी के अनुरूप रखा गया है।
