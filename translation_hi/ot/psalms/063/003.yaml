lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह अगले कथन—‘मेरे होंठ तेरी स्तुति करेंगे’—का कारण प्रस्तुत करता है और हिन्दी में कारण-संबंध स्वाभाविक रूप से व्यक्त करता है।
- source_word: טוֹב
  choice: उत्तम है
  rationale: מִן के साथ यह तुलनात्मक अर्थ देता है; ‘जीवन से भी उत्तम’ इस तुलना को स्पष्ट और काव्यात्मक ढंग से व्यक्त करता है।
- source_word: חַסְדְּךָ
  choice: तेरा अटल प्रेम
  rationale: חֶסֶד में प्रेम, निष्ठा और स्थिरता का संयुक्त भाव है। ‘अटल प्रेम’ इसे सहज आधुनिक हिन्दी में व्यक्त करता है, बिना वाचा-संबंध को अनिवार्य रूप से स्पष्ट करके अर्थ को संकीर्ण किए।
- source_word: מֵחַיִּים
  choice: जीवन से भी
  rationale: חַיִּים रूप की दृष्टि से बहुवचन है, पर यहाँ सामान्यतः जीवन की समग्र धारणा व्यक्त करता है। ‘भी’ तुलना के बल को स्वाभाविक हिन्दी में उभारता है।
- source_word: שְׂפָתַי
  choice: मेरे होंठ
  rationale: मूल की ठोस शारीरिक और काव्यात्मक छवि को बनाए रखा गया है; इसे ‘मेरी वाणी’ जैसे अमूर्त रूप में नहीं बदला गया।
- source_word: יְשַׁבְּחוּנְךָ
  choice: तेरी स्तुति करेंगे
  rationale: पिएल क्रिया का अर्थ प्रशंसा या स्तुति करना है। भविष्यकालीन रूप को स्पष्ट रखते हुए यह उपासना-संदर्भ में स्वाभाविक हिन्दी है।
theological_decisions:
- issue: उपासना के संदर्भ में חֶסֶד का अनुवाद
  choice: अटल प्रेम
  alternative: करुणा; निष्ठावान प्रेम; वाचा का प्रेम
  rationale: ‘अटल प्रेम’ ईश्वर के प्रेम की स्थिरता और निष्ठा को व्यक्त करता है, पर किसी एक संप्रदायगत व्याख्या को पाठ में नहीं थोपता। अन्य वैध अर्थछटाएँ पादटिप्पणी में दी गई हैं।
translation_notes:
