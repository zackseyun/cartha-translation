lexical_decisions:
- source_word: יַגִּירֻהוּ
  choice: वे … कर दिए जाएँगे
  rationale: हिफ़इल रूप का मूल बिंब ‘बहा देना/उँडेल देना’ है, पर यहाँ हिंसक मृत्यु का भाव है। इब्रानी में एकवचन कर्म-प्रत्यय ‘उसे’ के बाद अगले खंड में बहुवचन ‘वे’ आता है। मुख्य पाठ में प्रसंगानुसार बहुवचन निष्क्रिय वाक्य रखा गया है, जबकि अधिक शब्दशः और व्याकरणिक रूप से कठिन पाठ को पादटिप्पणी में सुरक्षित किया गया है।
- source_word: עַל יְדֵי חָרֶב
  choice: तलवार के वश में
  rationale: शाब्दिक ‘तलवार के हाथों’ के बजाय यह स्वाभाविक हिन्दी में तलवार की हिंसक सत्ता/अधीनता का भाव व्यक्त करता है और ‘सौंप दिए जाने’ की प्रसंगगत छवि से मेल खाता है।
- source_word: מְנָת
  choice: भाग
  rationale: यह नियत हिस्से या बाँट को दर्शाता है; ‘भाग’ काव्यात्मक, संक्षिप्त और सामान्य हिन्दी में स्पष्ट है।
- source_word: שֻׁעָלִים
  choice: लोमड़ियों
  rationale: שׁוּעָל का सामान्य कोशगत अर्थ ‘लोमड़ी’ है। उजाड़ और शवभक्षण के प्रसंग में ‘गीदड़’ भी संभव है, इसलिए उसे पादटिप्पणी में दिया गया है।
- source_word: יִהְיוּ
  choice: बनेंगे
  rationale: היה यहाँ हिंसक मृत्यु के फलस्वरूप उत्पन्न दशा बताता है; इसलिए केवल ‘होंगे’ की अपेक्षा ‘बनेंगे’ अधिक स्पष्ट है।
theological_decisions:
- issue: पहले खंड के एकवचन कर्म और दूसरे खंड के बहुवचन कर्ता के बीच व्याकरणिक तनाव
  choice: मुख्य पाठ में दोनों खंडों को प्रसंग के शत्रुओं के लिए बहुवचन में प्रस्तुत किया गया
  alternative: ‘वे उसे तलवार के बल से बहा देंगे; वे लोमड़ियों का भाग बनेंगे’
  rationale: शब्दशः विकल्प इब्रानी की आकृति बचाता है, पर हिन्दी में ‘वे’ को मारने वालों और मरने वालों—दोनों के रूप में समझे जाने का भ्रामक प्रभाव पैदा करता है। निष्क्रिय बहुवचन प्रसंगगत आशय स्पष्ट करता है, और मूल तनाव पादटिप्पणी में बना रहता है।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और गरिमामय रखी गई है। ‘तलवार के वश में’ सामान्य पाठक के लिए स्वाभाविक है, जबकि मूल के ‘बहा देने’ के बिंब और एकवचन-बहुवचन तनाव को पादटिप्पणी में सुरक्षित रखा गया है।
