    text: या ‘गीदड़ों’। इब्रानी शब्द שֻׁעָלִים सामान्यतः लोमड़ियों के लिए आता है, पर युद्धभूमि और उजाड़ के इस प्रसंग में इसे गीदड़ों के लिए भी समझा जा सकता है।
    reason: lexical_alternative
