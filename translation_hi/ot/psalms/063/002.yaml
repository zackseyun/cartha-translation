  text: So I have looked upon you in the sanctuary[a], to see your power and your glory.
translation:
  language: hi
  text: इस प्रकार मैंने पवित्र स्थान में आपको निहारा[a], आपकी सामर्थ्य और महिमा देखने के लिए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इस प्रकार पवित्र स्थान में मैंने आपको देखा।”
    reason: חֲזִיתִיךָ के लिए अधिक सरल ‘देखा’ विकल्प को सुरक्षित रखता है; ‘इस प्रकार’ כֵּן और ‘पवित्र स्थान’ בַּקֹּדֶשׁ के संभावित सीधा अनुवाद हैं।
lexical_decisions:
- source_word: כֵּן
  choice: इस प्रकार
  rationale: यह क्रियाविशेषण पिछले पद की लालसा को पवित्रस्थान में परमेश्वर को निहारने के अनुभव से जोड़ता है। ‘इस प्रकार’ कारण या समय-संबंध को आवश्यकता से अधिक निश्चित किए बिना כֵּן का स्वाभाविक अर्थ देता है।
- source_word: בַּקֹּדֶשׁ
  choice: पवित्रस्थान में
  rationale: उपासना के संदर्भ में קֹדֶשׁ यहाँ अमूर्त ‘पवित्रता’ के बजाय पवित्र स्थान अथवा धाम को सूचित करता है। ‘पवित्रस्थान’ स्पष्ट, प्रतिष्ठित और सामान्य हिंदी बाइबलीय प्रयोग है।
- source_word: חֲזִיתִיךָ
  choice: मैंने आपको निहारा है
  rationale: חזה केवल आकस्मिक रूप से देखने के बजाय ध्यानपूर्वक या अनुभूतिपूर्वक देखने का भाव दे सकता है। ‘निहारा है’ उस मननशील भाव को बनाए रखता है और काव्यात्मक हिंदी में स्वाभाविक है।
- source_word: לִרְאוֹת
  choice: ताकि ... देखूँ
  rationale: לִ उपसर्गयुक्त infinitive construct यहाँ उद्देश्य व्यक्त करता है। ‘ताकि ... देखूँ’ इस प्रयोजन-संबंध को स्पष्ट और स्वाभाविक हिंदी में रखता है।
- source_word: עֻזְּךָ
  choice: आपकी सामर्थ्य
  rationale: עֹז शक्ति, बल या सामर्थ्य का द्योतक है। परमेश्वर के संदर्भ में ‘सामर्थ्य’ गरिमापूर्ण और सहज है तथा ‘महिमा’ के साथ स्वाभाविक बैठता है।
- source_word: וּכְבוֹדֶךָ
  choice: और आपकी महिमा
  rationale: परमेश्वर के लिए כָּבוֹד उनके प्रकट वैभव और गौरव को व्यक्त करता है। ‘महिमा’ इसका स्थापित और अर्थपूर्ण हिंदी समतुल्य है।
theological_decisions:
- issue: पवित्रस्थान में परमेश्वर को देखने का आशय
  choice: मूल की सीधी अभिव्यक्ति रखते हुए कहा गया है कि भजनकार ने परमेश्वर को निहारा, ताकि उनकी सामर्थ्य और महिमा देखे।
  alternative: इसे केवल प्रतीकात्मक उपासना-अनुभव या परमेश्वर के सार के रहस्यदर्शी दर्शन के रूप में स्पष्ट करना।
  rationale: इब्रानी पाठ उपासना के परिवेश में देखने की सामान्य क्रियाएँ प्रयोग करता है, पर उनके काव्यात्मक और धर्मवैचारिक विस्तार को सीमित नहीं करता। अनुवाद न तो परमेश्वर के सार के प्रत्यक्ष दर्शन का दावा जोड़ता है, न दर्शन को केवल रूपक घोषित करता है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण काव्यात्मक शैली रखी गई है। परमेश्वर के लिए आदरसूचक ‘आप’ प्रयोग हुआ है। ‘निहारा’ ध्यानपूर्ण देखने का भाव देता है, जबकि पादटिप्पणी अधिक सीधा ‘देखा था’ विकल्प प्रस्तुत करती है।
