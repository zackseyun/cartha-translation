lexical_decisions:
- source_word: מִזְמוֹר
  choice: भजन
  rationale: यह भजन-संग्रह के शीर्षकों में प्रयुक्त तकनीकी काव्य-संगीत संबंधी शब्द है; हिन्दी में ‘भजन’ इसका स्वाभाविक और प्रचलित समतुल्य है।
- source_word: לְדָוִד
  choice: दाऊद का
  rationale: इब्रानी לְ लेखन, समर्पण, स्वामित्व या संबंध का संकेत दे सकता है। ‘दाऊद का’ हिन्दी में इस संबंध को खुला रखता है और इसे केवल ‘दाऊद द्वारा रचित’ के अर्थ तक सीमित नहीं करता।
- source_word: בִּהְיוֹתוֹ
  choice: जब वह ... में था
  rationale: בְּ के साथ היה का infinitive construct और सर्वनाम-प्रत्यय एक कालवाचक उपवाक्य बनाते हैं; यह हिन्दी में उसका स्वाभाविक रूप है।
- source_word: בְּמִדְבַּר
  choice: निर्जन प्रदेश में
  rationale: מִדְבָּר निर्जन, कम आबाद, चरागाही अथवा मरु भूभाग को सूचित कर सकता है। ‘निर्जन प्रदेश’ इसके व्यापक भौगोलिक अर्थ को बचाता है और वनयुक्त ‘जंगल’ का भ्रामक बोध नहीं कराता।
- source_word: יְהוּדָה
  choice: यहूदा
  rationale: क्षेत्र और गोत्र का व्यक्तिवाचक नाम; हिन्दी बाइबलीय परंपरा के अनुरूप लिप्यंतरित किया गया है।
theological_decisions:
- issue: दाऊद-संबंधी शीर्षक का अर्थ
  choice: ‘दाऊद का’ रखकर संबंध की अस्पष्टता सुरक्षित रखी गई है।
  alternative: ‘दाऊद द्वारा रचित’ या ‘दाऊद के लिए’
  rationale: भजनों के शीर्षकों में לְ लेखन, समर्पण, संग्रहगत संबंध या स्वामित्व में से किसी को सूचित कर सकता है; मूल पाठ यहाँ किसी एक अर्थ को अनिवार्य नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘निर्जन प्रदेश’ को ‘जंगल’ पर वरीयता दी गई है, क्योंकि आधुनिक हिन्दी में ‘जंगल’ प्रायः वृक्षों से भरे वन का बोध कराता है।
