  text: אֱלֹהִ֤ים אֵלִ֥/י אַתָּ֗ה אֲֽשַׁחֲ֫רֶ֥/ךָּ צָמְאָ֬ה לְ/ךָ֨ נַפְשִׁ֗/י כָּמַ֣הּ לְ/ךָ֣ בְשָׂרִ֑/י בְּ/אֶֽרֶץ צִיָּ֖ה וְ/עָיֵ֣ף בְּלִי מָֽיִם׀׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/063/001.yaml
  text: God[a], you are my God; I seek you at dawn. My soul thirsts for you, my flesh longs for you[b], in a dry and weary land without water.
translation:
  language: hi
  text: 'परमेश्वर, आप मेरे परमेश्वर हैं;

    भोर होते ही मैं आपको खोजता हूँ।[a]


    मेरी आत्मा आपके लिए प्यासी है,

    मेरा शरीर आपके लिए तरसता है,[b]

    सूखी और थकी-माँदी भूमि में,

    जहाँ पानी नहीं है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद “मैं आपको बहुत सवेरे खोजता हूँ,” “मैं आपको लगन से खोजता हूँ,” या भावानुसार “मैं आपको बड़ी उत्कंठा से खोजता हूँ” भी हो सकता है। इब्रानी क्रिया में मूलतः भोर के समय खोजने की छवि है।
    reason: lexical_alternative
  - marker: b
    text: 'अंतिम पंक्तियों का संबंध इस प्रकार भी समझा जा सकता है: “मेरी आत्मा आपके लिए प्यासी है; सूखी और थकी-माँदी भूमि में, जहाँ पानी नहीं है, मेरा शरीर आपके लिए तरसता है।”'
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: אֱלֹהִים אֵלִי אַתָּה
  choice: परमेश्वर, आप मेरे परमेश्वर हैं
  rationale: दोनों ईश्वरीय पदों और प्रत्यक्ष संबोधन को बनाए रखा गया है। आधुनिक सम्मानसूचक हिन्दी के लिए ‘आप’ चुना गया; ‘ही’ नहीं जोड़ा गया, क्योंकि उससे अनन्यता पर मूल से अधिक बल पड़ सकता था।
- source_word: אֲשַׁחֲרֶךָּ
  choice: भोर होते ही मैं आपको खोजता हूँ
  rationale: शחר के पिएल रूप में निहित भोर या बहुत सवेरे खोजने की छवि को स्पष्ट और स्वाभाविक हिन्दी में सुरक्षित रखा गया है।
- source_word: צָמְאָה לְךָ נַפְשִׁי
  choice: मेरी आत्मा आपकी प्यासी है
  rationale: נפשׁ को ‘आत्मा’ और प्यास की काव्यात्मक छवि को बनाए रखा गया है; इसे केवल ‘मन’ या ‘समूचा अस्तित्व’ कहकर समतल नहीं किया गया।
- source_word: כָּמַהּ לְךָ בְשָׂרִי
  choice: मेरा शरीर आपके लिए तरसता है
  rationale: בשר के शारीरिक अर्थ को ‘शरीर’ से व्यक्त किया गया है और כּמהּ की तीव्र अभिलाषा को सहज हिन्दी ‘तरसता है’ में रखा गया है।
- source_word: בְּאֶרֶץ צִיָּה וְעָיֵף
  choice: इस सूखी और थकी-माँदी भूमि में
  rationale: भूमि के सूखेपन तथा उस पर आरोपित थकान की काव्यात्मक मानवीकरण-छवि दोनों सुरक्षित हैं। ‘इस’ वक्ता की वर्तमान अनुभूति को स्वाभाविक हिन्दी में जोड़ता है, बिना स्थान को विशिष्ट किए।
- source_word: בְּלִי מָיִם
  choice: जहाँ पानी नहीं है
  rationale: निषेधात्मक पदबंध का सरल, स्पष्ट और काव्य-प्रवाह के अनुकूल हिन्दी रूप।
theological_decisions:
- issue: נפשׁ और בשר का मानव-वर्णनात्मक युग्म
  choice: ‘मेरी आत्मा’ और ‘मेरा शरीर’ को अलग काव्यात्मक समानांतरों के रूप में बनाए रखना
  alternative: ‘मेरा पूरा अस्तित्व’ और ‘मेरा तन’
  rationale: मूल पाठ आंतरिक और शारीरिक लालसा को साथ रखता है। इन दोनों शब्दों को बनाए रखने से काव्यात्मक और धर्मवैचारिक तनाव सुरक्षित रहता है, पर इससे कठोर आत्मा-शरीर द्वैत का दावा नहीं किया जाता।
- issue: अंतिम स्थानसूचक पदबंध का विस्तार
  choice: पंक्ति-विन्यास द्वारा आत्मा की प्यास और शरीर की लालसा—दोनों को सूखी भूमि की परिस्थिति से जोड़ना
  alternative: इसे केवल ‘मेरा शरीर आपके लिए तरसता है’ से जोड़ना
  rationale: इब्रानी वाक्य-विन्यास दोनों संबंधों की संभावना रहने देता है। मुख्य पाठ व्यापक संबंध को प्राथमिकता देता है, जबकि पादटिप्पणी संकुचित संबंध को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल पर गरिमापूर्ण काव्यात्मक शैली रखी गई है। परमेश्वर के लिए सम्मानसूचक ‘आप’ का प्रयोग किया गया है। पंक्ति-विन्यास इब्रानी समानांतरता और अंतिम स्थानसूचक पदबंध के व्यापक संबंध को उभारता है।
