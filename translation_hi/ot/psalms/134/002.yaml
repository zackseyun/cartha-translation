  text: שְׂאֽוּ יְדֵ/כֶ֥ם קֹ֑דֶשׁ וּ֝/בָרֲכוּ אֶת יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/134/002.yaml
  text: Lift up your hands to the holy place and bless Yahweh[a].
translation:
  language: hi
  text: अपने हाथ पवित्रता में उठाओ और याहवे को धन्य कहो।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “पवित्र स्थान की ओर” अथवा “पवित्र स्थान में।” इब्रानी शब्द का अर्थ पवित्रता अथवा पवित्र स्थान हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: שְׂאוּ
  choice: उठाओ
  rationale: नשא के बहुवचन आज्ञार्थक रूप का ठोस शारीरिक भाव रखता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: יְדֵיכֶם
  choice: अपने हाथ
  rationale: श्रोताओं के हाथों को सीधे संबोधित करता है; हिन्दी में आज्ञार्थक वाक्य के साथ ‘अपने’ अधिक स्वाभाविक है।
- source_word: קֹדֶשׁ
  choice: पवित्र स्थान की ओर
  rationale: मंदिर-सेवकों के इस संदर्भ में קדשׁ का पवित्र स्थान/पवित्रस्थान-संबंधी अर्थ संभावित है। इब्रानी में संबंधबोधक अव्यय न होने के कारण दिशा, स्थान और पवित्र रीति—तीनों की अस्पष्टता टिप्पणी में रखी गई है।
- source_word: וּבָרֲכוּ
  choice: और … को धन्य कहो
  rationale: परमेश्वर की ओर प्रयुक्त ברך के स्तुतिपरक अर्थ को हिन्दी में ‘धन्य कहो’ स्वाभाविक रूप से व्यक्त करता है; ‘आशीष दो’ आधुनिक पाठक को भ्रामक लग सकता है।
- source_word: אֶת
  choice: को
  rationale: इब्रानी निश्चित कर्मचिह्न का हिन्दी में यहाँ कर्म-परसर्ग ‘को’ द्वारा स्वाभाविक प्रतिनिधित्व होता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: ईश्वर के व्यक्तिगत नाम יהוה को उपाधि से बदलने के बजाय हिन्दी लिपि में लिप्यंतरित किया गया है।
theological_decisions:
- issue: קדשׁ का अर्थ और वाक्यगत संबंध
  choice: 'दिशात्मक: ‘पवित्र स्थान की ओर’'
  alternative: ‘पवित्र स्थान में’ या ‘पवित्रता से’
  rationale: भजन का मंदिर-संबंधी संदर्भ दिशात्मक अर्थ को बल देता है, पर मूल में कोई स्पष्ट संबंधबोधक अव्यय नहीं है। इसलिए अन्य वास्तविक संभावनाओं को पादटिप्पणी में रखा गया है।
- issue: परमेश्वर के लिए ברך का हिन्दी रूप
  choice: ‘धन्य कहो’
  alternative: ‘आशीष दो’ या ‘स्तुति करो’
  rationale: ‘धन्य कहो’ मूल क्रिया का आशीर्वचनात्मक/स्तुतिपरक तनाव बनाए रखता है; ‘स्तुति करो’ अर्थ को संकरा करता और ‘आशीष दो’ सामान्य हिन्दी में अस्वाभाविक या भ्रमकारी हो सकता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामूहिक उपासना के अनुकूल हिन्दी। ‘याहवे’ को व्यक्तिगत दिव्य नाम के रूप में रखा गया है।
