  text: שִׁ֗יר הַֽ/מַּ֫עֲל֥וֹת הִנֵּ֤ה בָּרֲכ֣וּ אֶת יְ֭הוָה כָּל עַבְדֵ֣י יְהוָ֑ה הָ/עֹמְדִ֥ים בְּ/בֵית יְ֝הוָ֗ה בַּ/לֵּילֽוֹת׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/134/000.yaml
  text: A Song of Ascents. Behold, bless the LORD, all you servants of the LORD, who stand in the house of the LORD by night!
translation:
  language: hi
  text: चढ़ाइयों का गीत। देखो,[a] यहोवा को धन्य कहो, हे यहोवा के सब सेवकों, जो रातों में यहोवा के भवन[b] में खड़े रहते हो!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “निहारो” अथवा “देखो”; यह शब्द ध्यान आकर्षित करता है।
    reason: lexical_alternative
  - marker: b
    text: “यहोवा का भवन” यहाँ मंदिर के पवित्रस्थान को दर्शाता है।
    reason: cultural_note
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: आरोहण का गीत
  rationale: शीर्षक के पारंपरिक अर्थ ‘ऊपर चढ़ने/आरोहण का गीत’ को संक्षिप्त और स्वाभाविक हिंदी में रखा गया है; इसके सटीक ऐतिहासिक संदर्भ को अनावश्यक रूप से निश्चित नहीं किया गया।
- source_word: הִנֵּה
  choice: देखो
  rationale: यह ध्यान आकर्षित करने वाला आरंभिक उद्गार है; ‘देखो’ उसका सीधा और सहज हिंदी रूप है।
- source_word: בָּרֲכוּ אֶת־יְהוָה
  choice: यहोवा को धन्य कहो
  rationale: ברך के परमेश्वर को कर्म बनाकर किए गए प्रयोग में स्तुति और धन्यता की घोषणा का भाव है; ‘धन्य कहो’ स्रोत की संरचना और धार्मिक तनाव को बनाए रखता है।
- source_word: עַבְדֵי יְהוָה
  choice: यहोवा के सेवको
  rationale: עבד का संबोधन बहुवचन है; ‘सेवको’ आधुनिक, गरिमापूर्ण और संदर्भानुकूल है।
- source_word: הָעֹמְדִים
  choice: खड़े रहते हो
  rationale: कृदंत सेवकों की नियमित या नियुक्त उपस्थिति को व्यक्त करता है, केवल क्षणिक खड़े होने को नहीं।
- source_word: בַּלֵּילוֹת
  choice: रातों को
  rationale: हिब्रू बहुवचन को सुरक्षित रखते हुए रात की नियमित मंदिर-सेवा का संकेत दिया गया है।
theological_decisions:
- issue: मनुष्यों द्वारा यहोवा को ‘धन्य’ कहना
  choice: यहोवा को धन्य कहो
  alternative: यहोवा की स्तुति करो
  rationale: वैकल्पिक रूप अर्थ स्पष्ट करता है, पर स्रोत के ברך पद की पारस्परिक शब्दावली को समतल कर देता है; मुख्य पाठ में अधिक औपचारिक अभिव्यक्ति रखी गई है।
- issue: ‘यहोवा का भवन’ की पहचान
  choice: मुख्य पाठ में ‘यहोवा का भवन’; पादटिप्पणी में मंदिर का स्पष्टीकरण
  alternative: मुख्य पाठ में ‘यहोवा का मंदिर’
  rationale: ‘भवन’ स्रोत के בית का निकट रूप है, जबकि संदर्भगत पहचान को पादटिप्पणी स्पष्ट करती है और पाठ में अतिरिक्त विशिष्टता नहीं जोड़ती।
translation_notes:
  register: आधुनिक मानक हिंदी, देवनागरी और गरिमापूर्ण सामूहिक संबोधन का प्रयोग किया गया है। ‘यहोवा’ से टेट्राग्राम YHWH को दर्शाया गया है। शीर्षक और पद का पूरा मुख्य पाठ शामिल है; सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
