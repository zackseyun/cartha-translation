id: PSA.134.1
reference: Psalms 134:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: שִׁ֗יר הַֽ/מַּ֫עֲל֥וֹת הִנֵּ֤ה בָּרֲכ֣וּ אֶת יְ֭הוָה כָּל עַבְדֵ֣י יְהוָ֑ה הָ/עֹמְדִ֥ים בְּ/בֵית יְ֝הוָ֗ה בַּ/לֵּילֽוֹת׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/134/001.yaml
  text: A Song of Ascents[a]. Behold, bless Yahweh, all you servants of Yahweh[b], who stand in the house of Yahweh by night.
translation:
  language: hi
  text: 'चढ़ाइयों का गीत।


    देखो[a], याहवे को धन्य कहो,

    हे याहवे के सभी सेवको,

    जो रात के समय याहवे के भवन[b] में खड़े रहते हो।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “ध्यान दो।”
    reason: lexical_alternative
  - marker: b
    text: “याहवे का भवन” यहाँ मंदिर के पवित्रस्थान का उल्लेख करता है।
    reason: cultural_note
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: चढ़ाइयों का गीत
  rationale: संग्रह के पारंपरिक शीर्षक को बनाए रखते हुए מַעֲלוֹת के ‘ऊपर चढ़ने’ संबंधी मूल बिंब को सुरक्षित रखता है; ‘तीर्थयात्रियों का गीत’ जैसी अधिक व्याख्यात्मक अभिव्यक्ति से बचता है।
- source_word: הִנֵּה
  choice: देखो
  rationale: ध्यान आकर्षित करने वाले विस्मयादिबोधक कण का सीधा और काव्यात्मक हिन्दी रूप।
- source_word: בָּרֲכוּ
  choice: धन्य कहो
  rationale: ईश्वर के संबंध में ברך का स्वाभाविक हिन्दी प्रयोग है और ‘स्तुति करो’ की अपेक्षा मूल क्रिया की विशिष्ट भाषा को अधिक स्पष्ट रूप से बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चतुरक्षरीय निजी नाम को ‘प्रभु’ जैसी उपाधि से बदलने के बजाय हिन्दी में उसके प्रचलित विद्वत्तापूर्ण उच्चारण का लिप्यंतरण किया गया है।
- source_word: כָּל עַבְדֵי יְהוָה
  choice: हे याहवे के सभी सेवको
  rationale: आज्ञार्थक संबोधन को हिन्दी में स्पष्ट करने के लिए ‘हे’ रखा गया है; मंदिर-सेवा के प्रसंग में עֶבֶד के लिए ‘सेवक’ स्वाभाविक है, जबकि ‘दास’ यहाँ अनावश्यक रूप से बंधुआपन पर बल दे सकता है।
- source_word: הָעֹמְדִים
  choice: जो … खड़े रहते हो
  rationale: इब्रानी कृदंत के ठोस ‘खड़े होने’ के बिंब को सुरक्षित रखता है; ‘सेवा करते हो’ अर्थसंगत होने पर भी अधिक व्याख्यात्मक होता।
- source_word: בְּבֵית יְהוָה
  choice: याहवे के भवन में
  rationale: इब्रानी ‘याहवे का घर’ मुहावरे को गरिमापूर्ण हिन्दी ‘भवन’ से प्रस्तुत करता है; ‘मंदिर’ का प्रसंगगत अर्थ पादटिप्पणी में स्पष्ट किया गया है।
- source_word: בַּלֵּילוֹת
  choice: रात के समय
  rationale: इब्रानी बहुवचन का हिन्दी में स्वाभाविक कालवाचक रूप; कृत्रिम ‘रातों में’ से बचते हुए रात्रिकालीन सेवा का आशय बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ तीन बार परमेश्वर का निजी वाचा-नाम रखता है। ‘याहवे’ उसे उपाधि में बदले बिना अपेक्षाकृत निकट ध्वन्यात्मक रूप में प्रस्तुत करता है।
- issue: मनुष्य द्वारा परमेश्वर को ‘धन्य’ कहना
  choice: याहवे को धन्य कहो
  alternative: याहवे की स्तुति करो
  rationale: ברך की मूल धार्मिक भाषा और उससे उत्पन्न अर्थगत तनाव को बनाए रखा गया है; ‘स्तुति करो’ प्रसंग का अर्थ बता देता, पर क्रिया की व्यापकता को संकुचित कर देता।
translation_notes:
  register: भाषा आधुनिक, काव्यात्मक और उपासना-योग्य रखी गई है। पंक्ति-विन्यास इब्रानी काव्य के संबोधन और वर्णन को स्पष्ट करता है। ‘सेवको’ मानक संबोधन रूप है; ‘खड़े रहते हो’ रात की नियमित मंदिर-सेवा के दृश्य को बनाए रखता है।
