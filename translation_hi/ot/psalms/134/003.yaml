base_translation:
  language: en
  yaml_path: translation/ot/psalms/134/003.yaml
  text: May Yahweh bless you from Zion[c][b][a], maker of heaven and earth.
translation:
  language: hi
  text: याहवे सिय्योन से तुम्हें आशीष दें[a]—वे आकाश और पृथ्वी के रचयिता हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “याहवे सिय्योन से तुम्हें आशीष देंगे।” इब्रानी क्रिया भविष्य का साधारण कथन भी हो सकती है, पर इस आशीर्वचनात्मक प्रसंग में इसे कामना के रूप में समझना अधिक स्वाभाविक है।
    reason: alternative_reading
lexical_decisions:
- source_word: יְבָרֶכְךָ
  choice: तुम्हें आशीष दें
  rationale: पिएल अपूर्ण क्रिया और द्वितीय पुरुष एकवचन प्रत्यय को समापन-आशीर्वचन के संदर्भ में कामना के रूप में व्यक्त किया गया है। ‘तुम्हें’ आधुनिक हिन्दी में स्वाभाविक है और संबोधित व्यक्ति या प्रतिनिधि समुदाय—दोनों के लिए खुला रह सकता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: מִצִּיּוֹן
  choice: सिय्योन से
  rationale: מִן स्रोत या उद्गम बताता है; आशीष के सिय्योन से आने की छवि सुरक्षित रखी गई है।
- source_word: עֹשֵׂה
  choice: रचयिता
  rationale: עשה का क़ाल कृदंत यहाँ याहवे की पहचान कराने वाली उपाधि है। ‘रचयिता’ हिन्दी में संक्षिप्त, गरिमापूर्ण और स्वाभाविक है।
- source_word: שָׁמַיִם וָאָרֶץ
  choice: आकाश और पृथ्वी
  rationale: यह युग्म समस्त सृष्टि को सूचित करता है। हिन्दी में ‘आकाश और पृथ्वी’ परिचित और स्वाभाविक सृष्टि-युग्म है।
theological_decisions:
- issue: आरंभिक अपूर्ण क्रिया का बल
  choice: 'कामना/आशीर्वचन: ‘आशीष दें’'
  alternative: 'भविष्यवाणी: ‘आशीष देंगे’'
  rationale: भजन के समापन और आशीर्वचनात्मक प्रसंग में क्रिया को इच्छा या प्रार्थना के रूप में समझना सबसे स्वाभाविक है; वैकल्पिक कालगत अर्थ को पादटिप्पणी में रखा गया है।
- issue: יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम है; ‘याहवे’ उसे उपाधि में बदले बिना प्रस्तुत करता है।
- issue: עֹשֵׂה का संबंध
  choice: 'याहवे की पहचान कराने वाली उपाधि: ‘वे ... के रचयिता हैं’'
  alternative: 'संबंधवाचक वाक्य: ‘जिन्होंने ... बनाया’'
  rationale: इब्रानी कृदंत का उपाधिपरक बल रखा गया है। हिन्दी में डैश के बाद स्वतंत्र पहचान-वाक्य अस्पष्ट संबंध से बचता और अर्थ स्पष्ट रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सरल किंतु गरिमापूर्ण रखी गई है। ‘आशीष दें’ प्रार्थनात्मक आशीर्वचन का स्वाभाविक रूप है। ईश्वरीय संदर्भ के कारण ‘वे/हैं’ के आदरसूचक प्रयोग से हिन्दी वाक्य सहज बनाया गया है।
