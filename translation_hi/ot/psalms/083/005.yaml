  text: כִּ֤י נוֹעֲצ֣וּ לֵ֣ב יַחְדָּ֑ו עָ֝לֶ֗י/ךָ בְּרִ֣ית יִכְרֹֽתוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/083/005.yaml
  text: For they have conspired together with one heart[b][a]; against you they make a covenant.
translation:
  language: hi
  text: क्योंकि उन्होंने एक मन होकर षड्यंत्र रचा है; वे तेरे विरुद्ध वाचा बाँधते हैं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “वे तेरे विरुद्ध वाचा काटते हैं।”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पद पिछले निवेदन का कारण बताता है; ‘क्योंकि’ उसके व्याख्यात्मक संबंध को स्वाभाविक हिन्दी में स्पष्ट रखता है।
- source_word: נוֹעֲצוּ
  choice: षड्यंत्र रचा है
  rationale: निफ़अल रूप परस्पर मंत्रणा को व्यक्त करता है; शत्रुतापूर्ण प्रसंग में ‘षड्यंत्र रचा है’ संयुक्त दुर्भावनापूर्ण योजना को स्पष्ट करता है।
- source_word: לֵב יַחְדָּו
  choice: एक मन होकर
  rationale: यह हिन्दी मुहावरा ‘हृदय’ को इच्छा और उद्देश्य के केंद्र के रूप में समझते हुए एकमतता की इब्रानी छवि और भाव दोनों को सहज ढंग से व्यक्त करता है।
- source_word: עָלֶיךָ
  choice: तेरे विरुद्ध
  rationale: शत्रुतापूर्ण मंत्रणा और वाचा के इस प्रसंग में עַל का विरोधात्मक अर्थ है।
- source_word: בְּרִית יִכְרֹתוּ
  choice: वाचा बाँधते हैं
  rationale: כרת ברית का शाब्दिक रूप ‘वाचा काटना’ है, पर हिन्दी में ‘वाचा बाँधना’ औपचारिक और बाध्यकारी समझौते का स्वाभाविक मुहावरा है।
theological_decisions:
- issue: परमेश्वर के विरुद्ध शत्रुतापूर्ण समझौते का चित्रण
  choice: वे तेरे विरुद्ध वाचा बाँधते हैं
  alternative: वे तेरे विरुद्ध गठबंधन बनाते हैं
  rationale: ‘वाचा’ בְּרִית की औपचारिक और गंभीर प्रकृति को बनाए रखती है, जबकि ‘तेरे विरुद्ध’ विरोधात्मक बल को स्पष्ट करता है; इससे विद्रोह को केवल राजनीतिक समन्वय बनाकर हल्का नहीं किया जाता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। परमेश्वर के लिए एकवचन निकट संबोधन ‘तेरे’ रखा गया है। ‘एक मन होकर’ एकजुट उद्देश्य को और ‘वाचा बाँधते हैं’ इब्रानी वाचा-मुहावरे को स्वाभाविक हिन्दी में व्यक्त करता है।
