    text: शाब्दिक रूप से ‘लूत के पुत्रों के लिए भुजा बने,’ अर्थात् उनके लिए सामर्थ्य या सैनिक सहायता बने। ‘लूत के वंशज’ सम्भवतः मोआब और अम्मोन के लोगों को सूचित करता है।
