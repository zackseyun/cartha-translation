lexical_decisions:
- source_word: גַּם
  choice: भी
  rationale: यहाँ यह अश्शूर के भी शत्रु-संघ में सम्मिलित होने पर बल देता है; स्वाभाविक हिन्दी में ‘भी’ इस समावेशी बल को व्यक्त करता है।
- source_word: אַשּׁוּר
  choice: अश्शूर
  rationale: इस्राएली बाइबलीय भूगोल में प्रयुक्त इस राजनीतिक सत्ता के लिए यह मानक हिन्दी नाम है।
- source_word: נִלְוָה
  choice: मिल गया
  rationale: निफ़अल रूप जुड़ने या साथ हो जाने का भाव देता है; ‘मिल गया’ गठबंधन का संकेत देते हुए अनावश्यक व्याख्या नहीं जोड़ता।
- source_word: עִמָּם
  choice: उनके साथ
  rationale: यह पूर्ववर्ती पदों में गिनाए गए लोगों की ओर संकेत करने वाले पूर्वसर्ग और बहुवचन प्रत्यय का सीधा अनुवाद है।
- source_word: הָיוּ
  choice: वे ... बने
  rationale: यहाँ היה विधेय-संज्ञा ‘भुजा’ के साथ भूमिका ग्रहण करने का भाव दे सकता है; ‘बने’ प्रसंग में स्वाभाविक है, यद्यपि ‘थे’ भी सम्भव है।
- source_word: זְרוֹעַ
  choice: भुजा
  rationale: मूल रूपक को सुरक्षित रखा गया है; यहाँ भुजा सामर्थ्य या सैनिक सहायता का बिंब है।
- source_word: לִבְנֵי לוֹט
  choice: लूत के वंशजों के लिए
  rationale: शाब्दिक ‘लूत के पुत्र’ यहाँ लूत से निकले जनसमूहों को सूचित करता है; आधुनिक हिन्दी में ‘वंशज’ अभिप्राय स्पष्ट करता है।
- source_word: סֶלָה
  choice: सेला
  rationale: इस संगीतमय या उपासना-संबंधी संकेत का निश्चित अर्थ अज्ञात है, इसलिए इसका लिप्यंतरण किया गया है।
theological_decisions:
- issue: ‘लूत के पुत्रों’ की पहचान
  choice: मुख्य पाठ में ‘लूत के वंशजों’ का व्यापक वंशगत अर्थ रखा गया है।
  alternative: इसे सीधे ‘मोआब और अम्मोन’ कहा जा सकता था।
  rationale: संदर्भ सम्भवतः मोआब और अम्मोन की ओर संकेत करता है, पर मूल पाठ उनका नाम यहाँ नहीं लेता; इसलिए पहचान को पादटिप्पणी में सम्भावना के रूप में रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। ‘भुजा’ का इब्रानी सैन्य-सहायता रूपक मुख्य पाठ में सुरक्षित है, जबकि ‘वंशज’ हिन्दी में सामूहिक जातीय अर्थ को स्पष्ट करता है।
