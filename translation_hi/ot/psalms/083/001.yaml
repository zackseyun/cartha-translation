  text: O God[a], do not be silent; do not be still[b], O God.
translation:
  language: hi
  text: हे परमेश्वर[a], चुप न रह; मौन न रह, और शांत न रह, हे ईश्वर।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इस पद में परमेश्वर के लिए दो अलग इब्रानी उपाधियाँ आई हैं: אֱלֹהִים (‘परमेश्वर’) और אֵל (‘ईश्वर’; संभवतः ‘सामर्थी’)।'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהִים
  choice: हे परमेश्वर
  rationale: यह प्रार्थना में प्रत्यक्ष संबोधन है। ‘हे परमेश्वर’ आधुनिक हिन्दी में स्वाभाविक, गरिमापूर्ण और स्पष्ट है।
- source_word: אַל דֳּמִי לָךְ
  choice: मौन न रह
  rationale: यह पदबंध परमेश्वर से मौन अथवा निष्क्रिय न रहने की विनती करता है। ‘मौन न रह’ काव्यात्मक समानांतरता और विनती की तात्कालिकता बनाए रखता है।
- source_word: אַל תֶּחֱרַשׁ
  choice: अनसुना न कर
  rationale: חרשׁ में बहरा होने और चुप रहने के अर्थ-क्षेत्र एक-दूसरे से जुड़े हैं। ‘अनसुना न कर’ हिन्दी में स्वाभाविक है और पहली पंक्ति की केवल पुनरावृत्ति किए बिना प्रत्युत्तर न मिलने की आशंका व्यक्त करता है।
- source_word: וְאַל תִּשְׁקֹט
  choice: और शांत न रह
  rationale: שׁקט शांत, निश्चल या निष्क्रिय रहने का भाव दे सकता है। ‘शांत न रह’ मूल की तीसरी समानांतर विनती को संक्षिप्त रूप में सुरक्षित रखता है।
- source_word: אֵל
  choice: हे ईश्वर
  rationale: पद के अंत में आया यह दूसरा ईश्वरीय संबोधन है। ‘ईश्वर’ पहले प्रयुक्त ‘परमेश्वर’ से हल्का शब्दगत भेद बनाए रखता है, बिना ‘सामर्थी’ जैसे अधिक विशिष्ट अर्थ को मुख्य पाठ में आरोपित किए।
theological_decisions:
- issue: אֱלֹהִים और אֵל नामक दो ईश्वरीय उपाधियों का अनुवाद
  choice: क्रमशः ‘परमेश्वर’ और ‘ईश्वर’
  alternative: दोनों स्थानों पर ‘परमेश्वर’, अथवा אֵל के लिए ‘सामर्थी’
  rationale: मूल में दोनों संबोधन निकटार्थी हैं, फिर भी शब्द अलग हैं। हिन्दी में ‘परमेश्वर’ और ‘ईश्वर’ से इस भेद का संकेत स्वाभाविक रूप से मिलता है; ‘सामर्थी’ संभावित अर्थ को आवश्यकता से अधिक निश्चित कर देगा।
- issue: תֶּחֱרַשׁ में बहरेपन और मौन की अर्थगत अस्पष्टता
  choice: मुख्य पाठ में ‘अनसुना न कर’
  alternative: ‘चुप न रह’ या ‘बहरा न बन’
  rationale: ‘अनसुना न कर’ मूल में निहित सुनकर प्रत्युत्तर न देने के तनाव को स्वाभाविक हिन्दी में रखता है। पादटिप्पणी मौन वाले वैकल्पिक अर्थ को सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है और प्रार्थनात्मक काव्य की गरिमा बनाए रखती है। तीनों इब्रानी निषेध अलग-अलग रखे गए हैं, ताकि मूल की क्रमिक और तीव्र होती विनती न खोए।
