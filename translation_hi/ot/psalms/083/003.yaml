  text: עַֽל עַ֭מְּ/ךָ יַעֲרִ֣ימוּ ס֑וֹד וְ֝/יִתְיָעֲצ֗וּ עַל צְפוּנֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/083/003.yaml
  text: They make crafty plans against your people[a], and they consult together against your treasured ones.
translation:
  language: hi
  text: 'वे तेरी प्रजा के विरुद्ध धूर्ततापूर्ण योजनाएँ बनाते हैं,

    और तेरे छिपाकर रखे हुओं[a] के विरुद्ध मिलकर सलाह करते हैं।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तेरे सुरक्षित रखे हुओं” अथवा “तेरे संजोए हुओं।” इब्रानी शब्द उन लोगों को दर्शा सकता है जिन्हें छिपाकर सुरक्षित रखा गया हो या जो परमेश्वर के लिए बहुमूल्य हों।
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעֲרִימוּ סוֹד
  choice: धूर्ततापूर्ण योजनाएँ बनाते हैं
  rationale: הערים का हिफ़ील रूप यहाँ चालाकी या धूर्तता से काम करने का भाव देता है, और סוֹד गोपनीय मंत्रणा अथवा योजना को दर्शाता है। संयुक्त हिंदी अभिव्यक्ति शत्रुतापूर्ण गुप्त योजना का अर्थ स्वाभाविक रूप से व्यक्त करती है।
- source_word: וְיִתְיָעֲצוּ
  choice: मिलकर सलाह करते हैं
  rationale: יעץ का हित्पएल रूप परस्पर मंत्रणा का भाव रखता है। यह अनुवाद उस पारस्परिकता को बनाए रखता है और ‘षड्यंत्र रचते हैं’ जैसा अधिक व्याख्यात्मक अर्थ नहीं थोपता।
- source_word: עַל עַמְּךָ
  choice: तेरी प्रजा के विरुद्ध
  rationale: शत्रुतापूर्ण प्रसंग और क्रियाओं के साथ עַל यहाँ विरोध का अर्थ देता है; इसलिए ‘के विरुद्ध’ उपयुक्त है।
- source_word: צְפוּנֶיךָ
  choice: तेरे छिपाकर रखे हुओं
  rationale: צפן का मूल अर्थ छिपाना, सुरक्षित रख देना या संजोकर रखना है। ‘छिपाकर रखे हुए’ मूल बिंब को बनाए रखता है और इस अस्पष्टता को खुला छोड़ता है कि वे गुप्त, सुरक्षित अथवा बहुमूल्य समझकर रखे गए हैं।
theological_decisions:
- issue: צְפוּנֶיךָ से परमेश्वर के लोगों के संबंध का भाव
  choice: तेरे छिपाकर रखे हुओं
  alternative: तेरे संजोए हुओं / तेरे सुरक्षित रखे हुओं
  rationale: इब्रानी शब्द में छिपे होने, सुरक्षित रखे जाने और संजोए जाने के अर्थ एक-दूसरे से जुड़े हैं। मुख्य पाठ अधिक प्रत्यक्ष शाब्दिक बिंब रखता है, जबकि पादटिप्पणी सुरक्षा और बहुमूल्यता की वैध अर्थ-छायाएँ बताती है।
translation_notes:
  register: आधुनिक मानक हिंदी में काव्यात्मक किंतु सरल शैली। परमेश्वर को संबोधन में भजन की निकटता और एकवचन इब्रानी सर्वनाम के अनुरूप ‘तेरी/तेरे’ रखा गया है। दोनों समानांतर पंक्तियों में ‘के विरुद्ध’ दोहराकर मूल संरचना सुरक्षित रखी गई है।
