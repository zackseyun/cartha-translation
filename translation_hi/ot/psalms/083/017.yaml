  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: יֵבֹ֖שׁוּ וְ/יִבָּהֲל֥וּ עֲדֵי עַ֗ד וְֽ/יַחְפְּר֥וּ וְ/יֹאבֵֽדוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/083/017.yaml
  text: Let them be put to shame and be terrified forever[a]; let them be disgraced and perish.
translation:
  language: hi
  text: वे सदा-सर्वदा लज्जित[a] और भयभीत हों; वे अपमानित हों और नाश हो जाएँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘वे लज्जा में पड़ें’; इब्रानी में यहाँ लज्जा और अपमान के लिए दो निकटार्थी शब्द (בוש और חפר) हैं, जिनकी अर्थ-छटाएँ थोड़ी भिन्न हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵבֹשׁוּ
  choice: लज्जित हों
  rationale: בוש का क़ाल अपूर्ण बहुवचन यहाँ अभिशापात्मक कामना के रूप में है। ‘लज्जित हों’ परिणाम और भाव—दोनों को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: וְיִבָּהֲלוּ
  choice: और भयभीत हों
  rationale: בהל का निफ़ाल रूप घबरा जाने, व्याकुल होने या भयभीत होने का भाव देता है। शत्रुओं पर न्याय के इस प्रसंग में ‘भयभीत’ इसकी तीव्रता को उपयुक्त रूप से व्यक्त करता है।
- source_word: עֲדֵי עַד
  choice: सदा-सर्वदा
  rationale: यह मुहावरा अवधि को प्रबल बनाकर निरंतरता अथवा चिरस्थायित्व व्यक्त करता है; ‘सदा-सर्वदा’ काव्यात्मक, स्पष्ट और स्वाभाविक हिन्दी है।
- source_word: וְיַחְפְּרוּ
  choice: वे अपमानित हों
  rationale: חפר यहाँ लज्जा और सार्वजनिक अपमान के निकट अर्थ में है। ‘अपमानित’ पहले प्रयुक्त בוש से संबंधित, किंतु थोड़ा भिन्न, भाव को बनाए रखता है।
- source_word: וְיֹאבֵדוּ
  choice: और नाश हो जाएँ
  rationale: אבד का सामान्य अर्थ नष्ट होना या मिट जाना है। ‘नाश हो जाएँ’ विनाश की विधि को अनावश्यक रूप से निश्चित किए बिना व्यापक अर्थ सुरक्षित रखता है।
theological_decisions:
- issue: अभिशापात्मक क्रियाबल
  choice: अपूर्ण क्रियारूपों को कामना/प्रार्थना के अर्थ में ‘हों’ और ‘हो जाएँ’ से व्यक्त किया गया है।
  alternative: वे सदा-सर्वदा लज्जित और भयभीत होंगे; वे अपमानित होंगे और नाश हो जाएँगे।
  rationale: संदर्भ में ये रूप केवल भविष्यवाणी नहीं, बल्कि परमेश्वर के शत्रुओं के विरुद्ध प्रार्थनात्मक कामना हैं। हिन्दी के संभावनार्थक रूप स्रोत की इस शक्ति को स्वाभाविक ढंग से सुरक्षित रखते हैं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक रखी गई है। ‘सदा-सर्वदा’ भजन की लय और עֲדֵי עַד की प्रबल अवधि को व्यक्त करता है; समानांतर पंक्तियों में ‘लज्जित’ और ‘अपमानित’ रखकर इब्रानी के दो निकटार्थी शब्दों का अंतर सुरक्षित किया गया है।
