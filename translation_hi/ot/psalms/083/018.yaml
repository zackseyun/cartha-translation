id: PSA.83.18
reference: Psalms 83:18
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְֽ/יֵדְע֗וּ כִּֽי אַתָּ֬ה שִׁמְ/ךָ֣ יְהוָ֣ה לְ/בַדֶּ֑/ךָ עֶ֝לְי֗וֹן עַל כָּל הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/083/018.yaml
  text: Let them know that you alone[a], whose name is Yahweh[b], are the Most High over all the earth.
translation:
  language: hi
  text: वे जान लें कि केवल आप ही—जिनका नाम यहोवा[a] है—सारी पृथ्वी के ऊपर परमप्रधान हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी: YHWH; इसे ‘याहवे’ भी लिखा जाता है।'
    reason: दिव्य नाम के प्रचलित वैकल्पिक लिप्यंतरण और मूल चार व्यंजनों की जानकारी।
lexical_decisions:
- source_word: וְיֵדְעוּ
  choice: वे जान लें
  rationale: पूर्ववर्ती प्रार्थनात्मक संदर्भ में संयोजक सहित अपूर्ण क्रिया इच्छा/प्रार्थना व्यक्त करती है; आधुनिक हिन्दी में ‘वे जान लें’ स्वाभाविक है।
- source_word: כִּי
  choice: कि
  rationale: यह उस बात की विषय-वस्तु प्रस्तुत करता है जिसे उन्हें जानना है।
- source_word: אַתָּה ... לְבַדֶּךָ
  choice: केवल आप ही
  rationale: इब्रानी पद की विशिष्टता और बल को हिन्दी में ‘केवल ... ही’ स्पष्ट रूप से सुरक्षित रखता है।
- source_word: שִׁמְךָ יְהוָה
  choice: जिनका नाम यहोवा है
  rationale: संज्ञा-समानाधिकरण को स्वाभाविक सम्बन्धवाचक उपवाक्य में व्यक्त किया गया है और व्यक्तिगत दिव्य नाम को लिप्यंतरित किया गया है।
- source_word: עֶלְיוֹן
  choice: परमप्रधान
  rationale: यह सर्वोच्चता दर्शाने वाला दिव्य पद है; ‘परमप्रधान’ प्रतिष्ठित, संक्षिप्त और गरिमापूर्ण हिन्दी रूप है।
- source_word: עַל כָּל הָאָרֶץ
  choice: सारी पृथ्वी के ऊपर
  rationale: עַל प्रभुत्व/सर्वोच्चता और הָאָרֶץ यहाँ सार्वभौमिक पृथ्वी को दर्शाता है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ व्यक्तिगत दिव्य नाम YHWH का सीधे प्रयोग करता है। हिन्दी में व्यापक रूप से पहचाना जाने वाला लिप्यंतरण ‘यहोवा’ नाम और उपाधि के भेद को बनाए रखता है; फुटनोट ‘याहवे’ विकल्प बताता है।
- issue: לְבַדֶּךָ की विशिष्टता किस कथन पर बल देती है
  choice: ‘केवल आप ही ... परमप्रधान हैं’
  alternative: ‘आप अकेले हैं, जिनका नाम यहोवा है’
  rationale: इब्रानी क्रम में कुछ संरचनात्मक तनाव है, पर सन्दर्भ का मुख्य दावा यह है कि सम्बोधित परमेश्वर ही सारी पृथ्वी पर परमप्रधान हैं; विराम-चिह्न नाम-वाक्यांश को अलग रखते हुए इस बल को सुरक्षित रखते हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी; आदरसूचक ‘आप’, सहज प्रार्थनात्मक शैली और काव्यात्मक गरिमा। ‘केवल ... ही’ से इब्रानी बल सुरक्षित है और डैश नाम-वाक्यांश के कारण होने वाली सम्भावित अस्पष्टता घटाते हैं।
