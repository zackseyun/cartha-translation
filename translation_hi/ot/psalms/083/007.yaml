lexical_decisions:
- source_word: גְּבָל
  choice: गबाल
  rationale: इब्रानी स्थान-नाम का देवनागरी लिप्यंतरण किया गया है; इसे बिब्लोस के रूप में पहचानना संभव है, पर वह ऐतिहासिक पहचान मूल पाठ का प्रत्यक्ष रूप नहीं है।
- source_word: וְעַמּוֹן
  choice: अम्मोन
  rationale: इस जाति अथवा क्षेत्र के नाम का हिन्दी बाइबल परंपरा के अनुरूप लिप्यंतरण।
- source_word: וַעֲמָלֵק
  choice: अमालेक
  rationale: राष्ट्रीय नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: פְּלֶשֶׁת
  choice: पलिश्तिया
  rationale: इब्रानी रूप स्पष्टतः लोगों के बजाय देश अथवा क्षेत्र का नाम है; इसलिए ‘पलिश्ती’ की अपेक्षा ‘पलिश्तिया’ अधिक रूप-संगत है।
- source_word: עִם
  choice: और
  rationale: सूची के अंतिम घटक को स्वाभाविक हिन्दी में जोड़ता है; यहाँ इसका साहचर्यगत अर्थ ‘के साथ’ भी व्यक्त हो सकता है।
- source_word: יֹשְׁבֵי צֽוֹר
  choice: सोर के निवासी
  rationale: समास-पद का अर्थ ‘सोर में रहनेवाले/सोर के निवासी’ है; चुना हुआ रूप आधुनिक और संक्षिप्त है।
- source_word: צֽוֹר
  choice: सोर
  rationale: इस स्थान-नाम का मानक हिन्दी बाइबलीय रूप।
