  rationale: समुदाय-सूचक बहुवचन नाम को हिन्दी में स्पष्ट और स्वाभाविक बनाने के लिए ‘लोग’ जोड़ा गया है; व्यंजनात्मक रूप हגר से ‘हागरी’ उपयुक्त है।
