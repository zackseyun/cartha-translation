  yaml_path: translation/ot/psalms/083/009.yaml
  text: Do to them as to Midian[a], as to Sisera, as to Jabin, at the Kishon Brook[b],
translation:
  language: hi
  text: उनके साथ वैसा ही कर जैसा तूने मिद्यान के साथ किया था,[a] जैसा सीसरा और याबीन के साथ कीशोन नदी के पास किया था।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप में: “उनके साथ मिद्यान के समान, सीसरा के समान और याबीन के समान कर, कीशोन नदी के पास।” मुख्य पाठ ने इब्रानी तुलना में निहित “तूने ... किया था” को स्पष्ट किया है।'
    reason: lexical_alternative
  - marker: b
    text: कीशोन के पास सीसरा और याबीन की पराजय के लिए न्यायियों 4:7, 13; 5:21 देखें।
    reason: cross_reference
lexical_decisions:
- source_word: עֲשֵׂה לָהֶם
  choice: उनके साथ वैसा ही कर
  rationale: आज्ञार्थक क्रिया और לָהֶם को स्वाभाविक हिन्दी में सीधे निवेदन के रूप में व्यक्त करता है। प्रसंग विरोधपूर्ण कार्रवाई दिखाता है, पर ‘नाश कर’ जैसी अधिक स्पष्ट व्याख्या नहीं जोड़ी गई।
- source_word: כְּמִדְיָן
  choice: जैसा तूने मिद्यान के साथ किया था
  rationale: तुलनासूचक כְּ के भीतर निहित पिछली ईश्वरीय कार्रवाई को हिन्दी में स्पष्ट करने से वाक्य सहज बनता है; शाब्दिक संक्षिप्तता पादटिप्पणी में सुरक्षित है।
- source_word: כְּסִיסְרָא כְיָבִין
  choice: जैसा सीसरा और याबीन के साथ
  rationale: दोनों समानांतर ऐतिहासिक तुलनाओं को बनाए रखता है। हिन्दी में ‘और’ जोड़ना स्वाभाविक है और दोनों नामों को एक ही पूर्व कार्रवाई से जोड़ता है।
- source_word: בְּנַחַל קִישׁוֹן
  choice: कीशोन नदी के पास
  rationale: נַחַל किसी जलधारा, मौसमी नदी या नाले को सूचित कर सकता है। प्रसिद्ध भौगोलिक नाम के लिए ‘कीशोन नदी’ आधुनिक हिन्दी में सहज है, और ‘के पास’ यहाँ स्थानवाचक בְּ को व्यक्त करता है।
theological_decisions:
- issue: तुलना में निहित ईश्वरीय कार्रवाई
  choice: ‘तूने ... किया था’ को स्पष्ट किया गया
  alternative: अधिक शाब्दिक ‘मिद्यान के समान’
  rationale: इब्रानी में क्रिया केवल आरंभ में है और तुलनाएँ संक्षिप्त हैं। हिन्दी में निहित कार्रवाई स्पष्ट करने से अर्थ सुबोध होता है, बिना यह बताए कि कार्रवाई का ठीक स्वरूप क्या था।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी; परमेश्वर को संबोधित एकवचन ‘तू’ भजन की सीधी प्रार्थना और इब्रानी एकवचन आज्ञार्थक के अनुरूप है। व्यक्तिनाम और स्थाननाम प्रचलित हिन्दी बाइबलीय रूपों में लिप्यंतरित हैं।
