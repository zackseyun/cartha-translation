    reason: lexical_alternative
  - marker: b
    text: इब्रानी קַשׁ का अधिक शाब्दिक अर्थ ‘पुआल’ या ‘सूखी डंठल’ है; यहाँ हवा से उड़ जाने वाली हल्की वस्तु के बिंब के कारण ‘भूसी’ कहा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהַי
  choice: हे मेरे परमेश्वर
  rationale: यह प्रथम पुरुष एकवचन प्रत्यय के साथ सीधा संबोधन है। हिंदी में ‘हे’ प्रार्थनापूर्ण संबोधन को स्वाभाविक और गरिमापूर्ण बनाता है।
- source_word: שִׁיתֵמוֹ
  choice: उन्हें … कर दे
  rationale: यहाँ क्रिया निवेदनात्मक आज्ञार्थ में है और आगे आए दो उपमानों के साथ ‘कर दे’ आधुनिक हिंदी में स्वाभाविक है।
- source_word: כַגַּלְגַּל
  choice: घूमती हुई धूल के समान
  rationale: גַּלְגַּל किसी पहिए अथवा घूमती-लुढ़कती वस्तु को सूचित कर सकता है। हवा के आगे भूसी वाले समानांतर बिंब के संदर्भ में यह चयन हवा से घूमकर बिखरती हल्की वस्तु का काव्यात्मक भाव व्यक्त करता है, जबकि शाब्दिक विकल्प पाद-टिप्पणी में सुरक्षित है।
- source_word: כְּקַשׁ
  choice: भूसी के समान
  rationale: קַשׁ का अधिक शाब्दिक अर्थ पुआल या सूखी डंठल हो सकता है। हवा के आगे उड़ जाने वाली हल्की कृषि-अवशिष्ट वस्तु के बिंब के लिए ‘भूसी’ सहज हिंदी है; अधिक शाब्दिक विकल्प पाद-टिप्पणी में दिया गया है।
- source_word: לִפְנֵי רוּחַ
  choice: हवा के आगे
  rationale: यह मुहावरा हवा द्वारा उड़ाकर ले जाए जाने का भाव देता है। ‘हवा के आगे’ संक्षिप्त, काव्यात्मक और स्रोत के निकट है।
