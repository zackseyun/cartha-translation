  text: כִּֽי הִנֵּ֣ה א֭וֹיְבֶי/ךָ יֶהֱמָי֑וּ/ן וּ֝/מְשַׂנְאֶ֗י/ךָ נָ֣שְׂאוּ רֹֽאשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/083/002.yaml
  text: For look, your enemies are in an uproar, and those who hate you have lifted up their heads.
translation:
  language: hi
  text: क्योंकि, देखो, तेरे शत्रु कोलाहल मचा रहे हैं, और तुझसे घृणा करनेवालों ने सिर उठा लिया है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: देख
  rationale: ध्यान आकर्षित करने वाले इस उद्गार को संक्षिप्त और प्रत्यक्ष रूप में रखा गया है।
- source_word: יֶהֱמָיוּן
  choice: कोलाहल मचा रहे हैं
  rationale: यह क्रिया गरजने, शोर करने या अशांत कोलाहल की ध्वनि व्यक्त करती है; यह हिंदी पद शत्रुओं की उग्र हलचल और शोर दोनों को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: נָשְׂאוּ רֹאשׁ
  choice: सिर उठा लिया है
  rationale: मूल मुहावरे का रूप बनाए रखा गया है; संदर्भ में यह निर्भीक या उद्दंड होकर उठ खड़े होने का संकेत दे सकता है, पर उस अर्थ को पाठ में स्पष्ट करके अस्पष्टता समाप्त नहीं की गई।
theological_decisions:
- issue: शत्रुओं का संबोधन परमेश्वर से संबंधित है
  choice: तेरे शत्रु … तुझसे घृणा करनेवालों
  alternative: आपके शत्रु … आपसे घृणा करनेवाले
  rationale: भजन की काव्यात्मक, निकट और प्रत्यक्ष ईश-संबोधन शैली के अनुरूप एकवचन आत्मीय सर्वनाम रखा गया है; इससे कोई अतिरिक्त सांप्रदायिक अर्थ नहीं जोड़ा जाता।
translation_notes:
  register: आधुनिक मानक हिंदी में संक्षिप्त, काव्यात्मक और गरिमापूर्ण शैली। ‘करनेवालों’ का संयुक्त रूप प्रवाहपूर्ण पारंपरिक बाइबलीय हिंदी के अनुरूप है, जबकि वाक्यरचना सामान्य पाठक के लिए सहज रखी गई है।
