base_translation:
  language: en
  yaml_path: translation/ot/psalms/083/011.yaml
  text: Make their nobles like Oreb and Zeeb[a], and all their princes like Zebah and Zalmunna.
translation:
  language: hi
  text: 'उनके कुलीनों को ओरेब और जेब के समान कर दे,

    और उनके सभी प्रधानों को जेबह और सलमुन्ना के समान।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שִׁיתֵמוֹ
  choice: उनके ... को ... के समान कर दे
  rationale: आज्ञार्थक क्रिया परमेश्वर से की गई प्रार्थना है। अगले तुलनात्मक पदों के साथ इसका स्वाभाविक अर्थ है कि उन अगुओं का हाल नामित पराजित अगुओं जैसा कर दिया जाए।
- source_word: נְדִיבֵמוֹ
  choice: उनके प्रतिष्ठित लोगों
  rationale: נָדִיב यहाँ कुलीन अथवा प्रमुख व्यक्तियों को दर्शाता है। ‘प्रतिष्ठित लोग’ आधुनिक हिन्दी में स्वाभाविक है और समानांतर נְסִיכֵמוֹ से भेद बनाए रखता है।
- source_word: כְּעֹרֵב וְכִזְאֵב
  choice: ओरेब और जेब के समान
  rationale: ये न्यायियों 7:25 के मिद्यानी अगुओं के नाम हैं। हिन्दी बाइबलीय नाम-परंपरा के अनुरूप लिप्यंतरण किया गया है और दोनों नामों पर तुलना लागू रहती है।
- source_word: וּכְזֶבַח וּכְצַלְמֻנָּע
  choice: जेबह और सल्मुन्ना के समान
  rationale: ये न्यायियों 8 में पराजित मिद्यानी राजाओं के नाम हैं। नामों को अर्थानुवाद के बजाय लिप्यंतरित किया गया है।
- source_word: כָּל
  choice: सभी
  rationale: शत्रु के प्रधानों के संबंध में प्रार्थना की समग्रता को स्पष्ट रूप से सुरक्षित रखता है।
- source_word: נְסִיכֵמוֹ
  choice: उनके ... प्रधानों
  rationale: נָסִיךְ शासक, प्रधान या राजकुमार को दर्शा सकता है। ‘प्रधान’ ऊँचे नेतृत्व का अर्थ रखता है, पर अनावश्यक रूप से वंशानुगत राजपद निर्धारित नहीं करता।
theological_decisions:
- issue: शापात्मक प्रार्थना में ऐतिहासिक संकेत
  choice: वर्तमान शत्रु-अगुओं के न्याय के प्रतिरूप के रूप में मिद्यानी अगुओं की ऐतिहासिक पराजय को नामों सहित बनाए रखा गया है।
  alternative: नामों को केवल पराजित शत्रुओं के सामान्य उदाहरण मानना।
  rationale: ओरेब, जेब, जेबह और सल्मुन्ना न्यायियों 7–8 के विशिष्ट ऐतिहासिक पात्र हैं। पद में अतिरिक्त व्याख्या जोड़े बिना नामों को सुरक्षित रखना परमेश्वर के पूर्व उद्धारकारी न्याय की ओर भजन के संकेत को कायम रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और प्रार्थनात्मक रखी गई है। दो समानांतर पंक्तियाँ इब्रानी काव्य-संरचना को दर्शाती हैं; ‘प्रतिष्ठित लोगों’ और ‘प्रधानों’ से दोनों नेतृत्व-संज्ञाओं का अंतर सुरक्षित रहता है।
