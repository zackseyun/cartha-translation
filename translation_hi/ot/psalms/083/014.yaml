  text: As fire burns a forest[a], and as a flame sets the mountains ablaze,
translation:
  language: hi
  text: 'जैसे आग वन को जलाती है,

    और जैसे ज्वाला पहाड़ों को धधका देती है,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְּ/אֵשׁ
  choice: जैसे आग
  rationale: उपसर्ग כ तुलना व्यक्त करता है; हिंदी काव्यात्मक उपमा में ‘जैसे आग’ स्वाभाविक और स्पष्ट है।
- source_word: תִּבְעַר
  choice: जला देती है
  rationale: Qal रूप यहाँ वन पर आग की क्रिया बताता है। ‘जला देती है’ संदर्भ में स्वाभाविक है और दहन का सीधा अर्थ सुरक्षित रखता है।
- source_word: יָעַר
  choice: वन
  rationale: संज्ञा का अर्थ ‘वन/जंगल’ है। ‘वन’ संक्षिप्त, dignified काव्यात्मक हिंदी है और सामान्य पाठक के लिए बोधगम्य है।
- source_word: וּכְ/לֶהָבָה
  choice: और जैसे ज्वाला
  rationale: संयोजक ו और तुलनात्मक כ दूसरी समानांतर उपमा प्रस्तुत करते हैं; ‘ज्वाला’ לֶהָבָה का सटीक तथा काव्यात्मक प्रतिरूप है।
- source_word: תְּלַהֵט
  choice: धधका देती है
  rationale: להט का Piel रूप तीव्र दहन को व्यक्त करता है। ‘धधका देती है’ केवल ‘जलाती है’ की अपेक्षा उसकी प्रबल/कारक छटा को बेहतर दर्शाता है।
- source_word: הָרִים
  choice: पहाड़ों को
  rationale: הָרִים में निश्चित उपपद है; हिंदी में कर्म-चिह्न ‘को’ के साथ ‘पहाड़ों’ कहना स्वाभाविक है, जबकि संदर्भगत निश्चितता अलग ‘उन’ जोड़े बिना भी बनी रहती है।
