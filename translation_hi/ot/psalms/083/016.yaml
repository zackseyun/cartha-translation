base_translation:
  language: en
  yaml_path: translation/ot/psalms/083/016.yaml
  text: Fill their faces with shame[a], that they may seek your name, O Yahweh.
translation:
  language: hi
  text: उनके चेहरों को लज्जा से भर दे[a], ताकि वे तेरे नाम की खोज करें, हे याहवे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या: “और वे तेरे नाम की खोज करें”; इब्रानी क्रिया को साधारण क्रम के रूप में भी समझा जा सकता है, यद्यपि यहाँ वह संभवतः उद्देश्य या परिणाम व्यक्त करती है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלֵּא
  choice: भर दे
  rationale: पिएल आज्ञार्थक एकवचन पुल्लिंग रूप है, जिसमें परमेश्वर से सीधी विनती की गई है। ‘भर दे’ मूल क्रिया और हिन्दी मुहावरे दोनों के अनुकूल है।
- source_word: פְנֵיהֶם
  choice: उनके चेहरों को
  rationale: बहुवचन रूप को बनाए रखता है और दिखाई देने वाली लज्जा का इब्रानी बिंब सुरक्षित रखता है।
- source_word: קָלוֹן
  choice: लज्जा
  rationale: यह शब्द लज्जा, अपमान या बदनामी का भाव रखता है। ‘लज्जा’ संक्षिप्त, स्वाभाविक और व्यक्ति द्वारा अनुभव किए जाने वाले अपमान को व्यक्त करता है।
- source_word: וִיבַקְשׁוּ
  choice: ताकि वे ... खोज करें
  rationale: आज्ञार्थक क्रिया के बाद वाव-संयुक्त अपूर्ण क्रिया यहाँ संभावित उद्देश्य या परिणाम व्यक्त करती है। हिन्दी में ‘ताकि’ इस प्रमुख अर्थ को स्वाभाविक रूप से प्रकट करता है।
- source_word: שִׁמְךָ
  choice: तेरे नाम की
  rationale: ‘नाम’ का सीधा अनुवाद परमेश्वर की प्रकट पहचान, प्रतिष्ठा और व्यक्तित्व के व्यापक बाइबलीय भाव को बिना अधिक व्याख्या किए सुरक्षित रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी बाइबल-पाठकों में प्रचलित रूप ‘यहोवा’ परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय नाम के रूप में प्रस्तुत करता है।
theological_decisions:
- issue: ईश्वरीय दंड का उद्देश्य
  choice: माँगी गई लज्जा को इस उद्देश्य से जोड़ा गया है कि शत्रु परमेश्वर के नाम की खोज करें।
  alternative: 'इसे साधारण क्रम या अगली विनती के रूप में पढ़ा जा सकता है: ‘और वे तेरे नाम की खोज करें।’'
  rationale: आज्ञार्थक के बाद वाव-संयुक्त अपूर्ण क्रिया उद्देश्य अथवा परिणाम व्यक्त कर सकती है। ‘ताकि’ प्रसंग में संभावित प्रमुख अर्थ देता है, जबकि पादटिप्पणी वैकल्पिक व्याकरणिक संबंध को सुरक्षित रखती है और पश्चात्ताप को निश्चित परिणाम नहीं बनाती।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और प्रार्थनात्मक हिन्दी। परमेश्वर को संबोधित करने के लिए काव्यात्मक एकवचन ‘तेरे’ और आज्ञार्थक ‘भर दे’ का प्रयोग किया गया है।
