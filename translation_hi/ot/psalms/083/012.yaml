lexical_decisions:
- source_word: אֲשֶׁר אָמְרוּ
  choice: जिन्होंने कहा
  rationale: सम्बन्धवाचक पद पिछले सन्दर्भ में बताए गए शत्रुओं से जुड़ता है; पूर्ण क्रिया को सहज हिन्दी में सामान्य भूतकाल से व्यक्त किया गया है।
- source_word: נִירֲשָׁה
  choice: आओ, हम ... अपना अधिकार कर लें
  rationale: यरश धातु यहाँ शत्रुतापूर्ण ढंग से किसी भूभाग को अपने अधिकार में लेने का भाव रखती है। यह अनुवाद ‘विरासत में पाएँ’ के अपेक्षाकृत सौम्य भाव से बचता है।
- source_word: לָּנוּ
  choice: अपना
  rationale: लामेद और प्रथम पुरुष बहुवचन प्रत्यय अपने लाभ अथवा स्वामित्व के लिए लेने का भाव देते हैं; ‘अपना अधिकार’ इसे स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: נְאוֹת
  choice: चरागाहों
  rationale: नְאוֹת चरागाहों, निवासों अथवा बसेरों को सूचित कर सकता है। मुख्य पाठ में ठोस काव्यात्मक बिम्ब ‘चरागाहों’ रखा गया है और अन्य सम्भव अर्थ पादटिप्पणी में दिए गए हैं।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: भजन के सन्दर्भ में यह इस्राएल के परमेश्वर का स्पष्ट एकवचन उल्लेख है।
theological_decisions:
- issue: נְאוֹת אֱלֹהִים का अर्थ
  choice: परमेश्वर की चरागाहों
  alternative: परमेश्वर के निवास-स्थानों अथवा बसेरों
  rationale: यह पद परमेश्वर से सम्बन्धित चरागाहों/भूमि अथवा निवास-स्थानों का संकेत दे सकता है। मुख्य पाठ इब्रानी के ठोस बिम्ब को बनाए रखता है, जबकि पादटिप्पणी अर्थगत अस्पष्टता सुरक्षित रखती है और इसे केवल मन्दिर तक सीमित नहीं करती।
translation_notes:
  register: आधुनिक मानक हिन्दी; काव्यात्मक किन्तु सामान्य पाठकों के लिए सहज और गरिमापूर्ण। ‘आओ’ सामूहिक संकल्पसूचक रूप को स्वाभाविक ढंग से व्यक्त करता है।
