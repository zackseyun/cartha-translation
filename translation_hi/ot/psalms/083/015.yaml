base_translation:
  language: en
  yaml_path: translation/ot/psalms/083/015.yaml
  text: So pursue them with your storm[a], and terrify them with your tempest.
translation:
  language: hi
  text: इस प्रकार[a] अपनी आँधी से उनका पीछा कर, और अपने तूफ़ान से उन्हें भयभीत कर।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “यों अपनी आँधी से उनका पीछा कर, और अपने बवंडर से उन्हें भयभीत कर।”
    reason: כֵּן के ढंग-सूचक अर्थ के लिए ‘यों’ और סוּפָה के लिए ‘बवंडर’ सम्भव वैकल्पिक अभिव्यक्तियाँ हैं।
lexical_decisions:
- source_word: כֵּן
  choice: इसलिए
  rationale: यह पिछले पद की उपमा के आधार पर माँगे गए अनुरूप परिणाम को जोड़ता है; हिन्दी में ‘इसलिए’ इस संबंध को स्वाभाविक और संक्षिप्त रूप से व्यक्त करता है।
- source_word: תִּרְדְּפֵם
  choice: उनका पीछा कर
  rationale: רדף का सामान्य अर्थ पीछा करना या खदेड़ना है। ‘पीछा कर’ युद्ध और काव्य—दोनों संदर्भों में सहज है।
- source_word: בְּסַעֲרֶךָ
  choice: अपनी आँधी से
  rationale: סער प्रचंड तूफ़ानी मौसम को दर्शाता है और यहाँ ב साधन का भाव देता है। ‘अपनी आँधी से’ ईश्वर की आँधी को पीछा करने के साधन के रूप में रखता है।
- source_word: וּבְסוּפָתְךָ
  choice: अपने बवंडर से
  rationale: סוּפָה प्रचंड तूफ़ान या चक्रवाती हवा को दर्शा सकता है। ‘बवंडर’ पहले पदांश की ‘आँधी’ से काव्यात्मक भेद और तीव्रता बनाए रखता है।
- source_word: תְבַהֲלֵם
  choice: उन्हें भयभीत कर
  rationale: पिएल रूप में בהל किसी को घबरा या आतंकित कर देने का कारण बनना बताता है। ‘भयभीत कर’ causative बल को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: अभिशापात्मक प्रार्थना में परमेश्वर की प्रत्यक्ष कार्रवाई
  choice: परमेश्वर से शत्रुओं का पीछा करने और उन्हें भयभीत करने की सीधी विनती को आज्ञार्थक प्रार्थना के रूप में बनाए रखा गया है।
  alternative: “तू उनका पीछा करे… उन्हें भयभीत करे” जैसी संभावनार्थक विनती।
  rationale: प्रार्थना के संदर्भ में हिब्रू अपूर्ण क्रियाएँ इच्छार्थक विनती का कार्य करती हैं। हिन्दी का आज्ञार्थक रूप सीधी प्रार्थना में स्वाभाविक है और पाठ में परमेश्वर के न्याय की माँग को नरम नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सीधी, गरिमापूर्ण और काव्यात्मक भाषा। ‘आँधी’ और ‘बवंडर’ समानार्थी मौसम-चित्रों के बीच स्रोत-पाठ का सूक्ष्म भेद बनाए रखते हैं।
