  text: Let Israel rejoice in his Maker[b][a]; let the sons of Zion exult in their King.
translation:
  language: hi
  text: इस्राएल अपने बनाने वाले[a] में आनन्दित हो; सिय्योन के पुत्र अपने राजा[b] में हर्षित हों।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से ‘उसके बनाने वालों’ है; यहाँ इसे सामान्यतः इस्राएल के बनाने वाले परमेश्वर के लिए समझा जाता है।
    reason: lexical_alternative
  - marker: b
    text: ‘राजा’ से परमेश्वर के बजाय किसी सांसारिक राजा का भी संकेत हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: יִשְׂמַח
  choice: आनन्दित हो
  rationale: שׂמח का क़ाल अपूर्ण 3 पुल्लिंग एकवचन यहाँ काव्यात्मक आग्रह के रूप में प्रयुक्त है; ‘आनन्दित हो’ इस भाव को स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: יִשְׂרָאֵל
  choice: इस्राएल
  rationale: वाचा-समुदाय का व्यक्तिवाचक नाम; प्रचलित हिन्दी बाइबलीय लिप्यंतरण रखा गया है।
- source_word: בְּעֹשָׂיו
  choice: अपने बनाने वाले
  rationale: בְּ को आनन्द के आधार/विषय के अर्थ में ‘में’ और 3 पुल्लिंग एकवचन प्रत्यय को सामूहिक ‘इस्राएल’ के अनुरूप ‘अपने’ से व्यक्त किया गया है। עֹשָׂיו रूपतः बहुवचन है, पर सन्दर्भ में परमेश्वर के लिए प्रयुक्त समझा जाता है; हिन्दी में सहज एकवचन मुख्य पाठ में रखा गया और रूपगत बहुवचन पादटिप्पणी में बताया गया है।
- source_word: בְּנֵי צִיּוֹן
  choice: सिय्योन के पुत्र
  rationale: शाब्दिक अर्थ ‘सिय्योन के पुत्र’ है। मूल के पुल्लिंग सामूहिक रूप को बनाए रखते हुए प्रचलित और बोधगम्य हिन्दी अभिव्यक्ति चुनी गई है।
- source_word: יָגִילוּ
  choice: हर्षित हों
  rationale: גיל का क़ाल अपूर्ण 3 पुल्लिंग बहुवचन उल्लासपूर्ण आनन्द और यहाँ आग्रह व्यक्त करता है; ‘हर्षित हों’ समानान्तरता बनाए रखते हुए ऊँचा काव्यात्मक स्वर देता है।
- source_word: בְמַלְכָּם
  choice: अपने राजा में
  rationale: בְ आनन्द के विषय/आधार को और प्रत्यय ‘उनके’ को व्यक्त करता है। हिन्दी में कर्ता ‘सिय्योन के पुत्र’ के साथ स्वाभाविक सम्बन्ध के लिए ‘अपने’ चुना गया है।
theological_decisions:
- issue: ‘अपने राजा’ का अभिप्रेत व्यक्ति
  choice: मुख्य पाठ में ‘राजा’ को परमेश्वर के लिए समझना
  alternative: इस्राएल का कोई सांसारिक राजा
  rationale: समानान्तर पंक्ति में ‘बनाने वाले’ के साथ ‘राजा’ रखा गया है, इसलिए परमेश्वर अभिप्रेत होना अधिक सम्भावित है। फिर भी हिन्दी लिपि में बड़े अक्षर से भेद सम्भव नहीं और शब्द स्वयं दोनों अर्थ ग्रहण कर सकता है; वैकल्पिक सम्भावना पादटिप्पणी में सुरक्षित है।
- issue: עֹשָׂיו में ‘बनाने वाले’ की संख्या
  choice: अर्थ की दृष्टि से एकवचन ‘बनाने वाले’
  alternative: रूप की दृष्टि से बहुवचन ‘बनाने वालों’
  rationale: इब्रानी रूप व्याकरणतः बहुवचन है, किन्तु यहाँ प्रायः इस्राएल के एकमात्र सृष्टिकर्ता परमेश्वर के लिए समझा जाता है। पठनीय हिन्दी हेतु एकवचन रखा गया, जबकि मूल का बहुवचन पादटिप्पणी में स्पष्ट किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण काव्यात्मक शैली रखी गई है। ‘आनन्दित हो’ और ‘हर्षित हों’ समानान्तर क्रियाओं के निकट अर्थ रखते हुए मूल में दूसरे पद के अधिक उल्लासपूर्ण रंग को हल्के ढंग से अलग करते हैं। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
