  yaml_path: translation/ot/psalms/149/008.yaml
  text: to bind their kings with chains[a], and their honored men with iron fetters,
translation:
  language: hi
  text: कि उनके राजाओं को जंजीरों से और उनके प्रतिष्ठित पुरुषों[a] को लोहे की बेड़ियों से बाँधें,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उनके कुलीनों” अथवा “उनके गणमान्य पुरुषों”।
    reason: lexical_alternative
lexical_decisions:
- source_word: לֶאְסֹר
  choice: बाँधें
  rationale: यह उद्देश्य/परिणाम बताने वाला क्रियारूप पिछले पद से जुड़ता है। ‘बाँधें’ शारीरिक रूप से जकड़ने का सीधा बिंब बनाए रखता है और औपचारिक कारावास का अतिरिक्त अर्थ नहीं जोड़ता।
- source_word: מַלְכֵיהֶם
  choice: उनके राजाओं को
  rationale: מֶלֶךְ का विशिष्ट अर्थ ‘राजा’ है; ‘शासक’ कहने से अर्थ अनावश्यक रूप से व्यापक हो जाता। बहुवचन और संबंधसूचक प्रत्यय दोनों सुरक्षित हैं।
- source_word: בְּזִקִּים
  choice: जंजीरों से
  rationale: זִקִּים बंधन के लिए प्रयुक्त जंजीरों को दर्शाता है। ‘जंजीरों से’ स्वाभाविक हिन्दी है और अगले समानांतर पदांश की ‘बेड़ियों’ से शब्दगत भिन्नता भी बनाए रखता है।
- source_word: וְנִכְבְּדֵיהֶם
  choice: और उनके प्रतिष्ठित पुरुषों
  rationale: כבד से बना यह रूप समाज में सम्मानित या प्रभावशाली पुरुषों को सूचित करता है। ‘प्रतिष्ठित पुरुष’ मूल के सम्मान/महत्त्व के भाव तथा पुल्लिंग बहुवचन दोनों को बनाए रखता है।
- source_word: בְּכַבְלֵי בַרְזֶל
  choice: लोहे की बेड़ियों से
  rationale: כֶּבֶל बंधन या बेड़ी को दर्शाता है और בַרְזֶל उसकी लोहे की बनावट बताता है। यह चयन कठोर बंधन का ठोस बिंब रखते हुए पहले पदांश की ‘जंजीरों’ से भिन्न शब्द देता है।
theological_decisions:
- issue: וְנִכְבְּדֵיהֶם का लिंग और सामाजिक अर्थ
  choice: उनके प्रतिष्ठित पुरुषों
  alternative: उनके कुलीनों / उनके प्रतिष्ठित लोगों
  rationale: इब्रानी रूप पुल्लिंग बहुवचन है और संदर्भ में राजाओं के समानांतर प्रभावशाली पुरुषों की ओर संकेत करता है। इसलिए लिंग को अस्पष्ट या तटस्थ किए बिना ‘प्रतिष्ठित पुरुषों’ रखा गया; पद या वंश के अर्थ को निश्चित न करने के लिए विकल्प पादटिप्पणी में दिए गए हैं।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। वाक्य को पिछले पद से जुड़े उद्देश्यसूचक खंड के रूप में ‘कि ... बाँधें’ से रखा गया है। समानांतर इब्रानी बिंब के लिए ‘जंजीरों’ और ‘लोहे की बेड़ियों’ का स्वाभाविक शब्द-विन्यास अपनाया गया है।
