  yaml_path: translation/ot/psalms/149/006.yaml
  text: The high praises of God are in their throat[a], and a two-edged sword is in their hand[d][c][b],
translation:
  language: hi
  text: परमेश्वर की ऊँची स्तुतियाँ[a] उनके कंठ[b] में हैं, और दोधारी[c] तलवार उनके हाथ[d] में है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “परमेश्वर के उत्कट स्तुतिगान।”
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “उनके गले में।”
    reason: lexical_alternative
  - marker: c
    text: या, “दो-धारी तलवार”; शाब्दिक रूप से, “दो धारों वाली तलवार।”
    reason: lexical_alternative
  - marker: d
    text: इब्रानी में “हाथ” एकवचन है, पर इसका सामूहिक अर्थ हो सकता है; इसलिए “उनके हाथों में” भी संभव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: רוֹמְמוֹת
  choice: ऊँची स्तुतियाँ
  rationale: बहुवचन संज्ञा ऊँचे या उत्कट स्तुतिगान का भाव देती है। यह अनुवाद उसके उन्नत भाव और बहुवचन—दोनों को बनाए रखता है।
- source_word: אֵל
  choice: परमेश्वर
  rationale: यहाँ यह इस्राएल के परमेश्वर के लिए प्रयुक्त ईश्वरीय पदवी है; आधुनिक मानक हिन्दी में ‘परमेश्वर’ स्वाभाविक और गरिमापूर्ण है।
- source_word: בִּגְרוֹנָם
  choice: उनके कंठ में
  rationale: גָּרוֹן का मूल अर्थ ‘कंठ/गला’ है। ‘कंठ’ स्तुति के भीतर से निकलने का सजीव शारीरिक बिंब सुरक्षित रखता है।
- source_word: וְחֶרֶב
  choice: और ... तलवार
  rationale: संयोजक समानांतर दूसरी पंक्ति को जोड़ता है; संज्ञा यहाँ अनिश्चित अर्थ में है, जिसे हिन्दी में बिना किसी निश्चिततासूचक के स्वाभाविक रूप से व्यक्त किया गया है।
- source_word: פִּיפִיּוֹת
  choice: दोधारी
  rationale: यह पद दो धारों वाली तलवार को बताता है। ‘दोधारी’ स्पष्ट, प्रचलित और काव्यात्मक है।
- source_word: בְּיָדָם
  choice: उनके हाथ में
  rationale: इब्रानी में ‘हाथ’ व्याकरणिक रूप से एकवचन है और बहुवचन संबंधसूचक प्रत्यय के साथ सामूहिक अर्थ दे सकता है। हिन्दी में भी ‘उनके हाथ में’ स्वाभाविक है और स्रोत के रूप के निकट रहता है।
theological_decisions:
- issue: आराधना के साथ युद्ध का बिंब
  choice: स्तुति और तलवार—दोनों बिंबों को बिना नरम किए साथ रखा गया है।
  alternative: मुख्य पाठ में तलवार को रूपक या आत्मिक हथियार मानकर प्रस्तुत करना।
  rationale: इब्रानी काव्य स्तुति और वास्तविक युद्ध-संबंधी भाषा को समानांतर रखता है। अनुवाद इस धार्मिक तनाव की व्याख्या करके उसे समाप्त नहीं करता।
- issue: क्रियारहित इब्रानी पंक्ति का भाव
  choice: हिन्दी में ‘हों/हो’ रखा गया है, जो प्रसंग में कामनात्मक या निर्देशात्मक भाव दे सकता है।
  alternative: 'इसे निश्चित कथन बनाना: ‘... हैं’ और ‘... है’।'
  rationale: मूल इब्रानी में स्पष्ट क्रिया नहीं है। निकटवर्ती आह्वानात्मक प्रसंग के कारण ‘हों/हो’ स्वाभाविक है, पर मूल की संक्षिप्तता और भावगत खुलापन पूरी तरह किसी एक निश्चित काल में बंद नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण काव्यात्मक शैली रखी गई है। ‘कंठ’ और ‘दोधारी’ सामान्य पाठक के लिए बोधगम्य रहते हुए भजन की सजीव समानांतरता बनाए रखते हैं।
