  yaml_path: translation/ot/psalms/149/009.yaml
  text: to execute on them the written judgment[a]. This is an honor for all his faithful ones[d][c][b]. Praise Yah!
translation:
  language: hi
  text: उन पर लिखित न्यायादेश लागू करना उसके सभी भक्तों के लिए गौरव की बात है। याह की स्तुति करो!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לַעֲשׂוֹת
  choice: पूरा करें
  rationale: מִשְׁפָּט के साथ यह न्यायिक निर्णय को कार्यान्वित करने का भाव देता है; हिंदी में ‘दण्डादेश को पूरा करें’ स्वाभाविक और संदर्भानुकूल है।
- source_word: בָּהֶם
  choice: उन पर
  rationale: यह पिछले पद में उल्लिखित राष्ट्रों और शासकों को न्याय के भोक्ता के रूप में सूचित करता है।
- source_word: מִשְׁפָּט כָּתוּב
  choice: लिखित दण्डादेश
  rationale: מִשְׁפָּט यहाँ सामान्य न्याय नहीं, लागू किए जाने वाले न्यायिक निर्णय का बोध कराता है; כָּתוּב के प्रत्यक्ष अर्थ ‘लिखित’ को बनाए रखा गया है।
- source_word: הָדָר
  choice: गौरव
  rationale: यहाँ शब्द परमेश्वर के भक्तों को प्राप्त प्रतिष्ठा या गौरव को दर्शाता है; ‘गौरव’ हिंदी में इस भाव को संक्षेप और गरिमा से व्यक्त करता है।
- source_word: חֲסִידָיו
  choice: उसके भक्तों
  rationale: חסיד परमेश्वर के प्रति निष्ठावान और समर्पित लोगों को दर्शाता है; ‘भक्त’ आधुनिक हिंदी में सहज है और केवल संस्थागत ‘संत’ का अर्थ आरोपित नहीं करता।
- source_word: הַלְלוּ יָהּ
  choice: याह की स्तुति करो!
  rationale: आज्ञार्थक क्रिया और संक्षिप्त ईश्वरीय नाम दोनों को अर्थ सहित रखा गया है।
theological_decisions:
- issue: יָהּ के संक्षिप्त ईश्वरीय नाम का अनुवाद
  choice: याह
  alternative: यहोवा / प्रभु
  rationale: मूल में יְהוָה नहीं, उसका संक्षिप्त काव्यात्मक रूप יָהּ है; ‘याह’ उस वास्तविक रूप और स्तुतिपरक सूत्र को सुरक्षित रखता है।
- issue: הָדָר किसका गौरव है
  choice: यह उसके सभी भक्तों का गौरव है
  alternative: यह उसके सभी भक्तों के लिए गौरव है
  rationale: לְ־ संबंध या प्राप्ति दोनों का संकेत दे सकता है। हिंदी का संबंधवाचक रूप संक्षिप्त है और इस कार्य को भक्तों की विशिष्ट प्रतिष्ठा बताता है, बिना अधिक व्याख्या जोड़े।
translation_notes:
  register: आधुनिक मानक हिंदी का गरिमापूर्ण काव्यात्मक गद्य। पद पिछले वाक्य की आश्रित क्रिया को आगे बढ़ाता है, इसलिए ‘करें’ रखा गया है। ‘लिखित दण्डादेश’ मूल के कानूनी और अभिलेखित निर्णय—दोनों भावों को बनाए रखता है।
