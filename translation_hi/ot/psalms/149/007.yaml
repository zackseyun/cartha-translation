translation:
  language: hi
  text: 'राष्ट्रों से बदला लेने के लिए,

    और लोगों को दण्ड देने के लिए[a],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “लोगों को फटकारने” या “सुधारने के लिए।” इब्रानी शब्द का अर्थ फटकार या सुधार भी हो सकता है, पर यहाँ ‘बदला’ के समानांतर इसका दण्डात्मक अर्थ अधिक संभावित है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לַעֲשׂוֹת
  choice: लेने के लिए / देने के लिए
  rationale: ל के साथ infinitive construct उद्देश्य व्यक्त करता है। हिन्दी में समानांतर पंक्तियों में स्वाभाविक क्रिया-संयोजन ‘बदला लेने’ और ‘दण्ड देने’ से इसे व्यक्त किया गया है।
- source_word: נְקָמָה
  choice: बदला
  rationale: यह संज्ञा प्रतिशोध अथवा बदला चुकाने की प्रबल न्यायिक-सैनिक धारणा रखती है। सामान्य आधुनिक हिन्दी में ‘बदला लेना’ उस बल को बिना नरम किए स्पष्ट रूप से व्यक्त करता है।
- source_word: בַּגּוֹיִם
  choice: जाति-जाति से
  rationale: यहाँ בּ लक्ष्य को सूचित करता है। ‘जाति-जाति’ גּוֹיִם के बहुवचन और काव्यात्मक सामूहिक अर्थ को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: תּוֹכֵחוֹת
  choice: दण्ड
  rationale: शब्द का अर्थ डाँट, सुधार अथवा ताड़ना भी हो सकता है, परन्तु ‘बदला’ के समानांतर और अगले पदों के न्यायिक-सैनिक प्रसंग में यहाँ दण्डात्मक अर्थ प्रमुख है।
- source_word: בַּל
  choice: को
  rationale: यह काव्यात्मक पूर्वसर्ग यहाँ कार्रवाई के लक्ष्य को दिखाता है; हिन्दी में ‘लोगों को दण्ड देना’ स्वाभाविक रचना है।
- source_word: אֻמִּים
  choice: देश-देश के लोगों
  rationale: यह बहुवचन जनसमूहों को सूचित करता है। ‘देश-देश के लोग’ पहली पंक्ति की ‘जाति-जाति’ से भेद रखते हुए काव्यात्मक समानांतरता और व्यापक सामूहिक अर्थ व्यक्त करता है।
theological_decisions:
- issue: क्या परमेश्वर के लोगों द्वारा किए जाने वाले न्याय की कठोर भाषा को नरम किया जाए
  choice: ‘बदला’ और ‘दण्ड’ की प्रबल न्यायिक भाषा बनाए रखी गई
  alternative: ‘न्याय’ और ‘फटकार/सुधार’ जैसे अपेक्षाकृत नरम शब्द
  rationale: इब्रानी पाठ स्तुति के सैनिक-न्यायिक प्रसंग में स्पष्टतः कठोर भाषा प्रयोग करता है। उसे नरम करना पाठ की वास्तविक धार्मिक तनावशीलता को अनधिकृत रूप से सुलझाना होगा।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक है। ‘जाति-जाति’ तथा ‘देश-देश के लोगों’ से इब्रानी समानांतरता को हिन्दी में स्वाभाविक ढंग से रखा गया है। कोई पाद-टिप्पणी नहीं दी गई, क्योंकि मुख्य पाठ में प्रसंगानुकूल अर्थ स्पष्ट है और अनावश्यक वैकल्पिक अर्थ पाठक पर बोझ डालेंगे।
