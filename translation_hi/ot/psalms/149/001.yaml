id: PSA.149.1
reference: Psalms 149:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: הַ֥לְלוּ יָ֨הּ שִׁ֣ירוּ לַֽ֭/יהוָה שִׁ֣יר חָדָ֑שׁ תְּ֝הִלָּת֗/וֹ בִּ/קְהַ֥ל חֲסִידִֽים׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/149/001.yaml
  text: Praise Yah! Sing to Yahweh a new song[b][a], his praise in the assembly of the faithful.
translation:
  language: hi
  text: 'याह की स्तुति करो![a]

    याहवे के लिए नया गीत गाओ;

    निष्ठावान जनों की सभा में उसकी स्तुति गाओ।[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी: ‘हालेलू-याह’—शाब्दिक अर्थ, ‘याह की स्तुति करो।’'
    reason: lexical_alternative
  - marker: b
    text: ‘निष्ठावान जनों’ का अनुवाद ‘भक्त जनों’, ‘धर्मी जनों’ या ‘पवित्र जनों’ भी किया जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: הַלְלוּ
  choice: स्तुति करो
  rationale: הלל का बहुवचन आज्ञार्थक रूप है। ‘स्तुति करो’ सीधे सामूहिक आह्वान को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: יָהּ
  choice: याह
  rationale: यह परमेश्वर के नाम का संक्षिप्त रूप है और यहाँ स्वतंत्र रूप से आया है; इसलिए इसे ‘याह’ के रूप में सुरक्षित रखा गया है।
- source_word: שִׁירוּ
  choice: गाओ
  rationale: שׁיר का बहुवचन आज्ञार्थक रूप; साधारण आज्ञा ‘गाओ’ मूल के बल और संक्षिप्तता को बनाए रखती है।
- source_word: לַיהוָה
  choice: याहवे के लिए
  rationale: ל गीत के लक्ष्य अथवा संबोधन को चिह्नित करता है। יהוה को उसके व्यक्तिगत वाचा-नाम ‘याहवे’ के रूप में लिप्यंतरित किया गया है।
- source_word: שִׁיר חָדָשׁ
  choice: नया गीत
  rationale: भजन-साहित्य की इस परिचित पदावली का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: תְּהִלָּתוֹ
  choice: उसकी स्तुति
  rationale: तीसरे पुरुष एकवचन प्रत्यय सहित संज्ञा का सीधा अर्थ ‘उसकी स्तुति’ है। हिन्दी में पिछले ‘गाओ’ को दोहराकर निहित क्रिया स्पष्ट की गई है, बिना कोई नया आशय जोड़े।
- source_word: בִּקְהַל
  choice: सभा में
  rationale: קהל एकत्र हुए समुदाय को दर्शाता है। ‘सभा’ सामूहिक परिवेश को स्पष्ट रखता है और अनावश्यक संस्थागत अर्थ नहीं जोड़ता।
- source_word: חֲסִידִים
  choice: निष्ठावान जनों
  rationale: חסיד उन लोगों को सूचित करता है जो परमेश्वर के प्रति भक्ति और वाचा-संबंधी निष्ठा से पहचाने जाते हैं। ‘निष्ठावान जन’ इस अर्थ को बाद की तकनीकी धार्मिक धारणाओं से बचाते हुए व्यक्त करता है।
theological_decisions:
- issue: एक ही पद में יָהּ और יהוה का अनुवाद
  choice: क्रमशः ‘याह’ और ‘याहवे’
  alternative: दोनों को ‘प्रभु’ कहना, अथवा יהוה को ‘यहोवा’ लिखना
  rationale: मूल पाठ जानबूझकर नाम के संक्षिप्त और पूर्ण रूप का प्रयोग करता है। दोनों को अलग रूप में रखना इस भेद और प्रकट किए गए व्यक्तिगत नाम को सुरक्षित रखता है।
- issue: חֲסִידִים का आशय
  choice: निष्ठावान जन
  alternative: भक्त जन; धर्मी जन; पवित्र जन
  rationale: यह शब्द भक्ति के साथ दृढ़ निष्ठा का भाव रखता है। ‘निष्ठावान जन’ किसी बाद के सांप्रदायिक या तकनीकी अर्थ को आरोपित किए बिना उस केंद्रीय भाव को व्यक्त करता है।
- issue: תְּהִלָּתוֹ בִּקְהַל חֲסִידִים में निहित क्रिया
  choice: पिछली आज्ञा के आधार पर ‘उसकी स्तुति गाओ’
  alternative: ‘निष्ठावान जनों की सभा में उसकी स्तुति हो’ अथवा क्रियारहित ‘उसकी स्तुति ... में’
  rationale: इब्रानी पंक्ति में क्रिया व्यक्त नहीं है और वह पिछली ‘गाओ’ आज्ञा से जुड़ सकती है। हिन्दी में ‘गाओ’ की पुनरावृत्ति सबसे स्वाभाविक है, पर वैकल्पिक वाक्य-संबंध को निर्णायक धर्मवैज्ञानिक अर्थ नहीं दिया गया।
translation_notes:
  register: काव्यात्मक किंतु सरल आधुनिक मानक हिन्दी अपनाई गई है। बहुवचन आज्ञार्थक शैली और समानांतर पंक्तियाँ मूल भजन की सार्वजनिक उपासना-संबंधी लय बनाए रखती हैं। ईश्वरीय नामों को देवनागरी में ‘याह’ और ‘याहवे’ लिखा गया है।
