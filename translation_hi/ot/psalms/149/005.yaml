id: PSA.149.5
reference: Psalms 149:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: יַעְלְז֣וּ חֲסִידִ֣ים בְּ/כָב֑וֹד יְ֝רַנְּנ֗וּ עַל מִשְׁכְּבוֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/149/005.yaml
  text: Let the faithful exult in glory[c][b][a]; let them sing for joy on their beds.
translation:
  language: hi
  text: विश्वासयोग्य लोग महिमा में आनन्दित हों[a]; वे अपने बिछौनों पर आनन्द के गीत गाएँ[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘सम्मान में।’
    reason: lexical_alternative
  - marker: b
    text: या ‘अपने बिछौनों पर आनन्द से जयकार करें।’
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעְלְזוּ
  choice: आनन्दित हों
  rationale: यह रूप काव्यात्मक प्रोत्साहन या आह्वान व्यक्त करता है। ‘आनन्दित हों’ उसके उल्लासपूर्ण भाव को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: חֲסִידִים
  choice: विश्वासयोग्य लोग
  rationale: यह शब्द परमेश्वर के प्रति निष्ठा, भक्ति और वाचा-संबंधी वफादारी से पहचाने जाने वालों को दर्शाता है। यह अनुवाद किसी बाद की तकनीकी धार्मिक श्रेणी को थोपे बिना मूल भाव प्रकट करता है।
- source_word: בְּכָבוֹד
  choice: महिमा में
  rationale: בְּ यहाँ अवस्था या क्षेत्र का बोध करा सकता है। כָבוֹד की गरिमामय काव्यात्मक शक्ति के कारण ‘महिमा’ मुख्य पाठ में रखा गया है; ‘सम्मान’ भी सम्भव है।
- source_word: יְרַנְּנוּ
  choice: आनन्द के गीत गाएँ
  rationale: रנן का यह रूप ऊँचे स्वर में उल्लास प्रकट करने को दर्शाता है, जो गीत या जयकार दोनों हो सकता है। भजन के प्रसंग में ‘आनन्द के गीत गाएँ’ स्वाभाविक है, जबकि वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: עַל
  choice: पर
  rationale: यहाँ पूर्वसर्ग का सीधा स्थानवाचक अर्थ ‘पर’ है।
- source_word: מִשְׁכְּבוֹתָם
  choice: अपने बिछौनों
  rationale: यह शब्द लेटने या विश्राम करने के स्थानों को दर्शाता है। ‘बिछौनों’ काव्यात्मक होने के साथ आधुनिक हिन्दी में स्पष्ट है।
theological_decisions:
- issue: חֲסִידִים का अनुवाद
  choice: विश्वासयोग्य लोग
  alternative: भक्तजन; निष्ठावान लोग; पवित्र जन
  rationale: मूल शब्द परमेश्वर के प्रति निष्ठावान और भक्त लोगों को सूचित करता है, पर अपने आप में किसी विशिष्ट बाद की कलीसियाई श्रेणी को अनिवार्य नहीं बनाता। ‘विश्वासयोग्य लोग’ इस संबंधपरक निष्ठा को प्रमुख रखता है।
- issue: בְּכָבוֹד की व्याख्या
  choice: महिमा में
  alternative: सम्मान में; सम्मान के कारण
  rationale: मूल पूर्वसर्ग और संज्ञा अवस्था, क्षेत्र अथवा कारण के रूप में समझे जा सकते हैं। मुख्य पाठ निकट और काव्यात्मक ‘महिमा में’ रखता है तथा वास्तविक वैकल्पिक अर्थ पादटिप्पणी में देता है।
translation_notes:
  register: भाषा आधुनिक, गरिमामय और सामूहिक उपासना के योग्य रखी गई है। दोनों क्रियाओं को काव्यात्मक आह्वान के रूप में अनूदित किया गया है। ‘विश्वासयोग्य लोग’ सामान्य पाठक के लिए स्पष्ट है और ‘पवित्र जन’ से जुड़ी सम्भावित तकनीकी या सांप्रदायिक ध्वनि से बचता है।
