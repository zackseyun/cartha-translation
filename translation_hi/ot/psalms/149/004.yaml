base_translation:
  language: en
  yaml_path: translation/ot/psalms/149/004.yaml
  text: For Yahweh delights in his people[a]; he adorns the humble with salvation.
translation:
  language: hi
  text: 'क्योंकि याहवे अपनी प्रजा से प्रसन्न होता है;

    वह नम्र लोगों को उद्धार[a] से सुशोभित करता है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘विजय’ अथवा ‘छुटकारा’। इब्रानी शब्द बचाव, छुटकारे या विजय का बोध करा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह आसपास के स्तुतिगान का कारण बताता है; हिन्दी में ‘क्योंकि’ इस व्याख्यात्मक संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: רוֹצֶה
  choice: प्रसन्न होता है
  rationale: यहाँ क्रिया केवल इच्छा नहीं, बल्कि किसी के प्रति अनुग्रहपूर्ण प्रसन्नता प्रकट करती है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी लिप्यंतरण में रखा गया है।
- source_word: בְּעַמּוֹ
  choice: अपनी प्रजा से
  rationale: רצה के साथ ב उस व्यक्ति-समूह को चिह्नित करता है जिससे प्रसन्नता होती है; ‘अपनी प्रजा से’ सहज आधुनिक हिन्दी है।
- source_word: יְפָאֵר
  choice: सुशोभित करता है
  rationale: פאר के पिएल रूप में सजाने, सुंदर बनाने और सम्मान प्रदान करने की छवि है; ‘सुशोभित करता है’ इसे बिना ‘मुकुट पहनाने’ जैसी अतिरिक्त व्याख्या के बनाए रखता है।
- source_word: עֲנָוִים
  choice: नम्र लोगों
  rationale: यह शब्द नम्र, दीन या दबे हुए लोगों को सूचित कर सकता है। ‘नम्र लोगों’ से इसका प्रमुख नैतिक-भक्तिपरक अर्थ सरल आधुनिक हिन्दी में आता है।
- source_word: בִּישׁוּעָה
  choice: उद्धार से
  rationale: ישועה का अर्थ उद्धार, छुटकारा अथवा विजय हो सकता है। ‘उद्धार’ व्यापक अर्थ और धार्मिक अनुगूँज को बनाए रखता है, जबकि अन्य संभावनाएँ पादटिप्पणी में दी गई हैं।
theological_decisions:
- issue: יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत नाम सीधे आया है; ‘याहवे’ उस नाम का प्रचलित विद्वत्तापूर्ण लिप्यंतरण है, न कि उसके स्थान पर रखी गई कोई उपाधि।
- issue: स्तुति-भजन में ישועה का अर्थ
  choice: उद्धार
  alternative: विजय या छुटकारा
  rationale: संदर्भ में ठोस विजय संभव है, पर इब्रानी शब्द का अर्थ उससे अधिक व्यापक है। मुख्य पाठ में ‘उद्धार’ और पादटिप्पणी में अन्य अर्थ देकर वास्तविक अर्थगत विस्तार सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण काव्यात्मक गद्य रखा गया है। पंक्ति-विभाजन इब्रानी पद के दो समानांतर खंडों को स्पष्ट करता है। ‘प्रजा’ वाचा-समुदाय के सामूहिक अर्थ को और ‘सुशोभित’ मूल रूपक को सुरक्षित रखते हैं।
