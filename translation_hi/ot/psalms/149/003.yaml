  text: Let them praise his name with dancing[c][b][a]; let them make music to him with tambourine and lyre.
translation:
  language: hi
  text: वे नाचते हुए उसके नाम की स्तुति करें[a]; वे डफ और वीणा के साथ उसके लिए संगीत बजाएँ[b][c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “नृत्य के साथ।” इब्रानी शब्द מָחוֹל नाचने की क्रिया या किसी नृत्य-रूप, दोनों का अर्थ दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “उसके लिए स्तुति के गीत गाएँ।” इब्रानी क्रिया זמר गायन द्वारा स्तुति करने के साथ-साथ वाद्य-संगीत करने का भी बोध करा सकती है।
    reason: lexical_alternative
  - marker: c
    text: परंपरागत रूप से “हार्प”; इब्रानी शब्द כִּנּוֹר अधिक विशेष रूप से लाइर-जैसे तार-वाद्य को सूचित करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהַֽלְלוּ
  choice: वे ... स्तुति करें
  rationale: पिएल अपूर्ण रूप यहाँ काव्यात्मक आग्रह या आह्वान व्यक्त करता है; हिंदी में संभावनार्थक क्रिया इस भाव को स्वाभाविक रूप से रखती है।
- source_word: שְׁמוֹ
  choice: उसके नाम की
  rationale: इब्रानी में स्पष्ट रूप से ‘उसका नाम’ है; इसे बनाए रखने से मूल अभिव्यक्ति और उसका धार्मिक अर्थ सुरक्षित रहता है।
- source_word: בְמָחוֹל
  choice: नाचते हुए
  rationale: מָחוֹל नृत्य की क्रिया अथवा नृत्य-रूप, दोनों को सूचित कर सकता है। ‘नाचते हुए’ आधुनिक हिंदी में स्वाभाविक है, जबकि विकल्प पाद-टिप्पणी में रखा गया है।
- source_word: בְּתֹף
  choice: डफ के साथ
  rationale: תֹף हाथ से बजाया जाने वाला चौखटे वाला ढोल है; ‘डफ’ इसका संक्षिप्त, प्रचलित और समझने योग्य हिंदी समतुल्य है।
- source_word: וְכִנּוֹר
  choice: और वीणा के साथ
  rationale: כִּנּוֹר प्राचीन लाइर-जैसा तार-वाद्य था। सामान्य हिंदी पाठक के लिए ‘वीणा’ स्वाभाविक निकटतम शब्द है; उसकी अधिक सटीक वाद्यगत पहचान पाद-टिप्पणी में दी गई है।
- source_word: יְזַמְּרוּ
  choice: वे ... संगीत बजाएँ
  rationale: पिएल זמר गायन द्वारा स्तुति या वाद्य-संगीत, दोनों का बोध करा सकता है। यहाँ वाद्यों के स्पष्ट उल्लेख के कारण ‘संगीत बजाएँ’ संदर्भ में स्वाभाविक है, पर व्यापक अर्थ पाद-टिप्पणी में सुरक्षित है।
- source_word: לוֹ
  choice: उसके लिए
  rationale: ל यहाँ संगीत के लक्ष्य या आदर-प्राप्तकर्ता को दर्शाता है; ‘उसके लिए’ हिंदी में स्वाभाविक है।
