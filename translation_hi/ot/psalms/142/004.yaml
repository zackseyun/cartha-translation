  text: הַבֵּ֤יט יָמִ֨ין וּ/רְאֵה֮ וְ/אֵֽין לִ֪/י מַ֫כִּ֥יר אָבַ֣ד מָנ֣וֹס מִמֶּ֑/נִּי אֵ֖ין דּוֹרֵ֣שׁ לְ/נַפְשִֽׁ/י׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/142/004.yaml
  text: 'Look to the right and see: there is no one who recognizes me[a]; refuge has perished from me[b]; no one seeks my life.'
translation:
  language: hi
  text: दाहिनी ओर नज़र डालो और देखो—मुझे पहचानने वाला कोई नहीं है। मेरे लिए शरण नहीं रही[a]; मेरे प्राण की सुधि लेने वाला कोई नहीं है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मेरे लिए बच निकलने का कोई मार्ग नहीं रहा”; इब्रानी शब्द शरणस्थान या बच निकलने के उपाय, दोनों को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से “मेरे प्राण को खोजने वाला कोई नहीं।” यहाँ “प्राण” का अर्थ “जीवन” या “स्वयं मैं” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבֵּיט יָמִין וּרְאֵה
  choice: दाहिनी ओर देखो और ध्यान दो
  rationale: दोनों आज्ञार्थक क्रियाओं का जोर बनाए रखते हुए यָמִין का स्थानवाचक अर्थ स्वाभाविक आधुनिक हिन्दी में व्यक्त किया गया है।
- source_word: מַכִּיר
  choice: पहचानने वाला
  rationale: यहाँ अर्थ केवल जानकारी रखने का नहीं, बल्कि संकट में व्यक्ति को पहचानने या स्वीकार करने का है; ‘पहचानने वाला’ मूल की सामाजिक उपेक्षा को बनाए रखता है।
- source_word: אָבַד מָנוֹס מִמֶּנִּי
  choice: शरण मुझसे जाती रही
  rationale: מָנוֹס शरण, बच निकलने की जगह या उपाय हो सकता है। यह वाक्य मूल के ‘मुझसे’ को बनाए रखते हुए शरण के अनुपलब्ध हो जाने का भाव देता है।
- source_word: דּוֹרֵשׁ לְנַפְשִׁי
  choice: मेरे प्राण की सुधि लेने वाला
  rationale: דרש का मूल भाव खोजने या पूछताछ करने का है, पर इस विलाप में किसी की दशा और कुशल की चिंता करने का आशय है। ‘सुधि लेने वाला’ उस भाव को स्वाभाविक हिन्दी में व्यक्त करता है और ‘प्राण’ נֶפֶשׁ के जीवन/स्व के अर्थ को खुला रखता है।
theological_decisions:
- issue: विलाप के संदर्भ में נֶפֶשׁ का अर्थ
  choice: मेरे प्राण
  alternative: मेरे जीवन; मेरी आत्मा; मेरी सुधि
  rationale: यहाँ נֶפֶשׁ संभवतः कवि के जीवन या स्वयं उसके व्यक्तित्व को सूचित करता है। ‘प्राण’ जीवन और व्यक्ति दोनों की छाया रखता है तथा शरीर से अलग किसी अमूर्त आत्मा का अर्थ अनावश्यक रूप से निश्चित नहीं करता।
- issue: דּוֹרֵשׁ का संबंध चिंता या खोज से
  choice: सुधि लेने वाला
  alternative: ढूँढ़ने वाला; खोज-खबर लेने वाला; चिंता करने वाला
  rationale: शाब्दिक ‘मेरे प्राण को ढूँढ़ने वाला’ हिन्दी में शत्रुतापूर्ण खोज भी समझा जा सकता है। ‘सुधि लेने वाला’ संदर्भगत उपेक्षा को स्पष्ट करता है, जबकि मूल के पूछने/खोजने के भाव को पर्याप्त रूप से सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, काव्यात्मक किंतु सामान्य पाठक के लिए सहज रूप। ‘सुधि लेना’ साहित्यिक होने पर भी प्रचलित और प्रसंगानुकूल है; अत्यधिक संस्कृतनिष्ठ या सांप्रदायिक शब्दावली से बचा गया है।
