source:
  edition: WLC
  text: זָעַ֥קְתִּי אֵלֶ֗י/ךָ יְה֫וָ֥ה אָ֭מַרְתִּי אַתָּ֣ה מַחְסִ֑/י חֶ֝לְקִ֗/י בְּ/אֶ֣רֶץ הַֽ/חַיִּים׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/142/005.yaml
  text: I cried out to you[a], O Yahweh; I said, “You are my refuge, my portion in the land of the living.”
translation:
  language: hi
  text: 'मैंने आपको पुकारा, हे याहवे;

    मैंने कहा, “आप ही मेरा शरणस्थान हैं,

    जीवितों की भूमि में मेरा भाग।”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זָעַקְתִּי
  choice: मैंने दुहाई दी
  rationale: यह क्रिया सहायता के लिए की गई तीव्र पुकार व्यक्त करती है; ‘दुहाई दी’ प्रार्थनापूर्ण आग्रह और तीव्रता दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: אֵלֶיךָ
  choice: आपकी
  rationale: ‘आपकी दुहाई दी’ हिन्दी में लक्ष्यसूचक अर्थ को मुहावरेदार ढंग से व्यक्त करता है; इसका आशय सीधे परमेश्वर को पुकारना है।
- source_word: יְהוָה
  choice: हे यहोवा
  rationale: मूल पाठ के व्यक्तिगत वाचा-नाम को उपाधि से बदलने के बजाय देवनागरी में प्रचलित रूप ‘यहोवा’ रखा गया है; ‘हे’ प्रत्यक्ष सम्बोधन स्पष्ट करता है।
- source_word: אָמַרְתִּי
  choice: मैंने कहा
  rationale: साधारण पूर्ण भूतकाल समानांतर क्रिया-क्रम को सीधे और स्वाभाविक रूप में रखता है।
- source_word: אַתָּה
  choice: आप ही
  rationale: स्वतंत्र सर्वनाम के बल को हिन्दी में ‘ही’ द्वारा व्यक्त किया गया है, बिना कथन में कोई अतिरिक्त सिद्धान्तगत निष्कर्ष जोड़े।
- source_word: מַחְסִי
  choice: मेरा शरणस्थान
  rationale: यह आश्रय और सुरक्षा के स्थान का अर्थ देता है; ‘शरणस्थान’ भजन-साहित्य के अनुरूप, स्पष्ट और गरिमापूर्ण है।
- source_word: חֶלְקִי
  choice: मेरा भाग
  rationale: ‘भाग’ आवंटित हिस्से और जीवन के आधार—दोनों सम्भावित भावों को बनाए रखता है; ‘विरासत’ मूल से अधिक व्याख्यात्मक होती।
- source_word: בְּאֶרֶץ הַחַיִּים
  choice: जीवितों की धरती में
  rationale: यह सांसारिक जीवन के क्षेत्र को मृत्यु/अधोलोक के विपरीत रखने वाले इब्रानी मुहावरे का निकट और समझने योग्य रूप है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु / याहवे
  rationale: मूल में उपाधि नहीं बल्कि चतुरक्षरीय व्यक्तिगत नाम है। ‘यहोवा’ हिन्दी बाइबलीय प्रयोग में पहचाना जाने वाला नामरूप है और नाम को उपाधि में बदलने से बचाता है; ‘याहवे’ अधिक प्रत्यक्ष विद्वत्तापरक लिप्यन्तरण है, पर सामान्य हिन्दी पाठकों में अपेक्षाकृत कम परिचित है।
- issue: חֶלְקִי का भाव
  choice: मेरा भाग
  alternative: मेरी विरासत / मेरा हिस्सा
  rationale: ‘भाग’ परमेश्वर को प्रार्थी के आवंटित और पर्याप्त हिस्से के रूप में कहने की धर्मवैचारिक गहराई रखता है, फिर भी ‘विरासत’ जैसा अधिक निश्चित अर्थ आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, प्रार्थनात्मक शैली रखी गई है। परमेश्वर के लिए आदरसूचक ‘आप’ प्रयुक्त है। पंक्ति-विन्यास इब्रानी समानांतरता को स्पष्ट करता है।
