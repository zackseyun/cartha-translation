  yaml_path: translation/ot/psalms/142/001.yaml
  text: With my voice I cry out to Yahweh[c][b][a]; with my voice I plead to Yahweh for mercy.
translation:
  language: hi
  text: 'अपनी आवाज़ से मैं याहवे को पुकारता हूँ;

    अपनी आवाज़ से मैं याहवे से दया की विनती करता हूँ।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ק֭וֹלִי
  choice: अपनी आवाज़ से
  rationale: शाब्दिक अर्थ ‘मेरी आवाज़’ है। ‘अपनी आवाज़ से’ पद के आरंभिक बल और दोनों पंक्तियों की ठोस पुनरावृत्ति को बनाए रखता है; ‘ऊँचे स्वर से’ अधिक स्वाभाविक होता, पर मूल शब्द और उसकी पुनरावृत्ति को कुछ हद तक खो देता।
- source_word: אֶל
  choice: को / से
  rationale: यह संबंध और दिशा याहवे की ओर होने को दर्शाता है। आधुनिक हिन्दी में ‘पुकारना’ के साथ ‘को’ और ‘विनती करना’ के साथ ‘से’ स्वाभाविक कारक हैं।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम का हिन्दी लिप्यंतरण किया गया है; इसे किसी उपाधि से नहीं बदला गया।
- source_word: אֶזְעָק
  choice: मैं पुकारता हूँ
  rationale: זעק संकट या तीव्र आवश्यकता में जोर से पुकारने का भाव रखता है। ‘पुकारता हूँ’ आधुनिक, स्पष्ट और साथ आए ‘अपनी आवाज़ से’ के कारण पर्याप्त रूप से तीव्र है।
- source_word: אֶתְחַנָּן
  choice: मैं दया की विनती करता हूँ
  rationale: חנן का हित्पएल रूप कृपा या दया पाने के लिए गिड़गिड़ाकर निवेदन करने का भाव देता है। यह चयन अर्थ को स्पष्ट और गरिमापूर्ण आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में उपाधि नहीं, व्यक्तिगत ईश्वरीय नाम है। ‘याहवे’ उसके प्रचलित विद्वत्तापूर्ण उच्चारण का निकट हिन्दी लिप्यंतरण है और नाम तथा उपाधि के भेद को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक रखी गई है। दोनों अर्धपंक्तियों में ‘अपनी आवाज़ से’ की पुनरावृत्ति जानबूझकर सुरक्षित रखी गई है, क्योंकि वही इब्रानी समानांतरता और बल का प्रमुख अंग है।
