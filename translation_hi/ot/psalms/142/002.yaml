lexical_decisions:
- source_word: אֶשְׁפֹּךְ
  choice: उंडेलता हूँ
  rationale: שׁפך का मूल बिंब किसी वस्तु को उंडेलने का है। प्रार्थना और विलाप के संदर्भ में “अपनी शिकायत उंडेलता हूँ” स्वाभाविक हिन्दी है और मन की बात खुलकर कह देने की तीव्रता को बनाए रखता है।
- source_word: לְפָנָיו
  choice: उसके सामने
  rationale: शाब्दिक अर्थ “उसके मुख/उपस्थिति के सामने” है। “उसके सामने” सहज हिन्दी में परमेश्वर की उपस्थिति का भाव रखता है। इब्रानी समानांतरता के अनुसार दोनों पंक्तियों में इसकी पुनरावृत्ति बनाए रखी गई है।
- source_word: שִׂיחִי
  choice: अपनी शिकायत
  rationale: שׂיח मनन, मन की बात अथवा शिकायत को सूचित कर सकता है। विलाप के इस संदर्भ में, और “मेरे संकट” के समानांतर होने के कारण, मुखर व्यथा या शिकायत का अर्थ अधिक संभावित है।
- source_word: צָרָתִי
  choice: अपना संकट
  rationale: צָרָה संकट, मुसीबत, पीड़ा या विपत्ति को दर्शाता है। “संकट” संक्षिप्त और व्यापक है तथा बाहरी परिस्थिति और उससे उपजी व्याकुलता—दोनों के लिए उपयुक्त है।
- source_word: אַגִּיד
  choice: बयान करता हूँ
  rationale: נגד के हिफ़ील रूप का अर्थ बताना, प्रकट करना या बयान करना है। “बयान करता हूँ” जानबूझकर अपनी दशा परमेश्वर के सामने रखने का भाव देता है और आधुनिक हिन्दी में स्वाभाविक है।
