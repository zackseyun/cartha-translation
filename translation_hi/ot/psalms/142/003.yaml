  text: בְּ/הִתְעַטֵּ֬ף עָלַ֨/י רוּחִ֗/י וְ/אַתָּה֮ יָדַ֪עְתָּ נְֽתִיבָ֫תִ֥/י בְּ/אֹֽרַח ז֥וּ אֲהַלֵּ֑ךְ טָמְנ֖וּ פַ֣ח לִֽ/י׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/142/003.yaml
  text: When my spirit grows faint within me[a], you know my path. On the way where I walk[b], they have hidden a trap for me.
translation:
  language: hi
  text: जब मेरी आत्मा मेरे भीतर निढाल हो जाती है[a], तब तू मेरा मार्ग जानता है। जिस रास्ते पर मैं चलता हूँ, वहाँ उन्होंने मेरे लिए फंदा छिपाया है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जब मेरी आत्मा मेरे भीतर अभिभूत हो जाती है।”
    reason: lexical_alternative
  - marker: b
    text: या, “जाल।”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּ/הִתְעַטֵּף
  choice: जब ... मूर्छित होने लगती है
  rationale: בְּ के साथ infinitive construct समयसूचक उपवाक्य बनाता है। क्रिया निर्बल पड़ने, मूर्छित होने या व्याकुल होकर ढह जाने का भाव दे सकती है; यह चयन संकट की तीव्रता को स्वाभाविक हिन्दी में रखता है।
- source_word: רוּחִי
  choice: मेरी आत्मा
  rationale: यहाँ רוּחַ भजनकार के भीतरी जीवन और चेतना को दर्शाता है, न कि हवा को; ‘मेरी आत्मा’ सीधा और प्रचलित हिन्दी रूप है।
- source_word: עָלַי
  choice: मेरे भीतर
  rationale: शाब्दिक अर्थ ‘मुझ पर’ है, पर רוּחִי के मूर्छित होने के मुहावरे में आंतरिक दशा व्यक्त करने के लिए ‘मेरे भीतर’ अधिक स्वाभाविक है।
- source_word: יָדַעְתָּ
  choice: तू ... जानता है
  rationale: काव्य में qatal यहाँ वर्तमान स्थायी अवस्था व्यक्त कर सकता है; प्रार्थना के सीधे संबोधन में वर्तमान काल उपयुक्त है।
- source_word: נְתִיבָתִי
  choice: मेरा मार्ग
  rationale: संज्ञा पगडंडी, मार्ग या जीवन-क्रम को सूचित करती है; ‘मेरा मार्ग’ यात्रा और जीवन-दिशा दोनों की उपमा बनाए रखता है।
- source_word: בְּאֹרַח
  choice: जिस रास्ते पर
  rationale: אֹרַח मार्ग या रास्ता है। ‘रास्ते’ का प्रयोग पहले आए ‘मार्ग’ की असहज पुनरावृत्ति घटाता है और यात्रा-बिंब सुरक्षित रखता है।
- source_word: זוּ
  choice: जिस
  rationale: यहाँ זוּ संबंधवाचक अव्यय है, जो आगे के उपवाक्य को ‘रास्ते’ से जोड़ता है।
- source_word: אֲהַלֵּךְ
  choice: मैं चलता हूँ
  rationale: הלך का यह रूप निरंतर गति या आचरण का भाव देता है; ‘चलता हूँ’ मूल यात्रा-बिंब को बनाए रखता है।
- source_word: טָמְנוּ
  choice: उन्होंने ... छिपा रखा है
  rationale: क्रिया किसी वस्तु, विशेषतः जाल या फंदे, को गुप्त रूप से छिपाने की पूर्ण की गई क्रिया बताती है जिसका प्रभाव वर्तमान में है।
- source_word: פַח
  choice: फंदा
  rationale: פַח ऐसा फंदा या जाल है जो शिकार को पकड़ने के लिए छिपाया जाता है; ‘फंदा’ सामान्य आधुनिक हिन्दी में स्पष्ट है।
- source_word: לִי
  choice: मेरे लिए
  rationale: पूर्वसर्ग बताता है कि फंदा भजनकार को पकड़ने के उद्देश्य से लगाया गया है; ‘मेरे लिए’ मूल की संक्षिप्तता बनाए रखता है।
theological_decisions:
- issue: भजनकार के मार्ग के विषय में परमेश्वर का ज्ञान
  choice: तू मेरा मार्ग जानता है
  alternative: तू मेरा मार्ग जानता था / तूने मेरा मार्ग जान लिया है
  rationale: काव्यात्मक पूर्ण रूप को वर्तमान स्थायी ज्ञान के रूप में पढ़ना प्रसंग के सीधे प्रार्थनात्मक संबोधन से मेल खाता है, पर इसमें मूल से आगे कोई व्यवस्थित धर्मवैज्ञानिक दावा नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, सीधे प्रार्थनात्मक संबोधन के लिए ‘तू’, और काव्यात्मक किंतु सामान्य पाठक के लिए सुबोध शब्दावली। ‘आत्मा’, ‘मार्ग’ और ‘फंदा’ मूल के प्रमुख बिंब सुरक्षित रखते हैं।
