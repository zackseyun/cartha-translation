  yaml_path: translation/ot/psalms/142/006.yaml
  text: Attend to my cry[a], for I am brought very low; deliver me from my pursuers[c][b], for they are stronger than I.
translation:
  language: hi
  text: मेरी पुकार पर ध्यान दे[a], क्योंकि मैं बहुत निर्बल हो गया हूँ[b]। मेरा पीछा करने वालों से मुझे छुड़ा[c], क्योंकि वे मुझसे अधिक शक्तिशाली हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरी पुकार सुन।” हिब्रू क्रिया ध्यानपूर्वक सुनने का भाव रखती है।
    reason: lexical_alternative
  - marker: b
    text: या, “मैं बहुत दीन दशा में पहुँच गया हूँ,” अथवा “मैं बहुत कमजोर हो गया हूँ।” हिब्रू में अत्यधिक घट जाने या निर्बल हो जाने का भाव है।
    reason: lexical_alternative
  - marker: c
    text: या, “मेरा पीछा करने वालों से मुझे बचा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקְשִׁיבָה
  choice: ध्यान दे
  rationale: यह आज्ञार्थक क्रिया केवल सुनने नहीं, बल्कि ध्यानपूर्वक सुनने का भाव व्यक्त करती है; आधुनिक हिंदी में यह सहज और प्रार्थनापूर्ण है।
- source_word: רִנָּתִי
  choice: मेरी पुकार
  rationale: विलाप के संदर्भ में רִנָּה सहायता के लिए उठाई गई ऊँची पुकार को दर्शाता है; ‘पुकार’ गीत या जयघोष की अपेक्षा प्रसंगानुकूल है।
- source_word: דַלּוֹתִי מְאֹד
  choice: मैं बहुत निर्बल हो गया हूँ
  rationale: דלל अत्यधिक घट जाने, दुर्बल होने या दीन दशा में पहुँचने का भाव रखता है। यह अनुवाद परिणामी अवस्था और מְאֹד की तीव्रता दोनों को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: הַצִּילֵנִי
  choice: मुझे छुड़ा
  rationale: निफ़ाल/हिफ़ील रूप נצל यहाँ मानवीय पीछा करनेवालों से ठोस बचाव की याचना है; ‘छुड़ा’ व्यापक धर्मशास्त्रीय अर्थ आरोपित किए बिना प्रसंग को स्पष्ट रखता है।
- source_word: מֵרֹדְפַי
  choice: मेरा पीछा करनेवालों से
  rationale: רדף का कृदंत उन लोगों को दर्शाता है जो सक्रिय रूप से पीछा कर रहे हैं; यह ‘शत्रुओं’ से अधिक सटीक और ‘सतानेवालों’ से कम संकीर्ण है।
- source_word: אָמְצוּ מִמֶּנִּי
  choice: वे मुझसे अधिक शक्तिशाली हैं
  rationale: אמץ शक्ति का और מן तुलनात्मक संबंध का बोध कराता है; यह वाक्यांश मूल का सीधा तथा स्वाभाविक हिंदी रूप है।
theological_decisions:
- issue: הַצִּילֵנִי का व्यापक ‘उद्धार’ अथवा प्रसंगगत बचाव
  choice: मुझे छुड़ा
  alternative: मुझे बचा / मेरा उद्धार कर
  rationale: यहाँ संकट स्पष्टतः मानवीय पीछा करनेवालों से है। ‘छुड़ा’ उसी ठोस मुक्ति को व्यक्त करता है और पद में निहित न होनेवाला व्यापक सिद्धान्तगत अर्थ नहीं जोड़ता।
- issue: דַלּוֹתִי की अवस्था—निर्बलता या नीचा लाया जाना
  choice: मैं बहुत निर्बल हो गया हूँ
  alternative: मैं बहुत दीन दशा में पहुँच गया हूँ / मुझे बहुत नीचे गिरा दिया गया है
  rationale: हिब्रू रूप अत्यधिक घटने या दुर्बल होने की परिणामी अवस्था को व्यक्त कर सकता है और कर्ता को स्पष्ट नहीं करता। चुना हुआ रूप इस अस्पष्टता को यथासंभव बनाए रखते हुए सहज हिंदी देता है।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी में, प्रार्थनापूर्ण और गरिमापूर्ण रखी गई है। ‘ध्यान दे,’ ‘निर्बल,’ और ‘छुड़ा’ सामान्य पाठक के लिए बोधगम्य हैं, जबकि काव्यात्मक संक्षिप्तता बनी रहती है। संबोधन एकवचन निकटता वाले रूप में है, जैसा हिंदी बाइबिलीय प्रार्थना-शैली में स्वाभाविक है।
