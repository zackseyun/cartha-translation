source:
  edition: WLC
  text: ה֘וֹצִ֤יאָ/ה מִ/מַּסְגֵּ֨ר נַפְשִׁ/י֮ לְ/הוֹד֪וֹת אֶת שְׁ֫מֶ֥/ךָ בִּ֭/י יַכְתִּ֣רוּ צַדִּיקִ֑ים כִּ֖י תִגְמֹ֣ל עָלָֽ/י׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/142/007.yaml
  text: Bring my soul out of prison[a], so that I may give thanks to your name; the righteous will gather around me, for you will deal bountifully with me.
translation:
  language: hi
  text: मेरे प्राण को बंदीगृह से निकाल ला, ताकि मैं तेरे नाम का धन्यवाद करूँ; धर्मी मेरे चारों ओर इकट्ठे होंगे[a], क्योंकि तू मेरे साथ भलाई करेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या “धर्मी मुझे चारों ओर से घेर लेंगे”; हिब्रू क्रिया का एक अधिक असामान्य अर्थ यह भी हो सकता है: “धर्मी मेरे कारण अपने को मुकुट पहनाएँगे” या “मेरे कारण गौरव करेंगे।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹצִיאָה
  choice: निकाल ला
  rationale: יצא के हिफ़ील आज्ञार्थक का कारणवाचक भाव है—बाहर निकालने की विनती। ‘निकाल ला’ प्रार्थना की सीधी और स्वाभाविक हिन्दी है।
- source_word: מִמַּסְגֵּר
  choice: बंदीगृह से
  rationale: מַסְגֵּר बंद किए जाने के स्थान या कारागार को दर्शाता है। ‘बंदीगृह’ गरिमापूर्ण और स्पष्ट आधुनिक हिन्दी है।
- source_word: נַפְשִׁי
  choice: मेरे प्राण को
  rationale: נֶפֶשׁ यहाँ व्यक्ति के जीवन, अंतर्मन और समूचे अस्तित्व को व्यक्त कर सकता है। ‘मेरे प्राण’ हिब्रू अभिव्यक्ति का भाव बनाए रखता है और केवल शारीरिक मुक्ति तक अर्थ को सीमित नहीं करता।
- source_word: לְהוֹדוֹת
  choice: ताकि मैं ... धन्यवाद करूँ
  rationale: ידה का हिफ़ील धन्यवाद या स्तुति व्यक्त करता है; לְ उद्देश्य बताता है। यह रचना उस प्रयोजन को स्वाभाविक हिन्दी में स्पष्ट करती है।
- source_word: אֶת שְׁמֶךָ
  choice: तेरे नाम का
  rationale: ‘नाम’ को बनाए रखने से परमेश्वर के प्रकट व्यक्तित्व और प्रतिष्ठा का बाइबलीय भाव सुरक्षित रहता है। हिन्दी में ‘नाम का धन्यवाद करना’ स्वाभाविक धार्मिक अभिव्यक्ति है।
- source_word: יַכְתִּרוּ ... בִּי
  choice: मेरे चारों ओर इकट्ठे होंगे
  rationale: כתר का हिफ़ील घेरने या चारों ओर होने का अर्थ दे सकता है, जबकि בִּי का संबंध अस्पष्ट है। चुना गया अनुवाद समुदाय के उद्धार पाए भजनकार के पास एकत्र होने का सुसंगत चित्र देता है; अन्य संभावनाएँ पादटिप्पणी में रखी गई हैं।
- source_word: צַדִּיקִים
  choice: धर्मी
  rationale: यह विशेषण संज्ञा के रूप में धर्मी लोगों को दर्शाता है। ‘धर्मी’ संक्षिप्त और प्रचलित है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह अंतिम उपवाक्य को धर्मियों की प्रतिक्रिया के कारण के रूप में जोड़ता है।
- source_word: תִגְמֹל עָלָי
  choice: तू मेरे साथ भलाई करेगा
  rationale: גמל על किसी के साथ किए गए व्यवहार को दर्शा सकता है और प्रसंग में हितकारी कार्य अपेक्षित है। ‘भलाई करेगा’ उदार कृपा का भाव देता है, पर अर्जित पुरस्कार का अर्थ अनिवार्य नहीं बनाता।
theological_decisions:
- issue: क्या अंतिम उपवाक्य योग्यता के आधार पर प्रतिफल सिखाता है
  choice: परमेश्वर भजनकार के साथ भलाई करेगा
  alternative: परमेश्वर भजनकार को उसके पुण्य के अनुसार प्रतिफल देगा
  rationale: विलाप और उद्धार की आशा के इस प्रसंग में גמל हितकारी व्यवहार भी व्यक्त कर सकता है। अनुवाद सकारात्मक प्रत्याशा को रखता है, पर पाठ से परे जाकर अर्जित प्रतिफल का सिद्धांत नहीं जोड़ता।
- issue: धर्मियों की प्रतिक्रिया का सटीक स्वरूप
  choice: वे भजनकार के चारों ओर इकट्ठे होंगे
  alternative: वे उसे घेर लेंगे; अथवा उसके कारण अपने को मुकुट पहनाएँगे/गौरव करेंगे
  rationale: כתר और בִּי का संयोजन दुर्लभ और अर्थगत रूप से कठिन है। मुख्य पाठ प्रसंगानुकूल सामुदायिक प्रतिक्रिया देता है और वास्तविक वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण प्रार्थनात्मक रूप; ईश्वर के लिए एकवचन आत्मीय ‘तू/तेरे’ का प्रयोग भजन-साहित्य की सीधी संबोधन शैली के अनुरूप है। मुख्य पाठ में अर्थगत स्पष्टता रखी गई है, जबकि כתר और בִּי की वास्तविक अस्पष्टता पादटिप्पणी में सुरक्षित है।
