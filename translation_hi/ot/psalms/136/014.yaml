  text: וְ/הֶעֱבִ֣יר יִשְׂרָאֵ֣ל בְּ/תוֹכ֑/וֹ כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/136/014.yaml
  text: and brought Israel through the midst of it[b][a], for his steadfast love endures forever.
translation:
  language: hi
  text: 'और इस्राएल को उसके बीच से पार कराया,

    क्योंकि उसकी अटल करुणा सदा बनी रहती है।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्द חֶסֶד का अनुवाद प्रसंग के अनुसार “वाचा की निष्ठा” या “दया” भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֶעֱבִיר
  choice: और ... पार कराया
  rationale: עבר का हिफ़ील रूप किसी को पार कराने का कारणात्मक भाव देता है। हिंदी में “पार कराया” इस भाव और गति—दोनों को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: יִשְׂרָאֵל
  choice: इस्राएल
  rationale: व्यक्तिवाचक नाम का प्रचलित मानक हिंदी लिप्यंतरण।
- source_word: בְּתוֹכוֹ
  choice: उसके बीच से
  rationale: वाक्यांश का शाब्दिक स्थानिक भाव “उसके मध्य में/से” है; पिछले पद के समुद्र की ओर संकेत करते हुए “उसके बीच से” गुजरने की गति को स्पष्ट रखता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह भजन के आवर्ती कथन में पहले खंड में वर्णित स्तुति-कर्म का आधार प्रस्तुत करता है।
- source_word: לְעוֹלָם
  choice: सदा बनी रहती है
  rationale: मूल इब्रानी में क्रिया नहीं है। सहज हिंदी के लिए क्रिया जोड़ी गई है, और इससे निरंतर स्थायित्व का भाव व्यक्त होता है।
- source_word: חַסְדּוֹ
  choice: उसकी अटल करुणा
  rationale: חֶסֶד में दयालु प्रेम, निष्ठा और स्थिरता के जुड़े हुए भाव हैं। “अटल करुणा” आधुनिक हिंदी में संक्षिप्त और बोधगम्य है, जबकि पादटिप्पणी वैकल्पिक वाचा-संबंधी अर्थ बताती है।
theological_decisions:
- issue: भजन 136 के आवर्ती कथन में חֶסֶד का अनुवाद
  choice: उसकी अटल करुणा सदा बनी रहती है
  alternative: उसकी वाचा की निष्ठा सदा बनी रहती है; उसकी दया सदा बनी रहती है
  rationale: “अटल करुणा” परमेश्वर की दयालुता और उसके स्थायी, विश्वसनीय चरित्र—दोनों को समेटती है। पादटिप्पणी शब्द के वाचा-संबंधी और दया-संबंधी अर्थों को खुला रखती है, बिना किसी संप्रदायगत व्याख्या को निर्णायक बनाए।
translation_notes:
  register: आधुनिक मानक हिंदी में काव्यात्मक, गरिमापूर्ण और सामान्य पाठक के लिए सहज शैली। मूल के कारणात्मक क्रियारूप और स्थानिक चित्र को बनाए रखा गया है। पादटिप्पणी चिह्न मुख्य पाठ में संबद्ध आवर्ती पंक्ति के अंत में दिया गया है।
