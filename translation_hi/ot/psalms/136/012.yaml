  rationale: The revision replaces the potentially misleading ‘बढ़ाई हुई’ with ‘फैलाई हुई’ to express the outstretched-arm image accurately, updates ‘बलवन्त’ to modern-standard ‘बलशाली,’ and uses ‘अटल प्रेम’ for חֶסֶד so that the main line does not reduce the term to compassion alone. The footnote preserves its lexical range and the verse’s concise, liturgical cadence.
