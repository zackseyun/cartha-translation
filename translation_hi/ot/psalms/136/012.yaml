review_pass:
  verdict: revise
  source_fidelity: The draft preserves the instrumental force of בְּ (‘से’), the paired Exodus imagery of hand and arm, and the causal/refrain structure. However, ‘बढ़ाई हुई भुजा’ can mean an enlarged arm rather than an arm extended in action, and ‘अटल करुणा’ narrows חֶסֶד toward compassion/mercy more than the source requires.
  naturalness: ‘बलवन्त’ is understandable but somewhat archaic for modern standard Hindi. ‘बलशाली हाथ’ and ‘फैलाई हुई भुजा’ are natural, dignified, and retain the poetic image. ‘सदा बनी रहती है’ is idiomatic in the refrain.
  terminology: Render חֶסֶד as ‘अटल प्रेम’ here, with a footnote noting its possible senses of loyal/covenantal love and mercy. This better reflects the semantic breadth of the term than ‘करुणा’ while remaining readable and suitable for the repeated refrain.
  issues:
  - severity: medium
    issue: ‘बढ़ाई हुई भुजा’ is semantically imprecise.
    rationale: नְטוּיָה means ‘stretched out/outstretched.’ In Hindi, ‘बढ़ाई हुई’ commonly suggests made larger or increased, not extended outward.
  - severity: medium
    issue: ‘अटल करुणा’ restricts the sense of חֶסֶד.
    rationale: Though mercy/compassion can be within the range of חֶסֶד, the word also centrally conveys enduring loyal love. ‘अटल प्रेम,’ qualified in a footnote, more adequately preserves the breadth without imposing a technical doctrinal rendering.
  - severity: low
    issue: ‘बलवन्त’ is less natural in the requested modern standard register.
    rationale: ‘बलशाली’ is current standard Hindi and retains the force of חֲזָקָה.
