  - marker: b
    text: “अटल प्रेम” इब्रानी शब्द हेसेद का अनुवाद है। इसमें स्थायी, निष्ठावान प्रेम, दया, और संबंध अथवा वाचा के प्रति निष्ठा के भाव हो सकते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיָד חֲזָקָה
  choice: बलवन्त हाथ से
  rationale: בְּ साधन का बोध कराता है। ‘बलवन्त हाथ’ मूल बिंब और निर्गमन-सम्बन्धी सूत्रात्मक भाषा को बनाए रखता है।
- source_word: וּבִזְרוֹעַ נְטוּיָה
  choice: और बढ़ाई हुई भुजा से
  rationale: ‘भुजा’ इब्रानी बिंब को सुरक्षित रखती है; נְטוּיָה क्रिया में आगे बढ़ी या फैलाई हुई भुजा को दर्शाता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह स्तुति के आधार का परिचय देता है और भजन के आवर्ती उत्तर में स्वाभाविक हिन्दी है।
- source_word: לְעוֹלָם
  choice: सदा बनी रहती है
  rationale: शाब्दिक अर्थ ‘सदा के लिए’ है; हिन्दी में חֶסֶד के साथ यह क्रियात्मक पूर्ति स्थायित्व को स्वाभाविक रूप से व्यक्त करती है।
- source_word: חַסְדּוֹ
  choice: उसकी अटल करुणा
  rationale: חֶסֶד में कृपा, निष्ठा और स्थायी सम्बन्धपरक प्रेम का व्यापक भाव है। ‘अटल करुणा’ सामान्य हिन्दी में पठनीय रहते हुए उसकी स्थिरता और कृपालुता दोनों को सामने लाती है।
theological_decisions:
- issue: भजन 136 के आवर्ती पद में חֶסֶד का अनुवाद
  choice: उसकी अटल करुणा सदा बनी रहती है
  alternative: उसका अटल प्रेम सदा बना रहता है; उसकी वाचा की निष्ठा सदा बनी रहती है; उसकी दया सदा बनी रहती है
  rationale: ‘अटल करुणा’ पद को केवल भावनात्मक प्रेम, केवल दया, या केवल तकनीकी वाचागत शब्दावली तक सीमित नहीं करती; पादटिप्पणी मूल शब्द की व्यापकता स्पष्ट करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सामूहिक पाठ के अनुकूल शैली। ‘हाथ’ और ‘भुजा’ के मूल बिंब सुरक्षित रखे गए हैं; आवर्ती पंक्ति को सहज और स्मरणीय रखा गया है।
