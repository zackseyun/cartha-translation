  text: and rescued us from our foes[a], for his steadfast love endures forever.
translation:
  language: hi
  text: और हमें हमारे शत्रुओं से छुड़ाया[a], क्योंकि उसका अटल प्रेम सदा बना रहता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘और हमें हमारे बैरियों से बचाया।’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְרְקֵנוּ
  choice: और हमें…छुड़ाया
  rationale: פרק का रूप 1cp कर्म-प्रत्यय सहित है और संकट अथवा शत्रु के वश से मुक्त करने का भाव देता है। ‘छुड़ाया’ आधुनिक हिन्दी में स्वाभाविक है और उद्धार की व्यापक क्रिया को व्यक्त करता है।
- source_word: מִצָּרֵינוּ
  choice: हमारे शत्रुओं से
  rationale: बहुवचन रूप उन लोगों को सूचित करता है जो विरोधी या उत्पीड़क हैं। ‘शत्रुओं’ सामान्य, स्पष्ट और गरिमापूर्ण हिन्दी है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह भजन के आवर्ती कथन में परमेश्वर की स्तुति का आधार बताता है। ‘क्योंकि’ हिन्दी में इस कारणसूचक संबंध को स्पष्ट और स्वाभाविक रूप से रखता है।
- source_word: לְעוֹלָם
  choice: सदा बनी रहती है
  rationale: शाब्दिक अर्थ ‘सदा के लिए’ है। חֶסֶד के साथ ‘सदा बनी रहती है’ निरंतर स्थायित्व को सहज हिन्दी में व्यक्त करता है।
- source_word: חַסְדּוֹ
  choice: उसकी अटल करुणा
  rationale: חֶסֶד में निष्ठावान प्रेम, दया और दृढ़ कृपा का संयुक्त भाव है। ‘अटल करुणा’ परमेश्वर की स्थिर दयालु निष्ठा को संक्षेप में व्यक्त करती है और केवल भावुक प्रेम या केवल दया तक अर्थ को सीमित नहीं करती।
theological_decisions:
- issue: भजन 136 के आवर्ती कथन में חֶסֶד का अनुवाद
  choice: उसकी अटल करुणा सदा बनी रहती है
  alternative: उसका अटल प्रेम सदा बना रहता है; उसकी दया सदा बनी रहती है
  rationale: ‘अटल करुणा’ परमेश्वर के प्रेमपूर्ण अनुग्रह और स्थायी निष्ठा दोनों को बनाए रखती है। ‘दया’ अकेले मूल शब्द के अर्थ को संकरा कर सकती है, जबकि ‘अटल प्रेम’ करुणा के पहलू को कम स्पष्ट करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; वाक्य संक्षिप्त, गरिमापूर्ण और भजन के आवर्ती उपासना-संबंधी लय के अनुकूल रखा गया है। ‘छुड़ाया’ तथा ‘शत्रुओं’ सामान्य पाठकों के लिए स्पष्ट हैं।
