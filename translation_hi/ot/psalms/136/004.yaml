  yaml_path: translation/ot/psalms/136/004.yaml
  text: to him who alone does great wonders[b][a], for his steadfast love endures forever.
translation:
  language: hi
  text: 'उसको जो अकेला ही बड़े-बड़े अद्भुत काम करता है[a],

    क्योंकि उसका अटल प्रेम सदा बना रहता है।[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘अद्भुत काम’ का अनुवाद ‘आश्चर्यकर्म’ या ‘विस्मयकारी काम’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘अटल प्रेम’ इब्रानी शब्द ‘हेसेद’ का अनुवाद है, जिसमें प्रेमपूर्ण कृपा, निष्ठा और वाचा के प्रति स्थिर प्रतिबद्धता के भाव हो सकते हैं; अन्य अनुवाद हैं ‘दया’, ‘करुणा’ या ‘वाचा की निष्ठा’।
    reason: lexical_alternative
lexical_decisions:
- source_word: לְעֹשֵׂה
  choice: उसी को जो ... करता है
  rationale: לְ दातृकारक भाव में भजन के बार-बार आने वाले ‘धन्यवाद करो’ से जुड़ता है, और कृदंत עֹשֵׂה परमेश्वर के स्थायी गुण को व्यक्त करता है। ‘उसी को जो ... करता है’ हिन्दी में स्वाभाविक है और अगले शब्द לְבַדּוֹ की विशिष्टता भी उभारता है।
- source_word: נִפְלָאוֹת גְּדֹלוֹת
  choice: बड़े-बड़े अद्भुत काम
  rationale: नִפְלָאוֹת असाधारण, विस्मय उत्पन्न करने वाले कामों को और גְּדֹלוֹת उनकी महानता को व्यक्त करता है। ‘बड़े-बड़े अद्भुत काम’ सहज आधुनिक हिन्दी में दोनों तत्व सुरक्षित रखता है।
- source_word: לְבַדּוֹ
  choice: अकेला
  rationale: यह परमेश्वर की अनन्यता पर बल देता है—ऐसे महान अद्भुत काम वही करता है। ‘अकेला’ संक्षिप्त और स्पष्ट है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह स्तुति का कारण बताने वाले आवर्ती प्रत्युत्तर को आरम्भ करता है; ‘क्योंकि’ हिन्दी में उसके कारणात्मक अर्थ को स्पष्ट रखता है।
- source_word: לְעוֹלָם
  choice: सदा बनी रहती है
  rationale: मूल इब्रानी खंड क्रियारहित है। हिन्दी में आवश्यक क्रिया जोड़कर ‘सदा बनी रहती है’ निरंतरता और स्थायित्व दोनों व्यक्त करता है।
- source_word: חַסְדּוֹ
  choice: उसकी अटल करुणा
  rationale: חֶסֶד में प्रेमपूर्ण कृपा, निष्ठा और अटल प्रतिबद्धता के अर्थ जुड़े हैं। ‘अटल करुणा’ पाठ में सहज और गरिमामय है; फुटनोट इसके व्यापक अर्थक्षेत्र को स्पष्ट करता है।
theological_decisions:
- issue: חַסְדּוֹ לְעוֹלָם आवर्ती प्रत्युत्तर का अनुवाद
  choice: क्योंकि उसकी अटल करुणा सदा बनी रहती है
  alternative: क्योंकि उसका अटल प्रेम सदा बना रहता है; क्योंकि उसकी वाचा की निष्ठा सदा की है
  rationale: ‘अटल करुणा’ परमेश्वर की कृपालु भलाई और स्थिर निष्ठा को संक्षेप में रखती है, जबकि केवल ‘दया’ अर्थ को संकरा कर सकती है और ‘वाचा की निष्ठा’ मूल शब्द के एक निहित पक्ष को अनावश्यक रूप से स्पष्ट कर सकती है। विकल्प फुटनोट में सुरक्षित हैं।
- issue: לְבַדּוֹ में परमेश्वर की अनन्यता
  choice: जो अकेला ... करता है
  alternative: जो अपने आप ... करता है; केवल वही ... करता है
  rationale: ‘अकेला’ मूल की विशिष्टता को बिना यह तय किए सुरक्षित रखता है कि बल सहायता के अभाव पर है या अद्वितीय कर्तृत्व पर।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमामय, सामूहिक पाठ के योग्य काव्यात्मक शैली। ‘बड़े-बड़े’ सामान्य पाठक के लिए सहज है, जबकि ‘अद्भुत काम’ मूल के विस्मयकारी दैवी कार्यों को स्पष्ट करता है। आवर्ती प्रत्युत्तर में लय और स्मरणीयता बनाए रखने के लिए संक्षिप्त वाक्य-विन्यास रखा गया है।
