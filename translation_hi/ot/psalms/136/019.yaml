  text: לְ֭/סִיחוֹן מֶ֣לֶךְ הָ/אֱמֹרִ֑י כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/136/019.yaml
  text: Sihon[a], king of the Amorites[c][b], for his steadfast love endures forever.
translation:
  language: hi
  text: 'उसने एमोरियों के राजा सीहोन को मार डाला,

    क्योंकि उसका अटल प्रेम सदा बना रहता है।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְסִיחוֹן
  choice: सीहोन को मार डाला
  rationale: לְ यहाँ पिछले पद के क्रिया-विचार ‘मार डाला’ के कर्म को सूचित करता है। हिंदी में केवल ‘सीहोन को’ पद 18 पर अत्यधिक निर्भर और अलग पढ़ने पर अधूरा लगता, इसलिए निहित क्रिया दोहराई गई है।
- source_word: מֶלֶךְ הָאֱמֹרִי
  choice: एमोरियों के राजा
  rationale: הָאֱמֹרִי रूप की दृष्टि से एकवचन जातिवाचक है, पर राजा के अधीन जाति के सामूहिक अर्थ को स्वाभाविक हिंदी में ‘एमोरियों के राजा’ व्यक्त करता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह भजन की आवर्ती स्तुति-पंक्ति में पिछले कथन के लिए आधार प्रस्तुत करता है; ‘क्योंकि’ इसका स्पष्ट और स्वाभाविक हिंदी संयोजक है।
- source_word: לְעוֹלָם
  choice: सदा बना रहता है
  rationale: मूल इब्रानी पंक्ति में क्रिया व्यक्त नहीं है। हिंदी में ‘बना रहता है’ जोड़ने से निरंतरता का भाव स्वाभाविक रूप से प्रकट होता है।
- source_word: חַסְדּוֹ
  choice: उसका अटल प्रेम
  rationale: חֶסֶד में प्रेम, दया और निष्ठा का संयुक्त भाव है। ‘अटल प्रेम’ इसकी स्थिरता और संबंधपरक आत्मीयता को संक्षेप में बनाए रखता है।
theological_decisions:
- issue: भजन 136 की आवर्ती पंक्ति में חֶסֶד का अनुवाद
  choice: उसका अटल प्रेम सदा बना रहता है
  alternative: उसकी करुणा सदा बनी रहती है; उसकी वाचा की निष्ठा सदा बनी रहती है
  rationale: ‘अटल प्रेम’ शब्द के प्रेमपूर्ण और निष्ठावान दोनों पक्षों को सामान्य आधुनिक हिंदी में रखता है। ‘करुणा’ अर्थ को दया तक सीमित कर सकती है, जबकि ‘वाचा की निष्ठा’ मूल में अंतर्निहित संबंधपरक आयाम को अधिक स्पष्ट, पर अधिक व्याख्यात्मक, बना देती है।
translation_notes:
  register: भाषा आधुनिक, सहज और स्तुतिगीत के योग्य गरिमामय रखी गई है। पहली पंक्ति में पिछले पद की निहित क्रिया दोहराकर इस पद को हिंदी में स्पष्ट बनाया गया है।
