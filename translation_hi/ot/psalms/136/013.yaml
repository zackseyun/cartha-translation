    reason: alternative_reading
lexical_decisions:
- source_word: לְ/גֹזֵר
  choice: जिसने...बाँट दिया
  rationale: לְ उपसर्ग स्तुति के पात्र की ओर संकेत करता है, जबकि גֹזֵר समुद्र को काटकर अलग करने का भाव रखता है। हिंदी में ‘बाँट दिया’ स्वाभाविक है और निर्गमन की घटना को स्पष्ट रखता है।
- source_word: יַם סוּף
  choice: सरकंडों का समुद्र
  rationale: हिब्रू पदबंध का सीधा अर्थ ‘सरकंडों का समुद्र’ है। पारंपरिक ‘लाल समुद्र’ को पाठ में रखने के बजाय पादटिप्पणी में दिया गया है।
- source_word: לִ/גְזָרִים
  choice: भागों में
  rationale: גְזָרִים अलग किए गए हिस्सों या भागों को दर्शाता है। ‘भागों में’ आधुनिक हिंदी में सहज और मूल बिंब के अनुरूप है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यहाँ כִּי स्तुति का आधार बताने वाले आवर्ती कथन का परिचय देता है; हिंदी में ‘क्योंकि’ इस संबंध को स्पष्ट रूप से व्यक्त करता है।
- source_word: לְ/עוֹלָם
  choice: सदा बनी रहती है
  rationale: हिब्रू में क्रिया निहित है। ‘सदा बनी रहती है’ स्थायित्व और निरंतरता को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: חַסְדּוֹ
  choice: उसकी अटल करुणा
  rationale: חֶסֶד में निष्ठावान, दृढ़ और कृपालु प्रेम का भाव है। ‘अटल करुणा’ हिंदी में संक्षिप्त, गरिमापूर्ण और आवर्ती भजन-पंक्ति के लिए उपयुक्त है।
