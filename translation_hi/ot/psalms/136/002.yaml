  text: ה֭וֹדוּ לֵֽ/אלֹהֵ֣י הָ/אֱלֹהִ֑ים כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/136/002.yaml
  text: Give thanks to the God of gods[b][a], for his steadfast love endures forever.
translation:
  language: hi
  text: देवताओं के परमेश्वर का धन्यवाद करो[a], क्योंकि उसका अटल प्रेम सदा बना रहता है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘देवताओं के परमेश्वर’; यह अभिव्यक्ति परमेश्वर की सर्वोच्चता बताती है। इसका अनुवाद ‘सब देवताओं के ऊपर परमेश्वर’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘अटल प्रेम’ इब्रानी शब्द ख़ेसेद का अनुवाद है, जिसमें निष्ठावान प्रेम, दया और वाचा के प्रति विश्वासयोग्यता के भाव हो सकते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹדוּ
  choice: धन्यवाद करो
  rationale: हिफ़ील बहुवचन आज्ञार्थक रूप यहाँ सामूहिक आह्वान है। ‘धन्यवाद करो’ आधुनिक हिन्दी में स्वाभाविक है और भजन की आवर्ती स्तुति-रचना में आज्ञा का बल बनाए रखता है।
- source_word: לֵאלֹהֵי הָאֱלֹהִים
  choice: देवताओं के परमेश्वर का
  rationale: इब्रानी की संबंध-रचना का शाब्दिक अर्थ ‘देवताओं का परमेश्वर’ है। हिन्दी कारक-रचना में ‘धन्यवाद करो’ के साथ ‘का’ स्वाभाविक है। यह पदवी सर्वोच्चता व्यक्त करती है, पर प्रतिद्वंद्वी देवताओं के अस्तित्व के प्रश्न को अनावश्यक रूप से तय नहीं करती।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह कण धन्यवाद के आह्वान का कारण बताता है; ‘क्योंकि’ स्पष्ट और सामान्य आधुनिक हिन्दी है।
- source_word: לְעוֹלָם
  choice: सदा बना रहता है
  rationale: मूल में क्रियारहित ‘सदा के लिए’ है। हिन्दी में सहज पूर्ण वाक्य के लिए टिके रहने का अर्थ स्पष्ट किया गया है, बिना समयहीनता के भाव को घटाए।
- source_word: חַסְדּוֹ
  choice: उसका अटल प्रेम
  rationale: חסד में निष्ठावान प्रेम, दया और संबंधगत वाचा-निष्ठा के अर्थ सम्मिलित हो सकते हैं। ‘अटल प्रेम’ प्रेम और स्थिर निष्ठा दोनों को संक्षेप में व्यक्त करता है; प्रत्यय को ‘उसका’ से स्पष्ट किया गया है।
theological_decisions:
- issue: 'אֱלֹהִים की पुनरुक्ति: ‘देवताओं के परमेश्वर’'
  choice: मूल की सर्वोच्चता-सूचक पदवी को ‘देवताओं के परमेश्वर’ के रूप में बनाए रखना
  alternative: ‘सब देवताओं से महान परमेश्वर’ या ‘सभी देवताओं के ऊपर परमेश्वर’
  rationale: मूल अभिव्यक्ति सर्वोच्चता और अतुलनीयता बताती है। औपचारिक पदवी बनाए रखने से पाठ की काव्यात्मक धार सुरक्षित रहती है और यह अपने आप अन्य देवताओं की वास्तविक सत्ता के विषय में कोई अतिरिक्त सिद्धान्त स्थापित नहीं करती।
- issue: חסד का अर्थ-क्षेत्र
  choice: ‘अटल प्रेम’
  alternative: ‘करुणा’, ‘दया’ या ‘वाचा की निष्ठा’
  rationale: यहाँ एक ही हिन्दी शब्दसमूह में חסד के सभी आयाम समाना कठिन है। ‘अटल प्रेम’ आवर्ती पंक्ति के लिए सुबोध है और स्थायी, निष्ठावान प्रेम पर बल देता है; अन्य संभावित अर्थ पादटिप्पणी में दिए गए हैं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामूहिक उपासना में सहज रखी गई है। ‘देवताओं के परमेश्वर’ मूल की ऊँची काव्यात्मक पदवी को बनाए रखता है, जबकि ‘अटल प्रेम सदा बना रहता है’ इब्रानी की क्रियारहित आवर्ती पंक्ति को स्वाभाविक हिन्दी देता है।
