review_pass:
  verdict: revise
  source_fidelity: ‘इस्राएल को उनके बीच से निकाल लाया’ accurately conveys the Hiphil causative of יצא and preserves the antecedent of ‘them’ without adding ‘Egyptians.’ The refrain is structurally faithful. However, ‘अटल करुणा’ emphasizes compassion and does not adequately retain the love/loyalty dimension of חֶסֶד in this programmatic refrain.
  naturalness: The wording is clear, idiomatic modern Hindi, and appropriately dignified. ‘उसका अटल प्रेम सदा बना रहता है’ is equally natural and gives the refrain a smoother, more consistent lexical sense.
  terminology: Revise חַסְדּוֹ from ‘अटल करुणा’ to ‘अटल प्रेम.’ This preserves the central love dimension while ‘अटल’ conveys the enduring, faithful quality. It does not impose a fuller doctrinal interpretation such as ‘वाचाई प्रेम.’
  issues:
  - severity: medium
    issue: ‘अटल करुणा’ narrows חֶסֶד primarily to compassion.
    rationale: חֶסֶד encompasses loyal, steadfast kindness and love. In Psalm 136’s repeated refrain, ‘अटल प्रेम’ more directly retains the semantic center reflected in the English audit trail’s ‘steadfast love,’ while still being concise and natural Hindi.
  revised_text: 'और इस्राएल को उनके बीच से निकाल लाया,

    क्योंकि उसका अटल प्रेम सदा बना रहता है।'
  revised_footnotes: []
  revision_rationale: 'The first line requires no change: it preserves the causative action and the Hebrew pronoun’s contextual ambiguity. The refrain is revised only to represent חֶסֶד more fully as enduring, faithful love rather than compassion alone. No footnote is necessary, since the translation is not making an unusually narrow or disputed claim.'
