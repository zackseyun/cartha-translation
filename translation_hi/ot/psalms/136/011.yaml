  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יּוֹצֵ֣א יִ֭שְׂרָאֵל מִ/תּוֹכָ֑/ם כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/136/011.yaml
  text: and brought Israel out from among them[b][a], for his steadfast love endures forever.
translation:
  language: hi
  text: 'और इस्राएल को उनके बीच से निकाल लाया,

    क्योंकि उसका अटल प्रेम सदा बना रहता है।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיּוֹצֵא
  choice: और ... निकाल लाया
  rationale: हिफ़ील रूप का कारणवाचक अर्थ ‘बाहर निकालना/ले आना’ है। ‘निकाल लाया’ स्वाभाविक हिन्दी में इस कारणवाचक भाव को बनाए रखता है।
- source_word: יִשְׂרָאֵל
  choice: इस्राएल
  rationale: यह यहाँ लोगों/राष्ट्र का व्यक्तिवाचक नाम है; प्रचलित हिन्दी बाइबलीय रूप रखा गया है।
- source_word: מִתּוֹכָם
  choice: उनके बीच से
  rationale: यह किसी समूह के भीतर या मध्य से बाहर लाए जाने को व्यक्त करता है। संदर्भ में सर्वनाम मिस्रियों की ओर संकेत करता है, पर मूल की सर्वनामात्मक अभिव्यक्ति सुरक्षित रखी गई है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह आवर्ती स्तुति-पंक्ति का कारण प्रस्तुत करता है; ‘क्योंकि’ आधुनिक हिन्दी में कारणवाचक संबंध स्पष्ट और स्वाभाविक बनाता है।
- source_word: לְעוֹלָם
  choice: सदा बनी रहती है
  rationale: इब्रानी में यह विधेयात्मक, क्रियारहित पदबंध है। हिन्दी में स्वाभाविक वाक्य के लिए ‘बनी रहती है’ जोड़ा गया है और לְעוֹלָם का अर्थ ‘सदा’ से व्यक्त हुआ है।
- source_word: חַסְדּוֹ
  choice: उसकी अटल करुणा
  rationale: חֶסֶד में निष्ठावान प्रेम, कृपा, दया और स्थिर भलाई के परस्पर जुड़े भाव हैं। ‘अटल करुणा’ स्थायित्व और कृपालुता दोनों को संक्षेप में व्यक्त करती है, बिना इसे केवल भावनात्मक प्रेम या केवल दया तक सीमित किए।
theological_decisions:
- issue: भजन 136 की आवर्ती पंक्ति में חַסְדּוֹ का अनुवाद
  choice: उसकी अटल करुणा सदा बनी रहती है
  alternative: उसका अटल प्रेम सदा बना रहता है; उसकी दया सदा की है
  rationale: ‘अटल करुणा’ परमेश्वर की स्थायी, निष्ठावान और कृपालु भलाई को व्यक्त करती है। यह वाचा का अर्थ जबरन नहीं जोड़ती और ‘दया’ मात्र की अपेक्षा मूल शब्द की व्यापकता अधिक सुरक्षित रखती है। क्रियारहित इब्रानी वाक्य को स्वाभाविक हिन्दी बनाने के लिए ‘बनी रहती है’ जोड़ा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और भजन की आवर्ती उपासना-लय के अनुकूल। मूल पाठ की दो पंक्तियों वाली संरचना और कारणवाचक संबंध सुरक्षित रखे गए हैं।
