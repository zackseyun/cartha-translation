  to: 'और इस्राएल को उनके बीच से निकाल लाया,

    क्योंकि उसका अटल प्रेम सदा बना रहता है।'
  rationale: 'The first line requires no change: it preserves the causative action and the Hebrew pronoun’s contextual ambiguity. The refrain is revised only to represent חֶסֶד more fully as enduring, faithful love rather than compassion alone. No footnote is necessary, since the translation is not making an unusually narrow or disputed claim.'
