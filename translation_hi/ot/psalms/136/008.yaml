translation:
  language: hi
  text: 'सूरज को दिन में शासन करने के लिए,[a]

    क्योंकि उसका अटल प्रेम सदा बना रहता है।[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “सूरज को दिन में प्रभुत्व के लिए।” इब्रानी में यहाँ क्रिया के बजाय “शासन/प्रभुत्व” की भाववाचक संज्ञा है।
    reason: lexical_alternative
  - marker: b
    text: “अटल प्रेम” इब्रानी חֶסֶד का अनुवाद है। प्रसंग के अनुसार इसमें करुणा, दया और वाचा के प्रति निष्ठा के भाव भी सम्मिलित हो सकते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶת
  choice: '[कर्म-सूचक चिह्न; अलग से अनूदित नहीं]'
  rationale: यह निश्चित प्रत्यक्ष कर्म को चिह्नित करता है; हिन्दी वाक्य-विन्यास में इसका अर्थ स्वाभाविक रूप से व्यक्त हो जाता है।
- source_word: הַשֶּׁמֶשׁ
  choice: सूरज को
  rationale: निश्चित संज्ञा का सहज, सामान्य आधुनिक हिन्दी रूप; ‘को’ इसे पूर्वपदों से चली आ रही क्रिया का कर्म बनाता है।
- source_word: לְמֶמְשֶׁלֶת
  choice: शासन करने के लिए
  rationale: इब्रानी भाववाचक संज्ञा ‘शासन/प्रभुत्व’ को हिन्दी में प्रयोजनसूचक क्रियात्मक पद से स्वाभाविक रूप में व्यक्त किया गया है।
- source_word: בַּיּוֹם
  choice: दिन पर
  rationale: यहाँ ב समय-क्षेत्र पर शासन को व्यक्त करता है; ‘दिन पर’ निकटवर्ती ‘रात पर’ के समानांतर रहते हुए शासन का संबंध स्पष्ट करता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: भजन के आवर्ती प्रत्युत्तर में यह स्तुति का कारण प्रस्तुत करता है।
- source_word: לְעוֹלָם
  choice: सदा बनी रहती है
  rationale: क्रियारहित इब्रानी वाक्य में स्थायी अवधि निहित है; हिन्दी में आवश्यक स्त्रीलिंग क्रिया जोड़कर इसे सहज बनाया गया है।
- source_word: חַסְדּוֹ
  choice: उसकी अटल करुणा
  rationale: חֶסֶד में प्रेम, दया, निष्ठा और टिकाऊ प्रतिबद्धता के संयुक्त भाव हैं; ‘अटल करुणा’ सामान्य हिन्दी में उसके स्थायित्व और कृपालुता दोनों को संक्षेप में रखती है।
theological_decisions:
- issue: भजन 136 के प्रत्युत्तर में חֶסֶד का अनुवाद
  choice: उसकी अटल करुणा सदा बनी रहती है
  alternative: उसका अटल प्रेम सदा बना रहता है; उसकी करुणा सदा की है; उसकी वाचा की निष्ठा सदा बनी रहती है
  rationale: ‘अटल करुणा’ शब्द को केवल भावना, केवल दया, या केवल तकनीकी वाचागत अर्थ तक सीमित नहीं करती; यह सृष्टि और उद्धार के कार्यों में प्रकट स्थायी, कृपालु निष्ठा को खुला रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और पाठ/सामूहिक प्रत्युत्तर के योग्य रखी गई है। ‘सूर्य’ की अपेक्षा ‘सूरज’ सामान्य पाठक के लिए अधिक सहज है; ‘शासन’ काव्यात्मक समानांतरता और मूल के प्रभुत्व-विषयक अर्थ को बनाए रखता है।
