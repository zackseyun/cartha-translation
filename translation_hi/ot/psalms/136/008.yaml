    issue: “दिन पर शासन” is semantically imprecise.
    rationale: The Hebrew בַּיּוֹם indicates the time/sphere “by day,” not dominion over “the day” as an object. “दिन में शासन” conveys the intended temporal sense.
  - severity: low
    issue: “अटल करुणा” narrows חֶסֶד excessively toward compassion.
    rationale: In this refrain, חֶסֶד centrally conveys enduring loyal love, while also allowing mercy and covenantal fidelity. “अटल प्रेम” is clearer and broader in current Hindi.
