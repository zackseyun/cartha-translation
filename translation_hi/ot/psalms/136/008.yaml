  terminology: '“अटल प्रेम” is a more suitable concise rendering of חֶסֶד here than “अटल करुणा”: it retains the loyal/steadfast-love dimension without narrowing the term chiefly to compassion. The footnote preserves the relevant semantic range, including mercy and covenant faithfulness.'
  issues:
