  yaml_path: translation/ot/psalms/136/016.yaml
  text: to him who led his people in the wilderness[b][a], for his steadfast love endures forever.
translation:
  language: hi
  text: 'उसका धन्यवाद करो, जो अपनी प्रजा को निर्जन प्रदेश में[a] ले चला,

    क्योंकि उसका अटल प्रेम[b] सदा बना रहता है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘निर्जन प्रदेश से होकर’। इब्रानी संबंधबोधक उपसर्ग का शाब्दिक अर्थ ‘में’ है, पर ले चलने के प्रसंग में यह उस प्रदेश से होकर की गई यात्रा का भाव भी दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘अटल प्रेम’ इब्रानी शब्द ख़ेसेद का अनुवाद है; इसमें प्रेम के साथ कृपा और संबंध निभाने वाली निष्ठा के भाव भी सम्मिलित हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמוֹלִיךְ
  choice: जो ... ले चला
  rationale: הלך के हिफ़ील रूप में किसी को चलाने या आगे ले जाने का भाव है। ‘ले चला’ इस गतिशील, मार्गदर्शक भाव को सहज हिन्दी में व्यक्त करता है। पद की स्तुतिपरक आवृत्ति को स्वाभाविक बनाने के लिए पूर्वपदों से समझे जाने वाले ‘उसका धन्यवाद करो’ को स्पष्ट किया गया है।
- source_word: עַמּוֹ
  choice: अपनी प्रजा
  rationale: עַם यहाँ परमेश्वर से संबंधित इस्राएली समुदाय को दर्शाता है। ‘अपनी प्रजा’ संबंधसूचक प्रत्यय और सामुदायिक भाव दोनों को स्वाभाविक हिन्दी में रखता है।
- source_word: בַּמִּדְבָּר
  choice: निर्जन प्रदेश में
  rationale: מִדְבָּר आबादी से दूर वन्य या सूखा क्षेत्र हो सकता है और केवल रेतीले मरुस्थल तक सीमित नहीं है। ב का मूल स्थानवाचक अर्थ ‘में’ रखा गया है; यात्रा का ‘से होकर’ अर्थ पादटिप्पणी में दिया गया है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह भजन की आवर्ती पंक्ति में स्तुति का आधार प्रस्तुत करता है; आधुनिक हिन्दी में ‘क्योंकि’ इस संबंध को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: לְעוֹלָם
  choice: सदा बना रहता है
  rationale: यह अनंत या निरंतर अवधि बताता है। ‘सदा बना रहता है’ हिन्दी में חֶסֶד की स्थायित्वपूर्ण प्रकृति को स्पष्ट करता है।
- source_word: חַסְדּוֹ
  choice: उसका अटल प्रेम
  rationale: חֶסֶד में प्रेम, कृपा और निष्ठा के परस्पर जुड़े भाव हैं। ‘अटल प्रेम’ केवल भावना या केवल दया तक अर्थ को सीमित किए बिना उसके स्थायी और संबंधपरक स्वरूप को व्यक्त करता है।
theological_decisions:
- issue: חֶסֶד का अनुवाद
  choice: उसका अटल प्रेम सदा बना रहता है
  alternative: उसकी करुणा सदा बनी रहती है / उसकी वाचा की निष्ठा सदा बनी रहती है
  rationale: ‘अटल प्रेम’ इस शब्द के स्नेह, कृपा और विश्वसनीय निष्ठा के व्यापक धर्मवैचारिक अर्थ को बनाए रखता है। ‘करुणा’ इसे दया तक और ‘वाचा की निष्ठा’ इसे अधिक तकनीकी अभिव्यक्ति तक सीमित कर सकती है।
- issue: पद के आरंभ में निहित स्तुति-आह्वान
  choice: उसका धन्यवाद करो, जो ...
  alternative: उसके लिए, जो ...
  rationale: לְמוֹלִיךְ का לִ इस भजन की आवर्ती संरचना में उस व्यक्ति की ओर संकेत करता है जिसका धन्यवाद किया जाना है। हिन्दी में अकेला ‘उसके लिए, जो’ अस्वाभाविक और अधूरा लगेगा, इसलिए प्रसंग में निहित मुख्य क्रिया स्पष्ट की गई है, बिना कर्ता या स्तुति के आशय को बदले।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामूहिक आराधना में सहज पाठ योग्य रखी गई है। ‘निर्जन प्रदेश’ जलवायु की दृष्टि से संकुचित ‘रेगिस्तान’ से बचता है। पंक्ति-विन्यास भजन की स्तुतिपरक पुकार और आवर्ती उत्तर को उभारता है।
