  yaml_path: translation/ot/psalms/136/015.yaml
  text: and shook off Pharaoh and his army into the Red Sea[a], for his steadfast love endures forever.
translation:
  language: hi
  text: 'और फ़िरौन और उसकी सेना को झटककर सरकंडों के सागर[a] में डाल दिया,

    क्योंकि उसका अटल प्रेम सदा बना रहता है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी: ‘सरकंडों का सागर।’ परंपरागत रूप से इसे ‘लाल सागर’ कहा जाता है।'
    reason: alternative_reading
lexical_decisions:
- source_word: וְנִעֵר
  choice: और … झटक दिया
  rationale: נָעַר का ठोस बिंब किसी वस्तु को झटककर गिरा देने या निकाल देने का है। ‘झटक दिया’ निर्गमन 14:27 से जुड़े इस सजीव रूपक को बनाए रखता है; केवल ‘परास्त किया’ कहना बिंब को सामान्य बना देता।
- source_word: פַּרְעֹה
  choice: फ़िरौन
  rationale: मिस्र के शासक की उपाधि का आधुनिक मानक हिन्दी रूप।
- source_word: וְחֵילוֹ
  choice: और उसकी सेना को
  rationale: सैनिक प्रसंग में חַיִל सशस्त्र बल या सेना को दर्शाता है। ‘सेना’ सहज और स्पष्ट आधुनिक हिन्दी है।
- source_word: בְיַם סוּף
  choice: सरकंडों के सागर में
  rationale: יַם־סוּף का स्रोत-पारदर्शी अर्थ ‘सरकंडों का सागर’ है। בְ को ‘में’ रखा गया है; हिन्दी में ‘सागर में झटक दिया’ स्थान और परिणामी गति दोनों को स्वाभाविक रूप से व्यक्त करता है। पारंपरिक नाम ‘लाल सागर’ पादटिप्पणी में दिया गया है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह भजन 136 की आवर्ती स्तुति-पंक्ति का आधार प्रस्तुत करता है; ‘क्योंकि’ आधुनिक हिन्दी में कारण-संबंध को स्पष्ट रखता है।
- source_word: לְעוֹלָם
  choice: सदा बनी रहती है
  rationale: לְעוֹלָם स्थायी और अनवरत अवधि व्यक्त करता है। हिन्दी वाक्य में आवश्यक क्रियात्मक अभिव्यक्ति के रूप में ‘सदा बनी रहती है’ स्वाभाविक है।
- source_word: חַסְדּוֹ
  choice: उसकी अटल करुणा
  rationale: חֶסֶד में निष्ठावान प्रेम, कृपा और दया के परस्पर जुड़े भाव हैं। ‘अटल करुणा’ उसकी दृढ़ता और दयामयता को संक्षेप में रखती है, बिना उसे केवल भावनात्मक प्रेम या किसी एक तकनीकी धर्मवैज्ञानिक अर्थ तक सीमित किए।
theological_decisions:
- issue: יַם סוּף का अनुवाद
  choice: मुख्य पाठ में ‘सरकंडों का सागर’
  alternative: ‘लाल सागर’
  rationale: इब्रानी पदबंध का अधिक प्रत्यक्ष अर्थ ‘सरकंडों का सागर’ है, इसलिए मूल भाषा को प्राथमिकता देते हुए इसे मुख्य पाठ में रखा गया है। लंबे समय से प्रचलित और पहचाना जाने वाला नाम ‘लाल सागर’ पाठकीय सहायता के लिए पादटिप्पणी में सुरक्षित है।
- issue: חֶסֶד की अर्थ-व्याप्ति
  choice: ‘अटल करुणा’
  alternative: ‘अटल प्रेम’, ‘वाचा की निष्ठा’, या ‘दया’
  rationale: शब्द प्रेम, कृपा, दया और निष्ठा की अर्थ-छायाएँ समेटता है। ‘अटल करुणा’ स्थायित्व और दयामय संबंध दोनों व्यक्त करती है, पर किसी एक धर्मवैज्ञानिक व्याख्या को अनिवार्य नहीं बनाती।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामूहिक पाठ के योग्य रखी गई है। ‘झटक दिया’ मूल क्रिया का सजीव बिंब बचाता है, जबकि आवर्ती पंक्ति ‘क्योंकि उसकी अटल करुणा सदा बनी रहती है’ सहज लय बनाए रखती है।
