  text: who gives food to all flesh[a], for his steadfast love endures forever.
translation:
  language: hi
  text: 'जो हर प्राणी को भोजन देता है[a],

    क्योंकि उसका अटल प्रेम सदा बना रहता है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अनुवाद: “सब देहधारियों को रोटी देता है।” इब्रानी में “सब देह” का अर्थ सभी जीवित प्राणी हो सकता है, और “रोटी” सामान्य रूप से भोजन का द्योतक हो सकती है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹתֵן
  choice: जो ... देता है
  rationale: इब्रानी कृदंत परमेश्वर के निरंतर कार्य का वर्णन करता है। भजन की स्तुतिपरक सूची में संबंधवाचक रचना स्वाभाविक है।
- source_word: לֶחֶם
  choice: भोजन
  rationale: शाब्दिक अर्थ ‘रोटी’ है, पर यहाँ यह सामान्य रूप से आहार का द्योतक है; ‘भोजन’ सार्वभौमिक पोषण का आशय स्पष्ट करता है।
- source_word: לְכָל בָּשָׂר
  choice: हर प्राणी को
  rationale: शाब्दिक इब्रानी मुहावरा ‘सब देह/मांस को’ है, जिसका संदर्भ सभी जीवित प्राणियों से है। सहज आधुनिक हिन्दी में ‘हर प्राणी को’ उसी व्यापक दायरे को व्यक्त करता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह आवर्ती पंक्ति स्तुति का आधार बताती है; ‘क्योंकि’ कारण-संबंध को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: לְעוֹלָם
  choice: सदा बना रहता है
  rationale: मूल में क्रियारहित वाक्यांश है। हिन्दी में यह पूरक क्रिया उसकी निरंतर और चिरस्थायी प्रकृति को सहज रूप से व्यक्त करती है।
- source_word: חַסְדּוֹ
  choice: उसका अटल प्रेम
  rationale: חֶסֶד में कृपापूर्ण, निष्ठावान और टिकाऊ प्रेम के भाव समाहित हैं। ‘अटल प्रेम’ संक्षिप्त, सुबोध और व्यापक है; केवल ‘दया’ कहना अर्थ को संकुचित कर सकता है।
theological_decisions:
- issue: ‘सब देह’ का दायरा
  choice: सभी जीवित प्राणियों के लिए परमेश्वर का प्रबंध
  alternative: केवल समस्त मानवजाति
  rationale: इब्रानी בָּשָׂר इस संदर्भ में मनुष्यों तक सीमित नहीं है और सभी जीवित प्राणियों को समेट सकता है। ‘हर प्राणी’ उस व्यापकता को बिना अनावश्यक संकीर्णता के सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। दो पंक्तियों की रचना भजन के आवर्ती उपासना-स्वर और लय को बनाए रखती है।
