  text: To him who struck Egypt in their firstborn[a], for his steadfast love endures forever.
translation:
  language: hi
  text: 'उसका धन्यवाद करो, जिसने मिस्र के पहिलौठों को मारा[a],

    क्योंकि उसका अटल प्रेम सदा बना रहता है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शब्दशः, “जिसने मिस्र को उसके पहिलौठों में/के साथ मारा।” यहाँ पूर्वसर्ग का अर्थ “में,” “के बीच,” अथवा प्रसंगानुसार “के द्वारा” भी समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַכֵּה
  choice: उसका धन्यवाद करो, जिसने मारा
  rationale: लְ स्तोत्र की आवर्ती धन्यवाद-रचना में कर्म-सम्प्रदान को दर्शाता है और מַכֵּה क्रियात्मक कृदन्त है। स्वाभाविक हिन्दी में पिछले पदों से चली आ रही ‘धन्यवाद करो’ की क्रिया को स्पष्ट करना आवश्यक है।
- source_word: מִצְרַיִם
  choice: मिस्र
  rationale: देश और सामूहिक रूप से उसके लोगों के लिए प्रचलित हिन्दी नाम।
- source_word: בִּבְכוֹרֵיהֶם
  choice: उसके पहिलौठों में
  rationale: बְּ के संक्षिप्त और कुछ हद तक अस्पष्ट स्थानवाचक/साधनवाचक बल को बनाए रखता है। हिन्दी में ‘उसके’ का सम्बन्ध सामूहिक ‘मिस्र’ से है; अधिक स्पष्ट ‘उसके पहिलौठों को मारकर’ अर्थ खोल देता, पर मूल से अधिक व्याख्यात्मक होता।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह स्तोत्र के बार-बार आने वाले कारणसूचक टेक का स्वाभाविक हिन्दी परिचय है।
- source_word: לְעוֹלָם
  choice: सदा बना रहता है
  rationale: निरन्तरता और स्थायित्व का भाव सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: חַסְדּוֹ
  choice: उसका अटल प्रेम
  rationale: חֶסֶד में प्रेम, निष्ठा और स्थिरता के संयुक्त भाव को व्यक्त करता है; केवल ‘दया’ कहना इसके अर्थ को संकुचित कर सकता है।
theological_decisions:
- issue: मिस्र के पहिलौठों पर परमेश्वर के न्याय को बिना नरम किए प्रस्तुत करना
  choice: मिस्र को उसके पहिलौठों में मारा
  alternative: उसके पहिलौठों को मारकर मिस्र पर प्रहार किया
  rationale: मुख्य पाठ न्याय के कठोर कथन को बनाए रखता है और उसे उसी अटल प्रेम की टेक के साथ रखता है। साथ ही, वह इब्रानी बְּ की अस्पष्टता को अत्यधिक व्याख्या द्वारा समाप्त नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। ‘उसके पहिलौठों में’ जानबूझकर कुछ असामान्य है, ताकि मूल इब्रानी की संक्षिप्तता और पूर्वसर्ग की वास्तविक अस्पष्टता बनी रहे; पादटिप्पणी अधिक स्पष्ट विकल्प देती है।
