source:
  edition: WLC
  text: וְ/נָתַ֣ן אַרְצָ֣/ם לְ/נַחֲלָ֑ה כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/136/021.yaml
  text: and gave their land as an inheritance[b][a], for his steadfast love endures forever.
translation:
  language: hi
  text: और उनकी भूमि विरासत[a] के रूप में दी, क्योंकि उसका अटल प्रेम[b] सदा बना रहता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘विरासत के लिए’ अथवा ‘अधिकार की संपत्ति के रूप में।’ इब्रानी शब्द נַחֲלָה में बाँटकर मिले उत्तराधिकार का भाव है।
    reason: lexical_alternative
  - marker: b
    text: ‘अटल प्रेम’ इब्रानी חֶסֶד का अनुवाद है। यह शब्द प्रायः प्रेमपूर्ण निष्ठा और संबंध के प्रति दृढ़ प्रतिबद्धता को व्यक्त करता है; इसके अन्य संभावित अनुवाद ‘करुणा,’ ‘कृपा’ या ‘वाचा की निष्ठा’ हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַן
  choice: और ... दे दी
  rationale: וְ के साथ נתן का क़ाल पूर्ण, तीसरा पुरुष एकवचन रूप पिछले पदों में वर्णित परमेश्वर के कार्यों की शृंखला को आगे बढ़ाता है। हिन्दी में कर्ता को दोहराए बिना यह क्रम स्वाभाविक रहता है; ‘भूमि’ के अनुसार क्रिया स्त्रीलिंग रखी गई है।
- source_word: אַרְצָם
  choice: उनकी भूमि
  rationale: אֶרֶץ पर लगा तीसरे पुरुष बहुवचन प्रत्यय संदर्भ में पराजित राजाओं अथवा जातियों की भूमि को दर्शाता है। ‘भूमि’ प्राचीन भूभाग के लिए स्वाभाविक है और आधुनिक राजनीतिक अर्थ वाले ‘देश’ से अधिक उपयुक्त है।
- source_word: לְנַחֲלָה
  choice: विरासत के रूप में
  rationale: נַחֲלָה उत्तराधिकार में अथवा बाँटकर मिली स्थायी संपत्ति को सूचित करता है। यह अनुवाद भूमि के आवंटित उत्तराधिकार का भाव बनाए रखता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: भजन 136 के आवर्ती वाक्य में כִּי स्तुति के आधार अथवा कारण को प्रस्तुत करता है। आधुनिक हिन्दी में ‘क्योंकि’ इस कारणवाचक संबंध को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: לְעוֹלָם
  choice: सदा बना रहता है
  rationale: לְעוֹלָם का अर्थ ‘सदा/सर्वदा’ है। חַסְדּוֹ के साथ ‘बना रहता है’ जोड़ने से उसकी निरंतर और स्थायी प्रकृति सहज हिन्दी में व्यक्त होती है।
- source_word: חַסְדּוֹ
  choice: उसका अटल प्रेम
  rationale: חֶסֶד में प्रेम, निष्ठा, कृपा और संबंध के प्रति दृढ़ प्रतिबद्धता के परस्पर जुड़े भाव हैं। ‘अटल प्रेम’ सरल आधुनिक हिन्दी में प्रेम और स्थिर निष्ठा दोनों को समेटता है, जबकि केवल ‘दया’ इसका अर्थ संकुचित कर सकती है।
theological_decisions:
- issue: भजन 136 के आवर्ती वाक्य में חֶסֶד का अनुवाद
  choice: उसका अटल प्रेम सदा बना रहता है
  alternative: उसकी करुणा सदा बनी रहती है; उसकी वाचा की निष्ठा सदा बनी रहती है
  rationale: यह चयन परमेश्वर के ऐतिहासिक कार्यों में प्रकट प्रेमपूर्ण निष्ठा और उसकी स्थिरता दोनों को व्यक्त करता है। ‘वाचा की निष्ठा’ संभावित धार्मिक-संबंधी सूक्ष्मता को अधिक स्पष्ट करती, पर मूल शब्द की व्यापकता को एक ही व्याख्या तक सीमित कर सकती है; ‘करुणा’ प्रेमपूर्ण निष्ठा के पहलू को कम स्पष्ट करती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामूहिक पाठ के अनुकूल रखी गई है। आवर्ती स्तुति-वाक्य में सहज हिन्दी लय के लिए ‘क्योंकि उसका अटल प्रेम सदा बना रहता है’ चुना गया है।
