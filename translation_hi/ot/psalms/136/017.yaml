  text: לְ֭/מַכֵּה מְלָכִ֣ים גְּדֹלִ֑ים כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/136/017.yaml
  text: To him who struck down great kings[b][a], for his steadfast love endures forever.
translation:
  language: hi
  text: 'उसका धन्यवाद करो, जिसने बड़े-बड़े राजाओं को मार गिराया[a],

    क्योंकि उसका अटल प्रेम सदा बना रहता है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '‘मार गिराया’ का अनुवाद ‘प्रहार किया’ भी हो सकता है। इब्रानी में ‘जिसने प्रहार किया’ से पहले का उपसर्ग इस भजन की स्तुति-रचना को आगे बढ़ाता है: ‘उसका धन्यवाद करो, जिसने…’।'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַכֵּה
  choice: जिसने ... मार गिराया
  rationale: उपसर्ग לְ और कृदन्त रूप भजन की स्तुति-सूची को आगे बढ़ाते हैं; प्रसंग में נכה निर्णायक पराजय अथवा वध को दर्शाता है, इसलिए आधुनिक हिन्दी में ‘मार गिराया’ स्वाभाविक और सशक्त है।
- source_word: מְלָכִים גְּדֹלִים
  choice: बड़े-बड़े राजाओं
  rationale: מְלָכִים का अर्थ ‘राजाओं’ और גְּדֹלִים का अर्थ ‘बड़े/महान’ है। ‘बड़े-बड़े’ यहाँ प्रमुख और शक्तिशाली राजाओं का सहज हिन्दी बोध कराता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह शब्द बार-बार आने वाले कारणसूचक प्रत्युत्तर का परिचय देता है; ‘क्योंकि’ साधारण आधुनिक हिन्दी में स्पष्ट है और स्तुति का कारण बताता है।
- source_word: לְעוֹלָם
  choice: सदा बनी रहती है
  rationale: शाब्दिक अर्थ अनन्त अवधि तक है। हिन्दी वाक्य में निहित क्रिया को पूरा करते हुए यह स्थायित्व और निरन्तरता दोनों व्यक्त करता है।
- source_word: חַסְדּוֹ
  choice: उसकी अटल करुणा
  rationale: חֶסֶד में दयालुता, प्रेम और निष्ठा के जुड़े हुए भाव हैं। ‘अटल करुणा’ संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध है; ‘अटल’ इसकी स्थिर निष्ठा को सामने लाता है।
theological_decisions:
- issue: חֶסֶד का अनुवाद
  choice: उसकी अटल करुणा सदा बनी रहती है
  alternative: उसका करारगत प्रेम सदा बना रहता है; उसकी दया सदा बनी रहती है
  rationale: ‘अटल करुणा’ दया और स्थायी निष्ठा दोनों को व्यक्त करती है, पर पद में ‘वाचा/करार’ शब्द न जोड़कर मूल की अर्थ-समृद्धि और व्यापकता को बनाए रखती है।
- issue: राजाओं पर प्रहार का परिणाम
  choice: मार गिराया
  alternative: प्रहार किया
  rationale: आसपास के ऐतिहासिक विजय-वर्णन में क्रिया निर्णायक पराजय या वध का संकेत देती है। फिर भी अधिक सामान्य ‘प्रहार किया’ भाषिक रूप से सम्भव है, इसलिए उसे पादटिप्पणी में सुरक्षित रखा गया है।
