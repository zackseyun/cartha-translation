  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सामूहिक पाठ के अनुकूल। आवर्ती प्रत्युत्तर के लिए ‘उसकी अटल करुणा सदा बनी रहती है’ चुना गया है।
