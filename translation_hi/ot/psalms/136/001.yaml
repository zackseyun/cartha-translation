id: PSA.136.1
reference: Psalms 136:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: הוֹד֣וּ לַ/יהוָ֣ה כִּי ט֑וֹב כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/136/001.yaml
  text: Give thanks to Yahweh[a], for he is good[b], for his steadfast love endures forever.
translation:
  language: hi
  text: 'याहवे[a] का धन्यवाद करो, क्योंकि वह भला है;

    क्योंकि उसका अटल प्रेम[b] सदा बना रहता है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में परमेश्वर का व्यक्तिगत नाम יהוה (YHWH) है; यहाँ उसे ‘याहवे’ लिखा गया है।
    reason: alternative_reading
  - marker: b
    text: ‘अटल प्रेम’ के लिए प्रयुक्त इब्रानी शब्द חֶסֶד में करुणा, निष्ठावान प्रेम और वाचा के संबंध में बनी रहने वाली विश्वासयोग्यता के अर्थ समाए हैं; इसका अनुवाद ‘करुणा’ या ‘वाचा की निष्ठा’ भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹדוּ
  choice: धन्यवाद करो
  rationale: ידה के हिफ़ील बहुवचन आज्ञार्थक का यहाँ स्वाभाविक अर्थ परमेश्वर को धन्यवाद देना है; भजन के आराधनात्मक स्वर में यह सीधा और सहज है।
- source_word: לַיהוָה
  choice: याहवे का
  rationale: ל यहाँ धन्यवाद के लक्ष्य को चिह्नित करता है। स्वाभाविक हिन्दी में ‘याहवे का धन्यवाद करो’ कहा जाता है, और יהוה को उसके व्यक्तिगत नाम के रूप में ‘याहवे’ लिखा गया है।
- source_word: כִּי
  choice: क्योंकि
  rationale: दोनों बार כִּי धन्यवाद देने का आधार बताता है; ‘क्योंकि’ कारण-संबंध को स्पष्ट और स्वाभाविक रखता है।
- source_word: טוֹב
  choice: भला
  rationale: यह विशेषण याहवे की अच्छाई को व्यापक नैतिक और उपकारी अर्थ में व्यक्त करता है। ‘भला’ हिन्दी बाइबलीय शैली में गरिमापूर्ण और सामान्यतः बोधगम्य है।
- source_word: לְעוֹלָם
  choice: सदा बना रहता है
  rationale: इब्रानी पदबंध स्थायी अवधि बताता है। हिन्दी में जोड़े गए ‘बना रहता है’ से मूल का आशय स्वाभाविक रूप में व्यक्त होता है, यद्यपि इब्रानी में क्रिया व्यक्त नहीं है।
- source_word: חַסְדּוֹ
  choice: उसका अटल प्रेम
  rationale: חֶסֶד में प्रेम, निष्ठा और संबंध निभाने की दृढ़ता साथ-साथ निहित हैं। ‘अटल प्रेम’ इस समृद्ध अर्थ को संक्षेप में रखता है और इसे केवल दया तक सीमित नहीं करता।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: प्रभु; यहोवा
  rationale: मूल पाठ में चार-अक्षरी व्यक्तिगत नाम सीधे आया है। ‘याहवे’ उसे उपाधि में बदलने के बजाय नाम के रूप में सुरक्षित रखता है।
- issue: वाचा-संबंधी חֶסֶד का अर्थ
  choice: अटल प्रेम
  alternative: करुणा; दया; वाचा की निष्ठा
  rationale: ‘अटल प्रेम’ स्नेह और स्थायी निष्ठा दोनों को बनाए रखता है; टिप्पणी अन्य वैध अर्थ-छायाओं को दर्ज करती है।
- issue: नामरहित इब्रानी अंतिम उपवाक्य में क्रिया की अभिव्यक्ति
  choice: सदा बना रहता है
  alternative: सदा का है
  rationale: मूल में क्रिया व्यक्त नहीं है, पर स्थायित्व का भाव स्पष्ट है। चुना हुआ रूप आधुनिक हिन्दी में स्वाभाविक है और प्रेम के निरंतर बने रहने का अर्थ देता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, आराधनात्मक और गरिमापूर्ण शैली रखी गई है। समानांतर इब्रानी संरचना को अर्धविराम और पंक्ति-विभाजन से उभारा गया है। ‘भला’ परिचित बाइबलीय शब्द है, जबकि ‘अटल प्रेम’ חֶסֶד की व्यापक अर्थ-छाया को सामान्य पाठक के लिए सहज रखता है।
