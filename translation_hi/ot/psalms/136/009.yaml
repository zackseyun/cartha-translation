source:
  edition: WLC
  text: אֶת הַ/יָּרֵ֣חַ וְ֭/כוֹכָבִים לְ/מֶמְשְׁל֣וֹת בַּ/לָּ֑יְלָה כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ־׃
base_translation:
