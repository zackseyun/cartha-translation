  yaml_path: translation/ot/psalms/136/009.yaml
  text: the moon and stars to rule over the night[b][a], for his steadfast love endures forever.
translation:
  language: hi
  text: 'चन्द्रमा और तारों को रात में शासन करने के लिए[a],

    क्योंकि उसका अटल प्रेम[b] सदा बना रहता है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘चन्द्रमा और तारों को रात पर अधिकार रखने के लिए’।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी חֶסֶד का अनुवाद प्रसंग के अनुसार ‘करुणा’, ‘प्रेममयी कृपा’ या ‘वाचा की निष्ठा’ भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶת
  choice: को
  rationale: यह निश्चित कर्म को चिह्नित करता है और पिछले पद से चली आ रही वाक्य-रचना के कर्मों का परिचय देता है; हिन्दी में इसका स्वाभाविक समकक्ष ‘को’ है।
- source_word: הַיָּרֵחַ
  choice: चन्द्रमा
  rationale: यह आकाशीय पिंड ‘चन्द्रमा’ का सामान्य और गरिमापूर्ण आधुनिक हिन्दी रूप है।
- source_word: וְכוֹכָבִים
  choice: और तारों
  rationale: बहुवचन כּוֹכָבִים का अर्थ ‘तारे’ है; ‘को’ के साथ समन्वित पद होने के कारण हिन्दी में ‘तारों’ रूप स्वाभाविक है।
- source_word: לְמֶמְשְׁלוֹת
  choice: शासन करने के लिए
  rationale: यह शासन या प्रभुता के कार्य को व्यक्त करता है। उद्देश्य/भूमिका दर्शाने वाला ‘शासन करने के लिए’ अर्थ और काव्यात्मक प्रवाह दोनों को सुरक्षित रखता है।
- source_word: בַּלָּיְלָה
  choice: रात में
  rationale: पूर्वसर्ग בְּ यहाँ रात के समय अथवा क्षेत्र को दर्शाता है। ‘रात में’ मूल की संरचना के निकट है और हिन्दी में सहज है; ‘रात पर’ भी प्रसंगानुसार सम्भव है।
- source_word: כִּי
  choice: क्योंकि
  rationale: भजन के आवर्ती प्रत्युत्तर में यह परमेश्वर के कार्यों का कारण प्रस्तुत करता है; ‘क्योंकि’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: לְעוֹלָם
  choice: सदा बना रहता है
  rationale: यह अनन्त काल तक जारी रहने का भाव देता है। חַסְדּוֹ के साथ मिलकर हिन्दी में ‘सदा बना रहता है’ स्थायित्व को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: חַסְדּוֹ
  choice: उसका अटल प्रेम
  rationale: חֶסֶד में प्रेम, कृपा, निष्ठा और संबंधपरक वफादारी का व्यापक भाव है। ‘अटल प्रेम’ इसकी दृढ़ता और स्नेह, दोनों को सामान्य आधुनिक हिन्दी में बनाए रखता है।
theological_decisions:
- issue: भजन 136 के आवर्ती पद में חֶסֶד का अनुवाद
  choice: उसका अटल प्रेम सदा बना रहता है
  alternative: उसकी करुणा सदा बनी रहती है; उसकी वाचा की निष्ठा सदा बनी रहती है
  rationale: ‘अटल प्रेम’ मूल शब्द की प्रेमपूर्ण कृपा और स्थायी निष्ठा को साथ रखता है। केवल ‘करुणा’ अर्थ को दया तक सीमित कर सकती है, जबकि ‘वाचा की निष्ठा’ मूल में निहित संबंधपरक भाव को स्पष्ट तो करती है, पर इस पद में ‘वाचा’ को प्रत्यक्ष रूप से जोड़ देती है।
translation_notes:
  register: भाषा आधुनिक, सहज और आराधनात्मक गरिमा वाली रखी गई है। पद पिछले पद की वाक्य-रचना को आगे बढ़ाता है, इसलिए मूल में निहित न होने वाला कोई नया क्रियापद नहीं जोड़ा गया। आवर्ती पंक्ति को सरल और स्मरणीय रखा गया है।
