    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּהֲרֹג
  choice: और ... मार डाला
  rationale: वय्यिक्तोल रूप भजन के ऐतिहासिक वर्णन को भूतकाल में आगे बढ़ाता है। ‘मार डाला’ आधुनिक हिन्दी में स्पष्ट है और मूल क्रिया הרג की सीधी शक्ति बनाए रखता है।
- source_word: מְלָכִים
  choice: राजाओं
  rationale: सामान्य बहुवचन संज्ञा ‘राजा’; हिन्दी वाक्य में कर्म के रूप में ‘राजाओं को’ स्वाभाविक है।
- source_word: אַדִּירִים
  choice: पराक्रमी
  rationale: यह विशेषण राजाओं की प्रबलता और सामर्थ्य बताता है। ‘पराक्रमी’ युद्ध-संदर्भ में स्वाभाविक और गरिमापूर्ण है; ‘प्रतापी’ राजसी वैभव का संकेत भी दे सकता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: पुनरावर्ती टेक में यह स्तुति का कारण प्रस्तुत करता है। ‘क्योंकि’ हिन्दी में इसके कारणात्मक अर्थ को स्पष्ट रखता है।
- source_word: לְעוֹלָם
  choice: सदा बनी रहती है
  rationale: शाब्दिक अर्थ ‘सदा/सर्वदा’ है; हिन्दी में חַסְדּוֹ के साथ निहित स्थायित्व को ‘बनी रहती है’ द्वारा स्वाभाविक रूप से व्यक्त किया गया है।
- source_word: חַסְדּוֹ
  choice: उसकी अटल करुणा
  rationale: חֶסֶד में दया, निष्ठावान प्रेम और वाचा-संबंधी विश्वसनीयता के संयुक्त भाव हैं। ‘अटल करुणा’ सामान्य आधुनिक हिन्दी में बोधगम्य है और प्रेमपूर्ण दया तथा स्थिरता दोनों को समेटती है।
theological_decisions:
- issue: टेक में חֶסֶד का अनुवाद
  choice: उसकी अटल करुणा सदा बनी रहती है
  alternative: उसका अटल प्रेम सदा बना रहता है; उसकी वाचा की निष्ठा सदा बनी रहती है
  rationale: ‘अटल करुणा’ दया और स्थायी, निष्ठावान प्रेम दोनों को व्यक्त करती है, पर अर्थ को केवल भावनात्मक प्रेम या केवल औपचारिक वाचा-निष्ठा तक सीमित नहीं करती। न्याय के ऐतिहासिक कार्य के साथ रखी गई मूल theological tension को भी बरकरार रखा गया है।
