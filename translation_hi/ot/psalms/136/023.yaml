  yaml_path: translation/ot/psalms/136/023.yaml
  text: who remembered us in our low estate[b][a], for his steadfast love is forever.
translation:
  language: hi
  text: 'जिसने हमारी दीन दशा[a] में हमें स्मरण किया,

    क्योंकि उसका अटल प्रेम सदा बना रहता है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हमारी दबी हुई अवस्था में” अथवा “हमारे अपमान में।”
    reason: lexical_alternative
lexical_decisions:
- source_word: שֶׁבְּשִׁפְלֵנוּ
  choice: जिसने हमारी दीन दशा में
  rationale: सम्बन्धवाचक कण, पूर्वसर्ग और संज्ञा मिलकर उस नीची, दबी हुई या अपमानित अवस्था को बताते हैं जिसमें परमेश्वर ने अपनी प्रजा को स्मरण किया। ‘दीन दशा’ अर्थ की व्यापकता बनाए रखते हुए स्वाभाविक आधुनिक हिन्दी है।
- source_word: זָכַר לָנוּ
  choice: हमें स्मरण किया
  rationale: זכר का मूल अर्थ ‘स्मरण करना’ है। सन्दर्भ में इससे सहायता के लिए सक्रिय होना निहित हो सकता है, पर अनुवाद क्रिया को स्पष्ट व्याख्या में नहीं बदलता। לָנוּ को हिन्दी मुहावरे के अनुसार ‘हमें’ कहा गया है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह भजन 136 के आवर्ती वाक्य को पिछले कथन के कारण से जोड़ता है। ‘क्योंकि’ इस कारणात्मक सम्बन्ध को आधुनिक हिन्दी में स्पष्ट रखता है।
- source_word: לְעוֹלָם
  choice: सदा का है
  rationale: इब्रानी में कोई व्यक्त क्रिया नहीं है; ‘सदा का है’ उस संक्षिप्त नाममात्र वाक्य के निकट रहता है। अधिक मुहावरेदार ‘सदा बना रहता है’ को पादटिप्पणी में रखा गया है।
- source_word: חַסְדּוֹ
  choice: उसका अटल प्रेम
  rationale: חסד में प्रेम, करुणा और विश्वसनीय निष्ठा का मेल है। ‘अटल प्रेम’ सहज हिन्दी में उसकी स्थिरता और सम्बन्धपरक निष्ठा को व्यक्त करता है, बिना किसी एक धार्मिक व्याख्या तक अर्थ को सीमित किए।
theological_decisions:
- issue: כִּי לְעוֹלָם חַסְדּוֹ आवर्ती वाक्य का अनुवाद
  choice: क्योंकि उसका अटल प्रेम सदा का है
  alternative: क्योंकि उसका अटल प्रेम सदा बना रहता है
  rationale: चुना हुआ पाठ इब्रानी के क्रियारहित वाक्य के अधिक निकट है और परमेश्वर के חסד की स्थायित्वपूर्ण प्रकृति पर बल देता है। वैकल्पिक पाठ वही अर्थ अधिक मुहावरेदार हिन्दी में व्यक्त करता है।
- issue: זָכַר के सन्दर्भगत आशय को स्पष्ट करना या मूल क्रिया बनाए रखना
  choice: हमें स्मरण किया
  alternative: हमारी सुधि ली
  rationale: सन्दर्भ में स्मरण करना कृपापूर्वक हस्तक्षेप को सूचित कर सकता है, फिर भी मूल क्रिया को बनाए रखने से उसका धार्मिक और साहित्यिक तनाव सुरक्षित रहता है; ‘सुधि ली’ उस निहित कार्रवाई को अधिक स्पष्ट कर देती।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामूहिक आराधना में सहज पाठ योग्य रखी गई है। ‘दीन दशा’ सामाजिक अपमान, कष्ट और दुर्बलता में से किसी एक को अनावश्यक रूप से निश्चित नहीं करती; ‘अटल प्रेम’ חסד के प्रेम और निष्ठा दोनों पक्षों को संक्षेप में व्यक्त करता है।
