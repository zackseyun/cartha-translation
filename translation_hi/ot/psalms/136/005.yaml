source:
  edition: WLC
  text: לְ/עֹשֵׂ֣ה הַ֭/שָּׁמַיִם בִּ/תְבוּנָ֑ה כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/136/005.yaml
  text: To him who made the heavens with understanding[b][a], for his steadfast love endures forever.
translation:
  language: hi
  text: 'उसका धन्यवाद करो, जिसने सूझ-बूझ से आकाशों को बनाया,[a]

    क्योंकि उसका अटल प्रेम सदा बना रहता है।[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप में: “उसका धन्यवाद करो, जो सूझ-बूझ से आकाशों को बनाता है।” इब्रानी कृदन्त को वर्तमान अथवा सामान्य अर्थ में भी समझा जा सकता है।'
    reason: lexical_alternative
  - marker: b
    text: “अटल प्रेम” इब्रानी חֶסֶד (खेसेद) का अनुवाद है। प्रसंग के अनुसार इसका अनुवाद “वाचा की निष्ठा,” “दयालु प्रेम” या “करुणा” भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לְעֹשֵׂה
  choice: जिसने ... बनाया, उसका धन्यवाद करो
  rationale: לְ के साथ कृदन्त इस स्तोत्र की आराधनात्मक शृंखला में परमेश्वर की ओर धन्यवाद/स्तुति निर्देशित करता है। हिन्दी में पूर्ण वाक्य और स्वाभाविक संबोधन के लिए मुख्य क्रिया संदर्भ से स्पष्ट रूप में जोड़ी गई है; कृदन्त को सृष्टि के सम्पन्न कार्य के रूप में भूतकाल में व्यक्त किया गया है।
- source_word: הַשָּׁמַיִם
  choice: आकाशों
  rationale: बहुवचन रूप और सृष्टि-संबंधी व्यापक, काव्यात्मक अर्थ को बनाए रखने के लिए ‘आकाशों’ चुना गया है।
- source_word: בִּתְבוּנָה
  choice: सूझ-बूझ से
  rationale: תְּבוּנָה समझ, विवेक और कुशल अंतर्दृष्टि को व्यक्त करता है। ‘सूझ-बूझ’ आधुनिक हिन्दी में स्वाभाविक है, और ‘से’ साधन अथवा रीति—दोनों की सम्भावना बनाए रखता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह आवर्ती पंक्ति स्तुति/धन्यवाद का कारण बताती है; ‘क्योंकि’ हिन्दी में इस संबंध को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: לְעוֹלָם
  choice: सदा बनी रहती है
  rationale: इब्रानी पदबंध का शाब्दिक अर्थ ‘सदा तक’ है; हिन्दी में חֶסֶד की निरन्तरता व्यक्त करने के लिए ‘सदा बनी रहती है’ स्वाभाविक पूर्ति है।
- source_word: חַסְדּוֹ
  choice: उसकी करुणामय निष्ठा
  rationale: חֶסֶד में दया, प्रेम और अटल/वाचा-संबंधी निष्ठा साथ-साथ निहित हैं। ‘करुणामय निष्ठा’ इन आयामों को किसी एक संकीर्ण अर्थ में सीमित किए बिना संक्षेप में व्यक्त करती है।
theological_decisions:
- issue: भजन 136 की आवर्ती पंक्ति में חֶסֶד का अनुवाद
  choice: उसकी करुणामय निष्ठा सदा बनी रहती है
  alternative: उसकी करुणा सदा बनी रहती है; उसका अटल प्रेम सदा बना रहता है
  rationale: ‘करुणामय निष्ठा’ मूल शब्द के दया-प्रेम और स्थायी निष्ठा, दोनों पक्षों को बनाए रखती है। केवल ‘करुणा’ निष्ठा के आयाम को और केवल ‘अटल प्रेम’ दया के आयाम को कम स्पष्ट कर सकता है।
- issue: לְעֹשֵׂה में कृदन्त का कालगत अर्थ
  choice: जिसने ... बनाया
  alternative: जो ... बनाता है
  rationale: इब्रानी कृदन्त सामान्य अथवा निरन्तर कार्य भी व्यक्त कर सकता है, पर सृष्टि के कार्यों की इस शृंखला में हिन्दी का भूतकाल अधिक स्वाभाविक है। वैकल्पिक अधिक शाब्दिक सम्भावना पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, काव्यात्मक और सामूहिक आराधना के योग्य रूप। ‘सूझ-बूझ’ सामान्य पाठक के लिए बोधगम्य है; ‘करुणामय निष्ठा’ חֶסֶד की अर्थ-समृद्धि को संक्षेप में सुरक्षित रखती है।
