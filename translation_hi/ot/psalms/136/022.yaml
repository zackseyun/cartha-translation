source:
  edition: WLC
  text: נַ֭חֲלָה לְ/יִשְׂרָאֵ֣ל עַבְדּ֑/וֹ כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/136/022.yaml
  text: an inheritance to Israel his servant[b][a], for his steadfast love endures forever.
translation:
  language: hi
  text: 'अपने सेवक इस्राएल को विरासत[a] के रूप में,

    क्योंकि उसका अटल प्रेम[b] सदा बना रहता है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘पैतृक संपत्ति’ अथवा ‘अधिकार में मिली संपत्ति’।
    reason: lexical_alternative
  - marker: b
    text: ‘अटल प्रेम’ उस इब्रानी शब्द का अनुवाद है जिसमें प्रायः निष्ठावान, वाचा से जुड़ा प्रेम निहित होता है; अन्य संभव अनुवाद हैं ‘प्रेममयी कृपा’ या ‘करुणा’।
    reason: lexical_alternative
lexical_decisions:
- source_word: נַחֲלָה
  choice: विरासत
  rationale: यह संज्ञा उत्तराधिकार में मिली या बाँटी गई संपत्ति को दर्शाती है; प्रसंग में यह इस्राएल को दी गई भूमि है। ‘विरासत’ अर्थ को संक्षिप्त और स्वाभाविक रूप से व्यक्त करता है।
- source_word: לְיִשְׂרָאֵל
  choice: इस्राएल को
  rationale: לְ यहाँ प्राप्तकर्ता को चिह्नित करता है; हिन्दी में ‘को’ इसी संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: עַבְדּוֹ
  choice: अपने सेवक
  rationale: यहाँ עֶבֶד इस्राएल के लिए परमेश्वर से संबंध और उसकी सेवा को दर्शाने वाली वाचा-संबंधी उपाधि है; प्रसंग दासत्व की बाध्यता पर बल नहीं देता।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह भजन में बार-बार आने वाली पंक्ति को आरंभ करता और स्तुति का आधार बताता है। ‘क्योंकि’ हिन्दी में कारण-सूचक बल को स्पष्ट रखता है।
- source_word: לְעוֹלָם
  choice: सदा बना रहता है
  rationale: यह अनंत अवधि व्यक्त करता है। חַסְדּוֹ के साथ मिलाकर यह प्रयोग सहज हिन्दी में प्रेम की निरंतरता बताता है।
- source_word: חַסְדּוֹ
  choice: उसका अटल प्रेम
  rationale: חֶסֶד में प्रेम, निष्ठा और वाचा के प्रति विश्वसनीयता का संयुक्त भाव है। ‘अटल प्रेम’ केवल भावना या दया तक अर्थ को सीमित किए बिना उसकी स्थिरता सामने लाता है।
theological_decisions:
- issue: עַבְדּוֹ में इस्राएल और परमेश्वर के संबंध का अनुवाद
  choice: अपने सेवक
  alternative: अपने दास
  rationale: इस पद में इस्राएल को परमेश्वर का माना हुआ और उसकी सेवा करने वाला समुदाय कहा गया है; बाध्य दासत्व यहाँ प्रमुख विषय नहीं है, इसलिए ‘सेवक’ अधिक प्रसंगानुकूल है।
- issue: भजन की आवर्ती पंक्ति में חַסְדּוֹ का अनुवाद
  choice: उसका अटल प्रेम
  alternative: उसकी करुणा; उसका वाचा-प्रेम; उसकी प्रेममयी कृपा
  rationale: ‘अटल प्रेम’ स्नेह और निष्ठा, दोनों को समेटता है और मूल शब्द को केवल दया अथवा किसी तकनीकी धार्मिक पद तक सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। मूल पद पिछले वाक्य को आगे बढ़ाने वाला संज्ञात्मक अंश है, इसलिए अनावश्यक क्रिया जोड़ने के बजाय ‘विरासत के रूप में’ रखा गया है। काव्यात्मक आवर्ती पंक्ति को अलग पंक्ति में रखा गया है।
