  text: ה֭וֹדוּ לַ/אֲדֹנֵ֣י הָ/אֲדֹנִ֑ים כִּ֖י לְ/עֹלָ֣ם חַסְדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/136/003.yaml
  text: Give thanks to the Lord of lords[a], for his steadfast love endures forever.
translation:
  language: hi
  text: 'प्रभुओं के प्रभु का धन्यवाद करो,

    क्योंकि उसका अटल प्रेम सदा बना रहता है।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्योंकि वाचा के प्रति उसकी निष्ठा सदा बनी रहती है।” इब्रानी शब्द חֶסֶד का अर्थ निष्ठावान, वाचा से जुड़ा प्रेम, और साथ ही दया या करुणा भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹדוּ
  choice: धन्यवाद करो
  rationale: हिफ़ील बहुवचन आज्ञार्थक यहाँ उपासक समुदाय को परमेश्वर के प्रति कृतज्ञता व्यक्त करने के लिए बुलाता है। यह भजन 136 के आवर्ती आह्वान के लिए स्वाभाविक और सटीक है।
- source_word: לַאֲדֹנֵי הָאֲדֹנִים
  choice: प्रभुओं के प्रभु का
  rationale: यह इब्रानी संबंध-वाचक अभिव्यक्ति सर्वोच्च प्रभुता बताती है। हिंदी में ‘प्रभुओं के प्रभु’ मूल मुहावरे और उसके धार्मिक भार को बनाए रखता है; ‘का धन्यवाद करो’ स्वाभाविक हिंदी कारक-प्रयोग है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह धन्यवाद देने के आह्वान का कारण प्रस्तुत करता है और हिंदी में संबंध को स्पष्ट तथा सहज ढंग से व्यक्त करता है।
- source_word: לְעוֹלָם
  choice: सदा बनी रहती है
  rationale: मूल का शाब्दिक भाव ‘सर्वदा के लिए’ है। क्रियाहीन इब्रानी उपवाक्य को स्वाभाविक हिंदी में निहित स्थायित्व की क्रिया के साथ व्यक्त किया गया है।
- source_word: חַסְדּוֹ
  choice: उसकी अटल करुणा
  rationale: חֶסֶד में दयालु प्रेम, निष्ठा और स्थिरता के परस्पर जुड़े भाव हैं। ‘अटल करुणा’ सामान्य पाठक के लिए सुबोध रहते हुए प्रेमपूर्ण दया और दृढ़ता दोनों को सामने लाती है; पादटिप्पणी वाचा-निष्ठा के वैकल्पिक आयाम को सुरक्षित रखती है।
theological_decisions:
- issue: אֲדֹנֵי הָאֲדֹנִים की उपाधि
  choice: प्रभुओं के प्रभु
  alternative: स्वामियों के स्वामी
  rationale: यह पद परमेश्वर की सर्वोच्च प्रभुता व्यक्त करता है। ‘प्रभु’ हिंदी बाइबलीय भाषा में प्रतिष्ठित और वर्तमान उपाधि है तथा मूल की पुनरुक्त संबंध-वाचक संरचना को बनाए रखता है।
- issue: חֶסֶד का अर्थ-क्षेत्र
  choice: अटल करुणा
  alternative: वाचा के प्रति उसकी निष्ठा
  rationale: मूल शब्द करुणामय प्रेम और निष्ठावान, टिकाऊ संबंध दोनों व्यक्त कर सकता है। मुख्य पाठ किसी एक तकनीकी धार्मिक व्याख्या तक अर्थ को सीमित नहीं करता, जबकि पादटिप्पणी वाचागत आयाम स्पष्ट करती है।
translation_notes:
  register: आधुनिक मानक हिंदी, काव्यात्मक और उपासना-योग्य किंतु सामान्य पाठकों के लिए सहज। ‘प्रभुओं के प्रभु’ मूल उपाधि की गरिमा रखता है और ‘अटल करुणा’ भजन के आवर्ती प्रत्युत्तर के लिए संक्षिप्त तथा स्मरणीय है।
