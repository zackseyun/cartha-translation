id: PSA.136.20
reference: Psalms 136:20
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וּ֭/לְ/עוֹג מֶ֣לֶךְ הַ/בָּשָׁ֑ן כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/136/020.yaml
  text: and Og king of Bashan[a], for his steadfast love endures forever.
translation:
  language: hi
  text: और बाशान के राजा ओग को[a]—क्योंकि उसका अटल प्रेम सदा बना रहता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह वाक्य पिछले कथन की क्रिया को आगे बढ़ाता है; भाव है, “और बाशान के राजा ओग को [मार गिराया]।”
    reason: इब्रानी में क्रिया इस पंक्ति में दोहराई नहीं गई है, पर לְ उपसर्ग पिछले कथन से चले आ रहे कर्म-संबंध को दर्शाता है।
lexical_decisions:
- source_word: וּלְעוֹג
  choice: और … ओग को
  rationale: וּ को क्रम जारी रखने वाले ‘और’ के रूप में और לְ को पिछले कथन से चली आ रही क्रिया के कर्म-सूचक ‘को’ के रूप में व्यक्त किया गया है। हिंदी में ‘को’ बनाए रखना स्वाभाविक और व्याकरणतः स्पष्ट है।
- source_word: מֶלֶךְ הַבָּשָׁן
  choice: बाशान के राजा
  rationale: यह संबंधसूचक पदबंध ओग की पहचान बाशान के राजा के रूप में करता है; स्थाननाम को प्रचलित लिप्यंतरण ‘बाशान’ में रखा गया है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह भजन के बार-बार आने वाले प्रत्युत्तर का कारणसूचक आरंभ है। ‘क्योंकि’ आधुनिक हिंदी में इस व्याख्यात्मक और उपासना-संबंधी बल को स्पष्ट रखता है।
- source_word: לְעוֹלָם
  choice: सदा बना रहता है
  rationale: शाब्दिक अर्थ ‘सदा के लिए’ है। חַסְדּוֹ के साथ मिलकर यह उसके प्रेम के निरंतर बने रहने को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: חַסְדּוֹ
  choice: उसका अटल प्रेम
  rationale: חֶסֶד में निष्ठावान, स्थायी प्रेम और कृपा का भाव है। ‘अटल प्रेम’ इस व्यापक अर्थ को सहज आधुनिक हिंदी में रखता है और इसे केवल दया तक सीमित नहीं करता।
theological_decisions:
- issue: भजन 136 के प्रत्युत्तर में חֶסֶד का अनुवाद
  choice: अटल प्रेम
  alternative: करुणा; वाचा का प्रेम; अटल करुणा
  rationale: ‘अटल प्रेम’ परमेश्वर के स्थायी और निष्ठावान प्रेम पर बल देता है, पर मूल शब्द को केवल ‘दया’ या किसी संकीर्ण धर्मशास्त्रीय परिभाषा तक सीमित नहीं करता।
- issue: अपूर्ण उपवाक्य में पिछले पद की क्रिया का संबंध
  choice: ‘ओग को’ रखकर क्रिया को पिछले कथन से समझना
  alternative: इस पद में ‘मार गिराया’ जैसी क्रिया जोड़ देना
  rationale: इब्रानी में इस पंक्ति की क्रिया पहले के कथन से समझी जाती है। उसे मुख्य पाठ में जोड़ने के बजाय मूल की काव्यात्मक, सूचीबद्ध संरचना और वास्तविक व्याकरणिक निर्भरता बचाई गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामूहिक पाठ के अनुकूल रखी गई है। डैश मुख्य कथन और बार-बार आने वाले प्रत्युत्तर के बीच काव्यात्मक विराम दिखाता है।
