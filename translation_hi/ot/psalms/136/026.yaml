  text: ה֭וֹדוּ לְ/אֵ֣ל הַ/שָּׁמָ֑יִם כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/136/026.yaml
  text: Give thanks to the God of heaven[a], for his steadfast love endures forever.
translation:
  language: hi
  text: 'स्वर्ग के परमेश्वर का धन्यवाद करो,

    क्योंकि उसका अटल प्रेम सदा बना रहता है।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसकी वाचा की निष्ठा सदा बनी रहती है।” इब्रानी חֶסֶד में अटल प्रेम, कृपा और संबंध अथवा वाचा के प्रति निष्ठा का भाव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹדוּ
  choice: धन्यवाद करो
  rationale: ידה के हिफ़ील बहुवचन आज्ञार्थक का अर्थ समुदाय को धन्यवाद या स्तुति करने के लिए बुलाना है। भजन 136 के आवर्ती आह्वान में ‘धन्यवाद करो’ स्वाभाविक और सुसंगत है।
- source_word: לְאֵל
  choice: परमेश्वर का
  rationale: אֵל यहाँ שׁמים के साथ उपाधिस्वरूप ‘परमेश्वर’ को दर्शाता है। हिंदी में ‘परमेश्वर का धन्यवाद करो’ अपेक्षित कारक-रचना है।
- source_word: הַשָּׁמָיִם
  choice: स्वर्ग के
  rationale: रूप की दृष्टि से यह बहुवचन है, पर इस प्रसंग में परमेश्वर के स्वर्गीय क्षेत्र को सूचित करता है; आधुनिक हिंदी में ‘स्वर्ग के परमेश्वर’ स्वाभाविक है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह धन्यवाद देने का आधार प्रस्तुत करता है। ‘क्योंकि’ हिंदी में कारण-संबंध स्पष्ट और सहज रखता है।
- source_word: לְעוֹלָם
  choice: सदा बनी रहती है
  rationale: शाब्दिक भाव ‘सदा के लिए’ है। निर्लिखित क्रियात्मक भाव को हिंदी में ‘बनी रहती है’ से स्वाभाविक ढंग से व्यक्त किया गया है।
- source_word: חַסְדּוֹ
  choice: उसकी अटल करुणा
  rationale: חֶסֶד में कृपालु प्रेम, निष्ठा और स्थायित्व साथ आते हैं। ‘अटल करुणा’ सामान्य हिंदी में सुलभ रहते हुए उसके भावात्मक और दृढ़ पक्षों को संक्षेप में व्यक्त करती है; वाचा-निष्ठा का पहलू पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: भजन 136 के आवर्तन में חֶסֶד का अनुवाद
  choice: उसकी अटल करुणा सदा बनी रहती है
  alternative: उसकी वाचा की निष्ठा सदा बनी रहती है
  rationale: ‘अटल करुणा’ प्रेमपूर्ण कृपा और स्थायी निष्ठा दोनों को खुला रखती है, जबकि केवल ‘दया’ शब्द को करुणा तक और ‘वाचा की निष्ठा’ को संबंधपरक निष्ठा तक सीमित कर सकता है। पादटिप्पणी मूल शब्द की वाचागत छाया सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिंदी; काव्यात्मक और उपासना-योग्य, किंतु सामान्य पाठक के लिए स्पष्ट। दो पंक्तियों की रचना भजन के आह्वान और आवर्तन को उभारती है।
