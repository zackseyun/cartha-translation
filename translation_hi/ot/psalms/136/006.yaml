  yaml_path: translation/ot/psalms/136/006.yaml
  text: to him who spread out the earth upon the waters[a], for his steadfast love endures forever.
translation:
  language: hi
  text: 'उसका धन्यवाद करो, जिसने पृथ्वी को जल के ऊपर फैलाया[a],

    क्योंकि उसका अटल प्रेम सदा बना रहता है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पृथ्वी को जल के ऊपर ताना”; इब्रानी क्रिया का ठोस अर्थ धातु को पीटकर चौड़ी सतह बनाना भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לְרֹקַע
  choice: जिसने...फैलाया
  rationale: लְ इस स्तोत्र की स्तुतिमाला में प्रशंसा के पात्र को इंगित करता है, और רֹקַע किसी सतह को फैलाने या पीटकर विस्तृत करने का बोध देता है। सृष्टि के इस संदर्भ में ‘फैलाया’ स्वाभाविक है और मूल बिंब को बनाए रखता है।
- source_word: הָאָרֶץ
  choice: पृथ्वी
  rationale: जल के साथ आए ब्रह्मांडीय सृष्टि-संदर्भ में אֶרֶץ किसी विशेष भूभाग के बजाय पृथ्वी को दर्शाता है।
- source_word: עַל הַמָּיִם
  choice: जल के ऊपर
  rationale: עַל का अर्थ ‘पर’ या ‘ऊपर’ हो सकता है। यहाँ ‘जल के ऊपर’ काव्यात्मक सृष्टि-बिंब को स्पष्ट और स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह स्तोत्र के आवर्ती कथन में स्तुति का आधार प्रस्तुत करता है।
- source_word: לְעוֹלָם
  choice: सदा बनी रहती है
  rationale: עוֹלָם निरंतरता अथवा अनंत काल का बोध देता है। हिन्दी में निहित क्रिया को ‘बनी रहती है’ से व्यक्त करना आवर्ती पंक्ति को स्वाभाविक बनाता है।
- source_word: חַסְדּוֹ
  choice: उसकी अटल करुणा
  rationale: חֶסֶד में निष्ठावान प्रेम, दया और स्थिर विश्वसनीयता के जुड़े हुए भाव हैं। ‘अटल करुणा’ स्नेहपूर्ण दया और स्थायित्व दोनों को संक्षेप में व्यक्त करती है, यद्यपि कोई एक हिन्दी पद इसकी पूरी अर्थ-सीमा नहीं समेटता।
theological_decisions:
- issue: सृष्टि का ब्रह्मांडीय बिंब
  choice: ‘पृथ्वी को जल के ऊपर फैलाया’ के काव्यात्मक चित्र को बनाए रखा गया है।
  alternative: इसे सामान्यीकृत करके ‘संसार की नींव रखी’ कहना।
  rationale: मूल इब्रानी प्राचीन काव्यात्मक ब्रह्मांडीय चित्र प्रस्तुत करता है। उसे आधुनिक वैज्ञानिक श्रेणियों से सामंजस्य बैठाने या अमूर्त कथन में बदलने के बजाय उसी तनाव और चित्रात्मकता के साथ रखना स्रोत के अधिक निकट है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल किंतु गरिमापूर्ण काव्यात्मक शैली रखी गई है। ‘जल’ ब्रह्मांडीय और स्तोत्रीय संदर्भ के अनुकूल है; ‘अटल करुणा’ חֶסֶד के दया और स्थिर निष्ठा—दोनों पहलुओं को संक्षेप में व्यक्त करती है।
