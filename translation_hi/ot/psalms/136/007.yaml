  yaml_path: translation/ot/psalms/136/007.yaml
  text: To him who made the great lights[b][a], for his steadfast love endures forever.
translation:
  language: hi
  text: 'उसका धन्यवाद करो, जिसने बड़ी ज्योतियाँ बनाई,

    क्योंकि उसका अटल प्रेम सदा बना रहता है।[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बड़े प्रकाश-पिंड।” इब्रानी शब्द आकाश में प्रकाश देने वाले पिंडों को सूचित करता है।
    reason: lexical_alternative
  - marker: b
    text: या, “उसकी अटल करुणा सदा बनी रहती है,” अथवा “उसकी वाचा की निष्ठा सदा बनी रहती है।” इब्रानी חֶסֶד में कृपालु, निष्ठावान और स्थायी प्रेम का भाव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לְעֹשֵׂה
  choice: उसके लिए जिसने ... बनाईं
  rationale: לְ दातृवाचक स्तुति-सूत्र को आगे बढ़ाता है, और कृदन्त עֹשֵׂה यहाँ सृष्टि के पूर्ण किए गए कार्य को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אוֹרִים גְּדֹלִים
  choice: बड़ी ज्योतियाँ
  rationale: אוֹרִים आकाशीय प्रकाश देने वाले पिंडों को सूचित करता है। ‘ज्योतियाँ’ उत्पत्ति 1 की सृष्टि-भाषा की प्रतिध्वनि बनाए रखता है, जबकि גְּדֹלִים का सीधा अर्थ ‘बड़ी’ है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह आवर्ती टेक स्तुति का कारण प्रस्तुत करती है; आधुनिक हिन्दी में ‘क्योंकि’ उसका व्याख्यात्मक बल स्पष्ट रखता है।
- source_word: לְעוֹלָם
  choice: सदा बनी रहती है
  rationale: शाब्दिक भाव ‘सदा के लिए’ है; हिन्दी वाक्य में आवश्यक क्रियात्मक अर्थ जोड़कर स्थायी निरंतरता व्यक्त की गई है।
- source_word: חַסְדּוֹ
  choice: उसकी अटल करुणा
  rationale: חֶסֶד में प्रेम, कृपा और निष्ठावान स्थिरता साथ-साथ निहित हैं। ‘अटल करुणा’ इस व्यापकता को सरल, गरिमापूर्ण हिन्दी में व्यक्त करती है, बिना इसे केवल भावना या केवल विधिक वाचा तक सीमित किए।
theological_decisions:
- issue: आवर्ती टेक में חֶסֶד का अनुवाद
  choice: उसकी अटल करुणा सदा बनी रहती है
  alternative: उसका अटल प्रेम सदा बना रहता है; उसकी वाचा की निष्ठा सदा बनी रहती है
  rationale: ‘अटल करुणा’ ईश्वर की कृपालुता और स्थायी निष्ठा दोनों को व्यक्त करती है। वैकल्पिक ‘वाचा की निष्ठा’ स्रोत में निहित एक वास्तविक पक्ष है, पर मुख्य पाठ में उसे रखने से अर्थ अनावश्यक रूप से संकीर्ण हो सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और काव्यात्मक पाठ। भजन की समांतर स्तुति-संरचना बनाए रखने के लिए पहली पंक्ति ‘उसके लिए जिसने’ से रखी गई है। आवर्ती टेक को सहज सामूहिक पाठ के योग्य बनाया गया है।
