  text: כִּ֤י שָׁ֨ם שְֽׁאֵל֪וּ/נוּ שׁוֹבֵ֡י/נוּ דִּבְרֵי שִׁ֭יר וְ/תוֹלָלֵ֣י/נוּ שִׂמְחָ֑ה שִׁ֥ירוּ לָ֝֗/נוּ מִ/שִּׁ֥יר צִיּֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/137/003.yaml
  text: 'For there our captors asked us for words of song[a], and our tormentors for gladness: “Sing for us one of the songs of Zion.”'
translation:
  language: hi
  text: 'क्योंकि वहाँ हमें बंदी बनानेवालों ने हमसे गीत के बोल माँगे,

    और हमें सतानेवालों[a] ने आनंद की माँग की:

    “हमारे लिए सिय्योन के गीतों में से कोई एक गाओ।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘हमारा उपहास करनेवालों’; इब्रानी शब्द दुर्लभ है और उसका आशय अपमानजनक उत्पीड़न या तिरस्कारपूर्ण उपहास, दोनों में से कोई हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले पद में गाने से इनकार करने का कारण बताता है; ‘क्योंकि’ इसके कारणात्मक अर्थ को स्वाभाविक हिंदी में सुरक्षित रखता है।
- source_word: שָׁם
  choice: वहाँ
  rationale: संदर्भ में यह बाबेल की ओर संकेत करनेवाला साधारण स्थानवाचक क्रियाविशेषण है।
- source_word: שְׁאֵלוּנוּ
  choice: हमसे … माँगे
  rationale: यहाँ क्रिया किसी व्यक्ति से कुछ माँगने की बात कहती है; हिंदी में ‘हमसे … माँगे’ स्वाभाविक और अर्थानुरूप है।
- source_word: שׁוֹבֵינוּ
  choice: हमें बंदी बनानेवालों
  rationale: मूल शब्द उन लोगों को दर्शाता है जो बंदी बनाकर ले गए; यह चयन ‘विजेताओं’ से अधिक सटीक और सामान्य पाठक के लिए स्पष्ट है।
- source_word: דִּבְרֵי שִׁיר
  choice: गीत के बोल
  rationale: शाब्दिक भाव ‘गीत के शब्द’ है। ‘गीत के बोल’ आधुनिक हिंदी में स्वाभाविक है और केवल संगीत नहीं, बल्कि गाकर सुनाने की माँग को व्यक्त करता है।
- source_word: וְתוֹלָלֵינוּ
  choice: और हमें सतानेवालों
  rationale: यह दुर्लभ शब्द अपमानजनक उत्पीड़न अथवा उपहास करनेवालों की ओर संकेत कर सकता है। संदर्भ में ‘सतानेवालों’ व्यापक शत्रुतापूर्ण व्यवहार को व्यक्त करता है; वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: שִׂמְחָה
  choice: आनंद
  rationale: शब्द आनंद, उल्लास या मनोरंजन का भाव रखता है। ‘आनंद’ आधुनिक और गरिमापूर्ण है तथा बंदियों से प्रसन्नतापूर्ण प्रस्तुति की माँग को दर्शाता है।
- source_word: שִׁירוּ לָנוּ
  choice: हमारे लिए … गाओ
  rationale: बहुवचन आज्ञार्थक क्रिया और ל मिलकर श्रोताओं के लिए गाने की माँग व्यक्त करते हैं; हिंदी में यह स्वाभाविक रूप है।
- source_word: מִשִּׁיר צִיּוֹן
  choice: सिय्योन के गीतों में से कोई एक
  rationale: यहाँ מִן अंशवाचक है, अर्थात सिय्योन से जुड़े गीतों के समूह में से एक गीत गाने को कहा गया है।
