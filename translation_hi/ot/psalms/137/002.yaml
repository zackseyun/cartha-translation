lexical_decisions:
- source_word: עַל
  choice: पर
  rationale: स्थान-सूचक अर्थ ‘पर/ऊपर’ को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: עֲרָבִים
  choice: चिनारों
  rationale: यह इब्रानी वृक्ष-नाम विलो अथवा पॉपलर-प्रकार के वृक्ष का संकेत दे सकता है। बाबुल के परिवेश में पॉपलर-प्रकार का वृक्ष संभावित है; हिन्दी में ‘चिनार’ अधिक सहज वृक्ष-नाम है, जबकि पारंपरिक ‘बेद’ को पादटिप्पणी में रखा गया है।
- source_word: בְּתוֹכָהּ
  choice: उसके बीच के
  rationale: स्त्रीलिंग एकवचन प्रत्यय पिछले पद के बाबुल की ओर संकेत करता है। यह रूप मूल के स्थान-सूचक भाव को बनाए रखता है और मुख्य पाठ में ‘नगर’ या ‘देश’ जोड़कर अस्पष्टता को समाप्त नहीं करता।
- source_word: תָּלִינוּ
  choice: हमने ... टाँग दी थीं
  rationale: क्रिया का सीधा अर्थ ‘टाँगना’ है। भूतकाल का यह स्वाभाविक हिन्दी रूप शोक में वाद्यों को अलग रख देने का चित्र व्यक्त करता है।
- source_word: כִּנֹּרוֹתֵינוּ
  choice: अपनी वीणाएँ
  rationale: כִּנּוֹר एक प्राचीन तार-वाद्य था, संभवतः लाइर। साधारण हिन्दी पाठक के लिए ‘वीणा’ सुबोध और गरिमापूर्ण निकटतम शब्द है; अधिक तकनीकी नाम पादटिप्पणी में दिया गया है।
