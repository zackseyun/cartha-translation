  yaml_path: translation/ot/psalms/137/009.yaml
  text: Blessed is the one who seizes and dashes your little ones against the rock[a].
translation:
  language: hi
  text: धन्य है वह जो तेरे नन्हे बच्चों को पकड़कर चट्टान पर पटक दे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘तेरे शिशुओं को।’ इब्रानी शब्द बहुत छोटे बच्चों के लिए प्रयुक्त हुआ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: धन्य है
  rationale: यह बहुवचन रूप मुहावरे के तौर पर धन्यता की उद्घोषणा करता है। भजन की गंभीर मूल्यांकनात्मक शक्ति बनाए रखने के लिए ‘धन्य है’ स्वाभाविक और उपयुक्त है।
- source_word: שֶׁיֹּאחֵז
  choice: वह, जो ... पकड़कर
  rationale: सम्बन्धवाचक अव्यय और क्रिया मिलकर ‘वह, जो पकड़े’ का अर्थ देते हैं। ‘पकड़कर’ बलपूर्वक थामने की क्रिया को बिना नरम किए सहज हिन्दी में व्यक्त करता है।
- source_word: וְנִפֵּץ
  choice: पटक देगा
  rationale: यह क्रिया जोर से मारकर तोड़ने या चकनाचूर करने की हिंसक क्रिया बताती है। चट्टान के साथ ‘पटक देगा’ आधुनिक हिन्दी में स्वाभाविक है और चित्र की कठोरता बनाए रखता है।
- source_word: עֹלָלַיִךְ
  choice: तेरे नन्हे बच्चों को
  rationale: संज्ञा बहुत छोटे बच्चों को सूचित करती है। ‘नन्हे बच्चे’ आयु और करुण भाव दोनों को व्यक्त करता है; केवल ‘बच्चे’ अर्थ में अधिक व्यापक होता।
- source_word: אֶל הַסָּלַע
  choice: चट्टान पर
  rationale: हिंसक प्रहार की इस क्रिया के साथ हिन्दी में ‘चट्टान पर पटकना’ स्वाभाविक प्रयोग है। ‘चट्टान’ סלע का सामान्य और चित्रात्मक अनुवाद है।
theological_decisions:
- issue: श्रापात्मक प्रसंग में אַשְׁרֵי का नैतिक और धर्मवैज्ञानिक बल
  choice: धन्यता की उद्घोषणा को सीधे ‘धन्य है’ के रूप में रखा गया है; हिंसक चित्र को न तो नरम किया गया है, न उस पर अनुवाद के भीतर नैतिक टिप्पणी जोड़ी गई है।
  alternative: ‘सुखी है’ या ‘भाग्यवान है’ कहकर कथन का बल बदलना अथवा हिंसा को व्याख्यात्मक ढंग से कम करना।
  rationale: इब्रानी पाठ बाबेल के विरुद्ध प्रतिशोधात्मक न्याय की पुकार के बीच स्पष्ट रूप से धन्यता घोषित करता है। अनुवाद को इस कठिन नैतिक और धर्मवैज्ञानिक तनाव को हल किए बिना सुरक्षित रखना चाहिए।
translation_notes:
  register: आधुनिक मानक हिन्दी में गंभीर, काव्यात्मक और स्पष्ट शैली रखी गई है। ‘तेरे’ भजन में सम्बोधित बाबेल के एकवचन स्त्रीलिंग रूप को दर्शाता है। हिंसक बिंब को मूल के अनुरूप असंशोधित रखा गया है।
