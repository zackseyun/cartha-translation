source:
  edition: WLC
  text: זְכֹ֤ר יְהוָ֨ה לִ/בְנֵ֬י אֱד֗וֹם אֵת֮ י֤וֹם יְֽרוּשָׁ֫לִָ֥ם הָ֭/אֹ֣מְרִים עָ֤רוּ עָ֑רוּ עַ֝֗ד הַ/יְס֥וֹד בָּֽ/הּ׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/137/007.yaml
  text: Remember[a], O Yahweh, against the sons of Edom the day of Jerusalem, those who were saying, “Lay it bare, lay it bare[b], down to its foundation!”
translation:
  language: hi
  text: हे यहवे, एदोम के वंशजों के विरुद्ध यरूशलेम का वह दिन[a] याद कर, जब वे कह रहे थे, “उसे उजाड़ दो! उजाड़ दो[b], उसकी नींव तक!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यरूशलेम के पतन का दिन।” इब्रानी में शाब्दिक रूप से “यरूशलेम का दिन” है, जिसका संकेत नगर पर आई विपत्ति के समय की ओर है।
    reason: lexical_alternative
  - marker: b
    text: या, “उसे नंगा कर दो! नंगा कर दो!” अथवा “उसे ढा दो! ढा दो!” इब्रानी क्रिया नगर को पूरी तरह नंगा या उजाड़ देने पर बल देती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: זְכֹר
  choice: याद कर
  rationale: यह यहवे को संबोधित पुल्लिंग एकवचन आज्ञार्थक है। विलाप और न्याय की पुकार के संदर्भ में ‘याद कर’ स्वाभाविक और सीधा है; विरोध का भाव आगे ‘के विरुद्ध’ से व्यक्त होता है।
- source_word: יְהוָה
  choice: यहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय आधुनिक हिंदी में निकट लिप्यंतरण के रूप में रखा गया है।
- source_word: לִבְנֵי אֱדוֹם
  choice: एदोम के वंशजों के विरुद्ध
  rationale: זכר के साथ ל यहाँ न्यायिक-विरोधी अर्थ देता है, इसलिए ‘के विरुद्ध’ चुना गया। ‘वंशज’ इब्रानी की पारिवारिक-राष्ट्रीय अभिव्यक्ति को सहज हिंदी में बनाए रखता है।
- source_word: אֵת יוֹם יְרוּשָׁלִָם
  choice: यरूशलेम का वह दिन
  rationale: शाब्दिक रूप ‘यरूशलेम का दिन’ है। संकेत नगर की विपत्ति के समय की ओर है, पर मुख्य पाठ में ‘पतन’ जोड़कर संक्षिप्त इब्रानी को अनावश्यक रूप से निश्चित नहीं किया गया।
- source_word: הָאֹמְרִים
  choice: जब वे कह रहे थे
  rationale: कृदंत उस समय एदोमियों की जारी पुकार को चित्रित करता है। हिंदी में ‘जब वे कह रहे थे’ इस वर्णनात्मक और कालगत बल को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: עָרוּ עָרוּ
  choice: उसे उघाड़ दो! उघाड़ दो
  rationale: दोहराया गया आज्ञार्थक नगर को पूर्णतः खोल देने या नंगा कर देने का सजीव भाव रखता है। ‘ढा दो’ परिणाम को बताता, लेकिन क्रिया के मूल अनावरण-भाव को कम कर देता।
- source_word: עַד הַיְסוֹד בָּהּ
  choice: उसकी नींव तक
  rationale: यह पूर्ण विनाश को नींव के स्तर तक ले जाने का भाव देता है। एकवचन ‘नींव’ इब्रानी संज्ञा के अनुरूप और हिंदी में स्वाभाविक है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम सीधे आया है। ‘यहवे’ उसे उपाधि ‘प्रभु’ से प्रतिस्थापित किए बिना सुरक्षित रखता है; ‘यहोवा’ एक पारंपरिक, पर कम स्रोत-सन्निकट स्वरांकन है।
- issue: एदोम के विरुद्ध स्मरण की न्यायिक पुकार
  choice: एदोम के वंशजों के विरुद्ध ... याद कर
  alternative: एदोम के वंशजों को ... याद कर
  rationale: संदर्भ प्रतिशोधात्मक विलाप और न्याय की याचना है। ‘के विरुद्ध’ ל के संभावित प्रतिकूल/न्यायिक बल को स्पष्ट करता है, जबकि क्रोध या दंड का कोई अतिरिक्त विवरण नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमामय किंतु तीखा विलापात्मक स्वर रखा गया है। संबोधन में ‘हे’ और आज्ञार्थक ‘याद कर’ काव्यात्मक प्रार्थना के अनुकूल हैं। विस्मयादिबोधक चिह्न दोहराई गई विनाशकारी पुकार की तीव्रता दिखाते हैं।
