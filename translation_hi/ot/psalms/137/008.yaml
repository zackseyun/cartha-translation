  yaml_path: translation/ot/psalms/137/008.yaml
  text: Daughter Babylon[a], devastated one[b], blessed is the one who repays you with the recompense you dealt to us.
translation:
  language: hi
  text: हे बाबेल-बेटी[a], हे उजड़ी हुई[b], धन्य है वह जो तुझे वैसा ही प्रतिफल दे, जैसा तूने हमारे साथ किया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘बाबेल की बेटी’; इब्रानी मुहावरा बाबेल नगर को बेटी के रूप में व्यक्त करता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘नष्ट की हुई’ अथवा ‘लूटी हुई’; इब्रानी शब्द पहले से हो चुके विनाश या आनेवाले विनाश—दोनों पर बल दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּת בָּבֶל
  choice: बाबेल की बेटी
  rationale: यह इब्रानी काव्यात्मक मुहावरा बाबेल नगर और उसके लोगों को स्त्री-रूप में व्यक्त करता है। हिंदी में ‘बाबेल की बेटी’ इस व्यक्तिकरण को स्वाभाविक और गरिमापूर्ण ढंग से बनाए रखता है।
- source_word: הַשְּׁדוּדָה
  choice: उजड़ी हुई नगरी
  rationale: שׁדד से बना यह स्त्रीलिंग निष्क्रिय रूप उजाड़े, लूटे या विनष्ट किए जाने की दशा बता सकता है। ‘उजड़ी हुई’ वर्तमान विनाश की छवि रखता है और इसे अनिवार्य रूप से केवल भावी विनाश नहीं बनाता; ‘नगरी’ से हिंदी में संबोधन और स्त्रीलिंग संकेत स्पष्ट होता है।
- source_word: אַשְׁרֵי
  choice: धन्य है
  rationale: यह भजन-साहित्य में प्रयुक्त आशीर्वचनात्मक सूत्र है। ‘धन्य है’ उसके ऊँचे काव्यात्मक और धार्मिक स्वर को ‘सुखी है’ से बेहतर बनाए रखता है।
- source_word: שֶׁיְשַׁלֶּם לָךְ
  choice: जो तुझे ... बदला देगा
  rationale: इस संदर्भ में שׁלם प्रतिदान या किए का फल लौटाने को दर्शाता है। ‘बदला देगा’ आधुनिक हिंदी में स्वाभाविक है और न्यायपूर्ण प्रत्युपकार की तीव्रता को बनाए रखता है।
- source_word: אֶת גְּמוּלֵךְ שֶׁגָּמַלְתְּ לָנוּ
  choice: उसी का बदला ... जो तूने हमारे साथ किया
  rationale: גְּמוּל और גמל के शब्द-संबंध को हिंदी में हूबहू रखना अस्वाभाविक होता। यह वाक्यांश किए गए व्यवहार और उसके समान प्रत्युत्तर का संबंध स्पष्ट तथा संक्षिप्त रूप में व्यक्त करता है।
theological_decisions:
- issue: बाबेल से बदला लेनेवाले के लिए आशीर्वचन
  choice: आशीर्वचन को ‘धन्य है वह’ के रूप में बिना नरम किए रखा गया है।
  alternative: इसे केवल भावी भविष्यवाणी बनाना या प्रतिशोध की नैतिक तीव्रता कम करने के लिए भावानुवाद करना।
  rationale: इब्रानी पाठ बाबेल को उसी के किए का प्रतिफल देनेवाले के विषय में वास्तविक आशीर्वचन देता है। अनुवाद को प्रतिशोधात्मक प्रार्थना और न्याय के बीच की धर्मवैचारिक बेचैनी को मिटाना नहीं चाहिए।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी में, काव्यात्मक किंतु सामान्य पाठक के लिए सुबोध रखी गई है। स्त्रीलिंग एकवचन संबोधन ‘तू/तुझे’ मूल पाठ के प्रत्यक्ष और तीखे संबोधन को बनाए रखता है।
