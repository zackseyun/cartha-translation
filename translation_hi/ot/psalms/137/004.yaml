  text: How can we sing the song of Yahweh on foreign soil?[a][b]
translation:
  language: hi
  text: हम पराई धरती पर यहोवा का गीत कैसे गाएँ?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में “यहोवा का गीत” है। ‘यहोवा’ ईश्वरीय नाम का हिन्दी रूप है; इसे पारंपरिक रूप से “प्रभु का गीत” भी कहा जाता है।
    reason: alternative_reading
  - marker: b
    text: या, “पराए देश में।” इब्रानी में शब्दशः “पराई धरती पर” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵיךְ
  choice: कैसे
  rationale: यह प्रश्नवाचक क्रियाविशेषण यहाँ रीति के साथ-साथ परिस्थिति में असमर्थता और अनुपयुक्तता का विलापपूर्ण भाव व्यक्त करता है; हिन्दी में ‘कैसे’ इस जानबूझकर खुली रखी गई अर्थ-छाया को स्वाभाविक रूप से व्यक्त करता है।
- source_word: נָשִׁיר
  choice: हम ... गाएँ
  rationale: यह קל अपूर्ण, प्रथम पुरुष बहुवचन है। प्रश्नवाचक वाक्य में संभावनार्थक ‘गाएँ’ मूल के विचाराधीन कार्य और अलंकारिक प्रश्न—दोनों को सहज हिन्दी में व्यक्त करता है।
- source_word: שִׁיר יְהוָה
  choice: यहोवा का गीत
  rationale: संज्ञा-समास का सीधा अर्थ ‘यहोवा का गीत’ है। इससे यह अस्पष्टता बनी रहती है कि गीत यहोवा के विषय में है, उसकी उपासना का है, या उससे संबद्ध पवित्र गीत है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को हिन्दी में प्रचलित बाइबलीय रूप ‘यहोवा’ से प्रस्तुत किया गया है, शीर्षक ‘प्रभु’ से नहीं।
- source_word: עַל אַדְמַת נֵכָר
  choice: पराए देश की धरती पर
  rationale: עַל का स्थानवाचक अर्थ ‘पर’, אַדְמַת का ठोस अर्थ ‘धरती/भूमि’, और נֵכָר का अर्थ विदेशी अथवा दूसरे देश से संबंधित है। यह पदबंध हिन्दी में स्वाभाविक रहते हुए मूल की धरती वाली ठोस छवि बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल में व्यक्तिगत ईश्वरीय नाम स्पष्ट रूप से उपस्थित है। ‘यहोवा’ हिन्दी पाठकों में स्थापित नामरूप है और इसे ‘प्रभु’ जैसे पद से बदलता नहीं; ‘याहवे’ स्रोत-उच्चारण का निकटतर वैकल्पिक लिप्यंतरण है।
- issue: ‘यहोवा का गीत’ का संबंध
  choice: संबंधसूचक रचना को यथावत रखना
  alternative: यहोवा के लिए गीत; यहोवा के विषय का गीत
  rationale: इब्रानी संबंध-रचना अनेक अर्थ-संबंधों की अनुमति देती है। किसी एक व्याख्या को मुख्य पाठ में चुनना मूल की वास्तविक अस्पष्टता को अनावश्यक रूप से समाप्त कर देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और गेय रखी गई है। ‘पराए देश की धरती’ निर्वासन की भौगोलिक वास्तविकता और मूल की ठोस मिट्टी/धरती की छवि दोनों व्यक्त करता है। प्रश्न में निहित असमर्थता, पीड़ा और धार्मिक अनुपयुक्तता को किसी एक व्याख्या तक सीमित नहीं किया गया।
