source:
  edition: WLC
  text: תִּדְבַּ֥ק לְשׁוֹנִ֨/י לְ/חִכִּ/י֮ אִם לֹ֪א אֶ֫זְכְּרֵ֥/כִי אִם לֹ֣א אַ֭עֲלֶה אֶת יְרוּשָׁלִַ֑ם עַ֝֗ל רֹ֣אשׁ שִׂמְחָתִֽ/י־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/137/006.yaml
  text: May my tongue cling to the roof of my mouth if I do not remember you[b][a], if I do not exalt Jerusalem above my highest joy.
translation:
  language: hi
  text: मेरी जीभ मेरे तालू से चिपक जाए, यदि मैं तुझे याद न करूँ, यदि मैं यरूशलेम को अपने सबसे बड़े आनंद से भी ऊपर न रखूँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תִּדְבַּק
  choice: चिपक जाए
  rationale: דבק का मूल अर्थ ‘चिपकना/लगा रहना’ है। यहाँ आत्म-शापात्मक शपथ के संदर्भ में संभावनार्थक ‘चिपक जाए’ स्वाभाविक है और शारीरिक बिंब बनाए रखता है।
- source_word: לְשׁוֹנִי
  choice: मेरी जीभ
  rationale: यह सीधा शारीरिक अर्थ है; वाणी के निष्क्रिय हो जाने का बिंब पद के लिए केंद्रीय है।
- source_word: לְחִכִּי
  choice: मेरे तालू से
  rationale: חֵךְ का अर्थ ‘तालू’ है। आधुनिक मानक हिन्दी में यह स्पष्ट और संक्षिप्त है तथा मूल शारीरिक बिंब को सुरक्षित रखता है।
- source_word: אִם לֹא
  choice: यदि मैं ... न करूँ
  rationale: यह शपथ से जुड़ी शर्त को मूल इब्रानी संरचना के निकट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אֶזְכְּרֵכִי
  choice: मैं तुझे याद न करूँ
  rationale: זכר का अर्थ ‘याद करना’ है। स्त्रीलिंग एकवचन प्रत्यय यरूशलेम को प्रत्यक्ष संबोधन के रूप में इंगित करता है; ‘तुझे’ उस काव्यात्मक निकटता को बनाए रखता है।
- source_word: אַעֲלֶה אֶת יְרוּשָׁלַם
  choice: मैं यरूशलेम को ... ऊपर न रखूँ
  rationale: עלה के हिफ़ील रूप का शाब्दिक भाव ‘ऊपर उठाना’ है; עַל רֹאשׁ के साथ यहाँ किसी को सर्वोच्च स्थान देना अभिप्रेत है। ‘ऊपर रखना’ अर्थ और बिंब दोनों को सहज हिन्दी में व्यक्त करता है।
- source_word: עַל רֹאשׁ שִׂמְחָתִי
  choice: अपने सबसे बड़े आनंद से भी ऊपर
  rationale: शाब्दिक रूप ‘मेरे आनंद के सिर/शीर्ष पर’ है। हिन्दी में यह चयन यरूशलेम को हर दूसरे आनंद से अधिक प्राथमिकता देने का तुलनात्मक-सर्वोच्च भाव स्पष्ट करता है।
theological_decisions:
- issue: אֶזְכְּרֵכִי में स्त्रीलिंग एकवचन संबोधन का संदर्भ
  choice: ‘तुझे’ का संदर्भ व्यक्तिरूप में संबोधित यरूशलेम से है।
  alternative: इसे व्यापक रूप से सिय्योन अथवा नगर के काव्यात्मक संबोधन के रूप में समझा जा सकता है।
  rationale: निकटवर्ती संदर्भ में यरूशलेम सबसे स्वाभाविक पूर्वपद है और स्त्रीलिंग प्रत्यय नगर के व्याकरणिक लिंग से मेल खाता है। प्रत्यक्ष संबोधन बनाए रखने से मूल की भावात्मक शक्ति सुरक्षित रहती है।
- issue: עַל רֹאשׁ שִׂמְחָתִי का संबंध
  choice: यरूशलेम को अपने अन्य सभी आनंदों से ऊपर स्थान देना।
  alternative: ‘यरूशलेम को अपने मुख्य आनंद के रूप में ऊँचा उठाना।’
  rationale: इब्रानी मुहावरा सर्वोच्च प्राथमिकता का भाव देता है, पर उसकी व्याकरणिक संक्षिप्तता एक से अधिक निकट अर्थों की अनुमति देती है। ‘आनंद से भी ऊपर’ तुलनात्मक बल और मूल तनाव को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, काव्यात्मक पर सहज और गरिमापूर्ण है। ‘तुझे’ प्रत्यक्ष, आत्मीय काव्य-संबोधन को बनाए रखता है; ‘तालू’ और ‘चिपक जाए’ ठोस शारीरिक बिंब को बिना अनावश्यक व्याख्या के प्रस्तुत करते हैं।
