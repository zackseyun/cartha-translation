  yaml_path: translation/ot/psalms/137/001.yaml
  text: By the rivers of Babylon[a], there we sat down[b]; we also wept when we remembered Zion.
translation:
  language: hi
  text: बाबुल की नदियों के किनारे[a]—वहाँ हम बैठे; सिय्योन को याद करते हुए हम रोए भी।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘बाबुल की जलधाराओं के किनारे।’
    reason: lexical_alternative
