    reason: lexical_alternative
lexical_decisions:
- source_word: עַל
  choice: के किनारे
  rationale: भौगोलिक संदर्भ में עַל निकटता या पास होने का भाव देता है; नदियों के पास बैठने के दृश्य के लिए ‘के किनारे’ स्वाभाविक हिन्दी है।
- source_word: נַהֲרוֹת
  choice: नदियों
  rationale: נָהָר का बहुवचन सामान्यतः नदियों को दर्शाता है; यही यहाँ का सीधा और स्वाभाविक अर्थ है।
- source_word: בָּבֶל
  choice: बाबुल
  rationale: इस स्थान-नाम का प्रचलित हिन्दी बाइबलीय रूप ‘बाबुल’ रखा गया है।
- source_word: שָׁם
  choice: वहाँ
  rationale: निर्वासितों के बाबुल में होने पर दिए गए स्थान-सूचक बल को स्पष्ट रूप से बनाए रखता है।
- source_word: יָשַׁבְנוּ
  choice: हम बैठे
  rationale: ישׁב का अर्थ ‘बैठना’ या ‘निवास करना’ हो सकता है; नदियों के किनारे विलाप के प्रसंग में ‘बैठे’ दृश्य को सबसे सीधे व्यक्त करता है।
- source_word: גַּם
  choice: भी
  rationale: ‘भी’ मूल के योगात्मक या बलसूचक भाव को बिना अतिरिक्त व्याख्या के सुरक्षित रखता है।
- source_word: בָּכִינוּ
  choice: हम रोए
  rationale: यह क्रिया रोने या विलाप करने को व्यक्त करती है; ‘रोए’ आधुनिक, गरिमापूर्ण और सहज हिन्दी है।
- source_word: בְּזָכְרֵנוּ
  choice: याद करके
  rationale: उपसर्ग בְּ सहित infinitive construct यहाँ समय और कारण दोनों की निकटता व्यक्त कर सकता है; ‘याद करके’ इस जानबूझकर बनी हुई द्विअर्थी छाया को सहज हिन्दी में बनाए रखता है।
- source_word: אֶת צִיּוֹן
  choice: सिय्योन को
  rationale: אֶת प्रत्यक्ष कर्म को चिह्नित करता है और अलग से अनूदित नहीं होता; ‘सिय्योन’ मूल विशिष्ट स्थान-नाम और उसकी काव्यात्मक-धार्मिक अनुगूँज को बनाए रखता है।
theological_decisions:
- issue: צִיּוֹן का अनुवाद
  choice: सिय्योन
  alternative: यरूशलेम
  rationale: मूल पाठ विशेष रूप से सिय्योन का नाम लेता है। इसे ‘यरूशलेम’ बनाना भौगोलिक संकेत तो दे सकता है, पर मूल नाम की वाचा-संबंधी और काव्यात्मक अनुगूँज को कम कर देगा।
- issue: גַּם का संबंध
  choice: ‘रोए’ के साथ ‘भी’
  alternative: वाक्य को केवल ‘हम बैठे और रोए’ के रूप में जोड़ना
  rationale: मूल में रोने से पहले आए योगात्मक कण को स्पष्ट रखना आवश्यक है, यद्यपि उसका सटीक वाक्यगत बल कुछ खुला रहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज किंतु काव्यात्मक और गरिमापूर्ण शैली रखी गई है। अर्धविराम पहले दृश्य (‘हम बैठे’) और उसके बाद के विलाप को अलग करता है, जबकि ‘भी’ मूल इब्रानी के योगात्मक बल को बनाए रखता है।
