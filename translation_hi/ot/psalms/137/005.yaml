  text: אִֽם אֶשְׁכָּחֵ֥/ךְ יְֽרוּשָׁלִָ֗ם תִּשְׁכַּ֥ח יְמִינִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/137/005.yaml
  text: If I forget you[a], Jerusalem, may my right hand forget.
translation:
  language: hi
  text: यदि मैं तुझे भूल जाऊँ, हे यरूशलेम, तो मेरा दाहिना हाथ भूल जाए।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या अधिक स्पष्ट रूप में, “तो मेरा दाहिना हाथ अपना कौशल भूल जाए।” इब्रानी वाक्य में कर्म नहीं कहा गया है; यह विस्तृत अर्थ प्रसंग से अनुमानित है और कुछ अनुवादों में मिलता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: यदि
  rationale: यह शपथ-सदृश शर्त आरम्भ करता है; ‘यदि’ इसका सीधा और स्वाभाविक हिन्दी समतुल्य है।
- source_word: אֶשְׁכָּחֵךְ
  choice: मैं तुझे भूल जाऊँ
  rationale: यह שׁכח का प्रथम पुरुष एकवचन रूप है, जिसके साथ स्त्रीलिंग एकवचन कर्म-प्रत्यय है; यरूशलेम को सीधे सम्बोधित करने के लिए ‘तुझे’ रखा गया है।
- source_word: יְרוּשָׁלִָם
  choice: हे यरूशलेम
  rationale: सम्बोधन को आधुनिक हिन्दी में स्पष्ट और गरिमापूर्ण बनाने के लिए ‘हे’ सहित प्रचलित नाम-रूप दिया गया है।
- source_word: תִּשְׁכַּח
  choice: भूल जाए
  rationale: यह तृतीय पुरुष स्त्रीलिंग एकवचन अपूर्ण रूप यहाँ आत्म-अभिशाप या शपथ की कामनार्थक शक्ति रखता है; ‘तो ... भूल जाए’ उस भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יְמִינִי
  choice: मेरा दाहिना हाथ
  rationale: יָמִין का सामान्य अर्थ ‘दाहिना हाथ’ है; भजन के गायन-वादन के प्रसंग में यह कौशल के साधन की ओर भी संकेत कर सकता है।
theological_decisions:
- issue: दूसरे चरण का लुप्तपद वाला आत्म-अभिशाप
  choice: तो मेरा दाहिना हाथ भूल जाए
  alternative: तो मेरा दाहिना हाथ अपना कौशल भूल जाए / मेरा दाहिना हाथ भुला दिया जाए
  rationale: इब्रानी पाठ संक्षिप्त और लुप्तपद वाला है तथा भूलने का कर्म स्पष्ट नहीं करता। मुख्य पाठ उसी तनाव और संक्षिप्तता को बनाए रखता है; प्रसंग से अनुमानित ‘अपना कौशल’ को पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और काव्यात्मक शैली। ‘तुझे’ प्रत्यक्ष और आत्मीय सम्बोधन को बनाए रखता है; ‘हे यरूशलेम’ सम्बोधन को स्पष्ट करता है।
