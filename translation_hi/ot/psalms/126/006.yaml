  text: He surely goes out weeping[a], carrying the seed for sowing; he will surely come in with joyful shouting[b], carrying his sheaves.
translation:
  language: hi
  text: वह रोता हुआ, बोने के लिए बीज लिए, निश्चय ही निकलता है[a]; वह हर्ष के जयघोष के साथ निश्चय ही लौटेगा[b], अपनी पूलियाँ लिए हुए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बीज की थैली लिए रोता हुआ अपने मार्ग पर चलता जाता है।” “बोने के लिए बीज” के रूप में अनूदित इब्रानी पदबंध कठिन है; कुछ लोग इसे अधिक ठोस अर्थ में बीज की थैली या बीज की संचित मात्रा समझते हैं।
    reason: lexical_alternative
  - marker: b
    text: या, “गाता हुआ” अथवा “आनन्द मनाता हुआ”; इब्रानी शब्द आनन्द की पुकार या गूँजती हुई हर्षध्वनि को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הָלוֹךְ יֵלֵךְ
  choice: निकलता है
  rationale: इन्फिनिटिव एब्सोल्यूट और अपूर्ण क्रिया का मेल क्रिया को बल देता है। हिन्दी में पहले खंड की स्वाभाविकता बनाए रखते हुए इस बल को दूसरे समानांतर खंड के ‘निश्चय ही’ से स्पष्ट किया गया है; ‘निकलता है’ खेत की ओर जाने और बाद में लौटने के विरोध-संतुलन को व्यक्त करता है।
- source_word: וּבָכֹה
  choice: रोता हुआ
  rationale: यह रूप जाने की रीति बताता है; ‘रोता हुआ’ आधुनिक हिन्दी में स्वाभाविक और संक्षिप्त है।
- source_word: נֹשֵׂא
  choice: लिए
  rationale: कृदन्त साथ-साथ होने वाली क्रिया बताता है। ‘लिए’ हिन्दी में ‘उठाए हुए’ या ‘ढोता हुआ’ से अधिक सहज है।
- source_word: מֶשֶׁךְ הַזָּרַע
  choice: बोने के लिए बीज
  rationale: इब्रानी पदबंध कठिन और विवादित है। सन्दर्भ में बोआई हेतु ले जाए जा रहे बीज का भाव स्पष्ट है; यह अनुवाद किसी विशेष पात्र, माप या थैले को मूल में अनिवार्य माने बिना अर्थ देता है।
- source_word: בֹּא יָבֹא
  choice: निश्चय ही ... लौटेगा
  rationale: इन्फिनिटिव एब्सोल्यूट और अपूर्ण क्रिया भविष्य की वापसी को प्रबल निश्चितता देते हैं। ‘लौटेगा’ खेत से फसल लेकर वापस आने का सन्दर्भ स्वाभाविक रूप से व्यक्त करता है।
- source_word: בְרִנָּה
  choice: आनन्द के जयघोष के साथ
  rationale: רִנָּה केवल भीतरी प्रसन्नता नहीं, बल्कि सुनाई देने वाली हर्षध्वनि या उल्लासपूर्ण पुकार को भी दर्शाता है।
- source_word: אֲלֻמֹּתָיו
  choice: अपनी पूलियाँ
  rationale: यह शब्द काटे हुए अनाज के बँधे गट्ठों को दर्शाता है। ‘पूलियाँ’ कृषि-सन्दर्भ का सटीक और संक्षिप्त हिन्दी शब्द है।
