  yaml_path: translation/ot/psalms/126/002.yaml
  text: Then our mouth was filled with laughter[a], and our tongue with joyful shouting; then they said among the nations[b], “Yahweh has done great things for them.”
translation:
  language: hi
  text: 'तब हमारा मुँह हँसी से भर गया,

    और हमारी जीभ जयकार से[a]।

    तब राष्ट्रों के बीच यह कहा गया,

    “याहवे ने इनके लिए बड़े-बड़े काम किए हैं।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “आनन्द के ऊँचे नारे से”; इब्रानी शब्द गूँजती हुई आनन्द-ध्वनि, जयकार या आनन्दपूर्ण गान का बोध करा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: तब
  rationale: यह समय और परिणाम दोनों का संकेत देता है तथा पिछले पद में वर्णित पुनर्स्थापना के बाद की प्रतिक्रिया को स्वाभाविक ढंग से जोड़ता है।
- source_word: יִמָּלֵא
  choice: भर गया
  rationale: रूप अपूर्ण क्रिया का है, पर काव्यात्मक प्रसंग में यह बीती हुई पुनर्स्थापना का स्मरण है; इसलिए हिन्दी में भूतकालीन परिणाम स्वाभाविक है।
- source_word: שְׂחוֹק
  choice: हँसी
  rationale: समानांतर רִנָּה और आनन्दपूर्ण प्रसंग स्पष्ट करते हैं कि यहाँ उपहास नहीं, उल्लास की हँसी है।
- source_word: פִּינוּ
  choice: हमारा मुँह
  rationale: इब्रानी के एकवचन सामूहिक अंग-संज्ञा को हिन्दी में स्वाभाविक और काव्यात्मक रूप से बनाए रखता है।
- source_word: וּלְשׁוֹנֵנוּ
  choice: और हमारी जीभ
  rationale: मूल के एकवचन सामूहिक प्रयोग और ‘हमारा मुँह’ के समानांतर विन्यास को सुरक्षित रखता है।
- source_word: רִנָּה
  choice: जयकार
  rationale: यह ऊँची, गूँजती हुई आनन्द-ध्वनि को संक्षेप और स्वाभाविक हिन्दी में व्यक्त करता है; शब्द गान या आनन्द के नारों दोनों को समेट सकता है।
- source_word: יֹאמְרוּ
  choice: कहा गया
  rationale: अनिश्चित बहुवचन कर्ता को हिन्दी में भाववाच्य से स्वाभाविक रूप दिया गया है, बिना किसी खास समूह को अनावश्यक रूप से कर्ता ठहराए।
- source_word: בַגּוֹיִם
  choice: जाति-जाति के लोगों में
  rationale: גּוֹיִם आसपास की अन्य जातियों/राष्ट्रों को दर्शाता है; यह हिन्दी पदबंध धार्मिक रूप से भारित ‘अन्यजातियों’ से अधिक सामान्य और स्पष्ट है।
- source_word: הִגְדִּיל ... לַעֲשׂוֹת
  choice: बड़े-बड़े काम किए हैं
  rationale: दोनों शब्द मिलकर ‘महान कार्य करना’ का मुहावरा बनाते हैं; हिन्दी में यह उसका सहज समतुल्य है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय देवनागरी में प्रत्यक्ष लिप्यंतरण किया गया है।
- source_word: עִם אֵלֶּה
  choice: इनके लिए
  rationale: शाब्दिक अर्थ ‘इनके साथ’ है, पर इस मुहावरे में लाभार्थी भाव है; ‘इनके लिए’ मूल संकेतवाचक बहुवचन को भी बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल में चार-अक्षरी व्यक्तिगत नाम प्रत्यक्ष है; ‘याहवे’ उसका आधुनिक हिन्दी लिप्यंतरण है और उसे उपाधि में नहीं बदलता।
- issue: יִמָּלֵא का काल-संदर्भ
  choice: 'भूतकालीन स्मरण: ‘भर गया’'
  alternative: 'भविष्यकाल: ‘भर जाएगा’'
  rationale: पद 1 की पुनर्स्थापना के स्मरण और आगे राष्ट्रों के कथन के साथ भूतकालीन पाठ अधिक सुसंगत है, यद्यपि इब्रानी अपूर्ण रूप अपने आप में अधिक खुला है।
- issue: עִם אֵלֶּה में संबंध का अर्थ
  choice: 'लाभार्थी: ‘इनके लिए’'
  alternative: 'शाब्दिक: ‘इनके साथ’'
  rationale: הִגְדִּיל לַעֲשׂוֹת के साथ यह प्रसंग उन लोगों के हित में किए गए महान कार्यों को बताता है; हिन्दी में शाब्दिक ‘साथ’ अर्थ को अस्पष्ट कर देगा।
