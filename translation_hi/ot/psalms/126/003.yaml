lexical_decisions:
- source_word: הִגְדִּיל לַעֲשׂוֹת
  choice: महान काम किए हैं
  rationale: यह संयुक्त हिब्रू अभिव्यक्ति मुहावरे के रूप में ‘महान काम करना’ बताती है। हिन्दी में यह अनुवाद अर्थ को स्वाभाविक और काव्यात्मक ढंग से व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: हिब्रू पाठ में परमेश्वर का व्यक्तिगत नाम है; इसलिए इसे उपाधि से बदलने के बजाय हिन्दी में लिप्यंतरित किया गया है।
- source_word: עִמָּנוּ
  choice: हमारे लिए
  rationale: इसका शाब्दिक अर्थ ‘हमारे साथ’ है, पर इस प्रसंग में भाव हितकारी है। स्वाभाविक हिन्दी के लिए ‘हमारे लिए’ रखा गया है और शाब्दिक विकल्प पादटिप्पणी में दिया गया है।
- source_word: הָיִינוּ שְׂמֵחִים
  choice: हम आनन्दित हुए
  rationale: यह बीते हुए प्रसंग में उत्पन्न हर्ष की अवस्था को व्यक्त करता है। ‘आनन्दित हुए’ आधुनिक, गरिमापूर्ण हिन्दी में परिणामस्वरूप आई प्रसन्नता को सहजता से बताता है।
theological_decisions:
