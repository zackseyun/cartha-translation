  text: A Song of Ascents. When Yahweh restored the fortunes of Zion[a], we were like those who dream.
translation:
  language: hi
  text: 'चढ़ाइयों का गीत।


    जब याहवे ने सिय्योन का भाग्य बहाल किया[a], तब हम स्वप्न देखने वालों के समान थे।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सिय्योन के बंदियों को लौटा लाया” अथवा “सिय्योन की बंधुआई को बहाल किया।” इब्रानी अभिव्यक्ति विशेष रूप से निर्वासन से वापसी या अधिक व्यापक रूप से सिय्योन की बदली हुई दशा और बहाल हुए भाग्य का संकेत दे सकती है।
    reason: alternative_reading
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: चढ़ाइयों का गीत
  rationale: מַעֲלוֹת के मूल अर्थ ‘ऊपर चढ़ना/चढ़ाइयाँ’ को सुरक्षित रखते हुए इसे इस भजन-संग्रह की पारंपरिक शीर्षक-श्रेणी के रूप में प्रस्तुत किया गया है; ‘तीर्थयात्रियों का गीत’ अर्थ को अधिक सीमित कर देता।
- source_word: בְּשׁוּב
  choice: जब ... पलट दिया
  rationale: ב के साथ infinitive construct यहाँ स्वाभाविक रूप से कालवाचक उपवाक्य बनाता है, इसलिए ‘जब’ चुना गया। שוב और שִׁיבַת का संयुक्त मुहावरा किसी दशा या भाग्य की पुनर्स्थापना को व्यक्त कर सकता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय परमेश्वर-नाम को पदवी में बदलने के बजाय उसके प्रचलित लिप्यंतरण से व्यक्त किया गया है।
- source_word: שִׁיבַת צִיּוֹן
  choice: सिय्योन का भाग्य
  rationale: यह इब्रानी पदबंध व्यापक रूप से बिगड़ी दशा या भाग्य की पुनर्स्थापना बता सकता है। ‘भाग्य पलट दिया’ आधुनिक हिंदी में इस सकारात्मक परिवर्तन का स्वाभाविक मुहावरा है; बंधुआई से लौटने का अधिक विशिष्ट अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: הָיִינוּ
  choice: हम ... थे
  rationale: היה का पूर्ण रूप यहाँ भूतकाल की अवस्था बताता है, जिसे सीधे ‘हम ... थे’ कहा गया है।
- source_word: כְּחֹלְמִים
  choice: स्वप्न देखनेवालों के समान
  rationale: कृदंत का आशय स्वप्न देख रहे लोगों से है। यह अनुवाद उपमा और बहुवचन दोनों को बनाए रखता है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में व्यक्तिगत परमेश्वर-नाम स्पष्ट रूप से उपस्थित है; ‘याहवे’ उसे किसी उपाधि से प्रतिस्थापित किए बिना सुरक्षित रखता है।
- issue: שִׁיבַת צִיּוֹן का अर्थ
  choice: सिय्योन का भाग्य पलट दिया
  alternative: सिय्योन के बंधुओं को लौटा लाया / सिय्योन की बंधुआई बहाल की
  rationale: इब्रानी अभिव्यक्ति व्यापक भाग्य-पुनर्स्थापना और बंधुआई से वापसी—दोनों की ओर संकेत कर सकती है। मुख्य पाठ व्यापक मुहावरेदार अर्थ देता है और पादटिप्पणी निर्वासन-संबंधी संभावना को बनाए रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। शीर्षक में अपेक्षाकृत शाब्दिक ‘चढ़ाइयों’ और मुख्य पंक्ति में स्वाभाविक हिंदी मुहावरे ‘भाग्य पलट दिया’ का संतुलन अपनाया गया है।
