translation:
  language: hi
  text: 'जो आँसुओं के साथ बोते हैं,

    वे उल्लास की पुकार के साथ काटेंगे।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हर्ष की पुकारों के साथ।” इब्रानी शब्द רִנָּה उल्लास से भरी ऊँची पुकार को व्यक्त कर सकता है और उसमें आनंदपूर्ण गायन का भाव भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַזֹּרְעִים
  choice: जो ... बोते हैं
  rationale: संज्ञा के रूप में प्रयुक्त निश्चित कृदन्त सामान्य बहुवचन समूह को दर्शाता है; ‘जो ... बोते हैं’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: בְּדִמְעָה
  choice: आँसुओं के साथ
  rationale: בְּ यहाँ बोने की परिस्थिति या ढंग बताता है; यह अभिव्यक्ति रोते हुए बोने का भाव बनाए रखती है।
- source_word: בְּרִנָּה
  choice: जयजयकार के साथ
  rationale: רִנָּה हर्ष से भरी ऊँची पुकार को दर्शाता है और कभी उल्लासपूर्ण गायन को भी समेट सकता है; ‘जयजयकार’ उसके श्रव्य और उत्सवी भाव को सहज हिन्दी में व्यक्त करता है।
- source_word: יִקְצֹרוּ
  choice: काटेंगे
  rationale: अपूर्ण क्रिया यहाँ भावी परिणाम बताती है। ‘काटेंगे’ फसल काटने के अर्थ में बोने-काटने के कृषि रूपक को स्वाभाविक हिन्दी में बनाए रखता है।
