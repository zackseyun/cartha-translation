source:
  edition: WLC
  text: שׁוּבָ֣/ה יְ֭הוָה אֶת שבות/נו כַּ/אֲפִיקִ֥ים בַּ/נֶּֽגֶב־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/126/004.yaml
  text: Restore our fortunes[a], O Yahweh[b], like streams in the Negev.
translation:
  language: hi
  text: हे याहवे, हमारी दशा को फिर से बहाल कर,[a] जैसे नेगेव की जलधाराएँ उमड़ पड़ती हैं।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “हमारे बंदियों को वापस ले आ” अथवा “हमारी बंधुआई को पलट दे।” इब्रानी मुहावरा विशेष रूप से निर्वासितों की वापसी या अधिक व्यापक रूप से किसी समुदाय की दशा की पुनर्बहाली को दर्शा सकता है।
    reason: alternative_reading
  - marker: b
    text: चित्र नेगेव के उन सामान्यतः सूखे नालों का है, जो वर्षा होने पर अचानक पानी से भरकर उमड़ पड़ते हैं।
    reason: cultural_note
lexical_decisions:
- source_word: שׁוּבָה
  choice: फिर से बहाल कर
  rationale: यह שוב का आदेशात्मक रूप है, जो यहोवा को संबोधित है। שׁוּב אֶת־שְׁבוּת मुहावरे में यह पलटाव और पुनर्स्थापना की प्रार्थना व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत नाम को प्रचलित आधुनिक हिन्दी रूप ‘यहोवा’ में रखा गया है, किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: שבותנו
  choice: हमारी दशा
  rationale: इस मुहावरे में शब्द बंधुआई अथवा बंदियों की वापसी को भी सूचित कर सकता है, पर व्यापक रूप से समुदाय की स्थिति के पुनर्स्थापन का अर्थ देता है। ‘हमारी दशा’ मुख्य पाठ में इस व्यापकता को बनाए रखता है।
- source_word: כַּאֲפִיקִים
  choice: जैसे ... जलधाराएँ उमड़ पड़ती हैं
  rationale: אֲפִיקִים नालों, जलमार्गों या नदी-घाटियों को दर्शाता है। नेगेव के संदर्भ में वर्षा से सूखे नालों के अचानक भरने का गतिशील चित्र स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: בַּנֶּגֶב
  choice: नेगेव में
  rationale: यहाँ נֶגֶב को सामान्य ‘दक्षिण’ के बजाय शुष्क भौगोलिक क्षेत्र नेगेव के रूप में समझना उपमा को अधिक स्पष्ट रखता है।
theological_decisions:
- issue: שוב את־שבות मुहावरे का अर्थ
  choice: समुदाय की दशा/स्थिति की पुनर्बहाली के लिए प्रार्थना
  alternative: हमारे बंदियों को लौटा ला; अथवा हमारी बंधुआई को पलट दे
  rationale: मुहावरा निर्वासितों या बंदियों की वास्तविक वापसी और व्यापक पुनर्स्थापना—दोनों अर्थ ग्रहण कर सकता है। मुख्य पाठ व्यापक अर्थ रखता है और पादटिप्पणी संकुचित निर्वासन-संबंधी अर्थ को सुरक्षित करती है।
translation_notes:
  register: भाषा आधुनिक, प्रार्थनापूर्ण और काव्यात्मक रखी गई है। ‘हमारी दशा’ साधारण पाठक के लिए स्वाभाविक है, जबकि वैकल्पिक ऐतिहासिक अर्थ पादटिप्पणी में सुरक्षित है। ‘उमड़ पड़ती हैं’ मूल उपमा में निहित नेगेव के अचानक भरने वाले जलमार्गों का चित्र स्पष्ट करता है।
