id: PSA.65.9
reference: Psalms 65:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: פָּקַ֥דְתָּ הָ/אָ֨רֶץ וַ/תְּשֹׁ֪קְקֶ֡/הָ רַבַּ֬ת תַּעְשְׁרֶ֗/נָּה פֶּ֣לֶג אֱ֭לֹהִים מָ֣לֵא מָ֑יִם תָּכִ֥ין דְּ֝גָנָ֗/ם כִּי כֵ֥ן תְּכִינֶֽ/הָ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/065/009.yaml
  text: You visit the earth and water it[a]; you greatly enrich it. The river of God is full of water; you prepare their grain[b], for so you prepare the earth.
translation:
  language: hi
  text: तू पृथ्वी की सुधि लेता और उसे सींचता है; तू उसे बहुत उपजाऊ बनाता है। परमेश्वर की धारा[a] जल से भरी है; तू उनका अन्न तैयार करता है[b], क्योंकि इसी प्रकार तू पृथ्वी को तैयार करता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “परमेश्वर की जलधारा” अथवा “परमेश्वर की नहर।” इब्रानी अभिव्यक्ति काव्यात्मक है और वर्षा तथा उर्वरता के स्वर्गीय स्रोत का बिंब जगा सकती है।
    reason: lexical_alternative
  - marker: b
    text: या “तू उनका अन्न उपलब्ध कराता है” अथवा “तू उनका अन्न स्थिर करता है।” इब्रानी क्रिया का अर्थ “तैयार करना,” “तत्पर करना” या “स्थिर करना” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּקַדְתָּ
  choice: सुधि लेता है
  rationale: पָּקַד के कृपापूर्ण ध्यान और सक्रिय देखभाल के भाव को स्वाभाविक हिन्दी में व्यक्त करता है; केवल ‘भेंट करता है’ कहने से कृषि-संदर्भ में आशय अस्पष्ट हो सकता था।
- source_word: וַתְּשֹׁקְקֶהָ
  choice: उसे सींचता है
  rationale: भूमि को जल देने के कृषि-बिंब को स्पष्ट, संक्षिप्त और स्वाभाविक रूप से रखता है।
- source_word: רַבַּת תַּעְשְׁרֶנָּה
  choice: उसे बहुत उपजाऊ बनाता है
  rationale: עשר के ‘समृद्ध बनाना’ और רַבַּת की तीव्रता को कृषि-संदर्भ के अनुरूप व्यक्त करता है।
- source_word: פֶּלֶג אֱלֹהִים
  choice: परमेश्वर की धारा
  rationale: पֶּלֶג के धारा, जलधारा या नहर जैसे अर्थों और אֱלֹהִים के संबंधसूचक प्रयोग को काव्यात्मक ढंग से सुरक्षित रखता है।
- source_word: מָלֵא מָיִם
  choice: जल से भरी है
  rationale: मूल के सरल विधेय और प्रचुर जल के सजीव बिंब को सीधे बनाए रखता है।
- source_word: תָּכִין דְּגָנָם
  choice: तू उनका अन्न तैयार करता है
  rationale: כון के हिफ़ील रूप का ‘तैयार करना’ अर्थ और דְּגָנָם के पुल्लिंग बहुवचन प्रत्यय ‘उनका’—जो पृथ्वी के स्त्रीलिंग एकवचन संदर्भ से अलग है—दोनों सुरक्षित हैं।
- source_word: כִּי כֵן תְּכִינֶהָ
  choice: क्योंकि इसी प्रकार तू पृथ्वी को तैयार करता है
  rationale: כֵן के ‘इसी प्रकार’ भाव तथा כון की पिछली क्रिया से शब्दगत संबंध को बनाए रखता है; स्त्रीलिंग एकवचन प्रत्यय का संदर्भ स्पष्ट करने के लिए ‘पृथ्वी’ दोहराया गया है।
theological_decisions:
- issue: ‘उनका अन्न’ में बहुवचन प्रत्यय का संदर्भ
  choice: मूल की व्याकरणिक भिन्नता बचाते हुए ‘उनका अन्न’ रखा गया है, जिसका संभावित संदर्भ पृथ्वी की उपज से लाभ पाने वाले लोग हैं।
  alternative: इसे सामान्य रूप से ‘अन्न’ या ‘पृथ्वी की उपज’ कहना।
  rationale: इब्रानी प्रत्यय पुल्लिंग बहुवचन है, जबकि ‘पृथ्वी’ स्त्रीलिंग एकवचन है। ‘उनका’ बनाए रखना अस्पष्टता और व्याकरणिक तनाव को अनावश्यक रूप से मिटाने से बचाता है।
- issue: ‘परमेश्वर की धारा’ का काव्यात्मक आशय
  choice: संबंधसूचक अभिव्यक्ति को ज्यों का त्यों रखा गया है।
  alternative: इसे स्पष्ट करके ‘स्वर्गीय जलधारा’ या केवल ‘तेरी धारा’ कहना।
  rationale: मूल वाक्यांश परमेश्वर की जलधारा, दिव्य स्रोत या वर्षा की स्वर्गीय आपूर्ति का बिंब जगा सकता है; किसी एक व्याख्या को मुख्य पाठ में निर्णायक बनाना उचित नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण काव्यात्मक गद्य। ‘तू’ भजन की प्रत्यक्ष ईश-संबोधन शैली बनाए रखता है। ‘सुधि लेना,’ ‘सींचना,’ ‘उपजाऊ’ और ‘धारा’ सामान्य पाठक के लिए सुबोध हैं, जबकि मूल की काव्यात्मकता और प्रत्ययों की अस्पष्टता सुरक्षित रहती है।
