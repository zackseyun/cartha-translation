  text: To you[a], silence is praise, O God, in Zion, and to you a vow will be paid.
translation:
  language: hi
  text: हे परमेश्वर, सिय्योन में मौन तेरे लिए स्तुति है[a], और तेरे लिए मन्नत पूरी की जाएगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हे परमेश्वर, सिय्योन में स्तुति मौन में तेरी प्रतीक्षा करती है,” अथवा, “हे परमेश्वर, सिय्योन में मौन स्तुति तेरी है।” इब्रानी अभिव्यक्ति संक्षिप्त है और उसे एक से अधिक प्रकार से समझा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: דֻמִיָּה
  choice: मौन
  rationale: यह संज्ञा मुख्यतः चुप्पी या निस्तब्धता का अर्थ देती है। ‘मौन’ संक्षिप्त, गरिमापूर्ण और काव्यात्मक है तथा कठिन इब्रानी अभिव्यक्ति को व्याख्यात्मक रूप से सरल नहीं बनाता।
- source_word: תְהִלָּה
  choice: स्तुति
  rationale: इसका सामान्य अर्थ ‘स्तुति’ है। क्रियारहित वाक्य में इसे ‘मौन’ के साथ रखते हुए मूल का विरोधाभासी काव्य-बल सुरक्षित रहता है।
- source_word: לְךָ דֻמִיָּה תְהִלָּה
  choice: मौन ही तेरे लिए स्तुति है
  rationale: इब्रानी वाक्यांश संक्षिप्त और क्रियारहित है। यह अनुवाद दोनों संज्ञाओं को स्पष्ट रखता है और मूल में न पाए जाने वाले ‘प्रतीक्षा करती है’ जैसे क्रियापद को मुख्य पाठ में नहीं जोड़ता। ‘ही’ हिंदी में इस कथन की काव्यात्मक पहचान को स्वाभाविक बनाता है, जबकि अन्य संभव अर्थ पादटिप्पणी में दिए गए हैं।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: यहाँ बहुवचन रूप इस्राएल के एकमात्र परमेश्वर को सूचित करता है। आधुनिक हिंदी बाइबलीय प्रयोग में ‘परमेश्वर’ स्वाभाविक और गरिमापूर्ण है।
- source_word: בְּצִיּוֹן
  choice: सिय्योन में
  rationale: उपसर्ग בְּ का स्थानवाचक अर्थ ‘में’ है; ‘सिय्योन में’ उसे सीधे और स्वाभाविक रूप से व्यक्त करता है।
- source_word: יְשֻׁלַּם
  choice: पूरी की जाएगी
  rationale: שלם के पुअल रूप का अर्थ मन्नत को चुका देना या पूरा करना है। हिंदी में ‘मन्नत पूरी करना’ सामान्य और बोधगम्य है तथा प्रतिज्ञात बात को निभाने का भाव रखता है।
- source_word: נֶדֶר
  choice: मन्नत
  rationale: यह परमेश्वर के सामने मानी गई प्रतिज्ञा को दर्शाता है। ‘मन्नत’ साधारण आधुनिक हिंदी में व्यापक रूप से समझा जाता है और केवल चढ़ावे तक अर्थ को सीमित नहीं करता।
theological_decisions:
- issue: לְךָ דֻמִיָּה תְהִלָּה की व्याख्या
  choice: मौन स्वयं परमेश्वर के लिए स्तुति के रूप में प्रस्तुत है।
  alternative: ‘सिय्योन में स्तुति मौन होकर तेरी प्रतीक्षा करती है’ अथवा ‘सिय्योन में मौन स्तुति तेरी है।’
  rationale: इब्रानी में कोई स्पष्ट क्रिया नहीं है और वाक्यांश एक से अधिक प्रकार से समझा जा सकता है। मुख्य पाठ मूल के काव्यात्मक तनाव को बनाए रखता है; अन्य वास्तविक संभावनाएँ पादटिप्पणी में सुरक्षित हैं।
translation_notes:
  register: आधुनिक मानक हिंदी का संक्षिप्त, गरिमापूर्ण और काव्यात्मक रूप। संबोधन में ‘हे परमेश्वर’ तथा परमेश्वर के लिए एकवचन आत्मीय सर्वनाम ‘तेरे’ रखा गया है। कठिन इब्रानी क्रियारहित वाक्य को अत्यधिक स्पष्ट किए बिना स्वाभाविक हिंदी दी गई है।
