  text: You crown the year with your goodness[b][a], and your paths drip with abundance.
translation:
  language: hi
  text: 'तू वर्ष को अपनी भलाई से मुकुट पहनाता है,

    और तेरे मार्गों से प्रचुरता टपकती है।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तेरी लीकें भरपूरता टपकाती हैं।” इब्रानी में “प्रचुरता” का शब्दशः अर्थ “चिकनाई” या “पुष्टता” है और वह समृद्ध उर्वरता तथा भरपूर उपज का चित्र प्रस्तुत करता है। यह चित्र परमेश्वर के गुज़रने पर उसके पीछे उर्वर भरपूरी छूट जाने का संकेत भी दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עִטַּרְתָּ
  choice: मुकुट पहनाता है
  rationale: क्रिया के ‘मुकुट पहनाने/सुशोभित करने’ वाले सजीव रूपक को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: שְׁנַת טוֹבָתֶךָ
  choice: वर्ष को अपनी भलाई का
  rationale: रचना का भाव है कि परमेश्वर अपनी भलाई से वर्ष को मुकुट पहनाता है; ‘भलाई’ व्यापक हितकारी अर्थ रखती है और कृषि-संबंधी भरपूरी को भी समेटती है।
- source_word: וּמַעְגָּלֶיךָ
  choice: और तेरे मार्ग
  rationale: מַעְגָּל मार्ग, पथ या लीक को सूचित कर सकता है। ‘मार्ग’ स्पष्ट और गरिमापूर्ण है, जबकि ठोस ‘लीकें’ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: יִרְעֲפוּן
  choice: टपकाते हैं
  rationale: मूल की टपकने या चूने की ठोस काव्यात्मक छवि को बनाए रखता है।
- source_word: דָּשֶׁן
  choice: समृद्धि
  rationale: शाब्दिक ‘चिकनाई/पुष्टता’ यहाँ उपजाऊपन, भरपूरी और प्रचुर उपज की छवि है; ‘समृद्धि’ आधुनिक हिन्दी में अर्थ को स्वाभाविक ढंग से व्यक्त करती है।
theological_decisions:
- issue: आशीष की कृषि-संबंधी छवि को व्याख्यात्मक गद्य में बदलना या मूल रूपक बनाए रखना
  choice: वर्ष को मुकुट पहनाने और मार्गों से समृद्धि टपकने—दोनों रूपक बनाए रखे गए हैं।
  alternative: तू वर्ष को भरपूर उपज से आशीष देता है।
  rationale: मूल कविता परमेश्वर की हितकारी क्रिया को उर्वरता और भरपूरी के सजीव चित्रों में व्यक्त करती है; रूपक बनाए रखने से पाठ का काव्य और उसका धर्मवैचारिक तनाव अनावश्यक व्याख्या के बिना सुरक्षित रहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में काव्यात्मक और गरिमापूर्ण शैली। भजन में परमेश्वर को सीधे संबोधन के अनुरूप एकवचन ‘तू/तेरे’ रखा गया है। ‘समृद्धि टपकाते हैं’ जानबूझकर मूल की ठोस और कुछ असामान्य काव्य-छवि को सुरक्षित रखता है।
