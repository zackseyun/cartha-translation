lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: संगीत निर्देशक के लिए
  rationale: भजनों के शीर्षकों में यह पद संगीत-प्रस्तुति की देखरेख करने वाले व्यक्ति को सूचित करता है। ‘संगीत निर्देशक’ आधुनिक और स्वाभाविक हिन्दी है, और आरम्भिक ל को ‘के लिए’ से व्यक्त किया गया है।
- source_word: מִזְמוֹר
  choice: भजन
  rationale: शीर्षकों में यह संगीतबद्ध भजन के लिए प्रचलित संज्ञा है; ‘भजन’ हिन्दी पाठकों के लिए सटीक और सहज समतुल्य है।
- source_word: לְדָוִד
  choice: दाऊद का
  rationale: भजन-शीर्षकों में ל लेखन, समर्पण, स्वामित्व या संबंध का संकेत दे सकता है। हिन्दी का ‘दाऊद का’ मूल की संक्षिप्तता और कुछ हद तक उसकी व्यापकता बनाए रखता है; टिप्पणी संभावित अर्थों को स्पष्ट करती है।
- source_word: שִׁיר
  choice: एक गीत
  rationale: यह מִזְמוֹר से अलग शीर्षकीय शब्द है, इसलिए इसे छोड़ा या उसी में मिला नहीं दिया गया। ‘एक गीत’ दोनों पदों का भेद बनाए रखता है।
theological_decisions:
- issue: לְדָוִד में संबंध का स्वरूप
  choice: दाऊद का
  alternative: दाऊद द्वारा / दाऊद के लिए
  rationale: इब्रानी संबंधसूचक ל केवल रचनाकार को निश्चित नहीं करता; वह दाऊद से संबद्धता या दाऊद के लिए समर्पण भी व्यक्त कर सकता है। इसलिए मुख्य पाठ में पारंपरिक किन्तु अपेक्षाकृत खुला रूप रखा गया और टिप्पणी में अस्पष्टता बताई गई।
