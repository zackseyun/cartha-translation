source:
  edition: WLC
  text: נ֤וֹרָא֨וֹת בְּ/צֶ֣דֶק תַּ֭עֲנֵ/נוּ אֱלֹהֵ֣י יִשְׁעֵ֑/נוּ מִבְטָ֥ח כָּל קַצְוֵי אֶ֝֗רֶץ וְ/יָ֣ם רְחֹקִֽים׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/065/005.yaml
  text: With awesome deeds in righteousness you answer us[a], O God of our salvation[b], the confidence of all the ends of the earth and of the distant sea.
translation:
  language: hi
  text: 'हे हमारे उद्धार के परमेश्वर,


    तू विस्मयकारी कामों के द्वारा धार्मिकता के साथ हमें उत्तर देता है[a];


    तू पृथ्वी के सभी छोरों


    और दूरस्थ समुद्र का भरोसा है[b]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तू विस्मयकारी कामों के द्वारा न्याय के साथ हमें उत्तर देता है।”
    reason: lexical_alternative
  - marker: b
    text: 'इब्रानी में “समुद्र” एकवचन है, पर यहाँ उसका अर्थ सामूहिक भी हो सकता है: “दूर-दूर के समुद्रों का।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: נ֤וֹרָא֨וֹת
  choice: विस्मयकारी कामों
  rationale: यह रूप भय और विस्मय उत्पन्न करने वाली बातों या कार्यों को दर्शाता है। उद्धारकारी संदर्भ में “विस्मयकारी काम” स्वाभाविक है और निहित कर्म-संज्ञा को स्पष्ट करता है।
- source_word: בְּצֶ֣דֶק
  choice: धार्मिकता से
  rationale: 'בְ यहाँ रीति या ढंग सूचित करता है: परमेश्वर का उत्तर उसकी धार्मिकता के अनुरूप है। “न्याय के साथ” भी संभव है, इसलिए उसे पादटिप्पणी में रखा गया है।'
- source_word: תַּ֭עֲנֵנוּ
  choice: तू ... हमें उत्तर देता है
  rationale: क्रिया का अर्थ “उत्तर देना” है और प्रत्यय प्रथम पुरुष बहुवचन “हमें” है। परमेश्वर से सीधे संबोधन के लिए “तू” काव्यात्मक और स्वाभाविक है।
- source_word: אֱלֹהֵ֣י יִשְׁעֵ֑נוּ
  choice: हे हमारे उद्धार के परमेश्वर
  rationale: यह अनुवाद इब्रानी संबंधवाचक संरचना और ישׁע के व्यापक अर्थ “उद्धार/छुटकारा” को बनाए रखता है। “हे” प्रत्यक्ष संबोधन स्पष्ट करता है।
- source_word: מִבְטָ֥ח
  choice: भरोसा
  rationale: शब्द उस व्यक्ति या वस्तु को दर्शाता है जिस पर भरोसा रखा जाता है। आधुनिक हिन्दी में “भरोसा” इस संबंधपरक अर्थ को सहजता से व्यक्त करता है।
- source_word: כָּל קַצְוֵי אֶ֝֗רֶץ
  choice: पृथ्वी के सभी छोरों
  rationale: यह संसार के अत्यंत दूरस्थ भूभागों के लिए प्रचलित काव्यात्मक अभिव्यक्ति है।
- source_word: וְיָ֣ם רְחֹקִֽים
  choice: और दूर-दूर के समुद्र
  rationale: יָם व्याकरणतः एकवचन है, जबकि רְחֹקִים बहुवचन रूप में है। “दूर-दूर के समुद्र” इस तनाव को पूरी तरह समतल किए बिना समुद्री दूरस्थ क्षेत्रों का सामूहिक भाव व्यक्त करता है।
theological_decisions:
- issue: צֶדֶק का अर्थ-क्षेत्र
  choice: धार्मिकता
  alternative: न्याय
  rationale: यहाँ परमेश्वर के उत्तर देने का नैतिक रूप से सही और विश्वसनीय ढंग सामने आता है। “धार्मिकता” व्यापक अर्थ को बनाए रखती है, जबकि “न्याय” वास्तविक वैकल्पिक अर्थ है और पादटिप्पणी में दिया गया है।
- issue: מִבְטָח को परमेश्वर के लिए प्रयुक्त करना
  choice: तू ... भरोसा है
  alternative: तू ... आश्रय है
  rationale: मूल शब्द का केंद्र भरोसा रखने पर है, इसलिए “भरोसा” चुना गया; “आश्रय” संदर्भानुकूल हो सकता है, पर मूल में निहित विश्वास के भाव को अधिक व्याख्यात्मक ढंग से स्थानगत बना देता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। भजन की काव्यात्मक पंक्ति-विन्यास बनाए रखते हुए प्रत्यक्ष संबोधन में “तू” रखा गया है; यह आत्मीय और श्रद्धापूर्ण बाइबिलीय प्रयोग है।
