  text: דִּבְרֵ֣י עֲ֭וֺנֹת גָּ֣בְרוּ מֶ֑נִּ/י פְּ֝שָׁעֵ֗י/נוּ אַתָּ֥ה תְכַפְּרֵֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/065/003.yaml
  text: Words of iniquity have prevailed against me[b][a]; our transgressions—you will atone for them.
translation:
  language: hi
  text: 'अधर्म के मामले मुझ पर भारी पड़ गए हैं[a];

    हमारे अपराधों का प्रायश्चित तू करेगा[b]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अधर्म के मामले मेरे लिए बहुत भारी हो गए हैं।” इब्रानी आरंभ संक्षिप्त है; यहाँ ‘मामले’ का अर्थ ‘विषय’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “तू उनका दोष दूर करेगा।” यहाँ प्रयुक्त इब्रानी क्रिया पाप के लिए प्रायश्चित करने और उसे दूर करने का भाव रखती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּבְרֵי
  choice: बातें
  rationale: यह דָּבָר का बहुवचन संबंध-रूप है, जिसका अर्थ ‘बातें’, ‘मामले’ या ‘विषय’ हो सकता है। ‘बातें’ इब्रानी की संक्षिप्त अभिव्यक्ति को बनाए रखता है; वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: עֲוֺנֹת
  choice: अधर्म
  rationale: עָוֹן नैतिक कुटिलता, दोष अथवा उसके परिणाम का बोध करा सकता है। यहाँ ‘अधर्म’ उसका नैतिक भार बनाए रखता है और हिन्दी में सामूहिक अर्थ स्वाभाविक रूप से व्यक्त करता है।
- source_word: גָּבְרוּ
  choice: हावी हो गई हैं
  rationale: גבר का अर्थ बलवान होना या प्रबल होना है। ‘हावी हो गई हैं’ वक्ता पर अधर्म के प्रभावी और भारी पड़ने की छवि को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: מֶנִּי
  choice: मुझ पर
  rationale: גבר के साथ מן और प्रथम पुरुष एकवचन प्रत्यय यहाँ वक्ता पर प्रबल होने का भाव देता है।
- source_word: פְּשָׁעֵינוּ
  choice: हमारे अपराधों
  rationale: פֶּשַׁע सीमा-उल्लंघन, अपराध अथवा विद्रोह का बोध कराता है। ‘अपराध’ स्पष्ट और सामान्य हिन्दी है तथा जानबूझकर किए गए नैतिक उल्लंघन का भार बनाए रखता है।
- source_word: אַתָּה
  choice: तू ही
  rationale: इब्रानी में स्वतंत्र सर्वनाम बलाघातपूर्ण है। ‘ही’ उसके जोर को व्यक्त करता है; परमेश्वर को संबोधित करने के लिए काव्यात्मक और निकटतापूर्ण ‘तू’ भजन की शैली के अनुकूल है।
- source_word: תְכַפְּרֵם
  choice: उनका प्रायश्चित करेगा
  rationale: כפר का पिएल रूप पाप के लिए प्रायश्चित करने अथवा उसका दोष दूर करने को दर्शाता है। हिन्दी वाक्य-रचना में प्रत्यय ‘उन्हें’ को ‘उनका’ द्वारा अपराधों की ओर स्पष्ट रूप से लौटाया गया है।
theological_decisions:
- issue: पाप के संदर्भ में כפר का अनुवाद
  choice: प्रायश्चित करेगा
  alternative: ढाँप देगा / दोष दूर करेगा
  rationale: ‘प्रायश्चित’ मूल क्रिया के धार्मिक और पाप-निवारक भार को बनाए रखता है, पर प्रायश्चित की प्रक्रिया के किसी एक विशिष्ट धर्मसैद्धांतिक सिद्धांत को आरोपित नहीं करता।
- issue: एकवचन वक्ता से सामूहिक स्वीकारोक्ति की ओर परिवर्तन
  choice: ‘मुझ पर’ के बाद ‘हमारे अपराधों’ को ज्यों का त्यों रखा गया है
  alternative: दोनों पदों को एक ही वचन में समतल करना
  rationale: इब्रानी में वास्तविक तनाव—पहले एकवचन और फिर बहुवचन—मौजूद है; उसे सामंजस्य बैठाकर मिटाया नहीं गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक रखी गई है। ‘हावी हो गई हैं’ सामान्य पाठक के लिए सहज है, जबकि ‘प्रायश्चित’ मूल के धार्मिक अर्थ को सुरक्षित रखता है। पंक्ति-विभाजन इब्रानी पद के दो संतुलित खंडों और एकवचन से बहुवचन की ओर उसके मोड़ को उभारता है।
