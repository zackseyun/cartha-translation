  text: stilling the roar of the seas[a], the roar of their waves[b], and the tumult of the peoples.
translation:
  language: hi
  text: वह समुद्रों के गर्जन, उनकी लहरों के गर्जन और लोगों के कोलाहल को शांत करता है[a][b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘चुप करा देता है’ अथवा ‘वश में करता है’।
    reason: lexical_alternative
  - marker: b
    text: या ‘लोगों का शोर’; इब्रानी शब्द शोरभरी हलचल और कुछ संदर्भों में बड़ी भीड़, दोनों का बोध करा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מַשְׁבִּיחַ
  choice: शांत करता है
  rationale: हिफ़ील कृदन्त यहाँ शोर को थमा देने या दबा देने का भाव व्यक्त करता है। हिंदी में ‘शांत करता है’ स्वाभाविक है और परमेश्वर के निरंतर वर्णित कार्य का कृदन्त-सदृश भाव बनाए रखता है।
- source_word: שְׁאוֹן
  choice: गर्जन
  rationale: समुद्रों और लहरों के संदर्भ में यह शब्द ऊँची, प्रचंड ध्वनि बताता है। दोनों बार ‘गर्जन’ रखने से इब्रानी पुनरुक्ति सुरक्षित रहती है।
- source_word: יַמִּים
  choice: समुद्रों
  rationale: इब्रानी शब्द बहुवचन है; ‘समुद्रों’ उसी रूप को सीधे व्यक्त करता है।
- source_word: גַּלֵּיהֶם
  choice: उनकी लहरों
  rationale: पुल्लिंग बहुवचन प्रत्यय का स्वाभाविक संबंध बहुवचन ‘समुद्रों’ से है; ‘उनकी’ इस संबंध को बनाए रखता है।
- source_word: הֲמוֹן
  choice: कोलाहल
  rationale: समुद्र के गर्जन के समानांतर यहाँ शोरभरी हलचल प्रमुख है, यद्यपि यह शब्द कुछ संदर्भों में बड़ी भीड़ या जन-समूह भी सूचित कर सकता है।
- source_word: לְאֻמִּים
  choice: जन-समूहों
  rationale: यह शब्द अलग-अलग लोगों या जातीय समुदायों को सूचित करता है। ‘जन-समूहों’ आधुनिक राष्ट्र-राज्यों का अनावश्यक अर्थ आरोपित किए बिना सामूहिक मानव समुदायों को व्यक्त करता है।
theological_decisions:
- issue: प्राकृतिक और मानवीय अव्यवस्था के बीच समानांतरता का दायरा
  choice: पद परमेश्वर को समुद्रों के गर्जन और जन-समूहों के कोलाहल—दोनों को शांत करने वाला बताता है।
  alternative: इसे केवल प्राकृतिक घटना तक सीमित मानना, अथवा विशेष रूप से राष्ट्रों के राजनीतिक दमन के रूप में समझना।
  rationale: इब्रानी काव्यात्मक समानांतरता समुद्रों के शोर और लोगों के कोलाहल को जोड़ती है। अनुवाद किसी विशिष्ट राजनीतिक या युगांत-संबंधी व्याख्या को जोड़े बिना इस व्यापकता और तनाव को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक रखी गई है। ‘गर्जन’ की पुनरावृत्ति मूल इब्रानी की ध्वन्यात्मक समानांतरता को सुरक्षित रखती है; ‘जन-समूह’ सामान्य पाठक के लिए सहज रहते हुए ‘लोगों/जातियों’ की सामूहिकता व्यक्त करता है।
