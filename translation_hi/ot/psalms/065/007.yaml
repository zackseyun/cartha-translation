- from: जो समुद्रों का गर्जन, उनकी लहरों का गर्जन शांत करता है[a], और जन-समूहों का कोलाहल[b] भी।
  to: वह समुद्रों के गर्जन, उनकी लहरों के गर्जन और लोगों के कोलाहल को शांत करता है[a][b]।
  rationale: संशोधन से वाक्य आधुनिक मानक हिंदी में पूर्ण और स्वाभाविक बनता है। ‘लोगों’ लְאֻमִּים के व्यापक ‘peoples’ अर्थ को सुरक्षित रखता है, जबकि ‘गर्जन’ की पुनरावृत्ति तथा प्राकृतिक और मानवीय कोलाहल का समानांतर बने रहते हैं। दोनों पादटिप्पणी-चिह्न क्रिया और मानवीय कोलाहल के लिए अपने-अपने शब्दगत विकल्पों से संबद्ध रखे गए हैं।
