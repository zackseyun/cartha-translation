  yaml_path: translation/ot/psalms/065/006.yaml
  text: who establishes the mountains by his power[a], being girded with might.
translation:
  language: hi
  text: 'जो अपनी सामर्थ्य से पहाड़ों को दृढ़ करता है,

    और पराक्रम से कमर कसे हुए है।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो अपने बल से पहाड़ों को स्थिर करता है, और शक्ति से कमर कसे हुए है।”
    reason: मूल शब्दों כֹּחַ और גְּבוּרָה के क्रमशः ‘बल/सामर्थ्य’ और ‘शक्ति/पराक्रम’ अर्थ संभव हैं; אזר का अर्थ ‘कमर कसना’ भी हो सकता है।
lexical_decisions:
- source_word: מֵכִין
  choice: दृढ़ करता है
  rationale: כון के हिफ़ील कृदंत का अर्थ किसी वस्तु को स्थिर या दृढ़ करना है। पहाड़ों के संदर्भ में यह उनकी स्थापित स्थिरता को स्वाभाविक हिंदी में व्यक्त करता है, बिना सृष्टि की प्रक्रिया को आवश्यकता से अधिक स्पष्ट किए।
- source_word: הָרִים
  choice: पहाड़ों
  rationale: הָרִים का सीधा अर्थ ‘पहाड़’ है; हिंदी में जातिवाचक बहुवचन के साथ अलग निश्चित उपपद की आवश्यकता नहीं है।
- source_word: בְּכֹחוֹ
  choice: अपनी सामर्थ्य से
  rationale: כֹּחַ शक्ति या सामर्थ्य को दर्शाता है और ב साधन सूचित करता है। ‘अपनी सामर्थ्य से’ हिंदी में साधन और कर्ता से संबंध दोनों स्पष्ट करता है।
- source_word: נֶאְזָר
  choice: कमरबंद बाँधे हुए है
  rationale: אזר का निफ़ाल कृदंत कमर कसने या कमरबंद बाँधने की सजीव उपमा रखता है। यह केवल ‘सामर्थी है’ कहकर चित्रात्मकता को सपाट नहीं करता।
- source_word: בִּגְבוּרָה
  choice: पराक्रम का
  rationale: גְּבוּרָה प्रबल शक्ति या पराक्रम को व्यक्त करता है। ‘पराक्रम का कमरबंद’ मूल उपमा को बनाए रखता है और पहले आए ‘सामर्थ्य’ की अनावश्यक पुनरावृत्ति से बचता है।
theological_decisions:
- issue: दोनों कृदंतों का संबंध
  choice: पहले कृदंत को ‘जो ... दृढ़ करता है’ और दूसरे को समन्वित वर्णन ‘और ... बाँधे हुए है’ के रूप में प्रस्तुत किया गया है।
  alternative: ‘जो ... दृढ़ करता और ... बाँधे रहता है’ अथवा दूसरे खंड को अलग संबंधवाचक वाक्य बनाया जा सकता है।
  rationale: मूल में क्रमशः दो कृदंत परमेश्वर के विशिष्ट कार्य और स्थायी सामर्थ्य का वर्णन करते हैं। हिंदी में समन्वित संरचना इस काव्यात्मक प्रवाह को सहज रूप से सुरक्षित रखती है।
- issue: दैवी सामर्थ्य की शारीरिक उपमा
  choice: ‘पराक्रम का कमरबंद बाँधे हुए’ कहकर उपमा सुरक्षित रखी गई है।
  alternative: इसे ‘पराक्रम से सुसज्जित’ या ‘सामर्थ्य से भरपूर’ कहा जा सकता है।
  rationale: मूल पाठ देह-संबंधी काव्यात्मक उपमा का प्रयोग करता है। उसे बनाए रखना पद की चित्रात्मक शक्ति को बचाता है और उसे किसी अमूर्त धर्मवैज्ञानिक कथन में नहीं बदलता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और काव्यात्मक हिंदी। ‘दृढ़ करता है’ स्थिरता का भाव रखता है, जबकि ‘पराक्रम का कमरबंद बाँधे हुए’ मूल की सजीव उपमा को सामान्य पाठक के लिए समझने योग्य रूप में बनाए रखता है।
