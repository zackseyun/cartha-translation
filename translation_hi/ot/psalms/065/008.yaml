source:
  edition: WLC
  text: וַ/יִּ֤ירְא֨וּ יֹשְׁבֵ֣י קְ֭צָוֺת מֵ/אוֹתֹתֶ֑י/ךָ מ֤וֹצָֽאֵי בֹ֖קֶר וָ/עֶ֣רֶב תַּרְנִֽין׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/065/008.yaml
  text: Those who dwell at the ends of the earth fear because of your signs[b][a]; you make the dawn and the evening shout for joy.
translation:
  language: hi
  text: पृथ्वी के छोरों पर रहने वाले तेरे चिन्हों के कारण भयभीत होते हैं[a]; तू भोर और साँझ को उल्लास से गवाता है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद ‘तेरे चिन्हों के कारण श्रद्धामिश्रित विस्मय से भर जाते हैं’ भी हो सकता है। इब्रानी क्रिया भय, आतंक या श्रद्धापूर्ण विस्मय व्यक्त कर सकती है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘भोर और साँझ के निकलने।’ यह काव्यात्मक वाक्यांश भोर और साँझ के प्रकट होने, अथवा उन स्थानों या समयों की ओर संकेत कर सकता है जहाँ वे प्रकट होते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּירְאוּ
  choice: भय खाते हैं
  rationale: यह क्रिया भय, आतंक या श्रद्धामिश्रित विस्मय व्यक्त कर सकती है। ‘भय खाते हैं’ इस व्यापक अर्थ को बनाए रखता है और भाव को केवल आतंक या केवल श्रद्धा तक सीमित नहीं करता।
- source_word: יֹשְׁבֵי קְצָוֺת
  choice: पृथ्वी के छोरों पर रहनेवाले
  rationale: शाब्दिक अर्थ ‘छोरों पर रहनेवाले’ है। ‘पृथ्वी के’ जोड़ने से दूर-दराज़ के प्रदेशों का आशय आधुनिक हिन्दी में स्पष्ट और स्वाभाविक होता है।
- source_word: מֵאוֹתֹתֶיךָ
  choice: तेरे चिन्हों के कारण
  rationale: भय व्यक्त करनेवाली क्रिया के साथ מִן कारण बता सकता है। इसलिए ‘के कारण’ यहाँ स्पष्ट और स्वाभाविक है।
- source_word: אוֹתֹתֶיךָ
  choice: तेरे चिन्हों
  rationale: אוֹת का सीधा अर्थ ‘चिन्ह’ है और यहाँ यह परमेश्वर के सामर्थ्य को प्रकट करनेवाले कार्यों की ओर संकेत करता है; ‘अद्भुत काम’ कहना अधिक व्याख्यात्मक होता।
- source_word: מוֹצָאֵי בֹקֶר וָעֶרֶב
  choice: भोर और साँझ
  rationale: מוֹצָאֵי का शाब्दिक भाव ‘निकलने/प्रकट होने’ का है। मुख्य पाठ में स्वाभाविक काव्यात्मक हिन्दी के लिए ‘भोर और साँझ’ रखा गया है, जबकि शाब्दिक बिंब और उसकी संभावित स्थानगत या कालगत व्याख्या पाद-टिप्पणी में दी गई है।
- source_word: תַּרְנִין
  choice: आनन्द से जयजयकार कराता है
  rationale: रूप हिफ़ील है और किसी को उल्लास से पुकारने या गाने के लिए प्रेरित करने का अर्थ देता है। यह अनुवाद उसके कारक और उल्लासपूर्ण बल दोनों को बनाए रखता है।
theological_decisions:
- issue: परमेश्वर के चिन्हों के प्रति मनुष्यों की प्रतिक्रिया
  choice: ‘भय खाते हैं’ कहकर भय और श्रद्धामिश्रित विस्मय के बीच का अर्थगत तनाव बनाए रखा गया है।
  alternative: ‘विस्मय से भर जाते हैं’ या ‘आतंकित हो जाते हैं।’
  rationale: इब्रानी क्रिया दोनों प्रकार की प्रतिक्रिया व्यक्त कर सकती है; संदर्भ किसी एक अर्थ को अनिवार्य रूप से निश्चित नहीं करता।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी; सम्बोधन में काव्यपरक ‘तेरे/तू’ रखा गया है। समानांतर काव्य-पंक्तियों को अर्धविराम से जोड़ा गया है और मूल की मानवीकरण शैली बनाए रखी गई है।
