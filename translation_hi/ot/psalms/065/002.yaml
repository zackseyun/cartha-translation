  text: שֹׁמֵ֥עַ תְּפִלָּ֑ה עָ֝דֶ֗י/ךָ כָּל בָּשָׂ֥ר יָבֹֽאוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/065/002.yaml
  text: O you who hear prayer[a], to you all flesh will come.
translation:
  language: hi
  text: 'हे प्रार्थना सुननेवाले,

    सब मनुष्य[a] तेरे पास आएँगे।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से ‘समस्त देह’; यह पूरी मानवजाति के लिए प्रयुक्त काव्यात्मक अभिव्यक्ति है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שֹׁמֵעַ
  choice: सुननेवाले
  rationale: यह क़ाल कृदन्त यहाँ परमेश्वर को सम्बोधित करने वाले संज्ञात्मक रूप में है। ‘प्रार्थना सुननेवाले’ हिन्दी में स्वाभाविक है और निरन्तर सुनने के भाव को बनाए रखता है।
- source_word: תְּפִלָּה
  choice: प्रार्थना
  rationale: एकवचन संज्ञा यहाँ सामान्य अथवा सामूहिक अर्थ में है; इसलिए बिना किसी निश्चित प्रार्थना तक सीमित किए ‘प्रार्थना’ उपयुक्त है।
- source_word: עָדֶיךָ
  choice: तेरे पास
  rationale: עַד तथा द्वितीय पुरुष एकवचन प्रत्यय, आने की क्रिया के साथ, सम्बोधित व्यक्ति की ओर गति दर्शाते हैं। हिन्दी में ‘तेरे पास’ इसका स्वाभाविक रूप है।
- source_word: כָּל־בָּשָׂר
  choice: सब मनुष्य
  rationale: शाब्दिक रूप से ‘सारा मांस/समस्त देह’ एक इब्रानी काव्यात्मक मुहावरा है, जो यहाँ समूची मानवता को सूचित करता है। ‘सब मनुष्य’ आधुनिक हिन्दी में स्पष्ट है; स्रोत की काव्यात्मक अभिव्यक्ति पादटिप्पणी में दी गई है।
- source_word: יָבֹאוּ
  choice: आएँगे
  rationale: तीसरे पुरुष बहुवचन अपूर्ण क्रिया यहाँ भावी अथवा आगे घटने वाली क्रिया व्यक्त करती है; ‘आएँगे’ इसे सहज हिन्दी में दर्शाता है।
theological_decisions:
- issue: כָּל־בָּשָׂר का विस्तार
  choice: समस्त मानवता के अर्थ में ‘सब मनुष्य’
  alternative: ‘समस्त देहधारी’ अथवा अधिक शाब्दिक ‘सारा मांस’
  rationale: इस इब्रानी पदबंध का प्रसंगगत आशय व्यापक रूप से मानवजाति है। मुख्य पाठ में स्पष्ट हिन्दी रखी गई है, जबकि पादटिप्पणी मूल रूपक को सुरक्षित रखती है; इस प्रकार इसके सार्वभौमिक मानवीय विस्तार को न तो संकुचित किया गया है, न किसी विशिष्ट धर्मवैज्ञानिक व्यवस्था से बाँधा गया है।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण है। ‘हे’ से सम्बोधन स्पष्ट किया गया है। परमेश्वर के लिए एकवचन निकट सम्बोधन ‘तेरे’ रखा गया है, जो इब्रानी के द्वितीय पुरुष पुल्लिंग एकवचन से मेल खाता है और हिन्दी भजन-काव्य में स्वाभाविक है। पंक्ति-विभाजन इब्रानी पद के दो काव्यात्मक खंडों को दर्शाता है।
