  text: אַשְׁרֵ֤י תִּֽבְחַ֣ר וּ/תְקָרֵב֮ יִשְׁכֹּ֪ן חֲצֵ֫רֶ֥י/ךָ נִ֭שְׂבְּעָה בְּ/ט֣וּב בֵּיתֶ֑/ךָ קְ֝דֹ֗שׁ הֵיכָלֶֽ/ךָ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/065/004.yaml
  text: Blessed is the one you choose and bring near to dwell in your courts[a]; we will be satisfied with the goodness of your house[b], the holiness of your temple.
translation:
  language: hi
  text: क्या ही धन्य है वह, जिसे तू चुनता और अपने निकट लाता है, कि वह तेरे आँगनों में निवास करे![a] हम तेरे भवन की भलाई[b] से, तेरे मन्दिर की पवित्रता से तृप्त होंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा, “क्या ही धन्य है वह, जिसे तू चुनता और अपने निकट लाता है; वह तेरे आँगनों में निवास करेगा।”
    reason: יִשְׁכֹּן को उद्देश्य/परिणाम के उपवाक्य के बजाय स्वतंत्र भविष्यकालीन कथन के रूप में भी समझा जा सकता है।
  - marker: b
    text: “भलाई” का अनुवाद “अच्छी वस्तुएँ” या “भरपूरी” भी हो सकता है।
    reason: טוּב गुणात्मक भलाई के साथ-साथ उदारतापूर्वक दी गई अच्छी वस्तुओं या समृद्धि को भी दर्शा सकता है।
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: क्या ही धन्य है
  rationale: बहुवचन रूप में प्रयुक्त यह उद्गार धन्यता-वचन आरम्भ करता है। ‘क्या ही धन्य है’ उसके विस्मय और धार्मिक भाव, दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: תִּבְחַר
  choice: तू चुनता
  rationale: בחר का सामान्य अर्थ चुनना है। यह परमेश्वर की पहल को बनाए रखता है, पर किसी बाद की धर्मवैज्ञानिक पारिभाषिकता को आरोपित नहीं करता।
- source_word: וּתְקָרֵב
  choice: और अपने निकट लाता है
  rationale: 'קרב के हिफ़ील रूप की कारणवाचक शक्ति स्पष्ट करने के लिए यह अनुवाद किया गया है: परमेश्वर उस व्यक्ति को निकट आने देता मात्र नहीं, बल्कि निकट लाता है।'
- source_word: יִשְׁכֹּן
  choice: कि वह ... निवास करे
  rationale: तीसरे पुरुष के अपूर्ण रूप को उद्देश्य अथवा परिणाम बताने वाले उपवाक्य के रूप में रखा गया है; इससे इब्रानी की सम्भावित अर्थ-छाया और स्वाभाविक हिन्दी दोनों बनी रहती हैं।
- source_word: חֲצֵרֶיךָ
  choice: तेरे आँगनों में
  rationale: मन्दिर-सन्दर्भ में חצר पवित्रस्थान के प्रांगणों को दर्शाता है। ‘आँगन’ सामान्य पाठक के लिए स्पष्ट और ठोस है।
- source_word: נִשְׂבְּעָה
  choice: हम ... तृप्त होंगे
  rationale: सहकारक/इच्छार्थक रूप यहाँ भरोसे से भरी अपेक्षा व्यक्त कर सकता है। भविष्यकालीन कथन इस अर्थ को सहज हिन्दी में देता है।
- source_word: בְּטוּב
  choice: की भलाई से
  rationale: טוּב में गुणात्मक ‘भलाई’ और उदारता से मिली अच्छी वस्तुओं, दोनों की अर्थ-सम्भावना है; मुख्य पाठ में व्यापक अर्थ रखा गया और पादटिप्पणी में विकल्प दिए गए हैं।
- source_word: בֵּיתֶךָ
  choice: तेरे भवन की
  rationale: मन्दिर के समानान्तर यह परमेश्वर के पवित्र भवन को सूचित करता है। ‘भवन’ हिन्दी में गरिमापूर्ण है और निकट आने वाले ‘मन्दिर’ से अनावश्यक शब्द-पुनरावृत्ति टालता है।
- source_word: קְדֹשׁ
  choice: तेरे पवित्र मन्दिर से
  rationale: קדש को היכל से सम्बद्ध पवित्रता-सूचक पद माना गया है। हिन्दी में विशेषण ‘पवित्र’ इस सम्बन्ध को स्वाभाविक रूप से व्यक्त करता है; डैश इसे पहले वाक्यांश की समानाधिकरणात्मक व्याख्या के रूप में खुला रखता है।
- source_word: הֵיכָלֶךָ
  choice: तेरे ... मन्दिर से
  rationale: आराधना-सन्दर्भ और ‘भवन’ तथा ‘आँगनों’ के समानान्तर היכל का अर्थ यहाँ ‘मन्दिर’ है, न कि लौकिक राजमहल।
theological_decisions:
- issue: परमेश्वर का चुनना और अपने निकट लाना
  choice: परमेश्वर की पहल को सीधे शब्दों में बनाए रखा गया है।
  alternative: इसे किसी विशिष्ट पूर्वनियति-सिद्धान्त की पारिभाषिक भाषा में कहना, या केवल याजकीय नियुक्ति तक सीमित कर देना।
  rationale: इब्रानी पाठ उपासक को चुनने और निकट लाने की पहल परमेश्वर को देता है, पर उस चुनाव का पूरा धर्मवैज्ञानिक दायरा निर्धारित नहीं करता। अनुवाद इसी तनाव को खुला रखता है।
- issue: भवन की भलाई और पवित्र मन्दिर के बीच सम्बन्ध
  choice: ‘तेरे पवित्र मन्दिर से’ को डैश द्वारा ‘तेरे भवन की भलाई’ के साथ समानाधिकरणात्मक रूप से जोड़ा गया है।
  alternative: इसे पूरी तरह अलग दूसरी वस्तु मानना—‘तेरे भवन की भलाई और तेरे मन्दिर की पवित्रता से।’
  rationale: इब्रानी में ‘पवित्र’ और ‘तेरा मन्दिर’ का संक्षिप्त विन्यास व्याकरणिक रूप से कठिन है। चुना हुआ रूप मन्दिर-सन्दर्भ और काव्यात्मक संक्षिप्तता को रखता है, बिना ‘पवित्रता’ को अलग अमूर्त वस्तु के रूप में निश्चित किए।
- issue: मन्दिर तक पहुँच की ठोस उपासना-भाषा
  choice: ‘आँगन’, ‘भवन’ और ‘मन्दिर’ जैसे ठोस शब्द रखे गए हैं।
  alternative: इन सबको सामान्यीकृत कर ‘उपस्थिति’ या ‘निवास-स्थान’ कहना।
  rationale: पद इस्राएल की मन्दिर-उपासना की वास्तविक छवि में निहित है। आध्यात्मिकीकरण को पाठ में जोड़ने के बजाय उसके अनुप्रयोग को पाठक के लिए खुला रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण काव्यात्मक शैली रखी गई है। भजन की सीधी द्वितीय-पुरुष एकवचन सम्बोधन-शैली के अनुरूप ‘तू/तेरे’ प्रयुक्त हैं। ‘मन्दिर’ की वर्तनी औपचारिक हिन्दी के अनुरूप रखी गई है; वाक्य-संरचना सामान्य पाठक के लिए स्पष्ट है, जबकि मूल की व्याकरणिक और धर्मवैज्ञानिक खुलावट पादटिप्पणी तथा विराम-चिह्नों द्वारा सुरक्षित है।
