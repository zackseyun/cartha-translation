id: PSA.65.10
reference: Psalms 65:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: תְּלָמֶ֣י/הָ רַ֭וֵּה נַחֵ֣ת גְּדוּדֶ֑י/הָ בִּ/רְבִיבִ֥ים תְּ֝מֹגְגֶ֗/נָּה צִמְחָ֥/הּ תְּבָרֵֽךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/065/010.yaml
  text: Saturate its furrows; settle its ridges. With showers you soften it; you bless its growth.
translation:
  language: hi
  text: तू उसकी क्यारियों को सींचता है; उसकी मेंड़ों को बैठा देता है। तू वर्षा की बौछारों से उसे नरम करता है; उसकी बढ़वार को आशीष देता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תְּלָמֶיהָ
  choice: उसकी क्यारियों
  rationale: תלם खेत में हल से बनी नाली या क्यारी को दर्शाता है; प्रसंग में वर्षा से सिंचने के साथ ‘क्यारियाँ’ स्वाभाविक और स्पष्ट है।
- source_word: רַוֵּה
  choice: सींचता है
  rationale: पिएल रूप का अर्थ भरपूर पानी देना या तर करना है; कृषि-संदर्भ में ‘सींचता है’ सहज है।
- source_word: גְּדוּדֶיהָ
  choice: उसकी मेंड़ों
  rationale: यहाँ शब्द खेत की उभरी हुई मिट्टी की पंक्तियों/ढेलों को सूचित करता है; ‘मेंड़ें’ क्यारियों के समानांतर कृषि-चित्र को बनाए रखता है।
- source_word: נַחֵת
  choice: बैठा देता है
  rationale: शाब्दिक भाव नीचे करने या धँसाने का है; वर्षा से उठी हुई मिट्टी बैठ जाने का चित्र सुरक्षित रहता है, बिना ‘समतल’ जैसा अतिरिक्त परिणाम जोड़ने के।
- source_word: בִּרְבִיבִים
  choice: झड़ियों से
  rationale: רְבִיבִים प्रचुर वर्षा या बरसाती झड़ियों को दर्शाता है; ‘झड़ियाँ’ बहुवचन और कृषि-संदर्भ दोनों को व्यक्त करता है।
- source_word: תְּמֹגְגֶנָּה
  choice: मिट्टी को नरम करता है
  rationale: मूल क्रिया पिघलाने/गलाने का चित्र देती है; वर्षा के प्रभाव के संदर्भ में ‘नरम करता है’ लक्ष्य भाषा में स्वाभाविक है। स्त्रीलिंग प्रत्यय का संदर्भ भूमि से है, जिसे स्पष्टता हेतु ‘मिट्टी’ कहा गया है।
- source_word: צִמְחָהּ
  choice: उसकी उपज
  rationale: शब्द भूमि से निकलने वाली बढ़वार या अंकुरण को दर्शाता है; ‘उपज’ कृषि-संदर्भ में संक्षिप्त और सहज है।
theological_decisions:
- issue: परमेश्वर को सीधे संबोधन में पुरुषवाचक एकवचन क्रियाएँ
  choice: तू ... सींचता है ... करता है ... देता है
  alternative: आप ... सींचते हैं ... करते हैं ... देते हैं
  rationale: इब्रानी पाठ का दूसरा पुरुष एकवचन निकट और प्रत्यक्ष संबोधन है; हिंदी बाइबिलीय काव्य में ‘तू’ इस निकटता और व्याकरणिक एकवचन को बनाए रखता है।
- issue: वर्षा और उपज में परमेश्वर की सक्रिय भूमिका
  choice: तू ... उसकी उपज को आशीष देता है
  alternative: उसकी उपज आशीष पाती है
  rationale: मूल पाठ में परमेश्वर सक्रिय कर्ता है; सक्रिय वाक्य उस धार्मिक कथन को बिना घटाए सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी में काव्यात्मक किंतु सहज कृषि-शब्दावली रखी गई है। चार समानांतर खंडों की इब्रानी लय और परमेश्वर को प्रत्यक्ष संबोधन संरक्षित है।
