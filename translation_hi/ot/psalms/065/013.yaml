  yaml_path: translation/ot/psalms/065/013.yaml
  text: The pastures are clothed with flocks[a], and the valleys wrap themselves in grain; they shout for joy, yes[b], they sing.
translation:
  language: hi
  text: चरागाहों पर भेड़-बकरियों के झुंड छा गए हैं,[a] और घाटियाँ अनाज से ढक गई हैं; वे उल्लास से पुकार उठती हैं, हाँ, वे गाती हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “घास के मैदानों पर भेड़-बकरियों के झुंड छा गए हैं।” इस प्रसंग में इब्रानी संज्ञा चरागाह या घास के मैदान को सूचित कर सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לָבְשׁוּ כָרִים הַצֹּאן
  choice: चरागाह भेड़-बकरियों के झुंडों से वस्त्र पहने हुए हैं
  rationale: इब्रानी रूपक में चरागाहों को झुंडों से वस्त्र पहने हुए दिखाया गया है। ‘भेड़-बकरियों के झुंड’ צֹאן के छोटे पालतू पशुओं वाले सामूहिक अर्थ को स्पष्ट करता है।
- source_word: כָרִים
  choice: चरागाह
  rationale: समानांतर ‘घाटियाँ’ और पशु-झुंडों के संदर्भ में यह शब्द मेढ़ों के बजाय चराई की भूमि या घास के मैदान को सूचित करता है।
- source_word: וַעֲמָקִים יַעַטְפוּ בָר
  choice: और घाटियाँ अनाज ओढ़े हुए हैं
  rationale: ‘ओढ़े हुए हैं’ भूमि के स्वयं को अनाज से लपेटने की सजीव काव्यात्मक छवि को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: יִתְרוֹעֲעוּ
  choice: आनन्द से जयजयकार करती हैं
  rationale: क्रिया उल्लासपूर्ण ऊँची पुकार को व्यक्त करती है; सृष्टि-स्तुति के संदर्भ में ‘आनन्द से जयजयकार’ उसके सकारात्मक भाव को स्पष्ट रखता है।
- source_word: אַף יָשִׁירוּ
  choice: हाँ, वे गीत गाती हैं
  rationale: אַף यहाँ अगले समानांतर कथन को बल देता है; ‘हाँ’ उस जोर को दर्शाता है और יָשִׁירוּ का स्वाभाविक अर्थ ‘गीत गाती हैं’ है।
