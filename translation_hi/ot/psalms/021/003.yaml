  text: כִּֽי תְ֭קַדְּמֶ/נּוּ בִּרְכ֣וֹת ט֑וֹב תָּשִׁ֥ית לְ֝/רֹאשׁ֗/וֹ עֲטֶ֣רֶת פָּֽז־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/021/003.yaml
  text: For you meet him with blessings of good[c][b][a]; you set a crown of fine gold on his head.
translation:
  language: hi
  text: क्योंकि तू भलाई की आशीषों के साथ उससे मिलने आता है[a]; तू उसके सिर पर खरे सोने[b] का मुकुट रखता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद ‘तू भलाई की आशीषों के साथ उसके आगे जाता है’ या ‘तू भलाई की आशीषों के साथ उससे मिलने के लिए आगे आता है’ भी हो सकता है। इब्रानी क्रिया में किसी से मिलने के लिए आगे आने या उसके आगे जाने—दोनों का भाव हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘शुद्ध सोने’ अथवा ‘परिष्कृत सोने’।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण या आधार प्रस्तुत करता है और भजन की तर्कगत कड़ी को स्पष्ट रखता है।
- source_word: תְקַדְּמֶנּוּ
  choice: तू उससे मिलने आता है
  rationale: पिएल रूप में क्रिया किसी से आगे बढ़कर मिलने या उसके आगे जाने का भाव दे सकती है। यह चयन परमेश्वर की पहल को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: בִּרְכוֹת טוֹב
  choice: उत्तम आशीषें
  rationale: बहुवचन ‘आशीषें’ को बनाए रखते हुए טוֹב का व्यापक सकारात्मक भाव व्यक्त किया गया है; इसे केवल भौतिक समृद्धि या केवल आत्मिक वरदानों तक सीमित नहीं किया गया।
- source_word: תָּשִׁית
  choice: रखता है
  rationale: मुकुट को सिर पर रखने के लिए यह आधुनिक हिन्दी का स्वाभाविक और गरिमापूर्ण प्रयोग है।
- source_word: לְרֹאשׁוֹ
  choice: उसके सिर पर
  rationale: रखने की क्रिया के साथ לְ का प्रसंगानुकूल स्थानवाचक अर्थ हिन्दी में ‘पर’ से स्वाभाविक रूप से व्यक्त होता है।
- source_word: עֲטֶרֶת
  choice: मुकुट
  rationale: राजकीय भजन के प्रसंग में यह ‘किरीट’ या ‘माला’ की अपेक्षा अधिक स्पष्ट और सामान्य आधुनिक हिन्दी है।
- source_word: פָּז
  choice: खरा सोना
  rationale: यह उच्च गुणवत्ता वाले, शुद्ध या परिष्कृत सोने का संकेत देता है। ‘खरा सोना’ काव्यात्मक गरिमा और सहज बोध दोनों बनाए रखता है।
theological_decisions:
- issue: राजा को दी गई आशीषों का स्वरूप
  choice: ‘उत्तम आशीषें’ के रूप में व्यापक अर्थ बनाए रखा गया है।
  alternative: इसे विशेष रूप से भौतिक समृद्धि या विशेष रूप से वाचा-संबंधी/आत्मिक आशीषें कहना।
  rationale: मूल इब्रानी पदबंध व्यापक है; अनुवाद ऐसी कोई धार्मिक सीमा नहीं लगाता जो पाठ में स्पष्ट नहीं है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। परमेश्वर के लिए एकवचन आत्मीय संबोधन ‘तू’ भजन की सीधी सम्बोधन-शैली को बनाए रखता है। वाक्य की काव्यात्मक समानांतरता अर्धविराम से प्रकट की गई है।
