  rationale: भजनों के शीर्षकों में לְדָוִד अर्थ की दृष्टि से व्यापक है। इसलिए अनुवाद प्रत्यक्ष रचनाकारिता या समर्पण का दावा निश्चित किए बिना मूल की अस्पष्टता बनाए रखता है।
