lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: संगीत-निर्देशक के लिए
  rationale: भजनों के शीर्षकों में यह शब्द संगीत का नेतृत्व या निरीक्षण करने वाले व्यक्ति को सूचित करता है। उपसर्ग לַ का प्रयोजनात्मक भाव ‘के लिए’ से व्यक्त किया गया है।
- source_word: מִזְמוֹר
  choice: भजन
  rationale: यह संगीत से जुड़ी काव्य-विधा का प्रचलित शीर्षक है; आधुनिक हिन्दी में ‘भजन’ इसका स्वाभाविक और सुबोध समतुल्य है।
- source_word: לְדָוִד
  choice: दाऊद का
  rationale: इब्रानी לְ यहाँ रचनाकार, संबंध, स्वामित्व या समर्पण का संकेत दे सकता है। ‘दाऊद का’ इस व्यापकता को ‘दाऊद द्वारा रचित’ या ‘दाऊद के लिए’ की अपेक्षा बेहतर ढंग से खुला रखता है।
theological_decisions:
