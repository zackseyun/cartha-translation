  yaml_path: translation/ot/psalms/021/005.yaml
  text: Great is his glory through your salvation[b][a]; you bestow splendor and majesty on him.
translation:
  language: hi
  text: तेरे उद्धार[b][a] के द्वारा उसकी महिमा महान है; तू उसे वैभव और प्रताप प्रदान करता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तेरे उद्धार से” अथवा “तेरे उद्धार में”; इब्रानी पूर्वसर्ग साधन या क्षेत्र—दोनों का भाव दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ “उद्धार” का अर्थ “छुटकारा” या इस राजकीय संदर्भ में “विजय” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: גָּדוֹל
  choice: महान है
  rationale: विधेयात्मक विशेषण पद के आरम्भ में है; हिंदी में संज्ञा के बाद ‘महान है’ स्वाभाविक रहते हुए उसके बल को बनाए रखता है।
- source_word: כְּבוֹדוֹ
  choice: उसकी महिमा
  rationale: כָּבוֹד यहाँ राजा के गौरव और सम्मान को व्यक्त करता है; ‘महिमा’ राजकीय और उन्नयन के संदर्भ के अनुकूल है।
- source_word: בִּישׁוּעָתֶךָ
  choice: तेरे उद्धार के द्वारा
  rationale: בְּ साधन अथवा क्षेत्र का भाव दे सकता है। ‘के द्वारा’ यहाँ परमेश्वर के उद्धारकारी कार्य को राजा की महिमा का साधन बताता है, जबकि पादटिप्पणी अन्य संभावनाएँ सुरक्षित रखती है।
- source_word: הוֹד
  choice: वैभव
  rationale: הוֹד राजसी शोभा और भव्यता का बोध कराता है; ‘वैभव’ अगले समानांतर शब्द से अर्थगत भेद भी बनाए रखता है।
- source_word: וְהָדָר
  choice: और प्रताप
  rationale: הָדָר गरिमा, शोभा और राजसी प्रतिष्ठा को सूचित करता है; ‘प्रताप’ הוֹד के साथ स्वाभाविक काव्यात्मक युग्म बनाता है।
- source_word: תְּשַׁוֶּה עָלָיו
  choice: तूने उसे ... से विभूषित किया है
  rationale: क्रिया का मूल भाव किसी पर कुछ रखना या प्रदान करना है। ‘विभूषित किया है’ राजकीय सम्मान प्रदान करने के भाव को स्वाभाविक हिंदी में व्यक्त करता है।
theological_decisions:
- issue: राजकीय भजन में יְשׁוּעָה का अर्थ
  choice: उद्धार
  alternative: छुटकारा; विजय
  rationale: ‘उद्धार’ शब्द के व्यापक मूल अर्थ को बनाए रखता है; राजकीय या युद्ध-संदर्भ में निहित ‘विजय’ की संभावना पादटिप्पणी में दी गई है।
- issue: בְּ उपसर्ग का संबंध
  choice: के द्वारा
  alternative: तेरे उद्धार में; तेरे उद्धार से
  rationale: साधन का अर्थ संदर्भ में सुगम है, पर इब्रानी की क्षेत्रवाचक संभावना को निश्चित रूप से नकारा नहीं गया और पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण काव्यात्मक शैली रखी गई है। परमेश्वर के लिए एकवचन आत्मीय संबोधन ‘तेरे/तूने’ भजन की सीधी वाणी के अनुरूप है। ‘वैभव और प्रताप’ समानांतर राजकीय पदों का अर्थगत भेद बनाए रखते हैं।
