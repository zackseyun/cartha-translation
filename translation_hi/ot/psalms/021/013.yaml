  text: Be exalted[a], O Yahweh[b], in your strength! We will sing and make music to your might.
translation:
  language: hi
  text: 'हे याहवे, अपनी सामर्थ्य में ऊँचा उठ[a]!

    हम तेरे पराक्रम का गान करेंगे और संगीत बजाएँगे।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उठ खड़ा हो।” इब्रानी क्रिया याहवे से उठने की पुकार या उसके ऊँचा और महिमान्वित प्रकट होने की विनती—दोनों अर्थ दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ר֣וּמָה
  choice: ऊँचा उठ
  rationale: रום का यह संबोधनात्मक रूप ऊपर उठने या ऊँचा किए/महिमान्वित होने की पुकार व्यक्त कर सकता है। ‘ऊँचा उठ’ हिंदी में इस काव्यात्मक पुकार को स्वाभाविक रखते हुए मूल की संभावित सक्रिय और महिमामूलक दोनों छायाओं के लिए स्थान छोड़ता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: यह परमेश्वर का व्यक्तिगत वाचा-नाम है; इसे किसी उपाधि से बदलने के बजाय हिंदी में प्रचलित निकट लिप्यंतरण ‘याहवे’ रखा गया है।
- source_word: בְּעֻזֶּךָ
  choice: अपनी सामर्थ्य में
  rationale: בְּ यहाँ क्षेत्र या साधन दोनों की छाया दे सकता है। ‘अपनी सामर्थ्य में’ मूल पूर्वसर्ग के निकट है और याहवे की सामर्थ्य के प्रकट होने में उसके ऊँचा उठने का भाव देता है।
- source_word: נָשִׁירָה
  choice: हम ... गान करेंगे
  rationale: प्रथम पुरुष बहुवचन का यह cohortative रूप संकल्प या आमंत्रण व्यक्त कर सकता है। प्रसंग में आराधकों का दृढ़ प्रत्युत्तर होने के कारण भविष्यसूचक-संकल्पात्मक ‘हम ... करेंगे’ स्वाभाविक है।
- source_word: וּנְזַמְּרָה
  choice: और भजन गाएँगे
  rationale: זמר स्तुति के संदर्भ में वाद्य-संगीत करने या स्तुति-गीत गाने का अर्थ दे सकता है। ‘भजन गाएँगे’ हिंदी में संगीतमय स्तुति का भाव स्पष्ट करता है और पहले क्रियापद की मात्र पुनरावृत्ति से बचता है।
- source_word: גְּבוּרָתֶךָ
  choice: तेरे पराक्रम
  rationale: גְּבוּרָה सामर्थ्य, वीर्य या प्रकट शक्तिशाली कार्य का बोध कराता है। ‘पराक्रम’ पहले प्रयुक्त עֹז के लिए ‘सामर्थ्य’ से काव्यात्मक भेद बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल में चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम सीधे आया है। ‘याहवे’ उसे उपाधि ‘प्रभु’ से प्रतिस्थापित किए बिना प्रस्तुत करता है; ‘यहोवा’ हिंदी परंपरा में परिचित विकल्प है, पर स्रोत-उच्चारण के पुनर्निर्माण से कम निकट है।
- issue: רומה में उठने और महिमान्वित होने की अर्थ-छाया
  choice: ऊँचा उठ
  alternative: महिमान्वित हो / उठ खड़ा हो
  rationale: मूल क्रिया स्थानगत ऊँचाई और प्रतिष्ठा या महिमा—दोनों का संकेत दे सकती है। मुख्य पाठ और टिप्पणी इस तनाव को किसी एक धर्मवैज्ञानिक अर्थ तक सीमित नहीं करते।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और गेय हिंदी अपनाई गई है। संबोधन में निकटता और इब्रानी के एकवचन रूपों को बनाए रखने के लिए ‘अपनी/तेरे’ का प्रयोग किया गया है। ‘सामर्थ्य’ और ‘पराक्रम’ मूल के दो संबंधित किंतु अलग शब्दों का काव्यात्मक अंतर सुरक्षित रखते हैं।
