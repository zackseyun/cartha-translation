  text: כִּֽי תְשִׁיתֵ֣/הוּ בְרָכ֣וֹת לָ/עַ֑ד תְּחַדֵּ֥/הוּ בְ֝/שִׂמְחָ֗ה אֶת פָּנֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/021/006.yaml
  text: For you make him blessings forever[b][a]; you gladden him with joy in your presence.
translation:
  language: hi
  text: क्योंकि तू उसे सदा के लिए आशीषें देता है[b][a]; अपने सान्निध्य के आनंद से तू उसे हर्षित करता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तू उस पर सदा के लिए आशीषें रखता है,” अथवा “तू उसे सदा के लिए आशीषों का स्वरूप बना देता है।” इब्रानी अभिव्यक्ति संक्षिप्त है और उससे राजा को मिली आशीषें या राजा का स्वयं दूसरों के लिए आशीष बनना—दोनों अर्थ निकल सकते हैं।
    reason: alternative_reading
  - marker: b
    text: शाब्दिक रूप में, “तू उसे सदा के लिए आशीषें बना देता है।”
    reason: literal_rendering
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण या आधार प्रस्तुत करता है; हिंदी में ‘क्योंकि’ इसके कारणसूचक बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: תְשִׁיתֵהוּ
  choice: तू उसे ... भर देता है
  rationale: שׁית का मूल अर्थ ‘रखना/स्थापित करना/बनाना’ है। ‘आशीषों’ के साथ हिंदी में ‘आशीषों से भर देता है’ सुबोध है, जबकि शाब्दिक ‘उसे आशीषें बना देता है’ अस्वाभाविक होगा।
- source_word: בְרָכוֹת
  choice: आशीषों
  rationale: बहुवचन रूप को बनाए रखा गया है। यह राजा को मिली भरपूर आशीषों का संकेत देता है, किंतु इब्रानी वाक्यांश में उसके स्वयं आशीष का रूप या स्रोत बनने की संभावना भी है; इसे पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: לָעַד
  choice: सदा के लिए
  rationale: स्थायी और निरंतर अवधि के अर्थ को आधुनिक हिंदी में स्वाभाविक ढंग से व्यक्त करता है।
- source_word: תְּחַדֵּהוּ
  choice: तू उसे हर्षित करता है
  rationale: חדה के पिएल रूप का कारणवाचक भाव है—किसी को आनंदित या हर्षित करना।
- source_word: בְשִׂמְחָה
  choice: आनंद से
  rationale: यह आनंद को हर्षित करने के साधन या संगति के रूप में व्यक्त करता है।
- source_word: אֶת־פָּנֶיךָ
  choice: अपने सान्निध्य के
  rationale: ‘तेरे मुख’ का इब्रानी मुहावरा परमेश्वर की प्रत्यक्ष उपस्थिति या सान्निध्य को दर्शाता है; ‘सान्निध्य’ हिंदी में इसका गरिमापूर्ण और स्पष्ट समतुल्य है।
theological_decisions:
- issue: תְשִׁיתֵהוּ בְרָכוֹת का अर्थ
  choice: मुख्य पाठ में राजा को सदा भरपूर आशीषें मिलने का भाव व्यक्त किया गया है, साथ ही बहुवचन ‘आशीषों’ को रखा गया है।
  alternative: ‘तू उसे सदा के लिए आशीष का रूप बना देता है’ या ‘तू उस पर सदा के लिए आशीषें रखता है।’
  rationale: इब्रानी अभिव्यक्ति संक्षिप्त और असामान्य है। वह राजा पर रखी गई आशीषों और राजा के स्वयं आशीष का मूर्त रूप या स्रोत बनने—दोनों की ओर संकेत कर सकती है। मुख्य पाठ को सुबोध रखते हुए पादटिप्पणी इस धार्मिक और भाषिक तनाव को खुला रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। परमेश्वर के लिए एकवचन आत्मीय संबोधन ‘तू’ भजन-साहित्य की सीधी प्रार्थनात्मक शैली के अनुरूप है। ‘सान्निध्य’ थोड़ा साहित्यिक किंतु प्रचलित धार्मिक शब्द है और ‘तेरे मुख’ के इब्रानी मुहावरे को स्पष्ट करता है।
