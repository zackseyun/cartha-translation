  text: כִּֽי הַ֭/מֶּלֶךְ בֹּטֵ֣חַ בַּ/יהוָ֑ה וּ/בְ/חֶ֥סֶד עֶ֝לְי֗וֹן בַּל יִמּֽוֹט־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/021/007.yaml
  text: For the king trusts in Yahweh[b][a], and through the steadfast love of the Most High he will not be shaken.
translation:
  language: hi
  text: क्योंकि राजा याहवे पर भरोसा रखता है, और परमप्रधान के अटल प्रेम के द्वारा[a] वह नहीं डगमगाएगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “परमप्रधान के अटल प्रेम में”; इब्रानी पूर्वसर्ग का अर्थ साधनवाचक या स्थानवाचक हो सकता है। “अटल प्रेम” का अनुवाद “वाचा की निष्ठा” भी किया जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “वह हिलेगा नहीं” अथवा “वह लड़खड़ाएगा नहीं।”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन का आधार या कारण बताता है; हिन्दी में ‘क्योंकि’ इस संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הַמֶּלֶךְ
  choice: राजा
  rationale: निश्चित संज्ञा भजन के राजकीय पात्र को सूचित करती है; हिन्दी में प्रसंग के कारण बिना ‘वह’ जोड़े ‘राजा’ पर्याप्त और स्वाभाविक है।
- source_word: בֹּטֵחַ
  choice: भरोसा रखता है
  rationale: कालवाचक कृदन्त निरंतर या चारित्रिक भरोसे को व्यक्त करता है; यह प्रयोग आधुनिक हिन्दी में सहज है।
- source_word: בַּיהוָה
  choice: यहवे पर
  rationale: पूर्वसर्ग भरोसे के लक्ष्य को दर्शाता है और יהוה को उसके व्यक्तिगत वाचा-नाम ‘यहवे’ से प्रस्तुत किया गया है।
- source_word: וּבְחֶסֶד
  choice: और ... के अटल प्रेम के द्वारा
  rationale: חֶסֶד निष्ठावान, स्थायी और वाचागत प्रेम को सूचित करता है; בְ को यहाँ साधनवाचक समझना अगले खंड से अच्छी तरह जुड़ता है, जबकि वैकल्पिक स्थानवाचक अर्थ पादटिप्पणी में रखा गया है।
- source_word: עֶלְיוֹן
  choice: परमप्रधान
  rationale: यह परमेश्वर की उपाधि के रूप में प्रयुक्त है; ‘परमप्रधान’ प्रचलित, संक्षिप्त और गरिमापूर्ण हिन्दी रूप है।
- source_word: בַּל יִמּוֹט
  choice: वह कभी नहीं डगमगाएगा
  rationale: काव्यात्मक निषेध और מוט की अस्थिर होने की छवि को सहज हिन्दी में व्यक्त करता है; ‘कभी’ निषेध की दृढ़ता को मुहावरेदार ढंग से सामने लाता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम सीधे आया है; ‘यहवे’ उसका व्यापक रूप से स्वीकृत लिप्यंतरण है और उसे केवल उपाधि में नहीं बदलता।
- issue: בְחֶסֶד में पूर्वसर्ग का संबंध
  choice: परमप्रधान के अटल प्रेम के द्वारा
  alternative: परमप्रधान के अटल प्रेम में
  rationale: साधनवाचक अर्थ राजा की स्थिरता को परमप्रधान के अटल प्रेम का परिणाम बताता है; फिर भी इब्रानी स्थानवाचक या क्षेत्रवाचक समझ की अनुमति देता है, इसलिए विकल्प पादटिप्पणी में सुरक्षित है।
- issue: חֶסֶד का अर्थ-क्षेत्र
  choice: अटल प्रेम
  alternative: वाचा की निष्ठा; करुणा
  rationale: ‘अटल प्रेम’ प्रेम और स्थायी निष्ठा दोनों को सामान्य पाठक के लिए स्पष्ट रखता है, बिना ‘वाचा’ को वहाँ स्पष्ट रूप से जोड़ने के जहाँ वह संज्ञा मूल में नहीं है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण काव्यात्मक शैली। वाक्य ने इब्रानी के कारणसूचक संबंध, राजा के निरंतर भरोसे और स्थिरता की रूपकात्मक छवि को बनाए रखा है।
