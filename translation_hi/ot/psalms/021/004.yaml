  - marker: b
    text: “युगानुयुग तक” को राजा के चिरस्थायी जीवन और शासन के लिए राजकीय अतिशयोक्ति माना जा सकता है, या ऐसी भाषा के रूप में पढ़ा जा सकता है जो मसीह में अधिक पूर्ण रीति से सिद्ध होती है।
