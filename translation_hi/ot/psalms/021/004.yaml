lexical_decisions:
- source_word: חַיִּים
  choice: जीवन
  rationale: बहुवचन रूप होने पर भी यह संज्ञा यहाँ भाववाचक एकवचन अर्थ ‘जीवन’ में प्रयुक्त है; अगले पदांश में उसकी अवधि स्पष्ट की गई है।
- source_word: שָׁאַל מִמְּךָ
  choice: आपसे ... माँगा
  rationale: שׁאל माँगने या निवेदन करने को और מן स्रोत को व्यक्त करता है; आधुनिक हिन्दी में ‘आपसे जीवन माँगा’ स्वाभाविक है।
- source_word: נָתַתָּה לּוֹ
  choice: आपने उसे दे दिया
  rationale: पूर्ण क्रिया को काव्यात्मक कथन में सामान्य भूतकाल से व्यक्त किया गया है; ‘जीवन’ कर्म पिछले पदांश से स्वतः समझ में आता है।
- source_word: אֹרֶךְ יָמִים
  choice: दीर्घायु
  rationale: शाब्दिक अर्थ ‘दिनों की लम्बाई’ है और मुहावरे का आशय लम्बा जीवन है; ‘दीर्घायु’ हिन्दी में संक्षिप्त, गरिमापूर्ण और स्वाभाविक है।
- source_word: עוֹלָם וָעֶד
  choice: युगानुयुग तक
  rationale: यह संयुक्त अभिव्यक्ति असीम और प्रबल अवधि दर्शाती है; ‘युगानुयुग तक’ उसके काव्यात्मक और अतिशयकारी बल को बनाए रखता है।
theological_decisions:
- issue: राजकीय भजन में राजा के जीवन की अवधि
  choice: मुख्य पाठ में अवधि को सीधे ‘युगानुयुग तक’ रखा गया है।
  alternative: इसे अत्यन्त लम्बे जीवन और शासन के लिए राजकीय अतिशयोक्ति मानना, अथवा मसीह में इसकी पूर्णतर सिद्धि देखना।
  rationale: इब्रानी पाठ असीम अवधि की भाषा बोलता है। अनुवाद यह निर्णय नहीं करता कि वह केवल राजकीय अतिशयोक्ति है या मसीही पूर्णता की ओर संकेत; इस तनाव को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; परमेश्वर के लिए आदरसूचक ‘आप’ और राजा के लिए ‘वह/उसे’। शैली काव्यात्मक किंतु सामान्य पाठक के लिए सहज रखी गई है।
