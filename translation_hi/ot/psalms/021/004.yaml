  text: He asked life from you[b][a]; you gave it to him—length of days forever and ever.
translation:
  language: hi
  text: उसने आपसे जीवन माँगा; आपने उसे युगानुयुग तक का दीर्घ जीवन दिया।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: “दिनों की लम्बाई।”'
