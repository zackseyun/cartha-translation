translation:
  language: hi
  text: 'आपने उसके मन की इच्छा पूरी की,

    और उसके होंठों की विनती को अस्वीकार नहीं किया।


    सेला[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘सेला’ का ठीक अर्थ या कार्य निश्चित नहीं है; सम्भवतः यह संगीत अथवा उपासना में ठहराव का संकेत था।
    reason: cultural_note
lexical_decisions:
- source_word: תַּאֲוַת לִבּוֹ
  choice: उसके मन की इच्छा
  rationale: यह पदबंध भीतर की अभिलाषा को व्यक्त करता है। आधुनिक हिन्दी में ‘मन की इच्छा’ स्वाभाविक है और इब्रानी ‘हृदय’ के भाव-केंद्र वाले अर्थ को स्पष्ट रूप से पहुँचाता है।
- source_word: נָתַתָּה לּוֹ
  choice: आपने ... पूरी की
  rationale: शाब्दिक अर्थ ‘आपने उसे दी’ है, पर इच्छा के साथ हिन्दी में ‘इच्छा पूरी करना’ अधिक स्वाभाविक है और अर्थ को बनाए रखता है।
- source_word: וַאֲרֶשֶׁת
  choice: विनती
  rationale: यह दुर्लभ संज्ञा संभवतः मुख से व्यक्त अनुरोध या याचना को दर्शाती है; ‘विनती’ काव्यात्मक गरिमा और समानांतर पंक्ति दोनों के अनुकूल है।
- source_word: שְׂפָתָיו
  choice: उसके होंठों की
  rationale: इब्रानी के ‘उसके होंठों’ वाले ठोस काव्य-बिंब को सुरक्षित रखा गया है।
- source_word: בַּל מָנַעְתָּ
  choice: नहीं रोका
  rationale: क्रिया का अर्थ रोक रखना या वंचित करना है। विनती के संदर्भ में ‘नहीं रोका’ सहज हिन्दी है और मूल निषेध को सीधे व्यक्त करता है।
- source_word: סֶלָה
  choice: सेला
  rationale: इस शब्द का ठीक अर्थ और कार्य अनिश्चित है, इसलिए अनुमानित अनुवाद के बजाय लिप्यंतरण रखा गया है।
