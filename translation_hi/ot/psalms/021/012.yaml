base_translation:
  language: en
  yaml_path: translation/ot/psalms/021/012.yaml
  text: For you will make them turn their back[c][b][a]; with your bowstrings you will aim at their faces.
translation:
  language: hi
  text: क्योंकि तू उन्हें पीठ फेरने पर विवश करेगा[a]; तू अपने धनुष की डोरियों से उनके चेहरों पर निशाना साधेगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “तू उन्हें कंधा ठहराएगा।” इब्रानी मुहावरे का आशय शायद उन्हें पीठ फेरकर भागने पर विवश करना या उनके कंधे/पीठ को लक्ष्य के रूप में सामने करना है।
    reason: lexical_alternative
  - marker: b
    text: या, “तू अपनी डोरियों से उनके चेहरों के विरुद्ध तैयार करेगा।” इब्रानी अभिव्यक्ति संक्षिप्त है; यहाँ धनुष अथवा तीर को तैयार करना निहित हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पद पिछले कथन का आधार बताता है; इसलिए कारणसूचक ‘क्योंकि’ स्वाभाविक है।
- source_word: תְּשִׁיתֵמוֹ שֶׁכֶם
  choice: तू उन्हें पीठ फेरने पर विवश करेगा
  rationale: शाब्दिक चित्र ‘उन्हें कंधा ठहराना’ है, पर सैन्य प्रसंग में यह पीठ फेरने या पीछे हटने का मुहावरा जान पड़ता है। ‘विवश करेगा’ שׁית की कारक शक्ति को सहज हिन्दी में व्यक्त करता है।
- source_word: בְּמֵיתָרֶיךָ
  choice: अपने धनुष की डोरियों से
  rationale: מֵיתָר मूलतः रस्सी या डोरी है; युद्ध और निशाना साधने के प्रसंग में धनुष की डोरियाँ अभिप्रेत होने की प्रबल संभावना है। बहुवचन को बनाए रखा गया है।
- source_word: תְּכוֹנֵן
  choice: निशाना साधेगा
  rationale: כון के इस रूप का अर्थ तैयार करना या स्थिर करना हो सकता है; धनुष की डोरियों और लक्ष्य के संदर्भ में ‘निशाना साधना’ स्वाभाविक प्रसंगगत अर्थ है।
- source_word: עַל־פְּנֵיהֶם
  choice: उनके चेहरों पर
  rationale: פנים का सजीव शाब्दिक बिंब ‘चेहरे’ के रूप में रखा गया है, और עַל को लक्ष्यसूचक ‘पर’ से व्यक्त किया गया है।
theological_decisions:
- issue: पीठ फेरने और चेहरों पर निशाना साधने के बीच दिखाई देने वाला तनाव
  choice: दोनों उपवाक्यों को अर्धविराम से समानांतर रखा
  alternative: ‘जब तू उनके चेहरों पर निशाना साधेगा, तब वे पीठ फेरेंगे’ जैसा स्पष्ट कारण-काल संबंध
  rationale: इब्रानी पाठ संबंधसूचक अव्यय नहीं देता। कारण या समय का संबंध जोड़ना अर्थ को अनावश्यक रूप से निश्चित कर देता; इसलिए मूल की संक्षिप्त और तनावपूर्ण युद्ध-छवि सुरक्षित रखी गई।
translation_notes:
  register: आधुनिक, गरिमापूर्ण काव्यात्मक हिन्दी; भजन में परमेश्वर के लिए प्रयुक्त एकवचन निकट संबोधन के अनुरूप ‘तू’ रखा गया है। शाब्दिक ‘कंधा’ मुख्य पाठ में अस्पष्ट होता, इसलिए मुहावरे का संभावित अर्थ दिया गया और वास्तविक अनिश्चितता पादटिप्पणी में सुरक्षित रखी गई।
