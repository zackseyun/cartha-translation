  text: तेरा हाथ तेरे सभी शत्रुओं को ढूँढ़ लेगा[a]; तेरा दाहिना हाथ तुझसे घृणा करने वालों को ढूँढ़ लेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
