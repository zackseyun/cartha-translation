    reason: lexical_alternative
lexical_decisions:
- source_word: תִּמְצָא
  choice: ढूँढ़ निकालेगा
  rationale: מצא का मूल अर्थ ‘पाना/ढूँढ़ना’ है। युद्ध के इस संदर्भ में यह सफलतापूर्वक शत्रुओं तक पहुँचकर उन्हें पकड़ लेने का भाव रखता है। ‘ढूँढ़ निकालेगा’ हिब्रू बिंब और प्रसंगगत प्रभाव दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: יָדְךָ
  choice: तेरा हाथ
  rationale: ठोस शारीरिक बिंब को बनाए रखा गया है; यहाँ ‘हाथ’ राजा की प्रभावी सामर्थ्य और कार्य को दर्शाता है।
- source_word: לְכָל
  choice: सभी
  rationale: כל की समग्रता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אֹיְבֶיךָ
  choice: तेरे सभी शत्रुओं
  rationale: אויב का मानक अर्थ ‘शत्रु’ है और द्वितीय पुरुष एकवचन प्रत्यय को ‘तेरे’ द्वारा सुरक्षित रखा गया है।
- source_word: יְמִינְךָ
  choice: तेरा दाहिना हाथ
  rationale: हिब्रू समानांतरता और सामर्थ्य तथा विजय के पारंपरिक बिंब को ज्यों का त्यों रखा गया है।
- source_word: שֹׂנְאֶיךָ
  choice: तुझसे घृणा करनेवालों
  rationale: कृदन्त के क्रियात्मक भाव को बनाए रखता है और उसे केवल ‘शत्रु’ कहकर पहले पद के साथ मिला नहीं देता।
theological_decisions:
- issue: राजकीय भजन में दैवीय/राजकीय सामर्थ्य के लिए मानवरूपी भाषा
  choice: ‘हाथ’ और ‘दाहिना हाथ’ के ठोस बिंब बनाए रखे गए।
  alternative: तेरी शक्ति तेरे सभी शत्रुओं को जा पकड़ेगी।
  rationale: हिब्रू की शारीरिक बिंबात्मकता काव्यात्मक और धर्मवैचारिक रूप से महत्त्वपूर्ण है। इसे ‘शक्ति’ जैसे अमूर्त शब्द में बदलना समानांतरता और पद की प्रभावशीलता को घटा देता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज काव्यात्मक रूप। दूसरे पुरुष एकवचन के लिए ‘तेरा/तुझसे’ रखा गया है, जो राजा को सीधे संबोधन और भजन की निकटता को सुरक्षित रखता है।
