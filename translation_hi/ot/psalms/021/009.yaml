base_translation:
  language: en
  yaml_path: translation/ot/psalms/021/009.yaml
  text: You will make them like a fiery furnace at the time of your presence; Yahweh in his anger will swallow them up[a], and fire will consume them.
translation:
  language: hi
  text: तू उन्हें अपनी उपस्थिति के समय[a] धधकते भट्ठे के समान कर देगा; यहोवा अपने क्रोध में उन्हें निगल जाएगा, और आग उन्हें भस्म कर देगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जब तू प्रकट होगा”; शाब्दिक अर्थ, “तेरे मुख के समय।”
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּשִׁיתֵמוֹ
  choice: तू उन्हें ... कर देगा
  rationale: שׁית का मूल अर्थ ‘रखना/ठहराना’ है; विधेय उपमा के साथ यहाँ परिणामी अवस्था व्यक्त करने के लिए ‘कर देगा’ स्वाभाविक और सटीक है।
- source_word: כְּתַנּוּר אֵשׁ
  choice: धधकते भट्ठे के समान
  rationale: תנור भट्ठा या तंदूर हो सकता है; אֵשׁ के साथ विनाशकारी ताप की छवि है। ‘धधकता भट्ठा’ आधुनिक हिन्दी में सहज रूप से वही चित्र रखता है।
- source_word: לְעֵת פָּנֶיךָ
  choice: अपनी उपस्थिति के समय
  rationale: शाब्दिक रूप ‘तेरे मुख के समय’ है; פנים यहाँ उपस्थिति या प्रकट होने का संकेत देता है। मुख्य पाठ में ‘उपस्थिति’ रखा गया और वास्तविक विकल्प पादटिप्पणी में दिया गया है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत नाम יהוה को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से प्रस्तुत किया गया है, उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: בְּאַפּוֹ
  choice: अपने क्रोध में
  rationale: אַף का शाब्दिक अर्थ नाक है, पर यहाँ यह क्रोध का स्थापित इब्रानी मुहावरा है।
- source_word: יְבַלְּעֵם
  choice: उन्हें निगल जाएगा
  rationale: בלע की सजीव ‘निगलने’ वाली उपमा सुरक्षित रहती है और अगले अग्नि-संबंधी क्रियापद से अलग सुनाई देती है।
- source_word: וְתֹאכְלֵם אֵשׁ
  choice: आग उन्हें भस्म कर देगी
  rationale: אכל का शाब्दिक अर्थ ‘खाना’ है, पर आग के कर्ता होने पर ‘भस्म करना’ स्वाभाविक हिन्दी है और पूर्ण विनाश का भाव देता है।
theological_decisions:
- issue: ‘तेरे मुख के समय’ में मानवरूपी अभिव्यक्ति
  choice: अपनी उपस्थिति के समय
  alternative: जब तू प्रकट होगा
  rationale: यह अनुवाद ईश्वरीय उपस्थिति/अभिव्यक्ति का भाव रखता है, पर इसे किसी विशिष्ट पारिभाषिक अंत-कालीन घटना के रूप में सीमित नहीं करता।
- issue: दिव्य नाम का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: יהוה को उपाधि ‘प्रभु’ से बदलने के बजाय व्यक्तिगत नाम के रूप में रखा गया; ‘यहोवा’ हिन्दी पाठकों में स्थापित रूप है।
translation_notes:
  register: आधुनिक मानक हिन्दी, काव्यात्मक किन्तु सहज और गरिमापूर्ण। एकवचन निकट संबोधन ‘तू’ भजन के प्रत्यक्ष संबोधन को बनाए रखता है। पादटिप्पणी-चिह्न संबंधित वाक्यांश के बजाय पद के अंत में रखा गया है ताकि मुख्य पाठ का प्रवाह बना रहे।
