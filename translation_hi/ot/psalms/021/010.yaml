source:
  edition: WLC
  text: פִּ֭רְיָ/מוֹ מֵ/אֶ֣רֶץ תְּאַבֵּ֑ד וְ֝/זַרְעָ֗/ם מִ/בְּנֵ֥י אָדָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/021/010.yaml
  text: You will destroy their fruit from the earth[a], and their offspring from among the sons of man.
translation:
  language: hi
  text: तू उनके फल को पृथ्वी से, और उनकी सन्तान को मनुष्यों[a] के बीच से मिटा देगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शब्दशः: “मनुष्य की सन्तानों के बीच से”; अर्थात् “मानवजाति में से।”'
    reason: इब्रानी मुहावरे के शब्दशः रूप और उसके सामान्य, समावेशी अर्थ—दोनों को सुरक्षित रखना।
lexical_decisions:
- source_word: פִּרְיָמוֹ
  choice: उनके फल
  rationale: פְּרִי का मूल अर्थ ‘फल’ है। यहाँ यह वंश या सन्तान का रूपक हो सकता है, पर समानांतर पंक्ति में ‘सन्तान’ आने के कारण मुख्य पाठ में काव्यात्मक रूपक ‘फल’ बनाए रखा गया है।
- source_word: מֵאֶרֶץ
  choice: पृथ्वी पर से
  rationale: אֶרֶץ का अर्थ ‘पृथ्वी’ या ‘देश/भूमि’ हो सकता है। इस व्यापक न्याय-सन्दर्भ में ‘पृथ्वी’ उपयुक्त है और किसी एक भूभाग तक अर्थ को सीमित नहीं करता।
- source_word: תְּאַבֵּד
  choice: नष्ट कर देगा
  rationale: אבד के पिएल रूप का अर्थ ‘नष्ट करना’ या ‘मिटा देना’ है। ‘नष्ट कर देगा’ सीधे और स्वाभाविक ढंग से दूसरे पुरुष एकवचन को बनाए रखता है।
- source_word: וְזַרְעָם
  choice: उनकी सन्तान
  rationale: זֶרַע का शाब्दिक अर्थ ‘बीज’ और मनुष्यों के लिए ‘सन्तान/वंश’ है। यहाँ ‘सन्तान’ आधुनिक हिन्दी में स्पष्ट है और ‘फल’ के साथ समानांतर अर्थ देता है।
- source_word: מִבְּנֵי אָדָם
  choice: मनुष्यों के बीच से
  rationale: בְּנֵי אָדָם मनुष्यजाति के लिए प्रचलित इब्रानी अभिव्यक्ति है। हिन्दी में ‘मनुष्यों के बीच से’ स्वाभाविक और अर्थ-सटीक है; अधिक शब्दशः रूप पाद-टिप्पणी में दिया गया है।
theological_decisions:
- issue: בְּנֵי אָדָם में אָדָם का निरूपण
  choice: मनुष्यों के बीच से
  alternative: आदम की सन्तानों के बीच से; मानवजाति में से
  rationale: यह पदबंध सामान्य रूप से पूरी मानवजाति को सूचित करता है, केवल पुरुषों को नहीं। मुख्य पाठ में स्वाभाविक हिन्दी रखी गई है, जबकि इब्रानी का शब्दशः चित्र पाद-टिप्पणी में सुरक्षित है।
- issue: दूसरे पुरुष एकवचन ‘तू’ की पहचान
  choice: सर्वनाम को बिना व्याख्यात्मक नाम जोड़े रखा गया
  alternative: ‘हे परमेश्वर’ अथवा ‘हे राजा’ जोड़ना
  rationale: इब्रानी पद में कर्ता का नाम नहीं है। सन्दर्भगत पहचान को मुख्य पाठ में स्पष्ट करके वास्तविक अस्पष्टता को समाप्त नहीं किया गया।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी। ‘फल’ का काव्यात्मक रूपक रखा गया है; समानांतर पंक्ति में ‘सन्तान’ अर्थ स्पष्ट करती है। दूसरी पंक्ति में ‘मिटा देगा’ का प्रयोग अनावश्यक पुनरावृत्ति घटाता है, जबकि विनाश का समान बल बनाए रखता है।
