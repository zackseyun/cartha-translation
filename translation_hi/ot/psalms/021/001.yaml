source:
  edition: WLC
  text: יְֽהוָ֗ה בְּ/עָזְּ/ךָ֥ יִשְׂמַח מֶ֑לֶךְ וּ֝/בִ/ישׁ֥וּעָתְ/ךָ֗ מַה יגיל מְאֹֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/021/001.yaml
  text: O Yahweh[a], in your strength the king rejoices, and in your salvation how greatly he exults!
translation:
  language: hi
  text: हे याहवे, आपके सामर्थ्य से राजा आनन्दित होता है; और आपके उद्धार[a] से वह कितना अधिक हर्षित होता है!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्द का अर्थ सन्दर्भ के अनुसार “छुटकारा” या “विजय” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: हे यहवे
  rationale: प्रत्यक्ष सम्बोधन को ‘हे’ से और वाचा के नाम को प्रचलित हिन्दी लिप्यंतरण ‘यहवे’ से व्यक्त किया गया है।
- source_word: בְּעָזְּךָ
  choice: आपके सामर्थ्य में
  rationale: בְּ को यहाँ आनन्द के आधार/क्षेत्र के रूप में रखते हुए समानांतर पदबंध के निकट अनुवाद किया गया है; ‘सामर्थ्य’ עֹז की गरिमा और शक्ति दोनों दर्शाता है।
- source_word: יִשְׂמַח
  choice: आनन्दित होता है
  rationale: काव्य में yiqtol वर्तमान या सामान्य सत्य व्यक्त कर सकता है; सन्दर्भ किसी निश्चित भविष्यकाल की माँग नहीं करता।
- source_word: מֶלֶךְ
  choice: राजा
  rationale: इब्रानी में उपपद न होने पर भी सन्दर्भ एक विशिष्ट राजा की ओर संकेत करता है; हिन्दी में ‘राजा’ स्वाभाविक रूप से पर्याप्त है।
- source_word: וּבִישׁוּעָתְךָ
  choice: और आपके उद्धार पर
  rationale: יְשׁוּעָה का व्यापक अर्थ उद्धार, छुटकारा या विजय हो सकता है। ‘उद्धार’ इस व्यापकता और धर्मवैचारिक प्रतिध्वनि को बनाए रखता है; हिन्दी मुहावरे में आनन्द/हर्ष के साथ ‘पर’ अधिक स्वाभाविक है।
- source_word: מַה ... מְאֹד
  choice: कितना अधिक
  rationale: מַה यहाँ प्रश्नवाचक नहीं, विस्मयवाचक तीव्रक है और מְאֹד उसे बल देता है; ‘कितना अधिक’ दोनों का स्वाभाविक संयुक्त रूप है।
- source_word: יגיל
  choice: हर्षित होता है
  rationale: גיל प्रबल, उल्लसित आनन्द दर्शाता है। ‘हर्षित’ पहले खंड के ‘आनन्दित’ के साथ काव्यात्मक समानांतरता रखते हुए अनावश्यक पुनरुक्ति से बचाता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में वाचा का विशिष्ट नाम सीधे प्रयुक्त है। उसका लिप्यंतरण नाम और उपाधि के भेद को सुरक्षित रखता है; ‘यहवे’ आधुनिक विद्वत्तापूर्ण उच्चारण के निकट है।
- issue: יְשׁוּעָה का अर्थ-क्षेत्र
  choice: उद्धार
  alternative: छुटकारा / विजय
  rationale: राजकीय भजन में ‘विजय’ सम्भव है, पर ‘उद्धार’ मूल शब्द के व्यापक अर्थ को बिना केवल सैनिक सफलता तक सीमित किए सुरक्षित रखता है; विकल्प पादटिप्पणी में दिए गए हैं।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। ईश्वर के लिए आदरसूचक ‘आप’ रखा गया है। काव्यात्मक समानांतरता बनाए रखते हुए हिन्दी की स्वाभाविक विभक्तियाँ चुनी गई हैं।
