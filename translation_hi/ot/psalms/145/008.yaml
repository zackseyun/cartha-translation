source:
  edition: WLC
  text: חַנּ֣וּן וְ/רַח֣וּם יְהוָ֑ה אֶ֥רֶךְ אַ֝פַּ֗יִם וּ/גְדָל חָֽסֶד־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/145/008.yaml
  text: Yahweh is gracious and compassionate[a], slow to anger and great in steadfast love.
translation:
  language: hi
  text: याहवे कृपालु और करुणामय है; वह क्रोध करने में धीमा और अटल प्रेम में महान[a] है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अटल प्रेम से भरपूर।” इब्रानी अभिव्यक्ति अटल प्रेम की महानता या उसकी प्रचुरता—दोनों पर बल दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: חַנּוּן
  choice: कृपालु
  rationale: यह शब्द कृपा और अनुग्रह दिखाने वाले व्यक्ति का वर्णन करता है। ‘कृपालु’ आधुनिक हिन्दी में स्वाभाविक और गरिमापूर्ण है तथा अगले शब्द ‘करुणामय’ से अर्थगत भेद बनाए रखता है।
- source_word: רַחוּם
  choice: करुणामय
  rationale: यह गहरी करुणा और दया का भाव व्यक्त करता है। ‘करुणामय’ मूल विशेषण की प्रकृति और ‘कृपालु’ से उसका सूक्ष्म भेद सुरक्षित रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी व्यंजनात्मक नाम יהוה को किसी उपाधि से बदलने के बजाय हिन्दी में उसके प्रचलित विद्वत्तापूर्ण उच्चारण ‘याहवे’ के रूप में लिप्यंतरित किया गया है।
- source_word: אֶרֶךְ אַפַּיִם
  choice: क्रोध करने में धीमा
  rationale: शाब्दिक मुहावरा ‘नथुनों में लंबा’ उकसावे पर शीघ्र क्रोधित न होने का संकेत देता है। हिन्दी वाक्यांश मूल बिंब को कृत्रिम रूप से दोहराए बिना उसका आशय स्पष्ट करता है।
- source_word: גְדָל
  choice: महान
  rationale: यह חָסֶד की विशालता या प्रचुरता बताता है। ‘महान’ अपेक्षाकृत सीधा अनुवाद है; ‘भरपूर’ भी सम्भव है, इसलिए विकल्प पादटिप्पणी में दिया गया है।
- source_word: חָסֶד
  choice: अटल प्रेम
  rationale: यह शब्द टिकाऊ, निष्ठावान और कृपालु प्रेम को व्यक्त करता है। ‘अटल प्रेम’ संक्षेप में उसकी दृढ़ता और प्रेम—दोनों पहलुओं को सुरक्षित रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम है। ‘याहवे’ उसे उपाधि से प्रतिस्थापित नहीं करता और सामान्यतः स्वीकार किए गए विद्वत्तापूर्ण उच्चारण को देवनागरी में प्रस्तुत करता है।
- issue: חֶסֶד में प्रेम और निष्ठा का संबंध
  choice: अटल प्रेम
  alternative: करुणा; वाचा की निष्ठा
  rationale: केवल ‘करुणा’ प्रेम की टिकाऊ निष्ठा को कम कर सकती है, जबकि केवल ‘वाचा की निष्ठा’ प्रेम और कृपा के भाव को संकुचित कर सकती है। ‘अटल प्रेम’ दोनों को खुला रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, सरल किंतु गरिमापूर्ण रखी गई है। समानार्थी लग सकने वाले חַנּוּן और רַחוּם के लिए ‘कृपालु’ तथा ‘करुणामय’ चुनकर उनका सूक्ष्म भेद बनाए रखा गया है। काव्यात्मक समानांतरता को अर्धविराम से स्पष्ट किया गया है।
