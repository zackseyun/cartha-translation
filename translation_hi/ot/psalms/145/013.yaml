id: PSA.145.13
reference: Psalms 145:13
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: מַֽלְכוּתְ/ךָ֗ מַלְכ֥וּת כָּל עֹֽלָמִ֑ים וּ֝/מֶֽמְשֶׁלְתְּ/ךָ֗ בְּ/כָל דּ֥וֹר וָ/דֽוֹר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/145/013.yaml
  text: Your kingdom is a kingdom of all ages[b][a], and your dominion is through every generation.
translation:
  language: hi
  text: तेरा राज्य सब युगों का राज्य है[a], और हर पीढ़ी में तेरा प्रभुत्व है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तेरा राज्य सदा का राज्य है।” इब्रानी में शाब्दिक रूप से, “तेरा राज्य सब युगों का राज्य है।”
    reason: lexical_alternative
  - marker: b
    text: या, “पीढ़ी-दर-पीढ़ी।”
    reason: lexical_alternative
lexical_decisions:
- source_word: מַֽלְכוּתְךָ
  choice: तेरा राज्य
  rationale: מַלְכוּת राज्य, राजत्व या शासन को सूचित कर सकता है। यहाँ ‘राज्य’ स्वाभाविक है और समानांतर ‘प्रभुत्व’ के साथ परमेश्वर के राजकीय शासन का ठोस तथा भाववाचक—दोनों अर्थ बनाए रखता है।
- source_word: מַלְכוּת
  choice: राज्य है
  rationale: मूल में संज्ञा की पुनरावृत्ति—‘तेरा राज्य ... राज्य’—काव्यात्मक बल देती है; इसलिए इसे केवल ‘अनन्त है’ कहकर संक्षिप्त नहीं किया गया।
- source_word: כָּל עֹלָמִים
  choice: सब युगों का
  rationale: बहुवचन עֹלָמִים समस्त युगों में असीम अवधि व्यक्त करता है। ‘सब युगों का’ मूल रचना और उसके काव्यात्मक विस्तार को सुरक्षित रखता है।
- source_word: וּמֶמְשֶׁלְתְּךָ
  choice: और ... तेरा प्रभुत्व
  rationale: מֶמְשָׁלָה शासकीय अधिकार या प्रभुत्व को दर्शाता है। ‘प्रभुत्व’ गरिमापूर्ण और सहज है तथा ‘राज्य’ के समानांतर उपयुक्त बैठता है।
- source_word: בְּכָל דּוֹר וָדֹר
  choice: हर पीढ़ी में
  rationale: इस इब्रानी मुहावरे का शाब्दिक आशय ‘हर पीढ़ी और पीढ़ी में’ है। ‘हर पीढ़ी में’ लगातार आने वाली सभी पीढ़ियों में प्रभुत्व बने रहने का भाव स्वाभाविक हिंदी में व्यक्त करता है।
theological_decisions:
- issue: परमेश्वर के शासन की अवधि
  choice: ‘सब युगों’ और ‘हर पीढ़ी’ की मूल काव्यात्मक भाषा के द्वारा उसके सार्वकालिक शासन को व्यक्त किया गया है।
  alternative: तेरा राज्य सदा का राज्य है, और तेरा प्रभुत्व पीढ़ी-दर-पीढ़ी बना रहता है।
  rationale: इब्रानी पाठ परमेश्वर के राज्य और प्रभुत्व की असीम निरंतरता की पुष्टि करता है। चुना हुआ रूप बाद की धर्मवैज्ञानिक शब्दावली जोड़े बिना मूल की संज्ञात्मक पुनरावृत्ति और युग-व्यापी भाषा को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण काव्यात्मक शैली रखी गई है। परमेश्वर को सीधे संबोधित करने के लिए भजन-साहित्य में स्वाभाविक एकवचन ‘तेरा’ अपनाया गया है। दूसरे खंड की इब्रानी संज्ञात्मक संरचना को ‘हर पीढ़ी में तेरा प्रभुत्व है’ के रूप में रखा गया है, जिससे अनावश्यक रूप से ‘बना रहता है’ जैसा अतिरिक्त क्रियाभाव नहीं जुड़ता।
