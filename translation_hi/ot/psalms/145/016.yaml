base_translation:
  language: en
  yaml_path: translation/ot/psalms/145/016.yaml
  text: You open your hand and satisfy the desire of every living thing[a].
translation:
  language: hi
  text: तू अपना हाथ खोलता है और हर जीव की इच्छा पूरी करता है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हर जीव को कृपा प्रदान करके तृप्त करता है,” अथवा “हर जीव को प्रसन्नता प्रदान करके तृप्त करता है।” इब्रानी शब्द का अर्थ “इच्छा,” “कृपा,” या “प्रसन्नता” हो सकता है; यहाँ सभी जीवों के लिए परमेश्वर के प्रबन्ध के प्रसंग में “इच्छा” सबसे उपयुक्त प्रतीत होता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: פּוֹתֵחַ
  choice: खोलता है
  rationale: कालवाचक कृदन्त परमेश्वर की निरन्तर और सामान्य क्रिया का काव्यात्मक वर्णन करता है; हिन्दी का सामान्य वर्तमान काल इसे स्वाभाविक ढंग से व्यक्त करता है।
- source_word: יָדֶךָ
  choice: अपना हाथ
  rationale: मूल का ठोस मानवरूपी बिम्ब हिन्दी में स्पष्ट और स्वाभाविक है, इसलिए इसे भावार्थ में बदलने के बजाय सुरक्षित रखा गया है।
- source_word: וּמַשְׂבִּיעַ
  choice: पूरी करता है
  rationale: हिफ़ील रूप तृप्त करने अथवा भरपूर करने का कारणवाचक अर्थ देता है। ‘इच्छा पूरी करता है’ हिन्दी में स्वाभाविक है और רָצוֹן के साथ अर्थपूर्ण बैठता है।
- source_word: לְכָל חַי
  choice: हर जीव की
  rationale: विशेषण חַי यहाँ संज्ञा के रूप में सभी जीवित प्राणियों के लिए प्रयुक्त है; सम्बन्धसूचक ‘की’ हिन्दी में ‘इच्छा पूरी करना’ के साथ स्वाभाविक वाक्य-विन्यास देता है।
- source_word: רָצוֹן
  choice: इच्छा
  rationale: इस सन्दर्भ में यह जीवों की चाह या आवश्यकता को सूचित कर सकता है; फिर भी मूल शब्द में ‘कृपा’ अथवा ‘प्रसन्नता’ के अर्थ की सम्भावना बनी रहती है, जिसे पाद-टिप्पणी में रखा गया है।
theological_decisions:
- issue: परमेश्वर का मानवरूपी चित्रण
  choice: ‘अपना हाथ’ का मूल बिम्ब बनाए रखा गया है।
  alternative: तू उदारता से सबकी आवश्यकताएँ पूरी करता है।
  rationale: इब्रानी पाठ परमेश्वर की पोषणकारी देखभाल को हाथ खोलने के ठोस काव्यात्मक बिम्ब से व्यक्त करता है। इसे बनाए रखना पाठ की काव्य-शक्ति को सुरक्षित रखता है और परमेश्वर के शारीरिक स्वरूप के बारे में कोई अतिरिक्त धर्मवैज्ञानिक दावा नहीं जोड़ता।
- issue: רָצוֹן का अर्थ
  choice: इसे जीव की ‘इच्छा’ के रूप में लिया गया है।
  alternative: हर जीव को कृपा/प्रसन्नता से तृप्त करता है।
  rationale: आस-पास का प्रसंग सभी जीवों के लिए परमेश्वर के प्रबन्ध पर बल देता है, इसलिए ‘इच्छा’ उपयुक्त है; पर शब्द की वास्तविक अर्थगत बहुलता पाद-टिप्पणी में सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और काव्यात्मक शैली रखी गई है। भजन में परमेश्वर को एकवचन निकट सम्बोधन होने के कारण ‘तू’ प्रयुक्त हुआ है; ‘हर जीव’ सार्वभौमिक दायरे को संक्षेप और स्वाभाविक रूप से व्यक्त करता है।
