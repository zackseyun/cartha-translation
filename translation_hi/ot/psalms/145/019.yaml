review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately conveys the Hebrew sequence: God fulfills the desire of those characterized by fearing him, hears their cry for help, and saves them. However, the final expression ''उनका उद्धार करता है'' can preferentially suggest theological/spiritual salvation, whereas the Hebrew Hiphil of ישע here broadly denotes rescue or deliverance. ''उन्हें बचाता है'' better preserves that breadth.'
  naturalness: '''अपने डरवैयों'' is not idiomatic modern standard Hindi and has a colloquial or regional feel. The explicit relative expression ''जो उसका भय मानते हैं'' is clear, natural, and retains the Hebrew fear terminology without softening it.'
  terminology: Use 'उसका भय मानते हैं' for יראיו, preserving the key theological term naturally. Use 'बचाता है' for ויושיעם to retain the broad rescue sense and avoid importing a narrower doctrinal sense through 'उद्धार'.
  issues:
  - severity: medium
    issue: ‘अपने डरवैयों’ is unsuitable for modern standard Hindi.
    rationale: The word is nonstandard/colloquial in this register and is less clear than an idiomatic relative clause.
  - severity: medium
    issue: ‘उनका उद्धार करता है’ is overly specialized in this immediate context.
    rationale: Although it can mean saving, modern Hindi often hears ‘उद्धार’ in a specifically spiritual or soteriological sense. The Hebrew permits broad deliverance from distress.
  revised_text: वह उन लोगों की इच्छा पूरी करता है जो उसका भय मानते हैं; वह उनकी सहायता की पुकार सुनता है और उन्हें बचाता है।
