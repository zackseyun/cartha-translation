  yaml_path: translation/ot/psalms/145/019.yaml
  text: He fulfills the desire of those who fear him[b][a]; he hears their cry for help and saves them.
translation:
  language: hi
  text: वह उन लोगों की इच्छा पूरी करता है जो उसका भय मानते हैं; वह उनकी सहायता की पुकार सुनता है और उन्हें बचाता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רְצוֹן
  choice: इच्छा
  rationale: यहाँ शब्द परमेश्वर से डरने वालों की अभिलाषा को दर्शाता है; ‘इच्छा’ आधुनिक हिन्दी में स्वाभाविक और अर्थानुकूल है।
- source_word: יְרֵאָיו
  choice: अपने डरवैयों
  rationale: यह पद परमेश्वर का भय मानने वाले लोगों को दर्शाता है। ‘डरवैये’ संक्षिप्त रूप में मूल के भय-संबंधी शब्द को बनाए रखता है।
- source_word: יַעֲשֶׂה
  choice: पूरी करता है
  rationale: क्रिया का मूल अर्थ ‘करना’ है, पर ‘इच्छा’ के साथ हिन्दी में ‘पूरी करता है’ प्रसंग का स्वाभाविक अर्थ देता है।
- source_word: שַׁוְעָתָם
  choice: उनकी सहायता की पुकार
  rationale: यह संकट में बचाव के लिए की गई पुकार है; यह रूप निहित सहायता-याचना को स्पष्ट करता है।
- source_word: יִשְׁמַע
  choice: सुनता है
  rationale: यह मूल क्रिया ‘सुनना’ का सीधा और स्वाभाविक हिन्दी रूप है; उत्तर देने का भाव प्रसंग से प्रकट होता है।
- source_word: וְיוֹשִׁיעֵם
  choice: और उनका उद्धार करता है
  rationale: हिफ़ील रूप बचाने या छुड़ाने को व्यक्त करता है। ‘उद्धार करता है’ व्यापक अर्थ रखता है और संकट से बचाने के प्रसंग में उपयुक्त है।
theological_decisions:
- issue: विश्वासयोग्य लोगों के लिए ירא (‘भय’) की भाषा
  choice: अपने डरवैयों
  alternative: जो उसका भय मानते हैं
  rationale: मूल पाठ की भय-संबंधी भाषा को ‘श्रद्धा रखने वालों’ जैसे नरम रूप से बदलने के बजाय बनाए रखा गया है।
- issue: יושיעם में परमेश्वर के प्रत्युत्तर का दायरा
  choice: उनका उद्धार करता है
  alternative: उन्हें बचाता है / उन्हें छुड़ाता है
  rationale: मूल क्रिया व्यापक रूप से बचाने या छुड़ाने का अर्थ देती है। ‘उद्धार’ धर्मवैज्ञानिक प्रतिध्वनि बनाए रखता है, पर पद के तत्काल संकट-मोचन अर्थ को सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का संक्षिप्त, काव्यात्मक और गरिमापूर्ण रूप। समानांतर पद-रचना तथा मूल के ‘भय’ और ‘सुनने’ के शब्दार्थ सुरक्षित रखे गए हैं।
