lexical_decisions:
- source_word: הֲדַר כְּבוֹד הוֹדֶךָ
  choice: तेरे प्रताप के महिमामय वैभव
  rationale: तीन परस्पर जुड़े शब्द वैभव, महिमा और राजसी प्रताप का सघन वर्णन करते हैं। यह रूप उनकी तीव्रता और राजसी भाव बनाए रखते हुए स्वाभाविक हिन्दी देता है।
- source_word: וְדִבְרֵי נִפְלְאוֹתֶיךָ
  choice: और तेरे अद्भुत कामों पर
  rationale: דִבְרֵי का अर्थ ‘बातें/विषय’ भी हो सकता है, पर इस पदबंध में वह परमेश्वर के अद्भुत कार्यों को विचार या कथन का विषय बनाता है। हिन्दी में ‘कामों पर’ इस संबंध को संक्षेप और स्वाभाविक रूप से व्यक्त करता है।
- source_word: אָשִׂיחָה
  choice: मनन करूँगा
  rationale: שׂיח के अर्थ-क्षेत्र में मनन करना, मन में विचारना और बोलना शामिल हैं। प्रसंग में विषयों ‘पर’ ध्यान केंद्रित करने के कारण ‘मनन करूँगा’ मुख्य पाठ में उपयुक्त है; बोलने का भाव पादटिप्पणी में सुरक्षित है।
