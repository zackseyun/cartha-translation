lexical_decisions:
- source_word: עֵינֵי כֹל
  choice: सबकी आँखें
  rationale: यह इब्रानी के सजीव चित्र को बनाए रखता है और ‘सब’ का दायरा स्पष्ट किए बिना व्यापक रहने देता है।
- source_word: אֵלֶיךָ יְשַׂבֵּרוּ
  choice: आशा से तेरी ओर लगी रहती हैं
  rationale: यह अभिव्यक्ति आँखों के दृश्य बिंब और क्रिया में निहित आशापूर्ण प्रतीक्षा—दोनों को स्वाभाविक हिन्दी में व्यक्त करती है।
- source_word: וְאַתָּה
  choice: और तू
  rationale: साधारण संयोजक वाव को विरोधसूचक बनाए बिना समानांतर कथन के रूप में रखा गया है।
- source_word: נֹתֵן
  choice: देता है
  rationale: इब्रानी कृदंत परमेश्वर के नियमित और निरंतर कार्य को दर्शाता है; हिन्दी का सामान्य वर्तमानकाल इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: אָכְלָם
  choice: उनका भोजन
  rationale: यह शब्द सामान्य रूप से आहार को दर्शाता है, केवल रोटी को नहीं।
- source_word: בְּעִתּוֹ
  choice: ठीक समय पर
  rationale: यह इब्रानी के समय-सूचक वाक्यांश को सहज हिन्दी में व्यक्त करता है और नियत अथवा उपयुक्त समय का भाव बनाए रखता है।
theological_decisions:
- issue: परमेश्वर से भोजन पाने वाले ‘सब’ का दायरा
  choice: ‘सबकी’ कहकर दायरा व्यापक और अनिर्दिष्ट रखा गया है।
  alternative: सब मनुष्यों की; सब जीवधारियों की
  rationale: इब्रानी पद स्वयं ‘सब’ के संदर्भ को स्पष्ट नहीं करता। आसपास का प्रसंग व्यापक सृष्टि की ओर संकेत करता है, पर पद में निहित अस्पष्टता को अनावश्यक रूप से सीमित या विस्तृत नहीं किया गया।
