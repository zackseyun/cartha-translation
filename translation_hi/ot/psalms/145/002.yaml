id: PSA.145.2
reference: Psalms 145:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: בְּ/כָל י֥וֹם אֲבָרֲכֶ֑/ךָּ וַ/אֲהַלְלָ֥ה שִׁ֝מְ/ךָ֗ לְ/עוֹלָ֥ם וָ/עֶֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/145/002.yaml
  text: Every day I will bless you[b][a], and I will praise your name forever and ever.
translation:
  language: hi
  text: 'मैं हर दिन[a] तुझे धन्य कहूँगा,

    और तेरे नाम[b] की स्तुति सदा-सर्वदा करूँगा।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘प्रत्येक दिन’ अथवा ‘दिन-प्रतिदिन’।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में ‘तेरा नाम’; बाइबल में यह परमेश्वर के प्रकट चरित्र और प्रतिष्ठा को व्यक्त करने का एक ढंग है।
    reason: cultural_note
lexical_decisions:
- source_word: בְּ/כָל יוֹם
  choice: हर दिन
  rationale: इस पदबंध का शाब्दिक रूप ‘प्रत्येक दिन में’ है और इसका आशय नित्य दोहराए जाने वाले कार्य से है। ‘हर दिन’ आधुनिक हिन्दी में स्वाभाविक और सटीक है।
- source_word: אֲבָרֲכֶךָּ
  choice: तुझे धन्य कहूँगा
  rationale: ברך के पिएल रूप का सामान्य अर्थ ‘आशीष देना/धन्य कहना’ है। परमेश्वर को सम्बोधित करते हुए ‘तुझे धन्य कहूँगा’ हिन्दी में अर्थ को स्वाभाविक ढंग से व्यक्त करता है और इसे केवल ‘स्तुति’ में विलीन नहीं करता।
- source_word: וַאֲהַלְלָה
  choice: और ... स्तुति ... करूँगा
  rationale: הלל के पिएल रूप का अर्थ ‘स्तुति करना’ है। यह पहले खंड के समानांतर भविष्यकालीन अथवा संकल्पसूचक भाव रखता है।
- source_word: שִׁמְךָ
  choice: तेरे नाम
  rationale: मूल में स्पष्टतः ‘तेरा नाम’ है। ‘नाम’ परमेश्वर के प्रकट चरित्र और प्रतिष्ठा का भी द्योतक है, इसलिए मूर्त अभिव्यक्ति को बनाए रखा गया है।
- source_word: לְעוֹלָם וָעֶד
  choice: सदा-सर्वदा
  rationale: यह युग्म अनन्त अवधि पर बल देता है। ‘सदा-सर्वदा’ हिन्दी की स्वाभाविक, गरिमापूर्ण और बलयुक्त समतुल्य अभिव्यक्ति है।
theological_decisions:
- issue: किसी ईश्वरीय उपाधि को जोड़े बिना परमेश्वर को सीधा सम्बोधन
  choice: तुझे
  alternative: हे परमेश्वर, तुझे; हे मेरे परमेश्वर और राजा, तुझे
  rationale: इब्रानी प्रत्यय परमेश्वर को सीधे सम्बोधित करता है, पर इस पद में कोई उपाधि दोहराई नहीं गई। इसलिए पिछले पद की भाषा को यहाँ नहीं जोड़ा गया।
- issue: ‘नाम’ सम्बन्धी भाषा
  choice: तेरे नाम
  alternative: तेरी; तेरी कीर्ति
  rationale: पद परमेश्वर के ‘नाम’ की स्तुति की बात करता है। इसे बनाए रखने से मूल की समृद्ध बाइबलीय अभिव्यक्ति सुरक्षित रहती है और उसका अर्थ केवल सर्वनाम या ‘कीर्ति’ तक सीमित नहीं होता।
translation_notes:
  register: भाषा आधुनिक, सहज और भक्तिपूर्ण है। परमेश्वर के लिए एकवचन निकट सम्बोधन ‘तू/तेरा’ की परम्परा रखते हुए यहाँ ‘तुझे’ और ‘तेरे’ प्रयुक्त हुए हैं। काव्यात्मक समानता तथा दोनों क्रियाओं का संकल्पसूचक भविष्य भाव बनाए रखा गया है।
