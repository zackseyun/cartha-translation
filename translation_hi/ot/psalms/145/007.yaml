  text: זֵ֣כֶר רַב טוּבְ/ךָ֣ יַבִּ֑יעוּ וְ/צִדְקָתְ/ךָ֥ יְרַנֵּֽנוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/145/007.yaml
  text: They will pour forth the memory of your abundant goodness[b][a], and they will sing for joy of your righteousness.
translation:
  language: hi
  text: वे तेरी अपार भलाई का भरपूर उल्लेख करेंगे[a], और तेरी धार्मिकता[b] का हर्ष से गाएँगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वे तेरी महान भलाई का स्मरण उंडेलेंगे।”
    reason: इब्रानी क्रिया और पदबंध के अधिक शब्दानुरूप, रूपकपूर्ण अनुवाद को सुरक्षित रखना।
  - marker: b
    text: या, “तेरे न्याय का।”
    reason: צדקה के वैध वैकल्पिक अर्थ को सुरक्षित रखना।
lexical_decisions:
- source_word: זֵכֶר
  choice: स्मरण
  rationale: यह संज्ञा याद किए जाने और वाणी में उसका उल्लेख किए जाने—दोनों भावों को समेटती है; ‘स्मरण’ हिन्दी में इस द्विअर्थी विस्तार को बनाए रखता है।
- source_word: רַב
  choice: अपार
  rationale: यह भलाई की मात्रा और व्यापकता को व्यक्त करता है तथा हिन्दी में ‘अपार भलाई’ स्वाभाविक और गरिमापूर्ण है।
- source_word: טוּבְךָ
  choice: तेरी भलाई
  rationale: यह परमेश्वर के भले स्वभाव और उससे प्रकट होने वाली उदार कृपा—दोनों को व्यक्त करने वाला व्यापक पद है।
- source_word: יַבִּיעוּ
  choice: उमड़ते हुए शब्दों में करेंगे
  rationale: क्रिया के फूट निकलने या उमड़कर बहने वाले जीवंत बिंब को स्वाभाविक हिन्दी में सुरक्षित रखता है; सपाट ‘कहेंगे’ से अधिक अभिव्यंजक है।
- source_word: וְצִדְקָתְךָ
  choice: और तेरी धार्मिकता
  rationale: צדקה के नैतिक रूप से सही चरित्र और कार्यों के व्यापक भाव को रखता है; वैध संकुचित अर्थ ‘न्याय’ को पादटिप्पणी में दिया गया है।
- source_word: יְרַנֵּנוּ
  choice: हर्ष से गान करेंगे
  rationale: यह आनंदपूर्ण ऊँचे स्वर या गीत का भाव व्यक्त करता है और भजन की स्तुतिपरक समानांतरता में सहज बैठता है।
theological_decisions:
- issue: स्तुति के प्रसंग में צדקה का अनुवाद
  choice: तेरी धार्मिकता
  alternative: तेरा न्याय
  rationale: इब्रानी शब्द धार्मिकता और न्याय दोनों को समेट सकता है। मुख्य पाठ में व्यापक नैतिक अर्थ रखा गया है, जबकि न्यायिक अर्थ को बिना दबाए पादटिप्पणी में सुरक्षित किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संबोधन में भजन-साहित्य के अनुरूप आत्मीय ‘तेरी’; भाषा गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। ‘उमड़ते हुए शब्दों में’ मूल के प्रवाहमान वाणी-बिंब को स्वाभाविक हिन्दी में व्यक्त करता है।
