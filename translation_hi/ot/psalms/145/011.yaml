  yaml_path: translation/ot/psalms/145/011.yaml
  text: They will speak of the glory of your kingdom[b][a], and talk of your might.
translation:
  language: hi
  text: वे तेरे राज्य[a] की महिमा कहेंगे, और तेरे पराक्रम[b] की चर्चा करेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तेरे शासन” अथवा “तेरे राजत्व”।
    reason: lexical_alternative
  - marker: b
    text: या “तेरी सामर्थ्य” अथवा “तेरी शक्ति”।
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּבוֹד
  choice: महिमा
  rationale: כָּבוֹד का अर्थ महिमा, सम्मान या वैभव हो सकता है। स्तुति और राजकीय संदर्भ में “महिमा” स्वाभाविक है और परमेश्वर के गौरव का भाव बनाए रखता है।
- source_word: מַלְכוּתְךָ
  choice: तेरे राज्य
  rationale: מַלְכוּת राज्य, शासन या राजत्व को सूचित कर सकता है। “तेरे राज्य” हिन्दी में स्वाभाविक और पारंपरिक है, जबकि पादटिप्पणी शासन और राजत्व की वास्तविक अर्थ-संभावनाओं को सुरक्षित रखती है।
- source_word: יֹאמֵרוּ
  choice: वर्णन करेंगे
  rationale: אָמַר का मूल अर्थ “कहना” है; यहाँ राज्य की महिमा के विषय में बोलने के अर्थ को स्वाभाविक हिन्दी में व्यक्त करने के लिए “वर्णन करेंगे” चुना गया है। इससे भविष्य/अपूर्ण क्रिया का भाव भी बना रहता है।
- source_word: גְבוּרָתְךָ
  choice: तेरे पराक्रम
  rationale: גְּבוּרָה सामर्थ्य, शक्ति या पराक्रम का सूचक है। “पराक्रम” राजकीय स्तुति के संदर्भ में गरिमापूर्ण है और अमूर्त एकवचन संज्ञा को बनाए रखता है।
- source_word: יְדַבֵּרוּ
  choice: चर्चा करेंगे
  rationale: דָּבַר का अर्थ बोलना या बात करना है। “चर्चा करेंगे” पहले चरण के “वर्णन करेंगे” से हल्का काव्यात्मक भेद रखते हुए लगातार बोलने का भाव देता है।
theological_decisions:
- issue: परमेश्वर के संबंध में מַלְכוּת का अर्थ
  choice: राज्य
  alternative: शासन अथवा राजत्व
  rationale: इब्रानी शब्द राजकीय क्षेत्र और राजकीय शासन, दोनों की ओर संकेत कर सकता है। मुख्य पाठ में “राज्य” स्वाभाविक और परिचित है; पादटिप्पणी दूसरी वैध अर्थ-संभावनाओं को खुला रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक रखी गई है। एकवचन परमेश्वर के लिए निकट संबोधन “तेरे” भजन की सीधी स्तुति-शैली के अनुरूप है। दोनों समानांतर चरणों में अलग किन्तु निकटार्थी क्रियाएँ रखी गई हैं।
