  to: वे तेरे विस्मयकारी कार्यों की सामर्थ्य का वर्णन करेंगे, और मैं तेरी महानता का बखान करूँगा।
  rationale: The revision retains the draft’s poetic modern-Hindi style and its faithful rendering of God’s awe-inspiring deeds and greatness, while using ‘सामर्थ्य’ for the Hebrew sense of might/power and preserving the Hebrew’s unqualified plural subject with ‘वे’.
