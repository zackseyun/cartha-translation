review_pass:
  verdict: revise
  source_fidelity: The draft preserves the verse’s two-part structure, the plural praise speech, and the first-person commitment to recount God’s greatness. However, ‘पराक्रम’ usually denotes valor or heroic prowess and is less suitable for עֱזוּז, which here denotes the power/might inherent in God’s awe-inspiring deeds. ‘लोग’ also makes the unexpressed Hebrew subject more specific than necessary.
  naturalness: The register is appropriately elevated and modern. ‘विस्मयकारी’ and ‘बखान करूँगा’ work naturally in poetic Hindi. Replacing ‘पराक्रम’ with ‘सामर्थ्य’ makes the construct phrase more idiomatic and semantically precise.
  terminology: ‘विस्मयकारी कार्य’ conveys the reverential awe of נוֹרְאֹתֶיך without reducing it to mere surprise or terror. ‘महानता’ appropriately represents גדולותיך as a collective/abstract noun. ‘सामर्थ्य’ is preferable to ‘पराक्रम’ for עֱזוּז.
  issues:
  - severity: medium
    issue: ‘पराक्रम’ for עֱזוּז
    rationale: ‘पराक्रम’ commonly carries the sense of bravery, martial valor, or heroic exploit. The Hebrew denotes strength, might, or power; ‘सामर्थ्य’ more faithfully conveys this without adding a valor-oriented nuance.
  - severity: low
    issue: ‘लोग’ supplies a more definite subject than the Hebrew.
    rationale: The Hebrew simply has a third-person plural verb (‘they will speak’). ‘वे’ preserves the antecedent-dependent poetic reference and avoids adding ‘people’ explicitly.
  revised_text: वे तेरे विस्मयकारी कार्यों की सामर्थ्य का वर्णन करेंगे, और मैं तेरी महानता का बखान करूँगा।
