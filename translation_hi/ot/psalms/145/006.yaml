translation:
  language: hi
  text: वे तेरे विस्मयकारी कार्यों की सामर्थ्य का वर्णन करेंगे, और मैं तेरी महानता का बखान करूँगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וֶ/עֱז֣וּז
  choice: पराक्रम
  rationale: עֱזוּז शक्ति, सामर्थ्य या पराक्रम को व्यक्त करता है। ‘पराक्रम’ काव्यात्मक गरिमा बनाए रखते हुए अगले पदबंध के साथ स्वाभाविक संबंध बनाता है।
- source_word: נוֹרְאֹתֶ֣י/ךָ
  choice: तेरे विस्मयकारी कामों
  rationale: यह रूप उन कार्यों की ओर संकेत करता है जो श्रद्धायुक्त भय और विस्मय जगाते हैं। ‘विस्मयकारी काम’ आधुनिक हिन्दी में स्वाभाविक है और केवल आतंक का अर्थ नहीं देता।
- source_word: יֹאמֵ֑רוּ
  choice: वर्णन करेंगे
  rationale: अपूर्ण क्रिया यहाँ भावी अथवा बार-बार होने वाली स्तुति व्यक्त कर सकती है। कर्म-पदबंध के साथ ‘वर्णन करेंगे’ सहज हिन्दी है और अगले अर्ध-पद के ‘बखान करूँगा’ के समानांतर है।
- source_word: ו/גדולתי/ך
  choice: तेरी महानता
  rationale: גדלות महानता अथवा महान कार्यों का बोध करा सकता है। संदर्भ में भाववाचक ‘महानता’ सीधा और स्वाभाविक है, जबकि कार्यों वाला अर्थ पहले अर्ध-पद में पहले से उपस्थित है।
- source_word: אֲסַפְּרֶֽ/נָּה
  choice: मैं ... बखान करूँगा
  rationale: पिएल रूप का अर्थ गिनाना, सुनाना या घोषित करना है। ‘बखान करना’ स्तुतिपरक काव्य में स्वाभाविक और गरिमापूर्ण है।
