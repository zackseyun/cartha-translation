base_translation:
  language: en
  yaml_path: translation/ot/psalms/145/017.yaml
  text: Yahweh is righteous in all his ways and faithful in all his works[a].
translation:
  language: hi
  text: याहवे अपने सभी मार्गों में धर्मी और अपने सभी कामों में विश्वासयोग्य है[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘दयालु’ अथवा ‘कृपालु’। कुछ अनुवादों में यहाँ ‘पवित्र’ है; यह मसोरेटिक पाठ में पाए जाने वाले ‘विश्वासयोग्य/अटल निष्ठावान’ अर्थ से भिन्न पाठ-परंपरा को दर्शाता है।
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित निकट लिप्यंतरण द्वारा व्यक्त किया गया है।
- source_word: צַדִּיק
  choice: धर्मी
  rationale: यह शब्द नैतिक खराई और न्यायपूर्ण चरित्र को व्यक्त करता है; स्तुति-काव्य और परमेश्वर के चरित्र के संदर्भ में ‘धर्मी’ स्वाभाविक तथा धर्मवैचारिक रूप से पर्याप्त है।
- source_word: בְּכָל דְּרָכָיו
  choice: अपने सभी मार्गों में
  rationale: ‘मार्ग’ परमेश्वर के कार्य करने के ढंग का रूपक बनाए रखता है, और בְּ यहाँ क्षेत्र या संबंध का भाव देता है।
- source_word: חָסִיד
  choice: विश्वासयोग्य
  rationale: मसोरेटिक पाठ का यह विशेषण חֶסֶד से जुड़ी निष्ठा, करुणा और अटल भलाई का भाव रख सकता है। समानांतर पंक्ति में ‘विश्वासयोग्य’ परमेश्वर की भरोसेमंद निष्ठा को व्यक्त करता है, जबकि अन्य संभव अर्थ पादटिप्पणी में सुरक्षित रखे गए हैं।
- source_word: בְּכָל מַעֲשָׂיו
  choice: अपने सभी कामों में
  rationale: ‘काम’ आधुनिक हिन्दी में सहज है और परमेश्वर के समस्त कार्यों को समेटता है; यह ‘मार्गों’ के साथ काव्यात्मक समानांतरता भी बनाए रखता है।
theological_decisions:
- issue: परमेश्वर के लिए חָסִיד का अनुवाद
  choice: विश्वासयोग्य
  alternative: दयालु, कृपालु; अथवा भिन्न पाठ-परंपरा के अनुसार पवित्र
  rationale: मसोरेटिक पाठ में חָסִיד है, קָדוֹשׁ नहीं। मुख्य पाठ में उसकी निष्ठापूर्ण और भरोसेमंद भलाई को व्यक्त किया गया है; शब्द की करुणा-संबंधी अर्थ-सीमा और ‘पवित्र’ वाली अलग पाठ-परंपरा को पादटिप्पणी में स्पष्ट किया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए सहज रखी गई है। ‘याहवे’ व्यक्तिगत दिव्य नाम को सुरक्षित रखता है; ‘मार्गों’ और ‘कामों’ से इब्रानी समानांतरता बनी रहती है।
