  yaml_path: translation/ot/psalms/145/009.yaml
  text: Yahweh is good to all[a], and his mercies are over all his works.
translation:
  language: hi
  text: याहवे सबके प्रति भला है, और उसकी करुणाएँ उसकी सारी रचनाओं पर हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: טוֹב
  choice: भला
  rationale: विधेय विशेषण के रूप में यह नैतिक और उपकारी भलाई—दोनों को समेटता है; ‘भला’ स्वाभाविक और व्यापक है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: לַכֹּל
  choice: सबके प्रति
  rationale: ל संबंध अथवा दिशा व्यक्त करता है; यह वाक्यांश याहवे की भलाई के सार्वभौमिक विस्तार को सहज हिन्दी में बताता है।
- source_word: רַחֲמָיו
  choice: उसकी करुणाएँ
  rationale: बहुवचन रूप को बनाए रखते हुए यह परमेश्वर के करुणामय भाव और उसके अनेक प्रकट कार्यों की प्रचुरता व्यक्त करता है।
- source_word: עַל
  choice: पर
  rationale: यह करुणा के समस्त रचे हुए जगत तक फैले होने का संबंध सीधे और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: כָּל
  choice: सब
  rationale: मूल पाठ के सार्वभौमिक बल और पहले खंड के כֹּל के साथ काव्यात्मक पुनरावृत्ति को बनाए रखता है।
- source_word: מַעֲשָׂיו
  choice: उसके बनाए हुए
  rationale: संदर्भ में यह उसके सृजित कार्यों की समग्रता की ओर संकेत करता है। यह हिन्दी में स्वाभाविक है और केवल परमेश्वर के कर्मों तक अर्थ को सीमित नहीं करता।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम है; ‘याहवे’ उसका सीधा देवनागरी लिप्यंतरण है, जबकि ‘प्रभु’ नाम को उपाधि में बदल देता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘करुणाएँ’ सामान्य हिन्दी में अपेक्षाकृत कम प्रचलित बहुवचन है, पर मूल इब्रानी के बहुवचन और उसके अर्थगत बल को सुरक्षित रखने के लिए इसे जानबूझकर रखा गया है।
