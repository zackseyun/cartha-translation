base_translation:
  language: en
  yaml_path: translation/ot/psalms/145/021.yaml
  text: My mouth will speak the praise of Yahweh[a], and all flesh will bless his holy name forever and ever.
translation:
  language: hi
  text: 'मेरा मुँह याहवे की स्तुति का गुणगान करेगा,

    और समस्त नश्वर प्राणी[a] उसके पवित्र नाम को सदा-सर्वदा धन्य कहेंगे।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सब मनुष्य” अथवा “हर जीवित प्राणी”; इब्रानी में शाब्दिक रूप से “सब मांस,” जो सभी नश्वर प्राणियों के लिए प्रयुक्त एक काव्यात्मक अभिव्यक्ति है।
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּהִלַּת יְהוָה
  choice: यहोवा की स्तुति
  rationale: सम्बन्धवाचक रचना को स्वाभाविक हिन्दी में रखते हुए स्तुति के लक्ष्य और सम्बन्ध को स्पष्ट करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण से प्रस्तुत किया गया है।
- source_word: יְדַבֶּר פִּי
  choice: मेरा मुँह ... बखान करेगा
  rationale: פִּי की ठोस काव्यात्मक छवि को बनाए रखता है; דּבר के लिए ‘बखान करेगा’ स्तुति को मुख से घोषित करने का भाव स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וִיבָרֵךְ
  choice: धन्य कहेंगे
  rationale: परमेश्वर की ओर निर्देशित ברך का अर्थ हिन्दी में ‘आशीष देंगे’ की अपेक्षा ‘धन्य कहेंगे’ अधिक स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: כָּל בָּשָׂר
  choice: समस्त नश्वर प्राणी
  rationale: शाब्दिक ‘सब मांस’ आधुनिक हिन्दी में भ्रामक है। यह रूप देहधारी, नश्वर प्राणियों के इब्रानी काव्यात्मक भाव और उसके व्यापक दायरे को सुरक्षित रखता है।
- source_word: שֵׁם קָדְשׁוֹ
  choice: उसके पवित्र नाम
  rationale: परमेश्वर की पवित्र पहचान और प्रतिष्ठा को दर्शाने वाली इब्रानी अभिव्यक्ति का सहज हिन्दी रूप।
- source_word: לְעוֹלָם וָעֶד
  choice: सदा-सर्वदा
  rationale: अनन्त अवधि पर बल देने वाली द्विरुक्त इब्रानी अभिव्यक्ति का प्रतिष्ठित और सुबोध हिन्दी समतुल्य।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम है, इसलिए उसे ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित नहीं किया गया। हिन्दी पाठकों के लिए व्यापक रूप से पहचाना जाने वाला ‘यहोवा’ चुना गया; ‘याहवे’ सम्भावित वैकल्पिक लिप्यंतरण है।
- issue: כָּל בָּשָׂר का दायरा
  choice: समस्त नश्वर प्राणी
  alternative: सब मनुष्य
  rationale: इब्रानी पद का अर्थ केवल मानवजाति तक सीमित हो सकता है, पर व्यापक रूप से सभी देहधारी नश्वर प्राणियों को भी समेट सकता है। मुख्य पाठ में व्यापकता रखी गई और पादटिप्पणी में सम्भावित अर्थ दिए गए हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण काव्यात्मक शैली रखी गई है। ‘मेरा मुँह’ मूल की ठोस छवि को और ‘सदा-सर्वदा’ समापन की ऊँची स्तुतिपरक लय को बनाए रखते हैं।
