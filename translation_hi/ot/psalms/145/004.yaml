  register: आधुनिक मानक हिन्दी में गरिमापूर्ण काव्यात्मक शैली रखी गई है। परमेश्वर के लिए निकट संबोधन ‘तेरे’ भजन की सीधी वाणी को बनाए रखता है। पहली पंक्ति के एकवचन ‘पीढ़ी’ और दूसरी पंक्ति के बहुवचन ‘वे…करेंगी’ से इब्रानी के एकवचन से बहुवचन में हुए वास्तविक बदलाव को सुरक्षित रखा गया है।
