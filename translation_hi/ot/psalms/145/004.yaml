review_pass:
  verdict: revise
  source_fidelity: The draft correctly renders the praise, God's works, and the declaration of mighty acts. However, “दूसरी पीढ़ी के सामने” is less precise for the Hebrew לְ (“to”), which conveys transmission from one generation to another; “के सामने” can merely mean ‘in the presence of.’
  naturalness: The proposed revision is natural, clear, and suitably elevated modern Hindi. “हर पीढ़ी अगली पीढ़ी को” expresses the iterative generational relationship idiomatically.
  terminology: “कार्य” is a slightly more dignified and natural poetic equivalent for מַעֲשִׂים than “कामों” in this psalmic register. “पराक्रम के काम” appropriately conveys גְּבוּרוֹת as deeds displaying strength, without importing theological interpretation.
  issues:
  - severity: medium
    issue: The phrase “दूसरी पीढ़ी के सामने” does not clearly express the Hebrew directional relation between generations.
    rationale: דּוֹר לְדוֹר means generation to generation / one generation to another. In Hindi, “के सामने” ordinarily denotes presence before someone, whereas “अगली पीढ़ी को” clearly communicates generational transmission.
  - severity: low
    issue: “वे ... करेंगी” has an unclear antecedent after the singular “एक पीढ़ी.”
    rationale: While it attempts to reflect the Hebrew shift to a plural verb, Hindi reads more smoothly when the same generic singular subject governs both coordinated clauses.
  revised_text: 'हर पीढ़ी अगली पीढ़ी को तेरे कार्यों की प्रशंसा सुनाएगी,

    और तेरे पराक्रम के कामों का वर्णन करेगी।'
  revised_footnotes:
