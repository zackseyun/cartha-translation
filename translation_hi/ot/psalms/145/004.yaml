  text: Generation to generation will praise your works[b][a], and will declare your mighty acts.
translation:
  language: hi
  text: 'हर पीढ़ी अगली पीढ़ी को तेरे कार्यों की प्रशंसा सुनाएगी,

    और तेरे पराक्रम के कामों का वर्णन करेगी।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דּוֹר לְדוֹר
  choice: एक पीढ़ी दूसरी पीढ़ी के सामने
  rationale: यह इब्रानी के पीढ़ी-से-पीढ़ी संप्रेषण के भाव को स्वाभाविक हिन्दी में व्यक्त करता है; ‘के सामने’ प्रशंसा के श्रोता को दर्शाता है, बिना ‘से’ से उत्पन्न तुलनात्मक अर्थ के।
- source_word: יְשַׁבַּח
  choice: प्रशंसा करेगी
  rationale: पिएल रूप यहाँ सराहना और महिमा का बखान करने का अर्थ देता है; ‘प्रशंसा करेगी’ आधुनिक, स्पष्ट और काव्यात्मक हिन्दी है।
- source_word: מַעֲשֶׂיךָ
  choice: तेरे कामों
  rationale: ‘काम’ מעשה का सीधा और व्यापक हिन्दी समतुल्य है तथा परमेश्वर के किए हुए कार्यों को सहज भाषा में व्यक्त करता है।
- source_word: וּגְבוּרֹתֶיךָ
  choice: तेरे पराक्रम के कामों
  rationale: גְּבוּרוֹת सामर्थ्य के प्रकट कार्यों या वीरतापूर्ण कृत्यों को दर्शाता है; ‘पराक्रम के काम’ शक्ति और कार्य—दोनों पहलुओं को बनाए रखता है।
- source_word: יַגִּידוּ
  choice: वर्णन करेंगी
  rationale: हिफ़िल रूप का भाव बताना या प्रकट करना है; ‘वर्णन करेंगी’ पीढ़ियों द्वारा परमेश्वर के सामर्थ्यपूर्ण कार्य सुनाने के अर्थ को स्पष्ट और गरिमापूर्ण ढंग से व्यक्त करता है।
