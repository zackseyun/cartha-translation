id: PSA.145.18
reference: Psalms 145:18
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: קָר֣וֹב יְ֭הוָה לְ/כָל קֹרְאָ֑י/ו לְ/כֹ֤ל אֲשֶׁ֖ר יִקְרָאֻ֣/הוּ בֶ/אֱמֶֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/145/018.yaml
  text: Yahweh is near to all who call on him[a], to all who call on him in truth.
translation:
  language: hi
  text: याहवे उन सबके निकट है जो उसे पुकारते हैं—उन सबके, जो उसे सच्चाई से पुकारते हैं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सच्चे मन से,” “निष्कपटता से,” अथवा “विश्वासयोग्यता से।”
    reason: בֶאֱמֶת के सत्य, निष्कपटता और विश्वासयोग्यता से जुड़े संभावित अर्थों को दर्शाने वाला शब्दार्थ-विकल्प।
lexical_decisions:
- source_word: קָרוֹב
  choice: निकट
  rationale: विधेय विशेषण का अर्थ ‘पास/निकट’ है। ‘निकट’ काव्यात्मक गरिमा के साथ स्थानिक और संबंधपरक दोनों भाव बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय दिव्य नाम को किसी उपाधि से बदलने के बजाय उसके प्रचलित लिप्यंतरण ‘याहवे’ से प्रस्तुत किया गया है।
- source_word: לְכָל קֹרְאָיו
  choice: उन सबके निकट ... जो उसे पुकारते हैं
  rationale: לְ संबंध को सूचित करता है और קרא यहाँ प्रार्थना या सहायता के लिए पुकारने का भाव रखता है। हिंदी वाक्य-विन्यास के अनुसार संबंध को ‘निकट’ के साथ रखा गया है।
- source_word: לְכֹל אֲשֶׁר יִקְרָאֻהוּ
  choice: उन सबके, जो उसे ... पुकारते हैं
  rationale: दूसरे चरण की पुनरुक्ति और उसका बल सुरक्षित रखा गया है; डैश से काव्यात्मक विस्तार स्वाभाविक बनता है।
- source_word: בֶאֱמֶת
  choice: सच्चाई से
  rationale: אֱמֶת में सत्य, निष्कपटता और विश्वसनीयता के अर्थ संभव हैं। ‘सच्चाई से’ हिंदी में स्वाभाविक रहते हुए इस अर्थ-विस्तार को काफी हद तक खुला रखता है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ व्यक्तिगत दिव्य नाम का प्रयोग करता है; इसलिए उसे उपाधि से प्रतिस्थापित नहीं किया गया।
- issue: परमेश्वर की निकटता का दायरा
  choice: ‘उन सब’ की सार्वत्रिक अभिव्यक्ति को बनाए रखते हुए पद की अपनी शर्त—उसे सच्चाई से पुकारना—सुरक्षित रखना
  alternative: इसे केवल वाचा-समुदाय तक सीमित करना अथवा हर मनुष्य पर बिना किसी योग्यता के लागू करना
  rationale: इब्रानी पाठ स्वयं दायरे को ‘जो उसे पुकारते हैं’ और फिर ‘सच्चाई से’ द्वारा परिभाषित करता है; अनुवाद इसे न संकुचित करता है, न विस्तृत।
translation_notes:
  register: आधुनिक मानक हिंदी; सरल, श्रद्धापूर्ण और काव्यात्मक। समानांतरता को स्पष्ट रखने के लिए डैश और पुनरुक्ति का प्रयोग किया गया है।
