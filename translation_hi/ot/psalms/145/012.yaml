source:
  edition: WLC
  text: לְ/הוֹדִ֤יעַ לִ/בְנֵ֣י הָ֭/אָדָם גְּבוּרֹתָ֑י/ו וּ֝/כְב֗וֹד הֲדַ֣ר מַלְכוּתֽ/וֹ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/145/012.yaml
  text: to make known to the sons of man his mighty acts and the glorious splendor of his kingdom[a].
translation:
  language: hi
  text: ताकि वे मनुष्यों को[a] उसके पराक्रम के काम और उसके राज्य का महिमामय वैभव ज्ञात कराएँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, ‘मनुष्य के पुत्रों को’; यह इब्रानी अभिव्यक्ति सामान्य रूप से सभी मनुष्यों को सूचित करती है।
    reason: शाब्दिक विकल्प और सामान्य मानव-सन्दर्भ को स्पष्ट करना।
lexical_decisions:
- source_word: לְהוֹדִיעַ
  choice: के बारे में बताएँ
  rationale: हिफ़ील रूप का कारक अर्थ ‘ज्ञात कराना’ है। संदर्भ में ‘के बारे में बताएँ’ आधुनिक हिन्दी में स्वाभाविक ढंग से किसी बात को दूसरों तक पहुँचाने का यही भाव व्यक्त करता है।
- source_word: לִבְנֵי הָאָדָם
  choice: मनुष्यों को[a]
  rationale: इब्रानी मुहावरे का आशय समस्त मानवजाति से है। मुख्य पाठ में स्वाभाविक और समावेशी हिन्दी रखी गई है, जबकि उसकी शाब्दिक बनावट पादटिप्पणी में सुरक्षित है।
- source_word: גְּבוּרֹתָיו
  choice: उसके सामर्थ्य के कामों
  rationale: बहुवचन גְּבוּרוֹת शक्ति के प्रकट कार्यों या पराक्रमपूर्ण कामों को दर्शाता है; ‘सामर्थ्य के काम’ व्यक्ति की शक्ति और उसके कार्य—दोनों भाव बनाए रखता है।
- source_word: וּכְבוֹד הֲדַר
  choice: और ... महिमामय वैभव
  rationale: כְבוֹד और הֲדַר के निकट काव्यात्मक संबंध को हिन्दी में ‘महिमामय वैभव’ से व्यक्त किया गया है, जिससे दोनों शब्दों का अर्थ बना रहता है और अस्वाभाविक ‘वैभव की महिमा’ से बचा जाता है।
- source_word: מַלְכוּתוֹ
  choice: उसके राज्य के
  rationale: מַלְכוּת राज्य, राजत्व या शासन को सूचित कर सकता है। इस राजकीय स्तुति में ‘राज्य’ स्वाभाविक है और परमेश्वर के अधिकार तथा उसके राजकीय क्षेत्र दोनों को समेट सकता है।
theological_decisions:
- issue: לִבְנֵי הָאָדָם में मानवजाति के लिए पुल्लिंग-रूपक अभिव्यक्ति
  choice: मुख्य पाठ में ‘मनुष्यों को’, और शाब्दिक रूप पादटिप्पणी में
  alternative: ‘मनुष्य की सन्तानों को’ अथवा ‘मनुष्य के पुत्रों को’
  rationale: इब्रानी वाक्यांश का सन्दर्भ केवल पुरुषों से नहीं, सामान्य रूप से मनुष्यों से है। आधुनिक हिन्दी में शाब्दिक रूप या तो अस्वाभाविक लगेगा या अर्थ को पुरुषों तक सीमित समझे जाने का जोखिम पैदा करेगा; पादटिप्पणी स्रोत की बनावट को स्पष्ट रखती है।
- issue: כְבוֹד הֲדַר की काव्यात्मक संधि
  choice: ‘महिमामय वैभव’
  alternative: ‘महिमा और वैभव’ अथवा ‘वैभव की महिमा’
  rationale: यह चुनाव दोनों संज्ञाओं के घनिष्ठ संबंध को बनाए रखते हुए किसी एक को हटाता नहीं और इब्रानी संबंध को दो स्वतंत्र गुणों में अनावश्यक रूप से विभाजित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल रखी गई है। ‘सामर्थ्य के काम’ तथा ‘महिमामय वैभव’ स्तोत्र की काव्यात्मक ऊँचाई बनाए रखते हैं, जबकि वाक्यरचना साधारण पाठक के लिए स्पष्ट है।
