base_translation:
  language: en
  yaml_path: translation/ot/psalms/145/020.yaml
  text: Yahweh preserves all who love him[a], but all the wicked he will destroy.
translation:
  language: hi
  text: याहवे उन सबकी रक्षा करता है जो उससे प्रेम करते हैं, परन्तु[a] वह सभी दुष्टों को नष्ट कर देगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘और सभी दुष्टों को’; इब्रानी संयोजक सामान्यतः ‘और’ है, पर यहाँ उसका प्रयोग विरोध प्रकट करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוֹמֵר
  choice: रक्षा करता है
  rationale: שׁמר का कृदन्त निरन्तर रक्षा और सुरक्षित रखने का भाव देता है। वर्तमानकालीन ‘रक्षा करता है’ इस सतत कार्य को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत नाम יהוה है; इसलिए किसी उपाधि से बदलने के बजाय उसका हिन्दी लिप्यन्तरण किया गया है।
- source_word: אֶת כָּל אֹהֲבָיו
  choice: उन सबकी ... जो उससे प्रेम करते हैं
  rationale: אֹהֲבָיו का अर्थ ‘उससे प्रेम करनेवाले’ है। सम्बन्धवाचक रचना हिन्दी में सहज है और उनके परमेश्वर के प्रति प्रेम को स्पष्ट रखती है।
- source_word: וְאֵת כָּל הָרְשָׁעִים
  choice: परन्तु वह सभी दुष्टों को
  rationale: וְ का मूल अर्थ ‘और’ है, किन्तु यहाँ पहली और दूसरी पंक्ति के बीच स्पष्ट विरोध है। ‘परन्तु’ उस काव्यात्मक विरोध को स्वाभाविक हिन्दी में व्यक्त करता है; शाब्दिक विकल्प पादटिप्पणी में सुरक्षित है।
- source_word: יַשְׁמִיד
  choice: नष्ट कर देगा
  rationale: שׁמד के हिफ़ील रूप में विनाश कराने या पूरी तरह मिटा देने का प्रबल भाव है। ‘नष्ट कर देगा’ भविष्यकाल और क्रिया की तीव्रता को बिना उसके ढंग को अधिक निर्दिष्ट किए व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: पद में उपाधि नहीं, चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम सीधे आया है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यन्तरण है और नाम को नाम के रूप में बनाए रखता है।
- issue: दूसरे खण्ड से पहले וְ का सम्बन्ध
  choice: विरोधसूचक ‘परन्तु’
  alternative: साधारण संयोजक ‘और’
  rationale: इब्रानी संयोजक रूपतः ‘और’ है, पर सन्दर्भ में प्रेम करनेवालों की रक्षा और दुष्टों के विनाश के बीच विरोध व्यक्त करता है। अनिश्चितता को पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। ‘रक्षा करता है’ सतत संरक्षण और ‘नष्ट कर देगा’ भावी न्याय के समानान्तर विरोध को बनाए रखते हैं।
