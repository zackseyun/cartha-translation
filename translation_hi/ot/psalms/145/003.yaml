lexical_decisions:
- source_word: גָּדוֹל
  choice: महान
  rationale: पद के आरम्भ में विधेय विशेषण है। ‘महान’ परिमाण, महिमा और श्रेष्ठता का भाव बिना अनावश्यक विस्तार के व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित निकट लिप्यंतरण ‘याहवे’ से व्यक्त किया गया है।
- source_word: מְהֻלָּל מְאֹד
  choice: अत्यन्त स्तुति के योग्य
  rationale: निष्क्रिय कृदन्त और उसे तीव्र करने वाले क्रियाविशेषण का स्वाभाविक हिन्दी रूप; यह प्रबल प्रशंसा का भाव बनाए रखता है।
- source_word: לִגְדֻלָּתוֹ
  choice: उसकी महानता
  rationale: גדלה का सीधा अर्थ ‘महानता’ है; सम्बन्धवाचक प्रत्यय को ‘उसकी’ से व्यक्त किया गया है।
- source_word: אֵין חֵקֶר
  choice: की थाह नहीं पाई जा सकती
  rationale: यह मुहावरेदार हिन्दी मूल अभिव्यक्ति के उस भाव को सुरक्षित रखती है कि उसकी महानता को खोज या जाँच द्वारा पूरी तरह जाना नहीं जा सकता।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम है। ‘याहवे’ उसे ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित किए बिना आधुनिक हिन्दी लिपि में प्रस्तुत करता है।
- issue: परमेश्वर की महानता के अगम्य होने का आशय
  choice: उसकी महानता की थाह नहीं पाई जा सकती
  alternative: उसकी महानता अथाह है
  rationale: चुना हुआ रूप חֵקֶר में निहित खोजने या जाँचने की क्रिया को बनाए रखता है और कथन को केवल असीमता के दावे में नहीं बदलता।
