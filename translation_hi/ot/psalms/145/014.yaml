base_translation:
  language: en
  yaml_path: translation/ot/psalms/145/014.yaml
  text: Yahweh supports all who are falling and raises up all who are bowed down[a].
translation:
  language: hi
  text: याहवे उन सबको सहारा देता है जो गिर रहे हैं[a], और उन सबको सीधा खड़ा करता है जो झुके हुए हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उन सबको थामे रखता है जो गिरते हैं।” इब्रानी कृदन्त सामान्य या जारी क्रिया—दोनों का भाव दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी परमेश्वर-नाम का शीर्षक से प्रतिस्थापन न करके आधुनिक हिन्दी में सीधा लिप्यंतरण किया गया है।
- source_word: סוֹמֵךְ
  choice: सहारा देता है
  rationale: यह कृदन्त निरन्तर या चरित्रगत रूप से संभालने और थामे रखने की क्रिया बताता है; ‘सहारा देता है’ सहज आधुनिक हिन्दी है।
- source_word: לְכָל
  choice: उन सबको
  rationale: पूर्वसर्ग सहित כָּל दोनों समानान्तर क्रियाओं के कर्म-समूह को सूचित करता है; हिन्दी में ‘उन सबको’ स्वाभाविक है।
- source_word: הַנֹּפְלִים
  choice: जो गिर रहे हैं
  rationale: क़ाल कृदन्त को जारी क्रिया के रूप में प्रस्तुत किया गया है, बिना उन्हें निश्चित रूप से पहले ही गिर चुके लोग मानने के। सामान्य या चरित्रगत अर्थ की सम्भावना पादटिप्पणी में सुरक्षित है।
- source_word: זוֹקֵף
  choice: सीधा खड़ा करता है
  rationale: क्रिया का अर्थ झुकी हुई दशा से सीधा करना या उठाना है। समानान्तर ‘झुके हुए’ के साथ यह चुनाव मूल बिम्ब को स्पष्ट रखता है।
- source_word: הַכְּפוּפִים
  choice: जो झुके हुए हैं
  rationale: निष्क्रिय कृदन्त शारीरिक या लाक्षणिक रूप से झुके होने का बिम्ब रखता है; ‘पीड़ित’ कहना कारण को अनावश्यक रूप से निश्चित कर देता।
theological_decisions:
- issue: परमेश्वर-नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पद में चतुरक्षरीय निजी नाम सीधे आया है। ‘याहवे’ उसका लिप्यंतरण करके नाम और उपाधि का भेद बनाए रखता है।
- issue: गिरने और झुके होने की दशा
  choice: मूल शारीरिक बिम्ब को बनाए रखना
  alternative: इन्हें केवल नैतिक पतन या सामाजिक उत्पीड़न के रूप में स्पष्ट करना
  rationale: इब्रानी अभिव्यक्तियाँ शारीरिक और लाक्षणिक दोनों अर्थों के लिए खुली हैं; अनुवाद किसी एक धर्मवैचारिक अर्थ को आरोपित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘सहारा देता है’ सामान्य पाठक के लिए स्पष्ट है, जबकि ‘सीधा खड़ा करता है’ दूसरे अर्धपद के दृश्य बिम्ब और काव्यात्मक समानान्तरता को सुरक्षित रखता है।
