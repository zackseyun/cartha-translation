base_translation:
  language: en
  yaml_path: translation/ot/psalms/145/001.yaml
  text: A praise of David[a]. I will exalt you, my God the King[d][c][b], and I will bless your name forever and ever.
translation:
  language: hi
  text: 'दाऊद की स्तुति।[a]

    हे मेरे परमेश्वर, हे राजा, मैं तुझे महान ठहराऊँगा और तेरे नाम को सदा-सर्वदा धन्य कहूँगा।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘दाऊद द्वारा रची गई स्तुति’; शीर्षक में प्रयुक्त לְדָוִד लेखकत्व अथवा दाऊद से संबंध—दोनों का संकेत दे सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: תְּהִלָּה
  choice: स्तुति
  rationale: एकवचन संज्ञा और भजन के शीर्षक का संक्षिप्त रूप सुरक्षित रहता है।
- source_word: לְדָוִד
  choice: दाऊद की
  rationale: भजन-शीर्षकों में לְ लेखकत्व, संबंध या संबद्धता व्यक्त कर सकता है; ‘दाऊद की’ इस लचीलेपन को ‘दाऊद द्वारा’ की अपेक्षा बेहतर बनाए रखता है।
- source_word: אֲרוֹמִמְךָ
  choice: मैं तुझे महान ठहराऊँगा
  rationale: रूमेम का मूल भाव ऊँचा उठाना अथवा महान घोषित करना है; यह हिन्दी में उपासना के संदर्भ में स्वाभाविक और अर्थपूर्ण है।
- source_word: אֱלוֹהַי הַמֶּלֶךְ
  choice: हे मेरे परमेश्वर, हे राजा
  rationale: प्रत्यक्ष संबोधन को स्वाभाविक हिन्दी में व्यक्त करता है और ‘राजा’ पर हिब्रू के निश्चित उपपद का भाव बनाए रखता है, बिना वहाँ अनुपस्थित ‘मेरे’ को राजा के साथ जोड़ने के।
- source_word: וַאֲבָרֲכָה
  choice: धन्य कहूँगा
  rationale: परमेश्वर के लिए ברך का शाब्दिक ‘आशीष देना’ हिन्दी में भ्रामक हो सकता है; ‘धन्य कहना’ स्तुति-संबंधी अर्थ और क्रिया की भावात्मक दृढ़ता को व्यक्त करता है।
- source_word: שִׁמְךָ
  choice: तेरे नाम को
  rationale: बाइबलीय ‘नाम’ की महत्वपूर्ण संकल्पना को परिभाषात्मक भावानुवाद के बिना सुरक्षित रखता है।
- source_word: לְעוֹלָם וָעֶד
  choice: सदा-सर्वदा
  rationale: युग्मित हिब्रू अभिव्यक्ति की निरंतरता और प्रबलता को स्वाभाविक, प्रतिष्ठित हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: प्रत्यक्ष संबोधन में ‘मेरे परमेश्वर’ और ‘राजा’ का संबंध
  choice: हे मेरे परमेश्वर, हे राजा
  alternative: मेरे परमेश्वर और राजा / मेरे परमेश्वर, जो राजा है
  rationale: हिब्रू אֱלוֹהַי הַמֶּלֶךְ में ‘राजा’ को ‘मेरे परमेश्वर’ के समानाधिकरण के रूप में समझा जा सकता है। दोहरे संबोधन से पहचान का संबंध बना रहता है, अनावश्यक संयोजक नहीं जुड़ता, और ‘राजा’ के साथ ऐसा स्वामित्वसूचक शब्द नहीं जोड़ा जाता जो मूल में नहीं है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमामय उपासना-रजिस्टर अपनाया गया है। परमेश्वर के लिए निकट, पारंपरिक एकवचन संबोधन ‘तू/तेरा’ रखा गया है। शीर्षक और पद को अलग पंक्तियों में प्रस्तुत किया गया है।
