  edition: WLC
  text: יוֹד֣וּ/ךָ יְ֭הוָה כָּל מַעֲשֶׂ֑י/ךָ וַ֝/חֲסִידֶ֗י/ךָ יְבָרֲכֽוּ/כָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/145/010.yaml
  text: All your works will give thanks to you[a], O Yahweh[b], and your faithful ones will bless you.
translation:
  language: hi
  text: 'हे याहवे[a], तेरे सब काम तुझे धन्यवाद देंगे,

    और तेरे निष्ठावान जन[b] तुझे धन्य कहेंगे।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में ‘YHWH’, परमेश्वर का व्यक्तिगत नाम; परंपरा में इसका अनुवाद ‘प्रभु’ भी किया जाता है।
    reason: alternative_reading
  - marker: b
    text: या ‘तेरे भक्त’ अथवा ‘तेरे पवित्र जन’। इब्रानी शब्द उन लोगों को दर्शाता है जो परमेश्वर के प्रति निष्ठा और भक्ति रखते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹדוּךָ
  choice: तेरा धन्यवाद करेंगे
  rationale: ידה के हिफ़ील रूप का मूल भाव यहाँ धन्यवाद देना या स्तुति करना है। समानांतर दूसरे खंड के ‘धन्य कहेंगे’ से क्रियात्मक भेद बनाए रखने के लिए ‘धन्यवाद करेंगे’ चुना गया है। अपूर्ण रूप को इस काव्यात्मक कथन में भविष्यकाल से व्यक्त किया गया है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय दिव्य नाम יהוה को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित नामरूप ‘यहोवा’ से व्यक्त किया गया है।
- source_word: כָּל מַעֲשֶׂיךָ
  choice: तेरे सब काम
  rationale: כָּל समग्रता बताता है और מַעֲשֶׂיךָ परमेश्वर के किए या बनाए हुए कार्यों को। ‘तेरे सब काम’ सीधा, स्वाभाविक और संदर्भानुकूल है।
- source_word: וַחֲסִידֶיךָ
  choice: तेरे भक्त
  rationale: חסיד उन लोगों को सूचित करता है जिनमें निष्ठा, भक्ति और वाचा-संबंधी समर्पण है। ‘भक्त’ आधुनिक हिन्दी में सहज है; पादटिप्पणी में इसकी निष्ठा-संबंधी व्यापकता स्पष्ट की गई है।
- source_word: יְבָרֲכוּכָה
  choice: तुझे धन्य कहेंगे
  rationale: ברך का पिअेल रूप जब मनुष्य परमेश्वर के प्रति करता है, तब हिन्दी में ‘तुझे धन्य कहेंगे’ अर्थ को ‘आशीष देंगे’ की अपेक्षा अधिक स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
theological_decisions:
- issue: दिव्य नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में व्यक्तिगत दिव्य नाम है। उसे ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित न करके नाम के रूप में रखा गया है; हिन्दी पाठकों के लिए प्रचलित रूप ‘यहोवा’ चुना गया है और पादटिप्पणी में मूल अक्षर दिए गए हैं।
- issue: חֲסִידֶיךָ का आशय
  choice: तेरे भक्त
  alternative: तेरे निष्ठावान जन; तेरे पवित्र जन
  rationale: यह शब्द केवल धार्मिक वर्ग या बाद की कलीसियाई पदवी नहीं, बल्कि परमेश्वर के प्रति निष्ठा और समर्पण से पहचाने जाने वाले लोगों को दर्शाता है। मुख्य पाठ में सहज ‘भक्त’ और पादटिप्पणी में विस्तृत भाव रखा गया है।
translation_notes:
  register: भाषा आधुनिक, काव्यात्मक और श्रद्धापूर्ण रखी गई है। ‘तेरा/तुझे’ का एकवचन आत्मीय संबोधन भजन की सीधी प्रार्थनात्मक शैली के अनुकूल है। दोनों काव्य-पंक्तियों का समानांतर ढाँचा सुरक्षित रखा गया है।
