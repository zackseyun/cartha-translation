  text: I will give thanks to you among the peoples[a], O Yahweh[b], and I will sing praise to you among the nations.
translation:
  language: hi
  text: हे याहवे, मैं लोगों के बीच तेरा धन्यवाद करूँगा[a], और राष्ट्रों के बीच तेरी स्तुति गाऊँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘तेरा धन्यवाद करूँगा’ का अनुवाद ‘तेरी स्तुति करूँगा’ भी हो सकता है। मूल इब्रानी में ‘लोगों के बीच’ और ‘राष्ट्रों के बीच’ समानांतर अभिव्यक्तियाँ हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹדְךָ
  choice: तेरा धन्यवाद करूँगा
  rationale: भजन-साहित्य में ידה का हिफ़ील रूप धन्यवाद देने और प्रशंसापूर्वक स्वीकार करने का भाव रखता है; यहाँ ‘धन्यवाद करूँगा’ उपासना के संदर्भ में स्वाभाविक है और दूसरे पुरुष के कर्म-संबंध को बनाए रखता है।
- source_word: בָעַמִּים
  choice: देश-देश के लोगों के बीच
  rationale: עַמִּים अनेक जनसमुदायों को दर्शाता है। ‘देश-देश के लोगों’ से बहुवचन और अंतरराष्ट्रीय विस्तार स्पष्ट होता है, साथ ही अगले समानांतर पद के ‘राष्ट्रों’ से शब्दगत भेद बना रहता है।
- source_word: יְהוָה
  choice: हे यहवे
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत नाम יהוה सीधे संबोधन में है; इसलिए उसे किसी उपाधि से बदलने के बजाय ‘यहवे’ रूप में रखा गया है।
- source_word: וַאֲזַמֶּרְךָ
  choice: तेरी स्तुति के गीत गाऊँगा
  rationale: זמר का पिअल रूप संगीत के साथ स्तुति गाने का अर्थ देता है। यह हिंदी अभिव्यक्ति उसके संगीतमय और स्तुतिपरक दोनों पहलुओं को व्यक्त करती है।
- source_word: בַּל
  choice: के बीच
  rationale: यहाँ काव्यात्मक प्रयोग में यह पहले अर्धपद के בָ के समानांतर संबंधसूचक है; ‘के बीच’ दोनों पंक्तियों की समानांतर रचना बनाए रखता है।
- source_word: אֻמִּים
  choice: राष्ट्रों
  rationale: אֻמִּים जनों अथवा राष्ट्रों को दर्शाता है। ‘राष्ट्रों’ पहले अर्धपद के עַמִּים से शैलीगत भेद रखते हुए उसी विश्वव्यापी दायरे को व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहवे
  alternative: यहोवा; प्रभु
  rationale: पद में चार अक्षरों वाला ईश्वरीय नाम सीधे आया है। ‘यहवे’ व्यक्तिगत वाचा-नाम को सुरक्षित रखता है और उसे उपाधि ‘प्रभु’ से प्रतिस्थापित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक उपासना में सहज पाठ के योग्य रखी गई है। ‘देश-देश के लोगों’ और ‘राष्ट्रों’ से इब्रानी समानांतरता तथा अंतरराष्ट्रीय श्रोता-वर्ग दोनों सुरक्षित हैं।
