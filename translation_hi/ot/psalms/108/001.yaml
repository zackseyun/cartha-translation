  text: נָכ֣וֹן לִבִּ֣/י אֱלֹהִ֑ים אָשִׁ֥ירָה וַ֝/אֲזַמְּרָ֗ה אַף כְּבוֹדִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/108/001.yaml
  text: My heart is steadfast[a], O God; I will sing and make music, even with my glory.
translation:
  language: hi
  text: हे परमेश्वर, मेरा हृदय दृढ़ है; मैं गाऊँगा और संगीत करूँगा, अपनी महिमा सहित।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अपने पूरे अस्तित्व सहित’; इब्रानी में शाब्दिक रूप से ‘मेरी महिमा’ है। यह काव्यात्मक अभिव्यक्ति वक्ता के भीतरी व्यक्तित्व, उसके पूरे अस्तित्व, या स्तुति के साधन के रूप में उसकी जीभ का संकेत कर सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: נָכוֹן
  choice: दृढ़
  rationale: यह शब्द स्थापित, अटल या स्थिर होने का भाव देता है; स्तुति के इस संकल्प में ‘दृढ़’ स्वाभाविक और अर्थपूर्ण है।
- source_word: לִבִּי
  choice: मेरा हृदय
  rationale: इब्रानी में ‘हृदय’ मनुष्य के भीतरी व्यक्तित्व, इच्छा और भावनाओं को व्यक्त कर सकता है; हिन्दी में शाब्दिक काव्यात्मक बिंब बनाए रखा गया है।
- source_word: אֱלֹהִים
  choice: हे परमेश्वर
  rationale: यहाँ यह सीधा संबोधन है; ‘हे’ हिन्दी में संबोधन को स्पष्ट करता है।
- source_word: אָשִׁירָה
  choice: मैं गाऊँगा
  rationale: संकल्पसूचक रूप वक्ता की दृढ़ इच्छा व्यक्त करता है; भविष्यत्काल हिन्दी में इस निश्चय को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וַאֲזַמְּרָה
  choice: और संगीत बजाऊँगा
  rationale: זמר स्तुति गाने या वाद्य-संगीत करने का भाव दे सकता है। ‘संगीत बजाऊँगा’ पहले क्रियापद ‘गाऊँगा’ की अनावश्यक पुनरावृत्ति से बचते हुए संगीत-संबंधी समानांतरता बनाए रखता है।
- source_word: אַף
  choice: यहाँ तक कि ... भी
  rationale: यह पद अंतिम वाक्यांश को बल देकर जोड़ता है; हिन्दी में यह संरचना उस बल को स्वाभाविक रूप से व्यक्त करती है।
- source_word: כְּבוֹדִי
  choice: मेरी महिमा
  rationale: इसका शाब्दिक अर्थ ‘मेरी महिमा’ है। काव्य में यह भीतरी व्यक्तित्व, संपूर्ण अस्तित्व या स्तुति के साधन के रूप में जीभ की ओर संकेत कर सकता है; मुख्य पाठ मूल की अस्पष्टता बनाए रखता है।
theological_decisions:
- issue: स्तुति की काव्यात्मक भाषा में כְּבוֹדִי का अर्थ
  choice: मेरी महिमा
  alternative: मेरा पूरा अस्तित्व; मेरा प्राण; मेरी जीभ
  rationale: इब्रानी रूपक बहुअर्थी और विवादित है। किसी एक व्याख्या को मुख्य पाठ में निश्चित करने के बजाय शाब्दिक-काव्यात्मक अभिव्यक्ति रखी गई है और संभावित अर्थ पाद-टिप्पणी में दिए गए हैं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक रखी गई है। ‘मेरी महिमा भी’ हिन्दी में जानबूझकर कुछ असामान्य सुनाई देता है, क्योंकि यह मूल इब्रानी के रूपक और उसकी वास्तविक अस्पष्टता को सुरक्षित रखता है।
