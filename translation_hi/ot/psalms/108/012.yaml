base_translation:
  language: en
  yaml_path: translation/ot/psalms/108/012.yaml
  text: Give us help against the adversary[b][a], for the salvation of man is vain.
translation:
  language: hi
  text: हमें संकट से सहायता दे[a], क्योंकि मनुष्य की दी हुई सहायता व्यर्थ है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हमें शत्रु के विरुद्ध सहायता दे”; इब्रानी צַר का अर्थ “संकट” अथवा “शत्रु” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הָבָה
  choice: कर
  rationale: यह प्रार्थना में किया गया आग्रह है। עֶזְרַת के साथ हिंदी में ‘हमारी सहायता कर’ स्वाभाविक और सीधा है।
- source_word: לָּנוּ
  choice: हमारी
  rationale: हिंदी मुहावरे में ‘हमारी सहायता कर’ मूल के ‘हमें सहायता दे’ का स्वाभाविक समतुल्य है।
- source_word: עֶזְרַת
  choice: सहायता
  rationale: यह ‘मदद/सहायता’ का अर्थ देता है; ‘सहायता’ प्रार्थनात्मक काव्य में सहज और गरिमापूर्ण है।
- source_word: מִצָּר
  choice: संकट के विरुद्ध
  rationale: צַר का अर्थ ‘संकट’ या ‘शत्रु’ दोनों हो सकता है। इस सैनिक प्रसंग में व्यक्तिगत ‘शत्रु’ संभव है, पर מִן के साथ ‘संकट से’ भी स्वाभाविक है; मुख्य पाठ में ‘संकट के विरुद्ध’ दोनों आयामों के बीच तनाव को कुछ हद तक बनाए रखता है, और विकल्प पादटिप्पणी में दिया गया है।
- source_word: וְשָׁוְא
  choice: क्योंकि ... व्यर्थ है
  rationale: שָׁוְא यहाँ निष्फलता और बेकार होने का भाव देता है। संबंधवाचक וְ को संदर्भानुसार कारणसूचक ‘क्योंकि’ से व्यक्त किया गया है।
- source_word: תְּשׁוּעַת
  choice: उद्धार
  rationale: यह बचाव, छुटकारे या विजय को सूचित कर सकता है। ‘उद्धार’ मूल शब्द के व्यापक अर्थ को बनाए रखता है, बिना किसी विशिष्ट धर्मसैद्धांतिक अर्थ को थोपे।
- source_word: אָדָם
  choice: मनुष्य से मिलने वाला
  rationale: אָדָם यहाँ किसी एक पुरुष के बजाय सामान्य रूप से मानवजाति या मानवीय सामर्थ्य को दर्शाता है। ‘मनुष्य से मिलने वाला’ इस सामान्य अर्थ को आधुनिक हिंदी में स्पष्ट करता है।
theological_decisions:
- issue: मानवीय असमर्थता के सामान्य कथन में אָדָם का अनुवाद
  choice: मनुष्य से मिलने वाला
  alternative: मानवजाति का
  rationale: इब्रानी शब्द रूप की दृष्टि से पुल्लिंग है, पर अर्थ सामान्य मानवीय सहायता का है। चुना हुआ रूप किसी एक पुरुष तक अर्थ सीमित नहीं करता और परमेश्वर की सहायता के विपरीत मानवीय उद्धार की निष्फलता व्यक्त करता है।
- issue: תְּשׁוּעַת का प्रसंगगत अर्थ
  choice: उद्धार
  alternative: छुटकारा / विजय
  rationale: सैनिक प्रसंग में बचाव या विजय अभिप्रेत हो सकती है, फिर भी व्यापक शब्द ‘उद्धार’ मूल की अर्थ-सीमा को सुरक्षित रखता है और अनावश्यक धर्मसैद्धांतिक विशिष्टीकरण से बचता है।
translation_notes:
  register: आधुनिक मानक हिंदी में संक्षिप्त, काव्यात्मक और प्रार्थनात्मक शैली रखी गई है। ‘मनुष्य से मिलने वाला उद्धार’ सामान्य मानवीय सहायता को दर्शाता है, न कि केवल किसी पुरुष की सहायता को।
