- source_word: אָעִירָה
  choice: मैं ... जगाऊँगा
  rationale: प्रथम पुरुष रूप में निश्चय का भाव रखा गया है और आरंभिक עור के साथ धातुगत पुनरावृत्ति 'जाग उठो/जगाऊँगा' में झलकती है।
- source_word: שָּׁחַר
  choice: भोर
  rationale: שחר का स्वाभाविक हिंदी काव्यात्मक समतुल्य; दिन निकलने से पहले स्तुति करने की सजीव छवि बनी रहती है।
