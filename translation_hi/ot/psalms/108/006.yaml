  text: לְ֭מַעַן יֵחָלְצ֣וּ/ן יְדִידֶ֑י/ךָ הוֹשִׁ֖יעָ/ה יְמִֽינְ/ךָ֣ וַ/עֲנֵֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/108/006.yaml
  text: So that your beloved ones may be rescued[a], save with your right hand and answer me.
translation:
  language: hi
  text: ताकि तेरे प्रिय जन छुड़ाए जाएँ[a], अपने दाहिने हाथ से बचा और मुझे उत्तर दे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बचाए जाएँ।”
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: ताकि
  rationale: यह उद्देश्य या परिणाम का संबंध व्यक्त करता है; आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: יֵחָלְצוּן
  choice: छुड़ाए जाएँ
  rationale: חלץ के निफ़अल रूप का यहाँ निष्क्रिय भाव है—संकट से छुड़ाया या बचाया जाना।
- source_word: יְדִידֶיךָ
  choice: तेरे प्रिय जन
  rationale: बहुवचन शब्द उन लोगों को दर्शाता है जो परमेश्वर को प्रिय हैं; यह आत्मीयता को सहज हिन्दी में बनाए रखता है।
- source_word: הוֹשִׁיעָה
  choice: बचा
  rationale: ישׁע के आज्ञार्थक रूप का संक्षिप्त और प्रार्थनापरक अनुवाद।
- source_word: יְמִינְךָ
  choice: अपने दाहिने हाथ से
  rationale: यह साधन का भाव और परमेश्वर के सामर्थ्य का मूल चित्र दोनों सुरक्षित रखता है।
- source_word: וַעֲנֵנִי
  choice: और मुझे उत्तर दे
  rationale: प्रत्यय प्रथम पुरुष एकवचन है; इसलिए बहुवचन लाभार्थियों से एकवचन प्रार्थी की ओर मूल पाठ का परिवर्तन बनाए रखा गया है।
theological_decisions:
- issue: बहुवचन लाभार्थियों से एकवचन प्रार्थी की ओर परिवर्तन
  choice: “तेरे प्रिय जन” के बाद “मुझे उत्तर दे”
  alternative: “हमें उत्तर दे” कहकर वचन-सामंजस्य करना
  rationale: इब्रानी पाठ समुदाय और व्यक्तिगत वक्ता के बीच तनाव को बनाए रखता है; इसे समतल नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; प्रार्थनापरक, गरिमापूर्ण और सामान्य पाठक के लिए सहज। परमेश्वर को संबोधन में निकटता और काव्यात्मक संक्षिप्तता बनाए रखने के लिए एकवचन “तेरे” और “दे” का प्रयोग किया गया है।
