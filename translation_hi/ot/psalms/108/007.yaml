base_translation:
  language: en
  yaml_path: translation/ot/psalms/108/007.yaml
  text: 'God has spoken in his holiness: “I will exult[b][a]; I will divide up Shechem and measure out the Valley of Succoth.”'
translation:
  language: hi
  text: परमेश्वर ने अपनी पवित्रता में कहा है:[a] “मैं उल्लसित होऊँगा;[b] मैं शकेम को बाँटूँगा और सुक्कोत की घाटी को नापूँगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपने पवित्र स्थान में कहा है,” अथवा “अपनी पवित्रता के द्वारा कहा है।” इब्रानी पदबंध परमेश्वर की पवित्रता या उससे सम्बद्ध पवित्र स्थान—दोनों का बोध करा सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “मैं आनन्दित होऊँगा।” इब्रानी क्रिया उल्लासपूर्ण आनन्द व्यक्त करती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: एकवचन क्रिया के कारण यहाँ इस्राएल के परमेश्वर का उल्लेख है; आधुनिक हिन्दी में ‘परमेश्वर’ स्पष्ट और गरिमापूर्ण है।
- source_word: דִּבֶּר
  choice: कहा है
  rationale: पूर्ण हो चुके दिव्य कथन की वर्तमान प्रासंगिकता व्यक्त करने के लिए हिन्दी का पूर्ण वर्तमान स्वाभाविक है।
- source_word: בְּקָדְשׁוֹ
  choice: अपनी पवित्रता में
  rationale: मुख्य पाठ में इसे परमेश्वर की पवित्रता के अर्थ में रखा गया है, जबकि इब्रानी पदबंध का स्थानवाचक या शपथ-सदृश अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: אֶעְלֹזָה
  choice: मैं हर्षित होऊँगा
  rationale: यह क्रिया उल्लासपूर्ण आनन्द व्यक्त करती है; ‘हर्षित होऊँगा’ आधुनिक और गरिमापूर्ण हिन्दी है।
- source_word: אֲחַלְּקָה
  choice: मैं शकेम को बाँटूँगा
  rationale: भूमि को हिस्सों में बाँटने या आवंटित करने की ठोस छवि को बनाए रखता है।
- source_word: שְׁכֶם
  choice: शकेम
  rationale: स्थान-नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: וְעֵמֶק סֻכּוֹת
  choice: और सुक्कोत की तराई
  rationale: सम्बन्धवाचक इब्रानी संरचना को स्वाभाविक हिन्दी में व्यक्त करता है; ‘तराई’ घाटी/निचले भूभाग की भौगोलिक छवि देती है।
- source_word: אֲמַדֵּד
  choice: को नापूँगा
  rationale: भूमि पर अधिकार और उसके विभाजन के लिए मापने की मूल छवि को सुरक्षित रखता है।
theological_decisions:
- issue: वक्ता और उद्धरण की सीमा
  choice: पहले पुरुष की सभी क्रियाएँ परमेश्वर के प्रत्यक्ष कथन के भीतर हैं।
  alternative: परमेश्वर के बोलने की सूचना देने के बाद भजनकार स्वयं बोलता है।
  rationale: ‘परमेश्वर ने... कहा है’ के बाद आने वाली पहले पुरुष की घोषणाओं को दिव्य वाणी मानना वाक्यरचना और क्षेत्रीय प्रभुता के प्रसंग से अधिक स्वाभाविक है।
- issue: בְּקָדְשׁוֹ का अर्थ
  choice: अपनी पवित्रता में
  alternative: अपने पवित्र स्थान में/से; अपनी पवित्रता की शपथ खाकर
  rationale: शब्द परमेश्वर के पवित्र गुण अथवा उससे सम्बद्ध पवित्र स्थान को सूचित कर सकता है; मुख्य पाठ गुणात्मक अर्थ रखता है और वास्तविक अस्पष्टता पादटिप्पणी में दी गई है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, काव्यात्मक गरिमा और सामान्य पाठक के लिए स्पष्टता के संतुलन के साथ रखी गई है। स्थान-नामों के लिए प्रचलित बाइबलीय हिन्दी रूप अपनाए गए हैं; मूल की अर्थगत अस्पष्टता पादटिप्पणियों में सुरक्षित है।
