  text: מִ֣י יֹ֭בִלֵ/נִי עִ֣יר מִבְצָ֑ר מִ֖י נָחַ֣/נִי עַד אֱדֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/108/010.yaml
  text: Who will bring me to the fortified city? Who will lead me as far as Edom?[a][b][c]
translation:
  language: hi
  text: किलेबंद नगर तक मुझे कौन पहुँचाएगा? एदोम तक मेरी अगुवाई कौन करेगा?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: दूसरी पंक्ति की इब्रानी क्रिया का रूप शाब्दिक रूप से “मुझे किसने मार्ग दिखाया है?” भी अनूदित हो सकता है; यहाँ पहली पंक्ति के समानांतर इसे भविष्याभिमुख प्रश्न माना गया है।
    reason: lexical_alternative
  - marker: b
    text: “किलेबंद नगर” संभवतः एदोम के किसी विशेष दुर्ग-नगर को दर्शाता है; पर इब्रानी पाठ उस नगर का नाम नहीं बताता।
    reason: cultural_note
lexical_decisions:
- source_word: מִי
  choice: कौन
  rationale: प्रश्नवाचक सर्वनाम का सीधा और स्वाभाविक हिन्दी रूप; दोनों समानांतर पंक्तियों में आलंकारिक प्रश्न को बनाए रखता है।
- source_word: יֹבִלֵנִי
  choice: मुझे पहुँचाएगा
  rationale: हिफ़इल रूप में किसी को गंतव्य तक ले जाने या पहुँचाने का भाव है। 'पहुँचाएगा' नगर को लक्ष्य मानते हुए हिन्दी में स्वाभाविक है।
- source_word: עִיר מִבְצָר
  choice: गढ़वाला नगर
  rationale: समास का अर्थ किलेबंद या दृढ़ नगर है। 'गढ़वाला नगर' साधारण पाठक के लिए स्पष्ट और गरिमापूर्ण है तथा किसी अनाम विशिष्ट दुर्ग-नगर की ओर संकेत कर सकता है।
- source_word: נָחַנִי
  choice: मेरी अगुवाई करेगा
  rationale: क्रिया का मूल अर्थ अगुवाई करना या मार्ग दिखाना है। यद्यपि रूप पूर्णकालिक है, पहली पंक्ति के अपूर्णकालिक प्रश्न के साथ काव्यात्मक समानांतरता में भविष्याभिमुख अर्थ स्वाभाविक है; औपचारिक रूप का विकल्प पादटिप्पणी में रखा गया है।
- source_word: עַד אֱדוֹם
  choice: एदोम तक
  rationale: עַד सीमा या पहुँच की हद व्यक्त करता है; 'एदोम तक' इस सूक्ष्मता को सीधे सुरक्षित रखता है।
theological_decisions:
- issue: दूसरी पंक्ति की क्रिया का काल
  choice: 'भविष्याभिमुख प्रश्न: ''मेरी अगुवाई कौन करेगा?'''
  alternative: '''मेरी अगुवाई किसने की है?'''
  rationale: इब्रानी क्रिया रूपतः पूर्णकालिक है, पर पहली पंक्ति के भविष्याभिमुख अपूर्णकालिक रूप के साथ समानार्थी काव्यात्मक समानांतरता और प्रसंग भावी सहायता की अपेक्षा का समर्थन करते हैं। अस्पष्टता पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, काव्यात्मक और गरिमापूर्ण शैली। दोनों पंक्तियों की प्रश्नात्मक समानांतरता रखी गई है। 'एदोम तक' मूल पूर्वसर्ग की सीमा-सूचक छाया बचाता है; अनावश्यक रूप से किसी विशेष नगर की पहचान नहीं की गई।
