  text: ר֣וּמָ/ה עַל שָׁמַ֣יִם אֱלֹהִ֑ים וְ/עַ֖ל כָּל הָ/אָ֣רֶץ כְּבוֹדֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/108/005.yaml
  text: Be exalted above the heavens[a], O God[b], and your glory over all the earth.
translation:
  language: hi
  text: हे परमेश्वर, आकाशों से ऊपर महान ठहर[a]; और तेरी महिमा सारी पृथ्वी पर हो[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हे परमेश्वर, आकाशों से ऊपर उठ।”
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “और सारी पृथ्वी पर तेरी महिमा”; दूसरे काव्यखंड में क्रिया नहीं दी गई है और वह पहले खंड से समझी जाती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ר֣וּמָה
  choice: ऊँचा महान ठहरे
  rationale: रום के आदेशात्मक/कामनासूचक रूप को परमेश्वर के सम्मान और महिमा में सर्वोच्च ठहरने की प्रार्थना के रूप में व्यक्त करता है; केवल स्थानिक ‘ऊपर उठ’ से अधिक उपयुक्त है।
- source_word: עַל שָׁמַיִם
  choice: आकाशों से भी ऊँचा
  rationale: עַל और बहुवचन שָׁמַיִם की ऊर्ध्व और तुलनात्मक छवि को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: אֱלֹהִים
  choice: हे परमेश्वर
  rationale: यहाँ सीधा संबोधन है; ‘हे’ हिन्दी में संबोधन स्पष्ट करता है और ‘परमेश्वर’ गरिमापूर्ण, सामान्य बाइबिलीय प्रयोग है।
- source_word: וְעַל כָּל הָאָרֶץ
  choice: और ... सारी पृथ्वी पर
  rationale: आकाशों के साथ विश्वव्यापी समानांतरता में הָאָרֶץ का अर्थ ‘पृथ्वी’ है; כָּל को स्वाभाविक रूप से ‘सारी’ कहा गया है।
- source_word: כְּבוֹדֶךָ
  choice: तेरी महिमा
  rationale: ईश्वरीय כָּבוֹד के गौरव, प्रताप और प्रकट वैभव के लिए ‘महिमा’ स्थापित और अर्थानुकूल हिन्दी शब्द है।
theological_decisions:
- issue: दूसरे काव्यखंड में निहित क्रिया
  choice: तेरी महिमा सारी पृथ्वी पर छा जाए
  alternative: और सारी पृथ्वी पर तेरी महिमा
  rationale: इब्रानी में दूसरा खंड क्रियारहित है। पहले खंड की प्रार्थनात्मक/कामनासूचक शक्ति को समानांतर रूप से समझते हुए ‘छा जाए’ सहज हिन्दी देता है, पर पादटिप्पणी मूल की क्रियारहित रचना और संभावित सीधा रूप सुरक्षित रखती है।
- issue: רומה का सम्मानसूचक या स्थानिक आशय
  choice: ऊँचा महान ठहरे
  alternative: ऊपर उठ
  rationale: यह रूप स्थानिक उत्थान और सम्मान में उत्कर्ष दोनों की संभावना रखता है। मुख्य पाठ स्तुति-प्रार्थना के संदर्भ में सम्मानसूचक आशय देता है, जबकि पादटिप्पणी अधिक स्थानिक विकल्प बताती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में काव्यात्मक और प्रार्थनापूर्ण गरिमा रखी गई है। ‘ऊँचा महान ठहरे’ सम्मानसूचक उत्कर्ष को व्यक्त करता है, जबकि ‘छा जाए’ विश्वव्यापी महिमा की सहज हिन्दी छवि देता है; मूल की अनिश्चितता पादटिप्पणियों में सुरक्षित है।
