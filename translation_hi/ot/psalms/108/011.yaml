base_translation:
  language: en
  yaml_path: translation/ot/psalms/108/011.yaml
  text: Have you not rejected us[a], O God? And do you not go out with our armies?
translation:
  language: hi
  text: हे परमेश्वर, क्या तूने हमें ठुकरा नहीं दिया[a]? और क्या तू, हे परमेश्वर, हमारी सेनाओं के साथ नहीं निकलता?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हमें त्याग नहीं दिया।” इब्रानी क्रिया प्रबल रूप से अस्वीकार करने या दूर कर देने का भाव व्यक्त कर सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: क्या ... नहीं
  rationale: यह आलंकारिक प्रश्न है, जिसमें स्वीकारात्मक उत्तर की अपेक्षा है; हिंदी में ‘क्या ... नहीं’ उसके प्रश्नात्मक बल को स्वाभाविक रूप से बनाए रखता है।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: एकवचन क्रियाएँ दिखाती हैं कि यहाँ इस्राएल के एकमात्र परमेश्वर को संबोधित किया गया है। दोनों बार आए संबोधन को अनुवाद में रखा गया है।
- source_word: זְנַחְתָּנוּ
  choice: हमें ठुकरा नहीं दिया
  rationale: זנח अस्वीकार करने या दूर कर देने का प्रबल भाव व्यक्त करता है। ‘ठुकरा दिया’ आधुनिक हिंदी में इस कठोर विलाप को बिना नरम किए स्पष्ट रखता है।
- source_word: וְלֹא
  choice: और क्या ... नहीं
  rationale: ‘और’ इब्रानी समन्वय को बनाए रखता है; प्रश्नसूचकता पूरे पद पर लागू होने के कारण हिंदी में ‘क्या’ दोहराया गया है।
- source_word: תֵצֵא
  choice: नहीं निकलता
  rationale: यहाँ अपूर्ण क्रिया को विलाप के संदर्भ में वर्तमान या प्रचलित कार्य के रूप में समझा गया है। ‘निकलता’ मूल क्रिया के सामान्य अर्थ को रखता है और ‘युद्ध करने निकलता’ जैसी अतिरिक्त व्याख्या नहीं जोड़ता।
- source_word: בְּצִבְאֹתֵינוּ
  choice: हमारी सेनाओं के साथ
  rationale: सैन्य संदर्भ में צבא का स्पष्ट आधुनिक हिंदी रूप ‘सेना’ है; בְּ को साथ देने या संग चलने के अर्थ में ‘के साथ’ कहा गया है।
theological_decisions:
- issue: विलाप में परमेश्वर द्वारा अस्वीकार किए जाने की भाषा
  choice: परमेश्वर ने अपनी प्रजा को ‘ठुकरा’ दिया और वह उनकी सेनाओं के साथ नहीं निकलता—इस सीधे आरोपात्मक विलाप को बनाए रखा गया है।
  alternative: इसे नरम करके ‘हमें छोड़ दिया’ या ‘हमारे साथ नहीं रहा’ कहना।
  rationale: इब्रानी זנח में प्रबल अस्वीकार का भाव है। अनुवाद विलाप में उपस्थित धर्मवैचारिक तनाव को नरम या हल नहीं करता।
- issue: दूसरे खंड पर प्रश्नसूचकता का विस्तार
  choice: दूसरे खंड को भी ‘और क्या ... नहीं’ के रूप में प्रश्न रखा गया है।
  alternative: 'दूसरे खंड को कथन बनाना: ‘और तू ... नहीं निकलता।’'
  rationale: पद के आरंभ का प्रश्नसूचक הֲלֹא समन्वित वाक्य के दोनों खंडों पर स्वाभाविक रूप से प्रभाव डालता है; हिंदी में प्रश्न की स्पष्टता के लिए ‘क्या’ दोहराया गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिंदी अपनाई गई है। परमेश्वर से सीधे संबोधन में ‘तू’ का प्रयोग काव्यात्मक-बाइबिलीय निकटता और एकवचन रूप को बनाए रखता है। दोहरे ‘हे परमेश्वर’ को मूल इब्रानी की पुनरावृत्ति के कारण सुरक्षित रखा गया है।
