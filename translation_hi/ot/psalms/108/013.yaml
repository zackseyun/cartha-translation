  yaml_path: translation/ot/psalms/108/013.yaml
  text: With God we will do valiantly[a], and he will trample our foes.
translation:
  language: hi
  text: परमेश्वर के साथ हम पराक्रम दिखाएँगे[a], और वह हमारे शत्रुओं को रौंद डालेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “परमेश्वर के द्वारा हम पराक्रम दिखाएँगे”; इब्रानी मुहावरा सामर्थ्य, वीरता या विजयी कार्य पर बल दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאלֹהִים
  choice: परमेश्वर के साथ
  rationale: यहाँ בְּ साधन या सहभागिता का भाव दे सकता है। ‘परमेश्वर के साथ’ उसकी सहायता पर निर्भरता को व्यक्त करता है, पर अर्थ को केवल साधन तक सीमित नहीं करता।
- source_word: נַעֲשֶׂה חָיִל
  choice: हम वीरता के काम करेंगे
  rationale: यह इब्रानी मुहावरा सामर्थ्य दिखाने, वीरतापूर्वक कार्य करने या विजय पाने का संकेत देता है। यह अनुवाद क्रिया और युद्ध-संदर्भ दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: וְהוּא
  choice: और वही
  rationale: וְ समन्वय व्यक्त करता है और הוּא पर बल है। ‘वही’ समुदाय के कार्य से परमेश्वर के निर्णायक कार्य की ओर स्पष्ट परिवर्तन दिखाता है।
- source_word: יָבוּס
  choice: रौंद डालेगा
  rationale: בוס का मूल बिंब पैरों तले रौंदने का है। ‘रौंद डालेगा’ शत्रुओं की निर्णायक पराजय का सजीव युद्ध-बिंब सुरक्षित रखता है।
- source_word: צָרֵינוּ
  choice: हमारे शत्रुओं को
  rationale: यह शब्द विरोधियों या शत्रुओं को दर्शाता है। ‘शत्रु’ आधुनिक मानक हिन्दी में स्पष्ट, गरिमापूर्ण और भजन की काव्यात्मक शैली के अनुकूल है।
theological_decisions:
- issue: विजय में मानवीय और ईश्वरीय कर्तृत्व
  choice: लोग परमेश्वर पर निर्भर होकर वीरतापूर्ण कार्य करते हैं, और परमेश्वर स्वयं शत्रुओं को निर्णायक रूप से पराजित करता है।
  alternative: या तो मानवीय सहभागिता को लगभग मिटा देना, या परमेश्वर की भूमिका को केवल सहायता तक सीमित कर देना।
  rationale: इब्रानी पाठ पहले समुदाय की क्रिया और फिर परमेश्वर की निर्णायक क्रिया को स्पष्ट रूप से रखता है। अनुवाद दोनों को बिना मिलाए साथ बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का स्पष्ट, गरिमापूर्ण और हल्का काव्यात्मक रूप अपनाया गया है। ‘वीरता के काम करेंगे’ मूल मुहावरे की व्यापकता रखता है, जबकि ‘रौंद डालेगा’ उसके सजीव युद्ध-बिंब को सुरक्षित करता है।
