  yaml_path: translation/ot/psalms/108/009.yaml
  text: Moab is my washbasin[a]; on Edom I throw my sandal[c][b]; over Philistia I shout in triumph.
translation:
  language: hi
  text: मोआब मेरे धोने का बर्तन है[a]; एदोम पर मैं अपनी चप्पल फेंकूँगा[b]; पलिश्त पर मैं विजय का जयघोष करूँगा[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मेरे नहाने-धोने का पात्र।” इब्रानी बिंब धोने में इस्तेमाल होने वाले बर्तन का है और मोआब के अपमान या अधीन किए जाने को व्यक्त करता है।
    reason: lexical_alternative
  - marker: b
    text: या “मैं अपनी जूती फेंकूँगा।” यह संकेत सम्भवतः एदोम पर प्रभुत्व या अधिकार जताने का प्रतीक है।
    reason: lexical_alternative
  - marker: c
    text: या “मैं युद्धनाद करूँगा” अथवा “मैं ऊँची पुकार लगाऊँगा।” इब्रानी क्रिया उल्लासपूर्ण या युद्ध-संबंधी पुकार को व्यक्त कर सकती है।
    reason: alternative_reading
lexical_decisions:
- source_word: סִיר רַחְצִי
  choice: मेरे धोने का बरतन
  rationale: סִיר किसी बरतन या पात्र को और רַחְצִי धोने के उपयोग को बताता है। यह चयन ठोस इब्रानी बिंब को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: אַשְׁלִיךְ נַעֲלִי
  choice: मैं अपनी चप्पल फेंकूँगा
  rationale: אַשְׁלִיךְ का अर्थ फेंकना है और נַעַל उस समय के संदर्भ में चप्पल को सूचित करता है। प्रभुत्व या अधिकार के संभावित प्रतीक को समझाकर बदलने के बजाय मूल दृश्य सुरक्षित रखा गया है।
- source_word: עַל / עֲלֵי
  choice: पर
  rationale: दोनों स्थानों पर עַל का स्थानिक और विरोधात्मक विस्तार सम्भव है। हिन्दी में ‘पर’ इस काव्यात्मक बहुअर्थकता को सहज रूप से बनाए रखता है।
- source_word: אֶתְרוֹעָע
  choice: मैं विजय का जयघोष करूँगा
  rationale: क्रिया ऊँची, उल्लासपूर्ण या युद्ध-संबंधी पुकार को व्यक्त कर सकती है। ‘विजय का जयघोष’ प्रसंगगत उल्लास को स्पष्ट करता है, जबकि वैकल्पिक अर्थ टिप्पणी में सुरक्षित हैं।
- source_word: פְלֶשֶׁת
  choice: पलिश्त
  rationale: यह लोगों के बजाय भू-प्रदेश का नाम है; इसलिए क्षेत्रवाचक पारंपरिक हिन्दी नाम ‘पलिश्त’ रखा गया है।
- source_word: מוֹאָב / אֱדוֹם
  choice: मोआब / एदोम
  rationale: इन भू-राजनीतिक नामों के प्रचलित हिन्दी रूप रखे गए हैं।
theological_decisions:
- issue: शत्रु राष्ट्रों पर प्रभुत्व के रूपक
  choice: धोने के बरतन, चप्पल फेंकने और जयघोष करने के ठोस बिंबों को बनाए रखना
  alternative: मोआब मेरा सेवक है; एदोम पर मैं अधिकार करूँगा; पलिश्त पर मैं विजयी होऊँगा
  rationale: मूल कविता अपमान, अधीनता और विजय को सजीव रूपकों में व्यक्त करती है। इन्हें केवल राजनीतिक विजय के अमूर्त कथन में बदलना मूल की काव्यात्मक और धर्मवैचारिक तीव्रता को घटा देता।
- issue: אֶתְרוֹעָע में पुकार का स्वरूप
  choice: विजय का जयघोष
  alternative: युद्धनाद करना अथवा केवल ऊँची पुकार लगाना
  rationale: प्रसंग विजयोल्लास का समर्थन करता है, पर क्रिया अपने आप में उल्लासपूर्ण या युद्ध-संबंधी पुकार दोनों को वहन कर सकती है; इसलिए विकल्प टिप्पणी में दिए गए हैं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक रखी गई है। ‘धोने का बरतन’ सामान्य पाठक के लिए स्पष्ट है; ‘चप्पल फेंकूँगा’ प्राचीन ठोस बिंब को बनाए रखता है। भविष्यकालिक रूप इब्रानी अपूर्ण क्रियाओं के प्रसंगगत संकल्प/विजय-घोष को स्वाभाविक हिन्दी में व्यक्त करते हैं।
