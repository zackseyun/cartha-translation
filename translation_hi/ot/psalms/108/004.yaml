source:
  edition: WLC
  text: כִּֽי גָד֣וֹל מֵֽ/עַל שָׁמַ֣יִם חַסְדֶּ֑/ךָ וְֽ/עַד שְׁחָקִ֥ים אֲמִתֶּֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/108/004.yaml
  text: For your steadfast love is great above the heavens[a], and your faithfulness reaches to the clouds.
translation:
  language: hi
  text: 'क्योंकि तुम्हारा अटल प्रेम आकाशों से भी ऊँचा है,

    और तुम्हारी सच्चाई बादलों तक पहुँचती है।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम्हारी विश्वासयोग्यता बादलों तक पहुँचती है।”
    reason: אֱמֶת का अर्थ यहाँ ‘सच्चाई’ के साथ-साथ ‘विश्वासयोग्यता’ भी हो सकता है, विशेषकर חֶסֶד के समानांतर।
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह आसपास के स्तुतिपरक कथन का कारण बताता है; आधुनिक हिन्दी में ‘क्योंकि’ स्पष्ट और स्वाभाविक है।
- source_word: גָדוֹל מֵעַל שָׁמַיִם
  choice: आकाशों से भी ऊँचा है
  rationale: शाब्दिक स्थानिक बिंब ‘आकाशों के ऊपर महान’ को स्वाभाविक हिन्दी में तुलनात्मक ऊँचाई के रूप में व्यक्त किया गया है, बिना उसके अतिशय विस्तार को खोए।
- source_word: חַסְדֶּךָ
  choice: तुम्हारा अटल प्रेम
  rationale: חֶסֶד के स्थायी, निष्ठावान और करुणामय प्रेम का भाव ‘अटल प्रेम’ साधारण आधुनिक हिन्दी में संक्षेप और गरिमा से व्यक्त करता है।
- source_word: שְׁחָקִים
  choice: बादलों
  rationale: यह चुनाव इब्रानी कविता के ठोस ऊर्ध्व बिंब को बनाए रखता है; ‘आकाश’ भी संभव है, पर पहली पंक्ति में שָׁמַיִם से भेद रखना उपयोगी है।
- source_word: אֲמִתֶּךָ
  choice: तुम्हारी सच्चाई
  rationale: אֱמֶת का मूल अर्थ ‘सत्य/सच्चाई’ है और इसमें विश्वसनीयता का भाव भी समाया है; ‘सच्चाई’ वास्तविक शाब्दिक व्यापकता और काव्यगत तनाव को बनाए रखती है।
- source_word: וְעַד
  choice: और ... तक पहुँचती है
  rationale: עַד सीमा या विस्तार बताता है; समानांतर पंक्ति में निहित क्रियात्मक भाव को हिन्दी में स्पष्ट करने के लिए ‘पहुँचती है’ जोड़ा गया है।
theological_decisions:
- issue: परमेश्वर के युग्मित गुण חֶסֶד और אֱמֶת का अनुवाद
  choice: ‘अटल प्रेम’ और ‘सच्चाई’
  alternative: ‘करुणा’ और ‘विश्वासयोग्यता’
  rationale: ‘अटल प्रेम’ חֶסֶד के स्थायी संबंधपरक भाव को व्यक्त करता है। אֱמֶת के लिए ‘सच्चाई’ उसके सत्य और विश्वसनीयता—दोनों संभावित आयामों को पूरी तरह किसी एक व्याख्या में सीमित नहीं करती; पादटिप्पणी संबंधपरक अर्थ स्पष्ट करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी, काव्यात्मक पर सहज और गरिमापूर्ण। ‘तुम्हारा/तुम्हारी’ मूल इब्रानी के एकवचन संबोधन को बनाए रखता है। पंक्ति-विभाजन इब्रानी समानांतरता को दर्शाता है।
