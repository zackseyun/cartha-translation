base_translation:
  language: en
  yaml_path: translation/ot/psalms/108/008.yaml
  text: Gilead is mine[a]; Manasseh is mine; Ephraim is the stronghold of my head[b]; Judah is my ruler's staff.
translation:
  language: hi
  text: गिलाद मेरा है; मनश्शे मेरा है; एप्रैम मेरे सिर का गढ़ है[a]; यहूदा मेरा राजदंड है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: “एप्रैम मेरे सिर का गढ़ है”; यह सुरक्षा और सामर्थ्य का काव्यात्मक बिंब है।'
    reason: काव्यात्मक बिंब की व्याख्या
  - marker: b
    text: या “यहूदा मेरा विधि-दाता है,” अथवा “यहूदा मेरा शासन-दंड है।”
    reason: शब्दार्थ का वास्तविक विकल्प
lexical_decisions:
- source_word: לִי
  choice: मेरा है
  rationale: पहले पुरुष एकवचन प्रत्यय के साथ ל यहाँ अधिकार या स्वामित्व व्यक्त करता है; हिंदी में ‘मेरा है’ इसका स्वाभाविक और सीधा रूप है।
- source_word: גִלְעָד
  choice: गिलाद
  rationale: स्थानवाचक नाम को प्रचलित हिंदी बाइबलीय लिप्यंतरण में रखा गया है।
- source_word: מְנַשֶּׁה
  choice: मनश्शे
  rationale: गोत्र/प्रदेश के नाम का प्रचलित हिंदी बाइबलीय लिप्यंतरण।
- source_word: אֶפְרַיִם
  choice: एप्रैम
  rationale: गोत्र के नाम का प्रचलित हिंदी बाइबलीय लिप्यंतरण।
- source_word: מָעוֹז רֹאשִׁי
  choice: मेरे सिर का गढ़
  rationale: मָעוֹז रक्षा और सामर्थ्य के ठिकाने को सूचित करता है, जबकि רֹאשִׁי का शाब्दिक अर्थ ‘मेरा सिर’ है। यह रूप मूल काव्यात्मक बिंब को बिना स्पष्टार्थ थोपे सुरक्षित रखता है।
- source_word: יְהוּדָה
  choice: यहूदा
  rationale: गोत्र/प्रदेश के नाम का प्रचलित हिंदी बाइबलीय लिप्यंतरण।
- source_word: מְחֹקְקִי
  choice: मेरा राजदंड
  rationale: यह शब्द विधि ठहराने वाले शासक अथवा उसके अधिकार-सूचक दंड को दर्शा सकता है। ‘राजदंड’ काव्यात्मक राजकीय बिंब को संक्षेप और स्वाभाविक हिंदी में व्यक्त करता है; वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: מְחֹקְקִי में यहूदा से जुड़ा शासकीय बिंब
  choice: यहूदा मेरा राजदंड है
  alternative: यहूदा मेरा विधि देनेवाला है; यहूदा मेरी शासक की छड़ी है
  rationale: प्रसंग में विभिन्न गोत्र परमेश्वर के सार्वभौम अधिकार के अंतर्गत उसके साधन और अधिकार-चिह्न के रूप में चित्रित हैं। ‘राजदंड’ राजकीय अधिकार को स्वाभाविक ढंग से व्यक्त करता है, पर शब्द में निहित व्यक्ति-वाचक ‘विधि देनेवाला’ की संभावना को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज मानक हिंदी। समानांतर वाक्य-विन्यास तथा मूल का राजकीय-सैनिक काव्यबिंब बनाए रखा गया है।
