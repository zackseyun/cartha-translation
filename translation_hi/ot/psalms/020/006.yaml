  text: अब मैं जानता हूँ कि यहोवा ने अपने अभिषिक्त को बचाया है; वह अपने पवित्र स्वर्ग से उसे अपने दाहिने हाथ के सामर्थी उद्धारक कार्यों से उत्तर देगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַתָּה
  choice: अब
  rationale: यह स्पष्ट काल-सूचक क्रियाविशेषण है; इसलिए इसे अनूदित करना स्रोत के प्रति निष्ठावान है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ में आए परमेश्वर के विशिष्ट नाम को सामान्य उपाधि में बदलने के बजाय प्रचलित हिन्दी रूप में रखा गया है।
- source_word: מְשִׁיחוֹ
  choice: अपने अभिषिक्त को
  rationale: यह रूप राजा अथवा व्यापक मसीही संकेत—दोनों संभावनाओं को बिना समय से पहले तय किए सुरक्षित रखता है।
- source_word: בִּגְבֻרוֹת יֵשַׁע יְמִינוֹ
  choice: अपने दाहिने हाथ के उद्धारकारी पराक्रम के द्वारा
  rationale: यह पदबंध दाहिने हाथ की सामर्थ्य और उसके उद्धारकारी प्रभाव दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: מְשִׁיחוֹ का संदर्भ
  choice: अपने अभिषिक्त को
  alternative: अपने मसीह को
  rationale: भजन के तत्काल राजकीय संदर्भ को बनाए रखते हुए संभावित मसीही अर्थ को बंद नहीं किया गया।
- issue: क्रियाओं का काल और पक्ष
  choice: बचाता है; ... उत्तर देगा
  alternative: बचा चुका है; ... उत्तर देगा
  rationale: הוֹשִׁיעַ पूर्ण रूप है और निश्चित उद्धार व्यक्त कर सकता है, पर काव्यात्मक विश्वास-वचन में हिन्दी का वर्तमानकाल स्थायी/निश्चित कार्य को सहजता से बताता है; יַעֲנֵהוּ का भविष्याभिमुख बल स्पष्ट रखा गया है।
