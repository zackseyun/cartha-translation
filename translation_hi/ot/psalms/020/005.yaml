id: PSA.20.5
reference: Psalms 20:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: נְרַנְּנָ֤ה בִּ֘/ישׁ֤וּעָתֶ֗/ךָ וּ/בְ/שֵֽׁם אֱלֹהֵ֥י/נוּ נִדְגֹּ֑ל יְמַלֵּ֥א יְ֝הוָ֗ה כָּל מִשְׁאֲלוֹתֶֽי/ךָ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/020/005.yaml
  text: We will shout for joy in your salvation[a], and in the name of our God we will raise our banners[c][b]. May Yahweh fulfill all your requests.
translation:
  language: hi
  text: 'हम तेरे उद्धार[a] पर जयजयकार करेंगे,

    और अपने परमेश्वर के नाम पर झंडे फहराएँगे[b]।

    याहवे तेरी सारी विनतियाँ पूरी करे[c]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तेरी विजय पर” अथवा “तेरे छुटकारे पर।” इब्रानी शब्द व्यापक अर्थ में उद्धार, बचाव या युद्ध में विजय को दर्शा सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “अपना झंडा खड़ा करेंगे।” इब्रानी क्रिया सम्भवतः उत्सव में झंडा ऊँचा उठाने या प्रदर्शित करने की छवि देती है।
    reason: lexical_alternative
  - marker: c
    text: या “याहवे तेरी सारी विनतियाँ पूरी करेगा।” इब्रानी रूप को प्रार्थना या शुभकामना और भविष्य-कथन—दोनों तरह से पढ़ा जा सकता है; प्रसंग में प्रार्थना का भाव अधिक उपयुक्त जान पड़ता है।
    reason: alternative_reading
lexical_decisions:
- source_word: נְרַנְּנָה
  choice: हम ... जयजयकार करेंगे
  rationale: यह रूप सामूहिक हर्षपूर्ण पुकार या उल्लास व्यक्त करता है। “जयजयकार करेंगे” उसके मुखर और उत्सवी भाव को स्वाभाविक हिन्दी में व्यक्त करता है; क्रिया अपने-आप में गाने का अर्थ अनिवार्य नहीं करती।
- source_word: בִּישׁוּעָתֶךָ
  choice: तेरे उद्धार पर
  rationale: יְשׁוּעָה का अर्थ उद्धार, छुटकारा या विजय हो सकता है। “उद्धार” व्यापक अर्थ-क्षेत्र बनाए रखता है, जबकि इस राजकीय और युद्ध-संबंधी प्रसंग में विजय का भाव भी समाहित रह सकता है। हिन्दी में जयजयकार के कारण को व्यक्त करने के लिए “पर” स्वाभाविक है।
- source_word: וּבְשֵׁם אֱלֹהֵינוּ
  choice: और अपने परमेश्वर के नाम पर
  rationale: यह पद परमेश्वर की पहचान और अधिकार के अधीन उल्लास मनाने का भाव रखता है। “नाम पर” आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: נִדְגֹּל
  choice: झंडे फहराएँगे
  rationale: דגל से बना यह रूप सम्भवतः विजय या उत्सव में ध्वज दिखाने अथवा ऊँचा उठाने की सजीव छवि देता है। “झंडे फहराएँगे” इस छवि को सहज हिन्दी में सुरक्षित रखता है।
- source_word: יְמַלֵּא
  choice: पूरी करे
  rationale: यद्यपि यह रूप अपूर्ण काल का है, प्रसंग में इसे प्रार्थना या शुभकामना के रूप में समझना अधिक स्वाभाविक है। हिन्दी का “पूरी करे” इसी कामनार्थक बल को व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में निकट ध्वन्यात्मक लिप्यंतरण के रूप में रखा गया है।
- source_word: כָּל מִשְׁאֲלוֹתֶיךָ
  choice: तेरी सारी विनतियाँ
  rationale: מִשְׁאֲלוֹת उन बातों को दर्शाता है जो माँगी गई हैं। “विनतियाँ” प्रार्थना के प्रसंग के अनुकूल, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य है।
theological_decisions:
- issue: राजकीय युद्ध-प्रसंग में יְשׁוּעָה का आशय
  choice: उद्धार
  alternative: विजय; छुटकारा
  rationale: निकट प्रसंग में राजा की विजय अभिप्रेत हो सकती है, पर “उद्धार” इब्रानी शब्द की व्यापक अर्थ-सीमा और धार्मिक गहराई को संकुचित किए बिना सुरक्षित रखता है। विकल्प पादटिप्पणी में दिए गए हैं।
- issue: अंतिम יְמַלֵּא का वाक्य-बल
  choice: कामना/प्रार्थना—“पूरी करे”
  alternative: भविष्य-कथन—“पूरी करेगा”
  rationale: भजन के सामुदायिक और प्रार्थनापरक प्रसंग में यह आशीष या कामना के रूप में अधिक स्वाभाविक है, यद्यपि व्याकरणिक रूप भविष्य-कथन के रूप में भी पढ़ा जा सकता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, काव्यात्मक किन्तु सहज और गरिमापूर्ण रखी गई है। एकवचन सम्बोधित राजा के लिए “तेरे/तेरी” का प्रयोग मूल के निकट और भजन की आत्मीय प्रार्थना-शैली के अनुरूप है। पंक्ति-विभाजन इब्रानी काव्य के तीन भाव-खंडों को स्पष्ट करता है।
