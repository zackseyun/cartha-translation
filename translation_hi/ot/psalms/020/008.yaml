lexical_decisions:
- source_word: הֵמָּה
  choice: वे
  rationale: स्वतंत्र तृतीय पुरुष बहुवचन सर्वनाम विरोध पर बल देता है; ‘वे’ हिंदी में ‘हम’ के साथ यह विरोध स्वाभाविक रूप से व्यक्त करता है।
- source_word: כָּרְעוּ
  choice: घुटने टेककर
  rationale: क्रिया घुटने मोड़ने, झुकने या नीचे धँसने की शारीरिक छवि देती है; ‘घुटने टेककर’ अगली क्रिया ‘गिर पड़े’ के साथ स्वाभाविक क्रम बनाता है।
- source_word: וְנָפָלוּ
  choice: गिर पड़े हैं
  rationale: यह पूर्ववर्ती क्रिया के साथ सरल समन्वय रखते हुए पतन की प्रत्यक्ष काव्यात्मक छवि सुरक्षित रखता है।
- source_word: וַאֲנַחְנוּ
  choice: पर हम
  rationale: संयोजक का मूल अर्थ ‘और’ है, किंतु ‘वे’ और ‘हम’ के बीच प्रबल विरोध को हिंदी में ‘पर’ अधिक स्वाभाविक रूप से व्यक्त करता है।
- source_word: קַּמְנוּ
  choice: उठकर
  rationale: קום उठने या खड़े होने को दर्शाता है; ‘उठकर’ विरोधियों के ‘गिर पड़े’ होने के विपरीत चित्र को स्पष्ट रखता है और अंतिम क्रिया से सहज जुड़ता है।
- source_word: וַנִּתְעוֹדָד
  choice: सीधे खड़े हैं
  rationale: दुर्लभ आत्मवाचक रूप फिर सँभलने, दृढ़ होने या तनकर खड़े होने का भाव दे सकता है; ‘सीधे खड़े हैं’ शारीरिक पुनर्स्थापन की छवि बनाए रखता है, जबकि अन्य संभावनाएँ पादटिप्पणी में दी गई हैं।
