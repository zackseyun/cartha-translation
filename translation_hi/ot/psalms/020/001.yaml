  text: יַֽעַנְ/ךָ֣ יְ֭הוָה בְּ/י֣וֹם צָרָ֑ה יְ֝שַׂגֶּבְ/ךָ֗ שֵׁ֤ם אֱלֹהֵ֬י יַעֲקֹֽב׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/020/001.yaml
  text: May Yahweh answer you in the day of trouble[a]; may the name of the God of Jacob protect you.
translation:
  language: hi
  text: संकट के दिन याहवे तुम्हें उत्तर दे; याकूब के परमेश्वर का नाम तुम्हें सुरक्षित ऊँचे स्थान पर रखे[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘तुम्हारी रक्षा करे’; इब्रानी क्रिया किसी को शत्रु की पहुँच से परे सुरक्षित ऊँचे स्थान पर रखे जाने का चित्र प्रस्तुत करती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעַנְךָ
  choice: तुम्हें उत्तर दे
  rationale: हिफ़ील रूप यहाँ ‘उत्तर देना’ व्यक्त करता है। भजन के प्रार्थनात्मक और आशीर्वादात्मक संदर्भ में ‘दे’ इच्छासूचक भाव को स्वाभाविक हिन्दी में प्रकट करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम को किसी उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: בְּיוֹם צָרָה
  choice: संकट के दिन
  rationale: यह अनुवाद मूल की कालवाचक अभिव्यक्ति और ‘दिन’ के बिंब को बनाए रखते हुए आधुनिक हिन्दी में स्वाभाविक है।
- source_word: יְשַׂגֶּבְךָ
  choice: तुम्हें सुरक्षित ऊँचे स्थान पर रखे
  rationale: क्रिया का बिंब किसी को शत्रु की पहुँच से परे ऊँचाई पर सुरक्षित रखने का है। यह अनुवाद केवल ‘रक्षा करे’ कहने की अपेक्षा उस ठोस रूपक को सुरक्षित रखता है।
- source_word: שֵׁם
  choice: नाम
  rationale: ‘नाम’ प्रतिष्ठा, अधिकार और आहूत उपस्थिति के अर्थों को समेट सकता है; मूल की काव्यात्मक और धर्मवैज्ञानिक अभिव्यक्ति को खुला रखने के लिए शाब्दिक रूप बनाए रखा गया है।
- source_word: אֱלֹהֵי יַעֲקֹב
  choice: याकूब के परमेश्वर
  rationale: यह रचना मूल संबंधसूचक पदबंध को सीधे व्यक्त करती है और उसके ऐतिहासिक तथा वाचागत संकेत को बनाए रखती है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा अथवा ‘प्रभु’
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम है; उसे उपाधि से प्रतिस्थापित न करके लिप्यंतरित किया गया है।
- issue: क्रियारूपों का प्रार्थनात्मक बल
  choice: इच्छा/आशीष के रूप में ‘उत्तर दे’ और ‘रखे’
  alternative: 'साधारण भविष्यकाल: ‘उत्तर देगा’ और ‘रखेगा’'
  rationale: सामुदायिक प्रार्थना अथवा आशीर्वचन के संदर्भ में ये रूप निश्चित भविष्यवाणी से अधिक इच्छा और विनती व्यक्त करते हैं।
- issue: שׂגב के संरक्षणात्मक रूपक को प्रस्तुत करना
  choice: सुरक्षित ऊँचे स्थान पर रखे
  alternative: रक्षा करे
  rationale: चुना हुआ रूप मूल में निहित पहुँच से परे ऊँचाई पर रखे जाने का बिंब बनाए रखता है, जबकि पादटिप्पणी उसका सहज अर्थ स्पष्ट करती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। समानांतर काव्य-पंक्तियों को अर्धविराम से जोड़ा गया है। ‘नाम’ और ‘संकट के दिन’ जैसे मूल बिंब सुरक्षित रखे गए हैं।
