  text: יְהוָ֥ה הוֹשִׁ֑יעָ/ה הַ֝/מֶּ֗לֶךְ יַעֲנֵ֥/נוּ בְ/יוֹם קָרְאֵֽ/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/020/009.yaml
  text: O Yahweh[a], save! May the King answer us in the day we call.
translation:
  language: hi
  text: हे याहवे[a], उद्धार कर! जिस दिन हम पुकारें, राजा हमें उत्तर दे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इसे इस प्रकार भी पढ़ा जा सकता है: “हे याहवे, राजा का उद्धार कर; जिस दिन हम पुकारें, हमें उत्तर दे,” या संभवतः, “हे याहवे, उद्धार कर! जिस दिन हम पुकारें, राजा हमें उत्तर देता है।” इब्रानी वाक्य-विन्यास संक्षिप्त है और ‘राजा’ का संबंध एक से अधिक प्रकार से समझा जा सकता है।'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: हे याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय देवनागरी में उसके प्रचलित लिप्यंतरण ‘याहवे’ से व्यक्त किया गया है; ‘हे’ सीधे संबोधन को स्वाभाविक बनाता है।
- source_word: הוֹשִׁיעָה
  choice: उद्धार कर!
  rationale: यह ישׁע का आज्ञार्थक प्रार्थना-रूप है। ‘उद्धार कर’ छुटकारे और विजय, दोनों की संभावित छाया को समेटता है और किसी एक परिस्थिति तक अर्थ को सीमित नहीं करता।
- source_word: הַמֶּלֶךְ
  choice: राजा
  rationale: इब्रानी में यह निश्चित उपपद के साथ सामान्य संज्ञा है। हिंदी में ‘राजा’ प्रसंगानुसार निश्चित है और यह रूप मानवीय राजा तथा परमेश्वर के संभावित संकेत के बीच की व्याख्यात्मक अस्पष्टता को अनावश्यक रूप से नहीं मिटाता।
- source_word: יַעֲנֵנוּ
  choice: हमें उत्तर दे
  rationale: अपूर्ण क्रिया यहाँ प्रार्थनापूर्ण इच्छा व्यक्त कर सकती है। ‘हमें उत्तर दे’ उसके अर्थ और वचन-पुरुष को सीधे सुरक्षित रखता है।
- source_word: בְיוֹם
  choice: जिस दिन
  rationale: यह कालवाचक इब्रानी मुहावरे का स्वाभाविक हिंदी रूप है और मूल के ‘दिन’ को बनाए रखता है।
- source_word: קָרְאֵנוּ
  choice: हम पुकारें
  rationale: קרא का मूल अर्थ ‘पुकारना’ है। संभावनार्थक रूप प्रार्थना के प्रसंग और मुख्य क्रिया की इच्छासूचकता के अनुकूल है, बिना अतिरिक्त भावात्मक तीव्रता जोड़े।
theological_decisions:
- issue: इस पद में ‘राजा’ का वाक्यगत संबंध और संकेत
  choice: मुख्य पाठ में ‘राजा’ को ‘हमें उत्तर दे’ का कर्ता रखा गया है।
  alternative: इसे ‘राजा का उद्धार कर’ में ‘उद्धार कर’ का कर्म माना जा सकता है और अगले खंड का कर्ता याहवे समझा जा सकता है; अथवा ‘राजा हमें उत्तर देता है’ कथन के रूप में पढ़ा जा सकता है।
  rationale: इब्रानी वाक्य-विन्यास अत्यंत संक्षिप्त है और एक से अधिक अर्थ-संबंधों की अनुमति देता है। राजकीय भजन के निकट प्रसंग में राजा को उत्तर देने वाले कर्ता के रूप में पढ़ना संभव है, पर अन्य प्राचीन रूप से मान्य व्याख्याएँ भी वास्तविक हैं; इसलिए उन्हें पादटिप्पणी में रखा गया है, न कि सिद्धांतगत रूप से निरस्त किया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और प्रार्थनात्मक रखी गई है। ‘उद्धार कर’ तथा ‘उत्तर दे’ मूल की संक्षिप्त समानांतर रचना को बनाए रखते हैं। हिंदी में बड़े और छोटे अक्षरों का भेद न होने के कारण ‘राजा’ के मानवीय या दिव्य संकेत को अक्षर-विन्यास से निर्धारित नहीं किया गया।
