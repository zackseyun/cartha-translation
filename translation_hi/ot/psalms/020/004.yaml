source:
  edition: WLC
  text: יִֽתֶּן לְ/ךָ֥ כִ/לְבָבֶ֑/ךָ וְֽ/כָל עֲצָתְ/ךָ֥ יְמַלֵּֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/020/004.yaml
  text: May he grant you according to your heart[a], and fulfill all your counsel.
translation:
  language: hi
  text: 'वह तेरे मन की इच्छा पूरी करे,

    और तेरी सारी योजनाएँ सफल करे।[क]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: क
    text: या, “तेरे सारे अभिप्राय” अथवा “तेरी सारी युक्तियाँ।”
    reason: हिब्रू עֲצָתְךָ का अर्थ योजना, अभिप्राय, युक्ति या परामर्श हो सकता है; मुख्य पाठ में संदर्भानुकूल ‘योजनाएँ’ रखा गया है।
lexical_decisions:
- source_word: יִתֶּן
  choice: दे
  rationale: נתן का सामान्य अर्थ ‘देना’ है। इस प्रार्थना और आशीर्वाद के संदर्भ में हिंदी संभावनार्थक ‘दे’ हिब्रू यिक्तोल का कामना-सूचक भाव स्वाभाविक रूप से व्यक्त करता है।
- source_word: לְךָ
  choice: तुझे
  rationale: दूसरे पुरुष एकवचन के अप्रत्यक्ष कर्म को हिंदी में ‘तुझे’ से सहज और स्पष्ट रूप में व्यक्त किया गया है।
- source_word: כִלְבָבֶךָ
  choice: तेरे मन के अनुसार
  rationale: शाब्दिक अर्थ ‘तेरे हृदय के अनुसार’ है। आधुनिक हिंदी में ‘मन’ इच्छा, अभिलाषा और आंतरिक संकल्प का भाव अधिक स्वाभाविक ढंग से देता है, बिना उसे केवल भावना तक सीमित किए।
- source_word: וְכָל
  choice: और ... सारी
  rationale: וְ और כָּל को क्रमशः ‘और’ तथा स्त्रीलिंग संज्ञा ‘योजना’ के अनुरूप ‘सारी’ से व्यक्त किया गया है।
- source_word: עֲצָתְךָ
  choice: तेरी ... योजना
  rationale: עֵצָה का अर्थ सलाह, युक्ति, उद्देश्य या योजना हो सकता है। यहाँ कामना के संदर्भ में ‘योजना’ आधुनिक हिंदी में सबसे सहज है और विचार करके ठहराए गए अभिप्राय का भाव बनाए रखती है।
- source_word: יְמַלֵּא
  choice: पूरी करे
  rationale: מלא के पिएल रूप का अर्थ यहाँ किसी योजना को पूर्ण सिद्धि तक पहुँचाना है। ‘पूरी करे’ हिंदी में इस अर्थ और कामना-सूचक बल दोनों को स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: आशीर्वाद अथवा प्रार्थना के संदर्भ में क्रिया-रूपों का बल
  choice: 'दोनों क्रियाओं को कामना के रूप में प्रस्तुत किया गया है: ‘दे ... पूरी करे।’'
  alternative: 'साधारण भविष्यवाणी: ‘वह देगा ... और पूरी करेगा।’'
  rationale: यद्यपि दोनों हिब्रू क्रियाएँ यिक्तोल रूप में हैं, भजन 20 में आसपास की विनतियों के कारण उनका कामना-सूचक अर्थ अधिक स्वाभाविक है।
- issue: לֵבָב में निहित आंतरिक व्यक्ति का अर्थ
  choice: ‘मन’ को इच्छा, अभिप्राय और संकल्प के व्यापक केंद्र के रूप में रखा गया है।
  alternative: शाब्दिक ‘हृदय’ अथवा अधिक स्पष्ट लेकिन संकीर्ण ‘इच्छा’।
  rationale: ‘मन’ सामान्य आधुनिक हिंदी में हिब्रू ‘हृदय’ के इच्छात्मक और संकल्पात्मक पहलुओं को सहज रूप से संप्रेषित करता है, जबकि किसी एक मनोवैज्ञानिक अर्थ को आरोपित नहीं करता।
- issue: עֵצָה की अर्थ-व्याप्ति
  choice: मुख्य पाठ में ‘योजना’।
  alternative: ‘सलाह’, ‘युक्ति’ या ‘अभिप्राय’।
  rationale: इस संदर्भ में बात उस विचारित योजना की है जिसे सफलतापूर्वक पूरा किए जाने की कामना की जा रही है। ‘सलाह’ हिंदी में किसी दूसरे को दिए गए परामर्श का भ्रम पैदा कर सकती है।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। संबोधन दूसरे पुरुष एकवचन ‘तेरे/तुझे’ में है, जो मूल हिब्रू के एकवचन रूप को बनाए रखता है। पद की समानांतर काव्य-रचना को दो पंक्तियों में रखा गया है।
