  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण प्रार्थनात्मक स्तर रखा गया है। एकवचन संबोधन ‘तेरी’ मूल इब्रानी के 2ms रूप को दर्शाता है। ‘होमबलि’ धार्मिक-सांस्कृतिक संदर्भ में स्पष्ट और स्थापित पद है; ‘सेला’ की अनिश्चितता लिप्यंतरण द्वारा बनाए रखी गई है।
