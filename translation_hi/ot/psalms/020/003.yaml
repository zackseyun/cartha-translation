- source_word: מִנְחֹתֶךָ
  choice: तेरी सब भेंटों[a]
  rationale: מִנְחָה सामान्य भेंट/उपहार अथवा विशेष रूप से अन्नबलि का संकेत कर सकता है। मुख्य पाठ में व्यापक ‘भेंटों’ रखा गया है और विशिष्ट अर्थ पादटिप्पणी में दिया गया है।
- source_word: וְעוֹלָתְךָ
  choice: और तेरी होमबलि
  rationale: עוֹלָה के लिए ‘होमबलि’ प्रचलित और सटीक बलिदानी शब्द है।
- source_word: יְדַשְּׁנֶה
  choice: स्वीकार करे
  rationale: דשן के पिएल रूप का शाब्दिक बिंब ‘मोटा/समृद्ध मानना’ है, पर बलिदानी संदर्भ में इसका आशय बलि को अनुग्रहपूर्वक ग्रहण करना है। मुख्य पाठ में अर्थ स्पष्ट किया गया है और बिंब पादटिप्पणी में सुरक्षित है।
- source_word: סֶלָה
  choice: सेला
  rationale: शब्द का ठीक अर्थ अनिश्चित होने के कारण पारंपरिक लिप्यंतरण रखा गया है।
theological_decisions:
- issue: तीसरे पुरुष एकवचन क्रियाओं का कर्ता
  choice: प्रार्थना के संदर्भ में निहित कर्ता परमेश्वर है, जिसे ‘वह’ से व्यक्त किया गया है।
  alternative: कर्ता को पूरी तरह अव्यक्त छोड़ना।
  rationale: भजन 20 के संदर्भ में समुदाय राजा के लिए परमेश्वर की कृपा माँगता है। इब्रानी में कर्ता स्पष्ट संज्ञा के रूप में नहीं है, पर हिन्दी में ‘वह’ वाक्य को सहज बनाता है और कोई अतिरिक्त धर्मसैद्धांतिक दावा नहीं जोड़ता।
