- source_word: יִזְכֹּר
  choice: स्मरण करे
  rationale: ज़כר के क़ाल अपूर्ण रूप का यहाँ आशीषात्मक प्रार्थना में इच्छासूचक बल है; ‘स्मरण करे’ इसे स्वाभाविक और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: כָּל
