  yaml_path: translation/ot/psalms/020/002.yaml
  text: May he send you help from the sanctuary and sustain you from Zion[a][b].
translation:
  language: hi
  text: वह पवित्रस्थान[b] से तेरे लिए सहायता भेजे और सिय्योन से तुझे सँभाले[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सिय्योन से तुझे सहारा दे” अथवा “तुझे थामे रखे।”
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में “पवित्रता से” अथवा “पवित्र स्थान से”; यहाँ संभवतः परमेश्वर के पवित्रस्थान का उल्लेख है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׁלַח
  choice: भेजे
  rationale: यह क़ाल अपूर्णकाल, इस आशीष और प्रार्थना के संदर्भ में साधारण भविष्य के बजाय कामनासूचक अर्थ देता है। हिंदी में ‘भेजे’ इस भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: עֶזְרְךָ
  choice: तेरे लिए सहायता
  rationale: עֵזֶר पर द्वितीय पुरुष एकवचन प्रत्यय है; अर्थ ‘तेरी सहायता’ अथवा ‘तेरे लिए सहायता’ हो सकता है। ‘तेरे लिए सहायता भेजे’ आधुनिक हिंदी में स्पष्ट और स्वाभाविक है।
- source_word: מִקֹּדֶשׁ
  choice: पवित्रस्थान से
  rationale: קֹדֶשׁ का अर्थ अमूर्त रूप में ‘पवित्रता’ और ठोस रूप में ‘पवित्र स्थान’ हो सकता है। ‘सिय्योन से’ के समानांतर स्थानवाचक प्रयोग में परमेश्वर का पवित्रस्थान सबसे संभावित अर्थ है।
- source_word: וּמִצִּיּוֹן
  choice: और सिय्योन से
  rationale: संयोजक दोनों समानांतर प्रार्थनात्मक खंडों को जोड़ता है। צִיּוֹן नाम को प्रचलित हिंदी रूप ‘सिय्योन’ में रखा गया है।
- source_word: יִסְעָדֶךָּ
  choice: तुझे सँभाले
  rationale: סעד का अर्थ सहारा देना, थामे रखना या संभालना है। ‘सँभाले’ संकट में समर्थ और स्थिर रखने का भाव सहज, काव्यात्मक हिंदी में व्यक्त करता है; क्रिया का रूप यहाँ कामना को दर्शाता है।
theological_decisions:
- issue: क्रियाओं के अनुक्त कर्ता का संदर्भ
  choice: मुख्य पाठ में ‘वह’ रखा गया है; संदर्भ से इसका संकेत यहोवा की ओर है।
  alternative: इस पद में स्पष्ट रूप से ‘यहोवा’ जोड़ना।
  rationale: इब्रानी पंक्ति में कर्ता के रूप में कोई संज्ञा नहीं है; वह पिछले संदर्भ से समझी जाती है। इसलिए स्रोत में निहित सर्वनाम-सदृश संदर्भ को बनाए रखा गया है और परमेश्वर का नाम नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और प्रार्थनात्मक है। मूल के एकवचन अनौपचारिक संबोधन को ‘तेरे/तुझे’ से सुरक्षित रखा गया है। मुख्य पाठ में दोनों फुटनोट चिह्न संबंधित पद के अंत में दिए गए हैं।
