  text: These trust in chariots and those in horses, but we call on the name of the LORD our God.
translation:
  language: hi
  text: 'कुछ लोग रथों पर और कुछ घोड़ों पर भरोसा करते हैं,

    पर हम याहवे, अपने परमेश्वर, के नाम का स्मरण करेंगे।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘नाम का स्मरण करेंगे’ का अर्थ ‘नाम का उल्लेख या घोषणा करेंगे’ भी हो सकता है; प्रसंग में ‘पुकारेंगे’ अथवा ‘गौरव करेंगे’ अर्थ भी समझा गया है। इब्रानी की पहली पंक्ति में ‘भरोसा करते हैं’ क्रिया लिखी हुई नहीं है, बल्कि संदर्भ से पूरी की गई है।
    reason: नַזְכִּיר के अर्थ-क्षेत्र तथा पहले खंड की लुप्त क्रिया—दोनों को स्पष्ट करते हुए किसी एक विवादित व्याख्या को अनिवार्य नहीं बनाया गया है।
lexical_decisions:
- source_word: אֵלֶּה בָרֶכֶב וְאֵלֶּה בַסּוּסִים
  choice: कुछ लोग रथों पर और कुछ घोड़ों पर भरोसा करते हैं
  rationale: इब्रानी में क्रिया व्यक्त नहीं है—शाब्दिक रूप से, ‘ये रथों में/से और ये घोड़ों में/से।’ अगले खंड के विरोध और भजन के प्रसंग से भरोसा या गौरव करना निहित है; स्वाभाविक हिन्दी में ‘भरोसा करते हैं’ इस दीर्घवृत्त को स्पष्ट करता है।
- source_word: נַזְכִּיר
  choice: नाम लेंगे
  rationale: זכר के हिफ़ील रूप का मूल भाव ‘स्मरण कराना, उल्लेख करना, नाम लेना’ है। ‘पुकारेंगे’ सम्भव अर्थगत व्याख्या है, पर ‘नाम लेंगे’ मूल क्रिया के अधिक निकट रहते हुए उपासना और निर्भरता के प्रसंग को खुला रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में उपस्थित परमेश्वर के व्यक्तिगत नाम को पदवी ‘प्रभु’ से प्रतिस्थापित न करके हिन्दी में प्रचलित विद्वत्तापूर्ण लिप्यंतरण दिया गया है।
theological_decisions:
- issue: रथों और घोड़ों से संबंधित लुप्त क्रिया
  choice: ‘भरोसा करते हैं’ को प्रसंगानुसार पूरा किया
  alternative: ‘घमंड करते हैं’ या केवल ‘रथों में…घोड़ों में’
  rationale: पद में मानवीय सैन्य शक्ति और परमेश्वर के नाम पर सामुदायिक निर्भरता का विरोध है। ‘भरोसा’ इसे स्वाभाविक हिन्दी में व्यक्त करता है, यद्यपि इब्रानी में यह क्रिया स्पष्ट रूप से लिखी नहीं है।
- issue: נַזְכִּיר का धार्मिक आशय
  choice: ‘नाम लेंगे’
  alternative: ‘पुकारेंगे’, ‘स्मरण करेंगे’ या ‘गौरव करेंगे’
  rationale: मूल क्रिया स्मरण/उल्लेख के अर्थ-क्षेत्र में है। अनुवाद इसे केवल प्रार्थना (‘पुकारना’) या केवल गर्व (‘गौरव करना’) तक सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। काव्यात्मक समानांतरता बनाए रखने के लिए ‘कुछ लोग…और कुछ…पर हम…’ संरचना अपनाई गई है।
