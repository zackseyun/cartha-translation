review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the despoiling of the stouthearted, the deliberately ambiguous idiom of sleeping their sleep, and the martial sense of אַנְשֵׁי־חַיִל. However, “किसी भी वीर योद्धा को अपने हाथ न मिले” is not a viable Hindi rendering of the Hebrew idiom; it reads as though their physical hands were missing rather than that they could not act.
  naturalness: The first two cola are suitably elevated and poetic. Replacing the final literalistic wording with the established Hindi idiom “हाथ काम न आए” gives a natural, concise rendering while retaining the source sense.
  terminology: “दृढ़ हृदयवाले,” “वीर योद्धा,” and “लूट लिए गए” are acceptable in this poetic martial context. “वे अपनी नींद सो गए” appropriately avoids explicitly specifying death.
  issues:
  - severity: medium
    issue: The phrase “अपने हाथ न मिले” is unnatural and misleading in modern Hindi.
    rationale: Although the Hebrew literally says that the warriors did not find their hands, it is an idiom for inability to act or loss of power. In Hindi, saying that someone did not find their hands normally suggests physical absence or confusion, not military helplessness. “हाथ काम न आए” naturally conveys the idiomatic force.
