  text: אֶשְׁתּוֹלְל֨וּ אַבִּ֣ירֵי לֵ֭ב נָמ֣וּ שְׁנָתָ֑/ם וְ/לֹא מָצְא֖וּ כָל אַנְשֵׁי חַ֣יִל יְדֵי/הֶֽם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/076/005.yaml
  text: The stouthearted were plundered; they slept their sleep[a], and none of the men of valor could find their hands.
translation:
  language: hi
  text: 'दृढ़ हृदयवाले लूट लिए गए;

    वे अपनी नींद सो गए,

    और किसी भी वीर योद्धा के हाथ काम न आए।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक, “किसी भी वीर योद्धा ने अपने हाथ नहीं पाए”; अर्थात् वे कार्य करने में असमर्थ, पूरी तरह शक्तिहीन हो गए।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶשְׁתּוֹלְלוּ
  choice: लूट लिए गए
  rationale: 'यह रूप यहाँ निष्क्रिय अर्थ देता है: जो शक्तिशाली थे, वे स्वयं लूट का शिकार हुए। सैन्य प्रसंग में यह स्वाभाविक है और अगले चरण की असमर्थता से मेल खाता है।'
- source_word: אַבִּירֵי לֵב
  choice: दृढ़ हृदयवाले
  rationale: शाब्दिक अर्थ ‘हृदय के शक्तिशाली’ है। यह साहस और भीतरी दृढ़ता दोनों को बनाए रखता है, बिना इसे केवल ‘योद्धा’ कहकर सीमित किए।
- source_word: נָמוּ שְׁנָתָם
  choice: वे अपनी नींद सो गए
  rationale: इब्रानी की संज्ञातीय, काव्यात्मक अभिव्यक्ति को बनाए रखा गया है। इससे सामान्य नींद और मृत्यु-सदृश नींद के बीच मूल पाठ की अर्थगत खुली जगह बनी रहती है।
- source_word: אַנְשֵׁי חַיִל
  choice: वीर योद्धा
  rationale: यह पद सामर्थ्यवान और पराक्रमी लड़ाकों को दर्शाता है। ‘वीर योद्धा’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक रूप से सैन्य भाव व्यक्त करता है।
- source_word: וְלֹא מָצְאוּ ... יְדֵיהֶם
  choice: किसी भी वीर योद्धा को अपने हाथ न मिले
  rationale: मुख्य पाठ में इब्रानी का सजीव और असामान्य बिंब सुरक्षित रखा गया है; इसका आशय हाथों का उपयोग न कर पाना, अर्थात् पूरी तरह शक्तिहीन हो जाना है, जिसे पादटिप्पणी स्पष्ट करती है।
theological_decisions:
- issue: ‘नींद’ का आशय सामान्य निद्रा है या मृत्यु
  choice: ‘वे अपनी नींद सो गए’ कहकर अस्पष्टता बनाए रखी गई
  alternative: ‘वे मृत्यु की नींद सो गए’
  rationale: प्रसंग मृत्यु या निर्णायक पराजय की ओर संकेत कर सकता है, पर ‘मृत्यु’ शब्द मूल पद में प्रत्यक्ष नहीं है; इसलिए उसे मुख्य पाठ में जोड़ना उचित नहीं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक रखी गई है। ‘अपने हाथ न मिले’ जानबूझकर मूल इब्रानी बिंब को बनाए रखता है; अर्थ की सहज स्पष्टता पादटिप्पणी में दी गई है।
