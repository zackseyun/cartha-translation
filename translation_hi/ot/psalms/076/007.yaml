  yaml_path: translation/ot/psalms/076/007.yaml
  text: You—you are to be feared[a]; and who can stand before you from the time of your anger[b]?
translation:
  language: hi
  text: तू—तू भय मानने योग्य है[a]; और तेरे क्रोध के समय से कौन तेरे सामने खड़ा रह सकता है?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “भयावह” अथवा “विस्मयकारी”; इब्रानी शब्द का अर्थ “भय उत्पन्न करनेवाला” या “भय मानने योग्य” हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “जब तेरा क्रोध भड़कता है” अथवा “जब से तेरा क्रोध भड़का है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַתָּה ... אַתָּה
  choice: तू—तू
  rationale: दोहराए गए सर्वनाम का बल और काव्यात्मक प्रभाव बनाए रखा गया है; ‘केवल तू’ कहने से ऐसा अनन्य भाव जुड़ जाता जो मूल में स्पष्ट नहीं है।
- source_word: נוֹרָא
  choice: भययोग्य
  rationale: यह विशेषण भय उत्पन्न करने और श्रद्धामिश्रित भय के योग्य होने—दोनों भावों को समेटता है तथा विधेयात्मक प्रयोग को बनाए रखता है।
- source_word: וּמִי
  choice: और ... कौन
  rationale: संयोजक וְ और प्रश्नवाचक מִי का सीधा तथा स्वाभाविक हिंदी रूप है; संदर्भ में प्रश्न आलंकारिक है।
- source_word: יַעֲמֹד לְפָנֶיךָ
  choice: तेरे सामने खड़ा रह सकता है
  rationale: इस आलंकारिक प्रश्न में अपूर्ण क्रिया सामर्थ्य या संभावना व्यक्त करती है; ‘खड़ा रह सकता है’ परमेश्वर का सामना सह पाने का भाव देता है।
- source_word: מֵאָז
  choice: के समय से
  rationale: מֵאָז किसी आरंभ-बिंदु से आगे का समय सूचित कर सकता है। यह रूप उस कालिक बारीकी को बचाता है, यद्यपि हिंदी में ‘जब’ अधिक सहज विकल्प है।
- source_word: אַפֶּךָ
  choice: तेरे क्रोध
  rationale: אַף का शाब्दिक अर्थ ‘नाक’ है, पर यहाँ प्रचलित लाक्षणिक अर्थ ‘क्रोध’ है।
theological_decisions:
- issue: परमेश्वर के प्रति भय का स्वरूप
  choice: ‘भययोग्य’ द्वारा आतंक और श्रद्धामिश्रित भय, दोनों की संभावना बनाए रखना
  alternative: ‘भयंकर’ या ‘विस्मयकारी’
  rationale: संदर्भ परमेश्वर की प्रबल महिमा और उसके क्रोध के सामने किसी के टिक न सकने की बात करता है। ‘भययोग्य’ भय की उचित मानवीय प्रतिक्रिया को स्पष्ट करता है, बिना इसे केवल आतंक या हल्के विस्मय तक सीमित किए।
- issue: מֵאָז אַפֶּךָ का कालिक संबंध
  choice: ‘तेरे क्रोध के समय से’
  alternative: ‘जब तेरा क्रोध भड़कता है’
  rationale: मूल का מֵאָז ‘तब से/उस समय से’ का अर्थ दे सकता है। मुख्य पाठ में इस असामान्य कालिक तनाव को बनाए रखा गया है; वैकल्पिक स्वाभाविक अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण काव्यात्मक हिंदी। भजन की सीधी प्रार्थनात्मक संबोधन-शैली के अनुरूप ‘तू/तेरे’ रखा गया है। सर्वनाम की पुनरुक्ति और מֵאָז की वास्तविक कालिक अस्पष्टता सुरक्षित रखी गई है।
