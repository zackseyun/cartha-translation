  text: לַ/מְנַצֵּ֥חַ בִּ/נְגִינֹ֑ת מִזְמ֖וֹר לְ/אָסָ֣ף שִֽׁיר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/076/000.yaml
  text: For the choirmaster[a]; with stringed instruments. A psalm of Asaph[b], a song.
translation:
  language: hi
  text: संगीत-निर्देशक[a] के लिए; तार वाले वाद्यों के साथ। आसाफ का[b] भजन—एक गीत।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसके लिए प्रयुक्त इब्रानी पद का अर्थ ‘प्रधान संगीतकार’ या ‘निर्देशक’ भी हो सकता है।
    reason: lexical_ambiguity
  - marker: b
    text: ‘आसाफ का’ रचनाकारिता, आसाफ से जुड़े गायक-दल या परंपरा, अथवा आसाफ को समर्पण का संकेत दे सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: संगीत-निर्देशक के लिए
  rationale: भजनों के शीर्षकों में यह पद संगीत-प्रस्तुति की देखरेख करने वाले व्यक्ति को सूचित करता है। ‘संगीत-निर्देशक’ आधुनिक हिन्दी में स्वाभाविक है और केवल सामान्य नेतृत्व के बजाय संगीतमय संदर्भ को स्पष्ट रखता है।
- source_word: בִּנְגִינֹת
  choice: तार वाले वाद्यों के साथ
  rationale: यह बहुवचन संज्ञा तार वाले वाद्यों अथवा उनसे उत्पन्न संगीत की ओर संकेत करती है। यह अनुवाद वाद्य-संबंधी अर्थ को बनाए रखता है, पर बजाने की ऐसी विधि नहीं जोड़ता जो मूल में स्पष्ट नहीं है।
- source_word: מִזְמוֹר
  choice: भजन
  rationale: यह भजन-संग्रह में प्रयुक्त मानक काव्य-संगीत विधा-सूचक शब्द है। ‘भजन’ हिन्दी पाठकों के लिए स्वाभाविक और प्रतिष्ठित समतुल्य है।
- source_word: לְאָסָף
  choice: आसाफ का
  rationale: शीर्षक में לְ संबंध, रचना, समर्पण या आसाफ से जुड़े समूह का संकेत दे सकता है। संक्षिप्त ‘आसाफ का’ इस संबंध को व्यक्त करता है, जबकि पादटिप्पणी उसकी वास्तविक व्यापकता बनाए रखती है।
- source_word: שִׁיר
  choice: एक गीत
  rationale: यह מִזְמוֹר के साथ रखा गया दूसरा विधा-सूचक शब्द है। ‘एक गीत’ दोनों पदों के भेद और संयुक्त वर्गीकरण को सुरक्षित रखता है।
theological_decisions:
- issue: לְאָסָף में आसाफ से संबंध की प्रकृति
  choice: मुख्य पाठ में ‘आसाफ का’, साथ में स्पष्टीकरण
  alternative: ‘आसाफ द्वारा रचित’ या ‘आसाफ के लिए’
  rationale: इब्रानी संबंधवाचक उपसर्ग केवल व्यक्तिगत रचनाकारिता निश्चित नहीं करता; वह रचनाकारिता, आसाफ से जुड़े गायक-दल/परंपरा, अथवा समर्पण को सूचित कर सकता है। इसलिए किसी एक अर्थ को धर्मवैज्ञानिक या ऐतिहासिक रूप से थोपना उचित नहीं।
translation_notes:
  register: भाषा आधुनिक, सुबोध और गरिमापूर्ण रखी गई है। शीर्षक की संक्षिप्त पूजा-संगीत शैली बनाए रखने के लिए छोटे पदबंध और विरामचिह्न प्रयुक्त हैं। ‘संगीत-निर्देशक’ सामान्य पाठक के लिए स्पष्ट है; ‘भजन—एक गीत’ इब्रानी के दोनों विधा-सूचक पदों को अलग भी रखता है और उनका निकट संबंध भी दिखाता है।
