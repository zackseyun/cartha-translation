  text: You are radiant[a], more majestic than the mountains of prey.
translation:
  language: hi
  text: आप तेजोमय हैं, शिकार के पहाड़ों से भी अधिक प्रतापी हैं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “लूट के पहाड़ों से भी अधिक प्रतापी।” हिब्रू शब्द का अर्थ “शिकार” और विस्तारित अर्थ में “लूट” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: נָאוֹר
  choice: तेजोमय
  rationale: यह शब्द चमक, प्रकाश और वैभव का भाव व्यक्त करता है। ‘तेजोमय’ आधुनिक हिन्दी में स्वाभाविक और गरिमापूर्ण है तथा यह नहीं सुझाता कि प्रकाश किसी और से प्राप्त हुआ है।
- source_word: אַתָּה
  choice: आप ... हैं
  rationale: हिब्रू के क्रियारहित वाक्य में हिन्दी की स्वाभाविक विधेय-रचना के लिए ‘हैं’ जोड़ा गया है; परमेश्वर के संबोधन में आदरसूचक ‘आप’ रखा गया है।
- source_word: אַדִּיר
  choice: अधिक प्रतापी
  rationale: शब्द महिमा, वैभव और सामर्थ्य का भाव रखता है। आगे מִן होने के कारण तुलनात्मक अर्थ ‘अधिक’ उपयुक्त है; ‘प्रतापी’ महिमा और सामर्थ्य दोनों को समेटता है।
- source_word: מֵהַרְרֵי
  choice: पहाड़ों से भी
  rationale: מִן को यहाँ तुलना-सूचक ‘से’ समझा गया है। हिन्दी में तुलना को स्पष्ट और काव्यात्मक बनाने के लिए ‘भी’ जोड़ा गया है।
- source_word: טָרֶף
  choice: लूट
  rationale: इस संज्ञा का मूल अर्थ शिकारी का शिकार है, पर इसका विस्तारित अर्थ लूटी हुई वस्तु या लूट भी है। इस प्रसंग में ‘लूट के पहाड़’ हिन्दी में अपेक्षाकृत बोधगम्य काव्य-चित्र देता है; ‘शिकार’ को पादटिप्पणी में सुरक्षित रखा गया है।
theological_decisions:
- issue: מֵהַרְרֵי טָרֶף का अर्थ और संबंध
  choice: 'तुलनात्मक अर्थ: परमेश्वर लूट के पहाड़ों से अधिक प्रतापी हैं।'
  alternative: 'वियोग/स्थान-सूचक अर्थ: परमेश्वर शिकार के पहाड़ों से प्रकाशमान होकर आते हैं; अथवा טָרֶף को ‘शिकार’ समझना।'
  rationale: אַדִּיר के साथ מִן तुलनात्मक अर्थ को दृढ़ समर्थन देता है। फिर भी טָרֶף के ‘शिकार’ और ‘लूट’ दोनों अर्थ वास्तविक हैं, इसलिए वैकल्पिक अर्थ पादटिप्पणी में दिया गया है और किसी खास ऐतिहासिक या सांप्रदायिक व्याख्या को मूल पाठ में नहीं थोपा गया।
translation_notes:
  register: भाषा आधुनिक, काव्यात्मक और गरिमापूर्ण रखी गई है। ‘आप’ आदरसूचक संबोधन है। ‘तेजोमय’ प्रकाशमय वैभव को और ‘प्रतापी’ महिमा तथा सामर्थ्य को व्यक्त करता है।
