base_translation:
  language: en
  yaml_path: translation/ot/psalms/076/012.yaml
  text: He cuts off the spirit of princes[b][a]; he is feared by the kings of the earth.
translation:
  language: hi
  text: वह शासकों का मनोबल तोड़ देता है[a]; पृथ्वी के राजा उससे भय मानते हैं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह शासकों की आत्मा या साहस को रोक देता है”; “आत्मा” का अर्थ “श्वास,” “साहस” या “मनोभाव” भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “वह पृथ्वी के राजाओं के लिए भयावह है।”
    reason: alternative_reading
lexical_decisions:
- source_word: יִבְצֹר
  choice: तोड़ देता है
  rationale: בצר का यहाँ अर्थ निर्णायक रूप से काटना, घटाना या वश में करना है। ‘आत्मा को तोड़ देता है’ आधुनिक हिन्दी में शासकों के घमंड और साहस को दबा देने का बल स्वाभाविक रूप से व्यक्त करता है, बिना इसे केवल शारीरिक मृत्यु तक सीमित किए।
- source_word: רוּחַ
  choice: आत्मा
  rationale: רוּחַ का अर्थ आत्मा, श्वास, साहस या मनोभाव हो सकता है। ‘आत्मा’ मूल की अर्थ-व्याप्ति बनाए रखती है; अन्य संभावनाएँ पादटिप्पणी में दी गई हैं।
- source_word: נְגִידִים
  choice: प्रधानों
  rationale: נְגִידִים नेताओं, शासकों या राजकुमारों को सूचित करता है। ‘प्रधान’ काव्यात्मक और गरिमापूर्ण है तथा अगले खंड के ‘राजा’ के साथ उपयुक्त समानांतर बनाता है।
- source_word: נוֹרָא
  choice: भय खाते हैं
  rationale: נוֹרָא उस व्यक्ति को सूचित करता है जो भय उत्पन्न करता या भययोग्य है। לְמַלְכֵי के साथ ‘राजा उससे भय खाते हैं’ स्वाभाविक हिन्दी में संबंध को स्पष्ट करता है।
- source_word: לְמַלְכֵי אָרֶץ
  choice: पृथ्वी के राजा उससे
  rationale: 'לְ यहाँ संबंधसूचक है: वह पृथ्वी के राजाओं के लिए भयावह है। हिन्दी में इसे कर्तृवाच्य रूप ‘पृथ्वी के राजा उससे भय खाते हैं’ में स्पष्ट और स्वाभाविक ढंग से व्यक्त किया गया है।'
theological_decisions:
- issue: शासकों के प्रति परमेश्वर की कार्रवाई का स्वरूप
  choice: परमेश्वर शासकों की आत्मा—उनके साहस, घमंड या भीतरी दृढ़ता—को निर्णायक रूप से तोड़ देता है।
  alternative: वह उनका श्वास अथवा जीवन छीन लेता है; या वह उनके क्रोध अथवा साहस को रोकता है।
  rationale: בצר और רוּחַ दोनों में अर्थगत विस्तार है। भजन का संदर्भ पृथ्वी के शासकों पर परमेश्वर की सर्वोच्चता दिखाता है; इसलिए मुख्य पाठ व्यापक अर्थ रखता है और मृत्यु अथवा किसी एक मनोभाव को अनावश्यक रूप से निश्चित नहीं करता।
- issue: राजाओं के लिए परमेश्वर का भयावह होना
  choice: पृथ्वी के राजा उससे भय खाते हैं।
  alternative: वह पृथ्वी के राजाओं के लिए भयावह है।
  rationale: दोनों वाक्य נוֹרָא לְמַלְכֵי אָרֶץ का संभव अर्थ देते हैं। मुख्य पाठ प्राकृतिक हिन्दी में परिणाम व्यक्त करता है, जबकि पादटिप्पणी मूल की विशेषणात्मक रचना सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, संक्षिप्त और काव्यात्मक रखी गई है। ‘प्रधानों’ और ‘पृथ्वी के राजा’ भजन की गरिमा तथा समानांतरता बनाए रखते हैं। दोनों पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
