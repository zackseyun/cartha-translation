  text: נִֽדֲר֣וּ וְ/שַׁלְּמוּ֮ לַ/יהוָ֪ה אֱֽלֹהֵ֫י/כֶ֥ם כָּל סְבִיבָ֑י/ו יוֹבִ֥ילוּ שַׁ֝֗י לַ/מּוֹרָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/076/011.yaml
  text: Make vows to Yahweh your God and fulfill them[b][a]; let all around him bring tribute to the Fearsome One.
translation:
  language: hi
  text: अपने परमेश्वर याहवे को मन्नतें मानो और उन्हें पूरा करो; उसके चारों ओर के सब लोग उस भययोग्य को भेंट[a] लाएँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘नज़राना’ अथवा ‘उपहार।’ इब्रानी शब्द שַׁי किसी सम्मानित श्रेष्ठ व्यक्ति को दी जाने वाली भेंट को दर्शा सकता है और इसमें राजकीय नज़राने का भाव भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: נִדֲרוּ
  choice: मन्नतें मानो
  rationale: बहुवचन आज्ञार्थक क्रिया है। आधुनिक हिन्दी में ‘मन्नत मानना’ स्वाभाविक पदबंध है और धार्मिक प्रतिज्ञा का भाव स्पष्ट करता है।
- source_word: וְשַׁלְּמוּ
  choice: और उन्हें पूरा करो
  rationale: यहाँ שלם का अर्थ मानी हुई मन्नतों को चुकाना अथवा पूरा करना है। ‘उन्हें’ पिछले पद की मन्नतों को स्पष्ट रूप से संदर्भित करता है।
- source_word: לַיהוָה אֱלֹהֵיכֶם
  choice: याहवे अपने परमेश्वर के लिए
  rationale: प्रत्यक्ष संबोधन में वाचा-नाम יהוה को ‘याहवे’ रखा गया है; אֱלֹהֵיכֶם द्वितीय पुरुष बहुवचन में ‘अपने परमेश्वर’ है। परसर्ग ‘के लिए’ मन्नत मानने और पूरी करने, दोनों के संबंध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: כָּל סְבִיבָיו
  choice: उसके चारों ओर के सब लोग
  rationale: बहुवचन क्रिया के कारण यह स्थानों के बजाय आसपास के व्यक्तियों अथवा लोगों को सूचित करता है। ‘लोग’ जोड़ना हिन्दी में संदर्भ स्पष्ट करता है।
- source_word: יוֹבִילוּ
  choice: लाएँ
  rationale: हिफ़ील रूप यहाँ किसी भेंट को आदरपूर्वक लेकर आने का अर्थ देता है; ‘लाएँ’ सहज और प्रसंगानुकूल है।
- source_word: שַׁי
  choice: भेंट
  rationale: यह किसी श्रेष्ठ अथवा सम्मानित व्यक्ति के सामने लाई गई भेंट या नज़राने को दर्शा सकता है। ‘भेंट’ सामान्य पाठक के लिए स्वाभाविक है, जबकि राजनीतिक कर का अर्थ अनावश्यक रूप से निश्चित नहीं करता।
- source_word: לַמּוֹרָא
  choice: उस भययोग्य को
  rationale: מוֹרָא भय और विस्मय उत्पन्न करने वाले के लिए उपाधि की तरह प्रयुक्त है। ‘भययोग्य’ परमेश्वर को उचित भय और श्रद्धा का पात्र बताता है, बिना भाव को केवल प्रेरणादायक ‘अद्भुत’ तक सीमित किए।
theological_decisions:
- issue: יהוה दिव्य नाम का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में वाचा-नाम सीधे उपस्थित है। लिप्यंतरण उसे सामान्य उपाधि में बदलने के बजाय नाम के रूप में सुरक्षित रखता है।
- issue: לַמּוֹרָא को दिव्य उपाधि के रूप में व्यक्त करना
  choice: उस भययोग्य को
  alternative: उस भयानक को; उस विस्मयकारी को; जिससे भय मानना चाहिए उसे
  rationale: भजन के प्रसंग में परमेश्वर की ऐसी महिमा सामने है जो भय और विस्मय दोनों उत्पन्न करती है। ‘भययोग्य’ इस तनाव को बनाए रखता है और परमेश्वर को मात्र डरावना कहने से बचता है।
translation_notes:
  register: भाषा आधुनिक, काव्यात्मक और गरिमापूर्ण रखी गई है। ‘मन्नतें मानो’, ‘पूरा करो’ और ‘भेंट लाएँ’ सामान्य हिन्दी में स्पष्ट हैं। ‘भययोग्य’ अपेक्षाकृत साहित्यिक है, पर मूल की दिव्य उपाधि तथा भय-विस्मय के संयुक्त भाव को संक्षेप में सुरक्षित रखता है।
