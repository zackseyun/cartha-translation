translation:
  language: hi
  text: वहीं उसने धनुष के चमकते बाणों[a], ढाल, तलवार और युद्ध[b] को चकनाचूर कर दिया। सेला।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘धनुष के अग्निबाणों।’ इब्रानी अभिव्यक्ति का शाब्दिक बिंब ‘धनुष की ज्वालाएँ/चमकें’ है और काव्यात्मक रूप से बाणों की ओर संकेत करता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘लड़ाई’ अथवा ‘युद्ध-स्थिति।’
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמָּה
  choice: वहीं
  rationale: यह स्थानवाचक क्रियाविशेषण पिछले पद में बताए स्थान की ओर संकेत करता है; पद स्वयं स्थान का नाम दोबारा नहीं लेता।
- source_word: שִׁבַּר
  choice: चकनाचूर कर दिया
  rationale: पिएल रूप बलपूर्वक और निर्णायक ढंग से तोड़ने का भाव देता है; यह अभिव्यक्ति काव्य की तीव्रता बनाए रखती है।
- source_word: רִשְׁפֵי קָשֶׁת
  choice: धनुष के चमकते बाणों
  rationale: רשף में ज्वाला या बिजली जैसी चमक का बिंब है और धनुष के साथ यह बाणों को सूचित करता है। ‘चमकते बाण’ बाण का अर्थ स्पष्ट रखते हुए मूल बिंब को भी बचाता है।
- source_word: מָגֵן
  choice: ढाल
  rationale: युद्ध में प्रयुक्त रक्षात्मक साधन के लिए स्वाभाविक और सटीक हिन्दी शब्द।
- source_word: וְחֶרֶב
  choice: तलवार
  rationale: युद्ध-सामग्री की समन्वित सूची में इसका सीधा और स्वाभाविक अनुवाद।
- source_word: וּמִלְחָמָה
  choice: और युद्ध
  rationale: מִלְחָמָה का अर्थ युद्ध या लड़ाई हो सकता है। विशिष्ट हथियारों के बाद ‘युद्ध’ पूरी सशस्त्र मुठभेड़ को चरम बिंदु के रूप में प्रस्तुत करता है।
- source_word: סֶלָה
  choice: सेला
  rationale: इस उपासना-संगीत संबंधी संकेत का ठीक अर्थ अनिश्चित है, इसलिए पारंपरिक लिप्यंतरण रखा गया है।
theological_decisions:
- issue: तीसरे पुरुष एकवचन क्रिया का निहित कर्ता
  choice: ‘उसने’—आसपास के संदर्भ से परमेश्वर
  alternative: कोई अनिर्दिष्ट पुल्लिंग एकवचन कर्ता
  rationale: इस पद में कर्ता स्पष्ट रूप से लिखा नहीं है, पर निकट संदर्भ परमेश्वर को कार्य करनेवाले के रूप में पहचानता है। सर्वनाम मूल की निहितता को बनाए रखता है और पद में नाम नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण काव्यात्मक शैली रखी गई है। हथियारों और स्वयं युद्ध की असामान्य क्रमिक सूची को मूल के काव्यात्मक तनाव सहित बनाए रखा गया है।
