  text: נוֹדָ֣ע בִּֽ/יהוּדָ֣ה אֱלֹהִ֑ים בְּ֝/יִשְׂרָאֵ֗ל גָּד֥וֹל שְׁמֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/076/001.yaml
  text: God is known in Judah[b][a]; his name is great in Israel.
translation:
  language: hi
  text: 'यहूदा में परमेश्वर जाना जाता है[a];

    इस्राएल में उसका नाम महान है[b]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘परमेश्वर ने यहूदा में अपने आपको प्रकट किया है’; इब्रानी रूप का अर्थ ‘जाना जाता है’ भी हो सकता है और प्रसंग में किसी प्रकट होने की घटना की ओर भी संकेत कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘नाम’ से केवल बोला जाने वाला नाम नहीं, बल्कि परमेश्वर की प्रकट पहचान, प्रतिष्ठा या यश भी अभिप्रेत हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: נוֹדָע
  choice: जाना जाता है
  rationale: ידע के निफ़अल रूप का सामान्य स्थितिवाचक/कर्मवाच्य अर्थ सुरक्षित रहता है। यह काव्यात्मक संक्षिप्तता बनाए रखता है और आत्मवाचक अर्थ को मुख्य पाठ में अनावश्यक रूप से नहीं जोड़ता।
- source_word: בִּיהוּדָה
  choice: यहूदा में
  rationale: स्थान अथवा समुदाय के नाम के साथ ב का स्वाभाविक हिन्दी रूप ‘में’ है; इससे भौगोलिक और सामुदायिक दोनों संकेत खुले रहते हैं।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: यहाँ शब्द अर्थ और वाक्य-विन्यास में एकवचन है तथा इस्राएल के परमेश्वर को सूचित करता है। आधुनिक हिन्दी बाइबलीय भाषा में ‘परमेश्वर’ स्वाभाविक और गरिमापूर्ण है।
- source_word: בְּיִשְׂרָאֵל
  choice: इस्राएल में
  rationale: यहूदा के समानांतर ב का अनुवाद ‘में’ करने से इब्रानी पद की समरूप काव्य-रचना बनी रहती है।
- source_word: גָּדוֹל
  choice: महान
  rationale: विशेषण का सीधा अर्थ ‘महान’ है। ‘महिमामय’ या ‘ऊँचा किया गया’ जैसे विकल्प मूल में निहित न होने वाला अधिक व्याख्यात्मक अर्थ जोड़ेंगे।
- source_word: שְׁמוֹ
  choice: उसका नाम
  rationale: शाब्दिक अभिव्यक्ति को बनाए रखा गया है। इब्रानी काव्य में ‘नाम’ प्रकट पहचान, प्रतिष्ठा या यश को भी सूचित कर सकता है।
theological_decisions:
- issue: परमेश्वर के ‘नाम’ का अर्थ
  choice: मुख्य पाठ में ‘उसका नाम महान है’ रखा गया।
  alternative: उसका यश महान है / उसका बहुत आदर होता है
  rationale: ‘नाम’ की ठोस बाइबलीय अभिव्यक्ति परमेश्वर की प्रकट पहचान और प्रतिष्ठा का धर्मवैचारिक भार बनाए रखती है, जबकि पद को केवल प्रसिद्धि या सम्मान तक सीमित नहीं करती।
- issue: נוֹדָע का स्थितिवाचक या घटनात्मक भाव
  choice: मुख्य पाठ में ‘जाना जाता है’ रखा गया।
  alternative: उसने अपने आपको प्रकट किया है
  rationale: निफ़अल रूप दोनों सूक्ष्मताओं की अनुमति दे सकता है। स्थितिवाचक अनुवाद मूल की संक्षिप्तता और अस्पष्टता को बेहतर सुरक्षित रखता है; घटनात्मक संभावना पादटिप्पणी में दी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण काव्यात्मक शैली रखी गई है। समानांतर पंक्तियों में ‘यहूदा में’ और ‘इस्राएल में’ की संरचना सुरक्षित है। ‘जाना जाता है’ स्वाभाविक कर्मवाच्य है, और पादटिप्पणी मूल की वास्तविक अर्थगत संभावना स्पष्ट करती है।
