id: PSA.76.10
reference: Psalms 76:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּֽי חֲמַ֣ת אָדָ֣ם תּוֹדֶ֑/ךָּ שְׁאֵרִ֖ית חֵמֹ֣ת תַּחְגֹּֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/076/010.yaml
  text: For the wrath of man will praise you[b][a]; with the remnant of wrath you will gird yourself.
translation:
  language: hi
  text: क्योंकि मानव का क्रोध आपकी स्तुति करेगा[b]; बचे हुए क्रोध को आप अपने चारों ओर बाँध लेंगे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बचे हुए क्रोध को आप रोक रखेंगे।” अंतिम उपवाक्य का इब्रानी पाठ कठिन है; मुख्य पाठ मसोरेटिक शब्द-रूप के अधिक निकट रहकर उसके रूपक को बनाए रखता है।
    reason: alternative_reading
  - marker: b
    text: यहाँ “मानव” से सामान्य रूप से समस्त मानवजाति का बोध होता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन का आधार या कारण बताता है; ‘क्योंकि’ इसके कारणसूचक बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: חֲמַת אָדָם
  choice: मानव का क्रोध
  rationale: חֵמָה का अर्थ क्रोध, रोष या प्रचंड कोप है, और אָדָם यहाँ किसी एक पुरुष के बजाय सामान्य रूप से मानवजाति को सूचित करता है। ‘मानव का क्रोध’ संक्षिप्त और काव्यात्मक है।
- source_word: תּוֹדֶךָּ
  choice: आपकी स्तुति करेगा
  rationale: ידה का हिफ़ील रूप धन्यवाद देने या स्तुति करने का अर्थ देता है। यहाँ आशय यह है कि मानव का क्रोध अंततः परमेश्वर की स्तुति का कारण बनेगा; हिन्दी में ‘आपकी स्तुति करेगा’ स्वाभाविक है।
- source_word: שְׁאֵרִית
  choice: बचा हुआ
  rationale: यह शब्द शेष रह गई वस्तु को दर्शाता है। ‘बचा हुआ’ सामान्य आधुनिक हिन्दी में स्पष्ट है और शेष क्रोध की छवि को बनाए रखता है।
- source_word: חֵמֹת
  choice: क्रोध
  rationale: इब्रानी में रूप बहुवचन है, पर यहाँ इसे सामूहिक या तीव्रतासूचक माना जा सकता है; हिन्दी में भाववाचक एकवचन ‘क्रोध’ अधिक स्वाभाविक है।
- source_word: תַּחְגֹּר
  choice: आप अपने चारों ओर बाँध लेंगे
  rationale: חגר का मूल अर्थ कमर या शरीर के चारों ओर किसी वस्तु को बाँधना है। यह अनुवाद रूपक को बनाए रखता है और यह तय नहीं करता कि आशय उसे पहनने, धारण करने या नियंत्रित करने से है।
theological_decisions:
- issue: अंतिम उपवाक्य שְׁאֵרִית חֵמֹת תַּחְגֹּר की व्याख्या
  choice: परमेश्वर कर्ता हैं और बचे हुए क्रोध को रूपकतः अपने चारों ओर बाँधते हैं।
  alternative: आप बचे हुए क्रोध को रोक रखेंगे; अथवा बचा हुआ क्रोध उत्सवपूर्वक आपको घेरेगा।
  rationale: द्वितीय पुरुष एकवचन क्रिया का सबसे सीधा कर्ता परमेश्वर हैं। इब्रानी उपवाक्य कठिन है; मसोरेटिक पाठ के रूपक को मुख्य पाठ में बनाए रखना किसी एक व्याख्यात्मक समाधान को अनावश्यक रूप से निश्चित करने से बचाता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में है, पर भजन की गरिमामय काव्यात्मकता बनाए रखी गई है। परमेश्वर के लिए आदरसूचक ‘आप’ प्रयुक्त हुआ है। कठिन अंतिम रूपक को व्याख्यात्मक रूप से समतल नहीं किया गया।
