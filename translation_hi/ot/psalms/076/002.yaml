  text: His shelter was in Salem[b][a], and his dwelling place in Zion.
translation:
  language: hi
  text: 'शालेम में उसका आश्रय[a][b] था,

    और सिय्योन में उसका निवास-स्थान।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शालेम की पहचान परंपरागत रूप से यरूशलेम से की जाती है; इस पद में शालेम और सिय्योन को परमेश्वर के निवास के नामों के रूप में समानांतर रखा गया है।
    reason: cross_reference
  - marker: b
    text: '‘आश्रय’ के लिए अन्य संभावित अनुवाद: ‘मंडप,’ ‘झोंपड़ी’ या ‘छत्र।’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: था
  rationale: यहाँ היה का रूप परमेश्वर के आश्रय के स्थान को बताने वाला सामान्य अस्तित्वसूचक/संयोजक क्रिया-रूप है; हिंदी में ‘था’ स्वाभाविक और पर्याप्त रूप से औपचारिक है।
- source_word: בְשָׁלֵם
  choice: शालेम में
  rationale: שָׁלֵם स्थान-नाम ‘शालेम’ है। मूल पाठ के विशिष्ट नाम को बनाए रखना उसे मुख्य पाठ में सीधे ‘यरूशलेम’ मान लेने से अधिक स्रोत-संगत है।
- source_word: סֻכּוֹ
  choice: उसका आश्रय
  rationale: סֻכָּה का मूल अर्थ छाया या सुरक्षा देने वाला आश्रय/झोंपड़ी है। ‘आश्रय’ आधुनिक हिंदी में स्पष्ट है और अनावश्यक रूप से तकनीकी उपासना-संबंधी अर्थ आरोपित नहीं करता।
- source_word: וּמְעוֹנָתוֹ
  choice: और उसका निवास-स्थान
  rationale: מְעוֹנָה रहने के स्थान या निवास को दर्शाता है। ‘निवास-स्थान’ समानांतर पंक्ति में स्थानवाचक अर्थ स्पष्ट रखता है।
- source_word: בְצִיּוֹן
  choice: सिय्योन में
  rationale: צִיּוֹן विशिष्ट स्थान-नाम है; हिंदी बाइबलीय प्रयोग में प्रचलित रूप ‘सिय्योन’ रखा गया है।
theological_decisions:
- issue: ‘शालेम’ और ‘सिय्योन’ का संबंध
  choice: मुख्य पाठ में दोनों स्थान-नाम अलग-अलग रखे गए हैं।
  alternative: ‘शालेम’ का अनुवाद ‘यरूशलेम’ करना।
  rationale: इब्रानी पद काव्यात्मक समानांतरता में शालेम और सिय्योन दोनों को परमेश्वर के निवास से जोड़ता है। दोनों नाम बनाए रखने से मूल की काव्यात्मक और धर्मवैचारिक बनावट सुरक्षित रहती है तथा उनकी पहचान को मुख्य पाठ में चुपचाप निश्चित नहीं किया जाता।
translation_notes:
  register: आधुनिक, सरल और गरिमापूर्ण हिंदी; काव्यात्मक समानांतरता बनाए रखने के लिए पद को दो पंक्तियों में रखा गया है। ‘शालेम’ को व्याख्यात्मक रूप से ‘यरूशलेम’ नहीं बनाया गया और ‘सिय्योन’ का प्रचलित हिंदी रूप रखा गया है।
