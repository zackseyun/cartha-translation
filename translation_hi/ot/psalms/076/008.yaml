  yaml_path: translation/ot/psalms/076/008.yaml
  text: From heaven you made judgment heard[c][b][a]; the earth feared and was quiet.
translation:
  language: hi
  text: 'स्वर्ग से तूने न्याय सुनाया[a];

    पृथ्वी डर गई और शांत हो गई[b]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “स्वर्ग से तूने न्याय सुनवा दिया।”
    reason: lexical_alternative
  - marker: b
    text: या, “पृथ्वी डर गई और निश्चल हो गई।”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשָּׁמַיִם
  choice: स्वर्ग से
  rationale: מִן स्रोत को दर्शाता है और שָׁמַיִם यहाँ सामूहिक अर्थ में दिव्य क्षेत्र को सूचित करता है। आधुनिक हिन्दी में ‘स्वर्ग से’ स्वाभाविक है और स्वर्ग-पृथ्वी का काव्यात्मक विरोध बनाए रखता है।
- source_word: הִשְׁמַעְתָּ דִּין
  choice: तूने अपना न्याय सुनाया
  rationale: שׁמע का हिफ़ईल रूप किसी बात को सुनाने या सुनाई देने देने का कारक भाव रखता है। ‘न्याय सुनाया’ हिन्दी में स्वाभाविक रहते हुए उस भाव को व्यक्त करता है; ‘अपना’ केवल यह स्पष्ट करता है कि न्याय परमेश्वर का है, जैसा द्वितीय पुरुष क्रिया और प्रसंग से निहित है।
- source_word: אֶרֶץ
  choice: पृथ्वी
  rationale: אֶרֶץ का अर्थ ‘देश/भूमि’ भी हो सकता है, पर ‘स्वर्ग से’ के साथ यहाँ व्यापक ब्रह्मांडीय विरोध ‘पृथ्वी’ को अधिक उपयुक्त बनाता है।
- source_word: יָרְאָה
  choice: डर गई
  rationale: ירא भय और श्रद्धामिश्रित विस्मय दोनों व्यक्त कर सकता है। न्याय के प्रसंग में ‘डर गई’ सीधा, संक्षिप्त और काव्यात्मक प्रतिक्रिया को बनाए रखता है।
- source_word: וְשָׁקָטָה
  choice: और शांत हो गई
  rationale: שׁקט शोर या हलचल के थमने, निश्चल होने अथवा विश्राम पाने को व्यक्त करता है। ‘शांत हो गई’ आधुनिक हिन्दी में सहज है और परिणामी स्थिति का संकेत देता है।
theological_decisions:
- issue: אֶרֶץ का दायरा
  choice: समूची पृथ्वी
  alternative: देश या भूमि, संभवतः अधिक स्थानीय अर्थ में
  rationale: स्वर्ग और पृथ्वी का काव्यात्मक विरोध व्यापक विश्वव्यापी परिप्रेक्ष्य का समर्थन करता है, यद्यपि मूल शब्द में स्थानीय ‘भूमि’ का अर्थ भी संभव है।
- issue: न्याय पर पृथ्वी की प्रतिक्रिया
  choice: वास्तविक भय और फिर शांति
  alternative: श्रद्धामिश्रित विस्मय और निश्चलता
  rationale: मूल क्रियाएँ भय/विस्मय तथा शांत/निश्चल होने की अर्थ-सीमा रखती हैं। मुख्य पाठ न्याय के प्रसंग का सीधा अर्थ देता है और दूसरे पद की वैकल्पिक छाया पादटिप्पणी में रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण काव्यात्मक शैली रखी गई है। परमेश्वर के लिए एकवचन आत्मीय ‘तू’ भजन की सीधी संबोधन-शैली और क्रिया के एकवचन रूप के अनुरूप है।
