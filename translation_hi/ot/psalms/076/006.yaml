source:
  edition: WLC
  text: מִ֭/גַּעֲרָ֣תְ/ךָ אֱלֹהֵ֣י יַעֲקֹ֑ב נִ֝רְדָּ֗ם וְ/רֶ֣כֶב וָ/סֽוּס׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/076/006.yaml
  text: At your rebuke[a], O God of Jacob[b], both chariot and horse were cast into a deep sleep.
translation:
  language: hi
  text: 'हे याकूब के परमेश्वर, आपकी डाँट से[a]

    रथ और घोड़ा दोनों गहरी नींद में पड़ गए।[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘आपकी डाँट के कारण।’
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक रूप से ‘रथ और घोड़ा’ है। यह सैन्य शक्ति को दर्शाने वाला काव्यात्मक युग्म है; कुछ लोग इस चित्र में उनके सवारों को भी सम्मिलित समझते हैं।
    reason: cultural_note
lexical_decisions:
- source_word: מִגַּעֲרָתְךָ
  choice: आपकी डाँट से
  rationale: מִן यहाँ स्रोत या कारण व्यक्त कर सकता है। ‘से’ हिन्दी में दोनों संभावनाएँ खुली रखता है और परमेश्वर की धमकी-भरी डाँट का तत्काल प्रभाव स्वाभाविक ढंग से बताता है।
- source_word: אֱלֹהֵי יַעֲקֹב
  choice: हे याकूब के परमेश्वर
  rationale: यह रचना-संबंधी पदबंध एक ईश्वरीय उपाधि है; ‘हे’ काव्य-संदर्भ में प्रत्यक्ष संबोधन को स्पष्ट करता है।
- source_word: נִרְדָּם
  choice: गहरी नींद में पड़ गए
  rationale: רדם का निफ़ाल रूप साधारण नींद के बजाय गहरी नींद या स्तब्धता में पड़ने का भाव देता है। यह अनायास निष्क्रिय हो जाने की छवि बनाए रखता है, बिना उसे स्पष्टतः मृत्यु कहे।
- source_word: וְרֶכֶב וָסוּס
  choice: रथ और घोड़ा दोनों
  rationale: इब्रानी पाठ युद्ध-रथ और घोड़े का नाम लेता है। ‘दोनों’ इस युग्म को स्वाभाविक हिन्दी में उभारता है; ‘सवार’ कहना पाठ से अधिक व्याख्यात्मक होता।
theological_decisions:
- issue: वर्णित पराजय का स्वरूप
  choice: परमेश्वर की डाँट शत्रु की सैन्य शक्ति को गहरी नींद या स्तब्धता की काव्यात्मक छवि द्वारा असहाय कर देती है।
  alternative: इसे केवल वास्तविक नींद, अथवा स्पष्ट रूप से मृत्यु और पूर्ण विनाश का कथन समझना।
  rationale: נִרְדָּם गहरी नींद या स्तब्धता की छवि देता है। विजय के संदर्भ में यह सैन्य शक्ति की निष्क्रियता बताता है, पर पद स्वयं न तो इसे केवल साधारण नींद तक सीमित करता है, न सीधे मृत्यु कहता है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। काव्यात्मक संबोधन के लिए ‘हे’ रखा गया है। ‘डाँट’ सामान्य पाठक के लिए स्पष्ट है, जबकि ‘गहरी नींद’ मूल की निष्क्रियता और संभावित मृत्यु-सदृश छवि के बीच का तनाव सुरक्षित रखती है।
