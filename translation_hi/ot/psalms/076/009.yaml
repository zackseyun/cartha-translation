  language: hi
  text: 'जब परमेश्वर न्याय करने के लिए उठ खड़े होते हैं,

    पृथ्वी[b] के सभी दीनों[a] को बचाने के लिए।

    सेला[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “नम्र लोग” अथवा “पीड़ित लोग।”
    reason: lexical_alternative
  - marker: b
    text: या, “देश।”
    reason: lexical_alternative
  - marker: c
    text: “सेला” का सटीक अर्थ अनिश्चित है; संभवतः यह संगीत या उपासना से जुड़ा संकेत है।
    reason: translation_note
lexical_decisions:
- source_word: בְּ/קוּם
  choice: जब ... उठे
  rationale: ב के साथ קום का infinitive construct यहाँ कालवाचक है। हिंदी में ‘जब ... उठे’ दैवी हस्तक्षेप को स्वाभाविक और काव्यात्मक ढंग से व्यक्त करता है।
- source_word: לַ/מִּשְׁפָּט
  choice: न्याय करने के लिए
  rationale: מִשְׁפָּט में न्याय और न्यायिक निर्णय दोनों का भाव है। यह प्रयोग परमेश्वर के न्यायिक कार्य को स्पष्ट रखता है, पर उसे किसी विशिष्ट अदालती दृश्य तक सीमित नहीं करता।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: यहाँ बहुवचन रूप एकवचन अर्थ में इस्राएल के परमेश्वर के लिए प्रयुक्त सामान्य पद है। आधुनिक हिंदी बाइबलीय शैली में ‘परमेश्वर’ स्वाभाविक और गरिमापूर्ण है।
- source_word: לְ/הוֹשִׁיעַ
  choice: बचाएँ
  rationale: ישׁע के हिफ़ील रूप का अर्थ बचाना या छुड़ाना है। ‘बचाएँ’ सीधा, व्यापक और सामान्य पाठक के लिए सहज है।
- source_word: כָּל
  choice: सब
  rationale: अगले संबंधवाची पद के साथ כָּל सामूहिक अर्थ देता है; ‘सब’ हिंदी में स्वाभाविक है।
- source_word: עַנְוֵי
  choice: दीनों
  rationale: עָנָו नम्र, नम्र-स्वभाव या दुःख-दमन झेलने वाले लोगों को सूचित कर सकता है। ‘दीन’ नैतिक नम्रता और सामाजिक निम्नता/पीड़ा—दोनों की गुंजाइश रखता है; अन्य अर्थ पादटिप्पणी में दिए गए हैं।
- source_word: אֶרֶץ
  choice: पृथ्वी
  rationale: אֶרֶץ का अर्थ पृथ्वी या देश हो सकता है। ‘सब दीनों’ के व्यापक काव्यात्मक संदर्भ में ‘पृथ्वी’ उपयुक्त है, जबकि ‘देश’ की संभावना पादटिप्पणी में सुरक्षित है।
- source_word: סֶלָה
  choice: सेला
  rationale: इस उपासना-संगीत संबंधी संकेत का सटीक अर्थ अनिश्चित है, इसलिए अर्थ आरोपित करने के बजाय इसका लिप्यंतरण किया गया है।
theological_decisions:
- issue: עַנְוֵי का अर्थ-क्षेत्र
  choice: दीनों
  alternative: नम्र लोगों; पीड़ितों
  rationale: पद परमेश्वर के न्यायिक हस्तक्षेप और निम्न अवस्था वाले लोगों के उद्धार की बात करता है। ‘दीन’ नैतिक विनम्रता और दुःख/उत्पीड़न दोनों की प्रतिध्वनि रखता है; पादटिप्पणी विकल्पों को खुला रखती है।
- issue: אֶרֶץ का भौगोलिक विस्तार
  choice: पृथ्वी
  alternative: देश
  rationale: काव्यात्मक कथन विश्वव्यापी भी समझा जा सकता है और किसी विशेष देश के संदर्भ में भी। मुख्य पाठ में व्यापक अर्थ रखा गया है और सीमित अर्थ पादटिप्पणी में सुरक्षित है।
