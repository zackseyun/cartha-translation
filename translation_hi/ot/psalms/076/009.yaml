  register: आधुनिक मानक हिंदी में संक्षिप्त, काव्यात्मक और गरिमापूर्ण शैली। ‘दीन’ सामान्य धार्मिक हिंदी में परिचित है और इब्रानी शब्द की नैतिक तथा सामाजिक दोनों छायाओं को कुछ हद तक बनाए रखता है। ‘उठे/बचाएँ’ का विधिलिंग-सदृश रूप कालवाचक ‘जब’ के साथ हिंदी में भावी या सामान्य दैवी हस्तक्षेप को स्वाभाविक रूप से व्यक्त करता है।
