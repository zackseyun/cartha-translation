id: PSA.79.10
reference: Psalms 79:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: לָ֤/מָּה יֹאמְר֣וּ הַ/גּוֹיִם֮ אַיֵּ֪ה אֱֽלֹהֵ֫י/הֶ֥ם יִוָּדַ֣ע ב/גיים לְ/עֵינֵ֑י/נוּ נִ֝קְמַ֗ת דַּֽם עֲבָדֶ֥י/ךָ הַ/שָּׁפֽוּךְ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/079/010.yaml
  text: Why should the nations say[b][a], “Where is their God?” Let the vengeance of your servants' shed blood be made known among the nations before our eyes.
translation:
  language: hi
  text: राष्ट्र क्यों कहें, “उनका परमेश्वर कहाँ है?” तेरे सेवकों के बहाए गए खून का प्रतिशोध राष्ट्रों के बीच हमारी आँखों के सामने प्रकट हो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָמָּה
  choice: क्यों
  rationale: यह उपहास के विरुद्ध आलंकारिक विरोध प्रकट करता है; हिन्दी में ‘क्यों कहें’ संभाव्य/प्रार्थनात्मक भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הַגּוֹיִם
  choice: राष्ट्र
  rationale: यहाँ इस्राएल के बाहर के राष्ट्र अभिप्रेत हैं; ‘राष्ट्र’ बाद की धार्मिक-जातीय अर्थछाया आरोपित नहीं करता।
- source_word: אַיֵּה אֱלֹהֵיהֶם
  choice: उनका परमेश्वर कहाँ है?
  rationale: सीधे उपहासपूर्ण प्रश्न को सरल और स्पष्ट रूप में बनाए रखता है।
- source_word: יִוָּדַע
  choice: प्रकट हो
  rationale: निफ़अल रूप के ‘ज्ञात हो/दिखाई दे’ भाव को सहज हिन्दी में व्यक्त करता है और सार्वजनिक रूप से प्रत्यक्ष होने का आशय रखता है।
- source_word: לְעֵינֵינוּ
  choice: हमारी आँखों के सामने
  rationale: दृश्य और प्रत्यक्ष रूप से होने के हिब्रू मुहावरे का स्वाभाविक हिन्दी समतुल्य है।
- source_word: נִקְמַת
  choice: प्रतिशोध
  rationale: मूल में न्याय मात्र नहीं, बदला चुकाने/प्रतिशोध लेने का स्पष्ट भाव है; इसे नरम नहीं किया गया।
- source_word: דַּם עֲבָדֶיךָ הַשָּׁפוּךְ
  choice: तेरे सेवकों के बहाए गए खून
  rationale: ‘खून’ हिंसक मृत्यु और रक्तदोष की मूर्त शक्ति बनाए रखता है; निष्क्रिय कृदंत ‘बहाए गए’ मूल संरचना को स्पष्ट करता है।
theological_decisions:
- issue: ईश्वरीय प्रतिशोध की प्रार्थना
  choice: ‘प्रतिशोध’ को स्पष्ट रूप से बनाए रखा गया
  alternative: ‘न्याय’ या ‘न्याय दिलाना’
  rationale: हिब्रू נִקְמַת प्रतिशोध/बदला चुकाने को स्पष्टतः व्यक्त करता है; केवल ‘न्याय’ कहना अभिशापात्मक प्रार्थना की तीव्रता घटा देता।
- issue: ‘हमारी आँखों के सामने’ का वाक्यगत संबंध
  choice: इसे प्रतिशोध के राष्ट्रों के बीच प्रकट होने से जोड़ा गया
  alternative: इसे केवल ‘प्रतिशोध’ पदबंध से अधिक निकटता से जोड़ना
  rationale: हिब्रू में कुछ वाक्यगत लचीलापन है, पर यह अनुवाद इस प्रार्थना को स्पष्ट करता है कि प्रार्थी स्वयं उस सार्वजनिक प्रतिफल को देखें।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। परमेश्वर को सीधे संबोधन में ‘तेरे’ रखा गया है, जो भजन की निकट और काव्यात्मक प्रार्थना-शैली के अनुकूल है।
