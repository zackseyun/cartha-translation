  verdict: revise
  source_fidelity: The perfect-resultative sense of הָיִינוּ is accurately represented by “बन गए हैं,” and both relational phrases (“पड़ोसियों के लिए,” “चारों ओर के लोगों के लिए”) preserve the Hebrew parallelism and scope. However, “निंदा” primarily denotes condemnation or criticism in modern Hindi and can miss the sense of public disgrace/reproach in חֶרְפָּה. “अपमान का विषय” more directly conveys the intended shame and object-of-contempt sense.
