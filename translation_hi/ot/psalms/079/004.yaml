  text: We have become a reproach to our neighbors[a], a mockery and derision to those around us.
translation:
  language: hi
  text: 'हम अपने पड़ोसियों के लिए अपमान का विषय बन गए हैं,

    और अपने चारों ओर के लोगों के लिए उपहास और ठट्ठे का विषय।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָיִינוּ
  choice: बन गए हैं
  rationale: हिब्रू का पूर्ण क्रियारूप बीती घटना से उत्पन्न वर्तमान दशा को व्यक्त करता है; इसलिए यह प्रयोग पूर्ण घटना और जारी परिणाम दोनों को सामने रखता है।
- source_word: חֶרְפָּה
  choice: निंदा का विषय
  rationale: यह संज्ञा सार्वजनिक अपमान और तिरस्कार के पात्र होने का भाव रखती है। केवल ‘निंदा’ की अपेक्षा ‘निंदा का विषय’ स्वाभाविक हिंदी में उस वस्तुगत भाव को स्पष्ट करता है।
- source_word: לִשְׁכֵנֵינוּ
  choice: अपने पड़ोसियों के लिए
  rationale: व्यक्तियों के साथ ל यहाँ संबंध अथवा संदर्भ दर्शाता है। ‘पड़ोसियों के लिए’ निकटवर्ती जातियों के सामने अपमान का विषय होने का अर्थ बनाए रखता है।
- source_word: לַעַג
  choice: उपहास
  rationale: यह शब्द हँसी उड़ाने और अपमानजनक मज़ाक का संकेत देता है; ‘उपहास’ काव्यात्मक गरिमा और संज्ञात्मक रचना दोनों बनाए रखता है।
- source_word: קֶלֶס
  choice: ठट्ठा
  rationale: यह ताने और तिरस्कारपूर्ण मज़ाक का भाव देता है। ‘ठट्ठा’ לַעַג से अर्थगत निकटता रखते हुए भी दूसरे शब्द के रूप में काव्यात्मक संचय को सुरक्षित रखता है।
- source_word: לִסְבִיבוֹתֵינוּ
  choice: अपने चारों ओर के लोगों के लिए
  rationale: शाब्दिक भाव ‘हमारे आसपास वालों’ का है। यह अभिव्यक्ति पहले खंड के ‘पड़ोसियों’ से कुछ व्यापक घेरा दर्शाती है और आधुनिक हिंदी में स्पष्ट है।
