  text: תָּ֤ב֣וֹא לְ/פָנֶי/ךָ֮ אֶנְקַ֪ת אָ֫סִ֥יר כְּ/גֹ֥דֶל זְרוֹעֲ/ךָ֑ ה֝וֹתֵ֗ר בְּנֵ֣י תְמוּתָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/079/011.yaml
  text: Let the groaning of the prisoner come before you; according to the greatness of your arm[a], preserve the children of death.
translation:
  language: hi
  text: बंदी की कराह तेरे सामने पहुँचे; तेरी भुजा की महान शक्ति के अनुसार उन लोगों को जीवित रख, जो मृत्यु के लिए ठहराए गए हैं[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “मृत्यु के पुत्र”; यह हिब्रू मुहावरा उन लोगों के लिए है जिनकी मृत्यु निश्चित या निकट समझी जाती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּבוֹא
  choice: पहुँचे
  rationale: प्रार्थना में प्रयुक्त इस अपूर्ण क्रिया के कामनात्मक भाव को हिंदी में विधिलिंग से व्यक्त किया गया है।
- source_word: לְפָנֶיךָ
  choice: तेरे सामने
  rationale: यह परमेश्वर की उपस्थिति में आने का स्वाभाविक और अर्थनिष्ठ हिंदी मुहावरा है।
- source_word: אֶנְקַת אָסִיר
  choice: बंदी की कराह
  rationale: אֶנְקַת पीड़ा में निकली कराह को और אָסִיר बंधन में पड़े व्यक्ति को दर्शाता है; यह संक्षिप्त हिंदी पद मूल की एकवचन सामूहिक अभिव्यक्ति बनाए रखता है।
- source_word: כְּגֹדֶל זְרוֹעֲךָ
  choice: अपनी भुजा के महान सामर्थ्य के अनुसार
  rationale: भुजा के ठोस हिब्रू रूपक को सुरक्षित रखते हुए 'सामर्थ्य' हिंदी में उसके आशय को स्वाभाविक ढंग से स्पष्ट करता है; כְּ माप या अनुरूपता व्यक्त करता है।
- source_word: הוֹתֵר
  choice: जीवित रख
  rationale: יתר के हिफ़ील आज्ञार्थक का आशय किसी को मृत्यु से बचाकर शेष रहने देना है; 'जीवित रख' इस प्रसंग में सीधा और स्पष्ट है।
- source_word: בְּנֵי תְמוּתָה
  choice: जो मृत्यु के लिए ठहराए गए हैं
  rationale: शाब्दिक रूप से 'मृत्यु के पुत्र' यह हिब्रू मुहावरा उन लोगों के लिए है जिन पर मृत्यु निकट या निश्चित है। हिंदी पाठ अर्थ स्पष्ट करता है, जबकि शाब्दिक रूप पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: בְּנֵי תְמוּתָה में मृत्यु की दशा या नियुक्ति
  choice: जो मृत्यु के लिए ठहराए गए हैं
  alternative: जो मरने को अभिशप्त हैं / मृत्यु के पुत्र
  rationale: यह चयन मूल मुहावरे की घातक नियति को व्यक्त करता है, पर यह नहीं बताता कि उन्हें किसने ठहराया; इस प्रकार कारण या दैवी नियुक्ति के विषय में अनावश्यक धर्मवैज्ञानिक निष्कर्ष नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिंदी में प्रार्थनात्मक, गरिमापूर्ण और सहज शैली रखी गई है। परमेश्वर के लिए एकवचन आत्मीय संबोधन 'तेरे/अपनी' भजन की सीधी पुकार को बनाए रखता है; 'भुजा' का मूल रूपक भी सुरक्षित है।
