source:
  edition: WLC
  text: אַֽל תִּזְכָּר לָ/נוּ֮ עֲוֺנֹ֪ת רִאשֹׁ֫נִ֥ים מַ֭הֵר יְקַדְּמ֣וּ/נוּ רַחֲמֶ֑י/ךָ כִּ֖י דַלּ֣וֹנוּ מְאֹֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/079/008.yaml
  text: Do not remember against us the iniquities of former times; let your mercies quickly come to meet us[a], for we have been brought very low.
translation:
  language: hi
  text: पहले के अधर्मों को हमारे विरुद्ध स्मरण न कर; तेरी करुणाएँ शीघ्र हम तक पहुँचें, क्योंकि हम अत्यन्त दीन हो गए हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַל תִּזְכָּר לָנוּ
  choice: हमारे विरुद्ध ... स्मरण न कर
  rationale: निषेधात्मक प्रार्थना को स्वाभाविक हिन्दी में रखा गया है। לָנוּ का प्रतिकूल अथवा न्यायिक भाव ‘हमारे विरुद्ध’ से स्पष्ट होता है, जबकि זכר का मूल बिंब ‘स्मरण’ में बना रहता है।
- source_word: עֲוֺנֹת
  choice: अधर्मों
  rationale: यह शब्द केवल सामान्य पाप नहीं, बल्कि दोष और नैतिक अपराध का भार भी व्यक्त कर सकता है; ‘अधर्म’ उस गंभीरता को बनाए रखता है।
- source_word: רִאשֹׁנִים
  choice: पहले के
  rationale: मूल विशेषण का काल-संबंधी अर्थ रखा गया है और यह तय नहीं किया गया कि अभिप्राय पूर्वजों के अधर्म हैं या समुदाय के अपने पुराने अधर्म।
- source_word: מַהֵר יְקַדְּמוּנוּ
  choice: शीघ्र हमसे आ मिलें
  rationale: מַהֵר की तात्कालिकता और קדם के आगे आकर मिलने के चित्र—दोनों को सहज हिन्दी में सुरक्षित रखा गया है।
- source_word: רַחֲמֶיךָ
  choice: तेरी करुणाएँ
  rationale: רחמים के बहुवचन को बनाए रखते हुए आधुनिक और गरिमापूर्ण हिन्दी चुनी गई है।
- source_word: כִּי דַלּוֹנוּ מְאֹד
  choice: क्योंकि हम अत्यन्त दीन हो गए हैं
  rationale: כִּי कारण बताता है; דלל से उत्पन्न अत्यधिक नीची, निर्बल और विपन्न दशा को ‘अत्यन्त दीन’ संक्षेप में व्यक्त करता है।
theological_decisions:
- issue: ‘पहले के अधर्मों’ का संदर्भ
  choice: मुख्य पाठ में केवल काल-संबंधी अभिव्यक्ति ‘पहले के अधर्मों’ रखी गई है।
  alternative: ‘हमारे पूर्वजों के अधर्म’ अथवा ‘हमारे पुराने अधर्म’
  rationale: इब्रानी पदबंध यह निश्चित नहीं करता कि अधर्म पिछली पीढ़ियों के हैं या प्रार्थना करने वालों के अपने पहले के अधर्म। मुख्य पाठ इस वास्तविक अस्पष्टता को बनाए रखता है और संभावित अर्थ पादटिप्पणी में देता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, प्रार्थनात्मक और गरिमापूर्ण रखी गई है। परमेश्वर के लिए निकट, एकवचन संबोधन ‘तू/तेरी’ का प्रयोग भजन की सीधी विनती के अनुरूप है।
