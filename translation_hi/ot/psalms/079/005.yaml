    reason: lexical_alternative
lexical_decisions:
- source_word: עַד מָה
  choice: कब तक
  rationale: विलाप में अवधि पूछने वाला स्वाभाविक और तात्कालिक हिन्दी प्रयोग।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी व्यक्तिगत नाम को हिन्दी में प्रचलित लिप्यंतरण द्वारा रखा गया है, किसी उपाधि से नहीं बदला गया।
- source_word: תֶּאֱנַף
  choice: क्रोधित रहेगा
  rationale: אנף का अर्थ क्रोध करना है; प्रश्न के कालगत संदर्भ में ‘रहेगा’ לָנֶצַח के साथ स्वाभाविक है।
- source_word: לָנֶצַח
  choice: सदा
  rationale: विलाप का प्रश्न यह है कि क्या परमेश्वर का क्रोध बिना अंत तक बना रहेगा।
- source_word: תִּבְעַר
  choice: धधकती रहेगी
  rationale: בער के जलने के बिंब को स्पष्ट रखता है और स्त्रीलिंग ‘जलन’ से मेल खाता है; अवधि का प्रश्न दूसरे उपवाक्य में भी जारी रहता है।
- source_word: כְּמוֹ אֵשׁ
  choice: आग के समान
  rationale: मूल उपमा का सीधा, गरिमापूर्ण हिन्दी रूप।
- source_word: קִנְאָתֶךָ
  choice: तेरी जलन
  rationale: ‘जलन’ ईश्वरीय ईर्ष्या/उत्साह की तीव्र, अधिकारपूर्ण भावना को व्यक्त करती है; शब्द की वैकल्पिक अर्थ-छाया पाद-टिप्पणी में सुरक्षित है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का रूप
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में व्यक्तिगत वाचा-नाम है। हिन्दी पाठकों के लिए स्थापित ‘यहोवा’ रूप नाम को उपाधि में बदले बिना सहज पहचान देता है।
- issue: קִנְאָה का ईश्वर के लिए अर्थ
  choice: जलन
  alternative: जोश
  rationale: क्रोध और आग के प्रसंग में अधिकारपूर्ण ईर्ष्या/जलन का अर्थ प्रमुख है, पर मूल शब्द ‘जोश’ भी व्यक्त कर सकता है; इस वास्तविक अस्पष्टता को पाद-टिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। परमेश्वर को संबोधन में एकवचन निकटतापूर्ण ‘तू/तेरी’ रखा गया है, जैसा भजनात्मक प्रत्यक्ष संबोधन में स्वाभाविक है। दो प्रश्नों की तीव्रता और आग की उपमा सुरक्षित रखी गई है।
