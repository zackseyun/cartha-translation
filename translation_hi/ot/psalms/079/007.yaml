  yaml_path: translation/ot/psalms/079/007.yaml
  text: For they have devoured Jacob and laid waste his dwelling place[a].
translation:
  language: hi
  text: 'क्योंकि उसने याकूब को निगल लिया है,[a]

    और उसके निवास-स्थान को उन्होंने उजाड़ दिया है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में यहाँ क्रिया एकवचन ‘उसने निगल लिया’ है, जबकि अगली पंक्ति में बहुवचन ‘उन्होंने उजाड़ दिया’ है; कुछ प्राचीन पाठ-परंपराएँ और अनुवाद पहली क्रिया को भी बहुवचन समझते हैं।
    reason: textual_and_grammatical_ambiguity
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पद पिछले पद में किए गए न्याय के निवेदन का कारण बताता है; ‘क्योंकि’ इस कारणात्मक संबंध को स्वाभाविक हिन्दी में स्पष्ट रखता है।
- source_word: אָכַל
  choice: निगल लिया है
  rationale: मूल अर्थ ‘खाना’ है, पर शत्रुतापूर्ण राष्ट्रीय विनाश के रूपक में यह पूरी तरह भस्म या नष्ट कर देने का भाव देता है। ‘निगल लिया’ रूपक की तीव्रता बनाए रखता है।
- source_word: אֶת יַעֲקֹב
  choice: याकूब को
  rationale: मूल पाठ के काव्यात्मक वाचा-संबंधी नाम ‘याकूब’ को बनाए रखा गया है; इसे व्याख्यात्मक रूप से ‘इस्राएल’ या ‘याकूब के वंशज’ नहीं बनाया गया।
- source_word: נָוֵהוּ
  choice: उसके निवास-स्थान को
  rationale: शब्द का अर्थ निवास, बसेरा या चरागाह हो सकता है। यहाँ प्रत्यय ‘उसके’ याकूब की ओर संकेत करता है और व्यापक निवास-क्षेत्र का भाव देता है, बिना इसे केवल मन्दिर तक सीमित किए।
- source_word: הֵשַׁמּוּ
  choice: उन्होंने उजाड़ दिया है
  rationale: हिफ़ील रूप किसी स्थान को निर्जन या उजाड़ कर देने का भाव देता है। ‘उजाड़ दिया’ आधुनिक, सहज और काव्यात्मक हिन्दी में विनाश की तीव्रता व्यक्त करता है।
theological_decisions:
- issue: ‘उसके निवास-स्थान’ का संदर्भ
  choice: याकूब/इस्राएल के व्यापक निवास के रूप में रखा गया
  alternative: विशेष रूप से मन्दिर या पवित्रस्थान; अथवा केवल देश
  rationale: प्रत्यय स्वाभाविक रूप से ‘याकूब’ की ओर लौटता है। भजन के व्यापक प्रसंग में मन्दिर का संकेत संभव है, पर यह उपवाक्य उसे अनिवार्य नहीं करता; इसलिए अनुवाद व्यापक अभिव्यक्ति बनाए रखता है।
- issue: पहले और दूसरे क्रिया-रूप में वचन-परिवर्तन
  choice: ‘उसने … उन्होंने’ के रूप में इब्रानी के एकवचन से बहुवचन परिवर्तन को बनाए रखा गया
  alternative: दोनों क्रियाओं को बहुवचन ‘उन्होंने’ करना
  rationale: WLC में אָכַל एकवचन और הֵשַׁמּוּ बहुवचन है। संभावित सामूहिक कर्ता के कारण अर्थ में दोनों शत्रु राष्ट्रों की ओर संकेत कर सकते हैं, फिर भी मूल पाठ का व्याकरणिक तनाव चुपचाप समतल नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण काव्य-पंक्तियाँ रखी गई हैं। ‘निगल लिया’ विनाश के मूल रूपक को जीवित रखता है और ‘निवास-स्थान’ जानबूझकर इतना व्यापक है कि देश, बस्ती या पवित्र निवास की संभावित प्रतिध्वनियाँ बनी रहें।
