base_translation:
  language: en
  yaml_path: translation/ot/psalms/079/006.yaml
  text: Pour out your wrath on the nations that do not know you[b][a], and on the kingdoms that do not call on your name.
translation:
  language: hi
  text: अपना क्रोध उन जातियों पर उंडेल दे जो तुझे नहीं जानतीं[a], और उन राज्यों पर जो तेरे नाम की दुहाई नहीं देते[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘जो तुझे नहीं मानतीं।’ इब्रानी में ‘जानना’ केवल बौद्धिक जानकारी नहीं, बल्कि सम्बन्ध में पहचानने या स्वीकार करने का भाव भी रख सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘जो तेरे नाम को नहीं पुकारते।’ इब्रानी मुहावरा प्रार्थना में सहायता के लिए पुकारने या उपासना करने का भाव रख सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁפֹךְ
  choice: उंडेल दे
  rationale: आज्ञार्थक रूप और क्रोध को किसी पर द्रव के समान उंडेलने का सजीव रूपक दोनों सुरक्षित रहते हैं; यह आधुनिक हिन्दी में स्वाभाविक भी है।
- source_word: חֲמָתְךָ
  choice: अपना क्रोध
  rationale: חֵמָה तीव्र, दहकते हुए रोष को व्यक्त करता है। ‘क्रोध’ गरिमापूर्ण और सामान्यतः समझ में आने वाला शब्द है, जबकि अत्यधिक विशिष्ट अर्थ जोड़ने से बचता है।
- source_word: אֶל ... וְעַל
  choice: पर ... और ... पर
  rationale: ‘उंडेलना’ के साथ हिन्दी में ‘पर’ लक्ष्य को स्वाभाविक ढंग से व्यक्त करता है और दोनों समानांतर पदों को स्पष्ट रखता है।
- source_word: הַגּוֹיִם
  choice: जातियों
  rationale: यहाँ विदेशी जनसमूह अभिप्रेत हैं। ‘जातियाँ’ काव्यात्मक और बाइबिलीय संदर्भ में उपयुक्त है तथा बाद की धार्मिक श्रेणियाँ नहीं थोपता।
- source_word: אֲשֶׁר לֹא יְדָעוּךָ
  choice: जो तुझे नहीं जानतीं
  rationale: ‘जानना’ मूल की सीधी अभिव्यक्ति और उसके सम्बन्धात्मक अर्थ की सम्भावना दोनों बनाए रखता है; इसे केवल बौद्धिक जानकारी या केवल उपासना तक सीमित नहीं करता।
- source_word: מַמְלָכוֹת
  choice: राज्यों
  rationale: यह राजनीतिक क्षेत्रों या राजसत्ताओं का सीधा और स्वाभाविक हिन्दी समतुल्य है तथा ‘जातियों’ के साथ काव्यात्मक समानांतरता रखता है।
- source_word: אֲשֶׁר בְּשִׁמְךָ לֹא קָרָאוּ
  choice: जो तेरे नाम को नहीं पुकारते
  rationale: यह हिन्दी में बाइबिलीय मुहावरे को बनाए रखता है और प्रार्थना, सहायता की विनती तथा उपासना के अर्थों के लिए खुला रहता है।
theological_decisions:
- issue: जातियों द्वारा परमेश्वर को ‘जानने’ का स्वरूप
  choice: ‘तुझे नहीं जानतीं’
  alternative: ‘तुझे नहीं मानतीं’
  rationale: मूल क्रिया सम्बन्धात्मक पहचान या स्वीकार को समेट सकती है, पर मुख्य पाठ में ‘जानना’ रखने से अर्थ की व्यापकता और धर्मवैचारिक तनाव सुरक्षित रहता है।
- issue: परमेश्वर के नाम को पुकारने का आशय
  choice: ‘तेरे नाम को नहीं पुकारते’
  alternative: ‘तेरे नाम की दुहाई नहीं देते’
  rationale: मूल मुहावरा प्रार्थनापूर्ण पुकार और उपासना दोनों का संकेत दे सकता है। सीधा मुहावरा किसी एक अर्थ को अनावश्यक रूप से प्रधान नहीं करता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। एकवचन परमेश्वर को सम्बोधन में ‘तुझे/तेरे’ मूल के निकट और हिन्दी काव्य-प्रार्थना में स्वाभाविक है। समानांतर संरचना और क्रोध उंडेलने का रूपक सुरक्षित रखा गया है।
