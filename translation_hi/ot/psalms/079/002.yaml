reference: Psalms 79:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: נָֽתְנ֡וּ אֶת נִבְלַ֬ת עֲבָדֶ֗י/ךָ מַ֭אֲכָל לְ/ע֣וֹף הַ/שָּׁמָ֑יִם בְּשַׂ֥ר חֲ֝סִידֶ֗י/ךָ לְ/חַיְת/וֹ אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/079/002.yaml
  text: They have given the corpses of your servants as food to the birds of the heavens[b][a], the flesh of your faithful ones to the beasts of the earth.
translation:
  language: hi
  text: उन्होंने तेरे सेवकों की लाशों को आकाश के पक्षियों का आहार बना दिया है, और तेरे निष्ठावान लोगों[a] के मांस को धरती के जंगली पशुओं का आहार बना दिया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘तेरे भक्तजन’ अथवा ‘तेरे पवित्र जन।’ हिब्रू शब्द उन लोगों को सूचित कर सकता है जो वाचा की निष्ठा के साथ परमेश्वर को समर्पित हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: נָתְנוּ
  choice: उन्होंने ... बना दी हैं
  rationale: काल पूर्ण हो चुके शत्रुतापूर्ण कार्य को दर्शाता है; हिन्दी का पूर्ण वर्तमान विलाप की जीवंतता बनाए रखता है। נתן के साथ מַאֲכָל का आशय शवों को आहार के रूप में दे देना है।
- source_word: נִבְלַת עֲבָדֶיךָ
  choice: तेरे सेवकों की लाशें
  rationale: נבלה मृत शरीर है; ‘लाशें’ साधारण आधुनिक हिन्दी में अनादरपूर्वक पड़े शवों की कठोर छवि व्यक्त करता है। भजन में परमेश्वर से संबोधन के कारण עבד के लिए ‘सेवक’ स्वाभाविक है।
- source_word: מַאֲכָל לְעוֹף הַשָּׁמָיִם
  choice: आकाश के पक्षियों का आहार
  rationale: עוֹף सामूहिक रूप से उड़ने वाले जीवों, यहाँ पक्षियों, को दर्शाता है। ‘आकाश के पक्षी’ हिब्रू काव्यात्मक पदबंध को स्वाभाविक हिन्दी में रखता है।
- source_word: בְּשַׂר
  choice: मांस
  rationale: शाब्दिक अर्थ ‘मांस’ रखकर पद की कठोर शारीरिक छवि और ‘लाशें’ के साथ समानांतरता सुरक्षित रहती है।
- source_word: חֲסִידֶיךָ
  choice: तेरे निष्ठावान लोग
  rationale: חסיד परमेश्वर के प्रति वाचा-संबंधी निष्ठा और समर्पण वाले जनों को सूचित कर सकता है। ‘निष्ठावान लोग’ आधुनिक हिन्दी में इसे स्पष्ट करता है और बाद की पारिभाषिक धारणाएँ नहीं जोड़ता।
- source_word: לְחַיְתוֹ אָרֶץ
  choice: धरती के जंगली पशुओं का
  rationale: חיה यहाँ शव खाने वाले वन्य पशुओं को सूचित करता है। ‘जंगली पशु’ अर्थ को स्पष्ट रखता है और ‘आकाश के पक्षियों’ के समानांतर है।
theological_decisions:
- issue: חֲסִידֶיךָ में वाचा-संबंधी पहचान
  choice: तेरे निष्ठावान लोग
  alternative: तेरे भक्तजन / तेरे पवित्र जन
  rationale: मूल शब्द निष्ठा, भक्ति और परमेश्वर के प्रति समर्पण का अर्थ समेटता है। ‘निष्ठावान लोग’ इस व्यापकता को बिना किसी बाद की संप्रदायगत या धर्मशास्त्रीय श्रेणी को थोपे व्यक्त करता है; विकल्प पादटिप्पणी में दिए गए हैं।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सीधी हिन्दी; परमेश्वर के लिए निकट संबोधन ‘तेरे’ भजन की प्रत्यक्ष पुकार बनाए रखता है। काव्यात्मक समानांतरता और शवों के अपमान की कठोर छवि सुरक्षित रखी गई है।
