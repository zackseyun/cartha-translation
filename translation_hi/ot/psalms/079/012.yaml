source:
  edition: WLC
  text: וְ/הָ֘שֵׁ֤ב לִ/שְׁכֵנֵ֣י/נוּ שִׁ֭בְעָתַיִם אֶל חֵיקָ֑/ם חֶרְפָּ֘תָ֤/ם אֲשֶׁ֖ר חֵרְפ֣וּ/ךָ אֲדֹנָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/079/012.yaml
  text: And repay to our neighbors sevenfold into their lap the reproach with which they reproached you[b][a], O Lord.
translation:
  language: hi
  text: हे प्रभु, हमारे पड़ोसियों को उनकी उस निन्दा का सात गुना उनकी गोद में लौटा दीजिए, जिससे उन्होंने आपकी निन्दा की है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हमारे पड़ोसियों को उनकी निन्दा सात गुनी करके उनकी गोद में लौटा दीजिए।” यह इब्रानी मुहावरा उस अपमान को उन्हीं पर लौट आने के रूप में चित्रित करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָשֵׁב
  choice: लौटा दीजिए
  rationale: हिफ़ील आज्ञार्थ यहाँ किसी बात को उन्हीं पर वापस लाने का भाव देता है। ‘लौटा दीजिए’ प्रतिशोध की याचना और वापसी की मूल छवि दोनों को बनाए रखता है।
- source_word: לִשְׁכֵנֵינוּ
  choice: हमारे पड़ोसियों
  rationale: शब्द का सीधा अर्थ पास रहने वाले या पड़ोसी है। प्रसंग में आसपास की जातियाँ अभिप्रेत हो सकती हैं, पर अनुवाद मूल की व्यापकता बनाए रखता है।
- source_word: שִׁבְעָתַיִם
  choice: सात गुना
  rationale: यह क्रियाविशेषणात्मक रूप ‘सात गुना’ या ‘सात बार’ का अर्थ देता है और तीव्र प्रतिफल को व्यक्त करता है।
- source_word: אֶל חֵיקָם
  choice: उन्हीं की गोद में
  rationale: חֵיק का शाब्दिक अर्थ गोद या वक्षस्थल है। यह इब्रानी मुहावरा उनके किए का उन्हीं पर लौटना चित्रित करता है; ‘उन्हीं’ इस प्रत्यावर्तन को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: חֶרְפָּתָם אֲשֶׁר חֵרְפוּךָ
  choice: आपकी जो निन्दा की है
  rationale: संज्ञा और उसी मूल की क्रिया को हिन्दी में शब्दशः दोहराने से वाक्य अस्वाभाविक होता। यह रचना निन्दा के कर्म और उसके परमेश्वर की ओर लक्षित होने को स्पष्ट तथा सहज रूप में व्यक्त करती है।
- source_word: אֲדֹנָי
  choice: हे प्रभु
  rationale: यह परमेश्वर के लिए प्रयुक्त संबोधन ‘प्रभु’ है; ‘हे’ प्रार्थनात्मक प्रत्यक्ष संबोधन को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: प्रतिशोधात्मक प्रार्थना और उसकी तीव्रता
  choice: ईश्वरीय प्रतिफल के लिए सीधी प्रार्थना को ‘सात गुना ... लौटा दीजिए’ के रूप में बनाए रखा गया।
  alternative: इसे केवल न्याय स्थापित करने की सामान्य प्रार्थना के रूप में नरम करना।
  rationale: मूल पद शत्रुओं के अपमान का तीव्र प्रतिफल माँगता है। अनुवाद को इस धर्मवैचारिक तनाव को घटाकर अमूर्त न्याय में नहीं बदलना चाहिए।
translation_notes:
  register: आधुनिक, गरिमापूर्ण प्रार्थना-भाषा अपनाई गई है। ‘गोद में लौटाना’ की मूल काव्यात्मक छवि रखी गई, और पदक्रम स्वाभाविक हिन्दी के अनुसार व्यवस्थित किया गया है।
