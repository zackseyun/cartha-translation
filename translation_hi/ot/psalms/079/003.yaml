  yaml_path: translation/ot/psalms/079/003.yaml
  text: They have poured out their blood like water all around Jerusalem[a], and there is no one to bury them.
translation:
  language: hi
  text: उन्होंने यरूशलेम के चारों ओर उनका खून पानी की तरह उंडेल दिया,[a] और उन्हें दफनाने वाला कोई न था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘उन्होंने उनका खून पानी की तरह बहा दिया।’
    reason: שׁפך का अर्थ ‘बहाना’ भी हो सकता है, विशेषकर रक्त के प्रसंग में; मुख्य पाठ का ‘उंडेल दिया’ पानी वाली उपमा के साथ मूल बिंब को अधिक सीधे रखता है।
lexical_decisions:
- source_word: שָׁפְכוּ
  choice: बहा दिया
  rationale: काल पूर्ण की गई क्रिया को दिखाता है। ‘बहा दिया’ उंडेलने और रक्त बहाने—दोनों अर्थ-छटाओं को बनाए रखते हुए आगे की पानी वाली उपमा से स्वाभाविक रूप से जुड़ता है।
- source_word: דָמָם
  choice: उनका खून
  rationale: तीसरे पुरुष बहुवचन प्रत्यय सहित संज्ञा का सीधा अर्थ ‘उनका खून’ है; ‘प्राण-रक्त’ जैसी व्याख्यात्मक वृद्धि नहीं की गई।
- source_word: כמים
  choice: पानी की तरह
  rationale: उपसर्ग כ तुलना व्यक्त करता है; ‘पानी की तरह’ आधुनिक हिन्दी में सहज और मूल उपमा के अनुरूप है।
- source_word: סביבות ירושלים
  choice: यरूशलेम के चारों ओर
  rationale: समीपी और चारों तरफ फैले क्षेत्र का भाव व्यक्त करता है तथा व्यापक रक्तपात का दृश्य बनाए रखता है।
- source_word: וְאֵין
  choice: और ... कोई न था
  rationale: नकारात्मक अस्तित्ववाचक अभिव्यक्ति को प्रसंगानुकूल भूतकाल में स्वाभाविक हिन्दी दी गई है।
- source_word: קוֹבֵר
  choice: उन्हें दफनाने वाला
  rationale: कर्तृवाचक कृदन्त का अर्थ ‘दफनाने वाला’ है। हिन्दी में स्पष्टता के लिए प्रसंग से समझा जाने वाला कर्म ‘उन्हें’ व्यक्त किया गया है।
