reference: Psalms 79:13
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/אֲנַ֤חְנוּ עַמְּ/ךָ֨ וְ/צֹ֥אן מַרְעִיתֶ/ךָ֮ נ֤וֹדֶ֥ה לְּ/ךָ֗ לְ/ע֫וֹלָ֥ם לְ/דֹ֥ר וָ/דֹ֑ר נְ֝סַפֵּ֗ר תְּהִלָּתֶֽ/ךָ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/079/013.yaml
  text: But we[a], your people and the sheep of your pasture, will give thanks to you forever[b]; from generation to generation we will recount your praise.
translation:
  language: hi
  text: परन्तु हम, जो तेरी प्रजा और तेरे चरागाह की भेड़ें हैं, सदा तेरा धन्यवाद करेंगे; पीढ़ी से पीढ़ी तक हम तेरी स्तुति का वर्णन करेंगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַאֲנַחְנוּ
  choice: परन्तु हम
  rationale: स्वतंत्र सर्वनाम के साथ लगा संयोजक भजन में पहले वर्णित राष्ट्रों और विनाश के विपरीत परमेश्वर की प्रजा को सामने लाता है; इसलिए यहाँ विरोधसूचक भाव स्वाभाविक है।
- source_word: עַמְּךָ
  choice: तेरी प्रजा
  rationale: यह परमेश्वर के साथ इस्राएल के संबंध की सामान्य वाचा-संबंधी अभिव्यक्ति है; ‘प्रजा’ हिन्दी में स्वाभाविक और गरिमापूर्ण है।
- source_word: וְצֹאן מַרְעִיתֶךָ
  choice: और तेरी चरागाह की भेड़ें
  rationale: ‘भेड़ें’ צֹאן और ‘चरागाह’ מַרְעִית के चरवाही रूपक को स्पष्ट रूप से बनाए रखते हैं।
- source_word: נוֹדֶה לְּךָ
  choice: तेरा धन्यवाद करेंगे
  rationale: ידה का हिफ़ील रूप यहाँ धन्यवाद देने या स्तुति करने का अर्थ रखता है। अगले चरण में תְּהִלָּתֶךָ के लिए ‘स्तुति’ आने के कारण यहाँ ‘धन्यवाद’ रखने से दोनों अभिव्यक्तियों का भेद बचता है।
- source_word: לְעוֹלָם
  choice: सदा
  rationale: यह निरन्तर, अनन्त काल तक धन्यवाद करने के संकल्प को संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לְדֹר וָדֹר
  choice: पीढ़ी से पीढ़ी तक
  rationale: यह इब्रानी मुहावरे में लगातार आने वाली पीढ़ियों का बोध कराता है; हिन्दी अभिव्यक्ति उसी कालगत निरन्तरता को बनाए रखती है।
- source_word: נְסַפֵּר
  choice: हम ... वर्णन करेंगे
  rationale: पिएल में ספר किसी बात को गिनाकर सुनाने, बयान करने या वर्णन करने का अर्थ दे सकता है। ‘वर्णन करेंगे’ स्तुति को पीढ़ियों तक सुनाते रहने का भाव व्यक्त करता है।
- source_word: תְּהִלָּתֶךָ
  choice: तेरी स्तुति
  rationale: संज्ञा परमेश्वर को दी जाने वाली स्तुति अथवा उसके स्तुतियोग्य विषय को सूचित कर सकती है। ‘तेरी स्तुति’ इस अर्थगत व्यापकता को अनावश्यक रूप से सीमित नहीं करती।
theological_decisions:
- issue: परमेश्वर की वाचा की प्रजा के लिए चरवाही का रूपक
  choice: रूपक को स्पष्ट रखते हुए ‘तेरी चरागाह की भेड़ें’
  alternative: तेरा झुंड
  rationale: पद आराधक समुदाय को परमेश्वर की प्रजा और उसकी देखरेख में रहने वाली भेड़ों—दोनों रूपों में पहचानता है। स्पष्ट रूपक मूल पाठ की चरवाही और वाचा-संबंधी छवि को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सामूहिक आराधना के अनुकूल शैली। परमेश्वर के लिए पारंपरिक निकटवर्ती एकवचन ‘तेरी/तेरा’ रखा गया है। मूल की समानांतर काव्य-रचना और चरवाही का रूपक सुरक्षित हैं।
