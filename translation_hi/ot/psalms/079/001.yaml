source:
  edition: WLC
  text: מִזְמ֗וֹר לְ/אָ֫סָ֥ף אֱֽלֹהִ֡ים בָּ֤אוּ גוֹיִ֨ם בְּֽ/נַחֲלָתֶ֗/ךָ טִ֭מְּאוּ אֶת הֵיכַ֣ל קָדְשֶׁ֑/ךָ שָׂ֖מוּ אֶת יְרוּשָׁלִַ֣ם לְ/עִיִּֽים׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/079/001.yaml
  text: A psalm of Asaph. O God[a], the nations have come into your inheritance; they have defiled your holy temple; they have made Jerusalem a heap of ruins.
translation:
  language: hi
  text: आसाफ का भजन। हे परमेश्वर, जातियाँ तेरी विरासत में आ गई हैं; उन्होंने तेरे पवित्र मंदिर को अशुद्ध कर दिया है; उन्होंने यरूशलेम को खंडहरों का ढेर बना दिया है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִזְמוֹר
  choice: भजन
  rationale: शीर्षक में प्रयुक्त मानक काव्य-विधा का स्वाभाविक और प्रचलित हिन्दी रूप।
- source_word: לְאָסָף
  choice: आसाफ का
  rationale: לְ सम्बन्ध, रचनाकारिता या समर्पण सूचित कर सकता है; ‘आसाफ का’ इस सम्बन्ध को स्वाभाविक ढंग से रखता है, बिना उसे अधिक स्पष्ट किए।
- source_word: אֱלֹהִים
  choice: हे परमेश्वर
  rationale: यहाँ सीधा सम्बोधन है; ‘हे’ सम्बोधन-बल को स्पष्ट करता है।
- source_word: בָּאוּ
  choice: घुस आई हैं
  rationale: בוא का मूल अर्थ ‘आना/प्रवेश करना’ है; आक्रमण और अपवित्रीकरण के प्रसंग में ‘घुस आई हैं’ लक्ष्य-स्थान में अनधिकृत प्रवेश को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: גוֹיִם
  choice: अन्यजातियाँ
  rationale: यहाँ इस्राएल से बाहर की आक्रमणकारी जातियाँ अभिप्रेत हैं; ‘अन्यजातियाँ’ धार्मिक रूप से अत्यधिक संकीर्ण हुए बिना यह भेद बनाए रखता है।
- source_word: בְּנַחֲלָתֶךָ
  choice: तेरी विरासत में
  rationale: נחלה परमेश्वर के हिस्से या अधिकार की भूमि और प्रजा—दोनों की वाचा-संबंधी अनुगूँज रखता है; ‘विरासत’ इस व्यापकता को बनाए रखता है।
- source_word: טִמְּאוּ
  choice: अशुद्ध कर दिया है
  rationale: क्रिया का धार्मिक और पवित्रता-संबंधी अर्थ है; यह केवल भौतिक क्षति नहीं, अपवित्रीकरण व्यक्त करती है।
- source_word: הֵיכַל קָדְשֶׁךָ
  choice: तेरे पवित्र मन्दिर
  rationale: היכל इस प्रसंग में मन्दिर-भवन है और קָדְשֶׁךָ को स्वाभाविक हिन्दी में विशेषणात्मक ‘पवित्र’ से व्यक्त किया गया है।
- source_word: שָׂמוּ
  choice: बना दिया है
  rationale: לְ के साथ שׂים परिणामसूचक अर्थ देता है—किसी वस्तु को किसी अवस्था में कर देना।
- source_word: לְעִיִּים
  choice: खण्डहरों का ढेर
  rationale: बहुवचन עִיִּים उजड़े हुए ढेरों या खण्डहरों का बोध कराता है; यह हिन्दी पद विनाश की ठोस छवि बनाए रखता है।
theological_decisions:
- issue: ‘तेरी विरासत’ का वाचा-संबंधी विस्तार
  choice: ‘तेरी विरासत’ को भूमि या प्रजा के रूप में स्पष्ट न करना
  alternative: ‘तेरे देश में’ अथवा ‘तेरी प्रजा के बीच’
  rationale: इब्रानी पद परमेश्वर की अधिकार-सम्पत्ति को व्यापक रूप से व्यक्त करता है और भूमि तथा प्रजा दोनों की अनुगूँज रख सकता है; किसी एक अर्थ को चुनना मूल की अर्थ-व्याप्ति को संकुचित करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सार्वजनिक पाठ के योग्य रूप। ‘तेरी/तेरे’ एकवचन ईश्वरीय सम्बोधन और भजन की निकट, विनतीपूर्ण वाणी को बनाए रखते हैं। वाक्य में पूर्ण क्रियाएँ वर्तमान परिणाम सहित बीती घटना का भाव देती हैं।
