  yaml_path: translation/ot/psalms/079/000.yaml
  text: A psalm of Asaph. God[a], nations have come into your inheritance; they have defiled your holy temple; they have made Jerusalem into ruins.
translation:
  language: hi
  text: 'आसाफ का भजन।


    हे परमेश्वर, जातियाँ तेरी विरासत में आ गई हैं;

    उन्होंने तेरे पवित्र मंदिर को अशुद्ध कर दिया है;

    उन्होंने यरूशलेम को खंडहरों का ढेर कर दिया है।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִזְמוֹר לְאָסָף
  choice: आसाफ का भजन
  rationale: शीर्षक में לְ स्वामित्व, रचनाकार-संबंध या संग्रह-संबंध सूचित कर सकता है; स्वाभाविक हिन्दी में प्रचलित संक्षिप्त रूप रखा गया है, बिना रचनाकारिता को अतिरिक्त रूप से स्पष्ट किए।
- source_word: בְּנַחֲלָתֶךָ
  choice: तेरी विरासत में
  rationale: נַחֲלָה परमेश्वर द्वारा प्राप्त/अधिकार में रखे देश और प्रजा दोनों का संकेत दे सकता है; ‘विरासत’ इस व्यापकता और वाचा-संबंधी भाव को बनाए रखती है।
- source_word: גוֹיִם
  choice: जातियाँ
  rationale: यह बहुवचन अन्यजातीय राष्ट्रों या लोगों को सूचित करता है; ‘जातियाँ’ मूल की सामूहिक बहुवचनता रखता है और किसी एक सेना तक अर्थ सीमित नहीं करता।
- source_word: הֵיכַל קָדְשֶׁךָ
  choice: तेरे पवित्र मन्दिर
  rationale: הֵיכָל यहाँ यरूशलेम के पवित्र भवन के लिए है; ‘पवित्र मन्दिर’ आधुनिक हिन्दी में स्पष्ट और गरिमापूर्ण है।
- source_word: לְעִיִּים
  choice: खण्डहरों का ढेर
  rationale: बहुवचन עִיִּים उजड़े हुए ढेरों/खण्डहरों को दर्शाता है; यह रूप विनाश की ठोस छवि को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: परमेश्वर की ‘विरासत’ का आशय
  choice: ‘तेरी विरासत’ को बिना व्याख्यात्मक विस्तार के रखा
  alternative: ‘तेरे देश’ या ‘तेरी प्रजा के देश’
  rationale: मूल शब्द भूमि, प्रजा और परमेश्वर के अधिकार की संयुक्त धारणा रख सकता है; किसी एक अर्थ को चुनना मूल की अर्थ-व्याप्ति घटा देता।
- issue: לְאָסָף में लेखकत्व
  choice: ‘आसाफ का भजन’
  alternative: ‘आसाफ के लिए भजन’ या ‘आसाफ-सम्बन्धी भजन’
  rationale: इब्रानी संबंध-सूचक לְ लेखकत्व को अनिवार्य रूप से सिद्ध नहीं करता; पारंपरिक और स्वाभाविक शीर्षक रखा गया है, पर अतिरिक्त लेखकत्व-दावा नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में काव्यात्मक पंक्ति-विन्यास, गरिमापूर्ण किंतु सहज शब्दावली और परमेश्वर के लिए निकट संबोधन ‘तेरी/तेरे’ रखा गया है। ‘घुस आई हैं’ आक्रमणकारी प्रवेश का भाव देता है; ‘अशुद्ध’ धार्मिक अपवित्रीकरण को स्पष्ट रखता है।
