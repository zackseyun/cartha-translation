source:
  edition: WLC
  text: עָזְרֵ֤/נוּ אֱלֹ֘הֵ֤י יִשְׁעֵ֗/נוּ עַל דְּבַ֥ר כְּבֽוֹד שְׁמֶ֑/ךָ וְ/הַצִּילֵ֥/נוּ וְ/כַפֵּ֥ר עַל חַ֝טֹּאתֵ֗י/נוּ לְמַ֣עַן שְׁמֶֽ/ךָ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/079/009.yaml
  text: Help us[a], God of our salvation, for the glory of your name[b]; deliver us and atone for our sins for your name’s sake.
translation:
  language: hi
  text: हे हमारे उद्धार के परमेश्वर, अपने नाम की महिमा के कारण[a] हमारी सहायता कर; हमें छुड़ा और अपने नाम के निमित्त हमारे पापों का प्रायश्चित कर[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने नाम की महिमा के लिए।”
    reason: lexical_alternative
  - marker: b
    text: या, “हमारे पापों के लिए प्रायश्चित कर।” इब्रानी क्रिया में केवल क्षमा का नहीं, प्रायश्चित का भाव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עָזְרֵנוּ
  choice: हमारी सहायता कर
  rationale: आज्ञार्थक क्रिया और प्रथम पुरुष बहुवचन प्रत्यय को सीधे तथा स्वाभाविक ढंग से व्यक्त करता है; विनती की तात्कालिकता बनी रहती है।
- source_word: אֱלֹהֵי יִשְׁעֵנוּ
  choice: हमारे उद्धार के परमेश्वर
  rationale: इब्रानी संबंध-रचना को बनाए रखता है और परमेश्वर को उद्धार के स्रोत के रूप में प्रस्तुत करता है।
- source_word: עַל דְּבַר כְּבוֹד שְׁמֶךָ
  choice: अपने नाम की महिमा के कारण
  rationale: यह पदबंध परमेश्वर से सहायता माँगने का आधार या प्रेरणा बताता है। ‘नाम’ और ‘महिमा’ दोनों को अलग-अलग सुरक्षित रखा गया है।
- source_word: וְהַצִּילֵנוּ
  choice: हमें छुड़ा
  rationale: हिफ़ील आज्ञार्थक का स्वाभाविक हिन्दी रूप है और संकट से बचाने या मुक्त करने का भाव देता है।
- source_word: וְכַפֵּר עַל
  choice: का प्रायश्चित कर
  rationale: כפר के प्रायश्चित-संबंधी अर्थ को केवल ‘क्षमा कर’ तक सीमित नहीं करता, फिर भी आधुनिक धार्मिक हिन्दी में समझने योग्य है।
- source_word: חַטֹּאתֵינוּ
  choice: हमारे पापों
  rationale: बहुवचन संज्ञा और प्रथम पुरुष बहुवचन संबंध को सीधे व्यक्त करता है।
- source_word: לְמַעַן שְׁמֶךָ
  choice: अपने नाम के निमित्त
  rationale: परमेश्वर के नाम, अर्थात उसके चरित्र और प्रतिष्ठा, को कार्य करने की प्रेरणा के रूप में व्यक्त करने वाला परिचित और गरिमापूर्ण हिन्दी मुहावरा है।
theological_decisions:
- issue: पश्चात्ताप की विनती में כפר का अनुवाद
  choice: हमारे पापों का प्रायश्चित कर
  alternative: हमारे पाप क्षमा कर
  rationale: मूल क्रिया दोष के निवारण से जुड़े प्रायश्चित का भार रखती है। ‘क्षमा कर’ अर्थ को संकरा कर देगा, जबकि चुना हुआ रूप किसी विशिष्ट उत्तरवर्ती प्रायश्चित-सिद्धांत को नहीं जोड़ता।
- issue: परमेश्वर के नाम पर आधारित प्रेरक उपवाक्य
  choice: अपने नाम की महिमा के कारण ... अपने नाम के निमित्त
  alternative: क्योंकि तेरा नाम महिमामय है
  rationale: पद में सहायता और छुटकारे की विनती इस्राएल की योग्यता पर नहीं, परमेश्वर के अपने नाम और महिमा पर आधारित है। दोनों अपीलों को अलग रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में स्वाभाविक किंतु गरिमापूर्ण भजनात्मक शैली अपनाई गई है। परमेश्वर के लिए निकट संबोधन के अनुरूप एकवचन क्रियाएँ ‘कर’ और ‘छुड़ा’ रखी गई हैं। वाक्यक्रम हिन्दी की सहजता के लिए संबोधन से आरम्भ होता है, जबकि मूल अर्थ-संबंध सुरक्षित हैं।
