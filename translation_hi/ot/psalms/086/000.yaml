  yaml_path: translation/ot/psalms/086/000.yaml
  text: A prayer of David. Incline your ear[a], Yahweh; answer me, for I am poor and needy.
translation:
  language: hi
  text: 'दाऊद की प्रार्थना।


    हे यहोवा, अपना कान मेरी ओर झुका और मुझे उत्तर दे, क्योंकि मैं दीन[a] और ज़रूरतमंद हूँ।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “गरीब” अथवा “पीड़ित।” इब्रानी शब्द का अर्थ दीन, गरीब, पीड़ित या दबा हुआ व्यक्ति हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּפִלָּה לְדָוִד
  choice: दाऊद की प्रार्थना
  rationale: शीर्षक को उसके स्वाभाविक संबंध सहित संक्षिप्त और औपचारिक रूप में रखा गया है; לְ को यहाँ रचनाकार अथवा संबद्धता सूचक समझना सहज है।
- source_word: הַטֵּה ... אָזְנְךָ
  choice: मेरी ओर कान लगा
  rationale: हिब्रू मुहावरे की चित्रात्मकता को बनाए रखते हुए आधुनिक हिन्दी में समझ आने वाला निवेदन प्रस्तुत किया गया है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: व्यक्तिगत दिव्य नाम को सामान्य उपाधि ‘प्रभु’ से प्रतिस्थापित न करके हिन्दी में प्रचलित रूप ‘यहोवा’ रखा गया है।
- source_word: עֲנֵנִי
  choice: मुझे उत्तर दे
  rationale: क्रिया ענה के प्रत्यक्ष अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: עָנִי
  choice: दीन
  rationale: यह शब्द आर्थिक गरीबी के साथ पीड़ित, दबा हुआ या नम्र दशा भी सूचित कर सकता है; ‘दीन’ इस अर्थ-क्षेत्र को हिन्दी में अपेक्षाकृत व्यापक रूप से सुरक्षित रखता है।
- source_word: אֶבְיוֹן
  choice: ज़रूरतमंद
  rationale: अभाव और सहायता की आवश्यकता पर बल देने वाले शब्द को सहज आधुनिक हिन्दी में व्यक्त किया गया है।
theological_decisions:
- issue: दिव्य नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: मूल पाठ में उपस्थित व्यक्तिगत नाम को स्पष्ट रखा गया है। ‘यहोवा’ हिन्दी बाइबलीय प्रयोग में व्यापक रूप से पहचाना जाता है, जबकि ‘प्रभु’ नाम और उपाधि का भेद मिटा देता।
- issue: עָנִי की अर्थगत बहुविधता
  choice: मुख्य पाठ में ‘दीन’, पादटिप्पणी में ‘गरीब’ और ‘पीड़ित’
  alternative: केवल ‘गरीब’
  rationale: मूल शब्द की आर्थिक और दुःख-पीड़ा संबंधी संभावनाओं को बिना किसी एक अर्थ को अनावश्यक रूप से अंतिम ठहराए सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण प्रार्थनात्मक शैली अपनाई गई है। शीर्षक को मुख्य प्रार्थना से अलग पंक्ति में रखा गया है। ‘कान लगा’ मूल रूपक को बचाता है, जबकि ‘ज़रूरतमंद’ आज के सामान्य पाठक के लिए सहज है।
