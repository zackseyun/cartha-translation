source:
  edition: WLC
  text: כִּֽי גָד֣וֹל אַ֭תָּה וְ/עֹשֵׂ֣ה נִפְלָא֑וֹת אַתָּ֖ה אֱלֹהִ֣ים לְ/בַדֶּֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/086/010.yaml
  text: For you are great and do wondrous things[a]; you alone are God.
translation:
  language: hi
  text: क्योंकि तू महान है और अद्भुत काम करता है; केवल तू ही परमेश्वर है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन का आधार बताता है और इब्रानी संयोजक का कारणसूचक बल स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: גָדוֹל
  choice: महान
  rationale: यह परमेश्वर की महत्ता और सामर्थ्य को सीधे तथा गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: וְעֹשֵׂה
  choice: और ... करता है
  rationale: कृदन्त यहाँ परमेश्वर के स्वभावगत और निरंतर कार्य को व्यक्त करता है; हिन्दी का सामान्य वर्तमान काल इसके लिए स्वाभाविक है।
- source_word: נִפְלָאוֹת
  choice: अद्भुत काम
  rationale: यह असाधारण, विस्मय उत्पन्न करने वाले दिव्य कार्यों के बहुवचन अर्थ को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: द्वितीय पुरुष संबोधन और एकमात्रता के कथन के संदर्भ में यह एक सच्चे परमेश्वर को सूचित करता है।
- source_word: לְבַדֶּךָ
  choice: केवल तू ही
  rationale: यह दूसरे पुरुष एकवचन के साथ विशेष बल वाली अनन्यता को स्पष्ट और स्वाभाविक हिन्दी में सामने रखता है।
theological_decisions:
- issue: अंतिम उपवाक्य में परमेश्वर की अनन्यता
  choice: केवल तू ही परमेश्वर है
  alternative: तू अकेला परमेश्वर है
  rationale: चुना हुआ रूप לְבַדֶּךָ की विशेष बल वाली अनन्यता को स्पष्ट रखता है और किसी अतिरिक्त दार्शनिक व्याख्या के बिना मूल के एकेश्वरवादी कथन को व्यक्त करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, काव्यात्मक और गरिमापूर्ण रूप। भजन के सीधे एकवचन संबोधन को बनाए रखने के लिए ‘तू’ का प्रयोग किया गया है।
