id: PSA.86.11
reference: Psalms 86:11
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: ה֘וֹרֵ֤/נִי יְהוָ֨ה דַּרְכֶּ֗/ךָ אֲהַלֵּ֥ךְ בַּ/אֲמִתֶּ֑/ךָ יַחֵ֥ד לְ֝בָבִ֗/י לְ/יִרְאָ֥ה שְׁמֶֽ/ךָ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/086/011.yaml
  text: Teach me your way[a], O Yahweh, that I may walk in your truth[b]; unite my heart to fear your name.
translation:
  language: hi
  text: 'हे याहवे, मुझे अपना मार्ग सिखा,

    कि मैं तेरी सच्चाई[a] में चलूँ;

    मेरे हृदय को एक कर दे[b],

    कि मैं तेरे नाम का भय मानूँ।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘तेरी विश्वासयोग्यता में।’ इब्रानी शब्द का अर्थ ‘सच्चाई’ और ‘विश्वासयोग्यता’ दोनों हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘मेरे हृदय को अविभाजित कर दे।’ इब्रानी क्रिया का अर्थ ‘एक करना’ है और यहाँ वह विभाजित निष्ठाओं से मुक्त हृदय की ओर संकेत करती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹרֵנִי
  choice: मुझे ... सिखा
  rationale: हिफ़ील आज्ञार्थक रूप का सीधा अर्थ ‘मुझे सिखा/शिक्षा दे’ है। ‘सिखा’ सहज आधुनिक हिन्दी में प्रार्थना का भाव बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम יהוה का लिप्यंतरण किया गया है, किसी उपाधि से उसका स्थान नहीं लिया गया।
- source_word: דַּרְכֶּךָ
  choice: अपना मार्ग
  rationale: דֶּרֶךְ का मूल अर्थ ‘मार्ग’ है और यहाँ यह परमेश्वर द्वारा बताई गई जीवन-पद्धति को भी सूचित कर सकता है।
- source_word: אֲהַלֵּךְ
  choice: कि मैं ... चलूँ
  rationale: आज्ञार्थक विनती के बाद आया अपूर्ण रूप अपेक्षित उद्देश्य या परिणाम व्यक्त करता है; ‘कि मैं चलूँ’ इस संबंध को स्वाभाविक हिन्दी में दर्शाता है।
- source_word: בַּאֲמִתֶּךָ
  choice: तेरी सच्चाई में
  rationale: אֱמֶת में ‘सच्चाई’ और ‘विश्वासयोग्यता’ दोनों अर्थ संभव हैं। मुख्य पाठ में सीधा अर्थ रखा गया और दूसरा अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: יַחֵד
  choice: एक कर दे
  rationale: पिएल आज्ञार्थक יחד का अर्थ ‘एक करना/एकजुट करना’ है। यह विभाजित निष्ठाओं से मुक्त आंतरिक एकाग्रता की विनती है, पर मुख्य पाठ में क्रिया का ठोस रूप बनाए रखा गया है।
- source_word: לְבָבִי
  choice: मेरे हृदय को
  rationale: לֵבָב मनुष्य के भीतर के विचार, इच्छा और भावनाओं को समेटता है; ‘हृदय’ इसका परिचित और गरिमापूर्ण हिन्दी समतुल्य है।
- source_word: לְיִרְאָה
  choice: कि मैं ... भय मानूँ
  rationale: לְ के साथ धातु ירא का क्रियार्थक रूप उद्देश्य बताता है। ‘भय मानना’ श्रद्धा और विस्मय सहित बाइबिलीय अर्थ-भार को बनाए रखता है।
- source_word: שְׁמֶךָ
  choice: तेरे नाम का
  rationale: ‘नाम’ स्वयं व्यक्ति, उसके चरित्र और प्रतिष्ठा को भी सूचित करता है; धार्मिक महत्व के कारण इसे शाब्दिक रूप से रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा अथवा ‘प्रभु’
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम सीधे उपस्थित है। ‘याहवे’ उसका लिप्यंतरण है और उसे उपाधि में नहीं बदलता।
- issue: परमेश्वर के नाम का ‘भय मानना’
  choice: तेरे नाम का भय मानूँ
  alternative: तेरे नाम का आदर करूँ
  rationale: ירא में भय, विस्मय और श्रद्धा का संयुक्त भाव है। केवल ‘आदर’ कहने से अर्थ संकुचित हो सकता था, इसलिए अधिक व्यापक बाइबिलीय अभिव्यक्ति रखी गई।
- issue: हृदय को ‘एक करना’
  choice: मेरे हृदय को एक कर दे
  alternative: मुझे अविभाजित हृदय दे
  rationale: मुख्य पाठ मूल क्रिया יחד को सीधे व्यक्त करता है और मनुष्य की विभाजित निष्ठाओं की अंतर्निहित धारणा को व्याख्यात्मक पादटिप्पणी के लिए छोड़ता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की प्रार्थनात्मक, गरिमापूर्ण शैली में है। ‘तू/तेरा’ रूप भजन की सीधी और आत्मीय संबोधन-शैली के अनुरूप रखा गया है। पंक्ति-विन्यास पद के दो समानांतर निवेदनों और उनके उद्देश्यों को स्पष्ट करता है।
