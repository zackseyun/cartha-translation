  yaml_path: translation/ot/psalms/086/007.yaml
  text: In the day of my distress I call to you, because you answer me.
translation:
  language: hi
  text: अपने संकट के दिन मैं तुझे पुकारता हूँ, क्योंकि तू मुझे उत्तर देता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּיוֹם צָרָתִי
  choice: अपने संकट के दिन
  rationale: इब्रानी पदबंध का स्वाभाविक और निकट अर्थ; ‘संकट’ צָרָה की विपत्ति और तंगी दोनों की व्यापकता बनाए रखता है।
- source_word: אֶקְרָאֶךָּ
  choice: मैं तुझे पुकारता हूँ
  rationale: अपूर्ण क्रिया यहाँ वर्तमान/अभ्यस्त विश्वासपूर्ण पुकार को व्यक्त करती है; ‘पुकारता हूँ’ हिंदी में इसे सहजता से दर्शाता है।
- source_word: כִּי תַעֲנֵנִי
  choice: क्योंकि तू मुझे उत्तर देता है
  rationale: כִּי को कारणसूचक ‘क्योंकि’ और अपूर्ण תַעֲנֵנִי को भरोसे से कही गई वर्तमान क्रिया के रूप में रखा गया है, जिससे स्रोत का आश्वासन बना रहता है।
theological_decisions:
- issue: ईश्वर के उत्तर की कालगत छाया
  choice: तू मुझे उत्तर देता है
  alternative: तू मुझे उत्तर देगा
  rationale: इब्रानी अपूर्ण रूप वर्तमान-अभ्यस्त या भविष्य अर्थ दे सकता है। संदर्भ में भजनकार के विश्वास का सामान्य आधार व्यक्त करने वाला वर्तमान हिंदी में स्वाभाविक है और उपलब्ध परामर्श-पाठ से भी मेल खाता है।
- issue: כִּי का संबंध
  choice: क्योंकि
  alternative: कि / निश्चय ही
  rationale: यहाँ पुकारने का कारण परमेश्वर द्वारा उत्तर दिया जाना है; कारणसूचक अर्थ वाक्य के तर्क और स्रोत की संरचना को स्पष्ट रूप से बनाए रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सरल हिंदी। प्रार्थना में परमेश्वर के लिए एकवचन आत्मीय संबोधन ‘तू/तुझे’ रखा गया है; कोई अनावश्यक व्याख्या या सांप्रदायिक शब्दावली नहीं जोड़ी गई।
