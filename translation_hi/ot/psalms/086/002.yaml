id: PSA.86.2
reference: Psalms 86:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: שָֽׁמְרָ֣/ה נַפְשִׁ/י֮ כִּֽי חָסִ֪יד אָ֥נִי הוֹשַׁ֣ע עַ֭בְדְּ/ךָ אַתָּ֣ה אֱלֹהַ֑/י הַ/בּוֹטֵ֥חַ אֵלֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/086/002.yaml
  text: Guard my life[a], for I am faithful; save your servant, my God[b], who trusts in you.
translation:
  language: hi
  text: मेरे प्राण[a] की रक्षा कर, क्योंकि मैं तेरा भक्त[b] हूँ; हे मेरे परमेश्वर, अपने उस सेवक को बचा, जो तुझ पर भरोसा रखता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘मेरे प्राण’; यहाँ आशय ‘मेरे जीवन’ या ‘मेरी’ रक्षा से है।
    reason: lexical_alternative
  - marker: b
    text: या ‘निष्ठावान’ अथवा ‘धर्मपरायण’। इब्रानी शब्द परमेश्वर के प्रति निष्ठा और भक्ति दर्शाता है, निष्पाप पूर्णता नहीं।
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמְרָה
  choice: रक्षा कर
  rationale: ईश्वर से की गई विनती में यह आज्ञार्थक क्रिया सुरक्षा और जीवन बचाए रखने का भाव स्वाभाविक हिंदी में व्यक्त करती है।
- source_word: נַפְשִׁי
  choice: मेरे प्राण
  rationale: यहाँ נֶפֶשׁ मनुष्य के जीवन या स्वयं व्यक्ति को दर्शाता है। ‘मेरे प्राण’ प्रार्थना की गरिमा बनाए रखते हुए जीवन-संरक्षण का आशय देता है; फुटनोट संभावित अर्थ स्पष्ट करता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पहली विनती का आधार बताने वाला कारणसूचक संयोजक है।
- source_word: חָסִיד
  choice: तेरा भक्त
  rationale: חָסִיד परमेश्वर के प्रति निष्ठावान और समर्पित व्यक्ति को दर्शाता है। ‘तेरा भक्त’ आधुनिक हिंदी में स्वाभाविक है और निष्पाप होने का दावा नहीं करता।
- source_word: הוֹשַׁע
  choice: बचा
  rationale: आज्ञार्थक रूप संकट से उद्धार या बचाव की सीधी विनती व्यक्त करता है।
- source_word: עַבְדְּךָ
  choice: अपने उस सेवक को
  rationale: ईश्वर को संबोधित प्रार्थना में עֶבֶד विनम्र संबंधपरक पद है; ‘सेवक’ हिंदी में उपयुक्त और प्रतिष्ठित प्रयोग है। ‘उस’ आगे आने वाले संबंधवाचक उपवाक्य से इसे सहजता से जोड़ता है।
- source_word: אַתָּה אֱלֹהַי
  choice: हे मेरे परमेश्वर
  rationale: हिब्रू पदों को संबोधन के रूप में लेना निकटवर्ती विनती के साथ स्वाभाविक बैठता है और परमेश्वर से व्यक्तिगत संबंध को सुरक्षित रखता है।
- source_word: הַבּוֹטֵחַ אֵלֶיךָ
  choice: जो तुझ पर भरोसा रखता है
  rationale: कृदंत निरंतर निर्भरता का भाव देता है और प्रसंग में ‘तेरे सेवक’ का वर्णन करता है।
theological_decisions:
- issue: חָסִיד द्वारा भजनकार का आत्म-वर्णन
  choice: ‘तेरा भक्त’—परमेश्वर के प्रति निष्ठावान और समर्पित व्यक्ति
  alternative: ‘मैं विश्वासयोग्य हूँ’, ‘मैं धर्मपरायण हूँ’, या ‘मैं पवित्र हूँ’
  rationale: यह शब्द वाचा-संबंधी निष्ठा और भक्ति का संकेत देता है, निष्पाप पूर्णता या उद्धार अर्जित करने का नहीं। अनुवाद उस तनाव को बनाए रखता है जिसमें वक्ता अपनी निष्ठा का उल्लेख करते हुए भी बचाए जाने के लिए परमेश्वर से विनती करता है।
- issue: אַתָּה אֱלֹהַי की वाक्यगत भूमिका
  choice: इसे ‘हे मेरे परमेश्वर’ संबोधन के रूप में प्रस्तुत किया गया है
  alternative: ‘तू मेरा परमेश्वर है’ को अलग कथन या कोष्ठकीय वाक्य मानना
  rationale: हिब्रू में दोनों विश्लेषण संभव हैं। संबोधन हिंदी में प्रवाहपूर्ण है, किंतु अलग कथन की वैध संभावना को नकारता नहीं।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण, प्रार्थनात्मक शैली रखी गई है। परमेश्वर के लिए एकवचन आत्मीय संबोधन ‘तू/तेरा/तुझ’ भजन की सीधी व्यक्तिगत विनती को व्यक्त करता है। वाक्य को सामान्य पाठक के लिए सहज रखते हुए इब्रानी की दो विनतियाँ और उनके संबंध सुरक्षित रखे गए हैं।
