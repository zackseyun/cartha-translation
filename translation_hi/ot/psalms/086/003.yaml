lexical_decisions:
- source_word: חָנֵּנִי
  choice: मुझ पर कृपा कर
  rationale: חנן के आज्ञार्थक रूप के साथ प्रथम पुरुष एकवचन प्रत्यय परमेश्वर से अनुग्रहपूर्ण कृपा की विनती व्यक्त करता है। ‘मुझ पर कृपा कर’ स्वाभाविक आधुनिक हिन्दी है और कृपा/अनुग्रह के मूल भाव को बनाए रखता है; ‘मुझ पर दया कर’ भी प्रसंगानुकूल विकल्प है।
- source_word: אֲדֹנָי
  choice: प्रभु
  rationale: यह परमेश्वर के लिए प्रयुक्त दिव्य उपाधि है। प्रार्थना की हिन्दी में ‘प्रभु’ स्वाभाविक और प्रतिष्ठित अनुवाद है; ‘मेरे प्रभु’ यहाँ निहित रूप को आवश्यकता से अधिक स्पष्ट कर देगा।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह विनती का कारण प्रस्तुत करता है। ‘क्योंकि’ हिन्दी में इस कारण-संबंध को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֵלֶיךָ
  choice: तुझे
  rationale: אֶל के साथ द्वितीय पुरुष एकवचन प्रत्यय पुकार की दिशा बताता है। ‘तुझे पुकारता हूँ’ हिन्दी में स्वाभाविक है और ‘तेरी ओर’ जैसी अनावश्यक स्थानिकता से बचता है।
- source_word: אֶקְרָא
  choice: मैं ... पुकारता हूँ
  rationale: קרא का अर्थ ‘पुकारना’ या ‘आवाज़ देना’ हो सकता है। प्रार्थना के संदर्भ में ‘पुकारता हूँ’ उपयुक्त है और मूल क्रिया से अधिक तीव्रता नहीं जोड़ता।
- source_word: כָּל הַיּוֹם
  choice: दिन भर
  rationale: शाब्दिक अर्थ ‘सारा दिन’ है। ‘दिन भर’ आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक है तथा लगातार या बार-बार की गई प्रार्थना का भाव बनाए रखता है।
theological_decisions:
- issue: दिव्य उपाधि אֲדֹנָי का अनुवाद
  choice: प्रभु
  alternative: मेरे प्रभु; स्वामी
  rationale: यहाँ भजनकार प्रार्थना में परमेश्वर को मानक दिव्य उपाधि से संबोधित करता है। ‘प्रभु’ उपाधि का अनुवाद करता है, प्रार्थनात्मक गरिमा बनाए रखता है और किसी विशिष्ट सांप्रदायिक व्याख्या को नहीं जोड़ता।
- issue: חנן में कृपा और दया के अर्थ-संबंध को बनाए रखना
  choice: मुख्य पाठ में ‘कृपा कर’, पादटिप्पणी में ‘दया कर’
  alternative: मुख्य पाठ में ‘दया कर’
  rationale: इब्रानी क्रिया अनुग्रहपूर्ण कृपा या दया की विनती व्यक्त कर सकती है। मुख्य पाठ मूल के कृपा/अनुग्रह पक्ष को सामने रखता है, जबकि पादटिप्पणी वैध दया-संबंधी अर्थ को सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, सहज और प्रार्थनात्मक गरिमा वाली रखी गई है। परमेश्वर के लिए निकट और पारंपरिक एकवचन संबोधन ‘तुझे’ प्रयुक्त हुआ है; वाक्य विन्यास सरल है और मूल के कारण-संबंध तथा ‘दिन भर’ के कालगत बल को सुरक्षित रखता है।
