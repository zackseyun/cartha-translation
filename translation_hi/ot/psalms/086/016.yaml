  edition: WLC
  text: פְּנֵ֥ה אֵלַ֗/י וְ/חָ֫נֵּ֥/נִי תְּנָֽ/ה עֻזְּ/ךָ֥ לְ/עַבְדֶּ֑/ךָ וְ֝/הוֹשִׁ֗יעָ/ה לְ/בֶן אֲמָתֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/086/016.yaml
  text: Turn to me and be gracious to me[a]; give your strength to your servant[b], and save the son of your maidservant.
translation:
  language: hi
  text: 'मेरी ओर मुड़ और मुझ पर अनुग्रह कर;

    अपने सेवक को अपना बल दे,

    और अपनी दासी के बेटे को बचा।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פְּנֵה אֵלַי
  choice: मेरी ओर मुड़
  rationale: यह परमेश्वर से प्रार्थी की ओर ध्यान देने की विनती है। ‘मेरी ओर मुड़’ दिशात्मक अर्थ को स्वाभाविक और संक्षिप्त हिन्दी में व्यक्त करता है।
- source_word: וְחָנֵּנִי
  choice: और मुझ पर अनुग्रह कर
  rationale: חנן कृपापूर्ण अनुग्रह या कृपा दिखाने का भाव रखता है। ‘अनुग्रह कर’ दया मात्र के भाव तक इसे सीमित नहीं करता।
- source_word: תְּנָה עֻזְּךָ
  choice: अपना बल दे
  rationale: עֹז का मूल अर्थ बल या सामर्थ्य है। ‘अपना बल दे’ मूल की सीधी और काव्यात्मक अभिव्यक्ति है।
- source_word: לְעַבְדֶּךָ
  choice: अपने सेवक को
  rationale: भजन की प्रार्थनात्मक पृष्ठभूमि में עבד विनम्र अधीनता और परमेश्वर से संबंध प्रकट करता है; ‘सेवक’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: וְהוֹשִׁיעָה
  choice: और ... बचा
  rationale: ישׁע संकट से बचाने या उद्धार करने का व्यापक अर्थ रखता है। इस विनती में ‘बचा’ सीधा और सहज है।
- source_word: לְבֶן אֲמָתֶךָ
  choice: अपनी दासी के बेटे को
  rationale: यह इब्रानी पदबंध का निकट और स्वाभाविक रूप है। ‘दासी’ אמה के स्त्रीलिंग सेवक-संबंध को बनाए रखता है और मातृ-संबंध को अस्पष्ट नहीं करता।
theological_decisions:
- issue: עבד और אמה द्वारा व्यक्त विनम्र आत्म-पहचान
  choice: ‘सेवक’ और ‘दासी’ के भिन्न शब्द बनाए रखे गए हैं।
  alternative: ‘दास’ और ‘दासी’, अथवा दोनों स्थानों पर सामान्य सेवक-संबंधी भाषा
  rationale: मूल पाठ दो संबंधित किंतु भिन्न संज्ञाएँ प्रयोग करता है। हिन्दी में ‘सेवक’ प्रार्थनात्मक विनम्रता को स्वाभाविक रूप से व्यक्त करता है, जबकि ‘दासी’ मातृ-संबंध और स्त्रीलिंग पद को स्पष्ट रखता है; इससे सामाजिक संस्था पर अनावश्यक जोर दिए बिना मूल तनाव सुरक्षित रहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और प्रार्थनात्मक शैली अपनाई गई है। पंक्ति-विन्यास इब्रानी काव्य के तीन आग्रहों को स्पष्ट करता है। किसी पादटिप्पणी की आवश्यकता नहीं समझी गई, इसलिए मुख्य पाठ में कोई पादटिप्पणी-चिह्न नहीं है।
