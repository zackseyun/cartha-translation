source:
  edition: WLC
  text: אֵין כָּמ֖וֹ/ךָ בָ/אֱלֹהִ֥ים אֲדֹנָ֗/י וְ/אֵ֣ין כְּֽ/מַעֲשֶֽׂי/ךָ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/086/008.yaml
  text: There is none like you among the gods[a], Lord[b], and there are no works like yours.
translation:
  language: hi
  text: हे प्रभु, देवताओं में आपके समान कोई नहीं[a], और आपके कार्यों के समान कोई कार्य नहीं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “स्वर्गीय प्राणियों में।” इब्रानी में शाब्दिक रूप से “देवताओं में” है; यह बाइबल में प्रभु को हर तथाकथित दैवी शक्ति से अतुलनीय बताने का एक सामान्य ढंग है।
    reason: alternative_reading
  - marker: b
    text: या, “काम” अथवा “कृत्य”।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין
  choice: कोई नहीं
  rationale: यह अस्तित्ववाचक निषेध है; काव्यात्मक तुलना में हिंदी का स्वाभाविक और स्पष्ट रूप।
- source_word: כָּמוֹךָ
  choice: आपके समान
  rationale: तुलनात्मक अर्थ को सीधे और सम्मानसूचक आधुनिक हिंदी में व्यक्त करता है।
- source_word: בָאֱלֹהִים
  choice: देवताओं में
  rationale: पूर्वसर्ग सहित बहुवचन रूप को बनाए रखता है और मूल पाठ की काव्यात्मक तथा धर्मवैचारिक खिंचाव को अनावश्यक रूप से सरल नहीं करता।
- source_word: אֲדֹנָי
  choice: हे प्रभु
  rationale: यहाँ संबोधन है; 'हे प्रभु' प्रार्थना की गरिमामय और स्वाभाविक हिंदी है।
- source_word: וְאֵין
  choice: और ... कोई नहीं
  rationale: दूसरी समानांतर पंक्ति के निषेध को हिंदी में स्वाभाविक ढंग से व्यक्त करता है।
- source_word: כְמַעֲשֶׂיךָ
  choice: आपके कामों के समान कोई काम
  rationale: מַעֲשֶׂה के व्यापक अर्थ—काम, कार्य, कर्म—को साधारण पाठक के लिए स्पष्ट रखता है और तुलना की इब्रानी संरचना को बचाता है।
theological_decisions:
- issue: '''देवताओं में'' का अर्थ'
  choice: इब्रानी के बहुवचन को 'देवताओं में' के रूप में बनाए रखा गया है, जो प्रभु की अतुलनीयता घोषित करता है।
  alternative: '''स्वर्गीय प्राणियों में'' अथवा सरल करके ''कोई देवता आपके समान नहीं''।'
  rationale: मूल में אֱלֹהִים बहुवचन है। उसका सीधा अनुवाद पाठ की काव्यात्मक शक्ति और वास्तविक अर्थगत तनाव को बचाता है, बिना बहुदेववाद का समर्थन किए या किसी एक व्याख्या को अनिवार्य बनाए।
translation_notes:
  register: आधुनिक मानक हिंदी; प्रार्थनामय, गरिमामय और सामान्य पाठकों के लिए सुबोध। सम्मानसूचक 'आप' अपनाया गया है। दूसरी पंक्ति में 'कामों के समान कोई काम' जानबूझकर रखा गया है ताकि इब्रानी समानांतरता स्पष्ट रहे।
