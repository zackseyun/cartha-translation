  text: וְ/אַתָּ֣ה אֲ֭דֹנָ/י אֵל רַח֣וּם וְ/חַנּ֑וּן אֶ֥רֶךְ אַ֝פַּ֗יִם וְ/רַב חֶ֥סֶד וֶ/אֱמֶֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/086/015.yaml
  text: But you[a], Lord, are a compassionate and gracious God, slow to anger and abounding in steadfast love and faithfulness.
translation:
  language: hi
  text: परन्तु, हे प्रभु, आप करुणामय और अनुग्रहकारी परमेश्वर हैं; आप क्रोध करने में देर करते हैं और अटल प्रेम तथा विश्वासयोग्यता[a] से भरपूर हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सत्य।” अटल प्रेम के साथ इस इब्रानी वाचा-सूत्र में इस शब्द का अर्थ अक्सर विश्वासयोग्यता या भरोसेमन्दता होता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַתָּה
  choice: परन्तु ... आप
  rationale: संयोजक वाव यहाँ पिछले प्रसंग की विरोधी स्थिति के बीच भेद प्रकट करता है; स्पष्ट सर्वनाम पर दिए गए बल को आदरसूचक ‘आप’ बनाए रखता है।
- source_word: אֲדֹנָי
  choice: हे प्रभु
  rationale: यह आदोनाय का श्रद्धासूचक ईश्वरीय संबोधन है; हिन्दी में संबोधन को स्वाभाविक बनाने के लिए ‘हे’ जोड़ा गया है।
- source_word: אֵל
  choice: परमेश्वर
  rationale: यहाँ शब्द प्रभु को परमेश्वर के रूप में पहचानता है; ‘परमेश्वर’ आधुनिक हिन्दी बाइबलीय भाषा में स्पष्ट और गरिमापूर्ण है, जबकि ‘सामर्थी परमेश्वर’ अर्थ को आवश्यकता से अधिक विशिष्ट बनाता।
- source_word: רַחוּם
  choice: करुणामय
  rationale: यह गहरी दया और सहानुभूतिपूर्ण करुणा का विशेषण है तथा ‘अनुग्रहकारी’ के साथ सूत्रबद्ध जोड़ी को सहज रूप देता है।
- source_word: וְ/חַנּוּן
  choice: और अनुग्रहकारी
  rationale: यह कृपा दिखाने और अनुग्रहपूर्वक व्यवहार करने के स्वभाव को व्यक्त करता है।
- source_word: אֶרֶךְ אַפַּיִם
  choice: क्रोध करने में धीरजवन्त
  rationale: शाब्दिक इब्रानी मुहावरे ‘नाक में लम्बा’ का आशय उकसावे पर शीघ्र क्रोधित न होना है; यह हिन्दी अभिव्यक्ति उस धैर्य और विलम्बित क्रोध दोनों को व्यक्त करती है।
- source_word: וְ/רַב חֶסֶד
  choice: और अटल प्रेम ... से भरपूर
  rationale: רַב प्रचुरता और חֶסֶד टिकाऊ, निष्ठावान प्रेम-दया को दर्शाता है; ‘अटल प्रेम’ सहज हिन्दी में इसकी वाचाई दृढ़ता को संप्रेषित करता है।
- source_word: וֶ/אֱמֶת
  choice: तथा विश्वासयोग्यता
  rationale: חֶסֶד के साथ इस सूत्र में אֱמֶת प्रायः विश्वसनीयता और निष्ठा का अर्थ रखता है, केवल अमूर्त सत्य का नहीं।
theological_decisions:
- issue: निर्गमन 34:6 की वाचा-सूत्रात्मक प्रतिध्वनि
  choice: ‘करुणामय और अनुग्रहकारी ... अटल प्रेम तथा विश्वासयोग्यता से भरपूर’
  alternative: ‘दयालु और अनुग्रहकारी ... करुणा और सत्य से भरपूर’
  rationale: चुना हुआ रूप मूल सूत्र की करुणा, अनुग्रह, धैर्य, स्थिर प्रेम और भरोसेमन्द निष्ठा को आधुनिक, सहज हिन्दी में बनाए रखता है और किसी सम्प्रदायगत व्याख्या को नहीं जोड़ता।
- issue: אֱמֶת का अर्थ
  choice: विश्वासयोग्यता
  alternative: सत्य
  rationale: חֶסֶד के साथ वाचाई सूत्र में सम्बन्धपरक निष्ठा और भरोसेमन्दता प्रमुख है; फिर भी ‘सत्य’ एक वास्तविक शाब्दिक सम्भावना है।
translation_notes:
  register: आधुनिक मानक हिन्दी, आदरसूचक द्वितीय पुरुष और गरिमापूर्ण भक्ति-भाषा। अत्यधिक संस्कृतनिष्ठ या पुरातन पदावली से बचते हुए सूत्रात्मक लय को सुरक्षित रखा गया है।
