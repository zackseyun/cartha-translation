id: PSA.86.5
reference: Psalms 86:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּֽי אַתָּ֣ה אֲ֭דֹנָ/י ט֣וֹב וְ/סַלָּ֑ח וְ/רַב חֶ֝֗סֶד לְ/כָל קֹרְאֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/086/005.yaml
  text: For you[a], Lord, are good and forgiving, abounding in steadfast love to all who call on you.
translation:
  language: hi
  text: क्योंकि हे प्रभु, आप भले और क्षमा करनेवाले हैं, और उन सबके प्रति अटल प्रेम से भरपूर हैं जो आपको पुकारते हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले निवेदन का आधार बताता है; हिंदी में ‘क्योंकि’ इस कारणसूचक संबंध को स्वाभाविक रूप से स्पष्ट करता है।
- source_word: אַתָּה
  choice: आप
  rationale: मूल का स्पष्ट सर्वनाम बल देता है; परमेश्वर को सीधे संबोधित करते हुए आदरसूचक ‘आप’ स्वाभाविक हिंदी है।
- source_word: אֲדֹנָי
  choice: प्रभु
  rationale: यहाँ אֲדֹנָי दिव्य उपाधि है, चतुरक्षरीय नाम नहीं; ‘प्रभु’ आधुनिक धार्मिक हिंदी में गरिमापूर्ण और सहज है।
- source_word: טוֹב
  choice: भले
  rationale: ‘भला’ मूल के व्यापक नैतिक और कृपालु अर्थ को बिना केवल ‘दयालु’ तक सीमित किए बनाए रखता है।
- source_word: סַלָּח
  choice: क्षमा करनेवाले
  rationale: यह विशेषण परमेश्वर के क्षमाशील स्वभाव को व्यक्त करता है; यह ‘क्षमा करने को तैयार’ की अपेक्षा मूल के एक-शब्दीय कथन के अधिक निकट है।
- source_word: רַב חֶסֶד
  choice: अटल प्रेम से भरपूर
  rationale: ‘भरपूर’ प्रचुरता और ‘अटल प्रेम’ חֶסֶד के स्थायी प्रेम तथा निष्ठा—दोनों को सुबोध हिंदी में व्यक्त करते हैं।
- source_word: לְכָל
  choice: उन सबके प्रति
  rationale: यह परमेश्वर के अटल प्रेम के प्राप्तकर्ताओं को स्पष्ट करता है और हिंदी में स्वाभाविक संबंध बनाता है।
- source_word: קֹרְאֶיךָ
  choice: जो आपको पुकारते हैं
  rationale: यह प्रार्थना में परमेश्वर को पुकारने या उनका आह्वान करने का सहज और व्यापक हिंदी रूप है।
theological_decisions:
- issue: सीधे संबोधन में אֲדֹנָי का अनुवाद
  choice: प्रभु
  alternative: स्वामी / मेरे प्रभु
  rationale: मूल में दिव्य उपाधि אֲדֹנָי है, יהוה नहीं। इसलिए ‘प्रभु’ उपाधि को ठीक प्रकार व्यक्त करता है और परमेश्वर के वाचा-नाम की विशिष्ट परंपरा को यहाँ नहीं लाता।
- issue: חֶסֶד का अनुवाद
  choice: अटल प्रेम
  alternative: विश्वासयोग्य प्रेम / करुणा
  rationale: ‘अटल प्रेम’ प्रेमपूर्ण कृपा और स्थायी निष्ठा के संयुक्त भाव को बनाए रखता है; केवल ‘करुणा’ अर्थ को संकरा कर देती।
translation_notes:
  register: आधुनिक मानक हिंदी, आदरसूचक सीधे संबोधन और भजन के अनुरूप गरिमापूर्ण किंतु सहज शैली। ‘हे प्रभु’ हिंदी में संबोधन को स्पष्ट करता है; वाक्य मूल की कारणसूचक संरचना और समानांतर विशेषणों को बनाए रखता है।
