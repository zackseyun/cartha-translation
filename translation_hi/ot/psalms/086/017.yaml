base_translation:
  language: en
  yaml_path: translation/ot/psalms/086/017.yaml
  text: Show me a sign for good[a], so that those who hate me may see and be put to shame, because you, O Yahweh, have helped me and comforted me.
translation:
  language: hi
  text: मेरे लिए भलाई का एक चिन्ह दिखा[a], ताकि मुझसे घृणा करनेवाले उसे देखें और लज्जित हों, क्योंकि, हे याहवे, तूने मेरी सहायता की है और मुझे सांत्वना दी है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरे साथ अनुग्रह का एक चिन्ह कर।” इब्रानी में शाब्दिक रूप से, “मेरे साथ भलाई के लिए एक चिन्ह कर।”
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲשֵׂה עִמִּי אוֹת
  choice: मेरे लिए ... एक चिन्ह दिखा
  rationale: इब्रानी का शाब्दिक रूप ‘मेरे साथ एक चिन्ह कर/बना’ है। आधुनिक हिन्दी में ‘मेरे लिए ... चिन्ह दिखा’ दृश्य ईश्वरीय अनुग्रह की प्रार्थना को स्वाभाविक ढंग से व्यक्त करता है; अधिक शाब्दिक संभावना पादटिप्पणी में रखी गई है।
- source_word: לְטוֹבָה
  choice: भलाई का
  rationale: यह पदबंध भलाई, हित या अनुग्रह सूचित करनेवाले चिन्ह को दर्शाता है। ‘भलाई का’ मूल की व्यापकता बनाए रखता है और ‘मेरे हित का’ जैसी व्याख्यात्मक स्पष्टता नहीं जोड़ता।
- source_word: וְיִרְאוּ
  choice: ताकि ... देखें
  rationale: आज्ञार्थक क्रिया के बाद यह अपूर्ण क्रिया अपेक्षित परिणाम अथवा उद्देश्य प्रकट करती है; ‘ताकि’ उस संबंध को स्पष्ट और स्वाभाविक हिन्दी में रखता है।
- source_word: שֹׂנְאַי
  choice: मुझसे घृणा करनेवाले
  rationale: कृदन्त का अर्थ व्यक्तिगत रूप से ‘मुझसे घृणा करनेवाले’ है; ‘मेरे शत्रु’ कहना अर्थ को अधिक व्यापक बना देता।
- source_word: וְיֵבֹשׁוּ
  choice: लज्जित हों
  rationale: בוש यहाँ विरोधियों के सार्वजनिक रूप से निरुत्तर और अपमानित होने का भाव रख सकता है। ‘लज्जित हों’ हिन्दी में संक्षिप्त और स्वाभाविक है तथा केवल भीतरी पछतावे तक सीमित नहीं है।
- source_word: עֲזַרְתַּנִי
  choice: तूने मेरी सहायता की है
  rationale: पूर्ण क्रिया बीती हुई, किंतु वर्तमान प्रार्थना के लिए प्रासंगिक सहायता व्यक्त करती है; हिन्दी पूर्ण वर्तमान इस संबंध को बनाए रखता है।
- source_word: וְנִחַמְתָּנִי
  choice: मुझे सांत्वना दी है
  rationale: निफ़ाल रूप यहाँ सांत्वना या ढाढ़स दिए जाने का अर्थ देता है। ‘सांत्वना दी है’ आधुनिक, स्पष्ट और गरिमापूर्ण हिन्दी है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहवे
  alternative: यहोवा
  rationale: मूल पाठ में चार-अक्षरीय व्यक्तिगत नाम सीधे आया है। ‘यहवे’ उसका प्रचलित विद्वतापरक लिप्यंतरण है और उसे किसी उपाधि से नहीं बदलता।
- issue: भलाई के चिन्ह का स्वरूप
  choice: अर्थ को सामान्य रखा गया
  alternative: चमत्कार, विजय या उद्धार का विशिष्ट चिन्ह
  rationale: मूल केवल ‘भलाई का चिन्ह’ कहता है और यह निश्चित नहीं करता कि वह चमत्कार, विजय, संरक्षण या अनुग्रह का कोई अन्य दृश्य प्रमाण है; इसलिए तनाव और व्यापकता सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी, एकवचन आत्मीय संबोधन ‘तू’ के साथ, जो भजन की सीधी प्रार्थना और इब्रानी द्वितीय पुरुष एकवचन को दर्शाता है। भाषा साधारण पाठक के लिए स्पष्ट रखते हुए गरिमापूर्ण है।
