  text: הַאֲזִ֣ינָ/ה יְ֭הוָה תְּפִלָּתִ֑/י וְ֝/הַקְשִׁ֗יבָ/ה בְּ/ק֣וֹל תַּחֲנוּנוֹתָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/086/006.yaml
  text: Give ear[a], O Yahweh, to my prayer, and listen to the voice of my pleas for mercy.
translation:
  language: hi
  text: 'हे यहोवा, मेरी प्रार्थना की ओर कान लगा,

    और मेरी विनतियों की पुकार पर ध्यान दे।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַאֲזִינָה
  choice: कान लगा
  rationale: आज्ञार्थक क्रिया אזן ध्यानपूर्वक सुनने के लिए कान लगाने का सजीव भाव रखती है; यह हिंदी में स्वाभाविक रहते हुए इब्रानी बिंब को बचाती है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चतुर्वर्णी ईश्वरीय नाम को किसी उपाधि से बदलने के बजाय हिंदी में प्रचलित नामरूप से व्यक्त किया गया है।
- source_word: תְּפִלָּתִי
  choice: मेरी प्रार्थना
  rationale: תְּפִלָּה और प्रथम पुरुष एकवचन प्रत्यय का सीधा और स्वाभाविक अनुवाद।
- source_word: וְהַקְשִׁיבָה
  choice: और ... ध्यान दे
  rationale: קשב ध्यान लगाकर सुनने की अपील करता है; 'ध्यान दे' पहली पंक्ति के 'कान लगा' के साथ काव्यात्मक समानांतरता रखते हुए पुनरुक्ति घटाता है।
- source_word: בְּקוֹל
  choice: आवाज़ पर
  rationale: קוֹל का ठोस अर्थ 'आवाज़' है; इसे बनाए रखने से प्रार्थनापूर्ण पुकार का श्रव्य बिंब सुरक्षित रहता है।
- source_word: תַּחֲנוּנוֹתָי
  choice: मेरी विनतियों
  rationale: बहुवचन תַּחֲנוּנִים अनुग्रह की याचना करने वाली गंभीर प्रार्थनाओं को दर्शाता है; 'विनतियाँ' आधुनिक, गरिमापूर्ण और संक्षिप्त हिंदी विकल्प है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम से सीधा संबोधन है। हिंदी पाठकों के लिए प्रचलित लिप्यंतरण 'यहोवा' नाम को उपाधि में बदले बिना सुरक्षित रखता है; 'याहवे' संभावित विद्वत्तापरक पुनर्निर्माण है और 'प्रभु' नाम के स्थान पर उपाधि रखता।
translation_notes:
  register: आधुनिक मानक हिंदी में प्रार्थनापूर्ण, गरिमापूर्ण और काव्यात्मक शैली। इब्रानी के दो समानांतर श्रवण-आग्रहों को 'कान लगा' और 'ध्यान दे' से अलग किंतु संबद्ध रखा गया है।
