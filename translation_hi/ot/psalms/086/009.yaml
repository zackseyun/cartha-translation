source:
  edition: WLC
  text: כָּל גּוֹיִ֤ם אֲשֶׁ֥ר עָשִׂ֗יתָ יָב֤וֹאוּ וְ/יִשְׁתַּחֲו֣וּ לְ/פָנֶ֣י/ךָ אֲדֹנָ֑/י וִֽ/יכַבְּד֣וּ לִ/שְׁמֶֽ/ךָ־׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/086/009.yaml
  text: All the nations that you have made will come and bow down before you[a], Lord[b], and they will honor your name.
translation:
  language: hi
  text: हे प्रभु, तूने जितने राष्ट्र बनाए हैं, वे सब आएँगे और तेरे सामने दण्डवत् करेंगे[a] और तेरे नाम का आदर करेंगे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तेरे सामने झुककर आराधना करेंगे”; इब्रानी क्रिया श्रद्धा से झुकने या दण्डवत् होने और, विस्तार से, आराधना करने का भाव व्यक्त कर सकती है।
    reason: lexical_alternative
  - marker: b
    text: या, “तेरे नाम की महिमा करेंगे।”
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל גּוֹיִם
  choice: जितने राष्ट्रों को... वे सब
  rationale: यह स्वाभाविक हिन्दी रचना כָּל की सार्वभौमिक व्यापकता और सम्बन्धवाचक उपवाक्य दोनों को स्पष्ट रूप से व्यक्त करती है। ‘राष्ट्र’ यहाँ समस्त जातीय-राष्ट्रीय समुदायों के लिए उपयुक्त है; ‘अन्यजाति’ अनावश्यक इस्राएल-विरुद्ध-गैर-इस्राएल भेद ला सकता है।
- source_word: אֲשֶׁר עָשִׂיתָ
  choice: जिन्हें तूने बनाया है
  rationale: עָשָׂה का सीधा अर्थ ‘बनाना’ है। ‘सृजा’ सम्भव है, पर मूल क्रिया से अधिक विशिष्ट होता; पूर्ण क्रिया का वर्तमान-संबद्ध भाव ‘बनाया है’ से सहजता से आता है।
- source_word: יָבֹאוּ
  choice: आकर
  rationale: हिब्रू भविष्याभिमुख अपूर्ण क्रिया को अगले समन्वित कार्य के साथ स्वाभाविक हिन्दी में ‘आकर ... करेंगे’ कहा गया है; इससे आने की भावी अपेक्षा बनी रहती है।
- source_word: וְיִשְׁתַּחֲווּ לְפָנֶיךָ
  choice: तेरे सामने दण्डवत् करेंगे
  rationale: השתחוה शारीरिक रूप से झुकने या भूमि पर गिरकर श्रद्धा प्रकट करने को बताता है और प्रसंग में आराधना भी सूचित करता है। ‘दण्डवत् करेंगे’ दोनों आयामों को अपेक्षाकृत संक्षेप और गरिमा से रखता है।
- source_word: אֲדֹנָי
  choice: हे प्रभु
  rationale: यह परमेश्वर के लिए प्रयुक्त श्रद्धासूचक सम्बोधन है। हिन्दी में ‘हे प्रभु’ सम्बोधन और दिव्य उपाधि दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: וִיכַבְּדוּ לִשְׁמֶךָ
  choice: तेरे नाम का आदर करेंगे
  rationale: पिएल כבד का अर्थ आदर देना या महिमा करना है। ‘नाम का आदर करेंगे’ आधुनिक हिन्दी में स्पष्ट है और परमेश्वर की प्रकट पहचान तथा प्रतिष्ठा के सम्मान का भाव रखता है।
theological_decisions:
- issue: राष्ट्रों की प्रतिक्रिया का विस्तार
  choice: परमेश्वर द्वारा बनाए गए सभी राष्ट्र भविष्य में उसके सामने दण्डवत् करेंगे
  alternative: इसे बहुत-से राष्ट्रों के विषय में अतिशयोक्तिपूर्ण स्तुति मानना
  rationale: כָּל גּוֹיִם पद का सीधा सार्वभौमिक विस्तार है। अनुवाद इसे न तो सीमित करता है, न यह निर्धारित करता है कि इसकी पूर्ति किस रीति या समय में होगी।
- issue: השתחוה में शारीरिक नमन और आराधना का सम्बन्ध
  choice: मुख्य पाठ में ‘दण्डवत् करेंगे’, पादटिप्पणी में ‘आराधना करेंगे’
  alternative: मुख्य पाठ में केवल ‘आराधना करेंगे’
  rationale: मूल क्रिया की शारीरिक मुद्रा और उससे निकलने वाले आराधनात्मक अर्थ दोनों सुरक्षित रखने के लिए अधिक ठोस अर्थ मुख्य पाठ में और विस्तृत धार्मिक अर्थ पादटिप्पणी में दिया गया है।
- issue: אֲדֹנָי का अनुवाद
  choice: प्रभु
  alternative: स्वामी
  rationale: दिव्य उपाधि के रूप में ‘प्रभु’ आधुनिक हिन्दी बाइबलीय प्रयोग में स्वाभाविक, श्रद्धापूर्ण और व्यापक रूप से समझी जाने वाली अभिव्यक्ति है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य-पाठक-सुलभ काव्यात्मक गद्य। भजन की प्रत्यक्ष प्रार्थना के अनुरूप परमेश्वर के लिए निकट और पारम्परिक एकवचन सम्बोधन ‘तू/तेरे’ रखा गया है। ‘दण्डवत्’ को उसकी व्यापक समझ और मूल की शारीरिक श्रद्धा बनाए रखने के लिए चुना गया है; अर्थ पादटिप्पणी में खोला गया है।
