base_translation:
  language: en
  yaml_path: translation/ot/psalms/086/001.yaml
  text: A prayer of David. Incline your ear[a], O Yahweh, and answer me, for I am poor and needy.
translation:
  language: hi
  text: 'दाऊद की प्रार्थना।


    हे याहवे, मेरी ओर कान झुका और मुझे उत्तर दे, क्योंकि मैं गरीब[a] और जरूरतमंद हूँ।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्योंकि मैं पीड़ित और जरूरतमंद हूँ।” इब्रानी शब्द עָנִי का अर्थ गरीब, पीड़ित या दीन हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּפִלָּה
  choice: प्रार्थना
  rationale: भजन के शीर्षक में प्रयुक्त विधा-सूचक संज्ञा का स्वाभाविक और सटीक हिन्दी रूप।
- source_word: לְדָוִד
  choice: दाऊद की
  rationale: शीर्षकों में לְ संबंध, संबद्धता या कर्तृत्व सूचित कर सकता है; ‘दाऊद की’ इस व्यापकता को बिना अनावश्यक रूप से ‘दाऊद द्वारा’ निर्धारित किए बनाए रखता है।
- source_word: הַטֵּה ... אָזְנְךָ
  choice: मेरी ओर कान लगा
  rationale: ‘कान झुकाने’ के इब्रानी रूपक को स्वाभाविक आधुनिक हिन्दी मुहावरे में रखते हुए ध्यान से सुनने का भाव व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ के व्यक्तिगत ईश्वरीय नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित नाम-रूप से प्रस्तुत किया गया है।
- source_word: עֲנֵנִי
  choice: मुझे उत्तर दे
  rationale: प्रार्थना के प्रसंग में ענה का सीधा और स्वाभाविक अर्थ ‘उत्तर देना’ है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह प्रार्थना के निवेदन का आधार प्रस्तुत करता है।
- source_word: עָנִי
  choice: दीन
  rationale: यह शब्द निर्धन, पीड़ित या दबे हुए व्यक्ति को सूचित कर सकता है; ‘दीन’ हिन्दी में इन अर्थ-छायाओं को कुछ हद तक समेटता है और אֶבְיוֹן से अनावश्यक पुनरुक्ति घटाता है।
- source_word: וְאֶבְיוֹן
  choice: और दरिद्र
  rationale: अभावग्रस्त और जरूरतमंद होने का ठोस आर्थिक-सामाजिक भाव रखता है तथा עָנִי के साथ समानांतर युग्म को बनाए रखता है।
- source_word: אָנִי
  choice: मैं ... हूँ
  rationale: इब्रानी की संज्ञात्मक उपवाक्य-रचना को हिन्दी में आवश्यक सहायक क्रिया सहित स्वाभाविक रूप दिया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: व्यक्तिगत वाचा-नाम को ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित नहीं किया गया। आधुनिक हिन्दी पाठकों में पहचाने जाने वाले पारंपरिक नाम-रूप ‘यहोवा’ को चुना गया, जबकि ‘याहवे’ अधिक प्रत्यक्ष विद्वत् लिप्यंतरण है।
- issue: עָנִי की अर्थ-छाया
  choice: दीन
  alternative: गरीब / पीड़ित
  rationale: शब्द में आर्थिक निर्धनता के साथ दुःख या दबे होने का भाव भी संभव है। मुख्य पाठ में ‘दीन’ रखा गया और वास्तविक अर्थ-विकल्पों को पादटिप्पणी में सुरक्षित किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण प्रार्थना-शैली रखी गई है। ‘मेरी ओर कान लगा’ मूल रूपक को हिन्दी में स्वाभाविक बनाता है। शीर्षक को पद के मुख्य निवेदन से अलग पंक्ति में रखा गया है।
