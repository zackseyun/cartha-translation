  yaml_path: translation/ot/psalms/086/014.yaml
  text: God[a], arrogant men have risen against me, and a band of ruthless men has sought my life[c][b]; they have not set you before them.
translation:
  language: hi
  text: परमेश्वर[a], घमंडी लोग मेरे विरुद्ध उठ खड़े हुए हैं; निर्दयी लोगों का दल मेरे प्राण के पीछे पड़ा है[b]। उन्होंने तुझे अपने सामने नहीं रखा है[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हे परमेश्वर, घमंडी लोग मेरे विरुद्ध उठ खड़े हुए हैं।”
    reason: lexical_alternative
  - marker: b
    text: “मेरे प्राण की खोज करना” इब्रानी मुहावरा है, जिसका अर्थ है कि वे मुझे मार डालना चाहते हैं।
    reason: cultural_note
  - marker: c
    text: या, “उन्होंने तुझे अपनी आँखों के सामने नहीं रखा”; अर्थात् वे परमेश्वर का कोई ध्यान नहीं रखते।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: यहाँ यह इस्राएल के परमेश्वर को संबोधित करने वाला एकवचन प्रयोग है। मुख्य पाठ में सीधे संबोधन को बिना अलग विस्मयादिबोधक शब्द जोड़े रखा गया है।
- source_word: זֵדִים
  choice: घमण्डी लोग
  rationale: यह विशेषण संज्ञा के रूप में प्रयुक्त होकर अभिमानी, उद्दण्ड व्यक्तियों को दर्शाता है; आधुनिक हिन्दी में “घमण्डी लोग” अर्थ को सहजता से व्यक्त करता है।
- source_word: קָמוּ עָלַי
  choice: मेरे विरुद्ध उठ खड़े हुए हैं
  rationale: यह शत्रुतापूर्वक किसी के विरुद्ध खड़े होने का इब्रानी मुहावरा है; हिन्दी का यह प्रयोग उसी विरोधी भाव और पूर्ण क्रिया के वर्तमान परिणाम को व्यक्त करता है।
- source_word: וַעֲדַת
  choice: दल
  rationale: संज्ञा एकत्र समूह या सभा को दर्शाती है। शत्रुतापूर्ण प्रसंग में “दल” सहज और उपयुक्त है।
- source_word: עָרִיצִים
  choice: निर्दयी लोग
  rationale: शब्द हिंसक, कठोर और दमनकारी व्यक्तियों का बोध कराता है। “निर्दयी लोग” राजनीतिक अर्थ को अनावश्यक रूप से सीमित किए बिना उनकी क्रूरता प्रकट करता है।
- source_word: בִּקְשׁוּ נַפְשִׁי
  choice: मेरे प्राण के पीछे पड़ा है
  rationale: शाब्दिक रूप से यह “मेरे प्राण को ढूँढ़ा/खोजा” है और प्रायः जान लेने के इरादे का मुहावरा है। हिन्दी का “प्राण के पीछे पड़ना” उसी घातक आशय को स्वाभाविक मुहावरे में व्यक्त करता है; एकवचन “पड़ा है” सामूहिक कर्ता “दल” से मेल खाता है।
- source_word: וְלֹא שָׂמוּךָ לְנֶגְדָּם
  choice: उन्होंने तुझे अपने सामने नहीं रखा है
  rationale: 'यह मूल रूपक को बनाए रखता है: वे परमेश्वर को अपने सामने रखकर उसका ध्यान या भय नहीं करते।'
theological_decisions:
- issue: परमेश्वर के संबोधन में “हे” को स्पष्ट करना
  choice: परमेश्वर
  alternative: हे परमेश्वर
  rationale: पद स्पष्टतः परमेश्वर को संबोधित है, पर इब्रानी में “हे” के समान कोई अलग अव्यय नहीं है। इसलिए मुख्य पाठ सीधा संबोधन रखता है और अधिक स्पष्ट हिन्दी संबोधन को पादटिप्पणी में देता है।
- issue: “मेरे प्राण को खोजा” में हत्या के आशय को कितना स्पष्ट करना
  choice: मेरे प्राण के पीछे पड़ा है
  alternative: मुझे मार डालना चाहता है
  rationale: इब्रानी मुहावरा प्रायः प्राण लेने की मंशा बताता है। चुना हुआ हिन्दी मुहावरा उस आशय को स्पष्ट करता है, पर “मार डालना” जोड़कर अर्थ को मुख्य पाठ में पूरी तरह व्याख्यायित नहीं करता।
- issue: परमेश्वर को सामने न रखने के रूपक को बनाए रखना
  choice: उन्होंने तुझे अपने सामने नहीं रखा है
  alternative: उन्होंने तेरा कोई ध्यान नहीं रखा
  rationale: मुख्य पाठ इब्रानी स्थान-संबंधी रूपक और उससे उत्पन्न धार्मिक तनाव को सुरक्षित रखता है; निहित अर्थ पादटिप्पणी में समझाया गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और प्रार्थनात्मक गरिमा वाली रखी गई है। परमेश्वर के लिए एकवचन “तू/तुझे” मूल इब्रानी के सीधे, निकट संबोधन को सुरक्षित रखता है। समानांतर उपवाक्यों को अर्धविराम और पूर्णविराम से स्पष्ट किया गया है।
