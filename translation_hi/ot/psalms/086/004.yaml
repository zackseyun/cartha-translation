  yaml_path: translation/ot/psalms/086/004.yaml
  text: Gladden the soul of your servant[a], for to you, Lord, I lift up my soul.
translation:
  language: hi
  text: अपने सेवक के प्राण को आनंदित कर[a], क्योंकि हे प्रभु, मैं अपना प्राण तेरी ओर उठाता हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने सेवक के जीवन को आनंदित कर”; इब्रानी शब्द का अर्थ संदर्भ के अनुसार ‘प्राण’, ‘जीवन’ या ‘स्वयं’ हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׂמֵּחַ
  choice: आनन्दित कर
  rationale: 'पिएल आज्ञार्थक का कारणवाचक बल सुरक्षित रहता है: भजनकार परमेश्वर से आनन्द देने की सीधी विनती करता है।'
- source_word: נֶפֶשׁ / נַפְשִׁי
  choice: प्राण / अपना प्राण
  rationale: यहाँ शब्द व्यक्ति के भीतर के अस्तित्व या स्वयं को दर्शाता है। दोनों occurrences में एक ही शब्द रखकर इब्रानी की काव्यात्मक पुनरावृत्ति सुरक्षित की गई है; सम्भव अर्थों के लिए पादटिप्पणी दी गई है।
- source_word: עַבְדֶּךָ
  choice: अपने सेवक
  rationale: परमेश्वर को सम्बोधित इस प्रार्थना में यह विनम्र समर्पण और सेवा का पद है; ‘दास’ सम्भव है, पर यहाँ सामाजिक बन्धन प्रमुख नहीं है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह विनती का आधार बताता है और हिन्दी में तार्किक सम्बन्ध स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֵלֶיךָ
  choice: तेरी ओर
  rationale: אֶל की दिशात्मकता और ‘उठाने’ के रूपक दोनों को स्वाभाविक हिन्दी में सुरक्षित करता है।
- source_word: אֲדֹנָי
  choice: हे प्रभु
  rationale: दैवीय उपाधि को प्रार्थनात्मक सम्बोधन के रूप में अनूदित किया गया है।
- source_word: אֶשָּׂא
  choice: उठाता हूँ
  rationale: नשׂא के भक्ति-सन्दर्भित रूपक को बिना व्याख्यात्मक विस्तार के बनाए रखता है।
theological_decisions:
- issue: प्रार्थना में נֶפֶשׁ का मानव-सम्बन्धी अर्थ
  choice: दोनों स्थानों पर ‘प्राण’
  alternative: मन; जीवन; स्वयं
  rationale: ‘प्राण’ व्यक्ति के आन्तरिक अस्तित्व और जीवन—दोनों की अर्थ-सम्भावना को पूरी तरह तकनीकी बनाए बिना सँभालता है तथा पुनरावृत्ति सुरक्षित रखता है।
- issue: परमेश्वर के सम्बन्ध में עבד का अनुवाद
  choice: सेवक
  alternative: दास
  rationale: इस भजनात्मक विनती में मुख्य बल विनम्र सेवा और समर्पण पर है, न कि सामाजिक दासता पर।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमामय प्रार्थनात्मक स्वर रखा गया है। परमेश्वर के लिए निकट, पारम्परिक एकवचन सम्बोधन ‘तेरी’ प्रयुक्त है; वाक्य इब्रानी की विनती, कारणसूचक सम्बन्ध और ‘प्राण’ की पुनरावृत्ति को सुरक्षित रखता है।
