  yaml_path: translation/ot/psalms/086/013.yaml
  text: For your steadfast love toward me is great[a], and you have delivered my soul from the lowest Sheol.
translation:
  language: hi
  text: क्योंकि मेरे प्रति आपका अटल प्रेम महान है, और आपने मेरे प्राण को शिओल की सबसे निचली गहराइयों से छुड़ाया है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मृतकों के लोक की सबसे निचली गहराइयों से” अथवा “नीचे की कब्र से।” “शिओल” मृतकों के लोक के लिए प्रयुक्त इब्रानी शब्द है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले स्तुति-वचन का आधार बताता है और हिन्दी में कारणसूचक संबंध स्वाभाविक रूप से व्यक्त करता है।
- source_word: חַסְדְּךָ
  choice: आपका अटल प्रेम
  rationale: חֶסֶד के स्थायी, निष्ठावान और संबंधपरक प्रेम को सहज आधुनिक हिन्दी में व्यक्त करता है; केवल ‘दया’ कहना इसके अर्थ को संकुचित कर सकता है।
- source_word: גָּדוֹל עָלָי
  choice: मेरे प्रति ... महान है
  rationale: גָּדוֹל का सीधा अर्थ ‘महान’ और עָלַי का संबंधपरक भाव ‘मेरे प्रति’ से सुरक्षित रहता है।
- source_word: וְהִצַּלְתָּ
  choice: और आपने ... छुड़ाया है
  rationale: נצל के हिफ़ील रूप में बचाने अथवा छुड़ाने का भाव है; पूर्ण कार्य की वर्तमान प्रासंगिकता के लिए हिन्दी पूर्णकाल उपयुक्त है।
- source_word: נַפְשִׁי
  choice: मेरे प्राण को
  rationale: נֶפֶשׁ यहाँ जीवन अथवा स्वयं व्यक्ति का द्योतक है। ‘प्राण’ काव्यात्मक गरिमा रखते हुए मृत्यु से बचाए जाने के संदर्भ में स्वाभाविक है और इसे बाद की तकनीकी आत्मा-देह धारणा तक सीमित नहीं करता।
- source_word: מִשְּׁאוֹל תַּחְתִּיָּה
  choice: अधोलोक की गहराइयों से
  rationale: ‘अधोलोक’ शिओल के मृतकों के नीचे स्थित लोक की प्राचीन छवि को बनाए रखता है, और ‘गहराइयों’ תַּחְתִּיָּה की अत्यंत नीचे अथवा निम्नतम होने की तीव्रता को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: שְׁאוֹל को बाद की धर्मवैज्ञानिक श्रेणियों में सीमित किए बिना प्रस्तुत करना
  choice: अधोलोक
  alternative: शिओल; मृतकों का लोक; कब्र
  rationale: ‘अधोलोक’ प्राचीन इस्राएली मृत्यु-लोक की स्थानिक छवि को बनाए रखता है और इसे न तो केवल भौतिक कब्र बनाता है, न किसी बाद की विशिष्ट नरक-संकल्पना के समान ठहराता है। पादटिप्पणी संभावित अर्थ-सीमा स्पष्ट करती है।
translation_notes:
  register: भाषा आधुनिक, सम्मानपूर्ण और काव्यात्मक रखी गई है। परमेश्वर के लिए आदरसूचक ‘आप’ प्रयुक्त है। ‘अटल प्रेम,’ ‘प्राण’ और ‘अधोलोक’ साधारण पाठक के लिए समझने योग्य रहते हुए मूल की काव्यात्मक तथा प्राचीन सांस्कृतिक छवि को सुरक्षित रखते हैं।
