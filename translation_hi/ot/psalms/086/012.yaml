source:
  edition: WLC
  text: אוֹדְ/ךָ֤ אֲדֹנָ֣/י אֱ֭לֹהַ/י בְּ/כָל לְבָבִ֑/י וַ/אֲכַבְּדָ֖ה שִׁמְ/ךָ֣ לְ/עוֹלָֽם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/086/012.yaml
  text: I will praise you[a], Lord my God, with all my heart, and I will glorify your name forever.
translation:
  language: hi
  text: हे प्रभु, मेरे परमेश्वर, मैं पूरे मन से आपकी स्तुति करूँगा[a], और सदा आपके नाम की महिमा करूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “आपको धन्यवाद दूँगा”; इब्रानी क्रिया आराधना के संदर्भ में धन्यवाद देने या स्तुति करने, दोनों अर्थ दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹדְךָ
  choice: मैं आपकी स्तुति करूँगा
  rationale: हिफ़िल रूप में ידה धन्यवाद देने या स्तुति करने, दोनों अर्थों में आ सकता है। आराधना के इस संदर्भ में और आगे 'आपके नाम की महिमा' के समानांतर 'स्तुति' स्वाभाविक है। अपूर्ण क्रिया को संकल्पसूचक भविष्य के रूप में रखा गया है।
- source_word: אֲדֹנָי
  choice: प्रभु
  rationale: ईश्वरीय उपाधि का मानक, श्रद्धापूर्ण और सहज हिन्दी रूप।
- source_word: אֱלֹהַי
  choice: मेरे परमेश्वर
  rationale: प्रथम पुरुष एकवचन प्रत्यय को स्पष्ट रखते हुए व्यक्तिगत संबंध व्यक्त किया गया है।
- source_word: בְּכָל לְבָבִי
  choice: पूरे मन से
  rationale: यह इब्रानी मुहावरा संपूर्ण आंतरिक समर्पण और अखंड निष्ठा दर्शाता है; 'पूरे मन से' आधुनिक हिन्दी में स्वाभाविक है।
- source_word: וַאֲכַבְּדָה
  choice: और ... महिमा करूँगा
  rationale: כבד के पिएल रूप का अर्थ आदर देना या महिमा करना है। 'नाम' के साथ आराधनात्मक संदर्भ में 'महिमा करना' उपयुक्त है और संकल्पसूचक भाव बनाए रखता है।
- source_word: שִׁמְךָ
  choice: आपके नाम
  rationale: मूल का 'नाम' यथावत रखा गया है; यह परमेश्वर के प्रकट चरित्र और प्रतिष्ठा की ओर भी संकेत कर सकता है।
- source_word: לְעוֹלָם
  choice: सदा
  rationale: यह निरंतर और अनंत अवधि व्यक्त करता है; 'सदा' स्पष्ट, संक्षिप्त और काव्यात्मक हिन्दी है।
theological_decisions:
- issue: אֲדֹנָי אֱלֹהַי का संबोधन
  choice: हे प्रभु, मेरे परमेश्वर
  alternative: प्रभु मेरे परमेश्वर
  rationale: दोनों ईश्वरीय उपाधियाँ और प्रथम पुरुष संबंध सुरक्षित हैं। 'हे' हिन्दी में प्रत्यक्ष संबोधन को स्वाभाविक और स्पष्ट बनाता है, बिना कोई नया धार्मिक अर्थ जोड़े।
- issue: ידה का आराधनात्मक अर्थ
  choice: स्तुति करूँगा
  alternative: धन्यवाद दूँगा
  rationale: मूल क्रिया दोनों अर्थ ग्रहण कर सकती है। अगले खंड में नाम की महिमा करने के समानांतर यहाँ 'स्तुति' संदर्भतः अधिक उपयुक्त है, जबकि विकल्प को पाद-टिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में श्रद्धापूर्ण, काव्यात्मक और सामान्य पाठक के लिए सहज शैली। परमेश्वर के लिए आदरसूचक 'आप' का प्रयोग किया गया है; इब्रानी की समानांतर रचना और संकल्पसूचक भविष्य भाव सुरक्षित रखे गए हैं।
