base_translation:
  language: en
  yaml_path: translation/ot/psalms/057/001.yaml
  text: Be gracious to me[a], God, be gracious to me, for in you my soul takes refuge[b]; and in the shadow of your wings I will take refuge until destruction passes by.
translation:
  language: hi
  text: हे परमेश्वर, मुझ पर अनुग्रह कर[a], मुझ पर अनुग्रह कर, क्योंकि मेरी आत्मा तुझमें शरण लेती है[b]; और मैं तेरे पंखों की छाया में तब तक शरण लूँगा, जब तक विपत्तियाँ बीत न जाएँ[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मुझ पर दया कर” अथवा “मुझ पर कृपा कर।”
    reason: lexical_alternative
  - marker: b
    text: हिब्रू में “मेरी आत्मा”; इसका अर्थ “मेरा जीवन,” “मेरा पूरा अस्तित्व,” या सामान्य रूप से “मैं” भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: 'हिब्रू में बहुवचन: “विनाशकारी विपत्तियाँ” या “संकट”; यह बहुवचन सामूहिक अर्थ में भी प्रयुक्त हो सकता है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָנֵּנִי
  choice: मुझ पर अनुग्रह कर
  rationale: חנן के आदेशात्मक रूप और प्रथम पुरुष एकवचन प्रत्यय को व्यक्त करता है; यह कृपा और अनुकूलता की विनती को गरिमापूर्ण, स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: प्रत्यक्ष संबोधन में प्रयुक्त सामान्य ईश्वरीय उपाधि; हिन्दी बाइबलीय प्रयोग में स्पष्ट और स्वाभाविक।
- source_word: בְךָ חָסָיָה נַפְשִׁי
  choice: मेरी आत्मा तुझमें शरण लेती है
  rationale: נפשׁ की काव्यात्मक अभिव्यक्ति को बनाए रखते हुए חסה के आश्रय और भरोसे के भाव को व्यक्त करता है; शब्द का व्यापक अर्थ पादटिप्पणी में स्पष्ट किया गया है।
- source_word: וּבְצֵל כְּנָפֶיךָ
  choice: और मैं तेरे पंखों की छाया में
  rationale: ईश्वरीय सुरक्षा के पक्षी-संबंधी काव्यात्मक रूपक को बिना व्याख्यात्मक सपाटीकरण के सुरक्षित रखता है।
- source_word: אֶחְסֶה
  choice: शरण लूँगा
  rationale: प्रथम पुरुष अपूर्ण रूप यहाँ आगे जारी रहने वाले अथवा नवीकृत भरोसे को व्यक्त करता है।
- source_word: עַד יַעֲבֹר הַוּוֹת
  choice: जब तक विपत्तियाँ टल न जाएँ
  rationale: עַד की कालगत सीमा, עבר के खतरे के गुजर जाने के भाव, और הוות के बहुवचन विनाशकारी संकटों को सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: נַפְשִׁי का मानवशास्त्रीय अर्थ
  choice: मेरी आत्मा
  alternative: मेरा जीवन; मैं स्वयं
  rationale: काव्यात्मक हिब्रू अभिव्यक्ति सुरक्षित रहती है, पर पादटिप्पणी यह स्पष्ट करती है कि נפשׁ केवल शरीर से अलग किसी अभौतिक तत्व तक सीमित नहीं, बल्कि जीवन या संपूर्ण व्यक्ति को भी सूचित कर सकता है।
- issue: तेरे पंखों की छाया की छवि
  choice: रूपक को ज्यों का त्यों बनाए रखना
  alternative: तेरी सुरक्षा में
  rationale: मूल की सजीव ईश्वरीय संरक्षण-छवि को व्याख्यात्मक भावार्थ में बदले बिना सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का प्रार्थनात्मक और काव्यात्मक स्तर रखा गया है। परमेश्वर के लिए निकट, पारंपरिक एकवचन संबोधन “तू/तेरा” प्रयुक्त है। “विपत्तियाँ” मूल के बहुवचन הַוּוֹת को मुख्य पाठ में सुरक्षित रखता है।
