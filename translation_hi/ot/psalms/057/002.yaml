  text: אֶ֭קְרָא לֵֽ/אלֹהִ֣ים עֶלְי֑וֹן לָ֝/אֵ֗ל גֹּמֵ֥ר עָלָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/057/002.yaml
  text: I call to God Most High[a], to God who fulfills his purpose for me.
translation:
  language: hi
  text: 'मैं परमप्रधान परमेश्वर को पुकारता हूँ,

    उस ईश्वर को जो मेरे संबंध में अपना काम पूरा करता है।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो मुझसे संबंधित बात को पूरा करता है।”
    reason: गֹמֵר עָלָי का अधिक शाब्दिक विकल्प; मूल पाठ उस कार्य की वस्तु को स्पष्ट नहीं करता।
lexical_decisions:
- source_word: אֶקְרָא
  choice: मैं ... पुकारता हूँ
  rationale: क़ाल अपूर्ण रूप काव्य में वर्तमान, भविष्य या संकल्प का भाव दे सकता है। यहाँ वर्तमानकालीन ‘पुकारता हूँ’ प्रसंग में स्वाभाविक है और क्रिया में अनावश्यक भावात्मक तीव्रता नहीं जोड़ता।
- source_word: לֵאלֹהִים עֶלְיוֹן
  choice: परमप्रधान परमेश्वर को
  rationale: עֶלְיוֹן परमेश्वर की उपाधि है, जिसका प्रचलित और गरिमापूर्ण हिन्दी रूप ‘परमप्रधान’ है। ‘परमप्रधान परमेश्वर’ मूल के पदबंध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לָאֵל
  choice: उस ईश्वर को
  rationale: אֵל यहाँ इस्राएल के परमेश्वर के लिए प्रयुक्त है और पहली पंक्ति के אֱלֹהִים के समानान्तर है। ‘उस ईश्वर को’ हिन्दी में समान सन्दर्भ को स्पष्ट रखता है और इसे अनावश्यक रूप से व्यक्तिवाचक नाम नहीं बनाता।
- source_word: גֹמֵר
  choice: अपना उद्देश्य पूरा करता है
  rationale: गमर का मूल अर्थ ‘पूरा करना, समाप्ति तक पहुँचाना’ है। עָלָי के साथ यह वक्ता से सम्बन्धित बात को परमेश्वर द्वारा पूरा किए जाने का भाव देता है। ‘अपना उद्देश्य पूरा करता है’ इस इब्रानी मुहावरे का सुबोध अर्थ देता है; शाब्दिक सम्भावना पाद-टिप्पणी में रखी गई है।
- source_word: עָלָי
  choice: मेरे लिए
  rationale: यहाँ עַל प्रथम पुरुष प्रत्यय के साथ लाभार्थक अथवा ‘मेरे विषय में’ का भाव रखता है। मुख्य पाठ में ‘मेरे लिए’ सहज हिन्दी है, जबकि ‘मुझसे सम्बन्धित’ विकल्प पाद-टिप्पणी में सुरक्षित है।
theological_decisions:
- issue: גֹמֵר עָלָי का आशय
  choice: परमेश्वर मेरे लिए अपना उद्देश्य पूरा करता है
  alternative: परमेश्वर मुझसे सम्बन्धित बात को पूरा करता है
  rationale: मूल कथन परमेश्वर के उस कार्य को दर्शाता है जिसे वह भजनकार के सम्बन्ध में पूर्ण करता है, पर यह स्पष्ट नहीं करता कि वह कौन-सा कार्य है। मुख्य पाठ अर्थ को सहज बनाता है; पाद-टिप्पणी मूल की व्यापकता और अस्पष्टता सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और काव्यात्मक समानान्तरता बनाए रखी गई है। ‘परमप्रधान’ परिचित ईश्वरीय उपाधि है। पंक्ति-विभाजन इब्रानी समानान्तर रचना को दिखाता है।
