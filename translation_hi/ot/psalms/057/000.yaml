base_translation:
  language: en
  yaml_path: translation/ot/psalms/057/000.yaml
  text: 'For the choirmaster: “Do Not Destroy.” Of David[a]. A miktam, when he fled from Saul[b], in the cave.'
translation:
  language: hi
  text: संगीत-निर्देशक के लिए। “नष्ट न कर”[a]। दाऊद का मिक्ताम[b], जब वह शाऊल से भागते समय गुफा में था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह संभवतः किसी धुन, शीर्षक या टेक का नाम है।
    reason: alternative_reading
  - marker: b
    text: “मिक्ताम” का अर्थ अनिश्चित है; इसलिए इसका अनुवाद करने के बजाय लिप्यंतरण किया गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: संगीत-निर्देशक के लिए
  rationale: भजन-सुपरिलेखों में यह पद संगीत का नेतृत्व करने वाले व्यक्ति को सूचित करता है; यह रूप आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: אַל־תַּשְׁחֵת
  choice: “नष्ट न कर”
  rationale: शब्दशः निषेधात्मक वाक्यांश को उद्धरण-चिह्नों में रखा गया है, क्योंकि यहाँ यह संभवतः किसी धुन, शीर्षक या टेक का नाम है।
- source_word: לְדָוִד
  choice: दाऊद का
  rationale: לְ उपसर्ग लेखकत्व, संबंध या समर्पण व्यक्त कर सकता है। “दाऊद का” इस संबंध को स्वाभाविक हिन्दी में रखता है, बिना केवल लेखकत्व का दावा किए।
- source_word: מִכְתָּם
  choice: मिक्ताम
  rationale: इस विधा-सूचक शब्द का अर्थ अनिश्चित है; इसलिए अनुमानित अर्थ देने के बजाय इसका लिप्यंतरण किया गया है।
- source_word: בְּבָרְחוֹ מִפְּנֵי שָׁאוּל
  choice: जब वह शाऊल से भागकर
  rationale: בְּ के साथ क्रिया-नाम का यहाँ कालवाचक अर्थ है; “जब वह…भागकर” प्रसंग को सहज हिन्दी में व्यक्त करता है।
- source_word: בַּמְּעָרָה
  choice: गुफा में था
  rationale: בְּ यहाँ स्थान सूचित करता है। हिन्दी वाक्य को पूर्ण और स्वाभाविक बनाने के लिए “था” जोड़ा गया है, बिना गति का अर्थ आरोपित किए।
theological_decisions:
- issue: सुपरिलेख का साहित्यिक स्वरूप
  choice: पूरी पंक्ति को भजन के सुपरिलेख के रूप में प्रस्तुत करना
  alternative: “नष्ट न कर” आदि को काव्य के मुख्य भाग की पंक्तियाँ मानना
  rationale: इस पंक्ति में संगीत-निर्देश, संभावित धुन या शीर्षक, दाऊद से संबंध, विधा और ऐतिहासिक परिस्थिति जैसे पारंपरिक सुपरिलेखीय तत्त्व हैं।
- issue: מִכְתָּם का अर्थ
  choice: अर्थ का अनुमान न लगाकर “मिक्ताम” के रूप में लिप्यंतरण
  alternative: “अभिलेख”, “स्वर्णिम भजन” या “गुप्त भजन” जैसे अर्थ देना
  rationale: शब्द का सटीक अर्थ विवादित है; लिप्यंतरण मूल की अनिश्चितता को ईमानदारी से सुरक्षित रखता है।
- issue: לְדָוִד में संबंध का प्रकार
  choice: “दाऊद का”
  alternative: “दाऊद द्वारा” या “दाऊद के लिए”
  rationale: इब्रानी संबंध लेखकत्व, संबद्धता या समर्पण में से एक हो सकता है; चुना हुआ रूप इस व्यापकता को अपेक्षाकृत सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सरल रूप अपनाया गया है। सुपरिलेख की खंडात्मक शैली को छोटे वाक्यों द्वारा बनाए रखा गया है। “शाऊल” और “दाऊद” प्रचलित हिन्दी बाइबलीय नाम-रूप हैं।
