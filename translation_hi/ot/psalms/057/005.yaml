base_translation:
  language: en
  yaml_path: translation/ot/psalms/057/005.yaml
  text: Be exalted above the heavens[a], O God; let your glory be over all the earth.
translation:
  language: hi
  text: हे परमेश्वर, आकाशों के ऊपर ऊँचे हो; सारी पृथ्वी पर तेरी महिमा हो।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सारी पृथ्वी पर तेरी महिमा है।” इब्रानी में दूसरी पंक्ति क्रियारहित है; इसे प्रार्थना या कामना के रूप में, अथवा घोषणा के रूप में पढ़ा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ר֣וּמָה
  choice: ऊँचे विराजमान हो
  rationale: רום का यह आज्ञार्थक/कामनार्थक रूप परमेश्वर की महिमा और सर्वोच्चता प्रकट करने वाली प्रार्थना है। ‘ऊँचे विराजमान हो’ स्वाभाविक और गरिमापूर्ण हिन्दी में केवल भौतिक आरोहण का भाव दिए बिना इसे व्यक्त करता है।
- source_word: עַל הַשָּׁמַיִם
  choice: आकाशों से भी ऊँचे
  rationale: यहाँ עַל ऊँचाई और सर्वोच्चता का बोध कराता है। बहुवचन הַשָּׁמַיִם को ‘आकाशों’ कहना इब्रानी काव्यात्मक मुहावरे को बनाए रखता है; ‘से भी ऊँचे’ हिन्दी में तुलना और सर्वोच्चता स्पष्ट करता है।
- source_word: אֱלֹהִים
  choice: हे परमेश्वर
  rationale: यह प्रत्यक्ष संबोधन है। आधुनिक हिन्दी बाइबलीय प्रयोग में ‘हे परमेश्वर’ सहज, स्पष्ट और गरिमापूर्ण है।
- source_word: עַל כָּל הָאָרֶץ
  choice: सारी पृथ्वी पर
  rationale: इस पदबंध में सार्वभौमिक विस्तार का भाव है; ‘सारी पृथ्वी पर’ प्राकृतिक हिन्दी में वही व्यापकता व्यक्त करता है।
- source_word: כְּבוֹדֶךָ
  choice: तेरी महिमा
  rationale: परमेश्वर के लिए כבוד उसकी प्रकट गरिमा, वैभव और महत्त्व को दर्शाता है। ‘महिमा’ इसका स्थापित और अर्थपूर्ण हिन्दी समतुल्य है।
theological_decisions:
- issue: दूसरे चरण को निहित कामना मानें या कथन
  choice: सारी पृथ्वी पर तेरी महिमा हो
  alternative: सारी पृथ्वी पर तेरी महिमा है
  rationale: इब्रानी दूसरा चरण क्रियारहित है। पहले चरण के आज्ञार्थक/कामनार्थक समानांतर में इसे प्रार्थना के रूप में पढ़ना स्वाभाविक है, पर कथनात्मक अर्थ भी व्याकरणतः संभव है; इसलिए वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में काव्यात्मक और उपासना-संगत गरिमा रखी गई है। ‘आकाशों’ मूल के बहुवचन को सुरक्षित रखता है और ‘ऊँचे विराजमान हो’ शाब्दिक ऊर्ध्वगमन के बजाय परमेश्वर की सर्वोच्चता व्यक्त करता है।
