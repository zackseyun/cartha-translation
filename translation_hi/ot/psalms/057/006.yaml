  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: רֶ֤שֶׁת הֵכִ֣ינוּ לִ/פְעָמַ/י֮ כָּפַ֪ף נַ֫פְשִׁ֥/י כָּר֣וּ לְ/פָנַ֣/י שִׁיחָ֑ה נָפְל֖וּ בְ/תוֹכָ֣/הּ סֶֽלָה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/057/006.yaml
  text: They prepared a net for my steps[a]; my soul was bowed down; they dug a pit before me; they fell into the midst of it[d][c][b]. Selah
translation:
  language: hi
  text: उन्होंने मेरे पाँवों के लिए जाल बिछाया; मेरा प्राण दब गया; उन्होंने मेरे सामने गड्ढा खोदा; वे उसके भीतर गिर पड़े। सेला।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רֶשֶׁת
  choice: जाल
  rationale: यह संज्ञा पकड़ने के लिए लगाए जाने वाले जाल को दर्शाती है; ‘जाल’ ठोस और स्वाभाविक हिन्दी समतुल्य है।
- source_word: הֵכִינוּ
  choice: बिछाया
  rationale: मूल अर्थ ‘तैयार किया’ है, पर जाल के प्रसंग में हिन्दी का स्वाभाविक प्रयोग ‘जाल बिछाना’ है और सुनियोजित कार्रवाई को बनाए रखता है।
- source_word: לִפְעָמַי
  choice: मेरे कदमों के लिए
  rationale: פעם यहाँ पाँव या कदम का बोध देता है; यह अनुवाद बहुवचन और फँसाने की गतिशील छवि दोनों सुरक्षित रखता है।
- source_word: כָּפַף
  choice: झुक गया
  rationale: क्रिया का अर्थ झुकना या नीचे दबना है; पुल्लिंग ‘प्राण’ के साथ यह मूल के 3ms रूप से भी मेल खाता है।
- source_word: נַפְשִׁי
  choice: मेरा प्राण
  rationale: נפשׁ व्यक्ति, जीवन या आंतरिक प्राण को सूचित कर सकता है; ‘मेरा प्राण’ काव्यात्मक अभिव्यक्ति और उसकी अर्थगत व्यापकता को ‘मैं’ की अपेक्षा बेहतर बनाए रखता है।
- source_word: כָּרוּ
  choice: खोदा
  rationale: गड्ढा बनाने के लिए प्रयुक्त सीधी और स्वाभाविक क्रिया।
- source_word: לְפָנַי
  choice: मेरे सामने
  rationale: स्थानगत अर्थ को आधुनिक हिन्दी में सहज रूप से व्यक्त करता है।
- source_word: שִׁיחָה
  choice: गड्ढा
  rationale: यह फँसाने के लिए खोदे गए गड्ढे को दर्शाता है; ‘गड्ढा’ सामान्य पाठक के लिए स्पष्ट है।
- source_word: נָפְלוּ
  choice: गिर पड़े
  rationale: पूर्ण क्रिया शत्रुओं की योजना के उलट जाने को बताती है; ‘गिर पड़े’ घटना की परिणति को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בְתוֹכָהּ
  choice: उसी के बीच में
  rationale: मूलतः ‘उसके भीतर/बीच में’; ‘उसी’ जोड़ने से उसी गड्ढे में गिरने की प्रत्यावर्ती विडंबना स्पष्ट होती है, बिना नया आशय जोड़े।
- source_word: סֶלָה
  choice: सेला
  rationale: इस उपासना या संगीत-संबंधी संकेत का सटीक अर्थ अनिश्चित है, इसलिए इसका लिप्यंतरण किया गया है।
theological_decisions:
- issue: נַפְשִׁי की अर्थगत व्यापकता
  choice: मेरा प्राण
  alternative: मैं / मेरा जीवन
  rationale: ‘मेरा प्राण’ मूल की काव्यात्मक मानव-वर्णन शैली को रखता है और इसे केवल भावनात्मक दशा, भौतिक जीवन या साधारण सर्वनाम तक सीमित नहीं करता।
- issue: शत्रुओं के अपने गड्ढे में गिरने की प्रत्यावर्ती विडंबना
  choice: वे स्वयं उसी के बीच में गिर पड़े
  alternative: वे उसके बीच में गिर पड़े
  rationale: ‘स्वयं’ और ‘उसी’ उस स्पष्ट संदर्भ को स्वाभाविक हिन्दी में उभारते हैं कि गड्ढा खोदने वाले उसी गड्ढे में गिरे; यह किसी विशिष्ट धर्मसैद्धांतिक निष्कर्ष को नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और काव्यात्मक रूप। जाल बिछाने और गड्ढा खोदने की समानांतर छवियाँ अर्धविरामों से रखी गई हैं। ‘सेला’ को अर्थ की अनिश्चितता के कारण अनूदित नहीं किया गया।
