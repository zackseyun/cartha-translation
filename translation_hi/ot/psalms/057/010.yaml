base_translation:
  language: en
  yaml_path: translation/ot/psalms/057/010.yaml
  text: For your steadfast love is great to the heavens[b][a], and your faithfulness to the clouds.
translation:
  language: hi
  text: क्योंकि तेरा अटल प्रेम आकाश तक फैला है,[a] और तेरी विश्वासयोग्यता बादलों तक।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्योंकि तेरा अटल प्रेम आकाश तक फैला है, और तेरा सत्य बादलों तक।”
    reason: अֱמֶת का अर्थ ‘सत्य’ भी हो सकता है; यहाँ मुख्य पाठ में समानांतर חֶסֶד के संदर्भ में ‘विश्वासयोग्यता’ चुना गया है।
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले स्तुति-वचन का कारण बताता है और इब्रानी के कारणसूचक अर्थ को स्वाभाविक हिन्दी में रखता है।
- source_word: גָדֹל
  choice: महान है
  rationale: यह परमेश्वर के प्रेम की विशालता बताने वाला विधेय विशेषण है; ‘महान है’ काव्यात्मक और सहज है।
- source_word: עַד
  choice: तक
  rationale: यह विस्तार की सीमा दर्शाता है और आकाश तथा बादलों तक पहुँचने की ऊर्ध्व छवि बनाए रखता है।
- source_word: שָׁמַיִם
  choice: आकाश
  rationale: इब्रानी काव्य में यह ऊपर के आकाशमंडल को दर्शाता है; आधुनिक हिन्दी में ‘आकाश’ स्वाभाविक और गरिमापूर्ण है।
- source_word: חַסְדֶּךָ
  choice: तेरा अटल प्रेम
  rationale: חֶסֶד में प्रेम, करुणा और स्थायी निष्ठा का भाव है; ‘अटल प्रेम’ इसे संक्षेप और सहज रूप में व्यक्त करता है।
- source_word: שְׁחָקִים
  choice: बादलों
  rationale: यह काव्यात्मक शब्द ऊँचे बादलों या नभ को सूचित कर सकता है; ‘बादल’ समानांतर चित्र को ठोस बनाता है।
- source_word: אֲמִתֶּךָ
  choice: तेरी विश्वासयोग्यता
  rationale: חֶסֶד के समानांतर यहाँ אֱמֶת परमेश्वर की सत्यनिष्ठ विश्वसनीयता को व्यक्त करता है; ‘विश्वासयोग्यता’ संबंधपरक अर्थ को स्पष्ट रखती है।
theological_decisions:
- issue: परमेश्वर के वाचागत गुणों का काव्यात्मक समानांतर अनुवाद
  choice: חֶסֶד को ‘अटल प्रेम’ और אֱמֶת को ‘विश्वासयोग्यता’
  alternative: ‘करुणा’ और ‘सत्य’
  rationale: यह युग्म केवल अमूर्त सत्य नहीं, बल्कि परमेश्वर के स्थायी प्रेम और भरोसेमंद चरित्र की प्रशंसा करता है। फिर भी ‘सत्य’ का वास्तविक शाब्दिक विकल्प पादटिप्पणी में सुरक्षित है।
- issue: עַד के साथ גָדֹל की रचना
  choice: ‘आकाश तक महान है’
  alternative: ‘आकाश जितना विशाल है’
  rationale: ‘तक’ मूल के सीमा-विस्तार को अधिक औपचारिक रूप से सुरक्षित रखता है; विकल्प अधिक मुहावरेदार है, पर माप की छवि को तुलना में बदल देता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; एकवचन निकट संबोधन ‘तेरा/तेरी’ भजन की प्रत्यक्ष प्रार्थना और काव्यात्मक आत्मीयता को बनाए रखता है। भाषा गरिमापूर्ण है, पर अनावश्यक संस्कृतनिष्ठता से बचती है।
