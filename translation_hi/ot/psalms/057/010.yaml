review_pass:
  verdict: revise
  source_fidelity: The draft correctly renders the causal כִּי, the poetic extent marked by עַד, חֶסֶד as enduring/steadfast love, and אֱמֶת as faithfulness. However, ‘आकाश तक महान है’ is a close formal imitation but is not idiomatic Hindi for the Hebrew image of immense, heaven-reaching love. ‘आकाश तक फैला है’ naturally conveys the intended extent, though it expresses the magnitude through the image rather than a separate adjective.
  naturalness: ‘तेरा अटल प्रेम आकाश तक फैला है’ is natural modern Hindi poetic usage. The elided verb in the parallel second clause is conventional and keeps the compact Hebrew poetic parallelism.
  terminology: ‘अटल प्रेम’ and ‘विश्वासयोग्यता’ form an appropriate, non-sectarian rendering of חֶסֶד / אֱמֶת. ‘आकाश’ and ‘बादलों’ preserve the elevated concrete imagery. The footnote should offer ‘सत्य’ as the genuine lexical alternative without claiming that the revision is merely a stylistic alternative.
  issues:
  - severity: medium
    issue: ‘आकाश तक महान है’ is an awkward Hindi collocation.
    rationale: In contemporary standard Hindi, ‘महान’ does not naturally take ‘आकाश तक’ as a measure of extent in this construction. The resulting phrase sounds translated rather than poetic Hindi. Rendering the image as ‘आकाश तक फैला है’ preserves the verse’s meaning and vertical extent idiomatically.
  - severity: low
    issue: The current footnote conflates the lexical alternative ‘सत्य’ with a stylistic rewording using ‘विशाल’।
    rationale: A footnote should clearly identify the source-based lexical alternative for אֱמֶת. ‘विशाल’ is an interpretive Hindi reformulation of the preceding phrase, not an alternative meaning of אֱמֶת.
  revised_text: क्योंकि तेरा अटल प्रेम आकाश तक फैला है,[a] और तेरी विश्वासयोग्यता बादलों तक।
