  text: ר֣וּמָ/ה עַל שָׁמַ֣יִם אֱלֹהִ֑ים עַ֖ל כָּל הָ/אָ֣רֶץ כְּבוֹדֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/057/011.yaml
  text: Be exalted above the heavens[a], O God; let your glory be above all the earth.
translation:
  language: hi
  text: 'हे परमेश्वर, तू आकाशों से भी ऊँचा हो;

    तेरी महिमा सारी पृथ्वी के ऊपर हो।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तेरी महिमा सारी पृथ्वी के ऊपर है।” इब्रानी की दूसरी पंक्ति में क्रिया स्पष्ट रूप से नहीं दी गई है।
    reason: alternative_reading
lexical_decisions:
- source_word: ר֣וּמָה
  choice: तू ... ऊँचा हो
  rationale: रום के संबोधनात्मक आदेश/कामनासूचक रूप को प्रार्थनापूर्ण हिन्दी में व्यक्त करता है। यह केवल स्थानिक रूप से उठाए जाने के बजाय परमेश्वर की सर्वोच्चता प्रकट होने का भाव रखता है।
- source_word: עַל שָׁמַ֣יִם
  choice: आकाशों से भी ऊँचा
  rationale: עַל की ऊँचाई और सर्वोच्चता की छवि को स्वाभाविक हिन्दी में रखता है; 'भी' तुलनात्मक बल स्पष्ट करता है, जबकि שָׁמַיִם का बहुवचन 'आकाशों' में सुरक्षित है।
- source_word: אֱלֹהִים
  choice: हे परमेश्वर
  rationale: प्रत्यक्ष संबोधन को 'हे' से स्पष्ट किया गया है। इस प्रार्थनात्मक काव्य में 'परमेश्वर' आधुनिक मानक हिन्दी का गरिमापूर्ण और सहज पद है।
- source_word: עַ֖ל כָּל הָאָ֣רֶץ
  choice: सारी पृथ्वी के ऊपर
  rationale: आकाशों के साथ विश्वव्यापी समानांतरता के कारण הָאָרֶץ का अर्थ 'पृथ्वी' है, न कि किसी सीमित देश का भूभाग। 'ऊपर' עַל की ऊर्ध्व छवि बनाए रखता है।
- source_word: כְּבוֹדֶֽךָ
  choice: तेरी महिमा
  rationale: परमेश्वर के כבוד के लिए 'महिमा' उसकी प्रकट गरिमा, वैभव और सम्मान को समेटने वाला स्थापित तथा स्पष्ट हिन्दी पद है।
theological_decisions:
- issue: दूसरी काव्य-पंक्ति में स्पष्ट क्रिया का अभाव
  choice: तेरी महिमा सारी पृथ्वी के ऊपर हो
  alternative: तेरी महिमा सारी पृथ्वी के ऊपर है
  rationale: पहली पंक्ति की प्रार्थनापूर्ण कामनासूचक शक्ति को दूसरी पंक्ति में जारी रखने के लिए 'हो' की पूर्ति की गई है। फिर भी इब्रानी में क्रिया न होने के कारण घोषणात्मक अर्थ संभव है; इसे पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, प्रार्थनात्मक काव्य-शैली। 'तू/तेरी' का प्रयोग परमेश्वर से निकट और प्रत्यक्ष एकवचन संबोधन को बनाए रखता है; भाषा अनावश्यक रूप से पुरातन नहीं है।
