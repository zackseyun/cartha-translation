  text: נַפְשִׁ֤/י בְּ/ת֥וֹךְ לְבָאִם֮ אֶשְׁכְּבָ֪ה לֹ֫הֲטִ֥ים בְּֽנֵי אָדָ֗ם שִׁ֭נֵּי/הֶם חֲנִ֣ית וְ/חִצִּ֑ים וּ֝/לְשׁוֹנָ֗/ם חֶ֣רֶב חַדָּֽה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/057/004.yaml
  text: My soul is in the midst of lions[a]; I lie down among those who are aflame—sons of man, whose teeth are spears and arrows[b], and whose tongue is a sharp sword.
translation:
  language: hi
  text: 'मेरा प्राण सिंहों के बीच है;

    मैं धधकते हुए मनुष्यों[a][b] के बीच लेटा हूँ—

    जिनके दाँत भाले और तीर हैं,

    और जिनकी जीभ तेज़ तलवार है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक, “मनुष्य के पुत्र”; या “आदमी।”
    reason: lexical_alternative
  - marker: b
    text: “धधकते हुए” का अनुवाद “जलते हुए” या “ज्वलंत” भी हो सकता है; यह शत्रुओं की प्रचंड उग्रता का चित्रण कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: נַפְשִׁי
  choice: मेरा प्राण
  rationale: נֶפֶשׁ यहाँ संकट में पड़े व्यक्ति के प्राण/स्व को दर्शाता है। ‘मेरा प्राण’ हिब्रू की काव्यात्मक छवि को बनाए रखता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: בְּתוֹךְ לְבָאִם
  choice: सिंहों के बीच
  rationale: घिर जाने और संकट में होने का बोध देते हुए सिंहों की मूल छवि सुरक्षित रखी गई है।
- source_word: אֶשְׁכְּבָה
  choice: मैं ... लेटा हूँ
  rationale: שׁכב की ठोस शारीरिक मुद्रा को व्यक्त करता है; प्रसंग में वर्तमान अवस्था हिन्दी में सहज है।
- source_word: לֹהֲטִים
  choice: धधकते हुओं
  rationale: यह कृदंत जलने या धधकने की छवि देता है। शत्रुओं की उग्रता को स्पष्ट व्याख्या में बदलने के बजाय मूल रूपक बनाए रखा गया है।
- source_word: בְּנֵי אָדָם
  choice: मनुष्यों के पुत्रों
  rationale: हिब्रू की पुल्लिंग और काव्यात्मक अभिव्यक्ति को निकटता से रखता है; अधिक मुहावरेदार विकल्प पादटिप्पणी में दिया गया है।
- source_word: שִׁנֵּיהֶם חֲנִית וְחִצִּים
  choice: जिनके दाँत भाले और तीर हैं
  rationale: हिंसक दाँतों की अस्त्रों से तुलना ज्यों की त्यों रखी गई है। एकवचन חֲנִית को समानांतर बहुवचन חִצִּים के साथ सामूहिक अर्थ में ‘भाले’ कहा गया है।
- source_word: וּלְשׁוֹנָם חֶרֶב חַדָּה
  choice: और जिनकी जीभ तेज़ तलवार है
  rationale: विनाशकारी वाणी की सीधी और प्रभावशाली रूपकात्मक छवि सुरक्षित है।
theological_decisions:
- issue: सिंहों और अस्त्रों की छवियों को शाब्दिक या रूपकात्मक मानना
  choice: मानवीय शत्रुओं के काव्यात्मक वर्णन के रूप में छवियों को बिना सुलझाए सुरक्षित रखना
  alternative: पहले पदबंध को वास्तविक सिंह और अगले को मनुष्य मानना, अथवा पूरे वर्णन को केवल हिंसक मनुष्यों का रूपक बनाना
  rationale: पद ‘सिंहों’ से ‘मनुष्यों के पुत्रों’ की ओर बढ़ता है। अनुवाद इस काव्यात्मक परत और संभावित अस्पष्टता को व्याख्यात्मक गद्य में नहीं बदलता।
- issue: בְּנֵי אָדָם का लिंग और मुहावरा
  choice: मुख्य पाठ में ‘मनुष्यों के पुत्रों’
  alternative: ‘मनुष्यों’ या ‘आदमियों’
  rationale: यह हिब्रू की स्पष्ट पुल्लिंग, वंशसूचक काव्यात्मक संरचना को बनाए रखता है; सामान्य मानवीय अर्थ पादटिप्पणी में स्पष्ट किया गया है।
- issue: לֹהֲטִים का अर्थ और वाक्यगत संबंध
  choice: ‘धधकते हुओं’ को मानवीय विरोधियों का काव्यात्मक विशेषण मानना
  alternative: ‘भस्म करनेवालों’, ‘क्रोध से जलनेवालों’ या ‘ज्वालाओं’
  rationale: मूल कृदंत की अग्नि-संबंधी छवि रखी गई है, पर उसे क्रोध या भक्षण जैसे अधिक विशिष्ट अर्थ तक सीमित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण काव्यात्मक शैली अपनाई गई है। ‘मेरा प्राण’, ‘सिंहों के बीच’ और अस्त्रों की उपमाएँ मूल की सघनता बनाए रखती हैं। पंक्ति-विभाजन हिब्रू समानांतरता को सुगम बनाता है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
