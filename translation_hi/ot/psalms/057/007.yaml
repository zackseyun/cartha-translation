lexical_decisions:
- source_word: נָכוֹן
  choice: स्थिर
  rationale: यह शब्द दृढ़ता, स्थायित्व और स्थापित होने का भाव व्यक्त करता है। इस भजन में भरोसे और स्तुति के दृढ़ निश्चय के संदर्भ में ‘स्थिर’ स्वाभाविक और अर्थपूर्ण है।
- source_word: לִבִּי
  choice: मेरा हृदय
  rationale: ‘हृदय’ व्यक्ति के भीतरी स्व, इच्छा और भावनाओं को समेटता है तथा इब्रानी बिंब को बनाए रखता है।
- source_word: אֱלֹהִים
  choice: हे परमेश्वर
  rationale: यहाँ सीधा संबोधन है; आधुनिक मानक हिन्दी में ‘हे परमेश्वर’ प्रार्थनापूर्ण संबोधन को स्पष्ट करता है।
- source_word: אָשִׁירָה
  choice: मैं गाऊँगा
  rationale: कोहोर्टेटिव रूप गाने के दृढ़ संकल्प को व्यक्त करता है; ‘मैं गाऊँगा’ हिन्दी में स्वाभाविक रूप से यह भाव देता है।
- source_word: וַאֲזַמֵּרָה
  choice: और भजन गाऊँगा
  rationale: पिएल रूप זמר संगीत करने अथवा स्तुति गाने का भाव रखता है। ‘भजन गाऊँगा’ स्तुतिपरक और संगीतमय दोनों पहलुओं को सहज हिन्दी में व्यक्त करता है।
