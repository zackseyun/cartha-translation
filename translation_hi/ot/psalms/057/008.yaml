  text: ע֤וּרָ/ה כְבוֹדִ֗/י ע֭וּרָֽ/ה הַ/נֵּ֥בֶל וְ/כִנּ֗וֹר אָעִ֥ירָה שָּֽׁחַר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/057/008.yaml
  text: Awake[a], my glory! Awake[b], harp and lyre! I will awaken the dawn.
translation:
  language: hi
  text: जाग, हे मेरे गौरव![a] जागो, हे वीणा और किन्नोर![b] मैं भोर को जगाऊँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘हे मेरे प्राण!’ अथवा ‘हे मेरे पूरे अस्तित्व!’; ‘मेरे गौरव’ यहाँ कवि का अपने ही व्यक्तित्व के लिए काव्यात्मक संबोधन हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: हिब्रू में दो प्राचीन तार-वाद्यों के नाम हैं; उनके ठीक आधुनिक समतुल्य निश्चित नहीं हैं।
    reason: cultural_note
lexical_decisions:
- source_word: עוּרָה
  choice: जाग / जागो
  rationale: यह עור का सीधा आज्ञार्थक आह्वान है। ‘जाग’ काव्यात्मक संबोधन ‘मेरे गौरव’ के साथ और ‘जागो’ दो वाद्यों के संयुक्त संबोधन के साथ स्वाभाविक आधुनिक हिन्दी है।
- source_word: כְבוֹדִי
  choice: मेरे गौरव
  rationale: शाब्दिक अर्थ ‘मेरा गौरव’ है। काव्य में यह स्वयं, प्राण या सम्पूर्ण अस्तित्व का संकेत हो सकता है; मुख्य पाठ में रूपक को बनाए रखा गया है और विकल्प पादटिप्पणी में दिए गए हैं।
- source_word: הַנֵּבֶל
  choice: वीणा
  rationale: यह प्राचीन तार-वाद्य था, जिसकी ठीक आधुनिक पहचान निश्चित नहीं है। ‘वीणा’ हिन्दी पाठक के लिए परिचित व्यापक समतुल्य है।
- source_word: כִנּוֹר
  choice: किन्नोर
  rationale: दूसरे प्राचीन तार-वाद्य का हिब्रू नाम लिप्यंतरित किया गया है, ताकि दोनों अलग वाद्यों का भेद बना रहे और किसी अनिश्चित आधुनिक वाद्य से उसकी गलत समानता न ठहराई जाए।
- source_word: אָעִירָה
  choice: मैं ... जगाऊँगा
  rationale: 'हिफ़ील रूप का कारणवाचक अर्थ सुरक्षित रखा गया है: भजनकार रूपक के द्वारा भोर को जगाने की बात करता है।'
- source_word: שָּׁחַר
  choice: भोर
  rationale: यह उषाकाल या पौ फटने को दर्शाता है। ‘भोर’ संक्षिप्त, स्वाभाविक और काव्यात्मक है तथा जगाने के मानवीकरण के साथ सहज बैठता है।
