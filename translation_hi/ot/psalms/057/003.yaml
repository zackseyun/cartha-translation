base_translation:
  language: en
  yaml_path: translation/ot/psalms/057/003.yaml
  text: He will send from heaven and save me[a]; he reproaches the one who pants after me. Selah[b]. God will send his steadfast love and his faithfulness.
translation:
  language: hi
  text: 'वह स्वर्ग से भेजेगा और मुझे बचाएगा;

    जो मेरे पीछे हाँफता है, वह ताना मारता है।[a]

    सेला।[b]

    परमेश्वर अपना अटल प्रेम और अपनी विश्वासयोग्यता भेजेगा।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी पंक्ति के वाक्य-संबंध अनिश्चित हैं। इसका अनुवाद यह भी हो सकता है: “वह मेरे पीछे हाँफने वाले को लज्जित करेगा,” अथवा “वह मुझे मेरे पीछे हाँफने वाले के ताने से बचाएगा।” “मेरे पीछे हाँफने वाला” का अर्थ अधिक व्याख्यात्मक रूप में “मेरा पीछा करने वाला” या “मुझे निगल जाने को आतुर व्यक्ति” भी हो सकता है।'
    reason: alternative_reading
  - marker: b
    text: “सेला” का ठीक अर्थ अज्ञात है; सम्भवतः यह कोई संगीतात्मक या उपासना-संबंधी संकेत है।
    reason: term_uncertainty
lexical_decisions:
- source_word: יִשְׁלַח מִשָּׁמַיִם
  choice: वह स्वर्ग से भेजकर
  rationale: अपूर्ण क्रिया को भजनकार के भरोसे की भविष्याभिमुख घोषणा के रूप में लिया गया है। भेजी जाने वाली वस्तु पहली पंक्ति में व्यक्त नहीं है; अंतिम पंक्ति उसे परमेश्वर के अटल प्रेम और सच्चाई से जोड़ती है।
- source_word: וְיוֹשִׁיעֵנִי
  choice: मुझे बचाएगा
  rationale: हिफ़ील रूप संकट से छुड़ाने अथवा बचाने का व्यापक अर्थ देता है; सरल आधुनिक हिन्दी में ‘बचाएगा’ स्वाभाविक है।
- source_word: חֵרֵף
  choice: ताना मारता है
  rationale: मसोरेटिक स्वरांकन के अनुसार इसे भूतकाल नहीं, तीसरे पुरुष एकवचन की क्रिया के रूप में समझना सहज है। निकटवर्ती שֹׁאֲפִי को कर्ता मानकर इसका प्रत्यक्ष शाब्दिक अर्थ रखा गया है; वैकल्पिक वाक्य-संबंध पादटिप्पणी में है।
- source_word: שֹׁאֲפִי
  choice: जो मुझे निगलने को हाँफता है
  rationale: שאף की हाँफने की सजीव छवि और शत्रुतापूर्ण ढंग से निगल जाने की आकांक्षा दोनों को हिन्दी में व्यक्त करता है।
- source_word: סֶלָה
  choice: सेला
  rationale: इस संगीतात्मक अथवा उपासना-संबंधी पद का ठीक अर्थ अनिश्चित है, इसलिए पारंपरिक लिप्यंतरण रखा गया है।
- source_word: חַסְדּוֹ
  choice: अपना अटल प्रेम
  rationale: חסד में प्रेम, कृपा और स्थायी निष्ठा के संयुक्त भाव हैं; ‘अटल प्रेम’ आधुनिक हिन्दी में इन्हें संक्षेप में व्यक्त करता है।
- source_word: וַאֲמִתּוֹ
  choice: अपनी सच्चाई
  rationale: אמת का अर्थ सत्य, विश्वसनीयता और निष्ठा हो सकता है। ‘सच्चाई’ मूल की अर्थ-व्याप्ति बनाए रखती है; ‘विश्वासयोग्यता’ सम्भव विकल्प है।
theological_decisions:
- issue: חֵרֵף שֹׁאֲפִי का वाक्यगत संबंध
  choice: 'पीछा करने वाला कर्ता है: ‘जो मुझे निगलने को हाँफता है, वह ताना मारता है।’'
  alternative: 'परमेश्वर कर्ता है और शत्रु कर्म: ‘वह मेरे पीछे हाँफने वाले को लज्जित करेगा/धिक्कारेगा’; अथवा ‘वह मुझे मेरे पीछा करने वाले के ताने से बचाएगा।’'
  rationale: इब्रानी काव्य-पंक्ति अत्यंत संक्षिप्त है। क्रिया חֵרֵף का सीधा अर्थ ‘ताना मारना/धिक्कारना’ है और שֹׁאֲפִי को उसका निकटस्थ कर्ता माना जा सकता है। फिर भी कर्ता और वाक्य-संबंध निश्चित नहीं हैं, इसलिए अन्य प्रमुख पाठ-संभावना पादटिप्पणी में सुरक्षित है।
- issue: חסד ואמת का युग्म
  choice: ‘अटल प्रेम और सच्चाई’
  alternative: ‘करुणा और विश्वासयोग्यता’ अथवा ‘वाचा का प्रेम और निष्ठा’
  rationale: अनुवाद युग्म की धार्मिक गहराई बनाए रखता है, पर मूल में स्पष्ट रूप से न आया ‘वाचा’ शब्द जोड़कर किसी विशिष्ट व्याख्या को आरोपित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘निगलने को हाँफता है’ मूल रूपक की तीव्रता बचाता है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में दिए गए हैं।
