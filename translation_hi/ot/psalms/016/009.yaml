lexical_decisions:
- source_word: לָכֵן
  choice: इसलिए
  rationale: यह पिछले पदों में व्यक्त यहोवा की सम्मति और उपस्थिति पर भरोसे से निकला निष्कर्ष दिखाता है।
- source_word: שָׂמַח לִבִּי
  choice: मेरा हृदय आनन्दित है
  rationale: इब्रानी सिद्ध क्रिया यहाँ वर्तमान अवस्था या उसके परिणाम को व्यक्त करती है; यह हिन्दी में स्वाभाविक और काव्यात्मक है।
- source_word: וַיָּגֶל
  choice: मगन होती है
  rationale: גיל प्रबल और उल्लासपूर्ण आनन्द व्यक्त करता है। ‘मगन होती है’ समानांतर पंक्ति के भाव को रखते हुए सहज आधुनिक हिन्दी है।
- source_word: כְּבוֹדִי
  choice: मेरी महिमा
  rationale: शब्द का सीधा अर्थ ‘मेरी महिमा’ है। यद्यपि यहाँ यह व्यक्ति के सम्मान, संपूर्ण अस्तित्व या आत्म-अभिव्यक्ति के अंग का मुहावरा हो सकता है, मुख्य पाठ स्रोत की अस्पष्टता बनाए रखता है।
- source_word: אַף
  choice: यहाँ तक कि … भी
  rationale: यह भीतरी आनन्द से शारीरिक सुरक्षा तक पहुँचने वाले बलाघात और चरम विस्तार को स्पष्ट करता है।
- source_word: בְּשָׂרִי
  choice: मेरी देह
  rationale: בשר भौतिक शरीर को सूचित करता है। हिन्दी में ‘देह’ मूल बिंब को बनाए रखती है और ‘मांस’ से उत्पन्न अनचाहे अर्थ से बचती है।
- source_word: יִשְׁכֹּן לָבֶטַח
  choice: सुरक्षित बसी रहेगी
  rationale: שכן का अर्थ बसना या निवास करना और לָבֶטַח का अर्थ सुरक्षा से है। यह रूप भविष्याभिमुख भाव और मूल के निवास-बिंब दोनों को रखता है।
theological_decisions:
- issue: नए नियम में मसीह के संबंध में उद्धृत इस पद में כְּבוֹדִי का अनुवाद
  choice: मेरी महिमा
  alternative: मेरा सम्मान; मेरा संपूर्ण अस्तित्व; मेरी जीभ
  rationale: शाब्दिक रूप स्रोत के प्रति पारदर्शिता और प्रेरितों के काम 2 में यूनानी ‘मेरी महिमा’ से शाब्दिक संबंध बनाए रखता है, पर मुहावरे का अर्थ पादटिप्पणी में खुला रखा गया है।
- issue: בְּשָׂרִי का अनुवाद
  choice: मेरी देह
  alternative: मेरा शरीर; मेरा मांस
  rationale: सन्दर्भ भौतिक अस्तित्व की सुरक्षा का है। ‘देह’ मूल शारीरिक अर्थ और काव्यात्मकता रखती है, बिना यहाँ अनुपस्थित ‘पापी स्वभाव’ का अर्थ जोड़े।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण काव्यात्मक शैली रखी गई है। ‘आनन्दित’ और ‘मगन’ समानांतर भावों में हल्का वैविध्य देते हैं। ‘सुरक्षित बसी रहेगी’ मूल के निवास और सुरक्षा—दोनों अर्थों को संक्षेप में बनाए रखता है।
