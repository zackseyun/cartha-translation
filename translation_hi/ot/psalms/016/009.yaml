  text: इसलिए मेरा हृदय आनन्दित है, और मेरी महिमा[a] उल्लसित है; यहाँ तक कि मेरी देह भी निश्चिंत होकर बसी रहेगी।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मेरा सम्मान,” “मेरा संपूर्ण अस्तित्व।” यहाँ “मेरी महिमा” को कुछ लोग स्वयं व्यक्ति के लिए प्रयुक्त मुहावरा मानते हैं; कुछ प्राचीन व्याख्याकारों ने इसे जीभ से जोड़ा है।
    reason: lexical_alternative
  - marker: b
