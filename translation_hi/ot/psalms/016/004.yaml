source:
  edition: WLC
  text: יִרְבּ֥וּ עַצְּבוֹתָ/ם֮ אַחֵ֪ר מָ֫הָ֥רוּ בַּל אַסִּ֣יךְ נִסְכֵּי/הֶ֣ם מִ/דָּ֑ם וּֽ/בַל אֶשָּׂ֥א אֶת שְׁ֝מוֹתָ֗/ם עַל שְׂפָתָֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/016/004.yaml
  text: The sorrows of those who hurry after another god will multiply[a]; I will not pour out their drink offerings of blood[b], nor will I lift up their names on my lips.
translation:
  language: hi
  text: जो किसी दूसरे देवता के पीछे दौड़ते हैं, उनके दुःख बढ़ते जाएँगे[a]। मैं उनकी लहू की पेय-बलियाँ नहीं उँडेलूँगा[b], और न उनके नाम अपने होंठों पर लाऊँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उनकी मूर्तियाँ बढ़ती जाएँगी”; हिब्रू शब्द कुछ संदर्भों में मूर्तियों से जुड़ा हो सकता है, हालाँकि यहाँ “दुःख” पंक्ति के भाव में अधिक उपयुक्त है।
    reason: alternative_reading
  - marker: b
    text: या “लहू से पेय-बलियाँ।”
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְבּוּ
  choice: बढ़ते जाएँगे
  rationale: רבה का अपूर्ण रूप वृद्धि या बहुगुणित होने का भाव देता है; प्रसंग में परिणामसूचक भविष्याभिमुख कथन स्वाभाविक है।
- source_word: עַצְּבוֹתָם
  choice: उनके दुख
  rationale: यह रूप दुख या पीड़ाओं को सूचित कर सकता है; संबंधित रूप कुछ प्रसंगों में मूर्तियों से भी जुड़ता है, इसलिए वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: אַחֵר
  choice: किसी दूसरे देवता
  rationale: शाब्दिक अर्थ ‘दूसरा’ है; अर्घों और नामों का अगला उल्लेख स्पष्ट करता है कि यहाँ किसी दूसरे देवता की ओर संकेत है।
- source_word: מָהָרוּ
  choice: पीछे दौड़ते हैं
  rationale: מהר का मूल भाव शीघ्रता करना है; यहाँ उत्सुकतापूर्वक किसी दूसरे देवता का अनुसरण करना अभिप्रेत है।
- source_word: בַּל
  choice: नहीं / न
  rationale: काव्यात्मक निषेध को दोनों समानांतर खंडों में सहज हिंदी निषेध से व्यक्त किया गया है।
- source_word: אַסִּיךְ
  choice: उँडेलूँगा
  rationale: נסך का हिफ़ील रूप पेय-अर्पण उँडेलने के संस्कारगत कार्य को बताता है; ‘उँडेलना’ मूल बिंब बनाए रखता है।
- source_word: נִסְכֵּיהֶם
  choice: उनके ... अर्घ
  rationale: यह उपासना में उँडेला जाने वाला पेय-अर्पण है; ‘अर्घ’ संक्षिप्त और धार्मिक संदर्भ में सुबोध हिंदी है।
- source_word: מִדָּם
  choice: लहू के
  rationale: מן सामग्री या स्रोत बता सकता है; ‘लहू के अर्घ’ बलिदानी बिंब और उसकी तीव्रता को बनाए रखता है।
- source_word: אֶשָּׂא
  choice: लाऊँगा
  rationale: נשא का मूल बिंब उठाने का है, पर ‘नामों को होंठों पर लाना’ हिंदी में उल्लेख या उच्चारण का स्वाभाविक मुहावरा है।
- source_word: שְׁמוֹתָם
  choice: उनके नाम
  rationale: सर्वनाम का संदर्भ दूसरे देवताओं अथवा मूर्तिपूजक उपासना से जुड़े नामों की ओर हो सकता है; अनुवाद मूल संदर्भगत अस्पष्टता बनाए रखता है।
- source_word: עַל שְׂפָתָי
  choice: अपने होंठों पर
  rationale: यह बोलने या नाम लेने का बिंब है; हिंदी में भी यही मुहावरा स्वाभाविक और स्पष्ट है।
theological_decisions:
- issue: אַחֵר के बाद निहित संज्ञा
  choice: किसी दूसरे देवता
  alternative: किसी दूसरे के पीछे
  rationale: रक्तमय अर्घों और नाम लेने से इनकार का संदर्भ मूर्तिपूजक आराधना को दर्शाता है; ‘देवता’ जोड़ना निहित आशय को स्पष्ट करता है, कोई नया धर्मसिद्धांत नहीं जोड़ता।
- issue: עַצְּבוֹתָם का अर्थ
  choice: उनके दुख
  alternative: उनकी मूर्तियाँ
  rationale: वाक्य सबसे स्वाभाविक रूप से दूसरे देवता का पीछा करने वालों के परिणाम को बताता है—उनके दुख बढ़ेंगे। फिर भी हिब्रू रूप का मूर्ति-संबंधी अर्थ संभव होने से उसे पादटिप्पणी में सुरक्षित रखा गया है।
- issue: שְׁמוֹתָם में सर्वनाम का संदर्भ
  choice: उनके नाम
  alternative: उन देवताओं के नाम / उनके उपासकों के नाम
  rationale: हिब्रू सर्वनाम का सटीक संदर्भ पूर्णतः स्पष्ट नहीं है; सामान्य सर्वनाम रखकर इस वास्तविक अस्पष्टता को अनावश्यक रूप से नहीं सुलझाया गया।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमामय काव्यात्मक शैली रखी गई है। ‘पीछे दौड़ते हैं’ उत्सुक अनुसरण का भाव देता है; ‘लहू’ और ‘अर्घ’ उपासना-संबंधी तीखे बिंब को बनाए रखते हैं। सभी पादटिप्पणी चिह्न मुख्य पाठ में उपस्थित हैं।
