  text: For you will not abandon my soul to Sheol[b][a], nor will you let your faithful one see the pit.
translation:
  language: hi
  text: 'क्योंकि तू मेरे प्राण को अधोलोक के हवाले नहीं छोड़ेगा,

    और न अपने निष्ठावान जन[a] को गर्त देखने देगा।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अपने पवित्र जन को।’ इब्रानी शब्द निष्ठावान, विश्वासयोग्य, धर्मपरायण या पवित्र व्यक्ति को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले पद में व्यक्त भरोसे का आधार बताता है और हिन्दी में काव्यात्मक तर्क को स्वाभाविक रूप से जोड़ता है।
- source_word: תַעֲזֹב
  choice: नहीं छोड़ेगा
  rationale: עזב का अर्थ छोड़ना, त्यागना या बेसहारा छोड़ देना हो सकता है। यहाँ ‘नहीं छोड़ेगा’ सहज है और मृत्यु के लोक के वश में न छोड़ने का भाव रखता है।
- source_word: נַפְשִׁי
  choice: मेरे प्राण
  rationale: נפש व्यक्ति के प्राण, जीवन या स्वयं व्यक्ति को सूचित कर सकता है। ‘मेरे प्राण’ मूल रूपक और काव्यात्मक समानांतरता को बनाए रखता है।
- source_word: לִשְׁאוֹל
  choice: अधोलोक में
  rationale: שׁאול मृतकों के लोक को सूचित करता है, केवल किसी व्यक्तिगत कब्र को नहीं। ‘अधोलोक’ हिन्दी में इस प्राचीन धारणा को संक्षेप और गरिमा के साथ व्यक्त करता है।
- source_word: תִתֵּן
  choice: देखने देगा
  rationale: נתן का मूल अर्थ ‘देना’ है, पर infinitive के साथ यहाँ इसका मुहावरेदार अर्थ ‘होने देना’ या ‘अनुमति देना’ है।
- source_word: חֲסִידְךָ
  choice: अपने विश्वासयोग्य जन
  rationale: חסיד निष्ठावान, भक्त, धर्मपरायण या पवित्र व्यक्ति का भाव रखता है। ‘विश्वासयोग्य जन’ संबंधपरक निष्ठा को सामने रखता है; प्रसिद्ध वैकल्पिक अर्थ फुटनोट में सुरक्षित है।
- source_word: לִרְאוֹת
  choice: देखने
  rationale: ראה का सीधा अर्थ ‘देखना’ है। प्रसंग में इसका आशय अनुभव करना भी हो सकता है, पर मूल इब्रानी मुहावरा मुख्य पाठ में रखा गया है।
- source_word: שָׁחַת
  choice: गर्त
  rationale: שחת का अर्थ गर्त, विनाश या सड़न हो सकता है। अधोलोक के समानांतर ‘गर्त’ सबसे सीधा स्थान-सूचक अर्थ है, जबकि पाठ-परंपरा में महत्त्वपूर्ण ‘सड़न’ को फुटनोट में रखा गया है।
theological_decisions:
- issue: नए नियम में इस पद का मसीही प्रयोग
  choice: मुख्य पाठ में इब्रानी भजन के तात्कालिक शब्दार्थ को रखा गया है।
  alternative: חֲסִידְךָ को ‘अपने पवित्र जन’ और שָׁחַת को ‘सड़न’ कहना, जिससे सेप्टुआजिन्ट और नए नियम के उद्धरण की भाषा अधिक प्रत्यक्ष रूप से उभरे।
  rationale: अनुवाद इब्रानी पाठ को बाद की व्याख्या के अनुसार अधिक निश्चित नहीं बनाता। साथ ही मसीही प्रयोग से जुड़े परंपरागत विकल्पों को फुटनोट में सुरक्षित रखकर वास्तविक भाषिक और धर्मवैचारिक तनाव बनाए रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। परमेश्वर के लिए एकवचन निकट संबोधन ‘तू’ मूल इब्रानी के द्वितीय पुरुष एकवचन और भजन की सीधी प्रार्थनात्मक वाणी को दर्शाता है। ‘अधोलोक’ और ‘गर्त’ काव्यात्मक समानांतरता बनाए रखते हैं।
