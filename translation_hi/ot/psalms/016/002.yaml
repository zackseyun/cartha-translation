  yaml_path: translation/ot/psalms/016/002.yaml
  text: I said to Yahweh[a], “You are my Lord; I have no good apart from you.”
translation:
  language: hi
  text: मैंने यहोवा से कहा, “आप मेरे प्रभु हैं; आपके सिवा मेरा कोई भला नहीं।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, अधिक शाब्दिक रूप से: “मेरा भला आपसे परे नहीं है।” इब्रानी पदबंध का अर्थ कुछ खुला है; यह संकेत करता है कि भजनकार का भला यहोवा से अलग नहीं है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָמַרְתְּ
  choice: मैंने कहा
  rationale: रूप असामान्य है और व्यंजनात्मक रूप 2 स्त्रीलिंग एकवचन जैसा दिखता है, पर प्रसंग में भजनकार स्वयं परमेश्वर को संबोधित कर रहा है। प्राचीन अनुवाद-परंपरा के अनुरूप प्रथम पुरुष का अर्थ लिया गया है।
- source_word: לַיהוָה
  choice: यहोवा से
  rationale: ל यहाँ कथन के अप्रत्यक्ष संबोधन को व्यक्त करता है। יהוה को उसके व्यक्तिगत वाचा-नाम ‘यहोवा’ से प्रस्तुत किया गया है। स्वाभाविक हिन्दी में ‘से कहा’ प्रयुक्त हुआ है।
- source_word: אֲדֹנָי אָתָּה
  choice: आप मेरे प्रभु हैं
  rationale: אֲדֹנָי में प्रथम पुरुष एकवचन प्रत्यय है, इसलिए ‘मेरे प्रभु’; स्पष्ट सर्वनाम אָתָּה को आदरसूचक ‘आप’ से और निहित योजक को ‘हैं’ से व्यक्त किया गया है।
- source_word: טוֹבָתִי
  choice: मेरा भला
  rationale: यह संज्ञा भलाई, हित, कल्याण या लाभ का व्यापक अर्थ रखती है। ‘मेरा भला’ इस व्यापकता को बनाए रखता है और इसे नैतिक आत्म-भलाई तक सीमित नहीं करता।
- source_word: בַּל עָלֶיךָ
  choice: आपके सिवा ... नहीं
  rationale: शाब्दिक संरचना ‘आपसे परे नहीं’ जैसी है। पूरे पदबंध के मुहावरेदार अर्थ को स्वाभाविक हिन्दी में ‘आपके सिवा मेरा कोई भला नहीं’ से व्यक्त किया गया है, जबकि अधिक औपचारिक संभावना पादटिप्पणी में रखी गई है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में चतुरक्षरीय व्यक्तिगत नाम सीधे प्रयुक्त है। हिन्दी पाठकों के लिए व्यापक रूप से पहचाने जाने वाले रूप ‘यहोवा’ से नाम की विशिष्टता सुरक्षित रहती है।
- issue: अंतिम उपवाक्य का अर्थ
  choice: आपके सिवा मेरा कोई भला नहीं
  alternative: मेरा भला आपसे परे नहीं है
  rationale: इब्रानी वाक्य संक्षिप्त और अर्थ की दृष्टि से कुछ खुला है। मुख्य पाठ परमेश्वर से अलग किसी भले के न होने की स्वाभाविक स्वीकारोक्ति देता है; पादटिप्पणी अधिक औपचारिक अर्थ को सुरक्षित रखती है, बिना कथन के धर्मवैज्ञानिक तनाव को अनावश्यक रूप से सुलझाए।
- issue: परमेश्वर के लिए हिन्दी संबोधन
  choice: आप
  alternative: तू
  rationale: आधुनिक मानक हिन्दी में ‘आप’ सामान्य पाठक के लिए स्वाभाविक, गरिमापूर्ण और श्रद्धासूचक है; इससे मूल के प्रत्यक्ष व्यक्तिगत संबोधन की भावना बनी रहती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, प्रार्थनापूर्ण और गरिमापूर्ण रूप अपनाया गया है। वाक्य संक्षिप्त रखा गया है और ‘प्रभु’ तथा ‘भला’ जैसे सर्वसुलभ धार्मिक शब्दों का प्रयोग किया गया है।
