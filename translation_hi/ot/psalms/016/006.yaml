  text: The boundary lines have fallen for me in pleasant places[a]; indeed[b], my inheritance is beautiful to me.
translation:
  language: hi
  text: मेरे लिए नापने की डोरियाँ मनभावने स्थानों में पड़ी हैं[a]; सचमुच, मेरी विरासत मुझे सुहावनी है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरे लिए सीमा की रेखाएँ मनभावने स्थानों में पड़ी हैं।” इब्रानी में वह बिंब है जिसमें नापने की डोरियों से विरासत में मिली भूमि की सीमाएँ निर्धारित की जाती थीं।
    reason: lexical_alternative
  - marker: b
    text: या, “मेरी विरासत मुझे सुंदर है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲבָלִים
  choice: नापने की डोरियाँ
  rationale: भूमि के बँटवारे में प्रयुक्त मापने की डोरियों का ठोस बिंब बनाए रखता है; ये डोरियाँ निर्धारित हिस्से की सीमाएँ सूचित करती हैं।
- source_word: נָפְלוּ
  choice: पड़ी हैं
  rationale: इब्रानी क्रिया के शाब्दिक 'गिरने/पड़ने' के बिंब को स्वाभाविक हिन्दी में रखता है और भूमि आवंटित होने का भाव संदर्भ से स्पष्ट होता है।
- source_word: לִי
  choice: मेरे लिए
  rationale: व्यक्ति के लाभ और उसके लिए निर्धारित हिस्से का भाव व्यक्त करता है।
- source_word: בַּנְּעִמִים
  choice: मनभावने स्थानों में
  rationale: भूमि-विभाजन के संदर्भ में सुखद, रमणीय या प्रिय स्थानों का अर्थ स्वाभाविक ढंग से देता है।
- source_word: אַף
  choice: सचमुच
  rationale: दूसरे कथन की पुष्टिकारक और बलदायक शक्ति को व्यक्त करता है, केवल जोड़ का अर्थ नहीं देता।
- source_word: נַחֲלָת
  choice: मेरी विरासत
  rationale: वाचा और भूमि के आवंटन से जुड़ी विरासत की भाषा को बनाए रखता है; प्रथम पुरुष का संबंध संदर्भ और עָלַי से स्पष्ट है।
- source_word: שָׁפְרָה
  choice: सुंदर लगी है
  rationale: क्रिया के सुंदर, सुहावना या मनोहर होने के मूल्यांकनात्मक भाव को व्यक्त करती है और पूर्ण क्रिया के रूप को भी सहज हिन्दी में रखती है।
- source_word: עָלַי
  choice: मुझे
  rationale: शाब्दिक 'मुझ पर' के बजाय इस मुहावरे में वक्ता के निजी मूल्यांकन और संबंध को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: भूमि-आवंटन का बिंब परमेश्वर से मिले भजनकार के हिस्से के रूपक के रूप में
  choice: नापने की डोरियों और विरासत के ठोस बिंब को बनाए रखा गया है।
  alternative: मेरे हिस्से में मनभावनी आशीषें आई हैं; मेरा भाग मुझे प्रिय है।
  rationale: पद भूमि-विभाजन और विरासत की भाषा को पिछले पद में यहोवा को भजनकार का भाग कहे जाने से जोड़ता है। इसे सामान्य 'आशीषों' में बदलना मूल की वाचाई और आवंटन-संबंधी बनावट को समतल कर देता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सुबोध शैली। ‘नापने की डोरियाँ’ मूल भूमि-आवंटन बिंब को ‘सीमा-रेखाओं’ से अधिक प्रत्यक्ष रूप में रखती हैं; पादटिप्पणी में वैकल्पिक अभिव्यक्ति दी गई है। दोनों पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
