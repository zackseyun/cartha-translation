  rationale: 'संशोधन इब्रानी वाक्य की दो समानांतर संज्ञाओं को स्पष्ट करता है: याहवे भजनकार की विरासत का भाग भी हैं और उसका प्याला भी। अंतिम “भाग” गोराल की आवंटन/चिट्ठी वाली छवि को संक्षेप और स्वाभाविक हिन्दी में बनाए रखता है; पादटिप्पणी उस छवि को स्पष्ट करती है।'
