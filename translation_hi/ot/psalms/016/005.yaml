    text: या, “याहवे ही मेरा भाग और मेरा प्याला है।” इब्रानी में ‘भाग’, ‘विरासत/हिस्सा’ और ‘चिट्ठी से ठहराया गया भाग’ जैसी बँटवारे की कई छवियाँ पास-पास प्रयुक्त हुई हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय प्रचलित हिन्दी लिप्यंतरण में रखा गया है।
- source_word: מְנָת חֶלְקִי
  choice: मेरे विरासत के भाग ... का हिस्सा
  rationale: रचना में आए दो निकटवर्ती बँटवारे-संबंधी शब्दों के संबंध को व्यक्त करते हुए आवंटित विरासत का भाव बनाए रखा गया है।
- source_word: וְכוֹסִי
  choice: और मेरे प्याले
  rationale: ‘प्याला’ जीवन में मिले अनुभव या नियत हिस्से का बाइबलीय रूपक है; चित्र को व्याख्या में बदलने के बजाय सुरक्षित रखा गया है।
- source_word: אַתָּה
  choice: तू ही
  rationale: स्पष्ट सर्वनाम के बलाघात को ‘ही’ से व्यक्त किया गया है और भजन की सीधी, श्रद्धापूर्ण संबोधन-शैली रखी गई है।
- source_word: תּוֹמִיךְ
  choice: सुरक्षित रखता है
  rationale: क्रिया का भाव थामे रखने, बनाए रखने और स्थिर करने का है; इस संदर्भ में यह स्वाभाविक हिन्दी में आवंटित हिस्से की सुरक्षा दर्शाता है।
- source_word: גּוֹרָלִי
  choice: मेरे भाग्य में आए हिस्से
  rationale: ‘चिट्ठी/भाग’ की आवंटन-छवि और उससे प्राप्त हिस्से दोनों को समझने योग्य हिन्दी में रखा गया है, बिना इसे केवल अमूर्त ‘नियति’ बनाने के।
theological_decisions:
- issue: याहवे स्वयं भजनकार की विरासत और आवंटित हिस्सा हैं
  choice: अलग-अलग आवंटन-छवियों—विरासत, हिस्सा, प्याला और भाग्य में आए हिस्से—को बनाए रखा गया है।
  alternative: ‘याहवे ही मेरा भाग और मेरा प्याला है; तू मेरा भाग बनाए रखता है।’
  rationale: इब्रानी में निकट क्रम से आए overlapping allotment terms काव्यात्मक और धर्मवैचारिक तनाव पैदा करते हैं। उन्हें एक ही शब्द में समेटने के बजाय याहवे को भजनकार की प्राप्त विरासत और उसके रक्षक, दोनों रूपों में रहने दिया गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण काव्यात्मक हिन्दी; परमेश्वर को संबोधन में ‘तू’ भजन की निकटता और मूल के एकवचन संबोधन को दर्शाता है।
