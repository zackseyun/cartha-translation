  text: מִכְתָּ֥ם לְ/דָוִ֑ד שָֽׁמְרֵ֥/נִי אֵ֝֗ל כִּֽי חָסִ֥יתִי בָֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/016/001.yaml
  text: A miktam of David. Preserve me[a], O God, for I take refuge in you.
translation:
  language: hi
  text: 'दाऊद का मिक्ताम।[a]

    हे परमेश्वर, मेरी रक्षा कर,

    क्योंकि मैंने तुझमें शरण ली है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी: मिक्ताम। यह अनिश्चित अर्थ वाला भजन-शीर्षक है और संभवतः किसी रचना-प्रकार को बताता है। कुछ अनुवादों में इसे ‘भजन’ या ‘स्वर्णिम गीत’ कहा गया है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִכְתָּם
  choice: मिक्ताम
  rationale: यह भजन का अनिश्चित अर्थ वाला शीर्षक है। अर्थ का अनुमान लगाने के बजाय लिप्यंतरण मूल रूप और उसकी अस्पष्टता को सुरक्षित रखता है।
- source_word: לְדָוִד
  choice: दाऊद का
  rationale: भजनों के शीर्षकों में לְ लेखन, संबंध, स्वामित्व या समर्पण का संकेत दे सकता है। ‘दाऊद का’ स्वाभाविक हिंदी है और ‘दाऊद द्वारा रचित’ की अपेक्षा कम निर्णायक है।
- source_word: שָׁמְרֵנִי
  choice: मेरी रक्षा कर
  rationale: שׁמר का आज्ञार्थक रूप संभालने, सुरक्षित रखने और रक्षा करने की प्रार्थना व्यक्त करता है। ‘मेरी रक्षा कर’ सामान्य आधुनिक हिंदी में इसका व्यापक आशय स्पष्ट करता है।
- source_word: אֵל
  choice: हे परमेश्वर
  rationale: אֵל ईश्वर के लिए प्रयुक्त सामान्य उपाधि है; प्रत्यक्ष संबोधन को हिंदी में ‘हे परमेश्वर’ स्वाभाविक और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यहाँ כִּי प्रार्थना का कारण प्रस्तुत करता है; ‘क्योंकि’ कारण-संबंध को स्पष्ट रूप से बनाए रखता है।
- source_word: חָסִיתִי
  choice: मैंने शरण ली है
  rationale: חסה आश्रय लेने की छवि रखता है। पूर्ण क्रिया को ‘मैंने ... ली है’ परिणामस्वरूप बनी हुई निर्भरता सहित व्यक्त करता है और इसे केवल सामान्य ‘भरोसा’ तक सीमित नहीं करता।
- source_word: בָךְ
  choice: तुझमें
  rationale: חסה के साथ ב उस व्यक्ति को चिह्नित करता है जिसमें शरण ली जाती है। एकवचन संबोधन के अनुरूप ‘तुझमें’ मूल की निकटता और प्रार्थनात्मक स्वर बनाए रखता है।
theological_decisions:
- issue: शीर्षक מִכְתָּם का अर्थ
  choice: अर्थ निश्चित किए बिना ‘मिक्ताम’ के रूप में लिप्यंतरण
  alternative: ‘भजन’, ‘स्वर्णिम गीत’ या ‘शिलालेख’ जैसे अर्थपरक अनुवाद
  rationale: शब्द का ठीक अर्थ अनिश्चित है। कोई निश्चित विधा या अर्थ चुनना उपलब्ध प्रमाण से अधिक निष्कर्ष निकालना होगा; लिप्यंतरण वास्तविक अस्पष्टता को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी में सरल, प्रार्थनात्मक और गरिमापूर्ण शैली रखी गई है। परमेश्वर के लिए एकवचन निकट संबोधन ‘तू’ के रूपों का प्रयोग मूल इब्रानी के एकवचन संबोधन के अनुरूप है। शीर्षक को मुख्य पाठ से अलग पंक्ति में रखा गया है।
