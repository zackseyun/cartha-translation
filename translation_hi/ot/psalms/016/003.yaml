base_translation:
  language: en
  yaml_path: translation/ot/psalms/016/003.yaml
  text: As for the holy ones who are in the land[c][b][a], they are the noble ones in whom is all my delight.
translation:
  language: hi
  text: जहाँ तक देश[b] में रहनेवाले पवित्र जनों[a] की बात है, वे श्रेष्ठ जन[c] हैं; मेरा सारा आनन्द उन्हीं में है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘संत’।
    reason: lexical_alternative
  - marker: b
    text: या, ‘जो पृथ्वी पर रहते हैं’।
    reason: lexical_alternative
  - marker: c
    text: या, ‘प्रतिष्ठित जन’ अथवा ‘महिमामय जन’।
    reason: lexical_alternative
lexical_decisions:
- source_word: לִקְדוֹשִׁים
  choice: जहाँ तक ... पवित्र जनों की बात है
  rationale: आरम्भिक לִ को सन्दर्भ में सामान्य सम्प्रदान के बजाय विषय-सूचक मानकर प्रस्तुत किया गया है। ‘पवित्र जन’ קְדוֹשִׁים का सहज और अपेक्षाकृत गैर-पारिभाषिक रूप है।
- source_word: אֲשֶׁר בָּאָרֶץ
  choice: जो देश में रहते हैं
  rationale: אֶרֶץ के ‘देश’ और ‘पृथ्वी’ दोनों अर्थ सम्भव हैं। मुख्य पाठ में स्थानीय मानवीय समुदाय के अनुकूल ‘देश’ रखा गया है और दूसरा अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: הֵמָּה
  choice: वे ही ... हैं
  rationale: स्वतन्त्र सर्वनाम के बल को हिन्दी में ‘वे ही’ द्वारा व्यक्त किया गया है।
- source_word: וְאַדִּירֵי
  choice: श्रेष्ठ जन
  rationale: אַדִּירֵי यहाँ गरिमा, उत्कृष्टता या महत्ता दर्शा सकता है। ‘श्रेष्ठ जन’ स्वाभाविक हिन्दी में सम्मान व्यक्त करता है, बिना इसे सैन्य सामर्थ्य तक सीमित किए।
- source_word: כָּל חֶפְצִי
  choice: मेरा सारा आनन्द
  rationale: חֵפֶץ में आनन्द, प्रसन्नता और अभिलाषा का अर्थ-क्षेत्र है। इस सन्दर्भ में ‘सारा आनन्द’ भजनकार के स्नेहपूर्ण मूल्यांकन को सहज ढंग से व्यक्त करता है।
- source_word: בָם
  choice: उन्हीं में
  rationale: व्यक्तियों को सूचित करते हुए ב का मूल सम्बन्ध बनाए रखा गया है; ‘उन्हीं’ पूर्ववर्ती सर्वनाम के बल के साथ वाक्य को स्वाभाविक बनाता है।
theological_decisions:
- issue: ‘पवित्र जनों’ की पहचान
  choice: मुख्य पाठ उन्हें देश में रहनेवाले मानवीय पवित्र जनों के रूप में पढ़ता है।
  alternative: इसे पृथ्वी पर स्थित पवित्र प्राणियों, समर्पित व्यक्तियों, अथवा किसी अन्य पवित्र समूह के लिए भी समझा जा सकता है।
  rationale: ‘जो देश में हैं’ वाक्यांश मानवीय, पार्थिव समुदाय की ओर प्रबल संकेत करता है; फिर भी अनुवाद बाद की किसी तकनीकी कलीसियाई पहचान को आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किन्तु सहज काव्यात्मक गद्य रखा गया है। ‘सन्त’ जैसे परम्परा-विशिष्ट शब्द के बजाय ‘पवित्र जन’ चुना गया है। सभी पादटिप्पणी-चिह्न सम्बन्धित पदों के साथ मुख्य पाठ में दिए गए हैं।
