id: PSA.16.11
reference: Psalms 16:11
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: תּֽוֹדִיעֵ/נִי֮ אֹ֤רַח חַ֫יִּ֥ים שֹׂ֣בַע שְׂ֭מָחוֹת אֶת פָּנֶ֑י/ךָ נְעִמ֖וֹת בִּ/ימִינְ/ךָ֣ נֶֽצַח־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/016/011.yaml
  text: You make known to me the path of life[a]; in your presence is fullness of joy[b]; at your right hand are pleasures forever.
translation:
  language: hi
  text: तू मुझे जीवन का मार्ग बताता है[a]; तेरी उपस्थिति में आनंद की भरपूरी है[b]; तेरे दाहिने हाथ में सदा-सर्वदा के सुख हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तू मुझे जीवन का मार्ग बताएगा।”
    reason: व्याकरण की दृष्टि से हिब्रू अपूर्ण क्रिया भविष्य का भाव भी व्यक्त कर सकती है।
  - marker: b
    text: शाब्दिक रूप से, “तेरे मुख के सामने आनंदों की भरपूरी है।”
    reason: यह पादटिप्पणी मूल के ‘मुख’ वाले चित्र और ‘आनंद’ के बहुवचन रूप को सुरक्षित रखती है।
lexical_decisions:
- source_word: תּוֹדִיעֵנִי
  choice: तू मुझे ... बताता है
  rationale: ידע के हिफ़ील रूप का अर्थ ‘जानने देता/बताता है’ है। काव्यात्मक भरोसे के संदर्भ में अपूर्ण क्रिया को वर्तमान काल में रखा गया है; भविष्य का भाव भी संभव है।
- source_word: אֹרַח חַיִּים
  choice: जीवन का मार्ग
  rationale: यह जीवन की ओर ले जाने वाले मार्ग या जीवन जीने की राह का रूपक है। हिन्दी में ‘जीवन का मार्ग’ स्वाभाविक है और मूल की संक्षिप्तता बनाए रखता है।
- source_word: שֹׂבַע שְׂמָחוֹת
  choice: आनंद की भरपूरी
  rationale: שֹׂבַע परिपूर्णता या प्रचुरता व्यक्त करता है। שְׂמָחוֹת रूप की दृष्टि से बहुवचन है, पर आधुनिक हिन्दी में भाववाचक एकवचन ‘आनंद’ के साथ ‘भरपूरी’ अधिक स्वाभाविक है।
- source_word: אֶת־פָּנֶיךָ
  choice: तेरी उपस्थिति में
  rationale: शाब्दिक अभिव्यक्ति ‘तेरे मुख के सामने’ है, जिसका प्रचलित अर्थ निकट उपस्थिति है। मुख्य पाठ में अर्थ-स्पष्ट हिन्दी रखी गई है और शाब्दिक चित्र पादटिप्पणी में सुरक्षित है।
- source_word: נְעִמוֹת
  choice: सुख
  rationale: यह बहुवचन संज्ञात्मक रूप मनोहर, सुखद बातों या आनंददायक वस्तुओं को दर्शाता है। ‘सुख’ सरल आधुनिक हिन्दी में इस भाव को व्यक्त करता है।
- source_word: בִּימִינְךָ
  choice: तेरे दाहिने हाथ में
  rationale: यह अनुवाद मूल के स्थानसूचक चित्र को बनाए रखता है। ‘तेरी दाहिनी ओर’ भी संभव है, पर ‘हाथ में’ हिब्रू अभिव्यक्ति के अधिक निकट है।
- source_word: נֶצַח
  choice: सदा-सर्वदा
  rationale: यह लगातार और अनंत काल तक बने रहने का भाव देता है; ‘सदा-सर्वदा’ हिन्दी भजन-काव्य में स्वाभाविक और स्पष्ट है।
theological_decisions:
- issue: अपूर्ण क्रिया תּוֹדִיעֵנִי को वर्तमान या भविष्य के रूप में समझना
  choice: 'वर्तमान: ‘तू मुझे ... बताता है’'
  alternative: 'भविष्य: ‘तू मुझे ... बताएगा’'
  rationale: भजन में यह रूप वर्तमान भरोसे की घोषणा हो सकता है, यद्यपि भविष्य की आशा भी व्याकरण की दृष्टि से संभव है; इसलिए वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- issue: פָּנֶיךָ के शाब्दिक ‘मुख’ और मुहावरेदार ‘उपस्थिति’ के बीच चयन
  choice: मुख्य पाठ में ‘तेरी उपस्थिति में’
  alternative: ‘तेरे मुख के सामने’
  rationale: यह मुहावरा परमेश्वर की निकट उपस्थिति दर्शाता है। स्वाभाविक हिन्दी को मुख्य पाठ में और मूल का देहात्मक चित्र पादटिप्पणी में रखने से अर्थ और स्रोत-पारदर्शिता दोनों सुरक्षित रहते हैं।
- issue: שְׂמָחוֹת के बहुवचन को हिन्दी में बनाए रखना
  choice: भाववाचक एकवचन ‘आनंद’
  alternative: शाब्दिक बहुवचन ‘आनंदों’
  rationale: हिब्रू बहुवचन विविध या तीव्र आनंद का संकेत दे सकता है, पर हिन्दी में ‘आनंदों की भरपूरी’ अस्वाभाविक है। एकवचन सामूहिक भाव मूल की प्रचुरता को बिना किसी विशेष धर्मवैज्ञानिक व्याख्या के व्यक्त करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और काव्यात्मक शैली अपनाई गई है। परमेश्वर के लिए भजन की सीधी संबोधन-शैली के अनुरूप ‘तू/तेरा’ रखा गया है। तीनों समानांतर खंडों और मूल की प्रचुरता तथा निकटता की छवियों को यथासंभव बनाए रखा गया है।
