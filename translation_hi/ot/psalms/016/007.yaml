  text: I will bless Yahweh[a], who counsels me; even at night my inner being instructs me.
translation:
  language: hi
  text: मैं यहोवा को धन्य कहूँगा, जिसने मुझे परामर्श दिया है; रातों में भी मेरा अंतरतम मुझे शिक्षा देता है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ, “मेरे गुर्दे मुझे शिक्षा देते हैं।” इब्रानी में गुर्दे मनुष्य के अंतरतम—उसके अंतःकरण और गहरी भावनाओं—के प्रतीक हो सकते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲבָרֵךְ
  choice: मैं ... धन्य कहूँगा
  rationale: पिएल रूप का मूल अर्थ परमेश्वर के विषय में भला कहना, अर्थात उसे धन्य कहना या उसकी स्तुति करना है। हिंदी में ‘धन्य कहूँगा’ मूल क्रिया के निकट रहते हुए संकल्पात्मक अपूर्ण रूप को व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चतुर्वर्णीय दिव्य नाम को किसी उपाधि से बदलने के बजाय हिंदी में प्रचलित नाम-रूप ‘यहोवा’ से व्यक्त किया गया है।
- source_word: יְעָצָנִי
  choice: मुझे सम्मति देता है
  rationale: יעץ का अर्थ सम्मति या परामर्श देना है। वर्तमानकाल यहाँ यहोवा के निरंतर या सामान्य कार्य को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אַף לֵילוֹת
  choice: रातों में भी
  rationale: אַף का योगात्मक-बलात्मक अर्थ ‘भी’ से और לֵילוֹת का बहुवचन ‘रातों’ से सुरक्षित रहता है; यह बार-बार होने वाले रात्रिकालीन अनुभव का संकेत दे सकता है।
- source_word: יִסְּרוּנִי
  choice: मुझे शिक्षा देता है
  rationale: יסר में शिक्षा, अनुशासन, चेतावनी और सुधार के अर्थ संभव हैं। इस संदर्भ में ‘शिक्षा देता है’ स्वाभाविक है, पर उसके गठनकारी भाव को पूरी तरह समाप्त नहीं करता।
- source_word: כִלְיוֹתָי
  choice: मेरा अंतरतम
  rationale: शाब्दिक अर्थ ‘मेरे गुर्दे’ है, पर इब्रानी में यह अंतःकरण, गहरी भावनाओं और भीतरी आत्मबोध का प्रतीक हो सकता है। ‘अंतरतम’ आधुनिक पाठक को अभिप्रेत अर्थ देता है, बिना इसे केवल ‘मन’ या ‘हृदय’ तक सीमित किए।
theological_decisions:
- issue: כִלְיוֹתָי का मानव-स्वरूप संबंधी रूपक
  choice: मुख्य पाठ में ‘मेरा अंतरतम’, और पादटिप्पणी में शाब्दिक चित्र
  alternative: ‘मेरे गुर्दे’, ‘मेरा हृदय’, या ‘मेरा मन’
  rationale: ‘मेरे गुर्दे’ आधुनिक हिंदी में अर्थ को अस्पष्ट या हास्यास्पद बना सकता है, जबकि ‘हृदय’ और ‘मन’ इब्रानी के अलग चित्र आरोपित करते हैं। ‘अंतरतम’ व्यापक आंतरिक चेतना और भाव-जगत को व्यक्त करता है; पादटिप्पणी मूल रूपक को पारदर्शी रखती है।
- issue: יִסְּרוּנִי में शिक्षा और अनुशासन की अर्थ-सीमा
  choice: ‘शिक्षा देता है’
  alternative: ‘अनुशासित करता है’, ‘चेताता है’, या ‘सुधारता है’
  rationale: संदर्भ सकारात्मक आंतरिक मार्गदर्शन का है, इसलिए ‘शिक्षा’ उपयुक्त है; फिर भी मूल शब्द में अनुशासन या सुधार की संभावना बनी रहती है और उसे निर्णायक रूप से नकारा नहीं गया है।
translation_notes:
  register: आधुनिक मानक हिंदी का गरिमापूर्ण, काव्यात्मक किंतु सहज रूप अपनाया गया है। ‘सम्मति’ और ‘अंतरतम’ सामान्य धार्मिक-काव्य भाषा में बोधगम्य हैं। समानांतर पंक्तियों और ‘रातों’ के बहुवचन को बनाए रखा गया है।
