  text: मैंने याहवे[a] को निरन्तर अपने सामने रखा है; क्योंकि वह मेरी दाहिनी ओर है, मैं नहीं डगमगाऊँगा।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में YHWH, ईश्वर का व्यक्तिगत नाम; इसका लिप्यन्तरण ‘यहोवा’ भी किया जाता है।
    reason: alternative_reading
  - marker: b
    text: या, “मैं हिलाया न जाऊँगा।” इब्रानी क्रिया अस्थिर होने, डगमगाने या सुरक्षित स्थान से हिलाए जाने का भाव व्यक्त कर सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁוִּיתִי
  choice: मैंने … रखा है
  rationale: पिएल रूप यहाँ जान-बूझकर सामने रखने या स्थापित करने का भाव देता है। हिन्दी का पूर्ण वर्तमान एक किए हुए निश्चय और उसके जारी प्रभाव—दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में लिप्यन्तरित किया गया है।
- source_word: לְנֶגְדִּי
  choice: अपने सामने
  rationale: यह अभिव्यक्ति किसी को अपनी दृष्टि और उपस्थिति के सामने रखने का स्थानिक तथा सम्बन्धपरक भाव बनाए रखती है।
- source_word: תָמִיד
  choice: निरन्तर
  rationale: यह शब्द लगातार या नियमित रूप से बने रहने का भाव देता है; ‘निरन्तर’ भजन की गरिमा और आधुनिक हिन्दी की स्पष्टता दोनों के अनुकूल है।
- source_word: כִּי
  choice: क्योंकि
  rationale: दूसरा उपवाक्य भजनकार के न डगमगाने का कारण प्रस्तुत करता है, इसलिए कारणवाचक अर्थ स्पष्ट रखा गया है।
- source_word: מִימִינִי
  choice: मेरी दाहिनी ओर
  rationale: शाब्दिक दाहिने हाथ की स्थानिक छवि को स्वाभाविक हिन्दी में व्यक्त करता है और निकट सहायक तथा रक्षक उपस्थिति का संकेत बनाए रखता है।
- source_word: בַּל אֶמּוֹט
  choice: मैं नहीं डगमगाऊँगा
  rationale: מוט अस्थिर होने, लड़खड़ाने या सुरक्षित स्थिति से हिलाए जाने का भाव दे सकता है। ‘डगमगाऊँगा’ शारीरिक और रूपक—दोनों अर्थों को सहज हिन्दी में सँभालता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम सीधे आया है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यन्तरण है; इसे ‘प्रभु’ जैसी उपाधि से बदलने पर नाम और उपाधि का भेद मिट जाता।
