  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। वाक्य की काव्यात्मक समान्तरता तथा कारण-संबंध सुरक्षित हैं। ‘दाहिनी ओर’ मूल स्थानिक बिम्ब को स्वाभाविक हिन्दी में रखता है; ‘डगमगाऊँगा’ मूल क्रिया की वास्तविक और रूपकात्मक अस्पष्टता को अनावश्यक रूप से सीमित नहीं करता।
