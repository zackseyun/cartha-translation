source:
  edition: WLC
  text: יְהוָ֣ה מָ֭לָךְ יִרְגְּז֣וּ עַמִּ֑ים יֹשֵׁ֥ב כְּ֝רוּבִ֗ים תָּנ֥וּט הָ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/099/001.yaml
  text: Yahweh reigns[a]; let the peoples tremble. He sits enthroned upon the cherubim[b]; let the earth quake.
translation:
  language: hi
  text: याहवे राज्य करता है[a]; राष्ट्रों के लोग थरथराएँ। वह करूबों पर विराजमान है[b]; पृथ्वी काँपे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “राष्ट्रों के लोग थरथराते हैं ... पृथ्वी काँपती है।” इब्रानी की अपूर्ण क्रियाओं को कामनार्थक के बजाय वर्णनात्मक भी समझा जा सकता है।
    reason: alternative_reading
  - marker: b
    text: “करूबों पर विराजमान” का अनुवाद “करूबों के ऊपर विराजमान” या “करूबों के बीच विराजमान” भी हो सकता है। यह याहवे के लिए प्रयुक्त एक राजकीय-मन्दिर संबंधी उपाधि है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को उपाधि से बदलने के बजाय आधुनिक हिन्दी लिप्यंतरण में रखा गया है।
- source_word: מָלָךְ
  choice: राज्य करता है
  rationale: काव्यात्मक घोषणा में यह रूप याहवे के वर्तमान राजत्व की उद्घोषणा करता है; ‘राजा बन गया’ जैसा आरंभसूचक अर्थ अनावश्यक रूप से नहीं जोड़ा गया।
- source_word: יִרְגְּזוּ עַמִּים
  choice: देश-देश के लोग थरथराएँ
  rationale: बहुवचन עַמִּים को अनेक जनसमुदायों के अर्थ में स्वाभाविक हिन्दी दी गई है और अपूर्ण क्रिया को इस स्तुति-काव्य में आज्ञार्थक/कामनार्थक प्रतिक्रिया के रूप में रखा गया है।
- source_word: יֹשֵׁב כְּרוּבִים
  choice: वह करूबों पर विराजमान है
  rationale: יֹשֵׁב का राजकीय-मन्दिर संबंधी भाव ‘विराजमान’ से व्यक्त होता है; ‘पर’ मूल अभिव्यक्ति की स्थानगत अस्पष्टता को अपेक्षाकृत निकटता से बनाए रखता है।
- source_word: כְּרוּבִים
  choice: करूबों
  rationale: इस विशिष्ट स्वर्गीय प्राणी-वर्ग के लिए प्रचलित बाइबलीय लिप्यंतरण रखा गया है।
- source_word: תָּנוּט הָאָרֶץ
  choice: पृथ्वी काँप उठे
  rationale: क्रिया के हिलने/डगमगाने के भाव को व्यापक ब्रह्मांडीय संदर्भ में स्वाभाविक हिन्दी दी गई है और समानांतर पंक्ति की तरह कामनार्थक बल रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल में व्यक्तिगत वाचा-नाम प्रत्यक्ष रूप से आया है, इसलिए उसे किसी उपाधि से प्रतिस्थापित न करके लिप्यंतरित किया गया है।
- issue: יִרְגְּזוּ और תָּנוּט का भाव
  choice: 'कामनार्थक/आज्ञार्थक: ‘थरथराएँ ... काँप उठे’'
  alternative: 'वर्णनात्मक: ‘थरथराते हैं ... काँपती है’'
  rationale: राजत्व की उद्घोषणा के बाद स्तोत्र की अलंकारिक गति कामनार्थक पाठ का समर्थन करती है, पर इब्रानी अपूर्ण रूप वर्णनात्मक भी समझे जा सकते हैं; यह विकल्प पादटिप्पणी में सुरक्षित है।
- issue: יֹשֵׁב כְּרוּבִים में स्थानगत संबंध
  choice: करूबों पर विराजमान
  alternative: करूबों के ऊपर विराजमान; करूबों के बीच विराजमान
  rationale: यह याहवे की राजकीय-मन्दिर संबंधी उपाधि है। ‘पर’ मूल की संक्षिप्तता बनाए रखता है और ‘बीच’ जैसी अधिक विशिष्ट व्याख्या को मुख्य पाठ में आरोपित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल रखी गई है। ‘देश-देश के लोग’ बहुवचन जनसमुदायों को सामान्य हिन्दी में स्पष्ट करता है; ‘विराजमान’ राजकीय भाव को सहज रूप से संप्रेषित करता है।
