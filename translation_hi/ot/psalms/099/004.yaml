  text: וְ/עֹ֥ז מֶלֶךְ֮ מִשְׁפָּ֪ט אָ֫הֵ֥ב אַ֭תָּה כּוֹנַ֣נְתָּ מֵישָׁרִ֑ים מִשְׁפָּ֥ט וּ֝/צְדָקָ֗ה בְּ/יַעֲקֹ֤ב אַתָּ֬ה עָשִֽׂיתָ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/099/004.yaml
  text: The strength of the King loves justice[a]; you have established uprightness[b]; you have done justice and righteousness in Jacob.
translation:
  language: hi
  text: राजा का सामर्थ्य न्याय से प्रेम करता है[a]; तूने निष्पक्षता स्थापित की है[b]; याकूब में न्याय और धार्मिकता का कार्य तूने ही किया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या अधिक सहज रूप में, “सामर्थी राजा न्याय से प्रेम करता है।” इब्रानी आरंभ संक्षिप्त है और उसे एक से अधिक प्रकार से समझा जा सकता है।
    reason: alternative_reading
  - marker: b
    text: “निष्पक्षता” का अनुवाद “सीधापन” या “न्यायोचितता” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעֹז
  choice: सामर्थ्य
  rationale: עֹז का मूल अर्थ शक्ति या सामर्थ्य है। कठिन और संक्षिप्त इब्रानी रचना को छिपाने के बजाय संज्ञा-रूप बनाए रखा गया है।
- source_word: מֶלֶךְ
  choice: राजा
  rationale: यह परमेश्वर के राजकीय शासन का संदर्भ है; हिन्दी में अनावश्यक अंग्रेज़ी-शैली के बड़े अक्षर का प्रश्न नहीं उठता।
- source_word: מִשְׁפָּט
  choice: न्याय
  rationale: यहाँ शब्द उचित शासन और न्यायपूर्ण व्यवस्था को दर्शाता है; दोनों बार एक ही अनुवाद रखा गया है।
- source_word: אָהֵב
  choice: प्रेम करता है
  rationale: क़ातल रूप यहाँ स्थायी विशेषता या सामान्य सत्य व्यक्त करता है, इसलिए वर्तमान काल स्वाभाविक है।
- source_word: כּוֹנַנְתָּ
  choice: स्थापित किया है
  rationale: क्रिया दृढ़ करने या स्थापित करने का भाव देती है; पूर्ण कार्य के वर्तमान परिणाम को हिन्दी पूर्णकाल से व्यक्त किया गया है।
- source_word: מֵישָׁרִים
  choice: समता
  rationale: यह नैतिक और न्यायिक अर्थ में सीधाई, निष्पक्षता या बराबरी के न्याय को सूचित करता है; इस संदर्भ में 'समता' सहज है।
- source_word: וּצְדָקָה
  choice: और धार्मिकता
  rationale: צְדָקָה को 'न्याय' से अलग रखते हुए पारंपरिक नैतिक अर्थ संरक्षित किया गया है।
- source_word: בְּיַעֲקֹב
  choice: याकूब में
  rationale: काव्यात्मक वाचा-नाम 'याकूब' को 'इस्राएल' बनाकर स्पष्ट नहीं किया गया और בְ का सीधा भाव बनाए रखा गया है।
- source_word: עָשִׂיתָ
  choice: कार्य ... किया है
  rationale: עשה व्यापक क्रिया है; हिन्दी में 'न्याय और धार्मिकता का कार्य किया' अधिक स्वाभाविक है और मूल के कर्मों को बनाए रखता है।
- source_word: אַתָּה
  choice: तूने ही
  rationale: इब्रानी में व्यक्त सर्वनाम के बलाघात को 'ही' से व्यक्त किया गया है; भजन की सीधी प्रार्थनात्मक संबोधन-शैली के अनुरूप 'तू' रखा गया है।
theological_decisions:
- issue: कठिन आरंभिक वाक्यांश וְעֹז מֶלֶךְ की रचना
  choice: राजा का सामर्थ्य न्याय से प्रेम करता है
  alternative: सामर्थी राजा न्याय से प्रेम करता है; अथवा राजा अपने सामर्थ्य में न्याय से प्रेम करता है
  rationale: इब्रानी वाक्य-विन्यास संक्षिप्त और एक से अधिक प्रकार से समझने योग्य है। मुख्य पाठ संज्ञात्मक रचना को सुरक्षित रखता है, जबकि अधिक मुहावरेदार संभावनाएँ पादटिप्पणी में दी गई हैं।
- issue: מֵישָׁרִים का न्यायिक और नैतिक विस्तार
  choice: समता
  alternative: खराई; निष्पक्षता
  rationale: पद में न्यायपूर्ण राजकीय व्यवस्था प्रमुख है, इसलिए 'समता' उपयुक्त है; फिर भी शब्द नैतिक सीधाई भी व्यक्त कर सकता है, जिसे पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और प्रार्थनात्मक हिन्दी। परमेश्वर के सीधे संबोधन में काव्यात्मक 'तू' रखा गया है। मुख्य पाठ मूल की असामान्य आरंभिक रचना को जानबूझकर सुरक्षित रखता है, और पादटिप्पणी सहज विकल्प देती है।
