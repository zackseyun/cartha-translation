  text: Exalt Yahweh our God[a], and bow down at his footstool[b]; he is holy.
translation:
  language: hi
  text: 'यहोवा, हमारे परमेश्वर की महिमा करो,


    और उसके चरणों की चौकी के सामने दण्डवत करो[a];


    वह पवित्र है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद ‘उसके चरणों की चौकी के पास’ भी हो सकता है। यहाँ ‘चरणों की चौकी’ परमेश्वर के पृथ्वी पर विराजमान होने से जुड़े किसी स्थान—जैसे वाचा के सन्दूक या पवित्रस्थान—की ओर संकेत कर सकती है, पर पद स्वयं उसकी पहचान स्पष्ट नहीं करता।
    reason: lexical_alternative_and_cultural_note
lexical_decisions:
- source_word: רֽוֹמְמ֡וּ
  choice: महान मानो
  rationale: बहुवचन आज्ञार्थक क्रिया परमेश्वर को ऊँचा ठहराने और उसकी महिमा स्वीकार करने का भाव रखती है। शाब्दिक ‘ऊँचा करो’ की अपेक्षा ‘महान मानो’ आधुनिक हिन्दी में अधिक स्वाभाविक है और उपासना का आशय बनाए रखता है।
- source_word: יְהוָ֤ה
  choice: यहोवा
  rationale: मूल पाठ के विशिष्ट ईश्वरीय नाम को उपाधि में बदलने के बजाय हिन्दी पाठकों में प्रचलित लिप्यंतरण से रखा गया है।
- source_word: אֱלֹהֵ֗ינוּ
  choice: हमारे परमेश्वर
  rationale: प्रथम पुरुष बहुवचन प्रत्यय सहित पद का सीधा अर्थ है और समुदायगत संबंध को बनाए रखता है।
- source_word: וְהִשְׁתַּחֲווּ
  choice: और ... दण्डवत करो
  rationale: क्रिया में झुकने या भूमि पर गिरकर प्रणाम करने की शारीरिक क्रिया निहित है। ‘दण्डवत करो’ केवल सामान्य ‘आराधना करो’ की अपेक्षा उस सजीव भाव को सुरक्षित रखता है।
- source_word: לַהֲדֹם רַגְלָיו
  choice: उसके चरणों की चौकी के सामने
  rationale: הֲדֹם רַגְלָיו का चित्र ‘उसके पैरों/चरणों की चौकी’ है। उपसर्ग ל उपासना के इस प्रसंग में दिशा, निकटता या सम्मुखता व्यक्त कर सकता है; ‘के सामने’ हिन्दी में स्वाभाविक है और चौकी को आराधना का वास्तविक लक्ष्य बताने से बचता है।
- source_word: קָדוֹשׁ הוּא
  choice: वह पवित्र है
  rationale: विशेषण और सर्वनाम से बनी इस विधेयात्मक पंक्ति का स्पष्ट, स्वाभाविक हिन्दी रूप; यह पहले के दोनों आदेशों का आधार बताती है।
theological_decisions:
- issue: ‘उसके चरणों की चौकी’ का संदर्भ
  choice: मुख्य पाठ में रूपक को बिना किसी विशिष्ट पहचान के बनाए रखा गया।
  alternative: इसे वाचा का सन्दूक, सिय्योन, मन्दिर अथवा पृथ्वी के रूप में स्पष्ट करना।
  rationale: पद स्वयं चरणों की चौकी की पहचान नहीं बताता। किसी एक ऐतिहासिक या धर्मवैज्ञानिक संदर्भ को मुख्य पाठ में जोड़ना मूल की अर्थगत खुली संभावना को अनावश्यक रूप से सीमित कर देता।
- issue: לַהֲדֹם में संबंध
  choice: ‘के सामने’
  alternative: ‘के पास’ अथवा ‘की ओर’
  rationale: इब्रानी ל इस उपासना-संदर्भ में एक से अधिक प्रकार से समझा जा सकता है। मुख्य पाठ में स्वाभाविक हिन्दी चुनी गई है और अन्य संभावनाएँ टिप्पणी में रखी गई हैं।
translation_notes:
  register: भाषा आधुनिक, सामुदायिक और उपासना-योग्य रखी गई है। ‘दण्डवत’ गरिमापूर्ण तथा सामान्य धार्मिक हिन्दी में बोधगम्य है; ‘चरणों की चौकी’ मूल रूपक को सुरक्षित रखते हुए ‘पाँवों की चौकी’ से कुछ अधिक काव्यात्मक गरिमा देती है।
