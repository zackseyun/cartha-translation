  terminology: “याहवे,” “परमेश्वर,” “क्षमा,” and “प्रतिशोध” are suitable. “प्रतिशोध” retains the serious retributive force of נֹקֵם without imposing a doctrinal resolution of the verse’s tension.
  issues:
