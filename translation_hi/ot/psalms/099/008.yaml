source:
  edition: WLC
  text: יְהוָ֣ה אֱלֹהֵי/נוּ֮ אַתָּ֪ה עֲנִ֫יתָ֥/ם אֵ֣ל נֹ֭שֵׂא הָיִ֣יתָ לָ/הֶ֑ם וְ֝/נֹקֵ֗ם עַל עֲלִילוֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/099/008.yaml
  text: O Yahweh our God[a], you answered them; you were a forgiving God to them[b], yet an avenger of their deeds.
translation:
  language: hi
  text: हे याहवे, हमारे परमेश्वर, तूने उन्हें उत्तर दिया; तू उनके लिए क्षमा करने वाला परमेश्वर था[a], फिर भी उनके कामों के कारण प्रतिशोध लेने वाला था[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तू उनके लिए [उनका पाप] उठा ले जाने वाला परमेश्वर था।” इब्रानी कृदन्त में दोष को उठाकर ले जाने और इस प्रकार क्षमा करने—दोनों का भाव हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “फिर भी तू उनके कामों के कारण प्रतिशोध लेता था।” इब्रानी रूप का अनुवाद संज्ञात्मक या क्रियात्मक, दोनों प्रकार से किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: אֱלֹהֵינוּ
  choice: हमारे परमेश्वर
  rationale: प्रथम पुरुष बहुवचन प्रत्यय सहित संबोधन को सीधे और स्वाभाविक रूप में व्यक्त करता है।
- source_word: אַתָּה עֲנִיתָם
  choice: तूने उन्हें उत्तर दिया
  rationale: स्पष्ट सर्वनाम के बल को बनाए रखते हुए ענה के सामान्य अर्थ ‘उत्तर देना’ को सुरक्षित रखा गया है।
- source_word: אֵל נֹשֵׂא הָיִיתָ לָהֶם
  choice: तू उनके लिए क्षमा करनेवाला परमेश्वर था
  rationale: נֹשֵׂא का मूल भाव ‘उठाना/ले जाना’ है, पर पाप या दोष के प्रसंग में यह क्षमा करने का मुहावरेदार अर्थ देता है; सम्बन्धसूचक לָהֶם को ‘उनके लिए’ से रखा गया है।
- source_word: וְנֹקֵם
  choice: फिर भी ... प्रतिशोध लेनेवाला था
  rationale: कृदन्त परमेश्वर को प्रतिशोध लेनेवाले के रूप में बताता है। ‘फिर भी’ क्षमा और न्याय के बीच प्रसंगगत विरोध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: עַל עֲלִילוֹתָם
  choice: उनके कामों का
  rationale: עֲלִילוֹתָם को व्यापक ‘कामों’ से प्रस्तुत किया गया है, ताकि संज्ञा में स्वयं ‘बुरे’ जोड़कर अर्थ को आवश्यकता से अधिक सीमित न किया जाए।
theological_decisions:
- issue: ईश्वरीय क्षमा और प्रतिशोध का साथ-साथ कथन
  choice: पद में परमेश्वर को क्षमा करनेवाला भी और उनके कामों का प्रतिशोध लेनेवाला भी कहा गया है।
  alternative: क्षमा और दण्ड के बीच तनाव को मिटाकर यह मान लेना कि दण्ड केवल दूसरे लोगों को मिला।
  rationale: इब्रानी पाठ दोनों बातों को साथ रखता है और यह स्पष्ट नहीं करता कि उनके पारस्परिक सम्बन्ध को किस प्रकार व्यवस्थित किया जाए; इसलिए अनुवाद इस धार्मिक तनाव को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘तू’ भजन के सीधे ईश्वरीय संबोधन की निकटता और एकवचन रूप को सुरक्षित रखता है; ‘प्रतिशोध’ न्यायिक गंभीरता व्यक्त करता है, जबकि ‘कामों’ से मूल संज्ञा की व्यापकता बनी रहती है।
