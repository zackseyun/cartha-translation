base_translation:
  language: en
  yaml_path: translation/ot/psalms/099/006.yaml
  text: Moses and Aaron were among his priests[a], and Samuel among those who called on his name; they called to Yahweh, and he answered them.
translation:
  language: hi
  text: मूसा और हारून उसके याजकों में थे, और शमूएल उसके नाम को पुकारने वालों में था[a]। उन्होंने याहवे को पुकारा, और उसने उन्हें उत्तर दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसके नाम का आह्वान करने वालों में।” हिब्रू वाक्यांश का शाब्दिक अर्थ है, “उसका नाम पुकारने वालों में।”
    reason: शमूएल के लिए प्रयुक्त समानांतर कृदन्तीय वाक्यांश का स्वाभाविक वैकल्पिक हिन्दी मुहावरा दर्ज करता है।
lexical_decisions:
- source_word: בְּכֹהֲנָיו
  choice: उसके याजकों में थे
  rationale: 'בְּ का यहाँ अंशवाचक अर्थ स्वाभाविक है: मूसा और हारून उसके याजकों के समूह में गिने जाते हैं। हिन्दी में सहज वाक्य के लिए ‘थे’ जोड़ा गया है। ‘याजक’ כֹּהֵן का सीधा और प्रचलित धार्मिक पदनाम है।'
- source_word: בְּקֹרְאֵי שְׁמוֹ
  choice: उसका नाम पुकारनेवालों में था
  rationale: यह कृदन्तीय पद पिछले अंश के समानांतर है और शमूएल को उन लोगों में रखता है जो परमेश्वर के नाम को प्रार्थना और आराधना में पुकारते हैं। ‘उसका नाम’ मूल के स्पष्ट शब्दों को सुरक्षित रखता है।
- source_word: קֹרִאים אֶל
  choice: वे ... को पुकारते थे
  rationale: אֶל के साथ क्रिया संबोधित पुकार या प्रार्थना को व्यक्त करती है। प्रसंग में अपूर्ण क्रिया की पुनरावृत्त अथवा अभ्यस्त भूतकालीन शक्ति को ‘पुकारते थे’ स्वाभाविक रूप से दर्शाता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी बाइबल परंपरा में परमेश्वर के व्यक्तिगत वाचा-नाम के लिए ‘यहोवा’ व्यापक और पहचाना हुआ लिप्यंतरण है; इसे किसी उपाधि से नहीं बदला गया।
- source_word: יַעֲנֵם
  choice: वह उन्हें उत्तर देता था
  rationale: अपूर्ण रूप को पूर्ववर्ती ‘पुकारते थे’ के अनुरूप अभ्यस्त भूतकाल में रखा गया है, जिससे उनके पुकारने और परमेश्वर के उत्तर देने का बारंबार संबंध व्यक्त होता है।
- source_word: שְׁמוֹ
  choice: उसका नाम
  rationale: मूल पाठ में ‘उसका नाम’ स्पष्ट है और यह प्रार्थना तथा आराधना में परमेश्वर को पुकारने की बाइबिलीय अभिव्यक्ति है; इसलिए इसे केवल ‘उसे’ नहीं किया गया।
theological_decisions:
- issue: मूसा, हारून और शमूएल को मध्यस्थ प्रार्थना के आदर्शों के रूप में रखते हुए याजकीय भेद को कैसे सुरक्षित रखा जाए
  choice: मूसा और हारून उसके याजकों में थे, और शमूएल उसका नाम पुकारनेवालों में था
  alternative: मूसा और हारून उसके याजक थे, और शमूएल ने उसका नाम पुकारा
  rationale: दोनों समानांतर पदों का वर्गसूचक, अंशवाचक रूप बनाए रखा गया है। ‘याजकों में’ मूसा को हारून के समान संकीर्ण संस्थागत पद में बाँधने से बचता है, पर भजन में दोनों को परमेश्वर के सामने स्वीकृत मध्यस्थों के रूप में रखे जाने की वास्तविक तनावपूर्ण भाषा भी नहीं मिटाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल है। ‘याजक’, ‘नाम पुकारना’ और ‘उत्तर देना’ जैसे परिचित बाइबिलीय पद रखे गए हैं। समानांतरता तथा अभ्यस्त भूतकाल को स्पष्ट और स्वाभाविक हिन्दी में सुरक्षित किया गया है।
