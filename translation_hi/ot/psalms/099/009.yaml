  text: Exalt Yahweh our God[a], and bow down at his holy mountain, for Yahweh our God is holy.
translation:
  language: hi
  text: हमारे परमेश्वर याहवे की महिमा करो, और उसके पवित्र पर्वत की ओर दण्डवत करो[a], क्योंकि हमारे परमेश्वर याहवे पवित्र हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसके पवित्र पर्वत पर आराधना करो।” इब्रानी क्रिया का अर्थ दण्डवत करना या आराधना करना हो सकता है; संबंधित पूर्वसर्ग का अर्थ “पर” या “की ओर” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: רֽוֹמְמ֡וּ
  choice: महान मानो
  rationale: बहुवचन आज्ञार्थक क्रिया परमेश्वर की महानता को ऊँचा घोषित करने और उसका गुणगान करने का आह्वान करती है; ‘महान मानो’ आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है।
- source_word: אֱלֹהֵינוּ
  choice: हमारे परमेश्वर
  rationale: प्रथम पुरुष बहुवचन प्रत्यय सहित रूप का सीधा अर्थ ‘हमारा/हमारे परमेश्वर’ है; वाक्य-विन्यास के अनुसार ‘हमारे परमेश्वर’ स्वाभाविक है।
- source_word: וְהִשְׁתַּחֲווּ
  choice: झुककर दण्डवत करो
  rationale: क्रिया शारीरिक रूप से झुकने या भूमि पर दण्डवत होने को दर्शाती है और इसी क्रिया के द्वारा आराधना भी व्यक्त करती है; यह अनुवाद मूर्त भाव को बनाए रखता है।
- source_word: לְהַר קָדְשׁוֹ
  choice: उसके पवित्र पर्वत की ओर
  rationale: לְ दिशा अथवा स्थान-संबंध दोनों व्यक्त कर सकता है। ‘की ओर’ पवित्र पर्वत के संबंध में दण्डवत करने का स्थानिक भाव रखता है और पर्वत को आराधना का पात्र समझने से बचाता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह आज्ञाओं का कारण प्रस्तुत करता है; आधुनिक हिन्दी में ‘क्योंकि’ स्पष्ट और स्वाभाविक है।
- source_word: קָדוֹשׁ
  choice: पवित्र
  rationale: भजन के केंद्रीय कथन में परमेश्वर की पवित्रता के लिए यह मानक और संदर्भानुकूल हिन्दी शब्द है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ व्यक्तिगत ईश्वरीय नाम का प्रयोग करता है। उसे ‘प्रभु’ जैसी उपाधि से बदलने के बजाय नाम के रूप में रखा गया है; ‘यहोवा’ हिन्दी बाइबलीय प्रयोग में सुबोध और प्रतिष्ठित रूप है।
- issue: הִשְׁתַּחֲווּ में शारीरिक दण्डवत और आराधना का संबंध
  choice: झुककर दण्डवत करो
  alternative: आराधना करो
  rationale: मूल क्रिया आराधना के अर्थ में प्रयुक्त हो सकती है, पर उसका ठोस शारीरिक चित्र भी वास्तविक है। चुना हुआ रूप उस चित्र को सुरक्षित रखता है, जबकि पादटिप्पणी आराधना वाले अर्थ और पूर्वसर्ग की स्थानिक अस्पष्टता बताती है।
- issue: לְהַר में दिशा या स्थान
  choice: पवित्र पर्वत की ओर
  alternative: पवित्र पर्वत पर/के पास
  rationale: पूर्वसर्ग दिशा और स्थान-संबंध दोनों की अनुमति देता है। मुख्य पाठ में दिशा रखी गई है, पर वैकल्पिक स्थानगत समझ को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, काव्यात्मक किंतु सामान्य पाठक के लिए सुबोध रूप। ‘दण्डवत’ बाइबलीय उपासना की देहगत मुद्रा को संक्षेप में व्यक्त करता है; ‘झुककर’ उसके अर्थ को स्पष्ट करता है।
