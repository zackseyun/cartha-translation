- source_word: שִׁמְךָ
  choice: आपके ... नाम
  rationale: ‘नाम’ की इब्रानी उपमा को बनाए रखता है, जिसमें परमेश्वर की प्रतिष्ठा और प्रकट चरित्र भी निहित हैं।
- source_word: גָּדוֹל
  choice: महान
  rationale: मूल विशेषण का सीधा और स्वाभाविक हिन्दी प्रतिरूप है।
- source_word: וְנוֹרָא
  choice: और भययोग्य
  rationale: यह शब्द भय और श्रद्धामिश्रित विस्मय उत्पन्न करने का भाव रखता है। ‘भययोग्य’ इस प्रबल अर्थ को बनाए रखता है और केवल आधुनिक हल्के ‘अद्भुत’ तक सीमित नहीं करता।
- source_word: קָדוֹשׁ
  choice: पवित्र
  rationale: यह मानक धार्मिक और साहित्यिक अर्थ को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: הוּא
  choice: वह ... है
  rationale: स्वतंत्र सर्वनाम के बल को बनाए रखते हुए हिन्दी की स्वाभाविक वाक्य-रचना अपनाई गई है।
theological_decisions:
- issue: अंतिम उपवाक्य में ‘वह’ का संदर्भ
  choice: ‘वह’ यहोवा की ओर संकेत करता है और उसकी पवित्रता की घोषणा करता है।
  alternative: इब्रानी व्याकरण में पुल्लिंग ‘वह’ को पुल्लिंग ‘नाम’ से भी जोड़ा जा सकता है, जिससे अर्थ ‘उसका नाम पवित्र है’ समझा जा सकता है।
  rationale: भजन 99 में ‘वह पवित्र है’ refrain-सदृश घोषणा के रूप में यहोवा के विषय में आती है। फिर भी स्रोत की संक्षिप्तता और संभावित व्याकरणिक तनाव को विस्तार जोड़कर समाप्त नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सार्वजनिक उपासना के अनुकूल रूप। ‘भययोग्य’ सामान्य पाठक के लिए बोधगम्य रहते हुए मूल के श्रद्धा और भय—दोनों भावों को सुरक्षित रखता है। परमेश्वर के संबोधन में आदरसूचक ‘आप’ अपनाया गया है।
