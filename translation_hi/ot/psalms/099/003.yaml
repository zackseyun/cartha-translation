    text: या ‘वे आपके महान और भयप्रद नाम का धन्यवाद करें’; इब्रानी क्रिया का अर्थ ‘धन्यवाद देना’ या ‘स्तुति करना’ हो सकता है।
    reason: lexical_alternative
