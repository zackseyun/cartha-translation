  text: In a pillar of cloud he spoke to them[a]; they kept his testimonies and the statute he gave them.
translation:
  language: hi
  text: बादल के खंभे में उसने उनसे बात की[a]; उन्होंने उसकी साक्षियों को माना और उस विधि का पालन किया जो उसने उन्हें दी थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बादल के खंभे में से उसने उनसे बात की।” इब्रानी संबंधबोधक अव्यय स्थान अथवा माध्यम—दोनों का बोध करा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעַמּוּד עָנָן
  choice: बादल के खम्भे में से
  rationale: בְּ स्थान या माध्यम दोनों का बोध करा सकता है। ‘में से’ बादल के खम्भे के भीतर से परमेश्वर के बोलने की स्वाभाविक हिन्दी अभिव्यक्ति है; वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: יְדַבֵּר
  choice: उसने ... बात की
  rationale: यद्यपि yiqtol रूप आदतन या अपूर्ण क्रिया व्यक्त कर सकता है, यहाँ ऐतिहासिक-काव्यात्मक पुनरावलोकन में सामान्य भूतकाल स्वाभाविक है।
- source_word: אֲלֵיהֶם
  choice: उनसे
  rationale: यह पिछले पद में उल्लिखित मूसा, हारून और शमूएल की ओर संकेत करने वाला स्वाभाविक हिन्दी प्रयोग है।
- source_word: שָׁמְרוּ
  choice: पालन किया
  rationale: वाचा और आज्ञापालन के सन्दर्भ में שׁמר का अर्थ केवल सुरक्षित रखना नहीं, बल्कि मानना और पालन करना है।
- source_word: עֵדֹתָיו
  choice: उसकी साक्षियों
  rationale: ‘साक्षियाँ’ עֵדוֹת की साक्ष्य/वाचा-संबंधी धारणा को बनाए रखता और अगले חֹק से उसका शब्दगत भेद सुरक्षित रखता है।
- source_word: וְחֹק
  choice: और उस विधि
  rationale: חֹק किसी निर्धारित नियम या विधान को दर्शाता है। एकवचन बनाए रखने और सहज आधुनिक हिन्दी के लिए ‘विधि’ चुना गया है।
- source_word: נָתַן לָמוֹ
  choice: जो उसने उन्हें दी थी
  rationale: यह उपवाक्य स्वाभाविक रूप से ‘विधि’ को विशेषित करता है। ‘दी थी’ मुख्य क्रिया से पहले दी गई विधि का काल-संबंध स्पष्ट और सहज बनाता है।
theological_decisions:
- issue: ‘उसने’ और ‘उन्हें/उनसे’ के संकेतार्थ
  choice: ‘उसने’ का संकेत यहोवा की ओर और ‘उनसे/उन्हें’ का संकेत पिछले पद में उल्लिखित मूसा, हारून और शमूएल की ओर है।
  alternative: ‘उन्हें’ इन प्रतिनिधियों के माध्यम से समस्त इस्राएल के लिए व्यापक रूप में समझा जा सकता है।
  rationale: निकटतम संदर्भ भजन 99:6 में मूसा, हारून और शमूएल को नाम से बताता है। मुख्य पाठ में संज्ञाएँ जोड़ने के बजाय सर्वनाम बनाए रखने से काव्यात्मक प्रवाह और संभावित व्यापक संकेत दोनों सुरक्षित रहते हैं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘बादल का खम्भा’, ‘साक्षियाँ’ और ‘विधि’ मूल की काव्यात्मक तथा वाचा-संबंधी शब्दावली के भेद को बनाए रखते हैं।
