lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय उसका प्रचलित हिन्दी लिप्यंतरण रखा गया है।
- source_word: בְּצִיּוֹן
  choice: सिय्योन में
  rationale: בְּ का स्थानवाचक अर्थ यहाँ स्वाभाविक रूप से ‘में’ है; ‘सिय्योन’ हिन्दी बाइबलीय प्रयोग में परिचित रूप है।
- source_word: גָּדוֹל
  choice: महान
  rationale: यह विशेषण महत्ता और महानता व्यक्त करता है; ‘महान’ स्तुतिपरक संदर्भ में सीधा और स्वाभाविक है।
- source_word: וְרָם הוּא
  choice: और वह ... ऊँचे हैं
  rationale: רָם ऊँचाई तथा श्रेष्ठता/महिमा का बोध देता है, जबकि स्वतंत्र सर्वनाम הוּא के बल को ‘वह’ से बनाए रखा गया है।
- source_word: עַל כָּל הָעַמִּים
  choice: सब जाति-जातियों के ऊपर
  rationale: עַל का स्थानात्मक और प्रभुत्वसूचक तनाव ‘ऊपर’ में बना रहता है। बहुवचन עַמִּים को राजनीतिक ‘राष्ट्रों’ तक सीमित न करके ‘जाति-जातियों’ से व्यक्त किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम है; इसलिए उसे उपाधि से प्रतिस्थापित न करके लिप्यंतरित किया गया है।
- issue: עַל द्वारा व्यक्त संबंध
  choice: के ऊपर
  alternative: पर; से ऊँचे
  rationale: ‘के ऊपर’ परमेश्वर की उच्चता और सभी जाति-जातियों पर उनकी सर्वोच्चता—दोनों संभावित भावों को बिना अनावश्यक रूप से सीमित किए बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, सम्मानपूर्ण और काव्यात्मक रखी गई है। परमेश्वर के लिए हिन्दी की आदरसूचक बहुवचन क्रिया ‘हैं’ प्रयुक्त हुई है। ‘जाति-जातियों’ से विविध जनसमूहों का भाव व्यक्त होता है, न कि केवल आधुनिक राष्ट्र-राज्यों का।
