source:
  edition: WLC
  text: הַ/שָּׂ֣ם נַ֭פְשֵׁ/נוּ בַּֽ/חַיִּ֑ים וְ/לֹֽא נָתַ֖ן לַ/מּ֣וֹט רַגְלֵֽ/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/066/009.yaml
  text: the one who keeps our soul in life and has not allowed our feet to slip[a][b][c].
translation:
  language: hi
  text: जो हमारे प्राण को जीवित रखता है[a][b] और हमारे पाँव को डगमगाने नहीं देता[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो हमारे प्राण को जीवितों के बीच रखता है।” हिब्रू क्रिया का मूल अर्थ “रखना” या “स्थापित करना” है; इस प्रसंग में इसका भाव जीवन की रक्षा करना है।
    reason: lexical_alternative
  - marker: b
    text: “हमारे प्राण” का अनुवाद “हमारा जीवन” या “हमें” भी किया जा सकता है; हिब्रू शब्द का अर्थ प्राण, जीवन, स्वयं या व्यक्ति हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: या, “हमारे पाँव को फिसलने नहीं देता।”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשָּׂם
  choice: जो … जीवित रखता है
  rationale: שׂוּם का मूल अर्थ ‘रखना/स्थापित करना’ है। נַפְשֵׁנוּ בַּחַיִּים के साथ यहाँ इसका प्रसंगगत भाव जीवन की रक्षा करके जीवित रखना है; वर्तमानकालिक कृदन्त का भाव ‘जो … रखता है’ से बना रहता है।
- source_word: נַפְשֵׁנוּ
  choice: हमारे प्राण
  rationale: נֶפֶשׁ का अर्थ प्रसंगानुसार प्राण, जीवन, स्वयं या व्यक्ति हो सकता है। ‘हमारे प्राण’ हिब्रू की मूर्त अभिव्यक्ति को बनाए रखते हुए यहाँ जीवन का भाव स्वाभाविक रूप से व्यक्त करता है।
- source_word: בַּחַיִּים
  choice: जीवित
  rationale: शाब्दिक संरचना ‘जीवन में/जीवितों के बीच’ है। हिंदी में ‘प्राण को जीवित रखता है’ उसी जीवन-संरक्षण के भाव को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וְלֹא נָתַן
  choice: और … नहीं देता
  rationale: נתן के साथ לַמּוֹט किसी घटना को होने देने की अनुमति का मुहावरा है; इसलिए ‘नहीं देता’ उपयुक्त है।
- source_word: לַמּוֹט
  choice: डगमगाने
  rationale: מוֹט अस्थिर होने, लड़खड़ाने या खिसकने का भाव देता है। पाँव के बिंब के साथ ‘डगमगाने’ मूल रूपक और संभावित व्यापक अस्थिरता दोनों को बनाए रखता है।
- source_word: רַגְלֵנוּ
  choice: हमारे पाँव
  rationale: मूल में ‘हमारा पाँव’ सामूहिक अर्थ रखता है। हिंदी का ‘हमारे पाँव’ स्वाभाविक है और स्थिरता के ठोस बिंब को बनाए रखता है।
