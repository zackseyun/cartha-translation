  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण और काव्यात्मक शैली रखी गई है। ‘प्राण’ भजन-साहित्य के अनुकूल है, फिर भी सामान्य पाठक के लिए बोधगम्य है। ‘डगमगाने’ से मूल का शारीरिक बिंब और स्थिरता का रूपक दोनों सुरक्षित रहते हैं।
