  text: אָ֭וֶן אִם רָאִ֣יתִי בְ/לִבִּ֑/י לֹ֖א יִשְׁמַ֣ע אֲדֹנָֽ/י־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/066/018.yaml
  text: If I had cherished iniquity in my heart[a], the Lord would not have listened.
translation:
  language: hi
  text: यदि मैंने अपने हृदय में अधर्म को सँजोए रखा होता, तो प्रभु मेरी न सुनता।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָוֶן
  choice: अधर्म
  rationale: यहाँ शब्द नैतिक बुराई या गलत काम का बोध कराता है। प्रार्थना के संदर्भ में ‘अधर्म’ इसके नैतिक अर्थ को स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: אִם
  choice: यदि
  rationale: यह अव्यय शर्तसूचक उपवाक्य आरंभ करता है; आधुनिक मानक हिन्दी में ‘यदि’ इसका सीधा और गरिमापूर्ण रूप है।
- source_word: רָאִיתִי
  choice: सँजोए रखता
  rationale: क्रिया का मूल अर्थ ‘देखना’ है, पर ‘हृदय में अधर्म को देखना’ मुहावरे में उसे भीतर अनुकूल स्थान देने या जान-बूझकर पाले रखने का भाव है। ‘सँजोए रखता’ इस आशय को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בְלִבִּי
  choice: अपने हृदय में
  rationale: ‘हृदय’ भीतरी विचार, इच्छा और अभिप्राय को दर्शाता है तथा मूल बिंब को बनाए रखता है।
- source_word: לֹא יִשְׁמַע
  choice: मेरी न सुनता
  rationale: प्रार्थना के संदर्भ में यह केवल ध्वनि सुन लेने के बजाय अनुकूल ध्यान देने का संकेत करता है। ‘मेरी न सुनता’ हिन्दी का स्वाभाविक प्रयोग है और ‘उत्तर न देता’ जैसी अतिरिक्त स्पष्टता नहीं जोड़ता।
- source_word: אֲדֹנָי
  choice: प्रभु
  rationale: यह परमेश्वर के लिए प्रयुक्त आदरसूचक उपाधि है; ‘प्रभु’ आधुनिक हिन्दी में उसका प्रचलित और गरिमापूर्ण अनुवाद है।
theological_decisions:
- issue: रָאִיתִי בְלִבִּי के मुहावरे को शाब्दिक रूप से ‘हृदय में देखा’ कहना या उसका आशय व्यक्त करना
  choice: भीतर अधर्म को जान-बूझकर सँजोए रखने का आशय व्यक्त किया गया है।
  alternative: यदि मैंने अपने हृदय में अधर्म को देखा/उस पर दृष्टि रखी होती
  rationale: संदर्भ केवल पाप का बोध होने की नहीं, बल्कि उसे मन में अनुकूल स्थान देने की बात करता है। मुख्य पाठ में मुहावरे का भाव दिया गया है, जबकि पादटिप्पणी स्रोत की अधिक शाब्दिक संभावना सुरक्षित रखती है।
- issue: שׁמע को ‘सुनना’, ‘ध्यान देना’ या ‘उत्तर देना’ के रूप में प्रस्तुत करना
  choice: ‘मेरी न सुनता’
  alternative: ‘मेरी प्रार्थना का उत्तर न देता’
  rationale: मूल क्रिया सुनने या ध्यान देने का अर्थ रखती है; ‘उत्तर देना’ प्रार्थना-संदर्भ में संभव निष्कर्ष है, पर मूल में स्पष्ट रूप से नहीं कहा गया। इसलिए हिन्दी मुहावरे ‘मेरी सुनना’ से उत्तरदायी सुनने का भाव बिना अतिव्याख्या के व्यक्त होता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, सहज और गरिमापूर्ण रखी गई है। ‘हृदय’ मूल के आंतरिकता वाले बिंब को बनाए रखता है, और ‘मेरी न सुनता’ प्रार्थना के प्रसंग में स्वाभाविक हिन्दी है।
