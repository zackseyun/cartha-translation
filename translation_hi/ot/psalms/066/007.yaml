  yaml_path: translation/ot/psalms/066/007.yaml
  text: He rules forever by his might; his eyes watch the nations[a]. Let not the rebellious exalt themselves. Selah
translation:
  language: hi
  text: 'वह अपने सामर्थ्य से सदा शासन करता है;


    उसकी आँखें राष्ट्रों को देखती रहती हैं।


    विद्रोही अपने आपको ऊँचा न उठाएँ[a]।


    सेला'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “विद्रोही उठ खड़े न हों” अथवा “अपने आपको बड़ा न समझें।” इब्रानी क्रिया का अर्थ ऊपर उठना, उठ खड़ा होना, या अपने आपको ऊँचा करना हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מֹשֵׁל
  choice: शासन करता है
  rationale: काल (Qal) कृदंत परमेश्वर के निरंतर शासन को व्यक्त करता है; हिन्दी में वर्तमानकालीन क्रिया स्वाभाविक रूप से इसकी सततता बनाए रखती है।
- source_word: בִּגְבוּרָתוֹ
  choice: अपने सामर्थ्य से
  rationale: גְּבוּרָה शक्ति या सामर्थ्य है और ב यहाँ साधन का भाव देता है—उसका शासन उसके अपने सामर्थ्य से होता है।
- source_word: עוֹלָם
  choice: सदा
  rationale: यहाँ शब्द क्रियाविशेषण की तरह शासन की अनंत अवधि बताता है; ‘सदा’ संक्षिप्त, स्वाभाविक और काव्यात्मक है।
- source_word: עֵינָיו ... תִּצְפֶּינָה
  choice: उसकी आँखें ... लगी रहती हैं
  rationale: मूल की मानवरूपी काव्य-छवि ‘उसकी आँखें’ को बनाए रखते हुए यह प्रयोग निरंतर सजग निगरानी का स्वाभाविक हिन्दी बोध देता है।
- source_word: בַּגּוֹיִם
  choice: राष्ट्रों पर
  rationale: גּוֹיִם यहाँ सामान्य रूप से राष्ट्रों को दर्शाता है, न कि किसी बाद के यहूदी–गैर-यहूदी भेद को; צפה के साथ ‘पर’ निगरानी का भाव स्पष्ट करता है।
- source_word: הַסּוֹרְרִים
  choice: विद्रोही
  rationale: यह कृदंत उन लोगों को बताता है जो हठपूर्वक विरोध करते हैं; ‘विद्रोही’ आधुनिक हिन्दी में संज्ञात्मक और नैतिक दोनों भावों को स्पष्ट रखता है।
- source_word: אַל יָרִימוּ לָמוֹ
  choice: अपने आपको ऊँचा न उठाएँ
  rationale: אַל और अपूर्ण क्रिया निषेध प्रकट करते हैं। רום के हिफ़ील रूप और לָמוֹ से आत्मोन्नति का भाव बनता है, किंतु ‘ऊँचा उठना’ शारीरिक उठ खड़े होने और घमंड से स्वयं को ऊँचा करने—दोनों संभावित छायाओं को कुछ हद तक बनाए रखता है।
- source_word: סֶלָה
  choice: सेला
  rationale: इस प्राचीन आराधनात्मक या संगीत-संबंधी संकेत का निश्चित अर्थ अज्ञात है; इसलिए अनुमानित अनुवाद के बजाय लिप्यंतरण रखा गया है।
theological_decisions:
- issue: परमेश्वर की दृष्टि के लिए मानवरूपी भाषा
  choice: ‘उसकी आँखें राष्ट्रों पर लगी रहती हैं’ के रूप में चित्र को बनाए रखा गया
  alternative: ‘वह राष्ट्रों पर नज़र रखता है’
  rationale: इब्रानी पाठ स्पष्ट रूप से ‘उसकी आँखें’ कहता है। काव्यात्मक चित्र बनाए रखने से परमेश्वर की सजगता व्यक्त होती है, बिना यह संकेत दिए कि उसकी दृष्टि मनुष्य जैसी सीमित है।
- issue: विद्रोहियों से संबंधित निषेध का अर्थ
  choice: आत्मोन्नति की ओर संकेत करते हुए ‘अपने आपको ऊँचा न उठाएँ’
  alternative: ‘उठ खड़े न हों’ अथवा ‘अपने आपको बड़ा न समझें’
  rationale: इब्रानी वाक्य आत्म-संबंधी ऊँचा उठाने का भाव दे सकता है, पर क्रिया में उठने और स्वयं को ऊँचा करने दोनों की अर्थ-छाया है। मुख्य पाठ दोनों के निकट रहता है और पादटिप्पणी वास्तविक अस्पष्टता बताती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और काव्यात्मक रूप अपनाया गया है। पंक्ति-विभाजन इब्रानी काव्य की समानांतर संरचना को उभारता है। ‘राष्ट्रों’ व्यापक जनसमूहों को दर्शाता है, और ‘सेला’ को परंपरागत लिप्यंतरण में रखा गया है।
