lexical_decisions:
- source_word: הֲבֵאתָנוּ
  choice: तू हमें … में ले आया
  rationale: हिफ़ील रूप और प्रथम पुरुष बहुवचन प्रत्यय का अर्थ है कि संबोधित परमेश्वर ने ‘हमें भीतर पहुँचाया/ले आया’; यह चयन उसकी प्रत्यक्ष कर्तृता बनाए रखता है।
- source_word: בַמְּצוּדָה
  choice: जाल में
  rationale: מְצוּדָה पकड़ने या बंदी बनाने वाले जाल अथवा फंदे को सूचित कर सकता है; परीक्षा और जकड़े जाने के संदर्भ में ‘जाल’ स्वाभाविक है। गति-सूचक क्रिया के साथ ב को ‘में’ से व्यक्त किया गया है।
- source_word: שַׂמְתָּ
  choice: रख दिया
  rationale: שׂים का मूल अर्थ ‘रखना/स्थापित करना’ है; कमर पर बोझ रखने की देहगत छवि के लिए यह सहज हिंदी है।
- source_word: מוּעָקָה
  choice: कष्ट का बोझ
  rationale: यह शब्द दबाव, जकड़न और क्लेशकारी भार का भाव देता है। ‘कष्ट का बोझ’ पीड़ा और भार—दोनों पहलुओं को स्पष्ट रखते हुए अगले देहगत पदबंध से स्वाभाविक रूप से जुड़ता है।
- source_word: בְמָתְנֵינוּ
  choice: हमारी कमर पर
  rationale: מָתְנַיִם कमर/कटि के भाग को दर्शाता है। आधुनिक हिंदी में ‘कमर’ स्पष्ट और स्वाभाविक है तथा शरीर पर रखे बोझ की मूल छवि बनाए रखता है।
theological_decisions:
- issue: कष्ट में परमेश्वर की प्रत्यक्ष कर्तृता
  choice: 'दोनों क्रियाओं में परमेश्वर को स्पष्ट कर्ता रखा गया है: ‘तू … ले आया’ और ‘तूने … रख दिया।’'
  alternative: 'कर्तृता को नरम करके कहना: ‘हम जाल में आ गए’ या ‘हम पर कष्ट आ पड़ा।’'
  rationale: इब्रानी पाठ में दोनों क्रियाएँ स्पष्ट रूप से द्वितीय पुरुष एकवचन में हैं। अनुवाद इस कठिन धर्मवैचारिक तनाव को घटाता या परोक्ष नहीं करता।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिंदी; परमेश्वर के लिए निकट, काव्यात्मक एकवचन संबोधन ‘तू’ रखा गया है। समानांतर वाक्यरचना और शरीर पर रखे बोझ की काव्यात्मक छवि सुरक्षित हैं।
