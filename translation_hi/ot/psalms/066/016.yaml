  text: לְכֽוּ שִׁמְע֣וּ וַ֭/אֲסַפְּרָה כָּל יִרְאֵ֣י אֱלֹהִ֑ים אֲשֶׁ֖ר עָשָׂ֣ה לְ/נַפְשִֽׁ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/066/016.yaml
  text: Come and hear[a], all you who fear God, and I will tell what he has done for my soul.
translation:
  language: hi
  text: हे परमेश्वर का भय माननेवालो, तुम सब आओ और सुनो; मैं बताऊँगा कि उसने मेरे प्राण के लिए[a] क्या किया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरे जीवन के लिए।” इब्रानी נֶפֶשׁ (नेफ़ेश) का अर्थ प्रसंग के अनुसार “प्राण,” “जीवन,” या “स्वयं” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכוּ
  choice: आओ
  rationale: यद्यपि क्रिया का मूल अर्थ ‘जाओ/चलो’ है, यहाँ निमंत्रणात्मक प्रयोग में वक्ता श्रोताओं को अपने पास सुनने के लिए बुला रहा है; इसलिए ‘आओ’ स्वाभाविक और प्रसंगानुकूल है।
- source_word: שִׁמְעוּ
  choice: सुनो
  rationale: आज्ञार्थक रूप और ध्यानपूर्वक सुनने के आह्वान, दोनों को सरल और सीधी हिन्दी में व्यक्त करता है।
- source_word: וַאֲסַפְּרָה
  choice: मैं बताऊँगा
  rationale: ספר यहाँ किसी कार्य का वृत्तांत सुनाने के अर्थ में है। यह रूप वक्ता के संकल्प को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: כָּל יִרְאֵי אֱלֹהִים
  choice: हे परमेश्वर का भय माननेवालो, तुम सब
  rationale: सम्बोधन को स्पष्ट रखते हुए ‘भय’ की बाइबिलीय धारणा को बनाए रखा गया है; इसे केवल ‘आदर’ बनाकर नरम नहीं किया गया।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: यहाँ सामान्य ईश्वरीय उपाधि אֱלֹהִים है, न कि विशिष्ट नाम יהוה; हिन्दी बाइबल-शैली में ‘परमेश्वर’ इसका स्पष्ट और प्रतिष्ठित रूप है।
- source_word: אֲשֶׁר עָשָׂה
  choice: उसने ... क्या किया है
  rationale: सम्बन्धवाचक वाक्यांश को स्वाभाविक हिन्दी प्रश्नवाचक-सदृश आश्रित संरचना में रखा गया है। ‘किया है’ पूर्ण कार्य की वर्तमान प्रासंगिकता को दर्शाता है।
- source_word: לְנַפְשִׁי
  choice: मेरे प्राण के लिए
  rationale: נֶפֶשׁ के व्यक्ति, जीवन और प्राण से जुड़े व्यापक अर्थ को ‘प्राण’ कुछ सीमा तक सुरक्षित रखता है। ‘मेरे लिए’ अधिक स्वाभाविक होता, पर स्रोत की सजीव और आंतरिक अभिव्यक्ति को कम कर देता; ‘मेरे जीवन के लिए’ को पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: ‘परमेश्वर का भय मानना’ का अर्थ
  choice: परमेश्वर के प्रति श्रद्धायुक्त भय
  alternative: केवल आतंक अथवा सामान्य सम्मान
  rationale: मूल पद श्रद्धा, विस्मय और आज्ञाकारी भक्ति से युक्त भय को व्यक्त करता है। अनुवाद ‘भय’ को बनाए रखता है और उसे न तो केवल सम्मान में घटाता है, न केवल आतंक तक सीमित करता है।
- issue: נֶפֶשׁ का अनुवाद
  choice: प्राण
  alternative: जीवन; स्वयं; मेरे लिए
  rationale: ‘प्राण’ मूल शब्द के जीवन और अंतःव्यक्ति से जुड़े अर्थों को हिन्दी में अपेक्षाकृत संक्षेप में सँभालता है। ‘जीवन’ भी संभव है, इसलिए उसे पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण है। ‘हे’ से बहुवचन सम्बोधन स्पष्ट होता है, जबकि ‘तुम सब’ כָּל के व्यापक आह्वान को सामने लाता है। वाक्य-विन्यास हिन्दी में स्वाभाविक बनाने के लिए सम्बोधन को आरम्भ में रखा गया है।
