  yaml_path: translation/ot/psalms/066/020.yaml
  text: Blessed be God[b][a], who has not turned away my prayer or his steadfast love from me.
translation:
  language: hi
  text: परमेश्वर धन्य हैं,[a] जिन्होंने न तो मेरी प्रार्थना को ठुकराया, न अपना अटल प्रेम मुझसे हटाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप से: “जिन्होंने मेरी प्रार्थना और अपना अटल प्रेम मुझसे नहीं हटाया।” “अटल प्रेम” के लिए प्रयुक्त इब्रानी शब्द का अर्थ “वाचा की निष्ठा” या “निष्ठावान प्रेम” भी हो सकता है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ
  choice: धन्य हैं
  rationale: यह निष्क्रिय कृदन्त स्तुति और आशीर्वचन के उद्गार के रूप में प्रयुक्त है। ‘धन्य हैं’ आधुनिक, गरिमापूर्ण हिन्दी में इस स्तुतिपरक सूत्र को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: यहाँ इस्राएल के परमेश्वर की सीधी स्तुति है; ‘परमेश्वर’ आधुनिक हिन्दी बाइबलीय भाषा में स्पष्ट और स्वाभाविक है।
- source_word: אֲשֶׁר
  choice: जिन्होंने
  rationale: यह परमेश्वर का वर्णन करने वाला सम्बन्धवाचक उपवाक्य आरम्भ करता है। आदरसूचक बहुवचन हिन्दी में परमेश्वर के लिए स्वाभाविक है।
- source_word: לֹא הֵסִיר
  choice: न तो … ठुकराया, न … हटाई
  rationale: हिफ़ील क्रिया का मूल अर्थ ‘हटा देना/दूर कर देना’ है। एक ही क्रिया के दो कर्म हैं, पर हिन्दी में प्रार्थना के साथ ‘ठुकराना’ और करुणा के साथ ‘हटाना’ अधिक स्वाभाविक है; पदटिप्पणी शाब्दिक संरचना बताती है।
- source_word: תְּפִלָּתִי
  choice: मेरी प्रार्थना
  rationale: यह परमेश्वर से की गई विनती या प्रार्थना को सीधे व्यक्त करता है।
- source_word: וְחַסְדּוֹ
  choice: न अपनी अटल करुणा
  rationale: नकारात्मक वाक्य में וְ का आशय हिन्दी में ‘न … न …’ से स्वाभाविक रूप से व्यक्त होता है। חֶסֶד में करुणामय प्रेम, निष्ठा और स्थिरता साथ जुड़े हैं; ‘अटल करुणा’ इस व्यापकता को संक्षेप में रखती है।
- source_word: מֵאִתִּי
  choice: मुझसे
  rationale: यह वक्ता से अलग किए जाने का भाव बताता है; ‘मुझसे हटाई’ हिन्दी में दिशा और वियोग दोनों स्पष्ट करता है।
theological_decisions:
- issue: חֶסֶד का अनुवाद
  choice: अटल करुणा
  alternative: वाचा की निष्ठा; निष्ठावान प्रेम; करुणा
  rationale: חֶסֶד केवल भावना या दया तक सीमित नहीं, बल्कि स्थिर और निष्ठावान अनुग्रह का बोध कराता है। ‘अटल करुणा’ सामान्य पाठक के लिए सहज रहते हुए प्रेमपूर्ण दया और स्थायित्व दोनों रखती है; वाचागत आयाम को पदटिप्पणी में संरक्षित किया गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, स्तुतिपरक और गरिमापूर्ण है। समान इब्रानी क्रिया को हिन्दी में दोनों कर्मों के अनुरूप ‘ठुकराया/हटाई’ से व्यक्त किया गया है, जबकि पदटिप्पणी शाब्दिक समानता और חֶסֶד की अर्थ-व्याप्ति सुरक्षित रखती है।
