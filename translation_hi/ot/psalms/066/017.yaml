translation:
  language: hi
  text: 'मैंने अपने मुँह से उसे पुकारा,

    और मेरी जीभ के नीचे स्तुति थी।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्द का अर्थ ‘बड़ाई’ या ‘ऊँचा उठाना’ भी हो सकता है, अर्थात बोली गई स्तुति। “मेरी जीभ के नीचे” मूल का शाब्दिक काव्यात्मक बिंब है; इसका आशय यह हो सकता है कि स्तुति बोलने को तैयार थी।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלָיו
  choice: उसे
  rationale: पूर्वसर्ग के साथ तीसरे पुरुष एकवचन प्रत्यय का अर्थ ‘उसे/उसकी ओर’ है। संदर्भ में संकेत परमेश्वर की ओर है, पर मूल में सर्वनाम ही है।
- source_word: פִּי
  choice: अपने मुँह से
  rationale: פֶּה का ठोस अर्थ ‘मुँह’ है; हिंदी में ‘अपने मुँह से’ स्वाभाविक है और मूल बिंब बनाए रखता है।
- source_word: קָרָאתִי
  choice: मैंने ... पुकारा
  rationale: प्रार्थना के संदर्भ में קרא पुकारने या दुहाई देने का भाव रखता है। ‘पुकारा’ आग्रह को व्यक्त करता है, पर अनावश्यक तीव्रता नहीं जोड़ता।
- source_word: וְרוֹמַם
  choice: और ... बड़ाई
  rationale: यह रूप संभवतः संज्ञा है, जिसका अर्थ ‘ऊँचा उठाना/महिमा करना’, अर्थात बोली गई बड़ाई या स्तुति है। ‘बड़ाई’ רום से जुड़े ऊँचा करने के भाव को सहज हिंदी में रखती है।
- source_word: תַּחַת
  choice: नीचे
  rationale: इसका सीधा अर्थ ‘नीचे’ है। ‘जीभ के नीचे’ का काव्यात्मक बिंब वाणी के लिए तैयार शब्दों का संकेत दे सकता है।
- source_word: לְשׁוֹנִי
  choice: मेरी जीभ
  rationale: शाब्दिक अर्थ ‘मेरी जीभ’ है; इसे रखने से इब्रानी कविता का शारीरिक और सजीव बिंब सुरक्षित रहता है।
