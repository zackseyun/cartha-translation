  yaml_path: translation/ot/psalms/066/002.yaml
  text: Sing the glory of his name[a]; make his praise glorious.
translation:
  language: hi
  text: 'उसके नाम की महिमा गाओ;

    उसकी स्तुति को महिमामय बनाओ।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זַמְּרוּ
  choice: गीत गाओ
  rationale: यह זמר के बहुवचन आज्ञार्थक रूप में संगीत के साथ गाने का आह्वान है। ‘गीत गाओ’ आधुनिक हिन्दी में स्वाभाविक है और केवल बोलकर स्तुति करने की अपेक्षा संगीतमय भाव को स्पष्ट रखता है।
- source_word: כְבוֹד שְׁמוֹ
  choice: उसके नाम की महिमा
  rationale: सम्बन्धसूचक हिब्रू पदबंध को सीधे रखा गया है, ताकि ‘महिमा’ उसके ‘नाम’ से जुड़ी रहे और इसे केवल ‘महिमामय नाम’ विशेषण-पदबंध न बना दिया जाए।
- source_word: שִׂימוּ
  choice: बनाओ
  rationale: שׂים का मूल अर्थ ‘रखना/स्थापित करना’ है, पर इस पदबंध में ‘बनाओ’ हिन्दी में आज्ञा का आशय स्वाभाविक ढंग से व्यक्त करता है।
- source_word: כָבוֹד
  choice: महिमामय
  rationale: मूल में संज्ञा ‘महिमा’ है, किन्तु שִׂימוּ के साथ हिन्दी मुहावरे में विधेय विशेषण ‘महिमामय’ अधिक स्वाभाविक है और मूल शब्द की पुनरावृत्ति तथा बल को बनाए रखता है।
- source_word: תְּהִלָּתוֹ
  choice: उसकी स्तुति
  rationale: यह ‘स्तुति’ संज्ञा के साथ तृतीय पुरुष एकवचन पुल्लिंग प्रत्यय का सीधा अनुवाद है। सन्दर्भ में इसका अर्थ उसकी की जाने वाली स्तुति है, पर उस सम्बन्ध को अधिक स्पष्ट करके मूल की सम्भावित व्यापकता को सीमित नहीं किया गया।
