  text: I will come into your house with burnt offerings[a]; I will fulfill my vows to you[c][b],
translation:
  language: hi
  text: मैं होमबलियाँ लेकर तेरे भवन में आऊँगा; मैं तुझसे की हुई अपनी मन्नतें पूरी करूँगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘तेरा भवन’ सम्भवतः परमेश्वर के पवित्रस्थान या मन्दिर को दर्शाता है। ‘अपनी मन्नतें पूरी करूँगा’ का अनुवाद ‘अपनी मन्नतें चुका दूँगा’ भी हो सकता है।
    reason: cultural_note_and_lexical_alternative
lexical_decisions:
- source_word: אָבוֹא
  choice: मैं ... आऊँगा
  rationale: בוא का काल अपूर्ण, प्रथम पुरुष एकवचन रूप यहाँ भावी या संकल्पित कार्य व्यक्त करता है। ‘आऊँगा’ इसका सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: בֵיתְךָ
  choice: तेरे भवन में
  rationale: मूल अर्थ ‘तेरा घर/भवन’ है। परमेश्वर के संदर्भ में ‘भवन’ गरिमापूर्ण और स्वाभाविक है तथा मुख्य पाठ में इसे सीधे ‘मन्दिर’ बनाकर अर्थ को अनावश्यक रूप से संकीर्ण नहीं करता।
- source_word: בְעוֹלוֹת
  choice: होमबलियाँ लेकर
  rationale: עֹלָה मानक बलिदानी पद है, जिसका हिन्दी बाइबलीय समतुल्य ‘होमबलि’ है। उपसर्ग בְ यहाँ साथ होने का भाव देता है; ‘लेकर’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: אֲשַׁלֵּם
  choice: पूरी करूँगा
  rationale: שלם का पिएल रूप मन्नतों के साथ उन्हें चुकाने या पूरा करने का मुहावरा है। ‘पूरी करूँगा’ वर्तमान हिन्दी में अर्थ स्पष्ट करता है और अनावश्यक व्यापारिक ध्वनि से बचता है।
- source_word: לְךָ
  choice: तेरे सामने
  rationale: לְ प्राप्तकर्ता या सम्बद्ध व्यक्ति को सूचित करता है। मन्नत पूरी करने के धार्मिक संदर्भ में ‘तेरे सामने’ स्वाभाविक हिन्दी है, यद्यपि अधिक रूपात्मक विकल्प ‘तेरे लिए’ है।
- source_word: נְדָרָי
  choice: अपनी मन्नतें
  rationale: बहुवचन संज्ञा पर प्रथम पुरुष एकवचन प्रत्यय का सीधा अर्थ ‘मेरी मन्नतें’ है। हिन्दी वाक्य में कर्ता वही होने के कारण ‘अपनी मन्नतें’ अधिक स्वाभाविक है।
theological_decisions:
- issue: क्या ‘तेरे भवन’ को मुख्य पाठ में तकनीकी रूप से ‘तेरा मन्दिर’ या ‘तेरा पवित्रस्थान’ कहा जाए
  choice: ‘तेरे भवन’ को बनाए रखना
  alternative: ‘तेरे मन्दिर में’ या ‘तेरे पवित्रस्थान में’
  rationale: इब्रानी में सामान्य संज्ञा ‘घर/भवन’ है। होमबलियों का उल्लेख उपासना-स्थान का संदर्भ स्पष्ट करता है, पर मुख्य पाठ में ‘मन्दिर’ कहना मूल की अभिव्यक्ति को अनावश्यक रूप से सीमित करेगा।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सार्वजनिक उपासना के योग्य हिन्दी। परमेश्वर को सम्बोधन में ‘तेरे’ रखा गया है, जो भजन की निकट और प्रत्यक्ष वाणी को दर्शाता है। ‘होमबलि’ सांस्कृतिक-धार्मिक तकनीकी पद होने पर भी हिन्दी बाइबल पाठकों के लिए स्थापित और सटीक है।
