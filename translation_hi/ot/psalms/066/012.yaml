source:
  edition: WLC
  text: הִרְכַּ֥בְתָּ אֱנ֗וֹשׁ לְ/רֹ֫אשֵׁ֥/נוּ בָּֽאנוּ בָ/אֵ֥שׁ וּ/בַ/מַּ֑יִם וַ֝/תּוֹצִיאֵ֗/נוּ לָֽ/רְוָיָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/066/012.yaml
  text: You made a man ride over our heads; we went through fire and through water, yet you brought us out into abundance.
translation:
  language: hi
  text: आपने मनुष्य को हमारे सिरों पर सवार कराया; हम आग और पानी से होकर गुज़रे, फिर भी आपने हमें भरपूरी के स्थान में पहुँचाया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֱנוֹשׁ
  choice: मनुष्य
  rationale: यह एकवचन शब्द यहाँ सामान्य अथवा सामूहिक अर्थ में नश्वर मानव को सूचित कर सकता है; एकवचन ‘मनुष्य’ स्रोत की व्याकरणिक आकृति और वास्तविक अस्पष्टता दोनों बनाए रखता है।
- source_word: הִרְכַּבְתָּ
  choice: सवार कराया
  rationale: हिफ़ील कारक रूप का सीधा भाव है कि परमेश्वर ने मनुष्य को उनके सिरों पर चढ़कर जाने दिया या ऐसा कराया; ‘सवार कराया’ इस कारकता को स्पष्ट और संक्षिप्त रखता है।
- source_word: בָאנוּ בָאֵשׁ וּבַמַּיִם
  choice: हम आग और पानी से होकर गुज़रे
  rationale: शाब्दिक चित्र को स्वाभाविक हिन्दी में बनाए रखता है और संकटों की तीव्रता को बिना विस्तार जोड़े व्यक्त करता है।
- source_word: לָרְוָיָה
  choice: भरपूरी के स्थान में
  rationale: रְוָיָה तृप्ति, प्रचुरता या भरपूरी का भाव देता है; पूर्वसर्ग לָ के साथ गंतव्य का संकेत होने के कारण यह रूप अर्थ और दिशा दोनों को व्यक्त करता है।
theological_decisions:
- issue: कष्ट में परमेश्वर की सक्रिय भूमिका
  choice: ‘आपने ... सवार कराया’ के द्वारा प्रत्यक्ष कारकता बनाए रखी गई
  alternative: ‘आपने ... सवार होने दिया’
  rationale: हिब्रू का कारक क्रियारूप केवल अनुमति की अपेक्षा अधिक प्रत्यक्ष है; अनुवाद उस कठिन धार्मिक तनाव को नरम नहीं करता।
- issue: אֱנוֹשׁ का एकवचन या सामूहिक अर्थ
  choice: एकवचन ‘मनुष्य’
  alternative: बहुवचन ‘मनुष्यों’ या विशिष्ट ‘एक आदमी’
  rationale: स्रोत में व्याकरणिक एकवचन है, पर शब्द अनिश्चित/सामूहिक मानवता का अर्थ भी दे सकता है; ‘मनुष्य’ हिन्दी में दोनों संभावनाओं को खुला रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और काव्यात्मक समानांतरता वाला वाक्य। ‘हमारे सिरों पर’ और ‘आग और पानी’ के मूल चित्र सुरक्षित रखे गए हैं; कोई सांप्रदायिक व्याख्या नहीं जोड़ी गई।
