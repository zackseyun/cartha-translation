  text: All the earth will bow down to you and sing praise to you[a]; they will sing praise to your name[b]. Selah
translation:
  language: hi
  text: सारी पृथ्वी आपके सामने दण्डवत् करेगी[a] और आपका गुणगान करेगी; वह आपके नाम का गुणगान करेगी। सेला[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘आपकी आराधना करेगी।’ इब्रानी क्रिया उपासना के रूप में दण्डवत् करने को दर्शा सकती है।
    reason: lexical_alternative
  - marker: b
    text: ‘सेला’ सम्भवतः संगीत या उपासना-विधि से जुड़ा संकेत है; इसका ठीक अर्थ अनिश्चित है।
    reason: cultural_note
lexical_decisions:
- source_word: כָּל הָאָרֶץ
  choice: सारी पृथ्वी
  rationale: כָּל के साथ הָאָרֶץ यहाँ व्यापक, विश्वव्यापी अर्थ देता है; ‘पृथ्वी’ प्रसंग के वैश्विक विस्तार को बनाए रखता है।
- source_word: יִשְׁתַּחֲווּ
  choice: दण्डवत् करेगी
  rationale: यह क्रिया परमेश्वर के सामने झुकने या भूमि पर गिरकर आदर प्रकट करने की साकार मुद्रा बताती है। ‘दण्डवत् करेगी’ उपासना का भाव रखते हुए शारीरिक बिंब भी सुरक्षित रखता है।
- source_word: לְךָ
  choice: आपके सामने
  rationale: पूर्वसर्ग संबोधित व्यक्ति की ओर किए गए दण्डवत् को दर्शाता है; हिंदी में इस क्रिया के साथ ‘आपके सामने’ स्वाभाविक है।
- source_word: וִיזַמְּרוּ / יְזַמְּרוּ
  choice: गुणगान करेगी
  rationale: זמר स्तुति के प्रसंग में गाकर प्रशंसा करने का अर्थ देता है। दोनों प्रयोगों का अनुवाद एक ही पद से करके मूल की पुनरावृत्ति बनाए रखी गई है।
- source_word: שִׁמְךָ
  choice: आपके नाम
  rationale: ‘नाम’ मूल का सीधा और धर्मवैचारिक रूप से महत्त्वपूर्ण बिंब है; इसे ‘यश’ जैसे अर्थ-विस्तार से नहीं बदला गया।
- source_word: סֶלָה
  choice: सेला
  rationale: इस पारिभाषिक शब्द का ठीक अर्थ अनिश्चित है, इसलिए अनुमानित अनुवाद के बजाय लिप्यंतरण रखा गया है।
theological_decisions:
- issue: יִשְׁתַּחֲווּ को स्पष्ट उपासना-सूचक अमूर्त पद से अनूदित किया जाए या शारीरिक मुद्रा से
  choice: दण्डवत् करेगी
  alternative: आराधना करेगी
  rationale: मूल क्रिया उपासना में किए जाने वाले झुकने या भूमि पर गिरने की देहगत क्रिया व्यक्त करती है। ठोस बिंब को बनाए रखने से उपासना का भाव निहित रहता है और पाठ को आवश्यकता से अधिक अमूर्त नहीं बनाया जाता।
translation_notes:
  register: आधुनिक मानक हिंदी में आदरार्थी एकवचन ‘आप’ रखा गया है। भाषा सहज और गरिमापूर्ण है। ‘सारी पृथ्वी’ व्याकरणतः एकवचन होने के कारण आगे ‘करेगी’ और ‘वह’ का प्रयोग किया गया है; मूल की समानांतर पुनरावृत्ति ‘गुणगान करेगी’ दोहराकर सुरक्षित रखी गई है।
