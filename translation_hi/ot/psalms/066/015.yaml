source:
  edition: WLC
  text: עֹ֘ל֤וֹת מֵחִ֣ים אַעֲלֶה לָּ֭/ךְ עִם קְטֹ֣רֶת אֵילִ֑ים אֶ֥עֱשֶֽׂה בָקָ֖ר עִם עַתּוּדִ֣ים סֶֽלָה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/066/015.yaml
  text: I will offer to you burnt offerings of fattened animals[a], with the smoke of rams; I will prepare cattle and goats[d][c][b]. Selah
translation:
  language: hi
  text: 'मैं तेरे लिए हृष्ट-पुष्ट पशुओं की होमबलियाँ चढ़ाऊँगा,

    मेढ़ों के धुएँ[a] के साथ;

    मैं गाय-बैल और बकरे[b] अर्पित करूँगा।

    सेला।[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘मेढ़ों की सुगंध के साथ’; इब्रानी शब्द जलती हुई बलि से उठने वाले धुएँ या उसकी गंध को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: अर्थात नर बकरे।
    reason: lexical_clarification
  - marker: c
    text: ‘सेला’ का ठीक अर्थ अज्ञात है; सम्भवतः यह कोई संगीतात्मक या उपासना-संबंधी संकेत था।
    reason: cultural_note
lexical_decisions:
- source_word: עֹלוֹת
  choice: होमबलियाँ
  rationale: यह उन बलियों के लिए प्रचलित और संक्षिप्त हिन्दी पद है जो वेदी पर पूरी तरह जलाई जाती थीं।
- source_word: מֵחִים
  choice: हृष्ट-पुष्ट पशु
  rationale: यह शब्द बलि के लिए पाले-पोसे, मोटे पशुओं को दर्शाता है; ‘हृष्ट-पुष्ट’ आधुनिक हिन्दी में स्वाभाविक और गरिमापूर्ण है।
- source_word: אַעֲלֶה לָךְ
  choice: तेरे लिए ... चढ़ाऊँगा
  rationale: सामान्य अर्थ ‘ऊपर चढ़ाना’ है, पर यहाँ बलि-संबंधी प्रयोग में ‘चढ़ाना’ उपयुक्त है और परमेश्वर को किया गया सीधा संबोधन भी बनाए रखता है।
- source_word: עִם קְטֹרֶת אֵילִים
  choice: मेढ़ों के धुएँ के साथ
  rationale: קְטֹרֶת यहाँ जलती बलि से उठने वाले धुएँ को सूचित कर सकता है; ‘धूप’ कहने से अलग धूप-सामग्री का भ्रामक अर्थ निकल सकता है। गंध/सुगंध की सम्भावना पादटिप्पणी में रखी गई है।
- source_word: אֶעֱשֶׂה
  choice: अर्पित करूँगा
  rationale: क्रिया का मूल अर्थ ‘करना/बनाना’ है, किंतु बलि के प्रसंग में यह बलि तैयार करने या चढ़ाने का मुहावरेदार अर्थ देती है; ‘अर्पित करूँगा’ हिन्दी में आशय स्पष्ट करता है।
- source_word: בָקָר
  choice: गाय-बैल
  rationale: एकवचन सामूहिक संज्ञा गोपशुओं को सामान्य रूप से दर्शाती है; ‘गाय-बैल’ किसी एक लिंग को अनावश्यक रूप से निश्चित किए बिना सहज हिन्दी देता है।
- source_word: עַתּוּדִים
  choice: बकरे
  rationale: यह शब्द विशेष रूप से नर बकरों को दर्शाता है; हिन्दी ‘बकरे’ उस लिंग-विशिष्ट अर्थ को मुख्य पाठ में ही स्वाभाविक ढंग से व्यक्त करता है।
- source_word: סֶלָה
  choice: सेला
  rationale: इस संगीतात्मक या उपासना-संबंधी संकेत का ठीक अर्थ अनिश्चित है, इसलिए इसका लिप्यंतरण किया गया है।
