  text: אִמְר֣וּ לֵ֭/אלֹהִים מַה נּוֹרָ֣א מַעֲשֶׂ֑י/ךָ בְּ/רֹ֥ב עֻ֝זְּ/ךָ֗ יְֽכַחֲשׁ֖וּ לְ/ךָ֣ אֹיְבֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/066/003.yaml
  text: Say to God[a], “How awesome are your works! Because of the greatness of your strength, your enemies cringe before you.”
translation:
  language: hi
  text: परमेश्वर से कहो, “आपके काम कितने विस्मयकारी हैं! आपके महान सामर्थ्य के कारण आपके शत्रु आपके सामने झूठी अधीनता दिखाते हैं।[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “आपके सामने विवश होकर अधीन होते हैं।” इब्रानी क्रिया कपटपूर्ण अथवा दबाव में की गई अधीनता का भाव दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אִמְרוּ
  choice: कहो
  rationale: यह אמר का बहुवचन आज्ञार्थक रूप है, जो आराधक समुदाय को संबोधित करता है; ‘कहो’ आधुनिक हिन्दी में सीधा और स्वाभाविक है।
- source_word: לֵאלֹהִים
  choice: परमेश्वर से
  rationale: לְ यहाँ कथन के संबोधन को चिह्नित करता है; हिन्दी में ‘परमेश्वर से कहो’ स्वाभाविक प्रयोग है।
- source_word: מַה נּוֹרָא
  choice: कितने विस्मयकारी
  rationale: מַה के साथ נוֹרָא विस्मयपूर्ण उद्गार है। ‘विस्मयकारी’ श्रद्धामिश्रित भय और आश्चर्य का भाव रखता है, बिना केवल आतंक का अर्थ देने के।
- source_word: מַעֲשֶׂיךָ
  choice: आपके काम
  rationale: מַעֲשֶׂה कार्य या किए हुए काम को दर्शाता है; ‘काम’ सामान्य आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: בְּרֹב עֻזֶּךָ
  choice: आपके महान सामर्थ्य के कारण
  rationale: בְּ को यहाँ कारणसूचक समझा गया है; רֹב परिमाण या महानता और עֹז प्रबल सामर्थ्य को व्यक्त करता है।
- source_word: יְכַחֲשׁוּ לְךָ
  choice: आपके सामने झूठी अधीनता दिखाते हैं
  rationale: כחש का पिएल रूप לְ के साथ दबाव में की गई कपटपूर्ण या अनिच्छुक अधीनता बता सकता है। यह अनुवाद क्रिया के छल और विवश समर्पण—दोनों संकेतों को यथासंभव बनाए रखता है।
- source_word: אֹיְבֶיךָ
  choice: आपके शत्रु
  rationale: यह אויב का बहुवचन रूप है, जिस पर द्वितीय पुरुष एकवचन प्रत्यय लगा है; ‘आपके शत्रु’ इसका मानक हिन्दी रूप है।
theological_decisions:
- issue: परमेश्वर के प्रति शत्रुओं की प्रतिक्रिया का स्वरूप
  choice: इसे दबाव में दिखाई गई झूठी अधीनता के रूप में व्यक्त किया गया है।
  alternative: ‘आपके सामने झुक जाते हैं’ या ‘अनिच्छा से आपके अधीन होते हैं।’
  rationale: כחש प्रायः झुठलाने, छल करने अथवा विवश होकर अधीनता जताने का भाव रखता है। इसलिए केवल निष्कपट समर्पण कहना मूल की नकारात्मक अस्पष्टता को मिटा देता; पादटिप्पणी संभावित विवशता का पक्ष भी सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में परमेश्वर के लिए आदरसूचक ‘आप’ रखा गया है। भाषा काव्यात्मक और गरिमापूर्ण है, पर सामान्य पाठक के लिए सहज बनी रहती है।
