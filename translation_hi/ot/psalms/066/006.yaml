source:
  edition: WLC
  text: הָ֤פַךְ יָ֨ם לְֽ/יַבָּשָׁ֗ה בַּ֭/נָּהָר יַֽעַבְר֣וּ בְ/רָ֑גֶל שָׁ֝֗ם נִשְׂמְחָה בּֽ/וֹ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/066/006.yaml
  text: He turned the sea into dry land[a]; they passed through the river on foot[b]; there we rejoiced in him.
translation:
  language: hi
  text: उसने समुद्र को सूखी भूमि में बदल दिया; वे नदी में से पैदल पार हुए[b]; वहाँ हम उसमें आनन्दित हुए[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वहाँ हम उसमें आनन्दित हों।” इब्रानी क्रिया-रूप को बीती हुई घटना के कथन के बजाय एक आह्वान के रूप में भी समझा जा सकता है।
    reason: alternative_reading
  - marker: b
    text: यह पद सम्भवतः निर्गमन के समय समुद्र पार करने और प्रतिज्ञात देश में प्रवेश करते समय यरदन नदी पार करने—दोनों घटनाओं को स्मरण कराता है।
    reason: cross_reference
lexical_decisions:
- source_word: הָפַךְ
  choice: बदल दिया
  rationale: क्रिया किसी वस्तु की दशा बदल देने का अर्थ रखती है; यहाँ समुद्र के सूखी भूमि बन जाने को स्वाभाविक हिन्दी में व्यक्त करती है।
- source_word: יָם
  choice: समुद्र
  rationale: मूल शब्द का सामान्य अर्थ ‘समुद्र’ है। निर्गमन की घटना का संकेत संदर्भ से मिलता है, इसलिए पाठ में किसी विशिष्ट नाम को नहीं जोड़ा गया।
- source_word: לְיַבָּשָׁה
  choice: सूखी भूमि में
  rationale: यह संज्ञा सूखी भूमि या सूखी धरती को दर्शाती है; पूर्वसर्ग के साथ यह बदली हुई दशा को व्यक्त करती है।
- source_word: בַּנָּהָר
  choice: नदी में से
  rationale: पूर्वसर्ग का मूल भाव ‘नदी में/नदी के भीतर’ है; पार जाने की क्रिया के साथ ‘नदी में से’ स्वाभाविक हिन्दी है और नदी पार करने का दृश्य बनाए रखता है।
- source_word: יַעַבְרוּ
  choice: पार हुए
  rationale: क्रिया का अर्थ पार जाना या होकर निकलना है; ‘पार हुए’ संक्षिप्त और प्रसंगानुकूल है।
- source_word: בְרָגֶל
  choice: पैदल
  rationale: यह हिन्दी में ‘पाँव से’ का स्वाभाविक मुहावरेदार रूप है और बिना नाव के भूमि पर चलकर पार होने का भाव देता है।
- source_word: שָׁם
  choice: वहाँ
  rationale: स्थान-सूचक क्रियाविशेषण को सीधे रखा गया है; यह उस ऐतिहासिक स्थल या उद्धार की घटना की ओर संकेत कर सकता है।
- source_word: נִשְׂמְחָה
  choice: हम आनन्दित हुए
  rationale: रूप को प्रसंग में समुदाय की पिछली घटना से सहभागिता व्यक्त करने वाला कथन समझा गया है। इसकी विधिलिंग-सदृश सम्भावना ‘आओ, हम आनन्दित हों’ पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: בּוֹ
  choice: उसमें
  rationale: पुल्लिंग एकवचन सर्वनाम को निकट-औपचारिक रूप से रखा गया है। प्रसंग में इसका सबसे सम्भावित संकेत परमेश्वर की ओर है, जबकि अनुवाद अनावश्यक रूप से ‘परमेश्वर’ जोड़कर संकेत को स्पष्ट नहीं करता।
theological_decisions:
- issue: ऐतिहासिक संकेत और सामुदायिक सहभागिता
  choice: समुद्र और नदी पार करने को परमेश्वर के प्राचीन उद्धार-कार्यों की स्मृति मानते हुए अन्तिम वाक्य को ‘हम उसमें आनन्दित हुए’ रखा गया है।
  alternative: अन्तिम वाक्य को आह्वान के रूप में ‘वहाँ आओ, हम उसमें आनन्दित हों’ समझा जा सकता है।
  rationale: भजन परमेश्वर के सामर्थ्यपूर्ण कार्यों का वर्णन करते हुए वर्तमान आराधक समुदाय को उन घटनाओं से जोड़ता है। कथनात्मक अनुवाद उस सामुदायिक पहचान को व्यक्त करता है, और इब्रानी रूप की वास्तविक व्याकरणिक अस्पष्टता पादटिप्पणी में दी गई है।
- issue: בּוֹ सर्वनाम का संकेत
  choice: ‘उसमें’ रखा गया है, जिसका प्रसंगगत संकेत परमेश्वर की ओर है।
  alternative: इसे घटना या स्थान की ओर संकेत करने वाला ‘उसमें’ भी समझा जा सकता है।
  rationale: पुल्लिंग एकवचन रूप और भजन का परमेश्वर-केंद्रित प्रसंग व्यक्तिगत संकेत का समर्थन करते हैं, पर मूल पाठ से अधिक स्पष्ट संज्ञा जोड़ना उचित नहीं है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘सूखी भूमि’, ‘नदी में से पैदल पार हुए’ और ‘आनन्दित हुए’ जैसे रूप मूल बिम्ब और काव्यात्मक लय को बनाए रखते हैं। मुख्य पाठ में व्याख्यात्मक रूप से ‘लाल समुद्र’ या ‘यरदन’ नहीं जोड़ा गया; ऐतिहासिक संकेत पादटिप्पणी में दिया गया है।
