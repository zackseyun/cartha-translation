  text: Bless our God[a], O peoples[b], and make the sound of his praise heard.
translation:
  language: hi
  text: 'हे सभी लोगों, हमारे परमेश्वर को धन्य कहो,

    और उसकी स्तुति का स्वर[a] सुनाओ।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसके लिए स्तुति का स्वर।”
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרְכוּ
  choice: धन्य कहो
  rationale: परमेश्वर को सम्बोधित בּרך के आदेशात्मक अर्थ को सुरक्षित रखता है। केवल ‘स्तुति करो’ कहने से मूल क्रिया और अगली पंक्ति की ‘स्तुति’ के बीच का भेद मिट जाता।
- source_word: עַמִּים
  choice: हे सभी जातियों के लोगो
  rationale: बहुवचन सम्बोधन को सामूहिक मानव-समुदायों के रूप में व्यक्त करता है। ‘राष्ट्रो’ राजनीतिक अर्थ को अनावश्यक रूप से प्रमुख कर सकता था।
- source_word: אֱלֹהֵינוּ
  choice: हमारे परमेश्वर
  rationale: प्रथम पुरुष बहुवचन प्रत्यय सहित सीधा और स्वाभाविक अनुवाद।
- source_word: וְהַשְׁמִיעוּ
  choice: सुनाओ
  rationale: שׁמע के हिफ़ील आदेश की कारक शक्ति—‘सुनाई देने योग्य बनाओ’—को संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: קוֹל
  choice: स्वर
  rationale: यहाँ स्तुति की सुनाई देने वाली अभिव्यक्ति के लिए ‘स्वर’ गरिमापूर्ण और स्वाभाविक है; ‘आवाज़’ भी सम्भव है।
- source_word: תְּהִלָּתוֹ
  choice: उसकी स्तुति
  rationale: तीसरे पुरुष एकवचन प्रत्यय को औपचारिक रूप से सुरक्षित रखता है और स्तुति के परमेश्वर से सम्बन्ध को अनावश्यक रूप से नहीं सुलझाता।
theological_decisions:
- issue: תְּהִלָּתוֹ में प्रत्यय का सम्बन्ध
  choice: उसकी स्तुति
  alternative: उसके लिए स्तुति
  rationale: इब्रानी प्रत्यय को सीधे ‘उसकी’ के रूप में रखना सबसे निकट है, जबकि सन्दर्भ में परमेश्वर के लिए की जाने वाली स्तुति का अर्थ भी सम्भव है; इस विकल्प को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में काव्यात्मक किन्तु सहज शैली रखी गई है। ‘धन्य कहो’ बाइबलीय मुहावरे को स्पष्ट करता है, और ‘सुनाओ’ मूल कारक आदेश को स्वाभाविक हिन्दी में बनाए रखता है।
