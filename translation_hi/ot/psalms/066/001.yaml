lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: संगीत-निर्देशक के लिए
  rationale: यह शीर्षक संगीत-प्रस्तुति का नेतृत्व या निरीक्षण करने वाले व्यक्ति की ओर संकेत करता है। यह आधुनिक हिन्दी में स्पष्ट है और पद के उपासना-संगीत संबंधी कार्य को सुरक्षित रखता है।
- source_word: שִׁיר
  choice: एक गीत
  rationale: यह विधा-सूचक शब्द का सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: מִזְמוֹר
  choice: एक भजन
  rationale: तकनीकी भजन-संग्रह संबंधी शब्द का प्रचलित हिन्दी अनुवाद। ‘गीत’ और ‘भजन’ दोनों रखकर इब्रानी के दोहरे विधा-वर्णन को सुरक्षित रखा गया है।
- source_word: הָרִיעוּ
  choice: जयजयकार करो
  rationale: क्रिया ऊँची, प्रायः उल्लासपूर्ण या विजयपूर्ण पुकार उठाने को व्यक्त करती है। ‘जयजयकार करो’ हिन्दी में इस सार्वजनिक और प्रबल उद्घोष को स्वाभाविक रूप से संप्रेषित करता है।
- source_word: לֵאלֹהִים
  choice: परमेश्वर के लिए
  rationale: पूर्वसर्ग उद्घोष के प्राप्तकर्ता को चिह्नित करता है; चुना हुआ रूप उस दिशा को बनाए रखता है।
- source_word: כָּל הָאָרֶץ
  choice: हे सारी पृथ्वी
  rationale: स्तुति के इस संदर्भ में संबोधन सार्वभौमिक है; ‘पृथ्वी’ किसी सीमित भूभाग की अपेक्षा व्यापक अर्थ को सुरक्षित रखती है।
theological_decisions:
- issue: כָּל הָאָרֶץ में आह्वान का विस्तार
  choice: सारी पृथ्वी के लिए सार्वभौमिक आह्वान
  alternative: पूरे देश या समस्त भूभाग को संबोधन
  rationale: भजन की स्तुति-भाषा व्यापक संबोधन का समर्थन करती है। ‘पृथ्वी’ पाठ के दायरे को बिना अतिरिक्त धर्मवैज्ञानिक निष्कर्ष जोड़े सुरक्षित रखती है।
