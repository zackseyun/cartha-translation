lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: संगीत-निर्देशक के लिए
  rationale: यह पद भजन के संगीत-प्रदर्शन से जुड़े प्रधान व्यक्ति के लिए निर्देश सूचित करता है; यह आधुनिक हिन्दी में स्वाभाविक और मूल की भूमिका के पर्याप्त निकट है।
- source_word: שִׁיר מִזְמוֹר
  choice: एक गीत, एक भजन
  rationale: दोनों निकटार्थी संज्ञाओं को अलग-अलग रखा गया है, ताकि मूल की युग्म अभिव्यक्ति बनी रहे।
- source_word: הָרִיעוּ
  choice: जयजयकार करो
  rationale: इस आज्ञार्थक क्रिया में ऊँचे स्वर से जयध्वनि करने का भाव है; ‘जयजयकार करो’ हिन्दी में उसी सार्वजनिक, उत्साहपूर्ण पुकार को सहज रूप से व्यक्त करता है।
- source_word: כָּל־הָאָרֶץ
  choice: सारी पृथ्वी
  rationale: यह संबोधन समस्त पृथ्वी अथवा उसके निवासियों की व्यापकता व्यक्त करता है; ‘सारी पृथ्वी’ काव्यात्मक रूप से मूल की व्यापकता और संभावित व्यक्तिकरण बनाए रखता है।
theological_decisions:
- issue: ‘सारी पृथ्वी’ का आशय भूमि है या उसके निवासी
  choice: सारी पृथ्वी
  alternative: पृथ्वी के सभी निवासियो
  rationale: मूल सीधे ‘सारी पृथ्वी’ को संबोधित करता है। निवासियों को स्पष्ट कर देना अर्थ को समझाता, पर मूल के काव्यात्मक व्यक्तिकरण को सीमित कर देता।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सार्वजनिक उपासना के अनुकूल शैली रखी गई है। शीर्षक और मुख्य आज्ञा को अलग पंक्तियों में रखा गया है; किसी विशिष्ट सांप्रदायिक शब्दावली को नहीं अपनाया गया।
