source:
  edition: WLC
  text: לְכ֣וּ וּ֭/רְאוּ מִפְעֲל֣וֹת אֱלֹהִ֑ים נוֹרָ֥א עֲ֝לִילָ֗ה עַל בְּנֵ֥י אָדָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/066/005.yaml
  text: Come and see the works of God[a]; he is awesome in his deeds toward the children of man.
translation:
  language: hi
  text: आओ और परमेश्वर के कामों को देखो; वह मनुष्यों[a] के प्रति अपने कार्यों में विस्मयकारी है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “आदम के पुत्रों” या “मनुष्य के पुत्रों।” यह इब्रानी अभिव्यक्ति यहाँ समस्त मानवजाति को दर्शाती है।
    reason: इब्रानी मुहावरे के शाब्दिक रूप और उसके सामूहिक अर्थ को सुरक्षित रखना।
lexical_decisions:
- source_word: לְכוּ
  choice: आओ
  rationale: बहुवचन आज्ञार्थक रूप यहाँ देखने के निमंत्रण के रूप में प्रयुक्त है; आधुनिक हिन्दी में ‘आओ’ स्वाभाविक है।
- source_word: וּרְאוּ
  choice: और ... देखो
  rationale: यह बहुवचन आज्ञार्थक रूप प्रत्यक्ष रूप से परमेश्वर के कामों पर ध्यान देने का आह्वान करता है।
- source_word: מִפְעֲלוֹת
  choice: कामों
  rationale: यह बहुवचन संज्ञा परमेश्वर के किए हुए कामों को दर्शाती है और सामान्य पाठक के लिए सहज है।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: सन्दर्भ में इस्राएल के परमेश्वर का उल्लेख है; हिन्दी बाइबलीय शैली में ‘परमेश्वर’ स्पष्ट और प्रतिष्ठित रूप है।
- source_word: נוֹרָא
  choice: विस्मयकारी
  rationale: यह शब्द भय-मिश्रित श्रद्धा और विस्मय उत्पन्न करने का भाव रखता है; ‘विस्मयकारी’ केवल आतंक का अर्थ आरोपित किए बिना उस भाव को व्यक्त करता है।
- source_word: עֲלִילָה
  choice: कार्यों
  rationale: यह परमेश्वर की क्रियाशीलता अथवा किए हुए कार्य को दर्शाता है; ‘कार्यों’ स्वाभाविक हिन्दी देता है और पहले आए ‘कामों’ से हल्का शब्दगत भेद भी रखता है।
- source_word: עַל
  choice: के प्रति
  rationale: यह मनुष्यों को परमेश्वर के कार्य की दिशा अथवा विषय के रूप में रखता है और कार्य को केवल अनुकूल या प्रतिकूल बताकर अर्थ सीमित नहीं करता।
- source_word: בְּנֵי אָדָם
  choice: मनुष्यों
  rationale: यह इब्रानी मुहावरा समस्त मानवजाति को सूचित करता है; मुख्य पाठ में ‘मनुष्यों’ से इसका स्वाभाविक सामूहिक अर्थ स्पष्ट होता है, जबकि शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: בְּנֵי אָדָם में אָדָם का सामान्य मानव-सन्दर्भ
  choice: मनुष्यों
  alternative: आदम की सन्तानों / मनुष्य की सन्तानों
  rationale: यह पद किसी एक लिंग या केवल आदम के जैविक पुत्रों तक सीमित नहीं, बल्कि मानवजाति के लिए प्रचलित इब्रानी अभिव्यक्ति है। स्वाभाविक हिन्दी मुख्य पाठ में दी गई है और स्रोत की ठोस अभिव्यक्ति पादटिप्पणी में रखी गई है।
- issue: נוֹרָא का भय और विस्मय के बीच अर्थ
  choice: विस्मयकारी
  alternative: भयावह / भय उत्पन्न करनेवाला
  rationale: सन्दर्भ परमेश्वर के सामर्थी कार्यों को देखने का आह्वान करता है। ‘विस्मयकारी’ श्रद्धामिश्रित भय की सम्भावना बनाए रखता है, पर इसे केवल आतंक के अर्थ में सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘आओ और ... देखो’ सार्वजनिक निमंत्रण की शैली बनाए रखता है। दूसरे खंड में ‘अपने कार्यों में वह विस्मयकारी है’ मूल के विधेयात्मक बल को बनाए रखता है, और ‘के प्रति’ परमेश्वर के कार्य को अनावश्यक रूप से केवल अनुकूल या प्रतिकूल नहीं ठहराता।
