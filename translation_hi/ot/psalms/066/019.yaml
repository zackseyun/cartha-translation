lexical_decisions:
- source_word: אָכֵן
  choice: निश्चय ही
  rationale: यह निश्चय और पुष्टि पर बल देता है; आधुनिक हिन्दी में ‘निश्चय ही’ इसका स्वाभाविक और गरिमापूर्ण रूप है।
- source_word: שָׁמַע
  choice: सुन लिया है
  rationale: पूर्ण क्रिया को सम्पन्न कार्य और वर्तमान प्रासंगिकता के साथ व्यक्त करता है। मूल में कर्म स्पष्ट रूप से नहीं दिया गया है, इसलिए हिन्दी में भी उसे जोड़े बिना रखा गया है।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: एकवचन क्रिया के साथ यहाँ इस्राएल के एक परमेश्वर का सामान्य हिन्दी बाइबलीय पद है।
- source_word: הִקְשִׁיב
  choice: ध्यान दिया है
  rationale: हिफ़ील रूप केवल सुनने के बजाय ध्यानपूर्वक कान लगाने का भाव देता है।
- source_word: בְּקוֹל
  choice: आवाज़ पर
  rationale: पूर्वसर्ग בְּ और קוֹל के ‘आवाज़/स्वर’ अर्थ को निकटता से रखता है और ‘ध्यान देना’ के साथ स्वाभाविक हिन्दी बनाता है।
- source_word: תְּפִלָּתִי
  choice: मेरी प्रार्थना की
  rationale: प्रथम पुरुष एकवचन संबंधसूचक प्रत्यय सहित संज्ञा का सीधा और स्पष्ट अनुवाद है।
