translation:
  language: hi
  text: 'जिन्हें मेरे होंठों ने उच्चारा था,[a]

    और जब मुझ पर संकट था तब मेरे मुँह ने कहा था।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, ‘जिन्हें मेरे होंठों ने खोला था।’ इब्रानी मुहावरे में इसका अर्थ बोलकर शब्द कहना या उच्चारना है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  choice: जिन्हें
  rationale: यह पिछले पद की मन्नतों की ओर संकेत करने वाला संबंधवाचक शब्द है; हिंदी में स्त्रीलिंग बहुवचन संबंध बनाए रखने के लिए ‘जिन्हें’ स्वाभाविक है।
- source_word: פָּצוּ
  choice: कहा था
  rationale: פצה का शाब्दिक अर्थ होंठ ‘खोलना’ है, पर यहाँ बोलकर मन्नत व्यक्त करने का मुहावरा है। ‘कहा था’ अर्थ को सहज आधुनिक हिंदी में व्यक्त करता है।
- source_word: שְׂפָתַי
  choice: मेरे होंठों
  rationale: मूल का काव्यात्मक अंग-सूचक रूप बनाए रखा गया है और यह ‘मेरे मुँह’ के साथ समानांतरता सुरक्षित रखता है।
- source_word: וְדִבֶּר
  choice: और ... बोला था
  rationale: דבר का सामान्य अर्थ ‘बोलना’ है; यह पहले चरण के ‘कहा था’ के साथ अर्थगत समानांतरता रखता है।
- source_word: פִּי
  choice: मेरे मुँह ने
  rationale: शाब्दिक अंग-सूचक अभिव्यक्ति काव्य की ‘होंठों/मुँह’ समानांतर संरचना को बनाए रखती है।
- source_word: בַּצַּר לִי
  choice: संकट के समय
  rationale: यह वक्ता पर आए संकट की परिस्थिति और समय दोनों को व्यक्त करता है; हिंदी में ‘संकट के समय’ संक्षिप्त और स्वाभाविक है।
