lexical_decisions:
- source_word: שַׁתַּנִי
  choice: तूने मुझे ... डाल दिया है
  rationale: क्रिया का अर्थ ‘रखना/स्थापित करना’ है; गड्ढे के संदर्भ में ‘डाल दिया है’ स्वाभाविक है और परमेश्वर को सीधे कर्ता बताने वाली विलाप की तीव्रता बनाए रखता है।
- source_word: בְּבוֹר תַּחְתִּיּוֹת
  choice: सबसे गहरे गड्ढे में
  rationale: בּוֹר को बिना अनावश्यक व्याख्या के ‘गड्ढा’ और תַּחְתִּיּוֹת के अधोतम स्थान के भाव को ‘सबसे गहरे’ से व्यक्त किया गया है।
- source_word: בְּמַחֲשַׁכִּים
  choice: अँधेरी जगहों में
  rationale: इब्रानी बहुवचन में अँधेरे स्थानों का चित्र है; ‘अँधेरी जगहों’ से उसकी बहुवचनात्मक और स्थानवाचक छवि बनी रहती है।
- source_word: בִּמְצֹלוֹת
  choice: अथाह गहराइयों में
  rationale: यह शब्द गहरे स्थानों, विशेषतः जल की गहराइयों, का बोध करा सकता है; ‘अथाह गहराइयाँ’ विनाशकारी गहनता की काव्यात्मक छवि को स्वाभाविक हिन्दी में रखता है।
theological_decisions:
- issue: विलाप में परमेश्वर की प्रत्यक्ष कर्तृता
  choice: 'द्वितीय पुरुष को बनाए रखा गया: ‘तूने मुझे ... डाल दिया है’'
  alternative: 'कर्तृता को अस्पष्ट या अवैयक्तिक करना: ‘मुझे ... डाल दिया गया है’'
  rationale: इब्रानी पाठ परमेश्वर को सीधे संबोधित करके उसी को कर्ता बताता है। अनुवाद विलाप के इस धर्मवैचारिक तनाव को कम नहीं करता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और काव्यात्मक हिन्दी। परमेश्वर के लिए ‘तू’ भजन की सीधी, घनिष्ठ संबोधन-शैली को व्यक्त करता है। डैश तीन समानांतर स्थान-चित्रों को स्पष्ट रूप से जोड़ता है।
