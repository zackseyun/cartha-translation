translation:
  language: hi
  text: 'एक गीत। कोरह के पुत्रों का भजन। संगीत-निर्देशक के लिए: महलत लअन्नोत[a] के अनुसार। एज्राही हेमान का मस्कील[b]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '“महलत लअन्नोत” का अर्थ अनिश्चित है। यह किसी धुन या संगीत-शैली का नाम हो सकता है। अन्य संभावित अर्थ हैं: “महलत के अनुसार, प्रतिउत्तर में गाने के लिए” या “महलत के अनुसार, दुःख के विषय में।”'
    reason: lexical_alternative
  - marker: b
    text: “मस्कील” भजनों के शीर्षकों में प्रयुक्त एक तकनीकी शब्द है; इसे प्रायः शिक्षाप्रद या मननशील रचना समझा जाता है।
    reason: lexical_alternative
