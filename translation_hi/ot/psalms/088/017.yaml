  text: वे दिन भर पानी की तरह मुझे घेरे रहे; सब मिलकर उन्होंने मुझे चारों ओर से घेर लिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: סַבּוּנִי
  choice: मुझे घेरे रहे
  rationale: סבב के कालगत रूप का प्रसंगानुकूल दुर्गामी भाव व्यक्त करता है और शत्रुतापूर्ण घेराव की छवि बनाए रखता है।
- source_word: כַמַּיִם
  choice: जल के समान
  rationale: उपसर्ग כ की तुलना को स्पष्ट रखता है; ‘जल’ गरिमापूर्ण और सहज हिन्दी में चारों ओर से उमड़कर घेर लेने की छवि देता है।
- source_word: כָּל הַיּוֹם
  choice: दिन भर
  rationale: पूरे दिन जारी रहने की अवधि को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: הִקִּיפוּ
  choice: मेरे चारों ओर आ गए
  rationale: पहले क्रियापद के समानार्थी समानांतर को अनावश्यक शब्दशः पुनरावृत्ति के बिना व्यक्त करता है और कसते हुए घेराव का भाव बनाए रखता है।
- source_word: עָלַי
  choice: मेरे चारों ओर
  rationale: इस क्रिया-संयोग और शत्रुतापूर्ण प्रसंग में वक्ता को चारों ओर से घेर लेने का स्वाभाविक हिन्दी रूप है।
- source_word: יָחַד
  choice: सब मिलकर
  rationale: धमकियों के संयुक्त रूप से, एक साथ कार्य करने का भाव स्पष्ट करता है।
