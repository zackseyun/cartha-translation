  yaml_path: translation/ot/psalms/088/007.yaml
  text: Your wrath has rested on me[a], and with all your breakers you have afflicted me. Selah
translation:
  language: hi
  text: 'तेरा प्रकोप मुझ पर आ टिका है,


    और तेरी सारी प्रचंड लहरों[a] से तूने मुझे पीड़ित किया है।


    सेला।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘लहरों’ या ‘समुद्री तरंगों’। इब्रानी शब्द का विशेष संकेत टूटकर चढ़ने वाली समुद्री लहरों की ओर है।
    reason: शाब्दिक_वैकल्पिक
lexical_decisions:
- source_word: סָמְכָה
  choice: आ टिका है
  rationale: क्रिया में सहारा लेने, झुकने या किसी पर टिकने का स्थानिक बिंब है। प्रकोप के कर्ता होने और ‘मुझ पर’ के साथ ‘आ टिका है’ इस बिंब और उसके भारी प्रभाव को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: חֲמָתֶךָ
  choice: तेरा प्रकोप
  rationale: यह शब्द क्रोध, उग्रता या कोप को व्यक्त करता है। ‘प्रकोप’ भजन के विलाप और न्याय-संदर्भ में गंभीर, स्पष्ट और वर्तमान हिन्दी में सहज है।
- source_word: מִשְׁבָּרֶיךָ
  choice: अपनी सब प्रचंड लहरों
  rationale: संज्ञा विशेष रूप से टूटकर चढ़ने वाली समुद्री लहरों को सूचित करती है। हिन्दी में ‘प्रचंड लहरें’ उस समुद्री आघात को स्वाभाविक ढंग से व्यक्त करती हैं; केवल ‘लहरें’ कहने से उसकी टूट पड़ने वाली शक्ति कुछ मंद हो सकती है।
- source_word: עִנִּיתָ
  choice: तूने मुझे पीड़ित किया है
  rationale: पिअल रूप यहाँ दुःख देने, दीन करने या सताने का अर्थ देता है। ‘पीड़ित किया है’ प्रसंगानुकूल व्यापकता रखता है और इसे केवल सामाजिक उत्पीड़न तक सीमित नहीं करता।
- source_word: וְכָל
  choice: और अपनी सब
  rationale: संयोजक और ‘सब’ दूसरी पंक्ति को पहली से जोड़ते हुए लहरों की समग्रता पर बल देते हैं। विभक्ति ‘से’ के साथ यह हिन्दी में साधन का भाव स्पष्ट करता है।
- source_word: סֶלָה
  choice: सेला
  rationale: इस उपासना-संबंधी संकेत का ठीक अर्थ अनिश्चित है, इसलिए अर्थ आरोपित करने के बजाय देवनागरी में लिप्यंतरण किया गया है।
theological_decisions:
- issue: ईश्वरीय क्रोध और दुःख में परमेश्वर की प्रत्यक्ष भूमिका
  choice: भजनकार सीधे परमेश्वर से कहता है कि उसका प्रकोप उस पर आ टिका है और उसी ने अपनी लहरों से उसे पीड़ित किया है।
  alternative: ईश्वरीय भूमिका को अप्रत्यक्ष बनाना या ‘प्रकोप’ को केवल सामान्य संकट के रूप में नरम करना।
  rationale: इब्रानी पाठ प्रकोप और पीड़ित करने—दोनों को सीधे परमेश्वर से जोड़ता है। अनुवाद इस कठिन धर्मवैचारिक तनाव को स्पष्ट रखता है, उसे हल्का या व्याख्यायित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गंभीर, काव्यात्मक और सहज रजिस्टर। परमेश्वर को सीधे संबोधन के कारण एकवचन आत्मीय सर्वनाम ‘तू/तेरा’ रखा गया है। समानांतर पंक्तियों और समुद्री आघात के बिंब को संरक्षित किया गया है।
