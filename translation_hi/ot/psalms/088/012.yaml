  text: הֲ/יִוָּדַ֣ע בַּ/חֹ֣שֶׁךְ פִּלְאֶ֑/ךָ וְ֝/צִדְקָתְ/ךָ֗ בְּ/אֶ֣רֶץ נְשִׁיָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/088/012.yaml
  text: Is your wonder made known in the darkness[b][a], or your righteousness in the land of forgetfulness?
translation:
  language: hi
  text: क्या अंधकार में तेरे अद्भुत कार्य को प्रकट किया जाता है, या विस्मृति के देश[b] में तेरी धार्मिकता[a] को?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘तेरे न्याय’।
    reason: lexical_alternative
  - marker: b
    text: ‘विस्मृति का देश’ मृतकों के लोक के लिए प्रयुक्त एक काव्यात्मक अभिव्यक्ति है।
    reason: cultural_note
lexical_decisions:
- source_word: הֲ/יִוָּדַע
  choice: क्या ... प्रकट किया जाता है
  rationale: निफ़अल अपूर्ण रूप और प्रश्नवाचक संरचना के निष्क्रिय भाव को स्पष्ट रखता है; केवल ‘जाना जाता है’ की तुलना में ‘प्रकट किया जाता है’ परमेश्वर के काम के घोषित होने का भाव अधिक स्वाभाविक ढंग से व्यक्त करता है।
- source_word: בַּ/חֹשֶׁךְ
  choice: अन्धकार में
  rationale: पूर्वसर्गयुक्त पद का सीधा और काव्यात्मक अनुवाद; प्रसंग में यह मृत्यु के लोक की ओर संकेत करता है, पर मुख्य पाठ उस संकेत को स्पष्ट व्याख्या में नहीं बदलता।
- source_word: פִּלְאֶךָ
  choice: तेरे अद्भुत काम
  rationale: हिब्रू एकवचन परमेश्वर के आश्चर्यकारी कार्य या सामर्थ्य को सामूहिक रूप में व्यक्त कर सकता है। हिन्दी में ‘अद्भुत काम’ स्वाभाविक है और एकवचन के निकट रहता है।
- source_word: וְ/צִדְקָתְ/ךָ
  choice: या ... तेरी धार्मिकता
  rationale: वाव समानान्तर दूसरे अलंकारिक प्रश्न को जोड़ता है, इसलिए हिन्दी में ‘या’ सहज है। צדקה के लिए ‘धार्मिकता’ मुख्य पाठ में रखी गई है; ‘न्याय’ सम्भव विकल्प है।
- source_word: בְּ/אֶרֶץ נְשִׁיָּה
  choice: विस्मृति के देश में
  rationale: मूल काव्य-रूपक को संक्षिप्त और गरिमापूर्ण हिन्दी में बनाए रखता है; इसका संकेत मृतकों के लोक की ओर है।
theological_decisions:
- issue: 'צדקה का अर्थ: परमेश्वर की धार्मिकता अथवा न्याय'
  choice: धार्मिकता
  alternative: न्याय
  rationale: शब्द परमेश्वर के सही और न्यायपूर्ण चरित्र तथा कार्य दोनों को व्यक्त कर सकता है। मुख्य पाठ में व्यापक पारम्परिक समतुल्य ‘धार्मिकता’ रखा गया है और वास्तविक वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी में काव्यात्मक और गरिमापूर्ण शैली रखी गई है। ‘तेरे’ भजन की प्रत्यक्ष प्रार्थना का निकट, एकवचन सम्बोधन सुरक्षित रखता है। दोनों पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
