base_translation:
  language: en
  yaml_path: translation/ot/psalms/088/018.yaml
  text: You have put far from me lover and friend[b][a]; my acquaintances are darkness.
translation:
  language: hi
  text: 'तूने मेरे प्रेमी और मित्र को मुझसे दूर कर दिया है;

    मेरे परिचित अंधकार हैं।[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरे परिचित अंधकार में हैं”; अथवा, “अंधकार ही मेरा साथी है।” इब्रानी का अंत अत्यंत संक्षिप्त है और उसके एक से अधिक अर्थ समझे गए हैं।
    reason: alternative_reading
  - marker: b
    text: या, “अंधकार ही मेरे परिचित हैं।”
    reason: previous_rendering
lexical_decisions:
- source_word: הִרְחַקְתָּ מִמֶּנִּי
  choice: तूने ... मुझसे दूर कर दिया है
  rationale: हिफ़ील पूर्ण रूप परमेश्वर द्वारा दूरी उत्पन्न किए जाने को व्यक्त करता है; भजनकार सीधे एकवचन में उसे सम्बोधित करता है।
- source_word: אֹהֵב וָרֵעַ
  choice: मेरे प्रेमी और मित्र
  rationale: אֹהֵב यहाँ संज्ञा के समान प्रयुक्त कृदन्त है, अर्थात प्रेम करने वाला निकट व्यक्ति; רֵעַ के लिए इस सम्बन्धपरक प्रसंग में ‘मित्र’ स्वाभाविक है। ‘प्रेमी’ मूल की निकटता और भावात्मक तीव्रता को बनाए रखता है।
- source_word: מְיֻדָּעַי
  choice: मेरे परिचित
  rationale: यह ידע से बना बहुवचन रूप है और उन लोगों को सूचित करता है जिन्हें भजनकार जानता है; ‘परिचित’ निकट मित्रों से अनावश्यक समानता किए बिना अर्थ को रखता है।
- source_word: מַחְשָׁךְ
  choice: अन्धकार हैं
  rationale: अन्तिम संज्ञा एक अत्यन्त संक्षिप्त क्रियारहित उपवाक्य में विधेय के रूप में समझी गई है। हिन्दी में ‘हैं’ जोड़कर अर्थगम्यता रखी गई, पर मूल की कठोर उपमा को नहीं हटाया गया।
theological_decisions:
- issue: अन्तिम पदबंध מְיֻדָּעַי מַחְשָׁךְ का सम्बन्ध
  choice: मेरे परिचित अन्धकार हैं
  alternative: मेरे परिचित अन्धकार में हैं; अथवा अन्धकार ही मेरा साथी है
  rationale: मसोरेटिक शब्दक्रम में ‘मेरे परिचित’ के बाद ‘अन्धकार’ आता है और इसे विषय-विधेय क्रियारहित वाक्य माना जा सकता है। फिर भी इब्रानी अत्यन्त संक्षिप्त है, इसलिए अन्य व्याकरणिक समझों को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गम्भीर, काव्यात्मक और सहज बोधगम्य रूप। परमेश्वर को मूल के एकवचन प्रत्यक्ष सम्बोधन के अनुरूप ‘तू’ कहा गया है। ‘अन्धकार’ की पारम्परिक वर्तनी अपनाई गई है और मूल की अचानक, निराशाजनक समाप्ति बनाए रखी गई है।
