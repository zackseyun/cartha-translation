    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלַמֵּתִים
  choice: मरे हुओं के लिए
  rationale: प्रश्नवाचक הֲ और לַ का मेल ‘मरे हुओं के लिए?’ का भाव देता है; यह स्वाभाविक हिन्दी में आलंकारिक प्रश्न की शक्ति बनाए रखता है।
- source_word: תַּעֲשֶׂה פֶּלֶא
  choice: अद्भुत काम करेगा
  rationale: עשה और פֶּלֶא का मेल परमेश्वर के असाधारण कार्य को व्यक्त करता है। भविष्यत् रूप ‘करेगा’ हिब्रू अपूर्ण क्रिया के प्रसंगानुकूल प्रश्नात्मक भाव को सहज हिन्दी में रखता है।
- source_word: אִם
  choice: क्या
  rationale: यहाँ אִם शर्त नहीं, पहले प्रश्न के समानांतर दूसरा आलंकारिक प्रश्न आरम्भ करता है।
- source_word: רְפָאִים
  choice: मृतात्माएँ
  rationale: काव्यात्मक प्रसंग में यह अधोलोक के मृत प्राणियों के लिए प्रयुक्त शब्द है। ‘मृतात्माएँ’ आधुनिक पाठक के लिए स्पष्ट है और जातीय ‘रपाई’ का भ्रामक अर्थ नहीं लाता।
- source_word: יָקוּמוּ
  choice: उठकर
  rationale: קום उठने या खड़े होने का सजीव चित्र देता है; ‘उठकर’ अगली क्रिया से स्वाभाविक रूप से जुड़ता है।
- source_word: יוֹדוּךָ
  choice: तेरी स्तुति करेंगी
  rationale: ידה का हिफ़ील रूप यहाँ धन्यवाद या स्तुति व्यक्त करता है; भजन के आराधनात्मक संदर्भ में ‘स्तुति’ उपयुक्त है।
- source_word: סֶלָה
  choice: सेला
  rationale: इस पद का ठीक अर्थ अनिश्चित है, इसलिए अनुमानित अनुवाद के बजाय लिप्यंतरण रखा गया है।
theological_decisions:
- issue: काव्यात्मक अधोलोक-संदर्भ में רְפָאִים का अर्थ
  choice: मृतात्माएँ
  alternative: छायाएँ; मरे हुए; रफाईम
  rationale: यह शब्द मृतकों और उनकी स्तुति में भाग लेने की असमर्थता के काव्यात्मक चित्र को रखता है, पर मृत्यु के बाद की दशा के विषय में कोई बाद की व्यवस्थित धर्मशास्त्रीय धारणा आरोपित नहीं करता। वैकल्पिक शाब्दिक अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। दोनों समानांतर आलंकारिक प्रश्न सुरक्षित हैं; परमेश्वर के लिए निकटवर्ती एकवचन ‘तू/तेरी’ भजन की सीधी प्रार्थनात्मक वाणी को दर्शाता है।
