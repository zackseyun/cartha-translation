source:
  edition: WLC
  text: נֶ֭חְשַׁבְתִּי עִם י֣וֹרְדֵי ב֑וֹר הָ֝יִ֗יתִי כְּ/גֶ֣בֶר אֵֽין אֱיָֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/088/004.yaml
  text: I am counted among those going down to the pit[b][a]; I have become like a man without strength.
translation:
  language: hi
  text: मैं गड्ढे में उतरनेवालों में गिना गया हूँ[a]; मैं ऐसे पुरुष के समान हो गया हूँ जिसमें कोई बल नहीं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘कब्र में उतरनेवालों में।’ यहाँ ‘गड्ढा’ मृत्यु का सामान्य काव्यात्मक बिंब है।
    reason: lexical_alternative
  - marker: b
    text: या ‘ऐसे बलवान पुरुष के समान जिसमें सामर्थ्य नहीं।’ ‘पुरुष’ के लिए प्रयुक्त इब्रानी शब्द में बल का भाव भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶחְשַׁבְתִּי
  choice: मैं ... गिना गया हूँ
  rationale: निफ़अल रूप किसी समूह में गिने या समझे जाने का भाव देता है; पूर्ण रूप के परिणामस्वरूप वर्तमान दशा को हिन्दी में स्वाभाविक ढंग से व्यक्त किया गया है।
- source_word: עִם
  choice: में
  rationale: शाब्दिक अर्थ ‘साथ’ है, पर ‘गिना गया’ के साथ हिन्दी में ‘में’ समूह के भीतर सम्मिलित होने का भाव अधिक स्वाभाविक रूप से देता है।
- source_word: יוֹרְדֵי בּוֹר
  choice: गड्ढे में उतरनेवाले
  rationale: कृदन्तीय अभिव्यक्ति को सक्रिय और सजीव रखा गया है; यह मृत्यु की ओर जानेवालों का काव्यात्मक चित्र प्रस्तुत करती है।
- source_word: בּוֹר
  choice: गड्ढा
  rationale: यहाँ शब्द मृत्यु अथवा मृतकों के लोक की काव्यात्मक छवि है। ‘गड्ढा’ मूल बिंब को ‘कब्र’ की अपेक्षा अधिक निकटता से सुरक्षित रखता है।
- source_word: הָיִיתִי
  choice: मैं ... हो गया हूँ
  rationale: पूर्ण क्रिया को परिणामस्वरूप उत्पन्न दशा के रूप में प्रस्तुत किया गया है, जिससे विलाप में आए परिवर्तन और वर्तमान असहायता दोनों स्पष्ट होते हैं।
- source_word: כְּגֶבֶר
  choice: ऐसे पुरुष के समान
  rationale: גֶבֶר सामान्यतः ‘पुरुष’ है, यद्यपि इसमें सामर्थ्य का संकेत हो सकता है। अगले पदांश के साथ इसका विडंबनापूर्ण तनाव बनाए रखा गया है।
- source_word: אֵין אֱיָל
  choice: जिसमें कोई बल नहीं
  rationale: अभिव्यक्ति का सीधा अर्थ बल या सामर्थ्य का अभाव है; यह हिन्दी में स्पष्ट और मूल की तीक्ष्णता के अनुरूप है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और काव्यात्मक रजिस्टर रखा गया है। ‘गड्ढा’ मूल मृत्यु-बिंब को सुरक्षित रखता है और ‘पुरुष...बल नहीं’ इब्रानी की संभावित विडंबना को बिना व्याख्यात्मक रूप से सुलझाए बनाए रखता है।
