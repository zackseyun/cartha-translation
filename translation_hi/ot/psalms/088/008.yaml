source:
  edition: WLC
  text: הִרְחַ֥קְתָּ מְיֻדָּעַ֗/י מִ֫מֶּ֥/נִּי שַׁתַּ֣/נִי תוֹעֵב֣וֹת לָ֑/מוֹ כָּ֝לֻ֗א וְ/לֹ֣א אֵצֵֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/088/008.yaml
  text: You have driven my companions far from me[a]; you have made me abhorrent to them[c][b]. I am confined and cannot go out.
translation:
  language: hi
  text: तूने मेरे परिचितों को मुझसे दूर कर दिया है[a]; तूने मुझे उनके लिए घृणित बना दिया है[b]। मैं बंद हूँ और बाहर नहीं निकल सकता[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘मेरे जान-पहचान के लोगों को।’
    reason: lexical_alternative
  - marker: b
    text: या ‘तूने मुझे उनके लिए घृणा की वस्तु बना दिया है।’
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से, ‘मैं बंद हूँ और बाहर नहीं निकलता।’
    reason: lexical_alternative
lexical_decisions:
- source_word: הִרְחַקְתָּ
  choice: दूर कर दिया है
  rationale: हिफ़ील रूप किसी को दूर करने का कारण बनने का भाव व्यक्त करता है; यह हिंदी में स्वाभाविक और स्रोत के निकट है।
- source_word: מְיֻדָּעַי
  choice: मेरे परिचितों
  rationale: यह ידע से बना संबंधवाचक रूप है और वक्ता के जान-पहचान के लोगों को दर्शाता है। ‘परिचित’ निकटता को ‘मित्र’ जितना नहीं बढ़ाता।
- source_word: מִמֶּנִּי
  choice: मुझसे
  rationale: מן के पृथक्करण-सूचक अर्थ और प्रथम पुरुष एकवचन प्रत्यय का सीधा हिंदी रूप।
- source_word: שַׁתַּנִי
  choice: मुझे ... बना दिया है
  rationale: שׁית/שׂים का ‘रखना/ठहराना’ भाव विधेय के साथ यहाँ किसी दशा में कर देने के अर्थ में है।
- source_word: תוֹעֵבוֹת
  choice: घृणित
  rationale: 'बहुवचन संज्ञा-रूप होने पर भी यहाँ विधेयात्मक अर्थ है: उनके लिए अत्यंत घृणा की वस्तु। ‘घृणित’ प्रबल विकर्षण को सहज हिंदी में व्यक्त करता है।'
- source_word: לָמוֹ
  choice: उनके लिए
  rationale: यह पहले बताए परिचितों की ओर संकेत करता है; इस विधेयात्मक रचना में ‘उनके लिए’ स्वाभाविक है।
- source_word: כָּלֻא
  choice: मैं बंद हूँ
  rationale: כלא का निष्क्रिय/स्थितिवाचक भाव रोके या बंद रखे जाने को दर्शाता है, बिना औपचारिक कारागार का अर्थ अनिवार्य किए।
- source_word: וְלֹא אֵצֵא
  choice: और बाहर नहीं निकल सकता
  rationale: शाब्दिक रूप ‘और मैं बाहर नहीं निकलता’ है, किंतु ‘बंद हूँ’ के संदर्भ में असमर्थता निहित है; हिंदी में ‘नहीं निकल सकता’ वही बल स्पष्ट करता है।
