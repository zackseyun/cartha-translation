  verdict: revise
  source_fidelity: The petitionary force of תָּבוֹא is well represented by “पहुँचे,” and “तेरे सामने” accurately conveys לְפָנֶיךָ. However, “विलाप की पुकार” narrows רִנָּתִי beyond the word’s lexical range. In this psalm it can certainly be a distressed cry, but the verse itself does not specify ‘lament.’ The imperative הַטֵּה is more directly expressed by ‘झुका’ than by ‘लगा.’
  naturalness: The draft is generally clear and appropriately prayerful. “मेरे विलाप की पुकार की ओर अपना कान लगा” is somewhat heavy and repetitive in Hindi. “मेरी पुकार पर अपना कान झुका” is concise, idiomatic, and retains the Hebrew ear-inclining image.
  terminology: “प्रार्थना,” “तेरे सामने,” and the singular “कान” are suitable. The revision preserves the intimate singular address and avoids adding an interpretive characterization to רִנָּה.
  issues:
  - severity: medium
    issue: “विलाप की पुकार” makes the cry explicitly a lament.
    rationale: רִנָּה can refer to a ringing cry, shout, or cry; Psalm 88’s setting supports a lamenting tone but does not require that interpretive qualifier in this verse. “पुकार” preserves the lexical and contextual range.
  - severity: low
    issue: “अपना कान लगा” weakens the explicit inclination metaphor and produces a longer construction.
    rationale: הַטֵּה is literally an imperative to incline or bend. “अपना कान झुका” is natural modern Hindi and more closely reflects the source.
  - severity: low
    issue: The draft omits the available literal nuance of ‘before your face.’
    rationale: “तेरे सामने” is the preferred idiomatic rendering, but a footnote can preserve the Hebrew’s literal wording without burdening the main text.
