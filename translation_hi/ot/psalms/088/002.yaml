lexical_decisions:
- source_word: תָּבוֹא
  choice: पहुँचे
  rationale: स्त्रीलिंग एकवचन अपूर्ण क्रिया תָּבוֹא का कर्ता ‘मेरी प्रार्थना’ है। प्रार्थना के संदर्भ में इसे निवेदनसूचक रूप ‘पहुँचे’ देना स्वाभाविक है और सामान्य भविष्यकाल से अधिक उपयुक्त है।
- source_word: לְפָנֶיךָ
  choice: तेरे सामने
  rationale: शाब्दिक अर्थ ‘तेरे मुख के सामने’ है, पर यह किसी की उपस्थिति में आने का इब्रानी मुहावरा है। ‘तेरे सामने’ सहज हिंदी में उसी प्रत्यक्ष उपस्थिति को बनाए रखता है।
- source_word: תְּפִלָּתִי
  choice: मेरी प्रार्थना
  rationale: תְּפִלָּה का सामान्य और व्यापक अर्थ ‘प्रार्थना’ है; ‘विनती’ संभव है, पर अर्थ को अधिक संकीर्ण कर देती है।
- source_word: הַטֵּה
  choice: लगा
  rationale: נטה का हिफ़ील आज्ञार्थक रूप कान को झुकाने या ध्यानपूर्वक सुनने का चित्र देता है। ‘अपना कान लगा’ आधुनिक हिंदी का स्वाभाविक मुहावरा है और मूल रूपक को बनाए रखता है।
- source_word: אָזְנְךָ
  choice: अपना कान
  rationale: मूल पाठ के एकवचन ‘कान’ को सुरक्षित रखा गया है; यह ध्यान से सुनने का इब्रानी मुहावरा है।
- source_word: לְרִנָּתִי
  choice: मेरे विलाप की पुकार की ओर
  rationale: רִנָּה ऊँची या गूँजती पुकार हो सकती है और संदर्भ के अनुसार हर्ष अथवा विलाप व्यक्त कर सकती है। भजन 88 के शोकपूर्ण संदर्भ में ‘विलाप की पुकार’ उसका भाव स्पष्ट करता है, जबकि केवल ‘जयजयकार’ जैसा अर्थ यहाँ अनुचित होगा।
