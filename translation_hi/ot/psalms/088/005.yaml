  rationale: स्वतंत्रता की विरोधाभासी मूल छवि को सुरक्षित रखता है और उसे ‘त्यागा हुआ’ जैसे अधिक व्याख्यात्मक शब्द से प्रतिस्थापित नहीं करता।
- issue: ‘तेरे हाथ से काट दिए गए’ की धर्मवैचारिक व्यापकता
  choice: ‘हाथ’ का रूपक बनाए रखा गया
  alternative: तेरी देखभाल से दूर / तेरी सामर्थ्य से अलग
  rationale: मूल रूपक में सामर्थ्य, अधिकार और देखभाल के संभावित अर्थ साथ रहते हैं; किसी एक अर्थ को मुख्य पाठ में निर्णायक नहीं बनाया गया।
