  text: בַּ/מֵּתִ֗ים חָ֫פְשִׁ֥י כְּמ֤וֹ חֲלָלִ֨ים שֹׁ֥כְבֵי קֶ֗בֶר אֲשֶׁ֤ר לֹ֣א זְכַרְתָּ֣/ם ע֑וֹד וְ֝/הֵ֗מָּה מִ/יָּדְ/ךָ֥ נִגְזָֽרוּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/088/005.yaml
  text: I am set free among the dead[a], like the slain who lie in the grave, whom you remember no more[c][b], and they are cut off from your hand.
translation:
  language: hi
  text: मैं मरे हुओं के बीच स्वतंत्र हूँ[a], उन मारे गए लोगों के समान जो कब्र में पड़े हैं, जिन्हें तू अब स्मरण नहीं करता[b], और वे तेरे हाथ से काट दिए गए हैं[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या “मरे हुओं के बीच मुक्त हूँ।” इब्रानी में स्वतंत्र या मुक्त होने की भाषा संभवतः विडंबनापूर्ण है: भजनकार अपने को मानो मर चुका और जीवितों के संसार से अलग हुआ बताता है।'
    reason: lexical_alternative
  - marker: b
    text: यहाँ “स्मरण” का अर्थ केवल मन में याद रखना नहीं, बल्कि किसी की सुधि लेना या उसके लिए कार्य करना भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: “हाथ” परमेश्वर की सामर्थ्य, अधिकार या देखभाल की इब्रानी छवि है। “काट दिए गए” का अर्थ “अलग कर दिए गए” भी हो सकता है।
    reason: lexical_alternative
