  yaml_path: translation/ot/psalms/088/003.yaml
  text: For my soul is full of troubles[a], and my life draws near to Sheol.
translation:
  language: hi
  text: क्योंकि मेरा प्राण विपत्तियों से भर गया है, और मेरा जीवन शीओल[a] के निकट जा पहुँचा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “कब्र” अथवा “मृतकों का लोक।” इब्रानी शब्द “शीओल” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पद संदर्भ में भजनकार की दशा का कारण बताता है; ‘क्योंकि’ इसके कारणसूचक बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: שָׂבְעָה
  choice: भर गया है
  rationale: क्रिया का मूल भाव तृप्त या परिपूर्ण हो जाना है; विपत्तियों के साथ ‘भर गया है’ हिन्दी में स्वाभाविक है और अत्यधिक भर जाने की छवि बनाए रखता है।
- source_word: בְרָעוֹת
  choice: विपत्तियों से
  rationale: רָעוֹת यहाँ नैतिक बुराइयों के बजाय भजनकार पर आई मुसीबतों या आपदाओं को दर्शाता है; ‘विपत्तियाँ’ काव्यात्मक और प्रसंगानुकूल है।
- source_word: נַפְשִׁי
  choice: मेरा प्राण
  rationale: נֶפֶשׁ व्यक्ति, जीवन या प्राण को सूचित कर सकता है। दूसरे चरण के חַיַּי से शब्दगत भेद रखते हुए ‘प्राण’ समूचे आंतरिक अस्तित्व की पीड़ा व्यक्त करता है।
- source_word: וְחַיַּי
  choice: और मेरा जीवन
  rationale: חַיִּים रूप में बहुवचन होते हुए भी प्रायः एकवचन भाववाचक ‘जीवन’ के अर्थ में प्रयुक्त होता है।
- source_word: לִשְׁאוֹל
  choice: अधोलोक[a] के निकट
  rationale: שְׁאוֹל मृतकों के लोक को दर्शाता है। ‘अधोलोक’ हिन्दी पाठक के लिए अर्थपूर्ण है, जबकि पादटिप्पणी मूल इब्रानी पद और संभावित विकल्प स्पष्ट करती है।
- source_word: הִגִּיעוּ
  choice: आ पहुँचा है
  rationale: क्रिया का मूल अर्थ पहुँचना है। לִשְׁאוֹל के साथ ‘निकट आ पहुँचा है’ आसन्न मृत्यु की स्थिति व्यक्त करता है, बिना यह कहे कि मृत्यु घट चुकी है।
theological_decisions:
- issue: שְׁאוֹל का अनुवाद
  choice: अधोलोक
  alternative: कब्र; मृतकों का लोक; शीओल
  rationale: ‘अधोलोक’ मृत्यु के लोक की प्राचीन इब्रानी अवधारणा को संक्षेप में व्यक्त करता है और इसे केवल भौतिक कब्र या बाद की किसी विशिष्ट नरक-संबंधी धारणा तक सीमित नहीं करता। मूल शब्द और विकल्प पादटिप्पणी में दिए गए हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज और काव्यात्मक विलाप-रजिस्टर। ‘प्राण’ और ‘जीवन’ मूल के समानांतर किंतु भिन्न शब्दों को अलग रखते हैं; ‘अधोलोक’ के साथ पादटिप्पणी संभावित अर्थ-सीमा सुरक्षित रखती है।
