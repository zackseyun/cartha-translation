  yaml_path: translation/ot/psalms/088/001.yaml
  text: O Yahweh[a], God of my salvation, by day I cry out; at night I am before you.
translation:
  language: hi
  text: 'हे याहवे, मेरे उद्धार के परमेश्वर,


    मैं दिन में पुकारता हूँ;


    रात को मैं तेरे सामने हूँ।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में केवल “तेरे सामने” है; यह उपवाक्य क्रियारहित है। वाक्य की स्पष्टता के लिए “मैं ... हूँ” जोड़ा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: हे यहोवा
  rationale: प्रत्यक्ष संबोधन को ‘हे’ से व्यक्त किया गया है और परमेश्वर के निज नाम को प्रचलित हिन्दी रूप ‘यहोवा’ में रखा गया है।
- source_word: אֱלֹהֵי יְשׁוּעָתִי
  choice: मेरे उद्धारकर्ता परमेश्वर
  rationale: शाब्दिक ‘मेरे उद्धार के परमेश्वर’ का स्वाभाविक हिन्दी रूप; इससे परमेश्वर को उद्धार का स्रोत बताने वाला संबंध सुरक्षित रहता है।
- source_word: יוֹם
  choice: दिन में
  rationale: ‘रात को’ के समानांतर प्रयुक्त कालवाचक अर्थ का सहज हिन्दी रूप।
- source_word: צָעַקְתִּי
  choice: मैं पुकारता हूँ
  rationale: Qal perfect को विलाप के प्रसंग में जारी प्रार्थना के रूप में वर्तमान काल में व्यक्त किया गया है; क्रिया की तीव्रता ‘पुकारता’ में बनी रहती है।
- source_word: בַלַּיְלָה
  choice: रात को
  rationale: दिन और रात के काव्यात्मक विरोध को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: נֶגְדֶּךָ
  choice: मैं तेरे सामने रहता हूँ
  rationale: मूल में क्रियारहित ‘तेरे सामने’ है। हिन्दी में वाक्य पूर्ण करने के लिए ‘मैं ... रहता हूँ’ जोड़ा गया, पर स्थानिक/उपस्थितिपरक अर्थ को आगे नहीं समझाया गया।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल के निज नाम को उपाधि से प्रतिस्थापित नहीं किया गया। ‘यहोवा’ आधुनिक हिन्दी बाइबलीय प्रयोग में व्यापक और सामान्य पाठकों के लिए परिचित रूप है।
- issue: אֱלֹהֵי יְשׁוּעָתִי का संबंध
  choice: मेरे उद्धारकर्ता परमेश्वर
  alternative: मेरे उद्धार के परमेश्वर
  rationale: स्वाभाविक हिन्दी में परमेश्वर को उद्धार का कर्ता/स्रोत व्यक्त किया गया है, बिना उद्धार के प्रकार को सीमित किए।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और प्रार्थनामय हिन्दी। काव्यात्मक पंक्ति-विभाजन में दिन और रात का समानांतर रखा गया है; परमेश्वर के लिए एकवचन आत्मीय संबोधन ‘तेरे’ प्रयुक्त है।
