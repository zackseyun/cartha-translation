id: PSA.88.9
reference: Psalms 88:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: עֵינִ֥/י דָאֲבָ֗ה מִנִּ֫י עֹ֥נִי קְרָאתִ֣י/ךָ יְהוָ֣ה בְּ/כָל י֑וֹם שִׁטַּ֖חְתִּי אֵלֶ֣י/ךָ כַפָּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/088/009.yaml
  text: My eye grows weak because of affliction; I call on you every day[a], O Yahweh; I spread out my hands to you.
translation:
  language: hi
  text: दुःख के मारे मेरी आँख क्षीण हो रही है[a]। हे याहवे, मैं हर दिन तुझे पुकारता हूँ; तेरी ओर अपने हाथ फैलाता हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “दुःख के कारण मेरी आँख मुरझा गई है”; अथवा, “विपत्ति के कारण मेरी आँख पीड़ा में है।”
    reason: इब्रानी क्रिया דָאֲבָה क्षीण होने, मुरझाने या पीड़ा में होने का भाव दे सकती है।
lexical_decisions:
- source_word: עֵינִי
  choice: मेरी आँख
  rationale: इब्रानी में संज्ञा एकवचन है। इसे बनाए रखने से काव्यात्मक ठोसपन और दृष्टि अथवा जीवन-शक्ति का संकेत सुरक्षित रहता है।
- source_word: דָאֲבָה
  choice: क्षीण हो रही है
  rationale: क्रिया दुःख के कारण मुरझाने, निर्बल होने या घुलते जाने का भाव देती है। यह चयन उस प्रक्रिया को स्वाभाविक हिन्दी में व्यक्त करता है, बिना केवल शारीरिक पीड़ा का अर्थ निश्चित किए।
- source_word: מִנִּי עֹנִי
  choice: दुःख के मारे
  rationale: यह पदबंध कष्ट को आँख के क्षीण होने का कारण बताता है। ‘दुःख के मारे’ आधुनिक और स्वाभाविक हिन्दी में वही कारण-संबंध व्यक्त करता है।
- source_word: קְרָאתִיךָ
  choice: मैं ... तुझे पुकारता हूँ
  rationale: ‘हर दिन’ के साथ पूर्ण क्रिया यहाँ बार-बार होने वाली प्रार्थनापूर्ण पुकार को व्यक्त करती है।
- source_word: יְהוָה
  choice: याहवे
  rationale: व्यक्तिगत दिव्य नाम को किसी उपाधि से बदलने के बजाय हिन्दी लिपि में लिप्यंतरित किया गया है।
- source_word: בְּכָל יוֹם
  choice: हर दिन
  rationale: यह नियमित दैनिक पुनरावृत्ति का सहज हिन्दी रूप है; ‘दिन भर’ एक ही दिन के भीतर निरंतरता का अलग अर्थ दे सकता है।
- source_word: שִׁטַּחְתִּי
  choice: फैलाता हूँ
  rationale: क्रिया प्रार्थना या विनती में हाथ फैलाने की शारीरिक मुद्रा बताती है।
- source_word: כַפָּי
  choice: अपने हाथ
  rationale: शाब्दिक रूप से हथेलियों का संकेत संभव है, पर इस प्रार्थना-मुद्रा के लिए ‘हाथ’ स्वाभाविक हिन्दी है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत दिव्य नाम सीधे आया है। ‘याहवे’ उसे उपाधि से प्रतिस्थापित किए बिना प्रस्तुत करता है; ‘यहोवा’ एक वैकल्पिक पारंपरिक लिप्यंतरण है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गंभीर और काव्यात्मक शैली रखी गई है। परमेश्वर को संबोधित करते हुए ‘तुझे/तेरी’ का प्रयोग निकट और प्रत्यक्ष भजन-शैली को बनाए रखता है।
