  yaml_path: translation/ot/psalms/088/014.yaml
  text: Why[a], O Yahweh[b], do you reject my soul? Why do you hide your face from me?
translation:
  language: hi
  text: 'हे याहवे, तू मेरे प्राण[a] को क्यों ठुकराता है?

    तू अपना मुख मुझसे छिपाता है।[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “मेरे प्राण को” का अर्थ यहाँ “मुझे” या “मेरे जीवन को” भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: “मुख छिपाना” एक इब्रानी मुहावरा है, जिसका अर्थ अपनी अनुकूल उपस्थिति या ध्यान हटा लेना है।
    reason: cultural_note
lexical_decisions:
- source_word: לָמָה
  choice: क्यों
  rationale: कारण पूछने वाला सीधा प्रश्न है; “क्यों” विलाप की तीव्रता को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में प्रयुक्त परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय हिन्दी लिपि में लिप्यंतरित किया गया है।
- source_word: תִּזְנַח
  choice: ठुकराता है
  rationale: क्रिया का अर्थ अस्वीकार या त्याग देना है। “ठुकराना” आधुनिक हिन्दी में शिकायत की व्यक्तिगत और भावनात्मक तीव्रता को स्पष्ट रूप से व्यक्त करता है।
- source_word: נַפְשִׁי
  choice: मेरे प्राण
  rationale: נֶפֶשׁ यहाँ व्यक्ति, जीवन या प्राण का बोध करा सकता है। “मेरे प्राण” मूल की ठोस अभिव्यक्ति को बनाए रखता है, जबकि पादटिप्पणी सम्भव अर्थ “मुझे” को स्पष्ट करती है।
- source_word: תַּסְתִּיר
  choice: छिपाता है
  rationale: हिफ़ील क्रिया का सीधा अर्थ छिपाना है; यह चयन स्पष्ट और स्वाभाविक है।
- source_word: פָּנֶיךָ
  choice: अपना मुख
  rationale: शाब्दिक बिंब “तेरा मुख” सुरक्षित रखा गया है; सन्दर्भ में यह अनुकूल उपस्थिति और ध्यान का संकेत देने वाला इब्रानी मुहावरा है।
- source_word: מִמֶּנִּי
  choice: मुझसे
  rationale: सम्बन्धसूचक रूप का संक्षिप्त और स्वाभाविक हिन्दी समतुल्य है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पद में चतुरक्षरीय व्यक्तिगत नाम सीधे आया है। “याहवे” उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और उसे किसी उपाधि से नहीं बदलता।
- issue: נַפְשִׁי में व्यक्ति और प्राण के बीच अर्थ
  choice: मुख्य पाठ में “मेरे प्राण”, पादटिप्पणी में “मुझे”
  alternative: मुझे क्यों ठुकराता है
  rationale: इब्रानी נֶפֶשׁ पूरे व्यक्ति, जीवन या प्राण को सूचित कर सकता है। मुख्य पाठ मूल रूपक को रखता है और पादटिप्पणी उसके स्वाभाविक व्यक्तिगत अर्थ को बताती है, बिना मनुष्य की संरचना के बारे में कोई विशिष्ट सिद्धान्त आरोपित किए।
- issue: “मुख छिपाना” मुहावरे का निर्वचन
  choice: मूल मुहावरा मुख्य पाठ में सुरक्षित
  alternative: अपनी अनुकूल उपस्थिति मुझसे क्यों हटा लेता है
  rationale: ठोस इब्रानी बिंब को सुरक्षित रखने से काव्यात्मक और धर्मवैचारिक तनाव बना रहता है; उसका निहितार्थ पादटिप्पणी में बताया गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। परमेश्वर के लिए एकवचन निकट सम्बोधन “तू” भजन के सीधे और व्यक्तिगत विलाप के अनुरूप है। दोनों प्रश्नों में समान वाक्य-विन्यास मूल की काव्यात्मक समानता को बनाए रखता है।
