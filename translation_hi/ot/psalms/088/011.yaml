  yaml_path: translation/ot/psalms/088/011.yaml
  text: Is your steadfast love declared in the grave[a], your faithfulness in Abaddon?
translation:
  language: hi
  text: 'क्या कब्र में तेरे अटल प्रेम का वर्णन किया जाएगा,

    और अबद्दोन[a] में तेरी विश्वासयोग्यता का?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात् ‘विनाश’ या ‘विनाश-लोक।’ इब्रानी ‘अबद्दोन’ मृत्यु और विनाश के क्षेत्र के लिए प्रयुक्त काव्यात्मक शब्द है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיְסֻפַּר
  choice: क्या ... वर्णन किया जाएगा
  rationale: प्रश्नवाचक ה के साथ ספר का पुअल रूप निष्क्रिय अर्थ देता है—‘क्या वर्णन किया जाएगा/सुनाया जाएगा?’ यह अनुवाद आलंकारिक प्रश्न और निष्क्रिय भाव दोनों को स्पष्ट, स्वाभाविक हिन्दी में रखता है।
- source_word: בַּקֶּבֶר
  choice: कब्र में
  rationale: קֶבֶר कब्र अथवा दफनाने की जगह को दर्शाता है; ‘कब्र’ आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: חַסְדֶּךָ
  choice: तेरे अटल प्रेम
  rationale: חֶסֶד में स्थायी प्रेम, निष्ठा और कृपा के परस्पर जुड़े भाव हैं। ‘अटल प्रेम’ इस पद में प्रेम और उसकी दृढ़ता को बिना अत्यधिक व्याख्या के व्यक्त करता है।
- source_word: אֱמוּנָתְךָ
  choice: तेरी विश्वासयोग्यता
  rationale: אֱמוּנָה यहाँ परमेश्वर की भरोसेमंदी और निष्ठा को सूचित करता है तथा חֶסֶד के समानांतर है; ‘विश्वासयोग्यता’ इस गुण को ठीक रूप से व्यक्त करती है।
- source_word: בָּאֲבַדּוֹן
  choice: अबद्दोन में
  rationale: אֲבַדּוֹן का अर्थ विनाश हो सकता है, पर कब्र के समानांतर यहाँ यह मृत्यु अथवा विनाश के लोक का काव्यात्मक नाम है। लिप्यंतरण मूल बिंब और उसकी अर्थगत अस्पष्टता को सुरक्षित रखता है; अर्थ पाद-टिप्पणी में दिया गया है।
theological_decisions:
- issue: אֲבַדּוֹן को सामान्य संज्ञा ‘विनाश’ के रूप में अनुवाद किया जाए या मृत्यु-विनाश के लोक के काव्यात्मक नाम के रूप में रखा जाए
  choice: मुख्य पाठ में ‘अबद्दोन’
  alternative: ‘विनाश’, अथवा ‘विनाश-लोक’
  rationale: ‘कब्र’ के साथ काव्यात्मक समानांतरता बताती है कि यहाँ केवल अमूर्त विनाश नहीं, बल्कि मृतकों या विनाश का क्षेत्र अभिप्रेत हो सकता है। ‘अबद्दोन’ मूल शब्द की साहित्यिक प्रतिध्वनि बनाए रखता है, जबकि पाद-टिप्पणी संभावित अर्थ स्पष्ट करती है।
- issue: दोनों अर्ध-पंक्तियों के बीच निहित संबंध
  choice: दूसरी अर्ध-पंक्ति को ‘या’ से जोड़ना
  alternative: ‘और’ से जोड़ना, अथवा बिना संयोजक के समानांतर रखना
  rationale: इब्रानी में दूसरी अर्ध-पंक्ति में क्रिया लुप्त है और स्पष्ट संयोजक नहीं है। हिन्दी में ‘या’ एक ही आलंकारिक प्रश्न के दो समानांतर पक्षों को स्वाभाविक रूप से जोड़ता है; इसे अलग वैकल्पिक दावा नहीं समझना चाहिए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक रखी गई है। परमेश्वर को संबोधन में ‘तेरे/तेरी’ भजन की सीधी और निकट संबोधन-शैली को बनाए रखता है। पाद-टिप्पणी का चिह्न उसी शब्द ‘अबद्दोन’ पर रखा गया है जिसकी व्याख्या पाद-टिप्पणी करती है।
