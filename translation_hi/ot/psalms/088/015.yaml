  text: I am afflicted and near death from my youth[a]; I bear your terrors; I am overwhelmed.
translation:
  language: hi
  text: 'मैं युवावस्था से पीड़ित और मृत्यु के निकट हूँ;

    मैं तेरे आतंक सहता आया हूँ; मैं अभिभूत हूँ।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अंतिम इब्रानी क्रिया का अर्थ अनिश्चित है। इसका अनुवाद “मैं व्याकुल हूँ,” “मैं भ्रमित हूँ,” या “मैं नष्ट-सा हो गया हूँ” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עָנִי
  choice: पीड़ित
  rationale: विलाप के प्रसंग में यह शब्द आर्थिक निर्धनता से अधिक दुःख और दुर्दशा की अवस्था बताता है।
- source_word: וְגֹוֵעַ
  choice: मृत्यु के निकट
  rationale: גוע का कृदंत रूप मरने या प्राण निकलने की जारी अवस्था व्यक्त करता है; यह हिंदी में स्वाभाविक रूप से निकट मृत्यु की दशा बताता है।
- source_word: מִנֹּעַר
  choice: बचपन से ही
  rationale: यह आरंभिक आयु से चली आ रही अवस्था को दर्शाता है; आधुनिक हिंदी में ‘बचपन से ही’ सहज और स्पष्ट है।
- source_word: נָשָׂאתִי
  choice: सहता आया हूँ
  rationale: נשׂא का मूल भाव उठाना या ढोना है; यहाँ आतंक को लंबे समय से सहने का भाव है। पूर्ण क्रिया के साथ वर्तमान तक जारी पीड़ा को हिंदी में ‘सहता आया हूँ’ व्यक्त करता है।
- source_word: אֵמֶיךָ
  choice: तेरे आतंक
  rationale: बहुवचन संज्ञा भयावह अनुभवों या आतंक को दर्शाती है। द्वितीय पुरुष प्रत्यय को सीधे रखते हुए परमेश्वर से संबोधन और उससे जुड़ी भयावहता को नरम नहीं किया गया है।
- source_word: אָפוּנָה
  choice: मैं व्याकुल हूँ
  rationale: यह दुर्बोध रूप अभिभूत, भ्रमित या असहाय हो जाने का संकेत दे सकता है। ‘व्याकुल हूँ’ संदर्भगत मानसिक और अस्तित्वगत संकट को व्यक्त करता है, पर कठिन रूप का अर्थ अत्यधिक निश्चित नहीं करता।
theological_decisions:
- issue: ‘तेरे आतंक’ का संबंध
  choice: वाक्य में आतंक को सीधे परमेश्वर से संबद्ध रखा गया है।
  alternative: इसे केवल परमेश्वर की उपस्थिति में अनुभव किया गया भय समझना।
  rationale: द्वितीय पुरुष प्रत्यय स्वाभाविक रूप से इन आतंकों को परमेश्वर से संबंधित बताता है। अनुवाद विलाप में परमेश्वर की भूमिका से उत्पन्न तनाव को कम या स्पष्ट करके समाप्त नहीं करता।
translation_notes:
  register: आधुनिक, सरल और गरिमापूर्ण हिंदी; परमेश्वर के लिए निकट संबोधन ‘तेरे’ रखा गया है, जो भजन की सीधी प्रार्थना और भावनात्मक तीव्रता के अनुरूप है। काव्यात्मक समानांतरता बनाए रखने के लिए पद को दो पंक्तियों में रखा गया है।
