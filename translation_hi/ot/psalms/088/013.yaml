  yaml_path: translation/ot/psalms/088/013.yaml
  text: But as for me[a], O Yahweh, I cry out to you; in the morning my prayer comes before you.
translation:
  language: hi
  text: परन्तु मैं, हे याहवे, तुझे पुकारता हूँ; सुबह मेरी प्रार्थना तेरे सामने आती है[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘तेरे पास पहुँचती है’ अथवा ‘तेरे आगे जाती है।’ हिब्रू क्रिया में सामने आने, मिलने या पहले पहुँचने का भाव हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: परन्तु मैं
  rationale: संयोजक और स्वतंत्र सर्वनाम मिलकर पिछले संदर्भ के विपरीत भजनकार पर बल देते हैं; यह हिन्दी में स्वाभाविक ढंग से उस विरोध और जोर को बनाए रखता है।
- source_word: אֵלֶיךָ
  choice: तेरी
  rationale: שִׁוַּעְתִּי के साथ दिशा और संबोधन को हिन्दी मुहावरे ‘तेरी दुहाई देना’ में स्वाभाविक रूप से व्यक्त किया गया है।
- source_word: יְהוָה
  choice: हे यहोवा
  rationale: मूल पाठ में आए परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय प्रचलित हिन्दी लिप्यंतरण ‘यहोवा’ में रखा गया है।
- source_word: שִׁוַּעְתִּי
  choice: दुहाई देता हूँ
  rationale: क्रिया संकट में सहायता के लिए पुकारने का भाव रखती है। काव्यात्मक प्रार्थना के संदर्भ में हिन्दी वर्तमान काल सतत विनती को स्वाभाविक रूप से व्यक्त करता है।
- source_word: וּבַבֹּקֶר
  choice: भोर को
  rationale: यह समय-सूचक पद सुबह के आरम्भ को संक्षिप्त, काव्यात्मक और स्पष्ट आधुनिक हिन्दी में व्यक्त करता है।
- source_word: תְּפִלָּתִי
  choice: मेरी प्रार्थना
  rationale: एकवचन संज्ञा और प्रथम पुरुष संबंध को सीधे बनाए रखा गया है।
- source_word: תְקַדְּמֶךָּ
  choice: तेरे सामने आएगी
  rationale: קדם की हिफ़ील क्रिया यहाँ सामने आने, मिलने या पहले पहुँचने का अर्थ दे सकती है। संदर्भ में ‘तेरे सामने आएगी’ प्रार्थना के परमेश्वर की उपस्थिति में पहुँचने की छवि को स्वाभाविक रूप से बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: पद में चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम सीधे प्रयुक्त है। ‘यहोवा’ हिन्दी पाठकों में स्थापित नाम-रूप है और इसे सामान्य उपाधि ‘प्रभु’ से नहीं बदलता।
- issue: תְקַדְּמֶךָּ का काल और भाव
  choice: तेरे सामने आएगी
  alternative: तेरे सामने आती है; तुझसे मिलने पहुँचती है; तुझसे पहले पहुँचती है
  rationale: हिब्रू अपूर्ण क्रिया सुबह की अपेक्षित या बार-बार होने वाली क्रिया व्यक्त कर सकती है। भविष्य रूप प्रार्थना की आशापूर्ण गति को रखता है, जबकि ‘सामने आना’ क्रिया की स्थानिक अस्पष्टता को अनावश्यक रूप से नहीं सुलझाता।
