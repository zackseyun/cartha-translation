  yaml_path: translation/ot/psalms/061/002.yaml
  text: From the end of the earth I call to you when my heart grows faint[b][a]; lead me to a rock higher than I.
translation:
  language: hi
  text: 'पृथ्वी के छोर से मैं तुझे पुकारता हूँ,

    जब मेरा हृदय शिथिल पड़ जाता है[a];

    मुझे उस चट्टान तक ले चल जो मुझसे ऊँची है[b]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जब मेरा हृदय अभिभूत हो जाता है।”
    reason: lexical_alternative
  - marker: b
    text: या, “उस चट्टान तक जो मेरी पहुँच से बहुत ऊँची है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקְצֵה הָאָרֶץ
  choice: पृथ्वी के छोर से
  rationale: קָצֶה सीमा, किनारे या छोर को दर्शाता है। काव्यात्मक संदर्भ में הָאָרֶץ के लिए ‘पृथ्वी’ दूरी और चरम स्थिति—दोनों का भाव बनाए रखती है।
- source_word: אֵלֶיךָ אֶקְרָא
  choice: मैं तुझे पुकारता हूँ
  rationale: קרא का अर्थ पुकारना या सहायता के लिए आवाज़ देना है। ‘पुकारता हूँ’ प्रार्थना की तात्कालिकता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בַּעֲטֹף לִבִּי
  choice: जब मेरा हृदय मूर्छित हो जाता है
  rationale: עטף यहाँ भीतर की शक्ति चुकने, निढाल होने या अभिभूत होने का भाव देता है। ‘मूर्छित हो जाता है’ हृदय के क्षीण पड़ने की काव्यात्मक छवि रखता है; ‘व्याकुल हो जाता है’ वैकल्पिक अर्थ के रूप में टिप्पणी में दिया गया है।
- source_word: בְּצוּר
  choice: उस चट्टान तक
  rationale: צוּר का ठोस अर्थ ‘चट्टान’ है और इससे सुरक्षा तथा आश्रय का रूपकात्मक संकेत मिलता है। בְ को गति-सूचक क्रिया के साथ गंतव्य के रूप में ‘तक’ कहना स्वाभाविक है।
- source_word: יָרוּם מִמֶּנִּי
  choice: जो मुझसे ऊँची है
  rationale: רוּם ऊँचा होने को और מִמֶּנִּי वक्ता से तुलना को व्यक्त करता है। यह रूप अक्षमता का अर्थ अनिवार्य किए बिना मूल तुलना बनाए रखता है।
- source_word: תַנְחֵנִי
  choice: मुझे ... ले चल
  rationale: Hiphil रूप נחה का अर्थ अगुवाई करना या मार्ग दिखाना है। ‘ले चल’ प्रार्थना में निर्भरता और निर्दिष्ट गंतव्य—दोनों को सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ‘चट्टान’ का रूपकात्मक अर्थ
  choice: मुख्य पाठ में ‘चट्टान’ की ठोस छवि को सुरक्षित रखा गया है, उसे ‘सुरक्षित स्थान’ या ‘शरण’ कहकर स्पष्ट नहीं किया गया।
  alternative: मुझे किसी सुरक्षित स्थान/शरण तक ले चल।
  rationale: मूल इब्रानी צוּר की काव्यात्मक छवि स्वयं सुरक्षा और शरण का संकेत देती है। इसे बनाए रखने से परमेश्वर-संबंधी धार्मिक अनुगूँज बनी रहती है और व्याख्या को पाठ में आरोपित नहीं किया जाता।
- issue: יָרוּם מִמֶּנִּי में तुलना या अगम्यता
  choice: ‘जो मुझसे ऊँची है’
  alternative: ‘जो मेरी पहुँच से बहुत ऊँची है’
  rationale: मूल वाक्य स्पष्ट रूप से ऊँचाई की तुलना करता है, पर ‘मेरी पहुँच से बाहर’ का भाव संभव होते हुए भी अनिवार्य नहीं है। इसलिए मुख्य पाठ में तुलना और टिप्पणी में अगम्यता की वैकल्पिक समझ रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, प्रार्थनात्मक और काव्यात्मक रूप। ‘तुझे’ भजन की सीधी, आत्मीय एकवचन संबोधन-शैली को बनाए रखता है। पंक्ति-विभाजन इब्रानी काव्य की समानांतर गति को स्पष्ट करता है।
