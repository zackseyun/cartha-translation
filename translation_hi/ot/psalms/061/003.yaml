base_translation:
  language: en
  yaml_path: translation/ot/psalms/061/003.yaml
  text: For you have been a refuge for me, a strong tower against the enemy.
translation:
  language: hi
  text: 'क्योंकि तू मेरे लिए शरणस्थान रहा है,

    शत्रु के विरुद्ध एक सुदृढ़ मीनार।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַחְסֶה
  choice: शरणस्थान
  rationale: यह संज्ञा आश्रय और सुरक्षा के स्थान को व्यक्त करती है; ‘शरणस्थान’ पद्यात्मक और सहज दोनों है।
- source_word: מִגְדַּל עֹז
  choice: दृढ़ गढ़
  rationale: शाब्दिक रूप से ‘सामर्थ्य का मीनार’; यहाँ सुरक्षित और सुदृढ़ रक्षा-स्थान का बिंब है। ‘दृढ़ गढ़’ हिंदी में उस भाव को स्वाभाविक रूप से रखता है।
- source_word: מִפְּנֵי אוֹיֵב
  choice: शत्रु के सामने
  rationale: מִפְּנֵי में ‘के सामने/से बचाव में’ का स्थानिक-सुरक्षात्मक भाव है। ‘शत्रु के सामने’ मूल बिंब और संभावित अर्थ-तनाव को ‘शत्रु के विरुद्ध’ की अपेक्षा अधिक निकटता से सुरक्षित रखता है।
theological_decisions:
- issue: परमेश्वर को शरणस्थान और दृढ़ गढ़ कहना
  choice: रूपकों को प्रत्यक्ष रूप में बनाए रखा गया
  alternative: ‘तूने मुझे शरण और सुरक्षा दी है’
  rationale: मूल पाठ परमेश्वर की सुरक्षा को अमूर्त कथन में नहीं बदलता, बल्कि उन्हें स्वयं शरणस्थान और मजबूत मीनार/गढ़ कहता है; इसलिए रूपकीय पहचान सुरक्षित रखी गई।
translation_notes:
  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण और काव्यात्मक शैली। भजन की परमेश्वर से सीधी एकवचन संबोधन-शैली के अनुरूप ‘तू’ रखा गया है।
