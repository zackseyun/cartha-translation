source:
  edition: WLC
  text: יָמִ֣ים עַל יְמֵי מֶ֣לֶךְ תּוֹסִ֑יף שְׁ֝נוֹתָ֗י/ו כְּמוֹ דֹ֥ר וָ/דֹֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/061/006.yaml
  text: May you add days to the days of the king[b][a]; may his years be like generation after generation.
translation:
  language: hi
  text: राजा के दिनों में और दिन जोड़ दे[b][a]; उसके वर्ष पीढ़ी-दर-पीढ़ी हों।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तू राजा के दिनों में और दिन जोड़ेगा; उसके वर्ष पीढ़ी-दर-पीढ़ी होंगे।” इब्रानी क्रियारूप को प्रार्थना के बजाय भविष्य के कथन के रूप में भी समझा जा सकता है।
    reason: alternative_reading
  - marker: b
    text: 'इब्रानी मुहावरा: “पीढ़ी और पीढ़ी,” अर्थात लगातार आने वाली पीढ़ियों तक।'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָמִים עַל יְמֵי מֶלֶךְ
  choice: राजा की आयु में और दिन
  rationale: शाब्दिक रूप से ‘राजा के दिनों पर दिन’ है। आधुनिक हिन्दी में ‘आयु में और दिन’ जोड़ने और दीर्घ जीवन—दोनों भावों को स्वाभाविक रूप से व्यक्त करता है, जबकि ‘दिन’ की इब्रानी छवि भी बनाए रखता है।
- source_word: תּוֹסִיף
  choice: बढ़ा दे
  rationale: हिफ़ील रूप का अर्थ ‘जोड़ना/बढ़ाना’ है। भजन के प्रार्थनात्मक संदर्भ में इसे परमेश्वर से की गई विनती के रूप में लिया गया है; भविष्यसूचक पाठ की सम्भावना पादटिप्पणी में रखी गई है।
- source_word: שְׁנוֹתָיו
  choice: उसके वर्ष
  rationale: पुंलिंग एकवचन प्रत्यय का स्वाभाविक संकेत राजा की ओर है।
- source_word: כְּמוֹ דֹר וָדֹר
  choice: पीढ़ी-दर-पीढ़ी
  rationale: ‘पीढ़ी और पीढ़ी’ successive generations के लिए इब्रानी मुहावरा है। ‘पीढ़ी-दर-पीढ़ी’ आधुनिक हिन्दी में उसकी पुनरावृत्त और दीर्घकालिक शक्ति को सहजता से व्यक्त करता है।
theological_decisions:
- issue: यह पंक्ति राजा की दीर्घायु के लिए विनती है या भविष्य का कथन
  choice: 'विनती के रूप में: ‘बढ़ा दे’'
  alternative: 'भविष्य के कथन के रूप में: ‘तू बढ़ाएगा’'
  rationale: क्रिया का अपूर्ण रूप दोनों अर्थ ग्रहण कर सकता है, पर भजन का प्रार्थनात्मक प्रसंग विनती का समर्थन करता है। वास्तविक व्याकरणिक अस्पष्टता पादटिप्पणी में सुरक्षित रखी गई है।
- issue: ‘पीढ़ी-दर-पीढ़ी’ का राजा के वर्षों से सम्बन्ध
  choice: दीर्घ और निरंतर बने रहने की काव्यात्मक कामना
  alternative: हर अगली पीढ़ी तक शाब्दिक व्यक्तिगत जीवन
  rationale: इब्रानी काव्य में यह अत्यन्त दीर्घ स्थायित्व का मुहावरा है; अनुवाद इसके धर्मवैज्ञानिक आशय को किसी विशेष राजवंशीय या मसीही व्याख्या तक सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और प्रार्थनात्मक रखी गई है। ‘आयु में और दिन’ मूल के ‘दिनों पर दिन’ को शब्दशः कठोर बनाए बिना उसकी छवि बचाता है; ‘पीढ़ी-दर-पीढ़ी’ प्रचलित हिन्दी मुहावरा है।
