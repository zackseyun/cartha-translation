lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: प्रधान गायक के लिए
  rationale: भजनों के शीर्षकों में यह पद संगीत-प्रस्तुति की अगुवाई या देखरेख करने वाले व्यक्ति को दर्शाता है। ‘प्रधान गायक’ आधुनिक हिन्दी में स्पष्ट और संगीतमय संदर्भ के अनुकूल है।
- source_word: עַל
  choice: के साथ
  rationale: इस शीर्षक में यह संबंधसूचक शब्द संभवतः संगीत-संगति का संकेत देता है; हिन्दी में ‘के साथ’ वाद्य-संगति को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: נְגִינַת
  choice: तार वाले वाद्यों
  rationale: यह शब्द तारों से उत्पन्न संगीत या तार वाले वाद्यों की संगति को सूचित करता है। चुना हुआ रूप अर्थ को सरल और स्पष्ट हिन्दी में व्यक्त करता है।
- source_word: לְדָוִד
  choice: दाऊद का
  rationale: भजनों के शीर्षकों में ‘לְ’ लेखन, संबंध या समर्पण का संकेत दे सकता है। ‘दाऊद का’ इस लचीलेपन को ‘दाऊद द्वारा’ की अपेक्षा बेहतर बनाए रखता है।
theological_decisions:
