  choice: दाऊद का
  alternative: दाऊद द्वारा; दाऊद के लिए
  rationale: इब्रानी रचना प्रत्यक्ष लेखकत्व को अनिवार्य रूप से निश्चित नहीं करती। चुना हुआ अनुवाद लेखकत्व, संबंध और समर्पण की संभावनाओं को खुला रखता है।
