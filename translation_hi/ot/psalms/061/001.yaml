- source_word: שִׁמְעָה
  choice: सुन
  rationale: שׁמע का काल आज्ञार्थक है और परमेश्वर को संबोधित है। हिंदी में “सुन” सीधा, स्वाभाविक और प्रार्थना के अनुरूप है।
- source_word: אֱלֹהִים
  choice: हे परमेश्वर
  rationale: यहाँ शब्द संबोधन के रूप में आया है। “हे परमेश्वर” आधुनिक हिंदी के गरिमापूर्ण प्रार्थना-रजिस्टर में स्वाभाविक है।
- source_word: רִנָּתִי
  choice: मेरी पुकार
  rationale: רִנָּה ऊँची या गूँजती पुकार, जयघोष अथवा गीत को सूचित कर सकता है। यहाँ “मेरी प्रार्थना” के समानांतर विनती का संदर्भ होने के कारण “मेरी पुकार” उपयुक्त है और मूल की अर्थ-व्याप्ति को टिप्पणी में सुरक्षित रखता है।
- source_word: הַקְשִׁיבָה
  choice: ध्यान दे
  rationale: קשׁב का हिफ़ील आज्ञार्थक रूप ध्यानपूर्वक सुनने की अपील करता है। “ध्यान दे” पहले खंड के “सुन” से अंतर बनाए रखते हुए इस गहनता को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: תְּפִלָּתִי
  choice: मेरी प्रार्थना
  rationale: यह प्रार्थना के लिए सामान्य इब्रानी शब्द है। “मेरी प्रार्थना” सीधा अर्थ देता और समानांतरता बनाए रखता है।
