  yaml_path: translation/ot/psalms/061/005.yaml
  text: For you[a], O God, have heard my vows[b]; you have given me the inheritance of those who fear your name.
translation:
  language: hi
  text: क्योंकि, हे परमेश्वर, आपने मेरी मन्नतों को सुना है; आपने आपके नाम का भय मानने वालों की विरासत[a] दी है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'हिब्रू में ‘मुझे’ स्पष्ट रूप से नहीं लिखा है। इसलिए इसका अनुवाद यह भी हो सकता है: “आपने अपने नाम का भय मानने वालों की विरासत मुझे दी है।”'
    reason: alternative_reading
  - marker: b
    text: “आपके नाम का भय मानने वाले” वे लोग हैं जो परमेश्वर के प्रति श्रद्धापूर्ण भय रखते हैं और उसी के अनुसार जीवन जीते हैं।
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन या विनती का आधार बताता है; ‘क्योंकि’ इसके कारणसूचक संबंध को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֱלֹהִים
  choice: हे परमेश्वर
  rationale: द्वितीय पुरुष के रूपों से सीधा संबोधन स्पष्ट है; ‘हे परमेश्वर’ हिंदी प्रार्थना-भाषा में स्वाभाविक और गरिमापूर्ण है।
- source_word: שָׁמַעְתָּ
  choice: आपने ... सुनी हैं
  rationale: पूर्ण क्रिया पहले घटित और अब भी प्रासंगिक सुनने को व्यक्त करती है; हिंदी में यह रूप स्वाभाविक है।
- source_word: לִנְדָרָי
  choice: मेरी मन्नतें
  rationale: נדר परमेश्वर से की गई गंभीर प्रतिज्ञा को दर्शाता है; ‘मन्नतें’ सामान्य हिंदी में समझ में आने वाला निकटतम धार्मिक शब्द है।
- source_word: נָתַתָּ
  choice: आपने ... दी है
  rationale: पूर्ण क्रिया को वर्तमान महत्त्व वाले संपन्न कार्य के रूप में व्यक्त किया गया है।
- source_word: יְרֻשַּׁת
  choice: विरासत
  rationale: यह प्राप्त पैतृक भाग, अधिकार या धरोहर का बोध कराता है; ‘विरासत’ संक्षिप्त और व्यापक अर्थ वाला आधुनिक हिंदी शब्द है।
- source_word: יִרְאֵי שְׁמֶךָ
  choice: अपने नाम का भय मानने वालों
  rationale: यह परमेश्वर के प्रति श्रद्धापूर्ण भय रखने वाले लोगों को दर्शाता है; ‘भय मानना’ मूल की धार्मिक गंभीरता बनाए रखता है।
theological_decisions:
- issue: नָתַתָּ יְרֻשַּׁת יִרְאֵי שְׁמֶךָ में विरासत पाने वाला
  choice: 'संदर्भ से ‘मुझे’ जोड़कर: ‘आपने ... विरासत मुझे दी है’'
  alternative: ‘आपने अपने नाम का भय मानने वालों की विरासत दी है’—बिना किसी स्पष्ट प्राप्तकर्ता के
  rationale: हिब्रू में ‘मुझे’ स्पष्ट रूप से नहीं है, पर प्रथम पुरुष वक्ता और वाक्य का संदर्भ इसे सहज रूप से निहित कर सकते हैं। प्राकृतिक हिंदी के लिए इसे मुख्य पाठ में रखा गया है, जबकि मूल की व्याकरणिक अस्पष्टता पादटिप्पणी में सुरक्षित है।
- issue: ‘नाम का भय मानना’ का अर्थ
  choice: मूल मुहावरे को मुख्य पाठ में बनाए रखना
  alternative: ‘आपका आदर करने वालों’ या ‘आपके प्रति श्रद्धा रखने वालों’
  rationale: ‘भय’ मूल की धार्मिक गंभीरता और श्रद्धापूर्ण विस्मय दोनों को बनाए रखता है; अर्थ पादटिप्पणी में स्पष्ट किया गया है।
translation_notes:
  register: आधुनिक मानक हिंदी में प्रार्थनापूर्ण, गरिमापूर्ण और सामान्य पाठकों के लिए स्पष्ट शैली। परमेश्वर के लिए आदरसूचक ‘आप’ रखा गया है। ‘मन्नतें’ और ‘विरासत’ सहज शब्द हैं; दोनों पादटिप्पणी-चिह्न संबंधित पदबंधों के बाद साथ रखे गए हैं।
