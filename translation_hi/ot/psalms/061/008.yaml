base_translation:
  language: en
  yaml_path: translation/ot/psalms/061/008.yaml
  text: So I will sing praise to your name forever[a], to fulfill my vows day by day.
translation:
  language: hi
  text: इसलिए मैं सदा आपके नाम का स्तुतिगान करूँगा, ताकि मैं हर दिन अपनी मन्नतें पूरी करूँ[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपनी मन्नतें चुकाऊँ।” इब्रानी क्रिया मन्नतों के संदर्भ में उन्हें चुकाने या अधिक व्यापक अर्थ में पूरा करने—दोनों को व्यक्त कर सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כֵּן
  choice: इस प्रकार
  rationale: यह पद पिछले विश्वास और प्रार्थना के परिणाम अथवा संकल्प को व्यक्त करता है; ‘इस प्रकार’ उस संबंध को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: אֲזַמְּרָה
  choice: स्तुतिगान करूँगा
  rationale: पिएल रूप यहाँ संगीत के साथ स्तुति गाने का भाव देता है; ‘स्तुतिगान’ इसे संक्षेप और गरिमा के साथ व्यक्त करता है।
- source_word: שִׁמְךָ
  choice: आपके नाम का
  rationale: ‘नाम’ की मूल अभिव्यक्ति सुरक्षित रखी गई है; प्रसंग में यह परमेश्वर के प्रकट चरित्र और प्रतिष्ठा को भी समेट सकती है।
- source_word: לָעַד
  choice: सदा
  rationale: यह निरंतर और स्थायी अवधि को व्यक्त करता है; ‘सदा’ काव्यात्मक तथा सहज हिन्दी है।
- source_word: לְשַׁלְּמִי
  choice: पूरी करूँगा
  rationale: मन्नतों के साथ שׁלם का अर्थ उन्हें चुकाना अथवा पूरा करना है; ‘पूरी करना’ आधुनिक हिन्दी में दायित्व निभाने का स्पष्ट भाव देता है।
- source_word: נְדָרַי
  choice: अपनी मन्नतें
  rationale: נדר धार्मिक प्रतिज्ञा या मन्नत को दर्शाता है; ‘मन्नत’ सामान्य हिन्दी पाठक के लिए स्वाभाविक और संदर्भानुकूल है।
- source_word: יוֹם יוֹם
  choice: दिन-प्रतिदिन
  rationale: शब्द की पुनरावृत्ति नियमित निरंतरता बताती है; ‘दिन-प्रतिदिन’ इस आवर्ती बल को बनाए रखता है।
theological_decisions:
- issue: मन्नतों को ‘पूरा करना’ या ‘चुकाना’
  choice: पूरी करूँगा
  alternative: चुकाऊँगा
  rationale: दोनों अर्थ स्रोत क्रिया में संभव हैं। मुख्य पाठ में सहज व्यापक अर्थ ‘पूरी करूँगा’ रखा गया है और अधिक औपचारिक/प्रतिदानात्मक विकल्प पादटिप्पणी में दिया गया है, ताकि धार्मिक दायित्व का अर्थ संकीर्ण न हो।
translation_notes:
  register: आधुनिक मानक हिन्दी में भक्तिपूर्ण, गरिमामय और सामान्य पाठक के लिए सुबोध शैली। परमेश्वर के लिए आदरसूचक ‘आप’ रखा गया है। काव्यात्मक प्रवाह के लिए ‘स्तुतिगान’, ‘सदा’ और ‘दिन-प्रतिदिन’ चुने गए हैं।
