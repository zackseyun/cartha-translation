  text: May he sit enthroned before God forever[b][a]; appoint steadfast love and truth to guard him.
translation:
  language: hi
  text: वह सदा परमेश्वर के सामने सिंहासन पर विराजमान रहे[a]; अटल प्रेम और सत्य[b] को नियुक्त कर कि वे उसकी रक्षा करें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह परमेश्वर के सामने सदा वास करे।” इब्रानी क्रिया का अर्थ “बैठना,” “बने रहना” या “वास करना” हो सकता है; इस राजकीय संदर्भ में सिंहासन पर विराजमान रहने का भाव संभव है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ “सत्य” का अनुवाद “विश्वासयोग्यता” भी किया जा सकता है। इब्रानी में “अटल प्रेम और सत्य/विश्वासयोग्यता” का युग्म परमेश्वर के निष्ठावान प्रेम और भरोसेमंद चरित्र को व्यक्त करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵשֵׁב
  choice: सिंहासन पर विराजमान रहे
  rationale: ישׁב का अर्थ बैठना, बने रहना या वास करना हो सकता है। राजकीय भजन और प्रार्थनात्मक संदर्भ में यह चयन राजा के स्थायी शासन का संकेत देता है, जबकि वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: עוֹלָם
  choice: सदा
  rationale: यहाँ עוֹלָם दीर्घकालीन, निरंतर अवधि व्यक्त करता है; ‘सदा’ आधुनिक हिन्दी में स्वाभाविक और काव्यात्मक है।
- source_word: לִפְנֵי אֱלֹהִים
  choice: परमेश्वर के सामने
  rationale: यह मूल के ‘परमेश्वर के सम्मुख/उपस्थिति में’ अर्थ को संक्षिप्त और स्पष्ट रूप में बनाए रखता है।
- source_word: חֶסֶד
  choice: अटल प्रेम
  rationale: חסד में प्रेम के साथ निष्ठा और स्थिरता का भाव है; ‘अटल प्रेम’ इस व्यापक अर्थ को सहज हिन्दी में व्यक्त करता है।
- source_word: אֱמֶת
  choice: सत्य
  rationale: אמת का मूल अर्थ ‘सत्य’ है, पर इस युग्म में ‘विश्वासयोग्यता’ भी प्रबल संभावना है; उसे पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: מַן
  choice: नियुक्त कर
  rationale: इस रूप को सामान्यतः מנה से निकला आज्ञार्थक माना जाता है, जिसमें परमेश्वर से इन गुणों को रक्षक ठहराने की विनती है।
- source_word: יִנְצְרֻהוּ
  choice: उसकी रक्षा के लिए
  rationale: נצר का अर्थ रक्षा करना, सुरक्षित रखना या निगरानी करना है। बहुवचन क्रिया प्रेम और सत्य को मानवीकृत रक्षकों के रूप में प्रस्तुत करती है।
