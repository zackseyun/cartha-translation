  choice: ‘अटल प्रेम और सत्य’—परमेश्वर के मानवीकृत गुण
  alternative: ‘अटल प्रेम और विश्वासयोग्यता’; अथवा ‘करुणा और सत्य’
  rationale: यह इब्रानी युग्म परमेश्वर के निष्ठावान प्रेम और भरोसेमंद चरित्र को व्यक्त करता है। मुख्य पाठ ‘सत्य’ की शाब्दिक पारदर्शिता रखता है और संदर्भगत विकल्प ‘विश्वासयोग्यता’ पादटिप्पणी में देता है।
