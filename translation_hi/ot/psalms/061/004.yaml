translation:
  language: hi
  text: मैं सदा तेरे तम्बू में निवास करूँ[a]; तेरे पंखों की ओट में शरण लूँ। सेला
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद “मैं सदा तेरे तम्बू में निवास करूँगा” भी हो सकता है; इब्रानी रूप प्रबल इच्छा या दृढ़ निश्चय व्यक्त कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אָג֣וּרָה
  choice: मैं ... निवास करूँ
  rationale: यह प्रथम पुरुष एकवचन कोहोर्टेटिव रूप है, जो प्रार्थनापूर्ण इच्छा या दृढ़ अभिलाषा व्यक्त करता है। हिंदी का संभावनार्थक रूप इस भाव को स्वाभाविक ढंग से बनाए रखता है।
- source_word: בְ֭אָהָלְךָ
  choice: तेरे तम्बू में
  rationale: אָהֶל का ठोस अर्थ ‘तम्बू’ है। यह परमेश्वर के निवास या पवित्रस्थान की ओर संकेत कर सकता है, पर अनुवाद मूल रूपक को बिना अधिक व्याख्या के बनाए रखता है।
- source_word: עוֹלָמִים
  choice: सदा
  rationale: यह बहुवचन रूप दीर्घ, अनवरत अवधि को बल देता है। ‘सदा’ आधुनिक हिंदी में संक्षिप्त और स्वाभाविक है।
- source_word: אֶֽחֱסֶה
  choice: शरण लूँ
  rationale: חסה का अर्थ शरण लेना है। पहले खंड के कोहोर्टेटिव के समानांतर यह रूप प्रार्थना और इच्छा का भाव व्यक्त करता है।
- source_word: בְסֵתֶר
  choice: ओट में
  rationale: סֵתֶר छिपाव और सुरक्षा देने वाले स्थान को दर्शाता है। ‘ओट’ पंखों के रूपक के साथ सहज है और दोनों अर्थों को समेटता है।
- source_word: כְּנָפֶיךָ
  choice: तेरे पंखों की
  rationale: मूल में शाब्दिक रूप से ‘तेरे पंख’ हैं। ‘तेरे पंखों की ओट में’ इब्रानी संबंध और संरक्षण के रूपक दोनों को स्वाभाविक हिंदी में सुरक्षित रखता है।
- source_word: סֶּלָה
  choice: सेला
  rationale: इस उपासना-संबंधी या संगीतात्मक संकेत का ठीक अर्थ अनिश्चित है, इसलिए इसका लिप्यंतरण किया गया है।
theological_decisions:
- issue: ‘तेरे तम्बू’ में पवित्रस्थान का बिंब
  choice: ठोस रूपक ‘तेरे तम्बू’ को बनाए रखा गया है।
  alternative: तेरे पवित्रस्थान में / तेरे निवास में
  rationale: यह बिंब परमेश्वर की उपस्थिति और पवित्रस्थान की ओर संकेत कर सकता है, पर मूल पाठ ‘तम्बू’ कहता है। अधिक विशिष्ट व्याख्या थोपने के बजाय वास्तविक रूपक सुरक्षित रखा गया है।
- issue: क्रियाओं में इच्छा या निश्चय
  choice: ‘निवास करूँ’ और ‘शरण लूँ’ द्वारा प्रार्थनापूर्ण इच्छा व्यक्त की गई है।
  alternative: मैं निवास करूँगा / मैं शरण लूँगा
  rationale: पहली इब्रानी क्रिया स्पष्ट रूप से कोहोर्टेटिव है और दूसरी उसके समानांतर है। फिर भी रूपों में इच्छा तथा दृढ़ निश्चय के बीच कुछ अर्थगत तनाव है, जिसे पादटिप्पणी में दर्शाया गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और काव्यात्मक हिंदी। परमेश्वर के लिए एकवचन आत्मीय संबोधन ‘तेरे’ रखा गया है, जो भजन की सीधी प्रार्थना के अनुकूल है। ‘तम्बू’, ‘ओट’ और ‘पंख’ जैसे ठोस बिंब सुरक्षित रखे गए हैं।
