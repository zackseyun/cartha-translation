source:
  edition: WLC
  text: שִׁ֗יר הַֽ/מַּ֫עֲל֥וֹת אֵ֭לֶי/ךָ נָשָׂ֣אתִי אֶת עֵינַ֑/י הַ֝/יֹּשְׁבִ֗י בַּ/שָּׁמָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/123/000.yaml
  text: 'A Song of Ascents[a].

    To you I have lifted up my eyes[b],

    you who sit in the heavens.'
translation:
  language: hi
  text: 'चढ़ाइयों का गीत[a]


    हे स्वर्गों में विराजमान[b],

    मैंने अपनी आँखें तेरी ओर उठाई हैं।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस शीर्षक का अनुवाद “आरोहणों का गीत” भी हो सकता है। संभवतः यह यरूशलेम की ओर चढ़ने वाली तीर्थयात्राओं से जुड़ा था, पर शीर्षक का सटीक आशय निश्चित नहीं है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक अर्थ “स्वर्गों में बैठनेवाले” या “निवास करनेवाले” है; यहाँ राजकीय भाव भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: चढ़ाइयों का गीत
  rationale: यह इब्रानी पदबंध का निकट और बोधगम्य अनुवाद है। ‘चढ़ाइयाँ’ ऊपर जाने, तीर्थयात्रा अथवा क्रमिक आरोहण की ओर संकेत कर सकती हैं; मूल की बहुअर्थकता को शीर्षक में बनाए रखा गया है।
- source_word: נָשָׂאתִי אֶת־עֵינַי
  choice: मैंने अपनी आँखें ... उठाई हैं
  rationale: पूर्ण क्रिया को वर्तमान परिणाम सहित स्वाभाविक हिन्दी में व्यक्त करता है और प्रार्थनापूर्वक ऊपर देखने की मूल छवि बनाए रखता है।
- source_word: הַיֹּשְׁבִי
  choice: विराजमान
  rationale: मूलतः ‘बैठनेवाला/निवास करनेवाला’ अर्थ देने वाला कृदन्त है। इस संबोधन में ‘विराजमान’ गरिमापूर्ण और स्वाभाविक है तथा संभावित राजकीय भाव को बिना अत्यधिक स्पष्ट किए व्यक्त करता है।
- source_word: בַּשָּׁמָיִם
  choice: स्वर्गों में
  rationale: इब्रानी शब्द का रूप बहुवचन है; इसलिए उसे एकवचन ‘स्वर्ग में’ बनाकर सरल नहीं किया गया।
theological_decisions:
- issue: परमेश्वर के स्वर्गीय आसन का राजकीय भाव
  choice: ‘विराजमान’ द्वारा संकेतित, पर ‘सिंहासन पर विराजमान’ नहीं जोड़ा गया
  alternative: ‘स्वर्गों में बैठनेवाले’ अथवा ‘स्वर्गों में सिंहासन पर विराजमान’
  rationale: पहला विकल्प हिन्दी में अपेक्षाकृत सपाट है, जबकि दूसरा मूल में न आए ‘सिंहासन’ को स्पष्ट रूप से जोड़ देता है। चुना गया रूप बैठने/निवास करने और शासन करने के संभावित दोनों भावों को खुला रखता है।
translation_notes:
  register: भाषा आधुनिक, प्रार्थनापरक और गरिमापूर्ण रखी गई है। परमेश्वर को संबोधित करने के लिए ‘तेरी’ का पारंपरिक निकटवर्ती एकवचन रूप प्रयुक्त है; यह अनादर नहीं, बल्कि मूल इब्रानी के सीधे एकवचन संबोधन को दर्शाता है। काव्य-पंक्तियों में संबोधन को पहले रखकर हिन्दी प्रवाह स्पष्ट किया गया है।
