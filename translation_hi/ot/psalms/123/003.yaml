base_translation:
  language: en
  yaml_path: translation/ot/psalms/123/003.yaml
  text: Be gracious to us[a], O Yahweh; be gracious to us[b], for we have had more than enough of contempt.
translation:
  language: hi
  text: हम पर कृपा कर[a], हे याहवे, हम पर कृपा कर; क्योंकि हम तिरस्कार से बहुत भर चुके हैं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “हम पर दया कर।” इब्रानी क्रिया का अर्थ कृपा, अनुग्रह या दया दिखाना हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “क्योंकि हम तिरस्कार से बहुत भर चुके हैं”; भाव यह है कि वे सीमा से अधिक तिरस्कार सह चुके हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: חָנֵּנוּ
  choice: हम पर कृपा कर
  rationale: חנן के आदेशात्मक रूप में अनुग्रह, कृपा या दया दिखाने की विनती है। ‘कृपा कर’ इस मूल भाव को स्वाभाविक और संक्षिप्त हिन्दी में रखता है।
- source_word: יְהוָה
  choice: हे याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को उपाधि से बदलने के बजाय हिन्दी में उसके उच्चारण का निकट लिप्यंतरण किया गया है; सम्बोधन के कारण ‘हे’ जोड़ा गया है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह कृपा की विनती का कारण प्रस्तुत करता है।
- source_word: רַב שָׂבַעְנוּ
  choice: हम ... से पूरी तरह भर चुके हैं
  rationale: शाब्दिक चित्र ‘बहुत अधिक भर जाने/तृप्त हो जाने’ का है। यह अनुवाद उस काव्यात्मक चित्र और सहन करने की सीमा पार हो जाने के भाव, दोनों को बनाए रखता है।
- source_word: בּוּז
  choice: तिरस्कार
  rationale: यह शब्द दूसरों द्वारा किए गए अपमानपूर्ण तिरस्कार या अवमानना को व्यक्त करता है; ‘तिरस्कार’ इस अमूर्त संज्ञा और भजन के गंभीर स्वर के अनुकूल है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम है। ‘याहवे’ उसे उपाधि से प्रतिस्थापित नहीं करता और ‘यहोवा’ की अपेक्षा प्रचलित विद्वत्तापूर्ण उच्चारण के अधिक निकट है।
- issue: חנן में कृपा और दया का अर्थ-क्षेत्र
  choice: कृपा कर
  alternative: हम पर दया कर
  rationale: सन्दर्भ में दया का भाव सम्भव है, पर क्रिया का मूल अर्थ कृपापूर्वक अनुकूलता दिखाना भी है। ‘कृपा कर’ इस व्यापकता को सुरक्षित रखता है और किसी विशेष प्रायश्चित्त-सन्दर्भ को अनावश्यक रूप से नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और प्रार्थनात्मक शैली रखी गई है। दोहराव मूल इब्रानी की तीव्र विनती को सुरक्षित रखता है; ‘भर चुके हैं’ मूल काव्यात्मक रूपक को बनाए रखता है।
