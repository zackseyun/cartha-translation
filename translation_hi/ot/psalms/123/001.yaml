source:
  edition: WLC
  text: שִׁ֗יר הַֽ/מַּ֫עֲל֥וֹת אֵ֭לֶי/ךָ נָשָׂ֣אתִי אֶת עֵינַ֑/י הַ֝/יֹּשְׁבִ֗י בַּ/שָּׁמָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/123/001.yaml
  text: A Song of Ascents[a]. To you I lift up my eyes[b], O you who are enthroned in the heavens.
translation:
  language: hi
  text: 'चढ़ाइयों का गीत[a]।


    हे स्वर्गों में विराजमान[b],

    मैं अपनी आँखें आपकी ओर उठाता हूँ।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “ऊपर चढ़ने का गीत।” शीर्षक से यह निश्चित नहीं होता कि “चढ़ाइयाँ” तीर्थयात्राओं, सीढ़ियों या किसी अन्य आरोहण को दर्शाती हैं।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “बैठनेवाले” या “रहनेवाले”; यहाँ “विराजमान” में राजकीय भाव भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיר
  choice: गीत
  rationale: שִׁיר का सीधा और स्वाभाविक हिन्दी अर्थ “गीत” है; यह भजन-समूह के शीर्षक में भी उपयुक्त है।
- source_word: הַמַּעֲלוֹת
  choice: चढ़ाइयों का
  rationale: बहुवचन संज्ञा का मूल बिंब सुरक्षित रखा गया है। इससे यह अनिर्णीत रहता है कि संकेत तीर्थयात्राओं, सीढ़ियों अथवा किसी अन्य प्रकार के आरोहण की ओर है।
- source_word: אֵלֶיךָ
  choice: आपकी ओर
  rationale: אֶל की दिशात्मकता को “की ओर” व्यक्त करता है। हिन्दी में परमेश्वर को सीधे संबोधित करते समय सम्मानसूचक “आप” स्वाभाविक और गरिमापूर्ण है; हिब्रू के एकवचन का अर्थ नहीं बदला गया है।
- source_word: נָשָׂאתִי
  choice: उठाता हूँ
  rationale: Qal पूर्ण रूप प्रार्थना में वर्तमान भक्तिपूर्ण क्रिया को व्यक्त कर सकता है। हिन्दी का वर्तमान काल यहाँ चल रहे निवेदन को स्वाभाविक ढंग से प्रस्तुत करता है।
- source_word: אֶת עֵינַי
  choice: अपनी आँखें
  rationale: मूल पाठ का ठोस काव्य-बिंब रखा गया है; “दृष्टि” कहने से अधिक अमूर्त अर्थ आ जाता।
- source_word: הַיֹּשְׁבִי
  choice: विराजमान
  rationale: ישׁב का मूल अर्थ बैठना या निवास करना है। स्वर्गीय संबोधन में “विराजमान” सम्मान और संभावित राजकीय भाव दोनों व्यक्त करता है, जबकि पादटिप्पणी शाब्दिक विकल्प सुरक्षित रखती है।
- source_word: בַּשָּׁמָיִם
  choice: स्वर्गों में
  rationale: हिब्रू के रूपगत बहुवचन को बनाए रखा गया है और “आकाश” के भौतिक अर्थ तक सीमित नहीं किया गया।
theological_decisions:
- issue: הַיֹּשְׁבִי בַּשָּׁמָיִם में परमेश्वर के लिए प्रयुक्त संबोधन
  choice: हे स्वर्गों में विराजमान
  alternative: हे स्वर्गों में बैठनेवाले / रहनेवाले
  rationale: मूल पाठ परमेश्वर का नाम नहीं लेता, इसलिए अनुवाद में “परमेश्वर” नहीं जोड़ा गया। “विराजमान” संभावित राजकीय भाव को स्वाभाविक हिन्दी में व्यक्त करता है, पर पादटिप्पणी मूल क्रिया की व्यापकता बताती है।
- issue: हिब्रू पूर्ण क्रिया נָשָׂאתִי का कालगत मूल्य
  choice: मैं ... उठाता हूँ
  alternative: मैंने ... उठाई हैं
  rationale: प्रार्थनात्मक कविता के प्रसंग में इसे वर्तमान भक्तिपूर्ण क्रिया के रूप में प्रस्तुत किया गया है; पूर्ण भूतकाल भी व्याकरणतः संभव है, इसलिए अर्थ को किसी अतिरिक्त धर्मवैज्ञानिक निष्कर्ष से नहीं बाँधा गया।
translation_notes:
  register: आधुनिक, सम्मानपूर्ण और काव्यात्मक हिन्दी अपनाई गई है। परमेश्वर के लिए सम्मानसूचक “आप” का प्रयोग किया गया है। पंक्ति-विन्यास शीर्षक और प्रार्थना की दो समानांतर गतियों—स्वर्गों में विराजमान संबोधित व्यक्ति और उसकी ओर उठती आँखों—को स्पष्ट करता है।
