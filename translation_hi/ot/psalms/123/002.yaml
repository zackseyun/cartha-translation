id: PSA.123.2
reference: Psalms 123:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: הִנֵּ֨ה כְ/עֵינֵ֪י עֲבָדִ֡ים אֶל יַ֤ד אֲֽדוֹנֵי/הֶ֗ם כְּ/עֵינֵ֣י שִׁפְחָה֮ אֶל יַ֪ד גְּבִ֫רְתָּ֥/הּ כֵּ֣ן עֵ֭ינֵי/נוּ אֶל יְהוָ֣ה אֱלֹהֵ֑י/נוּ עַ֝֗ד שֶׁ/יְּחָנֵּֽ/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/123/002.yaml
  text: Look[a], as the eyes of servants are toward the hand of their masters, as the eyes of a female servant are toward the hand of her mistress, so our eyes are toward Yahweh our God[b], until he shows us favor.
translation:
  language: hi
  text: देखो, जैसे सेवकों[a] की आँखें अपने स्वामियों के हाथ की ओर लगी रहती हैं, और जैसे दासी की आँखें अपनी स्वामिनी के हाथ की ओर, वैसे ही हमारी आँखें याहवे, हमारे परमेश्वर की ओर लगी हैं, जब तक कि वह हम पर अनुग्रह न करे।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “दासों”; यहाँ आश्रित सेवक अपने स्वामी के संकेत या प्रबंध की बाट जोहते हुए चित्रित हैं।
    reason: lexical_alternative
  - marker: b
    text: या “जब तक कि वह हम पर कृपा न करे”; अथवा “जब तक कि वह हम पर दया न करे।”
    reason: alternative_reading
lexical_decisions:
- source_word: הִנֵּה
  choice: देखो
  rationale: यह ध्यान आकर्षित करने वाला अव्यय है; ‘देखो’ आधुनिक और स्वाभाविक हिंदी में इसकी संकेतात्मक शक्ति बनाए रखता है।
- source_word: כְעֵינֵי
  choice: जैसे ... की आँखें
  rationale: उपसर्ग כ तुलना प्रकट करता है; यह चयन पद की समानांतर काव्यात्मक संरचना को बनाए रखता है।
- source_word: עֲבָדִים
  choice: सेवकों
  rationale: शब्द का अर्थ सेवक या दास हो सकता है। मुख्य पाठ में ‘सेवकों’ से आश्रित होकर स्वामी की ओर देखने का घरेलू बिंब सहज रूप में व्यक्त होता है; ‘दासों’ को पादटिप्पणी में रखा गया है।
- source_word: יַד
  choice: हाथ
  rationale: मूल बिंब को अक्षरशः रखा गया है; संदर्भ में हाथ संकेत, प्रबंध या अनुकूल कार्रवाई की प्रतीक्षा को सूचित कर सकता है।
- source_word: אֲדֹנֵיהֶם
  choice: अपने स्वामियों
  rationale: यह बहुवचन संज्ञा तीसरे पुरुष बहुवचन संबंधसूचक प्रत्यय सहित है; ‘स्वामियों’ घरेलू संबंध को स्पष्ट करता है।
- source_word: שִׁפְחָה
  choice: दासी
  rationale: यह विशेष रूप से स्त्री सेविका या दासी को दर्शाता है; ‘दासी’ संक्षिप्त, प्रचलित और लिंग-भेद को सुरक्षित रखने वाला शब्द है।
- source_word: גְּבִרְתָּהּ
  choice: अपनी स्वामिनी
  rationale: यह दासी की स्त्री-अधिष्ठात्री को दर्शाता है; ‘स्वामिनी’ हिंदी में इस घरेलू संबंध का सीधा समतुल्य है।
- source_word: כֵּן
  choice: वैसे ही
  rationale: यह उपमा के उत्तरार्ध को आरंभ करता है और ‘जैसे ... वैसे ही’ की स्वाभाविक हिंदी संरचना बनाता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय दिव्य नाम को सामान्य उपाधि से बदलने के बजाय नाम के रूप में लिप्यंतरित किया गया है।
- source_word: אֱלֹהֵינוּ
  choice: हमारे परमेश्वर
  rationale: प्रथम पुरुष बहुवचन संबंधसूचक रूप का सीधा और गरिमापूर्ण अनुवाद है।
- source_word: עַד שֶׁיְחָנֵּנוּ
  choice: जब तक कि वह हम पर अनुग्रह न करे
  rationale: חנן कृपापूर्वक अनुग्रह करने या दया दिखाने को व्यक्त करता है। यह हिंदी चयन अनुग्रहपूर्ण कार्रवाई को स्वाभाविक ढंग से व्यक्त करता है, जबकि निकट विकल्प पादटिप्पणी में सुरक्षित हैं।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा
  rationale: मूल पाठ में परमेश्वर का विशिष्ट नाम सीधे आया है; उसे ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित न करके नाम के रूप में प्रस्तुत किया गया है।
- issue: समापन में חנן की अर्थ-छाया
  choice: जब तक कि वह हम पर अनुग्रह न करे
  alternative: जब तक कि वह हम पर कृपा न करे / हम पर दया न करे
  rationale: क्रिया मूलतः कृपापूर्वक अनुग्रह दिखाने को व्यक्त करती है। ‘अनुग्रह करे’ इस अर्थ को बनाए रखता है; ‘कृपा’ और ‘दया’ वैध निकट विकल्प हैं, इसलिए उन्हें पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण काव्यात्मक शैली रखी गई है। ‘जैसे ... और जैसे ... वैसे ही’ से इब्रानी समानांतरता सुरक्षित है। ‘आँखें ... की ओर लगी रहती हैं’ और ‘लगी हैं’ प्रतीक्षारत, निर्भर दृष्टि को स्वाभाविक हिंदी में व्यक्त करते हैं।
