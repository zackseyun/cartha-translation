  text: רַבַּת֮ שָֽׂבְעָה לָּ֪/הּ נַ֫פְשֵׁ֥/נוּ הַ/לַּ֥עַג הַ/שַּׁאֲנַנִּ֑ים הַ֝/בּ֗וּז לִ/גְאֵ֥יוֹנִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/123/004.yaml
  text: Our soul has had more than enough of the mockery of those at ease[b][a], the contempt of the proud.
translation:
  language: hi
  text: हमारा मन चैन से रहनेवालों के उपहास और घमंडियों के तिरस्कार से हद से ज़्यादा भर चुका है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רַבַּת
  choice: हद से ज़्यादा
  rationale: यह क्रियाविशेषण तृप्त या भर जाने की अवस्था की अधिकता पर बल देता है; यह हिंदी पदबंध उस असहनीय अति को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: שָׂבְעָה
  choice: भर चुका है
  rationale: שבע का अर्थ तृप्त, संतृप्त या भर जाना है। यहाँ अप्रिय अनुभव से पूरी तरह भर जाने का भाव है, जिसे पूर्णतासूचक हिंदी रूप व्यक्त करता है।
- source_word: נַפְשֵׁנוּ
  choice: हमारा मन
  rationale: נפש यहाँ समूचे भीतरी व्यक्तित्व या सामूहिक आत्मबोध को दर्शाता है। 'हमारा मन' आधुनिक हिंदी में बोधगम्य है और इब्रानी के एकवचन सामूहिक काव्यबिंब को बनाए रखता है।
- source_word: הַלַּעַג
  choice: उपहास
  rationale: לעג हँसी उड़ाने या ठट्ठा करके नीचा दिखाने को सूचित करता है; 'उपहास' गरिमापूर्ण और स्पष्ट हिंदी समतुल्य है।
- source_word: הַשַּׁאֲנַנִּים
  choice: चैन से रहनेवाले
  rationale: שאנן निश्चिंत, सुरक्षित और कभी-कभी आत्मसंतुष्ट लोगों का वर्णन करता है। यह चयन मूल की सामाजिक विषमता को बनाए रखते हुए किसी एक नकारात्मक व्याख्या को अनिवार्य नहीं बनाता।
- source_word: הַבּוּז
  choice: तिरस्कार
  rationale: בוז अवमानना और हेय दृष्टि से किए गए व्यवहार को दर्शाता है; 'तिरस्कार' समानांतर पद 'उपहास' से अर्थगत भेद भी बनाए रखता है।
- source_word: לִגְאֵיוֹנִים
  choice: घमंडी
  rationale: यह रूप ऊँचा समझनेवाले, अभिमानी या अहंकारी लोगों को सूचित करता है। 'घमंडी' साधारण आधुनिक हिंदी में सीधा और सशक्त है।
