  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। वाक्य में इब्रानी की समानांतरता—'उपहास' और 'तिरस्कार'—तथा सामूहिक एकवचन 'हमारा मन' सुरक्षित हैं। 'चैन से रहनेवाले' मूल शब्द की निश्चिंतता और संभावित आत्मसंतोष के बीच की अर्थगत खुलावट को बनाए रखता है।
