  yaml_path: translation/ot/psalms/067/006.yaml
  text: The earth has yielded its produce[a]; God, our God[b], blesses us.
translation:
  language: hi
  text: धरती ने अपनी उपज दी है[a]; परमेश्वर, हमारा परमेश्वर, हमें आशीष देता है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘भूमि ने अपनी उपज दी है।’ इब्रानी אֶרֶץ का अर्थ ‘धरती’ या ‘भूमि’ हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘परमेश्वर, हमारा परमेश्वर, हमें आशीष दे,’ अथवा ‘परमेश्वर, हमारा परमेश्वर, हमें आशीष देगा।’ संदर्भ में इब्रानी क्रिया को वर्तमान कथन, कामना या भविष्य के रूप में समझा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: אֶרֶץ
  choice: धरती
  rationale: भजन के विश्वव्यापी संदर्भ में यह व्यापक अर्थ स्वाभाविक है; इब्रानी शब्द का अर्थ ‘भूमि’ भी हो सकता है, जिसे पाद-टिप्पणी में रखा गया है।
- source_word: נָתְנָה
  choice: दी है
  rationale: इब्रानी पूर्ण क्रिया का मूल अर्थ ‘दी है’ है। ‘उपज’ के साथ यह हिन्दी में स्वाभाविक है और प्राप्त परिणाम को व्यक्त करता है।
- source_word: יְבוּלָהּ
  choice: अपनी उपज
  rationale: यह कृषि से प्राप्त पैदावार को सहज आधुनिक हिन्दी में व्यक्त करता है और स्त्रीलिंग ‘धरती’ के साथ ‘अपनी’ स्वाभाविक है।
- source_word: יְבָרְכֵנוּ
  choice: हमें आशीष देता है
  rationale: मुख्य पाठ में अपूर्ण क्रिया को वर्तमान सूचक कथन के रूप में लिया गया है, जो प्राप्त उपज के बाद परमेश्वर की आशीष की विश्वासपूर्ण पुष्टि व्यक्त करता है। प्रार्थनात्मक और भविष्यकालीन अर्थ भी संभव हैं, इसलिए उन्हें पाद-टिप्पणी में सुरक्षित रखा गया है।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: यहाँ इस्राएल के एकमात्र परमेश्वर के लिए प्रयुक्त ईश्वरीय पद का मानक, गरिमापूर्ण हिन्दी रूप।
- source_word: אֱלֹהֵינוּ
  choice: हमारा परमेश्वर
  rationale: प्रथम पुरुष बहुवचन प्रत्यय को सीधे व्यक्त करते हुए इब्रानी की पुनरुक्ति ‘परमेश्वर, हमारा परमेश्वर’ को बल और निकटता सहित बनाए रखा गया है।
theological_decisions:
- issue: יְבָרְכֵנוּ क्रिया का भाव और काल
  choice: 'वर्तमान सूचक कथन: ‘हमें आशीष देता है’'
  alternative: 'प्रार्थना/कामना: ‘हमें आशीष दे’; अथवा भविष्य: ‘हमें आशीष देगा’'
  rationale: इब्रानी अपूर्ण क्रिया संदर्भ में वर्तमान कथन, कामना अथवा भविष्य—तीनों अर्थ दे सकती है। पहले खंड में प्राप्त उपज का उल्लेख होने के कारण मुख्य पाठ में विश्वासपूर्ण वर्तमान कथन चुना गया है, पर वास्तविक अस्पष्टता पाद-टिप्पणी में बनाए रखी गई है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘धरती’ विश्वव्यापी संदर्भ को स्पष्ट करती है, ‘उपज’ कृषि-संबंधी अर्थ को स्वाभाविक ढंग से व्यक्त करती है, और इब्रानी की बलपूर्ण पुनरुक्ति ‘परमेश्वर, हमारा परमेश्वर’ ज्यों की त्यों रखी गई है।
