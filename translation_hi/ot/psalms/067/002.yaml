  text: 'ताकि पृथ्वी पर[a] आपका मार्ग जाना जाए,

    सब राष्ट्रों में आपका उद्धार[b]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘देश में’ अथवा ‘भूमि पर’; किन्तु समानांतर वाक्यांश ‘सब राष्ट्रों में’ व्यापक अर्थ ‘पृथ्वी पर’ के पक्ष में है।
    reason: lexical_alternative
  - marker: b
    text: या ‘छुटकारा’। इब्रानी शब्द ठोस बचाव या अधिक व्यापक उद्धार, दोनों को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לָדַעַת
  choice: ताकि … जाना जाए
  rationale: ל prefixed infinitive यहाँ पिछले पद की प्रार्थना का उद्देश्य बताता है। यह रूप उस प्रयोजनार्थक भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בָּאָרֶץ
  choice: पृथ्वी पर
  rationale: אֶרֶץ का अर्थ ‘भूमि/देश’ या ‘पृथ्वी’ हो सकता है। समानांतर वाक्यांश ‘सब राष्ट्रों में’ के कारण यहाँ विश्वव्यापी अर्थ अधिक उपयुक्त है।
- source_word: דַּרְכֶּךָ
  choice: आपका मार्ग
  rationale: דֶּרֶךְ मूलतः मार्ग या रास्ता है और रूपक रूप में किसी के कार्य करने के ढंग को भी दर्शाता है। ‘मार्ग’ इस रूपक और अर्थ-विस्तार, दोनों को बनाए रखता है।
- source_word: בְּכָל גּוֹיִם
  choice: सब राष्ट्रों में
  rationale: גּוֹיִם यहाँ सामूहिक और अंतरराष्ट्रीय अर्थ में ‘राष्ट्रों’ को दर्शाता है। यह पद के विश्वव्यापी विस्तार को स्वाभाविक रूप से व्यक्त करता है।
- source_word: יְשׁוּעָתֶךָ
  choice: आपका उद्धार
  rationale: יְשׁוּעָה बचाव, छुटकारे या व्यापक उद्धार को सूचित कर सकता है। ‘उद्धार’ परमेश्वर के बचाने के कार्य की व्यापकता को सुरक्षित रखता है, जबकि ठोस छुटकारे के अर्थ को बाहर नहीं करता।
theological_decisions:
- issue: विश्वव्यापी आराधना के भजन में אֶרֶץ का दायरा
  choice: स्थानीय ‘देश/भूमि’ के बजाय विश्वव्यापी ‘पृथ्वी’
  alternative: देश में / भूमि पर
  rationale: ‘सब राष्ट्रों में’ के समानांतर प्रयोग से संकेत मिलता है कि दृष्टि केवल इस्राएल की भूमि तक सीमित नहीं, बल्कि पूरी पृथ्वी पर है।
- issue: יְשׁוּעָה की धर्मवैचारिक व्यापकता
  choice: उद्धार
  alternative: छुटकारा / विजय
  rationale: शब्द ठोस बचाव को सूचित कर सकता है, पर इस प्रसंग में ‘उद्धार’ परमेश्वर के बचाने के कार्य का व्यापक अर्थ बनाए रखता है और उसे किसी बाद की व्यवस्थित धर्मवैचारिक परिभाषा तक सीमित नहीं करता।
translation_notes:
  register: आधुनिक, सम्मानपूर्ण और काव्यात्मक हिन्दी अपनाई गई है। परमेश्वर के लिए आदरसूचक ‘आपका’ रखा गया है। दूसरी पंक्ति में इब्रानी काव्य की समानांतर, क्रिया-विहीन रचना सुरक्षित है; ‘जाना जाए’ का भाव वहाँ भी स्वाभाविक रूप से लागू होता है।
