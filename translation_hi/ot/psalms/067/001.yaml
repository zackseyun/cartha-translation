  text: אֱלֹהִ֗ים יְחָנֵּ֥/נוּ וִֽ/יבָרְכֵ֑/נוּ יָ֤אֵ֥ר פָּנָ֖י/ו אִתָּ֣/נוּ סֶֽלָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/067/001.yaml
  text: May God be gracious to us and bless us[a]; may his face shine upon us[c][b]. Selah
translation:
  language: hi
  text: परमेश्वर हम पर अनुग्रह करे और हमें आशीष दे; वह अपना मुख हम पर प्रकाशित करे।[a][b] सेला।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से यहाँ ‘हमारे साथ’ है; मुख चमकाने के इस मुहावरे का अर्थ सामान्यतः ‘हम पर’ समझा जाता है।
    reason: lexical_alternative
  - marker: b
    text: यह पंक्ति गिनती 6:24–26 के याजकीय आशीर्वाद, विशेषकर ‘यहोवा अपना मुख तुझ पर प्रकाशित करे’ (6:25), की प्रतिध्वनि है।
    reason: cross_reference
  - marker: c
    text: ‘सेला’ संभवतः उपासना या संगीत से जुड़ा कोई संकेत है; इसका ठीक अर्थ निश्चित नहीं है।
    reason: cultural_note
lexical_decisions:
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: रूप की दृष्टि से यह शब्द बहुवचन-जैसा है, पर यहाँ एकवचन क्रियाओं के साथ इस्राएल के एक परमेश्वर के लिए प्रयुक्त हुआ है; इसलिए हिन्दी में एकवचन ‘परमेश्वर’ स्वाभाविक और संदर्भानुकूल है।
- source_word: יְחָנֵּנוּ
  choice: हम पर अनुग्रह करे
  rationale: חנן यहाँ प्रार्थनात्मक भाव में कृपापूर्ण अनुकूलता दिखाने की विनती व्यक्त करता है। ‘अनुग्रह करे’ इस भाव को बनाए रखता है और अर्थ को केवल दया तक सीमित नहीं करता।
- source_word: וִיבָרְכֵנוּ
  choice: और हमें आशीष दे
  rationale: ברך के सामान्य अर्थ ‘आशीष देना’ को सरल, प्रतिष्ठित और प्रचलित हिन्दी में रखा गया है।
- source_word: יָאֵר
  choice: प्रकाश ... चमकाए
  rationale: אור का हिफ़ील रूप मूलतः ‘चमकाना/प्रकाशित करना’ है। मुख के साथ प्रयुक्त इस आशीर्वादात्मक मुहावरे को हिन्दी में स्वाभाविक बनाने और गिनती 6:25 की प्रतिध्वनि बनाए रखने के लिए ‘अपने मुख का प्रकाश ... चमकाए’ चुना गया है।
- source_word: פָּנָיו
  choice: अपने मुख का
  rationale: मूल का ठोस बिंब ‘उसका मुख’ सुरक्षित रखा गया है; इसे केवल ‘उपस्थिति’ या ‘कृपादृष्टि’ बनाकर व्याख्यायित नहीं किया गया।
- source_word: אִתָּנוּ
  choice: हम पर
  rationale: शाब्दिक अर्थ ‘हमारे साथ’ है, किंतु मुख चमकाने के आशीर्वादात्मक मुहावरे में लक्षित कृपा का भाव हिन्दी में ‘हम पर’ से स्वाभाविक रूप से व्यक्त होता है। शाब्दिक विकल्प पादटिप्पणी में दिया गया है।
- source_word: סֶלָה
  choice: सेला
  rationale: इस शब्द का निश्चित अर्थ अज्ञात है और यह संभवतः उपासना या संगीत का संकेत है; इसलिए अनुमानित अनुवाद के बजाय इसका लिप्यंतरण रखा गया है।
theological_decisions:
- issue: क्रियाओं का प्रार्थनात्मक/कामनात्मक बल
  choice: ‘करे’, ‘दे’ और ‘चमकाए’ के द्वारा विनती या कामना के रूप में अनुवाद
  alternative: 'वर्णनात्मक कथन: ‘परमेश्वर हम पर अनुग्रह करता है और हमें आशीष देता है’'
  rationale: भजन के आशीर्वादात्मक संदर्भ में ये क्रियारूप स्वाभाविक रूप से प्रार्थना या कामना व्यक्त करते हैं, न कि केवल वर्तमान तथ्य का कथन।
- issue: याजकीय आशीर्वाद की प्रतिध्वनि
  choice: ‘मुख’ और ‘प्रकाश चमकाने’ का बिंब सुरक्षित रखा गया
  alternative: 'व्याख्यात्मक अनुवाद: ‘हम पर कृपादृष्टि करे’'
  rationale: यह पंक्ति गिनती 6:24–26, विशेषकर 6:25, की स्पष्ट प्रतिध्वनि है। मूल बिंब को बनाए रखने से यह अंतर्पाठीय संबंध सुरक्षित रहता है और कोई अतिरिक्त धर्मवैज्ञानिक निष्कर्ष नहीं थोपा जाता।
- issue: אִתָּנוּ में संबंधसूचक अर्थ
  choice: मुख्य पाठ में मुहावरे के अनुसार ‘हम पर’, और पादटिप्पणी में शाब्दिक ‘हमारे साथ’
  alternative: मुख्य पाठ में ‘हमारे साथ’
  rationale: ‘हमारे साथ’ हिब्रू के अधिक निकट है, पर हिन्दी में ‘मुख का प्रकाश हमारे साथ चमकाए’ अस्पष्ट और अस्वाभाविक होगा। पादटिप्पणी वास्तविक शाब्दिक भिन्नता को छिपने नहीं देती।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल किंतु गरिमापूर्ण प्रार्थनात्मक रूप अपनाया गया है। ‘अनुग्रह’, ‘आशीष’ और ‘मुख का प्रकाश’ जैसे परिचित बाइबलीय पदों को रखा गया है, पर वाक्य-विन्यास को सहज बनाया गया है।
