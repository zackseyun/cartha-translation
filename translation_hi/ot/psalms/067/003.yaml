  footnotes:
  - marker: a
    text: या, “जातियाँ आपकी स्तुति करेंगी।” इब्रानी क्रियारूप को प्रार्थना या कामना के रूप में, अथवा यहाँ कम संभावित रूप से भविष्य के रूप में भी समझा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: יוֹדוּךָ
  choice: आपकी स्तुति करें
  rationale: हिफ़ील रूप ידה भजन-साहित्य में परमेश्वर की स्तुति करने या उनका धन्यवाद करने का भाव देता है। यहाँ आवर्ती प्रार्थना के संदर्भ में ‘स्तुति करें’ और संभावनार्थक क्रिया इच्छा/विनती का भाव स्वाभाविक रूप से व्यक्त करते हैं।
- source_word: עַמִּים
  choice: देश-देश के लोग / सभी लोग
  rationale: बहुवचन עַמִּים अनेक जनसमुदायों को सूचित करता है। ‘देश-देश के लोग’ पहली पंक्ति में इस सामूहिक बहुवचन को स्पष्ट करता है, जबकि दूसरी पंक्ति का ‘सभी लोग’ כֻּלָּם सहित उसकी सार्वभौमिकता व्यक्त करता है; केवल राजनीतिक राज्यों का अर्थ थोपने से बचा गया है।
- source_word: אֱלֹהִים
  choice: हे परमेश्वर
  rationale: यहाँ शब्द संबोधन में है। ‘हे परमेश्वर’ आधुनिक हिन्दी में स्पष्ट, गरिमापूर्ण और स्वाभाविक संबोधन है।
- source_word: כֻּלָּם
  choice: सभी
  rationale: यह शब्द पहले बताए गए विविध जनसमुदायों की संपूर्णता पर बल देता है; ‘सभी’ संक्षिप्त रूप से वही समग्र भाव रखता है।
theological_decisions:
- issue: स्तुति-वाक्य में अपूर्ण क्रियारूप का इच्छार्थक बल
  choice: ‘स्तुति करें’—प्रार्थना/कामना के रूप में
  alternative: ‘स्तुति करेंगे’—भविष्यवाणी के रूप में
  rationale: יוֹדוּךָ रूप व्याकरणतः भविष्य का भाव भी ले सकता है, पर इस भजन के प्रार्थनात्मक और आवर्ती संदर्भ में इच्छार्थक/विनयार्थक अर्थ अधिक संभावित है। हिन्दी का ‘करें’ इस भाव को किसी निश्चित भविष्यवाणी में बदले बिना सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामूहिक उपासना के योग्य रखी गई है। आदरसूचक ‘आपकी’ सामान्य हिन्दी पाठक के लिए स्वाभाविक है। ‘देश-देश के लोग’ विविध जातीय या राष्ट्रीय जनसमुदायों को सहज ढंग से व्यक्त करता है।
