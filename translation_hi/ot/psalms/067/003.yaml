    issue: ‘देश-देश के लोग’ narrows עַמִּים toward inhabitants of territorial countries.
    rationale: The Hebrew denotes multiple peoples/groups and need not imply modern political states. ‘जातियाँ’ retains the collective plural more directly.
  - severity: low
