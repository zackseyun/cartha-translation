  naturalness: The draft is generally clear and suitably dignified. ‘सभी जातियाँ’ is concise, idiomatic in biblical Hindi, and preserves the deliberate refrain-like repetition more effectively than shifting from ‘देश-देश के लोग’ to ‘सभी लोग.’
  terminology: ‘हे परमेश्वर’ and the respectful second-person forms are appropriate. ‘जातियाँ’ here denotes distinct peoples/nations, not castes; it is a conventional and contextually apt rendering of עַמִּים. No doctrinal interpretation is introduced.
  issues:
