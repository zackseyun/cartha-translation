  text: Let the peoples praise you[a], O God[b]; let all the peoples praise you.
translation:
  language: hi
  text: हे परमेश्वर, लोग तेरी स्तुति करें[a]; सभी लोग तेरी स्तुति करें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हे परमेश्वर, लोग तेरी स्तुति करेंगे; सभी लोग तेरी स्तुति करेंगे।” इब्रानी क्रिया का अर्थ “तेरा धन्यवाद करें” भी हो सकता है।
    reason: क्रिया के भाव तथा शाब्दिक अर्थ की वैकल्पिक सम्भावनाएँ
lexical_decisions:
- source_word: יוֹדוּךָ
  choice: तेरी स्तुति करें
  rationale: हिफ़ील रूप ידה भजनों में परमेश्वर के प्रति सार्वजनिक धन्यवाद और प्रशंसा व्यक्त करता है। यहाँ काव्यात्मक उपासना के संदर्भ में ‘स्तुति करें’ स्वाभाविक है और प्रार्थना/कामना के भाव को भी बनाए रखता है।
- source_word: עַמִּים
  choice: देश-देश के लोग
  rationale: बहुवचन עַמִּים अनेक जनसमुदायों को दर्शाता है। ‘देश-देश के लोग’ साधारण हिन्दी में स्वाभाविक रहते हुए अलग-अलग लोगों के समूहों और पद के विश्वव्यापी दायरे को व्यक्त करता है।
- source_word: אֱלֹהִים
  choice: हे परमेश्वर
  rationale: यहाँ אֱלֹהִים सीधे संबोधन में है। ‘हे परमेश्वर’ हिन्दी प्रार्थना और काव्य में संबोधन को स्पष्ट तथा गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: כֻּלָּם
  choice: सब
  rationale: כֻּלָּם सभी जनसमुदायों की समग्रता पर बल देता है; ‘सब’ संक्षिप्त, स्वाभाविक और व्यापक है।
theological_decisions:
- issue: दोहराए गए खंड की क्रियावृत्ति और कथन-भूमिका
  choice: 'प्रार्थना/कामना के रूप में: ‘देश-देश के लोग तेरी स्तुति करें’'
  alternative: 'भविष्यसूचक कथन: ‘देश-देश के लोग तेरी स्तुति करेंगे’'
  rationale: इब्रानी रूप प्रसंगानुसार भविष्यसूचक कथन भी हो सकता है, पर इस भजन की प्रार्थनामय आवृत्ति में कामनार्थक भाव अधिक स्वाभाविक है। वास्तविक अस्पष्टता को पाद-टिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में प्रार्थनामय, काव्यात्मक और गरिमापूर्ण शैली। ‘देश-देश के लोग’ बहुवचन जनसमुदायों को सामान्य पाठक के लिए स्वाभाविक ढंग से व्यक्त करता है; संबोधन के लिए ‘हे परमेश्वर’ और निकट प्रार्थनात्मक संबोधन के लिए ‘तेरी’ रखा गया है।
