lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: संगीत-निर्देशक के लिए
  rationale: भजन-शीर्षकों में यह पद संगीत-प्रस्तुति का निर्देशन करने वाले व्यक्ति को सूचित करता है। ‘संगीत-निर्देशक’ आधुनिक हिन्दी में स्पष्ट है और केवल ‘प्रधान’ या ‘अगुवे’ की अपेक्षा इसके संगीत-संबंधी कार्य को बेहतर व्यक्त करता है; לַ का स्वाभाविक अनुवाद ‘के लिए’ है।
- source_word: בִּנְגִינֹת
  choice: तार वाले वाद्यों के साथ
  rationale: यह पद भजन-शीर्षक में तार वाले वाद्यों अथवा उनसे उत्पन्न संगीत की ओर संकेत करता है। ‘के साथ’ בְּ के साधनात्मक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है; ‘पर’ भी सम्भव है।
- source_word: מִזְמוֹר
  choice: एक भजन
  rationale: यह भजन-संग्रह में प्रयुक्त मानक विधा-संज्ञा है। ‘भजन’ हिन्दी पाठकों के लिए स्वाभाविक है और इसे अगले शब्द שִׁיר से अलग रखता है।
- source_word: שִׁיר
  choice: एक गीत
  rationale: यह सीधी विधा-संज्ञा है। अलग से ‘एक गीत’ कहने पर इब्रानी की दोहरी संज्ञा—מִזְמוֹר שִׁיר—को मिलाकर एक नहीं किया जाता।
