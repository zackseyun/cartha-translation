  yaml_path: translation/ot/psalms/067/007.yaml
  text: God will bless us[a], and all the ends of the earth will fear him.
translation:
  language: hi
  text: परमेश्वर हमें आशीष देगा, और पृथ्वी के छोरों तक के सब लोग उसका भय मानेंगे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसके प्रति श्रद्धा करेंगे” या “उसके सामने विस्मय से भर उठेंगे।” इब्रानी क्रिया परमेश्वर के प्रति भय और श्रद्धापूर्ण विस्मय—दोनों भाव व्यक्त कर सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְבָרְכֵנוּ
  choice: हमें आशीष देगा
  rationale: पिएल अपूर्ण रूप और प्रथम पुरुष बहुवचन प्रत्यय का अर्थ ‘हमें आशीष देना’ है। इस समापन पद में इसे विश्वासपूर्ण भविष्य/परिणाम के रूप में व्यक्त किया गया है; ‘हमें आशीष दे’ भी प्रसंगतः संभव है।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: रूपात्मक बहुवचन के बावजूद क्रिया और संदर्भ एकवचन व्यक्तिगत परमेश्वर की ओर संकेत करते हैं।
- source_word: וְיִירְאוּ אֹתוֹ
  choice: और ... उसका भय मानेंगे
  rationale: परमेश्वर के संबंध में ירא भय, श्रद्धा और विस्मय का संयुक्त भाव रख सकता है। ‘भय मानना’ हिन्दी बाइबलीय प्रयोग में इस धार्मिक गंभीरता को सुरक्षित रखता है।
- source_word: כָּל אַפְסֵי אָרֶץ
  choice: पृथ्वी के दूर-दूर के सभी लोग
  rationale: शाब्दिक मुहावरा ‘पृथ्वी के छोर’ संसार के सबसे दूरस्थ क्षेत्रों को दर्शाता है। यहाँ भय मानने वाली मानवजाति अभिप्रेत है, इसलिए स्वाभाविक हिन्दी में निहित मानवीय संदर्भ को ‘लोग’ से स्पष्ट किया गया है।
theological_decisions:
- issue: परमेश्वर के प्रति ירא का भाव
  choice: उसका भय मानेंगे
  alternative: उसके प्रति श्रद्धा रखेंगे / उसके विस्मय में रहेंगे
  rationale: ‘भय मानना’ भय, श्रद्धा, विस्मय और अधीनता के बीच मूल इब्रानी तनाव को बनाए रखता है; केवल ‘आदर करना’ अर्थ को अनावश्यक रूप से सीमित कर देता।
- issue: יְבָרְכֵנוּ का क्रियाभाव
  choice: हमें आशीष देगा
  alternative: हमें आशीष दे
  rationale: भजन के निष्कर्ष में अपूर्ण क्रिया को भरोसे से कही गई भविष्यसूचक/परिणामसूचक घोषणा समझा गया है, यद्यपि इच्छासूचक पाठ भी व्याकरणतः संभव है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘पृथ्वी के दूर-दूर के सभी लोग’ मूल मुहावरे का अर्थ स्वाभाविक हिन्दी में स्पष्ट करता है; ‘भय मानेंगे’ मूल की धार्मिक गंभीरता और अर्थ-विस्तार बनाए रखता है।
