  text: יִֽשְׂמְח֥וּ וִֽ/ירַנְּנ֗וּ לְאֻ֫מִּ֥ים כִּֽי תִשְׁפֹּ֣ט עַמִּ֣ים מִישׁ֑וֹר וּ/לְאֻמִּ֓ים בָּ/אָ֖רֶץ תַּנְחֵ֣/ם סֶֽלָה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/067/004.yaml
  text: Let the nations be glad and sing for joy[a], for you judge the peoples with equity and guide the nations on the earth[b]. Selah
translation:
  language: hi
  text: राष्ट्र आनन्दित हों और हर्ष से गाएँ[a], क्योंकि तू लोगों का निष्पक्ष न्याय करता है और पृथ्वी पर राष्ट्रों का मार्गदर्शन करता है[b]। सेला
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “राष्ट्र आनन्दित हों और हर्ष से जयजयकार करें।” इस क्रिया का अर्थ उल्लास से गाना या ऊँचे स्वर में आनन्द की पुकार लगाना हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: यदि אֶרֶץ को स्थानीय अर्थ में लिया जाए, तो “देश में राष्ट्रों का मार्गदर्शन करता है।” यहाँ पूरे भजन के विश्वव्यापी संदर्भ के कारण “पृथ्वी पर” अनुवाद किया गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: יִשְׂמְחוּ
  choice: आनन्दित हों
  rationale: शׂמח का क़ाल अपूर्ण बहुवचन यहाँ स्तुति के संदर्भ में कामनार्थक/आह्वानात्मक है; ‘आनन्दित हों’ इस भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וִירַנְּנוּ
  choice: और हर्ष से गाएँ
  rationale: רנן के पिअेल रूप में उल्लासपूर्ण गायन या ऊँची आनन्द-ध्वनि का भाव है; ‘हर्ष से गाएँ’ मुख्य पाठ में उत्सवपूर्ण और स्वरयुक्त अर्थ को सहजता से रखता है।
- source_word: לְאֻמִּים
  choice: राष्ट्र
  rationale: यह शब्द जनसमूहों या राष्ट्रों को सूचित कर सकता है; भजन के विश्वव्यापी विस्तार के कारण ‘राष्ट्र’ उपयुक्त है और दोनों आवृत्तियों में संगति रखता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह राष्ट्रों के आनन्द का कारण प्रस्तुत करता है; आधुनिक हिन्दी में ‘क्योंकि’ स्पष्ट और स्वाभाविक है।
- source_word: תִשְׁפֹּט
  choice: न्याय ... करता है
  rationale: שׁפט का मूल न्यायिक अर्थ सुरक्षित रखा गया है। अपूर्ण क्रिया को यहाँ परमेश्वर के चरित्रगत, निरन्तर कार्य के रूप में वर्तमान काल में व्यक्त किया गया है।
- source_word: עַמִּים
  choice: लोगों
  rationale: यह व्यापक जनसमूहों को दर्शाता है; ‘लोगों’ से לְאֻמִּים के लिए चुने गए ‘राष्ट्र’ से हल्का शब्दगत भेद भी बना रहता है।
- source_word: מִישׁוֹר
  choice: निष्पक्षता से
  rationale: संज्ञा में सीधाई, खरापन और न्यायसंगत समता का भाव है; न्यायिक संदर्भ में ‘निष्पक्षता से’ सहज और अर्थपूर्ण हिन्दी है।
- source_word: בָּאָרֶץ
  choice: पृथ्वी पर
  rationale: पूरे भजन में सभी जातियों और राष्ट्रों का उल्लेख होने के कारण אֶרֶץ का विश्वव्यापी अर्थ मुख्य पाठ में ग्रहण किया गया है।
- source_word: תַּנְחֵם
  choice: मार्गदर्शन करता है
  rationale: נחה के हिफ़ील रूप का अर्थ अगुवाई करना या मार्ग दिखाना है; ‘मार्गदर्शन करता है’ केवल भौतिक रूप से ले चलने के बजाय बुद्धिमत्तापूर्ण संचालन का भाव भी रखता है।
- source_word: סֶלָה
  choice: सेला
  rationale: इस पद का सटीक अर्थ अनिश्चित है, इसलिए व्याख्यात्मक अनुवाद थोपने के बजाय पारंपरिक लिप्यंतरण रखा गया है।
theological_decisions:
- issue: אֶרֶץ का विस्तार
  choice: विश्वव्यापी ‘पृथ्वी’
  alternative: स्थानीय ‘देश’
  rationale: भजन 67 का संदर्भ सभी लोगों और राष्ट्रों को समेटता है; अतः ‘पृथ्वी’ व्यापक संदर्भ से अधिक मेल खाता है, जबकि स्थानीय अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: अपूर्ण क्रियाओं का काल और भाव
  choice: आरम्भ में कामनार्थक आह्वान, फिर वर्तमान/चरित्रगत कार्य
  alternative: 'भविष्यकाल: ‘राष्ट्र आनन्दित होंगे ... तू न्याय करेगा और मार्ग दिखाएगा’'
  rationale: आरम्भिक क्रियाएँ आराधनात्मक कामना या आह्वान के रूप में स्वाभाविक हैं, जबकि आगे की क्रियाएँ परमेश्वर के निरन्तर कार्य को आनन्द के आधार के रूप में बताती हैं। फिर भी इब्रानी अपूर्ण रूप में भविष्य का संकेत सम्भव है।
translation_notes:
  register: भाषा आधुनिक, काव्यात्मक और गरिमापूर्ण रखी गई है। परमेश्वर के लिए एकवचन आत्मीय सम्बोधन ‘तू’ भजन की सीधी प्रार्थनात्मक वाणी को बनाए रखता है। ‘राष्ट्र’ और ‘लोगों’ का भेद मूल के निकट रहते हुए सामान्य पाठक के लिए स्पष्ट है।
