base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/050.yaml
  text: He gives great victories to his king and shows steadfast love to his anointed[c][b][a], to David and to his offspring forever.
translation:
  language: hi
  text: वह अपने राजा को बड़ी विजयें देता है और अपने अभिषिक्त—दाऊद और उसके वंश—के प्रति सदा अटल प्रेम दिखाता है।[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह अपने राजा के लिए उद्धारों का गढ़ है।” पद के आरंभ का इब्रानी रूप पाठगत और वाक्यगत रूप से कठिन है; 2 शमूएल 22:51 में निकट समानांतर पाठ है, “वह अपने राजा की विजयों/उद्धारों को महान करता है।”
    reason: textual_variant
  - marker: b
    text: “अपने अभिषिक्त” का अनुवाद “अपने मसीह” भी हो सकता है। यहाँ इसका तात्कालिक संकेत दाऊद, अर्थात दाऊदी राजा, की ओर है, पर इसमें व्यापक मसीह-संबंधी अनुगूँज भी है।
    reason: alternative_reading
  - marker: c
    text: “वंश” एकवचन सामूहिक संज्ञा का अनुवाद है। यह दाऊद की पूरी वंश-परंपरा को सूचित कर सकता है और व्यापक पवित्रशास्त्रीय संदर्भ में मसीह-संबंधी अर्थ की गुंजाइश भी रखता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מגדל
  choice: महान ... देता है
  rationale: आरंभिक इब्रानी रूप पाठगत और वाक्यगत रूप से कठिन है। 2 शमूएल 22:51 के निकट समानांतर के आधार पर इसे राजा के लिए उद्धारों/विजयों को महान करने के अर्थ में लिया गया है; सहज हिन्दी में ‘महान विजय देता है’ इस भाव को व्यक्त करता है।
- source_word: יְשׁוּעוֹת
  choice: विजय
  rationale: बहुवचन शब्द उद्धार या छुटकारे के कार्यों को सूचित कर सकता है। राजकीय और युद्ध-संबंधी प्रसंग में ‘विजय’ स्वाभाविक है और परमेश्वर द्वारा बार-बार दिए गए छुटकारे का भाव रखता है।
- source_word: מַלְכּוֹ
  choice: अपने राजा को
  rationale: यह तीसरे पुरुष एकवचन संबंधसूचक प्रत्यय सहित सीधा रूप है और परमेश्वर तथा राजा के वाचागत संबंध को बनाए रखता है।
- source_word: וְעֹשֶׂה חֶסֶד
  choice: और ... अटल प्रेम करता है
  rationale: חֶסֶד विश्वासयोग्य, वाचागत प्रेम का प्रमुख शब्द है। ‘अटल प्रेम’ सामान्य पाठक के लिए सहज रहते हुए उसकी स्थिरता और निष्ठा को व्यक्त करता है।
- source_word: לִמְשִׁיחוֹ
  choice: अपने अभिषिक्त पर
  rationale: निकट प्रसंग में यह दाऊद अर्थात दाऊदी राजा को सूचित करता है। ‘अभिषिक्त’ ऐतिहासिक अर्थ को स्पष्ट रखता है और मसीही अनुगूँज को मिटाता नहीं।
- source_word: לְדָוִד
  choice: दाऊद पर
  rationale: व्यक्तिनाम का प्रचलित हिन्दी रूप लिया गया है; यह पिछले पदबंध ‘अपने अभिषिक्त पर’ की समानाधिकरणीय व्याख्या करता है।
- source_word: וּלְזַרְעוֹ
  choice: और उसके वंश पर
  rationale: זֶרַע एकवचन सामूहिक संज्ञा है। हिन्दी ‘वंश’ दाऊद की पूरी राजवंशीय धारा को स्वाभाविक ढंग से व्यक्त करता है और किसी एक या अनेक उत्तराधिकारियों तक अर्थ को अनावश्यक रूप से सीमित नहीं करता।
- source_word: עַד עוֹלָם
  choice: सदा
  rationale: यह स्थायी, अनंत अवधि का संक्षिप्त और स्वाभाविक हिन्दी रूप है।
theological_decisions:
- issue: दाऊदी राजकीय भजन में מְשִׁיחוֹ की मसीही अनुगूँज
  choice: मुख्य पाठ में ‘अपने अभिषिक्त’
  alternative: ‘अपने मसीह’
  rationale: तात्कालिक संदर्भ दाऊद/दाऊदी राजा है, इसलिए ‘अभिषिक्त’ स्थानीय अर्थ के लिए सबसे सटीक है। फिर भी ‘मसीह’ की व्यापक धर्मवैज्ञानिक अनुगूँज को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: זַרְעוֹ का दायरा
  choice: ‘उसके वंश’ द्वारा सामूहिक और राजवंशीय अर्थ खुला रखना
  alternative: ‘उसके वंशज’ अथवा ‘उसके बीज’
  rationale: इब्रानी शब्द दाऊद की वंश-परंपरा को सामूहिक रूप से सूचित करता है और व्यापक मसीही पठन की गुंजाइश भी रखता है। ‘वंश’ इस तनाव को किसी एक व्याख्या में सीमित नहीं करता।
- issue: पद के आरंभ में מגדל का कठिन पाठ
  choice: 2 शमूएल 22:51 के समानांतर के अनुरूप ‘महान विजय देता है’
  alternative: ‘अपने राजा के लिए उद्धारों का गढ़ है’
  rationale: मसोरा-पाठ का रूप संज्ञा ‘गढ़’ अथवा महान करने वाले क्रियारूप से संबद्ध समझा जा सकता है। मुख्य पाठ में सुबोध समानांतर अर्थ चुना गया है, जबकि वास्तविक पाठगत अस्पष्टता पादटिप्पणी में दी गई है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। ‘अटल प्रेम’ חֶסֶד की स्थिर, वाचागत निष्ठा को व्यक्त करता है। विराम-चिह्नों से स्पष्ट किया गया है कि ‘दाऊद’ उसी ‘अभिषिक्त’ की पहचान है। सभी पादटिप्पणी चिह्न मुख्य पाठ में मौजूद हैं।
