id: PSA.18.48
reference: Psalms 18:48
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: מְפַלְּטִ֗/י מֵ/אֹ֫יְבָ֥/י אַ֣ף מִן קָ֭מַ/י תְּרוֹמְמֵ֑/נִי מֵ/אִ֥ישׁ חָ֝מָ֗ס תַּצִּילֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/048.yaml
  text: the one who rescues me from my enemies[a]; indeed, you lift me up above those who rise against me[c][b]; you deliver me from the violent man.
translation:
  language: hi
  text: मेरे शत्रुओं से मुझे छुड़ानेवाले[a], हाँ, जो मेरे विरुद्ध उठते हैं, उनसे ऊँचा तू मुझे उठाता है[b]; हिंसा करनेवाले मनुष्य से तू मुझे बचाता है[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘मेरे शत्रुओं से मेरे छुड़ानेवाले।’ इब्रानी में आरंभिक शब्द एक कृदन्त है, जो परमेश्वर की उपाधि के रूप में प्रयुक्त है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘जो मेरे विरुद्ध उठते हैं, उनसे ऊँचा तू मुझे प्रतिष्ठित करता है।’
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से, ‘हिंसा के मनुष्य से।’
    reason: lexical_alternative
lexical_decisions:
- source_word: מְפַלְּטִי
  choice: मुझे छुड़ानेवाले
  rationale: यह कृदन्त रूप परमेश्वर के लिए संबोधन या उपाधि की तरह प्रयुक्त है। हिंदी में यह रूप उसके निरंतर छुड़ानेवाले चरित्र और प्रत्यक्ष संबोधन—दोनों को स्वाभाविक रूप से बनाए रखता है।
- source_word: מֵאֹיְבַי
  choice: मेरे शत्रुओं से
  rationale: מִן उपसर्ग और प्रथम पुरुष एकवचन प्रत्यय सहित אֹיְבַי का सीधा और प्रसंगानुकूल अर्थ है।
- source_word: אַף
  choice: हाँ
  rationale: यह अगले कथन को बल देता और पिछले कथन से आगे बढ़ाता है; ‘हाँ’ काव्यात्मक जोर को सहज आधुनिक हिंदी में व्यक्त करता है।
- source_word: מִן קָמַי
  choice: जो मेरे विरुद्ध उठते हैं, उनसे ऊँचा
  rationale: קָמַי विरोध में उठ खड़े होनेवालों को दर्शाता है। רום के साथ מִן तुलनात्मक अर्थ देता है, इसलिए ‘उनसे ऊँचा’ मूल बिंब और वाक्य-संबंध को सुरक्षित रखता है।
- source_word: תְּרוֹמְמֵנִי
  choice: तू मुझे उठाता है
  rationale: रूप का अर्थ ऊँचा करना या ऊपर उठाना है। निकटवर्ती ‘उनसे ऊँचा’ के साथ यह मूल ऊर्ध्व बिंब को स्पष्ट और स्वाभाविक रखता है।
- source_word: מֵאִישׁ חָמָס
  choice: हिंसा करनेवाले मनुष्य से
  rationale: אִישׁ एकवचन पुल्लिंग ‘मनुष्य’ है और חָמָס हिंसा या घोर अन्याय का बोध कराता है। यह चयन लिंग और एकवचन को बनाए रखते हुए हिंदी में अर्थ स्पष्ट करता है।
- source_word: תַּצִּילֵנִי
  choice: तू मुझे बचाता है
  rationale: נצל संकट या हमलावर से बचाने अथवा छुड़ाने का अर्थ रखता है। ‘बचाता है’ आरंभिक פלט से कुछ शब्दगत भेद भी बनाए रखता है।
theological_decisions:
- issue: पद के आरंभिक कृदन्त का संदर्भ और संबोधन
  choice: 'आरंभ को परमेश्वर के लिए प्रत्यक्ष संबोधन/उपाधि माना गया है: ‘मुझे छुड़ानेवाले’।'
  alternative: इसे पिछले पद से जुड़ा हुआ संबंधवाचक उपवाक्य बनाया जा सकता है।
  rationale: इब्रानी में आरंभिक substantival participle के बाद द्वितीय पुरुष के क्रियारूप आते हैं। प्रत्यक्ष संबोधन इस काव्यात्मक परिवर्तन को सुरक्षित रखता है और संदर्भ को अनावश्यक रूप से नहीं बदलता।
- issue: אִישׁ का लिंग-संकेत
  choice: मनुष्य
  alternative: व्यक्ति
  rationale: मूल में एकवचन पुल्लिंग संज्ञा है। ‘मनुष्य’ हिंदी में गरिमापूर्ण और स्वाभाविक रहते हुए इस रूप को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण काव्यात्मक शैली रखी गई है। परमेश्वर के प्रत्यक्ष संबोधन में ‘तू’ का प्रयोग भजन-साहित्य की निकटता और एकवचन द्वितीय पुरुष को दर्शाता है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
