  text: For who is God besides Yahweh? And who is a rock except our God?[a]
translation:
  language: hi
  text: क्योंकि यहोवा के सिवा परमेश्वर कौन है? और हमारे परमेश्वर के सिवा चट्टान कौन है?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: पहले उपवाक्य का अनुवाद ‘यहोवा के अतिरिक्त’ और दूसरे का ‘हमारे परमेश्वर के अलावा’ भी हो सकता है; दोनों इब्रानी अभिव्यक्तियाँ अपवर्जन और विशिष्टता प्रकट करती हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन के आधार या कारण को प्रस्तुत करता है और इब्रानी संयोजक का स्वाभाविक हिन्दी रूप है।
- source_word: מִי
  choice: कौन
  rationale: दोनों अलंकारिक प्रश्नों में प्रयुक्त प्रश्नवाचक सर्वनाम का सीधा और स्वाभाविक अनुवाद।
- source_word: אֱלוֹהַּ
  choice: परमेश्वर
  rationale: एकवचन संज्ञा यहाँ सच्चे परमेश्वर के लिए प्रयुक्त है; ‘परमेश्वर’ आधुनिक हिन्दी में स्पष्ट और गरिमापूर्ण है।
- source_word: מִבַּלְעֲדֵי
  choice: के सिवा
  rationale: 'यह विशिष्टता और अपवर्जन व्यक्त करता है: यहोवा के अतिरिक्त कोई परमेश्वर नहीं।'
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ में आए परमेश्वर के व्यक्तिगत नाम को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से रखा गया है, किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: וּמִי
  choice: और ... कौन
  rationale: संयोजक को बनाए रखते हुए दूसरे अलंकारिक प्रश्न को पहले से जोड़ता और समानांतरता सुरक्षित रखता है।
- source_word: צוּר
  choice: चट्टान
  rationale: स्थिरता, सामर्थ्य और सुरक्षा का मूल बिंब बनाए रखता है; इसे ‘शरण’ जैसे व्याख्यात्मक शब्द से नहीं बदला गया।
- source_word: זוּלָתִי
  choice: को छोड़
  rationale: यह पहले उपवाक्य के अपवर्जन के समानांतर विशिष्टता व्यक्त करता है और हिन्दी में सहज है।
- source_word: אֱלֹהֵינוּ
  choice: हमारे परमेश्वर
  rationale: प्रत्यय के सामुदायिक और संबंधपरक अर्थ को स्पष्ट रूप से सुरक्षित रखता है।
theological_decisions:
- issue: יְהוָה परमेश्वर के नाम का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल के व्यक्तिगत नाम को उपाधि ‘प्रभु’ से बदलने के बजाय नाम के रूप में रखा गया है; ‘यहोवा’ हिन्दी बाइबलीय प्रयोग में व्यापक रूप से पहचाना जाता है।
- issue: צוּר का परमेश्वर के लिए रूपक
  choice: चट्टान
  alternative: शरणस्थान
  rationale: ‘चट्टान’ मूल रूपक और उसकी स्थिरता, सामर्थ्य तथा सुरक्षा की अर्थ-छवियों को सुरक्षित रखता है; ‘शरणस्थान’ केवल एक निहितार्थ को स्पष्ट करता, पर बिंब खो देता।
- issue: दोनों अलंकारिक प्रश्नों में विशिष्टता
  choice: ‘के सिवा’ और ‘को छोड़’
  alternative: दोनों स्थानों पर ‘के अतिरिक्त’
  rationale: दोनों इब्रानी पदों का अपवर्जक अर्थ बनाए रखते हुए प्राकृतिक हिन्दी और काव्यात्मक समानांतरता दी गई है; आशय है कि यहोवा के अतिरिक्त कोई परमेश्वर और हमारे परमेश्वर के अतिरिक्त कोई चट्टान नहीं।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। अलंकारिक प्रश्नों की समानांतर रचना तथा ‘चट्टान’ का काव्यात्मक बिंब सुरक्षित रखा गया है।
