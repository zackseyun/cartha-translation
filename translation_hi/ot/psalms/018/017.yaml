  text: He delivered me from my strong enemy[a], and from those who hated me[b], for they were too mighty for me.
translation:
  language: hi
  text: उसने मुझे मेरे बलवान शत्रु[a] से और मुझसे घृणा करनेवालों[b] से छुड़ाया, क्योंकि वे मुझसे अधिक शक्तिशाली थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “वह मुझे मेरे बलवान शत्रु से छुड़ाता है,” यदि काव्यात्मक अपूर्ण क्रियारूप को वर्तमान-जैसे अर्थ में पढ़ा जाए।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में “मेरा शत्रु” एकवचन है; इसके बाद का वाक्यांश “मुझसे घृणा करनेवाले” बहुवचन है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יַצִּילֵנִי
  choice: उसने मुझे ... छुड़ाया
  rationale: हिफ़ील रूप का अर्थ ‘छुड़ाना/बचाना’ है। भजन के इस प्रसंग में बीते हुए उद्धार का वर्णन होने के कारण भूतकाल स्वाभाविक है, यद्यपि काव्यात्मक अपूर्ण रूप का वर्तमानकालीन अर्थ भी संभव है।
- source_word: מֵאֹיְבִי
  choice: मेरे ... शत्रु से
  rationale: इब्रानी संज्ञा एकवचन है और उस पर प्रथम पुरुष एकवचन संबंधसूचक प्रत्यय लगा है; इसलिए एकवचन रखा गया है।
- source_word: עָז
  choice: बलवान
  rationale: इस विशेषण का सीधा अर्थ ‘बलवान/शक्तिशाली’ है; ‘बलवान शत्रु’ आधुनिक हिन्दी में स्वाभाविक और गरिमापूर्ण है।
- source_word: וּמִשֹּׂנְאַי
  choice: और मुझसे घृणा करनेवालों से
  rationale: שׂנא का कृदन्त बहुवचन है, जिसका शाब्दिक भाव ‘मुझसे घृणा करनेवाले’ है। संबंधवाचक पदबंध हिन्दी में स्वाभाविक है और बहुवचन बनाए रखता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह उद्धार का कारण बताता है; आधुनिक हिन्दी में ‘क्योंकि’ स्पष्ट और स्वाभाविक संयोजक है।
- source_word: אָמְצוּ מִמֶּנִּי
  choice: वे मुझसे अधिक शक्तिशाली थे
  rationale: אָמְצוּ का अर्थ ‘बलवान होना’ है और מִמֶּנִּי तुलनात्मक अर्थ ‘मुझसे’ देता है; इसीलिए तुलना को स्पष्ट किन्तु स्रोत-संगत रूप में व्यक्त किया गया है।
theological_decisions:
- issue: आरंभिक इब्रानी क्रिया का काल-पक्ष
  choice: 'बीते समय का वर्णन: ‘उसने ... छुड़ाया’'
  alternative: 'वर्तमान-जैसा काव्यात्मक अर्थ: ‘वह मुझे ... छुड़ाता है’'
  rationale: आसपास का खंड संकट के उत्तर में हुए परमेश्वर के उद्धार को बीती घटना के रूप में सुनाता है। फिर भी अपूर्ण क्रियारूप के वर्तमान-जैसे काव्यात्मक पठन को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, देवनागरी; भाषा सरल, काव्यात्मक और गरिमापूर्ण रखी गई है। ‘छुड़ाया’ सामान्य पाठक के लिए सहज है, और एकवचन ‘शत्रु’ तथा बहुवचन ‘घृणा करनेवालों’ के स्रोतगत अंतर को बनाए रखा गया है।
