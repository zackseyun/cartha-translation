base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/000.yaml
  text: For the choirmaster[a]. Of David, the servant of Yahweh[b], who spoke to Yahweh the words of this song on the day when Yahweh rescued him from the hand of all his enemies and from the hand of Saul.
translation:
  language: hi
  text: संगीत-निर्देशक के लिए। याहवे के सेवक[a] दाऊद का। जिसने उस दिन याहवे से इस गीत के शब्द कहे, जब याहवे ने उसे उसके सभी शत्रुओं के हाथ[b] से और शाऊल के हाथ से छुड़ाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्द का अर्थ ‘दास’ भी हो सकता है; यहाँ यह दाऊद के लिए सम्मानसूचक पद के रूप में आया है।
    reason: lexical_alternative
  - marker: b
    text: ‘हाथ से’ एक इब्रानी मुहावरा है, जिसका अर्थ किसी की शक्ति या नियंत्रण से छुड़ाया जाना है।
    reason: cultural_note
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: संगीत-निर्देशक के लिए
  rationale: भजन-संग्रह के शीर्षकों में यह पद संगीत-प्रस्तुति का नेतृत्व करने वाले व्यक्ति को सूचित करता है। यह हिन्दी में स्वाभाविक है और केवल गायक-मंडली तक अर्थ को सीमित नहीं करता।
- source_word: לְעֶבֶד יְהוָה
  choice: याहवे के सेवक
  rationale: עֶבֶד का अर्थ सेवक या दास हो सकता है; यहाँ यह दाऊद के लिए सम्मानसूचक पद है, इसलिए ‘सेवक’ प्रसंगानुकूल है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी व्यंजन-नाम יהוה को उपाधि से बदलने के बजाय उसके प्रचलित लिप्यंतरण ‘याहवे’ द्वारा प्रस्तुत किया गया है।
- source_word: לְדָוִד
  choice: दाऊद का
  rationale: भजन के शीर्षक में यह रचना, संबंध या संग्रहगत संबद्धता दर्शा सकता है; ‘दाऊद का’ इस व्यापकता को अनावश्यक रूप से सीमित नहीं करता।
- source_word: אֲשֶׁר דִּבֶּר לַיהוָה אֶת דִּבְרֵי הַשִּׁירָה הַזֹּאת
  choice: उसने इस गीत के शब्द याहवे से ... कहे
  rationale: यह रूप दाऊद को संबंधवाचक उपवाक्य का कर्ता मानता है और ‘गीत के शब्द’ तथा याहवे को संबोधन—दोनों को सुरक्षित रखता है।
- source_word: הִצִּיל
  choice: छुड़ाया
  rationale: क्रिया संकट और शत्रुओं के अधिकार से बचाने या मुक्त करने को व्यक्त करती है; ‘छुड़ाया’ आधुनिक हिन्दी में स्पष्ट और प्रसंगानुकूल है।
- source_word: מִכַּף ... וּמִיַּד
  choice: के हाथ से ... और ... के हाथ से
  rationale: इब्रानी में ‘हाथ’ शक्ति या नियंत्रण का रूपक है। समानान्तर अभिव्यक्ति को हिन्दी में भी बनाए रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम יהוה का प्रयोग करता है। ‘याहवे’ नाम को उपाधि में बदले बिना प्रस्तुत करता है।
- issue: עֶבֶד को ‘सेवक’ या ‘दास’ कहना
  choice: सेवक
  alternative: दास
  rationale: दोनों अर्थ शब्द के दायरे में हैं, पर इस राजकीय और सम्मानसूचक शीर्षक में सेवा-संबंध प्रमुख है; बंधुआ स्थिति पर बल देना आवश्यक नहीं।
- issue: לְדָוִד में लेखकत्व या संबद्धता
  choice: दाऊद का
  alternative: दाऊद द्वारा रचित
  rationale: लामेद-युक्त यह शीर्षकीय रूप लेखकत्व सहित व्यापक संबद्धता व्यक्त कर सकता है। ‘दाऊद का’ मूल की संभावित व्यापकता को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण भजन-शीर्षक रखा गया है। मूल की शीर्षकीय खंड-वाक्य संरचना ‘दाऊद का’ में सुरक्षित है; बाद का वाक्य सहज हिन्दी के लिए स्पष्ट सर्वनाम के साथ दिया गया है।
