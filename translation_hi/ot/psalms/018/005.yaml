lexical_decisions:
- source_word: חֶבְלֵי
  choice: रस्सियों
  rationale: यह शब्द यहाँ बाँधने या जकड़ने वाली रस्सियों का काव्यात्मक बिंब प्रस्तुत करता है; इसे प्रसव-वेदना मानने के बजाय समानांतर पंक्ति के ‘फंदे’ के साथ स्वाभाविक रूप से पढ़ा जाता है।
- source_word: שְׁאוֹל
  choice: शिओल
  rationale: हिब्रू संकल्पना की व्यापकता बनाए रखने और उसे केवल ‘कब्र’ या किसी बाद की विशिष्ट परलोक-धारणा तक सीमित न करने के लिए लिप्यंतरण रखा गया है।
- source_word: סְבָבוּנִי
  choice: मुझे चारों ओर से घेर लिया
  rationale: क्रिया का सीधा अर्थ चारों ओर घेरना है; यह हिंदी में स्वाभाविक और संकट की तीव्रता के अनुरूप है।
- source_word: קִדְּמוּנִי
  choice: मेरे सामने आ खड़े हुए
  rationale: मूल क्रिया में सामने आने या मिलने का भाव है; शत्रुतापूर्ण संदर्भ में यह अभिव्यक्ति धमकी भरे सामना होने का भाव देती है, पर अर्थ को ‘पराजित किया’ जैसे अधिक निर्णायक रूप में नहीं बदलती।
- source_word: מוֹקְשֵׁי
  choice: फंदे
  rationale: यह शिकार पकड़ने वाले फंदे या जाल को दर्शाता है; ‘फंदे’ काव्यात्मक बिंब और ‘रस्सियों’ के साथ समानांतरता बनाए रखता है।
- source_word: מָוֶת
  choice: मृत्यु
  rationale: यह मानक और गरिमापूर्ण हिंदी रूप है तथा मृत्यु को एक घेरती हुई धमकी के रूप में प्रस्तुत करने वाले काव्यात्मक बिंब को सुरक्षित रखता है।
theological_decisions:
