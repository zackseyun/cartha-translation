  alternative: कब्र; मृतकों का लोक; अधोलोक
  rationale: लिप्यंतरण मूल शब्द की अर्थ-व्याप्ति और ‘मृत्यु’ से उसकी काव्यात्मक भिन्नता को बनाए रखता है तथा किसी एक विशिष्ट परलोक-सिद्धांत को पाठ पर आरोपित नहीं करता।
