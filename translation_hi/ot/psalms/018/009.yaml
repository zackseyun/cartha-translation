base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/009.yaml
  text: He bent the heavens and came down[a]; thick darkness was under his feet.
translation:
  language: hi
  text: उसने आकाश को झुका दिया और उतर आया; घना अन्धकार[a] उसके पैरों के नीचे था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “काला बादल” अथवा “गहरा अन्धकार”।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּט
  choice: झुका दिया
  rationale: נטה का अर्थ फैलाना, झुकाना या नीचे की ओर मोड़ना हो सकता है। इस ईश-प्रकटन के काव्यात्मक चित्र में “आकाश को झुका दिया” परमेश्वर के उतरने के लिए आकाश को नीचे झुकाने की सजीव छवि बनाए रखता है।
- source_word: שָׁמַיִם
  choice: आकाश
  rationale: हिब्रू बहुवचन रूप यहाँ आकाशीय विस्तार को सूचित करता है। आधुनिक हिन्दी में “आकाश” स्वाभाविक, गरिमापूर्ण और व्यापक अर्थ वाला है; “आकाशों” अपेक्षाकृत अस्वाभाविक लगेगा।
- source_word: וַיֵּרַד
  choice: उतर आया
  rationale: ירד नीचे उतरने को व्यक्त करता है। “उतर आया” दिव्य कर्ता की ऊपर से नीचे की गति को सहज हिन्दी में व्यक्त करता है।
- source_word: וַעֲרָפֶל
  choice: घना अन्धकार
  rationale: עֲרָפֶל गहन धुँधलके, घने अन्धकार या काले बादल का बोध करा सकता है और प्रायः ईश-प्रकटन से जुड़ा है। “घना अन्धकार” इसकी सघनता बनाए रखता है, पर इसे अनिवार्यतः बादल नहीं ठहराता।
- source_word: תַּחַת
  choice: नीचे
  rationale: स्थानसूचक सम्बन्ध को आधुनिक हिन्दी में सीधे और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: רַגְלָיו
  choice: उसके पैरों
  rationale: मूल शब्द का ठोस बहुवचन अर्थ “उसके पैर” है। इसे “पदचिह्न” या “पाँव रखने की चौकी” जैसे व्याख्यात्मक रूप में बदलने का आधार नहीं है।
theological_decisions:
- issue: ईश-प्रकटन की मानवरूपी काव्यात्मक छवि
  choice: परमेश्वर द्वारा आकाश को झुकाने, उतर आने और उसके पैरों के नीचे अन्धकार होने की ठोस छवि को बनाए रखा गया है।
  alternative: इसे परमेश्वर के हस्तक्षेप का अमूर्त या रूपकात्मक वर्णन बनाना।
  rationale: मूल पद काव्यात्मक और मानवरूपी भाषा का प्रयोग करता है। अनुवाद इस तनाव को समझाकर समाप्त करने के बजाय मूल छवि को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज किंतु काव्यात्मक और गरिमापूर्ण शैली। “अन्धकार” की वर्तनी औपचारिक साहित्यिक रजिस्टर को बनाए रखती है; वाक्य की ठोस शारीरिक छवि जानबूझकर नरम नहीं की गई।
