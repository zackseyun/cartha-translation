  text: עִם נָבָ֥ר תִּתְבָּרָ֑ר וְ/עִם עִ֝קֵּ֗שׁ תִּתְפַּתָּֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/026.yaml
  text: With the pure you show yourself pure[a], and with the crooked you show yourself twisted.
translation:
  language: hi
  text: निर्मल के साथ तू अपने को निर्मल दिखाता है, और टेढ़े के साथ तू अपने को टेढ़ा दिखाता है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या “तू चतुराई से पेश आता है” अथवा “तू टेढ़े को मात देता है।” इब्रानी में पारस्परिक शब्द-क्रीड़ा है: परमेश्वर टेढ़े व्यक्ति की टेढ़ी चाल के अनुरूप ऐसा व्यवहार करता है जो उसकी चाल को उसी पर उलट देता है; इसका अर्थ यह नहीं कि परमेश्वर स्वयं नैतिक रूप से टेढ़ा हो जाता है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: נָבָר
  choice: निर्मल
  rationale: यह शब्द नैतिक शुद्धता और निष्कलंकता का भाव देता है। ‘निर्मल’ आधुनिक हिंदी में स्वाभाविक है और अगले क्रियापद के साथ इब्रानी शब्द-क्रीड़ा को बनाए रखने देता है।
- source_word: תִּתְבָּרָר
  choice: तू अपने को निर्मल दिखाता है
  rationale: हित्पएल रूप संबंध के भीतर स्वयं को वैसा प्रकट करने का भाव देता है। यह अनुवाद נָבָר के साथ मूल की पुनरुक्तिमूलक शब्द-क्रीड़ा सुरक्षित रखता है।
- source_word: עִקֵּשׁ
  choice: टेढ़ा
  rationale: यह नैतिक रूप से विकृत या कुटिल व्यक्ति को सूचित करता है। ‘टेढ़ा’ सामान्य हिंदी में बोधगम्य है और अगले क्रियापद के साथ काव्यात्मक समानता बनाता है।
- source_word: תִּתְפַּתָּל
  choice: तू अपने को टेढ़ा दिखाता है
  rationale: यह रूप मरोड़दार, पेचीदा या चतुर प्रत्युत्तर देने का संकेत दे सकता है। मुख्य पाठ में ‘टेढ़ा’ रखने से इब्रानी की तीखी पारस्परिक शब्द-क्रीड़ा और जानबूझकर उत्पन्न तनाव बचता है; पादटिप्पणी संभावित गलतफहमी स्पष्ट करती है।
theological_decisions:
- issue: टेढ़े व्यक्ति के प्रति परमेश्वर की प्रतिक्रिया का मानवीय रूपक
  choice: मुख्य पाठ में प्रबल पारस्परिक अभिव्यक्ति ‘तू अपने को टेढ़ा दिखाता है’ बनाए रखना
  alternative: ‘तू चतुराई से पेश आता है’ या ‘तू टेढ़े को मात देता है’
  rationale: इब्रानी कविता बताती है कि परमेश्वर मनुष्य के चरित्र के अनुरूप उससे व्यवहार करता है। नरम विकल्प समानांतरता और अलंकारिक तीखापन घटा देते हैं। पादटिप्पणी स्पष्ट करती है कि इसका अर्थ परमेश्वर का नैतिक रूप से टेढ़ा हो जाना नहीं है।
translation_notes:
  register: आधुनिक मानक हिंदी में काव्यात्मक, गरिमापूर्ण और सहज शैली। भजन की सीधी संबोधन-शैली बनाए रखने के लिए ‘तू’ का प्रयोग किया गया है। ‘निर्मल/निर्मल’ और ‘टेढ़े/टेढ़ा’ की पुनरावृत्ति मूल इब्रानी की समानांतर शब्द-क्रीड़ा को प्रतिबिंबित करती है।
