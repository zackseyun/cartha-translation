base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/046.yaml
  text: Yahweh lives[a], and blessed be my rock, and exalted be the God of my salvation.
translation:
  language: hi
  text: याहवे जीवित हैं, और मेरी चट्टान धन्य हो; मेरे उद्धार के परमेश्वर महिमान्वित हों।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरे उद्धार के परमेश्वर को ऊँचा किया जाए,” अथवा “मेरे उद्धार के परमेश्वर महिमान्वित हैं।”
    reason: וְיָרוּם को इच्छार्थक अथवा घोषणात्मक रूप में समझने की सम्भावना सुरक्षित रखने के लिए।
lexical_decisions:
- source_word: חַי יְהוָה
  choice: याहवे जीवित हैं
  rationale: חַי यहाँ विधेय रूप में याहवे के जीवित होने की स्तुतिपूर्ण घोषणा है; यह शपथसूचक अर्थ जोड़े बिना मूल बल को स्वाभाविक हिन्दी में रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल में प्रयुक्त परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: וּבָרוּךְ
  choice: और ... धन्य हो
  rationale: स्तुति के प्रसंग में यह रूप आशीर्वचनात्मक उद्गार है; ‘धन्य हो’ उसके काव्यात्मक और भक्तिपूर्ण स्वर को बनाए रखता है।
- source_word: צוּרִי
  choice: मेरी चट्टान
  rationale: צוּר के ठोस रूपक को सुरक्षित रखा गया है, जिसमें परमेश्वर की स्थिरता और रक्षा निहित हैं।
- source_word: וְיָרוּם
  choice: महिमा हो
  rationale: रूपतः अपूर्ण क्रिया को समानांतर स्तुतिसूचक, इच्छार्थक उद्गार के रूप में समझा गया है। हिन्दी में परमेश्वर के लिए ‘महिमा हो’ स्वाभाविक है और ऊँचा किए जाने का स्तुतिपरक भाव व्यक्त करता है।
- source_word: אֱלוֹהֵי יִשְׁעִי
  choice: मेरे उद्धार के परमेश्वर
  rationale: सम्बन्धसूचक इब्रानी संरचना को निकटता से रखते हुए परमेश्वर को उद्धार के स्रोत के रूप में प्रस्तुत किया गया है।
theological_decisions:
- issue: יְהוָה परमेश्वर के नाम का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: व्यक्तिगत वाचा-नाम को शीर्षक से प्रतिस्थापित न कर मूल नाम को लिप्यंतरित किया गया है।
- issue: וְיָרוּם का स्तुतिपरक बल
  choice: इच्छार्थक/जयघोषात्मक ‘महिमा हो’
  alternative: ‘ऊँचा किया जाए’; घोषणात्मक ‘महिमामय हैं’
  rationale: आस-पास के आशीर्वचनात्मक समानांतर और काव्यात्मक स्तुति को प्राथमिकता दी गई है, जबकि घोषणात्मक सम्भावना पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण काव्यात्मक स्तुति। ‘चट्टान’ मूल रूपक को रखता है; ‘धन्य हो’ और ‘महिमा हो’ समानांतर जयघोष का स्वाभाविक हिन्दी रूप देते हैं।
