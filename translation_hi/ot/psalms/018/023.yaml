  text: I was blameless before him[c][b][a], and I kept myself from my iniquity.
translation:
  language: hi
  text: 'मैं उसके साथ[a] खरा[b] रहा,

    और अपने अधर्म[c] से अपने आपको बचाए रखा।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसके सामने।” प्रसंग में “उसके” से यहोवा का संकेत है।
