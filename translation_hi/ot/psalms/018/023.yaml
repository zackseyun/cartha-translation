lexical_decisions:
- source_word: וָאֱהִי
  choice: मैं ... रहा
  rationale: היה के प्रथम पुरुष एकवचन रूप को काव्यात्मक भूतकाल में स्वाभाविक हिन्दी के रूप में व्यक्त किया गया है; आरम्भिक ו को अलग से ‘और’ कहना हिन्दी में आवश्यक नहीं है।
- source_word: תָמִים
  choice: खरा
  rationale: यह शब्द यहाँ नैतिक अखंडता और निष्कपट आचरण का बोध देता है। ‘खरा’ इस प्रबल दावे को बनाए रखता है, पर अपने आप पूर्ण निष्पापता का दार्शनिक दावा नहीं जोड़ता।
- source_word: עִמּוֹ
  choice: उसके साथ
  rationale: עם का सीधा अर्थ ‘साथ’ है और पुल्लिंग एकवचन सर्वनाम को बनाए रखा गया है। प्रसंग में ‘उसके’ का संकेत यहोवा की ओर है।
- source_word: וָאֶשְׁתַּמֵּר
  choice: अपने आपको बचाए रखा
  rationale: שמר का हित्पएल रूप आत्म-सावधानी या स्वयं को रोके रखने का भाव देता है। यह हिन्दी प्रयोग उस प्रतिवर्ती अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: מֵעֲוֺנִי
  choice: अपने अधर्म से
  rationale: עָוֹן नैतिक कुटिलता, पाप या दोष का अर्थ दे सकता है। ‘अधर्म’ इसकी नैतिक गंभीरता और प्रथम पुरुष संबंधसूचक प्रत्यय ‘मेरे/अपने’ को सुरक्षित रखता है; מִן को ‘से’ कहा गया है।
theological_decisions:
- issue: תָמִים द्वारा व्यक्त नैतिक स्थिति
  choice: ‘खरा’—अखंडता और निर्दोष आचरण का दावा
  alternative: पूर्णतः निष्पाप होना
  rationale: पद वक्ता के आचरण और परमेश्वर के साथ उसके संबंध के विषय में एक प्रबल नैतिक दावा करता है, पर स्वयं इस शब्द से निरपेक्ष निष्पापता अनिवार्य नहीं होती। अनुवाद दावे को कमजोर किए बिना इस तनाव को खुला रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और काव्यात्मक हिन्दी। ‘उसके साथ’ मूल इब्रानी संबंध-रचना को निकटता से रखता है, जबकि ‘खरा रहा’ सामान्य पाठक के लिए नैतिक अखंडता को सहज ढंग से व्यक्त करता है।
