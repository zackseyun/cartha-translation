  text: At the hearing of the ear they obey me[c][b][a]; foreigners feign obedience to me.
translation:
  language: hi
  text: कान में बात पड़ते ही वे मेरी आज्ञा मानते हैं[a]; विदेशी[b] मेरे प्रति अधीनता का ढोंग करते हैं[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “कान के सुनने पर।” यह मुहावरा “सुनते ही” या “सिर्फ सुनते ही” का भाव व्यक्त करता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “विदेशीपन के पुत्र” या “विदेश के पुत्र”; अर्थात, विदेशी लोग।
    reason: lexical_alternative
  - marker: c
    text: इसका अनुवाद “मेरे प्रति झूठी निष्ठा दिखाते हैं,” “मुझसे कपटपूर्ण समर्पण करते हैं,” या “दबकर मेरे अधीन होते हैं” भी हो सकता है। इसमें अनिच्छुक या कपटपूर्ण अधीनता का भाव हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לְשֵׁמַע אֹזֶן
  choice: कान में बात पड़ते ही
  rationale: इब्रानी मुहावरा शाब्दिक रूप से ‘कान के सुनते ही’ है और सुनते ही होने वाली प्रतिक्रिया व्यक्त करता है। यह हिंदी में स्वाभाविक रहते हुए मूल की श्रवण-छवि बनाए रखता है।
- source_word: יִשָּׁמְעוּ לִי
  choice: वे मेरी आज्ञा मानते हैं
  rationale: שׁמע के साथ ל यहाँ केवल सुनने के बजाय किसी की बात मानने या आज्ञापालन करने का भाव रखता है; राजकीय विजय के संदर्भ में यही अर्थ उपयुक्त है।
- source_word: בְּנֵי נֵכָר
  choice: परदेशी
  rationale: शाब्दिक अर्थ ‘परदेश के पुत्र’ है, पर यह पराए देशों या जातियों के लोगों के लिए प्रयुक्त इब्रानी मुहावरा है। ‘परदेशी’ संक्षिप्त, स्वाभाविक और काव्यात्मक हिंदी है।
- source_word: יְכַחֲשׁוּ לִי
  choice: मेरे सामने झूठी अधीनता दिखाते हैं
  rationale: पिएल रूप में כחש छल, असत्य या अनिच्छुक और कपटपूर्ण समर्पण का संकेत दे सकता है। यह चयन आज्ञापालन और केवल दिखावटी अधीनता के बीच समानांतर विरोध को स्पष्ट करता है, बिना उसे सच्ची निष्ठा मान लेने के।
theological_decisions:
- issue: परदेशियों की प्रतिक्रिया की प्रकृति
  choice: झूठी अधीनता दिखाते हैं
  alternative: मेरे अधीन हो जाते हैं / मुझसे दबकर समर्पण करते हैं
  rationale: क्रिया वास्तविक, स्वेच्छापूर्ण निष्ठा की अपेक्षा छलपूर्ण अथवा विवश समर्पण का अर्थ दे सकती है। मुख्य पाठ में कपट का भाव रखा गया है और अन्य संभावित बारीकियाँ पादटिप्पणी में दी गई हैं।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण काव्यात्मक शैली रखी गई है। ‘कान में बात पड़ते ही’ मूल मुहावरे की ठोस छवि को स्वाभाविक हिंदी में व्यक्त करता है; ‘परदेशी’ और ‘झूठी अधीनता’ सामान्य पाठक के लिए स्पष्ट हैं।
