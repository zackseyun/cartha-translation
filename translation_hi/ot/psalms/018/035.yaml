    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּתֶּן
  choice: तूने ... दी
  rationale: נתן के क़ल वय्यिक्तोल रूप को काव्यात्मक धन्यवाद-वर्णन में सहज भूतकाल के रूप में व्यक्त किया गया है।
- source_word: מָגֵן יִשְׁעֶךָ
  choice: अपने उद्धार की ढाल
  rationale: सम्बन्धवाचक इब्रानी पदबंध को निकटता से रखा गया है; ‘उद्धार’ तत्काल बचाव से व्यापक अर्थ को भी सुरक्षित रखता है।
- source_word: וִימִינְךָ
  choice: तेरे दाहिने हाथ
  rationale: सामर्थ्य और सक्रिय सहायता की बाइबलीय छवि को शाब्दिक रूप से बनाए रखा गया है।
- source_word: תִסְעָדֵנִי
  choice: मुझे सँभाला
  rationale: סעד का अर्थ सहारा देना या थामे रखना है; ‘सँभाला’ आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: וְעַנְוַתְךָ
  choice: तेरी दीनता
  rationale: यह पद दीनता, नम्रता या कोमलता का भाव दे सकता है। ‘दीनता’ परमेश्वर के नीचे झुककर सहायता करने की चौंकाने वाली छवि और मूल का धर्मवैचारिक तनाव सुरक्षित रखती है।
- source_word: תַרְבֵּנִי
  choice: मुझे महान बनाया
  rationale: רבה के हिफ़ील रूप का अर्थ बड़ा या महान करना है; यह अनुवाद संक्षिप्त और स्वाभाविक है।
theological_decisions:
- issue: परमेश्वर के लिए וְעַנְוַתְךָ का अर्थ
  choice: तेरी दीनता
  alternative: तेरी कोमलता
  rationale: इब्रानी शब्द दीनता, नम्रता या कोमलता बता सकता है। मुख्य पाठ में ‘दीनता’ रखकर परमेश्वर के झुककर सहायता करने का आश्चर्य और धर्मवैचारिक तनाव सुरक्षित रखा गया है; सहज वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज काव्यात्मक शैली रखी गई है। भजन में परमेश्वर को सीधे संबोधन के अनुरूप एकवचन आत्मीय ‘तू/तेरे/तेरी’ प्रयोग किया गया है।
