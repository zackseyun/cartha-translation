  text: तूने मुझे तेरे उद्धार की ढाल दी, और तेरे दाहिने हाथ ने मुझे सँभाला, और तेरी नम्रता[a] ने मुझे महान बनाया।
  philosophy: optimal-equivalence
  footnotes:
