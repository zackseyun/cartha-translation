    text: या ‘मैं उन्हें कुचल देता हूँ’ अथवा ‘मैं उन्हें मार गिराता हूँ’; इब्रानी क्रिया युद्ध में प्रबल आघात से कुचलने या चूर करने का भाव देती है।
