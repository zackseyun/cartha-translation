lexical_decisions:
- source_word: אֶמְחָצֵם
  choice: मैं उन्हें चूर कर देता हूँ
  rationale: מחץ युद्ध के प्रसंग में प्रबल आघात से कुचलने या चूर करने का भाव देता है। यह चयन हिंसक युद्ध-चित्र को स्वाभाविक और स्पष्ट हिन्दी में बनाए रखता है।
- source_word: וְלֹא יֻכְלוּ קוּם
  choice: और वे उठ नहीं सकते
  rationale: יכל सामर्थ्य और קום उठने या खड़े होने को व्यक्त करता है। पराजित होकर फिर उठ न पाने के दृश्य में ‘उठ नहीं सकते’ सबसे सीधा है; ‘खड़े नहीं हो सकते’ भी सम्भव है।
- source_word: יִפְּלוּ
  choice: वे ... गिर पड़ते हैं
  rationale: נפל का मूल अर्थ ‘गिरना’ है। ‘गिर पड़ते हैं’ काव्यात्मक युद्ध-वर्णन में स्वाभाविक हिन्दी है और परिणाम की तीव्रता दिखाता है।
- source_word: תַּחַת רַגְלָי
  choice: मेरे पैरों तले
  rationale: शाब्दिक स्थान-सूचक चित्र को संक्षिप्त, स्वाभाविक और गरिमापूर्ण हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: राजकीय भजन में हिंसक युद्ध-चित्रण
  choice: प्रथम पुरुष के युद्ध-वर्णन और कुचलने के प्रबल भाव को बिना नरम किए रखा गया है।
  alternative: ‘मैं उन्हें हरा देता हूँ’ जैसे कम हिंसक शब्दों से भाव को हल्का करना।
  rationale: इब्रानी पाठ में प्रबल आघात, फिर न उठ सकना और पैरों तले गिरना स्पष्ट है; अनुवाद को इस तनाव और युद्ध-संदर्भ को बनाए रखना चाहिए।
translation_notes:
  register: आधुनिक मानक हिन्दी; काव्यात्मक पर सहज और गरिमापूर्ण शैली। ‘चूर कर देता हूँ’ मूल की हिंसक तीव्रता रखता है, जबकि ‘पैरों तले’ भजन की संक्षिप्त काव्यात्मक छवि को सुरक्षित रखता है।
