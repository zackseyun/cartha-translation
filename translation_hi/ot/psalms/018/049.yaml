    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: इसलिए
  rationale: यह पद पिछले प्रसंग से निकलने वाला निष्कर्ष या परिणाम व्यक्त करता है; ‘इसलिए’ आधुनिक हिन्दी में स्वाभाविक रूप से वही तार्किक बल रखता है।
- source_word: אוֹדְךָ
  choice: मैं तेरा धन्यवाद करूँगा
  rationale: हिफ़ील रूप यहाँ भजन-साहित्य के अनुरूप धन्यवाद और स्तुति का भाव रखता है; ‘धन्यवाद करूँगा’ व्यक्तिगत संबोधन और कृतज्ञता दोनों को स्पष्ट करता है।
- source_word: בַגּוֹיִם
  choice: जाति-जाति के बीच
  rationale: גּוֹיִם व्यापक रूप से अन्य राष्ट्रों या जनसमुदायों को सूचित करता है। ‘जाति-जाति के बीच’ अन्तरराष्ट्रीय विस्तार को स्वाभाविक, बाइबलीय हिन्दी में व्यक्त करता है और केवल राजनीतिक राज्यों तक अर्थ सीमित नहीं करता।
- source_word: יְהוָה
  choice: यहोवा
  rationale: व्यक्तिवाचक ईश्वरीय नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ द्वारा रखा गया है।
- source_word: וּלְשִׁמְךָ
  choice: और तेरे नाम का
  rationale: हिन्दी में ‘नाम का भजन गाना’ लक्ष्य या विषय के अर्थ को सहज रूप से व्यक्त करता है और अगले क्रियापद से स्वाभाविक रूप में जुड़ता है।
- source_word: אֲזַמֵּרָה
  choice: भजन गाऊँगा
  rationale: पिएल क्रिया संगीत सहित स्तुति गाने का भाव देती है; ‘भजन गाऊँगा’ इस आराधनात्मक आशय को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में उपाधि नहीं, चार अक्षरों वाला व्यक्तिवाचक ईश्वरीय नाम है। हिन्दी पाठकों में व्यापक रूप से पहचाने जाने वाले ‘यहोवा’ को रखा गया है; ‘याहवे’ सम्भावित विद्वतापरक लिप्यंतरण है।
- issue: גּוֹיִם का दायरा
  choice: जाति-जाति
  alternative: अन्यजातियों
  rationale: शब्द राष्ट्रों या गैर-इस्राएली जनों दोनों का संकेत दे सकता है। मुख्य पाठ में व्यापक अर्थ रखा गया है और संकीर्ण सम्भावना पादटिप्पणी में दी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और भजनात्मक रखी गई है। ‘तेरा/तेरे’ निकट और प्रत्यक्ष काव्यात्मक सम्बोधन को बनाए रखते हैं; वाक्य-विन्यास सामान्य हिन्दी पाठक के लिए सहज है।
