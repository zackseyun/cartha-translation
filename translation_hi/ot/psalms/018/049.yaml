  - severity: medium
    issue: ‘यहोवा’ differs from the audit trail’s required rendering of the divine name as Yahweh.
    rationale: The provided English POB decisions explicitly render יְהוָה as ‘Yahweh.’ ‘याहवे’ is the corresponding Hindi transliteration and avoids introducing the alternative form ‘Jehovah.’
  - severity: low
    issue: ‘तेरे नाम का भजन गाऊँगा’ is less idiomatic and may shift the sense toward singing a particular hymn about the name.
    rationale: ‘तेरे नाम की स्तुति गाऊँगा’ naturally expresses singing praise directed to God’s name and preserves the parallel poetic line.
