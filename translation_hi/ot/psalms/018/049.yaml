  language: hi
  text: इसलिए, हे याहवे, मैं राष्ट्रों के बीच[a] तेरा धन्यवाद करूँगा, और तेरे नाम की स्तुति गाऊँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
