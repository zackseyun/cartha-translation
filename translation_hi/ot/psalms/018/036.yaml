- source_word: וְלֹא מָעֲדוּ
  choice: और ... नहीं फिसले
  rationale: संयोजक और निषेध को समन्वयी वाक्यांश के रूप में रखा गया है; מעד यहाँ पैर जमने में चूकने या फिसलने का भाव देता है।
- source_word: קַרְסֻלָּי
  choice: मेरे टखने
  rationale: यह शब्द विशेष रूप से टखनों को सूचित करता है; ‘पाँव’ की अपेक्षा ‘टखने’ मूल की सजीव शारीरिक छवि को अधिक ठीक रखता है।
