language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: בַּ/צַּר לִ֤/י אֶֽקְרָ֣א יְהוָה֮ וְ/אֶל אֱלֹהַ֪/י אֲשַׁ֫וֵּ֥עַ יִשְׁמַ֣ע מֵ/הֵיכָל֣/וֹ קוֹלִ֑/י וְ֝/שַׁוְעָתִ֗/י לְ/פָנָ֤י/ו תָּב֬וֹא בְ/אָזְנָֽי/ו־׀־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/006.yaml
  text: In my distress I call on Yahweh[a], and to my God I cry for help. He hears my voice from his temple[b], and my cry before him comes into his ears.
translation:
  language: hi
  text: अपने संकट में मैं याहवे को पुकारता हूँ, और अपने परमेश्वर से सहायता के लिए दुहाई देता हूँ। वह अपने मंदिर[b] से मेरी आवाज़ सुनता है, और उसके सामने मेरी दुहाई उसके कानों तक पहुँचती है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या: “वह अपने मंदिर से मेरी आवाज़ सुनेगा, और उसके सामने मेरी दुहाई उसके कानों तक पहुँचेगी।” इब्रानी अपूर्ण क्रियाओं का भविष्य अर्थ भी हो सकता है।'
    reason: alternative_reading
  - marker: b
    text: “मंदिर” का अनुवाद “राजमहल” या “पवित्र निवास” भी किया जा सकता है; इब्रानी शब्द राजा अथवा परमेश्वर के निवास को दर्शा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּצַּר לִי
  choice: अपने संकट में
  rationale: צַר संकट या विपत्ति को दर्शाता है, और לִי इस अनुभव को वक्ता से जोड़ता है। यह हिंदी में स्वाभाविक और संक्षिप्त है।
- source_word: אֶקְרָא יְהוָה
  choice: मैं याहवे को पुकारता हूँ
  rationale: קרא यहाँ परमेश्वर का आह्वान करने के अर्थ में है। याहवे इब्रानी व्यक्तिगत नाम יהוה का निकट देवनागरी लिप्यंतरण है।
- source_word: וְאֶל אֱלֹהַי אֲשַׁוֵּעַ
  choice: और अपने परमेश्वर से सहायता के लिए दुहाई देता हूँ
  rationale: שׁוע सहायता पाने के लिए ऊँची पुकार या गुहार को व्यक्त करता है; ‘दुहाई देता हूँ’ काव्यात्मक गरिमा और सहायता की धारणा दोनों रखता है।
- source_word: יִשְׁמַע
  choice: वह ... सुनता है
  rationale: इब्रानी अपूर्ण क्रिया को यहाँ काव्यात्मक वर्तमान के रूप में लिया गया है; भविष्य अर्थ भी संभव है और पाद-टिप्पणी में दिया गया है।
- source_word: מֵהֵיכָלוֹ
  choice: अपने मंदिर से
  rationale: הֵיכָל मंदिर, राजमहल या पवित्र निवास का सूचक हो सकता है। परमेश्वर के संदर्भ में ‘मंदिर’ स्पष्ट है, जबकि विकल्प पाद-टिप्पणी में सुरक्षित हैं।
- source_word: קוֹלִי
  choice: मेरी आवाज़
  rationale: קוֹל का प्रार्थना के संदर्भ में स्वाभाविक अर्थ ‘आवाज़’ है।
- source_word: וְשַׁוְעָתִי לְפָנָיו
  choice: और उसके सामने मेरी दुहाई
  rationale: לְפָנָיו का शाब्दिक भाव ‘उसके सामने/उसकी उपस्थिति में’ है; यह अभिव्यक्ति उस स्थानिक और संबंधपरक बिंब को बनाए रखती है।
- source_word: תָּבוֹא בְאָזְנָיו
  choice: उसके कानों तक पहुँचती है
  rationale: यह हिंदी में स्वाभाविक रूप से गति और सुनने के मानवीय बिंब दोनों को बनाए रखता है; शाब्दिक अर्थ ‘उसके कानों में आती है’ है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा
  rationale: मूल पाठ में उपाधि नहीं, चार-अक्षरी व्यक्तिगत नाम है। ‘याहवे’ प्रचलित विद्वत पुनर्निर्मित उच्चारण के निकट देवनागरी रूप है और नाम को किसी उपाधि से नहीं बदलता।
- issue: יִשְׁמַע और תָּבוֹא का काल/पक्ष
  choice: 'काव्यात्मक वर्तमान: ‘सुनता है ... पहुँचती है’'
  alternative: 'भविष्य: ‘सुनेगा ... पहुँचेगी’'
  rationale: इब्रानी अपूर्ण रूप वर्तमान, आदतन या भविष्य अर्थ ग्रहण कर सकते हैं। संदर्भ में सजीव वर्तमान स्वाभाविक है, पर भविष्य अर्थ वास्तविक संभावना है और पाद-टिप्पणी में रखा गया है।
- issue: परमेश्वर के הֵיכָל की पहचान
  choice: मंदिर
  alternative: राजमहल या पवित्र निवास
  rationale: शब्द का अर्थ-क्षेत्र राजकीय और पवित्र दोनों निवासों को समेटता है। ‘मंदिर’ मुख्य पाठ में स्पष्ट है, पर heavenly palace/sanctuary की संभावित छाया को पाद-टिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी में, प्रार्थनात्मक-काव्यात्मक और गरिमापूर्ण रखी गई है। ‘दुहाई’ सामान्य पाठक के लिए बोधगम्य रहते हुए सहायता की तीव्र पुकार को व्यक्त करती है। मानवीय बिंब ‘उसके कानों तक’ को जानबूझकर सुरक्षित रखा गया है।
