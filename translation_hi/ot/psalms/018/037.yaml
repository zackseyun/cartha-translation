  text: אֶרְדּ֣וֹף א֭וֹיְבַ/י וְ/אַשִּׂיגֵ֑/ם וְ/לֹֽא אָ֝שׁוּב עַד כַּלּוֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/037.yaml
  text: I pursued my enemies and overtook them[a], and I did not turn back until they were consumed.
translation:
  language: hi
  text: मैंने अपने शत्रुओं का पीछा किया और उन्हें जा पकड़ा; उनका अंत हो जाने तक मैं वापस नहीं लौटा[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, अधिक शाब्दिक रूप से, “जब तक उनका विनाश पूरा न हो गया।”
    reason: इब्रानी वाक्यांश शत्रुओं की पूर्ण समाप्ति या विनाश को व्यक्त करता है; इसमें विनाश का कर्ता स्पष्ट नहीं किया गया है।
lexical_decisions:
- source_word: אֶרְדּוֹף
  choice: मैंने ... पीछा किया
  rationale: רדף के प्रथम पुरुष एकवचन अपूर्ण रूप को भजन के विजय-वर्णन के संदर्भ में भूतकाल के रूप में प्रस्तुत किया गया है।
- source_word: אֹיְבַי
  choice: अपने शत्रुओं
  rationale: אויב पर प्रथम पुरुष एकवचन प्रत्यय का स्पष्ट और स्वाभाविक हिन्दी रूप।
- source_word: וְאַשִּׂיגֵם
  choice: और उन्हें जा पकड़ा
  rationale: נשׂג के हिफ़ील रूप में पीछा करते हुए किसी तक पहुँच जाने या उसे पकड़ लेने का भाव है; ‘जा पकड़ा’ सैन्य पीछा के प्रसंग में स्वाभाविक है।
- source_word: וְלֹא אָשׁוּב
  choice: मैं वापस नहीं लौटा
  rationale: यहाँ שוב पीछा छोड़कर लौटने को व्यक्त करता है; भूतकाल संदर्भ के अनुरूप है।
- source_word: עַד כַּלּוֹתָם
  choice: जब तक उनका पूरी तरह अंत न हो गया
  rationale: כלה का रूप पूर्ण विनाश या समाप्ति को व्यक्त करता है। यह वाक्यांश हिंसक विजय के बल को बनाए रखते हुए कर्ता को स्पष्ट रूप से नहीं जोड़ता।
theological_decisions:
- issue: अंतिम उपवाक्य में विनाश का कर्ता
  choice: उनका पूरी तरह अंत न हो गया
  alternative: जब तक मैंने उन्हें पूरी तरह नष्ट न कर दिया
  rationale: इब्रानी वाक्यांश शत्रुओं के पूर्ण अंत को व्यक्त करता है, पर हिन्दी मुख्य पाठ में स्पष्ट कर्ता जोड़ना आवश्यक नहीं है। चुना गया रूप युद्ध की कठोरता को कम नहीं करता और कर्ता-संबंधी अस्पष्टता बनाए रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी। ‘जा पकड़ा’ पीछा करके शत्रुओं तक पहुँचने का सजीव भाव देता है; अंतिम उपवाक्य में मूल की पूर्णता और कर्ता-संबंधी तनाव सुरक्षित रखा गया है।
