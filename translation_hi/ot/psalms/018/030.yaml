id: PSA.18.30
reference: Psalms 18:30
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: הָ/אֵל֮ תָּמִ֪ים דַּ֫רְכּ֥/וֹ אִמְרַֽת יְהוָ֥ה צְרוּפָ֑ה מָגֵ֥ן ה֝֗וּא לְ/כֹ֤ל הַ/חֹסִ֬ים בּֽ/וֹ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/030.yaml
  text: As for God[a], his way is blameless; the word of Yahweh is refined[b]; he is a shield to all who take refuge in him.
translation:
  language: hi
  text: 'परमेश्वर का मार्ग निर्दोष है;

    याहवे का वचन परखा हुआ है[a];

    वह उन सबकी ढाल है जो उसमें शरण लेते हैं[b]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “खरा” अथवा “शुद्ध किया हुआ”; इब्रानी शब्द अग्नि में धातु को गलाकर शुद्ध करने का चित्र प्रस्तुत करता है और बताता है कि याहवे का वचन परखकर शुद्ध सिद्ध हुआ है।
    reason: lexical_alternative
  - marker: b
    text: या “उस पर भरोसा रखते हैं”; इब्रानी में अधिक शाब्दिक अर्थ “उसमें शरण लेते हैं” है, जो परमेश्वर को सुरक्षा देने वाले आश्रय के रूप में चित्रित करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֵל
  choice: परमेश्वर
  rationale: संज्ञा אֵל यहाँ सच्चे परमेश्वर को सूचित करती है। आरंभिक निश्चित उपपद और वाक्यगत प्रमुखता हिन्दी में स्वाभाविक शब्दक्रम से पर्याप्त रूप से प्रकट होती है; ‘जहाँ तक परमेश्वर की बात है’ अनावश्यक रूप से भारी होता।
- source_word: תָּמִים
  choice: निर्दोष
  rationale: यह शब्द संपूर्णता और दोषरहित होने का भाव देता है। परमेश्वर के मार्ग के लिए ‘निर्दोष’ नैतिक शुद्धता और किसी कमी से रहित होने, दोनों को सहज हिन्दी में व्यक्त करता है।
- source_word: דַּרְכּוֹ
  choice: उसका मार्ग
  rationale: דֶּרֶךְ का मूल चित्र ‘मार्ग’ है और यहाँ इसका अर्थ परमेश्वर के कार्य करने के ढंग से है; ‘मार्ग’ उस रूपक को बनाए रखता है।
- source_word: אִמְרַת יְהוָה
  choice: याहवे का वचन
  rationale: אִמְרָה कथन या वचन है। ‘वचन’ गरिमापूर्ण और सामान्य हिन्दी है, जबकि יְהוָה को उपाधि से बदलने के बजाय उसके व्यक्तिवाचक नाम ‘याहवे’ के रूप में रखा गया है।
- source_word: צְרוּפָה
  choice: परखा हुआ
  rationale: צרף धातु अग्नि में धातु को गलाकर शुद्ध करने और इस प्रकार उसकी शुद्धता प्रमाणित करने का चित्र देती है। ‘परखा हुआ’ परिणामतः सिद्ध विश्वसनीयता को सहज हिन्दी में व्यक्त करता है; शोधन का धातुकर्म-संबंधी चित्र पादटिप्पणी में सुरक्षित है।
- source_word: מָגֵן
  choice: ढाल
  rationale: शब्द का सीधा अर्थ ‘ढाल’ है; इसे सामान्य ‘रक्षक’ में बदलने के बजाय सुरक्षा का ठोस रूपक बनाए रखा गया है।
- source_word: הוּא
  choice: वह ... है
  rationale: स्वतंत्र सर्वनाम क्रियारहित उपवाक्य का कर्ता है; हिन्दी में वर्तमानकालीन ‘है’ के साथ इसका स्वाभाविक अनुवाद किया गया है।
- source_word: לְכֹל
  choice: उन सबकी
  rationale: לְ यहाँ लाभ अथवा संरक्षण का संबंध दिखाता है। ‘उन सबकी ढाल’ हिन्दी में ‘सबके लिए ढाल’ से अधिक स्वाभाविक है और सार्वभौमिक विस्तार बनाए रखता है।
- source_word: הַחֹסִים בּוֹ
  choice: जो उसमें शरण लेते हैं
  rationale: חסה सुरक्षा पाने के लिए किसी में शरण लेने को दर्शाता है। यह अनुवाद आश्रय के ठोस बिंब को बनाए रखता है; भरोसा करना इसमें निहित है, पर मूल क्रिया उससे अधिक चित्रात्मक है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिवाचक ईश्वरीय नाम है। ‘याहवे’ उसे उपाधि से प्रतिस्थापित किए बिना लिप्यंतरित करता है; ‘यहोवा’ पारंपरिक वैकल्पिक रूप है।
- issue: תָּמִים का परमेश्वर के मार्ग के संबंध में अर्थ
  choice: निर्दोष
  alternative: सिद्ध / संपूर्ण
  rationale: ‘निर्दोष’ परमेश्वर के आचरण में दोष के अभाव को व्यक्त करता है, पर इसे दार्शनिक पूर्णता की किसी विशिष्ट प्रणाली में नहीं बदलता।
- issue: צְרוּפָה में शोधन और परीक्षण का संबंध
  choice: परखा हुआ
  alternative: शुद्ध किया हुआ / खरा
  rationale: मूल धातु धातु-शोधन का बिंब रखती है, जिससे शुद्ध और कसौटी पर सिद्ध होने—दोनों भाव निकलते हैं। मुख्य पाठ में स्वाभाविक ‘परखा हुआ’ है और पादटिप्पणी मूल बिंब तथा वैकल्पिक अर्थ सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, काव्यात्मक और गरिमापूर्ण शैली रखी गई है। समानांतर पंक्तियाँ इब्रानी काव्य की गति को दर्शाती हैं। ‘मार्ग’, ‘वचन’, ‘ढाल’ और ‘शरण’ जैसे मूल बिंब सुरक्षित हैं।
