base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/029.yaml
  text: For by you I can run against a troop[b][a], and by my God I can leap over a wall.
translation:
  language: hi
  text: क्योंकि तेरे सहारे मैं एक सैन्य-दल पर धावा बोल सकता हूँ[a], और अपने परमेश्वर के सहारे मैं दीवार लाँघ सकता हूँ[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तेरे द्वारा मैं एक छापामार दल पर दौड़ पड़ता हूँ।”
    reason: lexical_alternative
  - marker: b
    text: या, “अपने परमेश्वर के सहारे मैं प्राचीर लाँघता हूँ।”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह आसपास की स्तुति और गवाही का कारण या आधार बताता है; हिन्दी में ‘क्योंकि’ इस व्याख्यात्मक संबंध को स्पष्ट रखता है।
- source_word: בְךָ
  choice: तेरे सहारे
  rationale: यहाँ ב साधन या सामर्थ्य के स्रोत को दर्शाता है। ‘तेरे सहारे’ स्वाभाविक आधुनिक हिन्दी में परमेश्वर से मिली सामर्थ्य व्यक्त करता है।
- source_word: אָרֻץ
  choice: मैं ... धावा बोल सकता हूँ
  rationale: רוץ का मूल अर्थ ‘दौड़ना’ है, पर सैन्य प्रसंग में किसी दल की ओर आक्रमण के लिए दौड़ने का भाव है। ‘धावा बोल सकता हूँ’ उस सक्रिय सैन्य चित्र और दैवी सामर्थ्य, दोनों को संप्रेषित करता है।
- source_word: גְּדוּד
  choice: एक सैन्य-दल
  rationale: यह शब्द सेना की टुकड़ी, दल या छापामार जत्थे को सूचित कर सकता है। ‘सैन्य-दल’ आकार को ‘सेना’ जितना बढ़ाए बिना युद्ध-संदर्भ स्पष्ट करता है।
- source_word: וּבֵאלֹהַי
  choice: और अपने परमेश्वर के सहारे
  rationale: यह पहले खंड के समानांतर साधन या सामर्थ्य का स्रोत बताता है और ‘अपने परमेश्वर’ व्यक्तिगत संबंध को बनाए रखता है।
- source_word: אֲדַלֶּג
  choice: मैं ... लाँघ सकता हूँ
  rationale: דלג का अर्थ उछलकर या छलाँग लगाकर पार करना है। ‘लाँघ सकता हूँ’ हिन्दी में सजीव और स्वाभाविक है तथा बाधा पार करने का भाव सुरक्षित रखता है।
- source_word: שׁוּר
  choice: दीवार
  rationale: यह विशेषतः रक्षात्मक दीवार या प्राचीर हो सकती है। मुख्य पाठ में सरल ‘दीवार’ रखा गया है और सैन्य अर्थ की सम्भावना पादटिप्पणी में दी गई है।
theological_decisions:
- issue: पद के सैन्य बिंब का स्वरूप
  choice: दैवी सामर्थ्य की गवाही के रूप में ठोस सैन्य बिंब बनाए रखना
  alternative: इसे जीवन की सामान्य बाधाओं पर विजय के रूप में अमूर्त बनाना
  rationale: इब्रानी पाठ में सैन्य-दल और दीवार जैसे प्रत्यक्ष युद्ध-संबंधी शब्द हैं। अनुवाद ऐतिहासिक-काव्यात्मक चित्र को आध्यात्मिक रूपक में बदले बिना सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘तेरे’ भजन की प्रत्यक्ष प्रार्थनात्मक संबोधन-शैली को बनाए रखता है। समानांतर दोनों खंडों में ‘के सहारे’ रखा गया है; सैन्य बिंब को न तो नरम किया गया है, न अनावश्यक रूप से विस्तृत।
