  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य हिन्दी। ‘कमरबन्द करता है’ मूल के ठोस रूपक को बचाता है; दो टिप्पणियाँ प्रमुख शब्दार्थ-विकल्पों और वास्तविक अर्थगत विस्तार को स्पष्ट करती हैं।
