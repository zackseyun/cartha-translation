  yaml_path: translation/ot/psalms/018/032.yaml
  text: The God who girds me with strength and makes my way blameless[a][b].
translation:
  language: hi
  text: वही परमेश्वर मेरी कमर सामर्थ्य से कसता है[a] और मेरे मार्ग को निष्कलंक बनाता है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मुझे सामर्थ्य से सुसज्जित करता है”; इब्रानी में शाब्दिक रूप से कमर कसने या कमरबंद बाँधने का चित्र है, और חַיִל का अर्थ सामर्थ्य, शक्ति या वीरता हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “मेरे मार्ग को सिद्ध/संपूर्ण बनाता है।” इब्रानी תָּמִים अखंडता, निष्कलंकता या निर्दोषता का बोध करा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֵל
  choice: वही परमेश्वर
  rationale: संज्ञा के साथ आए निश्चित उपपद और वर्णनात्मक बल को स्वाभाविक हिन्दी में व्यक्त करता है; ‘वही’ इस परमेश्वर की पहचान और वाक्य के बल को उभारता है।
- source_word: הַמְאַזְּרֵנִי
  choice: मुझे ... कमरबन्द करता है
  rationale: אזר के कमर कसने या कमरबन्द बाँधने के ठोस रूपक को बनाए रखता है; यहाँ इसका आशय कार्य और युद्ध के लिए समर्थ करने से है।
- source_word: חָיִל
  choice: सामर्थ्य से
  rationale: חיל के सामर्थ्य, शक्ति और वीरता-संबंधी अर्थों में इस प्रसंग के व्यक्तिगत सशक्तीकरण को स्वाभाविक रूप से व्यक्त करता है।
- source_word: וַיִּתֵּן
  choice: बनाता है
  rationale: 'यद्यपि נתן का सामान्य अर्थ ‘देना’ है, यहाँ विशेषण और कर्म के साथ इसका परिणामसूचक अर्थ है: परमेश्वर मार्ग को ऐसा बनाता है।'
- source_word: תָּמִים
  choice: निर्दोष
  rationale: यह पूर्णता, अखंडता और खरेपन का बोध करा सकता है; ‘निर्दोष’ नैतिक अर्थ को व्यक्त करता है, पर दार्शनिक या निष्पाप परिपूर्णता का अनावश्यक दावा नहीं करता।
- source_word: דַּרְכִּי
  choice: मेरे मार्ग
  rationale: דרך के जीवन-क्रम और आचरण-संबंधी रूपक को परिचित बाइबलीय हिन्दी में बनाए रखता है।
theological_decisions:
- issue: भजनकार के मार्ग के विषय में תמים का अर्थ
  choice: निर्दोष
  alternative: सिद्ध/सम्पूर्ण
  rationale: पद परमेश्वर द्वारा भजनकार के जीवन-मार्ग को अखंड और खरा बनाने की बात करता है। ‘निर्दोष’ नैतिक तनाव को बनाए रखता है और इसे निष्पाप परिपूर्णता के सिद्धान्त में नहीं बदलता।
