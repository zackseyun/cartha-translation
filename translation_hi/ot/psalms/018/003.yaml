  yaml_path: translation/ot/psalms/018/003.yaml
  text: I call on Yahweh[a], who is worthy to be praised[b], and I am saved from my enemies.
translation:
  language: hi
  text: 'मैं स्तुति के योग्य याहवे[a] को पुकारता हूँ,

    और मैं अपने शत्रुओं से बच जाता हूँ।[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में परमेश्वर का व्यक्तिगत नाम YHWH है; यहाँ उसका हिन्दी रूप ‘याहवे’ दिया गया है।
    reason: divine_name
  - marker: b
    text: या, “और मैं अपने शत्रुओं से बच जाऊँगा।” इब्रानी क्रिया का भाव भविष्यकालीन भी समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מְהֻלָּל
  choice: स्तुति के योग्य
  rationale: पुअल कृदन्त यहाँ यहोवा के विषय में विधेयात्मक रूप से प्रयुक्त है। ‘स्तुति के योग्य’ उसके मूल्यांकनात्मक भाव को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: אֶקְרָא
  choice: मैं ... को पुकारता हूँ
  rationale: परमेश्वर के नाम के साथ קרא प्रार्थनापूर्वक पुकारने या सहायता के लिए आह्वान करने का भाव देता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम YHWH को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है, किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: וּמִן
  choice: और ... से
  rationale: संयोजक और संबंधसूचक उपसर्ग दोनों वाक्यांशों को जोड़ते हैं; ‘और ... से’ मूल से अधिक कारणात्मकता जोड़े बिना संबंध बनाए रखता है।
- source_word: אֹיְבַי
  choice: अपने शत्रुओं
  rationale: संज्ञा אויב पर प्रथम पुरुष एकवचन प्रत्यय का सीधा और पारदर्शी हिन्दी रूप।
- source_word: אִוָּשֵׁעַ
  choice: बचाया जाता हूँ
  rationale: ישׁע का निफ़अल अपूर्ण रूप काव्यात्मक प्रसंग में सामान्य या परिणामसूचक वर्तमान व्यक्त कर सकता है। कर्मवाच्य हिन्दी मूल रूप को बनाए रखती है; भविष्य का अर्थ भी संभव है और पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ व्यक्तिगत ईश्वरीय नाम का प्रयोग करता है। हिन्दी पाठकों के लिए परिचित लिप्यंतरण ‘यहोवा’ नाम को नाम ही रहने देता है, जबकि ‘प्रभु’ उसे उपाधि में बदल देता। ‘याहवे’ भी संभावित लिप्यंतरण है।
- issue: אִוָּשֵׁעַ का कालगत/पक्षगत अर्थ
  choice: सामान्य या परिणामसूचक वर्तमान—‘बचाया जाता हूँ’
  alternative: भविष्य—‘बचाया जाऊँगा’
  rationale: इब्रानी अपूर्ण क्रिया यहाँ निश्चित रूप से केवल वर्तमान या केवल भविष्य निर्धारित नहीं करती। मुख्य पाठ भजनकार के सामान्य विश्वास को व्यक्त करता है और भविष्यगत संभावना पादटिप्पणी में सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। काव्यात्मक समानांतरता बनाए रखने के लिए पद को दो पंक्तियों में रखा गया है। ‘स्तुति के योग्य’ मूल कृदन्त का मूल्यांकनात्मक बल व्यक्त करता है, और ‘बचाया जाता हूँ’ मूल के कर्मवाच्य स्वरूप तथा उसकी सामान्य/परिणामसूचक अस्पष्टता को यथासंभव सुरक्षित रखता है।
