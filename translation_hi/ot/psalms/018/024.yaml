  yaml_path: translation/ot/psalms/018/024.yaml
  text: Yahweh repaid me according to my righteousness[b][a], according to the cleanness of my hands before his eyes.
translation:
  language: hi
  text: याहवे ने मुझे मेरी धार्मिकता के अनुसार प्रतिफल दिया,[a] मेरे हाथों की उस निर्मलता के अनुसार जो उसकी आँखों के सामने थी।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मुझे वापस दिया” अथवा “मेरे कर्म के अनुसार फल दिया।” इब्रानी क्रिया किसी के आचरण के अनुरूप उसे वापस देने या प्रतिफल देने का अर्थ रख सकती है।
    reason: lexical_alternative
  - marker: b
    text: “हाथों की निर्मलता” निर्दोष या खरे आचरण के लिए प्रयुक्त एक इब्रानी मुहावरा है।
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּשֶׁב
  choice: प्रतिफल दिया
  rationale: हिफ़ील रूप यहाँ आचरण के अनुरूप वापस देने या फल देने का भाव व्यक्त करता है। ‘प्रतिफल दिया’ सकारात्मक संदर्भ में स्वाभाविक है और ‘लौटा दिया’ की अपेक्षा आशय अधिक स्पष्ट करता है; फिर भी अन्य अर्थों की संभावना पादटिप्पणी में रखी गई है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय लिप्यंतरित रूप में रखा गया है।
- source_word: לִי
  choice: मुझे
  rationale: प्रतिफल देने की हिन्दी क्रिया के साथ यह स्वाभाविक कर्म-रूप है और इब्रानी לִי का आशय सुरक्षित रखता है।
- source_word: כְצִדְקִי
  choice: मेरी धार्मिकता के अनुसार
  rationale: כְּ अनुरूपता या माप को सूचित करता है और צִדְקִי वक्ता की धार्मिकता अथवा खराई को। ‘धार्मिकता’ मूल कथन की धर्मवैचारिक तीक्ष्णता बनाए रखती है।
- source_word: כְבֹר
  choice: निर्मलता के अनुसार
  rationale: בֹּר स्वच्छता या शुद्धता का बोध कराता है। ‘निर्मलता’ हाथों के ठोस रूपक के साथ स्वाभाविक और गरिमापूर्ण हिन्दी है।
- source_word: יָדַי
  choice: मेरे हाथों की
  rationale: मूल रूपक को व्यवहार या निर्दोषता जैसे अमूर्त अर्थ में समतल न करके ‘हाथों’ को बनाए रखा गया है।
- source_word: לְנֶגֶד עֵינָיו
  choice: जो उसकी आँखों के सामने थी
  rationale: यह मूल के मानव-सदृश चित्र ‘उसकी आँखों के सामने’ को सुरक्षित रखता है। सम्बन्धवाचक उपवाक्य हिन्दी में स्पष्ट करता है कि निर्मलता याहवे की दृष्टि में थी।
theological_decisions:
- issue: क्या भजनकार के अपनी धार्मिकता और निर्मल हाथों के दावे को नरम किया जाए
  choice: उसके आचरण के अनुसार मिले प्रतिफल का सीधा दावा बनाए रखा गया
  alternative: ‘धार्मिकता’ को केवल वाचा-निष्ठा या सापेक्ष निर्दोषता के रूप में व्याख्यायित करके पुनर्लेखन करना
  rationale: इब्रानी पाठ स्पष्ट रूप से ‘मेरी धार्मिकता’ और ‘मेरे हाथों की निर्मलता’ कहता है। अनुवाद को इस धर्मवैचारिक तनाव को समझाकर समाप्त करने के बजाय सुरक्षित रखना चाहिए।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण स्तर रखा गया है। ‘धार्मिकता’ धर्मग्रंथीय परिचित शब्द है, जबकि वाक्य-विन्यास को सामान्य पाठक के लिए स्वाभाविक बनाया गया है। दोनों पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
