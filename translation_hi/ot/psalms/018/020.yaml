base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/020.yaml
  text: Yahweh has dealt with me according to my righteousness[b][a]; according to the cleanness of my hands he has repaid me.
translation:
  language: hi
  text: याहवे ने मेरी धार्मिकता के अनुसार मुझे प्रतिफल दिया है; मेरे हाथों की शुद्धता के अनुसार उसने मुझे प्रतिदान किया है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יִגְמְלֵנִי
  choice: मुझे प्रतिफल दिया है
  rationale: גמל यहाँ व्यक्ति के आचरण के अनुरूप उसके साथ व्यवहार करने या उसे प्रतिफल देने का भाव रखता है। समानांतर पंक्ति में प्रतिदान की धारणा होने से सकारात्मक प्रतिफल का अर्थ स्वाभाविक है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को उपाधि से बदलने के बजाय आधुनिक हिन्दी में प्रचलित लिप्यंतरण द्वारा रखा गया है।
- source_word: כְּצִדְקִי
  choice: मेरी धार्मिकता के अनुसार
  rationale: צדק यहाँ भजनकार की सही और खरी चाल को व्यक्त करता है। 'धार्मिकता' मूल के स्पष्ट प्रथम-पुरुष दावे और उसके धार्मिक तनाव को बनाए रखती है।
- source_word: כְּבֹר יָדַי
  choice: मेरे हाथों की शुद्धता के अनुसार
  rationale: בֹּר की शुद्धता और יָדַי के हाथ—दोनों को बनाए रखने से निर्दोष या खरी चाल का मूर्त इब्रानी बिंब सुरक्षित रहता है।
- source_word: יָשִׁיב לִי
  choice: उसने मुझे बदला दिया है
  rationale: שוב का हिफ़ील रूप यहाँ अनुरूप प्रतिदान का अर्थ देता है। 'बदला दिया' आधुनिक हिन्दी में लौटाए गए फल को व्यक्त करता है, यद्यपि संदर्भ में यह अनुकूल प्रतिदान है।
theological_decisions:
- issue: '''मेरी धार्मिकता'' को निष्पाप सिद्धता या आत्म-उद्धार का दावा समझे जाने की संभावना'
  choice: मूल के प्रथम-पुरुष दावे को सीधे 'मेरी धार्मिकता' के रूप में बनाए रखा गया है।
  alternative: '''मेरी निर्दोषता'' या ''मेरे न्यायपूर्ण पक्ष'''
  rationale: इब्रानी पाठ स्पष्ट रूप से צדק के साथ प्रथम-पुरुष संबंधसूचक रूप रखता है। अनावश्यक व्याख्या जोड़कर दावे को कमजोर करना उचित नहीं; संदर्भगत खरी चाल और परमेश्वर द्वारा उसके अनुरूप प्रतिदान का तनाव बना रहता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक रखी गई है। समानांतर संरचना को सुरक्षित रखा गया है और 'हाथों की शुद्धता' के इब्रानी बिंब को सरल व्याख्यात्मक गद्य में नहीं बदला गया।
