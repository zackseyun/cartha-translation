  yaml_path: translation/ot/psalms/018/041.yaml
  text: They cried for help, but there was no savior; to the LORD, but he did not answer them.
translation:
  language: hi
  text: उन्होंने सहायता के लिए पुकारा, पर कोई उद्धारकर्ता न था; उन्होंने यहोवा को पुकारा, पर उसने उन्हें उत्तर नहीं दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְשַׁוְּעוּ
  choice: सहायता के लिए पुकारा
  rationale: यह क्रिया संकट में सहायता की गुहार लगाने का भाव व्यक्त करती है; इस संदर्भ में स्वाभाविक आधुनिक हिन्दी वाक्यांश चुना गया।
- source_word: מוֹשִׁיעַ
  choice: उद्धारकर्ता
  rationale: हिफ़ील कृदंत का संज्ञात्मक अर्थ ‘बचाने वाला/उद्धारकर्ता’ है; स्रोत के स्पष्ट उद्धार-संबंधी शब्द को बनाए रखा गया।
- source_word: יְהוָה
  choice: यहोवा
  rationale: व्यक्तिगत दिव्य नाम को उपाधि में बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण द्वारा प्रस्तुत किया गया।
- source_word: עָנָם
  choice: उन्हें उत्तर नहीं दिया
  rationale: क्रिया ענה का सामान्य अर्थ ‘उत्तर देना’ है और बहुवचन कर्मप्रत्यय ‘उन्हें’ को स्पष्ट रखा गया।
theological_decisions:
- issue: מוֹשִׁיעַ को सामान्य ‘बचाने वाला’ या धर्मवैचारिक ‘उद्धारकर्ता’ कहना
  choice: उद्धारकर्ता
  alternative: बचाने वाला
  rationale: मूल शब्द दोनों अर्थ-छायाएँ रखता है; ‘उद्धारकर्ता’ स्रोत की संज्ञात्मक और धर्मवैचारिक शक्ति को बनाए रखता है, बिना यह जोड़े कि यहाँ कोई विशिष्ट बाद की पहचान अभिप्रेत है।
- issue: दिव्य नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल में उपाधि नहीं बल्कि विशिष्ट नाम है; इसलिए नाम का प्रचलित हिन्दी रूप चुना गया।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण है। हिब्रू की खंडित समानांतर रचना को स्वाभाविक हिन्दी में स्पष्ट करने के लिए दूसरे खंड में ‘उन्होंने ... पुकारा’ दोहराया गया है; अर्थ में कोई नया तत्व नहीं जोड़ा गया।
