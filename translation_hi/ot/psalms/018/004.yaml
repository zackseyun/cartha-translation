  text: The cords of death surrounded me[a], and the torrents of destruction terrified me.
translation:
  language: hi
  text: 'मृत्यु की रस्सियों ने मुझे चारों ओर से घेर लिया,

    और विनाश की प्रचंड धाराओं[a] ने मुझे भयभीत कर दिया।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल शब्द का अर्थ ‘निकम्मापन’, ‘दुष्टता’ या ‘विनाश’ हो सकता है; इसे व्यक्तिवाचक नाम मानकर ‘बेलियाल की प्रचंड धाराएँ’ भी अनुवाद किया जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: אֲפָפוּנִי
  choice: मुझे चारों ओर से घेर लिया
  rationale: क्रिया אפף चारों ओर से घेरने का भाव व्यक्त करती है। यह हिंदी में स्वाभाविक है और संकट की सजीव छवि बनाए रखती है।
- source_word: חֶבְלֵי
  choice: रस्सियों
  rationale: חבל का मूल अर्थ रस्सी या डोरी है। यहाँ ठोस काव्यात्मक बिंब को बनाए रखने के लिए ‘रस्सियों’ को चुना गया है; ‘फंदों’ का अर्थ भी संभव है, पर वह अधिक व्याख्यात्मक होगा।
- source_word: מָוֶת
  choice: मृत्यु
  rationale: मूल शब्द का सीधा और प्रसंगानुकूल अर्थ।
- source_word: נַחֲלֵי
  choice: प्रचंड धाराओं
  rationale: נחל घाटी में बहने वाली धारा, नाला या अचानक उमड़ती बाढ़ को सूचित कर सकता है। ‘प्रचंड धाराओं’ से यहाँ उसकी भयावह गति और शक्ति स्वाभाविक हिंदी में व्यक्त होती है।
- source_word: בְלִיַּעַל
  choice: विनाश
  rationale: इस प्रसंग में בְלִיַּעַל को व्यक्तिवाचक नाम मानने के बजाय अनिष्ट, दुष्टता या विनाशकारी शक्ति सूचित करने वाली सामान्य संज्ञा समझना अधिक संभावित है। ‘विनाश’ पद्य के संकटपूर्ण बिंब को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: יְבַעֲתוּנִי
  choice: मुझे भयभीत कर दिया
  rationale: यह क्रिया अचानक छा जाने वाले भय या आतंक को व्यक्त करती है। ‘भयभीत कर दिया’ स्पष्ट, आधुनिक और पर्याप्त रूप से प्रबल है।
theological_decisions:
- issue: क्या בְלִיַּעַל को व्यक्तिवाचक नाम ‘बेलियाल’ माना जाए या विनाश/दुष्टता सूचित करने वाली सामान्य संज्ञा
  choice: सामान्य संज्ञा के रूप में ‘विनाश’
  alternative: ‘दुष्टता/निकम्मेपन की धाराएँ’ अथवा व्यक्तिवाचक नाम के रूप में ‘बेलियाल की धाराएँ’
  rationale: भजन के इस प्राचीन काव्यात्मक प्रसंग में किसी विकसित दुष्ट आत्मिक व्यक्तित्व का नाम मानना आवश्यक नहीं है। ‘विनाश’ संदर्भ में प्राकृतिक और अर्थपूर्ण है, जबकि पादटिप्पणी मूल शब्द की व्यापकता और व्यक्तिवाचक नाम की संभावना सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी में काव्यात्मक और गरिमापूर्ण रखी गई है। ‘रस्सियों’ और ‘प्रचंड धाराओं’ के समानांतर संकट-बिंब सुरक्षित हैं; कठिन हिब्रू शब्द בְלִיַּעַל की अनिश्चितता पादटिप्पणी में स्पष्ट की गई है।
