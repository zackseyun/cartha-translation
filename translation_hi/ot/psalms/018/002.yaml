source:
  edition: WLC
  text: יְהוָ֤ה סַֽלְעִ֥/י וּ/מְצוּדָתִ֗/י וּ/מְפַ֫לְטִ֥/י אֵלִ֣/י צ֭וּרִ/י אֶֽחֱסֶה בּ֑/וֹ מָֽגִנִּ֥/י וְ/קֶֽרֶן יִ֝שְׁעִ֗/י מִשְׂגַּבִּֽ/י׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/002.yaml
  text: Yahweh is my crag and my fortress and my deliverer[a], my God, my rock, in whom I take refuge, my shield and the horn of my salvation[c][b], my stronghold.
translation:
  language: hi
  text: याहवे मेरी चट्टान, मेरा गढ़ और मेरा छुड़ानेवाला है; मेरा परमेश्वर, मेरी शिला, जिसमें मैं शरण लेता हूँ; मेरी ढाल, मेरे उद्धार का सींग[a] और मेरा ऊँचा सुरक्षित स्थान।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ “सींग” सामर्थ्य और विजय दिलानेवाली उद्धार-शक्ति का रूपक है।
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय देवनागरी लिप्यंतरण में रखा गया है।
- source_word: סַלְעִי
  choice: मेरी चट्टान
  rationale: सֶלַע की खड़ी या विशाल चट्टान की छवि रखता है और आगे आए צוּר से शब्दगत भेद बनाए रखता है।
- source_word: מְצוּדָתִי
  choice: मेरा गढ़
  rationale: किलेबंद सुरक्षा-स्थान का स्वाभाविक और संक्षिप्त हिन्दी रूप है।
- source_word: מְפַלְטִי
  choice: मेरा छुड़ानेवाला
  rationale: कारक कृदंत का अर्थ—जो संकट से निकालता है—व्यक्तिगत और सक्रिय रूप में व्यक्त करता है।
- source_word: אֵלִי
  choice: मेरा परमेश्वर
  rationale: इस प्रसंग में אֵל प्रथम पुरुष प्रत्यय के साथ सामान्य ईश्वरीय संबोधन है।
- source_word: צוּרִי
  choice: मेरी शिला
  rationale: स्थिर, रक्षक शिला की रूपकात्मक छवि रखता है तथा סַלְעִי के लिए प्रयुक्त 'चट्टान' से भेद करता है।
- source_word: אֶחֱסֶה בּוֹ
  choice: जिसमें मैं शरण लेता हूँ
  rationale: חסה के आश्रय लेने के ठोस भाव को बनाए रखता है; केवल 'भरोसा' कहने से सुरक्षा की छवि हल्की पड़ती।
- source_word: מָגִנִּי
  choice: मेरी ढाल
  rationale: युद्ध और रक्षा का सीधा रूपक है।
- source_word: קֶרֶן יִשְׁעִי
  choice: मेरे उद्धार का सींग
  rationale: इब्रानी रूपक को बनाए रखता है; सींग सामर्थ्य और विजयी बचाव का चिह्न है।
- source_word: מִשְׂגַּבִּי
  choice: मेरा ऊँचा सुरक्षित स्थान
  rationale: ऊँचे और अगम्य आश्रय का भाव स्पष्ट करता है तथा पहले आए 'गढ़' से भेद बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा अथवा प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम है; उसे उपाधि से प्रतिस्थापित नहीं किया गया।
- issue: सुरक्षा-संबंधी अनेक रूपकों का संरक्षण
  choice: चट्टान, गढ़, शिला और ऊँचा सुरक्षित स्थान जैसे अलग रूप
  alternative: कई इब्रानी शब्दों को एक ही 'चट्टान' या 'गढ़' से समतल करना
  rationale: इब्रानी कविता अलग-अलग रक्षक छवियों को एकत्र करती है; भेद बनाए रखने से उसका काव्यात्मक और अर्थगत तनाव सुरक्षित रहता है।
- issue: קֶרֶן का रूपक
  choice: सींग का शाब्दिक रूपक बनाए रखना
  alternative: मेरे उद्धार की शक्ति
  rationale: मूल की सांस्कृतिक छवि को मुख्य पाठ में सुरक्षित रखते हुए पादटिप्पणी उसका आशय स्पष्ट करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण काव्यात्मक शैली रखी गई है। समानार्थी सुरक्षा-शब्दों को अनावश्यक रूप से एक नहीं किया गया; वाक्य की सूचीबद्ध इब्रानी लय को अर्धविरामों से संभाला गया है।
