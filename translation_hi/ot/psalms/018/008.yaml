  text: עָ֘לָ֤ה עָשָׁ֨ן בְּ/אַפּ֗/וֹ וְ/אֵשׁ מִ/פִּ֥י/ו תֹּאכֵ֑ל גֶּ֝חָלִ֗ים בָּעֲר֥וּ מִמֶּֽ/נּוּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/008.yaml
  text: Smoke rose from his nostrils[a], and fire from his mouth consumed; coals blazed from him.
translation:
  language: hi
  text: 'उसके नथनों से धुआँ उठा[a],

    और उसके मुँह से निकली आग भस्म करती गई;

    उससे अंगारे धधक उठे।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसके क्रोध से”; इब्रानी אַף का अर्थ “नाक/नथना” भी हो सकता है और लाक्षणिक रूप से “क्रोध” भी। यहाँ “उसके मुँह से” के समानांतर चित्र के कारण मुख्य पाठ में ठोस अर्थ लिया गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלָה עָשָׁן
  choice: धुआँ उठा
  rationale: עָלָה धुएँ की ऊपर की ओर गति बताता है; आधुनिक हिन्दी में ‘धुआँ उठा’ इसका स्वाभाविक और सटीक काव्यात्मक रूप है।
- source_word: בְּאַפּוֹ
  choice: उसके नथनों से
  rationale: אַף का अर्थ ‘नाक/नथना’ और लाक्षणिक अर्थ ‘क्रोध’ दोनों हो सकता है। मुँह से आग निकलने के समानांतर ठोस देहात्मक चित्र के कारण यहाँ ‘नथनों से’ मुख्य पाठ में रखा गया है।
- source_word: מִפִּיו תֹּאכֵל
  choice: उसके मुँह से निकली आग भस्म करती गई
  rationale: תֹּאכֵל क्रियात्मक रूप है, जिसका अर्थ ‘खा जाना/भस्म करना’ है। हिन्दी वाक्य में ‘निकली’ निहित निर्गमन को स्वाभाविक बनाता है, जबकि ‘भस्म करती गई’ आग की सक्रिय विनाशकारी क्रिया को बनाए रखता है।
- source_word: גֶּחָלִים בָּעֲרוּ
  choice: अंगारे धधक उठे
  rationale: גֶּחָלִים के लिए ‘अंगारे’ और בָּעֲרוּ के लिए ‘धधक उठे’ इस अग्निमय काव्य-चित्र की तीव्रता तथा आरंभ/प्रज्वलन की छाया को स्वाभाविक हिन्दी में व्यक्त करते हैं।
- source_word: מִמֶּנּוּ
  choice: उससे
  rationale: מן के मूल स्रोत-बोध को संक्षिप्त रूप में सुरक्षित रखता है और यह नहीं बताता कि अंगारे उसके द्वारा जलाए गए या उसमें से निकले—मूल की संभावित अर्थ-व्याप्ति बनी रहती है।
theological_decisions:
- issue: ईश्वर के लिए देहात्मक भाषा
  choice: ‘नथनों’ और ‘मुँह’ के ठोस चित्र को बनाए रखा गया
  alternative: אַף को लाक्षणिक रूप से ‘क्रोध’ अनुवाद करना
  rationale: यह ईश्वर-प्रकाशन का काव्यात्मक वर्णन है। मूल पाठ जानबूझकर देहात्मक और अग्निमय चित्र प्रस्तुत करता है; उसे अमूर्त ‘क्रोध’ में बदलना काव्यात्मक तनाव को समय से पहले सुलझा देता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और काव्यात्मक हिन्दी। पंक्ति-विभाजन इब्रानी समानांतरता को उभारता है; अत्यधिक संस्कृतनिष्ठ शब्दावली से बचते हुए अग्निमय ईश्वर-प्रकाशन की तीव्रता बनाए रखी गई है।
