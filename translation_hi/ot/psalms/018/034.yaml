base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/034.yaml
  text: He trains my hands for battle[a], and my arms can bend a bow of bronze.
translation:
  language: hi
  text: वह मेरे हाथों को युद्ध के लिए प्रशिक्षित करता है, और मेरी भुजाएँ काँसे के धनुष को मोड़ सकती हैं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, अधिक शाब्दिक रूप में, “और काँसे का धनुष मेरी भुजाओं द्वारा मोड़ा जाता है।” इब्रानी उपवाक्य कठिन है और उसका अनुवाद शाब्दिक कर्मवाच्य अर्थ में भी किया जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: מְלַמֵּד
  choice: प्रशिक्षित करता है
  rationale: למד का कृदन्त ‘सिखाने’ या ‘प्रशिक्षित करने’ का अर्थ दे सकता है। युद्ध के संदर्भ में व्यावहारिक तैयारी व्यक्त करने के लिए ‘प्रशिक्षित करता है’ स्वाभाविक और सटीक है।
- source_word: יָדַי
  choice: मेरे हाथों
  rationale: मूल के बहुवचन और युद्ध की ठोस शारीरिक छवि को बनाए रखा गया है।
- source_word: לַמִּלְחָמָה
  choice: युद्ध के लिए
  rationale: מלחמה युद्ध या लड़ाई को सूचित करता है; यहाँ ‘युद्ध के लिए’ आधुनिक हिन्दी में स्वाभाविक ढंग से सैन्य संदर्भ को बनाए रखता है।
- source_word: וְנִחֲתָה
  choice: झुका सकती हैं
  rationale: यह रूप और इसकी वाक्य-रचना कठिन है। संदर्भ में इसे परमेश्वर से मिली सामर्थ्य के परिणामस्वरूप धनुष झुका पाने की योग्यता के रूप में व्यक्त किया गया है; शाब्दिक कर्मवाच्य संभावना पाद-टिप्पणी में सुरक्षित रखी गई है।
- source_word: קֶשֶׁת נְחוּשָׁה
  choice: काँसे के धनुष
  rationale: קֶשֶׁת हथियार के रूप में ‘धनुष’ है और נְחוּשָׁה ताँबे/काँसे की धातु को सूचित करता है। शक्तिशाली हथियार की छवि में ‘काँसा’ उपयुक्त पारंपरिक अर्थ है।
- source_word: זְרוֹעֹתָי
  choice: मेरी भुजाएँ
  rationale: मूल के बहुवचन और शारीरिक सामर्थ्य की काव्यात्मक छवि को बनाए रखा गया है।
theological_decisions:
- issue: कठिन उपवाक्य וְנִחֲתָה קֶשֶׁת נְחוּשָׁה זְרוֹעֹתָי की व्याख्या
  choice: “मेरी भुजाएँ काँसे के धनुष को झुका सकती हैं” के द्वारा समर्थ बनाई गई योग्यता व्यक्त की गई है।
  alternative: “काँसे का धनुष मेरी भुजाओं से झुकाया जाता है।”
  rationale: इब्रानी वाक्य संक्षिप्त और वाक्य-विन्यास की दृष्टि से कठिन है। मुख्य पाठ का सक्रिय, सामर्थ्य-सूचक रूप काव्यात्मक समानांतरता और युद्ध के लिए परमेश्वर द्वारा सक्षम किए जाने के भाव को स्वाभाविक हिन्दी में व्यक्त करता है; अधिक शाब्दिक कर्मवाच्य अर्थ पाद-टिप्पणी में दिया गया है, ताकि वास्तविक अस्पष्टता बनी रहे।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण रूप अपनाया गया है। ‘प्रशिक्षित करता है’, ‘युद्ध’ और ‘भुजाएँ’ युद्ध-कौशल तथा शारीरिक सामर्थ्य की मूल काव्यात्मक छवि को सामान्य पाठक के लिए स्पष्ट रखते हैं।
