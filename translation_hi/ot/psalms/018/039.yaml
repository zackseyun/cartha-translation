  text: तूने मुझे युद्ध के लिए सामर्थ्य से सुसज्जित किया[a]; तूने मेरे विरुद्ध उठनेवालों को मेरे अधीन झुका दिया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप में: “तूने युद्ध के लिए मुझे सामर्थ्य से कमर कसी।”'
    reason: lexical_alternative
  - marker: b
    text: अर्थात् तूने उन्हें पराजित करके मेरे अधीन कर दिया।
    reason: metaphor_clarification
lexical_decisions:
- source_word: וַתְּאַזְּרֵנִי
  choice: मुझे ... सुसज्जित किया
  rationale: אזר का मूल चित्र कमर बाँधने का है और यहाँ उसका आशय युद्ध के लिए तैयार या समर्थ करने से है। ‘सुसज्जित किया’ आधुनिक हिन्दी में स्वाभाविक है और ‘हथियारों से लैस किया’ जैसी अनावश्यक संकीर्णता से बचता है।
- source_word: חַיִל
  choice: सामर्थ्य
  rationale: इस प्रसंग में חַיִל सेना नहीं, बल्कि युद्ध करने की शक्ति या क्षमता को दर्शाता है। ‘सामर्थ्य’ गरिमापूर्ण और स्पष्ट है।
- source_word: לַמִּלְחָמָה
  choice: युद्ध के लिए
  rationale: यहाँ מִלְחָמָה सशस्त्र संघर्ष को सूचित करता है; ‘युद्ध के लिए’ हिन्दी में सीधा और स्वाभाविक है।
- source_word: תַּכְרִיעַ
  choice: झुका दिया
  rationale: כרע के हिफ़ील रूप में किसी को झुकाने, घुटने टेकने या नीचे गिराने का भाव है। ‘झुका दिया’ पराजय के दृश्यात्मक रूपक को बनाए रखता है।
- source_word: קָמַי
  choice: मेरे विरुद्ध उठनेवालों
  rationale: यह קום से बना कृदन्त है। यह चयन केवल ‘शत्रुओं’ कहने के बजाय मूल के ‘विरुद्ध उठने’ वाले जीवंत भाव को सुरक्षित रखता है।
- source_word: תַּחְתָּי
  choice: मेरे नीचे
  rationale: शाब्दिक स्थान-सूचक रूपक विजित होकर अधीन होने को व्यक्त करता है। ‘मेरे नीचे’ मूल की छवि और उसकी संक्षिप्तता बनाए रखता है।
