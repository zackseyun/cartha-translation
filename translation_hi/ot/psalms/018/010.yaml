source:
  edition: WLC
  text: וַ/יִּרְכַּ֣ב עַל כְּ֭רוּב וַ/יָּעֹ֑ף וַ֝/יֵּ֗דֶא עַל כַּנְפֵי רֽוּחַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/010.yaml
  text: And he rode on a cherub and flew[b][a]; he sped on the wings of the wind.
translation:
  language: hi
  text: वह करूब पर सवार हुआ और उड़ चला; वह पवन[b] के पंखों पर वेग से उड़ता गया[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: दुर्लभ इब्रानी क्रिया का अनुवाद ‘झपटता गया’ या ‘तेज़ी से उड़ता गया’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी शब्द का अर्थ ‘पवन,’ ‘श्वास’ या ‘आत्मा’ हो सकता है; यहाँ तूफानी चित्र के कारण ‘पवन’ सबसे उपयुक्त है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְכַּב
  choice: सवार हुआ
  rationale: रכב का सामान्य अर्थ किसी सवारी पर चढ़ना या सवार होना है। यह चयन इब्रानी के सजीव चित्र को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: עַל
  choice: पर
  rationale: यहाँ यह पूर्वसर्ग करूब को सवारी या आधार के रूप में दिखाता है; हिन्दी में ‘पर’ इसका सीधा और सहज समतुल्य है।
- source_word: כְּרוּב
  choice: करूब
  rationale: एकवचन इब्रानी संज्ञा के लिए प्रचलित बाइबलीय हिन्दी रूप रखा गया है; चित्र का रूपकात्मक स्पष्टीकरण पाठ में नहीं जोड़ा गया।
- source_word: וַיָּעֹף
  choice: उड़ चला
  rationale: עוף का सीधा अर्थ ‘उड़ना’ है। ‘उड़ चला’ क्रमिक कथात्मक गति और काव्यात्मक प्रवाह को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וַיֵּדֶא
  choice: वेग से उड़ता गया
  rationale: दुर्लभ क्रिया को प्रसंग में तीव्र हवाई गति के अर्थ में समझा गया है। यह अनुवाद समानांतर ‘उड़ चला’ से संबंध बनाए रखते हुए गति की तीव्रता व्यक्त करता है, पर झपटने या गोता लगाने जैसी अधिक विशिष्ट मुद्रा आरोपित नहीं करता।
- source_word: כַּנְפֵי
  choice: पंखों पर
  rationale: כָּנָף के बहुवचन संबंध-रूप का ठोस काव्यात्मक चित्र ‘पंखों’ द्वारा सुरक्षित रहता है।
- source_word: רוּחַ
  choice: पवन
  rationale: तूफानी ईश-दर्शन के प्रसंग में ‘पवन’ सबसे उपयुक्त अर्थ है। यह ‘पंखों’ के साथ काव्यात्मक और गरिमापूर्ण भी है।
theological_decisions:
- issue: करूब के चित्र का स्वरूप
  choice: परमेश्वर के करूब पर सवार होने का ठोस काव्यात्मक चित्र बनाए रखा गया।
  alternative: करूब को तूफानी बादल या स्वर्गदूतों के समूह का रूपक मानकर व्याख्यात्मक अनुवाद करना।
  rationale: इब्रानी पाठ स्वयं इस चित्र की ऐसी व्याख्या नहीं करता। सीधे चित्र को बनाए रखना काव्य और उसकी धर्मवैचारिक गहनता का सम्मान करता है।
- issue: अंतिम पदबंध में רוּחַ का अर्थ
  choice: मुख्य पाठ में ‘पवन’।
  alternative: ‘आत्मा’ या ‘श्वास’।
  rationale: आस-पास के तूफानी और मौसम-संबंधी चित्रों में ‘पवन’ सबसे स्वाभाविक है, जबकि पादटिप्पणी शब्द की व्यापक अर्थ-सीमा बताती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘पवन के पंख’ मूल की काव्यात्मक छवि को बनाए रखते हैं; ‘करूब’ स्थापित बाइबलीय पारिभाषिक शब्द है।
