lexical_decisions:
- source_word: יָשֶׁת
  choice: बनाया
  rationale: काव्यात्मक वर्णन में अंधकार को छिपने का स्थान ठहराने का भाव स्वाभाविक हिन्दी में व्यक्त करता है; ‘रखा’ भी संभव है।
- source_word: חֹשֶׁךְ
  choice: अंधकार
  rationale: तूफ़ानी ईश-प्रकटन के ठोस दृश्य और रहस्यमय आवरण, दोनों को बनाए रखता है।
- source_word: סִתְרוֹ
  choice: अपना छिपने का स्थान
  rationale: सתר से बने इस पद का स्थानवाचक अर्थ स्पष्ट करता है, केवल अमूर्त गोपनीयता नहीं।
- source_word: סְבִיבוֹתָיו
  choice: उसके चारों ओर
  rationale: मूल के स्थान-संबंधी बिंब का सीधा और स्वाभाविक रूप।
- source_word: סֻכָּתוֹ
  choice: उसका आश्रय
  rationale: अस्थायी छाजन या मंडप के कार्यात्मक अर्थ को सहज हिन्दी में देता है, बिना इसे अनिवार्य रूप से उपासना-तंबू मानने के।
- source_word: חֶשְׁכַת מַיִם
  choice: जलराशि का अंधकार
  rationale: इब्रानी संबंध-रचना को काफी निकटता से रखता है और ‘अंधकारमय जल’ की अपेक्षा मूल की काव्यात्मक बनावट को अधिक स्पष्ट बचाता है।
- source_word: עָבֵי שְׁחָקִים
  choice: आकाश के घने बादल
  rationale: עָבֵי की सघनता और שְׁחָקִים के काव्यात्मक आकाश-संदर्भ को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: अंधकार और आश्रय का बिंब तूफ़ानी ईश-प्रकटन में परमेश्वर के छिपे होने को दर्शाता है, पर उसका नैतिक या उपासना-संबंधी अर्थ स्पष्ट नहीं करता।
  choice: बिंब को परमेश्वर के चारों ओर के काव्यात्मक आवरण के रूप में सीधा प्रस्तुत किया गया।
  alternative: अंधकार को न्याय का प्रतीक या आश्रय को विशेष रूप से पवित्र तंबू का संकेत मानना।
  rationale: मूल पाठ तूफ़ान के समानांतर बिंब देता है; अनुवाद उस तनाव को बनाए रखता है और कोई अतिरिक्त सांप्रदायिक व्याख्या नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमामय काव्यात्मक गद्य; वाक्य-विन्यास सरल रखा गया है, जबकि इब्रानी के तूफ़ानी और रहस्यमय बिंब सुरक्षित हैं।
