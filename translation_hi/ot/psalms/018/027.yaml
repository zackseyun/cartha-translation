id: PSA.18.27
reference: Psalms 18:27
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּֽי אַ֭תָּה עַם עָנִ֣י תוֹשִׁ֑יעַ וְ/עֵינַ֖יִם רָמ֣וֹת תַּשְׁפִּֽיל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/027.yaml
  text: For you save an afflicted people[b][a], but haughty eyes you bring low.
translation:
  language: hi
  text: क्योंकि तू पीड़ित लोगों को बचाता है,[a] परन्तु ऊँची आँखों को नीचा करता है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘गरीब लोगों’ अथवा ‘दीन लोगों’। इब्रानी शब्द आर्थिक निर्धनता, पीड़ा या दीनता को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से ‘ऊँची आँखें’; यह घमण्ड या अहंकार के लिए इब्रानी मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन का आधार या स्पष्टीकरण प्रस्तुत करता है; ‘क्योंकि’ इसके कारणसूचक बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: עַם עָנִי
  choice: पीड़ित लोगों
  rationale: עָנִי में पीड़ा, निर्धनता और दीनता—तीनों अर्थ-छायाएँ संभव हैं। प्रसंग में उद्धार की आवश्यकता पर बल होने के कारण ‘पीड़ित’ मुख्य पाठ में उपयुक्त है, जबकि अन्य संभावनाएँ पादटिप्पणी में सुरक्षित हैं। सामूहिक एकवचन עַם को हिन्दी में स्वाभाविक बहुवचन ‘लोगों’ से व्यक्त किया गया है।
- source_word: תוֹשִׁיעַ
  choice: बचाता है
  rationale: हिफ़ील रूप यहाँ संकट से बचाने या उद्धार करने का व्यापक अर्थ देता है। ‘बचाता है’ साधारण पाठक के लिए सहज है और ईश्वरीय छुटकारे का भाव बनाए रखता है।
- source_word: וְעֵינַיִם רָמוֹת
  choice: परन्तु ऊँची आँखों
  rationale: וְ औपचारिक रूप से ‘और’ है, किन्तु समानांतर पंक्तियों का विरोध ‘परन्तु’ से स्पष्ट होता है। ‘ऊँची आँखें’ मूल इब्रानी बिंब को सुरक्षित रखता है; इसका घमण्ड-सूचक मुहावरेदार अर्थ पादटिप्पणी में दिया गया है।
- source_word: תַּשְׁפִּיל
  choice: नीचा करता है
  rationale: यह क्रिया किसी को नीचे करने या दीन करने का अर्थ देती है। ‘नीचा करता है’ ऊँची आँखों के विपरीत ठोस काव्य-बिंब को बनाए रखता है।
theological_decisions:
- issue: עָנִי का आशय
  choice: पीड़ित लोगों
  alternative: गरीब लोग; दीन या नम्र लोग
  rationale: यह चयन भजन में संकट से ईश्वरीय बचाव के विषय को सामने रखता है, पर शब्द को केवल आर्थिक निर्धनता या केवल आन्तरिक नम्रता तक सीमित नहीं करता; वैकल्पिक अर्थ पादटिप्पणी में दिए गए हैं।
- issue: ‘ऊँची आँखों’ का संदर्भ
  choice: मूल मुहावरे को बनाए रखते हुए घमण्ड का संकेत
  alternative: घमण्डी लोगों को
  rationale: मूल पाठ शरीर-अंग के बिंब द्वारा अहंकार व्यक्त करता है। उसे सीधे ‘घमण्डी लोग’ कर देने के बजाय काव्यात्मक तनाव और चित्रात्मकता सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और काव्यात्मक रूप अपनाया गया है। परमेश्वर के लिए एकवचन आत्मीय सम्बोधन ‘तू’ भजन-साहित्य की सीधी प्रार्थनात्मक शैली के अनुरूप है। ‘ऊँची आँखों’ और ‘नीचा करता है’ के बीच मूल विरोधी बिंब सुरक्षित रखा गया है।
