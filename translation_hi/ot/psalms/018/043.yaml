  edition: WLC
  text: תְּפַלְּטֵ/נִי֮ מֵ/רִ֪יבֵ֫י עָ֥ם תְּ֭שִׂימֵ/נִי לְ/רֹ֣אשׁ גּוֹיִ֑ם עַ֖ם לֹא יָדַ֣עְתִּי יַֽעַבְדֽוּ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/043.yaml
  text: You rescue me from the strivings of the people[a]; you set me as the head of nations[d][c][b]; a people whom I have not known serve me.
translation:
  language: hi
  text: तू मुझे लोगों के झगड़ों से बचाता है[a]; तू मुझे राष्ट्रों का प्रधान बनाता है[b]; ऐसे लोग जिन्हें मैं नहीं जानता था, मेरी सेवा करते हैं[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘लोगों के विवादों से’ अथवा ‘लोगों की कलह से।’ इब्रानी शब्द झगड़े, विवाद या कलह को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से ‘राष्ट्रों का सिर।’ यहाँ ‘सिर’ नेतृत्व का रूपक है।
    reason: lexical_alternative
  - marker: c
    text: या ‘ऐसे लोग जिन्हें मैं नहीं जानता था, मेरी सेवा करेंगे।’ इब्रानी अपूर्ण क्रिया का अर्थ प्रसंग में भविष्यकाल भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּפַלְּטֵנִי
  choice: तू मुझे ... बचाता है
  rationale: पिएल रूप यहाँ सक्रिय छुटकारे या बचाव को व्यक्त करता है। ‘बचाता है’ सहज आधुनिक हिन्दी है और परमेश्वर के व्यक्तिगत बचाव-कार्य को बनाए रखता है।
- source_word: מֵרִיבֵי עָם
  choice: प्रजा के झगड़ों से
  rationale: רִיב विवाद, झगड़ा या कलह को सूचित कर सकता है। बहुवचन रूप के लिए ‘झगड़ों’ स्वाभाविक है; עָם एकवचन सामूहिक संज्ञा है, और इस राजकीय संदर्भ में ‘प्रजा’ उपयुक्त है।
- source_word: תְּשִׂימֵנִי
  choice: तू मुझे ... बनाता है
  rationale: שׂים का मूल अर्थ रखना या स्थापित करना है। हिन्दी में पद अथवा नेतृत्व की स्थिति के साथ ‘बनाता है’ स्वाभाविक रूप से वही भाव देता है।
- source_word: לְרֹאשׁ גּוֹיִם
  choice: राष्ट्रों का प्रधान
  rationale: רֹאשׁ का शाब्दिक अर्थ ‘सिर’ है, पर यहाँ यह नेतृत्व का रूपक है। ‘प्रधान’ अर्थ स्पष्ट करता है और अनावश्यक रूप से अस्वाभाविक ‘सिर’ से बचता है; גּוֹיִם को राजनीतिक-सामूहिक अर्थ में ‘राष्ट्रों’ कहा गया है।
- source_word: עַם לֹא יָדַעְתִּי
  choice: जिस जाति को मैं नहीं जानता था
  rationale: עַם यहाँ अनिश्चित सामूहिक समूह को दर्शाता है। ‘जिस जाति को’ सम्बन्धवाचक संरचना को स्पष्ट करता है; पूर्ण क्रिया יָדַעְתִּי के लिए ‘नहीं जानता था’ पूर्व अपरिचय को सहज हिन्दी में व्यक्त करता है।
- source_word: יַעַבְדוּנִי
  choice: वह मेरी सेवा करती है
  rationale: עבד का सीधा अर्थ ‘सेवा करना’ है। अपूर्ण क्रिया जारी या आगामी अधीन सेवा दोनों का संकेत दे सकती है; मुख्य पाठ में वर्तमानकाल काव्यात्मक कथन के अनुकूल है।
theological_decisions:
- issue: राजकीय भजन में גּוֹיִם और עַם का दायरा
  choice: ‘राष्ट्रों’ और ‘जाति’ जैसे राजनीतिक-सामूहिक शब्दों में अनुवाद
  alternative: גּוֹיִם के लिए ऐसा पद जो बाद की यहूदी/गैर-यहूदी धार्मिक श्रेणी को प्रमुख बनाए
  rationale: यह पद राजा के विदेशी समूहों पर स्थापित किए जाने की बात करता है। राजनीतिक-सामूहिक भाषा मूल प्रसंग को बनाए रखती है और बाद की धर्मवैज्ञानिक श्रेणियाँ पाठ में नहीं जोड़ती।
- issue: יַעַבְדוּנִי का कालगत बल
  choice: 'वर्तमान/विशेषतामूलक अर्थ: ‘वह मेरी सेवा करती है’'
  alternative: 'भविष्यकाल: ‘वह मेरी सेवा करेगी’'
  rationale: हिब्रू अपूर्ण क्रिया आगामी अथवा विशेषतामूलक क्रिया दोनों व्यक्त कर सकती है। संदर्भ इसे निर्णायक रूप से सीमित नहीं करता, इसलिए भविष्यकाल को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सम्मानपूर्ण, काव्यात्मक और सामान्य पाठक के लिए सहज शैली। परमेश्वर को संबोधित करते हुए भजन की निकटता बनाए रखने के लिए ‘तू’ प्रयुक्त है। समानार्थी ‘प्रजा’ और ‘जाति’ क्रमशः आंतरिक जनसमुदाय और अपरिचित बाहरी समूह के भेद को स्वाभाविक हिन्दी में उभारते हैं।
