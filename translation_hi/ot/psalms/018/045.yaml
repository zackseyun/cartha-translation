  yaml_path: translation/ot/psalms/018/045.yaml
  text: The sons of foreigners fade away and come trembling out of their strongholds[a][b][c].
translation:
  language: hi
  text: परदेशियों के पुत्र[a] मुरझा जाते हैं और अपने गढ़ों से काँपते हुए बाहर आते हैं[b][c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ ‘परदेशियों के पुत्र’ है; आशय केवल ‘परदेशी’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘काँपते हुए बाहर आते हैं’ के लिए प्रयुक्त इब्रानी क्रिया दुर्लभ और अनिश्चित है; इसका अर्थ ‘दबकते हुए बाहर आते हैं’ या ‘लँगड़ाते हुए बाहर आते हैं’ भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: ‘गढ़ों’ का अनुवाद ‘किलों’ या, अधिक सामान्य रूप से, ‘घिरी हुई जगहों’ के रूप में भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי נֵכָר
  choice: परदेशियों के बेटे
  rationale: इब्रानी पदबंध का शाब्दिक अर्थ ‘परदेशी/पराएपन के बेटे’ है। ‘परदेशियों के बेटे’ काव्यात्मक पुत्र-संबंधी मुहावरे को बनाए रखते हुए आधुनिक हिन्दी में स्पष्ट है; आशय सामान्य रूप से ‘परदेशी लोग’ भी हो सकता है।
- source_word: יִבֹּלוּ
  choice: मुरझा जाते हैं
  rationale: נבל का सामान्य अर्थ मुरझाना, क्षीण होना या तेज खो देना है। यह पराजित शत्रुओं की शक्ति घटने का काव्यात्मक चित्र बनाए रखता है और इस क्रिया में अनावश्यक रूप से भय का भाव नहीं जोड़ता।
- source_word: וְיַחְרְגוּ
  choice: काँपते हुए बाहर आते हैं
  rationale: חרג दुर्लभ और अर्थ की दृष्टि से अनिश्चित क्रिया है। प्रसंग में भय या व्याकुलता के साथ बाहर निकलना संभव अर्थ है; अतः मुख्य पाठ में स्वाभाविक हिन्दी दी गई है और अन्य संभावनाएँ पादटिप्पणी में रखी गई हैं।
- source_word: מִמִּסְגְּרוֹתֵיהֶם
  choice: अपने गढ़ों से
  rationale: מִסְגְּרוֹת घिरी या बंद जगहों को सूचित कर सकता है। युद्ध-संबंधी प्रसंग में ‘गढ़’ सुरक्षित किलेबंद स्थानों का स्वाभाविक और संक्षिप्त हिन्दी रूप है, जबकि व्यापक अर्थ पादटिप्पणी में सुरक्षित है।
