language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יַּרְעֵ֬ם בַּ/שָּׁמַ֨יִם יְֽהוָ֗ה וְ֭/עֶלְיוֹן יִתֵּ֣ן קֹל֑/וֹ בָּ֝רָ֗ד וְ/גַֽחֲלֵי אֵֽשׁ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/013.yaml
  text: Yahweh thundered in the heavens[b][a], and the Most High gave his voice—hailstones and coals of fire.
translation:
  language: hi
  text: 'याहवे आकाश में गरजा,

    और परमप्रधान ने अपना स्वर सुनाया[a]—

    ओले और आग के अंगारे[b]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: “अपना स्वर दिया।”'
    reason: lexical_alternative
  - marker: b
    text: या “ओला और आग के अंगारे।” इब्रानी का एकवचन “ओला” सामूहिक अर्थ में भी समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְעֵם
  choice: गरजा
  rationale: रעם का अर्थ इस तूफ़ानी ईश-प्रकटन के प्रसंग में बादल की गर्जना करना है। ‘गरजा’ स्वाभाविक हिंदी है और अगली पंक्ति में परमप्रधान के स्वर के समानांतर है।
- source_word: בַּשָּׁמַיִם
  choice: आकाश में
  rationale: שׁמים रूप की दृष्टि से बहुवचन है, पर आधुनिक हिंदी में ‘आकाश में’ इस काव्यात्मक दृश्य को स्वाभाविक और गरिमापूर्ण ढंग से व्यक्त करता है; ‘आकाशों में’ यहाँ असहज होता।
- source_word: יְהוָה
  choice: याहवे
  rationale: चतुरक्षरीय व्यक्तिगत नाम יהוה को किसी उपाधि से बदलने के बजाय हिंदी में ‘याहवे’ लिप्यंतरित किया गया है।
- source_word: וְעֶלְיוֹן
  choice: और परमप्रधान
  rationale: עֶלְיוֹן यहाँ परमेश्वर की उपाधि है; ‘परमप्रधान’ आधुनिक हिंदी में स्थापित, संक्षिप्त और अर्थानुकूल रूप है।
- source_word: יִתֵּן קֹלוֹ
  choice: ने अपना स्वर सुनाया
  rationale: इब्रानी मुहावरे का शाब्दिक अर्थ ‘अपना स्वर दिया’ है। ‘अपना स्वर सुनाया’ उस बिंब को बनाए रखते हुए हिंदी में अर्थ स्पष्ट करता है; शाब्दिक रूप को पादटिप्पणी में रखा गया है।
- source_word: בָּרָד
  choice: ओले
  rationale: एकवचन रूप यहाँ सामूहिक अर्थ रख सकता है। बहुवचन ‘ओले’ ठोस तूफ़ानी दृश्य को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: וְגַחֲלֵי אֵשׁ
  choice: और आग के अंगारे
  rationale: यह निकट-शाब्दिक अनुवाद प्रखर काव्यात्मक चित्र को सुरक्षित रखता है और इसे केवल बिजली या किसी अन्य विशेष घटना के रूप में सीमित नहीं करता।
theological_decisions:
- issue: יהוה परमेश्वर के नाम का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ व्यक्तिगत दिव्य नाम יהוה का प्रयोग करता है। ‘याहवे’ नाम को उपाधि से प्रतिस्थापित किए बिना उसके संभावित उच्चारण का लिप्यंतरण करता है।
- issue: ‘ओले और आग के अंगारे’ का पिछली पंक्ति से संबंध
  choice: क्रिया जोड़े बिना दीर्घ विराम के बाद आकस्मिक काव्यात्मक क्रम
  alternative: ‘उसने ओले और आग के अंगारे भेजे’ जैसी निहित क्रिया जोड़ना
  rationale: इब्रानी में इन तूफ़ानी तत्वों के साथ कोई स्पष्ट सीमित क्रिया नहीं है। दीर्घ विराम मूल की संक्षिप्तता और संभावित संबंधगत अस्पष्टता को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, काव्यात्मक और गरिमापूर्ण रखी गई है। पद को तीन पंक्तियों में रखा गया है ताकि समानांतरता और अंतिम आकस्मिक तूफ़ानी चित्र उभरें। ‘स्वर’ अपेक्षाकृत साहित्यिक है, पर ‘आवाज़’ की तुलना में भजन की शैली के अधिक अनुकूल है।
