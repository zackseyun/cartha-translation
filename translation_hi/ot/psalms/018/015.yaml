source:
  edition: WLC
  text: וַ/יֵּ֤רָא֨וּ אֲפִ֥יקֵי מַ֗יִם וַֽ/יִּגָּלוּ֮ מוֹסְד֪וֹת תֵּ֫בֵ֥ל מִ/גַּעֲרָ֣תְ/ךָ֣ יְהוָ֑ה מִ֝/נִּשְׁמַ֗ת ר֣וּחַ אַפֶּֽ/ךָ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/015.yaml
  text: Then the channels of the waters were seen[a], and the foundations of the world were laid bare, at your rebuke, O Yahweh[c][b], at the blast of the breath of your nostrils.
translation:
  language: hi
  text: तब जलधाराओं के तल दिखाई दिए[a], और जगत की नींवें खुल गईं[b]—हे याहवे, तेरी डाँट से, तेरे नथनों की साँस के झोंके से[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जल के मार्ग” अथवा “नदी-नालों के तल।”
    reason: lexical_alternative
  - marker: b
    text: या, “पृथ्वी की नींवें।”
    reason: lexical_alternative
  - marker: c
    text: इब्रानी में शाब्दिक रूप से, “तेरे नथनों की साँस की वायु/आत्मा से”; यह याहवे की साँस की शक्ति का सजीव मानव-सदृश चित्र है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרָאוּ
  choice: दिखाई दिए
  rationale: निफ़अल रूप की निष्क्रिय अभिव्यक्ति को बनाए रखते हुए आकस्मिक दृश्यता का काव्यात्मक बोध देता है।
- source_word: אֲפִיקֵי מַיִם
  choice: जलधाराओं के तल
  rationale: אֲפִיקֵי जल के मार्ग, नाले अथवा उनके तल को सूचित कर सकता है। संदर्भ में जल हटने पर नीचे का तल दिखाई देने की छवि है; यह हिन्दी में स्वाभाविक भी है और मूल की अर्थ-सीमा के निकट भी।
- source_word: וַיִּגָּלוּ
  choice: खुल गईं
  rationale: निफ़अल रूप यहाँ ढकी हुई वस्तु के अनावृत हो जाने को व्यक्त करता है। 'खुल गईं' सहज हिन्दी में उस प्रबल उद्घाटन को रखता है।
- source_word: מוֹסְדוֹת תֵּבֵל
  choice: जगत की नींवें
  rationale: מוֹסְדוֹת का अर्थ नींवें या आधार और תֵּבֵל का अर्थ व्यवस्थित अथवा बसा हुआ संसार है; 'जगत' काव्यात्मक और सुबोध समतुल्य है।
- source_word: מִגַּעֲרָתְךָ
  choice: तेरी डाँट से
  rationale: מִן यहाँ कारण अथवा स्रोत बता सकता है। 'से' दोनों संभावनाओं को पर्याप्त रूप से खुला रखता है।
- source_word: יְהוָה
  choice: यहवे
  rationale: चार-अक्षरीय व्यक्तिगत दिव्य नाम को किसी उपाधि से बदलने के बजाय हिन्दी में उसके प्रचलित निकट लिप्यंतरण से प्रस्तुत किया गया है।
- source_word: מִנִּשְׁמַת רוּחַ אַפֶּךָ
  choice: तेरे नथनों की साँस के झोंके से
  rationale: नִשְׁמָה, רוּחַ और אַף की संयुक्त सजीव देहात्मक छवि को बनाए रखता है; इसे केवल 'क्रोध' कहकर रूपक को समतल नहीं किया गया।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत दिव्य नाम सीधे आया है। 'यहवे' उसे उपाधि में बदले बिना व्यक्त करता है, जबकि 'प्रभु' नाम को शीर्षक से प्रतिस्थापित करता और 'यहोवा' एक वैकल्पिक पारंपरिक स्वरूप है।
- issue: מִנִּשְׁמַת רוּחַ אַפֶּךָ की देहात्मक ईश-छवि
  choice: तेरे नथनों की साँस के झोंके से
  alternative: तेरे क्रोध की प्रचंडता से
  rationale: मूल की सजीव मानव-सदृश काव्य-छवि को सुरक्षित रखा गया है; उसका अमूर्त धार्मिक अर्थ देकर उसे चुपचाप नहीं बदला गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण काव्यात्मक शैली अपनाई गई है। ईश्वर को संबोधन में एकवचन निकटवर्ती 'तेरी/तेरे' रखा गया है, जो इब्रानी के एकवचन संबोधन और हिन्दी बाइबिलीय काव्य-परंपरा के अनुरूप है।
