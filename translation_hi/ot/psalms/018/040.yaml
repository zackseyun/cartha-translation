    reason: lexical_alternative
lexical_decisions:
- source_word: אֹיְבַי
  choice: मेरे शत्रुओं
  rationale: אֹיֵב के प्रथम पुरुष एकवचन संबंधसूचक रूप का स्वाभाविक और मानक हिन्दी अनुवाद।
- source_word: נָתַתָּה לִּי עֹרֶף
  choice: तूने ... मेरे सामने पीठ फेरकर भागने पर मजबूर कर दिया
  rationale: शाब्दिक रूप से ‘तूने मुझे गरदन दी’; यह पराजित शत्रुओं के पीठ फेरकर भागने का इब्रानी बिंब है। मुख्य पाठ में उसका आशय सहज हिन्दी में व्यक्त किया गया है, जबकि मूल बिंब पादटिप्पणी में रखा गया है।
- source_word: וּמְשַׂנְאַי
  choice: मुझसे घृणा करनेवालों
  rationale: שׂנא के कृदन्त और प्रथम पुरुष संबंधसूचक प्रत्यय को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: אַצְמִיתֵם
  choice: मैंने मिटा दिया
  rationale: צמת के हिफ़ील रूप में नाश कर देने का प्रबल भाव है; ‘मिटा दिया’ संक्षिप्त, स्पष्ट और काव्यात्मक हिन्दी है।
theological_decisions:
- issue: עֹרֶף में शत्रुओं की पराजय का देह-अंग आधारित बिंब
  choice: मुख्य पाठ में शत्रुओं के पीठ फेरकर भागने का आशय स्पष्ट किया गया।
  alternative: ‘तूने मुझे मेरे शत्रुओं की गरदन दे दी’ या ‘तूने मेरे शत्रुओं की पीठ मुझे दे दी।’
  rationale: शाब्दिक रूप हिन्दी में अस्पष्ट या भ्रामक हो सकता है। चुना गया रूप युद्ध में पराजित होकर भागने का मूल आशय संप्रेषित करता है और परमेश्वर द्वारा दी गई विजय तथा वक्ता द्वारा किए गए विनाश के बीच का तनाव बनाए रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी; परमेश्वर को संबोधन में काव्यात्मक एकवचन ‘तू’ रखा गया है। हिंसक क्रिया की तीव्रता को नरम किए बिना ‘मिटा दिया’ चुना गया है।
