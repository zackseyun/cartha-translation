  text: עִם חָסִ֥יד תִּתְחַסָּ֑ד עִם גְּבַ֥ר תָּ֝מִ֗ים תִּתַּמָּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/025.yaml
  text: With the faithful you show yourself faithful[a]; with the blameless man you show yourself blameless.
translation:
  language: hi
  text: निष्ठावान जन के साथ तू अपने को निष्ठावान दिखाता है[a]; निर्दोष पुरुष के साथ तू अपने को निर्दोष दिखाता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वफादार/भक्त जन के साथ तू अपने को वफादार दिखाता है”; इब्रानी में यहाँ एक ही मूल (חסד) से बने सजातीय शब्द हैं, जो परस्पर वाचा-निष्ठा पर बल देते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: חָסִיד
  choice: निष्ठावान जन
  rationale: यह शब्द वाचा-संबंधी निष्ठा और भक्ति से पहचाने जाने वाले व्यक्ति को दर्शाता है। ‘निष्ठावान जन’ आधुनिक हिन्दी में संबंधपरक और नैतिक भाव को स्वाभाविक रूप से व्यक्त करता है तथा अगले सजातीय क्रियापद के साथ शब्द-साम्य बनाए रखता है।
- source_word: תִּתְחַסָּד
  choice: तू अपने को निष्ठावान दिखाता है
  rationale: हित्पएल रूप के आत्मवाची/प्रकटकारी भाव को ‘अपने को ... दिखाता है’ व्यक्त करता है। इससे חָסִיד के साथ मूल का सजातीय शब्द-प्रयोग और पारस्परिकता दोनों सुरक्षित रहते हैं।
- source_word: גְּבַר
  choice: पुरुष
  rationale: यह पुल्लिंग एकवचन संज्ञा है, जिसका सामान्य अर्थ ‘पुरुष’ है; यहाँ बलवान या योद्धा होने का भाव इतना प्रमुख नहीं कि उसे अनुवाद में स्पष्ट किया जाए।
- source_word: תָּמִים
  choice: निर्दोष
  rationale: नैतिक संदर्भ में यह संपूर्णता, खराई और दोषरहित आचरण का भाव देता है। ‘निर्दोष’ समानांतर क्रियापद के साथ सहज और स्पष्ट है।
- source_word: תִּתַּמָּם
  choice: तू अपने को निर्दोष दिखाता है
  rationale: תמם धातु से बना यह क्रियापद पहले आए תָּמִים को प्रतिध्वनित करता है। यह अनुवाद आत्मवाची भाव और मूल का शब्द-साम्य बनाए रखता है तथा ‘सिद्ध’ से उत्पन्न हो सकने वाले तत्त्वमीमांसात्मक अतिशय अर्थ से बचता है।
theological_decisions:
- issue: मनुष्य के चरित्र के प्रत्युत्तर में परमेश्वर के चरित्र का अनुरूप प्रकट होना
  choice: ‘तू अपने को ... दिखाता है’ के द्वारा परमेश्वर की निष्ठा और निर्दोषता के अनुरूप प्रकट होने का भाव रखा गया है।
  alternative: ‘निष्ठावान पर तू दया करता है’ या ‘निर्दोष के प्रति तू निर्दोष रहता है।’
  rationale: मूल के आत्मवाची क्रियारूप काव्यात्मक पारस्परिकता व्यक्त करते हैं। यह अनुवाद इस तनाव को बनाए रखता है, पर ऐसा नहीं कहता कि मनुष्यों के कारण परमेश्वर का स्वभाव बदल जाता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और काव्यात्मक हिन्दी; परमेश्वर के लिए भजन की सीधी संबोधन-शैली में ‘तू’ रखा गया है। समानांतर पंक्तियों और मूल के सजातीय शब्द-प्रयोग को यथासंभव स्पष्ट रखा गया है।
