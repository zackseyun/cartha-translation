language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּֽי שָׁ֭מַרְתִּי דַּרְכֵ֣י יְהוָ֑ה וְ/לֹֽא רָ֝שַׁ֗עְתִּי מֵ/אֱלֹהָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/021.yaml
  text: For I have kept the ways of Yahweh[b][a], and have not wickedly departed from my God.
translation:
  language: hi
  text: क्योंकि मैंने यहोवा के मार्गों का पालन किया है, और मैं दुष्टतापूर्वक अपने परमेश्वर से दूर नहीं हुआ हूँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन का आधार या कारण प्रस्तुत करता है और भजन के तर्क-प्रवाह को स्वाभाविक हिंदी में बनाए रखता है।
- source_word: שָׁמַרְתִּי
  choice: मैंने ... पालन किया है
  rationale: שׁמר का अर्थ ‘रखना, मानना, पालन करना’ है। नैतिक और वाचागत संदर्भ में ‘मार्गों का पालन करना’ आधुनिक हिंदी में स्वाभाविक है और पूर्ण क्रिया की वर्तमान प्रासंगिकता भी व्यक्त करता है।
- source_word: דַּרְכֵי
  choice: मार्गों
  rationale: דֶּרֶךְ यहाँ वास्तविक सड़कों के बजाय यहोवा द्वारा ठहराए गए आचरण और जीवन-पद्धति को सूचित करता है; ‘मार्ग’ इस रूपक को बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिंदी बाइबल परंपरा में प्रचलित रूप ‘यहोवा’ व्यक्तिगत ईश्वरीय नाम को शीर्षक से प्रतिस्थापित किए बिना प्रस्तुत करता है।
- source_word: וְלֹא רָשַׁעְתִּי מֵאֱלֹהָי
  choice: और अपने परमेश्वर से दूर होकर दुष्टता नहीं की है
  rationale: רשׁע का मूल अर्थ ‘दुष्टता करना/दुष्ट आचरण करना’ है, जबकि מִן अलगाव या दूर होने का संबंध बताता है। यह अनुवाद दोनों तत्वों को स्पष्ट और स्वाभाविक हिंदी में रखता है, बिना केवल ‘दूर नहीं हुआ’ कहकर दुष्टता के अर्थ को खोए।
- source_word: אֱלֹהָי
  choice: अपने परमेश्वर
  rationale: प्रथम पुरुष एकवचन प्रत्यय का अर्थ ‘मेरे परमेश्वर’ है; हिंदी में कर्ता-सापेक्ष संबंध के कारण ‘अपने परमेश्वर’ अधिक स्वाभाविक है।
theological_decisions:
- issue: दाऊद के धार्मिक आचरण के दावे को पूर्ण निष्पापता के दावे में बदलने से बचाना
  choice: यहोवा के मार्गों के पालन और परमेश्वर से दूर होकर दुष्टता न करने का दृढ़, संबंधपरक दावा
  alternative: इसे पूर्ण निष्पापता या निरपेक्ष निर्दोषता का दावा बनाना
  rationale: इब्रानी पाठ न तो दावे की शक्ति घटाता है, न इसे सार्वभौमिक निष्पापता के कथन के रूप में स्पष्ट करता है। अनुवाद उसकी वाचागत निष्ठा और परमेश्वर से संबंध की भाषा को यथावत रखता है।
- issue: רָשַׁעְתִּי מֵאֱלֹהָי की संरचनात्मक अस्पष्टता
  choice: ‘अपने परमेश्वर से दूर होकर दुष्टता नहीं की है’
  alternative: ‘दुष्टता से अपने परमेश्वर को नहीं छोड़ा है’ या ‘अपने परमेश्वर के विरुद्ध दुष्टता नहीं की है’
  rationale: מִן का सामान्य अलगाव-बोध बनाए रखते हुए यह पाठ רשׁע के ‘दुष्टता करना’ अर्थ को भी स्पष्ट रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी, काव्यात्मक परंतु सहज और गरिमापूर्ण है। ‘पालन किया है’ नैतिक मार्ग पर चलने का आशय स्वाभाविक रूप से देता है; ‘दूर होकर दुष्टता’ इब्रानी क्रिया और पूर्वसर्ग के संयुक्त तनाव को सुरक्षित रखता है।
