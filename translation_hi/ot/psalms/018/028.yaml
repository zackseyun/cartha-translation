base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/028.yaml
  text: For you light my lamp[b][a]; Yahweh my God lights up my darkness.
translation:
  language: hi
  text: क्योंकि आप ही मेरा दीपक जलाते हैं[a]; यहोवा, मेरे परमेश्वर, मेरे अँधेरे को रोशन करते हैं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “आप मेरे दीपक को प्रकाशमान करते हैं।”
    reason: lexical_alternative
  - marker: b
    text: “मेरे अँधेरे” से संकट, खतरा या उदासी का भाव भी प्रकट हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह आसपास व्यक्त स्तुति और भरोसे का आधार बताता है; हिन्दी में ‘क्योंकि’ इस संबंध को सहज रूप से व्यक्त करता है।
- source_word: אַתָּה
  choice: आप ही
  rationale: स्वतंत्र सर्वनाम पर बल को ‘ही’ से व्यक्त किया गया है; परमेश्वर को संबोधित करने के लिए आधुनिक आदरसूचक ‘आप’ स्वाभाविक और गरिमापूर्ण है।
- source_word: תָּאִיר
  choice: जलाते हैं
  rationale: हिफ़ील रूप के प्रकाश देने या चमकाने के कारक भाव को दीपक के साथ स्वाभाविक हिन्दी मुहावरे ‘दीपक जलाना’ से व्यक्त किया गया है।
- source_word: נֵרִי
  choice: मेरा दीपक
  rationale: ठोस काव्यात्मक बिंब को बनाए रखने के लिए נֵר का अनुवाद अमूर्त ‘प्रकाश’ के बजाय ‘दीपक’ किया गया है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ में आए परमेश्वर के व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय प्रचलित हिन्दी लिप्यंतरण में रखा गया है।
- source_word: אֱלֹהַי
  choice: मेरे परमेश्वर
  rationale: प्रथम पुरुष संबंधसूचक रूप और व्यक्तिगत संबोधन दोनों सुरक्षित रहते हैं।
- source_word: יַגִּיהַּ
  choice: रोशन कर देते हैं
  rationale: कारक क्रिया के ‘उजला करना/प्रकाशित करना’ अर्थ को सहज आधुनिक हिन्दी में व्यक्त करता है और पहली पंक्ति की प्रकाश-छवि को आगे बढ़ाता है।
- source_word: חָשְׁכִּי
  choice: मेरे अँधेरे
  rationale: प्रथम पुरुष संबंधसूचक रूप सहित मूल रूपक को बनाए रखा गया है; इसे केवल बाहरी संकट या केवल भीतरी उदासी के अर्थ में सीमित नहीं किया गया।
theological_decisions:
- issue: יְהוָה परमेश्वर के नाम का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल में व्यक्तिगत नाम सीधे प्रयुक्त है; ‘यहोवा’ उसे उपाधि में बदले बिना सुरक्षित रखता है।
- issue: ‘मेरे अँधेरे’ का आशय
  choice: रूपक को खुला रखा गया
  alternative: मेरे संकट / मेरी उदासी
  rationale: यह पद अँधेरे को संकट, खतरे या मन की उदासी से जोड़ सकता है, पर मूल पाठ इनमें से किसी एक अर्थ को स्पष्ट रूप से निर्धारित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और काव्यात्मक शैली रखी गई है। परमेश्वर के लिए आदरसूचक ‘आप’ का प्रयोग किया गया है; ‘दीपक’ और ‘अँधेरा’ के मूल बिंब सुरक्षित हैं।
