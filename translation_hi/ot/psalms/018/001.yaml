lexical_decisions:
- source_word: וַיֹּאמַר
  choice: और उसने कहा
  rationale: वाव-क्रमिक के साथ אמר यहाँ कथन का सूत्र आरम्भ करता है। WLC में दिए पाठ को सुरक्षित रखते हुए इसे स्पष्ट रूप से अनूदित किया गया है।
- source_word: אֶרְחָמְךָ
  choice: मैं तुझसे गहरा प्रेम करता हूँ
  rationale: רחם का मूल भाव कोमल करुणा और गहरा स्नेह है। परमेश्वर को सीधे संबोधित करते समय ‘गहरा प्रेम’ इस भाव को स्वाभाविक हिन्दी में व्यक्त करता है और दया दिखाने जैसी भ्रामक ध्वनि से बचाता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ द्वारा रखा गया है।
- source_word: חִזְקִי
  choice: मेरे बल
  rationale: प्रथम पुरुष एकवचन प्रत्यययुक्त इस संज्ञात्मक रूप का संक्षिप्त, स्वाभाविक और काव्यात्मक हिन्दी रूप ‘मेरे बल’ है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ के व्यक्तिगत ईश्वरीय नाम को ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित नहीं किया गया। आधुनिक हिन्दी बाइबलीय प्रयोग में पहचाने जाने योग्य रूप ‘यहोवा’ चुना गया; ‘याहवे’ अधिक विद्वतापरक लिप्यंतरण है।
- issue: परमेश्वर के प्रति רחם का अर्थ
  choice: मैं तुझसे गहरा प्रेम करता हूँ
  alternative: मैं तुझे अत्यन्त दुलारता हूँ / मुझे तुझ पर करुणा आती है
  rationale: क्रिया में कोमल करुणा और गहरे स्नेह का भाव है, पर परमेश्वर के प्रति ‘करुणा करना’ हिन्दी में अनुचित रूप से दया या तरस का संकेत दे सकता है। मुख्य पाठ में स्नेहपूर्ण भक्ति व्यक्त की गई और मूल अर्थच्छाया पाद-टिप्पणी में सुरक्षित रखी गई।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक रखी गई है। परमेश्वर को सम्बोधन में ‘तू’ के आदरसूचक बाइबलीय रूप ‘तुझसे’ का प्रयोग निकटता और भक्ति व्यक्त करता है।
