  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֣ח חִ֭צָּי/ו וַ/יְפִיצֵ֑/ם וּ/בְרָקִ֥ים רָ֝ב וַ/יְהֻמֵּֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/014.yaml
  text: He sent out his arrows and scattered them[a]; he multiplied lightning bolts and threw them into confusion.
translation:
  language: hi
  text: उसने अपने तीर चलाकर उन्हें तितर-बितर कर दिया; बहुत-सी बिजली की चमकों से उसने उन्हें व्याकुल कर दिया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी में ‘बहुत-सी’ का शब्द क्रियात्मक अर्थ में भी समझा जा सकता है: ‘उसने बिजली की चमकों को बहुत कर दिया’ या ‘बढ़ाया।’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: चलाकर
  rationale: שׁלח का मूल अर्थ ‘भेजना’ है; तीरों के साथ हिन्दी में ‘तीर चलाना’ स्वाभाविक है और प्रक्षेपित करने का भाव स्पष्ट करता है।
- source_word: חִצָּיו
  choice: अपने तीर
  rationale: חֵץ के बहुवचन तथा तृतीय पुरुष एकवचन पुल्लिंग प्रत्यय का सीधा अर्थ ‘उसके/अपने तीर’ है; हिन्दी वाक्य में ‘अपने’ कर्ता से संबंध स्वाभाविक रूप से दिखाता है।
- source_word: וַיְפִיצֵם
  choice: उन्हें तितर-बितर कर दिया
  rationale: क्रिया शत्रुओं को बिखेरने या छितराने का युद्ध-संदर्भित भाव देती है; ‘तितर-बितर कर दिया’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: וּבְרָקִים
  choice: बिजलियाँ
  rationale: בְּרָקִים बिजली की चमकों का बहुवचन है; ‘बिजलियाँ’ काव्यात्मक युद्ध-छवि को संक्षेप में बनाए रखता है।
- source_word: רָב
  choice: बहुत-सी
  rationale: रूप संदर्भ में बहुतायत सूचित करता है। इसे विशेषणात्मक/क्रियाविशेषणात्मक रूप से समझना सहज है, जबकि सम्भव क्रियात्मक समझ फुटनोट में सुरक्षित रखी गई है।
- source_word: וַיְהֻמֵּם
  choice: उन्हें घबरा दिया
  rationale: המם युद्ध में भ्रम, आतंक या घबराहट उत्पन्न करने को व्यक्त करता है; यह चयन अनावश्यक रूप से पूर्ण पराजय का अर्थ नहीं जोड़ता।
theological_decisions:
- issue: ‘उन्हें’ के बहुवचन कर्म-प्रत्ययों का संदर्भ
  choice: संदर्भ में निहित शत्रु
  alternative: तीर अथवा बिजलियाँ
  rationale: दैवी योद्धा की छवि में तीर और बिजली साधन हैं, जबकि פוץ और המם से प्रभावित लोग शत्रु हैं। फिर भी हिन्दी में ‘उन्हें’ रखकर मूल की निहित संदर्भता सुरक्षित है।
- issue: רָב की व्याकरणिक भूमिका
  choice: बहुतायत सूचक ‘बहुत-सी’
  alternative: 'क्रियात्मक अर्थ: ‘उसने बिजलियाँ बढ़ा दीं/बहुगुणित कीं’'
  rationale: काव्य-संदर्भ में रָב को ‘बहुत’ या ‘बहुतायत से’ समझना स्वाभाविक है, पर रूप की सम्भव क्रियात्मक व्याख्या वास्तविक है और फुटनोट में दी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘तीर चलाकर,’ ‘तितर-बितर,’ और ‘घबरा दिया’ युद्ध तथा तूफानी ईश-प्रकटन की काव्यात्मक छवि को प्राकृतिक हिन्दी में व्यक्त करते हैं।
