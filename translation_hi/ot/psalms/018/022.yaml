  yaml_path: translation/ot/psalms/018/022.yaml
  text: For all his judgments were before me[a], and I did not put away his statutes from me.
translation:
  language: hi
  text: 'क्योंकि उसके सभी न्याय-विधान मेरे सामने थे,

    और उसकी विधियों को मैंने अपने से दूर नहीं किया।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और मैं उसकी विधियों से नहीं हटा।” इब्रानी क्रिया का अर्थ विधियों को अपने से दूर करना अथवा उनसे स्वयं हट जाना—दोनों समझा जा सकता है; मुख्य पाठ हिफ़ील रूप के अधिक सीधे सकर्मक अर्थ को रखता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण या आधार प्रस्तुत करता है; आधुनिक हिन्दी में ‘क्योंकि’ इस व्याख्यात्मक संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: כָל
  choice: सभी
  rationale: इब्रानी के व्यापक अर्थ को बनाए रखता है।
- source_word: מִשְׁפָּטָיו
  choice: उसके न्याय-विधान
  rationale: מִשְׁפָּט न्यायिक निर्णय और स्थापित नियम, दोनों का भाव रख सकता है; ‘न्याय-विधान’ भजन के वाचा-संबंधी संदर्भ में दोनों आयामों को संक्षेप में सुरक्षित रखता है।
- source_word: לְנֶגְדִּי
  choice: मेरे सामने
  rationale: मूल रूपक ‘सामने’ या ‘दृष्टि के आगे’ रहने का है, अर्थात वक्ता उन्हें निरंतर ध्यान में रखता था।
- source_word: וְחֻקֹּתָיו
  choice: और उसकी विधियों
  rationale: חֻקּוֹת निश्चित किए गए नियमों या विधानों को दर्शाता है; ‘विधियाँ’ आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य है।
- source_word: לֹא אָסִיר
  choice: मैंने ... दूर नहीं किया
  rationale: הפעיל रूप यहाँ सकर्मक अर्थ ‘हटाना/दूर करना’ देता है; वाक्य-विन्यास में ‘उसकी विधियों’ कर्म और ‘अपने से’ अलगाव का पूरक है।
- source_word: מֶנִּי
  choice: अपने से
  rationale: इब्रानी ‘मुझसे’ को हिन्दी में कर्ता के अनुरूप ‘अपने से’ कहना अधिक स्वाभाविक है और सकर्मक अर्थ को स्पष्ट रखता है।
