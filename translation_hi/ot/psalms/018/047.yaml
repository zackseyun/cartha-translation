  text: הָ/אֵ֗ל הַ/נּוֹתֵ֣ן נְקָמ֣וֹת לִ֑/י וַ/יַּדְבֵּ֖ר עַמִּ֣ים תַּחְתָּֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/047.yaml
  text: the God who gives vengeance to me and subdues peoples under me[a][b].
translation:
  language: hi
  text: वही परमेश्वर है, जो मुझे प्रतिशोध दिलाता है[a] और जातियों को मेरे अधीन करता है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मुझे प्रतिशोध के कार्य देता है”; इब्रानी में बहुवचन रूप है, जो यहाँ समष्टिगत या गहन भाव दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: इस संदर्भ में क्रिया का अर्थ परंपरागत रूप से “अधीन करता है” या “वश में करता है” समझा जाता है, “बोलता है” नहीं, यद्यपि इसका रूप ‘बोलना’ अर्थ वाली सामान्य इब्रानी क्रिया से संबंधित है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֵל
  choice: वही परमेश्वर
  rationale: संज्ञा के साथ निश्चित उपपद है। हिन्दी में ‘वही परमेश्वर’ काव्यात्मक वर्णन की निश्चितता और पिछले प्रसंग से उसके संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הַנּוֹתֵן
  choice: जो ... देता है
  rationale: कृदन्त परमेश्वर का वर्णन करने वाला विशेषणात्मक पद है; ‘जो ... देता है’ उसके निरंतर/विशेषतामूलक भाव को सहज हिन्दी में रखता है।
- source_word: נְקָמוֹת
  choice: बदला लेने की सामर्थ्य
  rationale: बहुवचन संज्ञा बदले अथवा प्रतिशोध के कार्यों का गहन/समष्टिगत भाव रखती है। לִי के साथ हिन्दी में यह प्रयोग इस अर्थ को स्वाभाविक बनाता है कि परमेश्वर भजनकार को शत्रुओं से प्रतिशोध लेने में समर्थ करता है। विकल्प ‘प्रतिशोध के कार्य’ पादटिप्पणी में रखा गया है।
- source_word: לִי
  choice: मुझे
  rationale: ל प्राप्तकर्ता अथवा लाभार्थी को सूचित करता है; ‘मुझे’ सबसे सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: וַיַּדְבֵּר
  choice: और ... अधीन कर देता है
  rationale: इस रूप और राजकीय विजय के संदर्भ में अर्थ ‘बोलना’ नहीं, बल्कि ‘वश/अधीन करना’ है। हिन्दी में वर्तमान वर्णनात्मक शैली परमेश्वर के चरित्रगत कार्य को सामने रखती है।
- source_word: עַמִּים
  choice: जाति-जाति के लोगों
  rationale: बहुवचन עַמִּים अलग-अलग जनसमुदायों को सूचित करता है। यह पद आधुनिक पाठक के लिए ‘लोगों’ से अधिक स्पष्ट और ‘राष्ट्रों’ से कम आधुनिक-राजनीतिक है।
- source_word: תַּחְתָּי
  choice: मेरे अधीन
  rationale: मूल के स्थानवाचक रूपक ‘मेरे नीचे’ को स्वाभाविक हिन्दी में राजनीतिक/सैन्य अधीनता के अर्थ सहित व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय प्रतिशोध की भाषा
  choice: बदले के स्पष्ट भाव को बनाए रखते हुए परमेश्वर को भजनकार को बदला लेने की सामर्थ्य देने वाला कहा गया है।
  alternative: ‘छुटकारा’ या ‘न्याय दिलाना’
  rationale: נְקָמוֹת प्रतिशोध अथवा बदले के कार्यों को सीधे सूचित करता है। इसे केवल ‘छुटकारा’ या ‘न्याय दिलाना’ कहना मूल की तीव्रता घटा देता। अनुवाद इससे आगे जाकर इस प्रतिशोध के धर्मवैज्ञानिक आशयों को परिभाषित नहीं करता।
- issue: וַיַּדְבֵּר का अर्थ
  choice: अधीन कर देता है
  alternative: बोलता है
  rationale: यद्यपि यह रूप सामान्य ‘बोलना’ क्रिया से संबंधित दिखाई देता है, इस विशेष रूप और समानांतर राजकीय-विजय संदर्भ में पारंपरिक तथा प्रसंगानुकूल अर्थ ‘वश में करना/अधीन करना’ है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक रखी गई है। ‘जाति-जाति के लोगों’ सामान्य पाठक के लिए बहुवचन जनसमुदायों को स्पष्ट करता है। दोनों पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
