source:
  edition: WLC
  text: מְשַׁוֶּ֣ה רַ֭גְלַ/י כָּ/אַיָּל֑וֹת וְ/עַ֥ל בָּ֝מֹתַ֗/י יַעֲמִידֵֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/033.yaml
  text: He makes my feet like the deer’s[b][a], and sets me on my heights.
translation:
  language: hi
  text: वह मेरे पैरों को हिरनियों के पैरों के समान बनाता है[a], और मुझे मेरे ऊँचे स्थानों पर खड़ा करता है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी में स्त्रीलिंग बहुवचन है: “हिरनियों के समान”; यह उनकी तेज़ और दृढ़ चाल का बिंब प्रस्तुत करता है।'
    reason: lexical_alternative
  - marker: b
    text: या “मुझे मेरी ऊँचाइयों पर खड़ा करता है।”
    reason: alternative_reading
lexical_decisions:
- source_word: מְשַׁוֶּה
  choice: समान बनाता है
  rationale: पिएल रूप यहाँ किसी वस्तु को दूसरी के समान बनाने का भाव देता है; तुलना के साथ यह हिंदी में स्वाभाविक और स्रोत के निकट है।
- source_word: רַגְלַי
  choice: मेरे पैरों को
  rationale: רֶגֶל का सामान्य अर्थ ‘पैर’ है और यहाँ गति तथा दृढ़ पग का बिंब है।
- source_word: כָּאַיָּלוֹת
  choice: हिरनियों के पैरों के समान
  rationale: स्त्रीलिंग बहुवचन मादा हिरनों की ओर संकेत करता है। हिंदी में तुलना को स्पष्ट और स्वाभाविक बनाने के लिए निहित ‘पैरों’ को दोहराया गया है।
- source_word: בָּמוֹתַי
  choice: मेरे ऊँचे स्थानों पर
  rationale: शब्द ऊँचाइयों अथवा ऊँचे स्थानों को दर्शाता है; प्रथम-पुरुष प्रत्यय ‘मेरे’ को सुरक्षित रखा गया है और कोई अनावश्यक उपासना-संबंधी अर्थ नहीं जोड़ा गया।
- source_word: יַעֲמִידֵנִי
  choice: मुझे ... खड़ा करता है
  rationale: עמד का हिफ़ील रूप ‘खड़ा करना’ या ‘खड़ा रहने देना’ व्यक्त करता है। ‘सुरक्षित’ जैसे परिणामसूचक शब्द को मुख्य पाठ में नहीं जोड़ा गया।
theological_decisions:
- issue: फुर्ती और स्थिरता का रूपक
  choice: हिरनियों जैसे पैरों और ऊँचे स्थानों पर खड़े किए जाने के काव्यात्मक बिंब को बनाए रखा गया।
  alternative: इसे स्पष्ट रूप से युद्ध-कौशल, विजय या आत्मिक सुरक्षा के रूप में व्याख्यायित किया जा सकता था।
  rationale: आसपास का प्रसंग युद्ध और छुटकारे से जुड़ा है, पर इस पंक्ति में रूपक स्वयं खुला है; अनुवाद किसी एक व्याख्या को पाठ में आरोपित नहीं करता।
- issue: ‘मेरे ऊँचे स्थान’ का अर्थ
  choice: स्वत्वसूचक रूप को ‘मेरे ऊँचे स्थानों’ के रूप में रखा गया।
  alternative: ‘ऊँचाइयों पर’ या ‘मेरे उच्च स्थानों पर’।
  rationale: मसोरेटिक पाठ के प्रथम-पुरुष प्रत्यय को बनाए रखते हुए संभावित भौगोलिक, विजय-संबंधी या काव्यात्मक अर्थों को खुला रखा गया।
translation_notes:
  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण काव्यात्मक शैली अपनाई गई है। ‘हिरनी’ सामान्य पाठक के लिए ‘मृगी’ से अधिक सहज है। मुख्य पाठ में ‘दृढ़ता से’ या ‘सुरक्षित’ नहीं जोड़ा गया, क्योंकि वह निहितार्थ हो सकता है पर इब्रानी में स्पष्ट नहीं है।
