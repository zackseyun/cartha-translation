language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/תִּגְעַ֬שׁ וַ/תִּרְעַ֨שׁ הָ/אָ֗רֶץ וּ/מוֹסְדֵ֣י הָרִ֣ים יִרְגָּ֑זוּ וַ֝/יִּתְגָּֽעֲשׁ֗וּ כִּי חָ֥רָה לֽ/וֹ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/007.yaml
  text: Then the earth reeled and quaked[a], and the foundations of the mountains trembled and reeled, because he was angry.
translation:
  language: hi
  text: 'तब पृथ्वी डगमगाई और काँप उठी;

    पहाड़ों की नींवें थरथराईं और डगमगा उठीं,

    क्योंकि उसका क्रोध भड़क उठा था।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्योंकि वह क्रोधित था।”
    reason: इब्रानी के ‘क्रोध जलने’ वाले मुहावरे का अधिक सीधा अर्थ-वाचन।
lexical_decisions:
- source_word: וַתִּגְעַשׁ
  choice: डगमगाई
  rationale: געשׁ पृथ्वी की प्रचंड हलचल या डोलने का सजीव चित्र देता है। ‘डगमगाई’ अगले क्रिया-पद ‘काँप उठी’ से भिन्न रहते हुए इस काव्यात्मक गति को व्यक्त करता है।
- source_word: וַתִּרְעַשׁ
  choice: काँप उठी
  rationale: רעשׁ भूकंपीय कंपन को दर्शाता है। ‘पृथ्वी काँप उठी’ आधुनिक हिन्दी में स्वाभाविक और प्रभावशाली है।
- source_word: הָאָרֶץ
  choice: पृथ्वी
  rationale: इस विश्वव्यापी ईश-प्रकटन के प्रसंग में स्थानीय ‘देश’ या ‘भूमि’ की अपेक्षा ‘पृथ्वी’ उपयुक्त है।
- source_word: מוֹסְדֵי הָרִים
  choice: पहाड़ों की नींवें
  rationale: यह पद पहाड़ों के आधारभूत सहारों का काव्यात्मक चित्र प्रस्तुत करता है; ‘नींवें’ स्पष्ट और गरिमापूर्ण हिन्दी है।
- source_word: יִרְגָּזוּ
  choice: थरथराईं
  rationale: רגז काँपने और व्याकुल हलचल का भाव रखता है। ‘थरथराईं’ नींवों के तीव्र कंपन को सजीव ढंग से व्यक्त करता है।
- source_word: וַיִּתְגָּעֲשׁוּ
  choice: डगमगा उठीं
  rationale: यह געשׁ की आरम्भिक छवि को फिर ग्रहण करता और तीव्र करता है। उसी हिन्दी मूल को दोहराने से पद का काव्यात्मक घेरा और समानांतरता बनी रहती है।
- source_word: כִּי חָרָה לוֹ
  choice: क्योंकि उसका क्रोध भड़क उठा था
  rationale: כִּי कारण बताता है, और חרה לוֹ जलते या भड़कते क्रोध का इब्रानी मुहावरा है। यह हिन्दी रूप मूल की अग्नि-संबंधी छवि को स्वाभाविक ढंग से बनाए रखता है।
theological_decisions:
- issue: परमेश्वर के क्रोध का मानव-सदृश काव्यात्मक वर्णन
  choice: क्योंकि उसका क्रोध भड़क उठा था
  alternative: क्योंकि वह क्रोधित था
  rationale: मूल पाठ क्रोध को ‘जलने/भड़कने’ के मुहावरे से सजीव बनाता है। हिन्दी में ‘क्रोध भड़क उठा’ इस काव्यात्मक तीव्रता और परमेश्वर के वास्तविक क्रोध—दोनों को बनाए रखता है, बिना उसके स्वरूप पर अतिरिक्त धर्मवैज्ञानिक निष्कर्ष थोपे।
translation_notes:
  register: आधुनिक मानक हिन्दी में काव्यात्मक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध शैली। पंक्ति-विन्यास इब्रानी समानांतरता को उभारता है; ‘डगमगाई/डगमगा उठीं’ की पुनरावृत्ति मूल में געשׁ की पुनरावृत्ति को दर्शाती है।
