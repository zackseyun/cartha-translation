  yaml_path: translation/ot/psalms/018/018.yaml
  text: They confronted me in the day of my calamity[a], but Yahweh was my support.
translation:
  language: hi
  text: मेरी विपत्ति के दिन उन्होंने मेरा सामना किया[a], परन्तु याहवे मेरा सहारा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरी विपत्ति के दिन वे मुझ पर आ पड़े”; या, “वे मुझसे आ मिले।”
    reason: יְקַדְּמוּנִי में सामने आने, आ मिलने अथवा शत्रुतापूर्वक आ पड़ने की अर्थ-सीमा है।
lexical_decisions:
- source_word: יְקַדְּמוּנִי
  choice: उन्होंने मेरा सामना किया
  rationale: पिएल रूप का मूल भाव ‘सामने आना/मिलना’ है; शत्रुतापूर्ण प्रसंग में ‘सामना किया’ विरोधी मुठभेड़ को व्यक्त करता है, पर सीधे ‘आक्रमण किया’ कहकर अर्थ को अनावश्यक रूप से संकीर्ण नहीं करता।
- source_word: בְיוֹם אֵידִי
  choice: मेरी विपत्ति के दिन
  rationale: אֵיד आपदा, विपत्ति या विनाशकारी संकट को दर्शाता है। ‘मेरी विपत्ति के दिन’ स्वाभाविक हिन्दी में कालगत वाक्यांश और काव्यात्मक गंभीरता दोनों बनाए रखता है।
- source_word: וַיְהִי
  choice: परन्तु ... था
  rationale: रूपतः यह कथा को आगे बढ़ाने वाला ‘और ... था’ हो सकता है, किन्तु दोनों पंक्तियों के स्पष्ट विरोध को हिन्दी में ‘परन्तु’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ के व्यक्तिगत दिव्य नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से प्रस्तुत किया गया है।
- source_word: לְמִשְׁעָן לִי
  choice: मेरा सहारा
  rationale: מִשְׁעָן उस वस्तु या व्यक्ति को सूचित करता है जिस पर टिका जा सके। ‘मेरा सहारा’ आधुनिक हिन्दी में स्पष्ट है और संभालने तथा टिकाए रखने का रूपक सुरक्षित रखता है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: यहाँ मूल पाठ में चार अक्षरों वाला व्यक्तिगत दिव्य नाम है। हिन्दी बाइबलीय प्रयोग में व्यापक रूप से पहचाने जाने वाले ‘यहोवा’ को रखा गया है, न कि उसे ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित किया गया। उच्चारण के पुनर्निर्माण को लेकर ‘याहवे’ भी सम्भव लिप्यंतरण है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘विपत्ति’ काव्यात्मक किन्तु सामान्यतः बोधगम्य है; ‘सहारा’ मूल रूपक को स्वाभाविक हिन्दी में व्यक्त करता है।
