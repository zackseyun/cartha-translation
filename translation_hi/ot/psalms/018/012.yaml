  text: מִ/נֹּ֗גַהּ נֶ֫גְדּ֥/וֹ עָבָ֥י/ו עָבְר֑וּ בָּ֝רָ֗ד וְ/גַֽחֲלֵי אֵֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/012.yaml
  text: From the brightness before him his clouds passed on—hail and coals of fire[a].
translation:
  language: hi
  text: उसके सामने की चमक से उसके घने बादल आगे बढ़े—ओले और आग के अंगारे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसके घने बादल गुज़र गए—ओले और आग के अंगारे।” इब्रानी भाषा संक्षिप्त और अत्यंत काव्यात्मक है, इसलिए तूफ़ान की इस छवि को थोड़े भिन्न ढंग से व्यक्त किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנֹּגַהּ
  choice: चमक से
  rationale: נֹגַהּ चमक या दीप्ति को दर्शाता है; उपसर्ग מִן स्रोत का भाव देता है, इसलिए ‘चमक से’ संक्षिप्त और स्वाभाविक है।
- source_word: נֶגְדּוֹ
  choice: उसके सामने की
  rationale: נֶגֶד के साथ तृतीय पुरुष एकवचन प्रत्यय का स्थानवाचक अर्थ ‘उसके सामने’ है; ‘की’ इसे ‘चमक’ से स्वाभाविक रूप से जोड़ता है।
- source_word: עָבָיו
  choice: उसके घने बादल
  rationale: עָב बादलों के घने समूह का बोध करा सकता है। ‘घने बादल’ मूल की तूफ़ानी छवि को स्पष्ट रखते हैं, जबकि ‘उसके’ प्रत्यय को व्यक्त करता है।
- source_word: עָבְרוּ
  choice: आगे बढ़े
  rationale: עבר का अर्थ यहाँ बादलों का गुज़रना या बढ़ना है। ‘आगे बढ़े’ गति को स्वाभाविक हिंदी में व्यक्त करता है और बादलों के लुप्त होने का अनावश्यक संकेत नहीं देता।
- source_word: בָּרָד
  choice: ओले
  rationale: यह मौसम-संबंधी शब्द का सामान्य और सटीक हिंदी रूप है।
- source_word: וְגַחֲלֵי אֵשׁ
  choice: और आग के अंगारे
  rationale: यह रचना के शब्दशः संबंध ‘आग के अंगारे’ को बनाए रखती है और काव्यात्मक छवि को स्पष्ट, गरिमापूर्ण हिंदी में प्रस्तुत करती है।
theological_decisions:
- issue: ईश्वरीय प्रकट होने की तूफ़ानी काव्य-छवि
  choice: तूफ़ान की सजीव छवि को बिना उसका स्वरूप निश्चित किए ज्यों का त्यों बनाए रखा गया है।
  alternative: इसे केवल युद्ध-विजय का रूपक मानना, अथवा प्रत्येक तत्व को स्पष्टतः शाब्दिक मौसम-विज्ञान संबंधी चमत्कार बताना।
  rationale: इब्रानी पद ईश्वर के प्रकट होने को संक्षिप्त और घनी काव्यात्मक तूफ़ानी भाषा में चित्रित करता है। अनुवाद को शाब्दिक और रूपकात्मक अर्थों के बीच की वास्तविक काव्यात्मक तनातनी को स्वयं हल नहीं करना चाहिए।
translation_notes:
  register: आधुनिक मानक हिंदी; काव्यात्मक किंतु साधारण पाठकों के लिए स्पष्ट। ‘चमक’, ‘घने बादल’, ‘ओले’ और ‘आग के अंगारे’ मूल तूफ़ानी दृश्य की गरिमा और संक्षिप्तता बनाए रखते हैं।
