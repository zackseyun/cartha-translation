source:
  edition: WLC
  text: יִשְׁלַ֣ח מִ֭/מָּרוֹם יִקָּחֵ֑/נִי יַֽ֝מְשֵׁ֗/נִי מִ/מַּ֥יִם רַבִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/016.yaml
  text: He sent from on high[a]; he took me; he drew me out of many waters.
translation:
  language: hi
  text: उसने ऊपर से हाथ बढ़ाया; उसने मुझे थाम लिया; उसने मुझे बहुत-से जलों में से खींच निकाला।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יִשְׁלַח מִמָּרוֹם
  choice: उसने ऊपर से हाथ बढ़ाकर
  rationale: יִשְׁלַח का मूल अर्थ ‘भेजना/बढ़ाना’ है। यहाँ अगले क्रियापद ‘मुझे थाम लिया’ के साथ बचाव की क्रिया व्यक्त होती है; इसलिए स्वाभाविक हिन्दी में ‘हाथ बढ़ाकर’ अर्थ को स्पष्ट करता है। ‘ऊपर से’ מִמָּרוֹם की ऊँचाई की छवि बनाए रखता है, पर स्पष्ट रूप से ‘स्वर्ग’ नहीं जोड़ता।
- source_word: יִקָּחֵנִי
  choice: मुझे थाम लिया
  rationale: לקח सामान्यतः ‘लेना’ है, पर इस बचाव-संदर्भ में हिन्दी का ‘थाम लिया’ उस पकड़ने और सुरक्षित करने की क्रिया को स्वाभाविक रूप से व्यक्त करता है।
- source_word: יַמְשֵׁנִי
  choice: मुझे ... से खींच निकाला
  rationale: हिफ़ईल रूप का अर्थ जल में से खींचकर निकालना है। यह अनुवाद स्पष्ट है और निर्गमन 2:10 से जुड़ी शब्द-प्रतिध्वनि को भी बनाए रखता है।
- source_word: מִמַּיִם רַבִּים
  choice: विशाल जलराशि
  rationale: शाब्दिक रूप ‘बहुत-से जल’ है। ‘विशाल जलराशि’ आधुनिक हिन्दी में स्वाभाविक रहते हुए प्रबल और चारों ओर से घेर लेने वाले जल की काव्यात्मक छवि बनाए रखता है।
theological_decisions:
- issue: क्या מִמָּרוֹם को स्पष्ट रूप से ‘स्वर्ग से’ कहा जाए
  choice: ऊपर से
  alternative: स्वर्ग से
  rationale: इब्रानी पाठ ऊँचाई/ऊपर का उल्लेख करता है, स्वर्ग का नहीं। ‘ऊपर से’ परमेश्वर की पारलौकिक ऊँचाई का संकेत बनाए रखता है और पाठ से अधिक विशिष्ट ब्रह्माण्ड-वर्णन नहीं जोड़ता।
- issue: जलराशि को वास्तविक जल मानें या संकट का रूपक स्पष्ट करें
  choice: मुख्य पाठ में जल की काव्यात्मक छवि बनाए रखना
  alternative: भारी संकट से
  rationale: पद स्वयं जल की छवि देता है और यह भजन में मृत्यु-समान, अभिभूत करने वाले संकट को चित्रित करती है। उसे सीधे ‘संकट’ कहना काव्यात्मक तनाव को समय से पहले सुलझा देगा।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक रखी गई है। ‘हाथ’ इब्रानी में स्पष्ट संज्ञा के रूप में नहीं है, पर ‘भेजना/बढ़ाना’ और ‘थाम लेना’ के संयुक्त बचाव-संदर्भ को सहज हिन्दी में व्यक्त करने के लिए जोड़ा गया है।
