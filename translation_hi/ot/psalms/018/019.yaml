source:
  edition: WLC
  text: וַ/יּוֹצִיאֵ֥/נִי לַ/מֶּרְחָ֑ב יְ֝חַלְּצֵ֗/נִי כִּ֘י חָ֥פֵֽץ בִּֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/019.yaml
  text: He brought me out into a broad place[a]; he rescued me[c][b], because he delighted in me.
translation:
  language: hi
  text: वह मुझे निकालकर एक खुले स्थान[a] में ले आया; उसने मुझे बचाया[b], क्योंकि वह मुझसे प्रसन्न था[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘एक चौड़े स्थान’ अथवा ‘एक विशाल स्थान’। इब्रानी बिंब घिराव और संकट के विपरीत स्वतंत्रता और सुरक्षा को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘उसने मुझे छुड़ाया’।
    reason: lexical_alternative
  - marker: c
    text: या ‘क्योंकि वह मुझमें आनन्दित था’।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצִיאֵנִי
  choice: वह मुझे निकालकर ... ले आया
  rationale: हिफ़ील रूप का कारणवाचक अर्थ ‘बाहर निकालना/ले आना’ है। यह चुनाव स्वाभाविक हिन्दी में बाहर निकाले जाने की छवि बनाए रखता है।
- source_word: לַמֶּרְחָב
  choice: एक खुले स्थान में
  rationale: מֶרְחָב चौड़ाई, खुलापन या विस्तृत जगह को दर्शाता है और संकटपूर्ण घेराव के विपरीत स्वतंत्रता तथा सुरक्षा की छवि देता है।
- source_word: יְחַלְּצֵנִי
  choice: उसने मुझे बचाया
  rationale: पिएल रूप यहाँ निकालकर छुड़ाने या बचाने का अर्थ देता है। ‘बचाया’ आधुनिक हिन्दी में सहज है और पहली पंक्ति के समानांतर है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह बचाए जाने का कारण प्रस्तुत करता है; ‘क्योंकि’ इसका कारणसूचक बल स्पष्ट रखता है।
- source_word: חָפֵץ בִּי
  choice: वह मुझसे प्रसन्न था
  rationale: इस पदबंध में חפץ अनुकूल प्रसन्नता या लगाव व्यक्त करता है। ‘मुझसे प्रसन्न था’ स्वाभाविक हिन्दी है और दैवी अनुग्रह को किसी विशिष्ट धर्मवैज्ञानिक तंत्र में नहीं बाँधता।
theological_decisions:
- issue: अंतिम उपवाक्य में व्यक्त परमेश्वर की अनुकूलता का स्वरूप
  choice: क्योंकि वह मुझसे प्रसन्न था
  alternative: क्योंकि वह मुझमें आनन्दित था / क्योंकि उसने मुझसे प्रसन्नता पाई
  rationale: इब्रानी पाठ उद्धार का कारण परमेश्वर की अनुकूल प्रसन्नता बताता है, पर यह नहीं बताता कि वह योग्यता, वाचा के चुनाव या अनुग्रह के किस विशिष्ट सिद्धान्त से संबंधित है। अनुवाद इस खुलेपन को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और काव्यात्मक वाक्य-विन्यास। ‘खुले स्थान’ से मूल स्थानिक बिंब सहज रूप में सुरक्षित है; ‘प्रसन्न था’ सामान्य पाठक के लिए स्वाभाविक रहते हुए धर्मवैज्ञानिक अस्पष्टता बनाए रखता है।
