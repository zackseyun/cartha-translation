  text: मैंने उन्हें हवा के आगे धूल के समान बारीक पीस डाला[a]; जैसे गलियों का कीचड़, वैसे ही मैंने उन्हें उंडेल दिया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘मैंने उन्हें हवा के आगे धूल के समान कुचल डाला।’ इब्रानी क्रिया में पीसकर चूर करने का भाव है। ‘हवा के आगे’ का शाब्दिक रूप ‘हवा के मुख पर’ है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘मैंने उन्हें खाली कर दिया।’ इब्रानी क्रिया का अर्थ ‘उंडेल देना’ या ‘खाली कर देना’ हो सकता है।
