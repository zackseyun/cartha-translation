lexical_decisions:
- source_word: וְאֶשְׁחָקֵם
  choice: मैंने उन्हें…बारीक पीस डाला
  rationale: שׁחק का अर्थ पीसकर या कुचलकर महीन कर देना है। ‘बारीक पीस डाला’ धूल बना देने की उपमा को स्पष्ट रखते हुए क्रिया की तीव्रता व्यक्त करता है।
- source_word: כְּעָפָר
  choice: धूल के समान
  rationale: עָפָר का सामान्य अर्थ धूल या भुरभुरी मिट्टी है; इस प्रसंग में ‘धूल’ अगली पवन-छवि के साथ स्वाभाविक है।
- source_word: עַל פְּנֵי רוּחַ
  choice: हवा के आगे
  rationale: शाब्दिक रूप ‘हवा के मुख/सतह पर’ है। ‘हवा के आगे’ आधुनिक हिन्दी में हवा द्वारा धूल के उड़ाए और बिखेरे जाने की छवि व्यक्त करता है, बिना उसे मुख्य पाठ में अनावश्यक रूप से विस्तार देने के।
- source_word: כְּטִיט חוּצוֹת
  choice: गलियों के कीचड़ के समान
  rationale: טִיט कीचड़ या दलदल-जैसी गीली मिट्टी है और חוּצוֹת गलियों/सड़कों को दर्शाता है। ‘गलियों का कीचड़’ अपमानजनक और रौंदी जाने वाली छवि बनाए रखता है।
- source_word: אֲרִיקֵם
  choice: मैंने उन्हें उंडेल दिया
  rationale: ריק के हिफ़ील रूप का मूल भाव खाली कर देना या उंडेल देना है। ‘उंडेल दिया’ कीचड़ की उपमा से मेल खाता है और असामान्य किन्तु सशक्त मूल रूपक को सुरक्षित रखता है।
