lexical_decisions:
- source_word: יַחֵל
  choice: आशा रख
  rationale: यहाँ יחל का रूप आग्रह या आह्वान व्यक्त करता है। ‘आशा रख’ अपेक्षा और भरोसे—दोनों भावों को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: יִשְׂרָאֵל
  choice: इस्राएल
  rationale: वाचा की प्रजा का व्यक्तिवाचक नाम; प्रचलित हिन्दी बाइबलीय रूप रखा गया है।
- source_word: אֶל
  choice: पर
  rationale: יחל के साथ यह उस व्यक्ति को सूचित करता है जिस पर आशा या भरोसा रखा जाता है; हिन्दी में ‘यहोवा पर आशा रख’ स्वाभाविक है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय परमेश्वर-नाम का हिन्दी में व्यापक रूप से पहचाना जाने वाला लिप्यंतरण, किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: מֵעַתָּה
  choice: अब से
  rationale: समय के आरम्भ-बिंदु को संक्षिप्त और स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: וְעַד עוֹלָם
  choice: सदा तक
  rationale: यह मुहावरा अनन्त कालावधि को व्यक्त करता है; ‘सदा तक’ काव्यात्मक, स्पष्ट और सहज हिन्दी है।
theological_decisions:
- issue: आरम्भिक क्रिया-रूप के आग्रहात्मक भाव का अनुवाद
  choice: 'प्रत्यक्ष सम्बोधन: ‘इस्राएल, ... आशा रख’'
  alternative: 'अन्य पुरुष आज्ञार्थक/कामनार्थक: ‘इस्राएल यहोवा पर आशा रखे’'
  rationale: इब्रानी अपूर्ण/जुसिव रूप को सामुदायिक आह्वान के रूप में प्रत्यक्ष सम्बोधन या ‘रखे’ के साथ व्यक्त किया जा सकता है। प्रत्यक्ष सम्बोधन हिन्दी में सजीव और स्वाभाविक है, जबकि पादटिप्पणी वास्तविक व्याकरणिक विकल्प को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और काव्यात्मक। एकवचन ‘रख’ इस्राएल को सामूहिक व्यक्तित्व के रूप में किए गए प्रत्यक्ष सम्बोधन से मेल खाता है।
