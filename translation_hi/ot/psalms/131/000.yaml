  text: A Song of Ascents[b][a]. Of David.
translation:
  language: hi
  text: 'चढ़ाइयों का गीत।[a] दाऊद का।


    हे यहोवा, न मेरा मन घमंडी है,

    न मेरी आँखें ऊँची हैं;

    मैं न बड़ी बातों में पड़ा हूँ,

    न ऐसी अद्भुत बातों में जो मेरी पहुँच से परे हैं।[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “दाऊद द्वारा” अथवा “दाऊद के लिए।” हिब्रू शीर्षक लेखन, संबंध या समर्पण का संकेत दे सकता है।
    reason: alternative_reading
  - marker: b
    text: या “ऐसी असाधारण बातों में जो मुझसे परे हैं।” हिब्रू अभिव्यक्ति उन बातों को दर्शाती है जो वक्ता के उचित क्षेत्र या सामर्थ्य से बढ़कर हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: चढ़ाइयों का गीत
  rationale: यह पदबंध उन भजनों के पारंपरिक समूह-सूचक शीर्षक को दर्शाता है जिन्हें ऊपर चढ़ते हुए, सम्भवतः यरूशलेम की तीर्थयात्रा में, गाया जाता था; शाब्दिक चित्र बनाए रखा गया है।
- source_word: גָבַהּ לִבִּי
  choice: मेरा मन घमंडी है
  rationale: हिब्रू में हृदय के ऊँचा होने का रूपक अहंकार को व्यक्त करता है; आधुनिक हिन्दी में उसका स्वाभाविक अर्थ दिया गया है।
- source_word: רָמוּ עֵינַי
  choice: मेरी आँखें ऊँची हैं
  rationale: मूल रूपक को सुरक्षित रखा गया है; सन्दर्भ में यह अभिमानी दृष्टि या आत्म-महत्त्व का संकेत देता है।
- source_word: הִלַּכְתִּי בִּגְדֹלוֹת
  choice: मैं बड़े-बड़े कामों में पड़ता हूँ
  rationale: शाब्दिक ‘बड़ी बातों में चलता हूँ’ हिन्दी में अस्वाभाविक होता; यह चयन ऐसे महान विषयों या प्रयत्नों में स्वयं को लगाने का भाव व्यक्त करता है।
- source_word: נִפְלָאוֹת מִמֶּנִּי
  choice: वे बातें जो मेरे बस से बाहर हैं
  rationale: यह पदबंध ऐसी असाधारण या कठिन बातों को दर्शाता है जो वक्ता के उचित क्षेत्र या सामर्थ्य से परे हैं; केवल बौद्धिक ‘समझ’ तक अर्थ को सीमित नहीं किया गया।
theological_decisions:
- issue: לְדָוִד superscription
  choice: दाऊद का
  alternative: दाऊद द्वारा / दाऊद के लिए
  rationale: परंपरागत और संक्षिप्त शीर्षकीय रूप रखा गया है, पर हिब्रू לְ संबंध, लेखन या समर्पण का संकेत दे सकता है; इस अनिश्चितता को पादटिप्पणी में सुरक्षित किया गया है।
- issue: वक्ता की विनम्रता का स्वरूप
  choice: घमंड, ऊँची दृष्टि और अपनी सीमा से बाहर की बातों में पड़ने से इनकार
  alternative: केवल बौद्धिक जिज्ञासा या निषिद्ध ज्ञान का त्याग
  rationale: मूल पाठ सामान्य विनम्रता और उचित सीमाओं की भाषा बोलता है; उसे किसी विशिष्ट धार्मिक सिद्धान्त या ज्ञान-विरोधी अर्थ तक सीमित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। काव्यात्मक समानांतरता तथा ‘आँखें ऊँची’ का मूल रूपक सुरक्षित है। ‘यहोवा’ से चार-अक्षरीय दिव्य नाम יהוה को स्पष्ट रूप से दर्शाया गया है।
