  edition: WLC
  text: שִׁ֥יר הַֽ/מַּֽעֲל֗וֹת לְ/דָ֫וִ֥ד יְהוָ֤ה לֹא גָבַ֣הּ לִ֭בִּ/י וְ/לֹא רָמ֣וּ עֵינַ֑/י וְ/לֹֽא הִלַּ֓כְתִּי בִּ/גְדֹל֖וֹת וּ/בְ/נִפְלָא֣וֹת מִמֶּֽ/נִּי׀־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/131/001.yaml
  text: 'A Song of Ascents[a]. Of David.

    Yahweh, my heart is not proud, and my eyes are not raised high[b]; I have not walked in things too great and too wondrous for me.'
translation:
  language: hi
  text: 'चढ़ाइयों का एक गीत।[a]

    दाऊद का।


    हे याहवे,

    मेरा मन घमंडी नहीं है,

    न मेरी आँखें ऊँची उठी हैं;

    न मैं ऐसी बड़ी और अद्भुत बातों में पड़ा हूँ

    जो मेरी पहुँच से परे हैं।[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “चढ़ाइयों का गीत।” यह भजनों के इस संग्रह का पारम्परिक शीर्षक है; इसका सटीक ऐतिहासिक आशय निश्चित नहीं है।
    reason: शीर्षकीय पदबंध के वैकल्पिक हिन्दी रूप और उसके ऐतिहासिक आशय की अनिश्चितता को बिना अटकलबाज़ी के दर्शाना।
  - marker: b
    text: या, “जो मुझसे बढ़कर हैं।” इब्रानी पदबंध ऐसी बातों का भाव देता है जो वक्ता की सामर्थ्य या उचित सीमा से अधिक हों।
    reason: מִמֶּנִּי के शाब्दिक निकट विकल्प और क्षमता/सीमा सम्बन्धी निहितार्थ को देना।
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: चढ़ाई के गीतों में से एक
  rationale: מַעֲלוֹת का मूल भाव ‘चढ़ाइयाँ/ऊपर जाना’ है और यह भजन 120–134 के संग्रह का शीर्षक भी है। यह रूप उस सामूहिक शीर्षक और मूल बिंब, दोनों को स्वाभाविक हिन्दी में रखता है।
- source_word: לְדָוִד
  choice: दाऊद का
  rationale: भजनों के शीर्षकों में לְ लेखकत्व, सम्बन्ध या समर्पण सूचित कर सकता है। ‘दाऊद का’ इन सम्भावनाओं को अनावश्यक रूप से सीमित नहीं करता।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चार-अक्षरीय व्यक्तिगत ईश्वरीय नाम को हिन्दी में प्रचलित नामरूप ‘यहोवा’ से व्यक्त किया गया है, किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: גָבַהּ לִבִּי
  choice: मेरा मन घमण्डी है
  rationale: इब्रानी में हृदय के ‘ऊँचा होने’ का मुहावरा अहंकार बताता है। निषेध के साथ ‘मेरा मन घमण्डी नहीं है’ आधुनिक हिन्दी में इसका स्वाभाविक अर्थ देता है।
- source_word: רָמוּ עֵינַי
  choice: मेरी आँखें ऊँची उठी हैं
  rationale: यह घमण्ड भरी, आत्मोन्नत दृष्टि का चित्र है। हिन्दी में शाब्दिक बिंब बनाए रखा गया है और निषेध मुख्य पाठ में स्पष्ट है।
- source_word: הִלַּכְתִּי
  choice: मैं … में पड़ा हूँ
  rationale: यहाँ הלך का आशय किसी क्षेत्र में चलने, लगने या अपने को व्यस्त करने से है। ‘में पड़ा हूँ’ सामान्य हिन्दी में अनुचित रूप से बड़ी बातों में लगने का भाव देता है।
- source_word: בִּגְדֹלוֹת וּבְנִפְלָאוֹת מִמֶּנִּי
  choice: उन बातों में … जो मेरे लिए अत्यन्त बड़ी और अत्यन्त अद्भुत हैं
  rationale: स्त्रीलिंग बहुवचन विशेषण संज्ञा की तरह ‘बड़ी और अद्भुत बातें’ बताते हैं; מִמֶּנִּי उन्हें वक्ता के उचित दायरे या सामर्थ्य से अधिक ठहराता है। ‘मेरे लिए’ मूल की तुलनात्मक अस्पष्टता को बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम है, केवल ‘प्रभु’ की उपाधि नहीं। इसलिए हिन्दी पाठ में नाम को बनाए रखा गया है।
- issue: शीर्षक לְדָוִד का सम्बन्ध
  choice: दाऊद का
  alternative: दाऊद द्वारा / दाऊद के लिए
  rationale: לְ लेखकत्व, सम्बन्ध या समर्पण में से किसी को सूचित कर सकता है। ‘दाऊद का’ इस अस्पष्टता को अपेक्षाकृत सुरक्षित रखता है।
- issue: מִמֶּנִּי की सीमा का स्वरूप
  choice: मेरे लिए
  alternative: मेरी पहुँच से परे
  rationale: मूल वाक्यांश वक्ता की क्षमता, उचित क्षेत्र या दर्जे से अधिक होने का भाव दे सकता है। मुख्य पाठ ने व्यापक ‘मेरे लिए’ रखा है और अधिक स्पष्ट विकल्प टिप्पणी में दिया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। काव्यात्मक समानान्तरता के लिए तीन निषेधात्मक पंक्तियाँ संरक्षित हैं। ‘मन’ हिन्दी में आन्तरिक वृत्ति के लिए ‘हृदय’ से अधिक सहज है; ‘आँखें ऊँची उठी’ मूल रूपक को बनाए रखता है।
