source:
  edition: WLC
  text: אִם לֹ֤א שִׁוִּ֨יתִי וְ/דוֹמַ֗מְתִּי נַ֫פְשִׁ֥/י כְּ֭/גָמֻל עֲלֵ֣י אִמּ֑/וֹ כַּ/גָּמֻ֖ל עָלַ֣/י נַפְשִֽׁ/י־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/131/002.yaml
  text: Surely I have calmed and quieted my soul[a], like a weaned child with his mother[c][b]; like a weaned child is my soul within me.
translation:
  language: hi
  text: निश्चय ही[a] मैंने अपने मन को स्थिर और शांत कर लिया है। जैसे दूध छुड़ाए हुए बच्चा अपनी माँ के पास होता है[b], वैसे ही दूध छुड़ाए हुए बच्चे के समान मेरे भीतर मेरा मन है[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यदि मैंने अपने मन को सम और शांत न किया हो।” इब्रानी आरम्भ एक बलात्मक, शपथ-जैसा मुहावरा है; मुख्य पाठ में इसे “निश्चय ही” कहा गया है।
    reason: lexical_alternative
  - marker: b
    text: चित्र ऐसे बच्चे का है जिसका दूध छुड़ाया जा चुका है और जो अब दूध के लिए बेचैन हुए बिना अपनी माँ के पास शांत रहता है।
    reason: cultural_note
  - marker: c
    text: शाब्दिक रूप से, “दूध छुड़ाए हुए बच्चे के समान मेरा मन मुझ पर है।” इब्रानी अभिव्यक्ति कठिन है; “मेरे भीतर” सम्भावित भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
    reason: alternative_reading
lexical_decisions:
- source_word: אִם לֹא
  choice: निश्चय ही
  rationale: यहाँ यह पदबंध सामान्य शर्त नहीं, बल्कि शपथ-जैसा बल देने वाला मुहावरा है; ‘निश्चय ही’ उस दृढ़ आत्मकथन को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: שִׁוִּיתִי
  choice: मैंने … स्थिर कर लिया है
  rationale: मूल क्रिया का शाब्दिक भाव ‘समतल/समान करना’ है, पर यहाँ आशय अपने भीतर को सम और संयत अवस्था में लाना है; ‘स्थिर’ अगले क्रियापद के साथ स्वाभाविक बैठता है।
- source_word: וְדוֹמַמְתִּי
  choice: और शांत कर लिया है
  rationale: यह क्रिया चुप या निश्चल करने का भाव देती है। यह अनुवाद भजनकार की जानबूझकर की गई आंतरिक क्रिया को बनाए रखता है।
- source_word: נַפְשִׁי
  choice: अपने मन / मेरा मन
  rationale: यहाँ נֶפֶשׁ व्यक्ति के भीतरी स्व को दर्शाता है। हिन्दी में ‘मन’ शांत और स्थिर किए जाने वाले आंतरिक जीवन को सहजता से व्यक्त करता है, बिना किसी तकनीकी शरीर-आत्मा द्वैत को आरोपित किए।
- source_word: כְּגָמֻל
  choice: दूध छुड़ाया हुआ बच्चा
  rationale: यह निष्क्रिय कृदन्त उस छोटे बच्चे को दर्शाता है जिसका स्तनपान छुड़ाया जा चुका है; यह रूपक को स्पष्ट और संक्षिप्त रखता है।
- source_word: עֲלֵי אִמּוֹ
  choice: अपनी माँ के पास
  rationale: על यहाँ माँ से निकट, आश्वस्त संबंध में होने का भाव देता है; ‘पास’ हिन्दी में उस निकटता को स्वाभाविक रूप से व्यक्त करता है।
- source_word: כַּגָּמֻל עָלַי נַפְשִׁי
  choice: वैसे ही मेरा मन मेरे भीतर दूध छुड़ाए हुए बच्चे के समान है
  rationale: दूसरी पंक्ति उपमा को दोहराकर गहरा करती है। शाब्दिक ‘मुझ पर’ हिन्दी में अस्पष्ट और अस्वाभाविक है; ‘मेरे भीतर’ सम्भावित आंतरिक अर्थ देता है, जबकि शाब्दिक विकल्प पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: נַפְשִׁי का मानव-स्वरूप संबंधी आशय
  choice: ‘मन’ के रूप में अनुवाद, जो भजनकार के भीतरी स्व और उसकी शांत अवस्था को दर्शाता है।
  alternative: ‘मेरी आत्मा’ अथवा ‘मेरा प्राण’
  rationale: संदर्भ भजनकार के भीतर की आकांक्षाओं और भावों को शांत करने का है। ‘मन’ आधुनिक हिन्दी में स्वाभाविक है और मूल शब्द पर कोई विशिष्ट शरीर-आत्मा सिद्धान्त आरोपित नहीं करता।
- issue: दूध छुड़ाए बच्चे की उपमा
  choice: उपमा को माँ के पास शांत निकटता के चित्र के रूप में बिना अतिरिक्त धार्मिक व्याख्या के रखा गया है।
  alternative: इसे निर्भरता, तृप्ति या आध्यात्मिक परिपक्वता के किसी एक निश्चित सिद्धान्त के रूप में स्पष्ट करना।
  rationale: मूल काव्य-चित्र में शांति, निकटता और इच्छाओं के संयम के कई जुड़े हुए भाव सम्भव हैं; अनुवाद को उनमें से किसी एक तक सीमित नहीं करना चाहिए।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। काव्यात्मक पुनरावृत्ति बनाए रखते हुए अत्यधिक संस्कृतनिष्ठ शब्दावली से बचा गया है। ‘बच्चा’ सामान्य पाठक के लिए सहज है, और ‘स्थिर और शांत’ इब्रानी समानांतर क्रियाओं का स्वाभाविक हिन्दी युग्म है।
