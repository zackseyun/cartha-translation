source:
  edition: WLC
  text: כִּֽי אַתָּה֮ תְּבָרֵ֪ךְ צַ֫דִּ֥יק יְהוָ֑ה כַּ֝/צִּנָּ֗ה רָצ֥וֹן תַּעְטְרֶֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/005/012.yaml
  text: For you bless the righteous[a], O Yahweh; like a shield, favor surrounds him.
translation:
  language: hi
  text: क्योंकि, हे यहोवा, तू धर्मी को आशीष देता है; तेरी कृपा उसे बड़ी ढाल की तरह चारों ओर घेरती है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तेरी कृपा उसे बड़ी ढाल की तरह मुकुट पहनाती है।” इब्रानी क्रिया का अर्थ “मुकुट पहनाना” या “चारों ओर घेरना” हो सकता है; बड़ी ढाल की छवि रक्षात्मक घेरे के अर्थ का समर्थन करती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले संदर्भ में प्रार्थना और भरोसे का कारण बताता है; इसलिए कारणसूचक अर्थ रखा गया है।
- source_word: תְּבָרֵךְ
  choice: आशीष देता है
  rationale: अपूर्ण क्रिया यहाँ परमेश्वर के निश्चित और नियमित कार्य को व्यक्त करती है; वर्तमानकालीन हिंदी स्वाभाविक है।
- source_word: צַדִּיק
  choice: धर्मी
  rationale: एकवचन विशेषण संज्ञा के रूप में प्रतिनिधिक अर्थ रखता है; ‘धर्मी’ किसी एक व्यक्ति के साथ-साथ धर्मी जन की सामान्य श्रेणी को भी व्यक्त कर सकता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिंदी में प्रचलित रूप ‘यहोवा’ के द्वारा परमेश्वर के विशिष्ट वाचा-नाम को सामान्य उपाधि में बदले बिना रखा गया है।
- source_word: כַּצִּנָּה
  choice: बड़ी ढाल की तरह
  rationale: צִנָּה सामान्यतः शरीर को अधिक ढकने वाली बड़ी ढाल को दर्शाता है; उपमा को स्पष्ट और स्वाभाविक हिंदी में रखा गया है।
- source_word: רָצוֹן
  choice: अपनी कृपा से
  rationale: यहाँ शब्द परमेश्वर की अनुकूलता या प्रसन्नता को दर्शाता है; संबंध स्पष्ट करने के लिए ‘अपनी’ जोड़ा गया है।
- source_word: תַּעְטְרֶנּוּ
  choice: उसे ... चारों ओर घेर लेता है
  rationale: क्रिया का अर्थ ‘मुकुट पहनाना’ अथवा ‘घेरना’ हो सकता है; ढाल की रक्षात्मक उपमा के कारण मुख्य पाठ में घेरने का अर्थ उपयुक्त है, जबकि दूसरा अर्थ पाद-टिप्पणी में रखा गया है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में विशिष्ट ईश्वरीय नाम है। हिंदी के सामान्य बाइबलीय प्रयोग में पहचाने जाने वाले ‘यहोवा’ को रखा गया है; यह नाम को ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित नहीं करता।
- issue: תַּעְטְרֶנּוּ में मुकुट और रक्षात्मक घेरे के बीच तनाव
  choice: चारों ओर घेर लेता है
  alternative: मुकुट की तरह सजा देता है / मुकुट पहनाता है
  rationale: साथ की बड़ी ढाल वाली छवि रक्षात्मक घेरे का समर्थन करती है, पर क्रिया के ‘मुकुट पहनाने’ वाले अर्थ को पाद-टिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिंदी। ‘तू’ भजन की सीधी प्रार्थनात्मक संबोधन-शैली और हिंदी बाइबलीय काव्य-परंपरा के अनुरूप है।
