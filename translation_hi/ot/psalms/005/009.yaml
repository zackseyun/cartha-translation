language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּ֤י אֵ֪ין בְּ/פִ֡י/הוּ נְכוֹנָה֮ קִרְבָּ֪/ם הַ֫וּ֥וֹת קֶֽבֶר פָּת֥וּחַ גְּרוֹנָ֑/ם לְ֝שׁוֹנָ֗/ם יַחֲלִֽיקוּ/ן־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/005/009.yaml
  text: For there is nothing trustworthy in their mouth[a]; their inward part is destruction. Their throat is an open grave[c][b]; with their tongue they flatter.
translation:
  language: hi
  text: क्योंकि उनके मुँह की कोई बात भरोसे के योग्य नहीं; उनका अंतर विनाश है। उनका गला खुली कब्र है; वे अपनी जीभ से चिकनी-चुपड़ी बातें करते हैं[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वे अपनी जीभ से चापलूसी करते हैं।”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले पद की विनती का कारण बताता है और पदों के तार्किक संबंध को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: אֵין בְּפִיהוּ נְכוֹנָה
  choice: उनके मुँह की कोई बात भरोसे के योग्य नहीं
  rationale: נְכוֹנָה में दृढ़ता, विश्वसनीयता और खराई का भाव है। हिन्दी वाक्यांश भ्रामक वाणी के संदर्भ में पूर्ण अविश्वसनीयता को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: קִרְבָּם
  choice: उनका अंतर्मन
  rationale: शब्द उनके भीतर या भीतरी अस्तित्व को दर्शाता है। 'अंतर्मन' सहज हिन्दी है और अर्थ को केवल हृदय अथवा किसी एक मानसिक क्षमता तक सीमित नहीं करता।
- source_word: הַוּוֹת
  choice: विनाश से भरा है
  rationale: बहुवचन संज्ञा विनाशकारी योजनाओं, विपत्तियों या बरबादी का बोध करा सकती है। विधेयात्मक काव्य-पंक्ति को स्वाभाविक हिन्दी में व्यक्त करने के लिए 'विनाश से भरा' चुना गया है।
- source_word: קֶבֶר פָּתוּחַ
  choice: खुली कब्र
  rationale: मूल का सजीव और घातक रूपक सीधे सुरक्षित रहता है।
- source_word: גְּרוֹנָם
  choice: उनका गला
  rationale: वाणी के संदर्भ में 'गला' स्वाभाविक शारीरिक शब्द है और कब्र के रूपक को बनाए रखता है।
- source_word: לְשׁוֹנָם יַחֲלִיקוּן
  choice: वे अपनी जीभ से चिकनी-चुपड़ी बातें करते हैं
  rationale: חלק के हिफ़ईल रूप में वाणी को चिकना बनाने, मधुर ढंग से बोलने या चापलूसी करने का भाव है। चुना हुआ वाक्य मूल बिंब और संभावित छलपूर्ण मधुरता दोनों को रखता है।
theological_decisions:
- issue: בְּפִיהוּ में एकवचन रूप और आगे के बहुवचन प्रत्यय
  choice: उनके मुँह
  alternative: उसके मुँह
  rationale: आरंभिक रूप व्याकरणतः एकवचन है, पर शेष पद स्पष्टतः उसी दुष्ट समूह के लिए बहुवचन प्रत्ययों का प्रयोग करता है। सामूहिक संदर्भ को स्वाभाविक हिन्दी में बहुवचन से व्यक्त किया गया है।
- issue: קִרְבָּם का मानव-भीतर संबंधी रूपक
  choice: उनका अंतर्मन
  alternative: उनका हृदय / उनका भीतरी भाग
  rationale: यह चयन आंतरिक भ्रष्टता को व्यक्त करता है, पर अर्थ को केवल भावना, बुद्धि या इच्छा जैसी किसी एक क्षमता तक सीमित नहीं करता।
- issue: הַוּוֹת का अर्थ-क्षेत्र
  choice: विनाश से भरा है
  alternative: विनाश है / विपत्तियाँ हैं / बरबादी है
  rationale: मूल में विनाश, विपत्ति या विनाशकारी चालों की अर्थ-संभावना है। चुना हुआ रूप आरोप की तीव्रता बनाए रखते हुए हिन्दी में अर्थपूर्ण है और किसी विशिष्ट धार्मिक व्याख्या को नहीं थोपता।
translation_notes:
  register: आधुनिक मानक हिन्दी में काव्यात्मक गरिमा और सामान्य बोधगम्यता का संतुलन रखा गया है। 'खुली कब्र' का मूल रूपक यथावत है; 'चिकनी-चुपड़ी बातें' वर्तमान हिन्दी का परिचित मुहावरा है। पद की समानांतर पंक्तियों को स्पष्ट विराम-चिह्नों से अलग किया गया है।
