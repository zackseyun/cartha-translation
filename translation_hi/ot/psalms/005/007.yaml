  yaml_path: translation/ot/psalms/005/007.yaml
  text: But as for me[a], by the abundance of your steadfast love I will enter your house[b]; I will bow down toward your holy temple in fear of you.
translation:
  language: hi
  text: परन्तु मैं[a] तेरे अटल प्रेम की बहुतायत के कारण तेरे भवन में प्रवेश करूँगा; तेरे प्रति भय रखते हुए तेरे पवित्र मन्दिर की ओर झुककर प्रणाम करूँगा।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और मैं।” यहाँ पिछले पदों में वर्णित दुष्टों के साथ विरोध होने के कारण “परन्तु” अनुवाद किया गया है।
    reason: discourse_alternative
  - marker: b
    text: “तेरे प्रति भय रखते हुए” का अर्थ “तेरे प्रति श्रद्धा के साथ” या “तेरे प्रति विस्मय के साथ” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: परन्तु मैं
  rationale: संयोजक और स्वतंत्र सर्वनाम पिछले पदों में वर्णित दुष्टों के विपरीत भजनकार को सामने रखते हैं; इसलिए यहाँ विरोधसूचक भाव स्वाभाविक है।
- source_word: בְּרֹב חַסְדְּךָ
  choice: तेरी अपार अटल करुणा के कारण
  rationale: בְּרֹב आधार या कारण का भाव देता है, और חֶסֶד परमेश्वर की स्थायी, निष्ठावान करुणा को व्यक्त करता है। यह रूप हिन्दी में सहज रहते हुए दोनों भावों को रखता है।
- source_word: אָבוֹא בֵיתֶךָ
  choice: तेरे भवन में प्रवेश करूँगा
  rationale: अपूर्ण क्रिया यहाँ संकल्प या अपेक्षा व्यक्त करती है। בֵיתֶךָ का मूल अर्थ 'तेरा भवन/घर' है; अगले खंड के 'मन्दिर' से भेद बनाए रखने के लिए इसे भवन कहा गया है।
- source_word: אֶשְׁתַּחֲוֶה
  choice: दण्डवत करूँगा
  rationale: क्रिया शारीरिक रूप से झुकने या भूमि पर दण्डवत होने को दर्शाती है; केवल 'आराधना करूँगा' कहने से यह सजीव शारीरिक बिम्ब खो जाता।
- source_word: אֶל הֵיכַל קָדְשְׁךָ
  choice: तेरे पवित्र मन्दिर की ओर
  rationale: אֶל यहाँ दिशा बताता है, और הֵיכַל इस उपासना-संदर्भ में परमेश्वर के पवित्र मन्दिर को सूचित करता है।
- source_word: בְּיִרְאָתֶךָ
  choice: तेरे भय में
  rationale: יִרְאָה में भय, श्रद्धा और विस्मय का अर्थ-क्षेत्र सम्मिलित है। 'भय' मूल शब्द की गंभीरता बनाए रखता है, जबकि टिप्पणी वैकल्पिक बारीकियाँ बताती है।
theological_decisions:
- issue: חֶסֶד का उपासना-संदर्भ में अनुवाद
  choice: अटल करुणा
  alternative: वाचा की निष्ठा; दया
  rationale: पद परमेश्वर के भवन में प्रवेश का आधार उसकी प्रचुर और स्थायी निष्ठावान करुणा को बनाता है। 'अटल करुणा' किसी एक संप्रदायगत व्याख्या को थोपे बिना प्रेम, दया और स्थिरता को व्यक्त करती है।
- issue: परमेश्वर के सम्मुख יִרְאָה की बारीकी
  choice: तेरे भय में
  alternative: तेरे प्रति श्रद्धा से; तेरे विस्मय में
  rationale: मूल पाठ भय, श्रद्धा और विस्मय के तनाव को समेटता है। मुख्य पाठ में 'भय' उसकी तीव्रता को सुरक्षित रखता है और पादटिप्पणी अन्य वैध अर्थच्छटाएँ देती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण उपासना-रजिस्टर अपनाया गया है। 'तेरी/तेरे' बाइबिलीय काव्य में परमेश्वर के लिए प्रचलित निकट एकवचन संबोधन है। 'दण्डवत' शारीरिक झुकने का बिम्ब संक्षेप और स्वाभाविक रूप से बचाता है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
