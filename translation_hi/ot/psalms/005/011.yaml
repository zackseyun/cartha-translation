id: PSA.5.11
reference: Psalms 5:11
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/יִשְׂמְח֨וּ כָל ח֪וֹסֵי בָ֡/ךְ לְ/עוֹלָ֣ם יְ֭רַנֵּנוּ וְ/תָסֵ֣ךְ עָלֵ֑י/מוֹ וְֽ/יַעְלְצ֥וּ בְ֝/ךָ֗ אֹהֲבֵ֥י שְׁמֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/005/011.yaml
  text: But let all who take refuge in you rejoice[a]; let them shout for joy forever. Spread your protection over them[b], so that those who love your name may exult in you.
translation:
  language: hi
  text: परन्तु वे सभी जो तुझमें शरण लेते हैं, आनन्दित हों; वे सदा जयजयकार करें। तू उन्हें अपनी ओट में रख[a], और तेरे नाम से प्रेम करनेवाले तुझमें हर्षित हों।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘तू उन्हें ढाँप ले’ अथवा ‘उन्हें आश्रय दे।’ इब्रानी में सुरक्षा देने के लिए ऊपर से ढकने की छवि है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִשְׂמְחוּ
  choice: आनन्दित हों
  rationale: प्रार्थना के संदर्भ में अपूर्ण क्रिया को इच्छासूचक रूप में समझना स्वाभाविक है; यह साधारण भविष्यवाणी के बजाय प्रार्थना की ध्वनि बनाए रखता है।
- source_word: חוֹסֵי בָךְ
  choice: जो तुझमें शरण लेते हैं
  rationale: חסה का कृदन्त केवल मन के भरोसे को नहीं, बल्कि सुरक्षा के लिए शरण लेने की ठोस छवि को व्यक्त करता है।
- source_word: לְעוֹלָם יְרַנֵּנוּ
  choice: वे सदा जयजयकार करें
  rationale: רנן का पिएल रूप उल्लासपूर्ण, गूँजती पुकार को व्यक्त कर सकता है और उसमें गाना भी सम्मिलित हो सकता है; ‘जयजयकार करें’ इस व्यापक उत्सवी स्वर को स्वाभाविक हिन्दी में रखता है।
- source_word: וְתָסֵךְ עָלֵימוֹ
  choice: तू उन्हें अपनी ओट में रख
  rationale: סכך का हिफ़ील रूप ऊपर से ढककर सुरक्षा देने की छवि रखता है; ‘अपनी ओट में रख’ उस सुरक्षात्मक आवरण को सहज हिन्दी में व्यक्त करता है।
- source_word: וְיַעְלְצוּ בְךָ
  choice: तुझमें हर्षित हों
  rationale: עלץ प्रबल और उत्साहपूर्ण आनन्द को दर्शाता है; ‘हर्षित हों’ काव्यात्मक गरिमा और परमेश्वर-केंद्रित ‘तुझमें’ दोनों को बनाए रखता है।
- source_word: אֹהֲבֵי שְׁמֶךָ
  choice: तेरे नाम से प्रेम करनेवाले
  rationale: इब्रानी में स्पष्टतः ‘तेरा नाम’ है, जो परमेश्वर के प्रकट चरित्र और प्रतिष्ठा की ओर संकेत करता है; इसे केवल ‘तुझसे प्रेम करनेवाले’ नहीं बनाया गया।
theological_decisions:
- issue: पूरे पद में प्रार्थनात्मक इच्छा अथवा भविष्यवाणी
  choice: 'क्रियारूपों को इच्छासूचक प्रार्थना के रूप में प्रस्तुत किया गया: ‘आनन्दित हों’, ‘जयजयकार करें’, ‘हर्षित हों’।'
  alternative: ‘आनन्दित होंगे’, ‘जयजयकार करेंगे’, ‘हर्षित होंगे’ के रूप में भविष्यवाणी।
  rationale: भजन की प्रार्थनात्मक परिस्थिति में ये अपूर्ण रूप इच्छासूचक अर्थ दे सकते हैं। चुना हुआ रूप भविष्यवाणी की निश्चितता आरोपित किए बिना मूल की उपासना और विनती की शक्ति को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण काव्यात्मक रूप अपनाया गया है। भजन में परमेश्वर के लिए एकवचन आत्मीय संबोधन ‘तू/तुझ/तेरे’ रखा गया है। ‘जयजयकार’ रנן की उल्लासपूर्ण पुकार को व्यक्त करता है, जबकि ‘ओट’ सुरक्षात्मक आवरण की मूल छवि को सहज और संक्षिप्त ढंग से बनाए रखती है।
