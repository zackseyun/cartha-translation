id: PSA.5.10
reference: Psalms 5:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: הַֽאֲשִׁימֵ֨/ם אֱֽלֹהִ֗ים יִפְּלוּ֮ מִֽ/מֹּעֲצ֪וֹתֵ֫י/הֶ֥ם בְּ/רֹ֣ב פִּ֭שְׁעֵי/הֶם הַדִּיחֵ֑/מוֹ כִּי מָ֥רוּ בָֽ/ךְ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/005/010.yaml
  text: Declare them guilty[a], O God; let them fall by their own counsels. Drive them away because of their many transgressions[b], for they have rebelled against you.
translation:
  language: hi
  text: 'हे परमेश्वर, उन्हें दोषी ठहरा;

    वे अपनी ही युक्तियों से गिर पड़ें[a]।

    उनके बहुत-से अपराधों के कारण उन्हें दूर कर दे[b],

    क्योंकि उन्होंने तेरे विरुद्ध विद्रोह किया है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वे अपनी युक्तियों के कारण गिर पड़ें।” इब्रानी में यहाँ प्रयुक्त शब्द उनके पतन के स्रोत अथवा साधन—दोनों की ओर संकेत कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: “दूर कर दे” का अनुवाद “निकाल दे” या “खदेड़ दे” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַאֲשִׁימֵם
  choice: उन्हें दोषी ठहरा
  rationale: हिफ़िल आज्ञार्थक रूप न्यायिक अर्थ देता है—परमेश्वर से उन्हें दोषी मानने या घोषित करने की विनती। यह अनुवाद दंड का स्वरूप अनावश्यक रूप से निश्चित नहीं करता।
- source_word: אֱלֹהִים
  choice: हे परमेश्वर
  rationale: यह प्रार्थना में प्रत्यक्ष संबोधन है; आधुनिक मानक हिन्दी में यह स्वाभाविक और गरिमापूर्ण संबोधन है।
- source_word: יִפְּלוּ
  choice: वे ... गिर पड़ें
  rationale: अपूर्ण क्रिया यहाँ इच्छार्थक विनती का भाव रखती है; इसे भविष्यवाणी के बजाय परमेश्वर से की गई प्रार्थना के रूप में रखा गया है।
- source_word: מִמֹּעֲצוֹתֵיהֶם
  choice: अपनी ही युक्तियों से
  rationale: מוֹעֵצוֹת योजनाओं या युक्तियों को दर्शाता है। हिन्दी का ‘से’ साधन अथवा स्रोत—दोनों की कुछ गुंजाइश रखता है, जबकि ‘ही’ उनके अपने षड्यंत्रों द्वारा उनके पतन की विडंबना उभारता है।
- source_word: בְּרֹב פִּשְׁעֵיהֶם
  choice: उनके बहुत-से अपराधों के कारण
  rationale: בְּ यहाँ कारण व्यक्त करता है और רֹב बहुलता। פֶּשַׁע में अपराध तथा विद्रोह दोनों का नैतिक भार है; निकटवर्ती מָרוּ के लिए ‘विद्रोह’ सुरक्षित रखते हुए यहाँ ‘अपराध’ स्वाभाविक है।
- source_word: הַדִּיחֵמוֹ
  choice: उन्हें दूर कर दे
  rationale: हिफ़िल आज्ञार्थक का अर्थ हटाना, खदेड़ना या निकाल देना हो सकता है। ‘दूर कर दे’ बल को बनाए रखते हुए निर्वासन की किसी विशिष्ट व्यवस्था को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछली विनती का आधार प्रस्तुत करता है।
- source_word: מָרוּ בָךְ
  choice: उन्होंने तेरे विरुद्ध विद्रोह किया है
  rationale: מרה के साथ בְּ परमेश्वर के विरुद्ध सक्रिय विद्रोह व्यक्त करता है; पूर्ण क्रिया को वर्तमान-संबद्ध पूर्ण भाव में स्वाभाविक हिन्दी दी गई है।
theological_decisions:
- issue: न्याय की विनती करने वाली शापात्मक भाषा
  choice: न्याय के लिए सीधे आज्ञार्थक और इच्छार्थक निवेदन बनाए रखे गए हैं।
  alternative: इन्हें केवल भावी घटनाओं की भविष्यवाणी के रूप में प्रस्तुत करना।
  rationale: इब्रानी में परमेश्वर को संबोधित आज्ञार्थक रूप और इच्छार्थक अपूर्ण क्रिया है। इन्हें नरम किए बिना रखना मूल पाठ की प्रार्थनात्मक तीव्रता और धार्मिक तनाव को सुरक्षित रखता है।
- issue: מִן के कारण पतन का संबंध
  choice: ‘अपनी ही युक्तियों से’ द्वारा साधन अथवा स्रोत की संभावित अस्पष्टता रखी गई है।
  alternative: केवल ‘अपनी योजनाओं के कारण’ या केवल ‘अपनी योजनाओं से अलग होकर’ निश्चित करना।
  rationale: पूर्वसर्ग מִן यहाँ स्रोत, अलगाव या कारण/साधन की ओर संकेत कर सकता है। संदर्भ अपने ही षड्यंत्रों से विनाश का भाव देता है, पर व्याकरणिक अस्पष्टता को पादटिप्पणी में स्पष्ट किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, काव्यात्मक और गरिमापूर्ण शैली रखी गई है। परमेश्वर के लिए एकवचन निकट संबोधन ‘तेरे/कर दे’ भजन की सीधी प्रार्थना के अनुरूप है। पंक्ति-विभाजन इब्रानी काव्य के समानांतर विन्यास को उभारता है।
