  - marker: b
    text: या ‘सब बुराई करनेवाले’ अथवा ‘सब अधर्म करनेवाले।’
    reason: lexical_alternative
lexical_decisions:
- source_word: יִתְיַצְּבוּ
  choice: खड़े न रह सकेंगे
  rationale: हित्पएल रूप किसी के सामने खड़े होने या टिके रहने का भाव देता है। यह चयन परमेश्वर की उपस्थिति में बने न रह सकने के भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הוֹלְלִים
  choice: घमण्डी
  rationale: इस रूप का अर्थ आत्मश्लाघी, डींग मारनेवाले या उद्दण्ड लोग है। ‘घमण्डी’ आधुनिक हिन्दी में सहज है और इसके नैतिक भाव को सुरक्षित रखता है।
- source_word: לְנֶגֶד עֵינֶיךָ
  choice: तेरी आँखों के सामने
  rationale: शाब्दिक बिंब को बनाए रखते हुए यह परमेश्वर की दृष्टि और उपस्थिति—दोनों का संकेत देता है।
- source_word: שָׂנֵאתָ
  choice: तू ... घृणा करता है
  rationale: इब्रानी क्रिया स्पष्ट रूप से घृणा करने का अर्थ देती है; इसे ‘विरोध करता है’ जैसे नरम शब्द से नहीं बदला गया।
- source_word: פֹּעֲלֵי אָוֶן
  choice: अनर्थ करनेवालों
  rationale: पदबंध में सक्रिय रूप से אָוֶן करनेवालों का अर्थ है। ‘अनर्थ’ दुष्टता, बुराई और हानिकारक कर्म के अर्थ-क्षेत्र को संक्षेप में व्यक्त करता है।
theological_decisions:
- issue: परमेश्वर की घृणा की प्रत्यक्ष भाषा
  choice: ‘तू सब अनर्थ करनेवालों से घृणा करता है’ को मुख्य पाठ में यथावत् रखा गया।
  alternative: ‘तू उनका विरोध करता है’ या ‘तू उन्हें अस्वीकार करता है।’
  rationale: שָׂנֵאתָ का सीधा अर्थ ‘तू घृणा करता है’ है। पाठ के तीखे धर्मवैचारिक कथन को नरम करना मूल की स्पष्टता को घटाता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ईश्वर को संबोधित करते समय भजन की सीधी वाणी के अनुरूप ‘तू/तेरी’ रखा गया है। मुख्य पाठ में इब्रानी का ठोस ‘आँखों के सामने’ बिंब और घृणा की प्रबल भाषा सुरक्षित रखी गई है।
