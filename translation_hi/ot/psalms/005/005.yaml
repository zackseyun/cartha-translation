  language: hi
  text: घमण्डी[a] लोग तेरी आँखों के सामने खड़े नहीं रह सकेंगे; तू सब कुकर्म करनेवालों[b] से घृणा करता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘डींग मारनेवाले,’ ‘अभिमानी,’ अथवा ‘उद्दण्ड लोग।’
