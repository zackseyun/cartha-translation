lexical_decisions:
- source_word: אֲמָרַי
  choice: मेरी बातों
  rationale: אמר के बहुवचन रूप पर प्रथम पुरुष एकवचन प्रत्यय लगा है। ‘मेरी बातों’ मूल अर्थ को सीधे और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הַאֲזִינָה
  choice: कान लगा
  rationale: אזן का यह विनतीसूचक आज्ञार्थक रूप ध्यानपूर्वक सुनने का आग्रह करता है। ‘कान लगा’ मूल के सजीव मुहावरे और प्रार्थनापूर्ण स्वर को बनाए रखता है।
- source_word: יְהוָה
  choice: हे याहवे
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत नाम יהוה है। सम्बोधन को स्पष्ट करने के लिए ‘हे’ और नाम का निकट देवनागरी लिप्यंतरण ‘याहवे’ रखा गया है।
- source_word: בִּינָה
  choice: समझ
  rationale: בין का आज्ञार्थक रूप केवल सुनने नहीं, बल्कि समझ-बूझकर ग्रहण करने की विनती व्यक्त करता है; इसलिए ‘समझ’ उपयुक्त है।
- source_word: הֲגִיגִי
  choice: मेरी कराह
  rationale: הגיג मन के भीतर के विचार, धीमी बुदबुदाहट या दबे स्वर में निकली व्यथा का संकेत दे सकता है। विलाप की इस प्रार्थना में ‘मेरी कराह’ भावगत बल को व्यक्त करता है, जबकि पादटिप्पणी मूल की अर्थ-व्याप्ति सुरक्षित रखती है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: पद में उपाधि नहीं, चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम सीधे आया है। ‘याहवे’ नाम को उपाधि से बदलने के बजाय उसका निकट लिप्यंतरण प्रस्तुत करता है।
- issue: הֲגִיגִי का भाव
  choice: मेरी कराह
  alternative: मेरे मनन / मेरी बुदबुदाहट
  rationale: शब्द की अर्थ-सीमा आंतरिक मनन से लेकर धीमी ध्वनि तक फैली है। विलाप के संदर्भ में ‘कराह’ चुना गया है, पर अनिश्चितता को पादटिप्पणी में स्पष्ट रखा गया है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण प्रार्थना-भाषा। ‘कान लगा’ मूल इब्रानी मुहावरे की सजीवता रखता है; पंक्ति-विभाजन पद की समानांतर रचना को दिखाता है।
