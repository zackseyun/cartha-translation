lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: संगीत-निर्देशक के लिए
  rationale: भजनों के शीर्षकों में यह रूप संगीत-प्रस्तुति का निर्देशन करने वाले व्यक्ति को दर्शाता है। यह अनुवाद प्रसंग को स्पष्ट करता है और व्यापक ‘प्रधान’ की अपेक्षा अधिक स्वाभाविक है।
- source_word: אֶל
  choice: के अनुसार
  rationale: संगीत-संबंधी शीर्षकों में यह धुन, शैली या वाद्य-विन्यास का संकेत दे सकता है। ‘के अनुसार’ तकनीकी प्रयोग को किसी एक अर्थ तक सीमित किए बिना बनाए रखता है।
- source_word: הַנְּחִילוֹת
  choice: बाँसुरियों
  rationale: यह दुर्लभ संगीत-संबंधी पद संभवतः बाँसुरियों अथवा व्यापक रूप से वायु-वाद्यों को सूचित करता है। मुख्य पाठ में संभावित अर्थ दिया गया है और अनिश्चितता पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: מִזְמוֹר
  choice: भजन
  rationale: यह भजन-संग्रह के शीर्षकों में प्रयुक्त मानक पद है; आधुनिक हिन्दी में ‘भजन’ इसका स्वाभाविक और प्रतिष्ठित समतुल्य है।
- source_word: לְדָוִד
  choice: दाऊद का
  rationale: इब्रानी संबंधसूचक לְ लेखन, समर्पण, संबद्धता या संग्रहगत संबंध दर्शा सकता है। ‘दाऊद का’ सीधे ‘दाऊद द्वारा रचित’ कहने की अपेक्षा इस व्यापकता को बेहतर बनाए रखता है।
