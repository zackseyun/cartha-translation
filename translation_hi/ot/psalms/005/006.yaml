  text: तू झूठ बोलने वालों को नष्ट करता है[a]; याहवे रक्तपाती और कपटी मनुष्य से घृणा करता है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तू झूठ बोलने वालों को नष्ट करेगा।” इब्रानी क्रिया को भविष्यकाल या परमेश्वर के सामान्य कार्य के कथन के रूप में समझा जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “रक्तों और छल का मनुष्य”; यह रक्तपात और कपट से चिह्नित मनुष्य के लिए इब्रानी मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּאַבֵּד
  choice: तू ... नष्ट करता है
  rationale: पिएल रूप परमेश्वर को सीधे संबोधित करते हुए नाश करने का अर्थ देता है। संदर्भ में सामान्यतः होनेवाले कार्य के रूप में वर्तमान काल स्वाभाविक है, यद्यपि भविष्यकाल भी संभव है।
- source_word: דֹּבְרֵי כָזָב
  choice: झूठ बोलनेवालों
  rationale: यह रचना शाब्दिक रूप से ‘झूठ/असत्य बोलनेवाले’ है; चुना हुआ रूप इसकी क्रियात्मकता बनाए रखता है।
- source_word: אִישׁ דָּמִים וּמִרְמָה
  choice: खून बहानेवाले और छल-कपट करनेवाले मनुष्य
  rationale: ‘खूनों का मनुष्य’ हिंसा अथवा रक्तपात से चिह्नित व्यक्ति के लिए इब्रानी मुहावरा है; מִרְמָה छल, कपट या विश्वासघात का बोध कराता है। हिंदी में समानांतर विशेषणात्मक रूप अर्थ को स्पष्ट और स्वाभाविक रखता है।
- source_word: יְתָעֵב
  choice: घृणा करता है
  rationale: पिएल रूप तीव्र नैतिक विरक्ति व्यक्त करता है; ‘घृणा करता है’ आधुनिक हिंदी में प्रबल और गरिमापूर्ण है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ के चतुरक्षरीय व्यक्तिगत नाम को हिंदी में प्रचलित बाइबलीय लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है, किसी उपाधि से नहीं।
theological_decisions:
- issue: תְּאַבֵּד का कालगत अर्थ
  choice: 'सामान्य वर्तमान: ‘नष्ट करता है’'
  alternative: 'भविष्यकाल: ‘नष्ट करेगा’'
  rationale: इब्रानी अपूर्ण क्रिया यहाँ परमेश्वर के सामान्य आचरण अथवा भावी कार्य—दोनों रूपों में समझी जा सकती है। मुख्य पाठ में संदर्भानुकूल सामान्य कथन रखा गया है और विकल्प पादटिप्पणी में सुरक्षित है।
- issue: אִישׁ का लिंग और मुहावरा
  choice: ‘मनुष्य’ को एकवचन में बनाए रखा
  alternative: ‘लोग’ अथवा केवल ‘हिंसक और कपटी जन’
  rationale: मूल में पुल्लिंग एकवचन אִישׁ है। हिंदी ‘मनुष्य’ मूल की एकवचन संरचना बनाए रखता है, जबकि जुड़े पद उसके हिंसक और कपटी चरित्र को बताते हैं।
- issue: ईश्वरीय नाम יְהוָה
  choice: यहोवा
  alternative: याहवे
  rationale: व्यक्तिगत ईश्वरीय नाम को उपाधि ‘प्रभु’ से बदलने के बजाय हिंदी पाठकों में स्थापित रूप ‘यहोवा’ में लिप्यंतरित किया गया है।
translation_notes:
  register: आधुनिक मानक हिंदी, एकवचन प्रत्यक्ष संबोधन ‘तू’ के साथ, क्योंकि भजनकार परमेश्वर को संबोधित कर रहा है। भाषा काव्यात्मक किंतु सामान्य पाठक के लिए स्पष्ट रखी गई है; ‘खून बहानेवाले’ और ‘छल-कपट करनेवाले’ मूल मुहावरे को सहज हिंदी में व्यक्त करते हैं।
