source:
  edition: WLC
  text: יְהוָ֤ה נְחֵ֬/נִי בְ/צִדְקָתֶ֗/ךָ לְמַ֥עַן שׁוֹרְרָ֑/י הושר לְ/פָנַ֣/י דַּרְכֶּֽ/ךָ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/005/008.yaml
  text: O Yahweh[a], lead me in your righteousness because of my enemies[b]; make your way straight before me.
translation:
  language: hi
  text: हे याहवे, मेरे शत्रुओं[a] के कारण अपनी धार्मिकता में मेरी अगुवाई कर; मेरे सामने अपना मार्ग सीधा[b] कर।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद ‘मेरी घात में लगे लोगों’ भी हो सकता है; इब्रानी शब्द में शत्रुतापूर्वक निगाह रखने वालों का भाव हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘समतल’।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: हे यहवे
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम को ‘यहवे’ के रूप में रखा गया है; सीधे संबोधन को स्वाभाविक बनाने के लिए ‘हे’ जोड़ा गया है।
- source_word: נְחֵנִי
  choice: मेरी अगुवाई कर
  rationale: नחה का अर्थ मार्ग दिखाते हुए आगे ले चलना है; प्रार्थना के संदर्भ में ‘मेरी अगुवाई कर’ स्पष्ट और स्वाभाविक है।
- source_word: בְצִדְקָתֶךָ
  choice: अपनी धार्मिकता में
  rationale: यह रूप ב उपसर्ग की क्षेत्र, आधार या मानक संबंधी व्यापकता को यथासंभव बनाए रखता है और परमेश्वर की खरी नैतिकता की ओर संकेत करता है।
- source_word: לְמַעַן שׁוֹרְרָי
  choice: मेरे शत्रुओं के कारण
  rationale: לְמַעַן यहाँ विरोधियों से उत्पन्न परिस्थिति को कारण के रूप में प्रस्तुत करता है। שׁוֹרְרָי में घात लगाकर देखने वाले विरोधियों का विशेष भाव हो सकता है, जिसे पादटिप्पणी में रखा गया है।
- source_word: הושר
  choice: सीधा कर
  rationale: ישר के हिफ़ील रूप का अर्थ सीधा, समतल या सुगम करना हो सकता है। ‘सीधा कर’ मार्ग के रूपक और नैतिक दिशा—दोनों को बनाए रखता है।
- source_word: לְפָנַי דַּרְכֶּךָ
  choice: मेरे सामने अपना मार्ग
  rationale: यह अनुवाद मूल के ‘मेरे सामने’ और ‘तेरा मार्ग’ को स्वाभाविक हिन्दी शब्दक्रम में सुरक्षित रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहवे
  alternative: यहोवा
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम सीधे आया है। उसका लिप्यंतरण नाम की विशिष्टता को बनाए रखता है, बिना उसे किसी उपाधि से बदलने के।
- issue: צְדָקָה का आशय
  choice: धार्मिकता
  alternative: न्याय
  rationale: यहाँ प्रार्थी परमेश्वर के खरे चरित्र और उसके अनुरूप मार्गदर्शन की विनती करता है। ‘धार्मिकता’ शब्द केवल न्यायिक कार्रवाई तक अर्थ को सीमित नहीं करता।
- issue: הושר דַּרְכֶּךָ में मार्ग का रूपक
  choice: अपना मार्ग सीधा कर
  alternative: अपना मार्ग समतल कर
  rationale: ‘सीधा’ मूल क्रिया के प्रमुख अर्थ को व्यक्त करता है और जीवन की सही दिशा के रूपक को खुला रखता है; ‘समतल’ भी संभव है।
translation_notes:
  register: भाषा प्रार्थनापूर्ण, काव्यात्मक और आधुनिक मानक हिन्दी में है। ‘अपनी धार्मिकता में’ मूल की अर्थगत व्यापकता को बचाने के लिए रखा गया है, जबकि पादटिप्पणियाँ शत्रुओं और मार्ग को सीधा/समतल करने की शब्दगत संभावनाएँ स्पष्ट करती हैं।
