source:
  edition: WLC
  text: יְֽהוָ֗ה בֹּ֭קֶר תִּשְׁמַ֣ע קוֹלִ֑/י בֹּ֥קֶר אֶֽעֱרָךְ לְ֝/ךָ֗ וַ/אֲצַפֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/005/003.yaml
  text: Yahweh[a], in the morning you hear my voice[b]; in the morning I lay my request before you and watch expectantly.
translation:
  language: hi
  text: 'याहवे, भोर को आप मेरी आवाज़ सुनते हैं;

    भोर को मैं अपनी विनती आपके सामने रखता हूँ[a]

    और आशा लगाए राह देखता हूँ।[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं आपके लिए क्रम से प्रस्तुत करता हूँ।” इब्रानी क्रिया का अर्थ क्रम से लगाना या प्रस्तुत करना है; यहाँ उसका कर्म स्पष्ट नहीं है, पर संदर्भ में संभवतः प्रार्थना या विनती अभिप्रेत है।
    reason: lexical_alternative
  - marker: b
    text: या, “और आशा से प्रतीक्षा करता हूँ।” इब्रानी क्रिया देखने, राह देखने या आशापूर्वक प्रतीक्षा करने का भाव दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: בֹּקֶר
  choice: भोर को
  rationale: कालवाचक प्रयोग को स्वाभाविक हिन्दी में व्यक्त किया गया है और मूल की पुनरावृत्ति दोनों स्थानों पर रखी गई है।
- source_word: תִּשְׁמַע
  choice: आप ... सुनते हैं
  rationale: अपूर्ण क्रिया यहाँ वर्तमान, अभ्यस्त या आश्वस्त प्रत्याशा का भाव दे सकती है; वर्तमान काल इस काव्यात्मक प्रार्थना के विश्वासपूर्ण संबोधन के अनुकूल है।
- source_word: קוֹלִי
  choice: मेरी आवाज़
  rationale: यह सीधा अर्थ है; ‘मेरी पुकार’ कहना मूल से अधिक तीव्र और व्याख्यात्मक होता।
- source_word: אֶעֱרָךְ לְךָ
  choice: मैं अपनी विनती आपके सामने रखता हूँ
  rationale: क्रिया का मूल भाव क्रम से लगाने या प्रस्तुत करने का है। प्रार्थना के संदर्भ में निहित कर्म को ‘अपनी विनती’ से स्पष्ट किया गया है, जबकि ‘आपके सामने’ हिन्दी में प्रस्तुति का स्वाभाविक मुहावरा है।
- source_word: וַאֲצַפֶּה
  choice: और आशा लगाए राह देखता हूँ
  rationale: यह देखने, चौकसी से प्रतीक्षा करने और आशापूर्वक परिणाम की राह देखने—इन जुड़े हुए भावों को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चतुरक्षरी व्यक्तिगत नाम सीधे प्रयुक्त है। उसका लिप्यंतरण नाम को सुरक्षित रखता है और उसे किसी उपाधि से नहीं बदलता।
- issue: תִּשְׁמַע का कालगत भाव
  choice: आप ... सुनते हैं
  alternative: आप ... सुनेंगे
  rationale: इब्रानी अपूर्ण क्रिया भविष्य या वर्तमान/अभ्यस्त आश्वासन दोनों व्यक्त कर सकती है। वर्तमान रूप चुना गया है, पर इससे भविष्यगत प्रत्याशा का निषेध अभिप्रेत नहीं है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी अपनाई गई है। परमेश्वर के संबोधन में आदरसूचक ‘आप’ रखा गया है। काव्यात्मक बल बनाए रखने के लिए ‘भोर को’ की पुनरावृत्ति सुरक्षित है।
