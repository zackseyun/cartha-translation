  yaml_path: translation/ot/psalms/005/002.yaml
  text: Pay attention to the sound of my cry for help[a], my King and my God, for to you I pray.
translation:
  language: hi
  text: मेरी सहायता की पुकार पर ध्यान दे, हे मेरे राजा और मेरे परमेश्वर, क्योंकि मैं तुझसे प्रार्थना करता हूँ।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं तुझसे प्रार्थना करूँगा।” हिब्रू क्रियारूप प्रसंग के अनुसार वर्तमान, जारी या भावी क्रिया व्यक्त कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקְשִׁיבָה
  choice: ध्यान दे
  rationale: यह קשׁב का आज्ञार्थक रूप है और केवल सुनने नहीं, ध्यानपूर्वक सुनने की विनती व्यक्त करता है। आधुनिक हिन्दी में ‘ध्यान दे’ स्वाभाविक और सशक्त है।
- source_word: לְקוֹל שַׁוְעִי
  choice: मेरी सहायता की पुकार पर
  rationale: קוֹל का शाब्दिक अर्थ ‘स्वर/आवाज़’ है और שַׁוְעָה संकट में सहायता के लिए की गई पुकार को सूचित करता है। हिन्दी में ‘पुकार की आवाज़’ अनावश्यक रूप से भारी होता; यह चयन पूरे पदबंध का अर्थ स्वाभाविक ढंग से देता है।
- source_word: מַלְכִּי וֵאלֹהָי
  choice: हे मेरे राजा और मेरे परमेश्वर
  rationale: दोनों संबोधन सुरक्षित रखे गए हैं। ‘हे’ हिन्दी में प्रत्यक्ष संबोधन को स्पष्ट और प्रार्थनात्मक बनाता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह विनती का कारण प्रस्तुत करता है; ‘क्योंकि’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: אֵלֶיךָ
  choice: तुझी से
  rationale: प्रार्थना की दिशा और संबोधित परमेश्वर पर बल को हिन्दी में ‘तुझी से’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֶתְפַּלָּל
  choice: मैं ... प्रार्थना करता हूँ
  rationale: यह פלל का हित्पएल, प्रथम पुरुष एकवचन अपूर्ण रूप है। प्रसंग में वर्तमान अथवा जारी प्रार्थना स्वाभाविक है, जबकि भावी अर्थ की वास्तविक संभावना पाद-टिप्पणी में रखी गई है।
theological_decisions:
- issue: परमेश्वर को राजकीय उपाधि से संबोधन
  choice: हे मेरे राजा और मेरे परमेश्वर
  alternative: मेरे राजा, मेरे परमेश्वर
  rationale: मूल पाठ परमेश्वर को राजा और परमेश्वर दोनों रूपों में सीधे संबोधित करता है। दोनों उपाधियाँ बिना किसी अतिरिक्त सैद्धान्तिक व्याख्या के सुरक्षित रखी गई हैं।
- issue: אֶתְפַּלָּל का काल/पक्ष
  choice: मैं तुझी से प्रार्थना करता हूँ
  alternative: मैं तुझी से प्रार्थना करूँगा
  rationale: हिब्रू अपूर्ण रूप वर्तमान, जारी, अभ्यस्त अथवा भावी क्रिया व्यक्त कर सकता है। तत्काल विनती के प्रसंग में वर्तमान मुख्य पाठ में स्वाभाविक है; भावी विकल्प पाद-टिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और प्रत्यक्ष प्रार्थनात्मक शैली रखी गई है। ‘तू’ के आदरसूचक धार्मिक रूप ‘तुझी/करता हूँ’ के प्रयोग से निकटता और गरिमा दोनों व्यक्त होते हैं; शब्दशः ‘मेरी पुकार की आवाज़’ के स्थान पर स्वाभाविक हिन्दी पदबंध चुना गया है।
