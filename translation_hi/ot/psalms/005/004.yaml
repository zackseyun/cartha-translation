  yaml_path: translation/ot/psalms/005/004.yaml
  text: For you are not a God who delights in wickedness[a]; evil may not dwell with you.
translation:
  language: hi
  text: क्योंकि तू ऐसा परमेश्वर नहीं है जो दुष्टता में प्रसन्न होता है; बुराई[a] तेरे साथ नहीं ठहर सकती।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “कोई दुष्ट व्यक्ति तेरे साथ नहीं ठहर सकता।”
    reason: इब्रानी רָע का अर्थ यहाँ भाववाचक ‘बुराई’ या व्यक्तिगत ‘दुष्ट व्यक्ति’ दोनों हो सकता है।
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले पद की प्रार्थना का कारण बताता है और भजन के तर्कपूर्ण प्रवाह को स्वाभाविक रूप से जोड़ता है।
- source_word: אֵל
  choice: परमेश्वर
  rationale: यह सीधे संबोधन में इस्राएल के परमेश्वर के लिए प्रयुक्त है; आधुनिक हिन्दी में ‘परमेश्वर’ स्पष्ट और गरिमापूर्ण है।
- source_word: חָפֵץ
  choice: प्रसन्न होता
  rationale: यह केवल इच्छा करने के बजाय किसी बात में आनंद या रुचि लेने का भाव व्यक्त करता है; ‘प्रसन्न होता’ सहज हिन्दी में उस भाव को संप्रेषित करता है।
- source_word: רֶשַׁע
  choice: दुष्टता
  rationale: यह नैतिक बुराई या दोष को सूचित करने वाली भाववाचक संज्ञा है; ‘दुष्टता’ उसके नैतिक अर्थ को बनाए रखती है।
- source_word: יְגֻרְךָ
  choice: तेरे साथ निवास नहीं कर सकती
  rationale: גור का मूल भाव परदेशी अथवा अतिथि के रूप में ठहरना या निवास करना है। यहाँ निषेध केवल भविष्यवाणी नहीं, बल्कि परमेश्वर की उपस्थिति में बुराई के लिए स्थान न होने को व्यक्त करता है।
- source_word: רָע
  choice: बुराई
  rationale: यह विशेषण संज्ञा के रूप में ‘बुराई’ अथवा ‘दुष्ट व्यक्ति’ दोनों अर्थ दे सकता है। पिछले खंड की ‘दुष्टता’ के समानांतर भाववाचक अर्थ मुख्य पाठ में उपयुक्त है, जबकि व्यक्तिगत अर्थ पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: रָע को भाववाचक ‘बुराई’ माना जाए या व्यक्तिगत ‘दुष्ट व्यक्ति’
  choice: बुराई
  alternative: दुष्ट व्यक्ति / बुरा मनुष्य
  rationale: इब्रानी रूप दोनों अर्थों की अनुमति देता है। ‘दुष्टता’ के साथ समानांतरता भाववाचक अनुवाद का समर्थन करती है, जबकि अगला पद दुष्ट लोगों की ओर स्पष्ट रूप से बढ़ता है। इसलिए मुख्य पाठ में ‘बुराई’ रखा गया और व्यक्तिगत अर्थ पादटिप्पणी में दिया गया, ताकि स्रोत की वास्तविक अस्पष्टता बनी रहे।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी अपनाई गई है। परमेश्वर को संबोधित करने के लिए काव्यात्मक और निकट संबंध सूचित करने वाला एकवचन ‘तू/तेरे’ रखा गया है। वाक्य की इब्रानी समानांतरता और संक्षिप्तता यथासंभव सुरक्षित रखी गई है।
