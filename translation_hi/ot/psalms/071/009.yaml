base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/009.yaml
  text: Do not cast me off in the time of old age[a]; when my strength fails[c][b], do not forsake me.
translation:
  language: hi
  text: मुझे बुढ़ापे के समय न त्याग[a]; जब मेरा बल चुक जाए[b], तब मुझे न छोड़।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘मुझे दूर न फेंक।’ हिब्रू क्रिया में किसी को फेंक देने, ठुकराने या त्याग देने का भाव हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘जब मेरी शक्ति समाप्त हो जाए।’
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּשְׁלִיכֵנִי
  choice: मुझे त्याग न दे
  rationale: हिफ़ील रूप में क्रिया किसी को दूर फेंक देने, ठुकराने या त्याग देने का भाव रखती है। हिंदी में ‘त्याग न दे’ प्रार्थना की गरिमा और अस्वीकार किए जाने का आशय स्वाभाविक रूप से व्यक्त करता है।
- source_word: לְעֵת זִקְנָה
  choice: बुढ़ापे के समय
  rationale: עֵת समय या अवस्था और זִקְנָה बुढ़ापे को दर्शाता है; यह पदबंध हिब्रू की कालगत सूक्ष्मता को बनाए रखता है।
- source_word: כִּכְלוֹת
  choice: जब ... चुक जाए
  rationale: כלה का यह रूप क्षीण होकर समाप्त होने की अवस्था बताता है और כִּ यहाँ कालगत अर्थ में ‘जब’ है। ‘चुक जाए’ बल के समाप्त हो जाने को सहज हिंदी में व्यक्त करता है।
- source_word: כֹּחִי
  choice: मेरा बल
  rationale: כֹּחַ का सामान्य अर्थ बल, शक्ति या सामर्थ्य है। बुढ़ापे के संदर्भ में ‘मेरा बल’ संक्षिप्त और स्वाभाविक है।
- source_word: תַּעַזְבֵנִי
  choice: मुझे न छोड़
  rationale: עזב का अर्थ छोड़ना, परित्याग करना या त्याग देना हो सकता है। पहले खंड के ‘त्याग’ की अनावश्यक पुनरावृत्ति से बचते हुए ‘न छोड़’ मूल निवेदन को स्पष्ट रखता है।
- source_word: אַל
  choice: न दे / न छोड़
  rationale: אַל अपूर्ण क्रिया के साथ निषेध अथवा अत्यावश्यक नकारात्मक विनती व्यक्त करता है; हिंदी में ‘न’ इसका स्वाभाविक प्रार्थनात्मक समतुल्य है।
theological_decisions:
- issue: बुढ़ापे और परमेश्वर की उपस्थिति से संबंधित विनती का स्वरूप
  choice: बुढ़ापे में बल चुकने पर परमेश्वर से त्यागे या छोड़े न जाने की सीधी विनती
  alternative: सामान्य दुःख में सहायता की विनती, जिसमें बुढ़ापे पर विशेष बल न हो
  rationale: मूल पाठ स्पष्ट रूप से बुढ़ापे के समय और बल चुकने को जोड़ता है। अनुवाद इसी ठोस निर्भरता को रखता है और इससे आगे कोई सिद्धान्तगत दावा नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण प्रार्थनात्मक शैली। एकवचन परमेश्वर-संबोधन के अनुरूप निकट और काव्यात्मक क्रियारूप ‘दे’ तथा ‘छोड़’ रखे गए हैं।
