  text: For you are my hope[a], Lord Yahweh[c][b], my confidence from my youth.
translation:
  language: hi
  text: 'क्योंकि, हे प्रभु याहवे[a], आप ही मेरी आशा हैं,

    मेरी युवावस्था से ही आप मेरा भरोसा[b] हैं।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी में ‘अदोनाय याहवे’: उपाधि ‘प्रभु’ के साथ परमेश्वर का नाम ‘याहवे’।'
    reason: lexical_alternative
  - marker: b
    text: या ‘मेरा विश्वास’।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह आसपास की प्रार्थना या विनती का आधार बताता है; ‘क्योंकि’ इसके कारणसूचक बल को स्पष्ट रखता है।
- source_word: אַתָּה
  choice: आप ही
  rationale: इब्रानी में स्वतंत्र सर्वनाम विशेष बल देता है। परमेश्वर के सीधे संबोधन में आदरसूचक ‘आप’ और बलसूचक ‘ही’ स्वाभाविक हैं।
- source_word: תִקְוָתִי
  choice: मेरी आशा
  rationale: संज्ञा आशा या अपेक्षा को व्यक्त करती है; प्रार्थना के संदर्भ में ‘मेरी आशा’ सहज और सटीक है।
- source_word: אֲדֹנָי יְהוִה
  choice: हे प्रभु यहवे
  rationale: אֲדֹנָי को संबोधन में ‘हे प्रभु’ और יהוה को व्यक्तिगत ईश्वरीय नाम ‘यहवे’ के रूप में रखा गया है, जिससे उपाधि और नाम दोनों सुरक्षित रहते हैं।
- source_word: מִבְטַחִי
  choice: मेरा भरोसा
  rationale: यह उस व्यक्ति या आधार को दर्शाता है जिस पर विश्वास और निर्भरता रखी जाती है। ‘मेरा भरोसा’ आधुनिक हिन्दी में स्वाभाविक है और ‘मेरी आशा’ के समानांतर रहता है।
- source_word: מִנְּעוּרָי
  choice: मेरी युवावस्था से ही
  rationale: מן आरंभ-बिंदु बताता है; ‘से ही’ युवावस्था से लगातार बने भरोसे का भाव सहज रूप में व्यक्त करता है।
theological_decisions:
- issue: אֲדֹנָי के साथ יהוה का अनुवाद
  choice: हे प्रभु यहवे
  alternative: हे प्रभु परमेश्वर
  rationale: मूल पाठ में प्रभु की उपाधि और יהוה नाम दोनों अलग-अलग उपस्थित हैं। ‘हे प्रभु यहवे’ इस भेद को छिपाए बिना सीधे सुरक्षित रखता है।
- issue: परमेश्वर को ‘भरोसा’ कहने की संज्ञात्मक संरचना
  choice: मेरा भरोसा
  alternative: जिस पर मैंने भरोसा रखा है
  rationale: मूल में क्रियात्मक व्याख्या के बजाय संज्ञात्मक विधान है। काव्यात्मक हिन्दी में इसे बनाए रखने से यह खुला रहता है कि परमेश्वर भरोसे का आधार भी हैं और वह व्यक्ति भी जिस पर भरोसा किया जाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में आदरसूचक संबोधन रखा गया है। पंक्तियों का काव्यात्मक समानांतर रूप और दूसरी पंक्ति की मूल संज्ञात्मक संक्षिप्तता सुरक्षित रखी गई है।
