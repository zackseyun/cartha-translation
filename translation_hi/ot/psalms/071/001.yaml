source:
  edition: WLC
  text: בְּ/ךָֽ יְהוָ֥ה חָסִ֑יתִי אַל אֵב֥וֹשָׁה לְ/עוֹלָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/001.yaml
  text: In you[a], O Yahweh, I have taken refuge; let me never be put to shame.
translation:
  language: hi
  text: हे याहवे[a], मैंने तुझमें शरण ली है; मुझे कभी लज्जित न होने दे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में परमेश्वर का व्यक्तिगत नाम יהוה (YHWH) है; हिंदी में इसे प्रायः “यहोवा” या परंपरागत रूप से “प्रभु” भी लिखा जाता है।
    reason: ईश्वरीय नाम के लिप्यंतरण और प्रचलित वैकल्पिक रूपों को स्पष्ट करना।
lexical_decisions:
- source_word: בְּ/ךָ
  choice: तुझमें
  rationale: בְּ के साथ द्वितीय पुरुष एकवचन प्रत्यय यहाँ भरोसे और संरक्षण के रूपकात्मक आश्रय को दर्शाता है। ‘तुझमें’ मूल बिंब को बिना अतिरिक्त बल जोड़े सुरक्षित रखता है।
- source_word: יְהוָה
  choice: हे याहवे
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत नाम יהוה सीधे प्रयुक्त है। ‘हे’ संबोधन को स्वाभाविक हिंदी में व्यक्त करता है और ‘याहवे’ नाम का लिप्यंतरण है।
- source_word: חָסִיתִי
  choice: मैंने … शरण ली है
  rationale: חסה का अर्थ शरण लेना या आश्रय पाना है। पूर्ण रूप ऐसे किए हुए कार्य को व्यक्त करता है जिसका प्रभाव वर्तमान में बना है; हिंदी का ‘ली है’ इस पक्ष को स्वाभाविक ढंग से दर्शाता है।
- source_word: אַל אֵבוֹשָׁה
  choice: मुझे … लज्जित न होने दे
  rationale: אַל के साथ प्रथम पुरुष रूप नकारात्मक प्रार्थना या विनती व्यक्त करता है। यह हिंदी प्रयोग केवल भीतरी संकोच नहीं, बल्कि अपमानित या निराश सिद्ध होने की व्यापक धारणा भी रख सकता है।
- source_word: לְ/עוֹלָם
  choice: कभी
  rationale: नकारात्मक वाक्य में לְעוֹלָם का स्वाभाविक हिंदी अर्थ ‘कभी नहीं’ है; यहाँ ‘न होने दे’ के साथ ‘कभी’ वही अर्थ देता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: इब्रानी पाठ में उपाधि नहीं, चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम है। ‘याहवे’ उसका व्यापक रूप से स्वीकृत विद्वत्तापूर्ण लिप्यंतरण है; पादटिप्पणी पाठकों को पारंपरिक हिंदी रूपों से संबंध समझाती है।
translation_notes:
  register: भाषा आधुनिक, सहज और प्रार्थनामय है। ‘तुझमें’ तथा ‘न होने दे’ आत्मीय एकवचन संबोधन को बनाए रखते हैं, जबकि ‘लज्जित’ भजन की गरिमा और सार्वजनिक अपमान/निराशा की अर्थ-छाया को सुरक्षित रखता है।
