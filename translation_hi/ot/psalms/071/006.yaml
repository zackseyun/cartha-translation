base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/006.yaml
  text: Upon you I have leaned from the womb; from my mother’s inward parts you are the one who brought me out[a]. In you is my praise continually.
translation:
  language: hi
  text: गर्भ से ही मैं आप पर निर्भर रहा हूँ; मेरी माँ की देह के भीतर से मुझे बाहर निकालने वाले आप ही हैं[a]। आप में मेरी स्तुति सदा बनी रहती है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या अधिक सहज रूप में, “मेरी माँ के गर्भ से मुझे बाहर निकालने वाले आप ही हैं।” इब्रानी में यहाँ “भीतरी अंग” के अर्थ वाला शब्द है, जो पिछली पंक्ति के “गर्भ” शब्द से भिन्न है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלֶיךָ נִסְמַכְתִּי
  choice: मैं आप पर निर्भर रहा हूँ
  rationale: सמך के निफ़अल रूप में सहारे के लिए किसी पर टिकने और भरोसा रखने का भाव है। ‘निर्भर रहा हूँ’ आधुनिक हिन्दी में स्वाभाविक है और परमेश्वर पर आजीवन आश्रय का अर्थ बनाए रखता है।
- source_word: מִבֶּטֶן
  choice: गर्भ ही से
  rationale: בטן यहाँ गर्भ को सूचित करता है। ‘ही’ आरम्भिक समय से चली आ रही निर्भरता पर स्वाभाविक बल देता है।
- source_word: מִמְּעֵי אִמִּי
  choice: मेरी माँ की देह के भीतर से
  rationale: מֵעֶה का मूल अर्थ भीतरी अंग है। यह चयन हिन्दी में बोधगम्य रहते हुए पिछले शब्द ‘गर्भ’ से इब्रानी की शब्दगत भिन्नता को कुछ हद तक सुरक्षित रखता है।
- source_word: אַתָּה גוֹזִי
  choice: मुझे बाहर निकालने वाले आप ही हैं
  rationale: स्वतंत्र सर्वनाम אַתָּה के बल को ‘आप ही’ से व्यक्त किया गया है। גוֹזִי को जन्म के प्रसंग में माँ की देह से बाहर लाने की परमेश्वर की क्रिया के रूप में लिया गया है।
- source_word: בְּךָ תְהִלָּתִי תָמִיד
  choice: मैं निरन्तर आपकी स्तुति करता हूँ
  rationale: शाब्दिक संरचना हिन्दी में अस्वाभाविक होती। क्रियात्मक वाक्य मूल के निरन्तर, परमेश्वर-केंद्रित स्तुति के अर्थ को स्पष्ट और सहज रूप में व्यक्त करता है।
theological_decisions:
- issue: जन्म के बिंब में परमेश्वर की भूमिका
  choice: परमेश्वर को भजनकार को उसकी माँ की देह से बाहर लाने वाला बताया गया है।
  alternative: परमेश्वर को केवल जन्म से भजनकार का पालन और सहारा करने वाला समझना।
  rationale: इब्रानी जन्म के समय बाहर लाने की सक्रिय भूमिका का बिंब प्रस्तुत करती है। अनुवाद इस बिंब को बनाए रखता है, पर इससे आगे कोई विशिष्ट धर्मसैद्धान्तिक निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सम्मानसूचक ‘आप’ का प्रयोग किया गया है। भाषा सरल, काव्यात्मक और गरिमापूर्ण रखी गई है; अत्यधिक संस्कृतनिष्ठ शरीर-विज्ञान संबंधी शब्दावली से बचते हुए इब्रानी की शब्दगत विविधता को पादटिप्पणी में स्पष्ट किया गया है।
