  yaml_path: translation/ot/psalms/071/019.yaml
  text: And your righteousness[a], O God, reaches to the heights—you who have done great things. O God[b], who is like you?
translation:
  language: hi
  text: हे परमेश्वर, तेरी धार्मिकता[a] ऊँचाइयों तक पहुँचती है—तू जिसने महान काम किए हैं। हे परमेश्वर, तेरे समान कौन है?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘न्याय।’ इब्रानी शब्द צְדָקָה संदर्भ के अनुसार धार्मिकता या न्याय का भाव व्यक्त कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצִדְקָתְךָ
  choice: तेरी धार्मिकता
  rationale: צְדָקָה यहाँ परमेश्वर के नैतिक रूप से सही और न्यायपूर्ण चरित्र तथा कार्यों की व्यापक धारणा व्यक्त करती है। ‘धार्मिकता’ उस व्यापकता को बनाए रखती है; ‘न्याय’ संभव विकल्प है।
- source_word: אֱלֹהִים
  choice: हे परमेश्वर
  rationale: दोनों स्थानों पर यह प्रत्यक्ष संबोधन है। आधुनिक, गरिमापूर्ण हिन्दी में ‘हे परमेश्वर’ स्वाभाविक रूप से संबोधन को स्पष्ट करता है।
- source_word: עַד מָרוֹם
  choice: ऊँचाइयों तक पहुँचती है
  rationale: शाब्दिक स्थानिक रूपक ‘ऊँचाई तक’ को सुरक्षित रखते हुए यह हिन्दी में स्वाभाविक है और מָרוֹם को अनावश्यक रूप से केवल ‘स्वर्ग’ नहीं ठहराता।
- source_word: אֲשֶׁר עָשִׂיתָ גְדֹלוֹת
  choice: तूने महान काम किए हैं
  rationale: सापेक्ष वाक्यांश को सहज हिन्दी में स्वतंत्र कथन के रूप में रखा गया है; इससे परमेश्वर के महान कार्यों पर काव्यात्मक बल बना रहता है।
- source_word: מִי כָמוֹךָ
  choice: तेरे समान कौन है?
  rationale: यह परमेश्वर की अतुलनीयता व्यक्त करने वाला आलंकारिक प्रश्न है; अनुवाद उसका संक्षिप्त और प्रभावी रूप बनाए रखता है।
theological_decisions:
- issue: परमेश्वर के लिए צְדָקָה का अनुवाद
  choice: धार्मिकता
  alternative: न्याय
  rationale: संदर्भ परमेश्वर के चरित्र और महान कार्यों की व्यापक स्तुति करता है, केवल न्यायिक क्रिया की नहीं। इसलिए ‘धार्मिकता’ मुख्य पाठ में है, जबकि ‘न्याय’ को वास्तविक अर्थ-विकल्प के रूप में पादटिप्पणी में रखा गया है।
- issue: עַד מָרוֹם में ऊँचाई का आशय
  choice: ऊँचाइयों तक
  alternative: स्वर्ग तक
  rationale: इब्रानी מָרוֹם ऊँचाई या ऊँचे स्थान को दर्शाता है। मुख्य पाठ स्थानिक रूपक की अस्पष्टता बनाए रखता है और इसे निश्चित रूप से ‘स्वर्ग’ नहीं बनाता।
translation_notes:
  register: आधुनिक मानक हिन्दी, प्रत्यक्ष संबोधन के लिए गरिमापूर्ण ‘हे परमेश्वर’ और निकट संबोधन के लिए ‘तू/तेरी/तेरे’ का प्रयोग। काव्यात्मक ऊँचाई बनाए रखते हुए वाक्यरचना साधारण पाठक के लिए स्पष्ट रखी गई है।
