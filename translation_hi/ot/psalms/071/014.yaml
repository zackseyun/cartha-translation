translation:
  language: hi
  text: 'पर मैं सदा आशा लगाए रहूँगा,

    और तेरी स्तुति और भी अधिक करता जाऊँगा।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: “और मैं तेरी सारी स्तुति में और जोड़ूँगा।” इब्रानी मुहावरा स्तुति को बढ़ाते या उसमें और जोड़ते जाने का चित्र प्रस्तुत करता है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: पर मैं
  rationale: संयोजक और स्वतंत्र सर्वनाम मिलकर पहले कथन के विपरीत वक्ता के दृढ़ रुख पर बल देते हैं। ‘पर मैं’ आधुनिक हिन्दी में इस विरोध और बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: תָּמִיד אֲיַחֵל
  choice: सदा आशा लगाए रहूँगा
  rationale: תָּמִיד निरन्तरता दर्शाता है और יחל का पिएल रूप आशापूर्वक प्रतीक्षा करने का भाव रखता है। ‘आशा लगाए रहूँगा’ भविष्य के संकल्प और लगातार बनी रहने वाली अपेक्षा—दोनों को व्यक्त करता है।
- source_word: וְהוֹסַפְתִּי עַל כָּל תְּהִלָּתֶךָ
  choice: और तेरी स्तुति और भी अधिक करता जाऊँगा
  rationale: יסף על का मुहावरा किसी बात में और जोड़ने या उसे बढ़ाने का भाव देता है। हिन्दी में ‘स्तुति और भी अधिक करता जाऊँगा’ उसी बढ़ती और जारी स्तुति को स्पष्ट तथा स्वाभाविक ढंग से व्यक्त करता है; ‘तेरी’ मूल के द्वितीय पुरुष एकवचन प्रत्यय को बनाए रखता है।
