  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी अपनाई गई है। ‘आशा लगाए रहूँगा’ सामान्य पाठक के लिए स्वाभाविक है और मूल के आशापूर्वक प्रतीक्षा करने वाले भाव को भी सँजोता है। परमेश्वर को सीधे संबोधन के कारण ‘तेरी’ रखा गया है; भाषा न तो अत्यधिक संस्कृतनिष्ठ है, न बोलचाल की अनौपचारिकता लिए हुए।
