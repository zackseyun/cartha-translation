base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/021.yaml
  text: May you increase my greatness and comfort me again[a][b][c].
translation:
  language: hi
  text: आप मेरी महानता बढ़ाएँ[a][b], और मुड़कर[c] मुझे सांत्वना दें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “आप मेरी महानता बढ़ाएँगे और मुड़कर मुझे सांत्वना देंगे।” इब्रानी की अपूर्ण क्रियाएँ काव्यात्मक संदर्भ में भविष्य के कथन या प्रार्थना-कामना—दोनों के रूप में समझी जा सकती हैं।
    reason: alternative_reading
  - marker: b
    text: शाब्दिक रूप से “मेरी महानता”; इसका अर्थ मान, गौरव या गरिमा भी हो सकता है, केवल आकार या विस्तार नहीं।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से “और मुड़ें”; यहाँ आशय संभवतः सांत्वना देने के लिए भजनकार की ओर फिर से मुड़ने का है।
    reason: lexical_alternative
lexical_decisions:
- source_word: תֶּרֶב
  choice: बढ़ाएँ
  rationale: רבה के हिफ़ील रूप का मूल अर्थ ‘बड़ा करना, बढ़ाना’ है। काव्यात्मक प्रार्थना के संदर्भ में अपूर्ण क्रिया को इच्छासूचक निवेदन के रूप में प्रस्तुत करने के लिए आदरसूचक ‘बढ़ाएँ’ स्वाभाविक है।
- source_word: גְּדֻלָּתִי
  choice: मेरा गौरव
  rationale: גְּדוּלָּה महानता, ऊँचे पद, मान या गरिमा को सूचित कर सकता है। ‘मेरा गौरव’ आधुनिक हिन्दी में स्वाभाविक है और केवल आकार या मात्रा की वृद्धि का भ्रामक अर्थ दिए बिना इस व्यापकता को बनाए रखता है।
- source_word: וְתִסֹּב
  choice: और फिर मेरी ओर मुड़कर
  rationale: סבב का मूल बिंब ‘मुड़ना’ है। अगले क्रियापद के साथ यहाँ परमेश्वर के भजनकार की ओर फिर से मुड़कर उसे सांत्वना देने का भाव है; ‘मेरी ओर’ दिशा को स्पष्ट करता है, जबकि ‘मुड़कर’ मूल बिंब को सुरक्षित रखता है।
- source_word: תְּנַחֲמֵנִי
  choice: मुझे सांत्वना दें
  rationale: נחם का पिएल रूप यहाँ ‘सांत्वना देना, ढाढ़स बँधाना’ है। ‘सांत्वना दें’ गरिमापूर्ण और सामान्य आधुनिक हिन्दी है।
theological_decisions:
- issue: अपूर्ण क्रियाओं का भाव
  choice: 'प्रार्थना/कामना के रूप में: ‘आप … बढ़ाएँ … और … सांत्वना दें।’'
  alternative: 'भविष्य के भरोसेमंद कथन के रूप में: ‘आप … बढ़ाएँगे … और … सांत्वना देंगे।’'
  rationale: इब्रानी काव्य में ये अपूर्ण क्रियाएँ भविष्यवाचक कथन या इच्छासूचक प्रार्थना—दोनों हो सकती हैं। निकटवर्ती प्रार्थनात्मक संदर्भ के कारण मुख्य पाठ में निवेदन रखा गया है, और दूसरे संभव अर्थ को पादटिप्पणी में सुरक्षित किया गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। परमेश्वर को संबोधित करने के लिए आदरसूचक ‘आप’ और ‘दें/बढ़ाएँ’ का प्रयोग हुआ है। ‘गौरव’ ने इब्रानी पद के मान, प्रतिष्ठा और महानता संबंधी व्यापक अर्थ को स्वाभाविक हिन्दी में सुरक्षित रखा है।
