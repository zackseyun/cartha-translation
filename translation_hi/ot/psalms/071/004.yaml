source:
  edition: WLC
  text: אֱֽלֹהַ֗/י פַּ֭לְּטֵ/נִי מִ/יַּ֣ד רָשָׁ֑ע מִ/כַּ֖ף מְעַוֵּ֣ל וְ/חוֹמֵץ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/004.yaml
  text: My God[a], rescue me from the hand of the wicked[c][b], from the grasp of the unjust and violent man.
translation:
  language: hi
  text: हे मेरे परमेश्वर[a], मुझे दुष्ट के हाथ से छुड़ा[b], अन्यायी और हिंसक मनुष्य[c] की पकड़ से।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसे केवल ‘मेरे परमेश्वर’ भी अनुवाद किया जा सकता है; ‘हे’ हिन्दी में संबोधन को स्पष्ट करता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘मुझे बचा’।
    reason: lexical_alternative
  - marker: c
    text: या ‘अत्याचारी मनुष्य’ अथवा ‘क्रूर मनुष्य’।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהַי
  choice: हे मेरे परमेश्वर
  rationale: प्रथम पुरुष एकवचन प्रत्यय के साथ यह सीधा संबोधन है। ‘हे मेरे परमेश्वर’ आधुनिक हिन्दी में स्पष्ट, स्वाभाविक और गरिमापूर्ण है।
- source_word: פַּלְּטֵנִי
  choice: मुझे छुड़ा
  rationale: פלט का यह आदेशात्मक रूप संकट से निकालने या बचाने की विनती व्यक्त करता है। ‘छुड़ा’ अगले पदबंधों में निहित किसी की शक्ति और पकड़ से मुक्ति के भाव को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: מִיַּד רָשָׁע
  choice: दुष्ट के हाथ से
  rationale: יד यहाँ शक्ति या नियंत्रण का मुहावरा है। ‘हाथ से’ मूल इब्रानी बिंब को बनाए रखता है और हिन्दी में भी समझ में आता है; רָשָׁע एक दुष्ट व्यक्ति को सूचित करता है।
- source_word: מִכַּף
  choice: की पकड़ से
  rationale: כף का शाब्दिक अर्थ ‘हथेली’ है, पर यहाँ नियंत्रित करने वाली पकड़ अभिप्रेत है। ‘पकड़ से’ अर्थ को स्वाभाविक हिन्दी में स्पष्ट करता है और पिछली पंक्ति के ‘हाथ’ से अनावश्यक पुनरावृत्ति भी टालता है।
- source_word: מְעַוֵּל
  choice: अन्यायी
  rationale: यह עול से बना कृदन्त है और अन्याय या अनुचित काम करने वाले व्यक्ति का वर्णन करता है। ‘अन्यायी’ उसके नैतिक और न्यायिक दोनों पहलुओं को सुरक्षित रखता है।
- source_word: וְחוֹמֵץ
  choice: और हिंसक मनुष्य
  rationale: यह शब्द हिंसा करने वाले, क्रूर अथवा अत्याचारी व्यक्ति को सूचित कर सकता है। ‘हिंसक मनुष्य’ मूल के सक्रिय हिंसात्मक भाव के निकट है; ‘मनुष्य’ एकवचन व्यक्ति को हिन्दी में स्पष्ट करता है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है। काव्यात्मक समान्तरता बनाए रखते हुए पहले पद में मूल का ‘हाथ’ वाला बिंब रखा गया है और दूसरे में כף के नियंत्रण-सूचक अर्थ को ‘पकड़’ से व्यक्त किया गया है। संबोधन और विनती का स्वर गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखा गया है।
