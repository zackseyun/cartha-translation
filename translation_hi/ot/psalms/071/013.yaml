id: PSA.71.13
reference: Psalms 71:13
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: יֵבֹ֣שׁוּ יִכְלוּ֮ שֹׂטְנֵ֪י נַ֫פְשִׁ֥/י יַֽעֲט֣וּ חֶ֭רְפָּה וּ/כְלִמָּ֑ה מְ֝בַקְשֵׁ֗י רָעָתִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/013.yaml
  text: Let those who are hostile to my life be put to shame and come to an end[b][a]; let those who seek my harm be clothed with reproach and disgrace.
translation:
  language: hi
  text: मेरे जीवन[a] के विरोधी लज्जित हों और मिट जाएँ[b]; मेरी हानि चाहनेवाले निन्दा और अपमान ओढ़ लें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘मेरे प्राण’ अथवा ‘मेरे अपने अस्तित्व’; यहाँ इब्रानी शब्द प्रायः व्यक्ति के जीवन या स्वयं व्यक्ति को दर्शाता है, केवल अभौतिक आत्मा को नहीं।
    reason: lexical_alternative
  - marker: b
    text: या ‘समाप्त हो जाएँ’ अथवा ‘नष्ट हो जाएँ।’
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵבֹשׁוּ
  choice: लज्जित हों
  rationale: प्रार्थना-संदर्भ में अपूर्ण क्रिया इच्छा/कामना व्यक्त करती है। ‘लज्जित हों’ परिणाम और अभिशापात्मक प्रार्थना—दोनों को स्वाभाविक हिन्दी में रखता है।
- source_word: יִכְלוּ
  choice: मिट जाएँ
  rationale: כלה यहाँ समाप्त होने, चुक जाने या नष्ट हो जाने का व्यापक भाव देता है। ‘मिट जाएँ’ काव्यात्मक समानांतरता बनाए रखता है, जबकि पादटिप्पणी अन्य सम्भव अर्थ बताती है।
- source_word: שֹׂטְנֵי נַפְשִׁי
  choice: मेरे जीवन के विरोधी
  rationale: שׂטן का कृदन्त रूप सक्रिय विरोध या शत्रुता बताता है। इस प्रसंग में נֶפֶשׁ व्यक्ति के जीवन या स्वयं व्यक्ति को सूचित करता है; इसलिए केवल अमूर्त ‘आत्मा’ कहना भ्रामक हो सकता है।
- source_word: יַעֲטוּ
  choice: ओढ़ लें
  rationale: עטה अपने को किसी वस्तु से लपेटने या उसे वस्त्र की तरह धारण करने का रूपक है। ‘ओढ़ लें’ इस चित्रात्मकता को संक्षिप्त और स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: חֶרְפָּה
  choice: निन्दा
  rationale: यह शब्द सार्वजनिक तिरस्कार और बदनामी का भाव रखता है; ‘निन्दा’ כְלִמָּה से अर्थगत भेद भी बनाए रखता है।
- source_word: וּכְלִמָּה
  choice: और अपमान
  rationale: כְלִמָּה लज्जा और बेइज्जती का परिणाम व्यक्त करता है। ‘अपमान’ निकटार्थी तीव्रता को बनाए रखते हुए पहले आए ‘लज्जित’ की अनावश्यक पुनरावृत्ति से बचता है।
- source_word: מְבַקְשֵׁי רָעָתִי
  choice: मेरी हानि चाहनेवाले
  rationale: कृदन्त और רָעָה का संयोजन वक्ता को हानि पहुँचाने की सक्रिय इच्छा दर्शाता है। यह हिन्दी में संक्षिप्त और स्पष्ट है।
theological_decisions:
- issue: अभिशापात्मक कामनार्थक बल
  choice: क्रियाओं को ‘लज्जित हों’, ‘मिट जाएँ’ और ‘ओढ़ लें’ के रूप में प्रार्थना/कामना माना गया है।
  alternative: 'उन्हें साधारण भविष्यवाणी के रूप में अनूदित करना: ‘वे लज्जित होंगे और मिट जाएँगे।’'
  rationale: भजन की प्रार्थनात्मक-काव्यात्मक पृष्ठभूमि में ये अपूर्ण क्रियाएँ कामनार्थक बल रखती हैं। यह अनुवाद उन्हें अलग भविष्यवाणी बनाने के बजाय परमेश्वर से की गई विनती के रूप में सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, काव्यात्मक और सामान्य पाठक के लिए सुबोध शैली अपनाई गई है। ‘ओढ़ लें’ मूल वस्त्र-रूपक को बनाए रखता है और ‘निन्दा और अपमान’ समानार्थी तीव्रता को स्वाभाविक हिन्दी में व्यक्त करता है।
