  yaml_path: translation/ot/psalms/071/023.yaml
  text: My lips will shout for joy when I sing praise to you[a], and my soul[c][b], which you have redeemed.
translation:
  language: hi
  text: जब मैं आपका गुणगान करूँगा, तब मेरे होंठ आनन्द से जयजयकार करेंगे[a], और मेरा प्राण भी[b], जिसे आपने छुड़ा लिया है[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘आनन्द से गा उठेंगे’; इब्रानी क्रिया उल्लासपूर्ण गायन और आनन्द की ऊँची पुकार—दोनों को व्यक्त कर सकती है।
    reason: lexical_alternative
  - marker: b
    text: या ‘मेरा जीवन’, ‘मेरा अंतर्मन’ अथवा ‘मैं स्वयं’; इब्रानी शब्द नेफ़ेश व्यक्ति के प्राण, जीवन या स्वयं व्यक्ति को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: c
    text: या ‘जिसे आपने छुड़ौती देकर मुक्त किया है’ अथवा ‘जिसका आपने उद्धार किया है’।
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּרַנֵּנָּה
  choice: आनन्द से जयजयकार करेंगे
  rationale: रנן के पिएल रूप में उल्लासपूर्ण पुकार और आनन्दमय गायन—दोनों का भाव हो सकता है। ‘आनन्द से जयजयकार’ उसकी प्रबल, मुखर प्रसन्नता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: שְׂפָתַי
  choice: मेरे होंठ
  rationale: 'शाब्दिक काव्यात्मक बिम्ब को बनाए रखता है: स्तुति वक्ता के होंठों से निकलती है।'
- source_word: כִּי
  choice: जब…तब
  rationale: यहाँ כִּי को स्तुति के अवसर को सूचित करने वाला मानना प्रसंग और काव्यात्मक प्रवाह के अनुकूल है; ‘जब…तब’ हिन्दी में सम्बन्ध स्पष्ट करता है, यद्यपि ‘क्योंकि’ भी सम्भव है।
- source_word: אֲזַמְּרָה
  choice: मैं आपका गुणगान करूँगा
  rationale: זמר का पिएल रूप संगीतपूर्ण स्तुति करने को दर्शाता है। ‘गुणगान’ उपासना का भाव रखते हुए सहज आधुनिक हिन्दी है।
- source_word: לָךְ
  choice: आपका
  rationale: हिन्दी मुहावरे में ‘आपका गुणगान’ स्रोत के ‘आपके लिए/आपको स्तुति गाना’ का स्वाभाविक समतुल्य है।
- source_word: וְנַפְשִׁי
  choice: और मेरा प्राण भी
  rationale: נפשׁ व्यक्ति के प्राण, जीवन, अंतर्मन अथवा स्वयं व्यक्ति को सूचित कर सकता है। ‘प्राण’ काव्यात्मक संक्षिप्तता और व्यापक अर्थ-क्षेत्र को पर्याप्त रूप से बनाए रखता है; ‘भी’ होंठों के साथ समानान्तरता स्पष्ट करता है।
- source_word: פָּדִיתָ
  choice: आपने छुड़ा लिया है
  rationale: פדה मूल्य देकर मुक्त करने, संकट से छुड़ाने या उद्धार करने का अर्थ दे सकता है। ‘छुड़ा लिया’ मुक्ति के मूल भाव को स्पष्ट रखता है और किसी बाद की संकीर्ण धर्मवैज्ञानिक व्याख्या को आरोपित नहीं करता।
theological_decisions:
- issue: उपासना के प्रसंग में פדה का अनुवाद
  choice: छुड़ा लिया है
  alternative: छुड़ाौती देकर मुक्त किया है / उद्धार किया है
  rationale: यह पद परमेश्वर के बचाने वाले कार्य को स्तुति का आधार बनाता है। ‘छुड़ा लिया’ संकट या बन्धन से मुक्ति के अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि ‘छुड़ौती देकर’ उस साधन को आवश्यकता से अधिक स्पष्ट कर सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, काव्यात्मक और श्रद्धापूर्ण शैली अपनाई गई है। परमेश्वर के लिए आदरसूचक ‘आप’ रखा गया है। मूल की समानान्तर रचना—‘मेरे होंठ…और मेरा प्राण भी’—को बनाए रखा गया है; दूसरे खंड में क्रिया का लोप हिन्दी में भी जानबूझकर सुरक्षित है।
