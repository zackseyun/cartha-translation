  text: גַּם לְשׁוֹנִ֗/י כָּל הַ֭/יּוֹם תֶּהְגֶּ֣ה צִדְקָתֶ֑/ךָ כִּי בֹ֥שׁוּ כִֽי חָ֝פְר֗וּ מְבַקְשֵׁ֥י רָעָתִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/024.yaml
  text: My tongue also will speak of your righteousness all day long[a], for those seeking my harm have been put to shame; they have been disgraced.
translation:
  language: hi
  text: मेरी जीभ भी दिन भर तेरी धार्मिकता[a] का बखान करेगी, क्योंकि मेरी हानि चाहने वाले लज्जित हुए हैं; वे अपमानित हुए हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तेरा न्याय।” हिब्रू शब्द धार्मिकता और न्याय, दोनों को सूचित कर सकता है, विशेषकर परमेश्वर के उद्धारकारी न्याय के संदर्भ में।
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: भी
  rationale: पिछले पद की स्तुति को आगे बढ़ाते हुए जीभ को भी उसमें सम्मिलित करता है।
- source_word: לְשׁוֹנִי
  choice: मेरी जीभ
  rationale: वाणी का अमूर्त रूप लेने के बजाय मूल की ठोस काव्यात्मक देह-छवि बनाए रखी गई है।
- source_word: כָּל הַיּוֹם
  choice: दिन भर
  rationale: निरंतर स्तुति के समयगत बल को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: תֶּהְגֶּה
  choice: बखान करेगी
  rationale: הגה धीमे उच्चारण, मनन या कथन को सूचित कर सकता है; यहाँ 'जीभ' कर्ता होने के कारण मुखर, विचारपूर्ण स्तुति उपयुक्त है। 'बखान करेगी' उसी भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: צִדְקָתֶךָ
  choice: तेरी धार्मिकता
  rationale: यह शब्द परमेश्वर की नैतिक धार्मिकता के साथ उसके न्यायपूर्ण और उद्धारकारी समर्थन को भी समेट सकता है; मुख्य पाठ में व्यापक पारंपरिक समतुल्य रखा गया है।
- source_word: כִּי
  choice: क्योंकि
  rationale: भजनकार की स्तुति का कारण स्पष्ट करता है।
- source_word: בֹשׁוּ
  choice: लज्जित हुए हैं
  rationale: हिब्रू सिद्ध पक्ष के वर्तमान परिणाम को व्यक्त करते हुए पराजयजनित लज्जा का भाव रखता है।
- source_word: כִּי חָפְרוּ
  choice: वे अपमानित हुए हैं
  rationale: दूसरा כִּי पहले कथन को पुष्ट या विस्तृत करता है; हिन्दी में उसे अलग संयोजक से बोझिल किए बिना समानांतर वाक्य में व्यक्त किया गया है। חפר सार्वजनिक अपमान और निरादर की निकटवर्ती, पर अलग, छाया रखता है।
- source_word: מְבַקְשֵׁי רָעָתִי
  choice: मेरी हानि चाहने वाले
  rationale: चलती हुई शत्रुतापूर्ण मंशा को संक्षिप्त और सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: भजन के संदर्भ में צִדְקָתֶךָ का अनुवाद
  choice: तेरी धार्मिकता
  alternative: तेरा न्याय
  rationale: मूल पद परमेश्वर की धार्मिकता और उसके न्यायपूर्ण, उद्धारकारी प्रतिपादन—दोनों की ओर संकेत कर सकता है। मुख्य पाठ में व्यापक अर्थ रखा गया है और न्याय का विकल्प टिप्पणी में दिया गया है।
- issue: दूसरे כִּי का संबंध
  choice: स्वतंत्र हिन्दी संयोजक के बिना पुष्टिकारक समानांतर कथन
  alternative: क्योंकि वे अपमानित हुए हैं / निश्चय ही वे अपमानित हुए हैं
  rationale: दोनों כִּי का एक ही ढंग से अनुवाद करने पर हिन्दी असहज होती। मूल की व्याख्यात्मक या प्रबलकारी अस्पष्टता को अत्यधिक निश्चित किए बिना दूसरा परिणाम-सदृश समानांतर वाक्य रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, काव्यात्मक और सामान्य पाठक के लिए सुबोध शैली। भजन में परमेश्वर के लिए प्रचलित एकवचन निकट संबोधन ‘तेरी’ रखा गया है। ‘बखान’ स्तुतिपरक संदर्भ में स्वाभाविक है और הגה के मुखर तथा मननशील आयामों को जोड़ता है।
