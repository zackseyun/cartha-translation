source:
  edition: WLC
  text: אֱֽלֹהִ֗ים לִמַּדְתַּ֥/נִי מִ/נְּעוּרָ֑/י וְ/עַד הֵ֝֗נָּה אַגִּ֥יד נִפְלְאוֹתֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/017.yaml
  text: God[a], you have taught me from my youth, and to this day I declare your wondrous deeds.
translation:
  language: hi
  text: हे परमेश्वर, तूने मुझे मेरी जवानी से सिखाया है, और आज तक मैं तेरे अद्भुत कामों का वर्णन करता हूँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֱלֹהִים
  choice: हे परमेश्वर
  rationale: यहाँ 2 पुल्लिंग एकवचन क्रिया और सर्वनाम के साथ सीधा संबोधन है। आधुनिक गरिमापूर्ण हिन्दी में संबोधन स्पष्ट करने के लिए ‘हे’ स्वाभाविक है; ‘परमेश्वर’ אֱלֹהִים का प्रचलित और स्पष्ट हिन्दी रूप है।
- source_word: לִמַּדְתַּנִי
  choice: तूने मुझे ... सिखाया है
  rationale: पिएल रूप का अर्थ ‘तूने मुझे सिखाया’ है। पूर्ण क्रिया के वर्तमान तक बने प्रभाव को हिन्दी का पूर्ण वर्तमान स्वाभाविक रूप से व्यक्त करता है।
- source_word: מִנְּעוּרָי
  choice: मेरी जवानी से
  rationale: नְעוּרִים युवा अवस्था को सूचित करता है। ‘मेरी जवानी से’ स्रोत के ‘से’ संबंध को सीधे और सहज रूप में रखता है।
- source_word: וְעַד הֵנָּה
  choice: और अब तक
  rationale: यह पदबंध वर्तमान समय-बिंदु तक निरंतरता व्यक्त करता है; ‘अब तक’ संक्षिप्त, स्वाभाविक और स्रोत के निकट है।
- source_word: אַגִּיד
  choice: मैं ... वर्णन करता आया हूँ
  rationale: हिफ़ील क्रिया का मूल भाव बताना या घोषित करना है। प्रसंग में जवानी से अब तक की निरंतर गवाही को ‘वर्णन करता आया हूँ’ हिन्दी में स्वाभाविक ढंग से व्यक्त करता है, यद्यपि इब्रानी अपूर्ण रूप अपने आप निरंतर काल को अनिवार्य नहीं बनाता।
- source_word: נִפְלְאוֹתֶיךָ
  choice: तेरे अद्भुत कामों
  rationale: यह बहुवचन संज्ञा परमेश्वर के आश्चर्यजनक कार्यों को सूचित करती है। ‘अद्भुत काम’ साधारण पाठक के लिए स्पष्ट है और केवल अमूर्त ‘आश्चर्यों’ की अपेक्षा क्रियात्मक भाव को सामने लाता है।
theological_decisions:
- issue: क्या אֱלֹהִים को सीधे संबोधन के रूप में प्रस्तुत किया जाए
  choice: ‘हे परमेश्वर, तूने...’ के रूप में सीधा संबोधन
  alternative: परमेश्वर के विषय में कथन
  rationale: दूसरे पुरुष की क्रिया और अधिकारसूचक प्रत्यय प्रार्थनापूर्ण सीधे संबोधन को पुष्ट करते हैं। इससे कोई अतिरिक्त सांप्रदायिक अर्थ नहीं जोड़ा जाता।
- issue: אַגִּיד के कालगत भाव का हिन्दी रूप
  choice: ‘वर्णन करता आया हूँ’ द्वारा वर्तमान तक चली आ रही घोषणा
  alternative: ‘मैं वर्णन करूँगा’ या ‘मैं वर्णन करता हूँ’
  rationale: इब्रानी अपूर्ण रूप भविष्य, वर्तमान या प्रगतिशील/आदतन भाव ले सकता है। ‘जवानी से’ और ‘अब तक’ वाला संदर्भ जारी गवाही को बल देता है; इसलिए हिन्दी में वर्तमान तक निरंतरता चुनी गई है, बिना इसे केवल भविष्यकाल बनाने के।
translation_notes:
  register: आधुनिक मानक हिन्दी, प्रार्थनापूर्ण और गरिमापूर्ण शैली। ‘तू/तेरे’ निकट, एकवचन दिव्य संबोधन को बनाए रखते हैं; भाषा न अत्यधिक संस्कृतनिष्ठ है, न बोलचाल की।
