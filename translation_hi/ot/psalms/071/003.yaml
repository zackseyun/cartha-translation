source:
  edition: WLC
  text: הֱיֵ֤ה לִ֨/י לְ/צ֥וּר מָע֡וֹן לָ/ב֗וֹא תָּמִ֗יד צִוִּ֥יתָ לְ/הוֹשִׁיעֵ֑/נִי כִּֽי סַלְעִ֖/י וּ/מְצוּדָתִ֣/י אָֽתָּה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/003.yaml
  text: Be for me a rock of refuge[a], to which I may always come; you have commanded salvation for me[b], for you are my crag and my fortress.
translation:
  language: hi
  text: मेरे लिए शरण देने वाली चट्टान हो[a], जहाँ मैं सदा आ सकूँ; तूने मुझे बचाने की आज्ञा दी है[b], क्योंकि तू ही मेरी चट्टान और मेरा गढ़ है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “निवास-स्थान की चट्टान।”
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक अर्थ, “तूने मुझे बचाने की आज्ञा दी है”; या, “तूने मुझे बचाने का विधान किया है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֱיֵה לִי
  choice: मेरे लिए ... बन जा
  rationale: आज्ञार्थक रूप यहाँ परमेश्वर से की गई सीधी विनती है। हिंदी में “बन जा” प्रार्थना की स्वाभाविक निकटता और बल को व्यक्त करता है।
- source_word: לְצוּר מָעוֹן
  choice: शरण की चट्टान
  rationale: צוּר चट्टान का रूपक बनाए रखता है; מָעוֹן मूलतः निवास-स्थान हो सकता है, पर सुरक्षा के प्रसंग में “शरण” स्वाभाविक है। अधिक शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: לָבוֹא תָּמִיד
  choice: जहाँ मैं सदा आ सकूँ
  rationale: स्थानवाचक संबंध को सहज हिंदी में स्पष्ट करता है और תָּמִיד की निरंतरता को “सदा” से व्यक्त करता है।
- source_word: צִוִּיתָ לְהוֹשִׁיעֵנִי
  choice: तूने मुझे बचाने की आज्ञा दी है
  rationale: צוה के स्पष्ट अर्थ “आज्ञा देना” और להושיעני के शाब्दिक अर्थ “मुझे बचाना” दोनों को यथासंभव सीधे और सुबोध रूप में सुरक्षित रखा गया है।
- source_word: סַלְעִי
  choice: मेरी दृढ़ चट्टान
  rationale: סלע के चट्टानी शरण-स्थल के भाव को “दृढ़ चट्टान” व्यक्त करता है और पहले प्रयुक्त צוּר से हल्का भेद भी रखता है।
- source_word: וּמְצוּדָתִי
  choice: और मेरा गढ़
  rationale: מְצוּדָה का अर्थ किला अथवा सुरक्षित गढ़ है; “गढ़” संक्षिप्त, वर्तमान और काव्यात्मक हिंदी है।
- source_word: אָתָּה
  choice: तू ही ... है
  rationale: स्वतंत्र सर्वनाम का बल हिंदी में “ही” द्वारा व्यक्त किया गया है।
theological_decisions:
- issue: צִוִּיתָ לְהוֹשִׁיעֵנִי में परमेश्वर की आज्ञा के बल को बनाए रखना या उसे “ठहराया” कहकर सहज बनाना
  choice: तूने मुझे बचाने की आज्ञा दी है
  alternative: तूने मुझे बचाने का विधान किया है
  rationale: मूल इब्रानी में स्पष्टतः “आज्ञा देना” क्रिया है। इसे बनाए रखने से परमेश्वर के प्रभावशाली आदेश का कथन सुरक्षित रहता है, पर किसी विशिष्ट सिद्धान्त को पाठ में नहीं जोड़ा जाता। वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण प्रार्थना-भाषा। परमेश्वर के लिए एकवचन आत्मीय संबोधन “तू” रखा गया है। चट्टान और गढ़ के मूल काव्यात्मक रूपक सुरक्षित हैं।
