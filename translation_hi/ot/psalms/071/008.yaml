  text: יִמָּ֣לֵא פִ֭/י תְּהִלָּתֶ֑/ךָ כָּל הַ֝/יּ֗וֹם תִּפְאַרְתֶּֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/008.yaml
  text: My mouth will be filled with your praise[b][a], with your splendor all day long.
translation:
  language: hi
  text: मेरा मुँह तेरी स्तुति से भरा रहेगा[a], और दिन भर तेरे वैभव से[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मेरा मुँह तेरी स्तुति से भरा है,” अथवा संभवतः “मेरा मुँह तेरी स्तुति से भरा रहे।” इब्रानी अपूर्ण क्रिया-रूप यहाँ भविष्य, वर्तमान या कामनासूचक भाव दे सकता है।
    reason: alternative_reading
  - marker: b
    text: “वैभव” के लिए “महिमा,” “शोभा” या “प्रताप” भी संभव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יִמָּלֵא
  choice: भरा रहेगा
  rationale: מלא के निफ़ाल अपूर्ण रूप का स्वाभाविक भविष्य/परिणामसूचक भाव व्यक्त करता है और कर्मवाच्य अर्थ बनाए रखता है; काव्य में वर्तमान या कामनासूचक अर्थ भी संभव है।
- source_word: פִי
  choice: मेरा मुँह
  rationale: इब्रानी का प्रत्यक्ष और स्वाभाविक काव्यात्मक मुहावरा सुरक्षित रखा गया है।
- source_word: תְּהִלָּתֶךָ
  choice: तेरी स्तुति
  rationale: द्वितीय पुरुष एकवचन प्रत्यय सहित संज्ञा का अर्थ परमेश्वर की स्तुति, अर्थात उसकी ओर निर्देशित या उसके विषय में प्रशंसा, है।
- source_word: כָּל הַיּוֹם
  choice: दिन भर
  rationale: यह आधुनिक हिन्दी में कालावधि का सहज और संक्षिप्त रूप है।
- source_word: תִּפְאַרְתֶּךָ
  choice: तेरे वैभव
  rationale: תפארת के सौन्दर्य, महिमा और ऐश्वर्य संबंधी अर्थ-क्षेत्र को 'वैभव' स्वाभाविक काव्यात्मक हिन्दी में व्यक्त करता है।
- source_word: תִּפְאַרְתֶּךָ (लुप्त क्रिया सहित समानांतर पद)
  choice: तेरे वैभव का वर्णन करेगा
  rationale: दूसरे पद में इब्रानी क्रिया व्यक्त नहीं है। हिन्दी में अर्थ स्पष्ट और प्रवाहपूर्ण बनाने के लिए 'वर्णन करेगा' की पूर्ति की गई है, जो मुँह और स्तुति के संदर्भ से निहित वाणी को व्यक्त करती है।
theological_decisions:
- issue: יִמָּלֵא का काल अथवा विधि
  choice: 'भविष्यसूचक कथन: ''भरा रहेगा'''
  alternative: 'वर्तमान कथन: ''भरा है''; अथवा प्रार्थनात्मक/कामनासूचक: ''भरा रहे'''
  rationale: अपूर्ण रूप भविष्यसूचक कथन के रूप में सहज है, पर इब्रानी कविता में वर्तमान या कामनासूचक सूक्ष्मता निर्णायक रूप से बाहर नहीं की जा सकती; इसलिए विकल्प पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक, सरल और गरिमापूर्ण हिन्दी; परमेश्वर के लिए निकटता दर्शाने वाला एकवचन 'तू/तेरा' रखा गया है। काव्यात्मक समानांतरता को स्वाभाविक हिन्दी में व्यक्त करने हेतु दूसरे पद की लुप्त क्रिया को 'वर्णन करेगा' से स्पष्ट किया गया है।
