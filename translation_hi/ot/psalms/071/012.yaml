source:
  edition: WLC
  text: אֱ֭לֹהִים אַל תִּרְחַ֣ק מִמֶּ֑/נִּי אֱ֝לֹהַ֗/י לְ/עֶזְרָ֥תִ/י חיש/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/012.yaml
  text: God[a], do not be far from me; my God, hurry to help me.
translation:
  language: hi
  text: हे परमेश्वर, मुझसे दूर न रह; हे मेरे परमेश्वर, मेरी सहायता के लिए जल्दी कर।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֱלֹהִים
  choice: हे परमेश्वर
  rationale: यह सीधे संबोधन में प्रयुक्त है। आधुनिक गरिमामय हिन्दी में ‘हे’ संबोधन को स्वाभाविक रूप से स्पष्ट करता है, और ‘परमेश्वर’ इस्राएल के परमेश्वर के लिए प्रचलित तथा बोधगम्य पद है।
- source_word: אַל תִּרְחַק מִמֶּנִּי
  choice: मुझसे दूर न रह
  rationale: निषेधात्मक विनती और רחק के स्थानिक/संबंधपरक रूपक—‘दूर होना/रहना’—दोनों को सीधे और स्वाभाविक ढंग से सुरक्षित रखता है।
- source_word: אֱלֹהַי
  choice: हे मेरे परमेश्वर
  rationale: प्रथम पुरुष एकवचन प्रत्यय के व्यक्तिगत संबंध को ‘मेरे’ से और प्रत्यक्ष पुकार को ‘हे’ से व्यक्त किया गया है।
- source_word: לְעֶזְרָתִי
  choice: मेरी सहायता करने के लिए
  rationale: शाब्दिक अर्थ ‘मेरी सहायता के लिए/को’ है; हिन्दी में शीघ्र आने की विनती के साथ यह रूप अर्थ को स्पष्ट और सहज रखता है।
- source_word: חִישָׁה
  choice: शीघ्र आ
  rationale: यह शीघ्रता की आज्ञार्थक पुकार है। केवल ‘शीघ्र कर’ हिन्दी में अस्पष्ट होता; संदर्भ में सहायता के लिए निकट आने का भाव निहित होने के कारण ‘आ’ स्वाभाविक पूरक है, यद्यपि वह इब्रानी में अलग शब्द के रूप में नहीं है।
theological_decisions:
- issue: दोहराए गए ईश्वरीय संबोधनों का अनुवाद
  choice: हे परमेश्वर ... हे मेरे परमेश्वर
  alternative: परमेश्वर ... मेरे परमेश्वर
  rationale: इब्रानी में दोनों पद सीधे संबोधन हैं। हिन्दी में ‘हे’ न तो अनिवार्य है, न अर्थ में नया सिद्धांत जोड़ता है; यहाँ यह प्रार्थना की तात्कालिक पुकार को स्पष्ट और गरिमामय बनाता है।
- issue: חִישָׁה में निहित गति का लक्ष्य
  choice: शीघ्र आ
  alternative: शीघ्रता कर / मेरी सहायता के लिए जल्दी कर
  rationale: मूल क्रिया मुख्यतः शीघ्रता की मांग करती है और ‘आना’ स्पष्ट रूप से लिखा नहीं है। फिर भी पिछले वाक्य ‘दूर न रह’ और ‘मेरी सहायता के लिए’ के कारण हिन्दी में ‘आ’ प्रसंगानुकूल निहित भाव को व्यक्त करता है, बिना किसी विशिष्ट धार्मिक व्याख्या को थोपे।
translation_notes:
  register: आधुनिक मानक हिन्दी, प्रार्थनात्मक और गरिमामय शैली। वाक्य संक्षिप्त और तात्कालिक रखा गया है। ‘हे’ सामान्य बातचीत की अपेक्षा कुछ ऊँचा काव्यात्मक स्वर देता है, जो भजन की प्रत्यक्ष पुकार के अनुकूल है।
