  text: לֵ֭/אמֹר אֱלֹהִ֣ים עֲזָב֑/וֹ רִֽדְפ֥וּ וְ֝/תִפְשׂ֗וּ/הוּ כִּי אֵ֥ין מַצִּֽיל־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/011.yaml
  text: saying[a], “God has forsaken him; pursue and seize him, for there is no one to rescue him.”
translation:
  language: hi
  text: वे कहते हैं, “परमेश्वर ने उसे छोड़ दिया है; उसका पीछा करो और उसे पकड़ लो, क्योंकि उसे बचाने वाला कोई नहीं है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֵאמֹר
  choice: वे कहते हैं
  rationale: यह infinitive construct उद्धृत वाणी का परिचय देता है। हिन्दी में प्रसंगानुसार बहुवचन कर्ता को स्पष्ट करके “वे कहते हैं” स्वाभाविक है।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: एकवचन क्रिया עֲזָבוֹ के साथ यह इस्राएल के परमेश्वर के लिए प्रयुक्त एकवचन दैवी पद है।
- source_word: עֲזָבוֹ
  choice: ने उसे छोड़ दिया है
  rationale: Qal पूर्ण क्रिया वर्तमान परिणाम वाली पूरी हो चुकी क्रिया व्यक्त करती है। “छोड़ दिया है” आधुनिक हिन्दी में त्याग देने का गंभीर भाव स्वाभाविक रूप से रखता है।
- source_word: רִדְפוּ
  choice: उसका पीछा करो
  rationale: बहुवचन आज्ञार्थक रूप शत्रुतापूर्ण पीछा करने की सीधी आज्ञा देता है।
- source_word: וְתִפְשׂוּהוּ
  choice: और उसे पकड़ लो
  rationale: תפשׂ का अर्थ थामना या पकड़ लेना है; “पकड़ लो” सीधा है और “बंदी बना लो” जैसी अतिरिक्त विशिष्टता नहीं जोड़ता।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछली आज्ञाओं का कारण प्रस्तुत करता है।
- source_word: אֵין מַצִּיל
  choice: उसे बचाने वाला कोई नहीं है
  rationale: אֵין अनस्तित्व और מַצִּיל बचाने वाले व्यक्ति को व्यक्त करता है; यह हिन्दी रूप दोनों तत्वों को स्पष्ट और स्वाभाविक ढंग से रखता है।
theological_decisions:
- issue: शत्रुओं का यह दावा कि परमेश्वर ने भजनकार को त्याग दिया है
  choice: परमेश्वर ने उसे छोड़ दिया है
  alternative: परमेश्वर ने उसे त्याग दिया है
  rationale: इसे उद्धृत शत्रु-वाणी के रूप में रखा गया है, परमेश्वर द्वारा वास्तविक त्याग की कथावाचक पुष्टि के रूप में नहीं। “छोड़ दिया है” मूल की तीव्रता और धार्मिक तनाव को बनाए रखता है, पर उसे सिद्धांतगत निष्कर्ष में नहीं बदलता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और मौखिक उद्धरण में स्वाभाविक। “त्याग दिया” संभव है, पर “छोड़ दिया है” सामान्य पाठक के लिए अधिक सहज है और मूल अर्थ को पर्याप्त रूप से व्यक्त करता है।
