  yaml_path: translation/ot/psalms/071/007.yaml
  text: I have become like a portent to many[a], but you are my strong refuge.
translation:
  language: hi
  text: मैं बहुतों के लिए एक विस्मयकारी चिन्ह[a] के समान हो गया हूँ, परन्तु तू मेरा शक्तिशाली शरणस्थान है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “आश्चर्य,” “शकुन,” अथवा “विस्मय की वस्तु।”
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּמוֹפֵת
  choice: एक अद्भुत चिन्ह के समान
  rationale: מוֹפֵת का अर्थ चिन्ह, आश्चर्य या विस्मयकारी शकुन हो सकता है; उपसर्ग כְּ को ‘के समान’ से व्यक्त किया गया है। स्वाभाविक हिन्दी वाक्य में ‘एक अद्भुत चिन्ह ... बन गया’ यही तुलनात्मक भाव संक्षेप में पहुँचाता है, जबकि पादटिप्पणी इसकी व्यापक अर्थ-सीमा सुरक्षित रखती है।
- source_word: הָיִיתִי
  choice: मैं ... बन गया हूँ
  rationale: היה के प्रथम पुरुष एकवचन पूर्ण रूप को ऐसी वर्तमान दशा के रूप में प्रस्तुत किया गया है जो पहले के अनुभव से उत्पन्न हुई और अब भी बनी हुई है।
- source_word: לְרַבִּים
  choice: बहुतों के लिए
  rationale: לְ यहाँ उन अनेक लोगों को सूचित करता है जिनके लिए भजनकार एक असाधारण चिन्ह बन गया है।
- source_word: מַחֲסִי
  choice: मेरा ... शरणस्थान
  rationale: מַחֲסֶה सुरक्षा और आश्रय के स्थान का बोध कराता है; ‘शरणस्थान’ हिन्दी में इस रूपक को स्पष्ट और संक्षिप्त रखता है।
- source_word: עֹז
  choice: दृढ़
  rationale: עֹז का मूल भाव सामर्थ्य या शक्ति है। ‘दृढ़ शरणस्थान’ हिन्दी में מַחֲסִי עֹז के शाब्दिक ‘मेरी सामर्थ्य की शरण’ को स्वाभाविक विशेषणात्मक रूप में व्यक्त करता है।
theological_decisions:
- issue: भजनकार की सार्वजनिक दशा के संबंध में מוֹפֵת की अर्थ-छाया
  choice: भजनकार बहुतों के सामने एक असाधारण और विस्मयकारी चिन्ह है; यह तय नहीं किया गया कि वह मुख्यतः शुभ आश्चर्य है या अशुभ शकुन।
  alternative: इसे केवल सकारात्मक आश्चर्य, केवल अशुभ शकुन, अथवा मात्र विस्मय की वस्तु समझना।
  rationale: इब्रानी शब्द में चिन्ह, आश्चर्य और शकुन की अर्थ-छायाएँ हैं। मुख्य पाठ का ‘अद्भुत चिन्ह’ और पादटिप्पणी इन संभावनाओं को खुला रखते हैं तथा प्रसंग की अस्पष्टता को किसी एक धर्मवैचारिक अर्थ में सीमित नहीं करते।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य पाठकों के लिए सुबोध काव्यात्मक गद्य। परमेश्वर के लिए ‘तू’ भजन की सीधी, निकट संबोधन-शैली को बनाए रखता है; ‘परन्तु’ विरोध को स्पष्ट करता है।
