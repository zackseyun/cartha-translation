source:
  edition: WLC
  text: גַּם אֲנִ֤י אוֹדְ/ךָ֣ בִ/כְלִי נֶבֶל֮ אֲמִתְּ/ךָ֪ אֱלֹ֫הָ֥/י אֲזַמְּרָ֣ה לְ/ךָ֣ בְ/כִנּ֑וֹר קְ֝ד֗וֹשׁ יִשְׂרָאֵֽל־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/022.yaml
  text: I also will praise you with the harp for your faithfulness[a], my God; I will make music to you with the lyre[c][b], Holy One of Israel.
translation:
  language: hi
  text: मैं भी वीणा बजाकर आपकी विश्वासयोग्यता[a] के कारण आपकी स्तुति करूँगा, हे मेरे परमेश्वर; मैं किन्नोर[b] पर आपके लिए संगीत बजाऊँगा, हे इस्राएल के पवित्र परमेश्वर!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “आपकी सच्चाई।” इब्रानी शब्द सत्य और विश्वासयोग्यता—दोनों अर्थ दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ प्रयुक्त दोनों प्राचीन तंत्री वाद्यों की ठीक पहचान और उनके बीच का अंतर निश्चित नहीं है। पहले वाद्य को परंपरागत रूप से “वीणा” कहा गया है; “किन्नोर” दूसरे इब्रानी वाद्य-नाम का लिप्यंतरण है।
    reason: cultural_note
lexical_decisions:
- source_word: גַּם אֲנִי
  choice: मैं भी
  rationale: גַּם के साथ स्वतंत्र सर्वनाम निरंतरता और बल दोनों देता है; ‘मैं भी’ स्वाभाविक हिंदी में इन्हें बनाए रखता है।
- source_word: אוֹדְךָ
  choice: आपकी स्तुति करूँगा
  rationale: ידה का हिफ़ील उपासना-संदर्भ में स्तुति या धन्यवाद व्यक्त करता है; संगीतमय समानांतर पंक्ति के कारण ‘स्तुति’ उपयुक्त है।
- source_word: בִכְלִי נֶבֶל
  choice: वीणा बजाकर
  rationale: כְּלִי को נֶבֶל विशिष्ट करता है। ‘वीणा’ पारंपरिक और सुबोध सन्निकट नाम है, जबकि प्राचीन वाद्य की ठीक पहचान अनिश्चित है।
- source_word: אֲמִתְּךָ
  choice: आपकी विश्वासयोग्यता के लिए
  rationale: אֱמֶת सत्य और विश्वसनीयता/विश्वासयोग्यता दोनों व्यक्त कर सकता है। यहाँ परमेश्वर की स्तुति के आधार के रूप में संबंधपरक अर्थ ‘विश्वासयोग्यता’ अधिक स्वाभाविक है; ‘सच्चाई’ को पादटिप्पणी में रखा गया है।
- source_word: אֱלֹהָי
  choice: हे मेरे परमेश्वर
  rationale: संबोधन और प्रथम पुरुष संबंध दोनों स्पष्ट रूप से व्यक्त किए गए हैं।
- source_word: אֲזַמְּרָה לְךָ
  choice: मैं आपके लिए संगीत करूँगा
  rationale: זמר का पिएल रूप गाने या वाद्य के साथ स्तुतिमय संगीत करने को दर्शा सकता है; वाद्य के स्पष्ट उल्लेख के कारण यह अनुवाद व्यापक संगीतमय अर्थ बचाता है।
- source_word: בְכִנּוֹר
  choice: किन्‍नर बजाकर
  rationale: כִּנּוֹר को लिप्यंतरित करने से नֶבֶל से उसका भेद सुरक्षित रहता है और किसी अनिश्चित आधुनिक वाद्य से उसकी पक्की पहचान नहीं की जाती।
- source_word: קְדוֹשׁ יִשְׂרָאֵל
  choice: हे इस्राएल के पवित्र परमेश्वर
  rationale: यह परमेश्वर का उपाधिस्वरूप सीधा संबोधन है। हिंदी में अर्थ स्पष्ट रखने के लिए ‘परमेश्वर’ की पूर्ति की गई है।
theological_decisions:
- issue: परमेश्वर के संबंध में אֱמֶת का अर्थ
  choice: विश्वासयोग्यता
  alternative: सच्चाई
  rationale: प्रसंग परमेश्वर के भरोसेमंद चरित्र और उद्धारकारी कार्यों की स्तुति करता है, इसलिए ‘विश्वासयोग्यता’ संबंधपरक भाव को अच्छी तरह व्यक्त करती है। फिर भी इब्रानी शब्द में ‘सच्चाई’ का वास्तविक अर्थ भी है, जिसे पादटिप्पणी में सुरक्षित रखा गया है।
- issue: קְדוֹשׁ יִשְׂרָאֵל में निहित पद की हिंदी अभिव्यक्ति
  choice: इस्राएल के पवित्र परमेश्वर
  alternative: इस्राएल के पवित्र जन
  rationale: हिंदी में ‘पवित्र जन’ मानवीय व्यक्ति का भ्रम दे सकता है; ‘परमेश्वर’ संबोधित सत्ता की पहचान स्पष्ट करता है, यद्यपि वह इब्रानी में निहित है।
translation_notes:
  register: आधुनिक मानक हिंदी में आदरसूचक ‘आप’ का प्रयोग किया गया है। भाषा काव्यात्मक किंतु सहज रखी गई है। दोनों प्राचीन वाद्यों के अलग इब्रानी नामों को अलग रखा गया है; अनिश्चित वाद्य-पहचान पादटिप्पणी में स्पष्ट की गई है।
