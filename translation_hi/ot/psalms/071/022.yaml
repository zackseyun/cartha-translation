review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately preserves the emphatic “I also,” direct address, praise, God’s faithfulness/truth, and the two distinct instruments. However, “किन्नर” is not a safe Hindi name for כִּנּוֹר: it ordinarily denotes a mythological celestial musician (and has other current associations), rather than an instrument. “किन्नोर” is a clearer transliteration of the Hebrew instrument name. The revised wording also renders the causal/praiseworthy force of אֲמִתֶּךָ more idiomatically as “के कारण.”'
  naturalness: Most of the draft is natural modern Hindi. “किन्नर बजाकर” is misleading and unnatural in this context. “किन्नोर पर आपके लिए संगीत बजाऊँगा” is clear, idiomatic enough for elevated biblical poetry, and retains the musical sense of זמר.
  terminology: “वीणा” is a reasonable conventional approximation for נֶבֶל, provided the uncertainty is noted. “किन्नोर” should replace “किन्नर” to distinguish the second ancient instrument without falsely identifying it with a modern instrument. “इस्राएल के पवित्र परमेश्वर” adequately conveys the divine title קְדוֹשׁ יִשְׂרָאֵל; “परमेश्वर” makes explicit in Hindi what is contextually inherent in the title.
  issues:
  - severity: high
    issue: “किन्नर” is used as the name of the instrument כִּנּוֹר.
    rationale: In contemporary Hindi, “किन्नर” normally refers to a celestial musician in traditional mythology, not to a stringed instrument. This produces a materially misleading reading. “किन्नोर,” a transliteration of the Hebrew name, safely preserves the distinction and uncertainty.
  - severity: low
    issue: “आपकी विश्वासयोग्यता के लिए” is less idiomatic as the ground for praise.
    rationale: “आपकी विश्वासयोग्यता के कारण” naturally expresses that God’s faithfulness is the reason or basis for the praise, while preserving the selected lexical sense.
