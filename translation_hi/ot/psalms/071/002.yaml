  yaml_path: translation/ot/psalms/071/002.yaml
  text: In your righteousness rescue me and deliver me[a]; incline your ear to me and save me.
translation:
  language: hi
  text: अपनी धार्मिकता के कारण मुझे बचा और छुड़ा ले[a]; मेरी ओर कान झुका और मेरा उद्धार कर।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपनी धार्मिकता के आधार पर मुझे बचा और छुड़ा ले”; अथवा “अपने न्याय के द्वारा मुझे बचा और छुड़ा ले।”
    reason: בְּ उपसर्ग ‘के द्वारा’ या आधार के अर्थ का बोध दे सकता है; צְדָקָה का अर्थ ‘धार्मिकता’ के साथ ‘न्याय’ भी हो सकता है।
lexical_decisions:
- source_word: בְּצִדְקָתְךָ
  choice: अपनी धार्मिकता के कारण
  rationale: בְּ को यहाँ आधार/कारण के अर्थ में व्यक्त किया गया है। ‘धार्मिकता’ परमेश्वर के खरे और विश्वासयोग्य चरित्र का व्यापक भाव बनाए रखती है; ‘न्याय’ भी संभव अर्थ है।
- source_word: תַּצִּילֵנִי
  choice: मुझे बचा
  rationale: נצל के हिफ़ील रूप का अर्थ संकट से बचाना है। यह सहज हिन्दी है और अगले समानार्थी क्रियापद से कुछ भिन्नता रखती है।
- source_word: וּתְפַלְּטֵנִי
  choice: और छुड़ा ले
  rationale: פלט के पिएल रूप में बच निकलने योग्य बनाने या सुरक्षित छुड़ाने का भाव है; ‘छुड़ा ले’ इस सूक्ष्मता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הַטֵּה
  choice: लगा
  rationale: कान के साथ נטה ध्यानपूर्वक सुनने का मुहावरा है। ‘अपना कान मेरी ओर लगा’ मूल बिंब को बनाए रखते हुए हिन्दी में समझने योग्य है।
- source_word: אָזְנְךָ
  choice: अपना कान
  rationale: मूल का ठोस शारीरिक बिंब रखा गया है, जो ध्यान देने की प्रार्थना व्यक्त करता है।
- source_word: וְהוֹשִׁיעֵנִי
  choice: और मेरा उद्धार कर
  rationale: ישע के हिफ़ील का मूल भाव बचाना/उद्धार करना है। ‘उद्धार कर’ पहले ‘बचा’ से शब्दगत भिन्नता और व्यापक धार्मिक अनुगूँज दोनों बनाए रखता है।
theological_decisions:
- issue: परमेश्वर से विनती में צְדָקָה का अनुवाद
  choice: धार्मिकता
  alternative: न्याय
  rationale: यहाँ शब्द परमेश्वर के खरे, न्यायपूर्ण और विश्वासयोग्य चरित्र को सूचित कर सकता है। मुख्य पाठ में ‘धार्मिकता’ व्यापक अर्थ बनाए रखती है, जबकि ‘न्याय’ की वास्तविक संभावना पाद-टिप्पणी में सुरक्षित है।
- issue: בְּ उपसर्ग का संबंध
  choice: के कारण
  alternative: में / के द्वारा
  rationale: यह उपसर्ग साधन, आधार या क्षेत्र का बोध करा सकता है। प्रार्थना में उद्धार के आधार के रूप में परमेश्वर की धार्मिकता का भाव स्वाभाविक है, पर अन्य संभावनाएँ पाद-टिप्पणी में दी गई हैं।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और प्रार्थनात्मक हिन्दी। समानार्थी हिब्रू क्रियाओं को ‘बचा’, ‘छुड़ा ले’ और ‘उद्धार कर’ से अलग-अलग व्यक्त किया गया है; कान लगाने का काव्यात्मक बिंब सुरक्षित रखा गया है।
