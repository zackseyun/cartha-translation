  text: פִּ֤/י יְסַפֵּ֬ר צִדְקָתֶ֗/ךָ כָּל הַ/יּ֥וֹם תְּשׁוּעָתֶ֑/ךָ כִּ֤י לֹ֖א יָדַ֣עְתִּי סְפֹרֽוֹת׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/015.yaml
  text: My mouth will recount your righteousness and your salvation all day long[b][a], for I do not know their number.
translation:
  language: hi
  text: मेरा मुँह दिन भर तेरी धार्मिकता[a] और तेरे उद्धार का वर्णन करेगा, क्योंकि मैं उनकी संख्या नहीं जानता[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तेरे न्याय” अथवा “तेरे धर्ममय कार्य”।
    reason: lexical_alternative
  - marker: b
    text: अर्थात परमेश्वर के धर्ममय और उद्धारकारी कार्य इतने अधिक हैं कि भजनकार उन्हें गिन नहीं सकता।
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּי
  choice: मेरा मुँह
  rationale: इब्रानी का मूर्त रूप बनाए रखते हुए वाणी को स्तुति के साधन के रूप में प्रमुखता देता है।
- source_word: יְסַפֵּר
  choice: वर्णन करेगा
  rationale: पिएल रूप विस्तार से सुनाने या बयान करने का भाव देता है; यह स्वाभाविक हिन्दी में आगे आने वाली गिनती की धारणा से भी जुड़ता है।
- source_word: צִדְקָתֶךָ
  choice: तेरी धार्मिकता
  rationale: एकवचन भाववाचक संज्ञा का सीधा और गरिमापूर्ण अनुवाद है; न्याय और धर्ममय कार्यों का संभावित अर्थ टिप्पणी में सुरक्षित है।
- source_word: כָּל הַיּוֹם
  choice: दिन भर
  rationale: निरंतर अवधि के लिए सहज आधुनिक हिन्दी अभिव्यक्ति।
- source_word: תְּשׁוּעָתֶךָ
  choice: तेरे उद्धार
  rationale: भजन-साहित्य में परमेश्वर द्वारा बचाए जाने का व्यापक और प्रचलित धार्मिक पद है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह निरंतर वर्णन करने का कारण प्रस्तुत करता है और कारणात्मक संबंध को स्पष्ट रखता है।
- source_word: לֹא יָדַעְתִּי
  choice: मैं ... नहीं जानता
  rationale: इब्रानी सिद्ध रूप प्रसंग में वर्तमान ज्ञान-अभाव को व्यक्त करता है, जिसे हिन्दी वर्तमान काल स्वाभाविक ढंग से बताता है।
- source_word: סְפֹרוֹת
  choice: उनकी गिनती
  rationale: बहुवचन का आशय संख्या या गणना से है; प्रसंग में यह परमेश्वर की धार्मिकता और उद्धार की अभिव्यक्तियों के अगणित होने की ओर संकेत करता है।
theological_decisions:
- issue: צִדְקָתֶךָ को भाववाचक गुण के रूप में या धर्ममय/न्यायपूर्ण कार्यों के रूप में प्रस्तुत करना
  choice: मुख्य पाठ में “तेरी धार्मिकता”
  alternative: “तेरा न्याय” अथवा “तेरे धर्ममय कार्य”
  rationale: इब्रानी में एकवचन भाववाचक संज्ञा है। “धार्मिकता” मूल तनाव को बनाए रखती है, जबकि भजनों में इसके भीतर परमेश्वर के न्यायपूर्ण और उद्धारकारी कार्य भी समाहित हो सकते हैं।
- issue: סְפֹרוֹת का संबंध किससे है
  choice: “उनकी गिनती” को परमेश्वर की धार्मिकता और उद्धार की अभिव्यक्तियों से संबंधित समझना
  alternative: “गिनने की विधि” या सामान्यतः “संख्याएँ”
  rationale: निकटवर्ती दोनों विषयों और स्तुति के प्रसंग में अगणित धर्ममय तथा उद्धारकारी कार्यों का संकेत सबसे संगत है, पर व्याकरणिक संक्षिप्तता को टिप्पणी में स्पष्ट किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज भक्ति-काव्य शैली रखी गई है। परमेश्वर के लिए निकटतासूचक एकवचन “तेरी/तेरे” भजन की सीधी संबोधन-शैली को बनाए रखता है।
