- source_word: נוֹעֲצוּ
  choice: सलाह करते हैं
  rationale: יעץ का निफ़अल रूप परस्पर विचार-विमर्श को दर्शाता है। ‘सलाह करते हैं’ मूल अर्थ को रखता है, जबकि प्रसंग में निहित षड्यंत्र का भाव पाद-टिप्पणी में दिया गया है।
- source_word: יַחְדָּו
  choice: मिलकर
  rationale: यह उनकी समन्वित, सामूहिक कार्रवाई को स्वाभाविक हिंदी में व्यक्त करता है।
