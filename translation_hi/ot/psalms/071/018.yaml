  yaml_path: translation/ot/psalms/071/018.yaml
  text: Even to old age and gray hairs[a], O God, do not forsake me, until I declare your arm to the next generation[b], your might to everyone who is to come.
translation:
  language: hi
  text: बुढ़ापे और सफेद बालों तक भी, हे परमेश्वर, मुझे न त्याग, जब तक कि मैं अगली पीढ़ी को तेरी भुजा[a] और आनेवाले हर एक को तेरा पराक्रम[b] न सुनाऊँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘भुजा’ परमेश्वर की सक्रिय शक्ति या सामर्थ्य का इब्रानी रूपक है।
    reason: lexical_alternative
  - marker: b
    text: या ‘तेरे सामर्थ्यपूर्ण कामों’। इब्रानी शब्द सामर्थ्य और उसके प्रकट कार्यों, दोनों का अर्थ दे सकता है।
    reason: lexical_ambiguity
lexical_decisions:
- source_word: וְגַם עַד זִקְנָה וְשֵׂיבָה
  choice: बुढ़ापे और बाल सफेद होने तक भी
  rationale: ‘तक भी’ प्रार्थना की emphatic continuation को व्यक्त करता है; ‘बाल सफेद होना’ שֵׂיבָה की ठोस वृद्धावस्था-संबंधी छवि बनाए रखता है।
- source_word: אֱלֹהִים
  choice: हे परमेश्वर
  rationale: यह प्रत्यक्ष संबोधन है; ‘हे’ आधुनिक हिन्दी की गरिमापूर्ण प्रार्थना-शैली के अनुकूल है।
- source_word: אַל תַּעַזְבֵנִי
  choice: मुझे न त्याग
  rationale: עזב का अर्थ छोड़ना या त्यागना है; ‘त्याग’ भजन की गंभीर विनती को स्वाभाविक और संक्षिप्त रूप देता है।
- source_word: עַד אַגִּיד
  choice: जब तक कि मैं ... वर्णन न कर दूँ
  rationale: यह परमेश्वर से सहायता जारी रखने की विनती को भावी साक्ष्य देने के लक्ष्य से जोड़ता है; हिन्दी में ‘जब तक ... न कर दूँ’ इस संरचना को स्वाभाविक रूप से व्यक्त करता है।
- source_word: זְרוֹעֲךָ
  choice: तेरी भुजा
  rationale: शाब्दिक देहात्मक रूपक को सुरक्षित रखा गया है; इब्रानी में भुजा परमेश्वर की सक्रिय सामर्थ्य को दर्शाती है।
- source_word: לְדוֹר
  choice: अगली पीढ़ी को
  rationale: संदर्भ में भजनकार के बाद आनेवाली पीढ़ी अभिप्रेत है; यह हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: לְכָל יָבוֹא
  choice: आनेवाले हर एक को
  rationale: כָּל के साथ एकवचन क्रिया सामूहिक अर्थ देती है। यह अनुवाद भावी लोगों की व्यापक परिधि को बनाए रखता है और इसे केवल एक पीढ़ी तक सीमित नहीं करता।
- source_word: גְּבוּרָתֶךָ
  choice: तेरे पराक्रम
  rationale: גְּבוּרָה सामर्थ्य, वीर्य या सामर्थ्यपूर्ण कार्यों के बीच अर्थगत विस्तार रखता है। ‘पराक्रम’ गुण और उसके प्रकट कार्य—दोनों की संभावना को खुला रखता है।
theological_decisions:
- issue: परमेश्वर की ‘भुजा’ को रूपक के रूप में रखना या सीधे ‘सामर्थ्य’ कहना
  choice: मुख्य पाठ में ‘तेरी भुजा’
  alternative: तेरी सामर्थ्य; तेरी शक्ति
  rationale: मूल इब्रानी की देहात्मक काव्य-छवि परमेश्वर की प्रभावी सामर्थ्य व्यक्त करती है। रूपक को बनाए रखने से काव्यात्मक और धर्मवैचारिक बनावट सुरक्षित रहती है, बिना उसे शाब्दिक देहधारण के दावे में बदलने के।
- issue: לְדוֹר ... לְכָל יָבוֹא में भावी श्रोताओं का विस्तार
  choice: ‘अगली पीढ़ी’ से ‘आनेवाले हर एक’ तक विस्तार
  alternative: सभी भावी पीढ़ियों को
  rationale: पद पहले निकटवर्ती अगली पीढ़ी का उल्लेख करता और फिर भावी जनों की व्यापक परिधि तक जाता प्रतीत होता है। दोनों पदबंधों को अलग रखकर मूल की समानांतरता और संभावित विस्तार सुरक्षित रहता है।
- issue: גְּבוּרָה को गुण या सामर्थ्यपूर्ण कार्य मानना
  choice: पराक्रम
  alternative: सामर्थ्य; पराक्रम के काम
  rationale: इब्रानी शब्द सामर्थ्य और उसके वीरतापूर्ण प्रगटीकरण दोनों का बोध करा सकता है। ‘पराक्रम’ इस अर्थगत तनाव को अनावश्यक रूप से किसी एक ओर तय नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी की गरिमापूर्ण प्रार्थना-शैली अपनाई गई है। ‘तेरी/तेरे’ का प्रयोग भजन में परमेश्वर से निकट प्रत्यक्ष संबोधन के लिए किया गया है। वाक्य को सामान्य पाठक के लिए सहज रखते हुए मूल की ‘भुजा’ वाली काव्यात्मक छवि और भावी श्रोताओं की क्रमिक व्यापकता सुरक्षित रखी गई है।
