source:
  edition: WLC
  text: אֲשֶׁ֤ר הראית/נו צָר֥וֹת רַבּ֗וֹת וְ/רָ֫ע֥וֹת תָּשׁ֥וּב תחיי/נו וּֽ/מִ/תְּהֹמ֥וֹת הָ֝/אָ֗רֶץ תָּשׁ֥וּב תַּעֲלֵֽ/נִי׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/020.yaml
  text: You[a], who have made us see many troubles and calamities, will return and revive us[d][c][b]; and from the depths of the earth you will return and bring me up.
translation:
  language: hi
  text: तू, जिसने हमें बहुत-से संकट और विपत्तियाँ दिखाई हैं[a][b], फिर हमें जीवित करेगा[c]; और पृथ्वी की गहराइयों से तू फिर मुझे ऊपर ले आएगा[d]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या “हमें बहुत-से संकट और विपत्तियाँ दिखाईं हैं।” इब्रानी क्रिया कारक रूप में है: “हमें देखने को कराया” या “दिखाया।”'
    reason: lexical_alternative
  - marker: b
    text: “विपत्तियाँ” यहाँ नैतिक बुराइयों के बजाय आपदाओं या क्लेशों को दर्शाता है।
    reason: lexical_alternative
  - marker: c
    text: इब्रानी पाठ में यहाँ “हमें” है, पर पद के अन्त में “मुझे” है।
    reason: textual_feature
  - marker: d
    text: “पृथ्वी की गहराइयाँ” घोर अपमान या मृत्यु के निकट पहुँचने का रूपक हो सकती हैं और कब्र में उतरने की प्रतिध्वनि भी हो सकती हैं।
    reason: cultural_note
lexical_decisions:
- source_word: הראיתנו
  choice: हमें ... दिखाई हैं
  rationale: ראה के हिफ़ील रूप का कारक भाव है—‘देखने दिया/दिखाया।’ ‘दिखाई हैं’ आधुनिक हिन्दी में स्वाभाविक रहते हुए इस भाव को व्यक्त करता है।
- source_word: צָרוֹת רַבּוֹת
  choice: बहुत-से संकट
  rationale: צָרוֹת कठिन परिस्थितियों और क्लेशों को सूचित करता है; רַבּוֹת को यहाँ परिमाणवाचक ‘बहुत-से’ समझना सबसे स्वाभाविक है।
- source_word: וְרָעוֹת
  choice: और विपत्तियाँ
  rationale: इस प्रसंग में רָעוֹת नैतिक बुराई नहीं, बल्कि भोगी गई हानिकारक आपदाओं या क्लेशों को दर्शाता है।
- source_word: תָּשׁוּב תְּחַיֵּנוּ
  choice: फिर हमें जीवन देगा
  rationale: शाब्दिक रूप ‘लौटकर हमें जीवित करेगा’ है; हिन्दी में ‘फिर’ שׁוב के पुनरावृत्ति-भाव को स्वाभाविक ढंग से व्यक्त करता है, जबकि ‘जीवन देगा’ חיה के पुनर्जीवन या जीवन-बहाली के अर्थ को अनावश्यक रूप से शारीरिक पुनरुत्थान तक सीमित नहीं करता।
- source_word: וּמִתְּהֹמוֹת הָאָרֶץ
  choice: और पृथ्वी की गहराइयों से
  rationale: यह मूल स्थानिक बिंब को बनाए रखता है और उसे कब्र, अधोलोक या केवल अपमान में से किसी एक अर्थ तक सीमित नहीं करता।
- source_word: תָּשׁוּב תַּעֲלֵנִי
  choice: तू फिर मुझे ऊपर ले आएगा
  rationale: दूसरे שׁוב को भी ‘फिर’ कहकर काव्यात्मक पुनरावृत्ति रखी गई है; עלה के हिफ़ील का ऊपर लाने वाला स्थानिक भाव स्पष्ट है।
- source_word: נו ... ני
  choice: हमें ... मुझे
  rationale: मसोरेटिक पाठ में बहुवचन प्रथम पुरुष से एकवचन प्रथम पुरुष की ओर जो बदलाव है, उसे समतल किए बिना सुरक्षित रखा गया है।
theological_decisions:
- issue: רָעוֹת को नैतिक ‘बुराइयाँ’ समझना या अनुभव की गई विपत्तियाँ
  choice: अनुभव की गई विपत्तियाँ
  alternative: बुराइयाँ
  rationale: भजन का प्रसंग भोगे हुए क्लेशों का है। ‘विपत्तियाँ’ दुःख की तीव्रता बनाए रखता है, पर परमेश्वर को नैतिक बुराई का कर्ता बताने का अनपेक्षित अर्थ नहीं देता।
- issue: ‘पृथ्वी की गहराइयों’ को स्पष्ट पुनरुत्थान-वचन बनाना
  choice: मूल रूपक को खुला रखना
  alternative: कब्र से जिलाना या शारीरिक पुनरुत्थान स्पष्ट करना
  rationale: यह बिंब अत्यन्त अपमान, मृत्यु के निकट पहुँचने या कब्र-सदृश गहराई से उद्धार की ओर संकेत कर सकता है। मुख्य पाठ किसी एक सम्भावना को अनिवार्य नहीं बनाता।
- issue: תְּחַיֵּנוּ में जीवन की बहाली का स्वरूप
  choice: ‘जीवन देगा’—व्यापक पुनर्जीवन
  alternative: ‘मरे हुओं में से जिलाएगा’
  rationale: मूल क्रिया जीवन या स्फूर्ति की बहाली व्यक्त कर सकती है; मृत्यु और शारीरिक पुनरुत्थान को स्पष्ट जोड़ना स्रोत से अधिक विशिष्ट होता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘तू’ भजन की सीधी, निकट और पारंपरिक ईश्वर-संबोधन शैली को बनाए रखता है। दोनों שׁוב के लिए ‘फिर’ दोहराकर इब्रानी की काव्यात्मक पुनरावृत्ति सुरक्षित रखी गई है; ‘लौटकर’ से उत्पन्न होने वाली अस्वाभाविक हिन्दी से बचा गया है।
