lexical_decisions:
- source_word: אָבוֹא
  choice: मैं ... आऊँगा
  rationale: בוא के क़ाल अपूर्ण, प्रथम पुरुष एकवचन का मूल अर्थ ‘आना/जाना/प्रवेश करना’ है। यहाँ ‘आऊँगा’ इब्रानी रूप को बिना मुहावरे का अत्यधिक अर्थ-निर्धारण किए सुरक्षित रखता है।
- source_word: בִּגְבֻרוֹת
  choice: सामर्थ्य के कामों के साथ
  rationale: גְּבוּרוֹת बहुवचन में ‘सामर्थ्य’ और विशेषतः सामर्थ्य प्रकट करने वाले कार्यों को सूचित कर सकता है। בְּ को यहाँ साधनवाचक ‘के साथ’ समझा गया है; स्थान/क्षेत्रवाचक अर्थ की संभावना पादटिप्पणी में रखी गई है।
- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा
  rationale: संयुक्त उपाधि में אֲדֹנָי को ‘प्रभु’ और परमेश्वर के निज नाम יהוה को प्रचलित हिन्दी रूप ‘यहोवा’ दिया गया है, जिससे दोनों अलग तत्व बने रहते हैं।
- source_word: אַזְכִּיר
  choice: मैं ... बखान करूँगा
  rationale: זכר के हिफ़ील रूप का अर्थ ‘स्मरण कराना’, और उससे ‘उल्लेख करना/वर्णन करना/घोषित करना’ हो सकता है। काव्यात्मक सार्वजनिक कथन के लिए ‘बखान करूँगा’ स्वाभाविक है और अर्थ-सीमा को बनाए रखता है।
- source_word: צִדְקָתְךָ
  choice: तेरी धार्मिकता
  rationale: צדקה का मूल अर्थ ‘धार्मिकता’ है, पर यह ‘न्याय’ या ठोस धर्ममय कार्यों को भी सूचित कर सकता है। मुख्य पाठ में मूल अवधारणा रखी गई है और विकल्प पादटिप्पणी में दिए गए हैं।
- source_word: לְבַדֶּךָ
  choice: केवल तेरी
  rationale: לבדך का अर्थ ‘तू ही/अकेला’ है। ‘केवल तेरी धार्मिकता’ निकटवर्ती संज्ञा के साथ इसके विशेष बल को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: אֲדֹנָי יְהוִה में परमेश्वर के निज नाम का अनुवाद
  choice: प्रभु यहोवा
  alternative: प्रभु याहवे; प्रभु परमेश्वर
