  text: मैं प्रभु यहोवा के पराक्रम के कार्यों के साथ आऊँगा[a]; मैं तेरी धार्मिकता का ही वर्णन करूँगा[b][c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “प्रभु यहोवा के पराक्रम के कार्यों में आऊँगा।” इब्रानी उपसर्ग का अर्थ साधनवाचक “के साथ” अथवा क्षेत्रवाचक “में” हो सकता है।
