base_translation:
  language: en
  yaml_path: translation/ot/psalms/014/004.yaml
  text: Do not all the workers of wickedness know—those who eat up my people as they eat bread[a], and do not call on Yahweh?
translation:
  language: hi
  text: क्या सभी कुकर्मी नहीं जानते—वे जो मेरी प्रजा को रोटी की तरह खाते हैं[a] और याहवे को नहीं पुकारते?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक इब्रानी: “मेरी प्रजा को खानेवाले; रोटी खाते हैं।” यह परमेश्वर की प्रजा को निगल जाने की उनकी क्रिया की तुलना साधारण रूप से रोटी खाने से करता है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: क्या ... नहीं
  rationale: यह ऐसा आलंकारिक प्रश्न आरम्भ करता है जिसमें सकारात्मक उत्तर की अपेक्षा है; आधुनिक हिन्दी में ‘क्या ... नहीं’ इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: יָדְעוּ
  choice: जानते
  rationale: ידע का मूल अर्थ जानना या पहचानना है; यहाँ सामान्य वर्तमान काल प्रश्न के चरित्रगत और नीतिवचन-सदृश भाव के अनुकूल है।
- source_word: כָּל פֹּעֲלֵי אָוֶן
  choice: सब अनर्थकारी
  rationale: यह अभिव्यक्ति אָוֶן करने वालों को दर्शाती है। ‘अनर्थकारी’ संक्षिप्त, गरिमापूर्ण और आधुनिक हिन्दी में नैतिक बुराई का अर्थ देता है।
- source_word: אֹכְלֵי עַמִּי
  choice: जो मेरी प्रजा को ... खा जाते हैं
  rationale: सम्बन्धवाचक उपवाक्य इब्रानी कृदन्त को स्वाभाविक हिन्दी में व्यक्त करता है; ‘खा जाते हैं’ हिंसक उपभोग के रूपक को जीवंत रखता है।
- source_word: אָכְלוּ לֶחֶם
  choice: जैसे रोटी खाते हैं
  rationale: इब्रानी में ‘मेरी प्रजा को खाते हैं; रोटी खाते हैं’ का सटा हुआ विन्यास तुलना सूचित करता है। ‘जैसे’ जोड़ने से हिन्दी में निहित तुलना स्पष्ट होती है, और पादटिप्पणी शाब्दिक रूप बताती है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के विशिष्ट वाचा-नाम को सामान्य उपाधि से बदलने के बजाय हिन्दी में प्रचलित रूप ‘यहोवा’ से व्यक्त किया गया है।
- source_word: לֹא קָרָאוּ
  choice: नहीं पुकारते
  rationale: परमेश्वर के नाम के साथ קרא प्रार्थना या आराधना में पुकारने का भाव रखता है; सामान्य वर्तमान काल दुष्टों की चरित्रगत दशा व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में चतुरक्षरीय व्यक्तिगत नाम सीधे उपस्थित है। हिन्दी पाठकों के लिए स्थापित और पहचानने योग्य रूप ‘यहोवा’ नाम को उपाधि में बदले बिना सुरक्षित रखता है।
- issue: ‘जानते’ के कर्म का अनिर्दिष्ट रहना
  choice: मूल की तरह यह स्पष्ट न करना कि वे क्या जानते हैं
  alternative: ‘क्या उन्हें समझ नहीं है?’ अथवा कोई स्पष्ट कर्म जोड़ना
  rationale: इब्रानी पाठ ‘क्या वे नहीं जानते?’ कहकर प्रश्न को तनावपूर्ण और कुछ हद तक खुला छोड़ता है; कोई कर्म जोड़ना मूल की वास्तविक अस्पष्टता को अनावश्यक रूप से सुलझा देता।
- issue: अन्तिम खंड का प्रश्न के भीतर सम्बन्ध
  choice: ‘और यहोवा को नहीं पुकारते?’ को उसी आलंकारिक प्रश्न में रखना
  alternative: 'इसे अलग कथन बनाना: ‘वे यहोवा को नहीं पुकारते।’'
  rationale: पद की वाक्यरचना पूरे वर्णन को एक प्रश्न के रूप में पढ़ने देती है; संयोजक ‘और’ दोनों चरित्रगत कार्यों को जोड़ता है, बिना उनके तार्किक सम्बन्ध को अधिक निश्चित किए।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखी गई है। ‘खा जाते हैं’ मूल रूपक की तीव्रता बनाए रखता है; ‘अनर्थकारी’ नैतिक भार को संक्षेप में व्यक्त करता है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में दिए गए हैं।
