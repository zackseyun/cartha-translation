base_translation:
  language: en
  yaml_path: translation/ot/psalms/014/000.yaml
  text: 'For the choir director[a]. Of David.


    The fool says in his heart, “There is no God.”

    They are corrupt; they do abominable deeds[c][b].

    There is none who does good.'
translation:
  language: hi
  text: 'संगीत-निर्देशक के लिए।[a] दाऊद का।[b]


    मूर्ख अपने मन में कहता है, “परमेश्वर है ही नहीं।”


    वे भ्रष्ट हो गए हैं; उन्होंने घिनौने काम किए हैं।[c]


    कोई भी भलाई करनेवाला नहीं है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद “प्रधान संगीतकार के लिए” या “गायन-मंडली के प्रधान के लिए” भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शीर्षक में “दाऊद का” का अर्थ “दाऊद द्वारा रचित,” “दाऊद से संबंधित” या “दाऊद के लिए” भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: इब्रानी में “मूर्ख” एकवचन है, पर इसके बाद “वे भ्रष्ट हो गए हैं” और “उन्होंने… किए हैं” बहुवचन हैं; कथन एक प्रतिनिधि व्यक्ति से उसके जैसे लोगों की ओर बढ़ता है।
    reason: source_structure
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: प्रधान संगीतकार के लिए
  rationale: शीर्षक के निर्देशात्मक रूप और संगीत-नेतृत्व के अर्थ को सहज आधुनिक हिन्दी में व्यक्त करता है; पद का सटीक कार्य पूरी तरह निश्चित नहीं है।
- source_word: לְדָוִד
  choice: दाऊद का भजन
  rationale: हिन्दी में स्वाभाविक भजन-शीर्षक; इब्रानी संबंधसूचक रूप लेखकत्व, संबंध या समर्पण का संकेत दे सकता है, इसलिए विकल्प पादटिप्पणी में रखा गया है।
- source_word: נָבָל
  choice: मूर्ख
  rationale: यह केवल बौद्धिक कमी नहीं, बल्कि नैतिक और आध्यात्मिक विवेकहीनता को दर्शाता है; हिन्दी का 'मूर्ख' संदर्भ में व्यापक अर्थ वहन कर सकता है।
- source_word: בְּלִבּוֹ
  choice: अपने मन में
  rationale: इब्रानी 'हृदय' आंतरिक सोच और संकल्प का केंद्र है; आधुनिक हिन्दी में 'मन में' कथन की स्वाभाविक अभिव्यक्ति है।
- source_word: הִשְׁחִיתוּ
  choice: वे बिगड़ गए हैं
  rationale: बहुवचन क्रिया नैतिक भ्रष्टता की अवस्था बताती है; इससे एक प्रतिनिधि मूर्ख से उसके जैसे लोगों की ओर हुए वचन-परिवर्तन को बनाए रखा गया है।
- source_word: הִתְעִיבוּ עֲלִילָה
  choice: उन्होंने घिनौने काम किए हैं
  rationale: '''घिनौने'' תעב की तीव्र नैतिक विकर्षण-भावना और ''काम'' עֲלִילָה के आचरणगत अर्थ को स्पष्ट, स्वाभाविक हिन्दी में रखता है।'
- source_word: אֵין עֹשֵׂה טוֹב
  choice: कोई भी भलाई करनेवाला नहीं है
  rationale: इब्रानी अस्तित्ववाचक निषेध और कृदंत की व्यापक, वर्तमान विशेषता को निकटता से व्यक्त करता है।
theological_decisions:
- issue: אֵין אֱלֹהִים का आशय
  choice: “परमेश्वर है ही नहीं।”
  alternative: “कोई परमेश्वर नहीं है।”
  rationale: दोनों व्याकरणतः संभव हैं; चुना हुआ रूप सामान्यतः समझे जाने वाले ईश्वर-अस्वीकार को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि बलसूचक 'ही' कथन की निश्चयात्मकता दिखाता है।
- issue: एकवचन 'मूर्ख' से बहुवचन क्रियाओं की ओर परिवर्तन
  choice: एकवचन और बहुवचन दोनों को यथावत रखा
  alternative: पूरे कथन को एकवचन या पूरे को बहुवचन बना देना
  rationale: 'मूल पाठ का तनाव सुरक्षित रखा गया है: एक प्रतिनिधि व्यक्ति का कथन तुरंत उस वर्ग के सामूहिक भ्रष्ट आचरण में विस्तृत होता है।'
- issue: पूर्ण नैतिक निषेध
  choice: “कोई भी भलाई करनेवाला नहीं है।”
  alternative: “उनमें कोई भलाई नहीं करता।”
  rationale: मूल का व्यापक निषेध बिना किसी सिद्धांतगत सीमांकन या विस्तार के रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण भजनात्मक गद्य। शीर्षक को मुख्य पाठ से अलग रखा गया है। 'परमेश्वर', 'भलाई' और 'घिनौने काम' सामान्य पाठक के लिए स्पष्ट हैं; मूल के एकवचन-बहुवचन परिवर्तन और शीर्षकीय अस्पष्टता को पादटिप्पणियों सहित सुरक्षित रखा गया है।
