  text: All have turned aside; together they have become corrupt. There is none who does good[a], not even one.
translation:
  language: hi
  text: सब के सब भटक गए हैं; वे मिलकर भ्रष्ट हो गए हैं[a]। कोई भलाई करनेवाला नहीं है, एक भी नहीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘वे मिलकर दूषित हो गए हैं’ अथवा ‘वे मिलकर गंदे हो गए हैं।’ इब्रानी क्रिया बिगड़ने या भ्रष्ट होने का भाव देती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֹּל
  choice: सब के सब
  rationale: संदर्भ में यह सभी लोगों को समग्र रूप से सम्मिलित करता है; ‘सब के सब’ सार्वभौमिक और बलपूर्ण दायरा स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: סָר
  choice: भटक गए हैं
  rationale: क्रिया का मूल अर्थ हटना या मुड़ जाना है। यहाँ नैतिक मार्ग से हटने के भाव को ‘भटक गए हैं’ संक्षेप और स्वाभाविक ढंग से व्यक्त करता है, जबकि सामूहिक कर्ता के अनुसार बहुवचन रखा गया है।
- source_word: יַחְדָּו
  choice: मिलकर
  rationale: यह क्रियाविशेषण सामूहिकता प्रकट करता है; ‘मिलकर’ उनके साझा परिणाम को स्पष्ट और सहज हिन्दी में व्यक्त करता है।
- source_word: נֶאֱלָחוּ
  choice: भ्रष्ट हो गए हैं
  rationale: निफ़अल रूप बिगड़ या दूषित हो जाने की परिणामी अवस्था बताता है। ‘भ्रष्ट हो गए हैं’ नैतिक संदर्भ और अवस्था में आए परिवर्तन, दोनों को सुरक्षित रखता है।
- source_word: אֵין עֹשֵׂה טוֹב
  choice: कोई भलाई करनेवाला नहीं है
  rationale: अस्तित्व-निषेध और कृदंत का यह अनुवाद निरंतर या चरित्रगत कार्य का भाव स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: גַּם אֶחָד
  choice: एक भी नहीं
  rationale: यह निषेध को तीव्र करता है; ‘एक भी नहीं’ मूल की जोरदार सर्वव्यापकता को सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: मानवीय भ्रष्टता के सार्वभौमिक कथन का दायरा
  choice: ‘सब के सब’, ‘कोई ... नहीं’ और ‘एक भी नहीं’ के द्वारा सार्वभौमिक अभियोग को बिना नरम या सीमित किए प्रस्तुत करना।
  alternative: इसे केवल बहुत-से या अधिकांश लोगों का सामान्य वर्णन मानकर ढीला अनुवाद करना।
  rationale: इब्रानी पाठ הַכֹּל, אֵין और גַּם אֶחָד के द्वारा व्यापक और emphatic निषेध करता है। अनुवाद उसी आलंकारिक और धर्मवैचारिक तनाव को रखता है, पर बाद की किसी सिद्धान्त-प्रणाली को इसमें नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रूप। ‘करनेवाला’ को संयुक्त वर्तनी में रखा गया है। पाद-टिप्पणी का चिह्न मुख्य पाठ में संबंधित कथन के अंत पर दिया गया है।
