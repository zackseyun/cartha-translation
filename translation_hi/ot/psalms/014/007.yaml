source:
  edition: WLC
  text: מִ֥י יִתֵּ֣ן מִ/צִּיּוֹן֮ יְשׁוּעַ֪ת יִשְׂרָ֫אֵ֥ל בְּ/שׁ֣וּב יְ֭הוָה שְׁב֣וּת עַמּ֑/וֹ יָגֵ֥ל יַ֝עֲקֹ֗ב יִשְׂמַ֥ח יִשְׂרָֽאֵל׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/014/007.yaml
  text: Oh[a], that Israel’s salvation would come from Zion! When Yahweh restores the fortunes of his people, Jacob will rejoice; Israel will be glad.
translation:
  language: hi
  text: काश, सिय्योन से इस्राएल का उद्धार आए! जब याहवे अपनी प्रजा की दशा बहाल करेगा[a], तब याकूब आनन्द मनाएगा और इस्राएल हर्षित होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या अधिक शाब्दिक रूप से, “जब याहवे अपनी प्रजा की बन्धुआई को लौटा लाएगा।” इब्रानी मुहावरे का अर्थ प्रायः किसी प्रजा की दशा बहाल करना या उसकी दुर्दशा पलट देना होता है।
    reason: alternative_reading
lexical_decisions:
- source_word: מִי יִתֵּן
  choice: काश
  rationale: यह इब्रानी मुहावरा शाब्दिक प्रश्न नहीं, बल्कि प्रबल इच्छा या लालसा व्यक्त करता है; आधुनिक हिन्दी में ‘काश’ इसे स्वाभाविक और संक्षिप्त रूप से व्यक्त करता है।
- source_word: מִצִּיּוֹן
  choice: सिय्योन से
  rationale: מִן स्रोत या उद्गम बताता है; ‘सिय्योन’ स्थान-नाम का प्रचलित हिन्दी रूप है।
- source_word: יְשׁוּעַת יִשְׂרָאֵל
  choice: इस्राएल का उद्धार
  rationale: संबंधवाचक पदबंध को स्वाभाविक हिन्दी में व्यक्त करता है और יְשׁוּעָה के व्यापक छुटकारे तथा उद्धार के भाव को बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: दिव्य नाम को हिन्दी बाइबल-परंपरा में व्यापक रूप से पहचाने जाने वाले व्यक्तिगत नाम ‘यहोवा’ से प्रस्तुत किया गया है, न कि किसी उपाधि से।
- source_word: בְּשׁוּב יְהוָה שְׁבוּת עַמּוֹ
  choice: जब यहोवा अपनी प्रजा के दिन फेर देगा
  rationale: ‘दिन फेरना’ आधुनिक हिन्दी का सुबोध मुहावरा है, जो שׁוּב שְׁבוּת में निहित दुर्दशा पलटने और दशा बहाल करने का व्यापक अर्थ देता है, बिना इसे केवल निर्वासन से वापसी तक सीमित किए।
- source_word: יָגֵל
  choice: आनन्द मनाएगा
  rationale: גיל उल्लासपूर्ण आनन्द व्यक्त करता है; यह चयन काव्यात्मक और सामान्य पाठक के लिए स्पष्ट है।
- source_word: יַעֲקֹב
  choice: याकूब
  rationale: नाम का मानक हिन्दी रूप; यहाँ यह परमेश्वर की प्रजा का सामूहिक काव्यात्मक नाम है।
- source_word: יִשְׂמַח
  choice: हर्षित होगा
  rationale: यह שמח के प्रसन्न होने के भाव को व्यक्त करता है और पहले प्रयुक्त ‘आनन्द मनाएगा’ से हल्का शब्दगत भेद बनाए रखता है।
- source_word: יִשְׂרָאֵל
  choice: इस्राएल
  rationale: नाम का प्रचलित हिन्दी रूप; यहाँ ‘याकूब’ के समानांतर परमेश्वर की प्रजा को सामूहिक रूप से दर्शाता है।
theological_decisions:
- issue: שׁוּב שְׁבוּת मुहावरे का अर्थ
  choice: अपनी प्रजा के दिन फेर देगा
  alternative: अपनी प्रजा को बन्धुआई से लौटा लाएगा
  rationale: इब्रानी पदबंध किसी प्रजा की दशा या भाग्य को बहाल करने का व्यापक अर्थ रख सकता है। भजन 14 में ऐतिहासिक निर्वासन स्पष्ट नहीं है, इसलिए मुख्य पाठ में व्यापक मुहावरेदार अर्थ रखा गया है और अधिक शाब्दिक सम्भावना पादटिप्पणी में दी गई है।
- issue: יְהוָה का हिन्दी रूप
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में व्यक्तिगत दिव्य नाम को उपाधि से बदलने के बजाय नाम के रूप में रखा गया है। ‘यहोवा’ साधारण हिन्दी पाठकों में अधिक परिचित और प्रतिष्ठित रूप है; स्वरांकन की ऐतिहासिक अनिश्चितता के कारण ‘याहवे’ भी सम्भव लिप्यंतरण है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक रखी गई है। ‘काश’ मूल की तीव्र अभिलाषा को सहज हिन्दी में व्यक्त करता है। ‘दिन फेर देगा’ परिचित हिन्दी मुहावरा है और मूल की अर्थगत व्यापकता को बचाता है। ‘याकूब’ और ‘इस्राएल’ का समानांतर प्रयोग ज्यों का त्यों रखा गया है।
