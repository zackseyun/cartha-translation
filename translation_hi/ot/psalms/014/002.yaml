  text: Yahweh looks down from heaven on the children of man to see whether there is one who has insight[a], one who seeks God.
translation:
  language: hi
  text: याहवे स्वर्ग से मनुष्यों[a] पर दृष्टि डालते हैं, यह देखने के लिए कि क्या कोई समझदार और परमेश्वर को खोजने वाला है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू में शाब्दिक रूप से, ‘मनुष्य के पुत्र’; यह सामान्यतः सभी मनुष्यों के लिए प्रयुक्त प्रतिनिधिक अभिव्यक्ति है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय देवनागरी लिप्यंतरण में रखा गया है।
- source_word: מִשָּׁמַיִם
  choice: स्वर्ग से
  rationale: हिब्रू का रूप बहुवचन है, पर यहाँ परमेश्वर के ऊँचे निवास अथवा दृष्टि-स्थान के लिए हिन्दी में एकवचन 'स्वर्ग' स्वाभाविक है।
- source_word: הִשְׁקִיף
  choice: दृष्टि करते हैं
  rationale: क्रिया ऊँचे स्थान से नीचे देखने का भाव देती है; 'स्वर्ग से ... पर दृष्टि करते हैं' यह दिशा संदर्भ से स्पष्ट रखते हुए गरिमापूर्ण और स्वाभाविक हिन्दी है।
- source_word: בְּנֵי אָדָם
  choice: मनुष्यों
  rationale: शाब्दिक रूप 'आदम की सन्तान/मनुष्य के पुत्र' समस्त मानवजाति के लिए हिब्रू प्रतिनिधिक मुहावरा है; हिन्दी में 'मनुष्यों' उसका अर्थ स्पष्ट और स्वाभाविक रूप से देता है।
- source_word: לִרְאוֹת
  choice: यह देखने के लिए
  rationale: उद्देश्यवाचक infinitive का सीधा और स्वाभाविक अनुवाद।
- source_word: הֲיֵשׁ
  choice: कि क्या कोई ... है
  rationale: यह उस जाँच का विषय प्रस्तुत करता है जिसके लिए याहवे देखते हैं।
- source_word: מַשְׂכִּיל
  choice: समझ रखनेवाला
  rationale: שכל से निकला यह रूप सूझ-बूझ अथवा समझ रखने वाले व्यक्ति को दर्शाता है; इसे केवल 'बुद्धिमान' कहकर तकनीकी ज्ञान-साहित्य की छाया नहीं दी गई।
- source_word: דֹּרֵשׁ אֶת אֱלֹהִים
  choice: परमेश्वर को खोजनेवाला
  rationale: सक्रिय कृदन्त परमेश्वर की खोज करने वाले व्यक्ति का समानांतर वर्णन करता है।
theological_decisions:
- issue: בְּנֵי אָדָם में प्रतिनिधिक पुल्लिंग अभिव्यक्ति
  choice: मनुष्यों
  alternative: मनुष्य के पुत्रों / आदम की सन्तान पर
  rationale: हिब्रू पदबंध का आशय सामान्यतः सभी मानव हैं। आधुनिक हिन्दी में शाब्दिक 'मनुष्य के पुत्रों' का अर्थ अनावश्यक रूप से केवल पुरुषों तक सीमित समझा जा सकता है, जबकि 'मनुष्यों' सामूहिक अर्थ को सटीक रखता है।
- issue: מַשְׂכִּיל और דֹּרֵשׁ का संबंध
  choice: 'एक ही संभावित व्यक्ति के दो समानांतर गुण: ''समझ रखनेवाला, परमेश्वर को खोजनेवाला'''
  alternative: 'दो अलग व्यक्तियों के रूप में: ''एक समझ रखनेवाला, एक परमेश्वर को खोजनेवाला'''
  rationale: हिब्रू में दूसरा कृदन्त पहले का समानांतर विस्तार है; हिन्दी वाक्य-विन्यास उसी संभावित व्यक्ति के दोनों लक्षण सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण काव्यात्मक गद्य। 'याहवे' नाम सुरक्षित रखा गया है। वाक्य को सहज रखने के लिए בְּנֵי אָדָם का अर्थपरक रूप 'मनुष्यों' चुना गया; आवश्यक अर्थ मुख्य पाठ में ही स्पष्ट होने के कारण पादटिप्पणी नहीं जोड़ी गई।
