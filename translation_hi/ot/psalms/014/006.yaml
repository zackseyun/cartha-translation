  text: עֲצַת עָנִ֥י תָבִ֑ישׁוּ כִּ֖י יְהוָ֣ה מַחְסֵֽ/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/014/006.yaml
  text: You shame the counsel of the poor[a], because Yahweh is his refuge.
translation:
  language: hi
  text: तुम दीन जन की सलाह को लज्जा में डालते हो[a], क्योंकि याहवे उसका शरणस्थान है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम दीन जन की योजना को लज्जा में डालते हो।”
    reason: עֲצַת का अर्थ यहाँ ‘सलाह’ या ‘योजना’ दोनों हो सकता है।
lexical_decisions:
- source_word: עֲצַת
  choice: सलाह
  rationale: עֵצָה का संबंधवाचक रूप ‘सलाह’, ‘योजना’ या ‘युक्ति’ व्यक्त कर सकता है। ‘सलाह’ मूल की व्यापकता बनाए रखती है और इसे केवल मन की योजना या कही गई सम्मति तक सीमित नहीं करती।
- source_word: עָנִי
  choice: दीन जन
  rationale: עָנִי निर्धन, पीड़ित या दबे हुए व्यक्ति को सूचित कर सकता है। ‘दीन जन’ आधुनिक हिन्दी में उसकी आर्थिक और सामाजिक असुरक्षा दोनों की गुंजाइश रखता है।
- source_word: תָבִישׁוּ
  choice: तुम ... लज्जित करते हो
  rationale: यह בוש का हिफ़ील, द्वितीय पुरुष बहुवचन रूप है, जिसका अर्थ ‘लज्जित करना’ या ‘लज्जा में डालना’ है। अनुवाद बहुवचन संबोधन और कारक अर्थ दोनों सुरक्षित रखता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यहाँ כִּי कारण प्रस्तुत करता है; ‘क्योंकि’ इस संबंध को सहज आधुनिक हिन्दी में स्पष्ट करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल में परमेश्वर का व्यक्तिवाचक वाचा-नाम है। हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ शीर्षक से बदलने के बजाय नाम को नाम के रूप में रखता है।
- source_word: מַחְסֵהוּ
  choice: उसका शरणस्थान
  rationale: מַחְסֶה आश्रय या सुरक्षा के स्थान का बिंब है और प्रत्यय तृतीय पुरुष एकवचन पुल्लिंग है। ‘उसका शरणस्थान’ रूपक और संबंध दोनों को स्पष्ट रखता है।
theological_decisions:
- issue: יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में चतुरक्षरीय परमेश्वर-नाम सीधे आया है। हिन्दी पाठकों के लिए परिचित ‘यहोवा’ नाम को किसी उपाधि से बदले बिना उसके व्यक्तिवाचक स्वरूप को सुरक्षित रखता है।
- issue: עֲצַת עָנִי की व्याख्या
  choice: दीन जन की सलाह
  alternative: दीन जन की योजना
  rationale: समास ‘सलाह/युक्ति’ और ‘योजना’ दोनों अर्थ दे सकता है। मुख्य पाठ व्यापक ‘सलाह’ रखता है और वैकल्पिक अर्थ पादटिप्पणी में देता है, ताकि मूल की अस्पष्टता बनी रहे।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘दीन जन’ काव्यात्मक गरिमा के साथ עָנִי की निर्धनता, पीड़ा और असुरक्षा की व्यापकता को बनाए रखता है।
