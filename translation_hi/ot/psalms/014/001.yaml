  text: לַ/מְנַצֵּ֗חַ לְ/דָ֫וִ֥ד אָ֘מַ֤ר נָבָ֣ל בְּ֭/לִבּ/וֹ אֵ֣ין אֱלֹהִ֑ים הִֽשְׁחִ֗יתוּ הִֽתְעִ֥יבוּ עֲלִילָ֗ה אֵ֣ין עֹֽשֵׂה טֽוֹב־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/014/001.yaml
  text: For the choir director[a]. Of David. The fool says in his heart, “There is no God.” They are corrupt; they do abominable deeds[c][b]. There is no one who does good.
translation:
  language: hi
  text: 'संगीत-निर्देशक के लिए[a]। दाऊद का भजन[b]।


    मूर्ख अपने हृदय में कहता है, “कोई परमेश्वर नहीं है।” वे भ्रष्ट हो गए हैं[c]; उन्होंने घिनौने काम किए हैं। भलाई करने वाला कोई नहीं है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद “प्रधान गायक के लिए” भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शीर्षक में प्रयुक्त इब्रानी अभिव्यक्ति का अर्थ “दाऊद द्वारा”, “दाऊद से संबंधित” या “दाऊद के लिए” भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: इब्रानी पाठ एकवचन “मूर्ख” से बहुवचन “वे” पर आता है और इस प्रकार एक प्रतिनिधि व्यक्ति से उसके जैसे पूरे वर्ग की ओर बढ़ता है।
    reason: source_structure
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: संगीत-निर्देशक के लिए
  rationale: यह पद भजन के संगीत अथवा गायन का नेतृत्व करने वाले व्यक्ति की ओर संकेत करता है। ‘संगीत-निर्देशक’ आधुनिक हिन्दी में स्पष्ट है और किसी विशेष प्रकार के गायक-दल को अनावश्यक रूप से नहीं मानता।
- source_word: לְדָוִד
  choice: दाऊद का भजन
  rationale: भजन-शीर्षक के रूप में यह स्वाभाविक हिन्दी है। मूल पूर्वसर्ग रचनाकार, संबंध अथवा समर्पण का संकेत दे सकता है; इसलिए इसकी व्यापकता पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: נָבָל
  choice: मूर्ख
  rationale: यह केवल बौद्धिक कमी नहीं, बल्कि नैतिक और आत्मिक विवेकहीनता को दर्शाता है। ‘मूर्ख’ इस बाइबलीय श्रेणी को संक्षेप और स्वाभाविक रूप में व्यक्त करता है।
- source_word: בְּלִבּוֹ
  choice: अपने मन में
  rationale: इब्रानी ‘हृदय’ भीतरी सोच, इच्छा और निर्णय का केंद्र है। आधुनिक हिन्दी में ‘अपने मन में’ इसी आशय को अधिक स्वाभाविक ढंग से व्यक्त करता है।
- source_word: אֵין אֱלֹהִים
  choice: कोई परमेश्वर नहीं है
  rationale: यह मूल वाक्य के सीधे अस्तित्वगत निषेध को बनाए रखता है और उसके निहितार्थ को ‘परमेश्वर का कोई महत्त्व नहीं’ जैसी व्याख्या में नहीं बदलता।
- source_word: הִשְׁחִיתוּ
  choice: वे भ्रष्ट हो गए हैं
  rationale: क्रिया बिगड़ने अथवा भ्रष्ट हो जाने और उससे उत्पन्न नैतिक दशा का बोध कराती है। पूर्ण पक्ष को हिन्दी के पूर्ण वर्तमान से व्यक्त किया गया है।
- source_word: הִתְעִיבוּ עֲלִילָה
  choice: उन्होंने घिनौने काम किए हैं
  rationale: क्रिया घृणित ढंग से आचरण करने का और संज्ञा कर्म अथवा व्यवहार का बोध कराती है। संयुक्त अनुवाद आधुनिक हिन्दी में स्वाभाविक रहते हुए नैतिक तीव्रता बनाए रखता है।
- source_word: אֵין עֹשֵׂה טוֹב
  choice: भलाई करने वाला कोई नहीं है
  rationale: यह मूल की अस्तित्ववाचक बनावट और अच्छे कर्म करने वाले के पूर्ण अभाव—दोनों को स्पष्ट तथा स्वाभाविक हिन्दी में रखता है।
theological_decisions:
- issue: אֵין אֱלֹהִים में निषेध का आशय
  choice: “कोई परमेश्वर नहीं है” के रूप में सीधा अस्तित्वगत निषेध
  alternative: “परमेश्वर का कोई महत्त्व नहीं” अथवा “कोई न्याय नहीं होगा” जैसे व्यावहारिक नास्तिकता के भावार्थ
  rationale: इब्रानी शब्द सीधे परमेश्वर के होने का निषेध करते हैं। व्यावहारिक ईश्वर-विमुखता संदर्भ में निहित हो सकती है, पर मुख्य पाठ में स्पष्ट कथन को व्याख्यात्मक भावार्थ से बदलना उचित नहीं।
- issue: एकवचन נָבָל के बाद बहुवचन क्रियाएँ
  choice: “मूर्ख ... कहता है” के बाद “वे भ्रष्ट हो गए हैं”
  alternative: पूरे वाक्य को एकवचन करना या आरंभ से ही ‘मूर्ख लोग’ कहना
  rationale: मूल पाठ एक प्रतिनिधि व्यक्ति से उस पूरे वर्ग की ओर बढ़ता है जिसका वह प्रतिनिधित्व करता है। इस संख्या-परिवर्तन को बनाए रखने से मूल की अभिव्यक्ति और तनाव सुरक्षित रहता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘संगीत-निर्देशक’ सामान्य पाठक के लिए स्पष्ट है; ‘भ्रष्ट’ और ‘घिनौने काम’ मूल की नैतिक गंभीरता बनाए रखते हैं। शीर्षक को हिन्दी में स्वाभाविक बनाने के लिए ‘भजन’ जोड़ा गया है, जबकि לְדָוִד की वास्तविक अर्थगत व्यापकता पादटिप्पणी में स्पष्ट की गई है।
