lexical_decisions:
- source_word: שָׁם
  choice: वहाँ
  rationale: स्थानवाचक क्रिया-विशेषण की संक्षिप्तता और दृश्य की तात्कालिकता को बनाए रखता है।
- source_word: פָּחֲדוּ פָחַד
  choice: वे बड़े भय से भर गए
  rationale: क्रिया और उसी मूल की संज्ञा से बनी इब्रानी बलाघाती अभिव्यक्ति को स्वाभाविक आधुनिक हिन्दी में तीव्र भय के रूप में व्यक्त करता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यहाँ यह उनके भय का कारण प्रस्तुत करता है।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: सन्दर्भ में इस्राएल के परमेश्वर के लिए प्रयुक्त सामान्य पद का गरिमापूर्ण और प्रचलित हिन्दी रूप।
- source_word: בְּדוֹר
  choice: पीढ़ी के बीच
  rationale: בְ के स्थानगत अर्थ—'में/बीच'—को सीधे बनाए रखता है और परमेश्वर की उपस्थिति व्यक्त करता है, बिना 'साथ' के पक्षधरता-सूचक अर्थ को मुख्य पाठ में अनिवार्य किए।
- source_word: צַדִּיק
  choice: धर्मी
  rationale: रूपतः एकवचन विशेषण यहाँ דּוֹר के साथ पीढ़ी का चरित्र बताता है; 'धर्मी पीढ़ी' स्वाभाविक सामूहिक अर्थ देता है।
theological_decisions:
- issue: בְּדוֹר צַדִּיק में परमेश्वर और धर्मी पीढ़ी का सम्बन्ध
  choice: परमेश्वर धर्मी पीढ़ी के बीच है
  alternative: परमेश्वर धर्मी पीढ़ी के साथ है
  rationale: इब्रानी בְ मुख्यतः 'में/बीच' की उपस्थिति व्यक्त कर सकता है, जबकि प्रसंग में 'साथ' अर्थात समर्थन या एकजुटता भी सम्भव है। मुख्य पाठ अधिक स्थानगत और स्रोत-सन्निकट रूप रखता है तथा विकल्प को टिप्पणी में सुरक्षित करता है।
