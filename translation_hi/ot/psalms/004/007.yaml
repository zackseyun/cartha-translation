  text: You have put joy in my heart more than when their grain and their new wine abound[a].
translation:
  language: hi
  text: आपने मेरे हृदय में उस समय मिलने वाले आनन्द से भी अधिक आनन्द भर दिया है, जब उनके अनाज और नए दाखरस की बहुतायत होती है[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप में: “जिस समय से उनका अनाज और नया दाखरस बढ़े।” इब्रानी वाक्यांश को सामान्यतः तुलना के रूप में समझा जाता है: परमेश्वर का दिया आनन्द भौतिक बहुतायत के समय के आनन्द से बढ़कर है।'
    reason: alternative_reading
lexical_decisions:
- source_word: נָתַתָּה
  choice: आपने ... भर दिया है
  rationale: यह נתן का काल पूर्ण, द्वितीय पुरुष पुल्लिंग एकवचन रूप है और परमेश्वर को संबोधित करता है। ‘भर दिया है’ हिन्दी में हृदय के भीतर आनन्द देने की बात स्वाभाविक ढंग से व्यक्त करता है और पूर्ण कार्य के वर्तमान प्रभाव को बनाए रखता है।
- source_word: שִׂמְחָה
  choice: आनन्द
  rationale: यह शब्द हर्ष या आनन्द को दर्शाता है। ‘आनन्द’ आधुनिक, गरिमापूर्ण और भीतरी प्रसन्नता के प्रसंग के अनुकूल है।
- source_word: בְלִבִּי
  choice: मेरे हृदय में
  rationale: לֵב यहाँ मनुष्य के भीतरी व्यक्तित्व को सूचित करता है। ‘मेरे हृदय में’ अर्थ को बिना अधिक व्याख्या जोड़े स्वाभाविक हिन्दी में रखता है।
- source_word: מֵעֵת
  choice: उस समय से भी अधिक ... जब
  rationale: מִן और עֵת का मेल यहाँ सामान्यतः तुलना का मानक प्रस्तुत करता है। यह वाक्यांश परमेश्वर से मिले आनन्द को उपज की बहुतायत के समय होने वाले आनन्द से अधिक बताता है, जबकि पादटिप्पणी अधिक शाब्दिक सम्भावना सुरक्षित रखती है।
- source_word: דְּגָנָם
  choice: उनका अनाज
  rationale: דגן अन्न या अनाज की उपज को दर्शाता है। ‘अनाज’ वर्तमान हिन्दी में स्पष्ट और कृषि-सन्दर्भ के अनुकूल है।
- source_word: וְתִירוֹשָׁם
  choice: और नया दाखरस
  rationale: תירוש सामान्यतः ताज़े या नए दाखरस को दर्शाता है। ‘नया दाखरस’ फसल और समृद्धि के मूल बिम्ब को सुरक्षित रखता है।
- source_word: רָבּוּ
  choice: बहुतायत में होता है
  rationale: רבה के इस रूप का अर्थ बढ़ना या बहुत हो जाना है। सामूहिक उपज के लिए ‘बहुतायत में होता है’ सहज हिन्दी में प्रचुरता व्यक्त करता है।
theological_decisions:
- issue: पद की तुलनात्मक वाक्य-रचना
  choice: भजनकार कहता है कि परमेश्वर का दिया भीतरी आनन्द उस आनन्द से अधिक है जो भरपूर अनाज और नए दाखरस के समय मिलता है।
  alternative: 'इसे अधिक शाब्दिक रूप में कालगत कथन माना जा सकता है: ‘जिस समय से उनका अनाज और नया दाखरस बढ़ा, आपने मेरे हृदय में आनन्द दिया।’'
  rationale: מֵעֵת को यहाँ तुलना का मानक समझना इब्रानी वाक्य-रचना और प्रसंग के अनुकूल है। फिर भी कालगत अर्थ की सम्भावना को पादटिप्पणी में रखा गया है, ताकि मूल की वास्तविक अस्पष्टता न मिटे।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण प्रार्थनात्मक स्वर रखा गया है। परमेश्वर के लिए आदरसूचक ‘आप’ का प्रयोग किया गया है। ‘नया दाखरस’ मूल कृषि-बिम्ब को बनाए रखता है, और मुख्य पाठ में तुलनात्मक अर्थ स्पष्ट करते हुए वैकल्पिक कालगत पाठ पादटिप्पणी में सुरक्षित है।
