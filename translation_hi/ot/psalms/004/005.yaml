  text: זִבְח֥וּ זִבְחֵי צֶ֑דֶק וּ֝/בִטְח֗וּ אֶל יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/004/005.yaml
  text: Offer sacrifices of righteousness[a], and trust in Yahweh.
translation:
  language: hi
  text: 'धार्मिकता के बलिदान[a] चढ़ाओ,

    और याहवे पर भरोसा रखो।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उचित बलिदान” अथवा “न्याय के बलिदान।”
    reason: צֶדֶק और पूरे रचना-संबंध के वैध अर्थ-विकल्पों को सुरक्षित रखने के लिए।
lexical_decisions:
- source_word: זִבְחוּ זִבְחֵי
  choice: बलिदान चढ़ाओ
  rationale: क्रिया और उसी मूल से बने संज्ञा-पद की बलिदान-संबंधी क्रिया को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; शाब्दिक पुनरुक्ति हिन्दी में असहज होती।
- source_word: צֶדֶק
  choice: धार्मिकता के
  rationale: यह चयन नैतिक, वाचा-संबंधी और उचित उपासना के संभावित भावों को जानबूझकर खुला रखता है।
- source_word: וּבִטְחוּ אֶל
  choice: और ... पर भरोसा रखो
  rationale: बहुवचन आज्ञार्थक का स्वाभाविक हिन्दी रूप है और אֶל के संबंधपरक भाव को हिन्दी मुहावरे के अनुसार व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण द्वारा सुरक्षित रखा गया है।
theological_decisions:
- issue: זִבְחֵי צֶדֶק का आशय
  choice: धार्मिकता के बलिदान
  alternative: उचित बलिदान; न्याय के बलिदान
  rationale: मूल पदबंध यह निश्चित नहीं करता कि मुख्य बल नैतिक निष्कपटता, विधिपूर्वक उपासना, न्याय, या इन सब पर है; मुख्य अनुवाद इस व्यापकता को बनाए रखता है और विकल्प पादटिप्पणी में देता है।
translation_notes:
  register: सरल, गरिमापूर्ण आधुनिक मानक हिन्दी; काव्यात्मक समानांतरता के लिए दो पंक्तियाँ। बहुवचन आज्ञार्थक में सामान्य और सम्मानसूचक रूप समान होने के कारण ‘चढ़ाओ’ तथा ‘रखो’ स्वाभाविक हैं।
