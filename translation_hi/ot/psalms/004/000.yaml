  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज भजन-शीर्षक। संगीत-संबंधी तकनीकी भाषा को स्पष्ट रखा गया है और לְדָוִד की वास्तविक अस्पष्टता पाद-टिप्पणी में सुरक्षित है।
