  choice: प्रधान गायक के लिए
  rationale: भजनों के शीर्षकों में यह पद संगीत-प्रस्तुति का नेतृत्व या निरीक्षण करने वाले व्यक्ति के लिए प्रयुक्त निर्देश माना जाता है। ‘प्रधान गायक’ संक्षिप्त, स्वाभाविक और उपासना-संगीत के संदर्भ में स्पष्ट है।
- source_word: בִּנְגִינוֹת
  choice: तार वाले वाद्यों के साथ
  rationale: यह पद तार वाले वाद्यों अथवा उनसे उत्पन्न संगीत की ओर संकेत करता है। यह अनुवाद प्रदर्शन की विधि को आवश्यकता से अधिक निश्चित किए बिना संगीत-संबंधी निर्देश व्यक्त करता है।
- source_word: מִזְמוֹר
  choice: भजन
  rationale: यह इस काव्य-संगीत विधा का मानक और प्रचलित हिन्दी नाम है तथा मूल शब्द के संगीतात्मक संदर्भ के अनुकूल है।
- source_word: לְדָוִד
  choice: दाऊद का
  rationale: हिन्दी में ‘दाऊद का’ पारंपरिक और संक्षिप्त है तथा लेखकत्व, संबद्धता या समर्पण की इब्रानी संभावनाओं को पाद-टिप्पणी में खुला रखने देता है।
theological_decisions:
- issue: शीर्षक में לְדָוִד से सूचित लेखकत्व अथवा संबद्धता
  choice: दाऊद का
  alternative: दाऊद द्वारा रचित; दाऊद के लिए
  rationale: इब्रानी संबंधसूचक रचना लेखकत्व, संबद्धता, स्वामित्व या समर्पण बता सकती है। मुख्य पाठ में पारंपरिक व्यापक अभिव्यक्ति रखकर और पाद-टिप्पणी में विकल्प देकर किसी एक ऐतिहासिक या धर्मवैज्ञानिक निष्कर्ष को अनावश्यक रूप से निश्चित नहीं किया गया।
