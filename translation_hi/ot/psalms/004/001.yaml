  yaml_path: translation/ot/psalms/004/001.yaml
  text: When I call[a], answer me, O God of my righteousness. In distress you have made room for me[b]. Be gracious to me and hear my prayer.
translation:
  language: hi
  text: 'जब मैं पुकारूँ, मुझे उत्तर दे,

    हे मेरी धार्मिकता के परमेश्वर![a]

    संकट में तूने मेरे लिए जगह चौड़ी कर दी है।[b]

    मुझ पर अनुग्रह कर और मेरी प्रार्थना सुन।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “हे मेरे धर्मी परमेश्वर!” अथवा “हे मुझे न्याय दिलानेवाले परमेश्वर!” हिब्रू में शाब्दिक रूप से “मेरी धार्मिकता के परमेश्वर” है।
    reason: alternative_reading
  - marker: b
    text: 'या “तूने मुझे राहत दी है।” हिब्रू में स्थान से जुड़ी छवि है: संकट की तंगी में तूने मेरे लिए जगह चौड़ी कर दी।'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּקָרְאִי
  choice: जब मैं पुकारूँ
  rationale: בְּ के साथ infinitive construct और प्रथम पुरुष एकवचन प्रत्यय यहाँ कालसूचक है। ‘जब मैं पुकारूँ’ प्रार्थना के संदर्भ में स्वाभाविक है और मूल क्रिया में अनावश्यक भावात्मक तीव्रता नहीं जोड़ता।
- source_word: עֲנֵנִי
  choice: मुझे उत्तर दे
  rationale: ענה का यहाँ सामान्य अर्थ ‘उत्तर देना’ है; प्रत्यक्ष प्रार्थना में यह संक्षिप्त और स्वाभाविक हिन्दी है।
- source_word: אֱלֹהֵי צִדְקִי
  choice: हे मेरी धार्मिकता के परमेश्वर
  rationale: यह हिब्रू construct chain को यथासंभव सीधे रखता है और इस बात को खुला छोड़ता है कि धार्मिकता परमेश्वर से प्राप्त है, उसके सामने मान्य है, या उसके द्वारा किए जाने वाले न्यायोचित ठहराव की ओर संकेत करती है।
- source_word: בַּצָּר
  choice: संकट में
  rationale: צַר का अर्थ तंगी, संकट या क्लेश हो सकता है। ‘संकट में’ अर्थ और काव्यात्मक गरिमा दोनों को बनाए रखता है।
- source_word: הִרְחַבְתָּ לִּי
  choice: तूने मेरे लिए खुली जगह कर दी है
  rationale: רחב का Hiphil रूप ‘चौड़ा करना’ व्यक्त करता है। यह अनुवाद तंगी से खुले स्थान में लाने की स्थानिक छवि को स्वाभाविक हिन्दी में बचाता है।
- source_word: חָנֵּנִי
  choice: मुझ पर अनुग्रह कर
  rationale: חנן का मूल भाव कृपा या अनुग्रह दिखाना है; इसलिए यह ‘मुझ पर दया कर’ की अपेक्षा अधिक सटीक है।
- source_word: וּשְׁמַע תְּפִלָּתִי
  choice: और मेरी प्रार्थना सुन
  rationale: שׁמע प्रार्थना के संदर्भ में ध्यान देकर सुनने को और תְּפִלָּה सामान्यतः प्रार्थना को दर्शाता है।
theological_decisions:
- issue: אֱלֹהֵי צִדְקִי का अर्थ
  choice: मुख्य पाठ में ‘हे मेरी धार्मिकता के परमेश्वर’
  alternative: ‘हे मेरे धर्मी परमेश्वर’ अथवा ‘हे मुझे न्याय दिलानेवाले परमेश्वर’
  rationale: हिब्रू रचना किसी एक व्याख्या को अनिवार्य नहीं करती। औपचारिक वाक्यांश धार्मिकता के स्रोत, आधार और परमेश्वर के न्यायोचित ठहराने वाले कार्य के बीच विद्यमान अर्थगत तनाव को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और प्रार्थनामय रखी गई है। परमेश्वर के लिए निकट और प्रत्यक्ष एकवचन संबोधन ‘तू’ मूल हिब्रू के एकवचन रूपों से मेल खाता है। काव्य-पंक्तियाँ अर्थगत इकाइयों के अनुसार विभाजित हैं।
