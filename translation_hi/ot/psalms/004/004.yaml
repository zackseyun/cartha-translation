id: PSA.4.4
reference: Psalms 4:4
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: רִגְז֗וּ וְֽ/אַל תֶּ֫חֱטָ֥אוּ אִמְר֣וּ בִ֭/לְבַבְ/כֶם עַֽל מִשְׁכַּבְ/כֶ֗ם וְ/דֹ֣מּוּ סֶֽלָה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/004/004.yaml
  text: Tremble[a], and do not sin; speak in your hearts on your beds, and be still[b]. Selah
translation:
  language: hi
  text: काँपो[a], और पाप न करो; अपने बिछौनों पर मन ही मन कहो, और चुप रहो[b]। सेला।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्रोध करो, और पाप न करो।” इब्रानी क्रिया उत्तेजित होने, काँपने या क्रोधित होने का अर्थ दे सकती है।
    reason: alternative_reading
  - marker: b
    text: या, “शांत हो जाओ।”
    reason: alternative_reading
lexical_decisions:
- source_word: רִגְזוּ
  choice: काँपो
  rationale: רגז घबराहट, कंपकंपी, उत्तेजना या क्रोध प्रकट कर सकता है। संदर्भ में पाप से बचने, आत्ममंथन करने और चुप होने की ओर बढ़ते क्रम को देखते हुए “काँपो” भावनात्मक विचलन को व्यक्त करता है, पर अर्थ को केवल क्रोध तक सीमित नहीं करता।
- source_word: וְאַל תֶּחֱטָאוּ
  choice: और पाप न करो
  rationale: חטא के साथ आए निषेध का सीधा, स्वाभाविक और अर्थनिष्ठ अनुवाद।
- source_word: אִמְרוּ בִלְבַבְכֶם
  choice: मन ही मन कहो
  rationale: אִמְרוּ का मूल अर्थ “कहो” सुरक्षित रहता है, जबकि בִלְבַבְכֶם का आंतरिक विचार या आत्म-संवाद वाला आशय आधुनिक हिन्दी के स्वाभाविक मुहावरे “मन ही मन” से व्यक्त होता है।
- source_word: עַל מִשְׁכַּבְכֶם
  choice: अपने बिछौनों पर
  rationale: बहुवचन प्रत्यय को बनाए रखते हुए निजी विश्राम-स्थान का सीधा चित्र सुरक्षित रखा गया है।
- source_word: וְדֹמּוּ
  choice: और चुप रहो
  rationale: דמם मौन या स्थिर हो जाने का अर्थ दे सकता है। “चुप रहो” यहाँ आत्म-संवाद के बाद आने वाले मौन को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: סֶלָה
  choice: सेला
  rationale: इस उपासना-संबंधी संकेत का सटीक अर्थ अनिश्चित है; इसलिए परंपरागत रूप से इसका लिप्यंतरण किया गया है।
theological_decisions:
- issue: नैतिक चेतावनी के संदर्भ में רִגְזוּ का अर्थ
  choice: भावनात्मक रूप से काँपने या विचलित होने का आह्वान, पर पाप न करने की चेतावनी के साथ
  alternative: “क्रोध करो, पर पाप न करो”
  rationale: इब्रानी क्रिया काँपने, उत्तेजित होने या क्रोधित होने के अर्थ दे सकती है। आगे मन ही मन कहने और मौन होने का निर्देश होने के कारण मुख्य पाठ में व्यापक अर्थ “काँपो” रखा गया है; क्रोध वाला प्राचीन और प्रभावशाली पाठ-समझ फुटनोट में सुरक्षित है।
- issue: וְדֹמּוּ में मौन और स्थिरता का संबंध
  choice: “चुप रहो”
  alternative: “शांत हो जाओ”
  rationale: क्रिया दोनों अर्थों को समेट सकती है। मुख्य पाठ में वाणी के रुकने पर बल है, जबकि वैकल्पिक अर्थ फुटनोट में देकर आंतरिक स्थिरता की संभावना सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, काव्यात्मक और गरिमापूर्ण शैली रखी गई है। “मन ही मन कहो” इब्रानी के शाब्दिक “अपने हृदय में कहो” को स्वाभाविक हिन्दी में व्यक्त करते हुए आंतरिक आत्म-संवाद का भाव बनाए रखता है।
