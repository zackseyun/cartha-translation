source:
  edition: WLC
  text: וּ/דְע֗וּ כִּֽי הִפְלָ֣ה יְ֭הוָה חָסִ֣יד ל֑/וֹ יְהוָ֥ה יִ֝שְׁמַ֗ע בְּ/קָרְאִ֥/י אֵלָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/004/003.yaml
  text: And know that Yahweh has set apart the godly for himself[b][a]; Yahweh hears when I call to him.
translation:
  language: hi
  text: और जान लो कि याहवे ने भक्त को अपने लिए अलग ठहराया है[a]; जब मैं उसे पुकारता हूँ, तब याहवे मेरी पुकार सुनता है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने निष्ठावान जन को अपने लिए विशिष्ट किया है।” हिब्रू शब्द वाचा-संबंधी निष्ठा या भक्ति पर बल दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “जब मैं उसे पुकारूँगा, तब याहवे मेरी पुकार सुनेगा।” हिब्रू क्रिया नियमित वर्तमान या विश्वासपूर्ण भविष्य के रूप में समझी जा सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּדְעוּ
  choice: और जान लो
  rationale: बहुवचन आज्ञार्थक रूप श्रोताओं से इस तथ्य को पहचानने को कहता है। आरंभिक ו को सामान्य संयोजक ‘और’ के रूप में रखा गया है; संदर्भ में ‘परन्तु’ संभव है, पर अनिवार्य नहीं।
- source_word: כִּי
  choice: कि
  rationale: यह उस बात की विषयवस्तु प्रस्तुत करता है जिसे श्रोताओं को जानना है; हिंदी में ‘जान लो कि’ स्वाभाविक है।
- source_word: הִפְלָה
  choice: अलग किया है
  rationale: हिफ़ील रूप यहाँ किसी को विशिष्ट या विशेष रूप से अपने लिए पृथक करने का भाव देता है। ‘अलग किया है’ इस अर्थ को सहज आधुनिक हिंदी में व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम को किसी उपाधि से बदलने के बजाय लिप्यंतरित किया गया है।
- source_word: חָסִיד
  choice: भक्त जन
  rationale: यह शब्द भक्ति, निष्ठा और वाचा-संबंधी वफ़ादारी से पहचाने जाने वाले व्यक्ति को सूचित कर सकता है। ‘भक्त जन’ सामान्य पाठक के लिए सहज है, जबकि वैकल्पिक अर्थ पाद-टिप्पणी में सुरक्षित है।
- source_word: לוֹ
  choice: अपने लिए
  rationale: पूर्वसर्ग और सर्वनाम-प्रत्यय बताते हैं कि उस जन को विशेष रूप से याहवे के लिए अलग किया गया है; हिंदी का आत्मवाचक प्रयोग इसे स्पष्ट करता है।
- source_word: יִשְׁמַע
  choice: मेरी सुनता है
  rationale: अपूर्ण क्रिया यहाँ नियमित वर्तमान या विश्वासपूर्ण भविष्य व्यक्त कर सकती है। वर्तमान काल भजनकार के भरोसे को स्वाभाविक हिंदी में व्यक्त करता है, और भविष्य का विकल्प पाद-टिप्पणी में रखा गया है।
- source_word: בְּקָרְאִי אֵלָיו
  choice: जब मैं उसे पुकारता हूँ
  rationale: ב के साथ infinitive construct समय-संबंधी परिस्थिति बताता है; ‘जब मैं उसे पुकारता हूँ’ दिशा और समय दोनों को सहज हिंदी में व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा
  rationale: मूल पाठ में वाचा का व्यक्तिगत नाम सीधे आया है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और उसे ‘प्रभु’ जैसी उपाधि से नहीं बदलता।
- issue: חָסִיד का आशय
  choice: भक्त जन
  alternative: निष्ठावान जन
  rationale: शब्द में भक्ति और वाचा-संबंधी निष्ठा दोनों के आयाम हैं। मुख्य पाठ में सहज व्यापक अभिव्यक्ति रखी गई है और अधिक स्पष्ट निष्ठा-संबंधी विकल्प पाद-टिप्पणी में दिया गया है।
- issue: יִשְׁמַע का कालगत बल
  choice: मेरी सुनता है
  alternative: मेरी सुनेगा
  rationale: हिब्रू अपूर्ण रूप नियमित वर्तमान या भरोसे से कहे गए भविष्य—दोनों अर्थ दे सकता है। मुख्य पाठ वर्तमान विश्वास व्यक्त करता है, पर भविष्य की संभावना को पाद-टिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिंदी पाठक के लिए सहज रखी गई है। काव्यात्मक समानांतरता और भजनकार का विश्वास बनाए रखते हुए मूल की कालगत तथा शब्दार्थगत अस्पष्टताओं को पाद-टिप्पणियों में सुरक्षित किया गया है।
