  text: רַבִּ֥ים אֹמְרִים֮ מִֽי יַרְאֵ֪/נ֫וּ ט֥וֹב נְֽסָ/ה עָ֭לֵי/נוּ א֨וֹר פָּנֶ֬י/ךָ יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/004/006.yaml
  text: Many are saying[a], “Who will show us good? Lift up the light of your face upon us[c][b], O Yahweh.”
translation:
  language: hi
  text: बहुत-से लोग कह रहे हैं, “कौन हमें भलाई दिखाएगा?[a] हे याहवे,[b] अपने मुख का प्रकाश हम पर चमका दे।”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “कौन हमें अच्छी वस्तुएँ देखने देगा?” हिब्रू क्रिया का कारणवाचक भाव “दिखाना” या “देखने देना” है।
    reason: lexical_alternative
  - marker: b
    text: हिब्रू YHWH, परमेश्वर का व्यक्तिगत नाम; इसे ‘याहवे’ लिखा गया है। परंपरागत अनुवादों में ‘प्रभु’ भी मिलता है।
    reason: alternative_reading
  - marker: c
    text: शाब्दिक रूप से, “अपने मुख का प्रकाश हम पर उठा।” हिब्रू क्रिया का रूप कठिन है; यहाँ इसे मुख के प्रकाश के हम पर चमकने के अर्थ में लिया गया है। “मुख का प्रकाश” ईश्वरीय कृपा और अनुग्रहपूर्ण उपस्थिति का काव्यात्मक बिंब है।
    reason: textual_and_lexical_alternative
lexical_decisions:
- source_word: רַבִּים אֹמְרִים
  choice: बहुत-से लोग कह रहे हैं
  rationale: बहुवचन विशेषण का व्यक्तिवाचक प्रयोग और कृदंत की जारी या प्रचलित वाणी—दोनों को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: מִי יַרְאֵנוּ טוֹב
  choice: कौन हमें भलाई दिखाएगा?
  rationale: हिफ़ील क्रिया का कारणवाचक भाव ‘दिखाएगा’ में सुरक्षित है; טוֹב को व्यापक अर्थ वाली ‘भलाई’ कहा गया है, किसी खास प्रकार की समृद्धि तक सीमित नहीं किया गया।
- source_word: נְסָה עָלֵינוּ
  choice: हम पर चमका
  rationale: दुर्लभ आज्ञार्थक रूप को मुख के प्रकाश वाले काव्य-बिंब के अनुरूप समझकर सहज हिन्दी में प्रस्तुत किया गया है। पाठगत और व्युत्पत्तिगत अनिश्चितता पादटिप्पणी में रखी गई है।
- source_word: אוֹר פָּנֶיךָ
  choice: अपने मुख का प्रकाश
  rationale: ईश्वरीय अनुग्रह या कृपामय उपस्थिति के मानवाकार काव्य-बिंब को व्याख्यात्मक रूप से सपाट किए बिना बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में प्रचलित प्रतिलेखन द्वारा परमेश्वर के व्यक्तिगत नाम को शीर्षक से प्रतिस्थापित करने के बजाय सुरक्षित रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल में व्यक्तिगत नाम है। हिन्दी पाठकों के लिए सुपरिचित ‘यहोवा’ नाम को प्रत्यक्ष रखता है; ‘प्रभु’ नाम को उपाधि में बदल देता।
- issue: ‘अपने मुख का प्रकाश’ का मानवाकार बिंब
  choice: बिंब को मुख्य पाठ में बनाए रखना
  alternative: अपनी कृपा हम पर कर; अपनी उपस्थिति से हमें अनुगृहीत कर
  rationale: मूल कविता ईश्वरीय कृपा और सान्निध्य को चमकते मुख के रूपक से व्यक्त करती है; इसे बनाए रखने से काव्यात्मक और धर्मवैचारिक तनाव सुरक्षित रहता है।
- issue: नְסָה की कठिन पाठ-व्याख्या
  choice: चमका
  alternative: उठा; हमारे ऊपर निशान के समान खड़ा कर
  rationale: संदर्भ में मुख के प्रकाश का हम पर चमकना स्वाभाविक अर्थ देता है, किंतु हिब्रू रूप दुर्लभ है; इसलिए विकल्प पादटिप्पणी में स्पष्ट किया गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और बोलचाल में समझ आने वाली हिन्दी। ‘बहुत-से’ सामूहिक अनिश्चितता को व्यक्त करता है; ‘मुख का प्रकाश’ मूल काव्य-बिंब को सुरक्षित रखता है। संबोधन ‘हे यहोवा’ प्रार्थना को उसी प्रत्यक्ष कथन के भीतर रखता है।
