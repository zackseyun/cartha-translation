base_translation:
  language: en
  yaml_path: translation/ot/psalms/004/002.yaml
  text: Sons of men[a], how long will my honor be turned into shame? Will you love emptiness and seek falsehood? Selah
translation:
  language: hi
  text: हे मनुष्यो, कब तक तुम मेरे सम्मान[a] को अपमान में बदलोगे, निरर्थकता से प्रेम करोगे और झूठ की तलाश करोगे? सेला
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरी महिमा।” इब्रानी शब्द सम्मान, महिमा या गरिमा का भाव व्यक्त कर सकता है; यहाँ संभवतः भजनकार की सार्वजनिक रूप से अपमानित प्रतिष्ठा की बात है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי אִישׁ
  choice: हे मनुष्यो
  rationale: शाब्दिक रूप ‘मनुष्य के पुत्रो’ है, पर यहाँ यह पुरुष-वाचक बहुवचन में विरोधियों को संबोधित करने का इब्रानी मुहावरा है। ‘हे मनुष्यो’ आधुनिक हिन्दी में स्वाभाविक रहते हुए संबोधन की अलंकारिक शक्ति बनाए रखता है।
- source_word: עַד מֶה
  choice: कब तक
  rationale: समय-संबंधी विरोधात्मक प्रश्न के लिए यह स्वाभाविक हिन्दी अभिव्यक्ति है।
- source_word: כְבוֹדִי
  choice: मेरे सम्मान
  rationale: כָּבוֹד का अर्थ ‘सम्मान’ या ‘महिमा’ हो सकता है। सार्वजनिक अपमान के संदर्भ में ‘सम्मान’ अधिक स्वाभाविक है, जबकि ‘महिमा’ को पादटिप्पणी में वास्तविक विकल्प के रूप में रखा गया है।
- source_word: לִכְלִמָּה
  choice: को अपमान में बदलते रहोगे
  rationale: לְ यहाँ परिणाम की ओर संकेत करता है। इब्रानी में निहित क्रियात्मक भाव को हिन्दी में स्पष्ट करने के लिए ‘अपमान में बदलते’ कहा गया है।
- source_word: תֶּאֱהָבוּן רִיק
  choice: निरर्थकता से प्रेम करते
  rationale: רִיק खालीपन, व्यर्थता या निरर्थकता को दर्शाता है। ‘निरर्थकता’ अमूर्त अर्थ को बनाए रखता है और כָזָב के समानांतर स्वाभाविक बैठता है। अपूर्ण क्रिया को ‘कब तक’ के प्रभाव में जारी व्यवहार के रूप में व्यक्त किया गया है।
- source_word: תְּבַקְשׁוּ כָזָב
  choice: झूठ के पीछे भागते
  rationale: בקשׁ का मूल भाव खोजने या पाने का प्रयत्न करना है। इस फटकार में ‘पीछे भागते’ सक्रिय अनुसरण को स्वाभाविक हिन्दी में व्यक्त करता है; כָזָב के लिए सीधा और सामान्य शब्द ‘झूठ’ चुना गया है।
- source_word: סֶלָה
  choice: सेला
  rationale: इस उपासना-संबंधी संकेत का ठीक अर्थ अनिश्चित है, इसलिए अर्थ निर्धारित करने के बजाय लिप्यंतरण किया गया है।
theological_decisions:
- issue: ‘मेरे सम्मान’ का आशय
  choice: वक्ता के सम्मान को सामान्य रूप में रखा गया है; यह नहीं बताया गया कि वह राजकीय प्रतिष्ठा है या परमेश्वर से मिला सम्मान।
  alternative: ‘मेरी महिमा’ अथवा ‘परमेश्वर से मिला मेरा सम्मान’
  rationale: इब्रानी व्यापक अर्थ की अनुमति देता है। अनुवाद किसी विशेष राजकीय या धर्मवैज्ञानिक व्याख्या को अनावश्यक रूप से निश्चित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। एक ही ‘कब तक’ को तीनों समानांतर क्रियाओं पर लागू रखकर इब्रानी काव्य की संयुक्त फटकार और निरंतरता का भाव सुरक्षित किया गया है।
