  text: In peace I will both lie down and sleep[a], for you alone, O Yahweh[b], make me dwell in safety.
translation:
  language: hi
  text: मैं शांति से लेटूँगा और सोऊँगा[a], क्योंकि हे याहवे, केवल तू ही मुझे सुरक्षित बसाता है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं शांति से एक साथ लेटूँगा और सोऊँगा।” इब्रानी क्रियाविशेषण का अर्थ “एक साथ” या “पूरी तरह” हो सकता है; मुख्य पाठ में इसका बल दोनों क्रियाओं के संयुक्त कथन से व्यक्त किया गया है।
    reason: lexical_alternative
  - marker: b
    text: या, “क्योंकि हे याहवे, तू मुझे अकेले सुरक्षित बसाता है।” इब्रानी वाक्य-रचना में “अकेले” भजनकार के बसने का वर्णन भी कर सकता है; मुख्य पाठ इसे “तू” से जोड़ता है।
    reason: alternative_reading
lexical_decisions:
- source_word: בְּשָׁלוֹם
  choice: शान्ति से
  rationale: यहाँ שָׁלוֹם शान्ति, कुशलता और पूर्ण सुरक्षित अवस्था का बोध कराता है; ‘शान्ति से’ सोने के प्रसंग में स्वाभाविक हिन्दी है।
- source_word: יַחְדָּו
  choice: लेटूँगा और सो जाऊँगा
  rationale: शाब्दिक अर्थ ‘एक साथ/पूरी तरह’ है। दो क्रियाओं के साथ इसका संयुक्त बल हिन्दी में स्वाभाविक रूप से ‘लेटूँगा और सो जाऊँगा’ द्वारा व्यक्त होता है; शाब्दिक विकल्प पादटिप्पणी में सुरक्षित है।
- source_word: אֶשְׁכְּבָה וְאִישָׁן
  choice: लेटूँगा और सो जाऊँगा
  rationale: इन अपूर्ण क्रियारूपों में भरोसे से भरे संकल्प अथवा निकट भविष्य का भाव है। ‘सो जाऊँगा’ हिन्दी में लेटने के बाद नींद आने को सहज ढंग से व्यक्त करता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह भजनकार के शान्तिपूर्वक विश्राम का कारण प्रस्तुत करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ के व्यक्तिगत ईश्वरीय नाम को हिन्दी में प्रचलित लिप्यन्तरण ‘यहोवा’ से रखा गया है, न कि किसी उपाधि से बदला गया है।
- source_word: לְבָדָד
  choice: केवल तू ही
  rationale: मुख्य पाठ में इसे ‘तू’ से जोड़कर परमेश्वर को सुरक्षा का एकमात्र कर्ता माना गया है; दूसरी सम्भव व्याकरणिक रचना पादटिप्पणी में दी गई है।
- source_word: לָבֶטַח
  choice: सुरक्षा में
  rationale: בֶּטַח निर्भय और सुरक्षित अवस्था को दर्शाता है; ‘सुरक्षा में’ बसने की क्रिया के साथ अर्थ को स्पष्ट रखता है।
- source_word: תּוֹשִׁיבֵנִי
  choice: मुझे ... बसाता है
  rationale: ישׁב का हिफ़ील रूप कारक अर्थ देता है—‘बसाना/सुरक्षित निवास देना’। यह अनुवाद उस कारक बल को सहज हिन्दी में बनाए रखता है।
theological_decisions:
- issue: לְבָדָד का सम्बन्ध और बल
  choice: ‘केवल तू ही’—यहोवा अकेला भजनकार को सुरक्षित बसाता है।
  alternative: ‘तू मुझे अकेले सुरक्षा में बसाता है’—अर्थात ‘अकेले’ भजनकार के निवास का वर्णन करे।
  rationale: शब्दक्रम और प्रसंग मुख्य पाठ में इसे संबोधित कर्ता ‘तू’ से जोड़ने के पक्ष में हैं, पर दूसरी व्याकरणिक सम्भावना वास्तविक है और इसलिए पादटिप्पणी में रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी की सरल, गरिमापूर्ण और काव्यात्मक शैली अपनाई गई है। ‘शान्ति’, ‘यहोवा’ और ‘बसाता है’ जैसे शब्द मूल के प्रमुख अर्थों को रखते हुए सामान्य पाठक के लिए बोधगम्य हैं।
