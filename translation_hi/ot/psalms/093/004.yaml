id: PSA.93.4
reference: Psalms 93:4
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: מִ/קֹּל֨וֹת מַ֤יִם רַבִּ֗ים אַדִּירִ֣ים מִשְׁבְּרֵי יָ֑ם אַדִּ֖יר בַּ/מָּר֣וֹם יְהוָֽה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/093/004.yaml
  text: More majestic than the sound of many waters[a], than the mighty breakers of the sea[b], is Yahweh on high.
translation:
  language: hi
  text: बहुत से जलों के नाद से, समुद्र की शक्तिशाली टूटती लहरों से भी अधिक शक्तिशाली, ऊँचाई पर याहवे[b] है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी पंक्ति को इस प्रकार भी समझा जा सकता है: “बहुत से जलों की गर्जनाएँ शक्तिशाली हैं, समुद्र की टूटती लहरें शक्तिशाली हैं; ऊँचाई पर याहवे शक्तिशाली है।”'
    reason: मूल इब्रानी की संक्षिप्त काव्य-रचना में तुलना और पंक्ति-विभाजन संबंधी संभावित वैकल्पिक समझ को सुरक्षित रखना।
  - marker: b
    text: इब्रानी में YHWH; इसका लिप्यंतरण “याहवे” किया गया है। परंपरागत रूप से इसे “प्रभु” कहा गया है।
    reason: ईश्वरीय नाम के लिप्यंतरण और पारंपरिक शीर्षक-रूप की जानकारी देना।
lexical_decisions:
- source_word: מִקֹּלוֹת
  choice: गर्जना से
  rationale: מִן को प्रसंगानुसार तुलनात्मक ‘से’ माना गया है। जल के लिए קוֹל का स्वाभाविक और काव्यात्मक हिन्दी रूप ‘गर्जना’ है, जो उसकी ध्वनि और प्रचंडता दोनों व्यक्त करता है।
- source_word: מַיִם רַבִּים
  choice: बहुत से जलों
  rationale: यह रूप इब्रानी के ‘बहुत से/विशाल जल’ वाले काव्यात्मक मुहावरे को बनाए रखता है और इसे केवल ‘समुद्र’ कहकर सीमित नहीं करता।
- source_word: אַדִּירִים
  choice: प्रतापी
  rationale: यह शब्द सामर्थ्य, भव्यता और गौरव का भाव रखता है। ‘प्रतापी’ समुद्री लहरों की प्रचंडता और पद की राजसी काव्यात्मकता दोनों को सँभालता है।
- source_word: מִשְׁבְּרֵי יָם
  choice: समुद्र की ... लहरों
  rationale: מִשְׁבָּר समुद्र की टूटती, प्रहार करती लहर को दर्शाता है। साधारण पाठक के लिए ‘लहरों’ स्वाभाविक है; साथ का ‘प्रतापी’ उनकी प्रचंडता स्पष्ट करता है।
- source_word: אַדִּיר
  choice: अधिक प्रतापी
  rationale: यहोवा के विषय में यही मूल विशेषण फिर आता है। ‘प्रतापी’ lexical पुनरावृत्ति और राजकीय महिमा को बनाए रखता है; ‘अधिक’ तुलनात्मक מִן को स्पष्ट करता है।
- source_word: בַּמָּרוֹם
  choice: ऊँचे स्थान में
  rationale: यह ऊँचाई और उत्कर्ष का संकेत देता है। ‘स्वर्ग में’ कहने से बचकर मूल की स्थानगत और प्रतीकात्मक व्यापकता सुरक्षित रखी गई है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से दिया गया है, किसी उपाधि से प्रतिस्थापित नहीं किया गया।
theological_decisions:
- issue: आरंभिक מִן की तुलनात्मक शक्ति
  choice: यहोवा को जलों और समुद्री लहरों से अधिक प्रतापी बताया गया है।
  alternative: पंक्ति को इस प्रकार भी बाँटा जा सकता है कि बहुत से जलों और समुद्री लहरों को प्रतापी कहा जाए, और फिर ऊँचे स्थान में यहोवा के प्रताप की अलग घोषणा हो।
  rationale: आरंभ का מִן स्वाभाविक रूप से तुलना व्यक्त करता है, और अंतिम אַדִּיר उसका मुख्य विधेय बनता है। फिर भी इब्रानी काव्य की संक्षिप्त रचना दूसरी पंक्ति-विभाजन की कुछ संभावना छोड़ती है, इसलिए उसे पादटिप्पणी में रखा गया है।
- issue: ईश्वरीय नाम יְהוָה का रूप
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल में व्यक्तिगत नाम सीधे आया है। हिन्दी पाठकों में परिचित ‘यहोवा’ उसे नाम के रूप में बनाए रखता है; पादटिप्पणी वैकल्पिक लिप्यंतरण और पारंपरिक उपाधि बताती है, बिना किसी संप्रदायगत निष्कर्ष के।
translation_notes:
  register: भाषा आधुनिक, गरिमामय और काव्यात्मक रखी गई है। ‘गर्जना’ श्रव्य बिंब को जीवंत करती है, जबकि ‘प्रतापी’ मूल शब्द की सामर्थ्य और राजसी भव्यता दोनों को सँभालता तथा उसकी पुनरावृत्ति को सुरक्षित रखता है।
