source:
  edition: WLC
  text: נָכ֣וֹן כִּסְאֲ/ךָ֣ מֵ/אָ֑ז מֵֽ/עוֹלָ֣ם אָֽתָּה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/093/002.yaml
  text: Your throne is established from of old[a]; you are from everlasting.
translation:
  language: hi
  text: तेरा सिंहासन प्राचीनकाल से स्थिर है[a]; तू अनादिकाल से है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तेरा सिंहासन आदिकाल से स्थापित है; तू सदा से है।”
    reason: מֵאָז और מֵעוֹלָם के वैकल्पिक कालसूचक अनुवाद तथा נָכוֹן के ‘स्थापित’ अर्थ को दर्शाने के लिए।
lexical_decisions:
- source_word: נָכוֹן
  choice: स्थिर है
  rationale: यह रूप किसी पूर्व क्रिया पर ज़ोर देने के बजाय दृढ़ और स्थापित अवस्था बताता है; ‘स्थिर है’ हिंदी में इस भाव को संक्षिप्त और स्वाभाविक रूप से व्यक्त करता है।
- source_word: כִּסְאֲךָ
  choice: तेरा सिंहासन
  rationale: כִּסֵּא का सामान्य अर्थ ‘सिंहासन’ है और द्वितीय पुरुष एकवचन प्रत्यय को ‘तेरा’ से सीधे व्यक्त किया गया है।
- source_word: מֵאָז
  choice: प्राचीनकाल से
  rationale: संदर्भ में यह किसी हाल के निश्चित समय के बजाय बहुत पुराने समय की ओर संकेत करता है; ‘प्राचीनकाल से’ आधुनिक हिंदी में स्पष्ट और काव्यात्मक है।
- source_word: מֵעוֹלָם
  choice: अनादिकाल से
  rationale: परमेश्वर के विषय में עוֹלָם यहाँ आरंभ से परे अथवा असीम प्राचीनता का बोध देता है; ‘अनादिकाल से’ भविष्यकाल का अर्थ जोड़े बिना इस भाव को व्यक्त करता है।
- source_word: אָתָּה
  choice: तू … है
  rationale: स्वतंत्र सर्वनाम पूर्ववर्ती कालसूचक पद के साथ विधेयात्मक है; हिंदी में स्वाभाविक वाक्य के लिए ‘है’ जोड़ा गया है।
theological_decisions:
- issue: परमेश्वर के अस्तित्व के लिए कालसूचक भाषा
  choice: तू अनादिकाल से है
  alternative: तू सदा से है
  rationale: यह अनुवाद परमेश्वर के आरंभ-रहित अस्तित्व की पुष्टि करता है, पर मूल पाठ से आगे बढ़कर कोई दार्शनिक परिभाषा नहीं जोड़ता।
- issue: सिंहासन की प्राचीनता और दृढ़ता
  choice: तेरा सिंहासन प्राचीनकाल से स्थिर है
  alternative: तेरा सिंहासन आदिकाल से स्थापित है
  rationale: नָכוֹן की स्थिर अवस्था और מֵאָז की दूरस्थ प्राचीनता दोनों को बनाए रखा गया है; वाक्य यह निर्धारित नहीं करता कि सिंहासन को किस समय या किसके द्वारा स्थापित किया गया।
translation_notes:
  register: आधुनिक मानक हिंदी में संक्षिप्त, गरिमापूर्ण और काव्यात्मक शैली रखी गई है। परमेश्वर को संबोधित करने के लिए भजन की सीधी और निकट संबोधन-शैली के अनुरूप ‘तू/तेरा’ का प्रयोग किया गया है।
