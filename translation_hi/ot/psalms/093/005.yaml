source:
  edition: WLC
  text: עֵֽדֹתֶ֨י/ךָ נֶאֶמְנ֬וּ מְאֹ֗ד לְ/בֵיתְ/ךָ֥ נַאֲוָה קֹ֑דֶשׁ יְ֝הוָ֗ה לְ/אֹ֣רֶךְ יָמִֽים׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/093/005.yaml
  text: Your testimonies are very trustworthy[a]; holiness befits your house, O Yahweh[b], for length of days.
translation:
  language: hi
  text: तेरी साक्षियाँ अत्यन्त विश्वसनीय हैं; हे याहवे, पवित्रता तेरे भवन को लम्बे समय तक शोभा देती है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सदा के लिए।” हिब्रू में शाब्दिक रूप से, “दिनों की लम्बाई तक।”
    reason: לְאֹרֶךְ יָמִים के सम्भावित स्थायित्व-अर्थ को दर्शाते हुए उसके शाब्दिक शब्दचित्र को सुरक्षित रखना।
lexical_decisions:
- source_word: עֵדֹתֶיךָ
  choice: तेरी साक्षियाँ
  rationale: यह शब्द परमेश्वर की साक्षी देने वाली वाचा-संबंधी घोषणाओं को सूचित करता है। ‘साक्षियाँ’ कानूनी अर्थ तक सीमित किए बिना मूल रूपक बनाए रखता है।
- source_word: נֶאֶמְנוּ מְאֹד
  choice: पूरी तरह भरोसेमंद हैं
  rationale: निफ़अल रूप दृढ़ता और विश्वसनीयता व्यक्त करता है; מְאֹד के बल को स्वाभाविक आधुनिक हिन्दी में ‘पूरी तरह’ से व्यक्त किया गया है।
- source_word: לְבֵיתְךָ
  choice: तेरे भवन को
  rationale: בַּיִת का मूल अर्थ ‘घर/भवन’ है और यहाँ उपासना-स्थान निहित है। ‘भवन’ गरिमापूर्ण है तथा ‘मन्दिर’ कहकर अर्थ को अनावश्यक रूप से संकीर्ण नहीं करता।
- source_word: נַאֲוָה קֹדֶשׁ
  choice: पवित्रता ... शोभा देती है
  rationale: नַאֲוָה उपयुक्त या शोभनीय होने का भाव देता है। हिन्दी में ‘शोभा देती है’ उपयुक्तता और सौन्दर्य, दोनों की छाया सुरक्षित रखता है।
- source_word: יְהוָה
  choice: यहवे
  rationale: चतुरक्षरीय दिव्य नाम को किसी उपाधि से बदलने के बजाय हिन्दी में उसके व्यक्तिगत नाम का लिप्यंतरण किया गया है।
- source_word: לְאֹרֶךְ יָמִים
  choice: सदा-सर्वदा
  rationale: शाब्दिक अर्थ ‘दिनों की लम्बाई तक’ है, पर सन्दर्भ में यह स्थायी अवधि का मुहावरा है। स्वाभाविक हिन्दी में ‘सदा-सर्वदा’ उसका आशय व्यक्त करता है; शाब्दिक रूप पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहवे
  alternative: यहोवा / प्रभु
  rationale: मूल में व्यक्तिगत वाचा-नाम है; इसलिए उपाधि ‘प्रभु’ से प्रतिस्थापित न करके उसका निकट हिन्दी लिप्यंतरण रखा गया है।
- issue: לְאֹרֶךְ יָמִים का सम्बन्ध और अर्थ
  choice: यह ‘पवित्रता तेरे भवन को शोभा देती है’ कथन को कालगत रूप से विशेषित करता है और ‘सदा-सर्वदा’ अनूदित है
  alternative: 'शाब्दिक: ‘लम्बे दिनों तक’ अथवा ‘दिनों की लम्बाई तक’'
  rationale: हिब्रू पदक्रम में सम्बोधन יְהוָה से वाक्य-विभाजन की कुछ सम्भावना बनी रहती है, पर अन्तिम वाक्यांश का सबसे स्वाभाविक सम्बन्ध भवन की स्थायी पवित्रता से है। मुहावरे का शाब्दिक चित्र पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। भजन की प्रार्थनात्मक निकटता बनाए रखने हेतु एकवचन अनौपचारिक-गरिमापूर्ण ‘तेरी/तेरे’ रखा गया है; ‘यहवे’ को सम्बोधन के रूप में स्पष्ट किया गया है।
