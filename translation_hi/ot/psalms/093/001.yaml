source:
  edition: WLC
  text: יְהוָ֣ה מָלָךְ֮ גֵּא֪וּת לָ֫בֵ֥שׁ לָבֵ֣שׁ יְ֭הוָה עֹ֣ז הִתְאַזָּ֑ר אַף תִּכּ֥וֹן תֵּ֝בֵ֗ל בַּל תִּמּֽוֹט־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/093/001.yaml
  text: Yahweh reigns[a]; he is clothed with majesty; Yahweh is clothed with strength; he has girded himself. Indeed, the world is established[e][d][c][b]; it will not be moved.
translation:
  language: hi
  text: याहवे राज्य करता है[a]; वह प्रताप ओढ़े हुए है। याहवे सामर्थ्य ओढ़े हुए है; उसने अपनी कमर कसी है[b]। निश्चय ही जगत दृढ़ता से स्थापित है; वह डगमगाएगा नहीं[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “याहवे राजा हो गया है”; इब्रानी क्रिया आगमनात्मक अर्थ भी दे सकती है, यद्यपि यहाँ उसके वर्तमान राजत्व की घोषणा अधिक सम्भावित है।
    reason: alternative_reading
  - marker: b
    text: शाब्दिक रूप से, “उसने स्वयं को कमरबंद किया है”; बिंब सामर्थ्य को कमरबंद या युद्ध-सज्जा की तरह धारण करने का है।
    reason: cultural_note
  - marker: c
    text: या, “आबाद जगत दृढ़ता से स्थिर किया गया है; वह नहीं लड़खड़ाएगा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम को उपाधि से बदलने के बजाय हिन्दी लिप्यंतरण में रखा गया है।
- source_word: מָלָךְ
  choice: राज्य करता है
  rationale: यहाँ क्रिया याहवे के वर्तमान और निरंतर राजत्व की घोषणा करती है; आगमनात्मक अर्थ सम्भव है, इसलिए उसे पादटिप्पणी में रखा गया है।
- source_word: גֵּאוּת
  choice: प्रताप
  rationale: याहवे के संदर्भ में यह ऊँची महिमा और राजसी वैभव को दर्शाता है; ‘प्रताप’ आधुनिक हिन्दी में गरिमापूर्ण और सहज है।
- source_word: לָבֵשׁ
  choice: वस्त्र पहने हुए है
  rationale: वस्त्र धारण करने का मूल काव्यात्मक रूपक बनाए रखते हुए स्वाभाविक हिन्दी दी गई है।
- source_word: עֹז
  choice: सामर्थ्य
  rationale: यह राजसी और प्रभावशाली शक्ति को व्यक्त करता है तथा भजन की गरिमा के अनुकूल है।
- source_word: הִתְאַזָּר
  choice: उसने कमर कस ली है
  rationale: आत्मवाचक ‘कमर बाँधने’ के बिंब को स्वाभाविक हिन्दी मुहावरे में सुरक्षित रखा गया है।
- source_word: אַף
  choice: निश्चय ही
  rationale: यह अगले कथन को जोर देकर पुष्ट करता है।
- source_word: תִּכּוֹן
  choice: दृढ़ता से स्थापित है
  rationale: निफ़अल रूप स्थापित और स्थिर किए जाने की अवस्था बताता है; ‘दृढ़ता से’ स्थायित्व के भाव को स्पष्ट करता है।
- source_word: תֵּבֵל
  choice: संसार
  rationale: यह व्यवस्थित, आबाद जगत को सूचित करता है; ‘संसार’ संक्षिप्त और स्वाभाविक हिन्दी समतुल्य है।
- source_word: בַּל תִּמּוֹט
  choice: वह नहीं डगमगाएगा
  rationale: यह अस्थिर होने या लड़खड़ाने के निषेध को दर्शाता है और संसार की दृढ़ता के काव्यात्मक बिंब को बनाए रखता है।
theological_decisions:
- issue: יְהוָה परमेश्वर के नाम का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में प्रयुक्त चतुरक्षरीय व्यक्तिगत नाम को उपाधि से प्रतिस्थापित न करके लिप्यंतरित किया गया है।
- issue: מָלָךְ का कालगत/पक्षगत अर्थ
  choice: 'वर्तमान घोषणा: ‘राज्य करता है’'
  alternative: ‘राजा हो गया है’
  rationale: राज्यारोहण-भजन के संदर्भ में यह याहवे के विद्यमान राजत्व की घोषणा सबसे स्वाभाविक रूप से करता है, पर आगमनात्मक अर्थ की वास्तविक सम्भावना पादटिप्पणी में सुरक्षित है।
- issue: संसार की अचलता का कथन
  choice: काव्यात्मक ब्रह्मांडीय व्यवस्था की घोषणा के रूप में यथावत
  alternative: रूपक को किसी विशिष्ट आधुनिक ब्रह्मांड-विज्ञान के अनुसार समझाना
  rationale: मूल कथन स्थिरता और स्थापित व्यवस्था पर बल देता है; अनुवाद उसमें बाहरी वैज्ञानिक या सांप्रदायिक व्याख्या नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण काव्यात्मक शैली रखी गई है। समानांतर पदों और वस्त्र/कमर कसने के मूल बिंब सुरक्षित हैं; वाक्य इतने सरल रखे गए हैं कि सामान्य पाठक सहजता से समझ सके।
