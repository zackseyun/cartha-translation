  yaml_path: translation/ot/psalms/093/003.yaml
  text: The rivers have lifted up[a], O Yahweh; the rivers have lifted up their voice[b]; the rivers lift up their pounding waves.
translation:
  language: hi
  text: 'हे याहवे, नदियाँ उठी हैं[a];

    नदियों ने अपना स्वर ऊँचा किया है;

    नदियाँ अपनी प्रचंड लहरें उठा रही हैं[b]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘नदियाँ’ के स्थान पर ‘बाढ़ का जल’ या ‘उफनती धाराएँ’ भी संभव हैं। इब्रानी शब्द का सामान्य अर्थ ‘नदियाँ’ है, पर यहाँ उग्र जल की छवि भी हो सकती है।
    reason: lexical_alternative
  - marker: b
    text: इस दुर्लभ इब्रानी शब्द का अर्थ-क्षेत्र ‘प्रहार’, ‘टकराती लहरें’, ‘गर्जन’ या ‘जल के प्रचंड आघात’ से संबंधित हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: נָשְׂאוּ / יִשְׂאוּ
  choice: उमड़ उठी हैं / उठा रही हैं
  rationale: נשׂא का मूल भाव ‘उठाना/उठना’ है। पहली पंक्ति में हिन्दी का ‘उमड़ उठना’ जल की गति को स्वाभाविक रूप से व्यक्त करता है; अंतिम पंक्ति में ‘उठा रही हैं’ इब्रानी की क्रमिक, चरमोत्कर्ष वाली पुनरावृत्ति बनाए रखता है।
- source_word: נְהָרוֹת
  choice: नदियाँ
  rationale: इस संज्ञा का सामान्य और सीधा अर्थ ‘नदियाँ’ है। प्रसंग में अराजक या बाढ़ के जल का संकेत संभव है, पर उसे मुख्य पाठ में अनिवार्य नहीं किया गया।
- source_word: יְהוָה
  choice: हे यहवे
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत नाम सीधे संबोधन में आया है; ‘हे यहवे’ हिन्दी में इस संबोधन को स्पष्ट और गरिमापूर्ण रखता है।
- source_word: קוֹלָם
  choice: अपना स्वर
  rationale: קוֹל का अर्थ ‘स्वर/आवाज़/ध्वनि’ हो सकता है। ‘अपना स्वर ऊँचा किया’ नदियों के मानवीकरण और काव्यात्मक समानांतरता को बनाए रखता है।
- source_word: דָּכְיָם
  choice: अपनी प्रचंड लहरें
  rationale: यह दुर्लभ शब्द जल के प्रहार, टकराहट या टूटती हुई लहरों को सूचित करता है। ‘प्रचंड लहरें’ आधुनिक पाठक के लिए स्पष्ट है और जल की जोरदार गति व्यक्त करता है।
theological_decisions:
- issue: दिव्य नाम יהוה का अनुवाद
  choice: यहवे
  alternative: यहोवा; प्रभु
  rationale: यहाँ उपाधि नहीं, चार अक्षरों वाला व्यक्तिगत दिव्य नाम है। लिप्यंतरण ‘यहवे’ नाम और सीधे संबोधन दोनों को सुरक्षित रखता है।
- issue: नदियों और अराजक जल का संबंध
  choice: मुख्य पाठ में ‘नदियाँ’, टिप्पणी में ‘बाढ़ का जल’
  alternative: मुख्य पाठ में ‘बाढ़ें’
  rationale: संदर्भ उग्र अथवा अराजक जल की छवि दे सकता है, पर נְהָרוֹת का सामान्य अर्थ ‘नदियाँ’ है; इसलिए संभावित व्यापक अर्थ को पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, काव्यात्मक और गरिमापूर्ण शैली रखी गई है। तीनों पंक्तियों की समानांतर रचना और बढ़ती हुई तीव्रता सुरक्षित है। ‘उमड़ उठी हैं’ शाब्दिक ‘उठी हैं’ की अपेक्षा हिन्दी में अधिक स्वाभाविक जल-चित्र देता है, जबकि अंतिम पंक्ति में ‘उठा रही हैं’ मूल क्रिया की पुनरावृत्ति को सुनाई देता है।
