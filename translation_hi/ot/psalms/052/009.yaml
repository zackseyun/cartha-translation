  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/אֲנִ֤י כְּ/זַ֣יִת רַ֭עֲנָן בְּ/בֵ֣ית אֱלֹהִ֑ים בָּטַ֥חְתִּי בְ/חֶֽסֶד אֱ֝לֹהִ֗ים עוֹלָ֥ם וָ/עֶֽד׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/052/009.yaml
  text: But as for me[a], I am like a flourishing olive tree in the house of God[b]; I trust in the steadfast love of God forever and ever.
translation:
  language: hi
  text: पर मैं तो परमेश्वर के भवन में हरे-भरे जैतून के वृक्ष[a] के समान हूँ; मैं सदा-सर्वदा परमेश्वर के अटल प्रेम[b] पर भरोसा रखता हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘फलते-फूलते जैतून के वृक्ष’ अथवा ‘ताज़े जैतून के वृक्ष’। हिब्रू विशेषण हरियाली, ताज़गी और जीवन-शक्ति पर बल देता है।
    reason: lexical_alternative
  - marker: b
    text: ‘अटल प्रेम’ हिब्रू शब्द חֶסֶד (खेसेद) का अनुवाद है, जो प्रायः परमेश्वर के निष्ठावान और वाचा-संबंधी प्रेम को दर्शाता है; अन्य सम्भव अनुवाद हैं ‘निष्ठावान प्रेम’, ‘करुणा’ या ‘वाचा का प्रेम’।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: पर मैं तो
  rationale: संयोजक और स्वतंत्र सर्वनाम पिछले संदर्भ के दुष्ट व्यक्ति के साथ स्पष्ट विरोध प्रकट करते हैं; ‘पर मैं तो’ आधुनिक हिन्दी में इस बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: כְּזַיִת
  choice: जैतून के वृक्ष के समान
  rationale: उपसर्ग כְּ तुलना दर्शाता है। זַיִת यहाँ वृक्ष की छवि है, इसलिए हिन्दी में ‘जैतून का वृक्ष’ स्पष्ट और स्वाभाविक है।
- source_word: רַעֲנָן
  choice: हरा-भरा
  rationale: यह विशेषण केवल रंग नहीं, बल्कि ताज़गी, जीवन और समृद्ध बढ़वार का भाव देता है; ‘हरा-भरा’ इस काव्यात्मक छवि को सहज हिन्दी में सुरक्षित रखता है।
- source_word: בְּבֵית אֱלֹהִים
  choice: परमेश्वर के भवन में
  rationale: यह सीधा अनुवाद पवित्रस्थान या मन्दिर से जुड़ी ‘परमेश्वर के घर’ की छवि बनाए रखता है; ‘भवन’ पद्य में गरिमापूर्ण और समझने योग्य है।
- source_word: בָּטַחְתִּי
  choice: मैं ... भरोसा रखता हूँ
  rationale: हिब्रू पूर्ण क्रिया यहाँ स्थापित और निरन्तर भरोसे की वर्तमान अवस्था व्यक्त कर सकती है; वर्तमानकालीन हिन्दी इस स्थायी विश्वास को स्पष्ट करती है।
- source_word: בְחֶסֶד
  choice: अटल प्रेम पर
  rationale: חֶסֶד में प्रेम, निष्ठा और स्थायी कृपा का संयुक्त भाव है। ‘अटल प्रेम’ संक्षेप में उसकी दृढ़ता और संबंधपरक आत्मीयता दोनों व्यक्त करता है।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: यहाँ सामान्य हिब्रू ईश्वरीय पद इस्राएल के परमेश्वर के लिए प्रयुक्त है; ‘परमेश्वर’ आधुनिक मानक हिन्दी का स्वाभाविक और गरिमापूर्ण रूप है।
- source_word: עוֹלָם וָעֶד
  choice: सदा-सर्वदा
  rationale: यह युग्म अनन्त अवधि पर विशेष बल देता है; ‘सदा-सर्वदा’ उस पुनरुक्त, तीव्र बल को संक्षिप्त काव्यात्मक हिन्दी में बनाए रखता है।
theological_decisions:
- issue: वाचा-संबंधी प्रसंग में חֶסֶד का अनुवाद
  choice: अटल प्रेम
  alternative: करुणा; निष्ठावान प्रेम; वाचा का प्रेम
  rationale: भजनकार का भरोसा परमेश्वर के स्थायी और निष्ठावान अनुग्रह पर आधारित है। ‘अटल प्रेम’ इस व्यापक धार्मिक अर्थ को बनाए रखता है, पर किसी विशेष सम्प्रदाय की शब्दावली या अत्यधिक संकीर्ण व्याख्या आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में स्वाभाविक, गरिमापूर्ण और काव्यात्मक शैली रखी गई है। ‘पर मैं तो’ प्रसंगगत विरोध को और ‘हरा-भरा’ जीवंत वृक्ष-छवि को उभारता है। ‘परमेश्वर के भवन’ से मूल पवित्रस्थान की छवि सुरक्षित रहती है, जबकि ‘अटल प्रेम’ חֶסֶד की प्रेमपूर्ण निष्ठा को बिना सम्प्रदायगत विस्तार के व्यक्त करता है।
