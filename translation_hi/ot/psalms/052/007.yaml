  text: וְ/יִרְא֖וּ צַדִּיקִ֥ים וְ/יִירָ֗אוּ וְ/עָלָ֥י/ו יִשְׂחָֽקוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/052/007.yaml
  text: 'The righteous will see and fear[b][a], and they will laugh at him:'
translation:
  language: hi
  text: 'धर्मी लोग देखेंगे और भयभीत होंगे[a], और उस पर हँसेंगे[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘डर जाएँगे’; इब्रानी शब्द आतंक के अर्थ में भय व्यक्त कर सकता है, पर इस प्रसंग में परमेश्वर के न्याय के सामने श्रद्धामिश्रित भय का भाव भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘उसका उपहास करेंगे।’ इब्रानी क्रिया का अर्थ ‘हँसना’ है; प्रसंग से तिरस्कार का भाव प्रकट होता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִרְאוּ
  choice: यह देखकर
  rationale: ראה के काल-सदृश अपूर्ण रूप को काव्यात्मक क्रम में भविष्य के अर्थ के साथ प्रस्तुत किया गया है। ‘यह देखकर’ हिन्दी में अगले क्रियापद से स्वाभाविक रूप से जुड़ता है और प्रत्यक्ष देखने के भाव को बनाए रखता है।
- source_word: צַדִּיקִים
  choice: धर्मी लोग
  rationale: बहुवचन विशेषण यहाँ संज्ञा के रूप में प्रयुक्त है। ‘धर्मी लोग’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है तथा नैतिक श्रेणी को सुरक्षित रखता है।
- source_word: וְיִירָאוּ
  choice: भय खाएँगे
  rationale: ירא यहाँ डर और परमेश्वर के न्याय के प्रति श्रद्धामिश्रित भय—दोनों अर्थों की संभावना रखता है। ‘भय खाएँगे’ इस तनाव को किसी एक अर्थ तक सीमित नहीं करता।
- source_word: וְעָלָיו
  choice: उस पर
  rationale: שׂחק के साथ על का अर्थ किसी व्यक्ति पर हँसना या उसका उपहास करना है। ‘उस पर’ मूल पूर्वसर्गीय संरचना के निकट और हिन्दी में स्वाभाविक है।
- source_word: יִשְׂחָקוּ
  choice: हँसेंगे
  rationale: שׂחק का मूल अर्थ ‘हँसना’ है। प्रसंग में उपहास का भाव निहित है, पर मुख्य पाठ मूल क्रिया के सामान्य अर्थ को बनाए रखता है।
theological_decisions:
- issue: न्याय को देखकर ‘भय’ का अर्थ
  choice: भय खाएँगे
  alternative: डर जाएँगे; श्रद्धा से भर जाएँगे
  rationale: धर्मी लोग दुष्ट पर हुए न्याय को देखते हैं। इब्रानी ירא में आतंक और परमेश्वर के प्रति श्रद्धामिश्रित भय दोनों की गुंजाइश है; इसलिए अनुवाद इस धर्मवैचारिक तनाव को खुला रखता है।
- issue: न्याय पाए व्यक्ति पर हँसना
  choice: उस पर हँसेंगे
  alternative: उसका उपहास करेंगे
  rationale: प्रसंग में उपहास निहित है, फिर भी इब्रानी क्रिया का सीधा अर्थ ‘हँसना’ है। मुख्य पाठ को अधिक व्याख्यात्मक बनाने के बजाय वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, संक्षिप्त और काव्यात्मक रखी गई है। ‘धर्मी लोग’ सामान्य पाठक के लिए सहज है। ‘भय खाएँगे’ ने डर और श्रद्धामिश्रित भय की वास्तविक अस्पष्टता को सुरक्षित रखा है; ‘हँसेंगे’ मूल क्रिया के सीधे अर्थ को बनाए रखता है।
