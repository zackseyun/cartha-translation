source:
  edition: WLC
  text: אוֹדְ/ךָ֣ לְ֭/עוֹלָם כִּ֣י עָשִׂ֑יתָ וַ/אֲקַוֶּ֖ה שִׁמְ/ךָ֥ כִֽי ט֝֗וֹב נֶ֣גֶד חֲסִידֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/052/010.yaml
  text: I will give thanks to you forever[a], because you have done it; I will wait for your name, for it is good[c][b], in the presence of your faithful ones.
translation:
  language: hi
  text: मैं सदा तेरा धन्यवाद करूँगा, क्योंकि तूने यह किया है; मैं तेरे नाम की बाट जोहूँगा,[a] क्योंकि वह भला है, तेरे भक्तों के सामने।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं तेरे नाम पर आशा रखूँगा।”
    reason: lexical_alternative
  - marker: b
    text: या, “क्योंकि तेरा नाम भला है।”
    reason: alternative_reading
lexical_decisions:
- source_word: אוֹדְךָ
  choice: तेरा धन्यवाद करूँगा
  rationale: हिफ़ील रूप यहाँ परमेश्वर के किए हुए कार्य के प्रत्युत्तर में धन्यवाद और स्तुति दोनों का भाव रखता है; ‘धन्यवाद करूँगा’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: לְעוֹלָם
  choice: सदा
  rationale: यह दीर्घ और निरंतर अवधि को संक्षेप तथा सहज हिन्दी में व्यक्त करता है।
- source_word: כִּי עָשִׂיתָ
  choice: क्योंकि तूने यह किया है
  rationale: पहला כִּי कारण बताता है। עשה का कर्म प्रसंग से निहित है, इसलिए हिन्दी में स्वाभाविकता के लिए ‘यह’ जोड़ा गया है।
- source_word: וַאֲקַוֶּה
  choice: मैं ... बाट जोहूँगा
  rationale: קוה में प्रतीक्षा और आशा, दोनों का भाव है। ‘बाट जोहूँगा’ प्रत्याशापूर्ण प्रतीक्षा को रखता है, जबकि वैकल्पिक ‘आशा रखूँगा’ पादटिप्पणी में दिया गया है।
- source_word: שִׁמְךָ
  choice: तेरे नाम की
  rationale: ‘नाम’ को बनाए रखने से परमेश्वर के प्रकट चरित्र और प्रतिष्ठा से जुड़ा बाइबलीय मुहावरा सुरक्षित रहता है।
- source_word: כִּי טוֹב
  choice: क्योंकि वह भला है
  rationale: पुल्लिंग एकवचन ‘वह’ निकटतम संज्ञा ‘नाम’ की ओर संकेत कर सकता है, पर इब्रानी की संक्षिप्तता बनी रहती है।
- source_word: נֶגֶד
  choice: के सामने
  rationale: यह दूसरों की उपस्थिति या दृष्टि में किए जाने वाले सार्वजनिक अंगीकार को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: חֲסִידֶיךָ
  choice: तेरे भक्तों
  rationale: חסיד परमेश्वर के प्रति निष्ठावान और समर्पित जनों को दर्शाता है। ‘भक्त’ सामान्य आधुनिक हिन्दी में सुबोध है और अनावश्यक पारिभाषिक कलीसियाई अर्थ से बचता है।
theological_decisions:
- issue: कर्म का लिंग और सम्बोधन-शैली
  choice: परमेश्वर के लिए एकवचन निकट सम्बोधन ‘तू/तेरा’
  alternative: ‘आप/आपका’
  rationale: भजन की सीधी प्रार्थनात्मक निकटता और हिन्दी बाइबल-काव्य की गरिमामय परंपरा को बनाए रखा गया है; यह अनादर नहीं, आत्मीय सम्बोधन है।
- issue: חֲסִידֶיךָ का अनुवाद
  choice: तेरे भक्तों
  alternative: तेरे विश्वासयोग्य जनों / तेरे पवित्र जनों
  rationale: ‘भक्त’ समर्पण और निष्ठा का सहज अर्थ देता है, पर बाद की तकनीकी धार्मिक श्रेणी नहीं थोपता।
- issue: ‘भला’ किसकी ओर संकेत करता है
  choice: क्योंकि वह भला है
  alternative: क्योंकि तेरा नाम भला है
  rationale: इब्रानी कथन संक्षिप्त है। मुख्य पाठ सर्वनाम के द्वारा ‘नाम’ की सम्भावित ओर-संकेतना रखता है, जबकि पादटिप्पणी स्पष्ट विकल्प देती है।
- issue: קוה में प्रतीक्षा और आशा का संबंध
  choice: तेरे नाम की बाट जोहूँगा
  alternative: तेरे नाम पर आशा रखूँगा
  rationale: मुख्य पाठ स्रोत की प्रतीक्षा-वाचक छवि को रखता है; पादटिप्पणी उसी क्रिया में निहित आशापूर्ण भरोसे को सुरक्षित करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में काव्यात्मक, प्रार्थनात्मक और गरिमामय शैली अपनाई गई है। ‘बाट जोहना’ सामान्य बोलचाल से थोड़ा ऊँचा, पर व्यापक रूप से समझ में आने वाला पद है और इब्रानी की प्रत्याशापूर्ण प्रतीक्षा को सुरक्षित रखता है।
