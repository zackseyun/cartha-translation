  yaml_path: translation/ot/psalms/052/006.yaml
  text: But God will also tear you down forever[a]; he will snatch you up and pull you from your tent, and uproot you from the land of the living[c][b]. Selah
translation:
  language: hi
  text: पर परमेश्वर भी तुझे सदा के लिए ढा देगा; वह तुझे पकड़कर उठा लेगा[a] और तेरे तम्बू से खींच निकालेगा[b]; वह जीवितों की भूमि से तेरी जड़ उखाड़ देगा[c]। सेला।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुझे पकड़ लेगा” अथवा “तुझे उठा ले जाएगा।” यहाँ प्रयुक्त इब्रानी क्रिया दुर्लभ है और बलपूर्वक हटा देने का भाव देती है।
    reason: lexical_alternative
  - marker: b
    text: या, “तेरे निवास से खींच निकालेगा।” मूल में शाब्दिक रूप से “तम्बू” है।
    reason: lexical_alternative
  - marker: c
    text: मूल में शाब्दिक रूप से, “जीवितों की भूमि से तेरी जड़”; आशय है कि वह तुझे वहाँ से जड़ समेत उखाड़ देगा।
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: पर ... भी
  rationale: यह शब्द सामान्यतः ‘भी’ का अर्थ देता है; पिछले संदर्भ के विपरीत परिणाम को दिखाने के लिए ‘पर’ जोड़ा गया है, जबकि इसका योगात्मक भाव भी बनाए रखा गया है।
- source_word: אֵל
  choice: परमेश्वर
  rationale: यहाँ यह इस्राएल के परमेश्वर के लिए प्रयुक्त सामान्य एकवचन संज्ञा है; आधुनिक हिन्दी में ‘परमेश्वर’ स्वाभाविक और गरिमापूर्ण है।
- source_word: יִתָּצְךָ
  choice: तुझे ... ढा देगा
  rationale: נתץ प्रायः किसी संरचना को गिराने या ध्वस्त करने के लिए आता है। ‘ढा देगा’ व्यक्ति के विनाश को भवन गिराने के सजीव रूपक में व्यक्त करता है।
- source_word: לָנֶצַח
  choice: सदा के लिए
  rationale: यहाँ सबसे स्वाभाविक अर्थ स्थायी और अंतिम परिणाम है, केवल पूरी तरह विनाश नहीं।
- source_word: יַחְתְּךָ
  choice: तुझे झपट लेगा
  rationale: दुर्लभ क्रिया बलपूर्वक उठा लेने या पकड़कर हटा देने का भाव देती है। ‘झपट लेगा’ उस आकस्मिक और हिंसक क्रिया को बनाए रखता है।
- source_word: וְיִסָּחֲךָ
  choice: खींच निकालेगा
  rationale: נסח का अर्थ खींचकर अलग करना, निकालना या उखाड़ना है। तम्बू के साथ ‘खींच निकालेगा’ हिन्दी में स्पष्ट और ठोस है।
- source_word: מֵאֹהֶל
  choice: तेरे तम्बू से
  rationale: אֹהֶל का शाब्दिक अर्थ ‘तम्बू’ है। सम्भव मुहावरेदार अर्थ ‘निवास’ होने पर भी मूल काव्य-बिम्ब को मुख्य पाठ में रखा गया है।
- source_word: וְשֵׁרֶשְׁךָ
  choice: तेरी जड़ उखाड़ देगा
  rationale: मूल में संज्ञात्मक और संक्षिप्त काव्यात्मक वाक्यांश ‘तेरी जड़’ है; हिन्दी में क्रिया जोड़कर अर्थ स्पष्ट किया गया है और जड़ का बिम्ब सुरक्षित रखा गया है।
- source_word: מֵאֶרֶץ חַיִּים
  choice: जीवितों की भूमि से
  rationale: यह जीवित संसार के लिए प्रचलित इब्रानी अभिव्यक्ति है और हिन्दी में भी स्पष्ट रहती है।
- source_word: סֶלָה
  choice: सेला
  rationale: इस पद का सटीक कार्य अनिश्चित है, इसलिए अर्थ का अनुमान लगाने के बजाय लिप्यन्तरण किया गया है।
theological_decisions:
- issue: לָנֶצַח में व्यक्त दण्ड की प्रकृति
  choice: सदा के लिए
  alternative: पूरी तरह; एक ही बार में निर्णायक रूप से
  rationale: इब्रानी शब्द का सबसे स्वाभाविक अर्थ स्थायी अवधि है। यह अनुवाद दैवी न्याय की कठोरता बनाए रखता है, पर पद जितना कहता है उससे आगे उसके तत्त्वमीमांसक स्वरूप को परिभाषित नहीं करता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, पर भजन की काव्यात्मक गरिमा बनाए रखती है। ‘ढा देगा,’ ‘तम्बू,’ और ‘जड़ उखाड़ देगा’ जैसे ठोस बिम्ब मूल इब्रानी के विनाश, निष्कासन और उन्मूलन के क्रम को सुरक्षित रखते हैं।
