  yaml_path: translation/ot/psalms/052/003.yaml
  text: You devise destruction[a]; your tongue is like a sharpened razor[c][b], working deceit.
translation:
  language: hi
  text: तू विनाश[a] की योजनाएँ बनाता है; तेरी जीभ धारदार उस्तरे जैसी है—छल करती हुई।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘विनाशों’; इब्रानी बहुवचन यहाँ विनाशकारी हानि का सामूहिक बोध देता है।
    reason: lexical_alternative
  - marker: b
    text: ‘छल करती हुई’ जीभ का वर्णन हो सकता है; इसे संबोधित व्यक्ति के लिए ‘तू छल करता है’ भी समझा जा सकता है।
    reason: syntactic_ambiguity
lexical_decisions:
