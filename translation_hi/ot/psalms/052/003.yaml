  choice: विनाश
  rationale: इब्रानी बहुवचन यहाँ विनाशकारी हानि का सामूहिक और मुहावरेदार बोध देता है; स्वाभाविक हिन्दी में भाववाचक एकवचन उपयुक्त है।
- source_word: תַּחְשֹׁב
  choice: योजनाएँ बनाता है
  rationale: यहाँ क्रिया साधारण सोचने के बजाय जान-बूझकर हानि की योजना बनाने को व्यक्त करती है।
- source_word: לְשׁוֹנֶךָ
  choice: तेरी जीभ
  rationale: वाणी को हानि पहुँचाने वाले अंग के रूप में दिखाने वाला मूल शारीरिक रूपक सुरक्षित रखा गया है।
- source_word: כְתַעַר מְלֻטָּשׁ
  choice: धार लगाए हुए उस्तरे जैसी
  rationale: तुलना और काटने के लिए तैयार किए गए पैने औजार की घातक छवि दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: עֹשֵׂה רְמִיָּה
  choice: छल का काम करती हुई
  rationale: सक्रिय रूप से छल करने का भाव और पद की काव्यात्मक संक्षिप्तता बनी रहती है; इसके व्याकरणिक संबंध की सम्भावित अस्पष्टता पादटिप्पणी में दी गई है।
theological_decisions:
- issue: עֹשֵׂה רְמִיָּה का संबंध
  choice: मुख्य पाठ में इसे निकटतम संज्ञा ‘जीभ’ से जोड़ा गया है
  alternative: इसे संबोधित व्यक्ति के लिए ‘तू छल का काम करता हुआ’ समझना
  rationale: इब्रानी पदबंध जीभ की क्रिया अथवा संबोधित व्यक्ति के चरित्र—दोनों रूपों में समझा जा सकता है। हिन्दी में लिंग के कारण अस्पष्टता सहज रूप से बनाए रखना कठिन है, इसलिए वैकल्पिक अर्थ पादटिप्पणी में स्पष्ट किया गया है।
translation_notes:
  register: 'आधुनिक मानक हिन्दी; संबोधन की काव्यात्मक निकटता के लिए ‘तू/तेरी’ रखा गया है। वाक्य-विन्यास इब्रानी के दो खंडों को अलग रखता है: पहले संबोधित व्यक्ति विनाश की योजना बनाता है, फिर उसकी जीभ की तुलना उस्तरे से की जाती है।'
