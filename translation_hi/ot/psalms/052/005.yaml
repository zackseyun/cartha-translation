  register: आधुनिक, गरिमापूर्ण और सीधे संबोधन वाली काव्यात्मक हिन्दी। ‘हे’ ने इब्रानी संबोधन की तीव्रता बनाए रखी है; रूपक और उसके अर्थ के बीच की संभावित अस्पष्टता पादटिप्पणी में संरक्षित है।
