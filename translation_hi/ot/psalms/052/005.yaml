  text: אָהַ֥בְתָּ כָֽל דִּבְרֵי בָ֗לַע לְשׁ֣וֹן מִרְמָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/052/005.yaml
  text: You love all words of destruction[a], O deceitful tongue.
translation:
  language: hi
  text: तू विनाश की हर बात से प्रेम करता है,[a] हे छल से भरी जीभ!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप में: “निगल जानेवाली हर बात।”'
    reason: בָלַע में ‘निगलने’ का सजीव रूपक है और इसका आशय विनाशकारी वाणी से भी हो सकता है।
lexical_decisions:
- source_word: אָהַבְתָּ
  choice: तू ... से प्रेम करता है
  rationale: Qal पूर्णकाल, द्वितीय पुरुष एकवचन। काव्यात्मक आरोप में यह एक स्थापित प्रवृत्ति को व्यक्त करता है; इसलिए स्वाभाविक हिन्दी वर्तमान काल रखा गया है, जबकि ‘तूने प्रेम किया है’ अधिक रूपात्मक अनुवाद हो सकता है।
- source_word: כָל דִּבְרֵי
  choice: हर बात
  rationale: כָל और דִּבְרֵי मिलकर कही गई सभी बातों की समग्रता बताते हैं। हिन्दी में ‘हर बात’ स्वाभाविक है और वाणी के संदर्भ को स्पष्ट रखता है।
- source_word: בָלַע
  choice: विनाश की
  rationale: यह शब्द ‘निगल जाने’ से निकली विनाश की सजीव छवि रखता है। मुख्य पाठ में ‘विनाश की’ सहज और अर्थपूर्ण है; मूल रूपक को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: לְשׁוֹן מִרְמָה
  choice: हे छल से भरी जीभ
  rationale: ‘जीभ’ के काव्यात्मक रूपक को बनाए रखते हुए מִרְמָה के संज्ञात्मक अर्थ ‘छल’ को स्वाभाविक हिन्दी विशेषणात्मक वाक्यांश में व्यक्त किया गया है।
