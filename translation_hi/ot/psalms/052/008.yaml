  text: הִנֵּ֤ה הַ/גֶּ֗בֶר לֹ֤א יָשִׂ֥ים אֱלֹהִ֗ים מָֽע֫וּזּ֥/וֹ וַ֭/יִּבְטַח בְּ/רֹ֣ב עָשְׁר֑/וֹ יָ֝עֹ֗ז בְּ/הַוָּתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/052/008.yaml
  text: Look[a], this is the man who did not make God his refuge[b], but trusted in the abundance of his riches and sought strength in his destruction.
translation:
  language: hi
  text: देखो, यह वह पुरुष है जिसने परमेश्वर को अपना शरणस्थान[a] नहीं बनाया, बल्कि अपनी अपार धन-संपत्ति पर भरोसा किया और अपने विनाश[b] में बलवान बना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अपना गढ़’ अथवा ‘अपना दृढ़ स्थान’।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी הַוָּה का अर्थ ‘बरबादी’, ‘दुष्ट अभिलाषा’ या ‘विनाशकारी चालें’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: देखो
  rationale: यह विस्मयादिबोधक एक व्यक्ति को चेतावनीपूर्ण उदाहरण के रूप में सामने रखता है। ‘देखो’ आधुनिक हिन्दी में स्वाभाविक है और संकेतात्मक बल बनाए रखता है।
- source_word: הַגֶּבֶר
  choice: वही पुरुष
  rationale: גֶּבֶר पुल्लिंग एकवचन है और यहाँ एक निश्चित व्यक्ति को उदाहरण के रूप में प्रस्तुत करता है। ‘वही पुरुष’ हिन्दी में הִנֵּה के साथ कथन का संकेतात्मक बल स्पष्ट करता है।
- source_word: לֹא יָשִׂים אֱלֹהִים מָעוּזוֹ
  choice: जिसने परमेश्वर को अपना शरणस्थान नहीं बनाया
  rationale: שׂים का अर्थ यहाँ किसी को अपना आश्रय या सुरक्षा-स्रोत बनाना है, और מָעוֹז शरणस्थान, गढ़ या दृढ़ स्थान को दर्शाता है। ‘शरणस्थान’ अर्थ को सहज और स्पष्ट रूप में व्यक्त करता है।
- source_word: וַיִּבְטַח
  choice: बल्कि ... भरोसा किया
  rationale: वाव सामान्यतः ‘और’ हो सकता है, पर यहाँ परमेश्वर को शरण न बनाने और धन पर भरोसा करने के बीच स्पष्ट विरोध है; इसलिए ‘बल्कि’ प्रसंगानुकूल है।
- source_word: בְּרֹב עָשְׁרוֹ
  choice: अपनी अपार धन-संपत्ति पर
  rationale: רֹב बहुतायत या प्रचुरता और עֹשֶׁר धन को व्यक्त करता है। ‘अपार धन-संपत्ति’ दोनों भावों को स्वाभाविक आधुनिक हिन्दी में समेटता है।
- source_word: יָעֹז
  choice: सामर्थ्य पाया
  rationale: क्रिया बलवान होने या शक्ति ग्रहण करने का भाव देती है। ‘सामर्थ्य पाया’ अस्वाभाविक आत्मवाचक विस्तार जोड़े बिना अर्थ को व्यक्त करता है।
- source_word: בְּהַוָּתוֹ
  choice: अपने विनाश में
  rationale: הַוָּה विनाश या बरबादी का अर्थ दे सकता है, पर दुष्ट अभिलाषा अथवा विनाशकारी चालों का भाव भी संभव है। मुख्य पाठ में ‘विनाश’ कथन की विडंबना और व्यापकता को बनाए रखता है।
theological_decisions:
- issue: הַגֶּבֶר का लिंग और एकवचन रूप
  choice: वही पुरुष
  alternative: वह व्यक्ति
  rationale: इब्रानी संज्ञा व्याकरणतः पुल्लिंग एकवचन है और एक प्रतिनिधि दुष्ट पुरुष की ओर संकेत करती है; इसलिए लिंग-निरपेक्ष रूप से इसे समतल नहीं किया गया।
- issue: הַוָּה का अर्थक्षेत्र
  choice: विनाश
  alternative: बरबादी; दुष्ट अभिलाषा; विनाशकारी चालें
  rationale: शब्द का अर्थ व्यापक और प्रसंग में कठिन है। ‘विनाश’ झूठी शक्ति की विडंबना बनाए रखता है, जबकि अन्य वास्तविक संभावनाएँ पादटिप्पणी में दी गई हैं।
- issue: विनाश में सामर्थ्य पाने का तनाव
  choice: अपने विनाश में सामर्थ्य पाया
  alternative: अपनी विनाशकारी चालों से बलवान हुआ
  rationale: मुख्य पाठ इब्रानी की असहज किंतु अर्थपूर्ण संगति को बनाए रखता है और यह तय नहीं करता कि वस्तु स्वयं उसकी बरबादी है या उसकी विनाशकारी गतिविधि।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘अपने विनाश में सामर्थ्य पाया’ जानबूझकर इब्रानी की अर्थगत विडंबना और अस्पष्टता को सुरक्षित रखता है; विकल्प पादटिप्पणी में दिए गए हैं।
