- source_word: וַיַּגֵּד לְשָׁאוּל
  choice: शाऊल को सूचना दी
  rationale: נגד के हिफ़ील रूप का अर्थ यहाँ किसी घटना की खबर देना है; ‘सूचना दी’ प्रसंगानुकूल और स्पष्ट है।
- source_word: וַיֹּאמֶר לוֹ
  choice: और उससे कहा
  rationale: इब्रानी कथात्मक क्रम और शाऊल की ओर संकेत करते सर्वनाम दोनों को बनाए रखा गया है।
- source_word: בָּא דָוִד
  choice: दाऊद ... आया है
  rationale: पूर्ण क्रिया को प्रत्यक्ष कथन में वर्तमान-प्रासंगिक पूर्णता के साथ व्यक्त किया गया है; साधारण भूतकाल भी संभव है।
- source_word: אֶל בֵּית אֲחִימֶלֶךְ
  choice: अहीमेलेक के घर
  rationale: אֶל בֵּית यहाँ गंतव्य या स्थान की ओर गति बताता है; ‘के घर’ आधुनिक हिन्दी में स्वाभाविक है।
