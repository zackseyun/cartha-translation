  text: Why do you boast in evil, mighty man? The steadfast love of God endures all day long.
translation:
  language: hi
  text: 'हे वीर, तू बुराई में क्यों शेखी बघारता है?


    परमेश्वर का अटल प्रेम दिन भर बना रहता है।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תִּתְהַלֵּל בְּרָעָה
  choice: बुराई पर घमंड करता है
  rationale: हित्पएल क्रिया का अर्थ अपने ऊपर गर्व करना या डींग मारना है; בְּ के साथ यहाँ बुराई को घमंड का आधार या विषय बताया गया है।
- source_word: הַגִּבּוֹר
  choice: हे वीर
  rationale: संबोधन को संक्षिप्त और सीधा रखा गया है; संदर्भ में यह व्यंग्यात्मक भी हो सकता है, पर उस व्यंग्य को अनावश्यक रूप से स्पष्ट नहीं किया गया।
- source_word: חֶסֶד אֵל
  choice: परमेश्वर का अटल प्रेम
  rationale: חֶסֶד के स्थायी, विश्वसनीय और कृपालु प्रेम के भाव को 'अटल प्रेम' स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: כָּל־הַיּוֹם
  choice: दिन भर
  rationale: यह इब्रानी वाक्यांश निरंतरता का बोध देता है और यहाँ स्वाभाविक रूप से 'दिन भर' अनूदित है।
theological_decisions:
- issue: अंतिम उपवाक्य में व्यक्त क्रिया का अभाव
  choice: बना रहता है
  alternative: परमेश्वर का अटल प्रेम दिन भर है
  rationale: इब्रानी में नामवाचक कथन है और क्रिया निहित है। 'बना रहता है' निरंतरता को स्वाभाविक हिन्दी में व्यक्त करता है, बिना यह तय किए कि प्रेम विशेष रूप से अपराधी के प्रति है या सामान्यतः परमेश्वर का स्थायी गुण है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण है। एकवचन 'तू' मूल के सीधे, तीखे संबोधन को बनाए रखता है; 'हे वीर' में संभावित व्यंग्य पाठक के लिए खुला छोड़ा गया है।
