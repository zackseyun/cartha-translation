  yaml_path: translation/ot/psalms/052/004.yaml
  text: You have loved evil more than good[a], falsehood more than speaking righteousness. Selah
translation:
  language: hi
  text: तूने भलाई से अधिक बुराई से, और जो सही है उसे कहने से अधिक झूठ से प्रेम किया है।[a] सेला
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तूने भलाई के बजाय बुराई से, और धार्मिकता की बात कहने के बजाय झूठ से प्रेम किया है।”
    reason: מִן की तुलनात्मक/वरीयतामूलक शक्ति तथा צֶדֶק के ‘धार्मिकता’ संबंधी व्यापक नैतिक अर्थ का वैकल्पिक अनुवाद।
lexical_decisions:
- source_word: אָהַבְתָּ
  choice: तूने प्रेम किया है
  rationale: यह קל पूर्ण, द्वितीय पुरुष एकवचन पुल्लिंग है और दुष्ट व्यक्ति को सीधे संबोधित करता है। हिन्दी का पूर्ण वर्तमान आरोप की वर्तमान प्रासंगिकता बनाए रखता है।
- source_word: רָּע
  choice: बुराई
  rationale: ‘भलाई’ के स्पष्ट विरोध में यहाँ नैतिक अर्थ अभिप्रेत है।
- source_word: מִטּוֹב
  choice: भलाई से बढ़कर
  rationale: वरीयता या तुलना सूचित करने वाले מִן का अर्थ बनाए रखता है; ‘के बजाय’ भी संभव है।
- source_word: שֶׁקֶר
  choice: झूठ
  rationale: यह असत्य और छलपूर्ण कथन दोनों को समेटने वाला सहज आधुनिक हिन्दी शब्द है।
- source_word: מִדַּבֵּר
  choice: कहने से बढ़कर
  rationale: दूसरा מִן भी तुलना या वरीयता व्यक्त करता है और דַּבֵּר की वाचिक क्रिया को स्पष्ट रखता है।
- source_word: צֶדֶק
  choice: धार्मिकता की बात
  rationale: वाणी के प्रसंग में यह सत्य और नैतिक रूप से सही बात को दर्शाता है, साथ ही צֶדֶק का नैतिक-धार्मिक भार बनाए रखता है।
- source_word: סֶלָה
  choice: सेला
  rationale: इस संगीतात्मक या उपासना-संबंधी पद का सटीक अर्थ अनिश्चित है, इसलिए अनुवाद के बजाय लिप्यंतरण किया गया है।
theological_decisions:
- issue: צֶדֶק का अनुवाद
  choice: धार्मिकता की बात
  alternative: सही बात
  rationale: तत्काल विरोध ‘झूठ’ और खरी वाणी के बीच है। ‘धार्मिकता की बात’ मूल शब्द का नैतिक-धार्मिक आयाम बचाती है, जबकि पादटिप्पणी अधिक सहज अर्थ ‘सही बात’ देती है।
translation_notes:
  register: सीधा संबोधन बनाए रखने के लिए ‘तू’ रखा गया है। भाषा आधुनिक और गरिमापूर्ण है; समानांतर काव्य-रचना तथा दूसरे खंड में निहित क्रिया को हिन्दी में एक साझा क्रिया के अंतर्गत रखा गया है।
