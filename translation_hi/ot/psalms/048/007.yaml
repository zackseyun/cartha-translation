  yaml_path: translation/ot/psalms/048/007.yaml
  text: With an east wind you shatter the ships of Tarshish[a].
translation:
  language: hi
  text: 'पूरब की हवा से

    तू तरशीश के जहाज़ों को चकनाचूर कर देता है।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या संभवतः, “तरशीश जानेवाले जहाज़ों” अथवा “तरशीशी जहाज़ों।” यह पदबंध तरशीश से जुड़े बड़े समुद्रगामी व्यापारिक जहाज़ों के लिए भी प्रयुक्त हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּ/רוּחַ קָדִים
  choice: पूरब की हवा से
  rationale: רוּחַ यहाँ समुद्री प्रसंग और קָדִים के साथ होने के कारण ‘हवा’ है; בְּ साधन सूचित करता है, जिसे हिंदी में स्वाभाविक रूप से ‘से’ कहा गया है। ‘पूरब की हवा’ विनाशकारी पूर्वी हवा के अर्थ को स्पष्ट रखता है।
- source_word: תְּשַׁבֵּר
  choice: तू ... चकनाचूर कर देता है
  rationale: שׁבר के पिएल रूप में जोरदार ढंग से तोड़ने का भाव है। ‘चकनाचूर’ जहाज़ों के हिंसक विनाश को स्वाभाविक और सजीव हिंदी में व्यक्त करता है; द्वितीय पुरुष एकवचन को ‘तू’ से बनाए रखा गया है।
- source_word: אֳנִיּוֹת
  choice: जहाज़ों
  rationale: बहुवचन संज्ञा का सीधा और सामान्य हिंदी समतुल्य ‘जहाज़’ है।
- source_word: תַּרְשִׁישׁ
  choice: तरशीश
  rationale: स्थान-नाम को हिंदी में प्रचलित बाइबलीय लिप्यंतरण के अनुसार रखा गया है। इस पदबंध का अर्थ तरशीश से जुड़े या समुद्रगामी व्यापारिक जहाज़ भी हो सकता है, इसलिए वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: द्वितीय पुरुष क्रिया का संबोधन
  choice: परमेश्वर से सीधा संबोधन—‘तू ... कर देता है’
  alternative: निर्वैयक्तिक या सामान्य कथन
  rationale: תְּשַׁבֵּר द्वितीय पुरुष पुल्लिंग एकवचन है और भजन के प्रसंग में परमेश्वर को संबोधित करता है। अनुवाद इस काव्यात्मक सीधे संबोधन को बनाए रखता है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिंदी। काव्यात्मक पंक्ति-विन्यास रखा गया है। परमेश्वर के सीधे संबोधन के लिए ‘तू’ मूल के एकवचन और भजन की निकटता को बनाए रखता है; यह अनादर सूचित नहीं करता।
