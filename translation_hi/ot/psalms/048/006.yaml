- source_word: חִיל
  choice: पीड़ा
  rationale: यह शब्द मरोड़, प्रसव-वेदना अथवा गहरी व्याकुलता का बोध करा सकता है; प्रसव करती स्त्री की उपमा के साथ 'पीड़ा' शारीरिक और भावात्मक दोनों कष्टों को खुला रखता है।
- source_word: כַּיּוֹלֵדָה
  choice: प्रसव में लगी स्त्री जैसी
  rationale: यह ילד के स्त्रीलिंग कृदन्त से बनी तुलना है और प्रसव की प्रक्रिया में स्त्री का स्पष्ट, समकालीन तथा गरिमापूर्ण चित्र देती है।
