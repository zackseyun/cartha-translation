    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׂמַח
  choice: आनन्दित हो
  rationale: क़ाल अपूर्ण 3 पुं. एक. को काव्य-संदर्भ में इच्छार्थक भाव के साथ लिया गया है; यह केवल भविष्यवाणी नहीं, आनन्द के आह्वान को व्यक्त करता है।
- source_word: הַר צִיּוֹן
  choice: सिय्योन पर्वत
  rationale: मूल के स्थलाकृतिक बिंब को बनाए रखते हुए यह आधुनिक हिन्दी में स्वाभाविक बाइबलीय अभिव्यक्ति है।
- source_word: תָּגֵלְנָה
  choice: मगन हों
  rationale: क़ाल अपूर्ण 3 स्त्री. बहु. आनन्द या उल्लास व्यक्त करता है। 'मगन हों' समानार्थी काव्यात्मक समानांतरता रखता है और पहले खंड की अनावश्यक शब्द-पुनरावृत्ति से बचाता है।
- source_word: בְּנוֹת יְהוּדָה
  choice: यहूदा की बेटियाँ
  rationale: शाब्दिक काव्यात्मक रूप को मुख्य पाठ में सुरक्षित रखा गया है; आश्रित नगरों या बस्तियों का सम्भावित अर्थ पादटिप्पणी में दिया गया है।
- source_word: לְמַעַן
  choice: क्योंकि
  rationale: यहाँ पद आनन्द का कारण बताता है; हिन्दी में 'क्योंकि' इस कारणात्मक सम्बन्ध को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: מִשְׁפָּטֶיךָ
  choice: तूने न्याय किए हैं
  rationale: बहुवचन संज्ञा को क्रियात्मक हिन्दी में प्रस्तुत किया गया है, जिससे प्रसंगानुसार परमेश्वर के न्यायिक कार्यों का भाव स्पष्ट होता है और इसे केवल विधि-विधानों तक सीमित नहीं किया जाता।
theological_decisions:
- issue: מִשְׁפָּטֶיךָ का प्रसंगगत अर्थ
  choice: तूने न्याय किए हैं
  alternative: तेरे न्यायों के कारण / तेरी न्यायशीलता के कारण / तेरी विधियों के कारण
  rationale: आसपास का प्रसंग राजा और न्यायी के रूप में परमेश्वर के निर्णायक कार्यों पर बल देता है। क्रियात्मक अनुवाद उन्हीं न्यायकारी कार्यों को दर्शाता है, पर उनकी विशिष्ट प्रकृति को अनावश्यक रूप से निर्धारित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक रखी गई है। दो समानांतर इच्छार्थक पंक्तियाँ मूल की रचना और उल्लासपूर्ण स्वर को सुरक्षित रखती हैं।
