base_translation:
  language: en
  yaml_path: translation/ot/psalms/048/001.yaml
  text: Great is Yahweh[a], and greatly to be praised, in the city of our God, his holy mountain.
translation:
  language: hi
  text: 'याहवे महान है और अत्यन्त स्तुति के योग्य है[a],

    हमारे परमेश्वर के नगर में,

    उसके पवित्र पर्वत में।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और अत्यन्त प्रशंसित है।” इब्रानी कर्मवाच्य कृदन्त का अधिक शाब्दिक अर्थ “प्रशंसित” है; भावार्थ में इसका अर्थ “स्तुति के योग्य” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: גָּדוֹל
  choice: महान
  rationale: वचन के आरम्भ में विधेय विशेषण है। “याहवे महान है” इब्रानी के बल और मूल्यांकनात्मक अर्थ को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम को किसी उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: וּמְהֻלָּל מְאֹד
  choice: और अत्यन्त स्तुति के योग्य है
  rationale: הלל का पुअल कर्मवाच्य कृदन्त या तो वास्तव में की जा रही स्तुति अथवा स्तुति-योग्यता व्यक्त कर सकता है। मुख्य पाठ में प्रसंगानुकूल और स्वाभाविक हिन्दी रखी गई है, जबकि दूसरा सम्भव अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: בְּעִיר אֱלֹהֵינוּ
  choice: हमारे परमेश्वर के नगर में
  rationale: בְּ का स्थानवाचक अर्थ और ‘हमारे परमेश्वर का नगर’ वाला संबंध सीधे और स्पष्ट रूप से व्यक्त होता है।
- source_word: הַר קָדְשׁוֹ
  choice: उसके पवित्र पर्वत पर
  rationale: यह पद पिछले स्थानवाचक वाक्यांश के समानाधिकरण में सिय्योन को परमेश्वर के पवित्र पर्वत के रूप में पहचानता है। हिन्दी में स्थान-संबंध स्पष्ट करने के लिए “पर” स्वाभाविक रूप से जोड़ा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम सीधे आया है। “याहवे” उसे उपाधि से प्रतिस्थापित किए बिना सुरक्षित रखता है।
- issue: מְהֻלָּל का भाव
  choice: स्तुति के योग्य
  alternative: उसकी बहुत स्तुति होती है
  rationale: कर्मवाच्य कृदन्त स्तुति किए जाने की अवस्था और स्तुति-योग्यता—दोनों छायाएँ रख सकता है। मुख्य पाठ में मुहावरेदार अर्थ चुना गया है और वास्तविक कर्मवाच्य सम्भावना पादटिप्पणी में दी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, काव्यात्मक और सामान्य पाठक के लिए सहज रूप। समानान्तर पंक्ति-विन्यास भजन की लय को उभारता है; अनावश्यक संस्कृतनिष्ठता से बचते हुए “अत्यन्त” और “स्तुति” जैसे परिचित धार्मिक शब्द बनाए गए हैं।
