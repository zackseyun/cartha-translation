  philosophy: optimal-equivalence
lexical_decisions:
- source_word: סֹבּוּ
  choice: चारों ओर चलो
  rationale: बहुवचन आज्ञार्थक क्रिया नगर के चारों ओर घूमकर देखने की ठोस क्रिया व्यक्त करती है; यह आधुनिक हिन्दी में स्वाभाविक है।
- source_word: צִיּוֹן
  choice: सिय्योन
  rationale: मूल में केवल स्थान-नाम ‘सिय्योन’ है, ‘सिय्योन पर्वत’ नहीं; इसलिए नाम को प्रचलित हिन्दी रूप में रखा गया है।
- source_word: וְהַקִּיפוּהָ
  choice: और उसकी परिक्रमा करो
  rationale: यह बहुवचन आज्ञार्थक रूप स्त्रीलिंग प्रत्यय के साथ सिय्योन को चारों ओर से घूमने का निर्देश देता है। ‘परिक्रमा करो’ स्थान के चारों ओर घूमने का भाव रखता है और शत्रुतापूर्ण घेराबंदी का अनावश्यक अर्थ नहीं लाता।
- source_word: סִפְרוּ
  choice: गिनो
  rationale: मीनारों के प्रत्यक्ष निरीक्षण के प्रसंग में क्रिया का अर्थ संख्या गिनना है।
- source_word: מִגְדָּלֶיהָ
  choice: उसकी मीनारें
  rationale: स्त्रीलिंग एकवचन प्रत्यय सिय्योन नगरी की ओर संकेत करता है; हिन्दी में ‘उसकी’ इस संदर्भ को स्वाभाविक रूप से बनाए रखता है।
