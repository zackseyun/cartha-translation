  yaml_path: translation/ot/psalms/048/002.yaml
  text: Beautiful in elevation[a], the joy of all the earth, is Mount Zion, in the far north, the city of the great King.
translation:
  language: hi
  text: अपनी ऊँचाई में सुन्दर, सारी पृथ्वी का आनन्द है सिय्योन पर्वत—सुदूर उत्तर में[a], महान राजा का नगर।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उत्तरी ढलानों पर’; शाब्दिक अर्थ, ‘उत्तर के दूरस्थ भागों/किनारों में।’ यह पदबंध साफोन से जुड़ी दिव्य-पर्वत की काव्यात्मक छवि की प्रतिध्वनि भी हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: יְפֵה נוֹף
  choice: अपनी ऊँचाई में सुन्दर
  rationale: יְפֵה सिय्योन की सुन्दरता बताता है और कठिन शब्द נוֹף सम्भवतः उसकी ऊँची स्थिति या उठान को सूचित करता है। यह अनुवाद उस स्थलाकृतिक भाव को सहज हिन्दी में बनाए रखता है।
- source_word: מְשׂוֹשׂ כָּל הָאָרֶץ
  choice: सारी पृथ्वी का आनन्द
  rationale: מְשׂוֹשׂ का अर्थ आनन्द या हर्ष का कारण है। הָאָרֶץ को यहाँ व्यापक, सार्वभौमिक काव्यात्मक दावे के कारण ‘पृथ्वी’ किया गया है, न कि केवल ‘देश’।
- source_word: הַר צִיּוֹן
  choice: सिय्योन पर्वत
  rationale: स्थान-नाम और सामान्य संज्ञा का प्रचलित, स्पष्ट हिन्दी रूप।
- source_word: יַרְכְּתֵי צָפוֹן
  choice: सुदूर उत्तर में
  rationale: यह पदबंध शाब्दिक रूप से उत्तर के दूरस्थ भागों या छोरों को दर्शाता है। मुख्य पाठ में संक्षिप्त भौगोलिक अर्थ रखा गया है और अन्य सम्भावनाएँ पादटिप्पणी में दी गई हैं।
- source_word: קִרְיַת מֶלֶךְ רָב
  choice: महान राजा का नगर
  rationale: यह सम्बन्धसूचक पद-समूह स्वाभाविक रूप से ‘महान राजा का नगर’ बनता है और सिय्योन के समानाधिकरण में है।
theological_decisions:
- issue: יַרְכְּתֵי צָפוֹן का सिय्योन से सम्बन्ध
  choice: मुख्य पाठ में ‘सुदूर उत्तर में’
  alternative: ‘उत्तरी ढलानों पर’ अथवा ‘साफोन/उत्तर के दूरस्थ भागों में’
  rationale: इब्रानी वाक्यांश साधारण स्थलवर्णन भी हो सकता है और साफोन से जुड़ी दिव्य-पर्वत कल्पना की काव्यात्मक प्रतिध्वनि भी। मुख्य पाठ किसी एक धर्मवैचारिक व्याख्या को निर्णायक नहीं बनाता; विकल्प पादटिप्पणी में सुरक्षित हैं।
- issue: מֶלֶךְ רָב की निश्चितता
  choice: ‘महान राजा’
  alternative: ‘एक महान राजा’
  rationale: सिय्योन के वर्णन और भजन के धार्मिक संदर्भ में यह उपाधि विशिष्ट राजा की ओर संकेत करती है; फिर भी अनुवाद में कोई अतिरिक्त नाम जोड़कर पहचान को स्पष्ट नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में काव्यात्मक किन्तु सहज शैली रखी गई है। ‘अपनी ऊँचाई में सुन्दर’ मूल के कठिन स्थलाकृतिक पद को निकटता से व्यक्त करता है; डैश सिय्योन पर्वत और उसके समानाधिकरण ‘महान राजा का नगर’ के सम्बन्ध को स्पष्ट करता है।
