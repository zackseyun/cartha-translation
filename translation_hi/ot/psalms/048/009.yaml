  text: דִּמִּ֣ינוּ אֱלֹהִ֣ים חַסְדֶּ֑/ךָ בְּ֝/קֶ֗רֶב הֵיכָלֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/048/009.yaml
  text: We have reflected on your steadfast love[a], O God, in the midst of your temple.
translation:
  language: hi
  text: हे परमेश्वर, हमने तेरे मन्दिर के भीतर तेरे अटल प्रेम पर मनन किया है[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘हमने … पर विचार किया है’ अथवा ‘हमने … का ध्यान किया है।’ इब्रानी क्रिया में गहराई से सोचने या ध्यान लगाने का भाव हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּמִּינוּ
  choice: हमने … मनन किया है
  rationale: पिएल पूर्ण रूप प्रथम पुरुष बहुवचन यहाँ विचार करने, ध्यान लगाने या मनन करने का भाव देता है। ‘मनन किया है’ उपासना के प्रसंग में स्वाभाविक है और क्रिया की चिंतनशील गहराई बनाए रखता है।
- source_word: אֱלֹהִים
  choice: हे परमेश्वर
  rationale: सन्दर्भ में यह सीधा सम्बोधन है। ‘हे परमेश्वर’ आधुनिक हिन्दी में प्रार्थनापूर्ण और गरिमामय सम्बोधन है।
- source_word: חַסְדֶּךָ
  choice: तेरे अटल प्रेम
  rationale: חֶסֶד परमेश्वर के निष्ठावान, स्थायी और सम्बन्धपरक प्रेम को व्यक्त करता है। ‘अटल प्रेम’ इसे केवल दया तक सीमित किए बिना सहज हिन्दी में प्रकट करता है।
- source_word: בְּקֶרֶב
  choice: के भीतर
  rationale: यह किसी स्थान के मध्य या आन्तरिक भाग में होने को सूचित करता है। मन्दिर के प्रसंग में ‘के भीतर’ स्पष्ट और स्वाभाविक स्थानगत अर्थ देता है।
- source_word: הֵיכָלֶךָ
  choice: तेरे मन्दिर
  rationale: הֵיכָל का अर्थ राजमहल भी हो सकता है, पर इस भजन के आराधनात्मक प्रसंग में परमेश्वर का ‘मन्दिर’ अभिप्रेत है।
theological_decisions:
- issue: חֶסֶד द्वारा परमेश्वर के चरित्र का वर्णन
  choice: अटल प्रेम
  alternative: दया; करुणा; वाचा का प्रेम
  rationale: ‘अटल प्रेम’ इब्रानी शब्द के प्रेम और निष्ठा—दोनों पक्षों को सुरक्षित रखता है। यह अर्थ को केवल करुणा तक सीमित नहीं करता और मुख्य पाठ में अत्यधिक तकनीकी धार्मिक पदावली भी नहीं लाता।
- issue: אֱלֹהִים सम्बोधन है या सामान्य उल्लेख
  choice: 'सीधा सम्बोधन: ‘हे परमेश्वर’'
  alternative: ‘परमेश्वर’ के रूप में सामान्य उल्लेख
  rationale: वाक्य परमेश्वर से सीधे कही गई आराधनात्मक वाणी के रूप में सबसे स्वाभाविक है; ‘हे’ इस सम्बोधन को हिन्दी में स्पष्ट करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, काव्यात्मक और आराधनात्मक शैली रखी गई है। परमेश्वर के लिए निकट और पारम्परिक एकवचन सम्बोधन ‘तेरे’ अपनाया गया है; भाषा को न तो पुरातन बनाया गया है, न अत्यधिक बोलचाल का।
