  rationale: מִשְׂגָּב मूलतः ऊँचे, सुरक्षित और रक्षक स्थान का बिंब रखता है। ‘ऊँचा शरणस्थान’ ऊँचाई और सुरक्षा दोनों को बनाए रखता है।
theological_decisions:
