source:
  edition: WLC
  text: כַּ/אֲשֶׁ֤ר שָׁמַ֨עְנוּ כֵּ֤ן רָאִ֗ינוּ בְּ/עִיר יְהוָ֣ה צְ֭בָאוֹת בְּ/עִ֣יר אֱלֹהֵ֑י/נוּ אֱלֹ֘הִ֤ים יְכוֹנְנֶ֖/הָ עַד עוֹלָ֣ם סֶֽלָה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/048/008.yaml
  text: 'Just as we have heard[a], so we have seen in the city of Yahweh of hosts, in the city of our God: God will establish her forever. Selah'
translation:
  language: hi
  text: जैसा हमने सुना है, वैसा ही हमने सेनाओं के याहवे के नगर में—अपने परमेश्वर के नगर में—देखा है। परमेश्वर उसे[a] सदा के लिए स्थिर रखेगा। सेला
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात उस नगर को। इब्रानी में ‘नगर’ के लिए प्रयुक्त शब्द स्त्रीलिंग है; इसलिए क्रिया के साथ लगा प्रत्यय स्त्रीलिंग है। नगर का काव्यात्मक मानवीकरण भी किया गया है।
    reason: मूल के स्त्रीलिंग प्रत्यय के नगर-संदर्भ और उसके काव्यात्मक मानवीकरण को स्पष्ट करता है, बिना हिन्दी ‘नगर’ के लिंग के बारे में भ्रम उत्पन्न किए।
lexical_decisions:
- source_word: כַּאֲשֶׁר ... כֵּן
  choice: जैसा ... वैसा ही
  rationale: यह स्वाभाविक हिन्दी सहसंबंध मूल के तुलनात्मक ढाँचे और बल को बनाए रखता है।
- source_word: שָׁמַעְנוּ ... רָאִינוּ
  choice: हमने सुना था ... हमने ... देखा है
  rationale: पूर्व में सुनी हुई बात और अब अनुभव से देखी गई उसकी पुष्टि के काव्यात्मक संबंध को स्पष्ट, स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בְּעִיר יְהוָה צְבָאוֹת
  choice: सेनाओं के याहवे के नगर में
  rationale: בְּ का स्थानवाचक अर्थ, याहवे का व्यक्तिगत नाम, और צְבָאוֹת का व्यापक अर्थ ‘सेनाएँ’ सुरक्षित रखे गए हैं।
- source_word: אֱלֹהֵינוּ
  choice: अपने परमेश्वर के
  rationale: प्रथम पुरुष बहुवचन संबंधसूचक प्रत्यय को ‘अपने’ से स्वाभाविक हिन्दी में व्यक्त किया गया है; इसका संबंध वक्ताओं से है।
- source_word: יְכוֹנְנֶהָ
  choice: उसे स्थिर रखेगा
  rationale: כון के दृढ़ अथवा सुरक्षित बनाए रखने के भाव को व्यक्त करता है। ‘उसे’ का संदर्भ स्त्रीलिंग संज्ञा ‘नगर’ से है, पर हिन्दी में अनावश्यक मानवीकरण नहीं जोड़ा गया।
- source_word: עַד עוֹלָם
  choice: सदा के लिए
  rationale: दीर्घस्थायी निरंतरता का सहज और गरिमापूर्ण आधुनिक हिन्दी रूप।
- source_word: סֶלָה
  choice: सेला
  rationale: इस संगीतात्मक अथवा उपासना-संबंधी पद का ठीक अर्थ अनिश्चित है, इसलिए इसका लिप्यंतरण किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल में प्रयुक्त व्यक्तिगत ईश्वरीय नाम को किसी उपाधि से बदलने के बजाय हिन्दी में लिप्यंतरित किया गया है।
- issue: יְכוֹנְנֶהָ में स्त्रीलिंग एकवचन प्रत्यय का संदर्भ
  choice: ‘उसे’—अर्थात नगर को
  alternative: ‘उसको’ अथवा ‘उस नगर को’; नगर का स्पष्ट स्त्री-मानवीकरण
  rationale: प्रत्यय स्वाभाविक रूप से स्त्रीलिंग עִיר (‘नगर’) की ओर संकेत करता है। हिन्दी सर्वनाम लिंग नहीं बताता, इसलिए पादटिप्पणी मूल की व्याकरणिक विशेषता स्पष्ट करती है और काव्यात्मक मानवीकरण को आवश्यकता से अधिक नहीं बढ़ाती।
- issue: יְכוֹנְנֶהָ का काल और भाव
  choice: स्थिर रखेगा
  alternative: स्थिर करता है / स्थिर करे
  rationale: अपूर्ण क्रिया को यहाँ भविष्य की आश्वस्त घोषणा के रूप में लिया गया है, जबकि स्थिरता और सुरक्षा दोनों का निहित भाव बना रहता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल रखी गई है। ‘नगर’ को ‘शहर’ पर प्राथमिकता दी गई है ताकि भजन की काव्यात्मक ऊँचाई बनी रहे। दीर्घ विराम-चिह्न दोनों समानाधिकरण पदबंधों को स्पष्ट करता है।
