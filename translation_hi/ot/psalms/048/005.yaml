- source_word: תָּמָהוּ
  choice: चकित रह गए
  rationale: यह अचानक हुए विस्मय को व्यक्त करता है और भावना को सकारात्मक आश्चर्य या नकारात्मक भय तक सीमित नहीं करता।
- source_word: נִבְהֲלוּ
  choice: घबरा उठे
  rationale: निफ़अल रूप तीव्र व्याकुलता, आतंक या घबराहट दर्शाता है; इस बढ़ती हुई प्रतिक्रिया-शृंखला में ‘घबरा उठे’ स्वाभाविक और सशक्त है।
- source_word: נֶחְפָּזוּ
  choice: हड़बड़ी में भाग गए
  rationale: यह क्रिया दबाव या भय में तत्काल और उतावली गति का बोध देती है। प्रसंग में ‘भाग गए’ उपयुक्त है, जबकि ‘हड़बड़ी में’ मूल क्रिया की जल्दबाज़ी को बनाए रखता है।
