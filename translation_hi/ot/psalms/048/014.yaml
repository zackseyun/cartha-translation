  yaml_path: translation/ot/psalms/048/014.yaml
  text: For this God is our God forever and ever; he will guide us beyond death.
translation:
  language: hi
  text: क्योंकि यही परमेश्वर सदा-सर्वदा हमारा परमेश्वर है; वही मृत्यु के पार हमारी अगुवाई करेगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי זֶה אֱלֹהִים אֱלֹהֵינוּ
  choice: क्योंकि यही परमेश्वर हमारा परमेश्वर है
  rationale: זֶה का संकेतात्मक बल ‘यही’ से व्यक्त होता है, जबकि אֱלֹהֵינוּ का संबंधवाचक अर्थ स्वाभाविक आधुनिक हिन्दी में सुरक्षित है।
- source_word: עוֹלָם וָעֶד
  choice: सदा-सर्वदा
  rationale: यह युग्म अनंत काल की प्रबल अभिव्यक्ति है; प्रचलित और गरिमापूर्ण हिन्दी युग्म मूल के जोर को बनाए रखता है।
- source_word: יְנַהֲגֵנוּ
  choice: हमारी अगुवाई करेगा
  rationale: क्रिया נהג यहाँ मार्ग दिखाने और नेतृत्व करने का भाव रखती है; ‘अगुवाई करेगा’ भजन-साहित्य के अनुकूल तथा सामान्य पाठक के लिए स्पष्ट है।
- source_word: עַל־מוּת
  choice: मृत्यु के पार भी
  rationale: मसोरेटिक पाठ के दो शब्दों को עַל (‘पार/से आगे’) और מוּת (‘मृत्यु’) के रूप में लेते हुए मृत्यु से आगे तक ईश्वरीय मार्गदर्शन का भाव व्यक्त किया गया है; ‘भी’ निरंतरता को स्वाभाविक हिन्दी में स्पष्ट करता है।
theological_decisions:
- issue: עַל־מוּת की कठिन और विवादित व्याख्या
  choice: मृत्यु के पार भी
  alternative: मृत्यु तक / सदा के लिए / अलामोत के अनुसार
  rationale: व्यंजन-पाठ עַל־מוּת का सीधा अर्थ ‘मृत्यु के पार’ संभव है और उपलब्ध अंग्रेज़ी परामर्श-पाठ से भी मेल खाता है। फिर भी यह पद पाठगत और व्याख्यात्मक रूप से कठिन है; अनिश्चितता को किसी विशिष्ट संप्रदायगत मृत्यु-पश्चात सिद्धांत में विस्तृत नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण भजनात्मक शैली। ‘यही’ मूल संकेत पर जोर देता है और ‘वही’ अगले उपवाक्य में उसी परमेश्वर को पुनः रेखांकित करता है।
