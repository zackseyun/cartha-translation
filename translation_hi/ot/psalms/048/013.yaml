  text: שִׁ֤יתוּ לִבְּ/כֶ֨ם לְֽ/חֵילָ֗/ה פַּסְּג֥וּ אַרְמְנוֹתֶ֑י/הָ לְמַ֥עַן תְּ֝סַפְּר֗וּ לְ/ד֣וֹר אַחֲרֽוֹן׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/048/013.yaml
  text: Set your heart on her rampart[a]; pass through her citadels[b], so that you may tell the next generation.
translation:
  language: hi
  text: उसकी शहरपनाह पर अपना मन लगाओ[a]; उसके गढ़ों में होकर जाओ[b], ताकि तुम आनेवाली पीढ़ी को बता सको।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उसके परकोटे पर।’ इब्रानी शब्द सामान्य रूप से नगर की किलेबंदी या बाहरी रक्षात्मक दीवार को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘उसके महलों में होकर जाओ।’ इब्रानी शब्द महलों या सुदृढ़ दुर्गनुमा भवनों, दोनों को दर्शा सकता है; नगर की सुरक्षा-व्यवस्था के निरीक्षण का संदर्भ ‘गढ़ों’ का समर्थन करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיתוּ לִבְּכֶם
  choice: अपना मन लगाओ
  rationale: शाब्दिक रूप से ‘अपना हृदय रखो’; इब्रानी मुहावरे में इसका अर्थ ध्यान केंद्रित करना है। आधुनिक हिन्दी में ‘मन लगाओ’ स्रोत की आंतरिक-अवधान वाली छवि और स्वाभाविकता दोनों बनाए रखता है।
- source_word: לְחֵילָה
  choice: उसकी शहरपनाह पर
  rationale: חֵיל यहाँ नगर की रक्षात्मक संरचना, विशेषतः बाहरी दीवार या परकोटे, को सूचित करता है। ‘शहरपनाह’ संक्षिप्त और स्थापत्य-संदर्भ के अनुकूल है।
- source_word: פַּסְּגוּ
  choice: में होकर जाओ
  rationale: यह दुर्लभ बहुवचन आज्ञार्थक क्रिया नगर का निरीक्षण करते हुए उसकी संरचनाओं के बीच से गुजरने का भाव दे सकती है। अनिश्चितता को ध्यान में रखते हुए अत्यधिक विशिष्ट अर्थ नहीं जोड़ा गया।
- source_word: אַרְמְנוֹתֶיהָ
  choice: उसके गढ़ों
  rationale: אַרְמוֹן का अर्थ महल या सुदृढ़ दुर्गनुमा भवन हो सकता है। नगर की किलेबंदी के संदर्भ में ‘गढ़’ उपयुक्त है, जबकि वैकल्पिक ‘महल’ पादटिप्पणी में रखा गया है।
- source_word: לְמַעַן תְּסַפְּרוּ
  choice: ताकि तुम ... बता सको
  rationale: לְמַעַן उद्देश्य व्यक्त करता है और ספר का पिएल रूप किसी बात को सुनाने या वर्णन करने का अर्थ देता है। यह हिन्दी में स्वाभाविक उद्देश्य-वाक्य है।
- source_word: לְדוֹר אַחֲרוֹן
  choice: आनेवाली पीढ़ी को
  rationale: शाब्दिक भाव ‘बाद की/अगली पीढ़ी’ है। ‘आनेवाली पीढ़ी’ भविष्य में गवाही पहुँचाने का व्यापक भाव सुरक्षित रखता है।
