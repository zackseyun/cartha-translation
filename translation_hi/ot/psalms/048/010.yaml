  source_fidelity: The translation preserves the Hebrew comparative construction ("as ... so"), direct address to God, the worldwide scope of praise, and the image of God's right hand full of צדק. “पृथ्वी के छोरों तक पहुँचती है” is an idiomatic rendering of the spatial force of עַל in context, while the footnote appropriately retains the more literal alternative.
