  terminology: “परमेश्वर,” “स्तुति,” and “धार्मिकता” are established and fitting biblical Hindi terms. “धार्मिकता” adequately renders the broad semantic range of צדק, and the footnote preserves “न्याय” as a legitimate alternative without forcing a narrower interpretation.
