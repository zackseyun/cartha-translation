id: PSA.48.10
reference: Psalms 48:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כְּ/שִׁמְ/ךָ֤ אֱלֹהִ֗ים כֵּ֣ן תְּ֭הִלָּתְ/ךָ עַל קַצְוֵי אֶ֑רֶץ צֶ֝֗דֶק מָלְאָ֥ה יְמִינֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/048/010.yaml
  text: As your name[a], O God, so your praise reaches to the ends of the earth[b]; your right hand is full of righteousness.
translation:
  language: hi
  text: हे परमेश्वर, जैसा तेरा नाम है, वैसी ही तेरी स्तुति पृथ्वी के छोरों तक पहुँचती है[a]; तेरा दाहिना हाथ धार्मिकता[b] से भरा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पृथ्वी के छोरों पर तेरी स्तुति है।” इब्रानी संबंधबोधक का शाब्दिक अर्थ “पर/ऊपर” है।
    reason: lexical_alternative
  - marker: b
    text: या, “न्याय।”
    reason: alternative_reading
lexical_decisions:
- source_word: כְּשִׁמְךָ ... כֵּן
  choice: जैसा तेरा नाम है, वैसी ही
  rationale: כְּ और כֵּן की ‘जैसा…वैसा’ तुलनात्मक काव्य-संरचना को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: אֱלֹהִים
  choice: हे परमेश्वर
  rationale: संदर्भ में सीधा संबोधन है; ‘हे’ सम्बोधन को स्पष्ट करता है और काव्यात्मक गरिमा बनाए रखता है।
- source_word: תְּהִלָּתְךָ
  choice: तेरी स्तुति
  rationale: मूल संज्ञा का सीधा अर्थ ‘स्तुति’ है; यह परमेश्वर को मिलने वाली प्रशंसा और उसके यश—दोनों की ओर संकेत कर सकती है।
- source_word: עַל קַצְוֵי אֶרֶץ
  choice: पृथ्वी के छोरों तक पहुँचती है
  rationale: עַל का मूल अर्थ ‘पर/ऊपर’ है, पर यहाँ स्तुति के व्यापक विस्तार को सहज हिन्दी में व्यक्त करने के लिए ‘तक पहुँचती है’ उपयुक्त है; अधिक शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: צֶדֶק
  choice: धार्मिकता
  rationale: यह शब्द नैतिक धार्मिकता और न्याय—दोनों अर्थ दे सकता है। मुख्य पाठ में प्रचलित बाइबलीय पद ‘धार्मिकता’ रखा गया है और ‘न्याय’ पादटिप्पणी में सुरक्षित है।
- source_word: מָלְאָה יְמִינֶךָ
  choice: तेरा दाहिना हाथ ... से भरा है
  rationale: स्त्रीलिंग पूर्ण क्रिया वर्तमान परिणामी दशा बताती है; ‘भरा है’ मूल बिंब और स्वाभाविक हिन्दी दोनों को बनाए रखता है।
theological_decisions:
- issue: परमेश्वर के दाहिने हाथ के वर्णन में צֶדֶק का अर्थ
  choice: धार्मिकता
  alternative: न्याय
  rationale: इब्रानी पद में नैतिक धार्मिकता और न्यायिक न्याय दोनों का अर्थ-क्षेत्र है। किसी एक अर्थ को पूरी तरह निर्णायक न बनाते हुए मुख्य पाठ में ‘धार्मिकता’ और पादटिप्पणी में ‘न्याय’ दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, काव्यात्मक और गरिमापूर्ण शैली अपनाई गई है। परमेश्वर के लिए निकट, पारंपरिक काव्य-संबोधन ‘तेरा’ रखा गया है। ‘पृथ्वी के छोर’ मूल विश्वव्यापी विस्तार के बिंब को सुरक्षित रखता है।
