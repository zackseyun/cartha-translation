source:
  edition: WLC
  text: אִם לֹ֣א יָ֭שׁוּב חַרְבּ֣/וֹ יִלְט֑וֹשׁ קַשְׁתּ֥/וֹ דָ֝רַ֗ךְ וַֽ/יְכוֹנְנֶֽ/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/007/012.yaml
  text: If he does not turn back[a], he will sharpen his sword[c][b]; he has bent his bow and made it ready.
translation:
  language: hi
  text: यदि वह न फिरे[a], तो वह अपनी तलवार पर धार लगाएगा[b]; वह अपना धनुष तान चुका है और उसे तैयार कर लिया है[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यदि वह पश्चाताप न करे।” इब्रानी क्रिया का मूल अर्थ “लौटना/फिरना” है और इस संदर्भ में उसका अर्थ पश्चाताप करना भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ “वह” और “अपनी/अपना” संभवतः परमेश्वर के लिए हैं, जो न फिरने वाले के विरुद्ध न्याय के हथियार तैयार करता है; कम संभव अर्थ में ये दुष्ट मनुष्य के लिए भी हो सकते हैं, जो अपने हथियार तैयार कर रहा है।
    reason: alternative_reading
  - marker: c
    text: या, “और उसे तैयार कर रखा है।”
    reason: previous_rendering
lexical_decisions:
- source_word: אִם לֹא
  choice: यदि ... न
  rationale: यह नकारात्मक शर्त को इब्रानी संरचना के निकट रखते हुए स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יָשׁוּב
  choice: वह न फिरे
  rationale: שׁוּב का मूल अर्थ लौटना या फिरना है। न्याय के इस संदर्भ में पश्चाताप का भाव संभव है, पर मुख्य पाठ व्यापक अर्थ को बनाए रखता है।
- source_word: חַרְבּוֹ יִלְטוֹשׁ
  choice: वह अपनी तलवार पर धार लगाएगा
  rationale: יִלְטוֹשׁ हथियार को तेज करने या उस पर धार लगाने का बोध देता है; यह आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: קַשְׁתּוֹ דָרַךְ
  choice: वह अपना धनुष तानकर
  rationale: धनुष के साथ דָרַךְ उसे मोड़कर या चढ़ाकर चलाने के लिए तैयार करने का मुहावरा है। ‘तानकर’ हिन्दी में युद्ध की उसी सजीव छवि को सहज रूप से व्यक्त करता है।
- source_word: וַיְכוֹנְנֶהָ
  choice: तैयार कर चुका है
  rationale: यह क्रिया धनुष को स्थापित या तैयार करने का अर्थ देती है। पूर्णता का रूप इब्रानी की पूर्ण क्रिया और तत्काल संदर्भ में हथियार की तैयार अवस्था को दर्शाता है।
theological_decisions:
- issue: एकवचन पुल्लिंग सर्वनामों का संदर्भ
  choice: मुख्य संदर्भ में इन्हें न्याय करने के लिए हथियार तैयार करने वाले परमेश्वर की ओर संकेत करने दिया गया है, पर नाम जोड़कर अर्थ निश्चित नहीं किया गया।
  alternative: ये सर्वनाम अपने ही हथियार तैयार करने वाले दुष्ट मनुष्य की ओर संकेत कर सकते हैं।
  rationale: निकटवर्ती पदों का प्रमुख प्रवाह परमेश्वर को धर्मी न्यायी के रूप में प्रस्तुत करता है; फिर भी इब्रानी केवल तीसरे पुरुष के सर्वनाम रखता है। इसलिए हिन्दी में भी ‘वह/अपनी/अपना’ रखकर वास्तविक संदिग्धता सुरक्षित की गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘न फिरे’ मूल क्रिया की व्यापकता और पश्चाताप की प्रसंगगत संभावना दोनों बचाता है। सर्वनामों को स्पष्ट संज्ञा से नहीं बदला गया, ताकि इब्रानी की संदिग्धता बनी रहे।
