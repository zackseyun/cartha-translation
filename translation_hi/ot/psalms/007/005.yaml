  text: let the enemy pursue my life and overtake it[a]; let him trample my life to the ground and make my glory dwell in the dust[b]. Selah
translation:
  language: hi
  text: शत्रु मेरे प्राणों[a] का पीछा करे और उन्हें पकड़ ले; वह मेरे जीवन को भूमि पर रौंद डाले और मेरी महिमा[b] को धूल में बसा दे। सेला
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘मेरे जीवन’ अथवा ‘मुझे’; इब्रानी शब्द נַפְשִׁי संदर्भ के अनुसार प्राण, जीवन या स्वयं व्यक्ति को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘मेरे सम्मान’ अथवा ‘मेरी गरिमा’।
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרַדֹּף
  choice: पीछा करे
  rationale: पूर्ववर्ती शपथ-सदृश कथन के संदर्भ में क्रिया का कामनार्थक/आत्म-अभिशापात्मक बल है; ‘पीछा करे’ उसके सीधे अर्थ और काव्यगत क्रम को बनाए रखता है।
- source_word: אוֹיֵב
  choice: शत्रु
  rationale: इब्रानी में संज्ञा एकवचन है। हिन्दी में बिना अनावश्यक निश्चितता जोड़े ‘शत्रु’ स्वाभाविक और संदर्भानुकूल है।
- source_word: נַפְשִׁי
  choice: मेरे प्राण
  rationale: נפשׁ यहाँ पीछा किए और पकड़े जा सकने वाले व्यक्ति अथवा उसके जीवन को सूचित करता है। ‘प्राण’ हिन्दी में जीवन और जीवित स्व, दोनों की अर्थछाया रखता है।
- source_word: וְיַשֵּׂג
  choice: और उसे पकड़ ले
  rationale: क्रिया का अर्थ पीछा करते हुए जा पहुँचना या पकड़ लेना है; सर्वनाम का संबंध पिछले पद ‘मेरे प्राण’ से स्वाभाविक रूप से जुड़ता है।
- source_word: וְיִרְמֹס
  choice: वह ... रौंद डाले
  rationale: यह पैरों तले रौंदने की हिंसक छवि और कामनार्थक बल, दोनों को व्यक्त करता है।
- source_word: לָאָרֶץ
  choice: भूमि पर
  rationale: रौंदने के संदर्भ में ‘भूमि पर’ इब्रानी ‘धरती/भूमि की ओर’ का स्वाभाविक हिन्दी रूप है।
- source_word: חַיָּי
  choice: मेरे जीवन
  rationale: बहुवचन रूप यहाँ मुहावरे के अनुसार जीवन को दर्शाता है; हिन्दी में एकवचन ‘जीवन’ सहज है।
- source_word: וּכְבוֹדִי
  choice: मेरी महिमा
  rationale: ‘महिमा’ मूल शब्द की काव्यात्मक व्यापकता बनाए रखती है, जिसमें सम्मान, गरिमा या व्यक्ति का गौरवपूर्ण पक्ष सम्मिलित हो सकता है।
- source_word: לֶעָפָר
  choice: धूल में
  rationale: यह अपमान और मृत्यु से जुड़ी मूल काव्य-छवि को सुरक्षित रखता है।
- source_word: יַשְׁכֵּן
  choice: बसा दे
  rationale: हिफ़ील रूप के कारणात्मक अर्थ ‘बसाए/निवास कराए’ को बनाए रखते हुए यह धूल में स्थायी रूप से गिरा दिए जाने की काव्यात्मक छवि व्यक्त करता है।
- source_word: סֶלָה
  choice: सेला
  rationale: शब्द का सटीक अर्थ अनिश्चित है, इसलिए प्रचलित लिप्यंतरण रखा गया है।
theological_decisions:
- issue: נַפְשִׁי का मानव-स्वरूप संबंधी अर्थ
  choice: मेरे प्राण
  alternative: मेरा जीवन; मेरा प्राण/स्वयं मैं
  rationale: संदर्भ शारीरिक पीछा, पकड़े जाने और रौंदे जाने का है। ‘प्राण’ जीवन और जीवित व्यक्ति की अर्थछाया रखता है तथा मूल पाठ से अपेक्षित न होने वाला कठोर शरीर-आत्मा विभाजन नहीं थोपता।
- issue: काव्यात्मक आत्म-संदर्भ में כְבוֹדִי का अर्थ
  choice: मेरी महिमा
  alternative: मेरा सम्मान; मेरी गरिमा
  rationale: मूल शब्द भजनकार के सम्मान, गौरव या गौरवपूर्ण स्व को सूचित कर सकता है। ‘महिमा’ उसकी काव्यात्मक खुलावट को बनाए रखती है, जबकि अन्य संभावनाएँ पादटिप्पणी में दी गई हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और काव्यात्मक शैली रखी गई है। ‘रौंद डाले’ आत्म-अभिशाप की तीव्रता व्यक्त करता है, जबकि ‘धूल में बसा दे’ मूल कारणात्मक और असामान्य काव्य-चित्र को जानबूझकर सुरक्षित रखता है।
