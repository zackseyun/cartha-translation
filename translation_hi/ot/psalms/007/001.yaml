  text: יְהוָ֣ה אֱ֭לֹהַ/י בְּ/ךָ֣ חָסִ֑יתִי הוֹשִׁיעֵ֥/נִי מִ/כָּל רֹ֝דְפַ֗/י וְ/הַצִּילֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/007/001.yaml
  text: O Yahweh my God[a], in you I have taken refuge; save me from all who pursue me, and deliver me.
translation:
  language: hi
  text: हे याहवे, मेरे परमेश्वर, मैंने तुझमें शरण ली है[a]; मेरा पीछा करनेवाले सब लोगों से मुझे बचा और मुझे छुड़ा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मैं तुझमें शरण लेता हूँ।” प्रार्थना के इस संदर्भ में इब्रानी पूर्ण रूप का अनुवाद वर्तमान काल में भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय ईश्वरीय नाम को उपाधि से बदलने के बजाय आधुनिक हिन्दी में सीधे लिप्यंतरित किया गया है।
- source_word: אֱלֹהַי
  choice: मेरे परमेश्वर
  rationale: प्रथम पुरुष एकवचन प्रत्यय सहित रूप का स्वाभाविक अर्थ “मेरे परमेश्वर” है; यह याहवे को सीधे संबोधन का भाग है।
- source_word: בְּךָ
  choice: तुझमें
  rationale: ב उपसर्ग और द्वितीय पुरुष एकवचन प्रत्यय का सीधा अर्थ “तुझमें” है; मूल में “केवल” नहीं है।
- source_word: חָסִיתִי
  choice: मैंने शरण ली है
  rationale: חסה के काल पूर्ण रूप में शरण लेने का कार्य और उसकी वर्तमान प्रासंगिकता दोनों व्यक्त होते हैं; हिन्दी का पूर्ण वर्तमान इसे स्वाभाविक ढंग से संप्रेषित करता है।
- source_word: הוֹשִׁיעֵנִי
  choice: मुझे बचा
  rationale: ישׁע का हिफ़ील आज्ञार्थक रूप प्रार्थना में बचाने का अनुरोध करता है; यह अगले क्रियापद से हल्का शब्दार्थिक भेद भी बनाए रखता है।
- source_word: מִכָּל רֹדְפַי
  choice: मेरा पीछा करनेवाले सब लोगों से
  rationale: कृदंत ongoing पीछा करने की क्रिया दर्शाता है। “सतानेवाले” उद्देश्य को अनावश्यक रूप से अधिक निश्चित कर देता, इसलिए अधिक प्रत्यक्ष अभिव्यक्ति चुनी गई है।
- source_word: וְהַצִּילֵנִי
  choice: और मुझे छुड़ा
  rationale: נצל का हिफ़ील आज्ञार्थक रूप संकट से निकालने या छुड़ाने का भाव रखता है और पहले आए “बचा” से मूल के क्रियात्मक भेद को बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में वाचा का विशिष्ट ईश्वरीय नाम सीधे आया है। “याहवे” उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और उसे सामान्य उपाधि में नहीं बदलता।
- issue: חָסִיתִי के पूर्ण रूप का कालगत भाव
  choice: मैंने शरण ली है
  alternative: मैं तुझमें शरण लेता हूँ
  rationale: पूर्ण रूप पूर्व में किए गए और वर्तमान में प्रभावी भरोसे को व्यक्त कर सकता है, जबकि प्रार्थनात्मक संदर्भ में वर्तमान अर्थ भी संभव है; इस वास्तविक अस्पष्टता को पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और प्रार्थनात्मक रखी गई है। परमेश्वर के सीधे संबोधन में एकवचन निकटता बनाए रखने के लिए “तुझमें” चुना गया है; आज्ञार्थक “बचा” और “छुड़ा” मूल की संक्षिप्त, तीव्र पुकार को सुरक्षित रखते हैं।
