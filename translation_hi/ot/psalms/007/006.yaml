reference: Psalms 7:6
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: ק֘וּמָ֤/ה יְהוָ֨ה בְּ/אַפֶּ֗/ךָ הִ֭נָּשֵׂא בְּ/עַבְר֣וֹת צוֹרְרָ֑/י וְ/ע֥וּרָ/ה אֵ֝לַ֗/י מִשְׁפָּ֥ט צִוִּֽיתָ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/007/006.yaml
  text: Rise up[a], O Yahweh, in your anger; lift yourself up against the fury of my enemies; awake for me[c][b]; you have appointed judgment.
translation:
  language: hi
  text: हे याहवे, अपने क्रोध में उठ खड़ा हो; मेरे विरोधियों के प्रकोप के विरुद्ध ऊँचा उठ[a]; मेरे लिए[b] जाग उठ; तूने न्याय का आदेश दिया है।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरे विरोधियों के प्रकोप के विरुद्ध ऊँचा हो।” इब्रानी क्रिया में ‘ऊँचा उठने’ या ‘महिमान्वित होने’ का भाव भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “मेरी ओर”; आशय “मेरी ओर से” भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: या, “वह न्याय जिसका तूने आदेश दिया है।”
    reason: alternative_reading
lexical_decisions:
- source_word: קוּמָה
  choice: उठ खड़ा हो
  rationale: यह קום का आज्ञार्थक रूप है। ‘उठ खड़ा हो’ कार्रवाई करने की सजीव काव्यात्मक छवि को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी लिपि में लिप्यंतरित किया गया है।
- source_word: בְּאַפֶּךָ
  choice: अपने क्रोध में
  rationale: אַף का मूल अर्थ नाक है, पर यहाँ इसका प्रचलित भावार्थ ‘क्रोध’ स्पष्ट है।
- source_word: הִנָּשֵׂא
  choice: ऊँचा उठ
  rationale: נשׂא के निफ़अल आज्ञार्थक रूप में उठने और ऊँचा होने दोनों का भाव संभव है। यह चयन कार्रवाई की छवि रखता है, जबकि वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: בְּעַבְרוֹת צוֹרְרָי
  choice: मेरे विरोधियों के प्रकोप के विरुद्ध
  rationale: עֶבְרָה तीव्र, उमड़ते क्रोध या प्रकोप को व्यक्त करता है; צורר शत्रुतापूर्ण विरोधी को दर्शाता है। सम्बन्धवाचक ב को प्रसंगानुसार ‘के विरुद्ध’ किया गया है।
- source_word: וְעוּרָה
  choice: जाग उठ
  rationale: עור का आज्ञार्थक रूप परमेश्वर से हस्तक्षेप की काव्यात्मक पुकार है। ‘जाग उठ’ मानवीकरण को बिना व्याख्यात्मक ढंग से नरम किए बनाए रखता है।
- source_word: אֵלַי
  choice: मेरे लिए
  rationale: शाब्दिक अर्थ ‘मेरी ओर’ है, पर न्यायिक विनती में लाभार्थक अर्थ ‘मेरे लिए/मेरी ओर से’ स्वाभाविक है।
- source_word: מִשְׁפָּט צִוִּיתָ
  choice: तूने न्याय की आज्ञा दी है
  rationale: מִשְׁפָּט न्यायिक निर्णय या न्याय-कार्य को और צוה आज्ञा देने को दर्शाता है। हिन्दी वाक्य मूल के संक्षिप्त कथन को बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम का प्रयोग करता है; लिप्यंतरण नाम और उपाधि के भेद को सुरक्षित रखता है।
- issue: परमेश्वर को संबोधित मानवीकरणयुक्त आज्ञार्थक क्रियाएँ
  choice: ‘उठ खड़ा हो… ऊँचा उठ… जाग उठ’ को बनाए रखना
  alternative: ‘कार्रवाई कर’ या ‘हस्तक्षेप कर’ के रूप में अर्थानुवाद
  rationale: मूल की तीखी काव्यात्मक विनती सुरक्षित रहती है, पर इससे परमेश्वर के सचमुच सोए या निष्क्रिय होने का धर्मसैद्धान्तिक निष्कर्ष नहीं निकाला जाता।
- issue: अंतिम पदबंध का वाक्यगत सम्बन्ध
  choice: ‘तूने न्याय की आज्ञा दी है’ को स्वतंत्र कथन के रूप में रखना
  alternative: ‘उस न्याय के लिए जाग उठ जिसकी तूने आज्ञा दी है’
  rationale: इब्रानी शब्दक्रम दोनों सम्बन्धों की अनुमति देता है। मुख्य पाठ मसोराई विरामों के अनुरूप स्वतंत्र कथन रखता है और दूसरा सम्भव सम्बन्ध पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और प्रार्थनात्मक रखी गई है। परमेश्वर के लिए निकट और काव्यात्मक एकवचन ‘तू’ प्रयुक्त हुआ है। समानांतर आज्ञार्थक क्रियाओं और न्यायिक विनती की तीव्रता को बनाए रखा गया है।
