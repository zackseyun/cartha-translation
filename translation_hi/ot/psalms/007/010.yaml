  text: My shield is with God[b][a], who saves the upright in heart.
translation:
  language: hi
  text: मेरी ढाल परमेश्वर पर टिकी है[a], जो उनका उद्धार करता है जिनका मन सीधा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “परमेश्वर मेरी ढाल है।” हिब्रू वाक्य बहुत संक्षिप्त है और इस प्रकार की पुनर्रचना भी संभव है।
    reason: alternative_reading
lexical_decisions:
- source_word: מָגִנִּי
  choice: मेरी ढाल
  rationale: मूल संज्ञा का ठोस अर्थ ‘ढाल’ है। इसे बनाए रखने से भजन का सुरक्षा-संबंधी रूपक सुरक्षित रहता है।
- source_word: עַל
  choice: के पास है
  rationale: यहाँ संबंध और भरोसे का भाव है। ‘के पास है’ हिब्रू की संक्षिप्त रचना को निकटता से रखता है और परमेश्वर में सुरक्षा पाए जाने का संकेत देता है; संभावित वैकल्पिक पुनर्रचना पादटिप्पणी में दी गई है।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: बहुवचन रूप यहाँ इस्राएल के एक परमेश्वर के लिए प्रयुक्त है; आधुनिक मानक हिन्दी में ‘परमेश्वर’ उपयुक्त एकवचन अनुवाद है।
- source_word: מוֹשִׁיעַ
  choice: जो ... बचाता है
  rationale: कृदंत परमेश्वर के नियमित या चरित्रगत कार्य का वर्णन करता है। संबंधवाचक उपवाक्य हिन्दी में स्वाभाविक है।
- source_word: יִשְׁרֵי לֵב
  choice: मन के सीधे लोगों
  rationale: यह पदबंध आंतरिक नैतिक खराई बताता है। ‘मन के सीधे’ हिब्रू के ‘हृदय में सीधे’ मुहावरे को सरल, वर्तमान हिन्दी में व्यक्त करता है और इसे अलग शब्द-क्षेत्र वाले ‘धर्मी’ से नहीं मिलाता।
theological_decisions:
- issue: पहले अर्धपद का वाक्य-विन्यास
  choice: ‘मेरी ढाल परमेश्वर के पास है’—भजनकार की सुरक्षा परमेश्वर के पास होने का कथन
  alternative: ‘परमेश्वर मेरी ढाल है’
  rationale: हिब्रू में स्पष्ट संयोजक क्रिया नहीं है और रचना अत्यंत संक्षिप्त है। मुख्य पाठ मूल शब्द-क्रम और संबंध को यथासंभव बनाए रखता है; अधिक व्याख्यात्मक किंतु संभव पुनर्रचना पादटिप्पणी में दी गई है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘ढाल’ का काव्यात्मक रूपक सुरक्षित है; ‘मन के सीधे लोग’ सामान्य पाठक के लिए ‘हृदय में सीधे’ की अपेक्षा अधिक स्वाभाविक है।
