translation:
  language: hi
  text: 'उसने गड्ढा खोदा और उसे गहरा किया,

    और जिस गड्ढे को उसने बनाया था उसमें वह गिर पड़ा।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בּוֹר
  choice: गड्ढा
  rationale: यहाँ शब्द किसी फंदे के लिए खोदे गए गड्ढे को दर्शाता है; इसलिए अधिक विशिष्ट ‘कुआँ’ की अपेक्षा ‘गड्ढा’ उपयुक्त है।
- source_word: כָּרָה
  choice: खोदा
  rationale: क्रिया का सीधा अर्थ खोदना है और इससे पद का ठोस चित्र स्वाभाविक हिंदी में बना रहता है।
- source_word: וַיַּחְפְּרֵהוּ
  choice: और उसे गहरा किया
  rationale: यह क्रिया पहले खोदने के बाद आगे की खुदाई का संकेत देती है। ‘उसे गहरा किया’ क्रमिक तीव्रता व्यक्त करता है और अनावश्यक पुनरुक्ति से बचता है।
- source_word: וַיִּפֹּל
  choice: वह गिर पड़ा
  rationale: यह सरल कथात्मक क्रम और घटना की संक्षिप्तता को बनाए रखता है।
- source_word: שַׁחַת
  choice: खाई
  rationale: संदर्भ में यह खोदी हुई फंदेनुमा जगह है। पहले आए ‘गड्ढा’ से शब्दगत भेद रखते हुए ‘खाई’ भौतिक बिंब को सुरक्षित रखता है।
- source_word: יִפְעָל
  choice: उसने बनाई थी
  rationale: संदर्भ में व्यापक क्रिया פעל उस चीज़ को बनाने या तैयार करने की ओर संकेत करती है जिसे उसने खोदा था।
