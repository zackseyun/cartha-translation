  text: 'Look: he labors with wickedness, conceives trouble, and gives birth to falsehood.[a]'
translation:
  language: hi
  text: देखो, वह दुष्टता को लेकर प्रसव-पीड़ा से तड़पता है, अनिष्ट को गर्भ में धारण करता है और झूठ को जन्म देता है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में प्रसव-पीड़ा, गर्भधारण और जन्म के बिंब एक के बाद एक आते हैं। पहले क्रियापद का अनुवाद ‘जन्म देने के लिए कष्ट उठाता है’ भी किया जा सकता है; साथ ही ‘दुष्टता’ और ‘अनिष्ट’ के अर्थों में कुछ समानता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: देखो
  rationale: यह विस्मयादिबोधक पाठक का ध्यान इस सजीव चित्र की ओर खींचता है; ‘देखो’ आधुनिक और स्वाभाविक हिन्दी है।
- source_word: יְחַבֶּל
  choice: प्रसव-पीड़ा से तड़पता है
  rationale: इस रूप में क्रिया प्रसव-वेदना अथवा प्रसव के लिए तड़पने का भाव देती है। यह चयन अगले गर्भधारण और जन्म के बिंब से उसका संबंध बनाए रखता है।
- source_word: אָוֶן
  choice: दुष्टता
  rationale: इस शब्द में नैतिक बुराई और उससे उपजने वाले अनर्थ दोनों के भाव हो सकते हैं। ‘दुष्टता’ कर्ता की नैतिक जिम्मेदारी को स्पष्ट रखती है और अगले עָמָל से भेद भी बनाए रखती है।
- source_word: הָרָה
  choice: गर्भ में धारण करता है
  rationale: यह गर्भवती होने या गर्भधारण करने की क्रिया है। हिन्दी वाक्यांश मूल के गर्भ-संबंधी बिंब को स्पष्ट और स्वाभाविक रूप में रखता है।
- source_word: עָמָל
  choice: अनिष्ट
  rationale: यहाँ शब्द कष्ट, उपद्रव अथवा हानिकारक कुकर्म का संकेत देता है। ‘अनिष्ट’ नैतिक और हानिकारक दोनों पक्षों को संक्षेप में व्यक्त करता है।
- source_word: יָלַד שָׁקֶר
  choice: झूठ को जन्म देता है
  rationale: यह वाक्यांश जन्म के रूपक को पूरा करता है और שָׁקֶר के झूठ, मिथ्यापन तथा छल के केंद्रीय भाव को सहज हिन्दी में व्यक्त करता है।
