id: PSA.7.9
reference: Psalms 7:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: יִגְמָר נָ֬א רַ֨ע רְשָׁעִים֮ וּ/תְכוֹנֵ֪ן צַ֫דִּ֥יק וּ/בֹחֵ֣ן לִ֭בּ֗וֹת וּ/כְלָי֗וֹת אֱלֹהִ֥ים צַדִּֽיק־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/007/009.yaml
  text: Please let the evil of the wicked come to an end, but establish the righteous—O righteous God who examines hearts and kidneys.
translation:
  language: hi
  text: दुष्टों की बुराई का अंत हो जाए, और धर्मी को स्थिर कर—हे धर्मी परमेश्वर, तू हृदयों और गुर्दों[a] को जाँचता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी मुहावरे में ‘हृदय’ और ‘गुर्दे’ मनुष्य के भीतरी विचारों, इच्छाओं और भावनाओं को दर्शाते हैं।
    reason: ‘गुर्दों’ का शाब्दिक रूपक आधुनिक हिन्दी पाठक को अस्पष्ट लग सकता है, इसलिए उसके सांस्कृतिक-मुहावरेदार आशय की व्याख्या आवश्यक है।
lexical_decisions:
- source_word: יִגְמָר נָא רַע רְשָׁעִים
  choice: दुष्टों की बुराई का अंत हो जाए
  rationale: जुस्सिव भाव और נָא की विनती को स्वाभाविक हिन्दी में रखा गया है; ‘बुराई’ को दुष्ट व्यक्तियों के बजाय उनकी बुराई से जोड़ा गया है।
- source_word: וּתְכוֹנֵן צַדִּיק
  choice: और धर्मी को स्थिर कर
  rationale: כונן के ‘स्थापित/दृढ़ करना’ अर्थ को ‘स्थिर कर’ से व्यक्त किया गया है और צַדִּיק के एकवचन को बनाए रखा गया है।
- source_word: וּבֹחֵן לִבּוֹת וּכְלָיוֹת
  choice: तू हृदयों और गुर्दों को जाँचता है
  rationale: मूल के दोनों शारीरिक रूपकों और बहुवचन को सुरक्षित रखा गया है; हिन्दी पाठक के लिए इनके मुहावरेदार आशय को पादटिप्पणी में स्पष्ट किया गया है।
- source_word: אֱלֹהִים צַדִּיק
  choice: हे धर्मी परमेश्वर
  rationale: צַדִּיק को परमेश्वर का गुण मानते हुए संबोधन के रूप में प्रस्तुत किया गया है, जो पद की प्रार्थनात्मक वाक्यरचना के अनुकूल है।
theological_decisions:
- issue: परमेश्वर द्वारा ‘हृदयों और गुर्दों’ की जाँच
  choice: मूल शारीरिक रूपकों को मुख्य पाठ में बनाए रखना
  alternative: ‘मन और अंतरतम’ अथवा ‘विचारों और भावनाओं’ को जाँचता है
  rationale: इब्रानी मानव के भीतरी नैतिक, बौद्धिक और भावात्मक जीवन के लिए इन अंगों का प्रयोग करता है। रूपकों को हटाने से मूल चित्र और उसकी व्यापकता संकुचित हो सकती थी।
- issue: צַדִּיק का पहला प्रयोग
  choice: एकवचन ‘धर्मी’
  alternative: सामूहिक अर्थ स्पष्ट करने के लिए ‘धर्मी लोगों’
  rationale: मूल व्याकरणिक एकवचन को सुरक्षित रखा गया है; यह किसी धर्मी व्यक्ति या धर्मी जन के प्रतिनिधिक/सामूहिक अर्थ—दोनों की संभावना खुली रखता है।
translation_notes:
  register: आधुनिक, सहज और प्रार्थनात्मक हिन्दी अपनाई गई है। परमेश्वर के लिए निकट और भक्तिपूर्ण एकवचन ‘तू/कर’ रखा गया है। ‘गुर्दों’ जैसा ठोस मूल रूपक पादटिप्पणी सहित सुरक्षित है।
