  yaml_path: translation/ot/psalms/007/008.yaml
  text: Yahweh judges the peoples[a]; judge me, O Yahweh[c][b], according to my righteousness and according to my integrity that is upon me.
translation:
  language: hi
  text: याहवे लोगों का न्याय करता है। हे याहवे, मेरी धार्मिकता के अनुसार मेरा न्याय कर[a], और मुझमें जो खराई है, उसके अनुसार भी[b][c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मुझे निर्दोष ठहरा।” यहाँ “मेरा न्याय कर” का अर्थ मेरे पक्ष में न्यायपूर्ण निर्णय देना भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “मेरी निर्दोषता।”
    reason: lexical_alternative
  - marker: c
    text: 'शाब्दिक अर्थ: “जो मुझ पर है।”'
    reason: literal_rendering
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय हिन्दी में प्रचलित निकट लिप्यंतरण द्वारा रखा गया है।
- source_word: יָדִין
  choice: न्याय करता है
  rationale: अपूर्ण क्रिया यहाँ सामान्य अथवा सतत न्यायिक भूमिका व्यक्त कर सकती है; वर्तमानकाल अगले निवेदन से स्वाभाविक रूप से जुड़ता है।
- source_word: עַמִּים
  choice: जन-समुदायों
  rationale: बहुवचन में विभिन्न मानव-समूहों का व्यापक बोध सुरक्षित रहता है और आधुनिक राजनीतिक अर्थ वाले ‘राष्ट्रों’ से बचा जाता है।
- source_word: שָׁפְטֵנִי
  choice: मेरा न्याय कर
  rationale: आज्ञार्थक क्रिया का सीधा अर्थ रखा गया है और पहली पंक्ति के ‘न्याय’ से शब्दगत संबंध बना रहता है; प्रसंग में अनुकूल निर्णय का भाव पादटिप्पणी में दिया गया है।
- source_word: כְּצִדְקִי
  choice: मेरे धर्म के अनुसार
  rationale: यहाँ צדק वक्ता की नैतिक सत्यनिष्ठा अथवा इस मामले में उसके सही पक्ष को दर्शाता है; ‘धर्म’ हिन्दी बाइबलीय भाषा में संक्षिप्त और गरिमापूर्ण समतुल्य है।
- source_word: וּכְתֻמִּי
  choice: मेरी खराई के अनुसार
  rationale: תֹּם नैतिक संपूर्णता, निष्कपटता और निर्दोष आचरण का भाव देता है; ‘खराई’ पूर्ण पापहीनता का अनावश्यक दावा किए बिना इसे व्यक्त करती है।
- source_word: עָלָי
  choice: जो मुझमें है
  rationale: शाब्दिक ‘मुझ पर’ हिन्दी में इस आंतरिक गुण के साथ अस्वाभाविक है; मुख्य पाठ में स्वाभाविक संबंध व्यक्त किया गया है और मूल बिंब पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: क्या भजनकार के अपने धर्म और खराई के दावे को पूर्ण पापहीनता के दावे के रूप में स्पष्ट किया जाए
  choice: प्रथम पुरुष के दावे को उसके धर्म और खराई के सीधे उल्लेख के रूप में बनाए रखना
  alternative: मुख्य पाठ में इसे केवल ‘इस मामले में मेरी निर्दोषता’ या ‘मेरे न्यायपूर्ण पक्ष’ तक सीमित कर देना
  rationale: इब्रानी पाठ स्पष्टतः ‘मेरे धर्म’ और ‘मेरी खराई’ कहता है। मुख्य पाठ इस तनाव को न तो पूर्ण पापहीनता में बदलता है, न उसे व्याख्यात्मक रूप से कमजोर करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सामान्य पाठक के लिए स्पष्ट शैली अपनाई गई है। ‘याहवे’ को नाम के रूप में रखा गया है। समान मूल न्यायिक शब्दों को ‘न्याय करता है/मेरा न्याय कर’ से जोड़ा गया है, जबकि עָלָי की शाब्दिक अभिव्यक्ति को मुख्य पाठ की स्वाभाविकता बनाए रखने हेतु पादटिप्पणी में दिया गया है।
