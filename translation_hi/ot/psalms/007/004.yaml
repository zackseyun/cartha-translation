  text: if I have repaid the one at peace with me with evil[a], or delivered my enemy for nothing—
translation:
  language: hi
  text: 'यदि मैंने उस व्यक्ति को, जिसके साथ मेरी शांति थी, बुराई का बदला दिया हो,

    या अपने बैरी को अकारण लूटा हो[a]—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बल्कि मैंने अपने शत्रु को बिना कारण छुड़ाया हो।” रֵिकाम को “खाली हाथ” भी समझा जा सकता है। इब्रानी क्रिया का सामान्य अर्थ “छुड़ाना” है, पर इस कठिन पंक्ति में इसे “लूटना” या “वंचित करना” भी समझा गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: אִם
  choice: यदि
  rationale: यह आत्म-शाप की शर्त का आरम्भ करता है; आधुनिक हिन्दी में ‘यदि’ स्वाभाविक और गरिमापूर्ण है।
- source_word: גָּמַלְתִּי
  choice: बदला दिया हो
  rationale: गमल क्रिया यहाँ किसी के व्यवहार का प्रतिफल देने का भाव रखती है; ‘बुराई का बदला दिया’ नैतिक प्रत्युत्तर की धारणा को स्पष्ट रखता है।
- source_word: שׁוֹלְמִי
  choice: मेरे साथ शान्ति से रहनेवाले
  rationale: यह शब्द ऐसे व्यक्ति को सूचित करता है जो वक्ता के साथ शान्तिपूर्ण सम्बन्ध में है; यह ‘मित्र’ या ‘सहयोगी’ से अधिक स्रोत-सन्निकट है।
- source_word: רָע
  choice: बुराई
  rationale: यह किए गए प्रतिफल की नैतिक प्रकृति को व्यक्त करता है; ‘हानि’ की अपेक्षा ‘बुराई’ मूल के नैतिक बल को बेहतर बनाए रखती है।
- source_word: וָאֲחַלְּצָה
  choice: या ... लूटा हो
  rationale: חלץ का सामान्य अर्थ ‘छुड़ाना/बचाना’ है, पर इस कठिन सन्दर्भ में समानान्तर अपराध के रूप में ‘लूटना/वंचित करना’ अर्थ भी प्रस्तावित है। मुख्य पाठ में नकारात्मक समानान्तरता को रखा गया है और सामान्य ‘छुड़ाना’ अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: צוֹרְרִי
  choice: अपने बैरी को
  rationale: यह विरोध या शत्रुता करनेवाले व्यक्ति को दर्शाता है; ‘बैरी’ काव्यात्मक होते हुए भी सामान्य हिन्दी में बोधगम्य है।
- source_word: רֵיקָם
  choice: अकारण
  rationale: यहाँ इसका अर्थ ‘बिना उचित कारण’ लिया गया है, जो अन्यायपूर्ण कार्य के निषेध के अनुकूल है; ‘खाली हाथ’ भी सम्भव अर्थ है।
theological_decisions:
- issue: וָאֲחַלְּצָה צוֹרְרִי רֵיקָם का अर्थ
  choice: 'नकारात्मक समानान्तर अर्थ: ‘या अपने बैरी को अकारण लूटा हो’'
  alternative: 'सकारात्मक/रियायती अर्थ: ‘यद्यपि मैंने अपने अकारण बैरी को छुड़ाया था’ या ‘मैंने अपने बैरी को खाली हाथ छुड़ा दिया था’'
  rationale: इब्रानी पदबंध शब्दार्थ और वाक्य-संरचना दोनों में कठिन है। חלץ प्रायः ‘छुड़ाना’ होता है, पर वह अर्थ शर्त में गिनाए अपराधों की समानान्तरता को तोड़ता है और रियायती सम्बन्ध को निहित मानने की माँग करता है। नकारात्मक अर्थ समानान्तरता बनाए रखता है, किन्तु सामान्य शब्दार्थ कम प्रत्यक्ष है; इसलिए वैकल्पिक पाठ पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण काव्यात्मक शैली रखी गई है। ‘मेरे साथ शान्ति से रहनेवाले’ स्रोत के सम्बन्धसूचक भाव को स्पष्ट करता है। ‘बैरी’ भजन-साहित्य के काव्यात्मक रजिस्टर के अनुकूल और सामान्य पाठक के लिए बोधगम्य है।
