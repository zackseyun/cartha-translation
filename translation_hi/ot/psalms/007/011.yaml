  text: אֱ֭לֹהִים שׁוֹפֵ֣ט צַדִּ֑יק וְ֝/אֵ֗ל זֹעֵ֥ם בְּ/כָל יֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/007/011.yaml
  text: God is a righteous judge[b][a], and a God who is indignant every day.
translation:
  language: hi
  text: परमेश्वर धर्मी न्यायाधीश हैं, और प्रतिदिन क्रोधित होते हैं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और परमेश्वर प्रतिदिन क्रोधित होते हैं।”
    reason: दूसरे खंड को स्वतंत्र वाक्य के रूप में भी अनुवादित किया जा सकता है; זֹעֵם के लिए ‘क्रोधित होते हैं’ एक स्वाभाविक सामान्य विकल्प है।
lexical_decisions:
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: इस भजन के संदर्भ में बहुवचन रूप एकमात्र परमेश्वर के लिए एकवचन अर्थ में प्रयुक्त है; ‘परमेश्वर’ स्वाभाविक और प्रतिष्ठित हिन्दी रूप है।
- source_word: שׁוֹפֵט
  choice: न्यायी हैं
  rationale: कृदन्त का अर्थ ‘न्याय करते हैं’ अथवा ‘न्यायी हैं’ हो सकता है। यहाँ विधेय-संज्ञा रूप परमेश्वर के चरित्र का वर्णन करता और अगले समानांतर विधेय से मेल खाता है।
- source_word: צַדִּיק
  choice: धर्मी
  rationale: यह शब्द नैतिक और न्यायपरक सहीपन को व्यक्त करता है। ‘धर्मी’ इसके नैतिक-धार्मिक आयाम को बनाए रखता है; ‘न्यायपूर्ण’ भी संदर्भगत विकल्प है।
- source_word: וְאֵל
  choice: और ऐसे ईश्वर
  rationale: אֵל यहाँ अֱלֹהִים के समानांतर उसी परमेश्वर का उल्लेख जारी रखता है। ‘ऐसे ईश्वर’ हिन्दी में विशेषणात्मक दूसरे खंड को स्वाभाविक बनाता है और स्रोत के संयोजक ‘और’ को सुरक्षित रखता है।
- source_word: זֹעֵם
  choice: रोष करते हैं
  rationale: कृदन्त निरंतर अथवा बार-बार होने वाले ईश्वरीय अप्रसन्नता के भाव को व्यक्त करता है। ‘रोष करते हैं’ नैतिक आक्रोश की गंभीरता को स्पष्ट और आधुनिक हिन्दी में बनाए रखता है।
- source_word: בְּכָל יוֹם
  choice: प्रतिदिन
  rationale: वाक्यांश का स्वाभाविक अर्थ ‘हर दिन/प्रतिदिन’ है, न कि अनिवार्यतः एक ही दिन भर निरंतर।
theological_decisions:
- issue: ईश्वरीय क्रोध की भाषा
  choice: जो प्रतिदिन रोष करते हैं
  alternative: जो प्रतिदिन क्रोधित होते हैं
  rationale: इब्रानी पाठ परमेश्वर को निरंतर या प्रतिदिन रोष करने वाला स्पष्टतः बताता है। अनुवाद इस धर्मवैचारिक तनाव को नरम नहीं करता; ‘रोष’ नैतिक अप्रसन्नता का गंभीर भाव देता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य पाठक के लिए बोधगम्य स्तर। ‘परमेश्वर’ और ‘ईश्वर’ स्रोत के אֱלֹהִים/אֵל समानांतर को हल्के रूप में दर्शाते हैं; बहुवचन आदरसूचक क्रियाएँ हिन्दी प्रयोग के अनुसार हैं।
