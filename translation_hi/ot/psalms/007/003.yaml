  text: יְהוָ֣ה אֱ֭לֹהַ/י אִם עָשִׂ֣יתִי זֹ֑את אִֽם יֶשׁ עָ֥וֶל בְּ/כַפָּֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/007/003.yaml
  text: O Yahweh my God[a], if I have done this, if there is injustice in my hands—
translation:
  language: hi
  text: हे याहवे, मेरे परमेश्वर, यदि मैंने यह किया है, यदि मेरे हाथों में कोई अन्याय है—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: यहवे
  rationale: परमेश्वर के वाचा-संबंधी व्यक्तिगत नाम को सामान्य हिंदी पाठक के लिए सुबोध देवनागरी लिप्यंतरण में रखा गया है।
- source_word: אֱלֹהַי
  choice: मेरे परमेश्वर
  rationale: प्रथम पुरुष एकवचन प्रत्यय का अर्थ ‘मेरे’ है; संबोधन में यह इस्राएल के परमेश्वर की ओर संकेत करता है।
- source_word: אִם
  choice: यदि
  rationale: यह शर्त के रूप में कही गई आत्म-शाप संबंधी घोषणा आरम्भ करता है और दोनों उपवाक्यों में स्वाभाविक है।
- source_word: עָשִׂיתִי זֹאת
  choice: मैंने यह किया है
  rationale: इब्रानी पूर्ण क्रिया और संकेतवाचक का सीधा अर्थ रखते हुए वर्तमान आरोप के संदर्भ में पूर्ण हो चुके कथित कार्य को व्यक्त करता है।
- source_word: עָוֶל
  choice: अन्याय
  rationale: यह शब्द नैतिक बुराई, दोष और न्याय-विरुद्ध आचरण का अर्थ दे सकता है; ‘अन्याय’ भजन के न्यायिक स्वर को बनाए रखता है।
- source_word: בְּכַפָּי
  choice: मेरे हाथों में
  rationale: ‘मेरी हथेलियों/हाथों में’ की इब्रानी छवि सुरक्षित रहती है और कृत्य की नैतिक जवाबदेही का संकेत भी मिलता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम सीधे आया है; उसका लिप्यंतरण नाम और उपाधि के बीच का भेद बनाए रखता है।
- issue: בְּכַפָּי में नैतिक दोष का आशय
  choice: छवि को ‘मेरे हाथों में’ के रूप में बनाए रखना
  alternative: मेरे हाथों पर दोष है; मैंने कोई बुराई की है
  rationale: शाब्दिक शारीरिक छवि और नैतिक दोष—दोनों उपस्थित रहने दिए गए हैं; व्याख्या को मुख्य पाठ में सीमित नहीं किया गया।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिंदी। ‘हे’ संबोधन की काव्यात्मक गंभीरता बनाए रखता है; अंत का दीर्घ विराम अगले पद में जारी शर्त और परिणाम की ओर संकेत करता है।
