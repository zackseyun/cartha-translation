  verdict: revise
  source_fidelity: The draft accurately conveys the verse's parallel image of harmful conduct returning upon its perpetrator. However, “उसका किया उपद्रव” adds an explicit participial/agentive nuance not stated by עֲמָלוֹ and is less direct than the Hebrew noun. “आ पड़ेगी” weakens the explicit downward movement of יֵרֵד; “उतर आएगी” better preserves it.
  naturalness: The proposed revision is idiomatic modern standard Hindi, retains the compact poetic parallelism, and avoids the somewhat cumbersome phrase “उसका किया उपद्रव.”
  terminology: “अनिष्ट” appropriately represents עָמָל in this context as harm or mischief without over-specifying it. “हिंसा” is a direct rendering of חָמָס, and “सिर की चोटी” naturally renders קָדְקֹד.
  issues:
  - severity: medium
    issue: “उसका किया उपद्रव” over-interprets and is stylistically awkward.
    rationale: The Hebrew עֲמָלוֹ is simply “his trouble/mischief/harm”; although the context implies culpable harm, “किया” makes that inference explicit and “उपद्रव” is narrower and more colloquial than necessary.
  - severity: low
    issue: “आ पड़ेगी” does not clearly retain the descent image of יֵרֵד.
    rationale: The source verb means “go down/descend.” “उतर आएगी” preserves both the direction and the poetic parallel with consequences falling on the head.
  revised_text: उसका अनिष्ट उसके अपने सिर पर लौट आएगा[a], और उसकी हिंसा उसके सिर की चोटी पर उतर आएगी[b]।
