  text: יָשׁ֣וּב עֲמָל֣/וֹ בְ/רֹאשׁ֑/וֹ וְ/עַ֥ל קָ֝דְקֳד֗/וֹ חֲמָס֥/וֹ יֵרֵֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/007/016.yaml
  text: His trouble returns on his own head[b][a], and his violence descends on his own skull.
translation:
  language: hi
  text: उसका अनिष्ट उसके अपने सिर पर लौट आएगा[a], और उसकी हिंसा उसके सिर की चोटी पर उतर आएगी[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसकी बुराई” या “उसका संकट।” इब्रानी शब्द का अर्थ अनिष्ट, बुराई, या संकट हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “उसके सिर के मुकुट पर।” इब्रानी शब्द सिर के ऊपरी भाग या चोटी को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשׁוּב
  choice: लौट आएगा
  rationale: यहाँ क्रिया उस दुष्ट के किए हुए अनिष्ट के पलटकर उसी पर आने का भाव व्यक्त करती है; ‘लौट आएगा’ इस प्रतिफलात्मक गति को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: עֲמָלוֹ
  choice: उसका किया उपद्रव
  rationale: עָמָל यहाँ सामान्य परिश्रम नहीं, बल्कि हानिकारक शरारत, अनिष्ट या उससे उत्पन्न संकट को सूचित करता है। ‘किया उपद्रव’ कर्ता की जिम्मेदारी और संदर्भ के नैतिक भाव को स्पष्ट रखता है।
- source_word: בְרֹאשׁוֹ
  choice: उसी के सिर पर
  rationale: ‘सिर पर लौटना’ परिणाम के स्वयं अपराधी पर आने का काव्यात्मक मुहावरा है; ‘उसी के’ प्रतिफल के आत्म-संबंधी बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: וְעַל
  choice: और ... पर
  rationale: साधारण संयोजक और संबंधसूचक पद को समानांतर काव्य-पंक्ति में सीधे रूप से रखा गया है।
- source_word: קָדְקֳדוֹ
  choice: उसी के सिर की चोटी
  rationale: קָדְקֹד सिर के सबसे ऊपरी भाग अथवा चोटी को दर्शाता है। यह चयन ‘सिर’ के साथ समानांतरता रखते हुए मूल की अधिक विशिष्ट देहात्मक छवि बचाता है।
- source_word: חֲמָסוֹ
  choice: उसकी हिंसा
  rationale: חָמָס हिंसा, क्रूरता अथवा हिंसक अन्याय को दर्शाता है; ‘हिंसा’ इसका सीधा और प्रसंगानुकूल अनुवाद है।
- source_word: יֵרֵד
  choice: आ पड़ेगी
  rationale: मूल क्रिया नीचे उतरने का चित्र प्रस्तुत करती है। हिन्दी में सिर पर किसी परिणाम के नीचे आ पड़ने की दिशा और आकस्मिक प्रतिफल को ‘आ पड़ेगी’ स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: काव्यात्मक न्याय में प्रतिफल का चित्र
  choice: दुष्ट का अपना किया उपद्रव और उसकी हिंसा पलटकर उसी पर आते हैं।
  alternative: इसे नैतिक प्रतिफल पर जोर दिए बिना केवल किसी व्यक्ति पर संकट लौटने के सामान्य कथन के रूप में पढ़ा जा सकता है।
  rationale: ‘उसका’ की पुनरावृत्ति, सिर पर लौटने और सिर की चोटी पर उतरने की समानांतर छवियाँ कर्म के अपराधी पर ही पलट आने का भाव देती हैं। अनुवाद इस काव्यात्मक नैतिक बल को रखता है, पर पाठ से आगे कोई व्यवस्थित धर्म-सिद्धांत नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज किंतु गरिमापूर्ण काव्यात्मक शैली अपनाई गई है। दोनों अर्ध-पंक्तियों की समानांतरता, आत्म-प्रतिफल का बल और सिर पर नीचे आने की देहात्मक छवि सुरक्षित रखी गई है।
