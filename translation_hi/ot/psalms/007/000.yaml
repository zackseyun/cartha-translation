    text: यह संभवतः संगीत या काव्य से जुड़ा कोई तकनीकी शब्द है, जिसका अर्थ ‘विलाप’ या ‘उन्मुक्त गीत’ जैसा हो सकता है; इब्रानी शब्द शिग्गायोन दुर्लभ है और इसका ठीक अर्थ निश्चित नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁגָּיוֹן
  choice: शिग्गायोन
  rationale: यह दुर्लभ और अनिश्चित तकनीकी काव्य-संगीत संबंधी शब्द है। अर्थ का अनुमान लगाने के बजाय लिप्यंतरण मूल की अस्पष्टता और शीर्षक के तकनीकी स्वरूप को सुरक्षित रखता है।
- source_word: לְדָוִד
  choice: दाऊद का
  rationale: भजन-शीर्षकों में לְ लेखकत्व, संबंध या समर्पण का संकेत दे सकता है। ‘दाऊद का’ संक्षिप्त है और ‘दाऊद द्वारा’ की अपेक्षा इस व्यापकता को बेहतर बनाए रखता है।
- source_word: אֲשֶׁר שָׁר
  choice: जिसे उसने ... गाया
  rationale: संबंधवाचक उपवाक्य और שׁיר के पूर्ण क्रियारूप का स्वाभाविक आधुनिक हिन्दी रूप।
- source_word: לַיהוָה
  choice: याहवे के लिए
  rationale: לְ यहाँ गीत के संबोधन या अर्पण को दर्शाता है; ‘के लिए’ हिन्दी में इसे स्वाभाविक रूप से व्यक्त करता है। परमेश्वर के निज नाम को ‘याहवे’ के रूप में लिप्यंतरित किया गया है।
- source_word: עַל
  choice: के विषय में
  rationale: यह प्रसंग या विषय का संकेत दे सकता है। ‘के विषय में’ कारण-संबंध को अनावश्यक रूप से निश्चित किए बिना अर्थ को खुला रखता है।
- source_word: דִּבְרֵי
  choice: बातों
  rationale: דָּבָר के बहुवचन का अर्थ ‘शब्द’, ‘बातें’ या ‘मामले’ हो सकता है। ‘बातों’ हिन्दी में स्वाभाविक है और ‘आरोपों’ जैसी अधिक विशिष्ट व्याख्या नहीं थोपता।
- source_word: כּוּשׁ
  choice: कूश
  rationale: व्यक्तिवाचक नाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण।
- source_word: בֶּן יְמִינִי
  choice: बिन्यामीनी
  rationale: यह मुहावरा बिन्यामीन गोत्र के व्यक्ति को सूचित करता है; ‘बिन्यामीनी’ आधुनिक हिन्दी में संक्षिप्त और स्पष्ट है।
theological_decisions:
- issue: परमेश्वर के निज नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला निज नाम सीधे आया है। ‘याहवे’ उसका निकट लिप्यंतरण है और वाचा-संबंधी नाम को सामान्य उपाधि में नहीं बदलता।
translation_notes:
  register: भजन के शीर्षक के अनुरूप संक्षिप्त, गरिमापूर्ण और आधुनिक मानक हिन्दी रखी गई है। दुर्लभ तकनीकी पद का लिप्यंतरण किया गया है, जबकि उसकी अनिश्चितता पाद-टिप्पणी में स्पष्ट की गई है।
