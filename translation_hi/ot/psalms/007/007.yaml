  text: וַ/עֲדַ֣ת לְ֭אֻמִּים תְּסוֹבְבֶ֑/ךָּ וְ֝/עָלֶ֗י/הָ לַ/מָּר֥וֹם שֽׁוּבָ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/007/007.yaml
  text: And let the assembly of peoples surround you[b][a]; and over them return on high.
translation:
  language: hi
  text: और लोगों[a] की सभा तुझे चारों ओर से घेरे; और तू उसके[b] ऊपर ऊँचाई पर लौट आ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘जातियों’।
    reason: lexical_alternative
  - marker: b
    text: ‘उसके’ से आशय सामूहिक रूप में ‘सभा’ से है; भावानुसार इसका अर्थ ‘उनके’, अर्थात एकत्र लोगों के ऊपर, भी समझा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: עֲדַת
  choice: सभा
  rationale: यह संज्ञा एकत्र हुए समूह को दर्शाती है। ‘सभा’ आधुनिक हिन्दी में स्वाभाविक है और यहाँ विभिन्न लोगों के सामूहिक जमाव को बिना अनावश्यक धार्मिक रंग दिए व्यक्त करती है।
- source_word: לְאֻמִּים
  choice: लोगों
  rationale: बहुवचन संज्ञा अलग-अलग जातीय समुदायों या जनसमूहों को दर्शाती है। ‘लोगों’ इसका व्यापक सामूहिक अर्थ बनाए रखता है; ‘जातियों’ भी सम्भव है।
- source_word: תְּסוֹבְבֶךָּ
  choice: तुझे चारों ओर से घेरे
  rationale: संदर्भ में क्रिया को साधारण भविष्यवाणी के बजाय प्रार्थना या कामना के रूप में लेना उपयुक्त है। यह पदबंध घेरने के स्थानिक भाव को सहज हिन्दी में व्यक्त करता है।
- source_word: וְעָלֶיהָ
  choice: और तू उसके ऊपर
  rationale: हिब्रू प्रत्यय स्त्रीलिंग एकवचन है और सामूहिक संज्ञा ‘सभा’ की ओर लौटता है। हिन्दी में ‘उसके’ इस व्याकरणिक और सामूहिक संदर्भ को स्वाभाविक रूप से सुरक्षित रखता है।
- source_word: לַמָּרוֹם
  choice: ऊँचे स्थान पर
  rationale: מָרוֹם ऊँचाई या उन्नत स्थान को दर्शाता है। ‘ऊँचे स्थान पर’ स्थानिक तथा महिमामय दोनों सम्भावनाओं को बनाए रखता है और ‘स्वर्ग’ या ‘सिंहासन’ जैसी अधिक व्याख्यात्मक भाषा नहीं जोड़ता।
- source_word: שׁוּבָה
  choice: लौट आ
  rationale: यह שוב का आज्ञार्थक रूप है, जिसका मूल अर्थ लौटना या वापस मुड़ना है। ‘लौट आ’ प्रार्थनापूर्ण आज्ञा को सीधे और स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: क्या पद परमेश्वर के ऊँचे न्यायकारी शासन को दर्शाता है या ऊपर की ओर वास्तविक गति को
  choice: ऐसी काव्यात्मक प्रार्थना जो परमेश्वर से एकत्र लोगों के ऊपर ऊँचे स्थान पर लौटने को कहती है
  alternative: परमेश्वर से सभा के ऊपर शारीरिक रूप से स्वर्ग चढ़ने का अनुरोध; अथवा इसे भविष्यवाचक कथन मानना
  rationale: आज्ञार्थक שׁוּבָה प्रार्थना के पक्ष में है। ‘ऊँचे स्थान पर’ शासन और न्याय के सम्भावित रूपक को बनाए रखता है, पर हिब्रू में स्पष्ट न किए गए सिंहासन या ब्रह्माण्ड-विज्ञान को अनावश्यक रूप से नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और प्रार्थनात्मक रखी गई है। ‘तुझे’ और ‘लौट आ’ भजन की सीधी ईश-संबोधन शैली के अनुरूप हैं। वाक्य की काव्यात्मक समानांतरता और हिब्रू के सामूहिक एकवचन की अस्पष्टता सुरक्षित रखी गई है।
