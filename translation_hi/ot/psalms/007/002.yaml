source:
  edition: WLC
  text: פֶּן יִטְרֹ֣ף כְּ/אַרְיֵ֣ה נַפְשִׁ֑/י פֹּ֝רֵ֗ק וְ/אֵ֣ין מַצִּֽיל־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/007/002.yaml
  text: lest he tear my soul like a lion[a], rending it apart with no one to rescue.
translation:
  language: hi
  text: कहीं ऐसा न हो कि वह सिंह की तरह मुझे[a] फाड़कर चीर डाले, और बचानेवाला कोई न हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से “मेरे प्राण को”; इसका अर्थ यहाँ “मेरे जीवन को” या “मुझे” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּן
  choice: कहीं ऐसा न हो कि
  rationale: यह नकारात्मक आशंका या संभावित परिणाम व्यक्त करता है; यह हिंदी में चेतावनी और भय की शक्ति स्वाभाविक ढंग से बनाए रखता है।
- source_word: יִטְרֹף
  choice: फाड़कर
  rationale: क्रिया शिकारी पशु द्वारा शिकार को फाड़ने का सजीव चित्र प्रस्तुत करती है।
- source_word: כְּאַרְיֵה
  choice: सिंह की तरह
  rationale: उपसर्ग כְּ द्वारा व्यक्त स्पष्ट उपमा को सीधा और स्वाभाविक रूप दिया गया है।
- source_word: נַפְשִׁי
  choice: मुझे
  rationale: यहाँ נֶפֶשׁ संकट में पड़े पूरे व्यक्ति अथवा उसके जीवन को दर्शाता है; ‘मुझे’ हिंदी में हिंसक आक्रमण की छवि के साथ स्वाभाविक है, जबकि शाब्दिक विकल्प पाद-टिप्पणी में रखा गया है।
- source_word: פֹּרֵק
  choice: चीर डाले
  rationale: यह सहभागी रूप पहले की हिंसक क्रिया को तीव्र और विस्तृत करता है; ‘चीर डाले’ विनाशकारी फाड़ने का भाव बनाए रखता है।
- source_word: וְאֵין מַצִּיל
  choice: और बचानेवाला कोई न हो
  rationale: यह बचाने वाले के पूर्ण अभाव को स्पष्ट करता है और इब्रानी वाक्य की अंतिम असहायता को बनाए रखता है।
theological_decisions:
- issue: נֶפֶשׁ का मानवशास्त्रीय अर्थ
  choice: मुख्य पाठ में ‘मुझे’, पाद-टिप्पणी में ‘मेरे प्राण/मेरे जीवन को’
  alternative: ‘मेरी आत्मा को’
  rationale: इस प्रसंग में शब्द का संकेत मृत्यु के खतरे में पड़े व्यक्ति या जीवन से है; ‘आत्मा’ कहना अनावश्यक रूप से केवल अभौतिक अंग का अर्थ दे सकता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिंदी। ‘फाड़कर चीर डाले’ मूल की दोहरी हिंसक अभिव्यक्ति को बनाए रखता है; ‘बचानेवाला’ तत्काल संकट से छुड़ाने वाले के अर्थ में है।
