- source_word: וְלֹו
  choice: और उसने उसके लिए
  rationale: לֹו का स्वाभाविक अर्थ ‘उसके लिए’ है; संदर्भ में संकेत पिछले पद के दुष्ट व्यक्ति की ओर है, जबकि कर्ता परमेश्वर है।
- source_word: הֵכִין
  choice: तैयार किए हैं
  rationale: כון के हिफ़िल रूप का अर्थ ‘तैयार करना’ है; पूर्ण की गई और वर्तमान में प्रासंगिक तैयारी को हिन्दी पूर्णकाल सहज रूप से व्यक्त करता है।
- source_word: כְּלֵי מָוֶת
  choice: मृत्यु के हथियार
  rationale: כְּלִי का अर्थ उपकरण या हथियार हो सकता है; अगले खंड में तीरों के कारण युद्ध-संबंधी ‘हथियार’ उपयुक्त है, और ‘मृत्यु के’ इब्रानी संबंध-रचना को बनाए रखता है।
- source_word: חִצָּיו
  choice: अपने तीरों को
  rationale: बहुवचन संज्ञा पर तृतीय पुरुष एकवचन प्रत्यय का सीधा अर्थ ‘उसके तीर’ है; हिन्दी में समान कर्ता के साथ ‘अपने’ अधिक स्वाभाविक और स्पष्ट है।
- source_word: לְדֹלְקִים
  choice: अग्निबाण
  rationale: דלק से निकला रूप ‘जलते हुए’ या ‘पीछा करनेवाले’ का अर्थ दे सकता है। तीरों के साथ मुख्य पाठ प्रचलित युद्ध-चित्र, अर्थात आग लगाए हुए तीर, को संक्षिप्त और स्वाभाविक हिन्दी ‘अग्निबाण’ से व्यक्त करता है; दूसरा अर्थ पादटिप्पणी में रखा गया है।
- source_word: יִפְעָל
  choice: बनाता है
  rationale: פעל का सामान्य अर्थ ‘करना/बनाना’ है; यहाँ तीरों को अग्निबाण बनाने की क्रिया के लिए ‘बनाता है’ सहज है।
