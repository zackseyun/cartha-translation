id: PSA.7.17
reference: Psalms 7:17
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אוֹדֶ֣ה יְהוָ֣ה כְּ/צִדְק֑/וֹ וַ֝/אֲזַמְּרָ֗ה שֵֽׁם יְהוָ֥ה עֶלְיֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/007/017.yaml
  text: I will give thanks to Yahweh according to his righteousness[a], and I will sing praise to the name of Yahweh Most High.
translation:
  language: hi
  text: मैं यहोवा का धन्यवाद उसकी धार्मिकता[a] के अनुसार करूँगा, और परमप्रधान यहोवा के नाम का भजन गाऊँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उसके न्याय के कारण’ अथवा ‘उसके न्याय के अनुसार।’ इब्रानी शब्द में ‘धार्मिकता’ और ‘न्याय’ दोनों की अर्थछायाएँ हो सकती हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹדֶה
  choice: धन्यवाद करूँगा
  rationale: भजन-साहित्य में यדה का हिफ़ील रूप प्रायः आराधनापूर्ण धन्यवाद या स्तुति व्यक्त करता है। यहाँ प्रत्यक्ष संबोधन के साथ ‘धन्यवाद करना’ स्वाभाविक है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में परमेश्वर के व्यक्तिगत नाम के प्रचलित लिप्यंतरण ‘यहोवा’ से इब्रानी चतुरक्षरीय नाम को उपाधि से बदले बिना सुरक्षित रखा गया है।
- source_word: כְּצִדְקוֹ
  choice: उसकी धार्मिकता के अनुसार
  rationale: כְּ का मूल अनुरूपतासूचक भाव ‘के अनुसार’ से बना रहता है। צֶדֶק में धार्मिकता और न्याय दोनों अर्थछायाएँ हैं; मुख्य पाठ में व्यापक नैतिक अर्थ ‘धार्मिकता’ रखा गया है।
- source_word: וַאֲזַמְּרָה
  choice: भजन गाऊँगा
  rationale: זמר संगीतमय स्तुति-गान को दर्शाता है; ‘भजन गाना’ आधुनिक हिन्दी में संक्षिप्त और आराधनात्मक है।
- source_word: שֵׁם
  choice: नाम
  rationale: शाब्दिक और धर्मवैचारिक रूप से महत्त्वपूर्ण ‘नाम’ परमेश्वर की प्रकट पहचान और कीर्ति दोनों की ओर संकेत बनाए रखता है।
- source_word: עֶלְיוֹן
  choice: परमप्रधान
  rationale: यह प्रचलित, गरिमापूर्ण हिन्दी दैवी उपाधि है और इब्रानी में न होने वाला अतिरिक्त शब्द ‘परमेश्वर’ नहीं जोड़ती।
theological_decisions:
- issue: יְהוָה दैवी नाम का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मुख्य पाठ में हिन्दी बाइबल परंपरा में व्यापक रूप से पहचाना जाने वाला व्यक्तिगत नाम ‘यहोवा’ रखा गया है; इसे ‘प्रभु’ जैसी उपाधि से नहीं बदला गया।
- issue: צדק का अर्थक्षेत्र
  choice: धार्मिकता
  alternative: न्याय
  rationale: इस स्तुतिपरक संदर्भ में यह शब्द परमेश्वर के सही चरित्र और कार्यों को व्यापक रूप से व्यक्त करता है; न्याय की वास्तविक अर्थछाया पादटिप्पणी में सुरक्षित है।
- issue: כְּ की भूमिका
  choice: के अनुसार
  alternative: के कारण
  rationale: ‘के अनुसार’ इब्रानी संबंध को अधिक औपचारिक रूप से बनाए रखता है, जबकि कारणसूचक समझ भी संदर्भ में संभव है और पादटिप्पणी में दी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, आराधनात्मक शैली रखी गई है। वाक्य सरल है, समानांतर काव्यात्मक संरचना सुरक्षित है, और ‘परमप्रधान यहोवा’ को ‘नाम’ के साथ स्वाभाविक हिन्दी क्रम में रखा गया है।
