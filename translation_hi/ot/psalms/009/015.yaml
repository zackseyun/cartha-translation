  text: טָבְע֣וּ ג֭וֹיִם בְּ/שַׁ֣חַת עָשׂ֑וּ בְּ/רֶֽשֶׁת ז֥וּ טָ֝מָ֗נוּ נִלְכְּדָ֥ה רַגְלָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/015.yaml
  text: The nations have sunk into the pit they made; in the net they hid[a], their own foot has been caught.
translation:
  language: hi
  text: 'जातियाँ अपने बनाए हुए गड्ढे में धँस गई हैं;

    जिस जाल को उन्होंने छिपाया था,

    उसी में उनका अपना पाँव फँस गया है।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: טָבְעוּ
  choice: धँस गई हैं
  rationale: काल पूर्ण हो चुकी घटना को वर्तमान परिणाम सहित दिखाता है; ‘धँस गई हैं’ डूबने या गर्त में समा जाने का बिंब स्वाभाविक हिंदी में बनाए रखता है।
- source_word: גּוֹיִם
  choice: जातियाँ
  rationale: यहाँ शब्द विभिन्न शत्रु राष्ट्रों या जनसमूहों को सामूहिक रूप से दर्शाता है; भजन-साहित्य में ‘जातियाँ’ इसका स्थापित और संक्षिप्त हिंदी रूप है।
- source_word: בְּשַׁחַת עָשׂוּ
  choice: अपने बनाए हुए गड्ढे में
  rationale: שׁחת फँसाने के लिए खोदा गया गड्ढा भी हो सकता है। ‘अपने’ मूल में निहित व्यंग्य—वे अपनी ही बनाई वस्तु से नष्ट हुए—को स्पष्ट करता है।
- source_word: בְּרֶשֶׁת
  choice: जाल ... उसी में
  rationale: רשת का ठोस अर्थ ‘जाल’ है। अंतिम क्रिया के साथ ‘उसी में’ जोड़ने से समानांतरता और आत्म-विनाश का व्यंग्य हिंदी में स्पष्ट रहता है।
- source_word: זוּ טָמָנוּ
  choice: जिस ... को उन्होंने छिपाकर बिछाया था
  rationale: זוּ संबंधवाचक अव्यय है और טמן छिपाने को व्यक्त करता है। जाल के प्रसंग में केवल ‘छिपाया’ की अपेक्षा ‘छिपाकर बिछाया’ स्वाभाविक हिंदी है और गुप्त फंदा लगाने का भाव देता है।
- source_word: נִלְכְּדָה
  choice: फँस गया है
  rationale: निफ़अल पूर्ण निष्क्रिय अर्थ रखता है; हिंदी में ‘पाँव फँस गया है’ स्वाभाविक रूप से पकड़े जाने की अवस्था और उसके वर्तमान परिणाम को व्यक्त करता है।
- source_word: רַגְלָם
  choice: उनका अपना पाँव
  rationale: मूल में ‘पाँव’ एकवचन है, जो बहुवचन जातियों के लिए सामूहिक एकवचन है। ‘अपना’ उसी जाल में स्वयं फँसने के व्यंग्य को उभारता है, बिना संख्या बदले।
