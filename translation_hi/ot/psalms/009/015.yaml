translation_notes:
  register: भाषा आधुनिक, काव्यात्मक और सहज रखी गई है। दो समानांतर चित्र—स्वयं बनाया गड्ढा और स्वयं छिपाकर बिछाया जाल—पंक्ति-विन्यास से उभारे गए हैं। मूल का सामूहिक एकवचन ‘पाँव’ सुरक्षित रखा गया है; हिंदी में यह स्वाभाविक होने के कारण पादटिप्पणी आवश्यक नहीं मानी गई।
