base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/016.yaml
  text: Yahweh has made himself known[a]; he has executed judgment. The wicked is snared by the work of his own hands. Higgaion[b]. Selah
translation:
  language: hi
  text: याहवे ने अपने आपको प्रकट किया है[a]; उसने न्याय किया है। दुष्ट अपने ही हाथों के काम से फँस गया है। हिग्गायोन[b]। सेला।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “याहवे जाना जाता है; उसने न्याय किया है।” इब्रानी शब्द נודע का अर्थ स्थिति-सूचक कर्मवाच्य (“जाना जाता है”) या परिणामसूचक भाव (“अपने आपको प्रकट किया है”) हो सकता है।
    reason: alternative_reading
  - marker: b
    text: “हिग्गायोन” सम्भवतः संगीत या उपासना-संबंधी शब्द है; इसके अन्य सम्भव अर्थ “मनन” या “गूँजता हुआ संगीत” हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: נודע
  choice: ने अपने आपको प्रकट किया है
  rationale: 'निफ़अल रूप यहाँ परिणामसूचक आत्मवाचक/कर्मवाच्य भाव रख सकता है: याहवे अपने न्याय के कार्य से पहचाना गया या प्रकट हुआ। मुख्य पाठ में स्वाभाविक हिन्दी के लिए आत्मप्रकाशन का भाव रखा गया है, और वैकल्पिक कर्मवाच्य अर्थ पादटिप्पणी में दिया गया है।'
- source_word: יְהוָה
  choice: याहवे
  rationale: चार-अक्षरीय ईश्वरीय नाम का हिन्दी लिप्यंतरण किया गया है, ताकि मूल में प्रयुक्त व्यक्तिगत नाम बना रहे और उसके स्थान पर कोई उपाधि न रखी जाए।
- source_word: מִשְׁפָּט עָשָׂה
  choice: उसने न्याय किया है
  rationale: यह पदबंध न्यायिक निर्णय को कार्यान्वित करने का भाव देता है। सरल और गरिमापूर्ण हिन्दी में ‘न्याय किया है’ इस न्यायिक क्रिया को व्यक्त करता है।
- source_word: בפעל כפיו
  choice: अपने ही हाथों के काम में
  rationale: वाक्यांश दुष्ट के अपने कर्मों को उसी के फँसने का साधन या परिस्थिति बताता है। ‘ही’ निजता और प्रतिफलात्मक विडंबना स्पष्ट करता है, पर अर्थ का विस्तार नहीं करता।
- source_word: נוקש
  choice: फँस गया है
  rationale: क्रिया जाल में पकड़े जाने का रूपक रखती है। हिन्दी का पूर्ण परिणामसूचक रूप उस वर्तमान दशा को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: רשע
  choice: दुष्ट
  rationale: एकवचन विशेषण यहाँ संज्ञा के रूप में प्रतिनिधिक दुष्ट व्यक्ति के लिए प्रयुक्त है; हिन्दी में ‘दुष्ट’ संक्षिप्त और स्वाभाविक है।
- source_word: הגיון
  choice: हिग्गायोन
  rationale: यह अनिश्चित अर्थ वाला सम्भवतः संगीत या उपासना-संबंधी संकेत है। किसी एक विवादित अर्थ को मुख्य पाठ में थोपने के बजाय इसका लिप्यंतरण किया गया है।
- source_word: סלה
  choice: सेला
  rationale: इस उपासना या संगीत-संबंधी संकेत का सटीक अर्थ अनिश्चित है; इसलिए प्रचलित रीति के अनुसार इसका लिप्यंतरण रखा गया है।
theological_decisions:
- issue: न्याय के द्वारा ईश्वरीय आत्मप्रकाशन
  choice: पद में याहवे के प्रकट होने को उसके न्याय करने से निकटता से जोड़ा गया है।
  alternative: 'इसे सामान्य कथन के रूप में पढ़ा जा सकता है: ‘याहवे जाना जाता है; उसने न्याय किया है।’'
  rationale: इब्रानी נודע कर्मवाच्य स्थिति (‘जाना जाता है’) अथवा परिणामसूचक आत्मप्रकाशन (‘अपने आपको प्रकट किया है’) दोनों की अनुमति देता है। मुख्य पाठ प्रसंगगत आत्मप्रकाशन को अपनाता है, जबकि पादटिप्पणी वास्तविक व्याकरणिक अस्पष्टता को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और काव्यात्मक गद्य रखा गया है। कठिन उपासना-संबंधी शब्दों का लिप्यंतरण किया गया है और उनकी अनिश्चितता पादटिप्पणियों में सुरक्षित है।
