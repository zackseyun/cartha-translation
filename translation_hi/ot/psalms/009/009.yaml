  text: וִ֘/יהִ֤י יְהוָ֣ה מִשְׂגָּ֣ב לַ/דָּ֑ךְ מִ֝שְׂגָּ֗ב לְ/עִתּ֥וֹת בַּצָּרָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/009.yaml
  text: And Yahweh will be a stronghold for the oppressed[b][a], a stronghold in times of trouble.
translation:
  language: hi
  text: 'और याहवे उत्पीड़ित के लिए एक दुर्ग[a][b] होगा,

    संकट के समय एक दुर्ग।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘शरणस्थान’ अथवा ‘ऊँचा सुरक्षित आश्रय’; इब्रानी शब्द ऐसे ऊँचे और सुरक्षित स्थान को दर्शाता है जहाँ संरक्षण मिलता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘कुचले हुए व्यक्ति’ अथवा ‘दबे-कुचले व्यक्ति’।
    reason: lexical_alternative
lexical_decisions:
- source_word: וִיהִי
  choice: और ... होगा
  rationale: संदर्भ में यह रूप कथनात्मक भाव से भविष्य की निश्चितता व्यक्त करता है। आरंभिक ו को ‘और’ से रखा गया है; इसे कामनासूचक ‘हो’ बनाना संभव है, पर इस प्रसंग में घोषणात्मक अर्थ अधिक उपयुक्त है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: מִשְׂגָּב
  choice: दृढ़ शरणस्थान
  rationale: यह शब्द ऊँचे, सुरक्षित और अभेद्य आश्रय का बोध कराता है। ‘दृढ़ शरणस्थान’ सुरक्षा और मजबूती दोनों को सहज हिन्दी में व्यक्त करता है; काव्यात्मक बल के लिए इसकी पुनरावृत्ति रखी गई है।
- source_word: לַדָּךְ
  choice: उत्पीड़ित जन के लिए
  rationale: דך कुचले, दबाए या उत्पीड़ित व्यक्ति को दर्शाता है। ‘उत्पीड़ित जन’ आधुनिक हिन्दी में सामाजिक और व्यक्तिगत दमन, दोनों की छाया रखता है।
- source_word: לְעִתּוֹת
  choice: समयों में
  rationale: बहुवचन रूप को बनाए रखते हुए आवर्ती संकट-कालों का अर्थ व्यक्त किया गया है।
- source_word: בַּצָּרָה
  choice: संकट
  rationale: צרה विपत्ति, तंगी या व्यथा की दशा को दर्शाता है; ‘संकट’ स्पष्ट, व्यापक और इस काव्यात्मक प्रसंग में स्वाभाविक है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम है। ‘याहवे’ उसका सीधा लिप्यंतरण है और उसे उपाधि में परिवर्तित नहीं करता।
- issue: וִיהִי का कथनात्मक या कामनासूचक भाव
  choice: और ... होगा
  alternative: और ... हो / ... हो जाए
  rationale: रूप को कामना के रूप में समझना व्याकरणतः संभव है, किंतु निकटवर्ती संदर्भ याहवे के न्याय और संरक्षण के बारे में घोषणात्मक कथनों की शृंखला है; इसलिए भविष्यसूचक कथन चुना गया है, बिना इसे वर्तमानकालीन सामान्य कथन में बदलने के।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। इब्रानी पंक्ति की समानांतर रचना और ‘दृढ़ शरणस्थान’ की पुनरावृत्ति सुरक्षित रखी गई है। ‘उत्पीड़ित जन’ एकवचन सामूहिक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
