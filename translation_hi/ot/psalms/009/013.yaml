id: PSA.9.13
reference: Psalms 9:13
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: חָֽנְנֵ֬/נִי יְהוָ֗ה רְאֵ֣ה עָ֭נְיִ/י מִ/שֹּׂנְאָ֑/י מְ֝רוֹמְמִ֗/י מִ/שַּׁ֥עֲרֵי מָֽוֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/013.yaml
  text: Be gracious to me[a], O Yahweh; see my affliction from those who hate me[b], you who lift me up from the gates of death.
translation:
  language: hi
  text: हे याहवे, मुझ पर अनुग्रह कर[a]; मुझसे घृणा करनेवालों के कारण हुई मेरी दुर्दशा को देख—तू, जो मुझे मृत्यु के फाटकों[b] से ऊपर उठाता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मुझ पर दया कर।”
    reason: lexical_alternative
  - marker: b
    text: “मृत्यु के फाटक” मृत्यु के कगार पर होने या मृत्यु की शक्ति में पड़े होने की इब्रानी काव्यात्मक छवि है।
    reason: cultural_note
lexical_decisions:
- source_word: חָנְנֵנִי
  choice: मुझ पर अनुग्रह कर
  rationale: חנן के आदेशात्मक रूप में कृपापूर्ण अनुकम्पा की याचना है। ‘अनुग्रह कर’ इस भाव को संक्षेप में रखता है; ‘दया कर’ भी संभव है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत नाम יהוה है; इसलिए किसी उपाधि से बदलने के बजाय उसका देवनागरी लिप्यंतरण किया गया है।
- source_word: רְאֵה
  choice: देख
  rationale: ראה के आदेशात्मक रूप का सीधा और स्वाभाविक अनुवाद, जो परमेश्वर से ध्यान देने की प्रार्थना व्यक्त करता है।
- source_word: עָנְיִי
  choice: मेरी दुर्दशा
  rationale: עֳנִי दुःख, दीन दशा या उत्पीड़न से उपजी दुर्दशा को दर्शाता है; ‘दुर्दशा’ इसके व्यापक आशय को बनाए रखता है।
- source_word: מִשֹּׂנְאַי
  choice: मुझसे घृणा करनेवालों के कारण हुई
  rationale: यहाँ מִן को दुर्दशा के स्रोत अथवा कारण के रूप में समझा गया है। हिंदी में संबंध स्पष्ट करने के लिए ‘के कारण हुई’ कहा गया है, बिना किसी अतिरिक्त कर्ता या क्रिया को जोड़ने के।
- source_word: מְרוֹמְמִי
  choice: तू, जो मुझे ... से ऊपर उठाता है
  rationale: रום का सहभागी रूप वक्ता को उठानेवाले के रूप में याहवे को संबोधित करता है। यह अनुवाद उसके संबोधनात्मक और निरंतर चरित्र दोनों को बनाए रखता है।
- source_word: מִשַּׁעֲרֵי מָוֶת
  choice: मृत्यु के फाटकों से
  rationale: यह मूल की सजीव रूपकात्मक छवि का सीधा अनुवाद है। मूल में ‘अधोलोक’ नहीं है, इसलिए उसे पाठ में नहीं जोड़ा गया।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा या ‘प्रभु’
  rationale: मूल में व्यक्तिगत वाचा-नाम है। ‘याहवे’ उसे उपाधि में बदले बिना प्रस्तुत करता है।
- issue: מִשֹּׂנְאַי का वाक्यगत संबंध
  choice: इसे ‘मेरी दुर्दशा’ के कारण/स्रोत से जोड़ा गया है
  alternative: 'इसे स्वतंत्र, ढीले संबोधन की तरह पढ़ना: ‘मेरी दुर्दशा को देख; मुझसे घृणा करनेवालों को देख’'
  rationale: हिब्रू शब्दक्रम में सबसे स्वाभाविक अर्थ यह है कि दुर्दशा घृणा करनेवालों की ओर से आई है; वैकल्पिक पठन के लिए मूल में निहित न होनेवाली दूसरी आज्ञा माननी पड़ेगी।
- issue: ‘मृत्यु के फाटक’ की छवि
  choice: रूपक को मुख्य पाठ में ज्यों का त्यों रखा गया है
  alternative: ‘मृत्यु के कगार से’
  rationale: सीधी छवि काव्यात्मक शक्ति और प्राचीन निकट-पूर्वी अवधारणा को बनाए रखती है; अर्थ फुटनोट में स्पष्ट किया गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी में, प्रार्थनात्मक और काव्यात्मक गरिमा के साथ रखी गई है। ‘घृणा करनेवाले’ मूल के भाव को सीधे व्यक्त करता है, और ‘फाटक’ प्राचीन नगर-द्वार की रूपकात्मक छवि को ‘दरवाज़े’ की अपेक्षा अधिक उपयुक्त ढंग से बनाए रखता है।
