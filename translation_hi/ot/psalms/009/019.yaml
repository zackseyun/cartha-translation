source:
  edition: WLC
  text: קוּמָ֣/ה יְ֭הוָה אַל יָעֹ֣ז אֱנ֑וֹשׁ יִשָּׁפְט֥וּ ג֝וֹיִ֗ם עַל פָּנֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/019.yaml
  text: Rise up[a], O Yahweh; do not let man prevail; let the nations be judged before you.
translation:
  language: hi
  text: उठ खड़ा हो, हे याहवे! मनुष्य[a] प्रबल न होने पाए; राष्ट्रों का न्याय तेरे सामने हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “नश्वर मनुष्य”; इब्रानी शब्द אֱנוֹשׁ प्रायः मनुष्य की दुर्बलता या नश्वरता पर बल देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: קוּמָה
  choice: उठ खड़ा हो
  rationale: परमेश्वर से हस्तक्षेप करने की काव्यात्मक विनती व्यक्त करने वाला आज्ञार्थक रूप; यह आधुनिक हिन्दी में स्वाभाविक है और केवल शारीरिक मुद्रा बदलने तक सीमित नहीं लगता।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम का प्रचलित हिन्दी लिप्यंतरण, किसी उपाधि से उसका प्रतिस्थापन नहीं।
- source_word: אַל יָעֹז
  choice: प्रबल न होने पाए
  rationale: निषेधात्मक विनती के बल को बनाए रखता है और यहाँ क्रिया के ‘शक्तिशाली होना/विजयी होना’ अर्थ को सन्दर्भानुकूल व्यक्त करता है।
- source_word: אֱנוֹשׁ
  choice: मनुष्य
  rationale: एकवचन प्रतिनिधिक अर्थ को बनाए रखता है; शब्द में नश्वरता और मानवीय दुर्बलता की सम्भावित छाया को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: יִשָּׁפְטוּ
  choice: न्याय ... हो
  rationale: निफ़अल रूप के निष्क्रिय न्यायिक अर्थ को संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: גּוֹיִם
  choice: राष्ट्रों
  rationale: अनेक जनसमुदायों या nations का आधुनिक हिन्दी समतुल्य; ‘जातियों’ से उत्पन्न होने वाली जाति-व्यवस्था की सम्भावित गलतफहमी से बचाता है।
- source_word: עַל־פָּנֶיךָ
  choice: तेरे सामने
  rationale: शाब्दिक ‘तेरे मुख के सामने’ का स्वाभाविक हिन्दी रूप, जो परमेश्वर की उपस्थिति में न्याय का भाव बनाए रखता है।
theological_decisions:
- issue: אֱנוֹשׁ में मानव की नश्वरता का भाव
  choice: मुख्य पाठ में ‘मनुष्य’
  alternative: ‘नश्वर मनुष्य’
  rationale: मुख्य पाठ प्रतिनिधिक एकवचन और काव्यात्मक संक्षिप्तता बनाए रखता है, जबकि पादटिप्पणी उस शब्द में निहित मानवीय दुर्बलता या नश्वरता की सम्भावित अर्थच्छाया बताती है।
- issue: יִשָּׁפְטוּ का न्यायिक अथवा शासकीय अर्थ
  choice: ‘न्याय ... हो’
  alternative: ‘शासन किया जाए’
  rationale: विरोधी राष्ट्रों के विरुद्ध विनती के सन्दर्भ में न्यायिक निष्क्रिय अर्थ अधिक सम्भाव्य है, पर क्रिया के व्यापक शासकीय क्षेत्र को सिद्धान्तगत विस्तार देकर पाठ में नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक, काव्यात्मक और प्रार्थनात्मक रखी गई है। ‘हे’ सम्बोधन की गरिमा बनाए रखता है; ‘तेरे’ भजन की सीधी एकवचन ईश्वरीय सम्बोधन-शैली के अनुरूप है।
