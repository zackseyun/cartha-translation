id: PSA.9.6
reference: Psalms 9:6
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: הָֽ/אוֹיֵ֨ב תַּ֥מּוּ חֳרָב֗וֹת לָ֫/נֶ֥צַח וְ/עָרִ֥ים נָתַ֑שְׁתָּ אָבַ֖ד זִכְרָ֣/ם הֵֽמָּה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/006.yaml
  text: The enemy has come to an end in everlasting ruins[a]; you have uprooted cities; the very memory of them has perished.
translation:
  language: hi
  text: 'शत्रु का अंत हो गया; वह खंडहरों में सदा के लिए समाप्त हो गया।[a]


    तूने नगरों को जड़ से उखाड़ दिया;


    उनकी याद तक मिट गई।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हे शत्रु, विनाश सदा के लिए समाप्त हो गए हैं।” इब्रानी आरंभ को ‘शत्रु’ के विषय में कथन के बजाय उसे सीधे संबोधन के रूप में भी समझा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: הָאוֹיֵב
  choice: शत्रु
  rationale: संज्ञा के साथ लगा निश्चित उपपद इसे स्वाभाविक रूप से कथन के कर्ता, ‘शत्रु’, के रूप में प्रस्तुत करता है; संबोधन की संभावना पादटिप्पणी में रखी गई है।
- source_word: תַּמּוּ
  choice: अंत हो गया
  rationale: תמם की पूर्णता और समाप्ति की धारणा को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: חֳרָבוֹת
  choice: खंडहर
  rationale: यह शब्द उजाड़ या ध्वस्त स्थानों को दर्शाता है; इस वाक्य-विन्यास में ‘खंडहर हो गया’ शत्रु के पूर्ण विनाश का स्वाभाविक हिन्दी रूप है।
- source_word: לָנֶצַח
  choice: सदा के लिए
  rationale: विनाश की स्थायी और निर्णायक प्रकृति को स्पष्ट, सामान्य हिन्दी में व्यक्त करता है।
- source_word: וְעָרִים
  choice: नगरों
  rationale: עִיר का सामान्य अर्थ ‘नगर’ है और काव्यात्मक गरिमा के साथ आधुनिक हिन्दी में सहज है।
- source_word: נָתַשְׁתָּ
  choice: जड़ से उखाड़ दिया
  rationale: נתשׁ में उखाड़ फेंकने का सशक्त रूपक है; ‘जड़ से’ पूर्ण निष्कासन की तीव्रता बनाए रखता है।
- source_word: אָבַד
  choice: मिट गई
  rationale: यहाँ क्रिया स्मृति के लुप्त या नष्ट हो जाने को बताती है; ‘मिट गई’ हिन्दी में स्मृति के साथ स्वाभाविक और गंभीर है।
- source_word: זִכְרָם
  choice: उनकी याद
  rationale: प्रत्यय उन नगरों अथवा शत्रुओं से संबंधित स्मृति की ओर संकेत करता है; मूल की संदर्भगत गुंजाइश को ‘उनकी’ बनाए रखता है।
- source_word: הֵמָּה
  choice: तक
  rationale: वाक्यांत का स्वतंत्र सर्वनाम बलाघात देता है; हिन्दी में ‘याद तक’ उसी emphatic अर्थ को स्वाभाविक रूप से प्रकट करता है।
theological_decisions:
- issue: आरंभिक उपवाक्य का वाक्य-विन्यास
  choice: इसे शत्रु के अंतिम विनाश के विषय में कथन माना गया है।
  alternative: ‘हे शत्रु, विनाश सदा के लिए समाप्त हो गए हैं।’
  rationale: निश्चित उपपद सहित הָאוֹיֵב को कर्ता मानना और आगे के न्याय-वर्णन से जोड़ना स्वाभाविक है; फिर भी इब्रानी को संबोधन के रूप में समझने की वास्तविक संभावना पादटिप्पणी में सुरक्षित रखी गई है।
- issue: חֳרָבוֹת לָנֶצַח का संबंध
  choice: इसे शत्रु की स्थायी खंडहरावस्था के रूप में व्यक्त किया गया है।
  alternative: ‘विनाश सदा के लिए समाप्त हो गए हैं।’
  rationale: इब्रानी का संक्षिप्त काव्यात्मक वाक्य-विन्यास दोनों समझों की गुंजाइश देता है। मुख्य पाठ संदर्भानुकूल परिणाम बताता है, जबकि वैकल्पिक संरचना पादटिप्पणी में दी गई है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, काव्यात्मक पर सरल और गरिमापूर्ण रखी गई है। ईश्वर के लिए एकवचन निकट संबोधन ‘तूने’ भजन-साहित्य की प्रत्यक्षता बनाए रखता है। पंक्ति-विभाजन इब्रानी समानांतरता को स्पष्ट करता है।
