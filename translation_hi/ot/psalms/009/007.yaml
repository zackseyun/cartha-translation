  text: וַֽ֭/יהוָה לְ/עוֹלָ֣ם יֵשֵׁ֑ב כּוֹנֵ֖ן לַ/מִּשְׁפָּ֣ט כִּסְאֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/007.yaml
  text: But Yahweh sits enthroned forever[b][a]; he has established his throne for judgment.
translation:
  language: hi
  text: परन्तु यहोवा सदा के लिए सिंहासन पर विराजमान है[a]; उसने न्याय के लिए अपना सिंहासन स्थापित किया है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से ‘बैठता है’ या ‘बैठा रहता है’; यहाँ सिंहासन और न्याय का संदर्भ राजकीय भाव प्रकट करता है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘उसने न्याय के लिए अपना सिंहासन तैयार किया है।’
    reason: alternative_reading
lexical_decisions:
- source_word: וַיהוָה
  choice: परन्तु यहोवा
  rationale: वाव को पिछले संदर्भ में दुष्टों के विनाश और यहोवा के स्थायी शासन के बीच विरोध दिखाने के लिए ‘परन्तु’ किया गया है; परमेश्वर का व्यक्तिगत वाचा-नाम ‘यहोवा’ रखा गया है।
- source_word: לְעוֹלָם
  choice: सदा के लिए
  rationale: यह अभिव्यक्ति अनन्त काल तक बने रहने का भाव देती है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: יֵשֵׁב
  choice: सिंहासन पर विराजमान है
  rationale: मूल क्रिया का शाब्दिक अर्थ ‘बैठता/बैठा है’ है, पर इसी पद के सिंहासन और न्याय-संदर्भ में यह राजकीय शासन को व्यक्त करती है।
- source_word: כּוֹנֵן
  choice: दृढ़ किया है
  rationale: पोलल रूप स्थापित करने, तैयार करने या दृढ़ करने का अर्थ दे सकता है; ‘दृढ़ किया है’ सिंहासन की स्थिरता और पूर्ण किए गए कार्य, दोनों को बनाए रखता है।
- source_word: לַמִּשְׁפָּט
  choice: न्याय करने के लिए
  rationale: מִשְׁפָּט न्यायिक निर्णय और न्याय, दोनों को सूचित कर सकता है; यहाँ सिंहासन के उद्देश्य के रूप में न्यायिक कार्य प्रमुख है।
- source_word: כִּסְאוֹ
  choice: अपना सिंहासन
  rationale: हिन्दी में कर्ता यहोवा की ओर लौटता निजवाचक ‘अपना’ स्वाभाविक रूप से इब्रानी के तृतीय पुरुष स्वामित्व को व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ के व्यक्तिगत वाचा-नाम को उपाधि से नहीं बदला गया। हिन्दी पाठकों में प्रचलित और पहचानने योग्य रूप ‘यहोवा’ चुना गया, जबकि ‘याहवे’ अधिक प्रत्यक्ष लिप्यंतरण है।
- issue: יֵשֵׁב में राजकीय भाव
  choice: सिंहासन पर विराजमान है
  alternative: बैठा रहता है
  rationale: इसी पंक्ति में ‘सिंहासन’ और ‘न्याय’ होने के कारण राजकीय-न्यायिक आशय स्पष्ट है; फिर भी पादटिप्पणी में क्रिया का अधिक शाब्दिक रूप दिया गया है।
- issue: מִשְׁפָּט का अर्थ-क्षेत्र
  choice: न्याय करने के लिए
  alternative: न्याय के लिए
  rationale: चुना हुआ रूप परमेश्वर की न्यायिक क्रिया पर बल देता है, जबकि विकल्प न्याय की व्यापक धारणा को व्यक्त कर सकता है; मूल की अर्थगत व्यापकता पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज मानक हिन्दी। ‘विराजमान’ राजकीय संदर्भ के अनुकूल है; वाक्य-विन्यास स्पष्ट रखा गया है और मूल की न्याय/न्यायिक निर्णय संबंधी अर्थगत व्यापकता पादटिप्पणी में सुरक्षित की गई है।
