reference: Psalms 9:17
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: יָשׁ֣וּבוּ רְשָׁעִ֣ים לִ/שְׁא֑וֹלָ/ה כָּל גּ֝וֹיִ֗ם שְׁכֵחֵ֥י אֱלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/017.yaml
  text: The wicked will return to Sheol—all the nations that forget God[a][b].
translation:
  language: hi
  text: दुष्ट अधोलोक[a] में लौट जाएँगे[b]—वे सभी जातियाँ जो परमेश्वर को भूल जाती हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधोलोक इब्रानी बाइबल में मृतकों के लोक के लिए प्रयुक्त शब्द है; इसका अर्थ बाद में विकसित नरक की अधिक विशिष्ट धारणा के ठीक समान नहीं है।
    reason: cultural_note
  - marker: b
    text: या, “वापस मुड़ जाएँगे।” इब्रानी क्रिया का अर्थ “लौटना” या “वापस मुड़ना” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשׁוּבוּ
  choice: लौट जाएँगे
  rationale: काल-संदर्भ में क़ाल अपूर्ण क्रिया भविष्यसूचक कथन व्यक्त करती है। ‘लौट जाएँगे’ मूल के ‘लौटना/वापस मुड़ना’ अर्थ को बनाए रखता है और विनाश की कोई अतिरिक्त व्याख्या नहीं जोड़ता।
- source_word: רְשָׁעִים
  choice: दुष्ट
  rationale: बहुवचन विशेषण का संज्ञात्मक प्रयोग नैतिक रूप से दुष्ट लोगों को सूचित करता है; ‘दुष्ट’ संक्षिप्त और स्वाभाविक हिन्दी है।
- source_word: לִשְׁאוֹלָה
  choice: अधोलोक
  rationale: यहाँ שְׁאוֹל मृतकों के लोक को सूचित करता है। ‘अधोलोक’ आधुनिक हिन्दी पाठक के लिए अर्थपूर्ण है और इसे बाद की अधिक विशिष्ट ‘नरक’ धारणा के समान नहीं ठहराता।
- source_word: כָּל גּוֹיִם
  choice: वे सभी जातियाँ
  rationale: כָּל के समग्र अर्थ और גּוֹיִם के ‘जातियाँ/राष्ट्र’ अर्थ को व्यक्त करता है। ‘वे’ इस पदबंध को पहले खंड के ‘दुष्ट’ का समानाधिकरण बनाकर हिन्दी में संबंध स्पष्ट करता है।
- source_word: שְׁכֵחֵי אֱלֹהִים
  choice: जो परमेश्वर को भूल जाती हैं
  rationale: कर्तृवाचक कृदन्त-रचना को स्वाभाविक सम्बन्धवाचक उपवाक्य में व्यक्त किया गया है; वर्तमानकालीन रूप इसे उन जातियों की चरित्रगत प्रवृत्ति के रूप में बनाए रखता है।
theological_decisions:
- issue: न्याय के संदर्भ में שְׁאוֹל का अर्थ
  choice: ‘अधोलोक’—मृतकों का लोक
  alternative: ‘कब्र’ या ‘नरक’
  rationale: ‘कब्र’ मूल धारणा को बहुत संकीर्ण कर देती है, जबकि ‘नरक’ बाद की अधिक विशिष्ट धर्मवैज्ञानिक अवधारणा आरोपित कर सकता है। ‘अधोलोक’ मूल शब्द की व्यापकता और धर्मवैज्ञानिक तनाव को सुरक्षित रखता है।
- issue: יָשׁוּבוּ में ‘लौटने’ का भाव
  choice: लौट जाएँगे
  alternative: वापस मुड़ जाएँगे
  rationale: मूल क्रिया दोनों अर्थ दे सकती है। मुख्य पाठ में स्वाभाविक ‘लौट जाएँगे’ रखा गया है और वास्तविक शाब्दिक विकल्प को पादटिप्पणी में सुरक्षित किया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। वाक्य की काव्यात्मक समानाधिकरण-रचना को डैश द्वारा सुरक्षित किया गया है। दोनों पादटिप्पणी-चिह्न मुख्य पाठ में संबंधित शब्दों के पास उपस्थित हैं।
