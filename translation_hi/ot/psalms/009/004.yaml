review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the causal connection, the paired forensic terms, God's enthronement, and righteous judging. However, “मेरे न्याय” can naturally mean the psalmist's own act or quality of judging rather than his legal right/claim. The final participial phrase also produces an awkward, incomplete Hindi construction after “तू सिंहासन पर बैठा.”
  naturalness: The direct address “तू” is appropriate to the psalm's elevated prayer register. “तू सिंहासन पर बैठा है और धार्मिकता से न्याय करता है” is idiomatic modern Hindi and conveys the Hebrew perfect followed by a participle without a dangling participle.
  terminology: “अधिकार” appropriately conveys מִשְׁפָּטִי here as the psalmist's right/claim, while “मुकदमा” conveys דִּינִי as his case. “धार्मिकता से” retains the righteousness terminology of צֶדֶק; its adverbial function is clarified in a note.
  issues:
  - severity: medium
    issue: “मेरे न्याय” is semantically ambiguous in Hindi.
    rationale: In normal Hindi it may denote “my judging” or “my justice,” rather than the legal right or claim that God vindicates. “मेरे अधिकार” gives the intended forensic sense more clearly.
  - severity: medium
    issue: The phrase “तू सिंहासन पर बैठा, धार्मिकता से न्याय करता हुआ” is syntactically awkward.
    rationale: The trailing participial phrase lacks a natural finite verb relation in modern standard Hindi. A coordinated finite clause preserves the enthroned-judge imagery clearly.
  - severity: low
    issue: The adverbial sense of “धार्मिकता से” lacks its corresponding lexical-alternative footnote.
    rationale: A note can make explicit that the Hebrew noun is used adverbially, without overinterpreting the expression.
  revised_text: क्योंकि तूने मेरे अधिकार और मेरे मुकदमे[a] को न्याय दिलाया है; तू सिंहासन पर बैठा है और धार्मिकता से[b] न्याय करता है।
