  text: כִּֽי עָ֭שִׂיתָ מִשְׁפָּטִ֣/י וְ/דִינִ֑/י יָשַׁ֥בְתָּ לְ֝/כִסֵּ֗א שׁוֹפֵ֥ט צֶֽדֶק־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/004.yaml
  text: For you have upheld my justice and my cause[a]; you sat on the throne[b], judging righteously.
translation:
  language: hi
  text: क्योंकि तूने मेरे अधिकार और मेरे मुकदमे[a] को न्याय दिलाया है; तू सिंहासन पर बैठा है और धार्मिकता से[b] न्याय करता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘मेरे न्याय और मेरे मुकदमे’ अथवा ‘मेरे अधिकार और मेरे पक्ष।’ इब्रानी में साथ प्रयुक्त दोनों शब्द न्यायिक अधिकार और मामले का भाव रखते हैं।
    reason: lexical_alternative
  - marker: b
    text: 'या, ‘न्यायपूर्वक।’ इब्रानी में ‘धार्मिकता’ शब्द यहाँ क्रियाविशेषण के समान प्रयुक्त है: ‘धार्मिकता के साथ न्याय करता हुआ।’'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले पद में व्यक्त स्तुति का कारण बताता है और भजन की तार्किक कड़ी बनाए रखता है।
- source_word: עָשִׂיתָ
  choice: समर्थन किया है
  rationale: मूल अर्थ ‘किया’ है, पर न्यायिक संज्ञाओं के साथ यह किसी के अधिकार या मुकदमे को कायम रखने और उसके पक्ष में न्याय करने का भाव देता है।
- source_word: מִשְׁפָּטִי
  choice: मेरे न्याय
  rationale: यह शब्द न्याय, न्यायिक निर्णय या वैध अधिकार का संकेत दे सकता है; यहाँ भजनकार के न्यायोचित दावे की पुष्टि अभिप्रेत है।
- source_word: וְדִינִי
  choice: मेरे मुकदमे
  rationale: यह किसी कानूनी विवाद या पक्ष का द्योतक है; ‘मुकदमे’ न्यायालयीन चित्र को स्वाभाविक हिन्दी में स्पष्ट रखता है।
- source_word: יָשַׁבְתָּ לְכִסֵּא
  choice: तू सिंहासन पर बैठा
  rationale: यह परमेश्वर को राजकीय और न्यायिक आसन ग्रहण किए हुए दिखाता है; हिन्दी में ‘सिंहासन पर बैठा’ स्वाभाविक है।
- source_word: שׁוֹפֵט
  choice: न्याय करता हुआ
  rationale: कृदंत परमेश्वर की उस भूमिका को व्यक्त करता है जिसमें वह सिंहासन पर बैठकर न्याय कर रहा है।
- source_word: צֶדֶק
  choice: धार्मिकता से
  rationale: संज्ञा यहाँ क्रियाविशेषणवत् प्रयुक्त है और ऐसे न्याय को दर्शाती है जो पूर्णतः उचित और धर्मसंगत है।
theological_decisions:
- issue: परमेश्वर का न्यायाधीश के रूप में चित्रण
  choice: परमेश्वर सिंहासन पर विराजमान न्यायाधीश के रूप में भजनकार के न्यायोचित दावे और मुकदमे का समर्थन करता है।
  alternative: इसे सामान्य रूप से केवल भजनकार के पक्ष में परमेश्वर की सहायता के कथन के रूप में लेना।
  rationale: מִשְׁפָּט और דִּין जैसे कानूनी पदों के साथ सिंहासन और न्याय करने की भाषा स्पष्ट न्यायालयीन चित्र प्रस्तुत करती है; अनुवाद इसे किसी बाद की सांप्रदायिक व्याख्या के बिना सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण काव्यात्मक शैली रखी गई है। भजन में परमेश्वर को सीधे संबोधन के अनुरूप ‘तू’ का प्रयोग किया गया है। कानूनी शब्दावली स्पष्ट रखी गई है, जबकि צֶדֶק के संज्ञात्मक और क्रियाविशेषणीय तनाव को ‘धार्मिकता से’ द्वारा बनाए रखा गया है।
