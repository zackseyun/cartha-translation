    reason: lexical_alternative
  revision_rationale: The revision clarifies the legal sense of the first paired noun, repairs the Hindi syntax of the enthronement-and-judging clause, and adds the missing note for the adverbial use of ‘righteousness.’ It retains the source's judicial imagery and does not introduce doctrinal interpretation.
