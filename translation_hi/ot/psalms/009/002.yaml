base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/002.yaml
  text: I will rejoice and exult in you[a]; I will sing praise to your name[b], Most High.
translation:
  language: hi
  text: 'मैं तुझमें हर्षित और उल्लसित होऊँगा;[a]

    हे परमप्रधान,[b] मैं तेरे नाम का गुणगान करूँगा।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं तुझमें प्रसन्न और आनन्दित होऊँगा।”
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में “परमप्रधान” परमेश्वर के लिए प्रयुक्त एक उपाधि है।
    reason: cultural_note
lexical_decisions:
- source_word: אֶשְׂמְחָה
  choice: मैं आनन्दित होऊँगा
  rationale: שׂמח यहाँ आनन्द मनाने या प्रसन्न होने को व्यक्त करता है। प्रथम पुरुष रूप के संकल्प/भावी अर्थ को स्वाभाविक हिन्दी में रखा गया है।
- source_word: וְאֶעֶלְצָה
  choice: और मगन होऊँगा
  rationale: עלץ प्रबल, उल्लासपूर्ण आनन्द दर्शाता है। ‘मगन’ पहले क्रियापद से भेद बनाए रखते हुए काव्यात्मक और सहज हिन्दी देता है।
- source_word: בָךְ
  choice: तुझमें
  rationale: בְּ के साथ द्वितीय पुरुष प्रत्यय यहाँ आनन्द के केन्द्र या आधार को दर्शाता है; ‘तुझमें’ मूल की संक्षिप्तता और अर्थ दोनों सुरक्षित रखता है।
- source_word: אֲזַמְּרָה
  choice: मैं ... गुणगान करूँगा
  rationale: זמר का पिएल रूप प्रायः स्तुति में गाने का अर्थ देता है। ‘गुणगान करना’ आधुनिक हिन्दी में संगीतमय स्तुति को स्वाभाविक रूप से व्यक्त करता है।
- source_word: שִׁמְךָ
  choice: तेरे नाम का
  rationale: ‘नाम’ मूल शब्द को बनाए रखता है और परमेश्वर के प्रकट व्यक्तित्व तथा प्रतिष्ठा की इब्रानी अवधारणा को अनावश्यक विस्तार के बिना व्यक्त करता है।
- source_word: עֶלְיוֹן
  choice: हे परमप्रधान
  rationale: यह परमेश्वर की उपाधि है और यहाँ सीधे सम्बोधन के रूप में प्रयुक्त है। ‘परमप्रधान’ प्रतिष्ठित, संक्षिप्त और अर्थसंगत हिन्दी रूप है।
theological_decisions:
- issue: ईश्वरीय उपाधि עֶלְיוֹן का अनुवाद
  choice: हे परमप्रधान
  alternative: परमप्रधान
  rationale: इब्रानी पद यहाँ परमेश्वर को सीधे सम्बोधित करने वाली उपाधि है। हिन्दी में ‘हे’ सम्बोधन को स्पष्ट करता है, पर उपाधि में कोई व्याख्यात्मक विस्तार नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक है। परमेश्वर से सीधे सम्बोधन के कारण एकवचन आत्मीय सर्वनाम ‘तू/तेरा’ के रूप ‘तुझमें’ और ‘तेरे’ प्रयुक्त हुए हैं। समानार्थी आनन्दसूचक दोनों इब्रानी क्रियाओं का भेद ‘आनन्दित’ और ‘मगन’ से बनाए रखा गया है।
