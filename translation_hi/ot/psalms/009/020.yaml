  text: שִׁ֘יתָ֤/ה יְהוָ֨ה מוֹרָ֗ה לָ֫/הֶ֥ם יֵדְע֥וּ גוֹיִ֑ם אֱנ֖וֹשׁ הֵ֣מָּה סֶּֽלָה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/020.yaml
  text: Put fear in them, O LORD; let the nations know that they are only man. Selah
translation:
  language: hi
  text: हे यहोवा, उनमें भय उत्पन्न कर; राष्ट्र जान लें कि वे केवल मनुष्य हैं। सेला
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שִׁיתָה ... מוֹרָה לָהֶם
  choice: उनमें भय उत्पन्न कर
  rationale: שׁית का अर्थ ‘रखना/ठहराना’ और מוֹרָה का इस संदर्भ में अर्थ ‘भय/आतंक’ है। ‘उनमें भय उत्पन्न कर’ मूल भाव को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के विशिष्ट इब्रानी नाम को उपाधि से बदलने के बजाय प्रचलित हिन्दी रूप ‘यहोवा’ में रखा गया है।
- source_word: גוֹיִם
  choice: राष्ट्र
  rationale: यहाँ शब्द सामूहिक राजनीतिक-जातीय समुदायों को सूचित करता है; ‘राष्ट्र’ संक्षिप्त और गरिमापूर्ण है।
- source_word: אֱנוֹשׁ הֵמָּה
  choice: वे केवल मनुष्य हैं
  rationale: אֱנוֹשׁ मानवीय नश्वरता और दुर्बलता का संकेत दे सकता है। ‘केवल मनुष्य’ राष्ट्रों की सीमित मानवीय हैसियत पर बल देता है, बिना अर्थ को आवश्यकता से अधिक स्पष्ट किए।
- source_word: סֶּלָה
  choice: सेला
  rationale: इस अनिश्चित संगीतात्मक या पाठ-विभाजक पद को अर्थानुवाद करने के बजाय लिप्यंतरित किया गया है।
theological_decisions:
- issue: राष्ट्रों की मानवीय सीमितता
  choice: वे केवल मनुष्य हैं
  alternative: वे नश्वर मनुष्य हैं
  rationale: मूल אֱנוֹשׁ में नश्वरता की छाया संभव है, पर वाक्य का मुख्य विरोध राष्ट्रों के आत्म-महत्त्व और उनकी मानवीय सीमितता के बीच है। चुना हुआ पाठ इस तनाव को सुरक्षित रखता है।
- issue: ईश्वरीय नाम का निरूपण
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल में יהוה विशिष्ट नाम है; इसलिए हिन्दी पाठ में नामरूप बनाए रखना स्रोत के अधिक निकट है।
translation_notes:
  register: आधुनिक मानक हिन्दी; प्रार्थनात्मक काव्य के अनुरूप संक्षिप्त, गंभीर और प्रत्यक्ष शैली। परमेश्वर को संबोधित एकवचन आज्ञार्थक रूप ‘कर’ रखा गया है, जो भजन-साहित्य की निकट और गंभीर विनती के अनुकूल है।
