language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: לְמַ֥עַן אֲסַפְּרָ֗ה כָּֽל תְּהִלָּ֫תֶ֥י/ךָ בְּ/שַֽׁעֲרֵ֥י בַת צִיּ֑וֹן אָ֝גִ֗ילָה בִּ/ישׁוּעָתֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/014.yaml
  text: so that I may recount all your praises in the gates of Daughter Zion[a]; I will rejoice in your salvation.
translation:
  language: hi
  text: ताकि मैं सिय्योन की बेटी के फाटकों पर तेरी सारी स्तुति का बखान करूँ; मैं तेरे उद्धार[a] में आनन्द मनाऊँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “छुटकारा।” इब्रानी शब्द वर्तमान संकट से बचाए जाने के साथ-साथ अधिक व्यापक अर्थ में उद्धार को भी सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: ताकि
  rationale: यह उद्देश्य या परिणाम प्रकट करता है; ‘ताकि’ आधुनिक हिन्दी में स्वाभाविक रूप से इसका प्रयोजनात्मक बल बनाए रखता है।
- source_word: אֲסַפְּרָה
  choice: मैं ... बखान करूँ
  rationale: पिएल रूप सार्वजनिक रूप से गिनाकर सुनाने या वर्णन करने का भाव देता है। ‘बखान करना’ स्तुति के काव्यात्मक संदर्भ में स्वाभाविक और गरिमापूर्ण है।
- source_word: כָּל תְּהִלָּתֶיךָ
  choice: तेरी सारी स्तुति
  rationale: यह परमेश्वर की प्रशंसा तथा उसके स्तुतियोग्य कामों को समेटने वाली काव्यात्मक अभिव्यक्ति है। हिन्दी में ‘तेरी सारी स्तुति’ मूल की व्यापकता को बिना अनावश्यक व्याख्या के बनाए रखती है।
- source_word: בְּשַׁעֲרֵי
  choice: फाटकों पर
  rationale: בְ यहाँ स्थान को सूचित करता है। नगर के फाटक सार्वजनिक सभा-स्थल थे; हिन्दी में ‘फाटकों पर’ इस दृश्य को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: בַת צִיּוֹן
  choice: सिय्योन की बेटी
  rationale: यह सिय्योन या यरूशलेम का मानवीकरण करने वाली काव्यात्मक उपाधि है। शाब्दिक रूप बनाए रखने से मूल बिंब सुरक्षित रहता है।
- source_word: אָגִילָה
  choice: मैं ... आनन्द मनाऊँगा
  rationale: क्रिया उल्लासपूर्ण आनन्द व्यक्त करती है। यह चयन स्पष्ट, स्वाभाविक और काव्य के अनुरूप है।
- source_word: בִּישׁוּעָתֶךָ
  choice: तेरे उद्धार में
  rationale: יְשׁוּעָה वर्तमान संकट से छुटकारे और व्यापक उद्धार—दोनों को सूचित कर सकता है। ‘उद्धार’ इसकी व्यापक अर्थ-परिधि बनाए रखता है, जबकि निकटवर्ती अर्थ पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: יְשׁוּעָה का अनुवाद
  choice: उद्धार
  alternative: छुटकारा
  rationale: संदर्भ में शत्रुओं से बचाए जाने का ठोस भाव है, पर इब्रानी शब्द का अर्थ इससे अधिक व्यापक भी हो सकता है। मुख्य पाठ में ‘उद्धार’ और पादटिप्पणी में ‘छुटकारा’ रखने से दोनों अर्थ सुरक्षित रहते हैं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक रखी गई है। ‘सिय्योन की बेटी’ मूल मानवीकरण को सुरक्षित रखता है; ‘बखान’ सार्वजनिक स्तुति के भाव को सहज हिन्दी में व्यक्त करता है।
