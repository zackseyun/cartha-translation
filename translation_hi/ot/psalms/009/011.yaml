source:
  edition: WLC
  text: זַמְּר֗וּ לַ֭/יהוָה יֹשֵׁ֣ב צִיּ֑וֹן הַגִּ֥ידוּ בָ֝/עַמִּ֗ים עֲלִֽילוֹתָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/011.yaml
  text: Sing praises to Yahweh[a], who dwells in Zion; declare his deeds among the peoples.
translation:
  language: hi
  text: सिय्योन में वास करने वाले यहवे का गुणगान करो; जातियों के बीच उसके कार्यों की घोषणा करो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זַמְּרוּ
  choice: गुणगान करो
  rationale: बहुवचन आज्ञार्थक क्रिया संगीत के साथ स्तुति करने का भाव रखती है; ‘गुणगान करो’ आधुनिक हिन्दी में स्वाभाविक और उपासना-संदर्भ के अनुकूल है।
- source_word: לַיהוָה
  choice: यहवे का
  rationale: मूल पाठ में आए परमेश्वर के विशिष्ट वाचा-नाम יהוה को हिन्दी में ‘यहवे’ के रूप में लिप्यंतरित किया गया है।
- source_word: יֹשֵׁב צִיּוֹן
  choice: सिय्योन में वास करने वाले
  rationale: יֹשֵׁב में बैठने अथवा वास करने, दोनों की अर्थ-संभावना है। मुख्य पाठ में ‘वास करने वाले’ परमेश्वर की सिय्योन में उपस्थिति को स्वाभाविक हिन्दी में व्यक्त करता है; राजासन पर विराजमान होने का संभव भाव पाद-टिप्पणी में रखा गया है।
- source_word: הַגִּידוּ
  choice: घोषणा करो
  rationale: हिफ़ील बहुवचन आज्ञार्थक सार्वजनिक रूप से बताने या प्रकट करने का भाव देता है; ‘घोषणा करो’ काव्यात्मक गरिमा बनाए रखता है।
- source_word: בָעַמִּים
  choice: देश-देश के लोगों के बीच
  rationale: ב का अर्थ यहाँ ‘के बीच’ है और עַמִּים अनेक जनसमुदायों को दर्शाता है। ‘देश-देश के लोग’ हिन्दी में इस बहुवचन सामुदायिक अर्थ को स्पष्ट और सहज बनाता है।
- source_word: עֲלִילוֹתָיו
  choice: उसके कामों
  rationale: संज्ञा परमेश्वर के किए हुए कार्यों को बताती है। ‘कामों’ संक्षिप्त और सहज है तथा मूल में प्रत्यक्ष रूप से न आए ‘सामर्थी’ जैसे विशेषण को नहीं जोड़ता।
theological_decisions:
- issue: परमेश्वर के नाम יהוה का अनुवाद
  choice: यहवे
  alternative: यहोवा / प्रभु
  rationale: मूल इब्रानी पाठ वाचा-नाम का सीधे प्रयोग करता है। ‘यहवे’ उस विशिष्ट नाम को सामान्य उपाधि में बदले बिना प्रस्तुत करता है।
- issue: יֹשֵׁב צִיּוֹן का अर्थ
  choice: सिय्योन में वास करने वाले
  alternative: सिय्योन में सिंहासन पर विराजमान
  rationale: इब्रानी कृदंत निवास और राजकीय रूप से विराजमान होने, दोनों भाव ग्रहण कर सकता है। मुख्य पाठ निवास का सीधा अर्थ रखता है और वैकल्पिक राजकीय अर्थ को पाद-टिप्पणी में सुरक्षित करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामूहिक उपासना के योग्य रखी गई है। दोनों क्रियाएँ बहुवचन आज्ञार्थक हैं। इब्रानी समानांतरता और दोहरे आह्वान को अर्धविराम द्वारा स्पष्ट किया गया है।
