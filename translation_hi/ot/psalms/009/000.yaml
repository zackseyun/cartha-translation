  language: hi
  text: संगीत-निर्देशक के लिए। “पुत्र की मृत्यु” की धुन पर।[a] दाऊद का भजन।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी अभिव्यक्ति עַלְמוּת לַבֵּן का अर्थ अनिश्चित है। संभवतः यह कोई संगीत-निर्देश या धुन का नाम है; परंपरागत रूप से इसे बिना अनुवाद किए “अलमूत लब्बेन” भी लिखा गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: संगीत-निर्देशक के लिए
  rationale: भजनों के शीर्षकों में यह पद सामान्यतः संगीत-प्रस्तुति का नेतृत्व करने वाले व्यक्ति के लिए निर्देश है। यह अनुवाद उसके उपासना-संगीत संबंधी कार्य को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: עַלְמוּת לַבֵּן
  choice: “पुत्र की मृत्यु” की धुन पर
  rationale: यह अत्यंत अनिश्चित अभिव्यक्ति संभवतः किसी धुन या संगीत-निर्देश का नाम है। उद्धरण-चिह्न और ‘की धुन पर’ शीर्षकीय कार्य को स्पष्ट करते हैं, जबकि शब्दों के संभावित अर्थ को मुख्य पाठ में बनाए रखते हैं; अनिश्चितता पादटिप्पणी में स्पष्ट की गई है।
- source_word: מִזְמוֹר
  choice: भजन
  rationale: शीर्षकों में यह संज्ञा गाए जाने वाले भजन अथवा स्तुति-गीत की साहित्यिक-संगीतात्मक विधा बताती है; ‘भजन’ हिन्दी में इसका स्वाभाविक और प्रतिष्ठित समतुल्य है।
- source_word: לְדָוִד
  choice: दाऊद का
  rationale: इब्रानी לְ लेखनकर्ता, संबंध, समर्पण या संग्रहगत संबद्धता सूचित कर सकता है। ‘दाऊद का’ स्पष्ट रूप से ‘दाऊद द्वारा रचित’ कहने की अपेक्षा इस व्यापकता को बेहतर बनाए रखता है।
theological_decisions:
- issue: לְדָוִד में दाऊद से संबंध का प्रकार
  choice: दाऊद का भजन
  alternative: दाऊद द्वारा रचित भजन
  rationale: मूल उपसर्ग लेखनकर्ता होने तक सीमित नहीं है; इसलिए अनुवाद उस संबंध को अनावश्यक रूप से निश्चित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और गरिमापूर्ण रखी गई है। शीर्षक की खंडित संरचना को हिन्दी के छोटे वाक्यों में रखा गया है। अनिश्चित संगीत-संज्ञा को मुख्य पाठ में संभावित अर्थ के साथ और पादटिप्पणी में लिप्यंतरण सहित प्रस्तुत किया गया है।
