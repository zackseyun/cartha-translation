source:
  edition: WLC
  text: אוֹדֶ֣ה יְ֭הוָה בְּ/כָל לִבִּ֑/י אֲ֝סַפְּרָ֗ה כָּל נִפְלְאוֹתֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/001.yaml
  text: I will give thanks to Yahweh with all my heart[a]; I will recount all your wondrous deeds.
translation:
  language: hi
  text: मैं पूरे मन से याहवे का धन्यवाद करूँगा; मैं तेरे सभी अद्भुत कामों[a] का वर्णन करूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी: “तेरे आश्चर्यकर्म” या “तेरे अद्भुत कार्य।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹדֶה
  choice: धन्यवाद करूँगा
  rationale: हिफ़िल रूप यहाँ उपासना में कृतज्ञता प्रकट करने या स्तुति करने का भाव देता है। “धन्यवाद करूँगा” भजन के कृतज्ञतापूर्ण स्वर को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय परमेश्वर-नाम को किसी उपाधि से बदलने के बजाय उसके प्रचलित लिप्यंतरण के रूप में रखा गया है।
- source_word: בְּכָל לִבִּי
  choice: पूरे मन से
  rationale: यह इब्रानी मुहावरा संपूर्ण आंतरिक समर्पण को व्यक्त करता है। आधुनिक हिन्दी में “पूरे मन से” स्वाभाविक है और כָל की समग्रता बनाए रखता है।
- source_word: אֲסַפְּרָה
  choice: वर्णन करूँगा
  rationale: ספר का यह रूप बताने, गिनाने या विस्तार से सुनाने का भाव देता है। “वर्णन करूँगा” परमेश्वर के कार्यों को साक्ष्य के रूप में सुनाने का अर्थ सुरक्षित रखता है।
- source_word: כָּל
  choice: सभी
  rationale: दूसरे चरण में परमेश्वर के आश्चर्यजनक कार्यों की व्यापकता को स्पष्ट रूप से बनाए रखता है। पहले चरण में यही समग्रता “पूरे” से व्यक्त हुई है।
- source_word: נִפְלְאוֹתֶיךָ
  choice: तेरे अद्भुत कामों
  rationale: פלא से बना यह शब्द विस्मय उत्पन्न करने वाले असाधारण, विशेषकर परमेश्वर के, कार्यों को दर्शाता है। “अद्भुत काम” आधुनिक हिन्दी में सहज है और आश्चर्य तथा क्रियात्मकता दोनों को व्यक्त करता है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा
  rationale: पद में परमेश्वर का व्यक्तिगत चतुरक्षरीय नाम सीधे आया है। “याहवे” मूल नाम के संभावित उच्चारण का व्यापक रूप से स्वीकृत लिप्यंतरण है और इसे “प्रभु” जैसी उपाधि से नहीं बदलता।
translation_notes:
  register: भाषा आधुनिक, सरल और उपासना के अनुरूप गरिमापूर्ण रखी गई है। परमेश्वर को संबोधित करने के लिए एकवचन आत्मीय सर्वनाम “तेरे” चुना गया है, जो हिन्दी भजन-शैली में स्वाभाविक है और इब्रानी के दूसरे पुरुष एकवचन को स्पष्ट करता है।
