source:
  edition: WLC
  text: כִּֽי דֹרֵ֣שׁ דָּ֭מִים אוֹתָ֣/ם זָכָ֑ר לֹֽא שָׁ֝כַ֗ח צַעֲקַ֥ת עניים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/012.yaml
  text: For the one who avenges bloodshed remembers them[a]; he does not forget the cry of the afflicted.
translation:
  language: hi
  text: क्योंकि रक्तपात का लेखा लेनेवाला उन्हें स्मरण रखता है; वह दीन-दुखियों[a] की पुकार नहीं भूलता।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘गरीबों’ अथवा ‘पीड़ितों।’ इब्रानी शब्द गरीब, दीन, पीड़ित या सताए हुए लोगों के लिए प्रयुक्त हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण बताता है; हिंदी में ‘क्योंकि’ इस व्याख्यात्मक संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: דֹרֵשׁ דָּמִים
  choice: रक्तपात का लेखा लेनेवाला
  rationale: यह पदबंध बहाए गए निर्दोष रक्त के लिए जवाबदेही और न्याय की माँग करने का भाव रखता है। ‘लेखा लेनेवाला’ न्यायिक अर्थ को व्यक्त करता है, पर किसी विशिष्ट कानूनी पद को अनावश्यक रूप से नहीं जोड़ता।
- source_word: אוֹתָם
  choice: उन्हें
  rationale: इब्रानी रूप बहुवचन कर्म को बनाए रखता है और पीड़ित लोगों के समूह की ओर संकेत करता है।
- source_word: זָכָר
  choice: स्मरण रखता है
  rationale: यद्यपि क्रिया रूपतः पूर्ण है, काव्यात्मक समानांतरता में यह परमेश्वर के स्थायी स्वभाव और वर्तमान क्रिया को व्यक्त करती है।
- source_word: לֹא שָׁכַח
  choice: नहीं भूलता
  rationale: नकारात्मक पूर्ण क्रिया को समानांतर पंक्ति के साथ वर्तमान, निरंतर सत्य के रूप में स्वाभाविक हिंदी में प्रस्तुत किया गया है।
- source_word: צַעֲקַת
  choice: पुकार
  rationale: यह संकट में सहायता और न्याय के लिए उठी आवाज़ का सीधा और स्वाभाविक हिंदी रूप है।
- source_word: עניים
  choice: दीन-दुखियों
  rationale: इब्रानी शब्द निर्धन, पीड़ित, दीन या सताए हुए लोगों का बोध करा सकता है। रक्तपात और न्याय की पुकार के संदर्भ में ‘दीन-दुखियों’ से पीड़ा और असहायता का व्यापक भाव आता है।
theological_decisions:
- issue: דֹרֵשׁ דָּמִים में निहित परमेश्वर का न्याय
  choice: परमेश्वर रक्तपात का लेखा लेता और उसे न्याय के अधीन करता है।
  alternative: परमेश्वर केवल रक्तपात को देखता है, अथवा शाब्दिक रूप से रक्त खोजता है।
  rationale: यह मुहावरा बहाए गए रक्त के दोष के लिए न्यायिक जवाबदेही का संकेत देता है, न कि रक्त की क्रूर इच्छा का। अनुवाद किसी विशिष्ट तकनीकी कानूनी पद को थोपे बिना इस नैतिक अर्थ को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी में संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध शैली। ‘रक्तपात का लेखा लेनेवाला’ न्यायिक भाव को स्पष्ट करता है, जबकि ‘स्मरण रखता है’ और ‘पुकार नहीं भूलता’ मूल की काव्यात्मक समानांतरता बनाए रखते हैं।
