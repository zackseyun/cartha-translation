    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּא
  choice: और वही
  rationale: संयोजक और सर्वनाम पिछले विचार को आगे बढ़ाते हुए कर्ता पर हल्का बल देते हैं; ‘वही’ इस बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יִשְׁפֹּט
  choice: न्याय करेगा
  rationale: שׁפט का यहाँ न्यायिक अर्थ है; काव्यात्मक यिक्तोल को संदर्भानुसार भविष्यकाल में रखा गया है।
- source_word: תֵּבֵל
  choice: जगत
  rationale: תבל प्रायः बसी हुई दुनिया अथवा समस्त मानव-जगत को दर्शाता है; ‘जगत’ संक्षिप्त, गरिमापूर्ण और व्यापक है।
- source_word: בְּצֶדֶק
  choice: धर्म के अनुसार
  rationale: צדק न्याय के नैतिक मानदंड को व्यक्त करता है। ‘धर्म के अनुसार’ आधुनिक हिन्दी में नैतिक सहीपन और न्यायशीलता को व्यक्त करता है, बिना इसे केवल धार्मिक पंथ के अर्थ में सीमित किए।
- source_word: יָדִין
  choice: न्याय करेगा
  rationale: דין यहाँ लोगों पर न्यायिक निर्णय अथवा शासन-संबंधी न्याय करने का अर्थ रखता है। समानांतर पंक्ति में पुनरावृत्ति मूल की न्यायिक धारणा को स्पष्ट रखती है।
- source_word: לְאֻמִּים
  choice: लोगों
  rationale: לאמים अनेक जनसमुदायों अथवा राष्ट्रों को सूचित करता है; ‘लोगों’ आधुनिक राष्ट्र-राज्यों तक अर्थ को सीमित नहीं करता।
- source_word: בְּמֵישָׁרִים
  choice: निष्पक्षता से
  rationale: מישרים सीधाई, समता और निष्पक्ष न्याय का भाव रखता है; ‘निष्पक्षता से’ सामान्य पाठक के लिए स्पष्ट और स्वाभाविक है।
theological_decisions:
- issue: समस्त मानवता पर परमेश्वर का न्यायिक शासन
  choice: पद परमेश्वर के विश्वव्यापी, धर्ममय और निष्पक्ष न्याय को भविष्याभिमुख ढंग से कहता है, पर किसी विशेष अंतकालीन समय-सारणी को निर्धारित नहीं करता।
  alternative: इसे परमेश्वर के निरंतर वर्तमान शासन या केवल अंतिम न्याय के विशिष्ट उल्लेख के रूप में पढ़ा जा सकता है।
  rationale: काव्य में हिब्रू यिक्तोल भविष्य की अथवा चरितार्थ/नियमित क्रिया को व्यक्त कर सकता है; अनुवाद भविष्य का भाव रखता है, लेकिन मूल की कालगत खुली संभावना को टिप्पणी में सुरक्षित करता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, काव्यात्मक गरिमा और सामान्य बोधगम्यता के संतुलन के साथ रखी गई है। ‘जगत’ भजन-साहित्य के अनुरूप है; ‘निष्पक्षता’ מֵישָׁרִים का स्पष्ट आधुनिक प्रतिरूप है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
