  yaml_path: translation/ot/psalms/009/008.yaml
  text: And he will judge the world in righteousness[b][a]; he will govern the peoples with fairness.
translation:
  language: hi
  text: और वही धार्मिकता से जगत का न्याय करेगा[a]; वह निष्पक्षता से लोगों का न्याय करेगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘बसे हुए संसार’।
    reason: lexical_alternative
  - marker: b
