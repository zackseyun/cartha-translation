  text: גָּעַ֣רְתָּ ג֭וֹיִם אִבַּ֣דְתָּ רָשָׁ֑ע שְׁמָ֥/ם מָ֝חִ֗יתָ לְ/עוֹלָ֥ם וָ/עֶֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/005.yaml
  text: You rebuked nations[a]; you destroyed the wicked[b]; you blotted out their name forever and ever.
translation:
  language: hi
  text: तूने राष्ट्रों को डाँटा; तूने दुष्टों[a] का नाश किया; तूने उनका नाम सदा-सर्वदा के लिए मिटा दिया।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘दुष्ट जन’; इब्रानी में शब्द एकवचन है, जिसे किसी एक व्यक्ति के लिए या दुष्टों के पूरे वर्ग के लिए समझा जा सकता है।
    reason: alternative_reading
  - marker: b
    text: ‘उनका नाम’ मिटाने का अर्थ प्रसंग में उनकी स्मृति या यश को मिटा देना भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: גָּעַרְתָּ
  choice: तूने डाँटा
  rationale: क्रिया גער अधिकारपूर्ण और प्रभावशाली फटकार को व्यक्त करती है। ‘डाँटा’ आधुनिक, सहज हिंदी में इस सीधे कार्य को बनाए रखता है।
- source_word: גּוֹיִם
  choice: राष्ट्रों
  rationale: यहाँ גוים सामूहिक जातीय-राजनीतिक समूहों को सूचित करता है। ‘राष्ट्रों’ स्वाभाविक है और बाद की धार्मिक श्रेणी ‘गैर-यहूदी’ को पाठ में नहीं जोड़ता।
- source_word: אִבַּדְתָּ
  choice: नाश किया
  rationale: पिएल रूप किसी को नष्ट करने या मिटा देने का सकर्मक अर्थ देता है; ‘नाश किया’ न्याय के प्रसंग में सशक्त और सामान्य हिंदी है।
- source_word: רָשָׁע
  choice: दुष्टों
  rationale: रूप व्याकरणतः एकवचन है, पर वह किसी वर्ग को सामूहिक या जातिवाचक रूप से दर्शा सकता है। आगे के बहुवचन प्रत्यय ‘उनका’ और ‘राष्ट्रों’ के समानांतर होने से हिंदी में सामूहिक ‘दुष्टों’ स्वाभाविक है।
- source_word: שְׁמָם
  choice: उनका नाम
  rationale: इब्रानी का शाब्दिक अर्थ ‘उनका नाम’ है। यह स्मृति या यश के मिटने का संकेत दे सकता है, किंतु मुख्य पाठ में मूल रूपक सुरक्षित रखा गया है।
- source_word: מָחִיתָ
  choice: मिटा दिया
  rationale: מחה पोंछकर मिटाने या पूरी तरह हटाने का बिंब देता है। ‘नाम मिटा दिया’ हिंदी का स्वाभाविक मुहावरा है और मूल बिंब को बनाए रखता है।
- source_word: לְעוֹלָם וָעֶד
  choice: सदा-सर्वदा के लिए
  rationale: युग्मित अभिव्यक्ति अवधि पर विशेष बल देती है। ‘सदा-सर्वदा के लिए’ आधुनिक हिंदी में उस प्रबल स्थायित्व को व्यक्त करती है।
theological_decisions:
- issue: רָשָׁע का सामूहिक या व्यक्तिगत अर्थ
  choice: 'सामूहिक/जातिवाचक: ‘दुष्टों’'
  alternative: 'व्यक्तिगत या प्रतिनिधि एकवचन: ‘दुष्ट जन’ अथवा ‘दुष्ट को’'
  rationale: इब्रानी एकवचन किसी वर्ग का बोध करा सकता है। ‘राष्ट्रों’ तथा बहुवचन ‘उनका नाम’ के प्रसंग में सामूहिक अर्थ अधिक सुसंगत है, फिर भी व्यक्तिगत अर्थ की वास्तविक संभावना पाद-टिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण और काव्यात्मक शैली रखी गई है। परमेश्वर को संबोधित करने वाले मूल के द्वितीय पुरुष एकवचन के अनुरूप ‘तू’ प्रयोग किया गया है। मूल की तीन समानांतर क्रियाओं और ‘नाम मिटाने’ के बिंब को सुरक्षित रखा गया है।
