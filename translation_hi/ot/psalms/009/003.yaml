  yaml_path: translation/ot/psalms/009/003.yaml
  text: When my enemies turn back[a], they stumble and perish before you.
translation:
  language: hi
  text: 'जब मेरे शत्रु पीछे हटते हैं,

    तो वे तेरे सामने[a] ठोकर खाते और नष्ट हो जाते हैं।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘तेरी उपस्थिति में’; शाब्दिक रूप से, ‘तेरे मुख/उपस्थिति के सामने से।’
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשׁוּב
  choice: जब ... पीछे हटते हैं
  rationale: בְּ के साथ infinitive construct यहाँ कालवाचक उपवाक्य बनाता है। ‘जब ... पीछे हटते हैं’ आधुनिक हिन्दी में स्वाभाविक है और लौटने या युद्ध में पीछे हटने की गति को व्यक्त करता है।
- source_word: אוֹיְבַי
  choice: मेरे शत्रु
  rationale: אוֹיֵב पर प्रथम पुरुष एकवचन प्रत्यय का सीधा अर्थ ‘मेरे शत्रु’ है; यह स्पष्ट और गरिमापूर्ण हिन्दी है।
- source_word: אָחוֹר
  choice: पीछे
  rationale: यह שׁוב के साथ क्रियाविशेषण रूप में उलटी दिशा या पीछे हटने का भाव देता है।
- source_word: יִכָּשְׁלוּ
  choice: ठोकर खाते
  rationale: כשל का निफ़अल रूप लड़खड़ाने या ठोकर खाने का चित्र बनाए रखता है और अगले क्रियापद से पहले पूर्ण विनाश का अर्थ आरोपित नहीं करता।
- source_word: וְיֹאבְדוּ
  choice: और नष्ट हो जाते हैं
  rationale: אבד का क़ाल रूप नष्ट होने या मिट जाने का अर्थ दे सकता है। ‘नष्ट हो जाते हैं’ यहाँ अकर्मक भाव और काव्यात्मक परिणति दोनों को स्पष्ट रखता है।
- source_word: מִפָּנֶיךָ
  choice: तेरे सामने
  rationale: शाब्दिक रूप से ‘तेरे मुख/उपस्थिति के सामने से’ है। ‘तेरे सामने’ स्थानिक और संबंधपरक भाव को स्वाभाविक हिन्दी में बनाए रखता है; उपस्थिति का संभावित अर्थ पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: शत्रुओं के पतन में परमेश्वर की भूमिका
  choice: शत्रु परमेश्वर के सामने ठोकर खाते और नष्ट होते हैं; उनके विनाश की सटीक रीति को नहीं खोला गया।
  alternative: परमेश्वर उन्हें प्रत्यक्ष रूप से नष्ट करता है; अथवा वे केवल उसकी उपस्थिति से धराशायी हो जाते हैं।
  rationale: इब्रानी पाठ पतन को परमेश्वर के मुख/उपस्थिति के सामने या वहाँ से घटित बताता है, पर क्रियाविधि स्पष्ट नहीं करता। अनुवाद उसी धर्मवैचारिक तनाव को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; काव्यात्मक गरिमा के लिए परमेश्वर को संबोधित करते समय ‘तेरे’ रखा गया है। पंक्ति-विभाजन इब्रानी वाक्य की कालवाचक भूमिका और उसके परिणाम को स्पष्ट करता है।
