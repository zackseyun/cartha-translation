language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/יִבְטְח֣וּ בְ֭/ךָ יוֹדְעֵ֣י שְׁמֶ֑/ךָ כִּ֤י לֹֽא עָזַ֖בְתָּ דֹרְשֶׁ֣י/ךָ יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/010.yaml
  text: And those who know your name will trust in you[a], for you, O Yahweh[c][b], have not forsaken those who seek you.
translation:
  language: hi
  text: और जो तेरे नाम को जानते हैं[a], वे तुझ पर भरोसा करेंगे, क्योंकि हे याहवे[b], तूने उन लोगों को नहीं छोड़ा जो तुझे खोजते हैं[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ ‘नाम को जानना’ केवल नाम का उच्चारण जानना नहीं, बल्कि परमेश्वर के प्रकट चरित्र और प्रतिष्ठा को जानना भी है।
    reason: cultural_note
  - marker: b
    text: 'इब्रानी: YHWH; इसका परंपरागत अनुवाद ‘प्रभु’ है।'
    reason: alternative_reading
  - marker: c
    text: 'या: ‘त्यागा नहीं।’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִבְטְחוּ בְךָ
  choice: और ... तुझ पर भरोसा रखेंगे
  rationale: Qal अपूर्ण रूप यहाँ भरोसे की स्वाभाविक परिणति व्यक्त करता है; हिंदी में भविष्यकाल और ‘तुझ पर भरोसा रखना’ अर्थ तथा काव्यगत प्रवाह को सहज रूप से व्यक्त करते हैं।
- source_word: יֹדְעֵי שְׁמֶךָ
  choice: जो तेरे नाम को जानते हैं
  rationale: कृदन्तीय रचना ऐसे लोगों के वर्ग को बताती है जिनकी पहचान परमेश्वर के नाम को जानना है। ‘नाम’ को मुख्य पाठ में बनाए रखने से उसके प्रकट चरित्र और प्रतिष्ठा का बाइबलीय अर्थ सुरक्षित रहता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पहले कथन में व्यक्त भरोसे का आधार प्रस्तुत करता है।
- source_word: לֹא עָזַבְתָּ
  choice: तूने ... नहीं छोड़ा
  rationale: עזב का अर्थ छोड़ना, त्यागना या परित्याग करना हो सकता है। ‘नहीं छोड़ा’ आधुनिक हिंदी में स्वाभाविक है और संदर्भ में निरंतर विश्वासयोग्यता का भाव रखता है।
- source_word: דֹרְשֶׁיךָ
  choice: अपने खोजियों को
  rationale: דרש यहाँ परमेश्वर को भक्ति और प्रार्थना के साथ खोजने का भाव रखता है। ‘अपने खोजियों’ संक्षिप्त, काव्यात्मक और अर्थसंगत है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: यह इब्रानी चतुरक्षरीय व्यक्तिगत नाम YHWH का हिंदी में प्रचलित लिप्यंतरण है; इसे किसी उपाधि से प्रतिस्थापित नहीं किया गया।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में व्यक्तिगत नाम YHWH है। हिंदी पाठकों में व्यापक रूप से पहचाने जाने वाले ‘यहोवा’ से नाम और उपाधि का भेद बना रहता है; पादटिप्पणी मूल रूप स्पष्ट करती है।
- issue: ‘नाम जानने’ का आशय
  choice: शाब्दिक अभिव्यक्ति ‘तेरे नाम को जानते हैं’ बनाए रखी
  alternative: तेरे चरित्र को जानते हैं
  rationale: मूल की संक्षिप्त और अर्थसमृद्ध अभिव्यक्ति को खोलकर केवल एक अर्थ तक सीमित नहीं किया गया; पादटिप्पणी बताती है कि ‘नाम’ मात्र उच्चारण से अधिक व्यापक है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण, काव्यात्मक और सामान्य पाठक के लिए सुबोध शैली। भजन की सीधी प्रार्थनात्मक संबोधन-शैली बनाए रखने के लिए ‘तू/तेरे/तुझ’ का प्रयोग किया गया है।
