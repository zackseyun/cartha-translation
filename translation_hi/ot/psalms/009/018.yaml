id: PSA.9.18
reference: Psalms 9:18
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּ֤י לֹ֣א לָ֭/נֶצַח יִשָּׁכַ֣ח אֶבְי֑וֹן תִּקְוַ֥ת ענוים תֹּאבַ֥ד לָ/עַֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/018.yaml
  text: For the needy will not be forgotten forever[b][a]; the hope of the afflicted will not perish forever.
translation:
  language: hi
  text: क्योंकि जरूरतमंद को सदा के लिए भुलाया नहीं जाएगा;[b] पीड़ित[a] की आशा सदा के लिए नष्ट नहीं होगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘दीन’, ‘विनम्र व्यक्ति’ अथवा ‘नम्र व्यक्ति’।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी कविता में यहाँ दो निकटार्थी अभिव्यक्तियाँ प्रयुक्त हैं, जिनका अर्थ ‘सदा के लिए’ और ‘सर्वदा’ है। इनसे इस बात पर बल दिया गया है कि जरूरतमंद को स्थायी रूप से भुलाया नहीं जाएगा।
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले निवेदन के आधार या आश्वासन को प्रस्तुत करता है; हिन्दी में ‘क्योंकि’ इसकी संयोजक शक्ति को स्वाभाविक ढंग से बनाए रखता है।
- source_word: לֹא
  choice: न… न
  rationale: पहले खंड में निषेध स्पष्ट है और समानांतर दूसरे खंड में अर्थ की दृष्टि से लागू होता है; हिन्दी में दोनों क्रियाओं के साथ ‘न’ रखने से आशय स्पष्ट और काव्यात्मक रहता है।
- source_word: לָנֶצַח / לָעַד
  choice: सदा के लिए
  rationale: दोनों निकटार्थी कालवाचक अभिव्यक्तियाँ स्थायी रूप से या सर्वदा का अर्थ देती हैं; एक ही स्वाभाविक हिन्दी पदबंध की पुनरावृत्ति समानांतर बल बनाए रखती है।
- source_word: יִשָּׁכַח
  choice: भुलाया जाएगा
  rationale: निफ़अल अपूर्ण क्रिया का कर्मवाच्य रूप सुरक्षित रखा गया है; इससे परमेश्वर को व्याकरणिक कर्ता बनाकर जोड़ने से बचा गया है।
- source_word: אֶבְיוֹן
  choice: जरूरतमंद
  rationale: यह अभाव और निर्बलता में पड़े व्यक्ति को दर्शाता है; ‘जरूरतमंद’ अर्थ को केवल आर्थिक निर्धनता तक सीमित नहीं करता।
- source_word: תִּקְוַת
  choice: की आशा
  rationale: रचना-रूप को अगले संज्ञा-पद से स्वाभाविक हिन्दी संबंधकारक द्वारा जोड़ा गया है।
- source_word: ענוים
  choice: पीड़ितों
  rationale: समानांतर ‘जरूरतमंद’ के संदर्भ में सामाजिक दुःख और दबाव का पक्ष प्रमुख है, जबकि पादटिप्पणी विनम्र/दीन अर्थ-छाया को सुरक्षित रखती है।
- source_word: תֹּאבַד
  choice: नष्ट न होगी
  rationale: अर्थ ‘नष्ट होना/मिट जाना’ है; पहले खंड के निषेध को हिन्दी में स्पष्ट रूप से दोहराया गया है।
theological_decisions:
- issue: कर्मवाच्य ‘भुलाया जाएगा’ का निहित कर्ता
  choice: परमेश्वर का संकेत निहित रखते हुए कर्मवाच्य रूप बनाए रखा गया।
  alternative: ‘परमेश्वर जरूरतमंद को सदा के लिए नहीं भूलेगा।’
  rationale: इब्रानी पाठ परमेश्वर को स्पष्ट व्याकरणिक कर्ता नहीं बनाता। कर्मवाच्य रूप मूल की काव्यात्मक बनावट और निहितार्थ दोनों को सुरक्षित रखता है।
- issue: ענוים का अर्थ
  choice: पीड़ितों
  alternative: दीनों / विनम्र लोगों / नम्र लोगों
  rationale: ‘जरूरतमंद’ के साथ समानांतरता में दुःख और सामाजिक दबाव का अर्थ प्रमुख है, पर शब्द की विनम्रता संबंधी अर्थ-छाया पादटिप्पणी में दी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और काव्यात्मक रूप अपनाया गया है। दोनों समानांतर खंडों में ‘सदा के लिए’ और निषेध की पुनरावृत्ति मूल के आश्वासन को स्पष्ट करती है।
