  yaml_path: translation/ot/psalms/047/001.yaml
  text: Clap your hands[a], all peoples[b]; shout to God with a voice of joy.
translation:
  language: hi
  text: हे सब जातियों के लोगो[a], तालियाँ बजाओ; आनन्द के स्वर से[b] परमेश्वर का जयघोष करो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘हे सब राष्ट्रों।’ इब्रानी शब्द जातीय-सामुदायिक अर्थ में ‘जातियाँ/जनसमुदाय’ अथवा व्यापक अर्थ में ‘राष्ट्र’ हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘आनन्द की ध्वनि से’ अथवा ‘उल्लासपूर्ण स्वर से।’
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הָעַמִּים
  choice: हे सभी जाति के लोगो
  rationale: यह संबोधन सभी जनसमुदायों की समष्टि को दर्शाता है। ‘जाति के लोग’ इब्रानी बहुवचन की जातीय-सामुदायिक व्यापकता को बनाए रखता है और केवल राजनीतिक राज्यों तक अर्थ को सीमित नहीं करता।
- source_word: תִּקְעוּ כָף
  choice: तालियाँ बजाओ
  rationale: हथेली पर हथेली मारने के इब्रानी मुहावरे का यह स्वाभाविक और वर्तमान हिन्दी रूप है।
- source_word: הָרִיעוּ
  choice: जयघोष करो
  rationale: हिफ़ील आज्ञार्थक रूप ऊँची, उल्लासपूर्ण पुकार या अभिनंदन-घोष को व्यक्त करता है; ‘जयघोष’ प्रसंग के राजकीय और आनन्दमय भाव को रखता है।
- source_word: לֵאלֹהִים
  choice: परमेश्वर का
  rationale: हिन्दी में ‘परमेश्वर का जयघोष करो’ लक्ष्य की ओर किए गए अभिनंदन को स्वाभाविक ढंग से व्यक्त करता है, यद्यपि इब्रानी में पूर्वसर्ग का शाब्दिक अर्थ ‘परमेश्वर के लिए/की ओर’ है।
- source_word: בְּקוֹל רִנָּה
  choice: आनन्द के स्वर से
  rationale: यह קוֹל के स्वर/ध्वनि और רִנָּה के उल्लासपूर्ण पुकार, गान या आनन्द—दोनों को संक्षिप्त और स्वाभाविक हिन्दी में बनाए रखता है।
theological_decisions:
- issue: सम्बोधन का दायरा
  choice: पद सभी जातियों के लोगों को सार्वभौमिक रूप से परमेश्वर की स्तुति के लिए बुलाता है।
  alternative: सम्बोधन को अलंकारिक रूप से केवल इस्राएल के आसपास की जातियों तक सीमित समझना।
  rationale: इब्रानी पाठ स्पष्ट रूप से ‘सभी जनसमुदायों’ कहता है, और भजन में परमेश्वर के राजत्व का प्रसंग इस व्यापक आह्वान का समर्थन करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामूहिक उपासना में सहज है। ‘तालियाँ बजाओ’ मुहावरे को स्वाभाविक हिन्दी में देता है; ‘जयघोष करो’ ऊँची, उल्लासपूर्ण पुकार को बनाए रखता है। फुटनोट के चिह्न उन्हीं पदांशों के बाद रखे गए हैं जिनकी वैकल्पिक व्याख्या दी गई है।
