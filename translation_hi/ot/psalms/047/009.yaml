  text: נְדִ֘יבֵ֤י עַמִּ֨ים נֶאֱסָ֗פוּ עַם֮ אֱלֹהֵ֪י אַבְרָ֫הָ֥ם כִּ֣י לֵֽ֭/אלֹהִים מָֽגִנֵּי אֶ֗רֶץ מְאֹ֣ד נַעֲלָֽה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/047/009.yaml
  text: The nobles of the peoples have gathered as the people of the God of Abraham[a], for the shields of the earth belong to God[b]; he is greatly exalted.
translation:
  language: hi
  text: जातियों के प्रधान लोग इब्राहीम के परमेश्वर की प्रजा के रूप में इकट्ठे हुए हैं[a], क्योंकि पृथ्वी की ढालें परमेश्वर की हैं[b]; वह अत्यन्त महिमान्वित है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इब्राहीम के परमेश्वर की प्रजा के साथ इकट्ठे हुए हैं।” इब्रानी पदबंध निकट संगति या पहचान—दोनों अर्थ दे सकता है।
    reason: alternative_reading
  - marker: b
    text: अर्थात् सम्भवतः “पृथ्वी के शासक” या “पृथ्वी के रक्षक”; शाब्दिक रूप से, “पृथ्वी की ढालें।”
    reason: lexical_alternative
lexical_decisions:
- source_word: נְדִיבֵי עַמִּים
  choice: देश-देश के प्रतिष्ठित लोग
  rationale: נְדִיבֵי यहाँ ऊँचे पद या सामाजिक प्रतिष्ठा वाले लोगों को दर्शाता है। ‘प्रतिष्ठित लोग’ आधुनिक हिन्दी में स्वाभाविक है और ‘ढालें’ के शासकीय रूपक से मेल खाता है; עַמִּים की बहुलता ‘देश-देश’ से व्यक्त होती है।
- source_word: נֶאֱסָפוּ
  choice: इकट्ठे हुए हैं
  rationale: निफ़अल रूप यहाँ लोगों के एकत्र होने को व्यक्त करता है। यह हिन्दी में स्तोत्र की वर्तमान घोषणात्मक शक्ति बनाए रखता है।
- source_word: עַם אֱלֹהֵי אַבְרָהָם
  choice: इब्राहीम के परमेश्वर की प्रजा के रूप में
  rationale: इब्रानी पदबंध संक्षिप्त और कुछ हद तक अस्पष्ट है। ‘के रूप में’ प्रतिष्ठित लोगों की उस प्रजा से पहचान या उसमें सम्मिलित होने का सम्भावित अर्थ व्यक्त करता है, जबकि वैकल्पिक संगति-पाठ पाद-टिप्पणी में रखा गया है।
- source_word: לֵאלֹהִים
  choice: परमेश्वर की हैं
  rationale: लामेद यहाँ अधिकार या सम्बन्ध व्यक्त करता है; हिन्दी का सम्बन्धकारक स्वाभाविक रूप से ‘परमेश्वर की हैं’ बनता है।
- source_word: מָגִנֵּי אֶרֶץ
  choice: पृथ्वी की ढालें
  rationale: मूल रूपक का शाब्दिक चित्र सुरक्षित रखा गया है। सन्दर्भ में इसका आशय शासकों या रक्षकों से हो सकता है, जिसे पाद-टिप्पणी में बताया गया है।
- source_word: מְאֹד נַעֲלָה
  choice: वह अत्यन्त ऊँचा है
  rationale: पुल्लिंग एकवचन क्रिया का निहित कर्ता निकटवर्ती ‘परमेश्वर’ समझा गया है। ‘अत्यन्त ऊँचा’ स्तुति और सर्वोच्चता—दोनों भावों को सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: अन्य जातियों के प्रतिष्ठित लोगों और इब्राहीम के परमेश्वर की प्रजा का सम्बन्ध
  choice: उन्हें इब्राहीम के परमेश्वर की प्रजा के रूप में एकत्र दिखाया गया है।
  alternative: वे इब्राहीम के परमेश्वर की प्रजा के साथ इकट्ठे हुए हैं।
  rationale: संक्षिप्त इब्रानी विन्यास पहचान, सम्मिलन या निकट संगति की अनुमति देता है। मुख्य पाठ में पहचान/सम्मिलन का सम्भावित अर्थ रखा गया है, पर वैकल्पिक अर्थ को पाद-टिप्पणी में सुरक्षित रखा गया है।
- issue: ‘पृथ्वी की ढालें’ का संकेत
  choice: मुख्य पाठ में रूपक को अक्षुण्ण रखा गया है।
  alternative: ‘पृथ्वी के शासक’ या ‘पृथ्वी के रक्षक’।
  rationale: रूपक सम्भवतः राजाओं या शासकों को परमेश्वर के अधीन बताता है, पर उसे सीधे ‘शासक’ कर देना मूल काव्यात्मक बहुअर्थता को समाप्त कर देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘प्रजा’ राजकीय स्तोत्र के सन्दर्भ और परमेश्वर से सम्बन्धित सामूहिक पहचान के लिए चुना गया है। मुख्य पाठ में इब्रानी का ‘ढालें’ रूपक सुरक्षित है और दोनों वास्तविक अस्पष्टताएँ पाद-टिप्पणियों में दी गई हैं।
