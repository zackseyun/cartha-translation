  terminology: “परमप्रधान,” “महान राजा,” and “पृथ्वी” are suitable. The divine name is revised to “याहवे” to align with the stipulated rendering of יהוה as Yahweh. The note is also adjusted to refer to God rather than “ऐसे जन,” which is inappropriate in this context.
