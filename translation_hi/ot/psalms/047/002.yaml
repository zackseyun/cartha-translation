lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह आसपास के स्तुतिगान का कारण बताता है और इब्रानी के कारणसूचक भाव को स्वाभाविक हिन्दी में रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है, किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: עֶלְיוֹן
  choice: परमप्रधान
  rationale: यह परमेश्वर की सर्वोच्चता दर्शाने वाली उपाधि है; ‘परमप्रधान’ आधुनिक धार्मिक हिन्दी में संक्षिप्त, प्रतिष्ठित और सुबोध है।
- source_word: נוֹרָא
  choice: भययोग्य
  rationale: यह शब्द ऐसे व्यक्ति का वर्णन करता है जो श्रद्धामिश्रित भय और विस्मय उत्पन्न करता है। ‘भययोग्य’ इस गंभीर भाव को बनाए रखता है, यद्यपि विकल्प पादटिप्पणी में दिए गए हैं।
- source_word: מֶלֶךְ גָּדוֹל
  choice: महान राजा
  rationale: यह राजत्व और महिमा दोनों को सीधे सुरक्षित रखता है।
- source_word: עַל כָּל הָאָרֶץ
  choice: सारी पृथ्वी का
  rationale: राजा के साथ हिन्दी का संबंधसूचक प्रयोग स्वाभाविक है और इस राज्याभिषेक-संदर्भ में सार्वभौमिक शासन व्यक्त करता है।
theological_decisions:
- issue: יְהוָה दिव्य नाम का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में व्यक्तिगत दिव्य नाम स्पष्ट रूप से उपस्थित है। हिन्दी पाठकों के लिए स्थापित देवनागरी रूप ‘यहोवा’ चुना गया; इसे ‘प्रभु’ जैसी उपाधि से नहीं बदला गया।
- issue: נוֹרָא का ईश्वर के संबंध में भाव
  choice: भययोग्य
  alternative: विस्मयकारी / भय उत्पन्न करनेवाला
  rationale: मुख्य पाठ श्रद्धामिश्रित भय की धार्मिक गंभीरता बनाए रखता है और अर्थ को केवल आतंक या केवल प्रशंसा तक सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, काव्यात्मक गरिमा और सामान्य बोधगम्यता के संतुलन के साथ रखी गई है। ‘वह’ जोड़कर इब्रानी की समांतर पद-रचना को हिन्दी में स्पष्ट और स्वाभाविक बनाया गया है।
