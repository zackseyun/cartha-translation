source:
  edition: WLC
  text: כִּ֤י מֶ֖לֶךְ כָּל הָ/אָ֥רֶץ אֱלֹהִ֗ים זַמְּר֥וּ מַשְׂכִּֽיל־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/047/007.yaml
  text: For God is the King of all the earth[a]; sing a psalm with understanding.
translation:
  language: hi
  text: क्योंकि परमेश्वर सारी पृथ्वी का राजा है; समझ-बूझ के साथ[a] स्तुति-गीत गाओ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “कुशलता से गाओ”; संभवतः “मस्कील गाओ”—‘मस्कील’ एक काव्य या संगीत-संबंधी पारिभाषिक शब्द हो सकता है।
    reason: מַשְׂכִּיל के अर्थ में समझ, कुशलता और किसी गीत-विधा के नाम—इन संभावनाओं के बीच वास्तविक शब्दार्थगत अस्पष्टता है।
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले आह्वान का कारण बताता है; ‘क्योंकि’ इसके कारणसूचक बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: מֶלֶךְ כָּל־הָאָרֶץ
  choice: सारी पृथ्वी का राजा
  rationale: इब्रानी संबंध-रचना को निकटता से रखते हुए परमेश्वर के सार्वभौमिक राजत्व को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: यहाँ रूप व्याकरण की दृष्टि से एकवचन अर्थ में इस्राएल के परमेश्वर के लिए प्रयुक्त है; ‘परमेश्वर’ मानक और गरिमापूर्ण हिन्दी पर्याय है।
- source_word: זַמְּרוּ
  choice: स्तुति-गीत गाओ
  rationale: बहुवचन आज्ञार्थक क्रिया संगीत के साथ स्तुति करने का आह्वान करती है। हिन्दी में ‘स्तुति-गीत गाओ’ प्रसंग को स्पष्ट करते हुए स्वाभाविक है।
- source_word: מַשְׂכִּיל
  choice: समझ-बूझ के साथ
  rationale: यह कठिन शब्द समझ, विवेक या कुशलता से गाने का भाव दे सकता है और संभवतः किसी काव्य-संगीत विधा का नाम भी है। मुख्य पाठ में अर्थपूर्ण क्रियाविशेषणात्मक संभावना रखी गई है और दूसरी संभावनाएँ पाद-टिप्पणी में सुरक्षित हैं।
theological_decisions:
- issue: परमेश्वर के राजत्व का विस्तार
  choice: परमेश्वर सारी पृथ्वी का राजा है
  alternative: ‘पृथ्वी’ को अधिक सीमित अर्थ में ‘देश’ समझना
  rationale: כָּל־הָאָרֶץ का इस संदर्भ में स्वाभाविक अर्थ सार्वभौमिक है; अनुवाद पाठ के दायरे को संकीर्ण नहीं करता।
- issue: מַשְׂכִּיל की अस्पष्टता
  choice: समझ-बूझ के साथ
  alternative: कुशलता से; अथवा ‘मस्कील’ नामक गीत
  rationale: शब्द की व्याख्या विवादित है। मुख्य पाठ एक स्वाभाविक संभावित अर्थ देता है, जबकि पाद-टिप्पणी काव्य-संगीत संबंधी विकल्पों को बिना किसी एक को अंतिम ठहराए बनाए रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सामूहिक आराधना के योग्य शैली। अर्धविराम इब्रानी वाक्य के कारण-वचन और उसके बाद की आज्ञा के बीच स्पष्ट संबंध बनाए रखता है।
