  yaml_path: translation/ot/psalms/047/006.yaml
  text: Sing praises to God[a], sing praises; sing praises to our King, sing praises.
translation:
  language: hi
  text: परमेश्वर का गुणगान करो[a], गुणगान करो; हमारे राजा का गुणगान करो, गुणगान करो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “परमेश्वर की संगीत के साथ स्तुति करो ... हमारे राजा की संगीत के साथ स्तुति करो।” इब्रानी क्रिया केवल गाने तक सीमित नहीं है; इसका अर्थ संगीत के द्वारा व्यापक रूप से स्तुति करना भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: זַמְּרוּ / זַמֵּרוּ
  choice: गुणगान करो
  rationale: बहुवचन आज्ञार्थक क्रिया זמר यहाँ संगीतपूर्ण स्तुति का आह्वान करती है। ‘गुणगान करो’ आधुनिक हिन्दी में गायन और स्तुति—दोनों भाव स्वाभाविक रूप से व्यक्त करता है और इब्रानी की चार बार की पुनरावृत्ति को बनाए रखता है।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: इस संदर्भ में यह इस्राएल के परमेश्वर के लिए प्रयुक्त एकवचन संबोधन है; ‘परमेश्वर’ प्रतिष्ठित और सामान्य आधुनिक हिन्दी बाइबलीय प्रयोग है।
- source_word: לְמַלְכֵּנוּ
  choice: हमारे राजा का
  rationale: हिन्दी में ‘गुणगान करना’ के साथ संबंधसूचक ‘का’ लक्ष्य को स्वाभाविक ढंग से व्यक्त करता है। संदर्भ में राजा स्वयं परमेश्वर हैं, पर हिन्दी में सामान्य संज्ञा के रूप में ‘राजा’ को अनावश्यक रूप से विशेष रूप देने की जरूरत नहीं है।
theological_decisions:
- issue: परमेश्वर का राजत्व
  choice: हमारे राजा
  alternative: हमारे महाराजा / हमारे सम्राट
  rationale: निकटवर्ती संदर्भ परमेश्वर को सार्वभौम राजा के रूप में प्रस्तुत करता है। ‘हमारे राजा’ इब्रानी מַלְכֵּנוּ का सीधा और संयत अनुवाद है तथा अतिरिक्त राजकीय या सांप्रदायिक अर्थ नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, काव्यात्मक और सामूहिक आराधना के योग्य रखी गई है। इब्रानी पाठ की चार बार की आवृत्ति सुरक्षित है; अर्धविराम दोनों समानांतर पदों को स्पष्ट करता है।
