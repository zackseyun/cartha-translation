  yaml_path: translation/ot/psalms/047/004.yaml
  text: He chooses for us our inheritance[a], the pride of Jacob, whom he loves[c][b]. Selah
translation:
  language: hi
  text: वह हमारे लिए हमारी विरासत चुनता है[a]—याकूब का गौरव, जिससे वह प्रेम करता है[b]। सेला[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह हमारे लिए हमारी विरासत चुनेगा।”
    reason: יִבְחַר वर्तमान अथवा भविष्य का भाव दे सकता है।
  - marker: b
    text: '“जिससे वह प्रेम करता है” का संबंध विरासत/भूमि से भी समझा जा सकता है: “याकूब का वह गौरव, जिससे वह प्रेम करता है।”'
    reason: इब्रानी संबंधवाचक उपवाक्य के पूर्वपद में वास्तविक अस्पष्टता है।
  - marker: c
    text: ‘सेला’ अनिश्चित अर्थ वाला इब्रानी उपासना अथवा संगीत-संबंधी शब्द है; परंपरागत रूप से इसका अनुवाद नहीं किया जाता।
    reason: मूल सांस्कृतिक और आराधनात्मक संकेत को बिना अनुमान के सुरक्षित रखना।
lexical_decisions:
- source_word: יִבְחַר
  choice: चुनता है
  rationale: कालवाचक अपूर्ण क्रिया वर्तमान या भविष्य का भाव दे सकती है। भजन के प्रसंग में परमेश्वर के निरंतर कार्य को व्यक्त करने के लिए वर्तमान काल स्वाभाविक है; भविष्यकाल की संभावना पादटिप्पणी में रखी गई है।
- source_word: לָנוּ
  choice: हमारे लिए
  rationale: ל उपसर्ग और प्रथम पुरुष बहुवचन प्रत्यय लाभ अथवा पक्ष का भाव देते हैं; आधुनिक हिन्दी में ‘हमारे लिए’ इसका सहज रूप है।
- source_word: נַחֲלָתֵנוּ
  choice: हमारी विरासत
  rationale: נחלה वंशानुगत भाग, विरासत या बाँटी हुई भूमि को दर्शाता है। ‘विरासत’ वाचा और भूमि के हिस्से—दोनों भावों को बनाए रखती है।
- source_word: גְּאוֹן
  choice: गौरव
  rationale: यहाँ शब्द सकारात्मक अर्थ में श्रेष्ठता, शोभा या महिमा को दर्शाता है। हिन्दी में ‘गौरव’ स्वाभाविक है और ‘घमण्ड’ जैसा नकारात्मक अर्थ नहीं लाता।
- source_word: יַעֲקֹב
  choice: याकूब
  rationale: मूल पाठ में व्यक्तिगत और सामुदायिक नाम ‘याकूब’ है; इसे व्याख्यात्मक रूप से ‘इस्राएल’ में नहीं बदला गया।
- source_word: אֲשֶׁר אָהֵב
  choice: जिससे वह प्रेम करता है
  rationale: मुख्य पाठ में संबंधवाचक उपवाक्य को याकूब से जोड़ा गया है। אָהֵב का पूर्ण रूप यहाँ स्थायी प्रेम की अवस्था व्यक्त कर सकता है, इसलिए वर्तमान काल उपयुक्त है।
- source_word: סֶלָה
  choice: सेला
  rationale: इस इब्रानी उपासना अथवा संगीत-संबंधी शब्द का निश्चित अर्थ अज्ञात है; इसलिए इसे लिप्यंतरित किया गया है।
theological_decisions:
- issue: ‘जिससे वह प्रेम करता है’ का संबंध
  choice: मुख्य पाठ में यह उपवाक्य ‘याकूब’ को विशेषित करता है।
  alternative: 'यह उपवाक्य विरासत/भूमि अथवा ‘गौरव’ को विशेषित कर सकता है: ‘वह गौरव, जिससे वह प्रेम करता है।’'
  rationale: निकटवर्ती व्यक्तिगत संदर्भ ‘याकूब’ और परमेश्वर के याकूब से प्रेम की बाइबिलीय भाषा इस पाठ को स्वाभाविक बनाते हैं; फिर भी इब्रानी संबंधवाचक रचना दूसरे संबंध की संभावना को समाप्त नहीं करती, इसलिए उसे पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। डैश दूसरे कर्मांश को ‘विरासत’ की व्याख्या के रूप में स्पष्ट करता है। ‘उस याकूब’ संबंधवाचक उपवाक्य का मुख्य पाठ में याकूब से संबंध स्पष्ट करता है, जबकि वैकल्पिक संबंध पादटिप्पणी में सुरक्षित है।
