lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: संगीत-निर्देशक के लिए
  rationale: भजन-शीर्षकों में यह पद संगीत का नेतृत्व करने वाले व्यक्ति की ओर संकेत करता है। ‘संगीत-निर्देशक’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है; ל उपसर्ग को ‘के लिए’ से व्यक्त किया गया है, यद्यपि ‘को’ भी सम्भव है।
- source_word: לִבְנֵי
  choice: के पुत्रों का
  rationale: शीर्षकों में ל सम्बन्ध, समर्पण या रचनाकार होने का संकेत दे सकता है। ‘का’ सम्बन्ध को व्यक्त करता है, पर इसे निश्चित रूप से रचनाकार अथवा प्राप्तकर्ता मानकर अस्पष्टता का समाधान नहीं करता।
- source_word: קֹרַח
  choice: कोरह
  rationale: इब्रानी व्यक्तिगत नाम का हिन्दी बाइबल-परम्परा में प्रचलित लिप्यंतरण रखा गया है।
- source_word: מִזְמוֹר
  choice: एक भजन
  rationale: מִזְמוֹר भजन-साहित्य की मानक विधा-संज्ञा है; ‘भजन’ हिन्दी में स्वाभाविक और स्थापित समतुल्य है।
