    text: या, “परमेश्वर राष्ट्रों पर राजा हुआ है; परमेश्वर ने अपने पवित्र सिंहासन पर आसन ग्रहण किया है।” इब्रानी की पूर्ण क्रियाओं को उसके शासन की स्थापना पर बल देने वाली भी समझा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: מָלַךְ
  choice: राज्य करता है
  rationale: इब्रानी क़ातल रूप यहाँ काव्यात्मक उद्घोषणा में वर्तमान और परिणामस्वरूप स्थापित राजत्व व्यक्त कर सकता है। ‘राज्य करता है’ स्वाभाविक हिन्दी में परमेश्वर की सक्रिय सार्वभौम सत्ता बताता है।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: इस प्रसंग में बहुवचन रूप इस्राएल के एकमात्र परमेश्वर को सूचित करता है। दोनों अर्धपंक्तियों में इसकी पुनरावृत्ति बल देने के लिए सुरक्षित रखी गई है।
- source_word: עַל
  choice: पर
  rationale: जातियों के संबंध में यह शासन और अधिकार का बोध कराता है; हिन्दी में ‘पर राज्य करता है’ स्वाभाविक प्रयोग है।
- source_word: גּוֹיִם
  choice: जाति-जाति
  rationale: यह सामूहिक रूप से विभिन्न राष्ट्रों और लोगों को दर्शाता है। ‘जाति-जाति’ परिचित, व्यापक और काव्यात्मक हिन्दी है तथा बाद की विशिष्ट धार्मिक अर्थछाया नहीं जोड़ता।
- source_word: יָשַׁב
  choice: विराजमान है
  rationale: मूल क्रिया का अर्थ बैठना है, पर सिंहासन के साथ यह राजकीय आसन ग्रहण किए होने का भाव रखती है। ‘विराजमान है’ उस ठोस राजकीय छवि को स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: כִּסֵּא
  choice: सिंहासन
  rationale: राजकीय और ईश्वरीय संदर्भ में इसका उचित अर्थ ‘सिंहासन’ है, सामान्य ‘आसन’ नहीं।
- source_word: קָדְשׁוֹ
  choice: अपने पवित्र
  rationale: शाब्दिक रचना ‘उसकी पवित्रता का सिंहासन’ है, जो विशेषणात्मक अर्थ देती है। ‘अपने पवित्र सिंहासन’ हिन्दी में स्वाभाविक है और कर्ता परमेश्वर की ओर संबंध स्पष्ट करता है।
theological_decisions:
- issue: इब्रानी काव्य में पूर्ण क्रियाओं द्वारा व्यक्त ईश्वरीय राजत्व
  choice: 'वर्तमान उद्घोषणा: ‘परमेश्वर ... राज्य करता है; परमेश्वर ... विराजमान है।’'
  alternative: 'आरंभिक/पूर्णतामूलक अर्थ: ‘परमेश्वर ... राजा हो गया है; परमेश्वर ... अपने पवित्र सिंहासन पर आसीन हो गया है।’'
  rationale: भजन का संदर्भ परमेश्वर के वर्तमान सार्वभौम राजत्व का उत्सवी उद्घोष करता है। वर्तमान काल हिन्दी में इस सतत वास्तविकता को स्वाभाविक रूप से पहुँचाता है, जबकि राजत्व की स्थापना पर बल देने वाला पूर्णतामूलक अर्थ भी इब्रानी रूपों में संभव है और पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण काव्यात्मक शैली रखी गई है। ‘जाति-जाति’ व्यापक जनसमूहों का परिचित बाइबिलीय-काव्यात्मक संकेत है; ‘विराजमान’ सिंहासन-संदर्भ में सहज राजकीय गरिमा देता है।
