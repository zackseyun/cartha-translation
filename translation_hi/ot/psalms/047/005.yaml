lexical_decisions:
- source_word: עָלָה
  choice: ऊपर गया है
  rationale: क्रिया का मूल अर्थ ‘ऊपर जाना/चढ़ना’ है। हिन्दी का पूर्ण वर्तमान काव्यात्मक घोषणा के अनुकूल है और बाद की विशिष्ट धर्मवैज्ञानिक धारणाओं को अनावश्यक रूप से नहीं जोड़ता।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: यहाँ समानांतर पंक्ति के याहवे का ही उल्लेख है, इसलिए एकवचन में इस्राएल के परमेश्वर का बोध कराया गया है।
- source_word: בִּתְרוּעָה
  choice: जयघोष के बीच
  rationale: תְּרוּעָה ऊँची पुकार, सामूहिक जयध्वनि या घोष को व्यक्त कर सकता है। संदर्भ राजकीय और उत्सवी है; ‘जयघोष’ उस व्यापक भाव को स्वाभाविक हिन्दी में रखता है, जबकि ‘युद्धघोष’ अर्थ को बहुत संकरा कर देता।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी मूल में परमेश्वर का व्यक्तिगत नाम है; इसे किसी उपाधि से बदलने के बजाय लिप्यंतरित किया गया है।
- source_word: בְּקוֹל
  choice: ध्वनि के बीच
  rationale: קוֹל का अर्थ आवाज़ या ध्वनि है। नरसिंगे के साथ ‘ध्वनि’ स्वाभाविक है; समानांतर रचना बनाए रखने के लिए ‘के बीच’ चुना गया है।
- source_word: שׁוֹפָר
  choice: नरसिंगा
  rationale: שׁוֹפָר फूँककर बजाया जाने वाला सींग का वाद्य है। ‘नरसिंगा’ आधुनिक हिन्दी में तुरहीनुमा सींग-वाद्य का स्वाभाविक और काव्यात्मक नाम है; उसके पारंपरिक मेढ़े के सींग से बने होने की जानकारी पादटिप्पणी में दी गई है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार-अक्षरी व्यक्तिगत नाम सीधे प्रयुक्त हुआ है। ‘याहवे’ उसे उपाधि से प्रतिस्थापित किए बिना प्रस्तुत करता है।
- issue: ऊपर जाने की भाषा में संभावित मसीही अनुगूँज
  choice: ऊपर गया है
  alternative: आरोहित हुआ है; चढ़ गया है
  rationale: भजन में परमेश्वर के राजत्व और विजयपूर्ण प्रतिष्ठापन का चित्र है। ‘ऊपर गया है’ इब्रानी बिंब और उसकी अस्पष्टता बनाए रखता है, पर बाद की किसी विशिष्ट मसीही व्याख्या को पाठ में नहीं थोपता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक रखी गई है। दोनों अर्ध-पंक्तियों में ‘के बीच’ की समानांतर संरचना इब्रानी काव्य-संतुलन को हिन्दी में उभारती है।
