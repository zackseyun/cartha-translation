lexical_decisions:
- source_word: יַדְבֵּר
  choice: अधीन करता है
  rationale: यहाँ हिफ़ील रूप का अर्थ बोलना नहीं, बल्कि किसी को अधीन करना है। अगली पंक्ति का ‘हमारे पाँवों तले’ वाला समानांतर प्रयोग इसी अर्थ की पुष्टि करता है।
- source_word: עַמִּים
  choice: जाति-जाति के लोगों
  rationale: बहुवचन עַמִּים अलग-अलग जनसमूहों को दर्शाता है। यह अभिव्यक्ति अगली पंक्ति के לְאֻמִּים (‘राष्ट्रों’) से शब्दगत भेद बनाए रखती है।
- source_word: תַּחְתֵּינוּ
  choice: हमारे अधीन
  rationale: मूलतः ‘हमारे नीचे’ का स्थान-सूचक रूपक यहाँ अधीनता व्यक्त करता है; स्वाभाविक हिन्दी में ‘हमारे अधीन’ वही आशय स्पष्ट रखता है।
- source_word: וּלְאֻמִּים
  choice: और राष्ट्रों को
  rationale: לְאֻמִּים के लिए ‘राष्ट्रों’ चुनने से पहले चरण के עַמִּים से भेद और काव्यात्मक समानांतरता दोनों बने रहते हैं।
- source_word: תַּחַת רַגְלֵינוּ
  choice: हमारे पाँवों तले
  rationale: यह विजय और अधीनता का सजीव रूपक है। ‘पाँवों तले’ हिन्दी में स्वाभाविक है और मूल बिंब को सुरक्षित रखता है।
theological_decisions:
- issue: विजय के वर्णन में कर्ता और सामूहिक वाणी
  choice: परमेश्वर कर्ता है, जो विभिन्न लोगों और राष्ट्रों को ‘हमारे’ अधीन करता है।
  alternative: इसे इस्राएल की सैन्य सफलता के विषय में एक सामान्य राजकीय कथन मानना।
  rationale: निकटवर्ती संदर्भ विजय और राजत्व का श्रेय परमेश्वर को देता है। अनुवाद प्रथम पुरुष बहुवचन और अधीनता के तीखे बिंब को बनाए रखता है, बिना बाद की किसी धर्मवैचारिक व्याख्या को जोड़ने के।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘जाति-जाति के लोगों’ और ‘राष्ट्रों’ से दोनों समानांतर इब्रानी संज्ञाओं का भेद रखा गया है; ‘पाँवों तले’ मूल काव्यात्मक विजय-बिंब को बनाए रखता है।
