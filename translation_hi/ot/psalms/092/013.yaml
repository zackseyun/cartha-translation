  yaml_path: translation/ot/psalms/092/013.yaml
  text: Planted in the house of Yahweh[b][a], they will flourish in the courts of our God.
translation:
  language: hi
  text: याहवे[a] के भवन में रोपे गए, वे हमारे परमेश्वर के आँगनों[b] में फलेंगे-फूलेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में परमेश्वर का व्यक्तिगत नाम ‘YHWH’ है।
    reason: alternative_reading
  - marker: b
    text: या ‘प्रांगनों’।
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁתוּלִים
  choice: रोपे गए लोग
  rationale: निष्क्रिय कृदंत का अर्थ ‘रोपे हुए/रोपे गए’ है। पिछले पद में वर्णित धर्मियों की ओर संकेत स्पष्ट करने के लिए हिन्दी में ‘लोग’ जोड़ा गया है, जबकि पौधे का रूपक सुरक्षित रखा गया है।
- source_word: בְּבֵית
  choice: के भवन में
  rationale: בַּיִת का मूल अर्थ ‘घर/भवन’ है और यहाँ यह उपासना-स्थान को सूचित करता है। ‘भवन’ अर्थ को मंदिर तक अनावश्यक रूप से सीमित किए बिना गरिमापूर्ण और स्वाभाविक है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय दिव्य नाम को उपाधि से बदलने के बजाय हिन्दी में उसके प्रचलित ध्वन्यात्मक रूप ‘याहवे’ से व्यक्त किया गया है।
- source_word: בְּחַצְרוֹת
  choice: के आँगनों में
  rationale: חָצֵר यहाँ उपासना-भवन से जुड़े खुले प्रांगणों को दर्शाता है। बहुवचन ‘आँगनों’ मूल रूप और भवन-संबंधी बिंब दोनों को सुरक्षित रखता है।
- source_word: אֱלֹהֵינוּ
  choice: हमारे परमेश्वर
  rationale: प्रथम पुरुष बहुवचन प्रत्यय सहित पद का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: יַפְרִיחוּ
  choice: फलेंगे-फूलेंगे
  rationale: פרח के हिफ़ील रूप में अंकुरित होने, खिलने और समृद्ध रूप से बढ़ने का भाव है। हिन्दी मुहावरा ‘फलेंगे-फूलेंगे’ जीवन्त उन्नति को सहजता से व्यक्त करते हुए वनस्पति-बिंब बनाए रखता है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में व्यक्तिगत दिव्य नाम सीधे आया है। ‘याहवे’ उसे उपाधि ‘प्रभु’ से प्रतिस्थापित नहीं करता और उपलब्ध इब्रानी उच्चारण-साक्ष्य के निकट रहता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘रोपे गए’ और ‘फलेंगे-फूलेंगे’ के द्वारा पद का वनस्पति-रूपक सुरक्षित है; समानांतर पदों ‘भवन’ और ‘आँगनों’ को भी स्पष्ट रखा गया है।
