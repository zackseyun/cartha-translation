lexical_decisions:
- source_word: טוֹב
  choice: अच्छा है
  rationale: यह विशेषण दोनों क्रियार्थक रूपों का मूल्यांकन करता है; हिन्दी में वाक्य के अंत में ‘अच्छा है’ स्वाभाविक और अर्थ की व्यापकता बनाए रखता है।
- source_word: לְהוֹדוֹת
  choice: धन्यवाद करना
  rationale: इस आराधना-संदर्भ में हिफ़ील रूप धन्यवाद देने को व्यक्त करता है और अगले खंड के संगीतमय स्तुतिगान से भेद बनाए रखता है।
- source_word: לַיהוָה
  choice: याहवे
  rationale: मूल पाठ में परमेश्वर का विशिष्ट वाचा-नाम יהוה है; उसे उपाधि से बदलने के बजाय लिप्यंतरित किया गया है।
- source_word: וּלְזַמֵּר
  choice: भजन गाना
  rationale: पिएल क्रिया संगीतमय स्तुति को सूचित करती है; ‘भजन गाना’ सहज हिन्दी है और वाद्य-संगत को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: לְשִׁמְךָ
  choice: आपके नाम का
  rationale: ‘नाम’ की मूल बाइबलीय अभिव्यक्ति और उसका प्रतिष्ठा तथा प्रकट पहचान से जुड़ा अर्थ सुरक्षित रखा गया है। हिन्दी में ‘नाम का भजन गाना’ अपेक्षाकृत स्वाभाविक है।
- source_word: עֶלְיוֹן
  choice: हे परमप्रधान
  rationale: यह परमेश्वर की उपाधि और सम्बोधन है; ‘हे’ सम्बोधन को स्पष्ट करता है और ‘परमप्रधान’ श्रेष्ठतम ऊँचाई की धारणा को सुरक्षित रखता है।
theological_decisions:
- issue: יהוה परमेश्वर के नाम का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: इब्रानी पाठ में चतुरक्षरीय विशिष्ट नाम सीधे आया है। ‘याहवे’ उसका प्रचलित विद्वत्तापरक लिप्यंतरण है और उसे केवल उपाधि में नहीं बदलता; पाठक-सहायता के लिए पादटिप्पणी दी गई है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी; काव्यात्मक समानांतरता बनाए रखते हुए ‘आप’ का आदरसूचक प्रयोग किया गया है। ‘हे परमप्रधान’ भजन-साहित्य के उपयुक्त ऊँचे, पर समझने योग्य सम्बोधन को बनाए रखता है।
