- source_word: חַסְדֶּךָ
  choice: तेरे अटल प्रेम
  rationale: חֶסֶד में प्रेम, कृपा और स्थायी निष्ठा का संयुक्त भाव है। ‘अटल प्रेम’ उसकी दृढ़ता और स्नेह को व्यक्त करता है, बिना ‘वाचा’ जैसे किसी ऐसे शब्द को जोड़ने के जो यहाँ प्रत्यक्ष नहीं है।
- source_word: וֶאֱמוּנָתְךָ
  choice: और तेरी विश्वासयोग्यता
  rationale: אֱמוּנָה यहाँ परमेश्वर की विश्वसनीयता और स्थिर निष्ठा को सूचित करता है। ‘विश्वासयोग्यता’ आधुनिक मानक हिन्दी में इस गुण को सटीक रूप से व्यक्त करती है।
- source_word: בַּלֵּילוֹת
  choice: रातों में
  rationale: इब्रानी संज्ञा बहुवचन है। ‘रातों में’ उस संख्या को सुरक्षित रखता है और बार-बार होने वाली रात्रिकालीन स्तुति की सम्भावना को खुला छोड़ता है।
