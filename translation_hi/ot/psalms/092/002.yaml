  rationale: ल उपसर्ग सहित यह infinitive पिछले पद के ‘भला है’ विचार को आगे बढ़ाता है। ‘बखान करना’ सार्वजनिक रूप से घोषित करने और प्रशंसा करने—दोनों भावों को स्वाभाविक काव्यात्मक हिन्दी में व्यक्त करता है।
