lexical_decisions:
- source_word: אִישׁ
  choice: मनुष्य
  rationale: यहाँ एकवचन पुल्लिंग प्रतिनिधि रूप है। ‘मनुष्य’ आधुनिक हिन्दी में स्वाभाविक है और काव्यात्मक समानांतरता में उपयुक्त बैठता है।
- source_word: בַּעַר
  choice: पशु-समान
  rationale: यह शब्द केवल जानकारी की कमी नहीं, बल्कि समझ में पशु-जैसी जड़ता और विवेकहीनता दर्शाता है। ‘पशु-समान’ उस रूपकात्मक बल को स्पष्ट रखता है।
- source_word: יֵדָע
  choice: नहीं जानता
  rationale: सामान्य क्रिया ידע का सीधा अर्थ यहाँ ज्ञान या बोध का अभाव है; ‘नहीं जानता’ सरल और स्रोत के निकट है।
- source_word: כְסִיל
  choice: मूर्ख
  rationale: यह ज्ञान-साहित्य का प्रचलित शब्द है, जिसमें बौद्धिक और नैतिक दोनों प्रकार की मूर्खता का भाव हो सकता है।
- source_word: יָבִין
  choice: नहीं समझता
  rationale: בין समझने या भेद पहचानने की क्षमता पर बल देता है। ‘नहीं समझता’ पहले पद के ‘नहीं जानता’ से निकट समानांतरता रखते हुए अर्थभेद भी बनाए रखता है।
- source_word: אֶת זֹאת
  choice: यह बात
  rationale: संकेतवाचक रूप आसपास के कथन की ओर इंगित करता है। हिन्दी में ‘यह बात’ अकेले ‘यह’ की अपेक्षा अधिक स्वाभाविक है; अंत का विराम-चिह्न अगले पद में इसकी व्याख्या की ओर संकेत करता है।
