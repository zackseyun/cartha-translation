  text: וַ/תָּ֣רֶם כִּ/רְאֵ֣ים קַרְנִ֑/י בַּ֝לֹּתִ֗י בְּ/שֶׁ֣מֶן רַעֲנָֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/092/010.yaml
  text: But you have exalted my horn like that of a wild ox[b][a]; I have been anointed with fresh oil.
translation:
  language: hi
  text: परन्तु तूने मेरे सींग को जंगली बैल के सींग के समान ऊँचा किया है[a]; मैं ताज़े तेल से अभिषिक्त हुआ हूँ[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्द ‘रेएम’ एक शक्तिशाली जंगली गोवंशी प्राणी को दर्शाता है, जिसे परम्परागत रूप से ‘जंगली बैल’ कहा गया है। कुछ पुराने अनुवादों में ‘एक-सींग वाला पशु’ मिलता है।
    reason: cultural_note
  - marker: b
    text: 'और अधिक शाब्दिक रूप में: ‘मैं ताज़े तेल से भिगोया, सींचा, या मिलाया गया हूँ।’ यहाँ प्रयुक्त इब्रानी क्रिया असामान्य है और उसके ठीक अर्थ पर मतभेद है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּרֶם
  choice: तूने...ऊँचा किया है
  rationale: रום का मूल भाव ऊँचा करना है। प्रसंग में कर्ता परमेश्वर है और एकवचन प्रत्यक्ष सम्बोधन को बनाए रखा गया है।
- source_word: כִּרְאֵים
  choice: जंगली बैल के सींग के समान
  rationale: רְאֵם एक शक्तिशाली जंगली गोवंशी प्राणी को सूचित करता है। हिन्दी में तुलना का सम्बन्ध ‘मेरे सींग’ से स्पष्ट करने के लिए ‘के सींग के समान’ कहा गया है।
- source_word: קַרְנִי
  choice: मेरे सींग को
  rationale: सींग शक्ति, प्रतिष्ठा और सामर्थ्य का काव्यात्मक प्रतीक है; मूल रूपक को ‘मेरी शक्ति’ कहकर व्याख्यायित नहीं किया गया।
- source_word: בַּלֹּתִי
  choice: मैं...अभिषिक्त किया गया हूँ
  rationale: तेल के साथ प्रयुक्त इस असामान्य क्रिया का प्रसंगानुकूल भाव तेल लगाए या सींचे जाने का है। सुबोध मुख्य पाठ में ‘अभिषिक्त’ रखा गया है, जबकि शाब्दिक अनिश्चितता पादटिप्पणी में दी गई है।
- source_word: בְּשֶׁמֶן רַעֲנָן
  choice: ताज़े तेल से
  rationale: רַעֲנָן यहाँ ताज़गी, सजीवता और भरपूरी का भाव देता है; तेल के साथ ‘ताज़ा’ स्वाभाविक हिन्दी है।
theological_decisions:
- issue: ‘सींग’ का रूपक
  choice: मूल ‘सींग’ रूपक को बनाए रखना
  alternative: मेरी शक्ति / मेरा सामर्थ्य
  rationale: इब्रानी कविता में सींग सामर्थ्य और प्रतिष्ठा का प्रतीक है। इसे सीधे अर्थ में बदलने से मूल काव्यात्मक और धर्मवैचारिक बनावट घट जाती।
- issue: בַּלֹּתִי का अर्थ
  choice: अभिषिक्त किया गया हूँ
  alternative: ताज़े तेल से भिगोया/सींचा गया हूँ; ताज़े तेल में मिलाया गया हूँ
  rationale: तेल का निकट प्रसंग ‘अभिषिक्त’ अर्थ को स्वाभाविक बनाता है, पर क्रिया दुर्लभ है और उसका ठीक सूक्ष्म अर्थ विवादित है; इसलिए विकल्प पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण काव्यात्मक रूप अपनाया गया है। परमेश्वर के लिए मूल इब्रानी के एकवचन सम्बोधन के अनुरूप ‘तू’ रखा गया है। ‘सींग’ का बाइबलीय रूपक सुरक्षित है और दुर्लभ क्रिया की अनिश्चितता पादटिप्पणी में स्पष्ट की गई है।
