base_translation:
  language: en
  yaml_path: translation/ot/psalms/092/004.yaml
  text: For you have made me glad[a], O Yahweh, by your work[b]; at the works of your hands I sing for joy.
translation:
  language: hi
  text: क्योंकि, हे यहोवा, तूने तेरे काम से मुझे आनन्दित किया है; तेरे हाथों के कामों पर मैं जयजयकार करता हूँ।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं आनन्द से गाता हूँ।” इब्रानी क्रिया उल्लासपूर्ण गायन या ऊँची आनन्द-पुकार—दोनों का अर्थ दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह आसपास की स्तुति का कारण बताता है और इब्रानी के कारणवाचक अर्थ को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: שִׂמַּחְתַּנִי
  choice: तूने मुझे आनन्दित किया है
  rationale: 'पिएल पूर्ण क्रिया और प्रथम पुरुष एकवचन प्रत्यय का कारणात्मक भाव व्यक्त होता है: ‘तूने मुझे आनन्दित किया।’ ‘किया है’ पूर्ण कार्य की वर्तमान प्रासंगिकता को भी दर्शाता है।'
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ में आए परमेश्वर के व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से प्रस्तुत किया गया है।
- source_word: בְּפָעֳלֶךָ
  choice: अपने काम से
  rationale: פֹּעַל का अर्थ काम या कार्य है; यहाँ בְּ को साधन अथवा कारण बताने वाला मानकर ‘से’ किया गया है। एकवचन ‘काम’ मूल की शैली को सुरक्षित रखता है।
- source_word: בְּמַעֲשֵׂי יָדֶיךָ
  choice: तेरे हाथों के कामों पर
  rationale: यह अनुवाद मूल के मूर्त मानव-सदृश मुहावरे ‘तेरे हाथों के काम’ को बनाए रखता है; ‘पर’ उन कामों को जयजयकार का अवसर या कारण बताता है।
- source_word: אֲרַנֵּן
  choice: मैं जयजयकार करता हूँ
  rationale: רנן उल्लासपूर्ण गायन या ऊँची आनन्द-ध्वनि दोनों व्यक्त कर सकता है। ‘जयजयकार करता हूँ’ इस व्यापकता को स्वाभाविक हिन्दी में रखता है; अपूर्ण क्रिया को प्रसंगानुसार वर्तमान परिणामात्मक अभिव्यक्ति माना गया है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल में व्यक्तिगत नाम सीधे प्रयुक्त हुआ है। ‘यहोवा’ आधुनिक हिन्दी बाइबल-पाठकों में पहचाना जाने वाला लिप्यंतरण है और इसे उपाधि ‘प्रभु’ से नहीं बदलता; ‘याहवे’ अधिक पुनर्निर्मित उच्चारण है।
- issue: אֲרַנֵּן में गायन और पुकार की अर्थ-व्याप्ति
  choice: मैं जयजयकार करता हूँ
  alternative: मैं आनन्द से गाता हूँ
  rationale: क्रिया उल्लासपूर्ण गायन या गूँजती आनन्द-पुकार दोनों का बोध करा सकती है। ‘जयजयकार’ किसी एक प्रकार की मुखर स्तुति तक अर्थ को अनावश्यक रूप से सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में काव्यात्मक, गरिमापूर्ण और सामान्य पाठक के लिए सहज शैली अपनाई गई है। परमेश्वर को संबोधित करते समय ‘तू/तेरे’ का पारंपरिक निकटतापूर्ण एकवचन रखा गया है। मूल के एकवचन ‘काम’ और बहुवचन ‘हाथों के कामों’ की शैलीगत भिन्नता सुरक्षित है।
