source:
  edition: WLC
  text: כִּ֤י הִנֵּ֪ה אֹיְבֶ֡י/ךָ יְֽהוָ֗ה כִּֽי הִנֵּ֣ה אֹיְבֶ֣י/ךָ יֹאבֵ֑דוּ יִ֝תְפָּרְד֗וּ כָּל פֹּ֥עֲלֵי אָֽוֶן׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/092/009.yaml
  text: For behold[a], your enemies, O Yahweh— for behold, your enemies will perish; all workers of wickedness will be scattered.
translation:
  language: hi
  text: 'क्योंकि देखो[a], हे याहवे, तुम्हारे शत्रु—

    क्योंकि देखो, तुम्हारे शत्रु नाश हो जाएँगे;

    दुष्कर्म करनेवाले सब लोग तितर-बितर हो जाएँगे।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सभी दुष्कर्म करनेवाले बिखर जाएँगे”; इब्रानी पदबंध का शाब्दिक अर्थ है, “अधर्म के काम करनेवाले सभी लोग।”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन से संबंध जोड़ते हुए कारणात्मक अथवा व्याख्यात्मक बल देता है; हिंदी में ‘क्योंकि’ इस संबंध को स्वाभाविक रूप से बनाए रखता है।
- source_word: הִנֵּה
  choice: देखो
  rationale: ध्यान आकर्षित करने और कथन पर जोर देने वाला भाव बनाए रखता है तथा आधुनिक हिंदी में बोधगम्य है।
- source_word: אֹיְבֶיךָ
  choice: तेरे शत्रु
  rationale: बहुवचन संज्ञा और परमेश्वर को संबोधित द्वितीय पुरुष एकवचन प्रत्यय का सीधा अनुवाद है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय ईश-नाम को हिंदी में प्रचलित विशिष्ट नाम ‘यहोवा’ से व्यक्त किया गया है, न कि उपाधि से।
- source_word: כִּי הִנֵּה ... כִּי הִנֵּה
  choice: क्योंकि देखो ... क्योंकि देखो
  rationale: मूल की जानबूझकर की गई पुनरावृत्ति को रखा गया है, क्योंकि यह काव्यात्मक जोर और निश्चितता बढ़ाती है।
- source_word: יֹאבֵדוּ
  choice: नाश हो जाएँगे
  rationale: אבד के विनाश अथवा समाप्त हो जाने के भाव को सहज, गंभीर हिंदी में व्यक्त करता है, बिना विनाश की रीति निर्धारित किए।
- source_word: יִתְפָּרְדוּ
  choice: तितर-बितर हो जाएँगे
  rationale: हित्पएल रूप के अलग-अलग हो जाने अथवा बिखर जाने के भाव को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: כָּל
  choice: सभी
  rationale: न्याय के व्यापक और समावेशी दायरे को सुरक्षित रखता है।
- source_word: פֹּעֲלֵי אָוֶן
  choice: अनर्थ करनेवाले
  rationale: इस मुहावरे का अर्थ बुराई या दुष्कर्म करने वाले लोग है; ‘अनर्थ करनेवाले’ काव्यात्मक, नैतिक रूप से गंभीर और सामान्य हिंदी पाठक के लिए सहज है।
theological_decisions:
- issue: ईश-नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में विशिष्ट ईश-नाम सीधे आया है। हिंदी में ‘यहोवा’ स्थापित और व्यापक रूप से पहचाना जाने वाला रूप है; इसे ‘प्रभु’ जैसी उपाधि से बदलने पर मूल का नाम-संबंधी भेद मिट जाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक रखी गई है। मूल की दोहरी ‘क्योंकि देखो’ संरचना तथा संबोधन के बाद का विराम सुरक्षित है। परमेश्वर से प्रत्यक्ष संबोधन के कारण ‘तेरे’ रखा गया है; यह यहाँ असम्मानसूचक नहीं, बल्कि इब्रानी एकवचन संबोधन का स्वाभाविक काव्यात्मक रूप है।
