  text: ע֭וֹד יְנוּב֣וּ/ן בְּ/שֵׂיבָ֑ה דְּשֵׁנִ֖ים וְ/רַֽעֲנַנִּ֣ים יִהְיֽוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/092/014.yaml
  text: They still bear fruit in old age[c][b][a]; they are full of sap and green.
translation:
  language: hi
  text: वे बुढ़ापे में भी फल देते हैं[a]; वे रस से भरपूर[b] और हरे-भरे रहते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वे बुढ़ापे में भी फल देते रहेंगे; वे रस से भरपूर और हरे-भरे रहेंगे।” हिब्रू क्रिया-रूपों का अनुवाद भविष्यकाल में भी किया जा सकता है।
    reason: alternative_reading
  - marker: b
    text: शाब्दिक रूप से, “पुष्ट”; वृक्ष के चित्र में यह भरपूर जीवन-रस और सजीवता का भाव देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עוֹד
  choice: भी
  rationale: यहाँ यह शब्द पहले से चली आ रही फलदायकता के बुढ़ापे तक बने रहने पर बल देता है; हिंदी में ‘बुढ़ापे में भी’ इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: יְנוּבוּן
  choice: फल लाते हैं
  rationale: क्रिया वनस्पति के फल देने या उपज देने का बोध कराती है और पिछले पदों के वृक्ष-रूपक को बनाए रखती है।
- source_word: בְּשֵׂיבָה
  choice: बुढ़ापे में
  rationale: संज्ञा का संबंध सफेद बालों से है, पर मुहावरे के रूप में इसका अर्थ वृद्धावस्था है; ‘बुढ़ापे में’ आधुनिक हिंदी में स्पष्ट और स्वाभाविक है।
- source_word: דְּשֵׁנִים
  choice: रस से भरे
  rationale: शाब्दिक अर्थ ‘पुष्ट/मोटे’ है, पर वृक्ष-रूपक में यह पोषण और जीवन-रस से भरपूर होने का संकेत देता है।
- source_word: רַעֲנַנִּים
  choice: हरे-भरे
  rationale: यह शब्द वनस्पति की ताज़गी, हरियाली और समृद्ध वृद्धि को व्यक्त करता है; ‘हरे-भरे’ हिंदी में इस चित्र को सहजता से रखता है।
- source_word: יִהְיוּ
  choice: रहते हैं
  rationale: हिब्रू अपूर्ण क्रिया-रूप को यहाँ धर्मियों के बारे में सामान्य और निरंतर सत्य के रूप में समझा गया है; ‘रहते हैं’ उस स्थायी दशा को व्यक्त करता है।
theological_decisions:
- issue: काव्यात्मक वर्णन में क्रिया-रूप का काल/पक्ष
  choice: 'अपूर्ण क्रिया-रूपों को सामान्य वर्तमान के रूप में प्रस्तुत किया गया है: ‘फल लाते हैं’ और ‘रहते हैं’।'
  alternative: 'इन्हें भविष्यकाल में भी अनूदित किया जा सकता है: ‘फल लाते रहेंगे’ और ‘रहेंगे’।'
  rationale: भजन में यह धर्मियों की वृक्ष-सदृश फलदायकता का सामान्य वर्णन है, केवल किसी एक भावी घटना की भविष्यवाणी नहीं। फिर भी हिब्रू अपूर्ण रूप भविष्यकालीन अर्थ की अनुमति देते हैं, इसलिए विकल्प को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘फल लाते हैं’ तथा ‘हरे-भरे’ पिछले पदों के वृक्ष-रूपक को स्पष्ट रखते हैं। अर्धविराम समानांतर काव्य-पंक्तियों को जोड़ता है, जबकि पद को स्वतंत्र पूर्ण वाक्य के रूप में समाप्त किया गया है।
