base_translation:
  language: en
  yaml_path: translation/ot/psalms/092/000.yaml
  text: A psalm[a], a song for the Sabbath day.
translation:
  language: hi
  text: एक भजन, सब्त के दिन के लिए एक गीत।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “एक भजन, सब्त के दिन का एक गीत।”
    reason: לְ उपसर्ग को प्रयोजन (‘के लिए’) के बजाय संबंध (‘का’) के रूप में भी समझा जा सकता है।
lexical_decisions:
- source_word: מִזְמוֹר
  choice: भजन
  rationale: यह भजन-संग्रह के शीर्षकों में प्रयुक्त संगीतमय रचना का सामान्य शब्द है; हिन्दी में ‘भजन’ इसका स्वाभाविक और प्रचलित समतुल्य है।
- source_word: שִׁיר
  choice: गीत
  rationale: इस सामान्य इब्रानी शब्द का अर्थ ‘गीत’ है। इसे מִזְמוֹר से अलग रखा गया है ताकि शीर्षक में आए दोनों संज्ञा-पद सुरक्षित रहें।
- source_word: לְיוֹם
  choice: दिन के लिए
  rationale: לְ उपसर्ग यहाँ प्रयोजन या संबंध बता सकता है। ‘दिन के लिए’ शीर्षक के उपयोग-संबंधी अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הַשַּׁבָּת
  choice: सब्त
  rationale: यह निश्चित रूप से विश्राम के नियत सातवें दिन को सूचित करता है। ‘सब्त’ बाइबलीय हिन्दी में इस विशिष्ट दिन का स्पष्ट और संक्षिप्त नाम है।
theological_decisions:
- issue: पद का काव्य-पंक्ति के बजाय शीर्षक होना
  choice: 'इसे संज्ञात्मक शीर्षक के रूप में प्रस्तुत किया गया है: ‘एक भजन, सब्त के दिन के लिए एक गीत।’'
  alternative: इसे बिना शीर्षकीय विराम के पहली काव्य-पंक्ति मानना
  rationale: इब्रानी पाठ में कोई सीमित क्रिया नहीं है और इसकी रचना भजन-संग्रह के शीर्षकों जैसी है; शीर्षक के रूप में अनुवाद करने से पाठ का साहित्यिक कार्य सुरक्षित रहता है।
- issue: לְיוֹם द्वारा व्यक्त प्रयोजन या संबंध
  choice: ‘सब्त के दिन के लिए’
  alternative: ‘सब्त के दिन का’
  rationale: उपसर्ग לְ प्रयोजन अथवा संबंध दोनों व्यक्त कर सकता है। मुख्य पाठ में उपयोग या नियोजन का स्वाभाविक अर्थ रखा गया है, जबकि संबंधसूचक संभावना पाद-टिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और शीर्षकानुकूल रखी गई है। ‘भजन’ और ‘गीत’ दोनों को बनाए रखकर इब्रानी के युग्मित पदों को अनावश्यक रूप से एक नहीं किया गया है।
