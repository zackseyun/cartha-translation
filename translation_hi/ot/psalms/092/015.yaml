source:
  edition: WLC
  text: לְ֭/הַגִּיד כִּֽי יָשָׁ֣ר יְהוָ֑ה צ֝וּרִ֗/י וְֽ/לֹא עלת/ה בּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/092/015.yaml
  text: to declare that Yahweh is upright; he is my rock[a], and there is no unrighteousness in him.
translation:
  language: hi
  text: यह घोषित करने के लिए कि याहवे सीधा है; वह मेरी चट्टान है, और उसमें कोई अधर्म नहीं है[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, अन्याय।
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהַגִּיד
  choice: यह घोषित करने के लिए
  rationale: पूर्ववर्ती संदर्भ से जुड़ा यह उद्देश्यसूचक रूप है; ‘घोषित करना’ सार्वजनिक रूप से बताने के भाव को स्वाभाविक हिंदी में बनाए रखता है।
- source_word: כִּי
  choice: कि
  rationale: यहाँ यह कारण नहीं, बल्कि घोषित की जाने वाली बात का परिचय देता है।
- source_word: יָשָׁר
  choice: सीधा
  rationale: ‘सीधा’ मूल शब्द की नैतिक सत्यनिष्ठा और उसके ठोस ‘सीधापन’ दोनों को बचाता है; ‘धर्मी’ अपेक्षाकृत अधिक व्याख्यात्मक होता।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को उपाधि से बदलने के बजाय हिंदी में प्रचलित लिप्यंतरण द्वारा रखा गया है।
- source_word: צוּרִי
  choice: मेरी चट्टान
  rationale: यह परमेश्वर की स्थिरता और सुरक्षा का ठोस भजन-साहित्यिक रूपक है, इसलिए इसे ‘शरण’ जैसे व्याख्यात्मक शब्द से नहीं बदला गया।
- source_word: עַוְלָתָה
  choice: अन्याय
  rationale: यह संज्ञा अन्याय, कुटिलता या नैतिक गलत बात को दर्शाती है; ‘अन्याय’ आधुनिक हिंदी में स्पष्ट है और परमेश्वर की न्यायशीलता पर बल देता है।
- source_word: בּוֹ
  choice: उसमें
  rationale: यह परमेश्वर में किसी नैतिक दोष के न होने को स्वाभाविक और निकट रूप से व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: पद में व्यक्तिगत ईश्वरीय नाम सीधे प्रयुक्त है। हिंदी पाठकों के लिए व्यापक रूप से पहचाना जाने वाला ‘यहोवा’ रखा गया है, यद्यपि ‘याहवे’ संभावित प्राचीन उच्चारण के अधिक निकट माना जाता है।
- issue: יָשָׁר का नैतिक वर्णन
  choice: सीधा
  alternative: धर्मी / न्यायी
  rationale: ‘सीधा’ मूल रूपक और व्यापक नैतिक अर्थ को सुरक्षित रखता है, जबकि ‘न्यायी’ अर्थ को न्यायिक क्षेत्र तक सीमित कर सकता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। पद की काव्यात्मक समानांतरता और ‘चट्टान’ का मूल रूपक सुरक्षित है।
