  text: The righteous flourishes like the palm tree[b][a]; he grows like a cedar in Lebanon.
translation:
  language: hi
  text: धर्मी खजूर के पेड़ के समान फूले-फलेगा; वह लबानोन में देवदार के समान बढ़ेगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: צַדִּיק
  choice: धर्मी
  rationale: एकवचन पुल्लिंग विशेषण यहाँ संज्ञा के रूप में प्रयुक्त है। ‘धर्मी’ हिंदी में स्वाभाविक है और प्रतिनिधिक एकवचन को बनाए रखता है।
- source_word: כַּתָּמָר
  choice: खजूर के पेड़ के समान
  rationale: תמר खजूर अथवा खजूर के पेड़ को सूचित करता है; यह चयन वृक्ष की उपमा को आधुनिक हिंदी में स्पष्ट रखता है।
- source_word: יִפְרָח
  choice: फूले-फलेगा
  rationale: פרח का मूल भाव अंकुरित या पुष्पित होना और विस्तार से फलना-फूलना है। ‘फूले-फलेगा’ काव्यात्मक वृद्धि और समृद्धि दोनों को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: כְּאֶרֶז
  choice: देवदार के समान
  rationale: यह देवदार वृक्ष से तुलना है; हिंदी में ‘देवदार के समान’ सहज और स्पष्ट है।
- source_word: בַּלְּבָנוֹן
  choice: लबानोन के
  rationale: मूल में ב का सामान्य अर्थ ‘में’ है, पर हिंदी में ‘लबानोन का देवदार’ प्रसिद्ध स्थान से संबद्ध वृक्ष की स्वाभाविक अभिव्यक्ति है; पादटिप्पणी अधिक शाब्दिक स्थानवाचक रूप देती है।
- source_word: יִשְׂגֶּה
  choice: बढ़ेगा
  rationale: क्रिया जोरदार वृद्धि, बढ़ने या महान होने का भाव देती है। ‘बढ़ेगा’ अर्थ की व्यापकता बनाए रखता है और देवदार की उपमा के साथ सहज है।
