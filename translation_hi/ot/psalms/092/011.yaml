translation_notes:
  register: आधुनिक मानक हिंदी का गरिमापूर्ण काव्यात्मक गद्य रखा गया है। स्रोत का एकवचन ‘आँख’, बहुवचन ‘कान’, और देखने-सुनने का समानांतर विन्यास सुरक्षित है। ‘की बात’ हिंदी में सुनने के निहित विषय को सहज बनाता है, बिना यह तय किए कि वक्ता ने उनके कौन-से शब्द, समाचार या अंत का वृत्तांत सुना।
