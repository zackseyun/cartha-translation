  yaml_path: translation/ot/psalms/092/011.yaml
  text: My eye has looked on my foes[b][a]; my ears hear of the evildoers who rise against me.
translation:
  language: hi
  text: मेरी आँख ने मेरे शत्रुओं को देखा है[a]; मेरे विरुद्ध उठनेवाले कुकर्मियों के विषय में मेरे कानों ने सुना है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरी आँख ने मुझ पर निगाह रखनेवालों को देखा है”; इब्रानी पद अधिक शाब्दिक रूप से शत्रुभाव से ताकने या निगरानी करनेवालों के लिए हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “मेरे कान सुनते हैं” अथवा “मेरे कान सुनेंगे”; इब्रानी क्रियारूप के काल-पक्ष को इस प्रसंग में एक से अधिक प्रकार से समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּבֵּט
  choice: देखा है
  rationale: נבט का मूल अर्थ ‘देखना/दृष्टि डालना’ है। काव्य-संदर्भ में पूर्ण हुई क्रिया की वर्तमान प्रासंगिकता व्यक्त करने के लिए ‘देखा है’ स्वाभाविक है; इसमें विजय या संतोष का भाव अनावश्यक रूप से नहीं जोड़ा गया।
- source_word: עֵינִי
  choice: मेरी आँख
  rationale: इब्रानी संज्ञा एकवचन है; हिंदी काव्य में ‘मेरी आँख’ स्रोत की एकवचन छवि और समानांतर रचना को सुरक्षित रखती है।
- source_word: בְּשׁוּרָי
  choice: मेरे शत्रुओं को
  rationale: यह दुर्लभ पद देखने या ताक लगानेवालों को सूचित कर सकता है, पर संदर्भ में वे विरोधी हैं। ‘शत्रुओं’ से वैरभाव स्पष्ट और स्वाभाविक ढंग से व्यक्त होता है; अधिक शाब्दिक संभावना पादटिप्पणी में रखी गई है।
- source_word: בַּקָּמִים עָלַי
  choice: मेरे विरुद्ध उठनेवाले
  rationale: קום के साथ עלי विरोध में उठ खड़े होने की इब्रानी छवि देता है। हिंदी में ‘मेरे विरुद्ध उठनेवाले’ उस रूपक और शत्रुतापूर्ण अर्थ दोनों को बनाए रखता है।
- source_word: מְרֵעִים
  choice: कुकर्मी
  rationale: רעע का हिफ़ील कृदंत बुराई या हानि करनेवालों को दर्शाता है। ‘कुकर्मी’ संक्षिप्त, वर्तमान मानक हिंदी में समझने योग्य और नैतिक आशययुक्त है।
- source_word: תִּשְׁמַעְנָה אָזְנָי
  choice: मेरे कानों ने सुनी है
  rationale: क्रिया स्त्रीलिंग बहुवचन ‘कानों’ के अनुरूप है। यहाँ पूर्ण/भविष्यगत पहलू की व्याख्या संभव है; ‘ने सुनी है’ निकट संदर्भ में पूर्ण हुई सुनवाई को स्वाभाविक हिंदी में व्यक्त करता है और काव्यात्मक अंग-व्यक्तिकरण बनाए रखता है।
