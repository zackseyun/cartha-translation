id: PSA.92.7
reference: Psalms 92:7
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: בִּ/פְרֹ֤חַ רְשָׁעִ֨ים כְּמ֥וֹ עֵ֗שֶׂב וַ֭/יָּצִיצוּ כָּל פֹּ֣עֲלֵי אָ֑וֶן לְ/הִשָּֽׁמְדָ֥/ם עֲדֵי עַֽד׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/092/007.yaml
  text: When the wicked sprout like grass and all workers of wickedness flourish[b][a], it is so that they may be destroyed forever.
translation:
  language: hi
  text: जब दुष्ट घास के समान उग आते हैं और सब कुकर्मी फलते-फूलते हैं, तो यह इसलिए होता है कि वे सदा के लिए नष्ट हो जाएँ।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वे केवल सदा के लिए नष्ट होने को फलते-फूलते हैं।”
    reason: לְהִשָּׁמְדָם को उद्देश्य, परिणाम अथवा अधिक संक्षिप्त गंतव्य-वाचक रूप में समझा जा सकता है।
lexical_decisions:
- source_word: בִּפְרֹחַ
  choice: जब ... उग आते हैं
  rationale: בְּ के साथ infinitive construct यहाँ समयसूचक परिस्थिति बताता है। ‘जब ... उग आते हैं’ स्वाभाविक हिन्दी है और साथ आने वाली घास की उपमा को बनाए रखता है।
- source_word: רְשָׁעִים
  choice: दुष्ट
  rationale: यह बहुवचन विशेषण संज्ञा के रूप में दुष्ट लोगों के वर्ग को दर्शाता है; ‘दुष्ट’ संक्षिप्त और स्वाभाविक हिन्दी है।
- source_word: כְּמוֹ עֵשֶׂב
  choice: घास के समान
  rationale: עֵשֶׂב का सामान्य अर्थ घास या हरियाली है। ‘घास के समान’ शीघ्र बढ़ने, पर अस्थायी रहने की काव्यात्मक छवि सुरक्षित रखता है।
- source_word: וַיָּצִיצוּ
  choice: फलते-फूलते हैं
  rationale: צוץ का संबंध अंकुरित होने, खिलने या फलने-फूलने से है। समानांतर वनस्पति-बिंब में ‘फलते-फूलते’ उनकी दिखाई देने वाली समृद्धि को सहज हिन्दी में व्यक्त करता है।
- source_word: כָּל פֹּעֲלֵי אָוֶן
  choice: सब कुकर्मी
  rationale: शाब्दिक रचना ‘अनर्थ/दुष्टता करने वाले सभी’ है। ‘सब कुकर्मी’ अर्थ और नैतिक बल को संक्षिप्त, वर्तमान और सुबोध हिन्दी में व्यक्त करता है।
- source_word: לְהִשָּׁמְדָם
  choice: यह इसलिए होता है कि वे ... नष्ट हो जाएँ
  rationale: שׁמד का निफ़अल infinitive construct तीसरे पुरुष बहुवचन प्रत्यय के साथ निष्क्रिय अर्थ देता है; לְ उद्देश्य अथवा परिणाम का संबंध प्रकट कर सकता है। मुख्य पाठ इसे स्पष्ट हिन्दी में व्यक्त करता है, जबकि पादटिप्पणी संभावित संक्षिप्त पाठ देती है।
- source_word: עֲדֵי עַד
  choice: सदा के लिए
  rationale: यह मुहावरा स्थायी निरंतरता दर्शाता है; ‘सदा के लिए’ आधुनिक हिन्दी में स्पष्ट और गरिमापूर्ण है।
theological_decisions:
- issue: क्या दुष्टों का फलना-फूलना केवल अस्थायी समृद्धि का वर्णन है, या उसे उनके अंतिम विनाश से उद्देश्य/परिणाम के रूप में जोड़ा गया है
  choice: तो यह इसलिए होता है कि वे सदा के लिए नष्ट हो जाएँ
  alternative: केवल सदा के लिए नष्ट होने को
  rationale: इब्रानी לְהִשָּׁמְדָם दुष्टों के फलने-फूलने को उनके अंतिम विनाश से जोड़ता है। अनुवाद उद्देश्य/परिणाम का तनाव बनाए रखता है, पर इब्रानी में अनुपस्थित किसी स्पष्ट कर्ता—जैसे परमेश्वर—को नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, काव्यात्मक किंतु सामान्य पाठक के लिए सहज रखी गई है। ‘घास के समान’ मूल वनस्पति-बिंब को और ‘फलते-फूलते’ समानांतर काव्य-लय को बनाए रखता है।
