  yaml_path: translation/ot/psalms/092/008.yaml
  text: But you are on high forever[a], O Yahweh.
translation:
  language: hi
  text: परन्तु हे याहवे, आप सदा ऊँचाई पर हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אַתָּה
  choice: परन्तु ... आप
  rationale: संयोजक וְ और स्वतंत्र सर्वनाम אַתָּה पिछले पद में दुष्टों के नाश के विपरीत यहोवा की स्थायी उच्चता पर बल देते हैं; इसलिए प्रसंग में विरोधसूचक ‘परन्तु’ स्वाभाविक है।
- source_word: מָרוֹם
  choice: ऊँचे पर विराजमान
  rationale: מָרוֹם ऊँचाई अथवा ऊँचे स्थान/स्थिति को सूचित करता है। ‘ऊँचे पर’ इसके स्थानिक-रूपक अर्थ को बनाए रखता है, और ‘विराजमान हैं’ हिन्दी में इस क्रियारहित उपवाक्य को गरिमापूर्ण तथा स्वाभाविक बनाता है।
- source_word: לְ/עֹלָם
  choice: सदा
  rationale: यह पदबंध निरन्तर और अनन्त स्थायित्व व्यक्त करता है; ‘सदा’ संक्षिप्त, सहज और काव्यात्मक हिन्दी है।
- source_word: יְהוָה
  choice: हे यहोवा
  rationale: मूल में परमेश्वर का विशिष्ट नाम सीधे सम्बोधन में है। ‘हे यहोवा’ नाम को शीर्षक से प्रतिस्थापित किए बिना हिन्दी में सम्बोधन स्पष्ट करता है।
theological_decisions:
- issue: सीधे सम्बोधन में יְהוָה का अनुवाद
  choice: हे यहोवा
  alternative: हे प्रभु
  rationale: इब्रानी पाठ में चार-अक्षरीय व्यक्तिगत नाम है, केवल ‘प्रभु’ की उपाधि नहीं। ‘यहोवा’ हिन्दी बाइबलीय परम्परा में पहचाना जाने वाला रूप है और मूल में उपस्थित नाम को बनाए रखता है।
- issue: מָרוֹם को उपाधि मानना या अवस्था/स्थान
  choice: ऊँचे पर विराजमान
  alternative: परमप्रधान
  rationale: यहाँ מָרוֹם को निश्चित रूप से ‘परमप्रधान’ की उपाधि बनाने के बजाय ऊँची स्थिति का कथन समझना अधिक प्रत्यक्ष है; इससे मूल का स्थानिक-रूपक तनाव सुरक्षित रहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण भजनात्मक शैली। आदरसूचक ‘आप’ और बहुवचन क्रिया हिन्दी में परमेश्वर के सीधे सम्बोधन के लिए स्वाभाविक हैं। किसी पादटिप्पणी की आवश्यकता नहीं है।
