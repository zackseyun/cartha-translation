lexical_decisions:
- source_word: מַה גָּדְלוּ
  choice: कितने महान हैं
  rationale: यहाँ מַה प्रश्न नहीं, विस्मय और प्रशंसा व्यक्त करता है; हिन्दी में ‘कितने महान हैं!’ स्वाभाविक उद्गार है। गָּדְלוּ को इस काव्यात्मक संदर्भ में स्थितिवाचक रूप से लिया गया है।
- source_word: מַעֲשֶׂיךָ
  choice: तेरे काम
  rationale: מַעֲשֶׂה परमेश्वर के कार्यों या कृत्यों के व्यापक अर्थ को व्यक्त करता है। ‘काम’ सरल आधुनिक हिन्दी है और सृष्टि तथा इतिहास में किए गए कार्यों—दोनों को समेट सकता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित नामरूप ‘यहोवा’ से प्रस्तुत किया गया है।
- source_word: מְאֹד עָמְקוּ
  choice: अत्यन्त गहरे हैं
  rationale: מְאֹד तीव्रता बताता है और עָמְקוּ यहाँ स्थितिवाचक है। ‘अत्यन्त गहरे हैं’ अर्थ को स्पष्ट तथा गरिमापूर्ण हिन्दी में रखता है।
- source_word: מַחְשְׁבֹתֶיךָ
  choice: तेरे विचार
  rationale: מַחְשָׁבָה का अर्थ विचार, योजनाएँ या उद्देश्य हो सकता है। ‘विचार’ सबसे सीधा और व्यापक विकल्प है; अन्य सम्भव अर्थ पादटिप्पणी में सुरक्षित हैं।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम है, इसलिए उसे ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित नहीं किया गया। आधुनिक हिन्दी पाठकों में अधिक पहचाने जाने वाले लिप्यंतरण ‘यहोवा’ को चुना गया, जबकि ‘याहवे’ वैकल्पिक विद्वत्तापूर्ण पुनर्निर्माण है।
- issue: מַחְשְׁבֹתֶיךָ की अर्थ-व्याप्ति
  choice: विचार
  alternative: योजनाएँ या उद्देश्य
  rationale: पद ईश्वर की बुद्धि और अभिप्राय के बीच भेद को स्पष्ट नहीं करता। ‘विचार’ इस व्यापकता और सम्भावित धार्मिक तनाव को बनाए रखता है; पादटिप्पणी अन्य अर्थ बताती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, काव्यात्मक और श्रद्धापूर्ण शैली। प्रत्यक्ष सम्बोधन के अनुरूप एकवचन आत्मीय ‘तेरे’ रखा गया है; विस्मयादिबोधक चिह्न पहले खंड के प्रशंसात्मक उद्गार को स्पष्ट करता है।
