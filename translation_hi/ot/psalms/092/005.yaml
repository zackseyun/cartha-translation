  yaml_path: translation/ot/psalms/092/005.yaml
  text: How great are your works[a], O Yahweh; your thoughts are very deep.
translation:
  language: hi
  text: हे याहवे, तेरे काम कितने महान हैं! तेरे विचार[a] अत्यन्त गहरे हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “योजनाएँ” अथवा “उद्देश्य”।
