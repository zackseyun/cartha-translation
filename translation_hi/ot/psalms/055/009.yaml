  text: בַּלַּ֣ע אֲ֭דֹנָ/י פַּלַּ֣ג לְשׁוֹנָ֑/ם כִּֽי רָאִ֨יתִי חָמָ֖ס וְ/רִ֣יב בָּ/עִֽיר־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/009.yaml
  text: Confuse them[a], Lord; divide their speech[b], for I have seen violence and strife in the city.
translation:
  language: hi
  text: हे प्रभु, उन्हें उलझा दे[a]; उनकी भाषा बाँट दे[b], क्योंकि मैंने नगर में हिंसा और झगड़ा देखा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हे प्रभु, उन्हें निगल ले,” अथवा “उन्हें नष्ट कर दे।” हिब्रू क्रिया का शाब्दिक अर्थ विनाशकारी हो सकता है, पर यहाँ इसका आशय उन्हें उलझाकर उनकी योजनाएँ विफल करना भी हो सकता है।
    reason: alternative_reading
  - marker: b
    text: शाब्दिक रूप से, “उनकी जीभ को बाँट दे”; अर्थात उनकी आपसी बातचीत या एक-दूसरे को समझने की क्षमता भंग कर दे।
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּלַּע
  choice: उन्हें उलझा दे
  rationale: क्रिया का मूल अर्थ प्रायः ‘निगल लेना’ है, और विनाश का भाव भी संभव है; पर अगले समानांतर आदेश ‘उनकी वाणी में फूट डाल दे’ के संदर्भ में यहाँ उनकी आपसी समझ और योजनाओं को विफल करने का भाव स्वाभाविक है। संभावित शाब्दिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: אֲדֹנָי
  choice: हे प्रभु
  rationale: यह परमेश्वर की उपाधि ‘प्रभु’ है; सम्बोधन के कारण हिन्दी में ‘हे प्रभु’ स्वाभाविक है।
- source_word: פַּלַּג
  choice: फूट डाल दे
  rationale: आदेशात्मक क्रिया का अर्थ ‘बाँट देना’ या ‘विभाजित करना’ है। वाणी के संदर्भ में ‘फूट डाल दे’ उनके संवाद और एकता को भंग करने का अर्थ सहजता से व्यक्त करता है।
- source_word: לְשׁוֹנָם
  choice: उनकी वाणी
  rationale: शाब्दिक अर्थ ‘उनकी जीभ’ है, पर यहाँ जीभ भाषा या वाणी का लाक्षणिक संकेत है। ‘वाणी’ काव्यात्मक गरिमा और संप्रेषण के भाव—दोनों को बनाए रखती है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह प्रार्थना का कारण प्रस्तुत करता है।
- source_word: רָאִיתִי
  choice: मैंने ... देखा है
  rationale: 'पूर्ण क्रिया को हिन्दी का पूर्ण वर्तमान रूप ठीक प्रकार व्यक्त करता है: भजनकार का किया हुआ अवलोकन वर्तमान विनती का आधार है।'
- source_word: חָמָס
  choice: हिंसा
  rationale: यह शब्द हिंसा, क्रूरता या हिंसक अन्याय को सूचित करता है; यहाँ ‘हिंसा’ सबसे स्पष्ट और सशक्त विकल्प है।
- source_word: וְרִיב
  choice: और झगड़ा
  rationale: शब्द विवाद, कलह या संघर्ष को दर्शाता है। ‘झगड़ा’ साधारण आधुनिक पाठक के लिए सहज है और ‘हिंसा’ के साथ स्वाभाविक युग्म बनाता है।
- source_word: בָּעִיר
  choice: नगर में
  rationale: यह सीधा स्थानवाचक पद है। हिन्दी काव्यात्मक गद्य में ‘नगर में’ स्वाभाविक और गरिमापूर्ण है।
theological_decisions:
- issue: आरम्भिक आदेश בַּלַּע का अर्थ और अगले आदेश ‘उनकी वाणी में फूट डाल दे’ से उसका संबंध
  choice: मुख्य पाठ में शत्रुओं को उलझाने और उनकी सामूहिक योजना विफल करने की विनती
  alternative: ‘उन्हें निगल ले’ अथवा ‘उन्हें नष्ट कर दे’
  rationale: अगले समानांतर वाक्य में वाणी को बाँटने की माँग है, इसलिए संचार और एकता को भंग करने का अर्थ संदर्भ में उपयुक्त है और बाबेल-सदृश प्रतिध्वनि संभव है। फिर भी हिब्रू क्रिया का अधिक शाब्दिक विनाशकारी अर्थ वास्तविक संभावना है, इसलिए उसे पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में प्रार्थनात्मक, काव्यात्मक और गरिमापूर्ण शैली रखी गई है। ‘हे प्रभु’ और एकवचन निकट सम्बोधन के आदेशात्मक रूप भजन की सीधी विनती को व्यक्त करते हैं। मुख्य पाठ सहज है, जबकि हिब्रू की वास्तविक अर्थगत अनिश्चितता पादटिप्पणियों में स्पष्ट रखी गई है।
