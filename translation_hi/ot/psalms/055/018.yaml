  to: उसने मेरे प्राण को मेरे विरुद्ध छिड़े युद्ध से शांति में छुड़ा लिया है[a], क्योंकि बहुत से लोग मेरे साथ थे।
  rationale: Only the rendering of בְּשָׁלוֹם is adjusted, from ‘शान्ति के साथ’ to ‘शांति में,’ for closer semantic correspondence and more natural Hindi. The footnote is lightly clarified to identify the entire final phrase, rather than merely its last words, as the locus of the alternative interpretation. The ambiguity of עִמָּדִי (‘with me’) remains in the main text.
