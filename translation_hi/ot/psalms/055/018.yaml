source:
  edition: WLC
  text: פָּ֘דָ֤ה בְ/שָׁל֣וֹם נַ֭פְשִׁ/י מִ/קֲּרָב לִ֑/י כִּֽי בְ֝/רַבִּ֗ים הָי֥וּ עִמָּדִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/018.yaml
  text: He has redeemed my soul in peace from the battle against me[a], for many were with me.
translation:
  language: hi
  text: उसने मेरे प्राण को मेरे विरुद्ध छिड़े युद्ध से शांति में छुड़ा लिया है[a], क्योंकि बहुत से लोग मेरे साथ थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसने मेरे प्राण को मेरे विरुद्ध छिड़े युद्ध से कुशलपूर्वक छुड़ा लिया है, क्योंकि बहुत से लोग मेरे विरुद्ध थे।” इब्रानी के अंतिम पदबंध का शाब्दिक अर्थ है, “क्योंकि बहुत से लोग मेरे साथ थे,” पर प्रसंग में इसे बहुत से विरोधियों के लिए भी समझा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: פָּדָה
  choice: छुड़ा लिया है
  rationale: क्रिया פדה मूल्य देकर छुड़ाने अथवा संकट से मुक्त करने का बोध देती है। यहाँ ‘छुड़ा लिया है’ स्वाभाविक हिन्दी में पूर्ण हुई उद्धारकारी कार्रवाई को व्यक्त करता है।
- source_word: בְשָׁלוֹם
  choice: शान्ति के साथ
  rationale: שָׁלוֹם में शान्ति, कुशल और सुरक्षित पूर्णता का भाव है। ‘शान्ति के साथ’ मूल पूर्वसर्गीय रचना और उसकी व्यापक अर्थ-सीमा को बनाए रखता है।
- source_word: נַפְשִׁי
  choice: मेरे प्राण को
  rationale: נֶפֶשׁ व्यक्ति, जीवन या प्राण का द्योतक हो सकता है। काव्यात्मक हिन्दी में ‘मेरे प्राण’ मूल मुहावरे को बनाए रखते हुए सहज है।
- source_word: מִקֲּרָב לִי
  choice: मेरे विरुद्ध छिड़े युद्ध से
  rationale: קְרָב युद्ध या संग्राम है और לִי को इस संघर्षपूर्ण सन्दर्भ में ‘मेरे विरुद्ध’ समझना स्वाभाविक है। ‘छिड़े’ हिन्दी में सम्बन्ध स्पष्ट करता है, पर सैन्य बिम्ब को नहीं मिटाता।
- source_word: כִּי
  choice: क्योंकि
  rationale: כִּי पिछले कथन का कारण अथवा स्पष्टीकरण प्रस्तुत करता है; ‘क्योंकि’ आधुनिक हिन्दी में यह सम्बन्ध स्पष्ट करता है।
- source_word: בְרַבִּים הָיוּ
  choice: बहुत-से लोग थे
  rationale: इस पदबंध का आशय संख्या की बहुलता है। ‘बहुत-से लोग’ हिन्दी में स्वाभाविक रूप से उस बहुवचन समूह को व्यक्त करता है।
- source_word: עִמָּדִי
  choice: मेरे साथ
  rationale: עִמָּדִי का सीधा अर्थ ‘मेरे साथ’ है। मुख्य पाठ में इसे बनाए रखने से मूल की वास्तविक प्रासंगिक अस्पष्टता बनी रहती है।
theological_decisions:
- issue: अन्तिम उपवाक्य בְרַבִּים הָיוּ עִמָּדִי का अर्थ
  choice: क्योंकि बहुत-से लोग मेरे साथ थे
  alternative: क्योंकि बहुत-से लोग मेरे विरुद्ध थे
  rationale: עִמָּדִי सामान्यतः ‘मेरे साथ’ है, यद्यपि युद्ध के सन्दर्भ में पूरे पदबंध को अनेक विरोधियों की ओर संकेत मानना सम्भव है। मुख्य पाठ स्रोत की सीधी अभिव्यक्ति और तनाव को रखता है; प्रसंगानुकूल विरोधात्मक अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण काव्यात्मक गद्य। ‘प्राण’, ‘शान्ति’ और ‘युद्ध’ भजन की ऊँची शैली तथा मूल बिम्बों को बनाए रखते हैं; अन्तिम उपवाक्य की अस्पष्टता मुख्य पाठ और पादटिप्पणी के माध्यम से सुरक्षित है।
