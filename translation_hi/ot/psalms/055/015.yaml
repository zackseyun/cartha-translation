  text: Let death come upon them[a]; let them go down alive to Sheol, for evil is in their dwelling[d][c][b], in their midst.
translation:
  language: hi
  text: मृत्यु उन पर आ पड़े[a]; वे जीवित ही शिओल[b] में उतर जाएँ, क्योंकि उनके निवास में[c], उनके बीच में[d], बुराई है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या सम्भवतः, “विनाश उन पर आ पड़े,” अथवा “मृत्यु अचानक उन पर आ पड़े।” आरम्भिक इब्रानी शब्द कठिन है और उसका ठीक भाव अनिश्चित है।
    reason: textual_variant
  - marker: b
    text: ‘शिओल’ मृतकों के लोक के लिए प्रयुक्त इब्रानी शब्द है; या “कब्र।”
    reason: lexical_alternative
  - marker: c
    text: या “उनके बसेरे में”; सम्भवतः “उनके परदेश-निवास में।”
    reason: lexical_alternative
  - marker: d
    text: या “उनके भीतर” अथवा “उनमें।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ישימות
  choice: मृत्यु उन पर आ पड़े
  rationale: आरम्भिक इब्रानी शब्द कठिन और पाठगत रूप से अनिश्चित है। अगले वाक्यांश में जीवित ही अधोलोक में उतरने की बात होने के कारण मृत्यु की आकस्मिक चपेट का शापार्थक भाव मुख्य पाठ में रखा गया है, जबकि अनिश्चितता पादटिप्पणी में सुरक्षित है।
- source_word: עָלֵימוֹ
  choice: उन पर
  rationale: पूर्वसर्ग और तृतीय पुरुष बहुवचन प्रत्यय का सीधा, स्वाभाविक हिन्दी रूप।
- source_word: יֵרְדוּ
  choice: उतर जाएँ
  rationale: इस शापसूचक संदर्भ में इच्छार्थक बल को व्यक्त करता है और नीचे जाने की मूल छवि बनाए रखता है।
- source_word: שְׁאוֹל
  choice: अधोलोक
  rationale: यह मृतकों के लोक के लिए प्रयुक्त इब्रानी शब्द का व्यापक काव्यात्मक अर्थ रखता है और इसे न तो केवल कब्र तक सीमित करता है, न बाद की किसी विशिष्ट नरक-धारणा से मिला देता है।
- source_word: חַיִּים
  choice: जीवित ही
  rationale: 'क्रियाविशेषणीय अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है: वे जीवित अवस्था में उतरें।'
- source_word: כִּי
  choice: क्योंकि
  rationale: शाप का कारण प्रस्तुत करता है।
- source_word: רָעוֹת
  choice: बुराई
  rationale: यहाँ बहुवचन रूप सामूहिक नैतिक दुष्टता को सूचित करता है; हिन्दी में एकवचन भाववाचक रूप स्वाभाविक है।
- source_word: בִּמְגוּרָם
  choice: उनके निवास में
  rationale: संदर्भ में रहने की जगह या निवास का अर्थ सबसे उपयुक्त है; अन्य सम्भव अर्थ पादटिप्पणी में दिए गए हैं।
- source_word: בְּקִרְבָּם
  choice: उनके बीच में
  rationale: सामुदायिक परिवेश में व्याप्त बुराई का भाव देता है, जबकि ‘उनके भीतर’ की सम्भावना पादटिप्पणी में सुरक्षित रखी गई है।
theological_decisions:
- issue: שְׁאוֹל का अनुवाद
  choice: मुख्य पाठ में ‘अधोलोक’
  alternative: ‘कब्र’ अथवा लिप्यंतरण ‘शिओल’
  rationale: ‘अधोलोक’ मृतकों के लोक की मूल इब्रानी काव्यात्मक अवधारणा को साधारण हिन्दी पाठक के लिए समझने योग्य बनाता है, बिना इसे ‘नरक’ जैसी अधिक विकसित धर्मवैज्ञानिक धारणा में बदलने के।
