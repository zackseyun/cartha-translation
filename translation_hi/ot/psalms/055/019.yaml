base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/019.yaml
  text: God will hear and answer them—he who sits enthroned from of old (Selah)—because they have no changes[c][b][a], and they do not fear God.
translation:
  language: hi
  text: परमेश्वर सुनेगा और उन्हें दीन करेगा—वह जो आदि से विराजमान है—सेला—क्योंकि उनकी दशा में कोई परिवर्तन नहीं होता,[a] और वे परमेश्वर का भय नहीं मानते।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी वाक्यांश कठिन है। इसका अनुवाद ‘जिनके लिए कोई परिवर्तन नहीं होता’ या ‘जिनकी दशा कभी नहीं पलटती’ भी हो सकता है। पहली पंक्ति का अनुवाद ‘परमेश्वर सुनेगा और उन्हें उत्तर देगा’ भी संभव है; यहाँ क्रिया का अर्थ न्याय में उन्हें दीन करना समझा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׁמַע
  choice: सुनेगा
  rationale: शׁמע का अपूर्ण रूप प्रार्थना के प्रसंग में भविष्य के प्रति भजनकार का भरोसा व्यक्त करता है।
- source_word: אֵל
  choice: परमेश्वर
  rationale: यह सामान्य काव्यात्मक ईश्वरीय पद है; आधुनिक हिन्दी में ‘परमेश्वर’ स्वाभाविक और गरिमापूर्ण है।
- source_word: וְיַעֲנֵם
  choice: उन्हें दीन करेगा
  rationale: ענה का रूप ‘उत्तर देगा’ भी समझा जा सकता है, पर शत्रुओं पर न्याय के तात्कालिक प्रसंग में दंडात्मक रूप से दीन करने का अर्थ अधिक संगत है; दूसरा अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: וְיֹשֵׁב קֶדֶם
  choice: वह जो प्राचीन काल से सिंहासन पर विराजमान है
  rationale: ישׁב और קדם का संयोजन परमेश्वर के प्राचीन काल से स्थायी राजकीय शासन को व्यक्त करता है।
- source_word: סֶלָה
  choice: सेला
  rationale: इस शब्द का ठीक अर्थ और काव्यात्मक अथवा संगीतात्मक कार्य अनिश्चित है, इसलिए पारंपरिक लिप्यंतरण रखा गया है।
- source_word: אֲשֶׁר אֵין חֲלִיפוֹת לָמוֹ
  choice: क्योंकि उनके जीवन में कोई उलटफेर नहीं होता
  rationale: חֲלִיפוֹת परिवर्तन, अदला-बदली या परिस्थिति के पलटने को सूचित कर सकता है। ‘जीवन में कोई उलटफेर नहीं’ उस निर्विघ्न दशा को स्पष्ट करता है जो उनकी निश्चिंतता से जुड़ी हो सकती है, जबकि कठिन मूल वाक्यांश की अनिश्चितता पादटिप्पणी में रखी गई है।
- source_word: וְלֹא יָרְאוּ אֱלֹהִים
  choice: और वे परमेश्वर का भय नहीं मानते
  rationale: पूर्ण क्रिया यहाँ उनकी स्थायी प्रवृत्ति को वर्तमान कथन के रूप में व्यक्त करती है; यह हिन्दी में स्वाभाविक धार्मिक मुहावरा है।
theological_decisions:
- issue: וְיַעֲנֵם में ענה का अर्थ
  choice: परमेश्वर न्याय में उन्हें दीन करेगा
  alternative: परमेश्वर उन्हें उत्तर देगा
  rationale: आस-पास का संदर्भ दुष्ट विरोधियों पर परमेश्वर के न्याय का है, इसलिए दीन करने का दंडात्मक अर्थ मुख्य पाठ में चुना गया है; व्याकरणतः संभव ‘उत्तर देगा’ को पादटिप्पणी में रखकर वास्तविक तनाव सुरक्षित रखा गया है।
- issue: חֲלִיפוֹת का आशय
  choice: उनकी परिस्थितियों में कोई उलटफेर नहीं होता
  alternative: उनमें कोई परिवर्तन नहीं है / उनके लिए कोई अदला-बदली नहीं है
  rationale: कठिन इब्रानी पद संभवतः ऐसी निर्विघ्न परिस्थिति की ओर संकेत करता है जो आत्मसंतोष और परमेश्वर का भय न मानने को बढ़ाती है; वैकल्पिक संरचनाएँ पादटिप्पणी में दी गई हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, काव्यात्मक किंतु सामान्य पाठक के लिए स्पष्ट रूप अपनाया गया है। ‘सेला’ को अनूदित न करके लिप्यंतरित किया गया है। कठिन इब्रानी पद की अस्पष्टता मुख्य पाठ और पादटिप्पणी के संयोजन से सुरक्षित रखी गई है।
