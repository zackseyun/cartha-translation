  yaml_path: translation/ot/psalms/055/016.yaml
  text: As for me[a], I call to God, and Yahweh will save me.
translation:
  language: hi
  text: मैं तो परमेश्वर को पुकारता हूँ, और याहवे मुझे बचाएगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲנִי
  choice: परन्तु मैं
  rationale: स्वतंत्र और वाक्य के आरम्भ में रखा सर्वनाम वक्ता पर बल तथा पिछले प्रसंग से विरोध दिखाता है; हिन्दी में ‘परन्तु मैं’ इस भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֶל אֱלֹהִים
  choice: परमेश्वर को
  rationale: אֶל पुकार के लक्ष्य को बताता है। आधुनिक हिन्दी में ‘परमेश्वर को पुकारना’ स्वाभाविक है; אֱלֹהִים यहाँ एकमात्र परमेश्वर के लिए है।
- source_word: אֶקְרָא
  choice: पुकारूँगा
  rationale: काल-अपूर्ण क्रिया वर्तमान, आदतन या भावी अर्थ दे सकती है। अगले खंड के भरोसेपूर्ण भावी कथन के साथ यहाँ ‘पुकारूँगा’ संदर्भानुकूल है, जबकि मूल की संभावित कालगत व्यापकता बनी रहती है।
- source_word: וַיהוָה
  choice: और यहोवा
  rationale: וַ additive संबंध देता है, और יְהוָה को उसके व्यक्तिगत वाचा-नाम ‘यहोवा’ से प्रस्तुत किया गया है।
- source_word: יוֹשִׁיעֵנִי
  choice: मुझे बचाएगा
  rationale: ישׁע के हिफ़ील रूप का अर्थ ‘बचाना/छुड़ाना’ है। अपूर्ण रूप यहाँ परमेश्वर के भावी उद्धार पर विश्वास व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में चतुरक्षरीय व्यक्तिगत नाम सीधे आया है। हिन्दी बाइबलीय प्रयोग में व्यापक रूप से पहचाना जाने वाला ‘यहोवा’ नाम को उपाधि ‘प्रभु’ से अलग बनाए रखता है; ‘याहवे’ अधिक संभावित विद्वत्तापूर्ण उच्चारण है, पर निश्चित प्राचीन उच्चारण अज्ञात है।
- issue: אֱלֹהִים और יְהוָה का संबंध
  choice: ‘परमेश्वर’ और ‘यहोवा’ दोनों को अलग रूप में बनाए रखा
  alternative: दोनों को एक ही सामान्य उपाधि से प्रस्तुत करना
  rationale: पद की समानांतर पंक्तियाँ एक ही ईश्वर की ओर संकेत करती हैं, फिर भी मूल पहले सामान्य पद אֱלֹהִים और फिर व्यक्तिगत नाम יְהוָה रखता है; अनुवाद इस भेद को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और काव्यात्मक गरिमा वाली रखी गई है। ‘परन्तु मैं’ प्रसंगगत विरोध को उभारता है; ‘पुकारूँगा…बचाएगा’ भरोसेपूर्ण भावी लय देता है।
