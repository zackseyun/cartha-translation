  text: My heart writhes within me[a], and the terrors of death have fallen upon me.
translation:
  language: hi
  text: 'मेरा हृदय मेरे भीतर तड़प रहा है[a],

    और मृत्यु की विभीषिकाएँ मुझ पर आ पड़ी हैं।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरा हृदय मेरे भीतर काँप रहा है।” इब्रानी क्रिया मरोड़ खाने, काँपने या व्यथा में होने का भाव दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבִּי
  choice: मेरा हृदय
  rationale: לֵב यहाँ मनुष्य के भीतरी भाव-जगत को दर्शाता है। ‘हृदय’ हिन्दी में इसके शारीरिक बिंब और भावनात्मक बल दोनों को स्वाभाविक रूप से बनाए रखता है।
- source_word: יָחִיל
  choice: तड़प रहा है
  rationale: חול/חיל से निकला यह क्रिया-रूप मरोड़ खाने, काँपने या गहरी व्यथा में होने का भाव दे सकता है। ‘तड़प रहा है’ तीव्र भीतरी व्यथा और हलचल को व्यक्त करता है, जबकि विकल्प को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: בְּקִרְבִּי
  choice: मेरे भीतर
  rationale: קֶרֶב प्रथम पुरुष प्रत्यय के साथ व्यक्ति के अंदर या अंतर्मन को सूचित करता है; ‘मेरे भीतर’ स्पष्ट और स्वाभाविक हिन्दी है।
- source_word: אֵימוֹת
  choice: आतंक
  rationale: אֵימָה का बहुवचन अत्यंत भयावह आशंकाओं या आतंक को व्यक्त करता है। हिन्दी में ‘आतंक’ सामूहिक अर्थ में भी स्वाभाविक है और मूल की तीव्रता बनाए रखता है।
- source_word: מָוֶת
  choice: मृत्यु के
  rationale: यह אֵימוֹת के साथ संबंध बनाकर ‘मृत्यु के आतंक’ का भाव देता है। यह अनुवाद जानबूझकर यह तय नहीं करता कि मृत्यु आतंक का स्रोत है, विषय है या काव्यात्मक रूप से मानवीकृत है।
- source_word: נָפְלוּ
  choice: आ पड़े हैं
  rationale: बहुवचन पूर्ण क्रिया किसी ऐसी घटना को दर्शाती है जिसका प्रभाव वर्तमान में बना हुआ है। ‘आ पड़े हैं’ अचानक घेर लेने और बोझ की तरह टूट पड़ने का काव्यात्मक भाव देता है।
- source_word: עָלָי
  choice: मुझ पर
  rationale: עַל प्रथम पुरुष प्रत्यय के साथ सीधा अर्थ ‘मुझ पर’ है; यह हिन्दी में स्वाभाविक रूप से נָפְלוּ के साथ जुड़ता है।
