id: PSA.55.11
reference: Psalms 55:11
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: הַוּ֥וֹת בְּ/קִרְבָּ֑/הּ וְֽ/לֹא יָמִ֥ישׁ מֵ֝/רְחֹבָ֗/הּ תֹּ֣ךְ וּ/מִרְמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/011.yaml
  text: Destruction is within her[b][a]; oppression and deceit do not depart from her square.
translation:
  language: hi
  text: विनाशकारी बुराइयाँ उसके भीतर हैं[a]; उसके चौक से अत्याचार और छल कभी दूर नहीं होते[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “विनाश और विपत्तियाँ उसके भीतर हैं।” इब्रानी शब्द बहुवचन है और विनाशकारी कर्मों, विपत्तियों या अनिष्टकारी बुराइयों का बोध करा सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “उसकी सड़कों से।” इब्रानी शब्द विशेष रूप से नगर के खुले सार्वजनिक स्थान या चौक को भी दर्शा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַוּוֹת
  choice: विनाशकारी बुराइयाँ
  rationale: इब्रानी संज्ञा बहुवचन है और विनाशकारी कर्मों, विपत्तियों या अनिष्टकारी बुराइयों का बोध करा सकती है। बहुवचन हिंदी में स्वाभाविक है और मूल रूप को सुरक्षित रखता है।
- source_word: בְּקִרְבָּהּ
  choice: उसके भीतर
  rationale: इसका शाब्दिक भाव ‘उसके मध्य में’ है। ‘उसके भीतर’ नगर के स्त्रीलिंग मानवीकरण और स्थानगत अर्थ दोनों को सहज हिंदी में बनाए रखता है।
- source_word: יָמִישׁ
  choice: कभी दूर नहीं होते
  rationale: क्रिया का अर्थ हटना या दूर होना है। इब्रानी में यह एकवचन है, पर संयुक्त विषय ‘अत्याचार और छल’ को हिंदी में बहुवचन क्रिया स्वाभाविक रूप से व्यक्त करती है; ‘कभी’ उनकी निरंतर उपस्थिति स्पष्ट करता है।
- source_word: מֵרְחֹבָהּ
  choice: उसके चौक से
  rationale: רְחוֹב नगर के खुले सार्वजनिक स्थान या चौक को प्रायः दर्शाता है। ‘चौक’ संभावित शहरी अर्थ को ‘सड़कों’ की अपेक्षा अधिक सटीकता से व्यक्त करता है।
- source_word: תֹּךְ
  choice: अत्याचार
  rationale: यह शब्द उत्पीड़न, शोषण या जबरन ऐंठने का अर्थ दे सकता है। प्रसंग में ‘अत्याचार’ नगर के सार्वजनिक जीवन में व्याप्त सामाजिक अन्याय को स्पष्ट और व्यापक ढंग से व्यक्त करता है।
- source_word: וּמִרְמָה
  choice: और छल
  rationale: מִרְמָה छल, कपट या धोखाधड़ी का अर्थ देता है। ‘छल’ संक्षिप्त, स्वाभाविक और व्यापक हिंदी विकल्प है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। नगर का स्त्रीलिंग मानवीकरण ‘उसके’ द्वारा सुरक्षित है। मूल के बहुवचन הַוּוֹת को सामूहिक एकवचन में बदलने के बजाय हिंदी में स्वाभाविक बहुवचन से व्यक्त किया गया है।
