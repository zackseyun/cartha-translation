  text: Give ear[a], O God, to my prayer, and do not hide yourself from my supplication.
translation:
  language: hi
  text: 'हे परमेश्वर, मेरी प्रार्थना पर कान दे,

    और मेरी विनती से अपने को ओझल न कर।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַאֲזִינָה
  choice: कान लगा
  rationale: आज्ञार्थक אזן ध्यानपूर्वक सुनने का जीवंत मुहावरा है। ‘कान लगा’ हिब्रू बिंब और प्रार्थनापूर्ण आग्रह को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: यह इस्राएल के परमेश्वर को सीधा संबोधन है। यहाँ वाचा का विशिष्ट नाम नहीं, इसलिए हिन्दी का मानक ‘परमेश्वर’ उपयुक्त है।
- source_word: תְּפִלָּתִי
  choice: मेरी प्रार्थना
  rationale: תְּפִלָּה प्रार्थना का सामान्य शब्द है; ‘मेरी प्रार्थना’ इसका सीधा और स्वाभाविक अनुवाद है।
- source_word: וְאַל
  choice: और ... न
  rationale: संयोजक וְ और निषेधात्मक אַל दूसरी याचना को पहली से जोड़ते हैं; हिन्दी में ‘और ... न’ इस समन्वय को सहज रूप से रखता है।
- source_word: תִּתְעַלַּם
  choice: अपने को न छिपा
  rationale: עלם का यह आत्मवाचक रूप स्वयं को छिपाने या प्रार्थना की ओर ध्यान न देने का भाव रखता है। ‘अपने को न छिपा’ मूल रूपक और संबंधपरक तनाव को सुरक्षित रखता है।
- source_word: מִתְּחִנָּתִי
  choice: मेरी विनती से
  rationale: תְּחִנָּה कृपा के लिए की गई earnest याचना है; ‘विनती’ आधुनिक हिन्दी में स्पष्ट, गरिमापूर्ण और प्रार्थनात्मक है। उपसर्ग מִן को ‘से’ द्वारा व्यक्त किया गया है।
