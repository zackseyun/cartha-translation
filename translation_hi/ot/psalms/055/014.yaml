  yaml_path: translation/ot/psalms/055/014.yaml
  text: Together we sweetened counsel[c][b][a]; in the house of God we walked in the throng.
translation:
  language: hi
  text: जिसके साथ मिलकर हम मीठी अंतरंग बातें करते थे; परमेश्वर के भवन में हम जनसमूह के बीच चला करते थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲשֶׁר יַחְדָּו
  choice: जिसके साथ मिलकर
  rationale: पूर्व पद के घनिष्ठ साथी से संबंध जोड़ते हुए אֲשֶׁר का प्रसंगगत अर्थ ‘जिसके साथ’ और יַחְדָּו का अर्थ ‘मिलकर’ स्पष्ट रूप से रखा गया है।
- source_word: נַמְתִּיק סוֹד
  choice: हम मीठी अंतरंग बातें करते थे
  rationale: नַמְתִּיק की ‘मीठा करने’ की रूपकात्मकता और סוֹד की गोपनीय, आत्मीय बातचीत—दोनों को स्वाभाविक हिन्दी मुहावरे में सुरक्षित रखा गया है।
- source_word: בְּבֵית אֱלֹהִים
  choice: परमेश्वर के भवन में
  rationale: उपासना-स्थान का औपचारिक बाइबलीय भाव बनाए रखने वाला सीधा स्थानवाचक अनुवाद।
- source_word: נְהַלֵּךְ
  choice: हम ... चला करते थे
  rationale: स्मरण किए जा रहे अतीत के नियमित साझा व्यवहार को हिन्दी के अभ्यस्त भूतकाल से व्यक्त किया गया है।
- source_word: בְּרָגֶשׁ
  choice: जनसमूह के बीच
  rationale: मंदिर जाते हुए एकत्र भीड़ का भाव देता है, पर ‘कोलाहल’ चुनकर अव्यवस्था का अर्थ अनावश्यक रूप से नहीं थोपता।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी; काव्यात्मक और गरिमापूर्ण, किंतु सामान्य पाठक के लिए सहज। ‘अंतरंग बातें’ गोपनीय परामर्श, आत्मीय बातचीत और निकट संगति की अर्थ-सीमा को खुला रखता है।
