lexical_decisions:
- source_word: וְאַתָּה
  choice: परन्तु तू
  rationale: संयोजक और सर्वनाम पिछले सन्दर्भ के विपरीत चौंकाने वाला सीधा सम्बोधन बनाते हैं; ‘परन्तु’ इस विरोध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אֱנוֹשׁ
  choice: मनुष्य
  rationale: यह शब्द यहाँ नश्वरता पर नहीं, विश्वासघात करने वाले निकट पुरुष-सहयोगी की मानवीय पहचान पर बल देता है।
- source_word: כְּעֶרְכִּי
  choice: मेरे बराबर का
  rationale: עֵרֶךְ से बना पद तुल्य स्तर या हैसियत का भाव देता है; यह हिन्दी में संक्षिप्त और सम्बन्धपरक है।
- source_word: אַלּוּפִי
  choice: मेरा साथी
  rationale: यह निकट सहयोगी, साथी, अथवा अगुआ का अर्थ दे सकता है। समान्तर पद ‘मेरा घनिष्ठ मित्र’ के साथ यहाँ सम्बन्धपरक अर्थ प्रमुख है; वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: וּמְיֻדָּעִי
  choice: और मेरा घनिष्ठ मित्र
  rationale: ידע से बना यह रूप ऐसे व्यक्ति को सूचित करता है जो निकटता से जाना-पहचाना हो; केवल ‘परिचित’ प्रसंग की आत्मीयता और विलाप की भावनात्मक तीव्रता को कम कर देगा।
