  yaml_path: translation/ot/psalms/055/017.yaml
  text: Evening[a], morning, and noon I complain and groan[c][b], and he hears my voice.
translation:
  language: hi
  text: साँझ, सुबह और दोपहर मैं विलाप करता और कराहता हूँ[a], और वह मेरी आवाज़ सुनता है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं मनन करता और कराहता हूँ।” “विलाप करता” के लिए प्रयुक्त इब्रानी क्रिया का अर्थ बोलना, मनन करना या विलाप करना हो सकता है; इस विलाप के प्रसंग में विलाप का अर्थ अधिक संभावित है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में केवल “और वह मेरी आवाज़ सुनता है” है; कर्ता निहित है। आसपास के संदर्भ में “वह” परमेश्वर है।
    reason: alternative_reading
lexical_decisions:
- source_word: עֶרֶב וָבֹקֶר וְצָהֳרַיִם
  choice: साँझ, सुबह और दोपहर
  rationale: तीनों समय-संज्ञाओं को समानांतर, लयात्मक सूची के रूप में रखा गया है; हिन्दी में विभक्तियाँ जोड़े बिना यह क्रम स्वाभाविक और काव्यात्मक है।
- source_word: אָשִׂיחָה
  choice: मैं अपनी व्यथा कहता
  rationale: שׂיח के अर्थ-क्षेत्र में मनन, बोलना और विलाप करना आते हैं। इस विलाप-गीत में अगले क्रियापद के साथ मुखर दुःख-प्रकटन का भाव सबसे उपयुक्त है; ‘अपनी व्यथा कहता’ साधारण आधुनिक हिन्दी में स्वाभाविक है।
- source_word: וְאֶהֱמֶה
  choice: और कराहता हूँ
  rationale: המה यहाँ सुनाई देने वाली व्याकुलता या कराह को व्यक्त करता है। ‘कराहता हूँ’ विलाप के प्रसंग और पहली क्रिया के साथ उचित बैठता है।
- source_word: וַיִּשְׁמַע
  choice: और वह ... सुनता है
  rationale: काव्यात्मक प्रसंग में रूप को भरोसे से कही गई वर्तमान या अभ्यस्त क्रिया के रूप में लिया गया है।
- source_word: קוֹלִי
  choice: मेरी आवाज़
  rationale: קוֹל का सीधा और स्वाभाविक अर्थ ‘आवाज़’ है, जो प्रार्थना के श्रव्य और व्यक्तिगत स्वर को बनाए रखता है।
theological_decisions:
- issue: וַיִּשְׁמַע का अव्यक्त कर्ता
  choice: मुख्य पाठ में ‘वह’, जिसका संदर्भ परमेश्वर है
  alternative: ‘परमेश्वर मेरी आवाज़ सुनता है’
  rationale: इब्रानी में कर्ता तीसरे पुरुष एकवचन के क्रियारूप में निहित है, पर इस पद में परमेश्वर का नाम स्पष्ट रूप से नहीं दिया गया। आसपास के संदर्भ से संकेतित कर्ता स्पष्ट है, इसलिए मुख्य पाठ में कोई अतिरिक्त संज्ञा नहीं जोड़ी गई।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और काव्यात्मक रूप अपनाया गया है। ‘साँझ, सुबह और दोपहर’ मूल की त्रिपदी लय को बनाए रखता है। ‘अपनी व्यथा कहता’ शब्दार्थ की वास्तविक व्यापकता को पाद-टिप्पणी में सुरक्षित रखते हुए विलाप के प्रसंग को स्पष्ट करता है।
