- source_word: אַרְחִיק נְדֹד
  choice: मैं दूर निकलकर भटकता
  rationale: רחק के हिफ़ील रूप में दूर जाने और נְדֹד में भटकने अथवा पलायन करने की संयुक्त छवि है। यह अनुवाद दोनों तत्वों को बनाए रखता है।
- source_word: אָלִין
