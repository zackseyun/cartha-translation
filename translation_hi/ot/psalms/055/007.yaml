- source_word: בַּמִּדְבָּר
  choice: निर्जन प्रदेश में
  rationale: מִדְבָּר केवल रेतीले मरुस्थल तक सीमित नहीं, बल्कि निर्जन वन्य या उजाड़ क्षेत्र भी सूचित करता है।
- source_word: סֶלָה
  choice: सेला
  rationale: इसका ठीक अर्थ अनिश्चित है, इसलिए परंपरानुसार लिप्यंतरण रखा गया है।
