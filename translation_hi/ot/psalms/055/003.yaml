translation_notes:
  register: आधुनिक मानक हिंदी का काव्यात्मक किंतु सरल और गरिमापूर्ण रूप अपनाया गया है। समानांतर पंक्तियों और मूल के कारणसूचक संबंध को सुरक्षित रखा गया है। ‘अनर्थ ढाना’ सामान्य पाठक के लिए स्वाभाविक है और मूल के ‘ऊपर गिराने’ के बिंब को भी पर्याप्त रूप से बनाए रखता है।
