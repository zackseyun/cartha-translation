  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: מִ/קּ֤וֹל אוֹיֵ֗ב מִ/פְּנֵ֣י עָקַ֣ת רָשָׁ֑ע כִּי יָמִ֥יטוּ עָלַ֥/י אָ֝֗וֶן וּ/בְ/אַ֥ף יִשְׂטְמֽוּ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/003.yaml
  text: Because of the voice of the enemy[a], because of the oppression of the wicked; for they cast trouble upon me[b], and in anger they hate me.
translation:
  language: hi
  text: 'शत्रु की आवाज़ के कारण,

    दुष्ट के अत्याचार के कारण;

    क्योंकि वे मुझ पर अनर्थ ढा रहे हैं[a]

    और क्रोध में मुझसे बैर रखते हैं।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “वे मुझ पर विपत्ति (या बुराई) डालते हैं।” इब्रानी אָוֶן का अर्थ प्रसंग के अनुसार अनर्थ, विपत्ति, हानि, बुराई या अधर्म हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקּוֹל אוֹיֵב
  choice: शत्रु की आवाज़ के कारण
  rationale: מִן को समानांतर מִפְּנֵי के अनुरूप कारणसूचक माना गया है। ‘आवाज़’ मूल के ठोस बिंब को बनाए रखती है; एकवचन ‘शत्रु’ भी सुरक्षित है।
- source_word: מִפְּנֵי עָקַת רָשָׁע
  choice: दुष्ट के अत्याचार के कारण
  rationale: עָקַת दबाव, संकट या दमन को दर्शाता है। इस शत्रुतापूर्ण प्रसंग में ‘अत्याचार’ स्वाभाविक रूप से दुष्ट द्वारा पहुँचाए जा रहे उत्पीड़न को व्यक्त करता है।
- source_word: יָמִיטוּ עָלַי אָוֶן
  choice: वे मुझ पर अनर्थ ढा रहे हैं
  rationale: हिफ़ील क्रिया किसी चीज़ को किसी पर गिराने या लादने का भाव देती है। ‘अनर्थ ढाना’ हिंदी में इस आक्रामक बिंब को स्वाभाविक रूप से व्यक्त करता है; אָוֶן की अर्थ-व्याप्ति के कारण विकल्प पादटिप्पणी में रखा गया है।
- source_word: וּבְאַף יִשְׂטְמוּנִי
  choice: और क्रोध में मुझसे बैर रखते हैं
  rationale: אַף यहाँ मुहावरे के रूप में ‘क्रोध’ है। שׂטם केवल भावात्मक घृणा नहीं, सक्रिय शत्रुता या बैर भी दर्शाता है; इसलिए ‘बैर रखते हैं’ प्रसंगानुकूल है।
