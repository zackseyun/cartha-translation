  text: Day and night they go around her on her walls[b][a], and trouble and misery are within her.
translation:
  language: hi
  text: दिन-रात वे उसकी दीवारों पर उसके चारों ओर घूमते रहते हैं[a]; अनर्थ और उत्पीड़न उसके भीतर हैं।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वे उसकी दीवारों पर उसे घेरे रहते हैं।” इब्रानी क्रिया चारों ओर घूमने के साथ-साथ घेरने का भाव भी व्यक्त कर सकती है।
    reason: lexical_alternative
  - marker: b
    text: “अनर्थ और उत्पीड़न” का अनुवाद “दुष्टता और कष्ट” अथवा “अधर्म और विपत्ति” भी किया जा सकता है; इब्रानी शब्द नैतिक बुराई और उससे होने वाली पीड़ा—दोनों का बोध करा सकते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹמָם וָלַיְלָה
  choice: दिन-रात
  rationale: यह स्वाभाविक हिन्दी काल-सूचक युग्म निरंतर होती गतिविधि का भाव संक्षेप में व्यक्त करता है।
- source_word: יְסוֹבְבֻהָ
  choice: वे उसके चारों ओर घूमते रहते हैं
  rationale: סבב में चारों ओर घूमने और घेरने दोनों का अर्थ संभव है। यह चयन गतिशीलता और अनिर्दिष्ट बहुवचन कर्ता को बनाए रखता है।
- source_word: עַל חוֹמֹתֶיהָ
  choice: उसकी शहरपनाह पर
  rationale: עַל का सीधा अर्थ ‘पर’ है; शहरपनाह आधुनिक हिन्दी में नगर की रक्षात्मक दीवार का स्पष्ट और गरिमापूर्ण बोध कराती है।
- source_word: אָוֶן
  choice: अनर्थ
  rationale: यह शब्द नैतिक बुराई और उससे उपजी हानि या विपत्ति दोनों को समेट सकता है; ‘अनर्थ’ इस दोहरे भाव को अपेक्षाकृत खुला रखता है।
- source_word: עָמָל
  choice: उत्पीड़न
  rationale: संदर्भ में यह कष्ट, दुर्दशा अथवा दमनकारी बुराई सूचित कर सकता है। ‘उत्पीड़न’ सामाजिक हानि के पहलू को व्यक्त करते हुए אָוֶן से भेद बनाए रखता है।
- source_word: בְּקִרְבָּהּ
  choice: उसके भीतर हैं
  rationale: शाब्दिक भाव ‘उसके मध्य में’ है। ‘उसके भीतर’ नगर के स्त्रीलिंग व्यक्तिकरण को सहज हिन्दी में सुरक्षित रखता है।
