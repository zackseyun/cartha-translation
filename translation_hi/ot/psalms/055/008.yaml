lexical_decisions:
- source_word: אָחִישָׁה
  choice: मैं ... शीघ्रता करता
  rationale: חוּשׁ का यह इच्छासूचक/संकल्पसूचक रूप उतावली और व्यक्तिगत अभिलाषा व्यक्त करता है; वर्तमान संदर्भ में यह साधारण भविष्यवाणी नहीं है।
- source_word: מִפְלָט
  choice: शरण
  rationale: यह संज्ञा बच निकलने के साधन या सुरक्षित आश्रय को दर्शाती है; काव्यात्मक संदर्भ में ‘शरण’ स्वाभाविक और अर्थपूर्ण है।
- source_word: לִי
  choice: अपने लिए
  rationale: प्रथम पुरुष प्रत्यय के साथ ל व्यक्तिगत हित को प्रकट करता है; ‘अपने लिए’ उसका आत्मसंबंधी बल बनाए रखता है।
- source_word: מֵרוּחַ
  choice: हवा से
  rationale: आँधी के समानांतर प्रयोग के कारण רוּחַ यहाँ मौसम-संबंधी ‘हवा’ है, ‘आत्मा’ नहीं; מִן को ‘से’ से व्यक्त किया गया है।
- source_word: סֹעָה
  choice: प्रचंड
  rationale: यह रूप हवा की हिंसक, तूफ़ानी गति बताता है; ‘प्रचंड’ आधुनिक हिन्दी में स्वाभाविक है और अगली संज्ञा ‘आँधी’ की अनावश्यक पुनरुक्ति से बचाता है।
- source_word: מִסָּעַר
  choice: आँधी से
  rationale: סַעַר का अर्थ तूफ़ान या आँधी है। दोहराए गए מִן को फिर ‘से’ रखकर इब्रानी समानांतरता सुरक्षित की गई है।
