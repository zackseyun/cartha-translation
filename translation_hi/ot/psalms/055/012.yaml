base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/012.yaml
  text: For it is not an enemy who taunts me—then I could bear it[b][a]; it is not one who hates me who has magnified himself against me—then I could hide from him.
translation:
  language: hi
  text: क्योंकि मेरा अपमान करनेवाला कोई शत्रु नहीं है[a]—यदि होता, तो मैं इसे सह लेता; मेरे विरुद्ध अपने को बड़ा जतानेवाला[b] मुझसे बैर रखनेवाला नहीं है—यदि होता, तो मैं उससे छिप जाता।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘मुझे ताना मारनेवाला’ अथवा ‘मेरी निंदा करनेवाला।’ इब्रानी क्रिया तिरस्कार से भरे मौखिक अपमान को दर्शाती है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से ‘मेरे विरुद्ध अपने को बड़ा करनेवाला’; अर्थात मेरे प्रति घमंड से व्यवहार करनेवाला।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पद पिछले विलाप का कारण या स्पष्टीकरण प्रस्तुत करता है; ‘क्योंकि’ इस संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אוֹיֵב
  choice: शत्रु
  rationale: विरोधी या दुश्मन के लिए मानक, स्पष्ट और गरिमापूर्ण हिन्दी शब्द।
- source_word: יְחָרְפֵנִי
  choice: मेरा अपमान करनेवाला
  rationale: חרף तिरस्कारपूर्ण वाणी, निंदा या अपमान का भाव रखता है। ‘अपमान करना’ आधुनिक हिन्दी में व्यापक और स्वाभाविक है, जबकि वैकल्पिक अर्थ पाद-टिप्पणी में दिए गए हैं।
- source_word: וְאֶשָּׂא
  choice: तो मैं इसे सह लेता
  rationale: נשׂא यहाँ मुहावरे के रूप में ‘सहना’ या ‘बर्दाश्त करना’ है। नकारात्मक प्रतिकल्पित संरचना को स्पष्ट करने के लिए ‘यदि होता, तो’ और अपमान की ओर संकेत करने वाला ‘इसे’ स्वाभाविक रूप से जोड़ा गया है।
- source_word: מְשַׂנְאִי
  choice: मुझसे बैर रखनेवाला
  rationale: संज्ञा-सदृश कृदंत उस व्यक्ति को दर्शाता है जो वक्ता से घृणा या बैर रखता है; यह हिन्दी में ‘मेरा बैरी’ की अपेक्षा अधिक सहज है।
- source_word: עָלַי
  choice: मेरे विरुद्ध
  rationale: इस क्रिया के साथ यह संबंध स्थान नहीं, बल्कि शत्रुतापूर्ण विरोध प्रकट करता है।
- source_word: הִגְדִּיל
  choice: अपने को बड़ा जतानेवाला
  rationale: हिफ़ील रूप का शाब्दिक भाव ‘बड़ा करना’ है; प्रसंग में यह किसी के विरुद्ध अहंकारपूर्वक अपने को बड़ा दिखाने या जताने को सूचित करता है।
- source_word: וְאֶסָּתֵר
  choice: तो मैं उससे छिप जाता
  rationale: निफ़ाल रूप स्वयं को छिपाने का भाव देता है। प्रतिकल्पित संदर्भ के अनुरूप हिन्दी में ‘यदि होता, तो’ संरचना अपनाई गई है।
- source_word: מִמֶּנּוּ
  choice: उससे
  rationale: सर्वनामयुक्त पूर्वसर्ग का सीधा और स्वाभाविक हिन्दी रूप।
theological_decisions:
- issue: अपमान करनेवाले की पहचान का प्रतिकल्पित निषेध
  choice: ‘कोई शत्रु नहीं है—यदि होता...’ के रूप में निषेध को स्पष्ट रखा गया
  alternative: इसे केवल ‘यदि कोई शत्रु मेरा अपमान करता...’ कहना
  rationale: केवल शर्तीय वाक्य बनाने से मूल के לֹא (‘नहीं’) और इस तनाव का बल घट जाता कि पीड़ा देनेवाला सामान्य शत्रु नहीं, बल्कि निकट व्यक्ति है, जिसकी पहचान अगले पद में खुलती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में काव्यात्मक किंतु सहज शैली रखी गई है। दोनों समानांतर पंक्तियों में ‘यदि होता, तो’ जोड़कर इब्रानी की निहित प्रतिकल्पित संरचना स्पष्ट की गई है, जबकि मूल का निषेध भी सुरक्षित है।
