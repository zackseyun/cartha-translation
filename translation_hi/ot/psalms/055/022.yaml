lexical_decisions:
- source_word: הַשְׁלֵךְ
  choice: डाल दे
  rationale: आज्ञार्थक क्रिया में किसी वस्तु को दूसरे पर फेंकने या डाल देने का सजीव बिंब है; हिंदी में ‘पर डाल दे’ स्वाभाविक और स्पष्ट है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय ईश्वरीय नाम को हिंदी में प्रचलित व्यक्तिगत नाम ‘यहोवा’ से व्यक्त किया गया है, न कि उपाधि ‘प्रभु’ से।
- source_word: יְהָבְךָ
  choice: अपना बोझ
  rationale: यह दुर्लभ संज्ञा व्यक्ति पर रखी हुई वस्तु—उसके भार, चिंता या जीवन में मिले हिस्से—की ओर संकेत कर सकती है। संदर्भ में ‘बोझ’ सबसे स्वाभाविक है; अन्य संभावनाएँ पादटिप्पणी में रखी गई हैं।
- source_word: יְכַלְכְּלֶךָ
  choice: तुझे सँभालेगा
  rationale: כלכל यहाँ सहारा देने, बनाए रखने और आवश्यक सहायता देने का भाव रखता है। ‘सँभालेगा’ आधुनिक हिंदी में इन अर्थों को सहज रूप से समेटता है।
- source_word: לֹא יִתֵּן לְעוֹלָם
  choice: कभी ... न देगा
  rationale: यह मुहावरा स्थायी निषेध व्यक्त करता है; हिंदी में ‘कभी ... न देगा’ उसी बल को स्वाभाविक रूप से रखता है।
- source_word: מוֹט
  choice: डगमगाने
  rationale: शब्द अस्थिर होने, लड़खड़ाने या स्थान से हिलने का बिंब देता है। ‘डगमगाने’ नैतिक और परिस्थितिगत अस्थिरता दोनों के लिए उपयुक्त है।
- source_word: לַצַּדִּיק
  choice: धर्मी को
  rationale: निश्चित एकवचन विशेषण संज्ञा के रूप में प्रयुक्त है और संभवतः प्रतिनिधिक अर्थ रखता है। हिंदी का ‘धर्मी’ एकवचन रूप और व्यापक प्रतिनिधिक अर्थ दोनों बनाए रखता है।
theological_decisions:
- issue: יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम है। उसका लिप्यंतरित हिंदी रूप नाम और उपाधि के बीच का भेद सुरक्षित रखता है।
- issue: לַצַּדִּיק का प्रतिनिधिक एकवचन
  choice: धर्मी को
  alternative: धर्मी जन को / धर्मी लोगों को
  rationale: मूल का एकवचन बनाए रखा गया है, जबकि हिंदी में ‘धर्मी’ सामान्य प्रतिनिधिक अर्थ भी ग्रहण कर सकता है; अनावश्यक रूप से ‘पुरुष’ जोड़ना मूल से अधिक विशिष्ट होता।
- issue: प्रतिज्ञा का आशय
  choice: वह धर्मी को कभी डगमगाने न देगा
  alternative: वह धर्मी को कभी कोई कष्ट न होने देगा
  rationale: मूल अस्थिर होने या गिरने के रूपक की बात करता है, कष्ट से पूर्ण मुक्ति की नहीं; इसलिए प्रतिज्ञा को बढ़ाकर नहीं कहा गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सीधी रखी गई है। एकवचन संबोधन ‘तू/तुझे’ के अनुरूप आज्ञा ‘डाल दे’ प्रयुक्त हुई है। ‘सँभालेगा’ में सहारा और पालन दोनों का भाव है; ‘डगमगाने’ से मूल अस्थिरता का रूपक सुरक्षित रहता है।
