  text: וְ/אַתָּ֤ה אֱלֹהִ֨ים תּוֹרִדֵ֬/ם לִ/בְאֵ֬ר שַׁ֗חַת אַנְשֵׁ֤י דָמִ֣ים וּ֭/מִרְמָה לֹא יֶחֱצ֣וּ יְמֵי/הֶ֑ם וַ֝/אֲנִ֗י אֶבְטַח בָּֽ/ךְ׀׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/023.yaml
  text: But you[a], God, will bring them down to the pit of destruction; men of bloodshed and deceit will not live out half their days[b], but I will trust in you.
translation:
  language: hi
  text: परन्तु हे परमेश्वर, तू उन्हें विनाश के गड्ढे में उतार देगा[a]; रक्तपात और छल करने वाले अपनी आधी आयु भी पूरी नहीं करेंगे[b], पर मैं तुझ पर भरोसा रखूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘सड़न के गड्ढे में,’ ‘कब्र के गड्ढे में,’ अथवा केवल ‘गड्ढे में।’
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक अर्थ ‘अपने दिनों को आधा नहीं करेंगे’ है; यह एक मुहावरा है, जिसका अर्थ है कि उनका जीवन समय से पहले समाप्त हो जाएगा।
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹרִדֵם
  choice: तू उन्हें…उतार देगा
  rationale: हिफ़ील रूप का कारणवाचक अर्थ ‘नीचे उतारना’ है। यह चयन क्रिया की कारणवाचक शक्ति बनाए रखता है और दण्ड देने के ढंग के विषय में अनावश्यक विवरण नहीं जोड़ता।
- source_word: לִבְאֵר שַׁחַת
  choice: विनाश के गड्ढे में
  rationale: בְּאֵר का मूल अर्थ ‘गड्ढा/कुआँ’ और שַׁחַת का अर्थ ‘विनाश, सड़न या गड्ढा’ हो सकता है। यह अनुवाद मृत्यु और दैवी न्याय की सजीव छवि को बनाए रखते हुए उसे किसी तकनीकी परलोक-संबंधी धारणा तक सीमित नहीं करता।
- source_word: אַנְשֵׁי דָמִים וּמִרְמָה
  choice: रक्तपात और छल करनेवाले लोग
  rationale: शाब्दिक ‘रक्त के लोग’ हिंसक या रक्तदोषी व्यक्तियों के लिए इब्रानी मुहावरा है; מִרְמָה छल या कपट को सूचित करता है। हिंदी पदबंध दोनों विशेषताओं को सहज और स्पष्ट रूप में व्यक्त करता है।
- source_word: לֹא יֶחֱצוּ יְמֵיהֶם
  choice: अपनी आधी आयु भी पूरी नहीं करेंगे
  rationale: חצה का अर्थ ‘आधा करना’ है। यहाँ मुहावरे का आशय है कि उनका जीवन अपेक्षित मध्य बिंदु से पहले ही कट जाएगा। ‘भी’ हिंदी में इस अकाल अंत पर स्वाभाविक बल देता है।
- source_word: וַאֲנִי אֶבְטַח בָּךְ
  choice: पर मैं तुझ पर भरोसा रखूँगा
  rationale: स्वतंत्र सर्वनाम וַאֲנִי वक्ता पर बल देता है और दुष्टों के भाग्य के विपरीत उसका विश्वास सामने रखता है। ‘पर मैं’ इस विरोध को स्वाभाविक हिंदी में सुरक्षित रखता है।
theological_decisions:
- issue: ‘विनाश के गड्ढे’ में न्याय की छवि का स्वरूप
  choice: इसे मृत्यु और विनाश की ओर ले जानेवाले दैवी न्याय की सजीव छवि के रूप में रखा गया है।
  alternative: इसे केवल ‘कब्र’, ‘अधोलोक’ या किसी विशिष्ट अंतिम दण्ड के तकनीकी नाम के रूप में प्रस्तुत करना।
  rationale: इब्रानी अभिव्यक्ति प्रबल है, पर इतनी निश्चित नहीं कि यहाँ किसी विशेष परलोक-संबंधी सिद्धान्त को अनिवार्य ठहराया जाए। इसलिए मूल की अर्थगत व्यापकता और धार्मिक तनाव सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी का गरिमापूर्ण, सामान्य पाठकों के लिए सुबोध रूप। परमेश्वर को संबोधित करते हुए एकवचन ‘तू/तुझ’ रखा गया है, जो भजन की प्रत्यक्ष और आत्मीय प्रार्थना-भाषा के अनुकूल है। ‘रक्तपात’ मूल की हिंसक छवि को बनाए रखता है, जबकि वाक्य-विन्यास सहज हिंदी में है।
