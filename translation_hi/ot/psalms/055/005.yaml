  text: יִרְאָ֣ה וָ֭/רַעַד יָ֣בֹא בִ֑/י וַ֝/תְּכַסֵּ֗/נִי פַּלָּצֽוּת׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/005.yaml
  text: Fear and trembling come upon me[a], and horror covers me.
translation:
  language: hi
  text: 'भय और थरथराहट मुझ पर आ पड़ते हैं,

    और दहशत मुझे ढक लेती है।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יִרְאָה
  choice: भय
  rationale: यह संज्ञा भय या गहरे डर को व्यक्त करती है; ‘भय’ सीधा, गरिमापूर्ण और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: וָרַעַד
  choice: और थरथराहट
  rationale: यह आतंक के कारण होने वाले शारीरिक काँपने को दर्शाता है; ‘थरथराहट’ भावात्मक और शारीरिक दोनों पक्षों को बनाए रखती है।
- source_word: יָבֹא בִי
  choice: मुझ पर आ पड़ते हैं
  rationale: शाब्दिक अर्थ ‘मुझमें आता है’ है, पर अनुभव के व्यक्ति को आ घेरने का भाव हिन्दी में ‘मुझ पर आ पड़ते हैं’ से स्वाभाविक रूप में व्यक्त होता है। संयुक्त कर्ता के अनुसार बहुवचन रखा गया है।
- source_word: וַתְכַסֵּנִי
  choice: और ... मुझे ढक लेती है
  rationale: मूल क्रिया ‘ढकना’ है; इसे बनाए रखने से आवरण का रूपक सुरक्षित रहता है, बिना इसे ‘अभिभूत करना’ जैसे व्याख्यात्मक शब्द में बदलने के।
- source_word: פַּלָּצוּת
  choice: दहशत
  rationale: यह तीव्र आतंक, सिहरन या भयावह अनुभूति को दर्शाती है। ‘दहशत’ सामान्य आधुनिक हिन्दी में तीव्रता स्पष्ट करती है और ‘भय’ की अनावश्यक पुनरावृत्ति से बचाती है।
theological_decisions: []
