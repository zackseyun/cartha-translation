  text: שָׁלַ֣ח יָ֭דָי/ו בִּ/שְׁלֹמָ֗י/ו חִלֵּ֥ל בְּרִיתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/020.yaml
  text: He stretched out his hands against those at peace with him[b][a]; he profaned his covenant.
translation:
  language: hi
  text: उसने उन लोगों के विरुद्ध अपने हाथ बढ़ाए जो उसके साथ शांति से रहते थे[a]; उसने अपनी वाचा को अपवित्र किया।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उसने अपने मित्रों पर हाथ उठाया’ अथवा ‘अपने सहयोगियों के विरुद्ध हाथ बढ़ाया।’ इब्रानी अभिव्यक्ति ऐसे लोगों की ओर संकेत करती है जिनके साथ उसका शांतिपूर्ण संबंध था।
    reason: lexical_alternative
  - marker: b
    text: या ‘उसने अपनी वाचा का उल्लंघन किया।’ इब्रानी क्रिया का अधिक शाब्दिक अर्थ ‘अपवित्र किया’ या ‘दूषित किया’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלַח יָדָיו
  choice: अपने हाथ बढ़ाए
  rationale: बहुवचन ‘हाथों’ को बनाए रखते हुए इब्रानी के ठोस बिंब को स्वाभाविक हिन्दी में व्यक्त करता है; ‘के विरुद्ध’ से प्रसंग का शत्रुतापूर्ण भाव स्पष्ट होता है।
- source_word: בִּשְׁלֹמָיו
  choice: अपने साथ शान्ति से रहनेवालों के विरुद्ध
  rationale: यह अभिव्यक्ति उन लोगों को सूचित करती है जिनके साथ उसका शान्तिपूर्ण सम्बन्ध था। यह ‘मित्रों’ या ‘सहयोगियों’ जैसे अधिक संकीर्ण अर्थ से बचती है।
- source_word: חִלֵּל
  choice: अपवित्र किया
  rationale: पिएल रूप का मूल भाव किसी पवित्र या मान्य वस्तु को अपवित्र अथवा दूषित मानना है। यह ‘तोड़ा’ की अपेक्षा इब्रानी की नैतिक और धार्मिक गंभीरता को अधिक सुरक्षित रखता है।
- source_word: בְּרִיתוֹ
  choice: अपनी वाचा
  rationale: ‘वाचा’ בְּרִית का प्रचलित बाइबलीय हिन्दी पर्याय है। आत्मवाचक ‘अपनी’ हिन्दी में कर्ता से जुड़े 3 पुं. एकवचन प्रत्यय को स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: वाचा का स्वरूप
  choice: ‘अपनी वाचा को अपवित्र किया’
  alternative: ‘अपना समझौता तोड़ा’ या ‘अपनी वाचा का उल्लंघन किया’
  rationale: मूल पाठ वाचा की भाषा से विश्वासघात की गंभीरता व्यक्त करता है, पर इसे स्पष्ट रूप से परमेश्वर की वाचा नहीं बताता। इसलिए ‘वाचा’ और ‘अपवित्र किया’ उस गंभीरता को रखते हैं, बिना किसी विशिष्ट प्रकार की वाचा आरोपित किए।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध हिन्दी। ‘शान्ति से रहनेवालों’ में मूल की सम्बन्धपरक व्यापकता बनी रहती है, जबकि ‘वाचा’ और ‘अपवित्र किया’ पद की गंभीरता को सुरक्षित रखते हैं।
