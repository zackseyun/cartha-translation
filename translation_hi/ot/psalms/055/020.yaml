    issue: The first clause is awkwardly constructed.
    rationale: The stacked expression ‘अपने साथ शान्ति से रहनेवालों के विरुद्ध अपने हाथ’ is less idiomatic than a relative clause and has unnecessary possessive repetition.
  - severity: low
    issue: Nonstandard/dated spacing and spelling in the first clause.
    rationale: For modern standard Hindi, use ‘शांति’ and write ‘रहने वाले’ as separate words.
  - severity: low
    issue: Footnote b says ‘दूषित ठहराया.’
    rationale: ‘ठहराया’ may mean ‘declared to be,’ whereas the Hebrew verb denotes an action of profaning or defiling; ‘दूषित किया’ is closer.
