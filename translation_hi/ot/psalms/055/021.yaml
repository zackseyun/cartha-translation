base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/021.yaml
  text: The words of his mouth are smooth[a], but his heart is war; his words are softer than oil[b], yet they are drawn swords.
translation:
  language: hi
  text: उसके मुँह की बातें चिकनी-चुपड़ी हैं[a], पर उसके हृदय में युद्ध है; उसके शब्द तेल से भी अधिक कोमल हैं, फिर भी वे म्यान से खिंची तलवारें हैं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसके मुँह से चापलूसी भरी बातें निकलती हैं।” इब्रानी अभिव्यक्ति दुर्लभ है और संभवतः मक्खन जैसी चिकनी या चापलूसी भरी वाणी पर बल देती है।
    reason: lexical_alternative
  - marker: b
    text: या, “म्यान से निकली तलवारें।”
    reason: lexical_alternative
lexical_decisions:
- source_word: חָלְקוּ מַחְמָאֹת פִּיו
  choice: उसके मुँह की बातें चिकनी-चुपड़ी हैं
  rationale: दुर्लभ इब्रानी अभिव्यक्ति मक्खन-जैनी चिकनाई और चापलूसी भरी वाणी का संकेत देती है। हिंदी में ‘चिकनी-चुपड़ी बातें’ इस भाव को स्वाभाविक और स्पष्ट रूप से व्यक्त करती हैं।
- source_word: וּקֲרָב לִבּוֹ
  choice: पर उसके हृदय में युद्ध है
  rationale: קְרָב संज्ञा के रूप में ‘युद्ध/लड़ाई’ है। यह अनुवाद बाहरी मधुरता और भीतरी वैर के विरोध को रखते हुए इब्रानी के तीखे रूपक को सुरक्षित रखता है।
- source_word: רַכּוּ דְבָרָיו מִשֶּׁמֶן
  choice: उसके शब्द तेल से भी अधिक कोमल हैं
  rationale: रूपक और तुलनात्मक रचना को सीधे रखा गया है; ‘कोमल’ यहाँ सुनने में मृदु और अहानिकर लगने वाली वाणी बताता है।
- source_word: וְהֵמָּה פְתִחוֹת
  choice: फिर भी वे म्यान से खिंची तलवारें हैं
  rationale: פְתִחוֹת का शाब्दिक रूप दुर्लभ है, पर प्रसंग में खुले अथवा म्यान से निकाले हथियार समझे जाते हैं। ‘म्यान से खिंची तलवारें’ हिंसा के लिए तैयार हथियार का भाव स्पष्ट करता है।
