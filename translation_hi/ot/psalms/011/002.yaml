  text: כִּ֤י הִנֵּ֪ה הָ/רְשָׁעִ֡ים יִדְרְכ֬וּ/ן קֶ֗שֶׁת כּוֹנְנ֣וּ חִצָּ֣/ם עַל יֶ֑תֶר לִ/יר֥וֹת בְּמוֹ אֹ֝֗פֶל לְ/יִשְׁרֵי לֵֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/011/002.yaml
  text: For look[a], the wicked bend the bow; they have fitted their arrow to the string to shoot in the darkness at the upright in heart.
translation:
  language: hi
  text: क्योंकि देखो, दुष्ट धनुष तानते हैं; उन्होंने अपना तीर प्रत्यंचा पर चढ़ा रखा है, ताकि अँधेरे में[a] निष्कपट हृदय वालों पर चलाएँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘अँधेरे से।’ इब्रानी वाक्यांश अँधेरे में किए गए हमले या उस छिपे स्थान, जहाँ से वह किया जाता है—दोनों में से किसी पर बल दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण प्रस्तुत करता है और पद के तर्क-संबंध को स्वाभाविक हिंदी में बनाए रखता है।
- source_word: הִנֵּה
  choice: देखो
  rationale: यह सामने उपस्थित खतरे की ओर सजीव ढंग से ध्यान खींचता है और आधुनिक हिंदी में स्वाभाविक है।
- source_word: הָרְשָׁעִים
  choice: दुष्ट
  rationale: भजन-साहित्य में यह नैतिक रूप से भ्रष्ट विरोधियों के लिए उपयुक्त और प्रचलित शब्द है।
- source_word: יִדְרְכוּן קֶשֶׁת
  choice: धनुष चढ़ाते हैं
  rationale: इब्रानी मुहावरा धनुष को तीर चलाने के लिए तैयार करने का बोध देता है; हिंदी में यह सहज और चित्रात्मक है।
- source_word: כּוֹנְנוּ חִצָּם עַל יֶתֶר
  choice: उन्होंने अपना तीर डोरी पर साध रखा है
  rationale: तीर को धनुष की डोरी पर रखकर प्रहार के लिए तैयार करने की सोची-समझी क्रिया को व्यक्त करता है; मूल का एकवचन ‘तीर’ सुरक्षित है।
- source_word: לִירוֹת
  choice: चलाएँ
  rationale: धनुष से तीर चलाने के संदर्भ में यह स्वाभाविक हिंदी क्रिया है।
- source_word: בְּמוֹ אֹפֶל
  choice: अँधेरे में
  rationale: मुख्य पाठ में हमले की अँधेरी अथवा छिपी परिस्थिति को व्यक्त करता है; स्रोत में ‘अँधेरे से’ का अर्थ भी संभव है, जिसे पाद-टिप्पणी में रखा गया है।
- source_word: לְיִשְׁרֵי לֵב
  choice: सीधे मनवालों पर
  rationale: यह भीतरी नैतिक खराई को स्वाभाविक, सामान्य हिंदी में व्यक्त करता है और ‘हृदय से सीधे’ की अपेक्षा कम कृत्रिम है।
