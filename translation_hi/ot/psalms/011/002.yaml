  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक रखी गई है। हथियार तैयार करने की क्रमिक छवि—धनुष चढ़ाना, तीर डोरी पर साधना और उसे चलाना—स्पष्ट रखी गई है; स्थान/साधन संबंधी इब्रानी अस्पष्टता पाद-टिप्पणी में सुरक्षित है।
