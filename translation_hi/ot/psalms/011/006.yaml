base_translation:
  language: en
  yaml_path: translation/ot/psalms/011/006.yaml
  text: He will rain down traps on the wicked; fire and sulfur and a scorching wind will be the portion of their cup.
translation:
  language: hi
  text: 'वह दुष्टों पर फंदे[a] बरसाएगा;

    आग, गन्धक और झुलसाने वाली आँधी उनके प्याले का भाग होंगे।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या संभवतः, जलते अंगारे।
    reason: פַּחִים का प्रचलित अर्थ ‘फंदे’ है, पर आग और गन्धक के समानांतर होने के कारण कुछ विद्वान यहाँ दहकते कोयलों या अंगारों का अर्थ संभव मानते हैं।
lexical_decisions:
- source_word: פַּחִים
  choice: फंदे
  rationale: इब्रानी शब्द का सामान्य अर्थ ‘फंदे’ या ‘जाल’ है। ‘बरसाएगा’ के साथ यह दुष्टों पर अचानक आनेवाले दण्ड का सजीव रूपक बनाए रखता है।
- source_word: ר֥וּחַ זִלְעָפ֗וֹת
  choice: झुलसानेवाली आँधी
  rationale: רוח यहाँ ‘हवा’ है और זלעפות तीव्र, दाहक प्रकोप का भाव देता है; ‘आँधी’ उसकी विनाशकारी तीव्रता और ‘झुलसानेवाली’ उसकी तपन व्यक्त करता है।
- source_word: מְנָת כּוֹסָם
  choice: उनके प्याले का भाग
  rationale: 'शाब्दिक प्याले-वाले रूपक को सुरक्षित रखा गया है: प्याले में मिला हुआ भाग उस नियत दण्ड को दर्शाता है जो उन्हें पीना पड़ेगा।'
theological_decisions:
- issue: दुष्टों पर दैवी दण्ड की प्रतिमा
  choice: भविष्यकाल और दण्ड के ठोस बिंबों को यथावत रखा गया
  alternative: इसे केवल सामान्य परिणाम या रूपकात्मक दुर्भाग्य के रूप में नरम करना
  rationale: पद में कर्ता परमेश्वर है और क्रियाएँ उसके सक्रिय न्याय को चित्रित करती हैं; अनुवाद को इस तनाव को कम नहीं करना चाहिए।
- issue: ‘प्याले’ के रूपक का अर्थ
  choice: रूपक को बिना व्याख्यात्मक विस्तार के रखा गया
  alternative: ‘यही उनका नियत दण्ड होगा’
  rationale: मूल का ‘प्याला’ न्याय और आवंटित हिस्से—दोनों अर्थक्षेत्रों को साथ रखता है; केवल सारार्थ देने से यह बहुस्तरीयता खो जाती।
translation_notes:
  register: आधुनिक मानक हिन्दी का काव्यात्मक किंतु सहज रूप रखा गया है। ‘गन्धक’, ‘झुलसानेवाली आँधी’ और ‘प्याले का भाग’ गरिमामय भजन-शैली बनाए रखते हुए सामान्य पाठक के लिए बोधगम्य हैं।
