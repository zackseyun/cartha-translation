language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: יְהוָ֤ה בְּֽ/הֵ֘יכַ֤ל קָדְשׁ֗/וֹ יְהוָה֮ בַּ/שָּׁמַ֪יִם כִּ֫סְא֥/וֹ עֵינָ֥י/ו יֶחֱז֑וּ עַפְעַפָּ֥י/ו יִ֝בְחֲנ֗וּ בְּנֵ֣י אָדָֽם׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/011/004.yaml
  text: Yahweh is in his holy temple[a]; Yahweh—his throne is in heaven. His eyes see[d][c][b]; his eyelids examine the children of man.
translation:
  language: hi
  text: याहवे अपने पवित्र मन्दिर में है; याहवे—उसका सिंहासन स्वर्ग में है। उसकी आँखें देखती हैं; उसकी पलकें मनुष्यों को परखती हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय उसका प्रचलित हिन्दी लिप्यंतरण रखा गया है।
- source_word: בְּהֵיכַל קָדְשׁוֹ
  choice: अपने पवित्र मन्दिर में
  rationale: הֵיכָל का अर्थ राजमहल या मन्दिर हो सकता है; पवित्र निवास और स्वर्गीय सिंहासन के समानांतर चित्र के कारण ‘पवित्र मन्दिर’ उपयुक्त है, जबकि उसे केवल पृथ्वी का भवन नहीं माना गया।
- source_word: בַּשָּׁמַיִם כִּסְאוֹ
  choice: उसका सिंहासन स्वर्ग में है
  rationale: हिन्दी में ‘स्वर्ग’ स्वाभाविक ढंग से स्थानवाचक अर्थ व्यक्त करता और मूल की वाक्य-रचना को निकटता से रखता है।
- source_word: עֵינָיו יֶחֱזוּ
  choice: उसकी आँखें देखती हैं
  rationale: חזה के सीधे अर्थ ‘देखना’ को स्पष्ट आधुनिक हिन्दी में रखा गया है।
- source_word: עַפְעַפָּיו יִבְחֲנוּ
  choice: उसकी पलकें ... परखती हैं
  rationale: आँखों और पलकों के काव्यात्मक मानवीकरण को बनाए रखते हुए בחן का जाँचने अथवा कसौटी पर परखने का भाव व्यक्त किया गया है।
- source_word: בְּנֵי אָדָם
  choice: मनुष्यों को
  rationale: शाब्दिक मुहावरा ‘आदम की सन्तान’ समस्त मानवजाति को सूचित करता है; ‘मनुष्यों’ से वही सामूहिक अर्थ सहज और लिंग-समावेशी आधुनिक हिन्दी में आता है।
theological_decisions:
- issue: याहवे के पवित्र निवास और स्वर्गीय सिंहासन का सम्बन्ध
  choice: 'दोनों कथनों को साथ-साथ रखा गया है: वह अपने पवित्र मन्दिर में है और उसका सिंहासन स्वर्ग में है।'
  alternative: ‘पवित्र मन्दिर’ को केवल पृथ्वी के मन्दिर या केवल स्वर्ग का पर्याय मानना।
  rationale: इब्रानी पाठ दोनों चित्र प्रस्तुत करता है और उनका सम्बन्ध स्पष्ट करके तनाव को समाप्त नहीं करता; अनुवाद भी उसी खुलेपन को बनाए रखता है।
- issue: בְּנֵי אָדָם का सामूहिक अर्थ
  choice: मनुष्यों को
  alternative: आदम की सन्तान को
  rationale: यह पदबंध समस्त मानव समुदाय को दर्शाता है। सहज हिन्दी में सामूहिक अर्थ स्पष्ट रखते हुए अनावश्यक रूप से केवल पुरुषों का संकेत नहीं दिया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक है। दो बार आए दिव्य नाम तथा आँखों और पलकों की समानांतर छवि सुरक्षित रखी गई है; विराम-चिह्न मूल की अलग किन्तु सम्बद्ध घोषणाओं को दर्शाते हैं।
