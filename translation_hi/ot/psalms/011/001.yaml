base_translation:
  language: en
  yaml_path: translation/ot/psalms/011/001.yaml
  text: For the choirmaster. Of David. In the LORD I have taken refuge; how can you say to me, “Flee to your mountain like a bird”?
translation:
  language: hi
  text: 'संगीत-निर्देशक के लिए। दाऊद का भजन।


    मैंने यहोवा[a] में शरण ली है।


    तुम मुझसे कैसे कहते हो,


    “पक्षी की तरह अपने पहाड़ की ओर भाग जाओ”?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ इब्रानी में परमेश्वर का व्यक्तिगत नाम יהוה (YHWH) है, जिसका उच्चारण प्रायः “याहवे” माना जाता है; कई अनुवाद इसे “प्रभु” लिखते हैं।
    reason: पाठक को दिव्य नाम के स्रोत-रूप और प्रमुख अनुवाद-परंपराओं की जानकारी देना।
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: संगीत-निर्देशक के लिए
  rationale: भजन के शीर्षक में प्रयुक्त इस पद का आशय संगीत-प्रस्तुति का नेतृत्व करने वाले व्यक्ति से है; यह सहज हिंदी में उसकी भूमिका स्पष्ट करता है।
- source_word: חָסִיתִי
  choice: मैंने ... शरण ली है
  rationale: पूर्ण क्रिया आश्रय ग्रहण करने की ऐसी क्रिया बताती है जिसका वर्तमान में प्रभाव बना हुआ है।
- source_word: לְנַפְשִׁי
  choice: मुझसे
  rationale: यहाँ ‘मेरे प्राण से’ व्यक्ति को संबोधित करने का इब्रानी मुहावरा है; आधुनिक हिंदी में ‘मुझसे’ स्वाभाविक अर्थ देता है।
- source_word: נודו
  choice: उड़ जाओ
  rationale: मसोरेटिक पाठ में बहुवचन रूप है, जबकि संबोधन और पक्षी की उपमा अर्थगत कठिनाई उत्पन्न करते हैं; हिंदी में उद्धृत सलाह का स्वाभाविक आशय रखा गया है।
- source_word: הַרְכֶם
  choice: अपने पहाड़ पर
  rationale: व्यंजन-पाठ और मसोरेटिक स्वरांकन के अनुसार ‘तुम्हारे पहाड़’ है; हिंदी में संबोधित जन के दृष्टिकोण से ‘अपने पहाड़’ स्वाभाविक है।
theological_decisions:
- issue: दिव्य नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: व्यक्तिगत दिव्य नाम को सामान्य उपाधि में बदलने के बजाय हिंदी में व्यापक रूप से पहचाना जाने वाला नाम-रूप रखा गया है; पादटिप्पणी वैकल्पिक उच्चारण और परंपरागत प्रस्तुति बताती है।
- issue: לְנַפְשִׁי का अर्थ
  choice: मुझसे
  alternative: मेरे प्राण से
  rationale: इस प्रसंग में ‘प्राण’ समूचे व्यक्ति का द्योतक है; ‘मुझसे’ वही अर्थ बिना अस्वाभाविक शाब्दिकता के देता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल हिंदी। शीर्षक को संक्षिप्त रखा गया है और काव्य-पंक्तियों में आश्रय की घोषणा तथा प्रश्न का तनाव सुरक्षित रखा गया है।
