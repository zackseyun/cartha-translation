  yaml_path: translation/ot/psalms/011/003.yaml
  text: If the foundations are destroyed[a], what can the righteous do?
translation:
  language: hi
  text: यदि नींवें ढा दी जाएँ[a], तो धर्मी क्या कर सकता है?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्योंकि नींवें ढाई जा रही हैं; धर्मी ने क्या किया है?” अंतिम क्रिया का इब्रानी रूप अधिक औपचारिक रूप से भूतकाल में भी अनूदित किया जा सकता है, यद्यपि संदर्भ में सामान्यतः इसका भाव “धर्मी क्या कर सकता है?” समझा जाता है।
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: यदि
  rationale: काव्य-संदर्भ में यह आगे आने वाले अलंकारिक प्रश्न के लिए स्वाभाविक शर्त प्रस्तुत करता है; ‘क्योंकि’ भी व्याकरणतः संभव है।
- source_word: הַשָּׁתוֹת
  choice: नींवें
  rationale: मूल ठोस रूपक को बनाए रखता है और उसे सामाजिक, नैतिक या न्यायिक व्यवस्था के रूप में सीमित नहीं करता।
- source_word: יֵהָרֵסוּן
  choice: ढा दी जाएँ
  rationale: निफ़अल रूप के कर्मवाच्य भाव और किसी आधारभूत संरचना को गिरा देने की छवि को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: צַדִּיק
  choice: धर्मी
  rationale: एकवचन विशेषण के प्रतिनिधिक प्रयोग को संक्षिप्त और पारंपरिक, किंतु आधुनिक हिन्दी में बोधगम्य ढंग से रखता है।
- source_word: מַה
  choice: क्या
  rationale: अलंकारिक प्रश्न को सीधे व्यक्त करता है।
- source_word: פָּעָל
  choice: कर सकता है
  rationale: यद्यपि रूप औपचारिक रूप से पूर्णकालिक है, संदर्भ में व्यावहारिक सामर्थ्य का अलंकारिक प्रश्न सर्वाधिक स्वाभाविक है; वैकल्पिक भूतकालीन अर्थ पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: ‘नींवें’ रूपक का दायरा
  choice: रूपक को बिना व्याख्यात्मक विस्तार के बनाए रखना
  alternative: इसे समाज, न्याय, नैतिक व्यवस्था या वाचा की संरचनाओं की नींव के रूप में स्पष्ट करना
  rationale: इब्रानी छवि व्यापक है; किसी एक आशय को चुनना पाठ की वास्तविक व्याख्यात्मक खुलावट को अनावश्यक रूप से सीमित करेगा।
- issue: अंतिम क्रिया का काल और आशय
  choice: ‘धर्मी क्या कर सकता है?’
  alternative: ‘धर्मी ने क्या किया है?’
  rationale: मुख्य पाठ में प्रसंगानुकूल सामर्थ्य-संबंधी प्रश्न रखा गया है, पर इब्रानी पूर्णकालिक रूप से संभव भूतकालीन पाठ को पादटिप्पणी में स्पष्ट किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सरल, गरिमापूर्ण और काव्यात्मक है। ‘नींवें’ मूल रूपक को सुरक्षित रखता है, जबकि ‘ढा दी जाएँ’ कर्मवाच्य छवि को स्पष्ट करता है।
