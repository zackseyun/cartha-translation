base_translation:
  language: en
  yaml_path: translation/ot/psalms/011/000.yaml
  text: For the choirmaster[a]. Of David. In Yahweh I take refuge; how can you say to my soul, “Flee to your mountain[b], bird” ?
translation:
  language: hi
  text: 'प्रधान संगीतकार के लिए। दाऊद का।


    याहवे में मैंने शरण ली है।


    तुम मेरे प्राण से यह कैसे कह सकते हो,


    “अपने पहाड़ की ओर भाग जा, हे पक्षी!”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी वाक्यांश कठिन है। इसका अनुवाद “पक्षी की तरह अपने पहाड़ की ओर भाग जा” भी हो सकता है। इब्रानी क्रिया का रूप बहुवचन प्रतीत होता है, जबकि “पक्षी” एकवचन है।
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: प्रधान संगीतकार के लिए
  rationale: भजन-संग्रह के शीर्षकों में प्रयुक्त इस पद का सम्भावित संगीत-संबंधी अर्थ व्यक्त करता है, जबकि इसकी भूमिका को आवश्यकता से अधिक निश्चित नहीं करता।
- source_word: לְדָוִד
  choice: दाऊद का भजन
  rationale: स्वाभाविक हिन्दी शीर्षक के रूप में प्रस्तुत किया गया; इसका अर्थ दाऊद द्वारा रचित, दाऊद से संबंधित, या दाऊद को समर्पित हो सकता है।
- source_word: בַּיהוָה
  choice: याहवे में
  rationale: मूल पाठ में आए परमेश्वर के विशिष्ट नाम יהוה को उपाधि से बदलने के बजाय लिप्यंतरित किया गया।
- source_word: חָסִיתִי
  choice: मैंने शरण ली है
  rationale: पूर्ण क्रिया के आश्रय ग्रहण करने और वर्तमान भरोसे से जुड़े भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לְנַפְשִׁי
  choice: मुझसे
  rationale: यहाँ נֶפֶשׁ पूरे व्यक्ति के लिए प्रयुक्त है; शाब्दिक 'मेरी आत्मा से' की अपेक्षा आधुनिक हिन्दी में 'मुझसे' वही अर्थ स्वाभाविक रूप से देता है।
- source_word: נוּדוּ הַרְכֶם צִפּוֹר
  choice: पक्षी की तरह अपने पहाड़ पर उड़ जा
  rationale: व्यंजन-पाठ और प्रचलित स्वरांकन के कठिन वाक्यांश का सम्भावित भाव देता है; संख्या और वाक्य-विन्यास की कठिनाई को पादटिप्पणी में सुरक्षित रखा गया है।
theological_decisions:
- issue: יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: यह व्यक्तिगत ईश्वरीय नाम को स्पष्ट रखता है और उसे किसी संप्रदाय-विशेष की पदावली से नहीं बदलता।
- issue: לְנַפְשִׁי में व्यक्ति और आत्मा का संबंध
  choice: मुझसे
  alternative: मेरी आत्मा से / मेरे प्राण से
  rationale: संदर्भ में यह पूरे व्यक्ति के लिए सामी मुहावरा है; 'मुझसे' हिन्दी में अर्थ को बिना अनावश्यक मानव-विज्ञान संबंधी निष्कर्ष के व्यक्त करता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और पाठयोग्य हिन्दी अपनाई गई है। काव्य-पंक्तियाँ संक्षिप्त रखी गई हैं। कठिन अंतिम इब्रानी वाक्यांश का मुख्य पाठ में स्वाभाविक सम्भावित अर्थ दिया गया है और वास्तविक अस्पष्टता पादटिप्पणी में सुरक्षित है।
