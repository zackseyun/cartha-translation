  text: क्योंकि यहोवा धर्मी है; वह धर्म के कार्यों से प्रेम करता है; सच्चरित्र लोग उसका मुख देखेंगे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अंतिम उपवाक्य का अनुवाद यह भी हो सकता है, “उसका मुख सच्चरित्र लोगों को देखता है।” इब्रानी वाक्य-विन्यास को एक से अधिक प्रकार से समझा गया है। “उसका मुख” उसकी उपस्थिति या कृपा का भाव भी प्रकट कर सकता है।
    reason: alternative_reading_and_lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पद पिछले कथन का आधार बताता है; आधुनिक हिन्दी में ‘क्योंकि’ उसके व्याख्यात्मक संबंध को स्वाभाविक रूप से व्यक्त करता है।
