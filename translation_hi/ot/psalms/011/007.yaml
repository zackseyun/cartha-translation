- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी बाइबल परंपरा में परमेश्वर के निज नाम का सुपरिचित और गरिमापूर्ण रूप।
- source_word: צְדָקוֹת
  choice: धर्म के कामों
  rationale: बहुवचन संज्ञा यहाँ अमूर्त गुण से अधिक ठोस धर्ममय कार्यों को सूचित करती है; यह रूप हिन्दी में स्वाभाविक है और צַדִּיק से संबंध भी बनाए रखता है।
- source_word: אָהֵב
  choice: प्रेम करता है
  rationale: सामान्य वर्तमान काल यहोवा के स्थायी स्वभाव को व्यक्त करता है और क्रिया का सीधा अर्थ सुरक्षित रखता है।
- source_word: יָשָׁר
  choice: सीधे लोग
  rationale: विशेषण यहाँ संज्ञा के रूप में नैतिक रूप से निष्कपट लोगों के लिए प्रयुक्त है; आगे की बहुवचन क्रिया सामूहिक बहुवचन अर्थ का समर्थन करती है।
- source_word: יֶחֱזוּ
  choice: देखेंगे
  rationale: क्रिया देखने या निहारने का अर्थ रखती है; ‘देखेंगे’ आधुनिक सामान्य हिन्दी में स्पष्ट है और प्रसंग में पर्याप्त गरिमा रखता है।
- source_word: פָנֵימוֹ
  choice: उसका मुख
  rationale: मूल की ठोस अभिव्यक्ति ‘उसका मुख’ सुरक्षित रखी गई है; इसमें उसकी उपस्थिति या कृपा का भाव भी निहित हो सकता है।
theological_decisions:
- issue: अंतिम उपवाक्य का कर्ता और वाक्य-विन्यास
  choice: सीधे लोग उसका मुख देखेंगे
  alternative: उसका मुख सीधे लोगों को देखता है
  rationale: बहुवचन क्रिया יֶחֱזוּ और परमेश्वर का मुख देखने की बाइबिलीय अभिव्यक्ति के आधार पर सीधे लोग कर्ता और ‘उसका मुख’ कर्म समझना अधिक स्वाभाविक है। फिर भी इब्रानी वाक्य-विन्यास की वैकल्पिक व्याख्या संभव है, इसलिए उसे पादटिप्पणी में सुरक्षित रखा गया है।
- issue: ‘मुख’ का आशय
  choice: शाब्दिक रूप ‘उसका मुख’
  alternative: उसकी उपस्थिति या कृपा
  rationale: मूल रूपक को मुख्य पाठ में बनाए रखने से उसकी सघनता और धर्मवैचारिक तनाव सुरक्षित रहता है; संभावित निहितार्थ को अनुवाद में स्पष्ट करके सीमित नहीं किया गया।
