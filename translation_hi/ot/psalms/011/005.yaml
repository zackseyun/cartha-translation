source:
  edition: WLC
  text: יְהוָה֮ צַדִּ֪יק יִ֫בְחָ֥ן וְ֭/רָשָׁע וְ/אֹהֵ֣ב חָמָ֑ס שָֽׂנְאָ֥ה נַפְשֽׁ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/011/005.yaml
  text: Yahweh tests the righteous[a], but his soul hates the wicked and the one who loves violence.
translation:
  language: hi
  text: याहवे धर्मी को परखता है, पर उसका प्राण दुष्ट और हिंसा से प्रेम करने वाले से घृणा करता है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक सहज रूप में: “याहवे धर्मी को परखता है, पर वह दुष्ट और हिंसा से प्रेम करने वाले से घृणा करता है।” इब्रानी में अधिक शाब्दिक रूप से “उसका प्राण घृणा करता है” है, जो गहरी व्यक्तिगत घृणा व्यक्त करने वाला मुहावरा है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: צַדִּיק
  choice: धर्मी
  rationale: यह विशेषण यहाँ संज्ञा के रूप में प्रयुक्त है और प्रतिनिधिक एकवचन में धर्मी व्यक्ति को दर्शाता है।
- source_word: יִבְחָן
  choice: परखता है
  rationale: בחן का मूल्यांकनात्मक अर्थ जाँचने या कसौटी पर परखने का है; ‘परखता है’ आधुनिक हिन्दी में स्वाभाविक और अर्थ-सटीक है।
- source_word: וְרָשָׁע
  choice: दुष्ट
  rationale: संज्ञात्मक विशेषण के नैतिक वर्ग और प्रतिनिधिक एकवचन को संक्षेप में बनाए रखता है।
- source_word: וְאֹהֵב חָמָס
  choice: हिंसा से प्रेम करनेवाले
  rationale: कृदन्तीय वाक्यांश किसी ऐसे व्यक्ति का चरित्र बताता है जो हिंसा से लगातार प्रेम रखता है।
- source_word: חָמָס
  choice: हिंसा
  rationale: यहाँ शब्द हिंसा अथवा हिंसक अन्याय को सूचित करता है; प्रसंग में ‘हिंसा’ सीधा और उपयुक्त है।
- source_word: שָׂנְאָה נַפְשׁוֹ
  choice: उसका प्राण घृणा करता है
  rationale: इब्रानी की बलात्मक अभिव्यक्ति ‘उसका נפש घृणा करता है’ को बनाए रखता है; ‘प्राण’ यहाँ याहवे के अंतरतम व्यक्तित्व और गहरी विरक्ति को व्यक्त करता है।
theological_decisions:
- issue: अंतिम खंड में ‘उसका प्राण’ का संदर्भ और बल
  choice: ‘उसका प्राण’ याहवे को संदर्भित करता है और उसकी गहरी व्यक्तिगत घृणा व्यक्त करता है।
  alternative: इसे सहज हिन्दी में केवल ‘वह घृणा करता है’ कहा जा सकता है।
  rationale: मूल पाठ में נפש का स्पष्ट प्रयोग है। उसे बनाए रखने से मानवरूपी भाषा और उसका धर्मवैचारिक तनाव सुरक्षित रहता है, बिना परमेश्वर के भावों के स्वरूप पर अतिरिक्त व्याख्या थोपे।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य-पाठक-सुलभ रूप। ‘याहवे’ में व्यक्तिगत नाम सुरक्षित रखा गया है और ‘उसका प्राण घृणा करता है’ द्वारा मूल इब्रानी की असामान्य किंतु अर्थपूर्ण बलात्मक अभिव्यक्ति बनाए रखी गई है।
