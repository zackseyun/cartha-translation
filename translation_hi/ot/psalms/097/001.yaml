lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय देवनागरी लिप्यंतरण में रखा गया है।
- source_word: מָלָךְ
  choice: राजा है
  rationale: इब्रानी पूर्ण रूप राजत्व की अवस्था या राजकीय शासन की उद्घोषणा व्यक्त कर सकता है। हिंदी में ‘राजा है’ वर्तमान राजत्व को स्वाभाविक ढंग से व्यक्त करता है और ‘राजा बन गया’ वाली आरंभिक अर्थछाया को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: תָּגֵל
  choice: आनन्दित हो
  rationale: यहाँ अपूर्ण क्रिया को काव्यात्मक इच्छार्थक/आह्वानात्मक रूप में समझा गया है।
- source_word: הָאָרֶץ
  choice: पृथ्वी
  rationale: आगे के समुद्री प्रदेशों के समानांतर यह पूरे संसार के व्यापक अर्थ के अनुकूल है, न कि केवल किसी स्थानीय देश के।
- source_word: יִשְׂמְחוּ
  choice: हर्षित हों
  rationale: समानांतर इच्छार्थक बल बनाए रखते हुए हिंदी में स्वाभाविक काव्यात्मक विविधता दी गई है।
- source_word: אִיִּים
  choice: द्वीप और समुद्र-तटीय प्रदेश
  rationale: यह शब्द द्वीपों के साथ दूरस्थ समुद्री तटवर्ती भूभागों को भी सूचित कर सकता है; संयुक्त पद मूल की अर्थ-व्याप्ति को मुख्य पाठ में स्पष्ट रखता है।
- source_word: רַבִּים
  choice: बहुत-से
  rationale: यह संज्ञा की बहुलता को सरल और स्वाभाविक आधुनिक हिंदी में व्यक्त करता है।
theological_decisions:
- issue: याहवे के राजत्व की कालगत अर्थछाया
  choice: 'वर्तमान राजत्व की उद्घोषणा: ‘राजा है’'
  alternative: ‘राजा बन गया है’ अथवा ‘राज्य करता है’
  rationale: מָלָךְ राजगद्दी ग्रहण करने की घटना या स्थापित राजत्व—दोनों अर्थछायाएँ रख सकता है। ‘राजा है’ राजत्व को दृढ़ता से व्यक्त करते हुए आरंभिक अर्थ को जबरन निश्चित नहीं करता।
- issue: राजत्व की भौगोलिक व्याप्ति
  choice: सार्वभौमिक—पृथ्वी और अनेक समुद्री क्षेत्र
  alternative: केवल इस्राएल की भूमि से संबंधित स्थानीय उद्घोषणा
  rationale: ‘पृथ्वी’ और ‘बहुत-से द्वीप/समुद्र-तटीय प्रदेश’ का समानांतर प्रयोग विश्वव्यापी क्षितिज की ओर संकेत करता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। समानांतर काव्यात्मक आह्वान के लिए ‘आनन्दित हो’ और ‘हर्षित हों’ प्रयुक्त हैं। दिव्य नाम ‘याहवे’ के रूप में सुरक्षित है।
